# The Grand Tour: the museum's spine, walked in order from before the Hijra to today.
#
# This file is the Tour's manifest and nothing else: an ordered list of record ids. Everything a visitor sees at a stop
# (name, date, wing, narrative, the "why this stop matters" line, the doors onward) is read from the record itself and
# from the graph at build time. Nothing about a stop is asserted here.
#
# Rules a stop must meet (checked by scripts/fable/o02_tour_coverage.py, never by eye):
#   - it is a cornerstone (importance: 1);
#   - it has Arabic and English prose;
#   - it stands in river order: dated stops never run backwards, a stop dated only by its period stands inside that
#     period, a stop with no date and no period may stand anywhere and is labelled as crossing the centuries.
# Together the stops must cover all nine wings and every Hijri century from the 1st to the 14th.
#
# Keep one `- id: class/slug` line per stop. The oracles read this file without a YAML library.
stops:
  - id: building/kaaba
  - id: event/first-revelation
  - id: person/khadija
  - id: event/hijra
  - id: event/battle-of-badr
