# Halls for the eight wings beyond Objects in the 3D tour (/{lang}/3d/). Each hall
# has six stops; `record` is the graph entity whose page the label links to (and
# whose date it shows), `sources` are that record's own sources, and `art`, where
# given, is an existing site illustration (site/src/data/architecture-art.json)
# framed on the wall. Stops without `art` (people, ideas, books, practices) show
# their name on a plaque under a geometric panel: no portraits or figures.
# The Objects hall keeps its exhibits in tour/exhibits.yaml.
status:
  review: published
provenance:
  generated_by: Devin
  model: unknown
  run: 3d-tour-step3
  source: "data records named in each stop's `record`; labels and one-line descriptions are written from those records and cite the same sources"

halls:
  - wing: time
    stops:
      - id: hijra
        record: event/hijra
        sources: [source/ibn-ishaq-guillaume, source/watt-1956-medina, source/mubarakpuri-raheeq, source/ibn-hisham-sira, source/sahih-al-bukhari, source/zad-al-maad, source/muruj-al-dhahab, source/assabile-omar-abdelkafy]
        label: { ar: "الهجرة النبوية", en: "The Hijra", ur: "ہجرت نبوی" }
        desc:
          ar: "انتقال النبي محمد وأصحابه من مكة إلى المدينة سنة 622م، ومنه يبدأ التقويم الهجري."
          en: "The migration of the Prophet Muhammad and his followers from Mecca to Medina in 622 CE, from which the Islamic calendar is counted."
          ur: "622ء میں نبی محمد اور ان کے ساتھیوں کی مکہ سے مدینہ ہجرت، جس سے ہجری تقویم شروع ہوتی ہے۔"
      - id: hudaybiyya
        record: event/treaty-of-hudaybiyya
        sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari, source/ibn-hisham-sira, source/zad-al-maad, source/sallabi-ali-vol1, source/assabile-omar-abdelkafy]
        label: { ar: "صلح الحديبية", en: "The Treaty of Hudaybiyya", ur: "صلح حدیبیہ" }
        desc:
          ar: "في ذي القعدة سنة 6هـ خرج النبي في نحو ألف وأربعمائة معتمرًا، فلما صدّته قريش انتهت المفاوضات بصلح مدته عشر سنين."
          en: "In Dhu al-Qa'da 6 AH the Prophet set out for Umrah with about 1,400 companions; when Quraysh barred the way, talks ended in a ten-year peace."
          ur: "ذوالقعدہ 6ھ میں نبی تقریباً چودہ سو ساتھیوں کے ساتھ عمرے کو نکلے؛ قریش نے روکا تو مذاکرات دس سالہ صلح پر ختم ہوئے۔"
      - id: mecca
        record: event/conquest-of-mecca
        sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari, source/sahih-muslim, source/zad-al-maad, source/ibn-hisham-saqqa, source/sallabi-ali-vol1]
        label: { ar: "فتح مكة", en: "The Conquest of Mecca", ur: "فتح مکہ" }
        desc:
          ar: "في رمضان سنة 8هـ، بعد نقض صلح الحديبية، دخل النبي مكة في عشرة آلاف خافضًا رأسه تواضعًا."
          en: "In Ramadan 8 AH, after the Hudaybiyya peace was broken, the Prophet entered Mecca with ten thousand, his head bowed in humility."
          ur: "رمضان 8ھ میں صلح حدیبیہ ٹوٹنے کے بعد نبی دس ہزار کے لشکر کے ساتھ عاجزی سے سر جھکائے مکہ میں داخل ہوئے۔"
      - id: farewell
        record: event/farewell-pilgrimage
        sources: [source/ibn-ishaq-guillaume, source/watt-1956-medina, source/lings-1983, source/mubarakpuri-raheeq, source/sahih-muslim, source/sahih-al-bukhari, source/zad-al-maad, source/ibn-hisham-saqqa, source/sallabi-ali-vol1]
        label: { ar: "حجة الوداع", en: "The Farewell Pilgrimage", ur: "حجۃ الوداع" }
        desc:
          ar: "الحجة الوحيدة التي قادها النبي، وفيها ألقى الخطبة المعروفة بخطبة الوداع."
          en: "The only pilgrimage the Prophet led, in which he gave the sermon known as the Farewell Sermon."
          ur: "وہ واحد حج جس کی قیادت نبی نے کی، اور اسی میں خطبۂ حجۃ الوداع دیا۔"
      - id: baghdad
        record: event/founding-of-baghdad
        sources: [source/futuh-buldan-maarif-1407, source/tarikh-khulafa-minhaj-1434]
        label: { ar: "تأسيس بغداد", en: "The founding of Baghdad", ur: "بغداد کی بنیاد" }
        desc:
          ar: "ابتدأ الخليفة المنصور بناء مدينة السلام بغداد سنة 145هـ، كما يروي البلاذري."
          en: "The caliph al-Mansur began building Madinat al-Salam, Baghdad, in 145 AH, as al-Baladhuri records."
          ur: "بلاذری کے مطابق خلیفہ منصور نے 145ھ میں مدینۃ السلام بغداد کی تعمیر شروع کی۔"
      - id: constantinople
        record: event/conquest-constantinople-857
        sources: [source/shadharat-dhahab, source/dawlat-uthmaniyya-salabi, source/stoddard-arslan-hadir-1923]
        label: { ar: "فتح القسطنطينية", en: "The conquest of Constantinople", ur: "فتح قسطنطنیہ" }
        desc:
          ar: "فتحها السلطان محمد الفاتح سنة 857هـ (1453م) بعد حصار دام خمسين يومًا، وقد نُقلت سفنه برًّا إلى القرن الذهبي."
          en: "Sultan Mehmed II took the city in 857 AH (1453 CE) after a fifty-day siege, having moved his ships overland into the Golden Horn."
          ur: "سلطان محمد فاتح نے پچاس دن کے محاصرے کے بعد 857ھ (1453ء) میں یہ شہر فتح کیا؛ ان کے جہاز خشکی کے راستے شاخ زریں میں اتارے گئے۔"
  - wing: place
    stops:
      - id: mecca
        record: place/mecca
        sources: [source/bakr-umayyad-state-1134715]
        art: masjid-al-haram-kaaba
        label: { ar: "مكة المكرمة", en: "Mecca", ur: "مکہ مکرمہ" }
        desc:
          ar: "مدينة في الحجاز، مسقط رأس النبي محمد وموضع الكعبة ومقصد الحج كل عام."
          en: "City in the Hejaz, birthplace of the Prophet Muhammad, site of the Kaaba and goal of the yearly Hajj."
          ur: "حجاز کا شہر، نبی محمد کی جائے پیدائش، کعبہ کا مقام اور سالانہ حج کی منزل۔"
      - id: medina
        record: place/medina
        sources: [source/bakr-umayyad-state-1134715, source/samhudi-wafa-al-wafa, source/sahih-al-bukhari]
        art: masjid-al-nabawi
        label: { ar: "المدينة المنورة", en: "Medina", ur: "مدینہ منورہ" }
        desc:
          ar: "مدينة في الحجاز هاجر إليها النبي سنة 622م، وفيها المسجد النبوي وأول مجتمع إسلامي."
          en: "City in the Hejaz to which the Prophet migrated in 622 CE, home of the Prophet's Mosque and the first Muslim community."
          ur: "حجاز کا شہر جہاں نبی نے 622ء میں ہجرت کی؛ یہاں مسجد نبوی اور پہلا مسلم معاشرہ ہے۔"
      - id: jerusalem
        record: place/jerusalem
        sources: [source/farghani-elements-astronomy, source/geonames-gazetteer, source/ahsan-al-taqasim]
        art: dome-of-the-rock
        label: { ar: "القدس", en: "Jerusalem", ur: "بیت المقدس" }
        desc:
          ar: "مدينة مقدسة عند اليهود والمسيحيين والمسلمين، أولى القبلتين، وسُلّمت للمسلمين سنة 637م."
          en: "City sacred to Jews, Christians and Muslims, the first qibla of Islam, surrendered to the Muslims in 637 CE."
          ur: "یہودیوں، مسیحیوں اور مسلمانوں کے ہاں مقدس شہر، مسلمانوں کا قبلۂ اول، جو 637ء میں مسلمانوں کے سپرد ہوا۔"
      - id: damascus
        record: place/damascus
        sources: [source/farghani-elements-astronomy, source/geonames-gazetteer, source/muruj-al-dhahab]
        art: umayyad-mosque-damascus
        label: { ar: "دمشق", en: "Damascus", ur: "دمشق" }
        desc:
          ar: "عاصمة الخلافة الأموية (661–750م)، وفيها الجامع الأموي."
          en: "Capital of the Umayyad caliphate (661–750 CE) and home of the Umayyad Mosque."
          ur: "اموی خلافت (661–750ء) کا دار الحکومت اور جامع اموی کا شہر۔"
      - id: cairo
        record: place/cairo
        sources: [source/khitat-maqrizi-1998, source/geonames-gazetteer, source/tarikh-khulafa-minhaj-1434, source/ahsan-al-taqasim, source/farghani-elements-astronomy]
        art: al-azhar-mosque
        label: { ar: "القاهرة", en: "Cairo", ur: "قاہرہ" }
        desc:
          ar: "أسسها الفاطميون سنة 969م بجوار الفسطاط، وفيها الجامع الأزهر."
          en: "Founded by the Fatimids in 969 CE beside Fustat, and home of al-Azhar."
          ur: "فاطمیوں نے 969ء میں فسطاط کے پہلو میں اسے بسایا؛ یہیں جامع ازہر ہے۔"
      - id: cordoba
        record: place/cordoba
        sources: [source/nafh-tib-maqqari, source/geonames-gazetteer, source/futuh-buldan-maarif-1407]
        art: great-mosque-of-cordoba
        label: { ar: "قرطبة", en: "Cordoba", ur: "قرطبہ" }
        desc:
          ar: "عاصمة الإمارة ثم الخلافة الأموية في الأندلس، وفيها المسجد الجامع."
          en: "Capital of the Umayyad emirate, then caliphate, of al-Andalus, with its Great Mosque."
          ur: "اندلس کی اموی امارت اور پھر خلافت کا دار الحکومت، جہاں جامع مسجد قرطبہ ہے۔"
  - wing: people
    stops:
      - id: malik
        record: person/malik-ibn-anas
        sources: [source/fihrist-ibn-al-nadim, source/muwatta-maruf-1997, source/siyar-alam-nubala-ideas-house, source/umayyad-birth-to-fall-2006, source/assabile-omar-abdelkafy]
        label: { ar: "مالك بن أنس", en: "Malik ibn Anas", ur: "مالک بن انس" }
        desc:
          ar: "إمام دار الهجرة وصاحب الموطأ، علّم بالمدينة حتى وفاته سنة 179هـ، وإليه يُنسب المذهب المالكي."
          en: "Imam of Medina and author of the Muwatta, who taught there until his death in 179 AH; the Maliki school bears his name."
          ur: "امام دار الہجرہ اور موطأ کے مصنف، جو 179ھ میں وفات تک مدینہ میں پڑھاتے رہے؛ مالکی مذہب انہی سے منسوب ہے۔"
      - id: ibn-sina
        record: person/ibn-sina
        sources: [source/gohlman-1974, source/gutas-2014, source/shadharat-dhahab, source/min-al-falsafa-al-yunaniyya-azhar, source/farghani-elements-astronomy]
        label: { ar: "ابن سينا", en: "Ibn Sina (Avicenna)", ur: "ابن سینا" }
        desc:
          ar: "عالم موسوعي (نحو 980–1037م) أثّر كتاباه القانون في الطب والشفاء في الطب والفلسفة في العالم الإسلامي وأوروبا قرونًا."
          en: "Polymath (c. 980–1037) whose Canon of Medicine and Book of Healing shaped medicine and philosophy in the Islamic world and Europe for centuries."
          ur: "ہمہ جہت عالم (تقریباً 980–1037ء) جن کی القانون فی الطب اور الشفاء نے صدیوں تک عالم اسلام اور یورپ میں طب و فلسفہ کو متاثر کیا۔"
      - id: khwarizmi
        record: person/al-khwarizmi
        sources: [source/muruj-al-dhahab, source/mawsuat-a3lam-ulama-adaba]
        label: { ar: "الخوارزمي", en: "al-Khwarizmi", ur: "خوارزمی" }
        desc:
          ar: "محمد بن موسى الخوارزمي، عدّه المسعودي فيمن عُني بعلوم الهيئة بعد ظهور الإسلام."
          en: "Muhammad ibn Musa al-Khwarizmi, counted by al-Mas'udi among the scholars of astronomy after the rise of Islam."
          ur: "محمد بن موسیٰ خوارزمی، جنہیں مسعودی نے ظہور اسلام کے بعد علم ہیئت کے علما میں شمار کیا۔"
      - id: ibn-khaldun
        record: person/ibn-khaldun
        sources: [source/muqaddima-ibn-khaldun, source/tarikh-ibn-khaldun-ibar, source/mawsuat-a3lam-ulama-adaba, source/al-mutun-al-ilmiyya-azhar]
        label: { ar: "ابن خلدون", en: "Ibn Khaldun", ur: "ابن خلدون" }
        desc:
          ar: "عبد الرحمن بن محمد بن خلدون الحضرمي، مؤلف المقدمة وكتاب العبر، توفي سنة 808هـ."
          en: "Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami, author of the Muqaddima and the Kitab al-'Ibar, who died in 808 AH."
          ur: "عبد الرحمن بن محمد بن خلدون حضرمی، مقدمہ اور کتاب العبر کے مصنف، جن کی وفات 808ھ میں ہوئی۔"
      - id: fatima-al-fihri
        record: person/fatima-al-fihri
        sources: [source/wikidata]
        label: { ar: "فاطمة الفهري", en: "Fatima al-Fihri", ur: "فاطمہ الفہری" }
        desc:
          ar: "وقفت مالها على بناء جامع القرويين بفاس نحو سنة 859م."
          en: "She gave her wealth to build the Qarawiyyin mosque in Fez around 859 CE."
          ur: "انہوں نے تقریباً 859ء میں اپنا مال فاس کی جامع القرویین کی تعمیر کے لیے وقف کیا۔"
      - id: sinan
        record: person/mimar-sinan
        sources: [source/goodwin-ottoman-architecture-1971]
        label: { ar: "المعمار سنان", en: "Mimar Sinan", ur: "معمار سنان" }
        desc:
          ar: "كبير معماري الدولة العثمانية في القرن العاشر الهجري، ومن أبرز أعماله جامع السليمية في أدرنة."
          en: "Chief architect of the Ottoman Empire in the sixteenth century; among his works is the Selimiye Mosque in Edirne."
          ur: "سولہویں صدی عیسوی میں سلطنت عثمانیہ کے معمار اعلیٰ؛ ادرنہ کی سلیمیہ مسجد ان کے نمایاں کاموں میں ہے۔"
  - wing: ideas
    stops:
      - id: tawhid
        record: concept/tawhid
        sources: [source/aqida-tahawiyya, source/lumat-al-itiqad, source/aqida-wasitiyya, source/maqalat-islamiyyin, source/sallabi-ali-vol1, source/assabile-omar-abdelkafy]
        label: { ar: "التوحيد", en: "Tawhid (the oneness of God)", ur: "توحید" }
        desc:
          ar: "إفراد الله بالألوهية ونفي الشريك والمثيل عنه، وبه يبدأ الطحاوي بيان العقيدة."
          en: "Affirming that God is one, without partner or likeness; al-Tahawi opens his statement of the creed with it."
          ur: "اللہ کو الوہیت میں یکتا ماننا اور اس سے شریک و مثل کی نفی؛ طحاوی اپنے بیان عقیدہ کا آغاز اسی سے کرتے ہیں۔"
      - id: shahada
        record: concept/shahada
        sources: [source/sahih-al-bukhari, source/sahih-ibn-khuzayma, source/tanzil-quran, source/ibn-rajab-jami-ulum-hikam, source/assabile-omar-abdelkafy]
        label: { ar: "الشهادتان", en: "The shahada", ur: "شہادتین" }
        desc:
          ar: "شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وهي أول ما ذُكر في حديث «بُني الإسلام على خمس»."
          en: "The testimony that there is no god but God and that Muhammad is God's messenger, named first in the hadith 'Islam is built on five'."
          ur: "یہ گواہی کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں؛ حدیث «اسلام کی بنیاد پانچ چیزوں پر ہے» میں اس کا ذکر سب سے پہلے ہے۔"
      - id: five-pillars
        record: concept/five-pillars
        sources: [source/sahih-al-bukhari-bugha, source/sahih-ibn-khuzayma, source/tanzil-quran, source/ibn-rajab-jami-ulum-hikam]
        label: { ar: "أركان الإسلام الخمسة", en: "The five pillars of Islam", ur: "اسلام کے پانچ ارکان" }
        desc:
          ar: "الأعمال الخمسة التي بُني عليها الإسلام: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان."
          en: "The five acts on which Islam is built: the testimony of faith, prayer, zakat, pilgrimage and the fast of Ramadan."
          ur: "وہ پانچ اعمال جن پر اسلام کی بنیاد ہے: شہادتین، نماز، زکوٰۃ، حج اور رمضان کے روزے۔"
      - id: iman
        record: concept/iman
        sources: [source/sahih-al-bukhari-bugha, source/sahih-ibn-khuzayma, source/tanzil-quran, source/aqida-tahawiyya, source/lumat-al-itiqad, source/aqida-wasitiyya, source/maqalat-islamiyyin, source/sharh-tahawiyya-ibn-abi-al-izz, source/ibn-rajab-jami-ulum-hikam, source/assabile-omar-abdelkafy]
        label: { ar: "الإيمان", en: "Iman (faith)", ur: "ایمان" }
        desc:
          ar: "الإيمان بالله وملائكته وكتابه ولقائه ورسله والبعث، كما في حديث جبريل."
          en: "Belief in God, His angels, His book, meeting Him, His messengers and the resurrection, as in the hadith of Jibril."
          ur: "اللہ، اس کے فرشتوں، اس کی کتاب، اس سے ملاقات، اس کے رسولوں اور دوبارہ اٹھائے جانے پر ایمان، جیسا کہ حدیث جبریل میں ہے۔"
      - id: sadaqa
        record: concept/sadaqa
        sources: [source/ibn-rajab-jami-ulum-hikam, source/usul-iqtisad-islami-0660]
        label: { ar: "الصدقة", en: "Charity (sadaqa)", ur: "صدقہ" }
        desc:
          ar: "الصدقة أوسع من بذل المال؛ فقد دلّ النبي فقراء أصحابه على صدقات في وسعهم كالتسبيح وفعل المعروف."
          en: "Charity is wider than giving money: the Prophet pointed his poorer companions to charities within their reach, such as glorifying God and doing good."
          ur: "صدقہ مال دینے سے وسیع تر ہے؛ نبی نے نادار ساتھیوں کو ایسی نیکیاں بتائیں جو ان کے بس میں تھیں، جیسے تسبیح اور بھلائی۔"
      - id: dhikr
        record: concept/dhikr
        sources: [source/ibn-rajab-jami-ulum-hikam, source/assabile-omar-abdelkafy]
        label: { ar: "الذكر", en: "Remembrance of God (dhikr)", ur: "ذکر" }
        desc:
          ar: "ذكر الله، وفي الحديث الخمسين من جامع العلوم والحكم: «لا يزال لسانك رطبًا من ذكر الله»."
          en: "Remembrance of God; the fiftieth hadith in Ibn Rajab's collection says: 'keep your tongue moist with the remembrance of God'."
          ur: "اللہ کا ذکر؛ ابن رجب کے مجموعے کی پچاسویں حدیث میں ہے: «تمہاری زبان اللہ کے ذکر سے تر رہے»۔"
  - wing: words
    stops:
      - id: bukhari
        record: work/sahih-al-bukhari
        sources: [source/sahih-al-bukhari, source/manhaj-tawthiq-al-sunna-azhar, source/sunnah-com]
        label: { ar: "صحيح البخاري", en: "Sahih al-Bukhari", ur: "صحیح بخاری" }
        desc:
          ar: "الجامع المسند الصحيح، جمعه محمد بن إسماعيل البخاري الجعفي."
