- id: hira
  kind: حدث
  build: hira
  title:
    ar: غار حراء
    en: Cave of Hira
    ur: غارِ حرا
    fr: Grotte de Hira
    tr: Hira Mağarası
    id: Gua Hira
  sub:
    ar: مكة · 610م
    en: Mecca · 610 CE
    ur: مکہ · 610 عیسوی
    fr: La Mecque · 610 ap. J.-C.
    tr: Mekke · 610 m
    id: Mekah · 610 m
  lines:
    ar:
    - ليلٌ ساكن يلفّ جبال مكة. أمامك جبل النور، وفي أعلاه غارٌ صغير مظلم.
    - في ليلة كهذه، قبل أكثر من 1400 عام، بدأ نزول القرآن الكريم.
    - لا نرى أحدًا هنا — فقط الصمت والنجوم والجبل. قف لحظة وتأمّل عظمة البداية.
    en:
    - A still night wraps around the mountains of Mecca. Before you rises Jabal al-Nour, and near its peak a small dark cave.
    - On a night like this, over 1,400 years ago, the revelation of the Quran began.
    - We see no one here — only silence, stars, and the mountain. Stand a moment and contemplate the enormity of the beginning.
    fr:
    - Une nuit paisible enveloppe les montagnes de La Mecque. Devant vous se dresse le Jabal al-Nour et, près de son sommet, une petite grotte sombre.
    - Par une nuit semblable, il y a plus de 1 400 ans, la révélation du Coran a commencé.
    - 'Personne n’apparaît ici : seulement le silence, les étoiles et la montagne. Arrêtez-vous un instant pour méditer sur l’ampleur de ce commencement.'
- id: madinah
  kind: مكان
  build: madinah
  title:
    ar: المسجد الأول
    en: The First Mosque
    ur: پہلی مسجد
    fr: La première mosquée
    tr: İlk Cami
    id: Masjid Pertama
  sub:
    ar: المدينة · 622م
    en: Medina · 622 CE
    ur: مدینہ · 622 عیسوی
    fr: Médine · 622 ap. J.-C.
    tr: Şehir · 622 m
    id: Kota · 622 m
  lines:
    ar:
    - ساحة من التراب، أعمدة من جذوع النخل، وسقف من سعف النخيل المضفور.
    - 'هكذا كان المسجد الأول في المدينة: بسيطًا قريبًا من الأرض، يجمع الناس على الخير.'
    - البساطة هنا هي الجمال — انظر حولك وتخيّل الصفوف الأولى.
    en:
    - A courtyard of packed earth, columns of palm trunks, and a roof of woven palm fronds.
    - 'This was the first mosque in Medina: simple, close to the earth, gathering people in goodness.'
    - Simplicity here is beauty — look around and imagine the first rows.
    fr:
    - Une cour de terre battue, des colonnes en troncs de palmier et un toit de palmes tressées.
    - 'Telle était la première mosquée de Médine : simple, proche de la terre, rassemblant les gens autour du bien.'
    - 'La beauté réside ici dans la simplicité : regardez autour de vous et imaginez les premiers rangs.'
- id: baghdad
  kind: مكان
  build: baghdad
  title:
    ar: بيت الحكمة
    en: The House of Wisdom
    ur: بیت الحکمت
    fr: La Maison de la sagesse
    tr: Bilgelik Evi
    id: Rumah Kebijaksanaan
  sub:
    ar: بغداد · 830م
    en: Baghdad · 830 CE
    ur: بغداد · 830 عیسوی
    fr: Bagdad · 830 ap. J.-C.
    tr: Bağdat · 830 m
    id: Baghdad · 830 m
  lines:
    ar:
    - 'المدينة المدوّرة: أسوار دائرية ضخمة تحيط بقصر الخلافة وقلب الدولة.'
    - على ضفاف دجلة قامت «بيت الحكمة» — حيث تُرجمت علوم اليونان والفرس والهند.
    - 'تخيّل رفوف المخطوطات وأصوات الأقلام: هنا وُلد الجبر والخوارزميات.'
    en:
    - 'The Round City: massive circular walls enclosing the caliph''s palace and the heart of the state.'
    - On the banks of the Tigris stood the House of Wisdom — where the sciences of Greece, Persia, and India were translated.
    - 'Imagine shelves of manuscripts and the scratching of pens: algebra and algorithms were born here.'
    fr:
    - 'La Ville ronde : d’imposantes murailles circulaires entourent le palais du calife et le cœur de l’État.'
    - Sur les rives du Tigre se dressait la Maison de la sagesse, où furent traduits les savoirs de la Grèce, de la Perse et de l’Inde.
    - 'Imaginez les rayonnages de manuscrits et le crissement des calames : c’est ici que sont nés l’algèbre et les algorithmes.'
- id: cordoba
  kind: مكان
  build: cordoba
  title:
    ar: جامع قرطبة الكبير
    en: The Great Mosque of Cordoba
    ur: جامع مسجد قرطبہ
    fr: La Grande Mosquée de Cordoue
    tr: Cordoba Büyük Camii
    id: Masjid Agung Cordoba
  sub:
    ar: قرطبة · 970م
    en: Cordoba · 970 CE
    ur: قرطبہ · 970 عیسوی
    fr: Cordoue · 970 ap. J.-C.
    tr: Cordoba · 970 m
    id: Cordoba · 970 m
  lines:
    ar:
    - 'غابة من الأعمدة: مئات الأعمدة الرخامية تعلوها أقواس مخططة بالأحمر والأبيض.'
    - كان جامع قرطبة منارة علم يقصدها طلاب المعرفة من المشرق والمغرب.
    - امشِ بين الأعمدة واستمع لصدى خطواتك تحت السقف.
    en:
    - 'A forest of columns: hundreds of marble columns crowned with arches striped in red and white.'
    - The mosque of Cordoba was a beacon of learning, sought by students of knowledge from east and west.
    - Walk between the columns and listen to your footsteps echo beneath the roof.
    fr:
    - 'Une forêt de colonnes : des centaines de colonnes de marbre surmontées d’arcs rayés de rouge et de blanc.'
    - La mosquée de Cordoue était un foyer du savoir qui attirait les étudiants d’Orient et d’Occident.
    - Marchez entre les colonnes et écoutez vos pas résonner sous le plafond.
- id: cairo
  kind: زمن
  build: cairo
  title:
    ar: القاهرة الفاطمية
    en: Fatimid Cairo
    ur: فاطمی قاہرہ
    fr: Le Caire fatimide
    tr: Fatımi Kahire
    id: Kairo Fatimiyah
  sub:
    ar: القاهرة · 969م
    en: Cairo · 969 CE
    ur: قاہرہ · 969 عیسوی
    fr: Le Caire · 969 ap. J.-C.
    tr: Kahire · 969 MS
    id: Kairo · 969 M
  lines:
    ar:
    - 'مدينة جديدة تولد من الرمال: القاهرة. مآذن وقباب ترتفع مع غروب الشمس.'
    - هنا سيُبنى الجامع الأزهر — منارة علم تضيء لأكثر من ألف عام.
    - انظر إلى السماء البرتقالية فوق القباب.
    en:
    - 'A new city rising from the sands: Cairo. Minarets and domes climb into the sunset.'
    - Here al-Azhar Mosque would be built — a lighthouse of learning shining for over a thousand years.
    - Look at the orange sky above the domes.
    fr:
    - 'Une ville nouvelle surgit des sables : Le Caire. Minarets et coupoles se dressent dans le soleil couchant.'
    - C’est ici que sera construite la mosquée al-Azhar, foyer du savoir qui rayonne depuis plus de mille ans.
    - Regardez le ciel orangé au-dessus des coupoles.
- id: istanbul
  kind: زمن
