  title:
    ar: إسطنبول العثمانية
    en: Ottoman Istanbul
    ur: عثمانی استنبول
    fr: Istanbul ottomane
    tr: Osmanlı İstanbul
    id: Ottoman Istanbul
  sub:
    ar: إسطنبول · 1600م
    en: Istanbul · 1600 CE
    ur: استنبول · 1600 عیسوی
    fr: Istanbul · 1600 ap. J.-C.
    tr: İstanbul · 1600 m
    id: Istanbul · 1600 m
  lines:
    ar:
    - قبة عظيمة تتوسط السماء، تحفّ بها أنصاف القباب وأربع مآذن رشيقة كالأقلام.
    - 'هذه عمارة سنان: هندسة تتحدى الجاذبية وتسبّح بالجمال.'
    - مياه البوسفور تلمع أمامك، والمدينة تمتد حتى الأفق.
    en:
    - A mighty dome fills the sky, ringed by half-domes and four slender minarets like pens.
    - 'This is Sinan''s architecture: engineering that defies gravity and glorifies beauty.'
    - The waters of the Bosphorus glitter before you, and the city stretches to the horizon.
    fr:
    - Une immense coupole emplit le ciel, entourée de demi-coupoles et de quatre minarets élancés comme des calames.
    - 'Voici l’architecture de Sinan : une technique qui défie la pesanteur et célèbre la beauté.'
    - Les eaux du Bosphore scintillent devant vous, et la ville s’étend jusqu’à l’horizon.
- id: kaaba
  kind: حدث
  build: kaaba
  title:
    ar: الكعبة المشرفة
    en: The Kaaba
    ur: خانۂ کعبہ
    fr: La Kaaba
    tr: Kutsal Kabe
    id: Ka'bah Suci
  sub:
    ar: مكة · كل زمان
    en: Mecca · all eras
    ur: مکہ · ہر دور
    fr: La Mecque · toutes les époques
    tr: Mekke · Tüm zamanlar
    id: Mekah · Setiap waktu
  lines:
    ar:
    - المكعّب المهيب مكسوًّا بالسواد المطرّز بالذهب — قبلة المسلمين في كل صلاة.
    - منذ آلاف السنين والناس يطوفون حوله صفًّا واحدًا، لا فرق بين غني وفقير.
    - قف هنا لحظة صمت وتأمّل.
    en:
    - The majestic cube draped in gold-embroidered black — the qibla of Muslims in every prayer.
    - For thousands of years people have circled it in a single row, rich and poor alike.
    - Stand here in a moment of silence and contemplation.
    fr:
    - 'Le majestueux cube est drapé de noir brodé d’or : c’est la qibla, vers laquelle les musulmans se tournent à chaque prière.'
    - Depuis des milliers d’années, les gens en font le tour dans un même rang, riches et pauvres sans distinction.
    - Arrêtez-vous ici un instant, dans le silence et la contemplation.
