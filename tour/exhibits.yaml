    tr: Yemen Sultanı Elçi Ömer bin Yusuf tarafından bakırdan yapılmış astronomik bir alet, yıldızların konumlarını ölçmek ve zaman ile yönleri belirlemek için kullanılır.
    id: Sebuah alat astronomi yang terbuat dari tembaga oleh Sultan Yaman, Rasul Umar bin Yusuf, untuk mengukur posisi bintang serta menentukan waktu dan arah.
