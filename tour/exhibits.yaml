  desc:
    ar: رقوق قرآنية مكتوبة بالخط الحجازي، أرّخها الكربون المشع بين 568 و645م، فهي من أقدم أوراق المصحف المعروفة.
    en: Parchment folios in Hijazi script, radiocarbon dated to 568–645 CE, among the oldest known Qur'an leaves.
    ur: حجازی خط میں لکھے رق کے قرآنی اوراق، جن کی ریڈیو کاربن تاریخ 568–645ء ہے؛ یہ مصحف کے قدیم ترین معلوم اوراق میں سے ہیں۔
    fr: Feuillets de parchemin en écriture hijazi, datés au carbone 14 entre 568 et 645 ap. J.-C., parmi les plus anciens feuillets coraniques connus.
    tr: Hecazi alfabesiyle yazılmış, radyokarbonla 568 ile 645 yılları arasında tarihlendirilen Kur'an parşömenleri, bilinen en eski Muşaf yaprakları arasındadır.
    id: Gulungan Al-Qur'an yang ditulis dalam aksara Hejazi, bertanggal dengan radiokarbon antara tahun 568 dan 645 M, dan termasuk daun Mushaf tertua yang diketahui.
