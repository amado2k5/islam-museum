# Objects-hall exhibits for the 3D tour (/{lang}/3d/). Each exhibit is a stop:
# `build` picks the procedural mesh in site/src/scripts/tour.ts, `record` is the
# object entity whose page the label links to and whose `made` date it shows.
# Short labels and one-line descriptions are written from those records and cite
# the same sources (`sources`).
status:
  review: published
provenance:
  generated_by: Devin
  model: unknown
  run: 3d-tour-step1
  source: "data/object records named in each exhibit's `record` (Met Open Access, V&A Collections, Wikidata)"
exhibits:
  - id: astrolabe
    build: astrolabe
    record: object/astrolabe-umar-ibn-yusuf
    sources: [source/met-open-access]
    label:
      ar: أسطرلاب عمر بن يوسف
      en: Astrolabe of Umar ibn Yusuf
      ur: عمر بن یوسف کا اسطرلاب
    desc:
      ar: آلة فلكية من النحاس صنعها بنفسه سلطان اليمن الرسولي عمر بن يوسف، لقياس مواقع النجوم ومعرفة الأوقات والاتجاهات.
      en: A brass instrument for reading the stars, finding times and directions, made by the Rasulid sultan of Yemen, Umar ibn Yusuf, himself.
      ur: ستاروں کے مقام، اوقات اور سمتیں جاننے کا پیتل کا آلہ، جسے یمن کے رسولی سلطان عمر بن یوسف نے خود بنایا۔
    material:
      ar: نحاس أصفر مطعّم بالفضة
      en: Brass inlaid with silver
      ur: چاندی کی پچی کاری والا پیتل
    museum:
      ar: متحف المتروبوليتان للفن
      en: Metropolitan Museum of Art
      ur: میٹروپولیٹن میوزیم آف آرٹ
  - id: manuscript
    build: manuscript
    record: object/mushaf-birmingham
    sources: [source/wikidata]
    label:
      ar: مصحف برمنغهام
      en: Birmingham Qur'an manuscript
      ur: برمنگھم مصحف
    desc:
      ar: رقوق قرآنية مكتوبة بالخط الحجازي، أرّخها الكربون المشع بين 568 و645م، فهي من أقدم أوراق المصحف المعروفة.
      en: Parchment folios in Hijazi script, radiocarbon dated to 568–645 CE, among the oldest known Qur'an leaves.
      ur: حجازی خط میں لکھے رق کے قرآنی اوراق، جن کی ریڈیو کاربن تاریخ 568–645ء ہے؛ یہ مصحف کے قدیم ترین معلوم اوراق میں سے ہیں۔
    material:
      ar: رَقّ
      en: Parchment
      ur: رق (چرمی ورق)
    museum:
      ar: جامعة برمنغهام
      en: University of Birmingham
      ur: برمنگھم یونیورسٹی
  - id: vase
    build: vase
    record: object/qarura-izniq
    sources: [source/vam-collection]
    label:
      ar: قارورة إزنيقية
      en: Iznik bottle
      ur: ازنیق کی صراحی
    desc:
      ar: قارورة من الخزف الملوّن صُنعت في إزنيق بين 1575 و1580م.
      en: A painted fritware bottle made in Iznik in 1575–80.
      ur: رنگین خزف کی صراحی جو 1575 اور 1580ء کے درمیان ازنیق میں بنی۔
    material:
      ar: خزف (فريت)
      en: Fritware
      ur: فرٹ ویئر (خزف)
    museum:
      ar: متحف فيكتوريا وألبرت، لندن
      en: Victoria and Albert Museum, London
      ur: وکٹوریہ اینڈ البرٹ میوزیم، لندن
  - id: dirham
    build: dirham
    record: object/duranir-andalusiyya
    sources: [source/vam-collection]
    label:
      ar: دراهم أموية أندلسية
      en: Umayyad coins of al-Andalus
      ur: اندلس کے اموی درہم
    desc:
      ar: مجموعة دراهم ضُربت في قرطبة في عصر الخلافة الأموية بالأندلس، بين 929 و1010م.
      en: A set of dirhams struck in Cordoba in the age of the Umayyad caliphate of al-Andalus, 929–1010.
      ur: درہموں کا مجموعہ جو اندلس کی اموی خلافت کے دور میں 929 سے 1010ء کے درمیان قرطبہ میں ڈھالا گیا۔
    museum:
      ar: متحف فيكتوريا وألبرت، لندن
      en: Victoria and Albert Museum, London
      ur: وکٹوریہ اینڈ البرٹ میوزیم، لندن
  - id: lamp
    build: lamp
    record: object/mosque-lamp-va-79400
    sources: [source/vam-collection]
    label:
      ar: قنديل مسجد من مصر
      en: Mosque lamp from Egypt
      ur: مصر کا مسجدی قندیل
    desc:
      ar: قنديل من النحاس الأصفر صُنع في مصر نحو 1468–1496م لإنارة المسجد.
      en: A brass lamp made in Egypt around 1468–96 to light a mosque.
      ur: پیتل کا قندیل جو تقریباً 1468–1496ء میں مصر میں مسجد کو روشن کرنے کے لیے بنا۔
    material:
      ar: نحاس أصفر
      en: Brass
      ur: پیتل
    museum:
      ar: متحف فيكتوريا وألبرت، لندن
      en: Victoria and Albert Museum, London
      ur: وکٹوریہ اینڈ البرٹ میوزیم، لندن
