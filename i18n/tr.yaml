  shop_title: Geleceğe yönelik hediyelik eşya dükkanı
  shop_body: Gelecekte, müze bu sitenin kendi ayrı bölümünde bir hediyelik eşya dükkanı/online
    pazar planlıyor; burada ürünler sergilenip satılacak, isteyen herkese göz atmak
    veya alışveriş yapmak istiyor, işletme masraflarına yardımcı olmak için. Reklam,
    spam veya dilencilikten arındırılmış olacak ve ziyaretler her zaman isteğe bağlı
    olacak. Bu bir plan—bugün açık bir mağaza yok — ve müze herkes için ücretsizdir,
    öyle de kalacaktır.
  note: Destek isteğe bağlıdır—sahibinin istediği gibi, herhangi bir yükümlülük veya
    yükümlülük olmaksızın sağlanır—ve müzenin içeriği, incelemesi veya yönlendirmesi
    üzerinde hiçbir yetki tanımaz. Editoryal çalışma bağımsızdır ve müfredat yayımlanır.
