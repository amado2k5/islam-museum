foundation:
  title: İslam Müzesi Vakfı Hakkında
  lede: 'İslam hakkında açık ve ücretsiz dijital bir müze: inançlar, medeniyet, halklar,
    yerler, fikirler, anıtlar, kelimeler ve çağdaş yaşam, İslam''ın doğduğu dünyadan
    günümüze kadar.'
  logo_title: Logo
  logo_intro: Logo, İslam mimarisi ve kutsal metinlerinin üç unsurunu tek bir formda
    birleştirmek üzere tasarlandı.
  logo_star: 'İslami geometriden sekiz uçlu yıldız: zaman ve uzay birlikte, yani hiçbiri
    diğerinden ayrı anlaşılamaz.'
  logo_arch: 'Mihrab: ziyaretçilerin girip kıbleye baktığı kapı.'
  logo_book: 'Açık Kitap: Bilgi ve Söz, ve Yargıdan Önce Okuma.'
  logo_download: Etiket (PNG)
  emblem_alt: 'Müze logosu: Altın sekiz yıldız, açık bir kitabın üzerinde bakır mihraplı
    lapis lazuli diski çevreliyor'
  emblem_download: Tam logo (resim)
  logo_dark_download: Koyu arka planlar için etiket
  logo_lockup_download: İsimle logoyu indirin
  story_title: Hikaye
  story_1: 'Proje basit bir soruyla başladı: Neden internette İslam''ın tüm hikayesini
    toplayan, yabancının girdiği, dolaştığı, öğrendiği ve araştırmacının kaynağı doğrulayıp
    geri dönebileceği tek bir yer yok? İslam hakkındaki bilgi, metin siteleri, müze
    arşivleri, ansiklopedik makaleler, akademik çalışmalar ve gazetecilik haberleri
    arasında dağınık halde bulunuyor; bunların çoğu savunma veya saldırı için yazılmıştır,
    anlama için değil.'
  story_2: 'Proje, uzun bir makale yerine müze olarak inşa etmeye karar verdi: dokuz
    kanat (zaman, mekân, insanlar, fikirler, anıtlar, kelime, yaşayan İslam, bugün
    ve yaratım) aynı konuyu farklı açılardan bakar; her kişi, yer, olay, fikir veya
    bir diyagramda çevresiyle zaman ve mekânda bir kompleks izler çizer.'
  story_3: 'Materyal, herkesin erişebileceği açık metin dosyalarında saklanıyor; her
    bilgi kaynak olarak veriliyor ve her tarih tam biçiminde, Hicri ve Gregoryen takvimleriyle
    yazılıyor. Site kendisi statik sayfalardan oluşuyor: sunucu yok, veritabanı yok,
    ücretli hizmet yok ve biri siteyi ziyaret ettiğinde çalışan bir yapay zeka modeli
    yok.'
  story_4: 'Müze görsel kimliğini seçerken, renkleri İslami mimari ve el yazması işçiliğinin
    kökenlerinden esinlenmiştir: derin mavi mavi, el yazması sayfalarında mat altın,
    sütlü kağıt ve paneller için kumlu bej. Belirli bir süsleme korunmuş bir eserden
    kopyalanmamıştır; gravürler yıldız, kare ve daire geometrisinden doğmuştur.'
  story_5: 'Sonra ekip çalışması geldi: katkılar ve paralel çalışma oturumları, küçük
    materyal partileri eklendi ve taslaklar kabul edilmeden önce sergilenirken bir
    inceleme. Müze hâlâ inşaat aşamasında, her sayfada duyuruldu ve kapak sayfası
    tamamlananları ve nelerin beklediğini sayıyor.'
  founder_title: Kurucu
  founder_line: Mısır kökenli bir Kanadalı olan {name} tarafından kurulan Ontario,
    Oakville'de yaşamaktadır.
  founder_name: Ahmed Abdel Aal
  founder_body: 'Proje, ilk vizyonunu depo içindeki planlama belgelerinde koyan ve
    ardından eklemek veya düzeltmek isteyen herkese kapılarını açan bir kişi tarafından
    kuruldu. Vizyon, kurucusu dursa bile müzenin canlı kalmasına dayanıyor: metinleri
    Git''te, verileri açık ve herkes bilgisayarında tam olarak kopyalayabilir. Bu
    sayfa projeyi ve amacını anlatıyor, sahibinin biyografisini değil.'
  independence_title: Bağımsızlık
  independence_1: 'İslam Müzesi, kurucusunun kişisel bir projesidir ve yalnızca onun
    tarafından yönetilir. Yönetimi, sahipliği veya kararları asla paylaşılmaz ve satılık
    değildir: hiçbir finansman, ortaklık veya destek kimseye üzerinde kontrol vermez.'
  independence_2: 'Müze asla başka bir projeye entegre edilmeyecek, hiçbir şemsiye
    ya da denetim altında durmayacak—ne hükümet, ne dini kurum, ne şirket, ne de bir
    vakıf. Yardım kapısı herkese açık: notlar ve düzeltmeler, gönüllülük, fon ve bağış
    toplama, materyaller ve kaynaklar, testler, koda katkıda bulunma, müze hakkında
    yazılar yazma ve yayınlama. Yardım teşekkürle kabul edilir ve sahibine atfedilir,
    hiçbir yetki verilmez: müze bağımsızdır, insanlardan insanlara.'
  terms_title: Kullanım Özgürlüğü — ve Hangi Şartlar Altında
  terms_1: 'Buradaki her şey izinsiz olarak ücretsiz kullanılabilir: tüm müze verileri,
    kaynakları ve hizmetleri, mevcut ve gelecekte, herhangi bir şekilde, kısıtlamasız
    ve bizim kontrolümüz olmadan. Tüm kod veritabanını çoğaltabilir, dallanabilir
    veya kopyalayabilir ve benzer, değiştirilmiş veya tamamen yeni bir projeye başlayabilirsiniz
    — kurucu bu çabalara karşı herhangi bir telif hakkı iddiası veya yasal girişimde
    bulunamaz. CC0 verileri, CC BY-SA 4.0 betikleri ve MIT kodu.'
  terms_2: 'Müze, önceden onay almadan, onay almadan ve kimseye bildirimde bulunmadan
    herhangi bir şeyi — siteyi, içeriğini, kodunu, barındırımını, performansını, yapısını
    ve yayınını — herhangi bir zamanda değiştirebilir. Herhangi bir hizmet seviyesi
    anlaşması veya garantisi yoktur: site kapalı, durdurulmuşsa, kullanılamazsa veya
    başka bir şekilde ne müze ne de sahibi sorumlu değildir.'
  terms_3: Burada bulduklarınızla ne yaptığınız sizin sorumluluğunuzdadır. Ne site,
    ne sahibi, ne de barındırma şirketi, yayınlanan içeriğin davranışları, eylemleri,
    benimsemesi, uygulanması, çoğaltılması veya yeniden kullanımı ile ziyaretçilerin
    eylemlerinden kaynaklanan yanlış anlama, yanlış beyan, kötüye kullanım veya zarardan
    sorumlu değildir. Her giriş kaynaklarını belirtir ve inceleme durumunu gösterir,
    ancak doğruluk garanti edilmez, atfedilir — iddianın nihai olarak ortaya konduğu
    kaynak budur — ve bağlı olduğumuz siteler sahiplerinin sorumluluğundadır.
  terms_4: 'Herhangi bir yazar veya herhangi bir içerik üzerinde iddiası olan kuruluş,
    içeriğin kaldırılmasını veya değiştirilmesini istediği zaman talep edebilir: bu
    sitedeki raporlama araçları her zaman bu amaç için açıktır ve bu talepler önce
    yanıtlanır. Bu sitede ifade edilen tüm görüş ve düşünceler yalnızca kurucunun
    kendisine aittir ve işvereninin görüşlerini veya görüşlerini yansıtmaz.'
  purpose_title: Ne kâr için ne de bir gündem için
  purpose_1: '''İslam Müzesi'' kâr veya kazanç amacıyla işletilmez. Bir gündemi takip
    etmez, hiçbir hükümet ya da şirketin ihtiyaçlarını karşılamaz. Herkes için ücretsizdir:
    abonelik yok, takip yok ve kimsenin bilgisini kimseye kullanma ya da satma niyeti
    yok.'
  purpose_2: Müzenin işletilmesi her ay gerçek para gerektiriyor ve kurucusu bu masrafı
    bizzat üstleniyor. Gönüllüler hoş karşılanır ve isteyen herkes maliyete istediği
    gibi bağış yapabilir—yükümlülük olmadan, zorunluluk olmadan ve karşılığında hiçbir
    kontrol olmadan.
  purpose_3: Gelecekte, müze kendi ayrı bölümünde bir hediyelik eşya dükkanı/online
    pazar planlıyor; burada ürünler sergilenecek ve orada gezmek veya alışveriş yapmak
    isteyenlere satıyor, böylece maliyetlere yardımcı olacak. Reklam, spam veya dilenme
    içermeyecek ve ziyaretler her zaman isteğe bağlı olacak; açılana kadar mağaza
    olmayacak ve müze kendisi ücretsiz kalacak.
  purpose_4: 'Müze, nefret, nefret söylemi ve zarara kesinlikle karşıdır—İslamofobi,
    antisemitizm, ırkçılık, soykırım, etnik temizlik ve Birleşmiş Milletler''in nefret
    veya ırkçılık olarak sınıflandırdığı her şeye karşı—ve çeşitliliği, görüş ayrılığını
    ve barışı destekler ve teşvik eder. Bir görüşü diğerine karşı ya da bir tarih
    anlatısını diğerine karşı desteklemez: insan mirasının arşivi ve kütüphanesidir;
    başkalarının kendi bakış açısıyla yaptıklarını ve yazdıklarını sergiler. Onların
    görüşleri yalnızca kendi görüşleridir; müze kimseyi desteklemez, hiçbir şey vaaz
    etmez ve herhangi bir tavsiye, hizmet veya tavsiye sunmaz. Şart bunu tam olarak
    belirtir (Madde Onuncu). Müze, sergilediği hiçbir şeyin telif hakkı, patenti veya
    mülkiyeti iddiasında bulunmuyor, ayrıca kimseye ziyaret etmesi, görmesi veya tanıtımı
    için herhangi bir teşvik, para veya kazanç sunmuyor—gelen herkes bunu kendi isteğiyle
    yapıyor.'
  contact_title: Kime yazıyorsunuz
  contact_press: Basın ve Medya
  contact_copyright: Telif Hakkı Talepleri
  contact_concerns: Başka endişeleriniz var mı
  goal_title: Amaç
  goal_intro: 'Müzenin amacı, İslam''ın başlangıcından günümüze kadar tüm eserleri
    adil ve tarafsız bir şekilde sunmaktır. Bu amaçla aşağıdakilere bağlıdır:'
  goal_1: Gerçekleri tarihleri ve kaynaklarıyla tanımlar ama yargılamaz, yargılar
    sahiplerine atfeder.
  goal_2: Diş anlatısı araştırmanın ana çerçevesidir ve diğer tüm vizyonlar işaretlendikten
    sonra açıkça işaretlenir.
  goal_3: Rakipleri, eleştirmenleri ve müttefiklerini kendi zamanlarındaki rollerinde
    sıralar ve bunları zorluk diliyle yazmaz.
  goal_4: 'Tartışmalı konular gerilim kartlarında sunuluyor: müze tarafından bir yargı
    olmadan iki veya daha fazla oy, her birinin kendi kaynağı var.'
  goal_5: Her iddia bir kaynağa atfedilir ve Wikipedia bir kaynaktır, kaynak değil.
  goal_6: Kitap Arapça başlar, İslam hakkında hiçbir şey bilmeyen ziyaretçiler ve
    uzman araştırmacılar için uygundur.
  take_title: İnşaata katılın
  take_body: İçerik ve kod herkese açıktır. Depoyu okuyabilir, hata bildirebilir,
    yeni bir varlık önerebilir veya başka bir dile çeviri talep edebilirsiniz.
