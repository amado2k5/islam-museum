halal:
  title: Helal ve Haram tarayıcı
  lede: 'Müzenin kaynaklarındaki helal ve haram ifadeleri: inek, sofra, sığır, deve,
    a''raf ve arılarda kabul ve yasak ayetleri; Sahihler, Muwatta ve Sunan''daki "Yasal
    olan açıktır, yasak olan açıktır", "Her sarhoş edici şey yasaktır" ve "Bir Müslüman
    için yasaldır" hadisleri; Sahabelerin ve Takipçilerin yasaklardan kaçınma ve mücaiz
    olanı arama biyografisi ve raporları; hukukçuların neyin izin verildiğine neyin
    yasak olduğuna dair görüşleri; ve bugünden itibaren bir kitapta geçen her bahse
    yer vermektedir. Müze, kaynaklarda ne olduğunu açıklar ve her görüşü sahibine
    atfeder, fetva vermeden.'
  badge: Helal ve Haram Explorer
  status: Bu yapı, {s} bölümünde {n} kayıt içerir; metinler taslaklardır, böylece
    bir kişi onları okuyabilir.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, kaynakları ve yedi dilli düzyazısıyla sıradan
    bir müze kaydıdır. Anılar, korunan bir sözlükte şu bölümlerin metinleri üzerine
    oluşturulduktan sonra keşfedilir: "helal" ve "haram" biçimleriyle, yerine geçen
    kişi veya izin veren yerine geçen fiil ("ahal tanrı" ("ahal allah" sana "ahal
    allah", "la ihral limaru''"), yasak fiili yapan kişi veya ona yasak olan fiil
    ("haram Allah" ("haram Allah" veya "harat ''aleykum"), "tahrim" (yasak), "yasak
    şeyler" (sana yasak), "yasak şeyler (sana yasak"), "yasak şeyler (sana yasak"),
    "yasak şeyler (muharremet el-mala"), "mahramat al-makruh" (sana yasak), "sana
    yasak"—sadece güçlü bir kelimenin yanında sayılır. Doğrulamadan önce, bölümde
    yer almayan şeyler hariç tutulur: ''Kutsal Camii'', ''Kutsal Ev'', ''kutsal ay'',
    ''haram'' ismi, ihramın durumu ve ondan kurtuluş, ve ''Tanrı onu ateşte yasakladı.''
    Daha sonra gerçekleşen her kitabın pasajlarının yayımlandığı gün, adım veya etiket
    olmadan anıları vardır. Fıkıhsal anlaşmazlıklar, yazarlarına atfedilen ifadelerle
    sunulur ve müze bunu desteklemez.'
  api: Tam koleksiyon şu tarihte mevcuttur
