  lede: 'Kur''an''da, hadislerde ve Seere''de doğa: Peygamber''in Süleyman''ın duyduğu
    ve koruduğu hayvanlar, Yunus''un fil kuşu ve balinası, palmiye ağaçları ve zeytinler,
    gökler, denizler, rüzgarlar ve yağmur Allah''ın işaretleridir — her ayet ve her
    hadis kaynağı ile birlikte.'
