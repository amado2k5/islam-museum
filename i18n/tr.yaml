games:
  title: "Oyunlar"
  lede: "Müzenin geliştirdiği, tarayıcıda ücretsiz oynanan dokuz oyun. Kalima, Beş Soru ve Zamanın İpliği tamamlandı; diğerleri bitmemiş prototiplerdir ve oldukları gibi gösterilir."
  list: "Oyunlar"
  status_title: "Hangi aşamadalar"
  status_body: "Kalima, Beş Soru ve Zamanın İpliği dışında buradaki her oyun bir prototiptir: eksik bölümler vardır, görseller henüz kabadır ve değişiklikler olacaktır. Oyunlar ücretsizdir; reklam, satın alma ve hesap yoktur. İlerlemeniz yalnızca kendi tarayıcınızda saklanır."
  history: "Oyunlardaki tarih içeriği henüz adı belirtilen bir tarihçi tarafından incelenmemiştir. Taslak olarak değerlendirin; kaynaklı bilgiler için müzenin kendi sayfalarına bakın."
  needs: "Oyunlardan üçü üç boyutlu bir dünya çizer ve Chrome veya Edge gibi WebGPU destekleyen güncel bir masaüstü tarayıcı gerektirir. Bulunmadığında daha sade bir görünüm sunarlar. Dört günlük oyun (Beş Soru, Kalima, Zamanın İpliği ve Kandil) telefon, tablet ve bilgisayarda çalışan sade sayfalardır."
  play: "Oyna"
  opens: "games.islam.museum adresinde açılır"
  prototype: "Prototip"
  items:
    granada:
      name: "Gırnata"
      tagline: "Endülüs'ün son krallığı"
      blurb: "Bir yıl boyunca Nasrî Gırnata'sında bir vadinin kâhyasısınız: tarlalara su getirin, hasadı toplayın, pazarda ticaret yapın ve haneleri kıştan çıkarın."
    golden-age:
      name: "Altın Çağ"
      blurb: "Klasik İslam dünyasından bir şehri ayakta tutun; işe bozulmakta olan bir kanalla başlayın."
    atlas:
      name: "Atlas"
      tagline: "Tarihî Dünya Yarışması"
      blurb: "Küre üzerinde günlük bir meydan okuma: tarihin yerlerini ve anlarını bulun ya da kendi hızınızda alıştırma yapın."
    hudhud:
      name: "Hudhud: Harikalar Atlası"
      blurb: "Aileler için iki boyutlu bir hikâye macerası: Hüdhüd, bir hikâyeler atlasının dağılmış sayfalarını topluyor. Şimdilik iki görev oynanabiliyor."

    five-questions:
      name: "Beş Soru"
      blurb: "Müzenin kayıtlarından her gün beş soru: tarihler, yerler ve kişiler. Her cevap geldiği kayda bağlanır."
    kalima:
      name: "Kalima"
      blurb: "Günün yer adını altı denemede bulun; her harf rengin yanında bir işaret de alır. Her dilin kendi listesi var, Arapçanınki Arap harfleriyle."
    thread:
      name: "Zamanın İpliği"
      blurb: "Müzenin zaman çizelgesinden beş olayı oluş sırasına koyun, sonra her birinin yılını ve kaydını görün."
    lantern:
      name: "Kandil"
      blurb: "Müzeden bir adı, bir yer ya da kişi, kandilin yedi damla yağı bitmeden harf harf açın."
    lamp:
      name: "Çağların Lambası"
      blurb: "Bir zaman kadranını çevir ve halk masalındaki lamba seni Bağdat, Kurtuba, Kahire, Semerkant ve Timbuktu'ya götürsün: müzenin kayıtlarındaki kişilerle tanış, sorularını yanıtla ve kayıt kartlarını çağlar arasında taşı. İlk 2B bölüm."