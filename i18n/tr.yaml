  title: Etik ve İşlemler Tarayıcısı
  lede: 'Müzenin kaynaklarındaki her etik ve işlem anı: Kur''an''ın erdemleri—doğruluk,
    güvenilirlik, adalet ve iyilikten ebeveynlere saygı gösterme ve aile bağlarını
    sürdürmeye; yalan, ihanet, kibir, laf ve adaletsizlik gibi kötü alışkanlıkları;
    "Ben sadece asil ahlakı mükemmelleştirmek için gönderildim" ve "Müslüman, Müslümanlar
    için güvenlidir" hadisleri, satış, tefecilik, borç, ipotek gibi evlilik ve boşanma,
    yeminler, tanıklıklar, yargı ve tartma gibi eylemler — Sahabeler ve Takipçiler
    hakkındaki her rapor, hangi biyografiler ve elde edilen her kitap, yeni metinler
    yayımlandıkça büyüyen belgelenmiş kayıtlar içerir.'
  badge: Etik ve İşlemler Gezgini
  status: Bu yapı, {s} bölümünde {n} kayıt içerir; metinler taslaklardır, böylece
    bir kişi onları okuyabilir.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, yedi dilli üslubu ve ifadeleriyle sıradan bir
    müze kaydı. Yapım sırasında ahlak ve işlemler, bölümlerin metinleriyle korunan
    bir sözlükte bulunur: erdemlerin sözleri (dürüstlük, güvenilirlik, sadakat, sabır,
    minnettarlık, alçakgönüllülük, iyilikseverlik, alçakgönüllülük, sabır, samimiyet,
    tövbe, cömertlik, doğruluk, aile bağlarını sürdürme, komşular, öğüt, zarardan
    kaçınma, kesinlik, merhamet, adalet ve memnuniyet); kötü alışkanlıkların şartları
    (yalan, ihanet, kibir, ikiyüzlülük, kıskançlık, cimrilik, arkadan iğneme, dedikodu,
    müstehcenlik, hakaret, öfke, adaletsizlik, itaatsizlik, ikiyüzlülük ve sahtekarlık);
    ve işlemlerin şartları (satış, ticaret, tefecilik, borç, kredi, ipotek, kira,
    vasiyet, miras, evlilik, çeyiz ve emzirme). Boşanma, khul'', ''iddah'' (bekleme
    süresi), nafaka, velayet, yemin, kefaret, tanıklık, delil, yargı, denge, ölçüm,
    hafifletme, uzlaşma, hediye, garanti, garanti, acentelik, ortaklık, borç, mudarabah,
    tarım, muasaqah, salam, istisna'', transfer (transfer), borç, depozito, gasp,
    gasp etme, öncelik, tekel, zorlama, yeminsizlik ve sözleşme; bağlılık yemini hariç
    tutulur, ''riba'' işlem dışındaki büyüme, ''hüküm'' bilgelik anlamına gelir, ''tanıklık''
    Allah veya şahit tarafından tanıklık anlamına gelir, ''ödül'' ödül anlamında,
    ''qasm'' pay ve ibadet eylemleri göz gezdirenler için yapılır İki kardeş (ibadet
    ve dualar), tanımlayıcı tarafından belgelenen yanlış pozitifler hariç ve daha
    sonra gerçekleşen her kitap, bölümleri grafikte göründüğünde burada otomatik olarak
    belirtilir; seçilen kayıtlar akhlaq-browser etiketiyle eklenir. Her bölüm kendi
    dersini (etik/işlemler), türü (erdem/kötülük/tedavi/bahsetme) ve konularını öğretir.'
