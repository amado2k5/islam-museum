        Halkı''nın köpeği, çöl hayvanları ve sürüler.'
    bird:
      title: kuş
      desc: Süleyman'ın hoopoe'su, fil yutkunmaları, gömmeyi öğreten karga ve havada
        dua eden kuşlar.
    insect:
