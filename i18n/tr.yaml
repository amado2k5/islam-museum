  terms_title: '''Al-Mu''jam'' ve ''Al-Qamus'' ne anlama geliyor?'
  terms_note: Antik Arap mirasında 'Mu'jam' kelimesi dil kitapları için bir isim değildi;
    aksine, Arapça harfi çıkarılan ünlü kitabını ifade ederdi ve 'sözlük harfleri'
    nokta işaretlerinin harfleridir. Eserlerine ilk isim verenler, isimleri alfabetik
    olarak düzenleyen hadis halkıydı; örneğin 'Sahabeler Sözlüğü'nde olduğu gibi;
    bu isim, 'Al-'Ayn' ve 'Lisan al-Arab' gibi büyük sözlük başlıklarında modern çağa
    kadar geçmemiştir. 'Al-Qamus' ise 'okyanusun okyanusu' anlamına gelir ve ardından
    Al-Fayruzabadi Sözlüğü'ndeki sözlüğün genel eşanlamlısı haline gelmiştir. 'Arabica'dan,
    Doha Enstitüsü Ansiklopedisi'nden.
