    ve kırbaçlama — ve "büyük günahlar" ile "ölümcüller"; zayıf referanslar sayılır
    — soyut "hudud" ve "hudud" gibi belirsiz anlamda "sürü" ve zina, hırsızlık, iftira,
    alkol, dinden dönme, savaş, intikam ve belirsiz "büyük" referanslar — sadece güçlü
