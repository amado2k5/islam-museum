qiraat:
  title: Kur'an Okumaları, Yazım Yazıları, Yazı Tipleri ve Nokta Tarayıcı
  lede: 'Müzenin kaynaklarının Kur''an''ın okunması ve yazımı hakkında söylediği her
    şey: yedi mektup, okumalar, imamları ve rivayetleri, Ebu Bekir döneminde Kur''an''ın
    derlenmesi, Osman döneminde Kur''anların kopyalanması, Muşaf''ın yazısı ve yazım
    yazısıyla yazılışı hakkında söylenenler, noktalar, şekiller ve düzeltmeler, ayrıca
    Hicazi ve Kufice yazılı yazılar Nash, Tulus ve Mağrip''e kadar yazılmış. Bir kitabın
    her ayeti, rivayeti, haberi ve bölümü kaynağına, her ifade ise yazarına atfedilir.'
  badge: Okuma ve çizim tarayıcısı
  hero_kufi: Okumalar · Çizim · Çizgiler · Puanlar
  hero_naskh: 'Kur''an''ın nasıl okunduğu ve nasıl yazıldığı: ilk parşömenden basılı
    Muşaf''a kadar'
  status: Bu baskı, {s} bölümlerinde {n} kayıt içerir; her kayıt kaynaklarından bahseder
    ve metinler, insanların henüz okumadığı kaynaklardan otomatik modellerle yazılmıştır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Bu tarayıcı, Kur''an''ın nasıl okunduğu, Kur''an''da nasıl yazıldığı,
    hangi yazı metininde yazıldığı ve nasıl noktalanıp şekillendiği gibi dört bağlantılı
    konuda bahsedilen ve yazılanları toplar. Kur''an ayetleri bir referans tablosundan
    alınır: okunmayı ve okunmayı emreden ayetler, kalem ve el yazılarından bahseden,
    bölgedeki kuranlar veya Kur''anlar arasındaki farklılıkları bildiren ayetler;
    müze kayıtlarında sadece donmuş dosyalardan yazılı olarak hiçbir Kur''an metni
    yazılmaz, okunan metin yazılı olarak değil, konuşma şeklinde anlatılır. Hadis,
    biyografi, Sahabe ve Takipçilerin raporları ile kitaplar gibi diğer tüm metinler,
    her bölümün metni üzerinde dikkatlice korunan bir sözlükte inşa edilir. Yeni bir
    kitap hazırlandığında, referansları bölümlerinin tanıtıldığı gün ortaya çıkar.
    Tarayıcı bir karar vermez: yedi harfin anlamı veya Mushaf''ın yazım yazısıyla
    yazılması gibi konularda farklı görüşler yaşandığında, kayıt sahibine atfedilen
    her ifadeyi kaydeder.'
