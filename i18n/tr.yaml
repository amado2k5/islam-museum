cosmos:
  title: Yabancı Kaşif, Eski İnsan Ulusları ve Evrenin Sırları
  lede: 'Müze kaynaklarının insanlık hikayesinin ötesinde ne olduğunu anlatan her
    şey: Kur''an''ın Tanrı''ya anlattığı yaratıklar, tıpkı Tanrı''nın onları yeryüzünde
    yaydığı gibi, yedi gökyüzü ve onların yeryüzünden gelen eşdeğerleri, Adem''den
    önce yeryüzünde yaşayanlar, yok olan uluslar, barajın arkasındaki insanlar, evrenin
    sırları: Taht, Korunmuş Tablet, En Büyük Sınırın Lotu Ağacı ve görünmeyenin anahtarları.
    Bir kitabın her ayeti, anlatımı ve bölümü kaynağına, her görüş ise yazarına atfedilir.'
  badge: Universe Tarayıcı
  status: Bu versiyon, {s} bölümünde {n} kayıt içerir; metinler ise bir insan tarafından
    okuyulana kadar taslak olarak kalır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Kaynaklar, çağdaş okuyucunun amaçladığı anlamda ''dünya dışı varlıklar''dan
    değil, Tanrı''nın göklere yaydığı hayvanlardan, çoklu dünyalardan, cinler ve meleklerden,
    önceki yaratılışlardan ve yok olmuş uluslardan bahseder. Bu tarayıcı, bu özel
    referansları toplar ve yorumcuların yorumlarını her birinin yanına yerleştirir.
    Herhangi bir yargı verilmez: alimler aktarım zincirinde farklı görüş bildirirse
    veya tartışırsa, kayıt bunu kaydeder ve her iki tarafı da belgeler. Kur''an ayetleri
    bir referans tablosundan seçilir ve tüm referanslar, bölümlerin metinleri üzerine
    dikkatlice korunan bir sözlükte inşa edilirken, inşa sırasında bulunur. Yeni bir
    kitap yayımlanırsa, referansları bölümlerinin yayımlandığı gün görünür.'
  api: Tam koleksiyon şu tarihte mevcuttur
  sections_title: Tarayıcı Bölümleri
  filter_label: Evren kayıtlarını filtrele
  filter_none: Sonuç yok.
