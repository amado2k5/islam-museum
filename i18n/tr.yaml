dukhul:
  title: İslam'a Giriş Tarayıcısı
  lede: 'Müzenin kaydında İslam kapısı iki yönde: ilk girişler — Hamza ve Ömer, Fars''tan
    Hicaz''a arayıp geçen Selman, Suheyb, iman eden haham Abdullah ibn Selam, Temim
    ed-Dari, esir edilip salıverilen Sümaeme ibn Üsal — ve hikâyelerini taşıyan olaylar;
    bugünün mühtedileri — Yusuf İslam, Malcolm X, Muhammed Ali, Marmaduke Pickthall,
    Martin Lings, Murad Wilfried Hofmann, Hamza Yusuf, Abdal Hakim Murad — mücadeleleri
    ve sonraki eserleri; çıkanlar — Habeşistan''da Ubeydullah ibn Cahş, dönen Abdullah
    ibn Sa''d, mürted peygamberler Müseylime, Secah, Tuleyha ve Esved el-Ansi ve bugünün
    eski Müslümanları; ve hükümler — içeri alan şehadet, fakihlerin tartıştığı ridde
    ve küfür.'
  badge: Gezgin
  method_note: 'Üyelik kaydın kendisinden okunur: tarayıcı spec''indeki adlandırılmış
    kümeler — bu konu için müzenin kişileri, kavramları, görenekleri, eserleri, grupları
    ve pasajları arasından seçilmiş — dukhul-browser etiketli kayıtlarla birleşir
    ve derleme anında bu bölümlere hesaplanır.'
  sections:
    converts: İlk girişler
    modern: Bugünün mühtedileri
    leavers: Çıkanlar
    rulings: Hükümler — şehadet, küfür, ridde
    sunnah: Sünnet
    curated: Seçilmiş kayıtlar
maadin:
  title: Madenler, Para ve Zenginler Tarayıcısı
  lede: 'Mesakin tarayıcısının öbür yüzü — müzenin kaydında mal ve zenginler: madenler,
    altın ve gümüş ve yerden çıkarılan cevherler; para, dinarlar ve dirhemler ve kâğıt
    sekk; zinet, mücevherat ve taçlar; zenginler — miras olarak kervanlar bırakan
    Abdurrahman ibn Avf, Rûme kuyusunu satın alan Osman, Talha, Zübeyr, Sa''d, haccı
    Kahire''de altın fiyatını oynatan Mansa Musa ve her çağın a''yan ve seçkinleri
    — ve kaydın mala karşı tuttuğu hikâyeler: hazinesiyle yerin yuttuğu Karun, kınanan
    istifçilik, cimrilik ve israf; altın, gümüş ve kenz hükümleri; külçe ve mücevher
    fetvaları; ve libas ile zinetin sünnet babları.'
  badge: Gezgin
  method_note: 'Üyelik kaydın kendisinden okunur: tarayıcı spec''indeki adlandırılmış
    kümeler — bu konu için müzenin kişileri, kavramları, görenekleri, eserleri, grupları
    ve pasajları arasından seçilmiş — maadin-browser etiketli kayıtlarla birleşir
    ve derleme anında bu bölümlere hesaplanır.'
