  new:
    name: İslam'a yeni
    line: Kısa süre önce şehadet getirdim
    h: Hoş geldiniz. Henüz hiçbir şey bilmeniz gerekmiyor.
    thoughts:
    - Bunu doğru yapıyor muyum?
    - Her şeyi bir anda değiştirmem mi gerekiyor?
    - Aileme nasıl söylerim?
    - Nereden başlamalıyım?
    steps:
    - Beş şartın ne olduğu, sade sözlerle.
    - İlk namazlar, her seferinde bir adım.
    - Akrabalar, eşler ve âlimlerin akrabalık bağları hakkında söyledikleri.
    - İslam'ı ilk kabul edenlerin izinden bir yol.
    - Hicri takvim ve Ramazan'ın her yıl yeniden gelişi.
    - Genellikle daha sonra gelen sorular.
    block_title: İlk haftadan ikinci yıla
    block_sub: Birçok yeni Müslümanın anlattıkları, genellikle karşılaştıkları sırayla.
      Bunlar genel temalardır, bir araştırma değildir; bağlantılı sayfalar kaynakları
      verir.
    items:
    - t: İlk hafta
      x: Şehadet getirmek ve yadırgatıcı gelebilen ilk namazlar.
    - t: İlk ay
      x: İnsanlara söylemek. Kimi sevinir, kimi kırılır, kimi sessiz kalır.
    - t: Üçüncü ay
      x: Yiyecek, içecek ve günlük hayat soruları birikir.
    - t: İlk Ramazan
      x: Birçokları için her şeyin gerçek olduğu an.
    - t: İlk yıl
      x: Şüphe ve yalnızlık yaygındır; ani bir huzur da öyle.
    - t: İkinci yıl
      x: Bilgi arayışı ve kendileri de yeni olmayan arkadaş arayışı.
  back:
    name: İslam'a dönüş
    line: Müslüman doğdum ve geri dönüyorum
    h: Yeniden hoş geldiniz. Bulunduğunuz yerden başlayın.
    thoughts:
    - Namaz kılmayı unuttum.
    - Uzak kaldığım yıllardan utanıyorum.
    - Her şey hem yabancı hem tanıdık geliyor.
    - İnsanlar beni yargılar mı?
    steps:
    - Namaz yeniden, küçük ve net bir başlangıçla.
    - Ne diyeceğinizi bilmediğinizde söylenecek sözler.
    - Beş şarta yetişkin gözüyle yeni bir bakış.
    - Öğretmenler ve rahmet ile dönüşten nasıl söz ettikleri.
    - Camiler ve ilim mekânları.
    block_title: Dönenlerin söylediği üç şey
    block_sub: Hatıralardan ve röportajlardan genel temalar; müze bunları bir kural
      olarak sunmaz.
    items:
    - t: Bulunduğunuz yerden başlayın
      x: Birçokları beş değil, bir namazla başladığını anlatır.
    - t: Değişmeyen
      x: Sözler çocukken duyulanlarla aynıdır.
    - t: İnsanları yeniden bulmak
      x: Bir cemaat çoğu zaman adınızı söyleyen tek bir kişidir.
  five:
    name: Beş yıl sonra
    line: Derinlik istiyorum, yeni başlayanlar listesi değil
    h: Temelleri biliyorsunuz. İşte uzun yol.
    thoughts:
    - Yorgunum ve bırakmak istemiyorum.
    - Benden tüm Müslümanlar adına konuşmam isteniyor.
    - Çocuklarım iki dünya arasında büyüyor.
    - Düzgünce okumak istiyorum.
    steps:
    - Fıkıh mezhepleri nasıl delil getirir ve neden ayrışır.
    - Kur'an'ı müfessirleriyle okumak.
    - Siyer'i kaynaklarıyla derinlemesine.
    - Müslüman olanların ilk neslinin izinden bir yol.
    - Okunacak âlimler ve müzenin onların öğretisine dair kayıtları.
    block_title: Uzun yol, yıl yıl
    block_sub: İnsanların yıllar geçtikçe sıkça anlattığı temalar. Genel temalar,
      araştırma değil.
    items:
    - t: 1 ile 2. yıllar
      x: Uygulamayı öğrenmek ve kime soracağını bilmek.
    - t: 2 ile 3. yıllar
      x: 'Yorgunluk ya da tersi: herkesi düzeltme isteği.'
    - t: 3 ile 5. yıllar
      x: Evlilik, çocuklar, iş ve nereye ait olduğunuz.
    - t: 5. yıl ve sonrası
      x: Başkalarının sorduğu kişi olmak ve Müslüman olarak yaşlanmak.
  curious:
    name: Meraklı
    line: Sadece bunun ne olduğunu bilmek istiyorum
    h: Dolaşın. Burada hiçbir şey sizden karar vermenizi istemez.
    thoughts:
    - Bu gerçekte nedir?
    - Bana beklemediğim bir şey gösterin.
    - Bu insanlar kim?
    - Müslümanlar kısaca neye inanır?
    steps:
    - Her seferinde rastgele bir eser, yer ya da kişi.
    - Tüm tabloyu yarım saatte.
    - 'Yolculuklar: yerler ve insanlar üzerinden anlatılan bir hikâye.'
    - İnsanların ayet ve işaret olarak gösterdiği şeyler.
    block_title: Hayran kalınacak bir şey
    block_sub: Müzenin bir hikâyeyi nasıl sunduğuna bir örnek.
    items:
    - t: İsra ve Miraç
      x: İslam geleneğinde Peygamber bir gece Mekke'deki Mescid-i Haram'dan en uzak
        mescide, oradan da göklerin ötesine götürülür. Klasik âlimler bunun beden,
        ruh ya da her ikisiyle bir yolculuk olup olmadığını tartışmıştır. Müze her
        görüşü kaynağıyla gösterir.
  doubt:
    name: Şüphede
    line: Bir kenara bırakamadığım sorularım var
    h: Sorularınız hoş geldi, zor olanlar da.
    thoughts:
    - Doğru mu?
    - Allah neden acı çekmeye izin veriyor?
    - Hiçbir şey hissetmezsem?
    - Sormaktan korkuyorum.
    steps:
    - Her biri iki ya da daha fazla sesli, hüküm vermeyen sorular.
    - Kur'an'ın sormak ve şüphe hakkında söyledikleri.
    - Peygamberler ve onlardan şüphe eden kavimler.
    - Âlimler arasındaki tartışmalar, kendi sözleriyle.
    - Mucizeler ve âlimlerin onları nasıl tarttığı.
    block_title: Birden fazla sesi olan sorular
    block_sub: Her biri önce Sünni görüşleri, sonra akademik bakışı gösterir; müze
      hüküm vermez. Her birinin kısa bir özetidir; bağlantılı sayfalar kaynakları
      verir.
    items:
    - q: Allah neden acı çekmeye izin veriyor?
      al: Sünni görüş
      a: Âlimler dünyadaki sıkıntıları, tamamı görülmeyen bir hikmet içinde birer
        imtihan olarak anlatır; sabır ve teselli vaat edilmiştir.
      bl: Akademik bakış
      b: Teodise sorunu olarak ele alınır ve birçok gelenekte tartışılmıştır.
    - q: Bir insan şüphe edip hâlâ Müslüman olabilir mi?
      al: Sünni görüş
      a: Klasik yazarlar, bilgi arayarak giderilen geçici şüphe ile inkârı birbirinden
        ayırır.
      bl: Kişisel anlatılar
      b: Müslüman olanların ve dönenlerin hatıraları çoğu zaman şüpheyi, bazen birden
        fazla kez anlatır.
  research:
    name: Araştırıyor
    line: Kaynaklara, tarihlere ve yönteme ihtiyacım var
    h: Her iddianın bir kaynağı var. Yöntemle başlayın.
    thoughts:
    - Bu tarih nereden geliyor?
    - Bunu kaynak gösterebilir miyim?
    - Verileri indirebilir miyim?
    - Bir rivayet nasıl derecelendirilir?
    steps:
    - Kayıtlar nasıl yazılır ve kaynaklandırılır.
    - Rivayetler nasıl ve kim tarafından derecelendirilir.
    - Dillerde ve kayıt türlerinde arama.
    - Kişileri, yerleri ve eserleri bir graf olarak keşfedin.
    - 'Açık veri: biçimler, lisanslar, API.'
    block_title: Yöntem ve kaynaklar
    block_sub: Bir araştırmacının ilk karşılaştığı şeyler.
    items:
    - t: Herhangi bir kaydı alıntılayın
      x: Her kaydın kalıcı bir kimliği ve alıntı satırı vardır.
    - t: Köken bilgisi
      x: 'Yapay zekâyla yazılan kayıtlar bir köken bloğu taşır: hangi model, hangi
        çalıştırma, hangi kaynaklar.'
    - t: Açık veri
      x: Veri CC0, metin CC BY-SA, kod MIT.
    - t: Sınırlar belirtilir
      x: Müze, hangi kayıtların taslak olduğunu ya da henüz bir insan tarafından okunmadığını
        söyler.
  learn:
    name: Dinimi öğreniyorum
    line: Uyguluyorum ve nedenini bilmek istiyorum
    h: Ne yapılacağından neden yapıldığına.
    thoughts:
    - Namaz kılıyorum ama neden böyle olduğunu bilmiyorum.
    - Bu hükmün delili nedir?
    - Âlimler neden ayrışır?
    - Sonra nereye gideyim?
    steps:
    - Şartlar, kaynaklarıyla.
    - İbadet ayrıntılı olarak, gerekçeleriyle.
    - Hükümler ve nasıl çıkarıldıkları.
    - Mezhepler neden ayrışır, örneklerle.
    - Rehberli yollar ve kurslar, seviye seviye.
    block_title: Hükümler gerekçeleriyle
    block_sub: 'Biçimin küçük hâli: ne, neden, nereden geliyor, âlimler nerede ayrışıyor.'
    items:
    - t: 'Namaz: ne'
      x: Günde beş vakit, belirli zamanlarda, kıbleye dönerek.
    - t: 'Namaz: neden'
      x: Âlimler onu zikir, disiplin ve cemaatle ilişkilendirir.
    - t: 'Namaz: nereden geliyor'
      x: Kur'an ayetleri ve rivayetler, her biri kaynaklı.
    - t: Âlimler nerede ayrışır
      x: Ellerin konumu gibi ayrıntılar, mezhebe göre gösterilir.
  challenge:
    name: İtiraz ediyor
    line: Katılmıyorum ve delili görmek istiyorum
    h: En zor örneği getirin. Kaynaklar açık.
    thoughts:
    - Bunu kabul etmiyorum; neden kabul ettiğinizi gösterin.
    - Bu rivayetin sağlam olduğuna kim karar verdi?
    - Eleştirmenler ne diyor?
    - Bu bir gelenek mi, bir metin mi?
    steps:
    - Tartışmalı konular, her taraf etiketli.
    - Bir rivayet nasıl derecelendirilir ve sınırları.
    - Tartışmalar ve itirazlar özgün biçimiyle.
    - Müzenin iddia etmedikleri.
    block_title: Tartışmalı konular
    block_sub: Her konu, bir görüşü belirtmeden önce o görüşü savunan topluluğu adıyla
      anar.
    items:
    - t: Rivayetlerin güvenilirliği
      x: Derecelendirme nasıl işler, değerlendirenler nerede ayrışır ve eleştirmenler
        ne der.
    - t: İlk nesiller arasındaki farklar
      x: Önce Sünni kaynaklardan, sonra diğerlerinden anlatılır; her biri etiketlidir.
    - t: Dışarıdakilerin zor bulduğu hükümler
      x: Metinsel dayanak, âlim görüşlerinin yelpazesi ve çağdaş tartışma.
    - t: Müzenin yapmayacağı şey
      x: Hüküm vermez, vaaz etmez.
  pass:
    name: Sadece uğruyorum
    line: Bana üç dakika verin
    h: Üç dakika, üç durak, sonra esenlikle gidin.
    thoughts:
    - Sadece bir anım var.
    - Bana yalnızca güzel bir şey gösterin.
    - Paylaşabileceğim bir şey var mı?
    - Belki geri dönerim.
    steps:
    - Yerler ve insanlar üzerinden anlatılan bir hikâye.
    - Bir eser, yer ya da kişi, resmiyle.
    - Tüm tablo yarım saatte, geri döndüğünüzde.
    block_title: Gitmeden önce bir söz
    block_sub: Bilmeye değer üç şey.
    items:
    - t: Sizden hiçbir şey istenmez
      x: Hesap yok, kayıt yok.
    - t: Sonra devam edin
      x: Bakış açınız yalnızca bu cihazda hatırlanır.
    - t: Bir sayfayı paylaşın
      x: Her sayfanın kendi kalıcı bağlantısı vardır.
nuzul:
  title: Nüzul Sebepleri Tarayıcısı
  lede: 'Müzenin kaynaklarındaki her nüzul sebebi rivayeti — bir ayet veya surenin
    ardındaki olay ya da soru: Hira mağarasındaki ilk vahiy, hicap, içki, ifk, li''an
    ve zihar ayetleri ile kıblenin değişmesinin sebepleri — sahabe, tabiin ve tefsir,
    hadis, siyer kitaplarının aktardığı gibi ve derlenen her kitaptaki her sebep —
    yeni metinler geldikçe büyüyen kaynaklı kayıtlar.'
  badge: Nüzul sebepleri gezgini
  status: Bu yapı {s} bölümde {n} kayıt içerir; metinler bir insan okuyana kadar taslaktır.
  method_title: Tarayıcının yöntemi
  method_note: Buradaki her kayıt, kaynakları ve nesriyle sıradan bir müze kaydıdır.
    Sebepler, derleme sırasında pasaj metinleri üzerinde korunan bir dedektörle bulunur
    — açık sebep kalıpları («سبب نزول», «أسباب النزول») ve ayet bağlamına bağlı vahiy
    kalıpları («نزلت هذه الآية», «فأنزل الله», «نزلت في فلان», «نزل جبريل»); bunlar
    bir ayet, sure veya Kur'an kelimesinin yanında durmalıdır; diğer iniş anlamları
    dışarıda kalır — yağmur, dolu, sel, felaket, konuklar, İsa'nın inişi ve tıbbi
    anlamlar — doğrulanmış yanlış pozitifler kimliğe göre hariç tutulur ve daha sonra
    derlenen her kitap, pasajları grafiğe indiğinde sebeplerini otomatik olarak buraya
    getirir; seçilmiş kayıtlar nuzul-browser etiketiyle katılır. Her pasaj gerçek
    bir sebep bildirdiğinde sebep, nüzul ilmi hakkında olduğunda zikir olarak işaretlenir
    ve ravi rozetleri rivayeti peygamber, sahabe, tabi'i veya sonraki olarak sınıflandırır.
  api: Tüm küme şu adreste mevcuttur
  sections_title: Tarayıcının bölümleri
  narrators_title: Rivayet kuşağı
  all_narrators: Tüm kuşaklar
  filter_label: Sebepleri süz
  filter_none: Sonuç yok.
  empty: Bu yapıda henüz nüzul sebebi kaydı yok.
  kinds:
    occasion: bir sebep bildirir
    mention: ilim hakkında
  narrators:
    prophetic: Peygamber
    companion: Sahabe
    tabii: Tabi'i
    later: Sonraki
  sections:
    quran:
      title: Kur'an'da
      desc: Kur'an'ın kendi iniş koşulları hakkında söyledikleri — cevap verdikleri
        olayı veya soruyu adlandıran ayetler ve donmuş külliyatın bir sebep bildiren
        pasajları.
    sunnah:
      title: Sünnette
      desc: Hadis külliyatının sebep rivayetleri — bir ayet indiğinde Peygamber'in
        açıkladıkları, kendisine sorulan sorular ve ayetlerin cevap verdiği olaylar;
        Sahih-i Buhari, Sahih-i Müslim, Muvatta ve Sünen'de.
    seerah:
      title: Siyerde
      desc: Siyer ve tarih kitaplarının taşıdığı sebepler — biyografinin olayları
        içindeki vahiy sahneleri — yeni siyer pasajları indikçe kendini doldurur.
    books:
      title: Diğer kitaplarda
      desc: Derlenen her diğer eserin sebep rivayetleri — esbab ve tefsir kitapları,
        tarih, edeb — pasajları ulaştıkça eserin türüne göre sınıflandırılır.
    curated:
      title: Sebepler hakkındaki kayıtlar
      desc: 'Müzenin sebeplerin kendisi hakkındaki seçilmiş kayıtları: adlı kayıtlar
        olarak meşhur nüzul sebepleri, esbab eserleri ve baskıları ve bu ilmin kavramları.'
  viz:
    title: Sebepler nerede durur
    caption: Işınlar gök çizgisinden burada sebep rivayeti taşıyan surelere iner —
      {n} kayıt surelerinin üzerinde; sure numarası olmayan {e} kayıt aşağıdaki listelerdedir.
    how: Işınları yalnızca o kuşağın rivayetleriyle renklendirmek için bir kuşak seçin;
      hepsini görmek için tekrar seçin.
    hint: Nereye indiğini görmek için bir ışının üzerine gelin, odaklanın veya dokunun.
    sky_title: Sureler, mushaf sırasıyla
    sky_note: '{total} surenin {n} tanesinde sebep rivayeti vardır; gerisi soluktur.'
    count_in: '{n} kayıt'
tajwid:
  title: Tecvid ve Tilavet Tarayıcısı
  lede: 'Müzenin kaynaklarının Kur''an harflerinin nasıl telaffuz edildiği ve tilavetinin
    nasıl icra edildiği hakkında söylediği her şey: on yedi mahrec ve harflerin sıfatları,
    medler, gunne, kalkale ve sakin nun, sakin mim ve tenvin hükümleri, vakıf ve ibtida;
    Kur''an''ın emrettiği tertil, okuma ve dinleme adabı, sahiplerinin adlarıyla anılan
    ve tartışılan nağmeler, ve bu sanatı taşıyan okuyucular ile öğretim metinleri.
    Her ayet, rivayet ve kitap pasajı kaynağıyla verilir ve her görüş sahibine atfedilir.'
  badge: Tecvid ve tilavet gezgini
  hero_ayah: وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا
  hero_naskh: Harfler mahreçlerinden nasıl yükselir ve tilavet nasıl icra edilir
  status: Bu derleme {s} bölümde {n} kayıt içeriyor; her kayıt kaynaklarını listeler
    ve metinler bu kaynaklardan yapay zeka ajanları tarafından yazılmış olup henüz
    bir insan tarafından okunmamıştır.
  method_title: Tarayıcının yöntemi
  method_note: 'Bu tarayıcı, birbiriyle bağlantılı iki konuda söylenen ve yazılanları
    toplar: harflerin nasıl telaffuz edildiği — mahreçleri, sıfatları ve hükümleri
    — ve tilavetin nasıl icra edildiği, dinlendiği ve öğretildiği. Kur''an ayetleri
    gözden geçirilmiş bir tablodan gelir: tertil ve hak tilavet ayetleri, okuyanın
    ve dinleyenin adabı, öğretilen ve işitilen tilavet. Kur''an metni müzede yalnızca
    dondurulmuş dosyalarından görünür; bir ayetin sözleri asla yeniden yazılmaz. Diğer
    her metin — hadis, siret, sahabe ve tabiin haberleri ve kitaplar — derleme sırasında
    her pasaj üzerinde korunaklı bir sözlükle bulunur; böylece daha sonra hasat edilen
    bir kitaptaki bir anma, pasajının geldiği gün görünür. Tarayıcı hüküm vermez:
    alimlerin ayrıştığı yerde, nağmeler ve makamlarda olduğu gibi, kayıt her görüşü
    sahibiyle birlikte verir.'
  api: Tüm küme şurada mevcuttur
  topics_title: Tarayıcının yedi konusu
  sections_title: Tarayıcının bölümleri
  filter_label: Tecvid ve tilavet kayıtlarını süz
  filter_none: Eşleşme yok.
  empty: Bu derlemede henüz tecvid veya tilavet kaydı yok.
  kin_title: Kardeş tarayıcılar
  topics:
    tartil: Ölçülü okuma
    adab: Tilavetin adabı
    ahkam: 'Hükümler: mahreçler ve sıfatlar'
    qurra: Okuyucular ve hocalar
    mutun: Öğretim metinleri
    maqamat: Nağmeler
    taalim: Öğretmek ve öğrenmek
  topics_desc:
    tartil: 'Kur''an''ı tertil ile okuma, kıraatine uyma ve dili ağır tutma emri,
      ve ölçülü okuma tempoları hakkında rivayet edilenler: tahzir, tedvir, hedr ve
      tersil.'
    adab: Euzü ve besmele, Kur'an ile güzel ses, dinleme ve susma, tilavet secdeleri
      ve hatim, ve sesli ya da içten okuma.
    ahkam: On yedi mahrec ve harflerin sıfatları, medler, gunne, kalkale, tefhim ve
      terkik, sakin nun, sakin mim ve tenvin hükümleri, ve vakıf ile ibtida.
    qurra: Sahabe ve tabiin arasındaki okuyucular, yedi ve on imam ile ravileri, icazet
      hocaları ve kurranın tabakaları.
    mutun: 'Okutulan ve ezberlenen tecvid metinleri: Tuhfetü''l-Etfal, Cezriyye, Şatıbiyye,
      Tayyibetü''n-Neşr ve kıraatlerin diğer öğretim metinleri.'
    maqamat: 'Tilavette nağme ve makamlar: tartışmalı bir sanat; kayıt her görüşü
      sahibinin adıyla verir.'
    taalim: 'Tilaveti öğretmek ve öğrenmek: «içinizde en hayırlınız Kur''an''ı öğrenen
      ve öğretendir», halkalar ve kuttaplar, ve hocaların huzurunda okumak.'
  sections:
    quran:
      title: Kur'an'da
      desc: Tertil ve hak tilaveti emreden ayetler, okuyanın ve dinleyenin adabı ve
        öğretilen ve işitilen tilavet — ayetlere ve kitaplara karşı gözden geçirilmiş
        bir tablodan.
    sunnah:
      title: Sünnette
      desc: Hadis külliyatının Peygamber'in kıraati ve tilaveti, Kur'an ile güzel
        ses, okuma ve dinleme adabı ve okuyucu ve hoca haberleri hakkında rivayet
        ettikleri.
    seerah:
      title: Sirette
      desc: Siret kitaplarının davet olayları içinde Kur'an'ın okunması ve öğretilmesi
        hakkında taşıdıkları — bu bölüm, bu tür anmaları taşıyan yeni siret metinleri
        geldikçe kendiliğinden dolar.
    tafsir:
      title: Tefsirde
      desc: Hasat edilen tefsirlerin tilavet ve tertil ayetleri ve hükümleri hakkında
        söyledikleri.
    books:
      title: Diğer kitaplarda
      desc: 'Kur''an ilimleri, kıraatler, tarih, biyografi ve edebiyat: Kur''an, hadis,
        siret ve tefsir ötesinde bu konuları işleyen her hasat edilmiş kitap ve bundan
        sonra gelecekler.'
    ahkam:
      title: Hükümler
      desc: Müzenin on yedi mahrec ve harflerin sıfatları, sakin nun, sakin mim ve
        tenvin hükümleri, medler ve gunne, ve vakıf ile ibtida hakkındaki kayıtları.
    adab:
      title: Adab
      desc: 'Tilavetin adabı: euzü ve besmele, huşu, dinleme, tilavet secdeleri ve
        Kitab''ın hatmedilmesi.'
    taalim:
      title: Öğretmek ve öğrenmek
      desc: Kur'an'ın sahabe ve tabiin arasında öğretilmesi, okunması ve taşınması
        hikâyeleri, halkaları ve mektepleri, senetleriyle.
    qurra:
      title: Okuyucular
      desc: Sahabe ve tabiin arasındaki okuyucular, yedi ve on imam ile ravileri,
        ve icazet hocaları ile öğrencileri.
    mutun:
      title: Öğretim metinleri
      desc: Müzenin tanımladığı tecvid ve kıraat metinleri, şerhleri ve baskılarıyla.
    maqamat:
      title: Nağmeler
      desc: Tilavetin nağmeleri ve makamları ve onlar hakkında söylenenler, her görüş
        sahibinin adıyla, hükümsüz.
  map:
    title: Mahreçlerin haritası
    note: İbnü'l-Cezeri'nin el-Mukaddime el-Cezriyye'de saydığı on yedi telaffuz noktası,
      nefesin yoluna boğazın boşluğundan dudaklara ve geniz boşluğuna kadar dizilmiş
      — her harf bölgesinin renginde bir diskte.
    aria: Arapça harflerin on yedi telaffuz noktasının, boğazdan dudaklara ve geniz
      boşluğuna kadar şematik haritası
    counts: Kur'an'da {v} ayet, kitaplarda {p} pasaj, bu tarayıcıda {r} derlenmiş
      kayıt.
