  method_note: 'Buradaki her kayıt, kaynaklarıyla birlikte sıradan bir müze kaydıdır.
    Liste metinleri, pasaj metinleriyle korunan bir sözlükte oluşturulduğunda keşfedilir:
    iyi veya kötü işler sayısı, "on kat fazla" ve "yedi yüz kez", eserin yazılması,
    kötü işlerin silinmesi, günahların kaldırılması ve kefaret, bahsedilenlerin affı,
    dereceler ve karatlar, daha büyük bir eylemin ne olduğunu, bir atomun ölçeği ve
    ağırlığını, onurlu yazarları ve iş yazarlarını, iflas etmiş ve yükü olanları,
    ve hesaplamayı. İyi veya kötü eylemlerin sayısız olarak sadece iyi ve kötü davranışların
    bahsedilmesi iyi ve kötü tarayıcılarda kalır. Belgelenen yanlış pozitifler tanımlayıcı
