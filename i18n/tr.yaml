    haram: yasak
    both: Helal ve haram birlikte
  sections:
    quran:
      title: Kur'an'da
      desc: 'İzin ve Yasak Ayetleri: İnekler, sofralar, hayvanlar ve arılar gibi restoranlarda
        yasak olanlar; iyi şeylerin yasak olduğu, Kitap Ahlından yiyecekler, deniz
        yoluyla balıkçılık, En-Nisa Suresi''nde yasak kadınlar; tefecilik ve ahlaksızlık
        yasağı; Allah''ın izin verdiği şeylerin yasak olması ve bilgisiz ''bu zaylal,
        bu hariç'' demenin yasaktır.'
    sunnah:
      title: Yıllık
      desc: 'İki Sahih olan El-Muvatta ve Sünan''ın hadisleri ile Sahabe ve Müridlerin
        münzevi kitaplarındaki görenekleri: "Yasal olan açıktır, yasak olan açıktır,
        aralarında şüpheler vardır," "Her sarhoş edici şey yasaktır," "Bizim için
