        "Müslüman, dilinden ve elinden Müslümanların güvende olduğu kişidir," "Münafık
        ayeti üçdür," doğruluk hadisleri, bağları sürdürme, komşuluk ve öğüt, Satış
        Kitabı, Nezaket, İpotek, vasiyetler, şahitlikler ve hükmü talepler arasındadır
        ve bunları alıntılayan, öğreten veya ele alan her rapor arasındadır.'
