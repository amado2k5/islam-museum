    tawaif:
      title: Topluluklar ve Kabileler
      desc: 'Arap dinleri ve kabileleri içindeki mezhepler, bazıları İslam dışında
        bir dine mensup olanlardı: Banu Kaynuqa, Al-Nadir, Qurayza, Haybar Yahudileri,
        Necer, Gassan ve Lakhm Hristiyanları—kitaplarda onlara denildiği gibi.'
    shuub:
      title: Halklar ve Uluslar
      desc: 'Kaynaklarda bahsedilen uzak ve yakın toprakların halkları şunlardı: Romalılar,
        Persler, Habeşliler, Kıptiler, Türkler, Hintliler, Çinliler, Berberiler, Zanjlar,
        Slavlar, Ruslar ve Nabatialılar—krallık ve eyaletlerin sakinleri.'
    mushrikun:
      title: Arap Çoktanrılılar
      desc: 'İslam öncesi Arapların putperestliği: Mekke, Kureyş ve dinlerini, putlarını,
        ibadet edenleri ve fetih öncesi nedenlerini takip edenler — ayrı bir kategoridir
        çünkü onlar Kitap Ahli ya da başka bir mezhep değildir.'
    ayan:
      title: Önemli Kişiler ve İnsanlar
      desc: 'Bu milletlerden gelen kaynaklar tarafından isimlendirilen kişiler şunlardır:
        Herakleios, Hosrov, El-Neceshi, El-Muvaqq, El-Mundhir bin Sawa, Medine Yahudilerinin
        hahamları, Kureyş''in müşrikləri liderleri ve İslam''dan önce başka bir dine
        mensup olanlar.'
    sukun:
      title: Konut ve Konut
      desc: 'Bu ulusların kurulduğu topraklar ve yerler: Necer, Haybar, El-Hirah,
        Bosra, Yatrib, El-Ahqaf ve Petra — her yer kendi anlatımıyla anlatılır.'
    mafahim:
      title: Kavramlar
      desc: 'Bu milletlerle ilgili kaynak sözlüğü: Kitap Ahli, Zimmi Halkı (Dhimmi)
        (Dimmi) (Dzimmi) (Dzımmi) (Çoktanrılılık), İnançsızlık, İkiyüzlülük, Dürüst
        Alim ve Ümmet — ilişkinin sınıflandırıldığı anlamlar.'
    kutub:
      title: Kitaplar ve Kaynaklar
      desc: 'Bu ulusların haberlerini koruyan eserler: tefsir, özgün koleksiyonlar,
        biyografiler, seferler, tarihler, fetihler ve mezhep ve inanç kitapları —
        her kitap kendi kapasitesinde.'
    dhikr:
      title: Kaynaklarda BahsEdilmesi
      desc: Müzedeki her ayet, pasaj, eylem, olay ve soru, bir millet, din, mezhep
        veya gayrimüslim insanlardan bahseder — burada 'anılması' ya da metindeki
        tanımlı adıyla ve ona yönelik bölümleriyle birlikte 'anılmak' ile ilgilidir.
  viz:
    caption: 'Metinler dünyasının haritası: Mekke ve Medine merkezde, Romalılar kuzeybatıda
      ve Persler kuzeydoğuda, Habeşistan güneybatıda, Kitap Halkı haritanın ortasında,
      ufkun altındaki yok olmuş uluslar ve kenarlarda uzak halklar. Her nokta gerçek
      bir kayıt ve gerçek bir bağdır.'
    aria: 'Metin Dünya Haritası: Mekke ve Medine Çevresindeki Uluslar, Dinler ve Halkların
      Bölgeleri'
    legend: Bölüm Anahtarı
    makka: Mekke
    madina: Şehir
