hudud:
  title: Tanrı'nın sınırlarını ve büyük günahlarını inceleyen
  lede: 'Müze kaynaklarında Tanrı''nın sınırları ve büyük günahlarına dair her bahs:
    "Bunlar Tanrı''nın sınırlarıdır" ve "Ve kim Tanrı''nın sınırlarını aşarsa," iki
    Sahih, Al-Muwatta ve Sunan''daki zina, hırsızlık ve iftira sınırları, Sahabeler
    ve Takipçilerin biyografisi ve raporlarında cezaların belirlenmesi, büyük ve suçlu
    günahların listeleri ve her kitaptaki her bahs — yeni bir metin eklendiğinde konuşan
    kaynaklarıyla kayıtlar.'
  badge: Tanrı'nın sınırlarını ve büyük günahlarını keşfetmek
  status: Bu yapı, {s} bölümünde {n} kayıt içerir; metinler taslaklardır, böylece
    bir kişi onları okuyabilir.
  method_title: Tarayıcı Müfredatı
