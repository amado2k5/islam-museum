    bir sözlükte inşa edilir: Peygamberlik tıbbı — kupa kullanma, koterizasyon, ruqyah,
    bal, kara ot, qist, senna, talbinah, trüf, ajwa, ithamad, al-ladud ve s''ut; tıp
    — hekim, hastalık ve hasta, ağrı, ateş, veba ve salgın, enfeksiyon, cüzzam, hastalık
    isimleri, hasta kliniği, hastane; anatomi — sperm, sülük ve embriyo, damar, tendon,
    aort, kohl, eklemler, farenge, organlar; cerrahi — yara iyileşme, kararlılık,
    flebit, sünnet, ateller, kırık onarımı; tıp — tıp ve hastalık, zehir ve panzehir,
    ilaçlar; ve tedavi — iyileşme, iyileşme, şifa ve yasak şeylerle şifa. Belirsiz
    kelimeler korunur: "Kalplerinde hastalık vardır" hariç tutulur, "ateş" sadece
    ateş kelimeleriyle birlikte kabul edilir, ateş değil, "qist" ilacın bileşiklerinde
    adalet değil, "bal" ve "ajwa" tıbbi terimlerin yanında yer alır, "terzinin zehiri"
    hariç tutulur, "adwi" yani düşman hariç tutulur ve "jarrah" kelimeleri sadece
    tedaviyle sayılır, kan parasıyla değil. Kur''an ve hadis dışındaki kitaplarda
    "hastalık" veya "şifa" kelimeleri tek başına yeterli değildir. Daha sonra toplanan
    her kitap, bölümleri çizime girdiği gün tıbbi metinlerini otomatik olarak buraya
    getirir; seçilen kayıtlar ise kapıları etiketlenmiş tibb-browser etiketiyle kaydedilir.
    Müze, kaynaklarda ne olduğunu açıklar ve sahiplerine atfeder, tıbbi tavsiye veya
    fetva vermez.'
