    sığınak arayan ve bağışlama arayan fiiller ve duanın kendisinden bahseden pasajlar;
    Tanrı dışındaki çağrılar 'da'wah' ve 'yad'a' (çağrı) ile saf övgü anlamları dışlanır;
    belirli artikle belgelenen yanlış pozitifler hariç tutulur; daha sonra gerçekleşen
    her kitap, bölümleri tabloda göründüğünde otomatik olarak dualarını burada içerir;
