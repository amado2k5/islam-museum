arabiyya:
  title: Arapça Tarayıcı Kur'an'ın Dili
  lede: 'Kur''an''ın Arapça dediği ve kaynakların anlattığı şekliyle: Kur''an''ın
    dilinden bahsettiği ayetler, Peygamber, Sahabeler ve Takipçiler''den rivayet edilenler,
    dinleyenlerin rivayetleri, ifadesinin mucizesi üzerine tartışma, ardından Arapça''nın
    tarihi, yazı yazısı, bilimleri, lehçeleri, alimleri, alimleri ve kitapları.'
  badge: Arapça Dil Gezgini
  status: Bu baskıda, {v} Kur'an'ın kendi dilinden konuştuğu, {p} hadis, biyografi,
    tefsir ve Arapça hakkında toplanmış kitaplardan bir metin içerdiği bir ayet ve
    {r} düzenlenmiş bir kayıttır. Metinler kendi kelimeleriyle yakalanmıştır; bazıları
    Arapçadan geçerken bahseder; her metin kendi sayfasına ve kaynağına açılır.
  method_title: Tarayıcı Müfredatı
  method_note: Buradaki hiçbir şey yan çubukta saklanmaz. Metinler, site oluşturulurken
    müzenin bilgi haritasındaki her metin kaydının kelimeleri eşleştirilerek yakalanır,
    böylece daha sonra toplanan her kitabın metinleri giriş gününde görünür. Düzenlenen
    kayıtlar, müzede Arabiyya-tarayıcı ve Arabiyya-<section> etiketleriyle sıradan
    kayıtlardır. Ayetlerin metni yalnızca donmuş indirme dosyalarından alınmıştır.
    Bilginlerin farklı olduğu yerlerde, kayıt sahibine atfedilen her ifadeyi şüphesiz
    belirtir.
  api: İçindeki tüm veriler
  contents_title: Bu sayfada
  empty: Bu sürümde henüz kayıt yok.
  passages_title: Kaynakların Al Arabiya hakkında söyledikleri
  passages_note: 'Müze tarafından toplanan kitaplardan alınan metinler, Arapça diliyle
    ilgili kelimeler içerir: Qureyş dili, Arapların konuşması, Arapça öğrenme, dilbilgisi
    ve yazarları, melodi ve Kur''an''ın mucizevi doğası. Alıntı, metnin kaynağında
    belirtildiği şekliyle başlangıcıdır; ve basılı biçimde mekanik olarak okunan şeyler
    okuma hataları içerebilir.'
  kin_title: Bitişik salonlar
  corpora:
    quran:
      title: Kur'an onun dilinden bahseder
      desc: Dondurulmuş metindeki her ayet, vahyin Arapça olduğunu, halkının dilinde
        vahyedildiğini ya da Arapçayı Arap olmayanla karşılaştırdığını söyler. Ayeti
        sayfasına, çevirilerine ve yorumuna açın.
    sunnah:
      title: Hadislerde ve Geleneklerde
      desc: Hadis kitaplarından rivayetler Arapça veya Kureyş dilinden bahseder ya
        da Kur'an'ı onunla yazar.
    seerah:
      title: Biyografide
      desc: Peygamber'in biyografisindeki kitaplardan dil üzerine metinler.
    tafsir:
      title: Yorum kitaplarında
      desc: Kur'an'ın Arapçasına hitap eden Tefsirlerden metinler.
    books:
      title: Tüm hasat edilen kitaplarda
      desc: 'Tarih, biyografiler, fıkıh, Kur''an bilimleri ve edebiyat: Hasood''un
        bir kitabı Arapçadan bahsettiği her yerde.'
  sections:
    lisan:
      title: Kur'an'ın dili Arapçadır
      desc: Neden vahiy, yorumcuların açıkladığı gibi Arapçada, Kurayş dili, yedi
        harf ve ilk nesillerin Arapça öğrenme hakkında söylediklerinde açıklandı?
    ijaz:
      title: Kur'an'ın Mucizevi Açıklaması
      desc: 'Kur''an''ın getirdiği zorluk, onu duyanlar ve söyledikleri, alimlerin
        mucizelerini nasıl yorumladığı: sözler, örnekler ve haberler, her biri kaynağına
        atfedilen.'
    origins:
      title: Köken ve Tarihçe
      desc: Arapça nereden gelmiş, İslam öncesi Sami dilleri ve Araplar arasındaki
        yeri ve dilin Arap Yarımadası'ndan dünyaya nasıl yayıldığı konusunda.
    script:
      title: Harfler ve Yazı
      desc: Alfabe, Mushaf'ın noktaları ve biçimleri ile Arap yazı sanatı.
    sciences:
      title: Arap Bilimleri
      desc: dilbilgisi, morfoloji, retorik, prosodi, sözlük yapımı ve dilbilim ile
        her birinin nasıl ortaya çıktığı.
    dialects:
      title: 'Lehçeler: Geçmiş ve Modern'
      desc: Vahiy zamanındaki kabilelerin dilleri ve bugün yazılı Modern Standart
        Arapça ile birlikte konuşulan günlük diller.
    world:
      title: Dünyadaki Arap
      desc: İslam dünyasının dilleri arasında Arapça, Arap ülkeleri ve Arapça nerede
        konuşuyor, diğer dillere ne kazandırdı ve onlardan neler aldı?
    scholars:
      title: Dilbilimciler
      desc: Arapçayı tanımlayan dilbilgicileri, dilbilimciler ve retorik.
    books:
      title: Dil kitapları
      desc: Dilbilgisi, retorik, dilbilim ve Kur'an kelime dağarcığının temel kitapları.
        Sözlüklerin kendi tarayıcıları vardır.
  viz:
    title: Mektuplar Çemberi
    note: 'Arapça harfler, Al-Halil ibn Ahmad''ın ilk Arapça sözlük olan Al-''Ayn
      adlı kitabında belirlediği sırayla düzenlenmiştir: alif, ba, taa değil, her
      sesin en uzak boğazdan dudaklara kadar olan artikülasyon noktasına göre. Her
      renkli parantez bir eklem şekline sahiptir.'
    aria: Hebron'da düzenlenen Arap harfleri çemberi, artikülasyonlara göre gruplandırılmıştır
