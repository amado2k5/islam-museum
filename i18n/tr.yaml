bayt:
  title: Peygamberlik Evi ve peygamberin ailesinin tarayıcısı
  lede: 'Müze kaynaklarında Peygamberlik Evi ve Peygamber''in ailesi hakkında aktarılan
    her şey: Kur''an''daki Ehl-Beyt ve eşlerinden ayetler, İki Ağır Şey, Pelerin ve
    El-Ghadir''in hadisleri, sizin heyetiniz, Fatime''nin Sahihler, El-Muvatta ve
    Sünan''daki mirası, Sahabeler ve Takipçilerden aktarılanlar ve bir kitapta kaydedilen
    her bahs — yeni bir metin eklendiğinde konuşan kaynaklarıyla kayıtlar.'
  badge: Peygamberin Evi'nin Kaşifi
  status: Bu yapı, {s} bölümünde {n} kayıt içerir; metinler bir insanın inceleyebilmesi
    için taslak hazırlanır.
  method_title: Tarayıcı Müfredatı
  method_note: Buradaki her kayıt, kaynakları ve üçleme anlatısıyla sıradan bir müze
    kaydıdır. Ev anıları, hece metinlerine dayanan korunaklı bir sözlükte inşa edilir
    — Ahl al-Bayt, soyundan gelenler ve Banu Haşim gibi yerleşik kelimeler doğrudan
    eşleşir, Fatimah ve Zainab gibi belirsiz isimler betimleyicidir ve yalnızca belirli
    biçimlerinde veya yanlış pozitifler belirli tanımlayıcı ile kontrol edildikten
    sonra sayılır. Daha sonra toplanan her kitabın anıları, metni çizimde görünür
    görünmez otomatik olarak buraya girer ve Ahl al-Bayt hakkında seçilen kayıtlara
    bayt-browser etiketi eklenir.
  api: Tüm koleksiyon şu adreste mevcuttur
  sections_title: Tarayıcı Bölümleri
  filter_label: Ev kayıtlarını aday göster
  filter_none: Eşleşen sonuç yok.
  empty: Bu binada Peygamber'in Evi'ne dair henüz kayıt yoktur.
  sections:
    quran:
      title: Kur'an'da
      desc: Ahl al-Bayt'in arınma, karşılıklı namaz ve eşleriyle ilgili ayetleri Ahzab
        Suresi, Kara Ayet ve diğerlerinde — her ayetin kaynağı vardır.
    sunnah:
      title: Yıllık
      desc: İki Ağır Şey'in hadisleri, Pelerin, Ghadir, Your Fadak ve Fatime'nin Sahihler,
        Al-Muwatta, Al-Arba'in ve Sunan'daki mirası — her rapor kaynağına atıfta bulunuyor.
    seerah:
      title: Biyografide
      desc: Ehlül-Beyt, Banu Haşim, Peygamber'in eşleri ve oğulları hakkında biyografi
        ve sefer kitaplarında bahsedilenler — bu bölüm yeni bir biyografi metni eklenmesiyle
        doluyor.
    books:
      title: Diğer kitaplarda
      desc: Peygamberlik Evi'ne şiir, tarih, fıkıh ve Kur'an, Hadisler ve Peygamber
        biyografisi dışındaki diğer kitaplarda her türlü bahsedilir.
    ahl:
      title: Ahl al-Bayt ve klanın geri kalanı
      desc: Müzenin seçilmiş kayıtları, hane üyeleri hakkında Fatima, Ali, Hasan,
        Al-Husayn, Khadijah, kızları ve eşleri, Banu Haşim, Banu Abdul Muttalib, ataları
        ve amcaları.
    mawaqif:
      title: Durumlar ve Olaylar
      desc: 'Evle ilgili durumlar ve hikayeler: Ghadir Khumm, Al-Kisa, Mubahala, Wafdak,
        Fatimah''ın mirası, Kerbela ve Ali''nin rehinleri.'
    concepts:
      title: Kavram ve Kaynak Kayıtlar
      desc: 'Seçilmiş müze kayıtları, evin kavramları üzerine kayıtlar: soylar, pelerinli
        insanlar, iki ağır şey, İnananların Anneleri, On İki İmam ve biyografi ile
        el-Şama''il kitapları.'
  viz:
    title: Epistemolojik çizimle korunan Peygamberin Evi
    note: 'Peygamber''in ailesi yalnızca epistemolojik diyagramda kaydedilen akrabalık
      ilişkilerinden çekilir: ilişkinin kaydı kurulmadıkça iki kişi arasında bir çizgi
      çizilir. Üstte ebeveynleri ve büyükbabasının hattı, yanında eşleri, altında
      ise çocukları ve torunları bulunur. {n} bir kişiyi yerleştirir, aralarında {c}
      baba-oğul arasında bir çizgi ve {s} evlilik çizgisi vardır. Eşler, her ilişkide
      yazılı evlilik tarihine göre düzenlenir, {d}''de {w} tarihinden itibaren bir
      tarih, sonra geçmişi olmayanlar tarafından çizilir; ve çocukların anneleri burada
      son satırda çizilir. {b} Bir kişi seçilirken kardeş ilişkisi ortaya çıkar.'
    legend_title: Hatlar
    lg_child: Babadan oğula
    lg_spouse: Evlilik
    lg_sib: Kardeşlik, seçildiğinde ortaya çıkıyor
    groups_title: Ev Grupları
    hint: Bir kişinin üzerine gelin, odaklanın veya doğrudan bağlantısını vurgulamak
      ve kimliğini göstermek için dokunun. Kartın altındaki renkli işaretler, organik
      ilişki yoluyla ait oldukları ev gruplarıdır; diğer kartları karartmak için bir
      grup seçin.
