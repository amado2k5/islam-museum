  section_ledes:
    web: Müslümanlar tarafından yapılmış veya İslam ile ilgili herhangi bir dilde
      web siteleri, portallar, forumlar, dijital kütüphaneler, uygulamalar, oyunlar
      ve cihazlar.
    music: Albümler, şarkılar ve marşlar, kavveliler, na'atlar, kehanet ve ilahi sanatçıları;
      ayrıca İslam veya din hakkında bir Müslümanın şarkısı, ödülleri ve tarihi popülaritesi
      ile birlikte.
    film: 1976'dan beri İslam hakkında filmler, belgeseller, kısa filmler ve çizimler,
      gösterim salonundan.
    tv: 1976'dan beri İslam hakkında diziler, programlar ve Ramazan sezonları, gösterim
      salonundan.
    conferences: Konferanslar, forumlar, zirveler ve periyodik toplantılar, oturumlarında
      yer alır.
    heritage: Miras ayları ve günleri, festivaller, etkinlikler ve buluşmalar.
    rights: İslam'ı ve İslamofobi'ye karşı protestolar, bunlara yanıt veren olaylar,
      yasalar, kararlar ve raporlar; görüşlerin farklı olduğu ve yargılamadan iki
      ses.
    books: 1976'dan beri İslam ve Müslüman yazarlar hakkında kitaplar, yayınevleri,
      kütüphaneleri, sergileri ve ödülleriyle birlikte.
    upcoming: 'Duyurulan ama henüz tamamlanmamış olanlar: inşaat halindeki binalar,
      yapım aşamasında olan filmler, planlanan konferanslar ve yarışmalar ile duyurulan
      kitaplar ve albümler.'
    figures: 'Son elli yılın Müslümanları alana göre: alimler ve vaizler, siyaset,
      diplomasi, finans, bilimler, tıp, üniversite, eğitim, yazarlık, sanat, medya
      ve içerik üreticileri, kamu faaliyetleri, spor.'
    organizations: 'Ülkelere göre, küresel ve sanal bazda İslami kuruluşlar: konseyler
      ve hayır kurumları, öğrenci ve meslek kuruluşları, dini savunuculuk ve diyalog,
      düşünce kuruluşları ve çevrimiçi topluluklar.'
    media: Gazeteler, dergiler, bültenler, haber siteleri, televizyon kanalları, radyo
      istasyonları, kanallar ve İslam ile Müslümanlar hakkında podcastler.
    sports: 'Sporda Müslümanlar: Sporcular, takımlar, şampiyonalar, sonuçlar ve rekorlar.'
    awards: Ödüller, onurlar, sınıflandırmalar ve yarışmalar, Kur'an yarışmaları dahil,
      ilgili baskıları ve kazananlar.
    achievements: 'Kazananlar, emsaller ve rekorlar: Nobel ve diğer büyük ödüller,
      astronotlar, Olimpiyat örnekleri, bir pozisyonu ilk elinde bulunduranlar.'
    enterprise: '1976''dan beri Müslümanlar tarafından kurulan veya sahip olunan her
      türlü işletme: şirketler, sanayiler, zincirler, marketler, seyahat, markalar,
      moda, mağazalar, klinikler, kasalar ve bankalar; listelenmiş, zekat değil.'
    arts: Hat sanatları, görsel sanatlar, moda, komedi, şiir, tiyatro, sergiler, müzeler
      ve bienaller.
    built: 1976'dan beri inşa edilen veya tamamlanan camiler, İslami merkezler, müzeler
      ve kampüsler ile İki Kutsal Caminin eserleri.
    learning: üniversiteler, kolejler, enstitüler, akademiler çevrimiçi, hibeler,
      çeviriler ve dijital kütüphaneler.
