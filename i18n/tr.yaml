ulama:
  title: Düşünürler, bilim insanları, yazarlar, hadis âlimleri ve yazarlar için tarayıcı
  lede: 'Bilgi formülasyonunda tüm alimler ve yazarlar — düşünürler ve filozoflar,
    alimler ve hukukçular, hadis âlimleri, edebiyat bilimcileri, yazarlar ve kalem
    âlimleri — ve Kur''an, Sünnet ve biyografide söylenen her şey ve her kitap onlardan
    sayılır: kim oldukları, ne taşıdıkları, ne söyledikleri, ne yazdıkları ve kaynakların
    onları nerede andığı gibi. Her kayıt kendi kaynaklarını taşır ve her bahsetme
    metnine götürür.'
  badge: Scholars and Writers Browser
  hero_kufi: Düşünürler, âlimler, hadis âlimleri, yazarlar ve yazarlar
  hero_naskh: Bilgi sahibi insanlar, kalem ve kaynakların onlar hakkında söyledikleri
  status: Bu yapı {n} {s} bölümlerinde bir kayıt içerir; her kayıt kaynaklarını belirtir
    ve metinler bu kaynaklardan yapay zeka ajanları tarafından yazılmıştır, henüz
    insanlar tarafından okunmamıştır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Bir kişi, kaydının kendisine ait olduğunu söylediğinde bu tarayıcıya
    girer: bir âlim, hadis âlimi, hukukçu, müfti (müftü), yargıç, teolog, filozof,
    tarihçi, coğrafyacı, yazar, öğretmen, vaiz ve kalem âlimleri (şairlerin kendi
    kanatları vardır ve bu kapsam dışındadır). Metin üç şekilde girer: standart bir
    ''hatırlanan'' kenar boşlukta, nitelikli bir âlimin adını vererek; veya Kur''an
    ayetleri için referans tablosu—Luqman the Wise, alimlerin ayetleri ve kalem ve
    yazı ayetleri (Tanzil''in dondurulmuş metni asla aranmaz); ya da kitaplarda yazılmış
    alimlerin isimlerinin korunan listesi, burada ortak tekil isim hiç sayılmaz. Daha
    sonra toplanan her kitap otomatik olarak bilginlerini getirir ve onlardan bahseder.
    Sünni kaynaklar çerçeveyi oluşturur; bir kişi hakkında anlaşmazlık olduğunda,
    kayıtlar ifadeyi yazarına atfeder.'
