support:
  title: Müzeye destek olmak
  lede: Bu müze ücretsiz ve açıktır, reklam ve takip yoktur. Eğer size fayda sağlıyorsa,
    desteğiniz bunu böyle tutar ve daha hızlı büyümesine yardımcı olur.
  why_title: Neden bizi destekleyesiniz?
  why_body: 'Herkes için ücretsiz — ama kurucusu için ücretsiz değil. Müze, ziyaret
    eden herkes için ücretsiz — hesap yok, reklam yok, takip yok, ücretli duvar yok
    — ve kurucusu her ay bunun için ödeme yapıyor. Son bir ayda işletme maliyetleri
    yaklaşık 1.900 Kanada dolarına ulaştı. En büyük pay, yaklaşık 900 Kanada doları,
    yapay zeka asistanlarına gitti — Claude, ChatGPT, Devin, Grok, Google AI araçları
    ve diğer ajanların işlerini koordine eden kişisel ajan Muse, materyalleri araştırmak,
    formüle etmek, çevirmek ve doğrulanmış kaynaklarıyla doğrulamak için kullanıldı.
    Runway, Artlist ve Veo aracılığıyla video üretimi müzenin filmlerini üretiyor,
    ElevenLabs bunları Arapça, İngilizce, Urduca, Fransızca, İspanyolca, Türkçe ve
    Endonezce olarak anlatıyor ve GitHub kodu barındırıyor. Cloudflare, aylık yaklaşık
    90 Kanada doları ile {pages} hızlı ve güvenli bir günlük sayfası olarak yer alıyor,
    barındırma ve depolama ile birlikte, alan adı kaydı ise müzenin isimlerini kendi
    adları gibi tutuyor. En üst paketler — Claude Ultra ve Devin Max — bile ay sonundan
    önce tükeniyor: Ekim ve Kasım başında, ek kullanım ve otomatik ücretlendirme ücretleri
    aboneliklerin üzerine yaklaşık 730 Kanada doları ekledi. Kullanım ölçülüp kaydediliyor,
    tahmin edilmiyor: Copilot Max, beş gün boyunca 20.000 aylık yapay zeka kredisinin
    18.525''ini kullandı, Devin''in haftalık payı iki hafta üst üste %100''e ulaştı
    ve Claude Ultra haftalık payının %84''üne ulaştı ve yenileme için günler kaldı.
    Bunlar aylık işletme maliyetleri, yıllık rakamlar değil. Yaptığınız her katkı
    doğrudan ona gider—ve hiçbir şey satın almıyorsunuz: erişim yok, ürün yok, içerik
    hakkında görüş yok. Müzenin kendisi ücretsizdir: herkes CC0 ve MIT kodlarını indirip
    yerel olarak çalıştırabilir, üzerine bir şablon oluşturabilir veya herkes için
    ücretsiz olarak açık programlama arayüzünü kullanabilir.'
  ways_title: Destek yöntemleri
  patreon_title: Patreon üzerinden katılın
