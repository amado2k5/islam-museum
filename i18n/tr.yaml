        bildikleri, anlattıkları bilgiler.
    hanafi:
      title: Musluk
      desc: 'Ebu Hanife''nin ekole: Arkadaşları, kitapları, çıkarımdaki metodolojisi
        ve derslerinde yazdıkları.'
    maliki:
      title: Maliki
      desc: 'Malik ibn Anas okulu ve Medine halkı: yoldaşları, kitapları, Medine''deki
        çalışmaları ve derslerinde kaydettikleri.'
    shafii:
      title: Şafii
      desc: 'Şafii okulu: yoldaşları, kitapları, ilke metodolojisi, benzetmeler ve
        sonraki alimlerin onu takip ettikleri.'
    hanbali:
      title: Hanbala
      desc: 'Ahmed bin Hanbal''ın ekokü: yoldaşları, kitapları, anlatım metodolojisi,
        okul ve metinler.'
    ukhra:
      title: Diğer Doktrinler
      desc: 'Dört okulun dışındaki fıkıh okulları, mirasta kaydedildiği gibi: Zahiri
        okulu, Cafari okulu ve İbadi okulu — ayrı bir bölümde sunulmuş, böylece dört
        okul çerçeve olarak kalmıştır.'
    salaf:
      title: Selef ve Takipçiler
      desc: 'Düşünce okullarının kurulmasından önce fıhhiyetin kurulduğu kuşak: Tabi''in
        ve onları takip eden İbrahim el-Nakhai, el-Şa''bi, el-Avzai, Sufyan el-Thawri
        ve diğerleri arasında Kufa, Basra ve Hicaz imamları.'
    kutub:
      title: Kitaplar
      desc: 'Düşünce okullarını kuran veya karşılaştıran kitaplar ve eserler—öğrenciler
        tarafından ezberlenen metinler dahil: el-Ajrumiyye, Alfiyyat, Matn al-Quduri,
        Kairouani İncelemesi, İbn Aşir''in metni, Ebu Şuca''nın metni, el-Tahawiyya,
        el-Varakət, el-Beyquniyya, el-Cezariyye ve el-Şatibiyyah metni—el-Muvatta,
        el-Hidayah, el-Mughni, karşılaştırmalı araştırmalar ve medhhab tarihleri ile
        birlikte.'
    mafahim:
      title: Kavramlar
      desc: 'Düşünce okulları etrafında dönen hukuk sözlüğü ve ilkeleri: mezhebin
        kendisi, ijtihad, benzetme, tercih, taklit, farklılıklar, hadis âlimleri ve
        görüş.'
    dhikr:
      title: Kaynaklarda BahsEdilmesi
      desc: Müzedeki her kitap, pasaj veya soru, dört düşünce okulundan ya da bunlardan
        birini — okulların tarihi, hukukçuların katmanları, fetvalar ve karşılaştırmalı
        meseleler — ve kaynağını belirtir.
  viz:
    title: Zaman içinde yan yana dört tarikat
    note: Her sütun tek bir lehçedir ve dört sütun Hicri yüzyıllarının tek bir zaman
      çizelgesini paylaşır. Bant, alimin doğumdan ölümüne kadar olan hayatını, ölüm
      yılı kaydedilen bir âlimin belirli sonunu gösteren kısa bantı ve çapraz yazı
      yazarın ölüm yılına yerleştirilen bir kitabı gösterir. İmleci, odak veya dokunmayı
      üzerine getirerek okumak isterseniz, parantezler kimin kimi çalıştığını gösterir.
      Sadece tarihli kayıtlar çizilmiştir.
    hint: İmleci üzerine getirin, odaklayın veya bir çubuğa ya da işaretçiye dokunarak
