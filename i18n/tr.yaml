    için taslak olarak hazırlanır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, kaynakları ve yedi dilde düzyazısıyla sıradan
    bir müze kaydıdır. Yapım zamanındaki annelik anıları, altı ailenin bölümlerinin
    metinleriyle korunan bir sözlükte keşfedilir: anne ve statüsü (anne, annelik,
    annelik, annelik, annelik, annelik, inananların anneleri), hamilelik (hamile,
    hamile, hamile ve zayıf), doğum (doğum, doğum, doğum, doğum), emzirme (emzirme,
    emzirme, sütten kesme, sütten kesme), velayet ve yetiştirme (hemşirelik, emzirme,
    yetiştirilme), kreş ve yetiştirme (hemşirelik, emzirme, yetiştirilme, çocukluk,
    yetim sponsorluğu) ve ebeveynlere saygı gösterme (iyilik, iyilik, akrabalık bağlarının
    sürdürülmesi). Belirsiz kelimeler korunur: soyut ''um'' sadece ''Asri'' kelimesinin
    yanında sayılır (um al-Qura ve um al-Kitab hariç), ''Hamal'' yani hamilelik sadece
    Hamali kelimesinin yanında sayılır (bir şey taşımak ve aktarmak hariç tutulur),
    ''Walad'' erkek kelimesi hariç tutulur ve sadece doğum formları sayılır, ''Bar''
    sadece ebeveynlerin kelimesinin yanında sayılır (kuru arazi hariç tutulur) ve
    gerçekleşen yanlış pozitifler kesin tarafından dışlanır. Daha sonra toplanan her
    kitap otomatik olarak anılarını buraya getirir; seçili kayıtlar umuma-tarayıcı
    olarak etiketlenir; ve kayıtlı anneler aynı çizimdeki annelere child_of kenarlarından
    okur.'
