  sections:
    quran:
      title: Kur'an'da
      desc: 'Kur''an''da ahlak ve işlemler: "Gerçekten Allah adalet ve mükemmelliği
        emreder," doğruluk ayeti, "sözleşmeleri yerine getir", "ölçü ve dengeyi yerine
        getir," tefecilik, din ve ipotek ayetleri, evlilik, boşanma, bekleme süresi
        ve emzirme ile ilgili kararlar, yeminler ve bunların kefaretleri, tanıklık
        ve yargı, namaz kılanlar, ebeveynlere saygı gösterenler, arkadan iğneme, alay
        edenler, ikiyüzlülük ve kibir; her ayet erdem, kötü alışkanlık veya ticaretten
        bahseder.'
    sunnah:
      title: Yıllık
      desc: 'Peygamber, Sahabeler ve Sahihler, Muwatta ve Sünan''daki takipçilerin
