  lede: Cinler, şeytanlar, melekler ve onları taşıyan rüyalar — Kur'an, hadis, biyografi
    ve hasat edilen kitaplarda kaydedilen her varlık, karşılaşma ve haber, hepsi kaynaklarıyla
