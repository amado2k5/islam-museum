        ve ihmal edeni kınayan yükümlülüğün başka bir adıdır. Hanafiler, zorunluluğu
        kesin kanıtlarla kanıtlandığı sürece, yükümlülüğü ise spekülatif kanıtlarla
        kanıtlanmış gibi belirtir.
      scope: Burada "Tanrı'nın yükümlülüğü," "üzerinizdeki yükümlülük" ve "size verilen
        karar" gibi yükümlülük, yükümlülük ve yükümlülük gibi terimleri kullanan metinler
        yer almaktadır. İstisnalar miras hisseleridir; bunlara yükümlülük, verme ve
        belirlenmiş çeyiz de denir.
    fard-ayn:
      title: Göz yükümlülükleri
      desc: 'Müzenin kaynaklarında herkesin yerine getirmesi gereken ve başkalarının
        yerine getirmemesi gereken yükümlülükle ilgili her şey şöyle yazıyor: "Her
        Müslümana bir yükümlülük," "Her yetişkine bir yükümlülük" ve hukukçulara göre
        gözün yükümlülüğü.'
      definition: 'Her sorumlu kişiden kendi başına beklenen şey, başkalarının eylemleriyle
        de geçersiz kılınmaz: beş günlük namaz, oruç, zekat ve hac.'
      scope: Burada listelenen metinler, bu terimi kullananlar ve "her Müslümana"
        veya "her yetişkine" bir yükümlülük getirenlerdir. Kur'an bu terimi kullanmaz
        ve her ibadet eyleminin ayetleri zorunlu eylemler altında yer alır.
    fard-kifaya:
      title: Yeterlilik Yükümlülükleri
      desc: 'Müzenin kaynaklarındaki her şey, topluluğun görevine düştüğü hakkında:
        Eğer biri bunu yeterince yerine getirirse, günah diğerlerinden kalkar, kimse
        yapmazsa hepsinin günahıdır.'
      definition: 'Kanuniyetçinin, bunu yapanlara bakılmaksızın başarmak istediği
        şey: cenaze namazı, selamın karşılığı, dinde anlayış kazanmak ve sayı yeterliyse
        cihat. El-Şafii, bunu "Risale"de iki ayetten açıklamıştır.'
      scope: Burada, terimi kullanan veya hükmünü belirten metinler yer alır; örneğin
        "Bazıları bunu yaparsa, diğerlerinden muaf tutulur" ve Al-Shafi'i'nin bu hükmünü
        türettiği iki ayet vardır.
    taat:
      title: İtaat eylemleri
      desc: 'Müzenin kaynaklarındaki Tanrı''ya ve Elçisine itaat ve itaat eylemleriyle
        ilgili her şey şöyledir: "Tanrı''ya itaat et," "Bana itaat eden Tanrı''ya
        itaat etmiştir," ve "İtaatsizlikte itaat yoktur; itaat sadece iyiliktedir."'
      definition: 'Metinler itaat ve itaatsizliği karşıt tutuyor: "Bana itaat eden
        Tanrı''ya itaat etmiştir, bana itaatsizlik eden Tanrı''ya itaatsizlik etmiştir,"
        ve bir sınır koyarlar: "İtaat sadece iyiliktedir." İzleyici bunu zorunlu ve
        tavsiye edilen iki eylem derecesinin üstüne koyar.'
      scope: Burada listelenen metinler, Allah'a ve Elçisine itaat emreden veya onları
        öven metinler ile itaat olarak adlandırılan metinlerdir. Yetkili olanlara
        itaat (işitme ve itaat) söz konusu olduğunda, bunlar dışında sayılmaz.
    wajib:
      title: Görevler
      desc: 'Müzenin kaynaklarındaki her şey ''yükümlülük'' terimi ve fiillerini kullanır:
        ''bana yükümlü'', ''her Müslümanın hakkı'', ''Evet dersem, zorunlu olur''
        ve hukukçuların yükümlülüğü.'
      definition: Yükümlülük, yapanı öven ve onu terk edeni eleştiren yükümlülüktür,
        Al-Shawkani'nin dediği gibi. 'Ma'ir ve Mukhtar', 'Mu'diq ve Mu'sa'a', 'Aini'
        ve 'Kafā'i' olarak ikiye ayrılır.
      scope: Burada listelenen metinler, yükümlülük, yükümlülük, 'ona yükümlülük'
        ve 'haqq 'ala' kelimelerini kullananlardır. İstisnalar ise 'Cennet onun için
        zorunlu' ve 'Satış yükümlülüğü' olarak yapılmıştır.
    mustahabb:
      title: önerilen eylemler
      desc: 'Müzenin kaynaklarındaki her şey, zorunluluk olmaksızın istenenlerle ilgili:
        tavsiye edilen ve tavsiye edilen, gönüllü eylemler ve gönüllü dualar, onaylanmış
        sünnetler ve Peygamber''in zorluk korkusundan çıkardığı şeyler.'
      definition: Tavsiye edilen şey, Kanunu Verenin terk ettiği için suçsuz olmadan
        talep ettiği şeydir ve bunu yapmak bırakmaktan iyidir. Hukukçular buna Sünnet,
        öneri, gönüllü ve gönüllü derler ve çoğunlukla eşanlamlıdır.
      scope: Burada bu terimleri kullanan metinler, eylemin "zorunlu olmadığını" belirten
        metinler ve "Milletim için yarattığım zorluklar olmasaydı" hadisi yer almaktadır.
        Sünnet, yasama kaynağı olarak kendi kayıtlarına sahiptir.
    haram:
      title: tabular
      desc: 'Müzenin kaynaklarında Muharram''ı anan her şey şunları içerir: ''Sana
        yasak oldum'', ''Allah''a yasak'', ''İzin vermeyecek'' ve Tanrı''nın yasakları
        ve kutsallıkları.'
      definition: Yasaklanan, yasaklanan şey, yasa koyanın terk edilmesini gerektiren
        şeyler ve eylemi için cezalandırılma tehdididir.
      scope: Tarayıcının yasaklama bölümünde helal ve haram üzerine okuduğu aynı bölümler
        burada, tek bir terim listesiyle birlikte iki tarayıcı arasında fark yoktur.
        Yasaklama hariç tutulur ve özel isim haramdır. Soyut 'yasak' sınıflandırılmamıştır.
    makruh:
      title: nefret edilen şeyler
      desc: 'Müzenin kaynaklarındaki her şey ilk etaptan çıkarıldı: sevilmeyen ve
        sevilmediği, ''eskiden hoşlanmazdı'', ''Tanrı senden nefret ediyordu'', ''kesinlik
        seviyesine ulaşmadığı'' ve hukukçuların hoşlanmadığı şeyler yasaklandı.'
      definition: Sevilmeyen şey, Kanuniyetçinin ceza tehdidiyle terk edilmesini istediği
        şeydir ve bunu ihmal etmek, bunu yapmaktan iyidir. El-Gazali, bu terimin yasak
        ve kaçınma durumunda da kullanıldığını belirtir ve Hanafiler bunu yasak olana
        yakın olanla ilkinin tam zıttı olarak ayırırlar.
      scope: Burada, hoşlanmama ve hoşlanmama ile alışılmış hoşnutsuzluk raporlarını
        kullanan metinler hariç tutulmuştur. Hoşnutsuzluk için ise "kim Tanrı'yla
        karşılaşmaktan nefret ederse", zorlama ve "bundan kork" ifadeleri gibi duygu
        anlamında istisnalar yapılır.
    saghair:
      title: Küçük günahlar
      desc: 'Müzenin kaynaklarındaki küçük günahlarla ilgili her şey: suçlama, küçük
        günahlar, duaların neyi kefaret ettirdiği, büyük günahlardan kaçınma ve ısrara
        karşı uyarılar.'
      definition: Küçük günahlar büyük günahlardan daha azdır ve hukukçular aralarındaki
        sınır konusunda farklı görüşlere sahiptir. Müzenin kayıtlarında tanımlar yer
        alırken, büyük günahlar Hudud Allah ve Büyük Suçlar tarayıcısında mevcuttur.
      scope: Burada listelenen metinler, küçük günahları, günahları ve aşağılayıcı
        günahları ile kefaret ile ilgili metinlerdir (büyük günahlardan kaçınıldığı
        sürece). İstisnalar ise farklı bir anlamda 'küçük ve büyük' içindir.
    mubah:
      title: 'Ve diğerleri: izin verilen ve izinli'
      desc: 'Salam''dan geriye ne kalır: ne izin verilir ve orijinal ilke olan kararlılıkla
        birlikte verilen taviz, ''Üzerinizde suç yok'', ''Bunda zarar yok'' ve bununla
        ilgili sessiz olanlar.'
      definition: İzin verilen şey, yasama organının seçtiği şeydir; yapmak ve kaçınmak
        aynıdır ve ikisinde de günah yoktur. Taviz, kararın asıl nedeni devam ederken
        bir mazeret uğruna hukukun gevşetilmesidir.
      scope: Burada listelenen metinler, 'Üzerinizde suç yok', 'Zarar yok' ve 'Hakkında
        sessiz kalan affedilir' gibi 'Serbest bırakılmış, izin verilen ve taviz' kelimelerini
        kullananlardır. Helal olan ise, yasal ve yasadışı olanı inceleyen bir kitaptır.
