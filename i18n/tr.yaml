  title: İslam'da Peygamberlik Tıp, Tıp, Anatomi, Cerrahi, Tıp ve Şifa Tarayıcısı
  lede: 'Müze kaynaklarında peygamberlik tıp, tıp, anatomi, cerrahi, tıp ve tedavi
    hakkında bahsedilen ve yazılan her şey: şifa ve hastalık ayetleri, Kur''an''daki
