  caveat: 'Bu sayfa, metinlerde ne olduğunu açıklar ve kimsenin kaderini açıklamaz.
    Her sayı, yanında bahsedilen bir metinden okunur ve metinler bu sayıyı niyet,
    kabul, büyük günahlardan kaçınma ve şikayetlerin giderilmesine bağlar; ayrıca
    sayının üzerindekilerin bir sayıyla sınırlı olmayan bir erdem olduğunu belirtir.
    Müze fetva yayımlamaz: anlatılar farklılık gösterdiğinde, göründüğü gibi sunulur
    ve metin sayı belirtmezse, sonucu kendi ifadesiyle yazılır ve sayıya dönüştürülmez.'
