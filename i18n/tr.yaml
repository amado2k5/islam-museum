    Hasta Kitabı, ahiretin sağlanmasıyla ilgili peygamberlik tıbbı bölümleri, Sahabelerin
    ve Takipçilerin tedavi, yaralıların iyileştirilmesi ve hastaların ziyareti hakkındaki
    raporları, İbn Sina''nın kanon metinleri ve El-Havi''nin El-Razi''nin metinleri,
    İbn el-Nefis''in yasanın anatomisinin açıklaması, doktorların kayıtları, hastaneler,
    tıbbi kitaplar, ilaçlar ve hükümler — yeni metinler hasat edildikçe büyüyen belgelenmiş
    kayıtlar.'
