sport:
  title: İslam'da Spor ve Yarışmalar Tarayıcısı
  lede: 'Müzede spor ve yarışma: binicilik, yüzme, okçuluk — eğitim raporlarında bahsedilen
    üçü — güreş, güç, yarış, yapım, Habeşistan''ın mızrakla oyunu, top ve masa oyunları,
    spor olarak avcılık ve modern sporlar — Kur''an''da, Sahihler, Muwatta, Sunan,
    biyografi kitapları, Sahabeler ve Takipçilerin gelenekleri ve her kaydedilmiş
    kitapta — kaynaklarıyla birlikte kayıtlar her metinle birlikte artar.'
  trio_label: 'Üç Peygamber: Binicilik, Yüzme ve Okçuluk'
  badge: Spor Tarayıcısı
  status: Bu kopya {n}, {s} bölümlerinde bir kayıt içerir; ve metinler taslaklardır,
    böylece insanlar onları okuyabilir.
  method_title: Bu tarayıcı nasıl çalışır
  method_note: 'Buradaki her kayıt, kaynaklarıyla birlikte sıradan bir müze kaydıdır.
    Yapım zamanına ait spor anıları, sekiz ailede hecelerin metinlerinde korunan bir
    sözlükte bulunur: atlar ve binicilik, okçuluk, yüzme, güreş ve güç, yarış ve oyun,
    oyun ve oyunlar, avcılık bir spor olarak ve modern sporlar. Belirsiz kelimeler
    korunur: ''Sabq'' sadece ''yarış'' kelimeleriyle birlikte sayılır, ''said'' ''hunting''
    kelimelerinin yanında, ''rammi'' ''noble'' ve ''crossbow'' kelimelerinin yanında
    (Jamarat''ın taşlanması muaftır), ''yasbih'' su kelimelerinin yanında, ''sa''a''
    güreş kelimelerinin yanında ve doğrulanmış yanlış pozitifler isimlerine göre hariç
    tutulur. Daha sonra toplanan her kitapta otomatik olarak spor anıları yer alır;
    sözde sporlar spor kategorisinin bağımsız kayıtlarıdır; sporcular ise spor bloğundaki
    kişi kategorisinden okunur.'
