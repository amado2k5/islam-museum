future:
  strip_title: Müslümanlar 2077'de nasıl yaşayacak?
  strip_lede: Robotlar bugünden beri Büyük Camii'de hizmet veriyor. Bir Nesil İleri
    — on dört yüzyıllık uyarlamayla kanıtlanmış bir fantezi.
  strip_cta: Geleceğe adım atın
  eyebrow: 1448 AH ← 1500 AH
  title: 2077 Yılında Müslümanların Yaşamı
  lede: 'Bu bir kehanet değildir—görünmeyen sadece Tanrı''ya aittir. Bu sayfa hayal
    gücü müzesi egzersizidir: Müslümanların yanından geçen her medyum—kağıt, baskı,
    radyo ve ekran—din tarafından özünde yer değiştirmeden emildi. Peki ortamın kendisi
    cevap vermeye başladığında ne olur?'
  note: Aşağıda kanıta dayalı kurgu — gerçek robotlar, gerçek fetvalar ve gerçek araştırmalar
    — bir kehanet değil. Her istasyon sizi müzenin içine geri götürüyor.
  stations: Yoldaki İstasyonlar
  anchors_label: Müzede kuruldu
  tensions_title: Açık uçlu sorular
  tensions_lede: Müze yargılamaz. Her kart canlı bir tartışmadır.
  voices_title: Önümüzde hayal edilen sesler
  voices_lede: 'Şunu düşünün: bizden önce bilim insanları, mühendisler ve sanatçılar.
    Yazdıklarından yola çıkarak:'
  epilogue_title: Sürekli Davet
  epilogue: Bu sayfa büyüyecek. Yeni bir makine bir camiye girdiğinde, bir bilim insanı
    yeni bir senaryo yazdığında ve bizim hiç hayal edemediğimiz şeyi hayal ettiğinde
    — gelecek, bir müze gibi, inşa ediliyor.
  sections:
  - k: Grup
    t: Grup
    d: '2077''de Cuma namazı sıraları bir sütunun etrafında değil, bir merceğin etrafında
      dolanabilir—karma bir gerçeklikte ibadet edenler üç kıtadaki insanlarla omuz
      omuza durur. Bugünden itibaren rehberlik robotları Büyük Camii''de dolaşıyor,
      on bir dilde soruları yanıtlıyorlar; sonra Zamzam suyu taşıyabilir, vaazı her
      kulağa çevirebilir ve yeni ziyaretçinin kim olduğunu, kırk yıldır kimin geldiğini
      bilebilirler. Ama ders asla bina ile ilgili değildi: eşitlerin geometrisi ve
      soru hayali bir imgenin orada durup duramayacağıdır.'
    a:
    - id: concept/luzum-al-jamaa
      l: Grubun gerekliliği
    - id: concept/row-prayer-saff
      l: Sınıf dengeleme
  - k: Metin
    t: Kur'an'ı öğrenin
    d: 'Bitmek bilmeyen bir ezber arkadaşı: Kırk denemenizi ilk denemenin sabrıyla
      dinler, yorgun bir öğretmenin kaçırdığı tacut kağıdını alır ve zincirinde bildiği
      her şeyi ezberler — yani, herhangi bir okuyucudan ve anlatıcıların herhangi
      bir yolundan okumayı. Ezberleme parşömen, yazıcı ve kaset bandında kalır; ta
      ki makine başka bir taşıyıcı olana kadar. Müzenin bugünkü kuralı, metnin kendisinin
      asla bir enstrümandan gelmediğini söylüyor.'
    a:
    - id: concept/hifz-preservation
      l: Metin koruma
  - k: Seri
    t: Konuşmayı öğren
    d: 'Atıf, dünyanın ilk epistemolojik çizimidir — tarihleri, seyahatleri ve adaletleriyle
      adlandırılan bir dizi insan. 2077 yılında, öğrenen o zincirde yaşayan bir harita
      gibi yürür ve makine modernistlerin mum ışığında yaptığı şeyi yapar: iki anlatıcının
      gerçekten buluşup buluşmadığını doğrular ve haberler akranlarından sapır. Araç
      yenidir; şüpheye gelince, on dört yüzyıllıktır.'
    a:
    - id: concept/isnad
      l: Atıf
    - id: concept/ittisal-al-isnad
      l: Referans bağlantı
  - k: Yol
    t: Biyografi yürüyüş
    d: Göçün çölde günlerce sürdüğünü okumak yerine, 2077 yılında bir çocuk şafakta
      o yolda duruyor—sıcaklığı hissediyor, rehberin istekten uzaklaştığını görüyor
      ve mağaranın içinde bekliyor. Müzenin seyahat haritaları ilk adım; sürükleyici
      anlatı ise sırada. Hikaye her zaman böyle anlatıldı—ateşler, camilerde ve annelerin
      sesleriyle—ve sadece ateş değişti.
    a:
    - id: event/hijra
      l: Göç
    - id: place/jabal-thawr-madina
      l: Thor Mağarası
  - k: Hac
    t: Kitlesel akın döneminde Hac
    d: 'Mecca, bugünden itibaren su dağıtmak, mermer temizlemek ve hacılara cevap
      vermek için robotlar kullanıyor. 2077 yılına gelindiğinde, kalabalık akışlarının
      zekası tarihsel çatışmaları hayal edilemez hale getirebilir, çeviri kulaklıkları
      emekli hacı için işaret diline işaret edebilir ve yolculuğu asla yapamayacak
      bir çiftçi bir ritüel simülasyonunda sadakatle yürüyebilir. Sonra bilim insanlarının
      şimdi sorduğu zor soru geliyor: Varlık amaç mıdır?'
    a:
    - id: place/mecca
      l: Mekke
    - id: concept/hajj-rulings
      l: Hac Kararları
  - k: Referans
    t: Müfti ve Makine
    d: 'Her Müslüman aynı modeli sorabildiğinde, iki gelecek ayrılır: biri ijtihadın
      çoğaldığı — her bilginin on dört yüzyıllık metodolojiye dayalı yargıyı test
      etmesini sağlayan açık araçlar — ve diğerinde tek bir algoritmanın sessizce
      dünyadaki tek referans haline geldiği bir gelecek. Matbaa ezberleyicinin tekelini
      sona erdirdi ve veritabanı dünyanın ansiklopedisini sona erdirdi. Makinenin
      neyi bitirdiği veya kurtardığı hâlâ rapor ediliyor.'
    a:
    - id: concept/ijtihad
      l: İctihad
    - id: concept/al-fatwa-ala-al-fadaiyyat
      l: fetva
  - k: dünyanın ötesinde
    t: Dünya Dışı Varlıkların Hukuk Anlayışı
    d: 'Aslında daha önce de olmuştu: 2007''de Fetva Konseyi, bir Müslüman öncünün
      gün doğumunu on altı kez gören bir istasyonda namaz kılabilmesi için on sekiz
      sayfa yazdı — Kabe''yi, inişini, dünyayı veya herhangi bir yönü kabul edebilsin;
      kalkış limanında beş namaz kılabilsin; ve bedeniniz yüzüyorsa niyetle hareket
      edebilsin. 2077''ye kadar Müslümanlar Mars''ta, kalıcı bir kutup gününde ve
      dönen uzay araçlarında yaşayabilirler. Sorular yeni görünüyor; ancak metodoloji
      — zorunlu namazın ağırlığı, uyarlanması ve ezberlenmesi — bu müzedeki en eski
      yöntemlerden biridir.'
    a:
    - id: concept/awqat-al-salat
      l: Namaz vakitleri
  - k: Ağ
    t: Ulus Bir Ağ Olarak
    d: Yüzyılın ortalarına gelindiğinde, yaklaşık her üç kişiden biri Müslüman olacak—dünyanın
      en büyük ve en küçük dini grubu—milyarlarca hizmetçi makineyle şehirleri paylaşacak.
      Peki meslektaşınız yapay olduğunda kardeşlik ne anlama geliyor? Zamanlar, kendini
      bir şartla serbest bırakan programlanabilir vakıflara dönüşebilir ve zekat kendi
      başına sayılan parayla ödenebilir. Ulus her zaman bir ağ olmuştur—mesajlar,
      kervanlar ve iletim zincirlerinden oluşan bir ağ. Ve kablolar sadece onun en
      yeni bedenidir.
    a:
    - id: concept/waqf
      l: vakıf
  - k: Müze
    t: Ve bu müze
    d: 'Dürüstlük, bu son istasyonu aynı istasyon yapıyor: makinelerin çoğunu zaten
      yazdığı, kuralların incelediği ve durağan sayfalarla dondurulmuş bir İslam müzesi
      — makine hızı ile insan ezberlemesi arasındaki kendi yerleşimi. Ve 2077''de
      yürüyebileceğin bir yer, içinde bulunduğunuz bir harita ya da hangi eşyasının
      sizi hareket ettireceğini bilen bir yoldaş olabilir. Biçimi ne olursa olsun,
      sorusu bu sayfada aynı kalacak.'
  tensions:
  - q: Bir makine duayı yönlendirebilir mi?
    d: Bugün Mekke'deki hacıların sorularını rehberlik robotları yanıtlıyor. Bir makinenin
      imam olarak durmasının — ya da sesi bir insanın sesi mi — sorulan bir insan
      olup olmaması — sorulan canlı bir tartışmadır.
  - q: Hac simülasyonları sayılır mısınız?
    d: Simülasyon, asla seyahat etmeyecek milyonlarca insana ritüeller öğretebilir.
      Bilim insanları öğrenme ile performans arasında ayrım yapar — ancak hacının
      bedeni ile gerçeklik gözlükleri arasındaki mesafe, her dönemin farklı şekilde
      yanıtladığı katılım sorusunu gündeme getirir.
  - q: Her fetva için bir yapay zeka mı?
    d: Bir milyar Müslüman aynı modeli sorarsa, dini otorite ulusun daha önce hiç
      bilmediği bir şekilde yoğunlaşır — halifeler döneminde bile. Bazıları fıkıh
      çeşitliliğinin sonunu görür; diğerleri ise ijtihadın nihayet demokratikleşmiş
      olduğunu düşünür. Her iki grup da aynı tarihi belirtir.
  voices:
  - l: Büyük Camii'de Akıllı Rehberlik Robotları — The National, 2021
  - l: 'Malezya Fetva Konseyi: Uluslararası Uzay İstasyonu''nda İbadet Rehberi, 2007'
  - l: Makine Öğretmenleri Çağında İslami Öğrenme Senaryoları — Bir Öngörü Çalışması,
      2025
  - l: Hac ve Umre'de Yapay Zeka Teknolojileri — IEEE Access Survey, 2024
  - l: '"Müslüman Alıcılar" — Müslümanlar Avrupa Dergisi Özel Sayısı'
  - l: 'Gelecek ve İnşa Edilen: İslami Bir Vizyon — Yaşam Enstitüsü'
  - l: Dijital Müslüman Sanatçılar ve Yapay Zekanın Manevi Çalışmaları — Dini Deneyim
      Araştırmaları Dergisi
  alts:
    mosque: 'Süslenmiş bir gece camisi: Yüzsüz ibadet edenler, şeffaf holografik bir
      figürün ve su taşıyan küçük bir robotun yanında sırada duruyor.'
    hifz: Özelliksiz bir öğrenen, parlayan bir kitaptan okurken, yumuşak döngülerle
      çevrili yüzen bir yoldaş topu onu gizlice dinliyor.
    isnad: Karanlık bir alan boyunca uzanan altın renkli parlak düğümler zinciri,
      halkalarında duran karakterler ve iki düğümü karşılaştıran bir inceleme yüzüğü.
    hajj: Hacıların noktaları, hilal şeklinde süslenmiş bir Kabe'yi çevreliyor ve
      iki küçük yönlendirilmiş robot kenarda dururken, iki yay çoğul sensörü siliyor.
    space: Bir astronot, istasyon penceresinin içinde bir kuş için dua eder; altın
      bir niyet çizgisi yere doğru işaret noktasına ulaşır.
    city: 2077 şehrinin silüetinde aydınlatılmış kuleler, minare ve kubbe bulunur;
      insanlar ve küçük robotlar bir hilal altında sokağı paylaşırken, küçük uçaklar
      gökyüzünde ilerler.
