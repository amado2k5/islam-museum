arkan:
  title: İslam'ın sütunlarını, inanç sütunlarını, inançlı insanları ve müminin niteliklerini
    gözden geçirmek
  lede: 'Tek bir tarayıcıda dört bölüm: İslam''ın üzerine inşa edildiği beş sütunu,
    Cebrail''in hadisindeki altı iman sütunu, hadisin yetmiş küsur saydığı inanç dalları
    ve ayetlerde ve hadislerde anlatılan müminin nitelikleri. Tarayıcı, bu bölümlerin
    Kur''an''da, Sünnet''te, biyografide, Sahabelerin ve Müritlerin raporlarında,
    inanç kitaplarında, tefsirlerde, münzevim ve tarihte bahsedildiği her yeri ve
    bundan sonra geçecek kitaptaki her bahsi derler. Müze, kaynaklarda ne olduğunu
    açıklar ve her ifadeyi yazarına atfeder, fetva vermeden.'
  badge: Sütunların, İnsanların ve Niteliklerin Kaşifi
  status: Bu yapı, {s} bölümünde {n} kayıt içerir ve her kayıt kaynağında atıfta bulunur.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, kaynaklarıyla birlikte sıradan bir müze kaydıdır.
    Kur''an ayetleri, her bölüme hadis ve tefsir kitaplarıyla bağlantılı ayetleri
    belirten bir atıf tablosundan alınmıştır; çünkü Kur''an sonraki terimleri "sütunlar"
    ve "inanç dalları" kullanmaz; ayetin metni, defterindeki donmuş vahiyin metinleridir.
    Diğer pasajlar ise metinleri üzerine korunan bir sözlükte oluşturulduktan sonra
    keşfedilmiştir: dört bölümün sözleri, "İslam beş üzerine kuruldu" hadisleri, İslam
    ve inanç hakkındaki soruların yanıtları, namaz, zekat, oruç ve hac, Allah''a inanç,
    melekleri, kitapları ve elçileri, Kıyamet Günü ve kader, "yaklaşık yetmiş dal,"
    metnin inanç olarak kabul ettiği şey, "hiçbiriniz inanmazsınız" ve inanan ile
    Müslümanı tanımlayan şey. Zayıf referanslar, örneğin bir inanç sütunundan bahsetmek
    veya inancı artırmak ya da azaltmak gibi, yalnızca güçlü bir referansla birlikte
    veya iki referans birlikte sayılır. Daha sonra geçen her kitap, bölümleri grafikte
    göründüğünde burada otomatik olarak bahsedilir ve seçilen kayıtlar arkan-browser
    etiketiyle birleştirilir. Resimli kitaplardan alınan alıntılar makine tarafından
    okunabilir ve düzeltilmemiştir; bu her kitapta belirtilir.'
  api: Tam koleksiyon şu tarihte mevcuttur
  sections_title: Tarayıcı Bölümleri
  filter_label: Kayıt satırı
  filter_none: Eşleşen sonuç yok.
  empty: Bu binadaki bu kapıda henüz kayıt yok.
  sections:
    quran:
      title: Kur'an'da
      desc: 'Hadis kitapları ve tefhitler dört bölüme bağlanır: şehitlik ayetleri,
        namaz ile zekatın birleşimi, oruç ve hac ayetleri, Allah''a iman ayetleri,
        Melekleri, kitapları, Elçileri, Kıyamet ve kader ayetleri, iman artışı ve
        En Merhametli''nin müminleri ve hizmetkarlarının özellikleri üzerine ayetler.'
    sunnah:
      title: Yıllık
      desc: 'İki Sahih''in hadisleri, Sünan ve Muwatta''nın ve onların tefsiri: Cebrail
        hadisleri, İslam''ın beş üzerine inşa edilmesi, Abd el-Kais heyeti, Muadh''ın
        Yemen''e gönderilmesi, inanç dalları, inancın tatlılığı, "Hiçbiriniz iman
        edene kadar iman etmezsiniz" ve müminlerin atasözleri ve nitelikleri.'
    seerah:
      title: Biyografide
      desc: 'Biyografi kitaplarında inananların temel taşları, inancı ve özellikleri
        yer alır: heyetlere dinlerini öğretmek, Peygamber''in kabilelere yazdığı mektuplar
        ve Sahabelerin tutumları; bu bölüm yeni bir biyografi metni yayımlandığında
        doldurulur.'
    books:
      title: Diğer kitaplarda
      desc: 'Kur''an, Hadis ve Seere dışında gerçekleşen her eserde dört bölümden
        bahsetti: iman ve inanç kitapları, Sahabelerin ve Takipçilerin biyografileri
        ve raporları, münzevim ve yumuşaklık kitapları, fıkıh ve tarih ve sonrasında
        bulunanlar.'
    curated:
      title: Sütunlar, İnsanlar ve Niteliklerin Kayıtları
      desc: 'Müzenin aynı bölümlere ait seçilmiş kayıtları şunlardır: İslam''ın beş
        temel direği ve her biri, inancın altı sütunu ve her biri, inanç dalları ve
        El-Bayhaki''nin bunlarla ilgili kitabı, inananın nitelikleri ve ilgili kavramlar.'
  topics:
    islam:
      title: İslam'ın Sütunları
      short: 'İslam''ın üzerine kurulu beş sütun: iki şahadet (Şehada), namaz kılma,
        zekat verme, Ramazan oruçu ve Evde Hac.'
      desc: 'Müzenin kaynaklarındaki İslam''ın beş temel direği hakkında her şey:
        iki şahitlik, namaz kurmak, zekat vermek, Ramazan oruçu ve Ev''e hac, Kur''an,
        Sünnet, Peygamber ve diğer tüm kitaplar.'
      scope: Burada, kelimesi kelimesine veya topluca sayılan ya da İslam'ın bilinen
        sütunları, ayrıca Kur'an tablosunda adı geçen şehitlik, dua, zekat, oruç ve
        hac ayetleri yer almaktadır. Her ibadet eyleminin ayrı ayrı ayrıntıları ise
        İbadet ve Anma İşlemleri Tablosu'nda bulunabilir.
    iman:
      title: İnanç Sütunları
      short: 'Cebrail''in hadislerinde: Allah''a, Meleklerine, kitaplarına, Elçilerine,
        Kıyamet Günü''ne ve kaderin iyiliği ve kötülüğüne olan inanç.'
      desc: 'Müzenin kaynaklarında inancın altı direği hakkında her şey var: Allah''a,
        Meleklerine, kitaplarına, Elçilerine, Kıyamet Günü''ne ve Kur''an''da, Sünnet''te,
        Peygamber''de ve diğer tüm kitaplarda kader—iyi ve kötü olanlar—iman.'
      scope: Burada, inanç sütunlarının sözlerinde veya birleşik biçimlerinde bahsedilenler
        ya da inanç ve kadere inanç sorusuna cevaplar dahil edilmiştir. Melekler,
        Son Gün ve elçiler hakkında ise tarayıcılarında yer almaktadır.
    shuab:
      title: İnanç İnsanları
      short: 'Yetmiş iki dal: en yükseği ''Allah''tan başka ilah yoktur'' söylemidir,
        en alçak ise yoldan zararı kaldırmaktır ve alçakgönüllülük bunlardan biridir.'
      desc: 'Müzenin kaynaklarındaki inanç dalları hakkında her şey: yetmiş iki dalın
        hadisleri, metnin inancı neyi kabul ettiğini, inancın tatlılığını ve mükemmelliğini
        ve hangi inancın onsuz tamamlanamayacağını Kur''an, Sünnet, Peygamber ve diğer
        tüm kitaplarda anlatır.'
      scope: Burada, eylem, söz veya iman durumu olarak sayılan halk ile Tanrı'ya
        ve Son Gün'e olan inanca bağlı eylem ve inancı artıran ayetler dahil edilmiştir.
        El-Bayhaqi'nin kitabının başlığının kenar notunda belirtilmesi bölümün bir
        kısmına atıf yapılmaz.
    khisal:
      title: İnananın özellikleri
      short: 'Ayetler ve hadisler bir müminin ne tanımlarıdır: alçakgönüllülüğü, güvenilirliği,
        kardeşlerine karşı merhameti, sabrı ve dürüstlüğünü.'
      desc: 'Müzenin kaynaklarındaki her şey, müminlerin nitelikleri ve nitelikleri
        hakkında: müminlerin ve Merhametli''nin hizmetkarlarının sıfatları hakkında,
        müminle ilgili hadisler, müminin ve Müslümanın tanımları, müminin müminler
        üzerindeki hakkı ve bu konuda sahabeler ile takipçilerin raporları.'
      scope: Bu, inanan veya Müslümanı tanımlayan, ona örnek verecek veya niteliklerini
        sayan şeyleri içerir. Genel olarak etik ise Etik Tarayıcı'da yer alır.
