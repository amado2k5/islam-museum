    tutulur; daha sonra gelen her kitap, bölümleri tabloya yerleştirildiğinde otomatik
    olarak notlarını buraya getirir ve seçilen kayıtlar hudud-browser etiketiyle birleşir.
    Her bölüm, işaretlerine göre ''sınırlar'' veya ''büyük günahlar'' işaretler.'
