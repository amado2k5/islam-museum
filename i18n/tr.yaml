open_access:
  nav_label: Açık Erişim Politikası
  title: 'Herkese Açık: İnsanlara ve Makinelere'
  lede: Müzenin, kendisini kimin okuyabileceğine — insanlar, arama motorları, yapay
    zekâ tarayıcıları, aracılar, arşivler ve API — ve hangi şartlarla okuyabileceğine
    dair kalıcı politikası.
  updated: 'Son güncelleme: 24 Kasım 2026'
  summary_title: Kısaca
  summary_1: islam.museum, İslam tarihini, ilmini, kültürünü ve mirasını herkes için
    erişilebilir kılmaya adanmış, ücretsiz ve bağımsız olarak finanse edilen bir dijital
    müzedir. Tarihî bilgi, hem müzeyi doğrudan okuyan insanlara hem de insanların
    onu keşfetmesine, anlamasına, korumasına ve yeniden kullanmasına yardımcı olan
    teknolojilere ulaşabilmelidir.
  summary_2: Müzenin belirlenmiş açık veri kümeleri, herkesin yeniden kullanmakta
    özgür olduğu CC0 lisansıyla yayımlanır. Başkalarından gelen materyaller — görseller,
    metinler ve diğer üçüncü taraf eserleri — kendi geçerli lisanslarına tabi kalır
    ve bir sayfanın teknik olarak taranabilmesi, içindekinin lisansını değiştirmez.
  welcome_title: Kimler hoş karşılanır?
  welcome_1: Her ülkeden insanlar, öğrenciler, eğitimciler ve araştırmacılar hoş karşılanır
    — arama motorları, yapay zekâ eğitim tarayıcıları, yapay zekâ destekli arama ve
    araştırma sistemleri, bir kullanıcı adına bilgi getiren yardımcılar, özerk aracılar,
    kazıyıcılar, dijital arşivler, bilgi grafiği tüketicileri, API istemcileri, ticari
    ve ticari olmayan uygulamalar, otomatik tarayıcılar ve komut satırı istemcileri
    de öyle. Kamuya açık bilgilerin meşru yüksek hacimli programatik alımı da hoş
    karşılanır.
  welcome_2: Erişim, bir isteğin otomatik veya yüksek hacimli olması ya da bir bulut
    ağından, VPN veya vekil sunucudan, belirli bir ülkeden, ağdan veya istemci türünden
    gelmesi nedeniyle kasıtlı olarak kısıtlanmaz. Makine güdümlü keşif, tarihî bilgiye
    erişimin meşru bir biçimidir.
  ai_title: Yapay zekâ ve açık bilgi
  ai_1: Müzenin açık lisanslı bilgisinin arama indeksleme, bilgi alımı, tarihî araştırma,
    eğitim, bilgi grafiği entegrasyonu, alımla artırılmış üretim, model geliştirme
    ve eğitimi, çok dilli keşif ve dijital koruma için kullanılmasını memnuniyetle
    karşılıyoruz. Bir uygulama müzeden yararlandığında, kaynak atfını korumasını ve
    özgün müze kayıtlarına bağlantı vermesini teşvik ederiz — teşvik ederiz, yeniden
    kullanımın şartı asla değildir.
  ai_2: Bir dijital müzenin, koleksiyonuyla her karşılaşmanın ana sayfasından başlamasına
    ihtiyacı yoktur. Bir kayıt bir arama motoru aracılığıyla keşfedilebilir, bir yardımcı
    tarafından getirilebilir, eğitim yazılımına katılabilir, bir arşiv tarafından
    korunabilir veya başka bir bilgi grafiğine bağlanabilir. Bunların her biri tarihî
    bilgiyi müzenin başka türlü asla ulaşamayacağı insanlara taşıyabilir.
  infra_title: Sorumlu altyapı ve şeffaflık
  infra_1: Açık erişim, müzeyi sağlam, güvenli ve erişilebilir tutan korumaları kaldırmak
    anlamına gelmez. Şifreli bağlantılar — kasıtlı olarak korunan modern bir asgari
    aktarım güvenliği düzeyiyle — altyapı erişilebilirliği korumaları ve pasif operasyonel
    izleme yerinde kalır. Kamuya açık indeksleme için tasarlanmamış ortamlar ve yedekli
    yinelenen URL varyantları, bu anlamda indeksleme rehberliği taşıyabilir; bu rehberlik
    indekslemeyle ilgilidir, kimseyi dışarıda bırakmakla değil.
  infra_2: Erişim politikalarımızı, tarihli denetimlerimizi ve trafik istatistiklerimizi
    metodolojileri ve sınırlarıyla birlikte belgeleriz. Otomatik istekler insan okuyucu
    sayıları değildir ve bir tarayıcının ziyareti, tek başına, herhangi bir materyalin
    bir eğitim veri kümesine girdiğini göstermez. Amaç baştan sona alımın önündeki
    engelleri kaldırmaktır, otomatik okumayı sırf otomatik olduğu için asla bastırmak
    değil.
  more_title: Bu politikanın arkasındaki denetim
  more_body: Bu politika yalnızca ilan edilmiş değil, doğrulanmıştır. 24 Kasım 2026'da
    müze, barındırma ve içerik teslim yapılandırmasını bu politikaya göre denetledi
    — tarayıcı izinleri, güvenlik duvarı ve bot ayarları, meydan okuma ve engelleme
    kuralları, önbellekleme, kendi teslim kodu ve robots.txt — ve uymayanları düzeltti.
    Tarihli denetim notu neyin kontrol edildiğini, neyin bulunduğunu ve neyin değiştiğini
    kaydeder.
  audit_link: 'Erişim denetimi: 24 Kasım 2026'
  contact_cta: Bir erişim sorununu bildirin
  closing: Tek koleksiyon. Açık bilgi. İnsanlara ve makinelere erişilebilir.
  licences_body: Bu lisanslar daha geniş bir hoş karşılamanın hukuki yüzüdür. Tarayıcılar,
    aracılar, arşivler ve API istemcileri, müzenin kamuya açık içeriğini yukarıdaki
    şartlarla alabilir ve yeniden kullanabilir; açık erişim politikası kimin hoş karşılandığını
    belirtir ve tarihli denetim kaydı hoş karşılamanın gerçek olduğunu gösterir.
  developers_body: Makine tüketicileri bu müzenin birinci sınıf okuyucularıdır. Açık
    erişim politikası tarayıcıları, kullanıcı yönlendirmeli ve özerk aracıları ve
    API istemcilerini hoş karşılar ve teslim yapılandırmasında hiçbir şeyin yollarında
    durmadığını doğrulayan tarihli denetimi kaydeder.
open_access_audit:
  title: islam.museum'u kim okuyabilir — bir erişim denetimi
  lede: 'Erişim politikası şeffaflık notu · 24 Kasım 2026: müzenin teslim yapılandırmasında
    neyi kontrol ettiği, neyi bulduğu ve neyi düzelttiği.'
  updated: 24 Kasım 2026
  scope_title: Neyin denetlendiği
  scope_body: '24 Kasım 2026''da müze, kamuya açık sayfalarını teslim eden yapılandırmayı
    gözden geçirdi: alan adı ve DNS ayarları, yapay zekâ tarayıcı kontrol paneli ve
    varsayılanları, bot yönetimi ayarları, web uygulaması güvenlik duvarı ve kuralları,
    tarayıcı bütünlüğü ve meydan okuma ayarları, IP, ülke ve kullanıcı aracısı engellemesi,
    önbellekleme ve yönlendirme, yeniden yazma ve dönüştürme kuralları, sitenin kendi
    teslim kodu ve içerik sinyalleriyle birlikte robots.txt.'
  found_title: Denetimin buldukları
  found_1: Neredeyse her şey zaten açıktı. Yapay zekâ tarayıcı kontrol panosunda listelenen
    33 adlandırılmış tarayıcının tamamı — başlıca arama, yapay zekâ eğitimi, arama
    ve alım ve aracı tarayıcıları dahil — izin ver olarak ayarlıdır, arama, eğitim
    ve aracı tarayıcıları için küresel varsayılanların hepsi izin verdir ve adıyla
    listelenmeyen tarayıcılar varsayılan olarak izinlidir. Kamuya açık içeriğin taranması
    için hiçbir yerde ücret ayarlanmamıştır. Hiçbir güvenlik duvarı kuralı, hız sınırı
    veya engelleme listesi kamuyu kısıtlamaz, hiçbir kamuya açık sayfanın önünde giriş
    duvarı yoktur ve sitenin kendi teslim kodu hiçbir erişim kısıtlaması içermez.
  found_2: Denetimden önceki yedi gün içinde yaklaşık 3,3 milyon yapay zekâ tarayıcı
    isteği müzeye ulaştı ve bunların 2,98 milyonu başarıyla yanıtlandı (HTTP 200).
    Bu rakamlar otomatik alımı ölçer, insanları değil ve herhangi bir materyalin bir
    eğitim veri kümesine girip girmediğini göstermez.
  fixes_title: İki tutarsızlık
  fix_1: Bir istemci tanımlama filtresi — tarayıcı bütünlüğü kontrolü — açıktı ve
    tarayıcıları kendilerini çok eski veya sahte olarak sunan az sayıda isteği sessizce
    geri çevirmişti. Okuyucuları tarayıcılarının parmak izine göre yargılamak bu politikaya
    aykırıdır; bu yüzden filtre kapatıldı ve müze, aynı tür isteğin sayfayı artık
    normal şekilde aldığını dışarıdan doğruladı.
  fix_2: Müzenin kendi robots.txt dosyasındaki bir bildirim, yapay zekâ eğitimine
    ve yapay zekâ girdisine hayır diyordu; bu, hem müzenin verileri üzerindeki CC0
    lisansıyla hem de her ikisine de izin veren tarayıcı ayarlarıyla çelişiyordu.
    Üç sinyali de — arama, yapay zekâ eğitimi ve yapay zekâ girdisi — evet olarak
    ayarlayan bir düzeltme, müzenin herkese açık deposunda hazırdır (çekme isteği
    8189). Henüz yayında değildir. Düzeltme birleştirildiğinde ve kurucu siteyi bir
    sonraki kez dağıttığında yürürlüğe girecek ve bu not o zaman güncellenecektir.
  exceptions_title: Kasıtlı istisnalar
  exceptions_body: Üç dar istisna, tasarı gereği, kalır. Müzenin test ortamı — kamuya
    açık içerik barındırmayan ayrı bir alt alan adı — kamuya açık indeksleme için
    tasarlanmamıştır olarak işaretlidir, böylece test sayfaları arama indekslerini
    veya arşivleri asla kirletmez. robots.txt, tarayıcılardan tek bir etkileşimli
    sayfanın (grafik gezgininin) yinelenen sorgu dizesi varyantlarını atlamalarını
    ister; sayfanın kendisi, her dilde, tamamen taranabilir kalır. Ve temel korumalar
    kalır — korunan modern asgari aktarım güvenliği düzeyiyle şifreli bağlantılar,
    platformun hizmet reddi sellerine karşı her zaman etkin koruması ve gözlemleyen
    ama asla engellemeyen pasif trafik istatistikleri.
  result_title: Sonuç
  result_body: Müze, meşru kamuya açık alımın önünde kasıtlı bir ihtiyari engel bulundurmaz
    — bir insan, bir arama motoru, bir yapay zekâ tarayıcısı, bir aracı, bir kazıyıcı,
    bir arşiv veya bir API istemcisi için — yalnızca yukarıda açıklanan platform ve
    güvenlik sınırlarına tabidir. Bir gün kamuya açık bir islam.museum sayfasının
    istemcinizi reddettiğini, ona meydan okuduğunu veya giriş yapmasını istediğini
    görürseniz, bunu bir politika değil bir hata olarak değerlendirin ve lütfen concerns@islam.museum
    adresine bildirin.
  policy_link: Açık Erişim Politikasını okuyun
  eng_body: Bu denetimin daha eksiksiz bir mühendislik kaydı, herkese açık depoda
    müzenin mühendislik belgeleriyle birlikte tutulur.
  eng_link: Mühendislik belgeleri
