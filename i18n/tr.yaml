    oğullar, oğullar, onun kızı, oğlu, kadın, mawudah), çocuklar (çocuklar, çocuklar,
    çocuklar, torunlar, İsrailoğulları, Adem''in çocukları), ebeveynleri ve itaatsizliği
    onurlandırma (ebeveynler, ebeveynlere saygı göstermek, itaatsizlik, onlara ''uff''
    deme, aşağılanma kanadını indir), yetimler ve emziricilik (yetimler, yetimler,
