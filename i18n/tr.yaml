umuma:
  title: İslam'da Annelik Tarayıcısı
  lede: 'Müzenin kaynaklarında annelik: anne ve statüsü ile onuru, hamilelik ve doğum,
    emzirme, çocuk velayeti ve yetiştirilme, peygamberlerin anneleri, sahabeler ve
    takipçiler—Kur''an''da, sahihlerde, muwatta''da, sünan''da, biyografilerde, Sahabelerin
    ve Takipçilerin geleneklerinde ve her kaydedilmiş kitapta—yeni metinler geldikçe
    kaynaklarının kayıtları artıyor.'
