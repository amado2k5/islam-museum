  pages:
    aayad:
      title: İslami Bayramlar ve Vesileler Tarayıcısı
      desc: Ramazan ve iki bayram, hac ve menasiki, Kâbe merasimleri, doğum, ölüm
        ve savaş âdetleri, yemekler, görenekler ve bölgesel farklılıklar ve bunları
        kaydeden hadis bölümleri.
      menu: Ramazan, bayramlar, hac, Kâbe merasimleri, hayat âdetleri ve göreneklerde
        gezin
    himam:
      title: Azim ve İrade Sahipleri Tarayıcısı
      desc: 'İslam kayıtlarında engellilik: kör, sağır, topal veya dilsiz yaşamış
        sahabeler ve âlimler — İbn Ümm Mektum, Amr b. Cemuh, Cüleybib, Ata, İbn Sirin,
        el-Maarrî ve Taha Hüseyin — ve onlara yer açan fıkıh.'
      menu: İslam'da engellilik şahsiyetlerini ve hükümlerini gezin
    zakat:
      title: Zekât ve Sadaka Tarayıcısı
      desc: 'Bir kurum olarak üçüncü rükün: zekât nedir, sekiz hak sahibi sınıf, nisap
        ve havil, beytülmal ve vergiler, Ebu Bekir''in savaşlarından bugüne tarihi
        ve kurduğu dayanışma.'
      menu: Zekâtın hak sahiplerini, hükümlerini, eserlerini, fetvalarını ve sünnetini
        gezin
    itq:
      title: Köle Azadı Tarayıcısı
      desc: 'İslam''da azad etme: azad edilmişler ve hikâyeleri — Bilal, Zeyd, Selman,
        Süheyb, Habbab, Ümm Eymen ve mevali âlimleri — itk, mükâtebe, tedbir ve ümmü''l-veled
        hükümleri, zekâtın fi''r-rikab payı ve veda hutbesindeki eşitlik.'
      menu: Azad edilmişleri, itik hükümlerini ve eşitlik öğretisini gezin
    hukm:
      title: İslam'da Yönetim Tarayıcısı
      desc: 'Nizamü''l-hüküm: hilafet ne idi ve halife kimdi, nasıl hükmetti, vezirlik
        ve vezirler, valiler ve divanlar, kadılar ve mezalim, hisbe ve şurta, hutbe
        ve sikke, ahkâm-ı sultaniyye kitapları, dört mezhebin görüşleri ve hükmün
        sünneti.'
      menu: Hilafeti, memurlarını, kurumlarını, eserlerini ve mezhepleri gezin
    atfal:
      title: İslam'da Çocuklar Tarayıcısı
      desc: 'İslam''ın ünlü çocukları — küçük sahabeler İbn Abbas, Enes, Üsame, iki
        torun, Ayşe; küçük yaşta ezberleyen, yolculuk eden ve komuta eden dâhiler
        — ve hukukta çocuğun hakları: akika ve isim, süt ve hadane, nafaka, yetimin
        malı, terbiye ve teklif.'
      menu: Çocuk sahabeleri, dâhileri ve çocuk haklarını gezin
    masakin:
      title: Yoksullar ve Ezilenler Tarayıcısı
      desc: İslam'ın yoksulları — suffa ehli ve dövülmüş mühtediler Sümeyye ve Yasir,
        Habbab, Bilal, Ebu Zer, Ebu Hureyre, Cüleybib — nasıl yaşadılar, ne dediler
        ve çektiler, fakirlik ve doyurma kavramları ve sünnetin yoksullara vaatleri.
      menu: Yoksul sahabeleri, suffayı ve yoksulluk sünnetini gezin
    imara:
      title: İslam Mimarisi Gezgini
      desc: 'İslam''ın yapılı dünyası: camiler, medreseler, saraylar, kaleler, kütüphaneler,
        rasathaneler, hastaneler, çarşılar, hanlar, hamamlar ve bahçeler.'
      menu: Kayıttaki cami, medrese, saray, kale ve sivil yapıları gezinin
    collection:
      title: Eserler ve Buluntular Gezgini
      desc: 'Malzeme ailesiyle koleksiyon: yazmalar, seramik ve cam, madeni işler,
        dokumalar, emanetler, silahlar, aletler ve sikkeler.'
      menu: 'Müzenin eserlerini gezinin: yazmalar, seramik, maden, dokuma, emanetler'
    tasawwuf:
      title: Tasavvuf Gezgini
      desc: 'Manevi yol: tarikatlar, arifler ve şeyhler, eserleri ve adlandırılmış
        makamlar ve kavramlar.'
      menu: Tarikatları, arifleri ve eserlerini gezinin
    kalam:
      title: Kelam ve Felsefe Gezgini
      desc: 'Düşünce ekolleri: fırkalar ve mezhepler, mütekellimun ve felasife, kelam
        ve felsefe eserleri.'
      menu: Ekolleri, mütekellimleri ve filozofları gezinin
    nisa:
      title: İslam Kadınları Gezgini
      desc: 'Kayıttaki her kadın: sahabe hanımlar, âlimler ve ravi''ler, arifeler,
        şairler ve yazarlar, sanatkârlar, hükümdarlar, sporcular ve toplum.'
      menu: 'Kayıttaki kadınları gezinin: sahabiler, âlimler, şairler, hükümdarlar'
    uhud:
      title: Ahitler ve Diplomasi Gezgini
      desc: 'Kayıtlı diplomasi: antlaşmalar ve misaklar, deklarasyonlar, ahdnameler
        ve onları taşıyan elçiler ve diplomatlar.'
      menu: Antlaşmaları, ahdnameleri ve diplomatları gezinin
    maahid:
      title: İlim Kurumları Gezgini
      desc: 'İlim ve şifa evleri: medreseler, kütüphaneler, rasathaneler, bimaristan
        hastaneleri ve ilmi kuruluşlar.'
      menu: Medrese, kütüphane, rasathane ve hastaneleri gezinin
    mawt:
      title: Kabirler ve Metfuneler Gezgini
      desc: 'İstirahatgâhlar: kayıttaki peygamber, âlim, hükümdar ve velilerin kabirleri,
        türbeleri ve makamları.'
      menu: Kabirleri, türbeleri ve makamları gezinin
    ulum:
      title: İlimler ve Âlimler Gezgini
      desc: 'Disiplinlerin ehli: astronomlar, matematikçiler, hekimler, coğrafyacılar,
        tabiat bilimcileri ve mühendisler.'
      menu: Kayıttaki bilim insanlarını disipline göre gezinin
    funun:
      title: Sanatlar ve Sanatkârlar Gezgini
      desc: 'Sanatlar ve ehli: hattatlar, ressamlar, musikişinaslar, mimarlar ve kitap
        sanatları.'
      menu: Hattatları, sanatkârları, musikişinasları ve mimarları gezinin
    heroes:
      title: İslam'ın Kahramanları
      desc: 'Kahramanlar Salonu: Altı erdem salonu — fedakarlık, cesaret, merhamet,
        cömertlik, bilgi ve kararlılık — ve her salonda tam hikayeleri ve kaynaklarıyla
        dört kahraman bulunur.'
      menu: Altı erdem salonu, yirmi dört şampiyon
    courses:
      title: Eğitim Keşfi
      desc: 'Konu ve içindeki müze: Okul sisteminizi, tanımınızı ve konuyu seçin.
        Müfredatınızdaki her ders, kendi kaynağı olan akademisyenler, icatlar, yerler
        ve yakın ayetlerle açılır; ayrıca bir kendi kendine test, sınıf sunumu ve
        basılı bir makale içerir.'
      menu: Her derste okul ve müze müfredatları
    seerah:
      title: Biyografi ve Hayatı
      desc: 'Biyografi bir yaşam biçimidir: gününüzü, haftanızı, ayınızı, yılınızı
        ve hayatınızın aşamalarını Peygamberlik rehberliğine göre düzenlemek için
        pratik kartlar.'
      menu: Biyografide günlük yaşama pratik bir yaklaşım
    tafsir:
      title: Yorumlama tarayıcısı
      desc: 'Kur''an tefsiri kitapları, cilt cilt: Öncelikle el-Taberi''nin Jami''al-Bayan''ı,
        her cilt kapsadığı ayetler ve kaynağı ile müzedeki diğer tüm tafsirlerle bağlantılıdır.'
      menu: Kur'an tefsiri kitaplarını okuyun
    quran:
      title: Kur'an
      desc: Sürekli okuma için tam Kur'an, Sure'nin — Donmuş Vahiy'in metni ve her
        ayet müzedeki kartının bir bölümüdür.
      menu: Kur'an'ı okuyun, Sura Sura ile Sura
    hadith:
      title: Hadis Kütüphanesi
      desc: Müze Konuşma Blogları — her çalışma kitabını metinler ve bağlantılarla,
        Sunnah.com bağlantılarla birlikte inceleyin.
      menu: Konuşma bloglarına göz atın
    timeline:
      title: Zaman
      desc: On dört yüzyıl etkileşimli Hicri ekseninde ve Gregoryen ikinci okuması.
      menu: 'Tüm tema: her giriş yıl ve yüzyıl bazında kroniklenmiştir'
    calendar:
      title: Hicri Takvimi
      desc: Gregoryen takvimi, günleri, tarih dönüştürücüsü ve .ics indirme ile her
        gün Hicri yılını ay ay gezin.
      menu: Hicri yılını ay ay inceleyin
    journeys:
      title: Geziler
      desc: 'Göç yolunun sırrı günbegün: istasyonlar, mesafeler ve geceler.'
      menu: Göç yolunun sırrı gün be gün
    graph:
      title: Bağlantı Gezgini
      desc: İnsanlar, olaylar ve yerler arasındaki ilişkiler bir takımyıldız gibi
        çizilir.
      menu: İnsanlar, olaylar ve yerler arasındaki ilişkiler
    map:
      title: Konum
      desc: 'İslam dünyası: zaman içinde etkileşimli bir harita: bölgeler, şehirler,
        önemli figürler ve olaylar, Hicri zaman çizelgesiyle.'
      menu: Zaman boyunca etkileşimli harita
    revelation:
      title: Vahiy ve Tarihçe
      desc: Kur'an'ı olaylarla birlikte vahyedildiği gibi okuyun.
      menu: Kur'an'ın vahyedildiği şekli ve olaylar
    surahmaps:
      title: Duvar haritaları
      desc: 'Her sure etkileşimli bir haritadır: konuları ve istasyonları ayet ayet
        anlatılır.'
      menu: Etkileşimli çit haritaları
    cards:
      title: Müze Kartları
      desc: 'Etkileşimli çalışma kartları: kelime haritaları, listeler ve hikayeler.'
      menu: Etkileşimli çalışma kartları
    sighar:
      title: Junior Süit
      desc: 'Müzedeki Çocuk Köşesi: Sözler Bahçesi ve Peygamberlerin Hoopoe ile Yolculuğu.'
      menu: Etkileşimli Çocuk Köşesi
    timeexplorer:
      title: Zaman Çizelgesi Gezgini
      desc: Kişisel bir hikaye, dönem veya şehir, istasyon, istasyon üzerinde etkileşimli
        bir zaman çizelgesinde yürüyün.
      menu: 'Rehberli turlar: kişisel hikaye, dönem veya şehir, istasyon'
    khutab:
      title: Ders ve Ders Gezgini
      desc: Vaaz kitaplarından tarihsel vaazlar ve kaydedilmiş ders serileri, her
        biri metnine ve kaynağına bağlıdır.
    fatwa:
      title: Fetva Kaşifi
      desc: Fetvalar, fetva kitaplarından ve kaynaklarına göre derlenen resmi ve tanınmış
        fetva sitelerinden alınan fetvalar, her biri müzenin dilinde özetlenmiş ve
        orijinal sayfasına bağlantı verilmiştir.
    poetry:
      title: Şiir Koleksiyonu
      desc: Müzede belgelenen şiirler, şairlerine göre düzenlenmiş olup, her şiir
        kendi bağlamı ve etkinliği içinde yer almaktadır.
      menu: Şairleri hakkında şiir okuyun
    qudsi:
      title: Kutsal Hadis Tarayıcısı
      desc: 'Peygamber''in altı kitapta Rabbi hakkında rivayet ettiği hadisler ve
        Malik''in Muwattası: her kitapta her hadis ve onun rivayetleri, güncel konulara
        göre düzenlenmiştir.'
      menu: Kutsal hadislere göz atın
    jobs:
      title: İş Tarayıcı
      desc: Müslümanların bildiği işler; yargıç, katiblikten el sanatlarına kadar,
        her birinin kendi mesleği ve nerede yapıldığı işler.
      menu: Tarih boyunca iş ve el sanatlarına göz atın
    inventions:
      title: Buluşlar Tarayıcısı
      desc: Belgelerde bulunan icatlar ve keşifler, yapıcılardan bağlamlara, üzerine
        inşa edilenlere kadar.
      menu: İcatları ve serilerini inceleyin
    modern:
      title: Çağdaş İslam Tarayıcısı
      desc: 'İslam ve Müslümanların son elli yılı: web siteleri, müzik, filmler, konferanslar,
        önemli şahsiyetler, organizasyonlar, sporlar, ödüller ve gelecek olanlar.'
      menu: Son elli yılı inceleyin
    companions:
      title: Al-Sahaba Tarayıcısı
      desc: 'Peygamber''in sahabeleri bir insan ağıdır: on adam, göçmenler, yardımcılar,
        Ehl-Beyt, kadın sahabeler, onların kabileleri, tanık oldukları olaylar ve
        ölümleri.'
      menu: Yoldaşları inceleyin
    asma:
      title: Allah'ın Güzel İsimlerinin Taraması
      desc: Allah'ın En Güzel İsimlerinden doksan dokuz isim, her biri kendi anlamı
        ve müzenin kayıtlarında yer alan hikayeleri var.
      menu: Allah'ın güzel isimlerini ve hikayelerini inceleyin
    khulafa:
      title: Successors Browser
      desc: Halifeler, her halife, saltanatı, soyu, saltanatının olayları ve belgelenmiş
        kayıtlar için Halifelik devletlerine göre — Raşidun'dan Sokoto'ya kadar —
        düzenlenmiştir.
      menu: Halifeleri ve Dönemlerini Keşfedin
    arabiyya:
      title: Arapça Tarayıcı Kur'an'ın Dili
      desc: 'Arapça, Kur''an''ın dilidir: dilini süsleyen ayetler, hadislerde anlatılanlar,
        sahabeler ve alimler, ifadesinin mucizeleri, tarihi, yazısı ve benzerlikleri,
        lehçeler, alimler, alimler ve kitaplar.'
      menu: Kur'an'ın dili olarak Arapçaya göz atın
    maajim:
      title: Sözlük Tarayıcısı
      desc: 'Arapça ve İslami Sözlükler: Kimler, ne zaman, hangi kitaplardan önce
        yazıldı, nasıl organize edildikleri ve nerede okunacağı konusunda.'
      menu: Sözlükleri ve yazarlarını inceleyin
    ghayb:
      title: Görünmeyen Dünya Tarayıcısı
      desc: Cinler, melekler ve ruh, zamanın ölçüleri, Mi'raj, Barzakh ve Saatin işaretleri
        — görünmeyen ve kaynakları.
      menu: Görünmeyen dünyada gezin.
    nature:
      title: Doğa Kaşifi
      desc: Hayvanlar, kuşlar, böcekler, deniz canlıları, bitkiler ve Kur'an ile Hadis'teki
        yaratılış olayları — her ayet ve hadis kaynağıyla birlikte.
      menu: Kur'an ve Hadislerde doğayı keşfedin
    angels:
      title: Angel Browser
      desc: Kur'an'da, Hadislerde, Peygamberlik kitaplarında ve kitaplarda — Cebrail,
        Mikail, İsrafil, soylu yazıp adamları ve Badr ile Hunayn melekleri — meleklerle
        ilgili her ayet ve kaynağından gelen rapor işlevlerine göre düzenlenmiştir.
      menu: Melekleri göz atın ve bahsedin
    dreams:
      title: Dream Browser
      desc: Kur'an'da, Hadis'te, Peygamber'de ve kitaplarda bahsedilen her vizyon
        ve rüya — Yusuf'un vizyonundan Leylat el-Kadir'in hayaletine kadar — ve her
        rüya kaynağa giren bir güne göre sınıflandırılır.
      menu: Kur'an'daki rüyalara, hadislere ve biyografiye göz atın
    dua:
      title: Dua Tarayıcısı
      desc: Kur'an'da, Sünnet'te, biyografide ve her kitapta bahsedilen her dua —
        "Rabbim, beni affet"ten "Ey Allah'a, sana sığınıyorum"a, Peygamber'in gece
        namazlarındaki duaları, Sahabe ve Müride duaları — ve kaynağı olan her ayet
        ve rivayet de yer alır.
      menu: Kur'an, hadis ve kitaplardaki duaları inceleyin
    ibadat:
      title: İbadet ve Anma Tarayıcısı
      desc: Kur'an, sünnet ve Seere'de bahsedilen her ibadet ve anma eylemi — dua,
        arınma, oruç, zekat, sadaka, hac, umre, anma, dua, yüceltme, af dileme, tövbe
        ve rukiyet — her ayet ve haber kaynağıyla birlikte.
      menu: Kur'an, hadis ve kitaplardaki ibadet ve anma işlemlerini inceleyin
    nar:
      title: Fire Browser
      desc: 'Kur''an''da, Sünnet''te, Peygamber''in Kitabı''nda ve her kitapta — Cehennem,
        Cehennem, El-Hatma, El-Hadha, El-Hamiyah ve El-Sair''de Ateş''in her bahsi,
        hazineleri, yakıtı, kıvılcımları, güvercinleri, yolları ve bu dünyanın ateşi
        de: İbrahim''in ateşi, Musa''nın ağacı ve savaş ateşi — her ayet ve kaynağıyla
        birlikte.'
      menu: Kur'an, hadis ve kitaplarda ateşin bahsini inceleyin
    janna:
      title: Paradise Browser
      desc: Kur'an'da, Sünnet'te ve Peygamber'in Kitabı'nda cennetle ilgili her şey—Cennet,
        Aden Bahçeleri, huzur yurdu, nehirleri, kapıları, dereceleri, toprağı ve insanları,
        sahabelerden ve Takipçilerden gelen her iz—ve kaynağıyla birlikte her ayet
        ve hadis.
      menu: Kur'an, Hadisler ve Kitaplarda Cennete Göz Atın
    qiyama:
      title: Baas Tarayıcısı, Kıyamet Günü ve Hesap
      desc: Kur'an'da, Sünnet'te, biyografide ve gerçekleşen her kitapta diriliş,
        Diriliş Günü ve hesap her anı — günün isimleri, borunun çalması, diriliş,
        diriliş, korkunçluk, onur, kutsal yazılar, teraziler, gölge, leğen, aracılık
        ve yol — her ayet ve haber kaynağıyla birlikte.
      menu: Kur'an, Hadisler ve kitaplarda diriliş, gün ve aritmetiği inceleyin
    tibb:
      title: İslam'da Peygamberlik Tıp, Tıp, Anatomi, Cerrahi, Tıp ve Şifa Tarayıcısı
      desc: Kur'an'da, Sünnet'te, Peygamber'in biyografisinde, Sahabelerin ve Takipçilerin
        raporlarında, tıbbi kitaplarda ve hasat edilen her kitapta — kupa, bal, kara
        ot, koter, rukıya, hastalık, enfeksiyon, veba, hastayı ziyaret, yaratılış
        evreleri ve vücut parçaları, yaralıların iyileştirilmesi, ilaçlar ve zehirler,
        tedavi kararı — peygamberlik tıp, tıp, anatomi, hastalık, hastalık, enfeksiyon,
        veba, hastanın ziyareti, yaralıların iyileştirilmesi, ilaçlar ve zehirler,
        tedavi kararı hakkında her ayet ve raporun belgelenmesi gibi her ayet ve raporun
        belgelenmesi yer almaktadır.
      menu: Kehanetçi Tıp, Tıp, Anatomi, Cerrahi, Tıp ve Şifa Alanlarına Göz Atın
    usra:
      title: Aile ve Evlilik Tarayıcısı
      desc: İslam'daki en ünlü evlilikler, Müslüman aileler, evleri, geçim kaynakları,
        günlük yaşamları ve sosyal gelenekler — evlilik, eşler, çocuklar, ikamet,
        geçim kaynakları, Kur'an'da, Sünnet'te, Peygamber'de adetler, her derlenmiş
        kitap, her ayet ve her rivayet kaynağı hakkında bahsedilen her şey.
      menu: Kur'an ve kitaplarda evlilikleri, aileleri ve günlük yaşamı inceleyin
    ubuwwa:
      title: İslam'da Ebeveynlik Tarayıcısı
      desc: İslam'da baba ve babalıktan bahsedilen her şey — Kur'an'ın ataları ve
        onların öğütleri, ebeveynlere ve itaatsizliğe saygı gösterme, Peygamber'in
        baba olarak, soy ve bağlılık ve babasını kaybeden yetim — Kur'an'da, Sünnet'te,
        biyografide, sahabelerin ve takipçilerin izlerinde, derlenmiş kitapta ve kaynağıyla
        birlikte her ayette ve izlerde.
      menu: Kur'an ve Kitaplarda Babalık ve Babalık üzerine göz atın
    ukhuwwa:
      title: İslam'da Kardeşlik tarayıcısı
      desc: 'İslam''da kardeşlik: Kardeşler ve kardeşler — kardeşler, kardeşler, göçmenler
        ile Ensar arasındaki kardeşlik, Allah için sevgi, özgecilik, kardeşlik hakları
        ve Kur''an, Sünnet ve Seere''deki kardeşlik uyarıları, her derlenmiş kitap,
        her ayet ve rapor kaynağı ile birlikte anlatılan her şey.'
      menu: Kur'an ve kitaplarda kardeşlik, kardeşlik ve kardeşlik haklarını inceleyin
    sport:
      title: İslam'da Spor ve Yarışmalar Tarayıcısı
      desc: Atçılık, yüzme, okçuluk ve Müslümanlar arasında düzenlenen tüm sporlar
        ve yarışmalar — güreş, güç ve kuvvet, yarışma, mızrak yapımı, top ve masa
        oyunları, avcılık ve modern sporlar — Kur'an'da, Sünnet'te, Peygamber'de,
        Sahabeler ve Takipçilerin geleneklerinde, toplanan her kitapta ve kaynağıyla
        birlikte her ayet ve raporda bulunur.
      menu: Kur'an ve kitaplarda binicilik, yüzme, okçuluk ve Müslüman sporlarını
        inceleyin
    umuma:
      title: İslam'da Annelik Tarayıcısı
      desc: Kur'an, Sünnet ve Peygamber'in biyografisinde annelik, anne, statüsü,
        hamileliği, doğum, emzirme, velayet, yetiştirilme tarzı, ebeveynlere saygı
        gösterilmesi, toplanan her kitap, her ayet ve gelenek ile kaynağı yer almaktadır.
      menu: Kur'an'da ve kitaplarda annelik ve annelikleri inceleyin
    bunuwwa:
      title: İslam'da Oğulluk Tarayıcısı
      desc: 'Oğullukla ilgili her şey — oğullar, kızlar, oğullar ve çocuklar — Kur''an''da,
        Sünnet''te, Peygamber''in biyografisinde, Sahabeler ve Takipçilerin geleneklerinde
        ve her toplu kitapta bulunur: ebeveynleri ve onların itaatsizliğini, yetimleri
        ve emzirmeleri, çocuk haklarını, oğul ve kız hikayelerini ve kaynağıyla birlikte
        her ayet ve raporu içerir.'
      menu: Kur'an'daki oğulluk, hadis ve kitaplara göz atın
    islamiceconomy:
      title: Para Tarayıcısı, Sukuklar ve İslami Vakıf
      desc: Kur'an'daki para birimleri, İslami ekonomi, sukuk, sözleşmeler, bağışlar
        ve her kitap — para, tefecilik, borç, satış sözleşmeleri, ağırlıklar, ölçüler,
        cizye, kharaj, vakıf, sürekli yardım — her ayet ve kaynağına atıfta bulunulur.
      menu: Kur'an, Hadisler ve kitaplardaki para birimleri, sukuk ve vakıfları inceleyin
    trade:
      title: Kış ve Yaz Karavan Gezicisi, İpek Yolu ve Müslüman Ticareti
      desc: Kış ve yaz kervanı, Kureyş'in sevgisi, İpek Yolu ve Müslümanların Kur'an,
        Sünnet ve Seere'deki ticareti ile her kitap — kervanlar, develer, kervanlar,
        kervanlar, hanatlar, ribatalar, ticaret yolları, pazarlar, tüccarlar, mallar,
        ölçüler, teraziler ve deniz ticareti — ve kaynağı olan her ayet ve haber.
      menu: Kervanları, İpek Yolu'nu gezin, Kur'an, hadis ve kitaplarla ticaret yapın
    sayyiat:
      title: Tarayıcı Hataları
      desc: Kur'an'da, sünnette, biyografide ve kaydedilmiş her kitapta, her ayet
        ve kaynağında günah, kusur, günah, büyük günahlar, küçük günahlar, tövbe ve
        af dileme gibi günahlar ve ilgili konular her şekilde bahsedilir.
      menu: Kur'an ve kitaplardaki günahları ve ilgili konuları inceleyin
    hudud:
      title: Tanrı'nın sınırlarını ve büyük günahlarını inceleyen
      desc: Allah'ın cezaları ve büyük günahlar hakkında her bahs—'Bunlar Allah'ın
        sınırlarıdır'—hudud, taşlama, kırbaçlama, el kesilmesi ve tazir, zina, hırsızlık,
        iftira, alkol, dinden dönme gibi ceza suçları, yedi büyük günah ve yedi yıkıcı
        günah—Kur'an'da, Sünnet'te, biyografide, Sahabelerin ve Müritlerin haberlerinde,
        yaşanan her kitapta, her ayet ve haberde kaynağı ile birlikte.
      menu: Kur'an'da ve kitaplarda Allah'ın sınırlarını ve büyük günahları inceleyin
    arkan:
      title: İslam'ın sütunlarını, inanç sütunlarını, inançlı insanları ve müminin
        niteliklerini gözden geçirmek
      desc: İslam'ın beş sütunun, inancın altı sütunun, yetmiş birkaç inanç dalı,
        Kur'an'daki müminlerin nitelikleri, Sünnet, biyografi, sahabelerin ve takipçilerin
        haberleri, kaydedilmiş her kitap, kaynağı olan her ayet ve haber her şekilde
        anılır.
      menu: İslam'ın, inancın, inançlı insanların ve müminlerin niteliklerinin temel
        taşlarını keşfedin
    ahkam:
      title: Yükümlülükler, görevler, önerilen şeyler, sevilmez davranışlar ve yasaklar
        tarayıcısı
      desc: Kur'an, Sünnet, biyografi, sahabe ve takipçilerin gelenekleri, ilke ve
        hukuk kitapları ile her ayet ve raporda belirtilen zorunlu görevler, ister
        özel ister yeterli olsun, itaat eylemleri, zorunlu görevler, önerilen eylemler,
        yasaklar, sevilmez eylemler, küçük günahlar ve izin verilen şeyler yer alır.
      menu: Zorunlu eylemleri, önerilen eylemleri, sevilmediğiniz eylemleri, yasakları
        ve küçük günahları inceleyin
    halal:
      title: Helal ve Haram tarayıcı
      desc: İslam'da neyin yasal ve yasak olduğuna dair her şey — Allah'ın restoranlarda,
        içeceklerde, giysilerde, evliliklerde ve kazançlarda izin verdiği ve yasak
        ettiği — Kur'an'da, Sünnet'te, biyografide, sahabelerin ve takipçilerin raporlarında
        ve elde edilen her kitapta, kökenleri ve bölümleriyle ilgili ayrıntılı kayıtlarla
        birlikte yer alır.
      menu: Kur'an, Sünnet ve kitaplarda helal ve haram olanları inceleyin
    hasanat:
      title: Tarayıcının Avantajları
      desc: Kur'an, Sünnet ve biyografide yapılan her iyi eylem anılması, her kitap
        — "Gerçekten iyilikler kötü işleri ortadan kaldırır," "İyi bir iş getiren
        on katı alır," ve iyi işlerin yazısı, iyi borç ve "iyilik" için ödül — her
        ayet ve kaynağı ile birlikte.
      menu: Kur'an ve kitaplardaki erdemleri inceleyin
    hisab:
      title: Liste, hesaplayıcı ve artılar ile eksiler sayacı
      desc: Kur'an, Sünnet, Peygamber ve her toplanmış kitapta sayan, yazan, çoğalan,
        silen veya tartılan her metin, metinlerde adı geçen sayıları okuyan bir hesap
        makinesi, hatırlama sayacı ve her sayı metnine atfedilen bir hesap makinesi
        ile birlikte yazılır.
      menu: İyi ve kötü eylemlerin listesi, hesaplayıcısı ve sayacı
    mukatabat:
      title: Yazışma Tarayıcısı
      desc: Kur'an, Sünnet ve biyografideki yazışmalara dair her bahs, ortaya çıkan
        her kitap — Peygamber'in krallara ve imparatorlara yazdığı mektuplar, halifelerin
        mektupları ve onlara yazılanlar, Süleyman'ın Bilkis'e mektubu — ve kaynağıyla
        birlikte her ayet ve rapor.
      menu: Kur'an'daki kitapları ve yazışmaları inceleyin ve kitaplar
    nuzul:
      title: Nüzul Sebepleri Tarayıcısı
      desc: Kur'an, Sünnet, siyer, sahabe ve tabiin haberleri ve derlenen her kitapta
        bir ayetin veya surenin neden indirildiğine dair her rivayet — mağaradaki
        ilk vahiy, hicap, içki, ifk, li'an ve zihar ayetlerinin sebepleri — her rivayet
        kaynağıyla.
      menu: Kur'an ve kitaplardaki vahiy sebeplerini gezin
    munazarat:
      title: Tartışma Tarayıcısı
      desc: Kur'an'da, Sünnet'te ve biyografide bahsedilen her tartışma ve münazara,
        yayımlanan her kitap — İbrahim'in halkı ve Nemrüt ile tartışmaları, Necran
        Hristiyanlarının Mubahalası, Negus'a göre tartışma, İbn Abbas'ın Haricilerle
        tartışması, bir kitapta bahsedilen her tartışma — her ayet ve raporun kaynağına
        atıfta bulunması.
      menu: Kur'an ve kitaplardaki tartışmaları ve tartışmaları inceleyin
    ritha:
      title: Ağıt ve ölüm ilanında söylenen en ünlü şeylerin tarayıcısı
      desc: 'Kur''an''da, Sünnet''te, Peygamber''in biyografisinde, sahabelerin ve
        takipçilerin haberlerinde ve her derlenen kitapta merhumlar için ağıt, ölüm
        ilanı, başsağlığı ve ağlama hakkında söylenen her şey: hatırlama, Peygamber''in
        "Gerçekten Allah''ın aldığı şey vardır, verdiği ona aittir," Ja''fer, Zayd,
        İbn Rawaha ve El-Neceşi''nin ölüm ilanları, Hasan ve Ka''b bin Malik''in ağıtları
        ve yas sınırları, her ayet ve rivayetin belgelenmesi.'
      menu: Ağıtlar, ölüm ilanları ve taziyelerdeki en ünlü sözlere göz atın
    juha:
      title: Juha Tarayıcısı ve İslami Folklor
      desc: Cuha, Nasreddin Hoca, Eş'ab ve Naiman ile Kur'an, Sünnet, biyografi ve
        her ayet, haber ve kaynağıyla birlikte toplanan edebiyat ve tarih kitaplarındaki
        anekdotlar, şakalar ve kahkahalar.
      menu: Kur'an, Sünnet ve kitaplardaki Juha, anekdotlar, şakalar ve şakalar hakkında
        göz atın
    magic:
      title: Magic and Witches Tarayıcısı
      desc: Kur'an'da, Sünnet'te, Peygamber'de ve kutsal metinlerde — sihir, fal,
        rukıya, nazar ve kıskançlık — her ayet ve kaynağında her bir ayet ve haber
        ile birlikte her bahs.
      menu: Kur'an ve kitaplarda büyü ve büyücüleri inceleyin
    cosmos:
      title: Yabancı Kaşif, Eski İnsan Ulusları ve Evrenin Sırları
      desc: 'Kur''an, Sünnet ve kutsal metinlerin yeryüzünden, göklerden ve yedi yeryüzünden
        öte yaratıklar, Adem''den önce yeryüzünde yaşayanlar, yok olan uluslar ve
        evrenin sırları hakkında söyledikleri: her ayet ve rivayet belgelenmiş, her
        görüş onun anlatıcısına atfedilmiştir.'
      menu: Evrenin geçmiş varlıklarını, uluslarını ve sırlarını keşfedin
    qiraat:
      title: Kur'an Okumaları, Yazım Yazıları, Yazı Tipleri ve Nokta Tarayıcı
      desc: 'Yedi mektup, okumalar ve imamları, Kur''an''ın derlenmesi ve Kur''anların
        kopyalanması, Muşaf''ın yazısı, yazım farklılıkları, nokta ve şekli, yazıldığı
        yazılar: her ayet, rivayet ve doğrulanmış rapor ile yazarına atfedilen her
        ifade.'
      menu: Okumaları, Kur'an çizimlerini, yazılarını ve noktalarını inceleyin
    tajwid:
      title: Tecvid ve Tilavet Tarayıcısı
      desc: On yedi mahrec ve harflerin sıfatları, tecvid hükümleri, tertil ve okuma
        ile dinleme adabı, nağmeler, okuyucular ve öğretim metinleri — her ayet, rivayet
        ve kitap pasajı kaynağıyla.
      menu: Tecvid hükümlerine ve tilavet sanatına göz atın
    ulama:
      title: Düşünürler, bilim insanları, yazarlar, hadis âlimleri ve yazarlar için
        tarayıcı
      desc: 'Müzedeki her düşünür, alim, yazar, hadis âlimi ve yazar—Kur''an''da,
        Sünnet''te, Seere''de ve her toplu kitapta söylenen her şey: hayatları, görevleri,
        sözleri, kitapları, toplantıları ve eserleri—ve kaynağına dair her atıfla.'
      menu: Düşünürleri, bilim insanlarını, yazarları, hadisalimleri, yazarları ve
        haberlerini inceleyin
    wasaya:
      title: Peygamberlerin ve Doğru Peygamberlerin Emirlerini, Miraslarını, Antikalarını
        ve Tapınaklarını Tarama
      desc: Peygamberlerin, elçilerin, halifelerin, sahabelerin, takipçilerin, imamların
        ve doğruların ölümlerinden önceki öğütleri, geride bıraktıkları, mirasları,
        Kur'an, Sünnet, biyografi ve her derlenmiş kitaptaki türbeleri, kaynağına
        atfedilen her ayet ve haberle birlikte.
      menu: Vasiyetleri, mirasları, anıtları ve tapınakları inceleyin
    signs:
      title: Saat İmzaları Tarayıcısı
      desc: Kur'an, Sünnet, Biyografi ve kitaplarda yaşananlar—büyük ve küçük işaretler,
        Barzakh, diriliş, hesaplaşma, denge, yol, havza, cennet ve cehennem—ve her
        ayet ve haber kaynağı ile birlikte her şeyin işaretleri.
      menu: Saat ve Ahiret işaretlerini inceleyin
    jinn-devils:
      title: Cinler ve Şeytanlar Tarayıcısı
      desc: Cinler, şeytanlar, melekler ve onları taşıyan rüyalar — her biri Kur'an'da,
        Hadis'te ve kaynağıyla birlikte Şey'de bahsedilir.
      menu: Cin, Şeytan ve Meleklere Göz Atın
    messengers:
      title: Messengers ve Prophets Tarayıcısı
      desc: Kur'an, Sünnet, biyografi ve hasat edilen kitaplarda elçiler ve peygamberlerin
        her bahsi — isimli peygamberler, elçiler ve hikaye anlatıcıları, her ayet,
        rivayet ve rivayet kaynağı ile birlikte.
      menu: Elçileri ve peygamberleri inceleyin ve onları anınız
    miracles:
      title: İlahi Mucizeler ve Havarilerin Mucizeleri Tarayıcısı
      desc: Kur'an, Sünnet, biyografi ve hasat edilen kitaplarda ilahi mucizelerin
        ve elçilerin mucizelerinin her bahsi — Kur'an mucizesi, ayın bölünmesi, İsra,
        Mi'raj, asa, deniz, Saleh'in dişi devesi, gemi, ateş, çamur kuşlar, beşiğin
        sözleri, göksel sofra, Süleyman'ın işaretleri, rüyalar, Zekeriya'nın müjdesi
        ve Sandık, kaynağıyla birlikte her ayet, rivayet ve rivayet ile birlikte.
      menu: İlahi Mucizeler ve Havarilerin Mucizelerine Göz Atın
    qurun:
      title: Yüzyılların, yılların, önemli ayların ve kutsal ayların tarayıcısı
      desc: Kur'an, Sünnet, biyografi ve hasat edilen kitaplarda önemli yüzyıllar,
        yıllar, aylar ve kutsal aylar — biyografide isimlendirilen yıllar, on iki
        ay ayı, dört kutsal ay ve Nas'i — ile kaynağına atıfta bulunan her ayet, rapor
        ve rivayet her yer alır.
      menu: Yüzyılları, yılları, ayları ve kutsal ayları inceleyin
    madhahib:
      title: Dört Düşünce Okulu Tarayıcısı
      desc: Dört imam, kurdukları okullar, ilk nesiller ve kaydettikleri kitaplar
        ve metinler — her biri Sünni kitaplarındaki okullara ve kaynağına atıfta bulunuyor.
      menu: Dört tarikatı ve anılarını keşfedin
    umam:
      title: Ulusların, Dinlerin, Mezheplerin ve Gayrimüslim Halkların Tarayıcısı
      desc: Kur'an, Hadis, biyografi, Sahabe ve Takipçilerin haberleri ile her Kitap'ta
        bahsedilen her millet, din, mezhep ve gayrimüslim halk—yok olmuş uluslar,
        Kitap ehli, prikperestler, krallar ve yeryüzü insanları ile kaynağına dair
        her bahs.
      menu: Ulusları, dinleri ve halkları gözden geçirip onları anmak
    bayt:
      title: Peygamberlik Evi ve peygamberin ailesinin tarayıcısı
      desc: Peygamberlik Evi ve Peygamber'in ailesi hakkında bahsedilen her şey —
        Ehl-Beyt, soyundan, Banu Haşim, Peygamber'in eşleri ve kızları, oğulları ve
        torunları — Kur'an, Sünnet, biyografi ve derlenen kitaplarda yer almaktadır.
      menu: Peygamberlik Evi ve Peygamber'in ailesini keşfedin
    nubuwat:
      title: Kur'an'ın Kehanetleri, Sırları ve Mucizeleri Tarayıcısı
      desc: Peygamber'in her peygamberliği, peygamberliğin her kanıtı, Kur'an'ın her
        gizli ve gizli yönü, Kur'an, Sünnet ve biyografideki her mucize ve saat işareti,
        sayılan her kitap — her ayet ve her rivayet kaynağı ile birlikte.
      menu: Peygamberin peygamberliklerini, sırlarını ve Kur'an mucizelerini inceleyin
    places:
      title: İslam'da Kutsal ve Önemli Değerli Yerlerin Tarayıcısı
      desc: Kur'an'da, Sünnet'te, Peygamber'in biyografisinde, sahabelerin ve takipçilerin
        rivayetlerinde ve her kutsal kitapta bahsedilen İslam'daki her kutsal, önemli
        veya değerli yer — üç kutsal yer, Hac yeri, biyografi yerleri, Kur'an'da adı
        geçen yerler ve rivayette adı geçen her yer.
      menu: İslam'daki kutsal ve önemli yerleri keşfedin
    akhlaq:
      title: Etik ve İşlemler Tarayıcısı
      desc: Kur'an, Sünnet, biyografi, Sahabe ve Takipçilerin raporları ve her kitapta
        ahlak ve işlemlere dair her bahs sayılır — doğruluk, güvenilirlik, sadakat,
        sabır, minnettarlık, alçakgönüllülük, iyilikseverlik, alçakgönüllülük, sabır,
        affetme, samimiyet, tövbe, cömertlik, ebeveynlere saygı gösterme, aile bağlarını
        sürdürmek, komşu hakları, yalan söyleme, ihanet, kibir, ikiyüzlülük, cimrilik,
        sırtüstü isfak, dedikodu, öfke, adaletsizlik, itaatsizlik, ikiyüzlülük, dolandırıcılık,
        satış, tefecilik, borç, borç, krediler, ipotekler, kiralama, vasiyetler, miras,
        evlilik, boşanma, yemin, tanıklık, yargı, denge, uzlaşma, hediye, sponsorluk,
        ajans, ortaklık, barış, devir, çıplaklık, gasp, önlem, tekel, zorlama ve etkisizlik
        — ve her ayet ve rapor kaynağıyla birlikte.
      menu: Kur'an, Hadisler ve kitaplardaki etik ve işlemleri inceleyin
    ansab:
      title: Soybilim, ırklar, klanlar ve peygamberler ile elçiler ağacı
      desc: Kur'an, Sünnet ve biyografide her soy, soy, aşiret, peygamberler ağacı
        ve her kitap sayılır — Peygamber'in soy hattı üç bölümüyle, Arapların kabileleri
        ve klanları, halklar — her ayet ve haber kaynağı ile birlikte.
      menu: Soy ağacını, ırkları, klanları ve peygamberler ağacını inceleyin
    i3lam:
      title: Müslüman Medya Tarayıcısı
      desc: Kur'an'da, Sünnet'te, biyografide ve her kitapta kelimenin yaratıcılarının
        — müezzin, çağıran, vaiz, resmi sözcü, yazar, gazeteci, medya kişiliği, etkileyici,
        reformcu ve devrimci — her kez bir hasattır, sözü taşıyanlarla birlikte.
      menu: Müslüman medya profesyonellerine göz atın
    battles:
      title: İstilalar, Savaşlar ve Fetihler Tarayıcısı
      desc: İslam tarihi boyunca baskınlar, sarayalar, savaşlar, kuşatmalar, fetihler
        ve savaşlar — önce seferler, sonra tür ve döneme göre.
      menu: İstilalar, Savaşlar ve Fetihler Arasında Gezin.
    timemachine:
      title: Zaman makinesi
      menu: Her iki takvimle herhangi bir tarihe seyahat edin
    wander:
      title: dolaşmak
      menu: Müzeden rastgele bir sayfa
    muamalat:
      title: Muamelat ve Kişisel Hâl Fıkhı Tarayıcısı
      desc: Bir hayata dokunan hukuk — kim miras alır kim mahrum kalır, kim kiminle
        evlenebilir, akitler ve haram kazançlar, ne yenir ne içilir, cezalar, bugünün
        fetvaları ve sünnet babları.
      menu: Miras, evlilik, akitler, yiyecek ve cezaları gezin
    dukhul:
      title: İslam'a Giriş Tarayıcısı
      desc: Kapı iki yönde — İslam'a giren sahabeler ve halklar, bugünün mühtedileri,
        çıkanlar ve mürted peygamber iddialıları, şehadet, küfür ve ridde hükümleri.
      menu: Mühtedileri, ayrılanları ve hükümleri gezin
    maadin:
      title: Madenler, Para ve Zenginler Tarayıcısı
      desc: Altın, gümüş ve madenler; dinarlar, dirhemler ve sekk; mücevherat; zenginler
        — varlıklı sahabeler, kodamanlar ve a'yan — ve Karun, istif ve israf kıssaları.
      menu: Madenleri, parayı, mücevheri ve zenginleri gezin
