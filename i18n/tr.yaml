wasaya:
  title: Peygamberlerin, elçilerin, doğru insanların, imamların, takipçilerin, halifelerin,
    ölümden önceki sahabelerin, miraslarının, miraslarının ve türbelerinin emirlerini
    taramak
  lede: 'Müzenin kaynaklarında peygamberlerin, elçilerin, halifelerin, sahabelerin,
    takipçilerin, imamların ve doğru kişilerin vedalarıyla ilgili her şey: onlardan
    sonra ne önerdikleri, son saatlerinde söyledikleri, geride bıraktıkları, sonrasında
    neler korunduğu ve kitaplarda gömüldüklerinin nerede geçtiği belirtilir. Buradaki
    her materyal, kaynağına atfedilen bir ayet, haber veya kayddır.'
  badge: Emirler Gezgini
  hero_kufi: Vasiyetnameler · Miras · Antikalar · Tapınaklar
  hero_naskh: Ayrılmadan önce ne tavsiye ettikleri, geride bıraktıkları ve dinlenme
    yerleri nerede
  status: Bu kopyada, {n} {s} bölümlerinde bir kayıttır; her kayıt kaynaklarını belirtir
    ve metinler bu kaynaklardan yapay zeka ajanları tarafından yazılmış olup henüz
    insanlar tarafından okunmamıştır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Bu tarayıcı, beş ilgili konuda söylenen ve yazılanları toplar: son
    emirler ve antlaşmalar, ölüm saati, miraslar ve geride kalanlar, korunan kutsal
    emanetler ve mezarlar. Kur''an ayetleri bir referans tablosundan alınmıştır (İbrahim
    ve Yakup''un emirleri, Luqman''ın emirleri, vasiyet, miras, antikalar, ölüm ve
    gömülme ayetleri) ve ayetin metni donmuş vahiyin metnidir ve yeniden yazılamaz.
    Hadis, biyografi, tarih ve biyografiler dahil diğer her şey, inşa sırasında dikkatlice
    korunan bir kelime listesi halinde toplanmıştır; böylece burada bir kitabın her
    bölümü girdiği günün ilerleyen saatlerinde hasat edilir. Kitap alıntıları, kayıtlı
    kopyalardan makine tarafından okunabilir, yaklaşık kırk kelimedir ve düzeltilmemiştir.
    Burada, genel yükümlülüklerin hükümleri hukukçular arasında değil, bireylerin
    mirası ve peygamberlerin mirasıyla ilgili Peygamber''in hadisleri birleştirilir.
    Mezarın yerini belirlemek, müzenin beyanı değil, bahsedilen kaynağın beyanıdır.
    Geleneksel kaynaklar çerçeveyi oluşturur ve diğer görüşler bahsedilmeden önce
    adlandırılır.'
