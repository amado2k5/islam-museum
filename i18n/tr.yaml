ansab:
  title: Soybilim, ırklar, klanlar ve peygamberler ile elçiler ağacı
  lede: 'Müzenin kaynaklarında soylar, soylar, klanlar ve peygamberler ve elçiler
    ağacından bahsedilen her şey: Peygamber''in soy hattı üç bölümde — Adnan''a ait
    kabul edilen, İbrahim''e kadar tartışmalı olanlar ve yukarısında — ve Arap Adnanis
    ve Kahtanis kabileleri, Arap, Arap olmayan, Romalı, Habeşli, Kıpti ve İsrail Çocukları
    ırkları ve halkları, Haşim, Muttalib, Abd Şams, Makhzum ve Zehra''dan Aws, Khazraj,
    Hawazin ve Qays klanlarına kadar — Kur''an, Sünnet, biyografi, Sahabe ve Takipçilerin
    raporları, kurulmuş her kitap ve takip eden her kitap yer alır.'
  badge: Soybilim, ırk ve soy kaşifi
  status: Bu yapı, {n} bir kayıt ve {f} {s} bölümlerine ayrılmıştır; metinler taslaklardır
    ki kişi onları okuyabilsin.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, yedi dilli üslubu ve ifadeleriyle sıradan bir
    müze kaydı. Bölümlerin metinleriyle korunan bir sözlükte anılar bulunur: Peygamber
    soy çevrelerinin isimleri (Abdullah ibn Abdul Muttalib''den Adnan''a, ardından
    tartışmalı çevrelerden İsmail ve İbrahim''e), kabilelerin ve aşiretlerin isimleri
    (Qurayş, Banu Haşim, Ovs, Hazraj, Tamim, Hawazin, Thaqif, Ghatfan, Quda''ah, Kindah,
    Bakr, Taghlib ve diğerleri), halkların isimleri (Araplar, Arap olmayanlar, Persler,
    Romalılar, Habeşliler, Kıptiler, Türkler, Berberiler, Kürtler, Moğollar ve Banu
    İsrail), klan isimleri (Qurayş klanları, Aws, Hazraj klanları, Hahaz ve Kays klanları)
    ve genel terimler ( soy, soy, kabile, karın, klan, klan, uyluk, aile ve peygamberler
    ağacı); ''ad'' geri dönüş anlamına gelir, ''tamim'' tam anlamında, ''matn'' geri
    anlamına gelir ve belirli artikülasyonda belgelenen yanlış pozitifler hariç tutulur.
    Daha sonra ortaya çıkan her kitap, bölümleri tabloya yerleştirildiğinde otomatik
    olarak burada belirtilir ve seçilen kayıtlar ansab-browser etiketiyle birleştirilir.
    Her pasaj, kaynağı (Kur''an/Sünnet/Biyografi/Kitaplar) ve konularıyla işaretlenir.'
