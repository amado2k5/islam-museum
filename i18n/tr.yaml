      kaşifte anlaşılan {n}''den biridir; yaşam alanına yerleştirilir; boyutu, onu
      anan Kur''an ayetleri ve hadis bölümlerinin sayısıyla ölçülür, altı aralıktaki
      aynı kare kök ölçeğinde. Müzede henüz bahsedilmemiş kavramlar, {z} numaralı
      olarak, mümkün olduğunca küçük ve sayı olmadan çizilmiştir.'
