    heavens: Gökyüzü, küreler ve yıldızlar
    origins: Yaratılışın Başlangıcı
    before-adam: Adem'den önce yeryüzünde yaşayan
    lost-peoples: Nesli tükenmiş uluslar
    hidden-peoples: Gizli Halklar
    secrets: Evrenin ve Görünmeyenin Sırları
  sections:
    quran:
      title: Kur'an'da
      desc: Göklere ve yeryüzüne dağılmış yaratıkların işaretleri, yedi gökyüzü ve
        yeryüzünden eşdeğerleri, yaratılışın başlangıcı, yeryüzünün ilk sakinleri,
        'Ad ve Thamud, Gog ve Magog, baraj, görünmeyenin işaretleri ve anahtarları.
    sunnah:
      title: Yıllık
      desc: Yedi yeryüzü hakkında, gökler ve onların sakinleri, yaratılışın başlangıcı,
        Taht'ın altındaki güneş ve Peygamber'in önceki uluslar hakkında anlattıkları.
    seerah:
      title: Biyografide
      desc: Bu konuları hangi biyografiler ve tarih kitapları taşımaktadır; bu bölüm,
        yeni biyografik metinlerde böyle referanslar bulunduğunda kendini doldurmaktadır.
    books:
      title: Diğer kitaplarda
      desc: 'Tafsir, tarih, coğrafya, yaratıkların harikaları üzerine kitaplar ve
        şiir: Kur''an, Hadis ve Seere dışındaki konuları ele alan ve bu konuları ve
        sonrasında olacak her şeyi kapsayan her kitap.'
    concepts:
      title: Bu konuların günlükleri
      desc: 'Seçilmiş Müze Kayıtları: Kaynaklarda Dünya''nın Ötesinde Yaşam, Yedi
        Dünya, Adem''den Önceki Dünya, Soyu Tükenmiş Uluslar, Gog ve Magog, Taht ve
        Tablet ve tüm bunların ortaya çıkardığı sorular.'
  viz:
    title: Evren yörüngelerde
    lede: 'Dünya merkezdedir ve her eksen onun etrafında döner: dünyanın en eski sakinlerinden
      ve göklere gelen uluslardan, dünyanın ötesindeki yaratıklardan, yaratılışın
      başlangıcından ve kenardaki görünmeyenin sırlarından başlayarak. Her nokta,
      kendi bloguna göre renkli bir kayıt ve sayfasına bağlantıdır; iki eksenli kayıt
      ise iki yörüngede yer alır.'
