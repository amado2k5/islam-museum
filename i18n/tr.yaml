    arabia: El Cezire — Çoktanrıcılık
    kitab: Kitap ve Tarikatların İnsanları
    rum: Romalılar — Sezar
    fars: Fars — Kisra
    habasha: Habeşistan
    rim: Uzak halklar
    ayan: Önemli Kişiler
    sukun: Al-Diyar
    mafahim: Kavramlar
    kutub: Kitaplar
i3lam:
  title: Müslüman Medya Tarayıcısı
  lede: Sözü taşıyanların her anı — pazarlarda çağırana namaz kılan müezzinden, vaizden,
    halifenin sesiyle konuşan ve Peygamber'in krallara elçisi, vahiy yazıcısı ve mahkeme
    yazıcısı, yeni yayınların gazetecisi, medya profesyoneli ve etkileyici, reformcu
    ve devrimci — Kur'an'da, Sünnet'te, biyografide, Sahabelerin ve Takipçilerin hikayelerinde
    ve her kitap müzede sayılır, şimdi ve ileride hasat edileceklerde.
  badge: Kelime Yapıcı Tarayıcı
  status: Bu yapıda, {n}, {s} kaynaklarında referans verilen {j} ve {f} metinlerinde
    medya rolü olan kişidir; metinler, kişinin okuyabilmesi için taslaklardır.
  method_title: Tarayıcı nasıl çalışır
  method_note: Buradaki her kayıt, kaynakları ve üçharf düzyazısıyla sıradan bir müze
    kaydıdır. Bir kişi, kendi kaydına meslek girmeden bir role katılır — çıkarım yapmaz.
    Metin, çizim gerçekten mektuptan bahsedilen kişilere veya medya mesleğine kaydedildiğinde
    ya da kayıt i3lam-browser etiketi taşıdığında — metnin indirildiği gün burada
    bir kitapta daha sonra yer alır, bu sayfa düzenlenmeden. Her metin kaynağına göre
    işaretlenir (Kuran / Sünnet / Biyografi / Kitaplar).
  requirements: Bu tarayıcı için orijinal uygulama ve kabul kriterleri korunmaktadır
  wire_title: Tel — minareden akışa
  wire_aria: 'Medya zinciri diyagramı: Her istasyon bir iletim kablosu açar ve döngü
    boyutu kayıtlı kullanıcı sayısına göre ölçülür.'
  wire_note: 'Her daire tel üzerinde konumlandırılır ve yarıçapı kayıtlı katılımcı
    sayısına bağlıdır: müezzinin çağrısı çağrı yapanın çağrısı olur, sonra vaaz, sonra
    Elçi ve konuşmacının sözleri, sonra yazarın sayfası, sonra basılı versiyon, sonra
    yayın, sonra devrim.'
  holders: '{n} kayıtlı'
  quran_title: Kur'an'da
  quran_note: Bu aralık için girintili metindeki sabitleyiciler düzeltildi — donmuş
    metin referansları olarak gösteriliyor ve yeniden yazılmıyor.
  anchors:
    poets: Şairler ve ardından yanlış yönlendirilmiş olanlar — ilk dize, çoğunluğa
      sahip olanlar hakkındadır ve istisnası, inanan ve temkinli olanlar içindir.
    news: Güvenlik veya korku bir şey alırlarsa, bunu yayınlarlar—haberin yayınlanmadan
      önce nasıl yayıldığına dair aynı Kur'an ilkesi.
    adhan: Ezan çağrısını bir şaka ya da oyun olarak görmeyin — müezzinin çağrısını
      kutsallıkla bağlayan ayet.
    jumua: 'Cuma günkü çağrı: Satışı bırak ve hatırlamaya genişlet — hatibin saatini
      belirleyen çağrı.'
    herald: Gerçekten de, sizi bir tanık, iyi haberleri getiren ve uyaran olarak gönderdik
      — ondan sonra her çağıran ve konuşmacının takip edeceği peygamberlik görevi.
    proclamation: Allah ve O'nun Elçisi'nin büyük hac gününde halka ezar edilmesi
      — kamuya duyurma modeli.
    caller: 'Çağıran ve dinleyici: Mesajı toplanma boyunca taşıyan bir sesin Kur''an
      sahnesi.'
  chain_title: Sözün yaratıcıları — onu taşıyanlar
  chain_note: Aşağıdaki her katta müzede bir meslek kaydı bulunur ve her kişinin kartında,
    tablonun tanımladığı tarihe göre düzenlenmiş bir meslek kaydı bulunur.
  mentioned_in: '{n} metinde bahsedilmiştir'
  no_holders: Bu yapıda bu rol için henüz kayıt yok.
  state_title: Devlet konuştuğunda
  state_note: 'Medya dizisinin üstlendiği pozisyonlar: konuşmacı, anons ve haberci
    tarafından sözlerini taşıyan halifeler, sultanlar ve krallar; devletin tebaasına
    hitap ettiği bakanlar, yargıçlar, valiler ve posta taşıyıcıları. Bunlar kurumun
    sesleridir; yukarıdaki seri ve arabulucuları.'
  feed_title: Kaynaklardaki her bahs
  feed_note: Çizimdeki her metin, kaynağına göre sınıflandırılmış bir kelime oluşturucuya
    veya medya mesleğine zaten bağlanır—ve bu akış, yeni hasat edilen bir kitabın
    metinleri çizimde göründüğünde veya i3lam-tarayıcı etiket kaydı taşıdığında otomatik
    olarak artar.
  feed_more: Ve bu kaynakta {n} başkası da var.
  feed_empty: Bu yapıya dair henüz metin yok — toplanan kitaplar bırakıldığında burada
    yer alacaklar.
  corpora:
    quran:
      title: Kur'an
      note: Dondurucu indirme metni yalnızca metin referansıyla raporlanır.
    sunnah:
      title: Sünnet
      note: Hadis koleksiyonlarından haberler.
    seerah:
      title: Biyografi
      note: Biyografi ve kampanya kitaplarından haberler.
    books:
      title: Diğer kitaplar
      note: Koleksiyonda toplanan diğer tüm kitaplar.
  tagged_title: Bu tarayıcı için etiketlenmiş günlükler
  tagged_note: i3lam-browser ile işaretlenen her kayıt buraya otomatik olarak eklenir
    — böylece daha sonra ne hasat edilir.
heroes:
  title: İslam'ın Kahramanları
  lede: 'Erkekler ve kadınlar başkaları için çok şey fedakarlık etmişlerdir: altı
    erdem salonu, her salonda dört kahraman vardır ve hikaye kaynağıyla tamamlanmıştır.'
  status: 'Bu salonlardaki kahraman sayısı: {n} {trails} boyunca dağılmış. Her isim
    kahramanın kaydını açar ve her salon tam hikayesini açar.'
  trail_link: Tüm Salon Hikayesinin Sırrı ({n} Kahraman)
  record_link: Kaydı aç
  note_title: Bu salonlar hakkında
  note_body: 'Buradaki kahramanların duruşları belgelenmiş, mükemmel semboller değil:
    her hikaye kaynağıyla birlikte kaydedilmiş ve anlatıların farklı olduğu araştırmacıların
    notlarında belirtilmiştir. Müzede yeni bir hikaye tamamlandıkça salon büyür.'
  virtues:
    sacrifice:
      name: Kurban Salonu
      lede: 'Hiç görmedikleri bir halk için hayatlarını ve rahatlıklarını verdiler:
        ilk kadın şehit, bayrak taşıyıcı, Uhud''un kalkanı ve lider hatta mızraklar.'
    courage:
      name: Cesaret Salonu
      lede: 'Ayak ve kalp ilerlediğinde istikrar hesaplanır: yatağın şövalyesi, tarlaların
        kılıcı, Hattin şövalyesi ve çölün yaşlısı.'
    mercy:
      name: Merhamet Salonu
      lede: 'Buradaki merhamet bir güç biçimidir: kalplerin vaizi, esirlerin annesi,
        adalet evinin yöneticisi ve komşuların korumasının sürgünüdür.'
    generosity:
      name: Vineyard Salonu
      lede: 'Kamu yararına dönüşen tam bir servet: Abdul Rahman''ın kervanları, Osman
        kuyusu, Hadica''nın serveti ve Fatima''nın vakfı.'
    knowledge:
      name: Fen Salonu
      lede: 'Bilgiyi bir güven olarak taşıdılar ve hayatlarını ondan korudular: ilkelerin
        kurucusu, zorlukların sabrı, Basra''nın bilgisi ve gerçeğin dili.'
    steadfastness:
      name: Al-Thabat Salonu
      lede: 'Dünya sallandı ve onlar hareket etmedi: kimse kayanın altında, gerçeğe
        giden en uzun yol, ulusun sarsıldığı gün ve hiçbir şeyden korkmayan söz.'
ritha:
  title: Ağıt ve ölüm ilanında söylenen en ünlü şeylerin tarayıcısı
  lede: 'Müzenin kaynaklarında söylenen her şey ağıtlar ve ölüm ilanları: sabır ve
    anı ayetleri, Peygamber''in oğlu, torunu ve yaralı sahabelerinin ölümü üzerine
    söylediği sözler, Negus, Ja''far, Zayd ve İbn Rawaha için ölüm ilanı, sahabelerin
    birbirlerine taziyeleri, Hasan, Ka''b ibn Malik, El-Hansa ve Labid''in ağıtları,
    Sahabelerin ve Takipçilerin sevdiklerinin ölümüyle ilgili haberleri, hasat edilen
    kitaplardan sözler ve daha sonra toplananlar otomatik olarak eklenir.'
  badge: Ağıt ve Ölüm İlanı Explorer
  status: Bu sürüm, {s} bölümünde {n} kayıt içerir; metinler insan okunabilirliği
    için taslaklardır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, kaynakları ve metinleri beş dilde bulunan sıradan
    bir müze kaydıdır. Bölümler, inşa sırasında metinler dikkatlice tespit edilerek
    keşfedilir: ağıt ve ağıt sözleri, ölüm ilanı ve ağıt sözleri, taziye sözleri,
    ''Gerçekten Allah''a ait olan her şey ona aittir, O''nun verdiği O''nundur'',
    ''İlk şokta sabır'', yas ve ağlama sözleri, tabii ki ölüm anı gerçekleşirse. Kur''an
    ayetleri ise sözlükten değil, bir referans tablosundan alınmıştır. ''Sıfat'' tanımı,
    türemede ''atfetme''yi, mirasta ''miras''ı ve korku ağlamayı hariç tutar, tanımlayıcılarıyla
    gözden geçirilen yerleri hariç tutar. Daha sonra toplanan her kitabın bölümleri
    otomatik olarak girilir; seçilen kayıtlar ritha-browser etiketiyle birleştirilir.
    Her bölüm şu şekilde sınıflandırılır: ağıt, ölüm ilanı, taziye, ağlama ve ağıt.'
  api: 'Tam koleksiyon şu adreste mevcuttur:'
  sections_title: Tarayıcı Bölümleri
  kinds_title: Tür
  all_kinds: Tüm türler
  formulas_title: Ünlü atasözleri ve formüller
  formulas_note: 'Ulusun ölümünde bildiği sabit formlar: her kart taşıdığı en kısa
    bölümü açar ve kaynaklarda bulunan eşya sayısı.'
  formula_count: '{n} kaynaklarda'
  filter_label: Kayıtları filtrele
  filter_none: Sonuç yok.
  empty: Bu sürümde henüz kayıt yok.
  kinds:
    ritha:
      title: Ağıt
      ar: Ağıt
      desc: Ölenleri övmek ve erdemlerini şiir ve düzyazıda saymak, ayrıca Yoldaşlar
        ve şairlerin ağıtlarını anlatmak.
    nay:
      title: Ölüm ilanı
      ar: Ölüm ilanı
      desc: Ölümü hakkında insanlara haber vermek, örneğin Peygamber'in Ja'far, Zayd,
        İbn Rawaha ve Negus'a lakabı gibi.
    taziya:
      title: Başsağlığı dilekleri
      ar: Başsağlığı dilekleri
      desc: Acı çekenleri teselli etmek ve sabretmek, teselli bulmak ve "Gerçekten
        aldığı Allah'a, verdiği ona aittir" demek, ve vefat edenin ailesinin yiyeceği
        de vardır.
    bukaa:
      title: Ağlama ve ağlama
      ar: Ağlama ve ağlama
      desc: Gözlerdeki yaşlar ve kalbin acısı kabul edilebilir, ağlama, yanaklara
        şaplak, cepleri yırtma.
  sections:
    quran:
      title: Kur'an'da
      desc: 'Kur''an''da bahsedilen sabır, iyileşme ve her ölüm ayetleri: müminlerin
        sınavı, Yakup''un kederi, ölümü tatan her ruh, şehitlerin tasviri ve huzurlu
        ruh.'
    sunnah:
      title: Yıllık
      desc: 'İki sahih, Al-Muwatta ve Sunan''da ne vardır: El-Neceşi ve Cafer''in
        yas tutması, Peygamber''in kızının başbaşsağlığı dileği, Peygamber''in oğlu
        için ağlaması, ağıtın yasağı ve cenaze için halkın övgüsüdür—her hadisin sayısı
        ve kaynağı ile.'
    seerah:
      title: Biyografide
      desc: 'Biyografi kitaplarında neler var: Peygamber''in ölümü ve sahabelerin
        ağlaması, Hasan''ın Peygamber için ağıtları, Hamza, Mu''tah''ın şehitleri
        ve Ma''una kuyusu, Zeyd, Ca''fer ve İbn Rawaha''nın ölüm ilanları; yeni bir
        biyografi metni toplandığında yemin doldurulur.'
    books:
      title: Diğer kitaplarda
      desc: 'Sahabeler, takipçiler, tarihçiler ve edebiyatçılar hakkında haberler:
        Ömer ve Muaviye''den Başsağlıkları, Şairlerin Ağıtları, Ebu Bekir ve Ömer''in
        Ağlaması, Ümmet Tarihinde Halifeler ve Alimlerin Yası, Onların geçiş zamanından
        derlenmiştir.'
    curated:
      title: Seçilmiş Rekorlar
      desc: 'Müzenin kayıtları arasında ağıt, ölüm ilanı, taziyeler ve yas ile ilgili
        olaylar ve şiirler yer alır: Hasan''ın Peygamber için ağıtı, Mutah şehitlerinin
        ağıtları, Peygamber''in Ja''far için acısı ve İbrahim''in ölümü.'
  formulas:
    istirja:
      title: Felaket durumunda kurtarma
      note: Acı çekenlerin söylediği kelime, ardından um Salama'nın duası.
    lillah_ma_akhadh:
      title: '"Gerçekten Allah''ın aldığı şeydir, verdiği ona aittir."'
      note: Peygamber'in oğlu ölürken kızına gönderdiği şey.
    sadma_ula:
      title: '"İlk Şokta Sabır"'
      note: Peygamber'in mezarda ağlayan bir kadına söyledikleri.
    ajirni:
      title: '"Ey Allah, beni belalarımda ödüllendir."'
      note: Müslüman, Malik ve El-Tirmidhi tarafından anlatılan acı çekenlerin duası.
    ayn_tadma:
      title: '"Göz ağlar, kalp yas tutar"'
      note: Peygamber'in oğlu İbrahim'in ölümüyle ilgili sözleri.
    ya_abatah:
      title: '"Vay canına, baba"'
      note: Fatimah'ın Peygamber'in vefat ettiği günkü açıklaması.
    man_kana_yabudu:
      title: '"Canlı ve ölü olarak iyileşti"'
      note: Ebu Bekir'in ölüm gününde Peygamber'e yaptığı açıklama ve sonrasında verdiği
        vaaz.
    al_jafar:
      title: '"Jaafar''ın ailesi için yemek yapın"'
      note: Ölen kişinin ailesini besleme sünnetidir.
    nay_najashi:
      title: Negus'un Ölüm İlanı
      note: Peygamber, onun öldüğü gün yas tuttu ve onun için uzaktan namazını etti.
    adhkuru_mahasin:
      title: '"Ölülerinin erdemlerini hatırla"'
      note: İzin verilen ağıtların ve insanların cenazelere övgüsünün kökeni.
  viz:
    title: Dört Bayrak
    note: 'Dört siyah kenarlı pankart, her kayıt türünde bir afiş bulunur: ağıt, ölüm
      ilanı, taziye, ağlama ve ağıt; her biri kayıtlarının numaralarını, kaynaklardaki
      konumlarını gösteren bir bant ve açılış için üç kayıt içerir. Toplam: {n} kayıt,
      hepsi aşağıdaki listelerde. Dedektörden alınan kayıt türleri ve seçilen kayıtlar
      müzenin yetki alanına ait değildir.'
    region: Tür ve bölümlere göre ölüm ilanları ve ölüm ilanı kayıtlarının dağılımı
    col_kind: Tür
juha:
  title: Juha Tarayıcısı ve İslami Folklor
  full_title: Juha Browser ve Çağlar Boyunca İslami Folklor, Komedi, Şakalar, Şakalar
    ve Nadirlikler
  lede: 'Müzede Juha ve İslami folklor hakkında yüzyıllar boyunca sunduğu her şey,
    komedi, şakalar, anekdotlar ve anekdotlar: kahkaha, gülümseme, Kur''an''da alay
    yasakları ve Peygamber ve kahkahaları hakkında şakalar, Sünnet''te şakanın sınırları,
    biyografi ve biyografilerdeki Sahabeler ve Takipçilerin şakaları, Juha''nın anekdotları
    teker teker ve edebiyat ile tarih kitaplarındaki esprili, aptal, cimri ve felç
    olmuş hikayeler.'
  badge: Nadirlikler Konseyi
  status: Bu yapıda, {n} {s} bölümlerinde kaydedilir; metinler, okuyucunun bahsedilen
    kaynaklardan doğruladığı taslaklardır.
  method_title: Tarayıcı Müfredatı
  method_note: 'Buradaki her kayıt, beş dilde kaynakları ve metinleriyle birlikte
    müze kayıtlarının sıradan bir kaydıdır. Bölümler, yapım sırasında pasaj metinlerini
    okuyan hassas bir dedektörle yakalanmıştır: Juha ismi bağımsız bir kelimedir,
    Ash''ab, Nu''ayman, Muzbad ve Habanqa gibi ünlü esprili figürlerin isimleri, anekdotlar,
    anekdotlar, mizah, şakalar, şakalar ve mizahi kelimeler, kahkaha ve gülümseme
    kelimeleri ile şaka edebiyatı metinleri. Fıkhih nadirlikleri, ''Anekdotlar ve
    Eklemeler'' kitabı , göz açıp kapayıncaya kadar, Al-Dahhak''ın adı, İbn Mughaffal
    ve zaman ile mekan koşulları hariç tutulur. Daha sonra toplanan her kitap, ağa
    ulaştığında otomatik olarak burada kendi bölümlerine girer ve kaydedilen kayıtlar
    juha-browser adı altında birleştirilir. Juha''nın anekdotları, müzenin makine
    tarafından okunabilir versiyonla ilgili ifadesiyle anlatılır ve çeviriler otomatiktir,
    insanlar tarafından incelenmez.'
  api: 'Tam koleksiyon şu adreste mevcuttur:'
