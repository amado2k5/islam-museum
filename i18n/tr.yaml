    join: Müzenin hedeflerini paylaşan ve küratörü olmak ya da başka şekillerde yardımcı
      olmak isteyen kişileri arıyoruz. İlgileniyorsanız veya ilginiz varsa, sizden
      haber almaktan memnuniyet duyarız.
  honor:
    title: Onur Tabağı
    lede: Müzeye zamanını, bilgisini ve uzmanlığını katkıda bulunan herkese teşekkür
      ederiz.
    what: Bu sayfa, müzeyi çalışmalarıyla inşa eden akademisyenleri, araştırmacıları,
      çevirmenleri, hakemleri, gönüllüleri ve katkıda bulunanları onurlandıracaktır.
    who: Burada isimleri ve yaptıkları katkı türü listelenecektir.
    join: Araştırma, çeviri, inceleme, tasarım, programlama veya müzenin tanıtımı
      konularında katkıda bulunmaya istekli birini arıyoruz. İlgileniyorsanız veya
      ilgileniyorsanız, sizden haber almaktan memnuniyet duyarız.
  donors:
    title: Bağışçılar
    lede: Müzenin herkes için açık ve ücretsiz kalmasını sağlayan bireylere ve kurumlara
      teşekkür ederiz.
    what: Bu sayfa, müzenin bağışçılarına, bireylere ve kurumlarına isim ve izinle
      teşekkür edecektir.
    who: Burada, isim vermeyi kabul eden bağışçılar listelenecek ve herkes adını vermeden
      bağış yapabilir.
    join: Müzeyi desteklemek, burada adınızın anılması veya daha büyük bir bağış hakkında
      konuşmak isterseniz, sizden haber almaktan memnuniyet duyarız.
    support_link: Müze'yi Destekleme Yolları
  press:
    title: Medya
    lede: Müze, medyada, basın bültenlerinde ve gazeteciler için iletişim noktasında.
    coverage_title: Medya kapsamı
    coverage: 'Bu sayfa, müzenin medya kapsamını toplayacak: haberler, videolar, makaleler,
      kitaplar ve müzeden bahseden veya atıf yapan çalışmalar.'
    coverage_first: 'Kanada kanalı OMNI TV, Arapça "Omni" bülteni için (30 Ekim 2026)
      müzeyi haberleştirdi ve kurucusu Ahmed Abdel Aal ile röportaj yaptı. Resmi OMNI
      kanalında YouTube''da haberi izleyin:'
    releases_title: Basın Bültenleri
    releases: Müzenin basın bültenleri burada yayımlanacaktır.
    tip: Bir haberde, video klipte veya makalede müzeden bahsedilirse, lütfen bize
