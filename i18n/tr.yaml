    rüyalar, Zekerya''nın müjdesi, Sandık, yaratılıştaki evrenin işaretleri, inkârcıların
    uluslarının yok oluşu ve bunlardan bahseden her kitap — yeni metinler ortaya çıktıkça
    büyüyen belgelenmiş kayıtlar.'
