  trustees:
    title: أمناء المتحف
    lede: "الذين سيحملون أمانة رسالة المتحف واستقلاله ومعاييره."
    what: "ستعرض هذه الصفحة أمناء المتحف: من يحفظون رسالته وانفتاحه ومعاييره العلمية، ويعينون على توجيه نموّه."
    who: "ستُنشر هنا أسماء الأمناء، مع تعريف قصير بكل واحد منهم، عند تشكيل مجلس الأمناء."
    join: "نبحث عمّن يشاركون المتحف غاياته ويرغبون في أن يكونوا من أمنائه، أو في العون بطرق أخرى. إن كنت مهتمًا أو راغبًا فيسعدنا أن نسمع منك."
  honor:
    title: لوحة الشرف
    lede: "شكرنا لمن يبذلون للمتحف من وقتهم وعلمهم وخبرتهم."
    what: "ستكرّم هذه الصفحة العلماء والباحثين والمترجمين والمراجعين والمتطوعين والمساهمين الذين يبنون المتحف بعملهم."
    who: "ستُدرج هنا أسماؤهم، مع نوع المساهمة التي قدّمها كل واحد منهم."
    join: "نبحث عمّن يودّ المساهمة: في البحث أو الترجمة أو المراجعة أو التصميم أو البرمجة أو التعريف بالمتحف. إن كنت مهتمًا أو راغبًا فيسعدنا أن نسمع منك."
  donors:
