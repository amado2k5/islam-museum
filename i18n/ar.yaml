learn:
  title: جولة وتعلّم
  badge: قيد الإنشاء
  lede: المتحف كبير، وقد لا تعرف من أين تبدأ. «جولة وتعلّم» مساراتٌ قصيرة مرتّبة، لكل مسارٍ هدفٌ واضح، تأخذك خطوةً خطوة عبر صفحات المتحف نفسها، أو تريك الطريق كله دفعةً واحدة.
  status: هذا القسم قيد الإنشاء. فتحنا خمسة مسارات تجريبية لتعرف الفكرة، ونُعدّ قائمةً بأهم ٣٠٠ مسارٍ يمكن لأي أحدٍ أن يتعلّمها، ونفتح منها كل مرة ما اكتملت مواده. وتبقى بقية أقسام المتحف كما هي.
  available_title: مسارات يمكنك تجربتها الآن
  available_note: خمسة مسارات تجريبية مبنية على صفحات المتحف الحالية. شكلها الأخير، بعرض خطوةً خطوة وعرض المسار كله، يأتي في مرحلة لاحقة من الخطة.
  minutes: دقيقة
  steps: خطوة
  kind_tour: جولة
  kind_lesson: درس
  kind_trail: مسار
  offer_title: ما الذي ستجده هنا
  offer:
  - اختر ما تريد أن تفهمه: عصرًا من التاريخ، أو مجموعة من الشخصيات، أو سلسلة أحداث، أو فكرة، أو مكانًا، أو نصًّا، أو سؤالًا عسيرًا.
  - سِر خطوةً خطوة، أو انظر المسار كله دفعةً واحدة: قائمةً وخطًّا زمنيًّا وخريطة.
  - لكل مسارٍ هدفٌ معلن: ما الذي ستعرفه وتستطيع أن تضعه في موضعه عند نهايته.
  - زمنٌ صادق لكل مسار: عشر دقائق، أو نصف ساعة، أو ساعتان، أو أسبوعٌ من الأمسيات.
  - يُحفظ تقدّمك في متصفحك وحده، بلا حساب، وبلا ذكاء اصطناعي يجيبك: المسارات مكتوبةٌ ومراجَعة.
  - كل خطوةٍ صفحةٌ موثّقة في المتحف، وفي كل مسارٍ مواضع «تعمّق» و«الرأي الآخر» لا تقطع الطريق.
  kinds_title: ثلاثمئة مسار قيد الإعداد
  kinds_note: يقترح الذكاء الاصطناعي في مرحلة التخطيط قائمة المسارات، ثم يراجعها الناس ويرتّبونها، ولا يعمل شيءٌ من ذلك أثناء زيارتك.
