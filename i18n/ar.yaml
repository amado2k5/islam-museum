authenticity:
  title: كيف نقرر ما نعرضه
  lede: لا يقبل المتحف إلا المواد الأصيلة المطابقة لعنوانها ومؤلفها ومصدرها وهويتها المعلنة. تشرح هذه الصفحة كيف يتم ذلك، وما الذي لا تفعله البوابة.
  updated: القواعد مؤرخة في 25 أكتوبر 2026، وهي منشورة بوصفها سياسة المتحف للتحقق من الأصالة.
  admit_title: ما نقبله
  admit_body: 'يُقبل الكتاب أو المقال أو الصورة أو القطعة كاملةً، أو يُوسَم، أو يُرفض. تسأل البوابة: هل هذا العمل هو ما يدل عليه عنوانه ومؤلفه؟ وهل تأتي النسخة من
    الطبعة أو المؤسسة التي تذكرها؟'
  check_title: ما الذي تتحقق منه البوابة
  check_body: من كتب العمل، وهل مذهب المؤلف موثّق من مصادر مسمّاة. وهل النسخة طبعة حقيقية محددة أو نسخة مفهرسة لدى مؤسسة. ومن أين جاءت، وهل يظهر ذلك الموقع في قائمة
    معروفة للاحتيال أو الانتحال.
  not_title: ما الذي لا تتحقق منه البوابة
  not_body: لا تتحقق البوابة مما إذا كانت كل عبارة في العمل صحيحة، ولا تغيّر ما يقوله العمل. والملخصات مكتوبة بالذكاء الاصطناعي ومعلَّمة بذلك، ولا تُراجع سطرًا سطرًا.
  decisions_title: ثلاثة قرارات
  decisions_body: 'قبول: مؤلف سنّي موثّق ونسخة مُتحقَّق منها. وسم: نسخة أصيلة تُعرض مع مذهب مؤلفها، أو مع عبارة «المذهب غير موثّق». رفض: نسخة لا يمكن التحقق منها،
    أو تأتي من مصدر محظور.'
  sources_title: المصادر التي نعتمد عليها
  sources_body: تُدرج كل مصدر في السجل العام مع فئته وحالته. ويكتفي ويكيبيديا وويكي البيانات بالإشارة، ولا يُثبتان أصالة شيء.
  corrections_title: التصويبات
  corrections_body: أبلغ عن أي خطأ عبر نموذج المسائل. تُسجَّل كل بلاغ ونتيجته.
  records_title: ما نحفظه لكل كتاب
  records_body: 'لكل كتاب محصود نحفظ سجلًا: عنوانه ومؤلفه وتاريخ المؤلف، والعصر الذي ينتمي إليه، والقرار ومن اتخذه، والفحوص التي أُجريت ونتائجها، وبصمة رقمية (SHA-256)
    لكل ملف محصود، حتى يمكن لاحقًا إثبات أن أي نسخة لم تتغير. ولا يحتوي السجل على نص الكتاب. والسجلات منشورة في المستودع.'
  rules_title: أين توجد القواعد
  rules_body: 'القواعد منشورة في المستودع العام: السياسة والسجل والمدقق وبوابة الحصاد. ويمكن لأي أحد قراءتها والتحقق منها.'
privacy:
  title: الخصوصية والبيانات
  lede: لا حسابات، ولا ملفات تعريف ارتباط، ولا تتبّع، ولا إعلانات. هذه الصفحة تشرح ما يحدث حين تزور المتحف، وما الذي لا يحدث.
  updated: 'آخر تحديث: 17 أكتوبر 2026'
  summary_title: الخلاصة
  summary_1: المتحف ملفات ثابتة تُقرأ كما تُقرأ صفحة كتاب. لا خادم يعمل عند زيارتك، ولا قاعدة بيانات، ولا نموذج ذكاء اصطناعي، ولا شيفرة تُنفَّذ باسمك عند جهة أخرى.
  summary_2: لا نطلب منك حسابًا ولا بريدًا ولا اسمًا. لا نضع ملفات تعريف ارتباط (cookies)، ولا نحمّل شيفرة تتبّع من أي طرف ثالث، ولا نعرض إعلانات، ولا نبيع شيئًا
    ولا نشارك شيئًا، لأنه لا شيء لدينا عنك.
  collect_title: ما الذي لا نجمعه
  collect_body: 'لا يعالج المتحف أي بيانات شخصية عن زوّاره: لا أسماء، ولا عناوين بريد، ولا عناوين IP محفوظة، ولا سجلّات تصفّح، ولا معرّفات أجهزة، ولا ملفات تعريف
    شخصية. لا توجد نماذج تُرسل بياناتك إلينا، والبحث يعمل داخل متصفّحك على فهرس ثابت، والخطوط والخرائط والصور تُحمَّل من الموقع نفسه لا من خدمات خارجية.'
  device_title: ما يُحفظ على جهازك أنت
  device_body: 'بعض الخيارات تُحفظ في ذاكرة متصفّحك وحده (localStorage وsessionStorage) ولا تُرسل إلى أي مكان: المظهر الفاتح أو الداكن، نوع الخط، عمق العرض، موضعك
    في التجوّل العشوائي، وفي جناح الصغار الأسماء التي يبتكرها الطفل في الألعاب والنجوم والنتائج التي يجمعها. يمكنك مسحها في أي وقت من إعدادات متصفّحك، ويعمل الموقع
    كاملًا بدونها.'
  traffic_title: عدّ الزيارات
  traffic_body: 'يُحصى عدد الزيارات في إحصاءات الشبكة لدى Cloudflare، الشبكة التي توصّل الصفحات. تعمل هذه الإحصاءات عند حافة الشبكة، من دون ملفات تعريف ارتباط ولا
    شيفرة في الصفحة، وتعطي المتحف أرقامًا إجمالية فقط: عدد الطلبات، والبلدان، والصفحات الأكثر زيارة. لا يصل إلينا ما يعرّف شخصًا بعينه.'
  hosts_title: من يوصّل الملفات
  hosts_body: تُوصَّل الصفحات عبر شبكة Cloudflare، وتُقدَّم الصفحات والصور والخرائط وفهرس البحث وملفات البيانات المفتوحة من مخزن المتحف الخاص. أما صور القطع من المتاحف الشريكة (متحف فيكتوريا
    وألبرت، ومتحف المتروبوليتان للفنون، ومتحف كليفلاند للفنون، وويكيميديا كومنز) فتُحمَّل من خوادم تلك المؤسسات نفسها. ككل خدمة على الإنترنت، يحتاج هؤلاء المزوّدون
    إلى عنوان IP جهازك لتوصيل الملف إليك، ويعالجونه وفق سياساتهم. المتحف لا يحصل على هذه البيانات ولا يحتفظ بها.
  contact_title: حين تتواصل معنا
  contact_body: إذا راسلتنا بالبريد أو فتحت بلاغًا أو نقاشًا على GitHub، فإننا نرى ما تختار أنت إرساله، ونستعمله للرد وتصحيح المحتوى فقط. ما تكتبه على GitHub يخضع
    لشروط GitHub وسياسة خصوصيته، وهو عامّ ما لم تختر غير ذلك.
  people_title: الأشخاص الذين يذكرهم المتحف
  people_body: يصف المتحف أشخاصًا من التاريخ ومن الحاضر بوقائع عامة منشورة ومسندة إلى مصادرها. عن الأحياء لا يُذكر إلا ما نُشر من وقائع عامة موثّقة، ولا تُستنتج ديانة
    أحد ولا تُنسب إليه دون أساس معلن. إن وجدت خطأ، أو ما يمسّك شخصيًا، فأبلغنا عبر نموذج التصحيح أو بالبريد؛ تصحيحات الأحياء لها الأولوية.
  kids_title: الصغار
  kids_body: 'تنطبق القواعد نفسها على جناح الصغار: لا حسابات، ولا جمع بيانات، ولا تواصل مع أطراف أخرى، ولا تعليقات ولا محادثة. ما يبتكره الطفل من أسماء في الألعاب
    أو يجمعه من نجوم يبقى على الجهاز نفسه.'
  links_title: روابط إلى مواقع أخرى
  links_body: يحيل المتحف إلى مصادر ومراجع خارجية. حين تنتقل إليها تنطبق سياسات تلك المواقع لا سياستنا.
  law_title: القانون المطبّق
  law_body: يُدار المتحف من مقاطعة أونتاريو في كندا، ويخضع للقانون الكندي الفدرالي وقانون أونتاريو، ومنه قانون حماية المعلومات الشخصية والوثائق الإلكترونية (PIPEDA).
    ولأن المتحف لا يجمع معلومات شخصية، فليس لديه ما يُفصح عنه أو يصحّحه أو يحذفه عنك؛ ومع ذلك نجيب عن أي سؤال في هذا الشأن على بريدنا.
  changes_title: تغيّر هذه الصفحة
  changes_body: إذا تغيّر شيء في طريقة عمل الموقع، تُحدَّث هذه الصفحة أولًا، ويُسجَّل التغيير في تاريخ المستودع العام على GitHub حيث يمكن لأي أحد أن يراجع ما تغيّر
    ومتى.
  more_title: للمزيد
  more_body: التفاصيل التقنية في وثيقة العمارة والقرار المعماري 0002 (لا ذكاء اصطناعي ولا حوسبة عند التشغيل)، وكلاهما في المستودع العام.
  arch_link: وثيقة العمارة
  adr_link: القرار 0002
  contact_cta: راسلنا
  report_cta: أبلغ عن خطأ
accessibility:
  title: 'إمكانية الوصول'
  lede: 'المتحف للجميع. يبيّن هذا البيان كيف بُني الموقع ليستعمله المكفوفون وضعاف البصر، والصمّ وضعاف السمع، ومن لا يتكلّمون، ومن يستعملون لوحة المفاتيح أو أي تقنية مساعِدة، وكيف تخبرنا حين لا يعمل شيء كما ينبغي.'
  updated: 'آخر تحديث: 25 أكتوبر 2026'
  commit_title: 'التزامنا'
  commit_body: 'الوصول إلى الثقافة حقٌّ لكل إنسان، ومنهم الأشخاص ذوو الإعاقة (اتفاقية الأمم المتحدة لحقوق الأشخاص ذوي الإعاقة، المادتان 9 و30). متحف الإسلام مجاني، بلا حسابات ولا اشتراكات، وقد بُني لتُقرأ صفحاته نفسها بالعين، وبالأذن عبر قارئ الشاشة، وباللمس على سطر برايل الإلكتروني، بالعربية والإنجليزية والأردية. نرحّب بكل زائر، أيًّا كانت قدرته أو لغته أو خلفيته.'
  status_title: 'حالة المطابقة'
  status_1: 'هدف المتحف هو إرشادات الوصول إلى محتوى الويب (WCAG) 2.2 في المستوى AA، الصادرة عن اتحاد الشبكة العالمية (W3C) والمعتمدة معيارًا دوليًا باسم ISO/IEC 40500. الموقع مطابق جزئيًا: معظم الصفحات تبلغ الهدف، والثغرات المعروفة مذكورة أدناه مع العمل الجاري لسدّها.'
  status_2: 'هذا التقييم تقييمنا الذاتي، بفحوص آلية عند كل تغيير وباختبار يدوي. والتدقيق المستقل مخطَّط له، وسيُنشر تقريره في هذه الصفحة.'
  standards_title: 'المعايير والقوانين التي نتّبعها'
  standards_1: 'دوليًا: إرشادات WCAG 2.2 في المستوى AA ومواصفة WAI-ARIA 1.2 من W3C؛ واتفاقية الأمم المتحدة لحقوق الأشخاص ذوي الإعاقة؛ ومعاهدة مراكش لتيسير النفاذ إلى المصنفات المنشورة لفائدة المكفوفين وذوي الإعاقة في قراءة المطبوعات؛ وتوصية اليونسكو لعام 2015 بشأن المتاحف والمجموعات، وتعريف المجلس الدولي للمتاحف (ICOM) للمتحف، وكلاهما يدعو إلى متاحف ميسَّرة الوصول وشاملة للجميع.'
  standards_2: 'في كندا، حيث يُدار المتحف: قانون كندا الميسَّرة (Accessible Canada Act) والمعيار CAN/ASC-EN 301 549، وقانون إمكانية الوصول لسكان أونتاريو ذوي الإعاقة (AODA) ومعاييره المتكاملة.'
  standards_3: 'في الولايات المتحدة: قانون الأمريكيين ذوي الإعاقة (ADA) والمادة 508 من قانون إعادة التأهيل.'
  standards_4: 'في الاتحاد الأوروبي والمملكة المتحدة: القانون الأوروبي لإمكانية الوصول (التوجيه 2019/882)، وتوجيه إمكانية الوصول إلى المواقع الإلكترونية (2016/2102)، والمعيار المنسَّق EN 301 549؛ وقانون المساواة البريطاني لعام 2010. ويتّبع هذا البيان النموذجَ الذي وضعته المفوضية الأوروبية لبيانات إمكانية الوصول.'
  blind_title: 'المكفوفون وضعاف البصر، وقارئات الشاشة، وطريقة برايل'
  blind_1: 'كل صفحة نصٌّ حقيقي في بنية واضحة: عنوان رئيسي واحد، وعناوين متدرّجة، ومَعالم للصفحة (الترويسة، والتنقّل، والمحتوى الرئيسي، والتذييل)، ورابط «تخطَّ إلى المحتوى» أولَ عنصر فيها، وقوائم وجداول مرمَّزة بوصفها كذلك. تستطيع قارئات الشاشة مثل NVDA وJAWS وVoiceOver وTalkBack وOrca قراءتها والتنقّل فيها.'
  blind_2: 'عن برايل: لا يرسم الموقع حروف برايل بنفسه، بل يرسل قارئ الشاشة نصّ الصفحة إلى سطر برايل الإلكتروني فيعرضه بحروف بارزة. وليعمل ذلك بثلاث لغات، تعلن كل صفحة لغتها واتجاهها، فينتقل قارئ الشاشة وسطر برايل إلى برايل العربية أو برايل الإنجليزية الموحّد (UEB) أو برايل الأردية.'
  blind_3: 'للصور نصٌّ بديل يصفها، وتُخفى الزخارف والأيقونات التزيينية عن قارئات الشاشة كي لا تقطع القراءة.'
  blind_4: 'كل صفحة تُقرأ وJavaScript معطَّل. الميزات التفاعلية تُضاف فوق النص ولا تحجبه أبدًا.'
  vision_title: 'ضعف البصر والألوان وراحة القراءة'
  vision_1: 'يبلغ تباين النصوص وعناصر التحكّم نسبَ WCAG (‏4.5:1 للنص، و3:1 للنص الكبير والحدود) في المظهرين الفاتح والداكن، ولا يكون اللون وحده وسيلةَ إيصال معلومة. وتتكيّف الصفحات مع شاشات الهواتف الصغيرة دون تمرير جانبي.'
  vision_2: 'يمكنك من الترويسة التبديل بين المظهر الفاتح والداكن وبين خطَّين للقراءة، وتتيح لك قائمة «إمكانية الوصول» تكبير النص وتوسيع تباعد الأسطر ورفع التباين وإيقاف الحركة وتسطير جميع الروابط، وتُحفَظ هذه الاختيارات على جهازك فقط. ويتّبع الموقع أيضاً إعداد جهازك للمظهر الفاتح أو الداكن، ووضعَ التباين العالي (الألوان القسرية)، وتقليلَ الحركة.'
  deaf_title: 'الصمّ وضعاف السمع'
  deaf_1: 'المتحف مكتوب لا مسموع: لا شيء في الموقع متاح بالصوت وحده. وحيث تقدّم قصة من قصص الصغار تسجيلًا مسموعًا، يُطبع نصّ القصة كاملًا في الصفحة نفسها فوق المشغّل، ولا يبدأ الصوت من تلقاء نفسه.'
  deaf_2: 'كل صوت أو فيديو يُضاف إلى المتحف يجب أن يرافقه نصٌّ مُتزامن (ترجمة مكتوبة) أو نصٌّ كامل مكتوب بالعربية والإنجليزية والأردية.'
  deaf_3: 'نخطّط لنسخ بلغة الإشارة من الترحيب ودليل المتحف وهذا البيان، يؤدّيها أشخاص صمّ يتقنون لغة الإشارة، بلغة الإشارة الأمريكية، ولغة الإشارة الكيبيكية (LSQ)، ولغة الإشارة البريطانية، والإشارة الدولية، ولغة الإشارة العربية، ولغة الإشارة الباكستانية، وتُضاف إلى هذه الصفحة حين تُنجز.'
  speech_title: 'الزوّار الذين لا يتكلّمون'
  speech_1: 'لا شيء في الموقع يحتاج إلى صوتك: لا إدخال صوتي، ولا ميكروفون، ولا خط هاتفي، ولا اختبار شفهي. وكل طرق التواصل معنا مكتوبة (البريد الإلكتروني أو نموذج على GitHub).'
  keyboard_title: 'لوحة المفاتيح والمفاتيح البديلة واللمس'
  keyboard_1: 'يمكن فعل كل شيء بلوحة المفاتيح وحدها: ‏Tab وShift+Tab للتنقّل بين الروابط والأزرار، وEnter والمسافة لتفعيلها، وEscape لإغلاق قائمة الهاتف والعودة إلى الزر الذي فتحها. ومؤشّر التركيز ظاهر دائمًا.'
  keyboard_2: 'الأزرار والروابط كبيرة بما يكفي للّمس. وقد صُمّمت ألعاب الصغار لتُلعب بلوحة المفاتيح، ولا حدود زمنية للقراءة.'
  limits_title: 'قيود معروفة'
  limits_1: 'هذا تقييم ذاتي: لم يخضع الموقع بعد لتدقيق مستقل في إمكانية الوصول. التدقيق وتقرير المطابقة (ACR/VPAT) مخطَّطان.'
  limits_2: 'الخريطة التفاعلية وشبكة المعرفة والقاعة ثلاثية الأبعاد بصرية بطبيعتها؛ ويجري استكمال بدائلها النصية واختبارها بقارئات الشاشة.'
  limits_3: 'بعض الإحالات تشير إلى محاضرات مسجّلة في مواقع أخرى لا يتحكّم فيها المتحف، وقد لا يكون لها نصٌّ مكتوب. ونخطّط لملفات جاهزة لبرايل (BRF) وكتب إلكترونية ميسَّرة (EPUB) من نصوص المتحف. ومستوى «قراءة ميسَّرة» لا يتوفّر إلا حيث توجد نسخة في جناح الصغار؛ ومعظم صفحات الكبار لا تملك واحدًا بعد.'
  tech_title: 'التقنيات التي يعتمد عليها الموقع'
  tech_1: 'HTML وCSS وWAI-ARIA، ويقرؤها أي متصفّح حديث، وJavaScript اختياري. لا يستعمل الموقع أي «طبقة» إتاحة ولا شريط أدوات من طرف ثالث: فهذه تضيف شيفرات من خارج الموقع ولا تجعله ميسَّرًا، ولذلك بُنيت إمكانية الوصول في الصفحات نفسها.'
  formats_title: 'صيغ أخرى'
  formats_body: 'كل النصوص مفتوحة (النصوص CC BY-SA 4.0، والبيانات CC0)، فيجوز تحويلها إلى برايل أو خط كبير أو صوت أو أي صيغة ميسَّرة أخرى ومشاركتها بحرية. وإن احتجت صفحةً بصيغة أخرى فراسلنا، وسنساعدك.'
  formats_books_link: 'حمِّل كتبًا جاهزة: ملفات برايل (BRF) وكتب إلكترونية ميسَّرة (EPUB 3) للمسارات وقصص الصغار وهذه الصفحة'
  feedback_title: 'أخبرنا عن عائق'
  feedback_1: 'إن لم يعمل شيء في الموقع كما تحتاج، أو احتجت معلومة بصيغة أخرى، فأخبرنا. اذكر الصفحة (عنوانها)، وما كنت تحاول فعله، وإن شئت المتصفّح والتقنية المساعِدة التي تستعملها.'
  feedback_2: 'نردّ خلال خمسة أيام عمل، ونعالج العوائق أولًا. يمكنك مراسلتنا بالبريد الإلكتروني أو فتح بلاغ علني على GitHub.'
  feedback_cta: 'راسلنا بشأن إمكانية الوصول'
  feedback_issue: 'أبلغ عن عائق في الوصول'
  law_title: 'إن لم تكن راضيًا'
  law_body: 'إن لم يحلّ ردّنا المشكلة، فيمكنك التواصل مع الجهة المختصة حيث تقيم: في كندا، مفوّض إمكانية الوصول (اللجنة الكندية لحقوق الإنسان)، أو في أونتاريو مديرية إمكانية الوصول؛ وفي الاتحاد الأوروبي، جهة الإنفاذ في دولتك العضو؛ وفي المملكة المتحدة، خدمة المشورة والدعم في شؤون المساواة (EASS)؛ وفي الولايات المتحدة، خط معلومات قانون ADA لدى وزارة العدل.'
  method_title: 'كيف أُعدّ هذا البيان'
  method_body: 'أُعدّ هذا البيان في 25 أكتوبر 2026 من تقييم ذاتي للموقع وفق WCAG 2.2 في المستوى AA، بفحوص آلية (يُشترط بلوغ 100 في مقياس Lighthouse لإمكانية الوصول في كل طلب دمج) ومراجعة يدوية. ويُراجَع مرة في السنة على الأقل، وكلما تغيّر الموقع تغيّرًا يمسّ الوصول.'
  more_title: 'للمزيد'
