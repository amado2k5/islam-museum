    lede: "شكرنا للأفراد والمؤسسات الذين يُبقي دعمُهم المتحفَ مفتوحًا ومجانيًا للجميع."
    what: "ستشكر هذه الصفحة المتبرعين للمتحف، أفرادًا ومؤسسات، بأسمائهم وبإذنهم."
    who: "سيُدرج هنا من يوافق من المتبرعين على ذكر اسمه، ولكل أحد أن يتبرع دون ذكر اسمه."
    join: "إن أردت أن تدعم المتحف، أو أن يُذكر اسمك هنا، أو أن نتحدث عن تبرع أكبر، فيسعدنا أن نسمع منك."
