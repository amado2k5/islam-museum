future:
  strip_title: "كيف سيعيش المسلمون في عام 2077؟"
  strip_lede: "الروبوتات تخدم في المسجد الحرام منذ اليوم. سر جيلًا واحدًا إلى الأمام — خيالٌ مثبَّت بأربعة عشر قرنًا من التكيّف."
  strip_cta: "ادخل إلى المستقبل"
  eyebrow: "١٤٤٨هـ ← ١٥٠٠هـ"
  title: "حياة المسلمين في عام 2077"
  lede: "ليس تنبؤًا — فالغيب لله وحده. هذه الصفحة تمرين المتحف على التخيّل: كل وسيط مرّ على المسلمين — الورق والمطبعة والإذاعة والشاشة — امتصّه الدين دون أن يتحرك جوهره. فماذا يحدث حين يبدأ الوسيط نفسه بالإجابة؟"
  note: "ما يلي خيالٌ مثبَّت بالأدلة — روبوتات حقيقية وفتاوى حقيقية وأبحاث حقيقية — وليس نبوءة. كل محطة تعيدك إلى داخل المتحف."
  stations: "محطات على الطريق إلى الأمام"
  anchors_label: "مثبَّتة في المتحف"
  tensions_title: "أسئلة مفتوحة"
  tensions_lede: "المتحف لا يعطي حكمًا. كل بطاقة نقاشٌ حيّ."
  voices_title: "أصوات تخيّلت قبلنا"
  voices_lede: "فكّر في هذا قبلنا علماء ومهندسون وفنانون. مما كتبوه:"
  epilogue_title: "دعوة دائمة"
  epilogue: "ستنمو هذه الصفحة. حين تدخل آلةٌ جديدة مسجدًا، وحين يكتب عالمٌ سيناريو جديدًا، وحين تتخيّل أنت ما لم نتخيّله — فالمستقبل، كالمتحف، قيد الإنشاء."
  sections:
    - k: "الجماعة"
      t: "الجماعة"
      d: "في عام 2077 قد تلتوي صفوف صلاة الجمعة حول عدسة لا حول عمود — مصلّون في واقعٍ مختلط يقفون كتفًا إلى كتف مع أناس في ثلاث قارات. روبوتات الإرشاد تجول في المسجد الحرام منذ اليوم تجيب عن الأسئلة بإحدى عشرة لغة؛ وحينئذ قد تحمل ماء زمزم، وتترجم الخطبة إلى كل أذن، وتعرف مَن الزائر الجديد ومَن الذي يأتي منذ أربعين عامًا. لكن الصف لم يكن يومًا عن المبنى: إنه هندسة المتساوين، والسؤال هو هل تستطيع صورةٌ خيالية أن تقف فيه."
      scene: mosque
      a:
        - id: "concept/luzum-al-jamaa"
          l: "لزوم الجماعة"
        - id: "concept/row-prayer-saff"
          l: "تسوية الصف"
    - k: "النص"
      t: "تعلّم القرآن"
      d: "رفيق حفظ لا يملّ: يسمع محاولتك الأربعين بصبر المحاولة الأولى، ويلتقط زلّة التجويد التي يفوتها معلّمٌ متعب، ويحفظ لكل ما يعلّمه سلسلته — أي قراءة، وعن أي قارئ، وعبر أي طريق من الرواة. بقي الحفظ مع الرقّ والمطبعة وشريط الكاسيت؛ لتصير الآلة حاملةً أخرى. وقاعدة المتحف نفسها تقول منذ اليوم إن النص ذاته لا يأتي من آلة أبدًا."
      scene: hifz
      a:
        - id: "concept/hifz-preservation"
          l: "الحفظ صونًا للنص"
    - k: "السلسلة"
      t: "تعلّم الحديث"
      d: "كان الإسناد أول رسم معرفي في العالم — سلسلة من أناس مسمّين بتواريخهم وأسفارهم وعدالتهم. في عام 2077 يمشي المتعلم في تلك السلسلة كخريطة حيّة، وتفعل الآلة ما كان المحدّثون يفعلونه على ضوء الشموع: تتحقق أكان الراويان يلتقيان أصلًا، وأينحرف الخبر عن أقرانه. الأداة جديدة؛ أما الشك فعمره أربعة عشر قرنًا."
      scene: isnad
      a:
        - id: "concept/isnad"
          l: "الإسناد"
        - id: "concept/ittisal-al-isnad"
          l: "اتصال الإسناد"
    - k: "الطريق"
      t: "السيرة مشيًا"
      d: "بدل أن يقرأ أن الهجرة استغرقت أيامًا في الصحراء، يقف طفلٌ في عام 2077 على ذلك الطريق عند الفجر — يحسّ الحرّ، ويرى الدليل يقود الركب بعيدًا عن الطلب، وينتظر داخل الغار. خرائط الرحلات في المتحف خطوة أولى؛ والسرد الغامر هو التالي. هكذا كانت القصة تُروى دائمًا — حول النيران، وفي المساجد، وبأصوات الأمهات — وما تغيّرت إلا النار."
      a:
        - id: "event/hijra"
          l: "الهجرة"
        - id: "place/jabal-thawr-madina"
          l: "غار ثور"
    - k: "الحج"
      t: "الحج في زمن تدفّق الجموع"
      d: "مكة توظّف روبوتات منذ اليوم لتوزيع الماء وتنظيف الرخام والإجابة عن الحجاج. وبحلول 2077 قد يجعل ذكاء تدفّق الجموع تدافعات التاريخ أمرًا غير متخيَّل، وقد تُحيل سماعات الترجمة لغةَ الإشارة عند المطوّف إلى التقاعد، وقد يمشي مزارعٌ لن يقوى على الرحلة يومًا في محاكاةٍ أمينة للمناسك. ثم يأتي السؤال الصعب الذي يسأله العلماء منذ الآن: هل الحضور هو المقصود؟"
      scene: hajj
      a:
        - id: "place/mecca"
          l: "مكة"
        - id: "concept/hajj-rulings"
          l: "أحكام الحج"
    - k: "المرجعية"
      t: "المفتي والآلة"
      d: "حين يستطيع كل مسلم أن يسأل النموذج ذاته، يتفرع مستقبلان: أحدهما يتكاثر فيه الاجتهاد — أدوات مفتوحة تتيح لكل عالم أن يختبر الحكم على أربعة عشر قرنًا من المنهج — والآخر تصير فيه خوارزمية واحدة، بهدوء، المرجعية الوحيدة على الأرض. المطبعة أنهت احتكار الحافظ، وقاعدة البيانات أنهت موسوعية العالِم. أما ما تنهيه الآلة أو تحرّره فما يزال قيد التقرير."
      a:
        - id: "concept/ijtihad"
          l: "الاجتهاد"
        - id: "concept/al-fatwa-ala-al-fadaiyyat"
          l: "الفتوى"
    - k: "ما وراء الأرض"
      t: "فقهٌ ما وراء الأرض"
      d: "حدث من قبل فعلًا: في 2007 كتب مجلس إفتاء ثمانية عشر صفحة ليتمكن رائد مسلم من الصلاة في محطة ترى شروق الشمس ست عشرة مرة في اليوم — استقبل الكعبة أو مسقطها أو الأرض أو أي جهة؛ وصلِّ خمس صلوات على توقيت ميناء الانطلاق؛ وتحرّك بالنية إن طفا جسدك. وفي 2077 قد يعيش مسلمون على المريخ، وفي نهار قطبٍ دائم، وفي مركبات تدور. الأسئلة تبدو جديدة؛ أما المنهج — الوزن والتكيّف وحفظ الفريضة — فمن أقدم ما في هذا المتحف."
      scene: space
      a:
        - id: "concept/awqat-al-salat"
          l: "أوقات الصلاة"
    - k: "الشبكة"
      t: "الأمة بوصفها شبكة"
      d: "في منتصف القرن سيكون نحو واحد من كل ثلاثة أشخاص مسلمًا — أكبر جماعة دينية وأصغرها سنًّا على الأرض — يتشارك المدن مع مليارات الآلات الخادمة. فما معنى الأخوّة حين يكون زميلك اصطناعيًّا؟ قد تصير الأوقات أوقافًا قابلة للبرمجة تفرج عن نفسها عند شرط، وقد تجري الزكاة في مال يعدّ نفسه. كانت الأمة شبكةً دائمًا — شبكة رسائل وقوافل وأسانيد. والكوابل ليست إلا لحمها الأحدث."
      scene: city
      a:
        - id: "concept/waqf"
          l: "الوقف"
    - k: "المتحف"
      t: "وهذا المتحف"
      d: "الأمانة تجعل المحطة الأخيرة هذه المحطة نفسها: متحفٌ للإسلام تكتب الآلات معظمه منذ الآن، وتفحصه القواعد، وتجمّده صفحاتٍ ساكنة — تسويته الخاصة بين سرعة الآلة وحفظ الإنسان. وفي 2077 قد يكون مكانًا تمشي فيه، أو رسمًا بيانيًا تسكنه، أو رفيقًا يعرف أيّ مقتنياته ستحرّكك. ومهما كان شكله، فسؤاله سيبقى سؤال هذه الصفحة نفسه."
  tensions:
    - q: "هل تستطيع آلة أن تؤمّ الصلاة؟"
      d: "روبوتات الإرشاد تجيب اليوم عن أسئلة الحجاج في مكة. أما هل يجوز للآلة أن تقف إمامًا — أم يجب أن يكون الصوت لإنسانٍ سيُسأل عنه — فنقاشٌ حيّ لا أمرٌ محسوم."
    - q: "هل تحسب محاكاة الحج حجًّا؟"
      d: "المحاكاة تستطيع أن تعلّم المناسك لملايين لن يسافروا أبدًا. العلماء يفرّقون بين التعلّم والأداء — لكن المسافة بين جسد الحاج ونظّارة الواقع تطرح سؤالًا عن الحضور أجاب عنه كل عصرٍ بجواب مختلف."
    - q: "ذكاءٌ اصطناعي واحد لكل فتوى؟"
      d: "إن سأل مليار مسلم النموذج نفسه، تتركز المرجعية بشكلٍ لم تعرفه الأمة قط — ولا حتى تحت الخلفاء. بعضهم يرى نهاية التنوع الفقهي؛ وآخرون يرون الاجتهاد وقد أُدمقرط أخيرًا. وكلا الفريقين يستشهد بالتاريخ نفسه."
  voices:
