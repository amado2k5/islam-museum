  alts:
    mosque: "مسجد ليلي منمّق: مصلّون بلا ملامح يقفون في صف واحد بجانب شخصية هولوغرامية شفافة وروبوت صغير يحمل الماء."
    hifz: "متعلّم بلا ملامح يقرأ من كتاب متوهّج بينما تنصت له كرة رفيقة عائمة تحيط بها حلقات صوت ناعمة."
    isnad: "سلسلة ذهبية من عقد مضيئة تمتد في حقل مظلم، وتقف عند حلقاتها شخصيات بلا ملامح، وحلقة فحص تقارن بين عقدتين."
    hajj: "نقط الحجاج تدور حول كعبة منمّقة تحت هلال، ويقف روبوتان مرشدان صغيران على الحافة بينما تمسح قوسان استشعارية الجمع."
    space: "رائد فضاء يصلّي طائرًا داخل نافذة محطة، وخط ذهبي من النيّة يصل إلى نقطة مؤشرة على الأرض في الأسفل."
    city: "أفق مدينة 2077 بأبراج مضاءة ومئذنة وقبة؛ يتشارك الناس والروبوتات الصغيرة الشارع تحت هلال بينما تعبر طائرات صغيرة السماء."
