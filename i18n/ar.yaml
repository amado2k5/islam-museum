foundation:
  title: عن مؤسسة متحف الإسلام
  lede: 'متحفٌ رقميٌّ مفتوح ومجانيّ عن الإسلام: العقيدة والحضارة والشعوب والأماكن والأفكار والآثار والكلمة والحياة المعاصرة، من العالم الذي وُلد فيه الإسلام إلى يومنا
    هذا.'
  logo_title: الشعار
  logo_intro: صُمِّم الشعار ليجمع ثلاثة عناصر من عمارة الإسلام وكتابه في شكلٍ واحد.
  logo_star: 'النجمة ذات الثماني رؤوس، من الهندسة الإسلامية: الزمان والمكان معًا، فلا يُفهم أحدهما دون الآخر.'
  logo_arch: 'المحراب: الباب الذي يدخل منه الزائر، والتطلّع نحو القبلة.'
  logo_book: 'الكتاب المفتوح: العلم والكلمة، والقراءة قبل الحكم.'
  logo_download: العلامة (PNG)
  emblem_alt: 'شعار المتحف: نجمة ثمانية ذهبية تحيط بقرص لازوردي عليه محراب نحاسي فوق كتاب مفتوح'
  emblem_download: الشعار الكامل (صورة)
  logo_dark_download: العلامة للخلفيات الداكنة
  logo_lockup_download: تنزيل الشعار مع الاسم
  story_title: القصة
  story_1: 'بدأ المشروع بسؤالٍ بسيط: لماذا لا يوجد مكانٌ واحد على الشبكة يجمع قصة الإسلام كلها، يدخل إليه الغريب فيتجوّل ويتعلّم، ويستطيع الباحث أن يتحقّق ويعود إلى
    المصدر؟ المعرفة عن الإسلام مبعثرة بين مواقع النصوص، وأرشيفات المتاحف، والمقالات الموسوعية، والدراسات الأكاديمية، والتغطيات الصحفية، وكثيرٌ منها يُكتب للدفاع أو
    للهجوم لا للفهم.'
  story_2: 'قرّر المشروع أن يُبنى كمتحفٍ لا كمقالةٍ طويلة: تسعة أجنحة (الزمان، والمكان، والناس، والأفكار، والآثار، والكلمة، والإسلام الحي، واليوم، وصُنع) تُطلّ على
    الموضوع نفسه من زوايا مختلفة، وكل شخصٍ أو مكانٍ أو حدثٍ أو فكرةٍ أو أثرٍ عقدةٌ في رسمٍ بيانيٍّ تربطها بما حولها في الزمان والمكان.'
  story_3: 'تُحفظ المادة في ملفات نصية واضحة يمكن لأي أحد قراءتها، وكل حقيقة مُسندة إلى مصدر، وكل تاريخ مكتوب بصيغته الدقيقة مع تقويمه الهجري والميلادي. والموقع نفسه
    صفحات ثابتة: بلا خادم، ولا قاعدة بيانات، ولا خدمة مدفوعة، ولا نموذج ذكاء اصطناعي يعمل حين يزور أحدٌ الموقع.'
  story_4: 'حين اختار المتحف هويته البصرية، أُخذت ألوانه من أصول العمارة الإسلامية وصناعة المخطوطات: الأزرق اللازوردي العميق، والذهب المطفأ لصفحات المخطوطات، والورق
    الحليبي، والبيج الرملي للألواح. ولم تُنسخ زخرفةٌ بعينها من أثرٍ محفوظ، بل وُلدت النقوش من هندسة النجمة والمربع والدائرة.'
  story_5: 'ثم جاء العمل الجماعي: مساهمون وجلساتُ عملٍ متوازية تُضيف دفعاتٍ صغيرة من المواد، ومراجعةٌ تُنتج مسوّدات تُعرض قبل أن تُعتمد. المتحف لا يزال في طور البناء،
    ويعلن ذلك في كل صفحة، وصفحة التغطية تُحصي ما اكتمل وما ينتظر.'
  founder_title: المؤسِّس
  founder_line: أسّسه {name}، كندي من أصل مصري، ويقيم في أوكفيل بمقاطعة أونتاريو.
  founder_name: أحمد عبد العال
  founder_body: 'أسّس المشروع شخصٌ واحد، ووضع رؤيته الأولى في وثائق التخطيط داخل المستودع نفسه، ثم فتح بابه لكل من أراد أن يُضيف أو يُصحِّح. تقوم الرؤية على أن يبقى
    المتحف حيًّا حتى لو توقّف مؤسِّسه: نصوصه في Git، وبياناته مفتوحة، ويستطيع أي إنسانٍ أن ينسخه كاملًا على حاسوبه. هذه الصفحة تصف المشروع وغايته، لا سيرة صاحبه.'
  goal_title: الغاية
  goal_intro: 'غاية المتحف أن يعرض الإسلام كلّه، من بداياته إلى اللحظة الراهنة، بإنصافٍ وبلا انحياز. ومن أجل ذلك يلتزم بما يلي:'
  goal_1: 'يصف ولا يحكم: الوقائع بتواريخها ومصادرها، وتُنسب الأحكام إلى أصحابها.'
  goal_2: الرواية السنّية هي الإطار الرئيسي للبحث، وتُذكر كل رؤيةٍ أخرى بعد أن تُوسَم بوضوح.
  goal_3: يُدرج المعارضين والناقدين والحلفاء بأدوارهم في زمانهم، ولا يكتب عنهم بلغة الخصومة.
  goal_4: 'المسائل الخلافية تُعرض في بطاقات توتّرٍ: صوتان أو أكثر، لكلٍّ منها مصدره، دون حكمٍ من المتحف.'
  goal_5: كل ادعاءٍ مُسنَدٌ إلى مصدر، والويكيبيديا مرجعُ إشارةٍ لا مصدر.
  goal_6: يبدأ بالعربية، ويصلح للزائر الذي لا يعرف شيئًا عن الإسلام كما يصلح للباحث المتخصص.
  take_title: شارك في البناء
  take_body: المحتوى والكود مفتوحان للجميع. يمكنك قراءة المستودع، أو الإبلاغ عن خطأ، أو اقتراح كيانٍ جديد، أو طلب ترجمةٍ إلى لغةٍ أخرى.
  take_repo: المستودع على GitHub
  take_suggest: اقتراح كيانٍ أو تصحيح
  license: 'الترخيص: النص CC BY-SA 4.0 · البيانات CC0 · الكود MIT'
