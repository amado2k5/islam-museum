  guide_title: "ما يقدمه مستكشف الخط الزمني"
  guide_lede: "يتيح لك مستكشف الخط الزمني أن تختار موضوعًا واحدًا (شخصية أو عصرًا أو مدينة) وتمشي قصته محطةً محطة. كل محطة سجلّ من المتحف، مع تاريخه بالتقويمين الهجري والميلادي، ونصٍّ قصير، ومصادره."
  guide_features_title: ما يمكنك فعله
  guide_feature_list: "اختر موضوعًا من الرفوف، أو ابحث عنه باسمه.|ابدأ رحلة موجَّهة: محطات بترتيب زمني، مع «المحطة ٣ من ٩» أثناء السير.|تنقّل على الخط بالأسهم، أو باختيار محطة، أو بمفاتيح الأسهم.|افتح التفاصيل الكاملة، وانظر المكان على الخريطة حيث يوجد، أو اتبع السياق والعلاقات داخل المتحف.|اقرأ الشخصيات والأماكن والمصادر المرتبطة بجانب القصة، وتتغير المصادر كلما تقدّمت.|فعّل «للصغار» حيث للمحطة نصٌّ كُتب للصغار."
  guide_usage_title: طريقة الاستخدام
  guide_usage_list: "لكل محطة عنوان خاص بها، فيمكنك مشاركتها أو الرجوع إليها.|التواريخ التقريبية أو المتنازع فيها تُعرض كذلك، كما تذكرها المصادر.|من أي مدخل في المتحف له قصة، اضغط «استكشف الخط الزمني» لفتحها."
  guide_limits_title: ما الذي لا يفعله
  guide_limits_list: "لا يستخدم الذكاء الاصطناعي عند القراءة. كل ما في الصفحة أُعدّ مسبقًا.|لا يبحث في الويب. الموضوعات غير المعدّة تظهر: ليس في مستكشف الخط الزمني بعد.|لا يطلب تسجيل دخول ولا يحتفظ بسجل عنك.|يظهر نص الصغار فقط حيث كُتب وتم تدقيقه."
  guide_back: "العودة إلى مستكشف الخط الزمني"
