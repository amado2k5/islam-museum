    quran:
      title: Dalam Al-Qur'an
      desc: Ayat-ayat yang melipatgandakan perbuatan baik dan membalas perbuatan buruk dengan yang setara, menebus dan menggantikan perbuatan jahat, mengingatkan para ahli kitab mulia dan ahli taurat yang
        tidak meninggalkan kecil maupun besar, timbangan keadilan dan berat atom, serta kecepatan perhitungan.
    sunnah:
      title: Per tahun
      desc: 'Hadits Sahih, Sunan, dan Muwatta: Hadis suci tentang pencatatan perbuatan baik dan perbuatan buruk, hitungan peringatan, pembacaan, doa, penebusan dosa, qirat dan derajat kebangkrutan, dan
        hal pertama yang harus dipertanggungjawabkan oleh seorang hamba.'
    seerah:
      title: Dalam biografi
      desc: Teks dalam buku biografi dan kampanye dianggap sebagai karya; bagian ini akan penuh sendiri setiap kali buku biografi yang memuat teks dari bab ini dipanen.
    books:
      title: Dalam buku lain
      desc: Teks count dalam buku yang dihitung satu sama lain—mulai dari asketisme, penyempurnaan, sejarah, yurisprudensi, dan lainnya—diklasifikasikan berdasarkan jenis buku pada hari bagian-bagiannya
        dimasukkan.
    curated:
      title: Rekor Terpilih
      desc: 'Artikel bab dan baris kalkulator: Setiap catatan menjelaskan salah satu teks penghitungan dan menyebutkan sumbernya.'
  viz:
    title: Tangga ganda
    caption: Setiap anak tangga sepuluh kali lipat dari yang di bawahnya. Perbuatan baik yang dikalikan dengan teks yang dikutip berada pada angka yang tercatat, jangkauannya adalah batang yang diperpanjang,
      dan apa yang disebutkan dalam teks tentang hadiah tanpa angka berakhir dengan panah terbuka, bukan angka. Adapun perbuatan buruk, mereka berdiri di sisi lain kolom pada nilai yang tercatat. Angka-angka
      tersebut adalah apa yang disebutkan dalam teks yang dikutip seperti yang tercatat di museum, dan tangga tidak menambah apa pun padanya.
    ladder_label: Hierarki logaritmik dari jumlah kebajikan dan kebajikan seperti yang disebutkan dalam teks
