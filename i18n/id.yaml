future:
  strip_title: Bagaimana kehidupan umat Muslim di tahun 2077?
  strip_lede: Robot telah melayani di Masjid Agung sejak hari ini. Generasi Maju — sebuah fantasi yang dibuktikan oleh empat belas abad adaptasi.
  strip_cta: Masuki masa depan
  eyebrow: 1448 AH ← 1500 AH
  title: Kehidupan Muslim di Tahun 2077
  lede: 'Ini bukan ramalan—yang tak terlihat hanya milik Tuhan. Halaman ini adalah latihan imajinasi di museum: setiap media yang pernah dilewati umat Muslim—kertas, cetak, radio, dan layar—diserap oleh
    agama tanpa esensinya bergerak. Jadi apa yang terjadi ketika medium itu sendiri mulai menjawab?'
  note: Yang terjadi selanjutnya adalah fiksi berbasis bukti — robot nyata, fatwa nyata, dan riset nyata — bukan ramalan. Setiap stasiun membawa Anda kembali ke dalam museum.
  stations: Stasiun di Jalan Depan
  anchors_label: Dipasang di museum
  tensions_title: Pertanyaan terbuka
  tensions_lede: Museum tidak memberikan penilaian. Setiap kartu adalah diskusi langsung.
  voices_title: Suara-suara yang dibayangkan di hadapan kita
  voices_lede: 'Pikirkan ini: sebelum kita, ilmuwan, insinyur, dan seniman. Dari apa yang mereka tulis:'
  epilogue_title: Undangan Tetap
  epilogue: Halaman ini akan berkembang. Ketika sebuah mesin baru memasuki masjid, ketika seorang ilmuwan menulis skenario baru, dan ketika Anda membayangkan apa yang tak pernah kita bayangkan — masa depan,
    seperti museum, sedang dalam tahap pembangunan.
  sections:
  - k: Kelompok
    t: Kelompok
    d: 'Pada tahun 2077, barisan doa Jumat mungkin berputar mengelilingi lensa, bukan di sekitar kolom—para jemaat dalam realitas campuran berdiri berdampingan dengan orang-orang di tiga benua. Robot pemandu
      berkeliaran di Masjid Agung mulai hari ini, menjawab pertanyaan dalam sebelas bahasa; kemudian mereka mungkin membawa air Zamzam, menerjemahkan khotbah ke setiap telinga, dan tahu siapa pengunjung
      baru itu dan siapa yang telah datang selama empat puluh tahun. Namun kelas itu tidak pernah tentang bangunan: itu adalah geometri dari yang setara, dan pertanyaannya adalah apakah sebuah gambar imajiner
      bisa berdiri di sana.'
    a:
    - l: Kebutuhan kelompok
    - l: Penyeimbangan tingkat
  - k: Teks
    t: Pelajari Al-Qur'an
    d: 'Teman hafalan yang tak kenal lelah: Dia mendengarkan empat puluh percobaan Anda dengan kesabaran seperti percobaan pertama, mengambil slip tajweed yang terlewat oleh guru yang lelah, dan menghafal
      semua yang dia ketahui dalam rantainya — yaitu, membaca, dari pembaca mana pun, dan melalui jalur narator mana pun. Hafalan tetap ada pada perkamen, printer, dan kaset; sampai mesin menjadi pembawa
      lain. Aturan museum sendiri hari ini mengatakan bahwa teks itu sendiri tidak pernah berasal dari instrumen.'
    a:
    - l: Pelestarian teks
  - k: Seri
    t: Belajar berbicara
    d: 'Atribusi adalah gambar epistemologis pertama di dunia — serangkaian orang yang dinamai berdasarkan sejarah, perjalanan, dan keadilan mereka. Pada tahun 2077, pembelajar berjalan dalam rantai itu
      seperti peta hidup, dan mesin melakukan apa yang dilakukan modernis dengan cahaya lilin: ia memverifikasi apakah kedua narator benar-benar bertemu, dan berita menyimpang dari rekan-rekannya. Alat
      ini baru; adapun keraguan, sudah berusia empat belas abad.'
    a:
    - l: Atribusi
    - l: Koneksi referensi
  - k: Jalan
    t: Biografi berjalan kaki
    d: Alih-alih membaca bahwa migrasi memakan waktu berhari-hari di gurun, seorang anak di tahun 2077 berdiri di jalan itu saat fajar—merasakan panas, melihat pemandu mengemudi menjauh dari permintaan
      itu, dan menunggu di dalam gua. Peta perjalanan museum adalah langkah pertama; narasi imersif adalah langkah berikutnya. Begitulah cerita selalu diceritakan—tentang api, di masjid, dan dengan suara
      para ibu—dan hanya api yang berubah.
    a:
    - l: Migrasi
    - l: Gua Thor
  - k: Haji
    t: Haji di masa arus masuk massal
    d: 'Mekah mulai menggunakan robot untuk mendistribusikan air, membersihkan marmer, dan menjawab bagi para peziarah. Pada tahun 2077, kecerdasan aliran kerumunan mungkin membuat bentrokan sejarah menjadi
      tak terbayangkan, headphone terjemahan mungkin merujuk pada bahasa isyarat bagi peziarah yang sudah pensiun, dan seorang petani yang mungkin tidak akan pernah bisa melakukan perjalanan itu mungkin
      berjalan dengan setia dalam simulasi ritual. Kemudian muncul pertanyaan sulit yang kini diajukan para ilmuwan: Apakah kehadiran adalah tujuan yang dimaksudkan?'
    a:
    - l: Mekah
    - l: Putusan Haji
  - k: Referensi
    t: Mufti dan Mesin
    d: 'Ketika setiap Muslim dapat menanyakan model yang sama, dua masa depan bercabang: satu di mana ijtihad berlipat ganda — alat terbuka yang memungkinkan setiap cendekiawan menguji penilaian atas metodologi
      selama empat belas abad — dan yang lain di mana satu algoritma diam-diam menjadi satu-satunya referensi di bumi. Mesin cetak mengakhiri monopoli penghafal, dan basis data mengakhiri ensiklopedia dunia.
      Apa yang diakhiri atau dibebaskan mesin masih dalam laporan.'
    a:
    - l: Ijtihad
    - l: Fatwa
  - k: di luar bumi
    t: Yurisprudensi Makhluk Luar Angkasa
    d: 'Sebenarnya itu pernah terjadi sebelumnya: Pada tahun 2007, Dewan Fatwa menulis delapan belas halaman agar seorang pelopor Muslim dapat berdoa di stasiun yang melihat matahari terbit enam belas kali
      sehari — menerima Ka''bah, pendaratannya, bumi, atau arah mana pun; tiba lima doa pada saat pelabuhan berangkat; dan bergerak dengan niat jika tubuh Anda mengapung. Pada tahun 2077, Muslim dapat tinggal
      di Mars, pada hari kutub permanen, dan di pesawat ruang angkasa yang berputar. Pertanyaan-pertanyaan ini tampak baru; tetapi metodologinya — berat, adaptasi, dan hafalan doa wajib — termasuk yang
      tertua di museum ini.'
    a:
    - l: Waktu doa
  - k: Jaringan
    t: Bangsa sebagai Jaringan
    d: Pada pertengahan abad, sekitar satu dari tiga orang akan menjadi Muslim—kelompok agama terbesar dan terkecil di dunia—berbagi kota dengan miliaran mesin pelayan. Jadi apa arti persaudaraan ketika
      rekan Anda bersifat buatan? Waktu bisa menjadi wakaf yang dapat diprogram yang melepaskan diri dengan syarat, dan zakat dapat dibayarkan dengan uang yang menghitung dirinya sendiri. Bangsa selalu
      menjadi jaringan—jaringan pesan, karavan, dan rantai transmisi. Dan kabel hanyalah daging terbarunya.
    a:
    - l: wakaf
  - k: The Museum
    t: Dan museum ini
    d: 'Kejujuran menjadikan stasiun terakhir ini sebagai stasiun yang sama: sebuah museum Islam yang sebagian besar sudah ditulis mesin, aturan memeriksa, dan dibekukan oleh halaman-halaman diam — perpaduan
      tersendiri antara kecepatan mesin dan hafalan manusia. Dan pada tahun 2077, mungkin itu adalah tempat untuk berjalan, sebuah peta yang kamu huni, atau teman yang tahu barang mana yang akan menggerakkanmu.
      Apapun bentuknya, pertanyaannya akan tetap sama di halaman ini.'
  tensions:
  - q: Apakah mesin bisa memimpin doa?
    d: Robot pemandu sedang menjawab pertanyaan para peziarah di Mekah saat ini. Adapun apakah sebuah mesin diperbolehkan berdiri sebagai imam — atau seharusnya suara manusia yang ditanya tentang itu —
      ini adalah perdebatan yang hidup dan bukan masalah yang sudah selesai.
  - q: Apakah Anda dihitung sebagai simulasi Haji?
    d: Simulasi dapat mengajarkan ritual kepada jutaan orang yang tidak akan pernah melakukan perjalanan. Para ilmuwan membedakan antara pembelajaran dan pertunjukan — tetapi jarak antara tubuh peziarah
      dan kacamata realitas menimbulkan pertanyaan tentang kehadiran yang setiap era telah menjawab dengan cara berbeda.
  - q: Satu AI per fatwa?
    d: Jika satu miliar Muslim menanyakan model yang sama, otoritas agama terkonsentrasi dengan cara yang belum pernah dialami bangsa — bahkan di bawah khalifah. Beberapa melihat akhir dari keberagaman
      yurisprudensi; yang lain melihat ijtihad sebagai sesuatu yang akhirnya didemokratisasi. Kedua kelompok mengutip sejarah yang sama.
  voices:
  - l: Robot Pemandu Pintar di Masjid Agung — The National, 2021
  - l: 'Dewan Fatwa Malaysia: Panduan Ibadah di Stasiun Luar Angkasa Internasional, 2007'
  - l: Skenario Pembelajaran Islam di Era Guru Mesin — Studi Pandangan Jauh, 2025
  - l: Teknologi Kecerdasan Buatan dalam Haji dan Umrah — Survei IEEE Access, 2024
  - l: '"Muslim Receivers" — Edisi Khusus Majalah Muslims in Europe'
  - l: 'Masa Depan dan yang Dibangun: Visi Islam — Institut Masa Depan Kehidupan'
  - l: Seniman Muslim Digital dan Karya Spiritual Kecerdasan Buatan — Jurnal Studi Pengalaman Religius
  alts:
    mosque: 'Masjid malam yang dihias: Jemaat tanpa wajah berdiri berbaris di samping sosok holografik transparan dan robot kecil yang membawa air.'
    hifz: Seorang pelajar tanpa ciri membaca dari sebuah buku yang bercahaya sementara bola pendamping yang melayang mengupingnya dikelilingi oleh lingkaran lembut.
    isnad: Rantai emas node bercahaya yang membentang melintasi bidang gelap, dengan karakter-karakter yang berdiri di cincinnya, dan cincin pemeriksaan yang membandingkan dua node.
    hajj: Titik-titik peziarah mengelilingi Ka'bah yang dihias di bawah bulan sabit, dan dua robot kecil berpemandu berdiri di tepi sementara dua busur menghapus sensor jamak.
    space: Seorang astronot berdoa kepada burung di dalam jendela stasiun, dengan garis niat emas mencapai titik di tanah di bawahnya.
    city: Cakrawala kota tahun 2077 menampilkan menara yang diterangi, menara, dan kubah; orang-orang dan robot kecil berbagi jalan di bawah bulan sabit sementara pesawat kecil melintasi langit.
