      shuab: Door Records
      khisal: Door Records
    shuab_groups: 'Al-Ayni membaginya dalam pembaca utama menjadi tiga kategori: tiga puluh cabang dalam kepercayaan, tujuh dalam tindakan lidah, dan empat puluh dalam tindakan jasmani.'
    record: Log pintu
    open: Segala sesuatu di pintu
hudud:
  title: Penerok batas dan dosa besar Tuhan
  lede: 'Setiap penyebutan batasan dan dosa besar Tuhan dalam sumber museum: ayat "Inilah batas-batas Tuhan" dan "Dan siapa pun yang melanggar batas Tuhan," batasan perselingkuhan, pencurian, dan fitnah
    dalam dua Sahih, Al-Muwatta, dan Sunan, penetapan hukuman dalam biografi dan laporan Para Sahabat dan Pengikut, daftar dosa besar dan dosa-dosa yang patut dipersalahkan, serta setiap penyebutan dalam
    setiap buku — catatan dengan sumbernya yang berbicara setiap kali teks baru ditambahkan.'
  badge: Penjelajah Batas dan Dosa Besar Tuhan
  status: Struktur ini berisi {n} sebuah catatan dalam {s} bagian; teks adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa — dengan prosa dan puisi trilingualnya. Kenangan ditemukan saat dibangun dalam kamus yang dijaga berdasarkan teks bagian-bagian: "Hudud
    Tuhan" dalam segala bentuknya, penetapan hudud, kata-kata hukuman yang telah ditentukan — rajam dan cambuk dalam bentuk hukuman, amputasi, dan diskresioner — serta "dosa besar" dan "dosa mematikan";
    referensi lemah dihitung — "hudud" dan "hudud" abstrak, dan "kawanan" dalam arti ambigunya, dan kejahatan hudud seperti perselingkuhan, pencurian, fitnah, alkohol, murtad, dan perang, pembalasan, dan
    referensi "besar" yang ambigu — bersama hanya satu atau dua referensi kuat bersama-sama, dan positif palsu yang terdokumentasi dikecualikan secara definisi; setiap buku yang terjadi kemudian secara
    otomatis membawa catatannya ke sini ketika bagian-bagiannya ditempatkan dalam grafik, dan catatan yang dipilih bergabung melalui tag hudud-browser. Setiap bagian menandai ''batas'' atau ''dosa besar''
    sesuai dengan tanda-tandanya.'
  api: Koleksi lengkapnya tersedia di
