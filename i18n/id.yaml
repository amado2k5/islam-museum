  kinds:
    hudud: Batasan Tuhan dan Hukuman yang Ditetapkan
    kabair: Dosa besar
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: 'Batas-batas Tuhan dan dosa besar dalam wahyu: "Inilah batas yang ditetapkan oleh Allah, jadi janganlah mendekatinya," "Dan siapa pun yang melanggar batas Allah telah berbuat salah pada dirinya
        sendiri," "Wanita zina, baik yang berzina itu, akan dicambuk," "Dan pencuri serta pencuri perempuan, dipotong tangan mereka," serta hukuman atas hasutan, pembalasan, dan dosa besar.'
    sunnah:
      title: Per tahun
      desc: 'Hadits dari dua Sahih, Al-Muwatta, dan Sunan: "Hindari tujuh yang mematikan," penegakan hukuman hudud kepada mereka yang menyetujui, melempari kambing dan Ghamidiyyah, hukuman atas fitnah,
        alkohol, dan pencurian, serta bab tentang hudud dalam buku metodologi.'
    seerah:
      title: Dalam biografi
      desc: Apa yang tertulis dalam buku-buku biografi dan sejarah mengenai hukuman dan dosa besar—pelaksanaan hukuman di Madinah, serta sikap Para Sahabat dan Pengikut terkait dosa besar—mengisi bagian
        ini dengan isi yang sama setiap kali teks biografi baru diterbitkan.
    books:
      title: Dalam buku lain
      desc: Referensi kepada Hudud dan dosa besar dalam setiap karya yang terjadi kecuali Al-Qur'an, Hadis, dan Biografi—buku fior, asketisme, tafsir, sejarah, puisi, dan lainnya—diklasifikasikan berdasarkan
        jenis karya pada hari interupsi itu diturunkan.
    curated:
      title: Catatan tentang perbatasan dan dosa besar
      desc: 'Catatan museum terpilih tentang batasan Tuhan dan dosa-dosa besar itu sendiri: konsep batasan Tuhan, hukuman, dosa besar, rajam, hukuman diskresi, perselingkuhan, dan hal-hal terkait.'
  viz:
    title: Hukuman dan dosa besar seperti yang disebut sumber
    note: Ini adalah bagian-bagian dalam sumber museum di mana kata-kata ini muncul, dan tidak ada apa-apa di belakangnya. Satu panel menampilkan kata-kata dan frasa yang dicocokkan Al-Kashif di bawah batas
      Tuhan, dan panel lainnya menunjukkan apa yang cocok dengan Dia di bawah dosa-dosa besar. Setiap baris ditandai berdasarkan jumlah segmennya, dan setiap panel referensi membuka catatan. Indeks ini
      adalah apa yang ada dalam sumber dan tidak mengeluarkan penilaian atau perintah. {Curated} adalah catatan terkoordinasi tentang subjek dalam daftar di bawah ini, dan tidak ada teks yang cocok.
