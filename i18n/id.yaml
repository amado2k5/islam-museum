i3lam:
  title: Muslim Media Browser
  lede: Setiap penyebutan tentang mereka yang membawa firman — mulai dari muezin yang mengangkat seruan shalat kepada yang datang di pasar, pengkhotbah di mimbar, pembicara suara khalifah dan utusan Nabi
    kepada raja, juru tulis wahyu dan juru tulis istana, jurnalis publikasi baru, profesional media dan pengaruh, reformis dan revolusioner — dalam Al-Quran, Sunnah, biografi, kisah Para Sahabat dan Pengikut,
    dan setiap buku dihitung di museum, sekarang dan dalam apa yang akan dipanen nanti.
  badge: Word Makers Browser
  status: Dalam struktur ini, {n} adalah seseorang yang memiliki peran media dalam teks {j} dan {f} yang dirujuk dalam sumber {s}; teks adalah draf agar seseorang dapat membacanya.
  method_title: Cara kerja browser
  method_note: Setiap catatan di sini adalah catatan museum biasa dengan sumbernya dan prosa triharfiah. Seseorang bergabung dalam peran kecuali dengan memasukkan pekerjaan dalam catatannya sendiri — bukan
    inferensi. Teks bergabung dengan aliran ketika gambar benar-benar mencatat surat tersebut disebutkan dari itu kepada orang-orang tersebut atau ke profesi media, atau ketika catatan tersebut diberi label
    i3lam-browser — penyebutan tersebut muncul dalam sebuah buku di hari teks diunduh, tanpa mengedit halaman ini. Setiap teks ditandai dengan sumbernya (Al-Qur'an / Sunnah / Biografi / Buku).
  requirements: Kriteria aplikasi asli dan penerimaan untuk browser ini disimpan dalam
  wire_title: Kawat — dari menara ke aliran
  wire_aria: 'Diagram rantai media: Setiap stasiun menyalakan kabel transmisi, dan ukuran loopnya diukur dengan jumlah pengguna terdaftar.'
  wire_note: 'Setiap lingkaran ditempatkan di kawat, dan radiusnya bergantung pada jumlah peserta yang terdaftar: panggilan muezzin menjadi panggilan penelpon, lalu khotbah, kemudian kata-kata Utusan dan
    pembicara, lalu halaman penulis, kemudian versi cetak, kemudian siaran, lalu revolusi.'
  holders: '{n} terdaftar'
  quran_title: Dalam Al-Qur'an
  quran_note: Jangkar tetap untuk rentang ini dalam teks yang diindentasi — ditampilkan sebagai referensi teks beku dan tidak ditulis ulang.
  anchors:
    poets: Para penyair diikuti oleh yang tersesat — bait pertama tentang mereka yang memiliki mayoritas, dan pengecualian untuk mereka yang percaya dan berhati-hati.
    news: Jika mereka menerima sesuatu yang aman atau takut, mereka menyiarkannya—prinsip Al-Qur'an yang sama tentang bagaimana berita disebarkan sebelum disiarkan.
    adhan: Jangan jadikan panggilan salat sebagai lelucon atau permainan — ayat yang menghubungkan panggilan muezzin dengan kesucian.
    jumua: 'Seruan pada hari Jumat: Tinggalkan penjualan dan perluas untuk mengenang — seruan yang menetapkan jam orator.'
    herald: Memang, Kami telah mengutus Anda sebagai saksi, pembawa kabar baik, dan peringatan — misi nubuat yang akan diikuti oleh setiap penelepon dan pembicara setelahnya.
    proclamation: Seruan shalat dari Allah dan Rasul-Nya kepada umat pada hari haji yang lebih besar — model pengumuman publik.
    caller: 'Pemanggil dan pendengar: Adegan Al-Qur''an dari suara yang membawa pesan melalui pertemuan.'
  chain_title: Para pembuat kata — mereka yang membawanya
  chain_note: Setiap lantai di bawahnya mencatat profesi di museum, dan kartu setiap orang dalam catatannya memiliki entri pekerjaan, yang diatur berdasarkan tanggal yang diidentifikasi lukisan.
  mentioned_in: Disebutkan dalam teks {n}
  no_holders: Belum ada pendaftaran untuk peran ini di struktur ini.
  state_title: Ketika negara berbicara
  state_note: 'Jabatan yang dilayani oleh seri media: khalifah, sultan, dan raja yang kata-katanya disampaikan oleh pembicara, pengumum, dan utusan; menteri, hakim, gubernur, dan pengantar pos melalui siapa
    negara menyampaikan kepada rakyatnya. Mereka adalah suara institusi; seri di atas dan para mediatornya.'
  feed_title: Setiap penyebutan dalam sumber
  feed_note: Setiap teks yang sudah ditautkan oleh gambar tersebut ke pembuat kata atau profesi media, diklasifikasikan berdasarkan sumbernya—dan aliran ini secara otomatis meningkat setiap kali teks dari
    buku yang baru dipanen muncul dalam gambar atau membawa catatan tag i3lam-browser.
  feed_more: Dan {n} lainnya dalam sumber ini.
  feed_empty: Belum ada teks yang menunjukkan struktur ini — teks tersebut akan muncul di sini setiap kali buku hasil panen dijatuhkan.
  corpora:
    quran:
      title: Al-Qur'an
      note: Teks unduhan freezer hanya dilaporkan berdasarkan referensi teks.
    sunnah:
      title: Sunnah
      note: Berita dari kumpulan hadits.
    seerah:
      title: Biografi
      note: Berita dari buku biografi dan kampanye.
    books:
      title: Buku lain
      note: Semua buku lain dikumpulkan dalam koleksi tersebut.
  tagged_title: Log yang diberi tag untuk browser ini
  tagged_note: Setiap catatan yang ditandai dengan i3lam-browser secara otomatis ditambahkan di sini — inilah cara yang dikumpulkan kemudian.
heroes:
  title: Pahlawan Islam
  lede: 'Pria dan wanita telah berusaha keras dan berkorban banyak untuk orang lain: enam aula kebajikan, setiap aula memiliki empat pahlawan, dan cerita lengkap dengan sumbernya.'
  status: 'Jumlah pahlawan di aula ini: {n} tersebar di {jalur} jalur. Setiap nama membuka daftar pahlawan, dan setiap aula membuka cerita lengkapnya.'
  trail_link: Rahasia Seluruh Kisah Aula ({n} Pahlawan)
  record_link: Buka rekaman
  note_title: Tentang aula-aula ini
  note_body: 'Para pahlawan di sini memiliki sikap yang terdokumentasi, bukan simbol sempurna: setiap cerita dicatat dengan sumbernya, dan apa perbedaan narasinya, ini disebutkan dalam catatan peneliti.
    Aula itu semakin besar saat sebuah cerita baru selesai di museum.'
  virtues:
    sacrifice:
      name: Aula Pengorbanan
      lede: 'Mereka mengorbankan nyawa dan kenyamanan mereka untuk bangsa yang belum pernah mereka lihat: martir wanita pertama, pembawa panji, perisai Uhud, dan pemimpin bahkan tombak.'
    courage:
      name: Aula Keberanian
      lede: 'Stabilitas dihitung ketika kaki dan hati maju: ksatria ranjang, pedang ladang, ksatria Hattin, dan tetua gurun.'
    mercy:
      name: Mercy Hall
      lede: 'Belas kasih di sini adalah bentuk kekuasaan: pengkhotbah hati, ibu dari tawanan, penguasa rumah keadilan, dan pengasingan perlindungan tetangga.'
    generosity:
      name: Balai Kebun Anggur
      lede: 'Kekayaan lengkap yang menjadi manfaat publik: karavan Abdul Rahman, sumur Uthman, kekayaan Khadijah, dan wakaf Fatima.'
    knowledge:
      name: Aula Sains
      lede: 'Mereka membawa pengetahuan sebagai kepercayaan dan melindungi hidup mereka darinya: pendiri prinsip, pasien kesulitan, pengenalan Basra, dan lidah kebenaran.'
    steadfastness:
      name: Aula Al-Thabat
      lede: 'Dunia berguncang dan mereka tak bergerak: tak ada yang di bawah batu, jalan terpanjang menuju kebenaran, hari bangsa terguncang, dan kata yang tak takut apa pun.'
ritha:
  title: Browser dari hal-hal paling terkenal yang dikatakan dalam elegi dan obituari
  lede: 'Segala sesuatu yang dikatakan tentang elegi dan obituari dalam sumber-sumber museum: ayat-ayat kesabaran dan kenangan, ucapan Nabi atas kematian putra, cucunya, dan mereka yang terluka, obituari
    untuk Negus, Ja''far, Zayd, dan Ibn Rawaha, ucapan belasungkawa dari para sahabat, elegi Hassan, Ka''b ibn Malik, Al-Khansa, dan Labid, laporan para Sahabat dan Pengikut atas kematian orang-orang tercinta
    mereka, ucapan dari buku-buku yang dipanen, dan apa yang dipanen kemudian ditambahkan secara otomatis.'
  badge: Penjelajah Elegi dan Obituari
  status: Versi ini mencakup {n} sebuah catatan dalam bagian {s}; teks adalah draf untuk keterbacaan manusia.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa, dengan sumber dan teksnya dalam lima bahasa. Bagian-bagian ditemukan pada saat pembuatan dengan mendeteksi secara cermat teks ayat: kata-kata
    elegi dan ratapan, kata-kata obituari dan ratapan, kata-kata belasungkawa, bentuk tetap seperti ''Sesungguhnya, milik Allah apa yang Dia ambil, dan milik-Nya apa yang Dia berikan,'' ''Kesabaran saat
    kejutan pertama,'' kata-kata duka, dan tangisan, asalkan kematian disebutkan. Adapun ayat-ayat Al-Quran, mereka berasal dari tabel referensi, bukan dari kamus. ''Adjektif'' tidak mencakup deskripsi,
    ''atribusi kepada'' dalam asal-usul, ''warisan'' dalam warisan, dan tangisan ketakutan, mengecualikan tempat-tempat yang ditinjau dengan pengenalannya. Setiap buku yang dipanen kemudian memiliki bagian-bagiannya
    yang dimasukkan secara otomatis; catatan terpilih digabungkan dengan label ritha-browser. Setiap bagian diklasifikasikan sebagai: elegi, obituari, belasungkawa, tangisan, dan ratapan.'
  api: Koleksi lengkapnya tersedia di
  sections_title: Bagian Browser
  kinds_title: Tipe
  all_kinds: Semua jenis
  formulas_title: Pepatah dan rumus terkenal
  formulas_note: 'Bentuk tetap yang diketahui bangsa saat meninggal: setiap kartu membuka bagian terpendek yang dibawanya dan jumlah item yang ditemukan di sumber.'
  formula_count: '{n} dalam sumber'
  filter_label: Filter catatan
  filter_none: Tidak ada hasil.
  empty: Belum ada log di versi ini.
  kinds:
    ritha:
      title: Elegi
      ar: Elegi
      desc: Memuji almarhum dan menyebutkan kebajikan mereka dalam puisi dan prosa, serta elegi para Sahabat dan penyair.
    nay:
      title: Obituari
      ar: Obituari
      desc: Memberitahukan kematian Nabi, seperti julukan Nabi untuk Ja'far, Zayd, Ibn Rawaha, dan Negus.
    taziya:
      title: Turut bercita-cita
      ar: Turut bercita-cita
      desc: Menghibur dan menahan yang menderita, mencari kelegaan, dan berkata, "Sesungguhnya, milik Allah apa yang diambil-Nya, dan milik-Nya apa yang diberikan-Nya," serta makanan keluarga almarhum.
    bukaa:
      title: Menangis dan meratap
      ar: Menangis dan meratap
      desc: Air mata di mata dan kesedihan hati diizinkan, dan tangisan pipi, tepuk pipi, dan saku yang robek di saku.
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: 'Ayat-ayat kesabaran, pemulihan, dan setiap kematian yang disebutkan dalam Al-Qur''an: ujian orang beriman, kesedihan Yakub, setiap jiwa yang merasakan kematian, deskripsi para syuhada, dan
        jiwa yang tenang.'
    sunnah:
      title: Per tahun
      desc: 'Apa yang ada dalam dua Sahih, Al-Muwatta, dan Sunan: berkabung atas Al-Najashi dan Ja''far, belasungkawa putri Nabi, tangisan Nabi atas putranya, larangan meratap, dan pujian rakyat atas pemakaman—setiap
        hadis dengan jumlah dan sumbernya.'
    seerah:
      title: Dalam biografi
      desc: 'Apa yang tercantum dalam kitab-kitab biografi: kematian Nabi dan tangisan para sahabat, elegi Hassan untuk Nabi, Hamza, para syahid Mu''tah, dan sumur Ma''una, obituari Zayd, Ja''far, dan Ibn
        Rawaha; sumpah ini dipenuhi setiap kali teks biografi baru dikumpulkan.'
    books:
      title: Dalam buku lain
      desc: 'Berita tentang Para Sahabat, Pengikut, Sejarawan, dan Sastrawan: Ucapan belasungkawa dari Umar dan Muawiyah, Elegi Para Penyair, Tangisan Abu Bakr dan Umar, serta Kesedihan Khalifah dan Ulama
        dalam Sejarah Ummah, yang disusun sejak masa mereka dibaca.'
    curated:
      title: Rekor Terpilih
      desc: 'Catatan museum meliputi ratapan, obituari, belasungkawa, dan duka itu sendiri, serta peristiwa dan puisi terkait: elegi Hassan untuk Nabi, elegi para syuhada Mutah, kesedihan Nabi untuk Ja''far,
        dan kematian Ibrahim.'
  formulas:
    istirja:
      title: Pemulihan jika terjadi bencana
      note: Firman yang diucapkan oleh orang yang menderita, diikuti dengan doa um Salama.
    lillah_ma_akhadh:
      title: '"Sesungguhnya, milik Allah apa yang diambil-Nya, dan milik-Nya adalah milik-Nya apa yang Dia berikan."'
      note: Apa yang Nabi kirimkan kepada putrinya saat putranya sekarat.
    sadma_ula:
      title: '"Kesabaran di Kejutan Pertama"'
      note: Kata-kata Nabi kepada seorang wanita yang menangis di makam.
    ajirni:
      title: '"Ya Allah, berbalaslah aku dalam malapetakaku."'
      note: Doa bagi yang menderita seperti yang diceritakan oleh Muslim, Malik, dan Al-Tirmidhi.
    ayn_tadma:
      title: '"Mata menangis dan hati berduka"'
      note: Kata-kata Nabi atas kematian putranya Abraham.
    ya_abatah:
      title: '"Wow, ayah"'
      note: Pernyataan Fatimah pada hari wafatnya Nabi.
    man_kana_yabudu:
      title: '"Disembuhkan hidup dan mati"'
      note: Pernyataan Abu Bakr kepada Nabi pada hari wafatnya dan khotbahnya setelahnya.
    al_jafar:
      title: '"Masak makanan untuk keluarga Jaafar"'
      note: Sunnah untuk memberi makan keluarga almarhum.
    nay_najashi:
      title: Obituari Negus
      note: Nabi meratapi dia pada hari kematiannya dan mendoakan doa yang tidak hadir untuknya.
    adhkuru_mahasin:
      title: '"Ingatlah kebajikan para tiada"'
      note: Asal-usul elegi yang diperbolehkan dan pujian masyarakat terhadap pemakaman.
  viz:
    title: Empat Panji
    note: 'Empat spanduk dengan tepi hitam, setiap jenis rekaman memiliki spanduk: elegi, obituari, belasungkawa, tangisan, dan ratapan, masing-masing berisi jumlah catatannya, sebuah pita yang menunjukkan
      lokasi mereka di sumber, dan tiga catatan untuk pembukaan. Totalnya di sini: {n} catatan, semuanya ada dalam daftar di bawah ini. Jenis catatan dari detektor dan catatan terpilih bukan dari yurisdiksi
      museum.'
    region: Distribusi catatan obituari dan obituari berdasarkan jenis dan bagian
    col_kind: Tipe
juha:
  title: Juha Browser dan Folklor Islam
  full_title: Juha Browser dan Folklor Islam Sepanjang Zaman, Komedi, Lelucon, Lelucon, dan Kelangkaan
  lede: 'Segala sesuatu yang dimiliki museum tentang Juha dan cerita rakyat Islam sepanjang zaman, komedi, lelucon, anekdot, dan anekdot: ayat-ayat tawa, senyuman, dan larangan ejekan dalam Al-Quran, lelucon
    tentang Nabi dan tawanya, batasan lelucon dalam Sunnah, lelucon para sahabat dan pengikut dalam biografi dan biografi, anekdot Yuhu satu per satu, serta kisah orang cerdas, bodoh, pelit, dan lumpuh
    dalam buku-buku sastra dan sejarah.'
  badge: Dewan Barang Langka
  status: Dalam struktur ini, {n} dicatat dalam bagian-bagian tertentu; teks-teks tersebut adalah draf yang diverifikasi pembaca dari sumber yang disebutkan.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan biasa dari catatan museum dengan sumber dan teksnya dalam lima bahasa. Bagian-bagian tersebut ditangkap selama konstruksi oleh detektor presisi yang
    membaca teks bacaan: nama Juha adalah kata independen, nama-nama tokoh terkenal yang cerdas seperti Ash''ab, Nu''ayman, Muzbad, dan Habanqa, kata-kata anekdot, anekdot, humor, lelucon, dan kata-kata
    humor, kata-kata tawa dan senyum, serta teks sastra lelucon. Kelangkaan jurisprudensi, buku ''Anekdot dan Tambahan,'' sekejap mata, nama Al-Dahhak, Ibn Mughaffal, serta keadaan waktu dan tempat dikecualikan.
    Setiap buku yang dipanen kemudian secara otomatis masuk ke bagiannya di sini saat mencapai jaringan, dan catatan yang direkam digabungkan dengan nama juha-browser. Anekdot Juha dinarasikan dengan frasa
    museum tentang versi yang dapat dibaca mesin, dan terjemahannya otomatis dan tidak ditinjau oleh manusia.'
