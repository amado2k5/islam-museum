      desc: 'Moral dan perlakuan Nabi, para sahabat, dan para pengikut dalam Sahih, Al-Muwatta, dan Sunan: "Aku diutus untuk menyempurnakan moral mulia," "Seorang Muslim adalah orang yang lidah dan tangan
        Muslim aman," "Ayat munafik adalah tiga," hadis kebenaran, menjaga ikatan, tetangga, dan nasihat, Kitab Penjualan, Etiket, Hipotek, wasiat, kesaksian, dan penilaian adalah di antara tuntutan, serta
        setiap laporan yang mengutip, mengajarkan, atau membahas tuntutan tersebut.'
    seerah:
      title: Dalam biografi
      desc: Etika dan transaksi yang terkandung dalam buku biografi dan sejarah—dari transaksi Mekah hingga pasar Madinah, janji Nabi, dan perjanjiannya—mengisi bagian ini dengan isi yang sama setiap kali
        teks biografi baru diterbitkan.
    books:
      title: Dalam buku lain
      desc: Moral dan transaksi dalam setiap karya yang terjadi kecuali Al-Qur'an, Hadis, dan biografi—buku sastra, fiqh, sastra, sejarah, puisi, dan lainnya—diklasifikasikan berdasarkan jenis karya pada
        hari bagian-bagiannya dibuang.
