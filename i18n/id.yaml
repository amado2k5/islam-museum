        orang tua, berbohong, pengkhianatan, kesombongan, mengkritik, kepelit, iri hati, ketidakadilan, ketidakpatuhan, kontrak, penjualan, riba, utang, hipotek, sewa, surat wasiat, warisan, pernikahan,
