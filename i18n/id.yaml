sport:
  title: Olahraga dan Kompetisi Browser dalam Islam
  lede: 'Olahraga dan kompetisi dalam sumber museum: berkuda, berenang, panahan — tiga yang disebutkan dalam laporan pelatihan — gulat, kekuatan, balap, pembuatan, permainan Abyssinia dengan tombak, permainan
    bola dan meja, berburu sebagai olahraga, dan olahraga modern — dalam Al-Quran, Sahih, Muwatta, Sunan, buku biografi, tradisi Para Pendamping dan Pengikut, dan setiap buku yang tercatat — catatan dengan
    sumbernya terus berkembang dengan setiap teks yang terungkap.'
  trio_label: 'Tiga Nabi: Berkuda, Renang, dan Memanah'
  badge: Browser Olahraga
  status: Salinan {n} ini berisi catatan dalam bagian {s}; dan teksnya adalah draf agar manusia dapat membacanya.
  method_title: Cara kerja browser ini
  method_note: 'Setiap catatan di sini adalah catatan museum biasa beserta sumbernya. Kenangan olahraga dari masa pembangunan ditemukan dalam kamus yang dijaga berdasarkan teks suku kata dalam delapan keluarga:
    kuda dan keahlian berkuda, panahan, renang, gulat dan kekuatan, pacuan dan permainan, permainan dan permainan, berburu sebagai olahraga, dan olahraga modern. Kata-kata ambigu dijaga: ''Sabq'' hanya
    dihitung bersama dengan kata ''balapan,'' ''dikatakan'' di samping kata ''berburu,'' ''rammi'' di samping kata ''noble'' dan ''crossbow'' (pelampaian Jamarat dikecualikan), ''yasbih'' di samping kata
    air, ''sa''a'' di samping kata gulat, dan positif palsu yang dikonfirmasi dikecualikan berdasarkan nama. Setiap buku yang dikumpulkan kemudian secara otomatis memasukkan kenangan olahraga di sini; yang
    disebut olahraga adalah catatan independen dari kategori olahraga; dan atlet dibaca dari kategori orang dalam blok olahraga.'
  api: Koleksi lengkapnya tersedia di
  sections_title: Bagian Browser
  sports_title: Olahraga yang dinamakan
  sports_desc: 'Olahraga dan kompetisi tiruan adalah catatan independen: Tiga Ramalan, gulat, balap, permainan tombak, anggar, pentungan, permainan bola dan meja, lempar batu, berburu, lapangan tembak Ottoman,
    dan permainan modern.'
  athletes_title: Atlet Terdaftar
  athletes_desc: 'Angka Grafik Museum yang Bermain Olahraga: Setiap rekaman memuat blok olahraga yang terdokumentasi, dibaca dari gambar itu sendiri.'
