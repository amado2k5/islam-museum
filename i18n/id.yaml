      desc: 'Ayat-ayat penyembuhan, penyakit, dan penciptaan: "Di dalamnya adalah penyembuhan bagi manusia" dalam madu, "Dan ketika kamu jatuh sakit, itulah penyembuhan," dan orang sakit diizinkan dalam
        puasa, penyucian, ziarah, dan jihad, serta penyembuhan orang buta dan kusta, serta tahap penciptaan manusia dari setetes sperma, gumpalan gumpalan, kemudian tulang, vena jugular, tendon, tanah,
        dan jaringan.'
    sunnah:
      title: Per tahun
      desc: 'Hadits dari Kitab Pengobatan dan Kitab Orang Sakit dalam Sahihayn, Sunan, dan Muwatta: "Untuk setiap penyakit ada obatnya," cupping, madu, kauterisasi, biji hitam, qist, talbinah, truffle,
        Ajwa, Ruqyah, demam, wabah, infeksi, kusta, mengunjungi orang sakit, merawat yang terluka, dan melarang pengobatan selama masa terlarang.'
    seerah:
      title: Dalam biografi
      desc: 'Apa yang tercantum dalam buku biografi dan bukti: Bab tentang Pengobatan Nabi dalam Penyediaan Masa Depan oleh Ibn al-Qayyim, Laporan Penyakit Nabi, Pembelahan Dada, Domba Beracun di Khaybar,
        dan Menyembuhkan yang Terluka dalam Ekspedisi — bagian ini selalu penuh setiap kali teks baru dari biografi Nabi dikumpulkan.'
    books:
      title: Dalam buku lain
      desc: 'Para Sahabat dan Pengikut dalam Pengobatan, Penyakit, dan Klinik di Al-Hilya wa Al-Isabah, Asd al-Ghabah, Al-Isti''ab, dan Deskripsi Elit, serta teks-teks buku kedokteran: Kanon oleh Ibn Sina,
        Al-Hawi oleh Al-Razi, penjelasan anatomi Kanon oleh Ibn al-Nafis, dan apa yang ditemukan dalam buku sejarah, yurisprudensi, sastra, dan tafsiran — diklasifikasikan berdasarkan jenis buku pada hari
        bagian-bagiannya dimasukkan.'
    curated:
      title: Catatan medis di museum
      desc: 'Catatan terpilih museum tentang kedokteran itu sendiri: Pengobatan profetik dan obat-obatannya, dokter dari Al-Harith ibn Kalda dan Rufaida Al-Aslamiya hingga Al-Razi, Ibn Sina, Al-Zahrawi,
        Ibn Al-Nafis, rumah sakit medis, buku medis, anatomi dan bedah, obat-obatan, wabah, serta aturan dan fatwa pengobatan.'
