tibb:
  title: Browser Kedokteran, Kedokteran, Anatomi, Bedah, Kedokteran, dan Penyembuhan dalam Islam
  lede: 'Segala sesuatu yang disebutkan dan ditulis tentang pengobatan kenabian, kedokteran, anatomi, bedah, pengobatan, dan pengobatan dalam sumber museum: ayat-ayat penyembuhan dan penyakit, tahapan penciptaan
    manusia dalam Al-Qur''an, hadits dari Kitab Kedokteran, Kitab Orang Sakit dalam Sahihayn, Sunan, dan Muwatta, bab-bab kedokteran kenabian tentang penyediaan akhirat, laporan para Sahabat dan Pengikut
    tentang perawatan, penyembuhan yang terluka, dan kunjungan ke orang sakit, teks kanon oleh Ibn Sina dan Al-Hawi oleh Al-Razi, penjelasan anatomi hukum oleh Ibn al-Nafis, catatan dokter, rumah sakit,
    buku kedokteran, obat-obatan, dan keputusan — catatan yang mendokumentasikan yang berkembang seiring dengan panen teks-teks baru.'
  badge: Penjelajah Obat dalam Islam
  status: Dalam struktur ini, {n} dicatat dalam bagian {s}; teks adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumber dan prosa dalam tujuh bahasa. Teks medis ditemukan pada saat pembuatan dalam kamus yang dilindungi berdasarkan teks bagian
    yang dibagi menjadi enam bab: Pengobatan profetik — bek, kauterisasi, ruqyah, madu, biji hitam, qist, senna, talbinah, truffle, ajwa, ithamad, al-ladud, dan s''ut; kedokteran — dokter, penyakit dan
    pasien, nyeri, demam, wabah dan epidemi, infeksi, kusta, nama penyakit, klinik pasien, rumah sakit; anatomi — sperma, lintah, dan embrio, vena, tendon, aorta, kohl, sendi, faring, organ; bedah — penyembuhan
    luka, ketegasan, flebitis, sunat, bidai, perbaikan patah tulang; pengobatan — obat dan penyakit, racun dan penawar, obat; dan pengobatan — penyembuhan, penyembuhan, penyembuhan, dan penyembuhan dengan
    hal-hal terlarang. Kata-kata ambigu diawasi: "Di hati mereka ada penyakit" dikecualikan, "demam" hanya dianggap bersama dengan kata demam, bukan demam, "qist" dalam senyawa obat bukan keadilan, "madu"
    dan "ajwa" di samping istilah medis, "racun penjahit" dikecualikan, "adwi" yang berarti musuh dikecualikan, dan kata "jarrah" hanya dihitung dengan pengobatan, bukan dengan uang darah. Dalam buku selain
    Al-Qur''an dan Hadis, kata "penyakit" atau "penyembuhan" saja tidak cukup. Setiap buku yang dipanen kemudian secara otomatis membawa teks medisnya ke sini pada hari bagiannya masuk ke undian; catatan
    terpilih dimasukkan dengan label tibb-browser yang pintunya diberi tanda. Museum menjelaskan apa yang ada dalam sumber dan mengaitkannya dengan pemiliknya, dan tidak memberikan nasihat medis atau fatwa.'
