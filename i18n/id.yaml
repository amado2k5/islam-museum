umam:
  also_under: 'Dan juga dalam:'
  title: Browser Bangsa, Agama, Sekte, dan Bangsa Non-Muslim
  lede: 'Sebuah penjelajah bangsa, agama, sekte, dan bangsa non-Muslim yang disebutkan dalam Al-Qur''an, Hadis, serta karya dan kitab Para Sahabat dan Pengikut: bangsa-bangsa yang punah dari ''Ad dan Thamud
    hingga bangsa Tubba, Orang-orang Kitab, Majus, Sabian, politeis Arab, raja dan manusia bumi, bangsa-bangsa jauh, dan setiap ayat, laporan, dan riwayat yang saya sebutkan — dengan setiap penyebutan sumbernya.'
  badge: Penjelajah Bangsa dan Bangsa
  status: Struktur ini mencakup {n} sebuah catatan dalam {s} bagian; teks disusun agar manusia dapat meninjaunya.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — terdokumentasi dan trilingual — tanpa meja samping. Catatan yang dipilih membawa tag umam-browser dan tag um-<bagian>, dan setiap karya,
    kutipan, atau pertanyaan yang memiliki hubungan "peringatan" dengan anggota browser masuk ke bagian "Sebutan dalam Sumber" dan bagian targetnya, dan kamus yang dijaga membaca teks bagian dan hanya memilih
    nama yang sudah mapan — buku masa depan muncul secara otomatis di sini pada hari hubungannya ditulis. Teks Al-Quran tidak pernah dibaca dalam kamus; ayat-ayatnya hanya disertai dengan hubungan revisi
    "sebutan".
  api: Dataset lengkap di
  sections_title: Bagian Browser
  filter_label: Nominasi rekor
  filter_none: Tidak ada hasil yang cocok.
  empty: Belum ada catatan dalam konstruksi ini.
  mentioned_title: Negara-negara yang paling banyak dikutip dalam sumber
  mentioned_in: 'Disebutkan dalam:'
  timeline_title: Tentang garis waktu
  timeline_caption: 'Catatan bertanggal: {n} · Tidak ada tanggal: {u}'
  sections:
    umam:
      title: Negara potong
      desc: 'Bangsa-bangsa yang telah diceritakan dan dihancurkan oleh Al-Qur''an: ''Aad, Thamud, Saba, umat Nuh, umat Lot, umat Shu''ayb, sahabat Ar-Rass, parit, desa, umat Tubba, Firaun, dan umatnya—setiap
        bangsa dengan tanda dan kabarnya.'
    adyan:
      title: Agama
      desc: 'Sekte-sekte yang disebut oleh Al-Qur''an dan Hadis: Yahudi, Kristen, Majus, dan Sabian — orang-orang agama yang memiliki perjanjian dan perang dengan Islam.'
    tawaif:
      title: Komunitas dan Suku
      desc: 'Sekte-sekte dalam agama dan suku Arab, beberapa di antaranya menganut agama selain Islam: Banu Qaynuqa, Al-Nadir, Quraiza, Yahudi Khaybar, Kristen Najran, Ghassan, dan Lakhm—seperti yang disebut
        dalam buku.'
    shuub:
      title: Bangsa dan Bangsa
      desc: 'Orang-orang di tanah jauh dan dekat yang disebutkan dalam sumber-sumber adalah: Romawi, Persia, Abyssinia, Koptik, Turki, India, Cina, Berber, Zanj, Slavia, Rusia, dan Nabataean—penduduk kerajaan
        dan provinsi.'
    mushrikun:
      title: Politeis Arab
      desc: 'Paganisme orang Arab sebelum Islam: orang-orang Mekah, Quraisy, dan mereka yang mengikuti agama, berhala mereka, ibadah, dan apa tujuan mereka sampai penaklukan — kategori terpisah karena mereka
        bukan Umat Kitab atau sekte lain.'
    ayan:
      title: Tokoh Terkenal dan Tokoh Pribadi
      desc: 'Orang-orang yang disebutkan oleh sumber-sumber dari bangsa-bangsa ini adalah: Heraclius, Khosrow, Al-Najashi, Al-Muwaqq, Al-Mundhir ibn Sawa, para rabbi Yahudi di Madinah, pemimpin politeis
        Quraisy, dan mereka yang menganut agama lain sebelum Islam.'
    sukun:
      title: Perumahan dan Perumahan
      desc: 'Tanah dan tempat di mana bangsa-bangsa ini didirikan: Najran, Khaybar, Al-Hirah, Bosra, Yathrib, Al-Ahqaf, dan Petra — masing-masing tempat dinarasikan dengan narasi tersendiri.'
    mafahim:
      title: Konsep
      desc: 'Kosakata sumber tentang bangsa-bangsa ini: Orang-orang Kitab, Rakyat Dhimmi, Jizya, Politeisme, Ketidakpercayaan, Kemunafikan, Cendekiawan Yang Jujur, dan Ummah — makna-makna yang digunakan
        untuk mengklasifikasikan hubungan tersebut.'
    kutub:
      title: Buku dan Sumber
      desc: 'Karya-karya yang melestarikan berita dari bangsa-bangsa ini: tafsir, kumpulan otentik, biografi, kampanye, sejarah, penaklukan, dan buku-buku sekte serta kredo — masing-masing buku dalam kapasitasnya
        sendiri.'
    dhikr:
      title: Penyebutan dalam Sumber
      desc: Setiap ayat, kutipan, tindakan, peristiwa, dan pertanyaan di museum menyebutkan sebuah bangsa, agama, sekte, atau orang-orang yang bukan Muslim — di sini terkait dengan 'disebutkan' atau dengan
        nama yang didefinisikan dalam teks, beserta bagian-bagian yang ditujukan untuknya.
  viz:
    caption: 'Peta dunia teks: Mekah dan Madinah di jantung, Romawi di barat laut dan Persia di timur laut, Abyssinia di barat daya, Orang-orang Kitab di tengah peta, bangsa-bangsa punah di bawah cakrawala,
      dan bangsa-bangsa jauh di pinggiran. Setiap titik adalah catatan nyata dan tautan nyata.'
