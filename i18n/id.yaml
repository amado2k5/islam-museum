  title: Browser Etika dan Transaksi
  lede: 'Setiap penyebutan etika dan transaksi dalam sumber museum: kebajikan Al-Qur''an—mulai dari kejujuran, kepercayaan, keadilan, dan kebaikan hingga menghormati orang tua dan menjaga ikatan keluarga;
    keburukan seperti kebohongan, pengkhianatan, kesombongan, fitnah, dan ketidakadilan; hadits "Aku dikirim hanya untuk menyempurnakan moral mulia" dan "Seorang Muslim adalah orang yang aman bagi Muslim,"
    serta urusan orang mulai dari penjualan, riba, utang, dan gadai mata hingga pernikahan dan perceraian, sumpah, kesaksian, pengadilan, dan penimbangan — setiap laporan tentang Para Sahabat dan Pengikut,
    biografi dan setiap buku yang diperoleh memuat catatan terdokumentasi yang terus berkembang seiring dengan penerbitan teks-teks baru.'
  badge: Penjelajah Etika dan Transaksi
  status: Struktur ini berisi {n} sebuah catatan dalam {s} bagian; teks adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap rekaman di sini adalah catatan museum biasa — dengan prosa dan frasa trilingualnya. Moral dan transaksi selama pembangunan ditemukan dalam kamus yang dijaga oleh teks-teks bagian:
    kata-kata kebajikan (kejujuran, kepercayaan, kesetiaan, kesabaran, rasa syukur, kerendahan hati, kebaikan, kerendahan hati, kesabaran, ketulusan, pertobatan, kemurahan hati, kebenaran, menjaga ikatan
    keluarga, tetangga, nasihat, menahan diri dari bahaya, ketelitian, belas kasihan, keadilan, dan kepuasan); ketentuan keburukan (kebohongan, pengkhianatan, kesombongan, kemunafikan, iri, pelit, fitnah,
    gosip, kecabulan, penghinaan, kemarahan, ketidakadilan, ketidakpatuhan, kemunafikan, dan penipuan); serta ketentuan transaksi (penjualan, perdagangan, riba, utang, pinjaman, hipotek, sewa, wasiat, warisan,
    pernikahan, mas kawin, dan menyusui). Perceraian, khul'', ''iddah'' (masa tunggu), pemeliharaan, hak asuh, sumpah, penebusan, kesaksian, bukti, peradilan, keseimbangan, ukuran, mitigasi, rekonsiliasi,
    hadiah, jaminan, jaminan, agensi, kemitraan, pinjaman, mudarabah, pertanian, muasaqah, salam, istisna'', transfer (transfer), pinjaman, deposit, pengambilalihan, perampasan, pencurian, preemption, monopoli,
    paksaan, ketidakmampuan, dan kontrak; sumpah setia dikecualikan, ''riba'' berarti pertumbuhan di luar transaksi, ''memerintah'' berarti kebijaksanaan, ''kesaksian'' berarti kesaksian Allah atau saksi,
    ''hadiah'' berarti hadiah, ''qasm'' berarti berbagi, dan ibadah yang diberikan kepada mereka yang membaca Kedua saudara (ibadah dan permohonan), kecuali positif palsu yang didokumentasikan oleh pengenal,
    dan setiap buku yang terjadi kemudian secara otomatis disebutkan di sini ketika bagiannya muncul dalam grafik; catatan terpilih ditambahkan melalui tag akhlaq-browser. Setiap bagian mengajarkan kursusnya
    (etika/transaksi), jenisnya (kebajikan/keburukan/perlakuan/sebutan), dan topiknya.'
