janna:
  badge: Penjelajah Surga
  status: Struktur {n} ini berisi catatan dalam bagian {s}; dan teks-teksnya disusun agar manusia dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumber dan prosa dalam tujuh bahasa. Kenangan ditemukan pada saat pembuatan dalam kamus yang dijaga berdasarkan teks bagian-bagian:
    nama eksplisit dihitung langsung, nama "Paradise/Jannat/Janan" hanya dihitung bersama petunjuk dunia lain sehingga kebun buah dunia ini tetap berada di luar, teks "Fasting is Paradise" tersembunyi,
    keluarga "Jinn" dikecualikan oleh huruf, dan positif palsu yang dicapai dikecualikan oleh definite. Setiap buku yang dipanen kemudian secara otomatis membawa ingatannya ke sini; catatan terpilih diberi
    label janna-browser. Setiap bagian diberi tanda "deskripsi" jika itu adalah gambar surga dan "disebutkan" jika diberi nama.'
  api: Seluruh koleksi tersedia di
  sections_title: Bagian Browser
  filter_label: Heaven Records Row
  filter_none: Tidak ada hasil.
  empty: Belum ada catatan surga di gedung ini.
  kinds:
    description: Deskripsi — Menggambarkan Surga
    mention: Laki-laki — dia menyebutnya
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: 'Setiap penyebutan tentang Surga dalam Al-Qur''an adalah: Surga, taman Eden, Taman kebahagiaan, Surga abadi, Taman perlindungan, tempat kedamaian, sungai dan buahnya, pasangan yang telah disucikan,
        kamar-kamar, dan pohon yang diberkati.'
    sunnah:
      title: Per tahun
      desc: 'Hadits dari dua Sahih, Al-Muwatta, Al-Arba''in, dan Sunan: delapan bab, bab Al-Rayyan, debu musk, pangkat terendah dari umat Surga, kelompok pertama yang masuk, houri dan sungai, serta setiap
        hadis yang menggambarkan atau menamai Surga.'
    seerah:
      title: Dalam biografi
      desc: Setiap penyebutan Surga dalam buku-buku biografi—kabar gembira para martir, penglihatan, dan jejak dalam biografinya—setiap kali bagian-bagiannya dipanen.
    books:
      title: Dalam buku-buku yang dipanen
      desc: Setiap penyebutan komite dalam semua karya yang dipanen—dalam interpretasi, sejarah, sastra, dan puisi—secara otomatis dimasukkan pada hari bagian-bagian tersebut diungkapkan.
    curated:
      title: Rekor terpilih
      desc: Catatan museum tentang surga — nama-namanya, gerbangnya, sungai, tanah, tangga, dan orang-orangnya — dimasukkan di bawah bendera janna-browser.
  viz:
    title: Al-Daran Surah Surah Surah
    stats_label: Distribusi surah yang berjumlah {n} menurut browser yang berisi ayatnya
    s_both: Di browser bersama-sama
    s_j: Hanya di surga
    s_n: Hanya di api
    s_none: Tidak di keduanya
    legend_title: Cara membaca gambar
    j_name: Surga
    n_name: Kebakaran
    legend_up: di atas sumbu
    legend_down: subaksial
    legend_tie: 'Nomor surah dengan latar emas: Berisi ayat-ayat bagi yang suka membaca'
    toggle: Tampilkan kedua sisi dalam warna penuh
    n_ayahs: 'Ayat: {n}'
    none: Tidak ada bait yang direkam
    hint: Arahkan kursor ke surah, fokuskan pada surah itu, atau sentuh untuk membacanya di sini; ketuk kolom lagi untuk membuka ayat pertama di dalamnya.
    caption: 'Metode membaca: Setiap kolom menghitung ayat-ayat yang ditemukan dan dicatat di browser tersebut, berfungsi sebagai alat bantu membaca, bukan menghitung Al-Qur''an itu sendiri. Apa itu api
      dunia ini tidak dihitung dalam Api, karena browser memiliki rak terpisah sendiri. Kolom membuka ayat pertama yang dihitung.'
    note: Surah Al-Qur'an sesuai urutan Mushaf. Di atas nomor setiap surah terdapat kolom untuk jumlah ayatnya dalam penjelajah Surga, dan di bawahnya terdapat kolom untuk jumlah ayatnya di Penjelajah Neraka.
      Sisi Surga di sini berwarna penuh, dan sisi Neraka hanya ditandai dengan garis karena kedua sisi dibacakan bersamaan; nomor surah dibedakan dengan latar belakang emas jika berisi ayat-ayat dalam penjelajah
      tersebut.
    open_other: Buka Fire Browser
  title: Paradise Browser
  lede: 'Segala sesuatu yang disebutkan dan dijelaskan tentang Surga dalam sumber museum: nama-nama dan deskripsinya dalam Al-Qur''an, hadits tentang gerbangnya, sungai, tanah, derajat dan orang-orangnya,
    apa yang ditemukan dalam buku biografi dan sejarah, jejak Para Sahabat dan Pengikut, dan setiap penyebutan dalam setiap kitab dihitung — catatan dengan sumbernya yang berkembang dengan teks-teks baru
    saat teks baru masuk.'
qiyama:
  viz:
    title: Hari terakhir dalam urutan penurunan
    note: Tiga strip, setiap jenis bagian yang dikenal oleh penjelajah ini memiliki pita yang membentang sepanjang surah sesuai urutan pengungkapan. Sebuah titik muncul di tempat surah berisi ayat-ayat
      jenis tersebut, dan semakin besar titiknya, semakin banyak ayat yang tercatat di dalamnya, sehingga lebih mudah melihat di mana setiap topik diungkapkan. Strip bawah diwarnai dengan lokasi setiap
      surah sesuai catatannya.
