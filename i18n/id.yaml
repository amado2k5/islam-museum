halal:
  title: Browser Halal dan Haram
  lede: 'Setiap penyebutan halal dan haram dalam sumber museum: ayat-ayat tentang izin dan larangan dalam sapi, meja, ternak, unta, A''raf, dan lebah; hadits "Yang sah jelas dan yang tidak sah jelas," "Setiap
    hal yang memabukkan dilarang," dan "Tidak sah bagi seorang Muslim" dalam Sahih, Muwatta, dan Sunan; biografi dan laporan Para Sahabat dan Pengikut mengenai penolakan terhadap yang dilarang dan mencari
    yang diperbolehkan; pendapat para ahli hukum tentang apa yang diperbolehkan dan apa yang dilarang; serta setiap penyebutan dalam sebuah buku yang mulai hari ini tercantum. Museum menggambarkan apa yang
    ada dalam sumber dan mengaitkan setiap pendapat kepada pemiliknya, tanpa mengeluarkan fatwa.'
  badge: Penjelajah Halal dan Haram
  status: Struktur ini berisi {n} sebuah catatan dalam {s} bagian; teks adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa — dengan sumber dan prosa tribahasanya. Kenangan ditemukan saat disusun dalam kamus yang terjaga pada teks bagian-bagian: "halal" dan "haram"
    dalam bentuknya, kata kerja penggantian dengan pelakunya atau yang mengizinkannya ("ahal Allah" ("Ahal Allah" bagimu, "la ihral limaru''"), kata kerja larangan bersama pelakunya atau yang dilarang baginya
    ("haram Allah" ("haram Allah" atau "haramat ''alaykum"), "tahrim" (terlarang), "hal-hal terlarang" (dilarang bagimu), "hal-hal terlarang (dilarang bagimu"), "hal-hal terlarang (dilarang bagimu"), "hal-hal
    terlarang (muharramat al-mala"), "mahramat al-makruh" (dilarang bagimu"), "terlarang bagimu"—hanya dihitung di samping kata yang kuat. Sebelum verifikasi, ia mengecualikan apa yang tidak termasuk dalam
    bab: ''Masjid Suci,'' ''Rumah Suci,'' ''bulan suci,'' kata benda ''haram,'' keadaan ihram dan pembebasan darinya, serta ''Tuhan melarangnya dibakar.'' Setiap buku yang terbit kemudian memiliki ingatan
    di sini pada hari bagian-bagiannya diterbitkan, tanpa langkah atau penandaan. Ketidaksepakatan yurisprudensial disajikan dengan pernyataan yang dikaitkan dengan penulisnya, dan museum tidak mendukungnya.'
  api: Koleksi lengkapnya tersedia di
  sections_title: Bagian Browser
  filter_label: Gambarkan kenangan tentang halal dan haram
  filter_none: Tidak ada hasil yang cocok.
  empty: Belum ada catatan halal atau haram dalam konstruksi ini.
  kinds:
    halal: Halal
    haram: terlarang
    both: Halal dan haram bersamaan
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: 'Ayat-ayat Izin dan Larangan: Apa yang dilarang dari restoran seperti sapi, meja, ternak, dan lebah; apa yang diperbolehkan dari hal-hal baik, makanan dari Umat Kitab, memancing di laut, wanita
        yang dilarang dalam Surah An-Nisa; larangan riba dan kebejatan; larangan apa yang Allah izinkan dan larangan mengatakan ''ini sah dan ini tidak sah'' tanpa pengetahuan.'
    sunnah:
      title: Per tahun
      desc: 'Hadits dua Sahih, Al-Muwatta, dan Sunan, beserta tradisi para Sahabat dan Pengikut dalam penulis dan kitab-kitab asketisme: "Yang sah jelas dan yang tidak sah jelas, dan ada keraguan di antara
        mereka," "Setiap hal yang memabukkan dilarang," "Dua hewan mati dan berdarah telah disahkan untuk kita," larangan sutra dan emas bagi pria, apa yang dilarang menyusui, dan "Setiap Muslim dilarang
        bagi Muslim lain."'
    seerah:
      title: Dalam biografi
      desc: 'Apa yang terkandung dalam buku-buku biografi, kampanye, dan bukti yang menyebutkan apa yang sah dan tidak sah: khotbah Ziarah Perpisahan tentang kesucian darah dan kekayaan, larangan alkohol
        dan keledai domestik pada hari Khaybar, larangan Mekah pada hari penaklukan, serta putusan tentang rampasan perang dan apa yang diperbolehkan — bagian ini mengisi bagian yang sama setiap kali teks
        biografi baru diterbitkan.'
    books:
      title: Dalam buku lain
      desc: 'Referensi tentang apa yang sah dan tidak sah dalam setiap karya yang terjadi kecuali Al-Qur''an, Hadis, dan biografi: biografi Para Sahabat dan Pengikut serta laporan kesalehan mereka dalam
        Al-Hilyah, deskripsi tentang elit dan kehidupan Para Sahabat, buku fiksi — Al-Mughni, Al-Mudawwana, Bidayat al-Mujtahid, Fiqh al-Sunnah, dan Ensiklopedia Firisprudensial — Ihya, Al-Muwafaqat, dan
        Tafsir, serta berikut diklasifikasikan berdasarkan jenis karya pada hari segmen-segmennya dipisahkan.'
    curated:
      title: Catatan tentang apa yang halal dan haram
      desc: 'Catatan museum rinci tentang topik yang sama: sah, tidak sah, dan diragukan, asal usul diperbolehkan, hak atas izin dan larangan, baik dan jahat, restoran dan minuman terlarang, kebutuhan,
        kesalehan, penghasilan yang sah, dan kisah para Sahabat dan Pengikut dalam mencari apa yang sah.'
  subjects_ui:
    title: Telusuri berdasarkan topik
    note: Pilih apa yang ingin Anda tanyakan. Setiap topik dimulai dengan catatan museum dan ayat-ayat Al-Quran, lalu hadits, biografi, dan buku-buku lainnya. Museum menyajikan apa yang dikatakan sumber
      dan tempatnya, tanpa mengeluarkan penilaian; penilaian dalam kasus tertentu adalah karya para sarjana, bukan museum.
    region: Dua belas topik halal dan haram, dengan jumlah catatan untuk setiap topik dan berapa banyak yang menyebutkan halal, haram, atau keduanya.
    count: 'Log: {n}'
    bar: '{h} Penyebutan yang sah, {b} keduanya, {r} yang tidak sah'
    all: Semua topik
    crumb: Topik
    status: 'Jumlah catatan di bawah topik ini {n}: catatan rinci {c}, ayat {q}, hadis dan tradisi {s}, kutipan biografi {r}, kutipan dari buku lain {b}.'
    how_title: Bagaimana catatan tersebut dikaitkan dengan subjeknya?
    how: 'Topik diberikan saat membangun situs berdasarkan daftar istilah yang dibaca di setiap bagian: istilah untuk makanan, minuman, penjualan, pernikahan, dan lainnya. Sebuah bagian dapat termasuk dalam
      lebih dari satu topik. Daftar dapat melewatkan satu bagian atau masuk ke segmen di mana kata tersebut muncul secara kebetulan; dan apa pun yang tidak sesuai dengan kata dalam istilah subjek berada
      di bawah "Tempat Lain." Subjek adalah pernyataan tentang apa yang dimaksud sumber, bukan penilaian.'
    row: Topik
    other_subjects: Topik lain
  subjects:
    principles:
      title: Aset
      desc: Siapa pun yang memiliki izin dan larangan, yang jelas dan ambigu, keharusan, dan apa yang disebutkan tentang larangan atas apa yang Allah izinkan.
    food:
      title: Makanan
      desc: Bangkai, darah, babi, dan apa pun yang layak untuk siapa pun selain Allah, semuanya dengan taring, keledai domestik, dan hal-hal baik yang disebutkan dalam sumber sebagai diperbolehkan.
    drink:
      title: Minuman
      desc: Alkohol dan semua zat memabukkan, serta anggur dan wadahnya.
    hunting-slaughter:
      title: Berburu dan penyembelihan
      desc: Berburu di darat dan laut, anjing terlatih, pengorbanan Umat Kitab, pengorbanan, dan berburu di Muharram.
    earnings:
      title: Keuntungan dan Penjualan
      desc: Riba, penjualan terlarang, suap, harga mahram, properti yatim piatu, yang diperoleh dari penghasilan yang sah.
    marriage-family:
      title: Pernikahan dan Keluarga
      desc: Larangan di kalangan wanita, menyusui, perceraian, rekonsiliasi, pernikahan terlarang, dan berkabung.
    dress:
      title: Pakaian dan Perhiasan
      desc: Sutra, emas, cincin, pakaian, wadah emas dan perak, dan mengubah bentuknya.
    life-honour:
      title: Darah, uang, dan gejala
      desc: Kesucian darah, harta, dan kehormatan seorang Muslim, serta kehidupan yang telah dilarang Allah.
    conduct:
      title: Pidato dan Perilaku
      desc: 'Meninggalkan saudara karena tiga tahun: fitnah, ketidakadilan, selingkuh, fasilitasi, cimawan, dan ramalan.'
    worship:
      title: Tindakan ibadah dan sumpah
      desc: Amal dan mereka yang dihukum, berpuasa, memasuki Ihram dan apa yang dilarangnya, sumpah dan sumpah.
    sanctuary:
      title: Kesucian Mekah dan Madinah
      desc: 'Al-Akhbar mengenai larangan Mekah dan Madinah: perburuan mereka, pohon-pohon mereka, dan pengumpulan mereka.'
    other:
      title: Tempat Lain
      desc: Bagian-bagian yang menyebutkan apa yang halal atau haram tetapi teksnya tidak sesuai dengan kata-kata dalam topik tersebut.
  viz:
    title: Keseimbangan antara halal dan haram seperti yang disebut sumber
    note: Ini adalah bagian-bagian dalam sumber museum di mana kata-kata ini muncul, dan tidak ada apa-apa selain itu. Pita tersebut mewakili jumlah bagian yang hanya menyebutkan apa yang sah, dan hanya
      menyebutkan yang terlarang, yang menggabungkannya. Dua panel menampilkan kata-kata kamus yang dicocokkan dengan Al-Kashif di setiap sisi, dan jumlah bagian untuk setiap kata dalam Al-Quran, Sunnah,
      Nabi, dan kitab-kitab lainnya. Satu bagian dipertimbangkan di bawah setiap kata yang dimuatkan.
