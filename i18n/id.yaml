bunuwwa:
  title: Browser Anak-anak dalam Islam
  lede: 'Segala sesuatu yang disebutkan tentang keputraan—putra, putri, putra, dan keturunan—termasuk dalam sumber museum: putra-putra dan putri para nabi, sahabat, dan putri mereka, yang menghormati dan
    membangkang orang tua, anak yatim, menyusui, menyapih, hak anak seperti hak asuh, ''aqiqah, dan warisan, kisah putra dan putri dalam Al-Qur''an, dua Sahih, Muwatta, Sunnah, biografi, jejak para Sahabat
    dan Pengikut, serta setiap buku yang tercatat—catatan dengan sumbernya bertambah seiring masuknya teks-teks baru.'
  badge: Sonny Explorer
  status: Struktur {n} ini berisi catatan dalam bagian {s}; dan teks-teksnya disusun agar manusia dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumber dan prosa dalam tujuh bahasa. Kenangan tentang keputraan pada masa pembangunan ditemukan dalam sebuah kamus yang dijaga oleh
    teks bagian-bagian dalam enam keluarga: putra dan putri (putra, putri, putra, putrinya, putra, perempuan, mawudah), keturunan (keturunan, keturunan, keturunan, Israel, anak-anak Adam), menghormati orang
    tua dan ketidaktaatan (orang tua, menghormati orang tua, ketidakpatuhan, jangan berkata kepada mereka uff, turunkan sayap penghinaan), anak yatim dan perawat (yatim piatu, anak yatim, perawat perawat,
    penyapihan, penyapih, kehamilan), hak anak (hak asuh, aqeeqah, tahnik, penamaan, warisan di samping istilah ''anak''), dan kisah putra dan putri (anak laki-laki, Luqman, pengorbanan, putra Adam). Kata-kata
    yang meragukan dijaga: "anak laki-laki" saja tidak pernah dihitung, karena ia ada dalam setiap rantai narasi dan garis keturunan, dan hanya bentuk tambahan (putra, putri), serta "warisan" yang dihitung
    di samping kata-kata anak-anak saja, dan positif palsu yang diperoleh dikecualikan oleh yang pasti. Setiap buku yang dikumpulkan kemudian secara otomatis membawa ingatannya ke sini; catatan terpilih
    masuk di bawah tag bunuwwa-browser; dan orang tua serta anak laki-laki paling terkenal dibaca dari tepi child_of dalam gambar yang sama.'
