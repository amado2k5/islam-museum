    side_title: Bisnis tanpa perkalian
    side_note: Teks-teks ini menghapus, menimbang, atau menaikkan skor dan tidak mengali, sehingga tidak ada tempatnya di tangga. Di sebelah masing-masing adalah angka yang dicatat oleh catatannya.
