  lede: 'Keibuan dalam sumber-sumber museum: ibu dan status serta kehormatannya, kehamilan dan persalinan, menyusui, hak asuh dan pengasuhan anak, ibu-ibu para nabi, sahabat, dan pengikut—dalam Al-Quran,
    Sahih, Muwatta, Sunan, biografi, tradisi Para Sahabat dan Pengikut, dan setiap buku yang tercatat—catatan tentang sumber-sumbernya bertambah seiring masuknya teks-teks baru.'
  badge: Penjelajah Maternity
  status: Struktur {n} ini berisi catatan dalam bagian {s}; dan teks-teksnya disusun agar manusia dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumber dan prosa dalam tujuh bahasa. Kenangan tentang keibuan pada saat pembangunan ditemukan dalam kamus yang dijaga oleh teks bagian-bagian
    dalam enam keluarga: ibu dan statusnya (ibu, ibu, keibuan, keibuan, keibuan, ibu dari orang percaya), kehamilan (hamil, hamil, hamil, dan lemah), persalinan (kelahiran, kelahiran, persalinan, persalinan,
    pasca melahirkan), perawat (menyusui, menyusui, menyusui, menyapih, menyapih), hak asuh dan pengasuhan (keperawatan, keperawatan), penitipan anak dan pengasuhan (keperawatan, keperawatan, pengasuhan,
    masa kecil, sponsor yatim), serta menghormati orang tua (kebaikan, kebaikan, menjaga ikatan kekerabatan). Kata-kata ambigu dijaga dengan baik: abstrak ''um'' hanya dihitung di samping kata ''Asri''
    (um al-Qura dan um al-Kitab dikecualikan), ''Hamal'' yang berarti kehamilan hanya dihitung di samping kata Hamali (membawa sesuatu dan memindahkan dikecualikan), ''Walad'' berarti anak laki-laki dikecualikan
    dan hanya bentuk kelahiran yang dihitung, ''Bar'' hanya dihitung di samping kata orang tua (tanah kering dikecualikan), dan hasil positif palsu yang terdeteksi dikecualikan oleh definite. Setiap buku
    yang dipanen kemudian secara otomatis membawa ingatannya ke sini; catatan terpilih diberi label umuma-browser; dan ibu terdaftar membaca dari tepi child_of ke ibu dalam gambar yang sama.'
