      desc: 'Moral dan transaksi dalam Al-Qur''an: "Sesungguhnya, Allah memerintahkan keadilan dan keunggulan," ayat kebenaran, "penuhi kontrak," "penuhi ukuran dan neraca keseimbangan," ayat-ayat riba,
        agama, dan hipotek, putusan pernikahan, perceraian, masa tunggu, dan menyusui, sumpah dan penebusannya, kesaksian dan penghakiman, mereka yang berdoa, menghormati orang tua, menghina, mengejek,
