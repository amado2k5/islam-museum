  related_card: Terkait
  font: Jalur
  pages:
    heroes:
      title: Pahlawan Islam
      desc: 'Hall of Heroes: Enam aula kebajikan — pengorbanan, keberanian, belas kasihan, kemurahan hati, pengetahuan, dan keteguhan — dan setiap aula memiliki empat pahlawan dengan cerita dan sumber lengkap
        mereka.'
      menu: Enam aula kebajikan, dua puluh empat juara
    courses:
      title: Penjelajah Pendidikan
      desc: 'Mata pelajaran Anda dan museum di dalamnya: Pilih sistem sekolah, deskripsi, dan mata pelajaran Anda. Setiap pelajaran dari kurikulum Anda dibuka dengan pelajaran sarjana, penemuan, tempat,
        dan ayat di sekitarnya, masing-masing dengan sumbernya sendiri, bersama dengan tes mandiri, presentasi kelas, dan makalah cetak.'
      menu: Kurikulum sekolah dan museum di setiap pelajaran
    seerah:
      title: Biografi dan Kehidupan
      desc: 'Biografi adalah cara hidup: kartu praktis untuk mengatur hari, minggu, bulan, tahun, dan tahapan hidup Anda sesuai dengan panduan Kenabian.'
      menu: Pendekatan praktis terhadap kehidupan sehari-hari di biografi
    tafsir:
      title: Browser interpretasi
      desc: 'Buku-buku tafsir Al-Qur''an, jilid demi jilid: Jami'' al-Bayan oleh al-Tabari pertama, setiap jilid terhubung dengan ayat-ayat yang dibahas dan sumbernya, bersama dengan semua tafsir lain di
        museum.'
      menu: Baca buku interpretasi Al-Qur'an
    quran:
      title: Al-Qur'an
      desc: Al-Qur'an lengkap untuk pembacaan berkelanjutan, Surah — teks Wahyu Beku, dan setiap ayat adalah bab dari kartunya di museum.
      menu: Bacakan Al-Qur'an, Surah demi Surah
    hadith:
      title: Perpustakaan Hadis
      desc: Museum Talk Blogs — jelajahi setiap buku kerja dengan teks dan tautan, serta tautan ke Sunnah.com.
      menu: Jelajahi blog obrolan
    timeline:
      title: Waktu
      desc: Empat belas abad pada sumbu Hijri interaktif, dan pembacaan kedua Gregorian.
      menu: 'Tema utama: setiap entri didokumentasikan, dalam tahun dan abad'
    calendar:
      title: Kalender Hijriyah
      desc: Jelajahi Hijriyah setiap bulan setiap bulan dengan kalender Gregorian, acara, konverter tanggal, dan unduhan .ics.
      menu: Jelajahi Hijri tahun demi bulan
    journeys:
      title: Perjalanan
      desc: 'Rahasia jalur migrasi hari demi hari: stasiun, jarak, dan malam.'
      menu: Rahasia jalur migrasi hari demi hari
    graph:
      title: Penjelajah Tautan
      desc: Hubungan antara orang, peristiwa, dan tempat digambar seperti rasi bintang.
      menu: Hubungan antara orang, peristiwa, dan tempat
    map:
      title: Lokasi
      desc: 'Dunia Islam: peta interaktif melalui waktu: wilayah, kota, tokoh terkenal, dan peristiwa, dengan garis waktu Hijriah.'
      menu: Peta interaktif melintasi waktu
    revelation:
      title: Wahyu dan Sejarah
      desc: Bacalah Al-Qur'an sebagaimana diwahyukan, bersamaan dengan peristiwa-peristiwa tersebut.
      menu: Al-Qur'an seperti yang diwahyukan, beserta peristiwa-peristiwa
    surahmaps:
      title: Peta dinding
      desc: 'Setiap surah adalah peta interaktif: topik dan stasiunnya terbagi ayat demi ayat.'
      menu: Peta pagar interaktif
    cards:
      title: Kartu Museum
      desc: 'Kartu belajar interaktif: peta kata, daftar, dan cerita.'
      menu: Kartu belajar interaktif
    sighar:
      title: Junior Suite
      desc: 'Sudut Anak-anak di Museum: Taman Kata-kata dan Perjalanan Para Nabi bersama Hoopoe.'
      menu: Sudut Interaktif Anak-anak
    timeexplorer:
      title: Penjelajah Garis Waktu
      desc: Jalani cerita pribadi, era, atau kota, stasiun, stasiun pada garis waktu interaktif.
      menu: 'Tur berpemandu: kisah pribadi, era, atau kota, stasiun'
    khutab:
      title: Penjelajah Kuliah dan Pelajaran
      desc: Khotbah sejarah dari buku-buku khotbah dan serangkaian pelajaran yang tercatat, masing-masing terkait dengan teks dan sumbernya.
    fatwa:
      title: Penjelajah Fatwa
      desc: Fatwa dari buku fatwa dan situs web fatwa resmi dan terkenal, disusun sesuai sumbernya, masing-masing dirangkum dalam bahasa museum dan ditautkan ke halaman aslinya.
    poetry:
      title: Kumpulan Puisi
      desc: Puisi-puisi yang didokumentasikan di museum disusun sesuai dengan penyairnya, setiap puisi sesuai konteks dan kesempatan yang dimilikinya.
      menu: Bacalah puisi tentang para penyairnya
    qudsi:
      title: Penjelajah Hadis Suci
      desc: 'Hadits-hadits yang diceritakan oleh Nabi tentang Tuhannya dalam enam kitab dan Muwatta Malik: setiap hadis beserta riwayatnya dalam setiap kitab, diatur sesuai topik aktual.'
      menu: Jelajahi hadits suci
    jobs:
      title: Job Browser
      desc: Pekerjaan yang dikenal oleh umat Muslim, mulai dari hakim dan juru tulis hingga kerajinan tangan, masing-masing memiliki pekerjaan dan tempat yang dipraktikkan.
      menu: Jelajahi pekerjaan dan kerajinan sepanjang sejarah
    inventions:
      title: Inventions Browser
      desc: Mendokumentasikan penemuan dan penemuan, dari pembuatnya dan konteksnya hingga apa yang dibangun di atasnya.
      menu: Jelajahi penemuan dan serinya
    modern:
      title: Browser Islam Kontemporer
      desc: 'Lima puluh tahun terakhir Islam dan Muslim: situs web, musik, film, konferensi, tokoh terkenal, organisasi, olahraga, penghargaan, dan apa yang akan datang.'
      menu: Jelajahi lima puluh tahun terakhir
    companions:
      title: Al-Sahaba Browser
      desc: 'Para sahabat Nabi adalah jaringan orang: sepuluh pria, para emigran, para pembantu, Ahl al-Bayt, para sahabat perempuan, suku mereka, peristiwa yang mereka saksikan, dan kematian mereka.'
      menu: Jelajahi pendamping
    asma:
      title: Penjelajah Nama-nama Indah Allah
      desc: Sembilan puluh sembilan nama dari Nama-nama Terindah Allah, masing-masing dengan makna dan cerita yang terkandung dalam catatan museum.
      menu: Jelajahi Nama-nama Indah Allah dan Kisah-Kisahnya
    khulafa:
      title: Browser Penerus
      desc: Khalifah diatur berdasarkan negara kalifah — dari Rashidun hingga Sokoto — untuk setiap khalifah, masa pemerintahannya, garis keturunannya, peristiwa pemerintahannya, dan catatan yang terdokumentasi.
      menu: Jelajahi Khalifah dan Era Mereka
    arabiyya:
      title: Browser Bahasa Arab Bahasa Al-Qur'an
      desc: 'Bahasa Arab adalah bahasa Al-Qur''an: ayat-ayat yang menghiasi lidahnya, apa yang telah diceritakan tentangnya dalam hadis, para sahabat dan ulama, mukjizat dalam ekspresinya, sejarah, aksara,
        dan kesamaannya, dialek, ulama, sarjana, dan buku.'
      menu: Jelajahi bahasa Arab sebagai bahasa Al-Qur'an
    maajim:
      title: Browser Kamus
      desc: 'Kamus Arab dan Islam: Siapa yang menulisnya, kapan, dari buku mana mendahuluinya, bagaimana diatur, dan di mana membacanya.'
      menu: Jelajahi kamus dan penulisnya
    ghayb:
      title: Unseen World Browser
      desc: Jin, malaikat, dan roh, ukuran waktu, Mi'raj, Barzakh, dan tanda-tanda Jam — yang tak terlihat dengan sumbernya.
      menu: Jelajahi dunia yang tak terlihat
    nature:
      title: Penjelajah Alam
      desc: Hewan, burung, serangga, hewan laut, tumbuhan, dan fenomena penciptaan dalam Al-Qur'an dan Hadis — setiap ayat dan hadis dengan sumbernya.
      menu: Jelajahi alam dalam Al-Qur'an dan Hadis
    angels:
      title: Angel Browser
      desc: Segala sesuatu yang disebutkan tentang malaikat dalam Al-Qur'an, Hadis, kitab-kitab Nabi, dan kitab-kitab — Gabriel, Mikhael, Israfil, para ahli Taurat mulia, dan malaikat Badr serta Hunayn
        — disusun sesuai fungsi dengan setiap ayat dan laporan dari sumbernya.
      menu: Jelajah dan sebutkan malaikat-malaikat itu
    dreams:
      title: Dream Browser
      desc: Setiap penglihatan dan setiap mimpi yang disebutkan dalam Al-Qur'an, Hadis, Nabi, dan kitab-kitab — dari penglihatan Yusuf hingga penglihatan Laylat al-Qadr, dan setiap mimpi diklasifikasikan
        pada hari yang masuk ke sumbernya.
      menu: Jelajahi mimpi dalam Al-Qur'an, Hadis, dan Biografi
    dua:
      title: Prayer Browser
      desc: Setiap doa yang disebutkan dalam Al-Qur'an, Sunnah, biografi, dan setiap kitab — mulai dari "Tuhanku, ampunilah aku" hingga "Ya Allah, aku berlindung kepada-Mu," doa Nabi saat shalat malam,
        dan doa para sahabat dan pengikut — beserta setiap ayat dan laporan dari sumbernya.
      menu: Jelajahi doa dalam Al-Qur'an, Hadis, dan buku
    ibadat:
      title: Browser Ibadah dan Kenangan
      desc: Setiap tindakan ibadah dan peringatan yang disebutkan dalam Al-Qur'an, Sunnah, dan Syarat, serta setiap kitab — doa, penyucian, puasa, zakat, amal, Haji, Umrah, peringatan, permohonan, pemuliaan,
        pencarian pengampunan, pembacaan, pertobatan, dan ruqyah — beserta setiap ayat dan laporan yang berasal dari sumbernya.
      menu: Jelajahi Tindakan Ibadah dan Kenangan dalam Al-Qur'an, Hadis, dan Buku
    nar:
      title: Fire Browser
      desc: 'Setiap penyebutan Api dalam Al-Qur''an, Sunnah, Kitab Nabi, dan setiap Kitab — Neraka, Neraka, Al-Hatmah, Al-Hadha, Al-Hamiyah, dan Al-Sa''ir, harta-hartanya, bahan bakarnya, percikan apinya,
        merpatinya, jalan-jalannya, dan api dunia ini juga: api Abraham, pohon Musa, dan api perang — dengan setiap ayat dan laporan dari sumbernya.'
      menu: Jelajahi penyebutan api dalam Al-Qur'an, Hadis, dan buku-buku
    janna:
      title: Paradise Browser
      desc: Segala sesuatu yang disebutkan tentang Surga dalam Al-Qur'an, Sunnah, dan Kitab Nabi—Surga, Taman-taman Eden, tempat damai, sungai, gerbang, derajat tanah, dan manusia, serta setiap jejak dari
        Para Sahabat dan Pengikut—serta setiap ayat dan hadis beserta sumbernya.
      menu: Jelajahi Surga dalam Al-Qur'an, Hadis, dan Buku
    qiyama:
      title: Baath Browser, Hari Penghakiman, dan Kisah
      desc: Setiap penyebutan kebangkitan, Hari Kebangkitan, dan perhitungan dalam Al-Qur'an, Sunnah, biografi, dan setiap kitab yang terjadi — nama-nama hari, tiupan terompet, kebangkitan, kebangkitan,
        kebangkitan, kebangkitan, kengerian, kehormatan, kitab suci, timbangan, bayangan, cekungan, perantaraan, dan jalan — bersama setiap ayat dan berita dengan sumbernya.
      menu: Jelajahi kebangkitan, hari, dan perhitungan dalam Al-Qur'an, Hadis, dan buku-buku
    tibb:
      title: Browser Kedokteran, Kedokteran, Anatomi, Bedah, Kedokteran, dan Penyembuhan dalam Islam
      desc: Segala sesuatu yang dilaporkan tentang pengobatan kenabian, pengobatan, anatomi, bedah, pengobatan, dan pengobatan dalam Al-Qur'an, Sunnah, biografi Nabi, laporan para Sahabat dan Pengikut,
        buku-buku medis, dan setiap buku yang dipanen — bekam, madu, biji hitam, kauteria, ruqyah, penyakit, infeksi, wabah, kunjungan pasien, tahapan penciptaan dan bagian tubuh, penyembuhan yang terluka,
        obat dan racun, keputusan pengobatan — dengan dokumentasi setiap ayat dan laporan.
      menu: Jelajahi Kedokteran, Kedokteran, Anatomi, Bedah, Kedokteran, dan Penyembuhan Nabi
    usra:
      title: Browser Keluarga dan Pernikahan
      desc: Pernikahan paling terkenal dalam Islam, keluarga Muslim, rumah tangga, mata pencaharian, kehidupan sehari-hari, dan adat sosial — segala sesuatu yang disebutkan tentang pernikahan, pasangan,
        anak, tempat tinggal, mata pencaharian, adat istiadat dalam Al-Quran, Sunnah, Nabi, setiap kumpulan kitab, setiap ayat, dan setiap sumber riwayat.
      menu: Jelajahi pernikahan, keluarga, dan kehidupan sehari-hari dalam Al-Quran dan buku-buku
    ubuwwa:
      title: Browser Parenthood dalam Islam
      desc: Setiap penyebutan tentang ayah dan ayah dalam Islam — para leluhur Al-Qur'an dan nasihat mereka, menghormati orang tua dan ketidakpatuhan, Nabi sebagai ayah, garis keturunan dan afiliasi, serta
        anak yatim yang kehilangan ayahnya — dalam Al-Qur'an, Sunnah, biografi, jejak Para Sahabat dan Pengikut, setiap kitab yang disusun, dan setiap ayat serta jejak dengan sumbernya.
      menu: Jelajahi Ayah dan Kebapakan dalam Al-Qur'an dan Kitab
    ukhuwwa:
      title: Browser Ikhwanul Muslimin Islam
      desc: 'Persaudaraan dalam Islam: Saudara-saudari — segala sesuatu yang disebutkan tentang saudara, saudara, saudari, persaudaraan antara para emigran dan Ansar, kasih demi Tuhan, altruisme, hak persaudaraan,
        dan peringatan persaudaraan dalam Al-Qur''an, Sunnah, dan Seerah, setiap kitab yang disusun, dan setiap ayat serta laporan dengan sumbernya.'
      menu: Jelajahi persaudaraan, persaudaraan, dan hak-hak saudara dalam Al-Qur'an dan buku-buku
    sport:
      title: Olahraga dan Kompetisi Browser dalam Islam
      desc: Berkuda, berenang, panahan, serta semua olahraga dan kompetisi di antara umat Muslim — gulat, kekuatan dan kekuatan, balapan, membuat dan bermain dengan tombak, permainan bola dan meja, berburu,
        dan olahraga modern — ditemukan dalam Al-Qur'an, Sunnah, Nabi, tradisi Para Sahabat dan Pengikut, setiap kitab yang dipanen, serta setiap ayat dan laporan beserta sumbernya.
      menu: Jelajahi equestrianism, renang, panahan, dan olahraga Muslim dalam Al-Quran dan buku-buku
    umuma:
      title: Browser Keibuan dalam Islam
      desc: Segala sesuatu yang telah dilaporkan tentang keibuan, ibu, statusnya, kehamilan, persalinan, menyusui, hak asuh, pengasuhan, penghormatan orang tua dalam Al-Qur'an, Sunnah, dan biografi Nabi,
        setiap kitab yang dipanen, serta setiap ayat dan tradisi dengan sumbernya.
      menu: Jelajahi tentang keibuan dan ibu dalam Al-Qur'an dan buku-buku
    bunuwwa:
      title: Browser Anak-anak dalam Islam
      desc: 'Segala sesuatu yang disebutkan tentang keputraan—putra, putri, putra, dan keturunan—ditemukan dalam Al-Qur''an, Sunnah, biografi Nabi, tradisi Para Sahabat dan Pengikut, serta setiap kumpulan
        kitab: menghormati orang tua dan ketidaktaatan mereka, anak yatim dan menyusui, hak anak, dan kisah putra dan putri—serta setiap ayat dan laporan dengan sumbernya.'
      menu: Jelajahi Putra dalam Al-Qur'an, Hadis, dan Kitab
    islamiceconomy:
      title: Browser Mata Uang, Sukuk, dan Wakaf Islam
      desc: Setiap penyebutan mata uang, ekonomi Islam, sukuk, kontrak, wakaf dalam Al-Qur'an, Sunnah, biografi, dan setiap kitab — uang, riba, utang, kontrak penjualan, timbangan, ukuran, jizya, kharaj,
        wakaf, amal yang berkelanjutan — beserta setiap ayat dan laporan yang mengutip sumbernya.
      menu: Jelajahi mata uang, sukuk, dan wakaf dalam Al-Quran, Hadis, dan buku
    trade:
      title: Browser Karavan Musim Dingin dan Musim Panas, Jalur Sutra, dan Perdagangan Muslim
      desc: Setiap penyebutan karavan musim dingin dan musim panas, kasih sayang Quraisy, Jalur Sutra, dan perdagangan umat Islam dalam Al-Quran, Sunnah, dan Syarat, serta setiap kitab — karavan, unta,
        karavan, karavan, khanat, ribatas, jalur perdagangan, pasar, pedagang, barang, ukuran, timbangan, dan perdagangan laut — beserta setiap ayat dan laporan yang bersumbernya.
      menu: Jelajahi karavan, Jalur Sutra, dan berdagang Al-Qur'an, Hadis, serta buku-buku
    sayyiat:
      title: Bug Browser
      desc: Setiap penyebutan dosa dan hal-hal terkait—dosa, kesalahan, pelanggaran, dosa besar, dosa kecil, pertobatan, dan pencarian pengampunan—dalam Al-Qur'an, Sunnah, biografi, dan setiap kitab yang
        telah dicatat, beserta setiap ayat dan laporan sumbernya.
      menu: Jelajahi dosa dan hal-hal terkait dalam Al-Qur'an dan buku-buku
    hudud:
      title: Penerok batas dan dosa besar Tuhan
      desc: Setiap penyebutan hukuman Allah dan dosa-dosa besar—'Inilah batas Allah'—pelaksanaan hudud, rajam, cambuk, amputasi tangan, dan ta'zir, serta kejahatan hukuman seperti perzinahan, pencurian,
        fitnah, alkohol, murtad, dan tujuh dosa besar serta tujuh dosa yang merusak—dalam Al-Qur'an, Sunnah, biografi, laporan para sahabat dan pengikut, serta setiap kitab yang terjadi, beserta setiap
        ayat dan laporan sumbernya.
      menu: Jelajahi batas-batas Tuhan dan dosa-dosa besar dalam Al-Qur'an dan kitab-kitab
    arkan:
      title: Penelusuri pilar-pilar Islam, pilar iman, orang-orang beriman, dan sifat-sifat orang beriman
      desc: Setiap penyebutan lima rukun Islam, enam rukun iman, tujuh puluh beberapa cabang iman, sifat-sifat mukmin dalam Al-Qur'an, Sunnah, biografi, laporan para Sahabat dan Pengikut, serta setiap kitab
        yang telah dicatat, beserta setiap ayat dan laporan dari sumbernya.
      menu: Jelajahi pilar-pilar Islam, iman, orang-orang beriman, dan kualitas seorang mukmin
    ahkam:
      title: Browser kewajiban, kewajiban, hal yang direkomendasikan, tindakan yang tidak disukai, dan larangan
      desc: Setiap tempat di mana kewajiban disebutkan, baik yang spesifik maupun cukup, tindakan ketaatan, kewajiban, tindakan yang direkomendasikan, larangan, tindakan yang tidak disukai, dosa kecil,
        dan hal-hal yang diperbolehkan, dalam Al-Qur'an, Sunnah, biografi, tradisi Para Sahabat dan Pengikut, kitab prinsip dan yurisprudensi, serta setiap ayat dan laporan beserta sumbernya.
      menu: Jelajahi tindakan wajib, tindakan yang direkomendasikan, tindakan yang tidak disukai, larangan, dan dosa kecil
    halal:
      title: Browser Halal dan Haram
      desc: Setiap penyebutan tentang apa yang sah dan tidak sah dalam Islam — apa yang Allah izinkan dan apa yang dilarang-Nya di restoran, minuman, pakaian, pernikahan, dan penghasilan — dalam Al-Qur'an,
        Sunnah, biografi, laporan Para Sahabat dan Pengikut, serta setiap kitab yang diperoleh, beserta catatan rinci tentang asal-usul dan bab-babnya.
      menu: Jelajahi apa yang halal dan haram dalam Al-Quran, Sunnah, dan buku-buku
    hasanat:
      title: Keunggulan Browser
      desc: Setiap penyebutan perbuatan baik dalam Al-Qur'an, Sunnah, dan biografi, serta setiap kitab — "Sesungguhnya, perbuatan baik menghilangkan perbuatan buruk," "Barangsiapa yang membawa perbuatan
        baik akan mendapat sepuluh kali lipatnya," serta penulisan perbuatan baik, pinjaman kebaikan, dan ganjaran atas "kebaikan"—bersama setiap ayat dan laporan dari sumbernya.
      menu: Jelajahi kebajikan dalam Al-Qur'an dan buku-buku
    hisab:
      title: Daftar, kalkulator, dan penghitung pro dan kontra
      desc: Setiap teks yang menghitung, menulis, mengalikan, menghapus, atau menimbang karya dalam Al-Qur'an, Sunnah, Nabi, dan setiap kitab yang dikumpulkan, dengan kalkulator yang membaca angka-angka
        yang disebutkan oleh teks, penghitung ingatan, dan setiap angka yang dikaitkan dengan teksnya.
      menu: Daftar, kalkulator, dan penghitung perbuatan baik dan buruk
    mukatabat:
      title: Browser Korespondensi
      desc: Setiap penyebutan korespondensi dalam Al-Qur'an, Sunnah, dan biografi, serta setiap kitab yang muncul — surat-surat Nabi kepada raja dan kaisar, surat-surat para khalifah dan apa yang ditulis
        kepada mereka, surat Salomo kepada Bilqis — bersama setiap ayat dan laporan dengan sumbernya.
      menu: Jelajahi buku dan korespondensi dalam Al-Qur'an dan buku-buku
    nuzul:
      title: "Browser Asbab al-Nuzul"
      desc: "Setiap riwayat tentang mengapa suatu ayat atau surah diturunkan dalam Al-Qur'an, Sunnah, sirah, riwayat para Sahabat dan Tabi'in, dan setiap kitab yang dihimpun — wahyu pertama di gua, sebab-sebab ayat hijab, khamar, ifk, li'an, dan zihar — setiap riwayat dengan sumbernya."
      menu: "Jelajahi sebab-sebab turunnya wahyu dalam Al-Qur'an dan kitab-kitab"
    munazarat:
      title: Peramban Debat
      desc: Setiap penyebutan perdebatan dan perdebatan dalam Al-Qur'an, Sunnah, dan biografi, serta setiap buku yang telah diterbitkan — argumen Abraham dengan umatnya dan Nimrod, Mubahala umat Kristen
        Najran, perdebatan menurut Negus, perdebatan Ibn Abbas dengan Kharijit, setiap perdebatan yang disebutkan dalam sebuah buku — dengan setiap ayat dan laporan yang mengutip sumbernya.
      menu: Jelajahi debat dan perdebatan dalam Al-Qur'an dan buku
    ritha:
      title: Browser dari hal-hal paling terkenal yang dikatakan dalam elegi dan obituari
      desc: 'Segala sesuatu yang dikatakan tentang elegi, obituari, belasungkawa, dan tangisan atas almarhum dalam Al-Qur''an, Sunnah, biografi Nabi, laporan para Sahabat dan Pengikut, dan setiap kitab
        yang dikumpulkan: ingatan temukan, firman Nabi, "Sesungguhnya, Allah memiliki apa yang diambil, dan milik-Nya apa yang diberikan," obituari Ja''far, Zayd, Ibn Rawaha, dan Al-Najashi, elegi Hassan
        dan Ka''b ibn Malik, serta batas-batas berkabung, dengan dokumentasi setiap ayat dan laporan.'
      menu: Jelajahi pepatah paling terkenal dalam elegi, obituari, dan ucapan belasungkawa
    juha:
      title: Juha Browser dan Folklor Islam
      desc: Juha, Nasr al-Din Khoja, Ash'ab, dan Naiman, serta anekdot, lelucon, dan tawa dalam Al-Qur'an, Sunnah, biografi, serta buku-buku sastra dan sejarah yang dipanen, dengan setiap ayat, berita,
        dan kelangkaan berasal dari sumbernya.
      menu: Jelajahi Juha, anekdot, lelucon, dan lelucon dalam Al-Quran, Sunnah, dan buku-buku
    magic:
      title: Magic and Witches Browser
      desc: Setiap penyebutan tentang sihir dan penyihir dalam Al-Qur'an, Sunnah, Nabi, dan kitab suci — sihir, ramalan, ruqyah, mata jahat, dan iri hati — beserta setiap ayat dan laporan yang berasal dari
        sumbernya.
      menu: Jelajahi sulap dan pesulap dalam Al-Qur'an dan buku
    cosmos:
      title: Penjelajah Alien, Negara Manusia Lama, dan Rahasia Alam Semesta
      desc: 'Apa yang dikatakan ayat-ayat Al-Qur''an, Sunnah, dan kitab suci tentang makhluk di luar bumi, langit, dan tujuh bumi, mereka yang menghuni bumi sebelum Adam, bangsa-bangsa yang binasa, dan
        rahasia alam semesta: setiap ayat dan riwayat didokumentasikan, dan setiap pendapat dikaitkan dengan pembicaranya.'
      menu: Jelajahi makhluk, bangsa, dan rahasia alam semesta masa lalu
    qiraat:
      title: Pembacaan Al-Quran, Ejaan, Font, dan Dot Browser
      desc: 'Tujuh surat, bacaan dan imamnya, penyusunan Al-Qur''an dan penyalinan Al-Qur''an, aksara Mushaf, perbedaan ortografi, titik dan bentuknya, aksara yang digunakan untuk menulis: setiap ayat,
        riwayat, dan laporan yang terumat, serta setiap pernyataan yang dikaitkan dengan penulisnya.'
      menu: Jelajahi bacaan, gambar Al-Qur'an, aksara-naskahnya, dan titik-titik
    tajwid:
      title: "Peramban Tajwid dan Tilawah"
      desc: "Tujuh belas makhraj dan sifat huruf, hukum-hukum tajwid, tartil dan adab membaca serta mendengar, lagu-lagu, para qari dan teks pengajaran — setiap ayat, riwayat dan petikan kitab dicantumkan sumbernya."
      menu: "Jelajahi hukum tajwid dan seni tilawah"
    ulama:
      title: Penjelajah para pemikir, ilmuwan, penulis, ulama hadis, dan penulis
      desc: 'Setiap pemikir, cendekiawan, penulis, ulama hadis, dan penulis di museum—dan segala sesuatu yang dikatakan tentang mereka dalam Al-Quran, Sunnah, dan Seerah, serta setiap buku yang dikumpulkan:
        kehidupan mereka, misi, pepatah, buku, pertemuan, dan karya—serta setiap penyebutan sumbernya.'
      menu: Jelajahi para pemikir, ilmuwan, penulis, ulama hadis, penulis, dan berita mereka
    wasaya:
      title: Penerok Perintah, Warisan, Kuno, dan Tempat Suci Para Nabi dan Nabi yang Benar
      desc: Nasihat para nabi, utusan, khalifah, sahabat, pengikut, imam, dan orang-orang suci sebelum kematian mereka, serta apa yang mereka tinggalkan, warisan mereka, dan makam mereka dalam Al-Qur'an,
        Sunnah, biografi, dan setiap kitab kumpulan, dengan setiap ayat dan laporan yang dikaitkan dengan sumbernya.
      menu: Jelajahi surat wasiat, warisan, monumen, dan tempat suci
    signs:
      title: Browser Tanda Jam
      desc: Setiap penyebutan tanda-tanda Jam, Hari Kebangkitan, dan semua yang berkaitan dengan Jam dalam Al-Qur'an, Sunnah, Biografi, dan apa yang telah terjadi dalam kitab—tanda besar dan kecil, Barzakh,
        kebangkitan, perhitungan, keseimbangan, jalan, cekungan, Surga, dan Neraka—bersama setiap ayat dan berita yang berasal darinya.
      menu: Jelajahi tanda-tanda Jam dan Akhirat
    jinn-devils:
      title: Browser Jin dan Iblis
      desc: Jin, iblis, malaikat, dan mimpi-mimpi yang membawanya — masing-masing disebutkan dalam Al-Qur'an, Hadis, dan Seerah beserta sumbernya.
      menu: Jelajahi Jinn, Iblis, dan Malaikat
    messengers:
      title: Browser Messengers dan Prophets
      desc: Setiap penyebutan para rasul dan nabi dalam Al-Qur'an, Sunnah, biografi, dan kitab-kitab yang dipanen — para nabi yang disebutkan, para rasul, dan para pendongeng, beserta setiap ayat, laporan,
        dan riwayat beserta sumbernya.
      menu: Jelajahi utusan dan nabi serta sebutkan mereka
    miracles:
      title: Browser Mukjizat Ilahi dan Mukjizat Para Rasul
      desc: Setiap penyebutan mukjizat ilahi dan mukjizat para rasul dalam Al-Qur'an, Sunnah, biografi, dan buku-buku hasil panen — mukjizat Al-Qur'an, belahan bulan, Isra, Mi'raj, tongkat, laut, unta betina
        Saleh, bahtera, api, burung-burung tanah liat, kata-kata buaian, meja surgawi, tanda-tanda Salomo, mimpi, kabar bahagia Zakharia, dan Tabut, bersama setiap ayat, laporan, dan riwayat dengan sumbernya.
      menu: Jelajahi Mukjizat Ilahi dan Mukjizat Para Rasul
    qurun:
      title: Browser berabad-abad, tahun, bulan-bulan penting, dan bulan-bulan suci
      desc: Setiap penyebutan abad, tahun, bulan, dan bulan-bulan suci yang penting dalam Al-Qur'an, Sunnah, biografi, dan buku-buku yang dipanen — tahun-tahun yang disebutkan dalam biografi, dua belas
        bulan lunar, empat bulan suci, dan Nas'i — bersama dengan setiap ayat, laporan, dan narasi yang mengutip sumbernya.
      menu: Jelajahi abad, tahun, bulan, dan bulan-bulan suci
    madhahib:
      title: Browser Empat Sekolah Pemikiran
      desc: Keempat Imam, aliran yang mereka dirikan, generasi awal, serta buku dan teks yang mereka catat — masing-masing menyebutkan sekolah-sekolah dalam kitab Sunni beserta sumbernya.
      menu: Jelajahi Empat Sekte dan Ingatan Mereka
    umam:
      title: Browser Bangsa, Agama, Sekte, dan Bangsa Non-Muslim
      desc: Setiap bangsa, agama, sekte, dan bangsa non-Muslim yang disebutkan dalam Al-Qur'an, Hadis, biografi, laporan para Sahabat dan Pengikut, dan setiap Kitab—bangsa-bangsa yang punah, Umat Kitab,
        para politeis, raja dan manusia di bumi, serta setiap penyebutan sumbernya.
      menu: Menjelajahi negara, agama, dan bangsa serta menyebutkannya
    bayt:
      title: Browser dari Rumah Kenabian dan keluarga nabi
      desc: Segala sesuatu yang disebutkan tentang Rumah Kenabian dan keluarga Nabi — Ahl al-Bayt, keturunan Banu Hashim, istri dan putri, putra, dan cucu Nabi — ditemukan dalam Al-Qur'an, Sunnah, biografi,
        dan kitab-kitab yang dikumpulkan.
      menu: Jelajahi Rumah Kenabian dan keluarga Nabi
    nubuwat:
      title: Penjelajah Nubuat, Rahasia, dan Mukjizat Al-Qur'an
      desc: Setiap nubuat Rasulullah, setiap bukti kenabian, setiap aspek rahasia dan tersembunyi dari Al-Qur'an, setiap mukjizat dan tanda waktu dalam Al-Qur'an, Sunnah, dan biografi, serta setiap kitab
        yang tercantum — dengan setiap ayat dan setiap riwayat dengan sumbernya.
      menu: Jelajahi nubuat, rahasia, dan mukjizat nabi dalam Al-Qur'an
    places:
      title: Browser Tempat Suci dan Penting yang Bernilai dalam Islam
      desc: Setiap tempat suci, penting, atau berharga dalam Islam yang disebutkan dalam Al-Qur'an, Sunnah, biografi Nabi, laporan para Sahabat dan Pengikut, dan setiap Kitab Suci — tiga tempat suci, tempat
        Haji, situs biografi, tempat yang disebut oleh Al-Qur'an, dan setiap tempat yang disebutkan dalam riwayat.
      menu: Jelajahi tempat-tempat suci dan penting dalam Islam
    akhlaq:
      title: Browser Etika dan Transaksi
      desc: Setiap penyebutan moral dan transaksi dalam Al-Qur'an, Sunnah, biografi, laporan Para Sahabat dan Pengikut, dan setiap kitab dianggap dihitung — kejujuran, kepercayaan, kesetiaan, kesabaran,
        rasa syukur, kerendahan hati, kebaikan, kerendahan hati, kesabaran, pengampunan, ketulusan, pertobatan, kemurahan hati, menghormati orang tua, menjaga ikatan keluarga, hak tetangga, berbohong, pengkhianatan,
        kesombongan, kemunafikan, kekikitan, gosip, kemarahan, ketidakadilan, ketidakpatuhan, kemunafikan, penipuan, penjualan, riba, utang, pinjaman, hipotek, sewa, wasiat, warisan, pernikahan, perceraian,
        sumpah, kesaksian, peradilan, keseimbangan, rekonsiliasi, hadiah, sponsor, agensi, kemitraan, perdamaian, pemindahan, ketelanjangan, perebutan kekuasaan, preemption, monopoli, paksaan, dan ketidakmampuan
        — bersama setiap ayat dan laporan dengan sumbernya.
      menu: Jelajahi etika dan transaksi dalam Al-Qur'an, Hadis, dan buku
    ansab:
      title: Penjelajah silsilah, ras, klan, dan pohon nabi serta utusan
      desc: Setiap penyebutan garis keturunan, garis keturunan, klan, dan pohon nabi dalam Al-Qur'an, Sunnah, dan biografi, serta setiap kitab dihitung — garis keturunan Nabi dalam tiga bagiannya, suku
        dan klan orang Arab, serta bangsa-bangsa — bersama dengan setiap ayat dan berita dengan sumbernya.
      menu: Jelajahi silsilah, ras, klan, dan pohon para nabi
    i3lam:
      title: Muslim Media Browser
      desc: Setiap penyebutan tentang para pembuat firman — muezzin, penelepon, pengkhotbah, juru bicara resmi, penulis, jurnalis, tokoh media, influencer, reformis, dan revolusioner — dalam Al-Quran, Sunnah,
        biografi, dan setiap buku adalah hasil panen, bersama mereka yang membawa firman.
      menu: Jelajahi para profesional media Muslim
    battles:
      title: Browser Invasi, Pertempuran, dan Penaklukan
      desc: Serangan, saraya, pertempuran, pengepungan, penaklukan, dan perang sepanjang sejarah Islam — ekspedisi dulu, lalu berdasarkan jenis dan era.
      menu: Jelajahi Invasi, Pertempuran, dan Penaklukan
    timemachine:
      title: Mesin waktu
      menu: Bepergian ke tanggal mana saja, dengan kedua kalender
    wander:
      title: Wander
      menu: Halaman acak dari museum
