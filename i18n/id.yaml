signs:
  title: Browser Tanda Jam
  lede: 'Tanda-tanda Jam dalam sumber museum dibaca secara berurutan: tanda-tanda secara umum, lalu Mahdi, kemudian Antikristus, kemudian Gog dan Magog, lalu Jam itu sendiri. Hari Kebangkitan, Surga, dan
    Neraka memiliki halaman khusus mereka sendiri.'
  badge: Penjelajah Akhirat
  status: Struktur ini mencakup {n} sebuah catatan dalam {s} bagian; teks disusun agar manusia dapat meninjaunya.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — dengan sumber dan triloginya. Kenangan tentang jam ditemukan saat dibangun dalam kamus yang dijaga berdasarkan teks suku kata — kata-kata
    penentu cocok langsung, kata ambigu seperti "jam" (jam atau jam waktu), "paradise" (surga atau kebun), "api" (api atau api), "al-akhira" (yang terakhir atau terakhir), "the path" (path atau path), dan
    "the scale" (balance atau trade balance) hanya dihitung bersama struktur masing-masing, dan positif palsu yang diverifikasi dikecualikan oleh pengenal; setiap buku yang dipanen kemudian otomatis masuk
    ke memori jam di sini segera setelah teksnya muncul dalam gambar, dan catatan yang dipilih digabungkan di bawah tag eskatology-browser.
  api: Seluruh koleksi tersedia di
  sections_title: Bagian Browser
  filter_label: Nominasi rekaman tag
  filter_none: Tidak ada hasil yang cocok.
  empty: Belum ada catatan penandaan pada konstruksi ini.
  signs_status: Dalam salinan ini, {n} dicatat tentang tanda-tanda Jam dalam tahap {s}, dari {semua} asli, catatan semua hal tentang Akhirat; teks-teks disusun agar seseorang dapat meninjaunya.
  path_title: Tanda-tanda terurut
  path_note: 'Urutan di bawah ini adalah urutan biasa dalam buku doktrinal: tanda secara umum, kemudian bendera yang dinamai oleh sumber, kemudian jam. Tidak ada teks yang membuktikan urutan ini, dan museum
    tidak menilai tanda mana yang mendahuluinya. Pada setiap tahap, catatan museum itu sendiri disajikan, diikuti oleh teks yang menyebutkan tanda tersebut.'
