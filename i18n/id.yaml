  eyebrow: Sekarang · 1448 AH · 2026 M
  title: Dunia Islam Saat Ini
  lede: Sejarah sebelum dan sesudah — satu halaman tentang masa kini. Sekitar satu dari setiap empat orang adalah Muslim, tinggal di sekitar lima puluh negara dan di setiap kota di dunia. Ini adalah masa
