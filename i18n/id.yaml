      desc: 'Ia menyebutkan empat bab dalam setiap karya yang terjadi selain Al-Qur''an, Hadis, dan Seerah: kitab-kitab iman dan iman, biografi para Sahabat dan Pengikut serta laporan mereka, buku-buku
        tentang asketisme dan kelembutan, fiqhèr dan sejarah, serta lainnya.'
    curated:
      title: Catatan Pilar, Orang, dan Kualitas
      desc: 'Catatan terpilih museum dari bab-bab yang sama adalah: lima pilar Islam dan masing-masingnya, enam pilar iman dan masing-masing, cabang-cabang iman dan buku Al-Bayhaqi tentang mereka, kualitas
        orang mukmin dan konsep terkait.'
  topics:
    islam:
      title: Pilar-pilar Islam
      short: 'Lima tiang yang menjadi dasar Islam: dua kesaksian (Shahada), yang mendirikan shalat, memberikan zakat, puasa Ramadan, dan Haji di rumah.'
      desc: 'Segala sumber di museum tentang lima pilar Islam: dua kesaksian, solat yang didirikan, berikan zakat, puasa Ramadan, dan ziarah ke Rumah, dalam Al-Quran, Sunnah, Nabi, dan semua kitab lainnya.'
      scope: Di sini termasuk pilar-pilar yang disebutkan secara verbatim atau dihitung secara kolektif atau Islam dikenal dengan itu, serta ayat-ayat syahid, doa, zakat, puasa, dan ziarah yang disebutkan
        dalam tabel Al-Qur'an. Adapun rincian setiap ibadah secara terpisah, dapat ditemukan dalam Tabel Ibadah dan Peringatan.
    iman:
      title: Pilar Iman
      short: 'Dalam hadis Gabriel: iman kepada Allah, malaikat-Malaikat-Nya, kitab-kitab-Nya, utusan-Nya, Hari Terakhir, dan takdir adalah baik dan buruknya.'
      desc: 'Segala sesuatu dalam sumber museum tentang enam pilar iman: iman kepada Allah, malaikat-Nya, kitab-kitab-Nya, utusan-Nya, Hari Terakhir, dan takdir—baik dan buruk—dalam Al-Qur''an, Sunnah,
        Nabi, dan semua kitab lainnya.'
      scope: Di sini, apa yang disebutkan dalam kata-kata pilar iman, atau dalam bentuk gabungannya, atau menjawab pertanyaan tentang iman dan kepercayaan pada takdir, dimasukkan. Adapun rincian malaikat,
        Hari Terakhir, dan utusan, semuanya ada dalam penjejaknya.
    shuab:
      title: Orang-Orang Beriman
      short: 'Tujuh puluh dua cabang: yang tertinggi adalah pernyataan ''Tidak ada Tuhan selain Allah,'' dan yang terendah adalah menghilangkan bahaya dari jalan, dan kerendahan adalah salah satunya.'
      desc: 'Segala sesuatu dalam sumber museum tentang cabang-cabang iman: hadis dari tujuh puluh dua cabang, apa yang dianggap dalam teks sebagai iman, manisnya dan kesempurnaan iman, dan iman apa yang
        tidak lengkap tanpanya, dalam Al-Quran, Sunnah, Nabi, dan semua kitab lainnya.'
      scope: Di sini, apa yang disebut sebagai umat, yang dihitung sebagai tindakan, kata-kata, atau keadaan iman, dan apa yang melekat sebagai tindakan pada iman kepada Allah dan Hari Terakhir, serta ayat-ayat
        yang meningkatkan iman, disertakan. Kutipan judul buku Al-Bayhaqi dalam catatan pinggir tidak dianggap sebagai penyebutan bab tersebut.
    khisal:
      title: Kualitas orang percaya
      short: 'Apa yang digambarkan ayat-ayat dan hadits tentang seorang mukmin: kerendahan hati, kepercayaan, belas kasihan kepada saudara-saudaranya, kesabaran, dan kejujuran.'
      desc: 'Segala sesuatu dalam sumber museum tentang kualitas dan atribut orang beriman: ayat-ayat tentang sifat-sifat orang mukmin dan hamba Yang Maha Penyayang, hadits seperti orang beriman, deskripsi
        tentang mukmin dan Muslim, hak orang mukmin atas orang beriman, serta laporan dari para sahabat dan pengikut mengenai hal ini.'
      scope: Ini mencakup apa yang menggambarkan orang beriman atau Muslim, memberinya contoh, atau merinci kualitasnya. Untuk etika secara umum, itu ada di Ethics Browser.
  topics_ui:
    status: 'Dalam bab ini, {n} dicatat: {c} catatan terpilih, {q} ayat, {s} dari Sunnah, {r} dari biografi, dan {b} dari semua kitab lainnya.'
    record: Baca catatan pintu ini di museum.
  viz:
    title: Empat Pintu
    note: Empat pintu yang bersebelahan, dan di bawah setiap bab terdapat jumlah sumber dan jumlah catatan di setiap bagian. Pilar Islam adalah lima dalam hadis 'Islam dibangun di atas lima,' dan pilar
      iman adalah enam dalam hadis Gabril, dan setiap nama terkait dengan catatannya. Angka-angka dihitung pada saat pembangunan dari catatan museum, tanpa urutan atau keputusan.
    count: '{n} Records'
