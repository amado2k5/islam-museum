qurun:
  title: Browser berabad-abad, tahun, bulan-bulan penting, dan bulan-bulan suci
  lede: 'Setiap penyebutan abad, tahun, bulan penting, dan bulan suci dalam sumber museum: abad dan generasi, tahun dan tahun yang disebutkan dalam biografi—Tahun Gajah, Tahun Duka, Tahun Delegasi, Tahun
    Ramada, dan Tahun Komunitas—dua belas bulan lunar dari Muharram hingga Dhu al-Hijjah, empat bulan suci dan Nasi, hari-hari Tashreeq, Hari Arafah, Malam Dekrit, sepuluh malam terakhir, nama-nama bulan
    di era pra-Islam dan bulan-bulan Persia, serta setiap buku yang membahasnya—mendokumentasikan catatan yang bertambah seiring dengan penerbitan teks baru.'
