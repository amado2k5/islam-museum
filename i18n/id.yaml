  title: Daftar, kalkulator, dan penghitung pro dan kontra
  lede: 'Apa yang disebutkan dalam teks museum dalam bentuk perbuatan: ayat, hadits, laporan biografi, teman, dan pengikut yang menghitung baik dan buruk, tulis, kalikan, hapus, dan timbang dalam karat,
    derajat, dan timbangan. Daftar setiap teks, kalkulator yang membaca angka yang dinamai teks untuk karya tertentu, dan penghitung ingatan yang tersimpan di browser Anda.'
  badge: Menghitung Bisnis dalam Teks
  status: Dalam salinan ini, {n} dicatat dalam bagian {s}, termasuk {r} satu baris di kalkulator; dan teks-teksnya adalah draf agar manusia dapat membacanya.
  parts_title: Bagian Halaman
  read_more: Baca artikelnya
  caveat_title: Sebelum Anda menghitung
  caveat: 'Halaman ini menjelaskan apa yang ada dalam teks dan tidak menjelaskan nasib siapa pun. Setiap angka dibaca dari teks yang disebutkan di sebelahnya, dan teks-teks itu sendiri mengaitkan angka
    tersebut dengan niat, penerimaan, penghindaran dosa besar, dan perbaikan keluhan, serta menyebutkan bahwa apa pun di atas angka tersebut adalah kebajikan yang tidak dibatasi oleh angka. Museum tidak
    mengeluarkan fatwa: jika narasi berbeda, mereka disajikan seperti yang muncul, dan jika teks tidak menentukan angka, hasilnya ditulis dengan kata-katanya sendiri dan tidak diubah menjadi angka.'
  method_title: Pendekatan Halaman
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumbernya. Teks daftar ditemukan saat disusun dalam kamus yang dijaga oleh teks kutipan: sejumlah perbuatan baik atau buruk, "sepuluh
    kali lebih" dan "tujuh ratus kali," menulis karya, menghapus perbuatan buruk, menghapus dosa dan penebusan atas mereka, pengampunan atas apa yang telah disebutkan, tingkat dan karat, apa yang sama dengan
    perbuatan yang lebih besar, timbangan dan berat atom, penulis dan penulis bisnis terhormat, yang bangkrut dan yang terbebani, serta perhitungan. Hanya menyebutkan perbuatan baik atau buruk tanpa hitungan
    tetap ada di browser baik dan buruk. Positif palsu yang didokumentasikan dikecualikan oleh pengenal, dan setiap buku yang dipanen kemudian otomatis dimasukkan bersama teksnya pada hari bagian-bagiannya
    dihapuskan. Adapun garis penghitungan, catatan tersebut dipilih dengan medan perhitungan yang membaca angka dari teks tertentu yang disebutkan.'
