  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: 'Olahraga dalam Al-Qur''an: ikatan kuda yang dipersiapkan bersama kekuatan, kuda Salomo, ''Adiyat'', ternak, ternak, dan ''Maysar'' (''al-Maysr''), yang barisnya dibacakan oleh para ahli hukum
        bersama permainan papan.'
    sunnah:
      title: Per tahun
      desc: 'Olahraga di Sahih, Muwatta, dan Sunan: Ajari anak-anakmu berenang dan memanah, berlari dengan sabbi, halal, dan mazmil, dan hanya dengan pelana, kuku, atau pisau cukur, serta "Lempar, wahai
        putra Ismail," dan "Lempar, wahai Saad, semoga ayah dan ibuku dikorbankan untukmu," dan Abyssinia bermain tombak di masjid, dan Aisha berlari dan bergulat dengan Rukana.'
    seerah:
      title: Dalam biografi
      desc: Apa yang dibawakan buku biografi dalam hal kompetisi — perjuangan Nabi dengan Rakana, pacuan kuda, dan seni kuda dalam Maghazi — dan itu terisi setiap kali bagian biografi muncul.
    books:
      title: Dalam buku-buku yang dipanen
      desc: Berita olahraga di setiap buku lain yang dipanen — yurisprudensi, sastra, sejarah, biografi, buku berkuda, dan yang disebut latihan hukum — secara otomatis dimasukkan pada hari bagiannya diterbitkan.
    curated:
      title: Rekor Terpilih di Olahraga
      desc: 'Catatan terpilih museum tentang olahraga dan kompetisi itu sendiri: olahraga kategori olahraga yang dinamai dalam yurisprudensi seperti kompetisi, taruhan, menembak, gulat, kesatria, buku berkuda,
        dan kompetisi terkenal sebagai acara.'
  sig:
    title: Lapangan kompetisi
    caption: Satu bar penggaris untuk setiap keluarga olahraga — berkuda, menembak, berenang, gulat, balap, permainan, berburu, dan olahraga modern — dan pada setiap disk untuk setiap bagian berisi catatan
      keluarga tersebut, luas wilayahnya berdasarkan nomor, dan setiap disc terhubung ke daftar bagian di bawah ini.
    legend: 'Cakram emas: rekor ada; titik samar: Belum ada apa-apa di bagian itu. Kasetnya bertuliskan: berkuda, menembak, berenang, gulat, balap, permainan, berburu, olahraga modern — dan setiap cakram
