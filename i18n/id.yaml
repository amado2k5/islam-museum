  sections:
    aima:
      title: Empat Imam
      desc: 'Para imam firihlistial yang dipelajari oleh: Abu Hanifa al-Nu''man, Malik ibn Anas, Muhammad ibn Idris al-Shafi''i, dan Ahmad ibn Hanbal — biografi, sekolah, dan apa yang mereka kenal serta
        ceritakan.'
    hanafi:
      title: Keran
      desc: 'Aliran Abu Hanifa: Teman-temannya, buku-buku, metodologi dalam deduksi, dan apa yang ia tulis di kelasnya.'
    maliki:
      title: Maliki
      desc: 'Aliran Malik ibn Anas dan masyarakat Madinah: teman-temannya, buku-bukunya, karyanya di Madinah, dan apa yang ia catat di kelas-kelasnya.'
    shafii:
      title: Shafi'i
      desc: 'Mazhab Syafi''i: teman-temannya, buku-buku, metodologi prinsip, analogi, dan apa yang diikuti oleh para ulama berikutnya.'
    hanbali:
      title: Hanbala
      desc: 'Aliran Ahmad ibn Hanbal: teman-temannya, buku-buku, metodologi narasi, sekolah, dan teks-teksnya.'
    ukhra:
      title: Doktrin Lain
      desc: 'Sekolah yurisprudensi di luar empat sekolah sebagaimana tercatat dalam warisan: sekolah Zahiri, sekolah Ja''fari, dan sekolah Ibadi — disajikan dalam bagian terpisah agar keempat sekolah tetap
        menjadi kerangka.'
    salaf:
      title: Salaf dan para pengikut
      desc: 'Generasi yang menjadi dasar hukum sebelum berdirinya aliran pemikiran: para imam Kufa, Basra, dan Hijaz di antara Tabi''in dan mereka yang mengikutinya—Ibrahim al-Nakha''i, al-Sha''bi, al-Awza''i,
        Sufyan al-Thawri, dan lainnya.'
    kutub:
      title: Buku
      desc: 'Buku dan karya yang telah mendirikan atau membandingkan aliran pemikiran—termasuk teks yang dihafal oleh para pelajar: al-Ajrumiyyah, Alfiyyat, Matn al-Quduri, Risalah Kairouani, teks Ibn Ashir,
        teks Abu Shuja'', al-Tahawiyya, al-Waraqat, al-Bayquniyya, al-Jazariyyah, dan al-Shatibiyyah—bersama dengan al-Muwatta, al-Hidayah, al-Mughni, penelitian komparatif, dan sejarah madhhab.'
    mafahim:
      title: Konsep
      desc: 'Kosakata hukum dan prinsip-prinsipnya yang berputar di sekitar aliran pemikiran: aliran itu sendiri, ijtihad, analogi, preferensi, peniruan, perbedaan, ulama hadits, dan opini.'
    dhikr:
      title: Penyebutan dalam Sumber
      desc: Setiap buku, kutipan, atau pertanyaan di museum menyebutkan empat aliran pemikiran atau salah satunya — sejarah sekolah, lapisan ahli hukum, fatwa, dan isu komparatif — beserta sumbernya.
