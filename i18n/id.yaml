places:
  title: Browser Tempat Suci dan Penting yang Bernilai dalam Islam
  lede: 'Setiap tempat suci, penting, atau berharga dalam Islam yang disebutkan dalam sumber museum: tiga situs suci di Mekah, Madinah, dan Yerusalem, situs ziarah, situs biografi dan kampanye, tempat-tempat
    yang dinamai oleh Al-Qur''an, tanah bangsa-bangsa yang diceritakan, semua situs yang dihormati, dan setiap tempat atau bangunan yang disebutkan dalam ayat, hadis, berita dari biografi, laporan Para
    Sahabat dan Pengikut, atau sebuah kitab Hassood—semuanya dengan ayat-ayat dan riwayat yang terautentikasi.'
  badge: Holy Places Browser
  status: Struktur {n} ini mencakup catatan dalam bagian {s}; teks-teks disusun untuk dibaca manusia.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa — sebuah tempat atau kompleks bangunan dalam satu gambar, beserta sumber dan triloginya. Keanggotaan Keanggotaan gambar itu sendiri: register
    dicatat dengan label tempat-browser atau margin penyebutan yang dibawa oleh teks yang dipanen; tempat yang disebutkan oleh buku kemudian dipanen muncul di sini pada hari teksnya dicatat. Pada setiap
    halaman subjek mengelompokkan teks memori berdasarkan sumber — teks Al-Quran yang dibekukan dari Wahyu (disajikan dengan referensi dan tidak ditulis ulang), berita Sunnah, berita biografi, dan buku
    lainnya — dan setiap kartu kembali ke halaman catatan atau novel itu sendiri.'
