cosmos:
  title: Penjelajah Alien, Negara Manusia Lama, dan Rahasia Alam Semesta
  lede: 'Segala sesuatu yang dikatakan sumber museum tentang apa yang ada di balik kisah manusia seperti yang kita kenal: makhluk-makhluk yang diceritakan Al-Quran kepada Allah yang menyebar di langit seperti
    Dia menyebarkannya di bumi, tujuh langit dan padanannya dari bumi, mereka yang menghuni bumi sebelum Adam, bangsa-bangsa yang binasa, orang-orang di balik bendungan, rahasia alam semesta: Takhta, Tablet
    yang Diawetkan, Pohon Lote dari Batas Tertinggi, dan kunci dari yang tak terlihat. Setiap ayat, narasi, dan bagian sebuah buku dikaitkan dengan sumbernya, dan setiap pendapat dikaitkan dengan penulisnya.'
  badge: Universe Browser
  status: Versi ini mencakup {n} sebuah catatan dalam {s} bagian; dan teksnya adalah draf sampai manusia dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Sumber-sumber ini tidak membahas ''makhluk ekstraterestrial'' dalam arti yang dimaksud oleh pembaca kontemporer, melainkan tentang hewan yang telah disebarkan Tuhan di langit, tentang banyak
    dunia, tentang jin dan malaikat, tentang penciptaan sebelumnya, dan tentang bangsa-bangsa yang punah. Browser ini mengumpulkan referensi spesifik ini dan menempatkan interpretasi para penafsir di samping
    masing-masing. Tidak ada penilaian yang dikeluarkan: di mana pun para ulama berbeda atau memperdebatkan rantai transmisi, catatan mencatatnya dan mendokumentasikan setiap sisi. Ayat-ayat Al-Quran dipilih
    dari tabel referensi, dan semua referensi ditemukan pada saat penyusunan dalam kamus yang dijaga dengan ketat tentang teks bagian-bagian tersebut. Jika sebuah buku baru diterbitkan, referensinya muncul
    pada hari bagian-bagian tersebut diterbitkan.'
