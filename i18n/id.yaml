  section_ledes:
    web: Situs web, portal, forum, perpustakaan digital, aplikasi, permainan, dan perangkat yang dibuat oleh Muslim atau terkait Islam, dalam bahasa apa pun.
    music: Album, lagu, dan artis lagu-lagu kebangsaan, qawwali, na'at, ramalan, dan nyanyian, serta setiap lagu oleh Muslim tentang Islam atau agama, beserta penghargaan dan popularitas sejarahnya.
    film: Film, dokumenter, film pendek, dan gambar tentang Islam sejak 1976, dari aula pemutaran.
    tv: serial, program, dan musim Ramadan tentang Islam sejak 1976, dari ruang pemutaran.
    conferences: Konferensi, forum, KTT, dan pertemuan berkala dalam sesi-sesi mereka.
    heritage: Bulan dan hari warisan, festival, acara, dan pertemuan.
    rights: Protes yang membela Islam dan melawan Islamofobia, insiden, undang-undang, keputusan, dan laporan yang menanggapinya; dua suara di mana pendapat berbeda dan tanpa penilaian.
    books: Buku tentang Islam dan penulis Muslim sejak 1976, bersama dengan penerbitnya, perpustakaan, pameran, dan penghargaan.
    upcoming: 'Apa yang telah diumumkan namun belum dilakukan: bangunan yang sedang dibangun, film yang sedang diproduksi, konferensi dan kompetisi yang dijadwalkan, serta buku dan album yang diumumkan.'
    figures: 'Muslim selama lima puluh tahun terakhir berdasarkan bidang: cendekiawan dan pengkhotbah, politik, diplomasi, keuangan, ilmu pengetahuan, kedokteran, universitas, pendidikan, penulisan, seni,
      media dan pembuat konten, aktivitas publik, olahraga.'
    organizations: 'Organisasi Islam berdasarkan negara, global, dan virtual: dewan dan asosiasi amal, badan mahasiswa dan profesional, advokasi dan dialog agama, lembaga pemikir, dan komunitas daring.'
    media: Surat kabar, majalah, buletin, situs berita, saluran televisi, stasiun radio, saluran, dan podcast tentang Islam dan Muslim.
    sports: 'Muslim dalam Olahraga: Atlet, tim, kejuaraan, hasil, dan rekor.'
    awards: Penghargaan, kehormatan, klasifikasi, dan kompetisi, termasuk kompetisi Al-Qur'an, dalam edisi dan pemenangnya masing-masing.
    achievements: 'Pemenang, preseden, dan rekor: Nobel dan penghargaan besar lainnya, astronot, preseden Olimpiade, yang pertama memegang posisi.'
    enterprise: 'Semua jenis bisnis yang didirikan atau dimiliki oleh Muslim sejak 1976: perusahaan, industri, jaringan, toko kelontong, perjalanan, merek, fashion, toko, klinik, mesin kasir, dan bank;
      terdaftar, bukan Zakat.'
    arts: Kaligrafi, seni visual, mode, komedi, puisi, teater, pameran, museum, dan biennale.
    built: Masjid, pusat Islam, museum, dan kampus yang dibangun atau selesai sejak tahun 1976, serta karya Dua Masjid Suci.
    learning: universitas, perguruan tinggi, institut, akademi online, hibah, terjemahan, dan perpustakaan digital.
