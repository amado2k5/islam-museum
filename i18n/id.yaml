      desc: Kenangan tentang dosa dalam setiap karya yang terjadi kecuali Al-Quran, Hadis, dan biografi—buku asketisme, kehalusan, fiqhondersi, tafsir, puisi, sejarah, dan sebagainya—diklasifikasikan berdasarkan
        jenis karya pada hari bagian-bagiannya dihentikan.
    curated:
