munazarat:
  title: Peramban Debat
  lede: 'Setiap penyebutan debat dan perdebatan dalam sumber museum: argumen Al-Qur''an — Abraham dengan umatnya dan Nimrod, Musa dengan Firaun, ayat Mubahala, dan "berdebat dengan mereka dengan cara terbaik"
    — perdebatan Nabi, Para Sahabat, dan Pengikut dengan Yahudi, Kristen, dan politeis, debat Ibn Abbas dengan Kharijit di Hurura, debat para ulama dalam konsili dan konsili, debat modern — catatan dengan
    sumber-sumbernya yang berbicara setiap kali teks baru ditambahkan.'
  badge: Penjelajah Debat
