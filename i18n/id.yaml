ukhuwwa:
  title: Browser Ikhwanul Muslimin Islam
  lede: 'Persaudaraan dalam Islam dalam sumber-sumber museum: persaudaraan di antara orang beriman dan Muslim — orang beriman adalah saudara, dan Muslim adalah saudara Muslim — dan saudara-saudari itu sendiri,
    persaudaraan Nabi antara para emigran dan Ansar serta mereka yang menjadi saudara di antara para Sahabat dan Pengikut, kasih demi Tuhan dan kasih sayang kepada-Nya, altruisme dan dukungan saudara serta
    memenuhi kebutuhan mereka, hak seorang Muslim atas saudaranya seperti mengunjungi dan membanggakan diri, menerima dan membalas salam, serta apa yang memisahkan persaudaraan dari iri hati, kebencian,
    pengabaian, kecurigaan buruk, dan fitnah — dalam Al-Qur''an, Sahih, Muwatta, Sunan, buku biografi, tradisi para sahabat dan pengikut, dan setiap buku yang tercatat — catatan sumber-sumber mereka bertambah
    dengan diperkenalkannya teks baru.'
  badge: Penjelajah Ikhwanul Muslimin dalam Islam
  status: Struktur {n} ini berisi catatan dalam bagian {s}; dan teks-teksnya disusun agar manusia dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumber dan prosa dalam tujuh bahasa. Kenangan tentang persaudaraan pada masa pembangunan ditemukan dalam sebuah kamus yang dijaga
    oleh teks ayat-ayat dalam enam keluarga: saudara, saudara, dan saudari (saudara, saudara, saudara, saudari, orang beriman adalah saudara, Muslim adalah saudara Muslim), persaudaraan (saudara, saudara,
    persaudaraan, emigran, dan ansar, di sebelah kata saudara), kasih demi Tuhan (kasih demi Tuhan, cinta kepada Tuhan, mereka saling mencintai, mereka mencintai saudara mereka), altruisme dan dukungan
    (mereka lebih suka, altruisme, mendukung saudaramu, dalam kebutuhan saudaranya, seperti bangunan, seperti tubuh), dan hak saudara (hak saudaranya, hak seorang Muslim atas Muslim lain, mengunjungi orang
    sakit, membanggakan orang yang bersin, Menjawab undangan, membalas salam), dan peringatan tentang persaudaraan (iri hati, benci, ditinggalkan, anggapan buruk, menghina saudara). Kata-kata ambigu dijaga
    dengan baik: ''saudara'' abstrak hanya dianggap sebagai tambahan atau konstruksi yang tepat; ''dari saudaranya'' dalam rantai tidak dihitung kecuali kata persaudaraan lain dibuat; ''i''idah wa tamit''
    hanya dianggap di samping konteks hak; ''iri hati, penghinaan, dan pengabaian'' hanya dihitung di samping kata ''saudara''; dan positif palsu yang tercapai dikecualikan oleh definite. Setiap buku yang
    dipanen kemudian secara otomatis membawa ingatannya ke sini; catatan terpilih dimasukkan dengan label ukhuwwa-browser; dan saudara terdaftar dibaca dari tepi sibling_of dalam gambar yang sama.'
