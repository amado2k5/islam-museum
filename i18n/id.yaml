messengers:
  title: Browser Messengers dan Prophets
  lede: 'Setiap penyebutan para rasul dan nabi dalam sumber museum: para nabi dan rasul yang disebutkan dalam Al-Qur''an, Sunnah, dan biografi, pemilik cerita, silsilah, dan misi, para nabi yang tidak disebutkan
    namanya, serta setiap penyebutan utusan dan nabi dalam setiap kitab yang ditemukan — catatan dengan sumbernya yang berbicara setiap kali teks baru ditambahkan.'
  badge: Penjelajah Para Rasul dan Nabi
  status: Struktur ini mencakup {n} catatan dalam bagian {s} dan halaman topik {p}; teks-teks tersebut disusun untuk tinjauan manusia.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — dengan sumber dan narasi triadiknya. Penyebutan nabi dan utusan ditemukan dalam kamus yang dibangun berdasarkan teks suku kata — nama-nama
    yang disebutkan cocok langsung, nama ambigu seperti "Saleh" dan "Yahya" hanya dihitung bersama struktur mereka sendiri, "putra Adam" dikecualikan karena berarti manusia, bukan Adam, positif palsu yang
    diverifikasi dikecualikan oleh artikel pasti; ayat dan hadits yang terkait dengan sebutan eksplisit juga disertakan; setiap buku yang dipanen kemudian secara otomatis masuk ke ingatan utusan dan nabi
    mereka segera setelah teks mereka muncul dalam gambar, dan catatan terpilih disertai dengan tag messengers-browser.
