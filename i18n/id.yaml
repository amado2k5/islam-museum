usra:
  title: Browser Keluarga dan Pernikahan
  lede: 'Pernikahan paling terkenal dalam Islam dan keluarga Muslim dalam sumber museum: pernikahan Nabi dan Para Sahabat, pasangan dan anak-anak di rumah Muslim, tempat tinggal dan kamar mereka, mata pencaharian,
    penernihan, dan pengeluaran mereka, rincian kehidupan sehari-hari mereka termasuk tidur, pakaian, makanan, dan pelayanan, serta adat sosial mereka seperti mencari izin, dekat dengan mereka, keramahan,
    hadiah, dan hidup bersama dalam kebaikan — dalam Al-Qur''an, Sahih, Muwatta, Sunan, buku biografi, karya Para Sahabat dan Pengikut, dan setiap buku yang tercatat — catatan sumbernya terus bertambah
    dengan setiap teks baru.'
