      title: Bahasa Arab adalah bahasa Al-Qur'an
      desc: Mengapa wahyu itu diwahyukan dalam bahasa Arab seperti yang dijelaskan oleh para komentator, bahasa Quraisy, tujuh huruf, dan apa yang dikatakan generasi awal tentang belajar bahasa Arab?
