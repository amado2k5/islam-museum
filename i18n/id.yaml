    shajara:
      title: Pohon Para Nabi dan Utusan
      desc: 'Generasi Nabi dan Para Nabi Keturunan Abraham: rantai yang disepakati dari Abdullah ibn Abd al-Muttalib hingga Adnan, hubungan yang diperdebatkan dari Adnan ke Ismael, dan naskah Ishak kepada
        Yesus, putra Maria—setiap episode tercatat dengan sumber dan kisahnya.'
    tribes:
      title: Suku dan klan
      desc: 'Suku-suku Arab dan klan mereka, sebagaimana disebutkan dalam buku silsilah dan biografi: Quraysh dan klan mereka Hashim, Umayyah, Abd Shams, Makhzum, Zahra, Al-Najjar, Al-Aws, Al-Khazraj, Khuza''ah,
        Tamim, Hawazin, Thaqif, Ghatfan, Hudhayl, Sulaym, Asad, Juhayna, Muzayna, Ghafar, Ashja'', Al-Azd, Lakhm, Ghassan, Hamdan, Himyar, Madhhij, Quda''a, Tay'', Shayban, Bakr, Taghlib, Abdulqays, Kindah,
        Dabba, Rubbu'', Kanana, Murad, Anmar, Abs, dan Amir, serta suku-suku Yahudi Hejaz Al-Nadir, Qaynuqa, Qurayza, dan ''Ad dan Thamud termasuk di antara Arab yang punah.'
    peoples:
      title: Ras dan bangsa
      desc: 'Ras dan bangsa yang disebutkan dalam teks: Arab, non-Arab, Persia, Romawi, putra-putra Kuning dan Abyssinia, Koptik, Turki, Berber, Kurdi, Mongol, dan Israel — di antara mereka dikatakan, "Tidak
        ada Arab yang lebih unggul dari non-Arab kecuali karena kesalehan."'
    butun:
      title: perut
      desc: 'Klan suku—di bawah suku dan di atas paha—banyak dalam buku silsilah dan biografi: klan Quraysh Hashim, Al-Muttalib, Abd Manaf, Abd Shams, Abd al-Dar, Makhzum, Jumah, Sahm, Zahra, Taym, Uday,
        dan Umayyah; klan Aws, Khazraj, Al-Najjar, Abd Al-Ashhal, Dhafar, Haritha, Al-Harith, Salmah, Zurayq, Bayadah, Amr ibn Awf, Khatma, Waqif, Mughala, Al-Ajlan, Dhubaybah, Sa''id, dan Salul; serta
        klan Hawazin, Qays Darm, Hanzalah, Fazarah, Murrah, Kilab, Nasr, Jashm, Aqil, dan Sa''d ibn Bakr.'
    curated:
      title: Catatan genealogis
      desc: 'Konsep garis keturunan di kalangan para cendekiawan: garis keturunan dan garis keturunan, tiga jenis garis keturunan Nabi, umat garis keturunan, jeda garis keturunan menurut Ma''ad, dan validitas
        garis keturunan dalam hukum.'
    mentioned:
      title: Item lain yang disebutkan
      desc: Catatan secara otomatis digabungkan untuk disebutkan dalam bagian atau dimuat dengan tag browser — ini berkembang setiap kali nama, suku, atau badan baru muncul dalam buku yang dipanen.
  viz:
    title: Pohon suku
    note: 'Suku, bangsa, dan klan digambar semata-mata dari hubungan diagram epistemik: kelompok tergantung di bawah kelompok yang menjadi bagian atau anggotanya, atau di bawah kelompok yang catatannya
      sebut pendirinya, dan nenek moyang pendiri berdiri di samping kelompok yang mendirikannya. {e} terhubung dengan {n} dari catatan grup {t} dalam pohon {r}; dan {u} tidak berhubungan dengan subjek lain,
      yang ada di bawahnya. Ukuran lingkaran mengikuti jumlah penyebutan subjek dalam sumber museum, dengan akar kuadrat memiliki batas atas.'
