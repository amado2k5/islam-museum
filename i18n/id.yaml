mukatabat:
  title: Browser Korespondensi
  lede: 'Setiap penyebutan korespondensi dalam sumber museum: buku-buku yang dikirim Nabi kepada raja dan kaisar, buku-buku yang diterima, tanggapan, dan laporan; surat-surat khalifah kepada gubernur mereka
    dan apa yang ditulis kepada mereka; kitab Salomo kepada Bilqis tentang Al-Qur''an; setiap penyebutan korespondensi dalam biografi, buku hadis, dan setiap buku yang ditemukan — catatan dengan sumbernya
    yang berbicara setiap kali teks baru ditambahkan.'
  badge: Penjelajah Korespondensi
  status: Struktur ini mencakup {n} sebuah catatan dalam {s} bagian; teks disusun agar manusia dapat meninjaunya.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — dengan sumber-sumbernya dan prosa triharfiah. Korespondensi ditemukan selama proses pembuatan dengan detektor yang dijaga pada teks bagian
    — tanda-tanda pengiriman, pembawaan, pembukaan, penemuan, bacaan, dan balasan, pembukaan buku yang dikaitkan ("Dari Muhammad ke Heraclius," "Dari Umar kepada Muawiya"), judul buku yang dimulai dengan
    Basmala, koleksi segel, pos, komposisi, dan pemilik pos, serta nama umum "korespondensi"; korespondensi yurisprudensial budak, makna kitab ilahi, penulisan utang, jumlah "ila," halaman Al-Qur'an dikecualikan,
    dan positif palsu yang diverifikasi oleh pengenal dikecualikan. Setiap buku yang terjadi kemudian secara otomatis muncul di sini ketika bagiannya ditempatkan pada bagan; catatan terpilih digabungkan
    dengan tag mukatabat-browser. Setiap bagian menunjukkan "buku" jika memang buku, dan "mencantum" jika hanya berkaitan dengan korespondensi. Flakes pengirim mengklasifikasikan korespondensi sebagai profetik,
    kontroversial, royal, atau lainnya.
