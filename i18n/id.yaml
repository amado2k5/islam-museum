      desc: 'Tanda-tanda Api: Tujuh nama, sifat, hukuman, dan orangnya, "Maka takutlah Api," keabadian umatnya, dan berita tentang Hari Kebangkitan di dalamnya — setiap ayat menyebutkan Api Akhirat atau
        memperingatkan terhadapnya.'
    sunnah:
      title: Per tahun
      desc: 'Berita tentang Api di dua Sahih, Al-Muwatta, dan Sunan: "Waspadalah terhadap Api, meskipun beratnya seperti kurma," penampakannya, gerbangnya, gudangnya, para pelayannya, Sirat di papannya,
        dan kata-kata para Sahabat serta Pengikut tentangnya.'
    seerah:
      title: Dalam biografi
      desc: Apa yang tertulis dalam biografi dan buku sejarah tentang menyebutkan api — bagian ini mengisi bagian yang sama setiap kali teks biografi baru menyebutkan api diterbitkan.
    books:
      title: Dalam buku lain
      desc: Menyebutkan api dalam setiap karya yang terjadi kecuali Al-Qur'an, Hadis, dan biografi—tafsir, kredo, sejarah, puisi, dan lainnya—diklasifikasikan berdasarkan kategori karya pada hari bagian-bagiannya
        diungkapkan.
    dunya:
      title: Api dunia
      desc: 'Api duniawi dalam teks-teks: api Abraham (menjadi sejuk dan damai), api pohon Musa di Lembah Suci, api perang, memasak, dan pencahayaan, serta api orang-orang parit — masing-masing menyebutkan
        api dunia di raknya sendiri.'
    curated:
      title: Kayu api
      desc: 'Catatan terpilih museum tentang Api itu sendiri: Neraka dan atributnya, pemilik harta karunnya, Zaqqum, Sirat, orang-orang Neraka, dan orang-orang Surga — catatan konseptual di mana kenangan
        itu berdiri.'
islamic_economy:
