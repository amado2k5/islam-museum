arabiyya:
  title: Browser Bahasa Arab Bahasa Al-Qur'an
  lede: 'Arab seperti yang disebut Al-Qur''an dan dijelaskan oleh sumber: ayat-ayat di mana Al-Qur''an berbicara tentang bahasanya, apa yang diceritakan dari Nabi, para sahabat, dan para pengikut, laporan
    dari mereka yang mendengarnya, diskusi tentang mukjizat ungkapannya, lalu sejarah bahasa Arab, aksara, ilmu pengetahuan, dialek, ulama, sarjana, dan buku.'
  badge: Penjelajah Bahasa Arab
  status: Dalam edisi ini, {v} adalah ayat di mana Al-Qur'an berbicara dari bahasanya, {p} berisi teks dari hadits, biografi, tafsir, dan kumpulan buku yang membahas bahasa Arab, dan {r} adalah catatan
    yang telah diedit. Teks-teks tersebut ditangkap dengan kata-kata mereka sendiri; beberapa menyebut bahasa Arab secara singkat; setiap teks dibuka ke halaman dan sumbernya.
  method_title: Kurikulum Browser
  method_note: Tidak ada yang disimpan di sidebar di sini. Teks-teks tersebut ditangkap saat membangun situs dengan mencocokkan kata-kata dari setiap catatan teks dalam peta pengetahuan museum, sehingga
    setiap buku yang dikumpulkan kemudian teksnya muncul pada hari masuk. Catatan yang diedit adalah catatan reguler di museum yang diberi label Arabiyya-browser dan Arabiyya-<bagian>. Teks ayat-ayat hanya
    diambil dari file unduhan yang dibekukan. Jika para ahli berbeda pendapat, catatan tersebut menyebutkan setiap pernyataan yang dikaitkan dengan pemiliknya tanpa keraguan.
  api: Semua data di
  contents_title: Di halaman ini
  empty: Belum ada log di versi ini.
  passages_title: Apa yang dikatakan sumber tentang Al Arabiya
  passages_note: 'Teks dari buku-buku yang dikumpulkan oleh museum berisi kata-kata tentang bahasa Arab: bahasa Quraisy, bahasa orang Arab, pembelajaran bahasa Arab, tata bahasa dan penulisnya, melodi,
    serta sifat ajaib Al-Qur''an. Kutipan ini adalah awal dari teks seperti yang tercantum dalam sumbernya; dan apa yang dibaca secara mekanis dalam bentuk cetak mungkin mengandung kesalahan bacaan.'
