      Surah panjang mungkin berisi lebih banyak karena hanya lebih panjang. Setiap titik membuka ayat pertama yang Anda hitung. Tempat wahyu disebutkan dalam catatan surah.'
  title: Baath Browser, Hari Penghakiman, dan Kisah
  lede: 'Setiap penyebutan tentang kebangkitan, Hari Penghakiman, dan perhitungan dalam sumber-sumber museum: nama-nama hari dalam Al-Qur''an — Al-Haqqa, Al-Qari''ah, Al-Sakha, Al-Ghashiyyah, Hari Penghakiman,
    Hari Penghakiman, kemunculan orang mati dari kubur dan kebangkitan, kengerian, keringat, matahari yang mendekat, penyajian dan koran, hal pertama yang harus dipertanggungjawabkan oleh hamba, skala dan
    timbangan, pembalasan di antara ciptaan, bayangan, cekungan, perantaraan, dan jalan — setiap ayat dan berita dengan sumbernya, dalam setiap kitab yang terjadi, tumbuh dengan setiap teks baru yang terungkap.'
  badge: Penjelajah Kebangkitan, Kebangkitan, dan Penghitungan
  status: Struktur ini berisi {n} sebuah catatan dalam {s} bagian; teks adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa — dengan prosa dan prosa tribahasa. Kenangan ditemukan saat disusun dalam kamus yang dijaga berdasarkan teks bagian-bagian: struktur tetap
    hari tersebut adalah "Hari Penghakiman," "Hari Penghakiman," "Hari Penghakiman," "Hari Penghakiman," dan nama-namanya "Al-Haqqa," "Al-Qari''ah," "Al-Sakha," dan "Al-Ghashiyah" dihitung langsung; kata-kata
    ambigu — "Baath" (mengirim Rasul), "Al-Sa''ah" (jam waktu), "Hisab" (perhitungan numerik), "Al-Sirat" (jalan petunjuk), "Shafa''ah" (perantara) — hanya dihitung bersama dengan gabungan Baath atau Hisab,
    dan positif palsu yang didokumentasikan oleh artikel pasti dikecualikan. Setiap buku yang diperoleh kemudian secara otomatis membawa kenangannya ke sini ketika bagian-bagiannya muncul pada bagan; catatan
    terpilih bergabung melalui tag qiyama-browser. Setiap bagian menandai "kebangkitan" (kebangkitan dan kebangkitan), atau "hari" (nama hari dan kengeriannya), atau "catatan" (perhitungan, skala, koran,
    dan tipas). Status antara dan pertanyaan tentang makam tetap ada dalam penjelajah tanda-tanda jam; tanda-tanda, surga, dan neraka memiliki penjelajah masing-masing.'
