wasaya:
  title: Penerok perintah para nabi, utusan, orang-orang benar, imam, pengikut, khalifah, sahabat sebelum kematian, warisan mereka, warisan mereka, dan makam mereka
  lede: 'Segala sesuatu yang disebutkan dalam sumber museum tentang perpisahan para nabi, utusan, khalifah, sahabat, pengikut, imam, dan orang-orang yang benar: apa yang mereka rekomendasikan setelah mereka,
    apa yang mereka katakan di jam-jam terakhir mereka, apa yang mereka tinggalkan, apa yang disimpan dari barang-barang mereka setelah mereka, dan di mana buku-buku menyebutkan bahwa barang-barang itu
    dikuburkan. Setiap materi di sini adalah ayat, berita, atau catatan yang dikaitkan dengan sumbernya.'
  badge: Penjelajah Perintah
  hero_kufi: Wasiat · Warisan · Antik · Kuil
  hero_naskh: Apa yang mereka sarankan sebelum berangkat, apa yang mereka tinggalkan, dan di mana tempat peristirahatan mereka
  status: Dalam salinan ini, {n} adalah catatan dalam bagian {s}; setiap catatan menyebutkan sumbernya, dan teks-teks tersebut ditulis oleh agen kecerdasan buatan dari sumber-sumber tersebut dan belum dibaca
    oleh manusia.
  method_title: Kurikulum Browser
  method_note: 'Browser ini mengumpulkan apa yang telah dikatakan dan ditulis dalam lima hal terkait: perintah dan perjanjian terakhir, jam kematian, warisan dan apa yang tertinggal, relik yang dijaga,
    serta pemakaman dan makam. Ayat-ayat Al-Qur''an diambil dari tabel referensi (perintah Abraham dan Yakub, perintah Luqman, ayat-ayat wasiat, warisan, barang kuno, kematian, dan pemakaman), dan teks
    ayat tersebut adalah teks wahyu yang dibekukan dan tidak dapat ditulis ulang. Segala hal lainnya, termasuk hadits, biografi, sejarah, dan biografi, dikumpulkan pada saat penyusunan dalam daftar kata
    yang dijaga dengan cermat, sehingga di sini setiap bagian buku dipanen kemudian pada hari masuk. Kutipan buku dapat dibaca mesin dari salinan yang direkam, sekitar empat puluh kata, dan tidak dikoreksi.
    Di sini, putusan kewajiban umum tidak digabungkan di antara para ahli hukum, melainkan warisan individu dan hadits Nabi mengenai warisan para nabi. Penentuan lokasi makam adalah pernyataan dari sumber
    yang disebutkan, bukan pernyataan dari museum. Sumber tradisional adalah kerangka, dan pendapat lain disebutkan sebelum disebutkan.'
