        hadits tentang kebenaran, ketidakpatuhan, pemutusan ikatan keluarga, ''aqiqah, tahnik, penamaan, panggilan salat di telinga bayi yang baru lahir, dan hak-hak anak-anak serta didikan yang benar.'
