ahkam:
  title: Browser Kewajiban, Kewajiban, Ketaatan, Hal-Hal yang Disarankan, Hal yang Tidak Disukai, Tindakan Terlarang, dan Dosa Kecil
  lede: 'Satu browser untuk tingkat permintaan: kewajiban wajib, kewajiban wajib dan komunal, kewajiban, tindakan yang direkomendasikan, larangan, tindakan yang tidak disukai, dosa kecil, dan apa yang tersisa
    dari putusan, yaitu apa yang diperbolehkan dan konsesi. Museum ini mengumpulkan setiap tempat yang disebutkan dalam Al-Quran, Sunnah, biografi, karya Para Sahabat dan Pengikut, serta buku-buku prinsip
    dan yurisprudensi yang dikumpulkan oleh museum. Museum ini menjelaskan apa yang dikatakan teks dan ahli hukum, dan tidak mengeluarkan keputusan.'
  badge: Request Grade Explorer
  status: Salinan {n} ini berisi catatan dalam bagian {s}, setiap catatan didokumentasikan di sumbernya.
  method_title: Cara kerja browser
  method_note: Setiap catatan di sini adalah catatan museum biasa dengan sumbernya sendiri. Ayat-ayat Al-Qur'an diambil dari tabel referensi untuk ayat-ayat yang kata-katanya membawa subjek yang sama dengan
    topik tersebut, seperti 'Kitab untukmu,' 'Kewajiban dari Allah,' 'Taat kepada Allah,' 'Aku telah melarangmu,' dan 'Tidak ada kesalahan padamu,' dan teks ayat tersebut adalah teks wahyu yang dibekukan
    dalam daftarnya. Setiap bagian lain yang ditemukan selama proses pembuatan dicatat sebagai kata yang dilindungi; jika sebuah buku kemudian dipanen, bagian-bagiannya muncul di sini pada hari penambahannya.
    Larangan abstrak, seperti pepatah mereka 'larangan,' tidak diklasifikasikan karena merupakan larangan atau ketidaksukaan terhadap pembacaan yang dilakukan oleh seorang ahli hukum, sehingga laporan semacam
    itu tidak dimasukkan kecuali kata-katanya disebutkan sebagai tingkat keputusan. Kutipan dari buku hasil pindai dibaca secara mekanis dan tidak dikoreksi, dan terjemahan bersifat otomatis dan belum dibaca
    oleh manusia. Jika aliran berbeda, seperti aliran pemikiran Hanafi, membedakan antara wajib dan wajib, catatan menyebutkan hal ini dan menyebutkan setiap pendapat.
  api: Set data lengkap tersedia di
  sections_title: Departemen
  filter_label: Filter catatan
  filter_none: Tidak ada hasil yang cocok.
  empty: Belum ada catatan di bawah topik ini dalam versi ini.
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: 'Ayat-ayat yang kata-katanya membawa topik dari topik-topik ini meliputi: apa yang tertulis dan wajib, perintah untuk taat kepada Allah dan Rasul-Nya, apa yang benar untuk kebaikan yang saleh
        dan sukarela, apa yang dilarang, apa yang tidak disukai, tuduhan, ayat tentang penyangkalan sayap, izin, dan fasilitasi.'
    sunnah:
      title: Per tahun
      desc: 'Hadits dari dua Sahih, Sunan, dan Al-Muwatta: apa yang Allah wajibkan dan apa yang Rasulullah lakukan tindakan sukarela wajib bersama dengan tindakan wajib, hadis ''Seandainya bukan karena
        kesulitan bagi bangsaku,'' apa yang tidak disukai, konsesi, dosa kecil, dan apa yang tertulis dari perbuatan para ahli hukum.'
    seerah:
      title: Dalam biografi
      desc: 'Apa yang dibawakan oleh buku-buku biografi tentang topik-topik ini: delegasi pengajaran, buku tentang amal wajib, awal dari kewajiban wajib, dan melonggarkan beberapa di antaranya.'
    books:
      title: Dalam buku lain
      desc: Buku-buku tentang prinsip-prinsip fiksi yang menentukan derajat, termasuk "Al-Risalah" oleh Al-Shafi'i, "Al-Burhan" oleh Al-Juwayni, "Al-Mustasfa" oleh Al-Ghazali, "Al-Muwafaqat" oleh Al-Shatibi,
        "Irshad al-Fuhul" oleh Al-Shawkani, buku yurisprudensi tentang empat aliran, komentar hadits, karya-karya Para Sahabat dan Pengikut, dan lainnya.
    curated:
      title: Catatan dalam Penilaian Permintaan
      desc: 'Catatan museum sendiri mengenai topik-topik ini meliputi: lima keputusan gabungan, wajib dan kategorinya, ketaatan, kewajiban, rekomendasi, terlarang, tidak disukai, diperbolehkan, konsesi,
        dan dosa kecil.'
  topics:
    fard:
      title: Asumsi
      desc: 'Segala sesuatu dalam sumber museum adalah apa yang disebut kewajiban: apa yang Tuhan tetapkan wajib dan apa yang Rasul-Nya tetapkan, apa yang ''ditetapkan kepadamu,'' kewajiban, dan kewajiban
        para ahli hukum.'
      definition: Dalam kitab prinsip, menurut mayoritas, kewajiban adalah nama lain untuk kewajiban, yang memuji pelakunya dan mengutuk orang yang mengabaikannya. Hanafi menetapkan kewajiban selama dibuktikan
        oleh bukti yang pasti, dan kewajiban seolah-olah ditetapkan oleh bukti spekulatif.
      scope: Di sini termasuk teks yang menggunakan istilah seperti kewajiban, kewajiban, dan kewajiban, seperti "kewajiban Tuhan," "kewajiban kepadamu," dan "ditetapkan kepadamu." Pengecualian berlaku
        untuk bagian warisan, yang juga disebut kewajiban, pemberian, dan mas kawin yang ditetapkan.
    fard-ayn:
      title: Kewajiban mata
      desc: 'Segala sesuatu dalam sumber museum tentang kewajiban yang harus dipenuhi setiap orang dan tidak dilakukan oleh orang lain: "Kewajiban bagi setiap Muslim," "Kewajiban bagi setiap orang dewasa,"
        dan kewajiban mata menurut para ahli hukum.'
      definition: 'Apa yang dibutuhkan dari setiap orang yang bertanggung jawab sendiri tidak dikesampingkan oleh tindakan orang lain: lima shalat harian, puasa, zakat, dan Haji bagi mereka yang mampu.'
      scope: Teks-teks yang tercantum di sini adalah yang menggunakan istilah tersebut, dan teks yang memberlakukan kewajiban "kepada setiap Muslim" atau "kepada setiap orang dewasa." Al-Qur'an tidak menggunakan
        istilah tersebut, dan ayat-ayat dari setiap tindakan ibadah ditemukan di bawah tindakan wajib.
    fard-kifaya:
      title: Kewajiban Kecukupan
      desc: 'Segala sesuatu dalam sumber museum tentang tugas yang jatuh pada komunitas: jika ada yang memenuhinya dengan cukup, dosa itu diangkat dari yang lain, dan jika tidak ada yang melakukannya, itu
        adalah dosa bagi semua orang.'
      definition: 'Apa yang ingin dicapai oleh Pembuat Hukum tanpa memperhatikan siapa pun yang melakukannya: doa pemakaman, membalas salam, memperoleh pemahaman dalam agama, dan jihad jika jumlahnya cukup.
        Al-Shafi''i menjelaskan hal ini dalam "Al-Risalah" dari dua ayat.'
      scope: Di sini termasuk teks yang menggunakan istilah tersebut atau menyebutkan keputusannya, seperti "Jika ada yang melakukannya, maka dibebaskan dari yang lain," dan dua ayat dari mana Al-Shafi'i
        mengambil putusan ini.
    taat:
      title: Tindakan ketaatan
      desc: 'Segala sesuatu dalam sumber museum tentang ketaatan kepada Tuhan dan Utusan-Nya serta tentang tindakan ketaatan adalah: "Taatilah Tuhan," "Siapa pun yang taat kepada-Ku telah menaati Tuhan,"
        dan "Tidak ada ketaatan dalam ketidakpatuhan; ketaatan hanya ada dalam apa yang baik."'
      definition: 'Teks-teks tersebut membedakan ketaatan dan ketidaktaatan itu: "Siapa pun yang taat kepada-Ku telah menaati Allah, dan siapa pun yang membangkang kepada-Ku telah membangkang Allah," dan
        mereka menetapkan batas untuk: "Ketaatan hanya ada dalam apa yang baik." Penonton menempatkannya di atas dua derajat tindakan, wajib dan direkomendasikan.'
      scope: Teks-teks yang tercantum di sini adalah yang memerintahkan ketaatan kepada Allah dan Rasul-Nya atau memuji mereka, serta teks yang menyebutnya ketaatan. Adapun ketaatan kepada mereka yang berwenang,
        yaitu mendengar dan taat, tidak dihitung kecuali jika ada beberapa di antaranya.
    wajib:
      title: Tugas
      desc: 'Segala sesuatu dalam sumber museum menggunakan istilah ''kewajiban'' dan kata kerjanya: ''wajib padaku,'' ''hak bagi setiap Muslim,'' ''Jika aku bilang ya, itu wajib,'' dan kewajiban para ahli
        hukum.'
      definition: Kewajiban adalah yang memuji pelaku dan mengkritik orang yang meninggalkannya, seperti yang dikatakan Al-Shawkani. Kewajiban dibagi menjadi 'Ma'ir dan Mukhtar', menjadi 'Mu'diq dan Mu'sa'a',
        serta 'Aini' dan 'Kafā'i'.
      scope: Teks-teks yang tercantum di sini adalah yang menggunakan kewajiban, kewajiban, 'kewajiban terhadapnya,' dan 'haqq 'ala'. Pengecualian dibuat 'Surga wajib baginya' dan 'Kewajiban penjualan.'
    mustahabb:
      title: Tindakan yang direkomendasikan
      desc: 'Segala sesuatu yang ada di sumber museum mengenai apa yang diminta tanpa kewajiban: direkomendasikan dan direkomendasikan, tindakan sukarela dan doa sukarela, Sunnah yang dikonfirmasi, dan
        apa yang ditinggalkan Nabi karena takut akan kesulitan.'
      definition: Yang direkomendasikan adalah apa yang diminta oleh Pemberi Hukum tanpa kesalahan karena meninggalkannya, dan melakukannya lebih baik daripada meninggalkannya. Para ahli hukum menyebutnya
        Sunnah, direkomendasikan, sukarela, dan sewenang, dan sebagian besar sinonim.
      scope: Di sini termasuk teks-teks yang menggunakan istilah-istilah ini, teks yang menyatakan bahwa tindakan "tidak wajib," dan hadits "Seandainya bukan karena kesulitan yang telah saya timbulkan bagi
        bangsa saya." Sunnah, sebagai sumber legislasi, memiliki catatan sendiri.
    haram:
      title: tabu
      desc: 'Segala sesuatu dalam sumber museum yang menyebut Muharram meliputi: ''Aku telah dilarang untukmu,'' ''Dilarang bagi Tuhan,'' ''Tidak akan mengizinkan,'' serta larangan dan kesucian Tuhan.'
      definition: Yang dilarang, juga disebut terlarang, adalah apa yang diminta oleh Pemberi Hukum untuk ditinggalkan, beserta ancaman hukuman atas tindakannya.
      scope: Berikut adalah bagian yang sama yang dibaca browser tentang halal dan haram di bawah bagian larangan, dengan satu daftar istilah, sehingga kedua browser tidak berbeda. Larangan dikecualikan,
        dan kata benda yang digunakan adalah haram. Abstrak 'prohibition' tidak diklasifikasikan.
    makruh:
      title: benci hal-hal
      desc: 'Segala sesuatu dalam sumber museum sejak awal dihilangkan: tidak disukai dan tidak disukai, dan ''dia dulu tidak suka,'' ''Tuhan membencimu,'' dan melarang ''tidak mencapai tingkat kepastian,''
        dan apa yang tidak disukai para ahli hukum.'
      definition: Yang tidak disukai adalah apa yang diminta oleh Pemberi Hukum untuk ditinggalkan tanpa ancaman hukuman, dan mengabaikannya lebih baik daripada melakukannya. Al-Ghazali menyebutkan bahwa
        istilah ini juga digunakan dalam kasus terlarang dan penghindaran pertama, dan Hanafi membaginya menjadi apa yang mendekati yang terlarang dan apa yang hanya kebalikan dari yang pertama.
      scope: Di sini, teks yang menggunakan ketidaksukaan dan ketidaksukaan, serta laporan biasa tentang ketidaksukaan, dikecualikan. Pengecualian dibuat untuk ketidaksukaan dalam arti perasaan, seperti
        "siapa pun yang benci bertemu Tuhan," paksaan, dan frasa "takut itu."
    saghair:
      title: Dosa kecil
      desc: 'Segala sesuatu dalam sumber museum tentang dosa kecil: menyalahkan, dosa kecil, apa yang ditebus doa, menghindari dosa besar, dan peringatan agar tidak terus-menerus.'
      definition: Dosa kecil lebih kecil daripada dosa-dosa besar, dan para ahli hukum berbeda pendapat mengenai batas di antara keduanya. Catatan museum menampilkan definisi, sementara dosa besar tersedia
        di browser Hudud Allah dan Major Crimes.
      scope: Teks-teks yang tercantum di sini adalah yang menyebut dosa kecil, dosa, dan dosa yang merendahkan, serta teks mengenai penebusan (selama dosa besar dihindari). Pengecualian berlaku untuk 'kecil
        dan besar' dalam arti yang berbeda.
    mubah:
      title: 'Dan lainnya: diperbolehkan dan diperbolehkan'
      desc: 'Apa yang tersisa dari salam: apa yang diperbolehkan, dan konsesi bersama prinsip asli, yaitu tekad, dan ''Tidak ada kesalahan pada Anda,'' ''Tidak ada salahnya,'' dan apa yang diam tentang
        hal itu.'
      definition: Yang diperbolehkan adalah apa yang dipilih oleh legislator; melakukannya dan menahan diri adalah hal yang sama, dan tidak ada dosa di keduanya. Konsesi adalah pelonggaran hukum sebagai
        alasan sementara alasan awal tetap ada.
      scope: Teks-teks yang tercantum di sini adalah yang menggunakan permisi, permissible, dan konsesi, seperti 'Tidak ada kesalahan pada Anda,' 'Tidak ada bahaya,' dan 'Apa yang dibungkam tentang hal
        itu diampuni.' Adapun apa yang halal, itu adalah penjelajah apa yang sah dan tidak sah.
