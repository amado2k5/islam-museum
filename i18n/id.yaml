nuzul:
  title: "Browser Asbab al-Nuzul"
  lede: "Setiap riwayat tentang sebab turunnya wahyu yang dibawa sumber-sumber museum — peristiwa atau pertanyaan di balik suatu ayat atau surah: wahyu pertama di gua Hira, sebab-sebab ayat hijab, khamar, ifk, li'an, zihar, dan perubahan kiblat — sebagaimana diriwayatkan para Sahabat, Tabi'in, dan kitab-kitab tafsir, hadis, dan sirah, serta setiap sebab dalam setiap kitab yang dihimpun — catatan bersumber yang bertambah seiring datangnya teks baru."
  badge: "Penjelajah sebab turunnya wahyu"
  status: "Bangunan ini memuat {n} catatan dalam {s} bagian; teks-teksnya draf hingga dibaca manusia."
  method_title: "Metode browser"
  method_note: "Setiap catatan di sini adalah catatan museum biasa — dengan sumber dan prosanya. Sebab-sebab ditemukan saat kompilasi oleh detektor terjaga atas teks pasal — rumus sebab eksplisit («سبب نزول», «أسباب النزول») dan rumus wahyu yang terikat konteks ayat («نزلت هذه الآية», «فأنزل الله», «نزلت في فلان», «نزل جبريل»), yang harus berada di samping kata ayat, surah, atau Al-Qur'an; makna turun lainnya tetap di luar — hujan, hujan es, banjir, bencana, tamu, turunnya Isa, dan makna medis — positif palsu terverifikasi dikeluarkan menurut id, dan setiap kitab yang dihimpun kemudian membawa sebabnya ke sini secara otomatis begitu pasalnya mendarat di graf; catatan terpilih bergabung melalui tag nuzul-browser. Setiap pasal ditandai sebab bila melaporkan sebab nyata dan sebutan bila tentang ilmu asbab al-nuzul, dan chip perawi menggolongkan riwayat kenabian, sahabat, tabi'i, atau kemudian."
  api: "Seluruh himpunan tersedia di"
  sections_title: "Bagian-bagian browser"
  narrators_title: "Generasi riwayat"
  all_narrators: "Semua generasi"
  filter_label: "Saring sebab-sebab"
  filter_none: "Tidak ada hasil."
  empty: "Belum ada catatan sebab turunnya wahyu dalam bangunan ini."
  kinds:
    occasion: "melaporkan sebab"
    mention: "tentang ilmunya"
  narrators:
    prophetic: "Kenabian"
    companion: "Sahabat"
    tabii: "Tabi'i"
    later: "Kemudian"
  sections:
    quran:
      title: "Dalam Al-Qur'an"
      desc: "Apa yang dikatakan Al-Qur'an sendiri tentang keadaan turunnya — ayat-ayat yang menamai peristiwa atau pertanyaan yang mereka jawab, dan pasal-pasal korpus beku yang melaporkan suatu sebab."
    sunnah:
      title: "Dalam Sunnah"
      desc: "Riwayat-riwayat sebab dari koleksi hadis — apa yang dijelaskan Nabi ketika suatu ayat turun, pertanyaan-pertanyaan yang diajukan kepadanya, dan peristiwa-peristiwa yang dijawab ayat-ayat, dalam Sahih al-Bukhari, Sahih Muslim, Muwatta, dan Sunan."
    seerah:
      title: "Dalam sirah"
      desc: "Sebab-sebab yang dibawa kitab-kitab sirah dan sejarah — episode-episode wahyu di dalam peristiwa biografi — terisi dengan sendirinya seiring mendaratnya pasal sirah baru."
    books:
      title: "Dalam kitab-kitab lain"
      desc: "Riwayat sebab dari setiap karya lain yang dihimpun — kitab-kitab asbab dan tafsir, sejarah, adab — digolongkan menurut genre karya saat pasalnya tiba."
    curated:
      title: "Catatan tentang sebab-sebab"
      desc: "Catatan terpilih museum tentang sebab-sebab itu sendiri: sebab-sebab turun yang masyhur sebagai catatan bernama, karya-karya asbab dan edisi-edisinya, serta konsep-konsep ilmu ini."
  viz:
    title: "Di mana sebab-sebab berdiri"
    caption: "Sinar-sinar turun dari garis langit ke surah-surah yang membawa riwayat sebab di sini — {n} catatan pada surahnya; {e} lainnya, tanpa nomor surah, ada dalam daftar di bawah."
    how: "Pilih satu generasi untuk mewarnai sinar hanya dengan riwayatnya; pilih lagi untuk melihat semuanya."
    hint: "Arahkan, fokuskan, atau sentuh sinar untuk melihat ke mana ia turun."
    sky_title: "Surah-surah, dalam urutan mushaf"
    sky_note: "{n} dari {total} surah membawa riwayat sebab; sisanya pucat."
    count_in: "{n} catatan"

tajwid:
  title: "Peramban Tajwid dan Tilawah"
  lede: "Semua yang dikatakan sumber-sumber museum tentang bagaimana huruf-huruf Al-Qur'an diucapkan dan bagaimana tilawahnya dilakukan: tujuh belas makhraj dan sifat huruf, mad, ghunnah, qalqalah serta hukum nun sukun, mim sukun dan tanwin, waqf dan ibtida'; tartil yang diperintahkan Al-Qur'an, adab membaca dan mendengar, nada-nada yang diperdebatkan atas nama para pemegangnya, serta para qari dan teks-teks pengajaran yang memikul keahlian itu. Setiap ayat, riwayat dan petikan kitab dicantumkan sumbernya, dan setiap pendapat dinisbahkan kepada pemegangnya."
  badge: Penjelajah tajwid dan tilawah
  hero_ayah: "وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا"
  hero_naskh: "Bagaimana huruf-huruf terbit dari makhrajnya dan bagaimana tilawah dilakukan"
  status: "Bilangan ini memuat {n} rekaman dalam {s} bagian; setiap rekaman mencantumkan sumbernya, dan teks-teksnya ditulis oleh agen AI dari sumber-sumber itu dan belum dibaca manusia."
  method_title: Metode peramban
  method_note: "Peramban ini menghimpun apa yang dikatakan dan ditulis tentang dua hal yang saling terkait: bagaimana huruf-huruf diucapkan — makhraj, sifat dan hukumnya — dan bagaimana tilawah dilakukan, didengar dan diajarkan. Ayat-ayat Al-Qur'an datang dari tabel yang telah ditinjau: ayat-ayat tartil dan tilawah yang benar, adab pembaca dan pendengar, dan tilawah yang diajarkan dan didengar. Teks Al-Qur'an hanya muncul di museum dari berkas-berkasnya yang beku, sehingga lafaz sebuah ayat tidak pernah diketik ulang. Setiap teks lain — hadis, sirah, laporan para Sahabat dan Tabi'in, dan kitab-kitab — ditemukan saat pembangunan oleh leksikon yang dijaga atas setiap petikan, sehingga sebutan dalam kitab yang dipanen kemudian muncul pada hari petikannya tiba. Peramban tidak memutuskan: di mana ulama berbeda pendapat, seperti pada lagu dan maqamat, rekaman memberi setiap pandangan beserta pemegangnya."
  api: "Seluruh himpunan tersedia di"
  topics_title: Tujuh topik peramban
  sections_title: Bagian-bagian peramban
  filter_label: Saring rekaman tajwid dan tilawah
  filter_none: Tidak ada yang cocok.
  empty: Belum ada rekaman tajwid atau tilawah dalam bilangan ini.
  kin_title: Peramban-peramban saudara
  topics:
    tartil: Bacaan terukur
    adab: Adab tilawah
    ahkam: "Hukum: makhraj dan sifat"
    qurra: Para qari dan pengajar
    mutun: Teks-teks pengajaran
    maqamat: Lagu-lagu
    taalim: Mengajar dan belajar
  topics_desc:
    tartil: "Perintah membaca Al-Qur'an dengan tartil, mengikuti bacaannya dan menahan lidah, serta apa yang diriwayatkan tentang tempo-tempo terukur: tahzir, tadwir, hadr dan tarsil."
    adab: "Isti'adzah dan basmalah, suara indah bersama Al-Qur'an, mendengar dan berdiam, sujud tilawah dan khatam, serta membaca dengan suara keras atau lirih."
    ahkam: "Tujuh belas makhraj dan sifat huruf, mad, ghunnah, qalqalah, tafkhim dan tarqiq, hukum nun sukun, mim sukun dan tanwin, serta waqf dan ibtida'."
    qurra: "Para pembaca di kalangan Sahabat dan Tabi'in, tujuh dan sepuluh imam beserta perawinya, para syekh pengajar dan tingkatan-tingkatan qurra."
    mutun: "Matn-matn tajwid yang dipelajari dan dihafal: Tuhfat al-Athfal, Jazariyah, Syathibiyah, Thayyibat al-Nasyr dan teks pengajaran qiraat lainnya."
    maqamat: "Lagu dan maqamat dalam tilawah: seni yang diperdebatkan; rekaman memberi setiap pandangan atas nama pemegangnya."
    taalim: "Mengajar dan mempelajari tilawah: «sebaik-baik kalian adalah yang belajar Al-Qur'an dan mengajarkannya», halaqah dan kuttab, serta membaca di hadapan para syekh."
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: "Ayat-ayat yang memerintahkan tartil dan tilawah yang benar, adab pembaca dan pendengar, serta tilawah yang diajarkan dan didengar — dari tabel yang ditinjau terhadap ayat dan kitab."
    sunnah:
      title: Dalam Sunnah
      desc: "Apa yang diriwayatkan koleksi hadis tentang bacaan dan tilawah Nabi, suara indah bersama Al-Qur'an, adab membaca dan mendengar, serta laporan para pembaca dan pengajar."
    seerah:
      title: Dalam sirah
      desc: "Apa yang dibawa kitab-kitab sirah tentang pembacaan dan pengajaran Al-Qur'an dalam peristiwa-peristiwa dakwah — bagian ini terisi sendiri seiring datangnya teks sirah baru yang memuat sebutan seperti itu."
    tafsir:
      title: Dalam tafsir
      desc: "Apa yang dikatakan kitab-kitab tafsir yang dipanen tentang ayat-ayat tilawah dan tartil beserta hukumnya."
    books:
      title: Dalam kitab-kitab lain
      desc: "Ulum Al-Qur'an, qiraat, sejarah, biografi dan adab: setiap kitab hasil panen di luar Al-Qur'an, hadis, sirah dan tafsir yang membahas hal-hal ini, dan apa pun yang datang kemudian."
    ahkam:
      title: Hukum-hukum
      desc: "Rekaman museum tentang tujuh belas makhraj dan sifat huruf, hukum nun sukun, mim sukun dan tanwin, mad dan ghunnah, serta waqf dan ibtida'."
    adab:
      title: Adab
      desc: "Adab tilawah: isti'adzah dan basmalah, khusyuk, mendengar, sujud tilawah dan mengkhatamkan Kitab."
    taalim:
      title: Mengajar dan belajar
      desc: "Kisah-kisah Al-Qur'an diajarkan, dibaca dan dibawa di kalangan Sahabat dan Tabi'in, halaqah dan sekolahnya, dengan sanad masing-masing."
    qurra:
      title: Para qari
      desc: "Para pembaca di kalangan Sahabat dan Tabi'in, tujuh dan sepuluh imam beserta perawinya, serta para syekh pengajar dan murid-muridnya."
    mutun:
      title: Teks-teks pengajaran
      desc: "Matn-matn tajwid dan qiraat yang digambarkan museum, beserta syarah dan cetakannya."
    maqamat:
      title: Lagu-lagu
      desc: "Lagu dan maqamat tilawah dan apa yang dikatakan tentangnya, setiap pandangan atas nama pemegangnya, tanpa vonis."
  map:
    title: Peta makhraj
    note: "Tujuh belas titik artikulasi sebagaimana dihitung Ibn al-Jazari dalam al-Muqaddimah al-Jazariyah, dibentangkan di sepanjang jalan napas dari rongga tenggorokan hingga bibir dan rongga hidung — setiap huruf dalam piringan warna wilayahnya."
    aria: "Peta skematik tujuh belas titik artikulasi huruf Arab, dari tenggorokan ke bibir dan rongga hidung"
    counts: "{v} ayat dalam Al-Qur'an, {p} petikan dalam kitab-kitab, {r} rekaman terpilih dalam peramban ini."
