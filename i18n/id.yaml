jinn-devils:
  title: Browser Jin dan Iblis
  lede: Jin, iblis, malaikat, dan mimpi-mimpi yang membawanya — setiap makhluk, pertemuan, dan berita yang tercatat dalam Al-Qur'an, hadits, biografi, dan buku-buku hasil panen, semuanya dikumpulkan dalam
    satu browser dengan sumbernya.
  badge: Penjelajah Paranormal
  status: Dalam versi ini, {n} dicatat dalam beberapa bagian; teks-teks disusun untuk ditinjau oleh manusia.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum reguler — terdokumentasi dan trilingual — yang dikumpulkan oleh tag jinn-devils-browser dan jd-<section> dalam satu bagan, bukan meja samping;
    catatan malaikat yang dibawa oleh Angels'' Browser muncul di bagian malaikat ini. Teks Al-Qur''an adalah teks beku dari unduhan, muncul di halaman subjek hanya sebagai referensi, dan kartu hadis terhubung
    ke halaman novel. Buku yang dipanen di masa depan secara otomatis bergabung dengan browser setiap kali catatan mereka diberi tag. Dalam setiap topik, catatan dicantumkan sebagaimana adanya, dibaca dari
    kategori dan jenis setiap catatan: makhluk itu sendiri, kemudian kepercayaan, kemudian peristiwa, kemudian bendera yang disebutkan, kemudian pertanyaan, kemudian buku.'
