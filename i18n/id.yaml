  hero_kufi: Pemikir, ulama, ulama hadis, penulis, dan penulis
  hero_naskh: Orang-orang berpengetahuan dan pena serta apa yang dikatakan sumber tentang mereka
  status: Struktur {n} ini mencakup catatan dalam bagian {s}; setiap catatan menyebutkan sumbernya, dan teks-teksnya ditulis oleh agen AI dari sumber-sumber tersebut dan belum dibaca oleh manusia.
  method_title: Kurikulum Browser
  method_note: 'Seseorang masuk ke browser ini ketika mereka mengatakan catatan mereka berasal dari siapa mereka sebenarnya: seorang cendekiawan, ulama hadis, ahli hukum, mufti (mufti), hakim, teolog, filsuf,
    sejarawan, ahli geografi, penulis, guru, pengkhotbah, dan sarjana pena (penyair memiliki sayap sendiri dan berada di luar cakupan ini). Teks masuk dalam tiga cara: margin standar ''diingat'' yang menyebutkan
    ulama yang memenuhi syarat; atau tabel referensi untuk ayat-ayat Al-Quran—Luqman yang Bijaksana, ayat-ayat para ulama, dan ayat pena dan tulisan (teks beku Tanzil tidak pernah dicari); atau daftar terlindungi
    nama ulama yang ditulis oleh buku, di mana nama tunggal umum tidak pernah dihitung. Setiap buku yang dipanen kemudian secara otomatis membawa ulamanya dan menyebutkan mereka. Sumber Sunni adalah kerangka
    kerja; ketika ada perbedaan pendapat tentang seseorang, catatan mengaitkan pernyataan tersebut dengan penulisnya.'
