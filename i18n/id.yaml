        Allah, malaikat-Nya, kitab-kitab-Nya, utusan-Nya, Hari Terakhir dan takdir, ayat-ayat tentang peningkatan iman, dan ayat-ayat tentang sifat-sifat orang beriman dan hamba Yang Maha Penyayang.'
    sunnah:
      title: Per tahun
      desc: 'Hadits dari dua Sahih, Sunan, dan Muwatta'' beserta komentar-komentarnya: hadis Gabriel, pembangunan Islam pada lima hal, delegasi Abd al-Qais, pengiriman Mu''adh ke Yaman, cabang-cabang agama,
