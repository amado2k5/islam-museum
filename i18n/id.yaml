foundation:
  title: Tentang Yayasan Museum Islam
  lede: 'Museum digital yang terbuka dan gratis tentang Islam: kepercayaan, peradaban, bangsa, tempat, ide, monumen, kata-kata, dan kehidupan kontemporer, dari dunia tempat Islam lahir hingga hari ini.'
  logo_title: Logo
  logo_intro: Logo ini dirancang untuk menggabungkan tiga elemen arsitektur Islam dan kitab suci menjadi satu bentuk.
  logo_star: 'Bintang dengan delapan titik runcing, dari geometri Islam: waktu dan ruang bersama, sehingga tidak ada yang bisa dipahami tanpa yang lain.'
  logo_arch: 'Mihrab: pintu tempat pengunjung masuk dan menghadap qibla.'
  logo_book: 'Buku Terbuka: Pengetahuan dan Firman, dan Membaca Sebelum Penghakiman.'
  logo_download: Tag (PNG)
  emblem_alt: 'Logo museum: Bintang delapan emas mengelilingi cakram lapis lazuli dengan mihrab tembaga di atas buku terbuka'
  emblem_download: Logo lengkap (gambar)
  logo_dark_download: Tag untuk latar belakang gelap
  logo_lockup_download: Unduh logo dengan nama tersebut
  story_title: Cerita
  story_1: 'Proyek ini dimulai dengan pertanyaan sederhana: Mengapa tidak ada satu pun tempat di web yang mengumpulkan seluruh kisah Islam, di mana orang asing masuk, mengembara, belajar, dan peneliti dapat
    memverifikasi serta kembali ke sumbernya? Pengetahuan tentang Islam tersebar di situs teks, arsip museum, artikel ensiklopedis, studi akademik, dan liputan jurnalistik, banyak di antaranya ditulis untuk
    pembelaan atau serangan, bukan untuk dipahami.'
  story_2: 'Proyek ini memutuskan untuk membangunnya sebagai museum daripada sekadar artikel panjang: sembilan sayap (waktu, tempat, orang, ide, monumen, kata, Islam hidup, hari ini, dan pembuatan) mengawasi
    subjek yang sama dari sudut yang berbeda, setiap orang, tempat, peristiwa, ide, atau menelusuri sebuah kompleks dalam diagram yang menghubungkannya dengan lingkungan sekitarnya dalam waktu dan tempat.'
  story_3: 'Materi disimpan dalam file teks jelas yang dapat diakses siapa saja, dengan setiap fakta disumberkan, dan setiap tanggal ditulis dalam bentuk persis dengan kalender Hijriyah dan Gregorian. Situs
    itu sendiri adalah halaman statis: tanpa server, tanpa basis data, tanpa layanan berbayar, dan tanpa model AI yang berfungsi saat seseorang mengunjungi situs tersebut.'
  story_4: 'Ketika museum memilih identitas visualnya, warnanya mengambil inspirasi dari asal-usul arsitektur Islam dan kerajinan manuskrip: biru biru tua, emas matte untuk halaman manuskrip, kertas susu,
    dan beige pasir untuk panel. Tidak ada dekorasi khusus yang disalin dari artefak yang diawetkan; sebaliknya, ukiran lahir dari geometri bintang, persegi, dan lingkaran.'
  story_5: 'Kemudian datang kerja tim: kontribusi dan sesi kerja paralel menambahkan sejumlah kecil materi, serta tinjauan yang menghasilkan draf yang ditampilkan sebelum diadopsi. Museum masih dalam tahap
    pembangunan, diumumkan di setiap halaman, dan halaman sampul menghitung apa yang telah selesai dan apa yang menanti.'
  founder_title: Pendiri
  founder_line: Didirikan dengan {name}, seorang Kanada keturunan Mesir, ia tinggal di Oakville, Ontario.
  founder_name: Ahmed Abdel Aal
  founder_body: 'Proyek ini didirikan oleh satu orang, yang menempatkan visi pertamanya dalam dokumen perencanaan di dalam gudang itu sendiri, lalu membuka pintunya bagi siapa saja yang ingin menambah atau
    memperbaiki. Visi ini didasarkan pada menjaga museum tetap hidup meskipun pendirinya berhenti: teksnya ada di Git, datanya terbuka, dan siapa pun dapat menyalinnya secara lengkap di komputer mereka.
    Halaman ini menjelaskan proyek dan tujuannya, bukan biografi pemiliknya.'
  independence_title: Kemerdekaan
  independence_1: 'Museum Islam adalah proyek pribadi pendirinya, dikelola olehnya sendiri. Manajemen, kepemilikan, atau keputusannya tidak pernah dibagikan, dan museum ini tidak untuk dijual: tidak ada
    pendanaan, kemitraan, atau dukungan apapun yang memberikan kendali atas museum tersebut.'
  independence_2: 'Museum tidak akan pernah diintegrasikan ke dalam proyek lain, juga tidak akan berada di bawah payung atau pengawasan apapun—tidak ada pemerintah, tidak ada institusi keagamaan, tidak
    ada perusahaan, tidak ada dana abadi. Pintu untuk membantu terbuka untuk semua orang: dengan catatan dan koreksi, relawan, pendanaan dan penggalangan dana, materi dan sumber daya, pengujian, berkontribusi
    pada kode, menulis tentang museum, dan menerbitkannya. Bantuan diterima dengan ucapan terima kasih dan diberikan kepada pemiliknya, dan tidak ada otoritas yang diberikan: museum tetap independen, dari
    manusia ke orang.'
  terms_title: Kebebasan Penggunaan — dan Ketentuan Apa
  terms_1: 'Segala sesuatu di sini gratis digunakan tanpa izin: semua data, sumber daya, dan layanan museum, saat ini dan yang akan datang, dalam bentuk apapun, tanpa batasan, dan tanpa kontrol dari kami.
    Anda dapat mereproduksi, bercabang dari, atau menyalin seluruh basis data kode dan memulai proyek serupa, yang telah dimodifikasi, atau sepenuhnya baru — pendiri tidak akan mengajukan klaim hak cipta
    atau upaya hukum terhadap upaya tersebut. Data CC0, skrip CC BY-SA 4.0, dan kode MIT.'
  terms_2: 'Museum dapat mengubah apa pun kapan saja — situs, kontennya, kode, hosting, performa, struktur, dan publikasi — tanpa persetujuan sebelumnya, tanpa persetujuan, dan tanpa pemberitahuan kepada
    siapa pun. Tidak ada perjanjian tingkat layanan atau garansi dalam bentuk apapun: jika situs sedang down, dihentikan, tidak tersedia, atau lainnya, baik museum maupun pemiliknya tidak bertanggung jawab
    atas hal tersebut.'
  terms_3: Apa yang Anda lakukan dengan apa yang Anda temukan di sini adalah tanggung jawab Anda. Baik situs, maupun pemiliknya, maupun perusahaan hosting tidak bertanggung jawab atas perilaku, tindakan,
    adopsi, aplikasi, reproduksi, atau penggunaan ulang konten yang dipublikasikan siapa pun, maupun atas kesalahpahaman, salah representasi, penyalahgunaan, atau kerugian yang timbul dari tindakan pengunjung.
    Setiap entri mengutip sumbernya dan menunjukkan status ulasannya, tetapi akurasi yang diatribusikan, tidak dijamin — sumber yang dikutip adalah tempat klaim akhirnya ditetapkan — dan situs yang kami
    kaitkan menjadi tanggung jawab pemiliknya.
  terms_4: 'Setiap penulis atau entitas yang memiliki klaim atas konten apa pun dapat meminta penghapusan atau modifikasinya kapan saja: alat pelaporan di situs ini selalu terbuka untuk tujuan tersebut,
    dan permintaan tersebut dijawab terlebih dahulu. Semua opini dan opini yang diungkapkan di situs ini adalah milik pendiri sendiri dan tidak mencerminkan pandangan atau pandangan pemberi kerja mereka.'
  purpose_title: Bukan untuk keuntungan maupun agenda
  purpose_1: '''Museum Islam'' tidak dijalankan untuk keuntungan atau keuntungan. Museum ini tidak menjalankan agenda, juga tidak melayani kebutuhan pemerintah atau perusahaan manapun. Museum ini gratis
    untuk semua orang: tidak ada langganan, tidak ada pelacakan, dan tidak ada niat untuk menggunakan atau menjual informasi siapa pun kepada siapa pun.'
  purpose_2: Mengoperasikan museum ini membutuhkan uang nyata setiap bulan, dan pendirinya secara pribadi menanggung biaya ini. Relawan dipersilakan, dan siapa pun yang ingin dapat menyumbang sesuai keinginan
    mereka—tanpa kewajiban, tanpa kewajiban, dan tanpa kontrol sebagai imbalan.
  purpose_3: Ke depannya, museum berencana membuat toko suvenir/bazar online di bagian situs yang terpisah, menampilkan barang dan menjualnya kepada mereka yang ingin menjelajah atau berbelanja di sana,
    untuk membantu biaya. Museum akan bebas dari iklan, spam, atau pengemisan, dan kunjungan selalu bersifat opsional; sampai dibuka, tidak akan ada toko, dan museum itu sendiri akan tetap gratis.
  purpose_4: 'Museum ini dengan tegas menentang kebencian, ujaran kebencian, dan bahaya—menentang Islamofobia, anti-Semitisme, rasisme, genosida, pembersihan etnis, dan segala hal yang diklasifikasikan
    Perserikatan Bangsa-Bangsa sebagai kebencian atau rasisme—serta mendukung dan mempromosikan keberagaman, perbedaan pendapat, dan perdamaian. Museum ini tidak mendukung satu pendapat melawan yang lain,
    maupun narasi sejarah satu terhadap yang lain: museum adalah arsip dan perpustakaan warisan manusia, menampilkan apa yang telah dibuat dan ditulis orang lain sebagaimana adanya, dari sudut pandang mereka
    sendiri. Pendapat mereka adalah pendapat mereka sendiri; museum tidak mendukung siapa pun, tidak berkhotbah apa pun, dan tidak menawarkan saran, layanan, atau nasihat dalam bentuk apapun. Piagam ini
    sepenuhnya menyatakan hal ini (Pasal Sepuluh). Museum tidak mengklaim hak cipta, paten, atau kepemilikan atas apa pun yang dipamerkannya, juga tidak menawarkan insentif, uang, atau keuntungan kepada
    siapa pun untuk mengunjungi, melihat, atau mempromosikannya—setiap orang yang datang melakukannya atas kehendak sendiri.'
  contact_title: Kepada siapa Anda menulis
  contact_press: Pers dan Media
  contact_copyright: Klaim Hak Cipta
  contact_concerns: Ada kekhawatiran lain
  goal_title: Tujuan
  goal_intro: 'Tujuan museum adalah untuk menyajikan seluruh Islam, dari awal hingga saat ini, dengan adil dan tanpa bias. Untuk tujuan ini, museum berkomitmen pada hal-hal berikut:'
  goal_1: 'Menggambarkan tetapi tidak menghakimi: fakta beserta tanggal dan sumbernya, serta mengaitkan putusan kepada pemiliknya.'
  goal_2: Narasi gigi adalah kerangka utama penelitian, dan setiap penglihatan lain ditandai dengan jelas setelah ditandai.
  goal_3: Ia mencantumkan lawan, kritikus, dan sekutu dalam peran mereka di zamannya, dan tidak menulis tentang mereka dalam bahasa kesulitan.
  goal_4: 'Isu-isu kontroversial disajikan dalam kartu ketegangan: dua atau lebih suara, masing-masing dengan sumbernya sendiri, tanpa penilaian dari museum.'
  goal_5: Setiap klaim dikaitkan dengan sumber, dan Wikipedia adalah referensi, bukan sumber.
  goal_6: Buku ini dimulai dalam bahasa Arab, cocok untuk pengunjung yang tidak tahu apa-apa tentang Islam serta untuk peneliti khusus.
  take_title: Berpartisipasi dalam pembangunan
  take_body: Konten dan kode terbuka untuk semua orang. Anda dapat membaca repositori, melaporkan kesalahan, menyarankan entitas baru, atau meminta terjemahan ke dalam bahasa lain.
