  tree_note: 'Garis keturunan Nabi dibagi menjadi tiga bagian oleh orang-orang biografi dan silsilah: disepakati sebagai otentik dari beliau kepada Adnan, dan diperdebatkan dari Adnan hingga Ismail ibn
    Ibrahim, dengan beberapa yang ditangguhkan atau yang lain berdasarkan riwayat Ibn Ishaq, Al-Tabari, dan Ibn Sa''d, dan apa yang ada di atas Ibrahim tidak ditetapkan oleh mereka. Seluruh seri disajikan
    sesuai permintaan sumber, dan episode yang diperdebatkan ditandai dengan tulisan titik-titik, bukan kepastian.'
