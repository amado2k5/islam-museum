  topics_desc:
    ahruf: Hadits Al-Qur'an diwahyukan dalam tujuh huruf, riwayatnya, dan pendapat para ulama mengenai maknanya.
    readings: Mutawatir dan bacaan anomali, bacaan narasi para Sahabat dalam hadits, serta tempat-tempat di mana para pembaca berbeda pendapat mengenai ayat-ayat tersebut.
    readers: Para pembaca di antara para Sahabat dan Pengikut, tujuh dan sepuluh Imam beserta narator mereka, serta mereka yang menulis dalam pembacaan.
    codex: Menulis wahyu, menyusun Abu Bakr, dan Uthman menyalin Al-Qur'an dan mengirimkannya ke kota-kota, serta Mushaf para Sahabat.
    rasm: Ejaan Al-Qur'an Ottoman dan aturannya, perbedaan antara Mushaf di kota-kota, serta perbedaan pendapat mengenai ejaan Mushaf.
    naqt: Titik-titik tata bahasa, titik-titik ija, penanda bentuk dan ketepatan, persembahan dan konjungsi, serta apa yang telah diceritakan tidak disukai lalu diterima.
    khatt: Pena, tinta, dan koran dalam Al-Qur'an, serta aksara Al-Qur'an dari Hijazi dan Kufic hingga enam pena, pena Maghribi, dan kaligrafer.
  sections:
    quran:
      title: Dalam Al-Qur'an
      desc: Ayat-ayat pembacaan dan pembacaan, bahasa dan kemudahan wahyu, hafalan Kitab dan manuskripnya, pena, tinta, dan tulisan, serta ayat-ayat yang menyampaikan perbedaan antara pembaca atau Al-Qur'an
        dari berbagai wilayah.
    sunnah:
      title: Per tahun
      desc: Hadis tujuh surat, penyusunan Al-Qur'an dan penyalinan Al-Qur'an, Kitab Surat-surat dan Bacaan menurut Abu Dawood dan Al-Tirmidhi, pembacaan Nabi dan bacaan para sahabat, serta apa yang disebutkan
        dalam Mushaf.
    seerah:
      title: Dalam biografi
      desc: Apa yang dibawa oleh buku-buku biografi dalam penulisan wahyu, serta dalam membaca dan membaca Al-Quran; bagian ini terisi setiap kali teks biografi baru menyertakan referensi tersebut.
    books:
      title: Dalam buku lain
      desc: 'Ilmu Al-Qur''an, bacaan Al-Qur''an, eksposisi sejarah, biografi, dan buku-buku tulisan serta kaligrafi: setiap buku yang telah dikumpulkan selain Al-Qur''an, hadits, dan biografi, serta membahas
        hal-hal ini, serta segala sesuatu yang akan datang setelahnya.'
    sciences:
      title: Sains, fakta, dan pertanyaan
      desc: Museum mencatat tujuh huruf, bacaan, syaratnya, penyusunan Al-Qur'an, salinan Al-Qur'an, aksara, titik, dan bentuk Al-Qur'an, serta pertanyaan yang berbeda pendapat para ulama.
    people:
      title: Pembaca, juru tulis, dan kaligrafer
      desc: Kitab Wahyu dan penyusun Mushaf, tujuh dan sepuluh pembaca beserta riwayatnya, para imam naskah dan koreksi, titik-titik dan bentuk Mushaf, serta tokoh-tokoh penting kaligrafi.
    scripts:
      title: Jalur
      desc: 'Aksara yang digunakan untuk Mushaf dan lainnya: Hijazi, Kufi, Naskh, Thuluth, Muhaqqaf, Al-Rayhan, Maghribi, dan cabang-cabangnya.'
    works:
      title: Buku Klasifikasi
      desc: Buku-buku bacaan Al-Qur'an, aksara, tata bahasa, ilmu Al-Qur'an, dan kaligrafi yang menjadi ciri khas museum ini.
    mushafs:
      title: Al-Qur'an
      desc: Naskah dan Al-Qur'an cetak yang menjadi ciri museum ini, dari naskahnya, titik-titiknya, dan keakuratannya.
