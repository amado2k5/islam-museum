  title_pre: Museum
  title_strong: Kisah Islam
  title_post: Selesai.
  lede: Dari dunia tempat ia dilahirkan, melalui empat belas abad iman, ilmu pengetahuan, seni, kota, perjalanan, dan bangsa, hingga hari ini. Setiap orang, tempat, peristiwa, ide, pengaruh, dan praktik
