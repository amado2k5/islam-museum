  hero_naskh: 'Bagaimana Al-Qur''an dibaca dan bagaimana Al-Qur''an ditulis: dari perkamen pertama hingga Mushaf yang dicetak'
  status: Edisi ini mencakup {n} catatan dalam bagian {s}; setiap catatan menyebutkan sumbernya, dan teks-teksnya ditulis oleh model otomatis dari sumber-sumber tersebut yang belum dibaca manusia.
  method_title: Kurikulum Browser
  method_note: 'Browser ini mengumpulkan apa yang disebutkan dan ditulis dalam empat hal yang saling terkait: bagaimana Al-Qur''an dibaca, bagaimana Al-Qur''an ditulis, dalam aksara mana Al-Qur''an ditulis,
    dan bagaimana ia dititik-titik serta dibentuk. Ayat-ayat Al-Qur''an diambil dari tabel referensi: ayat-ayat yang memerintahkan pembacaan dan pembacaan, menyebutkan pena dan naskah, ayat-ayat yang melaporkan
    perbedaan antar pembaca atau Al-Qur''an di daerah; tidak ada teks Al-Qur''an yang ditulis dalam arsip museum kecuali dari file yang dibekukan, dan pembacaan dijelaskan melalui ucapan, bukan ditulis.
    Semua teks lain, seperti hadits, biografi, laporan Para Sahabat dan Pengikut, serta buku-buku ditemukan pada saat pembuatan dalam kamus yang dijaga ketat pada teks setiap bagian. Ketika sebuah buku
    baru dibuat, referensinya muncul pada hari bagian-bagian tersebut diperkenalkan. Browser tidak mengeluarkan keputusan: jika para sarjana berbeda pendapat, seperti mengenai makna tujuh huruf atau penulisan
    Mushaf dalam aksara ortografis, catatan mencatat setiap pernyataan yang dikaitkan dengan pemiliknya.'
