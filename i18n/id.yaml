    pada teks bagian — tunggal "tahun" tidak dihitung karena itu adalah tahun yang diikuti, bukan tahun kronologis; "tahun" hanya dihitung dalam bentuk tahun yang disebutkan atau dalam waktu yang berdekatan;
    "abad" bersama banteng dan ternak adalah abad, bukan generasi; "nol" adalah angka, "Rajab" adalah nama pria; dan "Muharram" adalah nama penguasa; dan positif palsu yang terdokumentasi dikecualikan oleh
