      desc: Di mana ia berbicara bahasa Arab, negara-negara Arab, dan bahasa Arab di antara bahasa-bahasa dunia Islam, dan apa yang telah diberikan bahasa tersebut kepada bahasa-bahasa lain serta apa yang
