  lede: 'Setiap penyebutan mata uang, ekonomi Islam, sukuk, kontrak, dan wakaf dalam sumber museum: ayat-ayat Al-Qur''an tentang skala, ukuran, riba, dan utang; kisah Nabi tentang dinar, dirham, kemitraan,
    perdamaian, dan etiket pasar; wakaf Utsman dan Amr, doanya; dan setiap bagian ekonomi dalam setiap kitab yang ditemukan — catatan yang terdokumentasi yang berkembang seiring munculnya teks-teks baru.'
