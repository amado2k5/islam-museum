  title: Browser Empat Sekolah Pemikiran
  lede: Keempat Imam—Abu Hanifa, Malik, Al-Shafi'i, dan Ahmad—beserta aliran yang mereka dirikan, generasi awal dan pengikut yang menjadi dasar fiqh, buku-buku yang mencatat mazhab-aliran tersebut, termasuk
    teks ilmiah dari Ajrumiyyah hingga Jazariyyah dan Shatibiyyah, serta segala sesuatu yang disebutkan dalam kitab ajaran Sunni dalam sejarah, fatwa, dan isu—dikumpulkan dalam satu browser beserta sumbernya.
  badge: Penjelajah Sekolah Yurisprudensi
  status: Struktur ini mencakup {n} sebuah catatan dalam {s} bagian; teks disusun agar manusia dapat meninjaunya.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — terdokumentasi dan trilingual — tanpa meja samping. Catatan yang dipilih memuat tag madhahib-browser dan mh-<section> tag, dan setiap
    karya, kutipan, atau pertanyaan yang memiliki hubungan 'mensebutkan' dengan salah satu sekolah atau konsep sekolah termasuk dalam kategori 'Mention in Sources'—dan sekolah Hanafi, Maliki, Shafi'i, atau
    Hanbali juga ditambahkan ke bagian tentang sekolahnya. Buku berikutnya akan muncul secara otomatis di sini pada hari hubungannya ditulis, dan sumber yang tidak menerima hubungan 'mention' bergabung
    dengan tag mereka.
