        setara dengan bagian dua perempuan,'' dan ''mawwda ditanya dosa apa yang dibunuh,'' anak yatim, kabar baik tentang anak itu, nasihat Yakub kepada anak-anaknya, nasihat Luqman kepada anaknya, anak-anak
