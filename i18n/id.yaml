      desc: 'Apa yang terkandung dalam buku-buku biografi ini dalam menyebutkan pilar, iman, dan karakteristik para mukmin: pengajaran delegasi agama mereka, surat-surat Nabi kepada suku-suku, dan sikap
        para Sahabat; bagian ini diisi setiap kali teks biografi baru diterbitkan.'
    books:
