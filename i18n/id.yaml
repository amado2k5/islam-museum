    bagian dari enam keluarga: pernikahan (pernikahan, pernikahan, istri, mas kawin, pesta, pernikahan), keluarga dan anak-anak (keluarga, anak-anak, putra, anak, anak, anak, orang tua, menyusui), tempat
    tinggal (tempat tinggal, tempat tinggal, kamar, rumah mereka, rumah mereka), pensiun (mata pencaharian, penghidupan, tunjangan, pakaian, mata pencaharian mereka), kehidupan sehari-hari (tidur, pakaian,
    pelayan, tempat tidur, meja), dan adat sosial (izin, tetangga, tamu, hadiah, terkenal, majlis). Kata-kata yang meragukan dijaga dengan baik: ''suami'' dan ''baal'' hanya dihitung di samping kata ''pernikahan'',
