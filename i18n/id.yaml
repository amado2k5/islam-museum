hasanat:
  title: Keunggulan Browser
  lede: 'Setiap penyebutan perbuatan baik dalam sumber museum: ayat-ayat Al-Qur''an yang ditulis, dikali, dan dihapus oleh dosa, hadis tentang niat dan perbuatan yang ditulis, pinjaman baik kepada Allah,
    syafaat baik dan ganjaran ''kebaikan,'' setiap penyebutan biografi, cerita, laporan para Sahabat dan Pengikut, dan setiap buku yang ditemukan — catatan terdokumentasi yang bertambah dengan setiap teks
    baru yang diterbitkan.'
  badge: Keunggulan Explorer
  status: Struktur ini berisi {n} sebuah catatan dalam {s} bagian; teks adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — dengan prosa dan prosa tribahasanya. Kenangan ditemukan saat dibuat dalam kamus yang terjaga berdasarkan teks suku kata — "Hasanat," "Hasanat,"
    "Hasanah," "Hasanah," dan "Hasana" yang diatur (nama-nama indah Tuhan tetap di luarnya), dan dua frasa tetap "Qard Hassan" dan "Badul Hasana Ba'ad Sawa"; abstrak "Hassan" dan "Al-Hassan" (kata benda
    khusus dan derajat hadits) serta "Hasana" dikecualikan sebagai kata sifat dan sifat dalam bahasa feminin, dan positif palsu yang didokumentasikan oleh artikel pasti dikecualikan. Setiap buku yang terjadi
    kemudian secara otomatis membawa ingatannya ke sini ketika bagian-bagiannya muncul dalam bagan; catatan terpilih digabungkan dengan tag hashanat-browser. Setiap suku kata menunjukkan 'Hasanat' (perbuatan
    baik), 'Hasanah' (Hasana), atau 'Hasna' sesuai dengan keluarga verbal dominannya.
  api: Koleksi lengkapnya tersedia di
  sections_title: Bagian Browser
