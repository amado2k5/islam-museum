      title: Penjelasan Ajaib Al-Qur'an
      desc: 'Tantangan yang dibawa oleh Al-Qur''an, mereka yang mendengarnya dan apa yang mereka katakan, serta bagaimana para ulama menafsirkan mukjizatnya: perkataan, contoh, dan laporan, masing-masing
