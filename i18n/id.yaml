arkan:
  title: Penelusuri pilar-pilar Islam, pilar iman, orang-orang beriman, dan sifat-sifat orang beriman
  lede: 'Empat bab dalam satu penjelajah berjalan: lima pilar Islam yang menjadi dasar pembangunannya, enam tiang iman dalam hadis Gabril, cabang-cabang iman yang dihitung hadis sebagai tujuh puluh lebih,
    dan kualitas orang mukmin seperti yang dijelaskan dalam ayat dan hadits. Browser mengumpulkan setiap tempat di mana bab-bab ini disebutkan dalam Al-Qur''an, Sunnah, biografi, laporan para Sahabat dan
    Pengikut, kitab-kitab iman, komentar, asketisme, dan sejarah, serta setiap penyebutan dalam sebuah buku yang akan muncul mulai sekarang. Museum ini menjelaskan apa yang ada dalam sumber-sumber dan mengaitkan
    setiap pernyataan kepada penulisnya, tanpa mengeluarkan fatwa.'
  badge: Penjelajah Pilar, Orang, dan Kualitas
  status: Struktur ini berisi {n} catatan dalam bagian {s}, setiap catatan dikutip dalam sumbernya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumbernya. Ayat-ayat Al-Qur''an diambil dari tabel referensi yang menamai ayat-ayat yang terkait dengan buku hadits dan komentar
    ke setiap bab, karena Al-Qur''an tidak menggunakan istilah "pilar" dan "cabang iman" yang lebih baru; teks ayat tersebut adalah teks wahyu yang membeku dalam daftarnya. Bagian-bagian lainnya ditemukan
    saat konstruksi dalam kamus yang terjaga pada teksnya: kata-kata dari empat bab itu sendiri, hadis "Islam dibangun di atas lima orang," jawaban atas pertanyaan tentang Islam dan iman, pengumpulan doa,
    zakat, puasa, dan ziarah, iman kepada Allah, malaikat-Nya, kitab-kitab dan utusan-Nya, Hari Terakhir dan takdir, "sekitar tujuh puluh cabang," apa yang dianggap dalam teks sebagai iman, "tidak ada yang
    percaya," dan apa yang menggambarkan orang beriman dan Muslim. Referensi yang lemah, seperti menyebutkan satu pilar iman atau meningkatkan atau menurunkan iman, hanya dihitung bersama dengan referensi
    kuat atau dengan dua sekaligus. Setiap buku yang muncul kemudian secara otomatis disebutkan di sini ketika bagiannya muncul dalam grafik, dan catatan yang dipilih digabungkan dengan tag arkan-browser.
    Kutipan dari buku bergambar dapat dibaca mesin dan tidak dikoreksi, dan hal ini disebutkan di masing-masing buku.'
