bayt:
  title: Browser dari Rumah Kenabian dan keluarga nabi
  lede: 'Segala sesuatu yang dilaporkan tentang Rumah Kenabian dan keluarga Nabi dalam sumber-sumber museum: ayat-ayat dari Ahl al-Bayt dan istri-istri mereka dalam Al-Qur''an, hadits Dua Barang Berbekas,
    Jubah, dan Al-Ghadir, delegasi Anda, warisan Fatimah dalam Sahih, Al-Muwatta, dan Sunan, apa yang disampaikan dari Para Sahabat dan Pengikut, serta setiap penyebutan dalam sebuah kitab yang tercatat
    — catatan dengan sumbernya yang berbicara setiap kali teks baru ditambahkan.'
  badge: Penjelajah Rumah Nabi
  status: Struktur ini mencakup {n} sebuah catatan dalam {s} bagian; teks disusun agar manusia dapat meninjaunya.
  method_title: Kurikulum Browser
  method_note: Setiap catatan di sini adalah catatan museum biasa — beserta sumber dan narasi trilogi. Kenangan rumah tangga ditemukan selama proses pembuatan dalam kamus yang dijaga berdasarkan teks suku
    kata — kata-kata yang sudah mapan seperti Ahl al-Bayt, keturunan, dan Banu Hashim cocok langsung, nama ambigu seperti Fatimah dan Zainab bersifat deskriptif dan hanya dihitung dalam bentuk spesifiknya
    atau setelah memeriksa hasil positif palsu dengan pengenal pasti. Setiap buku yang dipanen kemudian akan otomatis memasukkan ingatannya di sini begitu teksnya muncul dalam gambar, dan catatan terpilih
    tentang Ahl al-Bayt disertai dengan label bayt-browser.
