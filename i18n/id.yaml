ubuwwa:
  title: Browser Parenthood dalam Islam
  lede: 'Ayah dan kebapakan dalam sumber museum: Para Bapa Al-Qur''an — doa Abraham kepada ayah dan keturunannya, Yakub dan Yusuf, wasiat Luqman kepada putranya, doa Zakharia, keluarga Imran — menghormati
    orang tua dan memperingatkan agar tidak taat, Nabi sebagai ayah bagi anak-anak dan cucu-cucunya, garis keturunan dan garis keturunan, wasiat ayah dan pengasuhan anak-anak mereka, yatim piatu yang kehilangan
    ayahnya — dalam Al-Qur''an, dua Sahih, Muwatta, Sunnah, kitab biografi, jejak Para Sahabat dan Pengikut, dan setiap kitab yang dihitung — catatan dengan sumbernya bertambah seiring masuknya teks-teks
    baru.'
  badge: Penjelajah Parenting
  status: Struktur {n} ini berisi catatan dalam bagian {s}; dan teks-teksnya disusun agar manusia dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap catatan di sini adalah catatan museum biasa dengan sumber dan prosa dalam tujuh bahasa. Kenangan tentang keayahan pada masa pembangunan ditemukan dalam kamus yang dijaga oleh teks
    bagian dalam lima keluarga: ayah itu sendiri (keayahan, ayahnya, ayahnya, ayah kami, ayah-ayahnya, ayahnya, ayahnya, ayahnya, ayahnya, oh ayah), menghormati orang tua dan ketidakpatuhan (menghormati
    orang tua, kebaikan, ketidakpatuhan, kepuasan orang tua), pengasuhan dan wasiat (Luqman, wahai anakku, membesarkan, wasiat ayahnya, ajari anak-anakmu), garis keturunan dan garis keturunan (garis keturunan,
    garis keturunan, klaim, anak ke tempat tidur), dan anak yatim (sponsor yatim, yatim piatu, yatim piatu). Kata-kata ambigu dijaga: kunya ''Abu so-and-so'' menyebut seorang pria tetapi tidak menyebutkan
    paternitas, sehingga tidak pernah dianggap ''ayah'' sebagai abstrak — hanya bentuk tambahan, jamak, dan bentuk vokatif; kata-kata anak-anak hanya dihitung di samping kata ''ayah'' dalam jendela yang
    sama (jadi ''O anak-anak Adam'' masuk ke dalam ucapan Tuhan); dan positif palsu yang tercapai dikecualikan oleh yang pasti. Setiap buku yang dipanen kemudian secara otomatis membawa ingatannya ke sini;
    catatan terpilih dimasukkan dengan label ubuwwa-browser; dan ayah terkenal membaca dari tepi parent_of dan child_of dalam gambar yang sama.'
