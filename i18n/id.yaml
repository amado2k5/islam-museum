ansab:
  title: Penjelajah silsilah, ras, klan, dan pohon nabi serta utusan
  lede: 'Setiap penyebutan garis keturunan, garis keturunan, klan, dan pohon nabi serta utusan dalam sumber museum: garis keturunan Nabi dalam tiga bagiannya — yang disepakati sebagai otentik untuk Adnan,
    yang diperdebatkan untuk Abraham, dan di atasnya — serta suku Arab Adnanis dan Qahtanis, ras dan bangsa Arab, non-Arab, Romawi, Abyssinia, Koptik, dan Anak-anak Israel, serta klan suku dari Hashim,
    Muttalib, Abd Shams, Makhzum, dan Zahra hingga klan Aws, Khazraj, Hawazin, dan Qays — dalam Al-Qur''an, Sunnah, biografi, laporan para Sahabat dan Pengikut, serta setiap kitab yang telah ditetapkan
    dan setiap kitab yang menyusul.'
  badge: Penjelajah silsilah, ras, dan garis keturunan
  status: Struktur ini berisi {n} sebuah catatan dan {f} yang disegmentasi dalam {s} bagian; teksnya adalah draf agar seseorang dapat membacanya.
  method_title: Kurikulum Browser
  method_note: 'Setiap rekaman di sini adalah catatan museum biasa — dengan prosa dan frasa trilingualnya. Kenangan ditemukan selama proses pembuatan dalam kamus yang dijaga oleh teks-teks bagian-bagian:
    nama-nama lingkaran garis keturunan Nabi (dari Abdullah ibn Abdul Muttalib hingga Adnan, lalu lingkaran sengketa menjadi Ismail dan kemudian Ibrahim), nama-nama suku dan klan (Quraisy, Banu Hashim,
    Aws, Khazraj, Tamim, Hawazin, Thaqif, Ghatfan, Quda''ah, Kindah, Bakr, Taghlib, dan lainnya), nama-nama bangsa-bangsa (Arab, non-Arab, Persia, Romawi, Abyssinia, Koptik, Turki, Berber, Kurdi, Mongol,
    dan Banu Israel), nama-nama klan (klan Quraisy, klan Aws, Khazraj, klan Hawazin, dan Qay), serta istilah umum ( garis keturunan, garis keturunan, suku, perut, klan, klan, paha, keluarga, dan pohon nabi);
    tidak termasuk ''ad'' yang berarti kembali, ''tamim'' yang berarti lengkap, dan ''matn'' yang berarti kembali, serta tidak termasuk positif palsu yang didokumentasikan oleh artikel pasti. Setiap buku
    yang muncul kemudian secara otomatis disebutkan di sini ketika bagiannya ditempatkan dalam bagan, dan catatan yang dipilih digabungkan melalui tag ansab-browser. Setiap bagian ditandai dengan sumbernya
    (Al-Qur''an/Sunnah/Biografi/Kitab) dan topiknya.'
