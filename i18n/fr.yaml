ubuwwa:
  title: "Explorateur de la paternité en islam"
  lede: "Le père et la paternité dans les sources du musée : les pères du Coran — Abraham et son invocation, Jacob et Joseph, les conseils de Luqman à son fils, la prière de Zacharie, la famille d’Imran — la piété envers les parents (birr al-walidayn) et les avertissements contre l’uquq, le Prophète comme père auprès de ses enfants et petits-enfants, la paternité et la lignée (nasab), les testaments des pères et l’éducation des enfants, l’orphelin privé de père — dans le Coran, les deux Sahih, le Muwatta et les Sunan, la sira, les récits des Compagnons et des Successeurs et chaque livre dépouillé — des notices sourcées qui s’enrichissent avec les nouveaux textes."
  badge: "Exploration de la paternité"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions de paternité sont repérées à la génération du site par un lexique assorti de garde-fous, en cinq familles : le père (ubuwwa, abuhu, abihi, abuna, aba', waliduhu, ya abati), piété et désobéissance envers les parents (birr al-walidayn, bonté envers les parents, uquq, satisfaction des parents), éducation et conseils (Luqman, adresse au fils, éducation, testament du père, enseignement aux enfants), paternité et lignée (nasab, rattachement, revendication, attribution de l’enfant au lit conjugal), orphelin (yatim, yatama, prise en charge de l’orphelin). Les termes ambigus sont encadrés : la kunya Abu untel nomme un homme sans renseigner sa paternité ; Abu isolé ne compte donc jamais, seules comptent les formes possessives, plurielles et vocatives. Le vocabulaire de l’enfant ne compte qu’auprès d’un mot désignant le père dans la même fenêtre (l’adresse divine aux enfants d’Adam est écartée) ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions ; les notices thématiques les rejoignent par l’étiquette ubuwwa-browser. Les pères célèbres sont tirés des relations parent_of et child_of du graphe."
