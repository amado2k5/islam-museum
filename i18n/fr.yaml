        récompense de l’ihsan et les versets où hasana désigne un bien terrestre.'
    sunnah:
      title: Dans la sunna
      desc: 'Les hadiths des deux Sahih, du Muwatta, des Arba''in et des Sunan : hadith qudsi sur l’inscription des bonnes et mauvaises actions, multiplication des actes humains, instauration d’un bon usage
        en islam, gecko et récits semblables, chaque récit citant ou enseignant les bonnes actions.'
