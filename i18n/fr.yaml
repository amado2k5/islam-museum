    — la piété envers les parents (birr al-walidayn) et les avertissements contre l’uquq, le Prophète comme père auprès de ses enfants et petits-enfants, la paternité et la lignée (nasab), les testaments
    des pères et l’éducation des enfants, l’orphelin privé de père — dans le Coran, les deux Sahih, le Muwatta et les Sunan, la sira, les récits des Compagnons et des Successeurs et chaque livre dépouillé
    — des notices sourcées qui s’enrichissent avec les nouveaux textes.'
