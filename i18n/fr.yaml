signs:
  title: "Explorateur des signes de l’Heure"
  lede: "Les signes de l’Heure ⁦(أشراط الساعة)⁩ dans les sources du musée, dans l’ordre : les signes en général, le Mahdi, le Dajjal, Yajuj et Majuj, puis l’Heure elle-même. Le Jour du jugement, le Paradis et le Feu ont leurs propres explorateurs."
  badge: "Exploration de l’eschatologie"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions eschatologiques sont repérées à la génération du site par un lexique assorti de garde-fous : formes univoques directement, formes ambiguës comme al-sa'a (l’Heure ou une heure), al-janna (Paradis ou jardin), al-nar (Enfer ou feu), al-akhira (au-delà ou dernière d’une série), al-sirat (Pont ou chemin), al-mizan (Balance ou balance ordinaire) uniquement auprès de leurs associations de termes. Les faux positifs vérifiés sont exclus par identifiant ; chaque livre dépouillé par la suite apporte automatiquement ses mentions dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette eschatology-browser."
  api: "L’ensemble est disponible à l’adresse"
  sections_title: "Les sections de l’explorateur"
  filter_label: "Filtrer les notices des signes"
  filter_none: "Aucun résultat."
  empty: "Cette version ne contient pas encore de notices des signes."
  signs_status: "Cette version contient {n} notices sur les signes de l’Heure en {s} étapes, sur {all} notices eschatologiques au total ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  path_title: "Les signes dans l’ordre"
  path_note: "L’ordre ci-dessous suit la disposition habituelle des livres de croyance : signes en général, figures nommées par les sources, puis l’Heure. Aucun texte ne fixe cette succession ; le musée ne tranche pas sur le signe qui vient en premier. À chaque étape, les notices du musée précèdent les passages mentionnant le signe."
  steps:
    ashrat: { title: "Les signes en général", desc: "Les signes annonciateurs de l’Heure : signes mineurs et majeurs, épreuves et grandes batailles, Bête et soleil se levant à l’ouest." }
