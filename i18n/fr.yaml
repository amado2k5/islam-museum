umuma:
  title: Explorateur de la maternité en islam
  lede: 'La maternité dans les sources du musée : la mère, son rang et les devoirs envers elle, la grossesse et l’accouchement, l’allaitement, la garde et l’éducation des enfants, les mères des prophètes,
    des Compagnons et des Successeurs — dans le Coran, les deux Sahih, le Muwatta et les Sunan, la sira, les récits des Compagnons et des Successeurs et chaque livre dépouillé — des notices sourcées qui
    s’enrichissent avec les nouveaux textes.'
  badge: Exploration de la maternité
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: Comment fonctionne cet explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les mentions de maternité sont repérées à la génération du site par un lexique assorti de
    garde-fous, en six familles : mère et rang maternel (ummuhu, ummuha, ummahat, walida, umuma, mères des croyants), grossesse (femme enceinte, femmes enceintes, porter un enfant, faiblesse accrue), accouchement
    (wilada, waladat, talid, mawlud, mise au monde, contractions, suites de couches), allaitement (rada''a, arda''at, nourrice, nourrisson, sevrage), garde et éducation (hadana, gardienne, éducation, enfant
    chéri, prise en charge de l’orphelin), piété filiale (birr, ihsan, liens de parenté). Les termes ambigus sont encadrés : umm isolé ne compte qu’auprès du vocabulaire familial (Umm al-Qura et Umm al-Kitab
    sont exclus) ; haml ne compte au sens de grossesse qu’auprès de ce vocabulaire (portage et transport exclus) ; walad au sens de garçon est écarté au profit des formes de naissance ; birr ne compte qu’auprès
    des parents (barr, la terre, est exclu). Les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions ; les notices thématiques les
    rejoignent par l’étiquette umuma-browser ; les mères sont tirées des relations child_of du graphe vers des parents féminins.'
