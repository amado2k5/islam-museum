      desc: 'Les hadiths des deux Sahih, des Sunan et du Muwatta et leurs commentaires : hadith de Gabriel, islam bâti sur cinq fondements, délégation d’Abd al-Qays, envoi de Mu''adh au Yémen, branches
        et douceur de la foi, conditions de la foi complète, comparaisons et descriptions du croyant.'
    seerah:
