    nasab: "Paternité et lignée"
    yatm: "L’orphelin"
  sections:
    quran:
      title: "Dans le Coran"
      desc: "Le père et la paternité dans le Coran : les appels à la bonté envers les parents dans al-Baqara, al-Isra', Luqman et al-Ahqaf ; la prière d’Abraham pour son père et sa descendance ; les conseils de Jacob et ses fils ; les sept conseils de Luqman ; la prière de Zacharie pour un fils ; la famille d’Imran ; Joseph élevant ses parents sur le trône ; l’orphelin que le Coran protège."
    sunnah:
      title: "Dans la sunna"
      desc: "Le père dans les deux Sahih, le Muwatta et les Sunan : le Prophète père de Fatima et de ses fils, portant al-Hasan sur son épaule, la valeur accordée à la bonté envers sa famille ; les récits de birr al-walidayn — le père comme porte centrale du Paradis — et les avertissements contre l’uquq ; le père enseignant à ses enfants ; les décisions de paternité fondées sur le lit conjugal ; la prise en charge de l’orphelin."
    seerah:
      title: "Dans la sira"
      desc: "Ce que les ouvrages de sira et d’histoire rapportent des pères et des enfants — Abd al-Muttalib et Abd Allah, l’enfance orpheline du Prophète, l’émigration d’Abou Bakr avec sa famille, Hamza et Ali dans les suites de Hudaybiyya, les pères des Compagnons et des Successeurs — à mesure que de nouveaux textes sont intégrés."
    books:
      title: "Dans les autres livres"
      desc: "Les récits de paternité dans chaque ouvrage dépouillé hors du Coran, du hadith et de la sira — fiqh de la paternité et de la garde, adab du birr et de l’uquq, biographie, histoire et poésie — classés selon le genre de l’ouvrage dès l’arrivée de ses passages."
