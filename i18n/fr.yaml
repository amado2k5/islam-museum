  title: "Explorateur du Paradis"
  lede: "Chaque mention et description du Paradis (al-janna) dans les sources du musée : ses noms et descriptions coraniques, les hadiths sur ses portes, ses fleuves, son sol, ses degrés et ses habitants, les récits de la sira et des ouvrages d’histoire, ceux des Compagnons et des Successeurs et chaque mention dans chaque livre dépouillé — des notices sourcées qui s’enrichissent à mesure que de nouveaux textes sont intégrés."
  badge: "Exploration du Paradis"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions sont repérées à la génération du site grâce à un lexique assorti de garde-fous appliqué aux passages : les noms sans ambiguïté (al-Firdaws, jannat 'Adn, Dar al-Salam, jannat al-Ma'wa et les associations de termes propres au Paradis) sont retenus directement ; le nom isolé « الجنة/جنات/جنان » n’est retenu qu’auprès d’une telle association, afin d’écarter les jardins terrestres. Le texte du hadith présentant le jeûne comme un bouclier est masqué ; la famille lexicale des djinns est exclue par délimitation des lettres ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions du Paradis dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent grâce à l’étiquette janna-browser. Chaque passage porte le type description s’il dépeint le Paradis, mention s’il le nomme."
