hudud:
  title: Explorateur des limites de Dieu et des péchés majeurs
  lede: 'Chaque mention des limites de Dieu et des péchés majeurs dans les sources du musée : les versets qui nomment ces limites et leur transgression, les peines de fornication, de vol et de calomnie
    dans les deux Sahih, le Muwatta et les Sunan, leur application dans la sira et les récits des Compagnons et des Successeurs, les listes de kaba''ir et des sept péchés destructeurs, et chaque mention
    de chaque livre dépouillé — des notices sourcées qui s’enrichissent avec les nouveaux textes.'
