    title: Temps
    blurb: Époques, chronologies, ce jour de l'histoire, n'importe quelle année du monde islamique.
  place:
    title: Lieux
    blurb: Villes, sites et routes sur une carte qui voyage dans le temps.
  people:
    title: Personnes
    blurb: 'Prophètes, compagnons, savants, souverains, scientifiques, poètes, voyageurs : des femmes et des hommes qui ont façonné l''histoire.'
  ideas:
    title: Idées
    blurb: Croyances, concepts, sciences et écoles, expliqués en termes simples.
  objects:
    title: Objets
    blurb: Manuscrits, art, architecture et reliques des collections du monde entier.
  words:
    title: Paroles
    blurb: Coran, hadith, poésie, et les langues et écritures des peuples musulmans.
  living:
    title: Islam vivant
    blurb: Pratiques, année islamique, fêtes, cuisine, habillement et musique par région.
  today:
    title: Aujourd'hui
    blurb: Nations, institutions, données et les gens du présent.
  made:
    title: Réalisations
    blurb: 'Ce que les musulmans font et possèdent aujourd''hui : librairies, éditeurs, applications, studios, marques et œuvres caritatives.'
