foundation:
  'title': 'À propos de la fondation Islam Museum'
  'lede': 'Un musée de l''islam libre, ouvert et entièrement numérique : la foi, la civilisation, les peuples, les lieux, les idées, les objets, les textes et la
    culture vivante, du monde où l''islam est né jusqu''à aujourd''hui.'
  'logo_title': 'Le logo'
  'logo_intro': 'Le symbole rassemble trois éléments de l''architecture islamique et du livre en une seule forme.'
  'logo_star': 'L''étoile à huit branches, issue de la géométrie islamique : le temps et l''espace ensemble, ni l''un ni l''autre compris sans l''autre.'
  'logo_arch': 'Le mihrab : la porte par laquelle le visiteur entre, et le tournant vers la qibla.'
  'logo_book': 'Le livre ouvert : le savoir et les mots, et la lecture avant le jugement.'
  'logo_download': 'Symbole (PNG)'
  'emblem_alt': 'L''emblème du musée : une étoile à huit branches dorée autour d''un disque de lapis avec une arche de mihrab cuivrée sur un livre ouvert'
  'emblem_download': 'Emblème complet (image)'
  'logo_dark_download': 'Symbole pour fonds sombres'
  'logo_lockup_download': 'Télécharger le symbole avec le nom'
  'story_title': 'L''histoire'
  'story_1': 'Le projet est né d''une question simple : pourquoi n''existe-t-il pas un seul endroit en ligne qui rassemble toute l''histoire de l''islam, où un
    étranger puisse entrer et apprendre, et un chercheur vérifier une affirmation et remonter à la source ? Ce que l''on sait de l''islam est dispersé entre sites
    d''écritures, archives de musées, articles d''encyclopédie, études académiques et couverture de presse, et une grande partie est écrite pour défendre ou
    attaquer plutôt que pour comprendre.'
  'story_2': 'Le projet a choisi d''être construit comme un musée, non comme un long article : neuf ailes (Temps, Lieux, Personnes, Idées, Objets, Paroles, Islam
    vivant, Aujourd''hui et Réalisations) regardent le même sujet sous des angles différents, et chaque personne, lieu, événement, idée ou objet est un nœud d''un
    graphe qui le relie à ce qui l''entoure dans le temps et dans l''espace.'
  'story_3': 'Le matériau est conservé en fichiers simples et lisibles, chaque fait lié à une source et chaque date écrite dans sa forme précise avec ses
    calendriers hégirien et grégorien. Le site lui-même est un ensemble de pages statiques : pas de serveur, pas de base de données, pas de service payant, et
    aucun modèle d''IA qui tourne à l''arrivée d''un visiteur.'
  'story_4': 'Quand le musée a choisi son identité visuelle, ses couleurs sont venues de l''architecture islamique et de la fabrication des manuscrits : le bleu
    lapis profond, l''or discret des pages de manuscrit, l''albâtre chaud et le sable des carreaux. Aucun ornement n''a été copié d''une œuvre existante ; les
    motifs croissent de la géométrie de l''étoile, du carré et du cercle.'
  'story_5': 'Puis vint le travail partagé : contributeurs et sessions de travail parallèles ajoutent de petits lots de matériau, et la relecture transforme les
    brouillons en entrées relues avant qu''elles ne soient marquées ainsi. Le musée est encore en construction, et il le dit sur chaque page ; la page de
    couverture compte ce qui est complet et ce qui attend encore.'
  'founder_title': 'Le fondateur'
  'founder_line': 'Fondé par {name}, Canadien d''origine égyptienne, résidant à Oakville, Ontario.'
  'founder_name': 'Ahmed Abdel Aal'
  'founder_body': 'Une personne a fondé le projet et écrit son premier plan dans le dépôt lui-même, puis a ouvert la porte à quiconque voulait ajouter ou
    corriger. Le plan est construit pour que le musée survive même si son fondateur s''arrête : son texte est dans git, ses données sont ouvertes, et chacun peut
    copier le musée entier sur son propre ordinateur. Cette page décrit le projet et son but, pas la vie de la personne derrière.'
  'independence_title': 'Indépendance'
  'independence_1': 'islam.museum est le projet personnel de son fondateur, qui le dirige seul. Sa gestion, sa propriété et ses décisions ne sont jamais
    partagées, et il n''est pas à vendre : aucun financement, partenariat ou soutien de quelque sorte ne donne à quiconque un contrôle sur lui.'
  'independence_2': 'Le musée ne sera jamais fusionné à un autre projet, et il ne se place sous aucune ombrelle ni aucune tutelle — ni gouvernement, ni
    institution religieuse, ni société, ni fondation. Tout le monde est bienvenu pour aider : retours et corrections, bénévolat, financement et collecte de
    fonds, matériaux, tests, code, écrits sur le musée et diffusion du message. L''aide est remerciée et créditée, et elle n''apporte aucune autorité avec elle :
    le musée reste indépendant, des gens pour les gens.'
  'terms_title': 'Libre d''usage — et à quelles conditions'
  'terms_1': 'Tout ici est libre d''usage, sans demander : toutes les données, ressources et services du musée, présents et futurs, de toute manière et sans
    limite, et sans aucun contrôle de notre part. Vous pouvez cloner, fourcher ou copier tout le code et lancer un projet similaire, modifié ou entièrement
    nouveau — le fondateur ne portera aucune réclamation de droit d''auteur ni tentative légale contre de telles entreprises. Les données sont CC0, les textes
    CC BY-SA 4.0 et le code MIT.'
  'terms_2': 'Le musée peut changer n''importe quoi à tout moment — le site, son contenu, son code, son hébergement, ses performances, son architecture et son
    déploiement — sans consentement préalable, sans approbation et sans préavis à quiconque. Il n''y a aucun accord de niveau de service ni garantie d''aucune
    sorte : si le site dysfonctionne, tombe en panne, est indisponible ou est modifié, aucune réclamation ne peut être faite au musée ou à son propriétaire à ce
    titre.'
  'terms_3': 'Ce que vous faites de ce que vous trouvez ici relève de votre responsabilité. Ni le site ni son propriétaire, ni l''hébergeur, ne sont
    responsables du comportement, des actes, de l''adoption, de l''application, de la reproduction ou de la réutilisation du contenu publié par quiconque, ni
    d''aucun malentendu, erreur de présentation, mauvais usage ou tort qui suivrait les actes d''un visiteur. Chaque notice cite ses sources et montre son état
    de relecture, mais l''exactitude est citée, pas garantie — la source citée est où une affirmation se vérifie en dernier — et les sites que nous lions
    relèvent de la responsabilité de leurs propriétaires.'
  'terms_4': 'Tout auteur ou entité ayant une réclamation sur un contenu peut demander à tout moment son retrait ou sa modification : les outils de signalement
    de ce site sont toujours ouverts exactement pour cela, et de telles demandes sont traitées en premier. Toutes les opinions et vues exprimées sur ce site
    sont celles du fondateur seul et ne reflètent pas les vues ou opinions de son employeur.'
  'purpose_title': 'Ni lucratif, ni pour un agenda'
  'purpose_1': 'islam.museum n''est pas géré pour le profit ou le gain. Il ne poursuit aucun agenda et ne sert aucun besoin gouvernemental ou commercial. Il est
    gratuit pour tous : pas d''abonnements, pas de pistage, et aucune intention d''utiliser ou de vendre les informations de quiconque à quiconque.'
  'purpose_2': 'Faire fonctionner le musée coûte de l''argent réel chaque mois, et son fondateur porte ces coûts personnellement. Les bénévoles sont les
    bienvenus, et quiconque le souhaite peut donner pour les coûts, comme il veut — sans engagement, sans obligation, et sans contrôle en retour.'
  'purpose_3': 'À l''avenir, le musée prévoit une boutique / bazar en ligne dans sa propre section claire et séparée du site, où des articles pourront être
    listés et vendus pour quiconque voudra les parcourir ou y acheter, pour aider aux coûts. Elle ne portera ni publicités, ni spam, ni sollicitation, et la
    visiter sera toujours optionnel ; jusqu''à son ouverture, il n''y a pas de boutique, et le musée lui-même reste gratuit.'
  'purpose_4': 'Le musée s''oppose fermement à la haine, aux discours de haine et au tort — contre l''islamophobie, l''antisémitisme, le racisme, le génocide,
    le nettoyage ethnique et tout ce que les Nations unies classent comme haine ou racisme — et soutient et promeut la diversité, la différence d''opinion et la
    paix. Il ne soutient aucune opinion contre une autre, ni aucune narration de l''histoire contre une autre : c''est une archive et une bibliothèque du
    patrimoine humain, présentant ce que d''autres ont fait et écrit tel quel, de leur propre point de vue. Leurs vues sont les leurs seules ; le musée
    n''approuve personne, ne prêche rien, et n''offre ni consultation, ni services ni conseils d''aucune sorte. La Charte l''énonce en entier (Article 10). Le
    musée ne réclame aucun droit d''auteur, brevet ou propriété sur ce qu''il présente, et il n''offre ni incitation, ni argent ni gain à quiconque pour le
    visiter, le voir ou le promouvoir — quiconque vient, vient de son propre gré.'
  'contact_title': 'À qui écrire'
  'contact_press': 'Presse et médias'
  'contact_copyright': 'Réclamations de droit d''auteur'
  'contact_concerns': 'Toutes autres questions'
  'goal_title': 'Le but'
  'goal_intro': 'Le but du musée est de montrer l''islam entier, de ses débuts au moment présent, équitablement et sans parti pris. À cette fin il s''engage
    à ce qui suit :'
  'goal_1': 'Il décrit plutôt qu''il ne prescrit : des faits avec dates et sources, et des jugements attribués à ceux qui les ont portés.'
  'goal_2': 'Le récit sunnite est le cadre principal de recherche, et tout autre point de vue n''est énoncé qu''après avoir été clairement étiqueté.'
  'goal_3': 'Adversaires, critiques et alliés apparaissent avec leurs rôles en leur temps, décrits sans le langage de l''inimitié.'
  'goal_4': 'Les questions disputées apparaissent en cartes de tension : deux voix ou plus, chacune citée, sans verdict du musée.'
  'goal_5': 'Chaque affirmation est liée à une source ; Wikipédia est un pointeur, jamais une source.'
  'goal_6': 'Il commence en arabe, et il sert le visiteur qui ne sait rien de l''islam aussi bien que le spécialiste.'
  'take_title': 'Prenez part à sa construction'
  'take_body': 'Le contenu et le code sont ouverts à tous. Vous pouvez lire le dépôt, signaler une erreur, proposer une nouvelle entrée, ou demander une
    traduction dans une autre langue.'
  'take_repo': 'Le dépôt sur GitHub'
  'take_suggest': 'Proposer une entrée ou une correction'
  'license': 'Licence : textes CC BY-SA 4.0 · données CC0 · code MIT'
  'breadcrumb': 'Musée'
