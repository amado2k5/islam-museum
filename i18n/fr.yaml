  mentioned_in: 'Mentionné dans :'
  timeline_title: Sur la chronologie
  timeline_caption: 'Notices datées : {n} · sans date : {u}'
  sections:
    umam:
      title: Les nations racontées
      desc: 'Les nations racontées par le Coran et détruites par Dieu : Aad, Thamud et Saba, peuples de Noé, de Loth et de Shu''ayb, Gens d’al-Rass, du Fossé et de la Cité, peuple de Tubba'' et peuple de
        Pharaon — chacune avec ses versets et récits.'
    adyan:
      title: Les religions
      desc: 'Les confessions nommées par le Coran et le hadith : juifs, chrétiens, mages et sabéens — religions ayant connu avec l’Islam pactes, guerres et dhimma.'
    tawaif:
      title: Confessions et tribus
      desc: 'Communautés au sein des religions et tribus arabes de foi autre que l’Islam : Banu Qaynuqa'', al-Nadir et Qurayza, juifs de Khaybar, chrétiens de Najran, Ghassan et Lakhm — selon les livres.'
    shuub:
      title: Peuples et nations
      desc: 'Peuples proches et lointains consignés par les sources : Romains, Perses, Abyssins, Coptes, Turcs, Inde, Chine, Berbères, Zanj, Slaves, Rus et Nabatéens — gens des royaumes et provinces.'
    mushrikun:
      title: Les polythéistes d’Arabie
      desc: 'Les adorateurs d’idoles d’Arabie avant l’Islam : habitants de La Mecque, Quraysh et ceux de leur religion, idoles, rites et histoire jusqu’à la conquête — une section propre, car ils n’étaient
        ni Gens du Livre ni d’une autre confession.'
    ayan:
      title: Figures nommées
      desc: 'Les personnes de ces nations nommées par les sources : Héraclius et Khosro, le Négus, al-Muqawqis, al-Mundhir ibn Sawa, rabbins des juifs de Médine, notables polythéistes de Quraysh et personnes
        d’une autre foi avant l’Islam.'
    sukun:
      title: Terres et demeures
      desc: 'Les terres et lieux habités par ces nations : Najran, Khaybar, al-Hira, Busra, Yathrib, al-Ahqaf et Pétra — chaque lieu avec son récit.'
    mafahim:
      title: Concepts
      desc: 'Le vocabulaire des sources sur ces nations : Gens du Livre, gens de la dhimma, jizya, shirk, kufr, hypocrisie, hanif et umma — les idées classant les relations.'
    kutub:
      title: Livres et sources
      desc: 'Les œuvres conservant les récits de ces nations : tafsirs, Sahihs, sira, maghazi, histoires, chroniques des conquêtes et hérésiographies — chaque livre dans son rôle.'
    dhikr:
      title: Mentions dans les sources
      desc: Chaque verset, passage, œuvre, événement et question nommant une nation, religion, confession ou un peuple non musulman — par une relation mentions ou un nom sans ambiguïté dans le texte, avec
        les sections de la cible.
  viz:
    caption: 'La carte du monde des textes : La Mecque et Médine au cœur, Rome au nord-ouest, Perse au nord-est, Abyssinie au sud-ouest, Gens du Livre en bande médiane, nations disparues sous l’horizon,
