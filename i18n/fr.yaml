      desc: "Les versets que les recueils de hadiths et les commentaires rattachent aux quatre thèmes : témoignage, prière associée à la zakat, jeûne et pèlerinage, foi en Dieu, Ses anges, Ses livres, Ses messagers, le Dernier Jour et le décret, augmentation de la foi, descriptions des croyants et des serviteurs du Miséricordieux."
    sunnah:
      title: "Dans la sunna"
      desc: "Les hadiths des deux Sahih, des Sunan et du Muwatta et leurs commentaires : hadith de Gabriel, islam bâti sur cinq fondements, délégation d’Abd al-Qays, envoi de Mu'adh au Yémen, branches et douceur de la foi, conditions de la foi complète, comparaisons et descriptions du croyant."
    seerah:
      title: "Dans la sira"
      desc: "Ce que les ouvrages de sira rapportent des piliers, de la foi et des qualités des croyants : l’enseignement religieux aux délégations, les lettres du Prophète aux tribus et les attitudes des Compagnons ; cette section s’enrichit avec les nouveaux textes de sira."
    books:
      title: "Dans les autres livres"
      desc: "Les quatre thèmes dans chaque ouvrage dépouillé hors du Coran, du hadith et de la sira : livres de foi et de croyance, biographies et récits des Compagnons et des Successeurs, livres de renoncement, de fiqh et d’histoire, et les ouvrages à venir."
    curated:
      title: "Notices sur les piliers, branches et qualités"
      desc: "Les notices thématiques du musée : les cinq piliers de l’islam et chacun d’eux, les six piliers de la foi et chaque article, les branches de la foi et le livre qu’al-Bayhaqi leur consacre, les qualités du croyant et les concepts associés."
  topics:
    islam:
      title: "Les piliers de l’islam"
      short: "Les cinq fondements de l’islam : les deux témoignages, l’accomplissement de la prière, le versement de la zakat, le jeûne du Ramadan et le pèlerinage à la Maison."
      desc: "Tout ce que les sources du musée rapportent des cinq piliers : deux témoignages, prière, zakat, jeûne du Ramadan et pèlerinage, dans le Coran, la sunna, la sira et les autres livres."
      scope: "Ici figurent les textes nommant les piliers, les énumérant ensemble ou définissant l’islam par eux, et les versets du témoignage, de la prière, de la zakat, du jeûne et du pèlerinage inscrits dans la table coranique. Le détail de chaque acte est dans l’explorateur du culte et des évocations."
    iman:
      title: "Les piliers de la foi"
      short: "Les six du hadith de Gabriel : foi en Dieu, Ses anges, Ses livres, Ses messagers, le Dernier Jour et le décret, dans son bien comme dans son mal."
      desc: "Tout ce que les sources du musée rapportent des six piliers de la foi : Dieu, Ses anges, Ses livres, Ses messagers, le Dernier Jour et le décret, dans le Coran, la sunna, la sira et les autres livres."
      scope: "Ici figurent les textes nommant les piliers de la foi, les énumérant ensemble ou répondant à la question sur la foi, ainsi que la foi au décret. Les anges, le Dernier Jour et les messagers ont leurs explorateurs détaillés."
    shuab:
      title: "Les branches de la foi"
      short: "Soixante-dix et quelques branches : la plus haute est l’affirmation de l’unicité divine, la plus basse le retrait d’un obstacle du chemin ; la pudeur en est une."
      desc: "Tout ce que les sources du musée rapportent des branches de la foi : le hadith des soixante-dix et quelques branches, ce qu’un texte compte dans la foi, sa douceur, sa plénitude et ses conditions, dans le Coran, la sunna, la sira et les autres livres."
      scope: "Ici figurent les textes nommant les branches ou comptant un acte, une parole ou un état dans la foi, ceux liant un acte à la foi en Dieu et au Dernier Jour, les versets de l’augmentation de la foi. Une note citant le titre du livre d’al-Bayhaqi ne compte pas comme mention."
    khisal:
      title: "Les qualités du croyant"
      short: "Les qualités décrites par les versets et hadiths : humilité dans la prière, loyauté, miséricorde envers les croyants, patience et véracité."
      desc: "Tout ce que les sources du musée rapportent des qualités du croyant : versets décrivant les croyants et les serviteurs du Miséricordieux, hadiths de comparaisons, descriptions du croyant et du musulman et devoirs réciproques, récits des Compagnons et des Successeurs."
      scope: "Ici figurent les textes décrivant le croyant ou le musulman, les comparant ou énumérant leurs qualités. Le caractère en général relève de l’explorateur de l’éthique."
