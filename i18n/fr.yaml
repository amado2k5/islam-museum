umam:
  also_under: 'Également dans :'
  title: Explorateur des nations, religions, confessions et peuples non musulmans
  lede: 'Les nations, religions, confessions et peuples non musulmans nommés dans le Coran, le hadith, les récits et livres des Compagnons et des Successeurs : nations disparues, des Aad et Thamud au peuple
    de Tubba'', Gens du Livre, mages et sabéens, polythéistes d’Arabie, rois, figures de la terre et peuples lointains — chaque verset, récit et narration qui les nomme, avec sa source.'
  badge: Exploration des nations et peuples
  status: Cette version contient {n} notices en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: Fonctionnement de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, sourcée et trilingue, sans table annexe. Les notices sélectionnées portent l’étiquette umam-browser et les étiquettes um-<section> ; toute
    œuvre, tout passage ou toute question avec une relation mentions vers un membre entre dans les mentions des sources et les sections de la cible. Un lexique assorti de garde-fous ne retient que les noms
    sans ambiguïté : un livre dépouillé par la suite apparaît dès l’arrivée de ses relations. Le texte coranique n’est jamais parcouru lexicalement : les versets entrent seulement par des relations mentions
    vérifiées.'
  api: Le jeu de données complet est à l’adresse
