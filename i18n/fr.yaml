halal:
  title: "Explorateur du licite et de l’illicite"
  lede: "Chaque mention du licite et de l’illicite dans les sources du musée : les versets d’autorisation et d’interdiction d’al-Baqara, al-Ma'ida, al-An'am, al-A'raf et al-Nahl ; les hadiths sur leur clarté, l’interdiction de tout enivrant et ce qui n’est pas permis au musulman dans les deux Sahih, le Muwatta et les Sunan ; la prudence face à l’illicite et la recherche de gains licites dans la sira et les récits des Compagnons et des Successeurs ; les juristes sur le permis et l’interdit ; chaque mention dans les livres dépouillés à l’avenir. Le musée décrit les sources et attribue chaque avis à son auteur ; il ne prononce aucun avis juridique."
  badge: "Exploration du licite et de l’illicite"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "Comment fonctionne cet explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions sont repérées à la génération du site par un lexique assorti de garde-fous : halal et haram dans leurs formes ; verbe de permission avec son auteur ou bénéficiaire (Dieu permet, permission accordée, ce qui n’est pas permis à une personne) ; verbe d’interdiction avec son auteur ou destinataire (Dieu interdit, ce qui est interdit aux destinataires) ; tahrim, muharramat, maharim Allah et istihlal. Les verbes isolés et les mots voisins — tayyibat, khaba'ith, shubuhat, mubah, makruh — ne comptent qu’auprès d’un terme fort. Sont retirés avant détection : Mosquée sacrée, Maison sacrée, mois sacré, nom propre Haram, état d’ihram et sortie de cet état, protection divine contre le Feu. Chaque livre dépouillé par la suite apporte ses mentions dès l’arrivée de ses passages, sans étiquetage préalable. En cas de désaccord des juristes, chaque avis est attribué à son auteur, sans choix du musée."
  api: "L’ensemble est disponible à l’adresse"
  sections_title: "Sections"
  filter_label: "Filtrer les mentions du licite et de l’illicite"
  filter_none: "Aucun résultat correspondant."
  empty: "Cette version ne contient pas encore de notices sur le licite ou l’illicite."
  kinds: { halal: "le licite", haram: "l’illicite", both: "le licite et l’illicite ensemble" }
  sections:
    quran:
      title: "Dans le Coran"
      desc: "Les versets d’autorisation et d’interdiction : aliments interdits dans al-Baqara, al-Ma'ida, al-An'am et al-Nahl ; bonnes choses rendues licites, nourriture des Gens du Livre et gibier marin ; femmes qu’on ne peut épouser dans al-Nisa' ; interdiction de l’usure et des turpitudes ; mise en garde contre l’interdiction de ce que Dieu permet et les déclarations sans savoir sur le licite et l’illicite."
    sunnah:
      title: "Dans la sunna"
      desc: "Les hadiths des deux Sahih, du Muwatta et des Sunan, les récits des Compagnons et des Successeurs dans les deux Musannaf et les livres de zuhd : clarté du licite et de l’illicite et questions douteuses entre eux, interdiction de tout enivrant, deux animaux morts et deux sangs permis, soie et or interdits aux hommes, interdits créés par l’allaitement, inviolabilité du musulman pour le musulman."
    seerah:
      title: "Dans la sira"
      desc: "Les récits des ouvrages de sira, de maghazi et de dala'il : sermon d’adieu sur l’inviolabilité des vies et des biens, interdiction du vin et des ânes domestiques à Khaybar, caractère sacré de La Mecque proclamé à la conquête, règles du butin — à mesure que de nouveaux textes sont intégrés."
    books:
      title: "Dans les autres livres"
      desc: "Les mentions dans chaque ouvrage dépouillé hors du Coran, du hadith et de la sira : biographies des Compagnons et des Successeurs et récits de leur scrupule dans la Hilya, Sifat al-Safwa et Hayat al-Sahaba ; livres de fiqh — al-Mughni, Mudawwana, Bidayat al-Mujtahid, Fiqh al-Sunna et Encyclopédie koweïtienne ; Ihya', Muwafaqat et commentaires ; ouvrages à venir, classés selon leur genre dès l’arrivée de leurs passages."
    curated:
      title: "Notices sur le licite et l’illicite"
      desc: "Les notices détaillées du musée : licite, illicite et douteux, présomption de permission, autorité pour déclarer le licite et l’illicite, bon et mauvais, aliments et boissons interdits, nécessité, scrupule, gains licites, récits des Compagnons et des Successeurs recherchant le licite."
  subjects_ui:
    title: "Explorer par sujet"
    note: "Choisissez le sujet de votre recherche. Chaque sujet s’ouvre sur les notices du musée et les versets du Coran, puis les hadiths, la sira et les autres livres. Le musée montre ce que disent les sources et où elles le disent ; il ne prononce aucun avis juridique. L’avis sur un cas personnel relève d’un savant, non du musée."
    region: "Douze sujets du licite et de l’illicite, chacun avec son nombre de notices et celles nommant le licite, l’illicite ou les deux"
