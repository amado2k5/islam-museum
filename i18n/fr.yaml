  title: "Explorateur de l’éthique et des relations humaines"
  lede: "Toutes les mentions d’éthique et de relations humaines dans les sources du musée : vertus du Coran, de la véracité, la probité, la justice et l’excellence à la bonté envers les parents et aux liens familiaux ; vices, du mensonge, de la trahison, de l’orgueil, de la médisance et de l’injustice ; hadiths sur l’accomplissement du noble caractère et sur le musulman dont les autres sont à l’abri de la langue et de la main ; relations, de la vente, du riba, de la dette et du gage au mariage, au divorce, aux serments, au témoignage, au jugement et aux balances — récits des Compagnons et des Successeurs, livres de sira et chaque livre dépouillé. Des notices sourcées qui s’enrichissent avec les textes."
  badge: "Exploration de l’éthique et des relations humaines"
  status: "Cette version contient {n} notices en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "Fonctionnement de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et sa prose trilingue. Éthique et relations sont repérées à la génération du site par un lexique assorti de garde-fous : vertus (véracité, probité, fidélité, patience, gratitude, humilité, excellence, pudeur, mansuétude, sincérité, repentir, générosité, bonté envers les parents, parenté, droit du voisin, bon conseil, abstention de nuire, maîtrise, miséricorde, justice, contentement), vices (mensonge, trahison, orgueil, ostentation, envie, avarice, médisance, calomnie, indécence, insultes, colère, injustice, désobéissance aux parents, hypocrisie, tromperie), relations (vente, commerce, riba, dette, prêt, gage, location, legs, héritage, mariage, dot, allaitement, divorce, séparation, délai d’attente, entretien, garde, serments, expiation, témoignage, preuve, jugement, balances, mesure, mesure faussée, réconciliation, dons, garantie, caution, mandat, association, qirad, mudaraba, muzara'a, musaqat, salam, istisna', transfert, prêt d’usage, dépôt, usurpation, objet trouvé, préemption, accaparement, contrainte, interdiction, contrat). Sont exclus l’allégeance bay'ah, raba au sens de croissance hors transaction, hukm au sens de sagesse, shahada comme profession de foi ou martyre, ajr comme simple récompense, qism comme portion et les rites des explorateurs du culte et des invocations. Les faux positifs vérifiés sont exclus par identifiant ; chaque livre dépouillé par la suite apporte automatiquement ses mentions dès l’arrivée des passages dans le graphe. Les notices sélectionnées entrent par l’étiquette akhlaq-browser. Chaque passage indique son axe (akhlaq/mu'amalat), son type (vertu/vice/relation/mention) et ses thèmes."
