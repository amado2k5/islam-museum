    faibles — hudud et hadd sans restriction, jald ambigu, infractions de fornication, vol, calomnie, vin, apostasie et brigandage, talion, kabira ambigu — ne comptent qu’auprès d’un indice fort ou par
    deux ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions dès que ses passages intègrent le graphe ; les notices thématiques
    les rejoignent par l’étiquette hudud-browser. Chaque passage porte le type hudud ou kabair selon ses indices.'
