  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les invocations sont repérées à la génération du site grâce à un lexique assorti de garde-fous appliqué aux passages : formules d’adresse à Dieu, dont celles avec rabb suivi d’un complément, verbes d’invocation ayant Dieu pour destinataire, isti'adha, istighfar et passages sur l’invocation elle-même. Sont écartés les appels à de fausses divinités, les emplois de da'wa et de yad'u au sens de prédication, ainsi que le simple tasbih ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses invocations dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent grâce à l’étiquette dua-browser. Chaque passage porte le type formula s’il contient une invocation, mention s’il en parle seulement."
