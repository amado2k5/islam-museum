  status: "Cette version contient {n} notices en {s} sections et {p} pages thématiques ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions sont repérées à la génération du site par un lexique assorti de garde-fous : sana au singulier ne compte jamais au sens de sunna ou pratique ; am uniquement dans les formules d’années nommées ou les associations temporelles ; qurun près des bovins désigne les cornes, non les générations ; safar le chiffre, Rajab le prénom et muharram le terme juridique ne comptent qu’auprès de leurs associations de mois. Les faux positifs vérifiés sont exclus par identifiant ; les passages déjà reliés aux sujets temporels par des relations mentions explicites entrent aussi. Chaque livre dépouillé par la suite apporte automatiquement ses mentions dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette qurun-browser."
