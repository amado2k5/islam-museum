  lede: "Chaque invocation mentionnée dans les sources du musée : les prières coraniques, depuis l’adresse d’Adam à son Seigneur jusqu’aux formules d’invocation du Prophète, les invocations des deux Sahih, du Muwatta et des Sunan, celles des Compagnons et des Successeurs, les récits de la sira et de chaque livre dépouillé — des notices sourcées qui s’enrichissent à mesure que de nouveaux textes sont intégrés."
