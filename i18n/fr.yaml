  sections_title: Les sections de l’explorateur
  mothers_title: Les mères consignées
  mothers_desc: 'Les mères du graphe du musée : chacune est reliée à son enfant par une relation child_of sourcée — mères des prophètes, des Compagnons, des Successeurs et des personnages des livres.'
