  method_note: "Les sources ne parlent pas d’extraterrestres au sens moderne ; elles parlent de créatures dispersées dans les cieux, de mondes multiples, de djinns et d’anges, de créations antérieures et de peuples disparus. Cet explorateur réunit précisément ces mentions et les rapproche des commentateurs qui les ont lues. Il ne tranche pas : lorsque les savants divergent ou qu’une chaîne de transmission est contestée, la notice le précise et cite chaque partie. Les versets coraniques viennent d’une table vérifiée ; les autres mentions sont repérées à la génération du site par un lexique assorti de garde-fous, de sorte qu’un livre dépouillé par la suite apparaît dès l’arrivée de son passage."
