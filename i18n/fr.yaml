      title: "Les notices rédigées"
      desc: "Les notices du musée sur le sujet lui-même : Juha, Nasreddin Hoca, Ash'ab et d'autres, les livres d'anecdotes, et les notions de plaisanterie, de rire et d'anecdote."
    juha:
      title: "Les anecdotes de Juha"
      desc: "Les anecdotes de Juha une à une d'après les Nawadir Juha al-Kubra : le titre de l'anecdote, son récit dans les mots du musée, son numéro de page et un extrait d'au plus quarante mots."
    quran:
      title: "Dans le Coran"
      desc: "Les versets du rire et du sourire : le rire de l'épouse d'Abraham, le sourire de Salomon aux paroles de la fourmi, « c'est Lui qui fait rire et pleurer », les visages riants et réjouis, le rire des moqueurs, et l'interdiction qu'un peuple se moque d'un autre."
    sunnah:
      title: "Dans la Sunna"
      desc: "Ce que les deux Sahih, le Muwatta et les Sunan rapportent de la plaisanterie, du rire et du sourire du Prophète, de l'enjouement des Compagnons et de l'avertissement à qui ment pour faire rire — chaque récit avec son numéro et sa source."
    seerah:
      title: "Dans la sîra"
      desc: "Ce que les livres de sîra et de shama'il rapportent de la plaisanterie, du rire et de l'enjouement ; cette section se remplit d'elle-même à mesure qu'arrivent de nouveaux textes."
    books:
      title: "Dans les autres livres"
      desc: "Anecdotes, traits d'esprit et récits des beaux esprits, des sots et des avares dans les livres d'adab, d'histoire et de biographie : Nihayat al-Arab, 'Uyun al-Akhbar, al-Mustatraf, al-Bayan wa-l-Tabyin, al-Hayawan et tout ce qui sera dépouillé ensuite."
