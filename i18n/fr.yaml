changelog:
  coming_1: 'Le tissu des professions en peinture : la classification actuelle des professions fournit des archives ; l''étape suivante consiste à établir des liens, reliant une personne à son art, et une
    question comme « tous les calligraphes du IXe siècle » devient accessible par le dessin.'
  coming_2: 'Requête avec l''ID Wikidata : Un index publié reliant les 16 232 identifiants Wikidata des données à leurs enregistrements, avec un titre de recherche pour chaque identifiant.'
  coming_3: 'Documentation officielle OpenAPI et exportations conforme aux normes de bibliothèque : OAI-PMH, MARC et liaison Dublincore.'
  coming_4: 'Les blogs non récoltés — l''encyclopédie turque TDV, le dictionnaire Nadoy en 57 volumes sur les femmes modernes, le dessin des narrateurs (hommes) — et les nouvelles éditions linguistiques
    : indonésien, turc et français.'
  coming_title: Et après
  current_label: Version actuelle
  history_line: L'historique complet, par obligation, se trouve dans le dépôt public (github.com/amado2k5/islam-museum) ; cette page en est le résumé destiné aux lecteurs.
  intro: Cette page affiche le fichier CANARY.md, un fichier de notes de publication stocké dans le dépôt public du musée. Chaque modification qui arrive avec son entrée dans le même engagement, classée
    par type ; et l'annulation d'un changement est enregistrée et jamais effacée. Les entrées sont conservées en anglais comme enregistrement technique.
  lede: Chaque changement dans le musée, enregistrer le moment où il s'est produit — ce qui a été ajouté, ce qui a changé, ce qui a été corrigé, ce qui a été retiré, et la version que vous examinez.
  title: Journal des mises à jour
cite:
  bibtex_label: BibTeX
  citation_label: Citation prête à être copiée
  citation_title: Martyre préféré
  contact_body: 'Questions sur la citation ou la réutilisation : discover@islam.museum.'
  dataset_body: 'Abdel Aal, Ahmed (2026). islam.museum — Open Digital Museum of Islam [Data Set]. Zenodo. Données sous licence CC0 1.0 : Aucune autorisation requise, et la citation est la manière dont elles
    sont attribuées.'
  dataset_title: ensemble de données
  desc_body: 'La description publiée de l''ensemble de données et de sa méthode de construction est l''article d''Ahmed Abdel Aal : « islam.museum : A Citable Open Knowledge Graph and Digital Museum of
    Islamic History — Resource Description, Method and Validation State » (2026), un brouillon préliminaire conservé sur Zenodo sous licence CC BY 4.0. Si vous vous fiez à la description ou à la méthodologie,
    citez également l''article — son numéro d''identification perpétuel (concept DOI), qui renvoie toujours à la dernière version.'
  desc_title: Feuille méta de données
  formats_title: Formats logiciels de gestion des références
  intro: Les données du musée sont un jeu de données de recherche citable. Ils sont stockés dans les archives Zenodo et sont connus avec un identifiant DOI permanent. Veuillez citer l'identifiant ci-dessous
    — l'identifiant conceptuel, qui renvoie toujours à la version archivée la plus récente — et non l'identifiant d'un snapshot quotidien unique, afin que toutes les citations soient consolidées dans un
    seul enregistrement.
  lede: Comment citez islam.museum et ses données dans votre entreprise — un identifiant DOI permanent unique pour les données, et les formats attendus par les logiciels de gestion de références.
  licence_body: 'Données : CC0 1.0. Textes : CC BY-SA 4.0. Code : MIT. Les éléments média individuels conservent leurs propres licences, affichées dans leurs journaux.'
  licence_title: Licence
  paper_body: Pour citer le musée sous forme de site web ou d'un seul article en son sein, citez le titre de la page lui-même ainsi que la date de lecture. La citation ci-dessus reste la référence correcte
    pour les données sur lesquelles elle est basée.
  paper_title: Citation du site ou de l'article
  ris_label: RIS
  title: Citez le musée
  version_body: 'L''archive grandit : Un nouveau plan est déposé à mesure que le musée grandit, et chaque plan possède un identifiant DOI spécifique à sa copie. Si votre travail dépend du cas exact que
    vous avez utilisé, citez également l''ID de la copie de ce cliché et notez votre date de vision. Pour les citations générales, l''identifiant de concept ci-dessus est suffisant.'
  version_title: Citez un seul tir unique
developers:
  agents_intro: 'Soumettez l''un de ces scripts à votre assistant de programmation — Claude, Devin, Copilot ou d''autres — avec le titre de cette page. Chaque texte est autonome : il nomme les points d''accès,
    la licence et le résultat souhaité. Et les scripts en anglais sont considérés comme des textes de travail.'
  agents_title: Commencez avec un assistant IA
  code_intro: Les trois styles dont vous avez le plus besoin pour les intégrations. Ils fonctionnent tous sur l'interface live telle qu'elle est écrite.
  code_title: Code typique
  col_endpoint: Point d'accès
  col_field: Le terrain
  col_meaning: Signification
  col_returns: Ne le rends pas.
  col_type: Type
  e_from: L'enregistrement à partir duquel commence la relation (identifiant).
  e_inverse: Cette arête est-elle l'interprétation inverse d'une relation stockée ?
  e_sources: Les sources sur lesquelles repose cette relation — chaque relation est documentée.
  e_to: L'enregistrement auquel vous faites référence (ID).
  e_type: Type de relation — l'un des 55 types (voir ci-dessous).
  endpoints_title: Points d'accès
  ep0: 'Porte d''entrée : les fichiers et dossiers contenus dans cette interface, et où ils sont décrits au format OpenAPI.'
  ep1: 'Index d''interface : version, vingt-deux types d''enregistrements, et licences dans un format lisible par machine.'
  ep2: 'Numéros en direct : combien d''enregistrements existent, et combien dans chaque catégorie.'
  ep3: Tous les enregistrements d'une seule classe dans un seul tableau JSON — comme les 10 884 personnes.
  ep4: 'Un enregistrement complet : noms et résumés en sept langues, ses données structurées, ses sources et les relations pré-calculées.'
  ep5: Dessin d'enregistrements et tous leurs propres threads, un objet JSON par ligne ({nodeLines} line).
  ep6: Chaque relation entre enregistrements, un dans chaque ligne ({edgeLines}) — et chaque relation contient les sources sur lesquelles elle est basée.
  ep7: 'Modules intégrables dans vos pages : fiche d''information et piste hebdomadaire, en arabe, anglais ou ourdou.'
  ep8: 'Les données sont archivées sur Zenodo avec un identifiant DOI permanent pour citation : 10.5281/zenodo.23692511.'
  ex1_title: Quelle est la taille du décor ?
  ex2_title: Un record complet
  ex3_title: 'Fichier de dessin : nœud et quelques arêtes'
  ex4_title: Walking in Painting (Python) — À qui Muhammad Ali Jawhar était-il apparenté ?
  ex_note: Les réponses sont résumées par un ... où vous restez en contact.
  examples_intro: Tout ce qui suit a été attribué par l'interface Live en novembre 2026, et nous l'avons raccourcie uniquement pour la longueur.
  examples_title: Exemples en direct avec des résultats réels
  f_class: 'L''une des vingt-quatre catégories : personne, lieu, bâtiment, effet, événement, texte, source, invention, récompense...'
  f_dates: Champs de date, lorsque applicables — naissance, décès ou date unique — avec les valeurs EDTF.
  f_id: 'ID d''enregistrement permanent : Élément/Clé.'
  f_label: Enregistrer le nom en arabe, anglais, ourdou, français, espagnol, turc et indonésien, selon les disponibilités.
  f_regions: Les régions géographiques auxquelles appartient le document.
  f_status: publié (publié), ou brouillon (introduction et toujours en chant). Et les ébauches sont sans statut.
  f_summary: Un résumé bref et source en jusqu'à sept langues.
  f_wikidata: Identifiant wikidata (QID) pour l'enregistrement où il est trouvé — utilisez-le pour faire correspondre les enregistrements à votre index.
  f_wings: Les neuf ailes du musée auxquelles appartient le registre (et peuvent appartenir à plusieurs ailes).
  honesty_body: 'Honnêtement, pour rendre votre plan direct à la vérité : il n''y a pas de document OpenAPI/Swager, pas de point SPARQL, ni d''exportation OAI-PMH ou MARC. La taxonomie professionnelle fournit
    des enregistrements mais n''a pas encore été intégrée dans les contours du dessin, et les journaux portent des identifiants Wikidata sans encore les rechercher. Les chiffres ci-dessus sont statiques
    et exportés (v1 dans chaque titre), et l''index méta annonce la sortie et les licences. Documentation de l''interface officielle et exportations standard de bibliothèque sur la feuille de route.'
  honesty_title: Ce qui n'existe pas encore
  intro_1: 'Tout ce que le musée publie aux lecteurs est également publié aux machines. Chaque document — une personne, un lieu, un bâtiment, un monument ou un événement — possède une page web permanente
    jumelée en format JSON avec une adresse fixe, et l''ensemble de la collection présente un seul dessin connecté : des enregistrements (nœuds) et des relations documentées avec les sources situées entre
    eux (arêtes).'
  intro_2: Pas de clé d'accès, pas de compte, pas d'identification. Les mêmes données sous licence CC0 1.0 — domaine public, vous pouvez les télécharger, sauvegarder et développer dessus. Quant aux articles
    écrits, ils sont sous la licence CC BY-SA 4.0 comme sur Wikipédia. Si votre système peut ouvrir une adresse web, il peut lire le musée.
  inventions_body: La catégorie invention enregistre les inventions et découvertes par leur domaine, type, époque, première documentation, leurs créateurs avec leurs rôles documentés, leurs revendications
    d'attribution et leurs fondements, les précédant et basées sur celles-ci, leur image et leur dessin. Apportez tous les enregistrements de /api/v1/inventions.json, les chaînes de /api/v1/inventions/chains.json,
    ou un seul enregistrement de /api/v1/invention/{slug}.json. Et le navigateur de visiteurs dans /ar/inventions/.
  inventions_title: 'Catégorie digne du nom : inventions'
  jobs_body: La catégorie de poste est la classification des métiers et professions du musée — 19 documents aujourd'hui, chacun portant son domaine et son type, s'il s'agissait d'un métier (HIRFA), de son
    époque, du premier témoignage sur ses sources, ses localisations, son organisation et sa formation. Apportez la classification complète de /api/v1/job/index.json, ou un seul artisanat de /api/v1/job/{slug}.json.
    Les professions n'ont pas encore tissé les contours du dessin — les gens les portent dans leurs dossiers — ce tissu figure sur la feuille de route et sera enregistré dans le journal de mise à jour lorsqu'il
    apparaîtra.
  jobs_title: 'Catégorie digne du nom : Professions (emploi)'
  lede: 'Ibn Ali Al-Muthafa : Un dessin open source, documenté en source source de l''histoire de l''islam — liens, modules intégrés et données lisibles par vos systèmes. Pas de clé, pas de dessins, et
    pas d''autorisation.'
  level1_body: 'Ajoutez le musée à votre catalogue et à votre liste de ressources électroniques, et liez directement tout document : titres de pages permanents en arabe, anglais, ourdou, français, espagnol,
    turc et indonésien. L''équipe des collections Asie et Afrique de la British Library est en contact avec le musée à ce sujet. Sans aucun travail de développement.'
  level1_title: Niveau Un — Attachez
  level2_body: 'Insérez une pièce vivante du musée dans vos pages avec un seul extrait HTML : une fiche de connaissances et l''itinéraire de la Semaine Guidée, dans l''une des trois langues. Le contenu
    parle pour nous ; votre page ne le cadre qu''à vous.'
  level2_title: Niveau Deux — Inclus
  level3_body: Téléchargez le dessin lui-même — chaque enregistrement et chaque relation documentée dans des fichiers JSON simples — et construisez vos recherches, galeries, ressources scolaires et outils
    de recherche par-dessus. La licence CC0 rend la copie entièrement à votre disposition ; le code source live continue de grandir et de relire, et vous pouvez resynchroniser quand vous le souhaitez.
  level3_title: Niveau Trois — Construire sur les données
  licence_body: 'Données : CC0 1.0 — sans autorisation ; une ligne de référence est préférable telle que « Données : islam.museum (CC0). » Articles : CC BY-SA 4.0 — Réutilisation avec attribution. Code
    : MIT. Pour référence, l''identifiant DOI des données est 10.5281/zenodo.23692511. Le musée est une initiative personnelle, non commerciale, mise à disposition gratuitement aux bibliothèques, écoles
    et lecteurs partout dans le monde ; pour questions, corrections et collaborations : discover@islam.museum.'
  licence_title: Licence, citation et communication
  live_stats: 'La collection live dans cette version : {records} enregistrement · {edges} relation documentée · {classes} un type d''enregistrements · {stubs} Un stub mentionné par d''autres enregistrements
    qui n''a pas encore été écrit.'
  quickstart_intro: Choisissez la profondeur qui convient à votre organisation ; chaque niveau inclut ce qui est au-dessus.
  quickstart_title: 'Trois entrées : D''une œuvre d''une époque à une plateforme'
  roadmap_1: Parmi les archives de cette version, qui sont {enregistrements}, sont {publiées} ; le reste et leur numéro {brouillons} sont encore en cours de chantage, ainsi que {ébauches} un ébauche attendant
    sa construction complète. Le téléchargement d'aujourd'hui ressemble à un atelier, pas à des étagères achevées.
  roadmap_2: 'De plus, la carte des lacunes du musée nomme les inscriptions non récoltées : l''Encyclopédie turque islamique TDV (~16 800 entrées, jusqu''à présent utilisées uniquement pour des enregistrements
    uniques), le dictionnaire Nadavi en 57 volumes sur les femmes modernes (~9 000–10 000 mis à jour, dont presque aucun ne se trouve encore au musée), les principaux dictionnaires des narrateurs derrière
    le dessin des narrateurs des hadiths, les collections ultérieures de l''Encyclopédie islamique, les inventaires de manuscrits et de bibliothèques qu''ils ont conservés, ainsi que des enquêtes en Asie
    du Sud-Est, en Afrique, en Chine et dans les Amériques qui ne commencèrent à peine. Trois dictionnaires nommés seuls contiennent environ 36 000 éléments supplémentaires dépassant aujourd''hui les archives
    du musée.'
  roadmap_3: 'Prenez les données — c''est pour ça qu''elles ont été créées. Mais fiez-vous à la source vivante quand vous le pouvez : elle corrige les erreurs rapportées par les scientifiques, ajoute des
    milliers de documents chaque mois, et conserve une adresse standard unique pour tout. La copie est une capture d''écran ; le musée est le jardin.'
  roadmap_title: Combien reste-t-il — et pourquoi la source vivante importe-t-elle ?
  schema_edge_title: Edge — Relation célibataire
  schema_intro: 'Deux formes couvrent presque tout : le nœud (enregistrement, dans les fichiers de dessin et les index d''éléments) et l''arête (relation). La réponse à registre unique ajoute ses données
    structurées complètes et son voisin précalculé.'
  schema_node_title: Nœud — Enregistrement unique
  schema_record_body: 'La réponse à journal unique porte les clés suivantes : id, classe, slug, étiquette, résumé, ébauche, ailes, régions, périodes, tags, alias, thèmes, étendue, affichage, données, prose,
    diplôme, contemporains, mise à jour, connexions, liés, licence. La clé de données contient le contenu structuré complet de l''enregistrement (dates, lieux, professions, lieu de création, etc.) ; connexions
    et proximité pré-calculée associée dans le dessin ; et degré, le nombre de ses relations.'
  schema_record_title: Disque unique — version intégrale
  schema_title: Schéma
  schema_types_body: 'Types de relations : 55 types. Les plus fréquemment mentionnés sont : part_of (9 845), mentions (9 504), participated_in (5 317), basis_for (3 749), occurred_at (2 120), environ (1
    825), died_in (750), member_of (726), born_in (608), child_of (570). Et les dates au format EDTF (Extended Date and Time Format, ISO 8601-2 — Library and Archives Standard for Historical Dates), avec
    des années hijriennes parallèlement aux calendriers grégorien.'
  title: Pour les développeurs
  u1_body: Le musée n'est pas un site où une interface de programmation est collée. Sa première image est un unique dessin de connaissance — journaux de données structurées, articles textuels — stocké dans
    un dépôt git public. Le site, cette interface, la recherche, la chronologie, les unités embarquées et l'aile des enfants sont tous des rendus de ce dessin unique. Corrigez un événement une fois, et
    il est corrigé sur chaque surface.
  u1_title: Un dessin, chaque surface
  u2_body: 'Dans la plupart des ensembles de données, les preuves résident dans les marges. Ici, le modèle de données lui-même réside : les relations transportent les sources sur lesquelles elles s''appuient,
    les résumés portent leurs citations, et les points contestés conservent leurs lectures étiquetées plutôt que plates. Vous pouvez vous renseigner non seulement sur ce que dit le musée, mais aussi sur
    ce sur quoi il est basé.'
  u2_title: Sources au sein de la structure elle-même
  u3_body: Le dessin est écrit d'abord en arabe — les titres et résumés en arabe sont l'original, pas la traduction — avec deux éditions complètes en anglais et en ourdou pour tout, les archives et une
    interface. La plupart des collections dans ce domaine sont en anglais avec traductions, ou uniquement en arabe.
  u3_title: L'arabe d'abord, et trois éditions dans tout
  u4_body: Vingt-deux catégories — personnes, lieux, bâtiments, antiquités, livres, textes coraniques et hadithiques, concepts, événements et voyages — partagent un seul dessin, permettant à l'interrogateur
    de voyager d'un monde à un livre, à ses manuscrits, à une ville, puis à un siècle. Les encyclopédies divisent tout cela en disciplines et volumes ; le dessin transmet tout.
  u4_title: Quatorze siècles dans un seul réseau connecté
  u5_body: Les dates sont des valeurs structurées dans le format EDTF, la norme de la bibliothèque pour les dates historiques, avec des années hijriennes parallèlement au grégorien — vous calculez donc
    les chronologies, les siècles et les événements à partir des données, pas page par page.
  u5_title: Données temporelles, avec deux calendriers
  u6_body: 'Données CC0, textos CC BY-SA et code MIT : sans clé, intraçable, et sans serveur répondant à chaque visiteur — le site est composé de fichiers statiques, et les données complètes sont deux téléchargements.
    N''importe quelle institution peut reproduire l''ensemble du musée, le vérifier de manière indépendante et s''appuyer dessus. Rien n''est bloqué pour vous maintenir dépendant de ce site.'
  u6_title: Ouverture dans chaque couche — et pleine reproductibilité
  unique_closing: 'D''autres sont plus vastes en une dimension : une encyclopédie plus vaste, ou un code textuel plus approfondi, ou un dessin plus large sans textes et sans édition. Quant à la collecte
    — un dessin documenté avec des sources, arabes originaires, licence ouverte, de tout le passé islamique, une publication muséale que chacun peut lire, interroger, inclure et prendre — nous connaissons
    son existence ailleurs.'
  unique_intro: 'De nombreuses collections préservent des éléments du passé islamique. La revendication du musée est plus étroite que cela, et nous le considérons comme inégalé dans sa rassemblation — aucune
    réunion similaire n''est connue :'
  unique_title: Qu'est-ce qui rend cela différent ?
disclaimer:
  accuracy_1: Chaque entrée au musée est liée aux sources listées sur sa page, et la page de couverture montre explicitement les lacunes du document, les erreurs étant corrigées lorsqu'elles sont découvertes
    ou signalées. Nous vérifions les faits avant publication et les mentionnons sur la page lorsqu'une affirmation repose sur une seule source ou est contestée.
  accuracy_2: Cependant, rien ne garantit que tout ce qui figure sur le site soit complet, mis à jour ou exempt d'erreurs. Dans l'histoire, il existe des questions véritablement controversées — les dates,
    généalogies et narrations varient selon les sources et les écoles — et la conversion des dates entre les calendriers hijrien et grégorien suit des méthodes standard et est approximative à l'époque ancienne.
    Chaque page est considérée comme un point de départ documenté, et non comme le mot final.
  accuracy_title: Exactitude et ses limites
  advice_body: Ce site ne contient ni avis juridique ni décision juridique, et ne fournit aucun conseil juridique, financier, médical ou professionnel d'aucune nature. Les textes et pratiques religieux
    sont présentés à partir de leurs sources publiées selon la méthodologie éditoriale du musée (voir « Comment nous décidons ce que nous exposons ») ; les questions de croyance et de pratique sont transmises
    à des chercheurs qualifiés, et les questions professionnelles à des praticiens qualifiés.
  advice_title: Ce ne sont ni fatwas ni conseils professionnels.
  affiliation_body: Le site et son propriétaire ne sont affiliés à aucune organisation, organisation, entreprise, installation ou organisation de quelque nature que ce soit, et ils ne sont ni sponsorisés,
    exploités, détenus ou soumis à sa juridiction ou à son contrôle.
  affiliation_title: Personne n'appartient à personne
  archive_body: 'Le musée est une archive et une bibliothèque du patrimoine humain et de ce que l''être humain a créé : pièces, livres, citations et contenus créés et rédigés par d''autres — des personnes
    qui consignent leurs œuvres, vies, réalisations et convictions — y compris des documents générés par l''intelligence artificielle et étiquetés partout où le musée les connaît. Le musée collecte, cite
    et expose son contenu tel qu''il est, de leur point de vue ; il ne se présente pas comme l''auteur de leurs œuvres, ni ne peut être tenu responsable du contenu qu''il affiche. Leurs opinions, actions,
    conseils et histoires ne représentent qu''eux-mêmes — pas le site ni son propriétaire. Le musée ne cautionne ni ne soutient personne ni quoi que ce soit qu''il exhibe, ne cautionne, ne déclare, prêche
    ou oriente quiconque vers une décision ou orientation religieuse, politique, financière, bouleversante ou autre, de quelque nature que ce soit. Le musée présente le contenu tel qu''il est cité dans
    ses sources et ne garantit pas l''authenticité du matériel original ; il ne doit à personne des preuves au-delà des sources qu''il fournit. Le musée ne revendique aucun droit d''auteur, brevet ou propriété
    de quelque matériel ou pièce qu''il expose ; il appartient à ses auteurs, créateurs et détenteurs de droits.'
  archive_title: Archives et bibliothèque, pas d'auteur
  changes_body: Cette expulsion peut survenir au fur et à mesure que le musée change. Les mises à jour sur cette page sont publiées à une nouvelle date, et l'enregistrement complet de la page est stocké
    dans le dépôt public sur GitHub, où chacun peut consulter ce qui a changé et quand. Les modifications peuvent être effectuées à tout moment, sans approbation préalable, sans notification préalable,
    sans notification à quiconque.
  changes_title: Modifications à cette évacuation
  children_1: 'Le musée est destiné à tous les âges, et l''aile des tout-petits est conçue pour les enfants : histoires, jeux et tâches, sans comptes, collecte de données, conversation ou communication
    avec des inconnus, comme l''explique la page de confidentialité. Les enfants doivent explorer le musée accompagnés d''un parent, d''un tuteur ou d''un enseignant, qui reste responsable de superviser
    leur utilisation et de juger ce qui leur convient.'
  children_2: 'Pour les parents et les enseignants : le musée — et l''aile pour enfants qui s''y trouve — est un outil d''apprentissage, non un programme ni un substitut aux supports scolaires de l''enfant.
    Ce qui est trouvé ici doit être vérifié à la lumière des sources citées — accompagné d''un adulte — avant de l''utiliser pour ses devoirs ou pour ses études, et les enfants ne doivent pas considérer
    une page comme une réponse prête à l''emploi à un examen sans cette vérification.'
  children_title: Enfants et jeunes visiteurs
  contact_body: Pour les demandes de presse et des médias, écrivez à press@islam.museum. Pour les réclamations liées au droit d'auteur, écrivez à copyright@islam.museum — les titulaires de droits peuvent
    également utiliser les outils de reportage sur le site à tout moment. Pour toute autre question, écrivez à concerns@islam.museum.
  contact_cta: Contactez-nous par courrier
  contact_title: Presse, droit d'auteur et autres préoccupations
  features_body: 'Les chronologies, les convertisseurs de dates, la cartographie de liens, la recherche, les voyages, les visites en 3D et d''autres fonctionnalités interactives facilitent l''exploration.
    Leurs résultats sont calculés à partir des données de base du musée et héritent de leurs limites : la date convertie, l''ordre de cartographie des liens ou la sélection « En ce jour » est une présentation
    des données, et non un fait nouveau ou vérifié. Les fonctionnalités peuvent changer, changer ou être supprimées à tout moment sans préavis.'
  features_title: Fonctionnalités et outils interactifs
  freewill_body: 'Vous pouvez publier, objecter, contourner, lire ou ne pas utiliser de contenu ici. Vous n''êtes pas obligé — ni recommandé — de suivre, croire ou construire quoi que ce soit sur ce site
    ; vous décidez librement ce que vous voulez et ce que vous trouvez utile, approprié et raisonnable pour votre vie. Vous avez toute la liberté — et même l''encouragez — de vérifier tout contenu et son
    authenticité, en partie ou en totalité, et de le consulter et en discuter avec qui vous souhaitez, sans aucune obligation ni responsabilité envers le site ou son propriétaire. Tout ce que vous faites
    vous relève uniquement : conséquences, pour vous-même et pour les autres, votre responsabilité et votre obligation légale, et cela n''a rien à voir avec le site ou son propriétaire. Ce site ne fournit
    aucun conseil, service ou conseil sur quelque sujet que ce soit, et rien ici ne doit être considéré comme un service, un conseil, ou un contenu juridique, médical, religieux ou officiel d''aucune manière.
    En utilisant ce site, vous acceptez ces conditions ; si vous ne l''utilisez pas, ne l''utilisez pas légalement, sans tenter de le désactiver ou de le présenter autrement. Vous n''êtes pas du tout obligé
    de visiter ce site : si vous êtes ici, c''est de votre plein gré. Le musée n''offre aucune incitation, argent ou profit à quiconque à visiter, voir, mettre en œuvre, faire la promotion, parler ou faire
    la promotion de ce site.'
  freewill_title: Votre libre arbitre, et votre responsabilité
  gathering_1: 'Le contenu du musée est collecté et construit à partir de sources publiques : encyclopédies (y compris Wikipédia), Wikidata, catalogues de bibliothèques et musées ainsi que leurs collections
    ouvertes, livres et études publiées, tous enregistrés dans les archives de ressources du musée et mentionnés sur la page sur laquelle ils sont basés.'
  gathering_2: 'Les outils d''IA assistent à la collecte, à la rédaction, à la construction et à la revue croisée pendant la construction du site ; aucune IA ne fonctionne lorsque vous visitez le site.
    Le dessin assisté par l''IA peut commettre des erreurs, et la collection IA peut mal interpréter une source — ce qui constitue une raison supplémentaire d''afficher les sources sur chaque page et d''accueillir
    les corrections. La sélection, l''orientation et l''organisation sont des décisions éditoriales, et la couverture varie intentionnellement et honnêtement : le musée révèle ses lacunes au lieu de les
    combler d''invention.'
  gathering_title: Comment le contenu s'agrège
  ip_body: 'Les données du musée sont publiées sous licence CC0, ses textes sous licence CC BY-SA 4.0, et son code sous licence MIT, comme indiqué sur la page des licences ; la réutilisation sous ces conditions
    est la bienvenue. Les images et médias provenant d''institutions partenaires et d''autres titulaires de droits restent soumis à leurs conditions et attribués à la page. Le texte coranique, les traductions
    et autres œuvres adaptées portent leurs sources et conditions telles qu''indiquées dans les références. Rien sur cette page ou sur ce site ne confère de droits sur des documents tiers. Le nom du musée
    et le logo du médaillon ne sont pas couverts par ces licences : ne les utilisez pas pour laisser entendre que le musée vous soutient ou soutient votre projet.'
  ip_title: Propriété intellectuelle et réutilisation
  lede: Qu'est-ce que ce musée, comment son contenu est collecté et vérifié, ce que vous pouvez en retirer et ce qui ne l'est pas, et les conditions dans lesquelles il est présenté — dans un langage clair.
  liability_body: Le site et son contenu sont fournis « tels quels » et « selon la disponibilité », sans aucune garantie, expresse ou implicite, y compris l'exactitude, l'exhaustivité, l'adéquation à un
    usage particulier ou une disponibilité ininterrompue. Dans la mesure maximale permise par la loi applicable, l'exploitant n'assume aucune responsabilité pour toute perte ou dommage résultant de l'utilisation
    ou de la confiance au site web. Rien dans cette clause de non-responsabilité ne limite la responsabilité qui ne peut être légalement limitée. Le musée est exploité depuis l'Ontario, Canada, et cette
    clause de non-responsabilité est assujettie aux lois de l'Ontario ainsi qu'aux lois fédérales canadiennes applicables. Tout ce que vous téléchargez depuis le site est à vos risques et périls.
  liability_title: Aucune garantie ; responsabilité
  links_body: Le musée se réfère à des sources et références externes pour une lecture complémentaire. Ces sites ne sont pas sous le contrôle du musée, et leur inclusion n'implique pas l'approbation de
    leur contenu, leurs termes et politiques s'appliquent lorsqu'ils sont respectés.
  links_title: Liens vers d'autres sites web
  more_body: Si vous trouvez une erreur ou quoi que ce soit sur le site qui vous préoccupe, le moyen le plus rapide est le formulaire de correction ; et pour tout autre sujet, envoyez-nous un e-mail. Les
    corrections concernant les personnes vivantes passent en premier.
  more_title: Corrections et questions
  personal_1: « Musée de l'Islam » (islam.museum) est un projet personnel créé par un individu et maintenu à titre personnel, à ses propres moyens, et en dehors de toute capacité. Il n'est géré par aucun
    employeur, entreprise, institution, gouvernement ou autorité religieuse, ni approuvé ni affilié à celui-ci ; les institutions et personnes mentionnées sur le site sont listées comme sujets ou sources,
    et non comme sponsors. Le projet a l'intention de créer une organisation à but non lucratif en Ontario, au Canada ; tant que cela n'est pas réalisé, il reste un projet personnel, et cette page sera
    mise à jour au fur et à mesure.
  personal_2: Toutes les opinions et points de vue exprimés sur ce site sont uniquement les miens et ne reflètent pas les points de vue ou opinions de mon employeur.
  personal_title: Projet personnel
  purpose_body: 'Le musée offre éducation, culture et intérêt public : il expose l''histoire et le patrimoine de l''islam issus de sources publiées en arabe, anglais, ourdou, français, espagnol, turc et
    indonésien. Ce n''est ni une école, ni une université, ni un programme accrédité, ni délivre des certificats ou des qualifications.'
  purpose_title: Objectif éducatif
  report_cta: Signaler une erreur
  stance_body: Le musée et son propriétaire s'opposent fermement à la haine et aux discours haineux, ainsi qu'à l'atteinte à qui que ce soit ou à la cause de tort ou de préjudice sous quelque forme que
    ce soit. Nous nous dressons contre l'islamophobie, contre l'antisémitisme, contre le racisme, contre le génocide et le nettoyage ethnique, et contre tout ce que les Nations Unies classifient comme haine
    ou racisme. Nous soutenons la diversité, les divergences d'opinion et promouvons la paix. Le musée ne soutient aucune opinion contre autrui, ni aucun récit ou copie de l'histoire contre autrui.
  stance_title: Contre la haine, avec diversité et paix
  support_body: Le musée est gratuit pour tous. La page de support propose des moyens volontaires de contribuer à ses coûts d'exploitation — sponsors Patreon, PayPal, LaunchGood et GitHub — au nom de l'opérateur
    personnel jusqu'à la création d'une organisation à but non lucratif. Le soutien est optionnel, n'achète pas d'accès, de biens ou de services, et ne donne aucun contrôle sur le contenu du musée, comme
    indiqué sur la page de support. Le musée n'est pas une association caritative enregistrée et ne délivre pas de reçus de dons caritatifs. Ces plateformes traitent les dons selon leurs propres conditions
    et politiques de confidentialité.
  support_title: Soutien et dons
  title: Avertissement
  updated: 'Dernière mise à jour : 30 octobre 2026'
  verify_body: Ne vous fiez pas uniquement au contenu du musée pour une réponse à un examen ou à un devoir, pour un entretien d'embauche ou un entretien académique ou médiatique, pour une publication, ou
    pour toute décision personnelle, professionnelle, financière, juridique ou religieuse. Avant de vous fier à quoi que ce soit ici, vérifiez cela à la lumière des sources citées sur la page et d'autres
    références fiables, et consultez des enseignants, chercheurs et spécialistes qualifiés si nécessaire.
  verify_title: Vérifiez avant de vous y fier
