  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les mentions de miracles sont repérées à la génération du site par un lexique assorti de
    garde-fous : mu''jiz ne compte jamais dans le Coran au sens de mettre en échec ; a''jaz nakhl désigne les souches de palmiers, non l’inimitabilité ; les formes ambiguës ne comptent qu’auprès de leurs
