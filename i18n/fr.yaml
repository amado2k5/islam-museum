      desc: 'Éthique et relations dans le Coran : justice et excellence, verset du birr, respect des contrats, juste mesure et juste poids, riba, dette et gage, mariage, divorce, délai d’attente et allaitement,
        serments et expiation, témoignage et jugement, al-Mutaffifin, bonté envers les parents, médisance, moquerie, hypocrisie et orgueil, et chaque verset nommant une vertu, un vice ou une relation.'
    sunnah:
      title: Dans la sunna
      desc: 'Éthique et relations du Prophète, des Compagnons et des Successeurs dans les deux Sahihs, le Muwatta et les Sunan : noble caractère, sécurité des autres face à la langue et à la main du musulman,
        trois signes de l’hypocrite, bonté envers les parents, parenté, voisinage et conseil sincère, livres des ventes, des bonnes manières, des gages, des legs, des témoignages et des jugements, récits
        citant ou enseignant un trait ou une relation.'
    seerah:
      title: Dans la sira
      desc: L’éthique et les relations dans les livres de sira et d’histoire — du commerce mecquois au marché de Médine, ventes et pactes du Prophète. La section s’enrichit avec les nouveaux textes de sira.
    books:
      title: Dans les autres livres
      desc: Éthique et relations dans chaque œuvre dépouillée hors du Coran, du hadith et de la sira — adab, droit, raqa'iq, histoire, poésie et ouvrages à venir — classées par genre dès l’arrivée des passages.
    curated:
      title: Notices sur l’éthique et les relations
      desc: 'Les notices du musée sur les vertus, vices et contrats : caractère, manières, véracité, probité, patience, gratitude, humilité, sincérité, bonté envers les parents ; mensonge, trahison, orgueil,
        médisance, avarice, envie, injustice, désobéissance ; contrat, vente, riba, dette, gage, location, legs, héritage, mariage, divorce, serments, témoignage, jugement, balances, dons, garantie, mandat,
        association et autres relations.'
ansab:
  title: Explorateur des généalogies, peuples, subdivisions tribales et de l’arbre des prophètes
  lede: 'Toutes les mentions des généalogies, peuples, subdivisions tribales (butun) et de l’arbre des prophètes et messagers dans les sources du musée : ascendance du Prophète en trois parties — reconnue
    jusqu’à Adnan, discutée jusqu’à Abraham, puis au-delà — tribus arabes adnanites et qahtanites, peuples (Arabes, Ajam, Rum, Abyssins, Coptes, Fils d’Israël), butun, de Hashim, al-Muttalib, Abd Shams,
    Makhzum et Zuhra aux clans d’Aws, Khazraj, Hawazin et Qays — dans le Coran, la sunna, la sira, les récits des Compagnons et des Successeurs, les livres dépouillés et ceux à venir.'
  badge: Exploration des généalogies, peuples et butun
  status: Cette version contient {n} notices et {f} passages en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par une personne.
  method_title: Fonctionnement de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée avec ses sources et sa prose trilingue. Les mentions sont repérées à la génération du site par un lexique assorti de garde-fous sur les matns
    : noms des maillons de l’ascendance prophétique (d’Abdullah ibn Abd al-Muttalib à Adnan, puis maillons discutés vers Ismaël et Abraham), tribus et clans (Quraysh et ses clans, Aws, Khazraj, Tamim, Hawazin,
    Thaqif, Ghatafan, Quda''a, Kinda, Bakr, Taghlib et autres), peuples (Arabes, Ajam, Perses, Rum, Abyssins, Coptes, Turcs, Berbères, Kurdes, Mongols, Fils d’Israël), clans (butun de Quraysh, Aws, Khazraj,
    Hawazin et Qays), termes de classification (nasab, tribu, clan, batn, butun, fakhidh, arbre des prophètes). Sont exclus ''aad comme verbe signifiant revenir, Tamim au sens de complet et matn au sens
    de dos ; les faux positifs documentés sont écartés par identifiant. Chaque livre dépouillé par la suite apporte ses mentions dès l’arrivée de ses passages ; les notices sélectionnées entrent par l’étiquette
    ansab-browser. Chaque passage indique son corpus (Coran / sunna / sira / livres) et ses thèmes.'
  api: L’ensemble est disponible à l’adresse
  tree_title: L’arbre des prophètes et messagers — l’ascendance du Prophète
  tree_note: 'L’ascendance du Prophète selon la division des savants de la sira et de la généalogie : partie reconnue jusqu’à Adnan ; partie discutée, d’Adnan à Ismaël fils d’Abraham selon Ibn Ishaq, al-Tabari
    et Ibn Sa''d, entre suspension du jugement et affirmation ; partie au-delà d’Abraham non établie à leurs yeux. La chaîne entière est montrée comme demandé ; les maillons discutés ont un contour pointillé
    et ne sont pas présentés comme certains.'
  tree_legend: Les contours pointillés signalent la partie discutée (entre Adnan et Ismaël selon la transmission d’Ibn Ishaq et d’al-Tabari) ; les contours pleins signalent les maillons reconnus par les
    savants de la sira.
