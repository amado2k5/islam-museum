umam:
  also_under: "Également dans :"
  title: "Explorateur des nations, religions, confessions et peuples non musulmans"
  lede: "Les nations, religions, confessions et peuples non musulmans nommés dans le Coran, le hadith, les récits et livres des Compagnons et des Successeurs : nations disparues, des Aad et Thamud au peuple de Tubba', Gens du Livre, mages et sabéens, polythéistes d’Arabie, rois, figures de la terre et peuples lointains — chaque verset, récit et narration qui les nomme, avec sa source."
  badge: "Exploration des nations et peuples"
  status: "Cette version contient {n} notices en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "Fonctionnement de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, sourcée et trilingue, sans table annexe. Les notices sélectionnées portent l’étiquette umam-browser et les étiquettes um-<section> ; toute œuvre, tout passage ou toute question avec une relation mentions vers un membre entre dans les mentions des sources et les sections de la cible. Un lexique assorti de garde-fous ne retient que les noms sans ambiguïté : un livre dépouillé par la suite apparaît dès l’arrivée de ses relations. Le texte coranique n’est jamais parcouru lexicalement : les versets entrent seulement par des relations mentions vérifiées."
  api: "Le jeu de données complet est à l’adresse"
  sections_title: "Sections de l’explorateur"
  filter_label: "Filtrer les notices"
  filter_none: "Aucune notice correspondante."
  empty: "Cette version ne contient pas encore de notices."
  mentioned_title: "Les nations les plus mentionnées dans les sources"
  mentioned_in: "Mentionné dans :"
  timeline_title: "Sur la chronologie"
  timeline_caption: "Notices datées : {n} · sans date : {u}"
  sections:
    umam: { title: "Les nations racontées", desc: "Les nations racontées par le Coran et détruites par Dieu : Aad, Thamud et Saba, peuples de Noé, de Loth et de Shu'ayb, Gens d’al-Rass, du Fossé et de la Cité, peuple de Tubba' et peuple de Pharaon — chacune avec ses versets et récits." }
    adyan: { title: "Les religions", desc: "Les confessions nommées par le Coran et le hadith : juifs, chrétiens, mages et sabéens — religions ayant connu avec l’Islam pactes, guerres et dhimma." }
    tawaif: { title: "Confessions et tribus", desc: "Communautés au sein des religions et tribus arabes de foi autre que l’Islam : Banu Qaynuqa', al-Nadir et Qurayza, juifs de Khaybar, chrétiens de Najran, Ghassan et Lakhm — selon les livres." }
    shuub: { title: "Peuples et nations", desc: "Peuples proches et lointains consignés par les sources : Romains, Perses, Abyssins, Coptes, Turcs, Inde, Chine, Berbères, Zanj, Slaves, Rus et Nabatéens — gens des royaumes et provinces." }
    mushrikun: { title: "Les polythéistes d’Arabie", desc: "Les adorateurs d’idoles d’Arabie avant l’Islam : habitants de La Mecque, Quraysh et ceux de leur religion, idoles, rites et histoire jusqu’à la conquête — une section propre, car ils n’étaient ni Gens du Livre ni d’une autre confession." }
    ayan: { title: "Figures nommées", desc: "Les personnes de ces nations nommées par les sources : Héraclius et Khosro, le Négus, al-Muqawqis, al-Mundhir ibn Sawa, rabbins des juifs de Médine, notables polythéistes de Quraysh et personnes d’une autre foi avant l’Islam." }
    sukun: { title: "Terres et demeures", desc: "Les terres et lieux habités par ces nations : Najran, Khaybar, al-Hira, Busra, Yathrib, al-Ahqaf et Pétra — chaque lieu avec son récit." }
    mafahim: { title: "Concepts", desc: "Le vocabulaire des sources sur ces nations : Gens du Livre, gens de la dhimma, jizya, shirk, kufr, hypocrisie, hanif et umma — les idées classant les relations." }
    kutub: { title: "Livres et sources", desc: "Les œuvres conservant les récits de ces nations : tafsirs, Sahihs, sira, maghazi, histoires, chroniques des conquêtes et hérésiographies — chaque livre dans son rôle." }
    dhikr: { title: "Mentions dans les sources", desc: "Chaque verset, passage, œuvre, événement et question nommant une nation, religion, confession ou un peuple non musulman — par une relation mentions ou un nom sans ambiguïté dans le texte, avec les sections de la cible." }
  viz:
    caption: "La carte du monde des textes : La Mecque et Médine au cœur, Rome au nord-ouest, Perse au nord-est, Abyssinie au sud-ouest, Gens du Livre en bande médiane, nations disparues sous l’horizon, peuples lointains en périphérie. Chaque point est une vraie notice et un vrai lien."
