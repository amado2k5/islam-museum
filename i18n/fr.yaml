cosmos:
  title: 'Explorateur du cosmos : êtres, peuples anciens et secrets de l’univers'
  lede: 'Tout ce que les sources du musée disent de ce qui dépasse l’histoire humaine connue : créatures que Dieu a dispersées dans les cieux comme sur terre selon le Coran, sept cieux et terres semblables,
    habitants de la terre avant Adam, peuples disparus, peuple derrière la barrière, secrets du cosmos — Trône, Table, Jujubier et clés de l’invisible. Chaque verset, récit et passage de livre est référencé
    ; chaque point de vue est identifié.'
  badge: Exploration du cosmos
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Les sources ne parlent pas d’extraterrestres au sens moderne ; elles parlent de créatures dispersées dans les cieux, de mondes multiples, de djinns et d’anges, de créations antérieures et
    de peuples disparus. Cet explorateur réunit précisément ces mentions et les rapproche des commentateurs qui les ont lues. Il ne tranche pas : lorsque les savants divergent ou qu’une chaîne de transmission
    est contestée, la notice le précise et cite chaque partie. Les versets coraniques viennent d’une table vérifiée ; les autres mentions sont repérées à la génération du site par un lexique assorti de
    garde-fous, de sorte qu’un livre dépouillé par la suite apparaît dès l’arrivée de son passage.'
