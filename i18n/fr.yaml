fatwa:
  disclaimer: Le musée présente ces fatwas comme des documents historiques, attribués à leurs auteurs ; il ne prononce aucun avis juridique et ne conseille personne.
  filter_label: Trouver une fatwa par sa question ou son sujet
  by_subject: Par sujet
  by_subject_note: Les sujets abordés par les fatwas, tels que les nomme chaque notice. Choisissez un sujet pour découvrir la question posée et la personne qui y a répondu.
  no_subject: '{n} fatwas ne précisent aucun sujet dans leur notice ; elles sont classées sous leur source.'
  subject_title: Fatwas sur {subject}
  subject_record: La notice du musée sur {subject}
  back: Retour à l’explorateur des fatwas
  title: Explorateur des fatwas
  lede: Des fatwas issues de recueils et de sites officiels ou reconnus, regroupées par source. Le musée les présente comme des documents historiques, attribués à leurs auteurs ; il ne prononce aucun avis
    juridique et ne conseille personne.
  note: Les résumés sont rédigés par le musée ; le texte intégral et son auteur figurent sur la page d’origine.
  by_source: Par source
  original: Page d’origine
  empty: Aucune fatwa pour le moment.
  count: '{n} fatwas'
  viz:
    title: Les questions que l’on pose
    note: Chaque cercle représente un sujet ; sa taille correspond au nombre de fatwas du musée qui le concernent. L’anneau qui l’entoure indique les sources dont elles émanent. Survolez un cercle, donnez-lui
      le focus ou touchez-le pour en savoir plus.
    drawn: Les {n} sujets comptant au moins {k} fatwas sont représentés.
    legend_title: Sources émettrices, dans l’ordre de l’anneau, en partant du haut et dans le sens horaire
    toggle: Estomper les sujets sans fatwa provenant de {s}
    toggle_hint: Appuyez sur le point coloré d’une source pour estomper les sujets sans fatwa provenant de celle-ci.
    hint: Survolez un cercle, donnez-lui le focus ou touchez-le pour le découvrir ici.
    more: et {n} autres sujets dans la liste ci-dessous
    open: Ouvrir le sujet
    close: Fermer
    outline_title: Le même ensemble sous forme de liste
khutab:
  viz:
    title: La frise du minbar
    note: Chaque marque représente un sermon, placé selon l’année hégirienne indiquée dans sa notice ; les marques se superposent lorsque les années sont proches, et leur forme et leur teinte indiquent
      le type de sermon. Une marque estompée correspond à une année approximative, tirée d’une tradition. Sélectionnez une marque pour découvrir qui a parlé et quand.
    legend_title: Types de sermons
    scroll_hint: Faites défiler les années horizontalement.
    scroll_label: Frise des sermons datés par année hégirienne, à défilement horizontal
    group_label: Sermons par année hégirienne
    hint: Pointez une marque, donnez-lui le focus ou touchez-la pour découvrir ici le sermon, son orateur et son année ; chaque marque mène à la page du sermon.
    open: Ouvrir la page
    undated_title: Sermons sans année consignée
    undated_note: Ils ne figurent pas sur l’axe, car leur notice ne donne aucune année.
    voices_title: 'Voix : les cycles de leçons par orateur'
    voices_note: Chaque anneau représente un orateur ; sa surface est proportionnelle au nombre de cycles de leçons de cet orateur conservés au musée. Ce décompte porte sur les {n} notices de cycles du
      musée, et non sur l’ampleur de l’enseignement d’un orateur ni sur son audience. Un anneau mène à ses cycles dans la liste ci-dessous.
    series_n: '{n} cycles'
  title: Explorateur des sermons et des leçons
  lede: Des sermons historiques tirés des recueils de khutab et des cycles de leçons enregistrées, chacun relié à son texte et à sa source.
  sermons: Sermons historiques
  series: Cycles de leçons enregistrées
  empty: Aucune notice pour le moment.
  count: '{n} notices'
  what_title: De quoi s’agit-il ?
  what: Une khutba est un sermon prononcé depuis le minbar, le vendredi, lors des deux Aïds ou à une occasion particulière ; un dars est une leçon, et un cycle porte sur un livre ou un thème enseigné en
    plusieurs séances. Chaque notice présente les paroles d’un orateur adressées à son propre auditoire, en un temps et un lieu donnés.
  notice: Le musée décrit les propos tenus et les attribue à leurs auteurs ; il ne prêche pas et ne prononce aucun avis juridique. Ce qui convenait à un contexte peut ne pas convenir à un autre ; les points
    de vue d’un orateur ou d’un cycle sont présentés comme les leurs.
  sermons_note: Dans l’ordre de l’année de composition ou de prononciation de chaque sermon (année hégirienne accompagnée de l’année grégorienne). La mention « date de mise en ligne » indique la publication
    d’un enregistrement, et non la date du sermon.
  series_note: Regroupés par orateur ({n} orateurs). Ouvrez la rubrique d’un orateur pour voir ses cycles.
  speaker: Orateur
  speaker_page: Ouvrir la page de l’orateur
  unattributed: Orateur non renseigné
  contested: contenu controversé, décrit sans être approuvé
  date: '{h} H / {g} ap. J.-C.'
  uploaded: date de mise en ligne
  fatwa_link: Explorateur des fatwas
  api_link: Données (JSON)
  types:
    jumu'a: Sermon du vendredi
    occasion: Sermon de circonstance
    eid-al-fitr: Sermon de l’Aïd al-Fitr
    eid-al-adha: Sermon de l’Aïd al-Adha
    istisqa: Sermon de la prière pour la pluie
    kusuf: Sermon de la prière de l’éclipse
    hajj-arafa: Sermon d’Arafat
    nikah: Sermon de mariage
    farewell: Sermon d’adieu
    other: Sermon
arabiyya:
  title: 'Navigateur de la langue arabe : la langue du Coran'
  lede: 'L''arabe tel que le Coran le nomme et tel que les sources le décrivent : les versets où le Coran parle de sa propre langue, les récits rapportés du Prophète, des Compagnons et des Successeurs,
    les histoires de ceux qui l''ont entendu, le débat sur son inimitabilité, puis l''histoire, l''écriture, les sciences, les dialectes, le monde, les savants et les livres de l''arabe.'
  badge: Explorateur de la langue arabe
  status: 'Cette version contient {v} versets où le Coran parle de sa langue, {p} passages du hadith, de la sira, du tafsir et des livres moissonnés qui parlent de l''arabe, et {r} fiches rédigées. Les
    passages sont repérés par leurs mots : certains ne mentionnent l''arabe qu''en passant ; chacun s''ouvre sur sa page avec sa source.'
  method_title: La méthode du navigateur
  method_note: 'Rien ici n''est tenu dans une liste à part. Les passages sont repérés à la construction du site, en comparant les mots de chaque fiche de texte du graphe du musée : un livre moissonné plus
    tard ajoute ses passages le jour de son arrivée. Les fiches rédigées sont des fiches ordinaires du musée, étiquetées arabiyya-browser et arabiyya-<section>. Le texte des versets vient uniquement des
    fichiers Tanzil figés. Quand les savants divergent, la fiche donne chaque avis sous son nom, sans trancher.'
  api: Le jeu de données complet se trouve à
  contents_title: Sur cette page
  empty: Aucune fiche dans cette version pour l'instant.
  passages_title: Ce que les sources disent de l'arabe
  passages_note: 'Passages des textes moissonnés par le musée dont les mots parlent de la langue arabe : la langue de Quraysh, le parler des Arabes, l''apprentissage de l''arabe, la grammaire et ses fondateurs,
    les fautes de langue et l''inimitabilité du Coran. L''extrait est le début du passage tel qu''il figure dans la source ; un texte lu par machine sur une image peut comporter des erreurs de lecture.'
  kin_title: Salles voisines
  corpora:
    quran:
      title: Le Coran parle de sa langue
      desc: Chaque verset du texte figé qui dit que la révélation est arabe, qu'elle est venue dans la langue de son peuple, ou qui oppose l'arabe à une langue étrangère. Ouvrez un verset pour sa page,
        ses traductions et son commentaire.
    sunnah:
      title: Dans le hadith et les récits
      desc: Récits des recueils de hadith qui parlent de la langue arabe, de la langue de Quraysh ou de la mise par écrit du Coran dans cette langue.
    seerah:
      title: Dans la sira
      desc: Passages des livres de la vie du Prophète qui parlent de la langue.
    tafsir:
      title: Dans les commentaires
      desc: Passages des commentaires du Coran qui traitent de l'arabe du Coran.
    books:
      title: Dans les autres livres moissonnés
      desc: 'Histoire, biographies, droit, sciences du Coran et belles-lettres : partout où un livre moissonné parle de l''arabe.'
  sections:
    lisan:
      title: L'arabe, langue du Coran
      desc: Pourquoi la révélation est en arabe selon les commentateurs, la langue de Quraysh, les sept ahruf, et ce que les premières générations ont dit de l'apprentissage de l'arabe.
    ijaz:
      title: La langue inimitable du Coran
      desc: 'Le défi lancé par le Coran, ceux qui l''ont entendu et ce qu''ils ont dit, et la manière dont les savants ont expliqué son inimitabilité : avis, exemples et récits, chacun sous sa source.'
    origins:
      title: Origines et histoire
      desc: D'où vient l'arabe, sa place parmi les langues sémitiques, les Arabes avant l'islam, et comment la langue est passée de l'Arabie au monde.
    script:
      title: Lettres et écriture
      desc: L'alphabet, la ponctuation et la vocalisation du mushaf, et l'art d'écrire l'arabe.
    sciences:
      title: Les sciences de l'arabe
      desc: Grammaire, morphologie, rhétorique, métrique, lexicographie et théorie de la langue, et la naissance de chacune.
    dialects:
      title: Dialectes anciens et modernes
      desc: Les parlers des tribus à l'époque de la révélation, et les arabes parlés d'aujourd'hui à côté de la langue écrite.
    world:
      title: L'arabe dans le monde
      desc: Où l'on parle arabe, les pays arabes, l'arabe parmi les langues du monde musulman, et ce qu'il a donné aux autres langues et reçu d'elles.
    scholars:
      title: Les savants de la langue
      desc: Les grammairiens, lexicographes et rhétoriciens qui ont décrit l'arabe.
    books:
      title: Les livres de la langue
      desc: Les ouvrages fondateurs de la grammaire, de la rhétorique, de la théorie de la langue et du vocabulaire du Coran. Les dictionnaires ont leur propre navigateur.
  viz:
    title: L'anneau des lettres
    note: 'Les lettres de l''arabe dans l''ordre que leur a donné al-Khalil ibn Ahmad dans le Kitab al-Ayn, premier dictionnaire arabe : non pas alif, ba, ta, mais selon le lieu où chaque son se forme,
      du fond de la gorge jusqu''aux lèvres. Chaque arc coloré est un point d''articulation.'
    aria: Un anneau des lettres arabes dans l'ordre d'al-Khalil, groupées par point d'articulation, avec au centre les chiffres de cette version
    verses: versets nomment la langue du Coran
    others: passages sur l'arabe · fiches rédigées
    source: 'L''ordre est celui rapporté d''al-Khalil dans le Kitab al-Ayn ; les fiches du musée :'
