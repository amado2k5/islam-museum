  topics:
    umm: La mère et son rang
    haml: Grossesse
    wilada: Accouchement
    radaa: Allaitement
    tarbiya: Garde et éducation
    birr: Piété envers les parents
  sections:
    quran:
      title: Dans le Coran
      desc: 'La maternité dans le Coran : les épreuves successives de la grossesse maternelle, l’injonction de prendre soin de ses parents, la mention de la mère, les versets de l’allaitement et du sevrage,
        l’interdiction d’épouser les mères, la mère de Moïse confiant son nourrisson au fleuve, Marie et son accouchement.'
    sunnah:
      title: Dans la sunna
      desc: 'La maternité dans les deux Sahih, le Muwatta et les Sunan : la priorité répétée donnée à la mère, le Paradis sous les pieds des mères, la préséance du devoir envers elle, les règles de la grossesse,
        de l’accouchement, de l’allaitement et de la garde, les mères des croyants et chaque hadith sur une mère et son enfant.'
    seerah:
      title: Dans la sira
      desc: Ce que les ouvrages de sira et d’histoire rapportent des mères — Amina bint Wahb, mère du Prophète, Hagar, mère d’Ismaël, Sumayya, mère d’Ammar, et les mères des Compagnons et des Successeurs
        — à mesure que les passages de sira sont dépouillés.
    books:
      title: Dans les livres dépouillés
      desc: Les récits de maternité dans tous les autres ouvrages dépouillés — fiqh, adab, histoire, biographie et poésie — intégrés automatiquement dès l’arrivée de leurs passages.
    curated:
      title: Notices thématiques sur la maternité
      desc: 'Les notices choisies du musée sur la mère, la grossesse, l’accouchement, l’allaitement, la garde et la piété filiale : maternité, grossesse, accouchement, garde, birr al-umm, mères des croyants,
        aqiqa et prise en charge des orphelins.'
  viz:
    title: Les six lignes de la maternité
    lede: Six lignes tracées, une par thème — mère et rang maternel, grossesse, accouchement, allaitement, garde et éducation, piété envers les parents — et sur chacune un disque par section contenant des
      notices du thème, de surface proportionnelle à leur nombre ; chaque disque mène à la liste de la section ci-dessous.
