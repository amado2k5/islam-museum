  tagged_note: Toute notice portant l’étiquette i3lam-browser entre automatiquement ici — c’est ainsi que les futurs dépouillements apparaissent.
heroes:
  title: Héros de l’Islam
  lede: 'Des femmes et des hommes qui ont donné beaucoup et dépassé leurs intérêts pour autrui : six salles de vertus, quatre héros dans chacune, chaque récit avec sa source.'
  status: 'Héros dans ces salles : {n} sur {trails} chemins. Chaque nom ouvre la notice du héros ; chaque salle ouvre son récit complet.'
  trail_link: Parcourir le récit complet de la salle ({n} héros)
  record_link: Ouvrir la notice
  note_title: À propos de ces salles
  note_body: 'Ces héros sont des personnes aux engagements documentés, non des icônes idéalisées : chaque récit figure dans sa notice avec sa source ; les divergences sont signalées dans les notes de recherche.
    Les salles s’enrichissent à mesure que les récits sont complétés au musée.'
  virtues:
    sacrifice:
      name: Salle du sacrifice
      lede: 'Ils ont donné leur personne et leur tranquillité pour des inconnus : la première martyre, le porte-étendard, le bouclier d’Uhud et le chef face aux lances.'
    courage:
      name: Salle du courage
      lede: 'Une fermeté mesurée où cœur et pas avancent ensemble : le chevalier du lit, l’épée des champs de bataille, le chevalier de Hattin et le cheikh du désert.'
    mercy:
      name: Salle de la miséricorde
      lede: 'La miséricorde comme force : le prédicateur des cœurs, la mère des captifs, le sultan de la maison de justice et l’exilé protégeant ses voisins.'
    generosity:
      name: Salle de la générosité
      lede: 'Une fortune entière au service du bien commun : caravanes d’Abd al-Rahman, puits d’Othman, richesse de Khadija et fondation de Fatima.'
    knowledge:
      name: Salle du savoir
      lede: 'Ils ont porté le savoir comme un dépôt et l’ont payé de leur vie : le fondateur de la théorie juridique, le ferme face à l’inquisition, le savant de Bassora et la langue de vérité.'
    steadfastness:
      name: Salle de la constance
      lede: 'Le monde tremblait, eux ne bougeaient pas : « Un, Un » sous le rocher, le plus long chemin vers la vérité, le jour où la communauté trembla et la parole sans peur.'
ritha:
  title: Navigateur des élégies et des annonces de décès
  lede: 'Tout ce qui fut dit en élégie et en annonce de décès dans les sources du musée : les versets de la patience et l''istirja'', les paroles du Prophète à la mort de son fils, de son petit-fils et
    des Compagnons perdus, son annonce de la mort du Négus et de Ja''far, Zayd et Ibn Rawaha, les condoléances des Compagnons, les élégies de Hassan, de Ka''b ibn Malik, d''al-Khansa'' et de Labid, les
    récits des Compagnons et des Successeurs à la mort de leurs proches et les paroles des livres moissonnés — ce qui sera moissonné plus tard s''y ajoute automatiquement.'
  badge: Explorateur des élégies et annonces
  status: Cette version contient {n} notices en {s} sections ; les textes sont des brouillons tant qu'une personne ne les a pas lus.
  method_title: La méthode du navigateur
  method_note: 'Chaque notice ici est une notice ordinaire du musée, avec ses sources et son texte en cinq langues. Les passages sont trouvés à la construction du site par un détecteur prudent sur les textes
    : les mots de l''élégie et du poème d''élégie, de l''annonce du décès et du messager, des condoléances, les formules fixes comme l''istirja'', « à Dieu appartient ce qu''Il a pris et ce qu''Il a donné
    » et « la patience, c''est au premier choc », les mots de la lamentation, et les pleurs seulement près d''une mention de mort. Les versets viennent d''une table revue, non d''un lexique. « Na''t » la
    description, « ''azahu ila » dans l''attribution des sources, « waritha » dans l''héritage et les pleurs de crainte de Dieu restent exclus, les faux positifs vérifiés sont exclus par identifiant, tout
    livre moissonné plus tard apporte ses passages automatiquement, et les notices choisies s''ajoutent par l''étiquette ritha-browser. Chaque passage est classé : élégie, annonce de décès, condoléances,
    ou pleurs et lamentations.'
  api: L'ensemble est disponible à
