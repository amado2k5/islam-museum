    occasion: "Sermon de circonstance"
    eid-al-fitr: "Sermon de l’Aïd al-Fitr"
    eid-al-adha: "Sermon de l’Aïd al-Adha"
    istisqa: "Sermon de la prière pour la pluie"
    kusuf: "Sermon de la prière de l’éclipse"
    hajj-arafa: "Sermon d’Arafat"
    nikah: "Sermon de mariage"
    farewell: "Sermon d’adieu"
