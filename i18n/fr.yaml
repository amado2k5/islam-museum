  convert:
    btn: Tout juste converti
    tagline: Bienvenue. Vous n'êtes pas seul, et vous n'avez pas à tout apprendre cette semaine.
    lede: 'Voici le musée vu depuis le premier jour de l''islam : que faire d''abord, que demander, à qui le dire, où trouver les vôtres, et que faire quand tout semble trop. Avancez à votre rythme. Rien
      ici n''est un examen.'
    mind:
    - Ai-je bien fait ? Est-ce que cela compte ?
    - Que dois-je changer aujourd'hui, et que peut attendre ?
    - Comment le dire à ma famille, et que faire s'ils sont blessés ou en colère ?
    - Je me sens seul. Qui est là pour moi ?
    - Certains jours, je doute. Est-ce que cela veut dire que je me suis trompé ?
    - Je veux comprendre en quoi cela se compare à ce que je croyais avant.
    steps:
    - when: Les premiers jours
      title: Respirez, et apprenez les bases
      body: Apprenez comment se fait la prière, comment se purifier pour elle, et quelques courtes invocations. La plupart des nouveaux musulmans commencent petit. Rien n'a besoin d'être parfait le premier
        jour.
    - when: Les premières semaines
      title: Trouvez une personne
      body: Un ami musulman patient, une mosquée accueillante ou un cercle en ligne comptent plus que cent règles. Posez-lui les questions que vous trouvez bêtes.
    - when: Les premiers mois
      title: Ajustez, doucement
      body: La nourriture, la boisson, l'habillement, le travail et les conversations avec la famille se présentent un à un. Beaucoup de nouveaux musulmans disent que d'avancer pas à pas les a gardés stables.
    - when: La première année
      title: Parcourez toute l'année
      body: Rencontrez le Ramadan, les deux Aïds et le rythme du calendrier musulman. Lisez la vie du Prophète et un peu de Coran avec son commentaire.
    - when: La deuxième année et après
      title: Faites-le vôtre
      body: L'enthousiasme se pose dans la vie de tous les jours. Le doute, les périodes de sécheresse et les questions difficiles sont fréquents ici aussi. Ils font partie du chemin ; ils n'y mettent pas
        fin.
    sections:
    - title: Ce qu'il faut savoir d'abord
      body: Les cinq piliers, la prière et la purification, et les mots des invocations de tous les jours, expliqués simplement et avec leurs sources.
    - title: En parler à votre famille et à vos amis
      body: 'Les familles réagissent de bien des façons : soulagement, inquiétude, peine, silence. Pensez au moment, au ton et à la personne à qui le dire en premier, et parlez-en à quelqu''un de confiance
        avant de le dire à tous. Ces pages montrent ce que dit la tradition des parents, de la famille et de l''amitié.'
    - title: Nourriture, boisson et ce qu'il faut laisser
      body: Ce qui est halal et ce qui ne l'est pas, tel que les savants l'exposent, chaque avis étant étiqueté. Pour ce que vous possédez déjà, comme l'alcool, lisez d'abord la discussion et demandez à
        un savant local de confiance. Le musée décrit ; il ne rend pas de verdicts.
    - title: Trouver les vôtres
      body: La plupart des endroits ont des mosquées, des cercles de nouveaux musulmans, des associations d'étudiants, des groupes d'étude et des communautés en ligne. Cherchez ceux qui accueillent les
        questions, ne vous font pas honte et ne vous demandent pas de choisir un camp. Commencez par les lieux que le musée cartographie et les enseignants qu'il recense.
    - title: Boutiques, nourriture, livres et vêtements pudiques
      body: Épiceries et restaurants halal, librairies islamiques et boutiques de vêtements pudiques se trouvent d'ordinaire par les annuaires locaux, les panneaux d'affichage des mosquées et votre nouveau
        cercle. Le musée montre les traditions qui les sous-tendent.
    - title: Apprendre à votre rythme
      body: De courts parcours guidés et des cours complets, la vie du Prophète, les messagers qui l'ont précédé, et le Coran.
    - title: Comparer avec ce que vous connaissiez
      body: Si vous venez du christianisme, du judaïsme ou d'un autre chemin, vous voudrez peut-être comparer. Le musée recense les prophètes que les musulmans partagent avec d'autres religions, les peuples
        et les religions de l'histoire, et les débats classiques entre religions, chacun avec ses sources.
    - title: Quand viennent le doute ou l'épreuve
      body: Le doute, le regret, la fatigue et la solitude sont courants durant les deux premières années et sont discutés ouvertement dans les écrits classiques. Lisez les questions que d'autres posent,
        faites des pauses, et parlez à quelqu'un avant de décider quoi que ce soit d'important. Si vous prenez du recul, le musée sera toujours là.
    - title: Apprendre à vous connaître
      body: L'islam demande du caractère, du repentir et un examen honnête de soi-même. Ces pages sur les bonnes actions, les mauvaises actions et le caractère vous invitent à regarder en vous sans être
        jugé.
    note: 'Pas encore dans le musée : des annuaires vérifiés de boutiques halal, de librairies, de boutiques de vêtements pudiques, de groupes de soutien, de serveurs Discord et de forums. Ces adresses
      changent, et le musée n''en listera aucune qu''il n''a pas vérifiée. En attendant, renseignez-vous auprès d''une mosquée locale ou d''une association d''étudiants établie, et méfiez-vous de quiconque
      vous demande de l''argent ou vous met la pression.'
  doubter:
    btn: Encore indécis
    tagline: Prenez votre temps. Personne ici ne compte vos heures.
    lede: 'Cette vue s''adresse à quelqu''un qui n''a pas encore décidé. Elle ne cherche pas à vous gagner. Elle expose les sources, les questions les plus fortes et l''éventail des avis, et laisse la décision
      là où elle doit être : chez vous.'
    mind:
    - Est-ce vrai ? Comment le saurais-je ?
    - À quoi devrais-je renoncer, et que pourrais-je gagner ?
    - Qu'en penseraient ma famille et mes amis ?
    - Que penser de ce qui me trouble dans l'islam ou chez les musulmans ?
    - En quoi est-ce différent de ce que je crois déjà ?
    - J'ai peur de décider trop tôt, ou trop tard.
    sections:
    - title: Commencez par la plus courte introduction
      body: Un court parcours guidé, puis les croyances et les pratiques en mots simples.
    - title: Lisez par vous-même
      body: Le Coran avec le commentaire classique, et la vie du Prophète, à partir des sources et non de résumés.
    - title: Les questions les plus dures, tous les avis, aucun verdict
      body: Les questions difficiles sont présentées avec les meilleures voix de chaque côté, citées, sans verdict.
    - title: Comparer avec d'autres croyances
      body: Les prophètes, les peuples et les religions que les musulmans et d'autres partagent ou sur lesquels ils divergent, et les débats classiques.
    - title: À quoi ressemblent la journée et l'année d'un musulman
      body: La prière, le jeûne, la charité et le calendrier, pour que vous puissiez imaginer cette vie avant de la choisir.
    - title: Rencontrer des musulmans à travers leurs mots
      body: Des savants, des enseignants et des vies ordinaires à travers quatorze siècles.
    - title: Les signes et les raisons que les musulmans avancent
      body: Les musulmans citent des signes dans la nature, dans le Coran et dans l'histoire comme raisons de croire. Le musée les présente avec leurs sources.
    note: Le musée ne peut pas vous dire ce qu'il faut croire et n'essaie pas de le faire. Il n'a ni chat ni service d'écoute. Si vous souhaitez parler à une personne, une mosquée locale ou un groupe interreligieux
      organise peut-être des conversations ouvertes. Venez accompagné de quelqu'un de confiance la première fois.
  researcher:
    btn: Chercheur
    tagline: Tout est cité, tout est relié, tout est ouvert.
    lede: 'Pour les étudiants, écrivains, enseignants et chercheurs, musulmans ou non : un graphe de fiches avec sources, dates, relations et données ouvertes. Partez de votre question, suivez les liens
      et vérifiez la citation.'
    mind:
    - D'où vient ce fait, et quelle est la fiabilité de la source ?
    - Puis-je le citer, l'exporter et le vérifier ?
    - Comment les sujets controversés sont-ils traités ?
    - Quelles dates, quels lieux et quelles chaînes de personnes relient ces événements ?
    - Y a-t-il des données que je puisse réutiliser ?
    sections:
    - title: Chercher dans tout le graphe
      body: La recherche en texte intégral dans toutes les langues, et le graphe des personnes, des lieux, des œuvres et des événements.
    - title: Méthode et sources
      body: Comment les fiches sont écrites, ce qui compte comme source et comment la fiabilité est indiquée.
    - title: Temps et lieu
      body: La chronologie, le calendrier et les cartes situent chaque personne et chaque événement dans son siècle et son pays.
    - title: Personnes, livres et réseaux
      body: Savants, Compagnons et œuvres, reliés par des relations de maître à élève et de famille.
    - title: Les textes
      body: Le Coran, ses commentaires et ses récitations.
    - title: Données ouvertes et API
      body: Les données sont ouvertes et disponibles sous forme d'API statique, réutilisables librement selon leurs licences.
    - title: Le désaccord, cartographié
      body: Écoles juridiques, débats classiques et règles côte à côte.
    note: Les fiches sont rédigées avec l'aide d'agents d'IA à partir de sources citées, portent une note de provenance, et beaucoup n'ont pas été lues par un humain. Vérifiez la citation, puis vérifiez
      la source.
  learner:
    btn: J'apprends ma religion
    tagline: Commencez là où vous êtes. Le prochain petit pas suffit.
    lede: 'Pour un musulman qui veut en savoir plus et mieux faire mais ne sait pas par où commencer. De courtes étapes, dans un ordre logique : des bases de l''adoration au caractère, au Coran et à la
      vie du Prophète.'
    mind:
    - Par où commencer ?
    - Je prie de façon irrégulière et je culpabilise.
    - Je connais les règles mais pas les raisons.
    - Je veux comprendre le Coran, pas seulement le réciter.
    - Je veux mieux faire avec ma famille, mon travail et mon argent.
    - Il y a beaucoup d'avis. À qui faire confiance ?
    sections:
    - title: Consolider les fondations
      body: Les piliers, la purification, la prière et le jeûne, pas à pas, avec leurs preuves.
    - title: Un rythme quotidien
      body: Des invocations pour chaque occasion, et le calendrier musulman pour planifier votre année.
    - title: Comprendre le Coran
      body: Lisez-le avec le commentaire classique, pour entendre ce qu'il dit et pas seulement comment il sonne.
    - title: Marcher avec le Prophète
      body: Sa vie, les messagers qui l'ont précédé et les Compagnons qui l'entouraient.
    - title: Caractère, famille et travail
      body: Le bon caractère, la vie à la maison, l'amitié et le gain honnête.
    - title: Connaître les écoles et les savants
      body: Pourquoi les savants diffèrent, et comment poser une question éclairée.
    - title: Des cours à suivre
      body: Des cours et des sentiers guidés, une étape à la fois.
    - title: Quand vous trébuchez
      body: Le repentir, les petites bonnes actions et le retour, sans désespoir.
    note: Le musée décrit ce que disent les savants et étiquette chaque avis. Il ne rend pas de verdicts. Pour une question personnelle, adressez-vous à un enseignant qualifié en qui vous avez confiance.
  critic:
    btn: Critique
    tagline: Apportez votre plus forte objection. Les sources sont ouvertes.
    lede: Pour quelqu'un qui pense que l'islam est faux, nuisible ou n'est pas une vraie religion, ou qui veut plaider pour une autre foi ou pour aucune. Mettez-le à l'épreuve des preuves. Le musée cite
      ses sources, étiquette chaque avis avant de l'exposer et garde ses questions difficiles à la vue de tous. Il ne vous insultera pas, et il vous demande la même chose.
    mind:
    - Je pense que cette religion est fausse, ou dangereuse.
    - Je veux trouver les contradictions et les côtés laids.
    - Je me méfie de tout ce qui ressemble à un argumentaire de vente.
    - Je défends ma propre foi, et je veux voir comment l'islam se situe à côté.
    - Je veux les textes mêmes des musulmans, pas les résumés de leurs défenseurs.
    sections:
    - title: Vérifier les affirmations à la source
      body: Comment chaque fiche est sourcée, ce que le musée tient pour une preuve, et comment vérifier vous-même une citation.
    - title: Lire les textes tels qu'ils sont
      body: Le Coran avec le commentaire classique, et la vie du Prophète, dans les traditions d'origine.
    - title: Les sujets les plus durs, tous les avis, aucun verdict
      body: Batailles, droit pénal et règles juridiques, avec la position sunnite étiquetée d'abord, puis les points de vue académiques et autres, chacun cité.
    - title: Les débats classiques entre religions
      body: Comment musulmans, chrétiens, juifs et autres ont débattu entre eux, comme histoire.
    - title: Là où les musulmans divergent entre eux
      body: Les écoles juridiques et les savants qui diffèrent, avec le raisonnement de chacun.
    - title: L'histoire avec ses défauts
      body: Les califes, les batailles et les siècles, tels qu'ils sont consignés.
    - title: Discuter avec les données
      body: Le graphe, les données ouvertes et la recherche, pour que vous puissiez éprouver toute affirmation vous-même.
    note: Le musée est écrit depuis la tradition sunnite et le dit. C'est un cadre de départ étiqueté, et les autres points de vue sont étiquetés quand ils sont présentés. Une affirmation sans citation
      est un défaut à signaler, non une doctrine cachée. Le musée n'est pas une plateforme de débat et n'a pas de commentaires.
accessibility:
  blind_1: 'Chaque page est un vrai texte dans une structure claire : un seul titre principal, des titres en dégradé, des points de repère de page (en-tête, navigation, contenu principal, pied de page),
    un lien « passer au contenu » avec son premier élément, ainsi que des listes et des tableaux marqués comme tels. Les lecteurs d''écran comme NVDA, JAWS, VoiceOver, TalkBack et Orca peuvent le lire et
    le naviguer.'
  blind_2: 'À propos du braille : Le site ne dessine pas lui-même les lettres en braille ; au lieu de cela, le lecteur d''écran envoie le texte de la page à la ligne électronique en braille et l''affiche
    en lettres en relief. Cela se fait en sept langues, chaque page indiquant sa langue et son orientation, si bien que le lecteur d''écran et la ligne braille passent au braille arabe, au braille anglais
    unifié (UEB) ou au braille ourdou.'
  blind_3: Les images comportent un texte alternatif les décrivant, et les décorations décoratives ainsi que les icônes sont cachées aux lecteurs d'écran afin de ne pas interrompre la lecture.
  blind_4: Chaque page est lue et JavaScript est désactivé. Des fonctionnalités interactives sont ajoutées au-dessus du texte et ne le bloquent jamais.
  blind_title: Les aveugles et malvoyants, les lecteurs d'écran et la méthode braille
  commit_body: L'accès à la culture est un droit pour tout être humain, y compris les personnes handicapées (Convention des Nations Unies relative aux droits des personnes handicapées, articles 9 et 30).
    Le Musée de l'Islam est gratuit, sans frais ni abonnements, et a été construit de manière à ce que ses pages puissent être lues à l'œil nu, à l'oreille via un lecteur d'écran, et au toucher en braille,
    en arabe, anglais, ourdou, français, espagnol, turc et indonésien. Nous accueillons chaque visiteur, quel que soit son niveau de capacité, sa langue ou son origine.
  commit_title: Notre engagement
  deaf_1: 'Le musée est écrit inaudible : rien sur le site n''est accessible uniquement par audio. Lorsqu''une histoire pour enfants est présentée sous forme d''enregistrement audio, le texte complet de
    l''histoire est imprimé sur la même page au-dessus du lecteur, et l''audio ne commence pas tout seul.'
  deaf_2: Chaque audio ou vidéo ajouté au musée doit être accompagné d'un texte synchrone (sous-titres écrits) ou d'un texte intégral écrit en arabe, anglais, ourdou, français, espagnol, turc et indonésien.
  deaf_3: Nous prévoyons de faire des copies en langue des signes du guide de bienvenue, du musée et de cette déclaration, réalisées par des personnes sourdes maîtrisant la langue des signes, en langue
    des signes américaine, en langue des signes québécoise (LSQ), en langue des signes britannique, en langue des signes internationale, en langue des signes arabe et en langue des signes pakistanaise,
    et à ajouter à cette page une fois terminée.
  deaf_title: Sourd et malentendants
  feedback_1: Si rien sur le site ne fonctionne comme vous en avez besoin, ou si vous avez besoin d'informations dans un autre format, faites-le-nous savoir. Mentionnez la page (son titre), ce que vous
    essayiez de faire, et si vous préférez, le navigateur et la technologie d'assistance que vous utilisez.
  feedback_2: Nous répondons dans un délai de cinq jours ouvrables et abordons d'abord les obstacles. Vous pouvez nous envoyer un e-mail ou ouvrir un rapport public sur GitHub.
  feedback_cta: Contactez-nous au sujet de l'accessibilité
  feedback_issue: Signaler une barrière d'accès
  feedback_title: Parlez-nous d'un obstacle
  formats_body: Tous les textes sont ouverts (textes CC BY-SA 4.0, données CC0), et peuvent être convertis en braille, en gros caractères, audio ou tout autre format accessible et partagés librement. Si
    vous avez besoin d'une page dans un autre format, veuillez nous contacter et nous vous assisterons.
  formats_books_link: 'Téléchargez des livres prêts à l''emploi : fichiers braille (BRF) et livres numériques accessibles (EPUB 3) pour les parcours et les histoires pour enfants, et cette page'
  formats_title: Autres formules
  keyboard_1: 'Tout peut se faire uniquement avec le clavier : Tab et Maj+Tab pour naviguer entre les liens et les boutons, Entrée et espace pour les activer, et Échap pour fermer le menu du téléphone et
    revenir au bouton qui l''a ouvert. L''indicateur de mise au point est toujours visible.'
  keyboard_2: Les boutons et les maillons sont suffisamment grands pour être touchés. Les jeux pour enfants sont conçus pour être joués au clavier, sans limite de temps pour la lecture.
  keyboard_title: Clavier, touches alternatives et tactile
  law_body: 'Si notre réponse ne résout pas le problème, vous pouvez contacter l''autorité compétente où vous résidez : au Canada, le Commissaire à l''accès (Commission canadienne des droits de la personne),
    ou en Ontario, la Direction de l''Accès ; dans l''Union européenne, l''autorité d''application de l''application de votre État membre ; au Royaume-Uni, le Service de conseil et de soutien pour l''égalité
    (EASS) ; et aux États-Unis, la ligne d''information ADA du ministère de la Justice.'
  law_title: Si vous n'êtes pas satisfait
  ld_summary: 'Page texte d''abord : Chaque élément visuel dispose d''une alternative textuelle. Prend en charge clavier, lecteurs d''écran et écrans Braille ; aucun son, flash ou mouvement nécessaire.'
  lede: Le musée est pour tout le monde. Cette déclaration montre comment le site a été construit pour être utilisé par les aveugles et malvoyants, les sourds ou malentendants, ceux qui ne parlent pas,
    ceux qui utilisent des claviers ou toute technologie d'assistance, et comment il nous indique quand quelque chose ne fonctionne pas correctement.
  limits_1: 'Il s''agit d''une auto-évaluation : le site n''a pas encore fait l''objet d''un audit d''accessibilité indépendant. Un rapport d''audit et de conformité (ACR/VPAT) est prévu.'
  limits_2: La carte interactive, le réseau de connaissances et la salle 3D sont par nature visuelle ; leurs alternatives textuelles sont complétées et testées avec des lecteurs d'écran.
  limits_3: Certaines références font référence à des conférences enregistrées sur d'autres sites non contrôlés par le musée, qui peuvent ne pas contenir de texte écrit. Nous planifions des fichiers Braille
    (BRF) prêts à l'emploi et des livres électroniques accessibles (EPUB) à partir de textes du musée. Le niveau « lecture facile » n'est disponible que lorsqu'il existe un exemplaire dans l'aile des enfants
    ; la plupart des pages adultes n'en disposent pas encore.
  limits_title: Limitations connues
  method_body: Cette déclaration a été rédigée le 25 octobre 2026, à partir d'une auto-évaluation du site selon WCAG 2.2 au niveau AA, avec des contrôles automatisés (un 100 sur l'échelle d'accessibilité
    du phare est requis pour chaque demande de fusion) et un examen manuel. Il est examiné au moins une fois par an, et chaque fois que le site change, il affecte l'accès.
  method_title: Comment préparer cette instruction
  more_body: Les règles de conception et d'accessibilité respectées par chaque contributeur sont publiées dans le dépôt public.
  more_link_rules: Règles de conception et d'accessibilité
  more_title: En savoir plus
  speech_1: 'Rien sur le site n''a besoin de votre voix : pas d''entrée vocale, pas de microphone, pas de ligne téléphonique, pas de test verbal. Toutes les méthodes de contact sont écrites (email ou formulaire
    GitHub).'
  speech_title: Visiteurs non parlants
  standards_1: 'Au niveau international : les lignes directrices WCAG 2.2 au niveau AA et la norme WAI-ARIA 1.2 du W3C ; la Convention des Nations Unies relative aux droits des personnes handicapées ; la
    Convention de Marrakech pour faciliter l''accès aux œuvres publiées pour les aveugles et les personnes ayant des publications en lecture ; la Recommandation de l''UNESCO de 2015 sur les musées et collections
    ; et la définition des musées par le Conseil international des musées (ICOM), qui appellent toutes deux à des musées accessibles et inclusifs.'
  standards_2: 'Au Canada, où le musée est géré : la Loi sur l''accessibilité du Canada, la norme CAN/ASC-EN 301 549, la Loi sur l''accessibilité de l''Ontario (AODA) et ses normes intégrées.'
  standards_3: 'Aux États-Unis : Americans with Disabilities Act (ADA) et Section 508 de la Rehabilitation Act.'
  standards_4: 'Dans l''Union européenne et au Royaume-Uni : Loi européenne sur l''accessibilité (Directive 2019/882), Directive sur l''accessibilité des sites Web (2016/2102), norme harmonisée EN 301 549
    ; et Loi sur l''égalité du Royaume-Uni de 2010. Cette déclaration suit le modèle développé par la Commission européenne pour les données d''accessibilité.'
  standards_title: Normes et lois que nous suivons
  status_1: 'L''objectif du musée est les Directives d''accessibilité du contenu Web (WCAG) 2.2 au niveau AA, émises par le World Wide Web Consortium (W3C) et accréditées comme norme internationale appelée
    ISO/IEC 40500. Le site est partiellement identique : la plupart des pages atteignent la cible, et les vulnérabilités connues sont listées ci-dessous, avec des travaux en cours à traiter.'
  status_2: Cette évaluation est notre auto-évaluation, avec des contrôles automatisés à chaque changement et des tests manuels. Un audit indépendant est prévu et sera publié sur cette page.
  status_title: Statut de conformité
  tech_1: 'HTML, CSS et WAI-ARIA, que tout navigateur moderne peut lire, et JavaScript est optionnel. Le site n''utilise aucune « couche » ou barre d''outils tierce : celles-ci ajoutent du code provenant
    de l''extérieur du site et ne le rendent pas convivial, raison pour laquelle l''accessibilité a été intégrée directement dans les pages elles-mêmes.'
  tech_title: Technologies sur lesquelles le site s'appuie
  title: Accessibilité
  updated: 'Dernière mise à jour : 25 octobre 2026'
  vision_1: Le contraste du texte et les contrôles ont des rapports WCAG (4,5:1 pour le texte, 3:1 pour le texte grand et les bordures) dans les formats clair et sombre, et la couleur seule n'est pas la
    seule façon de transmettre l'information. Les pages s'adaptent à de petits écrans de téléphone sans défilement latéral.
  vision_2: L'en-tête vous permet de passer des thèmes clairs et sombres ainsi que de deux lignes de lecture. Le menu « Accessibilité » vous permet de zoomer sur le texte, d'élargir l'espacement des lignes,
    d'augmenter le contraste, de mettre l'animation en pause et de souligner tous les liens, en enregistrant ces choix uniquement sur votre appareil. Le site inclut également la configuration de votre appareil
    pour des aspects clairs ou sombres, un mode contraste élevé (couleurs forcées) et la réduction des mouvements.
  vision_title: Mauvaise vision, mauvaise couleur et confort de lecture
