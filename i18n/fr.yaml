    contre la rupture (envie, haine, éloignement, soupçon, médisance du frère). Les termes ambigus sont encadrés : akh ne compte qu’avec un possessif ou dans une annexion définie ; an akhihi dans un simple
    isnad ne compte pas sans autre mot de fraternité dans le passage ; iyada et tashmit ne comptent qu’en contexte de droits, hasad, ghiba et hajr qu’auprès d’un mot de fraternité. Les faux positifs vérifiés
    sont exclus par identifiant ; chaque livre dépouillé par la suite apporte automatiquement ses récits dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette
    ukhuwwa-browser. Les fratries sont tirées des relations sibling_of du graphe.'
