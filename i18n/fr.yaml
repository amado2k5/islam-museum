  method_title: "La méthode de l’explorateur"
  method_note: "Cet explorateur réunit les propos et écrits sur cinq sujets liés : testaments et conseils d’adieu, dernières heures, successions et biens laissés, reliques, inhumations et tombes. Les versets viennent d’une table vérifiée (testaments d’Abraham et de Jacob, conseils de Luqman, legs et héritage, reliques, mort et inhumation) ; leur texte est celui, figé, de Tanzil, jamais retapé. Les autres passages — hadith, sira, histoire, biographie — sont repérés à la génération du site par une liste de mots assortie de garde-fous : un livre dépouillé par la suite apparaît dès l’arrivée de son passage. Les extraits sont lus automatiquement depuis des numérisations, cités dans la limite de quarante mots et non corrigés. Les règles successorales générales des juristes ne sont pas réunies ici : seulement les successions de personnes nommées et les paroles du Prophète sur l’héritage. L’identification d’une tombe est toujours celle de la source citée, non du musée. Les sources sunnites forment le cadre ; tout autre point de vue est identifié."
