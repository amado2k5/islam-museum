      title: "Dans le Coran"
      desc: "Les versets sur la guérison, la maladie et la création : la guérison par le miel, les paroles d’Abraham sur sa guérison lorsqu’il est malade, les dispenses accordées aux malades pour le jeûne, la purification, le pèlerinage et le combat, la guérison de l’aveugle et du lépreux, les étapes de la création humaine, de la goutte à l’adhérence, au morceau de chair, aux os et à la chair, ainsi que la veine jugulaire, l’aorte, les côtes et le bout des doigts."
    sunnah:
      title: "Dans la sunna"
      desc: "Les récits du Livre de la médecine et du Livre des malades dans les deux Sahih, les Sunan et le Muwatta : un remède pour chaque maladie ; les ventouses, le miel et la cautérisation ; la nigelle, le costus, la talbina, les truffes et les dattes ajwa ; la ruqya ; la fièvre, la peste, la contagion et le lépreux ; la visite aux malades ; les soins aux blessés ; l’interdiction de se soigner par une substance interdite."
    seerah:
      title: "Dans la sira"
      desc: "Ce que rapportent les ouvrages de sira et de dala'il : les chapitres de médecine prophétique du Zad al-Ma'ad d’Ibn al-Qayyim, les récits de la maladie du Prophète, l’ouverture de la poitrine, la brebis empoisonnée à Khaybar et les soins aux blessés durant les expéditions — cette section s’enrichit à mesure que de nouveaux textes de sira sont intégrés."
    books:
      title: "Dans les autres livres"
      desc: "Les récits des Compagnons et des Successeurs sur les traitements, la maladie et la visite aux malades dans la Hilya, al-Isaba, Usd al-Ghaba, al-Isti'ab et Sifat al-Safwa ; les passages des classiques médicaux — le Canon d’Ibn Sina, al-Hawi d’al-Razi, le Commentaire sur l’anatomie du Canon d’Ibn al-Nafis ; les récits des ouvrages d’histoire, de fiqh, d’adab et de tafsir — classés selon le genre de l’ouvrage dès l’arrivée de ses passages."
    curated:
