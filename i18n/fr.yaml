  lede: "Les quatre imams — Abou Hanifa, Malik, al-Shafi'i et Ahmad — et les écoles qu’ils ont fondées, les premières générations et Successeurs sur lesquels repose le fiqh, les livres consignant les écoles — dont les manuels d’étude de l’Ajurrumiyya à la Jazariyya et à la Shatibiyya — et tout ce qu’en disent les livres sunnites en histoire, fatwas et questions juridiques — réunis avec leurs sources."
