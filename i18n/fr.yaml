ghayb:
  title: "Explorateur de l’invisible"
  lede: "Un parcours de l’invisible à travers les notices du musée : djinns et anges, âme, mesures du temps, Voyage nocturne et plus grandes créations, barzakh et ce qui suit la mort, grands signes de l’Heure — chaque notice cite ses sources, chaque thème ouvre sa propre page."
  badge: "Exploration de l’invisible"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée — sourcée, trilingue — regroupée par les étiquettes ghayb-browser et ghayb-<section> au sein du graphe commun, et non dans une table distincte. Position éditoriale : la révélation d’abord ; la science ne sert que d’analogie, jamais d’explication de l’invisible."
  api: "L’ensemble des données est disponible à l’adresse"
  sections_title: "Les sections de l’explorateur"
  filter_label: "Filtrer les thèmes"
  filter_none: "Aucun résultat correspondant."
  empty: "Cette version ne contient pas encore de notices sur l’invisible."
  sections:
    perception:
      title: "Les limites de la perception"
      desc: "Au-delà des sens : l’invisible absolu, les djinns et les anges, l’âme et la vision de Dieu."
    daily:
      title: "Les portes du quotidien"
      desc: "De petites portes entre le visible et l’invisible : les rêves, le mauvais œil, la sorcellerie et l’envie."
    time:
      title: "Le temps et ses mesures"
      desc: "Les mesures divines du temps : un jour comme mille ans, un jour comme cinquante mille ans et les Gens de la Caverne."
    heavens:
      title: "Le voyage des cieux"
      desc: "Le Voyage nocturne et l’Ascension, le Jujubier de la limite, les sept cieux et al-Bayt al-Ma'mur."
    miracles:
      title: "Miracles et signes"
      desc: "Les signes de Dieu parmi les peuples : les neuf signes de Moïse et la mer qui se fend, l’arche de Noé et le Déluge, le vent des Aad, le cri qui frappe les Thamud et le peuple de Loth."
    creations:
      title: "Les plus grandes créations invisibles"
      desc: "Le Trône, le Piédestal, la Table et le Calame — des créations auprès desquelles tout le reste paraît minuscule."
    barzakh:
      title: "Le barzakh et l’après-mort"
      desc: "La mort, la saisie de l’âme et le monde de la tombe — à partir des textes, non de l’imagination."
    signs:
      title: "Les signes de l’Heure"
      desc: "Les grands signes : le Dajjal, la descente de Jésus, Ya'juj et Ma'juj, le soleil se levant à l’ouest, et ce qui précède et suit."
  viz:
    title: "Les huit portes"
    note: "Les huit sections de l’explorateur sont représentées par huit portes, chacune contenant des liens vers ses notices. Choisissez le nom d’une porte pour découvrir le contenu de sa section."
    region: "Les huit sections de l’explorateur de l’invisible, chacune avec ses notices"
    count: "{n} notices"
    hint: "Choisissez le nom d’une porte pour lire sa description. Chaque notice à l’intérieur est un lien."
    close: "Fermer"
    go: "Aller à cette section"
    caption: "Ce qui est compté : les notices du musée étiquetées pour chaque section de cet explorateur. Ce regroupement est propre à l’explorateur ; chaque page de notice donne ses sources."
    ascent_title: "L’Ascension"
    ascent_note: "Les étapes du Voyage nocturne et de l’Ascension dans l’ordre de la notice du voyage, du point de départ vers le haut, suivies des concepts relatifs aux cieux répertoriés par l’explorateur."
    ascent_region: "Les étapes de l’Ascension en échelle, de bas en haut"
    ascent_stop: "Étape dans la notice du voyage"
