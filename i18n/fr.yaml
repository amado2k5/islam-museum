      nat: Avant du palais
      litha: Gencives
      dhalq: Bord de la langue
      shafa: Lèvres
      jawf: Bouche ouverte et hamza
maajim:
  title: Navigateur des dictionnaires
  lede: 'Les grands dictionnaires de la langue arabe et des sciences islamiques : qui a écrit chacun, quand, à partir de quels ouvrages antérieurs, comment il est classé et où on peut le lire.'
  badge: Explorateur des dictionnaires
  status: Cette version compte {n} dictionnaires en {s} sections. Chaque fiche cite ses sources ; lorsqu'une date ou un détail est discuté, la fiche le dit.
  method_title: La méthode du navigateur
  method_note: Chaque dictionnaire est une fiche ordinaire du musée, de la classe œuvre, avec son auteur lié, regroupée par les étiquettes maajim-browser et maajim-<section> dans le seul graphe, et non
    dans une table à part. Le texte d'un dictionnaire n'est montré ici que s'il provient d'une édition ancienne du domaine public que le musée a lui-même lue ; tous les autres dictionnaires sont décrits
    et renvoient à l'endroit où on peut les lire.
  api: Le jeu de données complet se trouve à
  sections_title: Les sections du navigateur
  empty: Aucune fiche de dictionnaire dans cette version pour l'instant.
  sections:
    general:
      title: Dictionnaires généraux de l'arabe
      desc: 'Lisan al-Arab, al-Qamus al-Muhit, al-Sihah et leurs semblables : les lexiques qui classent tout le vocabulaire arabe par racine.'
    quran:
      title: Vocabulaire du Coran
      desc: Dictionnaires des mots rares du Coran.
