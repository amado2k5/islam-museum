ahkam:
  title: 'Navigateur des statuts légaux : obligations, actes d''obéissance, actes recommandés, réprouvés et interdits, et péchés mineurs'
  lede: 'Un seul navigateur pour les degrés d''obligation : les obligations (fara''id), l''obligation individuelle (fard ''ayn) et l''obligation collective (fard kifaya), les actes d''obéissance, les actes
    obligatoires (wajibat), les actes recommandés (mustahabbat), les actes interdits (muharramat), les actes réprouvés (makruhat), les péchés mineurs, et ce qui reste de l''échelle, le permis et la dispense.
    Il rassemble chaque endroit où ces notions sont nommées dans le Coran, la Sunna, la sira, les rapports des Compagnons et des Successeurs, et les livres d''usul et de fiqh que le musée a moissonnés.
    Le musée décrit ce que disent les textes et les juristes ; il ne rend aucun avis juridique.'
  badge: Explorateur des degrés d'obligation
  status: Cette version contient {n} notices réparties en {s} sections, chacune citée à sa source.
  method_title: Comment fonctionne le navigateur
  method_note: 'Chaque notice ici est une notice ordinaire du musée, avec ses sources. Les versets du Coran proviennent d''une table revue des versets dont la formulation même porte un thème (« prescrit
    pour vous », « une obligation venant de Dieu », « obéissez à Dieu », « interdit pour vous », « nul grief contre vous ») ; le texte d''un verset est le texte figé de Tanzil dans sa notice. Tout autre
    passage est trouvé à la construction du site par une liste de mots surveillée, de sorte qu''un livre moissonné plus tard apparaît ici le jour où ses passages arrivent. Une interdiction nue (« il a interdit
    ») n''est pas classée : qu''il s''agisse d''interdiction ou de réprobation relève de la lecture d''un juriste, et un tel rapport n''est listé que lorsque sa propre formulation nomme le degré. Les extraits
    de livres numérisés sont lus par machine et non corrigés, et les traductions sont automatiques et pas encore lues par une personne. Là où les écoles divergent, comme sur la distinction hanafite entre
    fard et wajib, les notices le disent et nomment chaque avis.'
  api: Le jeu de données complet est disponible à l'adresse
  sections_title: Sections
  filter_label: Filtrer les notices
  filter_none: Aucun résultat correspondant.
  empty: Aucune notice sous ce thème dans cette version pour l'instant.
  sections:
    quran:
      title: Dans le Coran
      desc: 'Les versets dont la formulation porte un thème : ce qui est prescrit et ordonné, les ordres d''obéir à Dieu et à Son Messager, ce qui est dû par les pieux, le bien surérogatoire, ce qui est
        interdit, ce qui est détesté, les petites fautes, et les versets d''absence de grief, de permission et d''allègement.'
    sunnah:
      title: Dans la Sunna
      desc: 'Les hadiths des deux Sahih, des Sunan et du Muwatta : ce que Dieu a rendu obligatoire et ce que le Messager a ordonné, le surérogatoire à côté de l''obligatoire, « si je ne craignais de charger
        ma communauté », ce qui était réprouvé, les dispenses, les péchés tenus pour légers, et les remarques des juristes que portent les recueils.'
    seerah:
      title: Dans la sira
      desc: 'Ce que les livres de sira rapportent sur ces thèmes : l''enseignement donné aux délégations, les lettres sur l''aumône obligatoire, les premières obligations et l''allègement des autres.'
    books:
      title: Dans d'autres livres
      desc: Les livres d'usul al-fiqh qui définissent les degrés (la Risala d'al-Shafi'i, le Burhan d'al-Juwayni, le Mustasfa d'al-Ghazali, les Muwafaqat d'al-Shatibi, l'Irshad al-Fuhul d'al-Shawkani),
        les livres de fiqh des quatre écoles, les commentaires de hadiths, les rapports des Compagnons et des Successeurs, et tout ce qui sera moissonné ensuite.
    curated:
      title: Notices sur les degrés d'obligation
      desc: 'Les notices propres du musée sur ces thèmes : les cinq statuts ensemble, l''obligation et ses deux sortes, l''obéissance, l''obligatoire, le recommandé, l''interdit, le réprouvé, le permis,
        la dispense et les péchés mineurs.'
  topics:
    fard:
      title: Les obligations (al-furud)
      desc: 'Tout ce que les sources du musée désignent comme une obligation : ce que Dieu a rendu obligatoire, ce que Son Messager a ordonné, « prescrit pour vous », les fara''id, et le fard des juristes.'
      definition: 'Dans les livres d''usul, le fard est, pour la majorité, un autre nom du wajib : l''acte dont l''auteur est loué et dont celui qui l''omet est blâmé. Les Hanafites réservent fard à ce
        qu''établit une preuve décisive et wajib à ce qui repose sur une preuve probable.'
      scope: 'Sont listés ici : les textes qui emploient les mots fard, farida et fara''id, « Dieu a rendu obligatoire », « a rendu obligatoire à l''égard de » et « prescrit pour vous ». Les parts d''héritage
        (aussi appelées fara''id), une pension et une dot « fixée » sont exclues.'
    fard-ayn:
      title: L'obligation individuelle (fard 'ayn)
      desc: 'Tout ce que les sources du musée disent du devoir que chaque personne doit et que nul ne peut acquitter pour un autre : « une obligation pour tout musulman », « obligatoire pour tout adulte
        », et le fard ''ayn des juristes.'
      definition: 'Ce qui est demandé à chaque personne responsable en son nom propre, de sorte que l''accomplissement par l''un ne l''ôte pas à l''autre : les cinq prières, le jeûne, l''aumône, le pèlerinage
        pour qui en a les moyens.'
      scope: 'Sont listés ici : les textes qui emploient le terme, et ceux qui posent un devoir « sur tout musulman » ou « sur tout adulte ». Le Coran n''emploie pas le terme ; les versets de chaque acte
        se trouvent sous les obligations.'
    fard-kifaya:
      title: L'obligation collective (fard kifaya)
      desc: 'Tout ce que les sources du musée disent du devoir qui incombe à la communauté : lorsque certains l''accomplissent suffisamment, les autres sont quittes de tout blâme, et lorsque personne ne
        l''accomplit, tous sont en faute.'
      definition: 'Ce que le Législateur veut voir accompli sans égard à celui qui l''accomplit : la prière funéraire, le retour du salut, l''étude approfondie de la religion, le jihad lorsque le nombre
        suffisant se met en route. Al-Shafi''i l''expose dans la Risala à partir de deux versets.'
      scope: 'Sont listés ici : les textes qui emploient le terme ou énoncent sa règle (« lorsque certains l''accomplissent, elle tombe pour les autres »), et les deux versets dont al-Shafi''i la tire.'
    taat:
      title: Les actes d'obéissance (al-ta'at)
      desc: 'Tout ce que les sources du musée disent de l''obéissance à Dieu et à Son Messager et des actes d''obéissance : « obéissez à Dieu et obéissez au Messager », « qui m''obéit a obéi à Dieu », «
        pas d''obéissance dans la désobéissance ; l''obéissance n''est due que dans ce qui est convenable ».'
      definition: 'Les textes opposent l''obéissance à la désobéissance : « quiconque m''obéit a obéi à Dieu, et quiconque me désobéit a désobéi à Dieu », et en fixent la limite : « l''obéissance n''est
        due que dans ce qui est convenable ». Le navigateur la place au-dessus des deux degrés du faire, l''obligatoire et le recommandé.'
      scope: 'Sont listés ici : les textes qui ordonnent ou louent l''obéissance à Dieu et à Son Messager, et les textes qui nomment les actes d''obéissance. L''obéissance à ceux qui détiennent l''autorité
        (« écouter et obéir ») ne compte qu''accompagnée de l''un d''eux.'
    wajib:
      title: Les actes obligatoires (al-wajibat)
      desc: 'Tout ce que les sources du musée disent avec le mot wajib et ses verbes : « obligatoire pour », « dû par tout musulman », « si j''avais dit oui, cela serait devenu obligatoire », et le wujub
        des juristes.'
      definition: Le wajib est l'acte dont l'auteur est loué et dont celui qui l'omet est blâmé (al-Shawkani). Il se divise en déterminé et au choix, en étroit et large quant au temps, et en individuel
        et collectif.
      scope: 'Sont listés ici : les textes qui emploient wajib, wujub, « il est obligatoire de » et « un droit dû par ». « Le Paradis lui est devenu dû » et une vente « conclue » sont exclus.'
    mustahabb:
      title: Les actes recommandés (al-mustahabbat)
      desc: 'Tout ce que les sources du musée disent de ce qui est demandé sans être imposé : le mustahabb et le mandub, la nafila et l''acte surérogatoire, les sunnas confirmées, et ce que le Prophète
        n''a pas imposé par crainte de la difficulté.'
      definition: Le mandub est ce que le Législateur demande sans attacher de blâme à son abandon ; le faire vaut mieux que le laisser. Les juristes l'appellent sunna, mustahabb, nafl et tatawwu', le plus
        souvent dans un même sens.
      scope: 'Sont listés ici : les textes qui emploient ces mots, ceux qui disent qu''un acte est « non obligatoire », et « si je ne craignais de charger ma communauté ». La Sunna comme source du droit
        a ses propres notices.'
    haram:
      title: Les actes interdits (al-muharramat)
      desc: 'Tout ce que les sources du musée désignent comme interdit : « interdit pour vous », « Dieu a interdit », « il n''est pas licite », les muharramat et les choses sacrées de Dieu.'
      definition: Le haram, aussi appelé mahzur, est ce que le Législateur demande de laisser, avec l'avertissement d'un châtiment pour qui le fait.
      scope: 'Sont listés ici : les mêmes passages que le Navigateur Halal et Haram lit du côté de l''illicite, avec une seule liste de mots, pour que les deux ne se contredisent jamais. Le sanctuaire,
        l''état d''ihram et le nom propre Haram sont exclus. Un simple « il a interdit » n''est pas classé.'
    makruh:
      title: Les actes réprouvés (al-makruhat)
      desc: 'Tout ce que les sources du musée disent de ce qu''il vaut mieux laisser : le makruh et la karaha, « il avait coutume de réprouver », « Dieu a réprouvé pour vous », une interdiction « non rendue
        ferme », et ce que les juristes ont réprouvé.'
      definition: Le makruh est ce que le Législateur demande de laisser sans avertissement de châtiment ; le laisser vaut mieux que le faire. Al-Ghazali note que le mot s'emploie aussi pour l'interdit
        et pour l'abandon du mieux ; les Hanafites le divisent en ce qui est proche de l'interdit et ce qui n'est qu'un simple défaut.
      scope: 'Sont listés ici : les textes qui emploient makruh et karaha, et les rapports de réprobation habituelle. La répugnance comme sentiment (« qui déteste rencontrer Dieu »), la contrainte et les
        propositions en « de peur que » sont exclues.'
    saghair:
      title: Les péchés mineurs (sagha'ir al-dhunub)
      desc: 'Tout ce que les sources du musée disent des petits péchés : le lamam, les péchés tenus pour légers, ce que les prières et l''évitement des péchés majeurs expient, et la mise en garde contre
        l''obstination.'
      definition: Les péchés mineurs sont ceux qui sont en dessous des majeurs ; les juristes divergent sur la ligne qui les sépare. La notice du musée expose les définitions, et les péchés majeurs sont
        dans le Navigateur des hudud et des kaba'ir.
      scope: 'Sont listés ici : les textes qui nomment les petits péchés, le lamam et les péchés méprisés, et les textes sur ce qui est expié « tant que les péchés majeurs sont évités ». « Le petit et le
        grand » est exclu.'
    mubah:
      title: 'Et le reste : le permis et la dispense'
      desc: 'Ce qui reste de l''échelle : le mubah, la dispense (rukhsa) à côté de la règle d''origine (''azima), « nul grief », « il n''y a pas de mal à cela », et ce qui a été passé sous silence.'
      definition: 'Le mubah est l''acte pour lequel le Législateur laisse le choix : le faire et le laisser se valent, sans péché ni dans l''un ni dans l''autre. La rukhsa est un allègement accordé pour
        une excuse tandis que la raison de la règle d''origine subsiste.'
      scope: 'Sont listés ici : les textes qui emploient mubah, ibaha et rukhsa, « nul grief » et « il n''y a pas de mal à cela », et « ce sur quoi Il a gardé le silence est pardonné ». Le licite (halal)
        comme tel se trouve dans le Navigateur Halal et Haram.'
