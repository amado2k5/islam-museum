khutab:
  viz:
    title: "La frise du minbar"
    note: "Chaque marque représente un sermon, placé selon l’année hégirienne indiquée dans sa notice ; les marques se superposent lorsque les années sont proches, et leur forme et leur teinte indiquent le type de sermon. Une marque estompée correspond à une année approximative, tirée d’une tradition. Sélectionnez une marque pour découvrir qui a parlé et quand."
    legend_title: "Types de sermons"
    scroll_hint: "Faites défiler les années horizontalement."
    scroll_label: "Frise des sermons datés par année hégirienne, à défilement horizontal"
    group_label: "Sermons par année hégirienne"
    hint: "Pointez une marque, donnez-lui le focus ou touchez-la pour découvrir ici le sermon, son orateur et son année ; chaque marque mène à la page du sermon."
    open: "Ouvrir la page"
    undated_title: "Sermons sans année consignée"
    undated_note: "Ils ne figurent pas sur l’axe, car leur notice ne donne aucune année."
    voices_title: "Voix : les cycles de leçons par orateur"
    voices_note: "Chaque anneau représente un orateur ; sa surface est proportionnelle au nombre de cycles de leçons de cet orateur conservés au musée. Ce décompte porte sur les {n} notices de cycles du musée, et non sur l’ampleur de l’enseignement d’un orateur ni sur son audience. Un anneau mène à ses cycles dans la liste ci-dessous."
    series_n: "{n} cycles"
  title: "Explorateur des sermons et des leçons"
  lede: "Des sermons historiques tirés des recueils de khutab et des cycles de leçons enregistrées, chacun relié à son texte et à sa source."
  sermons: "Sermons historiques"
  series: "Cycles de leçons enregistrées"
  empty: "Aucune notice pour le moment."
  count: "{n} notices"
  what_title: "De quoi s’agit-il ?"
  what: "Une khutba est un sermon prononcé depuis le minbar, le vendredi, lors des deux Aïds ou à une occasion particulière ; un dars est une leçon, et un cycle porte sur un livre ou un thème enseigné en plusieurs séances. Chaque notice présente les paroles d’un orateur adressées à son propre auditoire, en un temps et un lieu donnés."
  notice: "Le musée décrit les propos tenus et les attribue à leurs auteurs ; il ne prêche pas et ne prononce aucun avis juridique. Ce qui convenait à un contexte peut ne pas convenir à un autre ; les points de vue d’un orateur ou d’un cycle sont présentés comme les leurs."
  sermons_note: "Dans l’ordre de l’année de composition ou de prononciation de chaque sermon (année hégirienne accompagnée de l’année grégorienne). La mention « date de mise en ligne » indique la publication d’un enregistrement, et non la date du sermon."
  series_note: "Regroupés par orateur ({n} orateurs). Ouvrez la rubrique d’un orateur pour voir ses cycles."
  speaker: "Orateur"
  speaker_page: "Ouvrir la page de l’orateur"
  unattributed: "Orateur non renseigné"
  contested: "contenu controversé, décrit sans être approuvé"
  date: "{h} H / {g} ap. J.-C."
  uploaded: "date de mise en ligne"
  fatwa_link: "Explorateur des fatwas"
  api_link: "Données (JSON)"
