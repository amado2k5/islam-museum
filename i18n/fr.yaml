    note: Les livres d'usul al-fiqh divisent en cinq ce que le Législateur dit d'un acte. Une demande d'agir est l'obligatoire lorsque l'omettre est blâmé et le recommandé lorsqu'il ne l'est pas ; une demande
      de laisser est l'interdit lorsque le faire est blâmé et le réprouvé lorsqu'il ne l'est pas ; et là où il y a choix, l'acte est permis. Les thèmes du navigateur se tiennent sur le degré auquel ils
      appartiennent, avec le nombre de notices de chacun ; l'obéissance couvre les deux degrés de l'action, et les péchés mineurs appartiennent au côté de l'abstention.
