juha:
  title: Navigateur de Juha et du folklore islamique
  full_title: Navigateur de Juha, du folklore islamique à travers les âges, de la comédie, des blagues, des traits d’esprit et des anecdotes
  lede: 'Tout ce que le musée conserve sur Juha et le folklore islamique à travers les âges, la comédie, les blagues, les traits d''esprit et les anecdotes : les versets du Coran sur le rire, le sourire
    et l''interdiction de la moquerie ; la plaisanterie et le rire du Prophète et les limites de la plaisanterie dans la Sunna ; l''enjouement des Compagnons et des Successeurs dans la sîra et les biographies
    ; les anecdotes de Juha une à une ; et les récits des beaux esprits, des sots, des avares et des pique-assiettes dans les livres d''adab et d''histoire.'
  badge: Le cercle des anecdotes
  status: Cette version contient {n} notices dans {s} sections ; les textes sont des brouillons que le lecteur peut vérifier dans les sources nommées sur chaque notice.
  method_title: La méthode du navigateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et son texte en cinq langues. Les passages sont repérés à la génération du site par un détecteur assorti de garde-fous qui
    lit le texte des passages : le nom de Juha comme mot entier, les beaux esprits nommés tels Ash''ab, Nu''ayman, Muzabbid et Habannaqa, les mots de l''anecdote et du trait d''esprit, les verbes de la
    plaisanterie et du badinage, les mots du rire et du sourire, et les textes sur l''éthique de la plaisanterie. Restent dehors le « cas rare » des juristes, le titre al-Nawadir wa-l-Ziyadat, « le clin
    d''œil », les noms al-Dahhak et Ibn Mughaffal et l''adverbe des grammairiens. Chaque livre dépouillé par la suite apporte automatiquement ses passages le jour où ils entrent dans le graphe, et les notices
    rédigées les rejoignent par l''étiquette juha-browser. Les anecdotes de Juha sont racontées dans les mots du musée d''après une numérisation lue par machine, et les traductions sont des traductions
    automatiques qu''aucun humain n''a relues.'
