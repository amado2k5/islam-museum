    how_title: "Comment un sujet est attribué à une notice"
    how: "Les sujets sont attribués à la génération du site par une liste de mots appliquée à chaque passage : aliments, boissons, ventes, mariage et autres. Un passage peut relever de plusieurs sujets. La liste peut manquer un passage ou en inclure un où le mot n’apparaît qu’incidemment ; ceux sans correspondance figurent dans « Autres mentions ». Le sujet indique de quoi parle la source, jamais un avis juridique."
