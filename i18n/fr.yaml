cosmos:
  title: "Explorateur du cosmos : êtres, peuples anciens et secrets de l’univers"
  lede: "Tout ce que les sources du musée disent de ce qui dépasse l’histoire humaine connue : créatures que Dieu a dispersées dans les cieux comme sur terre selon le Coran, sept cieux et terres semblables, habitants de la terre avant Adam, peuples disparus, peuple derrière la barrière, secrets du cosmos — Trône, Table, Jujubier et clés de l’invisible. Chaque verset, récit et passage de livre est référencé ; chaque point de vue est identifié."
