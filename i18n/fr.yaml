  title: "Explorateur des testaments : derniers conseils des prophètes, califes, Compagnons, Successeurs, imams et justes, leurs héritages, reliques et sépultures"
  lede: "Tout ce que les sources du musée disent des adieux des prophètes et messagers, des califes, des Compagnons, des Successeurs, des imams et des justes : recommandations aux survivants, paroles des dernières heures, biens laissés, objets conservés après eux et lieux d’inhumation selon les livres. Chaque élément est un verset, un récit ou une notice avec sa source."
