sport:
  trio_label: 'Le trio prophétique : équitation, natation, tir à l’arc'
  title: Explorateur des sports et compétitions dans l’Islam
  lede: 'Sport et compétition dans les sources du musée : équitation, natation et tir à l’arc — trio des récits d’entraînement — lutte et force, courses et concours avec enjeux, jeu de lances des Abyssins,
    jeux de balle et de plateau, chasse sportive et sport moderne — dans le Coran, les deux Sahihs, le Muwatta, les Sunan, la sira, les récits des Compagnons et des Successeurs et chaque livre dépouillé.
    Des notices sourcées qui s’enrichissent avec chaque nouveau texte.'
  badge: Exploration des sports
  status: Cette version contient {n} notices en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: Fonctionnement de cet explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée avec ses sources. Les mentions sportives sont repérées à la génération du site par un lexique assorti de garde-fous en huit familles : chevaux
    et équitation ⁦(خيل، فرس، فروسية)⁩, tir à l’arc ⁦(رمي، نصل، سهم، قوس)⁩, natation ⁦(سباحة، يسبح، عوم)⁩, lutte et force ⁦(مصارعة، صارع، إشالة)⁩, courses et enjeux ⁦(سباق، محلل، مزمل، سبق)⁩, jeux ⁦(حراب،
    كرة، صولجان، شطرنج، نرد)⁩, chasse sportive ⁦(صيد، جوارح، باز، قنص)⁩, sport nommé comme tel ⁦(رياضة، أولمبي، بطولة)⁩. Les termes ambigus sont encadrés : « سبق » seulement près du vocabulaire des courses,
    « صيد » de la chasse, « رمي » des flèches (jet des pierres exclu), « يسبح » de l’eau, « صرع » de la lutte ; les faux positifs vérifiés sont écartés par identifiant. Chaque livre dépouillé par la suite
    apporte automatiquement ses mentions sportives ; les sports nommés ont leurs propres notices et les sportifs sont lus dans les blocs sports du graphe.'
