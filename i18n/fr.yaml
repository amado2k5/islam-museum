        avant l’interrogatoire, les sept abrités sous Son ombre, le Bassin et le Sirat, et les paroles des Compagnons et des Successeurs sur le Jour.'
    seerah:
      title: Dans la sira
      desc: Ce que les ouvrages de sira et d’histoire rapportent de la Résurrection, du rassemblement et de la reddition des comptes — cette section s’enrichit à mesure que de nouveaux passages de sira
        sont intégrés.
    books:
      title: Dans les livres dépouillés
      desc: Les mentions de la Résurrection dans tous les autres ouvrages dépouillés — croyance, exégèse, histoire, poésie et les ouvrages à venir — classées selon le genre de l’ouvrage dès l’arrivée de
        ses passages.
    curated:
      title: Notices thématiques
      desc: Les notices du musée sur le Jour et ses étapes — la Trompe, le relèvement, le rassemblement, la comparution, les registres, les comptes, la Balance, la réparation, l’Ombre, le Bassin, l’intercession
        et le Sirat — réunies grâce à l’étiquette qiyama-browser.
tibb:
  title: 'Explorateur de la médecine : médecine prophétique, médecine, anatomie, chirurgie, remèdes et soins en islam'
  lede: 'Tout ce qui est dit et écrit sur la médecine prophétique, la médecine, l’anatomie, la chirurgie, les remèdes et le recours aux soins dans les sources du musée : les versets sur la guérison, la
    maladie et les étapes de la création humaine dans le Coran ; les récits du Livre de la médecine et du Livre des malades dans les deux Sahih, les Sunan et le Muwatta ; les chapitres de médecine prophétique
    du Zad al-Ma''ad ; les récits des Compagnons et des Successeurs sur les traitements, les soins aux blessés et la visite aux malades ; les passages du Canon d’Ibn Sina, d’al-Hawi d’al-Razi et du Commentaire
    sur l’anatomie du Canon d’Ibn al-Nafis ; les notices de médecins, d’hôpitaux, de livres médicaux, de remèdes et d’avis juridiques — des notices sourcées qui s’enrichissent à mesure que de nouveaux textes
    sont intégrés.'
  badge: Exploration de la médecine en islam
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les textes médicaux sont repérés à la génération du site grâce à un lexique assorti de garde-fous
    appliqué aux passages, selon les six thèmes du titre : médecine prophétique (ventouses, cautérisation, ruqya, miel, nigelle, costus, séné, talbina, truffes, dattes ajwa, ithmid, ladud et sa''ut) ; médecine
    (médecin, maladie et malades, douleur, fièvre, peste et épidémie, contagion, lèpre, maladies nommées, visite aux malades, hôpital) ; anatomie (goutte, adhérence et morceau de chair ; veine jugulaire,
    aorte et vaisseaux ; articulations ; organes) ; chirurgie (soins d’une plaie, cautérisation d’un vaisseau, saignée, circoncision, attelles, réduction des fractures) ; remèdes (remède et maladie, poison
    et antidote, simples) ; soins (recours aux soins et à la guérison, guérison, traitement par une substance interdite). Les mots ambigus sont encadrés : l’expression de la maladie dans les cœurs est écartée
    ; al-humma ne compte qu’au sens de fièvre, jamais de pâturage protégé ; al-qust uniquement dans les expressions désignant le remède, jamais la justice ; asal et ajwa uniquement au voisinage d’un terme
    médical ; l’expression du chas de l’aiguille est écartée ; les mots désignant les blessures ne comptent qu’en contexte de soins, jamais d’indemnisation juridique ; hors du Coran et des récits de hadiths,
    marad ou shifa isolés ne suffisent pas. Chaque livre dépouillé par la suite apporte automatiquement ses textes médicaux dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent
    grâce à l’étiquette tibb-browser accompagnée de celle de leur thème. Le musée décrit les propos des sources et les attribue à leurs auteurs ; il ne donne aucun conseil médical ni avis juridique.'
