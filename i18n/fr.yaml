i3lam:
  title: "Explorateur des acteurs musulmans de la communication"
  lede: "Toutes les mentions de ceux qui ont porté la parole — du muezzin appelant à la prière au crieur des marchés, du khatib au minbar au porte-parole du calife et à l’envoyé du Prophète, du scribe de la révélation et de la chancellerie au journaliste de la nouvelle presse, au présentateur et à l’influenceur, au réformateur et au révolutionnaire — dans le Coran, la sunna, la sira, les récits des Compagnons et des Successeurs et tous les livres dépouillés par le musée, présents et futurs."
  badge: "Exploration des acteurs de la communication"
  status: "Cette version contient {n} personnes dans {j} rôles de communication et {f} passages les mentionnant dans {s} corpus ; les textes restent des brouillons jusqu’à leur lecture par une personne."
  method_title: "Fonctionnement de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée avec ses sources et sa prose trilingue. Une personne rejoint un rôle uniquement par une entrée occupations de sa propre notice : rien n’est déduit. Un passage entre dans le flux si le graphe consigne déjà une relation mentions vers une de ces personnes ou un métier de communication, ou s’il porte l’étiquette i3lam-browser. Une mention d’un livre dépouillé par la suite apparaît dès l’arrivée du passage, sans modification de cette page. Chaque passage indique son corpus (Coran / sunna / sira / livres)."
  requirements: "La demande initiale et les critères d’acceptation de cet explorateur sont consignés à l’adresse"
  wire_title: "Le fil — du minaret au flux"
  wire_aria: "Schéma de la chaîne de communication : chaque rôle est une station sur une ligne de transmission, son anneau dimensionné selon le nombre de personnes consignées."
  wire_note: "Chaque anneau est une station ; son rayon suit le nombre de personnes consignées : l’appel du muezzin devient cri public, sermon, parole de l’envoyé, page du scribe, presse, diffusion et révolte."
  holders: "{n} personnes consignées"
  quran_title: "Dans le Coran"
  quran_note: "Les ancrages fixes du périmètre dans le texte révélé — présentés par référence au passage figé, jamais retapés."
  anchors:
    poets: "Les poètes et ceux qui les suivent dans l’égarement — premier verset sur les détenteurs d’une audience, avec l’exception des croyants qui avertissent."
    news: "La diffusion des nouvelles de sécurité ou de crainte — la règle coranique du traitement d’une information avant sa propagation."
    adhan: "L’interdiction de tourner l’appel à la prière en dérision et en jeu — le verset liant l’appel du muezzin au sacré."
    jumua: "L’appel du jour du rassemblement, l’abandon du commerce pour l’évocation — la convocation qui fonde l’heure du khatib."
    herald: "L’envoi comme témoin, annonciateur et avertisseur — la mission prophétique dont s’inspirent ensuite crieurs et porte-parole."
    proclamation: "La proclamation de Dieu et de son Messager aux gens le jour du grand pèlerinage — modèle de l’annonce publique."
    caller: "L’appelant et les auditeurs : scène coranique d’une voix portant un message à la foule."
  chain_title: "Les acteurs de la communication — ceux qui ont porté la parole"
  chain_note: "Chaque rôle est une notice de métier du musée ; chaque carte, une personne dont la notice comporte l’entrée occupations correspondante, classée par date lorsque le graphe la connaît."
  mentioned_in: "mentionné dans {n} passages"
  no_holders: "Aucune personne consignée dans cette version pour le moment."
  state_title: "L’État prend la parole"
  state_note: "Les fonctions servies par la chaîne : califes, sultans et rois dont porte-parole, crieurs et envoyés portaient la parole, vizirs, juges, gouverneurs et maîtres des postes par lesquels l’État s’adressait aux sujets. Ce sont les voix de l’institution ; la chaîne ci-dessus en est le moyen de communication."
  feed_title: "Toutes les mentions dans les sources"
  feed_note: "Chaque passage déjà relié par le graphe à un acteur ou métier de communication, classé par corpus — ce flux s’enrichit dès l’arrivée des passages d’un nouveau livre ou de l’étiquette i3lam-browser sur une notice."
  feed_more: "et {n} autres dans ce corpus."
  feed_empty: "Aucun passage de mention dans cette version pour le moment — ils apparaîtront avec les livres dépouillés."
  corpora:
    quran: { title: "Coran", note: "Le texte figé de Tanzil, accessible uniquement par référence au passage." }
    sunnah: { title: "Sunna", note: "Récits des recueils de hadiths." }
    seerah: { title: "Sira", note: "Récits des ouvrages de sira et de maghazi." }
    books: { title: "Autres livres", note: "Tous les autres livres dépouillés du corpus." }
  tagged_title: "Notices étiquetées pour cet explorateur"
  tagged_note: "Toute notice portant l’étiquette i3lam-browser entre automatiquement ici — c’est ainsi que les futurs dépouillements apparaissent."
heroes:
  title: "Héros de l’Islam"
  lede: "Des femmes et des hommes qui ont donné beaucoup et dépassé leurs intérêts pour autrui : six salles de vertus, quatre héros dans chacune, chaque récit avec sa source."
  status: "Héros dans ces salles : {n} sur {trails} chemins. Chaque nom ouvre la notice du héros ; chaque salle ouvre son récit complet."
  trail_link: "Parcourir le récit complet de la salle ({n} héros)"
  record_link: "Ouvrir la notice"
  note_title: "À propos de ces salles"
  note_body: "Ces héros sont des personnes aux engagements documentés, non des icônes idéalisées : chaque récit figure dans sa notice avec sa source ; les divergences sont signalées dans les notes de recherche. Les salles s’enrichissent à mesure que les récits sont complétés au musée."
  virtues:
    sacrifice: { name: "Salle du sacrifice", lede: "Ils ont donné leur personne et leur tranquillité pour des inconnus : la première martyre, le porte-étendard, le bouclier d’Uhud et le chef face aux lances." }
    courage: { name: "Salle du courage", lede: "Une fermeté mesurée où cœur et pas avancent ensemble : le chevalier du lit, l’épée des champs de bataille, le chevalier de Hattin et le cheikh du désert." }
    mercy: { name: "Salle de la miséricorde", lede: "La miséricorde comme force : le prédicateur des cœurs, la mère des captifs, le sultan de la maison de justice et l’exilé protégeant ses voisins." }
    generosity: { name: "Salle de la générosité", lede: "Une fortune entière au service du bien commun : caravanes d’Abd al-Rahman, puits d’Othman, richesse de Khadija et fondation de Fatima." }
    knowledge: { name: "Salle du savoir", lede: "Ils ont porté le savoir comme un dépôt et l’ont payé de leur vie : le fondateur de la théorie juridique, le ferme face à l’inquisition, le savant de Bassora et la langue de vérité." }
    steadfastness: { name: "Salle de la constance", lede: "Le monde tremblait, eux ne bougeaient pas : « Un, Un » sous le rocher, le plus long chemin vers la vérité, le jour où la communauté trembla et la parole sans peur." }
juha:
  title: "Navigateur de Juha et du folklore islamique"
  full_title: "Navigateur de Juha, du folklore islamique à travers les âges, de la comédie, des blagues, des traits d’esprit et des anecdotes"
  lede: "Tout ce que le musée conserve sur Juha et le folklore islamique à travers les âges, la comédie, les blagues, les traits d'esprit et les anecdotes : les versets du Coran sur le rire, le sourire et l'interdiction de la moquerie ; la plaisanterie et le rire du Prophète et les limites de la plaisanterie dans la Sunna ; l'enjouement des Compagnons et des Successeurs dans la sîra et les biographies ; les anecdotes de Juha une à une ; et les récits des beaux esprits, des sots, des avares et des pique-assiettes dans les livres d'adab et d'histoire."
  badge: "Le cercle des anecdotes"
  status: "Cette version contient {n} notices dans {s} sections ; les textes sont des brouillons que le lecteur peut vérifier dans les sources nommées sur chaque notice."
  method_title: "La méthode du navigateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et son texte en cinq langues. Les passages sont repérés à la génération du site par un détecteur assorti de garde-fous qui lit le texte des passages : le nom de Juha comme mot entier, les beaux esprits nommés tels Ash'ab, Nu'ayman, Muzabbid et Habannaqa, les mots de l'anecdote et du trait d'esprit, les verbes de la plaisanterie et du badinage, les mots du rire et du sourire, et les textes sur l'éthique de la plaisanterie. Restent dehors le « cas rare » des juristes, le titre al-Nawadir wa-l-Ziyadat, « le clin d'œil », les noms al-Dahhak et Ibn Mughaffal et l'adverbe des grammairiens. Chaque livre dépouillé par la suite apporte automatiquement ses passages le jour où ils entrent dans le graphe, et les notices rédigées les rejoignent par l'étiquette juha-browser. Les anecdotes de Juha sont racontées dans les mots du musée d'après une numérisation lue par machine, et les traductions sont des traductions automatiques qu'aucun humain n'a relues."
  api: "L'ensemble est disponible à"
  sections_title: "Les sections du navigateur"
  kinds_title: "Genre d'humour"
  all_kinds: "Tous les genres"
  filter_label: "Chercher dans les anecdotes"
