hasanat:
  title: Explorateur des bonnes actions
  lede: 'Chaque mention des bonnes actions (al-hasanat) dans les sources du musée : les versets sur leur inscription, leur multiplication et leur effacement, les hadiths sur l’enregistrement des intentions
    et des actes, le beau prêt à Dieu, la bonne intercession et la récompense al-husna, chaque mention dans la sira, les récits, les traditions des Compagnons et des Successeurs et chaque livre dépouillé
    — des notices sourcées qui s’enrichissent avec les nouveaux textes.'
  badge: Exploration des bonnes actions
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les mentions sont repérées à la génération du site par un lexique assorti de garde-fous :
    al-hasanat, hasanat, al-hasana, hasana, al-husna sous conditions (emplois des noms divins exclus), expressions fixes du beau prêt et du bien substitué au mal. Hasan et al-Hasan isolés (noms propres,
    degré de hadith), l’adverbe hasanan et hasana adjectif féminin rattaché à un nom sont écartés ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement
    ses mentions dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette hasanat-browser. Chaque passage porte le type hasanat, hasana ou husna selon le terme dominant.'
