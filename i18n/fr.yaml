halal:
  title: Explorateur du licite et de l’illicite
  lede: 'Chaque mention du licite et de l’illicite dans les sources du musée : les versets d’autorisation et d’interdiction d’al-Baqara, al-Ma''ida, al-An''am, al-A''raf et al-Nahl ; les hadiths sur leur
    clarté, l’interdiction de tout enivrant et ce qui n’est pas permis au musulman dans les deux Sahih, le Muwatta et les Sunan ; la prudence face à l’illicite et la recherche de gains licites dans la sira
    et les récits des Compagnons et des Successeurs ; les juristes sur le permis et l’interdit ; chaque mention dans les livres dépouillés à l’avenir. Le musée décrit les sources et attribue chaque avis
    à son auteur ; il ne prononce aucun avis juridique.'
  badge: Exploration du licite et de l’illicite
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: Comment fonctionne cet explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les mentions sont repérées à la génération du site par un lexique assorti de garde-fous :
    halal et haram dans leurs formes ; verbe de permission avec son auteur ou bénéficiaire (Dieu permet, permission accordée, ce qui n’est pas permis à une personne) ; verbe d’interdiction avec son auteur
    ou destinataire (Dieu interdit, ce qui est interdit aux destinataires) ; tahrim, muharramat, maharim Allah et istihlal. Les verbes isolés et les mots voisins — tayyibat, khaba''ith, shubuhat, mubah,
    makruh — ne comptent qu’auprès d’un terme fort. Sont retirés avant détection : Mosquée sacrée, Maison sacrée, mois sacré, nom propre Haram, état d’ihram et sortie de cet état, protection divine contre
    le Feu. Chaque livre dépouillé par la suite apporte ses mentions dès l’arrivée de ses passages, sans étiquetage préalable. En cas de désaccord des juristes, chaque avis est attribué à son auteur, sans
    choix du musée.'
