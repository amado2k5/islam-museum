  launchgood_body: Une campagne de collecte de fonds sur LaunchGood pour aider à construire le premier musée numérique islamique à vocation ouverte.
  launchgood_cta: Soutenez la campagne sur LaunchGood
  launchgood_title: حملة LaunchGood
  lede: Ce musée est gratuit et ouvert, sans publicité ni suivi. Si cela vous profite, votre soutien le maintient ainsi et contribue à la croissance plus rapide.
  note: Le soutien est optionnel — fourni selon le souhait du propriétaire, sans obligation ni obligation — et ne confère aucune autorité sur le contenu, la critique ou l'orientation du musée. Le travail
    éditorial est indépendant, et le programme est publié.
  other_body: Si l'abonnement mensuel ne vous convient pas, vous pouvez contribuer avec du code, des avis, des traductions, ou partager le musée entre vos connaissances.
  other_title: Autres façons de contribuer
  patreon_body: Un abonnement mensuel optionnel aide à maintenir cette activité en activité et vous permet d'en suivre l'avancement.
  patreon_cta: Accédez à la page Patreon
  patreon_title: Rejoignez-vous via Patreon
  paypal_body: Un don unique via PayPal, sans abonnement.
  paypal_cta: Faites un don via PayPal
  paypal_title: Don unique
  raisely_body: La page dédiée aux dons du musée sur la plateforme Raisely — faites un don une fois ou une fois par mois, dans votre monnaie locale, pour financer les coûts d'hébergement et de fonctionnement.
  raisely_cta: Faites un don via Raisely
  raisely_title: Page des dons sur Raisely
  share: Partagé par le musée
  shop_body: À l'avenir, le musée prévoit une boutique de souvenirs/bazar en ligne dans sa section distincte de ce site, où les marchandises sont exposées et vendues à quiconque souhaite y parcourir ou
    faire ses achats, afin d'aider à couvrir les frais d'exploitation. Ce sera exempt de publicités, de spam ou de mendicité, et les visites seront toujours optionnelles. C'est un plan — aucun magasin n'est
    ouvert aujourd'hui — et le musée lui-même est gratuit pour tout le monde et le restera.
  shop_title: Boutique de souvenirs futuriste
  title: Soutenez le musée
  ways_title: Méthodes de soutien
  why_body: 'Gratuit pour tous — mais pas gratuit pour son fondateur. Le musée est gratuit pour quiconque le visite — pas de comptes, pas de publicités, pas de suivi, pas de paywall — et son fondateur le
    paie mois après mois. Ses coûts d''exploitation au cours d''un mois récent ont atteint environ 1 900 dollars canadiens. La plus grande part, environ 900 dollars canadiens, a été attribuée aux assistants
    IA — Claude, ChatGPT, Devin, Grok, Google AI Tools, et Muse, l''agent personnel qui coordonne le travail des autres agents — utilisés pour rechercher, formuler, traduire et vérifier les documents par
    rapport à leurs sources vérifiées. La génération vidéo via Runway, Artlist et Veo produit les films du musée, ElevenLabs les narre en arabe, anglais, ourdou, français, espagnol, turc et indonésien,
    et GitHub héberge le code. Cloudflare, à environ 90 dollars canadiens par mois, maintient les {pages} une page de journal rapide et sécurisée, ainsi que l''hébergement et le stockage, et l''enregistrement
    des noms de domaine conserve les noms du musée comme les siens. Même les forfaits les plus performants — Claude Ultra et Devin Max — se vendent avant la fin du mois : en octobre et début novembre, les
    frais d''utilisation supplémentaires et de facturation automatique ont ajouté environ 730 dollars canadiens en plus des abonnements. L''utilisation est mesurée et enregistrée, non estimée : Copilot
    Max a utilisé 18 525 crédits sur 20 000 crédits IA mensuels sur cinq jours, la part hebdomadaire de Devin a atteint 100 % pendant deux semaines consécutives, et Claude Ultra a atteint 84 % de sa part
    hebdomadaire avec des jours restants pour le renouvellement. Ce sont des coûts d''exploitation mensuels, pas des chiffres annuels. Chaque contribution que vous faites lui va directement — et vous n''achetez
    rien : pas d''accès, pas de biens, aucune opinion sur le contenu. Le musée lui-même est libre : n''importe qui peut télécharger son code CC0 et MIT et le lancer localement, créer un gabarit dessus,
    ou utiliser son interface de programmation publique — gratuitement, pour n''importe qui.'
  why_title: Pourquoi nous soutenir ?
