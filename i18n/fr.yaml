  lede: "Chaque mention de correspondance dans les sources du musée : lettres du Prophète aux rois et empereurs et lettres, réponses et rapports reçus, lettres des califes aux gouverneurs et rapports qui leur étaient adressés, lettre de Salomon à la reine de Saba dans le Coran, chaque mention dans la sira, les recueils de hadiths et chaque livre dépouillé — des notices sourcées qui s’enrichissent avec les nouveaux textes."
