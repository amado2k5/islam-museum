method:
  ages_body: 'Les entrées portent des étiquettes de sensibilité, et les étiquettes sont fonctionnelles. Les reliques et objets sacrés sont exposés avec respect et description. La violence, la guerre et
    la persécution sont consignées comme une histoire solide, avec des chiffres de victimes documentés et largement mentionnés, et sans images pratiquement choquantes. Les documents polémiques sont décrits
    et cités, non reproduits ni exposés. Les enfants disposent de deux protections : une section pour enfants dissimulant les documents étiquetés comme violents, à contenu adulte, contestés ou controversés,
    et une section pour enfants destinée aux enfants de quatre à douze ans avec des règles plus strictes — niveaux de lecture selon la tranche d''âge, sans langage intimidant, sans détails choquants, sans
    embarras, et rien d''obligatoire. Les sujets contestés ne pénètrent pas du tout dans le parcours des enfants, et le contenu pour enfants est construit uniquement à partir de matériaux explicitement
    étiquetés — jamais en diluant les pages adultes.'
  ages_title: Âges et allergies
  charter_body: 'Ce musée a été créé pour construire un seul graphe de connaissances pour l''ensemble de la nation islamique, et ce site — ses ailes, ses chronologies, ses cartes et ses découvertes — est
    une application pour afficher ce dessin, pas la fondation. La matière première est le contenu d''un à deux mille livres islamiques fondamentaux et célèbres, lus par l''intelligence artificielle page
    par page : Quelqu''un a-t-il mentionné ici, et qui est-il ? Et avons-nous cette personne issue d''un autre livre — afin que son entrée s''élargisse — ou est-ce qu''elle est nouvelle ? Où il était, qui
    était avec lui, ce qu''il a dit (et ses déclarations sont conservées dans leur texte), que s''est-il passé, dans quel contexte et sous quel sujet ? Ce n''est qu''alors que les règles de classification
    s''appliquent, y compris si la personne, le roman ou le livre est sunnite ou non. Jusqu''à présent, seulement environ un à un pour cent et demi des mille premiers livres ont été fouillés, et cela seul
    a produit plus de 160 000 pages contenant des personnes, des lieux, des événements et des citations en texte intégral — le progrès se mesure par les livres, pas par le nombre de pages. Les images générées
    par l''IA sont dans le même ordre : le modèle reçoit ce que le dessin cognitif sait et on lui demande de dessiner son imagination ; l''image est la lecture du dessin par le modèle, jamais une représentation
    de son sujet, et elle nous montre à quel point cette lecture est éloignée de la réalité. La charte elle-même, selon les mots du fondateur du 8 novembre 2026, ouvre les documents du plan du musée dans
    son stockage public. Son objectif, selon les mots du fondateur, est que l''islam — avec tout son peuple, ses événements et ses lieux — soit accessible à tous sous une forme lue par adultes et enfants,
    Arabes et non-arabes, musulmans et non-musulmans, et que chacun puisse façonner le dessin sous n''importe quelle forme ou application adaptée à ses habitants, en particulier aux écoles, universités
    et cercles d''étude : le dessin est le pont vers la connaissance qui ne peut être atteinte qu''en lisant de nombreux livres, en vivant longtemps, et en revivant les sciences religieuses pour cette époque
    et l''avenir.'
  charter_title: 'Charte du fondateur : Dessiner la connaissance d''abord'
  choose_1: 'La couverture est guidée par les lacunes. Un programme de couverture continue mesure ce qui manque au musée — des régions entières, des siècles et des groupes de personnes — publie publiquement
    la carte des lacunes et travaille sur elle étape par étape. Les lacunes sont mises en valeur plutôt que cachées. Le travail lui-même se déroule dans des parcours : un document écrit de chemin prouvant
    la portée d''un seul champ, ses règles sources et sa liste, et les constructeurs travaillent sur la liste en vagues, ligne par ligne.'
  choose_2: 'Personne n''est dépassé dans une liste. Chaque canal de la collection liste produit un enregistrement de son propriétaire, et chaque entrée dans une œuvre de référence que le musée fouille
    est lue et devient un document, enrichit un document existant ou l''enregistre avec la raison de son non-utilisation. Lorsque les preuves sont maigres, le registre est concis et honnête — plus court,
    jamais rempli ni fabriqué. En termes clairs, qu''est-ce qui mérite une place : une personne dotée d''une documentation historique via des sources — et une personnalité publique moderne dont l''influence
    se fait par les médias : une présence générale soutenue d''environ cent mille musulmans pour les hommes ou cinquante mille pour les femmes sur leurs propres plateformes, avec une activité au cours des
    deux dernières années, sans qu''aucun canal d''agrégation ne soit jamais compté ; un lieu, un événement, une chose, une œuvre, une idée ou une pratique liée par des sources à l''histoire ; un groupe
    ou une récompense documentée dans des sources que les lecteurs peuvent vérifier ; une invention documentée dans son premier texte, brevet ou étude spécialisée ; et les listes populaires sont traitées
    comme des preuves de recherche, non comme des preuves. Les groupes de référence travaillent régulièrement : l''Encyclopédie islamique en tant qu''entrée, les principaux ouvrages biographiques individuellement,
    et une liste des livres les plus importants livre par livre.'
  choose_title: Comment choisir
  classify_1: 'Chaque affirmation fondamentale comporte un argument : légitime tel qu''énoncé dans le Coran ; transmis lorsqu''elle est narrée dans des hadiths, biographies et livres biographiques ; historique,
    lorsque les historiens s''accordent sur les sources ; ou contestée lorsque le différend est vivant et que des positions sont présentées ; ou légendaire — communes et culturellement significatives mais
    non étayées par des sources. Les doutes existant avec la source elle-même sont conservés sous forme de données ; le document indique lorsque sa source dit « il est dit » ou affaiblit sa chaîne, tandis
    que le rapport concurrent conserve une seconde affirmation contestée — et n''est jamais supprimé pour corriger ce document.'
  classify_2: 'Et une classification gardée avant tout : la religion d''une personne. Seule la documentation concernant la personne est enregistrée, et cela ne se stabilise que lorsque deux sources indépendantes
    nomment la même secte ou le même ordre — ni à partir d''une seule boîte d''information ou d''une entrée de base de données, ni de la position ou du leadership d''un homme dans une secte, une famille,
    une lignée ou un parti. Lorsque les sources se disputent ou que le doute subsiste, le dossier indique : des lectures inconnues et concurrentes sont conservées dans ses notes de bas de page. La même
    discipline régit le cadre du musée : l''islam sunnite est la position déclarée du musée, et ses recherches commencent par des sources sunnites ; toute autre opinion — chiite, ibadite, académique ou
    autre — est la bienvenue, toujours citée avant d''être mentionnée, et jamais exprimée de la même voix du musée. Les sujets contestés portent le bloc des « Points de vue » : d''abord la position sunnite,
    puis l''opinion académique, puis toute autre opinion dont le sujet a besoin, le tout documenté et nommé, sans jugement. La règle de la mise en étagère : chaque entrée appartient à au moins une aile
    ; l''entrée dont l''aile est inconnue est mise en étagère au lieu de rester non étagée, et l''entrée appartenant à plusieurs ailes est affichée sous forme d''étiquette.'
  classify_title: Comment classer
  corrections_body: 'Les corrections sont faites publiquement. Chaque registre, politique et changement réside dans le stockage public du musée avec son histoire complète, ainsi que tout rapport d''erreur
    et son résultat. Cette page est courte : les documents eux-mêmes régissent, les plus importants étant liés ci-dessous — la politique éditoriale, le mémorandum de portée mentionnant le cadre du musée,
    la politique de source, la norme de publication et la page d''originalité décrivant le portail des livres et copies. Si cette page et un document diffèrent, le document est le jugement et corrige la
    page.'
  corrections_title: Corrections et ouverture
  goal_body: 'L''objectif, en sept langues — et son but, selon les mots du fondateur, est que l''islam — dans tous ses peuples, ses événements et ses lieux — soit accessible à tous sous une forme lue par
    adultes et enfants, Arabes et non-arabes, musulmans et non-musulmans, et que chacun puisse façonner le dessin sous n''importe quelle forme ou application adaptée à ses habitants, en particulier aux
    écoles, universités et cercles d''étude : le dessin est le pont vers la connaissance qui ne peut être atteint qu''en lisant de nombreux livres et en vivant longtemps, et en faisant revivre les sciences
    religieuses pour cette époque et pour l''avenir.'
  goal_title: Objectif, en sept langues
  holds_body: 'Le musée est une carte épistémologique unique du monde islamique, de l''an 610 jusqu''à aujourd''hui — incluant l''ère moderne de 1976 à aujourd''hui, et il dispose de son propre navigateur.
    Ses archives sont divisées en vingt-quatre catégories : personnes, lieux, événements, bâtiments, objets, œuvres, passages, idées, pratiques, groupes et entités politiques, alliances, voyages, inventions,
    récompenses, sources reliant chaque affirmation, et d''autres encore. Ils sont organisés en neuf ailes : temps, lieu, personnes, idées, choses, mots, vie, jour et création. Le musée accueille un enfant
    dans l''aile pédiatrique et un chercheur qui vérifie les références, et ses contributions sont riches datant de la première fois, avec le plus grand détail documenté permis par les sources. Quant aux
    chiffres en temps réel—et aux lacunes—figurent sur la page de couverture ; cette page porte sur les règles, pas les chiffres.'
  holds_title: Ce que contient le musée
  lede: La manière dont ce musée décide de ce qu'il doit visiter, de la façon de classer chaque entrée, et ce qu'il rejette — les règles selon lesquelles sa construction fonctionne réellement — est clairement
    écrite.
  link_editorial: Politique éditoriale
  link_scope: Note sur le champ d'application
  link_sources: Politique d'approvisionnement
  link_standard: Norme de publication
  not_body: 'Le musée rejette : toute affirmation sans source ; une classification sensible portée par une seule source ou données organisées ; une représentation incarnée d''un prophète, un portrait personnel
    généré par l''IA de quiconque ; un livre ou une copie qui tombe dans le portail de l''authenticité — une édition indéfinissable, ou une copie qui ne peut être vérifiée, ou une source figurant sur une
    liste interdite de spam ou de phishing ; une figure récente dont la diffusion ne peut être vérifiée, ou est depuis longtemps inactive, ou qui ne collectionne que d''autres œuvres ; et pour les vivants
    : tout ce qui va au-delà des faits publics bien documentés. Elle rejette également trois habitudes : elle ne cache pas ses lacunes, ne laisse pas tomber silencieusement l''entrée d''une liste — le saut
    est enregistré avec sa propre raison — et ne présente pas les résumés écrits par l''IA comme des textes vérifiés ; ils sont plutôt étiquetés comme des résumés, avec des sources qui les soutiennent pour
    laisser le lecteur juger lui-même.'
  not_title: Ce que nous ne choisissons pas
  rules_title: Où vivent les règles ?
  standard_body: 'L''entrée est publiée lorsque trois critères sont remplis : elle cite ses sources, de sorte que chaque phrase prouve un fait de référence ; ses sources sont définies, de sorte que chaque
    référence se résume à un enregistrement de source que le lecteur peut ouvrir ; et que la source de sa construction est enregistrée — à partir de ce qui a été construit, par qui, ou quoi, et lors de
    quelle visite il a été effectuée. C''est l''ensemble de la norme, et une seule source citée identifiable suffit pour tout événement. Aucune revue, par un humain ou tout autre agent automatisé, ne se
    dresse entre un document répondant à la norme et sa publication : le musée présente les références et le registre de construction à chaque lecteur, laissant le jugement à lui. Les données organisées
    sont publiées sous la licence CC0, les textes sous la licence CC BY-SA 4.0, et le code sous la licence MIT, permettant de vérifier, réutiliser et ramifier le musée.'
  standard_title: Norme de publication
  title: Programme scolaire
  updated: Ces règles sont recueillies à partir de la politique éditoriale du musée, du mémorandum de portée, de la politique de approvisionnement, de la norme de publication et de la documentation de suivi
    dans son dépôt public. Cette page a été ajoutée le 6 novembre 2026.
network:
  closing: Pour participer à cet échange — retours, corrections, collaboration ou réutilisation de données ouvertes — contactez-nous à discover@islam.museum.
  e1_desc: Le site web du professeur Abdullah Ahmed Al-Naeem de l'Université Emoy, dédié à l'avenir de la charia et de la réforme islamique à travers le dialogue interne dans les sociétés musulmanes. Nous
    avons remercié le professeur Al-Naeem pour ses observations précieuses sur le musée et pour son engagement islam.museum avec son public et ses collaborateurs à travers le monde.
  e1_name: Le développement de la charia — Abdullah Ahmed Al-Naeem
  intro: 'Le musée croît en échange : chercheurs, bibliothécaires, enseignants et lecteurs testent, corrigent, partagent et développent ses données ouvertes. Cette page rassemble partenaires et collaborateurs
    qui ont rejoint cet échange — avec nos remerciements.'
  lede: Partenaires et collaborateurs — scientifiques, institutions et communautés en dialogue avec le musée.
  title: Réseau des musées de l'Islam
  visit: Visitez le site web
privacy:
  adr_link: Résolution 0002
  arch_link: Document d'architecture
  changes_body: Si quelque chose change dans le fonctionnement du site, cette page apparaît en premier, et le changement est enregistré dans l'historique du dépôt public sur GitHub, où chacun peut examiner
    ce qui a changé et quand.
  changes_title: Modifier cette page
  collect_body: 'Le musée ne traite aucune donnée personnelle concernant ses visiteurs : pas de noms, pas d''adresses postales, pas d''adresses IP enregistrées, pas de logs de navigation, pas d''identifiants
    d''appareil, pas de profils personnels. Il n''existe aucun formulaire qui nous envoie vos données, et la recherche s''exécute dans votre navigateur sur un index statique, et les polices, cartes et images
    proviennent directement du site, et non de services externes.'
  collect_title: Ce que nous ne collectons pas
  contact_body: Si vous nous envoyez un e-mail ou ouvrez un blog ou une discussion sur GitHub, nous voyons ce que vous choisissez d'envoyer et ne l'utilisons que pour répondre et corriger le contenu. Ce
    que vous écrivez sur GitHub est soumis aux termes et à la politique de confidentialité de GitHub et est public sauf si vous choisissez autrement.
  contact_cta: Nous avons correspondu
  contact_title: Lorsque vous nous contactez
  device_body: 'Certaines options sont stockées uniquement dans la mémoire de votre navigateur (localStorage et sessionStorage) et ne sont envoyées nulle part : l''apparence claire ou sombre, la langue
    choisie en haut de la page, le type de police, la profondeur d''affichage, votre position dans les errants aléatoires, et dans l''aile des enfants, les noms que votre enfant crée dans les jeux, les
    étoiles, et les résultats qu''il collecte. Vous pouvez les effacer à tout moment depuis les paramètres de votre navigateur, et tout le site fonctionne sans eux.'
  device_title: Il ne s'enregistre pas sur votre appareil
  hosts_body: Les pages sont connectées via le réseau Cloudflare, et les pages, images, cartes, index de recherche et fichiers de données ouverts sont fournis depuis le propre dépôt du musée. Les images
    des pièces provenant de musées partenaires (Victoria and Albert Museum, Metropolitan Museum of Art, Cleveland Museum of Art et Wikimedia Commons) sont téléchargées depuis les serveurs de ces mêmes institutions.
    Comme tout service en ligne, ces fournisseurs ont besoin de l'adresse IP de votre appareil pour vous connecter le fichier et le traiter conformément à leurs politiques. Le musée n'obtient ni ne conserve
    ces données.
  hosts_title: Qui livre les fichiers
  kids_body: 'Les mêmes règles s''appliquent à l''aile des tout-petits : pas de calculs, pas de collecte de données, pas de communication avec d''autres parties, pas de commentaires, pas de conversations.
    Tout ce que l''enfant invente des noms dans les jeux ou collecte auprès des étoiles reste sur l''appareil.'
  kids_title: Enfants
  law_body: Le musée est exploité depuis la province de l'Ontario au Canada et est soumis aux lois fédérales canadiennes et ontariennes, y compris la Loi sur la protection des renseignements personnels
    et des documents électroniques (PIPEDA). Comme le musée ne collecte pas d'informations personnelles, il n'a rien à communiquer ou à les supprimer de votre part ; toutefois, nous répondons à toute question
    à ce sujet par courriel.
  law_title: Droit applicable
  lede: Pas de comptes, pas de cookies, pas de suivi, pas de publicités. Cette page explique ce qui se passe lorsque vous visitez le musée et ce qui ne se passe pas.
  links_body: Le musée fait référence à des sources et références externes. Quand vous y déménagez, les politiques de ces sites s'appliquent, pas les nôtres.
  links_title: Liens vers d'autres sites
  more_body: Détails techniques dans le document d'architecture et la décision architecturale 0002 (pas d'intelligence artificielle ni de calcul pendant l'exploitation), tous deux en stockage public.
  more_title: En savoir plus
  people_body: Le musée décrit des personnes issues de l'histoire et du présent avec des faits publics publiés et attribués à leurs sources. Seul ce qui est publié comme faits publics documentés est mentionné,
    et aucune religion ne leur est déduite ou attribuée sans fondement déclaré. S'il y a une erreur ou quelque chose de personnel détenu, veuillez nous en informer via le formulaire de correction ou par
    courrier ; les corrections effectuées par les quartiers ont priorité.
  people_title: Personnes mentionnées par le musée
  report_cta: Signaler une erreur
  summary_1: Le musée est composé de fichiers statiques qui se lisent comme une page d'un livre. Aucun serveur fonctionnent pendant votre visite, aucune base de données, aucun modèle d'IA, et aucun code
    exécuté à votre nom par une autre personne.
  summary_2: Nous ne vous demandons pas de compte, d'adresse e-mail ou de nom. Nous ne plaçons pas de cookies, ne portons pas de code de suivi provenant d'un tiers, n'affichons pas de publicités, ne vendons
    rien et ne partageons rien, car nous ne savons rien sur vous.
  summary_title: Conclusion
  title: Confidentialité et données
  traffic_body: 'Le nombre de visites est comptabilisé dans les statistiques réseau de Cloudflare, le réseau qui relie les pages. Ces statistiques fonctionnent à la périphérie du réseau, sans cookies ni
    code de page, et ne fournissent au musée que les chiffres totaux : nombre de requêtes, pays et pages les plus visitées. Nous ne recevons rien qui connaisse une personne spécifique.'
  traffic_title: Compter les visites
  updated: 'Dernière mise à jour : 17 octobre 2026'
