arkan:
  title: Explorateur des piliers de l’islam, des piliers et des branches de la foi et des qualités du croyant
  lede: 'Quatre portes dans un même explorateur : les cinq piliers sur lesquels repose l’islam, les six piliers de la foi du hadith de Gabriel, les branches de la foi que le hadith dénombre à plus de soixante-dix
    et les qualités du croyant décrites par les versets et les hadiths. Sont réunies leurs mentions dans le Coran, la sunna, la sira, les récits des Compagnons et des Successeurs, les ouvrages de foi, de
    commentaire, de renoncement et d’histoire, et chaque livre dépouillé à l’avenir. Le musée décrit les sources et attribue chaque propos à son auteur ; il ne prononce aucun avis juridique.'
  badge: Exploration des piliers, branches et qualités
  status: Cette version contient {n} notices réparties en {s} sections, chacune référencée à sa source.
  method_title: Comment fonctionne l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée avec ses sources. Les versets viennent d’une table vérifiée indiquant ceux que les recueils de hadiths et les commentaires rattachent à chaque
    thème : le Coran n’emploie pas les termes postérieurs de piliers ou de branches de la foi. Leur texte est celui, figé, de Tanzil dans leur notice. Les autres passages sont repérés à la génération du
    site par un lexique assorti de garde-fous : les quatre termes eux-mêmes, le hadith de l’islam bâti sur cinq fondements, les réponses aux questions sur l’islam et la foi, la prière, la zakat, le jeûne
    et le pèlerinage cités ensemble, la foi en Dieu, Ses anges, Ses livres, Ses messagers, le Dernier Jour et le décret, les soixante-dix et quelques branches, ce qu’un texte considère comme relevant de
    la foi, les conditions de la foi complète et les descriptions du croyant et du musulman. Les indices faibles, tel un article de foi isolé ou la foi qui augmente et diminue, ne comptent qu’auprès d’un
    indice fort ou par deux. Chaque livre dépouillé par la suite apporte automatiquement ses mentions dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette arkan-browser.
    Les extraits de livres numérisés sont lus automatiquement, sans correction ; chaque notice concernée le précise.'
