dreams:
  title: Explorateur des rêves
  lede: 'Chaque vision et chaque rêve mentionnés dans les sources du musée : les versets coraniques, de l’histoire de Joseph au rêve de Badr, les hadiths sur les rêves dans les deux Sahih, le Muwatta et
    les Sunan, les récits des ouvrages de sira et chaque rêve dans chaque livre dépouillé — des notices sourcées qui s’enrichissent à mesure que de nouveaux textes sont intégrés.'
  badge: Exploration des rêves
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les versets coraniques sont repérés dans le texte figé de Tanzil, les hadiths sur les rêves
    par leur vocabulaire dans les textes des ouvrages ; chaque livre dépouillé par la suite apporte automatiquement ses rêves dès que ses passages intègrent le graphe. Les notices thématiques sur la science
    des rêves les rejoignent grâce à l’étiquette dream-browser.
  api: L’ensemble est disponible à l’adresse
  sections_title: Les sections de l’explorateur
  filter_label: Filtrer les rêves
  filter_none: Aucun résultat.
  empty: Cette version ne contient pas encore de notices sur les rêves.
  sections:
    quran:
      title: Dans le Coran
      desc: 'Les versets sur les visions et les rêves : Joseph, ses frères, la prison et le roi ; le rêve du sacrifice d’Abraham ; les rêves du Prophète à Badr et à la Mosquée sacrée ; les mentions des
        rêves dans les sourates du Rappel et du Discernement.'
    sunnah:
      title: Dans la sunna
      desc: 'Les hadiths sur les rêves dans les deux Sahih, le Muwatta et les Sunan : les rêves du Prophète et des Compagnons, les règles relatives au rêve véridique, au mauvais rêve et à l’ihtilam, et
        les principes des bonnes annonces.'
    seerah:
      title: Dans la sira
      desc: Ce que les ouvrages de sira et d’histoire rapportent des rêves — cette section s’enrichit à mesure que de nouveaux textes de sira contenant des visions sont intégrés.
    books:
      title: Dans les autres livres
      desc: Les rêves dans chaque livre dépouillé en dehors du Coran, du hadith et de la sira — poésie, histoire, fiqh et les ouvrages à venir.
    concepts:
      title: La science des rêves
      desc: 'Les notices thématiques du musée sur les rêves : les livres du rêve dans le hadith, leur interprétation et les règles qui les concernent, le mauvais rêve, l’ihtilam et les bonnes annonces.'
  viz:
    title: Les rêves racontés par les sources
    note: Chacune des {n} notices est une étoile, placée dans la constellation de sa section. Dans celle du Coran, les étoiles d’une même sourate sont reliées dans l’ordre des versets et portent le nom
      de la sourate ; dans la sunna, les livres et la sira, celles d’un même recueil ou ouvrage sont reliées de la même manière ; les notices thématiques forment un anneau. Les étoiles n’ont pas de taille
      variable, car les notices ne portent aucune mesure propre.
    where_concept: Notice thématique
    hint: Survolez une étoile, donnez-lui le focus ou touchez-la pour découvrir sa provenance.
    open: Ouvrir la notice
    caption: Les lignes relient les notices d’une même sourate ou d’un même recueil, dans l’ordre de leurs numéros. Une étoile du Coran indique uniquement l’emplacement du verset, jamais son texte ; celui-ci
      se lit sur la page de sa notice.
dua:
  viz:
    title: Les invocations selon leur emplacement dans les sources
    headline: sourates contiennent au moins une formule d’invocation consignée ici, sur les {total} du Coran
    caption: Chaque lampe représente une sourate, dans l’ordre du mushaf, le long de six fils suspendus ; les nombres indiquent le début et la fin d’un fil. Une lampe s’allume lorsque le musée a consigné
      au moins une formule d’invocation dans la sourate, et son éclat augmente avec leur nombre. Le second ensemble de fils porte une lampe par recueil de hadiths contenant de tels passages.
    mode_label: Décompte
    mode_f: Formules
    mode_a: Toutes les mentions
    surahs_title: Les sourates du Coran
    works_title: Les recueils de hadiths
    works_key: Recueils de hadiths, dans l’ordre des lampes
    legend_title: Légende
    legend_lit: 'Allumée : au moins un passage consigné'
    legend_unlit: 'Éteinte : aucun passage consigné'
    hint: Survolez une lampe, donnez-lui le focus ou touchez-la pour voir son décompte et les références de ses passages. Un second appui ouvre le premier passage.
    formulas_n: '{n} formules d’invocation consignées'
    all_n: '{n} passages consignés, formules et mentions'
    of_which: dont {n} contiennent les termes d’une invocation
    refs_title: Références ; les mentions apparaissent en plus pâle
    note: Une formule est un passage contenant les termes d’une invocation ; une mention est un passage qui parle de l’invocation. Les références coraniques indiquent la sourate et le verset ; celles d’un
      recueil, les numéros des hadiths. Les lampes comptent les passages consignés dans ce musée, et non toutes les invocations des sources.
  title: Explorateur des invocations
  lede: 'Chaque invocation mentionnée dans les sources du musée : les prières coraniques, depuis l’adresse d’Adam à son Seigneur jusqu’aux formules d’invocation du Prophète, les invocations des deux Sahih,
    du Muwatta et des Sunan, celles des Compagnons et des Successeurs, les récits de la sira et de chaque livre dépouillé — des notices sourcées qui s’enrichissent à mesure que de nouveaux textes sont intégrés.'
  badge: Exploration des invocations
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les invocations sont repérées à la génération du site grâce à un lexique assorti de garde-fous
    appliqué aux passages : formules d’adresse à Dieu, dont celles avec rabb suivi d’un complément, verbes d’invocation ayant Dieu pour destinataire, isti''adha, istighfar et passages sur l’invocation elle-même.
    Sont écartés les appels à de fausses divinités, les emplois de da''wa et de yad''u au sens de prédication, ainsi que le simple tasbih ; les faux positifs vérifiés sont exclus par identifiant. Chaque
    livre dépouillé par la suite apporte automatiquement ses invocations dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent grâce à l’étiquette dua-browser. Chaque passage
    porte le type formula s’il contient une invocation, mention s’il en parle seulement.'
  api: L’ensemble est disponible à l’adresse
  sections_title: Les sections de l’explorateur
  occasions:
    title: Par occasion
    note: '{n} notices dans {d} des {t} divisions d’al-Adhkar d’al-Nawawi, dans l’ordre du livre. Une division apparaît dès qu’elle contient une notice ; les autres restent à lire.'
