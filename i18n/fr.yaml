  web: Sites web et sources en ligne
  datasets: Jeux de données
  unrecorded: Sources nommées dans les données sans notice encore
  unrecorded_note: Ce sont des sources recherchées listées dans les fichiers stubs de livres en cours (comme Jami al-Ulum wa-l-Hikam) ; aucun texte publié ne les cite encore. Une notice sera faite pour
    chacune une fois ses détails vérifiés.
  resources: Textes licenciés et données de référence
  software: Logiciels et bibliothèques
  author: Auteur
  publisher: Éditeur
