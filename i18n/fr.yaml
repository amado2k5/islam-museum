volunteer:
  about_1: 'Le musée est construit et géré par son fondateur. Il ne facture pas l''entrée, ne diffuse pas de publicité, et fournit ses données gratuitement — il est donc construit de la même manière : avec
    des bénévoles, qui rejoignent un système de travail basé sur des rôles définis, des normes déclarées et une appréciation de ce qu''ils offrent. Et ce système, pas n''importe quelle personne en particulier,
    est ce qui maintiendra le musée debout.'
  about_2: 'Tous les rôles ci-dessous sont volontaires, non rémunérés, accomplis à votre propre rythme et où que vous êtes. Donnez une heure par mois ou un jour par semaine ; les deux sont importants. Le
    bénévolat accorde un rôle, une appréciation et une gratitude — jamais une part de contrôle : un musée n''est pas géré par la participation, n''est pas vendu ni fusionné avec d''autres, et c''est cette
    cohérence qui rend le bénévolat sûr à développer.'
  about_title: Pourquoi faire du bénévolat ?
  development_body: 'Aidez à construire et maintenir le site lui-même : la base de code open source, les nouvelles fonctionnalités, les correctifs, les performances, l''accessibilité, les tests — publiquement
    sur GitHub, aux côtés du fondateur du musée et des outils.'
  development_title: Développement
  education_body: 'Aider à développer le département éducatif du musée : matériel pour les enseignants et les salles de classe, un pavillon pour enfants, des guides, des activités et des sentiers qui aident
    les élèves à découvrir l''histoire islamique avec curiosité.'
  education_title: Éducation
  join_body: Contactez-nous et indiquez votre nom, votre localisation, le(s) domaine(s) ci-dessus qui vous intéressent, un résumé de vos compétences ou expériences, ainsi qu'environ le temps que vous pouvez
    consacrer. Nous répondons à chaque message et, ensemble, nous trouverons la première tâche appropriée.
  join_title: Comment rejoindre ?
  lede: Le Musée de l'Islam est gratuit et ouvert, construit par des gens qui donnent leur temps. Peu importe ton talent, tu as une place ici.
  media_body: 'Aidez à créer les médias du musée : vidéo, audio, images et graphismes — y compris la production alimentée par l''IA — des extraits promotionnels et voix off aux œuvres d''entrée et publications
    de communication, toujours selon les normes de précision et de dignité du musée.'
  media_title: Production médiatique
  outreach_body: 'Aidez le musée à atteindre ceux pour qui il a été conçu : écoles, bibliothèques, mosquées, groupes communautaires, journalistes et créateurs de contenu — en présentant le musée, en faisant
    un suivi des réponses et en tissant des liens dans votre ville, votre pays et votre langue.'
  outreach_title: Communication et diffusion
  planning_body: 'Suggérez ce que le musée construit comme suit : nouvelles ailes et équipements, partenariats, programmes et priorités. Les propositions sont lues et créditées à leurs propriétaires ; les
    décisions finales restent entre les mains du fondateur, comme stipulé par la charte du musée.'
  planning_title: Propositions
  review_body: 'Aidez à relire les articles du musée avant et après la publication : faits, dates, sources et traductions. Ce sont les critiques qui maintiennent le musée honnête — si vous lisez attentivement
    en arabe, anglais ou ourdou, c''est le cœur de l''œuvre.'
  review_title: Revue de contenu
  support_body: 'Aider les usagers du musée : en répondant aux questions des visiteurs, en guidant les enseignants et partenaires qui nous contactent, et en gardant les canaux communautaires du musée accueillants
    et utiles.'
  support_title: Support
  title: Faites du bénévolat avec nous
why:
  about_body: Ce qui distingue le Musée de l'Islam des grands musées et références qui l'ont précédé — et où il va ensuite — son histoire est racontée sur sa propre page.
  about_link: Pourquoi le Musée de l'Islam ?
  about_title: Pourquoi ce musée a-t-il été découvert ?
  before_aga_khan: Toronto — Le Musée Aga Khan, ouvert en 2014 et fondé par l'Aga Khan IV dans un bâtiment conçu par Fumihiko Maki, présente les arts et la culture des civilisations musulmanes à un public
    nord-américain.
  before_berlin: Berlin — Le Musée d'Art Islamique de Pergame, fondé par Wilhelm von Bode en 1904, a construit un grand complexe européen célèbre pour la salle d'Alep et la façade du palais Mashta.
  before_cairo: Le Caire — Le Musée d'Art Islamique, fondé en 1881 sous le règne du Khédive Tawfiq et ouvert en 1903 à Bab al-Khalq, est l'un des plus anciens et des plus grands musées d'art islamique au
    monde, abritant des dizaines de milliers d'artefacts provenant de tout le monde islamique.
  before_close: 'Il n''y a aucune critique à leur égard ici. Le Musée des Objets doit choisir ses objets, l''encyclopédie doit choisir ses lecteurs, et l''exposition doit choisir son sujet. Mais une forme
    d''œuvre reste inachevée : toute l''histoire, pour tous, en public.'
  before_discover: 'En ligne — « Découvrez l''art islamique », créé par le « Musée sans frontières » sous la direction de sa fondatrice Eva Schubert, lancé en 2005 avec un financement du Programme euro-méditerranéen
    du patrimoine de l''Union européenne d''environ 3,1 millions d''euros, et est le prédécesseur numérique le plus proche : environ 150 experts dans 14 pays ont documenté 850 artefacts et 385 monuments.
    Cependant, il a couvert l''art méditerranéen et ses matériaux archéologiques, et son histoire s''arrête en 1922.'
  before_doha: Doha — Le Musée d'Art Islamique, ouvert en 2008 sur son île privée du port, a été conçu par I. M. B. et géré par les musées du Qatar sous la direction de Sheikha Al Mayassa bint Hamad Al
    Thani ; ses salles présentent des chefs-d'œuvre provenant de trois continents.
  before_encyclopaedia: Leiden — L'Encyclopédie de l'Islam, publiée par Dar Brill depuis sa première édition (1913–1936) sous la supervision de M. T. Hotsma et de ses collègues, est la référence scientifique
    de référence en islam et dans le monde islamique ; elle a été écrite pour des spécialistes et lue derrière un mur de preuves.
  before_intro: 'Le musée repose sur les épaules de deux siècles de collectionneurs, de scientifiques et de bâtisseurs. Chacun de ces ancêtres a maîtrisé une partie de l''œuvre avec une grande maîtrise
    — et chacun est partial par la nature de sa conception : objets, études, une région, une époque ou un art.'
  before_inventions: 'Manchester — « 1001 Inventions », lancé en 2006 par la Science, Technology and Civilization Foundation sous la supervision du professeur Salim Al-Hassani, parcourant son exposition
    itinérante adorée à travers le monde — couvrant un magnifique segment de l''histoire : la science et la technologie.'
  before_istanbul: Istanbul — Le Musée des Arts turcs et islamiques, ouvert en 1914 dans le palais Ibrahim Pacha sur la place Sultanahmet, rassemble des œuvres turques et islamiques des siècles anatolien
    et ottoman.
  before_libraries: 'Les textes existent aussi ailleurs : des bibliothèques comme la Comprehensive Library collectionnent des livres, et des plateformes comme Google Arts & Culture accueillent des expositions
    empruntées par de nombreux musées.'
  before_links: 'Visitez leurs sites :'
  before_malaysia: Kuala Lumpur — Le Musée des Arts Islamiques en Malaisie a été inauguré en 1998 à l'initiative de la Fondation Bukhari de M. Mukhtar Al-Bukhari. C'est le plus grand musée d'art islamique
    d'Asie du Sud-Est, avec des salles couvrant quatorze siècles.
  before_title: Ce qui était avant
  built_1: 'Le musée est un diagramme de connaissances conservé dans des fichiers simples dans un dépôt public : des faits linguistiquement neutres dans des fichiers de données, et des textes en arabe,
    anglais, ourdou, français, espagnol, turc et indonésien à côté. L''article est publié lorsque ses affirmations reposent sur des sources de connaissance et que la source de sa construction est consignée
    — c''est la norme pour toute publication au musée, applicable à parts égales au fondateur et à chaque contributeur.'
  built_2: 'Rien sur le site publié ne génère le moment de votre visite : les pages sont fixées, aucun système comptable ni suivi, et les corrections sont effectuées publiquement là où le journal des modifications
    est ouvert à tous. La clause de non-responsabilité du musée explique ce qu''est le musée et ce qu''il n''est pas ; ses bénévoles examinent, traduisent et développent ; et ses soutiens le gardent gratuitement
    pour tous les autres.'
  built_repo: Museum Warehouse sur GitHub
  built_title: Comment est-il construit ?
  diff_alive: Un quartier, pas une vitrine. Une aile pour enfants, des excursions interactives, un explorateur de chronologies, une visite en 3D et des outils pour le calendrier hijri—le tout dans le même
    musée où se trouvent ses études—le garçon de sept ans et le professeur d'université entrent par la même porte.
  diff_founder: Il a été construit par une seule personne, en public. Le Musée de l'Islam a été fondé par Ahmed Abdel Aal, un Canadien d'origine égyptienne, et il est construit avec l'aide de l'intelligence
    artificielle pendant la construction selon des règles strictes de sourcing — chaque fait est relié à une source publiée avant même d'être publié. La méthode n'est pas cachée ; elle fait partie de la
    différence, et toute la construction se déroule dans un entrepôt public.
  diff_intro: Nous ne connaissons aucun autre projet qui réunisse tous les points suivants en un seul endroit. Chaque point existe individuellement quelque part ; mais ensemble, ils créent un type d'institution
    différent.
  diff_language: L'arabe d'abord. Le musée écrit en arabe avant toute autre langue, ainsi que deux éditions complètes en anglais et en ourdou — contrairement à l'ordre habituel dans lequel cette histoire
    du monde arabe est écrite dans d'autres langues.
  diff_open: Entièrement ouvert. Lecture gratuite, sans compte, sans publicité. Les données sont publiées sous licence CC0, les textes sous CC BY-SA 4.0, le code sous licence MIT, et une interface logicielle
    publique — chacun a le droit de réutiliser, de s'étendre, de traduire ou de développer le musée.
  diff_scope: 'Toute l''histoire dans un seul diagramme. Pas l''art seul, ni la science seule, ni une seule région ou famille régnante : mais la foi, son peuple, ses lieux, ses événements, ses idées, ses
    buts, ses mots et sa culture vivante, du monde de 610 jusqu''à aujourd''hui, à travers tous les continents que l''islam a touchés.'
  diff_structure: Un graphique documenté par des sources, pas une pile de pages. Chaque entrée est un nœud relié aux personnes, lieux et événements qui l'entourent, et chaque affirmation porte sa source,
    donc le lecteur peut vérifier n'importe quoi, et la machine peut s'appuyer sur tout. Aujourd'hui, le graphique comprend plus de 42 000 entrées et environ 86 000 pages réparties en neuf ailes, reliant
    300 chemins.
  diff_title: Ce qu'aucun d'eux ne fait
  emblem_alt: 'Logo du musée : Une étoile dorée de huit entoure un disque de lapis-lazuli avec un mihrab en cuivre au-dessus d''un livre ouvert'
  forward_1: Le plan est que le musée devienne une infrastructure permanente et publique. Le projet vise à créer une organisation à but non lucratif en Ontario, Canada. Son ensemble de données est soumis
    avec un identifiant permanent — l'identifiant Zenodo (DOI) ci-dessous — et sa demande auprès de l'Alliance des services publics numériques a été soumise et est en cours d'examen. D'autres langues, dont
    l'arabe, l'anglais et l'ourdou, seront rejointes, et des partenariats avec des bibliothèques, des écoles et des musées permettront au musée d'intégrer les salles de classe et les salles de lecture.
  forward_2: 'Le bâtiment lui-même est un modèle reproductible : parce que le code et les données sont ouverts, n''importe quel autre groupe peut s''éloigner du même mécanisme pour raconter l''histoire
    de son patrimoine de la même manière. Et un engagement ne change pas avec la croissance : le musée reste gratuit — sans paywall, sans compte, sans publicité — pour le prochain lecteur, qui qu''il soit,
    où qu''il soit.'
  forward_doi: 10.5281/zenodo.23692511
  forward_title: Où est-ce que ça va ?
  gap_1: 'L''histoire de l''islam s''étend sur quatorze siècles, et aujourd''hui environ deux milliards de personnes la vivent, pourtant, pendant la majeure partie de cette histoire, il n''y a pas eu un
    seul endroit où son histoire complète a été racontée — librement, ouvertement et sans brids. Il n''a jamais placé le patrimoine ; au contraire, il était dispersé : ses biens étaient dans une poignée
    de grands musées, ses études se trouvaient derrière les murs et dans des bibliothèques spécialisées, et la plupart de ses romans couvrent une région, un siècle ou un art à la fois.'
  gap_2: 'Une nouvelle génération découvre cette histoire d''abord à travers les résultats de recherche, de courts extraits et des publications — des fragments qui répondent fragment après fragment. Ce
    qui n''existait pas, c''était la couche de référence ouverte qui se cache sous tout cela : un récit unique documenté avec des sources et construit dans une structure organisée de l''ensemble de l''histoire,
    sur lequel chacun peut entrer, vérifier et s''appuyer. Le Musée de l''Islam a été construit pour être cette couche.'
  gap_title: Le vide qu'elle comble
  lede: Pourquoi ce musée a été découvert, ce qui l'a précédé, et ce qui le distingue — toute l'histoire de l'islam dans un musée libre, ouvert et documenté.
  link_aga_khan: Musée Aga Khan
  link_discover: Découvrez l'art islamique
  link_doha: Musée d'Art Islamique — Doha
  link_inventions: 1001 inventions
  link_malaysia: Musée des Arts Islamiques — Malaisie
  matters_1: 'Des couches de référence façonnent la mémoire. Quiconque construit le récit ouvert et documenté d''une civilisation — le récit cité par les moteurs de recherche, cité par les étudiants, et
    dont les machines apprennent — façonne la manière dont le siècle prochain la comprendra. Le Musée de l''Islam veut que cette couche des quatorze siècles de l''islam soit ouverte, non propriétaire, l''arabe
    d''abord traduit finalement, libre, pas clôturé : soigneusement construit, honnêtement documenté et offert aux gens. C''est autant une invitation qu''un musée.'
  matters_title: Pourquoi cela importe-t-il ?
  matters_visit: Entrez dans le musée
