  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions de maternité sont repérées à la génération du site par un lexique assorti de garde-fous, en six familles : mère et rang maternel (ummuhu, ummuha, ummahat, walida, umuma, mères des croyants), grossesse (femme enceinte, femmes enceintes, porter un enfant, faiblesse accrue), accouchement (wilada, waladat, talid, mawlud, mise au monde, contractions, suites de couches), allaitement (rada'a, arda'at, nourrice, nourrisson, sevrage), garde et éducation (hadana, gardienne, éducation, enfant chéri, prise en charge de l’orphelin), piété filiale (birr, ihsan, liens de parenté). Les termes ambigus sont encadrés : umm isolé ne compte qu’auprès du vocabulaire familial (Umm al-Qura et Umm al-Kitab sont exclus) ; haml ne compte au sens de grossesse qu’auprès de ce vocabulaire (portage et transport exclus) ; walad au sens de garçon est écarté au profit des formes de naissance ; birr ne compte qu’auprès des parents (barr, la terre, est exclu). Les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions ; les notices thématiques les rejoignent par l’étiquette umuma-browser ; les mères sont tirées des relations child_of du graphe vers des parents féminins."
