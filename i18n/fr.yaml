    mirath: "Les biens laissés : argent, terres, armes, livres et dettes ; héritiers et exécuteurs ; parole du Prophète sur l’absence de succession des prophètes."
    athar: "Objets conservés après leurs propriétaires — manteau, bague, épée, cheveux — et traces nommées par le Coran, telles l’Arche et la Station d’Abraham."
