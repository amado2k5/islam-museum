      desc: "Les notices thématiques du musée sur la médecine elle-même : la médecine prophétique et ses remèdes ; les médecins, femmes et hommes, d’al-Harith ibn Kalada et Rufayda al-Aslamiyya à al-Razi, Ibn Sina, al-Zahrawi et Ibn al-Nafis ; les hôpitaux ; les livres médicaux ; l’anatomie, la chirurgie et les remèdes ; les pestes ; les règles et les fatwas relatives aux soins."
