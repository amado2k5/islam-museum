i3lam:
  title: Explorateur des acteurs musulmans de la communication
  lede: Toutes les mentions de ceux qui ont porté la parole — du muezzin appelant à la prière au crieur des marchés, du khatib au minbar au porte-parole du calife et à l’envoyé du Prophète, du scribe de
    la révélation et de la chancellerie au journaliste de la nouvelle presse, au présentateur et à l’influenceur, au réformateur et au révolutionnaire — dans le Coran, la sunna, la sira, les récits des
    Compagnons et des Successeurs et tous les livres dépouillés par le musée, présents et futurs.
  badge: Exploration des acteurs de la communication
  status: Cette version contient {n} personnes dans {j} rôles de communication et {f} passages les mentionnant dans {s} corpus ; les textes restent des brouillons jusqu’à leur lecture par une personne.
  method_title: Fonctionnement de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée avec ses sources et sa prose trilingue. Une personne rejoint un rôle uniquement par une entrée occupations de sa propre notice : rien n’est
    déduit. Un passage entre dans le flux si le graphe consigne déjà une relation mentions vers une de ces personnes ou un métier de communication, ou s’il porte l’étiquette i3lam-browser. Une mention d’un
    livre dépouillé par la suite apparaît dès l’arrivée du passage, sans modification de cette page. Chaque passage indique son corpus (Coran / sunna / sira / livres).'
  requirements: La demande initiale et les critères d’acceptation de cet explorateur sont consignés à l’adresse
  wire_title: Le fil — du minaret au flux
  wire_aria: 'Schéma de la chaîne de communication : chaque rôle est une station sur une ligne de transmission, son anneau dimensionné selon le nombre de personnes consignées.'
  wire_note: 'Chaque anneau est une station ; son rayon suit le nombre de personnes consignées : l’appel du muezzin devient cri public, sermon, parole de l’envoyé, page du scribe, presse, diffusion et révolte.'
  holders: '{n} personnes consignées'
  quran_title: Dans le Coran
  quran_note: Les ancrages fixes du périmètre dans le texte révélé — présentés par référence au passage figé, jamais retapés.
  anchors:
    poets: Les poètes et ceux qui les suivent dans l’égarement — premier verset sur les détenteurs d’une audience, avec l’exception des croyants qui avertissent.
    news: La diffusion des nouvelles de sécurité ou de crainte — la règle coranique du traitement d’une information avant sa propagation.
    adhan: L’interdiction de tourner l’appel à la prière en dérision et en jeu — le verset liant l’appel du muezzin au sacré.
    jumua: L’appel du jour du rassemblement, l’abandon du commerce pour l’évocation — la convocation qui fonde l’heure du khatib.
    herald: L’envoi comme témoin, annonciateur et avertisseur — la mission prophétique dont s’inspirent ensuite crieurs et porte-parole.
    proclamation: La proclamation de Dieu et de son Messager aux gens le jour du grand pèlerinage — modèle de l’annonce publique.
    caller: 'L’appelant et les auditeurs : scène coranique d’une voix portant un message à la foule.'
  chain_title: Les acteurs de la communication — ceux qui ont porté la parole
  chain_note: Chaque rôle est une notice de métier du musée ; chaque carte, une personne dont la notice comporte l’entrée occupations correspondante, classée par date lorsque le graphe la connaît.
  mentioned_in: mentionné dans {n} passages
  no_holders: Aucune personne consignée dans cette version pour le moment.
  state_title: L’État prend la parole
  state_note: 'Les fonctions servies par la chaîne : califes, sultans et rois dont porte-parole, crieurs et envoyés portaient la parole, vizirs, juges, gouverneurs et maîtres des postes par lesquels l’État
    s’adressait aux sujets. Ce sont les voix de l’institution ; la chaîne ci-dessus en est le moyen de communication.'
  feed_title: Toutes les mentions dans les sources
  feed_note: Chaque passage déjà relié par le graphe à un acteur ou métier de communication, classé par corpus — ce flux s’enrichit dès l’arrivée des passages d’un nouveau livre ou de l’étiquette i3lam-browser
    sur une notice.
  feed_more: et {n} autres dans ce corpus.
  feed_empty: Aucun passage de mention dans cette version pour le moment — ils apparaîtront avec les livres dépouillés.
  corpora:
    quran:
      title: Coran
      note: Le texte figé de Tanzil, accessible uniquement par référence au passage.
    sunnah:
      title: Sunna
      note: Récits des recueils de hadiths.
    seerah:
      title: Sira
      note: Récits des ouvrages de sira et de maghazi.
    books:
      title: Autres livres
