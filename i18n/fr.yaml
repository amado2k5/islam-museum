hudud:
  title: "Explorateur des limites de Dieu et des péchés majeurs"
  lede: "Chaque mention des limites de Dieu et des péchés majeurs dans les sources du musée : les versets qui nomment ces limites et leur transgression, les peines de fornication, de vol et de calomnie dans les deux Sahih, le Muwatta et les Sunan, leur application dans la sira et les récits des Compagnons et des Successeurs, les listes de kaba'ir et des sept péchés destructeurs, et chaque mention de chaque livre dépouillé — des notices sourcées qui s’enrichissent avec les nouveaux textes."
  badge: "Exploration des hudud et des kaba'ir"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions sont repérées à la génération du site par un lexique assorti de garde-fous : hudud Allah dans ses différentes formes, application du hadd, peines fixes — lapidation, flagellation dans ses formes pénales, main coupée et peine discrétionnaire — kaba'ir et mubiqat. Les indices faibles — hudud et hadd sans restriction, jald ambigu, infractions de fornication, vol, calomnie, vin, apostasie et brigandage, talion, kabira ambigu — ne comptent qu’auprès d’un indice fort ou par deux ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette hudud-browser. Chaque passage porte le type hudud ou kabair selon ses indices."
