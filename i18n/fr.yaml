  topics: { nasab: "Ascendance", tribes: "Tribus", butun: "Subdivisions tribales", prophets-tree: "L’arbre des prophètes" }
  sections:
    shajara: { title: "L’arbre des prophètes et messagers", desc: "Les maillons de l’ascendance du Prophète et les prophètes de la descendance d’Abraham : chaîne reconnue d’Abdullah ibn Abd al-Muttalib à Adnan, maillons discutés d’Adnan à Ismaël, lignée d’Isaac jusqu’à Jésus fils de Marie — chaque maillon est une notice sourcée avec son histoire." }
    tribes: { title: "Les tribus et clans", desc: "Les tribus arabes et leurs clans selon les livres de généalogie et de sira : Quraysh et ses clans Hashim, Umayya, Abd Shams, Makhzum, Zuhra et al-Najjar ; Aws et Khazraj ; Khuza'a ; Tamim, Hawazin, Thaqif, Ghatafan, Hudhayl, Sulaym, Asad, Juhayna, Muzayna, Ghifar, Ashja', al-Azd, Lakhm, Ghassan, Hamdan, Himyar, Madhhij, Quda'a, Tayy, Shayban, Bakr, Taghlib, Abd al-Qays, Kinda, Dabba, Yarbu', Kinana, Murad, Anmar, Abs et Amir ; tribus juives du Hedjaz — Nadir, Qaynuqa' et Qurayza ; Aad et Thamud des Arabes disparus." }
    peoples: { title: "Les peuples et nations", desc: "Les peuples et nations nommés par les textes : Arabes, Ajam, Perses, Rum dits fils du Blond, Abyssins, Coptes, Turcs, Berbères, Kurdes, Mongols et Fils d’Israël — à propos desquels est rapportée l’absence de supériorité de l’Arabe sur le non-Arabe, si ce n’est par la taqwa." }
    butun: { title: "Les butun — subdivisions tribales", desc: "Les butun — échelon sous la tribu et au-dessus du fakhidh — selon les livres de généalogie et de sira : clans de Quraysh — Hashim, al-Muttalib, Abd Manaf, Abd Shams, Abd al-Dar, Makhzum, Jumah, Sahm, Zuhra, Taym, Adi et Umayya ; d’Aws et de Khazraj — al-Najjar, Abd al-Ashhal, Zafar, Haritha, al-Harith, Salima, Zurayq, Bayada, Amr ibn Awf, Khatma, Waqif, Maghala, al-Ajlan, Dubayb, Sa'ida et Salul ; de Hawazin et de Qays — Darim, Hanzala, Fazara, Murra, Kilab, Nasr, Jusham, Uqayl et Sa'd ibn Bakr." }
    curated: { title: "Notices sur la généalogie", desc: "Les concepts généalogiques des savants : nasab et ansab, ascendance du Prophète en trois parties, généalogistes, arrêt de l’ascendance à Ma'add et rattachement de filiation en droit." }
    mentioned: { title: "Les autres mentions", desc: "Notices entrées automatiquement parce que nommées dans les passages ou portant l’étiquette de l’explorateur — dès qu’un nouveau nom, une tribu ou un matn apparaît dans un livre dépouillé." }
  viz:
    title: "L’arbre des tribus"
    note: "Tribus, peuples et clans dessinés à partir des seules relations du graphe : un groupe dépend de celui dont il fait partie ou est membre, ou de celui que sa notice nomme comme fondateur ; un ancêtre fondateur figure près du groupe fondé. {n} des {t} notices de groupes sont reliées par {e} relations en {r} arbres ; {u} sans relation avec un autre sujet attendent ci-dessous. La taille d’un cercle suit les mentions du sujet dans les sources du musée (racine carrée, bornée)."
