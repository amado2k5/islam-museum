  lede: "Chaque mention des débats et controverses dans les sources du musée : les argumentations coraniques — Abraham avec son peuple et Nemrod, Moïse devant Pharaon, verset de la mubahala, appel à discuter de la meilleure manière — les débats du Prophète, des Compagnons et des Successeurs avec les juifs, les chrétiens et les polythéistes, celui d’Ibn Abbas avec les kharijites à Harura, les controverses savantes en assemblées et dans les cours, les débats modernes — des notices sourcées qui s’enrichissent avec les nouveaux textes."
