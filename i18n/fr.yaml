  title: 'Explorateur des testaments : derniers conseils des prophètes, califes, Compagnons, Successeurs, imams et justes, leurs héritages, reliques et sépultures'
  lede: 'Tout ce que les sources du musée disent des adieux des prophètes et messagers, des califes, des Compagnons, des Successeurs, des imams et des justes : recommandations aux survivants, paroles des
    dernières heures, biens laissés, objets conservés après eux et lieux d’inhumation selon les livres. Chaque élément est un verset, un récit ou une notice avec sa source.'
  badge: Exploration des testaments
  hero_kufi: Testaments · Héritages · Reliques · Tombes
  hero_naskh: Leurs recommandations avant de mourir, ce qu’ils ont laissé et où ils reposent
  status: Cette version contient {n} notices en {s} sections ; chacune indique ses sources. Les textes ont été rédigés par des agents d’IA à partir de ces sources et n’ont pas encore été lus par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Cet explorateur réunit les propos et écrits sur cinq sujets liés : testaments et conseils d’adieu, dernières heures, successions et biens laissés, reliques, inhumations et tombes. Les versets
    viennent d’une table vérifiée (testaments d’Abraham et de Jacob, conseils de Luqman, legs et héritage, reliques, mort et inhumation) ; leur texte est celui, figé, de Tanzil, jamais retapé. Les autres
    passages — hadith, sira, histoire, biographie — sont repérés à la génération du site par une liste de mots assortie de garde-fous : un livre dépouillé par la suite apparaît dès l’arrivée de son passage.
    Les extraits sont lus automatiquement depuis des numérisations, cités dans la limite de quarante mots et non corrigés. Les règles successorales générales des juristes ne sont pas réunies ici : seulement
    les successions de personnes nommées et les paroles du Prophète sur l’héritage. L’identification d’une tombe est toujours celle de la source citée, non du musée. Les sources sunnites forment le cadre
    ; tout autre point de vue est identifié.'
