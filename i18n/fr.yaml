qurun:
  title: "Explorateur des siècles, des années et des mois"
  lede: "Chaque mention des siècles et générations, des années et des années nommées, des mois importants et sacrés dans les sources du musée : qurun et générations, années de la sira — Éléphant, Tristesse, Délégations, al-Ramada — douze mois lunaires de Mouharram à Dhu al-Hijja, quatre mois sacrés et intercalation (al-Nasi'), jours de Tashriq, jour d’Arafat, Nuit du Destin et dix dernières nuits, noms préislamiques des mois et mois persans, chaque livre qui en traite — des notices sourcées qui s’enrichissent avec les nouveaux textes."
