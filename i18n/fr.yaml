future:
  alts:
    city: La silhouette de la ville de 2077 présente des tours illuminées, un minaret et un dôme ; des personnes et de petits robots partagent la rue sous un croissant tandis que de petits avions traversent
      le ciel.
    hajj: Des points de pèlerins entourent une Kaaba décorée sous un croissant, et deux petits robots guidés se tiennent sur le bord tandis que deux arcs effacent le capteur au pluriel.
    hifz: Un élève sans traits lit un livre lumineux tandis qu'une boule compagne flottante l'écoute en cachette, entourée de boucles douces.
    isnad: Une chaîne dorée de nœuds lumineux s'étendant à travers un champ sombre, avec des caractères alignés sur ses anneaux, et un anneau d'examen comparant deux nœuds.
    mosque: 'Une mosquée nocturne décorée : Des adorateurs sans visage se tiennent en rang à côté d''une figure holographique transparente et d''un petit robot transportant de l''eau.'
    space: Un astronaute prie un oiseau à l'intérieur d'une fenêtre de station, avec une ligne dorée d'intention atteignant un point pointé au sol en dessous.
  anchors_label: Installé au musée
  epilogue: Cette page va croître. Quand une nouvelle machine entre dans une mosquée, quand un scientifique écrit un nouveau scénario, et quand vous imaginez ce que nous n'avions jamais imaginé — le futur,
    comme un musée, est en construction.
  epilogue_title: Invitation permanente
  eyebrow: 1448 AH ← 1500 AH
  lede: 'Ce n''est pas une prophétie — l''invisible appartient à Dieu seul. Cette page est un exercice muséal d''imagination : chaque médium qui a traversé les musulmans — papier, imprimé, radio et écran
    — a été absorbé par la religion sans que son essence ne bouge. Alors, que se passe-t-il lorsque le médium lui-même commence à répondre ?'
  note: Ce qui suit est de la fiction fondée sur des preuves — de vrais robots, de vraies fatwas, et de vraies recherches — pas une prophétie. Chaque station vous ramène à l'intérieur du musée.
  sections:
  - a:
    - l: La nécessité du groupe
    - l: Nivellement des niveaux
    d: 'En 2077, les rangées de prière du vendredi peuvent tourner autour d''un objectif, et non d''une colonne — des fidèles dans une réalité mixte debout épaule contre épaule avec des gens sur trois continents.
      Des robots guides parcourent la Grande Mosquée dès aujourd''hui, répondant aux questions en onze langues ; ils pourraient alors transporter de l''eau Zamzam, traduire le sermon à toutes les oreilles,
      et savoir qui est le nouveau visiteur et qui vient depuis quarante ans. Mais le cours n''a jamais porté sur le bâtiment : c''est la géométrie des égaux, et la question est de savoir si une image imaginaire
      peut y tenir.'
    k: Le groupe
    scene: Mosquée
    t: Le groupe
  - a:
    - l: Préservation du texte
    d: 'Un compagnon de mémorisation infatigable : Il écoute vos quarante tentatives avec la patience d''une première tentative, reprend le faux faux de tajweing manqué par un professeur fatigué, et mémorise
      tout ce qu''il sait dans sa chaîne — c''est-à-dire la lecture, de n''importe quel lecteur, et à travers n''importe quel chemin de narrateurs. La mémorisation reste avec le parchemin, l''imprimante
      et la cassette ; jusqu''à ce que la machine devienne un autre support. La propre règle du musée d''aujourd''hui dit que le texte lui-même ne provient jamais d''un instrument.'
    k: Texte
    scene: hifz
    t: Apprenez le Coran
  - a:
    - l: Attribution
    - l: Connexion de référence
    d: 'L''attribution fut le premier dessin épistémologique au monde — une série de personnes nommées selon leurs histoires, leurs voyages et leur justice. En 2077, l''apprenant marche dans cette chaîne
      comme une carte vivante, et la machine fait ce que les modernistes faisaient à la lumière des chandelles : elle vérifie si les deux narrateurs se rencontrent réellement, et la nouvelle s''écarte de
      ses pairs. L''outil est nouveau ; quant au doute, il a quatorze siècles.'
    k: Série
    scene: isnad
    t: Apprenez à parler
  - a:
    - l: Migration
    - l: Grotte de Thor
    d: Au lieu de lire que la migration a duré plusieurs jours dans le désert, un enfant de l'année 2077 se tient sur cette route à l'aube — ressentant la chaleur, voyant le guide s'éloigner de la demande
      et attendant à l'intérieur de la grotte. Les cartes de voyage du musée sont une première étape ; le récit immersif vient ensuite. C'est ainsi que l'histoire a toujours été racontée — à propos des
      incendies, dans les mosquées, et avec les voix des mères — et seul le feu a changé.
    k: La route
    t: La biographie de la marche
  - a:
    - l: La Mecque
    - l: Décisions du Hajj
    d: 'La Mecque emploie des robots dès aujourd''hui pour distribuer l''eau, nettoyer le marbre et répondre aux pèlerins. D''ici 2077, l''intelligence des flux de foule pourrait rendre les affrontements
      historiques inimaginables, les écouteurs de traduction pourraient faire référence à la langue des signes pour le pèlerin retraité, et un agriculteur qui ne pourra peut-être jamais faire le voyage
      pourra marcher fidèlement dans une simulation rituelle. Puis vient la question difficile que se posent les scientifiques aujourd''hui : la présence est-elle le but voulu ?'
    k: Hajj
    scene: hajj
    t: Le Hajj en période d'afflux massif
  - a:
    - l: Ijtihad
    - l: Fatwa
    d: 'Lorsque chaque musulman peut poser le même modèle, deux futurs se ramifient : l''un où l''ijtihad se multiplie — des outils ouverts permettant à chaque érudit de tester son jugement sur quatorze
      siècles de méthodologie — et l''autre où un seul algorithme devient discrètement la seule référence sur terre. L''imprimerie a mis fin au monopole du mémoriseur, et la base de données a mis fin à
      l''encyclopédie mondiale. Ce que la machine termine ou libère est encore en cours de rapport.'
    k: Référence
    t: Le Mufti et la Machine
  - a:
    - l: Heures de prière
    d: 'Cela s''est effectivement produit auparavant : en 2007, le Conseil de la Fatwa a rédigé dix-huit pages afin qu''un pionnier musulman puisse prier à une station qui voit le lever du soleil seize
      fois par jour — recevoir la Kaaba, son atterrissage, la terre ou n''importe quelle direction ; arriver cinq prières au moment du port de départ ; et bouger avec intention si votre corps flotte. D''ici
      2077, les musulmans pourraient vivre sur Mars, lors d''une journée permanente du pôle, et dans des vaisseaux spatiaux en rotation. Les questions semblent nouvelles ; mais la méthodologie — poids,
      adaptation et mémorisation de la prière obligatoire — est parmi les plus anciennes de ce musée.'
    k: Au-delà de la terre
    scene: Espace
    t: Jurisprudence des extraterrestres
  - a:
    - l: Dotation
    d: D'ici le milieu du siècle, environ une personne sur trois sera musulmane — le plus grand et le plus petit groupe religieux sur terre — partageant des villes avec des milliards de machines de servite.
      Alors, que signifie la fraternité lorsque votre collègue est artificiel ? Les temps peuvent devenir des dotations programmables qui se libèrent à condition donnée, et la zakat peut être payée sur
      de l'argent qui compte lui-même. La nation a toujours été un réseau — un réseau de messages, de caravanes et de chaînes de transmission. Et les câbles ne sont que sa chair la plus nouvelle de l'histoire.
    k: Réseau
    scene: Ville
    t: La nation en tant que réseau
  - d: 'L''honnêteté fait de cette dernière station la même : un musée de l''islam dont la plupart des machines écrivent déjà, les règles l''examinent, et figé par des pages fixes — son propre équilibre
      entre la vitesse de la machine et la mémorisation humaine. Et en 2077, ce sera peut-être un lieu où marcher, une carte que vous habitez, ou un compagnon qui sait lesquels de ses biens vous émouveront.
      Quelle que soit sa forme, sa question restera la même sur cette page.'
    k: Le musée
    t: Et ce musée
  stations: Gares sur la route à venir
  strip_cta: Entrer dans le futur
  strip_lede: Les robots servent dans la Grande Mosquée depuis aujourd'hui. Une génération en avant — un fantasme prouvé par quatorze siècles d'adaptation.
  strip_title: Comment vivront-ils les musulmans en 2077 ?
  tensions:
  - d: Les robots de guidage répondent aujourd'hui aux questions des pèlerins à La Mecque. Quant à savoir s'il est permis à une machine de faire office d'imam — ou si la voix doit être celle d'un être humain
      interrogée à ce sujet — c'est un débat animé et non une question réglée.
    q: Une machine peut-elle diriger la prière ?
  - d: La simulation peut enseigner des rituels à des millions de personnes qui ne voyageront jamais. Les scientifiques distinguent l'apprentissage de la performance — mais la distance entre le corps du
      pèlerin et les lunettes de la réalité soulève une question sur la fréquentation à laquelle chaque époque a répondu différemment.
    q: Comptez-vous comme des simulations de Hajj ?
  - d: Si un milliard de musulmans se posent le même modèle, l'autorité religieuse est concentrée d'une manière que la nation n'a jamais connue — pas même sous les califes. Certains voient la fin de la
      diversité jurisprudentielle ; d'autres considèrent l'ijtihad comme définitivement démocratisée. Les deux groupes citent la même histoire.
    q: Une IA par fatwa ?
