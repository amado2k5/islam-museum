    back: "Retour au calculateur"
  title: "Registre, calculateur et compteur des bonnes et mauvaises actions"
  lede: "Ce que les sources du musée disent du compte des actes : versets, hadiths et récits de la sira, des Compagnons et des Successeurs qui dénombrent bonnes et mauvaises actions, les inscrivent, multiplient, effacent et pèsent en qirats, degrés et dans la Balance. Une liste de ces textes, un calculateur lisant leurs chiffres pour des actes précis et un compteur conservé dans votre navigateur."
  badge: "Le compte des actes dans les textes"
  status: "Cette version contient {n} notices en {s} sections, dont {r} lignes du calculateur ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  parts_title: "Parties de la page"
  read_more: "Lire l’article"
  caveat_title: "Avant de compter"
  caveat: "Cette page décrit le contenu des textes sans calculer le sort de quiconque. Chaque chiffre provient d’un texte nommé à côté ; les textes le conditionnent eux-mêmes à l’intention, à l’acceptation, à l’évitement des péchés majeurs et à la réparation des torts, et disent qu’au-delà se trouve une générosité qu’aucun nombre ne borne. Le musée ne donne pas d’avis juridique : les transmissions divergentes restent telles quelles ; sans chiffre, le résultat est exprimé dans les mots du texte, non converti en nombre."
  method_title: "La méthode de la page"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources. Les textes sont repérés à la génération du site par un lexique assorti de garde-fous : nombre de bonnes ou mauvaises actions, multiples de dix et de sept cents, inscription d’un acte, effacement et expiation des mauvaises actions, pardon du passé, degrés et qirat, équivalence avec un acte plus grand, Balance et poids de l’atome, nobles scribes et registre, ruiné et fardeaux, reddition des comptes. Une simple mention sans décompte reste dans les explorateurs des bonnes et mauvaises actions. Les faux positifs vérifiés sont exclus par identifiant ; les livres dépouillés par la suite apportent automatiquement leurs textes dès l’arrivée des passages. Les lignes du calculateur sont des notices sélectionnées munies d’un champ de décompte lisant le chiffre d’un texte nommé."
