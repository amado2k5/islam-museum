    Jésus — bâton, mer, chamelle, arche, feu, oiseau d’argile, parole au berceau, table céleste, signes de Salomon, rêves, annonciation, coffre de l’Alliance, signes cosmiques de la création, destruction
    des peuples négateurs et chaque livre qui en traite — des notices sourcées qui s’enrichissent avec les nouveaux textes.'
