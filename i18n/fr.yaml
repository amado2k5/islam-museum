      il les rattache et ses propres appréciations d’authenticité.
    division: 'La division, dans les termes d’al-Nawawi :'
    printed: commence à la p. {p} de l’édition consultée
    back: Toutes les occasions
    names:
      day: Les évocations de la journée, du réveil au sommeil
      quran: La récitation du Coran
      praise: La louange de Dieu
      blessing-on-the-prophet: La demande de bénédiction pour le Prophète
      passing-matters: Les circonstances qui se présentent
      hardship: Les temps d’épreuve et d’affliction
      illness-and-death: La maladie et la mort
      particular-prayers: Les prières particulières
      fasting: Le jeûne
      hajj: Le pèlerinage
      jihad: La campagne militaire
      travel: Le voyage
      food: Manger et boire
      greeting: Saluer, demander la permission et éternuer
      marriage: Le mariage
      names: Les noms
      miscellany: Évocations diverses
      guarding-the-tongue: La maîtrise de la parole
      comprehensive: Les invocations générales
      forgiveness: La demande de pardon
  filter_label: Filtrer les invocations
  filter_none: Aucun résultat.
  empty: Cette version ne contient pas encore de notices sur les invocations.
  kinds:
    formula: Contient une invocation
    mention: Parle de l’invocation
  sections:
    quran:
      title: Dans le Coran
      desc: 'Les invocations du Coran : les prières des prophètes demandant un don à leur Seigneur ou s’adressant à lui collectivement, la table servie des disciples, l’appel divin à l’invocation assorti
        de la promesse d’une réponse, les formules de refuge des mu''awwidhat et chaque verset qui mentionne ou enjoint l’invocation.'
    sunnah:
      title: Dans la sunna
      desc: 'Les invocations du Prophète et des Compagnons dans les deux Sahih, le Muwatta et les Sunan : les demandes de refuge auprès de Dieu, les prières nocturnes, les invocations funéraires et pour
        la pluie, la meilleure invocation d’Arafat et chaque récit qui cite ou enseigne l’invocation.'
    seerah:
      title: Dans la sira
      desc: Ce que les ouvrages de sira et d’histoire rapportent des invocations — cette section s’enrichit à mesure que de nouveaux textes de sira contenant des invocations sont intégrés.
    books:
      title: Dans les autres livres
      desc: Les invocations dans tous les autres ouvrages dépouillés — poésie, histoire, fiqh et les ouvrages à venir — classées selon le genre de l’ouvrage dès l’arrivée de ses passages.
    curated:
      title: Les notices sur l’invocation
      desc: 'Les notices thématiques du musée sur l’invocation elle-même : la pratique du du''a, l’istighfar, l’istikhara, les vœux, l’invocation pour ses enfants et les convenances consignées par la tradition.'
janna:
  viz:
    title: Les deux demeures, sourate par sourate
    stats_label: Les {n} sourates selon les explorateurs qui contiennent leurs versets
    s_both: Dans les deux explorateurs
    s_j: Paradis seulement
    s_n: Feu seulement
    s_none: Dans aucun des deux
    legend_title: Comment lire le graphique
    j_name: Paradis
    n_name: Feu
    legend_up: au-dessus de l’axe
    legend_down: au-dessous de l’axe
    legend_tie: 'numéro de sourate doré : des versets dans les deux explorateurs'
    toggle: Afficher les deux côtés en teinte pleine
    n_ayahs: 'versets : {n}'
    none: aucun consigné
    hint: Pointez une sourate, donnez-lui le focus ou touchez-la pour la découvrir ici ; touchez à nouveau une barre pour ouvrir son premier verset.
    caption: 'Pour lire le graphique : chaque barre compte les versets repérés et consignés dans cet explorateur ; c’est une aide à la lecture, non un décompte propre au Coran. Les décomptes du Feu excluent
      le feu de ce monde, auquel l’explorateur du Feu réserve une rubrique distincte. Une barre ouvre le premier verset qu’elle compte.'
    note: Les sourates du Coran dans l’ordre du mushaf. Au-dessus du numéro de chaque sourate, une barre indique combien de ses versets figurent dans l’explorateur du Paradis ; au-dessous, une barre indique
      combien figurent dans celui du Feu. Le côté Paradis est ici en teinte pleine et le côté Feu en contour, car ils se lisent ensemble ; un numéro doré signale les sourates dont des versets figurent dans
      les deux explorateurs.
    open_other: Ouvrir l’explorateur du Feu
  title: Explorateur du Paradis
  lede: 'Chaque mention et description du Paradis (al-janna) dans les sources du musée : ses noms et descriptions coraniques, les hadiths sur ses portes, ses fleuves, son sol, ses degrés et ses habitants,
    les récits de la sira et des ouvrages d’histoire, ceux des Compagnons et des Successeurs et chaque mention dans chaque livre dépouillé — des notices sourcées qui s’enrichissent à mesure que de nouveaux
    textes sont intégrés.'
  badge: Exploration du Paradis
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les mentions sont repérées à la génération du site grâce à un lexique assorti de garde-fous
    appliqué aux passages : les noms sans ambiguïté (al-Firdaws, jannat ''Adn, Dar al-Salam, jannat al-Ma''wa et les associations de termes propres au Paradis) sont retenus directement ; le nom isolé «
    الجنة/جنات/جنان » n’est retenu qu’auprès d’une telle association, afin d’écarter les jardins terrestres. Le texte du hadith présentant le jeûne comme un bouclier est masqué ; la famille lexicale des
    djinns est exclue par délimitation des lettres ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions du Paradis dès que ses
    passages intègrent le graphe ; les notices thématiques les rejoignent grâce à l’étiquette janna-browser. Chaque passage porte le type description s’il dépeint le Paradis, mention s’il le nomme.'
  api: L’ensemble est disponible à l’adresse
  sections_title: Les sections de l’explorateur
  filter_label: Filtrer les notices sur le Paradis
  filter_none: Aucun résultat.
  empty: Cette version ne contient pas encore de notices sur le Paradis.
  kinds:
    description: Description — dépeint le Paradis
    mention: Mention — le nomme
  sections:
    quran:
      title: Dans le Coran
      desc: 'Chaque mention coranique du Paradis : al-Firdaws, les jardins d’Adn, jannat al-Na''im, jannat al-Khuld, jannat al-Ma''wa, Dar al-Salam, ses fleuves, ses fruits, ses époux purifiés, ses demeures,
        l’arbre de Tuba et les versets où le jardin appartient à ce monde.'
    sunnah:
      title: Dans la sunna
      desc: 'Les hadiths des deux Sahih, du Muwatta, des Arba''in et des Sunan : les huit portes et Bab al-Rayyan, le sol de musc, le degré le plus bas du Paradis, le premier groupe à y entrer, les houris
        et les fleuves, et chaque récit qui décrit ou nomme le Jardin.'
    seerah:
      title: Dans la sira
      desc: Chaque mention du Paradis dans les ouvrages de sira — la promesse aux martyrs, les visions et les récits qui parcourent la biographie du Prophète — à mesure que ces passages sont dépouillés.
    books:
      title: Dans les livres dépouillés
      desc: Chaque mention du Paradis dans tous les autres ouvrages dépouillés — exégèse, histoire, adab, poésie — intégrée automatiquement dès l’arrivée de ses passages.
    curated:
      title: Notices thématiques
      desc: Les notices du musée sur le Paradis — ses noms, ses portes, ses fleuves, son sol, ses degrés et ses habitants — réunies grâce à l’étiquette janna-browser.
qiyama:
  viz:
    title: Le Jour, dans l’ordre de la révélation
    note: Trois bandes, une pour chaque type de passage distingué par cet explorateur, suivent les sourates dans l’ordre de leur révélation. Un point apparaît lorsqu’une sourate contient des versets de
      ce type ; plus il est grand, plus l’explorateur y consigne de versets, ce qui permet de voir où chaque thème se concentre au fil de la révélation. Le bandeau inférieur colore chaque sourate selon
      son lieu de révélation, tel que l’indiquent les notices.
    headline: des {total} sourates contiennent des versets d’au moins un de ces trois types
    legend_title: Comment lire le graphique
    legend_dot: un point représente une sourate ; sa taille correspond au nombre de versets
    meccan: Révélée à La Mecque
    medinan: Révélée à Médine
    toggle: Alterner entre l’ordre de la révélation et celui du mushaf
    order_rev: Sourates dans l’ordre de la révélation, la première révélée au début de l’axe.
    order_mushaf: Sourates dans l’ordre du mushaf.
    swipe: Faites défiler les bandes horizontalement ; leurs noms restent visibles.
    read_info: '{rev} dans l’ordre de la révélation · {mushaf} dans le mushaf'
    n_ayahs: 'versets : {n}'
    none: aucun consigné
    k_baath: Résurrection
    k_yawm: Le Jour
    k_hisab: La reddition des comptes
    hint: 'Parcourez les bandes ou donnez le focus à un point pour découvrir une sourate : son lieu de révélation, les trois décomptes et un lien vers un verset de chaque type. Sur téléphone, touchez un
      point pour le lire, puis à nouveau pour ouvrir son verset.'
    sun_title: Les trois mêmes types dans la sunna
    sun_note: Les passages de hadiths et de récits présents dans cet explorateur, selon les trois mêmes types ; chaque nombre ouvre la section Sunna ci-dessous.
    caption: 'Pour lire le graphique : la taille du point compte les versets de ce type repérés et consignés par cet explorateur dans la sourate ; c’est une aide à la lecture, non un décompte propre au
      Coran. Une longue sourate peut en contenir davantage du seul fait de sa longueur. Chaque point ouvre le premier verset qu’il compte. Le lieu de révélation est celui qu’indique la notice de la sourate.'
  title: Explorateur de la Résurrection et de la reddition des comptes
  lede: 'Chaque mention de la Résurrection (al-ba''th), du Jour du jugement (yawm al-qiyama) et de la reddition des comptes (al-hisab) dans les sources du musée : les noms du Jour dans le Coran — al-Haqqa,
    al-Qari''a, al-Sakhkha, al-Ghashiya, yawm al-din, yawm al-fasl — les souffles dans la Trompe, la sortie des tombes et le rassemblement, les terreurs, la sueur et le soleil rapproché, la comparution
    et les rouleaux, le premier compte demandé au serviteur, la Balance et la pesée, la réparation entre les créatures, l’Ombre, le Bassin, l’intercession et le Sirat — chaque verset et chaque récit référencés,
    dans chaque livre dépouillé, un ensemble qui s’enrichit avec les nouveaux textes.'
  badge: Exploration de la Résurrection
  status: Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain.
  method_title: La méthode de l’explorateur
  method_note: 'Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en sept langues. Les mentions sont repérées à la génération du site grâce à un lexique assorti de garde-fous
    appliqué aux passages : les expressions fixes du Jour (yawm al-qiyama, yawm al-din, yawm al-fasl, yawm al-hisab…) et ses noms (al-Haqqa, al-Qari''a, al-Sakhkha, al-Ghashiya) sont retenus directement
    ; les termes ambigus — ba''th, qui peut désigner l’envoi d’un messager, al-sa''a une heure, hisab le calcul, al-sirat le droit chemin, shafa''a toute médiation — ne sont retenus qu’auprès d’une association
    de termes liée à la résurrection ou aux comptes. Les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses mentions dès que ses passages
    intègrent le graphe ; les notices thématiques les rejoignent grâce à l’étiquette qiyama-browser. Chaque passage porte le type baath (relèvement et rassemblement), yawm (le Jour, ses noms et ses terreurs)
    ou hisab (comptes, balance, registres et traversée). Le barzakh et l’interrogatoire de la tombe restent dans l’explorateur des signes de l’Heure ; les signes de l’Heure eux-mêmes, le Paradis et le Feu
    ont leurs propres explorateurs.'
