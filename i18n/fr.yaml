hasanat:
  title: "Explorateur des bonnes actions"
  lede: "Chaque mention des bonnes actions (al-hasanat) dans les sources du musée : les versets sur leur inscription, leur multiplication et leur effacement, les hadiths sur l’enregistrement des intentions et des actes, le beau prêt à Dieu, la bonne intercession et la récompense al-husna, chaque mention dans la sira, les récits, les traditions des Compagnons et des Successeurs et chaque livre dépouillé — des notices sourcées qui s’enrichissent avec les nouveaux textes."
