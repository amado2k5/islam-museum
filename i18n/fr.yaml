bunuwwa:
  title: "Explorateur de la filiation en islam"
  lede: "Tout ce que les sources du musée mentionnent sur les fils, les filles et le lien filial : les enfants des prophètes et des Compagnons, la bonté envers les parents et la désobéissance à leur égard, les orphelins, l’allaitement et le sevrage, les droits de l’enfant — garde, sacrifice de naissance, héritage — et les fils et filles des récits, dans le Coran, les deux Sahih, le Muwatta et les Sunan, la sira, les récits des Compagnons et des Successeurs et chaque livre dépouillé — des notices sourcées qui s’enrichissent avec les nouveaux textes."
  badge: "Exploration de la filiation"
  status: "Cette version contient {n} notices réparties en {s} sections ; les textes restent des brouillons jusqu’à leur lecture par un humain."
  method_title: "La méthode de l’explorateur"
  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions de la filiation sont repérées à la génération du site par un lexique assorti de garde-fous, en six familles : fils et filles (banun, banat, awlad, ibnahu, ibnataha, walad, untha, maw'uda), descendance (dhurriyya, nasl, aqib, Bani Isra'il, Bani Adam), piété filiale et désobéissance (parents, père et mère, birr al-walidayn, uquq, interdiction de leur marquer de l’impatience et appel à l’humilité envers eux), orphelins et allaitement (orphelin, orphelins, allaitement, nourrice, sevrage, grossesse), droits de l’enfant (hadana, aqiqa, tahnik, dénomination, héritage au voisinage du vocabulaire de l’enfance) et enfants des récits (ghulam, Luqman, l’enfant destiné au sacrifice, les deux fils d’Adam). Les termes ambigus sont encadrés : ibn isolé ne compte jamais, car il figure dans chaque isnad et généalogie ; seules ses formes relationnelles avec possessif comptent (ibnahu, ibnataha). L’héritage ne compte qu’auprès de mots désignant les enfants ; les faux positifs vérifiés sont exclus par identifiant. Chaque livre dépouillé par la suite apporte automatiquement ses récits filiaux dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette bunuwwa-browser. Les parents et enfants célèbres sont tirés des relations child_of du graphe."
