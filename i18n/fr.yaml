    nay:
      title: Annonce de décès
      ar: نعي
      desc: Annoncer un décès aux gens, comme le Prophète pour Ja'far, Zayd, Ibn Rawaha et le Négus.
    taziya:
      title: Condoléances
      ar: تعزية
      desc: Consoler et raffermir l'affligé, l'istirja', « à Dieu appartient ce qu'Il a pris et ce qu'Il a donné », et le repas pour la famille du défunt.
    bukaa:
      title: Pleurs et lamentations
      ar: بكاء ونياحة
      desc: Les larmes de l'œil et la tristesse du cœur, permises, et l'interdiction de la lamentation, de se frapper les joues et de déchirer ses vêtements.
  sections:
    quran:
      title: Dans le Coran
      desc: 'Les versets de la patience et de l''istirja'' et chaque mort que mentionne le Coran : l''épreuve des croyants, le chagrin de Ya''qub, toute âme goûtant la mort, la description des martyrs et
        l''âme apaisée.'
    sunnah:
      title: Dans la Sunna
      desc: 'Ce que portent les deux Sahih, le Muwatta et les Sunan : l''annonce du Négus et de Ja''far, les condoléances à la fille du Prophète, ses pleurs sur son fils, l''interdiction de la lamentation
        et l''éloge des gens au passage d''un cortège — chaque récit avec sa source et son numéro.'
    seerah:
      title: Dans la sîra
      desc: 'Ce que portent les livres de la sîra : la mort du Prophète et les pleurs des Compagnons, les élégies de Hassan pour le Prophète, Hamza et les martyrs de Mu''ta et de Bir Ma''una, et l''annonce
        de Zayd, Ja''far et Ibn Rawaha ; cette section se remplit à mesure que de nouveaux textes de sîra sont moissonnés.'
    books:
      title: Dans les autres livres
      desc: 'Les récits des Compagnons, des Successeurs, des historiens et des lettrés : les condoléances d''Umar et de Mu''awiya, les élégies des poètes, les pleurs d''Abu Bakr et d''Umar, et l''annonce
        de la mort des califes et des savants dans les histoires de la communauté — classés le jour où leurs passages arrivent.'
    curated:
      title: Les notices choisies
      desc: 'Les notices du musée sur l''élégie, l''annonce, les condoléances et la lamentation elles-mêmes, et sur les événements et poèmes qui s''y rattachent : l''élégie de Hassan pour le Prophète, celles
        des martyrs de Mu''ta, le chagrin du Prophète pour Ja''far et la mort d''Ibrahim.'
  formulas:
    istirja:
      title: L'istirja' devant la perte
      note: La formule que dit l'affligé, et la supplication d'Umm Salama qui la suit.
    lillah_ma_akhadh:
      title: « À Dieu appartient ce qu'Il a pris et ce qu'Il a donné »
      note: Ce que le Prophète fit dire à sa fille alors que son enfant se mourait.
    sadma_ula:
      title: « La patience, c'est au premier choc »
      note: Le Prophète à une femme qui pleurait près d'une tombe.
    ajirni:
      title: « Ô Dieu, récompense-moi dans mon malheur »
      note: La supplication de l'affligé telle que la rapportent Muslim, Malik et al-Tirmidhi.
    ayn_tadma:
      title: « L'œil pleure et le cœur s'afflige »
      note: Le Prophète à la mort de son fils Ibrahim.
    ya_abatah:
      title: « Ô mon père »
      note: Les mots de Fatima le jour de la mort du Prophète.
    man_kana_yabudu:
      title: « Pur dans la vie et dans la mort »
      note: Abu Bakr auprès du Prophète le jour de sa mort, et son discours ensuite.
    al_jafar:
      title: « Préparez un repas pour la famille de Ja'far »
      note: La sunna de nourrir la famille du défunt.
    nay_najashi:
      title: L'annonce de la mort du Négus
      note: Le Prophète l'annonça le jour de sa mort et pria sur lui en son absence.
    adhkuru_mahasin:
      title: « Rappelez les qualités de vos morts »
      note: La racine de l'élégie permise et de l'éloge des gens au passage d'un cortège.
  viz:
    title: Les quatre bannières de deuil
    note: 'Quatre bannières à lisière noire, une par genre de notice : élégie, annonce de décès, condoléances, et pleurs et lamentations ; chacune montre combien de notices elle porte, une barre de leur
      provenance dans les sources et trois notices à ouvrir. Comptées ici : {n} notices, toutes dans les listes ci-dessous. Les genres viennent du détecteur et des notices choisies, non d''un jugement du
      musée.'
