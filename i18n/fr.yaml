      desc: 'Ce que les ouvrages de sira rapportent des piliers, de la foi et des qualités des croyants : l’enseignement religieux aux délégations, les lettres du Prophète aux tribus et les attitudes des
        Compagnons ; cette section s’enrichit avec les nouveaux textes de sira.'
    books:
