  method_note: "Chaque notice est une notice ordinaire du musée, avec ses sources et ses textes en trois langues. Les mentions de fraternité sont repérées à la génération du site par un lexique assorti de garde-fous, en six familles : frères et sœurs (ukhuwwa, ikhwa, ikhwan, akhawat, fraternité des croyants et des musulmans), établissement de liens fraternels (akha, yu'akhi, mu'akhat, ikha', Émigrés et Auxiliaires auprès d’un mot de fraternité), amour pour Dieu (aimer pour Dieu, amour mutuel, aimer pour son frère), altruisme et entraide (préférer autrui, ithar, secourir son frère, répondre à son besoin, comparaisons à l’édifice et au corps), droits du frère (droits fraternels et musulmans, visite au malade, réponse à l’éternuement, acceptation d’une invitation, réponse au salut) et avertissements contre la rupture (envie, haine, éloignement, soupçon, médisance du frère). Les termes ambigus sont encadrés : akh ne compte qu’avec un possessif ou dans une annexion définie ; an akhihi dans un simple isnad ne compte pas sans autre mot de fraternité dans le passage ; iyada et tashmit ne comptent qu’en contexte de droits, hasad, ghiba et hajr qu’auprès d’un mot de fraternité. Les faux positifs vérifiés sont exclus par identifiant ; chaque livre dépouillé par la suite apporte automatiquement ses récits dès que ses passages intègrent le graphe ; les notices thématiques les rejoignent par l’étiquette ukhuwwa-browser. Les fratries sont tirées des relations sibling_of du graphe."
