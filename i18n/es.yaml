messengers:
  title: "Explorador de mensajeros y profetas"
  lede: "Todas las menciones de los mensajeros y profetas en las fuentes del museo: los profetas y mensajeros con nombre en el Corán, la Sunna y la sira, los portadores de historias, linajes y misiones, los profetas que no se nombran, y cada mención de los mensajeros y profetas en cada libro cosechado: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: "Explorador de mensajeros y profetas"
  status: "Esta versión contiene {n} registros en {s} secciones y {p} páginas de tema; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Las menciones de profetas y mensajeros se encuentran en el momento de la compilación mediante un léxico protegido sobre los textos de los pasajes: las formas con nombre coinciden directamente, las formas ambiguas como «صالح» y «يحيي» cuentan solo junto a sus propias colocaciones, «ابن آدم» se descarta porque significa la humanidad y no Adán, y los falsos positivos verificados se excluyen por id; también entran las aleyas y relatos ya vinculados mediante aristas mentions explícitas; cada libro cosechado más adelante aporta aquí sus menciones de profetas de forma automática cuando sus pasajes llegan al grafo, y los registros curados se incorporan mediante la etiqueta messengers-browser."
