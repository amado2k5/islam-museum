      desc: "Los límites de Dios y los pecados mayores en la revelación: «estos son los límites de Dios, no os acerquéis a ellos», «quien transgrede los límites de Dios se ha hecho mal a sí mismo», «la fornicadora y el fornicador: azotad a cada uno», «el ladrón y la ladrona: cortadles las manos», el castigo del bandidaje, el talión y los kaba'ir."
    sunnah:
      title: "En la Sunna"
      desc: "Hadices de los dos Sahih, el Muwatta y los Sunan: «evitad los siete destructores», la aplicación de los hudud a quienes confesaron, la lapidación de Ma'iz y de la mujer ghamidí, los hudud de la calumnia, el vino y el robo, y los capítulos de hudud en las colecciones metódicas."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen de menciones de hudud y kaba'ir (la aplicación de las penas en Medina y los momentos de los Compañeros y los Sucesores con los grandes pecados); esta sección se completa sola a medida que llega nuevo texto de la sira."
    books:
