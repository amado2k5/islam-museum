  guide_title: "Qué ofrece el Explorador de la Línea del Tiempo"
  guide_lede: "El Explorador de la Línea del Tiempo te permite elegir un tema (una persona, una época o una ciudad) y recorrer su historia parada a parada. Cada parada es un registro del museo, con su fecha en los calendarios hijri y gregoriano, un texto breve y sus fuentes."
  guide_features_title: "Qué puedes hacer"
  guide_feature_list: "Elige un tema en los estantes o búscalo por nombre.|Empieza un recorrido guiado: un conjunto de paradas en orden cronológico, con «Parada 3 de 9» a medida que avanzas.|Avanza por la línea del tiempo con las flechas, seleccionando una parada o con las teclas de flecha.|Abre Detalles completos, mira el lugar En el mapa si lo tiene, o sigue Contexto y relaciones por el museo.|Lee las personas, los lugares y las fuentes relacionados junto a la historia; las fuentes cambian a medida que avanzas.|Activa Para niños cuando una parada tenga un texto escrito para el público infantil."
  guide_usage_title: "Cómo usarlo"
  guide_usage_list: "Cada parada tiene su propia dirección, para que puedas compartirla o volver a ella.|Las fechas marcadas como aproximadas o discutidas se muestran así, tal como las dan las fuentes.|Desde una entrada del museo que tenga una historia, pulsa Explorar la línea del tiempo para abrirla."
  guide_limits_title: "Qué no hace"
  guide_limits_list: "No usa IA mientras lo lees. Todo lo que hay en la página se preparó de antemano.|No busca en la web. Los temas que no están preparados muestran: Aún no está en el Explorador de la Línea del Tiempo.|No pide inicio de sesión y no guarda ningún registro sobre ti.|El texto para niños solo se muestra donde se ha escrito y comprobado."
