jinn-devils:
  title: "Explorador de jinn y demonios"
  lede: "Jinn, demonios y diablos, ángeles, y los sueños que los llevan: cada ser, encuentro y relato que registran el Corán, el hadiz, la sira y los libros cosechados, reunidos en un solo explorador con sus fuentes."
