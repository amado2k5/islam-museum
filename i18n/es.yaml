arkan:
  title: "Explorador de los pilares del islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente"
  lede: "Cuatro puertas en un solo explorador: los cinco pilares sobre los que se edifica el islam, los seis pilares de la fe del hadiz de Jibril, las ramas de la fe que el hadiz cuenta como setenta y tantas, y los rasgos del creyente tal como los describen las aleyas y los hadices. El explorador reúne todos los lugares donde se mencionan estos cuatro temas en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores, y los libros de fe, comentario, ascetismo e historia, así como cada mención en cualquier libro que se coseche a partir de ahora. El museo describe lo que dicen las fuentes y atribuye cada dicho a su autor; no emite dictámenes."
  badge: "Explorador de pilares, ramas y rasgos"
  status: "Esta versión contiene {n} registros en {s} secciones, cada uno con cita de su fuente."
  method_title: "Cómo funciona el explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes. Las aleyas del Corán proceden de una tabla revisada que nombra las aleyas que las colecciones de hadices y los comentarios vinculan con cada tema, porque el Corán no usa los términos posteriores «pilares» o «ramas de la fe»; el texto de una aleya es el texto congelado de Tanzil de su registro. Cualquier otro pasaje se encuentra en el momento de la compilación mediante un léxico protegido sobre su texto: los cuatro términos mismos, el hadiz «El islam se edifica sobre cinco», las respuestas a las preguntas sobre el islam y la fe, la oración, el zakat, el ayuno y la peregrinación nombrados juntos, la creencia en Dios, Sus ángeles, Sus libros, Sus mensajeros, el Último Día y el decreto, «setenta y tantas ramas», lo que un texto cuenta como parte de la fe, «ninguno de vosotros cree hasta que», y las descripciones del creyente y del musulmán. Las señales débiles, como un solo artículo de fe o el aumento y la disminución de la fe, cuentan solo junto a una fuerte o de dos en dos. Cada libro cosechado más adelante aporta aquí sus menciones de forma automática cuando sus pasajes llegan al grafo, y los registros curados se incorporan mediante la etiqueta arkan-browser. Los extractos de libros escaneados son de lectura automática y no están corregidos, y cada registro de ese tipo lo indica."
  api: "El conjunto de datos completo está disponible en"
  sections_title: "Secciones"
  filter_label: "Filtrar los registros"
  filter_none: "No hay resultados coincidentes."
  empty: "Todavía no hay registros bajo este tema en esta versión."
  sections:
    quran:
      title: "En el Corán"
      desc: "Las aleyas que las colecciones de hadices y los comentarios vinculan con los cuatro temas: las aleyas del testimonio, la oración junto al zakat, las aleyas del ayuno y la peregrinación, las aleyas de la creencia en Dios, Sus ángeles, Sus libros, Sus mensajeros, el Último Día y el decreto, las aleyas del aumento de la fe, y los pasajes que describen a los creyentes y a los siervos del Misericordioso."
    sunnah:
      title: "En la Sunna"
      desc: "Hadices de los dos Sahih, los Sunan y el Muwatta y sus comentarios: el hadiz de Jibril, el islam edificado sobre cinco, la delegación de 'Abd al-Qays, el envío de Mu'adh a Yemen, las ramas de la fe, la dulzura de la fe, «ninguno de vosotros cree hasta que», y las semejanzas y descripciones del creyente."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de la sira recogen sobre los pilares, la fe y los rasgos de los creyentes: las delegaciones a las que se enseñó su religión, las cartas del Profeta a las tribus y las actitudes de los Compañeros; esta sección se completa a medida que llega nuevo texto de la sira."
    books:
      title: "En otros libros"
      desc: "Los cuatro temas en toda obra cosechada distinta del Corán, el hadiz y la sira: los libros de fe y credo, las biografías y relatos de los Compañeros y los Sucesores, los libros de ascetismo, fiqh e historia, y lo que venga después."
    curated:
      title: "Registros sobre los pilares, las ramas y los rasgos"
      desc: "Los registros curados del museo sobre los propios temas: los cinco pilares del islam y cada pilar, los seis pilares de la fe y cada artículo, las ramas de la fe y el libro de al-Bayhaqi sobre ellas, y los rasgos del creyente con sus conceptos afines."
  topics:
    islam:
      title: "Los pilares del islam"
      short: "Los cinco sobre los que se edifica el islam: los dos testimonios, establecer la oración, dar el zakat, ayunar en Ramadán y la peregrinación a la Casa."
      desc: "Todo lo que contienen las fuentes del museo sobre los cinco pilares del islam: los dos testimonios, la oración, el zakat, el ayuno de Ramadán y la peregrinación, en el Corán, la Sunna, la sira y otros libros."
      scope: "Se incluyen aquí: los textos que nombran los pilares, los cuentan juntos o definen el islam por ellos, y las aleyas del testimonio, la oración, el zakat, el ayuno y la peregrinación nombradas en la tabla coránica. El detalle de cada acto de culto está en el Explorador de culto y adhkar."
    iman:
      title: "Los pilares de la fe"
      short: "Los seis del hadiz de Jibril: la creencia en Dios, Sus ángeles, Sus libros, Sus mensajeros, el Último Día y el decreto, su bien y su mal."
      desc: "Todo lo que contienen las fuentes del museo sobre los seis pilares de la fe: la creencia en Dios, Sus ángeles, Sus libros, Sus mensajeros, el Último Día y el decreto, en el Corán, la Sunna, la sira y otros libros."
      scope: "Se incluyen aquí: los textos que nombran los pilares de la fe, los cuentan juntos o responden a la pregunta sobre la fe, y la creencia en el decreto. El detalle de los ángeles, el Último Día y los mensajeros está en sus propios exploradores."
    shuab:
      title: "Las ramas de la fe"
      short: "Las setenta y tantas ramas: la más alta es decir que no hay más dios que Dios, la más baja es apartar un estorbo del camino, y el pudor es una de ellas."
      desc: "Todo lo que contienen las fuentes del museo sobre las ramas de la fe: el hadiz de las setenta y tantas ramas, lo que un texto cuenta como parte de la fe, la dulzura y la plenitud de la fe, y aquello sin lo cual la fe no es completa, en el Corán, la Sunna, la sira y otros libros."
      scope: "Se incluyen aquí: los textos que nombran las ramas o cuentan un acto, una palabra o un estado como parte de la fe, los textos que vinculan un acto con la creencia en Dios y el Último Día, y las aleyas del aumento de la fe. Una nota al pie que cita el título del libro de al-Bayhaqi no se cuenta como mención."
    khisal:
      title: "Los rasgos del creyente"
      short: "Aquello por lo que las aleyas y los hadices describen al creyente: humildad en la oración, honradez, misericordia con los demás creyentes, paciencia y veracidad."
      desc: "Todo lo que contienen las fuentes del museo sobre los rasgos del creyente: las aleyas que describen a los creyentes y a los siervos del Misericordioso, los hadices de la semejanza del creyente, las descripciones del creyente y del musulmán y lo que un creyente debe a otro creyente, y los relatos de los Compañeros y los Sucesores."
      scope: "Se incluyen aquí: los textos que describen al creyente o al musulmán, les dan una semejanza o cuentan sus rasgos. El carácter en general está en el Explorador de akhlaq."
