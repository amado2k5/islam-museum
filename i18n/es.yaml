    sunnah:
      title: "En la Sunna"
      desc: "Los informes del Libro de la Medicina y el Libro de los Enfermos en los dos Sahih, los Sunan y el Muwatta: un remedio para cada enfermedad; ventosas, miel y cauterización; comino negro, costus, talbina, trufas y dátiles 'ajwa; ruqya; fiebre, peste, contagio y el leproso; visitar a los enfermos; el tratamiento de los heridos; y la prohibición de tratarse con lo prohibido."
    seerah:
