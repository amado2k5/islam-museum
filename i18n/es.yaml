    sunnah:
      title: "En la Sunna"
      desc: "Los hadices de los dos Sahih, el Muwatta, los Arba'in y los Sunan: el largo hadiz de la intercesión, lo primero sobre lo que se interroga al siervo, los pies que no se mueven hasta que se les pregunta, los siete a quienes cobija Su sombra, el Hawd y el Sirat, y los dichos de los Compañeros y los Sucesores sobre el Día."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen sobre la Resurrección, la reunión y el ajuste de cuentas — esta sección se llena sola a medida que llegan nuevos pasajes de sira."
    books:
      title: "En los libros recopilados"
      desc: "Menciones de qiyama en cada una de las demás obras recopiladas — credo, exégesis, historia, poesía y lo que llegue después — clasificadas por el género de la obra el día en que llegan sus pasajes."
