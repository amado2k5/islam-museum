  title: "Registro, calculadora y contador de hasanat y sayyi'at"
  lede: "Lo que dicen las fuentes del museo sobre la cuenta de las obras: las aleyas, los hadices y los relatos de la sira, de los Compañeros y de los Sucesores que cuentan una buena obra y una mala, las registran, las multiplican, las borran y las pesan en quirats, grados y la balanza. Una lista de todos esos textos, una calculadora que lee las cifras que los textos señalan para actos concretos y un contador de recuento que permanece en tu navegador."
  badge: La cuenta de las obras en los textos
  status: "Esta compilación contiene {n} registros en {s} secciones, {r} de ellos filas de la calculadora; los textos son borradores hasta que los lea una persona."
  parts_title: Partes de la página
  read_more: Leer el artículo
  caveat_title: Antes de contar
  caveat: "Esta página describe lo que contienen los textos y no calcula el destino de nadie. Cada cifra procede de un texto citado a su lado, y los propios textos hacen depender la cifra de la intención, la aceptación, la evitación de los pecados mayores y la reparación de los agravios, y dicen que lo que está por encima de la cifra es una generosidad que ningún número limita. El museo no emite dictámenes: donde las narraciones difieren se muestran tal como llegaron, y donde un texto no indica ninguna cifra su resultado se escribe con sus propias palabras y no se convierte en número."
  method_title: El método de la página
  method_note: "Cada registro de aquí es un registro corriente del museo, con sus fuentes. Los textos de la lista se encuentran en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes: un número de buenas o malas obras, los múltiplos de diez y de setecientos, el registro de una obra, el borrado, la remisión y la expiación de las malas obras, el perdón de lo pasado, los grados y el quirat, lo que equivale a un acto mayor, la balanza y el peso de un átomo, los nobles escribas y el registro de las obras, el arruinado y las cargas, y la cuenta. Una simple mención de buenas o malas obras sin recuento permanece en los exploradores de hasanat y sayyi'at. Los falsos positivos verificados se excluyen por identificador, y cada libro recopilado más adelante aporta sus textos aquí automáticamente el día en que sus pasajes llegan. Las filas de la calculadora son registros curados con un campo de cómputo que lee la cifra de un texto concreto."
