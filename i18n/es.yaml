umam:
  also_under: "También en:"
  title: "Explorador de naciones, religiones, sectas y pueblos no musulmanes"
  lede: "Las naciones, religiones, sectas y pueblos no musulmanes nombrados en el Corán, el hadiz y los relatos y libros de los Compañeros y los Sucesores: las naciones desaparecidas, desde 'Ad y Thamud hasta el pueblo de Tubba', la Gente del Libro, los magos y los sabeos, los politeístas de Arabia, los reyes y las figuras de la tierra y los pueblos lejanos — cada aleya, relato y narración que los nombra, cada mención con su fuente."
  badge: "Explorador de naciones y pueblos"
  status: "Esta compilación contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los revise."
  method_title: "Cómo funciona el explorador"
  method_note: "Cada registro de aquí es un registro corriente del museo —con fuentes y en tres idiomas— sin ninguna tabla auxiliar. Los registros curados llevan la etiqueta umam-browser y las etiquetas um-<section>; toda obra, pasaje o pregunta con una arista «mentions» hacia un miembro del explorador se incorpora a «Menciones en las fuentes» más las secciones del destino; y un léxico controlado lee los textos de los pasajes y recoge solo nombres inequívocos, de modo que un libro recopilado más adelante aparece aquí el día en que llegan sus aristas. El texto del Corán nunca se escanea léxicamente: sus aleyas se incorporan solo mediante aristas «mentions» revisadas."
  api: "El conjunto de datos completo está en"
  sections_title: "Secciones del explorador"
  filter_label: "Filtrar registros"
  filter_none: "No hay registros coincidentes."
  empty: "Aún no hay registros en esta compilación."
  mentioned_title: "Las naciones más mencionadas en las fuentes"
  mentioned_in: "Mencionado en:"
  timeline_title: "En la cronología"
  timeline_caption: "Registros fechados: {n} · sin fecha: {u}"
  sections:
    umam:
      title: "Las naciones relatadas"
      desc: "Las naciones que el Corán relata y que Dios destruyó: 'Ad, Thamud y Saba', los pueblos de Nuh, Lut y Shu'ayb, los Compañeros de al-Rass, del Foso y de la Ciudad, el pueblo de Tubba' y el pueblo del Faraón — cada nación con sus aleyas y relatos."
    adyan:
      title: "Las religiones"
      desc: "Las confesiones que nombran el Corán y el hadiz: los judíos, los cristianos, los magos y los sabeos — las religiones entre las cuales y el islam hubo pacto, guerra y dhimma."
    tawaif:
      title: "Sectas y tribus"
      desc: "Las comunidades dentro de las religiones y las tribus árabes cuya gente siguió una fe distinta del islam: Banu Qaynuqa', al-Nadir y Qurayza, los judíos de Khaybar, los cristianos de Najran, Gassan y Lajm — tal como los nombran los libros."
    shuub:
      title: "Pueblos y naciones"
      desc: "Los pueblos lejanos y cercanos de la tierra que registran las fuentes: los romanos, los persas, los abisinios, los coptos, los turcos, la India, la China, los bereberes, los zanyes, los eslavos, los rus y los nabateos — la gente de reinos y provincias."
    mushrikun:
      title: "Los politeístas de Arabia"
      desc: "Los adoradores de ídolos de Arabia antes del islam: la gente de La Meca y de Quraysh y quienes compartían su religión, sus ídolos y ritos y su causa hasta la Conquista — una sección propia, pues no eran ni Gente del Libro ni otro credo."
    ayan:
      title: "Figuras nombradas"
      desc: "Las personas que las fuentes nombran de estas naciones: Heraclio y Josrow, el Negus, al-Muqawqis y al-Mundhir ibn Sawa, los rabinos de los judíos de Medina, los señores de los politeístas de Quraysh y los de otra fe antes del islam."
    sukun:
      title: "Tierras y moradas"
      desc: "Las tierras y los lugares que habitaron estas naciones: Najran y Khaybar, al-Hira y Busra, Yathrib, al-Ahqaf y Petra — cada lugar con su relato."
    mafahim:
      title: "Conceptos"
      desc: "El vocabulario de las fuentes sobre estas naciones: la Gente del Libro, la gente de la dhimma, la jizya, el shirk, el kufr, la hipocresía, el hanif y la umma — las ideas que clasificaban las relaciones."
    kutub:
      title: "Libros y fuentes"
      desc: "Las obras que conservan los relatos de estas naciones: los tafsires y los sahih, los libros de sira y maghazi, las historias y crónicas de conquistas y las herejiografías — cada libro en su función."
    dhikr:
      title: "Menciones en las fuentes"
      desc: "Toda aleya, pasaje, obra, evento y pregunta del museo que nombra una nación, religión, secta o pueblo no musulmán — se incorpora aquí mediante una arista «mentions» o por su nombre inequívoco en el texto, con la sección o secciones de su destino."
  viz:
    caption: "El mapa del mundo de los textos: La Meca y Medina en el centro, Roma al noroeste, Persia al noreste y Abisinia al suroeste, la Gente del Libro como una franja a través del medio, las naciones desaparecidas bajo la línea del horizonte, los pueblos lejanos en el borde. Cada punto es un registro real y un vínculo real."
    aria: "Diagrama del mundo de los textos: las naciones, religiones y pueblos alrededor de La Meca y Medina"
