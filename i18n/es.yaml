khutab:
  viz:
    title: "La línea del tiempo del minbar"
    note: "Cada marca es un sermón, situado según el año hijri que da su registro; las marcas se apilan donde los años son cercanos, y la forma y el tono indican qué tipo de sermón es. Una marca atenuada tiene un año aproximado, tomado de una tradición. Selecciona una marca para leer quién habló y cuándo."
