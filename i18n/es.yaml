    ihtidar: "La última enfermedad y el lecho de muerte: las últimas palabras, quién estaba presente, qué se recitó y cómo los libros relatan la hora de la muerte."
    mirath: "Lo que dejaron: dinero, tierras, armas, libros y deudas; herederos y albaceas; y el dicho del Profeta de que a los profetas no se les hereda."
    athar: "Pertenencias conservadas tras sus dueños (el manto, el anillo, la espada, el cabello) y las huellas que nombra el Corán, como el Arca y el Maqam de Ibrahim."
    marqad: "El lavado, la mortaja, la oración fúnebre y el entierro; las tumbas y cementerios que nombran las fuentes, y dónde los relatos difieren sobre el lugar de una tumba."
