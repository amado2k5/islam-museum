  hadith_note: "«Dios tiene noventa y nueve nombres, cien menos uno; quien los enumere entrará en el Paraíso», transmitido por al-Bujari y Muslim. La lista que se muestra aquí es la enumeración del Yami' al-Tirmidhi (3507); donde la lista de Ibn Maya difiere, el registro del nombre lo indica."
