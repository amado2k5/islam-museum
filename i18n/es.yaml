mukatabat:
  title: "Explorador de mukatabat"
  lede: "Todas las menciones de correspondencia en las fuentes del museo: las cartas que el Profeta envió a reyes y emperadores y las cartas, respuestas e informes que volvieron, las cartas de los califas a sus gobernadores y los informes que se les escribieron, la carta de Sulayman a la reina de Saba en el Corán, y cada mención de correspondencia en la sira, los libros de hadices y cada libro cosechado: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: "Explorador de correspondencia"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. La correspondencia se encuentra en el momento de la compilación mediante un detector protegido sobre los textos de los pasajes: señales de enviar, traer, abrir, encontrar, leer y responder, encabezados de cartas citadas ⁦(«من محمد إلى هرقل»، «من عمر إلى معاوية»)⁩, encabezados de carta con basmala, las instituciones de la cancillería ⁦(ديوان الخاتم، ديوان البريد، ديوان الإنشاء، صاحب البريد)⁩ y los sustantivos de género «مكاتبات/مراسلات»; el contrato de autocompra de la mukataba del fiqh, el sentido de libro divino ⁦(«كتب الله»، «في كتاب الله»)⁩, los escribas de contratos de deuda, el «إلى» cuantitativo y los sentidos de página del mushaf quedan fuera, los falsos positivos verificados se excluyen por id, y cada libro cosechado más adelante aporta aquí sus cartas de forma automática cuando sus pasajes llegan al grafo; los registros curados se incorporan mediante la etiqueta mukatabat-browser. Cada pasaje se marca como carta cuando contiene una carta real y como mención cuando solo trata de correspondencia, y las fichas de remitente clasifican la correspondencia como profética, califal, real u otra."
