  filter_none: Sin resultados coincidentes.
  empty: Aún no hay registros de madhhabs en esta versión.
  sections:
    aima:
      title: Los cuatro imames
      desc: "Los imames muytahid en torno a quienes giró el fiqh: Abu Hanifa al-Nu'man, Malik ibn Anas, Muhammad ibn Idris al-Shafi'i y Ahmad ibn Hanbal: sus vidas, sus escuelas y lo que compusieron y transmitieron."
    hanafi:
      title: Los hanafíes
      desc: "La escuela de Abu Hanifa: sus discípulos, sus libros, su método de razonamiento jurídico y lo que se escribió en sus tabaqat."
    maliki:
      title: Los malikíes
      desc: "La escuela de Malik ibn Anas y la gente de Medina: sus discípulos, sus libros, la práctica de Medina en que se apoya y lo que se registró en sus tabaqat."
    shafii:
      title: Los shafi'íes
      desc: "La escuela de al-Shafi'i: sus discípulos, sus libros, su método de usul y qiyas, y lo que siguieron los sabios posteriores."
    hanbali:
      title: Los hanbalíes
      desc: "La escuela de Ahmad ibn Hanbal: sus discípulos, sus libros y su método de transmisión, doctrina y textos revelados."
    ukhra:
      title: Otras escuelas
      desc: "Escuelas jurídicas fuera de las cuatro, tal como la tradición las registró: las escuelas zahirí, ya'farí e ibadí, mostradas en su propia sección para que las cuatro madhhabs sigan siendo el marco."
    salaf:
      title: Los salaf y los tabi'in
      desc: "La generación sobre la que se construyó el fiqh antes de que las escuelas se asentaran: los imames de Kufa, Basora y el Hiyaz entre los Sucesores y los sucesores de estos: Ibrahim al-Nakha'i, al-Sha'bi, al-Awza'i, Sufyan al-Thawri y otros como ellos."
    kutub:
      title: Los libros
      desc: "Los códices y tratados que fundaron las escuelas o las compararon, y los mutun didácticos que los estudiantes memorizan: la Ajurrumiyya, las Alfiyyas, el Quduri, la Risala de al-Qayrawani, el Matn Ibn Ashir, el Matn Abi Shuja', la Tahawiyya, la Waraqat, la Bayquniyya, la Jazariyya y la Shatibiyya, junto al Muwatta, la Hidaya, el Mughni, los estudios comparados y las historias de las madhhabs."
    mafahim:
      title: Los conceptos
      desc: "Los términos de fiqh y usul que dependen de las escuelas: la madhhab misma, el ijtihad, el qiyas, el istihsan, el taqlid, el ikhtilaf, la gente del hadiz y del ra'y."
    dhikr:
      title: Menciones en las fuentes
      desc: "Cada libro, pasaje o cuestión del museo que menciona las cuatro madhhabs o una de ellas (historias de las escuelas, tabaqat de los juristas, fatuas y cuestiones comparadas), con su fuente."
  viz:
    title: "Cuatro escuelas, lado a lado en el tiempo"
    note: "Cada columna es una escuela, y las cuatro comparten un mismo eje de tiempo en siglos hijríes. Una barra es la vida de un sabio, del nacimiento a la muerte; una barra corta rematada en su base marca a un sabio de quien solo consta el año de su muerte; un rombo es un libro, situado en el año de la muerte de su autor. Pasa el cursor, enfoca o toca para leer; los arcos muestran quién estudió con quién. Solo se dibujan los registros con fecha."
