usra:
  title: "Explorador de la familia y los matrimonios"
  lede: "Los matrimonios famosos del islam y la familia musulmana en las fuentes del museo: los matrimonios del Profeta y de los Compañeros, los cónyuges e hijos de los hogares musulmanes, sus viviendas y aposentos, su sustento y manutención, los detalles de su vida diaria — sueño, vestido, comida y servicio — y sus costumbres sociales — pedir permiso, los vecinos, los huéspedes, los regalos y la buena compañía — en el Corán, los dos Sahih, el Muwatta y los Sunan, los libros de sira, los informes de los Compañeros y los Sucesores, y cada libro recopilado — registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de familia y matrimonios
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa en tres idiomas. Las menciones de la vida familiar se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes, en seis familias: matrimonio ⁦(نكاح، زواج، زوجة، مهر، وليمة، عرس)⁩, la familia y los hijos ⁦(أسرة، عيال، بنون، أولاد، ذرية، والدين، رضاعة)⁩, viviendas ⁦(مسكن، مساكن، حجرات، بيتهم، دارهم)⁩, sustento ⁦(معيشة، قوت، نفقة، كسوة، رزقهم)⁩, vida diaria ⁦(نوم، ثياب، خادم، فراش، سفرة)⁩ y costumbres sociales ⁦(استئذان، جار، ضيف، هدية، معروف، مجلس)⁩. Las palabras ambiguas están controladas: «زوج» y «بعل» cuentan solo junto a vocabulario matrimonial, «بيت» solo en sus plurales de casa y formas con posesivo, «دار» solo con posesivo, «صداق» solo junto a palabras de matrimonio, y los falsos positivos verificados se excluyen por id; cada libro recopilado más adelante aporta aquí sus informes de vida familiar de forma automática cuando sus pasajes llegan al grafo, y los registros curados se suman mediante la etiqueta usra-browser. Los matrimonios famosos se leen de las propias aristas spouse_of del grafo."
