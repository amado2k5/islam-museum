  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Las menciones de profecía, profetismo, maravilla coránica y escatología se encuentran en el momento de la compilación mediante un léxico protegido sobre los textos de los pasajes: las formas inequívocas coinciden directamente, y las formas ambiguas como «النبي» (el Profeta o un profeta), «المعجز» (una maravilla o un hacedor de maravillas), «السر» (un secreto o un asunto), «الغيب» (lo invisible o el reino de lo invisible) y «الآخرة» (el Más Allá o lo último de una serie) cuentan solo junto a sus propias colocaciones, y los falsos positivos verificados se excluyen por id; cada libro cosechado más adelante aporta aquí sus profecías y maravillas de forma automática cuando sus pasajes llegan al grafo, y los registros curados se incorporan mediante la etiqueta nubuwat-browser."
