    how_title: "Cómo obtiene un registro su tema"
    how: "Los temas se asignan al compilar el sitio, mediante una lista de palabras leída sobre cada pasaje: las palabras para alimentos, bebidas, ventas, matrimonio y demás. Un pasaje puede estar bajo varios temas. La lista puede pasar por alto un pasaje o incluir uno que solo menciona la palabra de pasada; los pasajes con los que no coincidió ninguna palabra de tema están bajo «Otras menciones». El tema indica de qué habla la fuente y nunca es un dictamen."
    row: "Temas"
    other_subjects: "Otros temas"
  subjects:
    principles: { title: "Principios", desc: "Quién puede declarar una cosa lícita o ilícita, lo claro y lo dudoso, la necesidad, y lo que dicen las fuentes sobre prohibir lo que Dios permitió." }
    food: { title: "Alimentos", desc: "La carroña, la sangre, el cerdo, lo sacrificado para otro que no sea Dios, las fieras, los asnos domésticos y los buenos alimentos que las fuentes nombran como lícitos." }
    drink: { title: "Bebidas", desc: "El vino, todo embriagante, el nabidh y las vasijas en que se hacía." }
    hunting-slaughter: { title: "Caza y sacrificio", desc: "La caza de tierra y de mar, el perro adiestrado, el sacrificio de la Gente del Libro, la ofrenda y la caza para quien está en ihram." }
    earnings: { title: "Ganancias y comercio", desc: "La riba, las ventas prohibidas, el soborno, el precio de lo prohibido, los bienes del huérfano y el ganarse la vida con lo lícito." }
    marriage-family: { title: "Matrimonio y familia", desc: "Las mujeres con las que no se puede casar, el parentesco de leche, el divorcio y la reconciliación, las formas prohibidas de matrimonio y el luto." }
    dress: { title: "Vestimenta y adorno", desc: "La seda y el oro, los anillos, las prendas, las vasijas de oro y plata, y la alteración del cuerpo." }
    life-honour: { title: "Vida, bienes y honra", desc: "La inviolabilidad de la sangre, los bienes y la honra de un musulmán, y la vida que Dios hizo sagrada." }
    conduct: { title: "Habla y conducta", desc: "Evitar a un hermano más de tres días, la maledicencia, la injusticia, el engaño, el juego de azar, las imágenes y la adivinación." }
    worship: { title: "Culto y votos", desc: "La caridad y a quién le es lícita, el ayuno, el estado de ihram y lo que prohíbe, los votos y los juramentos." }
    sanctuary: { title: "Los santuarios de La Meca y Medina", desc: "Los relatos que declaran inviolables La Meca y Medina: su caza, sus árboles y los objetos perdidos." }
    other: { title: "Otras menciones", desc: "Pasajes que nombran lo lícito o lo ilícito donde no coincidió ninguna palabra de tema." }
  viz:
    title: "El equilibrio de lo lícito y lo ilícito, como lo nombran las fuentes"
    note: "Estos son los pasajes de las fuentes del museo donde aparecen estas palabras, y nada más. La barra muestra cuántos pasajes nombran solo lo lícito, cuántos solo lo ilícito y cuántos nombran ambos. Los dos paneles enumeran los términos del léxico que el detector reconoció en cada lado, con el número de pasajes de cada término en el Corán, la Sunna, la sira y los otros libros. Un pasaje se cuenta bajo cada término que contiene."
