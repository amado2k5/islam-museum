halal:
  title: "Explorador de halal y haram"
  lede: "Todas las menciones de lo lícito y lo ilícito en las fuentes del museo: las aleyas de permiso y prohibición en al-Baqara, al-Ma'ida, al-An'am, al-A'raf y al-Nahl; los hadices «lo lícito es claro y lo ilícito es claro», «todo embriagante es ilícito» y «no es lícito para un musulmán» en los dos Sahih, el Muwatta y los Sunan; lo que la sira y los relatos de los Compañeros y los Sucesores recogen sobre el escrúpulo ante lo ilícito y la búsqueda de ganancias lícitas; los juristas sobre lo que se permitió y lo que se prohibió; y cada mención en cualquier libro que se coseche a partir de ahora. El museo describe lo que dicen las fuentes y atribuye cada opinión a quien la sostiene; no emite dictámenes."
  badge: "Explorador de halal y haram"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "Cómo funciona este explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa trilingüe. Las menciones se encuentran en el momento de la compilación mediante un léxico protegido sobre los textos de los pasajes: «حلال» y «حرام» en sus formas; el verbo de permitir con su sujeto o su beneficiario ⁦(«أحل الله», «أحل لكم», «لا يحل لامرئ»)⁩; el verbo de prohibir con su sujeto o la persona a quien se prohíbe ⁦(«حرم الله», «حرمت عليكم»)⁩; y «التحريم», «المحرمات», «محارم الله» y «الاستحلال». Los verbos sueltos y las palabras vecinas ⁦(«الطيبات», «الخبائث», «الشبهات», «المباح», «المكروه»)⁩ cuentan solo junto a un término fuerte. Lo que no corresponde se elimina antes de la coincidencia: la Mezquita Sagrada, la Casa Sagrada y el mes sagrado; el nombre propio Haram; el estado de ihram y su abandono; y «Dios le prohibió el Fuego». Un libro cosechado más adelante muestra aquí sus menciones el día en que llegan sus pasajes, sin paso de etiquetado. Cuando los juristas difieren, cada opinión se da con quien la sostiene, y el museo no elige entre ellas."
  api: "El conjunto completo está disponible en"
  sections_title: "Secciones"
  filter_label: "Filtrar menciones de halal y haram"
  filter_none: "No hay resultados coincidentes."
  empty: "Todavía no hay registros de halal ni haram en esta versión."
  kinds:
    halal: "lo lícito"
    haram: "lo ilícito"
    both: "lo lícito y lo ilícito juntos"
  sections:
    quran:
      title: "En el Corán"
      desc: "Las aleyas de permiso y prohibición: los alimentos prohibidos en al-Baqara, al-Ma'ida, al-An'am y al-Nahl; las cosas buenas declaradas lícitas, el alimento de la Gente del Libro y la caza del mar; las mujeres con las que no se puede casar en al-Nisa'; la prohibición de la usura y de las indecencias; y la advertencia contra prohibir lo que Dios permitió y contra decir «esto es lícito y esto es ilícito» sin conocimiento."
    sunnah:
      title: "En la Sunna"
      desc: "Hadices de los dos Sahih, el Muwatta y los Sunan, con los relatos de los Compañeros y los Sucesores en los dos Musannaf y los libros de zuhd: «lo lícito es claro y lo ilícito es claro, y entre ambos hay asuntos dudosos», «todo embriagante es ilícito», «se nos hicieron lícitos dos animales muertos y dos sangres», la seda y el oro prohibidos a los hombres, lo que la lactancia hace ilícito, y «todo el musulmán es inviolable para el musulmán»."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira, maghazi y dala'il recogen sobre lo lícito y lo ilícito: el Sermón de la Despedida sobre la inviolabilidad de las vidas y los bienes, la prohibición del vino y de los asnos domésticos en Khaybar, la santidad de La Meca declarada en la Conquista, y las normas sobre el botín; esta sección se completa sola a medida que llega nuevo texto de la sira."
    books:
      title: "En los otros libros"
      desc: "Menciones de lo lícito y lo ilícito en toda obra cosechada distinta del Corán, el hadiz y la sira: las biografías de los Compañeros y los Sucesores y los relatos de su escrúpulo en la Hilya, la Sifat al-Safwa y la Hayat al-Sahaba; los libros de fiqh (al-Mughni, la Mudawwana, Bidayat al-Mujtahid, Fiqh al-Sunna y la Enciclopedia de Kuwait); el Ihya', las Muwafaqat y los comentarios; y lo que venga después, clasificado por el género de la obra el día en que llegan sus pasajes."
    curated:
      title: "Registros sobre halal y haram"
      desc: "Los registros detallados del museo sobre el propio tema: lo lícito, lo ilícito y lo dudoso; la presunción de licitud; quién puede declarar algo lícito o ilícito; lo bueno y lo repugnante; alimentos y bebidas prohibidos; la necesidad; el escrúpulo; las ganancias lícitas; y los relatos de los Compañeros y los Sucesores que buscaban lo lícito."
  subjects_ui:
    title: "Explorar por tema"
    note: "Elige aquello sobre lo que preguntas. Cada tema se abre con los registros propios del museo y las aleyas del Corán, luego los relatos de hadices, la sira y los otros libros. El museo muestra lo que dicen las fuentes y dónde lo dicen; no emite dictámenes, y el dictamen sobre un caso personal es tarea de un erudito, no del museo."
    region: "Doce temas de lo lícito y lo ilícito, cada uno con el número de sus registros y cuántos nombran lo lícito, lo ilícito o ambos"
    count: "{n} registros"
    bar: "{h} nombran lo lícito, {b} ambos, {r} lo ilícito"
