  wing_card: Ala
  related_card: Relacionado
  font: Fuente
  pages:
    heroes:
      title: Héroes del islam
      desc: "El salón de los héroes: seis salones de la virtud (sacrificio, valentía, misericordia, generosidad, conocimiento y firmeza), cada uno con cuatro héroes, sus historias completas y sus fuentes."
      menu: Seis salones de la virtud, veinticuatro héroes
    courses:
      title: "El Explorador de Educación"
      desc: "Tu propia asignatura escolar con el museo dentro: elige tu sistema escolar, curso y asignatura, y cada lección de tu currículo se abre con los eruditos, inventos, lugares y aleyas que van a su lado, todos citados, con una autoevaluación, una vista de aula y un material imprimible."
      menu: "Cursos escolares con el museo dentro de cada lección"
    seerah:
      title: Sira y vida
      desc: 'La sira como método de vida: tarjetas prácticas que organizan tu día, semana, mes, año y etapas de la vida según el modelo profético.'
      menu: Una guía práctica de la vida diaria según la sira
    tafsir:
      title: Explorador de tafsir
      desc: "Comentarios del Corán, volumen a volumen: primero el Jami' al-Bayan de al-Tabari, con cada volumen vinculado a las aleyas que abarca y a su fuente, y los demás tafsires del museo."
      menu: Leer los comentarios del Corán
    quran:
      title: "El Mushaf"
      desc: "El Corán completo para lectura continua, sura por sura: el texto congelado de Tanzil, cada aleya una puerta a su página del museo."
      menu: Leer el Corán, sura por sura
    hadith:
      title: "La Biblioteca del Hadiz"
      desc: "Las colecciones de hadices del museo: explora cada obra por libro y relato, con enlaces a Sunnah.com."
      menu: Explorar las colecciones de hadices
    timeline:
      title: "Tiempo"
      desc: Catorce siglos en un eje hijri interactivo, con el gregoriano como segunda lectura.
      menu: "El eje completo: cada entrada fechada, por año y siglo"
    calendar:
      title: Calendario hijri
      desc: 'Recorre el año hijri mes a mes: cada día con su gemelo gregoriano, las celebraciones, un convertidor y una descarga .ics.'
      menu: Recorrer el año hijri mes a mes
    journeys:
      title: "Viajes"
      desc: 'Recorre la ruta de la Hégira día a día: las estaciones, las distancias y las noches.'
      menu: Recorrer la ruta de la Hégira día a día
    graph:
      title: Explorador de conexiones
      desc: Personas, acontecimientos y lugares dibujados como una constelación de relaciones.
      menu: Relaciones entre personas, acontecimientos y lugares
    map:
      title: "Lugar"
      desc: 'El mundo islámico como mapa interactivo a través del tiempo: regiones, luego ciudades, luego las personas y acontecimientos ligados a cada lugar, con un control deslizante de tiempo hijri.'
      menu: El mapa interactivo a través del tiempo
    revelation:
      title: Revelación e historia
      desc: Lee el Corán en el orden en que fue revelado, junto a los acontecimientos.
      menu: El Corán según fue revelado, con los acontecimientos
    surahmaps:
      title: Mapas de suras
      desc: 'Cada sura como un mapa interactivo: sus temas y estaciones, aleya por aleya.'
      menu: Mapas interactivos de suras
    cards:
      title: Tarjetas del museo
      desc: 'Tarjetas de estudio interactivas: mapas de palabras, listas y relatos.'
      menu: Tarjetas de estudio interactivas
    sighar:
      title: Ala infantil
      desc: 'El rincón infantil del museo: el Jardín de las Palabras y la Búsqueda del Profeta con Hudhud.'
      menu: Rincón infantil interactivo
    timeexplorer:
      title: "Explorador de líneas de tiempo"
      desc: "Recorre la historia de una persona, una época o una ciudad parada por parada en una línea de tiempo interactiva."
      menu: "Paseos guiados: la historia de una persona, época o ciudad, parada por parada"
    khutab:
      title: "Explorador de jutbas y lecciones"
      desc: "Sermones históricos de las colecciones de jutbas y series de lecciones grabadas, cada uno vinculado a su texto y a su fuente."
    fatwa:
      title: "Explorador de fetuas"
      desc: "Fetuas de colecciones de fetuas y de sitios web de fetuas oficiales y conocidos, agrupadas por fuente, cada una resumida con las palabras del museo y vinculada a su página original."
    poetry:
      title: "La Antología de Poesía"
      desc: "Los poemas documentados, organizados bajo sus poetas, cada uno con su ocasión y contexto."
      menu: "Leer poesía por sus poetas"
    qudsi:
      title: "Explorador del hadiz qudsi"
      desc: "Los hadices que el Profeta relata de su Señor en los seis libros y en el Muwatta de Malik: cada hadiz con sus versiones en cada colección, organizado por tema."
      menu: "Explorar los hadices sagrados (hadiz qudsi)"
    jobs:
      title: "Explorador de oficios"
      desc: "Los oficios que desempeñaron las personas en la historia islámica, del juez y el escriba al artesano: cada oficio con las personas que el museo ha registrado hasta ahora en él. Muchos oficios aún no tienen ninguna registrada, y cada uno lo indica."
      menu: "Explorar oficios y artesanías a lo largo de la historia"
    inventions:
      title: "Explorador de inventos"
      desc: "Inventos y descubrimientos con fuentes, desde sus creadores y contextos hasta la obra construida sobre ellos."
      menu: "Explorar inventos y sus cadenas"
    modern:
      title: 'Explorador del islam moderno'
      desc: 'Los últimos cincuenta años del islam y los musulmanes: sitios web, música, películas, conferencias, figuras, organizaciones, deporte, premios y lo que viene después.'
      menu: 'Explorar los últimos cincuenta años'
    companions:
      title: 'Explorador de los Compañeros'
      desc: 'Los Compañeros del Profeta como una red de personas: los Diez, los Muhajirun y los Ansar, la casa del Profeta, las Compañeras, sus clanes, los acontecimientos en que participaron y cuándo murieron.'
      menu: 'Explorar los Compañeros'
    asma:
      title: "Explorador de los Nombres más Bellos"
      desc: "Los noventa y nueve nombres de Dios, cada uno con su significado y los relatos que los registros del museo recogen para él."
      menu: "Explorar los noventa y nueve nombres y sus relatos"
    khulafa:
      title: "Explorador de los califas"
      desc: "Cada califa agrupado por su califato (de los Rashidun a Sokoto), con su reinado, su cadena de sucesión, los acontecimientos de su reinado y el registro citado."
      menu: "Explorar los califas y sus reinados"
    arabiyya:
      title: "Navegador de la lengua árabe"
      desc: "El árabe, lengua del Corán: las aleyas que nombran su lengua, lo que dicen de ella el hadiz, los Compañeros y los sabios, la inimitabilidad de su expresión, y su historia, escritura, gramática, dialectos, mundo, sabios y libros."
      menu: "Recorrer el árabe, lengua del Corán"
    maajim:
      title: "Explorador de diccionarios"
      desc: "Diccionarios árabes e islámicos: quién los escribió, cuándo, a partir de qué obras anteriores, cómo están ordenados y dónde se pueden leer."
      menu: "Explorar los diccionarios y sus autores"
    ghayb:
      title: Explorador del Ghayb
      desc: "jinn y ángeles, el alma, las medidas del tiempo, la Ascensión, el barzaj y las señales de la Hora: lo invisible con sus fuentes."
      menu: "Explorar el mundo de lo invisible"
    nature:
      title: Explorador de la naturaleza
      desc: "Animales, aves, insectos, criaturas marinas, plantas y los fenómenos de la creación en el Corán y el hadiz: cada aleya y relato con su fuente."
      menu: "Explorar la naturaleza en el Corán y el hadiz"
    angels:
      title: "Explorador de los ángeles"
      desc: "Cada mención de los ángeles en el Corán, el hadiz, la sira y los libros suníes (Gabriel, Miguel, Israfil, los escribas que registran, los ángeles de Badr y Hunayn), agrupada por función con cada aleya y relato citado."
      menu: "Explorar los ángeles y sus menciones"
    dreams:
      title: Explorador de sueños
      desc: "Cada visión y sueño mencionado en el Corán, el hadiz, la sira y cada libro recopilado, desde el sueño de José hasta el sueño de Laylat al-Qadr, y cada sueño clasificado el día en que llega su fuente."
      menu: "Explorar los sueños en el Corán, el hadiz y la sira"
    dua:
      title: "Explorador de du'a"
      desc: "Cada súplica mencionada en el Corán, la Sunna, la sira y cada libro recopilado, desde «ربِّ اغفر لي» hasta «اللهم إني أعوذ بك»، las oraciones nocturnas del Profeta y las du'a de los Compañeros, con cada aleya y relato citado."
      menu: "Explorar las súplicas en el Corán, el hadiz y los libros"
    ibadat:
      title: "Explorador de culto y adhkar"
      desc: "Cada acto de culto y de recuerdo de Dios mencionado en el Corán, la Sunna, la sira y cada libro recopilado (oración, purificación, ayuno, zakat y caridad, hajj y umra, dhikr y du'a, glorificación y petición de perdón, recitación, arrepentimiento y ruqya), con cada aleya y relato citado."
      menu: "Explorar el culto y los adhkar en el Corán, el hadiz y los libros"
    nar:
      title: "Explorador del Fuego"
      desc: "Cada mención del Fuego en el Corán, la Sunna, la sira y cada libro recopilado (Jahannam, Saqar, al-Jahim, al-Hutama, Ladha, al-Hamiya y al-Sa'ir, sus guardianes, su combustible, su alimento y el puente sobre él), y también el fuego de este mundo: el fuego de Ibrahim, el árbol ardiente de Musa y el fuego de la guerra, con cada aleya y relato citado."
      menu: "Explorar el Fuego en el Corán, el hadiz y los libros"
    janna:
      title: "Explorador del Paraíso"
      desc: "Cada mención del Paraíso (al-janna) en el Corán, la Sunna, la sira y cada libro recopilado (al-Firdaws, los jardines de 'Adn, Dar al-Salam, sus ríos, puertas, grados, suelo y gente, y cada relato de los Compañeros y los Sucesores), con cada aleya y relato citado."
      menu: "Explorar el Paraíso en el Corán, el hadiz y los libros"
    qiyama:
      title: "Explorador de la Resurrección y el Juicio"
      desc: "Cada mención de la Resurrección, el Día del Juicio y el Ajuste de cuentas en el Corán, la Sunna, la sira y cada libro recopilado (los nombres del Día, la Trompeta, la resurrección y la reunión, los terrores, la exposición y los registros, la Balanza, la Sombra, el Hawd, la intercesión y el Sirat), con cada aleya y relato citado."
      menu: "Explorar la Resurrección, el Día y el Ajuste de cuentas"
    tibb:
      title: "Explorador de medicina: medicina profética, medicina, anatomía, cirugía, fármacos y tratamiento en el islam"
      desc: "Todo lo que se menciona sobre la medicina profética, la medicina, la anatomía, la cirugía, los fármacos y la búsqueda de tratamiento en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores, los clásicos médicos y cada libro recopilado (ventosas, miel, comino negro, cauterización y ruqya; enfermedad, contagio, peste y visita a los enfermos; las etapas de la creación y los órganos del cuerpo; el tratamiento de los heridos; fármacos y venenos; el dictamen sobre el tratamiento), con cada aleya y relato citado."
      menu: "Explorar la medicina profética, la medicina, la anatomía, la cirugía, los fármacos y el tratamiento"
    usra:
      title: "Explorador de la familia y los matrimonios"
      desc: "Los matrimonios famosos en el islam, la familia musulmana y su vida diaria: cada mención del matrimonio, los cónyuges y los hijos, las viviendas, el sustento y las costumbres sociales en el Corán, la Sunna, la sira y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar matrimonios, familias y vida diaria en el Corán y los libros"
    ubuwwa:
      title: "Explorador de la paternidad en el islam"
      desc: "Cada mención del padre y la paternidad en el islam (los padres coránicos y sus consejos, la obediencia y la desobediencia a los padres, el Profeta como padre, la paternidad y el linaje, y el huérfano que ha perdido a su padre) en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Tabi'in y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar el padre y la paternidad en el Corán y los libros"
    ukhuwwa:
      title: "Explorador de la fraternidad en el islam"
      desc: "La fraternidad y la hermandad en el islam: cada mención de los hermanos y hermanas en la fe, la mu'akhat entre los Muhajirun y los Ansar, el amor por Dios, el altruismo y la ayuda, los derechos que un musulmán debe a otro y lo que rompe la fraternidad, en el Corán, la Sunna, la sira y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar la fraternidad, la mu'akhat y los derechos de los hermanos en el Corán y los libros"
    sport:
      title: "Explorador de deportes y competiciones en el islam"
      desc: "Equitación, natación, tiro con arco y cada deporte y competición de los musulmanes (lucha y fuerza, carreras y competiciones con apuesta, juego de lanza, juegos de pelota y de tablero, caza y el juego moderno) en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Tabi'in y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar la equitación, la natación, el tiro con arco y todos los deportes de los musulmanes en el Corán y los libros"
    umuma:
      title: "Explorador de la maternidad en el islam"
      desc: "Todo lo que las fuentes mencionan sobre la maternidad (la madre y su posición, el embarazo, el parto, la lactancia, la custodia y la crianza de los hijos, y la obediencia a los padres) en el Corán, la Sunna, la sira y cada libro recopilado, cada aleya y relato con su fuente."
      menu: "Explorar la maternidad y las madres en el Corán y los libros"
    bunuwwa:
      title: "Explorador de los hijos y las hijas en el islam"
      desc: "Todo lo que las fuentes mencionan sobre hijos e hijas, la descendencia y el vínculo filial, en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y cada libro recopilado: la bondad hacia los padres y su opuesto, los huérfanos y la lactancia, los derechos del niño y los hijos e hijas nombrados en los relatos, con cada aleya y relato citado."
      menu: "Explorar a los hijos y las hijas en el Corán y los libros"
    islamiceconomy:
      title: "Explorador de la economía islámica"
      desc: "Cada mención del dinero y la economía islámica, las escrituras y los pactos, y las dotaciones en el Corán, la Sunna, la sira y cada libro recopilado (monedas, usura, deuda, contratos comerciales, pesos y medidas, deberes fiscales, waqf y sadaqa jariya), con cada aleya y relato citado."
      menu: "Explorar el dinero, los sukuk y el waqf en el Corán, el hadiz y los libros"
    trade:
      title: "Explorador del comercio: las caravanas de invierno y de verano, la Ruta de la Seda y el comercio musulmán"
      desc: "Cada mención de las caravanas de invierno y de verano, el ilaf de los Quraysh, la Ruta de la Seda y el comercio musulmán en el Corán, la Sunna, la sira y cada libro recopilado (caravanas, la 'Ir y el rukb, janes y ribats, rutas comerciales, mercados, comerciantes, mercancías, pesos y medidas y comercio marítimo), cada aleya y relato con su fuente."
      menu: "Explorar las caravanas, la Ruta de la Seda y el comercio en el Corán, el hadiz y los libros"
    sayyiat:
      title: "Explorador de las sayyi'at"
      desc: "Cada mención de las sayyi'at y todo lo vinculado a ellas (pecado, culpa, desobediencia, pecados mayores y menores, arrepentimiento y petición de perdón) en el Corán, la Sunna, la sira y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar las sayyi'at y los pecados en el Corán y los libros"
    hudud:
      title: "Explorador de los hudud de Dios y los kaba'ir"
      desc: "Cada mención de los límites de Dios y los pecados mayores («estos son los límites de Dios»; las penas prescritas de lapidación, flagelación, mano amputada y castigo discrecional; los delitos de hadd de fornicación, robo, calumnia, vino, apostasía y bandidaje; y los kaba'ir y los siete destructores) en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Tabi'in y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar los hudud de Dios y los kaba'ir en el Corán y los libros"
    arkan:
      title: "Explorador de los pilares del islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente"
      desc: "Cada mención de los cinco pilares del islam, los seis pilares de la fe, las setenta y tantas ramas de la fe y los rasgos del creyente en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y cada libro recopilado, cada aleya y relato con su fuente."
      menu: "Explorar los pilares del islam y de la fe, las ramas de la fe y los rasgos del creyente"
    ahkam:
      title: "Explorador de las calificaciones legales: obligaciones, actos recomendados, reprobados y prohibidos"
      desc: "Cada mención de las obligaciones, individuales y comunitarias, los actos de obediencia, lo obligatorio, lo recomendado, lo prohibido, lo reprobado, los pecados menores y lo permitido en el Corán, la Sunna, la sira, los relatos de los Compañeros y de los Sucesores y los libros de usul y de fiqh, cada versículo y cada relato con su fuente."
      menu: "Explorar las obligaciones, los actos recomendados, reprobados y prohibidos, y los pecados menores"
    halal:
      title: "Explorador de halal y haram"
      desc: "Cada mención de lo lícito y lo ilícito en el islam (lo que Dios permitió y lo que prohibió en comida, bebida, vestimenta, matrimonio y ganancias) en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y cada libro recopilado, con registros detallados de sus principios y capítulos."
      menu: "Explorar halal y haram en el Corán, la Sunna y los libros"
    hasanat:
      title: "Explorador de las hasanat"
      desc: "Cada mención de las buenas obras (al-hasanat) en el Corán, la Sunna, la sira y cada libro recopilado: «إن الحسنات يذهبن السيئات»، «من جاء بالحسنة فله عشر أمثالها»، el registro de las buenas obras, el buen préstamo a Dios y «الحسنى», con cada aleya y relato citado."
      menu: "Explorar las buenas obras (al-hasanat) en el Corán y los libros"
    hisab:
      title: "Libro de cuentas, calculadora y contador de hasanat y sayyi'at"
      desc: "Cada texto que cuenta, escribe, multiplica, borra o pesa una obra en el Corán, la Sunna, la sira y cada libro recopilado, con una calculadora que lee las cifras que nombran los textos y un contador; cada cifra se atribuye a su texto."
      menu: "Libro de cuentas, calculadora y contador de buenas y malas obras"
    mukatabat:
      title: "Explorador de las mukatabat"
      desc: "Cada mención de la correspondencia en el Corán, la Sunna, la sira y cada libro recopilado (las cartas del Profeta a reyes y emperadores, las cartas de los califas y los relatos escritos como respuesta, la carta de Sulayman a la Reina de Saba), con cada aleya y relato citado."
      menu: "Explorar las cartas y la correspondencia en el Corán y los libros"
    munazarat:
      title: "Explorador de las munazarat"
      desc: "Cada mención de debates y disputas en el Corán, la Sunna, la sira y cada libro recopilado (las discusiones de Ibrahim con su pueblo y con Nemrod, la mubahala con los cristianos de Najran, el intercambio ante el Negus, el debate de Ibn Abbas con los Jawarech), con cada aleya y relato citado."
      menu: "Explorar los debates y disputas en el Corán y los libros"
    ritha:
      title: "Navegador de elegías y anuncios de fallecimiento"
      desc: "Todo lo que se dijo en elegía, anuncio de fallecimiento, condolencias y llanto por los muertos en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y cada libro cosechado — el istirŷa', las palabras del Profeta «a Dios pertenece lo que tomó y lo que dio», los anuncios de Ŷa'far, Zayd, Ibn Rawaha y el Negus, las elegías de Hassan y de Ka'b ibn Malik y los límites del lamento — con cada versículo y relato citado."
      menu: "Explorar las palabras célebres de la elegía, el anuncio de fallecimiento y las condolencias"
    juha:
      title: "Navegador de Juha y del folclore islámico"
      desc: "Juha, Nasreddin Hoca, Ash'ab y Nu'ayman, y las anécdotas, agudezas, bromas y risas en el Corán, la Sunna, la sira y los libros de adab e historia recopilados: cada versículo, relato y anécdota con su fuente."
      menu: "Explorar a Juha, las anécdotas, las agudezas y las bromas en el Corán, la Sunna y los libros"
    magic:
      title: "Explorador de la magia y los magos"
      desc: "Cada mención de la magia y los magos en el Corán, la Sunna, la sira y cada libro recopilado (hechicería, adivinos, ruqya, mal de ojo y envidia), con cada aleya y relato citado."
      menu: "Explorar la magia y los magos en el Corán y los libros"
    cosmos:
      title: "Explorador del cosmos: seres, naciones anteriores y secretos del universo"
      desc: "Lo que el Corán, la Sunna y los libros dicen de las criaturas más allá de la Tierra, los siete cielos y tierras, quién habitó la Tierra antes de Adán, los pueblos desaparecidos y los secretos del cosmos, con cada aleya y relato citado y cada opinión etiquetada."
      menu: "Explorar los seres, las naciones anteriores y los secretos cósmicos"
    qiraat:
      title: "Explorador de las lecturas, ortografía, escrituras y puntuación del Corán"
      desc: "Los siete ahruf, las lecturas y sus imames, la recopilación del Corán y la copia de los códices, la ortografía del mushaf y el debate sobre la ortografía ordinaria, sus puntos y signos vocálicos, y las escrituras en que se escribió, con cada aleya y relato citado y cada opinión atribuida."
      menu: "Explorar las lecturas, el rasm, las escrituras y la puntuación del Corán"
    ulama:
      title: "Explorador de los ulemas: pensadores, eruditos, literatos, muhaddiz y escritores"
      desc: "Cada pensador, erudito, literato, muhaddiz y escritor del museo, y todo lo que el Corán, la Sunna, la sira y cada libro recopilado dicen de ellos: sus vidas, su misión, sus citas, sus libros, sus entrevistas y su legado, cada mención con su fuente."
      menu: "Explorar a los pensadores, eruditos, escritores y muhaddiz y sus menciones"
    wasaya:
      title: "Explorador de los testamentos: últimos consejos, legados, reliquias y lugares de reposo"
      desc: "Los últimos testamentos de los profetas, los califas, los Compañeros, los Sucesores, los imames y los justos antes de morir; lo que dejaron; sus reliquias; y sus tumbas, en el Corán, la Sunna, la sira y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar los testamentos, legados, reliquias y tumbas"
    signs:
      title: "Explorador de las señales de la Hora"
      desc: "Cada mención de las señales de la Hora, el Día del Juicio y toda la escatología en el Corán, la Sunna, la sira y cada libro recopilado (las señales mayores y menores, el barzaj, la resurrección, el ajuste de cuentas, el Paraíso y el Infierno), con cada aleya y relato citado."
      menu: "Explorar las señales de la Hora y el Más Allá"
    jinn-devils:
      title: "Explorador de jinn y demonios"
      desc: "jinn, demonios y diablos, ángeles y los sueños que los transmiten: cada mención en el Corán, el hadiz y la sira con su fuente."
      menu: "Explorar jinn, demonios y ángeles"
    messengers:
      title: "Explorador de mensajeros y profetas"
      desc: "Cada mención de los mensajeros y profetas en el Corán, la Sunna, la sira y cada libro recopilado (los profetas nombrados, los mensajeros, los portadores de relatos), con cada aleya y relato citado."
      menu: "Explorar los mensajeros, los profetas y sus menciones"
    miracles:
      title: "Explorador de los milagros divinos y proféticos"
      desc: "Cada mención de los milagros divinos y los milagros de los profetas en el Corán, la Sunna, la sira y cada libro recopilado (el milagro del Corán, la luna partida, el Isra' y el Mi'raj, el bastón, el mar, la camella, el arca, el fuego, el pájaro de arcilla, las palabras en la cuna, la mesa celestial, los signos de Sulayman, los sueños, la anunciación y el arca de la alianza), con cada aleya y relato citado."
      menu: "Explorar los milagros divinos y proféticos"
    qurun:
      title: "Explorador de siglos, años y meses"
      desc: "Cada mención de los siglos, los años, los meses importantes y los meses sagrados en el Corán, la Sunna, la sira y cada libro recopilado (los años nombrados de la sira, los doce meses lunares, los cuatro meses sagrados y la intercalación), con cada aleya y relato citado."
      menu: "Explorar los siglos, años, meses y meses sagrados"
    madhahib:
      title: "Explorador de los cuatro madhhabs"
      desc: "Los cuatro imames y las escuelas que fundaron, los salaf, los libros canónicos y los mutun de las escuelas que los transmiten: cada mención de los madhhabs en los libros suníes con su fuente."
      menu: "Explorar los cuatro madhhabs y sus menciones"
    umam:
      title: "Explorador de las naciones, religiones, sectas y pueblos no musulmanes"
      desc: "Cada nación, religión, secta y pueblo no musulmán nombrado en el Corán, el hadiz, la sira, los relatos de los Compañeros y los Sucesores y cada libro recopilado (las naciones desaparecidas, la Gente del Libro, los politeístas, los reyes y las figuras de la Tierra), cada mención con su fuente."
      menu: "Explorar las naciones, religiones y pueblos y sus menciones"
    bayt:
      title: "Explorador de la casa del Profeta"
      desc: "Todo lo que se menciona sobre la casa y la familia del Profeta (la Gente de la Casa, el clan del Profeta, sus esposas, hijas y descendientes) en el Corán, la Sunna, la sira y los libros recopilados."
      menu: "Explorar la casa y la familia del Profeta"
    nubuwat:
      title: "Explorador de profecías y milagros"
      desc: "Cada profecía del Profeta, prueba de profecía, secreto y maravilla del Corán, milagro y predicción escatológica en el Corán, la Sunna, la sira y cada libro recopilado, con cada aleya y relato citado."
      menu: "Explorar las profecías del Profeta, los secretos del Corán y los milagros"
    places:
      title: "Explorador de lugares sagrados"
      desc: "Cada lugar de santidad, importancia y valor en el islam que mencionan el Corán, la Sunna, la sira, los Compañeros y los Sucesores, y cada libro recopilado: los tres santuarios, las estaciones del hajj, los sitios de la sira, los lugares nombrados en el Corán y cada lugar que nombra un pasaje."
      menu: "Explorar los lugares sagrados e importantes del islam"
    akhlaq:
      title: "Explorador de ética y tratos"
      desc: "Cada mención de la ética y los tratos en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Tabi'in y cada libro recopilado: sinceridad, honradez, lealtad, paciencia, gratitud, humildad, excelencia, pudor, mansedumbre, perdón, devoción sincera, arrepentimiento, generosidad, bondad hacia los padres, lazos de parentesco y el derecho del vecino; mentira, traición, orgullo, ostentación, envidia, avaricia, maledicencia, calumnia, ira, injusticia, desobediencia a los padres, hipocresía y engaño; y venta, riba, deuda, prenda, alquiler, legado, herencia, matrimonio, divorcio, juramentos, testimonio, juicio, pesos y medidas, reconciliación, regalos, garantías, representación, sociedad, salam, transferencia, préstamos, usurpación, derecho de preferencia, acaparamiento, coacción e interdicción, cada aleya y relato con su fuente."
      menu: "Explorar la ética y los tratos en el Corán, el hadiz y los libros"
    ansab:
      title: "Explorador de genealogías, pueblos, subdivisiones tribales y árbol de los profetas"
      desc: "Cada mención de genealogías, pueblos, subdivisiones tribales y el árbol de los profetas en el Corán, la Sunna, la sira y cada libro recopilado: el linaje del Profeta en sus tres partes, las tribus árabes y sus butun y los pueblos, cada relato citado."
      menu: "Explorar genealogías, pueblos, subdivisiones tribales y el árbol de los profetas"
    i3lam:
      title: "Explorador de los comunicadores musulmanes"
      desc: "Cada mención de los comunicadores (el muecín, el pregonero, el jatib, el portavoz del Estado, el katib, el periodista, el profesional de los medios, el influyente, el reformista y el revolucionario) en el Corán, la Sunna, la sira y cada libro recopilado, con las personas que llevaron la palabra."
      menu: "Explorar a los comunicadores musulmanes"
    battles:
      title: "Explorador de batallas, guerras y conquistas"
      desc: "Las expediciones, batallas, asedios, conquistas y guerras de la historia islámica: primero las ghazawat y las saraya, luego por tipo y por época."
      menu: "Explorar las ghazawat, batallas y conquistas"
    timemachine:
      title: Máquina del tiempo
      menu: Viaja a cualquier fecha, en ambos calendarios
    wander:
      title: Deambular
      menu: Una página al azar del museo
