      title: "En el Corán"
      desc: "La filiación en el Corán: «المال والبنون زينة الحياة الدنيا», «لا تقل لهما أف», «واخفض لهما جناح الذل», «للذكر مثل حظ الأنثيين», la niña enterrada viva, los huérfanos, el anuncio de un hijo, el consejo de Ya'qub a sus hijos, los consejos de Luqman a su hijo, y los hijos de Nuh y de Adán."
    sunnah:
      title: "En la Sunna"
      desc: "La filiación en los dos Sahih, el Muwatta y los Sunan: «أمك ثم أمك», «الجنة تحت أقدام الأمهات», los informes de birr y uquq y de la ruptura de los lazos de parentesco, la aqiqa, el tahnik, el nombre y el adhan en el oído del recién nacido, y los derechos y la crianza de los niños."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen sobre los hijos del Profeta y la actitud de los Compañeros y los Sucesores hacia sus padres — el informe sobre la madre de Umar ibn al-Khattab, la obediencia y la desobediencia de los hijos — y se llena sola a medida que llegan nuevos textos de sira."
    books:
      title: "En los demás libros"
      desc: "Informes filiales en cada obra recopilada más allá del Corán, el hadiz y la sira — fiqh, adab, historia, biografía, tafsir y poesía — clasificados por el género de la obra el día en que llegan sus pasajes."
    curated:
      title: "Registros sobre hijos e hijas"
      desc: "Los registros curados del museo sobre el tema filial mismo: bunuwwa, birr al-walidayn, uquq, el huérfano, la lactancia, la aqiqa, la custodia y los consejos a los hijos."
