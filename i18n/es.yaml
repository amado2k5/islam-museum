bunuwwa:
  title: "Explorador de la filiación en el islam: hijos e hijas"
  lede: "Todo lo que las fuentes del museo mencionan sobre hijos e hijas y el vínculo filial: los hijos de los profetas y de los Compañeros, la bondad hacia los padres y la desobediencia hacia ellos, los huérfanos, la lactancia y el destete, los derechos del niño — custodia, sacrificio de nacimiento, herencia — y los hijos e hijas de las historias, en el Corán, los dos Sahih, el Muwatta y los Sunan, los libros de sira, los informes de los Compañeros y los Sucesores, y cada libro recopilado — registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de hijos e hijas
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa en tres idiomas. Las menciones filiales se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes, en seis familias: hijos e hijas ⁦(بنون، بنات، أولاد، ابنه، ابنتها، ولد، أنثى، موءودة)⁩, descendencia ⁦(ذرية، نسل، عقب، بني إسرائيل، بني آدم)⁩, piedad filial y desobediencia ⁦(والدين، أبويه، بر الوالدين، عقوق، لا تقل لهما أف، اخفض جناح الذل)⁩, huérfanos y lactancia ⁦(يتيم، يتامى، رضاعة، مرضعة، فطام، حمل)⁩, los derechos del niño ⁦(حضانة، عقيقة، تحنيك، تسمية، ميراث junto al vocabulario de hijos)⁩ y los hijos e hijas de las historias ⁦(غلام، لقمان، الذبيح، ابنا آدم)⁩. Las palabras ambiguas están controladas: el simple «ابن» nunca cuenta — aparece en cada isnad y genealogía — solo cuentan sus formas relacionales con posesivo ⁦(ابنه، ابنتها)⁩, «ميراث» cuenta solo junto a palabras de hijos, y los falsos positivos verificados se excluyen por id; cada libro recopilado más adelante aporta aquí sus informes filiales de forma automática cuando sus pasajes llegan al grafo, y los registros curados se suman mediante la etiqueta bunuwwa-browser. Los padres e hijos famosos se leen de las propias aristas child_of del grafo."
  api: "El conjunto completo está disponible en"
  sections_title: Las secciones del explorador
  children_title: "Padres e hijos famosos"
  children_desc: "Padres e hijos del propio grafo del museo: cada registro unido a su hijo o hija mediante una arista child_of citada — los hijos e hijas de los profetas, los hijos de los Compañeros y de los Sucesores, y las gentes de los libros."
