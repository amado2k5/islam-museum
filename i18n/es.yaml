    juha:
      title: "Las anécdotas de Juha"
      desc: "Las anécdotas de Juha una por una según Nawadir Juha al-Kubra: el título de la anécdota, su relato con palabras del museo, su número de página y un extracto de cuarenta palabras como máximo."
    quran:
      title: "En el Corán"
      desc: "Los versículos de la risa y la sonrisa: la risa de la esposa de Abraham, la sonrisa de Salomón ante las palabras de la hormiga, «Él es quien hace reír y llorar», los rostros rientes y gozosos, la risa de los burlones y la prohibición de que un pueblo se burle de otro."
    sunnah:
      title: "En la Sunna"
      desc: "Lo que los dos Sahih, el Muwatta y los Sunan recogen de la broma, la risa y la sonrisa del Profeta, la jovialidad de los Compañeros y la advertencia a quien miente para hacer reír: cada relato con su número y su fuente."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira y de shama'il recogen de la broma, la risa y la jovialidad; esta sección se llena sola a medida que llegan nuevos textos."
    books:
      title: "En los demás libros"
      desc: "Anécdotas, agudezas y relatos de ingeniosos, necios y avaros en los libros de adab, historia y biografía: Nihayat al-Arab, 'Uyun al-Akhbar, al-Mustatraf, al-Bayan wa-l-Tabyin, al-Hayawan y cuanto se recopile después."
