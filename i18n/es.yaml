magic:
  title: "Explorador de magia y magos"
  lede: "Todas las menciones de la magia y los magos en las fuentes del museo: la hechicería en el Corán, desde la historia de los magos del faraón hasta la prueba de Harut y Marut, los hadices sobre la hechicería y la adivinación, la propia curación del Profeta mediante la ruqya, el mal de ojo y la envidia, y cada mención de magia en cada libro cosechado: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: "Explorador de magia"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Las menciones de magia se encuentran en el momento de la compilación mediante un léxico protegido sobre los textos de los pasajes: las formas inequívocas coinciden directamente, y las formas ambiguas como «سحر» (hechicería o la vigilia nocturna), «رقية» (conjuro o un nombre) y «العين» (mal de ojo o el ojo) cuentan solo junto a sus propias colocaciones, y los falsos positivos verificados se excluyen por id; cada libro cosechado más adelante aporta aquí sus menciones de magia de forma automática cuando sus pasajes llegan al grafo, y los registros curados se incorporan mediante la etiqueta magic-browser."
  api: "El conjunto completo está disponible en"
  sections_title: "Las secciones del explorador"
  filter_label: "Filtrar registros de magia"
  filter_none: "Sin coincidencias."
  empty: "Todavía no hay registros de magia en esta versión."
