  share: "Compartir el museo"
  shop_title: "Una futura tienda de regalos"
  shop_body: "El museo planea, en el futuro, una tienda de regalos o bazar en línea en una sección propia, clara y separada de este sitio, donde se podrán poner a la venta artículos para quien quiera explorarla o comprar allí, como ayuda para los costes de funcionamiento. No tendrá anuncios, ni spam, ni solicitudes insistentes, y visitarla será siempre opcional. Es un plan, no una tienda abierta hoy: el museo mismo es, y seguirá siendo, gratuito para todos."
  note: "El apoyo es opcional: se da como desees, sin compromiso ni obligación, y no concede control sobre el contenido del museo, su revisión ni su rumbo. El trabajo editorial es independiente y el método está publicado."
