    quran:
      title: "En el Corán"
      desc: "El comercio y las caravanas del Corán: «لإيلاف قريش» y «رحلة الشتاء والصيف», el mandato de dar la medida completa y el peso justo, «un comercio cuyo estancamiento teméis», las naves que surcan el mar, y cada aleya que menciona el comercio, las caravanas o el pesaje."
    sunnah:
      title: "En la Sunna"
      desc: "Los informes del Profeta sobre el comercio, los mercados y las caravanas: «Dios tenga misericordia del hombre que es indulgente al vender, al comprar y al reclamar», la prohibición de salir al encuentro de los jinetes antes de que lleguen al mercado, la caravana de 'Ir en Badr, el mercader veraz y digno de confianza — y cada informe sobre la venta, el mercado o la caravana."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen sobre las caravanas, la Ruta de la Seda y el comercio — los dos viajes de Quraysh, la 'Ir de Badr, los mercados de la yahiliyya; esta sección se llena sola cada vez que llega un nuevo texto de sira."
    books:
      title: "En los demás libros"
      desc: "Caravanas, rutas y comercio en cada obra recopilada fuera del Corán, el hadiz y la sira — geografía, historia, viajes y fiqh — archivados por el género de la obra el día en que llegan sus pasajes."
    curated:
      title: "Registros sobre el comercio y las rutas"
      desc: "Los registros curados del museo sobre las caravanas, la Ruta de la Seda y el comercio: el concepto de ilaf, la Ruta de la Seda, los lugares de la ruta desde La Meca hasta Xi'an, los janes y las qaysariyyas, el comercio en el islam y el pacto de Hilf al-Fudul."
