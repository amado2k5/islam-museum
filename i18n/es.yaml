trade:
  title: "Explorador del comercio — las caravanas de invierno y de verano, la Ruta de la Seda y el comercio musulmán"
  lede: "Cada mención de los viajes de invierno y de verano, el ilaf de Quraysh, la Ruta de la Seda y el comercio musulmán en las fuentes del museo: la aleya del ilaf de la sura Quraysh; los informes de caravanas y mercados en la Sunna y la sira; las rutas comerciales con sus janes y ribats, mercaderes y mercancías, medidas y pesas, y barcos — en cada libro recopilado, registros documentados que crecen a medida que llega cada nuevo texto."
  badge: Explorador de caravanas, Ruta de la Seda y comercio
  status: "Esta versión reúne {n} registros en {s} secciones; la prosa es un borrador hasta que una persona la lea."
  method_title: Cómo funciona este explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa en tres idiomas. Las menciones de caravanas, Ruta de la Seda y comercio se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes — las formas inequívocas coinciden directamente, y las palabras ambiguas como «عير» (la caravana o la localidad de 'Ir), «ركب» (la comitiva o la rodilla), «خان» (la posada o el título de jan), «سوق» (el mercado o «condujo»), «حرير» (el tejido o la ruta), «سفر» (el viaje en general) y «ميزان» (la balanza de la tienda o la Balanza escatológica) cuentan solo junto a sus colocaciones propias del ámbito, con los propios términos débiles eliminados antes de la prueba de contexto para que una palabra nunca pueda satisfacer su propio contexto; los falsos positivos verificados se excluyen por id, y cada libro recopilado más adelante aporta aquí sus menciones de forma automática en cuanto sus pasajes llegan al grafo; los registros curados se suman mediante la etiqueta trade-browser. Cada registro lleva etiquetas de tema: las caravanas de invierno y de verano (el ilaf y las caravanas), la Ruta de la Seda (la ruta y las rutas comerciales) y el comercio musulmán (mercados, mercaderes, mercancías y medidas)."
