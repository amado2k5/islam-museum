madhahib:
  also_under: "También en:"
  title: "Navegador de las cuatro madhhabs"
  lede: "Los cuatro imames (Abu Hanifa, Malik, al-Shafi'i y Ahmad), las escuelas que fundaron, los salaf y tabi'in sobre quienes se construyó el fiqh, los libros que registraron las madhhabs (incluidos los mutun escolares, de la Ajurrumiyya a la Jazariyya y la Shatibiyya) y todo lo que los libros sunníes dicen sobre ellos en historia, fatuas y cuestiones jurídicas, reunido en un solo navegador con sus fuentes."
  badge: Explorador de las escuelas jurídicas
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del navegador
  method_note: "Cada registro aquí es un registro ordinario del museo, citado y trilingüe, sin tablas aparte. Los registros curados llevan la etiqueta madhahib-browser y etiquetas mh-<section>, y cualquier obra, pasaje o cuestión cuya arista 'mentions' nombre una madhhab o el concepto de madhhab se une a «Menciones en las fuentes»; y la mención de la escuela hanafí, malikí, shafi'í o hanbalí también la une a la sección de esa escuela. Un libro cosechado más adelante aparece aquí automáticamente el día en que se escriben sus aristas, y las fuentes que no pueden llevar aristas 'mentions' se unen mediante sus etiquetas."
  api: "El conjunto de datos completo está en"
  sections_title: Las secciones del navegador
