cosmos:
  title: "Navegador del cosmos: seres, naciones antiguas y secretos del universo"
  lede: "Todo lo que las fuentes del museo dicen sobre lo que queda más allá del relato humano tal como lo conocemos: las criaturas que, según el Corán, Dios dispersó por los cielos además de por la tierra, los siete cielos y «lo semejante a ellos» de la tierra, quiénes poseyeron la tierra antes de Adán, los pueblos desaparecidos, la gente tras la barrera y los secretos del cosmos: el Trono, la Tabla, el loto del límite y las llaves de lo oculto. Cada aleya, relato y pasaje de libro está citado, y cada opinión está rotulada."
  badge: Explorador del cosmos
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del navegador
  method_note: "Las fuentes no hablan de «extraterrestres» como los entiende un lector moderno; hablan de criaturas dispersas por los cielos, de muchos mundos, de los jinn y los ángeles, de una creación anterior y de pueblos desaparecidos. Este navegador reúne exactamente esas menciones y pone cada una junto a los comentaristas que la leyeron. No emite veredicto: donde los sabios difieren, o la cadena de un relato es discutida, el registro lo dice y cita a cada parte. Las aleyas del Corán se eligen de una tabla revisada; cualquier otra mención se encuentra al compilar mediante un léxico protegido sobre los textos de los pasajes, de modo que una mención en un libro cosechado más adelante aparece el día en que llega su pasaje."
  api: "El conjunto completo está disponible en"
  sections_title: Las secciones del navegador
  filter_label: Filtrar registros del cosmos
  filter_none: Sin resultados.
  empty: Aún no hay registros del cosmos en esta versión.
  topics:
    beyond-earth: Criaturas más allá de la tierra
    many-worlds: Los mundos y las siete tierras
    heavens: Los cielos, las órbitas y las estrellas
    origins: El comienzo de la creación
    before-adam: Quiénes poseyeron la tierra antes de Adán
    lost-peoples: Los pueblos desaparecidos
    hidden-peoples: Los pueblos ocultos
    secrets: Secretos del cosmos y de lo oculto
  sections:
    quran:
      title: En el Corán
      desc: "Las aleyas sobre las criaturas dispersas por los cielos y la tierra, los siete cielos y «lo semejante a ellos de la tierra», la primera creación, los habitantes anteriores, los pueblos de 'Ad y Thamud, Yajuj y Majuj y la barrera, y las aleyas sobre lo oculto y sus llaves."
    sunnah:
      title: En la Sunna
      desc: "Los relatos sobre las siete tierras, los cielos y sus habitantes, el comienzo de la creación, el sol bajo el Trono, y lo que el Profeta dijo de las naciones anteriores."
    seerah:
      title: En la sira
      desc: "Lo que los libros de sira y de historia recogen sobre estos temas; esta sección se completa sola a medida que llegan nuevos textos de sira con tales menciones."
    books:
      title: En los demás libros
      desc: "Comentario, historia, geografía, maravillas de la creación y poesía: cada libro cosechado más allá del Corán, el hadiz y la sira que trata de estos temas, y lo que venga después."
    concepts:
      title: Los registros sobre estos temas
      desc: "Los registros curados del museo: la vida más allá de la tierra en las fuentes, las siete tierras, la tierra antes de Adán, los pueblos desaparecidos, Yajuj y Majuj, el Trono y la Tabla, y las preguntas que cada uno plantea."
  viz:
    title: "El cosmos como órbitas"
    lede: "La Tierra está en el centro. Cada tema es una órbita a su alrededor, desde los antiguos habitantes de la propia tierra y los pueblos desaparecidos hacia fuera, hasta los cielos, las criaturas más allá de la tierra, el comienzo de la creación y los secretos de lo oculto. Cada punto es un registro, coloreado según su corpus y enlazado a su página; un registro con dos temas está en ambas órbitas."
