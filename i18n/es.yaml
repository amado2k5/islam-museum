bayt:
  title: "Navegador de la Casa del Profeta"
  lede: "Todo lo que las fuentes del museo recogen sobre la casa y la familia del Profeta: las aleyas de la Gente de la Casa y de sus esposas en el Corán, los hadices de las Dos Cosas Pesadas, el Manto, Ghadir, Fadak y la herencia de Fátima en los dos Sahih, el Muwatta y los Sunan, lo que los Compañeros y los Tabi'in transmitieron y cada mención en cada libro cosechado: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de la casa del Profeta
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: Método del navegador
  method_note: "Cada registro aquí es un registro ordinario del museo, con fuentes y trilingüe. Las menciones de la casa se detectan al compilar mediante un léxico protegido sobre los textos de los pasajes: los términos inequívocos como Ahl al-Bayt, la 'itra y Banu Hashim coinciden directamente, mientras que los nombres ambiguos como Fátima, Zaynab y Safiyya cuentan solo en sus formas calificadas o tras una auditoría de falsos positivos; cada libro cosechado más adelante aporta aquí sus menciones automáticamente en cuanto llega su texto, y los registros curados sobre la familia se unen mediante la etiqueta bayt-browser."
  api: "El conjunto de datos completo está en"
  sections_title: Secciones del navegador
  filter_label: Filtrar registros de la familia
  filter_none: Sin resultados coincidentes.
  empty: Aún no hay registros de la casa en esta versión.
  sections:
    quran:
      title: En el Corán
      desc: "Las aleyas de la Gente de la Casa sobre la purificación y la mubahala, las aleyas de sus esposas en la sura al-Ahzab, la aleya de Sawda y las demás; cada aleya con su fuente."
    sunnah:
      title: En la Sunna
      desc: "Los hadices de las Dos Cosas Pesadas, el Manto, Ghadir, Fadak y la herencia de Fátima en los dos Sahih, el Muwatta, los Cuarenta y los Sunan; cada relato con su fuente."
    seerah:
      title: En la sira
      desc: "Lo que los libros de sira y maghazi recogen sobre la Gente de la Casa, Banu Hashim, las esposas del Profeta y sus hijos; esta sección se completa sola a medida que llegan nuevos textos de sira."
    books:
      title: En otros libros
      desc: "Cada mención de la casa del Profeta en poesía, historia, fiqh y cualquier obra cosechada fuera del Corán, el hadiz y la sira."
    ahl:
      title: La casa y el clan
      desc: "Los registros curados del museo sobre los miembros de la familia: Fátima, Ali, Hasan, Husayn, Jadiya, las hijas y las esposas, Banu Hashim, Banu Abd al-Muttalib, el abuelo y los tíos."
    mawaqif:
      title: Episodios y acontecimientos
      desc: "Los episodios e historias ligados a la casa: Ghadir Khumm, el Manto, la mubahala, Fadak, la herencia de Fátima, Karbala y la bay'a de Ali."
    concepts:
      title: Conceptos y fuentes
      desc: "Los registros curados del museo sobre los conceptos de la casa: la 'itra, la Gente del Manto, las Dos Cosas Pesadas, las Madres de los Creyentes, los Doce Imames, y los libros de sira y shamail."
  viz:
    title: "La casa, tal como la recoge el grafo"
    note: "La familia del Profeta dibujada solo a partir de las aristas de parentesco del propio grafo: una línea une a dos personas cuando un registro afirma el vínculo. Sus padres y la línea de su abuelo están sobre él, sus esposas a su lado, sus hijos y nietos debajo. Se sitúan {n} personas, con {c} líneas de padres e hijos y {s} líneas de matrimonio. Sus esposas siguen la fecha de matrimonio escrita en cada arista ({d} de {w} la tienen), y después las que no tienen fecha; las esposas que son madre de un hijo mostrado aquí van en la línea más baja. {b} vínculos entre hermanos aparecen al seleccionar a una persona."
