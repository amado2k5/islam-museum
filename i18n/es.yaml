  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Los textos médicos se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes, en los seis temas del título: medicina profética (ventosas, cauterización, ruqya, miel, comino negro, costus, sen, talbina, trufas, dátiles 'ajwa, ithmid, ladud y sa'ut); medicina (el médico, la enfermedad y los enfermos, el dolor, la fiebre, la peste y la epidemia, el contagio, la lepra, enfermedades con nombre, la visita a los enfermos, el hospital); anatomía (la gota, el coágulo y el trozo de carne; la vena yugular, la aorta y los vasos; las articulaciones; los órganos); cirugía (tratar una herida, cauterizar un vaso, la flebotomía, la circuncisión, las férulas, la reducción de huesos); fármacos (el fármaco y la enfermedad, veneno y antídoto, simples); y tratamiento (buscar tratamiento y cura, la curación, el tratamiento con lo prohibido). Las palabras ambiguas están controladas: «في قلوبهم مرض» queda fuera; «الحمى» cuenta solo como fiebre, nunca como el pasto protegido; «القسط» solo en sus compuestos farmacológicos, nunca como justicia; «عسل» y «عجوة» solo junto a una palabra médica; «سم الخياط» queda fuera; las palabras de herida cuentan solo con tratamiento, nunca con la compensación legal de las heridas; y fuera del Corán y de los informes de hadiz, un «مرض» o «شفاء» aislado no basta. Cada libro recopilado más adelante aporta aquí sus textos médicos de forma automática cuando sus pasajes llegan al grafo; los registros curados se suman mediante la etiqueta tibb-browser junto con la etiqueta de su tema. El museo describe lo que dicen las fuentes y lo atribuye; no da consejo médico ni dictamen."
