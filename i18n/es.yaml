i3lam:
  title: "Explorador de los comunicadores musulmanes"
  lede: "Cada mención de las personas que transmitieron la palabra — desde el muecín que llamaba al adhan hasta el pregonero de los mercados, el jatib en el minbar, el portavoz del califa y el enviado del Profeta, el katib de la revelación y de la cancillería, el periodista de la nueva prensa, el locutor y el influyente, el reformador y el revolucionario — en el Corán, la sunna, la sira, los relatos de los Compañeros y los Sucesores, y en cada libro recopilado en el museo, ahora y en el futuro."
  badge: Explorador de comunicadores
  status: "Esta compilación contiene {n} personas en {j} funciones de comunicación y {f} pasajes que las mencionan en {s} corpus; los textos son borradores hasta que los lea una persona."
  method_title: Cómo funciona el explorador
  method_note: "Cada registro de aquí es un registro corriente del museo, con sus fuentes y su prosa en tres idiomas. Una persona se incorpora a una función solo mediante una entrada de ocupaciones en su propio registro: nada se infiere. Un pasaje se incorpora al flujo cuando el grafo ya registra una arista «mentions» desde él hacia una de esas personas o hacia un oficio de comunicación, o cuando el registro lleva la etiqueta i3lam-browser; así, una mención en un libro recopilado más adelante aparece aquí el día en que llega su pasaje, sin editar esta página. Cada pasaje se etiqueta con su corpus (Corán / sunna / sira / libros)."
  requirements: "El requisito original y los criterios de aceptación de este explorador se archivan en"
  wire_title: "El hilo — del minarete al flujo"
  wire_aria: "Un diagrama de la cadena de comunicación: cada función es una estación de una línea de transmisión, con su anillo dimensionado según el número de titulares registrados."
  wire_note: "Cada anillo es una estación de la línea y su radio sigue el número de titulares registrados: la llamada del muecín se convierte en el pregón del pregonero, el sermón, la palabra del enviado, la página del escriba, la prensa, la emisión y la revuelta."
  holders: "{n} registrados"
  quran_title: "En el Corán"
  quran_note: "Los anclajes fijos del tema en el texto revelado — se muestran mediante la referencia congelada del pasaje, nunca vueltos a teclear."
  anchors:
    poets: "Los poetas «a quienes siguen los extraviados» — el verso más antiguo sobre quién gobierna a un auditorio, y su excepción para quienes creen y advierten."
    news: "Cuando les llega una noticia de seguridad o de temor, la divulgan — la propia regla del Corán sobre cómo se trata una noticia antes de difundirla."
    adhan: "No toméis la llamada a la oración como burla y juego — la aleya que vincula la llamada del muecín con lo sagrado."
    jumua: "La llamada del día de la congregación: dejad el comercio y acudid al recuerdo — la convocatoria que fundó la hora del jatib."
    herald: "Te enviamos como testigo, portador de buenas nuevas y amonestador — la misión profética que imitan todos los pregoneros y portavoces posteriores."
    proclamation: "La proclamación de Dios y de su mensajero a la gente el día de la peregrinación mayor — el modelo del anuncio público."
    caller: "El que llama y los que escuchan: la escena coránica de una voz que lleva un mensaje a través de la multitud."
  chain_title: "Los comunicadores — las personas que transmitieron la palabra"
  chain_note: "Cada función de abajo es un registro de oficio del museo; cada ficha, una persona cuyo propio registro contiene una entrada de ocupaciones para ella, ordenadas por fecha cuando el grafo conoce una."
  mentioned_in: "mencionado en {n} pasajes"
  no_holders: "Aún no hay titulares registrados en esta compilación."
  state_title: "El Estado habla"
  state_note: "Los cargos a los que sirvió la cadena de comunicación: los califas, sultanes y reyes cuya palabra llevaban el portavoz, el pregonero y el enviado, y los visires, jueces, gobernadores y jefes de correos a través de los cuales el Estado se dirigía a sus súbditos. Estas son las voces de la institución; la cadena de arriba es su medio."
  feed_title: "Cada mención en las fuentes"
  feed_note: "Cada pasaje que el grafo ya vincula con un comunicador o un oficio de comunicación, clasificado por corpus; este flujo crece automáticamente cada vez que los pasajes de un libro recién recopilado llegan al grafo o un registro se etiqueta como i3lam-browser."
  feed_more: "y {n} más en este corpus."
  feed_empty: "Aún no hay pasajes que lo mencionen en esta compilación: aparecerán aquí a medida que lleguen los libros recopilados."
  corpora:
    quran:
      title: "Corán"
      note: "El texto congelado de Tanzil, al que se llega solo por referencia de pasaje."
    sunnah:
      title: "Sunna"
      note: "Relatos de las colecciones de hadices."
    seerah:
      title: "Sira"
      note: "Relatos de la literatura de sira y maghazi."
    books:
      title: "Otros libros"
      note: "Todos los demás libros recopilados del corpus."
  tagged_title: "Registros etiquetados para este explorador"
  tagged_note: "Todo registro que lleve la etiqueta i3lam-browser se incorpora aquí automáticamente: así aflora el material recopilado en el futuro."

heroes:
  title: "Héroes del islam"
  lede: "Hombres y mujeres que se esforzaron más allá de lo exigible y dieron mucho por los demás: seis salas de virtud, cuatro héroes en cada una, cada relato completo y con su fuente."
  status: "Héroes en estas salas: {n} en {trails} recorridos. Cada nombre abre el registro del héroe; cada sala abre su relato completo."
  trail_link: "Recorrer el relato completo de la sala ({n} héroes)"
  record_link: "Abrir el registro"
  note_title: "Sobre estas salas"
  note_body: "Los héroes de aquí son personas de posturas documentadas, no iconos idealizados: cada relato figura en su registro con su fuente, y donde los relatos difieren se dice en las notas de investigación. Las salas crecen a medida que se completan más relatos en el museo."
  virtues:
    sacrifice:
      name: "Sala del Sacrificio"
      lede: "Se entregaron a sí mismos y su comodidad por personas que nunca conocieron: el primer mártir, el portaestandarte, el escudo de Uhud y el jefe ante las lanzas."
    courage:
      name: "Sala del Valor"
      lede: "La firmeza medida cuando el corazón y el pie avanzan juntos: el caballero del lecho, la espada de los campos de batalla, el caballero de Hattin y el jeque del desierto."
    mercy:
      name: "Sala de la Misericordia"
      lede: "La misericordia como forma de fortaleza: el predicador de los corazones, la madre de los cautivos, el sultán de la casa de la justicia y el exiliado que protegió a sus vecinos."
    generosity:
      name: "Sala de la Generosidad"
      lede: "Una fortuna entera convertida en bien público: las caravanas de Abd al-Rahman, el pozo de Uzman, la riqueza de Jadiya y la dotación de Fátima."
    knowledge:
      name: "Sala del Conocimiento"
      lede: "Llevaron el conocimiento como un depósito de confianza y pagaron con sus vidas por él: el fundador de la teoría jurídica, el firme de la inquisición, el sabio de Basora y la lengua de la verdad."
    steadfastness:
      name: "Sala de la Firmeza"
      lede: "El mundo tembló y ellos no se movieron: «Uno, Uno» bajo la roca, el camino más largo hacia la verdad, el día en que la umma tembló y la palabra sin miedo."
ritha:
  title: "Navegador de elegías y anuncios de fallecimiento"
  lede: "Todo lo que se dijo en elegía y anuncio de fallecimiento en las fuentes del museo: los versículos de la paciencia y el istirŷa', las palabras del Profeta a la muerte de su hijo, su nieto y los Compañeros perdidos, su anuncio de la muerte del Negus y de Ŷa'far, Zayd e Ibn Rawaha, las condolencias entre los Compañeros, las elegías de Hassan, Ka'b ibn Malik, al-Jansa' y Labid, los relatos de los Compañeros y los Sucesores ante la muerte de sus seres queridos y las palabras de los libros cosechados — lo que se coseche más adelante se suma automáticamente."
  badge: "Explorador de elegías y anuncios"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del navegador"
  method_note: "Cada registro aquí es un registro ordinario del museo, con sus fuentes y su texto en cinco idiomas. Los pasajes se hallan al construir el sitio con un detector prudente sobre los textos: las palabras de la elegía y del poema elegíaco, del anuncio de fallecimiento y del mensajero, de las condolencias, las fórmulas fijas como el istirŷa', «a Dios pertenece lo que tomó y lo que dio» y «la paciencia es en el primer golpe», las palabras del lamento y el llanto solo cuando está junto a una mención de muerte. Los versículos vienen de una tabla revisada, no de un léxico. «Na't» la descripción, «'azahu ila» en la atribución de fuentes, «waritha» en la herencia y el llanto por temor de Dios quedan fuera, los falsos positivos verificados se excluyen por identificador, cada libro cosechado más tarde aporta sus pasajes automáticamente y los registros seleccionados se unen con la etiqueta ritha-browser. Cada pasaje se clasifica: elegía, anuncio de fallecimiento, condolencias, o llanto y lamento."
  api: "El conjunto completo está disponible en"
  sections_title: "Las secciones del navegador"
  kinds_title: "Tipo"
  all_kinds: "Todos los tipos"
  formulas_title: "Las palabras y fórmulas célebres"
  formulas_note: "Las palabras fijas que la comunidad conoce ante una muerte; cada tarjeta abre el pasaje más corto que las contiene, con cuántos se hallaron en las fuentes."
  formula_count: "{n} en las fuentes"
  filter_label: "Filtrar registros"
  filter_none: "Sin resultados."
  empty: "Aún no hay registros en esta versión."
  kinds:
    ritha:
      title: "Elegía"
      ar: "رثاء"
      desc: "Elogio del difunto y enumeración de sus virtudes, en verso y prosa, y las elegías de los Compañeros y los poetas."
    nay:
      title: "Anuncio de fallecimiento"
      ar: "نعي"
      desc: "Anunciar una muerte a la gente, como el Profeta con Ŷa'far, Zayd, Ibn Rawaha y el Negus."
    taziya:
      title: "Condolencias"
      ar: "تعزية"
      desc: "Consolar y fortalecer al afligido, el istirŷa', «a Dios pertenece lo que tomó y lo que dio» y la comida para la familia del difunto."
    bukaa:
      title: "Llanto y lamento"
      ar: "بكاء ونياحة"
      desc: "Las lágrimas del ojo y la pena del corazón, permitidas, y la prohibición del lamento, de golpearse las mejillas y de rasgarse las vestiduras."
  sections:
    quran:
      title: "En el Corán"
      desc: "Los versículos de la paciencia y el istirŷa' y cada muerte que menciona el Corán: la prueba de los creyentes, la pena de Ya'qub, toda alma probará la muerte, la descripción de los mártires y el alma serena."
    sunnah:
      title: "En la Sunna"
      desc: "Lo que contienen los dos Sahih, el Muwatta y los Sunan: el anuncio del Negus y de Ŷa'far, las condolencias a la hija del Profeta, su llanto por su hijo, la prohibición del lamento y el elogio de la gente ante un cortejo — cada relato con su fuente y número."
    seerah:
      title: "En la sira"
      desc: "Lo que contienen los libros de la sira: la muerte del Profeta y el llanto de los Compañeros, las elegías de Hassan por el Profeta, Hamza y los mártires de Mu'ta y Bir Ma'una, y el anuncio de Zayd, Ŷa'far e Ibn Rawaha; esta sección se llena al cosechar nuevos textos de sira."
    books:
      title: "En los demás libros"
      desc: "Los relatos de los Compañeros, los Sucesores, los historiadores y los literatos: las condolencias de Umar y Mu'awiya, las elegías de los poetas, el llanto de Abu Bakr y Umar y el anuncio de la muerte de califas y sabios en las historias de la comunidad — clasificados el día en que llegan sus pasajes."
    curated:
      title: "Los registros seleccionados"
      desc: "Los registros del museo sobre la elegía, el anuncio, las condolencias y el lamento mismos, y sobre los acontecimientos y poemas vinculados: la elegía de Hassan por el Profeta, las de los mártires de Mu'ta, el dolor del Profeta por Ŷa'far y la muerte de Ibrahim."
  formulas:
    istirja:
      title: "El istirŷa' ante la pérdida"
      note: "La frase que dice el afligido y la súplica de Umm Salama que la sigue."
    lillah_ma_akhadh:
      title: "«A Dios pertenece lo que tomó y lo que dio»"
      note: "Lo que el Profeta envió a su hija cuando su hijo agonizaba."
    sadma_ula:
      title: "«La paciencia es en el primer golpe»"
      note: "El Profeta a una mujer que lloraba junto a una tumba."
    ajirni:
      title: "«Oh Dios, recompénsame en mi desgracia»"
      note: "La súplica del afligido tal como la transmiten Muslim, Malik y al-Tirmidhi."
    ayn_tadma:
      title: "«El ojo llora y el corazón se aflige»"
      note: "El Profeta ante la muerte de su hijo Ibrahim."
    ya_abatah:
      title: "«Oh padre mío»"
      note: "Las palabras de Fátima el día de la muerte del Profeta."
    man_kana_yabudu:
      title: "«Puro en la vida y en la muerte»"
      note: "Abu Bakr junto al Profeta el día de su muerte y su discurso después."
    al_jafar:
      title: "«Preparad comida para la familia de Ŷa'far»"
      note: "La sunna de alimentar a la familia del difunto."
    nay_najashi:
      title: "El anuncio de la muerte del Negus"
      note: "El Profeta lo anunció el día de su muerte y rezó por él en ausencia."
    adhkuru_mahasin:
      title: "«Mencionad lo bueno de vuestros muertos»"
      note: "La raíz de la elegía permitida y del elogio de la gente ante un cortejo."
  viz:
    title: "Los cuatro estandartes de luto"
    note: "Cuatro estandartes con orillo negro, uno por tipo de registro: elegía, anuncio de fallecimiento, condolencias, y llanto y lamento; cada uno muestra cuántos registros lleva, una barra de dónde se hallaron en las fuentes y tres registros para abrir. Contados aquí: {n} registros, todos en las listas de abajo. Los tipos vienen del detector y de los registros seleccionados, no de un juicio del museo."
    region: "Registros por tipo y sección"
    col_kind: "Tipo"
