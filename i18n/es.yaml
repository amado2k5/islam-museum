    modern-individual: "Moderno individual"
  sections:
    quran:
      title: "En el Corán"
      desc: "El deporte en el Corán: los caballos preparados junto a la fuerza, los corceles de Sulayman, al-Adiyat al galope, las monturas y los camellos del sacrificio, y el maysir, cuyas líneas los juristas leen junto con los juegos de tablero."
    sunnah:
      title: "En la sunna"
      desc: "El deporte en los dos Sahih, el Muwatta y los Sunan: enseñad a vuestros hijos la natación y el tiro con arco, las carreras con el sabiq y el mumarr, no hay premio salvo en el casco, el casco o el nasl, «tirad, hijos de Isma'il», «tira; que mi padre y mi madre sean tu rescate», el juego de lanzas de los abisinios en la mezquita, las dos carreras con Aisha y el combate con Rukana."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira contienen sobre competiciones —la lucha del Profeta con Rukana, las carreras, las artes ecuestres de las campañas—; la sección se llena sola a medida que se recopilan pasajes de sira."
    books:
      title: "En los libros recopilados"
      desc: "Relatos deportivos en todas las demás obras recopiladas —fiqh, adab, historia, biografía, los manuales de furusiyya y los ejercicios nombrados en el Canon—, que entran automáticamente el día en que llegan sus pasajes."
    curated:
      title: "Registros curados sobre deporte"
      desc: "Los registros seleccionados del museo sobre el propio deporte y la competición: los deportes nombrados de la clase deporte, el fiqh de las competiciones y las apuestas, el tiro con arco, la lucha, la caballería, las obras de furusiyya y las competiciones famosas como eventos."
  sig:
    title: "El campo de la contienda"
    caption: "Una franja reglada por cada familia de deporte —equitación, tiro con arco, natación, lucha, carreras, juegos, caza y deporte moderno— y en cada una un disco por cada corpus que contiene registros de esa familia, con su área proporcional a su número, cada disco un enlace a la lista de la sección más abajo."
    legend: "Disco dorado: registros encontrados; punto atenuado: ninguno todavía en ese corpus. Las franjas se leen equitación, tiro con arco, natación, lucha, carreras, juegos, caza, deporte moderno — cada disco, un enlace."
