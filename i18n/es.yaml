ulama:
  title: "Navegador de los ulemas: pensadores, sabios, literatos, muhaddiths y escritores"
  lede: "Cada persona de conocimiento y de pluma que el grafo del museo conoce (los pensadores y filósofos, los sabios y juristas, los muhaddiths, los literatos y los escritores, y los científicos de la pluma) y todo lo que el Corán, la Sunna, la sira y cada libro cosechado dicen de ellos: quiénes fueron, qué defendieron, qué dijeron, qué escribieron y dónde los mencionan las fuentes. Cada registro lleva sus fuentes; cada mención enlaza con su pasaje."
  badge: Explorador de sabios y escritores
  hero_kufi: "Pensadores · Sabios · Muhaddiths · Literatos · Escritores"
  hero_naskh: "La gente del conocimiento y de la pluma, y lo que las fuentes dicen de ellos"
  status: "Esta versión reúne {n} registros en {s} secciones; cada registro enumera sus fuentes, y los textos fueron escritos por agentes de IA a partir de esas fuentes y aún no han sido leídos por una persona."
  method_title: El método del navegador
  method_note: "Una persona se une a este navegador cuando el propio registro dice quién fue: un papel u ocupación de erudición (sabio, muhaddith, jurista, muftí, cadí, teólogo, filósofo, historiador, geógrafo, escritor, maestro, predicador, y los científicos de la pluma; los poetas tienen su propia ala y quedan fuera de este ámbito). Un pasaje se une de tres maneras: una arista canónica 'mentions' que nombra a una persona que cumple los criterios; una tabla revisada de aleyas del Corán (Luqman el sabio y las aleyas sobre la gente del conocimiento, la pluma y la escritura; el texto congelado de Tanzil nunca se busca); o una lista protegida de los nombres de los sabios tal como los escriben los libros, donde un nombre común suelto nunca cuenta por sí solo. Así, un libro cosechado más adelante aporta automáticamente sus sabios y sus menciones. Las fuentes sunníes son el marco; donde las opiniones de una persona son discutidas, el registro dice quién las sostuvo."
