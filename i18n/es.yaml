hudud:
  title: "Explorador de hudud Allah y kaba'ir"
  lede: "Todas las menciones de los límites de Dios y los pecados mayores en las fuentes del museo: las aleyas de «estos son los límites de Dios» y «quien transgrede los límites de Dios», los hudud de la fornicación, el robo y la calumnia en los dos Sahih, el Muwatta y los Sunan, la aplicación de las penas en la sira y los relatos de los Compañeros y los Sucesores, las listas de kaba'ir y los siete destructores, y cada mención en cada libro cosechado: registros citados que crecen a medida que llega nuevo texto."
  badge: "Explorador de hudud y kaba'ir"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa trilingüe. Las menciones se encuentran en el momento de la compilación mediante un léxico protegido sobre los textos de los pasajes: «حدود الله» en todas sus flexiones, el establecimiento del hadd, las penas fijas (lapidación, flagelación en sus formas de castigo, la mano amputada y el castigo discrecional), y «kaba'ir» y «mubiqat». Las señales débiles («hudud» y «hadd» sin restricción, «jald» ambiguo, los delitos de hadd de fornicación, robo, calumnia, vino, apostasía y bandidaje, el talión, y «kabira» ambiguo) cuentan solo junto a una señal fuerte o de dos en dos; los falsos positivos verificados se excluyen por id; cada libro cosechado más adelante aporta aquí sus menciones de forma automática cuando sus pasajes llegan al grafo, y los registros curados se incorporan mediante la etiqueta hudud-browser. Cada pasaje se marca como «hudud» o «kabair» según sus señales."
