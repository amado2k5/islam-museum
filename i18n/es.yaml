      desc: "Los registros curados del museo sobre las virtudes, los vicios y los propios contratos: carácter, modales, veracidad, honradez, paciencia, gratitud, humildad, sinceridad, bondad con los padres; mentira, traición, orgullo, maledicencia, avaricia, envidia, injusticia y desobediencia; y el contrato, la venta, el riba, la deuda, la prenda, el alquiler, el legado, la herencia, el matrimonio, el divorcio, los juramentos, el testimonio, el juicio, las balanzas, los regalos, la garantía, la representación, la sociedad y el resto de los tratos."
ansab:
  title: "Explorador de genealogías, pueblos, subdivisiones tribales y árbol de los profetas"
  lede: "Cada mención de las genealogías, los pueblos, las subdivisiones tribales (butun) y el árbol de los profetas y mensajeros en las fuentes del museo: el linaje del Profeta en sus tres partes —la parte unánimemente sólida hasta Adnan, la discutida hasta Ibrahim y lo que hay más arriba—, las tribus árabes adnaníes y qahtaníes, los pueblos (árabes, ajam, rum, habasha, coptos, Banu Isra'il) y los butun de las tribus, desde Hashim, al-Muttalib, Abd Shams, Majzum y Zuhra hasta los clanes de Aws, Jazray, Hawazin y Qays — en el Corán, la sunna, la sira, los relatos de los Compañeros y los Sucesores, y todo libro recopilado y todo libro que se recopile más adelante."
  badge: Explorador de genealogías, pueblos y butun
  status: "Esta compilación contiene {n} registros y {f} pasajes en {s} secciones; los textos son borradores hasta que los lea una persona."
  method_title: Cómo funciona el explorador
  method_note: "Cada registro de aquí es un registro corriente del museo, con sus fuentes y su prosa en tres idiomas. Las menciones se descubren en el momento de la compilación mediante un léxico controlado sobre los matn de los pasajes: los nombres de los eslabones del linaje profético (desde Abdullah ibn Abd al-Muttalib hasta Adnan, y luego los eslabones discutidos hasta Ismail e Ibrahim), los nombres de tribus y clanes (Quraysh y sus clanes, Aws y Jazray, Tamim, Hawazin, Zaqif, Gatafan, Quda'a, Kinda, Bakr, Taglib y el resto), los pueblos (árabes, ajam, persas, rum, habasha, coptos, turcos, bereberes, kurdos, mongoles, Banu Isra'il), los nombres de clanes (los butun de Quraysh, Aws, Jazray, Hawazin y Qays) y los términos de clase (nasab, tribu, clan, batn, butun, fakhidh, el árbol de los profetas); mientras que 'aad como el verbo «volvió», Tamim con el sentido de «completo» y matn con el sentido de «el dorso» quedan excluidos, y los falsos positivos documentados se exceptúan por identificador. Cada libro recopilado más adelante aporta aquí sus menciones automáticamente cuando sus pasajes llegan al grafo, y los registros curados se incorporan mediante la etiqueta ansab-browser. Cada pasaje se etiqueta con su corpus (Corán / sunna / sira / libros) y sus temas."
  api: "El conjunto completo está disponible en"
  tree_title: "El árbol de los profetas y mensajeros — el linaje del Profeta"
  tree_note: "El linaje del Profeta según la división en tres partes de los sabios de la sira y de la genealogía: la parte admitida como sólida hasta Adnan; la parte discutida, entre quienes suspenden el juicio y quienes la afirman, desde Adnan hasta Ismail ibn Ibrahim según la transmisión de Ibn Ishaq, al-Tabari e Ibn Sa'd; y la parte anterior a Ibrahim, que no está establecida entre ellos. Se muestra toda la cadena según lo solicitado, y los eslabones discutidos se marcan con un contorno discontinuo, no se presentan como certeza."
  tree_legend: "Los eslabones con borde discontinuo pertenecen a la parte discutida del linaje (entre Adnan e Ismail según la transmisión de Ibn Ishaq/al-Tabari); los de borde continuo son los admitidos como sólidos por los sabios de la sira."
  disputed_from: "la parte discutida va desde"
  disputed_to: "hasta"
  disputed_tooltip: "Un eslabón de la parte discutida del linaje del Profeta: ningún genealogista lo avala"
  sections_title: "Las secciones del explorador"
