      desc: "Lo que los dos Sahih, el Muwatta y los Sunan recogen de disputas: los judíos llevando la mano del Profeta a la Torá, sus preguntas sobre el Espíritu, los durmientes de la Cueva y Dhu al-Qarnayn, y los debates de los Compañeros después de él; cada relato con su fuente y numeración."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen de debates (la mubahala con los cristianos de Najran, el intercambio ante el Negus entre Ja'far ibn Abi Talib y los enviados de Quraysh, las disputas de los sabios judíos en Medina); esta sección se completa sola a medida que llegan nuevos textos de la sira."
    books:
      title: "En los otros libros"
      desc: "Menciones de debates en toda otra obra cosechada (historias, generaciones de eruditos, heresiografía y adab), clasificadas por el género de la obra el día en que llegan sus pasajes."
    curated:
      title: "Los registros sobre debates"
      desc: "Los registros curados del museo sobre la disputa misma: su género y etiqueta, y los encuentros con nombre que las fuentes conservan (la mubahala de Najran, Harura, los consejos de los mutakallimun); cada parte y oponente con su cita."
  viz:
    title: "El estrado del debate"
    note: "Léase de izquierda a derecha: con quién fue el debate, si el registro contiene un intercambio real o solo habla de uno, y dónde se encontró en las fuentes del museo. Una cinta es tan ancha como el número de registros que lleva, y la corriente gris es todo registro sin clase de oponente. Se cuentan aquí: {n} registros, todos ellos en las listas de abajo. Los tipos de registro provienen del detector y de los registros curados, no de un juicio del museo."
