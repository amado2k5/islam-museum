  method_title: El método del explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa trilingüe. Las menciones del pecado se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes — las familias de «سيّئ» y «ساء», los nombres del pecado, la culpa y la desobediencia, y las palabras del pecado mayor y menor, la transgresión, la inmoralidad y la injusticia; las ambiguas «كبيرة» y «صغيرة» cuentan solo junto a una señal fuerte de pecado, y los falsos positivos verificados se excluyen por id ⁦(como «النساء» que lleva «ساء» dentro, el takbir de la oración y «ذنب» en el sentido de coxis)⁩; cada libro recopilado más adelante aporta aquí sus menciones de forma automática cuando sus pasajes llegan al grafo, y los registros curados se suman mediante la etiqueta sayyiat-browser."
