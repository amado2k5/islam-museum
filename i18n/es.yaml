  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, citado y trilingüe, agrupado por las etiquetas jinn-devils-browser y jd-<section> dentro del grafo único, no en una tabla aparte; los registros de ángeles que también contiene el Explorador de ángeles aparecen aquí bajo la sección de ángeles. El texto del Corán es el texto congelado de Tanzil, mostrado en las páginas de tema solo por referencia, y las tarjetas de hadices enlazan con las páginas propias de los relatos. Los libros cosechados en el futuro se incorporan al explorador automáticamente cuando sus registros llevan la etiqueta. Dentro de cada tema, los registros se enumeran según lo que son, leído de la clase y el tipo de cada registro: los seres mismos, enseñanzas, acontecimientos, figuras con nombre, preguntas y obras."
