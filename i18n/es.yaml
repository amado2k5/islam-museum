arabiyya:
  title: "Navegador de la lengua árabe: la lengua del Corán"
  lede: "El árabe tal como lo nombra el Corán y como lo describen las fuentes: las aleyas en que el Corán habla de su propia lengua, los relatos transmitidos del Profeta, de los Compañeros y de los Sucesores, las historias de quienes lo oyeron, el debate sobre su inimitabilidad, y la historia, la escritura, las ciencias, los dialectos, el mundo, los sabios y los libros del árabe."
  badge: "Explorador de la lengua árabe"
  status: "Esta versión contiene {v} aleyas en que el Corán habla de su lengua, {p} pasajes del hadiz, la sira, el tafsir y los libros cosechados que hablan del árabe, y {r} fichas redactadas. Los pasajes se localizan por sus palabras, de modo que algunos solo mencionan el árabe de paso; cada uno se abre en su página con su fuente."
  method_title: "El método del navegador"
  method_note: "Nada aquí se guarda en una lista aparte. Los pasajes se localizan al construir el sitio, comparando las palabras de cada ficha de texto del grafo del museo: un libro cosechado más tarde añade sus pasajes el día en que llega. Las fichas redactadas son fichas ordinarias del museo, etiquetadas arabiyya-browser y arabiyya-<section>. El texto de las aleyas procede únicamente de los archivos Tanzil congelados. Donde los sabios discrepan, la ficha da cada opinión con su nombre y no emite veredicto."
