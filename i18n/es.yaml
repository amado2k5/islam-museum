hasanat:
  title: "Explorador de hasanat"
  lede: "Todas las menciones de las buenas obras (al-hasanat) en las fuentes del museo: las aleyas coránicas que las escriben, las multiplican y las borran, los hadices sobre el registro de las intenciones y las obras, el buen préstamo a Dios, la buena intercesión y la recompensa «الحسنى», y cada mención en la sira, los relatos, los informes de los Compañeros y los Sucesores y cada libro cosechado: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: "Explorador de buenas obras"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Las menciones se encuentran en el momento de la compilación mediante un léxico protegido sobre los textos de los pasajes: «الحسنات»، «حسنات»، «الحسنة»، «حسنة»، «الحسنى» con restricción (los usos como nombres divinos quedan fuera), y las colocaciones fijas «قرضا حسنا» y «بدل حسنا بعد سوء»; quedan fuera «حسن»/«الحسن» sueltos (nombres, el grado del hadiz), el adverbio «حسنا» y «حسنة» como adjetivo femenino de un sustantivo anfitrión, los falsos positivos verificados se excluyen por id, y cada libro cosechado más adelante aporta aquí sus menciones de forma automática cuando sus pasajes llegan al grafo; los registros curados se incorporan mediante la etiqueta hasanat-browser. Cada pasaje se marca como hasanat, hasana o husna según su término dominante."
  api: "El conjunto completo está disponible en"
  sections_title: "Las secciones del explorador"
  filter_label: "Filtrar buenas obras"
  filter_none: "Sin coincidencias."
  empty: "Todavía no hay registros de buenas obras en esta versión."
  kinds:
    hasanat: "«الحسنات» — las buenas obras"
    hasana: "«حسنة» — una buena obra"
    husna: "«الحسنى» — la mejor recompensa"
  sections:
    quran:
      title: "En el Corán"
      desc: "Cada mención coránica de las buenas obras: «إن الحسنات يذهبن السيئات»، «من جاء بالحسنة فله عشر أمثالها»، «فأولئك يبدل الله سيئاتهم حسنات»، «أقرضوا الله قرضا حسنا»، «الحسنى» la recompensa del ihsan, y las aleyas donde «حسنة» tiene el sentido de bien mundano."
    sunnah:
      title: "En la Sunna"
      desc: "Los hadices de los dos Sahih, el Muwatta, los Arba'in y los Sunan: el hadiz qudsi del registro de las buenas y malas obras, «كل عمل ابن آدم يضاعف الحسنة»، «من سن في الإسلام سنة حسنة»، el geco y similares, y cada relato que cita o enseña sobre الحسنات."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen de las buenas obras; esta sección se completa sola a medida que llegan nuevos textos de la sira con menciones de الحسنات."
    books:
      title: "En los otros libros"
      desc: "Menciones de las buenas obras en toda otra obra cosechada (poesía, historia, fiqh y lo que llegue después), clasificadas por el género de la obra el día en que llegan sus pasajes."
    curated:
      title: "Los registros sobre las buenas obras"
      desc: "Los registros curados del museo sobre الحسنات mismo: el concepto de las buenas obras, el buen préstamo a Dios, el libro de las obras, los registros de intención y resolución, y los relatos donde las buenas obras se pesan, se multiplican o borran los pecados."
  viz:
    title: "Dónde se nombran las buenas obras"
    caption: "Los pasajes de las fuentes del museo que nombran buenas obras, contados según dónde aparecen: el Corán por sura y el hadiz por colección. Cada estante se escala a su lomo más alto. {n} pasajes están en los dos estantes; otros {e}, de la sira, otros libros y registros curados, están en las listas de abajo."
