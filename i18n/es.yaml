  'logo_lockup_download': 'Descargar la marca con el nombre'
  'story_title': 'La historia'
  'story_1': 'El proyecto nació de una pregunta sencilla: ¿por qué no existe en línea un único lugar que reúna toda la historia del islam, donde un desconocido pueda entrar y aprender, y un investigador pueda comprobar una afirmación y volver a la fuente? Lo que se sabe del islam está disperso en sitios de escrituras, archivos de museos, artículos de enciclopedia, estudios académicos y prensa, y gran parte está escrito para defender o atacar más que para comprender.'
  'story_2': 'El proyecto decidió construirse como un museo y no como un único artículo largo: nueve alas (Tiempo, Lugar, Personas, Ideas, Objetos, Palabras, Islam vivo, Hoy y Hecho) miran el mismo asunto desde ángulos distintos, y cada persona, lugar, acontecimiento, idea u objeto es un nodo de un grafo que lo conecta con lo que lo rodea en el tiempo y el espacio.'
  'story_3': 'El material se conserva como archivos sencillos y legibles, con cada dato vinculado a una fuente y cada fecha escrita en su forma precisa, con sus calendarios hijri y gregoriano. El sitio en sí es un conjunto de páginas estáticas: sin servidor, sin base de datos, sin servicios de pago y sin ningún modelo de IA en funcionamiento cuando llega un visitante.'
  'story_4': 'Cuando el museo eligió su identidad visual, sus colores vinieron de la arquitectura islámica y de la elaboración de manuscritos: el azul lapislázuli profundo, el dorado apagado de las páginas de manuscrito, el alabastro cálido y la arena de los azulejos. No se copió ningún ornamento de una obra existente; los motivos nacen de la geometría de la estrella, el cuadrado y el círculo.'
  'story_5': 'Después llegó el trabajo compartido: colaboradores y sesiones de trabajo en paralelo añaden pequeños lotes de material, y la revisión convierte los borradores en entradas revisadas antes de marcarlas como tales. El museo sigue en construcción y lo dice en cada página; la página de cobertura cuenta lo que está completo y lo que aún espera.'
  'founder_title': 'El fundador'
  'founder_line': 'Fundado por {name}, canadiense de origen egipcio, residente en Oakville, Ontario.'
  'founder_name': 'Ahmed Abdel Aal'
  'founder_body': 'Una sola persona fundó el proyecto y escribió su primer plan dentro del propio repositorio; luego abrió la puerta a quien quisiera añadir o corregir. El plan está hecho para que el museo sobreviva aunque su fundador se detenga: su texto está en git, sus datos son abiertos y cualquiera puede copiar todo el museo a su propio ordenador. Esta página describe el proyecto y su propósito, no la vida de la persona que está detrás.'
  'independence_title': 'Independencia'
  'independence_1': 'islam.museum es el proyecto personal de su fundador, que lo dirige en solitario. Su gestión, propiedad y decisiones nunca se comparten, y no está en venta: ninguna financiación, alianza ni apoyo de ningún tipo da a nadie control sobre él.'
  'independence_2': 'El museo nunca se fusionará con otro proyecto y no está bajo ningún paraguas ni supervisión: ni gobierno, ni institución religiosa, ni empresa, ni fundación. Todos son bienvenidos a ayudar: con comentarios y correcciones, voluntariado, financiación y recaudación de fondos, materiales, pruebas, código, escribiendo sobre el museo y difundiéndolo. La ayuda se agradece y se reconoce, y no conlleva autoridad alguna: el museo sigue siendo independiente, del pueblo para el pueblo.'
  'terms_title': 'De uso libre, y en qué términos'
  'terms_1': 'Todo lo que hay aquí es de uso libre, sin pedir permiso: todos los datos, recursos y servicios del museo, presentes y futuros, de cualquier manera y sin límite, y sin ningún control por nuestra parte. Puedes clonar, bifurcar o copiar todo el código y empezar un proyecto similar, modificado o totalmente nuevo; el fundador no presentará ninguna reclamación de derechos de autor ni emprenderá acción legal contra tales iniciativas. Los datos son CC0, la prosa CC BY-SA 4.0 y el código MIT.'
  'terms_2': 'El museo puede cambiar cualquier cosa en cualquier momento (el sitio web, su contenido, su código, su alojamiento, su rendimiento, su arquitectura y su despliegue) sin consentimiento previo, sin aprobación y sin aviso a nadie. No hay acuerdo de nivel de servicio ni garantía de ningún tipo: si el sitio falla, se cae, no está disponible o cambia, no cabe reclamación alguna contra el museo ni su propietario por ello.'
  'terms_3': 'Lo que hagas con lo que encuentres aquí es responsabilidad tuya. Ni el sitio web, ni su propietario, ni la empresa de alojamiento son responsables del comportamiento, las acciones, la adopción, la aplicación, la reproducción o la reutilización del contenido publicado por parte de nadie, ni de ningún malentendido, tergiversación, uso indebido o daño que se derive de los actos de un visitante. Cada registro cita sus fuentes y muestra su estado de revisión, pero la exactitud se cita, no se garantiza (la fuente citada es donde una afirmación se comprueba en última instancia), y los sitios que enlazamos son responsabilidad de sus propietarios.'
  'terms_4': 'Cualquier autor o entidad con un derecho sobre algún contenido puede pedir en cualquier momento su retirada o modificación: las herramientas de informe de este sitio están siempre abiertas precisamente para eso, y esas solicitudes se atienden en primer lugar. Todas las opiniones y puntos de vista expresados en este sitio son únicamente del fundador y no reflejan los de su empleador.'
  'purpose_title': 'Sin ánimo de lucro, sin agenda'
  'purpose_1': 'islam.museum no se gestiona con ánimo de lucro ni de ganancia. No persigue ninguna agenda y no sirve a ninguna necesidad gubernamental ni empresarial. Es gratuito para todos: sin suscripciones, sin rastreo y sin intención de usar ni vender la información de nadie a nadie.'
  'purpose_2': 'Mantener el museo cuesta dinero real cada mes, y su fundador asume esos costes personalmente. Los voluntarios son bienvenidos, y quien lo desee puede donar para los costes, como prefiera, sin compromiso, sin obligación y sin control a cambio.'
  'purpose_3': 'En el futuro, el museo planea una tienda de regalos o bazar en línea en una sección propia, clara y separada del sitio, donde se podrán listar y vender artículos para quien quiera verlos o comprar, como ayuda para los costes. No llevará anuncios, ni spam, ni solicitudes, y visitarla será siempre opcional; hasta que abra, no hay tienda y el museo en sí sigue siendo gratuito.'
  'purpose_4': 'El museo se opone con firmeza al odio, al discurso de odio y al daño (a la islamofobia, el antisemitismo, el racismo, el genocidio, la limpieza étnica y todo lo que las Naciones Unidas clasifican como odio o racismo) y apoya y promueve la diversidad, la diferencia de opinión y la paz. No apoya una opinión contra otra ni una narración de la historia contra otra: es un archivo y una biblioteca del patrimonio humano que presenta lo que otros hicieron y escribieron tal como es, desde su propio punto de vista. Sus opiniones son solo suyas; el museo no respalda a nadie, no predica nada y no ofrece consultas, servicios ni consejos de ningún tipo. La Carta lo expone íntegramente (artículo 10). El museo no reclama derechos de autor, patentes ni propiedad sobre nada de lo que presenta, y no ofrece incentivo, dinero ni beneficio a nadie por visitarlo, verlo o promoverlo: quien viene, viene por su libre voluntad.'
  'contact_title': 'A quién escribir'
  'contact_press': 'Prensa y medios'
  'contact_copyright': 'Reclamaciones de derechos de autor'
  'contact_concerns': 'Cualquier otra inquietud'
  'goal_title': 'La meta'
  'goal_intro': 'La meta del museo es mostrar el islam en su totalidad, desde sus comienzos hasta el presente, con justicia y sin sesgo. Para ello se compromete a lo siguiente:'
  'goal_1': 'Describe en lugar de prescribir: hechos con fechas y fuentes, y juicios atribuidos a quienes los emitieron.'
  'goal_2': 'El relato suní es el marco principal de investigación, y cualquier otra visión se expone solo después de etiquetarla con claridad.'
  'goal_3': 'Opositores, críticos y aliados aparecen con sus papeles en su propio tiempo, tratados sin el lenguaje de la enemistad.'
  'goal_4': 'Las cuestiones disputadas aparecen como tarjetas de tensión: dos o más voces, cada una citada, sin veredicto del museo.'
  'goal_5': 'Cada afirmación está vinculada a una fuente; Wikipedia es una referencia, nunca una fuente.'
  'goal_6': 'Empieza en árabe y sirve tanto al visitante que no sabe nada del islam como al especialista.'
  'take_title': 'Participa en su construcción'
  'take_body': 'El contenido y el código están abiertos a todos. Puedes leer el repositorio, informar de un error, sugerir una nueva entrada o pedir una traducción a otro idioma.'
  'take_repo': 'El repositorio en GitHub'
  'take_suggest': 'Sugerir una entrada o una corrección'
  'license': 'Licencia: texto CC BY-SA 4.0 · datos CC0 · código MIT'
  'breadcrumb': 'Museo'
explore:
  groups:
