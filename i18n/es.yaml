    curated:
      title: "Registros sobre hudud y kaba'ir"
      desc: "Registros curados del museo sobre los propios límites de Dios y los pecados mayores: los conceptos de hudud Allah, las penas fijas, los kaba'ir, la lapidación, el castigo discrecional, la fornicación y lo que se relaciona con ellos."
