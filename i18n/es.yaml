  method_title: El método del navegador
  method_note: "Este navegador reúne lo que se dice y se escribe sobre cinco asuntos conectados: testamentos y consejos de despedida, últimas horas, herencias y lo que se dejó, reliquias, y sepelios y tumbas. Las aleyas del Corán proceden de una tabla revisada (los testamentos de Ibrahim y Ya'qub, los consejos de Luqman, las aleyas sobre el legado y la herencia, sobre las reliquias y sobre la muerte y el entierro); el texto de las aleyas es el texto congelado de Tanzil y nunca se reescribe. Cualquier otro pasaje (hadiz, sira, historia, biografía) se encuentra al compilar mediante una lista de palabras protegida, de modo que un pasaje de un libro cosechado más adelante aparece aquí el día en que llega. Los extractos de libros se leen por máquina desde escaneos, se citan dentro de las cuarenta palabras y no se corrigen. Las reglas generales de herencia de los juristas no se reúnen aquí: solo las herencias de personas concretas y las propias palabras del Profeta sobre la herencia. La identificación de una tumba es siempre la afirmación de la fuente citada, no del museo. Las fuentes sunníes son el marco; cualquier otra opinión se rotula."
