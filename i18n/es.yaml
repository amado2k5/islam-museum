qurun:
  title: "Navegador de siglos, años y meses"
  lede: "Cada mención de los siglos y las generaciones, los años y los años con nombre, los meses importantes y los meses sagrados en las fuentes del museo: los qurun y las generaciones, los años con nombre de la sira (el Año del Elefante, el Año de la Tristeza, el Año de las Delegaciones, el Año de al-Ramada), los doce meses lunares de Muharram a Dhu al-Hijja, los cuatro meses sagrados y la intercalación (al-Nasi'), los días de Tashriq, el día de 'Arafa, la Noche del Destino y las últimas diez noches, los nombres de los meses de la Yahiliyya y los meses persas, y cada libro que los trata: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de siglos y meses
  status: "Esta versión reúne {n} registros en {s} secciones y {p} páginas temáticas; los textos siguen en borrador hasta que una persona los lea."
  method_title: El método del navegador
  method_note: "Cada registro aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Las menciones de siglos, años y meses se encuentran al compilar mediante un léxico protegido sobre los textos de los pasajes: el singular «سنة» no cuenta cuando es la sunna o práctica y no el año, «عام» cuenta solo en las fórmulas de años con nombre o junto a colocaciones temporales, «قرون» junto a bueyes y ganado son cuernos y no generaciones, «صفر» el dígito, «رجب» el nombre de persona y «محرم» el término jurídico cuentan solo junto a sus colocaciones de mes, y los falsos positivos verificados se excluyen por id; también entran los pasajes ya vinculados por aristas explícitas de menciones a los temas de tiempo; cada libro cosechado más adelante aporta aquí sus menciones de meses y años automáticamente en cuanto sus pasajes llegan al grafo, y los registros curados se unen mediante la etiqueta qurun-browser."
