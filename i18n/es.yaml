nubuwat:
  title: "Explorador de profecías y milagros"
  lede: "Cada profecía del Profeta, prueba de la profecía, secreto y maravilla del Corán, milagro del Profeta y predicción escatológica en las fuentes del museo: los anuncios coránicos y los relatos de «من بعدي», las pruebas de la profecía ⁦(دلائل النبوة)⁩, la inimitabilidad del Corán y sus secretos, la división de la luna, el viaje nocturno, el alimento multiplicado y cada maravilla que registra la tradición: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: "Explorador de profecías"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
