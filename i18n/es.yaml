places:
  title: "Explorador de lugares sagrados"
  lede: "Cada lugar de santidad, importancia y valor en el islam que mencionan las fuentes del museo: los tres santuarios de La Meca, Medina y Jerusalén, las estaciones del hayy, los sitios de la sira y de las batallas, los lugares que el Corán nombra y las naciones que relata, otros sitios venerados, y cada lugar o edificio que nombra un pasaje del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores o un libro cosechado, cada uno con todas las aleyas y relatos citados."
  badge: "Explorador de lugares sagrados"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo: un nodo de lugar o edificio del grafo único, con sus fuentes y su prosa en tres idiomas. La pertenencia es pertenencia al grafo: un registro se incorpora mediante la etiqueta places-browser o mediante la arista mentions de cualquier pasaje, de modo que un lugar nombrado en un libro cosechado más adelante aparece aquí el día en que llega el registro de su pasaje. En cada página de tema, los pasajes que lo mencionan se agrupan por corpus (el texto congelado de Tanzil del Corán, mostrado por referencia y nunca retecleado, los relatos de la Sunna, los relatos de la sira y los otros libros), y cada tarjeta enlaza con las páginas ordinarias de la entidad y del pasaje."
