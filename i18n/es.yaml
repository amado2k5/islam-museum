umuma:
  title: "Explorador de la maternidad en el islam"
  lede: "La maternidad en las fuentes del museo: la madre, su posición y el deber que se le debe, el embarazo y el parto, la lactancia, la custodia y la crianza de los hijos, y las madres de profetas, Compañeros y Tabi'in — en el Corán, los dos Sahih, el Muwatta y los Sunan, los libros de sira, los informes de los Compañeros y los Tabi'in y cada libro recopilado — registros con sus fuentes que crecen a medida que llega cada nuevo texto."
  badge: Explorador de la maternidad
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: Cómo funciona este explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo con sus fuentes y su prosa en tres idiomas. Las menciones de la maternidad se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes, en seis familias: la madre y su posición ⁦(أمه، أمها، أمهات، والدة، أمومة، أمهات المؤمنين)⁩, el embarazo ⁦(حامل، حوامل، حملت، وهن على وهن)⁩, el parto ⁦(ولادة، ولدت، تلد، مولود، وضعت، مخاض، نفاس)⁩, la lactancia ⁦(رضاعة، أرضعت، مرضعة، رضيع، فطام، فصال)⁩, la custodia y la crianza ⁦(حضانة، حاضنة، تربية، فلذة، كفالة اليتيم)⁩ y la piedad hacia los padres ⁦(بر، إحسان، صلة الرحم)⁩. Las palabras ambiguas están controladas: el simple «أم» cuenta solo junto a vocabulario familiar ⁦(أم القرى y أم الكتاب quedan excluidos)⁩, «حمل» cuenta en el sentido de embarazo solo junto a vocabulario de embarazo (cargar y transportar quedan excluidos), «ولد» en el sentido de niño queda fuera y solo cuentan las formas de nacimiento, «بر» cuenta solo junto a vocabulario de padres ⁦(برّ en el sentido de tierra firme queda excluido)⁩, y los falsos positivos verificados se excluyen por id. Cada libro recopilado más adelante aporta aquí sus menciones de la maternidad de forma automática; los registros curados se suman mediante la etiqueta umuma-browser; las madres registradas se leen de las propias aristas child_of del grafo hacia progenitoras."
