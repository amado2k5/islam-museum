      desc: "La Meca y la Mezquita Sagrada con la Kaaba, Medina y la Mezquita del Profeta, Jerusalén y al-Aqsa: el suelo más sagrado del islam, con cada aleya y relato que los mencionan."
    hajj:
      title: "Las estaciones del hayy"
      desc: "La propia geografía del rito: al-Safa y al-Marwa, Mina, Arafat, Muzdalifa, las Jamarat y las estaciones de miqat donde los peregrinos entran en ihram."
    seerah:
      title: "Los sitios de la sira"
      desc: "El suelo que recorrió la vida del Profeta: la cueva de Hira y la cueva de Thawr, Quba, Uhud, Badr, Hunayn, al-Hudaybiyya, Khaybar, al-Ta'if, al-Baqi' y el resto de los lugares con nombre de la biografía y las campañas."
    quran:
      title: "Lugares nombrados en el Corán"
      desc: "Las ciudades, tierras y montañas que nombra el Corán: Madyan, Saba, Misr, Babil, Iram, al-Ahqaf, el monte Yudi, el monte Sinaí, Najran, Yathrib y las tierras de las naciones que relata."
    sacred:
