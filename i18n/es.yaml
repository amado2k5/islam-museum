qudsi:
  title: "Navegador de hadices qudsi"
  lede: "Un hadiz qudsi es un relato que el Profeta transmite de su Señor con palabras distintas de las del Corán. Aquí está cada hadiz qudsi de los seis libros y del Muwatta de Malik, reunido con sus transmisiones en cada colección y ordenado por temas; cada transmisión es una página del museo."
