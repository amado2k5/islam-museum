  title: "Explorador de la Resurrección y el Ajuste de cuentas"
  lede: "Cada mención de la Resurrección (al-ba'th), el Día del Juicio (yawm al-qiyama) y el ajuste de cuentas (al-hisab) en las fuentes del museo: los nombres del Día en el Corán — al-Haqqa, al-Qari'a, al-Sakhkha, al-Ghashiya, yawm al-din, yawm al-fasl — los toques de la Trompeta, la salida de las tumbas y la reunión, los terrores y el sudor y el sol acercado, la exposición y los registros, la primera cuenta del siervo, la Balanza y el pesaje, la retribución entre las criaturas, la Sombra, el Hawd, la intercesión y el Sirat — cada aleya e informe citado, en cada libro recopilado, creciendo a medida que llegan nuevos textos."
  badge: Explorador de la Resurrección
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa en tres idiomas. Las menciones se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes: los compuestos fijos del Día ⁦(«يوم القيامة»، «يوم الدين»، «يوم الفصل»، «يوم الحساب»…)⁩ y sus nombres ⁦(الحاقة، القارعة، الصاخة، الغاشية)⁩ cuentan directamente; los lexemas ambiguos — «بعث» que puede significar el envío de un mensajero, «الساعة» una hora del reloj, «حساب» aritmética, «الصراط» el camino recto, «شفاعة» cualquier mediación — cuentan solo junto a una colocación de resurrección o ajuste de cuentas, y los falsos positivos verificados se excluyen por id. Cada libro recopilado más adelante aporta aquí sus menciones de forma automática en cuanto sus pasajes llegan al grafo; los registros curados se suman mediante la etiqueta qiyama-browser. Cada pasaje se marca como baath (la resurrección y la reunión), yawm (el Día, sus nombres y terrores) o hisab (ajuste de cuentas, balanza, registros y travesía). El barzaj y el interrogatorio de la tumba quedan en el explorador de las Señales de la Hora; las señales de la Hora mismas, el Paraíso y el Fuego tienen sus propios exploradores."
