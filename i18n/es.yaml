    ruqyah: "Ruqya"
    ayn: "El mal de ojo"
    hasad: "Envidia"
    waswasah: "Waswasa (susurro)"
    kashf: "Kashf (revelación)"
    irafa: "'Irafa (discernimiento místico)"
    jinn: "Jinn"
    nujum: "Astrología"
  sections:
    quran:
      title: "En el Corán"
      desc: "La hechicería y los magos a lo largo de la revelación: los magos del faraón y el desafío de Musa, la acusación contra el Profeta, la prueba de Harut y Marut, el velo del cielo, y las aleyas que nombran la hechicería, la adivinación y el daño invisible."
    sunnah:
      title: "En la Sunna"
      desc: "Los hadices de los dos Sahih, el Muwatta, los Arba'in y los Sunan: la hechicería entre los siete pecados destructivos, la prohibición de visitar adivinos, la curación del Profeta mediante la ruqya, el mal de ojo y los capítulos de ruqya de los libros de fiqh."
    seerah:
      title: "En la sira"
      desc: "Lo que los libros de sira e historia recogen de la magia y los magos; esta sección se completa sola a medida que llegan nuevos textos de la sira con menciones de magia."
    books:
      title: "En los otros libros"
      desc: "La magia en todo libro cosechado más allá del Corán, el hadiz y la sira (poesía, historia, fiqh y lo que venga después)."
    concepts:
      title: "Los registros sobre la magia"
      desc: "Los registros curados del museo sobre la magia y los daños invisibles que la rodean: la hechicería y el sahara, la adivinación y el augurio, la ruqya y sus normas, el mal de ojo, la envidia, la waswasa, el kashf y la 'irafa."
  viz:
    title: "Un vocabulario de las artes prohibidas"
    caption: "Estos son los términos que usan las propias fuentes, registrados tal como las fuentes los tratan, sin instrucción alguna. Cada arco es un tema, tan largo como su número de registros; un registro que lleva dos temas cuenta en ambos; el anillo fino exterior divide cada arco por la sección en que están sus registros. {n} registros llevan al menos un tema y se dibujan; {u} no llevan ninguno y no se colocan."
