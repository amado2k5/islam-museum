munazarat:
  title: "Explorador de munazarat"
  lede: "Todas las menciones de debates y disputas en las fuentes del museo: los argumentos del Corán (Ibrahim con su pueblo y Nimrod, Musa ante el faraón, la aleya de la mubahala, «discute con ellos de la mejor manera»), los debates del Profeta, los Compañeros y los Sucesores con judíos, cristianos y politeístas, el debate de Ibn Abbas con los jariyíes en Harura, las disputas de los eruditos en consejos y cortes, y los debates modernos: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: "Explorador de debates"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: "El método del explorador"
  method_note: "Cada registro de aquí es un registro ordinario del museo, con sus fuentes y su prosa en tres idiomas. Los debates se encuentran en el momento de la compilación mediante un detector protegido sobre los textos de los pasajes: los verbos de disputa ⁦(ناظر، تناظر، جادل، حاجّ، احتج، باهل، حاور، اختصم)⁩, los sustantivos de género ⁦(مناظرة، جدال، محاجّة، مباهلة)⁩ y anclas de episodios con nombre ⁦(«نصارى نجران» con la mubahala, «حروراء» con Ibn Abbas y los jariyíes, «النجاشي» con Ja'far y Amr ibn al-As)⁩; el juramento de li'an del fiqh, la trenza «جديلة», حَجّ la peregrinación, «احتاج» el necesitar y el sentido de espectador de «ناظر» quedan fuera, los falsos positivos verificados se excluyen por id, y cada libro cosechado más adelante aporta aquí sus debates de forma automática cuando sus pasajes llegan al grafo; los registros curados se incorporan mediante la etiqueta munazarat-browser. Cada pasaje se marca como debate cuando contiene un intercambio real y como mención cuando solo trata de la disputa, y las fichas de oponente clasifican el debate como con las gentes de las Escrituras, los politeístas, dentro de la umma u otro."
