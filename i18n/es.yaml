  sections:
    shajara:
      title: "El árbol de los profetas y mensajeros"
      desc: "Los eslabones del linaje del Profeta y los profetas de la descendencia de Ibrahim: la cadena admitida desde Abdullah ibn Abd al-Muttalib hasta Adnan, los eslabones discutidos de Adnan a Ismail y la línea de Ishaq hasta Isa ibn Maryam — cada eslabón, un registro citado con su relato."
    tribes:
      title: "Las tribus y los clanes"
      desc: "Las tribus árabes y sus clanes tal como los cuentan los libros de genealogía y de sira: Quraysh y sus clanes Hashim, Umayya, Abd Shams, Majzum, Zuhra y al-Najjar; Aws y Jazray; Juza'a; Tamim, Hawazin, Zaqif, Gatafan, Hudayl, Sulaym, Asad, Juhayna, Muzayna, Gifar, Ashja', al-Azd, Lajm, Gassan, Hamdan, Himyar, Madhyich, Quda'a, Tayy, Shayban, Bakr, Taglib, Abd al-Qays, Kinda, Dabba, Yarbu', Kinana, Murad, Anmar, Abs y Amir; las tribus judías del Hiyaz — Nadir, Qaynuqa' y Qurayza; y 'Aad y Thamud, de los árabes desaparecidos."
    peoples:
      title: "Los pueblos y las naciones"
      desc: "Los pueblos y las naciones tal como los nombran los textos: los árabes, los ajam, los persas, los rum «los hijos del Amarillo», los habasha, los coptos, los turcos, los bereberes, los kurdos, los mongoles y los Banu Isra'il — de quienes se dijo «ningún árabe es mejor que un no árabe salvo por la taqwa»."
    butun:
      title: "Los butun — subdivisiones tribales"
      desc: "Los butun de las tribus —el nivel por debajo de la tribu y por encima del fakhidh— tal como los enumeran los libros de genealogía y de sira: los clanes de Quraysh — Hashim, al-Muttalib, Abd Manaf, Abd Shams, Abd al-Dar, Majzum, Jumah, Sahm, Zuhra, Taym, Adi y Umayya; los clanes de Aws y Jazray — al-Najjar, Abd al-Ashhal, Zafar, Haritha, al-Harith, Salima, Zurayq, Bayada, Amr ibn Awf, Jatma, Waqif, Magala, al-Ajlan, Dubayb, Sa'ida y Salul; y los clanes de Hawazin y Qays — Darim, Hanzala, Fazara, Murra, Kilab, Nasr, Jusham, Uqayl y Sa'd ibn Bakr."
    curated:
      title: "Registros sobre genealogía"
      desc: "Los conceptos de genealogía de los sabios: nasab y ansab, el linaje del Profeta en sus tres partes, la gente de la genealogía, la detención del linaje en Ma'add y el parentesco por linaje en el fiqh."
    mentioned:
      title: "Las demás menciones"
      desc: "Registros que se incorporaron automáticamente por ser nombrados en los pasajes o por llevar la etiqueta del explorador: llegan aquí cada vez que aparece un nuevo nombre, tribu o matn en un libro recopilado."
  viz:
    title: "El árbol de las tribus"
    note: "Tribus, pueblos y clanes dibujados solo a partir de las aristas del grafo: un grupo cuelga del grupo del que forma parte o es miembro, o del grupo que su registro nombra como fundador, y un ancestro fundador se sitúa junto al grupo que fundó. {n} de los {t} registros de grupos están unidos por {e} aristas en {r} árboles; {u} aún no tienen ninguna arista hacia otro tema y esperan abajo. El tamaño de un círculo sigue las menciones del tema en las fuentes del museo (raíz cuadrada, acotada)."
