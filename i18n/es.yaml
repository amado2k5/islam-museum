ubuwwa:
  title: "Explorador de la paternidad en el islam"
  lede: "El padre y la paternidad en las fuentes del museo: los padres del Corán — Ibrahim y su dua, Ya'qub y Yusuf, el consejo de Luqman a su hijo, la oración de Zakariyya, la casa de 'Imran —, la piedad hacia los padres (birr al-walidayn) y la advertencia del 'uquq, el Profeta como padre con sus hijos y nietos, la paternidad y el linaje (nasab), los testamentos de los padres y la crianza de los hijos, y el huérfano cuyo padre ha muerto — en el Corán, los dos Sahih, el Muwatta y los Sunan, los libros de sira, los informes de los Compañeros y los Sucesores, y cada libro recopilado — registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de la paternidad
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa en tres idiomas. Las menciones de la paternidad se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes, en cinco familias: el padre mismo ⁦(أبوة، أبوه، أبيه، أبونا، آباء، والده، يا أبت)⁩, la piedad y la desobediencia hacia los padres ⁦(بر الوالدين، بالوالدين إحساناً، عقوق، رضا الوالدين)⁩, la crianza y el consejo ⁦(لقمان، يا بني، تربية، وصية أبيه، علموا أولادكم)⁩, la paternidad y el linaje ⁦(نسب، انتساب، ادعاء، الولد للفراش)⁩ y el huérfano ⁦(يتيم، يتامى، كفالة اليتيم)⁩. Las palabras ambiguas están controladas: la kunya «أبو فلان» nombra a un hombre y no informa de paternidad alguna, así que el simple «أبو» nunca cuenta — solo las formas de padre con posesivo, plural y vocativo; el vocabulario de hijos cuenta solo junto a una palabra de padre en la misma ventana ⁦(el «يا بني آدم» de Dios queda fuera)⁩; y los falsos positivos verificados se excluyen por id. Cada libro recopilado más adelante aporta aquí sus menciones de la paternidad de forma automática, y los registros curados se suman mediante la etiqueta ubuwwa-browser. Los padres famosos se leen de las propias aristas parent_of y child_of del grafo."
