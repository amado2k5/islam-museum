    ahruf: "El relato de que el Corán fue revelado en siete ahruf, sus transmisiones y lo que los sabios dijeron que significa."
    readings: "Las lecturas canónicas y no canónicas, las lecturas de los Compañeros transmitidas en hadices, y las aleyas en que los lectores difieren."
    readers: "Los lectores entre los Compañeros y los Sucesores, los siete y los diez imames y sus transmisores, y los autores sobre las lecturas."
    codex: "La puesta por escrito de la revelación, la recopilación de Abu Bakr, la copia de los códices por 'Uthman y su envío a las ciudades, y los códices de los Compañeros."
    rasm: "La ortografía de los códices 'uzmaníes y sus reglas, las diferencias entre los códices de las ciudades y el debate sobre la ortografía corriente."
    naqt: "Los puntos de las desinencias y los que distinguen las letras, los signos vocálicos, las marcas de decenas y divisiones, y los relatos sobre el rechazo inicial y la aceptación posterior."
    khatt: "La pluma, la tinta y las páginas en el Corán; las escrituras del mushaf, del hiyazí y el cúfico a las seis plumas y el magrebí; y los calígrafos."
  sections:
    quran:
      title: En el Corán
      desc: "Las aleyas sobre la lectura y la recitación pausada, la lengua de la revelación y su facilitación, la custodia del Libro y sus páginas, la pluma, la tinta y la escritura, y las aleyas en que se registra que los lectores o los códices de las ciudades difieren."
    sunnah:
      title: En la Sunna
      desc: "Los relatos de las siete ahruf, la recopilación del Corán y la copia de los códices, los libros de «letras y lecturas» en Abu Dawud y al-Tirmidhi, la lectura del Profeta y las lecturas de los Compañeros, y lo que se relata sobre el mushaf."
    seerah:
      title: En la sira
      desc: "Lo que los libros de sira recogen sobre la puesta por escrito de la revelación, sus escribas, y la lectura y enseñanza del Corán; esta sección se completa sola a medida que llegan nuevos textos de sira con tales menciones."
    books:
      title: En los demás libros
      desc: "Ciencias coránicas, lecturas, comentario, historia, biografía y los libros sobre escritura y caligrafía: cada libro cosechado más allá del Corán, el hadiz y la sira que trata estos asuntos, y lo que venga después."
