      desc: "Lo que recogen los libros de sira y dala'il: los capítulos sobre medicina profética en Zad al-Ma'ad de Ibn al-Qayyim, los informes de la enfermedad del Profeta, la apertura del pecho, la oveja envenenada de Khaybar y el cuidado de los heridos en las expediciones — esta sección se llena sola a medida que llegan nuevos textos de sira."
