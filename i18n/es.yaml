    title: "El Día, a lo largo del orden de la revelación"
    note: "Tres bandas, una por cada tipo de pasaje que marca este explorador, recorren las suras en el orden en que fueron reveladas. Un punto se sitúa donde una sura contiene aleyas de ese tipo, y cuanto mayor es el punto, más aleyas registra allí el explorador, de modo que es fácil ver en qué momento del curso de la revelación cada tema es denso. La franja inferior tiñe cada sura según su lugar de revelación, tal como lo indican los registros."
    headline: "de las {total} suras contienen aleyas de al menos uno de estos tres tipos"
