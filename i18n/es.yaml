  viz:
    title: "La escala de las cinco calificaciones"
    note: "Los libros de usul al-fiqh dividen en cinco lo que el Legislador dice de un acto. Una petición de actuar es lo obligatorio cuando omitirlo es censurado y lo recomendado cuando no lo es; una petición de dejar es lo prohibido cuando hacerlo es censurado y lo reprobado cuando no lo es; y donde hay elección, el acto es permitido. Los temas del explorador se sitúan en el grado al que pertenecen, con el número de registros de cada uno; la obediencia abarca los dos grados del hacer, y los pecados menores pertenecen al lado del dejar."
