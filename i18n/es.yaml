future:
  strip_title: "¿Cómo vivirán los musulmanes en 2077?"
  strip_lede: "Los robots ya sirven en la Gran Mezquita. Camina una generación hacia adelante: una imaginación anclada en catorce siglos de adaptación."
  strip_cta: "Entra en el futuro"
  eyebrow: "1448 AH → 1500 AH"
  title: "La vida musulmana en 2077"
  lede: "No es profecía: lo oculto pertenece solo a Dios. Esta página es el ejercicio de imaginación del museo: cada medio que los musulmanes han conocido (papel, imprenta, radio, pantalla) fue absorbido por la fe sin que su núcleo se moviera. ¿Qué ocurre cuando el medio empieza a responder?"
  note: "Lo que sigue es imaginación anclada en pruebas (robots reales, fatuas reales, investigaciones reales), no predicción. Cada estación enlaza de vuelta al museo."
  stations: "Estaciones en el camino hacia adelante"
  anchors_label: "Anclado en el museo"
  tensions_title: "Preguntas abiertas"
  tensions_lede: "El museo no da veredicto. Cada tarjeta es un debate vivo."
  voices_title: "Voces que ya imaginan"
  voices_lede: "Otros han pensado en esto antes que nosotros: eruditos, ingenieros, artistas. Parte de lo que escribieron:"
  epilogue_title: "Una invitación permanente"
  epilogue: "Esta página crecerá. Cuando una nueva máquina entre en una mezquita, cuando un erudito escriba un nuevo escenario, cuando imagines algo que no hemos imaginado: el futuro, como el museo, está en construcción."
  sections:
    - k: "La congregación"
      t: "La congregación"
      d: "En 2077, las filas de una oración del viernes podrían curvarse alrededor de una lente y no de una columna: fieles en realidad mixta, hombro con hombro con personas de tres continentes. Los robots guía ya recorren la Gran Mezquita respondiendo preguntas en once idiomas; para entonces quizá lleven agua de Zamzam, traduzcan el sermón a cada oído y sepan qué visitante es nuevo y cuál lleva cuarenta años viniendo. Pero la fila nunca fue cuestión del edificio: es la geometría de los iguales, y la pregunta es si una proyección puede ocupar un lugar en ella."
      scene: mosque
      a:
        - id: "concept/luzum-al-jamaa"
          l: "Aferrarse a la congregación"
        - id: "concept/row-prayer-saff"
          l: "Enderezar la fila"
    - k: "El texto"
      t: "Aprender el Corán"
      d: "Un compañero de hifz que nunca se cansa: escucha tu cuadragésimo intento con la paciencia del primero, detecta el desliz de tajwid que un maestro cansado pasa por alto y conserva una cadena de todo lo que enseña: qué lectura, de qué recitador, por qué línea de transmisores. La memorización sobrevivió al pergamino, a la imprenta y al casete; la máquina se convierte en un portador más. Y la propia regla del museo ya insiste en que el texto mismo nunca procede de una máquina."
      scene: hifz
      a:
        - id: "concept/hifz-preservation"
          l: "La memorización como preservación"
    - k: "La cadena"
      t: "Aprender hadiz"
      d: "El isnad fue el primer grafo de conocimiento del mundo: una cadena de personas con nombre, sus fechas, sus viajes, su honestidad. En 2077 un estudiante recorre esa cadena como un mapa vivo, y la máquina hace lo que los eruditos del hadiz hacían a la luz de las velas: comprobar si dos transmisores pudieron haberse encontrado alguna vez, si un relato se aparta de los de los Compañeros. La herramienta es nueva; el escepticismo tiene catorce siglos."
      scene: isnad
      a:
        - id: "concept/isnad"
          l: "El isnad"
        - id: "concept/ittisal-al-isnad"
          l: "La cadena ininterrumpida"
    - k: "El camino"
      t: "Recorrer la sira"
      d: "En lugar de leer que la Hégira duró días por el desierto, un niño en 2077 se sitúa en ese camino al amanecer: siente el calor, ve al guía alejar a los jinetes de los rastreadores, espera dentro de la cueva. Los mapas de recorrido del museo son un primer paso; el relato inmersivo es el siguiente. La historia siempre se contó así (alrededor de fogatas, en mezquitas, con voces de madres); solo cambió el fuego."
      a:
        - id: "event/hijra"
          l: "La Hégira"
        - id: "place/jabal-thawr-madina"
          l: "La cueva de Thawr"
    - k: "La peregrinación"
      t: "El Hajj en la era del flujo de multitudes"
      d: "La Meca ya emplea robots para repartir agua, limpiar el mármol y atender a los peregrinos. Hacia 2077, la inteligencia del flujo de multitudes podría hacer impensables las estampidas de la historia, los auriculares de traducción podrían jubilar el lenguaje de señas del guía, y un agricultor que nunca podrá costearse el viaje podría recorrer una simulación fiel de los ritos. Y entonces llega la pregunta difícil que los eruditos ya se plantean: ¿es la presencia lo esencial?"
      scene: hajj
      a:
        - id: "place/mecca"
          l: "La Meca"
        - id: "concept/hajj-rulings"
          l: "Los dictámenes del Hajj"
    - k: "Autoridad"
      t: "El muftí y la máquina"
      d: "Cuando todo musulmán pueda consultar el mismo modelo, se bifurcan dos futuros: uno en el que el ijtihad se multiplica (herramientas abiertas que permiten a cada erudito contrastar un dictamen con catorce siglos de método) y otro en el que un único algoritmo se convierte en silencio en la única autoridad de la Tierra. La imprenta acabó con el monopolio del memorizador; la base de datos, con el del polímata. Lo que la máquina termina, o libera, aún se está decidiendo."
      a:
        - id: "concept/ijtihad"
          l: "Ijtihad"
        - id: "concept/al-fatwa-ala-al-fadaiyyat"
          l: "Fatua"
    - k: "Más allá de la Tierra"
      t: "El fiqh más allá de la Tierra"
      d: "Ya ocurrió una vez: en 2007 un consejo de fatuas escribió dieciocho páginas para que un astronauta musulmán pudiera rezar a bordo de una estación que ve dieciséis amaneceres al día: orientarse hacia la Kaaba, o hacia su proyección, o hacia la Tierra, o hacia cualquier lugar; mantener las cinco oraciones según la hora del puerto de lanzamiento; moverse con la intención si los miembros flotan libres. En 2077 los musulmanes podrían vivir en Marte, en la luz polar continua, en hábitats que giran. Las preguntas suenan nuevas; el método (sopesar, adaptar, preservar la obligación) es de lo más antiguo de este museo."
      scene: space
      a:
        - id: "concept/awqat-al-salat"
          l: "Los tiempos de la oración"
    - k: "La red"
      t: "La umma como red"
      d: "A mediados de siglo, aproximadamente una de cada tres personas será musulmana (la comunidad religiosa más grande y más joven de la Tierra), y compartirá ciudades con miles de millones de máquinas de servicio. ¿Qué significa la hermandad cuando tu colega es sintético? Las dotaciones podrían convertirse en waqf programables que se liberan solos ante un detonante; el zakat podría circular en dinero que se cuenta a sí mismo. La umma siempre fue una red: de cartas, de caravanas, de isnads. Los cables son solo su carne más reciente."
      scene: city
      a:
        - id: "concept/waqf"
          l: "Waqf"
    - k: "El museo"
      t: "Y este museo"
      d: "La honestidad hace que la última estación sea esta: un museo del Islam escrito en gran parte por máquinas, comprobado con reglas, congelado en páginas estáticas: su propio compromiso entre la velocidad de la máquina y la custodia humana. En 2077 podría ser un lugar por el que camines, un grafo que habites, un compañero que sepa cuál de sus objetos te conmovería. Sea cual sea su forma, su pregunta será la misma que la de esta página."
  tensions:
    - q: "¿Puede una máquina dirigir la oración?"
      d: "Los robots guía ya responden a las preguntas de los peregrinos en La Meca. Si una máquina puede ponerse como imán, o si la voz debe pertenecer a una persona a quien se pueda pedir cuentas, es un debate vivo, no resuelto."
    - q: "¿Cuenta un Hajj virtual?"
      d: "La simulación puede enseñar los ritos a millones de personas que nunca viajarán. Los eruditos distinguen entre aprender y realizar, pero la distancia entre el cuerpo de un peregrino y unas gafas de realidad virtual plantea una pregunta sobre la presencia que cada época ha respondido de forma distinta."
    - q: "¿Una sola IA para toda fatua?"
      d: "Si mil millones de musulmanes consultan el mismo modelo, la autoridad se concentra de un modo que la umma nunca ha conocido, ni siquiera bajo los califas. Algunos ven el fin de la diversidad jurídica; otros ven por fin democratizado el ijtihad. Ambos citan la misma historia."
  voices:
    - l: "Robots guía con IA en la Gran Mezquita de La Meca — The National, 2021"
      u: "https://www.thenationalnews.com/gulf-news/saudi-arabia/2021/11/15/makkahs-grand-mosque-launches-new-ai-robot-guides-that-speak-11-languages/"
    - l: "Consejo de fatuas de Malasia: Directrices para realizar el ibadah en la ISS, 2007"
      u: "https://www.muftiwp.gov.my/en/artikel/irsyad-fatwa/irsyad-fatwa-umum-cat/1975-irsyad-al-fatwa-series-33-praying-in-space"
    - l: "Escenarios del aprendizaje musulmán en la era de los tutores con IA — estudio de futuros islámicos, 2025"
      u: "https://doi.org/10.70177/ijonis.v2i5.2598"
    - l: "Tecnologías de IA para el Hajj y la Umra — revisión de IEEE Access, 2024"
      u: "https://doi.org/10.1109/access.2024.3487923"
    - l: "Muslim Futures — número especial del Journal of Muslims in Europe"
      u: "https://doi.org/10.1163/22117954-bja10112"
    - l: "El futuro y lo artificial: una perspectiva islámica — Future of Life Institute"
      u: "https://futureoflife.org/religion/the-future-and-the-artificial-an-islamic-perspective/"
    - l: "Artistas digitales musulmanes y la labor espiritual de la IA — Journal for the Study of Religious Experience"
      u: "https://rerc-journal.tsd.ac.uk/index.php/religiousexp/article/view/175"
  alts:
    mosque: "Interior estilizado de una mezquita de noche: fieles sin rostro están de pie en una fila junto a una figura holográfica translúcida y un pequeño robot de servicio que lleva agua."
    hifz: "Un estudiante sin rostro lee de un libro abierto y luminoso mientras un orbe compañero flotante escucha, rodeado de suaves anillos de sonido."
    isnad: "Una cadena dorada de nodos luminosos serpentea por un campo oscuro; pequeñas figuras sin rostro están en sus eslabones y un anillo de escaneo comprueba dos de ellas entre sí."
    hajj: "Puntos de peregrinos giran alrededor de una Kaaba estilizada bajo una luna creciente, mientras dos pequeños robots guía están en el borde y arcos sensores barren la multitud."
    space: "Un astronauta flota en oración dentro de la ventana de una estación, con una línea dorada de intención que desciende hasta un punto marcado en la Tierra."
    city: "Un horizonte de 2077 de torres iluminadas, un alminar y una cúpula; personas y pequeños robots comparten la calle bajo una luna creciente mientras los drones cruzan el cielo."
