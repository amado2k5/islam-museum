sport:
  trio_label: "El trío profético: equitación, natación, tiro con arco"
  title: "Explorador de deportes y competiciones en el islam"
  lede: "El deporte y la competición en las fuentes del museo: equitación, natación y tiro con arco —el trío de los relatos de entrenamiento—, lucha y fuerza, carreras y competiciones con apuesta, el juego de lanzas de los abisinios, juegos de pelota y de tablero, la caza como deporte de campo y el deporte moderno — en el Corán, los dos Sahih, el Muwatta y los Sunan, los libros de sira, los relatos de los Compañeros y de los Tabi'un y cada libro recopilado: registros con sus fuentes que crecen a medida que llega cada nuevo texto."
  badge: Explorador de deportes
  status: "Esta compilación contiene {n} registros en {s} secciones; los textos son borradores hasta que los lea una persona."
  method_title: Cómo funciona este explorador
  method_note: "Every record here is an ordinary museum record with its sources. Sport mentions are found at build time by a guarded lexicon over the passage texts in eight families: horses and riding ⁦(خيل، فرس، فروسية)⁩, archery ⁦(رمي، نصل، سهم، قوس)⁩, swimming ⁦(سباحة، يسبح، عوم)⁩, wrestling and strength ⁦(مصارعة، صارع، إشالة)⁩, races and wagers ⁦(سباق، محلل، مزمل، سبق)⁩, play and games ⁦(حراب، كرة، صولجان، شطرنج، نرد)⁩, hunting as field sport ⁦(صيد، جوارح، باز، قنص)⁩ and sport named as sport ⁦(رياضة، أولمبي، بطولة)⁩. The ambiguous words are guarded: «سبق» counts only beside race vocabulary, «صيد» only beside hunt vocabulary, «رمي» only beside arrow vocabulary ⁦(رمي الجمرات excluded)⁩, «يسبح» only beside water vocabulary, «صرع» only beside wrestling vocabulary, and verified false positives are excluded by id. Every book harvested later brings its sport mentions here automatically; the named sports are first-class sport records; the athletes are read from the graph's own sports blocks."
