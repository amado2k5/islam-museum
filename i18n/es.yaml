asma:
  title: "Navegador de los Nombres más Bellos"
  lede: "Los noventa y nueve nombres de Dios, cada uno con su significado y las historias que lo llevan: los pasajes del Corán que lo nombran, los hadices que lo invocan, los acontecimientos de la sira que lo muestran, y los Compañeros y los justos cuyas vidas lo ejemplificaron."
