  title: "Navegador de Juha y del folclore islámico"
  full_title: "Navegador de Juha, del folclore islámico a través de los tiempos, la comedia, los chistes, las agudezas y las anécdotas"
  lede: "Todo lo que el museo guarda sobre Juha y el folclore islámico a través de los tiempos, la comedia, los chistes, las agudezas y las anécdotas: los versículos del Corán sobre la risa, la sonrisa y la prohibición de la burla; la broma y la risa del Profeta y los límites de la broma en la Sunna; la jovialidad de los Compañeros y los Sucesores en la sira y las biografías; las anécdotas de Juha una por una; y los relatos de ingeniosos, necios, avaros y gorrones en los libros de adab e historia."
  badge: "La tertulia de las anécdotas"
  status: "Esta versión contiene {n} registros en {s} secciones; los textos son borradores que el lector puede comprobar en las fuentes nombradas en cada registro."
  method_title: "El método del navegador"
  method_note: "Cada registro es un registro ordinario del museo, con sus fuentes y su texto en cinco idiomas. Los pasajes se detectan al generar el sitio con un detector con salvaguardas que lee el texto de los pasajes: el nombre de Juha como palabra entera, los ingeniosos nombrados como Ash'ab, Nu'ayman, Muzabbid y Habannaqa, las palabras de la anécdota y la agudeza, los verbos de la broma y la chanza, las palabras de la risa y la sonrisa, y los textos sobre la ética de la broma. Quedan fuera el «caso raro» de los juristas, el título al-Nawadir wa-l-Ziyadat, «un abrir y cerrar de ojos», los nombres al-Dahhak e Ibn Mughaffal y el adverbio de los gramáticos. Cada libro recopilado después trae automáticamente sus pasajes el día en que entran en el grafo, y los registros redactados se suman con la etiqueta juha-browser. Las anécdotas de Juha se cuentan con palabras del museo a partir de un escaneo leído por máquina, y las traducciones son traducciones automáticas que ningún humano ha leído."
