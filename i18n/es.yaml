qiraat:
  title: "Navegador de lecturas, ortografía, escrituras y puntuación del Corán"
  lede: "Todo lo que las fuentes del museo dicen sobre cómo se lee y cómo se escribe el Corán: las siete ahruf, las lecturas canónicas, sus imames y transmisores; la recopilación del Corán bajo Abu Bakr y la copia de los códices bajo 'Uthman; la ortografía (rasm) del mushaf y el debate sobre escribirlo con ortografía corriente (imla'i); sus puntos, vocales y otros signos; y las escrituras en que se ha escrito, del hiyazí y el cúfico al naskh, el thuluth y el magrebí. Cada aleya, relato y pasaje de libro está citado, y cada opinión se atribuye a quien la sostuvo."
  badge: Explorador de lecturas y rasm
  hero_kufi: "Lecturas · Rasm · Escrituras · Puntos"
  hero_naskh: "Cómo se lee el Corán y cómo se escribió: del primer pergamino al mushaf impreso"
  status: "Esta versión reúne {n} registros en {s} secciones; cada registro enumera sus fuentes, y los textos fueron escritos por agentes de IA a partir de esas fuentes y aún no han sido leídos por una persona."
  method_title: El método del navegador
  method_note: "Este navegador reúne lo que se dice y se escribe sobre cuatro asuntos conectados: cómo se lee el Corán, cómo se escribe en los códices, en qué escritura se escribió y cómo se punteó y se vocalizó. Las aleyas del Corán proceden de una tabla revisada: las aleyas sobre la lectura, la recitación pausada, la pluma y las páginas, y las aleyas en que se registra que los lectores o los códices de las ciudades difieren. El texto coránico aparece en el museo solo desde sus archivos congelados, de modo que una lectura variante se describe con palabras y nunca se escribe. Cualquier otro texto (hadiz, sira, relatos de los Compañeros y los Sucesores, y libros) se encuentra al compilar mediante un léxico protegido sobre cada pasaje, de modo que una mención en un libro cosechado más adelante aparece el día en que llega su pasaje. El navegador no emite veredicto: donde los sabios difieren, como sobre el significado de las siete ahruf o sobre escribir el mushaf con ortografía corriente, el registro da cada opinión con quien la sostuvo."
