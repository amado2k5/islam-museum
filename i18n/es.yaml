ukhuwwa:
  title: "Explorador de la hermandad en el islam"
  lede: "La hermandad en el islam en las fuentes del museo: la hermandad de los creyentes — «los creyentes no son sino hermanos», «el musulmán es hermano del musulmán» —, los hermanos y hermanas mismos, el emparejamiento que hizo el Profeta entre los Emigrados y los Auxiliares y cada emparejamiento entre los Compañeros y los Sucesores, el amor por Dios y el amarse unos a otros en Él, el altruismo y el acudir en ayuda y necesidad de un hermano, los derechos que un musulmán debe a un hermano — visitar al enfermo, bendecir al que estornuda, aceptar la invitación, devolver el saludo — y lo que rompe la hermandad: la envidia, el odio mutuo, el distanciamiento, la sospecha y la maledicencia — en el Corán, los dos Sahih, el Muwatta y los Sunan, los libros de sira, los informes de los Compañeros y los Sucesores, y cada libro recopilado — registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de la hermandad en el islam
  status: "Esta versión reúne {n} registros en {s} secciones; los textos son borradores hasta que una persona los lea."
  method_title: El método del explorador
  method_note: "Cada registro de aquí es un registro ordinario del museo — con sus fuentes y su prosa en tres idiomas. Las menciones de la hermandad se hallan en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes, en seis familias: los hermanos y hermanas ⁦(أخوة، إخوة، إخوان، أخوات، المؤمنون إخوة، المسلم أخو المسلم)⁩, el emparejamiento fraterno ⁦(آخى، يؤاخي، مؤاخاة، الإخاء, los Emigrados y los Auxiliares junto a una palabra de hermano)⁩, el amor por Dios ⁦(أحب في الله، الحب في الله، تحابوا، متحابين، يحب لأخيه)⁩, el altruismo y la ayuda ⁦(يؤثرون، إيثار، انصر أخاك، في حاجة أخيه، كالبنيان، كالجسد)⁩, los derechos del hermano ⁦(حق أخيه، حق المسلم على المسلم، عيادة المريض، تشميت العاطس، إجابة الدعوة، رد السلام)⁩ y las advertencias contra romper la hermandad ⁦(تحاسدوا، تباغضوا، هجران، ظن السوء، غيبة الأخ)⁩. Las palabras ambiguas están controladas: el simple «أخ» cuenta solo con posesivo o en una construcción definida, «عن أخيه» en un isnad puro no cuenta salvo que otra palabra de hermano figure en el pasaje, «عيادة/تشميت» cuentan solo junto al contexto de los derechos, «حسد/غيبة/هجر» solo junto a una palabra de hermano, y los falsos positivos verificados se excluyen por id; cada libro recopilado más adelante aporta aquí sus informes de hermandad de forma automática cuando sus pasajes llegan al grafo, y los registros curados se suman mediante la etiqueta ukhuwwa-browser. Los hermanos registrados se leen de las propias aristas sibling_of del grafo."
