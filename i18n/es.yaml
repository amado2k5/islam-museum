  title: "Explorador de ética y tratos"
  lede: "Cada mención de la ética y los tratos en las fuentes del museo: las virtudes del Corán, desde la veracidad, la honradez, la justicia y la excelencia hasta la bondad con los padres y los lazos de parentesco, y sus vicios, desde la mentira, la traición, el orgullo, la maledicencia y la injusticia; los hadices «Fui enviado para perfeccionar el noble carácter» y «Musulmán es aquel de cuya lengua y mano están a salvo los musulmanes»; y los tratos entre las personas, desde la compraventa, el riba, la deuda y la prenda hasta el matrimonio, el divorcio, los juramentos, el testimonio, el juicio y las balanzas — y cada relato de los Compañeros y de los Sucesores, lo que contienen los libros de sira y cada libro recopilado: registros con fuentes que crecen a medida que llegan nuevos textos."
  badge: Explorador de ética y tratos
  status: "Esta compilación contiene {n} registros en {s} secciones; los textos son borradores hasta que los lea una persona."
  method_title: Cómo funciona el explorador
  method_note: "Cada registro de aquí es un registro corriente del museo, con sus fuentes y su prosa en tres idiomas. La ética y los tratos se encuentran en el momento de la compilación mediante un léxico controlado sobre los textos de los pasajes: las palabras de virtud (veracidad, honradez, fidelidad, paciencia, gratitud, humildad, excelencia, recato, indulgencia, sinceridad, arrepentimiento, generosidad, bondad con los padres, parentesco, el derecho del vecino, buen consejo, evitar el daño, maestría, misericordia, justicia, contentamiento), las palabras de vicio (mentira, traición, orgullo, ostentación, envidia, avaricia, maledicencia, calumnia, indecencia, insultos, ira, injusticia, desobediencia a los padres, hipocresía, engaño) y las palabras de tratos (venta, comercio, riba, deuda, préstamo, prenda, alquiler, legado, herencia, matrimonio, dote, lactancia, divorcio, liberación, periodo de espera, manutención, custodia, juramentos, expiación, testimonio, prueba, juicio, balanzas, medida, medida escasa, reconciliación, regalos, garantía, fianza, representación, sociedad, qirad, mudaraba, muzara'a, musaqat, salam, istisna', transferencia, préstamo, depósito, usurpación, bien hallado, prelación, acaparamiento, coacción, interdicción, contrato); la bay'ah como juramento de lealtad, «raba» como crecimiento fuera de una transacción, «hukm» como sabiduría, «shahada» como testimonio de fe o martirio, «ajr» como mera recompensa, «qism» como porción, y los ritos de adoración que pertenecen a los exploradores hermanos de Ibadat y Du'a quedan fuera, los falsos positivos verificados se excluyen por identificador, y cada libro recopilado más adelante aporta aquí sus menciones automáticamente en cuanto sus pasajes llegan al grafo; los registros curados se incorporan mediante la etiqueta akhlaq-browser. Cada pasaje se marca con su vía (akhlaq/mu'amalat), su tipo (virtud/vicio/trato/mención) y sus temas."
