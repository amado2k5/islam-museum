hasanat:
  title: "حسنات براؤزر"
  lede: "میوزیم کے مآخذ میں حسنات کا ہر ذکر: قرآن کی وہ آیات جو انہیں لکھتی، ضرب دیتی اور برائیوں کو مٹاتی ہیں، نیتوں اور کاموں کی تحریر کی احادیث، اللہ کو قرض حسن، حسن سفارش اور «الحسنى» کااجر، اور سیرت، قصوں، صحابہ و تابعین کی روایات اور ہر حاصل شدہ کتاب میں ہر ذکر — ماخذ کے ساتھ وہ ریکارڈ جو نئے متون کے آنے پر بڑھتے ہیں۔"
  badge: نیکیوں کا مستكشف
  status: "اس بلڈ میں {n} ریکارڈ {s} سیکشنز میں ہیں؛ انسان کی جانچ تک متن مسودے ہیں۔"
  method_title: براؤزر کا طریقہ
  method_note: "یہاں ہر ریکارڈ ایک عام میوزیم ریکارڈ ہے — اپنے مآخذ اور تین زبانوں کے نثر کے ساتھ۔ ذکر بلڈ کے وقت متون پر ایک محفوظ لغت سے ملتے ہیں — «الحسنات»، «حسنات»، «الحسنة»، «حسنة»، حالات کے ساتھ «الحسنى» (اللہ کے حسنا نام باہر رہتے ہیں)، اور مستقل مرکبات «قرضا حسنا» اور «بدل حسنا بعد سوء»؛ تنہا «حسن»/«الحسن» (علم نام اور حدیث کی درجہ)، حالت یا صفت کا «حسنا»، اور مؤنث اسم پر صفت «حسنة» باہر رہتے ہیں، تصدیق شدہ جھوٹی مثبتیں شناختی سے خارج ہیں، اور بعد میں کاٹی جانے والی ہر کتاب اپنی ذكریں یہاں خود بخود لاتی ہے جب اس کے متون گراف میں اترتے ہیں؛ منتخب ریکارڈ hasanat-browser ٹیگ سے شامل ہوتے ہیں۔ ہر متن کو اس کے غالب لفظی خاندان کے مطابق «حسنات»، «حسنة» یا «حسنى» نشان زد کیا جاتا ہے۔"
