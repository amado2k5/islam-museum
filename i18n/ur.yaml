    caption: "ہر خانے کی چوڑائی سورت کی آیات کی تعداد کے مطابق ہے، ایک کم سے کم چوڑائی کے ساتھ تاکہ چھوٹی ترین سورتیں بھی آسانی سے منتخب ہو سکیں۔ شامل ہونے کا مطلب ہے کہ کسی جلد میں اس آیت کا خلاصہ درج ہے؛ یہ تفسیر کے معیار یا مکمل ہونے کے بارے میں کچھ نہیں کہتا۔ خانے پر ماؤس لائیں، فوکس کریں یا اسے چھوئیں؛ ٹچ اسکرین پر کھولنے کے لیے دو بار چھوئیں۔ مکی اور مدنی درجہ بندی Tanzil کے ذریعے منقول قاہرہ ایڈیشن (1924) کی پیروی کرتی ہے؛ یہ ایک معروف ترتیب ہے، متفقہ نہیں۔"
