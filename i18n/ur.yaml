  graph_title: 'گراف فلم: گراف کیسے کام کرتا ہے'
  graph_1: '"گراف کیسے کام کرتا ہے" ایک مختصر فلم ہے، تقریباً دو منٹ کی، جو 6 نومبر 2026 کو اس لیے بنائی گئی کہ عجائب گھر کے علمی گراف کو ایسے ناظر کو سمجھائے جو نہ عجائب گھر کو جانتا ہو اور نہ علمی گراف کو۔'
  graph_2: 'یہ فلم عجائب گھر کے خام ماخذوں کے پیچھے چلتی ہے — archive.org سے OCR کے ذریعے پڑھی گئی پرانی کتابیں، ویب سائٹس، آڈیو ٹیپیں اور ویڈیوز — جب وہ پڑھے جاتے ہیں، اپنے حوالوں کے مقابل جانچے جاتے ہیں، اندراجوں اور روابط کے گراف میں ڈھلتے ہیں، اور پھر سائٹ کی ایپس بن جاتے ہیں: ٹائم لائن، نقشہ اور ایکسپلورر۔ اور یہ وہیں ختم ہوتی ہے جہاں خود عجائب گھر ختم ہوتا ہے: گراف CC0 کے تحت شائع ہے، اس لیے کوئی بھی اسے لے کر اس پر اپنی ایپس بنا سکتا ہے۔'
  graph_3: 'یہ فلم چار AI ویڈیو پلیٹ فارموں پر بنی، ہر ایک کو اس کام میں لگا کر جس میں وہ بہترین ہے — Google Flow مع Veo، Kling، Runway اور Artlist — اور اس کی آواز عربی ⁦(مصری عربی)⁩ اور انگریزی میں ان معمر تاریخ داں راویوں کی آوازوں میں ہے جو ElevenLabs سے بنائی گئیں، اور نیچے بانی کا عود بجتا ہے۔ پوری تیاری پر ایک ہی دستکاری اصول حکمران رہا: ہر حقیقت اور ہر عدد آوازِ بیان میں رہتا ہے، کیونکہ AI ویڈیو آج بھی سکرین پر لکھے متن اور اعداد کو بگاڑ دیتی ہے — سکرین پر نظر آنے والے اکلوتے الفاظ اختتامی کارڈ پر عجائب گھر کا نام ہیں۔'
  music_title: 'موسیقی: عجائب گھر کی آوازیں'
  music_1: '"عجائب گھر کی آوازیں" چھ ٹریکوں کا ایک مجموعہ ہے، جو Google Flow میں Lyria کے ساتھ مصنوعی ذہانت سے ترتیب دیا اور تیار کیا گیا، اور اس کا موسیقی حوالہ بانی کی اپنی عود نوازی ہے۔ حتمی ٹریک مکمل طور پر AI سے تیار شدہ ہیں: عود نے موسیقی کی رہنمائی کی مگر حتمی مکس میں خود سنائی نہیں دیتا، اور جہاں بھی کوئی پلیٹ فارم پوچھتا ہے، وہاں اس مجموعے کو مکمل طور پر AI سے تیار شدہ قرار دیا جاتا ہے۔'
  music_tracks: '1. Fourteen Centuries · 2. The Ancient Library · 3. The First Light · 4. Threshold of the Unknown · 5. The Unbroken Seals · 6. Leaving the Museum'
  music_2: 'یہ مجموعہ ہر جگہ مفت ہے، اور یہ اسی طرح بنایا بھی گیا تھا — اسے کبھی پیسہ کمانے کے لیے نہیں بنایا گیا۔ یہ اب SoundCloud اور Audiomack پر موجود ہے، اور RouteNote کے ذریعے عالمی اشاعت 24 نومبر 2026 کو 39 اسٹوروں تک پہنچے گی۔ ایک ایماندارانہ استثنا: Bandcamp کی پالیسی مکمل طور پر AI سے تیار شدہ موسیقی کی اجازت نہیں دیتی، اس لیے البم وہاں موجود نہیں۔'
