  lede: "میوزیم کے مآخذ میں بعث، روزِ قیامت اور حساب کا ہر ذکر: قرآن میں دن کے نام — الحاقہ، القارعہ، الصاخہ، الغاشیہ، یوم الدین، یوم الفصل — صور میں پھونک اور دو پھونکیں، قبروں سے اٹھنا اور حشر، اہوال، پسینہ اور سورج کا قریب آنا، عرض و صحائف، بندے کا پہلا حساب، میزان اور تول، مخلوق کے درمیان قصاص، سایہ، حوض، شفاعت اور پل صراط — ہر آیت اور روایت اپنے ماخذ کے ساتھ، ہر کٹائی شدہ کتاب میں، نئے متن آنے پر بڑھتا ہوا۔"
  badge: بعث اور قیامت تلاش کنندہ
