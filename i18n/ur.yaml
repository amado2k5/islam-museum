learn:
  title: رہنمائی / سیکھیں
  badge: تیاری میں
  lede: عجائب گھر بڑا ہے اور آپ شاید نہ جانتے ہوں کہ کہاں سے شروع کریں۔ رہنمائی مختصر، ترتیب وار راستے پیش کرتی ہے، ہر ایک واضح مقصد کے ساتھ، جو آپ کو عجائب گھر کے اپنے صفحات میں قدم بہ قدم لے جاتے ہیں، یا پورا راستہ ایک ساتھ دکھاتے ہیں۔
  status: یہ حصہ بن رہا ہے۔ ہم نے پانچ آزمائشی راستے کھولے ہیں تاکہ آپ خیال دیکھ سکیں، اور ہم 300 بہترین راستوں کی فہرست تیار کر رہے ہیں جن پر کوئی بھی چل سکے، ہر ایک کو اس کے اندراجات تیار ہونے پر کھولتے ہوئے۔ باقی عجائب گھر ویسا ہی رہتا ہے۔
  available_title: وہ راستے جو آپ ابھی آزما سکتے ہیں
  available_note: عجائب گھر کے موجودہ صفحات پر بنے پانچ آزمائشی راستے۔ ان کی حتمی شکل، قدم بہ قدم اور پورے راستے کے منظر کے ساتھ، منصوبے کے بعد کے مرحلے میں آئے گی۔
  minutes: منٹ
  steps: مراحل
  kind_tour: سیر
  kind_lesson: سبق
  kind_trail: راستہ
  offer_title: آپ یہاں کیا پائیں گے
  offer:
  - "طے کریں کہ آپ کیا سمجھنا چاہتے ہیں: تاریخ کا کوئی دور، شخصیات کا گروہ، واقعات کا گروہ، کوئی خیال، کوئی مقام، کوئی متن یا کوئی مشکل سوال۔"
  - "اسے قدم بہ قدم چلیں، یا پورا راستہ ایک فہرست، زمانی خاکے اور نقشے کی صورت میں ایک ساتھ دیکھیں۔"
  - "ہر راستہ اپنا مقصد بتاتا ہے: آخر میں آپ کیا جان لیں گے اور کہاں رکھ سکیں گے۔"
  - "ہر ایک کے لیے ایماندارانہ وقت: دس منٹ، آدھا گھنٹہ، دو گھنٹے یا شام کی ایک ہفتے کی نشستیں۔"
  - "آپ کی پیش رفت صرف آپ کے براؤزر میں محفوظ رہتی ہے، بغیر اکاؤنٹ اور بغیر AI جواب دینے والے کے: راستے لکھے اور جانچے جاتے ہیں۔"
  - "ہر قدم عجائب گھر کا ماخذ والا صفحہ ہے، گہرائی میں جانے یا دوسرا نقطۂ نظر سننے کے لیے ضمنی قدم کے ساتھ جو راستے کو روکتے نہیں۔"
  kinds_title: تیاری میں تین سو راستے
  kinds_note: منصوبہ بندی کے دوران AI راستوں کی فہرست تجویز کرتا ہے، پھر لوگ اسے جانچ کر ترتیب دیتے ہیں۔ آپ کے دورے کے دوران اس میں سے کچھ نہیں چلتا۔
