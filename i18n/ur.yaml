  lede: "میوزیم کے مآخذ میں آگ کا ہر ذکر: آگ کی آیات اور اس کے نام — جہنم، سقر، الجحیم، الحطمة، لظیٰ، الحامیۃ اور السعیر — اس کے عذاب، خازن، ایندھن، زقوم اور کھولتے پانی کی روایات اور اس پر پل صراط، سنت میں «اتقوا النار» کی صیغے، صحابہ اور تابعین کے اقوال، اور دنیا کی آگ اپنے رف میں: ابراہیم کی آگ، موسیٰ کے درخت کی آگ، اور جنگ و کھانے کی آگ — ہر حاصل شدہ کتاب میں، نئے متن آنے پر بڑھتا ہوا۔"
