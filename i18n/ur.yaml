hisab:
  title: "حسنات و سیئات کی فہرست، کیلکولیٹر اور گنتی"
  lede: "عجائب گھر کے مآخذ اعمال کے حساب کے بارے میں کیا کہتے ہیں: وہ آیات، احادیث اور سیرت، صحابہ اور تابعین کی روایات جو نیکی اور برائی کو گنتی ہیں، لکھتی ہیں، بڑھاتی ہیں، مٹاتی ہیں اور قیراط، درجے اور میزان سے تولتی ہیں۔ ہر ایسی نص کی فہرست، ایک کیلکولیٹر جو وہ اعداد پڑھتا ہے جو نصوص نے خاص اعمال کے لیے بتائے، اور ذکر کی گنتی جو آپ کے براؤزر میں رہتی ہے۔"
  badge: نصوص میں اعمال کا حساب
  status: "اس نسخے میں {s} حصوں میں {n} ریکارڈ ہیں، جن میں سے {r} کیلکولیٹر کی سطریں ہیں؛ متون اس وقت تک مسودہ ہیں جب تک کوئی انسان انہیں نہ پڑھ لے۔"
  parts_title: صفحے کے حصے
  read_more: مضمون پڑھیں
  caveat_title: حساب سے پہلے
  caveat: "یہ صفحہ نصوص کا بیان ہے اور کسی کے انجام کا حساب نہیں لگاتا۔ اس کا ہر عدد اس نص سے پڑھا گیا ہے جو اس کے ساتھ درج ہے، اور خود نصوص عدد کو نیت، قبولیت، کبائر سے اجتناب اور حقوق کی ادائیگی سے مشروط کرتی ہیں اور بتاتی ہیں کہ عدد سے اوپر کا فضل کسی گنتی میں نہیں آتا۔ عجائب گھر فتویٰ نہیں دیتا: جہاں روایات مختلف ہیں وہ جیسی آئی ہیں ویسی دکھائی گئی ہیں، اور جہاں نص نے عدد نہیں بتایا وہاں نتیجہ اسی کے الفاظ میں لکھا گیا ہے، عدد میں نہیں بدلا گیا۔"
  method_title: صفحے کا طریقہ
  method_note: "یہاں کا ہر ریکارڈ عجائب گھر کا عام ریکارڈ ہے جس کے مآخذ درج ہیں۔ فہرست کی نصوص تعمیر کے وقت متون پر ایک محتاط لغت سے تلاش کی جاتی ہیں: نیکیوں یا برائیوں کی تعداد، دس گنا اور سات سو گنا، عمل کا لکھا جانا، برائیوں کا مٹنا اور کفارہ، پچھلے گناہوں کی مغفرت، درجات اور قیراط، وہ عمل جو بڑے عمل کے برابر ہے، میزان اور ذرہ برابر وزن، کراماً کاتبین اور نامۂ اعمال، مفلس اور بوجھ، اور حساب۔ شمار کے بغیر نیکیوں یا برائیوں کا محض ذکر حسنات براؤزر اور سیئات براؤزر میں رہتا ہے۔ تصدیق شدہ غلط نتائج شناخت کے ذریعے خارج کیے جاتے ہیں، اور بعد میں شامل ہونے والی ہر کتاب اپنی نصوص خود بخود یہاں لے آتی ہے۔ کیلکولیٹر کی سطریں منتخب ریکارڈ ہیں جن میں reckoning کا خانہ عدد کو ایک نامزد نص سے پڑھتا ہے۔"
  api: "پورا مجموعہ یہاں دستیاب ہے"
  calc_title: کیلکولیٹر
  calc_intro: "ہر سطر ایک عمل ہے جس کے لیے کسی نص نے عدد یا نتیجہ بتایا ہے۔ لکھیں کتنی بار؛ کیلکولیٹر آپ کی تعداد کو منصوص عدد سے ضرب دے کر جمع کرتا ہے۔ جن سطروں کی نص عدد نہیں بتاتی ان کا نتیجہ مجموعے کے نیچے الفاظ میں آتا ہے۔"
  calc_nojs: "جدول پڑھنے کے لیے مکمل ہے؛ خودکار جمع کے لیے جاوا اسکرپٹ درکار ہے۔"
