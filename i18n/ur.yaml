asma:
  title: "اسمائے حسنیٰ براؤزر"
  lede: "اللہ کے نامیران نام، ہر نام کے ساتھ اس کا مطلب اور وہ قصے جو اسے بیان کرتے ہیں: قرآن کی آیات جن میں وہ آیا، احادیث جن میں ذکر ہوا، سیرت کے واقعات جن میں ظاہر ہوا، اور صحابہ و صالحین کی زندگیاں جنھوں نے اسے پایا."
