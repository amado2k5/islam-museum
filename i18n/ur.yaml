  famous_lede: "سائنسدان، شعرا، کھلاڑی اور سیاست دان — امت اپنے ناموں میں۔"
  trivia_title: "کیا آپ جانتے ہیں؟"
  t_another: "ایک اور معلومات"
  sources_title: ہمارے بھروسے کے ماخذ
  sources_body: ہر ماخذ عوامی فہرست میں اپنے درجے اور حیثیت کے ساتھ درج ہے۔ ویکیپیڈیا اور ویکی ڈیٹا صرف حوالہ ہیں، اصلیت کا ثبوت نہیں۔
  corrections_title: اصلاحات
  corrections_body: کسی مسئلے کی اطلاع issue فارم کے ذریعے دیں۔ ہر اطلاع اور اس کا نتیجہ درج کیا جاتا ہے۔
  records_title: ہم ہر کتاب کے لیے کیا محفوظ رکھتے ہیں
  records_body: 'ہر حاصل شدہ کتاب کے لیے ہم ایک ریکارڈ رکھتے ہیں: اس کا عنوان، مصنف اور اس کی تاریخیں، وہ دور جس سے وہ تعلق رکھتی ہے، فیصلہ اور اسے کس نے کیا، کی
    گئی جانچیں اور ان کے نتائج، اور ہر حاصل شدہ فائل کا SHA-256 فنگر پرنٹ، تاکہ بعد میں دکھایا جا سکے کہ کوئی نسخہ بدلا نہیں۔ ریکارڈ میں کتاب کا متن نہیں ہوتا۔ یہ
    ریکارڈ repository میں شائع ہیں۔'
  rules_title: قواعد کہاں ہیں
  rules_body: 'قواعد عوامی repository میں ہیں: پالیسی، فہرست، validator اور harvest gate۔ کوئی بھی انہیں پڑھ اور جانچ سکتا ہے۔'
privacy:
  title: رازداری اور ڈیٹا
  lede: کوئی اکاؤنٹ نہیں، کوئی کوکی نہیں، کوئی ٹریکنگ نہیں، کوئی اشتہار نہیں۔ یہ صفحہ بتاتا ہے کہ جب آپ میوزیم دیکھتے ہیں تو کیا ہوتا ہے۔
  updated: 'آخری تازہ کاری: 17 اکتوبر 2026'
  summary_title: خلاصہ
  summary_1: میوزیم ثابت فائلیں ہیں، جو کتاب کا صفحہ پڑھنے کی طرح پڑھی جاتی ہیں۔ آپ کے دیکھنے کے دوران کوئی سرور نہیں چلتا، نہ کوئی ڈیٹا بیس۔
  summary_2: ہم آپ سے نہ اکاؤنٹ مانگتے ہیں، نہ ای میل، نہ نام۔ ہم کوئی کوکی نہیں رکھتے، کوئی تیسرے فریق کا ٹریکر لوڈ نہیں کرتے۔
  collect_title: جو ہم جمع نہیں کرتے
  collect_body: 'میوزیم اپنے زائرین کے بارے میں کوئی ذاتی ڈیٹا پراسیس نہیں کرتا: نہ نام، نہ ای میل پتے، نہ محفوظ کیے گئے IP پتے۔'
  device_title: جو آپ کے اپنے آلے پر محفوظ رہتا ہے
  device_body: کچھ ترجیحات آپ کے براؤزر کے اپنے اسٹوریج (localStorage اور sessionStorage) میں رکھی جاتی ہیں اور کسی سرور کو نہیں بھیجی جاتیں۔
  traffic_title: دورے گننا
  traffic_body: دوروں کی گنتی Cloudflare کی نیٹ ورک اینالیٹکس میں ہوتی ہے، وہ نیٹ ورک جو صفحات پہنچاتا ہے۔
  hosts_title: فائلیں کون پہنچاتا ہے
  hosts_body: صفحات Cloudflare کے نیٹ ورک سے پہنچتی ہیں؛ صفحات، تصاویر، نقشے، تلاش کا اشاریہ اور کھلے ڈیٹا کی فائلیں عجائب گھر کے اپنے ذخیرے سے فراہم ہوتی ہیں۔ شریک عجائب گھروں (وکٹوریا
    اینڈ البرٹ میوزیم، میٹروپولیٹن میوزیم آف آرٹ، کلیولینڈ میوزیم آف آرٹ، وکیمیڈیا کامنز) کی اشیاء کی تصاویر انہی اداروں کے سرورز سے لوڈ ہوتی ہیں۔ انٹرنیٹ کی ہر سروس
    کی طرح یہ فراہم کنندگان بھی فائل پہنچانے کے لیے آپ کے آلے کا IP پتہ استعمال کرتے ہیں اور اسے اپنی پالیسیوں کے مطابق پروسیس کرتے ہیں۔ عجائب گھر کو یہ ڈیٹا نہ ملتا
    ہے اور نہ وہ اسے رکھتا ہے۔
  contact_title: جب آپ ہم سے رابطہ کریں
  contact_body: اگر آپ ہمیں ای میل کریں یا GitHub پر رپورٹ یا بحث کھولیں تو ہم وہی دیکھتے ہیں جو آپ بھیجنے کا انتخاب کریں۔
  people_title: وہ لوگ جن کا میوزیم ذکر کرتا ہے
  people_body: میوزیم تاریخ اور حال کے لوگوں کو شائع شدہ عوامی واقعات سے بیان کرتا ہے، جو اپنے ماخذوں سے منسوب ہوں۔
  kids_title: بچے
  kids_body: 'وہی اصول بچوں کے پہلو پر بھی لاگو ہیں: کوئی اکاؤنٹ نہیں، کوئی ڈیٹا جمع نہیں، کسی تیسرے فریق سے رابطہ نہیں۔'
  links_title: دوسری سائٹوں کے لنک
  links_body: میوزیم بیرونی ماخذوں اور حوالوں کی طرف اشارہ کرتا ہے۔ جب آپ ان کی طرف جائیں تو ان سائٹوں کی پالیسیاں لاگو ہوتی ہیں، ہماری نہیں۔
  law_title: لاگو قانون
  law_body: میوزیم کینیڈا کے صوبے اونٹاریو سے چلایا جاتا ہے اور کینیڈا کے وفاقی قانون اور اونٹاریو کے قانون کے تابع ہے۔
  changes_title: اس صفحے میں تبدیلیاں
  changes_body: اگر سائٹ کے کام کرنے کے طریقے میں کوئی تبدیلی ہو تو یہ صفحہ پہلے اپ ڈیٹ ہوگا، اور تبدیلی تاریخ میں درج ہوگی۔
  more_title: مزید پڑھیں
  more_body: تکنیکی تفصیل فنِ تعمیر کی دستاویز اور معماری فیصلے 0002 میں ہے (کوئی AI نہیں، رن ٹائم پر کوئی کمپیوٹنگ نہیں)۔
