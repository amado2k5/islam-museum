  strip_cta: "مستقبل میں قدم رکھیں"
  eyebrow: "١٤٤٨ھ ← ١٥٠٠ھ"
  title: "2077 میں مسلمانوں کی زندگی"
  lede: "نبوت نہیں — غیب کا علم صرف اللہ کے پاس ہے۔ یہ صفحہ عجائب گھر کی تخیل کی مشق ہے: ہر ذریعہ جو مسلمانوں کے سامنے آیا — کاغذ، چھاپہ خانہ، ریڈیو، اسکرین — دین نے اسے جذب کر لیا بغیر اپنا مرکز ہلائے۔ پھر کیا ہوگا جب ذریعہ خود جواب دینے لگے؟"
  note: "آگے جو کچھ ہے وہ ثبوتوں پر مبنی تخیل ہے — حقیقی روبوٹ، حقیقی فتوے، حقیقی تحقیق — پیشن گوئی نہیں۔ ہر اسٹیشن آپ کو عجائب گھر کے اندر واپس لاتا ہے۔"
