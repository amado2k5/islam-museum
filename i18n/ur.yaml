  guide_title: "ٹائم لائن ایکسپلورر کیا پیش کرتا ہے"
  guide_lede: "ٹائم لائن ایکسپلورر آپ کو ایک موضوع (کوئی شخصیت، دور یا شہر) چننے اور اس کی کہانی قدم بہ قدم دیکھنے دیتا ہے۔ ہر پڑاؤ میوزیم کا ایک ریکارڈ ہے، جس کے ساتھ اس کی ہجری اور عیسوی تاریخ، مختصر متن اور ماخذ ہیں۔"
  guide_features_title: آپ کیا کر سکتے ہیں
  guide_feature_list: "شیلف سے کوئی موضوع چنیں، یا نام سے تلاش کریں۔|رہنمائی والا سفر شروع کریں: وقت کی ترتیب سے پڑاؤ، چلتے ہوئے «پڑاؤ ۳ از ۹» دکھائی دیتا ہے۔|تیروں سے، کسی پڑاؤ کو چن کر، یا تیر والی کیز سے ٹائم لائن پر چلیں۔|پوری تفصیل کھولیں، جہاں ہو وہاں مقام نقشے پر دیکھیں، یا سیاق اور تعلقات کے ذریعے میوزیم میں آگے جائیں۔|کہانی کے ساتھ متعلقہ شخصیات، مقامات اور ماخذ پڑھیں؛ آگے بڑھنے پر ماخذ بدلتے ہیں۔|جہاں پڑاؤ کا بچوں کا متن ہو، وہاں «بچوں کے لیے» چالو کریں۔"
  guide_usage_title: استعمال کا طریقہ
  guide_usage_list: "ہر پڑاؤ کا اپنا پتہ ہے، اس لیے آپ اسے شیئر کر سکتے ہیں یا اس پر واپس آ سکتے ہیں۔|تقریبی یا متنازع تاریخیں ویسے ہی دکھائی جاتی ہیں جیسے ماخذ دیتے ہیں۔|میوزیم کے کسی اندراج سے جس کی کہانی ہو، «ٹائم لائن دیکھیں» دبائیں اور وہ کھل جائے گی۔"
  guide_limits_title: یہ کیا نہیں کرتا
  guide_limits_list: "پڑھتے وقت یہ مصنوعی ذہانت استعمال نہیں کرتا۔ صفحے پر سب کچھ پہلے سے تیار کیا گیا ہے۔|یہ ویب نہیں کھنگالتا۔ غیر تیار موضوعات پر لکھا آتا ہے: ٹائم لائن ایکسپلورر میں ابھی شامل نہیں۔|اس میں لاگ اِن نہیں، اور یہ آپ کا کوئی ریکارڈ نہیں رکھتا۔|بچوں کا متن صرف وہیں دکھایا جاتا ہے جہاں وہ لکھا اور جانچا گیا ہو۔"
