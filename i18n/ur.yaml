    - k: "حج"
      t: "ہجوم کے بہاؤ کے زمانے میں حج"
      d: "مکہ آج ہی پانی بانٹنے، سنگِ مرمر صاف کرنے اور حجاج کے سوالوں کے جواب دینے کے لیے روبوٹ رکھتا ہے۔ 2077 تک ہجوم کی ذہانت تاریخ کے رنجروں کو ناقابلِ تصور بنا سکتی ہے، ترجمانی کے ائربڈز رہنما کی اشاروں کی زبان کو ریٹائر کر سکتے ہیں، اور وہ کسان جو کبھی سفر کی استطاعت نہ رکھے عبادات کی ایک امین نقل میں چل سکتا ہے۔ پھر وہ مشکل سوال جو علماء آج ہی پوچھتے ہیں: کیا حاضری ہی اصل مقصود ہے؟"
      scene: hajj
      a:
        - id: "place/mecca"
          l: "مکہ"
        - id: "concept/hajj-rulings"
          l: "احکامِ حج"
    - k: "مرجعیت"
      t: "مفتی اور مشین"
      d: "جب ہر مسلمان ایک ہی ماڈل سے پوچھ سکتا ہے تو دو مستقبل شاخیں بنتے ہیں: ایک جہاں اجتہاد بڑھتا ہے — کھلے اوزار جو ہر عالم کو چودہ صدیوں کے منہج کے سامنے حکم آزمانے دیتے ہیں — اور ایک جہاں ایک خاموش الگورتھم زمین کی واحد مرجعیت بن جاتا ہے۔ چھاپے نے حافظ کی اجارہ داری ختم کی؛ ڈیٹابیس نے موسوعی عالم کی۔ مشین کیا ختم کرے یا کیا آزاد، ابھی طے ہو رہا ہے۔"
      a:
        - id: "concept/ijtihad"
          l: "اجتہاد"
        - id: "concept/al-fatwa-ala-al-fadaiyyat"
          l: "فتویٰ"
    - k: "زمین سے باہر"
      t: "زمین سے باہر کا فقہ"
      d: "ایک بار پہلے ہی ہو چکا: 2007 میں ایک مجلسِ افتا نے اٹھارہ صفحات لکھے تاکہ ایک مسلمان خلاباز اس سٹیشن پر نماز پڑھ سکے جو دن میں سولہ بار طلوعِ آفتاب دیکھتا ہے — قبلہ کعبہ، یا اس کا عکس، یا زمین، یا کوئی بھی سمت؛ روانگی کے بندرگاہ کے وقت پر پانچ نمازیں؛ اگر اعضاء تیر جائیں تو نیت سے حرکت۔ 2077 میں مسلمان مریخ پر، قطبی دن کی مستقل روشنی میں، گھومنے والی رہائش گاہوں میں رہ سکتے ہیں۔ سوالات نئے لگتے ہیں؛ مگر طریقہ — تولنا، ڈھالنا، فریضہ قائم رکھنا — اس عجائب گھر کی قدیم ترین چیزوں میں ہے۔"
      scene: space
      a:
        - id: "concept/awqat-al-salat"
          l: "اوقاتِ نماز"
    - k: "جال"
      t: "امت بطور جال"
      d: "صدی کے وسط تک تقریباً ہر تیسرا شخص مسلمان ہوگا — زمین کی سب سے بڑی اور سب سے جوان مذہبی برادری — اربوں خدمت گار مشینوں کے ساتھ شہروں کو بانٹتے ہوئے۔ جب ساتھی مصنوعی ہو تو بھائی چارے کا کیا مطلب؟ اوقاف قابلِ پروگرام وقف بن سکتے ہیں جو کسی شرط پر خود کو جاری کریں؛ زکوٰۃ ایسے مال میں چل سکتی ہے جو خود اپنی گنتی کرے۔ امت ہمیشہ سے جال تھی — خطوط کا، قافلوں کا، اسانید کا۔ کیبلز اس کا بس نیا گوشت ہیں۔"
      scene: city
      a:
        - id: "concept/waqf"
          l: "وقف"
    - k: "عجائب گھر"
      t: "اور یہ عجائب گھر"
      d: "ایمانداری آخری اسٹیشن یہی بناتی ہے: اسلام کا ایک عجائب گھر جو پہلے ہی زیادہ تر مشینوں سے لکھوایا جاتا ہے، قواعد سے پرکھا جاتا ہے، ساکن صفحات میں جمایا جاتا ہے — مشین کی رفتار اور انسانی امانت کے درمیان اپنا سمجھوتہ۔ 2077 میں وہ ایک ایسی جگہ ہو سکتی ہے جس میں آپ چلیں، ایک گراف جس میں آپ رہیں، ایک رفیق جو جانتا ہو اس کے کون سے ذخائر آپ کو متاثر کریں گے۔ جو بھی شکل ہو، اس کا سوال وہی ہوگا جو اس صفحے کا ہے۔"
  tensions:
    - q: "کیا مشین امامت کر سکتی ہے؟"
      d: "راہنما روبوٹ آج مکہ میں حجاج کے سوالوں کے جواب دیتے ہیں۔ کیا مشین امام کھڑی ہو سکتی ہے — یا آواز کا تعلق کسی ایسے شخص سے ہونا چاہیے جو خود جوابدہ ہو — یہ زندہ مباحثہ ہے، طے شدہ فیصلہ نہیں۔"
    - q: "کیا مجازی حج شمار ہوتا ہے؟"
      d: "نقل لاکھوں لوگوں کو مناسک سکھا سکتی ہے جو کبھی سفر نہیں کر سکیں گے۔ علماء سیکھنے اور ادائیگی میں فرق کرتے ہیں — مگر حاجی کے جسم اور ہیڈسیٹ کے درمیان دوری حاضری کا ایسا سوال اٹھاتی ہے جس کا ہر زمانے نے مختلف جواب دیا۔"
    - q: "ہر فتوے کے لیے ایک ہی AI؟"
      d: "اگر ایک ارب مسلمان وہی ماڈل پوچھیں تو مرجعیت اس طرح مرکوز ہوتی ہے جو امت نے کبھی نہ دیکھی — خلفاء کے زمانے میں بھی نہیں۔ کچھ کو فقہی تنوع کا خاتمہ نظر آتا ہے؛ کچھ کو اجتہاد کی جمہوریت۔ دونوں اسی تاریخ سے دلیل لاتے ہیں۔"
  voices:
    - l: "مسجد الحرام میں AI راہنما روبوٹ — دی نیشنل، 2021"
      u: "https://www.thenationalnews.com/gulf-news/saudi-arabia/2021/11/15/makkahs-grand-mosque-launches-new-ai-robot-guides-that-speak-11-languages/"
