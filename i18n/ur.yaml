disclaimer:
  title: Disclaimer
  lede: 'What this museum is, how its content is gathered and checked, what you may and may not take from it, and the terms on which it is offered — in plain language.'
  updated: 'Last updated: 30 October 2026'
  personal_title: A personal project
  personal_1: 'islam.museum is a personal project, created and maintained by an individual in a personal capacity, with personal resources, outside any employment. It is not operated by, affiliated with, or endorsed by any employer, company, institution, government or religious authority; the institutions and people named on the site are named as subjects or sources, not as sponsors. The project intends to incorporate as a non-profit organisation in Ontario, Canada; until that happens it remains a personal project, and this page will be updated when it does.'
  personal_2: 'All opinions and views expressed on this site are solely my own and do not reflect the views or opinions of my employer.'
  purpose_title: Educational purpose
  purpose_body: 'The museum is offered for education, culture and general interest: it presents the history and heritage of Islam from published sources, in Arabic, English and Urdu. It is not a school, university or accredited course, and it awards no certificates or qualifications.'
  accuracy_title: Accuracy, and its limits
  accuracy_1: 'Every entry in the museum is tied to the sources cited on its page, the coverage page shows openly where the record is thin, and errors are corrected when they are found or reported. We work to check facts before publication and to say, on the page, where a claim rests on a single source or is debated.'
  accuracy_2: 'Even so, no guarantee is given that every statement on the site is complete, current or free of error. History contains genuinely contested matters — dates, attributions and narratives differ between sources and traditions — and Hijri–Gregorian date conversions follow standard methods and are approximate for early periods. Treat every page as a sourced starting point, not as the last word.'
  verify_title: Verify before you rely on it
  verify_body: 'Do not rely on the museum''s content as the sole basis for an examination or coursework answer, for a job, academic or media interview, for publication, or for any personal, professional, financial, legal or religious decision. Before relying on anything here, verify it against the sources cited on the page and other authoritative references, and consult qualified teachers, scholars or professionals where the matter calls for them.'
  advice_title: Not rulings, and not professional advice
  advice_body: 'Nothing on this site is a fatwa or a religious ruling, and nothing here is legal, financial, medical or other professional advice. Religious texts and practices are presented from their published sources, following the museum''s editorial method (see "How we decide what to show"); questions of belief and practice should be taken to qualified scholars, and questions in professional fields to qualified practitioners.'
  gathering_title: How the content is gathered
  gathering_1: 'The museum''s content is collected and built from published, publicly available sources: encyclopedias (including Wikipedia), Wikidata, the catalogues and open collections of libraries and museums, and published books and scholarship, each recorded in the museum''s source records and cited on the page it supports.'
  gathering_2: 'Artificial-intelligence tools assist in gathering, drafting, structuring and cross-checking material at build time; no AI runs when you visit the site. AI-assisted drafting can introduce errors, and automated collection can misread a source — one more reason the sources are shown on every page and why corrections are welcomed. Selection, emphasis and arrangement are editorial choices, and coverage is uneven by design and by honesty: the museum shows its gaps rather than filling them with invention.'
  children_title: Children and young visitors
  children_1: 'The museum is for all ages, and the children''s wing (Kids'' Wing) is made for children: stories, games and quests, with no accounts, no data collection, no chat and no contact with strangers, as the privacy page explains. Children should explore the museum with a parent, guardian or teacher, who remains responsible for supervising their use and judging what is suitable for them.'
  children_2: 'For parents and teachers: the museum, including the children''s wing, is an aid to learning, not a curriculum and not a substitute for a child''s school materials. Material found here should be checked against the cited sources — with an adult — before it is used in homework or schoolwork, and children should not treat any page as an examination-ready answer without that check.'
  features_title: Interactive features and tools
  features_body: 'The timelines, the date converter, the connections graph, the search, the journeys, the 3D tour and the other interactive features are aids to exploration. Their results are computed from the museum''s underlying data and inherit its limits: a converted date, a graph layout or an "on this day" selection is a presentation of the data, not a new or certified fact. Features may be changed, moved or removed at any time without notice.'
  support_title: Support and donations
  support_body: 'The museum is free for everyone. The support page offers voluntary ways to contribute to its running costs — Patreon, PayPal, LaunchGood and GitHub Sponsors — held in the operator''s personal name until a non-profit organisation is incorporated. Support is optional, buys no access, goods or services, and gives no control over the museum''s content, as the support page states. The museum is not a registered charity and issues no charitable tax receipts.'
  ip_title: Intellectual property and reuse
  ip_body: 'The museum''s data is published under CC0, its prose under CC BY-SA 4.0 and its code under the MIT licence, as the licences page sets out; reuse within those terms is welcome. Images and media that come from partner institutions and other rights-holders remain under their own terms and are credited on the page. The Qur''an text, translations and other quoted works carry the sources and terms noted in the references. Nothing on this page or the site grants any right in third-party material.'
  links_title: Links to other sites
  links_body: 'The museum points to outside sources and references for further reading. Those sites are not under the museum''s control, their content is not endorsed by inclusion, and their own terms and policies apply when you follow them.'
  liability_title: No warranties; liability
  liability_body: 'The site and its content are provided "as is" and "as available", without warranties of any kind, express or implied, including as to accuracy, completeness, fitness for a particular purpose or uninterrupted availability. To the fullest extent permitted by applicable law, the operator accepts no liability for any loss or damage arising from the use of, or reliance on, the site or its content. Nothing in this disclaimer limits any liability that cannot lawfully be limited. The museum is operated from Ontario, Canada, and this disclaimer is governed by the laws of Ontario and the federal laws of Canada applicable in it.'
  changes_title: Changes to this disclaimer
  changes_body: 'This disclaimer may be updated as the museum changes. Updates are posted on this page with a new date, and the full history of the page is kept in the public repository on GitHub, where anyone can review what changed and when.'
  more_title: Corrections and questions
  more_body: 'If you find an error, or anything on the site that concerns you, the fastest route is the correction form; for anything else, email us. Corrections concerning living people come first.'
  contact_cta: Email us
  report_cta: Report an error
backstage:
  title: 'پسِ پردہ'
  lede: 'یہ عجائب گھر اصل میں بنتا کیسے ہے: ایک شخص، مصنوعی ذہانت کے ایجنٹوں کا ایک دستہ، اور اس منصوبے کی باقی تمام پیداوار — فلم، کامک، موسیقی اور سوشل ویڈیوز — سادہ لفظوں میں بیان، اور آخر میں خود ایجنٹوں کی مہمان کتاب۔'
  updated_tpl: 'آخری تجدید: {date}'
  intro_title: 'یہ عجائب گھر بنتا کیسے ہے'
  intro_1: 'islam.museum ایک ہی شخص نے بنایا ہے — احمد عبد العال، اوک ویل، اونٹاریو، کینیڈا سے — جو مصنوعی ذہانت کے کوڈنگ ایجنٹوں کے ایک دستے کی ہدایت کرتا ہے، اور Muse — Meta کا ذاتی AI ایجنٹ — اس کا منتظم ہے: وہی جو منصوبے کی یادداشت سنبھالتا ہے، ہدایات لکھتا ہے، نتائج جانچتا ہے اور خط کتابت کرتا ہے۔ نہ کوئی دفتر ہے، نہ عملہ، اور نہ چلتا ہوا سرور: یہ عجائب گھر ایک علمی گراف ہے جو ایک عوامی git ذخیرے میں رکھا ہے اور ایک ساکن ویب سائٹ کے طور پر شائع ہوتا ہے۔'
  intro_2a: 'اس صفحے کے لکھے جانے تک، عجائب گھر میں '
  intro_2b: ' اندراج ہیں جن سے عربی، انگریزی اور اردو میں '
  intro_2c: ' صفحات بنتے ہیں، اور '
  repo_stats: 'اس کے پیچھے کھلا ذخیرہ {commits} کمٹ (commit) اور {pulls} ضم شدہ پل ریکویسٹ (pull request) سے بنا ہے۔ '
  intro_2d: ' رہنما راستے ہیں۔ {repo}عجائب گھر کا ڈیٹا CC0 کے تحت شائع ہے اور اس کی نثر CC BY-SA 4.0 کے تحت؛ سب کچھ ایک عوامی API کے ذریعے دستیاب ہے، اور ڈیٹا سیٹ کی ایک نقل Zenodo پر مستقل شناخت کنندہ (DOI: 10.5281/zenodo.23692511) کے ساتھ محفوظ ہے — تاکہ کوئی بھی پورا عجائب گھر ڈاؤن لوڈ کر کے اس صفحے کا ہر عدد خود جانچ سکے۔'
  repo_cta: 'GitHub پر کھلا ذخیرہ'
  how_cta: 'یہ کیسے بنا — دستے کی اپنی زبانی'
  build_title: 'تعمیر: لینیں، لہریں اور دروازے'
  build_1: 'یہ دستہ ہر بڑی AI لیب سے آیا ہے: Claude Code، Devin، Cursor، Copilot، Codex، ChatGPT، Antigravity اور Grok، اور ان سب کا منتظم Muse ہے۔ ہر ایجنٹ اپنے سیشنوں اور ورک ٹریوں میں کام کرتا ہے، اور ہر کمٹ کے ساتھ AI-Agent کا ٹریلر ہوتا ہے جو اس نظام کا نام بتاتا ہے جس نے وہ کمٹ کیا۔ البتہ یہ ٹریلر ان میں سے تین کا حصہ کم بتاتے ہیں: ChatGPT، Codex اور Grok نے دستے کی لینوں میں حقیقی کام کیا، مگر ان کے نام کمٹ ٹریلروں میں کبھی ظاہر نہیں ہوتے، اس لیے ذخیرے میں پڑھے جانے والے اعداد اصل کہانی کی کم از کم حد ہیں، پوری کہانی نہیں۔'
  build_2: 'کام تقریباً بیس تحریری لینوں (docs/agents/lanes/) میں منظم ہے — ہر موضوع یا کام کے لیے ایک لین، اور ہر لین کی اپنی ہدایت، اسکیما کی جانچ فہرست اور پیش رفت فائل۔ کام لہروں میں چلتا ہے: ایک تحریری ہدایت لین اور بنائے جانے والے ریکارڈ نامزد کرتی ہے، ایجنٹ صرف فائلیں بناتا ہے، اور ایک ہی منتظم ضم کرتا ہے۔ چونکہ کئی ایجنٹ ایک ہی ذخیرے میں دھکیلتے ہیں، اس لیے ہر ضم تازہ ترین main کے مقابل سہ فریقی ضم ہوتا ہے، تاکہ کسی کا کام خاموشی سے کبھی مٹ نہ جائے۔'
  build_3: 'کوئی چیز اعتماد پر ضم نہیں ہوتی۔ کوئی تبدیلی تبھی اترتی ہے جب توثیق کنندہ "0 errors" چھاپے اور حوالہ جات کی جانچ "0 fail" چھاپے — ہر ماخذ کو ایک حقیقی، زندہ نظر ثانی تک پہنچنا چاہیے — تیار فائلوں کا سیٹ ہدایت سے بالکل میل کھائے، اور تبدیلی اسی کمٹ میں CANARY.md — عجائب گھر کی اشاعتی نوٹس فائل — میں درج ہو۔ حقائق صرف نامزد، قابلِ جانچ ماخذ کے ساتھ داخل ہوتے ہیں؛ اور جہاں شواہد متنازع ہوں، وہاں ریکارڈ اندازہ لگانے کے بجائے یہی کہتا ہے۔'
  build_4: 'عجائب گھر کی ایک عوامی آزمائشی جڑواں کاپی uat.islam.museum پر بھی ہے — سائٹ کی ایک حقیقی، کام کرتی نقل، اپنی الگ آزمائشی API پر — جہاں اشاعتوں کو بانی کے production پر بھیجنے سے پہلے آزمایا جاتا ہے۔ یہ اپنی افادیت ثابت کر چکی ہے: فوٹر میں ورژن نہ آنے کا مسئلہ، جو 6 نومبر 2026 کو درست ہوا، وہیں پکڑا گیا تھا — معلوم ہوا کہ آزمائشی API کا ہوسٹ سائٹ کی مواد حفاظتی پالیسی میں شامل ہی نہیں تھا، اس لیے فوٹر کی ورژن سطر کبھی لوڈ ہی نہ ہوئی۔'
  work_title: 'ہم کیسے کام کرتے ہیں'
  work_1: 'بانی سائٹ کو خود شائع کرتا ہے۔ ضم شدہ کام اس وقت تک عوامی سائٹ پر نظر نہیں آتا جب تک وہ اسے شائع نہ کرے، اور یہ عموماً دن میں ایک بار ہوتا ہے: کوئی تبدیلی مکمل اور ضم ہو کر بھی اس کی اگلی اشاعت تک زائرین کو نظر نہیں آتی۔'
  work_2: 'خط کتابت احتیاط سے کی جاتی ہے: کسی شخص یا ادارے کو کچھ بھی بھیجنے سے پہلے اس کی تصدیق کی جاتی ہے، جو کچھ بھیجا جاتا ہے اس کا ریکارڈ رکھا جاتا ہے، اور کسی کو کبھی دوسری بار نہیں لکھا جاتا۔'
  work_3: 'کسی بھی دعوے پر عمل سے پہلے اس کی جانچ کی جاتی ہے۔ کسی بھی پلیٹ فارم پر کچھ شائع کرنے سے پہلے اس پلیٹ فارم کے اس نوعیت کے مواد کے موجودہ قواعد پڑھے جاتے ہیں، اور بیرونی خلاصوں میں آنے والی باتیں اصل زندہ ماخذ سے ملائے بغیر ان پر بھروسا نہیں کیا جاتا۔'
  work_4: 'لفظ مفت کے بارے میں ایک ایماندارانہ وضاحت ضروری ہے۔ عجائب گھر کی سیر اور اسے پڑھنا مفت ہے؛ اسے مکمل ڈاؤن لوڈ کر کے اپنے کمپیوٹر پر چلانا مفت ہے؛ اسے بنیاد بنا کر اس پر تعمیر کرنا مفت ہے؛ اور اس کی عوامی API ہر کسی کے لیے مفت ہے۔ مفت نہیں ہے اسے بنانا: عجائب گھر کی تعمیر، اس کا ڈیزائن، اس کی دیکھ بھال، اس کی تشہیر اور اس کا انتظام، اور اس کے مواد کو اکٹھا کرنا، شامل کرنا اور شائع کرنا — ان سب پر بہت پیسہ لگتا ہے، ہر مہینے بلکہ ہر دن، اور یہ تمام اخراجات بانی خود اٹھاتا ہے۔ یہ عجائب گھر اسے استعمال کرنے والوں کے لیے مفت ہے؛ اسے بنانے والے کے لیے مفت نہیں ہے۔'
  film_title: 'فلم اور کامک'
  film_1: 'عجائب گھر کی سینمائی تشہیری فلم 3:34 طویل ہے، اور عجائب گھر، اس کے شعبوں اور اس کے مجموعے کا تعارف کراتی ہے۔'
  film_2: 'Google Flow میں Veo 3.1 سے ایک AI کارٹون ٹریلر تیار ہو رہا ہے۔ ایک نوبیائی مسافر کو صحرا کی ریت تلے دفن قدیم کتابیں ملتی ہیں؛ انہیں کھولتے ہی اسلامی تاریخ کے لوگ، مقامات اور واقعات نکل کر اس کے گرد حلقہ بنا لیتے ہیں اور افق بھر دیتے ہیں؛ پھر ایک سفید گھوڑا اسے مکان و زمان میں اڑا کر اسلام کی ابتدا — کعبہ — تک لے جاتا ہے۔ عجائب گھر کے اصول کے مطابق انبیاء کی تصویر کشی کبھی نہیں کی جاتی۔'
  film_3: 'عجائب گھر کی ایک کامک بھی ہے: قسط 1، 2 نومبر 2026 کو Webtoon پر شائع ہوئی، Substack پر اس کی افتتاحی تحریر کے ساتھ۔'
  comic_cta: 'Webtoon پر قسط 1 پڑھیں'
