    ghayb:
      title: غیب کا براؤزر
      desc: "جن و ملائکہ، روح، وقت کے پیمانے، معراج، برزخ اور قیامت کی نشانیاں — مآخذ کے ساتھ غیب۔"
      menu: "غیب کی دنیا دیکھیے"
    nature:
      title: قدرت کا متلاشی
      desc: "قرآن اور حدیث میں جانور، پرندے، کیڑے، سمندری حیات، نباتات اور تخلیق کے مظاہر — ہر آیت اور حدیث مآخذ سمیت۔"
      menu: "قرآن اور حدیث میں قدرت دیکھیں"
    angels:
      title: "فرشتوں کا براؤزر"
      desc: "قرآن، حدیث، سیرت اور سنی کتابوں میں فرشتوں کا ہر ذکر — جبرائیل، میکائیل، اسرافیل، کرام کاتبین، بدر اور حنین کے فرشتے — کردار کے مطابق مرتب، ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "فرشتوں اور ان کے ذکر کو دیکھیں"
    dreams:
      title: خوابوں کا براؤزر
      desc: "قرآن، حدیث، سیرت اور ہر حاصل شدہ کتاب میں ذکر شدہ ہر رؤیا اور خواب — یوسف کے خواب سے لیلۃ القدر کے خواب تک، اور ہر خواب اس دن درجہ بند جب اس کا ماخذ آئے۔"
      menu: "قرآن، حدیث اور سیرت کے خواب دیکھیں"
    dua:
      title: "دعاؤں کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں ذکر شدہ ہر دعا — «ربِّ اغفر لی» سے «اللہمّ إنی أعوذ بک» تک، نبی کی رات کی نماز کی دعائیں اور صحابہ کی دعائیں — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن، حدیث اور کتابوں میں دعائیں دیکھیں"
    ibadat:
      title: "متصفح العبادات والاذکار"
      desc: "قرآن، سنت، سیرت اور ہر کٹائی گئی کتاب میں مذکور ہر عبادت اور ذکر — نماز، طہارت، روزہ، زکات و صدقہ، حج و عمرہ، ذکر و دعا، تسبیح و استغفار، تلاوت، توبہ اور رقیہ — ہر آیت اور خبر اپنے ماخذ کے ساتھ."
      menu: "قرآن، حدیث اور کتب میں عبادات اور اذکار دیکھیے"
    nar:
      title: "آگ کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں آگ کا ہر ذکر — جہنم، سقر، الجحیم، الحطمة، لظیٰ، الحامیۃ اور السعیر، اس کے خازن، ایندھن، زقوم اور پل صراط — اور دنیا کی آگ بھی: ابراہیم کی آگ، موسیٰ کے درخت کی آگ اور جنگ کی آگ — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن، حدیث اور کتابوں میں آگ کا ذکر دیکھیں"
    janna:
      title: "جنت کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر کٹائی کی گئی کتاب میں جنت کا ہر ذکر — فردوس، جنات عدن، دار السلام، اس کی نہریں، دروازے، درجات، مٹی اور اہل جنت، اور صحابہ و تابعین کی ہر روایت — ہر آیت اور حدیث حوالے کے ساتھ۔"
      menu: "قرآن، حدیث اور کتابوں میں جنت دیکھیے"
    qiyama:
      title: "بعث، یوم قیامت اور حساب کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں بعث، روزِ قیامت اور حساب کا ہر ذکر — دن کے نام، صور میں پھونک، اٹھانا اور حشر، اہوال، عرض و صحائف، میزان، سایہ، حوض، شفاعت اور پل صراط — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن، حدیث اور کتابوں میں بعث، قیامت اور حساب دیکھیں"
    usra:
      title: "خاندان اور شادیوں کا براؤزر"
      desc: "اسلام کی مشہور شادیاں، مسلمان خاندان، ان کے مسکن، معیشت، روزمرہ زندگی اور سماجی عادات — قرآن، سنت، سیرت اور ہر کٹائی کی گئی کتاب میں نکاح، میاں بیوی، اولاد، مسکن، معاش اور عادات کا ہر ذکر، ہر آیت اور روایت حوالے کے ساتھ۔"
      menu: "قرآن اور کتابوں میں شادیاں، خاندان اور روزمرہ دیکھیے"
    islamiceconomy:
      title: "اسلامی معیشت کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں کرنسی، سود، قرض، تجارت کے معاہدے، اوزان و پیمائشیں، مالی حقوق اور وقف کا ہر ذکر — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن، حدیث اور کتابوں میں کرنسی، صکوک اور وقف دیکھیں"
    sayyiat:
      title: "سیّیات کا براؤزر"
      desc: "سیّیات اور ان سے جڑی ہر چیز کا ذکر — إثم، ذنب، معصیت، کبائر، صغائر، توبہ اور استغفار — قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں، ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن اور کتابوں میں سیّیات اور گناہوں کو دیکھیں"
    hudud:
      title: "حدودِ الٰہی اور کبائر کا براؤزر"
      desc: "حدودِ الٰہی اور کبائر کا ہر ذکر — «یہ اللہ کی حدود ہیں»، رجم، جلد، دست کاٹنے اور تعزیر کی مقررہ سزائیں، زنا، سرقہ، قذف، شراب، ردہ اور حرابہ کے جرائمِ حدود، اور کبائر اور سات موبقات — قرآن، سنت، سیرت، صحابہ و تابعین کی روایات اور ہر حاصل شدہ کتاب میں، ہر آیت اور خبر اپنے ماخذ کے ساتھ۔"
      menu: "قرآن اور کتابوں میں حدودِ الٰہی اور کبائر دیکھیں"
    hasanat:
      title: "حسنات براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں حسنات کا ہر ذکر — «إن الحسنات يذهبن السيئات»، «من جاء بالحسنة فله عشر أمثالها»، نیکیوں کی تحریر، اللہ کو قرض حسن، اور «الحسنى» کااجر — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن اور کتابوں میں نیکیاں دیکھیں"
    hisab:
      title: "حسنات و سیئات کی فہرست، کیلکولیٹر اور گنتی"
      desc: "قرآن، سنت، سیرت اور ہر شامل کتاب کی ہر وہ نص جو عمل کو گنتی، لکھتی، بڑھاتی، مٹاتی یا تولتی ہے، ساتھ ایک کیلکولیٹر جو نصوص کے بتائے ہوئے اعداد پڑھتا ہے اور ذکر کی گنتی؛ ہر عدد اپنی نص کی طرف منسوب ہے۔"
      menu: "نیکیوں اور برائیوں کی فہرست، کیلکولیٹر اور گنتی"
    mukatabat:
      title: "مکاتبات براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں مکاتبات کا ہر ذکر — نبی کی بادشاہوں اور شہنشاہوں کو کتابیں، خلفاء کی کتابیں اور جوابات، سلیمان کی ملکہ سبا کو کتاب — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن اور کتابوں میں خطوط اور مکاتبات دیکھیں"
    magic:
      title: "جادو اور جادوگروں کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں جادو اور جادوگروں کا ہر ذکر — سحر، کہانت، رقیہ، نظر اور حسد — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "قرآن اور کتابوں میں جادو اور جادوگر دیکھیں"
    signs:
      title: "ساعت کی نشانیوں کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں ساعت کی نشانیوں، یوم قیامت اور تمام آخرتیات کا ہر ذکر — چھوٹی اور بڑی نشانییں، برزخ، بعث، حساب، میزان، صراط، حوض، جنت اور آگ — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "ساعت کی نشانیوں اور آخرت کو دیکھیں"
    jinn-devils:
      title: "جنوں اور شیاطین کا براؤزر"
      desc: "جن، شیاطین اور فرشتے، اور وہ خواب جو انہیں لاتے ہیں — قرآن، حدیث اور سیرت میں ہر ذکر اپنے ماخذ کے ساتھ۔"
      menu: "جن، شیاطین اور فرشتوں کو دیکھیں"
    messengers:
      title: "رسولوں اور انبیاء کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں رسولوں اور انبیاء کا ہر ذکر — نامور انبیاء، رسول، کہانیوں کے حامل، اور ہر آیت و روایت اپنے ماخذ کے ساتھ۔"
      menu: "رسولوں، انبیاء اور ان کے ذکر کو دیکھیں"
    miracles:
      title: "الٰہی معجزات اور انبیاء کے معجزات کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں الٰہی معجزات اور انبیاء کے معجزات کا ہر ذکر — قرآن کا معجزہ، چاند کی شق،-معراج کی رات، لاٹھی، سمندر، ناقتہ صالح، کشتی، آگ، مٹی کا پرندہ، جھولے کی بات، آسمانی دسترخوان، سلیمان کی نشانیوں، خوابوں، بشارت زکریا اور تابوت — ہر آیت و روایت اپنے ماخذ کے ساتھ۔"
      menu: "الٰہی اور انبیائی معجزات کو دیکھیں"
    qurun:
      title: "صدریوں، برسوں اور مہینوں کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں صدریوں، برسوں، اہم مہینوں اور حرمت والے مہینوں کا ہر ذکر — سیرت کے نامور برس، بارہ قمری مہینے، چار حرمت والے مہینے اور نسیء — ہر آیت و روایت اپنے ماخذ کے ساتھ۔"
      menu: "صدریوں، برسوں، مہینوں اور حرمت والے مہینوں کو دیکھیں"
    madhahib:
      title: "چاروں فقہی مذاہب کا براؤزر"
      desc: "چاروں ائمہ اور انہوں نے جن فقہی مذاہب کی بنیاد رکھی، سابقین، معتمد کتابیں اور مذہبی متون — سنی کتابوں میں مذاہب کا ہر ذکر اپنے ماخذ کے ساتھ۔"
      menu: "چاروں فقہی مذاہب اور ان کے ذکر دیکھیں"
    bayt:
      title: "نبی کریم کے گھرانے اور آل کا براؤزر"
      desc: "نبی کریم کے گھرانے اور خاندان کے بارے میں سب کچھ — اہل بیت، عترت، بنو ہاشم، ازواج مطہرات، بیٹیاں، بیٹے اور اولاد — قرآن، سنت، سیرت اور حاصل شدہ کتب میں۔"
      menu: "نبی کریم کے گھرانے اور آل کو دیکھیں"
    nubuwat:
      title: "نبی کریم کی پیش گوئیاں، قرآن کے اسرار اور معجزات کا براؤزر"
      desc: "قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں نبی کریم کی ہر پیش گوئی، نبوت کا ہر دلیل، قرآن کا ہر راز، اور ہر معجزہ اور ساعت کی نشانی — ہر آیت اور روایت اپنے ماخذ کے ساتھ۔"
      menu: "نبی کریم کی پیش گوئیاں، قرآن کے اسرار اور معجزات دیکھیں"
    places:
      title: "اسلام کے مقدس اور اہم مقامات کا براؤزر"
      desc: "اسلام کی ہر مقدس، اہم اور قیمتی جگہ جو قرآن، سنت، سیرت، صحابہ و تابعین کے قصے اور ہر حاصل شدہ کتاب میں مذکور ہو — تینوں حرم، حج کے مشاعر، سیرت کے مقامات، قرآن میں نامہائے گئے مقامات اور ہر وہ جگہ جو کسی روایت میں آئی ہو۔"
      menu: "اسلام کے مقدس اور اہم مقامات دیکھیں"
    akhlaq:
      title: "اخلاق اور معاملات کا براؤزر"
      desc: "قرآن، سنت، سیرت، صحابہ و تابعین کے اقوال اور ہر حاصل شدہ کتاب میں اخلاق اور معاملات کا ہر ذکر — سچائی، امانت، وفاداری، صبر، شکر، تواضع، احسان، حیا، حلم، عفو، اخلاص، توبہ، کرم، والدین کے ساتھ احسان، صلہ رحم اور پڑوسی کا حق؛ جھوٹ، خیانت، تکبر، ریاکاری، حسد، بخل، غیبت، چغل خوری، غصہ، ظلم، عقوق، نفاق اور دھوکا؛ اور بیع، سود، قرض، رہن، اجارہ، وصیت، میراث، نکاح، طلاق، قسم، گواہی، قضا، تول اور پیمانہ، صلح، ہبہ، کفالت، وکالت، شرکت، سلم، حوالہ، عاریت، غصب، شفعہ، احتکار، اکراہ اور حجر — ہر آیت اور خبر اپنے ماخذ کے ساتھ۔"
      menu: "قرآن، حدیث اور کتابوں میں اخلاق اور معاملات دیکھیے"
    ansab:
      title: "انساب، اقوام، بطون اور انبیاء و مرسلین کے شجرہ کا متصفح"
      desc: "انساب، اقوام، بطون اور انبیاء کے شجرہ کا ہر ذکر قرآن، سنت، سیرت اور ہر محصود کتاب میں — نبوی نسب اپنے تین حصوں میں، عرب قبائل، ان کے بطون اور اقوام — ہر ذکر ماخذ کے ساتھ۔"
      menu: "انساب، اقوام، بطون اور انبیاء کا شجرہ دیکھیں"
    battles:
      title: "غزوات، جنگوں اور فتوحات کا براؤزر"
      desc: "اسلامی تاریخ کی مہمات، لڑائیاں، محاصرے، فتوحات اور جنگیں — پہلے غزوات اور سرایا، پھر قسم اور دور کے لحاظ سے۔"
      menu: "غزوات، لڑائیاں اور فتوحات دیکھیں"
    timemachine:
      title: ٹائم مشین
      menu: کسی بھی تاریخ کا سفر، دونوں تقویموں میں
    wander:
      title: سیر کریں
      menu: عجائب گھر کا ایک بے ترتیب صفحہ
by_values:
  Islamic tradition: اسلامی روایت
  Sunni tradition: سنی روایت
  Muslim tradition: مسلم روایت
  later Muslim tradition: بعد کی مسلم روایت
  the Islamic sources: اسلامی ماخذ
  the Muslim community: مسلم امت
  a saying attributed to the Prophet in the tradition: روایت میں نبی  سے منسوب ایک قول
  the Muslim community, polemically reversing his honorific: مسلم امت، اس کے لقب کو مناظرانہ طور پر الٹتے ہوئے
  usage in the sira tradition, possibly from a striking complexion: سیرت کی روایت میں استعمال، شاید نمایاں رنگت سے
  the Prophet's household and the tradition (her kunya, better known than her given name Baraka): نبی  کا گھرانہ اور روایت (ان کی کنیت، جو ان کے دیے گئے نام برکہ
    سے زیادہ معروف ہے)
  Islamic tradition, for marrying two daughters of the Prophet in succession: اسلامی روایت، نبی  کی دو صاحبزادیوں سے یکے بعد دیگرے نکاح کی بنا پر
references:
  title: حوالہ جات
  lede: ہر کتاب، ویب سائٹ اور ڈیٹاسیٹ جس پر عجائب گھر کے متن، ڈیٹا اور اوزار انحصار کرتے ہیں، قسم کے لحاظ سے گروپ کیے ہوئے۔ متن میں استعمال ہونے والی کلاسیکی روایات
