accessibility:
  title: 'رسائی'
  lede: 'یہ میوزیم سب کے لیے ہے۔ یہ بیان بتاتا ہے کہ سائٹ کیسے بنائی گئی ہے تاکہ نابینا اور کم بینائی والے، بہرے اور کم سننے والے، بول نہ سکنے والے، اور کی بورڈ یا کوئی معاون ٹیکنالوجی استعمال کرنے والے اسے استعمال کر سکیں، اور جب کچھ ٹھیک کام نہ کرے تو ہمیں کیسے بتائیں۔'
  updated: 'آخری تازہ کاری: 25 اکتوبر 2026'
  commit_title: 'ہمارا عہد'
  commit_body: 'ثقافت تک رسائی ہر انسان کا حق ہے، بشمول معذور افراد کے (معذور افراد کے حقوق پر اقوامِ متحدہ کا کنونشن، دفعات 9 اور 30)۔ اسلام میوزیم مفت ہے، اس میں نہ اکاؤنٹ ہے نہ فیس، اور اسے اس طرح بنایا گیا ہے کہ وہی صفحات آنکھ سے، اسکرین ریڈر کے ذریعے کان سے، اور ریفریش ہونے والے بریل ڈسپلے پر چھو کر پڑھے جا سکیں، عربی، انگریزی اور اردو میں۔ ہم ہر زائر کو خوش آمدید کہتے ہیں، اس کی صلاحیت، زبان یا پس منظر کچھ بھی ہو۔'
  status_title: 'مطابقت کی صورتِ حال'
  status_1: 'میوزیم کا ہدف ویب مواد تک رسائی کی ہدایات (WCAG) 2.2، درجہ AA ہے، جو ورلڈ وائڈ ویب کنسورشیم (W3C) نے شائع کی ہیں اور بین الاقوامی معیار ISO/IEC 40500 کے طور پر اپنائی گئی ہیں۔ سائٹ جزوی طور پر مطابق ہے: زیادہ تر صفحات ہدف پر پورے اترتے ہیں، اور معلوم خامیاں نیچے درج ہیں، ساتھ ہی انہیں دور کرنے کا جاری کام بھی۔'
  status_2: 'یہ جائزہ ہمارا اپنا (خود جائزہ) ہے، جو ہر تبدیلی پر خودکار جانچ اور دستی جانچ سے کیا گیا۔ ایک آزاد آڈٹ منصوبے میں ہے، اور اس کی رپورٹ اسی صفحے پر شائع ہوگی۔'
  standards_title: 'معیارات اور قوانین جن کی ہم پیروی کرتے ہیں'
  standards_1: 'بین الاقوامی: W3C کی WCAG 2.2 AA اور WAI-ARIA 1.2؛ معذور افراد کے حقوق پر اقوامِ متحدہ کا کنونشن؛ نابینا اور طباعت پڑھنے سے معذور افراد کے لیے قابلِ رسائی صورتوں پر معاہدۂ مراکش؛ عجائب گھروں اور مجموعوں پر یونیسکو کی 2015 کی سفارش اور ICOM کی عجائب گھر کی تعریف، جو قابلِ رسائی اور سب کو شامل کرنے والے عجائب گھروں کا تقاضا کرتی ہیں۔'
  standards_2: 'کینیڈا میں، جہاں سے میوزیم چلایا جاتا ہے: ایکسیسبل کینیڈا ایکٹ اور معیار CAN/ASC-EN 301 549، اور اونٹاریو کے معذور باشندوں کے لیے رسائی کا قانون (AODA) اور اس کے مربوط معیارات۔'
  standards_3: 'ریاست ہائے متحدہ میں: امریکی معذور افراد کا قانون (ADA) اور بحالی کے قانون کی دفعہ 508۔'
  standards_4: 'یورپی یونین اور برطانیہ میں: یورپی رسائی ایکٹ (ہدایت 2019/882)، ویب رسائی ہدایت (2016/2102) اور ہم آہنگ معیار EN 301 549؛ برطانیہ کا مساوات ایکٹ 2010۔ یہ بیان یورپی کمیشن کے نمونۂ بیانِ رسائی کی پیروی کرتا ہے۔'
  blind_title: 'نابینا اور کم بینائی والے زائرین، اسکرین ریڈر اور بریل'
  blind_1: 'ہر صفحہ واضح ڈھانچے میں اصل متن ہے: ایک مرکزی سرخی، ترتیب وار سرخیاں، صفحے کے نشانات (ہیڈر، نیویگیشن، مرکزی مواد، فوٹر)، پہلی چیز کے طور پر «مواد پر جائیں» کا ربط، اور فہرستیں اور جدول اپنی درست شکل میں۔ NVDA، JAWS، VoiceOver، TalkBack اور Orca جیسے اسکرین ریڈر اسے پڑھ سکتے ہیں اور اس میں گھوم سکتے ہیں۔'
  blind_2: 'بریل کے بارے میں: ویب سائٹ خود بریل نہیں بناتی۔ اسکرین ریڈر صفحے کا متن ریفریش ہونے والے بریل ڈسپلے کو بھیجتا ہے، جو اسے بریل میں دکھاتا ہے۔ تین زبانوں میں یہ کام کرے، اس کے لیے ہر صفحہ اپنی زبان اور سمت ظاہر کرتا ہے، تاکہ اسکرین ریڈر اور بریل ڈسپلے عربی بریل، انگریزی بریل (یونیفائیڈ انگلش بریل) یا اردو بریل پر منتقل ہو جائیں۔'
  blind_3: 'تصاویر کے ساتھ متبادل متن (alt text) ہوتا ہے؛ آرائشی نقش اور آئیکن اسکرین ریڈر سے چھپائے جاتے ہیں تاکہ پڑھنے میں خلل نہ ڈالیں۔'
  blind_4: 'ہر صفحہ JavaScript بند ہونے پر بھی پڑھا جا سکتا ہے۔ انٹرایکٹو خصوصیات متن کے اوپر شامل ہوتی ہیں اور اسے کبھی نہیں چھپاتیں۔'
  vision_title: 'کم بینائی، رنگ اور پڑھنے میں آسانی'
  vision_1: 'متن اور کنٹرول WCAG کے تضاد کے تناسب (متن کے لیے 4.5:1، بڑے متن اور کناروں کے لیے 3:1) پر روشن اور تاریک دونوں تھیم میں پورے اترتے ہیں، اور رنگ کبھی معلومات دینے کا واحد ذریعہ نہیں ہوتا۔ صفحات چھوٹی فون اسکرینوں پر بغیر دائیں بائیں اسکرول کے ڈھل جاتے ہیں۔'
  vision_2: 'ہیڈر سے آپ روشن اور تاریک تھیم کے درمیان اور دو فونٹس کے درمیان بدل سکتے ہیں، اور "رسائی" مینیو آپ کو متن بڑھانے، قطاروں کا فاصلہ بڑھانے، تباین بڑھانے، حرکت روکنے اور تمام روابط کے نیچے لکیر لگانے دیتا ہے؛ یہ انتخابات صرف آپ کے آلے پر محفوظ رہتے ہیں۔ سائٹ آپ کے آلے کی روشن یا تاریک ترتیب، ہائی کنٹراسٹ (فورسڈ کلرز) موڈ اور کم حرکت کی ترتیب کی بھی پیروی کرتی ہے۔'
  deaf_title: 'بہرے اور کم سننے والے زائرین'
  deaf_1: 'میوزیم لکھا ہوا ہے، بولا ہوا نہیں: سائٹ پر کوئی چیز صرف آواز کی صورت میں دستیاب نہیں۔ جہاں بچوں کی کسی کہانی کے ساتھ آواز میں سنانا شامل ہے، وہاں کہانی کا پورا متن اسی صفحے پر پلیئر کے اوپر لکھا ہوتا ہے، اور آواز خود سے نہیں چلتی۔'
  deaf_2: 'میوزیم میں شامل ہونے والی ہر آڈیو یا ویڈیو کے ساتھ عربی، انگریزی اور اردو میں کیپشن یا مکمل تحریری متن ہونا لازم ہے۔'
  deaf_3: 'استقبال، میوزیم کی رہنمائی اور اس بیان کے اشاروں کی زبان میں نسخے منصوبے میں ہیں، جنہیں بہرے اشارہ کار امریکی اشاروں کی زبان، کیوبیک اشاروں کی زبان (LSQ)، برطانوی اشاروں کی زبان، بین الاقوامی اشاروں، عربی اشاروں کی زبان اور پاکستانی اشاروں کی زبان میں پیش کریں گے۔ تیار ہوتے ہی انہیں اس صفحے پر شامل کیا جائے گا۔'
  speech_title: 'وہ زائرین جو بول نہیں سکتے'
  speech_1: 'سائٹ پر کسی چیز کے لیے آپ کی آواز درکار نہیں: نہ آواز سے ان پٹ، نہ مائیکروفون، نہ فون لائن، نہ زبانی امتحان۔ ہم تک پہنچنے کا ہر طریقہ تحریری ہے (ای میل یا GitHub پر ایک فارم)۔'
  keyboard_title: 'کی بورڈ، سوئچ اور ٹچ'
  keyboard_1: 'ہر کام صرف کی بورڈ سے ہو سکتا ہے: Tab اور Shift+Tab ربطوں اور بٹنوں کے درمیان لے جاتے ہیں، Enter اور Space انہیں چلاتے ہیں، اور Escape فون مینو بند کر کے آپ کو اسے کھولنے والے بٹن پر واپس لاتا ہے۔ فوکس ہمیشہ نظر آتا ہے۔'
  keyboard_2: 'بٹن اور ربط چھونے کے لیے کافی بڑے ہیں۔ بچوں کے کھیل کی بورڈ سے کھیلنے کے لیے بنائے گئے ہیں، اور پڑھنے پر کوئی وقت کی حد نہیں۔'
  limits_title: 'معلوم حدود'
  limits_1: 'یہ خود جائزہ ہے: سائٹ کی ابھی تک کسی آزاد رسائی آڈیٹر کی جانچ نہیں ہوئی۔ آڈٹ اور مطابقت کی رپورٹ (ACR/VPAT) منصوبے میں ہیں۔'
  limits_2: 'انٹرایکٹو نقشہ، علمی گراف اور سہ جہتی ہال اپنی فطرت میں بصری ہیں؛ ان کے متنی متبادل مکمل کیے جا رہے ہیں اور اسکرین ریڈر سے جانچے جا رہے ہیں۔'
  limits_3: 'بعض حوالے دوسری سائٹوں پر ریکارڈ شدہ لیکچرز کی طرف لے جاتے ہیں، جن پر میوزیم کا اختیار نہیں اور جن کا تحریری متن شاید موجود نہ ہو۔ میوزیم کے متون کی بریل کے لیے تیار فائلیں (BRF) اور قابلِ رسائی ای بکس (EPUB) منصوبے میں ہیں۔ «آسان مطالعہ» صرف وہاں دستیاب ہے جہاں بچوں کے حصے کی کوئی نسخہ موجود ہے؛ زیادہ تر بڑوں کے صفحات پر ابھی یہ سہولت نہیں۔'
  tech_title: 'وہ ٹیکنالوجی جس پر سائٹ انحصار کرتی ہے'
  tech_1: 'HTML، CSS اور WAI-ARIA، جنہیں ہر جدید براؤزر پڑھتا ہے؛ JavaScript اختیاری ہے۔ سائٹ کوئی رسائی «اوورلے» یا کسی تیسرے فریق کا ٹول بار استعمال نہیں کرتی: یہ باہر کے اسکرپٹ شامل کرتے ہیں اور سائٹ کو قابلِ رسائی نہیں بناتے، اس لیے رسائی خود صفحات میں بنائی گئی ہے۔'
  formats_title: 'دوسری صورتیں'
  formats_body: 'تمام متون کھلے ہیں (متن CC BY-SA 4.0، ڈیٹا CC0)، اس لیے انہیں بریل، بڑے حروف، آڈیو یا کسی اور قابلِ رسائی صورت میں بدل کر آزادی سے بانٹا جا سکتا ہے۔ اگر آپ کو کوئی صفحہ کسی اور صورت میں چاہیے تو ہمیں لکھیں، ہم مدد کریں گے۔'
  formats_books_link: 'تیار کتابیں ڈاؤن لوڈ کریں: بریل فائلیں (BRF) اور قابلِ رسائی ای بکس (EPUB 3) برائے راستے، بچوں کی کہانیاں اور یہ صفحہ'
  feedback_title: 'کسی رکاوٹ کے بارے میں بتائیں'
  feedback_1: 'اگر سائٹ پر کوئی چیز آپ کے لیے کام نہ کرے، یا آپ کو کوئی معلومات کسی اور صورت میں چاہیے، تو ہمیں بتائیں۔ براہِ کرم صفحہ (اس کا پتا)، آپ کیا کرنا چاہ رہے تھے، اور اگر چاہیں تو اپنا براؤزر اور معاون ٹیکنالوجی بتائیں۔'
  feedback_2: 'ہم پانچ کاروباری دنوں میں جواب دیتے ہیں اور رکاوٹوں کو ترجیحاً دور کرتے ہیں۔ آپ ہمیں ای میل کر سکتے ہیں یا GitHub پر عوامی رپورٹ کھول سکتے ہیں۔'
  feedback_cta: 'رسائی کے بارے میں ای میل کریں'
  feedback_issue: 'رسائی کی رکاوٹ کی اطلاع دیں'
  law_title: 'اگر آپ مطمئن نہ ہوں'
  law_body: 'اگر ہمارا جواب مسئلہ حل نہ کرے تو آپ اپنے علاقے کے ذمہ دار ادارے سے رابطہ کر سکتے ہیں: کینیڈا میں رسائی کمشنر (کینیڈین ہیومن رائٹس کمیشن)، یا اونٹاریو میں ایکسیسبلٹی ڈائریکٹوریٹ؛ یورپی یونین میں اپنے رکن ملک کا نفاذی ادارہ؛ برطانیہ میں ایکویلٹی ایڈوائزری اینڈ سپورٹ سروس (EASS)؛ اور ریاست ہائے متحدہ میں محکمۂ انصاف کی ADA معلوماتی لائن۔'
  method_title: 'یہ بیان کیسے تیار کیا گیا'
  method_body: 'یہ بیان 25 اکتوبر 2026 کو سائٹ کے WCAG 2.2 AA کے مطابق خود جائزے سے تیار کیا گیا، خودکار جانچ (ہر پل ریکوئسٹ پر Lighthouse رسائی اسکور 100 لازم ہے) اور دستی جائزے کے ساتھ۔ سال میں کم از کم ایک بار، اور جب بھی سائٹ میں رسائی کو متاثر کرنے والی تبدیلی ہو، اس کا جائزہ لیا جاتا ہے۔'
  more_title: 'مزید پڑھیں'
  more_body: 'ڈیزائن اور رسائی کے قواعد، جن کی ہر معاون پیروی کرتا ہے، عوامی ریپوزیٹری میں شائع ہیں۔'
  more_link_rules: 'ڈیزائن اور رسائی کے قواعد'
  ld_summary: 'متن اول والا صفحہ: ہر بصری جزو کا متنی متبادل موجود ہے۔ کی بورڈ، اسکرین ریڈر اور بریل ڈسپلے معاون ہیں؛ آواز، چمک یا حرکت درکار نہیں۔'
volunteer:
  title: "ہمارے ساتھ رضاکار بنیں"
  lede: "اسلام میوزیم مفت اور کھلا ہے، اور اسے وہ لوگ بناتے ہیں جو اپنا وقت دیتے ہیں۔ آپ کی جو بھی مہارت ہو، یہاں اس کے لیے جگہ ہے۔"
  about_title: "رضاکار کیوں بنیں؟"
  about_1: "یہ عجائب گھر ایک فرد کے منصوبے کے طور پر شروع ہوا اور اب ایک مشترکہ منصوبے میں ڈھل رہا ہے۔ یہ رسائی کے لیے کوئی رقم نہیں لیتا، اس میں کوئی اشتہار نہیں، اور یہ اپنا ڈیٹا مفت فراہم کرتا ہے — اس لیے اس کی تعمیر کا کام بھی اسی طرح بانٹا جاتا ہے: رضاکاروں کے ذریعے۔"
  about_2: "نیچے دیے گئے تمام کردار رضاکارانہ اور بلا معاوضہ ہیں، اپنے وقت میں اور جہاں سے بھی آپ ہوں۔ مہینے میں ایک گھنٹہ دیں یا ہفتے میں ایک دن؛ دونوں اہم ہیں۔"
  outreach_title: "رسائی اور روابط"
  outreach_body: "عجائب گھر کو ان لوگوں تک پہنچانے میں مدد کریں جن کے لیے یہ بنایا گیا ہے: اسکول، لائبریریاں، مساجد، کمیونٹی گروپس، صحافی اور تخلیق کار — عجائب گھر کا تعارف کرانا، جوابات کی پیروی کرنا، اور اپنے شہر یا ملک میں اور اپنی زبان میں تعلقات بنانا۔"
  development_title: "ڈیولپمنٹ"
  development_body: "خود ویب سائٹ کی تعمیر اور دیکھ بھال میں مدد کریں: اوپن سورس کوڈ، نئی خصوصیات، اصلاحات، کارکردگی، رسائی اور جانچ — کھلے عام، GitHub پر، عجائب گھر کے دیگر شراکت داروں کے ساتھ۔"
  review_title: "مواد کا جائزہ"
  review_body: "عجائب گھر کی انٹریوں کی اشاعت سے پہلے اور بعد میں جانچ میں مدد کریں: حقائق، تاریخیں، ماخذ اور تراجم۔ جائزہ لینے والے ہی عجائب گھر کو دیانت دار رکھتے ہیں — اگر آپ عربی، انگریزی یا اردو میں توجہ سے پڑھتے ہیں تو یہی اس کام کا دل ہے۔"
  planning_title: "منصوبہ بندی"
  planning_body: "یہ طے کرنے میں مدد کریں کہ عجائب گھر آگے کیا بنائے: نئے شعبے اور خصوصیات، شراکت داریاں، پروگرام اور ترجیحات — اچھے خیالات کی لمبی فہرست کو ایک ایسے منصوبے میں بدلنا جسے رضاکار واقعی انجام دے سکیں۔"
  education_title: "تعلیم"
  education_body: "عجائب گھر کے تعلیمی شعبے کو بڑھانے میں مدد کریں: اساتذہ اور کلاس رومز کے لیے مواد، بچوں کا شعبہ، رہنما کتابچے، سرگرمیاں اور راستے جو طلبہ کو اسلامی تاریخ سے تجسس کے ساتھ روشناس کرائیں۔"
  media_title: "میڈیا تخلیق"
  media_body: "عجائب گھر کا میڈیا بنانے میں مدد کریں: ویڈیو، آڈیو، تصاویر اور خاکے — بشمول مصنوعی ذہانت کی مدد سے تخلیق — ٹریلرز اور آواز سے لے کر انٹریوں اور سوشل پوسٹس کے فن پاروں تک، ہمیشہ عجائب گھر کے درستگی اور احترام کے معیارات کے مطابق۔"
  support_title: "معاونت"
  support_body: "عجائب گھر استعمال کرنے والوں کی مدد کریں: زائرین کے سوالوں کے جواب دینا، لکھنے والے اساتذہ اور شراکت داروں کی رہنمائی کرنا، اور عجائب گھر کی کمیونٹی چینلز کو خوش آئند اور مفید رکھنا۔"
  join_title: "شامل کیسے ہوں؟"
  join_body: "ہمیں لکھیں اور اپنا نام، اپنا مقام، اوپر دیے گئے شعبوں میں سے اپنی دلچسپی کا شعبہ، اپنی مہارتوں یا تجربے کے بارے میں مختصر تعارف، اور اندازاً وہ وقت بتائیں جو آپ دے سکتے ہیں۔ ہم ہر پیغام کا جواب دیتے ہیں، اور مل کر پہلا مناسب کام تلاش کریں گے۔"

why:
  title: "Why islam.museum?"
  lede: "Why this museum exists, what came before it, and what makes it different — the whole story of Islam as one free, open, sourced museum."
  emblem_alt: 'The museum emblem: a gold eight-point star around a lapis disc with a copper mihrab arch over an open book'
  gap_title: "The gap it fills"
  gap_1: "Islam is fourteen centuries old and is lived today by nearly two billion people, yet for most of that history there was no single place where its whole story could be walked through — freely, openly, and in full. The heritage was never lost; it was fragmented. Its objects sit in a handful of great museums, its scholarship sits behind paywalls and in specialist libraries, and most retellings take one region, one century or one art form at a time."
  gap_2: "A new generation now meets this history first through search results, short videos and feeds — fragments answering fragments. What did not exist was the open reference layer underneath: one sourced, structured, public account of the whole story that anyone could enter, check and build on. islam.museum was built to be that layer."
  before_title: "What came before"
  before_intro: "The museum stands on the shoulders of two centuries of collectors, scholars and builders. Each of these predecessors did one part of the work superbly — and each is partial by design: objects, or scholarship, or one region, one era, one art."
  before_cairo: "Cairo — the Museum of Islamic Art, founded in 1881 under Khedive Tawfiq and opened in 1903 at Bab al-Khalq, is among the oldest and largest museums of Islamic art in the world, holding tens of thousands of objects from across the Islamic lands."
  before_berlin: "Berlin — the Museum of Islamic Art in the Pergamon, founded in 1904 by Wilhelm von Bode, built a great European collection, famous for the Aleppo Room and the facade of Mshatta."
  before_istanbul: "Istanbul — the Museum of Turkish and Islamic Arts, opened in 1914 in the Ibrahim Pasha Palace on the Hippodrome, gathers Turkish and Islamic works from the Anatolian and Ottoman centuries."
  before_encyclopaedia: "Leiden — the Encyclopaedia of Islam, published by Brill since its first edition of 1913–1936 under M. Th. Houtsma and his colleagues, remains the standard scholarly reference on Islam and the Muslim world; it is written for specialists and read behind a paywall."
  before_malaysia: "Kuala Lumpur — the Islamic Arts Museum Malaysia, opened in 1998 by Syed Mokhtar Al-Bukhary's Albukhary Foundation, is Southeast Asia's great museum of Islamic art, its galleries spanning fourteen centuries."
  before_inventions: "Manchester — 1001 Inventions, launched in 2006 by the Foundation for Science, Technology and Civilisation under Professor Salim Al-Hassani, took a beloved touring exhibition around the world — covering one brilliant slice of the story: science and technology."
  before_doha: "Doha — the Museum of Islamic Art, opened in 2008 on its own island in the harbour, was designed by I. M. Pei and is led by Qatar Museums under Sheikha Al Mayassa bint Hamad Al Thani; its galleries hold masterpieces from three continents."
  before_aga_khan: "Toronto — the Aga Khan Museum, opened in 2014 and founded by the Aga Khan IV in a building designed by Fumihiko Maki, presents the arts and cultures of Muslim civilisations to North American audiences."
  before_discover: "Online — Discover Islamic Art, built by Museum With No Frontiers under its founder Eva Schubert and launched in 2005 with European Union Euromed Heritage funding of about €3.1 million, is the closest digital predecessor: some 150 experts in 14 countries catalogued 850 artefacts and 385 monuments. It covers the art and material culture of the Mediterranean, and its story ends in 1922."
  before_libraries: "And the texts live elsewhere again: libraries such as al-Maktaba al-Shamela gather the books; platforms such as Google Arts & Culture host exhibitions lent by many museums."
  before_close: "None of this is a criticism. A museum of objects must choose its objects; an encyclopaedia must choose its readers; an exhibition must choose its theme. But it left a shape of work undone: the whole story, for everyone, in the open."
  before_links: "Visit them:"
  link_doha: "Museum of Islamic Art, Doha"
  link_aga_khan: "Aga Khan Museum"
  link_malaysia: "Islamic Arts Museum Malaysia"
  link_inventions: "1001 Inventions"
  link_discover: "Discover Islamic Art"
  object_alt: "An AI-generated illustration of a Persian brass astrolabe, of the kind the great museums preserve. It is an illustration, not a photograph of an original object."
  object_caption: "The astrolabe — emblem of the object-world the great collections preserve (illustration, from the museum's art wing)."
  diff_title: "What none of them does"
  diff_intro: "No other project we know of combines all of the following in one place. Each point on its own exists somewhere; together they describe a different kind of institution."
  diff_scope: "The whole story, in one graph. Not art alone, not science alone, not one region or dynasty: the faith, its people, places, events, ideas, objects, words and living culture, from the world of 610 to today, across every continent Islam has reached."
  diff_open: "Open, completely. Free to read, with no account and no advertising. The data is published under CC0, the prose under CC BY-SA 4.0 and the code under MIT, with a public API — anyone may reuse the museum, fork it, translate it or build on it."
  diff_language: "Arabic first. The museum is written in Arabic before any other language, with full English and Urdu editions beside it — reversing the usual order, in which this history is written about the Arabic-speaking world in other tongues."
  diff_structure: "A sourced graph, not a pile of pages. Every entry is a node tied to the people, places and events around it, and every claim carries its source, so a reader can check anything and a machine can build on everything. Today the graph holds over 42,000 entries and some 86,000 pages across nine wings, joined by 300 pathways."
  diff_alive: "Alive, not a cabinet. A children's wing, interactive journeys, a timeline explorer, a 3D tour and Hijri calendar tools sit inside the same museum as its scholarship — a seven-year-old and a professor enter through the same door."
  diff_founder: "Built by one person, in the open. islam.museum was founded by Ahmed Abdel Aal, a Canadian of Egyptian origin, and is built with AI assistance at build time under strict sourcing rules — every fact tied to a published source before it ships. The method is not hidden; it is part of the difference, and the whole build happens in a public repository."
  built_title: "How it is built"
  built_1: "The museum is a knowledge graph kept in plain files in a public repository: language-neutral facts in data files, with prose in Arabic, English and Urdu beside them. An entry is published when its claims cite defined sources and its provenance is recorded — that is the museum's whole publication standard, and it applies to the founder and to every contributor alike."
  built_2: "Nothing on the published site is generated when you visit: the pages are static, there is no account system and no tracking, and corrections are made in the open, where the change history is public. The museum's disclaimer explains what it is and is not; its volunteers review, translate and extend it; and its supporters keep it free for everyone else."
  built_repo: "The museum's repository on GitHub"
  forward_title: "Where it goes next"
  forward_1: "The plan is to make the museum permanent and public infrastructure. The project intends to incorporate as a non-profit organisation in Ontario, Canada. Its dataset is deposited under a permanent identifier — the Zenodo DOI below — and its application to the Digital Public Goods Alliance has been submitted and is under review. More languages will join Arabic, English and Urdu, and partnerships with libraries, schools and museums will carry the museum into classrooms and reading rooms."
  forward_2: "The build itself is a template: because the code and the data are open, another community can fork the same machinery to tell the story of its own heritage in the same way. And one commitment does not change with growth: the museum stays free — no paywall, no account wall, no advertising — for the next reader, whoever and wherever they are."
  forward_doi: "10.5281/zenodo.23692511"
  matters_title: "Why it matters"
  matters_1: "Reference layers shape memory. Whoever builds the open, sourced account of a civilisation — the one search engines quote, students cite and machines learn from — shapes how the next century understands it. islam.museum intends that layer, for Islam's fourteen centuries, to be open rather than owned, Arabic-first rather than translated last, and free rather than fenced: built carefully, cited honestly, and given away. It is an invitation as much as a museum."
  matters_visit: "Enter the museum"
  about_title: "Why this museum exists"
  about_body: "What makes islam.museum different from the great museums and references that came before it — and where it is going next — is told on its own page."
  about_link: "Why islam.museum?"

network:
  title: اسلام میوزیم نیٹ ورک
  lede: 'شراکت دار اور ساتھی — وہ اہلِ علم، ادارے اور برادریاں جو عجائب گھر سے مکالمے میں ہیں۔'
  intro: 'عجائب گھر تبادلے سے پروان چڑھتا ہے: اہلِ علم، کتب خانے، اساتذہ اور قارئین جو اس کے صفحات کو پرکھتے، درست کرتے، آگے پہنچاتے اور اس کے کھلے ڈیٹا پر تعمیر کرتے ہیں۔ اس صفحے پر ان شراکت داروں اور ساتھیوں کی فہرست ہے جو اس تبادلے میں شامل ہوئے — ہمارے شکریے کے ساتھ۔'
  e1_name: 'شریعت کا ارتقا — عبد اللہ احمد النعیم'
  e1_desc: 'ایموری یونیورسٹی کے پروفیسر عبد اللہ احمد النعیم کی ویب سائٹ، جو شریعت کے مستقبل اور مسلم معاشروں کی داخلی گفتگو کے ذریعے اسلامی اصلاح کے لیے وقف ہے۔ ہم پروفیسر النعیم کے شکر گزار ہیں کہ انہوں نے عجائب گھر پر اپنی قیمتی آراء دیں اور اسلام میوزیم کو دنیا بھر میں اپنے سامعین اور ساتھیوں تک پہنچایا۔'
  visit: 'ویب سائٹ دیکھیں'
  closing: 'اس تبادلے میں شامل ہونے کے لیے — آراء، تصحیحات، اشتراک یا کھلے ڈیٹا کے استعمال کے لیے — discover@islam.museum پر لکھیں۔'
developers:
  title: 'Developers'
  lede: 'Build on the museum: an open, sourced graph of Islamic history — as links, as widgets, and as data your systems can read. No key, no fee, no permission to ask.'
  intro_1: 'Everything the museum publishes for readers is also published for machines. Every record — person, place, building, work, event — has a permanent web page and a JSON twin at a stable address, and the whole collection is served as one connected graph: records (nodes) and the sourced relationships between them (edges).'
  intro_2: 'There is no API key, no account and no rate card. The underlying data is CC0 1.0 — public domain, yours to download, keep and build on. The written articles are CC BY-SA 4.0, as with Wikipedia. If your system can open a web address, it can read the museum.'
  live_stats: 'اس نسخے میں زندہ مجموعہ: {records} ریکارڈ · {edges} مستند تعلقات · ریکارڈ کی {classes} اقسام · {stubs} اسٹب، جن کا دوسرے ریکارڈ ذکر کرتے ہیں اور جو ابھی لکھے نہیں گئے۔'
  quickstart_title: 'Three ways in, from an afternoon to a platform'
  quickstart_intro: 'Choose the depth that suits your institution. Each level includes everything above it.'
  level1_title: 'Level 1 — Link it'
  level1_body: 'Add the museum to your catalogue and e-resources list, and deep-link to any record: every page address is permanent, in Arabic, English and Urdu. The British Library''s Asian and African collections team is in touch with the museum about this step. Zero development work.'
  level2_title: 'Level 2 — Embed it'
  level2_body: 'Drop a living piece of the museum into your own pages with one snippet of HTML: a fact card and a guided trail of the week, in any of the three languages. The content updates on our side; your page simply frames it.'
  level3_title: 'Level 3 — Build on the data'
  level3_body: 'Download the graph itself — every record and every sourced connection as plain JSON files — and build your own search, exhibits, school resources or research tools on top. CC0 means the copy is yours outright; the living source keeps growing and correcting, and you can re-sync whenever you like.'
  endpoints_title: 'Endpoints'
  endpoints_intro: 'ہر پتہ https://api.islam.museum/api/v1/ سے شروع ہوتا ہے — یہ سابقہ خود کوئی صفحہ نہیں؛ داخلی دروازہ https://api.islam.museum/api/v1/index.json ہے۔ The same paths on islam.museum redirect here. Plain HTTPS GET requests; responses are JSON, or NDJSON (one JSON object per line) for the two graph files, so they can be processed as a stream. CORS is open (Access-Control-Allow-Origin: *), so browsers may call the API directly.'
  col_endpoint: 'Endpoint'
  col_returns: 'What it returns'
  ep1: 'The API index: version, the 22 record classes, and the licences in machine-readable form.'
  ep2: 'Live totals: how many records exist, and how many per class.'
  ep3: 'Every record of one class in a single JSON array — for example all 10,884 people.'
  ep4: 'One complete record: labels and summaries in three languages, its structured data, its sources, and its precomputed connections.'
  ep0: "داخلی دروازہ: اس API میں کون سی فائلیں اور فولڈر ہیں، اور اس کی OpenAPI تفصیل کہاں ہے۔"
  ep5: 'پورے گراف کے ریکارڈ اور اسٹب، ہر سطر میں ایک JSON آبجیکٹ ⁦({nodeLines} سطریں)⁩۔'
  ep6: 'ریکارڈوں کے درمیان ہر تعلق، ہر سطر میں ایک ({edgeLines}) — اور ہر تعلق کے ساتھ وہ مآخذ جن پر وہ قائم ہے۔'
  ep7: 'Embeddable widgets for your own pages: a fact card and the trail of the week, in Arabic, English or Urdu.'
  ep8: 'The archived dataset on Zenodo, with a permanent DOI for citation: 10.5281/zenodo.23692511.'
  examples_title: 'Example queries, with real results'
  examples_intro: 'Everything below was returned by the live API in November 2026, trimmed only for length.'
  ex1_title: 'How large is the collection?'
  ex2_title: 'One full record'
  ex3_title: 'The graph files: a node and some edges'
  ex4_title: 'Walking the graph (Python) — who was Muhammad Ali Jauhar connected to?'
  ex_note: 'Responses are trimmed with … where they continue.'
  schema_title: 'Schema'
  schema_intro: 'Two shapes cover almost everything: the node (a record, in the graph files and class indexes) and the edge (a connection). A single-record response adds the record''s full structured data and precomputed neighbourhood.'
  schema_node_title: 'Node — one record'
  schema_edge_title: 'Edge — one connection'
  schema_record_title: 'Single record — the full form'
  schema_record_body: 'A single-record response carries these keys: id, class, slug, label, summary, stub, wings, regions, periods, tags, aliases, themes, span, display, data, prose, degree, contemporaries, updated, connections, related, license. The data key holds the record''s complete structured content (dates, places, occupations, faith where attested, and more); connections and related are its precomputed neighbourhood in the graph; degree is its connection count.'
  schema_types_body: 'There are 55 kinds of connection. The most frequent: part_of (9,845), mentions (9,504), participated_in (5,317), basis_for (3,749), occurred_at (2,120), about (1,825), died_in (750), member_of (726), born_in (608), child_of (570). Dates use EDTF (the Extended Date/Time Format, ISO 8601-2 — the library and archive standard for historical dates), with Hijri years recorded alongside Gregorian ones.'
  col_field: 'Field'
  col_type: 'Type'
  col_meaning: 'Meaning'
  f_id: 'The record''s permanent identifier, class/slug.'
  f_class: 'One of the 24 classes: person, place, building, work, event, passage, source, invention, award…'
  f_label: 'The record''s name in Arabic, English and Urdu, as available.'
  f_summary: 'A short sourced summary in up to three languages.'
  f_wings: 'Which of the museum''s nine wings the record belongs to (a record may sit in several).'
  f_regions: 'Geographic regions the record belongs to.'
  f_status: 'published, or draft (ingested, still being enriched). Stubs carry no status.'
  f_wikidata: 'The record''s Wikidata identifier (QID), where one exists — use it to match records against your own catalogue.'
  f_dates: 'Date fields where they apply — born, died, or a single date — as EDTF values.'
  e_from: 'The record the connection starts from (an id).'
  e_to: 'The record it points to (an id).'
  e_type: 'The kind of connection — one of 55 types (see below).'
  e_inverse: 'Whether this edge is the inverse reading of a stored relation.'
  e_sources: 'The sources this connection rests on — every edge is sourced.'
  code_title: 'Sample code'
  code_intro: 'The three patterns most integrations need. All run against the live API exactly as written.'
  agents_title: 'Start with an AI agent'
  agents_intro: 'Hand one of these prompts to your coding assistant — Claude, Devin, Copilot, or any other — together with this page''s address. Each prompt is self-contained: it names the endpoints, the licence, and the result to produce. The prompts are given in English, as working text.'
  roadmap_title: 'How much remains — why the living source matters'
  roadmap_1: 'Of the {records} records in this build, {published} are published; the other {drafts} are drafts still being enriched, and {stubs} more are stubs awaiting their full build. A download today is a photograph of a workshop, not the finished shelves.'
  roadmap_2: 'Beyond that, the museum''s own gap map names the corpora not yet harvested: the Turkish DİA encyclopaedia (~16,800 articles, so far used only for single records), Nadwi''s 57-volume dictionary of women hadith scholars (~9,000–10,000 teachers, almost none yet in the museum), the great narrator dictionaries behind the hadith transmitter graph, the Encyclopaedia of Islam backlog, a census of manuscripts and the libraries that hold them, and regional sweeps across Southeast Asia, Africa, China and the Americas that have barely begun. Three named dictionaries alone hold roughly 36,000 more entries than the museum has records today.'
  roadmap_3: 'So take the data — that is what it is for. But build against the living source where you can: it corrects errors as scholars report them, adds thousands of records a month, and keeps one canonical address for everything. The copy is a snapshot; the museum is the garden.'
  honesty_title: 'What is not here yet'
  honesty_body: 'Stated plainly, so your planning rests on fact: there is no OpenAPI/Swagger document, no SPARQL endpoint, and no OAI-PMH or MARC export yet. The jobs taxonomy is served as records but is not yet woven into the graph as edges, and records carry Wikidata IDs without a lookup by QID yet. The JSON shapes above are stable and versioned (v1 in every address), and the meta index announces the version and licences. Formal API documentation and library-standard exports are on the roadmap.'
  licence_title: 'Licence, citation and contact'
  licence_body: 'Data: CC0 1.0 — no permission needed; a credit line such as “Data: islam.museum (CC0)” is appreciated. Articles: CC BY-SA 4.0 — reuse with credit. Code: MIT. For citation, the dataset''s DOI is 10.5281/zenodo.23692511. The museum is a personal, non-commercial initiative, offered free to libraries, schools and readers everywhere; questions, corrections and collaboration: discover@islam.museum.'
  unique_title: 'What makes this different'
  unique_intro: 'Many collections hold pieces of the Islamic past. The museum''s claim is narrower and, we believe, unmatched in combination — no comparable combination is known:'
  u1_title: 'One graph, every surface'
  u1_body: 'The museum is not a website with an API attached. Its primary form is a single knowledge graph — records as structured data, articles as text — kept in a public git repository. The website, this API, the search, the timeline, the embeds and the children''s wing are all renderings of that one graph. Correct a fact once, and every surface corrects.'
  u2_title: 'Sources inside the structure'
  u2_body: 'In most datasets, evidence lives in footnotes. Here it lives in the data model: connections carry the sources they rest on, summaries carry their citations, and contested points keep their readings, labelled rather than flattened. You can query not only what the museum says, but what it rests on.'
  u3_title: 'Arabic first, three editions throughout'
  u3_body: 'The graph is written Arabic-first — the Arabic labels and summaries are the original, not a translation — with full English and Urdu editions of everything, records and interface alike. Most collections in this field are English with translations, or Arabic alone.'
  u4_title: 'Fourteen centuries, one connected web'
  u4_body: 'Twenty-two classes — people, places, buildings, objects, books, Qur''anic and hadith passages, concepts, events, journeys — share one graph, so a question can travel from a scholar to a book, to its manuscripts, to a city, to a century. Encyclopaedias divide all this by discipline and by volume; the graph crosses it.'
  u5_title: 'Time as data, in two calendars'
  u5_body: 'Dates are structured values in EDTF, the library standard for historical dates, with Hijri years recorded beside Gregorian ones — so timelines, centuries and anniversaries are computed from the data, not written page by page.'
  u6_title: 'Open at every layer — and reproducible'
  u6_body: 'Data CC0, prose CC BY-SA, code MIT: no key, no tracking, no server answering each visitor — the site is static files, and the complete dataset is two downloads. Any institution can mirror the entire museum, verify it independently, and rebuild on it. Nothing is held back to make you depend on this website.'
  unique_closing: 'Others are larger in one dimension: a bigger encyclopaedia, a deeper single text corpus, a wider graph with no prose and no curation. What does not exist elsewhere, to our knowledge, is the combination — a sourced, Arabic-first, openly licensed graph of the whole Islamic past, published as a museum that anyone can read, query, embed and take.'
  jobs_title: 'One class worth naming: job'
  jobs_body: 'The job class is the museum''s taxonomy of crafts and professions — 19 records today, each carrying its domain, its kind, whether it was a guild craft (hirfa), its era and first attestation with sources, its places, its organisation and its training. Fetch the whole taxonomy at /api/v1/job/index.json, or one craft at /api/v1/job/{slug}.json. Occupations are not yet woven into the graph as edges — people carry them inside their own records — so that weaving is on the roadmap, and the changelog will record it when it lands.'
  inventions_title: 'ایک قابلِ ذکر کلاس: ایجاد (invention)'
  inventions_body: 'invention کلاس ایجادات اور دریافتوں کو ان کے شعبے، قسم، دور اور پہلے ثبوت کے ساتھ درج کرتی ہے، ان کے موجدوں کو مستند کرداروں کے ساتھ، نسبت کے دعوے اور اس کی بنیاد کو، ان سے پہلے کیا تھا اور ان پر کیا بنا، اور ان کی تصویر اور خاکے کو۔ تمام ریکارڈ /api/v1/inventions.json سے، سلسلے /api/v1/inventions/chains.json سے، یا ایک ریکارڈ /api/v1/invention/{slug}.json سے حاصل کریں۔ زائرین کے لیے براؤزر /ur/inventions/ پر ہے۔'
changelog:
  title: 'Changelog'
  lede: 'Every change to the museum, recorded as it lands — what was added, changed, fixed or removed, and the version you are looking at.'
  intro: 'This page renders CANARY.md, the release-notes file kept in the museum''s public repository. Every change lands with its entry in the same commit, grouped by kind; a rollback is recorded, never erased. The entries are kept in English as the engineering record.'
  current_label: 'Current version'
  coming_title: 'What comes next'
  coming_1: 'Occupations woven into the graph: the jobs taxonomy is served as records today; next it becomes connections, so a person links to their craft and a question like “every calligrapher of the ninth century” can be walked across the graph.'
  coming_2: 'Query by Wikidata ID: a published index mapping all 16,232 Wikidata identifiers in the data to their records, with a lookup address for each QID.'
  coming_3: 'Formal API documentation (OpenAPI) and library-standard exports: OAI-PMH, MARC and a Dublin Core mapping.'
  coming_4: 'The unharvested corpora — the DİA encyclopaedia, the women hadith scholars of Nadwi''s 57-volume dictionary, the narrator (rijal) graph — and new language editions: Indonesian, Turkish and French.'
  history_line: 'The complete history, commit by commit, lives in the public repository (github.com/amado2k5/islam-museum); this page is its reader''s digest.'
support:
  title: اسلام میوزیم کی مدد کریں
  lede: یہ عجائب گھر مفت اور کھلا ہے، اس میں کوئی اشتہار نہیں اور کوئی ٹریکنگ نہیں۔ اگر یہ آپ کے لیے مفید ہے تو آپ کی مدد اسے ایسا ہی رکھتی ہے اور اسے تیزی سے آگے
    بڑھاتی ہے۔
  why_title: مدد کیوں کریں؟
  why_body: 'سب کے لیے مفت — مگر بانی کے لیے نہیں۔ یہ عجائب گھر اپنے زائرین سے کچھ نہیں لیتا — کوئی اکاؤنٹ نہیں، کوئی اشتہار نہیں، کوئی ٹریکنگ نہیں، کوئی پے وال نہیں — اور اس کے اخراجات اس کے بانی ماہ بہ ماہ ادا کرتے ہیں۔ حالیہ ایک مہینے میں یہ جاری اخراجات تقریباً 1,900 کینیڈین ڈالر رہے۔ سب سے بڑا حصہ، تقریباً 900 کینیڈین ڈالر، AI معاونین کا تھا — Claude، ChatGPT، Devin، Grok، Google کی AI اور Muse، وہ ذاتی ایجنٹ جو پورے بیڑے کے کام کو مربوط کرتا ہے — جو مواد کی تحقیق، مسودہ سازی، ترجمے اور اس کے دستاویزی ماخذ کے مقابل تصدیق کے لیے استعمال ہوتے ہیں۔ ویڈیو سازی کے اوزار Runway، Artlist اور Veo عجائب گھر کی فلمیں بناتے ہیں؛ ElevenLabs انہیں عربی، انگریزی اور اردو میں بیان کرتا ہے؛ اور GitHub کوڈ کی میزبانی کرتا ہے۔ Cloudflare، تقریباً 90 کینیڈین ڈالر ماہانہ، میزبانی اور ذخیرے کے ساتھ مل کر {pages} ریکارڈ صفحات کو تیز اور محفوظ رکھتا ہے، اور ڈومین رجسٹریشن عجائب گھر کے نام اسی کے نام رکھتی ہے۔ اور بلند ترین درجات — Claude Ultra اور Devin Max — بھی مہینہ ختم ہونے سے پہلے ختم ہو جاتے ہیں: اکتوبر اور نومبر کے آغاز میں صرف اووریج اور ٹاپ اپ چارجز نے سبسکرپشنز کے اوپر تقریباً 730 کینیڈین ڈالر کا اضافہ کیا۔ اور استعمال ناپا ہوا اور درج ہے، اندازہ نہیں: Copilot Max نے پانچ دنوں میں اپنی 20,000 ماہانہ AI کریڈٹس میں سے 18,525 استعمال کیے، Devin کا ہفتہ وار کوٹہ لگاتار دو ہفتے 100 فیصد پر رہا، اور Claude Ultra اپنے ہفتے کے 84 فیصد پر تھا جب کہ اس کی تجدید میں دن باقی تھے۔ یہ ماہانہ جاری اخراجات ہیں، سالانہ اعداد نہیں۔ ہر تعاون براہِ راست انہی پر جاتا ہے — اور اس سے کچھ خریدا نہیں جاتا: نہ رسائی، نہ سامان، نہ مواد پر کوئی اختیار۔ اور عجائب گھر خود بھی لینے کے لیے مفت ہے: کوئی بھی اس کا ڈیٹا (CC0) اور کوڈ (MIT) ڈاؤن لوڈ کر کے اسے مقامی طور پر چلا سکتا ہے، اسے بطور نمونہ آگے بڑھا سکتا ہے، یا اس کی عوامی API استعمال کر سکتا ہے — سب کے لیے مفت۔'
