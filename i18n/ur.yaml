miracles:
  title: "الٰہی معجزات اور انبیاء کے معجزات کا براؤزر"
  lede: "عجائب گھر کے مآخذ میں الٰہی معجزات اور انبیاء کے معجزات کا ہر ذکر: قرآن کا معجزہ اور اس کی نشانی، نبی کی نشانیوں — چاند کی شق، معراج کی رات، عیسیٰ کا نزول — لاٹھی، سمندر، ناقتہ صالح، کشتی، آگ، مٹی کا پرندہ، جھولے کی بات، آسمانی دسترخوان، سلیمان کی نشانیوں، خوابوں، بشارت زکریا اور تابوت، تخلیق کی کونی نشانیوں، منکرین کی ہلاکت، اور ہر کتاب جو ان کا ذکر کرتی ہے — ماخذ شدہ ریکارڈ جو نئے متنوں کے ساتھ بڑھتے ہیں۔"
  badge: معجزات کا متلاشی
  status: "اس تعمیر میں {n} ریکارڈ {s} حصوں اور {p} موضوعی صفحات میں ہیں؛ متون اس وقت مسودات ہیں جب تک کوئی انسان انہیں نہ پڑھے۔"
  method_title: براؤزر کا طریقہ
  method_note: "یہاں کا ہر ریکارڈ ایک عام عجائب گھر ریکارڈ ہے — اپنے ماخذوں اور تین زبانوں کے نثر کے ساتھ۔ معجزات کے ذکر تعمیر کے وقت مقطع متون پر ایک محفوظ لغت سے ملتے ہیں — قرآن میں «معجز» فعل «پھٹنا» ہے، معجزہ کا نام نہیں؛ «اعجاز نخل» کھجور کی جڑیں ہیں، ا redundancy نہیں؛ مبہم شکلیں صرف اپنی ملحقات کے ساتھ گنتی جاتی ہیں؛ اور تصدیق شدہ غلط مثبت شناخت سے خارج ہیں؛ ان مقطعات میں داخل ہوتے ہیں جو پہلے سے معجزاتی موضوعات کی طرف «ذکر» کناروں سے جڑے ہیں؛ بعد میں کاٹی گئی ہر کتاب اپنے مقاطع گراف میں آنے کے ساتھ اپنے معجزاتی ذکر یہاں لاتی ہے، اور منتخب ریکارڈ miracles-browser ٹیگ کے ذریعے شامل ہوتے ہیں۔"
