  voices_title: "وہ آوازیں جو پہلے سوچ چکیں"
  voices_lede: "ہم سے پہلے علماء، انجینیئرز اور فنکار اس بارے میں سوچ چکے ہیں۔ ان کی تحریروں میں سے:"
  epilogue_title: "ایک مستقل دعوت"
  epilogue: "یہ صفحہ بڑھتا رہے گا۔ جب کوئی نئی مشین کسی مسجد میں آئے، جب کوئی عالم نیا منظرنامہ لکھے، جب آپ وہ تخیل کریں جو ہم نے نہ کیا — مستقبل بھی، عجائب گھر کی طرح، زیرِ تعمیر ہے۔"
  sections:
    - k: "جماعت"
      t: "جماعت"
      d: "2077 میں جمعہ کی صفیں شاید کسی ستون کے بجائے کسی لینز کے گرد جھکیں — مخلوط حقیقت میں عبادت کرنے والے تین براعظموں کے لوگوں سے کندھے سے کندھا ملا کر کھڑے ہوں گے۔ راہنما روبوٹ آج ہی مسجد الحرام میں گیارہ زبانوں میں سوالات کے جواب دیتے پھرتے ہیں؛ تب وہ زمزم پہنچائیں گے، خطبہ ہر کان میں ترجمہ کریں گے، اور جانیں گے کون نیا آیا ہے اور کون چالیس برس سے آ رہا ہے۔ مگر صف کبھی عمارت کی نہیں تھی: وہ برابری کی ہندسہ ہے، اور سوال یہ ہے کہ کیا کوئی عکس اس میں کھڑا ہو سکتا ہے۔"
      scene: mosque
      a:
        - id: "concept/luzum-al-jamaa"
          l: "جماعت سے لگاؤ"
        - id: "concept/row-prayer-saff"
          l: "صف کی برابری"
    - k: "متن"
      t: "قرآن سیکھنا"
      d: "ایک رفیقِ حفظ جو کبھی نہیں تھکتا: آپ کی چالیسویں کوشش بھی پہلی کے صبر سے سنتا ہے، تجوید کی وہ چوک پکڑتا ہے جو تھکے استاد سے چھوٹ جاتی ہے، اور جو کچھ سکھاتا ہے اس کی سلسلہ رکھتا ہے — کون سی قراءت، کس قاری سے، کس سلسلۂ روایت سے۔ حفظ پرچمین، چھاپے اور کیسٹ سے گزر کر زندہ رہا؛ مشین ایک اور حامل بن جائے گی۔ اور عجائب گھر کا اپنا اصول آج ہی کہہ چکا ہے کہ متن خود کبھی مشین سے نہیں آئے گا۔"
      scene: hifz
      a:
        - id: "concept/hifz-preservation"
          l: "حفظ بطور تحفظ"
    - k: "سلسلہ"
      t: "حدیث سیکھنا"
      d: "اسناد دنیا کا پہلا علمی گراف تھا — نام لئے لوگوں کی زنجیر، ان کی تاریخیں، ان کے سفر، ان کی عدالت۔ 2077 میں سیکھنے والا اس زنجیر پر ایک زندہ نقشے کی طرح چلتا ہے، اور مشین وہی کرتی ہے جو محدثین شمع کی روشنی میں کرتے تھے: جانچتی ہے کہ کیا دو راوی کبھی مل ہی سکتے تھے، کہ رپورٹ اپنے ہم عصروں سے ہٹ تو نہیں گئی۔ اوزار نیا ہے؛ شک چودہ صدیوں پرانا ہے۔"
      scene: isnad
      a:
        - id: "concept/isnad"
          l: "اسناد"
        - id: "concept/ittisal-al-isnad"
          l: "اتصالِ اسناد"
    - k: "راستہ"
      t: "سیرت پر چلنا"
      d: "یہ پڑھنے کے بجائے کہ ہجرت صحرا میں دنوں لیتی ہے، 2077 کا ایک بچہ طلوعِ فجر پر اسی راستے پر کھڑا ہے — گرمی محسوس کرتا ہے، رہنما کو سواروں کو پیچھے ہٹاتے دیکھتا ہے، غار کے اندر انتظار کرتا ہے۔ عجائب گھر کے نقشےِ سفر پہلا قدم ہیں؛ حقیقت نما بیانیہ اگلا قدم۔ کہانی ہمیشہ ایسے ہی سنائی جاتی رہی — آگ کے گرد، مسجدوں میں، ماؤں کی آوازوں میں — بس آگ بدلتی رہی۔"
      a:
        - id: "event/hijra"
          l: "ہجرت"
        - id: "place/jabal-thawr-madina"
          l: "غارِ ثور"
    - k: "حج"
      t: "ہجوم کے بہاؤ کے زمانے میں حج"
      d: "مکہ آج ہی پانی بانٹنے، سنگِ مرمر صاف کرنے اور حجاج کے سوالوں کے جواب دینے کے لیے روبوٹ رکھتا ہے۔ 2077 تک ہجوم کی ذہانت تاریخ کے رنجروں کو ناقابلِ تصور بنا سکتی ہے، ترجمانی کے ائربڈز رہنما کی اشاروں کی زبان کو ریٹائر کر سکتے ہیں، اور وہ کسان جو کبھی سفر کی استطاعت نہ رکھے عبادات کی ایک امین نقل میں چل سکتا ہے۔ پھر وہ مشکل سوال جو علماء آج ہی پوچھتے ہیں: کیا حاضری ہی اصل مقصود ہے؟"
      scene: hajj
      a:
        - id: "place/mecca"
          l: "مکہ"
        - id: "concept/hajj-rulings"
          l: "احکامِ حج"
    - k: "مرجعیت"
      t: "مفتی اور مشین"
      d: "جب ہر مسلمان ایک ہی ماڈل سے پوچھ سکتا ہے تو دو مستقبل شاخیں بنتے ہیں: ایک جہاں اجتہاد بڑھتا ہے — کھلے اوزار جو ہر عالم کو چودہ صدیوں کے منہج کے سامنے حکم آزمانے دیتے ہیں — اور ایک جہاں ایک خاموش الگورتھم زمین کی واحد مرجعیت بن جاتا ہے۔ چھاپے نے حافظ کی اجارہ داری ختم کی؛ ڈیٹابیس نے موسوعی عالم کی۔ مشین کیا ختم کرے یا کیا آزاد، ابھی طے ہو رہا ہے۔"
      a:
        - id: "concept/ijtihad"
          l: "اجتہاد"
        - id: "concept/al-fatwa-ala-al-fadaiyyat"
          l: "فتویٰ"
    - k: "زمین سے باہر"
      t: "زمین سے باہر کا فقہ"
      d: "ایک بار پہلے ہی ہو چکا: 2007 میں ایک مجلسِ افتا نے اٹھارہ صفحات لکھے تاکہ ایک مسلمان خلاباز اس سٹیشن پر نماز پڑھ سکے جو دن میں سولہ بار طلوعِ آفتاب دیکھتا ہے — قبلہ کعبہ، یا اس کا عکس، یا زمین، یا کوئی بھی سمت؛ روانگی کے بندرگاہ کے وقت پر پانچ نمازیں؛ اگر اعضاء تیر جائیں تو نیت سے حرکت۔ 2077 میں مسلمان مریخ پر، قطبی دن کی مستقل روشنی میں، گھومنے والی رہائش گاہوں میں رہ سکتے ہیں۔ سوالات نئے لگتے ہیں؛ مگر طریقہ — تولنا، ڈھالنا، فریضہ قائم رکھنا — اس عجائب گھر کی قدیم ترین چیزوں میں ہے۔"
      scene: space
      a:
