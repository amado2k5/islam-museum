qurun:
  title: "صدریوں، برسوں اور مہینوں کا براؤزر"
  lede: "عجائب گھر کے ماخذات میں صدریوں اور نسلوں، برسوں اور نامور برسوں، اہم مہینوں اور حرمت والے مہینوں کا ہر ذکر: قرون اور اجيال، سیرت کے نامور برس — عام الفيل، عام الحزن، عام الوفود، عام الرمادہ — محرم سے ذوالحجہ تک بارہ قمری مہینے، چار حرمت والے مہینے اور نسیء، ایام تشريق، يوم عرفہ، لیلۃ القدر اور آخری عشرہ، جاہلیت کے مہینوں کے نام اور فارسی مہینے، اور ہر وہ کتاب جو ان پر بات کرتی ہے — ماخذ شدہ ریکارڈ جو نئے متون کے آنے سے بڑھتے ہیں۔"
  badge: صدریوں اور مہینوں کا براؤزر
  status: "یہ تعمیر {n} ریکارڈ {s} حصوں اور {p} موضوع صفحات پر مشتمل ہے؛ متون اس وقت تک مسودہ رہتے ہیں جب تک کوئی انسان انہیں نہیں پڑھتا۔"
  method_title: براؤزر کا منہج
  method_note: "یہاں ہر ریکارڈ عجائب گھر کا عام ریکارڈ ہے — اپنے ماخذات اور تین زبانوں کے نثر کے ساتھ۔ صدریوں، برسوں اور مہینوں کے ذکر کا پتہ تعمیر کے وقت مقاطع کے متون پر محروس لغت سے لگتا ہے — مفرد «سنة» کبھی شمار نہیں ہوتا جہاں وہ سنت کا مفہوم ہے نہ کہ برس، «عام» صرف نامور برسوں کے فارمولوں میں یا زمانہ ملاصقوں کے ساتھ شمار ہوتا ہے، «قرون» بیلوں اور مویشیوں کے پاس سینگ ہیں نہ کہ نسلیں، «صفر» عدد، «رجب» آدمی کا نام اور «محرم» فقہی اصطلاح صرف اپنے مہینہ ملاصقوں کے ساتھ شمار ہوتے ہیں، اور ثابت شدہ غلط مثبتیں شناخت کے ذریعے خارج کی جاتی ہیں؛ جو مقاطع پہلے سے mentions کناروں سے زمانہ موضوعات سے جڑے ہیں وہ بھی داخل ہوتے ہیں؛ بعد میں کاٹی جانے والی ہر کتاب اپنے مہینوں اور برسوں کے ذکر کو خودکار طور پر یہاں لاتی ہے جب اس کے مقاطع گراف میں اترتے ہیں، اور منتخب ریکارڈ qurun-browser ٹیگ سے جڑتے ہیں۔"
