bayt:
  title: "نبی کریم کے گھرانے اور آل کا براؤزر"
  lede: "میوزیم کے تمام ذرائع میں نبی کریم کے گھرانے اور خاندان سے متعلق سب کچھ: قرآن میں اہل بیت اور ازواج کی آیات، صحیحین، مؤطا اور سنن میں ثقلین، کساء، غدیر، فدک اور فاطمہ کے ارث کی احادیث، صحابہ کرام اور تابعین کی روایات، اور ہر حاصل شدہ کتاب میں ہر ذکر — ماخذ کے ساتھ، نئے متن کے ساتھ بڑھتے ہوئے۔"
  badge: نبی کے گھرانے کا متلاشی
  status: "اس تعمیر میں {n} ریکارڈ {s} حصوں میں ہیں؛ مسودے ہیں جب تک انسان ان کا جائزہ نہ لے۔"
  method_title: براؤزر کا طریقہ
  method_note: "یہاں ہر ریکارڈ ایک عام میوزیم ریکارڈ ہے — ماخذ اور تین زبانوں کے ساتھ۔ گھرانے کے ذکرز وقتِ تعمیر پر ایک منضبط لفظوں کی فہرست سے معلوم کیے جاتے ہیں — اہل بیت، عترت اور بنو ہاشم جیسے صاف الفاظ براہِ راست ملتے ہیں، جبکہ فاطمہ، زینب اور صفیہ جیسے مبہم نام صرف مخصوص صورتوں میں یا جھوٹی مثبتوں کے جائزے کے بعد شمار ہوتے ہیں؛ ہر نئی کتب کے ریکارڈ اسی دن یہاں آ جاتے ہیں جب اس کا متن گراف میں آتا ہے، اور گھرانے کے منتخب ریکارڈ bayt-browser ٹیگ سے شامل ہوتے ہیں۔"
  api: "پوری ڈیٹاسیٹ یہاں ہے"
  sections_title: براؤزر کے حصے
  filter_label: گھرانے کے ریکارڈ چھانٹیں
  filter_none: کوئی مماثل نتیجہ نہیں۔
  empty: اس تعمیر میں ابھی کوئی گھرانے کا ریکارڈ نہیں۔
  sections:
    quran:
      title: قرآن میں
      desc: "تطہیر اور مباہلہ میں اہل بیت کی آیات، سورۃ الاحزاب میں ازواج کی آیات، سودہ کی آیت اور باقی — ہر آیت اپنے ماخذ کے ساتھ۔"
    sunnah:
      title: سنت میں
      desc: "صحیحین، مؤطا، اربعین اور سنن میں ثقلین، کساء، غدیر، فدک اور فاطمہ کے ارث کی احادیث — ہر روایت اپنے ماخذ کے ساتھ۔"
    seerah:
      title: سیرت میں
      desc: "سیرت اور مغازی کتب میں اہل بیت، بنو ہاشم، ازواجِ مطہرات اور اولاد کا ذکر — یہ حصہ ہر نئی سیرت کے متن کے ساتھ خود بھرتا ہے۔"
    books:
      title: دیگر کتب میں
      desc: "قرآن، حدیث اور سیرت کے علاوہ شاعری، تاریخ، فقہ اور ہر حاصل شدہ کتاب میں گھرانے کا ہر ذکر۔"
    ahl:
      title: گھرانا اور خاندان
      desc: "گھرانے کے افراد کے بارے میں میوزیم کے منتخب ریکارڈ: فاطمہ، علی، حسن، حسین، خدیجہ، بیٹیاں اور ازواج، بنو ہاشم، بنو عبد المطلب، جد اور چچا۔"
    mawaqif:
      title: واقعات اور منظوریاں
      desc: "گھرانے سے جڑے واقعات اور قصے: غدیر خم، کساء، مباہلہ، فدک، فاطمہ کا ارث، کربلا اور علی کی بیعت۔"
    concepts:
      title: تصورات اور ماخذ
      desc: "گھرانے کے تصورات کے بارے میں میوزیم کے منتخب ریکارڈ: عترت، اہل کساء، ثقلین، امہات المومنین، بارہ امام اور سیرت و شمائل کی کتب۔"
  viz:
