  method_title: براؤزر کا طریقہ
  method_note: "یہاں کا ہر ریکارڈ میوزیم کا عام ریکارڈ ہے — اپنے مآخذ اور تین لسانی نثر کے ساتھ۔ ذکر بلڈ کے وقت گارڈ شدہ معجم سے متون مقاطع پر ڈھونڈے جاتے ہیں: دن کے ثابت مرکبات «يوم القيامة»، «يوم الدين»، «يوم الفصل»، «يوم الحساب» اور اس کے نام «الحاقة»، «القارعة»، «الصاخة»، «الغاشية» براہ راست شمار ہوتے ہیں؛ مبہم الفاظ — «بعث» (رسول بھیجنا)، «الساعة» (گھڑی کا گھنٹہ)، «حساب» (عددی حساب)، «الصراط» (ہدایت کا راستہ)، «شفاعة» (ہر سفارش) — صرف بعث یا حساب کے تراکیب کے ساتھ شمار ہوتے ہیں، اور تصدیق شدہ غلط مثبتیاں معرّف سے الگ ہیں۔ بعد میں ہر کٹائی شدہ کتاب اپنے ذکر خود لاتی ہے جب اس کے مقاطع گراف میں آتے ہیں؛ منتخب ریکارڈ qiyama-browser ٹیگ سے شامل ہوتے ہیں۔ ہر مقطع «بعث» (اٹھانا اور حشر)، «یوم» (نام اور اہوال) یا «حساب» (حساب، میزان، صحائف اور عبور) کے بطور نشان لگتا ہے۔ برزخ اور قبر کا سوال علاماتِ قیامت براؤزر میں رہتے ہیں؛ علامات، جنت اور آگ کے اپنے براؤزر ہیں۔"
