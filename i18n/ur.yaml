authenticity:
  title: ہم یہ کیسے طے کرتے ہیں کہ کیا دکھانا ہے
  lede: عجائب گھر صرف وہی مواد قبول کرتا ہے جو اپنے عنوان، مصنف، ماخذ اور بیان کردہ شناخت کے مطابق اصلی ہو۔ یہ صفحہ بتاتا ہے کہ یہ کیسے ہوتا ہے، اور دروازہ کیا نہیں
    کرتا۔
  updated: یہ قواعد 25 اکتوبر 2026 کی تاریخ کے ہیں، اور یہ عجائب گھر کی مستند ہونے کی پالیسی کے طور پر شائع ہیں۔
  admit_title: ہم کیا قبول کرتے ہیں
  admit_body: 'ہر کتاب، مضمون، تصویر یا نمونہ مکمل طور پر قبول، نشان زد یا مسترد کیا جاتا ہے۔ دروازہ پوچھتا ہے: کیا یہ وہی چیز ہے جو اس کا عنوان اور مصنف بتاتے ہیں؟
    اور کیا نسخہ اسی طباعت یا ادارے سے آیا ہے جس کا وہ نام لیتا ہے؟'
  check_title: دروازہ کیا جانچتا ہے
  check_body: مصنف کون ہے، اور کیا اس کے مکتبِ فکر کی تصدیق نامزد ماخذات سے ہوتی ہے۔ کیا نسخہ ایک حقیقی، شناخت شدہ طباعت ہے یا کسی ادارے کا فہرست شدہ نسخہ۔ یہ کہاں
    سے آیا، اور کیا وہ جگہ جعل سازی یا spam کی معروف فہرست میں ہے۔
  not_title: دروازہ کیا نہیں جانچتا
  not_body: یہ نہیں جانچتا کہ کسی کتاب کا ہر بیان درست ہے، اور نہ یہ بدلتا ہے کہ کتاب کیا کہتی ہے۔ خلاصے AI کے لکھے ہوئے ہیں اور اسی طرح نشان زد ہیں۔ ان کی سطر سطر
    جانچ نہیں ہوتی۔
  decisions_title: تین فیصلے
  decisions_body: 'قبول: تصدیق شدہ سنی مصنف اور توثیق شدہ نسخہ۔ نشان زد: مستند نسخہ جو اپنے مکتبِ فکر کے ساتھ دکھایا جائے، یا «مکتبِ فکر کی تصدیق نہیں ہوئی»۔ مسترد:
    ایسا نسخہ جس کی توثیق نہ ہو سکے، یا جو محدود ماخذ سے آیا ہو۔'
