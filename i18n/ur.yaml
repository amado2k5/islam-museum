messengers:
  title: "رسولوں اور انبیاء کا براؤزر"
  lede: "میوزیم کے ماخذوں میں رسولوں اور انبیاء کا ہر ذکر: قرآن، سنت اور سیرت میں نامور انبیاء اور رسول، کہانیوں، نسبوں اور بعثتوں کے حامل، ان نام نہ لیے گئے انبیاء، اور ہر حاصل شدہ کتاب میں رسولوں اور انبیاء کا ہر ذکر — اپنے مآخذ کے ساتھ ریکارڈ جو نئے متون آتے ہی بڑھتے ہیں۔"
  badge: رسولوں اور انبیاء کا متلاشی
  status: "اس نسخے میں {s} حصوں میں {n} ریکارڈ اور {p} موضوعی صفحے ہیں؛ متن کسی انسان کے پڑھنے تک مسودہ ہے۔"
  method_title: براؤزر کا طریقہ
  method_note: "یہاں ہر ریکارڈ میوزیم کا عام ریکارڈ ہے — اپنے ماخذوں اور تین لسانی متن کے ساتھ۔ انبیاء اور رسولوں کا ذکر بلڈ کے وقت مقاطع کے متن پر ایک محفوظ لغت سے پایا جاتا ہے — نامی صورتیں براہِ راست میل کھاتی ہیں، مبہم الفاظ جیسے «صالح» اور «يحيي» صرف اپنی تراکیب کے ساتھ شمار ہوتے ہیں، «ابن آدم» خارج کیا جاتا ہے کیونکہ اس کا مطلب انسان ہے نہ کہ آدم، اور جانچ کر ثابت غلط نتائج الگ کیے جاتے ہیں؛ واضح mentions تعلقات سے جڑے آیات اور روایات بھی شامل ہیں؛ آئندہ جمع شدہ ہر کتاب اپنے انبیاء و رسولوں کے ذکر اس براؤزر میں خودکار لائے گی جب اس کے مقاطع گراف میں آئیں، اور منتخب ریکارڈ messengers-browser ٹیگ سے جڑتے ہیں۔"
