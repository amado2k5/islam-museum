nubuwat:
  title: "نبی کریم کی پیش گوئیاں، قرآن کے اسرار اور معجزات کا براؤزر"
  lede: "میوزیم کے مآخذ میں نبی کریم کی ہر پیش گوئی، نبوت کا ہر دلیل، قرآن کا ہر راز اور خبايا، ان کا ہر معجزہ، اور غیب اور ساعت کی نشانیوں کی ہر خبر: قرآنی پیش گوئیاں اور «من بعدي» کی احادیث، دلائل نبوت، اعجاز قرآن اور اس کے اسرار، انشقاق قمر، معراج، طعام کی تکثیر، اور روایت کا ہر ذکر کردہ معجزہ — ماخذ کے ساتھ وہ ریکارڈ جو نئے متون کے آنے پر بڑھتے ہیں۔"
