    kutub:
      title: کتابیں
      desc: "وہ مدونات اور مصنفات جنہوں نے مذاہب کو قائم کیا یا ان کا موازنہ کیا — بشمول وہ متون جو طلبہ یاد کرتے ہیں: آجرومیہ، الفیتیں، قدوری، رسالہ قیروانی، متن ابن عاشر، متن ابی شجاع، طحاویہ، ورقات، بیقونیہ، جزریہ اور شاطبیہ — موطا، ہدایہ، مغنی، تقابلی مطالعوں اور مذاہب کی تاریخوں کے ساتھ۔"
    mafahim:
      title: تصورات
      desc: "فقہ اور اصول کے وہ الفاظ جو مذاہب کے گرد گھومتے ہیں: خود مذہب، اجتہاد، قیاس، استحسان، تقلید، اختلاف، اہلِ حدیث اور اہلِ رائے۔"
    dhikr:
      title: مآخذ میں ذکر
      desc: "میوزیم کی ہر کتاب، اقتباس یا سوال جو چاروں فقہی مذاہب یا ان میں سے کسی کا ذکر کرے — مذاہب کی تاریخیں، فقہاء کی طبقات، فتویٰ اور تقابلی سوالات — اپنے ماخذ کے ساتھ۔"
  viz:
    title: "چار مذاہب، وقت کی ایک ہی لکیر پر"
    note: "ہر کالم ایک مذہب ہے، اور چاروں ایک ہی زمانی محور کو ہجری صدیوں میں بانٹتے ہیں۔ پٹی کسی عالم کی زندگی ہے، پیدائش سے وفات تک؛ پاؤں پر نشان والی چھوٹی پٹی اُس عالم کی ہے جس کا صرف سالِ وفات درج ہے؛ ہیرا ایک کتاب ہے جو اس کے مصنف کے سالِ وفات پر رکھی گئی ہے۔ پڑھنے کے لیے ماؤس لائیں، فوکس کریں یا چھوئیں؛ کمانیں بتاتی ہیں کس نے کس سے پڑھا۔ صرف تاریخ والے اندراجات بنائے گئے ہیں۔"
