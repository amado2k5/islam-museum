    caption: "ہر کالم حصوں کا ایک ایسا امتزاج ہے جو ریکارڈ میں واقعی ملتا ہے، بڑے سے چھوٹے کی ترتیب میں: پٹی ٹھیک اسی امتزاج کے ریکارڈ گنتی ہے، رنگ بتاتا ہے کہ ریکارڈ کیا ہے، اور نیچے کے نقطے دکھاتے ہیں کہ کون سے حصے شامل ہیں۔ کسی کالم میں گنا گیا ریکارڈ عجائب گھر کی ٹیگنگ میں ٹھیک انہی حصوں سے تعلق رکھتا ہے؛ حصوں کے ناموں کے ساتھ کی پٹیاں اس حصے کے تمام ریکارڈ گنتی ہیں، اس لیے دو حصوں میں آنے والا ریکارڈ دونوں میں شمار ہوتا ہے۔"
