  paypal_cta: PayPal کے ذریعے عطیہ کریں
  launchgood_title: LaunchGood مہم
  launchgood_body: LaunchGood پر ایک عطیاتی مہم، جو دنیا کے پہلے کھلے ڈیجیٹل اسلامی عجائب گھر کی تعمیر میں مدد کے لیے ہے۔
  launchgood_cta: LaunchGood پر مہم کی حمایت کریں
  other_title: دوسرے طریقے
  other_body: اگر ماہانہ رکنیت آپ کے لیے موزوں نہیں تو آپ کوڈ، جائزے یا ترجمے میں حصہ لے سکتے ہیں، یا عجائب گھر کو اپنے جاننے والوں تک پہنچا سکتے ہیں۔
