  the Islamic sources: اسلامی ماخذ
  the Muslim community: مسلم امت
  a saying attributed to the Prophet in the tradition: روایت میں نبی ﷺ سے منسوب ایک قول
  the Muslim community, polemically reversing his honorific: مسلم امت، اس کے لقب کو مناظرانہ طور پر الٹتے ہوئے
  usage in the sira tradition, possibly from a striking complexion: سیرت کی روایت میں استعمال، شاید نمایاں رنگت سے
  "the Prophet's household and the tradition (her kunya, better known than her given name Baraka)": نبی ﷺ کا گھرانہ اور روایت (ان کی کنیت، جو ان کے دیے گئے نام برکہ سے زیادہ معروف ہے)
  Islamic tradition, for marrying two daughters of the Prophet in succession: اسلامی روایت، نبی ﷺ کی دو صاحبزادیوں سے یکے بعد دیگرے نکاح کی بنا پر

