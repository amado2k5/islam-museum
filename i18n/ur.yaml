foundation:
  title: اسلام میوزیم ادارے کے بارے میں
  lede: 'اسلام کا ایک آزاد، کھلا، مکمل طور پر ڈیجیٹل عجائب گھر: اس کا ایمان، تہذیب، قومیں، مقامات، خیالات، نوادرات، متون اور زندہ ثقافت، اُس دنیا سے جس میں اسلام
    ظاہر ہوا، آج تک۔'
  logo_title: لوگو
  logo_intro: یہ نشان اسلامی فن تعمیر کے تین عناصر اور کتاب کو ایک شکل میں جوڑتا ہے۔
  logo_star: 'اسلامی ہندسے سے آٹھ نکاتی ستارہ: وقت اور مکان ایک ساتھ، ایک کو دوسرے کے بغیر نہیں سمجھا جا سکتا۔'
  logo_arch: 'محراب: وہ دروازہ جس سے زائر داخل ہوتا ہے، اور قبلہ کی طرف رخ۔'
  logo_book: 'کھلی کتاب: علم اور الفاظ، اور فیصلہ کرنے سے پہلے پڑھنا۔'
  logo_download: نشان (PNG)
  emblem_alt: 'عجائب گھر کا امبلم: لاجوردی ڈسک کے گرد سنہری آٹھ نکاتی ستارہ، جس کے اوپر تانبے کی محراب اور کھلی کتاب'
  emblem_download: مکمل امبلم (تصویر)
  logo_dark_download: گہرے پس منظر کے لیے نشان
  logo_lockup_download: نام کے ساتھ نشان ڈاؤن لوڈ کریں
  story_title: کہانی
  story_1: 'منصوبہ ایک سادہ سوال سے شروع ہوا: آن لائن کوئی ایک جگہ کیوں نہیں جو اسلام کی پوری کہانی جمع کرے، جہاں ایک اجنبی داخل ہو کر سیکھ سکے، اور محقق کسی دعوے
    کی جانچ کر کے ماخذ تک واپس جا سکے؟ اسلام کے بارے میں جو معلوم ہے وہ صحیفوں کی سائٹوں، عجائب گھروں کے آرکائیوز، انسائیکلوپیڈیا کے مضامین، علمی مطالعات اور صحافت
    میں بکھرا ہوا ہے، اور اس کا زیادہ تر حصہ دفاع یا حملے کے لیے لکھا گیا ہے، سمجھنے کے لیے نہیں۔'
  story_2: 'منصوبے نے ایک طویل مضمون کے بجائے عجائب گھر کے طور پر بننے کا انتخاب کیا: نو پہلو (زمانہ، مقام، لوگ، خیالات، نوادرات، الفاظ، زندہ اسلام، آج، اور تخلیقات)
    ایک ہی موضوع کو مختلف زاویوں سے دیکھتے ہیں، اور ہر شخص، مقام، واقعہ، خیال یا شے ایک گراف میں ایک نقطہ ہے جو اسے وقت اور مکان میں اس کے گرد کی چیزوں سے جوڑتا ہے۔'
  story_3: 'مواد سادہ اور پڑھی جانے والی فائلوں کی صورت میں محفوظ ہے، ہر حقیقت ایک ماخذ سے جڑی ہے، اور ہر تاریخ اپنی درست شکل میں ہجری اور عیسوی کیلنڈروں کے ساتھ
    لکھی گئی ہے۔ سائٹ خود جامد صفحات ہے: بغیر سرور، بغیر ڈیٹا بیس، بغیر کسی ادا شدہ سروس، اور کسی زائر کے آنے پر کوئی AI ماڈل نہیں چلتا۔'
  story_4: 'جب عجائب گھر نے اپنی بصری شناخت چنی تو اس کے رنگ اسلامی فن تعمیر اور مخطوطہ سازی سے آئے: گہرا لاجوردی نیلا، مخطوطات کے صفحات کا مدھم سونا، گرم الاباسٹر،
    اور ٹائلوں کی ریت۔ کوئی ایک نقش کسی موجودہ کام سے نقل نہیں کیا گیا؛ نمونے ستارے، مربع اور دائرے کی هندسہ سے اُگتے ہیں۔'
  story_5: 'پھر مشترکہ کام آیا: شرکاء اور متوازی کام کرنے والے نشستیں مواد کے چھوٹے گچھے شامل کرتے ہیں، اور جائزہ مسودوں کو جائزہ شدہ اندراجات میں بدلتا ہے اس سے
    پہلے کہ انہیں اس طرح نشان زد کیا جائے۔ عجائب گھر ابھی بن رہا ہے، اور ہر صفحے پر یہ کہتا ہے؛ احاطے کا صفحہ گنتا ہے کہ کیا مکمل ہے اور کیا ابھی باقی ہے۔'
  founder_title: بانی
  founder_line: اس کے بانی {name} ہیں، جو مصری نژاد کینیڈین ہیں اور اوکویل، اونٹاریو میں مقیم ہیں۔
  founder_name: احمد عبد العال
  founder_body: 'ایک شخص نے منصوبے کی بنیاد رکھی اور اس کا پہلا منصوبہ خود ریپوزیٹری کے اندر لکھا، پھر ہر اس شخص کے لیے دروازہ کھولا جو شامل کرنا یا درست کرنا چاہے۔
    منصوبہ اس طرح بنایا گیا ہے کہ عجائب گھر اپنے بانی کے رک جانے کے بعد بھی قائم رہے: اس کا متن git میں ہے، اس کا ڈیٹا کھلا ہے، اور کوئی بھی پورا عجائب گھر اپنے کمپیوٹر
    پر نقل کر سکتا ہے۔ یہ صفحہ منصوبے اور اس کے مقصد کو بیان کرتا ہے، اس کے پیچھے کی شخصیت کی زندگی کو نہیں۔'
  goal_title: مقصد
  goal_intro: 'عجائب گھر کا مقصد اسلام کو اس کی ابتدا سے موجودہ لمحے تک، پوری طرح، انصاف کے ساتھ اور بغیر کسی جانبداری کے دکھانا ہے۔ اس کے لیے وہ درج ذیل کا عہد کرتا
    ہے:'
  goal_1: 'یہ بیان کرتا ہے، حکم نہیں دیتا: تاریخوں اور ماخذوں والے حقائق، اور فیصلے ان لوگوں سے منسوب جنہوں نے انہیں کیا۔'
  goal_2: اہلِ سنت کا بیان تحقیق کا بنیادی ڈھانچہ ہے، اور ہر دوسرا نقطۂ نظر صرف اس کے واضح طور پر نشان زد ہونے کے بعد بیان ہوتا ہے۔
  goal_3: مخالفین، ناقدین اور حلیف اپنے دور میں اپنے کرداروں کے ساتھ ظاہر ہوتے ہیں، دشمنی کی زبان کے بغیر لکھے گئے۔
  goal_4: 'متنازع سوالات کشمکش کے کارڈوں کے طور پر آتے ہیں: دو یا زیادہ آوازیں، ہر ایک کا حوالہ، عجائب گھر کا کوئی فیصلہ نہیں۔'
  goal_5: ہر دعویٰ کسی ماخذ سے جڑا ہے؛ وکی پیڈیا ایک اشارہ ہے، ماخذ نہیں۔
  goal_6: یہ عربی سے شروع ہوتا ہے، اور اسلام سے ناواقف زائر کی اتنی ہی خدمت کرتا ہے جتنی ماہر کی۔
  take_title: اسے بنانے میں حصہ لیں
  take_body: مواد اور کوڈ سب کے لیے کھلے ہیں۔ آپ ریپوزیٹری پڑھ سکتے ہیں، غلطی کی اطلاع دے سکتے ہیں، نیا اندراج تجویز کر سکتے ہیں، یا کسی دوسری زبان میں ترجمہ کی درخواست
    کر سکتے ہیں۔
  take_repo: گٹ ہب پر ریپوزیٹری
  take_suggest: اندراج یا تصحیح تجویز کریں
