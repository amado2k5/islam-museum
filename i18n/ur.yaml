  method_note: "یہاں ہر ریکارڈ عجائب گھر کا عام ریکارڈ ہے — اپنے مآخذ اور تین زبانوں کے نثر سمیت. عبادات اور اذکار تعمیر کے وقت مقاطع کے متون پر محروس لغت سے پائے جاتے ہیں: نماز، رکوع اور سجود کی اصطلاحات، وضو، غسل اور تیمم، روزہ، افطار، سحور اور اعتکاف، زکات اور صدقہ، حج، عمرہ، طواف، سعی، احرام، عرفہ اور مناسک، اللہ کا ذکر، تسبیح، تحمید، تہلیل، تکبیر، استغفار، درود، حوقلہ اور بسملہ، دعا متصفح الادعیہ کی اپنی لغت سے، تلاوت اور ترتیب، توبہ اور انابت، اور رقیہ؛ غیر اللہ کی عبادت «يعبدون الأصنام» اور «احتجّ» کے دلیل کا معنیٰ خارج ہیں، مستند جھوٹے مثبتیے شناخت سے مستثنیٰ ہیں، اور بعد میں کٹائی گئی ہر کتاب اپنے مقاطع کے اترتے ہی اپنی عبادات یہاں خودکار لے آتی ہے؛ منتخب ریکارڈ ibadat-browser ٹیگ سے شامل ہوتے ہیں. ہر مقطع «عمل» ہوتا ہے جب وہ عبادہ ادا کرتا یا حکم دیتا ہے اور «ذکر» جب وہ صرف اس کے بارے میں ہوتا ہے."
