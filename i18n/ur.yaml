  section_ledes:
    web: 'مسلمانوں کی بنائی ہوئی یا اسلام کے بارے میں ویب سائٹس، پورٹل، فورم، ڈیجیٹل کتب خانے، ایپس، گیمز اور آلات، کسی بھی زبان میں۔'
    music: 'نشید، قوالی، نعت، الٰہی اور انشاد کے البم، گیت اور فنکار، اور ہر مسلمان کا اسلام یا دین پر گیت، اعزازات اور تاریخ والی رسائی کے ساتھ۔'
    film: '۱۹۷۶ء کے بعد اسلام پر بنی فلمیں، دستاویزی فلمیں، مختصر فلمیں اور اینیمیشن، اسکریننگ روم سے۔'
    tv: '۱۹۷۶ء کے بعد اسلام پر ڈرامے، پروگرام اور رمضان کے سیزن، اسکریننگ روم سے۔'
    conferences: 'باقاعدہ کانفرنسیں، کنونشن، سربراہی اجلاس اور اجتماعات، ان کے ادوار کے ساتھ۔'
    heritage: 'ورثے کے مہینے اور دن، میلے، یادگاریں اور اجتماعات۔'
    rights: 'اسلام کے دفاع اور اسلاموفوبیا کے خلاف احتجاج، اور وہ واقعات، قوانین، فیصلے اور رپورٹیں جن کا یہ جواب ہیں؛ اختلاف پر دو آوازیں، کوئی فیصلہ نہیں۔'
    books: '۱۹۷۶ء کے بعد اسلام پر اور مسلمان لکھنے والوں کی کتابیں، ان کے ناشر، کتب فروش، میلے اور انعامات۔'
    upcoming: 'جو اعلان شدہ ہے مگر ابھی ہوا نہیں: زیرِ تعمیر عمارتیں، زیرِ پروڈکشن فلمیں، طے شدہ کانفرنسیں اور مقابلے، اعلان شدہ کتابیں اور البم۔'
    figures: 'گزشتہ پچاس برس کے مسلمان شعبے کے لحاظ سے: علما اور مبلغین، سیاست، سفارت کاری، مالیات، سائنس، طب، جامعہ، تعلیم، تحریر، فنون، میڈیا اور تخلیق کار، سماجی سرگرمی، کھیل۔'
    organizations: 'ملک کے لحاظ سے، عالمی اور آن لائن مسلم تنظیمیں: کونسلیں، خیراتی ادارے، طلبہ و پیشہ ورانہ تنظیمیں، دعوت، بین المذاہب، تھنک ٹینک اور آن لائن برادریاں۔'
    media: 'اسلام اور مسلمانوں کے بارے میں اخبارات، رسالے، نیوز لیٹر، خبری ویب سائٹس، ٹی وی چینل، ریڈیو اسٹیشن، چینل اور پوڈکاسٹ۔'
    sports: 'کھیل میں مسلمان: کھلاڑی، ٹیمیں، ٹورنامنٹ، نتائج اور اولیات۔'
    awards: 'ایوارڈ، انعامات، تمغے، درجہ بندیاں اور مقابلے، قرآن کے مقابلوں سمیت، ان کے ادوار اور فاتحین کے ساتھ۔'
    achievements: 'انعام یافتگان، اولیات اور ریکارڈ: نوبل اور دیگر بڑے انعامات، خلانورد، اولمپک اولیات، پہلے عہدے دار۔'
    enterprise: '۱۹۷۶ء کے بعد مسلمانوں کے قائم کردہ یا ملکیتی ہر قسم کے کاروبار: کمپنیاں، صنعتیں، چینز، گروسری، سفر، برانڈ، فیشن، دکانیں، کلینک، فنڈ اور بینک؛ درج شدہ، توثیق شدہ نہیں۔'
    arts: 'خطاطی، بصری فنون، فیشن، کامیڈی، شاعری، تھیٹر، نمائشیں، عجائب گھر اور بینالے۔'
    built: '۱۹۷۶ء کے بعد تعمیر یا مکمل ہونے والی مساجد، اسلامی مراکز، عجائب گھر اور کیمپس، اور حرمین شریفین کے کام۔'
    learning: 'جامعات، کالج، مدارس، آن لائن اکیڈمیاں، وظائف، تراجم اور ڈیجیٹل کتب خانے۔'
