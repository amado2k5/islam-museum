  method_note: "Every record here is an ordinary museum record with its sources and three-language prose. Motherhood mentions are found at build time by a guarded lexicon over the passage texts in six families: the mother and her standing ⁦(أمه، أمها، أمهات، والدة، أمومة، أمهات المؤمنين)⁩, pregnancy ⁦(حامل، حوامل، حملت، وهن على وهن)⁩, childbirth ⁦(ولادة، ولدت، تلد، مولود، وضعت، مخاض، نفاس)⁩, nursing ⁦(رضاعة، أرضعت، مرضعة، رضيع، فطام، فصال)⁩, custody and raising ⁦(حضانة، حاضنة، تربية، فلذة، كفالة اليتيم)⁩ and dutifulness to parents ⁦(بر، إحسان، صلة الرحم)⁩. The ambiguous words are guarded: bare «أم» counts only beside family vocabulary ⁦(أم القرى and أم الكتاب excluded)⁩, «حمل» counts in the pregnancy sense only beside pregnancy vocabulary (carrying and transport excluded), «ولد» the boy is out and only the birth forms count, «بر» counts only beside parent vocabulary ⁦(برّ the land excluded)⁩, and verified false positives are excluded by id. Every book harvested later brings its motherhood mentions here automatically; curated records join through the umuma-browser tag; the mothers on record are read from the graph's own child_of edges to female parents."
