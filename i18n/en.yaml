juha:
  title: "Juha and Islamic Folklore Browser"
  full_title: "Browser of Juha, Islamic folklore through the ages, comedy, jokes, witty tales and anecdotes"
  lede: "Everything the museum holds on Juha and Islamic folklore through the ages, comedy, jokes, witty tales and anecdotes: the Qur'an's verses on laughter, smiling and the ban on mockery; the Prophet's jesting and laughter and the limits of the joke in the Sunnah; the playfulness of the Companions and Successors in the seerah and the biographies; Juha's anecdotes one by one; and the reports of wits, fools, misers and party-crashers in the books of adab and history."
  badge: "The gathering of anecdotes"
  status: "This build holds {n} records in {s} sections; the texts are drafts a reader can check against the sources named on each record."
  method_title: "The browser's method"
  method_note: "Every record here is an ordinary museum record with its sources and its five-language text. Passages are found at build time by a guarded detector over the passage texts: Juha's name as a whole word, the named wits such as Ash'ab, Nu'ayman, Muzabbid and Habannaqa, the words for anecdotes and witty tales, the verbs of jesting and banter, the words for laughter and smiling, and the texts on the ethics of the joke. The legal 'rare case', the book title al-Nawadir wa-l-Ziyadat, 'the blink of an eye', the names al-Dahhak and Ibn Mughaffal and the grammarians' adverb stay out. Every book harvested later brings its passages here automatically the day they land in the graph, and curated records join through the juha-browser tag. Juha's anecdotes are retold in the museum's own words from a machine-read scan, and the translations are machine translations no human has read."
  api: "The whole set is available at"
  sections_title: "The browser's sections"
  kinds_title: "Kind of humour"
  all_kinds: "All kinds"
  filter_label: "Search the anecdotes"
  filter_none: "No matches."
  empty: "No records in this build yet."
  majlis_title: "The gathering of the wits"
  majlis_note: "The tellers and heroes of the anecdotes whom the sources name: Juha first, then those beside him in the books of adab and hadith. Each seat opens its full cited record."
  tales_title: "From Juha's anecdotes"
  tales_note: "Anecdotes from Nawadir Juha al-Kubra retold in the museum's own words; each bubble opens the anecdote's record with its page number and excerpt."
  scale_title: "The scale of laughter"
  scale_note: "What kinds of humour each section carries: a bar is as long as its number of records and coloured by kind, from the same rows the lists below show."
  scale_caption: "Number of records in each section by kind of humour"
  scale_total: "Total"
  shelf_title: "The shelf of anecdote books"
  shelf_note: "The books that gathered the anecdotes, the witty tales and the reports of wits and fools; each has its record."
  rider_alt: "Drawing: Juha riding his donkey backwards"
