      desc: "The verses that multiply a good deed and repay a bad deed with its like, remit and exchange bad deeds, and speak of the noble scribes, the record that leaves out nothing small or great, the scales of justice, the atom's weight and the swiftness of the reckoning."
    sunnah:
      title: In the Sunnah
      desc: "The hadiths of the two Sahihs, the Sunan and the Muwatta: the hadith qudsi on the writing of good and bad deeds, the figures for remembrance, recitation and prayer, the expiations of sins, the qirat and the ranks, the bankrupt, and the first thing a servant is reckoned for."
