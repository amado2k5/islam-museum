    dress: { title: "Dress and adornment", desc: "Silk and gold, rings, garments, vessels of gold and silver, and altering the body." }
    life-honour: { title: "Life, property and honour", desc: "The inviolability of a Muslim's blood, property and honour, and the life God made sacred." }
