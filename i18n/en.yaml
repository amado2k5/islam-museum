ubuwwa:
  title: "Fatherhood in Islam Browser"
  lede: "The father and fatherhood in the museum's sources: the fathers of the Qur'an — Ibrahim and his du'a, Ya'qub and Yusuf, Luqman's counsel to his son, Zakariyya's prayer, 'Imran's house — dutifulness to the parents (birr al-walidayn) and the warning of 'uquq, the Prophet as a father with his children and grandchildren, paternity and lineage (nasab), the fathers' testaments and raising of children, and the orphan whose father is lost — in the Qur'an, the two Sahihs, the Muwatta and the Sunan, the seerah books, the reports of the Companions and the Successors, and every harvested book — sourced records that grow as new texts land."
  badge: Fatherhood explorer
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: The browser's method
  method_note: "Every record here is an ordinary museum record — with its sources and its three-language prose. Fatherhood mentions are found at build time by a guarded lexicon over the passage texts in five families: the father himself ⁦(أبوة، أبوه، أبيه، أبونا، آباء، والده، يا أبت)⁩, dutifulness and disobedience to the parents ⁦(بر الوالدين، بالوالدين إحساناً، عقوق، رضا الوالدين)⁩, raising and counsel ⁦(لقمان، يا بني، تربية، وصية أبيه، علموا أولادكم)⁩, paternity and lineage ⁦(نسب، انتساب، ادعاء، الولد للفراش)⁩, and the orphan ⁦(يتيم، يتامى، كفالة اليتيم)⁩. The ambiguous words are guarded: the kunya «أبو فلان» names a man and reports no fatherhood, so bare «أبو» never counts — only possessed, plural and vocative father forms; child vocabulary counts only beside a father word in the same window ⁦(God's «يا بني آدم» drops out)⁩; and verified false positives are excluded by id. Every book harvested later brings its fatherhood mentions here automatically, and curated records join through the ubuwwa-browser tag. The famous fathers are read from the graph's own parent_of and child_of edges."
