  badge: In the making
  lede: The museum is big and you may not know where to start. Tour / Learn offers short, ordered pathways, each with a clear goal, that take you step by step through the museum's own pages, or show you the whole route at once.
  status: This section is being built. We have opened five trial pathways so you can see the idea, and we are preparing a list of the 300 best pathways anyone can follow, opening each as its entries are ready. The rest of the museum stays as it is.
  available_title: Pathways you can try now
  available_note: Five trial pathways built on the museum's current pages. Their final form, with a step-by-step view and a whole-route view, comes at a later point in the plan.
