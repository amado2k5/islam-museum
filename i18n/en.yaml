    sunnah:
      title: "In the Sunnah"
      desc: "The reports of the Book of Medicine and the Book of the Sick in the two Sahihs, the Sunan and the Muwatta: a remedy for every disease; cupping, honey and cautery; black seed, costus, talbina, truffles and 'ajwa dates; ruqya; fever, plague, contagion and the leper; visiting the sick; the treatment of the wounded; and the prohibition of treatment with what is forbidden."
    seerah:
      title: "In the seerah"
      desc: "What the seerah and dala'il books carry: the chapters on prophetic medicine in Ibn al-Qayyim's Zad al-Ma'ad, the reports of the Prophet's illness, the opening of the chest, the poisoned sheep at Khaybar, and the care of the wounded on the expeditions — this section fills itself as new seerah texts land."
