authenticity:
  title: How we decide what to show
  lede: The museum admits only material that is genuine to its title, author, source and claimed identity. This page says how, and what the gate does not do.
  updated: These rules are dated 25 October 2026. They are published as the museum's authenticity policy.
  admit_title: What we admit
  admit_body: Each book, article, image or artefact is admitted, labelled or refused as a whole. The gate asks whether the item is what its title and author say it
    is, and whether the copy comes from the edition or institution it names.
  check_title: What the gate checks
  check_body: Who wrote the item, and whether the author's school is verified from named sources. Whether the copy is a real, identified edition or a catalogued institutional
    copy. Where it came from, and whether that place appears on a known spam or phishing list.
  not_title: What the gate does not check
  not_body: It does not check whether each statement in a work is true, and it does not change what the work says. Summaries are written with AI and labelled as such.
    They are not checked line by line.
  decisions_title: Three decisions
  decisions_body: 'Accept: a verified Sunni author and a validated copy. Label: a genuine copy shown with its school, or with ''school not verified''. Reject: a copy
    that cannot be validated, or that comes from a blocked source.'
  c_region: "Region"
  c_capital_l: "Capital"
  c_count: "countries shown"
  sources_title: Sources we rely on
  sources_body: Each source is listed in the public register with its tier and status. Wikipedia and Wikidata are pointers, not proof that an item is authentic.
  corrections_title: Corrections
  corrections_body: Report a problem through the issue form. Each report and its outcome is recorded.
  records_title: What we keep for each book
  records_body: 'For each harvested book we keep a record: its title, its author and the author''s dates, the era it belongs to, the decision and who made it, the
    checks made and their results, and a SHA-256 fingerprint of each harvested file, so that a copy can later be shown to be unchanged. The record holds no book text.
    The records are published in the repository.'
  rules_title: Where the rules live
  rules_body: 'The rules are in the public repository: the policy, the register, the validator and the harvest gate. Anyone can read them and check them.'
privacy:
  title: Privacy and data
  lede: No accounts, no cookies, no tracking, no ads. This page explains what happens when you visit the museum, and what does not.
  updated: 'Last updated: 17 October 2026'
  summary_title: In short
  summary_1: The museum is static files, read the way a page of a book is read. No server runs when you visit, no database, no AI model, and no code acts on your
    behalf anywhere else.
  summary_2: We ask you for no account, no email and no name. We set no cookies, load no third-party tracking code, show no advertising, and sell or share nothing,
    because we hold nothing about you.
  collect_title: What we do not collect
  collect_body: 'The museum processes no personal data about its visitors: no names, no email addresses, no stored IP addresses, no browsing logs, no device identifiers,
    no profiles. There are no forms that send your data to us, search runs inside your browser on a static index, and fonts, maps and images are served from the site
    itself, not from outside services.'
  device_title: What stays on your own device
  device_body: 'A few preferences are kept in your browser''s own storage (localStorage and sessionStorage) and are never sent anywhere: light or dark theme, the
    typeface, the reading depth, your place in the random walk, and, in the children''s wing, the names a child invents in the games and the stars and scores they
    collect. You can clear them at any time from your browser settings, and the whole site works without them.'
  traffic_title: Counting visits
  traffic_body: 'Visits are counted in the network analytics of Cloudflare, the network that delivers the pages. These analytics run at the network edge, with no
    cookies and no code in the page, and give the museum aggregate figures only: number of requests, countries, most-visited pages. Nothing that identifies a particular
    person reaches us.'
  hosts_title: Who delivers the files
  hosts_body: The pages are delivered through the Cloudflare network; the pages, images, maps, the search index and the open-data files are served from the museum's own storage. Photographs
    of objects from partner museums (the Victoria and Albert Museum, the Metropolitan Museum of Art, the Cleveland Museum of Art, Wikimedia Commons) load from those
    institutions' own servers. Like every service on the internet, these providers need your device's IP address to deliver a file to you, and they process it under
    their own policies. The museum does not receive or keep that data.
  contact_title: When you contact us
  contact_body: If you email us or open a report or a discussion on GitHub, we see what you choose to send and use it only to reply and to correct the content. What
    you write on GitHub is governed by GitHub's terms and privacy statement, and is public unless you choose otherwise.
  people_title: People the museum writes about
  people_body: The museum describes people from history and from the present through published public facts tied to their sources. About the living it records only
    documented public facts, and nobody's religion is inferred or attributed without a stated basis. If you find an error, or something that concerns you personally,
    tell us through the correction form or by email; corrections concerning living people come first.
  kids_title: Children
  kids_body: 'The same rules apply to the children''s wing: no accounts, no data collection, no contact with other parties, no comments and no chat. The names a child
    invents in the games and the stars they collect stay on the device itself.'
  links_title: Links to other sites
  links_body: The museum points to outside sources and references. When you follow them, those sites' policies apply, not ours.
  law_title: Applicable law
  law_body: The museum is operated from the province of Ontario, Canada, and is subject to Canadian federal law and the law of Ontario, including the Personal Information
    Protection and Electronic Documents Act (PIPEDA). Because the museum collects no personal information, it holds nothing about you to disclose, correct or delete;
    we nonetheless answer any question on the matter at our address.
  changes_title: Changes to this page
  changes_body: If anything changes in how the site works, this page is updated first, and the change is recorded in the public repository's history on GitHub, where
    anyone can review what changed and when.
  more_title: Further reading
  more_body: The technical detail is in the architecture document and in architectural decision 0002 (no AI and no compute at runtime), both in the public repository.
  arch_link: Architecture document
  adr_link: Decision 0002
  contact_cta: Email us
  report_cta: Report an error
disclaimer:
  title: Disclaimer
  lede: 'What this museum is, how its content is gathered and checked, what you may and may not take from it, and the terms on which it is offered — in plain language.'
  updated: 'Last updated: 30 October 2026'
  personal_title: A personal project
  personal_1: 'islam.museum is a personal project, created and maintained by an individual in a personal capacity, with personal resources, outside any employment. It is not operated by, affiliated with, or endorsed by any employer, company, institution, government or religious authority; the institutions and people named on the site are named as subjects or sources, not as sponsors. The project intends to incorporate as a non-profit organisation in Ontario, Canada; until that happens it remains a personal project, and this page will be updated when it does.'
  personal_2: 'All opinions and views expressed on this site are solely my own and do not reflect the views or opinions of my employer.'
  purpose_title: Educational purpose
  purpose_body: 'The museum is offered for education, culture and general interest: it presents the history and heritage of Islam from published sources, in Arabic, English and Urdu. It is not a school, university or accredited course, and it awards no certificates or qualifications.'
  accuracy_title: Accuracy, and its limits
  accuracy_1: 'Every entry in the museum is tied to the sources cited on its page, the coverage page shows openly where the record is thin, and errors are corrected when they are found or reported. We work to check facts before publication and to say, on the page, where a claim rests on a single source or is debated.'
  accuracy_2: 'Even so, no guarantee is given that every statement on the site is complete, current or free of error. History contains genuinely contested matters — dates, attributions and narratives differ between sources and traditions — and Hijri–Gregorian date conversions follow standard methods and are approximate for early periods. Treat every page as a sourced starting point, not as the last word.'
  verify_title: Verify before you rely on it
  verify_body: 'Do not rely on the museum''s content as the sole basis for an examination or coursework answer, for a job, academic or media interview, for publication, or for any personal, professional, financial, legal or religious decision. Before relying on anything here, verify it against the sources cited on the page and other authoritative references, and consult qualified teachers, scholars or professionals where the matter calls for them.'
  advice_title: Not rulings, and not professional advice
  advice_body: 'Nothing on this site is a fatwa or a religious ruling, and nothing here is legal, financial, medical or other professional advice. Religious texts and practices are presented from their published sources, following the museum''s editorial method (see "How we decide what to show"); questions of belief and practice should be taken to qualified scholars, and questions in professional fields to qualified practitioners.'
  gathering_title: How the content is gathered
  gathering_1: 'The museum''s content is collected and built from published, publicly available sources: encyclopedias (including Wikipedia), Wikidata, the catalogues and open collections of libraries and museums, and published books and scholarship, each recorded in the museum''s source records and cited on the page it supports.'
  gathering_2: 'Artificial-intelligence tools assist in gathering, drafting, structuring and cross-checking material at build time; no AI runs when you visit the site. AI-assisted drafting can introduce errors, and automated collection can misread a source — one more reason the sources are shown on every page and why corrections are welcomed. Selection, emphasis and arrangement are editorial choices, and coverage is uneven by design and by honesty: the museum shows its gaps rather than filling them with invention.'
  children_title: Children and young visitors
  children_1: 'The museum is for all ages, and the children''s wing (Kids'' Wing) is made for children: stories, games and quests, with no accounts, no data collection, no chat and no contact with strangers, as the privacy page explains. Children should explore the museum with a parent, guardian or teacher, who remains responsible for supervising their use and judging what is suitable for them.'
  children_2: 'For parents and teachers: the museum, including the children''s wing, is an aid to learning, not a curriculum and not a substitute for a child''s school materials. Material found here should be checked against the cited sources — with an adult — before it is used in homework or schoolwork, and children should not treat any page as an examination-ready answer without that check.'
  features_title: Interactive features and tools
  features_body: 'The timelines, the date converter, the connections graph, the search, the journeys, the 3D tour and the other interactive features are aids to exploration. Their results are computed from the museum''s underlying data and inherit its limits: a converted date, a graph layout or an "on this day" selection is a presentation of the data, not a new or certified fact. Features may be changed, moved or removed at any time without notice.'
  support_title: Support and donations
  support_body: 'The museum is free for everyone. The support page offers voluntary ways to contribute to its running costs — Patreon, PayPal, LaunchGood and GitHub Sponsors — held in the operator''s personal name until a non-profit organisation is incorporated. Support is optional, buys no access, goods or services, and gives no control over the museum''s content, as the support page states. The museum is not a registered charity and issues no charitable tax receipts.'
  ip_title: Intellectual property and reuse
  ip_body: 'The museum''s data is published under CC0, its prose under CC BY-SA 4.0 and its code under the MIT licence, as the licences page sets out; reuse within those terms is welcome. Images and media that come from partner institutions and other rights-holders remain under their own terms and are credited on the page. The Qur''an text, translations and other quoted works carry the sources and terms noted in the references. Nothing on this page or the site grants any right in third-party material.'
  links_title: Links to other sites
  links_body: 'The museum points to outside sources and references for further reading. Those sites are not under the museum''s control, their content is not endorsed by inclusion, and their own terms and policies apply when you follow them.'
  liability_title: No warranties; liability
  liability_body: 'The site and its content are provided "as is" and "as available", without warranties of any kind, express or implied, including as to accuracy, completeness, fitness for a particular purpose or uninterrupted availability. To the fullest extent permitted by applicable law, the operator accepts no liability for any loss or damage arising from the use of, or reliance on, the site or its content. Nothing in this disclaimer limits any liability that cannot lawfully be limited. The museum is operated from Ontario, Canada, and this disclaimer is governed by the laws of Ontario and the federal laws of Canada applicable in it.'
  changes_title: Changes to this disclaimer
  changes_body: 'This disclaimer may be updated as the museum changes. Updates are posted on this page with a new date, and the full history of the page is kept in the public repository on GitHub, where anyone can review what changed and when.'
  more_title: Corrections and questions
  more_body: 'If you find an error, or anything on the site that concerns you, the fastest route is the correction form; for anything else, email us. Corrections concerning living people come first.'
  contact_cta: Email us
  report_cta: Report an error
accessibility:
  title: 'Accessibility'
  lede: 'The museum is for everyone. This statement explains how the site is built to be used by people who are blind or have low vision, who are Deaf or hard of hearing, who do not speak, and who use a keyboard or other assistive technology, and how to tell us when something does not work.'
  updated: 'Last updated: 25 October 2026'
  commit_title: 'Our commitment'
  commit_body: 'Access to culture is a right of every person, including persons with disabilities (UN Convention on the Rights of Persons with Disabilities, articles 9 and 30). islam.museum is free, has no accounts and no paywall, and is built so that the same pages can be read with the eyes, by ear through a screen reader, and by touch on a refreshable braille display, in Arabic, English and Urdu. We welcome every visitor, of every ability, language and background.'
  status_title: 'Conformance status'
  status_1: 'The museum''s target is the Web Content Accessibility Guidelines (WCAG) 2.2, level AA, published by the World Wide Web Consortium (W3C) and adopted as the international standard ISO/IEC 40500. The site is partially conformant: most pages meet the target, and the known gaps are listed below with the work under way to close them.'
  status_2: 'This assessment is our own (a self-assessment), made with automated checks on every change and with manual testing. An independent audit is planned, and its report will be published on this page.'
  standards_title: 'Standards and laws we follow'
  standards_1: 'International: W3C WCAG 2.2 AA and WAI-ARIA 1.2; the UN Convention on the Rights of Persons with Disabilities; the Marrakesh Treaty on accessible formats for blind and print-disabled readers; the UNESCO 2015 Recommendation on museums and collections and the ICOM museum definition, which call for museums that are accessible and inclusive.'
  standards_2: 'Canada, where the museum is operated: the Accessible Canada Act and the standard CAN/ASC-EN 301 549, and the Accessibility for Ontarians with Disabilities Act (AODA) and its Integrated Accessibility Standards.'
  standards_3: 'United States: the Americans with Disabilities Act (ADA) and Section 508 of the Rehabilitation Act.'
  standards_4: 'European Union and United Kingdom: the European Accessibility Act (Directive 2019/882), the Web Accessibility Directive (2016/2102) and the harmonised standard EN 301 549; the UK Equality Act 2010. This statement follows the European Commission''s model accessibility statement.'
  blind_title: 'Blind and low-vision visitors, screen readers and braille'
  blind_1: 'Every page is real text in a clear structure: one main heading, headings in order, landmarks (header, navigation, main content, footer), a "Skip to content" link as the first item, and lists and tables marked up as such. Screen readers such as NVDA, JAWS, VoiceOver, TalkBack and Orca can read and navigate it.'
  blind_2: 'Braille: the website does not draw braille itself. A screen reader sends the page text to a refreshable braille display, which shows it in braille. For this to work in three languages, every page declares its language and direction, so the screen reader and the braille display switch to Arabic braille, English braille (Unified English Braille) or Urdu braille.'
  blind_3: 'Images carry a text alternative (alt text); decorative patterns and icons are hidden from screen readers so that they do not interrupt reading.'
  blind_4: 'Every page can be read with JavaScript turned off. Interactive features are added on top of the text and never hide it.'
  vision_title: 'Low vision, colour and reading comfort'
  vision_1: 'Text and controls meet the WCAG contrast ratios (4.5:1 for text, 3:1 for large text and borders) in both the light and the dark theme, and colour is never the only way information is given. Pages reflow on small phone screens without sideways scrolling.'
  vision_2: 'From the header you can switch between a light and a dark theme and between two typefaces, and the "Accessibility" menu lets you enlarge the text, widen the line spacing, raise the contrast, stop motion and underline every link. These choices are kept on your device only. The site also follows your device''s light or dark setting, high-contrast (forced colours) mode and reduced-motion setting.'
  deaf_title: 'Deaf and hard-of-hearing visitors'
  deaf_1: 'The museum is written, not spoken: nothing on the site is available only as sound. Where a children''s story offers narration, the full text of the story is printed on the same page above the player, and audio never plays by itself.'
  deaf_2: 'Any audio or video added to the museum must come with captions or a full transcript in Arabic, English and Urdu.'
  deaf_3: 'Sign-language versions of the welcome, the guide to the museum and this statement are planned, signed by Deaf signers in American Sign Language, Quebec Sign Language (LSQ), British Sign Language, International Sign, Arabic sign language and Pakistan Sign Language. They will be added to this page as they are made.'
  speech_title: 'Visitors who do not speak'
  speech_1: 'Nothing on the site needs your voice: there is no voice input, no microphone, no phone line and no spoken test. Every way to reach us is written (email or a form on GitHub).'
  keyboard_title: 'Keyboard, switch and touch'
  keyboard_1: 'Everything can be done with a keyboard alone: Tab and Shift+Tab move between links and buttons, Enter and Space activate them, and Escape closes the phone menu and returns you to the button that opened it. Focus is always visible.'
  keyboard_2: 'Buttons and links are large enough to tap. The children''s games are designed to be played with the keyboard, and there are no time limits on reading.'
  limits_title: 'Known limitations'
  limits_1: 'This is a self-assessment: the site has not yet been audited by an independent accessibility auditor. The audit and its conformance report (ACR/VPAT) are planned.'
  limits_2: 'The interactive map, the knowledge graph and the 3D hall are visual by nature; their text equivalents are being completed and tested with screen readers.'
  limits_3: 'Some citations link to recorded lectures on other sites, which the museum does not control and which may have no transcript. Braille-ready files (BRF) and accessible e-books (EPUB) of the museum''s texts are planned. An easy-read level exists only where a Kids'' Wing version exists; most adult pages do not have one yet.'
  tech_title: 'Technology the site relies on'
  tech_1: 'HTML, CSS and WAI-ARIA, read by any modern browser; JavaScript is optional. The site uses no accessibility overlay or third-party toolbar: such tools add outside scripts and do not make a site accessible, so accessibility is built into the pages themselves.'
  formats_title: 'Other formats'
  formats_body: 'All texts are open (prose CC BY-SA 4.0, data CC0), so they may be converted into braille, large print, audio or any other accessible format and shared freely. If you need a page in another format, write to us and we will help.'
  formats_books_link: 'Download ready-made books: braille files (BRF) and accessible e-books (EPUB 3) for pathways, kids stories and this page'
  feedback_title: 'Tell us about a barrier'
  feedback_1: 'If something on the site does not work for you, or you need information in a different format, tell us. Please say which page (its address), what you were trying to do and, if you wish, which browser and assistive technology you use.'
  feedback_2: 'We reply within five working days and fix barriers as a priority. You can write to us by email or open a public report on GitHub.'
  feedback_cta: 'Email us about accessibility'
  feedback_issue: 'Report an accessibility barrier'
  law_title: 'If you are not satisfied'
  law_body: 'If our reply does not resolve the problem, you may contact the body responsible where you live: in Canada, the Accessibility Commissioner (Canadian Human Rights Commission) or, in Ontario, the Accessibility Directorate of Ontario; in the European Union, the enforcement body of your member state; in the United Kingdom, the Equality Advisory and Support Service; in the United States, the Department of Justice ADA information line.'
  method_title: 'How this statement was prepared'
  method_body: 'This statement was prepared on 25 October 2026 from a self-assessment of the site against WCAG 2.2 AA, with automated checks (a Lighthouse accessibility score of 100 is required on every pull request) and manual review. It is reviewed at least once a year and whenever the site changes in a way that affects access.'
  more_title: 'Further reading'
  more_body: 'The design and accessibility rules that every contributor follows are published in the public repository.'
  more_link_rules: 'Design and accessibility rules'
  ld_summary: 'Text-first page: every visual element has a text equivalent. Keyboard, screen readers and braille displays are supported; no audio, flashing or motion is required.'
volunteer:
  title: "Volunteer with us"
  lede: "islam.museum is free, open and built by people who give their time. Whatever your skill, there is a place for it here."
  about_title: "Why volunteer"
  about_1: "The museum began as one person's project and is growing into a shared one. It takes no money for access, carries no advertising, and gives its data away — so the work of building it is shared the same way: by volunteers."
  about_2: "Every role below is voluntary and unpaid, done in your own time, from wherever you are. Give an hour a month or a day a week; both matter."
  outreach_title: "Outreach"
  outreach_body: "Help the museum reach the people it was built for: schools, libraries, mosques, community groups, journalists and creators — introducing the museum, following up replies, and building relationships in your city or country and your language."
  development_title: "Development"
  development_body: "Help build and maintain the site itself: the open-source codebase, new features, fixes, performance, accessibility and testing — in the open, on GitHub, alongside the museum's other contributors."
  review_title: "Reviewing content"
  review_body: "Help check the museum's entries before and after they are published: facts, dates, sources and translations. Reviewers keep the museum honest — if you read carefully in Arabic, English or Urdu, this is the heart of the work."
  planning_title: "Planning"
  planning_body: "Help decide what the museum builds next: new wings and features, partnerships, programmes and priorities — turning a long list of good ideas into a plan that volunteers can actually carry out."
  education_title: "Education"
  education_body: "Help grow the museum's education section: material for teachers and classrooms, the children's wing, guides, activities and pathways that help students meet Islamic history with curiosity."
  media_title: "Media creation"
  media_body: "Help create the museum's media: video, audio, images and illustrations — including AI-assisted creation — from trailers and narration to artwork for entries and social posts, always to the museum's standards of accuracy and reverence."
  support_title: "Support"
  support_body: "Help the people who use the museum: answering visitors' questions, guiding teachers and partners who write in, and keeping the museum's community channels welcoming and useful."
  join_title: "How to join"
  join_body: "Write to us and tell us your name, where you are, which area (or areas) above interest you, a little about your skills or experience, and roughly how much time you can give. We reply to every message, and we will find the right first task together."

why:
  title: "Why islam.museum?"
  lede: "Why this museum exists, what came before it, and what makes it different — the whole story of Islam as one free, open, sourced museum."
  emblem_alt: 'The museum emblem: a gold eight-point star around a lapis disc with a copper mihrab arch over an open book'
  gap_title: "The gap it fills"
  gap_1: "Islam is fourteen centuries old and is lived today by nearly two billion people, yet for most of that history there was no single place where its whole story could be walked through — freely, openly, and in full. The heritage was never lost; it was fragmented. Its objects sit in a handful of great museums, its scholarship sits behind paywalls and in specialist libraries, and most retellings take one region, one century or one art form at a time."
  gap_2: "A new generation now meets this history first through search results, short videos and feeds — fragments answering fragments. What did not exist was the open reference layer underneath: one sourced, structured, public account of the whole story that anyone could enter, check and build on. islam.museum was built to be that layer."
  before_title: "What came before"
  before_intro: "The museum stands on the shoulders of two centuries of collectors, scholars and builders. Each of these predecessors did one part of the work superbly — and each is partial by design: objects, or scholarship, or one region, one era, one art."
  before_cairo: "Cairo — the Museum of Islamic Art, founded in 1881 under Khedive Tawfiq and opened in 1903 at Bab al-Khalq, is among the oldest and largest museums of Islamic art in the world, holding tens of thousands of objects from across the Islamic lands."
  before_berlin: "Berlin — the Museum of Islamic Art in the Pergamon, founded in 1904 by Wilhelm von Bode, built a great European collection, famous for the Aleppo Room and the facade of Mshatta."
  before_istanbul: "Istanbul — the Museum of Turkish and Islamic Arts, opened in 1914 in the Ibrahim Pasha Palace on the Hippodrome, gathers Turkish and Islamic works from the Anatolian and Ottoman centuries."
  before_encyclopaedia: "Leiden — the Encyclopaedia of Islam, published by Brill since its first edition of 1913–1936 under M. Th. Houtsma and his colleagues, remains the standard scholarly reference on Islam and the Muslim world; it is written for specialists and read behind a paywall."
  before_malaysia: "Kuala Lumpur — the Islamic Arts Museum Malaysia, opened in 1998 by Syed Mokhtar Al-Bukhary's Albukhary Foundation, is Southeast Asia's great museum of Islamic art, its galleries spanning fourteen centuries."
  before_inventions: "Manchester — 1001 Inventions, launched in 2006 by the Foundation for Science, Technology and Civilisation under Professor Salim Al-Hassani, took a beloved touring exhibition around the world — covering one brilliant slice of the story: science and technology."
  before_doha: "Doha — the Museum of Islamic Art, opened in 2008 on its own island in the harbour, was designed by I. M. Pei and is led by Qatar Museums under Sheikha Al Mayassa bint Hamad Al Thani; its galleries hold masterpieces from three continents."
  before_aga_khan: "Toronto — the Aga Khan Museum, opened in 2014 and founded by the Aga Khan IV in a building designed by Fumihiko Maki, presents the arts and cultures of Muslim civilisations to North American audiences."
  before_discover: "Online — Discover Islamic Art, built by Museum With No Frontiers under its founder Eva Schubert and launched in 2005 with European Union Euromed Heritage funding of about €3.1 million, is the closest digital predecessor: some 150 experts in 14 countries catalogued 850 artefacts and 385 monuments. It covers the art and material culture of the Mediterranean, and its story ends in 1922."
  before_libraries: "And the texts live elsewhere again: libraries such as al-Maktaba al-Shamela gather the books; platforms such as Google Arts & Culture host exhibitions lent by many museums."
  before_close: "None of this is a criticism. A museum of objects must choose its objects; an encyclopaedia must choose its readers; an exhibition must choose its theme. But it left a shape of work undone: the whole story, for everyone, in the open."
  before_links: "Visit them:"
  link_doha: "Museum of Islamic Art, Doha"
  link_aga_khan: "Aga Khan Museum"
  link_malaysia: "Islamic Arts Museum Malaysia"
  link_inventions: "1001 Inventions"
  link_discover: "Discover Islamic Art"
  object_alt: "An AI-generated illustration of a Persian brass astrolabe, of the kind the great museums preserve. It is an illustration, not a photograph of an original object."
  object_caption: "The astrolabe — emblem of the object-world the great collections preserve (illustration, from the museum's art wing)."
  diff_title: "What none of them does"
  diff_intro: "No other project we know of combines all of the following in one place. Each point on its own exists somewhere; together they describe a different kind of institution."
  diff_scope: "The whole story, in one graph. Not art alone, not science alone, not one region or dynasty: the faith, its people, places, events, ideas, objects, words and living culture, from the world of 610 to today, across every continent Islam has reached."
  diff_open: "Open, completely. Free to read, with no account and no advertising. The data is published under CC0, the prose under CC BY-SA 4.0 and the code under MIT, with a public API — anyone may reuse the museum, fork it, translate it or build on it."
  diff_language: "Arabic first. The museum is written in Arabic before any other language, with full English and Urdu editions beside it — reversing the usual order, in which this history is written about the Arabic-speaking world in other tongues."
  diff_structure: "A sourced graph, not a pile of pages. Every entry is a node tied to the people, places and events around it, and every claim carries its source, so a reader can check anything and a machine can build on everything. Today the graph holds over 42,000 entries and some 86,000 pages across nine wings, joined by 301 pathways."
  diff_alive: "Alive, not a cabinet. A children's wing, interactive journeys, a timeline explorer, a 3D tour and Hijri calendar tools sit inside the same museum as its scholarship — a seven-year-old and a professor enter through the same door."
  diff_founder: "Built by one person, in the open. islam.museum was founded by Ahmed Abdel Aal, a Canadian of Egyptian origin, and is built with AI assistance at build time under strict sourcing rules — every fact tied to a published source before it ships. The method is not hidden; it is part of the difference, and the whole build happens in a public repository."
  built_title: "How it is built"
  built_1: "The museum is a knowledge graph kept in plain files in a public repository: language-neutral facts in data files, with prose in Arabic, English and Urdu beside them. An entry is published when its claims cite defined sources and its provenance is recorded — that is the museum's whole publication standard, and it applies to the founder and to every contributor alike."
  built_2: "Nothing on the published site is generated when you visit: the pages are static, there is no account system and no tracking, and corrections are made in the open, where the change history is public. The museum's disclaimer explains what it is and is not; its volunteers review, translate and extend it; and its supporters keep it free for everyone else."
  built_repo: "The museum's repository on GitHub"
  forward_title: "Where it goes next"
  forward_1: "The plan is to make the museum permanent and public infrastructure. The project intends to incorporate as a non-profit organisation in Ontario, Canada. Its dataset is deposited under a permanent identifier — the Zenodo DOI below — and its application to the Digital Public Goods Alliance has been submitted and is under review. More languages will join Arabic, English and Urdu, and partnerships with libraries, schools and museums will carry the museum into classrooms and reading rooms."
  forward_2: "The build itself is a template: because the code and the data are open, another community can fork the same machinery to tell the story of its own heritage in the same way. And one commitment does not change with growth: the museum stays free — no paywall, no account wall, no advertising — for the next reader, whoever and wherever they are."
  forward_doi: "10.5281/zenodo.23692511"
  matters_title: "Why it matters"
  matters_1: "Reference layers shape memory. Whoever builds the open, sourced account of a civilisation — the one search engines quote, students cite and machines learn from — shapes how the next century understands it. islam.museum intends that layer, for Islam's fourteen centuries, to be open rather than owned, Arabic-first rather than translated last, and free rather than fenced: built carefully, cited honestly, and given away. It is an invitation as much as a museum."
  matters_visit: "Enter the museum"
  about_title: "Why this museum exists"
  about_body: "What makes islam.museum different from the great museums and references that came before it — and where it is going next — is told on its own page."
  about_link: "Why islam.museum?"

