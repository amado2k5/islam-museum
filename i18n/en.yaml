  lede: "Motherhood in the museum's sources: the mother and her standing and the duty owed to her, pregnancy and childbirth, nursing, the custody and raising of children, and the mothers of prophets, Companions and Tabi'in — in the Qur'an, the two Sahihs, the Muwatta and the Sunan, the seerah books, Companion and Tabi'in reports and every harvested book — records with their sources that grow as each new text lands."
