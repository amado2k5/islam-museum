ahkam:
  title: "Rulings Browser: Obligations, Acts of Obedience, Recommended, Disliked and Forbidden Acts, and Minor Sins"
  lede: "One browser for the degrees of obligation: the obligations (fara'id), the obligation on every person (fard 'ayn) and the obligation on the community (fard kifaya), the acts of obedience, the obligatory (wajibat), the recommended (mustahabbat), the forbidden (muharramat), the disliked (makruhat), the minor sins, and what remains of the scale, the permitted and the concession. It gathers every place these are named in the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors, and the books of usul and fiqh the museum has harvested. The museum describes what the texts and the jurists say; it issues no ruling."
  badge: "Degrees of obligation explorer"
  status: "This build holds {n} records in {s} sections, each cited to its source."
  method_title: "How the browser works"
  method_note: "Every record here is an ordinary museum record with its sources. Qur'an verses come from a reviewed table of the verses whose own wording carries a theme ('prescribed for you', 'an obligation from God', 'obey God', 'forbidden to you', 'no blame on you'); a verse's text is the frozen Tanzil text of its record. Every other passage is found at build time by a guarded word list, so a book harvested later appears here the day its passages land. A bare prohibition ('he forbade') is not classed: whether it is forbidding or dislike is a jurist's reading, so such a report is listed only when its own wording names the degree. Excerpts from scanned books are machine-read and not corrected, and the translations are machine-made and not yet read by a person. Where the schools differ, as on the Hanafi distinction between fard and wajib, the records say so and name each view."
  api: "The full dataset is available at"
  sections_title: "Sections"
  filter_label: "Filter the records"
  filter_none: "No matching results."
  empty: "No records under this theme in this build yet."
  sections:
    quran:
      title: "In the Qur'an"
      desc: "The verses whose wording carries a theme: what is prescribed and ordained, the commands to obey God and His Messenger, what is due from the God-fearing, the voluntary good, what is forbidden, what is hateful, the small faults, and the verses of no blame, permission and ease."
    sunnah:
      title: "In the Sunnah"
      desc: "Hadiths of the two Sahihs, the Sunan and the Muwatta: what God made obligatory and what the Messenger ordained, the voluntary beside the obligatory, 'were it not that I would burden my community', what was disliked, the concessions, the sins held to be slight, and the jurists' remarks the collections carry."
    seerah:
      title: "In the seerah"
      desc: "What the seerah books carry on these themes: the teaching of the delegations, the letters on the obligatory alms, the first obligations and the easing of others."
    books:
      title: "In other books"
      desc: "The books of usul al-fiqh that define the degrees (al-Shafi'i's Risala, al-Juwayni's Burhan, al-Ghazali's Mustasfa, al-Shatibi's Muwafaqat, al-Shawkani's Irshad al-Fuhul), the books of fiqh of the four schools, the hadith commentaries, the reports of the Companions and the Successors, and whatever is harvested next."
    curated:
      title: "Records on the degrees of obligation"
      desc: "The museum's own records on the themes: the five rulings together, the obligation and its two kinds, obedience, the obligatory, the recommended, the forbidden, the disliked, the permitted, the concession and the minor sins."
  topics:
    fard:
      title: "The obligations (al-furud)"
      desc: "Everything in the museum's sources that names an obligation: what God made obligatory, what His Messenger ordained, 'prescribed for you', the fara'id, and the jurists' fard."
      definition: "In the books of usul the fard is, for the majority, another name for the wajib: the act whose doer is praised and whose omitter is blamed. The Hanafis keep fard for what a decisive proof establishes and wajib for what rests on a probable one."
      scope: "Listed here: texts that use the words fard, farida and fara'id, 'God made obligatory', 'made obligatory on', and 'prescribed for you'. The shares of inheritance (also called fara'id), a stipend and a dower 'assigned' are left out."
    fard-ayn:
      title: "The individual obligation (fard 'ayn)"
      desc: "Everything in the museum's sources on the duty each person owes and no one can discharge for another: 'an obligation on every Muslim', 'obligatory on every adult', and the jurists' fard 'ayn."
      definition: "What is asked of every accountable person in his own right, so that one person's doing it does not lift it from another: the five prayers, the fast, the alms, the pilgrimage for whoever is able."
      scope: "Listed here: texts that use the term, and texts that lay a duty 'on every Muslim' or 'on every adult'. The Qur'an does not use the term; the verses of each act are under the obligations."
    fard-kifaya:
      title: "The communal obligation (fard kifaya)"
      desc: "Everything in the museum's sources on the duty that rests on the community: when some carry it out sufficiently the rest are free of blame, and when none does all are at fault."
      definition: "What the Lawgiver wants done without regard to who does it: the funeral prayer, the returning of a greeting, deep study of the religion, jihad when the sufficient number goes out. Al-Shafi'i sets it out in al-Risala from two verses."
      scope: "Listed here: texts that use the term or state its rule ('when some carry it out it falls from the rest'), and the two verses al-Shafi'i reads it from."
    taat:
      title: "The acts of obedience (al-ta'at)"
      desc: "Everything in the museum's sources on obedience to God and His Messenger and on the acts of obedience: 'obey God and obey the Messenger', 'whoever obeys me has obeyed God', 'no obedience in disobedience; obedience is only in what is right'."
      definition: "The texts set obedience against disobedience: 'whoever obeys me has obeyed God, and whoever disobeys me has disobeyed God', and they set its limit: 'obedience is only in what is right'. The browser places it over the two degrees of doing, the obligatory and the recommended."
      scope: "Listed here: texts that command or praise obedience to God and His Messenger and texts that name the acts of obedience. Obedience to those in authority ('hearing and obeying') counts only beside one of these."
    wajib:
      title: "The obligatory acts (al-wajibat)"
      desc: "Everything in the museum's sources that uses the word wajib and its verbs: 'obligatory on', 'it is due from every Muslim', 'had I said yes it would have become obligatory', and the jurists' wujub."
      definition: "The wajib is the act whose doer is praised and whose omitter is blamed (al-Shawkani). It is divided into the specified and the optional, the narrow and the wide in time, and the individual and the communal."
      scope: "Listed here: texts that use wajib, wujub, 'it is obligatory on' and 'a right due from'. 'Paradise became due to him' and a sale 'concluded' are left out."
    mustahabb:
      title: "The recommended acts (al-mustahabbat)"
      desc: "Everything in the museum's sources on what is asked for without being imposed: the mustahabb and the mandub, the nafila and the voluntary act, the emphasised sunnas, and what the Prophet left unimposed for fear of hardship."
      definition: "The mandub is what the Lawgiver asks for without attaching blame to leaving it; its doing is better than its leaving. The jurists call it sunna, mustahabb, nafl and tatawwu', mostly in one sense."
      scope: "Listed here: texts that use these words, texts that say an act is 'not obligatory', and 'were it not that I would burden my community'. The Sunna as a source of law has its own records."
    haram:
      title: "The forbidden acts (al-muharramat)"
      desc: "Everything in the museum's sources that names the forbidden: 'forbidden to you', 'God forbade', 'it is not lawful', the muharramat and the inviolable things of God."
      definition: "The haram, also called the mahzur, is what the Lawgiver asks to be left with a warning of punishment for doing it."
      scope: "Listed here: the same passages the Halal and Haram Browser reads on the unlawful side, with one word list, so the two never disagree. The sanctuary, the state of ihram and the personal name Haram are left out. A bare 'he forbade' is not classed."
    makruh:
      title: "The disliked acts (al-makruhat)"
      desc: "Everything in the museum's sources on what is better left: the makruh and karaha, 'he used to dislike', 'God disliked for you', a prohibition 'not made firm', and what the jurists disliked."
      definition: "The makruh is what the Lawgiver asks to be left without a warning of punishment; leaving it is better than doing it. Al-Ghazali notes the word is also used for the forbidden and for leaving the better course; the Hanafis divide it into what is near the forbidden and what is a mere blemish."
      scope: "Listed here: texts that use makruh and karaha and reports of habitual dislike. Dislike as a feeling ('whoever dislikes meeting God'), coercion and 'for fear that' clauses are left out."
    saghair:
      title: "The minor sins (sagha'ir al-dhunub)"
      desc: "Everything in the museum's sources on the small sins: the lamam, the sins held to be slight, what the prayers and the avoidance of the major sins expiate, and the warning against persisting."
      definition: "The minor sins are those below the major ones; the jurists differ on the line between them. The museum's record sets out the definitions, and the major sins are in the Hudud and Kaba'ir Browser."
      scope: "Listed here: texts that name the small sins, the lamam and the slighted sins, and texts on what is expiated 'so long as the major sins are avoided'. 'The young and the old' is left out."
    mubah:
      title: "And the rest: the permitted and the concession"
      desc: "What remains of the scale: the mubah, the concession (rukhsa) beside the original rule ('azima), 'no blame', 'no harm in it', and what was passed over in silence."
      definition: "The mubah is the act in which the Lawgiver leaves a choice: doing it and leaving it are alike, with no sin in either. The rukhsa is an easing granted for an excuse while the reason for the original rule stands."
      scope: "Listed here: texts that use mubah, ibaha and rukhsa, 'no blame' and 'no harm in it', and 'what He was silent about is pardoned'. The lawful (halal) as such is in the Halal and Haram Browser."
