    ikwha: "Brotherhood"
    muakhat: "The brothering"
    hubb: "Love for God's sake"
    ithar: "Altruism and aid"
    huquq: "The brother's rights"
    tahdhir: "What breaks brotherhood"
  sections:
    quran:
      title: "In the Qur'an"
      desc: "Brotherhood in the Qur'an: 'the believers are but brothers', 'hold fast to the rope of God together and do not divide', 'He united their hearts', 'they prefer others over themselves', the brothers of the prophets and the nations, Moses' sister and brother, Joseph's brothers, and siblings in the rulings and the inheritance."
    sunnah:
      title: "In the Sunnah"
      desc: "Brotherhood in the two Sahihs, the Muwatta and the Sunan: 'be servants of God, brothers', 'a Muslim is a Muslim's brother, he does not wrong him nor fail him', 'whoever attends to his brother's need, God attends to his', 'help your brother, wronging or wronged', 'like a building whose parts brace one another', 'the likeness of the believers in their love and mercy', the six rights of a Muslim, and the estrangement forbidden past three nights."
    seerah:
      title: "In the seerah"
      desc: "What the seerah and history books carry of brothering and brotherhood — the Prophet's pairing of the Emigrants and the Helpers in Anas's house, Abd al-Rahman ibn Awf and Sa'd ibn al-Rabi' sharing half, and the Companions' brotherhood in ease and hardship — filling itself as the seerah passages are harvested."
