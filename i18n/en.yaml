  topics:
    nasab: "Lineage"
    tribes: "Tribes"
    butun: "Tribal subdivisions"
    prophets-tree: "The prophets' tree"
  sections:
    shajara:
      title: "The prophets' and messengers' tree"
      desc: "The links of the Prophet's lineage and the prophets of Ibrahim's progeny: the agreed chain from Abdullah ibn Abd al-Muttalib up to Adnan, the disputed links from Adnan to Ismail, and the Ishaq line to Isa ibn Maryam — every link a cited record with its story."
    tribes:
      title: "The tribes and clans"
      desc: "The Arab tribes and their clans as the genealogy and sira books tell them: Quraysh and its clans Hashim, Umayya, Abd Shams, Makhzum, Zuhra and al-Najjar; Aws and Khazraj; Khuza'a; Tamim, Hawazin, Thaqif, Ghatafan, Hudhayl, Sulaym, Asad, Juhayna, Muzayna, Ghifar, Ashja', al-Azd, Lakhm, Ghassan, Hamdan, Himyar, Madhhij, Quda'a, Tayy, Shayban, Bakr, Taghlib, Abd al-Qays, Kinda, Dabba, Yarbu', Kinana, Murad, Anmar, Abs and Amir; the Jewish tribes of the Hijaz — Nadir, Qaynuqa' and Qurayza; and 'Aad and Thamud of the vanished Arabs."
    peoples:
      title: "The peoples and nations"
      desc: "The peoples and nations as the texts name them: the Arabs, the Ajam, the Persians, the Rum 'the sons of the Yellow', the Habasha, the Copts, the Turks, the Berbers, the Kurds, the Mongols and Banu Isra'il — of whom it was said 'no Arab is better than a non-Arab except by taqwa'."
    butun:
      title: "The butun — tribal subdivisions"
      desc: "The butun of the tribes — the tier below the tribe and above the fakhidh — as the genealogy and sira books enumerate them: the clans of Quraysh — Hashim, al-Muttalib, Abd Manaf, Abd Shams, Abd al-Dar, Makhzum, Jumah, Sahm, Zuhra, Taym, Adi and Umayya; the clans of Aws and Khazraj — al-Najjar, Abd al-Ashhal, Zafar, Haritha, al-Harith, Salima, Zurayq, Bayada, Amr ibn Awf, Khatma, Waqif, Maghala, al-Ajlan, Dubayb, Sa'ida and Salul; and the clans of Hawazin and Qays — Darim, Hanzala, Fazara, Murra, Kilab, Nasr, Jusham, Uqayl and Sa'd ibn Bakr."
    curated:
      title: "Records about genealogy"
      desc: "The genealogy concepts of the scholars: nasab and ansab, the Prophet's lineage in its three parts, the people of genealogy, stopping the lineage at Ma'add, and the joining of lineage in fiqh."
    mentioned:
      title: "The other mentions"
      desc: "Records that joined automatically by being named in the passages or by carrying the browser tag — they land here whenever a new name, tribe or matn appears in a harvested book."
  viz:
    title: "The tree of tribes"
    note: "Tribes, peoples and clans drawn only from the graph's edges: a group hangs under the group it is part of or a member of, or under the group its record names as its founder, and a founding ancestor stands beside the group he founded. {n} of the {t} group records are joined by {e} edges into {r} trees; {u} have no edge to another subject yet and wait below. A circle's size follows the mentions of the subject in the museum's sources (square root, clamped)."
