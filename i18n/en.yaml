    lands: "Where the root stands:"
    see_page: "See the page in the Bulaq scan"
    ayn:
      rule: "Kitab al-Ayn files words by where the letters are made in the mouth, from the throat to the lips, and gathers every permutation of a root in one place."
      lands: "in the book of ayn, the letter of the root made deepest in the throat."
    sihah:
      rule: "al-Sihah makes the last radical of the root the chapter and the first radical the section."
      lands: "chapter ayn, section jim — as the page of the Bulaq printing shows."
