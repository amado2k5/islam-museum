  terms_title: "What do mu'jam and qamus mean?"
  terms_note: "In the old Arabic tradition the word mu'jam did not name a dictionary: it meant a book whose letters carry dots, and the letters of the mu'jam are the dotted letters. The first to give the name to their books were the hadith scholars, who arranged names alphabetically, as in the Mu'jam of the Companions; the great dictionaries such as Kitab al-Ayn and Lisan al-Arab do not use it in their titles until modern times. Qamus meant the ocean and became a general word for a dictionary from al-Fayruzabadi's. After Arabica, the Doha Institute's encyclopaedia."
