learn:
  title: Tour / Learn
  badge: In the making
  lede: The museum is big and you may not know where to start. Tour / Learn offers short, ordered pathways, each with a clear goal, that take you step by step through
    the museum's own pages, or show you the whole route at once.
  status: This section is growing. Around three hundred pathways are drafted on the museum's current pages; the chooser and the step-by-step walk are live, and the
    catalogue review continues. The rest of the museum stays as it is.
  available_title: Pathways you can walk now
  available_note: Walk each pathway step by step, or see the whole route at once. Your progress stays in your browser.
  minutes: min
  steps: steps
  kind_tour: Tour
  kind_lesson: Lesson
  kind_trail: Trail
  offer_title: What you will find here
  offer:
  - 'Choose what you want to understand: a phase of history, a group of personalities, a group of events, an idea, a place, a text or a hard question.'
  - Walk it step by step, or see the whole route at once as a list, a timeline and a map.
  - 'Every pathway states its goal: what you will know, and be able to place, by the end.'
  - 'An honest time for each: ten minutes, half an hour, two hours or a week of evenings.'
  - 'Your progress is kept in your browser only, with no account and no AI answering you: the pathways are written and reviewed.'
  - Every step is a cited page of the museum, with side steps for going deeper or hearing the other view that never block the way.
  kinds_title: Three hundred pathways in preparation
  kinds_note: During planning, AI proposes the list of pathways, then people review and order it. None of that runs while you visit.
  kinds:
  - k: Eras and phases
    n: 40
  - k: Personalities and groups
    n: 55
  - k: Events grouped together
    n: 40
  - k: Ideas, beliefs and practices
    n: 45
  - k: Places and cities
    n: 30
  - k: Texts and sciences
    n: 30
  - k: Art, architecture and objects
    n: 20
  - k: Living culture today
