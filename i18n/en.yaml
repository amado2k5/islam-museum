halal:
  title: "Halal and Haram Browser"
  lede: "Every mention of the lawful and the unlawful in the museum's sources: the verses of permission and prohibition in al-Baqara, al-Ma'ida, al-An'am, al-A'raf and al-Nahl; the hadith «the lawful is clear and the unlawful is clear», «every intoxicant is unlawful» and «it is not lawful for a Muslim» in the two Sahihs, the Muwatta and the Sunan; what the seerah and the reports of the Companions and Successors carry of scruple before the unlawful and the search for lawful earnings; the jurists on what was permitted and what was forbidden; and every mention in a book harvested from now on. The museum describes what the sources say and attributes every view to its holder; it issues no rulings."
  badge: "Halal and haram explorer"
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: "How this browser works"
  method_note: "Every record here is an ordinary museum record, with its sources and trilingual prose. Mentions are found at build time by a guarded lexicon over passage texts: «حلال» and «حرام» in their forms; the verb of permitting with its doer or its beneficiary ⁦(«أحل الله», «أحل لكم», «لا يحل لامرئ»)⁩; the verb of forbidding with its doer or the one forbidden ⁦(«حرم الله», «حرمت عليكم»)⁩; and «التحريم», «المحرمات», «محارم الله» and «الاستحلال». The bare verbs and the neighbouring words — «الطيبات», «الخبائث», «الشبهات», «المباح», «المكروه» — count only beside a strong term. What does not belong is removed before matching: the Sacred Mosque, the Sacred House and the sacred month; the personal name Haram; the state of ihram and leaving it; and «God forbade him to the Fire». A book harvested later shows its mentions here the day its passages land, with no tagging step. Where the jurists differ, each view is given with its holder, and the museum does not choose between them."
  api: "The full set is available at"
  sections_title: "Sections"
  filter_label: "Filter halal and haram mentions"
  filter_none: "No matching results."
  empty: "No halal or haram records in this build yet."
  kinds:
    halal: "the lawful"
    haram: "the unlawful"
    both: "the lawful and the unlawful together"
  sections:
    quran:
      title: "In the Qur'an"
      desc: "The verses of permission and prohibition: the forbidden foods in al-Baqara, al-Ma'ida, al-An'am and al-Nahl; the good things made lawful, the food of the People of the Book and the game of the sea; the women one may not marry in al-Nisa'; the prohibition of usury and of indecencies; and the warning against forbidding what God permitted and against saying «this is lawful and this is unlawful» without knowledge."
    sunnah:
      title: "In the Sunnah"
      desc: "Hadith of the two Sahihs, the Muwatta and the Sunan, with the reports of the Companions and Successors in the two Musannafs and the books of zuhd: «the lawful is clear and the unlawful is clear, and between them are doubtful matters», «every intoxicant is unlawful», «two dead animals and two bloods were made lawful to us», silk and gold forbidden to men, what suckling makes unlawful, and «the whole of a Muslim is inviolable to a Muslim»."
    seerah:
      title: "In the seerah"
      desc: "What the books of seerah, maghazi and dala'il carry on the lawful and the unlawful: the Farewell Sermon on the inviolability of lives and property, the prohibition of wine and of domestic donkeys at Khaybar, the sanctity of Makka declared at the Conquest, and the rulings on spoils — this section fills itself as new seerah text lands."
    books:
      title: "In the other books"
      desc: "Mentions of the lawful and the unlawful in every harvested work other than the Qur'an, hadith and seerah: the biographies of the Companions and Successors and the accounts of their scruple in the Hilya, Sifat al-Safwa and Hayat al-Sahaba; the fiqh books — al-Mughni, the Mudawwana, Bidayat al-Mujtahid, Fiqh al-Sunna and the Kuwaiti Encyclopaedia; the Ihya', the Muwafaqat and the commentaries; and what comes after, classified by the work's genre the day its passages land."
    curated:
      title: "Records about halal and haram"
      desc: "The museum's detailed records on the subject itself: the lawful, the unlawful and the doubtful; the presumption of permissibility; who may declare lawful and unlawful; the good and the foul; forbidden foods and drinks; necessity; scruple; lawful earnings; and the accounts of the Companions and Successors seeking the lawful."
  subjects_ui:
    title: "Browse by subject"
    note: "Choose what you are asking about. Each subject opens with the museum's own records and the Qur'an's ayahs, then the hadith reports, the seerah and the other books. The museum shows what the sources say and where they say it; it does not issue rulings, and a ruling on a personal case is a scholar's task, not the museum's."
    region: "Twelve subjects of the lawful and the unlawful, each with the number of its records and how many name the lawful, the unlawful or both"
    count: "{n} records"
    bar: "{h} name the lawful, {b} both, {r} the unlawful"
    all: "All subjects"
    crumb: "Subjects"
    status: "{n} records stand under this subject: {c} detailed records, {q} Qur'an ayahs, {s} Sunnah reports, {r} seerah excerpts and {b} excerpts from other books."
    how_title: "How a record gets its subject"
    how: "Subjects are assigned when the site is built, by a word list read over each passage: the words for foods, drinks, sales, marriage and the rest. A passage can stand under several subjects. The list can miss a passage or include one that only mentions the word in passing; passages no subject word matched are under «Other mentions». The subject says what the source speaks about and is never a ruling."
