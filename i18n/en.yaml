      desc: "The verses of the People of the House in purification and the mubahala, the verses of his wives in Surat al-Ahzab, the Sawda verse and the rest — each ayah with its source."
    sunnah:
      title: In the Sunnah
      desc: "The hadiths of the Two Weighty Things, the Cloak, Ghadir, Fadak and Fatima's inheritance in the two Sahihs, the Muwatta, the Forty and the Sunan — each report with its source."
    seerah:
      title: In the seerah
      desc: "What the seerah and maghazi books carry about the People of the House, Banu Hashim, the Prophet's wives and his children — this section fills itself as new seerah text lands."
    books:
      title: In other books
      desc: "Every mention of the Prophet's household in poetry, history, fiqh and every harvested work outside the Qur'an, the hadith and the seerah."
    ahl:
      title: The household and the clan
      desc: "The museum's curated records on the family's members: Fatima, Ali, Hasan, Husayn, Khadija, the daughters and wives, Banu Hashim, Banu Abd al-Muttalib, the grandfather and the uncles."
    mawaqif:
      title: Episodes and events
      desc: "The episodes and stories tied to the household: Ghadir Khumm, the Cloak, the mubahala, Fadak, Fatima's inheritance, Karbala and Ali's bay'ah."
