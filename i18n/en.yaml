i3lam:
  title: "The Muslim Media-Makers Browser"
  lede: "Every mention of the people who carried the word — from the muezzin who called the adhan to the herald of the markets, the khatib on the minbar, the spokesman of the caliph and the envoy of the Prophet, the katib of revelation and of the chancery, the journalist of the new press, the broadcaster and the influencer, the reformer and the revolutionary — in the Qur'an, the Sunnah, the seerah, the reports of the Companions and Successors, and every book harvested into the museum, now and in the future."
  badge: The media-makers explorer
  status: "This build holds {n} people across {j} media roles and {f} mentioning passages in {s} corpora; texts are drafts until a person reads them."
  method_title: How the browser works
  method_note: "Every record here is an ordinary museum record with its sources and trilingual prose. A person joins a role only through an occupations entry on their own record — nothing is inferred. A passage joins the feed when the graph already records a mentions edge from it to one of those people or to a media job, or when the record carries the i3lam-browser tag — so a mention in a book harvested later appears here the day its passage lands, with no edit to this page. Each passage is labelled with its corpus (Qur'an / Sunnah / seerah / books)."
  requirements: "The original requirement and acceptance criteria for this browser are filed at"
  wire_title: "The wire — from the minaret to the feed"
  wire_aria: "A diagram of the media chain: each role a station on a transmission line, its ring sized by the number of recorded holders."
  wire_note: "Each ring is a station on the line and its radius follows the count of recorded holders: the muezzin's call becomes the herald's cry, the sermon, the envoy's word, the scribe's page, the press, the broadcast and the revolt."
  holders: "{n} recorded"
  quran_title: "In the Qur'an"
  quran_note: "The fixed anchors of the scope in the revealed text — shown by frozen passage reference, never retyped."
  anchors:
    poets: "The poets 'followed by the heedless' — the earliest verse on who commands an audience, and its exemption for those who believe and warn."
    news: "When news of security or fear reaches them they spread it — the Qur'an's own rule for how a report is handled before it is broadcast."
    adhan: "Do not take the call to prayer as mockery and play — the verse that binds the muezzin's call to sanctity."
    jumua: "The call on the day of gathering: leave trade and hasten to the remembrance — the summons that founded the khatib's hour."
    herald: "We sent you as witness, bringer of good news and warner — the prophetic commission every herald and spokesman after him imitates."
    proclamation: "The proclamation from God and His messenger to the people on the day of the greater pilgrimage — the model of public announcement."
    caller: "The caller and the listeners: the Qur'anic scene of a voice that carries a message through the crowd."
  chain_title: "The media-makers — the people who carried the word"
  chain_note: "Every role below is a museum job record; every card a person whose own record holds an occupations entry for it, ordered by date where the graph knows one."
  mentioned_in: "mentioned in {n} passages"
  no_holders: "No recorded holders in this build yet."
  state_title: "The state speaks"
  state_note: "The offices the media chain served: the caliphs, sultans and kings whose word the spokesman, herald and envoy carried, and the viziers, judges, governors and postmasters through whom the state addressed its subjects. These are the institution's voices; the chain above is its media."
  feed_title: "Every mention in the sources"
  feed_note: "Every passage the graph already ties to a media-maker or media job, classified by corpus — this stream grows automatically whenever a newly harvested book's passages land in the graph or a record is tagged i3lam-browser."
  feed_more: "and {n} more in this corpus."
  feed_empty: "No mentioning passages in this build yet — they will appear here as harvested books land."
  corpora:
    quran:
      title: "Qur'an"
      note: "The frozen Tanzil text, reached by passage reference only."
    sunnah:
      title: "Sunnah"
      note: "Reports from the hadith collections."
    seerah:
      title: "Seerah"
      note: "Reports from the sira and maghazi literature."
    books:
      title: "Other books"
      note: "Every other harvested book in the corpus."
  tagged_title: "Records tagged to this browser"
  tagged_note: "Any record carrying the i3lam-browser tag joins here automatically — this is how future harvested material surfaces."

heroes:
  title: "Heroes of Islam"
  lede: "Men and women who went out of their way and gave much for others: six halls of virtue, four heroes in each, every story complete with its source."
  status: "Heroes in these halls: {n} across {trails} trails. Every name opens the hero's record; every hall opens its full story."
  trail_link: "Walk the hall's full story ({n} heroes)"
  record_link: "Open the record"
  note_title: "About these halls"
  note_body: "The heroes here are people of documented stands, not idealised icons: every story sits in its record with its source, and where reports differ that is said in the researcher notes. The halls grow as more stories are completed in the museum."
  virtues:
    sacrifice:
      name: "Hall of Sacrifice"
      lede: "They gave themselves and their ease for people they never met: the first martyr, the flag-bearer, the shield of Uhud, and the leader to the spears."
    courage:
      name: "Hall of Courage"
      lede: "Measured firmness when heart and foot advance together: the knight of the bed, the sword of the battlefields, the knight of Hattin, and the sheikh of the desert."
    mercy:
      name: "Hall of Mercy"
      lede: "Mercy as a form of strength: the preacher of hearts, the mother of the captives, the sultan of the house of justice, and the exile who shielded his neighbours."
    generosity:
      name: "Hall of Generosity"
      lede: "A whole fortune turned into public good: Abd al-Rahman's caravans, Uthman's well, Khadija's wealth, and Fatima's endowment."
    knowledge:
      name: "Hall of Knowledge"
      lede: "They carried knowledge as a trust and paid their lives for it: the founder of legal theory, the steadfast of the inquisition, Basra's knower, and the tongue of truth."
    steadfastness:
      name: "Hall of Steadfastness"
      lede: "The world shook and they did not move: 'One, One' beneath the boulder, the longest road to truth, the day the ummah shook, and the unafraid word."
ritha:
  title: "Elegy and Death-Announcement Browser"
  lede: "Everything said in elegy and death announcement in the museum's sources: the verses of patience and the istirja', the Prophet's words at the death of his son and grandson and of the Companions he lost, his announcement of the Negus and of Ja'far, Zayd and Ibn Rawaha, the Companions' condolences to one another, the elegies of Hassan, Ka'b ibn Malik, al-Khansa' and Labid, the reports of the Companions and Successors at the death of those they loved, and the words in the harvested books — whatever is harvested later joins automatically."
  badge: "Elegy and announcement explorer"
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: "The browser's method"
  method_note: "Every record here is an ordinary museum record, with its sources and its five-language text. Passages are found at build time by a guarded detector over the passage texts: the words for elegy and the elegy poem, for the death announcement and the announcer, for condolence, the fixed formulas such as the istirja', «to God belongs what He took and what He gave» and «patience is at the first blow», the words of wailing, and weeping only when it stands near a death. Qur'an verses come from a reviewed table, not a lexicon. «Na't» the description, «'azahu ila» in source attribution, «waritha» in inheritance and weeping out of awe of God stay out, verified false positives are excluded by id, every book harvested later brings its passages here automatically, and curated records join through the ritha-browser tag. Each passage is classed as an elegy, a death announcement, a condolence, or weeping and wailing."
  api: "The whole set is available at"
  sections_title: "The browser's sections"
  kinds_title: "Kind"
  all_kinds: "All kinds"
  formulas_title: "The famous words and formulas"
  formulas_note: "The fixed words the community knows at a death; each card opens the shortest passage that carries it, with how many were found in the sources."
  formula_count: "{n} in the sources"
  filter_label: "Filter records"
  filter_none: "No matches."
  empty: "No records in this build yet."
  kinds:
    ritha:
      title: "Elegy"
      ar: "رثاء"
      desc: "Praise of the dead and the recounting of his virtues, in verse and prose, and the elegies of the Companions and poets."
    nay:
      title: "Death announcement"
      ar: "نعي"
      desc: "Telling the people of a death, such as the Prophet's announcement of Ja'far, Zayd, Ibn Rawaha and the Negus."
    taziya:
      title: "Condolence"
      ar: "تعزية"
      desc: "Consoling and steadying the bereaved, the istirja', «to God belongs what He took and what He gave», and food for the family of the dead."
    bukaa:
      title: "Weeping and wailing"
      ar: "بكاء ونياحة"
      desc: "The tears of the eye and the sorrow of the heart that are permitted, and the prohibition of wailing, slapping the cheeks and tearing the garments."
  sections:
    quran:
      title: "In the Qur'an"
      desc: "The verses of patience and the istirja' and every death the Qur'an mentions: the trial of the believers, Ya'qub's grief, every soul tasting death, the description of the martyrs and the soul at peace."
    sunnah:
      title: "In the Sunnah"
      desc: "What the two Sahihs, the Muwatta and the Sunan carry: the announcement of the Negus and Ja'far, the condolence to the Prophet's daughter, his weeping over his son, the prohibition of wailing and the people's praise at a funeral — every report with its source and number."
    seerah:
      title: "In the seerah"
      desc: "What the seerah books carry: the Prophet's death and the Companions' weeping, Hassan's elegies for the Prophet, Hamza and the martyrs of Mu'ta and Bir Ma'una, and the announcement of Zayd, Ja'far and Ibn Rawaha; this section fills as new seerah texts are harvested."
    books:
      title: "In the other books"
      desc: "The reports of the Companions, the Successors, the historians and the litterateurs: the condolences of Umar and Mu'awiya, the elegies of the poets, the weeping of Abu Bakr and Umar, and the announcement of the caliphs and scholars in the community's histories — classified the day their passages arrive."
    curated:
      title: "The curated records"
      desc: "The museum's own records on elegy, announcement, condolence and wailing, and on the events and poems tied to them: Hassan's elegy for the Prophet, the elegies of the martyrs of Mu'ta, the Prophet's grief over Ja'far, and the death of Ibrahim."
  formulas:
    istirja:
      title: "The istirja' at a loss"
      note: "The phrase the afflicted say, and Umm Salama's supplication after it."
    lillah_ma_akhadh:
      title: "«To God belongs what He took and what He gave»"
      note: "What the Prophet sent to his daughter as her child lay dying."
    sadma_ula:
      title: "«Patience is at the first blow»"
      note: "The Prophet to a woman weeping at a grave."
    ajirni:
      title: "«O God, reward me in my loss»"
      note: "The supplication of the afflicted as Muslim, Malik and al-Tirmidhi relate it."
    ayn_tadma:
      title: "«The eye weeps and the heart grieves»"
      note: "The Prophet at the death of his son Ibrahim."
    ya_abatah:
      title: "«O my father»"
      note: "The words of Fatima on the day the Prophet died."
    man_kana_yabudu:
      title: "«Pure in life and in death»"
      note: "Abu Bakr at the Prophet's side on the day he died, and his address afterwards."
    al_jafar:
      title: "«Make food for Ja'far's family»"
      note: "The sunna of feeding the family of the dead."
    nay_najashi:
      title: "The announcement of the Negus"
      note: "The Prophet announced him the day he died and prayed over him in absence."
    adhkuru_mahasin:
      title: "«Mention the good of your dead»"
