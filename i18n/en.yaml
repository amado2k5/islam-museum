  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: The browser's method
  method_note: "Every record here is an ordinary museum record — with its sources and its three-language prose. Filial mentions are found at build time by a guarded lexicon over the passage texts in six families: sons and daughters ⁦(بنون، بنات، أولاد، ابنه، ابنتها، ولد، أنثى، موءودة)⁩, offspring ⁦(ذرية، نسل، عقب، بني إسرائيل، بني آدم)⁩, filial piety and disobedience ⁦(والدين، أبويه، بر الوالدين، عقوق، لا تقل لهما أف، اخفض جناح الذل)⁩, orphans and suckling ⁦(يتيم، يتامى، رضاعة، مرضعة، فطام، حمل)⁩, the child's rights ⁦(حضانة، عقيقة، تحنيك، تسمية، ميراث beside children vocabulary)⁩, and the sons and daughters of the stories ⁦(غلام، لقمان، الذبيح، ابنا آدم)⁩. The ambiguous words are guarded: bare «ابن» never counts — it stands in every isnad and genealogy — only its possessed relational forms do ⁦(ابنه، ابنتها)⁩, «ميراث» counts only beside children words, and verified false positives are excluded by id; every book harvested later brings its filial reports here automatically when its passages land in the graph, and curated records join through the bunuwwa-browser tag. The famous parents and children are read from the graph's own child_of edges."
