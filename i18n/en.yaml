ukhuwwa:
  title: "Brotherhood in Islam Browser"
  lede: "Brotherhood and sisterhood in Islam in the museum's sources: the brotherhood of the believers — 'the believers are but brothers', 'a Muslim is a Muslim's brother' — the brothers and sisters themselves, the Prophet's pairing of the Emigrants and the Helpers and every pairing among the Companions and the Successors, love for God's sake and loving one another in Him, altruism and coming to a brother's aid and need, the rights a Muslim owes a brother — visiting the sick, blessing the sneezer, answering the invitation, returning the greeting — and what severs brotherhood: envy, mutual hatred, estrangement, suspicion and backbiting — in the Qur'an, the two Sahihs, the Muwatta and the Sunan, the seerah books, the reports of the Companions and the Successors, and every harvested book — sourced records that grow as new texts land."
  badge: Brotherhood in Islam explorer
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: The browser's method
  method_note: "Every record here is an ordinary museum record — with its sources and its three-language prose. Brotherhood mentions are found at build time by a guarded lexicon over the passage texts in six families: the brothers and sisters ⁦(أخوة، إخوة، إخوان، أخوات، المؤمنون إخوة، المسلم أخو المسلم)⁩, the brothering ⁦(آخى، يؤاخي، مؤاخاة، الإخاء، the Emigrants and Helpers beside a brother word)⁩, love for God's sake ⁦(أحب في الله، الحب في الله، تحابوا، متحابين، يحب لأخيه)⁩, altruism and aid ⁦(يؤثرون، إيثار، انصر أخاك، في حاجة أخيه، كالبنيان، كالجسد)⁩, the brother's rights ⁦(حق أخيه، حق المسلم على المسلم، عيادة المريض، تشميت العاطس، إجابة الدعوة، رد السلام)⁩ and the warnings against breaking brotherhood ⁦(تحاسدوا، تباغضوا، هجران، ظن السوء، غيبة الأخ)⁩. The ambiguous words are guarded: bare «أخ» counts only possessed or in a defined construct, «عن أخيه» in a pure isnad does not count unless another brother word stands in the passage, «عيادة/تشميت» count only beside the rights context, «حسد/غيبة/هجر» only beside a brother word, and verified false positives are excluded by id; every book harvested later brings its brotherhood reports here automatically when its passages land in the graph, and curated records join through the ukhuwwa-browser tag. The siblings on record are read from the graph's own sibling_of edges."
  api: "The whole set is available at"
  sections_title: The browser's sections
  pairs_title: "The siblings on record"
  pairs_desc: "Brothers and sisters from the museum's own graph: every record joined to its sibling by a cited sibling_of edge — the brothers and sisters of the Companions and the Successors, of the Prophet's household, of commanders and scholars."
  filter_label: Filter brotherhood records
  filter_none: No matches.
  empty: No brotherhood records in this build yet.
