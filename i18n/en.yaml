madhahib:
  also_under: "Also under:"
  title: "Four Madhhabs Browser"
  lede: "The four imams — Abu Hanifa, Malik, al-Shafi'i and Ahmad — and the schools they founded, the salaf and tabi'in on whom the fiqh was built, the books that recorded the madhhabs — including the school mutun from the Ajurrumiyya to the Jazariyya and the Shatibiyya — and everything the Sunni books say about them in history, fatwas and legal questions — gathered in one browser with its sources."
