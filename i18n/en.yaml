    juha: "Juha"
    wits: "Wits and fools"
    anecdote: "Anecdote or witty tale"
    jest: "Jesting and banter"
    laughter: "Laughter and smiling"
    ethics: "Ethics of the joke"
  sections:
    curated:
      title: "The curated records"
      desc: "The museum's own records on the subject: Juha, Nasreddin Hoca, Ash'ab and others, the anecdote books, and the concepts of jesting, laughter and the anecdote."
    juha:
      title: "Juha's anecdotes"
      desc: "Juha's anecdotes one by one from Nawadir Juha al-Kubra: the anecdote's title, its retelling in the museum's own words, its page number and an excerpt of at most forty words."
    quran:
      title: "In the Qur'an"
      desc: "The verses on laughter and smiling: the laughter of Abraham's wife, Solomon's smile at the ant's words, 'He it is who makes laugh and weep', the laughing, rejoicing faces, the laughter of the mockers, and the ban on one people mocking another."
    sunnah:
      title: "In the Sunnah"
      desc: "What the two Sahihs, the Muwatta and the Sunan carry of the Prophet's jesting, laughter and smiling, the Companions' playfulness and the warning to whoever lies to make people laugh — every report with its number and source."
    seerah:
      title: "In the seerah"
      desc: "What the seerah and shama'il books carry of jesting, laughter and playfulness; this section fills itself as new seerah texts land."
    books:
      title: "In the other books"
      desc: "Anecdotes, witty tales and reports of wits, fools and misers in the books of adab, history and biography: Nihayat al-Arab, 'Uyun al-Akhbar, al-Mustatraf, al-Bayan wa-l-Tabyin, al-Hayawan and whatever is harvested later."

