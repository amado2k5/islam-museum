  lede: "Every supplication mentioned in the museum's sources: the Qur'anic prayers from Adam's «ربنا» to the Prophet's «اللهم» formulas, the du'as of the two Sahihs, the Muwatta and the Sunan, the supplications of the Companions and the Successors, what the seerah and every harvested book carry — sourced records that grow as new texts land."
