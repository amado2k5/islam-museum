privacy:
  title: Privacy and data
  lede: No accounts, no cookies, no tracking, no ads. This page explains what happens when you visit the museum, and what does not.
  updated: 'Last updated: 17 October 2026'
  summary_title: In short
  summary_1: The museum is static files, read the way a page of a book is read. No server runs when you visit, no database, no AI model, and no code acts on your behalf anywhere else.
  summary_2: We ask you for no account, no email and no name. We set no cookies, load no third-party tracking code, show no advertising, and sell or share nothing, because we hold nothing about you.
  collect_title: What we do not collect
  collect_body: 'The museum processes no personal data about its visitors: no names, no email addresses, no stored IP addresses, no browsing logs, no device identifiers, no profiles. There are no forms that send your data to us, search runs inside your browser on a static index, and fonts, maps and images are served from the site itself, not from outside services.'
  device_title: What stays on your own device
  device_body: 'A few preferences are kept in your browser''s own storage (localStorage and sessionStorage) and are never sent anywhere: light or dark theme, the typeface, the reading depth, your place in the random walk, and, in the children''s wing, the names a child invents in the games and the stars and scores they collect. You can clear them at any time from your browser settings, and the whole site works without them.'
  traffic_title: Counting visits
  traffic_body: 'Visits are counted in the network analytics of Cloudflare, the network that delivers the pages. These analytics run at the network edge, with no cookies and no code in the page, and give the museum aggregate figures only: number of requests, countries, most-visited pages. Nothing that identifies a particular person reaches us.'
  hosts_title: Who delivers the files
  hosts_body: "The pages are delivered through the Cloudflare network; the search index and the open-data files are served from the museum's own storage. Photographs of objects from partner museums (the Victoria and Albert Museum, the Metropolitan Museum of Art, the Cleveland Museum of Art, Wikimedia Commons) load from those institutions' own servers. Like every service on the internet, these providers need your device's IP address to deliver a file to you, and they process it under their own policies. The museum does not receive or keep that data."
  contact_title: When you contact us
  contact_body: If you email us or open a report or a discussion on GitHub, we see what you choose to send and use it only to reply and to correct the content. What you write on GitHub is governed by GitHub's terms and privacy statement, and is public unless you choose otherwise.
  people_title: People the museum writes about
  people_body: The museum describes people from history and from the present through published public facts tied to their sources. About the living it records only documented public facts, and nobody's religion is inferred or attributed without a stated basis. If you find an error, or something that concerns you personally, tell us through the correction form or by email; corrections concerning living people come first.
  kids_title: Children
  kids_body: 'The same rules apply to the children''s wing: no accounts, no data collection, no contact with other parties, no comments and no chat. The names a child invents in the games and the stars they collect stay on the device itself.'
  links_title: Links to other sites
  links_body: The museum points to outside sources and references. When you follow them, those sites' policies apply, not ours.
  law_title: Applicable law
  law_body: The museum is operated from the province of Ontario, Canada, and is subject to Canadian federal law and the law of Ontario, including the Personal Information Protection and Electronic Documents Act (PIPEDA). Because the museum collects no personal information, it holds nothing about you to disclose, correct or delete; we nonetheless answer any question on the matter at our address.
  changes_title: Changes to this page
  changes_body: If anything changes in how the site works, this page is updated first, and the change is recorded in the public repository's history on GitHub, where anyone can review what changed and when.
  more_title: Further reading
  more_body: The technical detail is in the architecture document and in architectural decision 0002 (no AI and no compute at runtime), both in the public repository.
  arch_link: Architecture document
  adr_link: Decision 0002
  contact_cta: Email us
  report_cta: Report an error
support:
  title: Support the museum
  lede: This museum is free and open, with no ads and no tracking. If it is useful to you, your support keeps it that way and helps it grow faster.
  why_title: Why support us?
  why_body: 'This museum is built carefully, one item at a time: every fact is attributed to its source and every text is reviewed. Your support helps keep this work going and extends it to English and other languages.'
  ways_title: Ways to support
  patreon_title: Join on Patreon
  patreon_body: An optional monthly membership that helps keep this work going and lets you follow its progress.
  patreon_cta: Go to the Patreon page
  paypal_title: One-time donation
  paypal_body: A one-time donation through PayPal, with no subscription.
  paypal_cta: Donate with PayPal
  launchgood_title: LaunchGood campaign
  launchgood_body: A fundraising campaign on LaunchGood to help build the first open digital Islamic museum.
  launchgood_cta: Support the campaign on LaunchGood
  github_title: GitHub Sponsors
  github_body: Monthly or one-time sponsorship through GitHub, with sponsors listed on the project's GitHub profile.
  github_cta: Sponsor on GitHub Sponsors
  other_title: Other ways to help
  other_body: If a monthly membership does not suit you, you can contribute code, reviews or translations, or share the museum with people you know.
  contribute: Contribute on GitHub
  share: Share the museum
  note: Support is optional and gives no control over the museum's content or its review. Editorial work is independent and the method is published.
