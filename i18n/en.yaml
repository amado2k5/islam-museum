  title: "Ethics and Dealings Browser"
  lede: "Every mention of ethics and dealings in the museum's sources: the Qur'an's virtues from truthfulness, trustworthiness, justice and excellence to kindness to parents and kinship ties, and its vices from lying, treachery, pride, backbiting and injustice; the hadiths 'I was sent to perfect noble character' and 'a Muslim is one from whose tongue and hand the Muslims are safe'; and the dealings between people from sale, riba, debt and pledge to marriage, divorce, oaths, testimony, judgement and the scales — and every report of the Companions and the Successors, what the seerah books carry, and every harvested book — sourced records that grow as new texts land."
  badge: Ethics and Dealings Explorer
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: How the browser works
  method_note: "Every record here is an ordinary museum record — with its sources and its three-language prose. Ethics and dealings are found at build time by a guarded lexicon over the passage texts: the virtue words (truthfulness, trustworthiness, faithfulness, patience, gratitude, humility, excellence, modesty, forbearance, sincerity, repentance, generosity, kindness to parents, kinship, the neighbour's right, good advice, withholding harm, mastery, mercy, justice, contentment), the vice words (lying, treachery, pride, ostentation, envy, miserliness, backbiting, slander, indecency, insults, anger, injustice, disobedience to parents, hypocrisy, cheating) and the dealings words (sale, trade, riba, debt, loan, pledge, hire, bequest, inheritance, marriage, dower, nursing, divorce, release, waiting period, maintenance, custody, oaths, expiation, testimony, proof, judgement, scales, measure, short-measure, reconciliation, gifts, guarantee, surety, agency, partnership, qirad, mudaraba, muzara'a, musaqat, salam, istisna', transfer, loan, deposit, usurpation, found property, pre-emption, hoarding, coercion, interdiction, contract); the bay'ah allegiance, 'raba' as growth outside transaction, 'hukm' as wisdom, 'shahada' as the testimony of faith or martyrdom, 'ajr' as bare reward, 'qism' as portion, and the worship rites owned by the sibling Ibadat and Du'a browsers are left out, verified false positives are excluded by id, and every book harvested later brings its mentions here automatically once its passages land in the graph; curated records join through the akhlaq-browser tag. Each passage is marked with its track (akhlaq/mu'amalat), kind (virtue/vice/dealing/mention) and topics."
