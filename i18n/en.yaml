  ph_title: For families
  ph_lede: What each path does at home, how the passport works, and what is and is not stored.
  ph_bands_title: What does each path do?
  ph_passport_title: The passport on the fridge
  ph_passport_text: Print the passport and put it up. Every completed activity is a stamp the child ticks by hand; no reminders, no notifications, and the schedule lives on paper.
  ph_privacy_title: What do we store?
  ph_privacy_text: Nothing leaves the device. Progress is kept in the browser alone, with no name, no age and no account, and is erased from the "erase my progress" button on any page.
  ph_tips_title: Three tips
  ph_tips:
  - 'Sit together on the first visit: choose the age band from the front door and let the child lead.'
  - Ask the child to tell you the story in their own words after each quest; the telling is the learning.
  - Bedtime stories are for reading aloud; the doors marked "the big museum" are for grown-ups and those with them.
