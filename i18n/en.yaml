      title: 'Modern Islam Browser'
      desc: 'The last fifty years of Islam and Muslims: websites, music, films, conferences, figures, organisations, sport, awards, and what comes next.'
      menu: 'Browse the last fifty years'
    companions:
      title: 'Companions Browser'
      desc: 'The Companions of the Prophet as a web of people: the Ten, the Muhajirun and the Ansar, the Prophet''s household, the women Companions, their clans, the events they stood in, and when they died.'
      menu: 'Browse the Companions'
    asma:
      title: "The Most Beautiful Names Browser"
      desc: "The ninety-nine names of God, each with its meaning and the stories the museum's records carry for it."
      menu: "Browse the ninety-nine names and their stories"
    khulafa:
      title: "The Caliphs Browser"
      desc: "Every caliph grouped by his caliphate — Rashidun to Sokoto — with his reign, succession chain, the events his reign saw and the cited record."
      menu: "Browse the caliphs and their reigns"
    arabiyya:
      title: "Arabic Language Browser"
      desc: "Arabic, the language of the Qur'an: the verses that name its tongue, what the hadith, the Companions and the scholars said about it, the inimitability of its language, and its history, script, grammar, dialects, world, scholars and books."
      menu: "Browse Arabic, the language of the Qur'an"
    maajim:
      title: "Dictionaries Browser"
      desc: "Arabic and Islamic dictionaries: who wrote them, when, from which earlier works, how they are arranged and where they can be read."
      menu: "Browse the dictionaries and their authors"
    ghayb:
      title: The Ghayb Browser
      desc: "Jinn and angels, the soul, the measures of time, the Ascent, the barzakh and the signs of the Hour — the unseen with its sources."
      menu: "Browse the world of the unseen"
    nature:
      title: Nature Explorer
      desc: "Animals, birds, insects, sea creatures, plants and the phenomena of creation in the Qur'an and the hadith — every verse and report with its source."
      menu: "Browse nature in the Qur'an and hadith"
    angels:
      title: "Angels Browser"
      desc: "Every mention of the angels in the Qur'an, the hadith, the Seerah and the Sunni books — Gabriel, Michael, Israfil, the recording scribes, the angels of Badr and Hunayn — grouped by role with every verse and report cited."
      menu: "Browse the angels and their mentions"
    dreams:
      title: Dream Browser
      desc: "Every vision and dream mentioned in the Qur'an, the hadith, the seerah and every harvested book — from Joseph's dream to the dream of Laylat al-Qadr, and every dream classified the day its source lands."
      menu: "Browse dreams in the Qur'an, hadith and seerah"
    dua:
      title: "Du'a Browser"
      desc: "Every supplication mentioned in the Qur'an, the Sunnah, the seerah and every harvested book — from «ربِّ اغفر لي» to «اللهم إني أعوذ بك»، the Prophet's night prayers and the Companions' du'as — with every verse and report cited."
      menu: "Browse supplications in the Qur'an, hadith and books"
    ibadat:
      title: "Worship and Adhkar Browser"
      desc: "Every act of worship and remembrance mentioned in the Qur'an, the Sunnah, the seerah and every harvested book — prayer, purification, fasting, zakat and charity, hajj and umrah, dhikr and du'a, glorification and seeking forgiveness, recitation, repentance and ruqya — with every verse and report cited."
      menu: "Browse worship and adhkar in the Qur'an, hadith and books"
    nar:
      title: "The Fire Browser"
      desc: "Every mention of the Fire in the Qur'an, the Sunnah, the seerah and every harvested book — Jahannam, Saqar, al-Jahim, al-Hutama, Ladha, al-Hamiya and al-Sa'ir, its keepers, fuel, food and the bridge over it — and this world's fire too: Ibrahim's fire, Musa's burning tree and the fire of war — every verse and report cited."
      menu: "Browse the Fire in the Qur'an, hadith and books"
    janna:
      title: "Paradise Browser"
      desc: "Every mention of Paradise (al-janna) in the Qur'an, the Sunnah, the seerah and every harvested book — al-Firdaws, the gardens of 'Adn, Dar al-Salam, its rivers, gates, degrees, soil and people, and every report of the Companions and Successors — with every verse and report cited."
      menu: "Browse Paradise in the Qur'an, hadith and books"
    qiyama:
      title: "Resurrection and Reckoning Browser"
      desc: "Every mention of the Resurrection, the Day of Judgement and the Reckoning in the Qur'an, the Sunnah, the seerah and every harvested book — the Day's names, the Trumpet, the raising and the gathering, the terrors, the display and the records, the Scale, the Shade, the Hawd, the intercession and the Sirat — with every verse and report cited."
      menu: "Browse the Resurrection, the Day and the Reckoning"
    tibb:
      title: "Medicine Browser: Prophetic Medicine, Medicine, Anatomy, Surgery, Drugs and Treatment in Islam"
      desc: "Everything mentioned about prophetic medicine, medicine, anatomy, surgery, drugs and seeking treatment in the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors, the medical classics and every harvested book — cupping, honey, black seed, cautery and ruqya; illness, contagion, plague and visiting the sick; the stages of creation and the organs of the body; the treatment of the wounded; drugs and poisons; the ruling on treatment — with every verse and report cited."
      menu: "Browse prophetic medicine, medicine, anatomy, surgery, drugs and treatment"
    usra:
      title: "Family and Marriages Browser"
      desc: "The famous marriages in Islam, the Muslim family and its daily life — every mention of marriage, spouses and children, dwellings, livelihood and social customs in the Qur'an, the Sunnah, the seerah and every harvested book, with every verse and report cited."
      menu: "Browse marriages, families and daily life in the Qur'an and books"
    ubuwwa:
      title: "Fatherhood in Islam Browser"
      desc: "Every mention of the father and fatherhood in Islam — the Qur'anic fathers and their counsel, dutifulness and disobedience to the parents, the Prophet as a father, paternity and lineage, and the orphan whose father is lost — in the Qur'an, the Sunnah, the seerah, Companion and Tabi'in reports and every harvested book, with every verse and report cited."
      menu: "Browse the father and fatherhood in the Qur'an and books"
    ukhuwwa:
      title: "Brotherhood in Islam Browser"
      desc: "Brotherhood and sisterhood in Islam — every mention of brothers and sisters in the faith, the mu'akhat of the Muhajirun and the Ansar, love for God's sake, altruism and aid, the rights a Muslim owes a Muslim and what breaks brotherhood — in the Qur'an, the Sunnah, the seerah and every harvested book, with every verse and report cited."
      menu: "Browse brotherhood, mu'akhat and brothers' rights in the Qur'an and books"
    sport:
      title: "Sports and Competitions in Islam Browser"
      desc: "Horsemanship, swimming, archery and every sport and contest of the Muslims — wrestling and strength, races and wagered contests, spear-play, ball and board games, hunting and the modern game — in the Qur'an, the Sunnah, the seerah, Companion and Tabi'in reports and every harvested book, with every verse and report cited."
      menu: "Browse horsemanship, swimming, archery and all the sports of the Muslims in the Qur'an and books"
    umuma:
      title: "Motherhood in Islam Browser"
      desc: "Everything the sources mention about motherhood — the mother and her standing, pregnancy, childbirth, nursing, custody and raising children, and dutifulness to parents — in the Qur'an, Sunnah, seerah and every harvested book, each verse and report with its source."
      menu: "Browse motherhood and mothers in the Qur'an and the books"
    bunuwwa:
      title: "Sonhood and Daughterhood in Islam Browser"
      desc: "Everything the sources mention about sons and daughters, offspring and the filial bond — in the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors, and every harvested book: kindness to parents and its opposite, orphans and suckling, the rights of the child, and the named sons and daughters of the stories — with every verse and report cited."
      menu: "Browse sonhood and daughterhood in the Qur'an and books"
    islamiceconomy:
      title: "Islamic Economy Browser"
      desc: "Every mention of money and Islamic economics, deeds and covenants, and endowment in the Qur'an, the Sunnah, the seerah and every harvested book — currencies, usury, debt, trade contracts, weights and measures, fiscal dues, waqf and sadaqa jariya — with every verse and report cited."
      menu: "Browse money, sukuk and waqf in the Qur'an, hadith and books"
    trade:
      title: "Trade Browser — the Winter and Summer Caravans, the Silk Road and Muslim Trade"
      desc: "Every mention of the winter and summer caravans, the Quraysh ilaf, the Silk Road and Muslim trade in the Qur'an, the Sunnah, the seerah and every harvested book — caravans, the 'Ir and the rukb, khans and ribats, trade roads, markets, merchants, goods, weights and measures, and sea trade — each verse and report with its source."
      menu: "Browse the caravans, the Silk Road and trade in the Qur'an, hadith and books"
    sayyiat:
      title: "Sayyi'at Browser"
      desc: "Every mention of the sayyi'at and everything tied to them — sin, guilt, disobedience, the major and minor sins, repentance and seeking forgiveness — in the Qur'an, the Sunnah, the seerah and every harvested book, with every verse and report cited."
      menu: "Browse sayyi'at and sins across the Qur'an and books"
    hudud:
      title: "Hudud Allah and Kaba'ir Browser"
      desc: "Every mention of the limits of God and the major sins — «these are the limits of God», the prescribed penalties of stoning, flogging, the amputated hand and discretionary punishment, the hadd crimes of fornication, theft, slander, wine, apostasy and brigandage, and the kaba'ir and the seven destroyers — in the Qur'an, the Sunnah, the seerah, Companion and Tabi'i reports and every harvested book, with every verse and report cited."
      menu: "Browse hudud Allah and kaba'ir across the Qur'an and books"
    arkan:
      title: "Pillars of Islam, Pillars of Faith, Branches of Faith and Traits of the Believer Browser"
      desc: "Every mention of the five pillars of Islam, the six pillars of faith, the seventy-odd branches of faith and the traits of the believer in the Qur'an, the Sunnah, the seerah, the reports of the Companions and Successors and every harvested book, each verse and report with its source."
      menu: "Browse the pillars of Islam and faith, the branches of faith and the traits of the believer"
    ahkam:
      title: "Rulings Browser: Obligations, Recommended, Disliked and Forbidden Acts"
      desc: "Every mention of the obligations, individual and communal, the acts of obedience, the obligatory, the recommended, the forbidden, the disliked, the minor sins and the permitted in the Qur'an, the Sunnah, the seerah, the reports of the Companions and Successors and the books of usul and fiqh, each verse and report with its source."
      menu: "Browse the obligations, the recommended, the disliked, the forbidden and the minor sins"
    halal:
      title: "Halal and Haram Browser"
      desc: "Every mention of the lawful and the unlawful in Islam — what God permitted and what He forbade in food, drink, dress, marriage and earnings — in the Qur'an, the Sunnah, the seerah, the reports of the Companions and Successors and every harvested book, with detailed records on its principles and chapters."
      menu: "Browse halal and haram across the Qur'an, the Sunnah and the books"
    hasanat:
      title: "Hasanat Browser"
      desc: "Every mention of the good deeds (al-hasanat) in the Qur'an, the Sunnah, the seerah and every harvested book — «إن الحسنات يذهبن السيئات»، «من جاء بالحسنة فله عشر أمثالها»، the writing of the good deeds, the good loan to God and «الحسنى» — with every verse and report cited."
      menu: "Browse the good deeds (al-hasanat) in the Qur'an and books"
    hisab:
      title: "Hasanat and Sayyi'at Ledger, Calculator and Counter"
      desc: "Every text that counts, writes, multiplies, erases or weighs a deed in the Qur'an, the Sunnah, the seerah and every harvested book, with a calculator that reads the figures the texts name and a tally counter; every figure is attributed to its text."
      menu: "Ledger, calculator and counter of good and bad deeds"
    mukatabat:
      title: "Mukatabat Browser"
      desc: "Every mention of correspondence in the Qur'an, the Sunnah, the seerah and every harvested book — the Prophet's letters to kings and emperors, the caliphs' letters and the reports written back, Sulayman's letter to the Queen of Sheba — with every verse and report cited."
      menu: "Browse letters and correspondence in the Qur'an and books"
    nuzul:
      title: "Asbab al-Nuzul Browser"
      desc: "Every report of why a verse or sura was revealed in the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and every harvested book — the first revelation in the cave, the occasions of the hijab, wine, ifk, li'an and zihar verses — with every report cited."
      menu: "Browse the occasions of revelation in the Qur'an and books"
    munazarat:
      title: "Munazarat Browser"
      desc: "Every mention of debates and disputations in the Qur'an, the Sunnah, the seerah and every harvested book — Ibrahim's arguments with his people and Nimrod, the mubahala with the Christians of Najran, the exchange before the Negus, Ibn Abbas's debate with the Khawarij — with every verse and report cited."
      menu: "Browse the debates and disputations in the Qur'an and books"
    ritha:
      title: "Elegy and Death-Announcement Browser"
      desc: "Everything said in elegy, death announcement, condolence and weeping over the dead in the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and every harvested book — the istirja', the Prophet's «to God belongs what He took and what He gave», the announcements of Ja'far, Zayd, Ibn Rawaha and the Negus, the elegies of Hassan and Ka'b ibn Malik, and the limits of wailing — with every verse and report cited."
      menu: "Browse the famous words of elegy, death announcement and condolence"
    juha:
      title: "Juha and Islamic Folklore Browser"
      desc: "Juha, Nasreddin Hoca, Ash'ab and Nu'ayman, and the anecdotes, witty tales, jests and laughter in the Qur'an, the Sunnah, the seerah and the harvested books of adab and history — every verse, report and anecdote with its source."
      menu: "Browse Juha, anecdotes, witty tales and jests in the Qur'an, the Sunnah and the books"
    magic:
      title: "Magic and Magicians Browser"
      desc: "Every mention of magic and the magicians in the Qur'an, the Sunnah, the seerah and every harvested book — sorcery, soothsayers, ruqyah, the evil eye and envy — with every verse and report cited."
      menu: "Browse magic and magicians in the Qur'an and books"
    cosmos:
      title: "Cosmos Browser: Beings, Earlier Nations and the Secrets of the Universe"
      desc: "What the Qur'an, the Sunnah and the books say of creatures beyond the earth, the seven heavens and earths, who held the earth before Adam, the vanished peoples and the secrets of the cosmos — every verse and report cited, every view labelled."
      menu: "Browse beings, earlier nations and cosmic secrets"
    qiraat:
      title: "Qur'an Readings, Orthography, Scripts and Dotting Browser"
      desc: "The seven ahruf, the readings and their imams, the collection of the Qur'an and the copying of the codices, the orthography of the mushaf and the debate over ordinary spelling, its dots and vowel marks, and the scripts it was written in — every verse and report cited, every view attributed."
      menu: "Browse the readings, rasm, scripts and dotting of the Qur'an"
    tajwid:
      title: "Tajwid and Tilawah Browser"
      desc: "The seventeen makharij and the letters' sifat, the rules of tajwid, the tartil and the etiquette of reciting and listening, the melodies, the reciters and the teaching texts — every verse, report and book passage cited."
      menu: "Browse the rules of tajwid and the art of recitation"
    ulama:
      title: "Ulama Browser: Thinkers, Scholars, Litterateurs, Muhaddiths and Writers"
      desc: "Every thinker, scholar, litterateur, muhaddith and writer in the museum — and everything the Qur'an, the Sunnah, the seerah and every harvested book says about them: their lives, their mission, their quotes, their books, their interviews and their legacy — each mention with its source."
      menu: "Browse the thinkers, scholars, writers and muhaddiths and their mentions"
    wasaya:
      title: "Testaments Browser: Last Counsels, Legacies, Relics and Resting Places"
      desc: "The last testaments of the prophets, the caliphs, the Companions, the Successors, the imams and the righteous before their deaths; what they left behind; their relics; and their graves — in the Qur'an, the Sunnah, the seerah and every harvested book, each verse and report cited."
      menu: "Browse the testaments, legacies, relics and graves"
    signs:
      title: "Signs of the Hour Browser"
      desc: "Every mention of the signs of the Hour, the Day of Judgment and all eschatology in the Qur'an, the Sunnah, the seerah and every harvested book — the major and minor signs, barzakh, resurrection, reckoning, Paradise and Hell — with every verse and report cited."
      menu: "Browse the signs of the Hour and the Hereafter"
    jinn-devils:
      title: "Jinn & Devils Browser"
      desc: "Jinn, devils and demons, angels, and the dreams that carry them — every mention in the Qur'an, the hadith and the seerah with its source."
      menu: "Browse jinn, devils and angels"
    messengers:
      title: "Messengers and Prophets Browser"
      desc: "Every mention of the messengers and prophets in the Qur'an, the Sunnah, the seerah and every harvested book — the named prophets, the messengers, the bearers of stories, and every verse and report cited."
      menu: "Browse the messengers, prophets and their mentions"
    miracles:
      title: "Divine and Prophetic Miracles Browser"
      desc: "Every mention of the divine miracles and the prophets' miracles in the Qur'an, the Sunnah, the seerah and every harvested book — the miracle of the Qur'an, the moon-split, the Isra' and Mi'raj, the staff, the sea, the she-camel, the ark, the fire, the clay bird, the cradle speech, the heavenly table, Sulayman's signs, the dreams, the annunciation and the covenant chest, with every verse and report cited."
      menu: "Browse the divine and prophetic miracles"
    qurun:
      title: "Centuries, Years and Months Browser"
      desc: "Every mention of the centuries, the years, the important months and the sacred months in the Qur'an, the Sunnah, the seerah and every harvested book — the named years of the seerah, the twelve lunar months, the four sacred months and the intercalation — with every verse and report cited."
      menu: "Browse the centuries, years, months and sacred months"
    madhahib:
      title: "Four Madhhabs Browser"
      desc: "The four imams and the schools they founded, the salaf, the canonical books and the school mutun that carry them — every mention of the madhhabs in the Sunni books with its source."
      menu: "Browse the four madhhabs and their mentions"
    umam:
      title: "The Non-Muslim Nations, Religions, Sects and Peoples Browser"
      desc: "Every non-Muslim nation, religion, sect and people named in the Qur'an, the hadith, the sira, the reports of the Companions and Successors and every harvested book — the vanished nations, the People of the Book, the polytheists, the kings and figures of the earth — each mention with its source."
      menu: "Browse the nations, religions and peoples and their mentions"
    bayt:
      title: "Household of the Prophet Browser"
      desc: "Everything mentioned about the Prophet's household and family — the People of the House, the Prophet's clan, his wives, daughters and descendants — in the Qur'an, the Sunnah, the seerah and the harvested books."
      menu: "Browse the Prophet's household and family"
    nubuwat:
      title: "Prophecies and Miracles Browser"
      desc: "Every prophecy of the Prophet, proof of prophethood, secret and marvel of the Qur'an, miracle and eschatological prediction in the Qur'an, the Sunnah, the seerah and every harvested book — with every verse and report cited."
      menu: "Browse the Prophet's prophecies, the Qur'an's secrets and the miracles"
    places:
      title: "Sacred Places Browser"
      desc: "Every place of sanctity, importance and value in Islam that the Qur'an, the Sunnah, the seerah, the Companions and Successors, and every harvested book mention — the three sanctuaries, the hajj stations, the seerah sites, the places named in the Qur'an and every place a passage names."
      menu: "Browse the sacred and important places of Islam"
    akhlaq:
      title: "Ethics and Dealings Browser"
      desc: "Every mention of ethics and dealings in the Qur'an, the Sunnah, the seerah, Companion and Tabi'i reports and every harvested book — truthfulness, trustworthiness, faithfulness, patience, gratitude, humility, excellence, modesty, forbearance, pardon, sincerity, repentance, generosity, kindness to parents, kinship ties and the neighbour's right; lying, treachery, pride, ostentation, envy, miserliness, backbiting, slander, anger, injustice, disobedience to parents, hypocrisy and cheating; and sale, riba, debt, pledge, hire, bequest, inheritance, marriage, divorce, oaths, testimony, judgement, weights and measures, reconciliation, gifts, guarantees, agency, partnership, salam, transfer, loans, usurpation, pre-emption, hoarding, coercion and interdiction — every verse and report with its source."
      menu: "Browse ethics and dealings in the Qur'an, hadith and books"
    ansab:
      title: "The Genealogies, Peoples, Tribal Subdivisions and Prophets' Tree Browser"
      desc: "Every mention of genealogies, peoples, tribal subdivisions and the prophets' tree in the Qur'an, the Sunnah, the seerah and every harvested book — the Prophet's lineage in its three parts, the Arab tribes and their butun and the peoples — each report cited."
      menu: "Browse genealogies, peoples, tribal subdivisions and the prophets' tree"
    i3lam:
      title: "The Muslim Media-Makers Browser"
      desc: "Every mention of the media-makers — the muezzin, herald, khatib, state spokesman, katib, journalist, media person, influencer, reformer and revolutionary — in the Qur'an, the Sunnah, the seerah and every harvested book, with the people who carried the word."
      menu: "Browse the Muslim media-makers"
    battles:
      title: "Battles, Wars and Conquests Browser"
      desc: "The expeditions, battles, sieges, conquests and wars of Islamic history — the ghazawat and saraya first, then by kind and by era."
      menu: "Browse the ghazawat, battles and conquests"
    timemachine:
      title: Time Machine
      menu: Travel to any date, in both calendars
    wander:
      title: Wander
      menu: A random page of the museum
