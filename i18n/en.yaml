tibb:
  title: "Medicine Browser: Prophetic Medicine, Medicine, Anatomy, Surgery, Drugs and Treatment in Islam"
  lede: "Everything said and written about prophetic medicine, medicine, anatomy, surgery, drugs and the seeking of treatment in the museum's sources: the verses of healing, illness and the stages of human creation in the Qur'an; the reports of the Book of Medicine and the Book of the Sick in the two Sahihs, the Sunan and the Muwatta; the chapters on prophetic medicine in Zad al-Ma'ad; the reports of the Companions and the Successors on treatment, the care of the wounded and visiting the sick; passages of Ibn Sina's Canon, al-Razi's al-Hawi and Ibn al-Nafis's Commentary on the Anatomy of the Canon; and the records of physicians, hospitals, medical books, drugs and rulings — sourced records that grow as new texts land."
  badge: "Medicine in Islam explorer"
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: "The browser's method"
  method_note: "Every record here is an ordinary museum record, with its sources and its three-language prose. Medical texts are found at build time by a guarded lexicon over the passage texts, in the six topics of the title: prophetic medicine (cupping, cautery, ruqya, honey, black seed, costus, senna, talbina, truffles, 'ajwa dates, ithmid, ladud and sa'ut); medicine (the physician, illness and the sick, pain, fever, plague and epidemic, contagion, leprosy, named diseases, visiting the sick, the hospital); anatomy (the drop, the clot and the lump of flesh; the jugular vein, the aorta and the vessels; the joints; the organs); surgery (treating a wound, cauterising a vessel, venesection, circumcision, splints, bone-setting); drugs (the drug and the disease, poison and antidote, simples); and treatment (seeking treatment and cure, healing, treatment with what is forbidden). The ambiguous words are guarded: «في قلوبهم مرض» is left out; «الحمى» counts only as fever, never the protected pasture; «القسط» only in its drug compounds, never justice; «عسل» and «عجوة» only beside a medical word; «سم الخياط» is left out; the wound words count only with treatment, never with the legal compensation of wounds; and outside the Qur'an and the hadith reports a bare «مرض» or «شفاء» alone is not enough. Every book harvested later brings its medical texts here automatically when its passages land in the graph; curated records join through the tibb-browser tag with the tag of their topic. The museum describes what the sources say and attributes it; it gives no medical advice and no ruling."
  api: "The whole set is available at"
