hisab:
  title: "Hasanat and Sayyi'at Ledger, Calculator and Counter"
  lede: "What the museum's sources say about the account of deeds: the verses, hadiths and reports of the seerah, the Companions and the Successors that count a good deed and a bad one, write them, multiply, erase, and weigh in qirats, ranks and the Scale. A list of every such text, a calculator that reads the figures the texts name for particular acts, and a tally counter that stays in your browser."
  badge: The account of deeds in the texts
  status: "This build holds {n} records in {s} sections, {r} of them rows of the calculator; the texts are drafts until a human reads them."
  parts_title: Parts of the page
  read_more: Read the article
  caveat_title: Before you count
  caveat: "This page describes what the texts contain and computes no one's outcome. Every figure on it is read from a text named beside it, and the texts themselves hang the figure on intention, acceptance, the avoiding of major sins and the settling of wrongs, and say that what lies above the figure is a bounty no number caps. The museum gives no rulings: where narrations differ they are shown as they came, and where a text names no figure its result is written in its own words and not turned into a number."
  method_title: The page's method
  method_note: "Every record here is an ordinary museum record with its sources. The texts of the list are found at build time by a guarded lexicon over the passage texts: a number of good or bad deeds, the tenfold and seven-hundredfold multiples, the writing of a deed, the erasing, shedding and expiating of bad deeds, forgiveness of what is past, ranks and the qirat, what equals a greater act, the Scale and the atom's weight, the noble scribes and the record of deeds, the bankrupt and the burdens, and the reckoning. A plain mention of good or bad deeds with no counting stays in the Hasanat and Sayyi'at browsers. Verified false positives are excluded by id, and every book harvested later brings its texts here automatically the day its passages land. The rows of the calculator are curated records carrying a reckoning field that reads the figure from one named text."
  api: "The whole set is available at"
  calc_title: The calculator
  calc_intro: "Each row is an act for which a text names a figure or a result. Enter how many times; the calculator multiplies your count by the stated figure and adds up. Rows whose text names no figure show their result in words under the total."
  calc_nojs: "The table is complete for reading; the automatic sum needs JavaScript."
