      desc: "Reports of brotherhood, brothers and sisters in every other harvested work — jurisprudence, letters, history, biography and poetry — entering automatically the day their passages land."
    curated:
      title: "Records about brotherhood in Islam"
      desc: "The museum's own selected records on brotherhood itself: the concept of Muslim brotherhood, the pairing of the Emigrants and the Helpers, love for God's sake, altruism, the rights a Muslim owes a Muslim, and what opposes them — envy and estrangement."
