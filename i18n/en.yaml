      desc: "Every caliph grouped by his caliphate — Rashidun to Sokoto — with his reign, succession chain, the events his reign saw and the cited record."
      menu: "Browse the caliphs and their reigns"
    ghayb:
      title: The Ghayb Browser
      desc: "Jinn and angels, the soul, the measures of time, the Ascent, the barzakh and the signs of the Hour — the unseen with its sources."
      menu: "Browse the world of the unseen"
    nature:
      title: Nature Explorer
      desc: "Animals, birds, insects, sea creatures, plants and the phenomena of creation in the Qur'an and the hadith — every verse and report with its source."
      menu: "Browse nature in the Qur'an and hadith"
    angels:
      title: "The Angels Browser"
      desc: "Every mention of the angels in the Qur'an, the hadith, the Seerah and the Sunni books — Gabriel, Michael, Israfil, the recording scribes, the angels of Badr and Hunayn — grouped by role with every verse and report cited."
      menu: "Browse the angels and their mentions"
    dreams:
      title: Dream Browser
      desc: "Every vision and dream mentioned in the Qur'an, the hadith, the seerah and every harvested book — from Joseph's dream to the dream of Laylat al-Qadr, and every dream classified the day its source lands."
      menu: "Browse dreams in the Qur'an, hadith and seerah"
    dua:
      title: "Du'a Browser"
      desc: "Every supplication mentioned in the Qur'an, the Sunnah, the seerah and every harvested book — from «ربِّ اغفر لي» to «اللهم إني أعوذ بك»، the Prophet's night prayers and the Companions' du'as — with every verse and report cited."
      menu: "Browse supplications in the Qur'an, hadith and books"
    ibadat:
      title: "Worship and Adhkar Browser"
      desc: "Every act of worship and remembrance mentioned in the Qur'an, the Sunnah, the seerah and every harvested book — prayer, purification, fasting, zakat and charity, hajj and umrah, dhikr and du'a, glorification and seeking forgiveness, recitation, repentance and ruqya — with every verse and report cited."
      menu: "Browse worship and adhkar in the Qur'an, hadith and books"
    nar:
      title: "The Fire Browser"
      desc: "Every mention of the Fire in the Qur'an, the Sunnah, the seerah and every harvested book — Jahannam, Saqar, al-Jahim, al-Hutama, Ladha, al-Hamiya and al-Sa'ir, its keepers, fuel, food and the bridge over it — and this world's fire too: Ibrahim's fire, Musa's burning tree and the fire of war — every verse and report cited."
      menu: "Browse the Fire in the Qur'an, hadith and books"
    janna:
      title: "Paradise Browser"
      desc: "Every mention of Paradise (al-janna) in the Qur'an, the Sunnah, the seerah and every harvested book — al-Firdaws, the gardens of 'Adn, Dar al-Salam, its rivers, gates, degrees, soil and people, and every report of the Companions and Successors — with every verse and report cited."
      menu: "Browse Paradise in the Qur'an, hadith and books"
    islamiceconomy:
      title: "Islamic Economy Browser"
      desc: "Every mention of money and Islamic economics, deeds and covenants, and endowment in the Qur'an, the Sunnah, the seerah and every harvested book — currencies, usury, debt, trade contracts, weights and measures, fiscal dues, waqf and sadaqa jariya — with every verse and report cited."
      menu: "Browse money, sukuk and waqf in the Qur'an, hadith and books"
    sayyiat:
      title: "Sayyi'at Browser"
      desc: "Every mention of the sayyi'at and everything tied to them — sin, guilt, disobedience, the major and minor sins, repentance and seeking forgiveness — in the Qur'an, the Sunnah, the seerah and every harvested book, with every verse and report cited."
      menu: "Browse sayyi'at and sins across the Qur'an and books"
    hudud:
      title: "Hudud Allah and Kaba'ir Browser"
      desc: "Every mention of the limits of God and the major sins — «these are the limits of God», the prescribed penalties of stoning, flogging, the amputated hand and discretionary punishment, the hadd crimes of fornication, theft, slander, wine, apostasy and brigandage, and the kaba'ir and the seven destroyers — in the Qur'an, the Sunnah, the seerah, Companion and Tabi'i reports and every harvested book, with every verse and report cited."
      menu: "Browse hudud Allah and kaba'ir across the Qur'an and books"
    hasanat:
      title: "Hasanat Browser"
      desc: "Every mention of the good deeds (al-hasanat) in the Qur'an, the Sunnah, the seerah and every harvested book — «إن الحسنات يذهبن السيئات»، «من جاء بالحسنة فله عشر أمثالها»، the writing of the good deeds, the good loan to God and «الحسنى» — with every verse and report cited."
      menu: "Browse the good deeds (al-hasanat) in the Qur'an and books"
    hisab:
      title: "Hasanat and Sayyi'at Ledger, Calculator and Counter"
      desc: "Every text that counts, writes, multiplies, erases or weighs a deed in the Qur'an, the Sunnah, the seerah and every harvested book, with a calculator that reads the figures the texts name and a tally counter; every figure is attributed to its text."
      menu: "Ledger, calculator and counter of good and bad deeds"
    mukatabat:
      title: "Mukatabat Browser"
      desc: "Every mention of correspondence in the Qur'an, the Sunnah, the seerah and every harvested book — the Prophet's letters to kings and emperors, the caliphs' letters and the reports written back, Sulayman's letter to the Queen of Sheba — with every verse and report cited."
      menu: "Browse letters and correspondence in the Qur'an and books"
    magic:
      title: "Magic and Magicians Browser"
      desc: "Every mention of magic and the magicians in the Qur'an, the Sunnah, the seerah and every harvested book — sorcery, soothsayers, ruqyah, the evil eye and envy — with every verse and report cited."
      menu: "Browse magic and magicians in the Qur'an and books"
    signs:
      title: "Signs of the Hour Browser"
      desc: "Every mention of the signs of the Hour, the Day of Judgment and all eschatology in the Qur'an, the Sunnah, the seerah and every harvested book — the major and minor signs, barzakh, resurrection, reckoning, Paradise and Hell — with every verse and report cited."
      menu: "Browse the signs of the Hour and the Hereafter"
    jinn-devils:
      title: "Jinn & Devils Browser"
      desc: "Jinn, devils and demons, angels, and the dreams that carry them — every mention in the Qur'an, the hadith and the seerah with its source."
      menu: "Browse jinn, devils and angels"
    messengers:
      title: "Messengers and Prophets Browser"
      desc: "Every mention of the messengers and prophets in the Qur'an, the Sunnah, the seerah and every harvested book — the named prophets, the messengers, the bearers of stories, and every verse and report cited."
      menu: "Browse the messengers, prophets and their mentions"
    miracles:
      title: "Divine and Prophetic Miracles Browser"
      desc: "Every mention of the divine miracles and the prophets' miracles in the Qur'an, the Sunnah, the seerah and every harvested book — the miracle of the Qur'an, the moon-split, the Isra' and Mi'raj, the staff, the sea, the she-camel, the ark, the fire, the clay bird, the cradle speech, the heavenly table, Sulayman's signs, the dreams, the annunciation and the covenant chest, with every verse and report cited."
      menu: "Browse the divine and prophetic miracles"
    qurun:
      title: "Centuries, Years and Months Browser"
      desc: "Every mention of the centuries, the years, the important months and the sacred months in the Qur'an, the Sunnah, the seerah and every harvested book — the named years of the seerah, the twelve lunar months, the four sacred months and the intercalation — with every verse and report cited."
      menu: "Browse the centuries, years, months and sacred months"
    madhahib:
      title: "Four Madhhabs Browser"
      desc: "The four imams and the schools they founded, the salaf and the books that recorded them — every mention of the madhhabs in the Sunni books with its source."
      menu: "Browse the four madhhabs and their mentions"
    bayt:
      title: "Household of the Prophet Browser"
      desc: "Everything mentioned about the Prophet's household and family — the People of the House, the Prophet's clan, his wives, daughters and descendants — in the Qur'an, the Sunnah, the seerah and the harvested books."
      menu: "Browse the Prophet's household and family"
    nubuwat:
      title: "Prophecies and Miracles Browser"
      desc: "Every prophecy of the Prophet, proof of prophethood, secret and marvel of the Qur'an, miracle and eschatological prediction in the Qur'an, the Sunnah, the seerah and every harvested book — with every verse and report cited."
      menu: "Browse the Prophet's prophecies, the Qur'an's secrets and the miracles"
    places:
      title: "Sacred Places Browser"
      desc: "Every place of sanctity, importance and value in Islam that the Qur'an, the Sunnah, the seerah, the Companions and Successors, and every harvested book mention — the three sanctuaries, the hajj stations, the seerah sites, the places named in the Qur'an and every place a passage names."
      menu: "Browse the sacred and important places of Islam"
    battles:
      title: "Battles, Wars and Conquests Browser"
      desc: "The expeditions, battles, sieges, conquests and wars of Islamic history — the ghazawat and saraya first, then by kind and by era."
      menu: "Browse the ghazawat, battles and conquests"
    timemachine:
      title: Time Machine
      menu: Travel to any date, in both calendars
    wander:
      title: Wander
      menu: A random page of the museum
