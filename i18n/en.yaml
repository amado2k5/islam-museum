    note: "The letters of Arabic in the order al-Khalil ibn Ahmad gave them in Kitab al-Ayn, the first Arabic dictionary: not alif, ba, ta, but by where each sound is made, from the depth of the throat out to the lips. Each coloured arc is one place of articulation."
