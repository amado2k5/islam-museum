ansab:
  title: "The Genealogies, Peoples, Tribal Subdivisions and Prophets' Tree Browser"
  lede: "Every mention of genealogies, peoples, tribal subdivisions (butun) and the prophets' and messengers' tree in the museum's sources: the Prophet's lineage in its three parts — the agreed-sound part down to Adnan, the disputed part to Ibrahim, and what lies above — the Arab tribes Adnani and Qahtani, the peoples (Arabs, Ajam, Rum, Habasha, Copts, Banu Isra'il), and the butun of the tribes from Hashim, al-Muttalib, Abd Shams, Makhzum and Zuhra to the clans of Aws, Khazraj, Hawazin and Qays — in the Qur'an, the Sunnah, the seerah, the reports of the Companions and Successors, and every harvested book and every book harvested later."
  badge: The genealogies, peoples and butun explorer
  status: "This build holds {n} records and {f} passages in {s} sections; texts are drafts until a person reads them."
  method_title: How the browser works
  method_note: "Every record here is an ordinary museum record with its sources and trilingual prose. Mentions are discovered at build time by a guarded lexicon over the passage matns: the names of the prophetic-lineage links (from Abdullah ibn Abd al-Muttalib up to Adnan, then the disputed links to Ismail and Ibrahim), the tribe and clan names (Quraysh and its clans, Aws and Khazraj, Tamim, Hawazin, Thaqif, Ghatafan, Quda'a, Kinda, Bakr, Taghlib and the rest), the peoples (Arabs, Ajam, Persians, Rum, Habasha, Copts, Turks, Berbers, Kurds, Mongols, Banu Isra'il), the clan names (the butun of Quraysh, Aws, Khazraj, Hawazin and Qays), and the class terms (nasab, tribe, clan, batn, butun, fakhidh, the prophets' tree); while 'aad as the verb 'returned', Tamim meaning 'complete' and matn meaning 'the back' are excluded, and documented false positives are excepted by id. Every book harvested later brings its mentions here automatically when its passages land in the graph, and curated records join through the ansab-browser tag. Each passage is labelled with its corpus (Qur'an / Sunnah / seerah / books) and its topics."
  api: "The full set is available at"
  tree_title: "The prophets' and messengers' tree — the Prophet's lineage"
  tree_note: "The Prophet's lineage in the sira and genealogy scholars' three-part division: the part agreed as sound down to Adnan, the part disputed between those who suspend judgement and those who affirm it from Adnan up to Ismail ibn Ibrahim on the transmission of Ibn Ishaq, al-Tabari and Ibn Sa'd, and the part above Ibrahim which is not established with them. The whole chain is shown as requested, and the disputed links are marked with a dashed outline, not presented as certainty."
  tree_legend: "Links outlined with a dashed border belong to the disputed part of the lineage (between Adnan and Ismail on the Ibn Ishaq/al-Tabari transmission); the solid ones are agreed as sound with the sira scholars."
  disputed_from: "the disputed part runs from"
  disputed_to: "to"
  disputed_tooltip: "A link in the disputed part of the Prophet's lineage — no genealogist vouches for it"
  sections_title: "The browser's sections"
  filter_label: "Filter the genealogies, peoples and butun"
  filter_none: "No matching results."
  empty: "No genealogy records in this build yet."
