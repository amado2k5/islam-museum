  method_title: The browser's method
  method_note: "Every record here is an ordinary museum record — with its sources and its three-language prose. Supplications are found at build time by a guarded lexicon over the passage texts — the formulas «اللهم»، «ربنا»، «يا رب» and «ربِ + follower»، the supplication verbs with a divine object, isti'adha and istighfar, and the passages about supplication itself; calls to false gods, the da'wa senses of «دعوة» and «يدعو»، and mere tasbih are left out, verified false positives are excluded by id, and every book harvested later brings its du'as here automatically once its passages land in the graph; curated records join through the dua-browser tag. Each passage is marked formula when it carries a supplication and mention when it is only about one."
