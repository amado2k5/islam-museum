cosmos:
  title: "Cosmos Browser: Beings, Earlier Nations and the Secrets of the Universe"
  lede: "Everything the museum's sources say about what lies beyond the human story as we know it: creatures the Qur'an says God dispersed through the heavens as well as the earth, the seven heavens and the 'like of them' of the earth, who held the earth before Adam, the peoples that vanished, the people behind the barrier, and the secrets of the cosmos — the Throne, the Tablet, the Lote-tree and the keys of the unseen. Every verse, report and book passage is cited, and every view is labelled."
  badge: Cosmos explorer
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: The browser's method
  method_note: "The sources do not speak of 'aliens' as a modern reader means the word; they speak of creatures dispersed in the heavens, of many worlds, of the jinn and angels, of earlier creation and vanished peoples. This browser gathers exactly those mentions and puts each beside the commentators who read it. It gives no verdict: where scholars differ, or a report's chain is disputed, the record says so and cites each side. Qur'an verses are chosen from a reviewed table; every other mention is found at build time by a guarded lexicon over the passage texts, so a mention in a book harvested later appears the day its passage lands."
