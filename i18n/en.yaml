'foundation':
  'title': 'About the Islam Museum foundation'
  'lede': 'A free, open, all-digital museum of Islam: its faith, civilization, peoples, places, ideas, objects, texts and living culture, from the world Islam was born into to today.'
  'logo_title': 'The logo'
  'logo_intro': 'The mark brings three elements of Islamic architecture and the book into one shape.'
  'logo_star': 'The eight-pointed star, from Islamic geometry: time and space together, neither understood without the other.'
  'logo_arch': 'The mihrab: the doorway a visitor enters through, and the turn toward the qibla.'
  'logo_book': 'The open book: knowledge and words, and reading before judging.'
  'logo_download': 'Mark (PNG)'
  'emblem_alt': 'The museum emblem: a gold eight-point star around a lapis disc with a copper mihrab arch over an open book'
  'emblem_download': 'Full emblem (image)'
  'logo_dark_download': 'Mark for dark backgrounds'
  'logo_lockup_download': 'Download the mark with the name'
  'story_title': 'The story'
  'story_1': 'The project began with a simple question: why is there no single place online that gathers the whole story of Islam, where a stranger can walk in and learn, and a researcher can check a claim and go back to the source? What is known about Islam is scattered across scripture sites, museum archives, encyclopedia articles, academic studies and press coverage, and much of it is written to defend or attack rather than to understand.'
  'story_2': 'The project chose to be built as a museum, not as one long article: nine wings (Time, Place, People, Ideas, Objects, Words, Living Islam, Today, and Made) look at the same subject from different angles, and every person, place, event, idea or object is a node in a graph that connects it to what surrounds it in time and space.'
  'story_3': 'The material is kept as plain, readable files, with every fact tied to a source and every date written in its precise form with its Hijri and Gregorian calendars. The site itself is a set of static pages: no server, no database, no paid service, and no AI model running when a visitor arrives.'
  'story_4': 'When the museum chose its visual identity, its colours came from Islamic architecture and manuscript making: deep lapis blue, the muted gold of manuscript pages, warm alabaster, and the sand of tiles. No single ornament was copied from an existing work; the patterns grow from the geometry of the star, the square and the circle.'
  'story_5': 'Then came shared work: contributors and parallel working sessions add small batches of material, and review turns drafts into reviewed entries before they are marked as such. The museum is still being built, and it says so on every page; the coverage page counts what is complete and what is still waiting.'
  'founder_title': 'The founder'
  'founder_line': 'Founded by {name}, a Canadian of Egyptian origin, resident in Oakville, Ontario.'
  'founder_name': 'Ahmed Abdel Aal'
  'founder_body': 'One person founded the project and wrote its first plan inside the repository itself, then opened the door to anyone who wanted to add or correct. The plan is built so the museum survives even if its founder stops: its text is in git, its data is open, and anyone can copy the whole museum to their own computer. This page describes the project and its purpose, not the life of the person behind it.'
  'independence_title': 'Independence'
  'independence_1': 'islam.museum is the personal project of its founder, who directs it alone. Its management, ownership and decisions are never shared, and it is not for sale: no funding, partnership or support of any kind gives anyone control over it.'
  'independence_2': 'The museum will never be merged into another project, and it stands under no umbrella and no oversight — no government, religious institution, company or foundation. Everyone is welcome to help: with feedback and corrections, volunteering, funding and fundraising, materials, testing, code, writing about the museum and spreading the word. Help is thanked and credited, and it brings no authority with it: the museum remains independent, from the people to the people.'
  'terms_title': 'Free to use — and on what terms'
  'terms_1': 'Everything here is free to use, without asking: all of the museum''s data, resources and services, present and future, in any way and without limit, and with no control from us. You may clone, fork or copy the whole codebase and start a similar, modified or entirely new project — the founder will bring no copyright claim and no legal attempt against such efforts. The data is CC0, the prose CC BY-SA 4.0 and the code MIT.'
  'terms_2': 'The museum may change anything at any time — the website, its content, its code, its hosting, its performance, its architecture and its deployment — without prior consent, without approval, and without notice to anyone. There is no service-level agreement and no warranty of any kind: if the site malfunctions, goes down, is unavailable or is changed, no claim lies against the museum or its owner on that account.'
  'terms_3': 'What you do with what you find here is your responsibility. Neither the website nor its owner, nor the hosting company, is liable for anyone''s behaviour, actions, adoption, application, reproduction or reuse of the published content, nor for any misunderstanding, misrepresentation, misuse or harm that follows from a visitor''s actions. Every record cites its sources and shows its review state, but accuracy is cited, not guaranteed — the cited source is where a claim is finally checked — and sites we link to are their owners'' responsibility.'
  'terms_4': 'Any author or entity with a claim to any content may ask at any time for its removal or modification: the report tools on this site are always open for exactly that, and such requests are answered first. All opinions and views expressed on this site are solely the founder''s own and do not reflect the views or opinions of his employer.'
  'purpose_title': 'Not for profit, not for an agenda'
  'purpose_1': 'islam.museum is not run for profit or gain. It pursues no agenda, and it serves no government or corporate need. It is free for everyone: no subscriptions, no tracking, and no intention to use or sell anyone''s information to anyone.'
  'purpose_2': 'Running the museum costs real money every month, and its founder carries those costs personally. Volunteers are welcome, and anyone who wishes may donate toward the costs, as they wish — with no commitment, no obligation, and no control in return.'
  'purpose_3': 'In the future, the museum plans an online gift shop / bazaar in its own clear, separate section of the site, where items may be listed and sold for anyone who wishes to browse or shop there, to help toward the costs. It will carry no ads, no spam and no soliciting, and visiting it will always be optional; until it opens, there is no shop, and the museum itself remains free.'
  'purpose_4': 'The museum stands firmly against hate, hate speech and harm — against Islamophobia, antisemitism, racism, genocide, ethnic cleansing and anything the United Nations classifies as hate or racism — and supports and promotes diversity, difference of opinion and peace. It supports no opinion against another, and no narration of history against another: it is an archive and a library of human heritage, presenting what others made and wrote as it is, from their own point of view. Their views are theirs alone; the museum endorses no one, preaches nothing, and offers no consultation, services or advice of any kind. The Charter states this in full (Article 10). The museum claims no copyright, patent or ownership over anything it presents, and it offers no incentive, money or gain to anyone to visit, view or promote it — anyone who comes, comes by their own free will.'
  'contact_title': 'Who to write to'
  'contact_press': 'Press and media'
  'contact_copyright': 'Copyright claims'
  'contact_concerns': 'Any other concerns'
  'goal_title': 'The goal'
  'goal_intro': 'The museum''s goal is to show the whole of Islam, from its beginnings to the present moment, fairly and without bias. To that end it commits to the following:'
  'goal_1': 'It describes rather than prescribes: facts with dates and sources, and judgements attributed to the people who made them.'
  'goal_2': 'The Sunni account is the main frame of research, and every other view is stated only after it is clearly labelled.'
  'goal_3': 'Opponents, critics and allies appear with their roles in their own time, written about without the language of enmity.'
  'goal_4': 'Contested questions appear as tension cards: two or more voices, each cited, with no verdict from the museum.'
  'goal_5': 'Every claim is tied to a source; Wikipedia is a pointer, never a source.'
  'goal_6': 'It begins in Arabic, and it serves the visitor who knows nothing of Islam as well as the specialist.'
  'take_title': 'Take part in building it'
  'take_body': 'The content and the code are open to everyone. You can read the repository, report an error, suggest a new entry, or ask for a translation into another language.'
  'take_repo': 'The repository on GitHub'
  'take_suggest': 'Suggest an entry or a correction'
  'license': 'Licence: text CC BY-SA 4.0 · data CC0 · code MIT'
  'breadcrumb': 'Museum'
