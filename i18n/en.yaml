  raisely_body: The museum's dedicated donation page on Raisely — give once or monthly, in your own currency, toward hosting and running costs.
  raisely_cta: Donate on Raisely
  gofundme_title: GoFundMe campaign
  gofundme_body: The museum's campaign on GoFundMe — give once, in your own currency, toward hosting and running costs.
