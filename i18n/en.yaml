  title: "Resurrection and Reckoning Browser"
  lede: "Every mention of the Resurrection (al-ba'th), the Day of Judgement (yawm al-qiyama) and the Reckoning (al-hisab) in the museum's sources: the Day's names in the Qur'an — al-Haqqa, al-Qari'a, al-Sakhkha, al-Ghashiya, yawm al-din, yawm al-fasl — the Trumpet blasts, the raising from the graves and the gathering, the terrors and the sweat and the drawn-near sun, the display and the scrolls, the first reckoning of the servant, the Scale and the weighing, the retaliation among creatures, the Shade, the Hawd, the intercession and the Sirat — every verse and report cited, in every harvested book, growing as new texts land."
  badge: Resurrection explorer
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: The browser's method
  method_note: "Every record here is an ordinary museum record — with its sources and its three-language prose. Mentions are found at build time by a guarded lexicon over the passage texts: the Day's fixed compounds ⁦(«يوم القيامة»، «يوم الدين»، «يوم الفصل»، «يوم الحساب»…)⁩ and its names ⁦(الحاقة، القارعة، الصاخة، الغاشية)⁩ count directly; ambiguous lexemes — «بعث» which can mean sending a messenger, «الساعة» a clock-hour, «حساب» arithmetic, «الصراط» the straight path, «شفاعة» any mediation — count only beside a resurrection or reckoning collocation, and verified false positives are excluded by id. Every book harvested later brings its mentions here automatically once its passages land in the graph; curated records join through the qiyama-browser tag. Each passage is marked baath (raising and gathering), yawm (the Day, its names and terrors) or hisab (reckoning, scale, records and crossing). The barzakh and the grave's question stay with the Signs of the Hour browser; the signs of the Hour themselves, Paradise and the Fire have their own browsers."
