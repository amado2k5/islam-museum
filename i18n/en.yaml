arabiyya:
  title: "Arabic Language Browser: the language of the Qur'an"
  lede: "Arabic as the Qur'an names it and as the sources describe it: the verses in which the Qur'an speaks of its own tongue, the reports of the Prophet, the Companions and the Successors, the stories of those who heard it, the discussion of its inimitable language, and the history, script, sciences, dialects, world, scholars and books of Arabic."
  badge: "Arabic language explorer"
  status: "This build holds {v} verses in which the Qur'an speaks of its language, {p} passages from the hadith, the seerah, the tafsir and the harvested books that speak about Arabic, and {r} curated records. The passages are found by their wording, so some mention Arabic only in passing; each one opens on its own page with its source."
  method_title: "The browser's method"
  method_note: "Nothing here is kept in a side list. Passages are found when the site is built, by matching the wording of every passage record in the museum's graph, so a book harvested later adds its passages on the day it lands. The curated records are ordinary museum records tagged arabiyya-browser and arabiyya-<section>. Verse text comes only from the frozen Tanzil files. Where scholars differ, the record gives each view under its name and gives no verdict."
  api: "The whole dataset is at"
  contents_title: "On this page"
  empty: "No records in this build yet."
  passages_title: "What the sources say about Arabic"
  passages_note: "Passages from the museum's harvested texts whose wording speaks of the Arabic language: the tongue of Quraysh, the speech of the Arabs, learning Arabic, grammar and its founders, mistakes of speech, and the Qur'an's inimitability. The excerpt is the opening of the passage as it stands in the source; text read by machine from a scan can carry reading errors."
  kin_title: "Neighbouring halls"
  corpora:
    quran:
      title: "The Qur'an on its own language"
      desc: "Every verse of the frozen text that says the revelation is Arabic, that it came in the tongue of its people, or that sets Arabic beside a foreign tongue. Open a verse for its page, translations and commentary."
    sunnah:
      title: "In the hadith and the reports"
      desc: "Reports from the hadith collections that speak of the Arabic tongue, the tongue of Quraysh or the writing of the Qur'an in it."
    seerah:
      title: "In the seerah"
      desc: "Passages from the books of the Prophet's life that speak of the language."
    tafsir:
      title: "In the commentaries"
      desc: "Passages from the Qur'an commentaries that discuss the Arabic of the Qur'an."
    books:
      title: "In the other harvested books"
      desc: "History, biography, law, Qur'anic sciences and letters: wherever a harvested book speaks about Arabic."
  sections:
    lisan:
      title: "Arabic, the language of the Qur'an"
      desc: "Why the revelation is in Arabic as the commentators explain it, the tongue of Quraysh, the seven ahruf, and what the early generations said about learning Arabic."
    ijaz:
      title: "The inimitable language of the Qur'an"
      desc: "The challenge the Qur'an set, the people who heard it and what they said, and how scholars explained its inimitability: views, examples and stories, each under its source."
    origins:
      title: "Origins and history"
      desc: "Where Arabic comes from, its place among the Semitic languages, the Arabs before Islam, and how the language moved from Arabia across the world."
    script:
      title: "Letters and script"
      desc: "The alphabet, the pointing and vowelling of the mushaf, and the art of writing Arabic."
    sciences:
      title: "The sciences of Arabic"
      desc: "Grammar, morphology, rhetoric, prosody, lexicography and the theory of language, and how each began."
    dialects:
      title: "Dialects, old and new"
      desc: "The speech of the tribes in the age of revelation, and the spoken Arabics of today beside the written language."
    world:
      title: "Arabic in the world"
      desc: "Where Arabic is spoken, the Arab countries, Arabic among the languages of the Muslim world, and what it gave other languages and took from them."
    scholars:
      title: "The scholars of the language"
      desc: "The grammarians, lexicographers and rhetoricians who described Arabic."
    books:
      title: "The books of the language"
      desc: "The foundational books of Arabic grammar, rhetoric, language theory and the vocabulary of the Qur'an. The dictionaries have their own browser."
  viz:
