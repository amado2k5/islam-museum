future:
  strip_title: "How will Muslims live in 2077?"
  strip_lede: "Robots already serve in the Grand Mosque. Walk one generation forward — an imagination anchored in fourteen centuries of adaptation."
  strip_cta: "Step into the future"
  eyebrow: "1448 AH → 1500 AH"
  title: "Muslim life in 2077"
  lede: "Not prophecy — the unseen belongs to God alone. This page is the museum's exercise in imagination: every medium Muslims have ever met — paper, print, radio, the screen — the faith absorbed without its core moving. What happens when the medium starts answering back?"
  note: "What follows is imagination anchored in evidence — real robots, real fatwas, real research — not prediction. Each station links back into the museum."
  stations: "Stations on the road forward"
  anchors_label: "Anchored in the museum"
  tensions_title: "Open questions"
  tensions_lede: "The museum gives no verdict. Each card is a live debate."
  voices_title: "Voices already imagining"
  voices_lede: "Others have thought about this before us — scholars, engineers, artists. Some of what they wrote:"
  epilogue_title: "A standing invitation"
  epilogue: "This page will grow. When a new machine enters a mosque, when a scholar writes a new scenario, when you imagine something we have not — the future, like the museum, is under construction."
  sections:
    - k: "The congregation"
      t: "The congregation"
      d: "In 2077 the rows of a Friday prayer may bend around a lens, not a pillar — worshippers in mixed reality standing shoulder-to-shoulder with people on three continents. Guide robots already roll through the Grand Mosque answering questions in eleven languages; by then they may carry Zamzam, translate the sermon into every ear, and know which visitor is new and which has come for forty years. Yet the row was never about the building: it is the geometry of equals, and the question is whether a projection can stand in it."
      scene: mosque
      a:
        - id: "concept/luzum-al-jamaa"
          l: "Holding to the congregation"
        - id: "concept/row-prayer-saff"
          l: "Straightening the row"
    - k: "The text"
      t: "Learning the Qur'an"
      d: "A hifz companion that never tires: it hears your fortieth attempt with the patience of the first, catches the tajwid slip a tired teacher misses, and keeps a chain for everything it teaches — which reading, from which reciter, through which line of transmitters. Memorisation survived parchment, print and the cassette tape; the machine becomes one more carrier. And the museum's own rule already insists the text itself never comes from a machine."
      scene: hifz
      a:
        - id: "concept/hifz-preservation"
          l: "Memorisation as preservation"
    - k: "The chain"
      t: "Learning hadith"
      d: "The isnad was the world's first knowledge graph — a chain of named people, their dates, their travels, their honesty. In 2077 a learner walks that chain as a living map, and the machine does what the scholars of hadith once did by candlelight: checks whether two narrators could ever have met, whether a report drifts from its companions. The tool is new; the scepticism is fourteen centuries old."
      scene: isnad
      a:
        - id: "concept/isnad"
          l: "The isnad"
        - id: "concept/ittisal-al-isnad"
          l: "The unbroken chain"
    - k: "The road"
      t: "Walking the seerah"
      d: "Instead of reading that the hijra took days through the desert, a child in 2077 stands on that road at dawn — feels the heat, watches the guide lead the riders away from the trackers, waits inside the cave. The museum's journey maps are a first step; immersive retelling is the next. The story was always told this way — around fires, in mosques, in mothers' voices — only the fire changed."
      a:
        - id: "event/hijra"
          l: "The Hijra"
        - id: "place/jabal-thawr-madina"
          l: "The cave of Thawr"
    - k: "The pilgrimage"
      t: "Hajj in the age of crowd-flow"
      d: "Mecca already employs robots to hand out water, clean the marble and answer pilgrims. By 2077, crowd-flow intelligence may make the stampedes of history unthinkable, translation earbuds may retire the guide's sign language, and a farmer who will never afford the journey may walk a faithful simulation of the rites. And then the hard question scholars already ask: is presence the point?"
      scene: hajj
      a:
        - id: "place/mecca"
          l: "Mecca"
        - id: "concept/hajj-rulings"
          l: "The rulings of Hajj"
    - k: "Authority"
      t: "The mufti and the machine"
      d: "When every Muslim can ask the same model, two futures branch: one where ijtihad multiplies — open tools letting every scholar test a ruling against fourteen centuries of method — and one where a single algorithm quietly becomes the only authority on earth. Print ended the memoriser's monopoly; the database ended the polymath's. What the machine ends, or frees, is still being decided."
      a:
        - id: "concept/ijtihad"
          l: "Ijtihad"
        - id: "concept/al-fatwa-ala-al-fadaiyyat"
          l: "Fatwa"
    - k: "Beyond Earth"
      t: "Fiqh beyond the Earth"
      d: "It already happened once: in 2007 a fatwa council wrote eighteen pages so a Muslim astronaut could pray aboard a station that sees sixteen sunrises a day — face the Kaaba, or its projection, or the Earth, or anywhere; keep five prayers on launch-port time; move by intention if the limbs float free. In 2077 Muslims may live on Mars, in polar daylight, in habitats that spin. The questions sound new; the method — weigh, adapt, preserve the obligation — is among the oldest things in this museum."
      scene: space
      a:
        - id: "concept/awqat-al-salat"
          l: "The times of prayer"
    - k: "The network"
      t: "The ummah as a network"
      d: "By mid-century roughly one in three people will be Muslim — the largest and youngest religious community on Earth — sharing cities with billions of service machines. What does brotherhood mean when your colleague is synthetic? Endowments may become programmable waqf that release themselves at a trigger; zakah may move in money that counts itself. The ummah was always a network — of letters, of caravans, of isnads. The cables are only its newest flesh."
      scene: city
      a:
        - id: "concept/waqf"
          l: "Waqf"
    - k: "The museum"
      t: "And this museum"
      d: "Honesty makes the last station this one: a museum of Islam already written largely by machines, checked by rules, frozen into static pages — its own compromise between machine speed and human custody. In 2077 it may be a place you walk through, a graph you inhabit, a companion that knows which of its objects would move you. Whatever form it takes, its question will be the same as the one on this page."
  tensions:
    - q: "Can a machine lead the prayer?"
      d: "Guide robots already answer pilgrims' questions in Mecca. Whether a machine may stand as imam — or whether the voice must belong to a person who will be asked about it — is a live debate, not a settled one."
    - q: "Does a virtual Hajj count?"
      d: "Simulation can teach the rites to millions who will never travel. Scholars distinguish learning from performing — but the distance between a pilgrim's body and a headset raises a question about presence that every age has answered differently."
    - q: "One AI for every fatwa?"
      d: "If a billion Muslims ask the same model, authority concentrates in a way the ummah has never known — not even under caliphs. Some see the end of legal diversity; others see ijtihad finally democratised. Both cite the same history."
  voices:
    - l: "AI guide robots in the Grand Mosque of Mecca — The National, 2021"
      u: "https://www.thenationalnews.com/gulf-news/saudi-arabia/2021/11/15/makkahs-grand-mosque-launches-new-ai-robot-guides-that-speak-11-languages/"
    - l: "Malaysia's fatwa council: Guidelines for Performing Ibadah at the ISS, 2007"
      u: "https://www.muftiwp.gov.my/en/artikel/irsyad-fatwa/irsyad-fatwa-umum-cat/1975-irsyad-al-fatwa-series-33-praying-in-space"
    - l: "Scenarios of Muslim learning in the age of AI tutors — Islamic futures study, 2025"
      u: "https://doi.org/10.70177/ijonis.v2i5.2598"
    - l: "AI technologies for Hajj and Umrah — IEEE Access survey, 2024"
      u: "https://doi.org/10.1109/access.2024.3487923"
    - l: "Muslim Futures — special issue of the Journal of Muslims in Europe"
      u: "https://doi.org/10.1163/22117954-bja10112"
    - l: "The Future and the Artificial: an Islamic perspective — Future of Life Institute"
      u: "https://futureoflife.org/religion/the-future-and-the-artificial-an-islamic-perspective/"
    - l: "Muslim digital artists and the spiritual work of AI — Journal for the Study of Religious Experience"
      u: "https://rerc-journal.tsd.ac.uk/index.php/religiousexp/article/view/175"
  alts:
    mosque: "A stylized night mosque interior: faceless worshippers stand in one row beside a translucent holographic figure and a small service robot carrying water."
    hifz: "A faceless learner reads from a glowing open book while a floating companion orb listens, surrounded by soft sound rings."
    isnad: "A golden chain of glowing nodes winds across a dark field; small faceless figures stand at its links and a scanning ring checks two of them against each other."
    hajj: "Pilgrim dots circle a stylized Kaaba under a crescent moon while two small guide robots stand at the edge and sensing arcs sweep the crowd."
    space: "An astronaut floats in prayer inside a station window, a golden line of intention reaching down to a marked point on the Earth below."
    city: "A 2077 skyline of lit towers, a minaret and a dome; people and small robots share the street under a crescent moon while drones cross the sky."
