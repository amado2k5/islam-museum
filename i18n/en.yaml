  buymeacoffee_title: Buy Me a Coffee
  buymeacoffee_body: The museum's page on Buy Me a Coffee — buy a coffee with a small one-time gift, in Canadian dollars, toward hosting and running costs.
  buymeacoffee_cta: Buy a coffee
  other_title: Other ways to help
  other_body: If a monthly membership does not suit you, you can contribute code, reviews or translations, or share the museum with people you know.
  contribute: Contribute on GitHub
  share: Share the museum
  shop_title: A future gift shop
  shop_body: 'The museum plans, in the future, an online gift shop / bazaar in its own clear, separate section of this site, where items may be listed
    and sold for anyone who wishes to browse or shop there, to help toward the running costs. It will carry no ads, no spam and no soliciting, and
    visiting it will always be optional. It is a plan, not a shop that is open today — the museum itself is, and stays, free for everyone.'
  note: Support is optional — given as you wish, with no commitment and no obligation — and gives no control over the museum's content, its review or its direction. Editorial work is independent and the method is published.
