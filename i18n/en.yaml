bunuwwa:
  title: "Sonhood and Daughterhood in Islam Browser"
  lede: "Everything the museum's sources mention about sons and daughters and the filial bond: the children of the prophets and the Companions, kindness to parents and disobedience to them, orphans and suckling and weaning, the rights of the child — custody, the birth sacrifice, inheritance — and the sons and daughters of the stories, in the Qur'an, the two Sahihs, the Muwatta and the Sunan, the seerah books, the reports of the Companions and the Successors, and every harvested book — sourced records that grow as new texts land."
