ulama:
  title: "Ulama Browser: Thinkers, Scholars, Litterateurs, Muhaddiths and Writers"
  lede: "Every person of knowledge and the pen the museum's graph knows — the thinkers and philosophers, the scholars and jurists, the muhaddiths, the litterateurs and the writers, and the scientists of the pen — and everything the Qur'an, the Sunnah, the seerah and every harvested book says about them: who they were, what they stood for, what they said, what they wrote, and where the sources mention them. Every record carries its sources; every mention links to its passage."
  badge: Scholars and writers explorer
  hero_kufi: "Thinkers · Scholars · Muhaddiths · Litterateurs · Writers"
  hero_naskh: "The people of knowledge and the pen, and what the sources say about them"
  status: "This build holds {n} records in {s} sections; each record lists its sources, and the texts were written by AI agents from those sources and have not yet been read by a human."
  method_title: The browser's method
  method_note: "A person joins this browser when the record itself says who he was: a role or an occupation of scholarship — scholar, muhaddith, jurist, mufti, qadi, theologian, philosopher, historian, geographer, writer, teacher, preacher, and the scientists of the pen (poets keep their own wing and are out of this scope). A passage joins in three ways: a canonical 'mentions' edge naming a qualifying person; a reviewed table of Qur'an verses — Luqman the sage and the verses on the people of knowledge, on the pen and on writing (the frozen Tanzil text is never searched); or a guarded list of the scholars' names as the books write them, where a bare common name never counts alone. So a book harvested later brings its scholars and its mentions automatically. Sunni sources are the frame; where a person's views are contested the record says who held them."
  api: "The whole set is available at"
  topics_title: The browser's categories
  sections_title: The browser's sections
  filter_label: Filter the scholars and their mentions
  filter_none: No matches.
  empty: No scholars or mentions in this build yet.
  works_count: "{n} works on record"
  mentions_label: "mentions:"
  list_sep: " · "
  topics:
    alim: Scholars
    muhaddith: Muhaddiths
    mufakkir: Thinkers
    adib: Litterateurs
    katib: Writers
    scientist: Scientists of the pen
    mashahir: The famous
  topics_desc:
    alim: "The scholars: jurists, muftis, qadis, exegetes, teachers and preachers — those the sources call ulama."
    muhaddith: "The muhaddiths: collectors, critics and memorizers of the Prophet's reports, from the six books to the rijal masters."
    mufakkir: "The thinkers: theologians, philosophers and the scientists of the pen — astronomers, mathematicians, physicians, calligraphers."
    adib: "The litterateurs: masters of adab and eloquent prose, the al-Jahiz line."
    katib: "The writers: secretaries, historians, geographers and authors whose books carry the civilization."
    mashahir: "The famous: leaders, rulers, athletes and effective public figures documented for their standing in the Muslim world."
    scientist: "The knowledge professions beyond theology: science, mathematics, astronomy, medicine and calligraphy."
  sections:
    quran:
      title: In the Qur'an
      desc: "The reviewed verses: Luqman the sage and his counsels, the verses on the people of knowledge as a class, and the verses of the pen and of writing that the katib stands under."
    sunnah:
      title: In the Sunnah
      desc: "The hadith collections' reports that name the scholars, narrate from them, or speak of the people of knowledge."
    seerah:
      title: In the seerah
      desc: "What the seerah books carry of the scholars of the Companions and the Successors, their teachers and their students."
    books:
      title: In the other books
      desc: "History, rijal, tabaqat, commentary and adab: every harvested book that names a scholar — and whatever the next harvest brings."
    ulama:
      title: The scholars
      desc: "The scholars, jurists, muftis, qadis, teachers and preachers on record — their lives, mission, sayings, works and legacy."
    muhaddithun:
      title: The muhaddiths
      desc: "The muhaddiths on record: collectors and critics of the hadith, imams of isnad and rijal."
    mufakkirun:
      title: The thinkers
      desc: "The philosophers, theologians and scientists on record — reason and knowledge professions beside the transmitted sciences."
    udaba:
      title: The litterateurs
      desc: "The masters of adab on record: prose stylists and men of letters."
    kuttab:
      title: The writers
      desc: "The writers on record: historians, geographers, secretaries and authors."
    mashahir:
      title: The famous
      desc: "Effective public figures on record: leaders, rulers, athletes and celebrities."
    curated:
      title: Curated records
      desc: "Concepts, works, screens and events about scholarship itself — tagged records that belong to the browser though they are not a person or a passage."
  viz:
    title: "The council of knowledge"
    lede: "Five pillars for the five categories of the people of the pen, each raised to the height of the records it holds, under the arch of the majlis. Below them stand the figures the sources mention most. Every pillar and every name is a link."
    majlis_word: "مجلس العلم"
    caption: "{n} records in the council"
    lead_label: "Most mentioned in the sources:"
wasaya:
  title: "Testaments Browser: the Last Counsels of the Prophets, Caliphs, Companions, Successors, Imams and the Righteous, Their Legacies, Relics and Resting Places"
  lede: "Everything the museum's sources say about how the prophets and messengers, the caliphs, the Companions, the Successors, the imams and the righteous took their leave: what they enjoined on those they left, what they said in their last hours, what they left behind, which of their belongings were kept after them, and where the books say they were buried. Every item is a verse, a report or a record with its source."
  badge: Testaments explorer
  hero_kufi: "Testaments · Legacies · Relics · Graves"
  hero_naskh: "What they enjoined before they died, what they left, and where they rest"
  status: "This build holds {n} records in {s} sections; each record lists its sources, and the texts were written by AI agents from those sources and have not yet been read by a human."
  method_title: The browser's method
  method_note: "This browser gathers what is said and written on five connected matters: testaments and parting counsels, last hours, estates and what was left, relics, and burials and graves. Qur'an verses come from a reviewed table (the testaments of Ibrahim and Ya'qub, Luqman's counsels, the verses on bequest and inheritance, on relics and on death and burial); the verse text is the frozen Tanzil text and is never retyped. Every other passage — hadith, seerah, history, biography — is found at build time by a guarded word list, so a passage from a book harvested later appears here the day it lands. Book excerpts are machine-read from scans, quoted within forty words and not corrected. The jurists' general rules of inheritance are not gathered here: only the estates of named people and the Prophet's own words on inheritance. The identification of a grave is always the statement of the source cited, not of the museum. Sunni sources are the frame; any other view is labelled."
  api: "The whole set is available at"
  topics_title: The browser's five topics
  sections_title: The browser's sections
  filter_label: Filter the testament records
  filter_none: No matches.
  empty: No testament records in this build yet.
  topics:
    wasiyya: Testaments and counsels
    ihtidar: Last hours
    mirath: Estates and inheritance
    athar: Relics and traces
    marqad: Burials and graves
  topics_desc:
    wasiyya: "What they enjoined before death: the testaments of the prophets to their sons, the Prophet's parting counsels, the caliphs' covenants and counsels to their successors, written wills, and the rules of the bequest in the Qur'an and Sunnah."
    ihtidar: "The last illness and the deathbed: the last words, who was present, what was recited, and how the books report the hour of death."
    mirath: "What they left: money, land, weapons, books and debts; heirs and executors; and the Prophet's saying that the prophets are not inherited from."
    athar: "Belongings kept after their owners — the mantle, the ring, the sword, the hair — and the traces the Qur'an names, such as the Ark and the Station of Ibrahim."
    marqad: "Washing, shrouding, the funeral prayer and burial; the graves and cemeteries the sources name, and where reports differ on a grave's place."
  sections:
    quran:
      title: In the Qur'an
      desc: "The verses on the testaments of the prophets and the righteous, on the bequest and its witnesses, on inheritance among the prophets and the shares of an estate, on relics and traces, and on death, burial and the resting place."
    sunnah:
      title: In the Sunnah
      desc: "The books of bequests in the hadith collections, the Prophet's counsels and the reports of his last illness, death and burial, what he left, and the reports of the Companions' own testaments."
    seerah:
      title: In the seerah
      desc: "What the seerah books carry on the Farewell Pilgrimage, the last illness, the death and burial of the Prophet, his belongings, and the deaths and graves of those around him."
    books:
      title: In the other books
      desc: "History, biography, the books of the Companions and the ascetics, commentary and law: every harvested book beyond the Qur'an, the hadith and the seerah that reports a testament, a deathbed, an estate, a relic or a grave, and whatever comes next."
    prophets:
      title: The prophets and messengers
      desc: "The museum's records on the testaments, last hours and graves of the prophets, from Adam to the Prophet Muhammad's own parting counsels."
    caliphs:
      title: The caliphs
      desc: "The covenants, counsels, last hours, estates and graves of the Rightly Guided Caliphs and the caliphs and rulers after them."
    companions:
      title: The Companions
      desc: "The testaments, deathbeds, estates and graves of the Companions, men and women, as the books of biography report them."
    successors:
      title: The Successors and the imams
      desc: "The testaments, last hours and graves of the Successors and the imams of the schools of law."
    righteous:
      title: The righteous and the scholars
      desc: "The last counsels, deaths and graves of ascetics and scholars of later generations, and the museum's records on death, the good end and the bequest."
    legacy:
      title: Legacies and relics
      desc: "What was left behind: estates and charitable lands, weapons and belongings, and the relics kept after their owners."
    graves:
      title: Graves and resting places
      desc: "The burial chambers, cemeteries, tombs and shrines the museum describes; every identification is attributed to its source."
    works:
      title: The books
      desc: "The books of testaments and of the dying, and the histories of the graves and of Medina, that the museum describes."
  viz:
    title: "The five lines of the testament"
