  convert:
    btn: "Just converted"
    tagline: "Welcome. You are not alone, and you do not have to learn everything this week."
    lede: "This is the museum as seen from the first day of Islam: what to do first, what to ask, whom to tell, where to find your people, and what to do when it feels like too much. Go at your own pace. Nothing here is a test."
    mind:
      - "Did I do it right? Does it count?"
      - "What must I change today, and what can wait?"
      - "How do I tell my family, and what if they are hurt or angry?"
      - "I feel alone. Who is there for me?"
      - "Some days I doubt. Does that mean I made a mistake?"
      - "I want to understand how this compares with what I believed before."
    steps:
      - when: "The first days"
        title: "Breathe, and learn the basics"
        body: "Learn how prayer is done, how to wash for it, and a few short supplications. Most new Muslims start small. Nothing has to be perfect on day one."
      - when: "The first weeks"
        title: "Find one person"
        body: "One patient Muslim friend, one welcoming mosque or one online circle matters more than a hundred rules. Ask them the questions you think are silly."
      - when: "The first months"
        title: "Adjust, gently"
        body: "Food, drink, dress, work and conversations with family come up one at a time. Many new Muslims say that going step by step is what kept them steady."
      - when: "The first year"
        title: "Walk the whole year"
        body: "Meet Ramadan, the two Eids and the rhythm of the Muslim calendar. Read the life of the Prophet and a little Qur'an with commentary."
      - when: "The second year and after"
        title: "Make it your own"
        body: "The excitement settles into daily life. Doubt, dry spells and hard questions are common here too. They belong to the path; they do not end it."
    sections:
      - title: "What you need to know first"
        body: "The five pillars, prayer and purification, and the words of everyday supplication, explained simply and with their sources."
      - title: "Telling your family and friends"
        body: "Families react in many ways: relief, worry, hurt, silence. Think about timing, tone and whom to tell first, and tell someone you trust before you tell everyone. These pages show what the tradition says about parents, family and friendship."
      - title: "Food, drink and what to let go of"
        body: "What is halal and what is not, as scholars set it out, with each view labelled. For things you already own, such as alcohol, read the discussion first and ask a trusted local scholar. The museum describes; it does not issue rulings."
      - title: "Finding your people"
        body: "Most places have mosques, new-Muslim circles, student societies, study groups and online communities. Look for ones that welcome questions, do not shame you and do not ask you to take sides. Start with the places the museum maps and the teachers it records."
      - title: "Shops, food, books and modest dress"
        body: "Halal groceries and restaurants, Islamic bookshops and modest-wear shops are usually found through local directories, mosque notice boards and your new circle. The museum shows the traditions behind them."
      - title: "Learn at your own pace"
        body: "Short guided paths and full courses, the life of the Prophet, the messengers before him, and the Qur'an."
      - title: "Comparing with what you knew"
        body: "If you come from Christianity, Judaism or another path, you may want to compare. The museum records the prophets Muslims share with other faiths, the peoples and religions of history, and classical debates between faiths, each with its sources."
      - title: "When doubt or hardship comes"
        body: "Doubt, regret, tiredness and loneliness are common in the first two years and are discussed openly in classical writing. Read the questions others ask, take breaks, and talk to someone before you decide anything big. If you step back, the museum will still be here."
      - title: "Getting to know yourself"
        body: "Islam asks for character, repentance and an honest reckoning with yourself. These pages on good deeds, wrong deeds and character invite you to look inward without being judged."
    note: "The museum now lists a first set of organisations, shops and tools below, each opened and read on 23 November 2026. It does not yet list local halal shops, mosque convert groups in every city, Discord servers or forums: their addresses change, and the museum lists only what it has opened and read. Ask at a local mosque, and be careful of anyone who asks you for money or pressures you."
  doubter:
    btn: "Still deciding"
    tagline: "Take your time. Nobody here is counting your hours."
    lede: "This view is for someone who has not decided. It does not try to win you. It sets out the sources, the strongest questions and the range of views, and leaves the decision where it belongs: with you."
    mind:
      - "Is it true? How would I know?"
      - "What would I have to give up, and what might I gain?"
      - "What would my family and friends think?"
      - "What do I make of the things that trouble me about Islam or about Muslims?"
      - "How is this different from what I already believe?"
      - "I am afraid of deciding too early, or too late."
    sections:
      - title: "Begin with the shortest introduction"
        body: "A short guided path, then the beliefs and practices in plain words."
      - title: "Read it for yourself"
        body: "The Qur'an with classical commentary, and the life of the Prophet, from the sources and not from summaries."
      - title: "The hardest questions, every view, no verdict"
        body: "Hard questions are set out with the best voices on each side, cited, and no verdict."
      - title: "Compare with other beliefs"
        body: "The prophets, peoples and religions that Muslims and others share or disagree about, and classical debates."
      - title: "What a Muslim's day and year look like"
        body: "Prayer, fasting, charity and the calendar, so you can picture the life before you choose it."
      - title: "Meet Muslims through their words"
        body: "Scholars, teachers and ordinary lives across fourteen centuries."
      - title: "Signs and reasons Muslims point to"
        body: "Muslims cite signs in nature, in the Qur'an and in history as reasons for belief. The museum shows them with their sources."
    note: "The museum cannot tell you what to believe and does not try. It has no chat or counselling service. If you would like to speak to a person, a local mosque or an interfaith group may host open conversations. Take someone you trust the first time."
  researcher:
    btn: "Researcher"
    tagline: "Everything cited, everything linked, everything open."
    lede: "For students, writers, teachers and scholars, Muslim or not: a graph of records with sources, dates, relations and open data. Start from your question, follow the links, and check the citation."
    mind:
      - "Where does this fact come from, and how reliable is the source?"
      - "Can I cite it, export it and verify it?"
      - "How are contested topics handled?"
      - "Which dates, places and chains of people connect these events?"
      - "Is there data I can reuse?"
    sections:
      - title: "Search the whole graph"
        body: "Full-text search in every language, and the graph of people, places, works and events."
      - title: "Method and sources"
        body: "How records are written, what counts as a source, and how reliability is marked."
      - title: "Time and place"
        body: "The timeline, the calendar and the maps put every person and event in their century and country."
      - title: "People, books and networks"
        body: "Scholars, Companions and works, joined by teacher, student and family relations."
      - title: "The texts"
        body: "The Qur'an, its commentaries and its recitations."
      - title: "Open data and the API"
        body: "The data is open and available as a static API, free to reuse under its licences."
      - title: "Disagreement, mapped"
        body: "Schools of law, classical debates and rulings side by side."
    note: "Records are written with the help of AI agents from cited sources, carry a provenance note, and many have not been read by a human. Check the citation, then check the source."
  learner:
    btn: "Learning my deen"
    tagline: "Start where you are. The next small step is enough."
    lede: "For a Muslim who wants to know more and do better but does not know where to begin. Short steps, in an order that makes sense: from the basics of worship to character, the Qur'an and the life of the Prophet."
    mind:
      - "Where do I even start?"
      - "I pray inconsistently and feel guilty."
      - "I know the rules but not the reasons."
      - "I want to understand the Qur'an, not only recite it."
      - "I want to do better with family, work and money."
      - "There are many opinions. Whom do I trust?"
    sections:
      - title: "Fix the foundations"
        body: "The pillars, purification, prayer and fasting, step by step, with their evidence."
      - title: "A daily rhythm"
        body: "Supplications for each occasion, and the Muslim calendar to plan your year."
      - title: "Understand the Qur'an"
        body: "Read it with classical commentary, so that you hear what it says and not only how it sounds."
      - title: "Walk with the Prophet"
        body: "His life, the messengers before him and the Companions around him."
      - title: "Character, family and work"
        body: "Good character, home life, friendship and honest earning."
      - title: "Know the schools and the scholars"
        body: "Why scholars differ, and how to ask an informed question."
      - title: "Courses to follow"
        body: "Guided courses and trails, a step at a time."
      - title: "When you slip"
        body: "Repentance, small good deeds and returning, without despair."
    note: "The museum describes what scholars say and labels each view. It does not issue rulings. For a personal question, ask a qualified teacher you trust."
  critic:
    btn: "Critic"
    tagline: "Bring your strongest objection. The sources are open."
    lede: "For someone who thinks Islam is wrong, harmful or not a true religion, or who wants to argue for another faith or none. Test it against the evidence. The museum cites its sources, labels each view before stating it and keeps its hard questions in plain sight. It will not insult you, and it asks the same of you."
    mind:
      - "I think this religion is false, or dangerous."
      - "I want to find the contradictions and the ugly parts."
      - "I distrust anything that sounds like a sales pitch."
      - "I defend my own faith, and I want to see how Islam stands beside it."
      - "I want Muslims' own texts, not their defenders' summaries."
    sections:
      - title: "Check the claims against the sources"
        body: "How each record is sourced, what the museum counts as evidence, and how to check a citation yourself."
      - title: "Read the texts as they are"
        body: "The Qur'an with classical commentary, and the life of the Prophet, in the original traditions."
      - title: "The hardest topics, every view, no verdict"
        body: "Battles, penal law and legal rulings, with the Sunni position labelled first, then academic and other views, each cited."
      - title: "Classical debates between faiths"
        body: "How Muslims, Christians, Jews and others argued with one another, as history."
      - title: "Where Muslims disagree with each other"
        body: "Schools of law and scholars who differ, with the reasoning of each."
      - title: "History with its faults"
        body: "The caliphs, the battles and the centuries, as they are recorded."
      - title: "Argue with the data"
        body: "The graph, the open data and search, so you can test any claim for yourself."
    note: "The museum is written from the Sunni tradition and says so. That is a labelled starting frame, and other views are labelled when they are shown. A claim with no citation is a flaw to report, not a hidden doctrine. The museum is not a debate platform and has no comments."

nuzul:
  title: "Asbab al-Nuzul Browser"
  lede: "Every report of an occasion of revelation the museum's sources carry — the event or question behind a verse or sura: the first revelation in the cave of Hira, the occasions of the hijab, wine, ifk, li'an and zihar verses and the change of the qibla — as the Companions, the Successors and the books of tafsir, hadith and seerah report them, and every occasion in every harvested book — sourced records that grow as new texts land."
  badge: Occasions-of-revelation explorer
  status: "This build holds {n} records in {s} sections; the texts are drafts until a human reads them."
  method_title: The browser's method
  method_note: "Every record here is an ordinary museum record — with its sources and its prose. Occasions are found at build time by a guarded detector over the passage texts — the explicit occasion formulae («سبب نزول», «أسباب النزول») and the revelation formulae tied to a verse context («نزلت هذه الآية», «فأنزل الله», «نزلت في فلان», «نزل جبريل»), which must sit beside an ayah, sura or Qur'an word; the other descent senses stay out — rain, hail, flood, calamity, guests, the descent of Isa and the medical senses — verified false positives are excluded by id, and every book harvested later brings its occasions here automatically once its passages land in the graph; curated records join through the nuzul-browser tag. Each passage is marked occasion when it reports an actual occasion and mention when it is about the science of asbab al-nuzul, and narrator chips class the report prophetic, companion, tabi'i or later."
  api: "The whole set is available at"
  sections_title: The browser's sections
  narrators_title: Report generation
  all_narrators: "All generations"
  filter_label: Filter the occasions
  filter_none: No results.
  empty: No occasion-of-revelation records in this build yet.
  kinds:
    occasion: "reports an occasion"
    mention: "about the science"
  narrators:
    prophetic: "Prophetic"
    companion: "Companion"
    tabii: "Tabi'i"
    later: "Later"
  sections:
    quran:
      title: "In the Qur'an"
      desc: "What the Qur'an itself says about the circumstances of its descent — the verses that name the event or the question they answer, and the passages of the frozen corpus that report an occasion."
    sunnah:
      title: "In the Sunnah"
      desc: "The occasion reports of the hadith collections — what the Prophet explained when a verse came down, the questions put to him and the incidents the verses answered, in Sahih al-Bukhari, Sahih Muslim, the Muwatta and the Sunan."
    seerah:
      title: "In the Seerah"
      desc: "The occasions the seerah and history books carry — the revelation episodes inside the biography's events — filling itself as new seerah passages land."
    books:
      title: "In the other books"
      desc: "The occasion reports of every other harvested work — the asbab and tafsir books, history, adab — classed by work genre as their passages arrive."
    curated:
      title: "The records about the occasions"
      desc: "The museum's curated records about the occasions themselves: the famous occasions of revelation as named records, the asbab works and their editions, and the science's concepts."
  viz:
    title: "Where the occasions stand"
    caption: "The beams descend from the sky line to the surahs that carry an occasion report here — {n} records on their surahs; {e} more, with no surah number, are in the lists below."
    how: "Choose a generation to colour the beams by its reports only; choose it again to see them all."
    hint: "Hover, focus or tap a beam to see where it lands."
    sky_title: "The surahs, in Mushaf order"
    sky_note: "{n} of the {total} surahs carry an occasion report; the rest are faint."
    count_in: "{n} records"

tajwid:
  title: "Tajwid and Tilawah Browser"
  lede: "Everything the museum's sources say about how the letters of the Qur'an are pronounced and how its recitation is performed: the seventeen makharij and the letters' sifat, the mudud, the ghunna, the qalqala and the rules of nun sakinah, mim sakinah and the tanwin, the waqf and the ibtida'; the tartil the Qur'an commands, the etiquette of reciting and listening, the melodies debated under their holders' names, and the reciters and the teaching texts that carry the craft. Every verse, report and book passage is cited, and every opinion is attributed to the one who held it."
  badge: Tajwid and tilawah explorer
  hero_ayah: "وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا"
  hero_naskh: "How the letters rise from their makharij and how the recitation is performed"
  status: "This build holds {n} records in {s} sections; each record lists its sources, and the texts were written by AI agents from those sources and have not yet been read by a human."
  method_title: The browser's method
  method_note: "This browser gathers what is said and written on two connected matters: how the letters are pronounced — their makharij, sifat and rulings — and how the recitation is performed, heard and taught. Qur'an verses come from a reviewed table: the verses of tartil and true tilawa, the etiquette of the one who recites and the one who hears, and the recitation taught and heard. Qur'an text appears in the museum only from its frozen files, so a verse's words are never retyped. Every other text — hadith, seerah, reports of the Companions and Successors, and books — is found at build time by a guarded lexicon over each passage, so a mention in a book harvested later appears the day its passage lands. The browser gives no verdict: where scholars differ, as on melodies and maqamat, the record gives each view with its holder."
  api: "The whole set is available at"
  topics_title: The browser's seven topics
  sections_title: The browser's sections
  filter_label: Filter the tajwid and tilawah records
  filter_none: No matches.
  empty: No tajwid or tilawah records in this build yet.
  kin_title: Sister browsers
  topics:
    tartil: Measured recitation
    adab: The etiquette of recitation
    ahkam: "The rules: makharij and sifat"
    qurra: The reciters and teachers
    mutun: The teaching texts
    maqamat: The melodies
    taalim: Teaching and learning
  topics_desc:
    tartil: "The command to recite the Qur'an with tartil, to follow its recitation and to hold the tongue steady, and what is reported of the measured paces: tahzir, tadwir, hadr and tarsil."
    adab: "The isti'adha and the basmala, a beautiful voice with the Qur'an, listening and keeping silent, the prostrations of recitation and the completion, and reciting aloud or under the breath."
    ahkam: "The seventeen makharij and the letters' sifat, the mudud, the ghunna, the qalqala, tafkhim and tarqiq, the rules of nun sakinah, mim sakinah and the tanwin, and the waqf and ibtida'."
    qurra: "The readers among the Companions and Successors, the seven and the ten imams and their transmitters, the shaykhs of the teaching, and the classes of the qurra'."
    mutun: "The tajwid matns that are studied and memorised: Tuhfat al-Atfal, the Jazariyya, the Shatibiyya, Tayyibat al-Nashr and the other teaching texts of the readings."
    maqamat: "Melody and maqamat in recitation: a debated art; the record gives each view under its holder."
    taalim: "Teaching and learning the recitation: 'the best of you are those who learn the Qur'an and teach it', the circles and the kuttab, and reciting to the shaykhs."
  sections:
    quran:
      title: In the Qur'an
      desc: "The verses commanding tartil and true tilawa, the etiquette of the one who recites and the one who hears, and the recitation taught and heard — from a table reviewed against the verses and the books."
    sunnah:
      title: In the Sunnah
      desc: "What the hadith collections report of the Prophet's recitation, of a beautiful voice with the Qur'an, of the etiquette of reciting and listening, and the reports of readers and teachers."
    seerah:
      title: In the seerah
      desc: "What the seerah books carry of the reciting and teaching of the Qur'an in the events of the call — this section fills itself as new seerah texts with such mentions land."
    tafsir:
