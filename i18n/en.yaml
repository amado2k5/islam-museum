  viz:
    title: "The scale of the five rulings"
    note: "The books of usul al-fiqh divide what the Lawgiver says of an act into five. A demand to act is the obligatory when leaving it is blamed and the recommended when it is not; a demand to leave is the forbidden when doing it is blamed and the disliked when it is not; and where there is a choice the act is permitted. The browser's themes stand on the degree they belong to, with the number of records each holds; obedience spans the two degrees of doing, and the minor sins belong to the side of leaving."
