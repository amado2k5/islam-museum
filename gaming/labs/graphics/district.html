<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Graphics lab: reference district</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8e2d4; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas { display: block; max-width: 100vw; max-height: 100vh; }
      #hud { position: fixed; left: 12px; top: 12px; padding: 10px 12px; background: rgba(8, 12, 18, 0.72); border: 1px solid rgba(232, 226, 212, 0.18); border-radius: 8px; white-space: pre; pointer-events: none; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; white-space: pre-wrap; }
      #bench-result { position: fixed; right: 12px; bottom: 12px; max-width: 46vw; max-height: 60vh; overflow: auto; padding: 10px 12px; background: rgba(8, 12, 18, 0.82); border: 1px solid rgba(232, 226, 212, 0.18); border-radius: 8px; white-space: pre; display: none; }
      body.clean #hud, body.clean #bench-result { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view" aria-label="Rendered view of the reference district"></canvas></div>
    <div id="status" role="status">Starting…</div>
    <div id="hud" aria-hidden="true"></div>
    <pre id="bench-result"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
