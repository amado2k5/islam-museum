prepare:
  ar:
    - "اختر 5 مدارس: اجمع أسماء المدارس المهتمة وبيانات التواصل مع إداراتها."
    - "جهّز الأجهزة: تأكد من وجود شاشة عرض واتصال إنترنت في كل فصل مشارك (أو نسخة مطبوعة احتياطية)."
    - "درّب المعلمين: ورشة واحدة (ساعتان) لشرح المنصة وخطط الدروس الست."
    - "اطبع المواد: مخطط ملصقات اللطف وأوراق العمل لكل تلميذ قبل الأسبوع الأول."
    - "حدّد الجدول: 4 أسابيع، حصة واحدة أسبوعيًّا (40 دقيقة) لكل فصل."
  en:
    - "Choose 5 schools: collect the names of interested schools and contact details for their administrations."
    - "Prepare devices: make sure each participating classroom has a display screen and internet access (or a printed backup)."
    - "Train teachers: one workshop (2 hours) covering the platform and the six lesson plans."
    - "Print materials: kindness sticker charts and worksheets for every student before week one."
    - "Fix the schedule: 4 weeks, one 40-minute session per week per classroom."
  ur:
    - "5 اسکول چنیں: دلچسپی رکھنے والے اسکولوں کے نام اور ان کی انتظامیہ کی رابطہ معلومات جمع کریں۔"
    - "آلات تیار کریں: یقینی بنائیں کہ ہر شریک جماعت میں ڈسپلے اسکرین اور انٹرنیٹ کنکشن ہو (یا چھپی ہوئی احتیاطی نقل)۔"
    - "اساتذہ کی تربیت: ایک ورکشاپ (2 گھنٹے) جس میں پلیٹ فارم اور چھ سبق کے منصوبے شامل ہوں۔"
    - "مواد چھپوائیں: پہلے ہفتے سے پہلے ہر طالب علم کے لیے مہربانی کے اسٹکر چارٹ اور ورک شیٹس۔"
    - "نظام الاوقات طے کریں: 4 ہفتے، ہر جماعت کے لیے ہفتے میں ایک 40 منٹ کا سیشن۔"

weeks:
  - title: { ar: "الأسبوع الأول: الانطلاق", en: "Week 1: Launch", ur: "پہلا ہفتہ: آغاز" }
    points:
      ar:
        - "ابدأ بحديقة الكلمة ورحلة الأنبياء — تجربة استكشاف ممتعة تكسر الحاجز."
        - "وزّع مخطط اللطف وابدأ تحدي الثلاثين يومًا من اليوم الأول."
        - "اجمع انطباعات المعلمين الأولية في نهاية الأسبوع."
      en:
        - "Start with the Word Garden and the Prophet Quest — a fun exploratory experience that breaks the ice."
        - "Hand out the kindness chart and begin the 30-day challenge from day one."
        - "Collect the teachers' first impressions at the end of the week."
      ur:
        - "لفظوں کے باغ اور نبی کے سفر سے آغاز کریں — ایک دلچسپ دریافتی تجربہ جو جھجھک توڑ دیتا ہے۔"
        - "مہربانی کا چارٹ تقسیم کریں اور پہلے دن سے 30 دن کا چیلنج شروع کریں۔"
        - "ہفتے کے آخر میں اساتذہ کے ابتدائی تاثرات جمع کریں۔"

  - title: { ar: "الأسبوع الثاني: التعمّق", en: "Week 2: Going deeper", ur: "دوسرا ہفتہ: گہرائی میں جانا" }
    points:
      ar:
        - "طبّق درس «أعد الحكاية» — يكتب كل تلميذ قصة نبي بكلماته."
        - "تابع تقدّم تحدي اللطف وناقش الصعوبات مع الفصل."
        - "ابدأ دفاتر القيم بتدوينة جماعية أولى."
      en:
        - "Run the 'retell the story' lesson — each student writes a prophet's story in their own words."
        - "Track the kindness challenge's progress and discuss difficulties with the class."
        - "Start the values journals with a first group entry."
      ur:
        - "'کہانی دوبارہ سنائیں' کا سبق چلائیں — ہر طالب علم نبی کی کہانی اپنے الفاظ میں لکھتا ہے۔"
        - "مہربانی کے چیلنج کی پیش رفت پر نظر رکھیں اور جماعت کے ساتھ مشکلات پر بات کریں۔"
        - "قدروں کی ڈائریاں گروہی پہلی تحریر سے شروع کریں۔"

  - title: { ar: "الأسبوع الثالث: المشاركة", en: "Week 3: Sharing", ur: "تیسرا ہفتہ: شراکت" }
    points:
      ar:
        - "نظّم «يوم الرواة»: يقرأ التلاميذ حكاياتهم أمام الفصل."
        - "اعرض بطاقات الجسر «جاهز للمتحف الكبير؟» على القراء المتقدمين."
        - "اجمع عينة من أوراق العمل ودفاتر القيم (بموافقة أولياء الأمور)."
      en:
        - "Organize 'storytellers' day': students read their retellings in front of the class."
        - "Show the 'ready for the big museum?' bridge cards to advanced readers."
        - "Collect a sample of worksheets and journals (with parents' consent)."
      ur:
        - "'کہانی سنانے والوں کا دن' منعقد کریں: طلبہ جماعت کے سامنے اپنی کہانیاں پڑھیں۔"
        - "آگے بڑھے ہوئے قارئین کو 'بڑے عجائب گھر کے لیے تیار؟' والے پُل کارڈ دکھائیں۔"
        - "ورک شیٹس اور ڈائریوں کا نمونہ جمع کریں (والدین کی رضامندی سے)۔"

  - title: { ar: "الأسبوع الرابع: التقييم", en: "Week 4: Review", ur: "چوتھا ہفتہ: جائزہ" }
    points:
      ar:
        - "أعد نشاطًا مفضلًا واحدًا من الأسابيع السابقة بناءً على تصويت الفصل."
        - "وزّع استبيان التقييم على المعلمين والتلاميذ."
        - "احتفل بإنجازات الفصل: شهادات «راوي صغير» لكل مشارك."
      en:
        - "Repeat one favorite activity from the previous weeks, based on the class vote."
        - "Distribute the evaluation survey to teachers and students."
        - "Celebrate the class's achievements: 'little storyteller' certificates for every participant."
      ur:
        - "جماعت کے ووٹ کی بنیاد پر پچھلے ہفتوں کی ایک پسندیدہ سرگرمی دوبارہ کروائیں۔"
        - "اساتذہ اور طلبہ میں جائزے کا سروے تقسیم کریں۔"
        - "جماعت کی کامیابیوں کا جشن منائیں: ہر شریک کے لیے 'چھوٹا کہانی گو' کی اسناد۔"

feedback_questions:
  ar:
    - "ما النشاط الذي أحبّه التلاميذ أكثر؟ ولماذا برأيك؟"
    - "ما الصعوبة التقنية أو التربوية التي واجهتك؟ وكيف تغلّبت عليها؟"
    - "هل لاحظت تغيّرًا في سلوك التلاميذ أو اهتمامهم بعد الأسابيع الأربعة؟"
  en:
    - "Which activity did the students love most? Why do you think so?"
    - "What technical or teaching difficulty did you face? How did you overcome it?"
    - "Did you notice any change in the students' behavior or engagement after the four weeks?"
  ur:
    - "طلبہ کو کون سی سرگرمی سب سے زیادہ پسند آئی؟ آپ کے خیال میں ایسا کیوں ہے؟"
    - "آپ کو کون سی تکنیکی یا تدریسی مشکل پیش آئی؟ آپ نے اس پر کیسے قابو پایا؟"
    - "چار ہفتوں کے بعد کیا آپ نے طلبہ کے رویے یا دلچسپی میں کوئی تبدیلی دیکھی؟"

