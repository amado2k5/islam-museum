paths:
  - path_slug: qisas-al-anbiya
    title: { ar: "قصص الأنبياء", en: "Stories of the Prophets" }
    desc:
      ar: "رحلة عبر قصص خمسة من الأنبياء: نستكشف حكاياتهم في الرحلة التفاعلية، ونستمع إلى قصص ما قبل النوم، ثم نعيد روايتها بكلماتنا. في نهاية المسار يستطيع كل تلميذ أن يحكي قصة نبي كاملة بثقة."
      en: "A journey through the stories of five prophets: we explore their tales in the interactive quest, listen to bedtime stories, then retell them in our own words. By the end of the path, every student can tell a prophet's story with confidence."
    units: [quest, stories, retell]

  - path_slug: al-akhlaq
    title: { ar: "الأخلاق", en: "Good Character" }
    desc:
      ar: "مسار عملي لبناء الخلق الحسن: نبدأ بتحدي اللطف اليومي لمدة ثلاثين يومًا، ثم نستلهم القيم من قصص الأنبياء، وندوّن رحلتنا في دفتر القيم. الهدف أن يتحوّل الخلق الحسن إلى عادة يومية."
      en: "A hands-on path to good character: we begin with the 30-day kindness challenge, draw values from the prophets' stories, and record our journey in the values journal. The goal is to turn good character into a daily habit."
    units: [kindness, quest, journal]

  - path_slug: al-kalima-al-tayyiba
    title: { ar: "الكلمة الطيبة", en: "The Good Word" }
    desc:
      ar: "مسار لغوي وجداني: نلعب بحديقة الكلمات القرآنية ونكتشف معانيها، ونستمع إلى القصص، ثم نعبّر عن مشاعرنا وأفكارنا في دفتر القيم. الكلمة الطيبة تبدأ من الفهم وتنتهي بالعمل."
      en: "A language-and-heart path: we play in the Quranic word garden and discover meanings, listen to stories, then express our feelings and thoughts in the values journal. A good word starts with understanding and ends with action."
    units: [garden, stories, journal]

