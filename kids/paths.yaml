paths:
- path_slug: qisas-al-anbiya
  title:
    ar: قصص الأنبياء
    en: Stories of the Prophets
    ur: انبیاء کے قصے
    fr: Les histoires des prophètes
    tr: Peygamberlerin Hikayeleri
    id: Kisah Para Nabi
  desc:
    ar: 'رحلة عبر قصص خمسة من الأنبياء: نستكشف حكاياتهم في الرحلة التفاعلية، ونستمع إلى قصص ما قبل النوم، ثم نعيد روايتها بكلماتنا. في نهاية المسار يستطيع كل تلميذ أن يحكي قصة نبي كاملة بثقة.'
    en: 'A journey through the stories of five prophets: we explore their tales in the interactive quest, listen to bedtime stories, then retell them in our own words. By the end of the path, every student
      can tell a prophet''s story with confidence.'
    ur: 'پانچ نبیوں کے قصوں کا ایک سفر: ہم انٹرایکٹو سفر میں ان کی کہانیاں دریافت کرتے ہیں، سونے سے پہلے کی کہانیاں سنتے ہیں، پھر انہیں اپنے الفاظ میں دوبارہ سناتے ہیں۔ راستے کے اختتام تک ہر طالب علم اعتماد
      کے ساتھ کسی نبی کی کہانی سنا سکتا ہے۔'
    fr: 'Un parcours à travers les histoires de cinq prophètes : nous explorons leurs récits dans le voyage interactif, écoutons les histoires du soir, puis les racontons avec nos propres mots. À la fin
      du parcours, chaque élève peut raconter avec assurance l’histoire complète d’un prophète.'
    tr: 'Beş peygamberin hikayeleri yolculuğu: Etkileşimli yolculukta onların hikayelerini keşfeder, uyku öncesi hikayeleri dinler ve sonra kendi kelimelerimizle yeniden anlatırız. Yolun sonunda, her öğrenci
      tam bir kehanet hikayesini güvenle anlatabilir.'
    id: 'Sebuah perjalanan melalui kisah lima nabi: Kami mengeksplorasi kisah mereka dalam perjalanan interaktif, mendengarkan cerita sebelum tidur, lalu menceritakannya kembali dengan kata-kata kami sendiri.
      Di akhir jalur, setiap siswa dapat dengan percaya diri menceritakan kisah nubuat yang lengkap.'
  units:
  - quest
  - stories
  - retell
- path_slug: al-akhlaq
  title:
    ar: الأخلاق
    en: Good Character
    ur: اچھا اخلاق
    fr: Le bon comportement
    tr: Ahlak
    id: Moral
  desc:
    ar: 'مسار عملي لبناء الخلق الحسن: نبدأ بتحدي اللطف اليومي لمدة ثلاثين يومًا، ثم نستلهم القيم من قصص الأنبياء، وندوّن رحلتنا في دفتر القيم. الهدف أن يتحوّل الخلق الحسن إلى عادة يومية.'
    en: 'A hands-on path to good character: we begin with the 30-day kindness challenge, draw values from the prophets'' stories, and record our journey in the values journal. The goal is to turn good character
      into a daily habit.'
    ur: 'اچھے اخلاق کی طرف ایک عملی راستہ: ہم 30 دن کے مہربانی کے چیلنج سے شروع کرتے ہیں، نبیوں کے قصوں سے قدریں اخذ کرتے ہیں، اور اپنا سفر قدروں کی ڈائری میں درج کرتے ہیں۔ مقصد یہ ہے کہ اچھا اخلاق روزانہ
      کی عادت بن جائے۔'
    fr: 'Un parcours pratique pour cultiver le bon comportement : nous commençons par le défi de la gentillesse sur trente jours, puis nous inspirons des valeurs des récits des prophètes et consignons notre
      cheminement dans le journal des valeurs. L’objectif est de faire du bon comportement une habitude quotidienne.'
    tr: 'İyi karakter inşa etmenin pratik yolu: Otuz gün süren günlük bir iyilik meydan okumasıyla başlarız, ardından peygamberlerin hikayelerinden ilham alır ve yolculuğumuzu bir değer kitabına kaydederiz.
      Amaç, iyi karakterin günlük bir alışkanlık haline gelmesidir.'
    id: 'Jalan praktis untuk membangun karakter yang baik: Kami memulai dengan tantangan kebaikan harian selama tiga puluh hari, lalu mengambil inspirasi dari kisah para nabi dan mencatat perjalanan kami
      dalam buku nilai. Tujuannya adalah agar karakter baik menjadi kebiasaan harian.'
  units:
  - kindness
  - quest
  - journal
- path_slug: al-kalima-al-tayyiba
  title:
    ar: الكلمة الطيبة
    en: The Good Word
    ur: اچھی بات
    fr: La bonne parole
    tr: nazik söz
    id: kata baik
  desc:
    ar: 'مسار لغوي وجداني: نلعب بحديقة الكلمات القرآنية ونكتشف معانيها، ونستمع إلى القصص، ثم نعبّر عن مشاعرنا وأفكارنا في دفتر القيم. الكلمة الطيبة تبدأ من الفهم وتنتهي بالعمل.'
    en: 'A language-and-heart path: we play in the Quranic word garden and discover meanings, listen to stories, then express our feelings and thoughts in the values journal. A good word starts with understanding
      and ends with action.'
    ur: 'زبان اور دل کا ایک سفر: ہم قرآنی الفاظ کے باغ میں کھیلتے ہیں اور معنی دریافت کرتے ہیں، کہانیاں سنتے ہیں، پھر اپنے احساسات اور خیالات قدروں کی ڈائری میں لکھتے ہیں۔ اچھی بات سمجھ سے شروع ہوتی ہے
      اور عمل پر ختم ہوتی ہے۔'
    fr: 'Un parcours qui associe la langue et le cœur : nous jouons dans le jardin des mots du Coran pour en découvrir le sens, écoutons les récits, puis exprimons nos sentiments et nos idées dans le journal
      des valeurs. La bonne parole commence par la compréhension et se prolonge dans l’action.'
    tr: 'Dilsel ve duygusal bir yol: Kur''an kelimelerinin bahçesiyle oynar, anlamlarını keşfeder, hikayeleri dinler, ardından duygularımızı ve düşüncelerimizi bir değer kitabında ifade ederiz. Nazik bir
      kelime anlayışla başlar ve eylemle biter.'
    id: 'Jalan linguistik dan emosional: Kita bermain dengan taman kata-kata Al-Quran, menemukan maknanya, mendengarkan cerita, lalu mengekspresikan perasaan dan pikiran kita dalam buku nilai. Kata yang
      baik dimulai dengan pemahaman dan berakhir dengan tindakan.'
  units:
  - garden
  - stories
  - journal
