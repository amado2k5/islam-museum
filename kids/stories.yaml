stories:
  - slug: adam
    icon: 🌟
    prophet:
      ar: آدم
      en: Adam
      ur: "آدم"
    title:
      ar: أول صديق للنجوم
      en: The First Friend of the Stars
      ur: "ستاروں کا پہلا دوست"
    body:
      ar: "في ليلة هادئة، جلس آدم ورفع عينيه إلى السماء. كانت النجوم تومض مثل مصابيح صغيرة بعيدة. تذكّر آدم أن الله علّمه أسماء كل شيء يراه. فهمس بصوت ناعم: نجمة... قمر... سحابة بيضاء. ابتسم آدم ابتسامة دافئة، وامتلأ قلبه بالسلام. ثم أغمض عينيه، ودخل في نوم عميق وجميل."
      en: "On a quiet night, Adam sat and lifted his eyes to the sky. The stars twinkled like tiny, faraway lamps. Adam remembered that God had taught him the names of everything he saw. So he whispered in a soft voice: star... moon... white cloud. Adam smiled a warm smile, and his heart filled with peace. Then he closed his eyes, and drifted into a deep, lovely sleep."
      ur: "ایک پرسکون رات میں آدم بیٹھ گئے اور آسمان کی طرف نظر اٹھائی۔ ستارے دور کے چھوٹے چراغوں کی طرح ٹمٹما رہے تھے۔ آدم کو یاد آیا کہ اللہ نے انہیں ہر اس چیز کے نام سکھائے ہیں جو وہ دیکھتے ہیں۔ تو انہوں نے نرم آواز میں سرگوشی کی: ستارہ... چاند... سفید بادل۔ آدم نے ایک گرم مسکراہٹ مسکرائی، اور ان کا دل سکون سے بھر گیا۔ پھر انہوں نے آنکھیں بند کیں اور ایک گہری، پیاری نیند میں اتر گئے۔"
    talk:
      ar: ما اسم أجمل شيء رأيته اليوم؟
      en: What is the name of the most beautiful thing you saw today?
      ur: "آج تم نے جو سب سے خوبصورت چیز دیکھی اس کا نام کیا ہے؟"
  - slug: nuh
    icon: 🛶
    prophet:
      ar: نوح
      en: Noah
      ur: "نوح"
    title:
      ar: رحلة السفينة الهادئة
      en: The Ark's Quiet Journey
      ur: "کشتی کا پرسکون سفر"
    body:
      ar: بعد أيام طويلة، صار الماء هادئًا وصافيًا. كانت السفينة تطفو برفق، مثل ورقة على بحيرة ساكنة. داخل السفينة، نامت الحيوانات في أماكنها الدافئة، وعصافير صغيرة تختبئ تحت أجنحتها. جلس نوح قرب النافذة الصغيرة، يراقب الغروب وهو يلوّن السماء بالذهبي. تنفّس ببطء، وشعر بالطمأنينة تملأ قلبه. ثم أغمض عينيه، ودخل في نوم هادئ وعميق.
      en: After the long days, the water grew calm and clear. The ark floated gently, like a leaf on a still lake. Inside the ark, the animals slept in their warm places, and little birds tucked their heads under their wings. Noah sat by the small window, watching the sunset paint the sky gold. He breathed slowly, and felt calm fill his heart. Then he closed his eyes, and drifted into a quiet, deep sleep.
      ur: "لمبے دنوں کے بعد پانی پرسکون اور صاف ہو گیا۔ کشتی آہستگی سے تیرنے لگی، جیسے ساکن جھیل پر ایک پتا۔ کشتی کے اندر جانور اپنی گرم جگہوں پر سو گئے، اور چھوٹے پرندے اپنے سر پروں کے نیچے چھپا کر سو رہے تھے۔ نوح چھوٹی کھڑکی کے پاس بیٹھے، غروبِ آفتاب کو دیکھ رہے تھے جو آسمان کو سنہرا رنگ دے رہا تھا۔ انہوں نے آہستہ سانس لی اور ان کے دل میں سکون بھر گیا۔ پھر انہوں نے آنکھیں بند کیں اور ایک پرسکون، گہری نیند میں اتر گئے۔"
    talk:
      ar: ما الشيء الذي يجعلك تشعر بالهدوء؟
      en: What is something that makes you feel calm?
      ur: "کون سی چیز تمہیں پرسکون محسوس کراتی ہے؟"
  - slug: ibrahim
    icon: 🌙
    prophet:
      ar: إبراهيم
      en: Abraham
      ur: "ابراہیم"
    title:
      ar: إبراهيم والسماء الليلية
      en: Abraham and the Night Sky
      ur: "ابراہیم اور رات کا آسمان"
    body:
      ar: "في ليلة صافية، خرج إبراهيم إلى التلّة القريبة من بيته. استلقى على العشب البارد، ونظر إلى الأعلى. كانت النجوم تتلألأ فوقه مثل حبّات سكّر على قماش أزرق داكن. فكّر إبراهيم: من صنع كل هذا الجمال؟ ثم أدرك أن الخالق أعظم من كل ما يراه، وهو لا ينام ولا يغيب. ابتسم إبراهيم لهذه الفكرة الجميلة، وهمس: شكرًا. ثم أغمض عينيه تحت النجوم، ونام بسلام."
      en: "On a clear night, Abraham walked out to the hill near his home. He lay back on the cool grass and looked up. The stars glittered above him like sugar grains on dark blue cloth. Abraham wondered: who made all this beauty? Then he understood that the Creator is greater than anything he could see, and He never sleeps and never fades. Abraham smiled at this beautiful thought, and whispered: thank you. Then he closed his eyes beneath the stars, and slept in peace."
      ur: "ایک صاف رات میں ابراہیم اپنے گھر کے قریب ٹیلے کی طرف نکلے۔ وہ ٹھنڈی گھاس پر لیٹ گئے اور اوپر دیکھا۔ ستارے ان کے اوپر گہرے نیلے کپڑے پر چینی کے دانوں کی طرح جگمگا رہے تھے۔ ابراہیم نے سوچا: یہ سارا حسن کس نے بنایا؟ پھر انہوں نے سمجھ لیا کہ خالق ہر اس چیز سے بڑا ہے جو وہ دیکھ سکتے ہیں، وہ نہ سوتا ہے نہ غائب ہوتا ہے۔ ابراہیم اس خوبصورت خیال پر مسکرائے اور سرگوشی کی: شکریہ۔ پھر وہ ستاروں کے نیچے آنکھیں بند کر کے سکون سے سو گئے۔"
    talk:
      ar: ما أجمل شيء في السماء تحب أن تنظر إليه؟
      en: What is the most beautiful thing in the sky that you love to look at?
      ur: "آسمان کی وہ سب سے خوبصورت چیز کون سی ہے جسے تم دیکھنا پسند کرتے ہو؟"
  - slug: musa
    icon: 🌊
    prophet:
      ar: موسى
      en: Moses
      ur: "موسیٰ"
    title:
      ar: طريق موسى الهادئ
      en: Moses' Quiet Path
      ur: "موسیٰ کا پرسکون راستہ"
    body:
      ar: كان الليل قد حلّ، والبحر ساكن مثل مرآة كبيرة. وقف موسى على الشاطئ، وقلبه مطمئن لأن الله معه. وفجأة، انفتح في الماء طريق جاف وناعم، مثل ممرّ من الرمال الذهبية. مشى موسى وقومه بهدوء، والماء يقف على الجانبين مثل جدارين من الزجاج الأزرق. لم يخف أحد، فالطريق كان آمنًا والنجوم تراقبهم من فوق. وعندما وصلوا إلى الضفة الأخرى، جلسوا يستريحون تحت ضوء القمر، وقلوبهم مليئة بالشكر والسلام.
      en: Night had fallen, and the sea lay still like a great mirror. Moses stood on the shore, his heart at peace because God was with him. And suddenly, a dry, soft path opened in the water, like a walkway of golden sand. Moses and his people walked quietly, the water standing on both sides like walls of blue glass. No one was afraid, for the path was safe and the stars watched over them from above. When they reached the far shore, they sat down to rest under the moonlight, their hearts full of gratitude and peace.
      ur: "رات ہو چکی تھی، اور سمندر ایک بڑے آئینے کی طرح ساکن تھا۔ موسیٰ ساحل پر کھڑے تھے، ان کا دل مطمئن تھا کیونکہ اللہ ان کے ساتھ تھا۔ اور اچانک پانی میں ایک خشک اور نرم راستہ کھل گیا، جیسے سنہری ریت کی ایک گزرگاہ۔ موسیٰ اور ان کی قوم خاموشی سے چلنے لگے، پانی دونوں طرف نیلے شیشے کی دیواروں کی طرح کھڑا تھا۔ کسی کو ڈر نہیں لگا، کیونکہ راستہ محفوظ تھا اور ستارے اوپر سے انہیں دیکھ رہے تھے۔ جب وہ دوسرے کنارے پہنچے تو چاندنی میں آرام کرنے بیٹھ گئے، ان کے دل شکر اور سکون سے بھرے ہوئے تھے۔"
    talk:
      ar: متى شعرت بالأمان آخر مرة؟
      en: When was the last time you felt safe?
      ur: "تم نے آخری بار کب خود کو محفوظ محسوس کیا تھا؟"
  - slug: isa
    icon: 💛
    prophet:
      ar: عيسى
      en: Jesus
      ur: "عیسیٰ"
    title:
      ar: قلب عيسى الدافئ
      en: Jesus' Warm Heart
      ur: "عیسیٰ کا مہربان دل"
    body:
      ar: "في مساء دافئ، جلس عيسى تحت شجرة زيتون كبيرة. جاءه طفل صغير يبكي لأن لعبته انكسرت. مسح عيسى دموع الطفل بيده بلطف، وابتسم له ابتسامة دافئة. وقال له: لا تحزن، فالقلب الطيب أغلى من كل اللعب. ضحك الطفل من جديد، واحتضن عيسى بحب. ثم غنّت العصافير أغنية المساء، ونام الطفل في حضن أمّه، وقلبه مليء بالدفء."
      en: "On a warm evening, Jesus sat beneath a great olive tree. A little child came to him, crying because his toy had broken. Jesus gently wiped the child's tears with his hand, and smiled at him a warm smile. He said to him: do not be sad, for a kind heart is worth more than all the toys. The child laughed again, and hugged Jesus with love. Then the birds sang their evening song, and the child fell asleep in his mother's arms, his heart full of warmth."
      ur: "ایک گرم شام کو عیسیٰ ایک بڑے زیتون کے درخت کے نیچے بیٹھے تھے۔ ایک چھوٹا بچہ ان کے پاس آیا، رو رہا تھا کیونکہ اس کا کھلونا ٹوٹ گیا تھا۔ عیسیٰ نے نرمی سے اپنے ہاتھ سے بچے کے آنسو پونچھے، اور اسے ایک گرم مسکراہٹ کے ساتھ دیکھا۔ انہوں نے کہا: غمگین نہ ہو، کیونکہ ایک اچھا دل سب کھلونوں سے زیادہ قیمتی ہے۔ بچہ پھر سے ہنسنے لگا اور محبت سے عیسیٰ کے گلے لگ گیا۔ پھر پرندوں نے شام کا گیت گایا، اور بچہ اپنی ماں کی گود میں سو گیا، اس کا دل گرمجوشی سے بھرا ہوا تھا۔"
    talk:
      ar: ما ألطف شيء فعله أحد من أجلك؟
      en: What is the kindest thing someone has done for you?
      ur: "کسی نے تمہارے لیے مہربانی کا سب سے اچھا کام کون سا کیا ہے؟"
