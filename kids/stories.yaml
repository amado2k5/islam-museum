stories:
- slug: adam
  icon: 🌟
  prophet:
    ar: آدم
    en: Adam
    ur: آدم
    fr: Adam
    tr: Adam
    id: Adam
  title:
    ar: أول صديق للنجوم
    en: The First Friend of the Stars
    ur: ستاروں کا پہلا دوست
    fr: Le premier ami des étoiles
    tr: Yıldızların ilk dostu
    id: Sahabat pertama para bintang
  body:
    ar: 'في ليلة هادئة، جلس آدم ورفع عينيه إلى السماء. كانت النجوم تومض مثل مصابيح صغيرة بعيدة. تذكّر آدم أن الله علّمه أسماء كل شيء يراه. فهمس بصوت ناعم: نجمة... قمر... سحابة بيضاء. ابتسم آدم ابتسامة دافئة،
      وامتلأ قلبه بالسلام. ثم أغمض عينيه، ودخل في نوم عميق وجميل.'
    en: 'On a quiet night, Adam sat and lifted his eyes to the sky. The stars twinkled like tiny, faraway lamps. Adam remembered that God had taught him the names of everything he saw. So he whispered in
      a soft voice: star... moon... white cloud. Adam smiled a warm smile, and his heart filled with peace. Then he closed his eyes, and drifted into a deep, lovely sleep.'
    ur: 'ایک پرسکون رات میں آدم بیٹھ گئے اور آسمان کی طرف نظر اٹھائی۔ ستارے دور کے چھوٹے چراغوں کی طرح ٹمٹما رہے تھے۔ آدم کو یاد آیا کہ اللہ نے انہیں ہر اس چیز کے نام سکھائے ہیں جو وہ دیکھتے ہیں۔ تو انہوں
      نے نرم آواز میں سرگوشی کی: ستارہ... چاند... سفید بادل۔ آدم نے ایک گرم مسکراہٹ مسکرائی، اور ان کا دل سکون سے بھر گیا۔ پھر انہوں نے آنکھیں بند کیں اور ایک گہری، پیاری نیند میں اتر گئے۔'
    fr: 'Par une nuit calme, Adam était assis et regardait le ciel. Les étoiles scintillaient comme de petites lampes lointaines. Adam se souvenait que Dieu lui avait appris le nom de tout ce qu’il voyait.
      Il murmurait doucement : étoile… lune… nuage blanc. Adam sourit, et son cœur se remplit de paix. Puis il ferma les yeux et s’endormit d’un sommeil profond et doux.'
    tr: 'Sessiz bir gecede, Adem oturdu ve gözlerini gökyüzüne kaldırdı. Yıldızlar uzaktaki küçük lambalar gibi parladı. Adem, Tanrı''nın ona gördüğü her şeyin isimlerini öğrettiğini hatırladı. Yumuşakça
      fısıldadı: Yıldız... Ay... Beyaz bir bulut. Adem sıcak bir şekilde gülümsedi ve kalbi huzurla doldu. Sonra gözlerini kapattı ve derin, güzel bir uykuya daldı.'
    id: 'Pada malam yang sunyi, Adam duduk dan mengangkat matanya ke langit. Bintang-bintang berkedip seperti lampu kecil yang jauh. Adam teringat bahwa Tuhan mengajarinya nama-nama segala sesuatu yang
      ia lihat. Ia berbisik pelan: Bintang... Bulan... Awan putih. Adam tersenyum hangat, dan hatinya dipenuhi kedamaian. Lalu ia menutup mata dan terlelap dalam tidur yang dalam dan indah.'
  talk:
    ar: ما اسم أجمل شيء رأيته اليوم؟
    en: What is the name of the most beautiful thing you saw today?
    ur: آج تم نے جو سب سے خوبصورت چیز دیکھی اس کا نام کیا ہے؟
    fr: Comment s’appelle la plus belle chose que tu as vue aujourd’hui ?
    tr: Bugün gördüğünüz en güzel şeyin adı nedir?
    id: Apa nama benda terindah yang kamu lihat hari ini?
- slug: nuh
  icon: 🛶
  prophet:
    ar: نوح
    en: Noah
    ur: نوح
    fr: Noé
    tr: Noah
    id: Nuh
  title:
    ar: رحلة السفينة الهادئة
    en: The Ark's Quiet Journey
    ur: کشتی کا پرسکون سفر
    fr: Le voyage paisible de l’arche
    tr: Sessiz Gemi Yolculuğu
    id: Perjalanan Kapal yang Tenang
  body:
    ar: بعد أيام طويلة، صار الماء هادئًا وصافيًا. كانت السفينة تطفو برفق، مثل ورقة على بحيرة ساكنة. داخل السفينة، نامت الحيوانات في أماكنها الدافئة، وعصافير صغيرة تختبئ تحت أجنحتها. جلس نوح قرب النافذة
      الصغيرة، يراقب الغروب وهو يلوّن السماء بالذهبي. تنفّس ببطء، وشعر بالطمأنينة تملأ قلبه. ثم أغمض عينيه، ودخل في نوم هادئ وعميق.
    en: After the long days, the water grew calm and clear. The ark floated gently, like a leaf on a still lake. Inside the ark, the animals slept in their warm places, and little birds tucked their heads
      under their wings. Noah sat by the small window, watching the sunset paint the sky gold. He breathed slowly, and felt calm fill his heart. Then he closed his eyes, and drifted into a quiet, deep sleep.
    ur: لمبے دنوں کے بعد پانی پرسکون اور صاف ہو گیا۔ کشتی آہستگی سے تیرنے لگی، جیسے ساکن جھیل پر ایک پتا۔ کشتی کے اندر جانور اپنی گرم جگہوں پر سو گئے، اور چھوٹے پرندے اپنے سر پروں کے نیچے چھپا کر سو رہے
      تھے۔ نوح چھوٹی کھڑکی کے پاس بیٹھے، غروبِ آفتاب کو دیکھ رہے تھے جو آسمان کو سنہرا رنگ دے رہا تھا۔ انہوں نے آہستہ سانس لی اور ان کے دل میں سکون بھر گیا۔ پھر انہوں نے آنکھیں بند کیں اور ایک پرسکون، گہری
      نیند میں اتر گئے۔
    fr: Après de longues journées, l’eau était devenue calme et claire. L’arche flottait doucement, comme une feuille sur un lac tranquille. À l’intérieur, les animaux dormaient au chaud et les petits oiseaux
      avaient glissé leur tête sous leur aile. Noé était assis près de la petite fenêtre et regardait le soleil couchant peindre le ciel en or. Il respirait lentement, sentant le calme remplir son cœur.
      Puis il ferma les yeux et s’endormit profondément, en paix.
    tr: Uzun günlerin ardından su sakin ve berrak oldu. Gemi sakin bir göldeki yaprak gibi hafifçe süzülüyordu. Geminin içinde hayvanlar sıcak yerlerinde uyuyor, küçük kuşlar kanatlarının altında saklanıyordu.
      Noah küçük pencerenin yanında oturuyordu, gün batımını izliyordu, gökyüzü altın renge boyuyordu. Yavaşça nefes aldı, kalbini rahatlatıcı bir his hissetti. Sonra gözlerini kapattı ve sessiz, derin
      bir uykuya daldı.
    id: Setelah berhari-hari yang panjang, air menjadi tenang dan jernih. Kapal mengapung dengan lembut, seperti daun di danau yang tenang. Di dalam bahtera, hewan-hewan tidur di tempat hangat mereka, dan
      burung-burung kecil bersembunyi di bawah sayap mereka. Noah duduk di dekat jendela kecil, menyaksikan matahari terbenam yang mewarnai langit keemasan. Dia bernapas perlahan, merasakan ketenangan memenuhi
      hatinya. Lalu dia menutup mata dan terlelap dalam tidur yang tenang dan nyenyak.
  talk:
    ar: ما الشيء الذي يجعلك تشعر بالهدوء؟
    en: What is something that makes you feel calm?
    ur: کون سی چیز تمہیں پرسکون محسوس کراتی ہے؟
    fr: Qu’est-ce qui t’aide à te sentir calme ?
    tr: Sizi sakin hissettiren nedir?
    id: Apa yang membuatmu merasa tenang?
- slug: ibrahim
  icon: 🌙
  prophet:
    ar: إبراهيم
    en: Abraham
    ur: ابراہیم
    fr: Abraham
    tr: İbrahim
    id: Ibrahim
  title:
    ar: إبراهيم والسماء الليلية
    en: Abraham and the Night Sky
    ur: ابراہیم اور رات کا آسمان
    fr: Abraham et le ciel de nuit
    tr: İbrahim ve Gece Gökyüzü
    id: Ibrahim dan Langit Malam
  body:
    ar: 'في ليلة صافية، خرج إبراهيم إلى التلّة القريبة من بيته. استلقى على العشب البارد، ونظر إلى الأعلى. كانت النجوم تتلألأ فوقه مثل حبّات سكّر على قماش أزرق داكن. فكّر إبراهيم: من صنع كل هذا الجمال؟ ثم
      أدرك أن الخالق أعظم من كل ما يراه، وهو لا ينام ولا يغيب. ابتسم إبراهيم لهذه الفكرة الجميلة، وهمس: شكرًا. ثم أغمض عينيه تحت النجوم، ونام بسلام.'
    en: 'On a clear night, Abraham walked out to the hill near his home. He lay back on the cool grass and looked up. The stars glittered above him like sugar grains on dark blue cloth. Abraham wondered:
      who made all this beauty? Then he understood that the Creator is greater than anything he could see, and He never sleeps and never fades. Abraham smiled at this beautiful thought, and whispered: thank
      you. Then he closed his eyes beneath the stars, and slept in peace.'
    ur: 'ایک صاف رات میں ابراہیم اپنے گھر کے قریب ٹیلے کی طرف نکلے۔ وہ ٹھنڈی گھاس پر لیٹ گئے اور اوپر دیکھا۔ ستارے ان کے اوپر گہرے نیلے کپڑے پر چینی کے دانوں کی طرح جگمگا رہے تھے۔ ابراہیم نے سوچا: یہ سارا
      حسن کس نے بنایا؟ پھر انہوں نے سمجھ لیا کہ خالق ہر اس چیز سے بڑا ہے جو وہ دیکھ سکتے ہیں، وہ نہ سوتا ہے نہ غائب ہوتا ہے۔ ابراہیم اس خوبصورت خیال پر مسکرائے اور سرگوشی کی: شکریہ۔ پھر وہ ستاروں کے نیچے
      آنکھیں بند کر کے سکون سے سو گئے۔'
    fr: 'Par une nuit claire, Abraham se rendit sur la colline près de chez lui. Il s’allongea dans l’herbe fraîche et leva les yeux. Au-dessus de lui, les étoiles brillaient comme des grains de sucre sur
      un tissu bleu sombre. Abraham se demanda qui avait créé toute cette beauté. Il comprit alors que le Créateur est plus grand que tout ce qu’il pouvait voir, qu’il ne dort jamais et ne disparaît jamais.
      Cette belle pensée le fit sourire, et il murmura : merci. Puis il ferma les yeux sous les étoiles et dormit paisiblement.'
    tr: 'Açık bir gecede, İbrahim evinin yakınındaki tepeye çıktı. Soğuk çimenlerin üzerine uzandı ve yukarı baktı. Yıldızlar, koyu mavi bir kumaş üzerindeki şeker taneleri gibi parıldıyordu. İbrahim düşündü:
      Tüm bu güzelliği kim yarattı? Sonra Yaratıcı''nın gördüğü her şeyden daha büyük olduğunu ve ne uyumuş ne de kaybolduğunu fark etti. İbrahim bu güzel düşünceye gülümsedi ve fısıldadı: Teşekkür ederim.
      Sonra yıldızların altında gözlerini kapattı ve huzur içinde uyudu.'
    id: 'Pada malam yang cerah, Abraham pergi ke bukit dekat rumahnya. Ia berbaring di atas rumput dingin dan menatap ke atas. Bintang-bintang berkilauan di atasnya seperti butiran gula di atas kain biru
      tua. Abraham berpikir: Siapa yang menciptakan semua keindahan ini? Lalu ia menyadari bahwa Sang Pencipta lebih besar dari semua yang Ia lihat, dan Ia tidak tidur maupun menghilang. Abraham tersenyum
      pada pikiran indah itu dan berbisik: Terima kasih. Lalu ia menutup matanya di bawah bintang-bintang dan tidur dengan damai.'
  talk:
    ar: ما أجمل شيء في السماء تحب أن تنظر إليه؟
    en: What is the most beautiful thing in the sky that you love to look at?
    ur: آسمان کی وہ سب سے خوبصورت چیز کون سی ہے جسے تم دیکھنا پسند کرتے ہو؟
    fr: Quelle est la plus belle chose que tu aimes regarder dans le ciel ?
    tr: Gökyüzünde bakmayı sevdiğiniz en güzel şey nedir?
    id: Apa hal terindah di langit yang Anda suka lihat?
- slug: musa
  icon: 🌊
  prophet:
    ar: موسى
    en: Moses
    ur: موسیٰ
    fr: Moïse
    tr: Musa
    id: Musa
  title:
    ar: طريق موسى الهادئ
    en: Moses' Quiet Path
    ur: موسیٰ کا پرسکون راستہ
    fr: Le chemin paisible de Moïse
    tr: Musa'nın Sessiz Yolu
    id: Jalan Tenang Musa
  body:
    ar: كان الليل قد حلّ، والبحر ساكن مثل مرآة كبيرة. وقف موسى على الشاطئ، وقلبه مطمئن لأن الله معه. وفجأة، انفتح في الماء طريق جاف وناعم، مثل ممرّ من الرمال الذهبية. مشى موسى وقومه بهدوء، والماء يقف على
      الجانبين مثل جدارين من الزجاج الأزرق. لم يخف أحد، فالطريق كان آمنًا والنجوم تراقبهم من فوق. وعندما وصلوا إلى الضفة الأخرى، جلسوا يستريحون تحت ضوء القمر، وقلوبهم مليئة بالشكر والسلام.
    en: Night had fallen, and the sea lay still like a great mirror. Moses stood on the shore, his heart at peace because God was with him. And suddenly, a dry, soft path opened in the water, like a walkway
      of golden sand. Moses and his people walked quietly, the water standing on both sides like walls of blue glass. No one was afraid, for the path was safe and the stars watched over them from above.
      When they reached the far shore, they sat down to rest under the moonlight, their hearts full of gratitude and peace.
    ur: رات ہو چکی تھی، اور سمندر ایک بڑے آئینے کی طرح ساکن تھا۔ موسیٰ ساحل پر کھڑے تھے، ان کا دل مطمئن تھا کیونکہ اللہ ان کے ساتھ تھا۔ اور اچانک پانی میں ایک خشک اور نرم راستہ کھل گیا، جیسے سنہری ریت کی
      ایک گزرگاہ۔ موسیٰ اور ان کی قوم خاموشی سے چلنے لگے، پانی دونوں طرف نیلے شیشے کی دیواروں کی طرح کھڑا تھا۔ کسی کو ڈر نہیں لگا، کیونکہ راستہ محفوظ تھا اور ستارے اوپر سے انہیں دیکھ رہے تھے۔ جب وہ دوسرے
      کنارے پہنچے تو چاندنی میں آرام کرنے بیٹھ گئے، ان کے دل شکر اور سکون سے بھرے ہوئے تھے۔
    fr: 'La nuit était tombée et la mer était immobile comme un grand miroir. Moïse se tenait sur le rivage, le cœur tranquille, car Dieu était avec lui. Soudain, un chemin sec et doux s’ouvrit dans l’eau,
      comme une allée de sable doré. Moïse et son peuple avancèrent calmement, l’eau dressée de chaque côté comme des murs de verre bleu. Personne n’avait peur : le chemin était sûr et les étoiles veillaient
      sur eux. Arrivés sur l’autre rive, ils s’assirent pour se reposer au clair de lune, le cœur plein de gratitude et de paix.'
    tr: Gece çökmüştü ve deniz büyük bir ayna gibi duruyordu. Musa kıyıda duruyordu, kalbi huzurluydu çünkü Tanrı yanındaydı. Aniden, suya kuru, pürüzsüz bir yol açıldı, altın kumlardan oluşan bir geçit
      gibi. Musa ve halkı sessizce yürüdü, su iki yanında mavi camdan yapılmış iki duvar gibi duruyordu. Kimse korkmuyordu; yol güvenliydi ve yıldızlar yukarıdan onları izliyordu. Diğer kıyıya vardıklarında,
      ay ışığı altında dinlenerek oturdular, kalpleri minnettarlık ve huzurla doluydu.
    id: Malam telah tiba, dan laut masih seperti cermin besar. Musa berdiri di tepi pantai, hatinya tenang karena Tuhan bersamanya. Tiba-tiba, jalan kering dan halus terbuka ke air, seperti lorong pasir
      emas. Musa dan umatnya berjalan tenang, air berdiri di kedua sisi seperti dua dinding kaca biru. Tak ada yang takut; jalan aman dan bintang-bintang mengawasi mereka dari atas. Saat mereka sampai di
      tepi lain, mereka duduk beristirahat di bawah sinar bulan, hati mereka penuh rasa syukur dan kedamaian.
  talk:
    ar: متى شعرت بالأمان آخر مرة؟
    en: When was the last time you felt safe?
    ur: تم نے آخری بار کب خود کو محفوظ محسوس کیا تھا؟
    fr: Quand t’es-tu senti en sécurité pour la dernière fois ?
    tr: En son ne zaman kendinizi güvende hissettiniz?
    id: Kapan terakhir kali Anda merasa aman?
- slug: isa
  icon: 💛
  prophet:
    ar: عيسى
    en: Jesus
    ur: عیسیٰ
    fr: Jésus
    tr: Isa
    id: Isa
  title:
    ar: قلب عيسى الدافئ
    en: Jesus' Warm Heart
    ur: عیسیٰ کا مہربان دل
    fr: Le cœur chaleureux de Jésus
    tr: İsa'nın sıcak kalbi
    id: Hati hangat Yesus
  body:
    ar: 'في مساء دافئ، جلس عيسى تحت شجرة زيتون كبيرة. جاءه طفل صغير يبكي لأن لعبته انكسرت. مسح عيسى دموع الطفل بيده بلطف، وابتسم له ابتسامة دافئة. وقال له: لا تحزن، فالقلب الطيب أغلى من كل اللعب. ضحك الطفل
      من جديد، واحتضن عيسى بحب. ثم غنّت العصافير أغنية المساء، ونام الطفل في حضن أمّه، وقلبه مليء بالدفء.'
    en: 'On a warm evening, Jesus sat beneath a great olive tree. A little child came to him, crying because his toy had broken. Jesus gently wiped the child''s tears with his hand, and smiled at him a
      warm smile. He said to him: do not be sad, for a kind heart is worth more than all the toys. The child laughed again, and hugged Jesus with love. Then the birds sang their evening song, and the child
      fell asleep in his mother''s arms, his heart full of warmth.'
    ur: 'ایک گرم شام کو عیسیٰ ایک بڑے زیتون کے درخت کے نیچے بیٹھے تھے۔ ایک چھوٹا بچہ ان کے پاس آیا، رو رہا تھا کیونکہ اس کا کھلونا ٹوٹ گیا تھا۔ عیسیٰ نے نرمی سے اپنے ہاتھ سے بچے کے آنسو پونچھے، اور اسے
      ایک گرم مسکراہٹ کے ساتھ دیکھا۔ انہوں نے کہا: غمگین نہ ہو، کیونکہ ایک اچھا دل سب کھلونوں سے زیادہ قیمتی ہے۔ بچہ پھر سے ہنسنے لگا اور محبت سے عیسیٰ کے گلے لگ گیا۔ پھر پرندوں نے شام کا گیت گایا، اور
      بچہ اپنی ماں کی گود میں سو گیا، اس کا دل گرمجوشی سے بھرا ہوا تھا۔'
    fr: Par une douce soirée, Jésus était assis sous un grand olivier. Un petit enfant vint le trouver en pleurant, car son jouet s’était cassé. Jésus essuya délicatement ses larmes de la main et lui adressa
      un sourire chaleureux. Il lui dit de ne pas être triste, car un cœur bienveillant vaut plus que tous les jouets. L’enfant se remit à rire et serra Jésus dans ses bras avec affection. Les oiseaux chantèrent
      alors leur chant du soir, et l’enfant s’endormit dans les bras de sa mère, le cœur plein de chaleur.
    tr: 'Sıcak bir akşamda, Isa büyük bir zeytin ağacının altında oturuyordu. Küçük bir çocuk, oyuncağı kırılmış olduğu için ağlayarak yanına geldi. Isa çocuğun gözyaşlarını nazikçe eliyle sildi ve ona
      sıcak bir şekilde gülümsedi. Ona dedi ki: Üzülme, çünkü iyi kalpli bir kalp tüm oyuncaklardan daha değerlidir. Çocuk tekrar güldü ve Isa''yı sevgiyle kucakladı. Sonra kuşlar akşam şarkısını söyledi
