eras:
  - slug: makkah
    title: { ar: "مكة: زمن النبي", en: "Mecca: the Prophet's time", ur: "مکہ: نبی کا زمانہ" }
    blurb:
      ar: "قبل أكثر من أربعة عشر قرنًا، في مدينة مكة بين الجبال، بدأت قصة الإسلام. هنا نزل الوحي أول مرة، ومن هنا بدأت رحلة عظيمة."
      en: "More than fourteen centuries ago, in the mountain city of Mecca, the story of Islam began. Here revelation came down for the first time, and from here a great journey started."
      ur: "چودہ صدیوں سے بھی پہلے، پہاڑوں کے شہر مکہ میں اسلام کی کہانی شروع ہوئی۔ یہیں پہلی بار وحی نازل ہوئی، اور یہیں سے ایک بڑے سفر کا آغاز ہوا۔"
    events:
      - title: { ar: "أول الوحي في غار حراء", en: "The first revelation in the cave of Hira", ur: "غارِ حرا میں پہلی وحی" }
        one_line:
          ar: "في غار حراء الصغير على جبل قرب مكة بدأ الوحي ينزل على النبي."
          en: "In the little cave of Hira on a mountain near Mecca, revelation began to come to the Prophet."
          ur: "مکہ کے قریب ایک پہاڑ پر، غارِ حرا کے چھوٹے سے غار میں نبی پر وحی آنا شروع ہوئی۔"
        source: "event/first-revelation"
      - title: { ar: "رحلة إلى ملك عادل", en: "A journey to a just king", ur: "ایک انصاف پسند بادشاہ کے پاس سفر" }
        one_line:
          ar: "بعض أصحاب النبي أبحروا في سفن صغيرة إلى ملك عادل استقبلهم بكرم ولطف."
          en: "Some of the Prophet's companions sailed in small ships to a just king who welcomed them with kindness."
          ur: "نبی کے کچھ ساتھی چھوٹی کشتیوں میں ایک انصاف پسند بادشاہ کے پاس گئے، جس نے انہیں مہربانی سے خوش آمدید کہا۔"
        source: "event/first-migration-to-abyssinia"
      - title: { ar: "الرحلة الكبيرة إلى المدينة", en: "The great journey to Medina", ur: "مدینہ کا بڑا سفر" }
        one_line:
          ar: "سار النبي وأصحابه في رحلة طويلة من مكة إلى المدينة، ومن تلك السنة يبدأ التقويم الهجري."
          en: "The Prophet and his companions made the long journey from Mecca to Medina — and the Hijri calendar counts from that year."
          ur: "نبی اور ان کے ساتھیوں نے مکہ سے مدینہ تک لمبا سفر کیا — اور ہجری کیلنڈر اسی سال سے شمار ہوتا ہے۔"
        source: "event/hijra"
      - title: { ar: "بناء الكعبة", en: "Raising the Kaaba", ur: "کعبہ کی تعمیر" }
        one_line:
          ar: "إبراهيم وابنه إسماعيل رفعا معًا قواعد الكعبة حجرًا فوق حجر."
          en: "Ibrahim and his son Ismail raised the Kaaba's foundations together, stone upon stone."
          ur: "ابراہیم اور ان کے بیٹے اسماعیل نے مل کر کعبہ کی بنیادیں اٹھائیں، پتھر پر پتھر رکھ کر۔"
        source: "event/building-of-the-kaaba"

  - slug: madinah
    title: { ar: "المدينة المنورة", en: "Medina", ur: "مدینہ منورہ" }
    blurb:
      ar: "بعد الرحلة الطويلة من مكة، استقر النبي وأصحابه في المدينة. هنا بُني أول مسجد، وهنا وجد المسلمون مدينة يحبونها."
      en: "After the long journey from Mecca, the Prophet and his companions settled in Medina. Here the first mosque was built, and here the Muslims found a city to love."
      ur: "مکہ کے لمبے سفر کے بعد نبی اور ان کے ساتھی مدینہ میں آباد ہوئے۔ یہیں پہلی مسجد بنی، اور یہیں مسلمانوں کو ایک ایسا شہر ملا جس سے وہ محبت کرنے لگے۔"
    events:
      - title: { ar: "بناء المسجد النبوي", en: "Building the Prophet's Mosque", ur: "مسجدِ نبوی کی تعمیر" }
        one_line:
          ar: "اشترى النبي أرضًا صغيرة، وبناها هو وأصحابه مسجدًا بالطوب اللبن والحجارة."
          en: "The Prophet bought a small plot of land, and he and his companions built it into a mosque of mudbrick and stone."
          ur: "نبی نے زمین کا ایک چھوٹا سا قطعہ خریدا، اور وہ اور ان کے ساتھی اسے مٹی کی اینٹوں اور پتھر سے ایک مسجد میں بدل گئے۔"
        source: "event/prophets-mosque-built"
      - title: { ar: "التوقف في قباء", en: "The stop at Quba", ur: "قباء میں قیام" }
        one_line:
          ar: "في الطريق إلى المدينة توقف النبي في قباء وأسس هناك مسجدًا صغيرًا جميلًا."
          en: "On the way to Medina the Prophet stopped at Quba and founded a lovely little mosque there."
          ur: "مدینہ کے راستے میں نبی قباء ٹھہرے اور وہاں ایک خوبصورت چھوٹی مسجد کی بنیاد رکھی۔"
        source: "event/quba-sojourn"
      - title: { ar: "أول صلاة جمعة", en: "The first Friday prayer", ur: "جمعہ کی پہلی نماز" }
        one_line:
          ar: "أدركتهم صلاة الجمعة في الطريق، فصلى النبي بمئة رجل في مسجد صغير بالوادي."
          en: "Friday prayer caught up with them on the road, and the Prophet prayed with a hundred men in a little valley mosque."
          ur: "راستے میں ہی جمعہ کا وقت آ گیا، اور نبی نے ایک چھوٹی وادی کی مسجد میں سو آدمیوں کے ساتھ نماز پڑھائی۔"
        source: "event/first-jumma"
      - title: { ar: "مسجد القبلتين", en: "The Mosque of the Two Qiblas", ur: "مسجدِ قبلتین" }
        one_line:
          ar: "في هذا المسجد الصغير استدار المصلّون أثناء صلاتهم نحو الكعبة."
          en: "In this little mosque the worshippers turned around during prayer to face the Kaaba."
          ur: "اس چھوٹی مسجد میں نمازی نماز کے دوران کعبہ کی طرف رخ کرنے کے لیے مڑ گئے۔"
        source: "building/masjid-al-qiblatayn"

  - slug: baghdad
    title: { ar: "بغداد العباسية", en: "Abbasid Baghdad", ur: "عباسی بغداد" }
    blurb:
      ar: "على ضفاف نهر دجلة قامت مدينة مدوّرة اسمها مدينة السلام. صارت بغداد عاصمة العلم، يأتيها العلماء والكتب من كل مكان."
      en: "On the banks of the Tigris rose a round city called the City of Peace. Baghdad became the capital of learning, where scholars and books arrived from everywhere."
      ur: "دریائے دجلہ کے کنارے ایک گول شہر آباد ہوا جسے امن کا شہر کہا گیا۔ بغداد علم کا دارالحکومت بن گیا، جہاں دنیا بھر سے عالم اور کتابیں پہنچتی تھیں۔"
    events:
      - title: { ar: "مدينة السلام الجديدة", en: "The new City of Peace", ur: "امن کا نیا شہر" }
        one_line:
          ar: "بنى الخليفة المنصور مدينة جديدة مدوّرة على النهر وسماها مدينة السلام: بغداد."
          en: "The caliph al-Mansur built a brand-new round city on the river and called it the City of Peace: Baghdad."
          ur: "خلیفہ منصور نے دریا کے کنارے ایک نیا گول شہر بسایا اور اس کا نام رکھا: امن کا شہر، بغداد۔"
        source: "event/founding-of-baghdad"
      - title: { ar: "بيت الحكمة", en: "The House of Wisdom", ur: "بیت الحکمہ" }
        one_line:
          ar: "في بيت الحكمة جمع العلماء الكتب من بلاد كثيرة وترجموها إلى العربية."
          en: "In the House of Wisdom, scholars gathered books from many lands and translated them into Arabic."
          ur: "بیت الحکمہ میں عالم دور دراز ملکوں سے کتابیں جمع کرتے اور انہیں عربی میں ترجمہ کرتے تھے۔"
        source: "building/bayt-al-hikma"
      - title: { ar: "مدرسة كبيرة في بغداد", en: "A great school in Baghdad", ur: "بغداد کا ایک بڑا مدرسہ" }
        one_line:
          ar: "بُنيت في بغداد مدرسة كبيرة يتعلّم فيها الطلاب العلوم المختلفة."
          en: "A great school was built in Baghdad where students learned all kinds of sciences."
          ur: "بغداد میں ایک بڑا مدرسہ بنایا گیا جہاں طلبہ ہر طرح کے علوم سیکھتے تھے۔"
        source: "event/nizamiyya-founding-459"
      - title: { ar: "عالم الأرقام", en: "The scholar of numbers", ur: "اعداد کے عالم" }
        one_line:
          ar: "الخوارزمي عالم أحبّ الأرقام والنجوم، وعلّم الناس طرقًا جديدة في الحساب."
          en: "Al-Khwarizmi was a scholar who loved numbers and stars, and taught people new ways of counting."
          ur: "الخوارزمی ایک ایسے عالم تھے جو اعداد اور ستاروں سے محبت کرتے تھے، اور انہوں نے لوگوں کو گننے کے نئے طریقے سکھائے۔"
        source: "person/al-khwarizmi"

  - slug: cordoba
    title: { ar: "قرطبة والأندلس", en: "Cordoba and al-Andalus", ur: "قرطبہ اور اندلس" }
    blurb:
      ar: "في بلاد الأندلس البعيدة أشرقت حضارة جميلة. في قرطبة مسجد بألف عمود ومكتبة ملكية، وفي غرناطة قصر الحمراء الساحر."
      en: "In faraway al-Andalus a beautiful civilization shone. In Cordoba stood a mosque of a thousand columns and a royal library, and in Granada the enchanting Alhambra."
      ur: "دور اندلس میں ایک خوبصورت تہذیب چمکی۔ قرطبہ میں ایک ہزار ستونوں والی مسجد اور شاہی کتب خانہ تھا، اور غرناطہ میں دلکش الحمراء۔"
    events:
      - title: { ar: "غابة الأعمدة في قرطبة", en: "The forest of columns in Cordoba", ur: "قرطبہ کا ستونوں کا جنگل" }
        one_line:
          ar: "في جامع قرطبة غابة من الأعمدة: نحو ألف عمود تحمل سقفًا مزركشًا."
          en: "Cordoba's mosque holds a forest of columns: about a thousand pillars carrying a decorated ceiling."
          ur: "قرطبہ کی مسجد میں ستونوں کا ایک جنگل ہے: تقریباً ایک ہزار ستون، جو ایک نقش و نگار والی چھت کو اٹھائے ہوئے ہیں۔"
        source: "building/great-mosque-cordoba"
      - title: { ar: "مكتبة الملك", en: "The king's library", ur: "بادشاہ کا کتب خانہ" }
        one_line:
          ar: "في قصر قرطبة كانت مكتبة ملكية جمعت كتبًا من كل بلاد الدنيا."
          en: "In Cordoba's palace stood a royal library that gathered books from every land in the world."
          ur: "قرطبہ کے محل میں ایک شاہی کتب خانہ تھا جس میں دنیا کے ہر ملک کی کتابیں جمع تھیں۔"
        source: "building/khizanat-kutub-qurtuba"
      - title: { ar: "مغنّي قرطبة", en: "Cordoba's singer", ur: "قرطبہ کا گلوکار" }
        one_line:
          ar: "زرياب مغنٍّ جاء من بغداد إلى قرطبة، وعلّم أهلها فنونًا جديدة في الموسيقى."
          en: "Ziryab was a singer who came from Baghdad to Cordoba and taught its people new arts of music."
          ur: "زِریاب بغداد سے قرطبہ آئے، وہ گلوکار تھے جنہوں نے وہاں کے لوگوں کو موسیقی کے نئے فن سکھائے۔"
        source: "person/ziryab"
      - title: { ar: "قصر الحمراء", en: "The Alhambra", ur: "الحمراء محل" }
        one_line:
          ar: "قصر الحمراء في غرناطة بقصوره الأنيقة وزخارفه الجميلة."
          en: "The Alhambra in Granada, with its elegant palaces and beautiful carvings."
          ur: "غرناطہ کا الحمراء، اپنے خوبصورت محلات اور دلکش نقش و نگار کے ساتھ۔"
        source: "building/alhambra"

  - slug: istanbul
    title: { ar: "اسطنبول العثمانية", en: "Ottoman Istanbul", ur: "عثمانی استنبول" }
    blurb:
      ar: "مدينة على البحر بين قارتين، صار اسمها إسطنبول قبل نحو ستة قرون. امتلأت بالجوامع الجميلة ذات القباب العالية، وصارت عاصمة كبيرة."
      en: "A city on the sea between two continents, it took the name Istanbul about six centuries ago. It filled with beautiful mosques of lofty domes and became a great capital."
      ur: "سمندر کے کنارے، دو براعظموں کے درمیان ایک شہر، جس نے تقریباً چھ صدیاں پہلے استنبول کا نام پایا۔ یہ اونچے گنبدوں والی خوبصورت مسجدوں سے بھر گیا اور ایک عظیم دارالحکومت بن گیا۔"
    events:
      - title: { ar: "اسم جديد للمدينة", en: "A new name for the city", ur: "شہر کا ایک نیا نام" }
        one_line:
          ar: "قبل نحو ستة قرون صار للمدينة اسم جديد: إسطنبول، وبدأت صفحة جديدة في تاريخها."
          en: "About six centuries ago the city got a new name — Istanbul — and a new chapter of its story began."
          ur: "تقریباً چھ صدیاں پہلے شہر کو ایک نیا نام ملا — استنبول — اور اس کی کہانی کا ایک نیا باب شروع ہوا۔"
        source: "event/ottoman-conquest-constantinople-1453"
      - title: { ar: "البناء العتيق", en: "The ancient building", ur: "قدیم عمارت" }
        one_line:
          ar: "آيا صوفيا بناء قديم جدًا في إسطنبول، بُني قبل أكثر من أربعة عشر قرنًا."
          en: "Hagia Sophia is a very old building in Istanbul, built more than fourteen centuries ago."
          ur: "ایا صوفیہ استنبول کی ایک بہت قدیم عمارت ہے، جو چودہ صدیوں سے بھی پہلے بنی تھی۔"
        source: "building/hagia-sophia"
      - title: { ar: "جامع أيوب سلطان", en: "Eyüp Sultan Mosque", ur: "ایوب سلطان مسجد" }
        one_line:
          ar: "جامع أيوب سلطان مسجد قديم في إسطنبول، بُني قبل أكثر من خمسة قرون."
          en: "Eyüp Sultan Mosque is an old mosque in Istanbul, built more than five centuries ago."
          ur: "ایوب سلطان مسجد استنبول کی ایک پرانی مسجد ہے، جو پانچ صدیوں سے بھی پہلے بنی تھی۔"
        source: "building/eyup-sultan-mosque"
      - title: { ar: "يني جامع", en: "The New Mosque", ur: "یینی جامع" }
        one_line:
          ar: "يني جامع مسجد كبير في إسطنبول من العصر العثماني."
          en: "The New Mosque is a big Istanbul mosque from the Ottoman age."
          ur: "یینی جامع استنبول کی ایک بڑی مسجد ہے جو عثمانی دور سے تعلق رکھتی ہے۔"
        source: "building/new-mosque-istanbul"

