eras:
- slug: makkah
  title:
    ar: 'مكة: زمن النبي'
    en: 'Mecca: the Prophet''s time'
    ur: 'مکہ: نبی کا زمانہ'
    fr: La Mecque au temps du Prophète
    tr: 'Mekke: Peygamberin Zamanı'
    id: 'Mekah: Waktu Nabi'
  blurb:
    ar: قبل أكثر من أربعة عشر قرنًا، في مدينة مكة بين الجبال، بدأت قصة الإسلام. هنا نزل الوحي أول مرة، ومن هنا بدأت رحلة عظيمة.
    en: More than fourteen centuries ago, in the mountain city of Mecca, the story of Islam began. Here revelation came down for the first time, and from here a great journey started.
    ur: چودہ صدیوں سے بھی پہلے، پہاڑوں کے شہر مکہ میں اسلام کی کہانی شروع ہوئی۔ یہیں پہلی بار وحی نازل ہوئی، اور یہیں سے ایک بڑے سفر کا آغاز ہوا۔
    fr: Il y a plus de quatorze siècles, l’histoire de l’islam a commencé à La Mecque, une ville entourée de montagnes. C’est là que la révélation est descendue pour la première fois et qu’un grand voyage
      a commencé.
    tr: On dört yüzyıldan fazla bir süre önce, dağların arasında yer alan Mekke şehrinde İslam'ın hikayesi başladı. Burada vahiy ilk kez indi ve buradan büyük bir yolculuk başladı.
    id: Lebih dari empat belas abad yang lalu, di kota Mekah di antara pegunungan, kisah Islam dimulai. Di sini wahyu pertama kali turun, dan dari sinilah dimulailah perjalanan besar.
  events:
  - title:
      ar: أول الوحي في غار حراء
      en: The first revelation in the cave of Hira
      ur: غارِ حرا میں پہلی وحی
      fr: La première révélation dans la grotte de Hira
      tr: Hira Mağarası'ndaki ilk vahiy
      id: Wahyu pertama di Gua Hira
    one_line:
      ar: في غار حراء الصغير على جبل قرب مكة بدأ الوحي ينزل على النبي.
      en: In the little cave of Hira on a mountain near Mecca, revelation began to come to the Prophet.
      ur: مکہ کے قریب ایک پہاڑ پر، غارِ حرا کے چھوٹے سے غار میں نبی پر وحی آنا شروع ہوئی۔
      fr: Dans la petite grotte de Hira, sur une montagne près de La Mecque, le Prophète a commencé à recevoir la révélation.
      tr: Mekke yakınlarındaki bir dağdaki Hira el-Saghir Mağarası'nda, vahiy Peygamber'in üzerine yağmaya başladı.
      id: Di Gua Hira al-Saghir di sebuah gunung dekat Mekah, wahyu mulai turun kepada Nabi.
    source: event/first-revelation
  - title:
      ar: رحلة إلى ملك عادل
      en: A journey to a just king
      ur: ایک انصاف پسند بادشاہ کے پاس سفر
      fr: Le voyage vers un roi juste
      tr: Adil Bir Krala Yolculuk
      id: Perjalanan menuju Raja yang Adil
    one_line:
      ar: بعض أصحاب النبي أبحروا في سفن صغيرة إلى ملك عادل استقبلهم بكرم ولطف.
      en: Some of the Prophet's companions sailed in small ships to a just king who welcomed them with kindness.
      ur: نبی کے کچھ ساتھی چھوٹی کشتیوں میں ایک انصاف پسند بادشاہ کے پاس گئے، جس نے انہیں مہربانی سے خوش آمدید کہا۔
      fr: Des compagnons du Prophète ont pris la mer sur de petits bateaux pour rejoindre un roi juste, qui les a accueillis avec bienveillance.
      tr: Peygamber'in bazı sahabeleri, cömertlik ve nezaketle karşılanan adil bir kralın yanına küçük gemilerle yola çıktı.
      id: Beberapa sahabat Nabi berlayar dengan kapal kecil menuju raja yang adil yang menerima mereka dengan kemurahan hati dan kebaikan.
    source: event/first-migration-to-abyssinia
  - title:
      ar: الرحلة الكبيرة إلى المدينة
      en: The great journey to Medina
      ur: مدینہ کا بڑا سفر
      fr: Le grand voyage vers Médine
      tr: Şehre büyük gezi
      id: Perjalanan besar ke kota
    one_line:
      ar: سار النبي وأصحابه في رحلة طويلة من مكة إلى المدينة، ومن تلك السنة يبدأ التقويم الهجري.
      en: The Prophet and his companions made the long journey from Mecca to Medina — and the Hijri calendar counts from that year.
      ur: نبی اور ان کے ساتھیوں نے مکہ سے مدینہ تک لمبا سفر کیا — اور ہجری کیلنڈر اسی سال سے شمار ہوتا ہے۔
      fr: 'Le Prophète et ses compagnons ont fait le long voyage de La Mecque à Médine : le calendrier hégirien commence cette année-là.'
      tr: Peygamber ve sahabeleri Mekke'den Medine'ye uzun bir yolculuk yaptılar ve o yıldan itibaren Hicri takvimi başladı.
      id: Nabi dan para sahabatnya melakukan perjalanan panjang dari Mekah ke Madinah, dan sejak tahun itu, kalender Hijriyah dimulai.
    source: event/hijra
  - title:
      ar: بناء الكعبة
      en: Raising the Kaaba
      ur: کعبہ کی تعمیر
      fr: La construction de la Kaaba
      tr: Kabe'nin İnşası
      id: Membangun Ka'bah
    one_line:
      ar: إبراهيم وابنه إسماعيل رفعا معًا قواعد الكعبة حجرًا فوق حجر.
      en: Ibrahim and his son Ismail raised the Kaaba's foundations together, stone upon stone.
      ur: ابراہیم اور ان کے بیٹے اسماعیل نے مل کر کعبہ کی بنیادیں اٹھائیں، پتھر پر پتھر رکھ کر۔
      fr: Abraham et son fils Ismaël ont élevé ensemble les fondations de la Kaaba, pierre après pierre.
      tr: İbrahim ve oğlu İshmael birlikte Kabe'nin temellerini taş üstüne taş diktiler.
      id: Abraham dan putranya Ismael bersama-sama mendirikan fondasi Ka'bah dengan batu demi batu.
    source: event/building-of-the-kaaba
- slug: madinah
  title:
    ar: المدينة المنورة
    en: Medina
    ur: مدینہ منورہ
    fr: Médine
    tr: Medine
    id: Madinah
  blurb:
    ar: بعد الرحلة الطويلة من مكة، استقر النبي وأصحابه في المدينة. هنا بُني أول مسجد، وهنا وجد المسلمون مدينة يحبونها.
    en: After the long journey from Mecca, the Prophet and his companions settled in Medina. Here the first mosque was built, and here the Muslims found a city to love.
    ur: مکہ کے لمبے سفر کے بعد نبی اور ان کے ساتھی مدینہ میں آباد ہوئے۔ یہیں پہلی مسجد بنی، اور یہیں مسلمانوں کو ایک ایسا شہر ملا جس سے وہ محبت کرنے لگے۔
    fr: Après le long voyage depuis La Mecque, le Prophète et ses compagnons se sont installés à Médine. C’est là que la première mosquée a été bâtie et que les musulmans ont trouvé une ville à aimer.
    tr: Mekke'den uzun bir yolculuktan sonra Peygamber ve sahabeleri Medine'ye yerleştiler. Burada ilk cami inşa edildi ve Müslümanlar sevdikleri bir şehir buldular.
    id: Setelah perjalanan panjang dari Mekah, Nabi dan para sahabatnya menetap di Madinah. Di sinilah masjid pertama dibangun, dan di sini umat Muslim menemukan sebuah kota yang mereka cintai.
  events:
  - title:
      ar: بناء المسجد النبوي
      en: Building the Prophet's Mosque
      ur: مسجدِ نبوی کی تعمیر
      fr: La construction de la mosquée du Prophète
      tr: Peygamber Camii'nin İnşası
      id: Pembangunan Masjid Nabi
    one_line:
      ar: اشترى النبي أرضًا صغيرة، وبناها هو وأصحابه مسجدًا بالطوب اللبن والحجارة.
      en: The Prophet bought a small plot of land, and he and his companions built it into a mosque of mudbrick and stone.
      ur: نبی نے زمین کا ایک چھوٹا سا قطعہ خریدا، اور وہ اور ان کے ساتھی اسے مٹی کی اینٹوں اور پتھر سے ایک مسجد میں بدل گئے۔
      fr: Le Prophète a acheté un petit terrain, puis y a construit avec ses compagnons une mosquée de briques de terre et de pierre.
      tr: Peygamber küçük bir arazi satın aldı ve kendisi ile arkadaşları burayı kerpiç ve taşlardan yapılmış bir camiye dönüştürdü.
      id: Nabi membeli sebidang tanah kecil, dan ia bersama para sahabatnya membangunnya menjadi masjid yang terbuat dari bata lumpur dan batu.
    source: event/prophets-mosque-built
  - title:
      ar: التوقف في قباء
      en: The stop at Quba
      ur: قباء میں قیام
      fr: L’étape à Quba
      tr: Quba'da Mola
      id: Singgah di Quba
    one_line:
      ar: في الطريق إلى المدينة توقف النبي في قباء وأسس هناك مسجدًا صغيرًا جميلًا.
      en: On the way to Medina the Prophet stopped at Quba and founded a lovely little mosque there.
      ur: مدینہ کے راستے میں نبی قباء ٹھہرے اور وہاں ایک خوبصورت چھوٹی مسجد کی بنیاد رکھی۔
      fr: En chemin vers Médine, le Prophète s’est arrêté à Quba et y a fondé une jolie petite mosquée.
      tr: Medine'ye giderken Peygamber, Kube'de durdu ve orada küçük, güzel bir cami inşa etti.
      id: Dalam perjalanan ke Madinah, Nabi singgah di Quba dan mendirikan sebuah masjid kecil yang indah di sana.
    source: event/quba-sojourn
  - title:
      ar: أول صلاة جمعة
      en: The first Friday prayer
      ur: جمعہ کی پہلی نماز
      fr: La première prière du vendredi
      tr: İlk Cuma namazı
      id: Doa Jumat Pertama
    one_line:
      ar: أدركتهم صلاة الجمعة في الطريق، فصلى النبي بمئة رجل في مسجد صغير بالوادي.
      en: Friday prayer caught up with them on the road, and the Prophet prayed with a hundred men in a little valley mosque.
      ur: راستے میں ہی جمعہ کا وقت آ گیا، اور نبی نے ایک چھوٹی وادی کی مسجد میں سو آدمیوں کے ساتھ نماز پڑھائی۔
      fr: 'Le moment de la prière du vendredi les a rejoints sur la route : le Prophète a prié avec cent hommes dans une petite mosquée de vallée.'
      tr: Cuma namazı yolda onları yakaladı ve Peygamber, vadideki küçük bir camide yüz adamı namaza götürdü.
      id: Shalat Jumat menyusul mereka di jalan, dan Nabi memimpin seratus pria dalam shalat di sebuah masjid kecil di lembah.
    source: event/first-jumma
  - title:
      ar: مسجد القبلتين
      en: The Mosque of the Two Qiblas
      ur: مسجدِ قبلتین
      fr: La mosquée des Deux Qiblas
      tr: Qiblatain Camii
      id: Masjid Qiblatain
    one_line:
      ar: في هذا المسجد الصغير استدار المصلّون أثناء صلاتهم نحو الكعبة.
      en: In this little mosque the worshippers turned around during prayer to face the Kaaba.
      ur: اس چھوٹی مسجد میں نمازی نماز کے دوران کعبہ کی طرف رخ کرنے کے لیے مڑ گئے۔
      fr: Dans cette petite mosquée, les fidèles se sont retournés pendant la prière pour faire face à la Kaaba.
      tr: Bu küçük camide, ibadet edenler namaz kılırken Kabe'ye yöneldiler.
      id: Di masjid kecil ini, para jemaah berbalik menghadap Ka'bah saat salat mereka.
    source: building/masjid-al-qiblatayn
- slug: baghdad
  title:
    ar: بغداد العباسية
    en: Abbasid Baghdad
    ur: عباسی بغداد
    fr: Bagdad abbasside
    tr: Abbasi Bağdat
    id: Baghdad Abbasiyah
  blurb:
    ar: على ضفاف نهر دجلة قامت مدينة مدوّرة اسمها مدينة السلام. صارت بغداد عاصمة العلم، يأتيها العلماء والكتب من كل مكان.
    en: On the banks of the Tigris rose a round city called the City of Peace. Baghdad became the capital of learning, where scholars and books arrived from everywhere.
    ur: دریائے دجلہ کے کنارے ایک گول شہر آباد ہوا جسے امن کا شہر کہا گیا۔ بغداد علم کا دارالحکومت بن گیا، جہاں دنیا بھر سے عالم اور کتابیں پہنچتی تھیں۔
    fr: Sur les rives du Tigre s’est élevée une ville ronde appelée la Cité de la paix. Bagdad est devenue une capitale du savoir, où arrivaient savants et livres de tous horizons.
    tr: Dicle Nehri kıyısında, Barış Şehri adında dairesel bir şehir ortaya çıktı. Bağdat, bilginin başkenti oldu ve her yerden bilginleri ve kitapları çekti.
    id: Di tepi Sungai Tigris, sebuah kota melingkar yang disebut Kota Damai muncul. Baghdad menjadi ibu kota pengetahuan, menarik para sarjana dan buku dari berbagai tempat.
  events:
  - title:
      ar: مدينة السلام الجديدة
      en: The new City of Peace
      ur: امن کا نیا شہر
      fr: La nouvelle Cité de la paix
      tr: Yeni Barış Şehri
      id: Kota Perdamaian Baru
    one_line:
      ar: 'بنى الخليفة المنصور مدينة جديدة مدوّرة على النهر وسماها مدينة السلام: بغداد.'
      en: 'The caliph al-Mansur built a brand-new round city on the river and called it the City of Peace: Baghdad.'
      ur: 'خلیفہ منصور نے دریا کے کنارے ایک نیا گول شہر بسایا اور اس کا نام رکھا: امن کا شہر، بغداد۔'
      fr: 'Le calife al-Mansur a bâti au bord du fleuve une ville ronde toute neuve, qu’il a appelée la Cité de la paix : Bagdad.'
      tr: 'Halife el-Mansur, nehir kenarında yeni yuvarlak bir şehir inşa etti ve buraya Barış Şehri: Bağdat adını verdi.'
      id: 'Khalifah al-Mansur membangun sebuah kota bulat baru di sungai dan menamainya Kota Perdamaian: Baghdad.'
    source: event/founding-of-baghdad
  - title:
      ar: بيت الحكمة
      en: The House of Wisdom
      ur: بیت الحکمہ
      fr: La Maison de la sagesse
      tr: Bilgelik Evi
      id: Rumah Kebijaksanaan
    one_line:
      ar: في بيت الحكمة جمع العلماء الكتب من بلاد كثيرة وترجموها إلى العربية.
      en: In the House of Wisdom, scholars gathered books from many lands and translated them into Arabic.
      ur: بیت الحکمہ میں عالم دور دراز ملکوں سے کتابیں جمع کرتے اور انہیں عربی میں ترجمہ کرتے تھے۔
      fr: À la Maison de la sagesse, les savants rassemblaient des livres de nombreux pays et les traduisaient en arabe.
      tr: Bayt al-Hikmah'ta alimler birçok ülkeden kitaplar toplar ve bunları Arapçaya çevirdiler.
      id: Di Bayt al-Hikmah, para cendekiawan mengumpulkan buku-buku dari berbagai negara dan menerjemahkannya ke dalam bahasa Arab.
    source: building/bayt-al-hikma
  - title:
      ar: مدرسة كبيرة في بغداد
      en: A great school in Baghdad
      ur: بغداد کا ایک بڑا مدرسہ
      fr: Une grande école à Bagdad
      tr: Bağdat'ta büyük bir okul
      id: Sebuah sekolah besar di Baghdad
    one_line:
      ar: بُنيت في بغداد مدرسة كبيرة يتعلّم فيها الطلاب العلوم المختلفة.
      en: A great school was built in Baghdad where students learned all kinds of sciences.
      ur: بغداد میں ایک بڑا مدرسہ بنایا گیا جہاں طلبہ ہر طرح کے علوم سیکھتے تھے۔
      fr: Une grande école a été construite à Bagdad, où les étudiants apprenaient toutes sortes de sciences.
      tr: Bağdat'ta öğrencilerin çeşitli bilim alimlerini öğrendiği büyük bir okul inşa edildi.
      id: Sebuah sekolah besar dibangun di Baghdad tempat para siswa mempelajari berbagai ilmu pengetahuan.
    source: event/nizamiyya-founding-459
  - title:
      ar: عالم الأرقام
      en: The scholar of numbers
      ur: اعداد کے عالم
      fr: Le savant des nombres
      tr: Sayılar dünyası
      id: Dunia angka
    one_line:
      ar: الخوارزمي عالم أحبّ الأرقام والنجوم، وعلّم الناس طرقًا جديدة في الحساب.
      en: Al-Khwarizmi was a scholar who loved numbers and stars, and taught people new ways of counting.
      ur: الخوارزمی ایک ایسے عالم تھے جو اعداد اور ستاروں سے محبت کرتے تھے، اور انہوں نے لوگوں کو گننے کے نئے طریقے سکھائے۔
      fr: 'Al-Khwarizmi aimait les nombres et les étoiles : ce savant a enseigné de nouvelles façons de calculer.'
      tr: Al-Hwarizmi, sayıları ve yıldızları seven bir âlimdi ve insanlara yeni aritmetik yöntemleri öğretti.
      id: Al-Khwarizmi adalah seorang cendekiawan yang menyukai angka dan bintang serta mengajarkan metode aritmatika baru.
    source: person/al-khwarizmi
- slug: cordoba
  title:
    ar: قرطبة والأندلس
    en: Cordoba and al-Andalus
    ur: قرطبہ اور اندلس
    fr: Cordoue et al-Andalus
    tr: Kordoba ve Endülüs
    id: Cordoba dan al-Andalus
  blurb:
    ar: في بلاد الأندلس البعيدة أشرقت حضارة جميلة. في قرطبة مسجد بألف عمود ومكتبة ملكية، وفي غرناطة قصر الحمراء الساحر.
    en: In faraway al-Andalus a beautiful civilization shone. In Cordoba stood a mosque of a thousand columns and a royal library, and in Granada the enchanting Alhambra.
    ur: دور اندلس میں ایک خوبصورت تہذیب چمکی۔ قرطبہ میں ایک ہزار ستونوں والی مسجد اور شاہی کتب خانہ تھا، اور غرناطہ میں دلکش الحمراء۔
    fr: Dans la lointaine al-Andalus rayonnait une belle civilisation. À Cordoue se dressaient une mosquée aux mille colonnes et une bibliothèque royale ; à Grenade, l’Alhambra enchanteur.
    tr: Endülüs'ün uzak diyarında güzel bir medeniyet parlıyordu. Córdoba'da bin sütunlu bir cami ve bir kraliyet kütüphanesi, Granada'da ise büyüleyici Alhambra Sarayı bulunmaktadır.
    id: Di negeri Andalusia yang jauh, sebuah peradaban indah bersinar. Di Córdoba, terdapat masjid dengan seribu kolom dan perpustakaan kerajaan, serta di Granada, Istana Alhambra yang mempesona.
  events:
  - title:
      ar: غابة الأعمدة في قرطبة
      en: The forest of columns in Cordoba
      ur: قرطبہ کا ستونوں کا جنگل
      fr: La forêt de colonnes de Cordoue
      tr: Córdoba'daki Sütunlar Ormanı
      id: Hutan Kolom di Córdoba
    one_line:
      ar: 'في جامع قرطبة غابة من الأعمدة: نحو ألف عمود تحمل سقفًا مزركشًا.'
      en: 'Cordoba''s mosque holds a forest of columns: about a thousand pillars carrying a decorated ceiling.'
      ur: 'قرطبہ کی مسجد میں ستونوں کا ایک جنگل ہے: تقریباً ایک ہزار ستون، جو ایک نقش و نگار والی چھت کو اٹھائے ہوئے ہیں۔'
      fr: 'La mosquée de Cordoue abrite une forêt de colonnes : environ mille piliers soutiennent un plafond décoré.'
      tr: Córdoba Camii'nde süslü bir çatı taşıyan yaklaşık bin sütun ormanı vardır.
      id: 'Di Masjid Córdoba, terdapat hutan kolom: sekitar seribu kolom yang memiliki atap yang dihias.'
    source: building/great-mosque-cordoba
  - title:
      ar: مكتبة الملك
      en: The king's library
      ur: بادشاہ کا کتب خانہ
      fr: La bibliothèque du souverain
      tr: King Kütüphanesi
      id: Perpustakaan King
    one_line:
      ar: في قصر قرطبة كانت مكتبة ملكية جمعت كتبًا من كل بلاد الدنيا.
      en: In Cordoba's palace stood a royal library that gathered books from every land in the world.
      ur: قرطبہ کے محل میں ایک شاہی کتب خانہ تھا جس میں دنیا کے ہر ملک کی کتابیں جمع تھیں۔
