stops:
  - slug: adam
    icon: 🌟
    name:
      ar: آدم
      en: Adam
      ur: "آدم"
    title:
      ar: أول إنسان
      en: The first human
      ur: "پہلا انسان"
    story:
      ar: "آدم هو أول إنسان خلقه الله. علّم الله آدم أسماء كل الأشياء: النجوم، والبحار، والطيور. وبذلك صار العلم أول هدية للإنسان."
      en: "Adam was the first human God created. God taught Adam the names of all things: the stars, the seas, the birds. And so knowledge was the very first gift to humankind."
      ur: "آدم اللہ کی پیدا کی ہوئی پہلی انسانی ہستی تھے۔ اللہ نے آدم کو ہر چیز کے نام سکھائے: ستارے، سمندر، پرندے۔ اور یوں علم انسان کا سب سے پہلا تحفہ بنا۔"
    sprout:
      ar: آدم أول إنسان، وتعلّم أسماء كل الأشياء.
      en: Adam was the first human, and he learned the names of everything.
      ur: "آدم پہلے انسان تھے، اور انہوں نے ہر چیز کے نام سیکھے۔"
    value:
      ar: حب التعلّم
      en: Love of learning
      ur: "علم سے محبت"
    value_icon: 📚
    question:
      ar: ماذا تريد أن تتعلّم اليوم؟
      en: What do you want to learn about today?
      ur: "آج تم کس چیز کے بارے میں سیکھنا چاہتے ہو؟"
    choices:
      - ar: النجوم
        en: The stars ✨
        ur: "ستارے ✨"
      - ar: الحيوانات
        en: The animals 🦁
        ur: "جانور 🦁"
      - ar: الحروف
        en: The letters 🔤
        ur: "حروف 🔤"
    feedback:
      ar: اختيار جميل! آدم تعلّم أسماء كل شيء، وأنت تستطيع أن تتعلّم مثلَه كل يوم.
      en: Lovely choice! Adam learned the names of everything — and you can learn like him, every single day.
      ur: "کیا ہی اچھا انتخاب ہے! آدم نے ہر چیز کے نام سیکھے — اور تم بھی ان کی طرح ہر روز سیکھ سکتے ہو۔"
  - slug: nuh
    icon: 🛶
    name:
      ar: نوح
      en: Noah
      ur: "نوح"
    title:
      ar: صاحب السفينة الكبيرة
      en: The man with the big ark
      ur: "بڑی کشتی والے نبی"
    story:
      ar: دعا نوح قومه إلى الخير تسعمائة وخمسين سنة ولم يملّ أبدًا. بنى سفينة كبيرة بأمر الله وحمل فيها من كل زوجين. وبعد العاصفة العظيمة خرج من السفينة سالمًا مع من معه.
      en: Noah called his people to goodness for nine hundred and fifty years, and he never gave up. At God's command he built a great ark and carried aboard a pair of every creature. After the great flood, he walked out of the ark safe and sound, with all who were with him.
      ur: "نوح نے اپنی قوم کو نو سو پچاس سال تک نیکی کی طرف بلایا، اور وہ کبھی ہمت نہیں ہارے۔ اللہ کے حکم سے انہوں نے ایک بڑی کشتی بنائی اور اس میں ہر جانور کا ایک جوڑا سوار کیا۔ بڑے سیلاب کے بعد وہ اپنے ساتھیوں کے ساتھ کشتی سے صحیح سلامت باہر آئے۔"
    sprout:
      ar: نوح صبر طويلًا، وبنى سفينة كبيرة بأمر الله.
      en: Noah was patient for a long time, and built a big ark at God's command.
      ur: "نوح نے بہت دیر تک صبر کیا، اور اللہ کے حکم سے ایک بڑی کشتی بنائی۔"
    value:
      ar: الصبر
      en: Patience
      ur: "صبر"
    value_icon: 🐢
    question:
      ar: من سيصعد معك إلى السفينة؟
      en: Who will come aboard the ark with you?
      ur: "کشتی میں تمہارے ساتھ کون سوار ہوگا؟"
    choices:
      - ar: الأسد
        en: The lion 🦁
        ur: "شیر 🦁"
      - ar: الزرافة
        en: The giraffe 🦒
        ur: "زرافہ 🦒"
      - ar: الفيل
        en: The elephant 🐘
        ur: "ہاتھی 🐘"
    feedback:
      ar: مرحبًا بك على متن السفينة! نوح صبر طويلًا ولم يستسلم — والصبر قوة عظيمة.
      en: Welcome aboard the ark! Noah was patient for a very long time and never gave up — patience is a great strength.
      ur: "کشتی میں خوش آمدید! نوح بہت دیر تک صبر کرتے رہے اور کبھی ہمت نہیں ہاری — صبر ایک بڑی طاقت ہے۔"
  - slug: ibrahim
    icon: 🌙
    name:
      ar: إبراهيم
      en: Abraham
      ur: "ابراہیم"
    title:
      ar: الباحث عن الخالق
      en: The seeker of the Creator
      ur: "خالق کو تلاش کرنے والے"
    story:
      ar: "نظر إبراهيم إلى النجوم فقال: هذا ربي؟ ثم رآها تغيب. ونظر إلى القمر ثم إلى الشمس، فرأى كلها تغيب. فعلم أن الخالق أعظم من كل شيء يغيب، وأنه لا يغيب أبدًا."
      en: "Abraham looked at the stars and asked: could this be my Lord? But he watched them set. He looked at the moon, then the sun — and saw them set too. Then he knew the Creator must be greater than anything that sets, and He never sets at all."
      ur: "ابراہیم نے ستاروں کو دیکھا اور پوچھا: کیا یہی میرا رب ہے؟ مگر وہ غروب ہو گئے۔ انہوں نے چاند کو دیکھا، پھر سورج کو — وہ بھی غروب ہو گئے۔ تب انہوں نے جان لیا کہ خالق ہر اس چیز سے بڑا ہے جو غروب ہوتی ہے، اور وہ کبھی غروب نہیں ہوتا۔"
    sprout:
      ar: إبراهيم نظر إلى السماء، وعرف أن الخالق أعظم من كل شيء.
      en: Abraham looked at the sky, and knew the Creator is greater than everything.
      ur: "ابراہیم نے آسمان کو دیکھا اور جانا کہ خالق ہر چیز سے بڑا ہے۔"
    value:
      ar: التفكير العميق
      en: Thinking deeply
      ur: "گہرا غور و فکر"
    value_icon: 🔭
    question:
      ar: "أيّها أعظم: النجوم أم القمر أم الشمس؟"
      en: "Which is greatest: the stars, the moon, or the sun?"
      ur: "ان میں سب سے بڑا کون ہے: ستارے، چاند یا سورج؟"
    choices:
      - ar: النجوم
        en: The stars ✨
        ur: "ستارے ✨"
      - ar: القمر
        en: The moon 🌙
        ur: "چاند 🌙"
      - ar: الشمس
        en: The sun ☀️
        ur: "سورج ☀️"
    feedback:
      ar: كلها جميلة، وكلها من صنع الله. لكن الله أعظم من كل شيء — هو الذي خلقها جميعًا ولا يغيب أبدًا.
      en: They are all beautiful, and all made by God. But God is greater than everything — He made them all, and He never sets.
      ur: "یہ سب خوبصورت ہیں، اور سب اللہ کے بنائے ہوئے ہیں۔ مگر اللہ ہر چیز سے بڑا ہے — اس نے ان سب کو بنایا، اور وہ کبھی غروب نہیں ہوتا۔"
  - slug: musa
    icon: 🌊
    name:
      ar: موسى
      en: Moses
      ur: "موسیٰ"
    title:
      ar: الذي شقّ البحر
      en: The one who parted the sea
      ur: "وہ جس کے لیے سمندر میں راستہ بنا"
    story:
      ar: وقف موسى أمام البحر الكبير ومعه قومه، ولا طريق أمامه. توكّل على الله وضرب البحر، فانشق طريقًا يمشي عليه. وعبر الجميع سالمين بفضل الله.
      en: Moses stood before the great sea with his people, and there was no road ahead. He trusted God and struck the sea — and it parted into a path to walk through. Everyone crossed safely, by God's grace.
      ur: "موسیٰ اپنی قوم کے ساتھ ایک بڑے سمندر کے سامنے کھڑے تھے، اور آگے کوئی راستہ نہیں تھا۔ انہوں نے اللہ پر بھروسہ کیا اور سمندر پر عصا مارا — تو سمندر میں چلنے کا ایک راستہ کھل گیا۔ اللہ کے فضل سے سب لوگ صحیح سلامت پار ہو گئے۔"
    sprout:
      ar: موسى وثق بالله، فعبر البحر بأمان.
      en: Moses trusted God, and crossed the sea safely.
      ur: "موسیٰ نے اللہ پر بھروسہ کیا اور سمندر کو صحیح سلامت پار کیا۔"
    value:
      ar: الشجاعة والثقة بالله
      en: Courage and trust in God
      ur: "ہمت اور اللہ پر بھروسہ"
    value_icon: 🦁
    question:
      ar: البحر أمامك! ماذا ستفعل؟
      en: The sea is before you! What will you do?
      ur: "سمندر تمہارے سامنے ہے! تم کیا کرو گے؟"
    choices:
      - ar: أتوكّل على الله وأعبر
        en: I trust God and cross 🌊
        ur: "میں اللہ پر بھروسہ کرتا ہوں اور پار کرتا ہوں 🌊"
      - ar: أخاف وأرجع
        en: I feel scared and go back 😨
        ur: "مجھے ڈر لگتا ہے اور میں واپس چلا جاتا ہوں 😨"
    feedback:
      ar: لا بأس أن تشعر بالخوف — موسى شعر به أيضًا. لكن الثقة بالله جعلته شجاعًا، والشجاعة الحقيقية هي أن تمضي قدمًا مع خوفك.
      en: It's okay to feel scared — Moses felt it too. Trust in God made him brave, and real courage is moving forward even when you're scared.
      ur: "ڈر محسوس کرنا ٹھیک ہے — موسیٰ نے بھی یہ محسوس کیا تھا۔ اللہ پر بھروسے نے انہیں بہادر بنایا، اور اصل ہمت یہ ہے کہ ڈر کے باوجود آگے بڑھا جائے۔"
  - slug: isa
    icon: 💛
    name:
      ar: عيسى
      en: Jesus
      ur: "عیسیٰ"
    title:
      ar: صاحب القلب الرحيم
      en: The one with the merciful heart
      ur: "رحم دل والے"
    story:
      ar: كان عيسى يشفي المرضى بإذن الله، ويحنو على الفقراء والمساكين. علّم الناس أن الرحمة تجعل القلوب دافئة، وأن الخير الصغير يصنع فرقًا كبيرًا.
      en: Jesus healed the sick by God's permission, and he was gentle with the poor and the needy. He taught people that mercy makes hearts warm, and that a small kindness can make a big difference.
      ur: "عیسیٰ نے اللہ کی اجازت سے بیماروں کو شفا دی، اور غریبوں اور محتاجوں کے ساتھ نرمی سے پیش آئے۔ انہوں نے لوگوں کو سکھایا کہ رحم دلی سے دل گرم ہوتے ہیں، اور ایک چھوٹی سی مہربانی بڑا فرق ڈال سکتی ہے۔"
    sprout:
      ar: عيسى كان رحيمًا، وعلّم الناس أن يكونوا لطفاء.
      en: Jesus was merciful, and taught people to be kind.
      ur: "عیسیٰ رحم دل تھے، اور انہوں نے لوگوں کو مہربان ہونا سکھایا۔"
    value:
      ar: الرحمة
      en: Mercy
      ur: "رحم"
    value_icon: 💛
    question:
      ar: من ستساعد اليوم؟
      en: Who will you help today?
      ur: "آج تم کس کی مدد کرو گے؟"
    choices:
      - ar: صديق حزين
        en: A sad friend 🫂
        ur: "ایک اداس دوست 🫂"
      - ar: جار كبير في السن
        en: An elderly neighbor 👴
        ur: "ایک بزرگ پڑوسی 👴"
      - ar: قطة جائعة
        en: A hungry cat 🐱
        ur: "ایک بھوکی بلی 🐱"
    feedback:
      ar: اختيار رائع! الرحمة تبدأ بخطوة صغيرة — وقد بدأتها أنت اليوم.
      en: Wonderful choice! Mercy begins with one small step — and you just took yours today.
      ur: "کیا ہی اچھا انتخاب ہے! رحم کا آغاز ایک چھوٹے سے قدم سے ہوتا ہے — اور تم نے آج اپنا قدم اٹھا لیا۔"
