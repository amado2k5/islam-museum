stops:
- slug: adam
  icon: 🌟
  name:
    ar: آدم
    en: Adam
    ur: آدم
    fr: Adam
    tr: Adam
    id: Adam
  title:
    ar: أول إنسان
    en: The first human
    ur: پہلا انسان
    fr: Le premier être humain
    tr: İlk insan
    id: Manusia pertama
  story:
    ar: 'آدم هو أول إنسان خلقه الله. علّم الله آدم أسماء كل الأشياء: النجوم، والبحار، والطيور. وبذلك صار العلم أول هدية للإنسان.'
    en: 'Adam was the first human God created. God taught Adam the names of all things: the stars, the seas, the birds. And so knowledge was the very first gift to humankind.'
    ur: 'آدم اللہ کی پیدا کی ہوئی پہلی انسانی ہستی تھے۔ اللہ نے آدم کو ہر چیز کے نام سکھائے: ستارے، سمندر، پرندے۔ اور یوں علم انسان کا سب سے پہلا تحفہ بنا۔'
    fr: 'Adam est le premier être humain que Dieu a créé. Dieu lui a appris les noms de toutes choses : les étoiles, les mers, les oiseaux. Le savoir a ainsi été le tout premier cadeau fait aux humains.'
    tr: 'Adem, Tanrı tarafından yaratılan ilk insandı. Tanrı Adem''e her şeyin isimlerini öğretti: yıldızlar, denizler ve kuşlar. Böylece, bilgi insanlığa verilen ilk armağan oldu.'
    id: 'Adam adalah manusia pertama yang diciptakan oleh Tuhan. Tuhan mengajarkan Adam nama-nama segala sesuatu: bintang, lautan, dan burung. Dengan demikian, pengetahuan menjadi hadiah pertama bagi umat
      manusia.'
  sprout:
    ar: آدم أول إنسان، وتعلّم أسماء كل الأشياء.
    en: Adam was the first human, and he learned the names of everything.
    ur: آدم پہلے انسان تھے، اور انہوں نے ہر چیز کے نام سیکھے۔
    fr: Adam est le premier être humain, et il a appris les noms de toutes choses.
    tr: Adam ilk insandı ve her şeyin adını öğrendi.
    id: Adam adalah manusia pertama, dan dia mempelajari nama-nama segala sesuatu.
  value:
    ar: حب التعلّم
    en: Love of learning
    ur: علم سے محبت
    fr: L’amour d’apprendre
    tr: Öğrenme sevgisi
    id: Kecintaan belajar
  value_icon: 📚
  question:
    ar: ماذا تريد أن تتعلّم اليوم؟
    en: What do you want to learn about today?
    ur: آج تم کس چیز کے بارے میں سیکھنا چاہتے ہو؟
    fr: Que veux-tu apprendre aujourd’hui ?
    tr: Bugün ne öğrenmek istiyorsunuz?
    id: Apa yang ingin Anda pelajari hari ini?
  choices:
  - ar: النجوم
    en: The stars ✨
    ur: ستارے ✨
    fr: Les étoiles ✨
    tr: Yıldızlar
    id: Bintang
  - ar: الحيوانات
    en: The animals 🦁
    ur: جانور 🦁
    fr: Les animaux 🦁
    tr: Hayvanlar
    id: Hewan
  - ar: الحروف
    en: The letters 🔤
    ur: حروف 🔤
    fr: Les lettres 🔤
    tr: Mektuplar
    id: Surat-surat
  feedback:
    ar: اختيار جميل! آدم تعلّم أسماء كل شيء، وأنت تستطيع أن تتعلّم مثلَه كل يوم.
    en: Lovely choice! Adam learned the names of everything — and you can learn like him, every single day.
    ur: کیا ہی اچھا انتخاب ہے! آدم نے ہر چیز کے نام سیکھے — اور تم بھی ان کی طرح ہر روز سیکھ سکتے ہو۔
    fr: Joli choix ! Adam a appris les noms de toutes choses, et toi aussi, tu peux apprendre chaque jour.
    tr: Harika bir seçim! Adam her şeyin adını öğrendi ve sen de her gün onun gibi öğrenebilirsin.
    id: Pilihan yang indah! Adam belajar nama semuanya, dan kamu bisa belajar seperti dia setiap hari.
- slug: nuh
  icon: 🛶
  name:
    ar: نوح
    en: Noah
    ur: نوح
    fr: Noé
    tr: Noah
    id: Nuh
  title:
    ar: صاحب السفينة الكبيرة
    en: The man with the big ark
    ur: بڑی کشتی والے نبی
    fr: L’homme à la grande arche
    tr: büyük geminin sahibi
    id: pemilik kapal besar
  story:
    ar: دعا نوح قومه إلى الخير تسعمائة وخمسين سنة ولم يملّ أبدًا. بنى سفينة كبيرة بأمر الله وحمل فيها من كل زوجين. وبعد العاصفة العظيمة خرج من السفينة سالمًا مع من معه.
    en: Noah called his people to goodness for nine hundred and fifty years, and he never gave up. At God's command he built a great ark and carried aboard a pair of every creature. After the great flood,
      he walked out of the ark safe and sound, with all who were with him.
    ur: نوح نے اپنی قوم کو نو سو پچاس سال تک نیکی کی طرف بلایا، اور وہ کبھی ہمت نہیں ہارے۔ اللہ کے حکم سے انہوں نے ایک بڑی کشتی بنائی اور اس میں ہر جانور کا ایک جوڑا سوار کیا۔ بڑے سیلاب کے بعد وہ اپنے ساتھیوں
      کے ساتھ کشتی سے صحیح سلامت باہر آئے۔
    fr: Noé a appelé son peuple à faire le bien pendant neuf cent cinquante ans, sans jamais se lasser. Sur l’ordre de Dieu, il a construit un grand bateau et y a fait monter des couples de créatures. Après
      la grande tempête, il en est sorti sain et sauf avec tous ceux qui l’accompagnaient.
    tr: Nuh, halkını dokuz yüz elli yıl boyunca iyiliğe çağırdı ve bundan asla yorulmadı. Tanrı'nın emriyle büyük bir gemi inşa etti ve her iki eşini de yanında taşıdı. Büyük fırtınadan sonra, yanındakilerle
      birlikte gemisini güvenle bıraktı.
    id: Nuh memanggil umat-Nya untuk kebaikan selama sembilan ratus lima puluh tahun dan tidak pernah bosan dengannya. Dia membangun sebuah bahtera besar atas perintah Tuhan dan membawanya bersama kedua
      istrinya. Setelah badai besar, dia meninggalkan bahtera dengan selamat bersama mereka yang bersamanya.
  sprout:
    ar: نوح صبر طويلًا، وبنى سفينة كبيرة بأمر الله.
    en: Noah was patient for a long time, and built a big ark at God's command.
    ur: نوح نے بہت دیر تک صبر کیا، اور اللہ کے حکم سے ایک بڑی کشتی بنائی۔
    fr: Noé a longtemps fait preuve de patience et a construit un grand bateau sur l’ordre de Dieu.
    tr: Nuh uzun süre sabırlıydı ve Tanrı'nın emriyle büyük bir gemi inşa etti.
    id: Nuh sabar lama dan membangun sebuah bahtera besar atas perintah Tuhan.
  value:
    ar: الصبر
    en: Patience
    ur: صبر
    fr: La patience
    tr: Sabır
    id: Kesabaran
  value_icon: 🐢
  question:
    ar: من سيصعد معك إلى السفينة؟
    en: Who will come aboard the ark with you?
    ur: کشتی میں تمہارے ساتھ کون سوار ہوگا؟
    fr: Qui montera dans l’arche avec toi ?
    tr: Kim seninle gemiye binecek?
    id: Siapa yang akan naik kapal bersamamu?
  choices:
  - ar: الأسد
    en: The lion 🦁
    ur: شیر 🦁
    fr: Le lion 🦁
    tr: Aslan
    id: Leo
  - ar: الزرافة
    en: The giraffe 🦒
    ur: زرافہ 🦒
    fr: La girafe 🦒
    tr: Zürafa
    id: Jerapah
  - ar: الفيل
    en: The elephant 🐘
    ur: ہاتھی 🐘
    fr: L’éléphant 🐘
    tr: Fil
    id: Gajah
  feedback:
    ar: مرحبًا بك على متن السفينة! نوح صبر طويلًا ولم يستسلم — والصبر قوة عظيمة.
    en: Welcome aboard the ark! Noah was patient for a very long time and never gave up — patience is a great strength.
    ur: کشتی میں خوش آمدید! نوح بہت دیر تک صبر کرتے رہے اور کبھی ہمت نہیں ہاری — صبر ایک بڑی طاقت ہے۔
    fr: 'Bienvenue dans l’arche ! Noé a patienté très longtemps sans abandonner : la patience est une grande force.'
    tr: Gemiye hoş geldiniz! Noah uzun süre sabırlıydı ve pes etmedi — sabır büyük bir güçtür.
    id: Selamat datang di kapal! Noah sabar untuk waktu yang lama dan tidak menyerah — dan kesabaran adalah kekuatan besar.
- slug: ibrahim
  icon: 🌙
  name:
    ar: إبراهيم
    en: Abraham
    ur: ابراہیم
    fr: Abraham
    tr: İbrahim
    id: Ibrahim
  title:
    ar: الباحث عن الخالق
    en: The seeker of the Creator
    ur: خالق کو تلاش کرنے والے
    fr: À la recherche du Créateur
    tr: Yaratıcının arayıcısı
    id: Pencari Sang Pencipta
  story:
    ar: 'نظر إبراهيم إلى النجوم فقال: هذا ربي؟ ثم رآها تغيب. ونظر إلى القمر ثم إلى الشمس، فرأى كلها تغيب. فعلم أن الخالق أعظم من كل شيء يغيب، وأنه لا يغيب أبدًا.'
    en: 'Abraham looked at the stars and asked: could this be my Lord? But he watched them set. He looked at the moon, then the sun — and saw them set too. Then he knew the Creator must be greater than
      anything that sets, and He never sets at all.'
    ur: 'ابراہیم نے ستاروں کو دیکھا اور پوچھا: کیا یہی میرا رب ہے؟ مگر وہ غروب ہو گئے۔ انہوں نے چاند کو دیکھا، پھر سورج کو — وہ بھی غروب ہو گئے۔ تب انہوں نے جان لیا کہ خالق ہر اس چیز سے بڑا ہے جو غروب ہوتی
      ہے، اور وہ کبھی غروب نہیں ہوتا۔'
    fr: Abraham a regardé les étoiles et s’est demandé si elles pouvaient être son Seigneur. Puis il les a vues disparaître. Il a regardé la lune, puis le soleil, et les a vus disparaître aussi. Il a alors
      compris que le Créateur est plus grand que tout ce qui disparaît, et que lui ne disparaît jamais.
    tr: 'İbrahim yıldızlara baktı ve dedi ki: Bu benim Rabbim mi? Sonra onları battıklarını gördü. Ay''a, sonra güneşe baktı ve hepsinin battığını gördü. Yaratıcı''nın batan her şeyden daha büyük olduğunu
      ve asla batmadığını biliyordu.'
    id: 'Abraham menatap bintang-bintang dan berkata: Apakah ini Tuhanku? Lalu ia melihat bintang-bintang itu terbenam. Ia melihat bulan lalu matahari, dan melihat semuanya terbenam. Ia tahu bahwa Sang
      Pencipta lebih besar dari segala sesuatu yang terbenam dan bahwa Ia tidak pernah terbenam.'
  sprout:
    ar: إبراهيم نظر إلى السماء، وعرف أن الخالق أعظم من كل شيء.
    en: Abraham looked at the sky, and knew the Creator is greater than everything.
    ur: ابراہیم نے آسمان کو دیکھا اور جانا کہ خالق ہر چیز سے بڑا ہے۔
    fr: Abraham a regardé le ciel et a compris que le Créateur est plus grand que tout.
    tr: İbrahim gökyüzüne baktı ve Yaratıcı'nın her şeyden büyük olduğunu fark etti.
    id: Abraham menatap langit dan menyadari bahwa Sang Pencipta lebih besar dari segalanya.
  value:
    ar: التفكير العميق
    en: Thinking deeply
    ur: گہرا غور و فکر
    fr: Réfléchir en profondeur
    tr: Derin Düşünme
    id: Pemikiran Mendalam
  value_icon: 🔭
  question:
    ar: 'أيّها أعظم: النجوم أم القمر أم الشمس؟'
    en: 'Which is greatest: the stars, the moon, or the sun?'
    ur: 'ان میں سب سے بڑا کون ہے: ستارے، چاند یا سورج؟'
    fr: 'Qu’est-ce qui est le plus grand : les étoiles, la lune ou le soleil ?'
    tr: 'Hangisi daha büyük: yıldızlar mı, ay mı yoksa güneş mi?'
    id: 'Mana yang lebih besar: bintang, bulan, atau matahari?'
  choices:
  - ar: النجوم
    en: The stars ✨
    ur: ستارے ✨
    fr: Les étoiles ✨
    tr: Yıldızlar
    id: Bintang
  - ar: القمر
    en: The moon 🌙
    ur: چاند 🌙
    fr: La lune 🌙
    tr: Ay
    id: Bulan
  - ar: الشمس
    en: The sun ☀️
    ur: سورج ☀️
    fr: Le soleil ☀️
    tr: Güneş
    id: Matahari
  feedback:
    ar: كلها جميلة، وكلها من صنع الله. لكن الله أعظم من كل شيء — هو الذي خلقها جميعًا ولا يغيب أبدًا.
    en: They are all beautiful, and all made by God. But God is greater than everything — He made them all, and He never sets.
    ur: یہ سب خوبصورت ہیں، اور سب اللہ کے بنائے ہوئے ہیں۔ مگر اللہ ہر چیز سے بڑا ہے — اس نے ان سب کو بنایا، اور وہ کبھی غروب نہیں ہوتا۔
    fr: 'Ils sont tous beaux et tous créés par Dieu. Mais Dieu est plus grand que tout : il les a tous créés et ne disparaît jamais.'
    tr: Hepsi güzeldir ve hepsi Tanrı tarafından yaratılmıştır. Ama Tanrı her şeyden büyüktür — hepsini yarattı ve asla yok olmaz.
    id: Semua itu indah, dan semuanya diciptakan oleh Tuhan. Tapi Tuhan lebih besar dari segalanya — Dia menciptakan mereka semua dan tidak pernah hilang.
- slug: musa
  icon: 🌊
  name:
    ar: موسى
    en: Moses
    ur: موسیٰ
    fr: Moïse
    tr: Musa
    id: Musa
  title:
    ar: الذي شقّ البحر
    en: The one who parted the sea
    ur: وہ جس کے لیے سمندر میں راستہ بنا
    fr: Celui devant qui la mer s’est ouverte
    tr: Denizi bölen
    id: Siapa yang membelah laut
  story:
    ar: وقف موسى أمام البحر الكبير ومعه قومه، ولا طريق أمامه. توكّل على الله وضرب البحر، فانشق طريقًا يمشي عليه. وعبر الجميع سالمين بفضل الله.
    en: Moses stood before the great sea with his people, and there was no road ahead. He trusted God and struck the sea — and it parted into a path to walk through. Everyone crossed safely, by God's grace.
    ur: موسیٰ اپنی قوم کے ساتھ ایک بڑے سمندر کے سامنے کھڑے تھے، اور آگے کوئی راستہ نہیں تھا۔ انہوں نے اللہ پر بھروسہ کیا اور سمندر پر عصا مارا — تو سمندر میں چلنے کا ایک راستہ کھل گیا۔ اللہ کے فضل سے سب
      لوگ صحیح سلامت پار ہو گئے۔
    fr: 'Moïse se tenait avec son peuple devant la grande mer, sans chemin pour avancer. Il a fait confiance à Dieu et a frappé la mer : elle s’est ouverte pour leur laisser un passage. Tous ont traversé
      sains et saufs, par la grâce de Dieu.'
    tr: Musa, halkıyla birlikte Büyük Deniz'in önünde duruyordu ve önünde bir yol yoktu. Tanrı'ya güvendi, denize vurdu ve yürümek için bir yol ayrıldı. Ve herkes Tanrı'nın lütfuyla güvenle geçti.
    id: Musa berdiri di hadapan Laut Besar bersama umatnya, dan tidak ada jalan di depannya. Dia mengandalkan Tuhan dan memukul laut, lalu sebuah jalan terbelah untuk dilalui. Dan semua orang menyeberang
      dengan selamat berkat rahmat Tuhan.
  sprout:
    ar: موسى وثق بالله، فعبر البحر بأمان.
    en: Moses trusted God, and crossed the sea safely.
    ur: موسیٰ نے اللہ پر بھروسہ کیا اور سمندر کو صحیح سلامت پار کیا۔
    fr: Moïse a fait confiance à Dieu et a traversé la mer en sécurité.
    tr: Musa Tanrı'ya güvendi, bu yüzden denizi güvenle geçti.
    id: Musa percaya pada Tuhan, jadi ia menyeberangi laut dengan selamat.
  value:
    ar: الشجاعة والثقة بالله
    en: Courage and trust in God
    ur: ہمت اور اللہ پر بھروسہ
    fr: Le courage et la confiance en Dieu
    tr: Cesaret ve Tanrı'ya güven
    id: Keberanian dan kepercayaan kepada Tuhan
  value_icon: 🦁
  question:
    ar: البحر أمامك! ماذا ستفعل؟
    en: The sea is before you! What will you do?
    ur: سمندر تمہارے سامنے ہے! تم کیا کرو گے؟
    fr: La mer est devant toi ! Que vas-tu faire ?
    tr: Deniz önünde! Ne yapacaksın?
    id: Laut ada di depanmu! Apa yang akan kamu lakukan?
  choices:
  - ar: أتوكّل على الله وأعبر
    en: I trust God and cross 🌊
    ur: میں اللہ پر بھروسہ کرتا ہوں اور پار کرتا ہوں 🌊
    fr: Je fais confiance à Dieu et je traverse 🌊
    tr: Tanrı'ya bağımlıyım ve ifade ediyorum
    id: Saya bergantung pada Tuhan dan mengekspresikan
  - ar: أخاف وأرجع
    en: I feel scared and go back 😨
    ur: مجھے ڈر لگتا ہے اور میں واپس چلا جاتا ہوں 😨
    fr: J’ai peur et je retourne en arrière 😨
    tr: Korkuyorum ve geri döneceğim.
    id: Aku takut dan aku akan kembali.
  feedback:
    ar: لا بأس أن تشعر بالخوف — موسى شعر به أيضًا. لكن الثقة بالله جعلته شجاعًا، والشجاعة الحقيقية هي أن تمضي قدمًا مع خوفك.
    en: It's okay to feel scared — Moses felt it too. Trust in God made him brave, and real courage is moving forward even when you're scared.
    ur: ڈر محسوس کرنا ٹھیک ہے — موسیٰ نے بھی یہ محسوس کیا تھا۔ اللہ پر بھروسے نے انہیں بہادر بنایا، اور اصل ہمت یہ ہے کہ ڈر کے باوجود آگے بڑھا جائے۔
    fr: 'Tu as le droit d’avoir peur : Moïse aussi a eu peur. La confiance en Dieu lui a donné du courage. Le vrai courage, c’est avancer même quand on a peur.'
    tr: Korku hissetmek normaldir — Musa da hissetti. Ama Tanrı'ya güvenmek onu cesur yaptı ve gerçek cesaret, korkunla ilerlemektir.
    id: Tidak apa-apa merasa takut — Musa juga merasakannya. Tapi percaya pada Tuhan membuatnya berani, dan keberanian sejati adalah melangkah maju dengan ketakutanmu.
- slug: isa
  icon: 💛
  name:
    ar: عيسى
    en: Jesus
    ur: عیسیٰ
    fr: Jésus
    tr: Isa
    id: Isa
  title:
    ar: صاحب القلب الرحيم
    en: The one with the merciful heart
    ur: رحم دل والے
    fr: L’homme au cœur bienveillant
    tr: Merhametli kalpli olan
    id: Yang berhati penuh belas kasihan
  story:
    ar: كان عيسى يشفي المرضى بإذن الله، ويحنو على الفقراء والمساكين. علّم الناس أن الرحمة تجعل القلوب دافئة، وأن الخير الصغير يصنع فرقًا كبيرًا.
    en: Jesus healed the sick by God's permission, and he was gentle with the poor and the needy. He taught people that mercy makes hearts warm, and that a small kindness can make a big difference.
    ur: عیسیٰ نے اللہ کی اجازت سے بیماروں کو شفا دی، اور غریبوں اور محتاجوں کے ساتھ نرمی سے پیش آئے۔ انہوں نے لوگوں کو سکھایا کہ رحم دلی سے دل گرم ہوتے ہیں، اور ایک چھوٹی سی مہربانی بڑا فرق ڈال سکتی ہے۔
    fr: Jésus guérissait les malades avec la permission de Dieu et prenait soin des pauvres et des personnes dans le besoin. Il enseignait que la bienveillance réchauffe les cœurs et qu’un petit geste de
