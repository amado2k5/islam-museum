parts:
- slug: dome
  icon: 🕌
  name:
    ar: القبة
    en: Dome
    ur: گنبد
    fr: Coupole
    tr: kubbe
    id: Kubah
  what:
    ar: القبة سقف مستدير جميل يغطي جزءًا من المسجد، ومن بعيد تراها تلمع في الشمس.
    en: A dome is a beautiful round roof covering part of the mosque — from far away you can see it shine in the sun.
    ur: گنبد ایک خوبصورت گول چھت ہے جو مسجد کے ایک حصے کو ڈھانپتی ہے — دور سے دیکھو تو وہ دھوپ میں چمکتا ہے۔
    fr: Une coupole est un beau toit arrondi qui couvre une partie de la mosquée. De loin, on peut la voir briller au soleil.
    tr: Kubbenin caminin bir kısmını kaplayan güzel yuvarlak bir çatısı vardır ve uzaktan güneşte parladığını görebilirsiniz.
    id: Kubah ini memiliki atap bundar yang indah menutupi sebagian masjid, dan dari kejauhan Anda dapat melihatnya bersinar di bawah sinar matahari.
  example_building:
    ar: مثل القبة الذهبية في قبة الصخرة بالقدس
    en: like the golden dome of the Dome of the Rock in Jerusalem
    ur: جیسے یروشلم میں قبۃ الصخرہ کا سنہری گنبد
    fr: comme la coupole dorée du Dôme du Rocher à Jérusalem
    tr: Kudüs'teki Kaya Kubbesi'ndeki Altın Kubbe gibi
    id: Seperti Kubah Emas di Kubah Batu di Yerusalem
- slug: minaret
  icon: 🗼
  name:
    ar: المئذنة
    en: Minaret
    ur: مینار
    fr: Minaret
    tr: Minare
    id: Menara
  what:
    ar: المئذنة برج طويل يرتفع بجانب المسجد، ومنها يُنادى للصلاة.
    en: A minaret is a tall tower rising beside the mosque, from which the call to prayer is made.
    ur: مینار ایک اونچا برج ہے جو مسجد کے ساتھ کھڑا ہوتا ہے، جہاں سے اذان دی جاتی ہے۔
    fr: Un minaret est une haute tour qui s’élève à côté de la mosquée et d’où l’on lance l’appel à la prière.
    tr: Minare, caminin yanında yükselen yüksek bir kuledir ve buradan ezan yapılır.
    id: Menara menara adalah menara tinggi yang menjulang di samping masjid, dari mana panggilan untuk salat dibuat.
  example_building:
    ar: مثل مآذن المسجد النبوي في المدينة
    en: like the minarets of the Prophet's Mosque in Medina
    ur: جیسے مدینہ میں مسجدِ نبوی کے مینار
    fr: comme les minarets de la mosquée du Prophète à Médine
    tr: Medine'deki Peygamber Camii minareleri gibi
    id: Seperti menara masjid Nabi di Madinah
- slug: courtyard
  icon: 🌳
  name:
    ar: الصحن
    en: Courtyard
    ur: صحن
    fr: Cour
    tr: Plaka
    id: Pelat
  what:
    ar: الصحن ساحة مفتوحة في وسط المسجد، يجلس فيها الناس في الهواء الطلق.
    en: The courtyard is an open square in the middle of the mosque, where people sit out in the open air.
    ur: صحن مسجد کے بیچ میں ایک کھلا چوک ہوتا ہے، جہاں لوگ کھلی ہوا میں بیٹھتے ہیں۔
    fr: La cour est une place ouverte au milieu de la mosquée, où l’on peut s’asseoir en plein air.
    tr: Avlu, caminin ortasında açık bir meydandır ve insanlar burada dışarıda oturur.
    id: Halaman adalah alun-alun terbuka di tengah masjid, tempat orang-orang duduk di luar ruangan.
  example_building:
    ar: مثل صحن جامع قرطبة الكبير
    en: like the courtyard of the Great Mosque of Cordoba
    ur: جیسے قرطبہ کی جامع مسجد کا صحن
    fr: comme la cour de la Grande Mosquée de Cordoue
    tr: Cordoba Büyük Camii gibi.
    id: Seperti Masjid Besar Cordoba.
- slug: prayer-hall
  icon: 🤲
  name:
    ar: قاعة الصلاة
    en: Prayer hall
    ur: نماز کا ہال
    fr: Salle de prière
    tr: namaz salonu
    id: ruang doa
  what:
    ar: قاعة الصلاة هي الغرفة الكبيرة التي يقف فيها الناس صفوفًا للصلاة.
    en: The prayer hall is the big room where people stand in rows to pray.
    ur: نماز کا ہال وہ بڑا کمرہ ہے جہاں لوگ قطاروں میں کھڑے ہو کر نماز پڑھتے ہیں۔
    fr: La salle de prière est la grande pièce où les fidèles se tiennent en rangs pour prier.
    tr: Dua salonu, insanların sıralar halinde dua etmek için sıralar halinde durduğu büyük bir odadır.
    id: Aula doa adalah ruangan besar tempat orang-orang berdiri berbaris untuk berdoa.
  example_building:
    ar: مثل قاعة جامع قرطبة التي تحملها نحو ألف عمود
    en: like Cordoba's prayer hall, held up by about a thousand columns
    ur: جیسے قرطبہ کا نماز کا ہال، جسے تقریباً ایک ہزار ستون سنبھالتے ہیں
    fr: comme la salle de prière de Cordoue, soutenue par environ mille colonnes
    tr: Yaklaşık bin sütun taşıyan Kordoba Camii salonu gibi.
    id: Seperti aula Masjid Cordoba, yang memiliki sekitar seribu kolom.
- slug: mihrab
  icon: 🧭
  name:
    ar: المحراب
    en: Mihrab
    ur: محراب
    fr: Mihrab
    tr: Mihrab
    id: Mihrab
  what:
    ar: المحراب تجويف صغير في الجدار يدل على اتجاه القبلة نحو الكعبة.
    en: The mihrab is a small niche in the wall that shows the direction of the Kaaba.
    ur: محراب دیوار میں ایک چھوٹا سا طاق ہے جو کعبہ کی سمت بتاتا ہے۔
    fr: Le mihrab est une petite niche dans le mur qui indique la direction de la Kaaba.
    tr: Mihrap, duvarda kıblenin Kabe'ye yönünü gösteren küçük bir boşluktur.
    id: Mihrab adalah rongga kecil di dinding yang menunjukkan arah qibla menuju Ka'bah.
  example_building:
    ar: مثل محراب المسجد الأقصى
    en: like the mihrab of Al-Aqsa Mosque
    ur: جیسے مسجدِ اقصیٰ کی محراب
    fr: comme le mihrab de la mosquée al-Aqsa
    tr: Mescid-i Mescid'in mihrabi gibi
    id: Seperti mihrab Masjid Al-Aqsa
- slug: main-door
  icon: 🚪
  name:
    ar: الباب الكبير
    en: Main door
    ur: بڑا دروازہ
    fr: Porte principale
    tr: Büyük kapı
    id: Pintu besar
  what:
    ar: الباب الكبير هو المدخل الواسع الذي يدخل منه الناس إلى المسجد.
    en: The main door is the wide entrance through which people enter the mosque.
    ur: بڑا دروازہ وہ کشادہ داخلی راستہ ہے جہاں سے لوگ مسجد میں داخل ہوتے ہیں۔
    fr: La porte principale est la large entrée par laquelle on entre dans la mosquée.
    tr: Büyük Kapı, insanların camiye girdiği geniş giriştir.
    id: Gerbang Besar adalah pintu masuk lebar tempat orang masuk ke masjid.
  example_building:
    ar: مثل أبواب المسجد الحرام الكبيرة
    en: like the great doors of the Sacred Mosque
    ur: جیسے مسجدِ حرام کے بڑے دروازے
    fr: comme les grandes portes de la Mosquée sacrée
    tr: Mescidin büyük kapıları gibi
    id: Seperti pintu besar Masjid Agung
- slug: fountain
  icon: 💧
  name:
    ar: الميضأة
    en: Fountain
    ur: فوارہ
    fr: Fontaine
    tr: Abdest alma
    id: Mandi
  what:
    ar: الميضأة مكان فيه ماء نظيف، يتوضأ منه الناس قبل الصلاة.
    en: The fountain is a place with clean water, where people do wudu before praying.
    ur: فوارہ وہ جگہ ہے جہاں صاف پانی ہوتا ہے، اور لوگ نماز سے پہلے وضو کرتے ہیں۔
    fr: La fontaine offre de l’eau propre pour faire ses ablutions avant la prière.
    tr: Abdest, temiz suya sahip bir yerdir ve insanlar namazdan önce abdest alır.
    id: Wudhu adalah tempat dengan air bersih, di mana orang melakukan wudhu sebelum berdoa.
  example_building:
    ar: مثل البرك الثلاث في المسجد الحرام
    en: like the three basins in the Sacred Mosque
    ur: جیسے مسجدِ حرام کے تین حوض
    fr: comme les trois bassins de la Mosquée sacrée
    tr: Mescid'deki üç havuz gibi
    id: Seperti tiga kolam di Masjid Agung
