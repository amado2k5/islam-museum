parts:
  - slug: dome
    icon: "🕌"
    name: { ar: "القبة", en: "Dome" }
    what:
      ar: "القبة سقف مستدير جميل يغطي جزءًا من المسجد، ومن بعيد تراها تلمع في الشمس."
      en: "A dome is a beautiful round roof covering part of the mosque — from far away you can see it shine in the sun."
    example_building:
      ar: "مثل القبة الذهبية في قبة الصخرة بالقدس"
      en: "like the golden dome of the Dome of the Rock in Jerusalem"

  - slug: minaret
    icon: "🗼"
    name: { ar: "المئذنة", en: "Minaret" }
    what:
      ar: "المئذنة برج طويل يرتفع بجانب المسجد، ومنها يُنادى للصلاة."
      en: "A minaret is a tall tower rising beside the mosque, from which the call to prayer is made."
    example_building:
      ar: "مثل مآذن المسجد النبوي في المدينة"
      en: "like the minarets of the Prophet's Mosque in Medina"

  - slug: courtyard
    icon: "🌳"
    name: { ar: "الصحن", en: "Courtyard" }
    what:
      ar: "الصحن ساحة مفتوحة في وسط المسجد، يجلس فيها الناس في الهواء الطلق."
      en: "The courtyard is an open square in the middle of the mosque, where people sit out in the open air."
    example_building:
      ar: "مثل صحن جامع قرطبة الكبير"
      en: "like the courtyard of the Great Mosque of Cordoba"

  - slug: prayer-hall
    icon: "🤲"
    name: { ar: "قاعة الصلاة", en: "Prayer hall" }
    what:
      ar: "قاعة الصلاة هي الغرفة الكبيرة التي يقف فيها الناس صفوفًا للصلاة."
      en: "The prayer hall is the big room where people stand in rows to pray."
    example_building:
      ar: "مثل قاعة جامع قرطبة التي تحملها نحو ألف عمود"
      en: "like Cordoba's prayer hall, held up by about a thousand columns"

  - slug: mihrab
    icon: "🧭"
    name: { ar: "المحراب", en: "Mihrab" }
    what:
      ar: "المحراب تجويف صغير في الجدار يدل على اتجاه القبلة نحو الكعبة."
      en: "The mihrab is a small niche in the wall that shows the direction of the Kaaba."
    example_building:
      ar: "مثل محراب المسجد الأقصى"
      en: "like the mihrab of Al-Aqsa Mosque"

  - slug: main-door
    icon: "🚪"
    name: { ar: "الباب الكبير", en: "Main door" }
    what:
      ar: "الباب الكبير هو المدخل الواسع الذي يدخل منه الناس إلى المسجد."
      en: "The main door is the wide entrance through which people enter the mosque."
    example_building:
      ar: "مثل أبواب المسجد الحرام الكبيرة"
      en: "like the great doors of the Sacred Mosque"

  - slug: fountain
    icon: "💧"
    name: { ar: "الميضأة", en: "Fountain" }
    what:
      ar: "الميضأة مكان فيه ماء نظيف، يتوضأ منه الناس قبل الصلاة."
      en: "The fountain is a place with clean water, where people do wudu before praying."
    example_building:
      ar: "مثل البرك الثلاث في المسجد الحرام"
      en: "like the three basins in the Sacred Mosque"

