lessons:
  - unit_slug: garden
    experience_href: "/sighar/garden/"
    objectives:
      ar:
        - "أن يتعرّف التلميذ على 5–8 مفردات قرآنية ومعانيها بأسلوب اللعب."
        - "أن يلاحظ التلميذ اختلافَ صيغ الكلمة الواحدة من موضع لآخر."
        - "أن يربط التلميذ الكلمة بموقف من حياته اليومية."
      en:
        - "Students recognize 5–8 Quranic words and their meanings through play."
        - "Each student notices how one word can appear in different forms in different places."
        - "Students connect a word to a situation in their daily life."
      ur:
        - "طلبہ کھیل کے ذریعے 5 تا 8 قرآنی الفاظ اور ان کے معنی پہچانیں۔"
        - "ہر طالب علم دیکھے کہ ایک ہی لفظ مختلف مقامات پر مختلف صورتوں میں کیسے آتا ہے۔"
        - "طلبہ کسی لفظ کو اپنی روزمرہ زندگی کی ایک صورتِ حال سے جوڑیں۔"
    flow_40min:
      ar:
        - { t: "0-5", what: "ترحيب سريع: اكتب كلمة اليوم على السبورة واطلب من كل تلميذ أن يخمّن معناها قبل فتح الحديقة." }
        - { t: "5-15", what: "استكشاف حر: يفتح التلاميذ حديقة الكلمة ويتتبعون الصيغ والمواضع (10 دقائق صامتة)." }
        - { t: "15-25", what: "تحدي الكويز: اعرض أسئلة الحديقة على الشاشة الكبيرة وصوّتوا معًا (وضع الفصل)." }
        - { t: "25-35", what: "ورقة العمل: ارسم زهرة الكلمة واكتب حولها ثلاث جمل من تأليفك." }
        - { t: "35-40", what: "ختام: يشارك كل تلميذ جملة واحدة، وتُعلَّق أفضل الجمل على لوحة الفصل." }
      en:
        - { t: "0-5", what: "Quick welcome: write the word of the day on the board and ask every student to guess its meaning before opening the Garden." }
        - { t: "5-15", what: "Free exploration: students open the Word Garden and trace the word's forms and occurrences (10 quiet minutes)." }
        - { t: "15-25", what: "Quiz challenge: show the Garden's quiz on the big screen and vote together (classroom mode)." }
        - { t: "25-35", what: "Worksheet: draw the word's flower and write three sentences of your own around it." }
        - { t: "35-40", what: "Closing: each student shares one sentence; pin the best ones on the class board." }
      ur:
        - { t: "0-5", what: "فوری خوش آمدید: تختہ سیاہ پر آج کا لفظ لکھیں اور ہر طالب علم سے باغ کھولنے سے پہلے اس کے معنی کا اندازہ لگانے کو کہیں۔" }
        - { t: "5-15", what: "آزاد دریافت: طلبہ لفظوں کا باغ کھولیں اور لفظ کی صورتیں اور مقامات تلاش کریں (10 خاموش منٹ)۔" }
        - { t: "15-25", what: "کوئز چیلنج: باغ کا کوئز بڑی اسکرین پر دکھائیں اور مل کر ووٹ دیں (جماعت کا موڈ)۔" }
        - { t: "25-35", what: "ورک شیٹ: لفظ کا پھول بنائیں اور اس کے گرد اپنے تین جملے لکھیں۔" }
        - { t: "35-40", what: "اختتام: ہر طالب علم ایک جملہ سنائے؛ بہترین جملے جماعت کے تختے پر لگائیں۔" }
    discussion_prompts:
      ar:
        - "لماذا تتغير صيغة الكلمة نفسها من موضع لآخر؟"
        - "أي موضع أعجبك أكثر؟ ولماذا؟"
        - "كيف تساعدنا خريطة الكلمة على فهم القرآن الكريم؟"
      en:
        - "Why does the same word change form from one place to another?"
        - "Which occurrence did you like best? Why?"
        - "How does a word map help us understand the Quran?"
      ur:
        - "ایک ہی لفظ ایک جگہ سے دوسری جگہ صورت کیوں بدلتا ہے؟"
        - "آپ کو کون سا مقام سب سے زیادہ پسند آیا؟ کیوں؟"
        - "لفظوں کا نقشہ ہمیں قرآن کو سمجھنے میں کیسے مدد دیتا ہے؟"
    worksheet:
      ar:
        - "اكتب كلمة اليوم بيدك ثلاث مرات بخط جميل."
        - "اختر موضعين من الخريطة واكتب رقم السورة والآية لكل منهما."
        - "اكتب جملة من تأليفك تستخدم فيها الكلمة."
        - "ارسم زهرة للكلمة واكتب صيغها على أوراقها."
        - "اسأل أحد والديك: هل يعرف معنى هذه الكلمة؟ واكتب إجابته."
      en:
        - "Write the word of the day by hand three times, in your best handwriting."
        - "Pick two occurrences from the map and write the surah and verse numbers."
        - "Write a sentence of your own using the word."
        - "Draw a flower for the word and write its forms on the petals."
        - "Ask a parent: do they know this word's meaning? Write down their answer."
      ur:
        - "آج کا لفظ اپنے بہترین خط میں ہاتھ سے تین بار لکھیں۔"
        - "نقشے سے دو مقامات چنیں اور ہر ایک کا سورہ اور آیت نمبر لکھیں۔"
        - "لفظ استعمال کرتے ہوئے اپنا ایک جملہ لکھیں۔"
        - "لفظ کے لیے ایک پھول بنائیں اور اس کی صورتیں پنکھڑیوں پر لکھیں۔"
        - "کسی والدین سے پوچھیں: کیا وہ اس لفظ کے معنی جانتے ہیں؟ ان کا جواب لکھیں۔"

  - unit_slug: quest
    experience_href: "/sighar/quest/"
    objectives:
      ar:
        - "أن يسرد التلميذ قصة كل نبي من الأنبياء الخمسة بجملة أو جملتين."
        - "أن يسمّي التلميذ القيمة الأخلاقية المستفادة من كل قصة."
        - "أن يشارك التلميذ في الاختيار الجماعي (وضع الفصل) باحترام آراء الآخرين."
      en:
        - "Students narrate each of the five prophets' stories in one or two sentences."
        - "Students name the moral value learned from each story."
        - "Students take part in the group choice (classroom mode) while respecting others' opinions."
      ur:
        - "طلبہ پانچوں نبیوں میں سے ہر ایک کی کہانی ایک یا دو جملوں میں بیان کریں۔"
        - "طلبہ ہر کہانی سے سیکھی گئی اخلاقی قدر کا نام بتائیں۔"
        - "طلبہ دوسروں کی رائے کا احترام کرتے ہوئے گروہی انتخاب (جماعت کے موڈ) میں حصہ لیں۔"
    flow_40min:
      ar:
        - { t: "0-5", what: "مقدمة: اسأل الفصل — هل سمعتم عن الأنبياء الخمسة؟ واكتب أسماءهم على السبورة." }
        - { t: "5-20", what: "رحلة تفاعلية: افتح رحلة الأنبياء على الشاشة الكبيرة، واقرؤوا قصة كل محطة معًا، ثم صوّتوا على الاختيار." }
        - { t: "20-30", what: "نقاش القيم: بعد كل محطة توقّف واسأل — ما القيمة هنا؟ ودوّنها على السبورة." }
        - { t: "30-38", what: "ورقة العمل: اختر نبيًّا واحدًا واكتب قصته بكلماتك في ثلاثة أسطر." }
        - { t: "38-40", what: "ختام: صفّقوا لأنفسكم — أنتم الآن تعرفون قصص خمسة أنبياء!" }
      en:
        - { t: "0-5", what: "Introduction: ask the class — have you heard of the five prophets? Write their names on the board." }
        - { t: "5-20", what: "Interactive journey: open the Prophet Quest on the big screen, read each stop's story together, then vote on the choice." }
        - { t: "20-30", what: "Values discussion: pause after each stop and ask — what is the value here? Write it on the board." }
        - { t: "30-38", what: "Worksheet: pick one prophet and write their story in your own words in three lines." }
        - { t: "38-40", what: "Closing: give yourselves a round of applause — you now know the stories of five prophets!" }
      ur:
        - { t: "0-5", what: "تمہید: جماعت سے پوچھیں — کیا آپ نے پانچ نبیوں کے بارے میں سنا ہے؟ ان کے نام تختے پر لکھیں۔" }
        - { t: "5-20", what: "انٹرایکٹو سفر: نبیوں کا سفر بڑی اسکرین پر کھولیں، ہر پڑاؤ کی کہانی مل کر پڑھیں، پھر انتخاب پر ووٹ دیں۔" }
        - { t: "20-30", what: "قدروں پر گفتگو: ہر پڑاؤ کے بعد رک کر پوچھیں — یہاں کون سی قدر ہے؟ اسے تختے پر لکھیں۔" }
        - { t: "30-38", what: "ورک شیٹ: ایک نبی چنیں اور ان کی کہانی اپنے الفاظ میں تین سطروں میں لکھیں۔" }
        - { t: "38-40", what: "اختتام: خود کو تالیاں دیں — اب آپ پانچ نبیوں کی کہانیاں جانتے ہیں!" }
    discussion_prompts:
      ar:
        - "أي نبي واجه أصعب موقف؟ وكيف تجاوزه؟"
        - "ما القيمة المشتركة بين القصص الخمس؟"
        - "كيف تطبّق قيمة الصبر في مدرستك هذا الأسبوع؟"
      en:
        - "Which prophet faced the hardest situation? How did he get through it?"
        - "What value do all five stories share?"
        - "How will you practice patience at school this week?"
      ur:
        - "کس نبی کو سب سے مشکل صورتِ حال کا سامنا کرنا پڑا؟ انہوں نے اس سے کیسے گزر کیا؟"
        - "پانچوں کہانیوں میں مشترک قدر کون سی ہے؟"
        - "آپ اس ہفتے اسکول میں صبر کی مشق کیسے کریں گے؟"
    worksheet:
      ar:
        - "رتّب الأنبياء الخمسة حسب ظهورهم في الرحلة."
        - "اكتب القيمة المستفادة من قصة كل نبي."
        - "ارسم مشهدًا واحدًا من القصة التي أعجبتك أكثر."
        - "اكتب سؤالًا واحدًا تتمنى أن تسأله لنبي من الأنبياء."
        - "شارك ورقتك مع زميلك وقارنا الإجابات."
      en:
        - "Order the five prophets as they appear in the quest."
        - "Write the value learned from each prophet's story."
        - "Draw one scene from the story you liked best."
        - "Write one question you wish you could ask one of the prophets."
        - "Share your sheet with a classmate and compare answers."
      ur:
        - "پانچوں نبیوں کو اس سفر میں ان کے ظہور کی ترتیب سے لکھیں۔"
        - "ہر نبی کی کہانی سے سیکھی گئی قدر لکھیں۔"
        - "جو کہانی آپ کو سب سے زیادہ پسند آئی اس کا ایک منظر بنائیں۔"
        - "ایک سوال لکھیں جو آپ کسی نبی سے پوچھنا چاہیں گے۔"
        - "اپنی ورک شیٹ کسی ساتھی کے ساتھ بانٹیں اور جوابات کا موازنہ کریں۔"

  - unit_slug: kindness
    experience_href: "/sighar/kindness/"
    objectives:
      ar:
        - "أن يمارس التلميذ عملًا صالحًا واحدًا يوميًّا لمدة أسبوع على الأقل."
        - "أن يفهم التلميذ أن الخير الصغير يصنع فرقًا كبيرًا."
        - "أن يسجّل التلميذ أعماله في مخطط الملصقات (المطبوع أو الرقمي)."
      en:
        - "Students practice one good deed a day for at least a week."
        - "Students understand that a small kindness can make a big difference."
        - "Students record their deeds on the sticker chart (printed or digital)."
      ur:
        - "طلبہ کم از کم ایک ہفتے تک روزانہ ایک نیک عمل کی مشق کریں۔"
        - "طلبہ سمجھیں کہ چھوٹی سی مہربانی بڑا فرق ڈال سکتی ہے۔"
        - "طلبہ اپنے اعمال اسٹکر چارٹ میں درج کریں (چھپا ہوا یا ڈیجیٹل)۔"
    flow_40min:
      ar:
        - { t: "0-5", what: "افتح صفحة رحلة اللطف واعرض مخطط الأيام الثلاثين — اشرح فكرة التحدي." }
        - { t: "5-15", what: "اقرأ مع الفصل أعمال الأيام السبعة الأولى وناقشوا: أيها أسهل؟ وأيها أصعب؟" }
        - { t: "15-25", what: "اطبع مخطط الملصقات ووزّعه؛ كل تلميذ يلوّن اليوم الأول بعد أن ينفّذ العمل في البيت." }
        - { t: "25-35", what: "ورقة العمل: اكتب ثلاثة أعمال لطف تستطيع فعلها في المدرسة هذا الأسبوع." }
        - { t: "35-40", what: "وعد اللطف: كل تلميذ يعلن عملًا واحدًا سيفعله اليوم." }
      en:
        - { t: "0-5", what: "Open the Kindness Quest page and show the 30-day chart — explain the challenge idea." }
        - { t: "5-15", what: "Read the first seven days' deeds with the class and discuss: which is easiest? Which is hardest?" }
        - { t: "15-25", what: "Print the sticker chart and hand it out; each student colors day one after doing the deed at home." }
        - { t: "25-35", what: "Worksheet: write three kind deeds you can do at school this week." }
        - { t: "35-40", what: "The kindness promise: each student announces one deed they will do today." }
      ur:
        - { t: "0-5", what: "مہربانی کے سفر کا صفحہ کھولیں اور 30 دن کا چارٹ دکھائیں — چیلنج کا خیال سمجھائیں۔" }
        - { t: "5-15", what: "جماعت کے ساتھ پہلے سات دن کے اعمال پڑھیں اور گفتگو کریں: کون سا سب سے آسان ہے؟ کون سا سب سے مشکل؟" }
        - { t: "15-25", what: "اسٹکر چارٹ چھاپ کر تقسیم کریں؛ ہر طالب علم گھر پر عمل کرنے کے بعد پہلے دن کو رنگ دے۔" }
        - { t: "25-35", what: "ورک شیٹ: اس ہفتے اسکول میں کر سکنے والے تین مہربانی کے اعمال لکھیں۔" }
        - { t: "35-40", what: "مہربانی کا وعدہ: ہر طالب علم ایک ایسا عمل بتائے جو وہ آج کرے گا۔" }
    discussion_prompts:
      ar:
        - "لماذا يصعب علينا أحيانًا أن نكون لطفاء؟"
        - "هل اللطف مع الحيوانات والنباتات مهم مثل اللطف مع الناس؟"
        - "كيف نشجّع زميلًا نسى أن يفعل عمله اليوم؟"
      en:
        - "Why is it sometimes hard to be kind?"
        - "Is kindness to animals and plants as important as kindness to people?"
        - "How do we encourage a classmate who forgot to do their deed today?"
      ur:
        - "مہربان ہونا کبھی کبھی مشکل کیوں ہوتا ہے؟"
        - "جانوروں اور پودوں کے ساتھ مہربانی انسانوں کے ساتھ مہربانی جتنی ہی اہم ہے؟"
        - "ہم اس ساتھی کی حوصلہ افزائی کیسے کریں جو آج اپنا عمل کرنا بھول گیا؟"
    worksheet:
      ar:
        - "اكتب ثلاثة أعمال لطف للمدرسة وثلاثة للبيت."
        - "اختر عملًا واحدًا ونفّذه اليوم، ثم صِف شعورك بعده."
        - "ارسم وجهًا مبتسمًا لكل يوم أنجزت فيه عمل اللطف هذا الأسبوع."
        - "اكتب رسالة شكر قصيرة لشخص أسعدك."
        - "اسأل معلّمك: ما عمل اللطف الذي يفعله هو؟"
      en:
        - "Write three kind deeds for school and three for home."
        - "Pick one deed, do it today, then describe how you felt afterwards."
        - "Draw a smiley face for each day this week you completed your kind deed."
        - "Write a short thank-you note to someone who made you happy."
        - "Ask your teacher: what kind deed do they do?"
      ur:
        - "اسکول کے لیے تین اور گھر کے لیے تین مہربانی کے اعمال لکھیں۔"
        - "ایک عمل چنیں، آج کریں، پھر بتائیں کہ بعد میں آپ کیسا محسوس کر رہے تھے۔"
        - "اس ہفتے کے ہر اس دن کے لیے ایک مسکراتا چہرہ بنائیں جس دن آپ نے مہربانی کا عمل مکمل کیا۔"
        - "کسی ایسے شخص کے لیے شکریے کا ایک مختصر نوٹ لکھیں جس نے آپ کو خوش کیا۔"
        - "اپنے استاد سے پوچھیں: وہ کون سا مہربانی کا عمل کرتے ہیں؟"

  - unit_slug: stories
    experience_href: "/sighar/stories/"
    objectives:
      ar:
        - "أن يستمع التلميذ بانتباه لقصة كاملة مدتها خمس دقائق."
        - "أن يجيب التلميذ عن سؤال «تحدثوا عنها» بجملة كاملة."
        - "أن يميّز التلميذ بين الخير والشر في أحداث القصة."
      en:
        - "Students listen attentively to a complete five-minute story."
        - "Students answer the 'talk about it' question in a full sentence."
        - "Students tell good from bad in the story's events."
      ur:
        - "طلبہ پانچ منٹ کی ایک مکمل کہانی غور سے سنیں۔"
        - "طلبہ 'اس پر بات کریں' والے سوال کا مکمل جملے میں جواب دیں۔"
        - "طلبہ کہانی کے واقعات میں اچھے اور برے کو پہچانیں۔"
    flow_40min:
      ar:
        - { t: "0-5", what: "تهيئة: اخفض الإضاءة قليلًا واجلسوا في دائرة — وقت القصة!" }
        - { t: "5-15", what: "اقرأ قصة واحدة بصوت هادئ ومعبّر (أو شغّل التسجيل الصوتي إن وُجد)." }
        - { t: "15-25", what: "نقاش «تحدثوا عنها»: اطرح السؤال المرفق ودع 4–5 تلاميذ يجيبون." }
        - { t: "25-35", what: "ورقة العمل: ارسم نهاية بديلة للقصة أو مشهدك المفضل." }
        - { t: "35-40", what: "ختام هادئ: يقول كل تلميذ كلمة واحدة تصف شعوره بعد القصة." }
      en:
        - { t: "0-5", what: "Set the mood: dim the lights a little and sit in a circle — story time!" }
        - { t: "5-15", what: "Read one story in a calm, expressive voice (or play the audio narration if available)." }
