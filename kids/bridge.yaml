    title: { ar: "التاعات التسع لحفظ القرآن", en: "Nine techniques for memorizing the Quran", ur: "قرآن حفظ کرنے کے نو طریقے", fr: "Neuf méthodes pour mémoriser le Coran" }
    desc:
