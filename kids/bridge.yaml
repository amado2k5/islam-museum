      ar: "قصة كاملة من البداية إلى النهاية: مولدٌ معجز، ومعجزاتٌ عظيمة، ورفعٌ إلى السماء."
      en: "A full story from beginning to end: a miraculous birth, great miracles, and an ascension."
      ur: "ابتدا سے انجام تک مکمل کہانی: ایک معجزاتی ولادت، عظیم معجزات، اور آسمان پر اٹھائے جانا۔"
      fr: "Un récit complet, du début à la fin : une naissance miraculeuse, de grands miracles et une élévation au ciel."

  - slug: nasl-nuh
    kind: story
    title: { ar: "نسل نوح", en: "The progeny of Nuh", ur: "نوح کی نسل", fr: "La descendance de Noé" }
    desc:
      ar: "بعد الطوفان، من أين جاء الناس؟ تعرّف على أبناء نوح الثلاثة وأين سكنت ذريتهم."
      en: "After the Flood, where did people come from? Meet Nuh's three sons and where their descendants settled."
      ur: "طوفان کے بعد لوگ کہاں سے آئے؟ نوح کے تین بیٹوں سے ملیں اور جانیں کہ ان کی نسل کہاں آباد ہوئی۔"
      fr: Après le Déluge, d’où viennent les peuples ? Découvre les trois fils de Noé et les régions où leurs descendants se sont installés.

  - slug: al-sira-al-nabawiyya
    kind: story
    title: { ar: "السيرة النبوية", en: "The Prophetic biography", ur: "سیرتِ نبوی", fr: "La vie du Prophète" }
    desc:
      ar: "حياة النبي محمد في أربع وعشرين محطة — من مكة إلى المدينة."
      en: "The life of Prophet Muhammad in twenty-four stations — from Makkah to Madinah."
      ur: "نبی محمد کی زندگی چوبیس پڑاؤ میں — مکہ سے مدینہ تک۔"
      fr: La vie du prophète Muhammad en vingt-quatre étapes, de La Mecque à Médine.

  - slug: ashab-al-kahf
    kind: story
    title: { ar: "أصحاب الكهف", en: "The People of the Cave", ur: "اصحابِ کہف", fr: "Les gens de la Caverne" }
    desc:
      ar: "فتية شجعان آمنوا بربهم وهربوا بدينهم إلى كهف — ماذا حدث لهم هناك؟"
      en: "Brave youths believed in their Lord and fled with their faith to a cave — what happened to them there?"
      ur: "چند بہادر نوجوانوں نے اپنے رب پر ایمان رکھا اور اپنے ایمان کے ساتھ ایک غار میں پناہ لی — وہاں ان کے ساتھ کیا ہوا؟"
      fr: De courageux jeunes gens croyaient en leur Seigneur et se sont réfugiés dans une grotte pour préserver leur foi. Que leur est-il arrivé ?

  - slug: salat-al-duha
    kind: explain
    title: { ar: "صلاة الضحى", en: "Duha prayer", ur: "نمازِ چاشت", fr: "La prière de duha" }
    desc:
      ar: "صلاة صباحية جميلة تُسمّى صلاة الأوابين — متى وقتها وكيف تُصلَّى؟"
      en: "A beautiful morning prayer called the prayer of the oft-returning — when is its time and how is it done?"
      ur: "صبح کی ایک خوبصورت نماز، جسے رجوع کرنے والوں کی نماز بھی کہا جاتا ہے — اس کا وقت کب ہے اور یہ کیسے پڑھی جاتی ہے؟"
      fr: "Une belle prière du matin, appelée la prière de ceux qui reviennent souvent vers Dieu : quand et comment se pratique-t-elle ?"

  - slug: turuq-hifz-al-quran
