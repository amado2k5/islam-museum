    tr: Kur'an'da "Ve iyi haber ver" — Biçimler ve Bağlamlar
    id: '"Dan berikan kabar baik" dalam Al-Qur''an — Bentuk dan Konteks'
  desc:
    ar: كلمة «وبشِّر» تتكرر في القرآن بصيغة واحدة ومعانٍ مبهجة — تتبّع مواضعها على الخريطة.
    en: The word 'wa-bashshir' repeats in the Quran with joyful meanings — trace its places on the map.
    ur: قرآن میں لفظ «وبشّر» خوشخبری کے معنی کے ساتھ بار بار آتا ہے — نقشے پر اس کے مقامات دیکھیں۔
    fr: 'Le mot « wa-bashshir » revient dans le Coran sous une même forme avec des sens joyeux : retrouve ses occurrences sur la carte.'
    tr: '"Ve iyi haber vermek" kelimesi Kur''an''da tek bir biçimde ve hoş anlamlarla tekrarlanır—haritadaki konumlarını takip ederek.'
    id: Kata "dan berikan kabar baik" diulang dalam Al-Qur'an dalam satu bentuk dan makna yang menyenangkan—menelusuri lokasinya di peta.
