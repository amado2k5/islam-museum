bridge:
- slug: qissat-isa
  kind: story
  title:
    ar: قصة عيسى
    en: The story of 'Isa
    ur: عیسیٰ کی کہانی
    fr: L’histoire de Jésus
    tr: İsa'nın Hikayesi
    id: Kisah Yesus
  desc:
    ar: 'قصة كاملة من البداية إلى النهاية: مولدٌ معجز، ومعجزاتٌ عظيمة، ورفعٌ إلى السماء.'
    en: 'A full story from beginning to end: a miraculous birth, great miracles, and an ascension.'
    ur: 'ابتدا سے انجام تک مکمل کہانی: ایک معجزاتی ولادت، عظیم معجزات، اور آسمان پر اٹھائے جانا۔'
    fr: 'Un récit complet, du début à la fin : une naissance miraculeuse, de grands miracles et une élévation au ciel.'
    tr: 'Baştan sona tam bir hikaye: mucizevi bir doğum, büyük mucizeler ve cennete yükseliş.'
    id: 'Sebuah kisah lengkap dari awal hingga akhir: kelahiran yang ajaib, mukjizat besar, dan kenaikan ke surga.'
- slug: nasl-nuh
  kind: story
  title:
    ar: نسل نوح
    en: The progeny of Nuh
    ur: نوح کی نسل
    fr: La descendance de Noé
    tr: Nuh'un Soyu
    id: Garis Keturunan Nuh
  desc:
    ar: بعد الطوفان، من أين جاء الناس؟ تعرّف على أبناء نوح الثلاثة وأين سكنت ذريتهم.
    en: After the Flood, where did people come from? Meet Nuh's three sons and where their descendants settled.
    ur: طوفان کے بعد لوگ کہاں سے آئے؟ نوح کے تین بیٹوں سے ملیں اور جانیں کہ ان کی نسل کہاں آباد ہوئی۔
    fr: Après le Déluge, d’où viennent les peuples ? Découvre les trois fils de Noé et les régions où leurs descendants se sont installés.
    tr: Tufandan sonra halk nereden geldi? Nuh'un üç oğlu ve onların soyundan gelenlerin nerede yaşadığını öğrenin.
    id: Setelah banjir, dari mana orang-orang itu berasal? Pelajari tentang tiga putra Nuh dan di mana keturunan mereka tinggal.
- slug: al-sira-al-nabawiyya
  kind: story
  title:
    ar: السيرة النبوية
    en: The Prophetic biography
    ur: سیرتِ نبوی
    fr: La vie du Prophète
    tr: Peygamberlik Biyografisi
    id: Biografi Profetik
  desc:
    ar: حياة النبي محمد في أربع وعشرين محطة — من مكة إلى المدينة.
    en: The life of Prophet Muhammad in twenty-four stations — from Makkah to Madinah.
    ur: نبی محمد کی زندگی چوبیس پڑاؤ میں — مکہ سے مدینہ تک۔
    fr: La vie du prophète Muhammad en vingt-quatre étapes, de La Mecque à Médine.
    tr: Peygamber Muhammed'in yirmi dört noktada — Mekke'den Medine'ye — hayatı.
    id: Kehidupan Nabi Muhammad dalam dua puluh empat stasiun — dari Mekah hingga Madinah.
- slug: ashab-al-kahf
  kind: story
  title:
    ar: أصحاب الكهف
    en: The People of the Cave
    ur: اصحابِ کہف
    fr: Les gens de la Caverne
    tr: Mağaranın İnsanları
    id: Orang-Orang Gua
  desc:
    ar: فتية شجعان آمنوا بربهم وهربوا بدينهم إلى كهف — ماذا حدث لهم هناك؟
    en: Brave youths believed in their Lord and fled with their faith to a cave — what happened to them there?
    ur: چند بہادر نوجوانوں نے اپنے رب پر ایمان رکھا اور اپنے ایمان کے ساتھ ایک غار میں پناہ لی — وہاں ان کے ساتھ کیا ہوا؟
    fr: De courageux jeunes gens croyaient en leur Seigneur et se sont réfugiés dans une grotte pour préserver leur foi. Que leur est-il arrivé ?
    tr: Rabbine inanan ve dinlerinden kaçıp bir mağaraya giden cesur gençler—orada onlara ne oldu?
    id: Pemuda pemberani yang percaya pada Tuhan mereka dan melarikan diri dari agama mereka ke sebuah gua—apa yang terjadi pada mereka di sana?
- slug: salat-al-duha
  kind: explain
  title:
    ar: صلاة الضحى
    en: Duha prayer
    ur: نمازِ چاشت
    fr: La prière de duha
    tr: Duha namazı
    id: Doa Dua
  desc:
    ar: صلاة صباحية جميلة تُسمّى صلاة الأوابين — متى وقتها وكيف تُصلَّى؟
    en: A beautiful morning prayer called the prayer of the oft-returning — when is its time and how is it done?
    ur: صبح کی ایک خوبصورت نماز، جسے رجوع کرنے والوں کی نماز بھی کہا جاتا ہے — اس کا وقت کب ہے اور یہ کیسے پڑھی جاتی ہے؟
    fr: 'Une belle prière du matin, appelée la prière de ceux qui reviennent souvent vers Dieu : quand et comment se pratique-t-elle ?'
    tr: Dönenlerin Duası adı verilen güzel bir sabah duası — zamanı ne zaman ve nasıl yapılır?
    id: Doa pagi yang indah berjudul Doa Para Pengenang — kapan waktunya dan bagaimana cara melakukannya?
- slug: turuq-hifz-al-quran
  kind: explain
  title:
    ar: التاعات التسع لحفظ القرآن
    en: Nine techniques for memorizing the Quran
    ur: قرآن حفظ کرنے کے نو طریقے
    fr: Neuf méthodes pour mémoriser le Coran
    tr: Kur'an'ı ezberlemek için dokuz şey
    id: Sembilan hal untuk menghafal Al-Qur'an
  desc:
    ar: تسع طرق ذكية تساعدك على حفظ القرآن — اختر الطريقة التي تناسبك وابدأ اليوم.
    en: Nine clever techniques to help you memorize the Quran — pick the one that suits you and start today.
    ur: قرآن حفظ کرنے میں مدد دینے والے نو ہوشیار طریقے — جو آپ کے مزاج کے مطابق ہو اسے چنیں اور آج سے شروع کریں۔
    fr: 'Neuf méthodes astucieuses pour t’aider à mémoriser le Coran : choisis celle qui te convient et commence aujourd’hui.'
    tr: Kur'an'ı ezberlemenize yardımcı olacak dokuz akıllı yol — size uygun yöntemi seçin ve bugün başlayın.
    id: Sembilan cara cerdas untuk membantu Anda menghafal Al-Qur'an — pilih metode yang sesuai dengan Anda dan mulai hari ini.
- slug: ghiras-al-janna
  kind: explain
  title:
    ar: غِراس الجنة
    en: Seedlings of Paradise
    ur: جنت کے پودے
    fr: Les plantations du Paradis
    tr: Paradise Plantasyonu
    id: Perkebunan Surga
  desc:
    ar: هل تعلم أنك تستطيع أن تزرع في الجنة وأنت على الأرض؟ اكتشف كيف!
    en: Did you know you can plant things in Paradise while you are still on earth? Find out how!
    ur: کیا آپ جانتے ہیں کہ زمین پر رہتے ہوئے جنت میں پودے لگائے جا سکتے ہیں؟ جانیں کیسے!
    fr: Savais-tu que l’on peut planter au Paradis tout en étant encore sur terre ? Découvre comment !
    tr: Dünyada iken cennette ekim yapabileceğini biliyor muydun? Nasıl yapacağını öğren!
    id: Tahukah kamu bahwa kamu bisa menanam di surga saat masih di bumi? Cari tahu caranya!
- slug: wa-bashshir
