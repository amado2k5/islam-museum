name: Deploy all parts to UAT (experimental)

# UAT (https://uat.islam.museum): every part of one "Build islam.museum by language" run, in one start. It runs the shared deploy
# (deploy-shared-env.yml) first, then the seven language deploys (deploy-lang-env.yml) one after another: ar, en, ur,
# fr, es, tr, id. Together they publish what the one deploy publishes. Manual only, like every deploy.
# A trial beside the one deploy, which is unchanged. A language that fails, or that the build does not have, is
# reported and the others still run; if the shared parts fail, no language is deployed.
# EXPERIMENTAL twin: accepts only runs of "Build islam.museum by language (experimental)" (build-exp.yml)
# — the reusable env workflows get experimental: true, so the normal name check still refuses it for the
# production deploys. Same chain, same gates, same IndexNow tail; only the accepted build differs.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run id of a \"Build islam.museum by language (experimental)\" run (build-exp.yml). Give it, so every part comes from the same run."
        required: true
        type: string
      source_branch:
        description: "Branch the build must come from: main (default) or a release branch such as release/spanish."
        required: false
        type: string
        default: main

permissions:
  contents: read
  deployments: write
  # Read another run's artifact and jobs.
  actions: read

# The group of this environment's full deploy: one publish at a time writes the publish record, in order.
concurrency:
  group: deploy-uat
  cancel-in-progress: false
  queue: max

jobs:
  shared:
    uses: ./.github/workflows/deploy-shared-env.yml
    with:
      environment: uat
      experimental: true
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  ar:
    needs: [shared]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: ar
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  en:
    needs: [shared, ar]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: en
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  ur:
    needs: [shared, en]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: ur
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  fr:
    needs: [shared, ur]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: fr
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  es:
    needs: [shared, fr]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: es
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  tr:
    needs: [shared, es]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: tr
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
  id:
    needs: [shared, tr]
    # After the one before it, whatever its result: a language that failed, or that this branch does not have, does
    # not stop the next. Nothing runs when the shared parts failed.
    if: ${{ !cancelled() && needs.shared.result == 'success' }}
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      experimental: true
      language: id
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
