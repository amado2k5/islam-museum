name: Deploy shared parts to UAT

# UAT (https://uat.islam.museum), the shared parts: everything that belongs to no language (API, shared data, root
# files, site Worker, Pages project) from a "Build islam.museum by language" run. Manual only, like every deploy.
# A trial beside "Deploy islam.museum to UAT", which is unchanged; the steps are in deploy-shared-env.yml. It needs a
# full UAT deploy to have run once.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run id of a \"Build islam.museum by language\" run. Empty: the newest one that built the shared parts."
        required: false
        type: string
      source_branch:
        description: "Branch the build must come from: main (default) or a release branch such as release/spanish."
        required: false
        type: string
        default: main

permissions:
  contents: read
  deployments: write
  # Read another run's artifact and jobs.
  actions: read

# The group of this environment's full deploy: one publish at a time writes the publish record, in order.
concurrency:
  group: deploy-uat
  cancel-in-progress: false
  queue: max

jobs:
  uat:
    uses: ./.github/workflows/deploy-shared-env.yml
    with:
      environment: uat
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit
