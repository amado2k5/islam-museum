# Read-only check that the R2 secrets work. Lists one object from the production
# search bucket. Never prints secret values. Manual only.
name: R2 secrets check (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Report which secrets are set (not their values)
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ENDPOINT; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: EMPTY"; fi
          done
      - name: List one object from islam-museum-search (read only)
        run: aws s3api list-objects-v2 --bucket islam-museum-search --max-keys 1 --endpoint-url "$ENDPOINT" --query 'KeyCount' --output text
