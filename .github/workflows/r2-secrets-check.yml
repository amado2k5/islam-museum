# Read-only check that the R2 secrets work. Lists one object from the production
# search bucket. Never prints secret values. Manual only.
name: R2 secrets check (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Only the repository owner or an admin may start this workflow
        # Founder's rule of 22 October 2026. Starting a workflow needs write access, which
        # only the owner has today; this step keeps the rule if collaborators are ever added.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ "$ACTOR" = "$OWNER" ] && { echo "started by the owner ($ACTOR)"; exit 0; }
          perm=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo unknown)
          [ "$perm" = "admin" ] && { echo "started by an admin ($ACTOR)"; exit 0; }
          echo "::error::$ACTOR ($perm) may not start this workflow: only the repository owner or an admin may."
          exit 1
      - name: Report which secrets are set (not their values)
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ENDPOINT; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: EMPTY"; fi
          done
      - name: List one object from islam-museum-search (read only)
        run: aws s3api list-objects-v2 --bucket islam-museum-search --max-keys 1 --endpoint-url "$ENDPOINT" --query 'KeyCount' --output text
