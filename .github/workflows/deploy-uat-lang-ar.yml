name: Deploy ar pages to UAT

# UAT (https://uat.islam.museum), one language: the Arabic pages (R2 prefix ar/) and the Arabic search index
# (pagefind-ar/) of a "Build islam.museum by language" run, and nothing else. Manual only, like every deploy.
# A trial beside "Deploy islam.museum to UAT", which is unchanged; the steps and what is left untouched are in
# deploy-lang-env.yml. It needs a full UAT deploy to have run once: a language publish changes part of the publish
# record and never starts one.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run id of a \"Build islam.museum by language\" run. Empty: the newest one of the source branch that built ar."
        required: false
        type: string
      source_branch:
        description: "Branch the build must come from: main (default) or a release branch such as release/spanish."
        required: false
        type: string
        default: main

permissions:
  contents: read
  deployments: write
  # Read another run's artifact and jobs.
  actions: read

# The group of the full UAT deploy (deploy-uat.yml): one publish at a time writes the publish record, in order.
concurrency:
  group: deploy-uat
  cancel-in-progress: false
  queue: max

jobs:
  uat:
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: uat
      language: ar
      build_run_id: ${{ inputs.build_run_id }}
      source_branch: ${{ inputs.source_branch }}
    # The `uat` Environment's own R2 keys and sync token override the repository ones of the same name.
    secrets: inherit
