name: Validate

on:
  pull_request:

permissions:
  contents: read

# One run per pull request: a new push to the branch stops the run of the older push, which nobody will read
# (docs/engineering/46-ci-flow-proposal.md; on 13 November 2026 27 of 28 busy runners were Validate runs).
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Two jobs run side by side: the fast one (content validation, then the unit tests) and the sample build with its
# checks. Neither waits for the other, so the run takes as long as the slower job, not both added up.
#
# A pull request builds a SAMPLE of the site, not all 202,000 pages (docs/engineering/46-ci-flow-proposal.md): every
# page template in full except the entity page and the hadith chapter page, and of those two the records a check opens
# by name, the records this pull request changed, and an even spread of each class (site/src/lib/sample.ts). A fault
# on a record page outside the sample is found by the full build of main (build.yml), and a broken link there by
# site-checks.yml. A pull request labelled `full-build` before its push builds the whole site instead (about an hour).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci && npm ci --prefix site
      # First, so a content error answers in about two minutes instead of after the build.
      - name: Validate the content
        run: npm run validate
      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      # Read by site/src/lib/sample.ts inside `npm run build`. "0" is a full build.
      SAMPLE_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The checkout is the merge commit; its first parent is the base, so HEAD^1..HEAD is what merging would change.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci && npm ci --prefix site
      - name: Records this pull request changed (built in the three languages)
        if: env.SAMPLE_BUILD == '1'
        run: npm run sample:routes -- --base HEAD^1 --head HEAD
      # `npm run build` runs `validate` first (prebuild), so content errors still stop the job before Astro starts.
      - name: Validate, compile and build (a sample of the pages unless labelled full-build)
        run: npm run build
      - name: No runtime AI or compute (guard)
        run: npm run check:static
      # After the checks that read real pages, before the link check: a link to a record page the sample left out is
      # not a broken link, a link to a record that does not exist still is.
      - name: Placeholder pages for the routes the sample left out
        if: env.SAMPLE_BUILD == '1'
        run: npm run sample:stubs
      - name: Link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true
      - name: axe accessibility audit (route matrix, all languages)
        run: |
          npx playwright install --with-deps chromium
          npm run axe
      - name: Lighthouse budget (performance >= 90, accessibility = 100)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # Says whether merging this pull request rewrites most of the site's pages on the next deploy (a layout, the header or
  # footer, a library the layouts call, a shell string in i18n/). Such a change costs one deploy about 164,000 R2 writes and
  # half an hour, so the founder wants to batch it with other shell changes. The shell scripts (site/public/shell/) are single
  # files and do not count. It labels and comments in the summary; it never fails the pull request.
  # tools/deploy/shell-impact.mjs, tools/deploy/shell-paths.list, docs/engineering/16-deploy-churn-proposal.md.
  shell-impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Add or remove the label. A pull request from a fork gets a read-only token: the label is skipped, the summary stays.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The checkout is the merge commit; its first parent is the base, so HEAD^1..HEAD is what merging would change.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Does this change rewrite most pages?
        id: impact
        run: node tools/deploy/shell-impact.mjs --base HEAD^1 --head HEAD
      - name: Label the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REWRITES: ${{ steps.impact.outputs.rewrites }}
        run: |
          label=rewrites-all-pages
          gh label create "$label" --color B45309 --description "Merging this rewrites most pages on the next deploy (about 164,000 R2 writes)" 2>/dev/null || true
          if [ "$REWRITES" = "true" ]; then
            echo "::warning title=Rewrites most pages::This pull request changes a shell file or a shell string, so the next deploy re-uploads most pages. See the job summary."
            gh pr edit "$PR" --add-label "$label" || echo "::notice::Could not add the label (a pull request from a fork has a read-only token)."
          else
            gh pr edit "$PR" --remove-label "$label" 2>/dev/null || true
          fi
