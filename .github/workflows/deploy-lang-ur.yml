name: Deploy ur pages to production

# PRODUCTION, one language: the Urdu pages (R2 prefix ur/) and the Urdu search index (pagefind-ur/) of a
# "Build islam.museum by language" run, and nothing else. Manual only, and the founder's alone (AGENTS.md).
# A trial beside "Deploy islam.museum to Cloudflare", which is unchanged; the steps and what is left untouched are in
# deploy-lang-env.yml. Production takes builds of main only. Review the same build on UAT first with
# "Deploy ur pages to UAT".
on:
  workflow_dispatch:
    inputs:
      urgent:
        description: "Founder only: deploy although another production deploy started less than an hour ago (a broken production). Default: refused within the hour."
        required: false
        type: boolean
        default: false
      build_run_id:
        description: "Run id of a \"Build islam.museum by language\" run of main. Empty: the newest one that built ur."
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  # Read another run's artifact and jobs.
  actions: read

# The group of the full production deploy (deploy.yml): one publish at a time writes the publish record, in order.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  # At most one production deploy an hour (R2 cost rule, 28 November 2026): deploy-spacing.yml refuses this run when
  # another production deploy started less than an hour ago, and every other job waits for it.
  spacing:
    name: Hourly spacing
    uses: ./.github/workflows/deploy-spacing.yml
    with:
      urgent: ${{ inputs.urgent == true }}

  production:
    needs: [spacing]
    uses: ./.github/workflows/deploy-lang-env.yml
    with:
      environment: production
      language: ur
      build_run_id: ${{ inputs.build_run_id }}
    secrets: inherit
