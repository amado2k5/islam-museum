# Manual test of the R2 sync changes: smaller archives, parallel COPY writes,
# the status file and GET /status. Runs only on workflow_dispatch, against the
# TEST Worker and the test bucket islam-museum-sync-test. Never the production bucket.
name: R2 sync parallel test (manual)

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: "Deploy workers/r2-sync (test config) and set its token before testing"
        type: boolean
        default: true
      files:
        description: "Files to test: 'all' for every file in test/sizes.txt (real sizes), or a count"
        required: true
        default: "all"
      parallel:
        description: "Archives posted to the Worker at the same time"
        required: true
        default: "10"

permissions:
  contents: read

concurrency:
  group: r2-sync-test
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: inputs.deploy_worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix workers/r2-sync
      - name: Create test bucket (ignore if it exists)
        working-directory: workers/r2-sync
        run: npx wrangler r2 bucket create islam-museum-sync-test || true
      - name: Deploy Worker
        working-directory: workers/r2-sync
        run: npx wrangler deploy
      - name: Set Worker token
        working-directory: workers/r2-sync
        env:
          SYNC_TOKEN: ${{ secrets.R2_SYNC_TEST_TOKEN }}
        run: printf '%s' "$SYNC_TOKEN" | npx wrangler secret put SYNC_TOKEN

  test:
    needs: [deploy-worker]
    if: ${{ always() && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYNC_URL: ${{ secrets.R2_SYNC_TEST_URL }}
      SYNC_TOKEN: ${{ secrets.R2_SYNC_TEST_TOKEN }}
      ENDPOINT: "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      BUCKET: islam-museum-sync-test
      FILES: ${{ inputs.files }}
      PARALLEL: ${{ inputs.parallel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix workers/r2-sync
      - name: Archive logic test (in-memory bucket, parallel COPY, status file)
        run: node workers/r2-sync/test/archive-test.mjs
      - name: Parallel upload test (smaller archives, PARALLEL at a time, test bucket)
        working-directory: workers/r2-sync
        run: node test/parallel-test.mjs
