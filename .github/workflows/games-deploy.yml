name: Deploy the games to production

# Production for the games: https://games.islam.museum. Manual only, and the founder's alone: no agent or session
# starts it. It publishes a release already built and tested by "Build the games", normally the one just reviewed on
# UAT (give its build_run_id), into the `production` GitHub Environment: bucket islam-museum-search (under games/),
# Worker islam-museum-games. It touches no page, asset, Worker or workflow of the website.
#
# The first run creates the Worker and, because its Custom Domain is declared in workers/games/wrangler.production.toml,
# the DNS record and certificate for games.islam.museum. Start with action "check": it writes nothing.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check: verify the release and say what would happen, writing nothing. release: publish it and make it live. rollback: make the release before the live one live again."
        required: true
        type: choice
        options: [check, release, rollback]
        default: check
      build_run_id:
        description: "Run id of \"Build the games\" to deploy. Empty: the latest successful build of main. Ignored by rollback."
        required: false
        type: string
      urgent:
        description: "Founder only: release although another games production release started less than an hour ago (a broken games host). Default: refused within the hour."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  # Read another run's artifact.
  actions: read

concurrency:
  group: games-deploy-production
  cancel-in-progress: false

jobs:
  # At most one production release an hour (R2 cost rule, 28 November 2026). A "check" writes nothing and is not
  # spaced; a release or rollback is refused when another one started less than an hour ago. A run counts unless it
  # was a check or was itself refused here; queued runs meet this when they start.
  spacing:
    name: Hourly spacing
    if: inputs.action != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a production release within an hour of the last one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          URGENT: ${{ inputs.urgent == true }}
          MINUTES: "60"
        run: |
          set -euo pipefail
          since=$(( $(date -u +%s) - MINUTES * 60 ))
          blocker=""
          while read -r id started status url; do
            [ -n "$id" ] || continue
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | {name, conclusion}]')
            # A check writes nothing; a run refused here wrote nothing.
            [ "$(jq '[.[] | select(.name | contains("check ("))] | length' <<<"$jobs")" = "0" ] || continue
            [ "$(jq '[.[] | select((.name | startswith("Hourly spacing")) and .conclusion == "failure")] | length' <<<"$jobs")" = "0" ] || continue
            blocker="run $id started $started ($url)"
            break
          done < <(gh api "repos/$REPO/actions/workflows/games-deploy.yml/runs?per_page=30" --jq \
            ".workflow_runs[] | select(.id != $RUN and .run_started_at != null and .status != \"queued\" and .status != \"pending\" and .status != \"waiting\")
             | select((.run_started_at | fromdateiso8601) >= $since)
             | \"\(.id) \(.run_started_at) \(.status) \(.html_url)\"")
          if [ -z "$blocker" ]; then
            echo "No games production release in the last $MINUTES minutes: this one may go ahead."
            exit 0
          fi
          if [ "$URGENT" = "true" ]; then
            echo "::warning::urgent: releasing although $blocker"
            echo "Hourly spacing: **urgent override** used; $blocker." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The games are released to production at most once an hour (R2 cost rule, 28 November 2026): $blocker. Start again after the hour, or set urgent only for a broken games host."
          echo "Hourly spacing: **refused**; $blocker. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  production:
    needs: [spacing]
    # A check skips the spacing job and still runs; a refused release does not.
    if: ${{ !cancelled() && (needs.spacing.result == 'success' || needs.spacing.result == 'skipped') }}
    uses: ./.github/workflows/games-deploy-env.yml
    with:
      environment: production
      action: ${{ inputs.action }}
      build_run_id: ${{ inputs.build_run_id }}
    secrets: inherit
