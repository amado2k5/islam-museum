name: Deploy islam.museum to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false
  # Keep every waiting run, so each push's R2 publish runs in order. Without this,
  # a newer waiting run replaces an older one and the older content change is never
  # published. Every push publishes; the manifest diff decides what to upload.
  queue: max

# The unit tests and the build run in parallel; deploy waits for both.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix site
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: feed.xml lists recent data commits at build time.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix site
      - name: Validate, compile and build (validate → graph → derive → api → astro → pagefind)
        run: npm run build
        env:
          # Pagefind indexes are uploaded to R2 and served from there.
          # Set PAGEFIND_BASE_URL as a GitHub Actions variable to the R2 public URL.
          PUBLIC_PAGEFIND_BASE: ${{ vars.PAGEFIND_BASE_URL }}
      - name: No runtime AI or compute (guard)
        run: npm run check:static
      - name: Install R2 sync Worker dependencies
        if: github.ref == 'refs/heads/main'
        run: npm ci --prefix workers/r2-sync
      - name: Deploy R2 sync Workers (production bucket, seven copies)
        id: r2_worker
        if: github.ref == 'refs/heads/main'
        working-directory: workers/r2-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_TOKEN: ${{ secrets.R2_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # Seven identical Workers on the production bucket. Publish spreads archives across them.
          urls=""
          for name in islam-museum-r2-sync islam-museum-r2-sync-2 islam-museum-r2-sync-3 islam-museum-r2-sync-4 islam-museum-r2-sync-5 islam-museum-r2-sync-6 islam-museum-r2-sync-7; do
            npx wrangler deploy -c wrangler.production.toml --name "$name" | tee deploy.log
            url=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
            test -n "$url"
            printf '%s' "$SYNC_TOKEN" | npx wrangler secret put SYNC_TOKEN -c wrangler.production.toml --name "$name"
            urls="${urls:+$urls,}$url"
          done
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
      - name: Publish pagefind indexes and API to R2 (zip archives via R2 sync Worker)
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: islam-museum-search
          SYNC_URLS: ${{ steps.r2_worker.outputs.urls }}
          SYNC_TOKEN: ${{ secrets.R2_SYNC_TOKEN }}
        run: node workers/r2-sync/batch/publish.mjs --dist dist
      - name: Strip R2-served dirs from Pages deployment
        run: rm -rf dist/pagefind-ar dist/pagefind-en dist/pagefind-ur dist/api
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=islam-museum

  # Pings IndexNow with the URLs changed in this push (scripts/indexnow.mjs), so
  # Bing/Yandex pick up new and updated pages without waiting for a crawl.
  # Set the repository variable INDEXNOW to "off" to skip it.
  notify-indexnow:
    if: vars.INDEXNOW != 'off'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The previous commit is the cut-off for "changed".
          fetch-depth: 2
      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs
