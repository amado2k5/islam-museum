name: Deploy islam.museum to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

# The unit tests and the build run in parallel; deploy waits for both.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix site
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: feed.xml lists recent data commits at build time.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix site
      - name: Validate, compile and build (validate → graph → derive → api → astro → pagefind)
        run: npm run build
      - name: No runtime AI or compute (guard)
        run: npm run check:static
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=islam-museum

  # Pings IndexNow with the URLs changed in this push (scripts/indexnow.mjs), so
  # Bing/Yandex pick up new and updated pages without waiting for a crawl.
  # Set the repository variable INDEXNOW to "off" to skip it.
  notify-indexnow:
    if: vars.INDEXNOW != 'off'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The previous commit is the cut-off for "changed".
          fetch-depth: 2
      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs
