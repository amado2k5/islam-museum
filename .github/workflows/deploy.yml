name: Deploy islam.museum to Cloudflare

# PRODUCTION. Manual only: runs when started from the Actions tab (or gh workflow run), by the
# founder alone (AGENTS.md). Pushes to main do not deploy.
#
# The steps live in deploy-env.yml, shared with deploy-uat.yml: the same build artifact, the
# same procedure, a different GitHub Environment. This file only picks the `production`
# Environment (bucket islam-museum-search, Worker islam-museum-site, Pages project islam-museum,
# https://islam.museum). Review a build on https://uat.islam.museum first with
# "Deploy islam.museum to UAT", then start this workflow with the same build_run_id.
#
# A deploy does not build: it downloads the `dist` artifact of a build run (build.yml,
# "Build islam.museum") and publishes it. Empty build_run_id means the latest successful
# build of main; a run id redeploys that build (nothing is sent to R2 twice: the manifest
# diff finds no change but the deploy stamp, api/v1/meta/deploy.json).
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run id to deploy (Build islam.museum). Empty: the latest successful build of main. The five newest successful builds keep their artifacts, so an older run id works only while its artifact still exists."
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  # Read another run's artifact.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false
  # Keep every waiting run, so each deploy's R2 publish runs in order. Without this,
  # a newer waiting run replaces an older one and the older content change is never
  # published. Every deploy publishes; the manifest diff decides what to upload.
  queue: max

jobs:
  production:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      build_run_id: ${{ inputs.build_run_id }}
    # Repository secrets (CLOUDFLARE_*, R2_*) reach the shared workflow as they are; the
    # `production` Environment adds nothing on top of them.
    secrets: inherit
