class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 9: الهجرة إلى الحبشة"
  en: "The Prophetic Biography for Reformers, episode 9: The migration to Abyssinia"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 9: حبشہ کی طرف ہجرت"
  fr: "La biographie prophétique pour les réformateurs, épisode 9 : L'émigration vers l'Abyssinie"
  es: "La biografía profética para los reformadores, episodio 9: La emigración a Abisinia"
summary:
  ar: "يختم المجلس التاسع من سلسلة السيرة النبوية للمصلحين النصف الأول من المرحلة المكية. يعالج المحاضر سورة الفرقان نموذجا لكيفية تثبيت القرآن للمؤمنين وردّه على اعتراضات المشركين، ثم الطريقة الواضحة التي بلّغ بها النبي الرسالة، ثم الهجرة إلى الحبشة: أعدادها ومشاعر المهاجرين واحتكاكهم بالنصرانية وخبر أسماء بنت عميس. ويختم بإسلام عمر وما بقي من حاجته إلى الجوار."
  en: "The ninth session of the series on the Prophetic biography for reformers closes the first half of the Meccan period. The speaker treats Surat al-Furqan as a case of how the Qur'an steadied the believers and answered the polytheists' objections, the plain way the Prophet conveyed the message, and the migration to Abyssinia: its numbers, the feelings of the emigrants, their contact with Christianity and the Asma bint Umays report. He ends with the conversion of Umar and the protection he still needed."
  ur: "سیرت نبوی برائے مصلحین سلسلے کی نویں نشست مکی دور کے پہلے نصف حصے کو سمیٹتی ہے۔ مقرر سورۃ الفرقان کو اس مثال کے طور پر لیتے ہیں کہ قرآن نے اہلِ ایمان کو کیسے ثابت قدم رکھا اور مشرکین کے اعتراضات کا کیسے جواب دیا۔ پھر وہ واضح انداز بیان کرتے ہیں جس میں نبی نے پیغام پہنچایا، اور حبشہ کی ہجرت کا ذکر کرتے ہیں: اس کی تعداد، مہاجرین کے احساسات، ان کا عیسائیت سے میل جول اور اسماء بنت عمیس کی روایت۔ آخر میں عمر کے اسلام اور اس کے باوجود ان کی پناہ کی ضرورت کا ذکر ہے۔"
  fr: "La neuvième séance de la série sur la biographie prophétique pour les réformateurs clôt la première moitié de la période mecquoise. Le conférencier traite la sourate al-Furqan comme un exemple de la manière dont le Coran affermissait les croyants et répondait aux objections des polythéistes, puis la façon claire dont le Prophète transmettait le message, et enfin l'émigration vers l'Abyssinie : ses effectifs, les sentiments des émigrés, leur contact avec le christianisme et le récit d'Asma bint Umays. Il termine par la conversion d'Umar et la protection dont celui-ci avait encore besoin."
  es: "La novena sesión de la serie sobre la biografía profética para reformadores cierra la primera mitad del periodo mecano. El conferenciante trata la sura al-Furqan como ejemplo de cómo el Corán afianzaba a los creyentes y respondía a las objeciones de los politeístas, después la manera clara en que el Profeta transmitía el mensaje, y por último la emigración a Abisinia: sus cifras, los sentimientos de los emigrados, su contacto con el cristianismo y el relato de Asma bint Umays. Termina con la conversión de Umar y la protección que aún necesitaba."
