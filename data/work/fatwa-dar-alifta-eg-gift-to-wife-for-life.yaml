label: { ar: "حكم الهبة للزوجة مدة حياتها ثم العودة إلى الواهب بعد ذلك", en: "Gifting the wife a flat for life then reverting to the giver's heirs", ur: "بیوی کو عمر بھر کے لیے تحفہ پھر واپس ورثاء کو" }
summary:
  ar: "زوج أعطى زوجته شقة مدة حياتها واشترط أن تؤول إلى ورثته بعد وفاتها فسأل عن حكم هذه الهبة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21696)⁩ أن ذلك هبة لمنفعة الشقة دون عينها وبيّن الجواب حكمها على وجهه."
  en: "A husband gave his wife a flat for the duration of her life, stipulating it passes to his heirs after her death, and asked the ruling on this gift. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21696) answered that it is a gift of the flat's benefit without its substance, and the answer sets out its ruling."
  ur: "شوہر نے بیوی کو عمر بھر کے لیے فلیٹ دیا اس شرط پر کہ اس کی وفات کے بعد اس کے ورثاء کو جائے؛ اس نے اس تحفے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21696)⁩ نے جواب دیا کہ یہ فلیٹ کے منفعے کا تحفہ ہے نہ کہ اس کی عین کا؛ اس کا حکم جواب میں بیان ہوا۔"
