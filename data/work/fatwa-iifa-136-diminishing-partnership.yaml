label: { ar: "قرار مجمع الفقه الإسلامي الدولي 136 (15/2) بشأن المشاركة المتناقصة وضوابطها الشرعية", en: "IIFA resolution 136 (15/2) on diminishing partnership ⁦(musharaka mutanaqisa)⁩ and its legal controls", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 136 (15/2): گھٹتی ہوئی شراکت ⁦(مشارکہ متناقصہ)⁩ اور اس کے شرعی ضوابط", es: "Resolución 136 (15/2) de la IIFA sobre la disminución de la participación (musharaka mutanaqisa) y sus controles legales.", fr: "Résolution 136 (15/2) de l'IIFA sur la diminution du partenariat (musharaka mutanaqisa) et ses contrôles juridiques", tr: "Azalan katılım ve Şeriat kontrolleriyle ilgili Uluslararası İslami Fiqh Akademisi Kararı 136 (15/2)", id: "Keputusan Akademi Fiqh Islam Internasional 136 (15/2) mengenai penurunan partisipasi dan kontrol Syariahnya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. عرّف المشاركة المتناقصة بأنها معاملة جديدة تتضمن شركة بين طرفين في مشروع ذي دخل يتعهد فيها أحدهما بشراء حصة الآخر تدريجًا سواء من حصته في الدخل أم من موارد أخرى، وأساسها عقد يبرمه الطرفان ويسهم كل بحصة في رأس المال نقودًا أو أعيانًا مقوّمة مع بيان توزيع الربح وتحمل الخسارة بقدر الحصة. وتختص بوعد ملزم من أحد الطرفين فقط بتملك حصة الآخر مع خيار له، بإبرام عقود بيع عند تملك كل جزء ولو بإشعارات متبادلة. ثم ضبط أحكام تكوينها وإدارتها وضوابط الالتزام والبيع التدريجي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It defined diminishing partnership as a novel transaction comprising a partnership between two parties in an income-yielding venture in which one undertakes to buy the other's share gradually, whether from his share of income or other resources. Its basis: a contract concluded by both, each contributing a capital share in cash or valued tangibles, profit distribution stated, loss borne in proportion to the share. Its distinguishing feature: a binding promise by one party only to acquire the other's share, the other retaining an option, sale contracts being concluded for each portion, even by exchanged notices. It then set out controls for its formation, management and the graduated purchase."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے گھٹتی ہوئی شراکت کی تعریف کی: نیا لین دین جس میں دو فریقوں کی آمدنی والے منصوبے میں شراکت ہو اور ایک فریق دوسرے کا حصہ بتدریج خریدنے کا عہد کرے — اپنی آمدنی کے حصے یا دیگر وسائل سے۔ بنیاد: عقد جس میں دونوں رأس المال میں نقد یا مقوم اعیان سے حصہ ڈالیں، منفع کی تقسیم بیان ہو اور نقصان حصے کے تناسب سے برداشت ہو۔ امتیازی خصوصیت: صرف ایک فریق کا لازم وعدہ دوسرے کے حصے کی خرید کا، دوسرے کے لیے اختیار قائم، اور ہر جز کی خرید پر الگ بیع عقد — باہمی اطلاعات سے بھی۔ پھر تشکیل، انتظام اور تدریجی خرید کے ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004). Definió la sociedad decreciente como una transacción novedosa que comprende una asociación entre dos partes en una empresa generadora de ingresos, en la que una se compromete a comprar gradualmente la participación de la otra, ya sea con su parte de los ingresos u otros recursos. Su base: un contrato celebrado por ambas partes, cada una aportando una participación de capital en efectivo o bienes tangibles valorados, con distribución de beneficios establecida y pérdidas asumidas en proporción a la participación. Su rasgo distintivo: una promesa vinculante por parte de una sola parte de adquirir únicamente la participación de la otra, conservando esta última una opción, y la celebración de contratos de compraventa para cada porción, incluso mediante el intercambio de notificaciones. A continuación, estableció los controles para su formación, gestión y la compra gradual."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 15e session à Mascate (14-19 Muharram 1425, 6-11 mars 2004). Cette résolution définit la société en participation décroissante comme une opération novatrice consistant en un partenariat entre deux parties dans une entreprise génératrice de revenus, où l'une s'engage à racheter progressivement la part de l'autre, que ce soit par prélèvement sur sa part de revenus ou par d'autres ressources. Elle repose sur un contrat conclu par les deux parties, chacune apportant un capital en numéraire ou en biens corporels de valeur, la répartition des bénéfices étant précisée et les pertes supportées proportionnellement à la part de chacun. Sa caractéristique distinctive est l'engagement ferme d'une seule partie à acquérir la part de l'autre, cette dernière conservant une option. Des contrats de vente sont conclus pour chaque part, même par simple échange de notifications. La résolution établit ensuite les modalités de sa constitution, de sa gestion et du rachat progressif."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin Muskat'taki on beşinci oturumunda yaptığı toplu karar (14–19 Muharrem 1425H, 6–11 Mart 2004). Azalan katılım, gelir getiren bir projede iki taraf arasında ortaklığı içeren yeni bir işlem olarak tanımlanır; burada taraf, diğerinin payını kendi gelir payından veya diğer kaynaklardan kademeli olarak satın almayı taahhüt eder. Her iki tarafın nakit veya değerli kalemler olarak sermaye payını katkıda bulunduğu, kâr dağılımını belirten ve zararın paya orantılı olarak üstlenilmesi için bağlayıcı bir sözleşmeye dayanır. Bir tarafın sadece diğerinin hissesini opsiyonlu olarak edinme taahhüdü ile ilgili bağlayıcı bir taahhütle ilgilidir; her iki tarafın mülkiyeti üzerine satış sözleşmeleri yapılması ve karşılıklı bildirimlerle birlikte. Ardından kuruluş, yönetim hükümleri ve uyum ile kademeli satış düzenlemeleri yer alır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kelima belas di Muscat (14–19 Muharram 1425H, 6–11 Maret 2004). Partisipasi yang berkurang didefinisikan sebagai transaksi baru yang melibatkan kemitraan antara dua pihak dalam proyek penghasil pendapatan, di mana salah satu berkomitmen untuk secara bertahap membeli saham pihak lain, baik dari bagian pendapatan maupun sumber daya lainnya. Kontrak ini didasarkan pada kontrak yang dibuat oleh kedua pihak, masing-masing menyumbangkan bagian modal dalam bentuk tunai atau barang bernilai, dengan pembagian keuntungan dan menanggung kerugian yang proporsional dengan saham. Perjanjian ini berkaitan dengan janji mengikat dari satu pihak hanya untuk memperoleh saham pihak lain dengan opsi, dengan membuat kontrak penjualan setelah kepemilikan setiap bagian, bahkan dengan pemberitahuan bersama. Kemudian ketentuan untuk pembentukan, pengelolaan, dan peraturan untuk kepatuhan dan penjualan bertahap."
