id: work/fatwa-aliftaa-jo-expiation-for-accidental-killing-when-unable-to-fast
class: work
kind: fatwa
label: { ar: "كفارة القتل الخطأ للعاجز عن الصيام", en: "Expiation for accidental killing by someone unable to fast", ur: "روزے سے عاجز شخص کے لیے قتل خطا کا کفارہ" }
summary:
  ar: "سؤال عمن تسبب في قتل نفس بغير قصد وعجز عن الصيام بسبب العمل الشاق، عرضت فيه دائرة الإفتاء العام الأردنية المعتمد عند الشافعية أن الصوم يبقى في ذمته، والقول المقابل بالانتقال إلى إطعام ستين مسكينًا، وخلصت إلى أنه لا حرج عليه في الإطعام تقليدًا لهذا القول. أجابت الدائرة بأن المعتمد في المذهب الشافعي، وهو قول الجمهور، أن العاجز عن الصوم في كفارة القتل لا ينتقل إلى الإطعام بل يبقى الصوم في ذمته، فإن مات تخير أولياؤه بين الصوم عنه وإطعام ستين مسكينًا، وقوفًا عند ظاهر النص. ونقلت قول الخطيب الشربيني في مغني المحتاج إن الكفارات يُتبع فيها النص لا القياس، وإن الله لم يذكر في كفارة القتل غير العتق والصيام. وقالت إن المشقة أو المرض الذي يجعل الصيام بالغ المشقة يجيز تأخير الصوم حتى يقدر عليه، ونقلت قول النووي في المجموع إن الكفارة التي سببها غير عدوان، ككفارة القتل الخطأ، على التراخي بلا خلاف. وذكرت القول الآخر عند الشافعية كما نقله الشيرازي، والقول الآخر عند الحنابلة كما نقله ابن قدامة في المغني، بأن العاجز يطعم ستين مسكينًا لكل مسكين مد قياسًا على كفارة الظهار وكفارة الجماع في نهار رمضان. وقالت إن هذا القول يمكن اختياره للفتوى لأنه يحقق مقصود الكفارة في ستر الذنب وجبر التقصير، وخلصت إلى أنه لا حرج على العاجز عن الصوم أن يطعم ستين مسكينًا تقليدًا للقول المقابل للمعتمد عند الشافعية وللقول الآخر عند الحنابلة."
  en: "A question about someone who caused a death unintentionally and cannot fast because of strenuous work, in which Jordan's General Iftaa Department set out the relied-upon Shafi'i view that the fast remains owed and the opposing view that he moves on to feeding sixty poor people, and concluded that there is no objection to his feeding them by following the latter view. The Department answered that the relied-upon view in the Shafi'i school, which is the majority view, is that someone unable to fast in the expiation for killing does not move on to feeding but the fast remains owed by him; if he dies, his heirs choose between fasting for him and feeding sixty poor people, keeping to the wording of the text. It quoted al-Khatib al-Shirbini in Mughni al-Muhtaj that in expiations the text is followed, not analogy, and that God mentioned only freeing a slave and fasting in the expiation for killing. It said hardship, or an illness that makes fasting extremely hard, allows the fast to be delayed until he is able, citing al-Nawawi in al-Majmu that an expiation not caused by wrongdoing, such as that for accidental killing, may be delayed without disagreement. It set out the other view among the Shafi'is, as reported by al-Shirazi, and the other view among the Hanbalis, as reported by Ibn Qudama in al-Mughni: someone unable to fast feeds sixty poor people, a mudd each, by analogy with the expiations for zihar and for intercourse during a Ramadan day. It said this view may be adopted for fatwa because it achieves the purpose of expiation in covering the sin and making good the shortfall, and concluded that there is no objection to someone unable to fast feeding sixty poor people, following the view opposite the relied-upon Shafi'i one and the other Hanbali view."
  ur: "ایسے شخص کے بارے میں سوال جس سے غیر ارادی طور پر کسی کی موت واقع ہوئی اور وہ سخت مشقت والے کام کی وجہ سے روزہ نہیں رکھ سکتا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے شافعیہ کا معتمد قول بیان کیا کہ روزہ اس کے ذمے باقی رہتا ہے، اور مقابل قول کہ وہ ساٹھ مسکینوں کو کھانا کھلائے، اور نتیجہ نکالا کہ اس قول کی تقلید میں کھانا کھلانے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ شافعی مذہب کا معتمد قول، جو جمہور کا قول ہے، یہ ہے کہ قتل کے کفارے میں روزے سے عاجز شخص کھانا کھلانے کی طرف منتقل نہیں ہوتا بلکہ روزہ اس کے ذمے باقی رہتا ہے؛ اگر وہ مر جائے تو اس کے ورثا اس کی طرف سے روزہ رکھنے یا ساٹھ مسکینوں کو کھانا کھلانے میں اختیار رکھتے ہیں، نص کے ظاہر پر رکتے ہوئے۔ اس نے مغنی المحتاج میں خطیب شربینی کا قول نقل کیا کہ کفارات میں نص کی پیروی ہوتی ہے، قیاس کی نہیں، اور اللہ نے قتل کے کفارے میں غلام آزاد کرنے اور روزے کے سوا کچھ ذکر نہیں کیا۔ اس نے کہا کہ مشقت، یا ایسی بیماری جو روزے کو انتہائی دشوار بنا دے، قدرت حاصل ہونے تک روزے کی تاخیر کو جائز کرتی ہے، اور المجموع میں نووی کا قول نقل کیا کہ جو کفارہ زیادتی کے بغیر ہو، جیسے قتل خطا کا کفارہ، وہ بلا اختلاف تاخیر کے ساتھ ادا ہو سکتا ہے۔ اس نے شافعیہ کا دوسرا قول، جیسا کہ شیرازی نے نقل کیا، اور حنابلہ کا دوسرا قول، جیسا کہ ابن قدامہ نے المغنی میں نقل کیا، بیان کیا کہ عاجز شخص ظہار اور رمضان کے دن میں جماع کے کفارے پر قیاس کرتے ہوئے ساٹھ مسکینوں کو، ہر ایک کو ایک مد، کھانا کھلائے۔ اس نے کہا کہ فتویٰ کے لیے یہ قول اختیار کیا جا سکتا ہے کیونکہ یہ گناہ کی پردہ پوشی اور کوتاہی کی تلافی میں کفارے کا مقصد پورا کرتا ہے، اور نتیجہ نکالا کہ روزے سے عاجز شخص پر، شافعیہ کے معتمد کے مقابل قول اور حنابلہ کے دوسرے قول کی تقلید میں، ساٹھ مسکینوں کو کھانا کھلانے میں حرج نہیں۔"
