id: work/fatwa-aliftaa-jo-expiation-for-accidental-killing-when-unable-to-fast
class: work
kind: fatwa
label: { ar: "كفارة القتل الخطأ للعاجز عن الصيام", en: "Expiation for accidental killing by someone unable to fast", ur: "روزے سے عاجز شخص کے لیے قتل خطا کا کفارہ", es: "Expiación por homicidio accidental cometido por alguien incapaz de ayunar", fr: "Expiation pour homicide involontaire causé par une personne incapable de jeûner", tr: "Oruç tutamayan birini kazara öldürmekten dolayı kefaret", id: "Penebusan atas pembunuhan tidak sengaja terhadap seseorang yang tidak bisa berpuasa" }
summary:
  ar: "سؤال عمن تسبب في قتل نفس بغير قصد وعجز عن الصيام بسبب العمل الشاق، عرضت فيه دائرة الإفتاء العام الأردنية المعتمد عند الشافعية أن الصوم يبقى في ذمته، والقول المقابل بالانتقال إلى إطعام ستين مسكينًا، وخلصت إلى أنه لا حرج عليه في الإطعام تقليدًا لهذا القول. أجابت الدائرة بأن المعتمد في المذهب الشافعي، وهو قول الجمهور، أن العاجز عن الصوم في كفارة القتل لا ينتقل إلى الإطعام بل يبقى الصوم في ذمته، فإن مات تخير أولياؤه بين الصوم عنه وإطعام ستين مسكينًا، وقوفًا عند ظاهر النص. ونقلت قول الخطيب الشربيني في مغني المحتاج إن الكفارات يُتبع فيها النص لا القياس، وإن الله لم يذكر في كفارة القتل غير العتق والصيام. وقالت إن المشقة أو المرض الذي يجعل الصيام بالغ المشقة يجيز تأخير الصوم حتى يقدر عليه، ونقلت قول النووي في المجموع إن الكفارة التي سببها غير عدوان، ككفارة القتل الخطأ، على التراخي بلا خلاف. وذكرت القول الآخر عند الشافعية كما نقله الشيرازي، والقول الآخر عند الحنابلة كما نقله ابن قدامة في المغني، بأن العاجز يطعم ستين مسكينًا لكل مسكين مد قياسًا على كفارة الظهار وكفارة الجماع في نهار رمضان. وقالت إن هذا القول يمكن اختياره للفتوى لأنه يحقق مقصود الكفارة في ستر الذنب وجبر التقصير، وخلصت إلى أنه لا حرج على العاجز عن الصوم أن يطعم ستين مسكينًا تقليدًا للقول المقابل للمعتمد عند الشافعية وللقول الآخر عند الحنابلة."
  en: "A question about someone who caused a death unintentionally and cannot fast because of strenuous work, in which Jordan's General Iftaa Department set out the relied-upon Shafi'i view that the fast remains owed and the opposing view that he moves on to feeding sixty poor people, and concluded that there is no objection to his feeding them by following the latter view. The Department answered that the relied-upon view in the Shafi'i school, which is the majority view, is that someone unable to fast in the expiation for killing does not move on to feeding but the fast remains owed by him; if he dies, his heirs choose between fasting for him and feeding sixty poor people, keeping to the wording of the text. It quoted al-Khatib al-Shirbini in Mughni al-Muhtaj that in expiations the text is followed, not analogy, and that God mentioned only freeing a slave and fasting in the expiation for killing. It said hardship, or an illness that makes fasting extremely hard, allows the fast to be delayed until he is able, citing al-Nawawi in al-Majmu that an expiation not caused by wrongdoing, such as that for accidental killing, may be delayed without disagreement. It set out the other view among the Shafi'is, as reported by al-Shirazi, and the other view among the Hanbalis, as reported by Ibn Qudama in al-Mughni: someone unable to fast feeds sixty poor people, a mudd each, by analogy with the expiations for zihar and for intercourse during a Ramadan day. It said this view may be adopted for fatwa because it achieves the purpose of expiation in covering the sin and making good the shortfall, and concluded that there is no objection to someone unable to fast feeding sixty poor people, following the view opposite the relied-upon Shafi'i one and the other Hanbali view."
  ur: "ایسے شخص کے بارے میں سوال جس سے غیر ارادی طور پر کسی کی موت واقع ہوئی اور وہ سخت مشقت والے کام کی وجہ سے روزہ نہیں رکھ سکتا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے شافعیہ کا معتمد قول بیان کیا کہ روزہ اس کے ذمے باقی رہتا ہے، اور مقابل قول کہ وہ ساٹھ مسکینوں کو کھانا کھلائے، اور نتیجہ نکالا کہ اس قول کی تقلید میں کھانا کھلانے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ شافعی مذہب کا معتمد قول، جو جمہور کا قول ہے، یہ ہے کہ قتل کے کفارے میں روزے سے عاجز شخص کھانا کھلانے کی طرف منتقل نہیں ہوتا بلکہ روزہ اس کے ذمے باقی رہتا ہے؛ اگر وہ مر جائے تو اس کے ورثا اس کی طرف سے روزہ رکھنے یا ساٹھ مسکینوں کو کھانا کھلانے میں اختیار رکھتے ہیں، نص کے ظاہر پر رکتے ہوئے۔ اس نے مغنی المحتاج میں خطیب شربینی کا قول نقل کیا کہ کفارات میں نص کی پیروی ہوتی ہے، قیاس کی نہیں، اور اللہ نے قتل کے کفارے میں غلام آزاد کرنے اور روزے کے سوا کچھ ذکر نہیں کیا۔ اس نے کہا کہ مشقت، یا ایسی بیماری جو روزے کو انتہائی دشوار بنا دے، قدرت حاصل ہونے تک روزے کی تاخیر کو جائز کرتی ہے، اور المجموع میں نووی کا قول نقل کیا کہ جو کفارہ زیادتی کے بغیر ہو، جیسے قتل خطا کا کفارہ، وہ بلا اختلاف تاخیر کے ساتھ ادا ہو سکتا ہے۔ اس نے شافعیہ کا دوسرا قول، جیسا کہ شیرازی نے نقل کیا، اور حنابلہ کا دوسرا قول، جیسا کہ ابن قدامہ نے المغنی میں نقل کیا، بیان کیا کہ عاجز شخص ظہار اور رمضان کے دن میں جماع کے کفارے پر قیاس کرتے ہوئے ساٹھ مسکینوں کو، ہر ایک کو ایک مد، کھانا کھلائے۔ اس نے کہا کہ فتویٰ کے لیے یہ قول اختیار کیا جا سکتا ہے کیونکہ یہ گناہ کی پردہ پوشی اور کوتاہی کی تلافی میں کفارے کا مقصد پورا کرتا ہے، اور نتیجہ نکالا کہ روزے سے عاجز شخص پر، شافعیہ کے معتمد کے مقابل قول اور حنابلہ کے دوسرے قول کی تقلید میں، ساٹھ مسکینوں کو کھانا کھلانے میں حرج نہیں۔"
  es: "Una pregunta sobre alguien que causó una muerte involuntariamente y no puede ayunar debido a un trabajo extenuante, en la que el Departamento General de Iftaa de Jordania expuso la opinión shafi'í, según la cual el ayuno sigue siendo obligatorio, y la opinión contraria, según la cual pasa a alimentar a sesenta pobres, y concluyó que no hay objeción a que los alimente siguiendo esta última opinión. El Departamento respondió que la opinión mayoritaria en la escuela shafi'í es que quien no puede ayunar en expiación por un homicidio no pasa a alimentar a los pobres, sino que el ayuno sigue siendo obligatorio para él; si muere, sus herederos eligen entre ayunar por él y alimentar a sesenta pobres, ateniéndose al texto bíblico. Citó a al-Khatib al-Shirbini en Mughni al-Muhtaj, donde afirma que en las expiaciones se sigue el texto bíblico, no la analogía, y que Dios solo mencionó la liberación de un esclavo y el ayuno en expiación por un homicidio. Afirmó que la adversidad, o una enfermedad que dificulta enormemente el ayuno, permite posponerlo hasta que la persona pueda hacerlo, citando a al-Nawawi en al-Majmu, quien sostiene que una expiación no causada por una mala acción, como la de un homicidio accidental, puede posponerse sin desacuerdo. Expuso la otra opinión entre los shafi'ís, según lo informado por al-Shirazi, y la otra opinión entre los hanbalíes, según lo informado por Ibn Qudama en al-Mughni: quien no puede ayunar alimenta a sesenta personas pobres, con un mudd cada una, por analogía con las expiaciones por el zihar y por las relaciones sexuales durante un día de Ramadán. Afirmó que esta opinión puede adoptarse para una fatwa porque cumple el propósito de la expiación al cubrir el pecado y subsanar la deficiencia, y concluyó que no hay objeción a que quien no puede ayunar alimente a sesenta personas pobres, siguiendo la opinión opuesta a la shafi'í y a la hanbalí."
  fr: "Concernant une question relative à une personne ayant causé un décès involontairement et ne pouvant jeûner en raison d'un travail pénible, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a exposé l'avis majoritaire de l'école chaféite, selon lequel le jeûne reste dû, et l'avis contraire, qui préconise que la personne concernée nourrisse soixante personnes pauvres. Le Département a conclu qu'il n'y a pas d'objection à ce que la personne qui les nourrit suive l'avis contraire. Il a répondu que l'avis majoritaire de l'école chaféite est que celui qui est dans l'incapacité de jeûner en expiation d'un meurtre ne se dessaisit pas de nourrir les pauvres, mais que le jeûne lui reste dû. S'il décède, ses héritiers choisissent entre jeûner pour lui et nourrir soixante pauvres, conformément au texte. Le Département a cité al-Khatib al-Shirbini dans son ouvrage Mughni al-Muhtaj, selon lequel, en matière d'expiation, c'est le texte qui est suivi, et non l'analogie, et que Dieu n'a mentionné que l'affranchissement d'un esclave et le jeûne en expiation d'un meurtre. Il est indiqué que les difficultés, ou une maladie rendant le jeûne extrêmement pénible, permettent de le reporter jusqu'à ce que la personne soit en mesure de le faire. L'avis cité est celui d'al-Nawawi dans al-Majmu, selon lequel une expiation non due à une faute, comme celle d'un homicide involontaire, peut être reportée sans objection. L'avis divergent des écoles chaféite, rapporté par al-Shirazi, et hanbalite, rapporté par Ibn Qudama dans al-Mughni, stipule que celui qui est dans l'incapacité de jeûner doit nourrir soixante pauvres, à hauteur d'un mudd chacun, par analogie avec les expiations pour le zihar et les rapports sexuels pendant un jour de Ramadan. Cet avis est jugé recevable pour la fatwa car il remplit l'objectif d'expiation en couvrant le péché et en compensant le manque. L'avis conclut qu'il n'y a pas d'objection à ce que celui qui est dans l'incapacité de jeûner nourrisse soixante pauvres, suivant ainsi l'avis contraire à l'avis chaféite et à l'avis hanbalite."
  tr: "Bir kişinin istemeden öldürülmesine sebep olup ağır iş nedeniyle oruç tutamamasıyla ilgili bir soruda, Şafiilere göre güvenilen Ürdün Genel Fetva Dairesi'nin orucun kendi sorumluluğunda olduğunu, karşıt görüşün ise altmış fakir kişiyi beslemenin zararlı sayılmayacağını ve bu görüşü takip ederek onu beslemenin zararsız olduğunu belirtti. Panel, Şafii okulunda kabul edilen görüşün, ki bu çoğunluk görüşüdür, öldürmekten dolayı oruç tutamayanların beslenmeye geçmediği, aksine oruç tutmanın sorumluluğunda kaldığı yönündedir. Eğer ölürse, vasileri onun adına oruç tutmak ile altmış fakir kişiyi beslemek arasında seçim yapabilir ve metnin görünüş anlamında dururlar. Mughni al-Muhtaj'da Al-Khatib Al-Sharbini'nin sözlerinden alıntı yaptı; kefaretlerin metne göre değil, benzetmeden kaynaklandığı ve Tanrı'nın cinayet için sadece özgürlük ve oruçtan bahsettiği ifadesi aktarıldı. Orucu son derece zorlaştıran zorluk veya hastalığın orucun mümkün olana kadar ertelenmesine izin verdiğini söyledi. Al-Majmu'da Al-Nawawi'nin sözünü alıntıladı; saldırmazlıktan kaynaklanan kefaret, kazara öldürme için kefaret gibi, ihmalkarlığa da uyuşmaz. Şirazi'nin aktardığına göre Şafiilere göre diğer görüşe ve El-Mughni'de İbn Kudem'in aktardığına göre Hanbaliler arasında engellilerin her muhtaç kişi için altmış fakiri beslemesi gerektiğini, Ramazan ayında gün içinde zihar ve cinsel ilişki için kefaret gibi bir şekilde uzatılması gerektiği belirtildi. Bu görüşün fetva için seçilebileceğini çünkü günahı örtme ve eksiklikleri telafi etme amacını yerine getirdiğini belirtti. Ceza alamayan altmış fakir kişinin beslenmesinde zararlı olmadığını, Şafiilerin ve Hanelilerin diğer görüşünün aksi görüşü taklit ettiğini belirtti."
  id: "Sebuah pertanyaan tentang seseorang yang menyebabkan pembunuhan jiwa secara tidak sengaja dan tidak dapat berpuasa karena kerja keras, disajikan bahwa Departemen Fatwa Umum Yordania, yang dijadikan dasar menurut Syafi'i, berpendapat bahwa puasa tetap berada di bawah tanggung jawabnya, sementara pandangan sebaliknya adalah memberi makan enam puluh orang miskin tidak dianggap berbahaya, dan menyimpulkan bahwa tidak ada salahnya memberinya makan, mengikuti pandangan ini. Panel menjawab bahwa pandangan yang diterima dalam mazhab Syafi'i, yang merupakan pendapat mayoritas, adalah bahwa seseorang yang tidak dapat berpuasa sebagai penebusan atas pembunuhan tidak beralih ke makan, melainkan puasa tetap menjadi tanggung jawabnya. Jika dia meninggal, para walinya memiliki pilihan antara berpuasa atas namanya dan memberi makan enam puluh orang miskin, berdiri pada makna yang tampak dari teks tersebut. Panel mengutip pernyataan Al-Khatib Al-Sharbini dalam Mughni al-Muhtaj bahwa penebusan mengikuti teks, bukan analogi, dan bahwa Tuhan hanya menyebut pembebasan dan puasa sebagai penebusan atas pembunuhan. Dia mengatakan bahwa kesulitan atau penyakit yang membuat puasa sangat sulit memungkinkan penundaan puasa sampai memungkinkan untuk melakukannya. Dia mengutip pernyataan Al-Nawawi dalam Al-Majmu bahwa penebusan yang disebabkan oleh non-agresi, seperti penebusan atas pembunuhan tidak sengaja, berlaku untuk kelalaian tanpa bantahan. Dia menyebutkan pendapat lain menurut syafi'i, seperti yang dilaporkan oleh Shirazi, dan pendapat lain di antara Hanbali, seperti yang dilaporkan oleh Ibn Qudamah dalam Al-Mughni, bahwa penyandang disabilitas harus memberi makan enam puluh orang miskin untuk setiap orang yang membutuhkan secara analogi dengan penebusan untuk zihar dan penebusan untuk hubungan seksual pada hari Ramadan. Pendapat ini dikatakan dapat dipilih untuk fatwa karena memenuhi tujuan penebusan dalam menutupi dosa dan menebus kekurangan. Pernyataan itu menyimpulkan bahwa tidak ada salahnya memberi makan enam puluh orang miskin yang tidak bisa berpuasa, meniru pandangan sebaliknya menurut syafi'i dan pendapat lain di antara Hanbali."
