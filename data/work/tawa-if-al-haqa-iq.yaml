summary:
  ar: "كتاب لرشيد الدين من أربع عشرة رسالة، تبدأ الأولى بحلم رآه المؤلف في ليلة السادس والعشرين من رمضان 705 هـ، وتتناول الأحاديث الغامضة وإمكان الكتابة السريعة للملهم، والأرض أمسطحة أم كروية، والبعث، والمغفرة، وأسئلة التوحيد، ودرجات الكمال، والمعنى الذي قصد به الحديث عن قول لا إله إلا الله {cite:jami-al-tawarikh-khashshab-1960 p. 176}."
  en: "A work by Rashid al-Din in fourteen treatises. The first recounts a dream he had on the night of 26 Ramadan 705 AH. The others treat obscure sayings, whether the inspired can write with remarkable speed, whether the earth is flat or spherical, resurrection, divine forgiveness, questions of God's unity, degrees of perfection, and the sultan's question on a saying about the declaration of faith {cite:jami-al-tawarikh-khashshab-1960 p. 176}. The editor's summary lists the subjects; the dating is read from OCR {cite:jami-al-tawarikh-khashshab-1960 p. 177}."
  es: "Obra de Rashid al-Din en catorce tratados. El primero relata un sueño que tuvo el autor la noche del 26 de Ramadán de 705 de la Hégira. Los demás tratan dichos oscuros, si el inspirado puede escribir con gran rapidez, si la tierra es plana o esférica, la resurrección, el perdón divino, cuestiones de la unicidad de Dios, los grados de perfección y una pregunta del sultán sobre un dicho acerca de la profesión de fe {cite:jami-al-tawarikh-khashshab-1960 p. 176}. El resumen del editor enumera los temas; la fecha se lee del OCR {cite:jami-al-tawarikh-khashshab-1960 p. 177}."
  fr: "Ouvrage de Rashid al-Din en quatorze traités. Le premier raconte un rêve que l'auteur eut la nuit du 26 ramadan 705 de l'Hégire. Les autres traitent de dits obscurs, de la capacité de l'inspiré à écrire très vite, de la forme plate ou sphérique de la terre, de la résurrection, du pardon divin, de questions sur l'unicité de Dieu, des degrés de perfection et d'une question du sultan sur un dit relatif à la profession de foi {cite:jami-al-tawarikh-khashshab-1960 p. 176}. Le résumé de l'éditeur énumère les sujets ; la date est lue sur l'OCR {cite:jami-al-tawarikh-khashshab-1960 p. 177}."
  ur: "رشید الدین کی چودہ رسالوں پر مشتمل کتاب۔ پہلا رسالہ اس خواب کا بیان ہے جو مصنف نے 26 رمضان 705ھ کی رات دیکھا۔ دوسرے رسالے مبہم اقوال، الہام والے کی تیز تحریر، زمین کے ہموار یا کروی ہونے، قیامت، الٰہی مغفرت، توحید کے سوالات، کمال کے درجات، اور سلطان کے ایک سوال پر مشتمل ہیں {cite:jami-al-tawarikh-khashshab-1960 p. 176}۔ موضوعات مرتب کی خلاصے سے لیے گئے ہیں؛ تاریخ OCR سے پڑھی گئی ہے {cite:jami-al-tawarikh-khashshab-1960 p. 177}۔"
