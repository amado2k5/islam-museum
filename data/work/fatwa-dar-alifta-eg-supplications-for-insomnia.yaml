summary:
  ar: "سائل سأل عما يقال من أدعية وأذكار عند حصول الأرق وذهاب النوم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21495)⁩ بأنه قد ورد عن النبي بعض الأدعية والأذكار التي تقال عند الإحساس بالأرق وذهاب النوم وذكرها الجواب على وجهها."
  en: "A questioner asked what supplications and remembrances are said when insomnia strikes and sleep departs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21495) answered that some are transmitted from the Prophet for that state, which the answer records."
  ur: "ایک سائل نے بے خوابی کے وقت پڑھی جانے والی دعائیں اور اذکار پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21495)⁩ نے جواب دیا کہ اس حال کے لیے نبی سے کچھ دعائیں منقول ہیں جو جواب میں درج ہیں۔"
