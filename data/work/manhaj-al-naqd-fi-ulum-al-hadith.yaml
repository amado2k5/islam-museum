summary:
  ar: "كتاب جامعي في علوم الحديث ومنهج النقد عند المحدّثين لنور الدين عتر، أقدم طبعة مفهرسة له صدرت عن دار الفكر سنة 1970 في 503 صفحات ضمن «سلسلة الدراسات الحديثية»، وله طبعات لاحقة منها نسخة مؤرخة بسنة 1979."
  en: "A university textbook on the hadith sciences and the critical method of the hadith scholars by Nur al-Din Itr. Its earliest catalogued edition was published by Dar al-Fikr in 1970 (503 pages) in the series Silsilat al-Dirasat al-Hadithiyya; later editions include a copy dated 1979."
  ur: "نور الدین عتر کی علومِ حدیث اور محدثین کے تنقیدی منہج پر جامعاتی درسی کتاب۔ اس کا قدیم ترین فہرست شدہ ایڈیشن دار الفکر سے 1970ء میں 503 صفحات میں «سلسلۃ الدراسات الحدیثیۃ» کے تحت شائع ہوا؛ بعد کے ایڈیشنوں میں 1979ء کا ایک نسخہ بھی ہے۔"
  es: "Un libro de texto universitario sobre las ciencias del hadiz y el método crítico de los eruditos del hadiz, de Nur al-Din Itr. Su primera edición catalogada fue publicada por Dar al-Fikr en 1970 (503 páginas) en la serie Silsilat al-Dirasat al-Hadithiyya; entre las ediciones posteriores se incluye un ejemplar fechado en 1979."
  fr: "Un manuel universitaire sur les sciences du hadith et la méthode critique des érudits du hadith par Nur al-Din Itr. Sa première édition cataloguée a été publiée par Dar al-Fikr en 1970 (503 pages) dans la série Silsilat al-Dirasat al-Hadithiyya; les éditions ultérieures comprennent un exemplaire daté de 1979."
  tr: "Nur al-Din Attar tarafından hadis bilimleri ve hadis alimleri arasındaki eleştiri metodolojisi üzerine kapsamlı bir kitap. En erken indeksli baskı 1970 yılında Dar al-Fikr tarafından 'Hadis Çalışmaları Serisi'nde 503 sayfa olarak yayımlanmıştır. Sonraki baskıları vardır, bunlardan biri 1979 tarihlidir."
  id: "Sebuah buku komprehensif tentang ilmu hadis dan metodologi kritik di kalangan ulama hadis oleh Nur al-Din Attar. Edisi terindeks paling awal diterbitkan oleh Dar al-Fikr pada tahun 1970 dalam 503 halaman dalam 'Seri Studi Hadis.' Ia memiliki edisi-edisi berikutnya, salah satunya bertanggal 1979."
