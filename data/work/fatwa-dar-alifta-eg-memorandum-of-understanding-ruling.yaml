label: { ar: "التكييف والحكم الشرعي لمذكرة التفاهم", en: "The legal character and ruling of a memorandum of understanding", ur: "مفاہمتی یادداشت کی شرعی کیفیت اور حکم", es: "El carácter jurídico y la interpretación de un memorando de entendimiento", fr: "Le caractère juridique et la portée d'un protocole d'entente" }
summary:
  ar: "شركة مقاولات وشركة تجارة مواد بناء وقعتا مذكرة تفاهم بينهما فسأل أحدهما عن تكييفها وحكمها الشرعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21676)⁩ ببيان تكييف مذكرة التفاهم المذكورة وما يترتب عليها من أحكام على وجهه."
  en: "A contracting company and a building-materials trading company signed a memorandum of understanding, and one party asked its legal character and sharia ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21676) answered by setting out the memorandum's characterisation and the rulings that follow."
  ur: "ایک ٹھیکہ داری کمپنی اور تعمیراتی سامان کی تجارتی کمپنی نے مفاہمتی یادداشت پر دستخط کیے؛ ایک فریق نے اس کی شرعی کیفیت اور حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21676)⁩ نے جواب میں اس کی تکییف اور احکام بیان کیے۔"
  es: "Una empresa constructora y una empresa comercializadora de materiales de construcción firmaron un memorando de entendimiento, y una de las partes preguntó sobre su carácter legal y su interpretación según la sharia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21676) respondió detallando la caracterización del memorando y las resoluciones que se derivan de él."
  fr: "Une entreprise de construction et une société de négoce de matériaux de construction ont signé un protocole d'accord. L'une des parties a demandé sa validité juridique et son application à la charia. La Cour islamique d'Égypte (Dar al-Ifta, Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21676) a répondu en précisant la nature du protocole et les règles qui en découlent."
