label: { ar: "قرار مجمع الفقه الإسلامي الدولي 166 (18/4) بشأن ظاهرة التخويف من الإسلام: تحديات ومواجهات", en: "IIFA resolution 166 (18/4) on the phenomenon of Islamophobia: challenges and responses", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 166 (18/4): اسلاموفوبیا کا رجحان — چیلنجز اور جواب", es: "Resolución 166 (18/4) de la IIFA sobre el fenómeno de la islamofobia: desafíos y respuestas", fr: "Résolution 166 (18/4) de l'IIFA sur le phénomène de l'islamophobie: défis et réponses" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. استحضر ما سماه الآثار السيئة لظاهرة التخويف من الإسلام ⁦(الإسلامفوبيا)⁩ من نفور من الإسلام وضغوط على المسلمين في دول عدة، ونسبه إلى تراكمات تاريخية وتشويهات إعلامية وتقصير في التعريف بالإسلام، وقرر ضرورة التصدي له باستراتيجية تخطط لها الدول والمنظمات الإسلامية ومنظمات الوجود الإسلامي خارج ديار الإسلام تشمل آليات وتدابير إعلامية وسياسية واقتصادية واجتماعية، وتكوين رسالة إعلامية واضحة للتعريف بالإسلام وبيان حقائقه ومبادئه ونشرها بوسائل الإعلام المختلفة والشبكة الدولية. وواصل في بنوده تفصيل وسائل المواجهة والتعاون الدولي والحوار."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). Citing the bad effects of what it calls the Islamophobia phenomenon — aversion to Islam and pressures on Muslims in several countries — which it ascribed to historical accumulations, media distortions and shortcomings in presenting Islam, it resolved that the phenomenon must be countered through a strategy planned by Muslim states, Islamic international organisations and organisations representing Muslim communities outside the Muslim world, including media, political, economic and social mechanisms, and a clear media message presenting Islam's facts, principles and values through all media and the international network — with further clauses on means of response, international cooperation and dialogue."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے اسلاموفوبیا کے اس رجحان کے برے اثرات — اسلام سے بیزاری اور کئی ممالک میں مسلمانوں پر دباؤ — کا ذکر کیا اور اسے تاریخی تراکمات، ذرائع ابلاغ کی تحریف اور اسلام کے تعارف میں کمی سے جوڑا، اور فیصلہ دیا کہ اس کا مقابلہ ایک حکمتِ عملی سے ہو جو اسلامی ممالک، بین الاقوامی اسلامی تنظیمیں اور غیر اسلامی دنیا میں مسلم موجودگی کی نمائندہ تنظیمیں بنائیں، جس میں ذرائع ابلاغ، سیاسی، معاشی اور سماجی تدابیر اور واضح ابلاغی پیغام شامل ہو جو اسلام کی حقائق اور اقدار کو تمام ذرائع ابلاغ اور بین الاقوامی جال پر پھیلائے — جواب دہی کے ذرائع، بین الاقوامی تعاون اور مکالمے کی مزید دفعات کے ساتھ۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Citando los efectos negativos de lo que denomina el fenómeno de la islamofobia —aversión al Islam y presiones sobre los musulmanes en varios países— que atribuye a acumulaciones históricas, distorsiones de los medios de comunicación y deficiencias en la presentación del Islam, resolvió que el fenómeno debe contrarrestarse mediante una estrategia planificada por los estados musulmanes, las organizaciones internacionales islámicas y las organizaciones que representan a las comunidades musulmanas fuera del mundo musulmán, incluidos los medios de comunicación, los mecanismos políticos, económicos y sociales, y un mensaje claro en los medios de comunicación que presente los hechos, principios y valores del Islam a través de todos los medios y la red internacional, con cláusulas adicionales sobre medios de respuesta, cooperación internacional y diálogo."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, soit 9-14 juillet 2007). Constatant les effets néfastes de ce qu'elle qualifie de phénomène d'islamophobie – aversion envers l'islam et pressions exercées sur les musulmans dans plusieurs pays – qu'elle attribue à des facteurs historiques, à des distorsions médiatiques et à des lacunes dans la présentation de l'islam, l'Académie a décidé de lutter contre ce phénomène par une stratégie élaborée conjointement par les États musulmans, les organisations internationales islamiques et les organisations représentant les communautés musulmanes hors du monde musulman. Cette stratégie doit inclure des mécanismes médiatiques, politiques, économiques et sociaux, ainsi qu'un message médiatique clair présentant les faits, les principes et les valeurs de l'islam à travers tous les médias et le réseau international. Des dispositions complémentaires sont prévues concernant les moyens de réponse, la coopération internationale et le dialogue."
