summary:
  ar: "الألبوم الأول للمنشد الإنجليزي نزيل أعظمي، صدر عن أوايكننغ في 1 سبتمبر 2006 بعشر أغان بالإنجليزية والعربية والأردية والبنغالية؛ أغانيه وقراءاته تأملات في تجارب شخصية وفي حياة «السالك» الذي يطلب أن يكون في وئام مع عالم الله، وتجمع الحمد والنعت والموسيقى الشعبية."
  en: "The English nasheed singer Nazeel Azami's debut album, released by Awakening on 1 September 2006 with ten songs in English, Arabic, Urdu and Bengali; its songs and recitals reflect on personal experiences and on life as a 'seeker' aspiring to be at one with the world of God, joining hamd, naat and folk music."
  ur: "انگریز نشید خواں نزیل اعظمی کا پہلا البم، یکم ستمبر 2006 کو اویکننگ سے انگریزی، عربی، اردو اور بنگالی کے دس گیتوں کے ساتھ جاری ہوا؛ گیت ذاتی تجربات اور اللہ کی دنیا سے ہم آہنگی چاہنے والے «سالک» کی زندگی پر غور ہیں۔"
