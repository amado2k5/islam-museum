label: { ar: "دنيا ⁦(ألبوم نزيل أعظمي، 2006)⁩", en: "Dunya (Nazeel Azami album)", ur: "دنیا ⁦(نزیل اعظمی کا البم، 2006)⁩", es: "Dunya (álbum de Nazeel Azami)", fr: "Dunya (album de Nazeel Azami)", tr: "Dunya (albüm 'Nazeel A'zami', 2006)", id: "Dunya (album 'Nazeel A'zami', 2006)" }
summary:
  ar: "الألبوم الأول للمنشد الإنجليزي نزيل أعظمي، صدر عن أوايكننغ في 1 سبتمبر 2006 بعشر أغان بالإنجليزية والعربية والأردية والبنغالية؛ أغانيه وقراءاته تأملات في تجارب شخصية وفي حياة «السالك» الذي يطلب أن يكون في وئام مع عالم الله، وتجمع الحمد والنعت والموسيقى الشعبية."
  en: "The English nasheed singer Nazeel Azami's debut album, released by Awakening on 1 September 2006 with ten songs in English, Arabic, Urdu and Bengali; its songs and recitals reflect on personal experiences and on life as a 'seeker' aspiring to be at one with the world of God, joining hamd, naat and folk music."
  ur: "انگریز نشید خواں نزیل اعظمی کا پہلا البم، یکم ستمبر 2006 کو اویکننگ سے انگریزی، عربی، اردو اور بنگالی کے دس گیتوں کے ساتھ جاری ہوا؛ گیت ذاتی تجربات اور اللہ کی دنیا سے ہم آہنگی چاہنے والے «سالک» کی زندگی پر غور ہیں۔"
  es: "El álbum debut del cantante inglés de nasheed Nazeel Azami, lanzado por Awakening el 1 de septiembre de 2006 con diez canciones en inglés, árabe, urdu y bengalí; sus canciones y recitales reflexionan sobre experiencias personales y sobre la vida como un \"buscador\" que aspira a unirse con el mundo de Dios, combinando hamd, naat y música folclórica."
  fr: "Le premier album de la chanteuse de nasheed anglaise Nazeel Azami, sorti chez Awakening le 1er septembre 2006, comprend dix chansons en anglais, arabe, ourdou et bengali; ses chansons et récitals reflètent des expériences personnelles et la vie d'une « chercheuse » aspirant à ne faire qu'un avec le monde de Dieu, mêlant hamd, naat et musique folklorique."
  tr: "İngiliz şarkıcı Nazeel A'zami'nin ilk albümü, Awakening tarafından 1 Eylül 2006'da yayımlandı ve İngilizce, Arapça, Urduca ve Bengalce on şarkıdan oluşuyor; şarkıları ve okumaları, övgü, övgü ve halk müziğini birleştirerek Tanrı dünyasıyla uyum içinde olmaya çalışan 'arayıcı'nın kişisel deneyimlerini yansıtıyor."
  id: "Album pertama oleh penyanyi Inggris Nazeel A'zami, dirilis oleh Awakening pada 1 September 2006, dengan sepuluh lagu dalam bahasa Inggris, Arab, Urdu, dan Bengali; lagu-lagu dan bacaannya mencerminkan pengalaman pribadi dan kehidupan 'pencari', yang berusaha selaras dengan dunia Tuhan, menggabungkan pujian, eulogi, dan musik rakyat."
