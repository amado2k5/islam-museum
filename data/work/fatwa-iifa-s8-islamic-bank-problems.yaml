label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مشكلات البنوك الإسلامية", en: "IIFA resolution on the problems of Islamic banks", ur: "اکیڈمی کی قرارداد: اسلامی بینکوں کے مسائل", es: "Resolución de la IIFA sobre los problemas de los bancos islámicos", fr: "Résolution de l'IIFA sur les problèmes des banques islamiques" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: عرض قائمة مصنفة على أربعة محاور على الأمانة العامة لاستكتاب المختصين فيها وعرضها في الدورات القادمة بحسب الأولوية التي تراها لجنة التخطيط، أولها الودائع وما يتعلق بها كضمان ودائع الاستثمار بطرق تتلاءم مع أحكام المضاربة."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on the problems of Islamic banks: it presented the secretariat with a list in four axes for commissioning specialist studies to be laid before coming sessions by the planning committee's priorities — the first axis covering deposits, including guaranteeing investment deposits in ways fitting mudaraba rules."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: اسلامی بینکوں کے مسائل کی چار محوری فہرست ماہرین کو تحقیق کے لیے بھیجی گئی — پہلا محور سرمایہ کاری ڈپازٹس کی ضمانت۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre los problemas de los bancos islámicos: presentó a la secretaría una lista en cuatro ejes para encargar estudios especializados que se presentarían antes de las próximas sesiones según las prioridades del comité de planificación; el primer eje abarcaba los depósitos, incluida la garantía de los depósitos de inversión de forma que se ajustaran a las normas de mudaraba."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur les problèmes des banques islamiques: elle a présenté au secrétariat une liste en quatre axes pour commander des études spécialisées à soumettre aux prochaines sessions en fonction des priorités du comité de planification — le premier axe couvrant les dépôts, y compris la garantie des dépôts d'investissement de manière conforme aux règles de la mudaraba."
