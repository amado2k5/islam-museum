summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: نصّ في صياغته على أن ما ادعاه البهاء من الرسالة ونزول الوحي عليه ونسخ كتبه للقرآن وإدخال تغييرات على فروع شرعية ثابتة بالتواتر إنكارٌ لما هو معلوم من الدين بالضرورة، وأن منكر ذلك تنطبق عليه أحكام الكفار بإجماع المسلمين عند المجمع، وأوصى بتصدي الهيئات المعنية للتعريف بخطر هذه الدعوة على ما ورد. سُجّل منسوبًا إلى المجمع."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on the Baha'i faith: its text holds that Baha'u'llah's claims of messengerhood, revelation upon him, abrogating the Quran and altering established sharia branches deny what is known of the religion by necessity, and that denying that is covered by the rulings of disbelief by the Muslims' consensus in the Academy's view; it recommended the relevant bodies confront and explain this call's danger. Recorded as the Academy's own position."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩ بہائیت پر: متن بہاء اللہ کے دعووں کو دین کی ضروریات کا انکار قرار دیتا ہے — اکیڈمی کے مؤقف کا خلاصہ، اکیڈمی ہی کے قائم کیا ہوا۔"
