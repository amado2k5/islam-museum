kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 23: غزوة الخندق"
  en: "The Prophetic Biography for Reformers, episode 23: The Battle of the Trench"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 23: غزوۂ خندق"
  fr: "La biographie prophétique pour les réformateurs, épisode 23 : La bataille du Fossé"
  es: "La biografía profética para los reformadores, episodio 23: La batalla de la Zanja"
summary:
  ar: "يبدأ المحاضر عرض غزوة الخندق، وهي آخر مرة زحف فيها المشركون على المدينة. ويتناول أسبابها وحفر الخندق ومشاق الحصار، ونقض بني قريظة للعهد، وابتلاء المؤمنين والمنافقين في نفوسهم، وتأخر الصلاة، والريح التي فرقت معسكر الأحزاب."
  en: "The lecturer opens the account of the Battle of the Trench, the last time the polytheists marched on Medina. He covers the causes, the digging of the trench and the hardships of the siege, the breach of the covenant by Banu Qurayza, the inner trials of believers and hypocrites, the delayed prayer, and the wind that broke the allied camp."
  ur: "مقرر غزوۂ خندق کا بیان شروع کرتے ہیں، جو آخری موقع تھا جب مشرکین مدینہ پر چڑھ آئے۔ وہ اس کے اسباب، خندق کی کھدائی اور محاصرے کی صعوبتوں، بنو قریظہ کے عہد توڑنے، مومنوں اور منافقوں کی باطنی آزمائش، نماز میں تاخیر اور اس ہوا کا ذکر کرتے ہیں جس نے اتحادیوں کا پڑاؤ بکھیر دیا۔"
  fr: "Le conférencier commence le récit de la bataille du Fossé, la dernière fois que les polythéistes marchèrent sur Médine. Il traite des causes, du creusement du fossé et des épreuves du siège, de la rupture du pacte par les Banu Qurayza, de l'épreuve intérieure des croyants et des hypocrites, de la prière retardée et du vent qui brisa le camp des coalisés."
  es: "El conferenciante inicia el relato de la batalla de la Zanja, la última vez que los politeístas marcharon sobre Medina. Trata las causas, la excavación de la zanja y las penalidades del asedio, la ruptura del pacto por los Banu Qurayza, la prueba interior de creyentes e hipócritas, la oración retrasada y el viento que deshizo el campamento de los coaligados."
