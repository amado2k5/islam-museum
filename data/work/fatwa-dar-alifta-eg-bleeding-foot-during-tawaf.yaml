id: work/fatwa-dar-alifta-eg-bleeding-foot-during-tawaf
class: work
kind: fatwa
label: { ar: "حكم الطواف إذا خرج الدم من المحرم وأصاب ملابس الإحرام حال الطواف", en: "Tawaf when blood leaves the pilgrim and reaches the ihram garments", ur: "طواف کے دوران محرم سے خون نکل کر احرام کو لگ جائے", es: "Tawaf, cuando la sangre abandona al peregrino y llega a las vestiduras del ihram.", fr: "Tawaf, lorsque le sang quitte le pèlerin et atteint les vêtements d'ihram" }
summary:
  ar: "سائل سأل عن الطواف إذا خرج الدم من قدم المحرم وأصاب ملابس إحرامه حال الطواف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20682)⁩ أن خروج الدم من القدم أثناء الطواف لا ينقض الوضوء ولا يقدح في طهارة الثوب ولا يؤثر في صحة الطواف على ما فصّل الجواب."
  en: "A questioner asked about tawaf when blood left the pilgrim's foot and reached his ihram garments during the circuit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20682) answered that it neither breaks wudu nor affects the garment's purity nor the tawaf's validity — as the answer details."
  ur: "ایک سائل نے طواف کے دوران پاؤں سے خون نکل کر احرام کو لگنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20682)⁩ نے جواب دیا کہ نہ وضو ٹوٹتا ہے نہ کپڑے کی طہارت اور طواف متاثر ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó sobre el tawaf cuando la sangre del pie del peregrino llega a su vestimenta de ihram durante el circuito. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20682) respondió que esto no invalida la ablución ni afecta la pureza de la vestimenta ni la validez del tawaf, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant le tawaf lorsque du sang, provenant de son pied, atteint ses vêtements d'ihram durant le pèlerinage. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20682) a répondu que cela n'invalide ni les ablutions (wudu), ni la pureté des vêtements, ni la validité du tawaf, comme le précise la réponse."
