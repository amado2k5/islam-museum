label: { ar: "حكم الطواف إذا خرج الدم من المحرم وأصاب ملابس الإحرام حال الطواف", en: "Tawaf when blood leaves the pilgrim and reaches the ihram garments", ur: "طواف کے دوران محرم سے خون نکل کر احرام کو لگ جائے" }
summary:
  ar: "سائل سأل عن الطواف إذا خرج الدم من قدم المحرم وأصاب ملابس إحرامه حال الطواف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20682)⁩ أن خروج الدم من القدم أثناء الطواف لا ينقض الوضوء ولا يقدح في طهارة الثوب ولا يؤثر في صحة الطواف على ما فصّل الجواب."
  en: "A questioner asked about tawaf when blood left the pilgrim's foot and reached his ihram garments during the circuit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20682) answered that it neither breaks wudu nor affects the garment's purity nor the tawaf's validity — as the answer details."
  ur: "ایک سائل نے طواف کے دوران پاؤں سے خون نکل کر احرام کو لگنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20682)⁩ نے جواب دیا کہ نہ وضو ٹوٹتا ہے نہ کپڑے کی طہارت اور طواف متاثر ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
