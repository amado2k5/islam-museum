summary:
  ar: "الممتع الكبير في التصريف، كتاب في الصرف والتصريف لمؤلفه ابن عصفور الإشبيلي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 669هـ / 1270م {cite:qaf-al-mumti-fi-al-tasrif}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book ID 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}. لم يقرأ المتحف الكتاب."
  en: "al-Mumti fi al-Tasrif (al-Mumti al-Kabir), a book on morphology (sarf and tasrif) by Ibn Usfur al-Ishbili; its date in a research summary supplied to the museum is d. 669 AH / 1270 CE {cite:qaf-al-mumti-fi-al-tasrif}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book ID 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}. The museum has not read the book."
  ur: "الممتع الكبير في التصريف، صرف و تصریف پر ایک کتاب، مصنف ابن عصفور الإشبيلي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 669ھ / 1270ء {cite:qaf-al-mumti-fi-al-tasrif}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book ID 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Mumti fi al-Tasrif (al-Mumti al-Kabir), livre sur la morphologie (sarf et tasrif) de Ibn Usfur al-Ishbili ; sa date dans une synthèse de recherche remise au musée : m. 669 H / 1270 {cite:qaf-al-mumti-fi-al-tasrif}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book ID 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}. Le musée n'a pas lu le livre."
  es: "al-Mumti fi al-Tasrif (al-Mumti al-Kabir), libro sobre morfología (sarf y tasrif) de Ibn Usfur al-Ishbili; su fecha en un resumen de investigación entregado al museo: m. 669 H. / 1270 {cite:qaf-al-mumti-fi-al-tasrif}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book ID 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}. El museo no ha leído el libro."
  tr: "Al-Mumti' al-Kabir fi al-Tasrif, yazarı İbn Asfour al-Ishbili'nin morfoloji ve morfoloji üzerine bir kitap olup, müzeye sunulan araştırma özetine göre tarihini anlatmaktadır: ö. 669 Hicri / 1270 M.S. {kaynak:qaf-al-mumti-fi-al-tasrif}. Özetin Kapsamlı Kütüphane'deki varlığı hakkındaki yanıtı: Evet, ve Kapsamlı Kütüphane'deki kitap: Kitap ID 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}. Müze kitabı okumamıştır."
  id: "Al-Mumti' al-Kabir fi al-Tasrif adalah buku tentang morfologi dan morfologi karya penulisnya Ibn Asfour al-Ishbili, serta sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 669 AH / 1270 M {cite:qaf-al-mumti-fi-al-tasrif}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku tersebut ada di Perpustakaan Komprehensif: ID Buku 8667 {cite:shamela-org-pdf-al-mumti-fi-al-tasrif}. Museum tidak membaca buku tersebut."
