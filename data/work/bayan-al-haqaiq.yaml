summary:
  ar: "من مؤلفات رشيد الدين التي ذكرها في مقدمة جامع التواريخ باسم «بيان الحقائق»، وهي سبع عشرة رسالة. تشمل، بحسب فهرس المؤلف، سؤالاً للسلطان أولجايتو ونصيحة له، ورسائل في تفسير آيات، وفي سوءات العلماء، وفي الطب والحرارة وأنواعها، وفي فوائد زيارة المشاهد ومقابر الأكابر، وفي الخرقة الصوفية، وفي الناسخ والمنسوخ. ويذكر المؤلف أن هذه المؤلفات أُودعت في الربع الرشيدي، وأن الكتاب لم يصل إلينا {cite:jami-al-tawarikh-khashshab-1960 p. 189}{cite:jami-al-tawarikh-khashshab-1960 p. 190}{cite:jami-al-tawarikh-khashshab-1960 p. 191}."
  en: "One of the works Rashid al-Din lists in the preface to the Jami al-Tawarikh under the title Bayan al-Haqa'iq, a set of seventeen treatises. By the author's own list they include a question put to Sultan Oljeitu and advice to him, treatises on the interpretation of Qur'anic verses, on the faults of scholars, on medicine and fever, on the benefits of visiting shrines and the graves of notables, on the Sufi patched cloak, and on abrogation in the Qur'an. The author says these works were placed in the Rab-i Rashidi, and the book itself has not come down to us {cite:jami-al-tawarikh-khashshab-1960 p. 189}{cite:jami-al-tawarikh-khashshab-1960 p. 190}{cite:jami-al-tawarikh-khashshab-1960 p. 191}."
  ur: "رشید الدین کی ان تصانیف میں سے ایک جنہیں انہوں نے جامع التواریخ کے دیباچے میں «بیان الحقائق» کے نام سے گنوایا ہے۔ یہ سترہ رسائل پر مشتمل ہے۔ مصنف کی فہرست کے مطابق اس میں سلطان اولجایتو کے نام ایک سوال اور ان کے لیے نصیحت، آیات کی تفسیر، علما کی کوتاہیوں، طب اور حرارت، مزارات کی زیارت کے فوائد، صوفیوں کی خرقہ پوشی اور ناسخ و منسوخ پر رسائل شامل ہیں۔ مصنف کے مطابق یہ کتابیں ربعِ رشیدی میں رکھی گئیں، اور یہ کتاب ہم تک نہیں پہنچی {cite:jami-al-tawarikh-khashshab-1960 p. 189}{cite:jami-al-tawarikh-khashshab-1960 p. 190}{cite:jami-al-tawarikh-khashshab-1960 p. 191}۔"
  fr: "L'une des œuvres que Rashid al-Din énumère dans la préface du Jami al-Tawarikh sous le titre Bayan al-Haqa'iq, un ensemble de dix-sept traités. Selon la liste de l'auteur, ils comprennent une question posée au sultan Oljeytu et des conseils qui lui sont adressés, des traités sur l'interprétation de versets coraniques, sur les défauts des savants, sur la médecine et la fièvre, sur les bienfaits de la visite des sanctuaires et des tombes des notables, sur la khirqa soufie et sur l'abrogation dans le Coran. L'auteur indique que ces œuvres furent déposées au Rab-i Rashidi, et le livre lui-même ne nous est pas parvenu {cite:jami-al-tawarikh-khashshab-1960 p. 189}{cite:jami-al-tawarikh-khashshab-1960 p. 190}{cite:jami-al-tawarikh-khashshab-1960 p. 191}."
  es: "Una de las obras que Rashid al-Din enumera en el prefacio del Jami al-Tawarikh con el título Bayan al-Haqa'iq, un conjunto de diecisiete tratados. Según la lista del autor, incluyen una pregunta dirigida al sultán Oljeytu y consejos para él, tratados sobre la interpretación de versículos coránicos, sobre los defectos de los sabios, sobre medicina y fiebre, sobre las ventajas de visitar santuarios y tumbas de personas notables, sobre el manto sufí y sobre la abrogación en el Corán. El autor indica que estas obras se depositaron en el Rab-i Rashidi, y el libro mismo no ha llegado hasta nosotros {cite:jami-al-tawarikh-khashshab-1960 p. 189}{cite:jami-al-tawarikh-khashshab-1960 p. 190}{cite:jami-al-tawarikh-khashshab-1960 p. 191}."
