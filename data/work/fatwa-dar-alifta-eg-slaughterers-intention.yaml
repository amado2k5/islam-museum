id: work/fatwa-dar-alifta-eg-slaughterers-intention
class: work
kind: fatwa
label: { ar: "مدى اشتراط مقارنة نية المضحي للذبح", en: "Whether the sacrificer's intention must accompany the slaughter", ur: "کیا قربانی والے کی نیت کا ذبح کے ساتھ ہونا شرط ہے" }
summary:
  ar: "سائل سأل عن اشتراط مقارنة نية المضحي للذبح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23967)⁩ أنه يشترط في المضحي أن تكون نيته مقارنة للذبح إن لم تكن له نية سابقة عند تعيين الأضحية بأي سبيل من سبل التعيين كالشراء أو الإفراز، فإن عينها سلفًا بقصد الأضحية لم يشترط تكرار النية عند الذبح على ما فصّل الجواب."
  en: "A questioner asked whether the sacrificer's intention must accompany the act of slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23967) answered that the sacrificer must have the intention at the slaughter if he had no prior intention when designating the animal for sacrifice by any means of designation — purchase, setting apart and the like; where it was already set aside with the intention of sacrifice, no renewed intention is required at slaughter, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا قربان ہونے والے کی نیت کا ذبح کے ساتھ ہونا شرط ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23967)⁩ نے جواب دیا کہ قربانی والے پر شرط ہے کہ اس کی نیت ذبح کے ساتھ ہو اگر جانور کو قربانی کے لیے مخصوص کرنے کے وقت — خرید، الگ رکھنا وغیرہ — پہلے سے نیت نہ کی ہو؛ اور اگر اس نے پہلے ہی قربانی کی نیت سے مخصوص کیا ہو تو ذبح کے وقت نیت دہرانا شرط نہیں، جیسا کہ جواب میں تفصیل ہے۔"
