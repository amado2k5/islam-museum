id: work/fatwa-dar-alifta-eg-slaughterers-intention
class: work
kind: fatwa
label: { ar: "مدى اشتراط مقارنة نية المضحي للذبح", en: "Whether the sacrificer's intention must accompany the slaughter", ur: "کیا قربانی والے کی نیت کا ذبح کے ساتھ ہونا شرط ہے", es: "Si la intención del sacrificador debe acompañar al sacrificio", fr: "La question de savoir si l'intention du sacrificateur doit accompagner le massacre" }
summary:
  ar: "سائل سأل عن اشتراط مقارنة نية المضحي للذبح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23967)⁩ أنه يشترط في المضحي أن تكون نيته مقارنة للذبح إن لم تكن له نية سابقة عند تعيين الأضحية بأي سبيل من سبل التعيين كالشراء أو الإفراز، فإن عينها سلفًا بقصد الأضحية لم يشترط تكرار النية عند الذبح على ما فصّل الجواب."
  en: "A questioner asked whether the sacrificer's intention must accompany the act of slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23967) answered that the sacrificer must have the intention at the slaughter if he had no prior intention when designating the animal for sacrifice by any means of designation — purchase, setting apart and the like; where it was already set aside with the intention of sacrifice, no renewed intention is required at slaughter, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا قربان ہونے والے کی نیت کا ذبح کے ساتھ ہونا شرط ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23967)⁩ نے جواب دیا کہ قربانی والے پر شرط ہے کہ اس کی نیت ذبح کے ساتھ ہو اگر جانور کو قربانی کے لیے مخصوص کرنے کے وقت — خرید، الگ رکھنا وغیرہ — پہلے سے نیت نہ کی ہو؛ اور اگر اس نے پہلے ہی قربانی کی نیت سے مخصوص کیا ہو تو ذبح کے وقت نیت دہرانا شرط نہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si la intención del sacrificador debe acompañar el acto de la matanza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23967) respondió que el sacrificador debe tener la intención en el momento de la matanza si no tenía ninguna intención previa al designar al animal para el sacrificio por cualquier medio de designación (compra, apartado, etc.); cuando ya se había apartado con la intención de sacrificarlo, no se requiere una intención renovada en el momento de la matanza, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'intention du sacrificateur devait accompagner l'acte d'abattage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23967) a répondu que le sacrificateur devait avoir l'intention de sacrifier s'il n'en avait pas préalablement eu l'intention lorsqu'il a désigné l'animal pour le sacrifice par quelque moyen que ce soit (achat, mise à part, etc.). Si l'animal a déjà été mis à part dans l'intention de le sacrifier, aucune nouvelle intention n'est requise lors de l'abattage, comme le précise la réponse."
