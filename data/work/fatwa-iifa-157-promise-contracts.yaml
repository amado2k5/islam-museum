label: { ar: "قرار مجمع الفقه الإسلامي الدولي 157 (17/6) بشأن المواعدة والمواطأة في العقود", en: "IIFA resolution 157 (17/6) on mutual promising and collusion in contracts", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 157 (17/6): عقود میں باہمی وعدہ اور سازش", es: "Resolución 157 (17/6) de la IIFA sobre promesas mutuas y colusión en contratos", fr: "Résolution 157 (17/6) de l'IIFA sur les promesses mutuelles et la collusion dans les contrats" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على قراريه 40–41 ⁦(5/2 و5/3)⁩. قرر: الأصل في المواعدة من الطرفين أنها ملزمة ديانة لا قضاءً؛ المواعدة من الطرفين على عقد تحايلًا على الربا كالمواطأة على العينة أو المواعدة على بيع وسلف ممنوعة شرعًا؛ في الحالات التي لا يمكن إنجاز البيع فيها لعدم وجود المبيع في ملك البائع مع حاجة عامة لإلزام الطرفين بإنجاز عقد مستقبلي بحكم القانون أو الأعراف التجارية الدولية ⁦(كالاعتماد المستندي لاستيراد البضاعات)⁩ يجوز جعل المواعدة ملزمة للطرفين بتقنين حكومي أو باتفاقهما نصًّا في الاتفاقية؛ والمواعدة الملزمة في هذه الحالة لا تأخذ حكم البيع المضاف للمستقبل فلا ينتقل بها ملك المبيع ولا ينعقد البيع إلا بتراض جديد أو بشروط البيع عند حلوله، مع بيان أثرها في الحقوق والالتزامات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing its resolutions 40–41 (5/2 and 5/3). It ruled: mutual promises are in principle binding in conscience, not enforceable at law; mutual promises to contract as a device against riba — such as collusion on 'ina or promising a sale-and-loan — are prohibited; where a sale cannot presently be concluded because the seller does not own the object and a general need exists to bind both parties to a future contract by law or international commercial custom (as with documentary credit for imports), the mutual promise may be made binding on both by government legislation or by their express agreement in the contract; and a binding promise in this case does not take the rule of a sale deferred to the future — ownership does not pass by it and the sale is concluded only by renewed consent or the sale terms upon maturity — with the consequences for rights and obligations set out."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، اپنی قراردادوں 40–41 ⁦(5/2 اور 5/3)⁩ کے جائزے کے بعد۔ فیصلے: باہمی وعدہ اصل میں ضمیر میں لازم ہے، عدالت میں نافذ نہیں؛ ربا سے بچنے کے لیے بہانے کے طور پر باہمی وعدہ — جیسے عینہ پر سازش یا بیع و سلف کا وعدہ — شرعاً ممنوع؛ جہاں مبیع فروخت کنندہ کے ملک میں نہ ہو کر بیع ممکن نہ ہو اور مستقبل کے عقد کے لیے دونوں فریقوں کو باندھنا قانون یا بین الاقوامی تجارتی عرف کے تحت عام ضرورت ہو ⁦(درآمد کے لیے دستاویزی اعتبار جیسے)⁩ وہاں باہمی وعدے کو سرکاری قانون سازی یا فریقین کے صریح متن سے لازم بنایا جا سکتا ہے؛ اور اس صورت میں لازم وعدہ مستقبل پر منسوب بیع کا حکم نہیں رکھتا — اس سے ملکیت منتقل نہیں ہوتی اور بیع صرف نئی رضامندی یا مدت آنے پر بیع کی شرائط سے منعقد ہوتی ہے — حقوق و التزامات پر اثرات کے بیان کے ساتھ۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 17.ª sesión en Ammán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24–28 de junio de 2006), después de revisar sus resoluciones 40–41 (5/2 y 5/3). Dictaminó: las promesas mutuas son en principio vinculantes en conciencia, no exigibles por ley; las promesas mutuas de contratar como un mecanismo contra la riba —como la colusión en 'ina o la promesa de una venta y préstamo— están prohibidas; cuando una venta no puede concluirse en el presente porque el vendedor no es propietario del objeto y existe una necesidad general de vincular a ambas partes a un contrato futuro por ley o costumbre comercial internacional (como con el crédito documentario para importaciones), la promesa mutua puede hacerse vinculante para ambas por la legislación gubernamental o por su acuerdo expreso en el contrato; y una promesa vinculante en este caso no adopta la regla de una venta diferida al futuro: la propiedad no se transfiere por ella y la venta se concluye solo por consentimiento renovado o por los términos de venta al vencimiento, con las consecuencias para los derechos y obligaciones establecidos."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006), après examen de ses résolutions 40 et 41 (5/2 et 5/3). Elle a statué que: les promesses réciproques sont en principe contraignantes en conscience, mais non exécutoires en droit; les promesses réciproques de contracter comme moyen de lutter contre le riba — telles que la collusion sur l'ina ou la promesse d'une vente avec prêt — sont interdites; lorsqu'une vente ne peut être conclue immédiatement parce que le vendeur n'est pas propriétaire de l'objet et qu'il existe un besoin général de lier les deux parties à un contrat futur par la loi ou les usages commerciaux internationaux (comme pour le crédit documentaire à l'importation), la promesse réciproque peut être rendue contraignante pour les deux parties par une loi ou par leur accord exprès dans le contrat. et une promesse contraignante dans ce cas ne suit pas la règle d'une vente différée à l'avenir — la propriété n'est pas transférée et la vente n'est conclue que par un consentement renouvelé ou par les conditions de vente à l'échéance — avec les conséquences prévues pour les droits et obligations."
