id: work/fatwa-aliftaa-jo-fasting-with-diabetes-heart-disease-and-other-chronic-illness
class: work
kind: fatwa
label: { ar: "صيام مرضى السكري والقلب والضغط والكلى والقرحة", en: "Fasting for people with diabetes, heart disease, high blood pressure, kidney disease or ulcers", ur: "ذیابیطس، دل، بلڈ پریشر، گردے اور السر کے مریضوں کا روزہ" }
summary:
  ar: "سؤال عن صيام مرضى السكري والقلب والضغط والكلى والقرحة، أجابت فيه دائرة الإفتاء العام الأردنية بأن العاجز عن الصوم مطلقًا يفطر وعليه الفدية دون قضاء، ومن يستطيعه في بعض الأيام يصوم ما استطاع ويقضي الباقي، ومن يشق عليه في الصيف ويقدر عليه في الشتاء يفطر ويقضي. أجابت الدائرة بأن من عجز عن الصوم مطلقًا أفطر وعليه الفدية ولا قضاء عليه، واستشهدت بآية الفدية في [[passage/quran-2-184|سورة البقرة 2:184]]. وقالت إن من كان يستطيع الصيام في بعض أيام الشهر دون بعض يصوم ما يستطيع، ويقضي بعد رمضان ما أفطره متى استطاع، ولا فدية عليه. وأضافت أن المريض الذي يشق عليه الصيام في أيام الصيف الطويلة الحارة ويستطيع القضاء في أيام الشتاء القصيرة يفطر، وعليه القضاء عند التمكن، ولا فدية عليه."
  en: "A question about fasting for people with diabetes, heart disease, high blood pressure, kidney disease or ulcers, in which Jordan's General Iftaa Department answered that someone wholly unable to fast breaks the fast and pays the fidya without making up the days, someone able on some days fasts those and makes up the rest, and someone burdened in summer but able in winter breaks the fast and makes it up later. The Department answered that someone wholly unable to fast does not fast and owes the fidya, feeding a poor person, but no making up, citing the verse on the fidya in [[passage/quran-2-184|Surat al-Baqara 2:184]]. It said that someone able to fast on some days of the month but not others fasts what he can and makes up the missed days after Ramadan whenever he is able, with no fidya. It added that a sick person for whom fasting is a hardship in the long, hot days of summer but who can make up the days in the short days of winter breaks the fast and makes it up when able, with no fidya."
  ur: "ذیابیطس، دل، بلڈ پریشر، گردے اور السر کے مریضوں کے روزے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو روزے سے بالکل عاجز ہو وہ روزہ نہ رکھے اور فدیہ دے، قضا نہیں؛ جو بعض دنوں میں رکھ سکے وہ رکھے اور باقی کی قضا کرے؛ اور جس پر گرمی میں مشقت ہو مگر سردی میں رکھ سکے وہ روزہ چھوڑے اور بعد میں قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو روزے سے بالکل عاجز ہو وہ روزہ نہ رکھے، اس پر فدیہ ہے اور قضا نہیں، اور فدیہ کی آیت [[passage/quran-2-184|سورۃ البقرہ 2:184]] کا حوالہ دیا۔ اس نے کہا کہ جو مہینے کے بعض دنوں میں روزہ رکھ سکے اور بعض میں نہیں، وہ جتنے رکھ سکے رکھے اور چھوٹے ہوئے روزوں کی رمضان کے بعد جب ممکن ہو قضا کرے، اس پر فدیہ نہیں۔ اس نے مزید کہا کہ جس مریض پر گرمیوں کے لمبے گرم دنوں میں روزہ مشکل ہو اور وہ سردیوں کے چھوٹے دنوں میں قضا کر سکے، وہ روزہ چھوڑے اور قدرت ہونے پر قضا کرے، اس پر فدیہ نہیں۔"
