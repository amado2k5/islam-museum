label: { ar: "صيام مرضى السكري والقلب والضغط والكلى والقرحة", en: "Fasting for people with diabetes, heart disease, high blood pressure, kidney disease or ulcers", ur: "ذیابیطس، دل، بلڈ پریشر، گردے اور السر کے مریضوں کا روزہ", es: "Ayuno para personas con diabetes, enfermedades cardíacas, hipertensión arterial, enfermedades renales o úlceras.", fr: "Le jeûne est déconseillé aux personnes atteintes de diabète, de maladies cardiaques, d'hypertension artérielle, de maladies rénales ou d'ulcères.", tr: "Diyabetli, kalp, hipertansiv, böbrek ve ülser hastaları için oruç", id: "Puasa untuk pasien diabetes, jantung, hipertensi, ginjal, dan tukak" }
summary:
  ar: "سؤال عن صيام مرضى السكري والقلب والضغط والكلى والقرحة، أجابت فيه دائرة الإفتاء العام الأردنية بأن العاجز عن الصوم مطلقًا يفطر وعليه الفدية دون قضاء، ومن يستطيعه في بعض الأيام يصوم ما استطاع ويقضي الباقي، ومن يشق عليه في الصيف ويقدر عليه في الشتاء يفطر ويقضي. أجابت الدائرة بأن من عجز عن الصوم مطلقًا أفطر وعليه الفدية ولا قضاء عليه، واستشهدت بآية الفدية في [[passage/quran-2-184|سورة البقرة 2:184]]. وقالت إن من كان يستطيع الصيام في بعض أيام الشهر دون بعض يصوم ما يستطيع، ويقضي بعد رمضان ما أفطره متى استطاع، ولا فدية عليه. وأضافت أن المريض الذي يشق عليه الصيام في أيام الصيف الطويلة الحارة ويستطيع القضاء في أيام الشتاء القصيرة يفطر، وعليه القضاء عند التمكن، ولا فدية عليه."
  en: "A question about fasting for people with diabetes, heart disease, high blood pressure, kidney disease or ulcers, in which Jordan's General Iftaa Department answered that someone wholly unable to fast breaks the fast and pays the fidya without making up the days, someone able on some days fasts those and makes up the rest, and someone burdened in summer but able in winter breaks the fast and makes it up later. The Department answered that someone wholly unable to fast does not fast and owes the fidya, feeding a poor person, but no making up, citing the verse on the fidya in [[passage/quran-2-184|Surat al-Baqara 2:184]]. It said that someone able to fast on some days of the month but not others fasts what he can and makes up the missed days after Ramadan whenever he is able, with no fidya. It added that a sick person for whom fasting is a hardship in the long, hot days of summer but who can make up the days in the short days of winter breaks the fast and makes it up when able, with no fidya."
  ur: "ذیابیطس، دل، بلڈ پریشر، گردے اور السر کے مریضوں کے روزے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو روزے سے بالکل عاجز ہو وہ روزہ نہ رکھے اور فدیہ دے، قضا نہیں؛ جو بعض دنوں میں رکھ سکے وہ رکھے اور باقی کی قضا کرے؛ اور جس پر گرمی میں مشقت ہو مگر سردی میں رکھ سکے وہ روزہ چھوڑے اور بعد میں قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو روزے سے بالکل عاجز ہو وہ روزہ نہ رکھے، اس پر فدیہ ہے اور قضا نہیں، اور فدیہ کی آیت [[passage/quran-2-184|سورۃ البقرہ 2:184]] کا حوالہ دیا۔ اس نے کہا کہ جو مہینے کے بعض دنوں میں روزہ رکھ سکے اور بعض میں نہیں، وہ جتنے رکھ سکے رکھے اور چھوٹے ہوئے روزوں کی رمضان کے بعد جب ممکن ہو قضا کرے، اس پر فدیہ نہیں۔ اس نے مزید کہا کہ جس مریض پر گرمیوں کے لمبے گرم دنوں میں روزہ مشکل ہو اور وہ سردیوں کے چھوٹے دنوں میں قضا کر سکے، وہ روزہ چھوڑے اور قدرت ہونے پر قضا کرے، اس پر فدیہ نہیں۔"
  es: "Una pregunta sobre el ayuno para personas con diabetes, cardiopatía, hipertensión, enfermedad renal o úlceras, en la que el Departamento General de Iftaa de Jordania respondió que quien es totalmente incapaz de ayunar rompe el ayuno y paga la fidya sin recuperar los días perdidos; quien puede ayunar algunos días ayuna esos días y recupera el resto; y quien está agobiado en verano pero puede ayunar en invierno rompe el ayuno y lo recupera más tarde. El Departamento respondió que quien es totalmente incapaz de ayunar no ayuna y debe la fidya, alimentando a una persona pobre, pero sin recuperar los días perdidos, citando el versículo sobre la fidya en [[passage/quran-2-184|Surat al-Baqara 2:184]]. Dijo que quien puede ayunar algunos días del mes pero no otros ayuna lo que puede y recupera los días perdidos después de Ramadán cuando le sea posible, sin fidya. Añadió que una persona enferma para quien el ayuno supone una dificultad durante los largos y calurosos días de verano, pero que puede recuperar los días perdidos durante los cortos días de invierno, rompe el ayuno y lo recupera cuando le es posible, sin fidya."
  fr: "Une question concernant le jeûne pour les personnes atteintes de diabète, de maladies cardiaques, d'hypertension artérielle, d'insuffisance rénale ou d'ulcères a été posée. Le Département général de la Iftaa de Jordanie a répondu que la personne totalement incapable de jeûner rompt le jeûne et s'acquitte de la fidya sans rattraper les jours manqués; celle qui est capable de jeûner certains jours jeûne ces jours-là et rattrape les autres; et celle qui est accablée par les charges en été mais capable de jeûner en hiver rompt le jeûne et le rattrape ultérieurement. Le Département a également répondu que la personne totalement incapable de jeûner ne jeûne pas et doit s'acquitter de la fidya, en nourrissant une personne pauvre, mais sans possibilité de rattraper les jours manqués, citant le verset relatif à la fidya dans la sourate Al-Baqara (2:184). Il a précisé que la personne capable de jeûner certains jours du mois, mais pas d'autres, jeûne ce qu'elle peut et rattrape les jours manqués après le Ramadan, dès qu'elle le peut, sans fidya. Il a ajouté qu'une personne malade pour qui le jeûne est une épreuve pendant les longues et chaudes journées d'été, mais qui peut rattraper les jours pendant les courtes journées d'hiver, rompt le jeûne et le rattrape lorsqu'elle le peut, sans fidya."
  tr: "Diyabet, kalp hastalığı, hipertansiyon, böbrek ve ülser hastaları için oruç hakkında bir soru. Ürdün Genel Fetva Dairesi, kesinlikle oruç tutamayan kişinin orucu bozması ve kaçırılan orucu telafi etmeden fidyeyi telafi etmesi gerektiğini söyledi. Bazı günler oruç tutabilen kişi mümkün olduğunca oruç tutmalı ve kalanını tamamlamalıdır. Yazın oruç tutamayan ama kışın oruç tutabilen orucu bozup orucu telafi etmelidir. Daire, hiç oruç tutamayan kişinin orucu bozması ve fidyasını uydurması ama uydurmaması gerektiğini söyledi. [[pasaj/kuran-kuran-2-184|Baqarah 2 suresindeki fidya ayetini alıntıladı:184]]. Ayın bazı günlerinde oruç tutup diğerlerinde oruç tutamayan herkesin mümkün olduğunca oruç tutması gerektiği ve Ramazan sonrası orucunu ne zaman bozduğunu fidya olmadan telafi edebileceği belirtilirdi. Ayrıca, uzun ve sıcak yaz günlerinde oruç tutmayı zor bulan ve kısa kış günlerinde orucu telafi edebilen bir hastanın orucu bozması ve mümkün olduğunda orucu telafi etmesi gerektiği ve onun için fidya olmadığı belirtilir."
  id: "Sebuah pertanyaan tentang puasa bagi pasien diabetes, penyakit jantung, hipertensi, ginjal, dan tukak lambung. Departemen Fatwa Jenderal Yordania menjawab bahwa seseorang yang benar-benar tidak bisa berpuasa harus memutus puasa dan harus menutupi tebusan tanpa menutupi puasa yang terlewat. Siapa pun yang mampu berpuasa pada beberapa hari harus berpuasa sebanyak mungkin dan menggantikan sisanya. Siapa pun yang tidak bisa berpuasa di musim panas tetapi mampu berpuasa di musim dingin harus memutus puasa dan menebus puasa. Departemen menjawab bahwa siapa pun yang sama sekali tidak bisa berpuasa harus memutus puasa dan harus menebus fidya tetapi tidak menebusnya. Mereka mengutip ayat fidya dalam [[ayat/quran-2-184|Surah Al-Baqarah 2:184]]. Dikatakan bahwa siapa pun yang dapat berpuasa pada beberapa hari dalam sebulan tetapi tidak di hari lain, harus berpuasa sebanyak mungkin, dan setelah Ramadan ia boleh mengganti apa yang telah diputuskan kapan pun bisa, tanpa fidya. Dikatakan bahwa pasien yang kesulitan berpuasa selama hari-hari musim panas yang panjang dan panas serta dapat menebus puasa selama hari-hari musim dingin yang singkat harus memutus puasa dan harus menebus puasa jika memungkinkan, dan tidak ada fidya untuknya."
