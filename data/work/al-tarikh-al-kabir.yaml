summary:
  ar: "معجم البخاري ⁦(ت 256هـ)⁩ لرواة الحديث من الصحابة فمن بعدهم إلى طبقة شيوخه، مرتب على حروف المعجم مع تقديم من اسمه محمد، يجمع بين العلل والجرح والتعديل والأنساب وتاريخ الرواة. قال البخاري إنه صنفه بالمدينة عند قبر النبي في الليالي المقمرة، وإنه قلّ اسم فيه إلا وله عنده قصة لكنه كره أن يطول الكتاب، وإنه صنفه ثلاث مرات؛ ورواه عنه جماعة منهم ابن فارس الدلال ومحمد بن سهل البصري، وعليه بنى مسلم «الأسماء والكنى» وابن أبي حاتم «الجرح والتعديل» في كثير من مادته {cite:tarikh-kabir-dabbasi-v1 p. 9-22}."
  en: "Al-Bukhari's (d. 256 AH) dictionary of hadith transmitters from the Companions down to the generation of his own teachers, alphabetical with those named Muhammad placed first, combining hidden defects, criticism and vindication, genealogy and transmitters' history. Al-Bukhari said he wrote it in Medina by the Prophet's grave on moonlit nights, that hardly a name in it lacked a story he knew but he disliked lengthening the book, and that he composed it three times; several students transmitted it, among them Ibn Faris al-Dallal and Muhammad ibn Sahl al-Basri, and Muslim's al-Asma' wa-l-Kuna and Ibn Abi Hatim's al-Jarh wa-l-Ta'dil drew much of their material from it."
  es: "El diccionario de Al-Bujari (fallecido en el año 256 de la Hégira) sobre transmisores de hadices, desde los Compañeros hasta la generación de sus propios maestros, ordenado alfabéticamente con los llamados Muhammad en primer lugar, combina defectos ocultos, críticas y justificaciones, genealogía e historia de los transmisores. Al-Bujari afirmó haberlo escrito en Medina, junto a la tumba del Profeta, en noches de luna llena; que casi ningún nombre carecía de una historia que él conociera, pero que no le gustaba alargar el libro; y que lo compuso tres veces. Varios estudiantes lo transmitieron, entre ellos Ibn Faris al-Dallal y Muhammad ibn Sahl al-Basri, y Al-Asma' wa-l-Kuna de Muslim y Al-Jarh wa-l-Ta'dil de Ibn Abi Hatim extrajeron gran parte de su material de él."
  fr: "Le dictionnaire de hadiths d'al-Bukhari (mort en 256 AH), recensant les transmetteurs depuis les Compagnons jusqu'à la génération de ses propres maîtres, est classé par ordre alphabétique, les hadiths portant le nom de Muhammad figurant en premier. Il y mêle les imperfections cachées, les critiques et les justifications, la généalogie et l'histoire des transmetteurs. Al-Bukhari affirmait l'avoir écrit à Médine, près du tombeau du Prophète, les nuits de pleine lune. Il expliquait que presque chaque nom qui y figurait était associé à une histoire, mais qu'il répugnait à allonger l'ouvrage. Il précisait l'avoir composé à trois reprises. Plusieurs élèves, dont Ibn Faris al-Dallal et Muhammad ibn Sahl al-Basri, l'ont transmis. Les ouvrages de Muslim (al-Asma' wa-l-Kuna) et d'Ibn Abi Hatim (al-Jarh wa-l-Ta'dil) s'en sont largement inspirés."
