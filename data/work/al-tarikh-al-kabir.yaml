summary:
  ar: "معجم البخاري (ت 256هـ) لرواة الحديث من الصحابة فمن بعدهم إلى طبقة شيوخه، مرتب على حروف المعجم مع تقديم من اسمه محمد، يجمع بين العلل والجرح والتعديل والأنساب وتاريخ الرواة. قال البخاري إنه صنفه بالمدينة عند قبر النبي في الليالي المقمرة، وإنه قلّ اسم فيه إلا وله عنده قصة لكنه كره أن يطول الكتاب، وإنه صنفه ثلاث مرات؛ ورواه عنه جماعة منهم ابن فارس الدلال ومحمد بن سهل البصري، وعليه بنى مسلم «الأسماء والكنى» وابن أبي حاتم «الجرح والتعديل» في كثير من مادته {cite:tarikh-kabir-dabbasi-v1 p. 9-22}."
  en: "Al-Bukhari's (d. 256 AH) dictionary of hadith transmitters from the Companions down to the generation of his own teachers, alphabetical with those named Muhammad placed first, combining hidden defects, criticism and vindication, genealogy and transmitters' history. Al-Bukhari said he wrote it in Medina by the Prophet's grave on moonlit nights, that hardly a name in it lacked a story he knew but he disliked lengthening the book, and that he composed it three times; several students transmitted it, among them Ibn Faris al-Dallal and Muhammad ibn Sahl al-Basri, and Muslim's al-Asma' wa-l-Kuna and Ibn Abi Hatim's al-Jarh wa-l-Ta'dil drew much of their material from it."
