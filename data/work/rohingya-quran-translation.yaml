label: { ar: "ترجمة معاني القرآن إلى لغة الروهينغا", en: "The Rohingya translation of the Qur'an", ur: "قرآن کا روہنگیا ترجمہ", es: "La traducción del Corán al idioma rohingya", fr: "La traduction du Coran en rohingya", tr: "Kur'an'ın anlamlarının Rohingya diline çevirisi", id: "Penerjemahan makna Al-Qur'an ke dalam bahasa Rohingya" }
summary:
  ar: "مشروع لترجمة معاني القرآن إلى لغة الروهينغا، المسلمين المضطهدين من إقليم أراكان في ميانمار، بدأه قطب شاه، الباحث الروهينغي في الجامعة الإسلامية العالمية بماليزيا، مع دار «دعوة كورنر» في بيتالينغ جايا؛ أُنجزت أولًا ترجمة صوتية بين أوائل 2021 وأغسطس 2023 بقراءة قطب شاه مع تلاوة محمد أيوب، ونُشرت في تطبيق وموقع ومواقع التواصل، ثم بدأت ترجمة مكتوبة بالخط الحنيفي تغطي حتى الآن السور الخمس الأولى."
  en: "A project to translate the meanings of the Qur'an into Rohingya, the language of the persecuted Muslims of Arakan in Myanmar, begun by the Rohingya scholar Qutub Shah of the International Islamic University Malaysia with Dakwah Corner Bookstore of Petaling Jaya; a spoken translation came first, made between early 2021 and August 2023 and read by Qutub Shah alongside the recitation of Muhammad Ayyub, released in an app, a website and on social media, followed by a written translation in the Hanifi script that so far covers the first five suras."
  ur: "روہنگیا زبان میں قرآن کے معانی کے ترجمے کا منصوبہ، یعنی میانمار کے اراکان کے مظلوم مسلمانوں کی زبان، جسے بین الاقوامی اسلامی یونیورسٹی ملائیشیا کے روہنگیا محقق قطب شاہ نے پیٹالنگ جایا کی دعوہ کارنر بک اسٹور کے ساتھ شروع کیا؛ پہلے صوتی ترجمہ ہوا، 2021 کے اوائل سے اگست 2023 تک، جسے قطب شاہ نے محمد ایوب کی تلاوت کے ساتھ پڑھا اور ایپ، ویب سائٹ اور سوشل میڈیا پر جاری کیا، پھر حنیفی رسم الخط میں تحریری ترجمہ شروع ہوا جو اب تک پہلی پانچ سورتوں پر مشتمل ہے۔"
  es: "Un proyecto para traducir el significado del Corán al rohingya, la lengua de los musulmanes perseguidos de Arakan en Myanmar, iniciado por el erudito rohingya Qutub Shah de la Universidad Islámica Internacional de Malasia con la librería Dakwah Corner de Petaling Jaya; primero se realizó una traducción hablada, entre principios de 2021 y agosto de 2023, leída por Qutub Shah junto con la recitación de Muhammad Ayyub, publicada en una aplicación, un sitio web y en las redes sociales, seguida de una traducción escrita en la escritura hanifi que hasta ahora abarca las primeras cinco suras."
  fr: "Un projet de traduction du Coran en rohingya, la langue des musulmans persécutés d'Arakan au Myanmar, a été lancé par Qutub Shah, érudit rohingya de l'Université islamique internationale de Malaisie, en collaboration avec la librairie Dakwah Corner de Petaling Jaya. Une traduction orale a d'abord été réalisée entre début 2021 et août 2023 et lue par Qutub Shah en même temps que la récitation de Muhammad Ayyub. Cette traduction a été diffusée sur une application, un site web et sur les réseaux sociaux. Elle a ensuite été suivie d'une traduction écrite en écriture hanifi, qui couvre pour l'instant les cinq premières sourates."
  tr: "Kur'an'ın anlamlarını Myanmar'ın Arakan bölgesinden zulme uğrayan Müslümanlar olan Rohingya diline çevirmeye yönelik bir proje, Malezya Uluslararası İslam Üniversitesi'nden Rohingya araştırmacısı Qutb Shah tarafından Petaling Jaya'daki Dawat Corner ile başlatıldı; ilk olarak 2021 başı ile Ağustos 2023 arasında Muhammed Ayyub tarafından okunan Qutb Şah'ın sesli çevirisi tamamlandı, uygulama, web sitesi ve sosyal medya platformlarında yayımlandı, ardından şimdiye kadar ilk beş sureyi kapsayan Hanifi alfabesiyle yazılı çeviriye başladı."
  id: "Sebuah proyek untuk menerjemahkan makna Al-Qur'an ke dalam bahasa Rohingya, Muslim yang dianiaya dari wilayah Arakan, Myanmar, dimulai oleh Qutb Shah, seorang peneliti Rohingya di International Islamic University Malaysia, dengan Dawat Corner di Petaling Jaya; proyek ini pertama kali menyelesaikan terjemahan audio antara awal 2021 dan Agustus 2023 dengan Qutb Shah yang dibacakan oleh Muhammad Ayyub, dipublikasikan di aplikasi, situs web, dan platform media sosial, kemudian memulai terjemahan tertulis dalam aksara Hanifi yang mencakup lima surah pertama sejauh ini."
