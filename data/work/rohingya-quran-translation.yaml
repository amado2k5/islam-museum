label: { ar: "ترجمة معاني القرآن إلى لغة الروهينغا", en: "The Rohingya translation of the Qur'an", ur: "قرآن کا روہنگیا ترجمہ" }
summary:
  ar: "مشروع لترجمة معاني القرآن إلى لغة الروهينغا، المسلمين المضطهدين من إقليم أراكان في ميانمار، بدأه قطب شاه، الباحث الروهينغي في الجامعة الإسلامية العالمية بماليزيا، مع دار «دعوة كورنر» في بيتالينغ جايا؛ أُنجزت أولًا ترجمة صوتية بين أوائل 2021 وأغسطس 2023 بقراءة قطب شاه مع تلاوة محمد أيوب، ونُشرت في تطبيق وموقع ومواقع التواصل، ثم بدأت ترجمة مكتوبة بالخط الحنيفي تغطي حتى الآن السور الخمس الأولى."
  en: "A project to translate the meanings of the Qur'an into Rohingya, the language of the persecuted Muslims of Arakan in Myanmar, begun by the Rohingya scholar Qutub Shah of the International Islamic University Malaysia with Dakwah Corner Bookstore of Petaling Jaya; a spoken translation came first, made between early 2021 and August 2023 and read by Qutub Shah alongside the recitation of Muhammad Ayyub, released in an app, a website and on social media, followed by a written translation in the Hanifi script that so far covers the first five suras."
  ur: "روہنگیا زبان میں قرآن کے معانی کے ترجمے کا منصوبہ، یعنی میانمار کے اراکان کے مظلوم مسلمانوں کی زبان، جسے بین الاقوامی اسلامی یونیورسٹی ملائیشیا کے روہنگیا محقق قطب شاہ نے پیٹالنگ جایا کی دعوہ کارنر بک اسٹور کے ساتھ شروع کیا؛ پہلے صوتی ترجمہ ہوا، 2021 کے اوائل سے اگست 2023 تک، جسے قطب شاہ نے محمد ایوب کی تلاوت کے ساتھ پڑھا اور ایپ، ویب سائٹ اور سوشل میڈیا پر جاری کیا، پھر حنیفی رسم الخط میں تحریری ترجمہ شروع ہوا جو اب تک پہلی پانچ سورتوں پر مشتمل ہے۔"
