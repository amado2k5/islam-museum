class: work
kind: lecture-series
label:
  ar: "سلوك المسلم الملتزم"
  en: "The conduct of the committed Muslim (Suluk al-Muslim al-Multazim)"
  ur: "پابند مسلمان کا طرزِ عمل ⁦(سلوک المسلم الملتزم)⁩"
summary:
  ar: "سلسلة دروس مرئية لـوجدي غنيم يحفظها أرشيف أسابيل باسم «سلوك المسلم الملتزم»، وُعِدّت حتى الآن ثلاث عشرة حلقة منها من ست وعشرين حلقة تدرجها صفحة السلسلة؛ يشرح المتحدث فيها معنى السلوك بأنه الأخلاق، والمسلم بأنه المستسلم الخاضع المنقاد لأوامر الله، والملتزم بأنه من يأخذ الإسلام منهج حياة كاملة، ثم يقسّم خلق المسلم إلى ثلاثة: شكله وكلامه وفعله — فيعالج المظهر والنظافة الشخصية، ثم أذكار اليوم والليلة وحفظ اللسان، ثم الأفعال من الأكل باليمين إلى بر الوالدين أحياء وأمواتا وحقوق الجار وأخلاقيات القيادة والطريق، ثم ينتقل إلى سلوك المسلم مع الله فيشرح الإيمان يقينا وإقرارا وعملا، وشرطي العمل الصالح الإخلاص والموافقة للشرع، ويفرق بين علم الغيب وعلم الشهادة ويبني على التصديق بما أخبر القرآن من مشاهد إيمانا بما غاب."
  en: "A video-lesson series by Wagdy Ghoneim kept in the Assabile archive under the name 'Suluk al-Muslim al-Multazim' (the conduct of the committed Muslim); thirteen of its twenty-six listed lessons have been treated so far. The lecturer explains conduct as character, the Muslim as the one who submits and yields to God's commands, and the committed Muslim as one who takes Islam as a complete way of life, then divides Muslim character into three: one's appearance, one's speech and one's deeds — treating appearance and personal cleanliness, then the day's and night's remembrances and guarding the tongue, then deeds from eating with the right hand to kindness to parents living and dead, neighbours' rights and the ethics of driving and the road, then turns to the Muslim's conduct with God: faith as certitude, utterance and deed, the two conditions of righteous work (sincerity to God and conformity with the revealed law), and the distinction between the knowledge of the seen and the knowledge of the unseen, on which he builds faith in what is unseen."
  ur: "وجدی غنیم کا ویڈیو اسباق کا سلسلہ جو اسابیل آرکائیو میں «سلوک المسلم الملتزم» کے نام سے محفوظ ہے؛ اس کی چھبیس درج اسباق میں سے اب تک تیرہ اقساط کا احاطہ کیا گیا ہے۔ خطیب سلوک کا مطلب اخلاق، مسلم کا مطلب اللہ کے احکام کے آگے جھکنے والا، اور ملتزم کا مطلب وہ شخص بیان کرتا ہے جو اسلام کو زندگی کا مکمل منہج بنائے۔ پھر وہ مسلمان کے خلق کو تین حصوں میں بانٹتا ہے: شکل، کلام اور عمل۔ پہلی قسطوں میں ظاہری حلیہ اور ذاتی پاکیزگی آتی ہے، پھر دن رات کے اذکار اور زبان کی حفاظت، پھر اعمال — دائیں ہاتھ سے کھانے سے لے کر زندہ اور فوت شدہ والدین کے حقوق، پڑوسی کے حق اور ڈرائیونگ اور سڑک کے آداب تک۔ آخر میں وہ مسلمان کے اللہ سے معاملے پر آتا ہے: ایمان بطور یقین، اقرار اور عمل، عملِ صالح کی دو شرطیں ⁦(اخلاص اور شریعت کے مطابق ہونا)⁩، اور علمِ غیب اور علمِ شہادت کا فرق جس پر وہ غیب پر ایمان کی بنیاد رکھتا ہے۔"
