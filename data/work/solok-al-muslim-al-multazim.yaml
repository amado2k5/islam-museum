label:
  ar: "سلوك المسلم الملتزم"
  en: "The conduct of the committed Muslim (Suluk al-Muslim al-Multazim)"
  ur: "پابند مسلمان کا طرزِ عمل ⁦(سلوک المسلم الملتزم)⁩"
  es: "La conducta del musulmán comprometido (Suluk al-Muslim al-Multazim)"
  fr: "La conduite du musulman engagé (Suluk al-Muslim al-Multazim)"
  tr: "Kararlı Bir Müslümanın Davranışı"
  id: "Perilaku Muslim yang Berkomitmen"
summary:
  ar: "سلسلة دروس مرئية لـوجدي غنيم يحفظها أرشيف أسابيل باسم «سلوك المسلم الملتزم»، وقد عُدّت حلقاتها الست والعشرون كلها التي تدرجها صفحة السلسلة؛ يشرح المتحدث فيها معنى السلوك بأنه الأخلاق، والمسلم بأنه المستسلم الخاضع المنقاد لأوامر الله، والملتزم بأنه من يأخذ الإسلام منهج حياة كاملة، ثم يقسّم خلق المسلم إلى ثلاثة: شكله وكلامه وفعله — فيعالج المظهر والنظافة الشخصية، ثم أذكار اليوم والليلة وحفظ اللسان، ثم الأفعال من الأكل باليمين إلى بر الوالدين أحياء وأمواتا وحقوق الجار وأخلاقيات القيادة والطريق، ثم ينتقل إلى سلوك المسلم مع الله فيشرح الإيمان يقينا وإقرارا وعملا، وشرطي العمل الصالح الإخلاص والموافقة للشرع، ويفرق بين علم الغيب وعلم الشهادة ويبني على التصديق بما أخبر القرآن من مشاهد إيمانا بما غاب. وفي النصف الثاني يفصل ما يستتبعه الإيمان بالله من أعمال القلوب — التوحيد ربوبية وألوهية، الإخلاص والحب والدعاء والذكر والدعوة والجهاد بأنواعه والصبر والتقوى والرضا والشكر والتوكل وحسن الظن والتوبة والاستغفار — ثم أركان الإيمان الستة: الملائكة خلقهم وأعمالهم في الغيب والشهادة، والكتب السماوية والقرآن نزوله وحفظه وقراءته بالتطبيق، والرسل وما يستتبعه الإيمان بالنبي من محبة ونصرة واقتداء وطاعة وصلاة عليه، والقضاء والقدر ومراتبه وأسباب الابتلاء، ويختم بالإيمان باليوم الآخر."
  en: "A video-lesson series by Wagdy Ghoneim kept in the Assabile archive under the name 'Suluk al-Muslim al-Multazim' (the conduct of the committed Muslim); all twenty-six lessons listed on the series page have now been treated. The lecturer explains conduct as character, the Muslim as the one who submits and yields to God's commands, and the committed Muslim as one who takes Islam as a complete way of life, then divides Muslim character into three: one's appearance, one's speech and one's deeds — treating appearance and personal cleanliness, then the day's and night's remembrances and guarding the tongue, then deeds from eating with the right hand to kindness to parents living and dead, neighbours' rights and the ethics of driving and the road, then turns to the Muslim's conduct with God: faith as certitude, utterance and deed, the two conditions of righteous work (sincerity to God and conformity with the revealed law), and the distinction between the knowledge of the seen and the knowledge of the unseen, on which he builds faith in what is unseen. In the second half he details the works of the heart that faith in God entails — the oneness of lordship and divinity, sincerity, love, supplication, remembrance, calling to God, striving in its kinds, patience, God-consciousness, contentment, gratitude, reliance, thinking well of God, repentance and seeking forgiveness — then the six articles of faith: the angels, their creation and works in the unseen and the seen; the revealed books and the Qur'an, its descent, preservation and reading with application; the messengers and what faith in the Prophet entails; the divine decree and determination, its ranks and the purposes of trial; and he closes with faith in the Last Day."
  ur: "وجدی غنیم کا ویڈیو اسباق کا سلسلہ جو اسابیل آرکائیو میں «سلوک المسلم الملتزم» کے نام سے محفوظ ہے؛ اس کے صفحے پر درج تمام چھبیس اسباق کا اب احاطہ کیا گیا ہے۔ خطیب سلوک کا مطلب اخلاق، مسلم کا مطلب اللہ کے احکام کے آگے جھکنے والا، اور ملتزم کا مطلب وہ شخص بیان کرتا ہے جو اسلام کو زندگی کا مکمل منہج بنائے۔ پھر وہ مسلمان کے خلق کو تین حصوں میں بانٹتا ہے: شکل، کلام اور عمل۔ پہلی قسطوں میں ظاہری حلیہ اور ذاتی پاکیزگی آتی ہے، پھر دن رات کے اذکار اور زبان کی حفاظت، پھر اعمال — دائیں ہاتھ سے کھانے سے لے کر زندہ اور فوت شدہ والدین کے حقوق، پڑوسی کے حق اور ڈرائیونگ اور سڑک کے آداب تک۔ آخر میں وہ مسلمان کے اللہ سے معاملے پر آتا ہے: ایمان بطور یقین، اقرار اور عمل، عملِ صالح کی دو شرطیں ⁦(اخلاص اور شریعت کے مطابق ہونا)⁩، اور علمِ غیب اور علمِ شہادت کا فرق جس پر وہ غیب پر ایمان کی بنیاد رکھتا ہے۔ دوسرے حصے میں وہ اللہ پر ایمان کے تقاضوں کی تفصیل کرتا ہے — ربوبیت اور الوہیت کی توحید، اخلاص، محبت، دعا، ذکر، دعوت، جہاد کی اقسام، صبر، تقویٰ، رضا، شکر، توکل، اچھا گمان، توبہ اور استغفار — پھر ایمان کے چھ ارکان: فرشتے، ان کی تخلیق اور غیب و شہادت میں ان کے کام؛ آسمانی کتابیں اور قرآن، اس کا نزول، تحفظ اور عمل کے ساتھ قراءت؛ رسول اور نبی پر ایمان کے تقاضے؛ قضا و قدر، اس کے مراتب اور آزمائش کے مقاصد؛ اور اختتام روزِ آخرت پر ایمان پر ہوتا ہے۔"
  es: "Una serie de videolecciones de Wagdy Ghoneim, conservada en el archivo de Assabile bajo el nombre de 'Suluk al-Muslim al-Multazim' (la conducta del musulmán comprometido); las veintiséis lecciones que figuran en la página de la serie ya han sido analizadas. El conferenciante explica la conducta como carácter, al musulmán como aquel que se somete y obedece los mandamientos de Dios, y al musulmán comprometido como aquel que toma el Islam como una forma de vida completa, luego divide el carácter musulmán en tres: la apariencia, el habla y las obras, tratando la apariencia y la limpieza personal, luego los recuerdos del día y de la noche y el cuidado de la lengua, luego las obras que van desde comer con la mano derecha hasta la bondad hacia los padres vivos y muertos, los derechos de los vecinos y la ética de conducir y la carretera, luego pasa a la conducta del musulmán con Dios: la fe como certeza, expresión y obra, las dos condiciones del trabajo justo (sinceridad a Dios y conformidad con la ley revelada), y la distinción entre el conocimiento de lo visible y el conocimiento de lo invisible, sobre la cual construye la fe en lo invisible. En la segunda parte, detalla las obras del corazón que implica la fe en Dios: la unidad de la soberanía y la divinidad, la sinceridad, el amor, la súplica, el recuerdo, la invocación a Dios, el esfuerzo en sus diferentes formas, la paciencia, la conciencia de Dios, la satisfacción, la gratitud, la confianza, el buen pensamiento de Dios, el arrepentimiento y la búsqueda del perdón; luego, los seis artículos de fe: los ángeles, su creación y obras en lo invisible y lo visible; los libros revelados y el Corán, su descenso, preservación y lectura con aplicación; los mensajeros y lo que implica la fe en el Profeta; el decreto y la determinación divinos, sus rangos y los propósitos de la prueba; y concluye con la fe en el Último Día."
  fr: "Une série de leçons vidéo de Wagdy Ghoneim conservée dans les archives d'Assabile sous le nom de « Suluk al-Muslim al-Multazim » (la conduite du musulman engagé); les vingt-six leçons répertoriées sur la page de la série ont maintenant toutes été traitées. Le conférencier explique que la conduite est un trait de caractère, le musulman étant celui qui se soumet aux commandements de Dieu, et le musulman engagé celui qui embrasse l'islam comme un mode de vie complet. Il divise ensuite le caractère musulman en trois aspects: l'apparence, la parole et les actes – en abordant l'apparence et la propreté personnelle, puis les prières du jour et de la nuit et la maîtrise de la langue, puis les actes, depuis le fait de manger de la main droite jusqu'à la bienveillance envers les parents vivants et morts, en passant par les droits des voisins et l'éthique de la conduite automobile. Il se tourne ensuite vers la relation du musulman avec Dieu: la foi comme certitude, parole et acte, les deux conditions d'une œuvre vertueuse (la sincérité envers Dieu et la conformité à la loi révélée), et la distinction entre la connaissance du visible et la connaissance de l'invisible, sur laquelle il fonde la foi en l'invisible. Dans la seconde partie, il détaille les œuvres du cœur qu'implique la foi en Dieu — l'unicité de la seigneurie et de la divinité, la sincérité, l'amour, la supplication, le souvenir, l'appel à Dieu, les efforts sous toutes leurs formes, la patience, la conscience de Dieu, le contentement, la gratitude, la confiance, une bonne opinion de Dieu, le repentir et la recherche du pardon — puis les six articles de foi: les anges, leur création et leurs œuvres dans l'invisible et le visible; les livres révélés et le Coran, sa révélation, sa préservation et sa lecture avec application; les messagers et ce qu'implique la foi dans le Prophète; le décret et la détermination divins, ses rangs et les buts de l'épreuve; et il conclut sur la foi au Jour dernier."
  tr: "Wajdi Ghoneim tarafından hazırlanan, Isabel arşivinde \"Kararlı Müslümanın Davranışları\" başlığıyla korunan bir dizi video ders serisi. Dizi sayfasında yer alan yirmi altı bölümün tamamı sayılır. Konuşmacı, davranışın etik olarak anlamını ve Müslüman'ın itaatkar, itaatkar ve İslam'ı tam bir yaşam biçimi olarak benimsemeye kararlı olan Tanrı'nın emirlerine itaatkar olduğunu açıklar. Sonra Müslümanın karakterini üçe ayırır: görünüş, konuşma ve eylem—görünüş ve kişisel temizlik üzerine odaklanır; ardından günlük ve gece tekrarı Anma ve dil koruma; sonra yemin ederek yemekten ebeveynleri, yaşayan ve ölüleri, komşuluk haklarını ve liderlik ve yol ahlakını onurlandırmaya kadar eylemlere geçer. Sonra Müslümanların Allah'a olan davranışına geçer; inancı kesinlik, kabul ve eylemle açıklar. Doğru eylemlerin iki koşulu samimiyet ve kanuna uyumdur. Görünmeyenin bilgisi ile tanıklık bilimi arasında ayrım yapar ve Kur'an'da anlatılan sahnelere inanç, eksik olana inanarak inanç inşa eder. İkinci yarıda, Allah'a inancın kalbin gerektirdiği eylemleri detaylandırır—tek tanrıcılık, efendilik ve ilahilik, samimiyet, sevgi, yalvarış, hatırlama, çağrı ve her türden cihat, sabır, dindarlık, tatmin, şükran ve güven, güven, iyi varsayımlar, tövbe ve af arama—sonra iman sütunları: meleklerin yaratılışı ve görünmeydeki eylemleri ve tanıklık, göksel kitaplar ve Kur'an, vahiyleri, ezberlemeleri ve pratik okumaları, elçiler ve Peygamber'e olan imanın neler gerektirdiği—sevgi, destek, taklit, itaat ve dua; karar, kader, rütbeleri ve sınavların nedenleri; ve Son Gün'e inançla sona erer."
  id: "Serangkaian pelajaran video oleh Wajdi Ghoneim, disimpan oleh arsip Isabel dengan judul \"Perilaku Muslim yang Berkomitmen.\" Semua dua puluh enam episode yang tercantum di halaman seri dihitung. Di dalamnya, pembicara menjelaskan arti perilaku sebagai etika, dan Muslim sebagai yang tunduk, tunduk, dan taat pada perintah Tuhan, berkomitmen untuk mengadopsi Islam sebagai cara hidup yang lengkap. Ia kemudian membagi karakter Muslim menjadi tiga: penampilan, ucapan, dan tindakan—membahas penampilan dan kebersihan pribadi; lalu setiap hari dan kenangan malam dan menjaga lidah; kemudian tindakan mulai dari makan dengan sumpah hingga menghormati orang tua, hidup dan mati, hak tetangga, serta etika kepemimpinan dan jalan. Kemudian ia beralih ke perilaku Muslim dengan Tuhan, menjelaskan iman dengan kepastian, pengakuan, dan tindakan. Dua syarat untuk perbuatan benar adalah ketulusan dan kepatuhan terhadap hukum. Ia membedakan antara pengetahuan tentang yang tak terlihat dan ilmu kesaksian, serta membangun kepercayaan pada adegan yang diceritakan oleh Al-Qur'an, mempercayai apa yang telah hilang. Pada paruh kedua, ia merinci tindakan hati yang dimaksud dengan iman kepada Tuhan—monoteisme, kekuasaan dan ketuhanan, ketulusan, kasih, permohonan, ingatan, panggilan, dan jihad segala jenis, kesabaran, kesalehan, kepuasan, rasa syukur, kepercayaan, kepercayaan, asumsi yang baik, pertobatan, dan pencarian pengampunan—lalu enam pilar iman: penciptaan malaikat dan perbuatan mereka di yang tak terlihat dan kesaksian, kitab surgawi dan Al-Qur'an wahyu, hafalan, dan pembacaan praktisnya, para utusan dan apa yang dimaksud dengan iman kepada Nabi—kasih, dukungan, peniruan, ketaatan, dan doa kepada-Nya; keputusan, takdir, pangkatnya, dan penyebab ujian; dan mengakhiri dengan iman pada Hari Terakhir."
