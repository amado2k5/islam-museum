summary:
  ar: "شرح ابن عبد البر الأندلسي ⁦(ت 463هـ)⁩ لموطأ مالك برواية يحيى بن يحيى، على أبواب الموطأ ونسقه، ألّفه بسؤال جماعة من أهل العلم أن يرتّب لهم «التمهيد» على أبواب الموطأ ويحذف تكرار شواهده، ويشرح فيه أقوال الصحابة والتابعين ومالك ويذكر معها مذاهب سائر فقهاء الأمصار في كل مسألة. {cite:istidhkar-qalaji-1993-v1 p.163} {cite:istidhkar-qalaji-1993-v1 p.164} {cite:istidhkar-qalaji-1993-v1 p.165}"
  en: "Ibn Abd al-Barr of al-Andalus's (d. 463 AH) commentary on Malik's Muwatta' in the transmission of Yahya ibn Yahya, following the Muwatta's chapters and order; he wrote it when scholars asked him to rearrange al-Tamhid by the Muwatta's chapters without its repeated supporting reports, and in it he explains the sayings of the Companions, the Followers and Malik, giving with each the positions of the jurists of the other regions."
  ur: "اندلس کے ابن عبد البر ⁦(م 463ھ)⁩ کی یحییٰ بن یحییٰ کی روایت والے مؤطا امام مالک کی شرح، مؤطا کے ابواب اور ترتیب پر؛ انہوں نے یہ اس وقت لکھی جب اہلِ علم نے ان سے کہا کہ «التمہید» کو مؤطا کے ابواب پر مرتب کر کے اس کے شواہد کی تکرار حذف کر دیں؛ اس میں وہ صحابہ، تابعین اور مالک کے اقوال کی شرح کرتے ہیں اور ہر مسئلے میں دوسرے شہروں کے فقہا کے مذاہب بھی ذکر کرتے ہیں۔"
  es: "El comentario de Ibn Abd al-Barr de al-Andalus (m. 463 AH) sobre el Muwatta' de Malik en la transmisión de Yahya ibn Yahya, siguiendo los capítulos y el orden del Muwatta; lo escribió cuando los eruditos le pidieron que reorganizara al-Tamhid según los capítulos del Muwatta sin sus repetidos informes de apoyo, y en él explica los dichos de los Compañeros, los Seguidores y Malik, dando con cada uno las posiciones de los juristas de las otras regiones."
  fr: "Commentaire d'Ibn Abd al-Barr d'al-Andalus (mort en 463 AH) sur le Muwatta' de Malik, tel que transmis par Yahya ibn Yahya, suivant les chapitres et l'ordre du Muwatta'; il l'écrivit lorsque des savants lui demandèrent de réorganiser al-Tamhid selon les chapitres du Muwatta' sans ses rapports de soutien répétés, et il y explique les paroles des Compagnons, des Suiveurs et de Malik, donnant pour chacun les positions des juristes des autres régions."
  tr: "İbn Abd al-Barr al-Andalusi (ö. 463 H), Malik'in Muwatta'sını Yahya ibn Yahya'nın anlatımına göre, Muwatta'nın bölümleri ve yapısına dayanarak açıklamıştır. Bir grup alimden Muwatta'nın bölümleri üzerine 'önsöz' düzenlemelerini, delillerin tekrarını kaldırmalarını, Sahabelerin, Takipçilerin ve Malik'in ifadelerini açıklamalarını ve bölgedeki diğer hukukçuların her konuda düşünce okullarını belirtmelerini isteyerek yazmıştır. {cite:istidhkar-qalaji-1993-v1 s.163} {cite:istidhkar-qalaji-1993-v1 s.164} {cite:istidhkar-qalaji-1993-v1 s.165}"
  id: "Ibn Abd al-Barr al-Andalusi (wafat 463 H) menjelaskan Muwatta karya Malik sesuai dengan narasi Yahya ibn Yahya, berdasarkan bab dan struktur Muwatta. Ia menulisnya dengan meminta sekelompok ulama untuk menyusun 'kata pengantar' untuk bab-bab Muwatta, menghilangkan pengulangan bukti-buktinya, menjelaskan pernyataan Para Sahabat, Pengikut, dan Malik, serta menyebutkan aliran pemikiran ahli hukum lain di wilayah tersebut pada setiap isu. {cite:istidhkar-qalaji-1993-v1 hlm.163} {cite:istidhkar-qalaji-1993-v1 hlm.164} {cite:istidhkar-qalaji-1993-v1 hlm.165}"
