label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن العلاج الطبي", en: "IIFA resolution on medical treatment", ur: "اکیڈمی کی قرارداد: طبی علاج", es: "Resolución de la IIFA sobre tratamiento médico" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: الأصل في التداوي أنه مشروع لما ورد في شأنه ولما فيه من حفظ النفس أحد المقاصد الكلية، وتختلف أحكامه باختلاف الأحوال والأشخاص فيكون واجبًا إذا أفضى تركه إلى تلف نفس أو عضو أو عجز عن القيام بالواجبات، ومستحبًا أو مباحًا بحسب الأحوال على ما فصّل القرار."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on medical treatment: seeking treatment is lawful in principle given what came concerning it and its place in preserving life — one of the total objectives — and its rulings differ by case and person: obligatory when leaving it leads to losing life, limb or the ability to do duties, recommended or permitted otherwise, as detailed."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ طبی علاج پر: علاج اصل میں جائز ہے کیونکہ یہ جان کی حفاظت کرتا ہے؛ صورتوں کے حساب سے واجب، مستحب یا مباح ہے۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre el tratamiento médico: buscar tratamiento es lícito en principio, dado lo que se ha dicho al respecto y su lugar en la preservación de la vida —uno de los objetivos generales— y sus resoluciones difieren según el caso y la persona: es obligatorio cuando abandonarlo conlleva la pérdida de la vida, de una extremidad o de la capacidad para realizar las obligaciones recomendadas o permitidas de otro modo, según se detalla."
