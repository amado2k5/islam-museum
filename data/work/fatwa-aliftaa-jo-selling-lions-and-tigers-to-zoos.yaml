id: work/fatwa-aliftaa-jo-selling-lions-and-tigers-to-zoos
class: work
kind: fatwa
label: { ar: "بيع الأسود والنمور لحدائق الحيوان", en: "Selling lions and tigers to zoos", ur: "شیر اور چیتے چڑیا گھروں کو بیچنا" }
summary:
  ar: "سؤال عن بيع السباع كالأسود والنمور لحدائق الحيوان لعرضها والترفيه، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج فيه بما تسمح به القوانين السارية، لأن منفعة هذه الحيوانات صارت عامة بعد أن كانت مقتصرة على الخاصة. أجابت الدائرة بأن الحيوانات تنقسم من حيث حكم بيعها بحسب إمكان النفع فيها إلى قسمين: الأول ما يُنتفع به منفعة عامة معتبرة، فيجوز بيعه واقتناؤه ولو كانت المنفعة معنوية كالأنس بألوان الطاووس أو صوت العندليب، ونقلت قول الخطيب الشربيني في مغني المحتاج إن النفع شرط في المبيع، وتمثيله بالفهد للصيد والنحل للعسل والعندليب للأنس بصوته. والقسم الثاني ما لا يُنتفع به أو يُنتفع به منفعة خاصة، فلا يجوز بيعه كالأسد والنمر والحية والعقرب، ونقلت قول زكريا الأنصاري في أسنى المطالب إن بيع ما لا نفع فيه كالأسد والذئب باطل، ولا يُنظر إلى اقتناء الملوك لبعضها للهيبة والسياسة. وقالت إن العرف إذا تغير في بعض الحيوانات فصار فيها نفع عام ممكن بعد أن لم يكن جاز بيعها بناء على أقوال الشافعية، كالحيات والعقارب التي يُنتفع اليوم بسمها في صناعة الأدوية ومستحضرات التجميل، والأسود والنمور التي تباع لحدائق الحيوان لعرضها للعامة. وخلصت إلى أنه لا حرج في بيع الأسود والنمور للحدائق العامة بما تسمح به القوانين السارية للتمتع بالنظر إليها، لأن منفعتها لم تعد مقتصرة على الخاصة بل صارت عامة."
  en: "A question about selling predators such as lions and tigers to zoos for display and recreation, in which Jordan's General Iftaa Department answered that it is unobjectionable within the laws in force, because these animals' benefit has become general after being limited to a few. The Department answered that animals fall into two groups for the ruling on selling them, according to whether they can be of benefit: the first is animals with a general, recognised benefit, which may be sold and kept even if the benefit is non-material, such as enjoying a peacock's colours or a nightingale's song; it quoted al-Khatib al-Shirbini in Mughni al-Muhtaj that benefit is a condition of a thing sold, with his examples of the cheetah for hunting, bees for honey and the nightingale for its song. The second group is animals of no benefit, or of benefit only to a few, which may not be sold, such as the lion, the tiger, the snake and the scorpion; it quoted Zakariyya al-Ansari in Asna al-Matalib that selling what has no benefit, such as a lion or a wolf, is void, and that kings keeping some of them for prestige and statecraft is not taken into account. It said that when custom changes for some animals and a general benefit becomes possible where there was none, selling them becomes permitted on the basis of Shafi'i positions, as with snakes and scorpions whose venom is now used to make medicines and cosmetics, and lions and tigers sold to zoos to be shown to the public. It concluded that selling lions and tigers to public zoos, within the laws in force, so that people may enjoy seeing them, is unobjectionable, because their benefit is no longer limited to a few but has become general."
  ur: "شیر اور چیتے جیسے درندوں کو نمائش اور تفریح کے لیے چڑیا گھروں کو بیچنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نافذ قوانین کی حدود میں اس میں حرج نہیں، کیونکہ ان جانوروں کا فائدہ چند لوگوں تک محدود رہنے کے بعد اب عام ہو گیا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ بیع کے حکم کے لحاظ سے جانور، ان سے فائدے کے امکان کے مطابق، دو قسموں میں ہیں: پہلی قسم وہ جانور جن سے عام اور معتبر فائدہ ہو، انہیں بیچنا اور رکھنا جائز ہے چاہے فائدہ غیر مادی ہو، جیسے مور کے رنگوں یا بلبل کی آواز سے لطف؛ اس نے مغنی المحتاج میں خطیب شربینی کا قول نقل کیا کہ فائدہ بیچی جانے والی چیز کی شرط ہے، اور ان کی مثالیں دیں: شکار کے لیے چیتا، شہد کے لیے مکھی اور آواز کے لیے بلبل۔ دوسری قسم وہ جانور جن سے کوئی فائدہ نہ ہو یا صرف چند لوگوں کا فائدہ ہو، انہیں بیچنا جائز نہیں، جیسے شیر، چیتا، سانپ اور بچھو؛ اس نے اسنی المطالب میں زکریا انصاری کا قول نقل کیا کہ شیر اور بھیڑیے جیسے بے فائدہ جانور کی بیع باطل ہے، اور بادشاہوں کا رعب اور سیاست کے لیے انہیں رکھنا معتبر نہیں۔ اس نے کہا کہ جب بعض جانوروں کے بارے میں عرف بدل جائے اور جہاں فائدہ نہ تھا وہاں عام فائدہ ممکن ہو جائے تو شوافع کے اقوال کی بنیاد پر ان کی بیع جائز ہو جاتی ہے، جیسے سانپ اور بچھو جن کا زہر آج دوائیں اور کاسمیٹکس بنانے میں کام آتا ہے، اور شیر اور چیتے جو عوام کو دکھانے کے لیے چڑیا گھروں کو بیچے جاتے ہیں۔ اس نے نتیجہ نکالا کہ نافذ قوانین کی حدود میں شیر اور چیتے عوامی چڑیا گھروں کو بیچنا تاکہ لوگ انہیں دیکھ کر لطف اٹھائیں، جائز ہے، کیونکہ ان کا فائدہ اب چند لوگوں تک محدود نہیں بلکہ عام ہو گیا ہے۔"
