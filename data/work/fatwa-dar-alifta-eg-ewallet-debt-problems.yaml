label: { ar: "الأحكام المترتبة عند حدوث مشكلة في سداد الديون عبر المحفظة الإلكترونية", en: "Rulings when a problem occurs repaying debts through an e-wallet", ur: "ای والٹ کے ذریعے قرض ادا کرنے میں مسئلہ آنے کے احکام", es: "Normativa aplicable cuando surge un problema al pagar deudas mediante un monedero electrónico.", fr: "Décisions en cas de problème lors du remboursement de dettes par portefeuille électronique", tr: "Elektronik Cüzdan Üzerinden Borç Ödemesinde Ortaya Çıkan Sorunlar İçin Karşılıklar", id: "Ketentuan untuk masalah yang terjadi dalam pelunasan utang melalui dompet elektronik" }
summary:
  ar: "سائل سأل عن الأحكام المترتبة على مشكلة في سداد الديون عبر المحفظة الإلكترونية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22491)⁩ أنه لا مانع شرعًا من التعامل بالمحافظ الإلكترونية الصادرة من الشركات المرخص لها من الجهات المختصة، وبيّن الجواب حكم ما يقع فيها من مشكلات السداد."
  en: "A questioner asked about the rulings arising when a problem occurs repaying a debt through an electronic wallet. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22491) answered that dealing in e-wallets issued by companies licensed by the competent authorities is lawful in the sharia, and the answer sets out the ruling on the repayment problems that can occur in them."
  ur: "ایک سائل نے ای والٹ کے ذریعے قرض کی ادائیگی میں آنے والے مسئلے کے احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22491)⁩ نے جواب دیا کہ مجاز اداروں کی اجازت شدہ کمپنیوں کے جاری کردہ ای والٹ میں لین دین شرعاً جائز ہے، اور جواب میں ان میں پیش آنے والے ادائیگی کے مسائل کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre las normas que surgen cuando se presenta un problema al pagar una deuda a través de una billetera electrónica. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22491) respondió que operar con billeteras electrónicas emitidas por empresas autorizadas por las autoridades competentes es lícito según la sharia, y la respuesta establece la normativa sobre los problemas de pago que pueden surgir con ellas."
  fr: "Un internaute a posé une question concernant les règles applicables en cas de problème de remboursement d'une dette via un portefeuille électronique. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22491) a répondu que les transactions effectuées avec les portefeuilles électroniques émis par des sociétés agréées par les autorités compétentes sont licites selon la charia, et la réponse expose les règles relatives aux problèmes de remboursement pouvant survenir."
  tr: "Bir soru soran kişi, elektronik cüzdan üzerinden borç ödemesindeki sorundan kaynaklanan kararlar hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22491), yetkili makamlarca lisanslı şirketler tarafından verilen elektronik cüzdanlarla ilgili dini bir itiraz olmadığını yanıtladı ve orada yaşanan ödeme sorunlarıyla ilgili kararı netleştirdi."
  id: "Seorang penanya menanyakan tentang putusan yang timbul dari masalah pelunasan utang melalui dompet elektronik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22491) menjawab bahwa tidak ada keberatan agama terhadap penanganan dompet elektronik yang diterbitkan oleh perusahaan yang berlisensi oleh otoritas yang berwenang, dan memperjelas putusan mengenai masalah pembayaran yang terjadi di sana."
