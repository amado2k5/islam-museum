kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 33: وفاة خديجة وأبي طالب ورحلة الإسراء ونزول سورة الروم"
  en: "The Biography of the Messenger of God 2026, episode 33: The deaths of Khadija and Abu Talib, the Night Journey and the revelation of Surat al-Rum"
  ur: "سیرتِ رسول اللہ 2026، قسط 33: خدیجہ اور ابو طالب کی وفات، اسراء کا سفر اور سورۃ الروم کا نزول"
  fr: "La biographie du Messager de Dieu 2026, épisode 33 : La mort de Khadija et d'Abu Talib, le Voyage nocturne et la révélation de la sourate al-Rum"
  es: "La biografía del Mensajero de Dios 2026, episodio 33: La muerte de Khadija y de Abu Talib, el Viaje nocturno y la revelación de la sura al-Rum"
summary:
  ar: "يختم المحاضر المرحلة المكية متتبعًا مادة ابن إسحاق في أواخر العهد المكي: سبب نزول سورة الكوثر، والمستهزئون ومصائرهم، ووفاة خديجة وأبي طالب، ورحلة الطائف، والجن في نخلة. ثم يتناول انشقاق القمر، ونبوءة الروم والفرس ومراهنة أبي بكر، ويختم بالإسراء والمعراج كما ورد في الصحيحين."
  en: "The lecturer closes the Meccan period by following Ibn Ishaq's late-Meccan material: the revelation setting of the Kawthar chapter, the mockers and their fates, the deaths of Khadija and Abu Talib, the journey to Ta'if and the jinn at Nakhla. He then treats the splitting of the moon, the Roman-Persian prophecy and Abu Bakr's wager, and ends with the Night Journey and Ascension as reported in the two Sahih collections."
  ur: "مقرر مکی دور کو ابن اسحاق کے مکی کے آخری مواد کی پیروی میں ختم کرتے ہیں: سورۃ الکوثر کا سببِ نزول، مذاق اڑانے والے اور ان کا انجام، خدیجہ اور ابو طالب کی وفات، طائف کا سفر اور نخلہ میں جن۔ پھر وہ شق القمر، رومیوں اور فارسیوں کی پیشین گوئی اور ابو بکر کی شرط پر بات کرتے ہیں، اور صحیحین میں بیان کردہ اسراء اور معراج پر ختم کرتے ہیں۔"
  fr: "Le conférencier clôt la période mecquoise en suivant la matière d'Ibn Ishaq sur la fin de l'époque mecquoise : le contexte de révélation de la sourate al-Kawthar, les moqueurs et leur sort, la mort de Khadija et d'Abu Talib, le voyage à Taïf et les djinns à Nakhla. Il traite ensuite la fente de la lune, la prophétie romano-perse et le pari d'Abu Bakr, et termine par le Voyage nocturne et l'Ascension tels que rapportés dans les deux Sahih."
  es: "El conferenciante cierra el periodo mecano siguiendo el material de Ibn Ishaq sobre el final de la época mecana: el contexto de revelación de la sura al-Kawzar, los burlones y su suerte, la muerte de Khadija y de Abu Talib, el viaje a Taif y los genios en Najla. Luego trata la división de la luna, la profecía romano-persa y la apuesta de Abu Bakr, y termina con el Viaje nocturno y la Ascensión según los dos Sahih."
