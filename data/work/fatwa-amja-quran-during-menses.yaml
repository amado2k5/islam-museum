label: { ar: "قراءة القرآن في الحيض", en: "Reading the Qur'an during menses — by heart or screen", ur: "حیض میں قرآن پڑھنا — زبانی یا اسکرین", es: "Leer el Corán durante la menstruación: de memoria o en pantalla." }
summary:
  ar: "سألت امرأة هل يجوز قراءة القرآن في فترة الحيض غيبًا أو عن الكمبيوتر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81415 بتاريخ 5 مايو 2010)⁩ أنه لا حرج في قراءة القرآن غيبًا دون مس المصحف أثناء الحيض أو النفاس لأن الحيض والنفاس بيد الله وقد يطول أمده فتتضرر المرأة بهجرها لقراءة القرآن في هذه المدة، وقد صدر قرار عن مجمع فقهاء الشريعة بأمريكا في إحدى دوراته بجواز ذلك على ما فصّل الجواب."
  en: "A woman asked whether the Qur'an may be read during menses — from memory or off a computer. Dr. Salah al-Sawi (fatwa no. 81415, 5 May 2010) answered that there is no harm in reading the Qur'an from memory without touching the mushaf during menses or postpartum, both being in God's hand and possibly long, the woman suffering if she forsook reading through that span; the Assembly of Muslim Jurists of America issued a resolution at one of its sessions permitting it — as the answer details."
  ur: "حیض میں قرآن پڑھنا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81415، 5 مئی 2010)⁩ کے مطابق بغیر مصحف چھوئے زبانی پڑھنا جائز ہے — مجمع کا قرار بھی اسی پر ہے۔"
  es: "Una mujer preguntó si se puede leer el Corán durante la menstruación, ya sea de memoria o desde una computadora. El Dr. Salah al-Sawi (fatwa n.° 81415, 5 de mayo de 2010) respondió que no hay inconveniente en leer el Corán de memoria sin tocar el mushaf durante la menstruación o el posparto, ya que ambos periodos están en manos de Dios y pueden ser prolongados, y la mujer sufriría si dejara de leer durante ese tiempo; la Asamblea de Juristas Musulmanes de América emitió una resolución en una de sus sesiones que lo permite, como se detalla en la respuesta."
