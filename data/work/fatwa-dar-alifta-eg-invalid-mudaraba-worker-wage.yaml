id: work/fatwa-dar-alifta-eg-invalid-mudaraba-worker-wage
class: work
kind: fatwa
label: { ar: "حكم استحقاق العامل للأجرة في المضاربة الفاسدة", en: "The worker's right to a wage in a void mudaraba", ur: "فاسد مضاربت میں کارکن کی اجرت کا استحقاق", es: "El derecho del trabajador a un salario en un caso de mudaraba vacía", fr: "Le droit du travailleur à un salaire dans une mudaraba nulle", tr: "Yolsuz spekülasyonda işçinin ücret alma hakkına ilişkin karar", id: "Putusan tentang hak pekerja atas upah dalam spekulasi korupsi" }
summary:
  ar: "رجل دفع لآخر مبلغًا ليستثمره على أن يكون له مقابل كل مبلغ مائة جنيه كل مدة فسأل عن حكم المعاملة وأجرة العامل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21845)⁩ ببيان حكم هذه المعاملة وما يستحقه العامل فيها على وجهه."
  en: "A man paid another a sum to invest on condition of a fixed hundred pounds per period in return, and asked the ruling on the arrangement and the worker's wage. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21845) answered by setting out the ruling on this arrangement and what the worker is entitled to."
  ur: "ایک شخص نے دوسرے کو رقم دی کہ سرمایہ کاری کرے اور اس کے بدلے ہر مدت میں سو جنیے مقرر کیے گئے؛ اس نے معاملے اور کارکن کی اجرت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21845)⁩ نے جواب میں اس معاملے کا حکم اور کارکن کا استحقاق بیان کیا۔"
  es: "Un hombre pagó a otro una suma para invertirla a cambio de cien libras esterlinas fijas por período, y solicitó la opinión legal sobre el acuerdo y el salario del trabajador. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21845) respondió estableciendo la norma sobre este acuerdo y los derechos del trabajador."
  fr: "Un homme a versé une somme à un autre pour qu'il l'investisse, à condition de recevoir en retour un revenu fixe de cent livres égyptiennes par période. Il a ensuite demandé l'avis juridique concernant cet arrangement et la rémunération du travailleur. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21845) a répondu en énonçant la jurisprudence relative à cet arrangement et aux droits du travailleur."
  tr: "Bir adam, her bir miktar için yüz pound alacağı şartıyla başka bir kişiye yatırım için bir miktar ödedi, bu yüzden işlemle ilgili kararı ve işçinin ücretini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21845) bu işlemle ilgili kararı ve işçinin hak ettiği hakkı netleştirdi."
  id: "Seorang pria membayar sejumlah uang kepada orang lain untuk diinvestasikan, dengan syarat ia menerima seratus pound untuk setiap jumlah, sehingga ia menanyakan tentang keputusan transaksi dan upah pekerja. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21845) menanggapi dengan memperjelas keputusan transaksi ini dan hak yang seharusnya diberikan oleh pekerja."
