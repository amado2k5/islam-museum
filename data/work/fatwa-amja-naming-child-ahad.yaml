id: work/fatwa-amja-naming-child-ahad
class: work
kind: fatwa
label: { ar: "تسمية الطفل باسم من أسماء الله", en: "Naming a child with one of God's names", ur: "بچے کا نام اللہ کے ناموں میں سے رکھنا", es: "Ponerle a un niño uno de los nombres de Dios", fr: "Donner à un enfant un nom de Dieu", tr: "Bir çocuğa Allah'ın isimlerinden biriyle isim vermek", id: "Menamai anak dengan salah satu nama Allah" }
summary:
  ar: "سأل سائل عن حكم تسمية الطفل باسم من أسماء الله الحسنى مثل أحد وهل يلزم تغيير الاسم إن ثبت التحريم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81904 بتاريخ 19 يوليو 2010)⁩ أنه لا يجوز التسمية باسم من أسماء الله مما اختص الله به نفسه كالرحمن أو الخالق، وقد غير النبي ما وقع من التسمية بذلك فغير الجبار إلى عبد الجبار وغير الحكم إلى عبد الله، وفي القرآن قوله هل تعلم له سميًا أي لا مثيل له يستحق مثل اسمه."
  en: "A questioner asked the ruling on naming a child with one of God's beautiful names such as Ahad, and whether a forbidden name must be changed. Dr. Salah al-Sawi (fatwa no. 81904, 19 July 2010) answered that naming with a name God kept for Himself — like al-Rahman or al-Khaliq — is not permissible; the Prophet changed such names when they occurred, turning al-Jabbar into Abd al-Jabbar and al-Hakam into Abdullah, and in the Quran stands 'do you know of any namesake for Him' — no equal deserving such a name. Recorded as AMJA's answer."
  ur: "ایک سائل نے بچے کا نام احد جیسے اللہ کے خاص نام رکھنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81904، 19 جولائی 2010)⁩ کے مطابق اللہ کے مخصوص ناموں سے تسمیہ جائز نہیں؛ نبی نے ایسے نام بدلوائے جیسے جبار سے عبدالجبار۔"
  es: "Un consultante preguntó sobre la norma relativa a nombrar a un niño con uno de los hermosos nombres de Dios, como Ahad, y si un nombre prohibido debe cambiarse. El Dr. Salah al-Sawi (fatwa n.º 81904, 19 de julio de 2010) respondió que nombrar a un niño con un nombre que Dios se reservó para sí mismo, como al-Rahman o al-Khaliq, no está permitido; el Profeta cambió tales nombres cuando surgieron, transformando al-Jabbar en Abd al-Jabbar y al-Hakam en Abdullah, y en el Corán se encuentra la pregunta: \"¿Conoces a alguien que le ponga ese nombre?\", es decir, nadie que merezca tal nombre. Registrada como respuesta de AMJA."
  fr: "Une personne a demandé si la question portait sur la permission de nommer un enfant avec un beau nom divin tel qu'Ahad, et si un nom interdit devait être changé. Le Dr Salah al-Sawi (fatwa n° 81904, 19 juillet 2010) a répondu qu'il n'est pas permis de nommer un enfant avec un nom que Dieu s'est réservé — comme al-Rahman ou al-Khaliq —. Le Prophète a changé de tels noms lorsqu'ils apparaissaient, transformant al-Jabbar en Abd al-Jabbar et al-Hakam en Abdullah. Le Coran dit: « Connaissez-vous quelqu'un qui Lui porte un nom semblable ? » — nul n'étant digne d'un tel nom. Cette réponse a été consignée dans la fatwa de l'AMJA."
  tr: "Bir soru soran kişiye, Allah'ın güzel isimlerinden biri olan Uhud gibi bir çocuğa isim verilmesine ilişkin karar ve yasak olduğu tespit edilirse ismin değiştirilip değiştirilmediği soruldu. Dr. Salah Al-Sawy (19 Temmuz 2010 tarihli 81904 No. Fetva) Allah'ın kendisinin seçtiği bir isimin, örneğin Merhametli ya da Yaratıcı gibi bir isimin adlandırılmasının caiz olmadığını yanıtladı. Peygamber isimlendirmeyi bu şekilde değiştirdi, Zorlayıcıyı Abdülcebər, hikmeti Abdullah olarak değiştirdi. Kur'an'da şöyle der: O'nun adını biliyor musun? Yani, O'nun adı gibi bir isme layık bir eşi yoktur."
  id: "Seorang penanya ditanya tentang aturan yang menyebutkan nama anak dengan salah satu nama indah Allah, seperti Uhud, dan apakah perlu mengubah nama jika dianggap terlarang. Dr. Salah Al-Sawy menjawab (Fatwa No. 81904 tanggal 19 Juli 2010) bahwa tidak diperbolehkan menamai nama dari Allah yang telah dipilih Allah, seperti Yang Maha Penyayang atau Pencipta. Nabi mengubah nama menjadi itu, mengubah Pembawa Kuasa menjadi Abd al-Jabbar dan kebijaksanaan menjadi Abdullah. Dalam Al-Qur'an tertulis: Apakah kamu tahu nama untuk-Nya? Artinya, tidak ada yang setara dengan Dia yang layak mendapatkan nama seperti nama-Nya."
