id: work/ahmed-el-sayed-seerah-lilmuslihin-ep12
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 12: رحلة الطائف والإسراء والمعراج"
  en: "The Prophetic Biography for Reformers, episode 12: The journey to al-Ta'if, the Night Journey and the Ascension"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 12: طائف کا سفر، اسراء اور معراج"
  fr: "La biographie prophétique pour les réformateurs, épisode 12 : Le voyage à al-Ta'if, le Voyage nocturne et l'Ascension"
  es: "La biografía profética para los reformadores, episodio 12: El viaje a al-Ta'if, el Viaje nocturno y la Ascensión"
summary:
  ar: "يتناول المجلس الثاني عشر من سلسلة السيرة النبوية للمصلحين ما أعقب وفاة أبي طالب وخديجة: توجه النبي إلى الطائف ورفض أهلها له، ولماذا عدّ ذلك اليوم أشد أيام حياته، وملك الجبال ورجاؤه في ذرية خصومه، والجن الذين استمعوا إلى القرآن، وعودته إلى مكة في جوار المطعم بن عدي. ويستخلص المحاضر دروسا في الحكمة عند التعامل مع غير المسلمين، ثم يعرض عرضا موجزا للإسراء والمعراج وموقف قريش ومكانة الصلاة."
  en: "The twelfth session of the series on the Prophetic biography for reformers covers what followed the deaths of Abu Talib and Khadija: the Prophet's journey to al-Ta'if and its rejection, why he counted that day the hardest of his life, the angel of the mountains and his hope for the descendants of his enemies, the jinn who listened to the Qur'an, and his return to Mecca under the protection of Mut'im ibn Adi. The speaker draws lessons on wisdom in dealing with non-Muslims, then gives a short account of the Night Journey and the Ascension, Quraysh's reaction and the place of prayer."
  ur: "السیرۃ النبویۃ للمصلحین سلسلے کی بارہویں نشست ابو طالب اور خدیجہ کی وفات کے بعد کے واقعات بیان کرتی ہے: نبی کا طائف جانا اور وہاں کے لوگوں کا انکار، اس دن کو ان کی زندگی کا سخت ترین دن کیوں شمار کیا گیا، پہاڑوں کا فرشتہ اور دشمنوں کی نسلوں سے ان کی امید، قرآن سننے والے جنات، اور مطعم بن عدی کی پناہ میں مکہ واپسی۔ مقرر غیر مسلموں سے معاملہ کرنے میں حکمت کے اسباق نکالتے ہیں، پھر اسراء اور معراج، قریش کے ردعمل اور نماز کے مقام کا مختصر بیان کرتے ہیں۔"
  fr: "La douzième séance de la série sur la biographie prophétique pour les réformateurs traite de ce qui suivit la mort d'Abu Talib et de Khadija : le départ du Prophète pour al-Ta'if et le refus de ses habitants, la raison pour laquelle il tint ce jour pour le plus dur de sa vie, l'ange des montagnes et son espoir pour les descendants de ses ennemis, les djinns qui écoutèrent le Coran, et son retour à La Mecque sous la protection de Mut'im ibn Adi. Le conférencier tire des leçons de sagesse dans les relations avec les non-musulmans, puis donne un bref récit du Voyage nocturne et de l'Ascension, de la réaction de Quraych et de la place de la prière."
  es: "La duodécima sesión de la serie sobre la biografía profética para reformadores trata de lo que siguió a la muerte de Abu Talib y de Khadija: la marcha del Profeta a al-Ta'if y el rechazo de sus habitantes, por qué consideró ese día el más duro de su vida, el ángel de las montañas y su esperanza en los descendientes de sus enemigos, los genios que escucharon el Corán y su regreso a La Meca bajo la protección de Mut'im ibn Adi. El conferenciante extrae lecciones de sabiduría en el trato con los no musulmanes y después ofrece un breve relato del Viaje nocturno y la Ascensión, de la reacción de Quraysh y del lugar de la oración."
