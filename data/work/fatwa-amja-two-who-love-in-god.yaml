id: work/fatwa-amja-two-who-love-in-god
class: work
kind: fatwa
label: { ar: "رجلان تحابا في الله", en: "Two who loved each other in God — one of the seven shaded", ur: "اللہ میں محبت کرنے والے دو — سایہ کے سات میں سے" }
summary:
  ar: "سأل سائل عن تفصيل معنى رجلان تحابا في الله اجتمعا عليه وتفرقا عليه من السبعة الذين يظلهم الله في ظله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77594 بتاريخ 27 يناير 2009)⁩ أن معناه أن بينهما جرت محبة لكنها محبة في الله لا في مال ولا جاه ولا نسب بل هي محبة لله رآه قائمًا بطاعة الله متجنبًا لمحارمه فأحبه من أجل ذلك فهذا هو الذي يدخل في الحديث، وقوله اجتمعا عليه وتفرقا عليه يعني اجتمعا عليه في الدنيا وبقيت المحبة بينهما حتى فرق بينهما الموت فتفرقا وهما على ذلك، وفي هذا إشارة إلى أن المتحابين في الله لا يقطع محبتهم شيء من عوارض الدنيا."
  en: "A questioner asked for the meaning of 'two men who loved each other in God, gathering upon it and parting upon it' among the seven God shades in His shade. Dr. Salah al-Sawi (fatwa no. 77594, 27 January 2009) answered that a love ran between them — a love in God, not in money, standing or lineage: he saw him keeping God's obedience and shunning His prohibitions and loved him for it; and 'they gathered upon it and parted upon it' means they met upon it in this world and the love held until death parted them still upon it — a sign that those who love each other in God let no worldly accident cut their love."
  ur: "ایک سائل نے «دو جو اللہ میں محبت کرتے تھے» کی شرح پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77594، 27 جنوری 2009)⁩ کے مطابق یہ محبت مال جاہ نسب کی نہیں بلکہ اللہ کی طاعت پر ہے — موت تک قائم رہنے والی محبت۔"
