id: work/fatwa-amja-two-who-love-in-god
class: work
kind: fatwa
label: { ar: "رجلان تحابا في الله", en: "Two who loved each other in God — one of the seven shaded", ur: "اللہ میں محبت کرنے والے دو — سایہ کے سات میں سے", es: "Dos que se amaban en Dios — uno de los siete sombreados", fr: "Deux personnes qui s'aimaient en Dieu — l'une des sept ombres", tr: "Tanrı için birbirini seven iki adam", id: "Dua pria yang saling mencintai demi Tuhan" }
summary:
  ar: "سأل سائل عن تفصيل معنى رجلان تحابا في الله اجتمعا عليه وتفرقا عليه من السبعة الذين يظلهم الله في ظله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77594 بتاريخ 27 يناير 2009)⁩ أن معناه أن بينهما جرت محبة لكنها محبة في الله لا في مال ولا جاه ولا نسب بل هي محبة لله رآه قائمًا بطاعة الله متجنبًا لمحارمه فأحبه من أجل ذلك فهذا هو الذي يدخل في الحديث، وقوله اجتمعا عليه وتفرقا عليه يعني اجتمعا عليه في الدنيا وبقيت المحبة بينهما حتى فرق بينهما الموت فتفرقا وهما على ذلك، وفي هذا إشارة إلى أن المتحابين في الله لا يقطع محبتهم شيء من عوارض الدنيا."
  en: "A questioner asked for the meaning of 'two men who loved each other in God, gathering upon it and parting upon it' among the seven God shades in His shade. Dr. Salah al-Sawi (fatwa no. 77594, 27 January 2009) answered that a love ran between them — a love in God, not in money, standing or lineage: he saw him keeping God's obedience and shunning His prohibitions and loved him for it; and 'they gathered upon it and parted upon it' means they met upon it in this world and the love held until death parted them still upon it — a sign that those who love each other in God let no worldly accident cut their love."
  ur: "ایک سائل نے «دو جو اللہ میں محبت کرتے تھے» کی شرح پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77594، 27 جنوری 2009)⁩ کے مطابق یہ محبت مال جاہ نسب کی نہیں بلکہ اللہ کی طاعت پر ہے — موت تک قائم رہنے والی محبت۔"
  es: "Un consultante preguntó por el significado de \"dos hombres que se amaban en Dios, reuniéndose en Él y separándose en Él\" entre las siete sombras de Dios en Su sombra. El Dr. Salah al-Sawi (fatwa n.° 77594, 27 de enero de 2009) respondió que entre ellos existía un amor, un amor en Dios, no en el dinero, la posición social o el linaje: lo vio obedeciendo a Dios y evitando Sus prohibiciones, y lo amó por ello; y \"se reunían en Él y se separaban en Él\" significa que se encontraron en Él en este mundo y el amor perduró hasta que la muerte los separó, aún en Él, una señal de que aquellos que se aman en Dios no permiten que ningún accidente mundano rompa su amor."
  fr: "Un internaute a demandé la signification de l'expression « deux hommes qui s'aimaient en Dieu, se retrouvant et se séparant en Lui » parmi les sept ombres divines. Le Dr Salah al-Sawi (fatwa n° 77594, 27 janvier 2009) a répondu qu'un amour les unissait – un amour en Dieu, non fondé sur l'argent, le statut social ou la lignée: il l'a vu obéir à Dieu et se détourner de Ses interdits, et l'a aimé pour cela; et « se sont retrouvés et se sont séparés en Lui » signifie qu'ils se sont rencontrés en Lui dans ce monde et que leur amour a perduré jusqu'à ce que la mort les sépare, toujours en Lui – signe que ceux qui s'aiment en Dieu ne laissent aucun accident terrestre altérer leur amour."
  tr: "Bir soru soran, Allah uğruna birbirini seven ve etrafında toplanıp Allah'ın gölgesi altında gördüğü yedi kişiden ayrılan iki adamın ayrıntılı anlamı hakkında soru soruldu. Dr. Salah Al-Sawy (27 Ocak 2009 tarihli 77594 sayılı fetva) bunun aralarında sevgi var olduğunu, ancak bu sevginin zenginlik, statü veya soy değil, Allah'a olan sevgi olduğunu söyledi. Onu Allah'a itaat ederken, O'nun yasaklarından kaçınırken gördü ve bu yüzden O'nu sevdi. Bu hadiste yer alır. 'Onlar onun üzerinde birleştiler ve ayrıldılar' demesi, bu dünyada onun için toplandıklarını ve sevginin ölüm onları ayırana kadar aralarında kaldığını ve bu temelde ayrıldıklarını gösterir. Bu, Allah uğruna birbirini sevenlerin bu dünyanın sonuçlarından O'na olan sevgilerini bırakmadıklarını gösterir."
  id: "Seorang penanya ditanya tentang makna rinci dua pria yang saling mencintai demi Allah dan berkumpul di sekelilingnya serta terpisah dari tujuh orang yang Allah bayangkan di bawah naung-Nya. Dr. Salah Al-Sawy menjawab (Fatwa No. 77594 tanggal 27 Januari 2009) bahwa itu berarti cinta ada di antara mereka, tetapi cinta kepada Allah, bukan dalam harta, status, atau garis keturunan, melainkan cinta kepada Allah. Dia melihat Tuhan berdiri dalam taat kepada Allah, menghindari larangan-Nya, sehingga dia mencintainya karena alasan itu. Inilah yang tercantum dalam hadits tersebut. Perkataannya 'mereka bersatu atas Dia dan berpisah darinya' berarti mereka berkumpul untuknya di dunia ini, dan cinta itu tetap ada di antara mereka sampai maut memisahkan mereka, sehingga mereka berpisah berdasarkan hal itu. Ini menunjukkan bahwa mereka yang saling mencintai demi Allah tidak pernah melepaskan cinta mereka kepada-Nya dari segala konsekuensi dunia ini."
