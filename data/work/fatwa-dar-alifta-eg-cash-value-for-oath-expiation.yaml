id: work/fatwa-dar-alifta-eg-cash-value-for-oath-expiation
class: work
kind: fatwa
label: { ar: "حكم إخراج القيمة في كفارة اليمين", en: "Paying the monetary value in oath expiation", ur: "کفارۂ یمین میں نقدی کی ادائیگی", es: "Pagar el valor monetario en expiación del juramento", fr: "Payer la valeur monétaire en expiation de serment" }
summary:
  ar: "سائل سأل عن إخراج القيمة في كفارة اليمين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22053)⁩ أنه يجوز لمن حنث في يمينه أن يكفر عنها بدفع القيمة نقدًا للفقراء بدلًا عن الإطعام أو الكسوة وهو الأقرب إلى تحقيق مصلحتهم، على ما فصّل الجواب."
  en: "A questioner asked about paying the monetary value in oath expiation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22053) answered that whoever breaks his oath may expiate by paying the value in cash to the poor instead of feeding or clothing them — indeed it is nearer to their benefit — as the answer details."
  ur: "ایک سائل نے کفارۂ یمین میں نقدی ادا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22053)⁩ نے جواب دیا کہ قسم توڑنے والا کھانا یا کپڑے کے بجائے غریبوں کو نقدی دے کر کفارہ ادا کر سکتا ہے بلکہ یہ ان کے مفاد کے قریب تر ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de pagar el valor monetario como expiación del juramento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22053) respondió que quien incumple su juramento puede expiarlo pagando el valor en efectivo a los pobres en lugar de alimentarlos o vestirlos; de hecho, esto les beneficia más, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le versement de la somme due en guise d'expiation pour rupture de serment. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22053) a répondu que quiconque manque à son serment peut expier sa faute en versant cette somme aux pauvres plutôt que de les nourrir ou de les vêtir – cela étant en effet plus avantageux pour eux –, comme le précise la réponse."
