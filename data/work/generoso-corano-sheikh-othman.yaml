label: { ar: "القرآن الكريم بالإيطالية ⁦(الشيخ عثمان)⁩", en: "Generoso Corano (Sheikh Othman)", ur: "جنیروسو کورانو ⁦(شیخ عثمان)⁩", es: "Generoso Corano (Jeque Othman)", fr: "Generoso Corano (Cheikh Othman)" }
summary:
  ar: "ترجمة إيطالية لمعاني القرآن وضعها الشيخ عثمان من المركز الثقافي الإسلامي في مدينة فوندي، أتمّها في 19 سبتمبر 2015 وصدرت طبعتها الأولى في تلك السنة، ثم طبعة ثانية سنة 2020 عن جمعية نقل رسالة الإسلام في الإسكندرية تُوزّع مجانًا؛ بالإيطالية الحديثة على رواية حفص، قريبة من الحرفية مع حواشٍ قليلة، تذكر الأسماء العربية بين قوسين، وتحاكي صفحات المصحف في عددها وعلاماته؛ وأثار خطاب منسوب إلى الأزهر في آخرها تساؤلات عند المراجع."
  en: "An Italian rendering of the meanings of the Qur'an by Sheikh Othman of the Islamic Cultural Center of Fondi, completed on 19 September 2015 and first published that year, with a second edition in 2020 by the Conveying Islamic Message Society of Alexandria distributed free; in modern Italian on the Hafs reading, close to literal with a few footnotes, giving Arabic names in parentheses and mirroring the mushaf's 604 pages and markings; a letter attributed to al-Azhar printed at its end raised questions for the reviewer."
  ur: "قرآن کے معانی کا اطالوی ترجمہ از شیخ عثمان، فوندی کے اسلامی ثقافتی مرکز سے وابستہ، جو 19 ستمبر 2015 کو مکمل ہوا اور اسی سال پہلی بار چھپا، اور 2020 میں اسکندریہ کی کانویئنگ اسلامک میسج سوسائٹی نے دوسری اشاعت مفت تقسیم کے لیے شائع کی؛ روایتِ حفص پر جدید اطالوی میں، تقریباً لفظی، چند حواشی کے ساتھ، عربی نام قوسین میں، اور مصحف کے 604 صفحات اور علامات کی پیروی؛ آخر میں ازہر سے منسوب ایک خط نے مبصر کے لیے سوالات اٹھائے۔"
  es: "Una traducción al italiano de los significados del Corán realizada por el jeque Othman del Centro Cultural Islámico de Fondi, completada el 19 de septiembre de 2015 y publicada por primera vez ese mismo año, con una segunda edición en 2020 distribuida gratuitamente por la Sociedad para la Transmisión del Mensaje Islámico de Alejandría; en italiano moderno, con la lectura de Hafs, casi literal, con algunas notas a pie de página, que incluye nombres árabes entre paréntesis y reproduce las 604 páginas y marcas del mushaf; una carta atribuida a al-Azhar impresa al final planteó dudas al reseñador."
  fr: "Une traduction italienne des significations du Coran par le cheikh Othman du Centre culturel islamique de Fondi, achevée le 19 septembre 2015 et publiée pour la première fois la même année, avec une seconde édition en 2020 par la Société de transmission du message islamique d'Alexandrie, distribuée gratuitement; en italien moderne, basée sur la lecture de Hafs, proche du sens littéral avec quelques notes de bas de page, donnant les noms arabes entre parenthèses et reprenant les 604 pages et les marques du mushaf; une lettre attribuée à al-Azhar, imprimée à la fin, a soulevé des questions pour le critique."
