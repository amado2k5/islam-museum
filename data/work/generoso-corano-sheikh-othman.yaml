summary:
  ar: "ترجمة إيطالية لمعاني القرآن وضعها الشيخ عثمان من المركز الثقافي الإسلامي في مدينة فوندي، أتمّها في 19 سبتمبر 2015 وصدرت طبعتها الأولى في تلك السنة، ثم طبعة ثانية سنة 2020 عن جمعية نقل رسالة الإسلام في الإسكندرية تُوزّع مجانًا؛ بالإيطالية الحديثة على رواية حفص، قريبة من الحرفية مع حواشٍ قليلة، تذكر الأسماء العربية بين قوسين، وتحاكي صفحات المصحف في عددها وعلاماته؛ وأثار خطاب منسوب إلى الأزهر في آخرها تساؤلات عند المراجع."
  en: "An Italian rendering of the meanings of the Qur'an by Sheikh Othman of the Islamic Cultural Center of Fondi, completed on 19 September 2015 and first published that year, with a second edition in 2020 by the Conveying Islamic Message Society of Alexandria distributed free; in modern Italian on the Hafs reading, close to literal with a few footnotes, giving Arabic names in parentheses and mirroring the mushaf's 604 pages and markings; a letter attributed to al-Azhar printed at its end raised questions for the reviewer."
  ur: "قرآن کے معانی کا اطالوی ترجمہ از شیخ عثمان، فوندی کے اسلامی ثقافتی مرکز سے وابستہ، جو 19 ستمبر 2015 کو مکمل ہوا اور اسی سال پہلی بار چھپا، اور 2020 میں اسکندریہ کی کانویئنگ اسلامک میسج سوسائٹی نے دوسری اشاعت مفت تقسیم کے لیے شائع کی؛ روایتِ حفص پر جدید اطالوی میں، تقریباً لفظی، چند حواشی کے ساتھ، عربی نام قوسین میں، اور مصحف کے 604 صفحات اور علامات کی پیروی؛ آخر میں ازہر سے منسوب ایک خط نے مبصر کے لیے سوالات اٹھائے۔"
