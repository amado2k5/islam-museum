label: { ar: "قرار مجمع الفقه الإسلامي الدولي 190 (20/5) بشأن دور المجامع الفقهية في ترشيد مسيرة المؤسسات المالية الإسلامية: آليات وصيغ", en: "IIFA resolution 190 (20/5) on the role of fiqh academies in disciplining the course of Islamic financial institutions: mechanisms and forms", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 190 (20/5): اسلامی مالی اداروں کی سمت راہ میں فقہی مجامع کا کردار — ذرائع اور صورتیں" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. أكد المجمع أن المجامع الفقهية والمؤسسات المالية والمصارف الإسلامية من المنجزات العظيمة في العصر الحاضر، وثمّن ما تقوم به هيئات الرقابة الشرعية والمؤسسات المالية الإسلامية من دور بارز في إحياء نظام المالية الإسلامية المعاصرة وتعزيز الثقة بها. ورأى: ضرورة التعاون بين هيئات الرقابة في المؤسسات المالية الإسلامية والمجامع الفقهية للتنسيق وتبادل الآراء؛ وضرورة التنسيق بين هيئات الرقابة الشرعية فيما بينها؛ وأن يهيئ المجمع الدراسات المفيدة لترسيخ دور المؤسسات المالية الإسلامية في تطبيق الشريعة وإيجاد الحلول المناسبة للمشكلات والأزمات؛ وأن يعد قانوناً شاملاً في المعاملات المالية الإسلامية يكون نبراساً فيها؛ وأذكّر بما ورد في قراره 188 ⁦(20/3)⁩ من أن قرارات المجمع تسري من حين صدورها ولا تؤثر على ما سبقها من عقود صدرت باجتهاد أو فتوى معتبرة. وأوصى: بمواصلة الحوار مع البنوك المركزية والجهات الإشرافية في الدول الإسلامية لتمكين المؤسسات المالية الإسلامية من أداء دورها في الحياة الاقتصادية والتنمية الوطنية ضمن قواعد الرقابة بما يلائم خصوصية العمل المالي الإسلامي؛ وإبلاغ قرارات المجمع إلى جميع المؤسسات المالية والمصارف الإسلامية والمؤسسات العلمية والتعليمية ومراكز البحث والدراسات المحلية والعالمية وتعميمها بوسائل الإعلام ومواقع التواصل الاجتماعي؛ ودعوة المؤسسات المالية الإسلامية إلى الأخذ بقرارات المجامع الفقهية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). It affirmed that the fiqh academies and the Islamic financial institutions and banks are among the great achievements of the present age, and valued the prominent role of sharia supervisory boards and Islamic financial institutions in reviving the contemporary Islamic finance system and strengthening confidence in it. It held: the necessity of cooperation between the supervisory boards in Islamic financial institutions and the fiqh academies for coordination and exchange of views; the necessity of coordination among the sharia supervisory boards themselves; that the Academy prepare useful studies to entrench the institutions' role in applying the sharia and finding suitable solutions to problems and crises; that it draft a comprehensive law of Islamic financial transactions to serve as a beacon; and a reminder of resolution 188 (20/3) that Academy resolutions apply from issuance and do not affect earlier contracts made on recognised ijtihad or fatwa. It recommended: continuing dialogue with central banks and supervisory bodies in Islamic states to enable Islamic financial institutions to play their role in economic life and national development under supervision rules suited to Islamic financial work; conveying Academy resolutions to all Islamic financial institutions and banks, scholarly and educational bodies, and local and international research centres, circulating them through media and social networks; and calling on Islamic financial institutions to act by the academies' resolutions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس نے تاکید کی کہ فقہی مجامع اور اسلامی مالی ادارے و بینک موجودہ دور کی عظیم کامیابیوں میں ہیں، اور شرعی نگرانی بورڈوں اور اسلامی مالی اداروں کے اس نمایاں کردار کی قدر کی جو وہ عصری اسلامی مالیاتی نظام کے احیاء اور اس پر اعتماد کے مضبوط کرنے میں ادا کر رہے ہیں۔ اس کی رائے: اسلامی مالی اداروں کے نگرانی بورڈوں اور فقہی مجامع کے درمیان رابطہ اور تبادلۂ خیال کے لیے تعاون کی ضرورت؛ شرعی نگرانی بورڈوں کا باہمی رابطہ بھی ضروری؛ اکیڈمی مفید تحقیقات تیار کرے جو اداروں کی شریعت کے اطلاق میں کردار کو مضبوط کریں اور مسائل و بحرانوں کے موزوں حل نکالیں؛ اسلامی مالی معاملات کا جامع قانون بنائے جو اس میدان میں مشعلِ راہ ہو؛ اور قرارداد 188 ⁦(20/3)⁩ کی یاد دہانی کہ اکیڈمی کی قراردادیں جاری ہونے سے لاگو ہوتی ہیں اور سابقہ عقود کو متاثر نہیں کرتیں جو معتبر اجتہاد یا فتویٰ سے ہوئے۔ سفارشات: اسلامی ممالک کے مرکزی بینکوں اور نگران اداروں سے مسلسل مکالمہ تاکہ اسلامی مالی ادارے معاشی زندگی اور قومی ترقی میں اپنا کردار ادا کریں اسلامی مالیاتی کام کی خصوصیت کے مطابق نگرانی کے قواعد کے تابع؛ اکیڈمی کی قراردادیں تمام اسلامی مالی اداروں، بینکوں، علمی و تعلیمی اداروں اور مقامی و عالمی تحقیقی مراکز تک پہنچانا اور میڈیا و سوشل نیٹ ورکس سے عام کرنا؛ اور اسلامی مالی اداروں سے مجامع کی قراردادوں پر عمل کی دعوت۔"
