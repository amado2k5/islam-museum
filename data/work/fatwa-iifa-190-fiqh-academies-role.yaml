label: { ar: "قرار مجمع الفقه الإسلامي الدولي 190 (20/5) بشأن دور المجامع الفقهية في ترشيد مسيرة المؤسسات المالية الإسلامية: آليات وصيغ", en: "IIFA resolution 190 (20/5) on the role of fiqh academies in disciplining the course of Islamic financial institutions: mechanisms and forms", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 190 (20/5): اسلامی مالی اداروں کی سمت راہ میں فقہی مجامع کا کردار — ذرائع اور صورتیں", es: "Resolución 190 (20/5) de la IIFA sobre el papel de las academias de fiqh en la disciplina del curso de las instituciones financieras islámicas: mecanismos y formas.", fr: "Résolution 190 (20/5) de l'IIFA sur le rôle des académies de fiqh dans la discipline des institutions financières islamiques: mécanismes et formes", tr: "Uluslararası İslami Fiqh Akademisi Kararı 190 (20/5), İslami finans kurumlarının ilerlemesini yönlendirmede fıkıh akademilerinin rolü: Mekanizmalar ve formüller", id: "Resolusi Akademi Fiqh Islam Internasional 190 (20/5) mengenai peran akademi yurisprudensi dalam membimbing kemajuan lembaga keuangan Islam: Mekanisme dan rumus" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. أكد المجمع أن المجامع الفقهية والمؤسسات المالية والمصارف الإسلامية من المنجزات العظيمة في العصر الحاضر، وثمّن ما تقوم به هيئات الرقابة الشرعية والمؤسسات المالية الإسلامية من دور بارز في إحياء نظام المالية الإسلامية المعاصرة وتعزيز الثقة بها. ورأى: ضرورة التعاون بين هيئات الرقابة في المؤسسات المالية الإسلامية والمجامع الفقهية للتنسيق وتبادل الآراء؛ وضرورة التنسيق بين هيئات الرقابة الشرعية فيما بينها؛ وأن يهيئ المجمع الدراسات المفيدة لترسيخ دور المؤسسات المالية الإسلامية في تطبيق الشريعة وإيجاد الحلول المناسبة للمشكلات والأزمات؛ وأن يعد قانوناً شاملاً في المعاملات المالية الإسلامية يكون نبراساً فيها؛ وأذكّر بما ورد في قراره 188 ⁦(20/3)⁩ من أن قرارات المجمع تسري من حين صدورها ولا تؤثر على ما سبقها من عقود صدرت باجتهاد أو فتوى معتبرة. وأوصى: بمواصلة الحوار مع البنوك المركزية والجهات الإشرافية في الدول الإسلامية لتمكين المؤسسات المالية الإسلامية من أداء دورها في الحياة الاقتصادية والتنمية الوطنية ضمن قواعد الرقابة بما يلائم خصوصية العمل المالي الإسلامي؛ وإبلاغ قرارات المجمع إلى جميع المؤسسات المالية والمصارف الإسلامية والمؤسسات العلمية والتعليمية ومراكز البحث والدراسات المحلية والعالمية وتعميمها بوسائل الإعلام ومواقع التواصل الاجتماعي؛ ودعوة المؤسسات المالية الإسلامية إلى الأخذ بقرارات المجامع الفقهية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). It affirmed that the fiqh academies and the Islamic financial institutions and banks are among the great achievements of the present age, and valued the prominent role of sharia supervisory boards and Islamic financial institutions in reviving the contemporary Islamic finance system and strengthening confidence in it. It held: the necessity of cooperation between the supervisory boards in Islamic financial institutions and the fiqh academies for coordination and exchange of views; the necessity of coordination among the sharia supervisory boards themselves; that the Academy prepare useful studies to entrench the institutions' role in applying the sharia and finding suitable solutions to problems and crises; that it draft a comprehensive law of Islamic financial transactions to serve as a beacon; and a reminder of resolution 188 (20/3) that Academy resolutions apply from issuance and do not affect earlier contracts made on recognised ijtihad or fatwa. It recommended: continuing dialogue with central banks and supervisory bodies in Islamic states to enable Islamic financial institutions to play their role in economic life and national development under supervision rules suited to Islamic financial work; conveying Academy resolutions to all Islamic financial institutions and banks, scholarly and educational bodies, and local and international research centres, circulating them through media and social networks; and calling on Islamic financial institutions to act by the academies' resolutions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس نے تاکید کی کہ فقہی مجامع اور اسلامی مالی ادارے و بینک موجودہ دور کی عظیم کامیابیوں میں ہیں، اور شرعی نگرانی بورڈوں اور اسلامی مالی اداروں کے اس نمایاں کردار کی قدر کی جو وہ عصری اسلامی مالیاتی نظام کے احیاء اور اس پر اعتماد کے مضبوط کرنے میں ادا کر رہے ہیں۔ اس کی رائے: اسلامی مالی اداروں کے نگرانی بورڈوں اور فقہی مجامع کے درمیان رابطہ اور تبادلۂ خیال کے لیے تعاون کی ضرورت؛ شرعی نگرانی بورڈوں کا باہمی رابطہ بھی ضروری؛ اکیڈمی مفید تحقیقات تیار کرے جو اداروں کی شریعت کے اطلاق میں کردار کو مضبوط کریں اور مسائل و بحرانوں کے موزوں حل نکالیں؛ اسلامی مالی معاملات کا جامع قانون بنائے جو اس میدان میں مشعلِ راہ ہو؛ اور قرارداد 188 ⁦(20/3)⁩ کی یاد دہانی کہ اکیڈمی کی قراردادیں جاری ہونے سے لاگو ہوتی ہیں اور سابقہ عقود کو متاثر نہیں کرتیں جو معتبر اجتہاد یا فتویٰ سے ہوئے۔ سفارشات: اسلامی ممالک کے مرکزی بینکوں اور نگران اداروں سے مسلسل مکالمہ تاکہ اسلامی مالی ادارے معاشی زندگی اور قومی ترقی میں اپنا کردار ادا کریں اسلامی مالیاتی کام کی خصوصیت کے مطابق نگرانی کے قواعد کے تابع؛ اکیڈمی کی قراردادیں تمام اسلامی مالی اداروں، بینکوں، علمی و تعلیمی اداروں اور مقامی و عالمی تحقیقی مراکز تک پہنچانا اور میڈیا و سوشل نیٹ ورکس سے عام کرنا؛ اور اسلامی مالی اداروں سے مجامع کی قراردادوں پر عمل کی دعوت۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 20.ª sesión en Orán (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 de septiembre de 2012). Afirmó que las academias de fiqh y las instituciones y bancos financieros islámicos se encuentran entre los grandes logros de la era actual, y valoró el papel destacado de los consejos de supervisión de la sharia y las instituciones financieras islámicas en la revitalización del sistema financiero islámico contemporáneo y el fortalecimiento de la confianza en él. Sostuvo: la necesidad de cooperación entre los consejos de supervisión en las instituciones financieras islámicas y las academias de fiqh para la coordinación e intercambio de puntos de vista; la necesidad de coordinación entre los propios consejos de supervisión de la sharia; que la Academia prepare estudios útiles para afianzar el papel de las instituciones en la aplicación de la sharia y la búsqueda de soluciones adecuadas a los problemas y crisis; que elabore una ley integral de transacciones financieras islámicas para servir de guía; y un recordatorio de la resolución 188 (20/3) que establece que las resoluciones de la Academia se aplican desde su emisión y no afectan los contratos anteriores celebrados sobre la base de ijtihad o fatwa reconocidas. Se recomendó: continuar el diálogo con los bancos centrales y los organismos de supervisión de los estados islámicos para permitir que las instituciones financieras islámicas desempeñen su papel en la vida económica y el desarrollo nacional bajo normas de supervisión adecuadas para el trabajo financiero islámico; transmitir las resoluciones de la Academia a todas las instituciones financieras y bancos islámicos, organismos académicos y educativos, y centros de investigación locales e internacionales, difundiéndolas a través de los medios de comunicación y las redes sociales; e instar a las instituciones financieras islámicas a actuar de acuerdo con las resoluciones de las academias."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, soit du 13 au 18 septembre 2012). Elle a affirmé que les académies de jurisprudence islamique et les institutions financières islamiques comptent parmi les grandes réalisations de notre époque et a salué le rôle prépondérant des conseils de surveillance de la charia et des institutions financières islamiques dans la revitalisation du système financier islamique contemporain et le renforcement de la confiance en celui-ci. Elle a statué sur: la nécessité d'une coopération entre les conseils de surveillance des institutions financières islamiques et les académies de jurisprudence islamique pour la coordination et l'échange de vues; la nécessité d'une coordination entre les conseils de surveillance de la charia eux-mêmes; la nécessité pour l'Académie de réaliser des études utiles pour consolider le rôle des institutions dans l'application de la charia et la recherche de solutions appropriées aux problèmes et aux crises; la nécessité d'élaborer une loi exhaustive sur les transactions financières islamiques servant de référence; et le rappel de la résolution 188 (20/3) selon laquelle les résolutions de l'Académie s'appliquent dès leur publication et ne portent pas atteinte aux contrats antérieurs conclus sur la base d'un ijtihad ou d'une fatwa reconnus. Elle a recommandé: de poursuivre le dialogue avec les banques centrales et les organes de supervision des États islamiques afin de permettre aux institutions financières islamiques de jouer leur rôle dans la vie économique et le développement national dans le cadre de règles de supervision adaptées au travail financier islamique; de transmettre les résolutions de l'Académie à toutes les institutions financières et banques islamiques, aux organismes universitaires et éducatifs, ainsi qu'aux centres de recherche locaux et internationaux, en les diffusant par le biais des médias et des réseaux sociaux; et d'appeler les institutions financières islamiques à agir conformément aux résolutions des académies."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Şevval – 2 Dhu al-Qi'dah 1433 H, 13–18 Eylül 2012) toplu kararı almıştır. Akademi, fıkıh akademilerinin, finans kurumlarının ve İslami bankaların günümüzün büyük başarıları olduğunu teyit etmiş ve Şeriat denetim organları ile İslami finans kurumlarının çağdaş İslami finans sistemini canlandırmada ve ona olan güveni artırmada oynadığı önemli rolü takdir etmiştir. İslami finans kurumlarındaki denetim organları ile hukuk kurulları arasında koordinasyon ve görüş alışverişi için iş birliğinin gerekliliğini; Şeriat denetim organları arasında koordinasyonun gerekliliğini; İslami finans kurumlarının Şeriat'ın uygulanmasında ve sorunlara ve krizlere uygun çözümler bulmadaki rolünü pekiştirmek için faydalı çalışmaların hazırlanmasının gerekliliğini; ve bu işlemler için yol gösterici bir ışık teşkil eden kapsamlı bir İslami finansal işlemler yasasının hazırlanmasının gerekliliğini gördü; ve 188 (20/3) sayılı kararında belirtildiğini, konsey kararlarının çıkarıldığı andan itibaren geçerli olduğunu ve geçerli ijtihad veya fetva ile verilen önceki sözleşmeleri etkilemediğini hatırlatıyorum. Şunları önerdi: İslami finansal kurumların İslami finansal çalışmaların özgünlüğüne uygun düzenleyici çerçeveler içinde ekonomik yaşam ve ulusal kalkınmadaki rollerini yerine getirebilmeleri için İslami ülkelerdeki merkez bankaları ve denetim otoriteleriyle diyalogun sürdürülmesini; Akademinin kararlarının tüm finansal kurumlara, İslami bankalara, bilimsel ve eğitim kurumlarına ve yerel ile uluslararası araştırma ve çalışma merkezlerine iletilmesi ve bunların medya ve sosyal medya platformları aracılığıyla yayılması; ve İslami finansal kurumların fıkıh kurullarının kararlarını kabul etmeleri çağrısında bulunulması."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012). Akademi menegaskan bahwa akademi kehakiman, lembaga keuangan, dan bank Islam merupakan pencapaian besar di era saat ini, serta menghargai peran penting badan pengawas Syariah dan lembaga keuangan Islam dalam menghidupkan kembali sistem keuangan Islam kontemporer dan meningkatkan kepercayaan terhadapnya. Ia melihat perlunya kerja sama antara badan pengawas di lembaga keuangan Islam dan dewan yurisprudensi untuk koordinasi dan pertukaran pandangan; perlunya koordinasi di antara badan pengawas Syariah; perlunya menyiapkan studi yang berguna untuk mengkonsolidasikan peran lembaga keuangan Islam dalam menerapkan Syariah dan menemukan solusi yang tepat atas masalah dan krisis; serta menyiapkan undang-undang komprehensif dalam transaksi keuangan Islam yang menjadi cahaya panduan bagi mereka; dan saya mengingat apa yang dinyatakan dalam keputusan 188 (20/3) bahwa keputusan dewan berlaku sejak saat penerbitan dan tidak mempengaruhi kontrak sebelumnya yang dikeluarkan oleh ijtihad atau fatwa yang sah. Ia merekomendasikan: melanjutkan dialog dengan bank sentral dan otoritas pengawas di negara-negara Islam agar lembaga keuangan Islam dapat menjalankan peran mereka dalam kehidupan ekonomi dan pembangunan nasional dalam kerangka regulasi yang sesuai dengan kekhususan pekerjaan keuangan Islam; mengkomunikasikan keputusan Akademi kepada semua lembaga keuangan, bank Islam, lembaga ilmiah dan pendidikan, serta pusat penelitian dan studi lokal dan internasional, serta menyebarkannya melalui media dan platform media sosial; dan menyerukan kepada lembaga keuangan Islam untuk mengadopsi keputusan dewan yurisprudensi."
