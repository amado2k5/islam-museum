label: { ar: "المغني عن حمل الأسفار في الأسفار في تخريج ما في الإحياء من الأخبار", en: "al-Mughni 'an Haml al-Asfar fi al-Asfar", ur: "المغنی عن حمل الاسفار فی الاسفار" }
summary:
  ar: "مختصر الحافظ زين الدين العراقي في تخريج أحاديث إحياء علوم الدين: يذكر طرف الحديث وصحابيه ومخرّجه ودرجته؛ أكمل مسودته سنة 751 وأتم تبييض المختصر يوم الاثنين 12 ربيع الأول 790، ويُطبع في حواشي الإحياء أو بذيله {cite:ihya-shamela-dar-al-marifa p. 4} {cite:ihya-shamela-dar-al-marifa p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 712}."
  en: "Zayn al-Din al-Iraqi's abridged tracing of the hadith of the Ihya': for each report it gives the opening words, the Companion, the source and the grade; he completed the draft in 751 and finished the fair copy of the abridgement on Monday 12 Rabi' al-Awwal 790; it is printed in the margins or beneath the text of the Ihya' {cite:ihya-shamela-dar-al-marifa p. 4} {cite:ihya-shamela-dar-al-marifa p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 712}."
  ur: "حافظ زین الدین عراقی کی احیاء کی احادیث کی مختصر تخریج: ہر روایت کا ابتدائی حصہ، صحابی، مخرج اور درجہ؛ مسودہ 751 میں مکمل ہوا اور مختصر کی صاف نقل پیر 12 ربیع الاول 790 کو پوری ہوئی؛ یہ احیاء کے حواشی یا نیچے چھپتی ہے {cite:ihya-shamela-dar-al-marifa p. 4} {cite:ihya-shamela-dar-al-marifa p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 712}۔"
