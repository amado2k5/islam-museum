label: { ar: "البقاء على رواسب من الجاهلية ⁦(سؤال عن الوشم والحلي عند المسلمين الجدد)⁩", en: "Remaining remnants of jahiliyya ⁦(tattoos and jewellery on new Muslims)⁩", ur: "جاہلیت کی باقیات ⁦(نومسلموں پر وشم اور زیور)⁩" }
summary:
  ar: "سائل سأل عن المسلمين والمسلمات الجدد الذين تبقى بهم بقايا من الجاهلية كالوشم، هل يلزمهم إزالتها، وعن خواتم وأساور وأقراط في مواضع مختلفة من الجسم هل يتعين رفعها. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21820 بتاريخ 14 أكتوبر 2012)⁩ أن الوشم محرم في الشريعة وينبغي إزالته لمن قدر بغير مفسدة ولا مضرة، فإن تعذر فهو في دائرة العفو ورفع الحرج لأن الله لا يكلف نفسًا إلا وسعها والإسلام يجب ما قبله؛ وأن التحلي بالذهب مشروع للنساء بالمعروف بلا تشبه، ومحرم على الرجال إلا خاتم الفضة، وما وراء ذلك على أصل المنع إلا لحاجة."
  en: "A questioner asked about new Muslims who retain remnants of jahiliyya such as tattoos — must they remove them — and about rings, bracelets and earrings on different parts of the body. The Assembly of Muslim Jurists of America (fatwa no. 21820, 14 October 2012) answered that tattooing is prohibited in the sharia and should be removed by whoever can without harm or damage, and where impossible it falls under pardon and the lifting of hardship, since God charges no soul beyond its capacity and Islam effaces what came before; that women's wearing of gold is lawful within the customary and without imitation, while men are forbidden gold except a silver ring, and anything beyond that remains under the original prohibition unless need calls."
  ur: "ایک سائل نے نومسلم مردوں و خواتین کے بارے میں پوچھا جن میں جاہلیت کی باقیات جیسے وشم باقی ہوں — کیا انہیں دور کرنا لازم ہے — اور جسم کے مختلف حصوں میں انگوٹھیاں، کڑے اور بالیاں۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21820، 14 اکتوبر 2012)⁩ نے جواب دیا کہ وشم شریعت میں حرام ہے اور جسے بغیر مفسدہ اور ضرر کے اتارنا ممکن ہو اسے اتارنا چاہیے؛ ناممکن ہو تو یہ عفو اور حرج کے رفع کی دائرے میں ہے، کیونکہ اللہ کسی جان پر اس کی وسعت سے زیادہ نہیں لادتا اور اسلام گزشتہ کو مٹا دیتا ہے؛ سونے کا زیور خواتین کے لیے دستور کے مطابق اور مشابہت کے بغیر جائز، مردوں پر حرام سوائے چاندی کی انگوٹھی کے، اور اس سے آگے اصل منع ہی ہے سوائے ضرورت کے۔"
