label: { ar: "البقاء على رواسب من الجاهلية ⁦(سؤال عن الوشم والحلي عند المسلمين الجدد)⁩", en: "Remaining remnants of jahiliyya ⁦(tattoos and jewellery on new Muslims)⁩", ur: "جاہلیت کی باقیات ⁦(نومسلموں پر وشم اور زیور)⁩", es: "Restos de la época preislámica (tatuajes y joyas en los nuevos musulmanes)", fr: "Vestiges de la jahiliyya (tatouages et bijoux chez les nouveaux musulmans)", tr: "Cehalet Çağının Mirasında Kalmak (Yeni Müslümanlar Arasında Dövme ve Takı Hakkında Bir Soru)", id: "Tetap Mengenai Warisan Zaman Kebodohan (Pertanyaan tentang Tato dan Perhiasan di Antara Muslim Baru)" }
summary:
  ar: "سائل سأل عن المسلمين والمسلمات الجدد الذين تبقى بهم بقايا من الجاهلية كالوشم، هل يلزمهم إزالتها، وعن خواتم وأساور وأقراط في مواضع مختلفة من الجسم هل يتعين رفعها. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21820 بتاريخ 14 أكتوبر 2012)⁩ أن الوشم محرم في الشريعة وينبغي إزالته لمن قدر بغير مفسدة ولا مضرة، فإن تعذر فهو في دائرة العفو ورفع الحرج لأن الله لا يكلف نفسًا إلا وسعها والإسلام يجب ما قبله؛ وأن التحلي بالذهب مشروع للنساء بالمعروف بلا تشبه، ومحرم على الرجال إلا خاتم الفضة، وما وراء ذلك على أصل المنع إلا لحاجة."
  en: "A questioner asked about new Muslims who retain remnants of jahiliyya such as tattoos — must they remove them — and about rings, bracelets and earrings on different parts of the body. The Assembly of Muslim Jurists of America (fatwa no. 21820, 14 October 2012) answered that tattooing is prohibited in the sharia and should be removed by whoever can without harm or damage, and where impossible it falls under pardon and the lifting of hardship, since God charges no soul beyond its capacity and Islam effaces what came before; that women's wearing of gold is lawful within the customary and without imitation, while men are forbidden gold except a silver ring, and anything beyond that remains under the original prohibition unless need calls."
  ur: "ایک سائل نے نومسلم مردوں و خواتین کے بارے میں پوچھا جن میں جاہلیت کی باقیات جیسے وشم باقی ہوں — کیا انہیں دور کرنا لازم ہے — اور جسم کے مختلف حصوں میں انگوٹھیاں، کڑے اور بالیاں۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21820، 14 اکتوبر 2012)⁩ نے جواب دیا کہ وشم شریعت میں حرام ہے اور جسے بغیر مفسدہ اور ضرر کے اتارنا ممکن ہو اسے اتارنا چاہیے؛ ناممکن ہو تو یہ عفو اور حرج کے رفع کی دائرے میں ہے، کیونکہ اللہ کسی جان پر اس کی وسعت سے زیادہ نہیں لادتا اور اسلام گزشتہ کو مٹا دیتا ہے؛ سونے کا زیور خواتین کے لیے دستور کے مطابق اور مشابہت کے بغیر جائز، مردوں پر حرام سوائے چاندی کی انگوٹھی کے، اور اس سے آگے اصل منع ہی ہے سوائے ضرورت کے۔"
  es: "Un interlocutor preguntó acerca de los nuevos musulmanes que conservan vestigios de la época preislámica, como los tatuajes —si deben eliminarlos— y sobre los anillos, pulseras y pendientes en diferentes partes del cuerpo. La Asamblea de Juristas Musulmanes de América (fatwa n.º 21820, 14 de octubre de 2012) respondió que los tatuajes están prohibidos en la sharia y deben ser eliminados por quien pueda sin causar daño alguno, y cuando sea imposible, se considera perdón y alivio de la dificultad, ya que Dios no impone a nadie más de lo que puede y el Islam borra lo anterior; que el uso de oro por parte de las mujeres es lícito dentro de la costumbre y sin imitación, mientras que a los hombres se les prohíbe el oro excepto un anillo de plata, y cualquier otra cosa permanece bajo la prohibición original a menos que la necesidad lo justifique."
  fr: "Un internaute a posé une question concernant les nouveaux musulmans qui conservent des vestiges de la jahiliyya, tels que des tatouages: doivent-ils les faire enlever ? Il a également interrogé l’Assemblée des juristes musulmans d’Amérique (fatwa n° 21820, 14 octobre 2012) sur l’obligation de faire enlever les tatouages, ainsi que sur le port de bagues, bracelets et boucles d’oreilles sur différentes parties du corps. L’Assemblée a répondu que le tatouage est interdit par la charia et que quiconque le peut doit le faire enlever sans dommage ni préjudice. Lorsque cela s’avère impossible, il est permis de pardonner et la peine est levée, car Dieu n’exige de personne au-delà de ses capacités et l’islam efface le passé. L’Assemblée a également précisé que le port d’or par les femmes est licite dans le respect des coutumes et sans imitation, tandis que le port d’or est interdit aux hommes, à l’exception d’une bague en argent. Tout autre objet reste soumis à l’interdiction originelle, sauf nécessité absolue."
  tr: "Bir soru soran, İslam öncesi dönemden kalan kalıntıları olan yeni Müslüman erkek ve kadınlar hakkında sordu; dövmelerin çıkarılması gerekip gerekmediğini, vücudun farklı bölgelerindeki yüzük, bilezik ve küpeleri çıkarıp çıkarmaması gerektiğini sordu. Amerikan Şeriat Âlimleri Konseyi (Fetva No. 21820, 14 Ekim 2012), dövmelerin Şeriat'ta yasak olduğunu ve zarar vermeden yaptırabilenler için çıkarılması gerektiğini yanıtladı. Eğer mümkün değilse, affetme ve zorlukların giderilmesi kapsamına girer, çünkü Allah bir ruhu kapasitesinin ötesinde yüklemez ve İslam öncesini zorunlu kılar; kadınlar için taklit olmadan iyi bir şekilde altınla süslenmek, erkekler için ise gümüş yüzük dışında yasaktır ve ardından gelen şey zorunluluk dışında orijinal yasaktır."
  id: "Seorang penanya menanyakan tentang pria dan wanita Muslim baru yang masih memiliki sisa-sisa era pra-Islam, seperti tato, apakah mereka harus melepasnya, dan tentang cincin, gelang, dan anting di bagian tubuh yang berbeda—apakah harus dilepas. Dewan Ulama Syariah Amerika (Fatwa No. 21820 tanggal 14 Oktober 2012) menjawab bahwa tato dilarang dalam Syariah dan harus dihapus bagi mereka yang mampu melakukannya tanpa cedera atau bahaya. Jika tidak memungkinkan, maka itu termasuk dalam lingkup pengampunan dan penghapusan kesulitan, karena Allah tidak membebani jiwa melebihi kapasitasnya, dan Islam mewajibkan apa yang mendahuluinya; menghias diri dengan emas diwajibkan untuk wanita dengan cara yang baik tanpa tiruan, dan dilarang bagi pria kecuali cincin perak, dan berikut adalah larangan asli kecuali karena kebutuhan."
