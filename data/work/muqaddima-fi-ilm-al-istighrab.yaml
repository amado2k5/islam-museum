summary:
  ar: "كتاب لحسن حنفي يدعو فيه إلى دراسة الغرب موضوعاً للمعرفة، ضمن مشروعه «التراث والتجديد»، صدر عن الدار الفنية للنشر والتوزيع؛ وتختلف المصادر في سنة طبعته الأولى."
  en: "A book by Hassan Hanafi calling for the West to be studied as an object of knowledge, part of his Heritage and Renewal project, published by al-Dar al-Fanniyya; sources disagree on the year of its first edition."
  ur: "حسن حنفی کی کتاب جو مغرب کو علم کا موضوع بنا کر مطالعہ کرنے کی دعوت دیتی ہے؛ یہ ان کے منصوبے «التراث والتجدید» کا حصہ ہے اور الدار الفنیہ سے شائع ہوئی؛ اس کے پہلے ایڈیشن کے سال پر مآخذ متفق نہیں۔"
  es: "Un libro de Hassan Hanafi que aboga por que Occidente sea estudiado como objeto de conocimiento, parte de su proyecto Patrimonio y Renovación, publicado por al-Dar al-Fanniyya; las fuentes discrepan sobre el año de su primera edición."
  fr: "Un livre d'Hassan Hanafi appelant à étudier l'Occident comme un objet de connaissance, faisant partie de son projet Héritage et Renouveau, publié par al-Dar al-Fanniyya; les sources divergent quant à l'année de sa première édition."
  tr: "Lahcen Hanafi'nin 'Miras ve Yenilenme' projesi kapsamında, Sanatsal Yayıncılık ve Dağıtım Evi tarafından yayımlanan bir kitap; kaynaklar ilk baskı yılına göre değişiklik göstermektedir."
  id: "Sebuah buku karya Lahcen Hanafi di mana ia menyerukan studi tentang Barat sebagai subjek pengetahuan, dalam proyeknya 'Heritage and Renewal,' yang diterbitkan oleh Artistic Publishing and Distribution House; sumber-sumbernya bervariasi pada tahun edisi pertamanya."
