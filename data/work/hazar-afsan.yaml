label: { ar: "هزار أفسان", en: "Hazar Afsan" }
summary:
  ar: "كتاب هزار أفسان ومعناه ألف خرافة، أول كتاب عمل في معنى الأسمار عند ابن النديم: أن ملكا من ملوك الفرس كان إذا تزوج امرأة وبات معها ليلة قتلها من الغد فتزوج جارية من أولاد الملوك يقال لها شهرزاد فابتدأت تخرفه وتصل الحديث عند انقضاء الليل ما يحمل الملك على استبقائها ويسألها في الليلة الثانية عن تمام الحديث إلى أن أبى عليها ألف ليلة وهو يطؤها إلى أن رزقت منه ولدا أظهرته وأوقفته على حيلتها فاستعقلها ومال إليها واستبقاها، وكان للملك قهرمانة يقال لها دينارزاد موافقة لها، وقيل إن الكتاب ألف لحمانى ابنة بهمن، وقال ابن النديم والصحيح أن أول من سمر بالليل الإسكندر وكان له قوم يضحكونه ويخرفونه لا يريد اللذة وإنما كان يريد الحفظ والحرس واستعمل لذلك بعده الملوك كتاب هزار أفسان ويحتوي على ألف ليلة ودون المائتي سمر، وقال قد رأيته بتمامه دفعات وهو بالحقيقة كتاب غث بارد الحديث {cite:fihrist-ibn-al-nadim p. 422-423}."
  en: "The Persian 'Thousand Tales' — the frame-story of Shahrazad spinning cliffhangers for a thousand nights; Ibn al-Nadim saw it complete and judged it coarse {cite:fihrist-ibn-al-nadim p. 422-423}."
