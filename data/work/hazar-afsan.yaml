summary:
  ar: "كتاب هزار أفسان ومعناه ألف خرافة، أول كتاب عمل في معنى الأسمار عند ابن النديم: أن ملكا من ملوك الفرس كان إذا تزوج امرأة وبات معها ليلة قتلها من الغد فتزوج جارية من أولاد الملوك يقال لها شهرزاد فابتدأت تخرفه وتصل الحديث عند انقضاء الليل ما يحمل الملك على استبقائها ويسألها في الليلة الثانية عن تمام الحديث إلى أن أبى عليها ألف ليلة وهو يطؤها إلى أن رزقت منه ولدا أظهرته وأوقفته على حيلتها فاستعقلها ومال إليها واستبقاها، وكان للملك قهرمانة يقال لها دينارزاد موافقة لها، وقيل إن الكتاب ألف لحمانى ابنة بهمن، وقال ابن النديم والصحيح أن أول من سمر بالليل الإسكندر وكان له قوم يضحكونه ويخرفونه لا يريد اللذة وإنما كان يريد الحفظ والحرس واستعمل لذلك بعده الملوك كتاب هزار أفسان ويحتوي على ألف ليلة ودون المائتي سمر، وقال قد رأيته بتمامه دفعات وهو بالحقيقة كتاب غث بارد الحديث {cite:fihrist-ibn-al-nadim p. 422-423}."
  en: "The Persian 'Thousand Tales' — the frame-story of Shahrazad spinning cliffhangers for a thousand nights; Ibn al-Nadim saw it complete and judged it coarse {cite:fihrist-ibn-al-nadim p. 422-423}."
  es: "Los 'Mil Cuentos' persas —la historia marco de Shahrazad que teje momentos de suspenso durante mil noches; Ibn al-Nadim la vio completa y la juzgó tosca {cite:fihrist-ibn-al-nadim p. 422-423}."
  fr: "Les « Mille Contes » persans — l'histoire-cadre de Shahrazad tissant des suspenses pendant mille nuits; Ibn al-Nadim l'a vue complète et l'a jugée grossière {cite:fihrist-ibn-al-nadim p. 422-423}."
  ur: "فارسی 'ہزار کہانیاں' - شہرزاد کی ایک ہزار راتوں تک گھماؤ پھرنے کی فریم کہانی؛ ابن الندیم نے اسے مکمل دیکھا اور اسے موٹا فیصلہ کیا 422-423}۔"
  tr: "'Hazar Afsan' kitabı, 'Bin Efsane' anlamına gelir ve İbn el-Nadim'e göre 'asmar' anlamını inceleyen ilk kitaptır: Pers krallarından bir kral, bir kadınla evlenip onu öldürmeden önceki gece onunla kaldığında, kralın oğullarından olan Şehrazat adında bir köle kızla evlenmiştir. Kadın onun narsisizmini anlatmaya başlar ve konuşma gecenin sonuna kadar gelir, bu da kralın onu hayatta tutmasına yol açar ve ikinci gece ona hikayenin tamamlanmasını sorar, ta ki onunla evlenmeyi reddedene kadar, ta ki onun oğlunu gösterip kurnazlığını durdurana kadar bin gece boyunca onunla evlenmeyi reddedene kadar Kitaba doğru eğildi ve ondan önce yürüdü. Kralın Dinarzad adında bir kahramanı vardı ve onunla aynı fikirdeydi. Kitabın Bahman'ın kızı Hamani için yazıldığı söylenir. İbn el-Nadim şöyle demiştir ki, doğru görüş şudur ki, gece geç saatlere kadar ilk uyanık kalan İskender olmuştur; onun insanları zevk aramak değil, ezberlemek ve korumakla gülüp baştan çıkarırdı. Onun ardından krallar, bin gece ve iki yüz geceden az olan 'Hazar Afsan' kitabını kullandılar. O şöyle dedi: Tamamen, aslında soğuk ve hadis kitabı {atı:Fihrist-ibn-al-Nadim s. 422-423}"
  id: "Buku 'Hazar Afsan,' yang berarti 'Seribu Mitos,' adalah buku pertama yang membahas makna 'asmar' menurut Ibn al-Nadim: bahwa seorang raja dari raja-raja Persia, ketika menikahi seorang wanita dan menginap bersamanya malam sebelum membunuhnya, menikahi seorang gadis budak dari putra-putra raja bernama Scheherazade. Dia mulai menceritakan narsisisme Hazar itu, dan percakapan sampai akhir malam, yang membuat raja menjaga Hazar tetap hidup, dan pada malam kedua dia menanyakan tentang penyelesaian cerita itu, sampai dia menolak menikahinya selama seribu malam selama berinteraksi dengannya sampai dia memiliki seorang putra darinya, yang ditunjukkan dan dicegahnya dari kecerdikannya, sehingga dia menerimanya kembali Ia condong ke arah itu dan mendahuluinya. Raja memiliki seorang pahlawan perempuan bernama Dinarzad yang setuju dengannya. Dikatakan bahwa kitab itu ditulis untuk Hamani, putri Bahman. Ibn al-Nadim berkata, dan pendapat yang benar adalah bahwa yang pertama begadang adalah Alexander, yang memiliki orang-orang yang menertawakan dan merayunya, bukan mencari kesenangan tetapi lebih menghafal dan menjaga. Setelah itu, raja-raja menggunakan kitab 'Hazar Afsan,' yang berisi seribu malam dan kurang dari dua ratus malam. Ia berkata: Saya melihatnya secara utuh, sebenarnya sebuah buku hadis yang dingin {cite:fihrist-ibn-al-nadim hlm. 422-423}."
