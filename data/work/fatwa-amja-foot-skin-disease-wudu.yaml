id: work/fatwa-amja-foot-skin-disease-wudu
class: work
kind: fatwa
label: { ar: "المرض الجلدي والوضوء", en: "A foot skin-disease — wash, wipe, or tayammum in turn", ur: "پاؤں کی جلدی بیماری — وضو یا تیمم", es: "Una enfermedad de la piel del pie: lavar, limpiar o tayammum por turno", fr: "Une maladie de peau du pied — laver, essuyer ou tayammum tour à tour" }
summary:
  ar: "سأل سائل أن بقدميه مرضًا جلديًا لا يستطيع وصول الماء إليهما. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79669 بتاريخ 15 أغسطس 2009)⁩ أن يأتي من أعمال الوضوء ما يقدر عليه والجزء الذي يتضرر بوصول الماء إليه إن كانت عليه جبيرة فليمسح عليها وإلا فليبلل يده بالماء وليمسح عليه فإن تضرر بذلك تيمم عن هذا العضو على ما فصّل الجواب."
  en: "A questioner had a skin disease on his feet keeping water from them. Dr. Salah al-Sawi (fatwa no. 79669, 15 August 2009) answered that he performs what wudu-acts he can; for the part harmed by water — if a splint covers it he wipes over that, else he wets his hand with water and wipes it; if even that harms him he does tayammum for the member — as the answer details."
  ur: "پاؤں کی بیماری میں وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79669، 15 اگست 2009)⁩ کے مطابق جو دھو سکے دھوئے، زخمی عضو پر مسح، نہ سکے تو تیمم۔"
  es: "Un consultante tenía una enfermedad cutánea en los pies que le impedía la entrada de agua. El Dr. Salah al-Sawi (fatwa n.º 79669, 15 de agosto de 2009) respondió que realiza las abluciones que puede; para la parte afectada por el agua, si una férula la cubre, la limpia; de lo contrario, se moja la mano con agua y la limpia; si incluso eso le causa daño, realiza el tayammum para esa parte, como se detalla en la respuesta."
  fr: "Un homme, souffrant d'une maladie de peau aux pieds les empêchant de se mouiller, a reçu la réponse du Dr Salah al-Sawi (fatwa n° 79669, 15 août 2009): « Il doit accomplir les ablutions (wudu) qu'il peut. Pour la partie sensible à l'eau, s'il la porte avec une attelle, il s'essuie dessus; sinon, il mouille sa main et s'essuie. Si cela lui cause également des dommages, il pratique le tayammum pour le membre, comme le précise la réponse. »"
