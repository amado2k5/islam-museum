label: { ar: "قرار مجمع الفقه الإسلامي الدولي 179 (19/5) بشأن التورق: حقيقته وأنواعه ⁦(الفقهي المعروف والمصرفي المنظم)⁩", en: "IIFA resolution 179 (19/5) on tawarruq: its reality and types ⁦(the classical juristic and organised banking forms)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 179 (19/5): تورق — اس کی حقیقت اور اقسام ⁦(فقہی معروف اور مصرفی منظم)⁩", es: "Resolución 179 (19/5) de la IIFA sobre el tawarruq: su realidad y tipos (las formas jurídicas clásicas y bancarias organizadas).", fr: "Résolution 179 (19/5) de l'IIFA sur le tawarruq: sa réalité et ses types (les formes juridiques et bancaires organisées classiques)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩، بعد اطلاعه كذلك على قرارات المجمع الفقهي التابع لرابطة العالم الإسلامي. ميّز ثلاثة أنواع: التورق في اصطلاح الفقهاء ⁦(شراء المستورق سلعة بثمن مؤجل ليبيعها نقدًا بثمن أقل غالبًا إلى غير من اشتراها منه بقصد النقد)⁩ وهو جائز بشروط البيع المقررة؛ والتورق المنظم ⁦(شراء سلعة بثمن مؤجل يتولى المموّل ترتيب بيعها بنفسه أو بتوكيل أو بتواطؤ)⁩؛ والتورق العكسي ⁦(صورة التورق المنظم نفسها مع كون المستورق المؤسسة والممول العميل)⁩. وقرر أن التورقين المنظم والعكسي لا يجوزان لفيهما تواطؤ بين الممول والمستورق صراحة أو ضمنًا أو عرفًا تحايلًا لتحصيل النقد الحاضر بأكثر منه في الذمة، وهو ربا. وأوصى بالتأكيد على المؤسسات المالية الإسلامية استخدام الصيغ المشروعة وتجنب المحرمة والمشبوهة، وتشجيع القرض الحسن وإنشاء صناديق له لتجنيب المحتاجين اللجوء للتورق."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009), issued also after reviewing the resolutions of the Muslim World League's fiqh academy. It distinguished three types: tawarruq in the jurists' sense (the mustawriq buys a commodity on deferred payment to sell it for cash, usually at a lower price, to someone other than the seller, seeking liquidity) — permissible if it meets the stipulated conditions of sale; organised tawarruq (a deferred-price purchase where the financier arranges the resale itself, by proxy or by collusion); and reverse tawarruq (the same organised form with the institution as mustawriq and the client as financier). It ruled organised and reverse tawarruq impermissible, as they involve express, implied or customary collusion between financier and mustawriq to obtain ready cash against more in obligation — which is riba. It recommended that Islamic financial institutions use lawful financing forms and avoid prohibited or suspect ones, and encouraged qard hasan and dedicated funds for it to spare the needy resort to tawarruq."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں، جس میں رابطہ عالمِ اسلامی کے فقہی اکیڈمی کی قراردادوں کا بھی جائزہ لیا گیا۔ اس نے تین اقسام ممیز کیں: فقہاء کے اصطلاحی تورق ⁦(مستورق کی مؤجل قیمت پر جنس خرید کر نقد کے لیے کم قیمت پر کسی دوسرے کو بیچنا)⁩ — شرعی شروط پوری ہو تو جائز؛ منظم تورق ⁦(مؤجل قیمت کی خرید جس کی فروخت ممول خود، وکالت یا ملی بھگت سے ترتیب دیتا ہے)⁩؛ اور معکوس تورق ⁦(وہی منظم صورت جس میں مستورق ادارہ اور ممول گاہک ہو)⁩۔ اکیڈمی نے منظم اور معکوس تورق کو ناجائز قرار دیا کیونکہ دونوں میں ممول اور مستورق کے درمیان صریح، ضمنی یا عرفی ملی بھگت ہوتی ہے جس کا مقصد ذمہ میں زیادہ کے بدلے نقد حاصل کرنا ہے — اور یہ ربا ہے۔ سفارشات: اسلامی مالی ادارے جائز صیغے اختیار کریں اور حرام یا مشتبہ سے بچیں، اور ضرورت مندوں کو تورق پر آمادہ ہونے سے بچانے کے لیے قرضِ حسن اور اس کے فنڈز کو فروغ دیا جائے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009), emitida también tras revisar las resoluciones de la academia de jurisprudencia de la Liga Mundial Musulmana. Distinguió tres tipos: tawarruq en el sentido de los juristas (el mustawriq compra una mercancía a plazos para venderla al contado, generalmente a un precio inferior, a alguien distinto del vendedor, buscando liquidez) —permitido si cumple las condiciones de venta estipuladas; tawarruq organizado (una compra a plazos en la que el financiador organiza la reventa por sí mismo, por medio de un representante o mediante colusión); y tawarruq inverso (la misma forma organizada con la institución como mustawriq y el cliente como financiador). El tribunal dictaminó que el tawarruq organizado e inverso son inadmisibles, ya que implican una colusión expresa, implícita o consuetudinaria entre el financiero y el mustawriq para obtener efectivo a cambio de una mayor deuda, lo cual constituye riba (usura). Recomendó que las instituciones financieras islámicas utilicen formas de financiación lícitas y eviten las prohibidas o sospechosas, y fomentó el qard hasan (financiación lícita) y la asignación de fondos para ello, a fin de evitar que los necesitados recurran al tawarruq."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009), après examen des résolutions de l'Académie de jurisprudence islamique de la Ligue islamique mondiale, distingue trois types de tawarruq: le tawarruq au sens juridique du terme (le mustawriq achète un bien à crédit pour le revendre au comptant, généralement à un prix inférieur, à une personne autre que le vendeur, dans le but d'obtenir des liquidités) – licite s'il respecte les conditions de vente stipulées; le tawarruq organisé (un achat à crédit où le financier organise lui-même la revente, par procuration ou par collusion); et le tawarruq inversé (la même forme organisée, l'institution jouant le rôle de mustawriq et le client celui de financier). L'Académie a jugé le tawarruq organisé et le tawarruq inversé illicites, car ils impliquent une collusion expresse, tacite ou coutumière entre le financier et le mustawriq pour obtenir des liquidités immédiates au détriment d'une obligation plus importante – ce qui constitue du riba (usure). Il a recommandé aux institutions financières islamiques d'utiliser des formes de financement licites et d'éviter celles qui sont interdites ou suspectes, et a encouragé le qard hasan et a consacré des fonds à cet effet afin d'éviter que les nécessiteux ne recourent au tawarruq."
