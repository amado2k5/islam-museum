id: work/fatwa-dar-alifta-eg-reserving-gold-with-deposit
class: work
kind: fatwa
label: { ar: "حكم حجز الذهب بدفع بعض قيمته", en: "Reserving gold by paying part of its price", ur: "سونے کی بکنگ پر جزو قیمت ادا کرنا", es: "Reservar oro pagando parte de su precio.", fr: "Réserver de l'or en payant une partie de son prix", tr: "Altının değerinin bir kısmını ödeyerek ele geçirilmesine ilişkin karar", id: "Putusan tentang penyitaan emas dengan membayar sebagian nilainya" }
summary:
  ar: "سائل سأل عن حجز ذهب بدفع بعض قيمته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20839)⁩ أن المعاملة الواردة في السؤال من قبيل عقد السلم ولا تصح بصورتها المذكورة وتصحيحها يكون بدفع كامل الثمن عند العقد على ما فصّل الجواب."
  en: "A questioner asked about reserving gold by paying part of its value. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20839) answered that the transaction is of the salam kind and is invalid in the stated form; its correction is paying the full price at the contract — as the answer details."
  ur: "ایک سائل نے سونے کی جزو قیمت ادا کر کے بکنگ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20839)⁩ نے جواب دیا کہ یہ سلم کے عقد کی قسم سے ہے اور اس صورت میں صحیح نہیں؛ درستگی پوری قیمت کی ادائیگی سے ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de reservar oro pagando solo una parte de su valor. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20839) respondió que la transacción es de tipo salam y, por lo tanto, inválida en la forma indicada; la corrección consiste en pagar el precio total estipulado en el contrato, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la réservation d'or par versement d'une partie de sa valeur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20839) a répondu que cette transaction, de nature irrégulière (salam), est invalide sous cette forme; la solution consiste à payer l'intégralité du prix convenu, comme le précise la réponse."
  tr: "Bir soru soran kişi, altının değerinin bir kısmının ödenerek el konulması hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20839), soruda bahsedilen işlemin bir barış sözleşmesi gibi olduğunu ve belirtilen haliyle geçerli olmadığını, onayının ise sözleşme sırasında tam fiyatın ödenmesiyle yapıldığını, cevapta detaylandırıldığı gibi yanıtladı."
  id: "Seorang penanya menanyakan tentang penyitaan emas dengan membayar sebagian nilainya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20839) menjawab bahwa transaksi yang disebutkan dalam pertanyaan tersebut mirip dengan kontrak damai dan tidak berlaku dalam bentuk yang disebutkan, dan validasinya dilakukan dengan membayar harga penuh pada saat kontrak, seperti yang dijelaskan dalam jawaban."
