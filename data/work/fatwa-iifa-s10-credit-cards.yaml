summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: تكليف الأمانة العامة إجراء مسح ميداني لنماذج شروط واتفاقيات البطاقات التي تصدرها البنوك، وتشكيل لجنة تدرس صيغ البطاقات لتحديد خصائصها وفروقها وضبط تكييفاتها الشرعية بعد توفير المصادر العربية والأجنبية، وعقد حلقة بحث لمناقشة الموضوع."
  en: "IIFA's tenth-session resolution (July 1997) on credit cards: the secretariat was tasked with a field survey of the banks' card terms and agreement templates, forming a committee to study card forms — their features, differences and sharia classifications — after gathering Arabic and foreign sources, and holding a study circle on the subject."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩ کریڈٹ کارڈز پر: بینکوں کے شرائط و معاہدوں کا سروے، اقسام کے شرعی تکیف کی کمیٹی اور حلقہ بحث کا حکم۔"
  es: "Resolución de la décima sesión de la IIFA (julio de 1997) sobre tarjetas de crédito: se encargó a la secretaría la realización de un estudio de campo sobre los términos y modelos de acuerdos de las tarjetas bancarias, la formación de un comité para estudiar los formularios de las tarjetas —sus características, diferencias y clasificaciones sharia— tras recopilar fuentes árabes y extranjeras, y la celebración de un círculo de estudio sobre el tema."
