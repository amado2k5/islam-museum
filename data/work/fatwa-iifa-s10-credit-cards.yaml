label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن بطاقات الائتمان", en: "IIFA resolution on credit cards", ur: "اکیڈمی کی قرارداد: کریڈٹ کارڈز", es: "Resolución de la IIFA sobre tarjetas de crédito", fr: "Résolution de l'IIFA sur les cartes de crédit", tr: "Uluslararası İslami Fiqh Akademisi'nin kredi kartları ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai kartu kredit" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: تكليف الأمانة العامة إجراء مسح ميداني لنماذج شروط واتفاقيات البطاقات التي تصدرها البنوك، وتشكيل لجنة تدرس صيغ البطاقات لتحديد خصائصها وفروقها وضبط تكييفاتها الشرعية بعد توفير المصادر العربية والأجنبية، وعقد حلقة بحث لمناقشة الموضوع."
  en: "IIFA's tenth-session resolution (July 1997) on credit cards: the secretariat was tasked with a field survey of the banks' card terms and agreement templates, forming a committee to study card forms — their features, differences and sharia classifications — after gathering Arabic and foreign sources, and holding a study circle on the subject."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩ کریڈٹ کارڈز پر: بینکوں کے شرائط و معاہدوں کا سروے، اقسام کے شرعی تکیف کی کمیٹی اور حلقہ بحث کا حکم۔"
  es: "Resolución de la décima sesión de la IIFA (julio de 1997) sobre tarjetas de crédito: se encargó a la secretaría la realización de un estudio de campo sobre los términos y modelos de acuerdos de las tarjetas bancarias, la formación de un comité para estudiar los formularios de las tarjetas —sus características, diferencias y clasificaciones sharia— tras recopilar fuentes árabes y extranjeras, y la celebración de un círculo de estudio sobre el tema."
  fr: "Résolution de la dixième session de l'IIFA (juillet 1997) sur les cartes de crédit: le secrétariat a été chargé de réaliser une enquête sur le terrain concernant les conditions générales des cartes et les modèles de contrats des banques, de former un comité pour étudier les formulaires de cartes — leurs caractéristiques, leurs différences et leurs classifications selon la charia — après avoir rassemblé des sources arabes et étrangères, et d'organiser un cercle d'étude sur le sujet."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin onuncu oturumunda (Temmuz 1997) kararı: Genel Sekreterliğe bankalar tarafından verilen koşul ve anlaşma türlerinin saha incelemesini yapmak, kart formatlarını incelemek ve Arap ile yabancı kaynaklar sağladıktan sonra Şeriat sınıflandırmalarını düzenlemek üzere bir komite kurmak ve konuyu tartışmak üzere bir araştırma semineri düzenlemek üzere görevlendirilmesi."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi kesepuluhnya (Juli 1997): Menugaskan Sekretariat Jenderal untuk melakukan survei lapangan tentang jenis kondisi dan perjanjian yang dikeluarkan oleh bank, serta membentuk komite untuk mempelajari format kartu guna menentukan karakteristik dan perbedaannya serta mengatur klasifikasi Syariah setelah menyediakan sumber Arab dan asing, serta mengadakan seminar penelitian untuk membahas topik tersebut."
