  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: تكليف الأمانة العامة إجراء مسح ميداني لنماذج شروط واتفاقيات البطاقات التي تصدرها البنوك، وتشكيل لجنة تدرس صيغ البطاقات لتحديد خصائصها وفروقها وضبط تكييفاتها الشرعية بعد توفير المصادر العربية والأجنبية، وعقد حلقة بحث لمناقشة الموضوع."
