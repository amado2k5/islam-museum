label: { ar: "توحيد خطاب المسلمين بلغة القرآن", en: "Unifying Muslim discourse in the Quranic tongue", ur: "مسلمانوں کی مشترک زبان قرآن کی زبان ہو", es: "Unificar el discurso musulmán en lengua coránica", fr: "Unifier le discours musulman dans la langue coranique" }
summary:
  ar: "سأل سائل هل يجوز توحيد خطاب المسلمين ببعضهم البعض بلغة القرآن الكريم بدلًا من اللغات الوسيطة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82485 بتاريخ 9 سبتمبر 2010)⁩ أن التحدث بالعربية من شعائر الإسلام وتمنى أن تكون اللغة الأم التي يلتقى على التحدث بها المسلمون كافة فوق كل أرض وتحت كل سماء."
  en: "A questioner asked whether Muslims' discourse with one another may be unified in the tongue of the Quran rather than intermediary languages. Dr. Salah al-Sawi (fatwa no. 82485, 9 September 2010) answered that speaking Arabic is among Islam's rites and expressed his wish that it be the mother tongue on which all Muslims meet in speech on every land under every sky. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ مسلمانوں کا آپس کا خطاب قرآن کی زبان میں کیوں نہ ہو۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82485، 9 ستمبر 2010)⁩ کے مطابق عربی میں گفتگو اسلام کی شعائر میں سے ہے اور اس کی تمنا ہے کہ یہ سب مسلمانوں کی مشترک زبان ہو۔"
  es: "Un interlocutor preguntó si el diálogo entre los musulmanes podría unificarse en la lengua del Corán en lugar de utilizar lenguas intermedias. El Dr. Salah al-Sawi (fatwa n.º 82485, 9 de septiembre de 2010) respondió que hablar árabe es uno de los ritos del Islam y expresó su deseo de que sea la lengua materna en la que todos los musulmanes se comuniquen en cualquier lugar del mundo. Esta respuesta fue registrada por AMJA."
  fr: "Un internaute a demandé si le dialogue entre musulmans pouvait être unifié dans la langue du Coran plutôt que par des langues intermédiaires. Le Dr Salah al-Sawi (fatwa n° 82485, 9 septembre 2010) a répondu que parler arabe fait partie des rites de l'islam et a exprimé le souhait que cette langue devienne la langue maternelle sur laquelle tous les musulmans se rencontrent et communiquent, quel que soit le pays ou le lieu. Cette réponse a été consignée par l'AMJA."
