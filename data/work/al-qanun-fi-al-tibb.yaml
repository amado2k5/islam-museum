id: work/al-qanun-fi-al-tibb
education:
  did_you_know:
    ar: "قسّم ابن سينا «القانون في الطب» خمسة كتب: الأمور الكلية، والأدوية المفردة، والأمراض الجزئية بالأعضاء، والأمراض العامة والزينة، وتركيب الأدوية."
    en: "Ibn Sina divided his Canon of Medicine into five books: the general principles, simple drugs, diseases seated in the organs, diseases not bound to one organ together with the care of beauty, and compound remedies."
    ur: "ابن سینا نے «قانون فی الطب» کو پنج کتابوں میں بانٹا: کلی اصول، مفرد ادویہ، اعضا کے جزوی امراض، عام امراض اور آرائش، اور مرکب ادویہ۔"
    sources: [source/canon-ibn-sina-print-v1, source/encyclopaedia-of-islam-2]
class: work
