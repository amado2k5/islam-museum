label: { ar: "القانون في الطب", en: "The Canon of Medicine", ur: "القانون فی الطب" }
summary:
  ar: "موسوعة ابن سينا في الطب، قسمها المؤلف إلى خمسة كتب تشمل الأمور الكلية والأدوية المفردة والأمراض الجزئية بالأعضاء والأمراض العامة والزينة وتركيب الأدوية. وتذكر دائرة المعارف الإسلامية أنه ظل أساس التدريس الطبي نحو سبعة قرون، وأن جيرارد الكريموني ترجمه إلى اللاتينية بين 1150 و1187، وأنه دخل مناهج الجامعات الأوروبية كمونبلييه منذ 1309."
  en: "Ibn Sina's encyclopaedia of medicine, divided by the author into five books: general principles, simple drugs, diseases of the organs one by one, diseases not confined to one organ with beauty care, and compound drugs. The Encyclopaedia of Islam says it served as the basis of medical teaching for about seven centuries, that Gerard of Cremona translated it into Latin between 1150 and 1187, and that it entered European university syllabi such as Montpellier's from 1309."
  ur: "ابن سینا کی طبی موسوعہ، جسے مصنف نے پانچ کتابوں میں بانٹا: کلی اصول، مفرد ادویہ، اعضا کے جزوی امراض، عام امراض اور آرائش، اور مرکب ادویہ۔ دائرۃ المعارف اسلامیہ کے مطابق وہ تقریباً سات صدیوں تک طبی تدریس کی بنیاد رہی، جیرارڈ کریمونی نے 1150 اور 1187 کے درمیان اسے لاطینی میں ترجمہ کیا، اور وہ 1309 سے مونپلیئے جیسے یورپی جامعاتی نصابوں میں شامل ہوئی۔"
