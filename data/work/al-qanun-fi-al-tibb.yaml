structure: "الكتاب الأول: في الأمور الكلية في علم الطب، أربعة فنون، من المسح 11 إلى 311 (vol. 1): الفن الأول في حد الطب وموضوعاته من 13، والثاني في الأمراض والأسباب والأعراض الكلية من 103، والثالث في سبب الصحة والمرض وضرورة الموت من 200، والرابع في تصنيف وجوه المعالجات من 267. الكتاب الثاني: في الأدوية المفردة، من 313 إلى 728 (vol. 1). الكتاب الثالث: في الأمراض الجزئية الواقعة بأعضاء الإنسان عضواً عضواً، من 3 (vol. 2)؛ موضع انتهائه لم يُحدَّد بعد. الكتاب الرابع: في الأمراض الجزئية التي لا تختص بعضو وفي الزينة، من 3 إلى 393 (vol. 3). الكتاب الخامس: في تركيب الأدوية وهو الأقراباذين، من 395 (vol. 3)، والنص ينقطع عند 590 قبل خاتمته. الأرقام أرقام المسح في كل مجلد."
