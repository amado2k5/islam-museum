summary:
  ar: "موسوعة ابن سينا في الطب، وقسمها المؤلف إلى خمسة كتب: الأمور الكلية في علم الطب (وفيه أربعة فنون)، والأدوية المفردة، والأمراض الجزئية الواقعة بالأعضاء، والأمراض التي لا تختص بعضو وفي الزينة، وتركيب الأدوية {cite:canon-ibn-sina-print-v1 p.10}."
  en: "Ibn Sina's encyclopaedia of medicine, divided by the author into five books: general principles of medicine (four fanns), simple drugs, diseases of the organs one by one, diseases not confined to one organ and beauty care, and compound drugs {cite:canon-ibn-sina-print-v1 p.10}."
