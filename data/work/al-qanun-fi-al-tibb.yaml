  ar: "موسوعة ابن سينا في الطب. يبدأ كتابها الأول بالأمور الكلية في علم الطب، في أربعة فنون: حدّ الطب وموضوعاته، والأركان، والأمزجة، والأخلاط، والأعضاء، والقوى والأفعال. ويبدأ كتابها الثاني بالأدوية المفردة {cite:canon-ibn-sina-print p.2} {cite:canon-ibn-sina-print p.232}."
