label: { ar: "أنموذج العلوم في مئة مسألة من مئة فنون" }
summary:
  ar: "رسالة شمس الدين محمد الفناري في مئة مسألة من مئة فن، عبّر فيها عن أسماء تلك الفنون بطريق الألغاز امتحاناً لفضلاء عصره فلم يقدروا على تعيين فنونها فضلاً عن حل مسائلها، قال صاحب الشقائق سمعت من بعض أحفاده أنها لابنه محمد شاه، وشرحها ابنه محمد شاه وعين أسماء الفنون وحل مشكلات مسائلها ونظم عقيب كل قطعة قطعة وذكر أن والده لما سافر إلى قَرامان كتبها اختباراً لعلمائها لأنهم كانوا يجحدون فضله وفرغ من شرحه سنة أربع وعشرين وثمان مئة {cite:kashf-zunun-furqan p. 665-666}."
  en: "Al-Fanari's hundred-questions-in-a-hundred-sciences riddle treatise, written — his son tells — to test Qaraman's scholars who denied his merit; none could even name the sciences, let alone solve the questions, until the son Muhammad Shah explained it in 824 {cite:kashf-zunun-furqan p. 665-666}."
