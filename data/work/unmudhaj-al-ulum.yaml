label: { ar: "أنموذج العلوم في مئة مسألة من مئة فنون", en: "Unmudhaj al-'Ulum fi Mi'at Mas'ala min Mi'at Funun", ur: "انمدج العلوم فی میعات مسالہ من میات فنون" }
summary:
  ar: "رسالة شمس الدين محمد الفناري في مئة مسألة من مئة فن، عبّر فيها عن أسماء تلك الفنون بطريق الألغاز امتحاناً لفضلاء عصره فلم يقدروا على تعيين فنونها فضلاً عن حل مسائلها، قال صاحب الشقائق سمعت من بعض أحفاده أنها لابنه محمد شاه، وشرحها ابنه محمد شاه وعين أسماء الفنون وحل مشكلات مسائلها ونظم عقيب كل قطعة قطعة وذكر أن والده لما سافر إلى قَرامان كتبها اختباراً لعلمائها لأنهم كانوا يجحدون فضله وفرغ من شرحه سنة أربع وعشرين وثمان مئة {cite:kashf-zunun-furqan p. 665-666}."
  en: "Al-Fanari's hundred-questions-in-a-hundred-sciences riddle treatise, written — his son tells — to test Qaraman's scholars who denied his merit; none could even name the sciences, let alone solve the questions, until the son Muhammad Shah explained it in 824 {cite:kashf-zunun-furqan p. 665-666}."
  es: "El tratado de acertijos de Al-Fanari sobre cien preguntas en cien ciencias, escrito —según cuenta su hijo— para poner a prueba a los eruditos de Qaraman que negaban su mérito; ninguno pudo siquiera nombrar las ciencias, y mucho menos resolver las preguntas, hasta que su hijo Muhammad Shah lo explicó en 824 {cite:kashf-zunun-furqan p. 665-666}."
  fr: "Le traité d'énigmes d'Al-Fanari, composé de cent questions sur cent sciences, a été écrit — raconte son fils — pour mettre à l'épreuve les savants de Qaraman qui niaient son mérite; aucun ne pouvait même nommer les sciences, encore moins résoudre les questions, jusqu'à ce que son fils Muhammad Shah l'explique en 824 {cite:kashf-zunun-furqan p. 665-666}."
  ur: "الفناری کا سو سوالوں پر مشتمل ایک سو سائنسی پہیلیوں کا مقالہ لکھا گیا - اس کا بیٹا بتاتا ہے - تاکہ قرمان کے ان علماء کی جانچ کی جاسکے جنہوں نے اس کی قابلیت سے انکار کیا تھا۔ کوئی سائنس کا نام بھی نہیں لے سکتا تھا، سوالات کو حل کرنے دیں، یہاں تک کہ بیٹے محمد شاہ نے 824 میں اس کی وضاحت کردی۔ 665-666}۔"
