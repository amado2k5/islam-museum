label: { ar: "قصيدة المتنبي «كفى بك داء أن ترى الموت شافيا»", en: "Al-Mutanabbi's ode 'It is enough of a sickness that you see death as a cure'" }
summary:
  ar: "قصيدة من الطويل على روي الألف يقدّم لها الديوان بأن المتنبي فارق سيف الدولة ورحل إلى دمشق وكاتبه كافور بالمسير إليه، فأنشده إياها في جمادى الآخرة سنة 346هـ ⁦(957م)⁩ {{cite:diwan-mutanabbi-dar-beirut-1983 p.441}}."
  en: "An ode in the tawil metre on the rhyme alif; the edition introduces it with the poet's leaving Sayf al-Dawla for Damascus, Kafur's invitation to come to him, and its recital to Kafur in Jumada II 346 AH (957 CE) {{cite:diwan-mutanabbi-dar-beirut-1983 p.441}}."
