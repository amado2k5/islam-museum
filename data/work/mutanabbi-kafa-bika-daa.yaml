label: { ar: "قصيدة المتنبي «كفى بك داء أن ترى الموت شافيا»", en: "Al-Mutanabbi's ode 'It is enough of a sickness that you see death as a cure'", es: "La oda de Al-Mutanabbi: \"Basta con que veas la muerte como una cura\"", fr: "L'ode d'Al-Mutanabbi: « C'est déjà une maladie terrible de voir la mort comme un remède. »", ur: "المتنبی کا قول 'بیماری کے لیے یہی کافی ہے کہ تم موت کو علاج سمجھو'", tr: "Al-Mutanabbi'nin şiiri: \"Ölümü bir tedavi olarak görmen yeterlidir\"", id: "Puisi Al-Mutanabbi: \"Cukup bagimu untuk melihat kematian sebagai obat\"" }
summary:
  ar: "قصيدة من الطويل على روي الألف يقدّم لها الديوان بأن المتنبي فارق سيف الدولة ورحل إلى دمشق وكاتبه كافور بالمسير إليه، فأنشده إياها في جمادى الآخرة سنة 346هـ ⁦(957م)⁩ {{cite:diwan-mutanabbi-dar-beirut-1983 p.441}}."
  en: "An ode in the tawil metre on the rhyme alif; the edition introduces it with the poet's leaving Sayf al-Dawla for Damascus, Kafur's invitation to come to him, and its recital to Kafur in Jumada II 346 AH (957 CE) {{cite:diwan-mutanabbi-dar-beirut-1983 p.441}}."
  es: "Una oda en metro tawil sobre la rima alif; la edición la introduce con la partida del poeta de Sayf al-Dawla a Damasco, la invitación de Kafur para que vaya a verlo y su recitación a Kafur en Jumada II 346 AH (957 CE) {{cite:diwan-mutanabbi-dar-beirut-1983 p.441}}."
  fr: "Une ode en mètre tawil sur la rime alif; l'édition l'introduit avec le départ du poète de Sayf al-Dawla pour Damas, l'invitation de Kafur à venir le voir et sa récitation à Kafur en Jumada II 346 AH (957 CE) {{cite:diwan-mutanabbi-dar-beirut-1983 p.441}}."
  ur: "الف کی شاعری پر تاویل میٹر میں ایک اوڈ؛ ایڈیشن میں اس کا تعارف شاعر کے سیف الدولہ کے دمشق کے لیے روانہ ہونے، کافور کے اس کے پاس آنے کی دعوت، اور جمادی الثانی 346 ہجری ⁦(957 عیسوی)⁩ میں کافور کے لیے اس کی تلاوت کے ساتھ متعارف کرایا گیا ہے۔"
  tr: "Alif Alif'in akıntısı üzerine Al-Tawil'den bir şiir, Diwan'ın sunduğu gibi, Al-Mutanabbi'nin Sayf al-Dawla'dan ayrılıp Şam'a gittiğini ve yazarı Kafur'un ona doğru yolculuğa çıktığını anlatır. Bu şiiri 346 Hicri yılında (957 M.S.) Jumada al-Akhirah'da okudu {{cite:diwan-mutanabbi-dar-beirut-1983 s.441}}."
  id: "Sebuah puisi dari Al-Tawil tentang kisah Alif Alif yang diisyaratkan oleh Diwan bahwa Al-Mutanabbi berpisah dari Sayf al-Dawla dan pergi ke Damaskus, dan penulisnya Kafur memulai perjalanan itu kepadanya. Ia membacakannya dalam Jumada al-Akhirah pada tahun 346 H (957 M) {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.441}}."
