label:
  ar: "الإيصال إلى فهم كتاب الخصال"
  en: "al-Isal ila Fahm Kitab al-Khisal"
  ur: "الایصال الی فہم کتاب الخصال"
summary:
  ar: "أكبر كتب ابن حزم في الفقه، شرح فيه مختصره «الخصال الجامعة لجمل شرائع الإسلام»، وأورد فيه أقوال الصحابة والتابعين ومن بعدهم والحجة لكل طائفة وعليها والأحاديث بأسانيدها؛ يذكر ابن العربي أنه في أربعة وعشرين مجلداً؛ ضاع، ولم يُعرف منه إلا قطعة من «الجامع» نشرها محققو طبعة دار ابن حزم لـ«المحلى» في المجلد الأول. {cite:muhalla-dar-ibn-hazm-2016-v1 p.136} {cite:muhalla-dar-ibn-hazm-2016-v1 p.287} {cite:muhalla-dar-ibn-hazm-2016-v1 p.288} {cite:muhalla-dar-ibn-hazm-2016-v1 p.289} {cite:muhalla-dar-ibn-hazm-2016-v1 p.290}"
  en: "Ibn Hazm's largest legal work, a commentary on his own short al-Khisal al-Jami'a li-Jumal Shara'i' al-Islam, giving the views of the Companions, Followers and later scholars, the arguments for and against each party, and hadiths with their chains; Ibn al-Arabi says it was in twenty-four volumes. It is lost, apart from a fragment of its 'Jami'' section published by the editors of the Dar Ibn Hazm edition of al-Muhalla in its first volume."
  ur: "فقہ میں ابن حزم کی سب سے بڑی کتاب، جس میں انہوں نے اپنی مختصر «الخصال الجامعۃ لجمل شرائع الاسلام» کی شرح کی، اور صحابہ، تابعین اور بعد والوں کے اقوال، ہر گروہ کی دلیل اور اس کا جواب، اور احادیث اپنی سندوں کے ساتھ دیں؛ ابن العربی کے بقول یہ چوبیس جلدوں میں تھی۔ یہ ضائع ہو گئی، سوائے اس کے «الجامع» کے ایک ٹکڑے کے جسے دار ابن حزم کی «المحلی» کے محققین نے پہلی جلد میں شائع کیا۔"
