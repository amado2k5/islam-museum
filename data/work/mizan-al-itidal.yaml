summary:
  ar: "معجم الذهبي ⁦(ت 748هـ)⁩ لنقلة الحديث الذين تُكلم فيهم بجرح أو تليين، مرتب على حروف المعجم. ذكر في مقدمته أنه ألفه بعد كتابه «المغني» وزاد فيه أسماء كثيرة أكثرها من «الكامل» لابن عدي، وأنه أسقط منه الصحابة وأئمة المذاهب المتبوعين، ورمز لمن أخرج له أصحاب الكتب الستة، وجمع فيه طبقات من الكذابين والمتروكين والضعفاء والمجهولين حتى الثقات الذين فيهم بدعة أو تُكلم فيهم بغير حجة، ويختم تراجم كثيرة بحكمه هو بعد أقوال النقاد."
  en: "Al-Dhahabi's (d. 748 AH) dictionary of hadith transmitters who were criticised or softly faulted, in alphabetical order. In his introduction he says he wrote it after his al-Mughni and added many names, most of them from Ibn Adi's al-Kamil; that he left out the Companions and the imams of the followed schools; that he marked those whom the authors of the Six Books cite; and that it gathers grades of men from deliberate liars, abandoned and weak transmitters and the unknown up to trustworthy men with an innovation or criticised without warrant. Many entries end with his own verdict after the critics' sayings."
