summary:
  ar: "دراسة بالإنجليزية لوائل حلاق في التعارض بين الدولة الحديثة ونموذج الحكم الإسلامي الأخلاقي، صدرت عن مطبعة جامعة كولومبيا في نيويورك، وفق الفهرس المعتمد، ويذكره منهج جامعة ييل بسنة 2012، سنة 2014."
  en: "An English study by Wael B. Hallaq of the incompatibility of the modern state with the ethical model of Islamic governance, published by Columbia University Press, New York, according to the library catalogue (a Yale syllabus cites it as 2012) in 2014."
  ur: "وائل حلاق کا انگریزی مطالعہ جو جدید ریاست اور اسلامی طرزِ حکمرانی کے اخلاقی نمونے کے تضاد پر ہے؛ کولمبیا یونیورسٹی پریس، نیویارک، لائبریری فہرست کے مطابق ⁦(ییل کے ایک نصاب میں 2012ء درج ہے)⁩ سے 2014ء میں شائع ہوا۔"
  es: "Un estudio en inglés de Wael B. Hallaq sobre la incompatibilidad del estado moderno con el modelo ético de gobierno islámico, publicado por Columbia University Press, Nueva York, según el catálogo de la biblioteca (un programa de estudios de Yale lo cita como de 2012) en 2014."
  fr: "Une étude en anglais de Wael B. Hallaq sur l'incompatibilité de l'État moderne avec le modèle éthique de la gouvernance islamique, publiée par Columbia University Press, New York, selon le catalogue de la bibliothèque (un programme de cours de Yale la cite comme datant de 2012) en 2014."
  tr: "Wael Hallak'ın modern devlet ile İslami ahlaki yönetim modeli arasındaki çatışma üzerine İngilizce bir çalışması, New York'ta Columbia University Press tarafından yayımlanmış, onaylanmış endekse göre ve 2012 ile 2014 yıllarındaki Yale Üniversitesi müfredatında yer almıştır."
  id: "Sebuah studi bahasa Inggris oleh Wael Hallak tentang konflik antara negara modern dan model tata kelola moral Islam, diterbitkan oleh Columbia University Press di New York, sesuai dengan indeks yang disetujui, dan disebutkan dalam kurikulum Universitas Yale tahun 2012 dan 2014."
