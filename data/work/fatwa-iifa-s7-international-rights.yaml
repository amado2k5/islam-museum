label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الحقوق الدولية في نظر الإسلام", en: "IIFA resolution on international rights in the view of Islam", ur: "اکیڈمی کی قرارداد: اسلام کی نظر میں بین الاقوامی حقوق", es: "Resolución de la IIFA sobre los derechos internacionales desde la perspectiva del Islam.", fr: "Résolution de l'IIFA sur les droits internationaux du point de vue de l'islam" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: تشكيل لجنة تحضيرية لإعداد ورقة عمل لندوة متخصصة لمعالجة تفاصيل الموضوع والخروج بمشروع لائحة للحقوق الدولية في الإسلام تعرض على المجلس في دورته القادمة، من محاورها مصادر القانون الدولي الإسلامي والعلاقات الدولية وهي القرآن الكريم والسنة على ما فصّل."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on international rights in the view of Islam: a preparatory committee was formed to produce a working paper for a specialist seminar treating the details and drafting a charter of international rights in Islam for the next session, with axes including the sources of Islamic international law — the Quran and the sunna — as set out."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ بین الاقوامی حقوق پر: تیاری کمیٹی قائم ہوئی تاکہ سمینار کے لیے ورکنگ پیپر اور اسلامی بین الاقوامی حقوق کا مسودہ بنے۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre los derechos internacionales desde la perspectiva del Islam: se formó un comité preparatorio para elaborar un documento de trabajo para un seminario especializado que tratara los detalles y redactara una carta de derechos internacionales en el Islam para la próxima sesión, con ejes que incluyen las fuentes del derecho internacional islámico —el Corán y la Sunna— tal como se expone."
  fr: "Résolution de la septième session de l'IIFA (La Mecque, mai 1992) sur les droits internationaux du point de vue de l'Islam: un comité préparatoire a été formé pour produire un document de travail pour un séminaire spécialisé traitant des détails et rédigeant une charte des droits internationaux en Islam pour la session suivante, avec des axes incluant les sources du droit international islamique — le Coran et la sunna — comme indiqué."
