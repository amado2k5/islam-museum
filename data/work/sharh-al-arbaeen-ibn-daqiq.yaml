summary:
  ar: "«شرح الأربعين النووية» لابن دقيق العيد ⁦(ت 702هـ)⁩: شرح موجز جامع لأحاديث «الأربعين النووية»، يعرض في كل حديث فضله ومكانته، ثم يشرح معانيه فكرةً فكرةً، ويذكر أقوال العلماء المختلفة بإيجاز، ويرجّح ما يراه. {cite:ibn-daqiq-arbaeen-haykal-2012 p. 7}"
  en: "Ibn Daqiq al-Id's (d. 702 AH) concise commentary on al-Nawawi's Forty Hadith. For each hadith it states its virtue, explains its meanings idea by idea, briefly reports the scholars' differing readings, and prefers one. {cite:ibn-daqiq-arbaeen-haykal-2012 p. 7}"
  es: "Comentario conciso de Ibn Daqiq al-Id (m. 702 AH) sobre los Cuarenta Hadices de al-Nawawi. Para cada hadiz, expone su virtud, explica su significado idea por idea, recoge brevemente las diferentes interpretaciones de los eruditos y se decanta por una. {cite:ibn-daqiq-arbaeen-haykal-2012 p. 7}"
  fr: "Commentaire concis d'Ibn Daqiq al-Id (mort en 702 AH) sur les Quarante Hadiths d'al-Nawawi. Pour chaque hadith, il en expose les mérites, en explique le sens idée par idée, rapporte brièvement les différentes lectures des savants et en privilégie une. {cite:ibn-daqiq-arbaeen-haykal-2012 p. 7}"
  ur: "ابن دقیق العید کی ⁦(متوفی 702ھ)⁩ النووی کی چالیس حدیثوں کی اجمالی تفسیر۔ ہر حدیث کے لیے اس کی فضیلت بیان کرتا ہے، اس کے مفہوم کو خیال کے لحاظ سے بیان کرتا ہے، علماء کے مختلف پڑھنے کو مختصراً بیان کرتا ہے، اور ایک کو ترجیح دیتا ہے۔ {حوالہ: ابن دقیق اربعین-حیکال-2012 ص۔ 7}"
