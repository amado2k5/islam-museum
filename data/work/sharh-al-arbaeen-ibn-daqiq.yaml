summary:
  ar: "«شرح الأربعين النووية» لابن دقيق العيد (ت 702هـ): شرح موجز جامع لأحاديث «الأربعين النووية»، يعرض في كل حديث فضله ومكانته، ثم يشرح معانيه فكرةً فكرةً، ويذكر أقوال العلماء المختلفة بإيجاز، ويرجّح ما يراه. {cite:ibn-daqiq-arbaeen-haykal-2012 p. 7}"
  en: "Ibn Daqiq al-Id's (d. 702 AH) concise commentary on al-Nawawi's Forty Hadith. For each hadith it states its virtue, explains its meanings idea by idea, briefly reports the scholars' differing readings, and prefers one. {cite:ibn-daqiq-arbaeen-haykal-2012 p. 7}"
