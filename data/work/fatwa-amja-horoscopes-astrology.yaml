id: work/fatwa-amja-horoscopes-astrology
class: work
kind: fatwa
label: { ar: "حكم قراءة الأبراج", en: "The ruling on reading horoscopes", ur: "ستاروں کی قسمت ⁦(زائچہ)⁩ پڑھنے کا حکم", es: "La normativa sobre la lectura de horóscopos", fr: "La décision concernant la lecture des horoscopes", tr: "Burçların okunmasına ilişkin karar", id: "Keputusan tentang membaca horoskop" }
summary:
  ar: "سأل سائل عن شرعية الأبراج وعلم الفلك إذ يجد كثيرين يقرؤون «برجك اليوم». أجاب د. صلاح الصاوي ⁦(فتوى رقم 82932 بتاريخ 23 أكتوبر 2010)⁩ أن الاستدلال بالأحوال الفلكية على الحوادث الأرضية فعل المنجمين، وقد علم أن من أتى كاهنًا فصدقه فقد كفر بما أنزل على محمد وإن لم يصدقه لم تقبل له صلاة أربعين يومًا، وأنه ما من برج إلا ويولد فيه جميع الأنماط التي يتحدثون عنها ويرجمون بالغيب فيها، ولا يعرف لهذا علمًا منضبطًا على قواعد، فليكف نفسه عن هذا العبث وليشتغل بما ينفعه."
  en: "A questioner asked about the sharia status of horoscopes and astrology, many around him reading 'your sign today'. Dr. Salah al-Sawi (fatwa no. 82932, 23 October 2010) answered that inferring earthly events from celestial states is the astrologers' trade: whoever goes to a diviner and believes him has disbelieved in what was sent down on Muhammad, and whoever goes without believing has no prayer accepted for forty days; every sign births all the types they discourse about while they guess at the unseen, and he knows of no disciplined science behind it — so he should keep himself from this futility and busy himself with what benefits him. Recorded as AMJA's answer."
  ur: "ایک سائل نے زائچے اور علم نجوم کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82932، 23 اکتوبر 2010)⁩ کے مطابق ستاروں سے زمینی حالات نکالنا منجموں کا کام ہے؛ کہن کی تصدیق کفر ہے اور اس بے بنیاد علم سے بچنا چاہیے۔"
  es: "Un consultante preguntó sobre la validez de los horóscopos y la astrología según la ley islámica, mientras muchos a su alrededor leían su signo zodiacal. El Dr. Salah al-Sawi (fatwa n.° 82932, 23 de octubre de 2010) respondió que inferir eventos terrenales a partir de estados celestiales es el oficio de los astrólogos: quien acude a un adivino y le cree, ha renegado de lo revelado a Mahoma, y quien acude sin creer no ve aceptada su oración durante cuarenta días; cada signo genera todos los tipos de los que hablan mientras adivinan lo invisible, y él no conoce ninguna ciencia rigurosa que lo respalde; por lo tanto, debería abstenerse de esta futilidad y dedicarse a lo que le beneficia. Registrada como respuesta de AMJA."
  fr: "Un homme interrogea Salah al-Sawi sur le statut de l'astrologie et des horoscopes selon la charia, alors que plusieurs personnes autour de lui lisaient leur horoscope du jour. Le Dr Salah al-Sawi (fatwa n° 82932, 23 octobre 2010) répondit que l'interprétation des astres comme déduction des événements terrestres est le métier des astrologues: quiconque consulte un devin et croit en lui renie la révélation faite à Muhammad, et quiconque ne croit pas en lui ne verra aucune prière exaucée pendant quarante jours; chaque signe engendre tous les types d'enfants dont ils parlent en spéculant sur l'invisible, et il n'existe aucune science rigoureuse qui sous-tende ces pratiques; il devrait donc se détourner de cette futilité et s'occuper de ce qui lui est profitable. (Réponse consignée par AMJA.)"
  tr: "Bir soru soran kişi, birçok kişinin \"Bugünkü Burçunuz\" diye okuduğu gibi burçların ve astronominin meşruiyeti hakkında soru sordu. Dr. Salah Al-Sawy (23 Ekim 2010 tarihli 82932 No. Fetva) yeryüzü olayları için astronomik koşullardan çıkarımın astrologların uygulaması olduğunu yanıtladı. Bir kahine gelip ona inanan herkesin, Muhammed'e vahyedilene inanmadığını ve inanmazsa duasının kırk gün boyunca kabul edilmeyeceğini biliyordu. Ayrıca, bahsettikleri tüm tiplerin görünmeyecekte taşlandığı bir burç olmadığını ekledi. Kurallara dayalı disiplinli bir bilim bilgisi olmadığı için bu yaramazlıktan kaçınmalı ve kendisine fayda sağlayanla uğraşmalıdır."
  id: "Seorang penanya bertanya tentang legitimasi ramalan dan astronomi, karena banyak orang membaca \"Ramalan Ramalan Bulan Ini.\" Dr. Salah Al-Sawy menjawab (Fatwa No. 82932 tanggal 23 Oktober 2010) bahwa inferensi dari kondisi astronomi untuk peristiwa duniawi adalah praktik para ahli astrologi. Ia tahu bahwa siapa pun yang datang kepada peramal dan mempercayainya telah tidak mempercayai apa yang diwahyukan kepada Muhammad, dan jika ia tidak mempercayainya, doanya tidak akan diterima selama empat puluh hari. Ia menambahkan bahwa tidak ada zodiak di mana semua jenis yang mereka bicarakan dan dirajam di tempat yang tak terlihat. Ia tidak mengetahui ilmu yang disiplin berdasarkan aturan, jadi ia harus menahan diri dari kenakalan ini dan melakukan apa yang menguntungkannya."
