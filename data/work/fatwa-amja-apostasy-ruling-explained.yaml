label: { ar: "حكم المرتد وعقوبته", en: "The apostate's ruling and penalty — how to answer at Islamic centres", ur: "مرتد کا حکم اور سزا", es: "El veredicto y el castigo para el apóstata: cómo responder en los centros islámicos." }
summary:
  ar: "سألت مراكز إسلامية عن كيفية الإجابة على أسئلة ترد إليها حول حكم المرتد وعقوبته. أجاب د. حاتم الحاج ⁦(فتوى رقم 21837 بتاريخ 17 أبريل 2006)⁩ أن يبدأ ببيان أن ذلك الأمر من الأمور التي توكل إلى أجهزة القضاء في الدول الإسلامية لا إلى الأفراد في هذه الدول أو غيرها، ثم يبين أن القضاء سينظر في هذه الحالات ويقرر فيها بناءً على تفاصيل واعتبارات كثيرة، وأما الحكم في الشريعة فهو القتل للرجال عند الأئمة الأربعة وكذلك للمرأة عند الجمهور وتحبس عند الأحناف، لقوله من بدل دينه فاقتلوه ولحديث لا يحل دم امرئ مسلم إلا بإحدى ثلاث كما فصّل في الجواب."
  en: "Islamic centres asked how to answer questions reaching them about the apostate's ruling and penalty. Dr. Hatim al-Hajj (fatwa no. 21837, 17 April 2006) answered that the answer should begin by stating this matter belongs to the judiciaries of Muslim states, not to individuals there or elsewhere; then that the courts examine such cases on many details and considerations; and the ruling in the sharia is death for men per the four imams — and for the woman at the majority, confinement at the Hanafis — for 'whoever changes his religion, kill him' and 'a Muslim's blood is unlawful but by one of three', as the answer details. Recorded as AMJA's answer."
  ur: "مرکزوں نے مرتد کے حکم کا جواب پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21837، 17 اپریل 2006)⁩ کے مطابق یہ امر عدالتوں کا ہے نہ کہ افراد کا؛ شریعت میں ائمہ کے نزدیک قتل اور احناف کے نزدیک حبس ہے۔"
  es: "Los centros islámicos preguntaron cómo responder a las preguntas que les llegaban sobre el veredicto y la pena para los apóstatas. El Dr. Hatim al-Hajj (fatwa n.º 21837, 17 de abril de 2006) respondió que la respuesta debería comenzar afirmando que este asunto pertenece a los tribunales de los estados musulmanes, no a los individuos, ni allí ni en ningún otro lugar; luego que los tribunales examinan tales casos considerando muchos detalles y consideraciones; y que el veredicto en la sharia es la pena de muerte para los hombres según los cuatro imanes —y para la mujer en la mayoría de edad, el confinamiento según los hanafíes— para «quien cambie de religión, que sea ejecutado» y «la sangre de un musulmán es ilícita salvo por uno de tres», como detalla la respuesta. Registrada como la respuesta de AMJA."
