label: { en: "Banat Su'ad (the Burda of Ka'b ibn Zuhayr)", ar: "قصيدة بانت سعاد (بردة كعب بن زهير)" }
summary:
  en: "Ka'b ibn Zuhayr's celebrated apology-ode beginning 'Su'ad has departed, and today my heart is love-sick', recited before the Prophet in Medina; it pleads for pardon and praises the Prophet as a light and an unsheathed sword of God."
  ar: "قصيدة كعب بن زهير المشهورة التي أولها «بانت سعاد فقلبي اليوم متبول»، أنشدها بين يدي النبي بالمدينة معتذراً ومداحاً، وفيها وصفه بأنه «نور يستضاء به ومهنّد من سيوف الله مسلول»."
