label: { en: "Banat Su'ad (the Burda of Ka'b ibn Zuhayr)", ar: "قصيدة بانت سعاد ⁦(بردة كعب بن زهير)⁩", es: "Banat Su'ad (la Burda de Ka'b ibn Zuhayr)", fr: "Banat Su'ad (la Burda de Ka'b ibn Zuhayr)", ur: "بنات سعد ⁦(کعب بن زہیر کا بردہ)⁩", tr: "'Bant Suad' şiiri (Ka'b bin Zuhair'in görünüş pelerini)", id: "Puisi 'Bant Suad' (jubah penampilan Ka'b bin Zuhair)" }
summary:
  en: "Ka'b ibn Zuhayr's celebrated apology-ode beginning 'Su'ad has departed, and today my heart is love-sick', recited before the Prophet in Medina; it pleads for pardon and praises the Prophet as a light and an unsheathed sword of God."
  ar: "قصيدة كعب بن زهير المشهورة التي أولها «بانت سعاد فقلبي اليوم متبول»، أنشدها بين يدي النبي بالمدينة معتذراً ومداحاً، وفيها وصفه بأنه «نور يستضاء به ومهنّد من سيوف الله مسلول»."
  es: "La célebre oda de disculpa de Ka'b ibn Zuhayr, que comienza con \"Su'ad se ha ido, y hoy mi corazón está enfermo de amor\", recitada ante el Profeta en Medina, suplica perdón y alaba al Profeta como una luz y una espada desenvainada de Dios."
  fr: "La célèbre ode d'excuses de Ka'b ibn Zuhayr, commençant par « Su'ad est partie, et aujourd'hui mon cœur est malade d'amour », récitée devant le Prophète à Médine; elle implore le pardon et loue le Prophète comme une lumière et une épée dégainée de Dieu."
  ur: "کعب بن زہیر کا منایا جانے والا معافی نامہ \"سعد چلا گیا، اور آج میرا دل بیمار ہے\"، مدینہ میں نبی کے سامنے پڑھا گیا؛ یہ معافی کی التجا کرتا ہے اور نبی کی تعریف کرتا ہے کہ وہ خدا کی ایک نور اور غیر میانتی تلوار ہے۔"
  tr: "Ka'b bin Zuhayr'ın ünlü şiiri, \"Suad ortaya çıktı, kalbim bugün idrar yaptı\" ile başlar; Medine'de Peygamber'in önünde özür dileyip övgü dileyerek onu \"Allah'ın kılıçlarından çıkarılmış bir ışık ve kalkan\" olarak tanımlamıştır."
  id: "Puisi terkenal Ka'b ibn Zuhayr, yang dimulai dengan \"Suad telah muncul, hatiku kencing hari ini,\" yang ia bacakan di hadapan Nabi di Madinah sambil meminta maaf dan memujinya, menggambarkannya sebagai \"cahaya yang diterangi dan perisai yang ditarik dari pedang Tuhan.\""
