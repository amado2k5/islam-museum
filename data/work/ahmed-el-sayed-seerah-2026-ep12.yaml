label:
  ar: "سيرة رسول الله 2026، الحلقة 12: سيرة رسول الله 12 | السور القرآنية الأولى ومضامين الرسالة"
  en: "The Biography of the Messenger of God 2026, episode 12: The first Qur'anic chapters and the themes of the message"
  ur: "سیرتِ رسول اللہ 2026، قسط 12: ابتدائی قرآنی سورتیں اور پیغام کے مضامین"
  fr: "La biographie du Messager de Dieu 2026, épisode 12 : Les premières sourates et les thèmes du message"
  es: "La biografía del Mensajero de Dios 2026, episodio 12: Las primeras suras coránicas y los temas del mensaje"
summary:
  ar: "يتأمل المحاضر فيما قد يكون القرآن نزل به في السنوات الثلاث للدعوة الخفية، ويقدّم أحكامًا مبدئية في تحديد السور المبكرة، وفيما قاله المشركون عن النبي في تلك المرحلة. ثم ينتقل إلى الدعوة الجهرية من الصفا كما رواها البخاري، ويستخرج منها معنى أداء الأمانة، ويختم بملاحظات لغوية وبكتاب في أنساب البطون."
  en: "The lecturer reflects on what the Qur'an may have brought down during the three years of the quiet call, offering tentative judgements on which chapters are early, and on what the polytheists said about the Prophet in that phase. He then turns to the public call from al-Safa as reported in al-Bukhari, draws out the theme of fulfilling a trust, and closes with language notes and a clan-genealogy book."
  ur: "مقرر غور کرتا ہے کہ خاموش دعوت کے تین برسوں میں قرآن کیا لے کر اترا ہوگا، ابتدائی سورتوں کے تعین پر عارضی رائے دیتا ہے، اور اس مرحلے میں مشرکین نبی کے بارے میں کیا کہتے تھے۔ پھر وہ بخاری کی روایت کے مطابق صفا سے اعلانیہ دعوت کی طرف آتا ہے، امانت ادا کرنے کا مضمون نکالتا ہے، اور لغوی نکات اور قبیلوں کے نسب کی ایک کتاب پر ختم کرتا ہے۔"
  fr: "Le conférencier réfléchit à ce que le Coran a pu apporter durant les trois années de l'appel discret, propose des jugements prudents sur les sourates anciennes et sur ce que disaient les polythéistes du Prophète à cette étape. Il passe ensuite à l'appel public depuis al-Safa tel que rapporté par al-Bukhari, en dégage le thème de l'accomplissement d'une charge confiée, et termine par des notes de langue et un livre sur les généalogies des clans."
  es: "El conferenciante reflexiona sobre lo que el Corán pudo traer durante los tres años de la llamada discreta, ofrece juicios tentativos sobre qué suras son tempranas y sobre lo que decían los politeístas del Profeta en esa etapa. Luego pasa a la llamada pública desde al-Safa según la relata al-Bukhari, extrae el tema del cumplimiento de una confianza y cierra con notas de lengua y un libro de genealogías de clanes."
