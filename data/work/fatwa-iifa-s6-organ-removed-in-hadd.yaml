label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن زراعة عضو استؤصل في حد أو قصاص", en: "IIFA resolution on transplanting an organ removed under a hadd or qisas", ur: "اکیڈمی کی قرارداد: حد یا قصاص میں کاٹے گئے عضو کی پیوندکاری", es: "Resolución de la IIFA sobre el trasplante de un órgano extirpado bajo un hadd o qisas" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: لا يجوز إعادة العضو المقطوع تنفيذًا للحد لأن في بقاء أثر الحد تحقيقًا كاملًا للعقوبة المقررة ومنعًا للتهاون في استيفائها، وبما أن القصاص شرع لإقامة العدل وإنصاف المجني عليه وصون حق الحياة فلا يجوز إعادة ما قطع قصاصًا على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990): an organ cut off in executing a hadd may not be reattached, since the hadd mark remaining completes the prescribed penalty and deters laxity in its execution; and since qisas was legislated to establish justice and protect the community's life-right, what was cut in qisas may not be restored — as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: حد یا قصاص میں کاٹا گیا عضو دوبارہ جوڑنا جائز نہیں تاکہ مقررہ سزا مکمل رہے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990): un órgano cortado al ejecutar un hadd no puede ser reimplantado, ya que la marca del hadd que queda completa la pena prescrita y disuade la negligencia en su ejecución; y dado que el qisas fue legislado para establecer la justicia y proteger el derecho a la vida de la comunidad, lo que fue cortado en el qisas no puede ser restaurado, como detalla la resolución."
