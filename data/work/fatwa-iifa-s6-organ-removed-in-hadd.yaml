id: work/fatwa-iifa-s6-organ-removed-in-hadd
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن زراعة عضو استؤصل في حد أو قصاص", en: "IIFA resolution on transplanting an organ removed under a hadd or qisas", ur: "اکیڈمی کی قرارداد: حد یا قصاص میں کاٹے گئے عضو کی پیوندکاری", es: "Resolución de la IIFA sobre el trasplante de un órgano extirpado bajo un hadd o qisas", fr: "Résolution de l'IIFA sur la transplantation d'un organe prélevé sous anesthésie générale ou par anesthésie locale", tr: "Uluslararası İslami Fiqh Akademisi'nin hadd veya kısa organ nakli ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai transplantasi organ untuk hadd atau qisas" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: لا يجوز إعادة العضو المقطوع تنفيذًا للحد لأن في بقاء أثر الحد تحقيقًا كاملًا للعقوبة المقررة ومنعًا للتهاون في استيفائها، وبما أن القصاص شرع لإقامة العدل وإنصاف المجني عليه وصون حق الحياة فلا يجوز إعادة ما قطع قصاصًا على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990): an organ cut off in executing a hadd may not be reattached, since the hadd mark remaining completes the prescribed penalty and deters laxity in its execution; and since qisas was legislated to establish justice and protect the community's life-right, what was cut in qisas may not be restored — as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: حد یا قصاص میں کاٹا گیا عضو دوبارہ جوڑنا جائز نہیں تاکہ مقررہ سزا مکمل رہے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990): un órgano cortado al ejecutar un hadd no puede ser reimplantado, ya que la marca del hadd que queda completa la pena prescrita y disuade la negligencia en su ejecución; y dado que el qisas fue legislado para establecer la justicia y proteger el derecho a la vida de la comunidad, lo que fue cortado en el qisas no puede ser restaurado, como detalla la resolución."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990): un organe coupé lors de l'exécution d'un hadd ne peut être rattaché, car la marque du hadd restant complète la peine prescrite et dissuade le laxisme dans son exécution; et puisque le qisas a été légiféré pour établir la justice et protéger le droit à la vie de la communauté, ce qui a été coupé dans le cadre du qisas ne peut être restitué — comme le précise la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) kararı: Hadd cezasının uygulanmasında kesilen uzvun geri verilmesine izin verilmez, çünkü haddın kalan etkisi öngörülen cezayı tam olarak yerine getirir ve ihmalin uygulanmasını engeller. İntikam, adalet, mağdur için adalet sağlamak ve yaşam hakkını korumak amacıyla yasalaştırıldığından, kararda ayrıntılı olarak belirtilen misilleme kararının yeniden yürürlüğe konması mümkün değildir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Tidak diperbolehkan mengembalikan anggota tubuh yang diamputasi dalam pelaksanaan hukuman hadd, karena efek sisa dari hadd sepenuhnya memenuhi hukuman yang ditetapkan dan mencegah kelalaian dalam pelaksanaannya. Karena pembalasan diatur untuk menegakkan keadilan, keadilan bagi korban, dan untuk mempertahankan hak atas hidup, tidak diperbolehkan mengembalikan apa yang telah diputuskan sebagai pembalasan sebagaimana dirinci dalam keputusan."
