summary:
  ar: "رسالة للخطيب البغدادي ⁦(ت 463هـ)⁩ تميز علم نجوم مقبولًا له أصل في القرآن والسنة والآثار من علم مردود، محفوظة في نسخة واحدة في السليمانية، ونقل عنها السيوطي {cite:heinen-islamic-cosmology p. 34} {cite:heinen-islamic-cosmology p. 35}."
  en: "A treatise by al-Khatib al-Baghdadi (d. 463 AH) distinguishing an acceptable science of the stars rooted in Qur'an, Sunna and early reports from a rejected one, extant in a single Süleymaniye manuscript and quoted by al-Suyuti {cite:heinen-islamic-cosmology p. 34} {cite:heinen-islamic-cosmology p. 35}."
  ur: "خطیب بغدادی ⁦(م 463ھ)⁩ کا رسالہ جو قرآن، سنت اور آثار میں اصل رکھنے والے مقبول علمِ نجوم کو مردود علم سے الگ کرتا ہے؛ سلیمانیہ میں واحد نسخہ، سیوطی نے اس سے نقل کیا {cite:heinen-islamic-cosmology p. 35}."
  es: "Un tratado de al-Khatib al-Baghdadi (m. 463 AH) que distingue una ciencia aceptable de las estrellas arraigada en el Corán, la Sunna y los primeros informes de una rechazada, existente en un único manuscrito de Süleymaniye y citado por al-Suyuti {cite:heinen-islamic-cosmology p. 34} {cite:heinen-islamic-cosmology p. 35}."
  fr: "Un traité d'al-Khatib al-Baghdadi (mort en 463 AH) distinguant une science acceptable des étoiles enracinée dans le Coran, la Sunna et les premiers rapports d'une science rejetée, existant dans un seul manuscrit de Süleymaniye et cité par al-Suyuti {cite:heinen-islamic-cosmology p. 34} {cite:heinen-islamic-cosmology p. 35}."
  tr: "El-Hatib El-Bağdadi'nin (ö. 463 H yılı) yıldız bilimini, Kur'an, Sünnet ve geleneklere dayanan kabul edilen bir biçim olarak ayıran ve reddedilen bilimden ayıran bir risale, Süleymaniye'de tek bir kopyada korunmuş ve Al-Suyuti tarafından alıntılanmıştır {cite:heinen-Islamic-cosmology, s. 34} {cite:heinen-islamic-cosmology, s. 35}."
  id: "Sebuah risalah oleh Al-Khatib Al-Baghdadi (wafat 463 H) yang membedakan ilmu bintang sebagai bentuk yang diterima dengan dasar dalam Al-Qur'an, Sunnah, dan tradisi dari ilmu yang ditolak, yang disimpan dalam satu salinan di Sulaymaniyah, dan dikutip oleh Al-Suyuti {cite:heinen-Islamic-cosmology, hlm. 34} {cite:heinen-islamic-cosmology, hlm. 35}."
