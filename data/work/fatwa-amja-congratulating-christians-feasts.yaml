id: work/fatwa-amja-congratulating-christians-feasts
class: work
kind: fatwa
label: { ar: "تهنئة النصارى بأعيادهم عند ابن القيم والقرضاوي", en: "Congratulating Christians on their feasts — Ibn al-Qayyim and al-Qaradawi", ur: "مسیحیوں کو تہواروں کی مبارکباد — ابن قیم اور قرضاوی", es: "Felicitando a los cristianos en sus festividades — Ibn al-Qayyim y al-Qaradawi", fr: "Félicitations aux chrétiens à l'occasion de leurs fêtes — Ibn al-Qayyim et al-Qaradawi", tr: "Hristiyanlar, İbn el-Kayyim ve el-Karadavi'ye göre bayramlarını kutluyorlar", id: "Orang Kristen mengucapkan selamat pada hari raya mereka menurut Ibn al-Qayyim dan al-Qaradawi" }
summary:
  ar: "سأل سائل عن فتوى ابن القيم أن التهنئة بشعائر الكفر المختصة به حرام بالاتفاق كتهنئتهم بأعيادهم وصومهم، وعن قول الشيخ القرضاوي أن من حق كل طائفة أن تحتفل بعيدها بما لا يؤذي الآخرين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83113 بتاريخ 14 نوفمبر 2010)⁩ أن قول القرضاوي يشير إلى ما اتفق عليه أهل العلم من إقرار أهل الذمة وما يدينون فلا يتعرض لهم عند ممارستهم شعائرهم، وأما التهنئة فلا حرج فيها إن كانت عن المناسبات الاجتماعية لكنها موضع نظر إن كانت عن الأعياد الدينية، وكلام ابن القيم في هذا أقوم قيلًا وأهدى سبيلًا عنده."
  en: "A questioner cited Ibn al-Qayyim's ruling that congratulating disbelievers on their distinctive rituals — their feasts and fasts — is forbidden by consensus, against al-Qaradawi's saying every group may celebrate its feast without harming others. Dr. Salah al-Sawi (fatwa no. 83113, 14 November 2010) answered that al-Qaradawi's words point to the scholars' agreement on leaving the dhimmis to their creed and not disturbing their rituals; congratulations on social occasions carry no harm, but on religious feasts the matter is doubtful, and Ibn al-Qayyim's words are in his view the sounder and better-guided. Recorded as AMJA's answer."
  ur: "ایک سائل نے ابن قیم کے مسیحیوں کے تہواروں کی مبارکباد کے منع اور قرضاوی کے قول کے فرق پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83113، 14 نومبر 2010)⁩ کے مطابق سماجی مواقع کی مبارکباد میں حرج نہیں مگر مذہبی تہوار مشتبہ ہے اور ابن قیم کا قول مضبوط تر ہے۔"
  es: "Un consultante citó la opinión de Ibn al-Qayyim de que felicitar a los no creyentes por sus rituales distintivos —sus fiestas y ayunos— está prohibido por consenso, en contraposición a la afirmación de al-Qaradawi de que cada grupo puede celebrar su fiesta sin perjudicar a los demás. El Dr. Salah al-Sawi (fatwa n.º 83113, 14 de noviembre de 2010) respondió que las palabras de al-Qaradawi apuntan al acuerdo de los eruditos de dejar a los dhimmis con su credo y no perturbar sus rituales; las felicitaciones en ocasiones sociales no causan daño, pero en las fiestas religiosas el asunto es dudoso, y las palabras de Ibn al-Qayyim son, en su opinión, más sólidas y mejor guiadas. Registrado como respuesta de AMJA."
  fr: "Un interlocuteur a cité l'avis d'Ibn al-Qayyim selon lequel il est interdit, par consensus, de féliciter les non-croyants pour leurs rites spécifiques – leurs fêtes et leurs jeûnes –, contrairement à l'avis d'al-Qaradawi selon lequel chaque groupe peut célébrer sa fête sans nuire à autrui. Le Dr Salah al-Sawi (fatwa n° 83113, 14 novembre 2010) a répondu que les propos d'al-Qaradawi témoignent du consensus des savants sur le respect de la croyance des dhimmis et la non-ingérence dans leurs rites; les félicitations lors d'occasions sociales ne sont pas nuisibles, mais la question est plus délicate concernant les fêtes religieuses, et l'avis d'Ibn al-Qayyim est, selon lui, plus judicieux et mieux guidé. Cette réponse a été consignée dans l'AMJA."
  tr: "Bir soruya İbn al-Kayyim'in fetvası, belirli inkar ritüellerini tebrik etmenin, tıpkı bayramları ve oruçları için tebrik etmek gibi, oybirliğiyle yasak olduğu ve Şeyh al-Karadavinin her tarikatın bayramını başkalarına zarar vermeyecek şekilde kutlama hakkı olduğu yönündeki açıklaması hakkında sorular soruldu. Dr. Salah Al-Sawi (14 Kasım 2010 tarihli Fetva No. 83113) cevabında el-Karadavinin ifadesinin, zimmilerin ve borçlarının kabulü konusunda alimlerin üzerinde anlaştıkları şeylere atıfta bulunduğunu, bu yüzden ritüellerini uygularken ele alınmaması gerektiğini söyledi. Tebrikler ise sosyal etkinliklerle ilgili olursa zarar yoktur, ancak dini bayramlarla ilgiliyse dikkate alınması gereken bir konudur. İbn el-Kayyim'in bu konudaki ifadesi ona göre konuşma ve rehberlik açısından daha doğrudur."
  id: "Seorang penanya ditanya tentang fatwa Ibn al-Qayyim yang menyatakan bahwa mengucapkan selamat atas ritual ketidakpercayaan tertentu secara bulat dilarang, sama seperti mengucapkan selamat pada hari raya dan puasa mereka, serta tentang pernyataan Sheikh al-Qaradawi bahwa setiap sekte berhak merayakan hari rayanya dengan cara yang tidak merugikan orang lain. Dr. Salah Al-Sawi menjawab (Fatwa No. 83113 tanggal 14 November 2010) bahwa pernyataan al-Qaradawi merujuk pada apa yang telah disepakati para ulama mengenai pengakuan dhimmi dan hutangnya, sehingga mereka tidak boleh disambut saat menjalankan ritual mereka. Adapun ucapan selamat, tidak ada salahnya jika itu tentang acara sosial, tetapi itu adalah hal yang perlu dipertimbangkan jika menyangkut hari raya keagamaan. Menurut beliau, pernyataan Ibn al-Qayyim mengenai hal ini lebih tepat dalam bentuk ucapan dan bimbingan."
