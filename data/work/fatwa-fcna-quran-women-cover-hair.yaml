class: work
kind: fatwa
label: { ar: "هل يأمر القرآن المرأة بتغطية شعرها؟", en: "Does the Qur'an tell women to cover their hair?", ur: "کیا قرآن عورتوں کو بال ڈھانپنے کا کہتا ہے؟", es: "¿Acaso el Corán ordena a las mujeres que se cubran el cabello?", fr: "Le Coran ordonne-t-il aux femmes de se couvrir les cheveux ?", tr: "Kur'an kadınlara saçlarını kapatmalarını emir mi?", id: "Apakah Al-Qur'an memerintahkan wanita menutupi rambut mereka?" }
summary:
  ar: "سؤال عما إذا كان القرآن يأمر المرأة بتغطية شعرها وهل يكفي اللباس المحتشم دونه. أجاب الشيخ مصطفى عمر في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2021)⁩ ببيان الدليل على وجوب ستر الشعر على ما فصّل الجواب."
  en: "A question asking whether the Qur'an tells women to cover their hair, or if modest clothing without it is acceptable. Shaykh Mustafa Umar answered on the Fiqh Council of North America site (published November 2021), setting out the evidence that covering the hair is required — as the answer details."
  ur: "کیا قرآن عورت کو بال ڈھانپنے کا حکم دیتا ہے یا صرف باصفا لباس کافی ہے؟ شیخ مصطفیٰ عمر نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ جواب دیا جس میں ستر کے دلیل بیان ہے۔"
  es: "Una pregunta planteaba si el Corán ordena a las mujeres cubrirse el cabello o si es aceptable usar ropa modesta sin cubrirlo. El jeque Mustafa Umar respondió en el sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado en noviembre de 2021), exponiendo las pruebas que justifican la obligatoriedad de cubrirse el cabello, tal como se detalla en la respuesta."
  fr: "Une question portait sur le point de savoir si le Coran ordonne aux femmes de se couvrir les cheveux, ou si une tenue vestimentaire modeste sans voile est acceptable. Le cheikh Mustafa Umar y a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication: novembre 2021), en présentant les arguments justifiant l'obligation de se couvrir les cheveux, comme le détaille sa réponse."
  tr: "Kur'an'ın kadınlara saçlarını kapatmalarını emretip vermediği ve altındaki mütevazı kıyafetlerin yeterli olup olmadığı sorusu. Şeyh Mustafa Omar, Kuzey Amerika Fiqh Konseyi web sitesinde (Kasım 2021'de yayımlanan) yanıtında yanıtta, saçın kapatılması zorunluluğuna ilişkin kanıtları cevabında detaylandırılarak açıkladı."
  id: "Pertanyaan tentang apakah Al-Qur'an memerintahkan perempuan menutupi rambut mereka dan apakah pakaian sopan di bawahnya sudah cukup. Sheikh Mustafa Omar menanggapi di situs web Fiqh Council of North America (diterbitkan November 2021) dengan memperjelas bukti kewajiban menutupi rambut seperti yang dijelaskan dalam jawaban."
