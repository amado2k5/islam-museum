id: work/fatwa-amja-vow-fast-libya
class: work
kind: fatwa
label: { ar: "نذر صيام شهر بغير تتابع", en: "A vow to fast a month, consecutiveness not required", ur: "مہینے کے روزوں کی نذر — لگاتار شرط نہیں", es: "Un voto de ayuno de un mes, no se requiere que sea consecutivo." }
summary:
  ar: "سأل سائل نذر صيام شهر عند تحرير ليبيا فصام خمسة عشر يومًا ثم توقف هل يلزمه التتابع أم يجوز فصل الأيام. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86132 بتاريخ 12 ديسمبر 2011)⁩ أن من نذر أن يطيع الله فليطعه ونذر الصوم من جنس نذر الطاعة فيجب الوفاء به، وما دام لم يشترط في نذره التتابع فلا يلزمه وإنما يكفيه أن يكمل العدة."
  en: "A man vowed to fast a month upon Libya's liberation, fasted fifteen days then stopped, and asked whether consecutiveness is required or the days may be split. Dr. Salah al-Sawi (fatwa no. 86132, 12 December 2011) answered that whoever vows to obey God should obey Him — a vow to fast is an obedience-vow and must be fulfilled; since he did not stipulate consecutiveness it is not binding, and completing the count suffices."
  ur: "ایک شخص نے لبیا کی آزادی پر مہینے کے روزوں کی نذر مانی اور پندرہ دن بعد رک گیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86132، 12 دسمبر 2011)⁩ کے مطابق نذر طاعت وفا کے قابل ہے؛ تسلسل شرط نہ کیا ہو تو بس تعداد پوری کرے۔"
  es: "Un hombre prometió ayunar un mes tras la liberación de Libia, ayunó quince días y luego interrumpió el ayuno, preguntando si era necesario que los días fueran consecutivos o si se podían dividir. El Dr. Salah al-Sawi (fatwa n.º 86132, 12 de diciembre de 2011) respondió que quien promete obedecer a Dios debe obedecerle; un voto de ayuno es un voto de obediencia y debe cumplirse. Dado que no estipuló que los días fueran consecutivos, no es vinculante, y basta con completar el conteo."
