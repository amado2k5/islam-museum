id: work/fatwa-aliftaa-jo-a-canteen-manager-taking-supplier-bonuses
class: work
kind: fatwa
label: { ar: "استغلال المقصف المدرسي للمصلحة الشخصية", en: "A school canteen manager taking supplier bonuses", ur: "اسکول کینٹین کے منتظم کا ذاتی فائدہ اٹھانا" }
summary:
  ar: "سؤال عن استغلال المقصف المدرسي للمصلحة الشخصية، أجابت فيه دائرة الإفتاء العام الأردنية بأن المقصف المدرسي يقوم على المشاركة والمضاربة، ومسؤوله وكيل يده يد أمانة، فلا يجوز له أخذ زيادات التجار أو الهدايا لنفسه، ويجب عليه رد ما أخذ إلى المقصف. أجابت الدائرة بأن المقاصف المدرسية تقوم في تكييفها الفقهي على عقد المشاركة والمضاربة؛ يشترك المساهمون في رأس المال ثم يوكلون شخصًا بإدارة المقصف، وتكون الأرباح معلومة على الشيوع في العقد. وقالت إن المضارب بمنزلة الوكيل الذي ارتضاه رب المال للتجارة، فيده يد أمانة ويجب عليه حفظ مصلحة من وكله، واستشهدت بحديث رواه البخاري معناه أن كل واحد راع ومسؤول عن رعيته، ونقلت عن الشهاب الرملي في حاشيته على أسنى المطالب (2/257) أن الشريك كالوكيل يتصرف بالمصلحة. وقالت إنه لا يجوز لمسؤول المقصف أن يأخذ من زيادات التجار (البونص) أو يقبل الهدايا لمصلحته الشخصية، وإلا كان خائنًا للأمانة آكلًا للحرام، ويكون إثمه أكبر إن زاد الثمن على الطلاب، واستشهدت بـ[[passage/quran-4-29|سورة النساء 4:29]]. وخلصت إلى أن من أخذ شيئًا من ذلك وجب عليه رده إلى المقصف، وأن على المضارب أن يكون أمينًا ناصحًا لمن يعمل لديهم حتى تبرأ ذمته."
  en: "A question about a school canteen manager taking supplier bonuses, in which Jordan's General Iftaa Department answered that a school canteen is run as a partnership and profit-sharing arrangement (mudaraba) and its manager is an agent holding it in trust, so he may not take supplier bonuses or gifts for himself and must return anything he has taken to the canteen. The Department answered that school canteens are, in legal terms, a partnership and profit-sharing (mudaraba) contract: the contributors pool the capital and then appoint someone to run the canteen and its affairs, with the profits set as known shares in the contract. It said the managing partner is like an agent whom the owners of the capital have chosen to trade on their behalf, so he holds the property in trust and must safeguard the interests of those who appointed him, citing a hadith narrated by al-Bukhari whose meaning is that each of you is a shepherd responsible for his flock, and quoting al-Shihab al-Ramli's gloss on Asna al-Matalib (2/257) that a partner is like an agent and must act in the interest of the others. It said the canteen manager may not take suppliers' extra allowances (bonuses) or accept gifts for his own benefit; otherwise he betrays his trust and consumes what is unlawful, and his sin is greater if he raised prices for the pupils, citing [[passage/quran-4-29|Surat al-Nisa' 4:29]]. It concluded that whoever has taken any of this must return it to the canteen, and the manager must be trustworthy and act in good faith toward those he works for so that he is free of liability."
  ur: "اسکول کینٹین کے منتظم کا ذاتی فائدہ اٹھانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسکول کینٹین شراکت اور مضاربت کی بنیاد پر چلتی ہے اور اس کا منتظم امانت دار وکیل ہے، اس لیے وہ سپلائرز کے بونس یا تحفے اپنے لیے نہیں لے سکتا اور جو لیا ہو اسے کینٹین کو لوٹانا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہی لحاظ سے اسکول کینٹین شراکت اور مضاربت کا عقد ہے: حصہ دار سرمایہ ملاتے ہیں پھر کسی کو کینٹین اور اس کے معاملات چلانے کا وکیل بناتے ہیں، اور عقد میں منافع مشترک معلوم حصوں کی صورت میں طے ہوتا ہے۔ اس نے کہا کہ مضارب اس وکیل کی طرح ہے جسے سرمایہ کے مالکوں نے تجارت کے لیے پسند کیا، اس لیے اس کا قبضہ امانت کا ہے اور اس پر اپنے مؤکلوں کے مفاد کی حفاظت واجب ہے، اور بخاری کی روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ تم میں سے ہر ایک نگہبان ہے اور اپنی رعیت کا ذمہ دار ہے، اور اسنی المطالب پر شہاب رملی کے حاشیے (2/257) سے نقل کیا کہ شریک وکیل کی طرح ہے اور مصلحت کے مطابق تصرف کرتا ہے۔ اس نے کہا کہ کینٹین کا ذمہ دار سپلائرز کے اضافی الاؤنس (بونس) نہیں لے سکتا اور نہ ذاتی فائدے کے لیے تحفے قبول کر سکتا ہے؛ ورنہ وہ امانت میں خیانت کرنے والا اور حرام کھانے والا ہے، اور اگر اس نے طلبہ پر قیمت بڑھائی تو گناہ اور بڑا ہے، اور [[passage/quran-4-29|سورۃ النساء 4:29]] کا حوالہ دیا۔ اس نے نتیجہ نکالا کہ جس نے اس میں سے کچھ لیا ہو اس پر اسے کینٹین کو واپس کرنا واجب ہے، اور منتظم کو چاہیے کہ جن کے لیے کام کرتا ہے ان کا امانت دار اور خیر خواہ رہے تاکہ اس کا ذمہ بری ہو۔"
