id: work/fatwa-dar-alifta-eg-barrier-preventing-purity
class: work
kind: fatwa
label: { ar: "ضابط الحائل الذي يمنع صحة الطهارة", en: "The criterion of the barrier that invalidates ablution", ur: "وہ حائل جس کی وجہ سے طہارت درست نہیں ہوتی — اس کا ضابط", es: "El criterio de la barrera que invalida la ablución", fr: "Le critère de la barrière qui invalide l'ablution" }
summary:
  ar: "سائل سأل عن ضابط الحائل الذي يمنع صحة الطهارة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21856)⁩ أن الأصل وجوب إزالة كل حائل يمنع وصول الماء إلى الجسد عند إرادة الطهارة حال القدرة عليها وبيّن الجواب الضابط على وجهه."
  en: "A questioner asked about the criterion of the barrier that prevents valid ablution. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21856) answered that the default is the duty of removing every barrier preventing water reaching the body when purification is intended and one is able; the answer sets out the criterion."
  ur: "ایک سائل نے اس حائل کا ضابط پوچھا جو طہارت کو درست نہیں ہونے دیتا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21856)⁩ نے جواب دیا کہ اصول یہ ہے کہ جب طہارت کا ارادہ ہو اور استطاعت ہو تو ہر وہ چیز ہٹانا واجب ہے جو پانی کے جسم تک پہنچنے سے روکے؛ جواب میں اس کا ضابط بیان ہوا۔"
  es: "Un consultante preguntó sobre el criterio de la barrera que impide una ablución válida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21856) respondió que la norma general es el deber de eliminar toda barrera que impida que el agua llegue al cuerpo cuando se pretende la purificación y se tiene la posibilidad de hacerlo; la respuesta establece el criterio."
  fr: "Un internaute a posé une question concernant le critère de l'obstacle empêchant une ablution valide. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21856) a répondu que, par défaut, il est du devoir de lever tout obstacle empêchant l'eau d'atteindre le corps lors de la purification, lorsque celle-ci est voulue et possible; la réponse énonce le critère."
