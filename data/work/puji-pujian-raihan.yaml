summary:
  ar: "الألبوم الأول لفرقة النشيد الماليزية ريحان، من إنتاج فريحين عبد الفتاح، صدر عن وارنر ميوزك ماليزيا بين أكتوبر 1996 ويناير 1997 بعشر أغان بالملايوية؛ تقول المصادر إنه أكثر الألبومات مبيعا في ماليزيا، بأكثر من 750 ألف نسخة فيها وشهادة بلاتين اثنتي عشرة مرة، وبلاتين مضاعف في سنغافورة."
  en: "The debut album of the Malaysian nasheed group Raihan, produced by Farihin Abdul Fattah and released by Warner Music Malaysia between October 1996 and January 1997 with ten songs in Malay; its sources call it the best-selling album in Malaysian history, with more than 750,000 copies there, twelve-times platinum, and double platinum in Singapore."
  ur: "ملائیشیائی نشید گروپ ریحان کا پہلا البم، جسے فریحین عبدالفتاح نے پروڈیوس کیا اور وارنر میوزک ملائیشیا نے اکتوبر 1996 اور جنوری 1997 کے درمیان دس ملے گیتوں کے ساتھ جاری کیا؛ ماخذ اسے ملائیشیا کی تاریخ کا سب سے زیادہ بکنے والا البم کہتے ہیں۔"
