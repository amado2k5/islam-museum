id: work/puji-pujian-raihan
class: work
kind: album
label: { ar: "بوجي بوجيان ⁦(التسابيح)⁩", en: "Puji-Pujian", ur: "پوجی پوجیان", es: "Puji-Pujian", fr: "Puji-Pujian", tr: "Boji Boujian (Tesbih)", id: "Boji Boujian (Rosario)" }
summary:
  ar: "الألبوم الأول لفرقة النشيد الماليزية ريحان، من إنتاج فريحين عبد الفتاح، صدر عن وارنر ميوزك ماليزيا بين أكتوبر 1996 ويناير 1997 بعشر أغان بالملايوية؛ تقول المصادر إنه أكثر الألبومات مبيعا في ماليزيا، بأكثر من 750 ألف نسخة فيها وشهادة بلاتين اثنتي عشرة مرة، وبلاتين مضاعف في سنغافورة."
  en: "The debut album of the Malaysian nasheed group Raihan, produced by Farihin Abdul Fattah and released by Warner Music Malaysia between October 1996 and January 1997 with ten songs in Malay; its sources call it the best-selling album in Malaysian history, with more than 750,000 copies there, twelve-times platinum, and double platinum in Singapore."
  ur: "ملائیشیائی نشید گروپ ریحان کا پہلا البم، جسے فریحین عبدالفتاح نے پروڈیوس کیا اور وارنر میوزک ملائیشیا نے اکتوبر 1996 اور جنوری 1997 کے درمیان دس ملے گیتوں کے ساتھ جاری کیا؛ ماخذ اسے ملائیشیا کی تاریخ کا سب سے زیادہ بکنے والا البم کہتے ہیں۔"
  es: "El álbum debut del grupo malasio de nasheed Raihan, producido por Farihin Abdul Fattah y lanzado por Warner Music Malaysia entre octubre de 1996 y enero de 1997 con diez canciones en malayo; sus fuentes lo consideran el álbum más vendido en la historia de Malasia, con más de 750.000 copias allí, doce veces platino y doble platino en Singapur."
  fr: "Le premier album du groupe malaisien de nasheed Raihan, produit par Farihin Abdul Fattah et sorti chez Warner Music Malaysia entre octobre 1996 et janvier 1997, comprend dix chansons en malais; selon certaines sources, il s'agit de l'album le plus vendu de l'histoire de la Malaisie, avec plus de 750 000 exemplaires écoulés, douze fois disque de platine et double disque de platine à Singapour."
  tr: "Malezya marş grubu Rehan'ın ilk albümü, Farihin Abdul Fattah tarafından üretildi ve Warner Music Malaysia tarafından Ekim 1996 ile Ocak 1997 arasında on şarkı Malayca olarak yayımlandı; kaynaklar, Malezya'da en çok satan albüm olduğunu söylüyor; orada 750.000'den fazla kopya, on iki kat platin ve Singapur'da çift platin sattı."
  id: "Album pertama dari grup anthem Malaysia Rehan, yang diproduseri oleh Farihin Abdul Fattah, dirilis oleh Warner Music Malaysia antara Oktober 1996 dan Januari 1997 dengan sepuluh lagu dalam bahasa Melayu; sumber mengatakan ini adalah album terlaris di Malaysia, dengan lebih dari 750.000 kopi terjual di sana, dua belas kali platinum, dan double platinum di Singapura."
