label: { ar: "قرار مجمع الفقه الإسلامي الدولي 119 (13/1) بشأن استثمار الأوقاف ومواردها ⁦(مؤجل)⁩", en: "IIFA resolution 119 (13/1) on the investment of waqfs and their resources ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 119 (13/1): اوقاف اور ان کے وسائل کی سرمایہ کاری ⁦(مؤجل)⁩", es: "Resolución 119 (13/1) de la IIFA sobre la inversión de los waqfs y sus recursos (aplazada)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩، بعد اطلاعه على البحوث المقدمة في موضوع استثمار الأوقاف ومواردها في الدورتين الثانية عشرة والثالثة عشرة، وعلى قرار المجمع بشأن الوقف في دورته الرابعة. قرر تأجيل النظر في الموضوع لإصدار قراره الخاص إلى دورة قادمة لمزيد من الدراسة والبحث. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا؛ وقد عاد المجمع إلى الموضوع فقرر فيه بقرار 140 ⁦(15/6)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001), after reviewing the research papers on investing waqfs and their resources presented at the 12th and 13th sessions and its earlier waqf resolution from the 4th session. It deferred deciding the topic to a later session for further study and research. Recorded as a deferral, not a final ruling; the Academy returned to the subject in resolution 140 (15/6)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں، بارہویں اور تیرہویں مجلس میں پیش کیے گئے اوقاف کی سرمایہ کاری کے مقالہ جات اور چوتھی مجلس کے وقف فیصلے کے مطالعے کے بعد۔ اس نے موضوع کے فیصلے کو مزید تحقیق کے لیے آئندہ مجلس تک مؤجل کیا۔ یہ مؤجل ہے، حتمی حکم نہیں؛ اکیڈمی بعد میں اس پر قرارداد 140 ⁦(15/6)⁩ میں فیصلہ کر چکی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 13.ª sesión celebrada en Kuwait (del 7 al 12 de Shawwal de 1422, del 22 al 27 de diciembre de 2001), tras revisar los trabajos de investigación sobre la inversión de los waqfs y sus recursos presentados en las sesiones 12.ª y 13.ª, así como su resolución anterior sobre waqfs de la 4.ª sesión. Se aplazó la decisión sobre el tema para una sesión posterior con el fin de profundizar en el estudio y la investigación. Si bien se registró como un aplazamiento, no como una resolución definitiva, la Academia retomó el tema en la resolución 140 (15/6)."
