id: work/fatwa-amja-game-killing-compensation
class: work
kind: fatwa
label: { ar: "جزاء قتل الصيد عمدًا وخطأً", en: "Compensation for game killed by intent or error", ur: "شکار کے قتل کا جزا — عمد اور خطا" }
summary:
  ar: "سأل سائل عن دليل من يحكم من أهل العلم بالجزاء في قتل الصيد في الحرم سواء كان عمدًا أو خطأ. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77597 بتاريخ 27 يناير 2009)⁩ أن الأصل في جزاء الصيد قوله تعالى في سورة المائدة يا أيها الذين آمنوا لا تقتلوا الصيد وأنتم حرم ومن قتله منكم متعمدًا فجزاء مثل ما قتل من النعم يحكم به ذوا عدل منكم هديًا بالغ الكعبة أو كفارة طعام مساكين أو عدل ذلك صيامًا ليذوق وبال أمره، وقد نصت الآية على وجوب الجزاء في المتعمد ودخل الخطأ في الحكم بالقياس على المتعمد في ضمان المتلفات حيث تتساوى الحرمة."
  en: "A questioner asked for the proof of scholars who rule compensation for game killed in the sanctuary whether intended or accidental. Dr. Salah al-Sawi (fatwa no. 77597, 27 January 2009) answered that the basis is al-Ma'ida 95 — 'do not kill game while in ihram; whoever of you kills it intentionally owes the like of what he killed in cattle, judged by two just men of you, an offering reaching the Ka'ba, or expiation feeding the poor, or fasting its equal, that he taste the upshot of his deed' — the verse obliging the penalty for the intentional; the accidental case enters by analogy on the intentional under liability for destroyed property, where the prohibition stands equal."
  ur: "ایک سائل نے حرم کے شکار کے عمد و خطا کے جزا کی دلیل پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77597، 27 جنوری 2009)⁩ کے مطابق مائدہ 95 نے عمد کے لیے جزا مقرر کیا اور خطا قیاس سے اس میں داخل ہوا — تلف شدہ مال کی ضمانت میں حرمت برابر ہے۔"
