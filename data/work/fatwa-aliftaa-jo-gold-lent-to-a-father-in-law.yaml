id: work/fatwa-aliftaa-jo-gold-lent-to-a-father-in-law
class: work
kind: fatwa
label: { ar: "ذهب أُعطي لوالد الزوج ثم طولب به بعد وفاته", en: "Gold given to a father-in-law and claimed after his death", ur: "سسر کو دیا گیا سونا اور اس کی وفات کے بعد اس کا مطالبہ", es: "Oro entregado a un suegro y reclamado tras su muerte.", fr: "De l'or donné à un beau-père et réclamé après son décès", tr: "Kayınpedere verilen ve ölümünden sonra talep edilen bir altın.", id: "Emas yang diberikan kepada ayah mertua dan kemudian diminta setelah kematiannya." }
summary:
  ar: "سؤال من امرأة أعطت والد زوجها مصاغًا وأونصة ذهب ثم طالبت بحقها بعد وفاته فعرض الورثة مبلغًا نقديًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن القرض يُوفى على الوجه الذي أُخذ به، فمن اقترض ذهبًا رده ذهبًا وزنًا. أجابت الدائرة بأن القرض دفع مال لمن ينتفع به ليرد مثله، وأنه مباح للمقترض مندوب للمقرض، وأن الواجب أن يوفيه المقترض على الوجه الذي اقترضه به، فالنقود تُرد نقودًا والذهب يُرد ذهبًا وزنًا، لأن الملك في القرض يثبت بالقبض فيستقر في الذمة على ما قُبض. ونقلت قول الخطيب الشربيني في مغني المحتاج إن المثلي يُرد مثله في القرض لأنه أقرب إلى الحق، وقرار مجمع الفقه الإسلامي الدولي في دورته الخامسة بأن العبرة في وفاء الديون بالمثل لا بالقيمة. وفصلت بأن المقرضة إن باعت الذهب ودفعت ثمنه نقودًا وجب رد مقدار النقود، وإن دفعت الذهب نفسه ثم باعه المقترض لزم رد مثله وزنًا. وقالت إنه لا حرج في هذه الصورة في رده نقودًا حالًا باتفاق الطرفين يوم الوفاء لا قبله، على أن يُعتمد سعر الذهب يوم الوفاء ويتم التقابض في المجلس نفسه."
  en: "A question from a woman who gave her father-in-law gold jewellery and an ounce of gold and claimed her right after his death, when the heirs offered a cash sum, in which Jordan's General Iftaa Department answered that a loan is repaid in the form in which it was taken, so borrowed gold is returned as gold by weight. The Department answered that a loan is handing property to someone who benefits from it so that he returns its like, permitted for the borrower and recommended for the lender, and that the borrower must repay it in the form in which he borrowed it: cash is returned as cash and gold as gold by weight, because ownership in a loan is established on receipt and settles as a debt in the form received. It cited al-Khatib al-Shirbini's statement in Mughni al-Muhtaj that a fungible item is repaid with its like in a loan because that is closest to the lender's right, and the decision of the International Islamic Fiqh Academy at its fifth session that debts are repaid with their like, not their value. It distinguished two cases: if the lender sold the gold and handed over its price in cash, the amount of cash must be returned; if she handed over the gold itself and the borrower then sold it, its like must be returned by weight. It said that in the second case there is no objection to repaying in cash on the spot if both parties agree on the day of repayment rather than before, provided the gold price of that day is used and the exchange is completed in the same sitting."
  ur: "ایک خاتون کا سوال جس نے اپنے سسر کو سونے کے زیورات اور ایک اونس سونا دیا اور اس کی وفات کے بعد اپنا حق مانگا تو ورثا نے نقد رقم پیش کی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض اسی صورت میں ادا ہوتا ہے جس میں لیا گیا، اس لیے قرض لیا گیا سونا وزن کے حساب سے سونا ہی واپس ہوگا۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض کسی کو فائدہ اٹھانے کے لیے مال دینا ہے تاکہ وہ اس کا مثل واپس کرے، جو قرض لینے والے کے لیے جائز اور دینے والے کے لیے مستحب ہے، اور قرض لینے والے پر لازم ہے کہ اسی صورت میں ادا کرے جس میں لیا: نقدی نقدی کی صورت میں اور سونا وزن کے حساب سے سونے کی صورت میں، کیونکہ قرض میں ملکیت قبضے سے ثابت ہوتی ہے اور اسی صورت میں ذمے میں ٹھہرتی ہے۔ اس نے خطیب شربینی کا مغنی المحتاج میں یہ قول نقل کیا کہ قرض میں مثلی چیز کا مثل واپس کیا جائے کیونکہ یہ حق کے زیادہ قریب ہے، اور بین الاقوامی اسلامی فقہ اکیڈمی کے پانچویں اجلاس کا یہ فیصلہ کہ قرضوں کی ادائیگی میں مثل کا اعتبار ہے، قیمت کا نہیں۔ اس نے دو صورتیں الگ کیں: اگر قرض دینے والی نے سونا بیچ کر اس کی قیمت نقد دی تو نقدی کی وہی مقدار واپس کرنا لازم ہے؛ اور اگر اس نے خود سونا دیا اور قرض لینے والے نے اسے بیچا تو وزن کے حساب سے اس کا مثل واپس کرنا لازم ہے۔ اس نے کہا کہ دوسری صورت میں ادائیگی کے دن، نہ کہ اس سے پہلے، دونوں فریقوں کے اتفاق سے فوری نقد ادائیگی میں حرج نہیں، بشرطیکہ اسی دن کا سونے کا نرخ لیا جائے اور اسی مجلس میں لین دین مکمل ہو۔"
  es: "Una mujer que le regaló a su suegro joyas de oro y una onza de oro, y que reclamó su derecho tras su muerte, cuando los herederos ofrecieron una suma en efectivo, preguntó al Departamento General de Iftaa de Jordania si un préstamo se reembolsa en la forma en que se recibió, por lo que el oro prestado se devuelve como oro por peso. El Departamento explicó que un préstamo consiste en entregar bienes a alguien que se beneficia de ellos para que devuelva algo similar, lo cual está permitido para el prestatario y se recomienda para el prestamista, y que el prestatario debe reembolsarlo en la forma en que lo recibió: el efectivo se devuelve como efectivo y el oro como oro por peso, ya que la propiedad de un préstamo se establece al recibirlo y se liquida como deuda en la forma recibida. Citó la declaración de al-Khatib al-Shirbini en Mughni al-Muhtaj de que un bien fungible se reembolsa con algo similar en un préstamo porque eso es lo más cercano al derecho del prestamista, y la decisión de la Academia Internacional de Fiqh Islámico en su quinta sesión de que las deudas se reembolsan con algo similar, no con su valor. Se distinguieron dos casos: si el prestamista vendió el oro y entregó su precio en efectivo, se debe devolver la cantidad en efectivo; si entregó el oro y el prestatario lo vendió, se debe devolver su equivalente en peso. Se indicó que, en el segundo caso, no hay inconveniente en el pago en efectivo inmediato si ambas partes acuerdan hacerlo el día del pago, siempre que se utilice el precio del oro vigente ese día y el intercambio se complete en la misma transacción."
  fr: "Une femme a posé une question à son beau-père, lui ayant légué des bijoux en or et une once d'or, et revendiquant ses droits après son décès. Les héritiers lui ayant proposé une somme d'argent, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu qu'un prêt est remboursé sous la forme dans laquelle il a été contracté; l'or emprunté doit donc être restitué en or, au poids. Le Département a expliqué qu'un prêt consiste à confier un bien à celui qui en bénéficie, afin qu'il le restitue à son équivalent. Cette pratique est permise à l'emprunteur et recommandée au prêteur. L'emprunteur doit rembourser le prêt sous la forme dans laquelle il a été contracté: l'argent liquide est restitué en argent liquide et l'or en or, au poids. En effet, la propriété d'un prêt est établie dès sa réception et la dette est réglée sous la forme reçue. Le Département a cité l'avis d'al-Khatib al-Shirbini dans son ouvrage *Mughni al-Muhtaj*, selon lequel un bien fongible est remboursé à son équivalent dans le cadre d'un prêt, car cela correspond au mieux au droit du prêteur, ainsi que la décision de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa cinquième session, qui stipule que les dettes sont remboursées à leur équivalent, et non à leur valeur. Il a été établi une distinction entre deux cas: si le prêteur vend l’or et en remet le prix en espèces, la somme versée doit être restituée; si le prêteur remet l’or lui-même et que l’emprunteur le vend ensuite, son équivalent en poids doit être restitué. Il a été précisé que, dans le second cas, le remboursement en espèces immédiat n’est pas contesté si les deux parties en conviennent le jour même du remboursement, à condition que le cours de l’or de ce jour soit appliqué et que la transaction soit effectuée lors de la même séance."
  tr: "Kayınpederine mücevher ve bir ons altın veren ve ölümünden sonra haklarını talep eden bir kadından gelen soru. Varisler nakit bir miktar teklif etti. Ürdün Genel Fetva Dairesi, kredinin alındığı şekilde geri ödendiğini, yani altın alan kişinin ağırlık olarak altın olarak geri verdiğini yanıtladı. Daire, kredin, lehtara ödenen paranın geri ödenmesi için yapılan bir ödeme olduğunu ve borçlunun kredi verenin temsilcisi olarak hareket etmesinin izin verildiğini söyledi. Borçlunun borç aldığı şekilde geri ödemesi zorunludur. Para para olarak geri verilir, altın ise altın olarak geri verilir, çünkü kredi sahipliği mülkiyetle belirlenir ve böylece alınan borç için sorumluluk belirlenir. Mughni al-Muhtaj'da Al-Khatib Al-Sharbini'nin alıntıladığını, aynı miktarın kredide geri döndüğünü çünkü daha yakın olduğunu ve Uluslararası İslami Fiqh Akademisi'nin beşinci oturumunda alıntı yaparak borç ödenmesinin anahtarının değer değil, karşılıklılık olduğunu belirtti. Altının nakit öderse, alacaklı altının kendisi öderse ve borçlu satarsa, aynı miktarın ağırlık olarak geri verilmesi gerektiğini açıkladı. Bu durumda, altının fiyatı ödeme gününde belirlenip değişimin aynı oturumda yapılması koşuluyla, ödeme gününde karşılıklı anlaşmayla nakit olarak iade edilmesinin bir sakınca olmadığını belirtti."
  id: "Sebuah pertanyaan dari seorang wanita yang memberikan perhiasan dan satu ons emas kepada ayah mertuanya lalu mengklaim haknya setelah kematiannya. Para ahli waris menawarkan sejumlah uang tunai. Departemen Fatwa Umum Yordania menjawab bahwa pinjaman dilunasi sesuai cara diambilnya, jadi siapa pun yang meminjam emas mengembalikannya sebagai emas berdasarkan berat. Departemen menjawab bahwa pinjaman tersebut adalah pembayaran uang kepada penerima manfaat untuk melunasinya, dan peminjam diperbolehkan bertindak sebagai perwakilan pemberi pinjaman. Peminjam wajib melunasinya dengan cara yang dipinjam. Uang dikembalikan sebagai uang dan emas dikembalikan sebagai emas, karena kepemilikan pinjaman ditetapkan melalui kepemilikan, sehingga tanggung jawab atas apa yang diterima ditetapkan. Pengadilan mengutip Al-Khatib Al-Sharbini dalam Mughni al-Muhtaj bahwa jumlah yang sama dikembalikan dalam pinjaman karena lebih dekat dengan hak, dan keputusan Akademi Fiqh Islam Internasional dalam sesi kelimanya bahwa kunci pelunasan utang adalah timbal balik, bukan nilai. Mereka menjelaskan bahwa jika pemberi pinjaman menjual emas dan membayarnya secara tunai, jumlah tersebut harus dikembalikan, dan jika dia membayar emas itu sendiri lalu peminjam menjualnya, jumlah yang sama harus dikembalikan berdasarkan berat. Mereka mengatakan tidak ada kerugian dalam kasus ini jika emas dikembalikan tunai segera atas kesepakatan bersama pada hari pembayaran, bukan sebelumnya, asalkan harga emas ditentukan pada hari pembayaran dan pertukaran dilakukan dalam sesi yang sama."
