id: work/fatwa-aliftaa-jo-gold-lent-to-a-father-in-law
class: work
kind: fatwa
label: { ar: "ذهب أُعطي لوالد الزوج ثم طولب به بعد وفاته", en: "Gold given to a father-in-law and claimed after his death", ur: "سسر کو دیا گیا سونا اور اس کی وفات کے بعد اس کا مطالبہ" }
summary:
  ar: "سؤال من امرأة أعطت والد زوجها مصاغًا وأونصة ذهب ثم طالبت بحقها بعد وفاته فعرض الورثة مبلغًا نقديًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن القرض يُوفى على الوجه الذي أُخذ به، فمن اقترض ذهبًا رده ذهبًا وزنًا. أجابت الدائرة بأن القرض دفع مال لمن ينتفع به ليرد مثله، وأنه مباح للمقترض مندوب للمقرض، وأن الواجب أن يوفيه المقترض على الوجه الذي اقترضه به، فالنقود تُرد نقودًا والذهب يُرد ذهبًا وزنًا، لأن الملك في القرض يثبت بالقبض فيستقر في الذمة على ما قُبض. ونقلت قول الخطيب الشربيني في مغني المحتاج إن المثلي يُرد مثله في القرض لأنه أقرب إلى الحق، وقرار مجمع الفقه الإسلامي الدولي في دورته الخامسة بأن العبرة في وفاء الديون بالمثل لا بالقيمة. وفصلت بأن المقرضة إن باعت الذهب ودفعت ثمنه نقودًا وجب رد مقدار النقود، وإن دفعت الذهب نفسه ثم باعه المقترض لزم رد مثله وزنًا. وقالت إنه لا حرج في هذه الصورة في رده نقودًا حالًا باتفاق الطرفين يوم الوفاء لا قبله، على أن يُعتمد سعر الذهب يوم الوفاء ويتم التقابض في المجلس نفسه."
  en: "A question from a woman who gave her father-in-law gold jewellery and an ounce of gold and claimed her right after his death, when the heirs offered a cash sum, in which Jordan's General Iftaa Department answered that a loan is repaid in the form in which it was taken, so borrowed gold is returned as gold by weight. The Department answered that a loan is handing property to someone who benefits from it so that he returns its like, permitted for the borrower and recommended for the lender, and that the borrower must repay it in the form in which he borrowed it: cash is returned as cash and gold as gold by weight, because ownership in a loan is established on receipt and settles as a debt in the form received. It cited al-Khatib al-Shirbini's statement in Mughni al-Muhtaj that a fungible item is repaid with its like in a loan because that is closest to the lender's right, and the decision of the International Islamic Fiqh Academy at its fifth session that debts are repaid with their like, not their value. It distinguished two cases: if the lender sold the gold and handed over its price in cash, the amount of cash must be returned; if she handed over the gold itself and the borrower then sold it, its like must be returned by weight. It said that in the second case there is no objection to repaying in cash on the spot if both parties agree on the day of repayment rather than before, provided the gold price of that day is used and the exchange is completed in the same sitting."
  ur: "ایک خاتون کا سوال جس نے اپنے سسر کو سونے کے زیورات اور ایک اونس سونا دیا اور اس کی وفات کے بعد اپنا حق مانگا تو ورثا نے نقد رقم پیش کی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض اسی صورت میں ادا ہوتا ہے جس میں لیا گیا، اس لیے قرض لیا گیا سونا وزن کے حساب سے سونا ہی واپس ہوگا۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض کسی کو فائدہ اٹھانے کے لیے مال دینا ہے تاکہ وہ اس کا مثل واپس کرے، جو قرض لینے والے کے لیے جائز اور دینے والے کے لیے مستحب ہے، اور قرض لینے والے پر لازم ہے کہ اسی صورت میں ادا کرے جس میں لیا: نقدی نقدی کی صورت میں اور سونا وزن کے حساب سے سونے کی صورت میں، کیونکہ قرض میں ملکیت قبضے سے ثابت ہوتی ہے اور اسی صورت میں ذمے میں ٹھہرتی ہے۔ اس نے خطیب شربینی کا مغنی المحتاج میں یہ قول نقل کیا کہ قرض میں مثلی چیز کا مثل واپس کیا جائے کیونکہ یہ حق کے زیادہ قریب ہے، اور بین الاقوامی اسلامی فقہ اکیڈمی کے پانچویں اجلاس کا یہ فیصلہ کہ قرضوں کی ادائیگی میں مثل کا اعتبار ہے، قیمت کا نہیں۔ اس نے دو صورتیں الگ کیں: اگر قرض دینے والی نے سونا بیچ کر اس کی قیمت نقد دی تو نقدی کی وہی مقدار واپس کرنا لازم ہے؛ اور اگر اس نے خود سونا دیا اور قرض لینے والے نے اسے بیچا تو وزن کے حساب سے اس کا مثل واپس کرنا لازم ہے۔ اس نے کہا کہ دوسری صورت میں ادائیگی کے دن، نہ کہ اس سے پہلے، دونوں فریقوں کے اتفاق سے فوری نقد ادائیگی میں حرج نہیں، بشرطیکہ اسی دن کا سونے کا نرخ لیا جائے اور اسی مجلس میں لین دین مکمل ہو۔"
