id: work/fatwa-dar-alifta-eg-wife-delegated-triple-divorce
class: work
kind: fatwa
label: { ar: "حكم تفويض المرأة في الطلاق الثلاث ومدى جواز اشتراطه في العقد", en: "Delegating the three divorces to the wife and stipulating it in the contract", ur: "بیوی کو تین طلاقوں کی تفویض اور عقد میں اس کی شرط", es: "Delegar los tres divorcios a la esposa y estipularlo en el contrato.", fr: "Déléguer les trois divorces à l'épouse et le stipuler dans le contrat" }
summary:
  ar: "سائل سأل عن جواز اشتراط المرأة في عقد الزواج أن يفوضها زوجها في تطليق نفسها الطلقات الثلاث متفرقات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21653)⁩ أنه يجوز اشتراطها ذلك بلفظ ⁦(كلما)⁩ الذي يفيد التكرار على ما فصّل الجواب من ضوابطه."
  en: "A questioner asked whether the wife may stipulate in the marriage contract that the husband delegates to her divorcing herself three separate divorces. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21653) answered that stipulating it is permitted with the word 'kullama' (whenever) which conveys recurrence — under the controls the answer sets out."
  ur: "ایک سائل نے عقد نکاح میں بیوی کے لیے یہ شرط پوچھی کہ شوہر اسے تین الگ الگ طلاقوں کی تفویض دے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21653)⁩ نے جواب دیا کہ 'کلمّا' کے لفظ سے یہ شرط جائز ہے جو تکرار کو ظاہر کرتا ہے — جواب کے ضوابط کے ساتھ۔"
  es: "Un consultante preguntó si la esposa puede estipular en el contrato matrimonial que el esposo le delegue la facultad de obtener tres divorcios distintos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21653) respondió que estipularlo está permitido con la palabra \"kullama\" (siempre que), que implica recurrencia, bajo las condiciones que se detallan en la respuesta."
  fr: "Une personne a demandé si l'épouse pouvait stipuler dans le contrat de mariage que le mari lui délègue le droit de divorcer à elle-même à trois reprises. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21653) a répondu que cette stipulation était permise, à condition d'utiliser le terme « kullama » (chaque fois), qui implique la récurrence de cette disposition, sous réserve des conditions énoncées dans la fatwa."
