label: { ar: "الترجمة الروسية لمعاني القرآن عند الأحمدية ⁦(خالد أحمد ورافيل بخارايف)⁩", en: "The Ahmadiyya Russian translation of the Qur'an (Khalid Ahmad and Ravil Bukharaev)", ur: "احمدیہ کا روسی ترجمۂ قرآن ⁦(خالد احمد و رافیل بخارایف)⁩", es: "La traducción rusa del Corán de la tradición Ahmadiyya (Khalid Ahmad y Ravil Bukharaev)", fr: "La traduction russe ahmadiyya du Coran (Khalid Ahmad et Ravil Bukharaev)" }
summary:
  ar: "الترجمة الروسية الرسمية لمعاني القرآن عند الجماعة الأحمدية القاديانية، صدرت أول مرة سنة 2006؛ ترجمها من العربية خالد أحمد مع رستم خامتفالييف، وراجعها وحرّرها وكتب مقدمتها الأديب التتري رافيل بخارايف، واعتمدت على التفسير الأردي لميرزا طاهر أحمد؛ وهي تقدّم تفسير الأحمدية صراحة، ولذلك رأى فيها كثير من رجال الدين السنّة في تتارستان خطرًا."
  en: "The Ahmadiyya (Qadiani) community's official Russian rendering of the meanings of the Qur'an, first published in 2006; translated from the Arabic by Khalid Ahmad with Rustam Khamatvaleev and revised, edited and prefaced by the Tatar writer Ravil Bukharaev, it relies on Mirza Tahir Ahmad's Urdu commentary and openly presents the Ahmadiyya interpretation, which is why many of Tatarstan's Sunni clergy saw it as dangerous."
  ur: "احمدیہ قادیانی جماعت کا قرآن کے معانی کا سرکاری روسی ترجمہ، جو پہلی بار 2006 میں شائع ہوا؛ عربی سے خالد احمد نے رستم خامتوالییف کے ساتھ ترجمہ کیا، اور تاتار ادیب رافیل بخارایف نے نظرِ ثانی، تدوین اور مقدمہ لکھا؛ یہ مرزا طاہر احمد کی اردو تفسیر پر مبنی ہے اور کھلے طور پر احمدیہ تعبیر پیش کرتا ہے، اسی لیے تاتارستان کے بہت سے سنی علما نے اسے خطرناک سمجھا۔"
  es: "La traducción oficial en ruso del significado del Corán, publicada por primera vez en 2006 por la comunidad Ahmadiyya (Qadiani), fue traducida del árabe por Khalid Ahmad con Rustam Khamatvaleev y revisada, editada y prologada por el escritor tártaro Ravil Bukharaev. Se basa en el comentario en urdu de Mirza Tahir Ahmad y presenta abiertamente la interpretación Ahmadiyya, razón por la cual muchos clérigos sunitas de Tatarstán la consideraron peligrosa."
  fr: "La traduction russe officielle des significations du Coran par la communauté Ahmadiyya (Qadiani), publiée pour la première fois en 2006; traduite de l'arabe par Khalid Ahmad avec Rustam Khamatvaleev et révisée, éditée et préfacée par l'écrivain tatar Ravil Bukharaev, elle s'appuie sur le commentaire en ourdou de Mirza Tahir Ahmad et présente ouvertement l'interprétation Ahmadiyya, ce qui explique pourquoi de nombreux membres du clergé sunnite du Tatarstan la considéraient comme dangereuse."
