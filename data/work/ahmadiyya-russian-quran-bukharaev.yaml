summary:
  ar: "الترجمة الروسية الرسمية لمعاني القرآن عند الجماعة الأحمدية القاديانية، صدرت أول مرة سنة 2006؛ ترجمها من العربية خالد أحمد مع رستم خامتفالييف، وراجعها وحرّرها وكتب مقدمتها الأديب التتري رافيل بخارايف، واعتمدت على التفسير الأردي لميرزا طاهر أحمد؛ وهي تقدّم تفسير الأحمدية صراحة، ولذلك رأى فيها كثير من رجال الدين السنّة في تتارستان خطرًا."
  en: "The Ahmadiyya (Qadiani) community's official Russian rendering of the meanings of the Qur'an, first published in 2006; translated from the Arabic by Khalid Ahmad with Rustam Khamatvaleev and revised, edited and prefaced by the Tatar writer Ravil Bukharaev, it relies on Mirza Tahir Ahmad's Urdu commentary and openly presents the Ahmadiyya interpretation, which is why many of Tatarstan's Sunni clergy saw it as dangerous."
  ur: "احمدیہ قادیانی جماعت کا قرآن کے معانی کا سرکاری روسی ترجمہ، جو پہلی بار 2006 میں شائع ہوا؛ عربی سے خالد احمد نے رستم خامتوالییف کے ساتھ ترجمہ کیا، اور تاتار ادیب رافیل بخارایف نے نظرِ ثانی، تدوین اور مقدمہ لکھا؛ یہ مرزا طاہر احمد کی اردو تفسیر پر مبنی ہے اور کھلے طور پر احمدیہ تعبیر پیش کرتا ہے، اسی لیے تاتارستان کے بہت سے سنی علما نے اسے خطرناک سمجھا۔"
