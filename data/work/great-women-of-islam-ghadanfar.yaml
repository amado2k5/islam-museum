summary:
  ar: "كتاب في سير الصحابيات المبشرات بالجنة لمحمود أحمد غضنفر، صدر بالإنجليزية عن دار السلام بالرياض، يفتتح بفصل في مآثر الصحابيات ثم يترجم لأمهات المؤمنين وفاطمة بنت محمد وفاطمة بنت أسد وأم رومان وسمية وأم حرام وأسماء بنت أبي بكر وأم سليم وأم عمارة وغيرهن، ولا سيما من شهدن بيعة الرضوان."
  en: "A book on the lives of the women Companions given the good news of Paradise by Mahmood Ahmad Ghadanfar, published in English by Darussalam, Riyadh. It opens with a chapter on the women Companions' achievements and then gives the lives of the Mothers of the Believers, Fatima bint Muhammad, Fatima bint Asad, Umm Ruman, Sumayya, Umm Haram, Asma' bint Abi Bakr, Umm Sulaym, Umm Ammara and others, notably women who took the Pledge of Ridwan."
