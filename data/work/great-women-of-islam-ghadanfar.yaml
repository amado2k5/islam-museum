label: { ar: "نساء عظيمات في الإسلام ⁦(المبشرات بالجنة)⁩", en: "Great Women of Islam, Who Were Given the Good News of Paradise", ur: "اسلام کی عظیم خواتین ⁦(جنہیں جنت کی بشارت ملی)⁩", es: "Grandes mujeres del Islam, a quienes se les anunció la Buena Nueva del Paraíso.", fr: "Grandes femmes de l'Islam, à qui fut annoncée la bonne nouvelle du Paradis", tr: "İslam'da Büyük Kadınlar (Vaat Edilen Cennet)", id: "Wanita Agung dalam Islam (Surga yang Dijanjikan)" }
summary:
  ar: "كتاب في سير الصحابيات المبشرات بالجنة لمحمود أحمد غضنفر، صدر بالإنجليزية عن دار السلام بالرياض، يفتتح بفصل في مآثر الصحابيات ثم يترجم لأمهات المؤمنين وفاطمة بنت محمد وفاطمة بنت أسد وأم رومان وسمية وأم حرام وأسماء بنت أبي بكر وأم سليم وأم عمارة وغيرهن، ولا سيما من شهدن بيعة الرضوان."
  en: "A book on the lives of the women Companions given the good news of Paradise by Mahmood Ahmad Ghadanfar, published in English by Darussalam, Riyadh. It opens with a chapter on the women Companions' achievements and then gives the lives of the Mothers of the Believers, Fatima bint Muhammad, Fatima bint Asad, Umm Ruman, Sumayya, Umm Haram, Asma' bint Abi Bakr, Umm Sulaym, Umm Ammara and others, notably women who took the Pledge of Ridwan."
  es: "Un libro sobre la vida de las mujeres Compañeras que recibieron la buena noticia del Paraíso, escrito por Mahmood Ahmad Ghadanfar y publicado en inglés por Darussalam, Riad. Comienza con un capítulo sobre los logros de las mujeres Compañeras y luego narra la vida de las Madres de los Creyentes: Fátima bint Muhammad, Fátima bint Asad, Umm Ruman, Sumayya, Umm Haram, Asma' bint Abi Bakr, Umm Sulaym, Umm Ammara y otras, en particular las mujeres que hicieron el Juramento de Ridwan."
  fr: "Un livre sur la vie des Compagnes ayant reçu la bonne nouvelle du Paradis, écrit par Mahmood Ahmad Ghadanfar et publié en anglais par Darussalam à Riyad. Il s'ouvre sur un chapitre consacré aux accomplissements de ces femmes, puis retrace la vie des Mères des Croyants: Fatima bint Muhammad, Fatima bint Asad, Umm Ruman, Sumayya, Umm Haram, Asma' bint Abi Bakr, Umm Sulaym, Umm Ammara et d'autres, notamment celles qui ont prononcé le vœu de Ridwan."
  ur: "محمود احمد غضنفر کی جنت کی بشارت دی گئی خواتین صحابہ کی زندگیوں پر ایک کتاب جسے دارالسلام، ریاض نے انگریزی میں شائع کیا۔ یہ خواتین صحابہ کے کارناموں کے ایک باب سے شروع ہوتا ہے اور پھر مومنین کی ماؤں فاطمہ بنت محمد، فاطمہ بنت اسد، ام رومان، سمیہ، ام حرام، اسماء بنت ابی بکر، ام سلیم، ام عمارہ اور دیگر، خاص طور پر بیعت کرنے والی خواتین کی زندگیوں کو بیان کرتا ہے۔"
  tr: "Mahmoud Ahmad Ghadanfar tarafından cennet vaat eden kadın sahabelerin biyografileri üzerine bir kitap, Riyad'da Dar Al-Salam tarafından İngilizce olarak yayımlanmıştır. Kitap, kadın sahabelerin erdemleri üzerine bir bölümle başlar, ardından Müminlerin Anneleri, Fatimah bint Muhammad, Fatimah bint Asad, um Roman, Sumayyah, Um Haram, Asma bint Ebi Bekir, um Süleym, Um Amarah ve diğerlerinin, özellikle Ridvan yeminine tanık olanların biyografileriyle başlar."
  id: "Sebuah buku tentang biografi para sahabat perempuan yang menjanjikan Surga karya Mahmoud Ahmad Ghadanfar, diterbitkan dalam bahasa Inggris oleh Dar Al-Salam di Riyadh. Buku ini dibuka dengan bab tentang kebajikan sahabat perempuan, kemudian biografi para Ibu Orang Beriman, Fatimah bint Muhammad, Fatimah bint Asad, um Roman, Sumayyah, um Haram, Asma bint Abi Bakr, um Sulaym, um Amarah, dan lainnya, terutama mereka yang menyaksikan ikrar Ridwan."
