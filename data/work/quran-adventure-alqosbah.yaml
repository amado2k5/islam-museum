label: { ar: "مغامرة القرآن ⁦(دار القصبة)⁩", en: "Al-Qur'an Adventure (alQosbah)", ur: "القرآن ایڈونچر ⁦(القصبہ)⁩", es: "La aventura del Corán (alQosbah)", fr: "L'aventure du Coran (alQosbah)", tr: "Kur'an'ın Macerası (Dar Al-Kasbah)", id: "Petualangan Al-Qur'an (Dar Al-Qasbah)" }
summary:
  ar: "مصحف إندونيسي تفاعلي من دار القصبة، الناشر المتخصص في المصاحف الذي تأسس في إندونيسيا سنة 2020 ووزّع أكثر من عشرة ملايين نسخة؛ يجمع الترجمة الرسمية لوزارة الشؤون الدينية مع عناوين موضوعية وترجمة كلمة بكلمة مبنية على التفسير اللغوي عند ابن كثير، ورموز «كيو آر» في كل صفحة تفتح قصصًا قرآنية مصوّرة، و31 قصة و76 درسًا مدعومة بالأحاديث، وألوانًا للتجويد وأدوات للحفظ."
  en: "An interactive Indonesian Qur'an from alQosbah, a Qur'an-only publisher founded in Indonesia in 2020 that has distributed over ten million copies; it combines the Ministry of Religious Affairs translation with thematic subheadings, a word-for-word translation based on Ibn Kathir's linguistic exegesis, QR codes on every page opening animated Qur'anic stories, 31 stories and 76 lessons supported by hadith, colour-coded tajwid and memorisation aids."
  ur: "القصبہ کا تعاملی انڈونیشیائی قرآن، جو 2020 میں قائم ہونے والا صرف مصاحف شائع کرنے والا ادارہ ہے اور ایک کروڑ سے زیادہ نسخے تقسیم کر چکا ہے؛ اس میں وزارتِ مذہبی امور کا سرکاری ترجمہ، موضوعاتی عنوانات، ابن کثیر کی لغوی تفسیر پر مبنی لفظ بہ لفظ ترجمہ، ہر صفحے پر متحرک قرآنی قصوں کے کیو آر کوڈ، احادیث سے مؤید 31 قصے اور 76 اسباق، رنگین تجوید اور حفظ کی مدد شامل ہے۔"
  es: "Un Corán interactivo en indonesio de alQosbah, una editorial especializada en el Corán fundada en Indonesia en 2020 que ha distribuido más de diez millones de copias; combina la traducción del Ministerio de Asuntos Religiosos con subtítulos temáticos, una traducción palabra por palabra basada en la exégesis lingüística de Ibn Kathir, códigos QR en cada página que abren historias coránicas animadas, 31 historias y 76 lecciones respaldadas por hadices, tajwid codificado por colores y ayudas para la memorización."
  fr: "Un Coran indonésien interactif d'alQosbah, une maison d'édition coranique fondée en Indonésie en 2020 et ayant distribué plus de dix millions d'exemplaires; il combine la traduction du ministère des Affaires religieuses avec des sous-titres thématiques, une traduction mot à mot basée sur l'exégèse linguistique d'Ibn Kathir, des codes QR sur chaque page ouvrant des histoires coraniques animées, 31 histoires et 76 leçons soutenues par des hadiths, un tajwid codé par couleur et des aides à la mémorisation."
  tr: "Kur'anlar konusunda uzmanlaşmış yayınevi Al Qasaba House tarafından 2020 yılında kurulan ve on milyondan fazla kopya dağıtan etkileşimli bir Endonezya Kur'anıdır; Dindarlık Bakanlığı'nın resmi çevirisini, İbn Kathir'in dil yorumuna dayalı tematik başlıklar ve kelimesi kelimesine çeviriler, her sayfada QR kodları bulunur ve açılır ve resimli Kur'an hikayeleri, 31 hikaye ve hadisler, Tacvid renk şemaları ve ezber araçlarıyla desteklenen 76 dersle birleştirir."
  id: "Al-Qur'an Indonesia interaktif dari Al Qasaba House, penerbit yang mengkhususkan diri dalam Al-Qur'an yang didirikan di Indonesia pada tahun 2020 dan mendistribusikan lebih dari sepuluh juta eksemplar; Al-Qur'an ini menggabungkan terjemahan resmi Kementerian Urusan Agama dengan judul tematik dan terjemahan kata demi kata berdasarkan interpretasi linguistik Ibn Kathir, kode QR di setiap halaman yang dibuka dengan cerita Al-Qur'an bergambar, 31 cerita, dan 76 pelajaran yang didukung oleh hadis, skema warna untuk Tajweed, dan alat hafalan."
