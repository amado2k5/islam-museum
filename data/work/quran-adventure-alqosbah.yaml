summary:
  ar: "مصحف إندونيسي تفاعلي من دار القصبة، الناشر المتخصص في المصاحف الذي تأسس في إندونيسيا سنة 2020 ووزّع أكثر من عشرة ملايين نسخة؛ يجمع الترجمة الرسمية لوزارة الشؤون الدينية مع عناوين موضوعية وترجمة كلمة بكلمة مبنية على التفسير اللغوي عند ابن كثير، ورموز «كيو آر» في كل صفحة تفتح قصصًا قرآنية مصوّرة، و31 قصة و76 درسًا مدعومة بالأحاديث، وألوانًا للتجويد وأدوات للحفظ."
  en: "An interactive Indonesian Qur'an from alQosbah, a Qur'an-only publisher founded in Indonesia in 2020 that has distributed over ten million copies; it combines the Ministry of Religious Affairs translation with thematic subheadings, a word-for-word translation based on Ibn Kathir's linguistic exegesis, QR codes on every page opening animated Qur'anic stories, 31 stories and 76 lessons supported by hadith, colour-coded tajwid and memorisation aids."
  ur: "القصبہ کا تعاملی انڈونیشیائی قرآن، جو 2020 میں قائم ہونے والا صرف مصاحف شائع کرنے والا ادارہ ہے اور ایک کروڑ سے زیادہ نسخے تقسیم کر چکا ہے؛ اس میں وزارتِ مذہبی امور کا سرکاری ترجمہ، موضوعاتی عنوانات، ابن کثیر کی لغوی تفسیر پر مبنی لفظ بہ لفظ ترجمہ، ہر صفحے پر متحرک قرآنی قصوں کے کیو آر کوڈ، احادیث سے مؤید 31 قصے اور 76 اسباق، رنگین تجوید اور حفظ کی مدد شامل ہے۔"
