label: { ar: "المغرب في حلى المغرب", en: "al-Mughrib fi Hula al-Maghrib", es: "al-Mughrib fi Hula al-Maghrib", fr: "al-Mughrib fi Hula al-Maghrib", ur: "المغرب فی حلۃ المغرب", tr: "Fas Tatlılarında Fas", id: "Maroko dalam Manisan Maroko" }
summary:
  ar: "موسوعة علي بن موسى بن سعيد المغربي في أخبار المغرب والأندلس وآدابهما؛ قسّمها مؤلفها إلى أقسام منها كتاب «وشي الطرس في حلى جزيرة الأندلس» وأربعة كتب تحته هي حتلى الغرس في غرب الأندلس والشفاه اللعس في وسطها والأنس في شرقها ولحظات المريب فيما حماه عباد الصليب، ثم كتاب «الألحان المسلية في حلى جزيرة صقلية» وكتاب «الغاية الأخيرة في حلى الأرض الكبيرة»، وقدم حتلى الغرس لكون قرطبة قطب الخلافة المروانية وإشبيلية أجمل حواضر الأندلس وقسمه سبعة كتب لممالك قرطبة وإشبيلية ومالقة وبطليوس وشلب وباجة وأشيونة؛ وأجازه مصنفه للتيفاشي ولجمال الدين ابن خطلخ {cite:nafh-tib-maqqari p. 260-262, 334}."
  en: "Ali b. Musa Ibn Sa'id's encyclopaedia of Maghrebi and Andalusi lore, headed by Washy al-tars on al-Andalus (its west, centre, east, and the lands already held by the Cross's servants), followed by the Alhan al-musliyya on Sicily and the Ghaya al-akhira on the great land; the Cordoba-caliphate section alone ran seven kingdom-books {cite:nafh-tib-maqqari p. 260-262}."
  es: "Ali b. la enciclopedia de Musa Ibn Sa'id sobre la tradición magrebí y andaluza, encabezada por Washy al-tars en al-Andalus, seguida por Alhan al-musliyya en Sicilia y Ghaya al-akhira en la gran tierra; Sólo la sección del Califato de Córdoba publicó siete libros del reino {cita:nafh-tib-maqqari p. 260-262}."
  fr: "Ali b. l'encyclopédie des traditions maghrébines et andalouses de Musa Ibn Sa'id, dirigée par Washy al-tars sur al-Andalus, suivi par Alhan al-musliyya sur la Sicile et Ghaya al-akhira sur le grand pays; la section du califat de Cordoue publiait à elle seule sept livres du royaume {cite:nafh-tib-maqqari p. 260-262}."
  ur: "علی بی موسیٰ ابن سعید کا مغربی اور اندلس کے علم کا انسائیکلوپیڈیا، جس کی سربراہی الاندلس پر واشی الطارس نے کی، اس کے بعد سسلی پر الحان المسلیٰ اور عظیم سرزمین پر غیاث الخیرہ؛ قرطبہ خلافت کے حصے نے اکیلے سات بادشاہی کتابیں چلائیں۔ 260-262}۔"
  tr: "Ali bin Musa ibn Musa ibn Sa'id al-Magribi'nin Mağrip ve Endülüs haberleri ve edebiyatı üzerine ansiklopedisi; yazarı kitabı \"Endülüs Adası'nın Süslerinde Tarların Fısıltıları\" ve altında dört kitap yer alan dört kitap olarak ayırdı: \"Hatli al-Ghars\" batı Endülüs'te, \"Ortadaki Yapışkan Dudaklar\" ve \"Haç Tapanlar Onu Korurken Şüphe Anları.\" Sonra \"Eğlendir\" adlı kitap Sicilya Adasının Süslerinde Melodileri Yapmak\" ve \"Büyük Toprağın Süslerinde Son Hedef\" gibi eserleri ekledi. Hatli el-Ghars, Kordoba'nın Marwani Halifeliği ve Endülüs'ün en güzel şehirleri olan Sevilla'nın merkezi olması nedeniyle bu dikimi sundu. Onu Kordoba, Sevilla, Malaga, Badaj, Şalep, Béja ve Aşiona krallıkları için yedi kitaba böldü; yazarı ise el-Tifaşi ve Cemaleddin İbn Hatlakh için yetkilendirdi {atıfta bulunuyor: nafh-tib-maqqari s. 260-262, 334}."
  id: "Ensiklopedia Ali ibn Musa ibn Sa'id al-Maghribi tentang berita Maghreb dan Andalusia serta sastra mereka; penulisnya membaginya menjadi beberapa bagian termasuk buku \"Bisikan Tar di Ornamen Pulau Andalusia\" dan empat buku di bawahnya: \"Hatli al-Ghars\" di Andalusia barat, \"Bibir Lengket di Tengahnya,\" dan \"Momen Kecurigaan saat Para Penyembah Salib melindunginya.\" Kemudian buku \"Melodi Menghibur di Perhiasan Pulau Sisilia\" dan \"Tujuan Terakhir dalam Perhiasan Tanah Besar.\" Hatli al-Gharsh mempresentasikan penanaman ini karena Cordoba adalah pusat Kekhalifahan Marwanid dan Sevilla, kota-kota terindah di Andalusia. Ia membaginya menjadi tujuh buku untuk kerajaan Cordoba, Seville, Malaga, Badaj, Shalp, Beja, dan Ashiona; penulisnya mengizinkannya untuk al-Tifashi dan Jamal al-Din Ibn Khatlakh {cite:Nafh-Tib-Maqqari hlm. 260-262, 334}."
