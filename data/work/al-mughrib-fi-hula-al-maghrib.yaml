summary:
  ar: "موسوعة علي بن موسى بن سعيد المغربي في أخبار المغرب والأندلس وآدابهما؛ قسّمها مؤلفها إلى أقسام منها كتاب «وشي الطرس في حلى جزيرة الأندلس» وأربعة كتب تحته هي حتلى الغرس في غرب الأندلس والشفاه اللعس في وسطها والأنس في شرقها ولحظات المريب فيما حماه عباد الصليب، ثم كتاب «الألحان المسلية في حلى جزيرة صقلية» وكتاب «الغاية الأخيرة في حلى الأرض الكبيرة»، وقدم حتلى الغرس لكون قرطبة قطب الخلافة المروانية وإشبيلية أجمل حواضر الأندلس وقسمه سبعة كتب لممالك قرطبة وإشبيلية ومالقة وبطليوس وشلب وباجة وأشيونة؛ وأجازه مصنفه للتيفاشي ولجمال الدين ابن خطلخ {cite:nafh-tib-maqqari p. 260-262, 334}."
  en: "Ali b. Musa Ibn Sa'id's encyclopaedia of Maghrebi and Andalusi lore, headed by Washy al-tars on al-Andalus (its west, centre, east, and the lands already held by the Cross's servants), followed by the Alhan al-musliyya on Sicily and the Ghaya al-akhira on the great land; the Cordoba-caliphate section alone ran seven kingdom-books {cite:nafh-tib-maqqari p. 260-262}."
