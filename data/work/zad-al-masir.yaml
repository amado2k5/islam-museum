label: { ar: "زاد المسير في علم التفسير", en: "Zad al-Masir", ur: "زاد المسیر فی علم التفسیر" }
summary:
  ar: "تفسير أبي الفرج ابن الجوزي الحنبلي (ت 597هـ)، مختصر قصد به أن يجمع في موضع واحد ما يتفرق في كتب التفسير من الناسخ والمنسوخ وأسباب النزول والمكي والمدني وأحكام الآيات وجواب الإشكالات، بعبارة بالغة الاختصار، فيسرد أقوال المفسرين ويعزوها إلى أصحابها، ويعتمد في اللغة والنحو على الفراء والزجاج والأخفش وابن قتيبة وأبي عبيدة وغيرهم."
  en: "The commentary of Abu al-Faraj Ibn al-Jawzi the Hanbali (d. 597 AH), a compendium meant to gather in one place what is scattered across commentaries — abrogation, occasions of revelation, Meccan and Medinan, the rulings of the verses and answers to difficulties — in extremely brief wording; it lists the exegetes' views with their holders and relies in language and grammar on al-Farra', al-Zajjaj, al-Akhfash, Ibn Qutayba, Abu Ubayda and others."
  ur: "ابو الفرج ابن الجوزی حنبلی (م 597ھ) کی تفسیر، ایک مختصر کتاب جس کا مقصد وہ سب ایک جگہ جمع کرنا تھا جو تفسیر کی کتابوں میں بکھرا ہے — ناسخ و منسوخ، اسبابِ نزول، مکی و مدنی، آیات کے احکام اور اشکالات کے جواب — نہایت مختصر عبارت میں؛ یہ مفسرین کے اقوال ان کے قائلین کے ناموں کے ساتھ لاتی ہے اور لغت و نحو میں فراء، زجاج، اخفش، ابن قتیبہ، ابو عبیدہ وغیرہ پر اعتماد کرتی ہے۔"
