summary:
  ar: "تفسير أبي الفرج ابن الجوزي الحنبلي ⁦(ت 597هـ)⁩، مختصر قصد به أن يجمع في موضع واحد ما يتفرق في كتب التفسير من الناسخ والمنسوخ وأسباب النزول والمكي والمدني وأحكام الآيات وجواب الإشكالات، بعبارة بالغة الاختصار، فيسرد أقوال المفسرين ويعزوها إلى أصحابها، ويعتمد في اللغة والنحو على الفراء والزجاج والأخفش وابن قتيبة وأبي عبيدة وغيرهم."
  en: "The commentary of Abu al-Faraj Ibn al-Jawzi the Hanbali (d. 597 AH), a compendium meant to gather in one place what is scattered across commentaries — abrogation, occasions of revelation, Meccan and Medinan, the rulings of the verses and answers to difficulties — in extremely brief wording; it lists the exegetes' views with their holders and relies in language and grammar on al-Farra', al-Zajjaj, al-Akhfash, Ibn Qutayba, Abu Ubayda and others."
  ur: "ابو الفرج ابن الجوزی حنبلی ⁦(م 597ھ)⁩ کی تفسیر، ایک مختصر کتاب جس کا مقصد وہ سب ایک جگہ جمع کرنا تھا جو تفسیر کی کتابوں میں بکھرا ہے — ناسخ و منسوخ، اسبابِ نزول، مکی و مدنی، آیات کے احکام اور اشکالات کے جواب — نہایت مختصر عبارت میں؛ یہ مفسرین کے اقوال ان کے قائلین کے ناموں کے ساتھ لاتی ہے اور لغت و نحو میں فراء، زجاج، اخفش، ابن قتیبہ، ابو عبیدہ وغیرہ پر اعتماد کرتی ہے۔"
  es: "El comentario de Abu al-Faraj Ibn al-Jawzi el Hanbali (m. 597 AH), un compendio destinado a reunir en un solo lugar lo que está disperso en varios comentarios —abrogación, ocasiones de revelación, Meca y Medina, interpretaciones de los versículos y respuestas a las dificultades— en una redacción extremadamente breve; enumera las opiniones de los exegetas con sus respectivos autores y se basa en el lenguaje y la gramática en al-Farra', al-Zajjaj, al-Akhfash, Ibn Qutayba, Abu Ubayda y otros."
  fr: "Le commentaire d'Abu al-Faraj Ibn al-Jawzi, de l'école hanbalite (mort en 597 AH), est un recueil destiné à rassembler en un seul endroit ce qui est dispersé dans les commentaires — l'abrogation, les occasions de révélation, les commentaires mecquois et médinois, les décisions concernant les versets et les réponses aux difficultés — dans une formulation extrêmement concise; il répertorie les points de vue des exégètes avec leurs partisans et s'appuie, en matière de langue et de grammaire, sur al-Farra', al-Zajjaj, al-Akhfash, Ibn Qutayba, Abu Ubayda et d'autres."
  tr: "Ebu el-Faraj İbn el-Cevzi el-Hanbali'nin (ö. 597 Hicri) Tafsiri, tefsir kitaplarında dağınık olanları — iptal ve iptal edilmiş metinler, vahiy nedenleri, Mekke, Medinan, ayet hükümleri ve anlaşmazlıkların cevabı gibi unsurları çok öz ve özlü bir şekilde toplamayı amaçlamıştır. Yorumcuların görüşlerini listeler ve bunları yazarlarına atfeder; ayrıca El-Ferra, El-Zajcac, El-Akhfaş, İbn Kutuybe, Ebu Ubeyde ve diğerleri üzerine dil ve dilbilgisine dayanır."
  id: "Tafsir Abu al-Faraj Ibn al-Jawzi al-Hanbali (wafat 597 H) adalah teks ringkas dan ringkas yang bertujuan mengumpulkan di satu tempat apa yang tersebar dalam kitab-kitab tafsir, termasuk teks yang membatalkan dan membatalkan, alasan untuk wahyu, Mekah, Madinah, putusan ayat, dan jawaban atas perselisihan, dalam istilah yang sangat singkat. Ia mencantumkan pendapat para komentator dan mengaitkannya dengan penulisnya, serta mengandalkan bahasa dan tata bahasa Al-Farra', Al-Zajjaj, Al-Akhfash, Ibn Qutaybah, Abu Ubaidah, dan lainnya."
