label: { ar: "حكم تغيير الاسم إلى اسم أحسن منه", en: "Changing one's name to a better one", ur: "نام کو بہتر نام سے بدلنا", es: "Cambiarse el nombre por uno mejor", fr: "Changer de nom pour un meilleur", tr: "İsmin daha iyi bir isme dönüştürülmesine ilişkin karar", id: "Keputusan tentang perubahan nama menjadi nama yang lebih baik" }
summary:
  ar: "سائل سأل عن تغيير الاسم إلى اسم أحسن منه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21556)⁩ أن تغيير الاسم إلى غيره قد يكون واجبًا إذا كان الاسم خاصًّا بالله تعالى أو بما لا يليق وبيّن الجواب أحوال التغيير على وجهه."
  en: "A questioner asked about changing one's name to a better one. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21556) answered that changing a name may be obligatory — if the name is peculiar to God, or otherwise unbefitting — and the answer sets out the cases."
  ur: "ایک سائل نے نام کو بہتر نام سے بدلنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21556)⁩ نے جواب دیا کہ نام بدلنا بعض اوقات واجب ہو سکتا ہے اگر وہ اللہ ہی کے لیے مخصوص ہو یا ناشایاں ہو — جواب میں اس کے احوال بیان ہوئے۔"
  es: "Una persona preguntó sobre la posibilidad de cambiarse el nombre por uno mejor. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21556) respondió que cambiarse el nombre puede ser obligatorio si el nombre es propio de Dios o inapropiado por otros motivos, y la respuesta expone los casos."
  fr: "Une personne a posé une question concernant le changement de nom. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21556) a répondu que changer de nom peut être obligatoire – si le nom est propre à Dieu ou s'il est autrement inconvenant – et la réponse expose les cas."
  tr: "Bir soru soran isim daha iyi bir isme değişmesini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21556), ismin Allah'a özgü veya uygun olmaması durumunda başka bir isim değiştirmenin zorunlu olabileceğini ve yanıtın bu değişikliğin koşullarını açıkladığını yanıtladı."
  id: "Seorang penanya menanyakan tentang perubahan nama menjadi nama yang lebih baik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21556) menjawab bahwa mengganti nama menjadi nama lain mungkin wajib jika nama tersebut khusus untuk Allah Yang Maha Kuasa atau tidak tepat, dan jawaban tersebut menjelaskan syarat-syarat perubahan tersebut."
