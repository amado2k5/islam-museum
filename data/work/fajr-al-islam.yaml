label: { ar: "فجر الإسلام", en: "Fajr al-Islam (Ahmad Amin)", ur: "فجر الاسلام ⁦(احمد امین)⁩" }
summary:
  ar: "كتاب أحمد أمين في الحياة العقلية من صدر الإسلام إلى آخر الدولة الأموية، صدر أول مرة نحو أول سنة 1929م، وهو أول سلسلة أتبعها بـ«ضحى الإسلام»؛ يدرس فيه العرب في الجاهلية، والإسلام والفتح، وأثر الفرس واليونان والرومان، ومراكز الحياة العقلية، ثم القرآن وتفسيره والحديث والتشريع، ثم الخوارج والشيعة والمرجئة والقدرية والمعتزلة {cite:fajr-al-islam-dar-al-kitab-al-arabi-1969 front 7} {cite:fajr-al-islam-dar-al-kitab-al-arabi-1969 front 17-22}."
  en: "Ahmad Amin's study of intellectual life from early Islam to the end of the Umayyad state, first published around the beginning of 1929, the first of a series he continued with Duha al-Islam. It studies the pre-Islamic Arabs, Islam and the conquests, Persian and Greco-Roman influence, the centres of intellectual life, then the Qur'an and its exegesis, hadith and law, and then the Kharijites, Shi'a, Murji'a, Qadariyya and Mu'tazila {cite:fajr-al-islam-dar-al-kitab-al-arabi-1969 front 7} {cite:fajr-al-islam-dar-al-kitab-al-arabi-1969 front 17-22}."
  ur: "احمد امین کی کتاب جو اسلام کے آغاز سے اموی سلطنت کے آخر تک کی فکری زندگی پر ہے، پہلی بار 1929ء کے آغاز کے قریب شائع ہوئی، اور ایک سلسلے کی پہلی کڑی ہے جسے انہوں نے «ضحی الاسلام» سے آگے بڑھایا۔ اس میں جاہلی عرب، اسلام اور فتوحات، فارسی اور یونانی رومی اثرات، فکری زندگی کے مراکز، پھر قرآن اور اس کی تفسیر، حدیث اور تشریع، اور پھر خوارج، شیعہ، مرجئہ، قدریہ اور معتزلہ کا مطالعہ ہے {cite:fajr-al-islam-dar-al-kitab-al-arabi-1969 front 7} {cite:fajr-al-islam-dar-al-kitab-al-arabi-1969 front 17-22}۔"
