label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن التأمين وإعادة التأمين", en: "IIFA resolution on insurance and reinsurance", ur: "اکیڈمی کی قرارداد: انشورنس اور دوبارہ انشورنس", es: "Resolución de la IIFA sobre seguros y reaseguros", fr: "Résolution de l'IIFA sur l'assurance et la réassurance", tr: "Uluslararası İslami Fiqh Akademisi'nin Sigorta ve Reasürans ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai Asuransi dan Reasuransi" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن التأمين وإعادة التأمين: أن عقد التأمين التجاري ذي القسط الثابت الذي تتعامل به شركات التأمين التجاري عقد فيه غرر كبير مفسد للعقد فهو حرام شرعًا، وأن البديل المحترم لأصول التعامل الإسلامي هو عقد التأمين التعاوني القائم على التبرع والتعاون وكذلك إعادة التأمين على أساسه، ودعا الدول الإسلامية إلى إنشاء مؤسسات تأمين تعاوني."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on insurance and reinsurance: the fixed-premium commercial insurance contract used by commercial companies involves contract-destroying gharar and is haram; the lawful alternative respecting Islamic dealing is cooperative insurance based on donation and mutual help, and likewise reinsurance on its basis; it called on Muslim states to found cooperative-insurance institutions."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ انشورنس پر: تجارتی انشورنس غرر کے سبب حرام؛ متبادل تعاونی انشورنس جائز اور ممالک کو اس کے ادارے بنانے کی دعوت۔"
  es: "Resolución de la IIFA de su segundo período de sesiones (Kuwait, diciembre de 1985) sobre seguros y reaseguros: el contrato de seguro comercial de prima fija utilizado por las compañías comerciales implica un gharar que destruye el contrato y es haram; la alternativa lícita que respeta los acuerdos islámicos es el seguro cooperativo basado en la donación y la ayuda mutua, y asimismo el reaseguro sobre esa base; hizo un llamamiento a los estados musulmanes para que fundaran instituciones de seguros cooperativos."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985) sur l'assurance et la réassurance: le contrat d'assurance commerciale à prime fixe utilisé par les entreprises commerciales implique le gharar, qui détruit le contrat, et est haram; l'alternative licite, conforme aux principes islamiques, est l'assurance coopérative fondée sur le don et l'entraide, ainsi que la réassurance sur cette même base; elle a appelé les États musulmans à fonder des institutions d'assurance coopérative."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin ikinci oturumunda (Kuveyt, Aralık 1985) sigorta ve reasürans ile ilgili kararı: ticari sigorta şirketleri tarafından kullanılan sabit primli ticari sigorta sözleşmesinin, sözleşmeyi geçersiz kılan büyük bir gharar içerdiği, çünkü bu dini yasaktır. İslami ilkelere saygın alternatif, bağış, işbirliği ve reasürans temelli kooperatif sigorta sözleşmesidir. İslam ülkelerini işbirlikçi sigorta kurumları kurmaya çağırmıştır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keduanya (Kuwait, Desember 1985) mengenai asuransi dan reasuransi: bahwa kontrak asuransi komersial premi tetap yang digunakan oleh perusahaan asuransi komersial melibatkan gharar besar yang membatalkan kontrak, karena secara agama dilarang. Alternatif yang terhormat dari prinsip Islam adalah kontrak asuransi koperasi yang didasarkan pada donasi, kerja sama, dan reasuransi yang didasarkan padanya. Keputusan ini menyerukan negara-negara Islam untuk mendirikan lembaga asuransi koperasi."
