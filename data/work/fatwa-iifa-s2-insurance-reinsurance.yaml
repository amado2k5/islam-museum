summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن التأمين وإعادة التأمين: أن عقد التأمين التجاري ذي القسط الثابت الذي تتعامل به شركات التأمين التجاري عقد فيه غرر كبير مفسد للعقد فهو حرام شرعًا، وأن البديل المحترم لأصول التعامل الإسلامي هو عقد التأمين التعاوني القائم على التبرع والتعاون وكذلك إعادة التأمين على أساسه، ودعا الدول الإسلامية إلى إنشاء مؤسسات تأمين تعاوني."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on insurance and reinsurance: the fixed-premium commercial insurance contract used by commercial companies involves contract-destroying gharar and is haram; the lawful alternative respecting Islamic dealing is cooperative insurance based on donation and mutual help, and likewise reinsurance on its basis; it called on Muslim states to found cooperative-insurance institutions."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ انشورنس پر: تجارتی انشورنس غرر کے سبب حرام؛ متبادل تعاونی انشورنس جائز اور ممالک کو اس کے ادارے بنانے کی دعوت۔"
  es: "Resolución de la IIFA de su segundo período de sesiones (Kuwait, diciembre de 1985) sobre seguros y reaseguros: el contrato de seguro comercial de prima fija utilizado por las compañías comerciales implica un gharar que destruye el contrato y es haram; la alternativa lícita que respeta los acuerdos islámicos es el seguro cooperativo basado en la donación y la ayuda mutua, y asimismo el reaseguro sobre esa base; hizo un llamamiento a los estados musulmanes para que fundaran instituciones de seguros cooperativos."
