id: work/fatwa-dar-alifta-selling-goods-near-expiry
class: work
kind: fatwa
label: { ar: "حكم بيع سلع أوشكت صلاحيتها على الانتهاء بعروض ترويجية", en: "Selling goods close to expiry through price promotions", ur: "میعاد ختم ہونے کے قریب سامان کو رعایتی پیشکش میں بیچنا", es: "Vender productos próximos a caducar mediante promociones de precios.", fr: "Vente de produits proches de leur date de péremption grâce à des promotions sur les prix", tr: "Süresi dolmak üzere olan ürünlerin satışına ilişkin karar ve promosyon teklifleri", id: "Memutuskan penjualan barang yang akan kedaluwarsa dengan penawaran promosi" }
summary:
  ar: "سؤال عن بيع سلع قارب تاريخ صلاحيتها على الانتهاء بتخفيضات دون إخبار المشتري بالسبب، أجازته دار الإفتاء المصرية بشروط. أجابت الدار بأن ذلك جائز إذا كانت السلعة سليمة صالحة للاستهلاك خالية من ضرر يمس صحة المستهلك، مع بقاء تاريخ الصلاحية مدونًا عليها دون تغيير أو طمس. وقالت إن فقد شرط من هذه الشروط يجعل التصرف محرمًا ويثبت للمشتري خيار رد المبيع. وبنت ذلك على أن الأصل في البيوع الإباحة ما تحقق التراضي وانتفى الغش والتدليس، وذكرت أن المالكية أوجبوا بيان قِدم السلعة وطول بقائها عند البائع."
  en: "A question on selling goods close to their expiry date at a discount without telling buyers why, which Egypt's Dar al-Ifta permitted on conditions. Dar al-Ifta answered that this is permitted if the goods are sound, fit for consumption and free of anything harmful to the consumer's health, with the expiry date left printed on them, neither altered nor obscured. It said that if any of these conditions is missing the sale is forbidden and the buyer has the option to return the goods. It based this on the principle that sales are permissible so long as there is full mutual consent and no fraud or concealment, noting that the Malikis required the seller to disclose how old the goods are and how long he has held them."
  ur: "میعاد ختم ہونے کے قریب سامان کو وجہ بتائے بغیر رعایت پر بیچنے کے بارے میں سوال، جسے مصر کے دار الافتاء نے شرائط کے ساتھ جائز قرار دیا۔ دار الافتاء نے جواب دیا کہ یہ جائز ہے اگر سامان درست، قابلِ استعمال اور صارف کی صحت کے لیے ہر نقصان سے پاک ہو، اور میعاد کی تاریخ اس پر بغیر تبدیلی یا مٹائے درج رہے۔ اس نے کہا کہ ان میں سے کوئی شرط نہ ہو تو یہ فعل حرام ہے اور خریدار کو سامان واپس کرنے کا اختیار ہے۔ اس نے اس کی بنیاد یہ بتائی کہ خرید و فروخت میں اصل اباحت ہے جب تک باہمی رضامندی ہو اور دھوکا اور فریب نہ ہو، اور ذکر کیا کہ مالکیہ نے سامان کے پرانا ہونے اور بیچنے والے کے پاس دیر تک رہنے کو بتانا لازم کیا۔"
  es: "Se planteó la cuestión de la venta de productos próximos a su fecha de caducidad con descuento, sin informar a los compradores del motivo, práctica que el Dar al-Ifta de Egipto permitió bajo ciertas condiciones. El Dar al-Ifta respondió que esto está permitido si los productos están en buen estado, son aptos para el consumo y no contienen sustancias nocivas para la salud del consumidor, y conservan la fecha de caducidad impresa, sin alteraciones ni tachaduras. Indicó que, si falta alguna de estas condiciones, la venta está prohibida y el comprador tiene la opción de devolver los productos. Esta decisión se basa en el principio de que las ventas son permisibles siempre que exista pleno consentimiento mutuo y no haya fraude ni ocultación, y señaló que los Malikis exigían que el vendedor revelara la antigüedad de los productos y el tiempo que los había tenido en su poder."
  fr: "La question de la vente de marchandises proches de leur date de péremption à prix réduit, sans explication à l'acheteur, a été soulevée. L'autorité égyptienne Dar al-Ifta a autorisé cette pratique sous certaines conditions. Dar al-Ifta a répondu que cela est permis si les marchandises sont saines, propres à la consommation et exemptes de toute substance nocive pour la santé du consommateur, et si la date de péremption est clairement imprimée dessus, sans être altérée ni masquée. Elle a précisé que si l'une de ces conditions n'est pas remplie, la vente est interdite et l'acheteur a la possibilité de retourner la marchandise. Elle a fondé sa décision sur le principe que les ventes sont permises dès lors qu'il y a consentement mutuel et en l'absence de fraude ou de dissimulation, rappelant que les Malikites exigeaient du vendeur qu'il indique l'âge des marchandises et la durée de leur détention."
  tr: "Son kullanma tarihi yaklaşan malların indirimle satışı ve alıcıya sebep bildirilmeden satılmasıyla ilgili bir soru, Mısır Dar al-Ifta'sı tarafından şartlarla onaylandı. Meclis, ürünün sağlam ve tüketime uygun, tüketicinin sağlığını etkilemediği ve son kullanma tarihinin değişiklik veya silinmeden kaydedilmediği sürece bunun izin verilebileceğini yanıtladı. Bu koşulların hiçbirinin olmaması işlemi yasakladığını ve alıcıya satılan ürünü iade etme seçeneği tanıdığını belirtti. Bunu, karşılıklı rıza sağlandığı ve dolandırıcılık ile aldatmacanın ortadan kaldırılması koşuluyla satışta temerrüt kabul edilebilir olduğu ilkesine dayandırdı ve Malikilerin ürünün yaşını ve uzun raf ömrünü satıcıyla netleştirmesini talep ettiğini belirtti."
  id: "Pertanyaan tentang penjualan barang yang tanggal kedaluwarsa mendekati kedaluwarsa dengan diskon tanpa memberitahukan pembelinya atas alasan telah disetujui oleh Dar al-Ifta Mesir dengan syarat-syarat. Dewan menjawab bahwa hal ini diperbolehkan jika produk utuh dan layak dikonsumsi, bebas dari bahaya terhadap kesehatan konsumen, dan tanggal kedaluwarsa tetap dicatat tanpa perubahan atau penghapusan. Dewan menyatakan bahwa ketiadaan salah satu dari ketentuan ini membuat transaksi dilarang dan memberikan pilihan kepada pembeli untuk mengembalikan barang yang terjual. Dewan mendasarkan prinsip bahwa gagal bayar penjualan diperbolehkan selama persetujuan bersama tercapai dan penipuan serta penipuan dihilangkan, serta menyebutkan bahwa keluarga Malik mengharuskan penjelasan usia barang dan masa simpan yang panjang dengan penjual."
