id: work/fatwa-dar-alifta-selling-goods-near-expiry
class: work
kind: fatwa
label: { ar: "حكم بيع سلع أوشكت صلاحيتها على الانتهاء بعروض ترويجية", en: "Selling goods close to expiry through price promotions", ur: "میعاد ختم ہونے کے قریب سامان کو رعایتی پیشکش میں بیچنا" }
summary:
  ar: "سؤال عن بيع سلع قارب تاريخ صلاحيتها على الانتهاء بتخفيضات دون إخبار المشتري بالسبب، أجازته دار الإفتاء المصرية بشروط. أجابت الدار بأن ذلك جائز إذا كانت السلعة سليمة صالحة للاستهلاك خالية من ضرر يمس صحة المستهلك، مع بقاء تاريخ الصلاحية مدونًا عليها دون تغيير أو طمس. وقالت إن فقد شرط من هذه الشروط يجعل التصرف محرمًا ويثبت للمشتري خيار رد المبيع. وبنت ذلك على أن الأصل في البيوع الإباحة ما تحقق التراضي وانتفى الغش والتدليس، وذكرت أن المالكية أوجبوا بيان قِدم السلعة وطول بقائها عند البائع."
  en: "A question on selling goods close to their expiry date at a discount without telling buyers why, which Egypt's Dar al-Ifta permitted on conditions. Dar al-Ifta answered that this is permitted if the goods are sound, fit for consumption and free of anything harmful to the consumer's health, with the expiry date left printed on them, neither altered nor obscured. It said that if any of these conditions is missing the sale is forbidden and the buyer has the option to return the goods. It based this on the principle that sales are permissible so long as there is full mutual consent and no fraud or concealment, noting that the Malikis required the seller to disclose how old the goods are and how long he has held them."
  ur: "میعاد ختم ہونے کے قریب سامان کو وجہ بتائے بغیر رعایت پر بیچنے کے بارے میں سوال، جسے مصر کے دار الافتاء نے شرائط کے ساتھ جائز قرار دیا۔ دار الافتاء نے جواب دیا کہ یہ جائز ہے اگر سامان درست، قابلِ استعمال اور صارف کی صحت کے لیے ہر نقصان سے پاک ہو، اور میعاد کی تاریخ اس پر بغیر تبدیلی یا مٹائے درج رہے۔ اس نے کہا کہ ان میں سے کوئی شرط نہ ہو تو یہ فعل حرام ہے اور خریدار کو سامان واپس کرنے کا اختیار ہے۔ اس نے اس کی بنیاد یہ بتائی کہ خرید و فروخت میں اصل اباحت ہے جب تک باہمی رضامندی ہو اور دھوکا اور فریب نہ ہو، اور ذکر کیا کہ مالکیہ نے سامان کے پرانا ہونے اور بیچنے والے کے پاس دیر تک رہنے کو بتانا لازم کیا۔"
