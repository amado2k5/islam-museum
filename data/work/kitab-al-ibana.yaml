summary:
  ar: "كتاب للمسعودي أفرده لذكر الفرق بين المعتزلة وأهل الإمامة وما بان به كل فريق منهم عن الآخر في مسألة الإمامة، قال في مروج الذهب وأفردنا بذلك كتابنا المترجم بكتاب الإبانة اجتبيناه لأنفسنا {cite:muruj-al-dhahab p. 210}."
  en: "al-Mas'udi's monograph on the difference between the Mu'tazila and the people of the imamate — 'we devoted to it our book titled al-Ibana, which we chose for ourselves' {cite:muruj-al-dhahab p. 210}."
  es: "La monografía de al-Mas'udi sobre la diferencia entre los Mu'tazila y la gente del imamato: «a ella le dedicamos nuestro libro titulado al-Ibana, que elegimos para nosotros mismos» {cite:muruj-al-dhahab p. 210}."
  fr: "La monographie d'al-Mas'udi sur la différence entre les Mu'tazilites et les gens de l'imamat — « nous lui avons consacré notre livre intitulé al-Ibana, que nous avons choisi pour nous-mêmes » {cite:muruj-al-dhahab p. 210}."
  ur: "معتزلہ اور اہل امامت کے درمیان فرق پر المسعودی کا مونوگراف - 'ہم نے اس کے لیے اپنی کتاب الابناء کو وقف کیا، جسے ہم نے اپنے لیے منتخب کیا'۔ 210}۔"
  tr: "Al-Mas'udi'nin Mu'taziller ile İmamat halkı arasındaki farkı ve her grubun İmalık meselesiyle ilgili diğerine ne anlattığını belirten bir kitap. Muruj al-Dhahab'da şöyle demiştir ve biz de kitabımızı 'El-İbanah, kendimiz için seçtik' kitabında adadık {kaynak:Muruj-al-Dhahab, s. 210}."
  id: "Sebuah buku karya Al-Mas'udi yang didedikasikan untuk menyebutkan perbedaan antara Mu'taziliyah dan umat Imamat, serta apa yang dijelaskan masing-masing kelompok kepada kelompok lain mengenai isu Imamat. Ia berkata dalam Muruj al-Dhahab, dan kami mendedikasikan buku kami untuk ini dalam buku 'Al-Ibanah, kami telah memilihnya untuk diri kami sendiri' {cite:muruj-al-dhahab, hlm. 210}."
