id: work/fatwa-aliftaa-jo-istibra-clearing-the-urinary-tract
class: work
kind: fatwa
label: { ar: "حكم الاستبراء من البول وكيفيته", en: "Istibra: clearing the urinary tract, its ruling and method", ur: "پیشاب سے استبرا کا حکم اور طریقہ" }
summary:
  ar: "سؤال عن حكم الاستبراء من البول وكيفيته، أجابت فيه دائرة الإفتاء العام الأردنية بأنه مستحب، وبأن المقصود منه أن يغلب على الظن ألا يبقى في مجرى البول شيء، وأن كيفيته تختلف باختلاف الناس. أجابت الدائرة بأن الاستبراء من البول مستحب، وهو أن يتأكد الشخص من عدم بقاء شيء من البول في مجراه قبل الاستنجاء. وقالت إن من كيفيته أن يتنحنح، وأن يمرر إصبعه برفق ليخرج ما قد يكون بقي من البول، وأن يمشي خطوات بالقدر الذي يظن معه عدم بقاء شيء إن كان يحتاج إلى المشي. وأضافت أن كل إنسان أعرف بطبعه، وأن المختار أن ذلك يختلف باختلاف الناس، والمقصود أن يظن أنه لم يبق في مجرى البول شيء يخاف خروجه."
  en: "A question about the ruling on istibra, clearing the urinary tract, and how it is done, in which Jordan's General Iftaa Department answered that it is recommended, that its aim is to be reasonably sure nothing remains in the tract, and that the method varies from person to person. The Department answered that istibra from urine is recommended: making sure that no urine remains in its passage before cleansing oneself. It said that it may be done by clearing the throat, gently passing a finger to bring out any urine that may remain, and walking a few steps, as far as needed to be reasonably sure nothing remains, if walking is needed. It added that each person knows his own constitution best, that the preferred view is that this differs from person to person, and that the aim is to be reasonably sure that nothing remains in the passage that might come out."
  ur: "پیشاب سے استبرا کے حکم اور طریقے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ مستحب ہے، اس کا مقصد یہ غالب گمان ہے کہ پیشاب کی نالی میں کچھ باقی نہ رہے، اور اس کا طریقہ لوگوں کے لحاظ سے مختلف ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ پیشاب سے استبرا مستحب ہے، یعنی استنجا سے پہلے یقین کر لینا کہ پیشاب کی نالی میں کچھ باقی نہیں۔ اس نے کہا کہ اس کا طریقہ یہ ہو سکتا ہے کہ کھنکھارے، نرمی سے انگلی پھیرے تاکہ باقی ماندہ پیشاب نکل جائے، اور اگر چلنے کی ضرورت ہو تو اتنے قدم چلے جتنے سے گمان ہو کہ کچھ باقی نہیں۔ اس نے مزید کہا کہ ہر شخص اپنی طبیعت کو بہتر جانتا ہے، مختار قول یہ ہے کہ یہ لوگوں کے لحاظ سے مختلف ہے، اور مقصد یہ گمان ہے کہ نالی میں ایسا کچھ باقی نہیں جس کے نکلنے کا خدشہ ہو۔"
