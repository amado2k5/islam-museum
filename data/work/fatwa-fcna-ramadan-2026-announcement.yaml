label: { ar: "إعلان المجلس الفقهي لرمضان وشوال 1447 / 2026", en: "FCNA Announcement for Ramadan–Shawwal 1447 / 2026", ur: "فقہ کونسل کا اعلان رمضان اور شوال 1447 / 2026", es: "Anuncio de la FCNA para Ramadán-Shawwal 1447/2026", fr: "Annonce de la FCNA pour le Ramadan-Shawwal 1447/2026" }
summary:
  ar: "أعلن المجلس الفقهي لأمريكا الشمالية أنه يعتبر الحساب الفلكي طريقة شرعية مقبولة لتحديد بداية الشهور القمرية بما فيها رمضان وشوال، وأنه يتبع معايير المجلس الأوروبي للإفتاء والبحوث، وأصدر بهذا الإعلان مواعيد بداية رمضان والعيد لعام 1447 هـ الموافق 2026 م."
  en: "The Fiqh Council of North America announced that it recognises astronomical calculation as an acceptable shari method for determining the start of lunar months including Ramadan and Shawwal, that it applies the criteria of the European Council for Fatwa and Research, and issued with this announcement the dates for the start of Ramadan and Eid for 1447 AH / 2026 CE."
  ur: "فقہ کونسل آف نارتھ امریکہ نے اعلان کیا کہ وہ قمری مہینوں — بشمول رمضان اور شوال — کے آغاز کا تعین کے لیے فلکیاتی حساب کو ایک قابلِ قبول شرعی طریقہ مانتی ہے، وہ یورپی کونسل برائے فتوے و تحقیق کے معیارات پر عمل کرتی ہے، اور اس اعلان کے ساتھ 1447ھ / 2026ء کے رمضان اور عید کی تاریخیں جاری کیں۔"
  es: "El Consejo de Jurisprudencia Islámica de Norteamérica anunció que reconoce el cálculo astronómico como un método shari aceptable para determinar el inicio de los meses lunares, incluidos Ramadán y Shawwal, que aplica los criterios del Consejo Europeo para la Fatwa y la Investigación, y emitió con este anuncio las fechas para el inicio de Ramadán y Eid para 1447 AH / 2026 CE."
  fr: "Le Conseil Fiqh d'Amérique du Nord a annoncé qu'il reconnaissait le calcul astronomique comme une méthode shari acceptable pour déterminer le début des mois lunaires, y compris le Ramadan et Shawwal, qu'il appliquait les critères du Conseil européen de la fatwa et de la recherche, et a publié avec cette annonce les dates de début du Ramadan et de l'Aïd pour 1447 AH / 2026 CE."
