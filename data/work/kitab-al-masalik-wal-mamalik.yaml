structure: "Dedicatory preface to an unnamed patron, with the claim of translating Ptolemy (BGA VI scan p.11); description of the earth and the qibla (pp. 12-20); the Sawad and its kharaj; routes from Baghdad to the east (Khurasan, Transoxiana, Tukharistan), Jibal, Khuzistan, Fars, Kirman and Sind (pp. 26-66); Basra and the sea route to the east (pp. 67-80); routes to the west, Syria, Egypt and the Maghrib (pp. 80-107); Rome and its wonders (p. 121); Azerbaijan, Armenia, Jurjan (pp. 127-132); the roads to Mecca and Medina, including the Prophet's route of the hijra (pp. 133-160); the route of the Radhanite Jewish merchants (p. 161); wonders and the wall of Gog and Magog after Sallam the interpreter (pp. 165-181); rivers (p. 181). Scan pages."
