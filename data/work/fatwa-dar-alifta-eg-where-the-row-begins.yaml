id: work/fatwa-dar-alifta-eg-where-the-row-begins
class: work
kind: fatwa
label: { ar: "موضع ابتداء الصف خلف الإمام", en: "Where the row begins behind the imam", ur: "امام کے پیچھے صف کہاں سے شروع ہوتی ہے" }
summary:
  ar: "سائل سأل عن موضع ابتداء الصف في صلاة الجماعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22166)⁩ أن الصف يبتدئ من خلف الإمام حتى يكون الإمام متوسطًا الصف متقدمًا على المأمومين، فيكون هناك من يمينه وشماله من المصلين، على ما فصّل الجواب."
  en: "A questioner asked where the row should begin in congregational prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22166) answered that the row begins directly behind the imam so that he stands centred ahead of the congregation, with worshippers to his right and left, as the answer details."
  ur: "ایک سائل نے نمازِ جماعت میں صف کہاں سے بنائی جائے پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22166)⁩ نے جواب دیا کہ صف امام کے بالکل پیچھے سے شروع ہوتی ہے تاکہ امام مقتدیوں سے آگے صف کے درمیان ہو اور اس کے دائیں بائیں نمازی ہوں، جیسا کہ جواب میں تفصیل ہے۔"
