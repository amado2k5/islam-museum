label: { ar: "حماسة البياسي" }
summary:
  ar: "حماسة البياسي لأبي الحجاج يوسف بن محمد البياسي الأندلسي، في مجلدين؛ قال في آخرها إن الفراغ من تأليفها وترتيبها كان بمدينة تونس في شوال سنة ست وأربعين وستمائة، وذكر في مقدمتها أنه جمع من مختارات أشعار العرب جاهليها ومخضرميها وإسلاميها ومولدها وأشعار المحدثين من أهل المشرق والأندلس، وأنه لم يجد أقرب تبويب ولا أحسن ترتيب مما بوبه أبو تمام في حماسته فاتبع مذهبه وقرن الشعر بما يجانسه؛ ورأى ابن خلكان نسخة مقروءة على المؤلف بخطه كتبها في أواخر ربيع الآخر سنة خمسين وستمائة {cite:wafayat-ayan p. 239}."
  en: "al-Bayyasi's Hamasa — a two-volume anthology on Abu Tammam's arrangement of Jahili, mukhadram, Islamic and modern verse from East and al-Andalus, finished at Tunis in Shawwal 646; Ibn Khallikan saw a copy read back to the author in his own hand {cite:wafayat-ayan p. 239}."
