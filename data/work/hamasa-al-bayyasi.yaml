label: { ar: "حماسة البياسي", en: "Hamasa of al-Bayyasi", es: "Hamasa de al-Bayyasi", fr: "Hamasa d'al-Bayyasi", ur: "البیاسی کی حماسہ", tr: "Hamasa Al-Bayasi", id: "Hamasa Al-Bayasi" }
summary:
  ar: "حماسة البياسي لأبي الحجاج يوسف بن محمد البياسي الأندلسي، في مجلدين؛ قال في آخرها إن الفراغ من تأليفها وترتيبها كان بمدينة تونس في شوال سنة ست وأربعين وستمائة، وذكر في مقدمتها أنه جمع من مختارات أشعار العرب جاهليها ومخضرميها وإسلاميها ومولدها وأشعار المحدثين من أهل المشرق والأندلس، وأنه لم يجد أقرب تبويب ولا أحسن ترتيب مما بوبه أبو تمام في حماسته فاتبع مذهبه وقرن الشعر بما يجانسه؛ ورأى ابن خلكان نسخة مقروءة على المؤلف بخطه كتبها في أواخر ربيع الآخر سنة خمسين وستمائة {cite:wafayat-ayan p. 239}."
  en: "al-Bayyasi's Hamasa — a two-volume anthology on Abu Tammam's arrangement of Jahili, mukhadram, Islamic and modern verse from East and al-Andalus, finished at Tunis in Shawwal 646; Ibn Khallikan saw a copy read back to the author in his own hand {cite:wafayat-ayan p. 239}."
  es: "Hamasa de al-Bayyasi, una antología de dos volúmenes sobre la disposición de Abu Tammam de Jahili, mukhadram, verso islámico y moderno de Oriente y al-Andalus, terminada en Túnez en Shawwal 646; Ibn Khallikan vio una copia leída al autor de su propia mano {citar:wafayat-ayan p. 239}."
  fr: "Hamasa d'al-Bayyasi - une anthologie en deux volumes sur l'arrangement d'Abu Tammam du Jahili, du mukhadram, des vers islamiques et modernes de l'Est et d'al-Andalus, achevée à Tunis en Shawwal 646; Ibn Khallikan a vu une copie relue à l'auteur de sa propre main {cite: wafayat-ayan p. 239}."
  ur: "البیاسی کی حماسہ - ابو تمام کے جاہلی، مخدرم، اسلامی اور جدید آیت مشرق اور الاندلس کے انتظامات پر ایک دو جلدوں پر مشتمل مجموعہ، شوال 646 میں تیونس میں مکمل ہوا۔ ابن خلیقان نے دیکھا کہ ایک نسخہ مصنف کو ان کے اپنے ہاتھ میں پڑھ کر پڑھا گیا ہے۔ 239}۔"
  tr: "Ebu el-Hacı Yusuf ibn Muhammed el-Bayasi el-Endülüs'ün iki cilt halinde yazdığı Hamas el-Bayasi; sonunda, tamamlanmasının ve düzenlenmesinin altı yüz kırk altıncı yılda Tunus şehrinde, Şavval'da gerçekleştiğini belirtmiştir. Girişinde, İslam öncesi Arapların, Muadherimlerin, Müslümanların, doğumlarının ve Doğu ile Endülüs'ten modern alimlerin şiirlerinden seçmeler topladığını belirtmiştir. Ebu Temmam'ın Hamas'ında sahip olduğu daha yakın sınıflandırma veya düzenleme bulamadı, bu yüzden onun okulunu takip etti ve şiirleri ona uygun olanla eşleştirdi. İbn Hallikan, yazarın kendi el yazısıyla okunabilecek bir kopyasını gördü; bu kopya, Rabi' al-Thani'nin sonunda 650 Hicri yılında yazılmıştı."
  id: "Hamasat al-Bayasi oleh Abu al-Hajjaj Yusuf ibn Muhammad al-Bayasi al-Andalusi, dalam dua jilid; di akhir, ia mengatakan bahwa penyelesaian dan penataannya terjadi di kota Tunis di Shawwal pada tahun enam ratus empat puluh enam. Ia menyebutkan dalam pengantarnya bahwa ia telah mengumpulkan pilihan puisi orang Arab pra-Islam, Mu'adherim, Muslim, kelahiran mereka, dan puisi para ulama modern dari Timur dan al-Andalus. Ia tidak menemukan klasifikasi yang lebih dekat atau susunan yang lebih baik daripada yang dimiliki Abu Tammam dalam Hamas-nya, sehingga ia mengikuti sekolahnya dan mencocokkan puisinya dengan yang sesuai. Ibn Khallikan melihat sebuah salinan yang dapat dibaca oleh penulis dengan tulisan tangannya sendiri, ditulis di akhir Rabi' al-Thani pada tahun 650 H."
