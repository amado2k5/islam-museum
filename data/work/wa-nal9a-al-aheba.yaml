label:
  ar: "ونلقى الأحبة"
  en: "Wa Nalqa al-Ahibba (lecture series)"
  ur: "ونلقى الاحبہ ⁦(لیکچر سلسلہ)⁩"
summary:
  ar: "سلسلة دروس مسجّلة بالفيديو لعمرو خالد على موقع أسبابيل، تقع في 79 درسا بحسب صفحة السلسلة. تبدأ بالخلفاء الراشدين، وتفتتح بأبي بكر الصديق، وتعرض سيرته وصفاته ومواقفه بوصفها قدوة في الإيمان والخلق، وفق تسجيلات الأرشيف."
  en: "A lecture series by Amr Khaled, recorded on video and held in the Assabile archive, with 79 lessons by the series page's own count. It opens with the Rightly Guided Caliphs and with Abu Bakr al-Siddiq, and presents his life, his character and his conduct as a model of faith and conduct, as recorded in the archive."
  ur: "عمرو خالد کا ویڈیو میں ریکارڈ شدہ درسی سلسلہ، جو Assabile آرکائیو میں موجود ہے، سلسلے کے صفحے کے اپنے شمار کے مطابق 79 اسباق پر مشتمل ہے۔ اس کا آغاز خلفائے راشدین اور ابوبکر صدیق سے ہوتا ہے، جن کی زندگی، کردار اور طرزِ عمل کو ایمان اور اخلاق کے نمونے کے طور پر پیش کیا گیا ہے، آرکائیو کی ریکارڈنگز کے مطابق۔"
