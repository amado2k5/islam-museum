label:
  ar: "ونلقى الأحبة"
  en: "Wa Nalqa al-Ahibba (lecture series)"
  ur: "ونلقى الاحبہ ⁦(لیکچر سلسلہ)⁩"
  es: "Wa Nalqa al-Ahibba (ciclo de conferencias)"
  fr: "Wa Nalqa al-Ahibba (série de conférences)"
  tr: "Ve sevdiklerimizi buluyoruz"
  id: "Dan kita menemukan orang-orang tercinta"
summary:
  ar: "سلسلة دروس مسجّلة بالفيديو لعمرو خالد على موقع أسبابيل، تقع في 79 درسا بحسب صفحة السلسلة. تبدأ بالخلفاء الراشدين، وتفتتح بأبي بكر الصديق، وتعرض سيرته وصفاته ومواقفه بوصفها قدوة في الإيمان والخلق، وفق تسجيلات الأرشيف."
  en: "A lecture series by Amr Khaled, recorded on video and held in the Assabile archive, with 79 lessons by the series page's own count. It opens with the Rightly Guided Caliphs and with Abu Bakr al-Siddiq, and presents his life, his character and his conduct as a model of faith and conduct, as recorded in the archive."
  ur: "عمرو خالد کا ویڈیو میں ریکارڈ شدہ درسی سلسلہ، جو Assabile آرکائیو میں موجود ہے، سلسلے کے صفحے کے اپنے شمار کے مطابق 79 اسباق پر مشتمل ہے۔ اس کا آغاز خلفائے راشدین اور ابوبکر صدیق سے ہوتا ہے، جن کی زندگی، کردار اور طرزِ عمل کو ایمان اور اخلاق کے نمونے کے طور پر پیش کیا گیا ہے، آرکائیو کی ریکارڈنگز کے مطابق۔"
  es: "Una serie de conferencias de Amr Khaled, grabadas en vídeo y conservadas en el archivo de Assabile, con 79 lecciones según el propio recuento de la página web de la serie. Comienza con los califas bien guiados y con Abu Bakr al-Siddiq, y presenta su vida, su carácter y su conducta como modelo de fe y conducta, tal como se registra en el archivo."
  fr: "Une série de conférences d'Amr Khaled, enregistrées en vidéo et conservées dans les archives d'Assabile, comprenant 79 leçons selon le décompte de la page dédiée. Elle s'ouvre sur les califes bien guidés et sur Abou Bakr al-Siddiq, et présente sa vie, son caractère et sa conduite comme un modèle de foi et d'éthique, tels que consignés dans les archives."
  tr: "Amr Halid tarafından Asbabil web sitesinde yer alan ve serinin sayfasına göre 79 dersten oluşan bir dizi video ders serisi. Doğru Rehberli Halifeler ile başlar, Arşiv kayıtlarına göre Ebu Bekir el-Siddiq'in biyografisini, özelliklerini ve inanç ve karakter açısından rol model olarak duruşlarını sunmasıyla başlar."
  id: "Serangkaian pelajaran video yang direkam oleh Amr Khaled di situs web Asbabil, terdiri dari 79 pelajaran menurut halaman seri tersebut. Pelajaran dimulai dengan Khalifah yang Dibimbing dengan Tepat, dibuka dengan Abu Bakr al-Siddiq, yang menyajikan biografi, sifat, dan sikapnya sebagai panutan dalam iman dan karakter, menurut rekaman arsip."
