id: work/fatwa-dar-alifta-eg-zakat-for-roofing-houses
class: work
kind: fatwa
label: { ar: "حكم إخراج الزكاة في تسقيف البيوت", en: "Spending zakat on roofing houses", ur: "مکانوں کی چھتوں پر زکات خرچ کرنا", es: "Gastar el zakat en techar casas", fr: "Dépenser la zakat pour couvrir les maisons", tr: "Evlerin çatı kaplaması için zekat ödenmesine ilişkin karar", id: "Keputusan tentang pembayaran zakat pada rumah atap" }
summary:
  ar: "سائل سأل عن صرف أموال الزكاة في تسقيف بيوت غير القادرين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21811)⁩ أنه يجوز شرعًا صرف أموال الزكاة في إصلاح سقف منازل غير القادرين على إصلاحها ليقيهم من مياه الأمطار على ما فصّل الجواب."
  en: "A questioner asked about spending zakat funds on roofing the homes of those unable to repair them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21811) answered that spending zakat on repairing the roofs of those who cannot repair them — to shelter them from rainwater — is lawful in the sharia, as the answer details."
  ur: "ایک سائل نے ان لوگوں کے گھروں کی چھت ٹھیک کرنے پر زکات خرچ کرنے کا حکم پوچھا جو خود نہیں کر سکتے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21811)⁩ نے جواب دیا کہ بارش سے بچانے کے لیے زکات سے چھتیں مرمت کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de destinar fondos del zakat a la reparación de los techos de las viviendas de quienes no pueden repararlos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21811) respondió que destinar el zakat a la reparación de los techos de quienes no pueden repararlos —para protegerlos del agua de lluvia— es lícito según la sharia, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'utilisation de la zakat pour la réfection des toitures des maisons de ceux qui ne peuvent les réparer était autorisée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21811) a répondu que l'utilisation de la zakat pour la réparation des toits de ceux qui ne peuvent les réparer – afin de les protéger des eaux de pluie – est licite selon la charia, comme le précise la réponse."
  tr: "Bir soru soran kişi, engellilerin evlerinin çatısı için zekat fonların dağıtılması hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21811), cevabında açıklandığı gibi, tamir edemeyen evlerin çatılarını onarmak için zekat fonlarının harcanmasının dini olarak caiz olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang pencairan dana zakat untuk memadatkan rumah orang yang tidak mampu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21811) menjawab bahwa secara agama diperbolehkan menggunakan dana zakat untuk memperbaiki atap rumah yang tidak dapat diperbaiki untuk melindunginya dari air hujan, seperti yang dijelaskan dalam jawaban."
