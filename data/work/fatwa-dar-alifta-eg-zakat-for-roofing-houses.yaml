label: { ar: "حكم إخراج الزكاة في تسقيف البيوت", en: "Spending zakat on roofing houses", ur: "مکانوں کی چھتوں پر زکات خرچ کرنا" }
summary:
  ar: "سائل سأل عن صرف أموال الزكاة في تسقيف بيوت غير القادرين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21811)⁩ أنه يجوز شرعًا صرف أموال الزكاة في إصلاح سقف منازل غير القادرين على إصلاحها ليقيهم من مياه الأمطار على ما فصّل الجواب."
  en: "A questioner asked about spending zakat funds on roofing the homes of those unable to repair them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21811) answered that spending zakat on repairing the roofs of those who cannot repair them — to shelter them from rainwater — is lawful in the sharia, as the answer details."
  ur: "ایک سائل نے ان لوگوں کے گھروں کی چھت ٹھیک کرنے پر زکات خرچ کرنے کا حکم پوچھا جو خود نہیں کر سکتے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21811)⁩ نے جواب دیا کہ بارش سے بچانے کے لیے زکات سے چھتیں مرمت کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
