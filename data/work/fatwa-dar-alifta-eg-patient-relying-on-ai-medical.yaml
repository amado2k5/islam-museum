label: { ar: "حكم اعتماد المريض على الذكاء الاصطناعي في المسائل الطبية", en: "A patient relying on AI for medical questions", ur: "مریض کا طبی معاملات میں اے آئی پر بھروسا کرنا" }
summary:
  ar: "سائل سأل عن استخدام تطبيقات الذكاء الاصطناعي في تشخيص الأمراض وتحديد الأدوية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22359)⁩ أن استخدام تطبيقات الذكاء الاصطناعي في القطع بتشخيص الأمراض دون كشف حقيقي وتحديد الأدوية دون تدخل أو إشراف مباشر من طبيب ممنوع شرعًا، على ما فصّل الجواب."
  en: "A questioner asked about using AI applications to diagnose illnesses and determine medicines. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22359) answered that using AI to conclusively diagnose diseases without real examination and to determine medicines without a doctor's direct intervention or supervision is prohibited in the sharia, as the answer details."
  ur: "ایک سائل نے بیماریوں کی تشخیص اور ادویات کے تعین میں اے آئی ایپلی کیشنز کے استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22359)⁩ نے جواب دیا کہ حقیقی معائنے کے بغیر اے آئی سے قطعی تشخیص اور ڈاکٹر کی براہِ راست نگرانی کے بغیر ادویات کا تعین شرعاً ممنوع ہے، جیسا کہ جواب میں تفصیل ہے۔"
