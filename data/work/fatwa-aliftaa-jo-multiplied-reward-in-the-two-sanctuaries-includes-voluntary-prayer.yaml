id: work/fatwa-aliftaa-jo-multiplied-reward-in-the-two-sanctuaries-includes-voluntary-prayer
class: work
kind: fatwa
label: { ar: "مضاعفة أجر الصلاة في الحرمين تشمل النافلة", en: "Multiplied reward in the two sanctuaries includes voluntary prayer", ur: "حرمین میں نماز کا بڑھا ہوا اجر نفل کو بھی شامل ہے", es: "La recompensa multiplicada en los dos santuarios incluye la oración voluntaria.", fr: "La récompense multipliée dans les deux sanctuaires inclut la prière volontaire" }
summary:
  ar: "سؤال عن مضاعفة أجر الصلاة في الحرمين تشمل النافلة، أجابت فيه دائرة الإفتاء العام الأردنية بأن مضاعفة أجر الصلاة في الحرمين لا تفرق بين الفرض والنفل لإطلاق الأحاديث، وأنها تشمل الصلاة في أي مكان داخل الحرم. أجابت الدائرة بأنه لا فرق في أحاديث مضاعفة الأجر في الحرمين بين فرض ونفل، لإطلاق الأحاديث الصحيحة وعمومها، فلا يجوز تقييدها أو تخصيصها بلا دليل، ونقلت عن النووي في المجموع (8/476) أن مذهب الشافعية أن تفضيل الصلاة في مسجدي مكة والمدينة يعم الفرض والنفل. وقالت إن المضاعفة متحققة لمن صلى في المسجد الحرام أو في أي مكان داخل الحرم، ونقلت عن الشرواني في حواشيه على تحفة المحتاج (10/95) أن الأصح عند النووي أن التضعيف يعم جميع الحرم ولا يختص بالمسجد ولا بمكة."
  en: "A question about multiplied reward in the two sanctuaries includes voluntary prayer, in which Jordan's General Iftaa Department answered that the multiplied reward for prayer in the two sanctuaries makes no distinction between obligatory and voluntary prayer, since the hadiths are unrestricted, and that it covers prayer anywhere within the sanctuary. The Department answered that the hadiths on multiplied reward in the two sanctuaries draw no distinction between obligatory and voluntary prayer, being unrestricted and general, so they may not be limited without evidence, quoting al-Nawawi in al-Majmu (8/476) that the Shafi'i position is that the merit of prayer in the mosques of Mecca and Medina covers both obligatory and voluntary prayer. It said the multiplication applies to whoever prays in the Sacred Mosque or anywhere within the sanctuary, quoting al-Shirwani's glosses on Tuhfat al-Muhtaj (10/95) that the soundest view according to al-Nawawi is that it covers the whole sanctuary and is not confined to the mosque or to Mecca."
  ur: "حرمین میں نماز کا بڑھا ہوا اجر نفل کو بھی شامل ہے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حرمین میں نماز کے بڑھے ہوئے اجر میں فرض اور نفل کا کوئی فرق نہیں کیونکہ احادیث مطلق ہیں، اور یہ حرم کے اندر کسی بھی جگہ نماز کو شامل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ حرمین میں اجر بڑھنے کی احادیث میں فرض اور نفل کا کوئی فرق نہیں، کیونکہ صحیح احادیث مطلق اور عام ہیں، اس لیے بلا دلیل ان کی تخصیص جائز نہیں، اور المجموع (8/476) میں نووی سے نقل کیا کہ شافعیہ کا مذہب ہے کہ مکہ اور مدینہ کی مسجدوں میں نماز کی فضیلت فرض اور نفل دونوں کو شامل ہے۔ اس نے کہا کہ یہ اضافہ اس کے لیے ہے جو مسجدِ حرام میں یا حرم کے اندر کسی بھی جگہ نماز پڑھے، اور تحفۃ المحتاج پر شروانی کے حواشی (10/95) سے نقل کیا کہ نووی کے نزدیک اصح یہ ہے کہ یہ اضافہ پورے حرم کو شامل ہے اور مسجد یا مکہ کے ساتھ خاص نہیں۔"
  es: "Una pregunta sobre la recompensa multiplicada en los dos santuarios incluye la oración voluntaria, a lo que el Departamento General de Iftaa de Jordania respondió que la recompensa multiplicada por la oración en los dos santuarios no distingue entre la oración obligatoria y la voluntaria, ya que los hadices no tienen restricciones y abarcan la oración en cualquier lugar dentro del santuario. El Departamento respondió que los hadices sobre la recompensa multiplicada en los dos santuarios no establecen distinción entre la oración obligatoria y la voluntaria, al ser generales y sin restricciones, por lo que no pueden limitarse sin pruebas, citando a al-Nawawi en al-Majmu (8/476) que la posición shafi'í es que el mérito de la oración en las mezquitas de La Meca y Medina abarca tanto la oración obligatoria como la voluntaria. Afirmó que la multiplicación se aplica a cualquiera que rece en la Mezquita Sagrada o en cualquier lugar dentro del santuario, citando las glosas de al-Shirwani sobre Tuhfat al-Muhtaj (10/95) que indican que la opinión más sólida según al-Nawawi es que abarca todo el santuario y no se limita a la mezquita o a La Meca."
  fr: "Une question relative à la récompense multipliée dans les deux sanctuaires inclut la prière surérogatoire. Le Département général de la Iftaa de Jordanie a répondu que la récompense multipliée pour la prière dans les deux sanctuaires ne fait aucune distinction entre prière obligatoire et surérogatoire, car les hadiths sont généraux et ne font aucune distinction entre prière obligatoire et surérogatoire. Ils couvrent la prière effectuée n'importe où dans le sanctuaire. Le Département a expliqué que les hadiths relatifs à la récompense multipliée dans les deux sanctuaires ne font aucune distinction entre prière obligatoire et surérogatoire, étant généraux et ne pouvant donc être limités sans preuve. Il cite al-Nawawi dans al-Majmu (8/476) selon lequel, selon l'école shafi'ite, le mérite de la prière dans les mosquées de La Mecque et de Médine englobe à la fois la prière obligatoire et la prière surérogatoire. Il est dit que la multiplication s'applique à quiconque prie dans la Mosquée sacrée ou n'importe où dans le sanctuaire, citant les gloses d'al-Shirwani sur Tuhfat al-Muhtaj (10/95) selon lesquelles l'avis le plus solide selon al-Nawawi est qu'elle couvre tout le sanctuaire et n'est pas limitée à la mosquée ou à La Mecque."
