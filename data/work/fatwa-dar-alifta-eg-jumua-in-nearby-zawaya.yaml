label: { ar: "حكم إقامة صلاة الجمعة في الزوايا المتقاربة", en: "Holding Friday prayer in neighbouring zawaya", ur: "قریبی زاویوں میں نمازِ جمعہ قائم کرنا", es: "Celebrando la oración del viernes en el zawaya vecino.", fr: "Prière du vendredi célébrée dans la zawaya voisine" }
summary:
  ar: "سائل سأل عن إقامة صلاة الجمعة في الزوايا المتقاربة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21754)⁩ أن الأصل أن تصلى الجمعة في المسجد الكبير الذي يسع المصلين فإن ضاق أو بعدت المسافة بحيث لا يستطيع المصلون الذهاب فلها حكمها على ما فصّل الجواب."
  en: "A questioner asked about holding Friday prayer in neighbouring zawaya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21754) answered that the default is Friday prayer in the large mosque that holds the worshippers; if it overflows or the distance is too far for them to reach, the case has its ruling — as the answer details."
  ur: "ایک سائل نے قریبی زاویوں میں نمازِ جمعہ قائم کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21754)⁩ نے جواب دیا کہ اصول یہ ہے کہ جمعہ بڑی مسجد میں ہو جو نمازیوں کو سما لے؛ اگر وہ تنگ ہو یا فاصلہ دور ہو تو اس کا حکم الگ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de celebrar la oración del viernes en una zawaya vecina. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21754) respondió que, por defecto, la oración del viernes se realiza en la mezquita principal que acoge a los fieles; si esta se llena o la distancia es demasiado grande para que puedan llegar, el caso tiene su propia resolución, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la tenue de la prière du vendredi dans une zawaya voisine. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21754) a répondu que la prière du vendredi se déroule par défaut dans la grande mosquée pouvant accueillir les fidèles; si celle-ci est trop pleine ou si la distance est trop importante pour que les fidèles puissent s'y rendre, la décision est prise au cas par cas, comme le précise la réponse."
