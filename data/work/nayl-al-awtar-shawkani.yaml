label: { ar: "نيل الأوطار من أسرار منتقى الأخبار", en: "Nayl al-Awtar min Asrar Muntaqa al-Akhbar (al-Shawkani)", ur: "نیل الاوطار من اسرار منتقی الاخبار", tr: "Haber Seçicisinin Sırlarından Dizeleri Elde Etmek", id: "Mendapatkan String dari Rahasia Pemilih Berita" }
summary:
  ar: "شرح محمد بن علي الشوكاني على «منتقى الأخبار»، يسوق فيه أحاديث المتن ثم يشرحها بقوله «قوله ...»، وينقل كلام صاحب المتن بقوله «قال المصنف»، مرتباً على كتب الفقه وأبوابه: ففي الجزء الثاني من الطبعة القديمة أبواب اجتناب النجاسات ومواضع الصلوات وصفة الصلاة وما يبطلها، وفي الثالث صلاة الجماعة والإمامة وصلاة المسافر والجمع والجمعة والعيدين والكسوف والجنائز، وفي الخامس كتاب البيوع {cite:nayl-awtar-awn-bari-hamish j.2 p. 3} {cite:nayl-awtar-awn-bari-hamish j.2 p. 14} {cite:nayl-awtar-awn-bari-hamish j.3 p. 5-9} {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  en: "Muhammad b. 'Ali al-Shawkani's commentary on Muntaqa al-Akhbar: he gives the hadiths of the base text, then explains them lemma by lemma ('his words ...'), quoting the base text's author as 'the author said', in the order of the books and chapters of fiqh — vol. 2 of the old printing covers avoiding impurities and places of prayer, the description of prayer and what invalidates it; vol. 3 congregational prayer, the imamate, the traveller's prayer, combining prayers, Friday, the two Eids, eclipses and funerals; vol. 5 the book of sales {cite:nayl-awtar-awn-bari-hamish j.2 p. 3} {cite:nayl-awtar-awn-bari-hamish j.2 p. 14} {cite:nayl-awtar-awn-bari-hamish j.3 p. 5-9} {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  ur: "محمد بن علی شوکانی کی «منتقی الاخبار» کی شرح: وہ متن کی احادیث لاتے ہیں، پھر «قولہ ...» کہہ کر ٹکڑے ٹکڑے شرح کرتے ہیں، اور متن کے مصنف کا کلام «قال المصنف» سے نقل کرتے ہیں، فقہ کی کتب اور ابواب کی ترتیب پر — پرانی طباعت کی دوسری جلد میں نجاسات سے اجتناب اور نماز کی جگہوں، نماز کی صفت اور مبطلات کے ابواب ہیں؛ تیسری میں جماعت، امامت، مسافر کی نماز، جمع، جمعہ، عیدین، کسوف اور جنازے؛ اور پانچویں میں کتاب البیوع {cite:nayl-awtar-awn-bari-hamish j.2 p. 3} {cite:nayl-awtar-awn-bari-hamish j.2 p. 14} {cite:nayl-awtar-awn-bari-hamish j.3 p. 5-9} {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}۔"
  es: "Comentario de Muhammad b. 'Ali al-Shawkani sobre Muntaqa al-Akhbar: da los hadices del texto base, luego los explica lema por lema ('sus palabras...'), citando al autor del texto base como 'el autor dijo', en el orden de los libros y capítulos de fiqh: vol. 2 de la impresión antigua cubre cómo evitar impurezas y lugares de oración, la descripción de la oración y lo que la invalida; vol. 3 la oración congregacional, el imamato, la oración del viajero, oraciones combinadas, el viernes, los dos Eids, eclipses y funerales; vol. 5 el libro de ventas {cite:nayl-awtar-awn-bari-hamish j.2 p. 3} {cite:nayl-awtar-awn-bari-hamish j.2 p. 14} {cite:nayl-awtar-awn-bari-hamish j.3 p. 5-9} {citar:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  fr: "Commentaire de Muhammad b. 'Ali al-Shawkani sur Muntaqa al-Akhbar: il présente les hadiths du texte source, puis les explique lemme par lemme (« ses paroles… »), citant l’auteur du texte source comme « l’auteur a dit », suivant l’ordre des livres et chapitres de fiqh — vol. 2 de l’ancienne édition traite de l’élimination des impuretés et des lieux de prière, de la description de la prière et de ce qui l’invalide; vol. 3 de la prière en congrégation, de l’imamat, de la prière du voyageur, de la combinaison des prières, du vendredi, des deux Aïds, des éclipses et des funérailles; vol. 5 du livre des ventes {cite:nayl-awtar-awn-bari-hamish j.2 p. 3} {cite:nayl-awtar-awn-bari-hamish j.2 p. 14} {cite:nayl-awtar-awn-bari-hamish j.3 p. 5-9} {cite:nayl-awtar-awn-bari-hamish j.5 p. 2}."
  tr: "Muhammed bin Ali el-Şevkâni, 'Muntaqi' el-Akhbar hakkında yorum yapmış, metindeki hadisleri sunmuş ve ardından bunları 'onun sanımı...' diyerek ve metnin yazarını 'yazar dedi' olarak alıntılayarak fıkıh kitapları ve bölümlerine göre düzenlemiştir: eski baskının ikinci bölümü kirlerden kaçınma, namaz yerleri ve duanın tanımı ile onu geçersiz kılan bölümleri kapsar; üçüncü bölüm cemaat namazı, öncü dualar, yolcu namazı, cuma namazları, iki bayram, tutulmalar ve cenazeleri; beşinci ciltte ise satış kitabı {cite:nayl-awtar-awn-bari-hamish j.2 s.3} {cite:nayl-awtar-awn-bari-hamish j.5 s. 2} bölümlerini kapsar."
  id: "Muhammad ibn Ali al-Shawkani mengomentari 'Muntaqi' al-Akhbar, menyajikan hadits dalam teks tersebut dan kemudian menjelaskannya dengan mengatakan 'pernyataannya...' dan mengutip penulis teks sebagai 'penulis berkata,' yang diatur sesuai dengan buku fiksi dan bab-babnya: bagian kedua edisi lama mencakup bab-bab tentang menghindari kotoran, tempat shalat, dan deskripsi doa serta apa yang membatalkannya; bagian ketiga membahas doa berjamaah, doa pemimpin, doa pengembara, shalat Jumat, dua Idul Fitri, gerhana, dan pemakaman; dan pada jilid kelima, buku penjualan {cite:nayl-awtar-awn-bari-hamish j.2 hlm.3} {cite:nayl-awtar-awn-bari-hamish j.5 hlm. 2}."
