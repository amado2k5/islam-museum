class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 127 (14/1) بشأن بطاقات المسابقات", en: "IIFA resolution 127 (14/1) on competition ⁦(sweepstakes)⁩ cards", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 127 (14/1): مقابلہ جاتی ⁦(انعامی)⁩ کارڈز", es: "Resolución 127 (14/1) de la IIFA sobre tarjetas de competición (sorteos).", fr: "Résolution 127 (14/1) de l'IIFA relative aux cartes de concours (tirages au sort)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. عرّف المسابقة بأنها المعاملة القائمة على المنافسة بين شخصين فأكثر في تحقيق أمر أو القيام به بعوض ⁦(جائزة)⁩ أو بغيره، وقرر مشروعية المسابقة بلا عوض في كل أمر لم يرد تحريمه ولم يترتب عليه ترك واجب أو فعل محرم، ومشروعية المسابقة بعوض بأربعة ضوابط: مشروعية الأهداف والوسائل والمجالات؛ ألا يكون العوض من جميع المتسابقين؛ تحقيق مقصد معتبر شرعًا؛ وألا يترتب عليها ترك واجب أو فعل محرم. ثم حكم بعدم جواز بطاقات ⁦(كوبونات)⁩ المسابقات التي تدخل قيمتها أو جزؤها في مجموع الجوائز، لكونها صورة من القمار."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It defined a competition as a transaction based on rivalry between two or more persons in achieving or doing something for a consideration (a prize) or without one; ruled that a competition without a prize is lawful wherever there is no prohibition and it involves neither neglecting a duty nor doing the forbidden; and made a prize-bearing competition lawful under four controls: lawful goals, means and fields; the prize not coming from all the contestants; serving a legally recognised purpose; and not entailing neglected duty or forbidden act. It then ruled that competition cards/coupons whose value or part of it feeds the prize pool are unlawful, being a form of gambling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ اس نے مقابلہ کی تعریف کی: وہ لین دین جو دو یا زیادہ افراد کے مابین کسی کام میں مقابلہ پر ہو، بدلے ⁦(انعام)⁩ کے ساتھ یا بغیر؛ فیصلہ کیا کہ بغیر انعام کا مقابلہ ہر اس کام میں جائز ہے جس کی ممانعت کا نص نہ ہو اور فرض چھوڑنے یا حرام کام کا سبب نہ بنے؛ اور انعام والے مقابلہ کو چار ضوابط سے جائز قرار دیا: مقاصد، ذرائع اور میدان جائز ہوں؛ انعام سب شرکاء کی طرف سے نہ ہو؛ شرعی طور پر معتبر مقصد حاصل ہو؛ اور اسے فرض چھوڑنا یا حرام لازم نہ آئے۔ پھر ان مقابلہ جاتی کارڈوں ⁦(کوپنز)⁩ کو ناجائز قرار دیا جن کی قیمت یا اس کا حصہ انعام کے مجموعی میں داخل ہو، کیونکہ یہ جوئے کی صورت ہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (8-13 de Dhu al-Qa'da de 1423, 11-16 de enero de 2003). Definió una competencia como una transacción basada en la rivalidad entre dos o más personas para lograr o realizar algo a cambio de una contraprestación (un premio) o sin ella; dictaminó que una competencia sin premio es lícita donde no exista prohibición alguna y no implique ni el incumplimiento de un deber ni la comisión de un acto prohibido; y declaró lícita una competencia con premio bajo cuatro condiciones: objetivos, medios y ámbitos lícitos; que el premio no provenga de todos los concursantes; que sirva a un propósito legalmente reconocido; y que no implique el incumplimiento de un deber ni un acto prohibido. Finalmente, dictaminó que las tarjetas/cupones de competencia cuyo valor, total o parcialmente, alimente el fondo de premios son ilícitas, por ser una forma de juego de azar."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003) a défini une compétition comme une transaction fondée sur la rivalité entre deux ou plusieurs personnes visant à accomplir quelque chose, avec ou sans contrepartie (un prix). Elle a statué qu'une compétition sans prix est licite lorsqu'aucune interdiction n'existe et qu'elle n'implique ni négligence d'un devoir ni acte prohibé. Elle a également déclaré licite une compétition avec prix sous réserve de quatre conditions: des objectifs, des moyens et un domaine licites; un prix ne provenant pas de tous les participants; la poursuite d'un but légalement reconnu; et l'absence de négligence d'un devoir ou d'acte prohibé. Enfin, elle a statué que les cartes ou coupons de compétition dont la valeur, en tout ou en partie, alimente la cagnotte sont illicites, car assimilables à un jeu de hasard."
