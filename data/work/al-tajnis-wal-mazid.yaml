summary:
  ar: "كتاب فتاوى في المذهب الحنفي للمرغيناني، يقول في مقدمته إنه لبيان ما استنبطه المتأخرون ولم ينص عليه المتقدمون، أتمّ فيه عمل شيخه الصدر الشهيد عمر بن عبد العزيز بن مازة الذي بدأ جمع هذه المسائل وتوفي قبل إتمامه. {cite:hidaya-bakdash-v1 p.26}"
  en: "A Hanafi fatwa book by al-Marghinani; in its preface he says it sets out what the later jurists derived and the early ones did not state, completing the work of his teacher al-Sadr al-Shahid Umar ibn Abd al-Aziz ibn Maza, who began collecting these questions and died before finishing."
  ur: "مرغینانی کی حنفی فتاویٰ کی کتاب؛ مقدمے میں وہ کہتے ہیں کہ یہ ان مسائل کے بیان کے لیے ہے جو متاخرین نے مستنبط کیے اور متقدمین نے ان پر نص نہیں کی؛ اس میں انہوں نے اپنے استاد صدر شہید عمر بن عبد العزیز بن مازہ کا کام مکمل کیا جنہوں نے ان مسائل کو جمع کرنا شروع کیا تھا اور مکمل کرنے سے پہلے وفات پا گئے۔"
