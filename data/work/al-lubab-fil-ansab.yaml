  ar: "مختصر عز الدين أبي الحسن علي بن محمد ابن الأثير الجزري المتوفى سنة ٦٣٠هـ لأنساب السمعاني؛ زاد فيه أشياء واستدرك على ما فاته وهو في ثلاث مجلدات فرغ في جمادى الأولى سنة ٦١٥هـ، وهو أحسن من الأصل على قول ابن خلكان، ثم لخص السيوطي اللباب فسماه لب اللباب {cite:kashf-zunun-furqan p. 653-654}."
