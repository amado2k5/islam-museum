id: work/fatwa-dar-alifta-eg-mecca-visitor-then-umrah-ihram
class: work
kind: fatwa
label: { ar: "إحرام من ذهب إلى مكة ثم نوى العمرة", en: "Ihram of one who entered Mecca then decided on umrah", ur: "مکہ پہنچنے کے بعد عمرہ کی نیت کرنے والے کا احرام", es: "Ihram de quien entró en La Meca y luego decidió realizar la umrah." }
summary:
  ar: "سائل سافر إلى مكة لزيارة أقاربه ودخلها دون إحرام ثم نوى العمرة فسأل عن مكان إحرامه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21699)⁩ أنه يجوز له أن يحرم من ميقات أهل مكة كواحد منهم على ما فصّل الجواب."
  en: "A man travelled to Mecca to visit relatives, entered it without ihram, then resolved on umrah and asked where to assume ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21699) answered that he may assume ihram from the miqat of the people of Mecca as one of them — as the answer details."
  ur: "ایک شخص رشتہ داروں سے ملنے مکہ گیا، بغیر احرام داخل ہوا، پھر عمرہ کی نیت کی اور احرام کی جگہ پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21699)⁩ نے جواب دیا کہ وہ اہلِ مکہ کے میقات سے ان میں سے ایک کی طرح احرام باندھ سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre viajó a La Meca para visitar a sus familiares, entró sin ihram, decidió realizar la umrah y preguntó dónde debía tomar el ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21699) respondió que podía tomar el ihram desde el miqat de la gente de La Meca como uno más de ellos, tal como se detalla en la respuesta."
