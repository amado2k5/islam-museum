id: work/fatwa-dar-alifta-eg-mecca-visitor-then-umrah-ihram
class: work
kind: fatwa
label: { ar: "إحرام من ذهب إلى مكة ثم نوى العمرة", en: "Ihram of one who entered Mecca then decided on umrah", ur: "مکہ پہنچنے کے بعد عمرہ کی نیت کرنے والے کا احرام", es: "Ihram de quien entró en La Meca y luego decidió realizar la umrah.", fr: "L'ihram de celui qui est entré à La Mecque puis a décidé d'accomplir la umra", tr: "Mekke'ye gidip sonra Umre kılmak isteyenler için ihram", id: "Ihram untuk mereka yang pergi ke Mekah dan kemudian berniat melakukan Umrah" }
summary:
  ar: "سائل سافر إلى مكة لزيارة أقاربه ودخلها دون إحرام ثم نوى العمرة فسأل عن مكان إحرامه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21699)⁩ أنه يجوز له أن يحرم من ميقات أهل مكة كواحد منهم على ما فصّل الجواب."
  en: "A man travelled to Mecca to visit relatives, entered it without ihram, then resolved on umrah and asked where to assume ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21699) answered that he may assume ihram from the miqat of the people of Mecca as one of them — as the answer details."
  ur: "ایک شخص رشتہ داروں سے ملنے مکہ گیا، بغیر احرام داخل ہوا، پھر عمرہ کی نیت کی اور احرام کی جگہ پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21699)⁩ نے جواب دیا کہ وہ اہلِ مکہ کے میقات سے ان میں سے ایک کی طرح احرام باندھ سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre viajó a La Meca para visitar a sus familiares, entró sin ihram, decidió realizar la umrah y preguntó dónde debía tomar el ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21699) respondió que podía tomar el ihram desde el miqat de la gente de La Meca como uno más de ellos, tal como se detalla en la respuesta."
  fr: "Un homme se rendit à La Mecque pour rendre visite à des proches. Il y entra sans ihram, puis décida d'accomplir la umra et demanda où revêtir l'ihram. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21699) répondit qu'il pouvait revêtir l'ihram au miqat des Mecquois, comme l'un d'eux – comme le précise la réponse."
  tr: "Bir soru soran kişi akrabalarını ziyaret etmek için Mekke'ye gitti ve İhrem olmadan girdi, ardından Umre kılmak üzere niyetlendi ve İhramının yerini sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21699), cevapta açıklandığı üzere, Mekke halkının Mikatından İhrama girmesinin caiz olduğunu söyledi."
  id: "Seorang penanya pergi ke Mekah untuk mengunjungi kerabatnya dan masuk tanpa Ihram, kemudian berniat melakukan Umrah dan menanyakan tempat Ihramnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21699) menjawab bahwa diperbolehkan baginya untuk memasuki Ihram dari Miqat rakyat Mekah sebagai salah satu dari mereka, seperti yang dijelaskan dalam jawaban."
