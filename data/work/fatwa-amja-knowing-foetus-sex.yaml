id: work/fatwa-amja-knowing-foetus-sex
class: work
kind: fatwa
label: { ar: "معرفة جنس الجنين", en: "Finding out the foetus's sex", ur: "جنین کی جنس معلوم کرنا", es: "Determinar el sexo del feto", fr: "Déterminer le sexe du fœtus", tr: "Fetüsün cinsiyetini bilmek", id: "Mengetahui jenis kelamin janin" }
summary:
  ar: "سأل سائل عن أخته الحامل في شهرها الثالث التي تريد معرفة جنس الجنين فضولًا هي وزوجها وقيل لهما إن ذلك حرام. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86478 بتاريخ 24 فبراير 2012)⁩ أنه لا بأس في السعي للتعرف على جنس الجنين على النحو المذكور والتماسه بالأسباب الطبية المشروعة لأن الأصل في مثل ذلك الحل وليس في أدلة الشرع ما يفيد النهي عنه، فعلى مدعي الحرمة إقامة الدليل."
  en: "A questioner asked about his sister, three months pregnant, who wants to learn the foetus's sex out of curiosity — she and her husband having been told it is haram. Dr. Salah al-Sawi (fatwa no. 86478, 24 February 2012) answered that seeking it by lawful medical means is not objectionable since the default for such a thing is permission and no sharia evidence he knows forbids it; the claimant of prohibition must produce the proof."
  ur: "ایک سائل نے پوچھا کہ تین ماہ حاملہ بہن فضول میں جنین کی جنس معلوم کر سکتی ہے یا نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86478، 24 فروری 2012)⁩ کے مطابق جائز طبی ذرائع سے معلوم کرنا درست ہے؛ حرمت کا دعویٰ دلیل مانگتا ہے۔"
  es: "Un consultante preguntó sobre su hermana, embarazada de tres meses, que desea conocer el sexo del feto por curiosidad, ya que tanto a ella como a su esposo les han dicho que es haram (prohibido). El Dr. Salah al-Sawi (fatwa n.° 86478, 24 de febrero de 2012) respondió que buscarlo por medios médicos lícitos no es objetable, puesto que, por defecto, se considera permitido y no conoce ninguna evidencia de la sharia que lo prohíba; quien alega la prohibición debe presentar la prueba."
  fr: "Un homme a posé une question concernant sa sœur, enceinte de trois mois, qui souhaite connaître le sexe du fœtus par simple curiosité – elle et son mari ayant appris que cela est haram. Le Dr Salah al-Sawi (fatwa n° 86478, 24 février 2012) a répondu que le fait de rechercher cette information par des moyens médicaux licites n'est pas répréhensible, car le principe de base est l'autorisation et il n'existe aucune preuve islamique connue l'interdisant; la personne invoquant l'interdiction doit toutefois en apporter la preuve."
  tr: "Bir soru soran kişi, hamileliğinin üçüncü ayında olan kız kardeşi hakkında sordu ve merakla fetüsün cinsiyetini kendisi ve eşi hakkında bilgi almak istedi; kendilerine bunun yasak olduğu söylendi. Dr. Salah Al-Sawy (24 Şubat 2012 tarihli 86478 sayılı Fetva) cevabında ise, cenüsün cinsiyetini tanımlamaya çalışmanın ve meşru tıbbi nedenlerle arama yapmanın bir sakınca olmadığını, çünkü temel kuralın böyle bir kararın yasak delillerinde bulunmaması olduğunu söyledi. Bu nedenle, kutsallık iddiasında bulunanların delil sunması gerekir."
  id: "Seorang penanya menanyakan tentang saudara perempuannya, yang sedang bulan ketiga kehamilan, yang ingin mengetahui jenis kelamin janin karena rasa ingin tahu untuk dirinya dan suaminya, dan mereka diberitahu bahwa hal itu dilarang. Dr. Salah Al-Sawy menjawab (Fatwa No. 86478 tanggal 24 Februari 2012) bahwa tidak ada salahnya mencoba menentukan jenis kelamin janin sebagaimana dijelaskan dan mencari alasan medis yang sah, karena aturan dasarnya adalah putusan tersebut tidak ditemukan dalam bukti pelarangan tersebut. Oleh karena itu, mereka yang mengklaim kesakralan harus memberikan bukti."
