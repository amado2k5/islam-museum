label: { ar: "استقبال القبلة من الزنزانة", en: "Facing the qibla from a locked cell — a condition of validity", ur: "زنزانے سے قبلہ — شرط صحت", es: "Mirando hacia la qibla desde una celda cerrada: una condición de validez", fr: "Se tourner vers la qibla depuis une cellule fermée à clé — une condition de validité", tr: "Hücreden öpücük almak", id: "Menerima ciuman dari sel" }
summary:
  ar: "سأل سائل أنه يعلم وجوب التوجه إلى الكعبة في الصلاة لكنه في زنزانة مغلقة لا يعرف الاتجاه. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21995 بتاريخ 14 أكتوبر 2012)⁩ أن استقبال القبلة واجب في الصلاة وهو شرط من شروط صحتها لقوله تعالى ومن حيث خرجت فول وجهك شطر المسجد الحرام وحيثما كنتم فولوا وجوهكم شطره وبيّن الجواب جهة القبلة في أمريكا وكيفية تحريها على ما فصّل."
  en: "A questioner knew facing the Ka'ba is required but is in a locked cell unable to tell the direction. AMJA's fatwa committee (fatwa no. 21995, 14 October 2012) answered that facing the qibla is obligatory in the prayer, a condition of its validity — 'from wherever you came out, turn your face toward the Sacred Mosque; wherever you are, turn your faces toward it' — the answer setting out the qibla's direction in America and how to seek it."
  ur: "زنزانے سے قبلہ؟ لجنة الفتوى ⁦(فتویٰ 21995، 14 اکتوبر 2012)⁩ کے مطابق استقبال شرط صحت؛ امریکہ میں قبلہ سمت اور تحری کا طریقہ بیان ہوا۔"
  es: "Una persona que preguntó sabía que era necesario orientarse hacia la Kaaba, pero se encontraba en una celda cerrada sin poder indicar la dirección. El comité de fatuas de AMJA (fatua n.° 21995, 14 de octubre de 2012) respondió que orientarse hacia la qibla es obligatorio en la oración, condición para su validez: «De dondequiera que hayas salido, vuelve tu rostro hacia la Mezquita Sagrada; dondequiera que estés, vuelve tu rostro hacia ella». La respuesta indicaba la dirección de la qibla en Estados Unidos y cómo buscarla."
  fr: "Un homme, sachant que se tourner vers la Kaaba est obligatoire, se trouve dans une cellule fermée à clé et ne peut indiquer la direction de la qibla. Le comité des fatwas de l'AMJA (fatwa n° 21995, 14 octobre 2012) a répondu que se tourner vers la qibla est une obligation pour la prière, une condition de sa validité: « D'où que vous veniez, tournez votre visage vers la Mosquée sacrée; où que vous soyez, tournez vos visages vers elle. » Cette réponse indique la direction de la qibla en Amérique et comment la trouver."
  tr: "Bir soru soran kişiye, namaz sırasında Kabe'ye yüz yüze dönmenin zorunlu olduğunu bildiği, ancak kapalı bir hücrede olduğu ve yönü bilmediği soruldu. Amerikan İslam Hukukçuları Konseyi Fetva Komitesi (14 Ekim 2012 tarihli Fetva No. 21995), Kıble'ye yüzleşmenin namaz kılmak için zorunlu olduğunu ve geçerliliği için bir şart olduğunu yanıtladı; Allah'ın dediği gibi: 'Nereden çıkarsanız çıkın, yüzünüzü Mescid Mescid'in yanına çevirin, nerede olursanız olun, yüzlerinizi diğer tarafa çevirin.' Cevap, Amerika'daki Kıble'nin yönünü ve nasıl aranacağını ayrıntılı olarak açıkladı."
  id: "Seorang penanya ditanya bahwa ia tahu bahwa menghadap Ka'bah adalah kewajiban saat shalat, tetapi ia berada di sel tertutup dan tidak tahu arahnya. Komite Fatwa di American Council of Islamic Jurists (Fatwa No. 21995 tanggal 14 Oktober 2012) menjawab bahwa menghadapi Qibla adalah kewajiban dalam shalat dan merupakan syarat keabsahannya, seperti yang dikatakan Allah Yang Maha Kuasa: 'Di mana pun kalian keluar, hadapkan wajah kalian ke sisi Masjid Suci, dan di mana pun kalian berada, hadapkan wajah kalian ke sisi lain.' Jawaban tersebut menjelaskan arah Qibla di Amerika dan cara mencarinya, seperti yang dijelaskan."
