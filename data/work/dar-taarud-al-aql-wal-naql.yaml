summary:
  ar: "كتاب كبير لابن تيمية (ت 728هـ) في نقض «القانون الكلي» الذي قرره الرازي وأتباعه في تقديم الدليل العقلي على السمعي عند التعارض، يرد عليه من أربعة وأربعين وجهاً ويستطرد إلى مسائل العلو وكلام الله وحدوث العالم؛ رجّح محققه محمد رشاد سالم أنه ألف بدمشق بين سنتي 713 و717هـ."
  en: "A large book by Ibn Taymiyya (d. 728 AH) refuting the 'universal law' laid down by al-Razi and his followers – that rational proof takes precedence over scriptural proof when they conflict – in forty-four arguments, with digressions on God's elevation, His speech and the origination of the world; its editor Muhammad Rashad Salim dated it to Damascus between 713 and 717 AH."
