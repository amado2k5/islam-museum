structure: "After the preface, the statement of the 'universal law' (vol. 1, PDF p. 96); a general answer, then a detailed answer in forty-four 'aspects' (wujuh): the first begins at printed p. 86 of vol. 1, aspects 1–19 run through vol. 1 to p. 320, followed by long digressions on the proof from the origination of motions and accidents, preponderance without a preponderant, infinite regress of events and the eternity of the world, God's speech, His rising over the Throne and His elevation, and events subsisting in His essence; aspect 20 opens vol. 3 and the last (44th) comes in the Dublin manuscript (editor's introduction, PDF pp. 19–21)."
