summary:
  ar: "شفاء الغليل فيما في كلام العرب من الدخيل لشهاب الدين الخفاجي، معجم مرتب هجائياً للألفاظ العربية ذات الأصل الأجنبي، طُبع بالقاهرة سنة ١٢٨٢هـ وطبعتين سنة ١٣٢٥هـ. وللخفاجي أيضاً شرح نقدي على «درة الغواص» للحريري كتبه لمراد الرابع ⁦(إسطنبول ١٢٩٩هـ)⁩."
  en: "Shihab al-Din al-Khafaji's Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil, an alphabetical dictionary of Arabic words of foreign origin, printed at Cairo in 1282 AH and in two printings in 1325. He also wrote a critical commentary on al-Hariri's Durrat al-ghawwas, for Murad IV (Istanbul 1299)."
  es: "El Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil de Shihab al-Din al-Khafaji, un diccionario alfabético de palabras árabes de origen extranjero, impreso en El Cairo en 1282 AH y en dos ediciones en 1325. También escribió un comentario crítico a la Durrat al-ghawwas de al-Hariri, para Murad IV (Estambul 1299)."
  fr: "Le Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil de Shihab al-Din al-Khafaji, dictionnaire alphabétique de mots arabes d'origine étrangère, imprimé au Caire en 1282 AH et en deux éditions en 1325. Il écrivit aussi un commentaire critique de la Durrat al-ghawwas d'al-Hariri, pour Murad IV (Istanbul 1299)."
  ur: "شہاب الدین خفاجی کی شفاء الغلیل فیما فی کلام العرب من الدخیل، غیر ملکی اصل کے عربی الفاظ کی تہجی لغت، جو قاہرہ میں 1282ھ اور 1325ھ میں دو بار چھپی۔ انہوں نے حریری کی درۃ الغواص پر مراد چہارم کے لیے تنقیدی شرح بھی لکھی ⁦(استنبول 1299ھ)⁩۔"
