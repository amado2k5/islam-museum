label: { ar: "حكم ارتداء الرجل السلسلة الفضة وربط شعره على هيئة ضفائر", en: "A man wearing a silver chain and braiding his hair", ur: "مرد کا چاندی کا ہار پہننا اور بال گوندھنا" }
summary:
  ar: "سائل سأل عن ارتداء الرجل السلسلة الفضة وربط شعره على هيئة ضفائر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20910)⁩ أن ارتداء الرجال للسلسلة الفضة محل خلاف بين الفقهاء والذي ترتئيه الدار جواز لبس الرجال لها على ما فصّل الجواب."
  en: "A questioner asked about a man wearing a silver chain and tying his hair in braids. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20910) answered that men wearing silver chains is disputed among the jurists; the Dar's view is that it is permitted — as the answer details."
  ur: "ایک سائل نے مرد کے چاندی کی زنجیر پہننے اور بال گوندھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20910)⁩ نے جواب دیا کہ چاندی کی زنجیر میں فقہاء کا اختلاف ہے؛ دار کا مؤقف جواز ہے — جیسا کہ جواب میں تفصیل ہے۔"
