summary:
  ar: "كتاب القوافي، كتاب في العروض والقوافي لمؤلفه الأخفش الأوسط سعيد بن مسعدة، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 215هـ / 830م {cite:google-books-kitab-al-qawafi-al-akhfash}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "Kitab al-Qawafi, a book on prosody (arud and qawafi) by al-Akhfash al-Awsat, Sa'id ibn Mas'ada; its date in a research summary supplied to the museum is d. 215 AH / 830 CE {cite:google-books-kitab-al-qawafi-al-akhfash}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "كتاب القوافي، عروض و قوافی پر ایک کتاب، مصنف الأخفش الأوسط سعيد بن مسعدة؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 215ھ / 830ء {cite:google-books-kitab-al-qawafi-al-akhfash}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Kitab al-Qawafi, livre sur la prosodie (arud et qawafi) de al-Akhfash al-Awsat, Sa'id ibn Mas'ada ; sa date dans une synthèse de recherche remise au musée : m. 215 H / 830 {cite:google-books-kitab-al-qawafi-al-akhfash}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "Kitab al-Qawafi, libro sobre prosodia (arud y qawafi) de al-Akhfash al-Awsat, Sa'id ibn Mas'ada; su fecha en un resumen de investigación entregado al museo: m. 215 H. / 830 {cite:google-books-kitab-al-qawafi-al-akhfash}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
  tr: "Kafiye Kitabı, yazarı Al-Akhfash Al-Awsat Saeed ibn Mas'ada tarafından yazılmış bir prosodi ve kafiyeler üzerine bir kitaptır ve tarihçesi, müzeye sunulan bir araştırma özetine göre şöyledir: ö. 215 Hicri / 830 M.S. {cite:google-books-kitab-al-qawafi-al-akhfash}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Hayır, dosyada shamela.ws web sitesinde yapılan aramada eşleşme bulunamadığı belirtilmiştir. Müze kitabı okumamıştır."
  id: "Kitab Rima adalah buku tentang prosodi dan rima karya penulisnya, Al-Akhfash Al-Awsat Saeed ibn Mas'ada, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 215 H / 830 M {cite:google-books-kitab-al-qawafi-al-akhfash}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Tidak, berkas menyatakan bahwa pencarian di situs web shamela.ws tidak menemukan kecocokan. Museum tidak membaca buku tersebut."
