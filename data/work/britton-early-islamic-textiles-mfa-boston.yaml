  fr: "Catalogue d'étude publié par le Musée des Beaux-Arts de Boston en 1938 par Nancy Pence Britton, sur les tiraz et autres textiles islamiques du VIIIe au XIIIe siècle, classés par région: Irak, Égypte, Yémen et Perse {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 5} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 15}."
  tr: "Boston Güzel Sanatlar Müzesi tarafından 1938'de Nancy Pence Britton tarafından yayımlanan ve sekizinci yüzyıldan on üçüncü yüzyıla kadar İslami stil ve tekstil modellerini inceleyen, Irak, Mısır, Yemen ve İran tarafından düzenlenmiş bir çalışma kataloğu {cite:britton-early-islamic-textiles-mfa-boston-1938 s. 1} {cite:britton-early-islamic-textiles-mfa-boston-1938 s. 5} {cite:britton-early-islamic-textiles-mfa-boston-1938 s. 15}."
  id: "Katalog studi yang diterbitkan oleh Museum of Fine Arts di Boston pada tahun 1938 oleh Nancy Pence Britton tentang model gaya dan tekstil Islam dari abad kedelapan hingga ketiga belas, disusun oleh Irak, Mesir, Yaman, dan Persia {cite:britton-early-islamic-textiles-mfa-boston-1938 hlm. 1} {cite:britton-early-islamic-textiles-mfa-boston-1938 hlm. 5} {cite:britton-early-islamic-textiles-mfa-boston-1938 hlm. 15}."
