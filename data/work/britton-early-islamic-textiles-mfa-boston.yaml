summary:
  ar: "فهرس دراسي نشره متحف الفنون الجميلة ببوسطن سنة 1938 بقلم نانسي بنس بريتون لنماذج من الطراز والمنسوجات الإسلامية من القرن الثامن إلى الثالث عشر، مرتبة حسب العراق ومصر واليمن وفارس {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 5} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 15}."
  en: "Study catalogue published by the Museum of Fine Arts, Boston, in 1938 by Nancy Pence Britton, of tiraz and other Islamic textiles from the eighth to the thirteenth century, arranged under Iraq, Egypt, Yemen and Persia {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 5} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 15}."
  ur: "میوزیم آف فائن آرٹس بوسٹن کی 1938ء میں شائع کردہ نینسی پینس برٹن کی مطالعاتی فہرست، آٹھویں سے تیرھویں صدی کے طراز اور دوسرے اسلامی پارچہ جات کی، عراق، مصر، یمن اور فارس کے تحت مرتب {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 5} {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 15}۔"
