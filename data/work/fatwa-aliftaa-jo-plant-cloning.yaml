id: work/fatwa-aliftaa-jo-plant-cloning
class: work
kind: fatwa
label: { ar: "الاستنساخ في النباتات", en: "Cloning plants", ur: "پودوں کی کلوننگ" }
summary:
  ar: "سؤال عن استنساخ الخلايا النباتية ومضاعفتها لصنع العصائر والمواد المضافة إلى الطعام، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في الاستفادة من تقنيات الاستنساخ في النباتات بشرط ثبوت عدم إضرارها بالمستهلك وعدم إخلالها بالنظام النباتي. أجابت الدائرة بأن العلماء يعرفون الاستنساخ في النبات بأنه عملية حيوية تتكون بها مجموعة من الخلايا ينتج عنها نبات محسن الإنتاج يتكاثر دون تغيير في محتواه الوراثي، وبأن الأرض وما عليها مسخرة لمصلحة الإنسان، وقد أُمر بإصلاحها وتجنب إفسادها. وقالت إن المدى الذي يسمح به الشرع في الاستنساخ غير البشري يُحدد بجلب المصالح ودرء المفاسد، ويرجع في ضبطها إلى أهل الخبرة والاختصاص، فإذا كان في العملية إصلاح للنبات وتحسين لإنتاجه دون ضرر على المستهلك أو اختلال في النظام النباتي فلا حرج فيها، وإن أدت إلى ضرر بالإنسان أو اختلال في النظام النباتي فلا تجوز. واستشهدت بقرار مجمع الفقه الإسلامي الدولي في دورته العاشرة بجدة سنة 1997 بجواز الأخذ بتقنيات الاستنساخ والهندسة الوراثية في الجراثيم والأحياء الدقيقة والنبات والحيوان في حدود الضوابط الشرعية. وخلصت إلى أنه لا حرج في الاستفادة من تقنيات الاستنساخ في النباتات بشرط ثبوت عدم إضرارها بالمستهلك وعدم إخلالها بالنظام النباتي."
  en: "A question about cloning plant cells and multiplying them to make juices and food additives, in which Jordan's General Iftaa Department answered that using cloning techniques in plants is unobjectionable, provided they are shown not to harm the consumer or disrupt the plant ecosystem. The Department answered that scholars define plant cloning as a biological process forming a group of cells that yields a plant with improved output which reproduces without any change to its genetic content, and that the earth and what is on it were made subservient for human benefit, with humans commanded to set it right and avoid corrupting it. It said the scope the Sharia allows for non-human cloning is set by two words: securing benefits and warding off harms, with the judgment of these referred to experts and specialists; if the process improves the plant and its output without harm to the consumer or disruption of the plant ecosystem, there is no objection, but if it leads to harm to people or disrupts the plant ecosystem, it is not permitted. It cited the resolution of the International Islamic Fiqh Academy at its tenth session in Jeddah in 1997 that cloning and genetic engineering techniques may be used for microbes and other micro-organisms, plants and animals within the limits of the Sharia's controls. It concluded that using cloning techniques in plants is unobjectionable, provided they are shown not to harm the consumer or disrupt the plant ecosystem."
  ur: "پودوں کے خلیوں کی کلوننگ اور انہیں بڑھا کر جوس اور غذائی اجزا بنانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پودوں میں کلوننگ کی تکنیک سے فائدہ اٹھانے میں حرج نہیں، بشرطیکہ ثابت ہو کہ اس سے صارف کو نقصان نہیں اور نباتاتی نظام میں خلل نہیں پڑتا۔ ڈیپارٹمنٹ نے جواب دیا کہ علما پودوں کی کلوننگ کی تعریف ایسے حیاتیاتی عمل سے کرتے ہیں جس سے خلیوں کا ایک مجموعہ بنتا ہے اور بہتر پیداوار والا پودا وجود میں آتا ہے جو اپنے جینیاتی مواد میں تبدیلی کے بغیر بڑھتا ہے، اور یہ کہ زمین اور اس پر موجود سب کچھ انسان کے فائدے کے لیے مسخر کیا گیا ہے، اور انسان کو اس کی اصلاح اور اسے بگاڑنے سے بچنے کا حکم دیا گیا ہے۔ اس نے کہا کہ غیر انسانی کلوننگ میں شریعت جس حد تک اجازت دیتی ہے وہ دو باتوں سے طے ہوتی ہے: مصلحتیں حاصل کرنا اور مفاسد دور کرنا، اور ان کا تعین ماہرین اور اہل اختصاص پر ہے؛ اگر اس عمل سے پودے اور اس کی پیداوار میں بہتری ہو اور صارف کو نقصان یا نباتاتی نظام میں خلل نہ ہو تو حرج نہیں، اور اگر اس سے انسان کو نقصان یا نباتاتی نظام میں خلل ہو تو جائز نہیں۔ اس نے بین الاقوامی اسلامی فقہ اکیڈمی کے 1997 میں جدہ میں منعقدہ دسویں اجلاس کی قرارداد کا حوالہ دیا کہ جراثیم، دیگر خرد حیاتیات، پودوں اور جانوروں میں کلوننگ اور جینیاتی انجینئرنگ کی تکنیکیں شرعی ضوابط کی حدود میں استعمال کی جا سکتی ہیں۔ اس نے نتیجہ نکالا کہ پودوں میں کلوننگ کی تکنیک سے فائدہ اٹھانے میں حرج نہیں، بشرطیکہ ثابت ہو کہ اس سے صارف کو نقصان نہیں اور نباتاتی نظام میں خلل نہیں پڑتا۔"
