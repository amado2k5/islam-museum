id: work/fatwa-dar-alifta-eg-heirs-and-claimed-debt
class: work
kind: fatwa
label: { ar: "حكم سداد الورثة دينًا ادعاه رجل على الميت", en: "Heirs paying a debt a man claims on the deceased", ur: "متوفی پر دعویٰ شدہ قرض کی ورثاء کی جانب سے ادائیگی", es: "Herederos pagan una deuda que un hombre reclama al difunto." }
summary:
  ar: "رجل ادعى دينًا على ميت فسأل الورثة عن حكم سداده. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21741)⁩ أن دعوى الدين على الميت لا تقبل إلا ببينة المدعي ويحلف يمين الاستبراء إن وصل الأمر إلى القضاء فإذا لم تقم البينة فلها حكمها على ما فصّل الجواب."
  en: "A man claimed a debt against a deceased person and the heirs asked about paying it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21741) answered that a debt claim on the dead is not accepted without the claimant's proof — with an exculpatory oath if it reaches court; if no proof is established the case has its ruling, as the answer details."
  ur: "ایک شخص نے متوفی پر قرض کا دعویٰ کیا اور ورثاء نے ادائیگی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21741)⁩ نے جواب دیا کہ مُردے پر قرض کا دعویٰ مدعی کے ثبوت کے بغیر قبول نہیں ہوتا اور عدالت پہنچنے پر قسم ہوتی ہے؛ ثبوت نہ ہو تو اس کا حکم الگ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre reclamó una deuda contra una persona fallecida y los herederos preguntaron sobre cómo pagarla. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21741) respondió que una reclamación de deuda contra un difunto no se acepta sin la prueba del reclamante; si llega a los tribunales, se requiere un juramento exculpatorio. Si no se presenta ninguna prueba, el caso queda sin resolver, como se detalla en la respuesta."
