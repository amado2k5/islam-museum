id: work/fatwa-dar-alifta-eg-heirs-and-claimed-debt
class: work
kind: fatwa
label: { ar: "حكم سداد الورثة دينًا ادعاه رجل على الميت", en: "Heirs paying a debt a man claims on the deceased", ur: "متوفی پر دعویٰ شدہ قرض کی ورثاء کی جانب سے ادائیگی", es: "Herederos pagan una deuda que un hombre reclama al difunto.", fr: "Les héritiers règlent une dette réclamée par un homme sur le défunt.", tr: "Varislere ödeme kararı, bir adamın ölüler üzerinde talep ettiği bir borçtur", id: "Keputusan tentang membayar ahli waris adalah utang yang diklaim seorang pria atas yang telah meninggal" }
summary:
  ar: "رجل ادعى دينًا على ميت فسأل الورثة عن حكم سداده. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21741)⁩ أن دعوى الدين على الميت لا تقبل إلا ببينة المدعي ويحلف يمين الاستبراء إن وصل الأمر إلى القضاء فإذا لم تقم البينة فلها حكمها على ما فصّل الجواب."
  en: "A man claimed a debt against a deceased person and the heirs asked about paying it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21741) answered that a debt claim on the dead is not accepted without the claimant's proof — with an exculpatory oath if it reaches court; if no proof is established the case has its ruling, as the answer details."
  ur: "ایک شخص نے متوفی پر قرض کا دعویٰ کیا اور ورثاء نے ادائیگی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21741)⁩ نے جواب دیا کہ مُردے پر قرض کا دعویٰ مدعی کے ثبوت کے بغیر قبول نہیں ہوتا اور عدالت پہنچنے پر قسم ہوتی ہے؛ ثبوت نہ ہو تو اس کا حکم الگ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre reclamó una deuda contra una persona fallecida y los herederos preguntaron sobre cómo pagarla. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21741) respondió que una reclamación de deuda contra un difunto no se acepta sin la prueba del reclamante; si llega a los tribunales, se requiere un juramento exculpatorio. Si no se presenta ninguna prueba, el caso queda sin resolver, como se detalla en la respuesta."
  fr: "Un homme réclamait une dette envers une personne décédée et les héritiers se renseignaient sur les modalités de paiement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21741) a statué qu'une créance sur un défunt n'est pas recevable sans preuve de la part du créancier – avec une déclaration sous serment disculpatoire si l'affaire est portée devant les tribunaux; en l'absence de preuve, la décision est rendue, comme le précise la fatwa."
  tr: "Bir adam, ölen bir kişiye borç iddiasında bulundu ve mirasçılara ödemesi kararını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21741), vefat eden kişiye karşı bir borç talebinin davacının kanıtı olmadan kabul edilmediğini ve konu yargıya ulaşırsa feshi yemini ettiğini yanıtladı. Delil kanıtlanmazsa, cevabında detaylandırıldığı gibi kararı verilir."
  id: "Seorang pria mengklaim utang atas almarhum dan menanyakan kepada ahli waris tentang keputusan pembayaran hutang tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21741) menanggapi bahwa klaim utang terhadap almarhum tidak diterima kecuali dengan bukti penggugat, dan ia mengucapkan sumpah pembubaran jika masalah sampai ke pengadilan. Jika bukti tidak terbukti, maka putusannya dijelaskan sebagaimana tercantum dalam jawaban."
