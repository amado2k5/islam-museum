kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 213 (22/9) بشأن حقوق المعوقين في الفقه الإسلامي", en: "IIFA resolution 213 (22/9) on the rights of persons with disabilities in Islamic jurisprudence", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 213 (22/9): فقہِ اسلامی میں معذور افراد کے حقوق" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. عرّف المعوق بالشخص العاجز ⁦(عقليًا أو حسيًا أو جسديًا)⁩ عن القيام بالأعمال التي يحتاج إليها مقارنة بالشخص السليم، وحقوق المعوقين بالاختصاصات المقررة لهم شرعًا أو نظامًا ليعيشوا حياة كريمة. قرر أن الشريعة الإسلامية اهتمت بحقوق المعوقين وجعلتهم جزءًا لا يتجزأ من المجتمع لهم ما لغيرهم وعليهم ما على غيرهم إلا ما استثني بنص شرعي. وللمعوق حقوق على أسرته: اتخاذ التدابير التي تحد من حصول الإعاقة ابتداء، والنفقة الواجبة، والتربية الصحيحة القائمة على المحبة والاحترام، والسعي في تلبية حاجاته الأساسية كالزواج والسكنى. وحقوق على مجتمعه: دمجه مع أفراده، وتوفير الصحبة الصالحة، واحترامه وعدم انتقاصه بأي شكل، واستثمار طاقاته وقدراته فيما يعود عليه وعلى مجتمعه بالخير. وحقوق على الدولة: الرعاية الصحية بإنشاء مؤسسات طبية متخصصة لعلاجه وتأهيله وتدريب المباشرين لرعايته؛ والتعليم المناسب بأحدث الطرق والوسائل وإعداد معلمين متخصصين؛ والعمل المتلائم مع قدراته بتدريبه لدخول سوق العمل؛ وكفاية المحتاج ماليًا من الزكوات والأوقاف وبيت المال؛ والتنقل بالوسائل المناسبة بتهيئة النقل ووضع معايير للمباني والمرافق العامة تسهل حركته؛ وسن القوانين التي تحفظ حقوقه ومتابعة تنفيذها. وأوصى بالتوعية بحقوقهم للأسرة والمجتمع بكل الوسائل الإعلامية والتعليمية والثقافية والاجتماعية؛ ودعم الجهات الحكومية والأهلية المعنية وتعزيز بيئاتها المساندة؛ وعقد المؤتمرات والندوات وورش العمل في شؤون الإعاقة؛ وإنشاء مراكز دراسات وبحوث تعنى بها؛ وتوسيع نوافذ التواصل بين المجتمع والمعوقين ودعم الجمعيات المحلية والدولية؛ والتأكيد على كل ما يحد من أسباب الإعاقة بما فيه الفحص الطبي قبل الزواج والتطعيم ضد شلل الأطفال؛ والتأكيد على المواثيق الدولية الخاصة بحقوق المعوقين فيما لا يخالف أحكام الشريعة الإسلامية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). It defined the disabled person as one incapable (mentally, sensorially or physically) of performing the acts he needs compared to the sound person, and their rights as the entitlements established for them by sharia or law so they may live a dignified life. It ruled that Islamic sharia attends to their rights and made them an integral part of society: they have what others have and owe what others owe save what a legal text exempts. Their rights on the family: taking measures to prevent disability occurring, the obligatory maintenance, sound upbringing founded on love and respect, and providing basic needs such as marriage and housing. On society: integrating them with others, providing good company, respecting them and never demeaning them, and investing their energies and capacities to their own and their society's benefit. On the state: health care through specialised medical institutions for treatment and rehabilitation with trained carers; suitable education with the latest methods and specialised teachers; work suited to their capacities with training for the labour market; financial sufficiency for the needy through zakat, awqaf and the public treasury; mobility by suitable means with appropriate transport and building and facility standards easing their movement; and laws safeguarding their rights with follow-up on implementation. It recommended awareness-raising for family and society by every media, educational, cultural and social means; supporting state and civil bodies concerned with disability; conferences, seminars and workshops; study and research centres; widening channels of communication between society and the disabled and supporting local and international associations; everything reducing the causes of disability including premarital medical screening and polio vaccination; and affirming the international charters on their rights in what does not contravene Islamic sharia."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ معذور کی تعریف: وہ شخص جو صحت مند کے مقابلے میں اپنے لیے ضروری کام کرنے سے عاجز ہو ⁦(ذہنی، حسی یا جسمانی طور پر)⁩، اور ان کے حقوق وہ استحقاقات ہیں جو شریعت یا قانون انہیں دیتا ہے تاکہ وہ عزت کی زندگی گزاریں۔ اکیڈمی نے فیصلہ دیا کہ شریعتِ اسلامی نے ان کے حقوق کی عنايت کی اور انہیں معاشرے کا لازمی حصہ بنایا: ان کے لیے وہی جو دوسروں کے لیے اور ان پر وہی جو دوسروں پر سوائے جو شرعی نص مستثنا کرے۔ خاندان پر ان کے حقوق: معذوری کے اسباب سے بچنے کے اقدامات، واجب نفقہ، محبت و احترام پر مبنی صحیح تربیت، اور بنیادی ضروریات جیسے شادی اور رہائش کی فراہمی۔ معاشرے پر حقوق: دوسرے افراد میں ان کا ضم ہونا، نیک صحبت کی فراہمی، احترام اور کسی صورت تحقیر نہ کرنا، اور ان کی طاقتوں اور صلاحیتوں کو ان کے اور معاشرے کے بھلے میں لگانا۔ ریاست پر حقوق: مخصوص طبی اداروں کے ذریعے علاج و بحالی اور تربیت شدہ نگہبانوں کی صحت کی دیکھ بھال؛ جدید طریقوں اور مخصوص معلمین کے ساتھ مناسب تعلیم؛ ان کی صلاحیتوں سے ہم آہنگ کام اور محنت بازار کے لیے تربیت؛ زکوٰۃ، اوقاف اور بیت المال سے محتاج کی مالی کفالت؛ مناسب ذرائع نقل و حمل اور عمارتوں و عوامی سہولتوں کے معیارات جن سے ان کی نقل آسان ہو؛ اور ان کے حقوق کے تحفظ کے قوانین اور ان کے نفاذ کی نگرانی۔ سفارشات: خاندان اور معاشرے میں ان کے حقوق کی آگہی ہر ذریعہ ابلاغ، تعلیم، ثقافت اور سماجیت سے؛ معذوری سے متعلق سرکاری و اہلی اداروں کی مدد اور معاون ماحول کی ترقی؛ کانفرنسیں، سیمینارز اور ورکشاپس؛ مطالعہ و تحقیق مراکز کا قیام؛ معاشرے اور معذور افراد کے درمیان روابط کے وسعت اور مقامی و بین الاقوامی تنظیموں کی حمایت؛ معذوری کے اسباب کم کرنے کے تمام ذرائع بشمول شادی سے پہلے طبی معائنہ اور پولیو ویکسین؛ اور معذور افراد کے حقوق کے بین الاقوامی معاہدوں کی تائید بشرطیکہ وہ شریعتِ اسلامی کے احکام سے متصادم نہ ہوں۔"
