summary:
  ar: "كشاف اصطلاحات الفنون والعلوم لمحمد أعلى بن علي التهانوي، وهو من أهل السنة عقيدةً وحنفي عملاً بحسب ما يدل عليه نسبه، وُلد في تهانة شمال غرب دلهي، وتولى القضاء فيها في أواخر عهد أورنكزيب. تعلّم العربية والعلوم الدينية على أبيه، ثم علّم نفسه المنطق والفلسفة والطب والهيئة والحساب من الكتب التي جمعها. ومن اهتمامه بالمصطلحات أراد أن يجمع مصطلحات العلوم كلها في كتاب واحد."
  en: "Muhammad A'la ibn Ali al-Thanawi's Kashshaf Istilahat al-Funun wa-l-Ulum. Its author, from Thana north-west of Delhi, is shown by his nisbas to descend from Umar, to be Sunni in creed and Hanafi in practice; he served as judge at Thana towards the end of Aurangzeb's reign. He learned Arabic and the religious sciences from his father, then taught himself logic, philosophy, medicine, astronomy and arithmetic from the books he collected, and, curious about terms, set out to gather the terms of all the sciences in one book."
  es: "El Kashshaf Istilahat al-Funun wa-l-Ulum de Muhammad A'la ibn Ali al-Thanawi. Su autor, de Thana, al noroeste de Delhi, muestra por sus nisbas descender de Umar, ser sunní en el credo y hanafí en la práctica; fue juez en Thana hacia el final del reinado de Aurangzeb. Aprendió árabe y las ciencias religiosas de su padre, luego estudió por su cuenta lógica, filosofía, medicina, astronomía y aritmética a partir de los libros que reunió y, movido por su interés en los términos, se propuso reunir los términos de todas las ciencias en un solo libro."
  fr: "Le Kashshaf Istilahat al-Funun wa-l-Ulum de Muhammad A'la ibn Ali al-Thanawi. Son auteur, de Thana, au nord-ouest de Delhi, montre par ses nisbas qu'il descend d'Umar, qu'il est sunnite de credo et hanafite de pratique ; il fut juge à Thana vers la fin du règne d'Aurangzeb. Il apprit l'arabe et les sciences religieuses auprès de son père, puis étudia seul la logique, la philosophie, la médecine, l'astronomie et l'arithmétique dans les livres qu'il avait réunis, et, curieux des termes, entreprit de rassembler en un seul livre les termes de toutes les sciences."
  ur: "محمد اعلیٰ بن علی تھانوی کی کشاف اصطلاحات الفنون والعلوم۔ مصنف، جو دہلی کے شمال مغرب میں تھانہ کے تھے، اپنی نسبتوں سے عمر کی اولاد، عقیدے میں سنی اور عمل میں حنفی ظاہر ہوتے ہیں؛ انہوں نے اورنگزیب کے آخری دور میں تھانہ میں قضا کی۔ انہوں نے عربی اور دینی علوم اپنے والد سے سیکھے، پھر جمع کی ہوئی کتابوں سے منطق، فلسفہ، طب، ہیئت اور حساب خود پڑھے، اور اصطلاحات سے دل چسپی کی بنا پر تمام علوم کی اصطلاحات ایک کتاب میں جمع کرنے کا ارادہ کیا۔"
  tr: "Muhammed A'la ibn Ali el-Tahavavi tarafından yazılmış Kashaf İstilat el-Funun ve el-Ulum, soyundan gelen Sünni inanç ve Hanefi alimidir. Delhi'nin kuzeybatısındaki Tehana'da doğdu ve Aurangzeb'in son döneminde burada yargıç olarak görev yaptı. Babasından Arapça ve din bilimleri öğrendi, ardından topladığı kitaplardan mantık, felsefe, tıp, astronomi ve aritmetiği kendi kendine öğrendi. Terminolojiye olan ilgisi nedeniyle, tüm bilim terimlerini tek bir kitapta toplamak istedi."
  id: "Kashaf Istilat al-Funun wa al-Ulum oleh Muhammad A'la ibn Ali al-Tahanawi, seorang ulama Sunni dalam agama dan Hanafi menurut garis keturunannya. Ia lahir di Tehana, barat laut Delhi, dan menjabat sebagai hakim di sana pada akhir pemerintahan Aurangzeb. Ia belajar bahasa Arab dan ilmu agama dari ayahnya, kemudian belajar sendiri logika, filsafat, kedokteran, astronomi, dan aritmatika dari buku-buku yang ia kumpulkan. Karena minatnya pada terminologi, ia ingin mengumpulkan semua istilah ilmu pengetahuan menjadi satu buku."
