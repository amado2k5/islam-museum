label: { ar: "رواية «إيمان أبي بكر وإيمان إبليس واحد» عن أبي حنيفة", en: "The report ascribed to Abu Hanifa that Abu Bakr's and Iblis's faith are one", ur: "ابوحنیفہ سے منسوب روایت: ابو بکر اور ابلیس کا ایمان ایک ہے", es: "El informe atribuido a Abu Hanifa dice que la fe de Abu Bakr y la de Iblis son una", fr: "Le récit attribué à Abou Hanifa affirme que la foi d'Abou Bakr et d'Iblis est la même." }
summary:
  ar: "سأل سائل عن رواية مروية عن أبي حنيفة من طريق الفزاري أن إيمان أبي بكر وإيمان إبليس واحد. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87079 بتاريخ 8 يوليو 2012)⁩ أن الرواية إن صحت لا علاقة لها بما يفتريه الخراصون، فالإيمان قد يطلق على المعرفة أو التصديق أو الإخبات والانقياد أو كلها، وقد أراد أبو حنيفة — إن صح النقل — التنبيه إلى أن النقيضين قد يلتقيان في جانب دون سائر الجوانب، فأبو بكر قمة الإيمان والشيطان رأس الكفر وقد يلتقيان في أصل معرفة الله كما كان مشركو مكة يقرون بالربوبية، وبيّن الفرق بينهما على ما ورد في الجواب."
  en: "A questioner asked about a report transmitted from Abu Hanifa via al-Fazari that Abu Bakr's faith and Iblis's faith are one. Dr. Salah al-Sawi (fatwa no. 87079, 8 July 2012) answered that the report — if authentic — has nothing to do with what slanderers claim: iman is applied to knowledge, to assent, to humble submission, or to all of these; Abu Hanifa — if the report is sound — meant to note that two opposites may meet in one aspect without the others: Abu Bakr is the summit of faith and Satan the head of disbelief, yet they share the root of knowing God, as Mecca's polytheists acknowledged lordship — and the difference between them is the answer spells out."
  ur: "ایک سائل نے ابو حنیفہ سے منقول روایت پوچھی کہ ابو بکر اور ابلیس کا ایمان ایک ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87079، 8 جولائی 2012)⁩ کے مطابق ایمان معرفت، تصدیق اور انقیاد سب پر اطلاق ہوتا ہے؛ دونوں مخالفین صرف معرفت میں شریک ہیں باقی میں نہیں — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un interlocutor preguntó sobre un informe transmitido por Abu Hanifa a través de al-Fazari según el cual la fe de Abu Bakr y la de Iblis son una sola. El Dr. Salah al-Sawi (fatwa n.º 87079, 8 de julio de 2012) respondió que el informe, de ser auténtico, no tiene nada que ver con lo que afirman los calumniadores: iman se aplica al conocimiento, al asentimiento, a la sumisión humilde o a todo ello; Abu Hanifa, si el informe es fiable, quiso señalar que dos opuestos pueden coincidir en un aspecto sin los otros: Abu Bakr es la cúspide de la fe y Satanás la cabeza de la incredulidad, pero comparten la raíz del conocimiento de Dios, como reconocieron los politeístas de La Meca, y la diferencia entre ellos es lo que explica la respuesta."
  fr: "Un interrogateur a posé une question concernant un hadith rapporté par Abou Hanifa via al-Fazari, selon lequel la foi d'Abou Bakr et celle d'Iblis ne feraient qu'une. Le Dr Salah al-Sawi (fatwa n° 87079, 8 juillet 2012) a répondu que ce hadith, s'il est authentique, n'a rien à voir avec les affirmations calomniatrices: la foi (iman) englobe la connaissance, l'adhésion, la soumission humble, ou l'ensemble de ces éléments. Abou Hanifa, si le hadith est véridique, voulait souligner que deux contraires peuvent se rejoindre sur un point sans que les autres soient incompatibles: Abou Bakr représente le sommet de la foi et Satan le chef de l'incroyance, pourtant ils partagent la même origine: la connaissance de Dieu, à l'instar des polythéistes de La Mecque qui reconnaissaient la seigneurie divine. La réponse expose clairement la différence entre eux."
