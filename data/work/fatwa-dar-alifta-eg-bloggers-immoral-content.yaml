summary:
  ar: "سائل سأل عن قيام صناع المحتوى المعروفين بالبلوجر بنشر المقاطع غير الأخلاقية على منصات الإعلام الرقمي لزيادة المتابعين والربح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22044)⁩ ببيان حكم ذلك وما يترتب عليه على ما فصّل الجواب."
  en: "A questioner asked about content-makers known as 'bloggers' posting immoral clips on digital media platforms to grow followers and profit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22044) answered by setting out the ruling on that and what follows from it, as the answer details."
  ur: "ایک سائل نے 'بلاگرز' کے ذہین میڈیا پلیٹ فارمز پر پیروکار اور منافع بڑھانے کے لیے غیر اخلاقی ویڈیوز ڈالنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22044)⁩ نے جواب میں اس کا حکم اور اس کے نتائج بیان کیے۔"
