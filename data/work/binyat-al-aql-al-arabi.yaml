summary:
  ar: "الجزء الثاني من مشروع «نقد العقل العربي» لمحمد عابد الجابري، يحلل فيه نظم المعرفة في الثقافة العربية، صدرت طبعته الأولى عن مركز دراسات الوحدة العربية ببيروت سنة 1986 وتوالت طبعاته."
  en: "The second part of Mohammed Abed al-Jabri's Critique of Arab Reason, analysing the systems of knowledge in Arab culture; its first edition was published by the Centre for Arab Unity Studies, Beirut, in 1986, and many printings followed."
  ur: "محمد عابد الجابری کے منصوبے «نقد العقل العربی» کا دوسرا حصہ جو عرب ثقافت میں علم کے نظاموں کا تجزیہ کرتا ہے؛ اس کا پہلا ایڈیشن مرکز دراسات الوحدۃ العربیۃ، بیروت سے 1986ء میں شائع ہوا اور اس کے بعد کئی طباعتیں ہوئیں۔"
  es: "La segunda parte de la Crítica de la razón árabe de Mohammed Abed al-Jabri, que analiza los sistemas de conocimiento en la cultura árabe; su primera edición fue publicada por el Centro de Estudios de la Unidad Árabe, Beirut, en 1986, y posteriormente se realizaron numerosas reimpresiones."
