id: work/fatwa-dar-alifta-eg-deeds-and-entering-paradise
class: work
kind: fatwa
label: { ar: "التوفيق بين دخول الجنة بالأعمال وبين حديث ⁦(لن يدخل أحدكم الجنة بعمله)⁩", en: "Reconciling entering paradise by deeds with the hadith that no one enters by his deeds", ur: "اعمال سے جنت میں داخلے اور حدیث 'کوئی اپنے عمل سے جنت میں نہیں جائے گا' میں توفیق", es: "Conciliar la entrada al paraíso por las obras con el hadiz que dice que nadie entra por sus obras.", fr: "Concilier l'idée d'entrer au paradis par ses œuvres avec le hadith selon lequel nul n'y entre par ses œuvres" }
summary:
  ar: "سائل سأل عن التوفيق بين النصوص الواردة في دخول الجنة بالأعمال وبين الحديث الصحيح المتفق عليه في أن أحدًا لا يدخل الجنة بعمله. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21666)⁩ أن الحديث صحيح متفق عليه ولا تعارض بينه وبين الآيات على ما فصّل الجواب من وجه الجمع."
  en: "A questioner asked how to reconcile the texts on entering paradise through deeds with the agreed authentic hadith that no one enters paradise by his deeds. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21666) answered that the hadith is sound and agreed upon and does not conflict with the verses — the answer sets out the reconciliation."
  ur: "ایک سائل نے اعمال سے جنت میں داخلے کے نصوص اور صحیح متفق علیہ حدیث 'کوئی اپنے عمل سے جنت میں داخل نہیں ہوگا' کے مابین توفیق پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21666)⁩ نے جواب دیا کہ حدیث صحیح ہے اور آیات سے تعارض نہیں — جواب میں توفیق بیان ہوئی۔"
  es: "Un consultante preguntó cómo conciliar los textos sobre la entrada al paraíso mediante las obras con el hadiz auténtico y consensuado que afirma que nadie entra al paraíso por sus obras. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21666) respondió que el hadiz es sólido y consensuado, y que no entra en conflicto con los versículos; la respuesta expone la conciliación."
  fr: "Un internaute a demandé comment concilier les textes relatifs à l'accès au paradis par les œuvres avec le hadith authentique et reconnu selon lequel nul n'y entre par ses œuvres. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21666) a répondu que le hadith est authentique et reconnu, et qu'il ne contredit pas les versets; la réponse expose la solution de conciliation."
