summary:
  ar: "كتاب ليوسف القرضاوي في ضوابط فهم السنة النبوية والتعامل معها، صدرت طبعته الأولى عن دار الوفاء بالمنصورة والمعهد العالمي للفكر الإسلامي بهيرندن سنة 1990، وبلغ طبعته الثالثة سنة 1991."
  en: "A book by Yusuf al-Qaradawi on principles for understanding and applying the Sunna; its first edition was published by Dar al-Wafa (al-Mansura) and the International Institute of Islamic Thought (Herndon, Virginia) in 1990, and it reached a third edition in 1991."
  ur: "یوسف القرضاوی کی کتاب جو سنتِ نبوی کو سمجھنے اور برتنے کے ضوابط پر ہے؛ اس کا پہلا ایڈیشن دار الوفاء، منصورہ اور انٹرنیشنل انسٹی ٹیوٹ آف اسلامک تھاٹ، ہرنڈن سے 1990ء میں شائع ہوا، اور 1991ء میں تیسرا ایڈیشن آیا۔"
  es: "Un libro de Yusuf al-Qaradawi sobre los principios para comprender y aplicar la Sunna; su primera edición fue publicada por Dar al-Wafa (al-Mansura) y el Instituto Internacional de Pensamiento Islámico (Herndon, Virginia) en 1990, y alcanzó una tercera edición en 1991."
