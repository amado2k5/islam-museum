id: work/fatwa-amja-grooming-while-menstruating
class: work
kind: fatwa
label: { ar: "إزالة الشعر للحائض", en: "Removing pubic hair, clipping nails while menstruating — no bar", ur: "حیض میں بال ناخن کاٹنا — جائز", es: "Depilarse el vello púbico, cortarse las uñas durante la menstruación: no hay límites.", fr: "S'épiler le pubis, se couper les ongles pendant les règles — pas de problème", tr: "Adet Tüylerinin Alınımı", id: "Penghilangan Bulu Menstruasi" }
summary:
  ar: "سألت امرأة عن حكم إزالة شعر العانة أو قص شعر الرأس أو الأظافر والمرأة حائض. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21945 بتاريخ 28 سبتمبر 2006)⁩ أنه لا حرج في ذلك فليس في الأدلة ما يوجب الطهارة لإزالة شيء من ذلك على ما فصّل الجواب."
  en: "A woman asked the ruling on removing pubic hair or cutting the head's hair or nails while menstruating. Dr. Salah al-Sawi (fatwa no. 21945, 28 September 2006) answered that there is no harm in it — nothing in the proofs obliges purity for removing any of that — as the answer details."
  ur: "حیض میں بال یا ناخن کاٹنا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21945، 28 ستمبر 2006)⁩ کے مطابق جائز — طہارت شرط نہیں۔"
  es: "Una mujer preguntó sobre la conveniencia de depilarse el vello púbico o cortarse el cabello o las uñas durante la menstruación. El Dr. Salah al-Sawi (fatwa n.° 21945, 28 de septiembre de 2006) respondió que no hay ningún inconveniente en ello; ninguna prueba exige pureza para depilarse, como se detalla en la respuesta."
  fr: "Une femme a demandé l'avis du Dr Salah al-Sawi concernant l'épilation pubienne, la coupe des cheveux ou des ongles pendant les menstruations. Le Dr Salah al-Sawi (fatwa n° 21945, 28 septembre 2006) a répondu qu'il n'y a aucun mal à cela — rien dans les preuves ne justifie une condition de pureté pour s'épiler ou se couper les cheveux — comme le précise la réponse."
  tr: "Bir kadın, adet döneminde kasık tüylerinin alınması veya baş ya da tırnak tüylerinin kesilmesine ilişkin karar hakkında sorular soruldu. Dr. Salah Al-Sawy (28 Eylül 2006 tarihli 21945 sayılı Fetva) yanıtladı; çünkü cevabında açıklandığı gibi, bunların herhangi birini çıkarmak için arınma gerektiren bir şey olmadığı için bunun zararı olmadığını söyledi."
  id: "Seorang wanita ditanya tentang aturan pengangkatan bulu kemaluan atau pemotongan rambut di kepala atau kuku saat wanita sedang menstruasi. Dr. Salah Al-Sawy menjawab (Fatwa No. 21945 tertanggal 28 September 2006) bahwa tidak ada bahaya dalam hal itu, karena tidak ada bukti yang memerlukan pemurnian untuk menghilangkan hal tersebut, seperti yang dijelaskan dalam jawaban."
