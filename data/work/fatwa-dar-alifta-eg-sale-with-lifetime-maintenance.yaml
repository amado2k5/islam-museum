id: work/fatwa-dar-alifta-eg-sale-with-lifetime-maintenance
class: work
kind: fatwa
label: { ar: "حكم البيع مع شرط الصيانة المجانية مدة العمر الافتراضي للمنتج", en: "Selling with a condition of free maintenance for the product's lifetime", ur: "مصنوع کی مدتِ عمل تک مفت مرمت کی شرط کے ساتھ بیع", es: "Se vende con la condición de mantenimiento gratuito durante toda la vida útil del producto.", fr: "Vendu avec entretien gratuit à vie.", tr: "Ücretsiz bakım koşullarıyla satış kuralı Ürün ömrü", id: "Aturan penjualan dengan kondisi perawatan gratis Umur produk" }
summary:
  ar: "سائل: نحن نبيع الأدوات المنزلية المستعملة، وجاءنا عميل وطلب أجهزة واشترط صيانة مجانية مدة العمر الافتراضي للمنتج، فما الحكم؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24386)⁩ ببيان حكم إلحاق شرط الصيانة المجانية بعقد البيع وضوابط اشتراط الخدمة اللاحقة على المبيع."
  en: "A questioner who sells used household appliances said a customer asked for devices on condition of free maintenance for the product's expected lifetime; what is the ruling? Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24386) answered by setting out the ruling on attaching a free-maintenance condition to a contract of sale and the controls on stipulating follow-on service on goods sold."
  ur: "ایک سائل جو استعمال شدہ گھریلو آلات بیچتا ہے کہتا ہے کہ ایک صارف نے ایسے آلات مانگے جن پر مصنوع کی مدتِ عمل تک مفت مرمت کی شرط ہو؛ حکم کیا ہے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24386)⁩ نے جواب میں بیع کے عقدے کے ساتھ مفت مرمت کی شرط ملانے کے حکم اور فروخت شدہ چیز پر بعد کی خدمت کی شرط لگانے کے ضوابط بیان کیے۔"
  es: "Un vendedor de electrodomésticos usados preguntó si un cliente le había pedido que le proporcionara el mantenimiento gratuito durante la vida útil prevista del producto. ¿Cuál es la norma al respecto? El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 24386) respondió estableciendo la norma sobre la inclusión de una condición de mantenimiento gratuito en un contrato de compraventa y las normas para estipular el servicio posventa de los bienes vendidos."
  fr: "Un vendeur d'électroménager d'occasion a indiqué qu'un client avait demandé une garantie de maintenance gratuite pendant toute la durée de vie prévue du produit; quelle est la décision juridique ? La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24386) a répondu en exposant la décision relative à l'inclusion d'une clause de maintenance gratuite dans un contrat de vente et les règles encadrant la stipulation d'un service après-vente pour les biens vendus."
  tr: "Soru soran: Kullanılmış ev aletleri satıyoruz ve bir müşteri bize cihaz talep ederek ürünün ömrü boyunca ücretsiz bakım şartı koştu. Karar nedir? Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 24386), satış sözleşmesine ücretsiz bakım şartının eklenmesine ilişkin kararı ve satış sonrası hizmet zorunluluğuna ilişkin düzenlemeleri netleştirdi."
  id: "Pertanya: Kami menjual peralatan rumah tangga bekas, dan seorang pelanggan datang kepada kami untuk meminta perangkat dan menetapkan perawatan gratis selama masa pakai produk. Apa putusannya? Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 24386) menanggapi dengan memperjelas putusan tentang penambahan syarat perawatan gratis ke dalam kontrak penjualan dan peraturan yang mewajibkan layanan purna jual."
