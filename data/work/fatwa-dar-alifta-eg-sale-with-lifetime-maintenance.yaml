id: work/fatwa-dar-alifta-eg-sale-with-lifetime-maintenance
class: work
kind: fatwa
label: { ar: "حكم البيع مع شرط الصيانة المجانية مدة العمر الافتراضي للمنتج", en: "Selling with a condition of free maintenance for the product's lifetime", ur: "مصنوع کی مدتِ عمل تک مفت مرمت کی شرط کے ساتھ بیع" }
summary:
  ar: "سائل: نحن نبيع الأدوات المنزلية المستعملة، وجاءنا عميل وطلب أجهزة واشترط صيانة مجانية مدة العمر الافتراضي للمنتج، فما الحكم؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24386)⁩ ببيان حكم إلحاق شرط الصيانة المجانية بعقد البيع وضوابط اشتراط الخدمة اللاحقة على المبيع."
  en: "A questioner who sells used household appliances said a customer asked for devices on condition of free maintenance for the product's expected lifetime; what is the ruling? Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24386) answered by setting out the ruling on attaching a free-maintenance condition to a contract of sale and the controls on stipulating follow-on service on goods sold."
  ur: "ایک سائل جو استعمال شدہ گھریلو آلات بیچتا ہے کہتا ہے کہ ایک صارف نے ایسے آلات مانگے جن پر مصنوع کی مدتِ عمل تک مفت مرمت کی شرط ہو؛ حکم کیا ہے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24386)⁩ نے جواب میں بیع کے عقدے کے ساتھ مفت مرمت کی شرط ملانے کے حکم اور فروخت شدہ چیز پر بعد کی خدمت کی شرط لگانے کے ضوابط بیان کیے۔"
