id: work/fatwa-dar-alifta-eg-employee-secret-commission
class: work
kind: fatwa
label: { ar: "حكم أخذ الموظف نسبة أو عمولة من شركة يشتري منها لجهة عمله دون علمها", en: "An employee taking a percentage from a supplier his employer buys from, without its knowledge", ur: "ملازم کا خریدار ادارے کی بے خبری میں سپلائر سے کمیشن لینا", es: "Un empleado que recibe un porcentaje de un proveedor al que su empleador le compra, sin su conocimiento.", fr: "Un employé qui perçoit un pourcentage auprès d'un fournisseur de son employeur, à l'insu de ce dernier.", tr: "Bir çalışanın, işvereni için satın aldığı bir şirketten yüzde veya komisyon almasına ilişkin karar", id: "Putusan tentang seorang karyawan yang mengambil persentase atau komisi dari perusahaan yang dibelinya untuk pemberi kerja tanpa sepengetahuan perusahaan tersebut" }
summary:
  ar: "سائل سأل عن أخذ الموظف نسبة أو عمولة من شركة يشتري منها لصالح جهة عمله دون علمها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22156)⁩ أن ذلك محرم شرعًا لأنه من أكل أموال الناس بالباطل وخيانة الأمانة، على ما فصّل الجواب."
  en: "A questioner asked about an employee taking a percentage or commission from a company he buys from on his employer's behalf, without the employer's knowledge. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22156) answered that this is forbidden — it is consuming people's wealth wrongfully and betraying a trust, as the answer details."
  ur: "ایک سائل نے پوچھا کہ ملازم اس کمپنی سے کمیشن لے جس سے وہ اپنے ادارے کے لیے خریداری کرتا ہو، ادارے کی بے خبری میں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22156)⁩ نے جواب دیا کہ یہ حرام ہے کیونکہ یہ لوگوں کا مال ناحق کھانا اور امانت میں خیانت ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que un empleado reciba un porcentaje o comisión de una empresa a la que le compra en nombre de su empleador, sin el conocimiento de este último. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22156) respondió que esto está prohibido, ya que constituye un consumo indebido de la riqueza ajena y una traición a la confianza, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un employé qui perçoit un pourcentage ou une commission d'une entreprise auprès de laquelle il effectue des achats pour le compte de son employeur, à l'insu de ce dernier. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22156) a répondu que cela est interdit: il s'agit d'un détournement de fonds publics et d'un abus de confiance, comme le précise la réponse."
  tr: "Bir soru soran, bir çalışanın işvereni adına satın aldığı bir şirketten bilgisi olmadan bir yüzde veya komisyon alması hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22156), bunun İslam hukukunda yasak olduğunu, çünkü insanların parasını hukuka aykırı tüketmek ve güveni ihlal etmek olduğunu söyledi, bu da cevabında ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang seorang karyawan yang mengambil persentase atau komisi dari perusahaan yang dibelinya atas nama atasannya tanpa sepengetahuan mereka. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22156) menjawab bahwa hal ini dilarang dalam hukum Islam karena secara ilegal mengonsumsi uang orang dan mengkhianati kepercayaan, seperti yang dijelaskan dalam jawabannya."
