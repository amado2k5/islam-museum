id: work/fatwa-aliftaa-jo-sick-pilgrim-who-missed-tawaf-al-ifada
class: work
kind: fatwa
label: { ar: "حاج مريض لم يطف طواف الإفاضة", en: "A sick pilgrim who could not perform the circumambulation of ifada", ur: "بیمار حاجی جو طوافِ افاضہ نہ کر سکا" }
summary:
  ar: "سؤال من حاج مريض أدى الوقوف والمبيت والرمي والحلق ثم عاد إلى بلده دون طواف الإفاضة والسعي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه ما زال محرمًا إحرامًا جزئيًا، وليس محصرًا، ويتم المناسك بنفسه، ولا يوكل عنه إلا إن صار عاجزًا عجزًا دائمًا. أجابت الدائرة بأن طواف الإفاضة ركن لا يخرج الحاج من حجه إلا به، ولا ينتهي وقته مدى الحياة، ونقلت عن النووي والخطيب الشربيني في مغني المحتاج أن من بقي عليه بقي محرمًا. وقالت إن السائل قد تحلل التحلل الأول الذي يبيح محظورات الإحرام إلا ما يتعلق بالنساء، فإن قدر وجب عليه الرجوع إلى مكة، ولا شيء عليه في مجاوزة الميقات لأنه ما زال محرمًا، فيطوف ويسعى إن كان متمتعًا، ويتحلل التحلل الثاني. وإن عجز وصار في حكم المعضوب الميؤوس من قدرته جاز أن يوكل من يتم عنه الطواف والسعي، ونقلت جواب الشهاب الرملي في فتاواه بأن ذلك يجوز بل يجب، لأن الإنابة إذا أجزأت في النسك كله ففي بعضه أولى. وأما طواف الوداع فذكرت اختلاف العلماء في وجوبه وندبه، وأخذت بالندب تيسيرًا فلا يلزمه دم، وقالت إنه لا يُعد محصرًا لأن المرض ليس سببًا للإحصار ولأنه وقف بعرفة ومضى في حجه."
  en: "A question from a sick pilgrim who stood at Arafat, stayed at Mina, stoned and shaved, then went home without the circumambulation of ifada or the running, in which Jordan's General Iftaa Department answered that he remains partly in the state of ihram and is not 'prevented' (muhsar), and must complete the rites himself, appointing a proxy only if he becomes permanently unable. The Department answered that the circumambulation of ifada is a pillar without which the pilgrim does not leave hajj, and its time never runs out, quoting al-Nawawi and al-Khatib al-Shirbini's Mughni al-Muhtaj that whoever still owes it remains in ihram. It said the questioner has made the first release, which lifts every restriction of ihram except those relating to women; if able, he must return to Makkah, owing nothing for passing the miqat since he is still in ihram, perform the circumambulation and the running if his hajj was tamattu', and so make the second release. If he is unable and has become permanently incapable (ma'dub), he may appoint someone to perform the circumambulation and running for him, quoting al-Shihab al-Ramli's fatwas that this is allowed and indeed required, since if a proxy suffices for the whole rite, it suffices all the more for part of it. On the farewell circumambulation, it noted that scholars differ on whether it is obligatory or recommended and took the recommended view for ease, so no sacrifice is due; and it said he is not prevented, because illness is not a cause of prevention and he had already stood at Arafat and continued his hajj."
  ur: "ایک بیمار حاجی کا سوال جس نے عرفہ کا وقوف، منیٰ میں قیام، رمی اور حلق کیا پھر طوافِ افاضہ اور سعی کے بغیر گھر لوٹ آیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ جزوی طور پر اب بھی احرام میں ہے، محصر نہیں، اور مناسک خود مکمل کرے، اور نائب صرف اسی صورت بنائے جب وہ مستقل طور پر عاجز ہو جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ طوافِ افاضہ ایسا رکن ہے جس کے بغیر حاجی حج سے نہیں نکلتا، اور اس کا وقت کبھی ختم نہیں ہوتا، اور نووی اور خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ جس پر یہ باقی ہو وہ محرم رہتا ہے۔ اس نے کہا کہ سائل پہلا تحلل کر چکا ہے جو عورتوں سے متعلق پابندیوں کے سوا احرام کی تمام پابندیاں ختم کر دیتا ہے؛ اگر وہ قادر ہو تو مکہ لوٹنا لازم ہے، اور میقات سے گزرنے پر کچھ لازم نہیں کیونکہ وہ اب بھی محرم ہے، پھر طواف کرے اور اگر حجِ تمتع تھا تو سعی کرے، اور یوں دوسرا تحلل کرے۔ اور اگر وہ عاجز ہو کر معضوب کے حکم میں آ جائے تو کسی کو طواف اور سعی کے لیے نائب بنا سکتا ہے، اور شہاب رملی کے فتاویٰ سے نقل کیا کہ یہ جائز بلکہ واجب ہے، کیونکہ جب پورے نسک میں نیابت کافی ہے تو اس کے کچھ حصے میں بدرجۂ اولیٰ کافی ہے۔ طوافِ وداع کے بارے میں اس نے علماء کا اختلاف ذکر کیا کہ واجب ہے یا مستحب، اور آسانی کے لیے مستحب کا قول لیا، لہٰذا قربانی لازم نہیں؛ اور کہا کہ وہ محصر نہیں، کیونکہ بیماری احصار کا سبب نہیں اور وہ عرفہ میں وقوف کر کے حج جاری رکھ چکا تھا۔"
