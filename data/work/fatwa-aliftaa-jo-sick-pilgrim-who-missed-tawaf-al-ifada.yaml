id: work/fatwa-aliftaa-jo-sick-pilgrim-who-missed-tawaf-al-ifada
class: work
kind: fatwa
label: { ar: "حاج مريض لم يطف طواف الإفاضة", en: "A sick pilgrim who could not perform the circumambulation of ifada", ur: "بیمار حاجی جو طوافِ افاضہ نہ کر سکا", es: "Un peregrino enfermo que no pudo realizar la circunvalación de Ifada", fr: "Un pèlerin malade qui ne pouvait accomplir la circumambulation d'Ifada", tr: "İfade Tavef'ini kapatmayan hasta bir hacı", id: "Seorang peziarah sakit yang tidak mematikan Tawaf Ifadah" }
summary:
  ar: "سؤال من حاج مريض أدى الوقوف والمبيت والرمي والحلق ثم عاد إلى بلده دون طواف الإفاضة والسعي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه ما زال محرمًا إحرامًا جزئيًا، وليس محصرًا، ويتم المناسك بنفسه، ولا يوكل عنه إلا إن صار عاجزًا عجزًا دائمًا. أجابت الدائرة بأن طواف الإفاضة ركن لا يخرج الحاج من حجه إلا به، ولا ينتهي وقته مدى الحياة، ونقلت عن النووي والخطيب الشربيني في مغني المحتاج أن من بقي عليه بقي محرمًا. وقالت إن السائل قد تحلل التحلل الأول الذي يبيح محظورات الإحرام إلا ما يتعلق بالنساء، فإن قدر وجب عليه الرجوع إلى مكة، ولا شيء عليه في مجاوزة الميقات لأنه ما زال محرمًا، فيطوف ويسعى إن كان متمتعًا، ويتحلل التحلل الثاني. وإن عجز وصار في حكم المعضوب الميؤوس من قدرته جاز أن يوكل من يتم عنه الطواف والسعي، ونقلت جواب الشهاب الرملي في فتاواه بأن ذلك يجوز بل يجب، لأن الإنابة إذا أجزأت في النسك كله ففي بعضه أولى. وأما طواف الوداع فذكرت اختلاف العلماء في وجوبه وندبه، وأخذت بالندب تيسيرًا فلا يلزمه دم، وقالت إنه لا يُعد محصرًا لأن المرض ليس سببًا للإحصار ولأنه وقف بعرفة ومضى في حجه."
  en: "A question from a sick pilgrim who stood at Arafat, stayed at Mina, stoned and shaved, then went home without the circumambulation of ifada or the running, in which Jordan's General Iftaa Department answered that he remains partly in the state of ihram and is not 'prevented' (muhsar), and must complete the rites himself, appointing a proxy only if he becomes permanently unable. The Department answered that the circumambulation of ifada is a pillar without which the pilgrim does not leave hajj, and its time never runs out, quoting al-Nawawi and al-Khatib al-Shirbini's Mughni al-Muhtaj that whoever still owes it remains in ihram. It said the questioner has made the first release, which lifts every restriction of ihram except those relating to women; if able, he must return to Makkah, owing nothing for passing the miqat since he is still in ihram, perform the circumambulation and the running if his hajj was tamattu', and so make the second release. If he is unable and has become permanently incapable (ma'dub), he may appoint someone to perform the circumambulation and running for him, quoting al-Shihab al-Ramli's fatwas that this is allowed and indeed required, since if a proxy suffices for the whole rite, it suffices all the more for part of it. On the farewell circumambulation, it noted that scholars differ on whether it is obligatory or recommended and took the recommended view for ease, so no sacrifice is due; and it said he is not prevented, because illness is not a cause of prevention and he had already stood at Arafat and continued his hajj."
  ur: "ایک بیمار حاجی کا سوال جس نے عرفہ کا وقوف، منیٰ میں قیام، رمی اور حلق کیا پھر طوافِ افاضہ اور سعی کے بغیر گھر لوٹ آیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ جزوی طور پر اب بھی احرام میں ہے، محصر نہیں، اور مناسک خود مکمل کرے، اور نائب صرف اسی صورت بنائے جب وہ مستقل طور پر عاجز ہو جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ طوافِ افاضہ ایسا رکن ہے جس کے بغیر حاجی حج سے نہیں نکلتا، اور اس کا وقت کبھی ختم نہیں ہوتا، اور نووی اور خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ جس پر یہ باقی ہو وہ محرم رہتا ہے۔ اس نے کہا کہ سائل پہلا تحلل کر چکا ہے جو عورتوں سے متعلق پابندیوں کے سوا احرام کی تمام پابندیاں ختم کر دیتا ہے؛ اگر وہ قادر ہو تو مکہ لوٹنا لازم ہے، اور میقات سے گزرنے پر کچھ لازم نہیں کیونکہ وہ اب بھی محرم ہے، پھر طواف کرے اور اگر حجِ تمتع تھا تو سعی کرے، اور یوں دوسرا تحلل کرے۔ اور اگر وہ عاجز ہو کر معضوب کے حکم میں آ جائے تو کسی کو طواف اور سعی کے لیے نائب بنا سکتا ہے، اور شہاب رملی کے فتاویٰ سے نقل کیا کہ یہ جائز بلکہ واجب ہے، کیونکہ جب پورے نسک میں نیابت کافی ہے تو اس کے کچھ حصے میں بدرجۂ اولیٰ کافی ہے۔ طوافِ وداع کے بارے میں اس نے علماء کا اختلاف ذکر کیا کہ واجب ہے یا مستحب، اور آسانی کے لیے مستحب کا قول لیا، لہٰذا قربانی لازم نہیں؛ اور کہا کہ وہ محصر نہیں، کیونکہ بیماری احصار کا سبب نہیں اور وہ عرفہ میں وقوف کر کے حج جاری رکھ چکا تھا۔"
  es: "Una pregunta de un peregrino enfermo que estuvo en Arafat, se quedó en Mina, se apedreó y se afeitó, luego regresó a casa sin la circunvalación de ifada ni la carrera, a la cual el Departamento General de Iftaa de Jordania respondió que permanece parcialmente en estado de ihram y no está 'impedido' (muhsar), y debe completar los ritos él mismo, nombrando un representante solo si queda permanentemente incapacitado. El Departamento respondió que la circunvalación de ifada es un pilar sin el cual el peregrino no abandona el hajj, y su tiempo nunca se agota, citando al-Nawawi y al-Khatib al-Shirbini en Mughni al-Muhtaj que quien aún debe hacerlo permanece en ihram. Dijo que el que preguntaba ha hecho la primera liberación, que levanta todas las restricciones del ihram excepto las relacionadas con las mujeres; Si puede, debe regresar a La Meca, sin deber nada por cruzar el miqat ya que todavía está en ihram, realizar la circunvalación y la carrera si su hajj fue tamattu', y así hacer la segunda liberación. Si no puede y se ha vuelto permanentemente incapaz (ma'dub), puede designar a alguien para que realice la circunvalación y la carrera por él, citando las fatuas de al-Shihab al-Ramli que esto está permitido e incluso requerido, ya que si un sustituto basta para todo el rito, basta aún más para una parte del mismo. En la circunvalación de despedida, señaló que los eruditos difieren sobre si es obligatoria o recomendada y tomó la opinión recomendada por facilidad, por lo que no se debe ningún sacrificio; y dijo que no está impedido, porque la enfermedad no es causa de impedimento y ya había estado en Arafat y continuado su hajj."
  fr: "Un pèlerin malade, ayant séjourné à Arafat puis à Mina après s'être fait lapider et raser, est rentré chez lui sans avoir accompli la circumambulation de l'ifada ni la course, a posé la question. Le Département général de l'Ifta de Jordanie a répondu qu'il demeurait partiellement en état d'ihram et n'était pas empêché (muhsar). Il devait accomplir lui-même les rites, ne désignant un remplaçant qu'en cas d'incapacité permanente. Le Département a précisé que la circumambulation de l'ifada était un pilier du hajj, indispensable à son maintien, et que son temps était illimité. Il a cité l'ouvrage « Mughni al-Muhtaj » d'al-Nawawi et d'al-Khatib al-Shirbini, selon lequel quiconque doit encore l'accomplir demeure en état d'ihram. Le Département a ajouté que le pèlerin avait accompli la première levée de l'ihram, ôtant toutes les restrictions de l'ihram, à l'exception de celles concernant les femmes. S'il en est capable, il doit retourner à La Mecque, sans devoir payer le passage du miqat puisqu'il est toujours en état d'ihram, accomplir la circumambulation et la course si son hajj était tamattu', et ainsi obtenir la seconde libération. S'il en est incapable et qu'il est devenu définitivement incapable (ma'dub), il peut désigner quelqu'un pour accomplir la circumambulation et la course à sa place, en citant les fatwas d'al-Shihab al-Ramli selon lesquelles cela est permis et même requis, car si un représentant suffit pour l'ensemble du rite, cela suffit d'autant plus pour une partie seulement. Concernant la circumambulation d'adieu, il est noté que les savants divergent quant à son caractère obligatoire ou recommandé et l'avis recommandé est retenu par souci de simplicité; aucun sacrifice n'est donc dû; et il est précisé qu'il n'en est pas empêché, car la maladie n'est pas un motif d'empêchement et qu'il s'était déjà arrêté à Arafat et avait poursuivi son hajj."
  tr: "Ayakta kalan, geceyi kalan, taşlayan ve tıraş olan hasta bir hacıdan gelen soruya karşılık, Ürdün Genel Fetva Dairesi, onun hâlâ kısmi ihramda olduğunu, kendisinin ayinleri kendisinin yaptığını ve kalıcı olarak engelli olmadan görevlendirildiğini söyledi. Daire, Tevaf el-İfade'nin hacının sadece Hac'ından ayrılmasına izin veren bir sütun olduğunu ve zamanının bitmediğini söyledi. Hayatı. Mughni al-Muhtac'ta El-Nevevi ve El-Hatib El-Şerbini'nin alıntı yaptığı, orada kalan kişinin ihramda kaldığını belirtti. Soru soranın ilk Telahil'i serbest bırakmış olabileceği, bu ayetin ihram yasaklarını kadınlar hariç kabul ettiği belirtildi. Mümkünse Mekke'ye dönmek zorundadır. Mikatı geçmek zorunda değildir çünkü hâlâ ihramdadır. Eğer hoşuna giderse Tevaf ve Sey'i yapabilir ve ikinci Tevaf sona erebilir. Eğer yeteneksiz hale gelir ve yeteneğinden umudsuzluğa kapılmış biri olarak görülürse, onun adına Tevaf ve Sa'i'yi tamamlayan birini atanması caizdir. El-Şihab Ramli'nin fetvalarında cevabını alıntıladım; bunun cevabıdır, hatta zorunludur, çünkü itibar tüm ayin için yeterliyse, bazı durumlarda tercih edilir. Veda Tevafı konusunda, alimler arasındaki zorunluluk ve tavsiyeye ilişkin farklılıktan bahsettim ve tavsiyeni, kan yoluyla zorunlu olmaması için bir kolaylaştırma olarak aldım ve hastalığın hapis sebep olmadığını, Arafah'ta durup Hac'a gittiğini söyledim."
  id: "Pertanyaan dari seorang peziarah sakit yang melakukan perlakuan berdiri, menginap, merajami rajam, dan mencukur lalu kembali ke negaranya tanpa Tawaf al-Ifadah dan Sa'i, Departemen Fatwa Jenderal Yordania menjawab bahwa ia masih dalam iharm parsial, tidak terbatas, dan melaksanakan ritual sendiri, dan tidak ditunjuk untuk melakukannya kecuali ia menjadi cacat permanen. Departemen menjawab bahwa Tawaf al-Ifadah adalah tiang yang tidak mengizinkan peziarah meninggalkan Haji kecuali melalui dakwah tersebut, dan waktunya tidak berakhir seumur hidup. Surat itu mengutip Al-Nawawi dan Al-Khatib Al-Sharbini dalam Mughni al-Muhtaj bahwa siapa pun yang tetap berada di Tahlat itu tetap berada di Ihram. Dikatakan bahwa penanya mungkin telah membebaskan Talahil pertama, yang mengizinkan larangan Ihram kecuali bagi wanita. Jika memungkinkan, ia harus kembali ke Mekah. Tidak ada kewajiban untuk melewati Miqat karena ia masih berada di Ihram. Ia dapat melakukan Tawaf dan Sa'i jika menikmatinya, dan Tawaf kedua dapat dibubarkan. Jika ia menjadi tidak mampu dan dianggap sebagai orang yang putus asa terhadap kemampuannya, diperbolehkan menunjuk seseorang yang menyelesaikan Tawaf dan Sa'i atas namanya. Saya mengutip jawaban Al-Shihab Al-Ramli dalam fatwa-nya bahwa hal ini diperbolehkan, bahkan wajib, karena jika reputasi cukup untuk seluruh ritual, maka di beberapa bagian lebih disukai. Mengenai Tawaf Perpisahan, saya menyebutkan perbedaan para ulama mengenai kewajiban dan rekomendasinya, dan saya menganggap rekomendasi itu sebagai fasilitasi agar tidak diwajibkan berupa darah, dan mengatakan bahwa itu tidak dianggap sebagai penahanan karena penyakit bukan alasan untuk mengasingkan diri dan karena ia berdiri di Arafah dan melaksanakan Haji."
