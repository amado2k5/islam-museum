id: work/fatwa-iifa-142-physician-liability
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 142 (15/8) بشأن ضمان الطبيب", en: "IIFA resolution 142 (15/8) on the physician's liability", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 142 (15/8): معالج کی ضمانت", es: "Resolución 142 (15/8) de la IIFA sobre la responsabilidad del médico.", fr: "Résolution 142 (15/8) de l'IIFA sur la responsabilité du médecin" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. استحضر أن الطب علم وفن لنفع البشرية وعلى الطبيب مراقبة الله والإخلاص والأداء بالأصول الفنية، وقرر أن الطبيب ضامن إذا ترتب ضرر بالمريض في أحوال: تعمد الضرر؛ الجهل بالطب أو بالفرع الذي أقدم على العمل فيه؛ عدم الإذن الرسمي؛ الإقدام دون إذن المريض أو من يقوم مقامه ⁦(إحالة لقرار 67 ⁦(7/5)⁩)⁩؛ التغرير بالمريض؛ الخطأ الذي لا يقع فيه أمثاله ولا تقره أصول المهنة أو الإهمال والتقصير؛ إفشاء سر المريض بلا مقتضى معتبر ⁦(إحالة لقرار 79 ⁦(8/10)⁩)⁩؛ الامتناع عن الواجب الطبي في الحالات الإسعافية. ثم تناول حالات انتفاء الضمان ومشاركة الضمان والمسؤولية المتعددة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). Citing medicine as a science and art for humanity's benefit, with the physician bound to God-consciousness, sincerity and sound professional practice, it made the physician liable when harm befalls the patient in these cases: intending the harm; ignorance of medicine or of the branch he undertook; lacking official licence; acting without the consent of the patient or his representative (referring to resolution 67 (7/5)); taking undue risks with the patient; error not committed by his peers and not sanctioned by the profession's standards, or negligence and shortcoming; disclosing the patient's secret without valid cause (per resolution 79 (8/10)); and refusing the medical duty in emergencies. It then addressed cases of no liability, shared liability and multiple responsibility."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے طب کو انسانیت کی بھلائی کا علم و فن قرار دیا اور معالج کی ذمہ داری تقویٰ، اخلاص اور درست پیشہ ورانہ کارکردگی بیان کی؛ پھر ان صورتوں میں معالج کو ضامن ٹھہرایا جب مریض کو نقصان پہنچے: نقصان کی تعمد؛ طب یا اس شاخے میں جہالت جس میں اس نے کام کیا؛ سرکاری اجازت نامہ کی عدم موجودگی؛ مریض یا اس کے قائم مقام کی اجازت کے بغیر کارروائی ⁦(قرارداد 67 ⁦(7/5)⁩ کا حوالہ)⁩؛ مریض کو غرر میں ڈالنا؛ ہم درجوں سے نہ ہونے والی غلطی جو پیشے کے اصول تسلیم نہ کریں یا کوتاہی و تقصیر؛ مریض کا راز بلا معتبر سبب افشا کرنا ⁦(قرارداد 79 ⁦(8/10)⁩)⁩؛ اور طوارئ میں طبی فرض سے انکار۔ پھر غیر ضمانت، مشترک ضمانت اور متعدد ذمہ داری کی صورتیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004). Citando la medicina como ciencia y arte para el beneficio de la humanidad, con el médico obligado a la conciencia de Dios, la sinceridad y la buena práctica profesional, hizo al médico responsable cuando el paciente sufre daño en los siguientes casos: intención de causar daño; ignorancia de la medicina o de la rama que ejercía; falta de licencia oficial; actuar sin el consentimiento del paciente o su representante (refiriéndose a la resolución 67 (7/5)); asumir riesgos indebidos con el paciente; error no cometido por sus colegas y no sancionado por los estándares de la profesión, o negligencia y deficiencia; revelar el secreto del paciente sin causa justificada (según la resolución 79 (8/10)); y negarse a cumplir con el deber médico en emergencias. Luego abordó los casos de no responsabilidad, responsabilidad compartida y responsabilidad múltiple."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 15e session à Mascate (14-19 Muharram 1425, 6-11 mars 2004) a établi la responsabilité du médecin en cas de préjudice causé au patient, notamment dans les cas suivants: intention de nuire; ignorance de la médecine ou de la spécialité pratiquée; absence de licence officielle; acte commis sans le consentement du patient ou de son représentant (voir résolution 67 (7/5)); prise de risques indus avec le patient; erreur non commise par ses pairs et non sanctionnée par les normes professionnelles, ou négligence et manquement; divulgation du secret médical du patient sans motif valable (voir résolution 79 (8/10)); et refus d'exercer une intervention médicale en cas d'urgence. La résolution a ensuite abordé les cas d'absence de responsabilité, de responsabilité partagée et de responsabilité multiple."
