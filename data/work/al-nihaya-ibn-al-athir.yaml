label: { ar: "النهاية في غريب الحديث والأثر", en: "al-Nihaya fi Gharib al-Hadith wa-l-Athar", es: "al-Nihaya fi Gharib al-Hadith wa-l-Athar", fr: "al-Nihaya fi Gharib al-Hadith wa-l-Athar", ur: "النہایہ فی غریب الحدیث والاثر" }
summary:
  ar: "النهاية في غريب الحديث والأثر لابن الأثير الجزري، سمّاها النهاية لأنها تضم مضامين الكتب السابقة في هذا الفن. وأشهر ما سبقها كتب أبي عبيد والخطابي وكتاب الغريبين للهروي والفائق للزمخشري ومجموع المغيث لأبي موسى المديني. اعتمد المؤلف على كتاب الهروي وتتمة أبي موسى له، وشرح الألفاظ الغريبة في الحديث والأثر وحدها، وزاد عليها ألفاظاً من مصادر أخرى."
  en: "Ibn al-Athir al-Jazari's al-Nihaya fi gharib al-hadith wa-l-athar, called al-Nihaya because it holds the contents of the earlier books in this field. The best known before it were the books of Abu Ubayd and al-Khattabi, al-Harawi's Kitab al-Gharibayn, al-Zamakhshari's al-Fa'iq and Abu Musa al-Madini's Majmu' al-mughith. The author built on al-Harawi's book and Abu Musa's completion of it, explaining only the unusual words of the hadith and the reports of the Companions, and added others from further sources."
  es: "El al-Nihaya fi gharib al-hadith wa-l-athar de Ibn al-Athir al-Jazari, llamado al-Nihaya porque contiene el contenido de los libros anteriores en este campo. Los más conocidos antes eran los libros de Abu Ubayd y al-Jattabi, el Kitab al-Gharibayn de al-Harawi, el al-Fa'iq de al-Zamajshari y el Majmu' al-mughith de Abu Musa al-Madini. El autor se apoyó en el libro de al-Harawi y en su complemento por Abu Musa, explicó solo las palabras inusuales del hadiz y de los relatos de los Compañeros, y añadió otras de fuentes adicionales."
  fr: "Le al-Nihaya fi gharib al-hadith wa-l-athar d'Ibn al-Athir al-Jazari, appelé al-Nihaya parce qu'il contient la substance des livres antérieurs dans ce domaine. Les plus connus avant lui étaient les livres d'Abu Ubayd et d'al-Khattabi, le Kitab al-Gharibayn d'al-Harawi, le al-Fa'iq d'al-Zamakhshari et le Majmu' al-mughith d'Abu Musa al-Madini. L'auteur s'appuya sur le livre d'al-Harawi et son complément par Abu Musa, n'expliqua que les mots rares du hadith et des récits des Compagnons, et en ajouta d'autres tirés de sources supplémentaires."
  ur: "ابن الاثیر جزری کی النہایہ فی غریب الحدیث والاثر، جسے النہایہ اس لیے کہا گیا کہ اس میں اس فن کی پچھلی کتابوں کے مضامین شامل ہیں۔ اس سے پہلے سب سے معروف ابو عبید اور خطابی کی کتب، ہروی کی کتاب الغریبین، زمخشری کی الفائق اور ابو موسیٰ مدینی کی مجموع المغیث تھیں۔ مصنف نے ہروی کی کتاب اور اس کی ابو موسیٰ کی تکمیل کو بنیاد بنایا، صرف حدیث اور آثار کے غریب الفاظ کی شرح کی، اور دوسرے مآخذ سے مزید الفاظ شامل کیے۔"
