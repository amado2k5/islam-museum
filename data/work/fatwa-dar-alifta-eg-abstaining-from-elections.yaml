label: { ar: "حكم الامتناع عن المشاركة في الانتخابات", en: "Abstaining from participation in elections", ur: "انتخابات میں شرکت سے گریز کا حکم" }
summary:
  ar: "سائل سأل عن الامتناع عن المشاركة في الانتخابات الوطنية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22215)⁩ أن الانتخابات مسلك من مسالك الشورى والمشاركة الفاعلة الإيجابية فيها مطلوبة شرعًا باعتبارها أداء للأمانة، على ما فصّل الجواب."
  en: "A questioner asked about abstaining from participation in national elections. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22215) answered that elections are a channel of shura and that active, positive participation is required in the sharia as a discharge of trust, as the answer details."
  ur: "ایک سائل نے قومی انتخابات میں شرکت سے گریز کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22215)⁩ نے جواب دیا کہ انتخابات شوریٰ کی ایک صورت ہے اور اس میں مثبت اور مؤثر شرکت شرعاً مطلوب ہے بطور امانت کی ادائیگی، جیسا کہ جواب میں تفصیل ہے۔"
