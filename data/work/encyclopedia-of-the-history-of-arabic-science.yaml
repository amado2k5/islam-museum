summary:
  ar: "موسوعة بالإنجليزية في ثلاثة مجلدات حرّرها رشدي راشد بالتعاون مع ريجيس مورلون، صدرت عن دار روتليدج في لندن ونيويورك سنة 1996."
  en: "A three-volume English encyclopedia edited by Roshdi Rashed in collaboration with Régis Morelon, published by Routledge in London and New York in 1996."
  ur: "تین جلدوں پر مشتمل انگریزی دائرۃ المعارف جس کی ادارت رشدی راشد نے ریجیس مورلون کے تعاون سے کی؛ روٹلج، لندن و نیویارک سے 1996ء میں شائع ہوا۔"
  fr: "L'Encyclopedia of the History of Arabic Science est un ouvrage anglais en trois volumes, dirigé par Roshdi Rashed en collaboration avec Régis Morelon. La présentation de l'éditeur en fait la première synthèse à jour de la contribution arabe à l'histoire des sciences, des mathématiques et des techniques, qui documente l'histoire et la philosophie de la science arabe."
  es: "La Encyclopedia of the History of Arabic Science es una obra en inglés de tres volúmenes, dirigida por Roshdi Rashed en colaboración con Régis Morelon. La presentación de la editorial la describe como la primera síntesis actualizada de la contribución árabe a la historia de la ciencia, las matemáticas y la tecnología, que documenta la historia y la filosofía de la ciencia árabe."
  tr: "Encyclopedia of the History of Arabic Science, Rüşdî Râşid'in Régis Morelon ile birlikte yayıma hazırladığı üç ciltlik İngilizce bir ansiklopedidir. Yayıncının tanıtımı onu, Arapların bilim, matematik ve teknoloji tarihine katkısının ilk güncel derlemesi olarak sunar; eser Arap biliminin tarihini ve felsefesini belgeler."
  id: "Encyclopedia of the History of Arabic Science adalah ensiklopedia berbahasa Inggris tiga jilid yang disunting Roshdi Rashed bekerja sama dengan Régis Morelon. Deskripsi penerbit menyebutnya sintesis mutakhir pertama tentang sumbangan Arab bagi sejarah sains, matematika, dan teknologi, yang mendokumentasikan sejarah dan filsafat sains Arab."
