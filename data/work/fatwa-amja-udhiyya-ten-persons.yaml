id: work/fatwa-amja-udhiyya-ten-persons
class: work
kind: fatwa
label: { ar: "الأضحية عن عشرة أنفس", en: "A sacrifice on behalf of ten persons", ur: "دس افراد کی طرف سے قربانی", es: "Un sacrificio en nombre de diez personas" }
summary:
  ar: "سأل سائل عن جواز الأضحية عن عشرة أنفس كأضحية البعير لحديث ابن عباس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86120 بتاريخ 11 ديسمبر 2011)⁩ أن الذي عليه الجمهور أن البقر والإبل يجزئ كل منها عن سبعة أنفس لحديث جابر عند مسلم، وأن بعض أهل العلم كإسحاق وابن خزيمة والشوكاني ذهب إلى أن الإبل تجزئ عن عشرة في الأضحية وعن سبعة في الهدي لحديث ابن عباس عند الترمذي والنسائي على ما فصّل."
  en: "A questioner asked about a sacrifice on behalf of ten persons, citing Ibn Abbas's hadith on the camel. Dr. Salah al-Sawi (fatwa no. 86120, 11 December 2011) answered that the majority hold cattle and camels each suffice for seven persons per Jabir's hadith in Muslim, while some scholars — Ishaq, Ibn Khuzayma, al-Shawkani and others — held the camel suffices for ten in the udhiyya and seven in the hady, on Ibn Abbas's hadith in al-Tirmidhi and al-Nasa'i, as detailed. Recorded as AMJA's answer."
  ur: "ایک سائل نے دس افراد کی طرف سے قربانی کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86120، 11 دسمبر 2011)⁩ کے مطابق جمهور کا قول ہے کہ گائے اور اونٹ سات افراد کے لیے کافی ہیں؛ بعض علماء نے قربانی میں اونٹ کو دس کے لیے کافی کہا — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un consultante preguntó acerca de un sacrificio en nombre de diez personas, citando el hadiz de Ibn Abbas sobre el camello. El Dr. Salah al-Sawi (fatwa n.° 86120, 11 de diciembre de 2011) respondió que la mayoría sostiene que tanto el ganado vacuno como los camellos son suficientes para siete personas según el hadiz de Jabir en Muslim, mientras que algunos eruditos —Ishaq, Ibn Khuzayma, al-Shawkani y otros— sostienen que el camello es suficiente para diez en la udhiyya y para siete en el hady, basándose en el hadiz de Ibn Abbas en al-Tirmidhi y al-Nasa'i, como se detalla. Registrada como respuesta de AMJA."
