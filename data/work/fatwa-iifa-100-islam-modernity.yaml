label: { ar: "قرار مجمع الفقه الإسلامي الدولي 100 (11/3) بشأن الإسلام في مواجهة الحداثة الشاملة", en: "IIFA resolution 100 (11/3) on Islam confronting comprehensive modernity", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 100 (11/3): جامع جدیدیت کے مقابل اسلام", es: "Resolución 100 (11/3) de la IIFA sobre el Islam frente a la modernidad integral." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. وصف في نصه الحداثة الشاملة بأنها مذهب فكري يقوم — بلسانه — على تأليه العقل ورفض الغيب وإنكار الوحي وهدم الموروث المتعلق بالمعتقدات والقيم والأخلاق، وأن خصائصها عند أصحابها الاعتماد المطلق على العقل والاقتصار على معطيات العلم التجريبي بعيدًا عن العقيدة والفصل التام بين الدين وسائر المؤسسات الثقافية والاجتماعية والاقتصادية والسياسية فتلتقي بذلك مع العلمانية. قرر أن الحداثة بهذا المفهوم مذهب يأباه المجمع لمناقضته الإسلام في أصوله، وأن في قواعد الإسلام الثابتة ما يقيم التجديد المنضبط دون هدم للثوابت. سُجّل منسوبًا إلى المجمع."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). Its text describes comprehensive modernity as an intellectual doctrine resting, in its wording, on deifying reason, rejecting the unseen, denying revelation and demolishing inherited beliefs, values and morals — its proponents' features being absolute reliance on reason, confinement to empirical science apart from sound creed, and the total separation of religion from cultural, social, economic and political institutions, meeting secularism in that. It resolved that modernity in this sense is a doctrine the Academy rejects as contradicting Islam's foundations, and that Islam's fixed rules sustain disciplined renewal without demolishing constants. Recorded as the Academy's own position."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ اس کے متن میں جامع جدیدیت کو ایسا فکری مسلک قرار دیا جو اس کے بقول عقل کی معبود سازی، غیب کی رد، وحی کا انکار اور عقائد، اقدار اور اخلاق سے متعلق موروث کی تباہی پر قائم ہے — اس کے حامیوں کے اوصاف: عقل پر مطلق انحصار، تجرباتی سائنس پر محدود رہنا اور دین کی تمام ثقافتی، سماجی، معاشی اور سیاسی اداروں سے مکمل علیحدگی — جس سے یہ سیکولرازم سے مل جاتی ہے۔ فیصلہ: اس مفہوم میں جدیدیت وہ مسلک ہے جو اکیڈمی اسلام کی بنیادوں کے تضاد ہونے کی وجہ سے رد کرتی ہے، اور اسلام کے ثابت اصول ثوابت کو منہدم کیے بغیر منضبط تجدید برپا کرتے ہیں۔ یہاں اکیڈمی کے اپنے مؤقف کا خلاصہ درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 11.ª sesión en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998). Su texto describe la modernidad integral como una doctrina intelectual que, en su formulación, se basa en la deificación de la razón, el rechazo de lo invisible, la negación de la revelación y la demolición de creencias, valores y moral heredados. Sus defensores se caracterizan por una confianza absoluta en la razón, la dedicación a la ciencia empírica al margen de un credo sólido y la separación total de la religión de las instituciones culturales, sociales, económicas y políticas, lo que coincide con el secularismo. La resolución afirma que la modernidad, en este sentido, es una doctrina que la Academia rechaza por contradecir los fundamentos del Islam, y que las normas fijas del Islam sustentan una renovación disciplinada sin destruir los principios fundamentales. Esta resolución se registró como la postura oficial de la Academia."
