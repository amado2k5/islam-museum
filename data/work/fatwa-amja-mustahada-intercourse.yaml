id: work/fatwa-amja-mustahada-intercourse
class: work
kind: fatwa
label: { ar: "جماع المستحاضة", en: "The mustahada — her state bars nothing", ur: "مستحاضہ — نماز و جماع جائز", es: "La mustahada: su estado no prohíbe nada." }
summary:
  ar: "سأل سائل هل يجوز جماع المستحاضة إذا استمر الدم أربعة أشهر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80070 بتاريخ 26 سبتمبر 2009)⁩ أن الاستحاضة لا تمنع ما يمنعه الحيض من الصلاة ومس المصحف والجماع ونحوه بل يحل لها ذلك على أن تتحفظ عند الصلاة حتى لا تلوث مصلاها وتتوضأ لوقت كل صلاة على ما فصّل الجواب من أحكام المستحاضة."
  en: "A questioner asked whether intercourse with a mustahada is lawful where her bleeding ran four months. Dr. Salah al-Sawi (fatwa no. 80070, 26 September 2009) answered that istihada does not bar what menses bars — prayer, touching the mushaf, intercourse and the like are lawful to her, provided she guards herself at prayer lest she soil her place of prayer and does wudu for each prayer's time — the answer detailing the mustahada's rulings."
  ur: "مستحاضہ سے جماع؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80070، 26 ستمبر 2009)⁩ کے مطابق استحاضہ حیض جیسی رکاوٹ نہیں — نماز و جماع جائز بشرط تحفظ و وضو۔"
  es: "Una persona preguntó si era lícito tener relaciones sexuales con una mujer con menstruación (mustahada) cuando su sangrado duró cuatro meses. El Dr. Salah al-Sawi (fatwa n.° 80070, 26 de septiembre de 2009) respondió que la menstruación no prohíbe lo que prohíbe la menstruación: la oración, tocar el Corán, las relaciones sexuales y demás son lícitos para ella, siempre que se cuide durante la oración para no ensuciar su lugar de oración y realice la ablución (wudu) para cada oración. La respuesta detallaba las normas de la mujer con menstruación."
