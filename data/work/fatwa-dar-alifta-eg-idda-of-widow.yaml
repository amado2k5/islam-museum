label: { ar: "عدة المرأة التي توفي عنها زوجها", en: "The waiting period of a woman whose husband dies", ur: "بیوہ عورت کی عدت", es: "El período de espera de una mujer cuyo marido fallece", fr: "Le délai d'attente d'une femme dont le mari décède" }
summary:
  ar: "سائل سأل عن عدة المرأة التي توفي عنها زوجها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22191)⁩ أن المرأة التي توفي عنها زوجها إن كانت غير ذات حمل فإنها تعتد بأربعة أشهر وعشرة أيام يستوي في ذلك المدخول بها وغيرها، على ما فصّل الجواب."
  en: "A questioner asked about the waiting period (idda) of a woman whose husband dies. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22191) answered that a woman whose husband dies, if she is not pregnant, observes an idda of four months and ten days — the same whether the marriage was consummated or not — as the answer details."
  ur: "ایک سائل نے اس عورت کی عدت پوچھی جس کا شوہر فوت ہو جائے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22191)⁩ نے جواب دیا کہ جس عورت کا شوہر فوت ہو اگر وہ حاملہ نہیں تو اس کی عدت چار ماہ دس دن ہے، خواہ نکاح میں دخول ہوا ہو یا نہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre el período de espera (idda) de una mujer cuyo esposo fallece. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22191) respondió que una mujer cuyo esposo fallece, si no está embarazada, observa un período de espera (idda) de cuatro meses y diez días, el mismo tanto si el matrimonio se consumó como si no, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la période d'attente (idda) d'une femme dont le mari décède. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22191) a répondu qu'une femme dont le mari décède, si elle n'est pas enceinte, observe une période d'idda de quatre mois et dix jours, que le mariage ait été consommé ou non, comme le précise la réponse."
