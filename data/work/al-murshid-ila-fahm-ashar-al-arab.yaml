summary:
  ar: "المرشد إلى فهم أشعار العرب، كتاب في العروض والقوافي لمؤلفه عبد الله الطيب، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نُشر 1955م; ت 1424هـ / 2003م {cite:archive-org-al-murshid-ila-fahm-ashar-al-arab}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "al-Murshid ila Fahm Ashar al-Arab, a book on prosody (arud and qawafi) by Abd Allah al-Tayyib; its date in a research summary supplied to the museum is pub. 1955 CE; d. 1424 AH / 2003 CE {cite:archive-org-al-murshid-ila-fahm-ashar-al-arab}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "المرشد إلى فهم أشعار العرب، عروض و قوافی پر ایک کتاب، مصنف عبد الله الطيب؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: اشاعت 1955ء; وفات 1424ھ / 2003ء {cite:archive-org-al-murshid-ila-fahm-ashar-al-arab}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Murshid ila Fahm Ashar al-Arab, livre sur la prosodie (arud et qawafi) de Abd Allah al-Tayyib ; sa date dans une synthèse de recherche remise au musée : publ. 1955; m. 1424 H / 2003 {cite:archive-org-al-murshid-ila-fahm-ashar-al-arab}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "al-Murshid ila Fahm Ashar al-Arab, libro sobre prosodia (arud y qawafi) de Abd Allah al-Tayyib; su fecha en un resumen de investigación entregado al museo: publ. 1955; m. 1424 H. / 2003 {cite:archive-org-al-murshid-ila-fahm-ashar-al-arab}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
