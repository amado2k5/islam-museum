label: { ar: "الآثار الباقية عن القرون الخالية", en: "al-Athar al-Baqiya 'an al-Qurun al-Khaliya", ur: "الآثار الباقیہ عن القرون الخالیہ" }
summary:
  ar: "كتاب أبي ريحان محمد بن أحمد البيروني الخوارزمي في التواريخ والتقاويم والأعياد، ألّفه لشمس المعالي قابوس جواباً عن سؤال أحد الأدباء عن التواريخ التي تستعملها الأمم واختلافها في مبادئها وشهورها وسنيها وأعيادها؛ يبدأ بحقيقة اليوم والشهر والسنة، ثم التواريخ واستخراج بعضها من بعض والأدوار، ثم أعياد الفرس والسغد وأهل خوارزم والروم واليهود والنصارى الملكانية والنسطورية والمجوس والصابئين، ثم ما كانت العرب تستعمله في الجاهلية وما يستعمله أهل الإسلام، ومنازل القمر {cite:athar-baqiya-thaqafa-2008 p. 4} {cite:athar-baqiya-thaqafa-2008 p. 6} {cite:athar-baqiya-thaqafa-2008 p. 401} {cite:athar-baqiya-thaqafa-2008 p. 407} {cite:kashf-zunun-furqan p. 179}."
  en: "Abu Rayhan Muhammad ibn Ahmad al-Biruni's work on eras, calendars and festivals, written for Shams al-Ma'ali Qabus in answer to a man of letters who asked about the eras the nations use and how they differ in their starting points, months, years and feasts; it opens with the nature of the day, month and year, then the eras, converting one into another and the cycles, then the festivals of the Persians, the Sogdians, the people of Khwarazm, the Byzantines, the Jews, the Melkite and Nestorian Christians, the Magians and the Sabians, then what the Arabs used before Islam and what the people of Islam use, and the lunar mansions."
  ur: "ابو ریحان محمد بن احمد بیرونی خوارزمی کی تواریخ، تقاویم اور تہواروں پر کتاب، جو انہوں نے شمس المعالی قابوس کے لیے ایک ادیب کے اس سوال کے جواب میں لکھی کہ قومیں کون سی تواریخ استعمال کرتی ہیں اور ان کے مبادی، مہینوں، برسوں اور عیدوں میں کیا اختلاف ہے؛ یہ دن، مہینے اور سال کی حقیقت سے شروع ہوتی ہے، پھر تواریخ، ان کا ایک دوسرے سے استخراج اور ادوار، پھر فارس، سغد، خوارزم، روم، یہود، ملکانی و نسطوری نصاریٰ، مجوس اور صابئہ کے تہوار، پھر جاہلیت میں عربوں کا طریقہ اور اہلِ اسلام کا طریقہ، اور منازلِ قمر۔"
