structure: "Thaqafa edition: dedication to Shams al-Ma'ali (p. 3); occasion (p. 4); the day and night (p. 6); months and years (p. 11); eras and the nations' disagreement on them (p. 16), with Dhu al-Qarnayn (p. 43); the months used in the old eras (p. 50); converting eras (p. 86); cycles and year-births (p. 171); the eras of false prophets (p. 243); feasts in the months of the Persians (p. 256), Sogdians (p. 280), Khwarazmians (p. 283, 290), Byzantines (p. 292), Jews (p. 336), Melkite Christians (p. 352), Christian fasts (p. 374), Nestorians (p. 381), ancient Magians and Sabians (p. 392); the pre-Islamic Arabs (p. 401); the people of Islam (p. 407); the lunar mansions (p. 416)."
