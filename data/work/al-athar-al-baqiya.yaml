label: { ar: "الآثار الباقية عن القرون الخالية", en: "al-Athar al-Baqiya 'an al-Qurun al-Khaliya", ur: "الآثار الباقیہ عن القرون الخالیہ", es: "al-Athar al-Baqiya 'an al-Qurun al-Khaliya", fr: "al-Athar al-Baqiya 'an al-Qurun al-Khaliya", tr: "Boş Yüzyıllardan Kalan Kalıntılar", id: "Sisa-sisa dari Abad Kosong" }
summary:
  ar: "كتاب أبي ريحان محمد بن أحمد البيروني الخوارزمي في التواريخ والتقاويم والأعياد، ألّفه لشمس المعالي قابوس جواباً عن سؤال أحد الأدباء عن التواريخ التي تستعملها الأمم واختلافها في مبادئها وشهورها وسنيها وأعيادها؛ يبدأ بحقيقة اليوم والشهر والسنة، ثم التواريخ واستخراج بعضها من بعض والأدوار، ثم أعياد الفرس والسغد وأهل خوارزم والروم واليهود والنصارى الملكانية والنسطورية والمجوس والصابئين، ثم ما كانت العرب تستعمله في الجاهلية وما يستعمله أهل الإسلام، ومنازل القمر {cite:athar-baqiya-thaqafa-2008 p. 4} {cite:athar-baqiya-thaqafa-2008 p. 6} {cite:athar-baqiya-thaqafa-2008 p. 401} {cite:athar-baqiya-thaqafa-2008 p. 407} {cite:kashf-zunun-furqan p. 179}."
  en: "Abu Rayhan Muhammad ibn Ahmad al-Biruni's work on eras, calendars and festivals, written for Shams al-Ma'ali Qabus in answer to a man of letters who asked about the eras the nations use and how they differ in their starting points, months, years and feasts; it opens with the nature of the day, month and year, then the eras, converting one into another and the cycles, then the festivals of the Persians, the Sogdians, the people of Khwarazm, the Byzantines, the Jews, the Melkite and Nestorian Christians, the Magians and the Sabians, then what the Arabs used before Islam and what the people of Islam use, and the lunar mansions."
  ur: "ابو ریحان محمد بن احمد بیرونی خوارزمی کی تواریخ، تقاویم اور تہواروں پر کتاب، جو انہوں نے شمس المعالی قابوس کے لیے ایک ادیب کے اس سوال کے جواب میں لکھی کہ قومیں کون سی تواریخ استعمال کرتی ہیں اور ان کے مبادی، مہینوں، برسوں اور عیدوں میں کیا اختلاف ہے؛ یہ دن، مہینے اور سال کی حقیقت سے شروع ہوتی ہے، پھر تواریخ، ان کا ایک دوسرے سے استخراج اور ادوار، پھر فارس، سغد، خوارزم، روم، یہود، ملکانی و نسطوری نصاریٰ، مجوس اور صابئہ کے تہوار، پھر جاہلیت میں عربوں کا طریقہ اور اہلِ اسلام کا طریقہ، اور منازلِ قمر۔"
  es: "La obra de Abu Rayhan Muhammad ibn Ahmad al-Biruni sobre eras, calendarios y festivales, escrita para Shams al-Ma'ali Qabus en respuesta a un hombre de letras que preguntó acerca de las eras que usan las naciones y cómo difieren en sus puntos de partida, meses, años y festividades; comienza con la naturaleza del día, el mes y el año, luego las eras, la conversión de una en otra y los ciclos, luego las festividades de los persas, los sogdianos, la gente de Corasmia, los bizantinos, los judíos, los cristianos melquitas y nestorianos, los magos y los sabeos, luego lo que usaban los árabes antes del Islam y lo que usa la gente del Islam, y las mansiones lunares."
  fr: "L'ouvrage d'Abu Rayhan Muhammad ibn Ahmad al-Biruni sur les ères, les calendriers et les fêtes, écrit pour Shams al-Ma'ali Qabus en réponse à un homme de lettres qui s'interrogeait sur les ères utilisées par les nations et sur leurs différences quant à leurs points de départ, mois, années et fêtes; il s'ouvre sur la nature du jour, du mois et de l'année, puis les ères, leur conversion les unes en les autres et les cycles, puis les fêtes des Perses, des Sogdiens, des habitants du Khwarezm, des Byzantins, des Juifs, des chrétiens melkites et nestoriens, des mages et des Sabéens, puis ce que les Arabes utilisaient avant l'islam et ce que les musulmans utilisent, et les demeures lunaires."
  tr: "Ebu Reyhan Muhammed bin Ahmed el-Biruni el-Horizmi'nin tarihler, takvimler ve bayramlar üzerine kitabı, Şems el-Ma'ali Qabus tarafından ulusların kullandığı tarihler ve ilkeler, aylar, yıllar ve bayramlar konusundaki bir yazarın sorusuna yanıt olarak kaleme alınmıştır; gün, ay ve yılın gerçekliğiyle başlar, sonra tarihler ve bazılarını diğer dönemlerden ve dönemlerden türetir, ardından Perslerin, Sogdların, Harezm halkı, Roma'nın, Yahudilerin, Melkit Hristiyanların, Nesturiyenlerin, Magilerin ve Sabialıların bayramları, ardından İslam öncesi dönemde Arapların kullandıkları, Müslümanların kullandıkları ve ay istasyonları {alıntı: athar-baqiya-thaqafa-2008 s. 4} {cite:athar-baqiya-thaqafa-2008 s. 6} {cite:athar-baqiya-thaqafa-2008 s. 401} {cite:athar-baqiya-thaqafa-2008 s. 407} {cite:kashf-zunun-furqan s. 179}."
  id: "Buku Abu Rayhan Muhammad ibn Ahmad al-Biruni al-Khwarizmi tentang tanggal, kalender, dan festival, ditulis oleh Shams al-Ma'ali Qabus sebagai jawaban atas pertanyaan seorang penulis tentang tanggal yang digunakan oleh bangsa-bangsa dan perbedaan prinsip, bulan, tahun, dan festival mereka; buku ini dimulai dengan kenyataan hari, bulan, dan tahun, kemudian tanggal dan beberapa berasal dari yang lain dan era, kemudian festival Persia, Sogd, masyarakat Khwarezm, Romawi, Yahudi, Kristen Melkit, Nestorian, Majus, dan Sabian, lalu apa yang digunakan Arab pada era pra-Islam, apa yang digunakan Muslim, dan stasiun bulan {sitasi: athar-baqiya-thaqafa-2008 hlm. 4} {kutip:athar-baqiya-thaqafa-2008 hlm. 6} {kutip:athar-baqiya-thaqafa-2008 hlm. 401} {kutip:athar-baqiya-thaqafa-2008 hlm. 407} {kutip:kashf-zunun-furqan hlm. 179}."
