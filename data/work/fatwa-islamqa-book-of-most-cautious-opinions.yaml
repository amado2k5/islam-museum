id: work/fatwa-islamqa-book-of-most-cautious-opinions
class: work
kind: fatwa
label: { ar: "هل يوجد كتاب يبين القول الأحوط في المسائل الخلافية؟", en: "Is there a book giving the most cautious view on disputed questions?", ur: "کیا کوئی کتاب اختلافی مسائل میں احتیاط والا قول بتاتی ہے؟" }
summary:
  ar: "سائل يطلب كتابًا فقهيًّا يذكر في كل مسألة خلافية الدليل والرأي الأحوط الذي يخرج به المرء من الخلاف، لا الراجح وحده. أجاب موقع الإسلام سؤال وجواب بأن العمل بالاحتياط ليس فاضلًا دائمًا ولا مطلوبًا دائمًا، وأنه لا يعلم كتابًا واحدًا يذكر الأحوط في كل مسائل الفقه، وعرض تعريف الاحتياط ونقولًا لأهل العلم في الورع المشروع."
  en: "A questioner asks for a fiqh book that gives, for every disputed question, the evidence and the most cautious view that takes one out of the disagreement, not only the preferred view. IslamQA answered that acting on caution is not always meritorious or always required, and that it knows of no single book that gives the most cautious view on every question of fiqh, setting out a definition of caution and quotations from scholars on legitimate scrupulousness."
  ur: "ایک سائل ایسی فقہی کتاب چاہتا ہے جو ہر اختلافی مسئلے میں دلیل اور وہ احتیاط والا قول بتائے جس سے آدمی اختلاف سے نکل جائے، نہ صرف راجح قول۔ اسلام سوال و جواب نے جواب دیا کہ احتیاط پر عمل ہمیشہ افضل یا ہمیشہ مطلوب نہیں، اور اسے کوئی ایک کتاب معلوم نہیں جو فقہ کے ہر مسئلے میں احتیاط والا قول بیان کرے؛ ساتھ احتیاط کی تعریف اور مشروع ورع پر علماء کے اقوال ذکر کیے۔"
