id: work/fatwa-islamqa-book-of-most-cautious-opinions
class: work
kind: fatwa
label: { ar: "هل يوجد كتاب يبين القول الأحوط في المسائل الخلافية؟", en: "Is there a book giving the most cautious view on disputed questions?", ur: "کیا کوئی کتاب اختلافی مسائل میں احتیاط والا قول بتاتی ہے؟", es: "¿Existe algún libro que ofrezca la visión más cautelosa sobre cuestiones controvertidas?", fr: "Existe-t-il un ouvrage présentant le point de vue le plus prudent sur les questions controversées ?", tr: "Tartışmalı konularda en temkinli görüşü netleştiren bir kitap var mı?", id: "Apakah ada buku yang memperjelas pendapat paling hati-hati tentang isu-isu yang diperdebatkan?" }
summary:
  ar: "سائل يطلب كتابًا فقهيًّا يذكر في كل مسألة خلافية الدليل والرأي الأحوط الذي يخرج به المرء من الخلاف، لا الراجح وحده. أجاب موقع الإسلام سؤال وجواب بأن العمل بالاحتياط ليس فاضلًا دائمًا ولا مطلوبًا دائمًا، وأنه لا يعلم كتابًا واحدًا يذكر الأحوط في كل مسائل الفقه، وعرض تعريف الاحتياط ونقولًا لأهل العلم في الورع المشروع."
  en: "A questioner asks for a fiqh book that gives, for every disputed question, the evidence and the most cautious view that takes one out of the disagreement, not only the preferred view. IslamQA answered that acting on caution is not always meritorious or always required, and that it knows of no single book that gives the most cautious view on every question of fiqh, setting out a definition of caution and quotations from scholars on legitimate scrupulousness."
  ur: "ایک سائل ایسی فقہی کتاب چاہتا ہے جو ہر اختلافی مسئلے میں دلیل اور وہ احتیاط والا قول بتائے جس سے آدمی اختلاف سے نکل جائے، نہ صرف راجح قول۔ اسلام سوال و جواب نے جواب دیا کہ احتیاط پر عمل ہمیشہ افضل یا ہمیشہ مطلوب نہیں، اور اسے کوئی ایک کتاب معلوم نہیں جو فقہ کے ہر مسئلے میں احتیاط والا قول بیان کرے؛ ساتھ احتیاط کی تعریف اور مشروع ورع پر علماء کے اقوال ذکر کیے۔"
  es: "Un usuario solicita un libro de fiqh que ofrezca, para cada cuestión controvertida, la evidencia y la opinión más prudente que permita resolver la disputa, y no solo la opinión preferida. IslamQA respondió que actuar con cautela no siempre es meritorio ni siempre necesario, y que no conoce ningún libro que ofrezca la opinión más prudente sobre cada cuestión de fiqh, presentando una definición de cautela y citas de eruditos sobre la escrupulosidad legítima."
  fr: "Un internaute demande un ouvrage de fiqh qui présente, pour chaque question litigieuse, les preuves et l'avis le plus prudent permettant de trancher le désaccord, et non seulement l'avis majoritaire. IslamQA répond qu'agir avec prudence n'est pas toujours méritoire ni toujours nécessaire, et qu'aucun ouvrage ne présente systématiquement l'avis le plus prudent sur chaque question de fiqh. La plateforme propose une définition de la prudence et cite des savants sur la rigueur légitime."
  tr: "Bir soru soran, sadece tercih edilen değil, anlaşmazlığı önlemeye yardımcı olabilecek en temkinli kanıt ve görüşleri içeren bir hukuk kitabı ister. İslam web sitesi, temkinli davranmanın ne her zaman erdemli ne de her zaman zorunlu olduğunu ve tüm fıkıh konularında en temkinli olanları anan, tedbirin tanımını sunan ve öğretilmiş dindarlık üzerine alıntı yapan tek bir kitabı bile bilmediğini belirterek cevap vermiştir."
  id: "Seorang penanya meminta buku yurisprudensi yang menyebutkan bukti dan opini paling hati-hati yang dapat membantu seseorang menghindari perselisihan, bukan hanya yang disukai. Situs Islam menjawab pertanyaan dan jawaban dengan menyatakan bahwa bertindak dengan hati-hati tidak selalu berbudi luhur maupun selalu diperlukan, dan tidak mengetahui satu pun buku yang menyebutkan yang paling berhati-hati dalam semua urusan yurisprudensi, serta menyajikan definisi kehati-hatian dan mengutip para ulama tentang kesalehan yang ditentukan."
