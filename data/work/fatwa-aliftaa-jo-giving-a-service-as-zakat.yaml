id: work/fatwa-aliftaa-jo-giving-a-service-as-zakat
class: work
kind: fatwa
label: { ar: "إخراج منفعة عن الزكاة", en: "Giving a service as zakat", ur: "زکوٰۃ میں کوئی خدمت دینا" }
summary:
  ar: "سؤال عن إخراج منفعة عن الزكاة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز إخراج المنفعة كالسكنى والتعليم والتطبيب زكاة، لأن الزكاة تخرج مالًا يملّك للفقير. أجابت الدائرة بأن الواجب إخراج الزكاة من عين المال المزكى، إلا زكاة عروض التجارة فتخرج بالقيمة، وأن تكون على وجه التمليك، واستشهدت بآية مصارف الزكاة في [[passage/quran-9-60|سورة التوبة 9:60]]، وقالت إن اللام فيها لام الملك. وقالت إنه لا يجوز إخراج المنفعة كالسكنى والتعليم والتطبيب زكاة عن المال، لأن زكاة المال يجب أن تخرج مالًا يملّك للفقير، وهذه الخدمات أمور معنوية غير قابلة للتمليك."
  en: "A question about giving a service as zakat, in which Jordan's General Iftaa Department answered that services such as housing, education and medical treatment may not be given as zakat, because zakat must be paid as wealth that the poor person comes to own. The Department answered that zakat must be paid from the asset on which it is due, except zakat on trade goods, which is paid by value, and that it must transfer ownership, citing the verse on the recipients of zakat in [[passage/quran-9-60|Surat al-Tawba 9:60]] and saying its preposition denotes ownership. It said that services such as housing, education and medical treatment may not be given as zakat on wealth, because zakat on wealth must be paid as wealth that the poor person comes to own, and these services are intangible and cannot be owned."
  ur: "زکوٰۃ میں کوئی خدمت دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ رہائش، تعلیم اور علاج جیسی خدمات زکوٰۃ میں نہیں دی جا سکتیں، کیونکہ زکوٰۃ ایسا مال ہونا چاہیے جس کا فقیر مالک بنے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ اسی مال سے ادا کرنا واجب ہے جس پر واجب ہوئی، سوائے تجارتی سامان کے جس کی زکوٰۃ قیمت سے ادا ہوتی ہے، اور یہ ملکیت منتقل کرنے کے طور پر ہو، اور زکوٰۃ کے مصارف والی آیت [[passage/quran-9-60|سورۃ التوبہ 9:60]] کا حوالہ دیا اور کہا کہ اس میں حرفِ لام ملکیت کے لیے ہے۔ اس نے کہا کہ رہائش، تعلیم اور علاج جیسی خدمات مال کی زکوٰۃ میں دینا جائز نہیں، کیونکہ مال کی زکوٰۃ ایسا مال ہونی چاہیے جس کا فقیر مالک بنے، اور یہ خدمات غیر مادی چیزیں ہیں جن کا مالک نہیں بنا جا سکتا۔"
