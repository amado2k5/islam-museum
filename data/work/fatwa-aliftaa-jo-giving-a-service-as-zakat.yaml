id: work/fatwa-aliftaa-jo-giving-a-service-as-zakat
class: work
kind: fatwa
label: { ar: "إخراج منفعة عن الزكاة", en: "Giving a service as zakat", ur: "زکوٰۃ میں کوئی خدمت دینا", es: "Prestar un servicio como zakat", fr: "Accomplir un service en guise de zakat", tr: "Zekattan fayda sağlamak", id: "Mengambil manfaat dari zakat" }
summary:
  ar: "سؤال عن إخراج منفعة عن الزكاة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز إخراج المنفعة كالسكنى والتعليم والتطبيب زكاة، لأن الزكاة تخرج مالًا يملّك للفقير. أجابت الدائرة بأن الواجب إخراج الزكاة من عين المال المزكى، إلا زكاة عروض التجارة فتخرج بالقيمة، وأن تكون على وجه التمليك، واستشهدت بآية مصارف الزكاة في [[passage/quran-9-60|سورة التوبة 9:60]]، وقالت إن اللام فيها لام الملك. وقالت إنه لا يجوز إخراج المنفعة كالسكنى والتعليم والتطبيب زكاة عن المال، لأن زكاة المال يجب أن تخرج مالًا يملّك للفقير، وهذه الخدمات أمور معنوية غير قابلة للتمليك."
  en: "A question about giving a service as zakat, in which Jordan's General Iftaa Department answered that services such as housing, education and medical treatment may not be given as zakat, because zakat must be paid as wealth that the poor person comes to own. The Department answered that zakat must be paid from the asset on which it is due, except zakat on trade goods, which is paid by value, and that it must transfer ownership, citing the verse on the recipients of zakat in [[passage/quran-9-60|Surat al-Tawba 9:60]] and saying its preposition denotes ownership. It said that services such as housing, education and medical treatment may not be given as zakat on wealth, because zakat on wealth must be paid as wealth that the poor person comes to own, and these services are intangible and cannot be owned."
  ur: "زکوٰۃ میں کوئی خدمت دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ رہائش، تعلیم اور علاج جیسی خدمات زکوٰۃ میں نہیں دی جا سکتیں، کیونکہ زکوٰۃ ایسا مال ہونا چاہیے جس کا فقیر مالک بنے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ اسی مال سے ادا کرنا واجب ہے جس پر واجب ہوئی، سوائے تجارتی سامان کے جس کی زکوٰۃ قیمت سے ادا ہوتی ہے، اور یہ ملکیت منتقل کرنے کے طور پر ہو، اور زکوٰۃ کے مصارف والی آیت [[passage/quran-9-60|سورۃ التوبہ 9:60]] کا حوالہ دیا اور کہا کہ اس میں حرفِ لام ملکیت کے لیے ہے۔ اس نے کہا کہ رہائش، تعلیم اور علاج جیسی خدمات مال کی زکوٰۃ میں دینا جائز نہیں، کیونکہ مال کی زکوٰۃ ایسا مال ہونی چاہیے جس کا فقیر مالک بنے، اور یہ خدمات غیر مادی چیزیں ہیں جن کا مالک نہیں بنا جا سکتا۔"
  es: "Una pregunta sobre la prestación de servicios como zakat, en la que el Departamento General de Iftaa de Jordania respondió que servicios como vivienda, educación y tratamiento médico no pueden ser considerados zakat, porque el zakat debe pagarse sobre la riqueza que el pobre adquiere. El Departamento respondió que el zakat debe pagarse sobre el bien sobre el cual se debe, excepto el zakat sobre bienes comerciales, que se paga por valor, y que debe transferir la propiedad, citando el versículo sobre los receptores del zakat en [[passage/quran-9-60|Surat al-Tawba 9:60]] y diciendo que su preposición denota propiedad. Dijo que servicios como vivienda, educación y tratamiento médico no pueden ser considerados zakat sobre la riqueza, porque el zakat sobre la riqueza debe pagarse sobre la riqueza que el pobre adquiere, y estos servicios son intangibles y no pueden ser poseídos."
  fr: "Une question relative à l'octroi de la zakat en tant que service a été posée a été soulevée par le Département général de la Iftaa en Jordanie. Ce dernier a précisé que des services tels que le logement, l'éducation et les soins médicaux ne peuvent être considérés comme de la zakat, car celle-ci doit être payée sur les biens acquis par le pauvre. Le Département a expliqué que la zakat doit être prélevée sur le bien auquel elle est due, à l'exception de la zakat sur les marchandises, qui est calculée en fonction de leur valeur. Il a également indiqué que le transfert de propriété est obligatoire, citant le verset 60 de la sourate At-Tawba (9:60) relatif aux bénéficiaires de la zakat et soulignant que le terme « zakat » y est associé. Le Département a conclu que des services comme le logement, l'éducation et les soins médicaux ne peuvent être considérés comme de la zakat sur les biens, car celle-ci doit être payée sur les biens acquis par le pauvre, et que ces services sont intangibles et ne peuvent faire l'objet d'une propriété."
  tr: "Zekattan bir fayda verilmesiyle ilgili bir soruya Ürdün Genel Fetva Dairesi, konut, eğitim veya sağlık hizmeti gibi bir yardımın zekat olarak verilmesinin caiz olmadığını, çünkü zekatın yoksulların sahip olmadığı parayı verdiğini yanıtladı. Daire, zekatın zekatın kendisi üzerindeki zekattan ödenmesi gerektiğini, ancak ticari mallar için zekatın değer bazında verildiğini ve mülkiyet şeklinde olması gerektiğini yanıtladı. [[pasaj/kuran-kuran-9-60|Tevbe Suresi 9:60]'daki zekat harcamalarıyla ilgili ayeti alıntıladı ve içindeki lamın sahibin yemi olduğunu söyledi. Konut, eğitim veya sağlık hizmeti gibi bir yardımın servete zekat olarak verilmesinin izin verilmediğini, çünkü servet üzerine zekatın yoksulların sahip olmadığı paraya verilmesi gerektiğini ve bu hizmetlerin devredilemez maddi varlıklar olduğunu söyledi."
  id: "Sebuah pertanyaan tentang pemberian manfaat dari zakat, yang dijawab oleh Departemen Fatwa Umum Yordania bahwa tidak diperbolehkan memberikan manfaat seperti perumahan, pendidikan, atau perawatan medis sebagai zakat, karena zakat memberikan uang yang tidak dimiliki oleh orang miskin. Departemen menjawab bahwa zakat harus dibayar dari zakat pada zakat itu sendiri, kecuali zakat atas barang komersial, yang diberikan berdasarkan nilai, dan harus dalam bentuk kepemilikan. Mereka mengutip ayat tentang pengeluaran zakat dalam [[ayat/al-Qur'an-9-60|Surah At-Tawbah 9:60], dan mengatakan bahwa lam di dalamnya adalah lam pemilik. Departemen tersebut menyatakan bahwa tidak diperbolehkan memberikan manfaat seperti perumahan, pendidikan, atau perawatan medis sebagai zakat atas kekayaan, karena zakat atas kekayaan harus diberikan kepada uang yang tidak dimiliki orang miskin, dan layanan ini adalah hal tidak berwujud yang tidak dapat dialihkan."
