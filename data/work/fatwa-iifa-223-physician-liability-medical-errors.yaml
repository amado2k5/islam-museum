id: work/fatwa-iifa-223-physician-liability-medical-errors
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 223 (23/7) بشأن مسؤولية الطبيب عن الأخطاء الطبية غير العمدية من منظور إسلامي", en: "IIFA draft resolution 223 (23/7) on the physician's liability for unintentional medical errors from an Islamic perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی مسودہ قرارداد 223 (23/7): اسلامی تناظر میں غیر ارادی طبی غلطیوں پر طبیب کی ذمہ داری" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩، بعد اطلاعه على قرارات المؤتمر العلمي للمنظمة الإسلامية للعلوم الطبية بالكويت ⁦(5–7 جمادى الآخرة 1436هـ، 26–28 مارس 2015م)⁩. اعتمد المجمع تعريف الخطأ الطبي بأنه الإخفاق في إتمام فعل مخطط له كما استُهدف بسبب إهمال أو تقصير ونحوهما، والحادث الطبي بأنه إصابة تنشأ عن تدخل طبي لا تعزى إلى الظروف الصحية الأساسية للمريض، والحوادث المؤسسية بما ينشأ من تزامن عوامل مسببة للخطأ في مستويات مختلفة مع مسببات داخلية في النظام الصحي، وأصول المهنة الصحية بالأصول الثابتة والقواعد المتعارف عليها علميًا وعمليًا. ومن قراراته: وضع برامج علمية لدراسة أسباب الأخطاء للإقلال منها؛ تهيئة الأجواء الداخلية والخارجية للرعاية الصحية؛ جعل سلامة المرضى المحور الرئيس للسياسات الصحية؛ عقد ورش تدريب وتوعية للعاملين؛ توفير الإمكانات والالتزام بالبروتوكولات العالمية للتشخيص؛ الالتزام بعدم تجاوز ساعات عمل الهيئة الطبية ثماني ساعات وبخاصة في المناوبات؛ إقلال عدد المرضى لكل طبيب؛ المراجعة الدورية للقوانين والقرارات المتعلقة بضمانات السلامة؛ الصيانة الدورية للأجهزة؛ إنشاء جهة عليا للأخطاء الطبية تتبع الوزير المختص تتولى التحقيق في الحوادث ورفع التوصيات؛ تشجيع الأطباء المخطئين على الإفصاح وحماية المبلغين عن الأخطاء؛ إنشاء بنك معلومات للأخطاء الطبية بلجنة من الأطباء والفقهاء والقانونيين وإلزام جهات وزارات الصحة بالإبلاغ؛ تقييم عضو الهيئة الطبية صاحب الأخطاء الجسيمة؛ تسجيل ومراقبة الأدوية ومتابعة تفاعلاتها؛ تغيير المفهوم المجتمعي لتقبل احتمال وقوع الأخطاء؛ وإدخال بطاقة باركود إلكترونية لكل إنسان في المعاملات الصحية."
  en: "A collective draft resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), after reviewing the resolutions of the scholarly conference of the Islamic Organisation for Medical Sciences in Kuwait (5–7 Jumada II 1436, 26–28 March 2015). It adopted the definitions: medical error as failure to complete a planned act as intended, through negligence, shortcoming or the like; medical incident as an injury arising from medical intervention not attributable to the patient's underlying health conditions; institutional incidents as those arising from the coincidence of error-causing factors at several levels together with causes inside the health system; and the principles of the health profession as the established bases and scientifically and practically recognised rules. Its decisions include: developing scholarly programmes on the causes of errors to reduce them; preparing suitable internal and external conditions for health care; making patient safety the central axis of all health policies; training and awareness workshops for health workers; providing equipment, laboratories and information and adhering to international work protocols for accurate diagnosis; limiting the medical staff's working day to eight hours, especially on night shifts, to preserve the physician's focus; reducing the number of patients per physician; periodically reviewing all laws and decisions on safety guarantees; periodic maintenance of medical devices by experts; establishing a supreme body for medical errors under the competent minister to investigate incidents promptly before their traces vanish and report with recommendations; encouraging erring physicians to disclose errors and finding a legal means of leniency; protecting those who report errors; creating a medical-error information bank run by a committee of physicians, jurists and lawyers with mandatory reporting by health-ministry bodies; assessing a staff member responsible for grave errors; registering and monitoring medicines, especially dangerous ones, for side effects and interactions; public awareness to change society's view of fallibility in medical practice; and introducing an electronic barcode card for every person for use in all health transactions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی مسودہ قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں، کویت میں اسلامی تنظیم برائے طبی علوم کے علمی کانفرنس ⁦(5–7 جمادی الثانی 1436ھ، 26–28 مارچ 2015ء)⁩ کی قراردادوں کے جائزے کے بعد۔ اس نے تعریفیں منظور کیں: طبی غلطی وہ ہے جو منصوبہ بند عمل کو ارادے کے مطابق مکمل نہ کرنے میں ناکامی ہو، غفلت یا تقصیر کی وجہ سے؛ طبی واقعہ وہ چوٹ ہے جو طبی مداخلت سے پیدا ہو اور مریض کی بنیادی صحت کے حالات سے منسوب نہ ہو؛ ادارہ جاتی واقعات وہ ہیں جو مختلف سطحوں پر غلطی کے کئی اسباب اور نظامِ صحت کے داخلی اسباب کے بیک وقت ملنے سے پیدا ہوں؛ اور پیشۂ صحت کے اصول وہ مستقر بنیادیں اور علمی و عملی طور پر تسلیم شدہ قواعد ہیں۔ فیصلوں میں شامل ہیں: غلطیوں کے اسباب پر تحقیقاتی پروگرام بنا کر ان میں کمی؛ صحت کی دیکھ بھال کے لیے مناسب داخلی و خارجی ماحول؛ ہر صحت پالیسی میں مریض کی حفاظت کو مرکز بنانا؛ صحت کے کارکنوں کے لیے تربیتی و آگہی ورکشاپس؛ درست تشخیص کے لیے سازوسامان، لیبارٹریاں اور عالمی پروٹوکول کی پابندی؛ طبی عملے کے اوقات کار دن میں آٹھ گھنٹے سے زائد نہ رکھنا بالخصوص شب کی ڈیوٹی پر؛ ہر طبیب کے مریضوں کی تعداد میں کمی؛ حفاظتی ضمانتوں کے قوانین و فیصلوں کا دوری جائزہ؛ آلات کی ماہرانہ دوری دیکھ بھال؛ طبی غلطیوں کے لیے مختص وزیر سے منسلک اعلیٰ ادارہ جو فوری تحقیقات اور سفارشات پیش کرے؛ غلطی کرنے والے طبیبوں کو کھل کر بتانے کی ترغیب اور قانونی نرمی کا راستہ، اور خبر دینے والوں کے تحفظ کا انتظام؛ طبیبوں، فقہاء اور وکلاء کی کمیٹی کے تحت طبی غلطیوں کا معلوماتی بینک اور وزارتِ صحت کے اداروں پر اطلاع کی الزامیت؛ سنگین غلطیوں والے ملازم کی تشخیص؛ ادویات کی رجسٹریشن، نگرانی اور خطرناک ادویات کے سائڈ ایفیکٹس اور تعاملات کی پیروی؛ طبی عمل میں غلطی کے امکان کے بارے میں سماجی فکر کی تبدیلی کی آگہی؛ اور ہر فرد کے لیے صحت کے معاملات میں برقی بارکوڈ کارڈ کا اجراء۔"
