id: work/fatwa-binbaz-words-after-rising-from-ruku
class: work
kind: fatwa
label: { ar: "ما يقال بعد الرفع من الركوع", en: "What is said on rising from bowing", ur: "رکوع سے اٹھنے کے بعد کیا کہا جائے" }
summary:
  ar: "سؤال عن الأفضل في الذكر بعد الرفع من الركوع. أجاب ابن باز بأن الصيغ الأربع كلها واردة: «ربنا لك الحمد»، و«ربنا ولك الحمد»، و«اللهم ربنا لك الحمد»، و«اللهم ربنا ولك الحمد»، وأن من نوّع بينها فحسن، والأمر واسع للإمام والمنفرد."
  en: "A question on which wording is best after rising from bowing. Ibn Baz answered that all four wordings are reported: \"Rabbana laka l-hamd\", \"Rabbana wa-laka l-hamd\", \"Allahumma rabbana laka l-hamd\" and \"Allahumma rabbana wa-laka l-hamd\"; alternating between them is good, and there is latitude here for the imam and the one praying alone."
  ur: "رکوع سے اٹھنے کے بعد افضل ذکر کے بارے میں سوال۔ ابن باز نے جواب دیا کہ چاروں الفاظ منقول ہیں: «ربنا لک الحمد»، «ربنا ولک الحمد»، «اللہم ربنا لک الحمد» اور «اللہم ربنا ولک الحمد»؛ ان میں باری باری پڑھنا اچھا ہے، اور امام اور اکیلے نمازی دونوں کے لیے اس میں گنجائش ہے۔"
