label: { ar: "أبيات سعيد بن العاص إلى ابنه عمرو", en: "Verses of Said ibn al-As to his son Amr", es: "Versículos de Said ibn al-As a su hijo Amr", fr: "Versets de Saïd ibn al-As à son fils Amr", ur: "سعید بن العاص کی آیات ان کے بیٹے عمرو کے لیے", tr: "Said ibn al-As'ın oğlu Amr'e şiirleri", id: "Bait-bait Saeed ibn al-As kepada putranya Amr" }
summary:
  ar: "بيتان نسبهما ابن إسحاق إلى سعيد بن العاص أبي أحيحة يخاطب بهما ابنه عمرو بن سعيد، وفيهما سؤال عن حال ابنه إذا اشتد عوده. لا ينقل المتحف نص الأبيات."
  en: Two verses Ibn Ishaq attributes to Sa'id ibn al-As Abu Uhayha addressing his son Amr ibn Sa'id, asking how his son will fare when his strength matures. The museum does not reproduce the verses.
  es: "Ibn Ishaq atribuye dos versículos a Sa'id ibn al-As Abu Uhayha, dirigidos a su hijo Amr ibn Sa'id, preguntándole cómo le irá a su hijo cuando alcance la madurez. El museo no reproduce estos versículos."
  fr: "Ibn Ishaq attribue deux versets à Sa'id ibn al-As Abu Uhayha, adressés à son fils Amr ibn Sa'id, dans lesquels il s'enquiert de son avenir une fois sa force physique acquise. Le musée ne reproduit pas ces versets."
  ur: "دو آیات ابن اسحاق نے سعید بن العاص کی طرف منسوب کی ہیں ابو احیحہ نے اپنے بیٹے عمرو بن سعید کو مخاطب کرتے ہوئے پوچھا کہ جب اس کی طاقت پختہ ہو جائے گی تو اس کا بیٹا کیسا رہے گا۔ میوزیم آیات کو دوبارہ پیش نہیں کرتا ہے۔"
  tr: "İbn İshak'ın Sa'id ibn al-As'a atfettiği ve oğlu Amr ibn Sa'id'e hitaben yazdığı iki ayet, oğlunun tiksinti artarsa durumu hakkında bir soru yer almaktadır. Müze, bu ayetlerin metnini aktarmamaktadır."
  id: "Dua bait yang dikaitkan oleh Ibn Ishaq kepada Sa'id ibn al-As Abu Ahihah, ditujukan kepada putranya Amr ibn Sa'id, dan di dalamnya terdapat pertanyaan tentang kondisi putranya jika rasa jijiknya semakin kuat. Museum tidak mengirimkan teks ayat-ayat tersebut."
