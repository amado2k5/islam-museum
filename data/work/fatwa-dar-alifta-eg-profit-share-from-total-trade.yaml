label: { ar: "حكم حساب الربح في المضاربة من إجمالي التجارة", en: "Calculating mudaraba profit from total trade", ur: "مضاربے میں مجموعی تجارت سے منافع کا حساب", es: "Cálculo de la ganancia mudaraba del comercio total", fr: "Calcul du profit mudaraba à partir du commerce total", tr: "Toplam ticaretten spekülasyonda kâr hesaplamasına ilişkin karar", id: "Putusan tentang perhitungan keuntungan spekulasi dari total perdagangan" }
summary:
  ar: "سائل سأل عن معاملة تمت بين طرفين على حساب ربح أحدهما من إجمالي التجارة في صورة مضاربة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21505)⁩ أن المعاملة المذكورة معاملة صحيحة من حيث الأصل ولا يقدح فيها تخصيص أحد الطرفين بنسبة على ما فصّل الجواب."
  en: "A questioner asked about an arrangement between two parties in which one takes his profit share out of total trade by way of mudaraba. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21505) answered that the described arrangement is valid in principle and the allocation to one party of a share does not vitiate it — as the answer details."
  ur: "ایک سائل نے ایسے معاملے کا حکم پوچھا جس میں ایک فریق مضاربے کے طور پر مجموعی تجارت سے اپنا حصہ لیتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21505)⁩ نے جواب دیا کہ یہ معاملہ اصل میں صحیح ہے اور حصہ مختص کرنا اسے خراب نہیں کرتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un acuerdo entre dos partes en el que una de ellas recibe su parte de las ganancias del total de la transacción mediante el sistema de mudaraba. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21505) respondió que el acuerdo descrito es válido en principio y que la asignación de una parte a una de las partes no lo invalida, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un accord entre deux parties dans lequel l'une d'elles perçoit sa part des bénéfices d'une transaction totale par le biais d'une mudaraba. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21505) a répondu que cet accord est valide en principe et que l'attribution d'une part à l'une des parties ne le rend pas invalide, comme le précise la réponse."
  tr: "Bir soru soran, iki taraf arasında, bir tarafın toplam ticaretten birinin spekülasyon yoluyla zararına gerçekleşen bir işlemi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21505), söz konusu işlemin prensip olarak geçerli olduğunu ve yanıtta detaylandırıldığı gibi, taraflardan hiçbirinin orantılı tahsisatını zayıflatmadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang transaksi yang terjadi antara dua pihak dengan mengorbankan salah satu dari mereka dari total perdagangan dalam bentuk spekulasi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21505) menjawab bahwa transaksi tersebut sah secara prinsip dan tidak merusak alokasi salah satu pihak secara proporsional, seperti yang dijelaskan dalam jawaban."
