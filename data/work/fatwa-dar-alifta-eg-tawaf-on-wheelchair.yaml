id: work/fatwa-dar-alifta-eg-tawaf-on-wheelchair
class: work
kind: fatwa
label: { ar: "حكم الطواف على الكرسي المتحرك", en: "Tawaf in a wheelchair", ur: "وہیل چیئر پر طواف", es: "Tawaf en silla de ruedas" }
summary:
  ar: "سائل سأل عن الطواف على الكرسي المتحرك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20674)⁩ أنه لا مانع شرعًا من الطواف على الكرسي المتحرك إن كان لعذر باتفاق الفقهاء ويكون مجزئًا حينئذ وإن كان لغير عذر فحكمه على ما فصّل الجواب."
  en: "A questioner asked about tawaf in a wheelchair. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20674) answered that there is no objection by the jurists' agreement when for an excuse, and it then suffices; without excuse its ruling is as the answer details."
  ur: "ایک سائل نے وہیل چیئر پر طواف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20674)⁩ نے جواب دیا کہ عذر ہو تو فقہاء کے اتفاق سے جائز اور کافی ہے؛ بغیر عذر کا حکم جواب میں ہے۔"
  es: "Un consultante preguntó sobre el tawaf en silla de ruedas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20674) respondió que no hay objeción por acuerdo de los juristas cuando existe una excusa, y que esta es suficiente; sin excusa, su dictamen es el que se detalla en la respuesta."
