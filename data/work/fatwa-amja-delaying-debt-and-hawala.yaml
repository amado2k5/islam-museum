label: { ar: "مماطلة الغني بالدين والحوالة", en: "The solvent debtor's delay and the hadith on transfer", ur: "مالدار مقروض کی ٹال مٹول اور حوالہ", es: "La demora del deudor solvente y el hadiz sobre la transferencia", fr: "Le retard du débiteur solvable et le hadith sur le transfert", tr: "Zenginlerin borç ve para transferlerinde ertelemesi", id: "Penundaan orang kaya dalam utang dan kiriman uang" }
summary:
  ar: "سأل سائل عن تفسير حديث أبي هريرة في مماطلة الموسر وقوله وإذا أُتبع أحدكم على مليء فليتبع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77688 بتاريخ 4 فبراير 2009)⁩ أن معنى الحديث أن مماطلة المدين الواجب عليه الدين القادر على الوفاء ظلم لا يحل، وكثير من الناس خاصة التجار يماطلون في بذل الحقوق الواجبة لأنهم يضنون بما لديهم من نقود سائلة ويعز عليهم بذلها لأصحابها وهذا ظلم بين يسخطه الله ورسوله، وأما معنى وإذا اتبع أحدكم على مليء فليتبع وقد ورد بلفظ ومن أحيل على مليء فليتبع فمقصوده أن الدائن إذا أحاله مدينه إلى آخر ليبذل له حقه فعليه قبول الحوالة، وأكثر أهل العلم على أن الأمر للاستحباب وعن أحمد الوجوب."
  en: "A questioner asked for the explanation of Abu Hurayra's hadith on the solvent man's delaying and 'if one of you is referred to a solvent man, let him follow'. Dr. Salah al-Sawi (fatwa no. 77688, 4 February 2009) answered that the solvent debtor's stalling on what he owes while able to pay is an injustice not lawful — many, merchants especially, stall on dues begrudging their liquid cash, a clear wrong angering God and His messenger; and 'when one is referred to a solvent man, let him follow' — narrated also as 'whoever is transferred to a solvent man, let him accept' — means the creditor whom his debtor refers to another to pay his due should accept the transfer; most scholars take it as recommended, Ahmad as obligatory."
  ur: "ایک سائل نے مالی دار مقروض کی ٹال مٹول اور حوالے کی حدیث کی شرح پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77688، 4 فروری 2009)⁩ کے مطابق استطاعت کے باوجود ادائیگی ٹالنا ظلم ہے؛ حوالہ قبول کرنا اکثر کے نزدیک مستحب اور احمد کے نزدیک واجب ہے۔"
  es: "Un consultante solicitó la explicación del hadiz de Abu Hurayra sobre la demora del hombre solvente y «si a uno de vosotros se le remite a un hombre solvente, que lo siga». El Dr. Salah al-Sawi (fatwa n.º 77688, 4 de febrero de 2009) respondió que la demora del deudor solvente en el pago de lo que debe, cuando puede pagarlo, es una injusticia ilícita; muchos, especialmente los comerciantes, retrasan el pago de sus deudas, renuentemente a su dinero en efectivo, una clara falta que enfurece a Dios y a Su mensajero; y «cuando a uno se le remite a un hombre solvente, que lo siga» —también narrado como «quien sea transferido a un hombre solvente, que acepte»— significa que el acreedor a quien su deudor remite a otro para pagar su deuda debe aceptar la transferencia; la mayoría de los eruditos lo consideran recomendable, Ahmad lo considera obligatorio."
  fr: "Un internaute a demandé l'explication du hadith d'Abu Hurayra concernant le retard de paiement de l'homme solvable et le passage suivant: « Si l'un d'entre vous est orienté vers un homme solvable, qu'il le suive. » Le Dr Salah al-Sawi (fatwa n° 77688, 4 février 2009) a répondu que le fait pour un débiteur solvable de tarder à payer sa dette alors qu'il en a les moyens constitue une injustice illicite. Nombreux sont ceux, notamment les commerçants, qui tardent à payer leurs dettes par jalousie, ce qui est un tort manifeste et irrite Dieu et Son Messager. Quant au passage « Si l'on est orienté vers un homme solvable, qu'il le suive » – également rapporté comme « Quiconque est transféré à un homme solvable, qu'il accepte » –, il signifie que le créancier auquel son débiteur renvoie un tiers pour le paiement de sa dette doit accepter ce transfert. La plupart des savants le considèrent comme une recommandation, Ahmad comme une obligation."
  tr: "Bir soruya Ebu Hureyre'nin zenginlerin ertelemesiyle ilgili hadislerinin yorumu ve 'Birisi tam borca takiliyorsa, takip etsin.' sözü soruldu. Dr. Salah Al-Sawy (4 Şubat 2009 tarihli 77688 sayılı fetva) hadisin anlamının, borcu ödemekle yükümlü olan borçlunun ertelemesinin kabul edilemez bir haksızlık olduğu anlamına geldiğini yanıtladı. Birçok kişi, özellikle tüccarlar, sahip oldukları likit paranın ağırlığı nedeniyle haklarını ertelemekte ertelemektedir. Bu, Allah'ı ve Elçisini kızdıran açık bir haksızlıktır. 'Biriniz tam bir borca takılıyorsa, devam etsin' anlamına gelince,, denildiği gibi, ve tam olarak çağrılan kişi takip etmelidir. Anlamı şudur ki, alacaklı borçlusunu başka birine devrederse ve hakkını verirse, devri kabul etmek zorundadır. Çoğu âlim konunun tavsiye edildiği konusunda hemfikirdir ve Ahmad bunu zorunlu kılar."
  id: "Seorang penanya ditanya tentang penafsiran hadis Abu Huraira mengenai penundaan orang kaya dan perkataannya, 'Jika salah satu dari kalian memiliki utang penuh, biarlah dia mengikuti.' Dr. Salah Al-Sawy menjawab (Fatwa No. 77688 tanggal 4 Februari 2009) bahwa makna hadis adalah bahwa penundaan debitur yang wajib membayar utang adalah ketidakadilan yang tidak boleh diizinkan. Banyak orang, terutama pedagang, menunda pemberian hak yang seharusnya karena mereka kewalahan oleh uang cair yang mereka miliki dan terlalu berat untuk diberikan kepada pemiliknya. Ini adalah ketidakadilan yang jelas yang membuat Allah dan Rasul-Nya marah. Adapun makna 'jika salah satu dari kalian memenuhi hutang penuh, biarlah dia terus,' seperti yang dikatakan, dan siapa pun yang dirujuk sebagai penuh harus mengikuti. Artinya adalah jika kreditur memindahkan debitur kepada orang lain untuk memberinya hak, maka ia harus menerima pemindahan tersebut. Sebagian besar ulama setuju bahwa hal itu direkomendasikan, dan Ahmad menganggapnya sebagai kewajiban."
