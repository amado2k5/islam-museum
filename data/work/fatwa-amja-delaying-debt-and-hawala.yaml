id: work/fatwa-amja-delaying-debt-and-hawala
class: work
kind: fatwa
label: { ar: "مماطلة الغني بالدين والحوالة", en: "The solvent debtor's delay and the hadith on transfer", ur: "مالدار مقروض کی ٹال مٹول اور حوالہ", es: "La demora del deudor solvente y el hadiz sobre la transferencia" }
summary:
  ar: "سأل سائل عن تفسير حديث أبي هريرة في مماطلة الموسر وقوله وإذا أُتبع أحدكم على مليء فليتبع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77688 بتاريخ 4 فبراير 2009)⁩ أن معنى الحديث أن مماطلة المدين الواجب عليه الدين القادر على الوفاء ظلم لا يحل، وكثير من الناس خاصة التجار يماطلون في بذل الحقوق الواجبة لأنهم يضنون بما لديهم من نقود سائلة ويعز عليهم بذلها لأصحابها وهذا ظلم بين يسخطه الله ورسوله، وأما معنى وإذا اتبع أحدكم على مليء فليتبع وقد ورد بلفظ ومن أحيل على مليء فليتبع فمقصوده أن الدائن إذا أحاله مدينه إلى آخر ليبذل له حقه فعليه قبول الحوالة، وأكثر أهل العلم على أن الأمر للاستحباب وعن أحمد الوجوب."
  en: "A questioner asked for the explanation of Abu Hurayra's hadith on the solvent man's delaying and 'if one of you is referred to a solvent man, let him follow'. Dr. Salah al-Sawi (fatwa no. 77688, 4 February 2009) answered that the solvent debtor's stalling on what he owes while able to pay is an injustice not lawful — many, merchants especially, stall on dues begrudging their liquid cash, a clear wrong angering God and His messenger; and 'when one is referred to a solvent man, let him follow' — narrated also as 'whoever is transferred to a solvent man, let him accept' — means the creditor whom his debtor refers to another to pay his due should accept the transfer; most scholars take it as recommended, Ahmad as obligatory."
  ur: "ایک سائل نے مالی دار مقروض کی ٹال مٹول اور حوالے کی حدیث کی شرح پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77688، 4 فروری 2009)⁩ کے مطابق استطاعت کے باوجود ادائیگی ٹالنا ظلم ہے؛ حوالہ قبول کرنا اکثر کے نزدیک مستحب اور احمد کے نزدیک واجب ہے۔"
  es: "Un consultante solicitó la explicación del hadiz de Abu Hurayra sobre la demora del hombre solvente y «si a uno de vosotros se le remite a un hombre solvente, que lo siga». El Dr. Salah al-Sawi (fatwa n.º 77688, 4 de febrero de 2009) respondió que la demora del deudor solvente en el pago de lo que debe, cuando puede pagarlo, es una injusticia ilícita; muchos, especialmente los comerciantes, retrasan el pago de sus deudas, renuentemente a su dinero en efectivo, una clara falta que enfurece a Dios y a Su mensajero; y «cuando a uno se le remite a un hombre solvente, que lo siga» —también narrado como «quien sea transferido a un hombre solvente, que acepte»— significa que el acreedor a quien su deudor remite a otro para pagar su deuda debe aceptar la transferencia; la mayoría de los eruditos lo consideran recomendable, Ahmad lo considera obligatorio."
