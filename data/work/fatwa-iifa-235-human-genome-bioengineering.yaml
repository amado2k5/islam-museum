label: { ar: "قرار مجمع الفقه الإسلامي الدولي 235 (24/6) بشأن الجينوم البشري والهندسة الحيوية المستقبلية ⁦(استعراض قرارات المجمع وبيان مردودها الفاعل والمستجدات والتحديات)⁩", en: "IIFA resolution 235 (24/6) on the human genome and future bioengineering ⁦(reviewing the Academy's resolutions, their effective yield and new developments and challenges)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 235 (24/6): انسانی جینوم اور مستقبل کی حیاتیاتی ہندسیات ⁦(اکیڈمی کی قراردادوں کا جائزہ، ان کا مؤثر فائدہ اور نئی پیش رفت و چیلنجز)⁩", es: "Resolución 235 (24/6) de la IIFA sobre el genoma humano y la bioingeniería futura (revisión de las resoluciones de la Academia, su efectividad y los nuevos desarrollos y desafíos).", fr: "Résolution 235 (24/6) de l'IIFA sur le génome humain et le futur génie biologique (examen des résolutions de l'Académie, de leur rendement effectif et des nouveaux développements et défis)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 235 (24/6) İnsan Genomu ve Geleceğin Biyomühendisliği ile ilgili (Akademi kararlarının ve bunların etkin etkisinin, güncellemelerinin ve zorluklarının gözden geçirilmesi)", id: "Resolusi International Islamic Fiqh Academy 235 (24/6) mengenai Genom Manusia dan Bioengineering Masa Depan (Tinjauan keputusan Akademi dan dampak efektif, pembaruan, serta tantangannya)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩. أكد المجمع قراره 203 ⁦(21/9)⁩ في الوراثة والهندسة الوراثية والجينوم البشري الصادر في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. وعرّف تقنيات التحرير الجيني مثل كريسبر كاس9 بأنها تقنيات حديثة للتعديل الجيني وتحرير الجينات بوظيفة الاستبدال أو التصحيح تعيد كتابة الحمض النووي، وهي أدق وأسهل من تقنيات العلاج الوراثي السابقة وتستهدف علاج أمراض مستعصية وما تزال بحاجة لمزيد بحث للتأكد من سلامتها وفعاليتها؛ وقرر أن التحرير الجيني بها مباح إذا تحققت ثلاثة شروط: مصادقة المرجعيات الطبية ذات العلاقة على سلامتها وفعاليتها، واستخدامها لأغراض طبية في الوقاية من الأمراض الوراثية وعلاجها مع المنع المطلق لاستخدامها في الأمور التجميلية التحسينية، ووجود إجراءات تنظيمية صارمة تحترم المشمولين بالمعالجة وتمنع إساءة الاستخدام. وقرر أن تقنية نقل الميتوكوندريا ⁦(المتقدرات)⁩ من بويضة امرأة سليمة الحمض النووي إلى امرأة تعاني عطب الحمض النووي للميتوكوندريا لإنجاب طفل سليم لا تجوز شرعًا لاختلاط الأنساب."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019). It reaffirmed its resolution 203 (21/9) on heredity, genetic engineering and the human genome, adopted at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). It described gene-editing techniques such as CRISPR-Cas9 as modern techniques of genetic modification that rewrite DNA by replacement or correction — more precise and easier than earlier gene-therapy techniques, aimed at treating intractable diseases but still needing further research to confirm safety and efficacy — and ruled that gene editing by them is permissible under three conditions: endorsement of their safety and efficacy by the competent medical authorities; use for medical purposes in preventing and treating genetic diseases, with any use for cosmetic (enhancement) purposes absolutely prohibited; and strict regulatory procedures ensuring respect for the persons treated and preventing misuse. It ruled that mitochondrial transfer — moving the cell's energy generator, with its DNA, from the ovum of a healthy woman to a woman with defective mitochondrial DNA to bear a healthy child — is impermissible in the sharia because of the mixing of lineages."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں۔ اکیڈمی نے ریاض میں اپنی اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ کی قرارداد 203 ⁦(21/9)⁩ ⁦(وراثت، جینیاتی ہندسیات اور انسانی جینوم)⁩ کی تائید کی۔ اس نے کرسپر-کیس9 جیسی جین ایڈیٹنگ تکنیکوں کی تعریف جینیاتی ترمیم کی جدید تکنیکوں کے طور پر کی جو تبدیلی یا اصلاح کے ذریعے ڈی این اے کو دوبارہ لکھتی ہیں — پہلے کے جین تھراپی طریقوں سے زیادہ درست اور آسان، عدیم العلاج بیماریوں کے علاج کے لیے مگر سلامتی و تاثیر کی تصدیق کے لیے مزید تحقیق کی متقاضی — اور فیصلہ دیا کہ ان سے جین ایڈیٹنگ تین شرائط پر جائز ہے: متعلقہ طبی مراجع سلامتی و تاثیر کی تصدیق کریں؛ استعمال صرف طبی مقاصد یعنی وراثی بیماریوں کی روک و علاج کے لیے ہو اور حسن ⁦(بہتری)⁩ کے مقاصد میں قطعی طور پر ممنوع ہو؛ اور سخت نظامی ضوابط معالجہ شدہ افراد کے احترام اور غلط استعمال کی روک کا ضامن ہوں۔ اس نے فیصلہ دیا کہ مائٹو کانڈریا منتقلی — صحتمند عورت کے انڈے سے طاقت ساز حیثیت کے ساتھ ڈی این اے کو خراب مائٹو کانڈریل ڈی این اے والی عورت میں منتقل کر کے صحتمند بچے کی پیدائش — نسبوں کے اختلاط کی وجہ سے شریعت میں جائز نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019). Reafirmó su resolución 203 (21/9) sobre herencia, ingeniería genética y genoma humano, adoptada en su 21.ª sesión en Riad (15-19 Muharram 1435, 18-22 de noviembre de 2013). Describió las técnicas de edición genética como CRISPR-Cas9 como técnicas modernas de modificación genética que reescriben el ADN mediante reemplazo o corrección —más precisas y fáciles que las técnicas de terapia génica anteriores, destinadas a tratar enfermedades intratables pero que aún necesitan más investigación para confirmar su seguridad y eficacia— y dictaminó que la edición genética mediante estas técnicas es permisible bajo tres condiciones: el respaldo de su seguridad y eficacia por parte de las autoridades médicas competentes; su uso con fines médicos para la prevención y el tratamiento de enfermedades genéticas, quedando absolutamente prohibido cualquier uso con fines cosméticos (de mejora); y procedimientos regulatorios estrictos que garanticen el respeto a las personas tratadas y prevengan el mal uso. El tribunal dictaminó que la transferencia mitocondrial —el traslado del generador de energía de la célula, junto con su ADN, del óvulo de una mujer sana a una mujer con ADN mitocondrial defectuoso para que dé a luz a un niño sano— es inadmisible en la sharia debido a la mezcla de linajes."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019). Elle a réaffirmé sa résolution 203 (21/9) sur l'hérédité, le génie génétique et le génome humain, adoptée lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013). Elle a décrit les techniques d'édition génique telles que CRISPR-Cas9 comme des techniques modernes de modification génétique qui réécrivent l'ADN par remplacement ou correction – plus précises et plus simples que les techniques de thérapie génique antérieures, visant à traiter des maladies incurables mais nécessitant encore des recherches supplémentaires pour confirmer leur innocuité et leur efficacité – et a statué que l'édition génique par ces techniques est permise sous trois conditions: l'approbation de leur innocuité et de leur efficacité par les autorités médicales compétentes; leur utilisation à des fins médicales pour la prévention et le traitement des maladies génétiques, toute utilisation à des fins cosmétiques (amélioration) étant absolument interdite; et des procédures réglementaires strictes garantissant le respect des personnes traitées et prévenant tout abus. Elle a statué que le transfert mitochondrial — le déplacement du générateur d'énergie de la cellule, avec son ADN, de l'ovule d'une femme en bonne santé à une femme dont l'ADN mitochondrial est défectueux afin de donner naissance à un enfant en bonne santé — est interdit par la charia en raison du mélange des lignées."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki 24. oturumunda (7–9 Rabi'al-Awwal 1441 H, 4–6 Kasım 2019) toplu kararı. Akademi, Riyad'da (15–19 Muharrem 1435 H, 18–22 Kasım 2013) tarihlerinde yayımlanan Genetik, Genetik Mühendisliği ve İnsan Genomu konulu 203 (21/9) sayılı Kararını onaylamıştır. CRISPR Cas9 gibi gen düzenleme tekniklerini modern genetik modifikasyon ve DNA'yı yeniden yazan ikame veya düzeltme yoluyla gen düzenleme olarak tanımladı. Bu teknikler, önceki gen terapisi tekniklerinden daha hassas ve kolaydır, tedavi edilemez hastalıkları hedefler ve güvenlik ile etkinlik için hâlâ daha fazla araştırma gerektirir; gen düzenlemenin üç koşul sağlandığı takdirde izin verildiğine karar verildi: ilgili tıbbi otoritelerin güvenlik ve etkinlik onayı; genetik hastalıkların önlenmesi ve tedavisinde tıbbi amaçlarla kullanımı ve kozmetik geliştirmelerde kullanımının mutlak yasaklanması; ve tedavi edilenlere saygı gösteren ve kötüye kullanımı önleyen sıkı düzenleyici prosedürlerin varlığı. Sağlıklı bir kadının yumurtasından kusurlu mitokondriyal DNA'ya sahip kadına mitokondriyal transfer tekniğinin, aile karışımı nedeniyle izin verilmediğine karar verildi."
  id: "Resolusi kolektif Akademi Fiqh Islam Internasional dalam sesi ke-24 di Dubai (7–9 Rabi' al-Awwal 1441 AH, 4–6 November 2019). Akademi menegaskan Resolusi 203 (21/9) tentang Genetika, Rekayasa Genetika, dan Genom Manusia, yang dikeluarkan pada sesi kedua puluh satu di Riyadh (15–19 Muharram 1435 AH, 18–22 November 2013). Ia mendefinisikan teknik pengeditan gen seperti CRISPR Cas9 sebagai modifikasi genetik modern dan pengeditan gen melalui substitusi atau koreksi yang menulis ulang DNA. Teknik-teknik ini lebih presisi dan mudah dibandingkan teknik terapi gen sebelumnya, menargetkan penyakit yang sulit diatasi, dan masih memerlukan penelitian lebih lanjut untuk memastikan keamanan dan efektivitasnya; diputuskan bahwa pengeditan gen diizinkan jika tiga syarat terpenuhi: persetujuan oleh otoritas medis terkait untuk keamanan dan efektivitasnya; penggunaannya untuk tujuan medis dalam pencegahan dan pengobatan penyakit genetik dengan larangan mutlak penggunaannya dalam peningkatan kosmetik; dan keberadaan prosedur regulasi ketat yang menghormati yang diobati dan mencegah penyalahgunaan. Diputuskan bahwa teknik transfer mitokondria dari sel telur wanita sehat ke wanita dengan DNA mitokondria cacat untuk melahirkan anak sehat tidak diperbolehkan karena pencampuran keluarga."
