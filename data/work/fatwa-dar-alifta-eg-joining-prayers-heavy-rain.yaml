label: { ar: "كيفية الأذان والإقامة حال الجمع بين الصلاتين بسبب المطر الشديد", en: "Adhan and iqama when joining prayers for heavy rain", ur: "تیز بارش پر نمازوں کے جمع میں اذان و اقامت کا طریقہ", es: "Adhan e iqama al unirse a las oraciones por lluvias intensas", fr: "Adhan et iqama lors de la prière collective pour les fortes pluies", tr: "Yoğun yağmur nedeniyle iki namaz birleştirildiğinde ezan ve ikama nasıl çağrılır", id: "Cara memanggil adhan dan Iqamah saat menggabungkan dua salat karena hujan deras" }
summary:
  ar: "سائل سأل عن كيفية الأذان والإقامة عند الجمع بين الصلاتين بسبب المطر الشديد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22313)⁩ أنه يجوز الجمع بين الصلاتين حال نزول المطر الشديد تقديمًا أو تأخيرًا على حسب الأرفق والأيسر، وبيّن الجواب كيفية الأذان والإقامة في ذلك."
  en: "A questioner asked about the adhan and iqama when two prayers are joined because of heavy rain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22313) answered that joining is permitted during heavy rainfall, forward or back, whichever is easier on the worshipper; the answer sets out how the calls to prayer are made in that case."
  ur: "ایک سائل نے تیز بارش کی وجہ سے دو نمازیں جمع کرنے پر اذان اور اقامت کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22313)⁩ نے جواب دیا کہ تیز بارش میں دونوں نمازیں پہلی یا دوسری وقت میں جمع کی جا سکتی ہیں جو بھی آسان ہو؛ جواب میں اذان و اقامت کا طریقہ بیان ہوا۔"
  es: "Un consultante preguntó acerca del adhan y el iqama cuando se unen dos oraciones debido a las fuertes lluvias. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22313) respondió que se permite unir las oraciones durante las fuertes lluvias, ya sea hacia adelante o hacia atrás, según lo que resulte más fácil para el fiel; la respuesta detalla cómo se realizan las llamadas a la oración en ese caso."
  fr: "Un fidèle a posé une question concernant l'adhan et l'iqama lorsque deux prières sont regroupées en raison de fortes pluies. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22313) a répondu que le regroupement est permis en cas de fortes pluies, que ce soit en avant ou en arrière, selon ce qui est le plus facile pour le fidèle; la réponse précise comment les appels à la prière sont effectués dans ce cas."
  tr: "Bir soru soran kişi, şiddetli yağmur nedeniyle iki namaz birleştirilirken ezan ve ikametin nasıl çağrılacağını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22313), şiddetli yağmur durumunda iki namazın daha erken veya geç birleşilmesinin sağ ve sola bağlı olarak kabul edilebilir olduğunu ve bu durumda azan ve ikametin nasıl çağrıldığını açıkladı."
  id: "Seorang penanya bertanya tentang cara memanggil adhan dan iqamah saat menggabungkan dua shalat karena hujan deras. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22313) menjawab bahwa diperbolehkan menggabungkan dua shalat tersebut jika hujan deras, baik lebih awal atau lebih lambat, tergantung pada kanan dan kiri, dan menjelaskan cara memanggil adhan dan iqamah dalam kasus tersebut."
