id: work/fatwa-amja-husbands-member-touch
class: work
kind: fatwa
label: { ar: "مس الذكر والوضوء", en: "Touching the husband's member — wudu, not washing", ur: "شوہر کے عضو کا چھونا — وضو", es: "Tocar el miembro del marido — wudu, no lavarse" }
summary:
  ar: "سألت امرأة هل يجب عليها الاغتسال عند ملامسة قضيب زوجها لجسدها. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 81056 بتاريخ 26 فبراير 2010)⁩ أن هذا لا يوجب عليها الغسل ولكن يوجب الوضوء إذا أرادت الصلاة إذ الملامسة تنقض الوضوء على ما فصّل الجواب."
  en: "A woman asked whether her husband's member touching her body obliges her washing. Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 81056, 26 February 2010) answered that this does not oblige washing; it obliges wudu if she intends to pray, the contact breaking the wudu — as the answer details."
  ur: "شوہر کے عضو کا چھونا — غسل یا وضو؟ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 81056، 26 فروری 2010)⁩ کے مطابق غسل نہیں صرف وضو ٹوٹتا ہے۔"
  es: "Una mujer preguntó si el contacto del miembro viril de su marido con su cuerpo la obligaba a lavarse. El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.º 81056, 26 de febrero de 2010) respondió que esto no la obliga a lavarse; la obliga a realizar la ablución si tiene intención de rezar, ya que el contacto rompe la ablución, como se detalla en la respuesta."
