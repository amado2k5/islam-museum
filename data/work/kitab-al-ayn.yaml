    id: classical-attribution
    stance: { ar: "العلماء المتقدمون مختلفون في نسبته إلى الخليل بن أحمد" }
    summary: { ar: "النووي: إنما هو من جمع الليث عن الخليل. ابن جني وأبو علي القالي: فيه خلل لا يجوز أن يحمل على أصغر أتباع الخليل، ومعانيه النحوية على مذهب الكوفيين. المبرد وابن درستويه: يرفعان قدره ويرويه {cite:duha-islam p. 594-595}." }
