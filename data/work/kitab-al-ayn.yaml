label: { ar: "كتاب العين" }
summary:
  ar: "كتاب العين المنسوب إلى الخليل بن أحمد، أول معجم عربي على ترتيب الحروف الصوتية؛ وفي نسبته خلاف ينقله أحمد أمين: قال النووي إنه من جمع الليث عن الخليل، وقال ابن جني في الخصائص إن فيه من التخطيط والخلل والفساد ما لا يجوز أن يحمل على أصغر أتباع الخليل، وقال أبو علي القالي إنه لما ورد من بلاد خراسان في زمن أبي حاتم أنكره هو وأصحابه أشد الإنكار وأن معاني النحو الواقعة فيه على مذهب الكوفيين بخلاف مذهب البصريين الذي ذكره سيبويه عن الخليل؛ وعلى العكس كان المبرد يرفع قدره ويرويه وكذا ابن درستويه، ويكاد لا توجد لأبي إسحاق الزجاج حكاية في اللغة العربية إلا منه، وقال أبو بكر بن دريد إن الكتاب وقع بالبصرة سنة ٢٠٨ قدم به وراق من خراسان في ثمانية وأربعين جزءاً فباعه بخمسين ديناراً؛ ويكاد العلماء يتفقون على أن فكرة جمع اللغة على هذا النحو للخليل وإن اختلفوا في أنه ألفه كله أو بعضه {cite:duha-islam p. 594-595}."
  en: "Kitab al-Ayn — the first Arabic dictionary arranged phonetically, attributed to al-Khalil; Ahmad Amin collects the authorship controversy: al-Nawawi credits al-Layth's compilation, al-Qali's school denounced it when it surfaced from Khurasan in 208, while al-Mubarrad and Ibn Durustawayh prized and transmitted it {cite:duha-islam p. 594-595}."
