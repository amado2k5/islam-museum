    stance: { ar: "فكرة جمع اللغة على هذا النحو للخليل وإن اختُلف في أنه ألفه كله أو بعضه" }
    summary: { ar: "يستقرئ أحمد أمين أن العلماء يكادون يتفقون على أن فكرة الترتيب الصوتي للخليل، مع بقاء نسبة المتن كلّه إليه موضع خلاف {cite:duha-islam p. 595}." }
