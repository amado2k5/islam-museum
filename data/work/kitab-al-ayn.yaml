  - tradition: academic
    id: baalbaki-arabica
    stance: { ar: "بعلبكي: خطة الكتاب للخليل بالإجماع تقريباً، وحجم إسهامه في المتن غير محسوم", en: "Baalbaki: the plan is al-Khalil's by (near) consensus; the extent of his share in the body is unresolved", es: "Baalbaki: el plan es de al-Jalil por (casi) consenso; la medida de su parte en el cuerpo está sin resolver", fr: "Baalbaki : le plan est d'al-Khalil par (quasi) consensus ; l'étendue de sa part dans le corps reste non résolue", ur: "بعلبکی: کتاب کا منصوبہ تقریباً اتفاق سے خلیل کا ہے؛ متن میں ان کے حصے کی مقدار طے نہیں" }
    summary: { ar: "يقول رمزي بعلبكي في «أرابيكا» إن في مقدمة الكتاب براهين ساطعة على أن واضعها هو الخليل، وإن مدى إسهامه في متن الكتاب مدار خلاف لم يُحسم وإن انعقد الإجماع أو كاد على أن الخطة من وضعه.", en: "Ramzi Baalbaki writes in Arabica that the book's preface gives strong proof that al-Khalil wrote it, that the extent of his contribution to the body of the book is an unresolved dispute, although there is (almost) consensus that the plan is his.", es: "Ramzi Baalbaki escribe en Arabica que el prólogo del libro ofrece pruebas sólidas de que al-Jalil lo escribió, que la medida de su contribución al cuerpo del libro es una disputa sin resolver, aunque hay (casi) consenso en que el plan es suyo.", fr: "Ramzi Baalbaki écrit dans Arabica que la préface du livre donne de fortes preuves qu'al-Khalil l'a écrite, que l'étendue de sa contribution au corps du livre est une dispute non résolue, bien qu'il y ait (quasi) consensus que le plan est de lui.", ur: "رمزی بعلبکی «اربیکا» میں لکھتے ہیں کہ کتاب کے مقدمے میں اس بات کے مضبوط دلائل ہیں کہ اسے خلیل نے لکھا، کتاب کے متن میں ان کے حصے کی مقدار ایک غیر حل شدہ اختلاف ہے، اگرچہ تقریباً اتفاق ہے کہ منصوبہ انہی کا ہے۔" }
    sources: [source/arabica-kitab-al-ayn]
  - tradition: academic
    id: foreign-influence-debate
    stance: { ar: "هل تأثر الخليل بتراث هندي أو يوناني؟", en: "Did al-Khalil draw on an Indian or Greek tradition?", es: "¿Se inspiró al-Jalil en una tradición india o griega?", fr: "Al-Khalil s'est-il inspiré d'une tradition indienne ou grecque ?", ur: "کیا خلیل نے ہندی یا یونانی روایت سے استفادہ کیا؟" }
    summary: { ar: "تعرض «أرابيكا» خلاف الدارسين: منهم من رأى أثراً هندياً أو يونانياً في ترتيب الحروف على المخارج. وتذكر حجة ڤيڤيان لو أن مفهومي «المخرج» و«الحيّز» عند الخليل ثابتان طيّعان في التطبيق، بخلاف المفهومين الهنديين الحيويين الجامدين في التطبيق، وقول جون هايوود إن آراء الخليل الصوتية يُرجَّح أنها منقولة عن التراث السنسكريتي، وتقول إن هذا الرأي لا يعضده سند علمي.", en: "Arabica reports the scholars' dispute: some saw Indian or Greek influence in the ordering of letters by articulation point. It gives Vivian Lowe's argument that al-Khalil's concepts of makhraj and hayyiz are static but flexible in application, unlike the Indian concepts, which are dynamic but rigid in application, and John Haywood's remark that al-Khalil's phonetic views were probably taken from the Sanskrit tradition, and says that this view has no scholarly evidence behind it.", es: "Arabica recoge la disputa de los estudiosos: algunos vieron influencia india o griega en el orden de las letras por punto de articulación. Presenta el argumento de Vivian Lowe de que los conceptos de makhraj y hayyiz de al-Jalil son estáticos pero flexibles en la aplicación, a diferencia de los conceptos indios, dinámicos pero rígidos en la aplicación, y la observación de John Haywood de que las ideas fonéticas de al-Jalil probablemente proceden de la tradición sánscrita, y dice que esta opinión carece de respaldo académico.", fr: "Arabica rapporte la dispute des chercheurs : certains ont vu une influence indienne ou grecque dans le classement des lettres par point d'articulation. Elle donne l'argument de Vivian Lowe selon lequel les notions de makhraj et de hayyiz d'al-Khalil sont statiques mais souples dans l'application, à la différence des notions indiennes, dynamiques mais rigides dans l'application, et la remarque de John Haywood selon laquelle les vues phonétiques d'al-Khalil viennent probablement de la tradition sanskrite, et dit que cette opinion n'a aucun appui scientifique.", ur: "«اربیکا» دانشوروں کا اختلاف بیان کرتی ہے: بعض نے مخارج کے لحاظ سے حروف کی ترتیب میں ہندی یا یونانی اثر دیکھا۔ وہ ویویان لو کی دلیل نقل کرتی ہے کہ خلیل کے مخرج اور حیّز کے تصورات ساکن مگر عمل میں لچکدار ہیں، جبکہ ہندی تصورات متحرک مگر عمل میں سخت ہیں، اور جان ہیووڈ کا قول کہ خلیل کے صوتی نظریات غالباً سنسکرت روایت سے لیے گئے، اور کہتی ہے کہ اس رائے کے پیچھے کوئی علمی ثبوت نہیں۔" }
    sources: [source/arabica-kitab-al-ayn]
