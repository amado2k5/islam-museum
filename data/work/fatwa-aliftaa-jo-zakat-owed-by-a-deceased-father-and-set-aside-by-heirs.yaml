id: work/fatwa-aliftaa-jo-zakat-owed-by-a-deceased-father-and-set-aside-by-heirs
class: work
kind: fatwa
label: { ar: "زكاة مستحقة على الأب المتوفى أخرها الورثة", en: "Zakat owed by a deceased father and held back by his heirs", ur: "فوت شدہ والد پر واجب زکوٰۃ جسے ورثا نے روکے رکھا" }
summary:
  ar: "سؤال عن زكاة مستحقة على الأب المتوفى أخرها الورثة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة دين على الميت تخرج من التركة قبل قسمتها عن جميع السنوات، وأن المال المفصول والمحفوظ زكاةً لا تجب فيه الزكاة مرة أخرى لأنه صار للفقراء، لكن يأثم من أخر إخراجه مع التمكن. أجابت الدائرة بأن الزكاة دين على الميت، ويجب إخراجها عن المدة التي لم يزكها قبل تقسيم التركة إن تأكد أنه لم يخرجها، وتحسب من يوم ملك النصاب وحال عليه الحول، فتخرج من التركة زكاة جميع السنوات السابقة. وقالت إن المال المفصول والمحفوظ زكاةً لا تجب فيه الزكاة مرة أخرى لأنه صار ملكًا للفقراء، لكن المزكي يأثم بتأخير إخراجه إن تمكن ولم يفعل. ونقلت عن الشيرازي في المهذب (1/268) قولي الشافعي في تعلق الزكاة: القديم أنها في الذمة والمال مرهون بها، والجديد الصحيح أنها في عين المال، وعليه فمن لم يؤد حتى حال حول آخر لم تجب عليه زكاة الحول الثاني لأن الفقراء ملكوا قدر الفرض من النصاب، ونقلت عن الشربيني في مغني المحتاج (2/137) أن الزكاة تتعلق بالمال تعلق شركة بقدرها، وفي قول تعلق رهن، وفي قول بالذمة وحدها وهو أضعفها."
  en: "A question about zakat owed by a deceased father and held back by his heirs, in which Jordan's General Iftaa Department answered that zakat is a debt owed by the deceased, paid from the estate before division for all the years missed, and that money set apart as zakat is not liable to zakat again because it now belongs to the poor, though whoever delays paying it when able is sinful. The Department answered that zakat is a debt owed by the deceased and must be paid for the period he did not pay before the estate is divided, if it is certain he did not pay it; it is calculated from the day he owned the nisab and a year passed on it, so the zakat for all the previous years is taken from the estate before division. It said that money set apart and kept as zakat is not liable to zakat again, because it has become the property of the poor, but the person responsible sins by delaying its payment if he was able to pay and did not. It quoted al-Shirazi in al-Muhadhdhab (1/268) on the two views of al-Shafi'i about what zakat attaches to: the old view, that it is owed as a liability with the property pledged for it, and the new and correct view, that it attaches to the property itself; on the latter, if someone does not pay until another year passes, no zakat is due for the second year, because the poor already own the obligatory share of the nisab. It also quoted al-Shirbini in Mughni al-Muhtaj (2/137) that zakat attaches to the property as a partnership in its amount, with other views treating it as a pledge, or as owed only as a liability, the weakest of them."
  ur: "فوت شدہ والد پر واجب زکوٰۃ جسے ورثا نے روکے رکھا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکوٰۃ میت پر قرض ہے جو ترکے کی تقسیم سے پہلے تمام چھوٹے ہوئے سالوں کی ادا کی جائے گی، اور زکوٰۃ کے لیے الگ رکھے ہوئے مال پر دوبارہ زکوٰۃ نہیں کیونکہ وہ اب فقرا کا ہے، البتہ جو قدرت کے باوجود ادائیگی میں تاخیر کرے وہ گناہگار ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ میت پر قرض ہے، اور اگر یقین ہو کہ اس نے ادا نہیں کی تو ترکے کی تقسیم سے پہلے اس مدت کی زکوٰۃ نکالنا واجب ہے؛ اس کا حساب اس دن سے ہوگا جب وہ نصاب کا مالک ہوا اور اس پر سال گزرا، اس لیے تمام پچھلے سالوں کی زکوٰۃ تقسیم سے پہلے ترکے سے نکالی جائے گی۔ اس نے کہا کہ زکوٰۃ کے طور پر الگ کر کے رکھے گئے مال پر دوبارہ زکوٰۃ واجب نہیں کیونکہ وہ فقرا کی ملکیت بن چکا ہے، لیکن ذمہ دار شخص قدرت کے باوجود ادائیگی میں تاخیر سے گناہگار ہے۔ اس نے المہذب (1/268) میں شیرازی سے زکوٰۃ کے تعلق کے بارے میں شافعی کے دو اقوال نقل کیے: قدیم یہ کہ زکوٰۃ ذمے میں ہے اور مال اس کے بدلے رہن ہے، اور جدید اور صحیح یہ کہ وہ مال کے عین سے متعلق ہے؛ اس بنا پر اگر کوئی دوسرا سال گزرنے تک ادا نہ کرے تو دوسرے سال کی زکوٰۃ واجب نہیں، کیونکہ فقرا نصاب میں سے فرض کی مقدار کے مالک بن چکے۔ اس نے مغنی المحتاج (2/137) میں شربینی سے بھی نقل کیا کہ زکوٰۃ مال سے اپنی مقدار میں شراکت کا تعلق رکھتی ہے، اور دوسرے اقوال میں اسے رہن کا تعلق یا صرف ذمے کا تعلق کہا گیا ہے، جو سب سے کمزور ہے۔"
