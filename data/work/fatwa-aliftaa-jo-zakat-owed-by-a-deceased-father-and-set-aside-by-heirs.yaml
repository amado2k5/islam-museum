id: work/fatwa-aliftaa-jo-zakat-owed-by-a-deceased-father-and-set-aside-by-heirs
class: work
kind: fatwa
label: { ar: "زكاة مستحقة على الأب المتوفى أخرها الورثة", en: "Zakat owed by a deceased father and held back by his heirs", ur: "فوت شدہ والد پر واجب زکوٰۃ جسے ورثا نے روکے رکھا", es: "Zakat adeudado por un padre fallecido y retenido por sus herederos.", fr: "La zakat due par un père décédé et retenue par ses héritiers", tr: "Ölen babaya olan zekat, son kişi ise varislerdir", id: "Zakat yang harus dibayar atas ayah yang telah meninggal, yang terakhir adalah ahli waris" }
summary:
  ar: "سؤال عن زكاة مستحقة على الأب المتوفى أخرها الورثة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة دين على الميت تخرج من التركة قبل قسمتها عن جميع السنوات، وأن المال المفصول والمحفوظ زكاةً لا تجب فيه الزكاة مرة أخرى لأنه صار للفقراء، لكن يأثم من أخر إخراجه مع التمكن. أجابت الدائرة بأن الزكاة دين على الميت، ويجب إخراجها عن المدة التي لم يزكها قبل تقسيم التركة إن تأكد أنه لم يخرجها، وتحسب من يوم ملك النصاب وحال عليه الحول، فتخرج من التركة زكاة جميع السنوات السابقة. وقالت إن المال المفصول والمحفوظ زكاةً لا تجب فيه الزكاة مرة أخرى لأنه صار ملكًا للفقراء، لكن المزكي يأثم بتأخير إخراجه إن تمكن ولم يفعل. ونقلت عن الشيرازي في المهذب (1/268) قولي الشافعي في تعلق الزكاة: القديم أنها في الذمة والمال مرهون بها، والجديد الصحيح أنها في عين المال، وعليه فمن لم يؤد حتى حال حول آخر لم تجب عليه زكاة الحول الثاني لأن الفقراء ملكوا قدر الفرض من النصاب، ونقلت عن الشربيني في مغني المحتاج (2/137) أن الزكاة تتعلق بالمال تعلق شركة بقدرها، وفي قول تعلق رهن، وفي قول بالذمة وحدها وهو أضعفها."
  en: "A question about zakat owed by a deceased father and held back by his heirs, in which Jordan's General Iftaa Department answered that zakat is a debt owed by the deceased, paid from the estate before division for all the years missed, and that money set apart as zakat is not liable to zakat again because it now belongs to the poor, though whoever delays paying it when able is sinful. The Department answered that zakat is a debt owed by the deceased and must be paid for the period he did not pay before the estate is divided, if it is certain he did not pay it; it is calculated from the day he owned the nisab and a year passed on it, so the zakat for all the previous years is taken from the estate before division. It said that money set apart and kept as zakat is not liable to zakat again, because it has become the property of the poor, but the person responsible sins by delaying its payment if he was able to pay and did not. It quoted al-Shirazi in al-Muhadhdhab (1/268) on the two views of al-Shafi'i about what zakat attaches to: the old view, that it is owed as a liability with the property pledged for it, and the new and correct view, that it attaches to the property itself; on the latter, if someone does not pay until another year passes, no zakat is due for the second year, because the poor already own the obligatory share of the nisab. It also quoted al-Shirbini in Mughni al-Muhtaj (2/137) that zakat attaches to the property as a partnership in its amount, with other views treating it as a pledge, or as owed only as a liability, the weakest of them."
  ur: "فوت شدہ والد پر واجب زکوٰۃ جسے ورثا نے روکے رکھا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکوٰۃ میت پر قرض ہے جو ترکے کی تقسیم سے پہلے تمام چھوٹے ہوئے سالوں کی ادا کی جائے گی، اور زکوٰۃ کے لیے الگ رکھے ہوئے مال پر دوبارہ زکوٰۃ نہیں کیونکہ وہ اب فقرا کا ہے، البتہ جو قدرت کے باوجود ادائیگی میں تاخیر کرے وہ گناہگار ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ میت پر قرض ہے، اور اگر یقین ہو کہ اس نے ادا نہیں کی تو ترکے کی تقسیم سے پہلے اس مدت کی زکوٰۃ نکالنا واجب ہے؛ اس کا حساب اس دن سے ہوگا جب وہ نصاب کا مالک ہوا اور اس پر سال گزرا، اس لیے تمام پچھلے سالوں کی زکوٰۃ تقسیم سے پہلے ترکے سے نکالی جائے گی۔ اس نے کہا کہ زکوٰۃ کے طور پر الگ کر کے رکھے گئے مال پر دوبارہ زکوٰۃ واجب نہیں کیونکہ وہ فقرا کی ملکیت بن چکا ہے، لیکن ذمہ دار شخص قدرت کے باوجود ادائیگی میں تاخیر سے گناہگار ہے۔ اس نے المہذب (1/268) میں شیرازی سے زکوٰۃ کے تعلق کے بارے میں شافعی کے دو اقوال نقل کیے: قدیم یہ کہ زکوٰۃ ذمے میں ہے اور مال اس کے بدلے رہن ہے، اور جدید اور صحیح یہ کہ وہ مال کے عین سے متعلق ہے؛ اس بنا پر اگر کوئی دوسرا سال گزرنے تک ادا نہ کرے تو دوسرے سال کی زکوٰۃ واجب نہیں، کیونکہ فقرا نصاب میں سے فرض کی مقدار کے مالک بن چکے۔ اس نے مغنی المحتاج (2/137) میں شربینی سے بھی نقل کیا کہ زکوٰۃ مال سے اپنی مقدار میں شراکت کا تعلق رکھتی ہے، اور دوسرے اقوال میں اسے رہن کا تعلق یا صرف ذمے کا تعلق کہا گیا ہے، جو سب سے کمزور ہے۔"
  es: "Una pregunta sobre el zakat adeudado por un padre fallecido y retenido por sus herederos, en la que el Departamento General de Iftaa de Jordania respondió que el zakat es una deuda del difunto, pagada con la herencia antes de su división por todos los años omitidos, y que el dinero apartado como zakat no está sujeto a zakat nuevamente porque ahora pertenece a los pobres, aunque quien demora su pago cuando puede hacerlo comete pecado. El Departamento respondió que el zakat es una deuda del difunto y debe pagarse por el período que no pagó antes de la división de la herencia, si es seguro que no lo pagó; se calcula desde el día en que poseía el nisab y transcurrido un año, por lo que el zakat de todos los años anteriores se toma de la herencia antes de la división. Dijo que el dinero apartado y guardado como zakat no está sujeto a zakat nuevamente, porque se ha convertido en propiedad de los pobres, pero la persona responsable peca al demorar su pago si podía pagarlo y no lo hizo. Citaba a al-Shirazi en al-Muhadhdhab (1/268) sobre las dos opiniones de al-Shafi'i acerca de a qué se vincula el zakat: la opinión antigua, que se debe como una obligación junto con la propiedad pignorada para ello, y la opinión nueva y correcta, que se vincula a la propiedad misma; según esta última, si alguien no paga hasta que transcurre otro año, no se debe zakat para el segundo año, porque los pobres ya poseen la parte obligatoria del nisab. También citaba a al-Shirbini en Mughni al-Muhtaj (2/137) que el zakat se vincula a la propiedad como una sociedad en su cantidad, mientras que otras opiniones lo tratan como una prenda, o como una obligación únicamente, la más débil de ellas."
  fr: "Une question relative à la zakat due par un père décédé et retenue par ses héritiers a été posée. Le Département général de la Iftaa de Jordanie a répondu que la zakat est une dette du défunt, acquittée sur la succession avant le partage pour toutes les années non payées. L'argent mis de côté au titre de la zakat n'est plus soumis à cette obligation car il appartient désormais aux pauvres. Toutefois, quiconque tarde à la payer alors qu'il en a les moyens commet un péché. Le Département a précisé que la zakat est une dette du défunt et doit être acquittée pour la période non payée avant le partage de la succession, s'il est certain qu'il ne l'a pas versée. Elle est calculée à partir du jour où le défunt possédait le nisab, une année s'étant écoulée depuis. Ainsi, la zakat pour toutes les années précédentes est prélevée sur la succession avant le partage. Le Département a également indiqué que l'argent mis de côté et conservé au titre de la zakat n'est plus soumis à cette obligation car il est devenu la propriété des pauvres. Cependant, le responsable commet un péché en tardant à la payer s'il en avait les moyens et ne l'a pas fait. L'ouvrage cite al-Shirazi dans al-Muhadhdhab (1/268) concernant les deux avis d'al-Shafi'i sur l'objet de la zakat: l'ancien avis, selon lequel elle est due comme une dette grevant le bien donné en gage, et le nouvel avis, considéré comme correct, selon lequel elle s'attache au bien lui-même. Selon ce dernier, si le paiement n'est effectué qu'une année après l'expiration du délai, aucune zakat n'est due pour la seconde année, car le pauvre possède déjà la part obligatoire du nisab. L'ouvrage cite également al-Shirbini dans Mughni al-Muhtaj (2/137), selon lequel la zakat s'attache au bien comme une participation dans sa valeur, tandis que d'autres avis la considèrent comme un gage, ou comme une simple dette, cette dernière opinion étant la moins favorable."
  tr: "Ölen babaya ödenecek zekatla ilgili bir soru, sonuncusu varislerdir; Ürdün Genel Fetva Dairesi, zekatın, ölen kişinin tüm yıllara bölünmeden önce mirastan çıkarılan bir borç olduğu, ayrılmış ve korunan servetin ise zekatın yoksullara ait olduğu için tekrar ödenmediğini, ancak ödemesini geciktiren kişinin günahkar olduğunu belirtmiştir. Daire, zekatın ölen kişiye borç olduğunu ve eğer tekrar ödenmediğinden emin ise, miras bölünmeden önce ödenmediği süre için verilmesi gerektiğini yanıtladı. Nisabın vadesinden ve ay yılının kendisine geçtiği günden hesaplanır, bu nedenle önceki tüm yıllar için zekat, mirastan düşülür. Ayrılmış ve ayrılmış servetin zekattır ve zekatın fakirlerin malı olduğu için tekrar ödenmediğini, ancak zekatı ödeyen kişinin ödeyebiliyorsa ödemesini geciktirerek günahkar olduğunu belirtmiştir. Al-Muhadhdhab (1/268) adlı eserinde Al-Şirazi'nin zekatın haczedilmesiyle ilgili görüşünü alıntıladım: eski görüş, zekatın borçlu olduğu ve mülkün ona ipotek edildiği, yeni doğru görüş ise zekatın mülkün kendisinde olduğudur. Bu nedenle, ikinci yılın zekatını ödemeyen kişi zorunlu değildir çünkü fakirler gerekli payı miras almıştır. Mughni al-Muhtaj (2/137) adlı eserinde Al-Sharbini'den alıntı yaptım: zekat servetle ilişkilidir ve şirket onun miktarına bağlıdır; bazı durumlarda rehin (rehin) olarak kabul edilir; başka durumlarda ise sadece yükümlülüktür, ki bu en zayıftır."
  id: "Pertanyaan tentang zakat yang harus dibayar oleh ayah yang telah meninggal, yang terakhir adalah ahli waris, di mana Departemen Fatwa Umum Yordania menjawab bahwa zakat adalah hutang atas almarhum yang dihapus dari harta sebelum dibagi ke seluruh tahun, dan bahwa kekayaan yang dipisahkan dan dipertahankan adalah zakat yang zakat tidak harus dibayar lagi karena milik orang miskin, tetapi yang menunda pembayarannya dianggap berdosa jika mampu. Departemen menjawab bahwa zakat adalah hutang atas almarhum dan harus diberikan untuk periode yang belum dibayar sebelum harta dibagi jika yakin tidak dibayar lagi. Zakat dihitung sejak hari jatuh tempo nisab dan tahun lunar berlalu kepadanya, sehingga zakat untuk semua tahun sebelumnya dikurangkan dari harta warisan. Dinyatakan bahwa kekayaan yang dipisahkan dan disimpan adalah zakat, dan zakat tidak jatuh tempo lagi karena telah menjadi milik orang miskin, tetapi pembayar zakat berdosa dengan menunda pembayarannya jika mampu tetapi tidak. Saya mengutip Al-Shirazi dalam Al-Muhadhdhab (1/268) pandangan Al-Shafi'i mengenai penyitaan zakat: pandangan lama adalah bahwa zakat itu dalam utang dan properti digadaikan kepadanya, dan pandangan baru yang benar adalah bahwa zakat itu ada dalam properti itu sendiri. Oleh karena itu, siapa pun yang tidak membayar zakat tahun kedua tidak wajib karena orang miskin telah mewarisi bagian yang diperlukan. Saya mengutip dari Al-Sharbini dalam Mughni al-Muhtaj (2/137) bahwa zakat terkait dengan kekayaan dan sebuah perusahaan terikat pada jumlahnya; dalam beberapa kasus, itu adalah gadai; dan dalam kasus lain, itu hanya kewajiban, yang paling lemah."
