id: work/fatwa-amja-unable-jumua-prays-zuhr
class: work
kind: fatwa
label: { ar: "العاجز عن الجمعة يصلي ظهرًا", en: "One barred from the mosque's Jumu'a prays it as Zuhr", ur: "جمعہ سے معذور — ظهر پڑھے" }
summary:
  ar: "سأل سائل عن حكم من لا يقدر أن يصلي الجمعة في المسجد. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 85712 بتاريخ 20 أكتوبر 2011)⁩ أن العاجز عن صلاة الجمعة في المسجد لمرض أقعده أو خوف قيده أو لمطر شديد حال بينه وبين المسجد ونحو ذلك من الأعذار الشرعية فإنه يصليها ظهرًا على ما فصّل الجواب."
  en: "A questioner asked the ruling for one unable to pray Jumu'a at the mosque. AMJA's fatwa committee (fatwa no. 85712, 20 October 2011) answered that one unable to pray Jumu'a at the mosque — for an illness that seated him, a fear that bound him, heavy rain standing between him and the mosque, or like legal excuses — prays it as Zuhr — as the answer details."
  ur: "جمعہ نہ پہنچ سکے؟ لجنة الفتوى ⁦(فتویٰ 85712، 20 اکتوبر 2011)⁩ کے مطابق شرعی عذر میں ظہر پڑھے۔"
