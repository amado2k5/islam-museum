id: work/fatwa-amja-unable-jumua-prays-zuhr
class: work
kind: fatwa
label: { ar: "العاجز عن الجمعة يصلي ظهرًا", en: "One barred from the mosque's Jumu'a prays it as Zuhr", ur: "جمعہ سے معذور — ظهر پڑھے", fr: "Celui qui est interdit d'accès à la prière du vendredi (Jumu'a) à la mosquée la prie comme Zuhr.", tr: "Cuma namazını yapamayan kişi öğle vakti namaz kılmalıdır.", id: "Orang yang tidak mampu melakukan shalat Jumat harus berdoa tengah hari." }
summary:
  ar: "سأل سائل عن حكم من لا يقدر أن يصلي الجمعة في المسجد. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 85712 بتاريخ 20 أكتوبر 2011)⁩ أن العاجز عن صلاة الجمعة في المسجد لمرض أقعده أو خوف قيده أو لمطر شديد حال بينه وبين المسجد ونحو ذلك من الأعذار الشرعية فإنه يصليها ظهرًا على ما فصّل الجواب."
  en: "A questioner asked the ruling for one unable to pray Jumu'a at the mosque. AMJA's fatwa committee (fatwa no. 85712, 20 October 2011) answered that one unable to pray Jumu'a at the mosque — for an illness that seated him, a fear that bound him, heavy rain standing between him and the mosque, or like legal excuses — prays it as Zuhr — as the answer details."
  ur: "جمعہ نہ پہنچ سکے؟ لجنة الفتوى ⁦(فتویٰ 85712، 20 اکتوبر 2011)⁩ کے مطابق شرعی عذر میں ظہر پڑھے۔"
  es: "Un consultante preguntó cuál es la norma para quien no puede rezar el Jumu'a en la mezquita. El comité de fatwas de AMJA (fatwa n.º 85712, 20 de octubre de 2011) respondió que quien no puede rezar el Jumu'a en la mezquita —ya sea por una enfermedad que lo incapacita, un temor que lo paraliza, fuertes lluvias que le impiden llegar a la mezquita o por otras razones legales— debe rezarlo como Zuhr, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé la décision concernant le cas d'une personne dans l'impossibilité d'accomplir la prière du vendredi (Jumu'a) à la mosquée. Le comité des fatwas de l'AMJA (fatwa n° 85712, 20 octobre 2011) a répondu que cette personne, dans l'impossibilité d'accomplir la prière du vendredi à la mosquée – pour cause de maladie l'empêchant de se rendre à la mosquée, de crainte l'en empêchant, de fortes pluies l'empêchant de s'y rendre, ou pour d'autres motifs légaux – peut accomplir cette prière au titre de la prière de midi (Zuhr), comme le précise la réponse."
  tr: "Bir soru soran kişi, camide Cuma namazı yapamayan birine ilişkin karar hakkında soru soruldu. Amerikan Şeriat Hukukçuları Konseyi Fetva Komitesi (20 Ekim 2011 tarihli Fetva No. 85712), hastalık, kapalı kalma korkusu, cami ile arasına giren şiddetli yağmur veya benzeri dini sebepler nedeniyle camide cuma namazı yapamayan kişinin cevabında açıklandığı gibi öğle vakti namaz kılması gerektiğini yanıtladı."
  id: "Seorang penanya ditanya tentang putusan terhadap seseorang yang tidak dapat shalat Jumat di masjid. Komite Fatwa di American Council of Sharia Jurists (Fatwa No. 85712 tanggal 20 Oktober 2011) menjawab bahwa seseorang yang tidak dapat melaksanakan shalat Jumat di masjid karena sakit, takut terkurung diri, hujan deras yang memisahkan dirinya dan masjid, atau alasan agama serupa, harus shalat pada siang hari seperti yang dijelaskan dalam jawaban."
