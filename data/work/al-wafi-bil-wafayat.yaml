summary:
  ar: "معجم الصفدي التاريخي الكبير الذي سماه «الوافي بالوفيات»، جمعه على حروف المعجم في نحو ثلاثين مجلدة، وأفرد منه أهل عصره في كتاب سماه «أعيان العصر وأعوان النصر» في ست مجلدات {cite:durar-kamina-jil-1993 vol. 2 p. 88}؛ وقد بقي مرجعاً لا غنى عنه للدارسين ونُشر في اثنين وعشرين مجلداً حتى سنة ١٩٩٣م {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}."
  en: "Al-Safadi's great biographical dictionary, arranged alphabetically in about thirty volumes; he split off the notables of his own lifetime into a separate six-volume work, A'yan al-'asr wa-a'wan al-nasr {cite:durar-kamina-jil-1993 vol. 2 p. 88}. The Wafi remains indispensable to scholars; twenty-two edited volumes had appeared by 1993 {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}."
  ur: "صفدی کی عظیم ترجمی بزرگی کی معجم جسے «الوافی بالوفیات» کہا جاتا ہے — حروف تہجی کی ترتیب پر تقریباً تیس مجلدوں میں؛ اپنے عہد کے بزرگوں کا علاحدہ چھ مجلدی ذیل «أعيان العصر وأعوان النصر» بنایا {cite:durar-kamina-jil-1993 vol. 2 p. 88}۔ یہ آج بھی محققین کے لیے ناگزیر مرجع ہے اور 1993ء تک اس کے بائیس مدون مجلد شائع ہو چکے تھے {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}۔"
  es: "El gran diccionario biográfico de Al-Safadi, ordenado alfabéticamente en unos treinta volúmenes, separó a las personalidades notables de su época en una obra aparte de seis volúmenes, A'yan al-'asr wa-a'wan al-nasr {cite:durar-kamina-jil-1993 vol. 2 p. 88}. El Wafi sigue siendo indispensable para los estudiosos; para 1993 ya se habían publicado veintidós volúmenes editados {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}."
  fr: "Le grand dictionnaire biographique d'Al-Safadi, classé par ordre alphabétique en une trentaine de volumes, comprend une œuvre distincte en six volumes consacrée aux personnalités de son époque: *A'yan al-'asr wa-a'wan al-nasr* (voir: *durar-kamina-jil*, 1993, vol. 2, p. 88). Le *Wafadi* demeure une référence incontournable pour les chercheurs; vingt-deux volumes édités étaient déjà parus en 1993 (voir: *encyclopaedia-of-islam*, vol. 8, p. 760)."
  tr: "Büyük tarihsel Safadi sözlüğü, 'El-Vafi bil-Vafayat' adını vermiş, alfabetik olarak yaklaşık otuz ciltte derlenmiş ve döneminin alimleri tarafından 'Dönemin Önemli Kişileri ve Zaferin Yardımları' adlı altı ciltlik bir kitapta ithaf edilmiştir {cite:durar-kamina-jil-1993 cilt 2, s. 88}; alimler için vazgeçilmez bir başvuru kaynağı olarak kalmış ve 1993 yılına kadar yirmi iki cilt halinde yayımlanmıştır {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 760}."
  id: "Kamus sejarah besar Safadi, yang ia sebut 'Al-Wafi bil-Wafayat,' disusun secara alfabetis menjadi sekitar tiga puluh volume, dan para sarjana pada masanya mendedikasikannya dalam sebuah buku yang ia sebut 'Notables of the Era and Aids of Victory' dalam enam jilid {cite:durar-kamina-jil-1993 vol. 2, hlm. 88}; kamus ini tetap menjadi referensi yang tak tergantikan bagi para sarjana dan diterbitkan dalam dua puluh dua jilid hingga tahun 1993 {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 760}."
