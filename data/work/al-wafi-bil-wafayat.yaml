label: { ar: "الوافي بالوفيات", en: "al-Wafi bi-l-Wafayat", ur: "الوافی بالوفیات" }
summary:
  ar: "معجم الصفدي التاريخي الكبير الذي سماه «الوافي بالوفيات»، جمعه على حروف المعجم في نحو ثلاثين مجلدة، وأفرد منه أهل عصره في كتاب سماه «أعيان العصر وأعوان النصر» في ست مجلدات {cite:durar-kamina-jil-1993 vol. 2 p. 88}؛ وقد بقي مرجعاً لا غنى عنه للدارسين ونُشر في اثنين وعشرين مجلداً حتى سنة ١٩٩٣م {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}."
  en: "Al-Safadi's great biographical dictionary, arranged alphabetically in about thirty volumes; he split off the notables of his own lifetime into a separate six-volume work, A'yan al-'asr wa-a'wan al-nasr {cite:durar-kamina-jil-1993 vol. 2 p. 88}. The Wafi remains indispensable to scholars; twenty-two edited volumes had appeared by 1993 {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}."
  ur: "صفدی کی عظیم ترجمی بزرگی کی معجم جسے «الوافی بالوفیات» کہا جاتا ہے — حروف تہجی کی ترتیب پر تقریباً تیس مجلدوں میں؛ اپنے عہد کے بزرگوں کا علاحدہ چھ مجلدی ذیل «أعيان العصر وأعوان النصر» بنایا {cite:durar-kamina-jil-1993 vol. 2 p. 88}۔ یہ آج بھی محققین کے لیے ناگزیر مرجع ہے اور 1993ء تک اس کے بائیس مدون مجلد شائع ہو چکے تھے {cite:encyclopaedia-of-islam-2 vol. 8 p. 760}۔"
