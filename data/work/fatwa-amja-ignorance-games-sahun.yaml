id: work/fatwa-amja-ignorance-games-sahun
class: work
kind: fatwa
label: { ar: "العذر بالجهل وألعاب الكمبيوتر والساهون", en: "Excuse by ignorance, computer games, and the heedless", ur: "جہالت کا عذر کمپیوٹر گیمز اور ساھین", es: "Excusa por ignorancia, videojuegos y descuido", fr: "L'excuse de l'ignorance, les jeux vidéo et l'insouciance" }
summary:
  ar: "سأل سائل أربعة أسئلة: هل يعذر الإنسان بالجهل في أصول الدين إذا تكاسل عن التعلم، وحكم ألعاب الكمبيوتر ذات الرسوم الثلاثية، وإعادة صلاة شك في صحتها، ومعنى الذين هم في صلاتهم ساهون. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78093 بتاريخ 5 مارس 2009)⁩ أن الأصل المبادرة إلى التعلم والتعليم لإزالة الجهالة فيشغل نفسه بالتعلم بدل الحكم على الجهلاء فهذه القضية من قضايا الفتنة فلا يدخل في لهيبها، واللعب على الكمبيوتر جائز ما لم يكن في الصور فحش ولم يصده عن ذكر الله وعن الصلاة، وإعادة العبادة للشك في صحتها خروجًا من الخلاف حسن لأنه يندب العمل بالأحوط ومن اعتقد بطلان صلاة لا بعينها من صلوات الأمس أعادها جميعًا تبرأ ذمته، ومعنى الذين هم في صلاتهم ساهون الذين يؤخرون الصلاة عن وقتها."
  en: "A questioner asked four things: whether a man is excused by ignorance in the fundamentals of religion when he is lazy about learning; the ruling on 3-D computer games; repeating a prayer doubted; and the meaning of 'those who are heedless in their prayer'. Dr. Salah al-Sawi (fatwa no. 78093, 5 March 2009) answered that the default is hastening to learn and teach to lift ignorance — let him busy himself with learning rather than judging the ignorant, that question being of the fitna questions whose fire he should not enter; computer play is lawful so long as the images hold no obscenity and it does not bar him from remembrance and prayer; redoing a doubted act of worship to leave the disagreement is good, the wary course being recommended — if he thought one unspecified prayer of yesterday void he repeats them all and is cleared; 'heedless in their prayer' means those who delay prayer past its time."
  ur: "ایک سائل نے چار سوال پوچھے — جہالت کا عذر، کمپیوٹر گیمز، نماز کی اعادت اور ساھین کا معنی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78093، 5 مارچ 2009)⁩ کے مطابق علم سیکھنا اصل ہے؛ گیمز بشرط حرام نہ ہوں اور عبادت سے نہ روکیں؛ شک میں احتیاطاً اعادت؛ ساھین وقت سے تاخیر کرنے والے ہیں۔"
  es: "Un consultante formuló cuatro preguntas: si un hombre está excusado por ignorancia en los fundamentos de la religión cuando es perezoso para aprender; la norma sobre los videojuegos en 3D; repetir una oración dudosa; y el significado de \"aquellos que son negligentes en su oración\". El Dr. Salah al-Sawi (fatwa n.° 78093, 5 de marzo de 2009) respondió que lo habitual es apresurarse a aprender y enseñar para disipar la ignorancia; que se ocupe de aprender en lugar de juzgar a los ignorantes, pues esa cuestión es una de las cuestiones de fitna en cuyo fuego no debe entrar; jugar videojuegos es lícito siempre que las imágenes no contengan obscenidades y no le impida recordar y orar; rehacer un acto de culto dudoso para dejar el desacuerdo es bueno, siendo recomendable el camino cauteloso: si pensó que una oración no especificada del día anterior era nula, las repite todas y queda absuelto; \"negligentes en su oración\" significa aquellos que retrasan la oración más allá de su tiempo."
  fr: "Un internaute a posé quatre questions: l’ignorance des fondements de la religion est-elle excusée lorsqu’on néglige d’apprendre ? Quel est l’avis juridique concernant les jeux vidéo en 3D ? Faut-il répéter une prière en cas de doute ? Et que signifie l’expression « ceux qui sont négligents dans leur prière » ? Le Dr Salah al-Sawi (fatwa n° 78093, 5 mars 2009) a répondu que la règle est de s’empresser d’apprendre et d’enseigner pour dissiper l’ignorance; qu’il se consacre à l’apprentissage plutôt qu’à juger les ignorants, car cette question relève de la fitna, sujet à laquelle il ne doit pas s’exposer. Les jeux vidéo sont licites tant que les images ne sont pas obscènes et qu’ils n’empêchent pas le recueillement et la prière. Il est bon de refaire un acte d’adoration douteux pour lever le désaccord, la prudence étant de mise. Si l’internaute pense qu’une prière de la veille est invalide, il peut toutes les répéter et sa prière sera alors validée. L’expression « négligents dans leur prière » désigne ceux qui retardent la prière au-delà de son heure."
