label: { ar: "العذر بالجهل وألعاب الكمبيوتر والساهون", en: "Excuse by ignorance, computer games, and the heedless", ur: "جہالت کا عذر کمپیوٹر گیمز اور ساھین" }
summary:
  ar: "سأل سائل أربعة أسئلة: هل يعذر الإنسان بالجهل في أصول الدين إذا تكاسل عن التعلم، وحكم ألعاب الكمبيوتر ذات الرسوم الثلاثية، وإعادة صلاة شك في صحتها، ومعنى الذين هم في صلاتهم ساهون. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78093 بتاريخ 5 مارس 2009)⁩ أن الأصل المبادرة إلى التعلم والتعليم لإزالة الجهالة فيشغل نفسه بالتعلم بدل الحكم على الجهلاء فهذه القضية من قضايا الفتنة فلا يدخل في لهيبها، واللعب على الكمبيوتر جائز ما لم يكن في الصور فحش ولم يصده عن ذكر الله وعن الصلاة، وإعادة العبادة للشك في صحتها خروجًا من الخلاف حسن لأنه يندب العمل بالأحوط ومن اعتقد بطلان صلاة لا بعينها من صلوات الأمس أعادها جميعًا تبرأ ذمته، ومعنى الذين هم في صلاتهم ساهون الذين يؤخرون الصلاة عن وقتها."
  en: "A questioner asked four things: whether a man is excused by ignorance in the fundamentals of religion when he is lazy about learning; the ruling on 3-D computer games; repeating a prayer doubted; and the meaning of 'those who are heedless in their prayer'. Dr. Salah al-Sawi (fatwa no. 78093, 5 March 2009) answered that the default is hastening to learn and teach to lift ignorance — let him busy himself with learning rather than judging the ignorant, that question being of the fitna questions whose fire he should not enter; computer play is lawful so long as the images hold no obscenity and it does not bar him from remembrance and prayer; redoing a doubted act of worship to leave the disagreement is good, the wary course being recommended — if he thought one unspecified prayer of yesterday void he repeats them all and is cleared; 'heedless in their prayer' means those who delay prayer past its time."
  ur: "ایک سائل نے چار سوال پوچھے — جہالت کا عذر، کمپیوٹر گیمز، نماز کی اعادت اور ساھین کا معنی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78093، 5 مارچ 2009)⁩ کے مطابق علم سیکھنا اصل ہے؛ گیمز بشرط حرام نہ ہوں اور عبادت سے نہ روکیں؛ شک میں احتیاطاً اعادت؛ ساھین وقت سے تاخیر کرنے والے ہیں۔"
