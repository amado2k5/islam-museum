id: work/fatwa-aliftaa-jo-one-sacrifice-for-a-whole-household
class: work
kind: fatwa
label: { ar: "إجزاء الأضحية عن أهل البيت الواحد", en: "One sacrifice for a whole household", ur: "ایک قربانی پورے گھرانے کی طرف سے", es: "Un sacrificio por todo un hogar.", fr: "Un sacrifice pour toute une famille", tr: "Aynı evdeki insanlar için yapılan kurbanın bazı bölümleri", id: "Bagian dari pengorbanan untuk orang-orang dari rumah yang sama" }
summary:
  ar: "سؤال عن إجزاء الأضحية عن أهل البيت الواحد ولو كان المضحي الزوجة أو أحد الأولاد، أجابت فيه دائرة الإفتاء العام الأردنية بأنها سنة كفاية في حق البيت الواحد، فإذا فعلها أحدهم سقط الطلب عن الباقين، والثواب للمضحي إلا أن يشرك غيره. أجابت الدائرة بأن الأضحية سنة مؤكدة في حق الموسر، وهو من ملك ما يزيد على حاجته يوم العيد وليلته وأيام التشريق بقدر ثمن الأضحية. وقالت إنها سنة كفاية في حق أهل البيت الواحد إذا كانت نفقتهم على شخص واحد، فإذا قام بها أحدهم، ولو كان ممن لا تلزمه النفقة كالزوجة أو أحد الأولاد، سقط الطلب عن الباقين كسقوط صلاة الجنازة بقيام البعض، دون حصول الثواب لغير المضحي إلا إذا نوى إشراكهم. ونقلت قول سليمان الجمل في حاشيته على فتح الوهاب في معنى كونها سنة كفاية، وما ذكره من أن النووي قال في شرح صحيح مسلم إنه لو أشرك غيره في ثوابها جاز. وخلصت إلى أن الأضحية سنة مؤكدة للموسر وسنة كفاية للبيت الواحد، إذا فعلها أحدهم ولو غير المنفق سقط الطلب عن الباقين، وللمضحي أن يشرك معه من شاء في ثوابها."
  en: "A question about whether one sacrifice suffices for a whole household even if the one sacrificing is the wife or one of the children, in which Jordan's General Iftaa Department answered that it is a communal sunna for one household: if one member performs it, the call lifts from the rest, while the reward belongs to the one sacrificing unless he includes others in it. The Department answered that the sacrifice is an emphasised sunna for someone who can afford it, meaning someone who owns enough beyond his needs for the day and night of Eid and the days of tashriq to buy a sacrificial animal. It said it is a communal sunna for the people of one household whose maintenance falls on one person: if any one of them performs it, even someone not responsible for the maintenance such as the wife or a child, the call lifts from the rest, as the funeral prayer lifts from all when some perform it, though the reward does not reach anyone but the one sacrificing unless he intends to include them. It quoted Sulayman al-Jamal in his gloss on Fath al-Wahhab on what being a communal sunna means, including his report that al-Nawawi said in his commentary on Sahih Muslim that it is permitted to include others in its reward. It concluded that the sacrifice is an emphasised sunna for the well-off and a communal sunna for one household: if any member performs it, even one who is not the provider, the call lifts from the rest, and the one sacrificing may include whomever he wishes in its reward."
  ur: "اس سوال کے بارے میں کہ کیا ایک قربانی پورے گھرانے کی طرف سے کافی ہے چاہے قربانی کرنے والی بیوی ہو یا اولاد میں سے کوئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ ایک گھرانے کے حق میں سنت کفایہ ہے: اگر کوئی ایک کر لے تو باقیوں سے مطالبہ ساقط ہو جاتا ہے، جبکہ ثواب قربانی کرنے والے کا ہے سوائے اس کے کہ وہ دوسروں کو شریک کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی صاحب استطاعت کے لیے سنت مؤکدہ ہے، یعنی اس کے لیے جس کے پاس عید کے دن اور رات اور ایام تشریق کی ضرورت سے زائد اتنا ہو کہ قربانی کا جانور خرید سکے۔ اس نے کہا کہ یہ ان گھر والوں کے حق میں سنت کفایہ ہے جن کا نان نفقہ ایک شخص کے ذمے ہو: اگر ان میں سے کوئی ایک کر لے، چاہے وہ نفقے کا ذمہ دار نہ ہو جیسے بیوی یا اولاد میں سے کوئی، تو باقیوں سے مطالبہ ساقط ہو جاتا ہے، جیسے بعض کے ادا کرنے سے نماز جنازہ سب سے ساقط ہو جاتی ہے، البتہ ثواب قربانی کرنے والے کے سوا کسی کو نہیں ملتا سوائے اس کے کہ وہ انہیں شریک کرنے کی نیت کرے۔ اس نے فتح الوہاب پر حاشیے میں سلیمان الجمل کا قول نقل کیا کہ سنت کفایہ ہونے کا مطلب کیا ہے، اور ان کا یہ بیان کہ نووی نے صحیح مسلم کی شرح میں کہا کہ دوسرے کو اس کے ثواب میں شریک کرنا جائز ہے۔ اس نے نتیجہ نکالا کہ قربانی صاحب استطاعت کے لیے سنت مؤکدہ اور ایک گھرانے کے لیے سنت کفایہ ہے: اگر کوئی ایک، چاہے وہ کمانے والا نہ ہو، کر لے تو باقیوں سے مطالبہ ساقط ہو جاتا ہے، اور قربانی کرنے والا جسے چاہے اس کے ثواب میں شریک کر سکتا ہے۔"
  es: "Una pregunta sobre si un solo sacrificio es suficiente para toda una familia, incluso si quien lo realiza es la esposa o uno de los hijos, a lo que el Departamento General de Iftaa de Jordania respondió que es una sunna comunitaria para una familia: si un miembro la realiza, la obligación se elimina del resto, mientras que la recompensa pertenece a quien realiza el sacrificio a menos que incluya a otros. El Departamento respondió que el sacrificio es una sunna destacada para quien puede permitírselo, es decir, quien posee lo suficiente más allá de sus necesidades para el día y la noche del Eid y los días de tashriq para comprar un animal de sacrificio. Dijo que es una sunna comunitaria para las personas de una familia cuyo sustento recae en una persona: si cualquiera de ellos la realiza, incluso alguien que no es responsable del sustento como la esposa o un hijo, la obligación se elimina del resto, como la oración fúnebre se elimina de todos cuando alguien la realiza, aunque la recompensa no llega a nadie más que a quien realiza el sacrificio a menos que tenga la intención de incluirlos. Citaba a Sulayman al-Jamal en su glosa sobre Fath al-Wahhab acerca del significado de ser una sunna comunitaria, incluyendo su relato de que al-Nawawi afirmó en su comentario sobre Sahih Muslim que está permitido incluir a otros en su recompensa. Concluía que el sacrificio es una sunna destacada para los adinerados y una sunna comunitaria para un hogar: si algún miembro lo realiza, incluso quien no sea el proveedor, la obligación se extingue para los demás, y quien realiza el sacrificio puede incluir a quien desee en su recompensa."
  fr: "Une question portait sur la suffisance d'un seul sacrifice pour toute une famille, même si celui qui l'accomplit est l'épouse ou un enfant. Le Département général de la Iftaa de Jordanie a répondu qu'il s'agit d'une sunna communautaire pour un foyer: si un membre l'accomplit, l'appel est levé pour les autres, et la récompense lui revient, à moins qu'il n'y associe d'autres personnes. Le Département a précisé que le sacrifice est une sunna fortement recommandée pour celui qui en a les moyens, c'est-à-dire celui qui possède suffisamment d'argent au-delà de ses besoins pour le jour et la nuit de l'Aïd et les jours de Tashriq pour acheter un animal sacrificiel. Il a ajouté que c'est une sunna communautaire pour les membres d'un même foyer dont la charge repose sur une seule personne: si l'un d'eux l'accomplit, même une personne non responsable de l'entretien, comme l'épouse ou un enfant, l'appel est levé pour les autres, de la même manière que la prière funéraire est levée pour tous lorsqu'elle est accomplie par certains. Toutefois, la récompense n'est attribuée qu'à celui qui a accompli le sacrifice, à moins qu'il n'ait l'intention d'y inclure d'autres personnes. L'article cite Sulayman al-Jamal dans son commentaire de Fath al-Wahhab sur la signification d'une sunna communautaire, notamment son rapport selon lequel al-Nawawi, dans son commentaire du Sahih Muslim, affirme qu'il est permis d'y inclure d'autres personnes pour la récompense. Il conclut que le sacrifice est une sunna fortement recommandée pour les personnes aisées et une sunna communautaire pour un foyer: si un membre l'accomplit, même celui qui n'est pas le principal soutien financier, l'obligation est levée pour les autres, et celui qui effectue le sacrifice peut inclure qui il souhaite dans la récompense."
  tr: "Fedanın aynı hanedeki aile için yeterliliğiyle ilgili bir soruya gelince, kurban eden kişi eş ya da çocuklardan biri olsa bile, Ürdün Genel Fetva Dairesi bunun aynı hane için ortak bir sünnet olduğunu söyledi. Birisi bunu yaparsa, talep diğerlerinden kalkar ve ödül, başkalarıyla ortak olmadıkça kurban edene verilir. Daire, kurbanın, zengin için onaylanmış bir sünnet olduğunu, Kurban Bayramı, gecesi ve Taşreek günlerinde ihtiyacından fazlasına sahip olduğunu, bunun da kurbanın bedeline eşit olduğunu yanıtladı. Aynı hane üyelerinin masrafları bir kişiye bağlıysa bunun toplu bir sünnet olduğunu söyledi. Eğer biri bunu yaparsa, karısı veya çocuklardan biri gibi nafaka sağlamak zorunda olmasa bile, diğerleri için talep kaldırılır; tıpkı bazı kişilerin ayakta kaldığında cenaze namazının kaçırılması gibi, fedakarlık yapmayan kişi için ödül almaması gibi, ancak onları dahil etmek istemedikçe. Süleymanel-Cemal'ın Feth al-Wahhab hakkındaki cemaatli sünnet anlamına dair yorumunu ve el-Nevevi'nin Sahih Müslüman üzerine yaptığı tefhitte, birinin başkalarını ödülde paylaşması durumunda bunun mücaiz olduğunu belirttiğini aktardım. Fedanın zenginler için onaylanmış bir sünnet ve tek bir hane için ortak bir sünnet olduğu sonucuna varıldı. Eğer biri bunu yaparsa, harcayan olmasa bile, talep diğerlerinden kalkar ve kurban eden ödülünü istediği kişiyle paylaşabilir."
  id: "Sebuah pertanyaan tentang kecukupan pengorbanan untuk keluarga dari rumah tangga yang sama, meskipun pengorbannya adalah istri atau salah satu anak, Departemen Fatwa Umum Yordania menjawab bahwa itu adalah Sunnah komunal untuk rumah tangga yang sama. Jika salah satu dari mereka melakukannya, tuntutan diangkat dari yang lain, dan hadiah diberikan kepada pengorban, kecuali ia bermitra dengan orang lain. Departemen menjawab bahwa pengorbanan tersebut adalah Sunnah yang dikonfirmasi untuk orang kaya, yang memiliki lebih dari yang dibutuhkan pada hari Idul Fitri, malamnya, dan hari-hari Tashreeq, setara dengan harga kurban. Dikatakan bahwa ini adalah Sunnah kolektif untuk anggota rumah tangga yang sama jika pengeluaran mereka bergantung pada satu orang. Jika salah satu dari mereka melakukannya, meskipun ia tidak wajib menyediakan nafkah, seperti istri atau anak, tuntutan tersebut dikesampingkan untuk sisanya, sama seperti salat pemakaman terlewatkan ketika beberapa orang berdiri, tanpa menerima hadiah untuk yang tidak berkorban kecuali mereka berniat untuk memasukkannya. Saya mengutip komentar Sulayman al-Jamal tentang Fath al-Wahhab mengenai makna bahwa itu adalah Sunnah komunal, dan apa yang dia sebutkan dalam komentarnya tentang Sahih Muslim bahwa jika seseorang bermitra dengan orang lain dalam hadiahnya, maka diperbolehkan. Ia menyimpulkan bahwa korban adalah Sunnah yang dikonfirmasi untuk orang kaya dan Sunnah komunal untuk satu rumah tangga. Jika salah satu dari mereka melakukannya, meskipun bukan pembelanja, tuntutan itu diangkat dari yang lain, dan pengorbannya dapat membagi ganjarannya kepada siapa pun yang dia inginkan."
