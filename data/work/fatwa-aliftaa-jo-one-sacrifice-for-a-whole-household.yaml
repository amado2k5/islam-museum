id: work/fatwa-aliftaa-jo-one-sacrifice-for-a-whole-household
class: work
kind: fatwa
label: { ar: "إجزاء الأضحية عن أهل البيت الواحد", en: "One sacrifice for a whole household", ur: "ایک قربانی پورے گھرانے کی طرف سے" }
summary:
  ar: "سؤال عن إجزاء الأضحية عن أهل البيت الواحد ولو كان المضحي الزوجة أو أحد الأولاد، أجابت فيه دائرة الإفتاء العام الأردنية بأنها سنة كفاية في حق البيت الواحد، فإذا فعلها أحدهم سقط الطلب عن الباقين، والثواب للمضحي إلا أن يشرك غيره. أجابت الدائرة بأن الأضحية سنة مؤكدة في حق الموسر، وهو من ملك ما يزيد على حاجته يوم العيد وليلته وأيام التشريق بقدر ثمن الأضحية. وقالت إنها سنة كفاية في حق أهل البيت الواحد إذا كانت نفقتهم على شخص واحد، فإذا قام بها أحدهم، ولو كان ممن لا تلزمه النفقة كالزوجة أو أحد الأولاد، سقط الطلب عن الباقين كسقوط صلاة الجنازة بقيام البعض، دون حصول الثواب لغير المضحي إلا إذا نوى إشراكهم. ونقلت قول سليمان الجمل في حاشيته على فتح الوهاب في معنى كونها سنة كفاية، وما ذكره من أن النووي قال في شرح صحيح مسلم إنه لو أشرك غيره في ثوابها جاز. وخلصت إلى أن الأضحية سنة مؤكدة للموسر وسنة كفاية للبيت الواحد، إذا فعلها أحدهم ولو غير المنفق سقط الطلب عن الباقين، وللمضحي أن يشرك معه من شاء في ثوابها."
  en: "A question about whether one sacrifice suffices for a whole household even if the one sacrificing is the wife or one of the children, in which Jordan's General Iftaa Department answered that it is a communal sunna for one household: if one member performs it, the call lifts from the rest, while the reward belongs to the one sacrificing unless he includes others in it. The Department answered that the sacrifice is an emphasised sunna for someone who can afford it, meaning someone who owns enough beyond his needs for the day and night of Eid and the days of tashriq to buy a sacrificial animal. It said it is a communal sunna for the people of one household whose maintenance falls on one person: if any one of them performs it, even someone not responsible for the maintenance such as the wife or a child, the call lifts from the rest, as the funeral prayer lifts from all when some perform it, though the reward does not reach anyone but the one sacrificing unless he intends to include them. It quoted Sulayman al-Jamal in his gloss on Fath al-Wahhab on what being a communal sunna means, including his report that al-Nawawi said in his commentary on Sahih Muslim that it is permitted to include others in its reward. It concluded that the sacrifice is an emphasised sunna for the well-off and a communal sunna for one household: if any member performs it, even one who is not the provider, the call lifts from the rest, and the one sacrificing may include whomever he wishes in its reward."
  ur: "اس سوال کے بارے میں کہ کیا ایک قربانی پورے گھرانے کی طرف سے کافی ہے چاہے قربانی کرنے والی بیوی ہو یا اولاد میں سے کوئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ ایک گھرانے کے حق میں سنت کفایہ ہے: اگر کوئی ایک کر لے تو باقیوں سے مطالبہ ساقط ہو جاتا ہے، جبکہ ثواب قربانی کرنے والے کا ہے سوائے اس کے کہ وہ دوسروں کو شریک کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی صاحب استطاعت کے لیے سنت مؤکدہ ہے، یعنی اس کے لیے جس کے پاس عید کے دن اور رات اور ایام تشریق کی ضرورت سے زائد اتنا ہو کہ قربانی کا جانور خرید سکے۔ اس نے کہا کہ یہ ان گھر والوں کے حق میں سنت کفایہ ہے جن کا نان نفقہ ایک شخص کے ذمے ہو: اگر ان میں سے کوئی ایک کر لے، چاہے وہ نفقے کا ذمہ دار نہ ہو جیسے بیوی یا اولاد میں سے کوئی، تو باقیوں سے مطالبہ ساقط ہو جاتا ہے، جیسے بعض کے ادا کرنے سے نماز جنازہ سب سے ساقط ہو جاتی ہے، البتہ ثواب قربانی کرنے والے کے سوا کسی کو نہیں ملتا سوائے اس کے کہ وہ انہیں شریک کرنے کی نیت کرے۔ اس نے فتح الوہاب پر حاشیے میں سلیمان الجمل کا قول نقل کیا کہ سنت کفایہ ہونے کا مطلب کیا ہے، اور ان کا یہ بیان کہ نووی نے صحیح مسلم کی شرح میں کہا کہ دوسرے کو اس کے ثواب میں شریک کرنا جائز ہے۔ اس نے نتیجہ نکالا کہ قربانی صاحب استطاعت کے لیے سنت مؤکدہ اور ایک گھرانے کے لیے سنت کفایہ ہے: اگر کوئی ایک، چاہے وہ کمانے والا نہ ہو، کر لے تو باقیوں سے مطالبہ ساقط ہو جاتا ہے، اور قربانی کرنے والا جسے چاہے اس کے ثواب میں شریک کر سکتا ہے۔"
