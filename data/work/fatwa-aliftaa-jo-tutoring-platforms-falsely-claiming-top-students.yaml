id: work/fatwa-aliftaa-jo-tutoring-platforms-falsely-claiming-top-students
class: work
kind: fatwa
label: { ar: "ادعاء منصات تعليمية أن طلابًا متفوقين درسوا عندها", en: "Tutoring platforms falsely claiming top students studied with them", ur: "تعلیمی پلیٹ فارمز کا جھوٹا دعویٰ کہ نمایاں طلبہ ان کے ہاں پڑھے" }
summary:
  ar: "سؤال عن ادعاء منصات تعليمية أن طلابًا متفوقين درسوا عندها، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذا كذب وتدليس محرم، سواء صدر من الطلبة أو من ملاك المنصات، ويزداد الإثم إذا كان بمقابل مادي. أجابت الدائرة بأن على المسلم التزام الصدق في أقواله وأفعاله وجميع أحواله، واستشهدت بآية الأمر بالكون مع الصادقين في [[passage/quran-9-119|سورة التوبة 9:119]]. وقالت إن الكذب والغش لتحصيل مكاسب دنيوية من عظائم الذنوب، واستندت إلى حديث رواه البخاري في أن من غش فليس منا، وإلى آية اجتناب قول الزور في [[passage/quran-22-30|سورة الحج 22:30]]، وعدّت المال المأخوذ مقابل التصريحات الكاذبة سحتًا محرمًا وأكلًا لأموال الناس بالباطل. وأضافت أنه يحرم على أصحاب المنصات أن ينسبوا لأنفسهم ما ليس فيهم، كادعاء أن طالبًا متفوقًا من طلابهم وهو ليس كذلك، واستندت إلى حديث أسماء بنت أبي بكر الذي رواه البخاري في أن المتشبع بما لم يُعط كلابس ثوبي زور. وخلصت إلى تحريم الكذب في التصريحات الإعلامية وفي كل حال، سواء كان من الطلبة أو من ملاك المنصات، وأن الإثم يزداد إذا كان بمقابل مادي مدفوع."
  en: "A question about tutoring platforms falsely claiming top students studied with them, in which Jordan's General Iftaa Department answered that this is forbidden lying and deception, whether it comes from the students or the platform owners, and that the sin is greater when it is paid for. The Department answered that a Muslim must hold to truthfulness in word, deed and every circumstance, citing the verse commanding believers to be with the truthful in [[passage/quran-9-119|Surat al-Tawba 9:119]]. It said that lying and cheating to obtain worldly gain are among the gravest sins, relying on a hadith reported by al-Bukhari that whoever cheats is not one of us and on the verse commanding avoidance of false speech in [[passage/quran-22-30|Surat al-Hajj 22:30]], and it counted money taken in return for false statements as forbidden gain (suht) and as consuming people's wealth wrongfully. It added that platform owners may not attribute to themselves what is not theirs, such as claiming a top student as one of their own when he is not, relying on the hadith of Asma bint Abi Bakr reported by al-Bukhari that one who boasts of what he was not given is like one wearing two garments of falsehood. It concluded that lying in media statements, and in every circumstance, is forbidden, whether by students or by platform owners, and that the sin is greater when it is done for payment."
  ur: "تعلیمی پلیٹ فارمز کا جھوٹا دعویٰ کہ نمایاں طلبہ ان کے ہاں پڑھے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ حرام جھوٹ اور فریب ہے، چاہے طلبہ کی طرف سے ہو یا پلیٹ فارم مالکان کی طرف سے، اور معاوضے کے بدلے ہو تو گناہ بڑھ جاتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر اپنے قول، عمل اور ہر حال میں سچائی لازم ہے، اور سچوں کے ساتھ رہنے کے حکم والی آیت [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا۔ اس نے کہا کہ دنیاوی فائدے کے لیے جھوٹ اور دھوکا بڑے گناہوں میں سے ہیں، اور بخاری کی روایت کردہ اس حدیث پر انحصار کیا کہ جو دھوکا دے وہ ہم میں سے نہیں، اور جھوٹی بات سے بچنے کے حکم والی آیت [[passage/quran-22-30|سورۃ الحج 22:30]] پر، اور جھوٹے بیانات کے بدلے لیے گئے مال کو حرام کمائی (سحت) اور لوگوں کا مال ناحق کھانا قرار دیا۔ اس نے مزید کہا کہ پلیٹ فارم مالکان کے لیے اپنی طرف وہ بات منسوب کرنا حرام ہے جو ان میں نہیں، جیسے کسی نمایاں طالب علم کو اپنا شاگرد بتانا جبکہ وہ نہ ہو، اور اسماء بنت ابی بکر کی بخاری میں روایت کردہ حدیث پر انحصار کیا کہ جو چیز نہ ملی ہو اس پر فخر کرنے والا جھوٹ کے دو کپڑے پہننے والے کی طرح ہے۔ اس نے نتیجہ نکالا کہ میڈیا بیانات میں اور ہر حال میں جھوٹ حرام ہے، چاہے طلبہ کی طرف سے ہو یا پلیٹ فارم مالکان کی طرف سے، اور ادا شدہ معاوضے کے بدلے ہو تو گناہ بڑھ جاتا ہے۔"
