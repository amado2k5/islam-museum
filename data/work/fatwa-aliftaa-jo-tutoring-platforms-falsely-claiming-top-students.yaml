id: work/fatwa-aliftaa-jo-tutoring-platforms-falsely-claiming-top-students
class: work
kind: fatwa
label: { ar: "ادعاء منصات تعليمية أن طلابًا متفوقين درسوا عندها", en: "Tutoring platforms falsely claiming top students studied with them", ur: "تعلیمی پلیٹ فارمز کا جھوٹا دعویٰ کہ نمایاں طلبہ ان کے ہاں پڑھے", es: "Plataformas de tutoría que afirman falsamente que los mejores estudiantes estudiaron con ellas.", fr: "Des plateformes de tutorat prétendent faussement que les meilleurs élèves ont étudié avec elles" }
summary:
  ar: "سؤال عن ادعاء منصات تعليمية أن طلابًا متفوقين درسوا عندها، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذا كذب وتدليس محرم، سواء صدر من الطلبة أو من ملاك المنصات، ويزداد الإثم إذا كان بمقابل مادي. أجابت الدائرة بأن على المسلم التزام الصدق في أقواله وأفعاله وجميع أحواله، واستشهدت بآية الأمر بالكون مع الصادقين في [[passage/quran-9-119|سورة التوبة 9:119]]. وقالت إن الكذب والغش لتحصيل مكاسب دنيوية من عظائم الذنوب، واستندت إلى حديث رواه البخاري في أن من غش فليس منا، وإلى آية اجتناب قول الزور في [[passage/quran-22-30|سورة الحج 22:30]]، وعدّت المال المأخوذ مقابل التصريحات الكاذبة سحتًا محرمًا وأكلًا لأموال الناس بالباطل. وأضافت أنه يحرم على أصحاب المنصات أن ينسبوا لأنفسهم ما ليس فيهم، كادعاء أن طالبًا متفوقًا من طلابهم وهو ليس كذلك، واستندت إلى حديث أسماء بنت أبي بكر الذي رواه البخاري في أن المتشبع بما لم يُعط كلابس ثوبي زور. وخلصت إلى تحريم الكذب في التصريحات الإعلامية وفي كل حال، سواء كان من الطلبة أو من ملاك المنصات، وأن الإثم يزداد إذا كان بمقابل مادي مدفوع."
  en: "A question about tutoring platforms falsely claiming top students studied with them, in which Jordan's General Iftaa Department answered that this is forbidden lying and deception, whether it comes from the students or the platform owners, and that the sin is greater when it is paid for. The Department answered that a Muslim must hold to truthfulness in word, deed and every circumstance, citing the verse commanding believers to be with the truthful in [[passage/quran-9-119|Surat al-Tawba 9:119]]. It said that lying and cheating to obtain worldly gain are among the gravest sins, relying on a hadith reported by al-Bukhari that whoever cheats is not one of us and on the verse commanding avoidance of false speech in [[passage/quran-22-30|Surat al-Hajj 22:30]], and it counted money taken in return for false statements as forbidden gain (suht) and as consuming people's wealth wrongfully. It added that platform owners may not attribute to themselves what is not theirs, such as claiming a top student as one of their own when he is not, relying on the hadith of Asma bint Abi Bakr reported by al-Bukhari that one who boasts of what he was not given is like one wearing two garments of falsehood. It concluded that lying in media statements, and in every circumstance, is forbidden, whether by students or by platform owners, and that the sin is greater when it is done for payment."
  ur: "تعلیمی پلیٹ فارمز کا جھوٹا دعویٰ کہ نمایاں طلبہ ان کے ہاں پڑھے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ حرام جھوٹ اور فریب ہے، چاہے طلبہ کی طرف سے ہو یا پلیٹ فارم مالکان کی طرف سے، اور معاوضے کے بدلے ہو تو گناہ بڑھ جاتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر اپنے قول، عمل اور ہر حال میں سچائی لازم ہے، اور سچوں کے ساتھ رہنے کے حکم والی آیت [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا۔ اس نے کہا کہ دنیاوی فائدے کے لیے جھوٹ اور دھوکا بڑے گناہوں میں سے ہیں، اور بخاری کی روایت کردہ اس حدیث پر انحصار کیا کہ جو دھوکا دے وہ ہم میں سے نہیں، اور جھوٹی بات سے بچنے کے حکم والی آیت [[passage/quran-22-30|سورۃ الحج 22:30]] پر، اور جھوٹے بیانات کے بدلے لیے گئے مال کو حرام کمائی ⁦(سحت)⁩ اور لوگوں کا مال ناحق کھانا قرار دیا۔ اس نے مزید کہا کہ پلیٹ فارم مالکان کے لیے اپنی طرف وہ بات منسوب کرنا حرام ہے جو ان میں نہیں، جیسے کسی نمایاں طالب علم کو اپنا شاگرد بتانا جبکہ وہ نہ ہو، اور اسماء بنت ابی بکر کی بخاری میں روایت کردہ حدیث پر انحصار کیا کہ جو چیز نہ ملی ہو اس پر فخر کرنے والا جھوٹ کے دو کپڑے پہننے والے کی طرح ہے۔ اس نے نتیجہ نکالا کہ میڈیا بیانات میں اور ہر حال میں جھوٹ حرام ہے، چاہے طلبہ کی طرف سے ہو یا پلیٹ فارم مالکان کی طرف سے، اور ادا شدہ معاوضے کے بدلے ہو تو گناہ بڑھ جاتا ہے۔"
  es: "Una pregunta sobre plataformas de tutoría que afirman falsamente que los mejores estudiantes estudiaron con ellas, a lo que el Departamento General de Iftaa de Jordania respondió que esto es mentira y engaño prohibidos, ya sea que provenga de los estudiantes o de los dueños de la plataforma, y que el pecado es mayor cuando se paga por ello. El Departamento respondió que un musulmán debe aferrarse a la veracidad en palabra, obra y en toda circunstancia, citando el versículo que ordena a los creyentes estar con los veraces en [[passage/quran-9-119|Surat al-Tawba 9:119]]. Dijo que mentir y engañar para obtener ganancias mundanas se encuentran entre los pecados más graves, basándose en un hadiz reportado por al-Bukhari que dice que quien engaña no es de los nuestros y en el versículo que ordena evitar el discurso falso en [[passage/quran-22-30|Surat al-Hajj 22:30]], y consideró el dinero recibido a cambio de declaraciones falsas como ganancia prohibida (suht) y como consumo indebido de la riqueza de las personas. Añadió que los propietarios de plataformas no pueden atribuirse lo que no les pertenece, como por ejemplo, reclamar a un estudiante destacado como propio cuando no lo es, basándose en el hadiz de Asma bint Abi Bakr, narrado por al-Bujari, que dice que quien se jacta de lo que no le fue dado es como quien viste dos vestiduras falsas. Concluyó que mentir en declaraciones a los medios, y en cualquier circunstancia, está prohibido, ya sea por parte de los estudiantes o de los propietarios de plataformas, y que el pecado es mayor cuando se hace a cambio de dinero."
  fr: "Une question concernant des plateformes de tutorat prétendant faussement avoir accueilli des élèves brillants a été posée. Le Département général de la Iftaa de Jordanie a répondu que cela constitue un mensonge et une tromperie interdits, que ce soit de la part des élèves ou des propriétaires des plateformes, et que le péché est d'autant plus grave lorsqu'il est rémunéré. Le Département a affirmé qu'un musulman doit s'en tenir à la vérité en paroles, en actes et en toutes circonstances, citant le verset enjoignant aux croyants de se lier aux véridiques (Sourate At-Tawba 9:119). Il a déclaré que le mensonge et la tricherie dans un but lucratif figurent parmi les péchés les plus graves, s'appuyant sur un hadith rapporté par al-Bukhari selon lequel quiconque triche n'est pas des nôtres et sur le verset enjoignant d'éviter le mensonge (Sourate Al-Hajj 22:30). Il a considéré l'argent reçu en échange de fausses déclarations comme un gain illicite (suht) et comme une consommation abusive des biens d'autrui. Il a été ajouté que les propriétaires de plateformes ne peuvent s'attribuer ce qui ne leur appartient pas, comme par exemple prétendre qu'un étudiant brillant est l'un des leurs alors qu'il ne l'est pas. Cette affirmation s'appuie sur le hadith d'Asma bint Abi Bakr, rapporté par al-Bukhari, selon lequel celui qui se vante de ce qu'il n'a pas reçu est comme celui qui porte deux vêtements de mensonge. Il a été conclu que le mensonge dans les médias, et en toute circonstance, est interdit, que ce soit par les étudiants ou par les propriétaires de plateformes, et que le péché est plus grave lorsqu'il est commis contre rémunération."
