id: work/fatwa-amja-habitual-joining-pharmacist
class: work
kind: fatwa
label: { ar: "الجمع بلا عذر عادة", en: "A pharmacist joining prayers routinely — concessions are not habit", ur: "ادائیہ کار کا معمولی جمع — رخصت عادت نہیں", es: "Un farmacéutico que participa en las oraciones de forma rutinaria: las concesiones no son un hábito.", fr: "Un pharmacien qui participe régulièrement aux prières — les concessions ne sont pas une habitude", tr: "Bahanesiz toplama genellikle", id: "Mengumpulkan tanpa alasan biasanya" }
summary:
  ar: "سأل صيدلي بدأ العمل في صيدلية عن جواز الجمع بين الصلاتين لعمله. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86601 بتاريخ 18 مارس 2012)⁩ أن الله جعل الصلاة على المؤمنين كتابًا موقوتًا والجمع في غير عذر شرعي من سفر أو مرض أو مطر لا يجوز أن يتخذ عادة ولكن إن حدث في بعض الأحيان رفعًا للحرج فلا بأس على ما فصّل الجواب."
  en: "A pharmacist starting work at a pharmacy asked about joining the two prayers for his job. AMJA's fatwa committee (fatwa no. 86601, 18 March 2012) answered that God made the prayer on believers a timed ordinance; joining without a legal excuse — travel, illness or rain — must not become a habit, though its occasional happening to lift hardship is unobjectionable — as the answer details."
  ur: "ملازمت کی وجہ سے جمع؟ لجنة الفتوى ⁦(فتویٰ 86601، 18 مارچ 2012)⁩ کے مطابق بلا عذر عادت بنانا جائز نہیں؛ کبھی حرج میں جائز۔"
  es: "Un farmacéutico que comenzaba a trabajar en una farmacia preguntó sobre la posibilidad de realizar ambas oraciones para su trabajo. El comité de fatuas de AMJA (fatua n.° 86601, 18 de marzo de 2012) respondió que Dios estableció la oración para los creyentes como una ordenanza temporal; realizarla sin una excusa legal —viaje, enfermedad o lluvia— no debe convertirse en un hábito, aunque hacerlo ocasionalmente para aliviar dificultades es aceptable, como se detalla en la respuesta."
  fr: "Un pharmacien qui commençait à travailler dans une officine a demandé s'il était autorisé à accomplir les deux prières obligatoires pour son travail. Le comité des fatwas de l'AMJA (fatwa n° 86601, 18 mars 2012) a répondu que Dieu avait prescrit la prière aux croyants selon un calendrier précis; l'accomplir sans motif valable – voyage, maladie ou pluie – ne doit pas devenir une habitude, même si son accomplissement occasionnel pour soulager une difficulté est permis, comme le précise la réponse."
  tr: "Eczanede çalışmaya başlayan bir eczacı, iki namazın bir araya getirilmesinin işi için uygunluğunu sordu. Amerika İslami Hukukçular Meclisi'ndeki Fetva Komitesi (18 Mart 2012 tarihli Fetva No. 86601), Allah'ın müminler üzerine namaz kılmayı sabit bir kitap haline getirdiğini ve seyahat, hastalık veya yağmur gibi geçerli yasal bir sebep olmadan namazları birleştirmenin bir adet olmadığını yanıtladı. Ancak bazen zorlukları gidermek için bir şey yapılırsa, cevapta detaylandırılanların zararı yoktur."
  id: "Seorang apoteker yang mulai bekerja di apotek menanyakan tentang kelayakan menggabungkan kedua shalat tersebut untuk pekerjaannya. Komite Fatwa di Majelis Ahli Hukum Islam di Amerika (Fatwa No. 86601 tanggal 18 Maret 2012) menanggapi bahwa Allah telah menjadikan doa kepada umat beriman sebagai kitab tetap, dan menggabungkan doa tanpa alasan hukum yang sah seperti perjalanan, sakit, atau hujan bukanlah kebiasaan. Namun, jika kadang-kadang terjadi untuk menghilangkan kesulitan, tidak ada salahnya dengan apa yang dijelaskan dalam jawaban."
