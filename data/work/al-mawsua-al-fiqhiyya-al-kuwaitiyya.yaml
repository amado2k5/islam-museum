label: { ar: "الموسوعة الفقهية الكويتية", en: "al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya (Kuwaiti Fiqh Encyclopedia)", es: "al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya (Enciclopedia Fiqh de Kuwait)", fr: "al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya (Encyclopédie du Fiqh koweïtien)", ur: "الموسوع الفقہیہ الکویتیہ ⁦(کویتی فقہ انسائیکلوپیڈیا)⁩", tr: "Kuveyt Hukuk Ansiklopedisi", id: "Ensiklopedia Yurisprudensi Kuwait" }
summary:
  ar: "موسوعة فقهية عصرية تصدرها وزارة الأوقاف والشئون الإسلامية في الكويت. ترتب مصطلحات الفقه ألفبائياً، وتعرض في كل مسألة الاتجاهات الفقهية مع أدلتها، وتستوعب التراث الفقهي حتى القرن الثالث عشر الهجري، ولا تشمل التقنينات ولا الترجيح الشخصي ولا المناقشات المذهبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1341}"
  en: "A modern fiqh encyclopedia issued by the Ministry of Awqaf and Islamic Affairs in Kuwait. Its headwords are fiqh terms arranged alphabetically; under each question it sets out the juristic positions with their evidence, and it covers the legal heritage up to the 13th century AH. It excludes codifications, personal preference and sectarian debate."
  es: "Una enciclopedia moderna de fiqh publicada por el Ministerio de Asuntos Islámicos y Awqaf de Kuwait. Sus entradas son términos de fiqh ordenados alfabéticamente; bajo cada pregunta se exponen las posturas jurídicas con sus respectivas evidencias, y abarca el legado legal hasta el siglo XIII d. H. Excluye codificaciones, preferencias personales y debates sectarios."
  fr: "Une encyclopédie moderne de fiqh publiée par le ministère des Awqaf et des Affaires islamiques du Koweït. Ses entrées sont des termes de fiqh classés par ordre alphabétique; chaque question présente les positions juridiques et leurs arguments, et l’ouvrage couvre l’héritage juridique jusqu’au XIIIe siècle de l’Hégire. Il exclut les codifications, les opinions personnelles et les débats sectaires."
  ur: "کویت میں وزارت اوقاف و اسلامی امور کی طرف سے جاری کردہ ایک جدید فقہ کا انسائیکلو پیڈیا۔ اس کے عنوانات حروف تہجی کے لحاظ سے ترتیب دیے گئے فقہ کی اصطلاحات ہیں۔ ہر سوال کے تحت یہ ان کے ثبوت کے ساتھ فقہی مقامات کا تعین کرتا ہے، اور یہ 13ویں صدی ہجری تک کے قانونی ورثے کا احاطہ کرتا ہے۔ اس میں میثاق جمہوریت، ذاتی ترجیحات اور فرقہ وارانہ بحث شامل نہیں ہے۔"
  tr: "Kuveyt Awqaf ve İslam İşleri Bakanlığı tarafından yayımlanan modern bir fıkıh ansiklopedisi. Fıkıh terimlerini alfabetik olarak düzenler, her sayıda fıkıh eğilimlerini kanıtlarıyla birlikte sunar, 13. yüzyıl Hicri'ye kadar olan fıkıh mirasını kapsar ve kodifikasyonlar, kişisel tercih veya mezhepsel tartışmaları içermez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1341}"
  id: "Ensiklopedia firisprudensi modern yang diterbitkan oleh Kementerian Awqaf dan Urusan Islam di Kuwait. Ensiklopedia ini mengatur istilah-istilah yurisprudensi secara alfabetis, menyajikan tren yurisprudensi beserta buktinya dalam setiap edisi, mencakup warisan yurisprudensi hingga abad ketiga belas H, dan tidak mencakup kodifikasi, preferensi pribadi, atau diskusi sektarian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1326} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1341}"
