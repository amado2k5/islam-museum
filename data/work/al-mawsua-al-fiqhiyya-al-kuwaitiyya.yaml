summary:
  ar: "موسوعة فقهية عصرية تصدرها وزارة الأوقاف والشئون الإسلامية في الكويت. ترتب مصطلحات الفقه ألفبائياً، وتعرض في كل مسألة الاتجاهات الفقهية مع أدلتها، وتستوعب التراث الفقهي حتى القرن الثالث عشر الهجري، ولا تشمل التقنينات ولا الترجيح الشخصي ولا المناقشات المذهبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1341}"
  en: "A modern fiqh encyclopedia issued by the Ministry of Awqaf and Islamic Affairs in Kuwait. Its headwords are fiqh terms arranged alphabetically; under each question it sets out the juristic positions with their evidence, and it covers the legal heritage up to the 13th century AH. It excludes codifications, personal preference and sectarian debate."
