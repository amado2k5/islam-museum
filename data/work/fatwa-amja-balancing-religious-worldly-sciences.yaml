label: { ar: "الموازنة بين علوم الدين وعلوم الدنيا", en: "Balancing religious and worldly sciences", ur: "دینی اور دنیوی علوم میں توازن", es: "Equilibrar las ciencias religiosas y las seculares", fr: "Concilier les sciences religieuses et profanes", tr: "Dini Bilimler ile Dünyevi Bilimlerin Dengelenmesi", id: "Menyeimbangkan Ilmu Agama dan Ilmu Duniawi" }
summary:
  ar: "سائل سأل كيف يوازن بين علوم الدين وعلوم الدنيا. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21824 بتاريخ 14 أكتوبر 2012)⁩ أن من علوم الدين فرض عين يتحتم على كل مسلم — كتعلم ما لا تصح صلاته ولا صومه ولا عباداته إلا به — ويكفيه فيه سؤال من يثق بدينه وعلمه حتى تعبده على بصيرة؛ ومنها فرض كفاية يجب على مجموع الأمة لا على كل فرد — كتفاصيل المواريث ودقائق المعاملات — يجب أن يوجد في الأمة من يحيط بها علمًا؛ وبينت بهذا الوجه كيفية التوفيق بين العلمين."
  en: "A questioner asked how to balance religious and worldly sciences. The Assembly of Muslim Jurists of America (fatwa no. 21824, 14 October 2012) answered that religious sciences divide into individual obligations binding every Muslim — learning what his prayer, fasting and worship cannot be valid without, where asking a trustworthy scholar suffices so he worships with insight — and communal obligations on the umma as a whole, not each person, such as inheritance detail and the fine points of transactions, which must have people in the umma who master them; and it set out on this basis how the two kinds of learning are combined."
  ur: "ایک سائل نے دینی اور دنیوی علوم میں توازن کا طریقہ پوچھا۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21824، 14 اکتوبر 2012)⁩ نے جواب دیا کہ دینی علوم دو قسم کے ہیں: فرضِ عین جو ہر مسلمان پر لازم — وہ علم جس کے بغیر نماز، روزہ اور عبادات صحیح نہیں، جس میں کسی قابلِ اعتماد عالم سے پوچھنا کافی ہے تاکہ عبادت بصیرت سے ہو؛ اور فرضِ کفایہ جو پوری امت پر ہے ہر فرد پر نہیں — جیسے وراثت کی تفصیلات اور معاملات کی باریکیاں — جنہیں امت میں کچھ لوگوں کا سمجھنا لازم ہے؛ اور اسی اساس پر دونوں علوم کے جمع کا طریقہ بیان کیا۔"
  es: "Un interlocutor preguntó cómo equilibrar las ciencias religiosas y las mundanas. La Asamblea de Juristas Musulmanes de América (fatwa n.º 21824, 14 de octubre de 2012) respondió que las ciencias religiosas se dividen en obligaciones individuales que vinculan a todo musulmán —aprender aquello sin lo cual su oración, ayuno y culto no pueden ser válidos, cuando basta con consultar a un erudito de confianza para que pueda adorar con discernimiento— y obligaciones comunitarias para la umma en su conjunto, no para cada persona, como los detalles de la herencia y los pormenores de las transacciones, que deben ser dominados por personas dentro de la umma; y sobre esta base, expuso cómo se combinan ambos tipos de conocimiento."
  fr: "Un internaute a demandé comment concilier sciences religieuses et sciences profanes. L'Assemblée des juristes musulmans d'Amérique (fatwa n° 21824, 14 octobre 2012) a répondu que les sciences religieuses se divisent en obligations individuelles qui incombent à chaque musulman – apprendre ce sans quoi sa prière, son jeûne et son culte ne peuvent être valides, et pour lesquelles consulter un savant digne de confiance suffit afin qu'il puisse pratiquer son culte avec discernement – et en obligations communautaires qui incombent à la umma dans son ensemble, et non à chaque individu, telles que les détails de l'héritage et les subtilités des transactions, qui doivent être maîtrisées par des membres de la umma; et elle a exposé sur cette base la manière dont ces deux types de savoir sont combinés."
  tr: "Bir soru soran kişi, dini bilimlerle dünyevi bilimler arasında nasıl dengeleneceğini sordu. Amerikan Şeriat Hukukçuları Akademisi (Fetva No. 21824, 14 Ekim 2012) dini bilimler arasında her Müslümanın bilmesi gereken özel bir yükümlülük olduğunu yanıtladı—örneğin, dualarının, orucunun veya ibadet eylemlerinin ancak bu aracılığıyla geçerli olduğunu öğrenmek gibi—ve dinine ve bilgisine güvenen birinden O'na içgörüyle ibadet etmesini istemek yeterlidir. Bunlar arasında, miras detayları ve ince işlemler gibi, ulusun içinde onları kapsayan birinin olması gerektiği gibi tüm ulusun değil, kolektif bir yükümlülük vardır. Bu şekilde, iki bilimin nasıl uzlaştırılacağını açıkladı."
  id: "Seorang penanya bertanya bagaimana menyeimbangkan ilmu agama dengan ilmu duniawi. American Academy of Sharia Jurists (Fatwa No. 21824 tanggal 14 Oktober 2012) menjawab bahwa di antara ilmu agama terdapat kewajiban khusus yang harus diketahui setiap Muslim—seperti mempelajari apa yang tidak berlaku dalam doa, puasa, atau ibadahnya kecuali melalui ilmu itu—dan cukup meminta seseorang yang percaya pada agama dan pengetahuannya untuk menyembah-Nya dengan wawasan. Di antaranya adalah kewajiban kolektif yang wajib bagi seluruh bangsa, bukan pada setiap individu—seperti rincian warisan dan transaksi halus—harus ada seseorang dalam bangsa yang mencakup pengetahuan mereka. Dengan cara ini, mereka menjelaskan bagaimana mendamaikan kedua ilmu tersebut."
