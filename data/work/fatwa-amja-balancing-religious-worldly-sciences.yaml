label: { ar: "الموازنة بين علوم الدين وعلوم الدنيا", en: "Balancing religious and worldly sciences", ur: "دینی اور دنیوی علوم میں توازن" }
summary:
  ar: "سائل سأل كيف يوازن بين علوم الدين وعلوم الدنيا. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21824 بتاريخ 14 أكتوبر 2012)⁩ أن من علوم الدين فرض عين يتحتم على كل مسلم — كتعلم ما لا تصح صلاته ولا صومه ولا عباداته إلا به — ويكفيه فيه سؤال من يثق بدينه وعلمه حتى تعبده على بصيرة؛ ومنها فرض كفاية يجب على مجموع الأمة لا على كل فرد — كتفاصيل المواريث ودقائق المعاملات — يجب أن يوجد في الأمة من يحيط بها علمًا؛ وبينت بهذا الوجه كيفية التوفيق بين العلمين."
  en: "A questioner asked how to balance religious and worldly sciences. The Assembly of Muslim Jurists of America (fatwa no. 21824, 14 October 2012) answered that religious sciences divide into individual obligations binding every Muslim — learning what his prayer, fasting and worship cannot be valid without, where asking a trustworthy scholar suffices so he worships with insight — and communal obligations on the umma as a whole, not each person, such as inheritance detail and the fine points of transactions, which must have people in the umma who master them; and it set out on this basis how the two kinds of learning are combined."
  ur: "ایک سائل نے دینی اور دنیوی علوم میں توازن کا طریقہ پوچھا۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21824، 14 اکتوبر 2012)⁩ نے جواب دیا کہ دینی علوم دو قسم کے ہیں: فرضِ عین جو ہر مسلمان پر لازم — وہ علم جس کے بغیر نماز، روزہ اور عبادات صحیح نہیں، جس میں کسی قابلِ اعتماد عالم سے پوچھنا کافی ہے تاکہ عبادت بصیرت سے ہو؛ اور فرضِ کفایہ جو پوری امت پر ہے ہر فرد پر نہیں — جیسے وراثت کی تفصیلات اور معاملات کی باریکیاں — جنہیں امت میں کچھ لوگوں کا سمجھنا لازم ہے؛ اور اسی اساس پر دونوں علوم کے جمع کا طریقہ بیان کیا۔"
