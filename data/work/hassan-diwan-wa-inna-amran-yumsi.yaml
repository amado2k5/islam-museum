label: { ar: "قصيدة حسان «وإن امرأ يمسي ويصبح سالما»", en: "Hassan's poem 'A man who spends evening and morning unharmed'", es: "El poema de Hassan: \"Un hombre que pasa la tarde y la mañana ileso\".", fr: "Le poème de Hassan « Un homme qui passe ses soirées et ses matinées indemne »", ur: "حسن کی نظم 'ایک آدمی جو شام اور صبح بغیر نقصان کے گزارتا ہے'", tr: "Hassan'ın şiiri 'Ve eğer bir insan akşam güvende olursa'", id: "Puisi Hassan 'Dan jika seseorang menjadi aman di malam hari'" }
summary:
  ar: "قصيدة لحسان بن ثابت من الطويل على روي الدال، مطلعها كما في شرح البرقوقي {{cite:sharh-diwan-hassan-barquqi-1929 p.142}}؛ وتذكر الطبعة بحرها في رأسها."
  en: "A poem by Hassan ibn Thabit in the tawil metre on the rhyme الدال, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.142}}."
  es: "Un poema de Hassan ibn Thabit en métrica tawil con rima الدال, como en el comentario de al-Barquqi, que indica la métrica en su título {{cita:sharh-diwan-hassan-barquqi-1929 p.142}}."
  fr: "Un poème de Hassan ibn Thabit au mètre tawil sur la rime الدال, comme dans le commentaire d'al-Barquqi, qui indique le mètre dans son titre {{cite:sharh-diwan-hassan-barquqi-1929 p.142}}."
  ur: "حسن بن ثابت کی نظم الدال پر تاویل میٹر میں، جیسا کہ البرقی کی تفسیر میں ہے، جس کے عنوان {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 142}} میں میٹر بیان کیا گیا ہے۔"
  tr: "Al-Tawil'den Hasan ibn Thabit'in 'dal'ın anlatımı üzerine yazdığı bir şiirdir; başı, al-Barquqi üzerine yapılan yorumdaki gibidir {{cite:sharh-diwan-hassan-barquqi-1929 s.142}}; ve baskıda ölçüsü en üstte belirtilir."
  id: "Sebuah puisi oleh Hassan ibn Thabit dari Al-Tawil tentang narasi 'dal', pembukaannya seperti dalam komentar tentang al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 hlm.142}}; dan edisi tersebut menyebutkan meternya di bagian atas."
