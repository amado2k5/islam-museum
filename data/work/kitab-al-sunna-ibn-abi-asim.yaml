summary:
  ar: "كتاب في العقيدة بالإسناد للحافظ أبي بكر أحمد بن عمرو بن أبي عاصم الشيباني ⁦(ت 287هـ)⁩، يجمع الأحاديث والآثار في أبواب الاعتقاد: ذم الأهواء والبدع، والقدر، والصفات والرؤية، والحوض والميزان والشفاعة وعذاب القبر والبعث، والخوارج والمرجئة والرافضة، والسمع والطاعة، وخلافة الراشدين وفضائل الصحابة؛ طبعه المكتب الإسلامي سنة 1400هـ/1980م مع تخريج الألباني «ظلال الجنة»."
  en: "A book of creed with chains of transmission by the hadith master Abu Bakr Ahmad ibn Amr Ibn Abi Asim al-Shaybani (d. 287 AH), gathering hadiths and reports under the headings of belief: the censure of whims and innovations, destiny, the attributes and the vision of God, the Basin, the Balance, intercession, the punishment of the grave and resurrection, the Kharijites, the Murji'a and the Rafida, hearing and obeying, the caliphate of the rightly guided and the virtues of the Companions; printed by al-Maktab al-Islami in 1400 AH / 1980 with al-Albani's Zilal al-Janna."
