structure: "Part 1 (pp. 5–306): the censure of whims; innovations; the Sunna and the community; the 72 sects; the Pen and destiny, the debate of Moses and Adam, the covenant, children of unbelievers, the Qadariyya; hearts between two fingers of the Merciful; vision of God; God in His heaven; descent; speech; laughter; the Throne; the spirit (contents pp. 307–315). Part 2 (pp. 321–656): the Basin (from p. 321), the Balance (p. 361), intercession (pp. 364–414), the grave and its punishment (pp. 415–425), resurrection (p. 430), those who leave the community (p. 433), the Mariqa, Haruriyya and Kharijites (p. 438), irja' and faith (p. 461), promise and threat (p. 466), the Rafida (p. 474), obedience to rulers and counsel to them (pp. 489–526), the caliphate of the four (pp. 533–566), the virtues of the Companions (pp. 566ff.) (contents pp. 657–687)."
