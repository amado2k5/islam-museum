id: work/fatwa-aliftaa-jo-court-auctions-and-bidder-collusion
class: work
kind: fatwa
label: { ar: "بيع المزايدة القضائي وتواطؤ التجار على السعر", en: "Court auctions and traders colluding on the price", ur: "عدالتی نیلامی اور تاجروں کی قیمت پر ملی بھگت" }
summary:
  ar: "سؤال عن بيع المزايدة القضائي وعن تواطؤ التجار والراغبين في الشراء على سعر معين، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع المزايدة جائز، وللقاضي بيع مال المدين لوفاء غرمائه بشرط أن يكون بالثمن الأنفع للمالك وأن يخلو من التواطؤ على السعر. أجابت الدائرة بأن بيع المزايدة جائز، واستدلت بحديث أنس بن مالك الذي رواه أبو داود في عرض النبي متاع رجل من الأنصار بقوله من يزيد على درهم. وقالت إنه يجوز للقاضي أن يبيع ملك المدين أو المفلس لوفاء غرمائه، بشرط أن يكون البيع الأنفع والأغبط لمصلحة المالك، وأن يخلو من تواطؤ التجار والراغبين في الشراء على سعر معين. ونقلت قول الخطيب الشربيني في مغني المحتاج إنه يندب البيع بحضرة المفلس وغرمائه نفيًا للتهمة، وفي سوق السلعة، مع إشهار بيع العقار، وإنه يجب البيع بثمن المثل فأكثر لأن التصرف للغير تجب فيه رعاية المصلحة. وقالت إن ما يجري في المحاكم اليوم يُترك النظر فيه للقاضي لتحقيق مصلحة المتخاصمين، وخلصت إلى أنه لا حرج في البيع بالمزاد العلني بشرط أن يكون بالثمن الأنفع والأغبط للمالك."
  en: "A question about court-ordered auctions and traders and would-be buyers colluding on a set price, in which Jordan's General Iftaa Department answered that auction sales are permitted, and that a judge may sell a debtor's property to repay his creditors provided the sale achieves the price most beneficial to the owner and is free of collusion on the price. The Department answered that auction sales are permitted, citing the hadith of Anas ibn Malik, reported by Abu Dawud, in which the Prophet offered a man of the Ansar's belongings asking who would bid more than a dirham. It said a judge may sell the property of a debtor or a bankrupt to repay his creditors, provided the sale is the most beneficial and advantageous for the owner and is free of collusion between traders and would-be buyers on a set price. It quoted al-Khatib al-Shirbini in Mughni al-Muhtaj that it is recommended to sell in the presence of the bankrupt and his creditors, to dispel suspicion, and in the goods' own market, publicising sales of real estate, and that the sale must be at the market price or more, since dealing on another's behalf requires regard for his interest. It said that what takes place in today's courts is left to the judge's assessment to secure the litigants' interests, and concluded that public auction is unobjectionable provided it achieves the price most beneficial and advantageous for the owner."
  ur: "عدالتی نیلامی اور تاجروں اور خریداری کے خواہش مندوں کی کسی خاص قیمت پر ملی بھگت کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نیلامی کی بیع جائز ہے، اور قاضی مقروض کا مال اس کے قرض خواہوں کی ادائیگی کے لیے بیچ سکتا ہے بشرطیکہ بیع مالک کے لیے سب سے مفید قیمت پر ہو اور قیمت پر ملی بھگت سے پاک ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ نیلامی کی بیع جائز ہے، اور انس بن مالک کی اس حدیث سے استدلال کیا جسے ابو داود نے روایت کیا، جس میں نبی نے ایک انصاری کا سامان پیش کر کے پوچھا کہ ایک درہم سے زیادہ کون دے گا۔ اس نے کہا کہ قاضی مقروض یا دیوالیہ کا مال اس کے قرض خواہوں کی ادائیگی کے لیے بیچ سکتا ہے، بشرطیکہ بیع مالک کے لیے سب سے مفید اور فائدہ مند ہو اور تاجروں اور خریداروں کی کسی مقررہ قیمت پر ملی بھگت سے خالی ہو۔ اس نے مغنی المحتاج میں خطیب شربینی کا قول نقل کیا کہ تہمت دور کرنے کے لیے دیوالیہ اور اس کے قرض خواہوں کی موجودگی میں، اور سامان کے اپنے بازار میں بیچنا مستحب ہے، جائیداد کی فروخت کی تشہیر کی جائے، اور بیع بازار کی قیمت یا اس سے زیادہ پر لازم ہے، کیونکہ دوسرے کی طرف سے تصرف میں اس کی مصلحت کا لحاظ واجب ہے۔ اس نے کہا کہ آج عدالتوں میں جو ہوتا ہے اس کا جائزہ فریقین کی مصلحت کے لیے قاضی پر چھوڑا جاتا ہے، اور نتیجہ نکالا کہ کھلی نیلامی میں حرج نہیں بشرطیکہ وہ مالک کے لیے سب سے مفید اور فائدہ مند قیمت پر ہو۔"
