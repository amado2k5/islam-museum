id: work/fatwa-aliftaa-jo-agent-paying-zakat-from-his-own-money
class: work
kind: fatwa
label: { ar: "حكم إخراج الوكيل الزكاة من ماله ثم الرجوع على الموكل", en: "An agent paying his principal's zakat from his own money and reclaiming it", ur: "وکیل کا موکل کی زکاۃ اپنے مال سے ادا کر کے بعد میں واپس لینا" }
summary:
  ar: "سؤال عمّا إذا كان يجوز للوكيل أن يدفع زكاة موكله بإذنه من ماله هو ثم يرجع على الموكل بما دفعه، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة عبادة مالية محضة يجوز التوكيل فيها لأن المقصد منها دفع المال، ناقلة عن البجيرمي في تحفة الحبيب تقسيم العبادات إلى بدنية محضة لا يجوز التوكيل فيها ومالية محضة يجوز فيها مطلقًا ومترددة كالحج بشرط، وعن النووي في المجموع أن للمزكي أن يوكّل في صرف الزكاة إلى الإمام أو في التفرقة على الأصناف بلا خلاف، وأنه يجوز التوكيل في دفعها من مال الموكل أو من مال الوكيل بلا خلاف لأنها تشبه قضاء الديون وقد تدعو الحاجة إليها لغيبة المال، وأنه إن أخرجها الوكيل من ماله اشتُرط لإجزائها نيته عند الإخراج ولا تكفي نية الموكل كما قال ابن حجر الهيتمي في تحفة المحتاج، وخلصت إلى جواز توكيل المزكي غيره في إخراج زكاته وإخراج الوكيل لها من ماله ثم رجوعه بما دفعه على المزكي بشرط نية الوكيل عند الإخراج."
  en: "A question whether an agent may pay his principal's zakat, with the principal's permission, out of his own money and then reclaim what he paid; Jordan's General Iftaa Department answered that zakat is a purely financial act of worship in which agency is permitted because its purpose is the payment of property, quoting al-Bujayrimi in Tuhfat al-Habib on the division of acts of worship into purely bodily ones in which agency is barred, purely financial ones in which it is allowed without restriction, and mixed ones such as hajj in which it is allowed on condition, and al-Nawawi in al-Majmu that the zakat payer may appoint an agent to hand it to the ruler or to distribute it to the eligible categories, without disagreement, and that agency to pay it from the principal's money or from the agent's own is permitted without disagreement, since it resembles the settling of debts and need may call for it when the property is absent; if the agent pays from his own money, his intention at the time of payment is required for it to count and the principal's intention does not suffice, as Ibn Hajar al-Haytami says in Tuhfat al-Muhtaj. It concluded that the zakat payer may appoint another to pay his zakat, that the agent may pay it from his own money and then reclaim what he paid from the payer, on condition of the agent's intention at the time of payment."
  ur: "اس بارے میں سوال کہ کیا وکیل موکل کی اجازت سے اس کی زکاۃ اپنے مال سے ادا کر کے بعد میں ادا کی گئی رقم موکل سے واپس لے سکتا ہے؛ اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ زکاۃ خالص مالی عبادت ہے جس میں وکالت جائز ہے کیونکہ اس کا مقصد مال ادا کرنا ہے، بجیرمی کی تحفۃ الحبیب سے عبادات کی اس تقسیم کو نقل کرتے ہوئے کہ خالص بدنی عبادات میں وکالت ممنوع ہے، خالص مالی میں مطلقاً جائز ہے، اور حج جیسی ملی جلی میں شرط کے ساتھ جائز ہے، اور نووی کی المجموع سے کہ زکاۃ دینے والا امام تک پہنچانے یا مستحق اصناف میں تقسیم کے لیے بلا اختلاف وکیل بنا سکتا ہے، اور موکل کے مال سے یا وکیل کے اپنے مال سے ادائیگی کی وکالت بلا اختلاف جائز ہے کیونکہ یہ قرضوں کی ادائیگی سے مشابہ ہے اور مال کی غیر موجودگی میں اس کی ضرورت پیش آ سکتی ہے؛ اگر وکیل اپنے مال سے ادا کرے تو اس کے شمار ہونے کے لیے ادائیگی کے وقت وکیل کی نیت شرط ہے اور موکل کی نیت کافی نہیں، جیسا کہ ابن حجر ہیتمی نے تحفۃ المحتاج میں کہا۔ اس نے نتیجہ نکالا کہ زکاۃ دینے والا اپنی زکاۃ کی ادائیگی کے لیے دوسرے کو وکیل بنا سکتا ہے، وکیل اسے اپنے مال سے ادا کر کے ادا کی گئی رقم زکاۃ دینے والے سے واپس لے سکتا ہے، ادائیگی کے وقت وکیل کی نیت کی شرط کے ساتھ۔"
