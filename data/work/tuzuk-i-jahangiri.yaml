  ar: "مذكرات الإمبراطور جهانگير بالفارسية، كتبها بنفسه من جلوسه إلى السنة التاسعة عشرة من حكمه (1605–1624م)، وأتم معتمد خان السنتين الأخيرتين، وهي مصدر أساسي لذوقه في التصوير وأحكامه على مصوريه {cite:beach-grand-mogul-1978 p. 58}."
  en: "The Persian memoirs of the emperor Jahangir, written by him from his accession to the nineteenth year of his reign (1605–24), the last two years written out by Mu'tamad Khan; a key source for his taste in painting and his judgements of his painters {cite:beach-grand-mogul-1978 p. 58}."
