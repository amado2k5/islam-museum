id: work/fatwa-iifa-236-religious-education-peace
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 236 (24/7) بشأن دور التربية الدينية في تعزيز السلام", en: "IIFA resolution 236 (24/7) on the role of religious education in strengthening peace", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 236 (24/7): امن کی مضبوطی میں مذہبی تربیت کا کردار", es: "Resolución 236 (24/7) de la IIFA sobre el papel de la educación religiosa en el fortalecimiento de la paz.", fr: "Résolution 236 (24/7) de l'IIFA sur le rôle de l'éducation religieuse dans le renforcement de la paix" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩، بعد اطلاعه على توصيات الندوة العلمية الدولية ⁦«دور التربية الدينية في تعزيز السلام»⁩ التي عقدها المجمع بالرباط بالتعاون مع إيسيسكو ⁦(17–18 شعبان 1440هـ، 23–24 أبريل 2019م)⁩. أصدر المجمع عشرين بندًا منها: الاهتمام بالقرآن والسنة وتعزيز الاستفادة من المنهج التربوي المستمد منهما؛ مواصلة المؤتمرات والندوات والملتقيات الدولية للحوار للتعريف بالثقافة الوسطية الإسلامية؛ تشكيل الدول الأعضاء لجانًا لدراسة مناهج التعليم الديني وتضمينها قيم السلام والحوار والتعايش؛ تضمين التربية على السلام في المناهج؛ التركيز على تكريم الله للإنسان من حيث هو إنسان له الحق في الحياة الكريمة والتعليم والصحة؛ إبراز المهارات والمفاهيم المعززة للقيم الدينية السمحة والوطنية؛ نشر برامج تعليم العربية للناطقين بغيرها؛ نشر مناهج التربية بالوسائط الحديثة لتصحيح الصورة عن الإسلام والمسلمين؛ الشراكة بين علماء الدين والمختصين التربويين في إعداد المناهج؛ التنسيق بين الإعلام والمؤسسات التربوية والدعوية لتعزيز الهوية واحترام الرأي الآخر؛ تطوير تكوين المرشدين الدينيين؛ التأهيل المستمر لمدرس التربية الدينية؛ تطوير طرائق التدريس وترسيخ قيم الحوار والمناظرة؛ إعداد دراسات تأصيلية في التربية على الوسطية وترجمتها؛ إنشاء مراكز بحثية للرد الشرعي على دعوات الغلو والتكفير والإلحاد؛ تنظيم ندوات في استثمار التواصل الاجتماعي لقيم السلم والاعتدال؛ تعزيز ثقافة السلام في برامج التعليم الديني؛ الاهتمام بتدريس الفقه المقارن ومقارنة الأديان بما يبرز مرونة الشريعة وقبول الآخر؛ تطوير مناهج التعليم الديني؛ وإبراز المفاهيم الصحيحة بشأن المرأة في الإسلام وإدراجها في المناهج."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019), after reviewing the recommendations of the international scholarly seminar 'The Role of Religious Education in Strengthening Peace' it held in Rabat with ICESCO (17–18 Sha'ban 1440, 23–24 April 2019). It issued twenty clauses, including: attention to the Quran and Sunnah and the educational method drawn from them; continuing conferences, seminars and international dialogue forums to present the moderate Islamic culture; member states forming committees to study religious-education curricula and imbue them with the values of peace, dialogue and coexistence; including education for peace in curricula; stressing God's honouring of the human being as human, with the right to a dignified life, education and health; highlighting skills and concepts that reinforce tolerant religious and national values; spreading Arabic-language programmes for non-speakers; publishing educational curricula through modern media to correct the image of Islam and Muslims; partnership between scholars of religion and educational specialists in preparing curricula; coordination between media, educational, outreach, cultural and youth institutions to strengthen identity, national belonging and respect for other opinions; developing the training of religious counsellors; continuous in-service qualification of religious-education teachers; developing teaching methods suited to the knowledge-media generation and entrenching the values of dialogue and debate; preparing and translating foundational studies on education for moderation; establishing research centres to answer the calls of extremism, takfir and atheism and refute them in the sharia; seminars on using social media for the values of peace and moderation; strengthening a culture of peace in religious-education programmes; teaching comparative jurisprudence and comparative religion in a way that shows the sharia's flexibility and acceptance of the other; developing religious-education curricula; and presenting the correct concepts regarding women in Islam and including them in curricula."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں، رباط میں آئیسکو کے تعاون سے ہونے والی بین الاقوامی علمی ندوات ⁦(«امن کی مضبوطی میں مذہبی تربیت کا کردار»، 17–18 شعبان 1440ھ، 23–24 اپریل 2019ء)⁩ کی سفارشات کے جائزے کے بعد۔ اس نے بیس شقیں جاری کیں جن میں شامل ہیں: قرآن و سنت اور ان سے ماخوذ تربیتی منہج پر توجہ؛ وسطی اسلامی ثقافت کے تعارف کے لیے کانفرنسوں، ندواتوں اور مکالماتی ملتقیوں کا تسلسل؛ رکن ممالک میں مذہبی تعلیم کے نصابوں کا مطالعہ اور ان میں امن، مکالمہ اور بقائے باہمی کی اقدار کی شمولیت کے لیے کمیٹیاں؛ نصابوں میں امن کی تربیت؛ انسان کی انسان ہونے کی حیثیت سے تکریم اور باوقار زندگی، تعلیم اور صحت کے حق پر زور؛ روادار دینی و وطنی اقدار کو مضبوط کرنے والی مہارتوں اور تصورات کو اجاگر کرنا؛ غیر عربی بولنے والوں کے لیے عربی تعلیمی پروگرام؛ جدید ذرائع ابلاغ سے تربیتی نصابوں کی نشریات تاکہ اسلام و مسلمانوں کی تصویر درست ہو؛ نصاب کی تیاری میں دینی علماء اور تربیتی ماہرین کی شراکت؛ ذرائع ابلاغ اور تعلیمی، دعوتی، ثقافتی و نوجوان اداروں کا رابطہ برائے مذہبی و ثقافتی شناخت اور مخالف رائے کے احترام؛ مذہبی مرشدین کی تربیت کی تیاری؛ مذہبی تربیت کے مدرس کی مسلسل اہلیت؛ علمگاہ میڈیا کی نسل کے مطابق تدریسی طریقوں کی بہتری اور مکالمہ و مناظرہ کی اقدار؛ اعتدال کی تربیت پر بنیادی مطالعے اور ان کے تراجم؛ تحقیقی مراکز کا قیام جو غلو، تکفیر اور الحاد کی دعوتوں کا شرعی رد کریں؛ سوشل میڈیا کو امن و اعتدال کی اقدار کے لیے استعمال کرنے پر ندواتیں؛ مذہبی تعلیمی پروگراموں میں امن کی ثقافت؛ تقابلی فقہ اور تقابلِ ادیان کی تدریس جو شریعت کی لچک اور دوسرے کی قبولیت دکھائے؛ مذہبی تعلیم کے نصاب کی بہتری؛ اور اسلام میں عورت کے صحیح تصورات کو اجاگر کر کے نصاب میں شامل کرنا۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019), tras revisar las recomendaciones del seminario académico internacional \"El papel de la educación religiosa en el fortalecimiento de la paz\" que celebró en Rabat con ICESCO (17-18 Sha'ban 1440, 23-24 de abril de 2019). Emitió veinte cláusulas, entre ellas: atención al Corán y la Sunnah y al método educativo derivado de ellos; continuación de conferencias, seminarios y foros de diálogo internacional para presentar la cultura islámica moderada; formación de comités de los Estados miembros para estudiar los planes de estudio de educación religiosa e infundirles los valores de paz, diálogo y coexistencia; inclusión de la educación para la paz en los planes de estudio; énfasis en el honor de Dios al ser humano como tal, con derecho a una vida digna, educación y salud; resaltando habilidades y conceptos que refuerzan los valores religiosos y nacionales tolerantes; difusión de programas en lengua árabe para no hablantes; Publicar planes de estudio educativos a través de los medios de comunicación modernos para corregir la imagen del Islam y de los musulmanes; colaborar entre académicos de la religión y especialistas en educación en la elaboración de planes de estudio; coordinar entre instituciones de medios de comunicación, educativas, de divulgación, culturales y juveniles para fortalecer la identidad, el sentido de pertenencia nacional y el respeto por otras opiniones; desarrollar la formación de consejeros religiosos; cualificación continua en servicio de los profesores de educación religiosa; desarrollar métodos de enseñanza adecuados a la generación del conocimiento y los medios de comunicación, y afianzar los valores del diálogo y el debate; preparar y traducir estudios fundamentales sobre educación para la moderación; establecer centros de investigación para responder a los llamamientos del extremismo, el takfir y el ateísmo y refutarlos en la sharia; seminarios sobre el uso de las redes sociales para los valores de la paz y la moderación; fortalecer una cultura de paz en los programas de educación religiosa; enseñar jurisprudencia comparada y religión comparada de manera que se muestre la flexibilidad de la sharia y la aceptación del otro; desarrollar planes de estudio de educación religiosa; y presentar los conceptos correctos sobre las mujeres en el Islam e incluirlas en los planes de estudio."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019), après examen des recommandations du séminaire international « Le rôle de l'éducation religieuse dans le renforcement de la paix » organisé à Rabat avec l'ICESCO (17-18 Sha'ban 1440, 23-24 avril 2019), a édicté vingt articles, dont: l'importance accordée au Coran et à la Sunna et à la méthode pédagogique qui en découle; la poursuite des conférences, séminaires et forums de dialogue internationaux pour promouvoir une culture islamique modérée; la mise en place, par les États membres, de comités chargés d'étudier les programmes d'éducation religieuse et de les imprégner des valeurs de paix, de dialogue et de coexistence; l'intégration de l'éducation à la paix dans les programmes scolaires; la mise en avant du respect de l'être humain par Dieu, avec son droit à une vie digne, à l'éducation et à la santé; la valorisation des compétences et des concepts qui renforcent les valeurs religieuses et nationales de tolérance; et la diffusion de programmes en langue arabe pour les non-arabophones. Publication de programmes d'enseignement via les médias modernes pour corriger l'image de l'islam et des musulmans; partenariat entre spécialistes des religions et de l'éducation pour l'élaboration des programmes; coordination entre les médias, les institutions éducatives, de sensibilisation, culturelles et de jeunesse pour renforcer l'identité, le sentiment d'appartenance nationale et le respect des opinions divergentes; développement de la formation des conseillers religieux; formation continue des enseignants d'éducation religieuse; élaboration de méthodes pédagogiques adaptées à la génération numérique et ancrage des valeurs de dialogue et de débat; préparation et traduction d'études fondamentales sur l'éducation à la modération; création de centres de recherche pour répondre aux appels à l'extrémisme, au takfir et à l'athéisme et les réfuter au regard de la charia; séminaires sur l'utilisation des médias sociaux pour promouvoir les valeurs de paix et de modération; renforcement d'une culture de paix dans les programmes d'éducation religieuse; enseignement de la jurisprudence comparée et des religions comparées de manière à démontrer la flexibilité et l'acceptation de l'autre par la charia; élaboration de programmes d'éducation religieuse; et présentation d'une vision juste de la place de la femme en islam et son intégration dans les programmes."
