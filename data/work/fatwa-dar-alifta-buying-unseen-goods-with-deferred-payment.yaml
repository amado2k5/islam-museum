id: work/fatwa-dar-alifta-buying-unseen-goods-with-deferred-payment
class: work
kind: fatwa
label: { ar: "حكم عدم رؤية السلعة قبل الشراء، مع تأجيل دفع الثمن ليوم التسليم", en: "Buying goods unseen, with payment deferred to the day of delivery", ur: "خریداری سے پہلے سامان نہ دیکھنا اور قیمت کی ادائیگی حوالگی کے دن تک مؤخر کرنا" }
summary:
  ar: "سؤال عن رجل اشترى من أخيه هاتفيًا شاشة عرض لم يرها، على أن يرسلها إليه في موعد محدد ويسلمه الثمن حينها، وقيل له إن البيع غير صحيح لعدم رؤية الشاشة، أجابت فيه دار الإفتاء المصرية بأن شراء الشاشة المعينة المحددة بأوصاف نافية للجهالة الغائبة عن مجلس العقد من قبيل بيع العين المعينة الغائبة، وهو جائز شرعًا مع ثبوت الخيار عند الرؤية، ولا مانع من تأجيل الثمن إلى يوم التسليم فهو بيع عين بدين. بيّنت الدار أن البيع يرد على عين مشاهدة أو عين معينة غائبة أو موصوف في الذمة كالسلم، وأن جمهور الحنفية والمالكية والشافعية في قول والحنابلة في رواية أجازوا بيع العين الغائبة مع خيار الرؤية للمشتري، لعموم آية إحلال البيع ولحديث من اشترى شيئًا لم يره فهو بالخيار إذا رآه، ولما رُوي من تبايع عثمان وطلحة داريهما وتحكيم جبير بن مطعم، ناقلة عن البابرتي والمرغيناني والعيني والدردير والنووي وابن قدامة والمرداوي، وذكرت أن الشافعية في الأظهر والحنابلة في رواية منعوه للنهي عن بيع الغرر. ورجّحت للفتوى قول الجمهور لأن المدار على حصول العلم بالمبيع على وجه تنتفي معه الجهالة، وهو يتحقق بالوصف المنضبط كما يتحقق بالمشاهدة، وأن ما قد يوجد من غرر هنا يسير معفو عنه إجماعًا للحاجة كما قال الدردير والنووي وابن مفلح، ثم أجازت تأجيل الثمن إلى أجل معلوم أو يوم التسليم بإجماع نقله ابن المنذر ونصوص ابن عابدين والماوردي."
  en: "A question from a man who bought from his brother, by telephone, a display screen he had not seen, on the understanding that the brother would send it on a set date and be paid on delivery, and who was told the sale was invalid because he had not seen the screen; Dar al-Ifta al-Misriyya answered that buying a specific screen, identified by descriptions that remove uncertainty, while it is absent from the place of contract is a sale of an identified absent object, which is permissible in sharia with the buyer's option on seeing it, and that deferring the price to the day of delivery is unobjectionable, being a sale of an object for a deferred price. Dar al-Ifta explained that a sale may concern a present object seen by both parties, a specific absent object, or a described object owed as in salam; that the majority of Hanafis, Malikis, Shafi'is in one view and Hanbalis in one report allow the sale of an absent object with the buyer's option on seeing it, on the strength of the general verse permitting sale, the hadith that whoever buys something he has not seen has a choice when he sees it, and the report of Uthman and Talha exchanging houses with Jubayr ibn Mut'im as arbiter, quoting al-Babarti, al-Marghinani, al-Ayni, al-Dardir, al-Nawawi, Ibn Qudama and al-Mardawi, while the Shafi'is in their more evident view and the Hanbalis in one report forbid it because of the prohibition of sales involving gharar. It preferred the majority view for the fatwa, since what matters is knowledge of the goods sufficient to remove the uncertainty that leads to dispute, which a precise description achieves as well as inspection does, and any gharar here is slight and excused by consensus for need, as al-Dardir, al-Nawawi and Ibn Muflih say; it then allowed deferral of the price to a known date or the day of delivery by the consensus reported by Ibn al-Mundhir and the statements of Ibn Abidin and al-Mawardi."
  ur: "ایک شخص کا سوال جس نے اپنے بھائی سے فون پر ایک ایسی ڈسپلے سکرین خریدی جو اس نے نہیں دیکھی تھی، اس شرط پر کہ بھائی مقررہ تاریخ پر اسے بھیجے گا اور حوالگی پر قیمت لے گا، اور اسے بتایا گیا کہ سکرین نہ دیکھنے کی وجہ سے بیع درست نہیں؛ دار الافتاء مصر نے جواب دیا کہ جہالت دور کرنے والے اوصاف سے متعین مخصوص سکرین کو مجلسِ عقد سے غائب حالت میں خریدنا بیع عینِ غائب ہے، جو شرعاً جائز ہے خریدار کے دیکھنے پر خیار کے ساتھ، اور قیمت کو حوالگی کے دن تک مؤخر کرنے میں کوئی رکاوٹ نہیں، کیونکہ یہ عین کی قرض کے عوض بیع ہے۔ دار الافتاء نے بیان کیا کہ بیع یا تو فریقین کی دیکھی ہوئی موجود عین پر ہوتی ہے، یا مجلسِ عقد سے غائب متعین عین پر، یا ذمے میں موصوف چیز پر جیسے سلم میں؛ حنفیہ، مالکیہ، ایک قول میں شافعیہ اور ایک روایت میں حنابلہ کا جمہور خریدار کے دیکھنے پر خیار کے ساتھ غائب عین کی بیع کو جائز سمجھتا ہے، بیع کی حلت کی عام آیت، اس حدیث کہ جس نے بن دیکھی چیز خریدی اسے دیکھنے پر اختیار ہے، اور عثمان اور طلحہ کے گھروں کے تبادلے اور جبیر بن مطعم کے فیصلے کی روایت کی بنا پر، بابرتی، مرغینانی، عینی، دردیر، نووی، ابن قدامہ اور مرداوی سے نقل کرتے ہوئے، جبکہ شافعیہ اظہر قول میں اور حنابلہ ایک روایت میں غرر کی بیع کی ممانعت کی وجہ سے اسے منع کرتے ہیں۔ اس نے فتوے کے لیے جمہور کے قول کو ترجیح دی، کیونکہ مدار مبیع کے ایسے علم پر ہے جس سے جھگڑے تک پہنچانے والی جہالت دور ہو، جو درست وصف سے بھی حاصل ہوتا ہے جیسے دیکھنے سے، اور یہاں جو غرر ہو سکتا ہے وہ معمولی ہے جو حاجت کی بنا پر بالاجماع معاف ہے جیسا کہ دردیر، نووی اور ابن مفلح نے کہا؛ پھر اس نے ابن المنذر کے نقل کردہ اجماع اور ابن عابدین اور ماوردی کے اقوال کی بنا پر قیمت کو معلوم مدت یا حوالگی کے دن تک مؤخر کرنے کی اجازت دی۔"
