summary:
  ar: "لسان العرب لابن منظور، معجم كبير للغة العربية فرغ منه مؤلفه في ٢٢ ذي الحجة ٦٨٩هـ، الموافق ٢٦ ديسمبر ١٢٩٠م. ذكر في مقدمته أنه جمع فيه خمسة مصادر أصلية هي تهذيب اللغة للأزهري والمحكم لابن سيده والصحاح للجوهري والتنبيه والإيضاح لابن بري والنهاية لابن الأثير، وأنه فعل ذلك لحفظ العربية لغة القرآن والسنة. ورتّب مواده على طريقة الصحاح: الباب للحرف الأخير من الأصل والفصل للحرف الأول، مع ترتيب الحرف الأوسط هجائياً. طُبع أول مرة في بولاق بين ١٨٨٣ و١٨٨٩م في عشرين جزءاً مجلّدة في عشرة مجلدات، بحسب فهرس المكتبة الوطنية التونسية. ويذكر بعلبكي أن ابن منظور علّل اختيار مصادره الخمسة بالجمع والوضع: التهذيب والمحكم غزيرا المادة سيئا الترتيب، والصحاح حسن الوضع قليل الجمع؛ وأنه اعتمد المحكم في تنظيم المدخل الواحد بحسب الحقول الدلالية للجذر ثم أضاف ما فات ابن سيده من مصادره الأربعة الأخرى."
  en: "Ibn Manzur's Lisan al-Arab, a large dictionary of Arabic that its author finished on 22 Dhu al-Hijja 689 AH, 26 December 1290. In his preface he names five main sources — al-Azhari's Tahdhib, Ibn Sida's Muhkam, al-Jawhari's Sihah, Ibn Barri's al-Tanbih wa-l-idah and Ibn al-Athir's al-Nihaya — and says he wrote it to preserve Arabic as the language of the Qur'an and the Sunna. It follows the arrangement of the Sihah: the last radical gives the chapter, the first radical the section, and the middle letters are alphabetical too. It was first printed at Bulaq between 1883 and 1889, in 20 parts bound in 10 volumes, according to the catalogue of the National Library of Tunisia. Baalbaki notes that Ibn Manzur justified his five sources by collection and arrangement: the Tahdhib and the Muhkam were rich in material but badly arranged, the Sihah well arranged but poor in material; and that for the organisation of each entry he followed al-Muhkam, by the semantic fields of the root, adding what his other four sources supplied."
  es: "El Lisan al-Arab de Ibn Manzur, un extenso diccionario de la lengua árabe que su autor terminó el 22 de Dhu al-Hijja de 689 AH, el 26 de diciembre de 1290. En su prólogo nombra cinco fuentes principales —el Tahdhib de al-Azhari, el Muhkam de Ibn Sida, el Sihah de al-Jawhari, el al-Tanbih wa-l-idah de Ibn Barri y el al-Nihaya de Ibn al-Athir— y dice que lo escribió para preservar el árabe como lengua del Corán y de la Sunna. Sigue la ordenación del Sihah: el último radical da el capítulo, el primero la sección, y las letras intermedias también van en orden alfabético. Se imprimió por primera vez en Bulaq entre 1883 y 1889, en 20 partes encuadernadas en 10 volúmenes, según el catálogo de la Biblioteca Nacional de Túnez. Baalbaki señala que Ibn Manzur justificó sus cinco fuentes por la recopilación y la ordenación: el Tahdhib y el Muhkam eran ricos en material pero mal ordenados, el Sihah bien ordenado pero pobre en material; y que para la organización de cada entrada siguió al Muhkam, según los campos semánticos de la raíz, añadiendo lo que aportaban sus otras cuatro fuentes."
  fr: "Le Lisan al-Arab d'Ibn Manzur, un grand dictionnaire de la langue arabe que son auteur acheva le 22 Dhu al-Hijja 689 AH, soit le 26 décembre 1290. Dans sa préface il cite cinq sources principales — le Tahdhib d'al-Azhari, le Muhkam d'Ibn Sida, le Sihah d'al-Jawhari, l'al-Tanbih wa-l-idah d'Ibn Barri et l'al-Nihaya d'Ibn al-Athir — et dit l'avoir écrit pour préserver l'arabe comme langue du Coran et de la Sunna. Il suit le classement du Sihah : le dernier radical donne le chapitre, le premier la section, et les lettres médianes sont aussi alphabétiques. Il fut imprimé pour la première fois à Boulaq entre 1883 et 1889, en 20 parties reliées en 10 volumes, selon le catalogue de la Bibliothèque nationale de Tunisie. Baalbaki note qu'Ibn Manzur justifia ses cinq sources par la collecte et la mise en ordre : le Tahdhib et le Muhkam étaient riches en matière mais mal ordonnés, le Sihah bien ordonné mais pauvre en matière ; et que pour l'organisation de chaque entrée il suivit le Muhkam, selon les champs sémantiques de la racine, en ajoutant ce que fournissaient ses quatre autres sources."
  ur: "ابن منظور کی لسان العرب، عربی زبان کی ایک بڑی لغت جسے مصنف نے 22 ذوالحجہ 689ھ، یعنی 26 دسمبر 1290ء کو مکمل کیا۔ مقدمے میں وہ پانچ بنیادی مآخذ گنواتا ہے — ازہری کی تہذیب اللغۃ، ابن سیدہ کی المحکم، جوہری کی الصحاح، ابن بری کی التنبیہ والایضاح اور ابن الاثیر کی النہایۃ — اور کہتا ہے کہ اس نے قرآن و سنت کی زبان عربی کی حفاظت کے لیے لکھی۔ ترتیب صحاح کی ہے: آخری حرف سے باب، پہلے حرف سے فصل، اور درمیانی حروف بھی حروفِ تہجی کی ترتیب سے۔ یہ پہلی بار 1883ء سے 1889ء کے درمیان بولاق میں 20 حصوں میں چھپی جو 10 جلدوں میں مجلد ہیں، تیونس کی قومی لائبریری کی فہرست کے مطابق۔ بعلبکی نوٹ کرتے ہیں کہ ابن منظور نے اپنے پانچ مآخذ کے انتخاب کو جمع اور وضع سے جائز ٹھہرایا: التہذیب اور المحکم مواد میں بھرپور مگر ترتیب میں کمزور، الصحاح ترتیب میں اچھی مگر مواد میں کم؛ اور ہر مدخل کی تنظیم میں انہوں نے المحکم کی پیروی کی، مادے کے معنوی میدانوں کے مطابق، اور باقی چار مآخذ سے جو کچھ ابن سیدہ سے رہ گیا تھا شامل کیا۔"
