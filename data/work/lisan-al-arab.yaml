summary:
  ar: "لسان العرب لابن منظور، معجم اللغة العربية الكبير الذي جمع فيه مؤلفه، كما تذكر ترجمته، بين التهذيب والمحكم والصحاح والجمهرة والنهاية وحاشية الصحاح، ورتّبه على ترتيب الصحاح؛ وقد قرأ هذا التحرير المقدمات والتراجم فقط من طبعة دار صادر {cite:lisan-al-arab-dar-sadir p. 4}."
  en: "Ibn Manzur's Lisan al-Arab, a large dictionary of the Arabic language that, as its author's biographers record, gathers the Tahdhib, the Muhkam, the Sihah, the Jamhara, the Nihaya and the margins of the Sihah, arranged in the order of the Sihah. This draft reads only the front matter of the Dar Sadir edition {cite:lisan-al-arab-dar-sadir p. 4}."
