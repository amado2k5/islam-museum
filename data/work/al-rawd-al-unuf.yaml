label: { ar: "الروض الأنف في شرح السيرة النبوية", en: "al-Rawd al-Unuf fi Sharh al-Sira al-Nabawiyya", ur: "الروض الانف فی شرح السیرۃ النبویہ", tr: "El-Rawd el-Anf, Peygamberlik Biyografisinin Açıklamasında", id: "Al-Rawd al-Anf dalam Penjelasan Biografi Ramalan" }
summary:
  ar: "شرح أبي القاسم السهيلي ⁦(ت 581هـ)⁩ على سيرة ابن هشام، يتلو كل قسم من السيرة بفصول في غريب ألفاظه ونحوه وأنسابه وأشعاره، ويزيد عليه أخباراً من غير رواية ابن إسحاق، كخبر وقف أموال مخيريق، وردّ عين قتادة بن النعمان {cite:rawd-unuf-wakil-v6 p. 32-37, 47}؛ ومن تصانيف مؤلفه أيضاً «التعريف والإعلام بما أبهم في القرآن من الأسماء والأعلام» و«نتائج النظر» {cite:shadharat-dhahab p. 751}."
  en: "Abu al-Qasim al-Suhayli's (d. 581 AH) commentary on Ibn Hisham's Sira: each section of the Sira is followed by notes on its rare words, grammar, genealogies and poetry, with reports beyond Ibn Ishaq's transmission, such as the endowment of Mukhayriq's estates and the restoring of Qatada ibn al-Nu'man's eye {cite:rawd-unuf-wakil-v6 p. 32-37, 47}; its author also wrote works on the unnamed persons of the Qur'an and on grammar {cite:shadharat-dhahab p. 751}."
  ur: "ابو القاسم سہیلی ⁦(وفات 581ھ)⁩ کی سیرت ابن ہشام کی شرح: سیرت کے ہر حصے کے بعد اس کے نادر الفاظ، نحو، انساب اور اشعار پر فصلیں، اور ابن اسحاق کی روایت سے باہر کی اخبار، جیسے مخیریق کے باغوں کا وقف اور قتادہ بن النعمان کی آنکھ کا لوٹایا جانا {cite:rawd-unuf-wakil-v6 p. 32-37, 47}؛ مصنف کی دوسری تصانیف میں قرآن کے مبہم ناموں اور نحو پر کتابیں ہیں {cite:shadharat-dhahab p. 751}۔"
  es: "Comentario de Abu al-Qasim al-Suhayli (m. 581 AH) sobre la Sira de Ibn Hisham: cada sección de la Sira va seguida de notas sobre sus palabras raras, gramática, genealogías y poesía, con informes que van más allá de la transmisión de Ibn Ishaq, como la dotación de las propiedades de Mukhayriq y la restauración del ojo de Qatada ibn al-Nu'man {cite:rawd-unuf-wakil-v6 p. 32-37, 47}; su autor también escribió obras sobre las personas no nombradas del Corán y sobre gramática {cite:shadharat-dhahab p. 751}."
  fr: "Le commentaire d'Abu al-Qasim al-Suhayli (mort en 581 AH) sur la Sira d'Ibn Hisham: chaque section de la Sira est suivie de notes sur ses mots rares, sa grammaire, ses généalogies et sa poésie, avec des récits allant au-delà de la transmission d'Ibn Ishaq, tels que la dotation des biens de Mukhayriq et la restauration de l'œil de Qatada ibn al-Nu'man {cite:rawd-unuf-wakil-v6 p. 32-37, 47}; son auteur a également écrit des ouvrages sur les personnages non nommés du Coran et sur la grammaire {cite:shadharat-dhahab p. 751}."
  tr: "Ebu el-Kasım el-Suhaili (ö. 581 H) İbn Hişam'ın biyografisine yorum yapar; biyografinin her bölümünü nadir kelimeleri, benzerlikleri, soyağacı ve şiirleriyle birlikte okur, İbn İshaq'ın anlattıkları dışında Mukhayriq'in servetinin bağışlanmasına dair anlatım ve Ayn Katadah ibn al-Nu'man'a atıf {cite:rawd-unuf-wakil-v6 s. 32-37, 47}; yazarının eserleri arasında ayrıca \"El-Ta'rif ve el-I'lam bima Abham fi al-Qur'an min el-Esma' ve el-A'lam\" ve \"Nata'iyat al-Nazar\" {atıf:shadharat-dhahab, s. 751} bulunmaktadır."
  id: "Abu al-Qasim al-Suhaili (wafat 581 H) komentar atas biografi Ibn Hisham, membaca setiap bagian biografi dengan bab-bab tentang kata-kata langka, kesamaan, silsilah, dan puisi, menambahkan laporan selain yang diceritakan oleh Ibn Ishaq, seperti catatan tentang pemberian kekayaan Mukhayriq, dan referensi Ain Qatadah ibn al-Nu'man {cite:rawd-unuf-wakil-v6 hlm. 32-37, 47}; di antara karya penulisnya juga terdapat \"Al-Ta'rif wa al-I'lam bima Abham fi al-Qur'an min al-Asma' wa al-A'lam\" dan \"Nata'iyat al-Nazar\" {cite:shadharat-dhahab, hlm. 751}."
