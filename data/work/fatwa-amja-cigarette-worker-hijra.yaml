id: work/fatwa-amja-cigarette-worker-hijra
class: work
kind: fatwa
label: { ar: "هل أهاجر إلى بلاد غير مسلمة؟ ⁦(سؤال عامل في شركة تبغ حصل على إقامة كندية)⁩", en: "Should I emigrate to a non-Muslim country? ⁦(a tobacco-company worker granted Canadian residence)⁩", ur: "کیا میں غیر مسلم ملک ہجرت کروں؟ ⁦(تمباکو کمپنی کا ملازم جسے کینیڈین رہائش ملی)⁩", es: "¿Debería emigrar a un país no musulmán? (Un trabajador de una compañía tabacalera al que se le concedió la residencia canadiense)" }
summary:
  ar: "سائل يعمل في شركة لصنع السجائر وحصل على إقامة دائمة بكندا سأل هل يهاجر أم لا. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(اللجنة الدائمة للإفتاء، فتوى رقم 87631 بتاريخ 23 أكتوبر 2012)⁩ أن العمل في صناعة التدخين إعانة على منكر وتعاون على الإثم والعدوان لأن التبغ منتج مضر، ولا ينبغي قبول العمل فيه إلا للضرورة القصوى، وبينت في سياق الجواب ضوابط الهجرة إلى بلاد غير مسلمة."
  en: "A questioner who worked for a cigarette manufacturer and had obtained permanent residence in Canada asked whether to emigrate. The Assembly of Muslim Jurists of America (permanent fatwa committee, fatwa no. 87631, 23 October 2012) answered that working in tobacco production is aiding what is objectionable and cooperating in sin, since tobacco is a harmful product, and that such employment should be accepted only under pressing necessity; the answer also set out the conditions governing emigration to non-Muslim lands."
  ur: "ایک سائل جو تمباکو کمپنی میں ملازم تھا اور جسے کینیڈا کی مستقل رہائش ملی، نے پوچھا کہ کیا ہجرت کرے۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(مستقل کمیٹی برائے افتاء، فتویٰ نمبر 87631، 23 اکتوبر 2012)⁩ نے جواب دیا کہ تمباکو کی صنعت میں کام برائی میں معاونت اور گناہ میں تعاون ہے کیونکہ تمباکو نقصان دہ پیدا وار ہے، اور ایسا کام صرف سخت ضرورت میں قبول کرنا چاہیے؛ جواب میں غیر مسلم ملکوں میں ہجرت کے ضوابط بھی بیان کیے۔"
  es: "Un solicitante que trabajaba para un fabricante de cigarrillos y había obtenido la residencia permanente en Canadá preguntó si debía emigrar. La Asamblea de Juristas Musulmanes de América (comité permanente de fatuas, fatua n.° 87631, del 23 de octubre de 2012) respondió que trabajar en la producción de tabaco es ayudar a lo reprobable y cooperar en el pecado, ya que el tabaco es un producto nocivo, y que dicho empleo solo debe aceptarse en casos de extrema necesidad. La respuesta también estableció las condiciones que rigen la emigración a países no musulmanes."
