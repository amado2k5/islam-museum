summary:
  ar: "مجلد للقاضي مجير الدين العليمي الحنبلي؛ جمع فيه خلاصة تواريخ القدس وأضاف إليه نبذة من الحوادث والوفيات، شرع فيه في ذي الحجة سنة ٩٠٠هـ وفرغ بعد أربعة أشهر {cite:kashf-zunun-furqan p. 649-650}."
  en: "Mujir al-Din's al-Uns al-Jalil — the classic topographical history of Jerusalem and Hebron, gathering the earlier Jerusalem histories with annals and obituaries; written in four months from Dhu al-Hijja AH 900 {cite:kashf-zunun-furqan p. 649-650}."
  es: "Al-Uns al-Jalil de Mujir al-Din: la historia topográfica clásica de Jerusalén y Hebrón, que recopila las historias anteriores de Jerusalén con anales y obituarios; escrito en cuatro meses desde Dhu al-Hijja AH 900 {cita: Kashf-Zunun-Furqan p. 649-650}."
  fr: "al-Uns al-Jalil de Mujir al-Din — l'histoire topographique classique de Jérusalem et d'Hébron, rassemblant les histoires antérieures de Jérusalem avec des annales et des nécrologies; écrit en quatre mois à partir de Dhu al-Hijja AH 900 {cite: Kashf-Zunun-Furqan p. 649-650}."
  ur: "مجیر الدین کی الانس الجلیل - یروشلم اور ہیبرون کی کلاسیکی ٹپوگرافیکل تاریخ، یروشلم کی سابقہ تاریخوں کو تاریخوں اور یادوں کے ساتھ جمع کرنا؛ ذی الحجہ 900 ہجری سے چار ماہ میں لکھی گئی 649-650}۔"
  tr: "Yargıç Mujir al-Din al-Alimi al-Hanbali tarafından yazılmış bir cilt; burada Kudüs tarihlerinin bir özetini derlemiş ve olaylar ile ölümlerin kısa bir anlatımını eklemiştir. Hicce 900 Hicce'de başlamış ve dört ay sonra tamamlamıştır {atıf:kashf-zunun-furqan, s. 649-650}."
  id: "Sebuah jilid oleh Hakim Mujir al-Din al-Alimi al-Hanbali; di mana ia menyusun ringkasan sejarah Yerusalem dan menambahkan catatan singkat tentang peristiwa dan kematian. Ia memulainya pada Dhu al-Hijjah tahun 900 H dan menyelesaikannya setelah empat bulan {cite:kashf-zunun-furqan, hlm. 649-650}."
