summary:
  ar: "برنامج مرئي من أربع وعشرين حلقة لعمر عبد الكافي في أرشيف أسابيل، يتحدث فيه في موضوع الحلقة ثم يتلقى اتصالات المشاهدين بعد الفاصل، ومن موضوعاته الرزق والقناعة والحسد والأمانة وآفات اللسان."
  en: "A twenty-four-episode video programme by Omar Abdelkafy on the Assabile archive, in which he speaks on the episode's theme and then takes viewers' calls after the break; its themes include provision, contentment, envy, trust and the faults of the tongue."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا چوبیس اقساط کا ویڈیو پروگرام، جس میں وہ قسط کے موضوع پر بات کرتے ہیں اور وقفے کے بعد ناظرین کی کالیں لیتے ہیں؛ اس کے موضوعات میں رزق، قناعت، حسد، امانت اور زبان کی آفات شامل ہیں۔"
