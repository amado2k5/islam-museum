summary:
  ar: "سائل سأل عن الجمع في الصيام بين نية كفارة اليمين وصيام عاشوراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21974)⁩ أنه يجوز الجمع حيث تعين عليه الصيام لعدم قدرته على الإطعام أو الكسوة على ما فصّل الجواب من أحكام الاشتراك في النية."
  en: "A questioner asked about combining the intentions of oath-expiation fasting and 'Ashura fasting in one day. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21974) answered that combining is permitted where fasting became fixed on him for inability to feed or clothe — under the rules of shared intention the answer details."
  ur: "ایک سائل نے ایک ہی روزے میں کفارۂ یمین اور عاشورہ کی نیت جمع کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21974)⁩ نے جواب دیا کہ جب کھانا یا کپڑا دینے کی عدم استطاعت کی وجہ سے روزہ متعین ہو جائے تو جمع کرنا جائز ہے — جواب میں مشترکہ نیت کے احکام بیان ہوئے۔"
