id: work/fatwa-dar-alifta-eg-combining-oath-expiation-and-ashura
class: work
kind: fatwa
label: { ar: "الجمع في الصوم بين نية كفارة اليمين وعاشوراء", en: "Combining oath-expiation and 'Ashura in one fast", ur: "کفارۂ یمین اور عاشورہ کی نیت ایک روزے میں جمع کرنا", es: "Combinar la expiación del juramento y 'Ashura en un solo ayuno", fr: "Combiner l'expiation du serment et l'Achoura en un seul jeûne" }
summary:
  ar: "سائل سأل عن الجمع في الصيام بين نية كفارة اليمين وصيام عاشوراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21974)⁩ أنه يجوز الجمع حيث تعين عليه الصيام لعدم قدرته على الإطعام أو الكسوة على ما فصّل الجواب من أحكام الاشتراك في النية."
  en: "A questioner asked about combining the intentions of oath-expiation fasting and 'Ashura fasting in one day. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21974) answered that combining is permitted where fasting became fixed on him for inability to feed or clothe — under the rules of shared intention the answer details."
  ur: "ایک سائل نے ایک ہی روزے میں کفارۂ یمین اور عاشورہ کی نیت جمع کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21974)⁩ نے جواب دیا کہ جب کھانا یا کپڑا دینے کی عدم استطاعت کی وجہ سے روزہ متعین ہو جائے تو جمع کرنا جائز ہے — جواب میں مشترکہ نیت کے احکام بیان ہوئے۔"
  es: "Un consultante preguntó sobre la posibilidad de combinar el ayuno de expiación por juramento y el ayuno de Ashura en un mismo día. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21974) respondió que la combinación está permitida cuando el ayuno se vuelve indispensable para la persona debido a la incapacidad de alimentarse o vestirse, según las normas de intención compartida que detalla la respuesta."
  fr: "Un internaute a demandé s'il était possible de combiner le jeûne d'expiation d'un serment et le jeûne d'Achoura en une seule journée. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21974) a répondu que cette combinaison était permise lorsque le jeûne lui avait été imposé en raison de l'incapacité de se nourrir ou de se vêtir, conformément aux règles de l'intention partagée, comme le précise la réponse."
