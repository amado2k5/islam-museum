summary:
  ar: "جواب يبيّن أن رفع الأصوات والذكر الجماعي المنظم في تشييع الجنازة بدعة مخالفة للسنة، وأن الصمت والتفكر هو المطلوب، ومن ذلك إجماع السلف، وأن التشييع شرع للتأدب والخشوع."
  ur: "جواب: جنازے کے ساتھ منظم اجتماعی بلند ذکر سنت کے خلاف بدعت ہے۔ مطلوب خاموشی اور غور و فکر ہے، جیسا کہ اسلاف کا اجماع ہے، کیونکہ جنازہ عاجزی اور موت پر غور کے لیے ہے۔"
  en: "Answer explaining that raised, organised group chanting at funerals is an innovation contrary to the sunna; silence and reflection are what is required, as the early generations understood, since the procession is meant for humility and reflection on death."
