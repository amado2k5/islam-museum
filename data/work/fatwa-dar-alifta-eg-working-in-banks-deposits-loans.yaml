label: { ar: "حكم العمل في البنوك وإيداع الأموال فيها وأخذ القروض البنكية", en: "Working in banks, depositing money and taking bank loans", ur: "بینکوں میں کام، رقم جمع کرانا اور قرض لینا", es: "Trabajar en bancos, depositar dinero y obtener préstamos bancarios.", fr: "Travailler dans les banques, déposer de l'argent et obtenir des prêts bancaires" }
summary:
  ar: "سائل سأل عن العمل في البنوك وإيداع الأموال فيها وأخذ القروض البنكية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20909)⁩ أن العمل في البنوك جائز شرعًا لأن البنك مؤسسة استثمارية وشخصية اعتبارية يمارس الاستثمار وبيّن الجواب أحوال المعاملة معه على وجهها."
  en: "A questioner asked about working in banks, depositing money in them and taking bank loans. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20909) answered that working in banks is lawful since the bank is an investment institution and juristic person; the answer sets out the cases of dealing with it."
  ur: "ایک سائل نے بینکوں میں کام کرنے، رقم جمع کرانے اور بینک قرض لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20909)⁩ نے جواب دیا کہ بینکوں میں کام جائز ہے کیونکہ بینک سرمایہ کاری ادارہ اور اعتباری شخص ہے؛ جواب میں معاملے کے احوال بیان ہوئے۔"
  es: "Un consultante preguntó sobre la posibilidad de trabajar en bancos, depositar dinero en ellos y obtener préstamos bancarios. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20909) respondió que trabajar en bancos es lícito, ya que el banco es una institución de inversión y una persona jurídica; la respuesta expone los casos en los que se puede operar con él."
  fr: "Un internaute a posé une question concernant le travail en banque, les dépôts d'argent et les prêts bancaires. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20909) a répondu que travailler en banque est licite, la banque étant un établissement financier doté de la personnalité morale; la réponse expose les cas de figure."
