id: work/fatwa-amja-soul-leaves-in-sleep
class: work
kind: fatwa
label: { ar: "النوم وتوفية الأنفس", en: "Does the soul leave the body in sleep", ur: "نیند میں روح نکلتی ہے" }
summary:
  ar: "سأل سائل هل الإنسان عند نومه تخرج روحه وإن كان حيًا. أجاب د. وليد بسيوني ⁦(فتوى رقم 21846 بتاريخ 26 أغسطس 2006)⁩ أن آية سورة الزمر الله يتوفى الأنفس حين موتها والتي لم تمت في منامها أفادت أن النفس التي هي الروح يتوفاها الله عند النوم ثم يردها عند الاستيقاظ ولذا كان النبي يقول عند الاستيقاظ الحمد لله الذي أحيانا بعد ما أماتنا، وأما كيفية هذا التوفي وكيفية الرد ونوعية الصلة بين الروح والجسد أثناء التوفي فكله من الغيب الذي يفوض علمه إلى الله قال سبحانه قل الروح من أمر ربي."
  en: "A questioner asked whether a person's soul leaves him in sleep while he is still alive. Dr. Walid Basyouni (fatwa no. 21846, 26 August 2006) answered that al-Zumar's verse — 'God takes the souls at their death, and those that have not died, in their sleep' — shows the soul that is the spirit is taken by God at sleep then returned at waking; hence the Prophet used to say on waking 'praise God who gave us life after He gave us death'. As for how this taking and return work and the soul-body link during it — that is unseen, its knowledge consigned to God: 'say: the spirit is of my Lord's affair'."
  ur: "ایک سائل نے نیند میں روح کے نکلنے پوچھا۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21846، 26 اگست 2006)⁩ کے مطابق زمر کی آیت ثابت کرتی ہے کہ روح لی جاتی ہے اور جاگنے پر لوٹائی جاتی ہے؛ کیفیت غیب ہے۔"
