id: work/fatwa-amja-soul-leaves-in-sleep
class: work
kind: fatwa
label: { ar: "النوم وتوفية الأنفس", en: "Does the soul leave the body in sleep", ur: "نیند میں روح نکلتی ہے", es: "¿Abandona el alma el cuerpo mientras se duerme?", fr: "L'âme quitte-t-elle le corps pendant le sommeil ?", tr: "Uyku ve ruh tatmini", id: "Tidur dan pemenuhan jiwa" }
summary:
  ar: "سأل سائل هل الإنسان عند نومه تخرج روحه وإن كان حيًا. أجاب د. وليد بسيوني ⁦(فتوى رقم 21846 بتاريخ 26 أغسطس 2006)⁩ أن آية سورة الزمر الله يتوفى الأنفس حين موتها والتي لم تمت في منامها أفادت أن النفس التي هي الروح يتوفاها الله عند النوم ثم يردها عند الاستيقاظ ولذا كان النبي يقول عند الاستيقاظ الحمد لله الذي أحيانا بعد ما أماتنا، وأما كيفية هذا التوفي وكيفية الرد ونوعية الصلة بين الروح والجسد أثناء التوفي فكله من الغيب الذي يفوض علمه إلى الله قال سبحانه قل الروح من أمر ربي."
  en: "A questioner asked whether a person's soul leaves him in sleep while he is still alive. Dr. Walid Basyouni (fatwa no. 21846, 26 August 2006) answered that al-Zumar's verse — 'God takes the souls at their death, and those that have not died, in their sleep' — shows the soul that is the spirit is taken by God at sleep then returned at waking; hence the Prophet used to say on waking 'praise God who gave us life after He gave us death'. As for how this taking and return work and the soul-body link during it — that is unseen, its knowledge consigned to God: 'say: the spirit is of my Lord's affair'."
  ur: "ایک سائل نے نیند میں روح کے نکلنے پوچھا۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21846، 26 اگست 2006)⁩ کے مطابق زمر کی آیت ثابت کرتی ہے کہ روح لی جاتی ہے اور جاگنے پر لوٹائی جاتی ہے؛ کیفیت غیب ہے۔"
  es: "Un consultante preguntó si el alma de una persona la abandona mientras duerme estando aún con vida. El Dr. Walid Basyouni (fatwa n.° 21846, 26 de agosto de 2006) respondió que el versículo de al-Zumar —«Dios toma las almas al morir, y a quienes no han muerto, mientras duermen»— muestra que el alma, es decir, el espíritu, es tomada por Dios al dormir y luego devuelta al despertar; por eso el Profeta solía decir al despertar: «Alabado sea Dios, que nos dio la vida después de habernos dado la muerte». En cuanto a cómo funciona este acto de tomar y devolver el alma, y la conexión entre el alma y el cuerpo durante el mismo, eso es invisible, su conocimiento está confiado a Dios: «Di: el espíritu es asunto de mi Señor»."
  fr: "Un internaute a demandé si l'âme d'une personne la quittait pendant son sommeil alors qu'elle était encore vivante. Le Dr Walid Basyouni (fatwa n° 21846, 26 août 2006) a répondu que le verset d'al-Zumar – « Dieu reprend les âmes à leur mort, et celles qui ne sont pas encore mortes, pendant leur sommeil » – montre que l'âme, c'est-à-dire l'esprit, est prise par Dieu pendant le sommeil puis rendue au réveil. C'est pourquoi le Prophète disait en se réveillant: « Louange à Dieu qui nous a donné la vie après nous avoir donné la mort. » Quant au fonctionnement de ce processus de départ et de retour, et au lien entre l'âme et le corps durant celui-ci, cela demeure invisible, et Dieu seul en a la connaissance: « Dis: l'esprit appartient à mon Seigneur. »"
  tr: "Bir soruya soran kişiye soruldu: Bir kişinin ruhu uyurken gider mi, hayatta olsa bile? Dr. Velid Başunî (26 Ağustos 2006 tarihli 21846 sayılı fetva) Sümar Suresi'ndeki ayetin, uykuda ölmeyen ruhları ölüm anında alır ve ruhun Allah tarafından uyurken alındığını ve uyandığında geri döndüğünü belirttiğini söyledi. Bu yüzden Peygamber uyandığında şöyle derdi: 'Bazen canımızı aldıktan sonra Allah'a hamdolsun.' Bu ölümün şekli, geri dönüşü ve ölüm sırasında ruh ile beden arasındaki bağlantının doğası ise tüm bunlar görünmeyen bir şeyden gelmektedir ve bilgisi Allah'a emanet edilmiştir. Yüce Allah şöyle buyurdu: 'De ki: Ruh Rabbimin emriyledir.'"
  id: "Seorang penanya ditanya: Apakah jiwa seseorang pergi saat ia tidur, meskipun ia masih hidup? Dr. Walid Basyouni menjawab (Fatwa No. 21846 tanggal 26 Agustus 2006) bahwa ayat dalam Surah Az-Zumar: Allah mengambil jiwa pada saat kematian, yang tidak mati dalam tidurnya, menyatakan bahwa jiwa, yang merupakan jiwa, diambil oleh Allah saat tidur dan kemudian dikembalikan saat terbangun. Oleh karena itu, Nabi biasa berkata saat bangun, 'Segala puji bagi Allah, yang kadang-kadang setelah Dia mengambil nyawa kita.' Adapun cara kematian ini, cara kematian itu dikembalikan, dan sifat hubungan antara jiwa dan tubuh selama kematian, semua ini berasal dari yang tidak kelihatan, yang ilmunya diserahkan kepada Allah. Allah, Yang Maha Agung, berfirman: 'Katakanlah: Jiwa adalah atas perintah Tuhanku.'"
