id: work/fatwa-amja-taklif-conditions-intellect
class: work
kind: fatwa
label: { ar: "شروط التكليف: العقل وفهم الخطاب", en: "The conditions of moral responsibility: intellect", ur: "تکلیف کی شرائط: عقل اور خطاب کی فهم", es: "Las condiciones de la responsabilidad moral: el intelecto", fr: "Les conditions de la responsabilité morale: l'intellect" }
summary:
  ar: "سأل سائل عن دليل شرط العقل وفهم الخطاب في التكليف وكيف يوفق بينهما. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77582 بتاريخ 26 يناير 2009)⁩ أن القلم رفع عن ثلاث عن الصبي حتى يبلغ وعن النائم حتى يستيقظ وعن المجنون حتى يفيق وهذا دليل على أن العقل شرط في التكليف، والعقل الذي يناط به التكليف هو الذي يقابل الجنون كما هو ظاهر الحديث وهو الذي يتحقق بوجوده قيام الحجة، أما عقل الاهتداء بمعنى الانتفاع بما عقل والسير بمقتضاه فليس مناط التكليف فإن الكفار قالوا لو كنا نسمع أو نعقل ما كنا من أصحاب السعير وليس المقصود تخلف آلة العقل أو آلة السمع."
  en: "A questioner asked for the proof that intellect and grasping the address are conditions of moral responsibility, and how to reconcile them. Dr. Salah al-Sawi (fatwa no. 77582, 26 January 2009) answered that 'the pen is lifted from three — the child till puberty, the sleeper till he wakes, and the madman till he recovers' proves intellect a condition; the intellect responsibility turns on is what stands opposed to madness — that in whose presence the proof is established — not the intellect of guidance, profiting by what it grasps; for the disbelievers say 'had we heard or understood we would not have been among the Blaze's companions', and what is meant is not that the faculty itself was absent."
  ur: "ایک سائل نے عقل اور فہم کی تکلیفی شرط کی دلیل پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77582، 26 جنوری 2009)⁩ کے مطابق «قلم تین سے اٹھا لیا گیا» حدیث ثابت کرتی ہے کہ عقل شرط ہے — یعنی وہ عقل جو جنون کے مقابل ہے۔"
  es: "Un interlocutor preguntó por la prueba de que el intelecto y la comprensión del discurso son condiciones de responsabilidad moral, y cómo conciliarlas. El Dr. Salah al-Sawi (fatwa n.º 77582, 26 de enero de 2009) respondió que «la pluma se levanta de tres: el niño hasta la pubertad, el durmiente hasta que despierta y el loco hasta que se recupera», lo que demuestra que el intelecto es una condición; la responsabilidad intelectual se basa en lo que se opone a la locura —aquello en cuya presencia se establece la prueba—, no en el intelecto de la guía, que se beneficia de lo que comprende; pues los incrédulos dicen «si hubiéramos oído o entendido, no habríamos estado entre los compañeros del Fuego», y lo que se quiere decir no es que la facultad misma estuviera ausente."
  fr: "Un questionneur a demandé la preuve que l'intellect et la compréhension de l'adresse sont des conditions de la responsabilité morale, et comment les concilier. Le Dr Salah al-Sawi (fatwa n° 77582, 26 janvier 2009) a répondu que « la plume est levée pour trois personnes: l'enfant jusqu'à la puberté, le dormeur jusqu'à son réveil, et le fou jusqu'à sa guérison » prouve que l'intellect est une condition; l'intellect sur lequel repose la responsabilité est ce qui s'oppose à la folie — celui en présence duquel la preuve est établie — et non l'intellect de la guidance, profitant de ce qu'il comprend; car les mécréants disent: « Si nous avions entendu ou compris, nous n'aurions pas été parmi les compagnons du Feu », et cela ne signifie pas que la faculté elle-même était absente."
