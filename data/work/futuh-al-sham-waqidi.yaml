structure: "Vol. 1 (pp. 5-306): the mustering of the troops and Abu Bakr's charges to the commanders (pp. 5-21); Amr ibn al-As in Palestine; Khalid ibn al-Walid's march to Syria (p. 22); the battles around Damascus, with Khawla bint al-Azwar and the 'heroism of the women' (pp. 32-52); Ajnadayn (p. 55); the siege and conquest of Damascus and Abu Ubayda's appointment (pp. 62-99); Homs, Qinnasrin and al-Rastan (pp. 99-147); Yarmuk with Jabala ibn al-Ayham (pp. 148-218); Jerusalem (pp. 219-236); Aleppo and its citadels (pp. 237-266); Azaz (pp. 267-306). Vol. 2 (pp. 3-292): Marj al-Qaba'il beyond the passes; Caesarea, Tyre, Acre and Tripoli; Egypt, Maryut, Alexandria, Damietta, Tinnis and al-Farama (pp. 32-88); Diyar Bakr, Rabi'a, Qarqisiya, Mardin, Edessa and Harran, Ra's al-Ayn, Dara, Mayyafariqin and Amid, Jabal al-Judi, Bitlis, Armenia and Akhlat (pp. 88-169); Iraq, al-Khawarnaq, al-Hira, al-Qadisiyya, the Iwan and Nishapur (pp. 170-197); al-Bahnasa and Ahnas, its cemetery, the sojourn of Jesus there and its conquest (pp. 198-292). Contents: vol. 1 pp. 309-310, vol. 2 pp. 295-296."
