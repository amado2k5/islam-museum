label: { ar: "فتوح الشام ⁦(المنسوب إلى الواقدي)⁩", en: "Futuh al-Sham (ascribed to al-Waqidi)", ur: "فتوح الشام ⁦(واقدی سے منسوب)⁩" }
summary:
  ar: "كتاب في فتوح الشام ومصر والجزيرة وأرمينية والعراق، يُطبع باسم أبي عبد الله محمد بن عمر الواقدي ⁦(ت 207هـ)⁩، يبدأ بكتب أبي بكر إلى أهل اليمن ومكة وينتهي بالخبر الطويل في فتح البهنسا بصعيد مصر {cite:futuh-al-sham-ilmiyya-1997-v1 p.5} {cite:futuh-al-sham-ilmiyya-1997-v2 p.292}. يسوق الأخبار بأسانيد مجموعة وحوار وشعر ورسائل، ونسبته إلى الواقدي محل نظر: ففي متنه نقول عن المسعودي والطبري وابن خلكان وذي النون المصري، وهم بعد الواقدي {cite:futuh-al-sham-ilmiyya-1997-v2 p.200} {cite:futuh-al-sham-ilmiyya-1997-v2 p.203} {cite:futuh-al-sham-ilmiyya-1997-v2 p.291}؛ ويرى بحث أكاديمي حديث أن أصله فتوح الواقدي ثم أعيدت صياغته في القرنين السادس والسابع للهجرة {cite:dehghani-farsani-futuh-al-sham-thesis abstract}."
  en: "A book on the conquests of Syria, Egypt, the Jazira, Armenia and Iraq, printed under the name of Abu Abd Allah Muhammad ibn Umar al-Waqidi (d. 207 AH); it opens with Abu Bakr's letters to the people of Yemen and Mecca and closes with a long account of the conquest of al-Bahnasa in Upper Egypt. It tells its story through collective chains of transmission, dialogue, verse and letters, and its ascription to al-Waqidi is questioned: the text quotes al-Mas'udi, al-Tabari, Ibn Khallikan and Dhu al-Nun al-Misri, all later than al-Waqidi, and a recent academic study holds that it is at root al-Waqidi's Futuh reworked in the 12th-13th centuries CE."
