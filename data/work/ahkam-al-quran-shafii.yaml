summary:
  ar: "أحكام القرآن للإمام الشافعي ⁦(ت 204هـ)⁩؛ يذكر حاجي خليفة أنه أول من صنّف في هذا الفن، وقد جمعه البيهقي من نصوص الشافعي الفقهية {cite:kashf-zunun-furqan p. 210}."
  en: "Ahkam al-Qur'an of Imam al-Shafi'i (d. 204 AH); Hajji Khalifa notes he was the first to compose in this genre, the text being gathered by al-Bayhaqi from al-Shafi'i's legal corpus {cite:kashf-zunun-furqan p. 210}."
  es: "Ahkam al-Qur'an del Imam al-Shafi'i (m. 204 d. H.); Hajji Khalifa señala que fue el primero en componer en este género; el texto fue recopilado por al-Bayhaqi del corpus legal de al-Shafi'i {citar:kashf-zunun-furqan p. 210}."
  fr: "Ahkam al-Qur'an de l'Imam al-Shafi'i (mort en 204 AH); Hajji Khalifa note qu'il fut le premier à composer dans ce genre, le texte étant rassemblé par al-Bayhaqi à partir du corpus juridique d'al-Shafi'i {cite:kashf-zunun-furqan p. 210}."
  ur: "امام شافعی ⁦(متوفی 204ھ)⁩ کا احکام القرآن؛ حاجی خلیفہ نوٹ کرتے ہیں کہ وہ اس صنف میں سب سے پہلے تحریر کرنے والے تھے، اس متن کو البیحقی نے الشافعی کے قانونی کارپس سے جمع کیا تھا۔ 210}۔"
