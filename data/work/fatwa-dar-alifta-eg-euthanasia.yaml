id: work/fatwa-dar-alifta-eg-euthanasia
class: work
kind: fatwa
label: { ar: "حكم القتل الرحيم", en: "The ruling on euthanasia ('mercy killing')", ur: "قتلِ رحیم ⁦(ایوتھینیشیا)⁩ کا حکم", es: "La sentencia sobre la eutanasia ('muerte por compasión')", fr: "La décision concernant l'euthanasie (« meurtre par compassion »)" }
summary:
  ar: "سائل سأل عن ما يسمى القتل الرحيم أو الموت الرحيم للآدمي حال اشتداد المرض والألم عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22189)⁩ أنه محرم شرعًا بل هو من كبائر الذنوب، على ما فصّل الجواب من حرمة النفس الإنسانية وما يجوز من رفع المعاناة."
  en: "A questioner asked about what is called 'mercy killing' or euthanasia for a person when illness and pain grow severe. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22189) answered that it is forbidden in the sharia and is among the major sins; the answer sets out the sanctity of human life and what is permitted to relieve suffering."
  ur: "ایک سائل نے شدید بیماری اور درد کی حالت میں انسان کے لیے نام نہاد 'قتلِ رحیم' یا ایوتھینیشیا کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22189)⁩ نے جواب دیا کہ یہ شرعاً حرام بلکہ کبیرہ گناہوں میں ہے؛ جواب میں انسانی جان کی حرمت اور تکلیف دور کرنے کی جائز صورتیں بیان ہوئیں۔"
  es: "Un consultante preguntó sobre la eutanasia o \"muerte por compasión\" para una persona cuando su enfermedad y dolor se agravan. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22189) respondió que está prohibida por la sharia y se encuentra entre los pecados mayores. La respuesta expone la santidad de la vida humana y lo que está permitido para aliviar el sufrimiento."
  fr: "Un internaute a posé une question sur ce qu'on appelle « l'euthanasie » ou « l'aide médicale à mourir » pour une personne dont la maladie et la douleur deviennent insupportables. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22189) a répondu que cette pratique est interdite par la charia et compte parmi les péchés majeurs; la réponse souligne le caractère sacré de la vie humaine et ce qui est permis pour soulager la souffrance."
