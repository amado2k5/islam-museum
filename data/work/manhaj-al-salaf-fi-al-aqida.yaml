summary:
  ar: "كتاب في العقيدة يبسط فيه المؤلف قضايا التوحيد وأسماء الله وصفاته والقضاء والقدر على منهج السلف، من مدخل في معنى الدين إلى أثر الإيمان بالله في حياة المسلم؛ للدكتور حمدي عبد العال، صدر عن دار القلم بالكويت سنة 1984."
  en: "Manhaj al-Salaf fi al-Aqidah (The Method of the Righteous Predecessors in Creed) — a book by Dr. Hamdy Abdel Aal, published by Dar al-Qalam, Kuwait, in 1984."
  es: "Manhaj al-Salaf fi al-Aqidah (El método de los justos predecesores en el Credo): libro del Dr. Hamdy Abdel Aal, publicado por Dar al-Qalam, Kuwait, en 1984."
  fr: "Manhaj al-Salaf fi al-Aqidah (La méthode des justes prédécesseurs dans la croyance) — un livre du Dr Hamdy Abdel Aal, publié par Dar al-Qalam, Koweït, en 1984."
  ur: "منھاج السلف فی العقیدہ ⁦(عقیدہ میں صالح پیشروؤں کا طریقہ)⁩ - ڈاکٹر حمدی عبد العل کی ایک کتاب، جسے دار الکلام، کویت نے 1984 میں شائع کیا۔"
  tr: "Yazarın tek tanrıcılık, Allah'ın isimleri ve nitelikleri, Selef metodolojisine göre ilahi emri ve kader konularını detaylandırdığı bir inanç kitabı; dinin anlamına girişten Allah'a inancın bir Müslümanın hayatındaki etkisine kadar; Dr. Hamdi Abdel Aal tarafından yazılmış, 1984'te Kuveyt'te Dar Al-Qalam tarafından yayımlanmıştır."
  id: "Sebuah buku tentang kredo di mana penulis menguraikan isu-isu monoteisme, nama dan atribut Allah, serta dekrit dan takdir ilahi menurut metodologi Salaf, mulai dari pengantar makna agama hingga dampak iman kepada Allah dalam kehidupan seorang Muslim; oleh Dr. Hamdi Abdel Aal, diterbitkan oleh Dar Al-Qalam di Kuwait pada tahun 1984."
