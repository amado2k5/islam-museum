label: { ar: "أبيات «بني عمنا لا تذكروا الشعر بعدما» للشميذر الحارثي", en: "The verses 'Our cousins, do not mention poetry' ascribed to al-Shamidhar al-Harithi", es: "Los versos 'Nuestros primos, no mencionéis la poesía' se atribuyen a al-Shamidhar al-Harithi.", fr: "Les vers « Nos cousins, ne parlez pas de poésie » attribués à al-Shamidhar al-Harithi", ur: "\"ہمارے کزن، شاعری کا ذکر نہ کریں\" کی آیات الشمیدر الحارثی سے منسوب ہیں", tr: "Al-Shmither Al-Harthi'nin 'Kuzenlerimiz, Şiirden Bahsetme' adlı eserinden dizeler", id: "Bait-bait dari 'Sepupu Kita, Jangan Sebutkan Puisi Setelahnya' oleh Al-Shmither Al-Harthi" }
summary:
  ar: "أبيات في ديوان الحماسة من الطويل على روي الياء ⁦(ألف الإطلاق)⁩، تقدّمها الطبعة بقولها «قال الشميذر الحارثي»؛ وتنقل الحاشية عن البرقي أن الشعر لسويد بن صميع الرندي الحارثي {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  en: "Verses in the Diwan al-Hamasa in the tawil metre, introduced in the edition with \"al-Shamidhar al-Harithi said\"; the footnote reports from al-Barqi that they belong to Suwayd ibn Sumay' al-Rindi al-Harithi {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  es: "Versos en el Diwan al-Hamasa en métrica tawil, introducidos en la edición con \"al-Shamidhar al-Harithi dijo\"; la nota a pie de página informa de al-Barqi que pertenecen a Suwayd ibn Sumay' al-Rindi al-Harithi {{cita:hamasa-abu-tammam-ed-1916 p.30}}."
  fr: "Versets du Diwan al-Hamasa au mètre tawil, introduits dans l'édition par « al-Shamidhar al-Harithi a dit »; la note de bas de page rapporte d'al-Barqi qu'ils appartiennent à Suwayd ibn Sumay' al-Rindi al-Harithi {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  ur: "تاویل میٹر میں دیوان الحمسہ کی آیات، \"الشمیدر الحارثی نے کہا\" کے ساتھ ایڈیشن میں متعارف کرائی ہیں؛ فوٹ نوٹ البرکی سے رپورٹ کرتا ہے کہ ان کا تعلق سوید بن سمیع الرندی الحارثی سے ہے۔"
  tr: "Al-Hamasa Diwanı'ndaki Al-Tawil'den Rawi Ya (Etlaat'ın Alifi) üzerine dizeler, \"Al-Shmither Al-Harithi dedi\" ifadesinin yer aldığı baskı ile önceliklidir; kenar notlarında Al-Barqi'den alıntı yapılır ve şiirin Suwayd ibn Sami' Al-Rundi Al-Harithi tarafından yazıldığı belirtilir {{cite:hamasa-abu-tammam-ed-1916 s.30}}."
  id: "Bait-bait dalam Diwan Al-Hamasa dari Al-Tawil tentang Rawi Ya (Alif dari Etlaat), didahului oleh edisi dengan frasa \"Al-Shmither Al-Harithi berkata\"; catatan pinggir mengutip Al-Barqi bahwa puisinya ditulis oleh Suwayd ibn Sami' Al-Rundi Al-Harithi {{cite:hamasa-abu-tammam-ed-1916 hlm.30}}."
