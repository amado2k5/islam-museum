label: { ar: "قرار مجمع الفقه الإسلامي الدولي 118 (12/12) بشأن القدس الشريف", en: "IIFA resolution 118 (12/12) on Jerusalem", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 118 (12/12): بیت المقدس", es: "Resolución 118 (12/12) de la IIFA sobre Jerusalén", fr: "Résolution 118 (12/12) de l'IIFA sur Jérusalem", tr: "Uluslararası İslami Fiqh Akademisi Kararı 118 (12/12) Al-Quds Al-Şerif ile ilgili", id: "Resolusi Akademi Fiqh Islam Internasional 118 (12/12) mengenai Al-Quds Al-Sharif" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد اطلاعه على ما سماه تصريحات ومقترحات من مسؤولين إسرائيليين بشأن القدس. نص بلسانه على: أن مدينة القدس تمثل جزءًا من عقيدة المسلمين لأن فيها وقعت معجزة الإسراء والمعراج؛ أن إسلامية المدينة ومسجدها ثابتة بنص قرآني غير قابلة للنقض أو التغيير ولا مجال للحلول الوسط بشأنها؛ أن المسجد الأقصى للمسلمين وحدهم ولا يخضع للمفاوضات، مع تحذيره من مخاطر المساس بحرمته وتحميله سلطات الاحتلال مسؤولية أي اعتداء عليه؛ وأنه لا يتحقق سلام عادل ولا استقرار في المنطقة إلا بإنهاء الاحتلال عن القدس وعودة فلسطين. سُجّل بوصفه نص المجمع ذاته، ملخصًا بحياد ومنسوبًا إليه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after reviewing what it calls statements and proposals by Israeli officials concerning Jerusalem. In its own voice it declared: that Jerusalem is part of Muslim belief because the Isra' and Mi'raj occurred there; that the city's and its mosque's Islamic character is established by Qur'anic text, irrevocable and not open to compromise; that Al-Aqsa Mosque belongs to Muslims alone and may not be subject to negotiations, warning of the dangers of violating its sanctity and holding the occupying authorities responsible for any assault on it; and that no just peace or stability in the region can be achieved without ending the occupation of Jerusalem and restoring Palestine. Recorded as the Academy's own text, summarised neutrally and attributed to it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، اس کے بقول اسرائیلی عہدیداروں کی جانب سے قدس کے بارے میں بیانات اور تجاویز کے مطالعے کے بعد۔ اپنی زبانی میں اس نے اعلان کیا: قدس مسلمانوں کے عقیدے کا حصہ ہے کیونکہ معراج کا معجزہ وہیں پیش آیا؛ شہر اور اس کی مسجد کی اسلامیت قرآنی نص سے ثابت ہے، ناقص و ناقابلِ تبدیل اور سمجھوتے کے قابل نہیں؛ مسجد اقصیٰ صرف مسلمانوں کی ہے اور مذاکرات کا موضوع نہیں سکتی، اس کی حرمت کو نقصان کے خطرات کی تنبیہ کرتے ہوئے اور قابض حکام کو کسی بھی حملے کا ذمہ دار ٹھہرایا؛ اور علاقے میں منصفانہ امن اور استحکام اسی وقت ممکن ہے جب قدس سے قبضہ ختم ہو اور فلسطین واپس ملے۔ یہاں اکیڈمی کے اپنے متن کا غیر جانبدارانہ خلاصہ اسی کو منسوب کر کے درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), tras revisar lo que denomina declaraciones y propuestas de funcionarios israelíes sobre Jerusalén. En su propia voz, declaró: que Jerusalén forma parte de la creencia musulmana porque allí tuvieron lugar el Isra' y el Mi'raj; que el carácter islámico de la ciudad y su mezquita está establecido por el texto coránico, irrevocable e innegociable; que la Mezquita de Al-Aqsa pertenece exclusivamente a los musulmanes y no puede ser objeto de negociación, advirtiendo de los peligros de violar su santidad y responsabilizando a las autoridades ocupantes de cualquier agresión contra ella; y que no se puede lograr una paz justa ni estabilidad en la región sin poner fin a la ocupación de Jerusalén y restaurar Palestina. Registrada como texto propio de la Academia, resumida de forma neutral y atribuida a ella."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), après examen des déclarations et propositions des autorités israéliennes concernant Jérusalem. L'Académie a déclaré: que Jérusalem fait partie intégrante de la foi musulmane car l'Isra et le Mi'raj s'y sont déroulés; que le caractère islamique de la ville et de sa mosquée est établi par le texte coranique, irrévocable et non négociable; que la mosquée Al-Aqsa appartient exclusivement aux musulmans et ne saurait faire l'objet de négociations, mettant en garde contre les dangers d'une atteinte à son caractère sacré et tenant les autorités occupantes responsables de toute attaque; et qu'aucune paix juste ni stabilité dans la région ne peut être instaurée sans la fin de l'occupation de Jérusalem et la restauration de la Palestine. Ce texte est conservé tel quel, résumé de manière neutre et attribué à l'Académie."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Riyad'daki on ikinci oturumunda (25 Cumedül-Akhirah – 1 Rajab 1421 H, 23–28 Eylül 2000) ortak kararı, İsrailli yetkililerin Kudüs ile ilgili açıklama ve önerilerini inceledikten sonra. Kendi sözleriyle şöyle belirtti: Kudüs şehri Müslüman inancının bir parçası çünkü İsra ve Mi'raj mucizesinin gerçekleştiği yerdir; şehrin ve caminin İslami statüsü geri alınamayan veya değiştirilemeyen bir Kur'an metniyle kurulmuş, uzlaşmaya yer yoktur; Mescid-i Aksa Camii'nin yalnızca Müslümanlara ait olduğu ve müzakere konusu olmadığı, kutsallığının ihlal edilmesinin tehlikelerine karşı uyarıda bulunulması ve işgal otoritelerini herhangi bir saldırıdan sorumlu tutma tehlikelerine karşı uyarıldığı; ve bölgede adil barış veya istikrarın, Kudüs'ün işgalinin sona erdirilmesi ve Filistin'in geri verilmediği için sağlanamayacağıdır. Meclisin aynı metni olarak kaydedilmiş, tarafsızlık özeti olarak kaydedilmiş ve ona atfedilmiştir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000), setelah meninjau apa yang disebut pernyataan dan usulan dari pejabat Israel mengenai Yerusalem. Surat itu menyatakan dengan kata-katanya sendiri: bahwa kota Yerusalem adalah bagian dari ajaran Muslim karena di sanalah mukjizat Isra dan Mi'raj terjadi; bahwa status Islam kota dan masjidnya ditetapkan oleh teks Al-Qur'an yang tidak dapat dicabut atau diubah, dan bahwa tidak ada ruang untuk kompromi; bahwa Masjid Al-Aqsa hanya milik Muslim dan tidak dapat dinegosiasikan, memperingatkan bahaya pelanggaran kesuciannya dan menyalahkan otoritas pendudukan atas agresi apapun; dan bahwa tidak ada perdamaian atau stabilitas yang adil di wilayah tersebut yang dapat dicapai kecuali dengan mengakhiri pendudukan Yerusalem dan pengembalian Palestina. Dicatat sebagai teks yang sama dari Majelis, ringkasan netralitas dan dikaitkan dengannya."
