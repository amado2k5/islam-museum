label: { ar: "حكم التقشير الكيميائي للجلد", en: "Chemical peeling of the skin", ur: "جلد کی کیمیکل پیلنگ کا حکم" }
summary:
  ar: "سائل سأل عن التقشير الكيميائي للوجه والكفين والرقبة وسائر أجزاء الجسم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21941)⁩ أنه أمر جائز شرعًا سواء كان للتداوي أو لغرض التجميل على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about chemical peeling of the face, hands, neck and other body parts. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21941) answered that it is lawful — whether for treatment or beautification — under the controls the answer details."
  ur: "ایک سائل نے چہرے، ہاتھوں، گردن اور جسم کے دیگر حصوں کی کیمیکل پیلنگ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21941)⁩ نے جواب دیا کہ یہ جائز ہے — خواہ علاج کے لیے ہو یا آرائش کے لیے — جواب کے بیان کردہ ضوابط کے ساتھ۔"
