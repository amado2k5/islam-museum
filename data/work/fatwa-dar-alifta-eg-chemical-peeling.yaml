id: work/fatwa-dar-alifta-eg-chemical-peeling
class: work
kind: fatwa
label: { ar: "حكم التقشير الكيميائي للجلد", en: "Chemical peeling of the skin", ur: "جلد کی کیمیکل پیلنگ کا حکم", es: "Exfoliación química de la piel", fr: "Peeling chimique de la peau", tr: "Kimyasal cilt peelingine ilişkin karar", id: "Aturan tentang pengelupasan kulit secara kimia" }
summary:
  ar: "سائل سأل عن التقشير الكيميائي للوجه والكفين والرقبة وسائر أجزاء الجسم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21941)⁩ أنه أمر جائز شرعًا سواء كان للتداوي أو لغرض التجميل على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about chemical peeling of the face, hands, neck and other body parts. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21941) answered that it is lawful — whether for treatment or beautification — under the controls the answer details."
  ur: "ایک سائل نے چہرے، ہاتھوں، گردن اور جسم کے دیگر حصوں کی کیمیکل پیلنگ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21941)⁩ نے جواب دیا کہ یہ جائز ہے — خواہ علاج کے لیے ہو یا آرائش کے لیے — جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Una persona preguntó sobre la exfoliación química del rostro, las manos, el cuello y otras partes del cuerpo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21941) respondió que es lícito, ya sea para tratamiento o embellecimiento, bajo las normas que se detallan en la respuesta."
  fr: "Une personne a posé une question concernant le peeling chimique du visage, des mains, du cou et d'autres parties du corps. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21941) a répondu que cette pratique est licite, que ce soit à des fins thérapeutiques ou esthétiques, sous réserve des conditions détaillées dans la réponse."
  tr: "Bir soru soran kişi, yüz, eller, boyun ve vücudun diğer bölgelerinin kimyasal soyulması hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21941), bunun İslam hukukuna göre, ister tedavi ister kozmetik amaçlarla olsun, düzenlemelerde ayrıntılı olarak belirtildiği üzere izin verilebilir olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang pengelupasan kimia pada wajah, tangan, leher, dan bagian tubuh lainnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21941) menjawab bahwa hal itu diperbolehkan menurut hukum Islam, baik untuk pengobatan maupun kosmetik, sebagaimana dijelaskan dalam peraturan."
