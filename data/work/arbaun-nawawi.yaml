label: { ar: "الأربعون النووية", en: "al-Arba'un al-Nawawiyya (Nawawi's Forty)" }
summary:
  ar: "الأحاديث الجامعة التي أخذها الإمام أبو زكريا يحيى النووي من مجلس «الأحاديث الكلية» لابن الصلاح (ستة وعشرون حديثاً) وزاد عليها حتى تمت اثنين وأربعين حديثاً وسمّى كتابه «الأربعين»؛ اشتهرت وكثر حفظها، وعلق عليها الشارحون كثيراً."
  en: "The famous collection of concise hadiths that Imam Abu Zakariyya Yahya al-Nawawi took from Ibn al-Salah's 'al-Ahadith al-Kulliyya' (twenty-six hadiths) and expanded to forty-two, naming it 'al-Arba'un'; widely memorised and much commented upon."
