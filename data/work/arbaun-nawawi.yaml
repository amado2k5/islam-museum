summary:
  ar: "جمع الإمام أبو زكريا يحيى النووي فيه اثنين وأربعين حديثاً جامعاً في أصول الدين وآدابه، أخذ أصلها من مجلس «الأحاديث الكلية» لابن الصلاح ⁦(ستة وعشرون حديثاً)⁩ وزاد عليها حتى تمّت، وسمّاه «الأربعين»؛ اشتهر وكثر حفظه، وعلّق عليه الشارحون كثيراً."
  en: "Imam Abu Zakariyya Yahya al-Nawawi's collection of forty-two comprehensive hadiths on the roots of religion and its manners. He took the core from Ibn al-Salah's session 'al-Ahadith al-Kulliyya' (twenty-six hadiths), expanded it to forty-two and named it 'al-Arba'un'. It became widely memorised and was much commented upon."
  ur: "امام ابو زکریا یحییٰ نووی کا مجموعہ جس میں دین کے اصول اور آداب پر بیالیس جامع احادیث ہیں۔ اس کی بنیاد ابن الصلاح کی مجلس «الاحادیث الکلیہ» سے لی گئی جس میں چھبیس احادیث تھیں، نووی نے اضافہ کر کے انہیں بیالیس کیا اور اس کا نام «الاربعین» رکھا۔ یہ بہت زیادہ حفظ کیا گیا اور اس پر بہت شرحیں لکھی گئیں۔"
  es: "La colección de cuarenta y dos hadices exhaustivos del imán Abu Zakariyya Yahya al-Nawawi sobre los fundamentos de la religión y sus costumbres. Tomó la base de la serie de Ibn al-Salah, «al-Ahadith al-Kulliyya» (veintiséis hadices), la amplió a cuarenta y dos y la denominó «al-Arba'un». Esta obra se difundió ampliamente y fue objeto de numerosos comentarios."
  fr: "Le recueil de quarante-deux hadiths de l'imam Abu Zakariyya Yahya al-Nawawi, qui traite des fondements de la religion et de ses pratiques, est une étude approfondie. Il s'appuie sur le recueil d'Ibn al-Salah intitulé « al-Ahadith al-Kulliyya » (vingt-six hadiths), qu'il développe à quarante-deux et nomme « al-Arba'un ». Ce recueil est largement mémorisé et suscite de nombreux commentaires."
  tr: "İmam Ebu Zekeriye Yahya el-Nevi, dinin temelleri ve adabetleri üzerine kırk iki kapsamlı hadis derledi. Bunların orijinalini İbn al-Salah'ın 'El-Hadis el-Kuliyye' (yirmi altı hadis) koleksiyonundan alıp tamamlayana kadar ekledi. Onlara 'El-Erba'in' adını verdi; ünlü oldu ve kapsamlı şekilde ezberledi, yorumcular da onun hakkında kapsamlı yorumlarda bulundu."
  id: "Imam Abu Zakariya Yahya al-Nawawi mengumpulkan empat puluh dua hadis komprehensif tentang dasar-dasar dan adat agama. Ia mengambil aslinya dari kumpulan 'Al-Ahadith al-Kuliyya' karya Ibn al-Salah (dua puluh enam hadits) dan menambahkannya hingga selesai. Ia menyebutnya 'Al-Arba'in'; ia menjadi terkenal dan sangat dihafal, dan para komentator banyak mengomentari dirinya."
