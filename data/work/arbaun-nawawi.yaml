label: { ar: "الأربعون النووية", en: "al-Arba'un al-Nawawiyya (Nawawi's Forty)" }
summary:
  ar: "جمع الإمام أبو زكريا يحيى النووي فيه اثنين وأربعين حديثاً جامعاً في أصول الدين وآدابه، أخذ أصلها من مجلس «الأحاديث الكلية» لابن الصلاح ⁦(ستة وعشرون حديثاً)⁩ وزاد عليها حتى تمّت، وسمّاه «الأربعين»؛ اشتهر وكثر حفظه، وعلّق عليه الشارحون كثيراً."
  en: "Imam Abu Zakariyya Yahya al-Nawawi's collection of forty-two comprehensive hadiths on the roots of religion and its manners. He took the core from Ibn al-Salah's session 'al-Ahadith al-Kulliyya' (twenty-six hadiths), expanded it to forty-two and named it 'al-Arba'un'. It became widely memorised and was much commented upon."
  ur: "امام ابو زکریا یحییٰ نووی کا مجموعہ جس میں دین کے اصول اور آداب پر بیالیس جامع احادیث ہیں۔ اس کی بنیاد ابن الصلاح کی مجلس «الاحادیث الکلیہ» سے لی گئی جس میں چھبیس احادیث تھیں، نووی نے اضافہ کر کے انہیں بیالیس کیا اور اس کا نام «الاربعین» رکھا۔ یہ بہت زیادہ حفظ کیا گیا اور اس پر بہت شرحیں لکھی گئیں۔"
