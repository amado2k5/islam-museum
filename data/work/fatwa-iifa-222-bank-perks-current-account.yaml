label: { ar: "قرار مجمع الفقه الإسلامي الدولي 222 (23/6) بشأن المزايا التي يمنحها المصرف لعملاء الحساب الجاري من المنظور الشرعي", en: "IIFA resolution 222 (23/6) on the perks a bank grants current-account clients from the sharia perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 222 (23/6): بینک کے کرنٹ اکاؤنٹ کے گاہکوں کو دینے والی سہولتیں — شرعی تناظر", es: "Resolución 222 (23/6) de la IIFA sobre las ventajas que un banco otorga a los clientes con cuenta corriente desde la perspectiva de la sharia.", fr: "Résolution 222 (23/6) de l'IIFA relative aux avantages accordés par une banque à ses clients titulaires de comptes courants, du point de vue de la charia", tr: "Uluslararası İslami Fiqh Akademisi Kararı 222 (23/6), bankanın cari hesap müşterilerine Şeriat açısından sağladığı avantajlara ilişkin", id: "Resolusi International Islamic Fiqh Academy 222 (23/6) mengenai manfaat yang diberikan oleh bank kepada nasabah rekening giro dari perspektif Syariah" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩. عرّف المجمع الحساب الجاري بأنه سجل للمبالغ التي يقدمها العميل للبنك — الإسلامي أو التقليدي — يتيح له سحبها في أي وقت بوسائل معروفة كالشيكات والحوالات والسحب النقدي، وتكون المبالغ مضمونة في ذمة المصرف يستعملها لفائدته حسب القوانين. وخلص في تكييفه الشرعي إلى تأكيد قراره 86 ⁦(9/3)⁩ بأن الودائع تحت الطلب ⁦(الحسابات الجارية)⁩ لدى البنوك الإسلامية والربوية هي قروض بالمنظور الفقهي. وعرّف المزايا المصرفية بالحقوق الإضافية التي يمنحها البنك لأصحاب الحسابات الجارية جذبًا وتشجيعًا، وهي لنفع العميل وحده أو للطرفين. فأما مزايا العميل المعنوية — كأفضلية الخدمة والنشرة الإرشادية وكشف الحساب وشهادة الملاءة وبطاقة الصراف — فجائزة لأنها ليست زيادة مالية ربوية بل مساعدة المقترض ⁦(البنك)⁩ للمقرض ⁦(العميل)⁩ في استيفاء حقه؛ وأما المزايا المادية — كالأجهزة والتذاكر الزائدة على مبلغ الحساب مشروطة كانت أو غير مشروطة — فممنوعة إذا كانت بسبب الإقراض وبالنظر لحجمه ومدته لكونها من جنس الزيادة الربوية، وإن أعطيت لكل عميل جديد في أي حساب فهي من نفقات الإعلان والتسويق فمباحة ما لم ترتبط بالإقراض حجمًا ومدة. وأما مزايا الطرفين فما كان منها متعلقًا بعمليات الإيداع والسحب كدفتر الشيكات وبطاقة الصراف جائز لأن المنفعة تعم البنك والعميل دون ضرر؛ وما كان منفعه للطرفين دون صلة بالإيداع والسحب كخدمات بأسعار تفاضلية في صرف العملات ورسوم الحوالات ففصّل فيه القرار."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018). It defined the current account as a record of sums a client gives the bank — Islamic or conventional — which he may withdraw at any time by known means such as cheques, transfers and cash withdrawal, the deposits being guaranteed in the bank's liability and used for its benefit as the laws regulate. On its legal characterisation it reaffirmed resolution 86 (9/3): demand deposits (current accounts) at Islamic or usurious banks are, in juristic terms, loans. It defined banking perks as the additional rights a bank grants current-account holders to attract and keep them — either for the client's benefit alone or for both parties. Perks for the client alone that are immaterial — priority service, periodic advisory bulletins, statements, solvency certificates, ATM privilege cards — are permissible, not being a usurious financial increase but the borrower's (the bank's) help to the lender (the client) in collecting his right. Material perks — appliances, electronics, air tickets exceeding the account's balance, conditioned or not — are forbidden where given because of the loan, in view of its size and term, as being of the kind of usurious increase; but where given to every new client in any account they count as advertising and marketing expense and are permissible so long as unconnected to the loan's size and term. As for mutual perks: those connected to deposit and withdrawal operations, such as cheque books and ATM cards, are permissible since the benefit covers bank and client with no harm to either; those benefiting both but unrelated to deposits and withdrawals, such as preferential pricing on currency exchange and transfer fees, are treated in detail in the resolution."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں۔ اکیڈمی نے کرنٹ اکاؤنٹ کی تعریف گاہک کی جانب سے بینک ⁦(اسلامی ہو یا روایتی)⁩ کو دی گئی رقموں کا ریکارڈ کے طور پر کی جسے وہ کسی وقت معروف ذرائع ⁦(چیک، حوالے، نقد نکالنا)⁩ سے نکال سکتا ہے، اور وہ رقمیں بینک کی ذمہ میں ضمانت شدہ ہوتی ہیں جو وہ اپنے فائدے کے لیے قوانین کے مطابق استعمال کرتا ہے۔ شرعی تکیف میں اس نے اپنی قرارداد 86 ⁦(9/3)⁩ کی تائید کی کہ اسلامی اور سودی بینکوں دونوں میں ڈیمانڈ ڈپازٹس ⁦(کرنٹ اکاؤنٹس)⁩ فقہی لحاظ سے قرض ہیں۔ بینکنگ سہولتوں کی تعریف گاہکوں کو راغب رکھنے کے لیے دی جانے والی اضافی سہولتوں کے طور پر کی — یا صرف گاہک کے فائدے کے لیے یا دونوں فریقوں کے لیے۔ صرف گاہک کے فائدے کی غیر مادی سہولتیں — ترجیحی سروس، دوری مشاورتی رسالے، اکاؤنٹ سٹیٹمنٹ، سالوینسی سرٹیفکیٹ، اے ٹی ایم پرولیج کارڈ — جائز ہیں کیونکہ یہ سودی مالی اضافہ نہیں بلکہ مقروض ⁦(بینک)⁩ کی طرف سے مقرض ⁦(گاہک)⁩ کو اس کے حق کے حصول میں مدد ہے۔ مادی سہولتیں — بیلنس سے زائد آلات، الیکٹرانکس، ہوائی ٹکٹ، مشروط ہوں یا نہ — ممنوع ہیں اگر وہ قرض کی وجہ سے ہوں اور اس کے حجم و مدت کو دیکھتے ہوئے ہوں کیونکہ یہ سودی اضافے کی جنس سے ہیں؛ مگر اگر ہر نئے گاہک کو کسی بھی اکاؤنٹ میں دی جائیں تو یہ اشتہار و مارکیٹنگ کا خرچہ ہے اور جائز ہیں بشرطیکہ قرض کے حجم و مدت سے منسلک نہ ہوں۔ باہمی فائدے کی سہولتوں میں، ڈپازٹ اور نکالنے کے عمل سے جڑی جیسے چیک بک اور اے ٹی ایم کارڈ جائز ہیں کیونکہ فائدہ دونوں فریقوں کو پہنچتا ہے بغیر کسی نقصان کے؛ اور دونوں فریقوں کو فائدہ دینے والی مگر ڈپازٹ و نکالنے سے غیر متعلق جیسے کرنسی مبادلہ اور حوالوں کی فیس پر رعایتی نرخ — قرارداد میں تفصیل سے بیان ہوئی ہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018). Definió la cuenta corriente como un registro de sumas que un cliente entrega al banco —islámico o convencional—, las cuales puede retirar en cualquier momento por medios conocidos como cheques, transferencias y retiros de efectivo. Los depósitos están garantizados por la responsabilidad del banco y se utilizan en su beneficio según lo regulan las leyes. Respecto a su caracterización legal, reafirmó la resolución 86 (9/3): los depósitos a la vista (cuentas corrientes) en bancos islámicos o usurarios son, en términos jurídicos, préstamos. Definió los beneficios bancarios como los derechos adicionales que un banco otorga a los titulares de cuentas corrientes para atraerlos y retenerlos, ya sea en beneficio exclusivo del cliente o de ambas partes. Los beneficios exclusivos para el cliente que no sean sustanciales —servicio prioritario, boletines informativos periódicos, extractos, certificados de solvencia, tarjetas de cajero automático— están permitidos, ya que no constituyen un aumento usurario, sino una ayuda del prestatario (el banco) al prestamista (el cliente) para cobrar su derecho. Los beneficios sustanciales —electrodomésticos, aparatos electrónicos, billetes de avión que superen el saldo de la cuenta, condicionados o no— están prohibidos cuando se otorgan debido al préstamo, en vista de su importe y plazo, por considerarse un aumento usurario; pero cuando se otorgan a cada nuevo cliente en cualquier cuenta, se consideran gastos de publicidad y marketing y están permitidos siempre que no estén relacionados con el importe y el plazo del préstamo. En cuanto a los beneficios mutuos: aquellos relacionados con las operaciones de depósito y retirada, como chequeras y tarjetas de cajero automático, están permitidos, ya que el beneficio cubre tanto al banco como al cliente sin perjudicar a ninguno; aquellos que benefician a ambos pero no están relacionados con los depósitos y retiradas, como precios preferenciales en el cambio de divisas y comisiones por transferencia, se tratan en detalle en la resolución."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 23e session à Médine (19-23 Safar 1440, soit 28 octobre – 1er novembre 2018) définit le compte courant comme un relevé des sommes qu'un client dépose auprès d'une banque – islamique ou conventionnelle – et qu'il peut retirer à tout moment par des moyens connus tels que chèques, virements et retraits d'espèces. Les dépôts sont garantis par la banque et utilisés à son profit conformément à la réglementation. Concernant sa qualification juridique, l'Académie réaffirme la résolution 86 (9/3): les dépôts à vue (comptes courants) auprès de banques islamiques ou usuraires sont, juridiquement parlant, des prêts. Elle définit les avantages bancaires comme les droits supplémentaires qu'une banque accorde aux titulaires de comptes courants afin de les attirer et de les fidéliser, soit au seul bénéfice du client, soit au bénéfice des deux parties. Les avantages non matériels accordés exclusivement au client — service prioritaire, bulletins d'information périodiques, relevés, certificats de solvabilité, cartes privilèges de guichet automatique — sont autorisés, car ils ne constituent pas une augmentation financière usuraire, mais une aide apportée par l'emprunteur (la banque) au prêteur (le client) pour le recouvrement de ses droits. Les avantages matériels — appareils électroménagers, appareils électroniques, billets d'avion dont le montant excède le solde du compte, avec ou sans conditions — sont interdits lorsqu'ils sont accordés en raison du prêt, compte tenu de son montant et de sa durée, car ils constituent une augmentation usuraire; en revanche, lorsqu'ils sont offerts à tout nouveau client, quel que soit le compte, ils sont considérés comme des frais de publicité et de marketing et sont autorisés, à condition qu'ils ne soient pas liés au montant et à la durée du prêt. Quant aux avantages mutuels: ceux liés aux opérations de dépôt et de retrait, tels que les chéquiers et les cartes de guichet automatique, sont autorisés car ils profitent à la banque et au client sans préjudice pour aucun des deux; ceux dont bénéficient les deux parties mais qui ne sont pas liés aux dépôts et aux retraits, tels que les tarifs préférentiels sur les frais de change et de virement, sont traités en détail dans la résolution."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Safar 1440H, 28 Ekim – 1 Kasım 2018) toplu kararı. Akademi, cari hesabı, müşterinin bankaya sağladığı tutarların kaydı olarak tanımlamıştır—İslami veya geleneksel olsun—ve müşterinin çek, transfer ve nakit çekim gibi bilinen yöntemlerle istediği zaman para çekmesine olanak tanır ve bu tutarlar banka tarafından yasalara göre kendi yararına kullanılmasını garanti eder. Şeriat sınıflandırmasında, 86 (9/3) sayılı kararını onaylayarak İslami ve tefeci bankalardaki talep mevduatlarının (cari hesapların) hukuki açıdan kredi olduğunu onaylamıştır. Bankacılık faydalarını, bankanın cari hesap sahiplerine çekim ve teşvik olarak verdiği ek haklar olarak tanımlamıştır; bu haklar yalnızca müşteriye veya her iki tarafa fayda sağlamaktadır. Müşterinin ahlaki faydaları — hizmet tercihi, rehberlik bülteni, hesap ekstresi, ödeme sertifikası ve ATM kartı gibi — kabul edilebilir çünkü bunlar faiz tefecilik mali artışlar değil, borçlunun (bankanın) haklarını yerine getirmesine yardımcı olur; maddi faydalar ise—örneğin hesap tutarını aşan cihazlar ve biletler, ister koşullu ister koşulsuz—kredi verilmesinden kaynaklanıyorsa, büyüklüğü ve süresi göz önüne alındığında yasaktır, çünkü bunlar faiz artışlarıdır. Her yeni müşteriye herhangi bir hesapta verildiğinde, reklam ve pazarlama giderlerinin bir parçasıdır ve kredi hacmi ve süresi açısından kredi ile ilgili olmadıkça kabul edilebilirler. Her iki tarafın faydaları açısından, çek defterleri ve ATM kartları gibi para yatırma ve çekme işlemleriyle ilgili olanlar da kabul edilebilir çünkü bu fayda hem bankaya hem de müşteriye zarar vermeden uzanır; ve bu avantajlar, para birimi dövizinde farklı kurlarda hizmetler ve transfer ücretleri gibi para yatırma ve çekimlerle ilgili değildir ve karar belirleyicidir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Sabat 1440H, 28 Oktober – 1 November 2018). Akademi mendefinisikan rekening giro sebagai catatan jumlah yang diberikan oleh klien kepada bank—Islam atau konvensional—yang memungkinkan mereka menarik kapan saja dengan cara yang diketahui seperti cek, transfer, dan penarikan tunai, dan jumlah tersebut dijamin oleh bank untuk digunakan sesuai dengan hukum. Dalam klasifikasi Syariahnya, akademi menyimpulkan dengan menegaskan keputusan 86 (9/3) bahwa deposito giro (rekening giro) di bank Islam dan bank riba adalah pinjaman dari perspektif yurisprudensi. Akademi mendefinisikan manfaat perbankan sebagai hak tambahan yang diberikan bank kepada pemegang rekening giro sebagai daya tarik dan dorongan, yang menguntungkan klien sendiri atau kedua belah pihak. Adapun manfaat moral pelanggan—seperti preferensi layanan, buletin panduan, laporan akun, sertifikat solvabilitas, dan kartu ATM—manfaat tersebut diperbolehkan karena bukan peningkatan keuangan riba melainkan membantu peminjam (bank) memenuhi haknya; sedangkan manfaat materiil—seperti perangkat dan tiket melebihi jumlah rekening, baik bersyarat maupun tanpa syarat—manfaat tersebut dilarang jika disebabkan oleh pinjaman dan mengingat ukuran serta durasinya, karena merupakan kenaikan riba. Jika diberikan kepada setiap pelanggan baru dalam rekening manapun, manfaat tersebut merupakan bagian dari biaya iklan dan pemasaran dan diperbolehkan kecuali terkait dengan pinjaman dalam hal volume dan durasi. Adapun manfaat kedua belah pihak, manfaat yang terkait dengan operasi setoran dan penarikan seperti buku cek dan kartu ATM diperbolehkan karena manfaat tersebut berlaku untuk bank dan nasabah tanpa merugikan; dan manfaat tersebut tidak terkait dengan setoran dan penarikan, seperti layanan dengan kurs berbeda dalam penukaran mata uang dan biaya transfer, dan keputusan tersebut menjadi penentu."
