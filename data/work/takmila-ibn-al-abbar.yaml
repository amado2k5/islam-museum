summary:
  ar: "معجم ابن الأبار البلنسي في تراجم علماء الأندلس وشعرائها ووزرائها، وهو من أعمدة المقري في نفح الطيب — يستشهد به في تراجم الرشاطي وابن خفاجة وأبي الربيع الكلاعي وغيرهم وفيه كثير من أخبار ضياع المدن الأندلسية {cite:nafh-tib-maqqari p. 455-477}."
  en: "Ibn al-Abbar's great biographical dictionary of al-Andalus's scholars, poets and viziers — al-Maqqari's principal quarry in Nafh al-Tib, cited for al-Rushati, Ibn Khafaja, al-Kila'i and the chronicle of the cities' fall {cite:nafh-tib-maqqari p. 455-477}."
  es: "El gran diccionario biográfico de Ibn al-Abbar sobre los eruditos, poetas y visires de al-Andalus: la principal cantera de al-Maqqari en Nafh al-Tib, citado por al-Rushati, Ibn Khafaja, al-Kila'i y la crónica de la caída de las ciudades {citar:nafh-tib-maqqari p. 455-477}."
  fr: "Le grand dictionnaire biographique d'Ibn al-Abbar sur les érudits, poètes et vizirs d'al-Andalus — la principale carrière d'al-Maqqari dans Nafh al-Tib, cité pour al-Rushati, Ibn Khafaja, al-Kila'i et la chronique de la chute des villes {cite:nafh-tib-maqqari p. 455-477}."
  ur: "ابن العبر کی اندلس کے علماء، شاعروں اور وزیروں کی عظیم سوانح عمری لغت - المقاری کی نفح الطب میں اصل کان جس کا حوالہ الراشطی، ابن خفجہ، الکلعی اور شہروں کے زوال کی تاریخ کے لیے نقل کیا گیا ہے۔ 455-477}۔"
  tr: "İbn el-Ebâr el-Dengeli'nin Endülüs alimleri, şairleri ve din adamlarının biyografileri üzerine sözlüğü, Nafh al-Tib'deki el-Maqri'nin temel taşlarından biridir — el-Raşeti, İbn Hafajah, Ebu el-Rabi' el-Kal'i ve diğerlerinin biyografilerinde atıfta bulunulur ve Endülüs şehirlerinin kaybına dair birçok anlatı içerir {atıf:nafh-tib-maqqari s. 455-477}."
  id: "Kamus Ibn al-Abar al-Balansi tentang biografi para cendekiawan, penyair, dan menteri al-Andalusia, yang merupakan salah satu pilar al-Maqri dalam Nafh al-Tib — dikutip dalam biografi al-Rashati, Ibn Khafajah, Abu al-Rabi' al-Kala'i, dan lainnya, serta memuat banyak catatan tentang hilangnya kota-kota Andalusia {cite:nafh-tib-maqqari hlm. 455-477}."
