id: work/fatwa-iifa-243-prayer-behind-phone-radio-television
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 243 (25/5) بشأن بيان حكم الصلاة خلف الهاتف والمذياع والتلفاز", en: "IIFA resolution 243 (25/5) clarifying the ruling on praying behind a telephone, radio or television", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 243 (25/5): ٹیلیفون، ریڈیو اور ٹیلیویژن کے پیچھے نماز پڑھنے کے حکم کا بیان", es: "Resolución 243 (25/5) de la IIFA que aclara la norma sobre rezar detrás de un teléfono, radio o televisor.", fr: "Résolution 243 (25/5) de l'IIFA clarifiant la règle concernant la prière derrière un téléphone, une radio ou une télévision" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، وقد نظر في مستجدات تقنيات الاجتماعات عبر الفضاء الافتراضي ووسائل التواصل وما اقتضته جائحة كورونا من تعليق الصلوات بالمساجد والتباعد ومنع الخروج من المنازل. قرر المجمع أن من شروط صحة الائتمام اتحاد المكان والزمان بين الإمام والمأموم حقيقة أو حكمًا، وقدرة المأموم على رؤية إمامه أو رؤية من يرى الإمام، وسماع التكبيرات المباشرة ولو في بعض أحوال الصلاة، وأن الصلاة خلف الهاتف أو المذياع أو التلفاز لا تصح قريبًا كان المأموم أم بعيدًا لانقطاع التبعية بينهما في المكان ولاختلال تلك الشروط، ولما يترتب عليها من مفاسد كإبطال السعي إلى الجمع والجماعات وتعطيل عمارة المساجد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), which considered the new developments in virtual-meeting and communication technologies and the measures the COVID-19 pandemic had required — suspension of mosque prayers, distancing that left mosques too small for worshippers, and at times curfews. It ruled that valid following in prayer requires that imam and follower share the same place and time in fact or in effect, that the follower can see the imam or see someone who sees him, and can hear the takbirs directly in at least some parts of the prayer; and that prayer behind a telephone, radio or television is not valid whether the follower is near or far, because the link of following is broken in place and those conditions are unmet, and because of the grave harms that follow — nullifying the striving for Friday and congregational prayers and leaving mosques unpeopled."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، جس نے ورچوئل میٹنگ اور مواصلات کی ٹیکنالوجی کی نئی صورتوں اور کورونا وبا کے اقتضا — مسجدوں میں نمازوں کی معطلی، فاصلہ جو مسجدوں کو نمازیوں کے لیے تنگ کر دے، اور کبھی گھروں سے نکلنے کی ممانعت — پر غور کیا۔ اکیڈمی نے فیصلہ کیا کہ صحیح اقتداء کے لیے امام اور مقتدی کا مکان اور زمان میں حقیقتاً یا حکماً متفق ہونا، مقتدی کا امام کو یا امام کو دیکھنے والے کو دیکھ سکنا، اور کم از کم نماز کے بعض اوقات تکبیریں براہِ راست سننا شرط ہے؛ اور ٹیلیفون، ریڈیو یا ٹیلیویژن کے پیچھے نماز صحیح نہیں خواہ مقتدی قریب ہو یا دور، کیونکہ مکان میں تابعیت کا رابطہ منقطع ہوجاتا ہے اور یہ شرائط خلل پذیر ہوتی ہیں، نیز اس کے سنگین مفاسد ہیں: جمعہ اور جماعتوں کی سعی کا ابطال اور مسجدوں کی عمارت کا تعطل۔"
  es: "Una resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023), que consideró los nuevos desarrollos en tecnologías de reuniones virtuales y comunicación y las medidas que la pandemia de COVID-19 había requerido: suspensión de las oraciones en las mezquitas, distanciamiento que dejó las mezquitas demasiado pequeñas para los fieles y, en ocasiones, toques de queda. Dictaminó que para que la oración sea válida, el imán y el fiel deben compartir el mismo lugar y tiempo de hecho o en efecto, que el fiel pueda ver al imán o a alguien que lo vea, y que pueda oír los takbirs directamente en al menos algunas partes de la oración; y que la oración detrás de un teléfono, radio o televisión no es válida, ya sea que el fiel esté cerca o lejos, porque el vínculo de seguimiento se rompe en el lugar y no se cumplen esas condiciones, y debido a los graves perjuicios que se derivan: anular el esfuerzo por las oraciones del viernes y las oraciones en congregación y dejar las mezquitas vacías."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, soit du 20 au 23 février 2023), a examiné les évolutions récentes des technologies de réunion et de communication virtuelles ainsi que les mesures imposées par la pandémie de COVID-19: suspension des prières dans les mosquées, distanciation sociale réduisant leur capacité d'accueil et instauration de couvre-feux. L'Académie a statué que la validité de la prière requiert la présence physique (en réalité ou en pratique) de l'imam et du fidèle au même lieu et au même moment, que le fidèle puisse voir l'imam ou une personne le voyant, et qu'il puisse entendre directement les takbirs pendant au moins certaines parties de la prière. Elle a également statué que la prière suivie derrière un téléphone, une radio ou une télévision n'est pas valide, que le fidèle soit proche ou éloigné, car le lien spirituel est rompu et ces conditions ne sont pas remplies, ce qui entraîne de graves conséquences: la perte de la prière du vendredi et des prières en congrégation, et la désertion des mosquées."
