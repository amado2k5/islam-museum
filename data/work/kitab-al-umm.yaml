summary:
  ar: "كتاب الأم للإمام محمد بن إدريس الشافعي ⁦(150-204هـ)⁩، يرويه عنه الربيع بن سليمان المرادي، ويعرض فيه الشافعي مسائل الفقه بأبوابها مع حججه، ويناظر فيه مخالفيه. في جزئه الثامن كتب الدعوى والبينات والشهادات والأيمان والنذور، وثلاثة كتب في الخلاف: اختلاف العراقيين ⁦(ما اختلف فيه أبو حنيفة وابن أبي ليلى برواية أبي يوسف)⁩، واختلاف علي وعبد الله بن مسعود، واختلاف مالك والشافعي. {cite:kitab-al-umm-wafa-v8 p.1} {cite:kitab-al-umm-wafa-v8 p.217} {cite:kitab-al-umm-wafa-v8 p.513}"
  en: "Kitab al-Umm of the Imam Muhammad ibn Idris al-Shafi'i (150-204 AH), transmitted from him by al-Rabi' ibn Sulayman al-Muradi, in which al-Shafi'i sets out the questions of law chapter by chapter with his arguments and debates his opponents. Its eighth volume holds the books of claims and evidence, testimony, and oaths and vows, and three books on disagreement: the Disagreement of the Iraqis (where Abu Hanifa and Ibn Abi Layla differed, as related by Abu Yusuf), the Disagreement of Ali and Abd Allah ibn Mas'ud, and the Disagreement of Malik and al-Shafi'i."
  ur: "امام محمد بن ادریس شافعی ⁦(150-204ھ)⁩ کی کتاب الام، جسے ان سے ربیع بن سلیمان مرادی روایت کرتے ہیں؛ اس میں امام شافعی فقہ کے مسائل ابواب کی ترتیب سے اپنے دلائل کے ساتھ بیان کرتے ہیں اور مخالفین سے مناظرہ کرتے ہیں۔ اس کی آٹھویں جلد میں دعویٰ و بینات، شہادات، اور ایمان و نذور کی کتابیں ہیں، اور اختلاف پر تین کتابیں: اختلاف العراقیین ⁦(جن مسائل میں امام ابو حنیفہ اور ابن ابی لیلیٰ نے اختلاف کیا، ابو یوسف کی روایت سے)⁩، اختلاف علی و عبد اللہ بن مسعود، اور اختلاف مالک و الشافعی۔"
