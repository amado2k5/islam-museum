summary:
  ar: "كتاب الأم للإمام محمد بن إدريس الشافعي ⁦(150-204هـ)⁩، يرويه عنه الربيع بن سليمان المرادي، ويعرض فيه الشافعي مسائل الفقه بأبوابها مع حججه، ويناظر فيه مخالفيه. في جزئه الثامن كتب الدعوى والبينات والشهادات والأيمان والنذور، وثلاثة كتب في الخلاف: اختلاف العراقيين ⁦(ما اختلف فيه أبو حنيفة وابن أبي ليلى برواية أبي يوسف)⁩، واختلاف علي وعبد الله بن مسعود، واختلاف مالك والشافعي. {cite:kitab-al-umm-wafa-v8 p.1} {cite:kitab-al-umm-wafa-v8 p.217} {cite:kitab-al-umm-wafa-v8 p.513}"
  en: "Kitab al-Umm of the Imam Muhammad ibn Idris al-Shafi'i (150-204 AH), transmitted from him by al-Rabi' ibn Sulayman al-Muradi, in which al-Shafi'i sets out the questions of law chapter by chapter with his arguments and debates his opponents. Its eighth volume holds the books of claims and evidence, testimony, and oaths and vows, and three books on disagreement: the Disagreement of the Iraqis (where Abu Hanifa and Ibn Abi Layla differed, as related by Abu Yusuf), the Disagreement of Ali and Abd Allah ibn Mas'ud, and the Disagreement of Malik and al-Shafi'i."
  ur: "امام محمد بن ادریس شافعی ⁦(150-204ھ)⁩ کی کتاب الام، جسے ان سے ربیع بن سلیمان مرادی روایت کرتے ہیں؛ اس میں امام شافعی فقہ کے مسائل ابواب کی ترتیب سے اپنے دلائل کے ساتھ بیان کرتے ہیں اور مخالفین سے مناظرہ کرتے ہیں۔ اس کی آٹھویں جلد میں دعویٰ و بینات، شہادات، اور ایمان و نذور کی کتابیں ہیں، اور اختلاف پر تین کتابیں: اختلاف العراقیین ⁦(جن مسائل میں امام ابو حنیفہ اور ابن ابی لیلیٰ نے اختلاف کیا، ابو یوسف کی روایت سے)⁩، اختلاف علی و عبد اللہ بن مسعود، اور اختلاف مالک و الشافعی۔"
  es: "El Kitab al-Umm del Imam Muhammad ibn Idris al-Shafi'i (150-204 AH), transmitido por al-Rabi' ibn Sulayman al-Muradi, expone las cuestiones de derecho capítulo por capítulo con sus argumentos y debate con sus oponentes. Su octavo volumen contiene los libros de alegaciones y pruebas, testimonios, juramentos y votos, y tres libros sobre desacuerdos: el Desacuerdo de los Iraquíes (donde Abu Hanifa e Ibn Abi Layla discreparon, según relata Abu Yusuf), el Desacuerdo de Ali y Abd Allah ibn Mas'ud, y el Desacuerdo de Malik y al-Shafi'i."
  fr: "Le Kitab al-Umm de l'imam Muhammad ibn Idris al-Shafi'i (150-204 AH), transmis par al-Rabi' ibn Sulayman al-Muradi, est un ouvrage dans lequel al-Shafi'i expose les questions de droit chapitre par chapitre, en présentant ses arguments et en réfutant les arguments de ses adversaires. Son huitième volume contient les livres des prétentions et des preuves, des témoignages, des serments et des vœux, ainsi que trois livres sur les désaccords: le désaccord des Irakiens (où Abu Hanifa et Ibn Abi Layla divergeaient, selon le récit d'Abu Yusuf), le désaccord d'Ali et d'Abd Allah ibn Mas'ud, et le désaccord de Malik et d'al-Shafi'i."
  tr: "İmam Muhammed bin İdris el-Şafii'nin (150-204 H) Anne Kitabı, el-Rabi' bin Süleyman el-Muradi tarafından ondan anlatılmıştır. Bu kitapta el-Şafii, kendi bölümlerinde fıkh meselelerini ve argümanlarını sunar, karşıtlarıyla tartışır. Sekizinci cildinde iddialar, deliller, tanıklıklar, yemin ve yeminler üzerine yazdı; üç kitap da anlaşmazlık üzerine yazdı: Iraklılar arasındaki farklılıklar (Ebu Hanifa ile İbn Ebi Leyla'nın Ebu Yusuf'un rivayetine göre farklı görüşler), Ali ile Abdullah ibn Mas'ud arasındaki anlaşmazlık ve Malik ile el-Şafii arasındaki anlaşmazlık. {alıntı:kitab-al-um-wafa-v8 s.1} {cite:kitab-al-um-wafa-v8 s.217} {cite:kitab-al-um-wafa-v8 s.513}"
  id: "Kitab Ibu oleh Imam Muhammad ibn Idris al-Shafi'i (150-204 H), yang diceritakan darinya oleh al-Rabi' ibn Sulayman al-Muradi. Dalam buku itu, al-Shafi'i menyajikan isu-isu yurisprudensi dalam bab-bab mereka beserta argumennya, dan berdebat dengan lawan-lawannya. Dalam jilid kedelapan, ia menulis tentang klaim, bukti, kesaksian, sumpah, dan janji, serta tiga buku tentang perbedaan pendapat: perbedaan di antara orang Irak (apa yang diperbedakan Abu Hanifa dan Ibn Abi Layla menurut narasi Abu Yusuf), perbedaan pendapat antara Ali dan Abdullah ibn Mas'ud, serta perbedaan antara Malik dan al-Shafi'i. {cite:kitab-al-um-wafa-v8 hlm.1} {cite:kitab-al-um-wafa-v8 hlm.217} {cite:kitab-al-um-wafa-v8 hlm.513}"
