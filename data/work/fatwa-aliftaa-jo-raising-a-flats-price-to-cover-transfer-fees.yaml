id: work/fatwa-aliftaa-jo-raising-a-flats-price-to-cover-transfer-fees
class: work
kind: fatwa
label: { ar: "رفع سعر الشقة على البنك لتغطية رسوم التنازل", en: "Raising a flat's price to the bank to cover transfer fees", ur: "تنازل کی فیس پوری کرنے کے لیے بینک پر فلیٹ کی قیمت بڑھانا", es: "Aumentar el precio de un piso al banco para cubrir los gastos de transferencia.", fr: "Augmenter le prix d'un appartement auprès de la banque pour couvrir les frais de transfert" }
summary:
  ar: "سؤال من بائع شقة طلب منه عميل البنك رفع سعرها ليتحمل رسوم التنازل والصيانة، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك تحايل على الربا، وأنه يجوز رفع السعر مقابل إضافات حقيقية على المبيع تتم قبل توقيع العقد مع البنك. أجابت الدائرة بأن اتفاق العميل والبائع على رفع السعر على الجهة الممولة ليأخذ العميل الزيادة من البائع تحايل على الربا، لأن العميل سيسدد هذا النقد مع أرباحه، والمرابحة على النقد ربا. واستشهدت بحديث أورده ابن بطة في إبطال الحيل في النهي عن استحلال المحارم بأدنى الحيل، ونقلت تجويد ابن كثير لإسناده. وقالت إنه إن اتفق العميل مع البائع على إضافات على المبيع، وأضافها البائع قبل البيع للبنك ورفع السعر مقابلها، جاز ذلك. وقالت إن رسوم التنازل ليست جزءًا من ثمن المبيع بل خارجة عنه، فاشتراط رفع السعر لدفعها بمثابة الحصول على نقد من البنك وتوكيل البائع في دفع الرسوم، وهو من التحايل على الربا. وخلصت إلى تحريم اشتراط رفع سعر المبيع في المرابحة للآمر بالشراء لأجل دفع البائع رسوم التنازل، وإلى جواز الاتفاق على إضافات حقيقية ورفع السعر مقابلها بشرط أن تتم قبل توقيع البائع عقد البيع مع البنك."
  en: "A question from a flat seller whose buyer, a bank client, asked him to raise the price so that he could cover the transfer fees and maintenance, in which Jordan's General Iftaa Department answered that this is a stratagem to get round usury, while raising the price for genuine additions to the property made before the contract with the bank is permitted. The Department answered that an agreement between the client and the seller to raise the price charged to the financing party, so that the client takes the excess from the seller, is a stratagem to get round usury, because the client will repay that cash with its profit, and murabaha on cash is usury. It cited a hadith reported by Ibn Batta in Ibtal al-Hiyal forbidding the use of the slightest stratagems to make forbidden things lawful, noting that Ibn Kathir judged its chain good. It said that if the client and the seller agree on additions to the property, and the seller makes them before the sale to the bank and raises the price in return, this is permitted. It said transfer fees are not part of the price of the property but lie outside it, so stipulating a higher price to pay them amounts to obtaining cash from the bank and appointing the seller to pay the fees, which is a stratagem to get round usury. It concluded that stipulating a higher price in a murabaha for a purchase orderer so that the seller can pay the transfer fees is forbidden, while agreeing on genuine additions and a higher price in return is permitted, provided the additions are made before the seller signs the sale contract with the bank."
  ur: "فلیٹ بیچنے والے کا سوال جس سے بینک کے گاہک نے قیمت بڑھانے کو کہا تاکہ تنازل کی فیس اور مرمت کا خرچ نکل آئے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ سود سے بچنے کا حیلہ ہے، جبکہ بینک کے ساتھ معاہدے سے پہلے جائیداد میں کیے گئے حقیقی اضافوں کے بدلے قیمت بڑھانا جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ گاہک اور بیچنے والے کا فنانس کرنے والے ادارے پر قیمت بڑھانے کا اتفاق، تاکہ گاہک اضافی رقم بیچنے والے سے لے، سود سے بچنے کا حیلہ ہے، کیونکہ گاہک یہ نقدی منافع سمیت واپس کرے گا، اور نقدی پر مرابحہ سود ہے۔ اس نے ابن بطہ کی ابطال الحیل میں منقول ایک حدیث کا حوالہ دیا جس میں معمولی حیلوں سے حرام کو حلال کرنے سے منع کیا گیا ہے، اور ذکر کیا کہ ابن کثیر نے اس کی سند کو جید کہا۔ اس نے کہا کہ اگر گاہک اور بیچنے والا جائیداد میں کچھ اضافوں پر متفق ہوں، اور بیچنے والا بینک کو فروخت سے پہلے انہیں کر دے اور ان کے بدلے قیمت بڑھائے، تو یہ جائز ہے۔ اس نے کہا کہ تنازل کی فیس جائیداد کی قیمت کا حصہ نہیں بلکہ اس سے باہر ہے، اس لیے اسے ادا کرنے کے لیے قیمت بڑھانے کی شرط بینک سے نقدی لینے اور بیچنے والے کو فیس ادا کرنے کا وکیل بنانے کے مترادف ہے، جو سود سے بچنے کا حیلہ ہے۔ اس نے نتیجہ نکالا کہ خریداری کا حکم دینے والے کے لیے مرابحہ میں بیچنے والے کے تنازل کی فیس ادا کرنے کی خاطر قیمت بڑھانے کی شرط حرام ہے، جبکہ حقیقی اضافوں اور ان کے بدلے قیمت بڑھانے پر اتفاق جائز ہے، بشرطیکہ یہ اضافے بیچنے والے کے بینک کے ساتھ فروخت کے معاہدے پر دستخط سے پہلے ہوں۔"
  es: "Una consulta de un vendedor de un apartamento cuyo comprador, un cliente del banco, le pidió que aumentara el precio para cubrir los gastos de transferencia y mantenimiento, a la que el Departamento General de Iftaa de Jordania respondió que esto es una estratagema para eludir la usura, mientras que aumentar el precio por mejoras legítimas a la propiedad realizadas antes del contrato con el banco está permitido. El Departamento respondió que un acuerdo entre el cliente y el vendedor para aumentar el precio cobrado a la entidad financiera, de modo que el cliente reciba el excedente del vendedor, es una estratagema para eludir la usura, porque el cliente devolverá ese dinero con sus ganancias, y la murabaha sobre el dinero en efectivo es usura. Citó un hadiz reportado por Ibn Batta en Ibtal al-Hiyal que prohíbe el uso de la más mínima estratagema para legitimar lo prohibido, señalando que Ibn Kathir consideró buena su cadena de transmisión. Dijo que si el cliente y el vendedor acuerdan mejoras a la propiedad, y el vendedor las realiza antes de la venta al banco y aumenta el precio a cambio, esto está permitido. El tribunal afirmó que los gastos de transferencia no forman parte del precio del inmueble, sino que quedan fuera de él. Por lo tanto, estipular un precio más alto para pagarlos equivale a obtener efectivo del banco y obligar al vendedor a pagarlos, lo cual es una estratagema para eludir la usura. Concluyó que estipular un precio más alto en un contrato de murabaha para que el comprador pague los gastos de transferencia está prohibido, mientras que acordar mejoras genuinas y un precio más alto a cambio está permitido, siempre que dichas mejoras se realicen antes de que el vendedor firme el contrato de compraventa con el banco."
  fr: "Un vendeur d'appartement s'est interrogé sur sa demande d'augmentation de prix par un acheteur, client d'une banque, afin de couvrir les frais de transfert et d'entretien. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que cette pratique constitue une manœuvre visant à contourner l'usure, tout en autorisant une augmentation de prix pour des améliorations légitimes apportées au bien avant la signature du contrat avec la banque. Le Département a expliqué qu'un accord entre l'acheteur et le vendeur pour augmenter le prix facturé à l'organisme de financement, de sorte que l'acheteur récupère l'excédent auprès du vendeur, est une manœuvre pour contourner l'usure, car l'acheteur remboursera cette somme avec son profit, et la murabaha sur espèces est considérée comme de l'usure. Il a cité un hadith rapporté par Ibn Batta dans Ibtal al-Hiyal interdisant le recours à la moindre ruse pour rendre licite ce qui est illicite, et a noté qu'Ibn Kathir a jugé sa chaîne de transmission valable. Le Département a précisé que si l'acheteur et le vendeur s'accordent sur des améliorations au bien, et que le vendeur les réalise avant la vente à la banque et augmente le prix en conséquence, cela est permis. Il a été précisé que les frais de transfert ne font pas partie du prix de vente du bien, mais en sont des éléments distincts. Par conséquent, exiger un prix plus élevé pour les couvrir revient à obtenir des fonds auprès de la banque et à désigner le vendeur pour payer ces frais, ce qui constitue une manœuvre visant à contourner l'usure. Il a été conclu qu'il est interdit de stipuler un prix plus élevé dans un contrat de murabaha pour un acheteur afin que le vendeur puisse payer les frais de transfert. En revanche, il est permis de convenir de véritables améliorations et d'un prix plus élevé en contrepartie, à condition que ces améliorations soient apportées avant la signature du contrat de vente par le vendeur avec la banque."
