id: work/fatwa-aliftaa-jo-raising-a-flats-price-to-cover-transfer-fees
class: work
kind: fatwa
label: { ar: "رفع سعر الشقة على البنك لتغطية رسوم التنازل", en: "Raising a flat's price to the bank to cover transfer fees", ur: "تنازل کی فیس پوری کرنے کے لیے بینک پر فلیٹ کی قیمت بڑھانا" }
summary:
  ar: "سؤال من بائع شقة طلب منه عميل البنك رفع سعرها ليتحمل رسوم التنازل والصيانة، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك تحايل على الربا، وأنه يجوز رفع السعر مقابل إضافات حقيقية على المبيع تتم قبل توقيع العقد مع البنك. أجابت الدائرة بأن اتفاق العميل والبائع على رفع السعر على الجهة الممولة ليأخذ العميل الزيادة من البائع تحايل على الربا، لأن العميل سيسدد هذا النقد مع أرباحه، والمرابحة على النقد ربا. واستشهدت بحديث أورده ابن بطة في إبطال الحيل في النهي عن استحلال المحارم بأدنى الحيل، ونقلت تجويد ابن كثير لإسناده. وقالت إنه إن اتفق العميل مع البائع على إضافات على المبيع، وأضافها البائع قبل البيع للبنك ورفع السعر مقابلها، جاز ذلك. وقالت إن رسوم التنازل ليست جزءًا من ثمن المبيع بل خارجة عنه، فاشتراط رفع السعر لدفعها بمثابة الحصول على نقد من البنك وتوكيل البائع في دفع الرسوم، وهو من التحايل على الربا. وخلصت إلى تحريم اشتراط رفع سعر المبيع في المرابحة للآمر بالشراء لأجل دفع البائع رسوم التنازل، وإلى جواز الاتفاق على إضافات حقيقية ورفع السعر مقابلها بشرط أن تتم قبل توقيع البائع عقد البيع مع البنك."
  en: "A question from a flat seller whose buyer, a bank client, asked him to raise the price so that he could cover the transfer fees and maintenance, in which Jordan's General Iftaa Department answered that this is a stratagem to get round usury, while raising the price for genuine additions to the property made before the contract with the bank is permitted. The Department answered that an agreement between the client and the seller to raise the price charged to the financing party, so that the client takes the excess from the seller, is a stratagem to get round usury, because the client will repay that cash with its profit, and murabaha on cash is usury. It cited a hadith reported by Ibn Batta in Ibtal al-Hiyal forbidding the use of the slightest stratagems to make forbidden things lawful, noting that Ibn Kathir judged its chain good. It said that if the client and the seller agree on additions to the property, and the seller makes them before the sale to the bank and raises the price in return, this is permitted. It said transfer fees are not part of the price of the property but lie outside it, so stipulating a higher price to pay them amounts to obtaining cash from the bank and appointing the seller to pay the fees, which is a stratagem to get round usury. It concluded that stipulating a higher price in a murabaha for a purchase orderer so that the seller can pay the transfer fees is forbidden, while agreeing on genuine additions and a higher price in return is permitted, provided the additions are made before the seller signs the sale contract with the bank."
  ur: "فلیٹ بیچنے والے کا سوال جس سے بینک کے گاہک نے قیمت بڑھانے کو کہا تاکہ تنازل کی فیس اور مرمت کا خرچ نکل آئے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ سود سے بچنے کا حیلہ ہے، جبکہ بینک کے ساتھ معاہدے سے پہلے جائیداد میں کیے گئے حقیقی اضافوں کے بدلے قیمت بڑھانا جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ گاہک اور بیچنے والے کا فنانس کرنے والے ادارے پر قیمت بڑھانے کا اتفاق، تاکہ گاہک اضافی رقم بیچنے والے سے لے، سود سے بچنے کا حیلہ ہے، کیونکہ گاہک یہ نقدی منافع سمیت واپس کرے گا، اور نقدی پر مرابحہ سود ہے۔ اس نے ابن بطہ کی ابطال الحیل میں منقول ایک حدیث کا حوالہ دیا جس میں معمولی حیلوں سے حرام کو حلال کرنے سے منع کیا گیا ہے، اور ذکر کیا کہ ابن کثیر نے اس کی سند کو جید کہا۔ اس نے کہا کہ اگر گاہک اور بیچنے والا جائیداد میں کچھ اضافوں پر متفق ہوں، اور بیچنے والا بینک کو فروخت سے پہلے انہیں کر دے اور ان کے بدلے قیمت بڑھائے، تو یہ جائز ہے۔ اس نے کہا کہ تنازل کی فیس جائیداد کی قیمت کا حصہ نہیں بلکہ اس سے باہر ہے، اس لیے اسے ادا کرنے کے لیے قیمت بڑھانے کی شرط بینک سے نقدی لینے اور بیچنے والے کو فیس ادا کرنے کا وکیل بنانے کے مترادف ہے، جو سود سے بچنے کا حیلہ ہے۔ اس نے نتیجہ نکالا کہ خریداری کا حکم دینے والے کے لیے مرابحہ میں بیچنے والے کے تنازل کی فیس ادا کرنے کی خاطر قیمت بڑھانے کی شرط حرام ہے، جبکہ حقیقی اضافوں اور ان کے بدلے قیمت بڑھانے پر اتفاق جائز ہے، بشرطیکہ یہ اضافے بیچنے والے کے بینک کے ساتھ فروخت کے معاہدے پر دستخط سے پہلے ہوں۔"
