id: work/mawkib-al-nour
class: work
kind: lecture-series
label:
  ar: "برنامج موكب النور"
  en: "Mawkib al-Nour (Procession of Light) programme"
  ur: "پروگرام موکب النور"
summary:
  ar: "برنامج رمضاني يومي مع عمر عبد الكافي يتوقف فيه عند آية أو آيتين ويستخلص منهما عظة للواقع، وفق تسجيلات أسبابيل."
  en: "A daily Ramadan programme with Omar Abdelkafy that pauses at one or two verses each day and draws a lesson for real life, as recorded in the Assabile archive."
  ur: "عمر عبد الکافی کے ساتھ رمضان کا روزانہ پروگرام جس میں وہ ہر دن ایک یا دو آیتوں پر رکتے ہیں اور حقیقی زندگی کے لیے سبق نکالتے ہیں، اسابیل کے ذخیرے کے مطابق۔"
wings: [ideas]
themes: [spirituality-and-sufism, ethics-and-character]
regions: [global]
authors: [person/omar-abdelkafy]
delivered: { by: person/omar-abdelkafy }
language: language/arabic
sensitivity: contested
