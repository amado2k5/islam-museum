label: { ar: "أبيات حسان «أجمعت عمرة صرما فابتكر»", en: "Hassan's verses 'Amra has resolved on a break'", es: "Los versos de Hassan: \"Amra ha decidido tomarse un descanso\".", fr: "Les vers d'Hassan: « Amra a décidé de faire une pause »", ur: "حسن کی آیات 'امرہ نے وقفے سے حل کیا'", tr: "Hasan'ın ayetleri: 'Sarma Umresini topladım ve yenilik yaptım'", id: "Ayat-ayat Hassan: 'Saya mengumpulkan Umrah Sarma dan berinovasi'" }
summary:
  ar: "بيتان لحسان بن ثابت من الرمل على روي الراء، قالهما لزوجته عمرة بنت صامت الأوسية حين أغضبها بكلام في أمر الأوس، كما في شرح البرقوقي {{cite:sharh-diwan-hassan-barquqi-1929 p.203}}."
  en: "Two verses by Hassan ibn Thabit in the ramal metre on the rhyme ra', said to his wife Amra bint Samit of the Aws after he angered her with words about the Aws, according to the commentary {{cite:sharh-diwan-hassan-barquqi-1929 p.203}}."
  es: "Dos versos de Hassan ibn Thabit en metro ramal sobre la rima ra', dicho a su esposa Amra bint Samit de los Aws después de enfadarla con palabras sobre los Aws, según el comentario {{cite:sharh-diwan-hassan-barquqi-1929 p.203}}."
  fr: "Deux versets de Hassan ibn Thabit en mètre ramal sur la rime ra', dits à sa femme Amra bint Samit des Aws après l'avoir irritée avec des paroles sur les Aws, selon le commentaire {{cite:sharh-diwan-hassan-barquqi-1929 p.203}}."
  ur: "حسان بن ثابت کی دو آیات رمل میٹر میں رمز رعد میں، انہوں نے اوس کی بیوی عمرہ بنت صامت سے اس وقت کہی جب اس نے اوس کے بارے میں الفاظ سے ناراض کیا، تفسیر {{حوالہ:شرح دیوان-حسن برقوی-1929 ص203}} کے مطابق۔"
  tr: "Hasan ibn Tebit'in r' ayetine göre Al-Raml'dan iki beyit; bu dizileri, eşi Umre bint Samit al-Awsiya'ya Aws meselesiyle ilgili sözlerle kızdırdığında okumuştur; örneğin al-Barquqi'nin yorumunda olduğu gibi {{cite:sharh-diwan-hassan-barquqi-1929 s.203}}."
  id: "Dua bait karya Hassan ibn Thabit dari Al-Raml menurut narasi r', yang ia bacakan kepada istrinya Umrah bint Samit al-Awsiya ketika ia membuatnya marah dengan kata-kata tentang masalah Aws, seperti dalam komentar al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 hlm.203}}."
