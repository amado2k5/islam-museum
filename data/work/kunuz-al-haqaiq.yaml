summary:
  ar: "كتاب عبد الرؤوف المناوي في الأحاديث القصيرة، طبع على هامش الجامع الصغير للسيوطي في طبعة المطبعة الخيرية؛ يذكر المناوي في خطبته أنه جمع فيه زهاء عشرة آلاف حديث، ورتبه على حروف المعجم {cite:jami-saghir-khayriyya-v1 p. 5-7}."
  en: "'Abd al-Ra'uf al-Munawi's collection of short hadiths, printed in the margin of al-Suyuti's al-Jami' al-Saghir in the Khayriyya printing; in his preface al-Munawi says he gathered about ten thousand hadiths in it and arranged them alphabetically {cite:jami-saghir-khayriyya-v1 p. 5-7}."
  ur: "عبد الرؤوف مناوی کا مختصر احادیث کا مجموعہ، جو مطبعہ خیریہ کی طباعت میں سیوطی کی الجامع الصغیر کے حاشیے پر چھپا؛ مناوی اپنے مقدمے میں کہتے ہیں کہ انہوں نے اس میں تقریباً دس ہزار احادیث جمع کیں اور حروفِ تہجی پر مرتب کیں {cite:jami-saghir-khayriyya-v1 p. 5-7}۔"
