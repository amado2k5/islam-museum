label: { ar: "الترجمة العبرية لـ«المنتخب في تفسير القرآن الكريم»", en: "The Hebrew translation of al-Muntakhab fi Tafsir al-Qur'an al-Karim", ur: "«المنتخب فی تفسیر القرآن الکریم» کا عبرانی ترجمہ", es: "La traducción hebrea de al-Muntakhab fi Tafsir al-Qur'an al-Karim", fr: "La traduction hébraïque d'al-Muntakhab fi Tafsir al-Qur'an al-Karim", tr: "\"Al-Mukhtakhbal fi Tafsir al-Qur'an\"ın İbranice çevirisi", id: "Terjemahan Ibrani dari \"Al-Mukhtakhbal fi Tafsir al-Qur'an\"" }
summary:
  ar: "ترجمة عبرية لـ«المنتخب في تفسير القرآن الكريم»، التفسير الميسّر الذي وُضع في الأزهر في الخمسينيات وصدر سنة 1961، نشرتها وزارة الأوقاف المصرية سنة 2023 بعد ستة أشهر من العمل، وترجمها سعيد مطاوع، رئيس قسم اللغة العبرية وآدابها في جامعة القاهرة، مع مساعده علي عنان؛ تضم النص العربي للقرآن وحواشي المنتخب ومقدمات السور، وتُبقي الأسماء العربية كما هي، ووصفها وزير الأوقاف بأنها أول تفسير للقرآن بالعبرية."
  en: "A Hebrew translation of al-Muntakhab fi Tafsir al-Qur'an al-Karim, the concise commentary written at al-Azhar in the 1950s and published in 1961, issued by the Egyptian Ministry of Awqaf in 2023 after six months of work and translated by Sa'id Muttawi', chair of Hebrew language and literature at Cairo University, with his assistant Ali Annan; it carries the Arabic text of the Qur'an, al-Muntakhab's notes and sura introductions, keeps Arabic names as they are, and was described by the minister as the first tafsir of the Qur'an in Hebrew."
  ur: "«المنتخب فی تفسیر القرآن الکریم» کا عبرانی ترجمہ، یعنی وہ مختصر تفسیر جو 1950 کی دہائی میں ازہر میں لکھی گئی اور 1961 میں شائع ہوئی؛ مصری وزارتِ اوقاف نے اسے چھ ماہ کے کام کے بعد 2023 میں شائع کیا، ترجمہ قاہرہ یونیورسٹی کے شعبۂ عبرانی کے صدر سعید مطاوع نے اپنے معاون علی عنان کے ساتھ کیا؛ اس میں قرآن کا عربی متن، المنتخب کے حواشی اور سورتوں کے تعارف ہیں، عربی نام اپنی صورت میں باقی ہیں، اور وزیرِ اوقاف نے اسے عبرانی میں قرآن کی پہلی تفسیر کہا۔"
  es: "Una traducción al hebreo de al-Muntakhab fi Tafsir al-Qur'an al-Karim, el comentario conciso escrito en al-Azhar en la década de 1950 y publicado en 1961, emitido por el Ministerio egipcio de Awqaf en 2023 después de seis meses de trabajo y traducido por Sa'id Muttawi', catedrático de lengua y literatura hebreas en la Universidad de El Cairo, con su asistente Ali Annan; contiene el texto árabe del Corán, las notas de al-Muntakhab y las introducciones a las suras, mantiene los nombres árabes tal como están y fue descrito por el ministro como el primer tafsir del Corán en hebreo."
  fr: "Une traduction hébraïque d'al-Muntakhab fi Tafsir al-Qur'an al-Karim, le commentaire concis rédigé à al-Azhar dans les années 1950 et publié en 1961, a été publiée par le ministère égyptien des Awqaf en 2023 après six mois de travail et traduite par Sa'id Muttawi', titulaire de la chaire de langue et littérature hébraïques à l'université du Caire, avec son assistant Ali Annan; elle contient le texte arabe du Coran, les notes d'al-Muntakhab et les introductions aux sourates, conserve les noms arabes tels quels, et a été décrite par le ministre comme le premier tafsir du Coran en hébreu."
  tr: "1950'lerde El-Ezher'de kurulan ve 1961'de yayımlanan basitleştirilmiş tafsir \"El-Mutakhab fi Tafsir el-Kerim\"in İbranice çevirisi, altı aylık çalışmanın ardından 2023 yılında Mısır Awqaf Bakanlığı tarafından yayımlandı. Bu çeviri, Kahire Üniversitesi İbranice Dili ve Edebiyatı Bölümü başkanı Saeed Matawa ile asistanı Ali Anan tarafından çevrildi. Kur'an'ın Arapça metni, seçilen kitabın notları ve surelerin girişlerini içerir; Arapça isimler ise değişmeden kalmış ve Awqaf Bakanı bunu Kur'an'ın ilk İbranice yorumu olarak tanımlamıştır."
  id: "Terjemahan Ibrani dari \"Al-Mutakhab fi Tafsir al-Qur'an al-Karim,\" tafsir sederhana yang didirikan di Al-Azhar pada tahun 1950-an dan diterbitkan pada tahun 1961, diterbitkan oleh Kementerian Awqaf Mesir pada tahun 2023 setelah enam bulan bekerja. Terjemahan ini diterjemahkan oleh Saeed Matawa, kepala Departemen Bahasa dan Sastra Ibrani di Universitas Kairo, bersama asistennya Ali Anan. Tafsir ini memuat teks Al-Qur'an dalam bahasa Arab, anotasi dari buku terpilih, dan pengantar surah, sementara nama-nama Arab tetap tidak berubah, dan Menteri Awqaf menyebutnya sebagai interpretasi Ibrani pertama dari Al-Qur'an."
