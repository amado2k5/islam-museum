id: work/fatwa-aliftaa-jo-wudu-with-adhesive-on-the-hand
class: work
kind: fatwa
label: { ar: "الوضوء مع مادة لاصقة على اليد", en: "Wudu with adhesive on the hand", ur: "ہاتھ پر چپکنے والا مادہ ہو تو وضو" }
summary:
  ar: "سؤال عن الوضوء مع مادة لاصقة على اليد، أجابت فيه دائرة الإفتاء العام الأردنية بأن ما على أعضاء الوضوء إن لم يكن عازلًا يمنع وصول الماء صح الوضوء معه، وإن منع وصول الماء إلى البشرة لم يصح ووجبت إزالته. أجابت الدائرة بأن القاعدة العامة أن ما يوضع على أعضاء الوضوء إن لم يشكل مادة عازلة تحول دون وصول الماء إلى البشرة صح الوضوء مع وجوده، وإن منع وصول الماء إلى البشرة لم يصح الوضوء، ووجبت إزالته حتى يصل الماء إلى الشعر أو البشرة دون حائل. ونقلت عن النووي في المجموع (1/529) أن الشمع أو العجين أو الحناء ونحوها إذا منع وصول الماء إلى شيء من العضو لم تصح الطهارة قليلًا كان أو كثيرًا، وأن بقاء أثر الحناء ولونه دون عينه، أو أثر دهن مائع لا يمنع جريان الماء على البشرة، لا يمنع صحة الطهارة."
  en: "A question about wudu with adhesive on the hand, in which Jordan's General Iftaa Department answered that if what is on the limbs of wudu does not form a barrier preventing water from reaching the skin, wudu is valid with it, but if it prevents water reaching the skin, wudu is invalid and it must be removed. The Department answered that the general rule is that if what is placed on the limbs of wudu does not form a barrier preventing water from reaching the skin, wudu is valid with it; if it prevents water from reaching the skin, wudu is not valid and it must be removed so that water reaches the hair or skin unobstructed. It quoted al-Nawawi in al-Majmu (1/529) that if wax, dough, henna or the like prevents water from reaching any part of a limb, purification is invalid whether the amount is large or small, whereas a remaining trace or colour of henna without its substance, or a trace of liquid oil over which water still flows on the skin, does not affect validity."
  ur: "ہاتھ پر چپکنے والا مادہ ہو تو وضو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اعضائے وضو پر موجود چیز اگر پانی کو جلد تک پہنچنے سے روکنے والی رکاوٹ نہ ہو تو وضو درست ہے، اور اگر پانی کو جلد تک پہنچنے سے روکے تو وضو درست نہیں اور اسے ہٹانا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ عام قاعدہ یہ ہے کہ اعضائے وضو پر لگی چیز اگر ایسی رکاوٹ نہ بنے جو پانی کو جلد تک پہنچنے سے روکے تو اس کے ساتھ وضو درست ہے؛ اور اگر وہ پانی کو جلد تک پہنچنے سے روکے تو وضو درست نہیں، اور اسے ہٹانا واجب ہے تاکہ پانی بغیر رکاوٹ بالوں یا جلد تک پہنچے۔ اس نے المجموع (1/529) میں نووی سے نقل کیا کہ اگر موم، آٹا، مہندی یا اس جیسی چیز عضو کے کسی حصے تک پانی پہنچنے سے روکے تو طہارت درست نہیں، کم ہو یا زیادہ، جبکہ مہندی کا اثر یا رنگ بغیر جرم کے، یا مائع تیل کا اثر جس پر پانی جلد پر بہتا رہے، طہارت کی صحت کو متاثر نہیں کرتا۔"
