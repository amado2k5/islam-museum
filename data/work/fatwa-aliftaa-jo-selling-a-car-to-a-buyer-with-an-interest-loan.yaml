id: work/fatwa-aliftaa-jo-selling-a-car-to-a-buyer-with-an-interest-loan
class: work
kind: fatwa
label: { ar: "بيع سيارة لمشترٍ اقترض ثمنها من بنك ربوي", en: "Selling a car to a buyer who borrowed its price from an interest-based bank", ur: "سودی بینک سے قرض لینے والے خریدار کو گاڑی بیچنا" }
summary:
  ar: "سؤال من صاحب معرض سيارات عن بيع سيارة لمن اقترض ثمنها من بنك ربوي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج إذا كان القرض قد تم قبل البيع، ويحرم إذا كان القرض لا يُمنح إلا بأوراق يقدمها البائع لإتمام البيع. أجابت الدائرة بأن البائع لا يُكلف أن يسأل المشتري عن مصدر ماله، لأن إثم الحرام يتعلق بذمة فاعله لا بعين ماله ما لم يكن المال نفسه مسروقًا. وقالت إنه لا حرج في بيع السلعة لمن حصل على قرض ربوي سابقًا، لأن القرض تم دون ارتباط بعقد البيع ولم يتوقف عليه، فليس في البيع إعانة على الربا. وقالت إنه يحرم البيع لمن يريد الشراء بقرض ربوي لا يُمنح إلا بتقديم البائع الأوراق اللازمة لإتمام البيع، لأن في ذلك إعانة على الحرام. وخلصت إلى أنه إن كان المشتري قد حصل على القرض وجاء بالمال فلا حرج في بيعه وإثم الربا على من تعامل به، وإن لم يحصل عليه بعد وطلب أوراقًا تعينه على الحصول عليه حرمت إعانته على ذلك."
  en: "A question from a car dealer about selling a car to someone who borrowed its price from an interest-based bank, in which Jordan's General Iftaa Department answered that there is no objection if the loan was taken before the sale, but it is forbidden if the loan is granted only on papers the seller provides to complete the sale. The Department answered that a seller is not required to ask the buyer where his money comes from, because the sin of the forbidden attaches to the one who commits it, not to the money itself, unless the money itself is stolen. It said there is no objection to selling goods to someone who has already obtained an interest-based loan, because the loan was concluded with no link to the sale contract and did not depend on it, so the sale gives no help to usury. It said it is forbidden to sell to someone who wants to buy with an interest-based loan that is granted only once the seller supplies the papers needed to complete the sale, because that helps him do what is forbidden. It concluded that if the buyer has already obtained the loan and brings the money, there is no objection to selling to him and the sin of usury rests on whoever dealt with the bank; if he has not yet obtained it and asks for papers to help him get it, helping him is forbidden."
  ur: "کار شوروم کے مالک کا سوال کہ کیا وہ ایسے شخص کو گاڑی بیچ سکتا ہے جس نے اس کی قیمت سودی بینک سے قرض لی ہو، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر قرض فروخت سے پہلے لیا جا چکا ہو تو حرج نہیں، لیکن اگر قرض صرف بیچنے والے کے فراہم کردہ کاغذات پر ملتا ہو تو یہ حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ بیچنے والا خریدار سے اس کے مال کا ذریعہ پوچھنے کا مکلف نہیں، کیونکہ حرام کا گناہ کرنے والے کے ذمے ہے، خود مال سے متعلق نہیں، جب تک وہ مال بعینہ چوری کا نہ ہو۔ اس نے کہا کہ ایسے شخص کو سامان بیچنے میں حرج نہیں جو پہلے ہی سودی قرض لے چکا ہو، کیونکہ قرض فروخت کے معاہدے سے کسی تعلق کے بغیر ہوا اور اس پر موقوف نہیں تھا، اس لیے فروخت میں سود پر کوئی مدد نہیں۔ اس نے کہا کہ ایسے شخص کو بیچنا حرام ہے جو ایسے سودی قرض سے خریدنا چاہے جو صرف اس وقت ملتا ہے جب بیچنے والا فروخت مکمل کرنے کے لیے ضروری کاغذات دے، کیونکہ اس میں حرام پر مدد ہے۔ اس نے نتیجہ نکالا کہ اگر خریدار قرض لے کر رقم لے آئے تو اسے بیچنے میں حرج نہیں اور سود کا گناہ بینک سے معاملہ کرنے والے پر ہے؛ اور اگر اس نے ابھی قرض نہیں لیا اور اسے حاصل کرنے کے لیے کاغذات مانگے تو اس میں اس کی مدد کرنا حرام ہے۔"
