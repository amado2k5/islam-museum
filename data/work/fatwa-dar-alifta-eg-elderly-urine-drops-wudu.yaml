id: work/fatwa-dar-alifta-eg-elderly-urine-drops-wudu
class: work
kind: fatwa
label: { ar: "حكم وضوء كبير السن الذي تنزل منه قطرات بول لعذر", en: "Wudu for an elderly man who loses drops of urine for an excuse", ur: "بوڑھے شخص کا وضو جس سے عذر کی وجہ سے پیشاب کے قطرے نکلتے ہیں", es: "Wudu para un anciano que pierde gotas de orina como excusa", fr: "Les ablutions d'un homme âgé qui perd quelques gouttes d'urine pour une excuse" }
summary:
  ar: "سائل سأل عن وضوء رجل مسن تنزل منه قطرات بول لا يستطيع التحكم فيها بسبب البرد الشديد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22609)⁩ أنه يستنجي أولًا ثم يضع حائلًا يمنع نزول القطرات على ثيابه، ثم يتوضأ، وبيّن الجواب كيفية وضوئه وصلاته على هذه الصفة."
  en: "A questioner asked about the wudu of an elderly man from whom drops of urine escape beyond his control because of severe cold. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22609) answered that he performs istinja first, then places a barrier preventing the drops reaching his clothes, then performs wudu; the answer details how he makes wudu and prays in this condition."
  ur: "ایک سائل نے اس بوڑھے شخص کے وضو کے بارے میں پوچھا جس سے سخت سردی کی وجہ سے پیشاب کے قطرے اس کے قابو سے باہر نکلتے ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22609)⁩ نے جواب دیا کہ وہ پہلے استنجا کرے، پھر ایسا حائل رکھے جو قطرے کپڑوں تک پہنچنے سے روکے، پھر وضو کرے؛ جواب میں اس حالت میں وضو اور نماز کا طریقہ تفصیل سے بیان ہوا۔"
  es: "Una persona preguntó acerca del wudu de un anciano al que se le escapaban gotas de orina incontrolables debido a un fuerte resfriado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22609) respondió que primero realiza el istinja, luego coloca una barrera para evitar que las gotas lleguen a su ropa y, finalmente, realiza el wudu. La respuesta detalla cómo realiza el wudu y reza en estas condiciones."
  fr: "Un internaute a posé une question concernant les ablutions d'un homme âgé souffrant d'incontinence urinaire due à un froid intense. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22609) a répondu qu'il effectue d'abord l'istinja, puis place une barrière pour empêcher les gouttes d'atteindre ses vêtements, avant de faire ses ablutions. La réponse détaille la procédure et la manière dont il effectue ses ablutions et prie dans cet état."
