id: work/fatwa-dar-alifta-eg-elderly-urine-drops-wudu
class: work
kind: fatwa
label: { ar: "حكم وضوء كبير السن الذي تنزل منه قطرات بول لعذر", en: "Wudu for an elderly man who loses drops of urine for an excuse", ur: "بوڑھے شخص کا وضو جس سے عذر کی وجہ سے پیشاب کے قطرے نکلتے ہیں" }
summary:
  ar: "سائل سأل عن وضوء رجل مسن تنزل منه قطرات بول لا يستطيع التحكم فيها بسبب البرد الشديد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22609)⁩ أنه يستنجي أولًا ثم يضع حائلًا يمنع نزول القطرات على ثيابه، ثم يتوضأ، وبيّن الجواب كيفية وضوئه وصلاته على هذه الصفة."
  en: "A questioner asked about the wudu of an elderly man from whom drops of urine escape beyond his control because of severe cold. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22609) answered that he performs istinja first, then places a barrier preventing the drops reaching his clothes, then performs wudu; the answer details how he makes wudu and prays in this condition."
  ur: "ایک سائل نے اس بوڑھے شخص کے وضو کے بارے میں پوچھا جس سے سخت سردی کی وجہ سے پیشاب کے قطرے اس کے قابو سے باہر نکلتے ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22609)⁩ نے جواب دیا کہ وہ پہلے استنجا کرے، پھر ایسا حائل رکھے جو قطرے کپڑوں تک پہنچنے سے روکے، پھر وضو کرے؛ جواب میں اس حالت میں وضو اور نماز کا طریقہ تفصیل سے بیان ہوا۔"
