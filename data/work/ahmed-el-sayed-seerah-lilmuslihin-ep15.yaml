id: work/ahmed-el-sayed-seerah-lilmuslihin-ep15
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 15: الهجرة إلى المدينة"
  en: "The Prophetic Biography for Reformers, episode 15: The Hijra to Medina"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 15: مدینہ کی طرف ہجرت"
  fr: "La biographie prophétique pour les réformateurs, épisode 15 : L'hégire vers Médine"
  es: "La biografía profética para los reformadores, episodio 15: La hégira a Medina"
summary:
  ar: "في منتصف السلسلة ينتقل من مكة إلى المدينة ويروي قصة الهجرة من روايتين في صحيح البخاري، إحداهما لعائشة والأخرى لأبي بكر عن البراء بن عازب. ويستخلص دروسا عن الدعاء قبل العمل الإصلاحي، وعن اتخاذ الأسباب العملية مع التوكل على الله، وعن الابتلاءات التي تصيب المصلحين، ويختم بحديث أنس بن مالك عن الاستقبال في المدينة وعن المعنى الجديد الذي اكتسبته المدينة."
  en: "At the midpoint of the series he turns from Mecca to Medina and tells the story of the Hijra from two Sahih al-Bukhari narrations, one by Aisha and one by Abu Bakr through al-Bara ibn Azib. He draws lessons on prayer before reform work, on taking practical precautions while trusting God, and on trials that come to reformers, and he closes with Anas ibn Malik on the welcome in Medina and the city's new meaning."
  ur: "سلسلے کے وسط میں وہ مکہ سے مدینہ کی طرف منتقل ہوتے ہیں اور صحیح بخاری کی دو روایات سے ہجرت کا قصہ بیان کرتے ہیں، ایک عائشہ کی اور دوسری ابوبکر کی جو براء بن عازب کے واسطے سے ہے۔ وہ اصلاحی کام سے پہلے دعا، اللہ پر بھروسے کے ساتھ عملی تدابیر اختیار کرنے، اور مصلحین پر آنے والی آزمائشوں کے بارے میں اسباق نکالتے ہیں، اور آخر میں انس بن مالک سے مدینہ میں استقبال اور شہر کو ملنے والے نئے مفہوم کا ذکر کرتے ہیں۔"
  fr: "Au milieu de la série, il passe de La Mecque à Médine et raconte l'hégire à partir de deux récits de Sahih al-Bukhari, l'un d'Aïcha et l'autre d'Abu Bakr rapporté par al-Bara ibn Azib. Il en tire des leçons sur la prière avant l'œuvre de réforme, sur les précautions pratiques prises tout en s'en remettant à Dieu, et sur les épreuves qui atteignent les réformateurs, et il termine avec Anas ibn Malik sur l'accueil à Médine et le sens nouveau qu'acquiert la ville."
  es: "A mitad de la serie pasa de La Meca a Medina y cuenta la hégira a partir de dos relatos de Sahih al-Bujari, uno de Aisha y otro de Abu Bakr transmitido por al-Bara ibn Azib. Extrae lecciones sobre la súplica antes de la obra de reforma, sobre tomar precauciones prácticas confiando en Dios y sobre las pruebas que sufren los reformadores, y termina con Anas ibn Malik sobre la acogida en Medina y el nuevo significado que adquirió la ciudad."
