id: work/fatwa-amja-incontinence-two-states
class: work
kind: fatwa
label: { ar: "سلس البول حالان", en: "Urinary incontinence — its two states", ur: "سلس بول — دو حالتیں" }
summary:
  ar: "سأل سائل عن حكم سلس البول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79982 بتاريخ 16 سبتمبر 2009)⁩ أن سلس البول هو استرسال البول وعدم تماسكه والمصاب به له حالان: الأولى إذا كان مستمرًا عنده بحيث لا يتوقف فكلما تجمع شيء بالمثانة نزل فهذا يتوضأ إذا دخل الوقت ويتحفظ بشيء على فرجه، والثانية إذا كان ينقطع أوقاتًا معلومة فإنه ينتظر وقت انقطاعه على ما فصّل الجواب."
  en: "A questioner asked the ruling on urinary incontinence. Dr. Salah al-Sawi (fatwa no. 79982, 16 September 2009) answered that incontinence is urine's free flow and failure to hold; the afflicted has two states: first, where it is continuous, never ceasing — whenever something gathers in the bladder it descends — such a one does wudu when the time enters and guards his private part with something; second, where it ceases at known hours — he waits for its hour of ceasing, as the answer details."
  ur: "سلس بول کا حکم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79982، 16 ستمبر 2009)⁩ کے مطابق مسلسل ہو تو ہر وقت پر وضو اور تحفظ؛ معلوم ٹھراؤ ہو تو اس کا انتظار۔"
