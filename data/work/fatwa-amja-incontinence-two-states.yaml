id: work/fatwa-amja-incontinence-two-states
class: work
kind: fatwa
label: { ar: "سلس البول حالان", en: "Urinary incontinence — its two states", ur: "سلس بول — دو حالتیں", es: "Incontinencia urinaria: sus dos estados", fr: "Incontinence urinaire — ses deux états", tr: "İdrar kaçırma iki durumdur", id: "Inkontinensia urin adalah dua kondisi" }
summary:
  ar: "سأل سائل عن حكم سلس البول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79982 بتاريخ 16 سبتمبر 2009)⁩ أن سلس البول هو استرسال البول وعدم تماسكه والمصاب به له حالان: الأولى إذا كان مستمرًا عنده بحيث لا يتوقف فكلما تجمع شيء بالمثانة نزل فهذا يتوضأ إذا دخل الوقت ويتحفظ بشيء على فرجه، والثانية إذا كان ينقطع أوقاتًا معلومة فإنه ينتظر وقت انقطاعه على ما فصّل الجواب."
  en: "A questioner asked the ruling on urinary incontinence. Dr. Salah al-Sawi (fatwa no. 79982, 16 September 2009) answered that incontinence is urine's free flow and failure to hold; the afflicted has two states: first, where it is continuous, never ceasing — whenever something gathers in the bladder it descends — such a one does wudu when the time enters and guards his private part with something; second, where it ceases at known hours — he waits for its hour of ceasing, as the answer details."
  ur: "سلس بول کا حکم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79982، 16 ستمبر 2009)⁩ کے مطابق مسلسل ہو تو ہر وقت پر وضو اور تحفظ؛ معلوم ٹھراؤ ہو تو اس کا انتظار۔"
  es: "Un consultante preguntó sobre la norma relativa a la incontinencia urinaria. El Dr. Salah al-Sawi (fatwa n.º 79982, 16 de septiembre de 2009) respondió que la incontinencia es el flujo libre de orina y la incapacidad de retenerla; el afectado presenta dos estados: primero, cuando es continua, nunca cesa —siempre que algo se acumula en la vejiga, esta desciende—, quien la padece realiza la ablución (wudu) cuando llega la hora y protege sus partes íntimas con algo; segundo, cuando cesa a horas determinadas —espera la hora en que cesa, como se detalla en la respuesta."
  fr: "Un internaute a posé la question de l'avis juridique concernant l'incontinence urinaire. Le Dr Salah al-Sawi (fatwa n° 79982, 16 septembre 2009) a répondu que l'incontinence est un écoulement libre d'urine et une incapacité à la retenir. La personne atteinte présente deux états: premièrement, l'incontinence est continue et incessante; dès que la vessie se remplit, l'urine s'écoule. Dans ce cas, elle effectue ses ablutions (wudu) au moment opportun et protège ses parties intimes. Deuxièmement, l'incontinence cesse à des heures précises; la personne attend alors l'heure à laquelle elle cesse, comme le précise la réponse."
  tr: "Bir soru soran idrar kaçırma kararı hakkında soru sordu. Dr. Salah Al-Sawy (16 Eylül 2009 tarihli 79982 No'lu Fetva) idrar kaçırmanın idrar akışı ve tutarsızlığı olduğunu yanıtladı. Etkilenen kişinin iki durumu vardır: birincisi, durmadan devam ederse, mesanede bir şey biriktiğinde serbest bırakılır ve zaman girerse özel bölgeleri için bir şey ayrılırsa kişi destdeste alır; ikincisi, belirli zamanlarda aralıklı olursa, cevapta açıklandığı gibi zamanın durmasını bekler."
  id: "Seorang penanya menanyakan tentang putusan inkontinensia urin. Dr. Salah Al-Sawy menjawab (Fatwa No. 79982 tanggal 16 September 2009) bahwa inkontinensia urin adalah aliran urin dan ketidakkonsistenannya. Orang yang terkena memiliki dua kondisi: pertama, jika inkontinensia tetap berlanjut tanpa berhenti, setiap kali ada sesuatu yang menumpuk di kandung kemih, ia akan dilepaskan, dan orang tersebut melakukan wudhu jika waktu masuk dan sesuatu disisihkan untuk bagian pribadinya; kedua, jika terjadi secara sporadis pada waktu yang diketahui, mereka menunggu waktu berhenti, seperti yang dijelaskan dalam jawaban."
