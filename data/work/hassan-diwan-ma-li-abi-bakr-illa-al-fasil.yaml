label: { ar: "أبيات حسان في الردة «ما لأبي بكر إلا الفصيل»", en: "Hassan's verses from the Ridda 'Abu Bakr has nothing but the weaned camel'", es: "Versos de Hassan del Ridda: \"Abu Bakr no tiene nada más que el camello destetado\".", fr: "Les vers d'Hassan tirés du Ridda 'Abu Bakr n'a rien d'autre que le chameau sevré'", ur: "حسن کی آیات ردا کی 'ابوبکر کے پاس دودھ چھڑانے والے اونٹ کے سوا کچھ نہیں'" }
summary:
  ar: "أبيات لحسان بن ثابت من الكامل على روي الراء، قالها في الردة حين كانت العرب تقول لا نطيع أبا الفصيل يعنون أبا بكر {{cite:sharh-diwan-hassan-barquqi-1929 p.209-210}}."
  en: "Verses by Hassan ibn Thabit in the kamil metre on the rhyme ra', said in the Ridda when the Arabs were saying 'we will not obey Abu al-Fasil', meaning Abu Bakr {{cite:sharh-diwan-hassan-barquqi-1929 p.209-210}}."
  es: "Versos de Hassan ibn Thabit en metro kamil sobre la rima ra', dicho en el Ridda cuando los árabes decían 'no obedeceremos a Abu al-Fasil', refiriéndose a Abu Bakr {{cite:sharh-diwan-hassan-barquqi-1929 p.209-210}}."
  fr: "Versets de Hassan ibn Thabit en mètre kamil sur la rime ra', dits dans le Ridda lorsque les Arabes disaient 'nous n'obéirons pas à Abu al-Fasil', c'est-à-dire Abu Bakr {{cite:sharh-diwan-hassan-barquqi-1929 p.209-210}}."
  ur: "حسان بن ثابت کی آیات کامل میٹر میں رعد میں کہی گئی ہیں، جب عرب کہہ رہے تھے کہ 'ہم ابو الفصل کی بات نہیں مانیں گے'، یعنی ابوبکر {{حوالہ:شرح دیوان-حسن برقوی-1929 ص209-210}}۔"
