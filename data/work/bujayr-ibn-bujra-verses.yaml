  ar: "أبيات نسبها ابن إسحاق إلى رجل من طيئ يقال له بجير بن بجرة يذكر فيها قول النبي لخالد إنه سيجد أكيدر يصيد البقر وما صنعت البقر تلك الليلة حتى استخرجته. لا ينقل المتحف نص الأبيات."
