label: { ar: "أبيات بجير بن بجرة في قصة البقر", en: "Bujayr ibn Bujra's verses on the story of the cattle", es: "Versos de Bujayr ibn Bujra sobre la historia del ganado", fr: "Vers de Bujayr ibn Bujra sur l'histoire du bétail", ur: "مویشیوں کے قصے پر بُزیر بن بجرہ کی آیات", tr: "Bujir bin Bujra'nın ineklerin hikayesindeki dizeleri", id: "Bait-bait Bujir bin Bujra dalam kisah sapi" }
summary:
  ar: "أبيات نسبها ابن إسحاق إلى رجل من طيئ يقال له بجير بن بجرة يذكر فيها قول النبي لخالد إنه سيجد أكيدر يصيد البقر وما صنعت البقر تلك الليلة حتى استخرجته. لا ينقل المتحف نص الأبيات."
  en: Verses Ibn Ishaq attributes to a man of Tayy named Bujayr ibn Bujra recalling the Prophet's words to Khalid that he would find Ukaydir hunting wild cows, and what the cows did that night until they drew him out. The museum does not reproduce the verses.
  es: "Versículos que Ibn Ishaq atribuye a un hombre de Tayy llamado Bujayr ibn Bujra, en los que el Profeta le dijo a Khalid que encontraría a Ukaydir cazando vacas salvajes, y lo que hicieron las vacas esa noche hasta que lo sacaron de allí. El museo no reproduce estos versículos."
  fr: "Ibn Ishaq attribue à un homme de Tayy nommé Bujayr ibn Bujra des versets relatant les paroles du Prophète à Khalid, selon lesquelles il trouverait Ukaydir en train de chasser des vaches sauvages, et ce que firent ces dernières cette nuit-là jusqu'à ce qu'elles l'attirent hors de sa cachette. Le musée ne reproduit pas ces versets."
  ur: "آیات ابن اسحاق نے طائی کے ایک شخص کی طرف منسوب کیا ہے جس کا نام بوزیر بن بجرہ ہے جس نے خالد کو نبی کا یہ قول یاد کیا کہ وہ عقیدیر کو جنگلی گایوں کا شکار کرتے ہوئے پائے گا، اور گایوں نے اس رات کیا کیا یہاں تک کہ انہوں نے اسے نکال دیا۔ میوزیم آیات کو دوبارہ پیش نہیں کرتا ہے۔"
  tr: "İbn İshak'ın Tayy'den Bujir ibn Bajrah adında bir adama atfettiği ayetler; burada Peygamber'in Halid'e Akidar'ı sığır avlarken bulacağını ve o gece sığırların ne yaptığını anlatır, ta ki onları çıkarana kadar. Müze bu ayetlerin metnini kopyalamamaktadır."
  id: "Ayat-ayat yang dikaitkan oleh Ibn Ishaq kepada seorang pria dari Tayy bernama Bujir ibn Bajrah, di mana ia menyebutkan pernyataan Nabi kepada Khalid bahwa ia akan menemukan Akidar berburu ternak, dan apa yang dilakukan ternak itu malam itu sampai saya mengambilnya. Museum tidak menyalin teks ayat-ayat tersebut."
