id: work/fatwa-aliftaa-jo-giving-sacrifice-meat-to-poor-people-of-the-book
class: work
kind: fatwa
label: { ar: "إعطاء فقراء أهل الكتاب من الأضحية", en: "Giving sacrifice meat to poor People of the Book", ur: "غریب اہلِ کتاب کو قربانی کا گوشت دینا" }
summary:
  ar: "سؤال عن إعطاء فقراء أهل الكتاب من الأضحية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إعطاؤهم من أضحية التطوع كما تجوز الصدقة عليهم، وهو وجه عند الشافعية مال إليه المحب الطبري والنووي. أجابت الدائرة بأنه يجوز إعطاء فقراء أهل الكتاب من أضحية التطوع، كما يجوز إعطاؤهم الصدقة. وقالت إن هذا وجه عند الشافعية مال إليه المحب الطبري والنووي، وأحالت إلى حاشية ابن قاسم العبادي على تحفة المحتاج (9/365)."
  en: "A question about giving sacrifice meat to poor People of the Book, in which Jordan's General Iftaa Department answered that they may be given meat from a voluntary sacrifice just as they may be given charity, a view among the Shafi'is favoured by al-Muhibb al-Tabari and al-Nawawi. The Department answered that poor People of the Book may be given meat from a voluntary sacrifice, just as they may be given charity. It said this is a view within the Shafi'i school that al-Muhibb al-Tabari and al-Nawawi inclined towards, referring to the Hashiya of Ibn Qasim al-Abbadi on Tuhfat al-Muhtaj (9/365)."
  ur: "غریب اہلِ کتاب کو قربانی کا گوشت دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نفلی قربانی سے انہیں دینا جائز ہے جیسے انہیں صدقہ دینا جائز ہے، یہ شافعیہ کا ایک قول ہے جس کی طرف محب طبری اور نووی مائل ہوئے۔ ڈیپارٹمنٹ نے جواب دیا کہ غریب اہلِ کتاب کو نفلی قربانی کا گوشت دینا جائز ہے، جیسے انہیں صدقہ دینا جائز ہے۔ اس نے کہا کہ یہ شافعی مذہب کا ایک قول ہے جس کی طرف محب طبری اور نووی مائل ہوئے، اور تحفۃ المحتاج پر ابن قاسم العبادی کے حاشیے (9/365) کا حوالہ دیا۔"
