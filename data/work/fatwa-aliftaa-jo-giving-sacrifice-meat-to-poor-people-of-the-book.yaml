id: work/fatwa-aliftaa-jo-giving-sacrifice-meat-to-poor-people-of-the-book
class: work
kind: fatwa
label: { ar: "إعطاء فقراء أهل الكتاب من الأضحية", en: "Giving sacrifice meat to poor People of the Book", ur: "غریب اہلِ کتاب کو قربانی کا گوشت دینا", es: "Dar carne de sacrificio a los pobres del Pueblo del Libro", fr: "Offrir de la viande sacrificielle aux pauvres gens du Livre", tr: "Kitap Ahli Fakirlerine Kurban Vermek", id: "Memberikan korban kepada orang miskin dari Umat Kitab" }
summary:
  ar: "سؤال عن إعطاء فقراء أهل الكتاب من الأضحية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إعطاؤهم من أضحية التطوع كما تجوز الصدقة عليهم، وهو وجه عند الشافعية مال إليه المحب الطبري والنووي. أجابت الدائرة بأنه يجوز إعطاء فقراء أهل الكتاب من أضحية التطوع، كما يجوز إعطاؤهم الصدقة. وقالت إن هذا وجه عند الشافعية مال إليه المحب الطبري والنووي، وأحالت إلى حاشية ابن قاسم العبادي على تحفة المحتاج (9/365)."
  en: "A question about giving sacrifice meat to poor People of the Book, in which Jordan's General Iftaa Department answered that they may be given meat from a voluntary sacrifice just as they may be given charity, a view among the Shafi'is favoured by al-Muhibb al-Tabari and al-Nawawi. The Department answered that poor People of the Book may be given meat from a voluntary sacrifice, just as they may be given charity. It said this is a view within the Shafi'i school that al-Muhibb al-Tabari and al-Nawawi inclined towards, referring to the Hashiya of Ibn Qasim al-Abbadi on Tuhfat al-Muhtaj (9/365)."
  ur: "غریب اہلِ کتاب کو قربانی کا گوشت دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نفلی قربانی سے انہیں دینا جائز ہے جیسے انہیں صدقہ دینا جائز ہے، یہ شافعیہ کا ایک قول ہے جس کی طرف محب طبری اور نووی مائل ہوئے۔ ڈیپارٹمنٹ نے جواب دیا کہ غریب اہلِ کتاب کو نفلی قربانی کا گوشت دینا جائز ہے، جیسے انہیں صدقہ دینا جائز ہے۔ اس نے کہا کہ یہ شافعی مذہب کا ایک قول ہے جس کی طرف محب طبری اور نووی مائل ہوئے، اور تحفۃ المحتاج پر ابن قاسم العبادی کے حاشیے (9/365) کا حوالہ دیا۔"
  es: "Una pregunta sobre la entrega de carne de sacrificio a los pobres de la Gente del Libro, a la que el Departamento General de Iftaa de Jordania respondió que se les puede dar carne de un sacrificio voluntario, al igual que se les puede dar caridad, una opinión entre los shafi'ís favorecida por al-Muhibb al-Tabari y al-Nawawi. El Departamento respondió que a los pobres de la Gente del Libro se les puede dar carne de un sacrificio voluntario, al igual que se les puede dar caridad. Afirmó que esta es una opinión dentro de la escuela shafi'í a la que se inclinaban al-Muhibb al-Tabari y al-Nawawi, haciendo referencia a la Hashiya de Ibn Qasim al-Abbadi sobre Tuhfat al-Muhtaj (9/365)."
  fr: "Une question concernant l'attribution de viande de sacrifice aux Gens du Livre pauvres a été posée. Le Département général de la Fatah de Jordanie a répondu que ces derniers peuvent recevoir de la viande issue d'un sacrifice volontaire, au même titre que l'aumône. Cette position, partagée par l'école chaféite et défendue par al-Muhibb al-Tabari et al-Nawawi, stipule que cette attribution est conforme à l'avis général de l'école chaféite, auquel al-Muhibb al-Tabari et al-Nawawi étaient favorables. Le Département s'appuie sur la Hashiya d'Ibn Qasim al-Abbadi, relative au traité Tuhfat al-Muhtaj (9/365)."
  tr: "Kitap Fakirlerine kurban verme sorusuna, Ürdün Genel Fetva Dairesi tarafından yanıtlandı; bu görüş, onların gönüllü kurbanlardan verilmesi de kendileri için cümle olduğu gibi caiz olduğu gibi, Şafi'lerin de Al-Muhibb al-Tabari ve al-Nawawi tarafından tercih edildiği görüşüne sahiptir. Daire, Kitap Ehli'nin yoksullarına gönüllü kurbanlar vermenin, onlara sadaka vermenin de caiz olduğu gibi kabul edilebilir olduğunu yanıtladı. Bu görüşün el-Muhibb el-Taberi ve el-Nevavi tarafından, İbn Kasım el-Abadi'nin Tuhfat al-Muhtaj (9/365) kenar notlarına atıfta bulunduğunu belirtti."
  id: "Sebuah pertanyaan tentang memberikan korban kepada orang miskin dalam Kitab dijawab oleh Departemen Fatwa Umum Yordania bahwa diperbolehkan memberikan korban dari pengorbanan sukarela sama seperti amal diperbolehkan bagi mereka, pandangan yang disukai oleh para Shafi'i oleh Al-Muhibb al-Tabari dan al-Nawawi. Departemen menjawab bahwa diperbolehkan memberikan pengorbanan sukarela kepada orang miskin umat Kitab, sama seperti diperbolehkan memberikan sedekah. Mereka mengatakan ini adalah pandangan yang didukung oleh al-Muhibb al-Tabari dan al-Nawawi, merujuk pada catatan pinggir Ibn Qasim al-Abadi tentang Tuhfat al-Muhtaj (9/365)."
