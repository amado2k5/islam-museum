id: work/fatwa-amja-despair-waswasa-mercy
class: work
kind: fatwa
label: { ar: "وساوس النفس ورحمة الله", en: "Whisperings of the soul and God's mercy", ur: "وسوسے اور اللہ کی رحمت", es: "Susurros del alma y la misericordia de Dios", fr: "Les murmures de l'âme et la miséricorde de Dieu" }
summary:
  ar: "سأل سائل متعب نفسيًّا يصلي ويصوم ويخشى أن عمله غير مقبول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86572 بتاريخ 14 مارس 2012)⁩ أن الله تجاوز لهذه الأمة عما حدثت به نفسها ما لم تعمل به أو تتكلم، وأنه إن قارف شيئًا من السوء أو تكلم به ثم تاب فلا يعظم ذنب على التوبة لقوله تعالى إن من يعمل سوءًا أو يظلم نفسه ثم يستغفر الله يجد الله غفورًا رحيمًا، وأمره بالخروج من الوساوس ومعرفة أن ربه أرحم الراحمين وحسن الظن به وألا يقنط من رحمته لقوله إن الله يغفر الذنوب جميعًا."
  en: "A psychologically exhausted questioner who prays and fasts feared his deeds were unacceptable. Dr. Salah al-Sawi (fatwa no. 86572, 14 March 2012) answered that God pardons this ummah for what its souls whisper so long as it is not acted or spoken; that even if he committed or uttered some ill then repented, no sin is too great for repentance per the verse that whoever does ill or wrongs himself then seeks God's forgiveness finds Him forgiving and merciful; he was told to leave the whisperings, to know his Lord is the most merciful, think well of Him and never despair of His mercy — for God forgives all sins."
  ur: "ایک تھکے ہوئے سائل نے پوچھا کہ کیا اس کے اعمال قبول نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86572، 14 مارچ 2012)⁩ کے مطابق دل کے وسوسے معاف ہیں اور توبہ سے بڑا کوئی گناہ نہیں؛ اللہ کی رحمت سے مایوس نہ ہو۔"
  es: "Un consultante psicológicamente agotado, que reza y ayuna, temía que sus actos fueran inaceptables. El Dr. Salah al-Sawi (fatwa n.º 86572, 14 de marzo de 2012) respondió que Dios perdona a esta comunidad por lo que sus almas susurran, siempre y cuando no se lleve a cabo ni se diga; que incluso si cometía o pronunciaba alguna mala acción y luego se arrepentía, ningún pecado es demasiado grande para el arrepentimiento, según el versículo que dice que quien obra mal o se perjudica a sí mismo y luego busca el perdón de Dios, lo encuentra perdonador y misericordioso; se le dijo que dejara de susurrar, que supiera que su Señor es el más misericordioso, que pensara bien de Él y que nunca desesperara de Su misericordia, pues Dios perdona todos los pecados."
  fr: "Un homme, psychologiquement épuisé, qui prie et jeûne, craignait que ses actes soient inacceptables. Le Dr Salah al-Sawi (fatwa n° 86572, 14 mars 2012) lui répondit que Dieu pardonne à la communauté pour les pensées qui lui traversent l'esprit, tant qu'elles ne sont ni mises en acte ni exprimées. Il lui expliqua que même s'il avait commis ou proféré un mal, puis s'en était repenti, aucun péché n'est trop grand pour être irrémédiablement perdu, conformément au verset qui dit que quiconque fait le mal à lui-même et implore ensuite le pardon de Dieu Le trouve indulgent et miséricordieux. Il lui fut conseillé de cesser de méditer, de se souvenir que son Seigneur est le Très Miséricordieux, d'avoir une bonne opinion de Lui et de ne jamais désespérer de Sa miséricorde, car Dieu pardonne tous les péchés."
