id: work/fatwa-dar-alifta-subletting-a-rented-flat
class: work
kind: fatwa
label: { ar: "حكم تأجير العين المستأجرة لشخص آخر غير مالكها", en: "Subletting a rented flat to someone other than its owner", ur: "کرائے پر لیے گئے فلیٹ کو مالک کے علاوہ کسی اور کو کرائے پر دینے کا حکم" }
summary:
  ar: "سؤال عن رجل استأجر شقة سكنية وأراد تأجيرها لشخص آخر غير مالكها، أجابت فيه دار الإفتاء المصرية بأنه يجوز للمستأجر تأجير العين المستأجرة ولا حرج عليه في ذلك شرعًا، بشرط ألا ينشأ عن الإيجار الثاني إضرار بالعين، وأن تكون العين مما لا يختلف الناس في الانتفاع به، ويجوز أن تكون الإجارة الثانية بأجرة أكبر من الأولى مع استحباب أن يكون المستأجر قد أضاف إلى العين زيادة تسوّغ طلب الزيادة خروجًا من خلاف من اشترط ذلك، وكل ذلك مشروط بألا يخالف الاتفاق مع المالك وبالالتزام بالقوانين المنظمة للعلاقة الإيجارية وما فيها من قيود. عرضت الدار مشروعية الإجارة بالكتاب والسنة والإجماع، ونسبت جواز تأجير المستأجر لغيره إلى جمهور الحنفية والمالكية والشافعية والحنابلة في الأصح وإلى جماعة من فقهاء السلف، وعللته بأن المستأجر ملك المنفعة بالإجارة الأولى فجاز له التصرف فيها، وبأن الإجارة كالبيع وبيع المبيع جائز بعد قبضه، ونقلت اشتراط الحنفية إحداث زيادة في العين إذا كانت الأجرة الثانية أكثر وإلا تصدّق بالزيادة، ونقلت نصوص الكاساني وابن مازه والحطاب والشيرازي والبهوتي، وأحالت إلى المادة 593 من القانون المدني المصري وإلى المادة 18 من القانون 136 لسنة 1981 التي تجيز طلب الإخلاء إذا أجّر المستأجر من الباطن دون إذن كتابي صريح في عقود الإيجار القديم."
  en: "A question about a man who rented a residential flat and wished to let it to someone other than its owner; Dar al-Ifta al-Misriyya answered that a tenant may sublet the rented property without blame in sharia, provided the second lease causes no damage to the property, that the property is of a kind whose use does not vary from person to person, and that the second rent may exceed the first, though it is preferable that the tenant has added something to the property that justifies asking more, to avoid the disagreement of those jurists who require it; all of this is conditional on not breaching the agreement with the owner and on complying with the laws that govern the tenancy and their restrictions. Dar al-Ifta set out the legitimacy of leasing from the Qur'an, the Sunna and consensus, attributed the permissibility of a tenant's subletting to the majority of Hanafis, Malikis, Shafi'is and, on the sounder view, Hanbalis, and to a group of early jurists, and explained it by the tenant's having acquired ownership of the use through the first lease, so he may dispose of it, and by the analogy that a lease is like a sale and sold goods may be resold once taken into possession. It reported the Hanafi condition that where the second rent is higher the tenant must have improved the property, otherwise he gives the excess in charity, quoted al-Kasani, Ibn Maza, al-Hattab, al-Shirazi and al-Buhuti, and referred to article 593 of the Egyptian Civil Code and to article 18 of Law 136 of 1981, which allows the owner to seek eviction when a tenant under an old-rent contract sublets without express written permission."
  ur: "ایک شخص کے بارے میں سوال جس نے رہائشی فلیٹ کرائے پر لیا اور اسے مالک کے علاوہ کسی اور کو کرائے پر دینا چاہا؛ دار الافتاء مصر نے جواب دیا کہ کرایہ دار کرائے کی چیز کو آگے کرائے پر دے سکتا ہے اور اس میں شرعاً کوئی حرج نہیں، بشرطیکہ دوسرے کرائے سے چیز کو نقصان نہ ہو، چیز ایسی ہو جس کے استعمال میں لوگ مختلف نہ ہوں، اور دوسرا کرایہ پہلے سے زیادہ ہو سکتا ہے، گو مستحب یہ ہے کہ کرایہ دار نے چیز میں کوئی ایسا اضافہ کیا ہو جو زیادہ کرایہ مانگنے کا جواز بنے، تاکہ اس کی شرط لگانے والے فقہا کے اختلاف سے نکلا جائے؛ یہ سب مالک کے ساتھ معاہدے کی خلاف ورزی نہ کرنے اور کرائے کے تعلق کو منظم کرنے والے قوانین اور ان کی پابندیوں کی تعمیل سے مشروط ہے۔ دار الافتاء نے اجارے کی مشروعیت قرآن، سنت اور اجماع سے بیان کی، کرایہ دار کے آگے کرائے پر دینے کے جواز کو حنفیہ، مالکیہ، شافعیہ اور اصح قول پر حنابلہ کے جمہور اور سلف کے ایک گروہ کی طرف منسوب کیا، اور اس کی وجہ یہ بتائی کہ کرایہ دار پہلے اجارے سے منفعت کا مالک ہو گیا تو اس میں تصرف کر سکتا ہے، اور اجارہ بیع کی طرح ہے اور مبیع کو قبضے کے بعد آگے بیچنا جائز ہے۔ اس نے حنفیہ کی یہ شرط نقل کی کہ اگر دوسرا کرایہ زیادہ ہو تو کرایہ دار نے چیز میں اضافہ کیا ہو ورنہ زائد رقم صدقہ کرے، کاسانی، ابن مازہ، حطاب، شیرازی اور بہوتی کے اقوال نقل کیے، اور مصری دیوانی قانون کی دفعہ 593 اور 1981 کے قانون 136 کی دفعہ 18 کا حوالہ دیا جو پرانے کرائے کے معاہدوں میں صریح تحریری اجازت کے بغیر آگے کرائے پر دینے کی صورت میں مالک کو بے دخلی کا مطالبہ کرنے کی اجازت دیتی ہے۔"
