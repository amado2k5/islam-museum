label: { ar: "قرار مجمع الفقه الإسلامي الدولي 132 (14/6) بشأن عقود الإذعان", en: "IIFA resolution 132 (14/6) on adhesion contracts", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 132 (14/6): عقودِ اذعان", es: "Resolución 132 (14/6) de la IIFA sobre contratos de adhesión", fr: "Résolution 132 (14/6) de l'IIFA sur les contrats d'adhésion" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. عرّف عقود الإذعان بأنها مصطلح قانوني غربي حديث لاتفاقيات تحكمها خصائص: تعلق العقد بسلع أو منافع يحتاجها الناس جميعًا ⁦(كماء وكهرباء وغاز وهاتف وبريد ونقل عام)⁩؛ سيطرة الموجب على تلك السلع أو المرافق احتكارًا قانونيًا أو فعليًا أو بحيث تكون المنافسة محدودة؛ انفراد الموجب بوضع تفاصيل العقد وشروطه دون حق للطرف الآخر في مناقشتها أو تعديلها؛ وصدور الإيجاب للجمهور موحدًا مستمرًا. وقرر انعقاد عقد الإذعان بتلاقي الإيجاب والقبول الحكميين ⁦(التقديريين)⁩، وتناول حكمه وضوابطه والشروط الجائزة والممتنعة فيه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It defined adhesion contracts as a modern Western legal term for agreements marked by: the contract relating to goods or services all people need (water, electricity, gas, telephone, mail, public transport); the offeror's legal or de facto monopoly over them, or a control leaving competition narrow; the offeror alone setting the contract's details and terms with no right of the other side to discuss, cancel or amend them; and the offer being uniform, standing and addressed to the public. It ruled that the adhesion contract is concluded by the meeting of deemed offer and acceptance, and treated its ruling, controls, and the permitted and prohibited terms in it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ اس نے عقودِ اذعان کی تعریف کی: جدید مغربی قانونی اصطلاح ان معاہدوں کے لیے جن کی خصوصیات یہ ہیں کہ عقد ایسی اشیاء یا خدمات سے متعلق ہو جن کی سب کو ضرورت ہو ⁦(پانی، بجلی، گیس، فون، ڈاک، عوامی نقل)⁩؛ پیشکش کرنے والے کی قانونی یا فعلی اجارہ داری ہو یا اتنا غلبہ کہ مقابلہ محدود رہے؛ شرائط صرف وہی مقرر کرے بغیر دوسرے فریق کو گفتگو یا ترمیم کے حق کے؛ اور پیشکش عوام کے لیے یکساں اور مسلسل ہو۔ فیصلہ: عقدِ اذعان تقدیری ایجاب و قبول کے اتصال سے منعقد ہوتا ہے، اور اس کے حکم، ضوابط اور جائز و ناجائز شرائط بیان کیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (8-13 de Dhu al-Qa'da de 1423, 11-16 de enero de 2003). Definió los contratos de adhesión como un término jurídico occidental moderno para acuerdos caracterizados por: el contrato se refiere a bienes o servicios que toda persona necesita (agua, electricidad, gas, teléfono, correo, transporte público); el monopolio legal o de facto del oferente sobre ellos, o un control que limita la competencia; el oferente establece por sí solo los detalles y términos del contrato sin que la otra parte tenga derecho a discutirlos, cancelarlos o modificarlos; y la oferta es uniforme, permanente y está dirigida al público. Dictaminó que el contrato de adhesión se perfecciona mediante la coincidencia de la oferta y la aceptación tácitas, y trató su reglamentación, controles y los términos permitidos y prohibidos en él."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003) définit les contrats d'adhésion comme un terme juridique occidental moderne désignant des accords caractérisés par: un contrat portant sur des biens ou services essentiels (eau, électricité, gaz, téléphone, courrier, transports publics); un monopole légal ou de fait de l'offrant sur ces biens ou services, ou un contrôle limitant la concurrence; la fixation par l'offrant seul des modalités et conditions du contrat, sans possibilité pour l'autre partie de les discuter, de les annuler ou de les modifier; et une offre uniforme, permanente et publique. La résolution stipule que le contrat d'adhésion est conclu par la rencontre d'une offre et d'une acceptation présumées, et traite de son application, des contrôles qui y sont associés, ainsi que des clauses autorisées et interdites."
