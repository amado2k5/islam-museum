id: work/fatwa-islamqa-nail-gel-for-compulsive-skin-picking
class: work
kind: fatwa
label: { ar: "حكم المسح على جل الأظافر لمنع نتف الجلد القهري", en: "Wiping over nail gel used to stop compulsive skin-picking", ur: "جلد نوچنے کی جبری عادت روکنے کے لیے ناخن جیل پر مسح کا حکم", es: "Limpiar el gel de uñas se usa para detener la manía de pellizcarse la piel.", fr: "Essuyer le gel pour ongles utilisé pour arrêter de se gratter compulsivement la peau" }
summary:
  ar: "سائلة تعاني منذ سنوات من نتف الجلد حول الأظافر نتفًا قهريًّا يسبب جروحًا والتهابات، وتجد أن طبقة الجل على الأظافر تحد منه، فتسأل عن إبقائه في الوضوء والغسل. أجاب موقع الإسلام سؤال وجواب بأن الأصل وجوب إزالة ما يمنع وصول الماء إلى الأظافر، لكن إن احتيج إلى إبقاء الجل لدفع هذا الضرر ولم يتيسر بديل مناسب جاز إبقاؤه والمسح عليه على حكم الجبيرة ما دامت الحاجة قائمة، مع السعي إلى علاج السلوك القهري."
  en: "A woman who has for years compulsively picked the skin around her nails, causing wounds and infections, finds that a layer of gel on the nails curbs it, and asks about keeping it on during ablution and the full bath. IslamQA answered that the rule is to remove whatever keeps water from the nails, but if the gel is needed to prevent this harm and no suitable alternative is available, it may be kept and wiped over, on the ruling for a splint, for as long as the need lasts, while she seeks treatment for the compulsion."
  ur: "ایک خاتون برسوں سے ناخنوں کے گرد جلد کو جبری طور پر نوچتی ہیں جس سے زخم اور سوزش ہوتی ہے، اور انہیں معلوم ہوا کہ ناخنوں پر جیل کی تہہ اس عادت کو کم کرتی ہے؛ وہ وضو اور غسل میں اسے باقی رکھنے کے بارے میں پوچھتی ہیں۔ اسلام سوال و جواب نے جواب دیا کہ اصل یہ ہے کہ ناخنوں تک پانی پہنچنے سے روکنے والی چیز ہٹائی جائے، لیکن اگر اس نقصان سے بچنے کے لیے جیل رکھنا ضروری ہو اور کوئی مناسب متبادل نہ ہو تو جب تک ضرورت باقی ہے اسے رکھا جا سکتا ہے اور جبیرہ کے حکم پر اس پر مسح کیا جائے، ساتھ ہی اس جبری عادت کا علاج کرایا جائے۔"
  es: "Una mujer que durante años se ha arrancado compulsivamente la piel alrededor de las uñas, provocándose heridas e infecciones, descubre que una capa de gel en las uñas lo frena y pregunta si puede mantenerla puesta durante la ablución y el baño completo. IslamQA respondió que la norma es retirar todo lo que impida que el agua llegue a las uñas, pero si el gel es necesario para prevenir este daño y no hay una alternativa adecuada disponible, puede mantenerse y limpiarse, siguiendo la regla de la férula, mientras dure la necesidad, mientras busca tratamiento para la compulsión."
  fr: "Une femme qui, depuis des années, se ronge compulsivement les ongles, provoquant plaies et infections, constate qu'une couche de gel sur ses ongles l'en empêche et demande si elle peut la garder pendant ses ablutions et son bain. IslamQA a répondu que la règle est d'enlever tout ce qui empêche l'eau d'atteindre les ongles, mais que si le gel est nécessaire pour prévenir ces lésions et qu'aucune autre solution appropriée n'est disponible, elle peut le garder et l'essuyer, conformément à la règle concernant une attelle, aussi longtemps que nécessaire, le temps de se faire soigner pour cette compulsion."
