id: work/fatwa-islamqa-nail-gel-for-compulsive-skin-picking
class: work
kind: fatwa
label: { ar: "حكم المسح على جل الأظافر لمنع نتف الجلد القهري", en: "Wiping over nail gel used to stop compulsive skin-picking", ur: "جلد نوچنے کی جبری عادت روکنے کے لیے ناخن جیل پر مسح کا حکم" }
summary:
  ar: "سائلة تعاني منذ سنوات من نتف الجلد حول الأظافر نتفًا قهريًّا يسبب جروحًا والتهابات، وتجد أن طبقة الجل على الأظافر تحد منه، فتسأل عن إبقائه في الوضوء والغسل. أجاب موقع الإسلام سؤال وجواب بأن الأصل وجوب إزالة ما يمنع وصول الماء إلى الأظافر، لكن إن احتيج إلى إبقاء الجل لدفع هذا الضرر ولم يتيسر بديل مناسب جاز إبقاؤه والمسح عليه على حكم الجبيرة ما دامت الحاجة قائمة، مع السعي إلى علاج السلوك القهري."
  en: "A woman who has for years compulsively picked the skin around her nails, causing wounds and infections, finds that a layer of gel on the nails curbs it, and asks about keeping it on during ablution and the full bath. IslamQA answered that the rule is to remove whatever keeps water from the nails, but if the gel is needed to prevent this harm and no suitable alternative is available, it may be kept and wiped over, on the ruling for a splint, for as long as the need lasts, while she seeks treatment for the compulsion."
  ur: "ایک خاتون برسوں سے ناخنوں کے گرد جلد کو جبری طور پر نوچتی ہیں جس سے زخم اور سوزش ہوتی ہے، اور انہیں معلوم ہوا کہ ناخنوں پر جیل کی تہہ اس عادت کو کم کرتی ہے؛ وہ وضو اور غسل میں اسے باقی رکھنے کے بارے میں پوچھتی ہیں۔ اسلام سوال و جواب نے جواب دیا کہ اصل یہ ہے کہ ناخنوں تک پانی پہنچنے سے روکنے والی چیز ہٹائی جائے، لیکن اگر اس نقصان سے بچنے کے لیے جیل رکھنا ضروری ہو اور کوئی مناسب متبادل نہ ہو تو جب تک ضرورت باقی ہے اسے رکھا جا سکتا ہے اور جبیرہ کے حکم پر اس پر مسح کیا جائے، ساتھ ہی اس جبری عادت کا علاج کرایا جائے۔"
