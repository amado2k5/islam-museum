  fr: "al-Iqna fi al-Arud wa-Takhrij al-Qawafi, livre sur la prosodie (arud et qawafi) de al-Sahib ibn Abbad ; sa date dans une synthèse de recherche remise au musée : m. 385 H {cite:archive-org-al-iqna-fi-al-arud-wa-takhrij-al-qawafi}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
