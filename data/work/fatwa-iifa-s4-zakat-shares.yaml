label: { ar: "قرار مجمع الفقه الإسلامي الدولي 28 (4/3) بشأن زكاة الأسهم في الشركات", en: "IIFA resolution 28 (4/3) on the zakat of company shares", ur: "اکیڈمی کی قرارداد 28 (4/3): کمپنیوں کے حصص کی زکوٰۃ", es: "Resolución 28 (4/3) de la IIFA sobre el zakat de las acciones de empresas.", fr: "Résolution 28 (4/3) de l'IIFA relative à la zakat des actions de sociétés", tr: "Uluslararası İslami Fiqh Akademisi Kararı 28 (4/3) Şirket Hisselerine Zekat ile İlgili", id: "Keputusan Akademi Fiqh Islam Internasional 28 (4/3) mengenai Zakat atas Saham di Perusahaan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩ بعد تأجيل الدورة الثالثة: تجب زكاة الأسهم على أصحابها وتخرجها إدارة الشركة نيابة عنهم إذا نص نظامها الأساسي أو قررت الجمعية العمومية أو ألزم قانون الدولة أو فوّض صاحب الأسهم إدارة الشركة، وبيّن كيفية إخراجها على ما فصّل."
  en: "IIFA's fourth-session resolution 28 (4/3) (Jeddah, February 1988), after the third session's deferral: share-zakat falls on the shareholders, and the company's management pays it on their behalf when its charter provides, the general assembly resolves it, state law obliges companies to pay zakat, or the shareholder delegates the management — with the method set out."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد 28 (4/3) ⁦(جدہ، فروری 1988ء)⁩: حصص کی زکوٰۃ مالکان پر ہے؛ کمپنی مینجمنٹ مذکورہ شرائط پر ان کی جانب سے ادا کر سکتی ہے۔"
  es: "Resolución 28 (4/3) de la cuarta sesión de la IIFA (Yeda, febrero de 1988), tras el aplazamiento de la tercera sesión: el zakat sobre las acciones recae sobre los accionistas, y la administración de la empresa lo paga en su nombre cuando así lo establecen sus estatutos, la asamblea general lo resuelve, la ley estatal obliga a las empresas a pagar el zakat, o el accionista delega en la administración, con el método establecido."
  fr: "Résolution 28 (4/3) de la quatrième session de l'IIFA (Djeddah, février 1988), après le report de la troisième session: la zakat des actions incombe aux actionnaires et la direction de la société la paie en leur nom lorsque ses statuts le prévoient, que l'assemblée générale le décide, que la loi de l'État oblige les sociétés à payer la zakat ou que l'actionnaire délègue la gestion — selon la méthode établie."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumun ertelenmesinden sonra dördüncü oturumunda (Cidde, Şubat 1988) kararı: Hisseler üzerindeki zekat, hissedarlardan alınır ve şirket yönetimi, ana sözleşme, Genel Kurul veya devlet yasası bağlayıcı hüküm verirse ya da hissedar şirket yönetimini devrederse şirket yönetimi tarafından öder; ayrıca şirketin nasıl ödeneceği ayrıntılı şekilde açıklanır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keempatnya (Jeddah, Februari 1988) setelah penundaan sesi ketiga: Zakat atas saham harus dibayar oleh pemegang sahamnya, dan manajemen perusahaan membayarnya atas nama mereka jika anggaran dasar, Majelis Umum memutuskan, atau hukum negara yang mengikat, atau pemegang saham mendelegasikan manajemen perusahaan, dan dijelaskan bagaimana pembayaran tersebut sesuai rincian."
