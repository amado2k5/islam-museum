structure: "مقدمة الشارح في فصول متتابعة: إسناد الكتاب إلى مسلم، شهرة الكتاب وطرق روايته، أصح الكتب بعد القرآن، شرط مسلم، طرق مسلم في الاحتياط، إلزامات الدارقطني، روايته عن الضعفاء، الكتب المخرّجة عليه، ما استُدرك عليهما، ثم فصول في الصحيح والحسن والضعيف وألفاظ المحدثين والمعنعن والتدليس والمختلط والناسخ والمنسوخ؛ ثم شرح مقدمة مسلم، ثم الكتب على ترتيب صحيح مسلم (ط. المطبعة المصرية 1347هـ ج1 ص 6–36)."
