label:
  ar: "المنهاج شرح صحيح مسلم بن الحجاج"
  en: "al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj"
  ur: "المنہاج شرح صحیح مسلم بن الحجاج"
summary:
  ar: "شرح محيي الدين يحيى بن شرف النووي (631–676هـ) على صحيح مسلم، قصد فيه التوسط بين المختصرات المخلّة والمطولات المملّة، فيذكر الأحكام والآداب وشرح الغريب وضبط أسماء الرجال والمبهمات والجمع بين الأحاديث المختلفة ظاهراً، وقدّم له بمقدمة في إسناد الكتاب ورواته وشرط مسلم والجواب عما انتُقد عليه ومصطلح الحديث، أكثرها منقول عن ابن الصلاح {cite:sharh-nawawi-misriyya-1347-v1 p. 4-5} {cite:sharh-nawawi-misriyya-1347-v1 p. 12-15}."
  en: "The commentary of Muhyi al-Din Yahya b. Sharaf al-Nawawi (631–676 AH) on Sahih Muslim, meant as a middle way between deficient abridgements and wearisome long works: rulings, ethics, rare words, the exact names of narrators and of those left unnamed, and reconciling apparently conflicting hadiths; it opens with an introduction on the book's chain and transmitters, Muslim's condition, replies to criticism and hadith terminology, much of it quoted from Ibn al-Salah {cite:sharh-nawawi-misriyya-1347-v1 p. 4-5} {cite:sharh-nawawi-misriyya-1347-v1 p. 12-15}."
  ur: "محیی الدین یحییٰ بن شرف نووی (631–676ھ) کی صحیح مسلم پر شرح، جس میں ناقص مختصرات اور اکتا دینے والی طوالت کے درمیان متوسط راہ کا قصد کیا گیا: احکام، آداب، غریب کی شرح، رجال اور مبہمات کے ناموں کا ضبط، اور بظاہر متعارض احادیث میں تطبیق؛ اس کے شروع میں کتاب کی سند اور رواۃ، مسلم کی شرط، تنقید کے جوابات اور اصطلاحاتِ حدیث پر مقدمہ ہے، جس کا بڑا حصہ ابن الصلاح سے منقول ہے {cite:sharh-nawawi-misriyya-1347-v1 p. 4-5} {cite:sharh-nawawi-misriyya-1347-v1 p. 12-15}۔"
