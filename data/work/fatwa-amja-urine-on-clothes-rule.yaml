id: work/fatwa-amja-urine-on-clothes-rule
class: work
kind: fatwa
label: { ar: "بول الكبير والرضيع على الثياب", en: "Urine on the clothes — adult's washed, infant's by kind", ur: "کپڑوں پر پیشاب — بڑے کا دھوئیں", es: "Orina en la ropa: ropa de adulto lavada, ropa de bebé por tipo", fr: "Urine sur les vêtements — ceux des adultes lavés, ceux des bébés triés par catégorie", tr: "Büyük idrar ve kıyafetlerin üzerinde bebek", id: "Urin besar dan bayi di pakaian" }
summary:
  ar: "سأل سائل عن حكم البول إذا جاء على الملابس وحكم بول الرضيع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21949 بتاريخ 8 يوليو 2007)⁩ أن بول الكبير نجس ويجب غسل الملابس التي أصيبت به أو المكان الذي وقع عليه أما بول الرضيع فله أحكامه المعروفة بين الغلام الذي يكفيه النضح والجارية التي يغسل بولها على ما فصّل الجواب."
  en: "A questioner asked the ruling on urine reaching the clothes and on an infant's urine. Dr. Salah al-Sawi (fatwa no. 21949, 8 July 2007) answered that an adult's urine is impure — the clothes it struck or the place it fell on must be washed; an infant's urine has its known rulings — the boy's sufficing with sprinkling and the girl's being washed — as the answer details."
  ur: "کپڑے پر پیشاب؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21949، 8 جولائی 2007)⁩ کے مطابق بڑے کا دھوئیں؛ بچے کا لڑکے پر چھینٹ لڑکی پر دھلائی۔"
  es: "Un consultante preguntó sobre la norma relativa a la orina que cae sobre la ropa y sobre la orina de un bebé. El Dr. Salah al-Sawi (fatwa n.º 21949, 8 de julio de 2007) respondió que la orina de un adulto es impura; la ropa que toca o el lugar donde cae debe lavarse; la orina de un bebé tiene sus normas establecidas: en el caso del niño basta con rociarla y en el de la niña se debe lavar, como se detalla en la respuesta."
  fr: "Un internaute a posé la question concernant la règle relative à l'urine sur les vêtements et à l'urine d'un nourrisson. Le Dr Salah al-Sawi (fatwa n° 21949, 8 juillet 2007) a répondu que l'urine d'un adulte est impure; les vêtements ou la surface tachés doivent donc être lavés. Concernant l'urine d'un nourrisson, les règles sont établies: un simple aspersion suffit pour un garçon, tandis qu'un lavage est nécessaire pour une fille, comme le précise la réponse."
  tr: "Bir soru soran kişi, idrarın kıyafetlerde olup olmadığı ve bebek idrarı hakkındaki kararlar hakkında sorular soruldu. Dr. Salah Al-Sawy (8 Temmuz 2007 tarihli 21949 sayılı fetva) yetişkinin idrarının kirli olduğunu ve etkilenen giysilerin ya da düştüğü yerin yıkanması gerektiğini söyledi. Bir bebeğin idrarı konusunda, cevapta açıklandığı gibi, sıkma ile idrarı yıkanan kız arasında bilinen bir karar vardır."
  id: "Seorang penanya ditanya tentang putusan urin jika ada pada pakaian dan putusan tentang urin bayi. Dr. Salah Al-Sawy menjawab (Fatwa No. 21949 tanggal 8 Juli 2007) bahwa urin orang dewasa tidak murni dan pakaian yang terkena atau tempat urin jatuh harus dicuci. Adapun urin bayi, ada keputusan yang diketahui antara anak laki-laki yang cukup dengan satu tekanan dan seorang gadis yang urinenya sudah dicuci, seperti yang dijelaskan dalam jawaban."
