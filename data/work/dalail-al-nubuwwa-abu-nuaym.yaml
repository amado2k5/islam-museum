summary:
  ar: "دلائل النبوة للحافظ أبي نعيم أحمد بن عبد الله الأصبهاني ⁦(ت 430هـ)⁩، من أقدم مصنفات دلائل النبوة؛ مرتبة على أبواب تتحقق فيها الآيات وال المعجزات، وتضم أبواباً في المكاتبات والكتب. النسخة المقروءة طبعة دار النفائس الثانية 1406هـ/1986م."
  en: "Abu Nu'aym al-Isbahani's Dalail al-Nubuwwa (d. 430 AH), among the earliest proofs-of-prophethood compilations, arranged in chapters that include correspondence and letter chapters. The copy read is the Dar al-Nafa'is 2nd edition 1406/1986."
  es: "La obra Dalail al-Nubuwwa de Abu Nu'aym al-Isbahani (fallecido en el año 430 de la Hégira), una de las primeras compilaciones de pruebas de profecía, está organizada en capítulos que incluyen correspondencia y cartas. La copia consultada es la segunda edición de Dar al-Nafa'is (1406/1986)."
  fr: "Le Dalail al-Nubuwwa d'Abu Nu'aym al-Isbahani (mort en 430 AH), l'un des plus anciens recueils de preuves de la prophétie, est organisé en chapitres comprenant des chapitres de correspondance et de lettres. L'exemplaire consulté est la 2e édition de Dar al-Nafa'is (1406/1986)."
  ur: "ابو نعیم الاسبہانی کی دلائل النبوۃ ⁦(متوفی 430 ہجری)⁩، نبوت کے ابتدائی شواہد کی تالیفات میں سے، ابواب میں ترتیب دی گئی ہے جس میں خط و کتابت اور ابواب شامل ہیں۔ جو نسخہ پڑھا گیا ہے وہ دار النفاعی دوسرا ایڈیشن 1406/1986 ہے۔"
  tr: "Ezberci Ebu Nu'eym Ahmed bin Abdullah el-İsfahani'nin (ö. 430 Hicri yılı) Dala'il al-Nubuwwah, Dala'il al-Nubuwah'ın en eski eserlerinden biridir; ayetlerin ve mucizelerin doğrulandığı bölümlere ayrılmış ve yazışmalar ile kitaplar üzerine bölümler içerir. Okunabilir Versiyon, Dar al-Nafa'is İkinci Baskı, 1406 Hicri / 1986 M.S."
  id: "Dala'il al-Nubuwwah oleh pengapal Abu Nu'aym Ahmad ibn Abdullah al-Isfahani (wafat 430 H), salah satu karya tertua Dala'il al-Nubuwwah; diatur dalam bab-bab di mana ayat-ayat dan mukjizat diverifikasi, serta mencakup bagian tentang korespondensi dan buku. Versi yang Dapat Dibaca, Dar al-Nafa'is Edisi Kedua, 1406 H / 1986 M."
