label: { ar: "قرار مجمع الفقه الإسلامي الدولي 205 (22/1) بشأن الشورى والديمقراطية من منظور إسلامي", en: "IIFA resolution 205 (22/1) on shura and democracy from the Islamic perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 205 (22/1): شوریٰ اور جمہوریت — اسلامی تناظر میں", es: "Resolución 205 (22/1) de la IIFA sobre la shura y la democracia desde la perspectiva islámica." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. قرر المجمع أن الشورى قاعدة من قواعد الحياة الإسلامية وأساس من أسس نظام الحكم في الإسلام مأمور بها شرعًا ونفذها النبي خير تنفيذ حتى شهد له أحد أصحابه بأنه كان أكثر الناس مشورة لأصحابه؛ وأنه لا مانع شرعًا من الاستفادة من آليات الديمقراطية فيما يحقق مصلحة الفرد والمجتمع بعد فصلها عن أصلها الفلسفي الذي يقوم على حكم الشعب دون تقيد بأحكام الشريعة الإسلامية والذي قامت عليه في المجتمعات غير الإسلامية، مع مراعاة الضوابط الشرعية وخصوصيات كل دولة من الدول الإسلامية مراعاة للمصلحة التي تعتبر من أسس استنباط الحكم الشرعي في الفقه الإسلامي. وأوصى المجلس بالاهتمام بنشر ثقافة الشورى في الإسلام تأصيلًا وتطبيقًا عبر المحاضرات والندوات ومناهج التربية والتعليم ووسائل الإعلام والاتصال المعاصرة؛ وباهتمام أهل الاختصاص بالبحث عن صيغ وتطبيقات جديدة مستمدة من مبدأ الشورى مع مراعاة الضوابط الشرعية في ذلك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). It ruled that shura is one of the foundations of Islamic life and a basis of the system of government in Islam, commanded by the sharia and practised by the Prophet in the best way, one of his Companions testifying that he consulted his companions more than anyone; and that there is no legal barrier to benefiting from the mechanisms of democracy in what realises the interest of the individual and society, once detached from its philosophical origin — rule by the people unbound by the rulings of Islamic sharia, on which it stood in non-Islamic societies — while observing the legal controls and the particularities of each Islamic state, in consideration of the interest that counts among the foundations of deriving the legal ruling in Islamic jurisprudence. It recommended attention to spreading the culture of shura in Islam in foundation and application through lectures, seminars, curricula of upbringing and education, and contemporary media and communication; and that specialists attend to seeking new forms and applications derived from the principle of shura with the legal controls observed."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا کہ شوریٰ اسلامی زندگی کے قواعد میں سے ایک بنیاد اور اسلام میں نظامِ حکومت کی اساس ہے جس کا حکم شریعت نے دیا اور جسے پیغمبر نے بہترین انداز میں ادا کیا یہاں تک کہ ان کے ایک صحابی نے گواہی دی کہ وہ اپنے صحابہ سے سب سے زیادہ مشورہ کرنے والے تھے؛ اور جمہوریت کے آلات و طرزِ عمل سے فائدہ اٹھانے میں شرعی طور پر کوئی ممانعت نہیں اس شرط کے ساتھ کہ اسے اپنے فلسفیانہ مبدأ — یعنی عوام کی حکمرانی جو شریعتِ اسلامی کے احکام کی پابندی کے بغیر ہو، جس پر وہ غیر اسلامی معاشروں میں قائم تھی — سے الگ کر دیا جائے، اور شرعی ضوابط اور ہر اسلامی ملک کی خصوصیات کا لحاظ رکھا جائے، اس مفاد کو ملحوظ رکھتے ہوئے جو فقہِ اسلامی میں شرعی حکم کے استنباط کی بنیادوں میں شمار ہوتا ہے۔ اکیڈمی نے سفارش کی کہ اسلام میں شوریٰ کی ثقافت کو اساس و اطلاق کے ساتھ محاضرات، سیمینارز، تربیت و تعلیم کے نصاب اور عصری ذرائع ابلاغ و رابطہ کے ذریعے پھیلایا جائے؛ اور ماہرین شوریٰ کے اصول سے اخذ کردہ نئی صورتیں اور نئے اطلاق تلاش کریں اور اس میں شرعی ضوابط کا لحاظ رکھیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). En ella se dictaminó que la shura es uno de los fundamentos de la vida islámica y la base del sistema de gobierno en el Islam, ordenado por la sharia y practicado por el Profeta de la mejor manera, según el testimonio de uno de sus Compañeros, quien afirmó que consultaba a sus compañeros más que a nadie; y que no existe barrera legal para beneficiarse de los mecanismos de la democracia en lo que respecta al interés del individuo y la sociedad, una vez desvinculado de su origen filosófico: el gobierno del pueblo sin estar sujeto a las normas de la sharia islámica, en la que se basaba en sociedades no islámicas, respetando los controles legales y las particularidades de cada Estado islámico, en consideración del interés que se encuentra entre los fundamentos para la derivación de la norma jurídica en la jurisprudencia islámica. Recomendó prestar atención a la difusión de la cultura de la shura en el Islam, tanto en su fundamento como en su aplicación, a través de conferencias, seminarios, planes de estudio de educación y formación, y medios de comunicación contemporáneos; y que los especialistas se dediquen a buscar nuevas formas y aplicaciones derivadas del principio de la shura, respetando los controles legales."
