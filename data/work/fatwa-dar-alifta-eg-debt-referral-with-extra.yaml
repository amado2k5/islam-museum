id: work/fatwa-dar-alifta-eg-debt-referral-with-extra
class: work
kind: fatwa
label: { ar: "حكم إحالة المدين دائنه على مدين آخر مع دفع مبلغ زائد", en: "A debtor referring his creditor to another debtor with an extra payment", ur: "مدین کا اپنا مقروض دوسرے مقروض پر محال کرنا اضافی رقم کے ساتھ", es: "Un deudor que remite a su acreedor a otro deudor con un pago adicional.", fr: "Un débiteur qui recommande son créancier à un autre débiteur moyennant un paiement supplémentaire" }
summary:
  ar: "سائل سأل عن إحالة المدين دائنه بما له من دين على مدين آخر مع دفع مبلغ زائد لأجل المماطلة المحتملة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22059)⁩ أن ذلك لا يجوز شرعًا، وبيّن الجواب وجه التحريم وما يتصل به من أحكام الحوالة."
  en: "A questioner asked about a debtor referring his creditor to another debtor who owes him, with an extra payment for possible delay. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22059) answered that this is impermissible in the sharia; the answer sets out the ground of prohibition and the related rules of hawala (debt transfer)."
  ur: "ایک سائل نے پوچھا کہ مقروض اپنا مطالبہ دوسرے مقروض پر محال کرے اور ممکنہ ٹال مٹول کے عوض اضافی رقم دے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22059)⁩ نے جواب دیا کہ یہ شرعاً جائز نہیں؛ جواب میں تحریم کی وجہ اور حوالہ کے متعلقہ احکام بیان ہوئے۔"
  es: "Un consultante preguntó sobre la práctica de un deudor que remite a su acreedor a otro deudor que le debe dinero, ofreciéndole un pago adicional por una posible demora. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22059) respondió que esto es inadmisible según la sharia; la respuesta expone los fundamentos de la prohibición y las normas relacionadas con la hawala (transferencia de deudas)."
  fr: "Un internaute a posé une question concernant un débiteur qui pourrait recommander son créancier à un autre débiteur lui devant de l'argent, moyennant un paiement supplémentaire en cas de retard de paiement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22059) a répondu que cette pratique est interdite par la charia; la réponse expose les fondements de cette interdiction et les règles relatives à la hawala (transfert de dettes)."
