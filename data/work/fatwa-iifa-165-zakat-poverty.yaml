label: { ar: "قرار مجمع الفقه الإسلامي الدولي 165 (18/3) بشأن تفعيل دور الزكاة في مكافحة الفقر وتنظيم جمعها وصرفها", en: "IIFA resolution 165 (18/3) on activating zakat's role in fighting poverty and organising its collection and disbursement", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 165 (18/3): غربت کے مقابلے میں زکٰوۃ کے کردار کو فعال کرنا اور اس کی وصولی و تقسیم کی تنظیم", es: "Resolución 165 (18/3) de la IIFA sobre la activación del papel del zakat en la lucha contra la pobreza y la organización de su recaudación y distribución.", fr: "Résolution 165 (18/3) de l'IIFA sur l'activation du rôle de la zakat dans la lutte contre la pauvreté et l'organisation de sa collecte et de sa distribution" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. من بنوده: الأموال غير المنصوص عليها محل اجتهاد في زكاتها متى توافرت الشروط والضوابط؛ ليس على المزكي تعميم الأصناف الثمانية عند التوزيع وإنما يُراعى تعميمها إذا تولاها الإمام أو من ينوب عنه عند توافر المال وقيام الحاجة؛ الأصل صرف الزكاة فور استحقاقها أو تحصيلها مع جواز التأخير للمصلحة أو لقريب فقير أو للصرف الدوري لأصحاب العجز؛ يصرف للفقراء والمساكين ما يسد الحاجة ويحقق الكفاية ولمن يعولون، وللمحترف ما يشتري به أدوات حرفته. ثم عالج تنظيم الجمع والصرف في الدول الإسلامية وأحكامًا تفصيلية في الاستفادة من الاجتهادات الفقهية لتفعيل دور الزكاة في مكافحة الفقر."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). Among its clauses: wealth categories not textually specified are a matter for ijtihad on whether zakat applies, given the conditions; the individual payer need not spread his distribution across all eight categories, though the imam or his deputy should cover them where funds, need and reach allow; disbursement is in principle immediate upon due date or collection, deferral being permitted for benefit, for a poor relative, or for periodic payment to the chronically needy; the poor and destitute are given what meets need and sufficiency for them and their dependents, a tradesman enough to buy his tools. It then addressed organising collection and disbursement in Muslim states and detailed rules for drawing on juristic ijtihad to activate zakat against poverty."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ دفعات: جن مالوں کے بارے میں نص نہیں وہ زکٰوۃ کے تعلق میں اجتہاد کا میدان ہیں بشرطِ قواعد؛ فرد مزکی کو آٹھ مصارف سب میں تقسیم کی پابندی نہیں، البتہ امام یا اس کا نائب ان سب کا احاطہ کرے جہاں مال، ضرورت اور رسائی ہو؛ اصل یہ ہے کہ زکٰوۃ مستحق یا وصول ہوتے ہی صرف ہو، البتہ مصلحت، کسی غریب رشتہ دار یا دائمی ضرورت مندوں کے لیے وقفہ وار ادائیگی کی خاطر تاخیر جائز؛ فقرا و مساکین کو اتنا دیا جائے کہ ضرورت اور کفایت ہو اور ان کے تابعین کو بھی، اور کاریگر کو اتنا کہ وہ اپنے اوزار خرید سکے۔ اس کے بعد اسلامی ممالک میں وصولی و تقسیم کی تنظیم اور غربت کے خلاف زکٰوۃ کو فعال کرنے کے لیے فقہی اجتہادات سے استفادے کے تفصیلی احکام۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Entre sus cláusulas: las categorías de riqueza no especificadas textualmente son objeto de ijtihad para determinar si se aplica el zakat, dadas las condiciones; el contribuyente individual no necesita distribuir su aportación entre las ocho categorías, aunque el imán o su adjunto deben cubrirlas cuando los fondos, la necesidad y el alcance lo permitan; el desembolso es, en principio, inmediato en la fecha de vencimiento o de cobro, permitiéndose el aplazamiento para beneficio de un familiar pobre o para el pago periódico a los necesitados crónicos; a los pobres y desamparados se les da lo que satisface sus necesidades y suficiencia para ellos y sus dependientes, como a un comerciante lo suficiente para comprar sus herramientas. Luego abordó la organización de la recaudación y el desembolso en los estados musulmanes y detalló las reglas para recurrir al ijtihad jurídico para activar el zakat contra la pobreza."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, 9-14 juillet 2007). Parmi ses dispositions: les catégories de richesse non spécifiées textuellement relèvent de l'ijtihad quant à l'applicabilité de la zakat, compte tenu des conditions; le donateur individuel n'est pas tenu de répartir sa distribution sur les huit catégories, bien que l'imam ou son représentant doive les prendre en charge lorsque les fonds, les besoins et la portée le permettent; le versement est en principe immédiat à la date d'échéance ou de collecte, un report étant autorisé pour le bénéfice d'autrui, d'un parent pauvre ou pour des paiements périodiques aux personnes souffrant de besoins chroniques; les pauvres et les indigents reçoivent ce qui répond à leurs besoins et à ceux des personnes à leur charge, par exemple de quoi permettre à un artisan d'acheter ses outils. La résolution aborde ensuite l'organisation de la collecte et du versement dans les États musulmans et détaille les règles d'application de l'ijtihad juridique pour activer la zakat contre la pauvreté."
