id: work/fatwa-islamqa-asking-artificial-intelligence-for-fatwas
class: work
kind: fatwa
label: { ar: "هل يجوز استفتاء الذكاء الاصطناعي؟", en: "May one ask artificial intelligence for a fatwa?", ur: "کیا مصنوعی ذہانت سے فتویٰ لینا جائز ہے؟" }
summary:
  ar: "سؤال عن الرجوع إلى تطبيقات الذكاء الاصطناعي لسؤالها في المسائل الشرعية والاعتماد على أحكامها، أجاب فيه موقع الإسلام سؤال وجواب بأن الذكاء الاصطناعي أداة مباحة في الأصل، لكنه لا يجوز استفتاؤه ولا الاعتماد على أجوبته في الأمور الشرعية، لأنه يفتقر إلى أهلية الفتوى من الفقه في الدين وفهم الواقع وسائر شروط المفتي التي ذكرها الشافعي وابن القيم، ولأن أجوبته تُولَّد آليًا من بيانات قد تكون مجهولة المصدر أو مغلوطة أو مختلقة، وقد تحمل انحيازات من مدرّبيها، ولا تراعي تغير الأحكام الاجتهادية بتغير الأعراف والأحوال. وفرّق الموقع بين الذكاء الاصطناعي ومواقع الفتوى الإلكترونية التي يفتي فيها أناس حقيقيون، وقال إن للباحث الشرعي أن يستفيد منه في جمع المادة والوصول إلى المصادر وتلخيصها وفهم الواقع بشرط التحقق من النقول، وأن للمستفتي أن يستعمله لأخذ فكرة عامة أو لطلب روابط الفتاوى ليرجع إليها بنفسه كمحرك بحث ذكي، أما العمل بفتوى يولدها الذكاء الاصطناعي بنفسه فلا يحل. وعرض اتجاهين للمعاصرين: المنع مطلقًا، أو التفريق بين الأحكام الثابتة التي يستوي فيها المكلفون فيجوز الاستفادة من أجوبته فيها بشروط أربعة، والأحكام المبنية على الأعراف والأحوال فلا يجوز، ورجّح الموقع اتجاه المنع في الوضع الحالي."
  en: "A question about turning to artificial-intelligence applications for answers on sharia matters and relying on their rulings, in which IslamQA answered that artificial intelligence is a permissible tool in principle, but that it may not be asked for fatwas nor relied upon in religious matters, because it lacks the qualifications of a mufti, namely understanding of the religion and of reality and the other conditions set out by al-Shafi'i and Ibn al-Qayyim, and because its answers are generated automatically from data that may be of unknown origin, mistaken or fabricated, may carry the biases of its trainers, and do not account for the way discretionary rulings change with custom and circumstance. The site distinguished artificial intelligence from fatwa websites, where real people answer, and said that a scholarly researcher may use it to gather material, find sources, summarise and understand reality provided every quotation is verified, and that a layman may use it to get a general idea or to ask for links to fatwas he then consults himself, as a smart search engine, but may not act on a fatwa the system generates by itself. It set out two contemporary approaches, outright prohibition or a distinction between fixed rulings that apply equally to everyone, where its answers may be used under four conditions, and rulings built on custom and circumstance, where they may not; the site judged the prohibiting approach the stronger in the present state of the technology."
  ur: "شرعی مسائل میں مصنوعی ذہانت کی ایپلی کیشنوں سے سوال کرنے اور ان کے احکام پر اعتماد کرنے کے بارے میں سوال، جس میں اسلام سوال و جواب نے جواب دیا کہ مصنوعی ذہانت اصل میں ایک مباح آلہ ہے، لیکن اس سے فتویٰ لینا یا دینی معاملات میں اس کے جوابوں پر اعتماد کرنا جائز نہیں، کیونکہ اس میں مفتی کی اہلیت نہیں، یعنی دین کی سمجھ، واقعے کی سمجھ اور مفتی کی وہ دیگر شرائط جو شافعی اور ابن القیم نے بیان کیں، اور کیونکہ اس کے جواب ایسے ڈیٹا سے خودکار طریقے سے پیدا ہوتے ہیں جس کا ماخذ نامعلوم، غلط یا من گھڑت ہو سکتا ہے، جن میں تربیت دینے والوں کا تعصب ہو سکتا ہے، اور جو اجتہادی احکام کے عرف اور حالات کے ساتھ بدلنے کا لحاظ نہیں رکھتے۔ سائٹ نے مصنوعی ذہانت اور فتویٰ کی ویب سائٹوں میں فرق کیا جہاں حقیقی لوگ جواب دیتے ہیں، اور کہا کہ شرعی محقق اس سے مواد جمع کرنے، مصادر تک پہنچنے، خلاصہ کرنے اور واقعے کو سمجھنے میں فائدہ اٹھا سکتا ہے بشرطیکہ ہر نقل کی تصدیق کرے، اور عام آدمی اسے عمومی تصور لینے یا فتاویٰ کے لنک مانگنے کے لیے استعمال کر سکتا ہے جن کی طرف وہ خود رجوع کرے، ایک ذہین سرچ انجن کے طور پر، لیکن نظام کے خود پیدا کیے گئے فتوے پر عمل نہیں کر سکتا۔ اس نے معاصرین کے دو رجحان بیان کیے: مطلق ممانعت، یا ان ثابت احکام میں فرق جن میں سب مکلف برابر ہیں جہاں چار شرطوں کے ساتھ اس کے جوابوں سے فائدہ لیا جا سکتا ہے، اور عرف اور حالات پر مبنی احکام جہاں جائز نہیں؛ سائٹ نے موجودہ حالت میں ممانعت کے رجحان کو زیادہ قوی قرار دیا۔"
