summary:
  ar: "موسوعة شهاب الدين النويري (ت ٧٣٣هـ) في أحد وثلاثين مجلداً ونحو تسعة آلاف صفحة على خمسة فنون: الكون والإنسان والحيوان والنبات والتاريخ الذي يغلب على ثلثيها وينتهي بسنة ٧٣١هـ، وقد اقتدى في تقسيمها بمباهج الفكر للوطواط وأضاف إليه فن التاريخ، ونقّح فيها طريقة التأليف التاريخي فاختار ترتيب الحوادث على الدول لا على السنين {cite:encyclopaedia-of-islam-2 vol. 8 pp. 159-160}."
  en: "Al-Nuwayri's encyclopaedia in thirty-one volumes and some nine thousand pages over five funun — the cosmos, man, fauna, flora and history, which fills more than two-thirds and closes at 731/1331 — modelled in its plan on al-Watwat's Mabahij al-Fikr with history added, and notable for arranging its history by dynasties rather than by annals {cite:encyclopaedia-of-islam-2 vol. 8 pp. 159-160}."
  ur: "نويری کی دائرۃ المعارف، اکیس جلدوں اور تقریباً نو ہزار صفحات پر پانچ فنیں: کائنات، انسان، حیوانات، نباتات اور تاریخ جو دو تہائی سے زائد حصہ بناتی ہے اور 731ھ/1331ء پر ختم ہوتی ہے؛ ترتیب میں الوطواط کی مباہج الفکر کا پیروکار جس میں فنِ تاریخ کا اضافہ کیا، اور تاریخ کو برسوں کے بجائے سلطنتوں کے مطابق مرتب کرنے میں امتیازی {cite:encyclopaedia-of-islam-2 vol. 8 pp. 159-160}۔"
