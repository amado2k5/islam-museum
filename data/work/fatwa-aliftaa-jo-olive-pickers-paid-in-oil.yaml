id: work/fatwa-aliftaa-jo-olive-pickers-paid-in-oil
class: work
kind: fatwa
label: { ar: "أجرة قطاف الزيتون بتنكات من الزيت", en: "Paying olive pickers in tins of oil", ur: "زیتون چننے کی اجرت تیل کے کنستروں میں" }
summary:
  ar: "سؤال عن أصحاب مزارع يعطون الزيتون لمن يقطفه مقابل عدد محدد من تنكات الزيت لصاحب الشجر، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك لا يصح للغرر والجهالة، ويصح إذا كانت القسمة بالنسبة من الناتج. بيّنت الدائرة أن الجذاذ عقد يقطف فيه العامل الزيتون في الموسم دون رعاية الشجر، وأن الأصل عند الشافعية أن تكون الأجرة ناجزة معلومة مسبقًا لا نسبة من الناتج، وأن الحنابلة أجازوا الأجرة بحصة من الناتج بشرط أن تكون نسبة كالنصف أو الثلث. وقالت إن اشتراط المالك ثلاث تنكات زيت بعد العصر لا يصح، لما فيه من الغرر والجهالة، إذ قد يقل الزيت عن العدد المطلوب. ونقلت عن البهوتي في دقائق أولي النهى صحة دفع العين لمن يعمل عليها بجزء مشاع من نمائها كالشجر في المساقاة، وأن قفيز الطحان المنهي عنه محمول على مقدار ثابت من الناتج تبقى معه المنفعة مجهولة. وخلصت إلى جواز الاتفاق على القطف والعصر مقابل حصص بالنسبة كالنصف والثلث، وعدم جوازه مقابل تنكتين أو ثلاث من الزيت."
  en: "A question on farm owners who hand their olives to pickers in return for a set number of tins of oil for the owner, in which Jordan's General Iftaa Department answered that this is invalid because of uncertainty, but valid if the yield is divided by proportion. The Department explained that harvesting (jidhadh) is a contract in which the worker picks the olives in season without tending the trees; the Shafi'i principle is that a wage must be fixed and known in advance, not a share of the yield, while the Hanbalis allow a wage as a share of the yield provided it is a proportion such as a half or a third. It said the owner's stipulating three tins of oil after pressing is invalid because of uncertainty and ignorance, since the oil may fall short of the number required. It quoted al-Buhuti's Daqa'iq Uli al-Nuha that handing over property to someone who works it for a common share of its growth is valid, as with trees in sharecropping, and that the forbidden 'miller's measure' refers to a fixed quantity of the output, which leaves the worker's benefit unknown. It concluded that agreeing on picking and pressing for proportional shares, such as a half or a third, is permitted, while agreeing on two or three tins of oil is not."
  ur: "کھیتوں کے مالکان کے بارے میں سوال جو زیتون چننے والوں کو اس شرط پر دیتے ہیں کہ مالک کو تیل کے مقررہ کنستر ملیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ غرر کی وجہ سے یہ درست نہیں، البتہ پیداوار تناسب سے تقسیم ہو تو درست ہے۔ ڈیپارٹمنٹ نے واضح کیا کہ جذاذ ایسا عقد ہے جس میں مزدور درختوں کی دیکھ بھال کے بغیر موسم میں زیتون چنتا ہے؛ شافعیہ کے نزدیک اصل یہ ہے کہ اجرت پہلے سے طے شدہ اور معلوم ہو، پیداوار کا تناسب نہیں، جبکہ حنابلہ پیداوار کے حصے کو اجرت بنانے کی اجازت دیتے ہیں بشرطیکہ وہ نصف یا تہائی جیسا تناسب ہو۔ اس نے کہا کہ مالک کا پسائی کے بعد تین کنستر تیل کی شرط لگانا غرر اور جہالت کی وجہ سے درست نہیں، کیونکہ تیل مطلوبہ تعداد سے کم ہو سکتا ہے۔ اس نے بہوتی کی دقائق اولی النہیٰ سے نقل کیا کہ کسی چیز کو اس کی پیداوار کے مشترک حصے پر کام کرنے والے کے حوالے کرنا درست ہے، جیسے مساقات میں درخت، اور ممنوع قفیز الطحان سے مراد پیداوار کی مقررہ مقدار ہے جس سے مزدور کا فائدہ نامعلوم رہتا ہے۔ اس نے نتیجہ نکالا کہ نصف یا تہائی جیسے تناسب کے بدلے چنائی اور پسائی کا معاہدہ جائز ہے، اور دو یا تین کنستر تیل کے بدلے جائز نہیں۔"
