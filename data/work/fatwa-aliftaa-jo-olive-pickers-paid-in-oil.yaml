id: work/fatwa-aliftaa-jo-olive-pickers-paid-in-oil
class: work
kind: fatwa
label: { ar: "أجرة قطاف الزيتون بتنكات من الزيت", en: "Paying olive pickers in tins of oil", ur: "زیتون چننے کی اجرت تیل کے کنستروں میں", es: "Pagar a los recolectores de aceitunas con latas de aceite.", fr: "Payer les cueilleurs d'olives en boîtes d'huile", tr: "Yağ tanklarıyla zeytin toplama ücreti", id: "Upah untuk pemetik zaitun dengan tangki minyak" }
summary:
  ar: "سؤال عن أصحاب مزارع يعطون الزيتون لمن يقطفه مقابل عدد محدد من تنكات الزيت لصاحب الشجر، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك لا يصح للغرر والجهالة، ويصح إذا كانت القسمة بالنسبة من الناتج. بيّنت الدائرة أن الجذاذ عقد يقطف فيه العامل الزيتون في الموسم دون رعاية الشجر، وأن الأصل عند الشافعية أن تكون الأجرة ناجزة معلومة مسبقًا لا نسبة من الناتج، وأن الحنابلة أجازوا الأجرة بحصة من الناتج بشرط أن تكون نسبة كالنصف أو الثلث. وقالت إن اشتراط المالك ثلاث تنكات زيت بعد العصر لا يصح، لما فيه من الغرر والجهالة، إذ قد يقل الزيت عن العدد المطلوب. ونقلت عن البهوتي في دقائق أولي النهى صحة دفع العين لمن يعمل عليها بجزء مشاع من نمائها كالشجر في المساقاة، وأن قفيز الطحان المنهي عنه محمول على مقدار ثابت من الناتج تبقى معه المنفعة مجهولة. وخلصت إلى جواز الاتفاق على القطف والعصر مقابل حصص بالنسبة كالنصف والثلث، وعدم جوازه مقابل تنكتين أو ثلاث من الزيت."
  en: "A question on farm owners who hand their olives to pickers in return for a set number of tins of oil for the owner, in which Jordan's General Iftaa Department answered that this is invalid because of uncertainty, but valid if the yield is divided by proportion. The Department explained that harvesting (jidhadh) is a contract in which the worker picks the olives in season without tending the trees; the Shafi'i principle is that a wage must be fixed and known in advance, not a share of the yield, while the Hanbalis allow a wage as a share of the yield provided it is a proportion such as a half or a third. It said the owner's stipulating three tins of oil after pressing is invalid because of uncertainty and ignorance, since the oil may fall short of the number required. It quoted al-Buhuti's Daqa'iq Uli al-Nuha that handing over property to someone who works it for a common share of its growth is valid, as with trees in sharecropping, and that the forbidden 'miller's measure' refers to a fixed quantity of the output, which leaves the worker's benefit unknown. It concluded that agreeing on picking and pressing for proportional shares, such as a half or a third, is permitted, while agreeing on two or three tins of oil is not."
  ur: "کھیتوں کے مالکان کے بارے میں سوال جو زیتون چننے والوں کو اس شرط پر دیتے ہیں کہ مالک کو تیل کے مقررہ کنستر ملیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ غرر کی وجہ سے یہ درست نہیں، البتہ پیداوار تناسب سے تقسیم ہو تو درست ہے۔ ڈیپارٹمنٹ نے واضح کیا کہ جذاذ ایسا عقد ہے جس میں مزدور درختوں کی دیکھ بھال کے بغیر موسم میں زیتون چنتا ہے؛ شافعیہ کے نزدیک اصل یہ ہے کہ اجرت پہلے سے طے شدہ اور معلوم ہو، پیداوار کا تناسب نہیں، جبکہ حنابلہ پیداوار کے حصے کو اجرت بنانے کی اجازت دیتے ہیں بشرطیکہ وہ نصف یا تہائی جیسا تناسب ہو۔ اس نے کہا کہ مالک کا پسائی کے بعد تین کنستر تیل کی شرط لگانا غرر اور جہالت کی وجہ سے درست نہیں، کیونکہ تیل مطلوبہ تعداد سے کم ہو سکتا ہے۔ اس نے بہوتی کی دقائق اولی النہیٰ سے نقل کیا کہ کسی چیز کو اس کی پیداوار کے مشترک حصے پر کام کرنے والے کے حوالے کرنا درست ہے، جیسے مساقات میں درخت، اور ممنوع قفیز الطحان سے مراد پیداوار کی مقررہ مقدار ہے جس سے مزدور کا فائدہ نامعلوم رہتا ہے۔ اس نے نتیجہ نکالا کہ نصف یا تہائی جیسے تناسب کے بدلے چنائی اور پسائی کا معاہدہ جائز ہے، اور دو یا تین کنستر تیل کے بدلے جائز نہیں۔"
  es: "Una pregunta sobre los propietarios de fincas que entregan sus aceitunas a recolectores a cambio de una cantidad fija de latas de aceite para el propietario, a la que el Departamento General de Iftaa de Jordania respondió que esto es inválido debido a la incertidumbre, pero válido si la cosecha se divide proporcionalmente. El Departamento explicó que la cosecha (jidhadh) es un contrato en el que el trabajador recolecta las aceitunas en temporada sin cuidar los árboles; el principio shafi'í es que el salario debe ser fijo y conocido de antemano, no una parte de la cosecha, mientras que los hanbalíes permiten un salario como una parte de la cosecha siempre que sea una proporción como la mitad o un tercio. Dijo que la estipulación por parte del propietario de tres latas de aceite después del prensado es inválida debido a la incertidumbre y el desconocimiento, ya que el aceite puede ser inferior a la cantidad requerida. Citaba el Daqa'iq Uli al-Nuha de al-Buhuti, según el cual es válido entregar una propiedad a quien la trabaja a cambio de una parte de su crecimiento, como ocurre con los árboles en el sistema de aparcería, y que la prohibida «medida del molinero» se refiere a una cantidad fija de la producción, lo que deja en la incertidumbre el beneficio del trabajador. Concluía que está permitido acordar la recolección y el prensado a cambio de partes proporcionales, como la mitad o un tercio, mientras que acordar dos o tres latas de aceite no lo está."
  fr: "Concernant la question des propriétaires d'exploitations agricoles qui confient leurs olives à des cueilleurs en échange d'un nombre déterminé de bidons d'huile, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a statué que cette pratique est invalide en raison de l'incertitude, mais valable si la récolte est divisée au prorata. Le Département a expliqué que la récolte (jidhadh) est un contrat par lequel le travailleur cueille les olives en saison sans s'occuper des oliviers. Le principe shafi'ite exige un salaire fixe et connu à l'avance, et non un partage de la récolte, tandis que l'école hanbalite autorise un salaire proportionnel à la récolte, par exemple la moitié ou le tiers. Le Département a précisé que l'exigence par le propriétaire de trois bidons d'huile après pressage est invalide en raison de l'incertitude et de l'ignorance, car la quantité d'huile obtenue peut être inférieure à la quantité requise. L'article cite le Daqa'iq Uli al-Nuha d'al-Buhuti, selon lequel la cession d'une propriété à une personne qui la travaille en échange d'une part commune de sa récolte est valide, comme c'est le cas pour les arbres en métayage. Il précise que la notion interdite de « mesure du meunier » se réfère à une quantité fixe de la production, ce qui rend le bénéfice du travailleur inconnu. L'article conclut qu'il est permis de s'entendre sur la cueillette et le pressage en fonction de parts proportionnelles, telles que la moitié ou le tiers, tandis qu'il est interdit de s'entendre sur deux ou trois bidons d'huile."
  tr: "Çiftlik sahiplerinin, ağaç sahibine belirli sayıda yağ tankı karşılığında zeytin veren çiftlik sahiplerine ilişkin bir soruya yanıt verdi; bu durum belirsizlik veya cehalet için geçerli değil, bölünmenin verim esasına göre yapılması durumunda geçerli olduğunu belirtti. Departman, hasadın işçinin mevsiminde ağaçlara bakmadan zeytin topladığı bir sözleşme olduğunu ve Şafii ilkesinin ücretin önceden belirlenmesi gerektiğini, üretimin bir yüzdesi olarak değil, Hanbalıların ise ücretin yarı veya üçte biri olması koşuluyla paya izin verdiğini açıkladı. Fabrika, işletme sonrası üç yağ tankı koşulunun belirsizlik ve cehalet nedeniyle geçerli olmadığını, çünkü yağın gerekli miktardan az olabileceğini belirtti. Al-Bahuti'nin 'Daqa'iq Uli al-Nuha' adlı eserinde, büyümesinin bir kısmını paylaşan birine kötü göz atmanın geçerliliğini, örneğin musaka ağaçları gibi, ve yasak öğütücü özsuyunun ürünün belirli bir miktarında taşındığını, faydanın ise bilinmediğini belirtti. Hasat ve presleme konusunda anlaşmanın yarım veya üçte bir gibi pay karşılığında kabul edilebilir olduğunu, iki ya da üç kutu yağ karşılığında olmadığını sonucuna vardı."
  id: "Pertanyaan tentang pemilik pertanian yang memberikan zaitun kepada pemetik sebagai imbalan atas sejumlah tangki minyak tertentu kepada pemilik pohon, Departemen Fatwa Umum Yordania menjawab bahwa ini tidak berlaku untuk ketidakpastian atau ketidaktahuan, dan sah jika pembagian berdasarkan hasil panen. Departemen menjelaskan bahwa panen adalah kontrak di mana pekerja memetik zaitun sesuai musim tanpa merawat pohon, dan prinsip Shafi'i adalah upah harus ditetapkan di muka dan bukan persentase dari hasil, sementara Hanbal mengizinkan upah dengan bagian hasil asalkan setengah atau sepertiga. Departemen tersebut menyatakan bahwa syarat pemilik untuk tiga tangki minyak setelah penggilingan tidak berlaku karena ketidakpastian dan ketidaktahuan, karena minyak mungkin kurang dari jumlah yang dibutuhkan. Ia mengutip Al-Bahuti dalam 'Daqa'iq Uli al-Nuha' bahwa keabsahan membayar mata jahat kepada seseorang yang bekerja dengan bagian pertumbuhan yang sama, seperti pohon di musaqa, dan bahwa getah penggiling terlarang dibawa pada jumlah tetap produk, sehingga manfaatnya tidak diketahui. Ia menyimpulkan bahwa diperbolehkan menyetujui panen dan pemerasan sebagai imbalan atas saham seperti setengah atau sepertiga, dan bukan dengan dua atau tiga kaleng minyak."
