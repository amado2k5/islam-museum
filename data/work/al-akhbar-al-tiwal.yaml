  en: Al-Akhbar al-Tiwal (The Long Narratives)
  ur: الاخبار الطوال
summary:
  ar: كتاب في التاريخ لأبي حنيفة الدينوري (ت 282هـ)، يبدأ بأولاد آدم والأمم الأولى، ويعنى عناية خاصة بملوك الفرس والساسانيين وفتح العراق، ثم يسرد الفتن والأمويين والدعوة العباسية بخراسان، وينتهي بموت المعتصم سنة 227هـ {cite:akhbar-tiwal-amir intro scan p. 19}.
  en: A history by Abu Hanifa al-Dinawari (d. 282 AH). It opens with the children of Adam and the early nations, gives special attention to the Persian and Sasanian kings and the conquest of Iraq, then narrates the civil wars, the Umayyads and the Abbasid da'wa in Khurasan, ending with the death of al-Mu'tasim in 227 AH {cite:akhbar-tiwal-amir intro scan p. 19}.
  ur: ابو حنیفہ دینوری (وفات 282ھ) کی تاریخ۔ یہ اولادِ آدم اور قدیم قوموں سے شروع ہوتی ہے، فارسی اور ساسانی بادشاہوں اور فتحِ عراق پر خاص توجہ دیتی ہے، پھر فتنے، بنو امیہ اور خراسان میں عباسی دعوت بیان کرتی ہے، اور 227ھ میں معتصم کی وفات پر ختم ہوتی ہے {cite:akhbar-tiwal-amir intro scan p. 19}۔
