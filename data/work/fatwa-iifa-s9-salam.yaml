summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: السلع التي يجري فيها السلم تشمل كل ما يجوز بيعه ويمكن ضبط صفاته ويثبت دينًا في الذمة من المواد الخام والمزروعات والمصنوعات، ويجب تحديد أجل معلوم بتاريخ معين أو بالربط بأمر مؤكد الوقوع، وبيّن تطبيقاته المعاصرة على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on salam and its contemporary applications: the goods covered include anything lawfully saleable whose features can be specified and which becomes a debt on the buyer's liability — raw materials, crops, manufactures; a known term must be fixed by date or linkage to a certain event, with the contemporary applications detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ سلام پر: ہر قابل بیع چیز جس کی صفات طے ہو سکیں سلام میں آ سکتی ہے؛ معلوم مدت شرط ہے؛ عصری اطلاقات بیان ہوئے۔"
