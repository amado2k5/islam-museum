label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن السلم وتطبيقاته المعاصرة", en: "IIFA resolution on salam and its contemporary applications", ur: "اکیڈمی کی قرارداد: سلام اور اس کے عصری اطلاقات", es: "Resolución de la IIFA sobre el salam y sus aplicaciones contemporáneas.", fr: "Résolution de l'IIFA sur le salam et ses applications contemporaines", tr: "Uluslararası İslami Fiqh Akademisi'nin Barış ve Güncel Uygulamaları Kararı", id: "Keputusan Akademi Fiqh Islam Internasional tentang Perdamaian dan Aplikasi Kontemporernya" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: السلع التي يجري فيها السلم تشمل كل ما يجوز بيعه ويمكن ضبط صفاته ويثبت دينًا في الذمة من المواد الخام والمزروعات والمصنوعات، ويجب تحديد أجل معلوم بتاريخ معين أو بالربط بأمر مؤكد الوقوع، وبيّن تطبيقاته المعاصرة على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on salam and its contemporary applications: the goods covered include anything lawfully saleable whose features can be specified and which becomes a debt on the buyer's liability — raw materials, crops, manufactures; a known term must be fixed by date or linkage to a certain event, with the contemporary applications detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ سلام پر: ہر قابل بیع چیز جس کی صفات طے ہو سکیں سلام میں آ سکتی ہے؛ معلوم مدت شرط ہے؛ عصری اطلاقات بیان ہوئے۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre el salam y sus aplicaciones contemporáneas: los bienes cubiertos incluyen todo aquello que sea legalmente vendible y cuyas características puedan especificarse, y que se convierta en una deuda a cargo del comprador: materias primas, cosechas, productos manufacturados; debe fijarse un plazo conocido mediante una fecha o vinculación a un evento determinado, detallando las aplicaciones contemporáneas."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur le salam et ses applications contemporaines: les biens couverts comprennent tout ce qui est légalement vendable, dont les caractéristiques peuvent être spécifiées et qui devient une dette à la charge de l'acheteur — matières premières, récoltes, produits manufacturés; un terme connu doit être fixé par une date ou un lien avec un certain événement, avec des applications contemporaines détaillées."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin dokuzuncu oturumunda (Abu Dabi, Nisan 1995) Kararı: Salamın yapıldığı mallar, satılabilecek her şeyi, özellikleri belirlenebilen her şeyi ve hammadde, ürün ve imal edilmiş mallar şeklinde borç borcunu içerir. Belirli bir tarih belirlenmeli veya onaylanmış bir konuya bağlanmalı ve güncel uygulamaları ayrıntılı şekilde açıklanmalıdır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kesembilannya (Abu Dhabi, April 1995): Barang yang digunakan untuk melakukan salam mencakup segala sesuatu yang dapat dijual, karakteristiknya dapat ditentukan, dan utang utang yang ditetapkan dalam bentuk bahan baku, tanaman, dan barang manufaktur. Tanggal tertentu harus ditetapkan atau dikaitkan dengan suatu hal yang telah dikonfirmasi, dan aplikasi kontemporernya harus dijelaskan secara rinci."
