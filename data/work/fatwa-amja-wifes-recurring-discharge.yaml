id: work/fatwa-amja-wifes-recurring-discharge
class: work
kind: fatwa
label: { ar: "سلس الإفرازات", en: "A wife's recurring discharge — istinja, guarding, timed wudu", ur: "بار بار رطوبت — استنجاء اور وضو" }
summary:
  ar: "سأل سائل أن من زوجته ينزل سائل يشبه السائل الذي ينزل أثناء الجماع طوال الوقت. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80837 بتاريخ 19 يناير 2010)⁩ أن من لديها سلس بول أو مذي أو مني ونحوه فإنه يلزمها أن تستنجي ثم تتحفظ وتتوضأ لوقت كل صلاة وتباشر بهذا الوضوء ما شاءت من العبادات ولا تنظر إلى ما ينزل منها بعد ذلك على ما فصّل الجواب من أحكام السلس."
  en: "A questioner described fluid descending from his wife at all times, like the fluid of intercourse. Dr. Salah al-Sawi (fatwa no. 80837, 19 January 2010) answered that one with incontinence of urine, madhy, semen or the like must do istinja, then guard herself and do wudu for each prayer's time, performing by that wudu whatever worship she wishes, not minding what descends thereafter — the answer detailing the incontinence rulings."
  ur: "بیوی سے بار بار رطوبت نکلتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80837، 19 جنوری 2010)⁩ کے مطابق ہر نماز کے وقت استنجاء اور وضو کرے؛ بعد کے نزول بے ضرر۔"
