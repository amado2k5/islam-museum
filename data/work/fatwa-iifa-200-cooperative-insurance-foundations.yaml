label: { ar: "قرار مجمع الفقه الإسلامي الدولي 200 (21/6) بشأن الأحكام والضوابط الشرعية لأُسس التأمين التعاوني", en: "IIFA resolution 200 (21/6) on the legal rulings and controls for the foundations of cooperative insurance", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 200 (21/6): تعاونی بیمہ کی بنیادوں کے شرعی احکام و ضوابط", es: "Resolución 200 (21/6) de la IIFA sobre las normas jurídicas y los controles para las fundaciones de seguros cooperativos.", fr: "Résolution 200 (21/6) de l'IIFA relative aux décisions et contrôles juridiques applicables aux fondements de l'assurance coopérative", tr: "Uluslararası İslami Fıkıh Akademisi Kararı 200 (21/6) Şeriat hükümleri ve kooperatif sigorta ilkeleri için kontroller hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 200 (21/6) mengenai putusan Syariah dan pengawasan prinsip asuransi koperasi" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩ بعد ندوة علمية بجدة ⁦(20–21 جمادى الثانية 1434هـ، 30 أبريل – 1 مايو 2013م)⁩ جاءت تنفيذًا لقراره 187 ⁦(2/20)⁩. قرر أن التأمين التعاوني عقد جديد أساسه مبدأ التعاون المنضبط بضوابطه الشرعية، وأن التأمين قسمان: تجاري يهدف للربح بالمعاوضة على المخاطر، وغير تجاري لا يهدف للربح بل لمصلحة المشتركين بتحملهم الضرر — ويطلق عليه التأمين التعاوني والتكافلي والتبادلي والإسلامي. وعدّد فروقًا جوهرية بين التعاوني والتجاري أهمها: التعاوني تعاون بين مجموع المشتركين في الصندوق لتحمل المخاطر لا لتحقيق الربح فليس من عقود المعاوضة والغرر فيه مغتفر، والتجاري عقد معاوضة لنقل المخاطر من المؤمَّن له للشركة تنطبق عليه أحكام المعاوضات المالية؛ وأطرافه الصندوق والجهة الإدارية لا الشركة وحملة الوثائق؛ وموجودات الصندوق من اشتراكات حملة الوثائق وأرباحها والاحتياطات؛ والشركة المديرة تدير التغطية والاستثمار بأجر ولا تملك الأقساط المملوكة لصندوق المشتركين؛ والباقي من الأقساط وعوائدها فائض ملك لحساب الصندوق تقرر لوائحه التصرف فيه؛ وعوائد الاستثمار تعود للصندوق؛ وموجوداته عند التصفية تصرف في وجوه الخير أو للمشتركين؛ والشركة ملتزمة بأحكام الشريعة وفتاوى هيئتها الشرعية؛ ويشترك النوعان في مبادئ المصلحة التأمينية وحسن النية وأقصى قدر منها والتعويض وسببه والحلول والتحمل. ونظم القرار بإحدى وعشرين مادة: التعريف؛ أشكال إدارة الصندوق ⁦(هيئة منتخبة أو شركة متخصصة أو مؤسسة عامة)⁩؛ العلاقة بين الصندوق والإدارة ⁦(وكالة بأجر أو بغيره لأعمال التأمين، ووكالة أو مضاربة للاستثمار تستحق فيها المديرة نسبة ربح)⁩؛ الأجر على الإدارة؛ ملكية الاشتراكات وعوائدها للصندوق؛ المرجعية في تقدير أجر الجهة المديرة؛ مسؤولية الصندوق؛ الفائض التأميني؛ العجز وحالاته ⁦(تغطيته من الاحتياطي ثم القرض الحسن ثم زيادة الاشتراكات، ولا يلزم القرض الحسن شرطًا مسبقًا)⁩؛ إعادة التأمين؛ الالتزام بأحكام الشريعة؛ الرقابة الشرعية؛ تصفية الصندوق؛ فض المنازعات؛ العلاقة بين المشتركين ⁦(شركة وتعاون — النهد)⁩؛ استقلالية الصندوق؛ الانسحاب؛ الاشتراك؛ الحلول؛ التحمل؛ وملكية الأقساط."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013), after a Jeddah seminar (20–21 Jumada al-Thaniya 1434, 30 April – 1 May 2013) held under its resolution 187 (2/20). It ruled that cooperative insurance is a new contract founded on cooperation bound by sharia controls, and insurance divides into commercial — seeking profit through exchange on risk transfer — and non-commercial, seeking the subscribers' benefit by their jointly bearing harm, called cooperative, takaful, mutual or Islamic insurance. It listed essential differences: cooperative insurance is cooperation among subscribers in a fund to bear risks without profit-seeking, not an exchange contract, its gharar forgiven; commercial insurance is an exchange contract transferring risk to the company subject to financial-exchange rules; its parties are the fund and the managing body, not company and policyholders; fund assets are the subscriptions, their investment profits and reserves; the managing company runs cover and investment for a fee and does not own the premiums, which belong to the policyholders' fund; the remainder after expenses and compensations is surplus owned by the fund account, dealt with as its rules decide; investment returns go to the fund; on liquidation the assets go to charity or the subscribers; the company is bound by sharia and its sharia board's fatwas; and both kinds share the principles of insurable interest, good faith and utmost good faith, indemnity and its cause, subrogation and contribution. The resolution then organised twenty-one articles: definition; forms of fund management (elected board, specialised company, public institution); the fund–management relation (paid or unpaid agency for insurance work, agency or mudaraba for investment with the manager taking a profit share); management fee; ownership of subscriptions and returns to the fund; the reference for estimating the manager's pay; the fund's liability; the insurance surplus; deficit and its cases (covered from reserves, then qard hasan, then raised subscriptions — qard hasan not being a precondition); reinsurance; commitment to sharia; sharia supervision; liquidation; dispute settlement; the relation among subscribers (partnership and cooperation — nahd); the fund's independence; withdrawal; subscription; subrogation; contribution; and ownership of premiums."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں — جدہ کی علمی سیمینار ⁦(20–21 جمادی الثانی 1434ھ، 30 اپریل – 1 مئی 2013ء)⁩ کے بعد جو اس کی قرارداد 187 ⁦(2/20)⁩ کے نفاذ میں ہوئی۔ اکیڈمی نے فیصلہ دیا کہ تعاونی بیمہ ایک نیا عقد ہے جس کی بنیاد شرعی ضوابط سے بندھی تعاون کا اصول ہے، اور بیمہ دو قسم کا ہے: تجارتی جو خطرات کی منتقلی پر معاوضے سے منفع چاہتا ہے، اور غیر تجارتی جو منفع نہیں بلکہ صارفین کے مفاد چاہتا ہے بشرطیکہ وہ مل کر نقصان برداشت کریں — اسے تعاونی، تکافلی، باہمی یا اسلامی بیمہ کہتے ہیں۔ بنیادی فرقوں میں: تعاونی بیمہ صارفین کا فنڈ میں خطرات برداشت کرنے کا تعاون ہے منفع چاہے بغیر، معاوضہ عقد نہیں اور اس کا غرر معاف؛ تجارتی بیمہ خطرہ کمپنی کو منتقل کرنے کا معاوضہ عقد ہے جس پر مالی معاوضوں کے احکام لاگو؛ اس کے فریق فنڈ اور انتظامی ادارہ ہیں نہ کہ کمپنی اور پالیسی ہولڈرز؛ فنڈ کے اثاثے سبسکرپشن، ان کے منافع اور ذخائر ہیں؛ منتظم کمپنی کوریج اور سرمایہ کاری معاوضے پر چلاتی ہے اور قسطوں کی مالک نہیں جو پالیسی ہولڈرز کے فنڈ کی ہیں؛ اخراجات و تلافیوں کے بعد بچنے والا فاضل فنڈ اکاؤنٹ کی ملکیت ہے جس کا تصرف اس کے قواعد طے کرتے ہیں؛ سرمایہ کاری کی آمدنی فنڈ کو ملتی ہے؛ تحلیل پر اثاثے خیرات یا صارفین کو؛ کمپنی شریعت اور اس کے شرعی بورڈ کے فتاویٰ کی پابند؛ اور دونوں قسمیں بیمہ کے بنیادی اصولوں — بیمہ شدہ مفاد، حسنِ نیت اور انتہائی حسنِ نیت، تلافی اور اس کا سبب، حلول اور تحمل — میں شریک ہیں۔ قرارداد نے اکیس دفعات میں انتظام کیا: تعریف؛ فنڈ کے انتظام کی صورتیں ⁦(منتخب بورڈ، مخصوص کمپنی، عوامی ادارہ)⁩؛ فنڈ اور انتظامیہ کا تعلق ⁦(بیمہ کے کام کے لیے معاوضہ دار یا بلا معاوضہ وکالت، سرمایہ کاری کے لیے وکالت یا مضاربہ جس میں منتظمہ منافع کا حصہ لیتی ہے)⁩؛ انتظامی معاوضہ؛ سبسکرپشن اور ان کی آمدنی کی ملکیت فنڈ کی؛ منتظمہ کے معاوضے کا تخمینے کا مرجع؛ فنڈ کی ذمہ داری؛ بیمہ فاضل؛ عجز اور اس کی صورتیں ⁦(ذخائر، پھر قرضِ حسن، پھر بڑھی ہوئی سبسکرپشن سے پورا — قرضِ حسن پیشگی شرط نہیں)⁩؛ دوبارہ بیمہ؛ شریعت کی پابندی؛ شرعی نگرانی؛ فنڈ کی تحلیل؛ تنازعات کا فیصلہ؛ صارفین کا آپس کا تعلق ⁦(شرکت اور تعاون — نہد)⁩؛ فنڈ کی خودمختاری؛ دستبرداری؛ سبسکرپشن؛ حلول؛ تحمل؛ اور قسطوں کی ملکیت۔"
  es: "Una resolución colectiva de la Academia Internacional de Fiqh Islámico en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013), después de un seminario en Yeda (20-21 de Jumada al-Thaniya de 1434, 30 de abril - 1 de mayo de 2013) celebrado bajo su resolución 187 (2/20). Dictaminó que el seguro cooperativo es un nuevo contrato basado en la cooperación sujeta a controles de la sharia, y el seguro se divide en comercial - que busca ganancias a través del intercambio en la transferencia de riesgo - y no comercial, que busca el beneficio de los suscriptores mediante su carga conjunta de daños, llamado seguro cooperativo, takaful, mutuo o islámico. Enumeró las diferencias esenciales: el seguro cooperativo es cooperación entre suscriptores en un fondo para asumir riesgos sin búsqueda de ganancias, no un contrato de intercambio, su gharar perdonado; el seguro comercial es un contrato de intercambio que transfiere el riesgo a la compañía sujeto a reglas de intercambio financiero; sus partes son el fondo y el órgano de administración, no la compañía y los asegurados; Los activos del fondo son las suscripciones, sus ganancias de inversión y reservas; la compañía gestora administra la cobertura y la inversión por una tarifa y no posee las primas, que pertenecen al fondo de los asegurados; el remanente después de los gastos y compensaciones es el superávit propiedad de la cuenta del fondo, tratado según lo decidan sus reglas; los rendimientos de la inversión van al fondo; en caso de liquidación, los activos van a la caridad o a los suscriptores; la compañía está obligada por la sharia y las fatwas de su junta sharia; y ambos tipos comparten los principios de interés asegurable, buena fe y máxima buena fe, indemnización y su causa, subrogación y contribución. La resolución luego organizó veintiún artículos: definición; formas de administración del fondo (junta electa, compañía especializada, institución pública); la relación fondo-administración (agencia pagada o no pagada para el trabajo de seguros, agencia o mudaraba para inversión con el administrador tomando una participación en las ganancias); comisión de administración; propiedad de las suscripciones y rendimientos al fondo; la referencia para estimar el pago del administrador; la responsabilidad del fondo; el superávit del seguro; Déficit y sus casos (cubierto con reservas, luego qard hasan, luego suscripciones aumentadas — qard hasan no es una condición previa); reaseguro; compromiso con la sharia; supervisión de la sharia; liquidación; resolución de disputas; la relación entre los suscriptores (asociación y cooperación — nahd); independencia del fondo; retiro; suscripción; subrogación; contribución; y propiedad de las primas."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013), faisant suite à un séminaire à Djeddah (20-21 Jumada al-Thaniya 1434, 30 avril - 1er mai 2013) organisé conformément à sa résolution 187 (2/20), a statué que l'assurance coopérative est un nouveau type de contrat fondé sur la coopération et encadré par la charia. Elle distingue deux types d'assurance: l'assurance commerciale, qui vise le profit par le biais d'un échange de risques, et l'assurance non commerciale, qui vise le bénéfice des souscripteurs par la prise en charge collective des risques. Ces deux types d'assurance sont appelés assurance coopérative, takaful, mutuelle ou islamique. L'Académie a énuméré les différences essentielles suivantes: l'assurance coopérative est une coopération entre souscripteurs au sein d'un fonds pour supporter les risques sans recherche de profit, et non un contrat d'échange, dont le gharar est pardonné; l'assurance commerciale est un contrat d'échange transférant le risque à une compagnie, soumis aux règles des marchés financiers; ses parties sont le fonds et l'organe de gestion, et non la compagnie et les assurés. L'actif du fonds comprend les souscriptions, leurs revenus de placement et les réserves. La société de gestion assure la couverture et les placements moyennant des honoraires et ne perçoit pas les primes, qui appartiennent au fonds des assurés. Le solde, après déduction des frais et indemnisations, constitue l'excédent du fonds, géré conformément à ses règles. Les revenus de placement sont versés au fonds. En cas de liquidation, l'actif est reversé à des œuvres caritatives ou aux souscripteurs. La société est soumise à la charia et aux fatwas de son conseil de la charia. Les deux types de fonds partagent les principes d'intérêt assurable, de bonne foi et de pleine bonne foi, d'indemnisation et de sa cause, de subrogation et de contribution. La résolution comportait ensuite vingt et un articles: définition; formes de gestion du fonds (conseil d'administration élu, société spécialisée, établissement public); la relation fonds-gestion (mandat rémunéré ou non pour les activités d'assurance, mandat ou mudaraba pour les placements avec participation aux bénéfices pour le gestionnaire); honoraires de gestion; propriété des souscriptions et des revenus pour le fonds; référence pour le calcul de la rémunération du gestionnaire; responsabilité du fonds; excédent d'assurance. déficit et ses cas (couverts par les réserves, puis par le qard hasan, puis par des souscriptions accrues — le qard hasan n'étant pas une condition préalable); réassurance; engagement envers la charia; supervision de la charia; liquidation; règlement des différends; la relation entre les souscripteurs (partenariat et coopération — nahd); l'indépendance du fonds; retrait; souscription; subrogation; contribution; et propriété des primes."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Riyad'daki yirmi birinci oturumunda (15–19 Muharrem 1435H, 18–22 Kasım 2013) Cidde'de düzenlenen bilimsel seminerin ardından (20–21 Jumada al-Thani 1434H, 30 Nisan – 1 Mayıs 2013) 187 sayılı Kararının uygulanması hakkında toplu kararı verilmiştir. Kooperatif sigortasının, Şeriat düzenlemeleriyle disiplinli işbirliği ilkesine dayanan yeni bir sözleşme olduğu ve sigortanın iki tür olduğu kararlaştırılmıştır: riskleri dengeleyerek kâr amacı güden ticari ve zararı karşılayarak katılımcıların yararına olan ticari olmayan — buna kooperatif, takaful, karşılıklı ve İslami sigorta denir. Kooperatif ile ticari banka arasındaki temel farkları sıraladı; bunların en önemlileri şunlardır: kooperatif, fondaki tüm katılımcıların kâr elde etmek yerine risk üstlenmek için yaptığı bir işbirliğidir; çünkü içinde netleştirme veya belirsizlik sözleşmeleri için affedilmez; ticari anlaşma, finansal netleştirme kuralları hükümlerine tabi olarak sigortalıdan şirkete risklerin devredilmesi için yapılan bir mahsup sözleşmedir; tarafları fon ve idari birimdir, şirket ve poliçe sahipleri değil; fonun varlıkları poliçe sahiplerinin katkılarını, kârlarını ve rezervlerini içerir; yönetici şirket kapsam ve yatırımı ücret karşılığında yönetir ve abone fonunun sahip olduğu primlere sahip değildir; ve geri kalan primler ile getirileri fazladır Fonun mülkiyetinde olup, yönetmelikleri fonun elden çıkarılmasını belirler; yatırım getirileri fona geri dönüş sağlar; tasfiye sonrası varlıkları hayır amaçları veya katılımcıların yararına harcanır; şirket Şeriat hükümlerine ve Şeriat kurulunun fetvalarına bağlıdır; her iki tür de sigorta menfaati, iyi niyet ve azami kapsamı, tazminat ve nedeni, sübvansiyonlar ve taşıma ilkelerini paylaşır. Karar yirmi bir maddeyi düzenledi: tanım; fon yönetim biçimleri (seçilmiş organ, uzmanlaşmış şirket veya kamu kurumu); fon ile yönetim arasındaki ilişki (sigorta faaliyetleri için ödenilen veya başka şekilde ödenilen veya başka şekilde, yöneticinin kâr yüzdesi hakkına sahip olduğu ajans veya yatırım spekülasyonu); yönetim ücreti; katkıların sahipliği ve fona getirileri; yönetici kuruluşun ücretinin belirlenmesinde referans; fon yükümlülüğü; sigorta fazlası; açık ve koşulları (rezervden karşılanma, sonra faizsiz kredi, ardından artan katkılar ve faizsiz kredi ön koşul olarak zorunlu değildir); reasürans; Şeriat hükümlerine uyum; Şeriat denetimi; fon tasfiyesi; uyuşmazlık çözümü; katılımcılar arasındaki ilişkiler (şirket ve işbirliği — Al-Nahd); fon bağımsızlığı; çekilme; abonelik; çözümler; taşıma; ve taksitlerin mülkiyeti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh satu di Riyadh (15–19 Muharram 1435H, 18–22 November 2013) setelah seminar ilmiah di Jeddah (20–21 Jumada al-Thani 1434H, 30 April – 1 Mei 2013), dalam pelaksanaan Keputusan 187 (2/20). Diputuskan bahwa asuransi koperasi adalah kontrak baru yang didasarkan pada prinsip kerja sama disiplin dengan peraturan Syariahnya, dan asuransi memiliki dua jenis: komersial yang bertujuan untuk keuntungan dengan mengimbangi risiko, dan asuransi non-komersial yang tidak bertujuan untuk keuntungan tetapi demi keuntungan peserta dengan menanggung kerugian — dan disebut asuransi koperasi, takaful, timbal balik, dan asuransi Islam. Ia mencantumkan perbedaan mendasar antara koperasi dan bank komersial, yang paling penting adalah: koperasi adalah kerja sama di antara semua peserta dana untuk menanggung risiko daripada meraih keuntungan, karena tidak ada pengampunan atas kontrak netting atau ketidakpastian di dalamnya; komersial adalah kontrak kompensasi untuk mentransfer risiko dari tertanggung ke perusahaan yang tunduk pada ketentuan aturan netting keuangan; pihak-pihaknya adalah dana dan entitas administratif, bukan perusahaan dan pemegang polis; aset dana mencakup kontribusi dari pemegang polis, keuntungan dan cadangan mereka; perusahaan pengelola mengelola cakupan dan investasi dengan biaya tertentu dan tidak memiliki premi yang dimiliki oleh dana pelanggan; dan sisa premi beserta pengembalian mereka adalah surplus Dimiliki oleh dana, yang regulasinya menentukan pelepasannya; pengembalian investasi kembali ke dana; asetnya saat likuidasi digunakan untuk tujuan amal atau untuk kepentingan peserta; perusahaan berkomitmen pada putusan Syariah dan fatwa dewan Syariahnya; kedua jenis tersebut berbagi prinsip bunga asuransi, itikad baik dan cakupan maksimalnya, kompensasi dan tujuan, subsidi, dan bearing. Keputusan tersebut mengatur dua puluh satu pasal: definisi; bentuk manajemen dana (badan terpilih, perusahaan khusus, atau institusi publik); hubungan antara dana dan manajemen (dibayar atau tidak untuk kegiatan asuransi, serta spekulasi agen atau investasi di mana manajer berhak atas persentase keuntungan); remunerasi manajemen; kepemilikan kontribusi dan pengembalian dana; referensi dalam penentuan biaya entitas pengelola; kewajiban dana; surplus asuransi; defisit dan kondisinya (menutupi dari cadangan, kemudian pinjaman tanpa bunga, kemudian kontribusi yang meningkat, dan pinjaman tanpa bunga tidak diperlukan sebagai prasyarat); reasuransi; kepatuhan terhadap ketentuan Syariah; pengawasan Syariah; likuidasi dana; penyelesaian sengketa; hubungan antar peserta (perusahaan dan kerja sama — Al-Nahd); independensi dana; penarikan dana; langganan; solusi; penanggung; dan kepemilikan cicilan."
