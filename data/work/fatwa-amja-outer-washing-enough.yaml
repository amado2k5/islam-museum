id: work/fatwa-amja-outer-washing-enough
class: work
kind: fatwa
label: { ar: "غسل الظاهر من الغائط", en: "Washing the outside suffices — no probing inside", ur: "بیرونی دھلائی کافی — اندر تکلّف نہیں", es: "Basta con lavar el exterior; no hace falta indagar en el interior.", fr: "Un simple lavage extérieur suffit — inutile de sonder l'intérieur", tr: "Dışkıdan görünen şeyi yıkamak", id: "Mencuci yang tampak dari kotoran" }
summary:
  ar: "سأل سائل هل يكفي غسل الدبر من الخارج عن الغائط مع بقاء الأثر في الداخل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77983 بتاريخ 25 فبراير 2009)⁩ أن الغسل يكون للظاهر وهو سيشمل جزءًا من الداخل بالتبع أما ما وراء ذلك فلا يلزم بل هو من التكلف الذي نهينا عنه على ما فصّل الجواب."
  en: "A questioner asked whether washing the rear from outside suffices for stool while a trace remains inside. Dr. Salah al-Sawi (fatwa no. 77983, 25 February 2009) answered that washing is for the outside and covers part of the inside incidentally; what lies beyond that is not required — it is of the overreaching we were forbidden — as the answer details."
  ur: "اندروقی بقایا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77983، 25 فروری 2009)⁩ کے مطابق ظاہر کی دھلائی کافی — اندر تکلّف منع ہے۔"
  es: "Un consultante preguntó si basta con lavar la parte trasera por fuera para eliminar las heces, aunque queden restos en el interior. El Dr. Salah al-Sawi (fatwa n.º 77983, 25 de febrero de 2009) respondió que el lavado es para la parte externa y cubre parte del interior de forma incidental; lo que queda más allá no es necesario, pues se trata de una extralimitación que nos fue prohibida, como se detalla en la respuesta."
  fr: "Un internaute a demandé si le lavage externe de l'anus suffisait à éliminer les selles lorsqu'il en restait des traces à l'intérieur. Le Dr Salah al-Sawi (fatwa n° 77983, 25 février 2009) a répondu que le lavage concerne l'extérieur et couvre incidemment une partie de l'intérieur; ce qui se trouve au-delà n'est pas nécessaire – cela relève de l'excès qui nous est interdit –, comme le précise la réponse."
  tr: "Bir soru soran, işaret içeride kalırken dışkı dışkısının dışından yıkanmasının yeterli olup olmadığını sordu. Dr. Salah Al-Sawy (25 Şubat 2009 tarihli 77983 Fetva) yıkamanın dış kısma uygulandığını ve iç kısmın da dahil edileceğini yanıtladı, ancak bunun ötesinde olanlar zorunlu değil, yanıtta detaylandırıldığı üzere yasakladığımız bir formalite biçimidir."
  id: "Seorang penanya bertanya apakah cukup mencuci anus dari luar kotoran sementara bekas tetap di dalam. Dr. Salah Al-Sawy menjawab (Fatwa No. 77983 tanggal 25 Februari 2009) bahwa pencucian berlaku untuk bagian luar dan akan mencakup sebagian bagian dalam secara ekstensi, tetapi yang lebih dari itu bukanlah kewajiban melainkan bentuk formalitas yang telah kami larang, seperti yang dijelaskan dalam jawaban."
