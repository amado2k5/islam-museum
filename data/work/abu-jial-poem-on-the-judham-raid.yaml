summary:
  ar: "قصيدة على روي الراء قالها أبو جعال حين فُرغ من ردّ ما أُخذ من جذام: يذكر عاذلة تدافع في الأسارى، وأن الأمر لو وُكل إلى عوص وأوس لما رُجي العتق، ورحلتهم إلى يثرب على الإبل المجربة ووقوفهم عند النبي؛ قال ابن هشام إن قوله «ولا يُرجى لها عتق يسير» وقوله «عن العتق الأمور» عن غير ابن إسحاق."
  en: "A ra'-rhymed poem Abu Ji'al composed when the restitution to Judham was done: a reproaching woman pleading for the captives, the thought that had the matter been left to Us and Aws no release would be hoped for, their journey to Yathrib on tried camels and their stand before the Prophet; Ibn Hisham marks two phrases as from other than Ibn Ishaq."
