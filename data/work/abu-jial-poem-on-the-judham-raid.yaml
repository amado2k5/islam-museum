kids:
  ar: "قصيدة قالها رجل اسمه أبو جعال بعد أن رُدّت الأسرى إلى قبيلة جذام، يذكر فيها رحلتهم إلى يثرب على الإبل ووقوفهم أمام النبي."
  en: "A poem a man called Abu Ji'al made after captives were given back to the Judham tribe — telling of their journey to Yathrib on camels and standing before the Prophet."
  ur: "ابو جعال نامی شخص نے جذام قبیلے کو قیدی واپس ملنے کے بعد ایک قصیدہ کہا — جس میں اونٹوں پر یثرب کے سفر اور نبی کے سامنے حاضری کا ذکر ہے۔"
