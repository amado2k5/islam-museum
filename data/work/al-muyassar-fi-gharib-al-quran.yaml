summary:
  ar: "معجم مختصر لغريب القرآن على ترتيب السور، أعده فريق من الباحثين في مركز الدراسات القرآنية بمجمع الملك فهد لطباعة المصحف الشريف على حاشية مصحف المدينة النبوية، ونشره المجمع سنة 1433هـ؛ يختار للفظ وجهاً واحداً من المعاني «قبله الأئمة من أهل التفسير» بعبارة سهلة لعامة الناس، مستفيداً من «التفسير الميسر» {cite:muyassar-gharib-quran-king-fahd-1433 p.3} {cite:muyassar-gharib-quran-king-fahd-1433 p.7} {cite:muyassar-gharib-quran-king-fahd-1433 p.8} {cite:muyassar-gharib-quran-king-fahd-1433 p.9}."
  en: "A concise glossary of the rare words of the Qur'an in sura order, prepared by a team of researchers at the Centre for Qur'anic Studies of the King Fahd Complex for the Printing of the Holy Qur'an for the margin of the Medina Mushaf, and published by the Complex in 1433 AH; for each word it chooses a single meaning 'accepted by the authoritative commentators', in plain language for the general public, drawing on al-Tafsir al-muyassar."
