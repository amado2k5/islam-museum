label: { ar: "الميسر في غريب القرآن الكريم", en: "al-Muyassar fi Gharib al-Qur'an al-Karim", ur: "المیسر فی غریب القرآن الکریم", es: "al-Muyassar fi Gharib al-Qur'an al-Karim", fr: "al-Muyassar fi Gharib al-Coran al-Karim", tr: "Kur'an-ı Kerim'in tuhaflığında kolaylaştırıcı", id: "Pemfasilitator dalam keanehan Al-Qur'an" }
summary:
  ar: "معجم مختصر لغريب القرآن على ترتيب السور، أعده فريق من الباحثين في مركز الدراسات القرآنية بمجمع الملك فهد لطباعة المصحف الشريف على حاشية مصحف المدينة النبوية، ونشره المجمع سنة 1433هـ؛ يختار للفظ وجهاً واحداً من المعاني «قبله الأئمة من أهل التفسير» بعبارة سهلة لعامة الناس، مستفيداً من «التفسير الميسر» {cite:muyassar-gharib-quran-king-fahd-1433 p.3} {cite:muyassar-gharib-quran-king-fahd-1433 p.7} {cite:muyassar-gharib-quran-king-fahd-1433 p.8} {cite:muyassar-gharib-quran-king-fahd-1433 p.9}."
  en: "A concise glossary of the rare words of the Qur'an in sura order, prepared by a team of researchers at the Centre for Qur'anic Studies of the King Fahd Complex for the Printing of the Holy Qur'an for the margin of the Medina Mushaf, and published by the Complex in 1433 AH; for each word it chooses a single meaning 'accepted by the authoritative commentators', in plain language for the general public, drawing on al-Tafsir al-muyassar."
  es: "Un glosario conciso de las palabras raras del Corán en orden de suras, preparado por un equipo de investigadores del Centro de Estudios Coránicos del Complejo Rey Fahd para la Impresión del Sagrado Corán para el margen del Mushaf de Medina, y publicado por el Complejo en 1433 AH; para cada palabra, elige un único significado \"aceptado por los comentaristas autorizados\", en lenguaje sencillo para el público general, basándose en al-Tafsir al-muyassar."
  fr: "Un glossaire concis des mots rares du Coran, classés par sourate, préparé par une équipe de chercheurs du Centre d'études coraniques du Complexe du roi Fahd pour l'impression du Saint Coran, en marge du Mushaf de Médine, et publié par le Complexe en 1433 AH; pour chaque mot, il choisit une seule signification « acceptée par les commentateurs faisant autorité », en langage clair pour le grand public, s'appuyant sur al-Tafsir al-muyassar."
  ur: "قرآن کے نایاب الفاظ کی سورہ ترتیب میں ایک جامع لغت، جو مدینہ مصحف کے حاشیہ پر قرآن کی طباعت کے لیے کنگ فہد کمپلیکس کے مرکز برائے قرآنی مطالعات کے محققین کی ایک ٹیم نے تیار کی، اور کمپلیکس نے 1433 ہجری میں شائع کی۔ ہر لفظ کے لیے یہ ایک واحد معنی کا انتخاب کرتا ہے 'مستند مفسرین کی طرف سے قبول کیا جاتا ہے'، عام لوگوں کے لیے سادہ زبان میں، التفسیر المیاسر پر نقش۔"
  tr: "Kur'an'ın yabancılarının sureler tarafından düzenlendiği, Kral Fahd Kompleksi'ndeki Kur'an Araştırmaları Merkezi'nde bir araştırmacı ekibi tarafından Medine Muşaf'ın kenarına Kur'an'ın basımı için hazırlanmış, Akademi tarafından 1433 Hicri Yılında yayımlanmıştır; kelime için \"tefsir imamları tarafından kabul edilmeden önce\" anlamlarının bir yönünü seçer; genel halk için kolay bir ifadeyle \"kolay yorum\"dan faydalanır {cite:muyassar-gharib-qur'an-king-fahd-1433 s.3} {cite:muyassar-gharib-garan-can-king-fahd-1433 s.7} {cite:muyassar-gharib-garan-garan-king-fahd-1433 s.9}."
  id: "Kamus ringkas tentang orang asing dalam Al-Qur'an yang disusun oleh surah, disiapkan oleh tim peneliti di Pusat Studi Al-Qur'an di Kompleks Raja Fahd untuk pencetakan Al-Qur'an di pinggir Madinah Mushaf, diterbitkan oleh Akademi pada tahun 1433 H; kamus ini memilih satu aspek makna untuk kata \"sebelum diterima oleh para imam umat penafsiran\" dalam frasa mudah untuk masyarakat umum, dengan manfaat dari \"interpretasi mudah\" {cite:muyassar-gharib-quran-king-fahd-1433 hlm.3} {cite:muyassar-gharib-quran-king-fahd-1433 hlm.7} {cite:muyassar-gharib-quran-king-fahd-1433 hlm.9}."
