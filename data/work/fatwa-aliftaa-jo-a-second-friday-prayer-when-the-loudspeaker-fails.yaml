id: work/fatwa-aliftaa-jo-a-second-friday-prayer-when-the-loudspeaker-fails
class: work
kind: fatwa
label: { ar: "إقامة جمعة ثانية خارج المسجد عند انقطاع المكبر", en: "Holding a second Friday prayer outside when the loudspeaker fails", ur: "لاؤڈ اسپیکر بند ہونے پر مسجد کے باہر دوسرا جمعہ قائم کرنا" }
summary:
  ar: "سؤال عن مصلين خارج المسجد انقطع عنهم صوت المكبر فخطب بهم أحدهم وصلى بهم الجمعة، أجابت فيه دائرة الإفتاء العام الأردنية بأن جمعتهم لا تنعقد لأن الجمعة الأولى قائمة في المكان نفسه، وأن عليهم أن يصلوها ظهرًا. أجابت الدائرة بأن لصحة الجمعة شروطًا، منها أن تُصلى جماعة في وقت الظهر بعد خطبتين في خطة أبنية مجتمعة بأربعين ممن تجب عليهم، ونقلت ذلك عن عمدة السالك لابن النقيب المصري. وقالت إن من شروطها ألا تسبقها أو تقارنها جمعة أخرى في البلدة إلا إذا كبرت وعسر اجتماع أهلها في مكان واحد، ونقلت ذلك عن النووي في منهاج الطالبين. وقالت إنه ليس من شروطها أن يُسمع الخطيب جميع الحاضرين، بل يكفي أن يسمعه أربعون ممن تنعقد بهم، ونقلت ذلك عن الخطيب الشربيني في مغني المحتاج، فانقطاع الصوت عمن في الخارج ليس عذرًا لإقامة جمعة جديدة، وكان يكفيهم الجلوس وانتظار الإقامة. وقالت إنهم إن لم يعرفوا وقت الإقامة ولم يستطيعوا متابعة الإمام لزمهم أن يصلوا الظهر، لأنه لا تُقام جمعتان في المكان والوقت نفسيهما. وخلصت إلى أن المعتبرة من الجمعتين هي التي يؤمها الإمام الراتب، وأن من لم تنعقد جمعته يصليها ظهرًا، فإن صلاها ركعتين لزمه أن يعيدها ظهرًا."
  en: "A question about worshippers outside a mosque who lost the loudspeaker's sound, so that one of them gave a sermon and led them in the Friday prayer, in which Jordan's General Iftaa Department answered that their Friday prayer was not valid because the first one was being held in the same place, and that they must pray it as zuhr. The Department answered that the Friday prayer has conditions of validity, among them that it is prayed in congregation at the time of zuhr, after two sermons, within a settled built-up area and with forty of those obliged to attend, citing Ibn al-Naqib al-Misri's Umdat al-Salik. It said another condition is that no other Friday prayer in the town precedes or coincides with it unless the town is large and its people cannot gather in one place, citing al-Nawawi's Minhaj al-Talibin. It said it is not a condition that the preacher be heard by everyone present: it is enough that forty of those who make up the congregation hear him, citing al-Khatib al-Shirbini's Mughni al-Muhtaj. Losing the sound outside is therefore no excuse to hold a new Friday prayer; it would have been enough to sit and wait for the call to begin the prayer. It said that if they did not know when the prayer would begin and could not follow the imam, they had to pray zuhr, because two Friday prayers are not held in the same place at the same time. It concluded that the valid one of the two is the prayer led by the mosque's appointed imam, that whoever's Friday prayer was invalid prays zuhr instead, and that whoever prayed two units must repeat it as zuhr."
  ur: "مسجد کے باہر ان نمازیوں کے بارے میں سوال جن تک لاؤڈ اسپیکر کی آواز بند ہو گئی تو ان میں سے ایک نے خطبہ دے کر انہیں جمعہ پڑھایا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ان کا جمعہ منعقد نہیں ہوا کیونکہ اسی جگہ پہلا جمعہ قائم تھا، اور انہیں ظہر پڑھنی ہوگی۔ ڈیپارٹمنٹ نے جواب دیا کہ جمعہ کے صحیح ہونے کی شرطیں ہیں، جن میں یہ کہ ظہر کے وقت دو خطبوں کے بعد آبادی کی حدود میں ان چالیس افراد کے ساتھ جماعت سے پڑھا جائے جن پر جمعہ واجب ہے؛ اس نے ابن النقیب المصری کی عمدۃ السالک سے نقل کیا۔ اس نے کہا کہ ایک شرط یہ بھی ہے کہ شہر میں کوئی دوسرا جمعہ اس سے پہلے یا اس کے ساتھ نہ ہو، الا یہ کہ شہر بڑا ہو اور لوگوں کا ایک جگہ جمع ہونا مشکل ہو؛ اس نے نووی کی منہاج الطالبین سے نقل کیا۔ اس نے کہا کہ یہ شرط نہیں کہ خطیب کی آواز تمام حاضرین تک پہنچے، بلکہ ان چالیس کا سننا کافی ہے جن سے جمعہ منعقد ہوتا ہے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا۔ اس لیے باہر آواز نہ پہنچنا نیا جمعہ قائم کرنے کا عذر نہیں، بیٹھ کر اقامت کا انتظار کافی تھا۔ اس نے کہا کہ اگر انہیں اقامت کا وقت معلوم نہ ہو اور وہ امام کی پیروی نہ کر سکیں تو ان پر ظہر پڑھنا لازم ہے، کیونکہ ایک ہی جگہ اور وقت میں دو جمعے قائم نہیں ہوتے۔ اس نے نتیجہ نکالا کہ دونوں میں معتبر وہ جمعہ ہے جس کی امامت مقرر امام نے کی، جس کا جمعہ منعقد نہ ہوا وہ ظہر پڑھے، اور جس نے دو رکعتیں پڑھ لیں وہ انہیں ظہر کے طور پر دہرائے۔"
