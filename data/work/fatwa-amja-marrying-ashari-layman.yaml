id: work/fatwa-amja-marrying-ashari-layman
class: work
kind: fatwa
label: { ar: "الزواج من شخص عقيدته أشعرية", en: "Marrying a layman of Ash'ari creed", ur: "اشعری عقیدے والے عام آدمی سے شادی", es: "Casarse con un laico de la fe Ash'ari", fr: "Épouser un laïc de confession ash'arite" }
summary:
  ar: "سألت سائلة عن حكم الزواج من شخص عقيدته أشعرية وهو من عامة الناس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85393 بتاريخ 1 سبتمبر 2011)⁩ أنه لا حرج في الزواج ممن ذُكرت لاسيما إذا كان من العوام وإنما العلم بالتعلم، وسأل الله أن يرزقه رفقة صالحة تأخذ بيده على طريق اتباع السلف الصالح."
  en: "A questioner asked about marrying a person of Ash'ari creed who is a layman. Dr. Salah al-Sawi (fatwa no. 85393, 1 September 2011) answered that there is no harm in marrying such a person, especially a layman, since knowledge comes by learning, and he prayed God grant him righteous company guiding him to follow the pious predecessors. Recorded as AMJA's answer."
  ur: "ایک خاتون نے اشعری عقیدے والے عام آدمی سے شادی کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85393، 1 ستمبر 2011)⁩ کے مطابق کوئی حرج نہیں خاص طور پر عام آدمی ہو تو کیونکہ علم سیکھنے سے آتا ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de casarse con un laico de la fe ash'ari. El Dr. Salah al-Sawi (fatwa n.° 85393, 1 de septiembre de 2011) respondió que no hay inconveniente en casarse con una persona así, especialmente si es laica, ya que el conocimiento se adquiere mediante el estudio, y oró para que Dios le concediera compañía virtuosa que lo guiara a seguir los pasos de los piadosos predecesores. (Respuesta registrada como AMJA)."
  fr: "Un homme a posé une question concernant le mariage avec un laïc de confession ash'arite. Le Dr Salah al-Sawi (fatwa n° 85393, 1er septembre 2011) a répondu qu'il n'y avait aucun mal à épouser une telle personne, surtout un laïc, car la connaissance s'acquiert par l'étude. Il a prié pour que Dieu lui accorde une compagnie vertueuse qui le guide sur le chemin des pieux prédécesseurs. Cette réponse a été consignée dans la Fatwa de l'AMJA."
