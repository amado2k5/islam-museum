label: { ar: "الزواج من شخص عقيدته أشعرية", en: "Marrying a layman of Ash'ari creed", ur: "اشعری عقیدے والے عام آدمی سے شادی" }
summary:
  ar: "سألت سائلة عن حكم الزواج من شخص عقيدته أشعرية وهو من عامة الناس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85393 بتاريخ 1 سبتمبر 2011)⁩ أنه لا حرج في الزواج ممن ذُكرت لاسيما إذا كان من العوام وإنما العلم بالتعلم، وسأل الله أن يرزقه رفقة صالحة تأخذ بيده على طريق اتباع السلف الصالح."
  en: "A questioner asked about marrying a person of Ash'ari creed who is a layman. Dr. Salah al-Sawi (fatwa no. 85393, 1 September 2011) answered that there is no harm in marrying such a person, especially a layman, since knowledge comes by learning, and he prayed God grant him righteous company guiding him to follow the pious predecessors. Recorded as AMJA's answer."
  ur: "ایک خاتون نے اشعری عقیدے والے عام آدمی سے شادی کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85393، 1 ستمبر 2011)⁩ کے مطابق کوئی حرج نہیں خاص طور پر عام آدمی ہو تو کیونکہ علم سیکھنے سے آتا ہے۔"
