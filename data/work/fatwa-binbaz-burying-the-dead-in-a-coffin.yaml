id: work/fatwa-binbaz-burying-the-dead-in-a-coffin
class: work
kind: fatwa
label: { ar: "حكم وضع الميت في تابوت داخل القبر", en: "Burying the dead in a coffin inside the grave", ur: "میت کو قبر کے اندر تابوت میں رکھنے کا حکم" }
summary:
  ar: "سؤال عن وضع الميت في تابوت عند الضرورة، كأن كان غريقًا أو أنتن جسمه، وهل يُدفن في القبر مع التابوت، أجاب فيه الشيخ ابن باز بأن الغريق الذي يُنقل من بلد إلى بلد يوضع في القبر ولا بأس، وأن الميت إن كان يُخشى من إخراجه من التابوت ضرر على الناس بقي فيه ولا يُخرج، وإن كان لا يضر أُخرج ووُضع في اللحد، أما إن كان إخراجه يؤذي الناس ويشق عليهم ريحه فيُدفن بالتابوت ويكفي ذلك، وختم بالدعاء بالتوفيق وصلاح النية والعمل."
  en: "A question about placing the dead in a coffin when necessary, as for a drowned person or one whose body has begun to decay, and whether he is buried in the grave together with the coffin; Shaykh Ibn Baz answered that a drowned person carried from one country to another is placed in the grave without harm, that if taking the body out of the coffin is feared to harm people it stays in it and is not taken out, while if it does no harm the body is taken out and laid in the niche of the grave; but if taking it out would hurt people and its smell would distress them, it is buried in the coffin and that suffices. He closed with a prayer for success and for soundness of intention and action."
  ur: "ضرورت کے وقت میت کو تابوت میں رکھنے کے بارے میں سوال، جیسے ڈوبا ہوا شخص یا جس کا جسم بدبودار ہو گیا ہو، اور کیا اسے تابوت کے ساتھ قبر میں دفن کیا جائے؛ شیخ ابن باز نے جواب دیا کہ ایک ملک سے دوسرے ملک لایا گیا ڈوبا ہوا شخص قبر میں رکھا جائے، کوئی حرج نہیں؛ اگر میت کو تابوت سے نکالنے میں لوگوں کو نقصان کا خوف ہو تو وہ اس میں رہے اور نہ نکالا جائے، اور اگر نقصان نہ ہو تو نکال کر لحد میں رکھا جائے؛ لیکن اگر نکالنا لوگوں کو تکلیف دے اور اس کی بو ان پر گراں ہو تو تابوت کے ساتھ دفن کیا جائے اور یہ کافی ہے۔ انہوں نے توفیق اور نیت و عمل کی درستی کی دعا پر بات ختم کی۔"
