id: work/fatwa-binbaz-burying-the-dead-in-a-coffin
class: work
kind: fatwa
label: { ar: "حكم وضع الميت في تابوت داخل القبر", en: "Burying the dead in a coffin inside the grave", ur: "میت کو قبر کے اندر تابوت میں رکھنے کا حکم", es: "Enterrar a los muertos en un ataúd dentro de la tumba.", fr: "Enterrer le mort dans un cercueil à l'intérieur de la tombe", tr: "Ölenin mezar içindeki bir tabutu yerleştirmesine ilişkin karar", id: "Putusan tentang penempatan almarhum di dalam peti mati di dalam makam" }
summary:
  ar: "سؤال عن وضع الميت في تابوت عند الضرورة، كأن كان غريقًا أو أنتن جسمه، وهل يُدفن في القبر مع التابوت، أجاب فيه الشيخ ابن باز بأن الغريق الذي يُنقل من بلد إلى بلد يوضع في القبر ولا بأس، وأن الميت إن كان يُخشى من إخراجه من التابوت ضرر على الناس بقي فيه ولا يُخرج، وإن كان لا يضر أُخرج ووُضع في اللحد، أما إن كان إخراجه يؤذي الناس ويشق عليهم ريحه فيُدفن بالتابوت ويكفي ذلك، وختم بالدعاء بالتوفيق وصلاح النية والعمل."
  en: "A question about placing the dead in a coffin when necessary, as for a drowned person or one whose body has begun to decay, and whether he is buried in the grave together with the coffin; Shaykh Ibn Baz answered that a drowned person carried from one country to another is placed in the grave without harm, that if taking the body out of the coffin is feared to harm people it stays in it and is not taken out, while if it does no harm the body is taken out and laid in the niche of the grave; but if taking it out would hurt people and its smell would distress them, it is buried in the coffin and that suffices. He closed with a prayer for success and for soundness of intention and action."
  ur: "ضرورت کے وقت میت کو تابوت میں رکھنے کے بارے میں سوال، جیسے ڈوبا ہوا شخص یا جس کا جسم بدبودار ہو گیا ہو، اور کیا اسے تابوت کے ساتھ قبر میں دفن کیا جائے؛ شیخ ابن باز نے جواب دیا کہ ایک ملک سے دوسرے ملک لایا گیا ڈوبا ہوا شخص قبر میں رکھا جائے، کوئی حرج نہیں؛ اگر میت کو تابوت سے نکالنے میں لوگوں کو نقصان کا خوف ہو تو وہ اس میں رہے اور نہ نکالا جائے، اور اگر نقصان نہ ہو تو نکال کر لحد میں رکھا جائے؛ لیکن اگر نکالنا لوگوں کو تکلیف دے اور اس کی بو ان پر گراں ہو تو تابوت کے ساتھ دفن کیا جائے اور یہ کافی ہے۔ انہوں نے توفیق اور نیت و عمل کی درستی کی دعا پر بات ختم کی۔"
  es: "Ante una pregunta sobre la conveniencia de colocar a los muertos en un ataúd cuando sea necesario, como en el caso de una persona ahogada o cuyo cuerpo haya comenzado a descomponerse, y si se le entierra en la tumba junto con el ataúd, el Sheij Ibn Baz respondió que una persona ahogada trasladada de un país a otro se coloca en la tumba sin sufrir daño alguno; que si se teme que sacar el cuerpo del ataúd perjudique a la gente, permanece en él y no se saca; mientras que si no causa daño, el cuerpo se saca y se coloca en el nicho de la tumba; pero si sacarlo pudiera perjudicar a la gente y su olor les causara malestar, se entierra en el ataúd y eso es suficiente. Concluyó con una oración por el éxito y por la rectitud de la intención y la acción."
  fr: "Une question portait sur le placement du défunt dans un cercueil, notamment pour une personne noyée ou dont le corps est en décomposition, et sur la question de savoir si elle devait être enterrée avec le cercueil. Cheikh Ibn Baz répondit qu'une personne noyée, transportée d'un pays à l'autre, était placée dans la tombe sans dommage. Si l'on craignait que le retrait du corps du cercueil ne cause du tort à autrui, il y restait. Dans le cas contraire, le corps était retiré et déposé dans la niche de la tombe. Enfin, si le retrait du corps risquait de blesser ou d'incommoder les personnes, il était enterré dans le cercueil, et cela suffisait. Il conclut par une prière pour la réussite et pour la justesse des intentions et des actions."
  tr: "Ölen kişinin boğulup boğulmadığı veya cesedi çürüyse tabutta konulması ve tabutta birlikte mezara gömülüp gömülmemesi gerektiği sorusunu belirtti. Şeyh İbn Baz, boğulan kişinin bir yerden başka bir yere nakledilmesinin mezara konduğunu ve zarar verilmediğini söyledi. Eğer merhumun tabuttan çıkarılmasının insanlara zarar vereceğinden korkarsa, orada kalır ve gitmez. Zarar vermezse çıkarılır ve mezara konur. Ancak çıkarılması insanlara zarar verecek ve kötü kokacaksa, tabutta gömülmelidir ve bu yeterlidir. Başarı, iyi niyet ve iyi işler için dua ederek bitirdi."
  id: "Pertanyaan tentang menempatkan almarhum ke dalam peti mati jika diperlukan, misalnya jika mereka tenggelam atau tubuhnya membusuk, dan apakah mereka harus dikubur di makam bersama peti mati. Sheikh Ibn Baz menjawab bahwa orang yang tenggelam dan dipindahkan dari satu tempat ke tempat lain ditempatkan di dalam kubur dan tidak ada bahaya. Jika almarhum takut bahwa mengeluarkannya dari peti mati akan membahayakan orang, dia tetap di sana dan tidak pergi. Jika tidak merugikan, dia dibawa keluar dan ditempatkan di dalam kubur. Namun jika pengangkatannya akan membahayakan orang dan menyebabkan mereka berbau tidak sedap, dia harus dikubur di dalam peti mati, dan itu sudah cukup. Dia mengakhiri dengan doa untuk keberhasilan, niat baik, dan perbuatan baik."
