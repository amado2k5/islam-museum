id: work/fatwa-dar-alifta-eg-wudu-with-rainwater
class: work
kind: fatwa
label: { ar: "حكم الوضوء بماء المطر وفضله", en: "Wudu with rainwater and its merit", ur: "بارش کے پانی سے وضو اور اس کا فضل", es: "Wudu con agua de lluvia y su mérito", fr: "Les ablutions avec l'eau de pluie et leur mérite", tr: "Yağmur suyuyla abdest alma ve erdemi hakkındaki karar", id: "Putusan tentang wudhu dengan air hujan dan kelebihannya" }
summary:
  ar: "سائل سأل عن الوضوء بماء المطر وفضله. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22274)⁩ أن ماء المطر ماء مطلق يجوز الوضوء به ما لم يختلط بشيء يغيره تغيرًا كثيرًا يمنع إطلاق اسم الماء المطلق عليه، على ما فصّل الجواب."
  en: "A questioner asked about performing wudu with rainwater and its merit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22274) answered that rainwater is unqualified water valid for wudu unless mixed with something that changes it so greatly that it can no longer be called simply water, as the answer details."
  ur: "ایک سائل نے بارش کے پانی سے وضو اور اس کے فضل کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22274)⁩ نے جواب دیا کہ بارش کا پانی مطلق پانی ہے جس سے وضو جائز ہے جب تک ایسی چیز نہ مل جائے جو اسے اتنا بدل دے کہ اسے صرف پانی کہنا باقی نہ رہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de realizar el wudu con agua de lluvia y sus méritos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22274) respondió que el agua de lluvia es agua pura y válida para el wudu, a menos que se mezcle con algo que la altere tanto que ya no pueda considerarse simplemente agua, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant les ablutions (wudu) effectuées avec de l'eau de pluie et leurs mérites. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22274) a répondu que l'eau de pluie est une eau pure valable pour les ablutions, à moins d'être mélangée à une substance qui la modifie tellement qu'elle ne peut plus être considérée comme de l'eau, comme le précise la réponse."
  tr: "Bir soru soran yağmur suyuyla yapılan abdest alma ve erdemi hakkında bilgi aldı. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22274), yağmur suyunun abdest olduğunu ve abdest alının, mutlak su olarak adlandırılmasını engelleyen önemli bir şeyle karışmadıkça yapılabileceğini yanıtladı; bu cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang wudhu dengan air hujan dan keutamaannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22274) menjawab bahwa air hujan adalah wudhu yang dapat dilakukan kecuali bercampur dengan sesuatu yang mengubahnya secara signifikan sehingga tidak disebut air mutlak, seperti yang dijelaskan dalam jawaban."
