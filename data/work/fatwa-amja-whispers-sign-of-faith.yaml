id: work/fatwa-amja-whispers-sign-of-faith
class: work
kind: fatwa
label: { ar: "مقت الوساوس صريح الإيمان", en: "Hating the whispers is plain faith", ur: "وسوسوں سے نفرت صریح ایمان ہے", es: "Odiar los susurros es pura fe.", fr: "La haine des murmures est une foi pure et simple" }
summary:
  ar: "سأل سائل يغضب وتأتيه وساوس عند الواجب الديني الصعب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77661 بتاريخ 2 فبراير 2009)⁩ أن ما يجده في نفسه من وساوس باطلة لا يلتفت إليه ولا يتكلم به بل يستعيذ بالله ويسأله أن يصرفه عنه فإنه لا يضره إن شاء الله، وفي الباب حديث أصحابه حين سألوه إنا نجد في أنفسنا ما يتعاظم أحدنا أن يتكلم به فقال أوقد وجدتموه قالوا نعم قال ذاك صريح الإيمان، ومقصود الحديث أن كراهية هذه الوساوس وبغضها والنفور منها هو صريح الإيمان وليس وجودها، إلا أن تحولت بعضها إلى شبهات قارة فيلزمه التماس العلاج."
  en: "A questioner who grows angry and receives whispers when a religious duty proves hard asked about it. Dr. Salah al-Sawi (fatwa no. 77661, 2 February 2009) answered that the futile whispers he finds in himself deserve no attention and no utterance — let him seek refuge in God and ask Him to turn them away, they will not harm him; in the chapter stands the Companions' saying 'we find in ourselves things too grave to speak', the Prophet asking 'you really find that?', and on their yes, 'that is plain faith' — the hadith meaning that hating, detesting and recoiling from the whispers is plain faith, not their existence; should some turn into settled doubts, seeking their cure becomes required."
  ur: "ایک سائل کو دینی فرض مشکل لگنے پر وسوسے آتے تھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77661، 2 فروری 2009)⁩ کے مطابق وسوسوں سے نفرت صریح ایمان ہے — ان پر توجہ نہ دے اور پناہ مانگے؛ مستقل شبہ ہو تو علاج مانگے۔"
  es: "Un consultante que se enoja y recibe susurros cuando un deber religioso resulta difícil preguntó al respecto. El Dr. Salah al-Sawi (fatwa n.° 77661, 2 de febrero de 2009) respondió que los susurros inútiles que encuentra en sí mismo no merecen atención ni mención alguna; que busque refugio en Dios y le pida que los aleje, pues no le harán daño. En el capítulo se encuentra la frase de los Compañeros: «Encontramos en nosotros cosas demasiado graves para mencionarlas», a lo que el Profeta pregunta: «¿De verdad encuentran eso?», y a su respuesta afirmativa: «Eso es fe pura». El hadiz significa que odiar, detestar y rechazar los susurros es fe pura, no su existencia; si algunos se convierten en dudas arraigadas, es necesario buscar su cura."
  fr: "Un homme, en proie à la colère et à des murmures lorsqu'il se trouve confronté à la difficulté d'accomplir un devoir religieux, interroge à ce sujet. Le Dr Salah al-Sawi (fatwa n° 77661, 2 février 2009) répond que ces murmures futiles qu'il perçoit en lui ne méritent ni attention ni expression. Qu'il cherche refuge auprès de Dieu et Lui demande de les éloigner, car ils ne lui nuiront pas. Dans ce chapitre, on trouve la parole des Compagnons: « Nous trouvons en nous des choses trop graves pour en parler. » Le Prophète demande: « Vous le trouvez vraiment ? » Et à leur réponse affirmative: « C'est là la foi véritable. » Ce hadith signifie que haïr, détester et rejeter ces murmures est une foi véritable, et non leur existence même. Si certains doutes se transforment en doutes persistants, il devient nécessaire de chercher à les dissiper."
