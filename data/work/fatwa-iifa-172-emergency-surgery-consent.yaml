label: { ar: "قرار مجمع الفقه الإسلامي الدولي 172 (18/10) بشأن الإذن في العمليات الجراحية المستعجلة", en: "IIFA resolution 172 (18/10) on consent for urgent surgical procedures", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 172 (18/10): فوری سرجریوں کے لیے اجازت", es: "Resolución 172 (18/10) de la IIFA sobre el consentimiento para procedimientos quirúrgicos urgentes.", fr: "Résolution 172 (18/10) de l'IIFA relative au consentement pour les interventions chirurgicales urgentes" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. قرر جواز اتخاذ التدابير والإجراءات الطبية اللازمة في الحالات الإسعافية ⁦(طب الطوارئ)⁩ دون أخذ موافقة المريض أو وليه في ثلاث حالات: وصول المريض في إغماء شديد أو حالة يتعذر معها الحصول على الموافقة قبل التدخل؛ كونه في حالة صحية خطرة تعرضه للموت تتطلب التدخل السريع؛ وغياب كل قريب له حق الموافقة مع ضيق الوقت. واشترط للتدخل: أن يكون العلاج مقرًا من الجهات الصحية المختصة ومعترفًا به؛ وجود طبيب اختصاصي في فريق لا يقل عن ثلاثة أطباء يوافق على التشخيص والعلاج المقترح بمحضر موقّع؛ تفوق الفوائد المتوقعة على الأضرار مع تقليل المخاطر؛ شرح الطبيب التفاصيل للمريض بعد إفاقته؛ ومجانية المعالجة أو تحديد تكاليفها من جهة محايدة متخصصة. وأجّل البت في الحالات المستعجلة التي يرفض فيها المريض الإذن ⁦(كالزائدة الملتهبة)⁩ وفي موافقة القيصرية عند التفاف الحبل السري — وهو ما استكمله القرار 184 ⁦(19/10)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It permitted taking the necessary medical measures in emergency cases without the consent of patient or guardian in three situations: the patient arriving in deep unconsciousness or in a state making prior consent unobtainable; a life-threatening condition requiring swift intervention; and the absence of any relative entitled to consent when time is short. Conditions for intervention: the treatment must be approved and recognised by the competent health authorities; a specialist must sit on a team of no fewer than three physicians signing a minute approving the diagnosis and proposed treatment; expected benefits must outweigh harms with risks minimised; the physician must explain the full details to the patient after recovery; and treatment must be free, or its costs set by a neutral specialised body. It deferred ruling on emergencies where the patient refuses consent (such as acute appendicitis) and on consent for caesarean delivery when the cord wraps the neck — a gap later filled by resolution 184 (19/10)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے طبِ طوارئ میں مریض یا ولی کی اجازت لیے بغیر ضروری طبی انتظامات کرنے کی اجازت دی تین صورتوں میں: مریض کی گہری بے ہوشی یا وہ حالت جس میں پہلے اجازت ممکن نہ ہو؛ جان کو خطرہ ڈالنے والی حالت جس میں فوری مداخلت ضروری ہو؛ اور وقت کی قلت کے ساتھ اجازت رکھنے والے کسی قریبی کی عدم موجودگی۔ مداخلت کی شرائط: علاج مجاز طبی اداروں کی تسلیم کردہ ہو؛ کم از کم تین معالجین کی ٹیم میں ماہر موجود ہو جو تشخیص اور تجویز کردہ علاج پر دستخط شدہ منٹ کے ذریعے متفق ہو؛ متوقع فائدے نقصانات پر غالب ہوں اور خطرات کم سے کم ہوں؛ ہوش آنے پر معالج مریض کو مکمل تفصیل سمجھائے؛ اور علاج مفت ہو یا اس کی قیمت کسی غیر جانبدار مخصوص ادارے سے متعین ہو۔ ان صورتوں کا فیصلہ مؤجل رکھا جن میں مریض اجازت دینے سے انکار کرے ⁦(جیسے شدید اپنڈکس)⁩ اور سیزیرین پر رضامندی جب نال گلے میں لپٹی ہو — یہ خلا بعد میں قرارداد 184 ⁦(19/10)⁩ نے پُر کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Permitió tomar las medidas médicas necesarias en casos de emergencia sin el consentimiento del paciente o tutor en tres situaciones: el paciente llega en estado de profunda inconsciencia o en un estado que impide obtener el consentimiento previo; una condición que pone en peligro la vida y requiere una intervención rápida; y la ausencia de algún familiar con derecho a dar el consentimiento cuando el tiempo es limitado. Condiciones para la intervención: el tratamiento debe estar aprobado y reconocido por las autoridades sanitarias competentes; un especialista debe formar parte de un equipo de al menos tres médicos que firmen un acta aprobando el diagnóstico y el tratamiento propuesto; los beneficios esperados deben superar los daños, minimizando los riesgos; el médico debe explicar todos los detalles al paciente después de la recuperación; y el tratamiento debe ser gratuito, o sus costos deben ser establecidos por un organismo especializado neutral. Aplazó la decisión sobre emergencias en las que el paciente se niega a dar su consentimiento (como la apendicitis aguda) y sobre el consentimiento para el parto por cesárea cuando el cordón umbilical se enrolla alrededor del cuello, una laguna que posteriormente se subsanó con la resolución 184 (19/10)."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, soit du 9 au 14 juillet 2007) autorise la prise de mesures médicales d'urgence sans le consentement du patient ou de son tuteur dans trois situations: l'arrivée du patient dans un état d'inconscience profonde ou dans un état empêchant l'obtention d'un consentement préalable; une affection mettant sa vie en danger et nécessitant une intervention rapide; et l'absence de tout proche habilité à consentir lorsque le temps est compté. Conditions d'intervention: le traitement doit être approuvé et reconnu par les autorités sanitaires compétentes; un spécialiste doit faire partie d'une équipe d'au moins trois médecins signant un procès-verbal approuvant le diagnostic et le traitement proposé; les bénéfices attendus doivent être supérieurs aux risques, ces derniers étant minimisés; le médecin doit expliquer en détail le traitement au patient après sa guérison; et le traitement doit être gratuit, ou son coût fixé par un organisme spécialisé et indépendant. Elle a reporté sa décision sur les urgences où le patient refuse de donner son consentement (comme une appendicite aiguë) et sur le consentement pour un accouchement par césarienne lorsque le cordon s'enroule autour du cou — une lacune comblée plus tard par la résolution 184 (19/10)."
