id: work/fatwa-amja-watching-cartoons-kufr-words
class: work
kind: fatwa
label: { ar: "مشاهدة برامج تتضمن ألفاظ كفر", en: "Watching programmes containing words of disbelief", ur: "کلمات کفر پر مشتمل پروگرام دیکھنا", es: "Ver programas que contienen palabras de incredulidad", fr: "Regarder des programmes contenant des mots d'incrédulité", tr: "Küfür içeren programları izlemek", id: "Menonton program yang mengandung kata-kata penghujatan" }
summary:
  ar: "سأل سائل يتابع برامج وثائقية وأفلام كرتون أجنبية قد تتلفظ بألفاظ الكفر كقولهم غضب الطبيعة أو الحلف بغير الله وهو ينكر ذلك بقلبه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82416 بتاريخ 2 سبتمبر 2010)⁩ بنصحه أن يصون وقته فلا يهدره في مشاهدة أفلام الكرتون ونحوها من المضيعات وأن يشتغل بمعالي الأمور، ولا بأس بشيء من ذلك بين الفينة والفينة على سبيل الترويح أو للاستفادة العلمية من البرامج الوثائقية إذا خلت من المنكرات الأخرى، ولا يضره ما يقولونه من الباطل ما دام ينكره بقلبه وعنده من الفقه ما يميز به الحق من الباطل."
  en: "A questioner who watches documentaries and foreign cartoons — which may utter words of disbelief such as 'nature's wrath' or swearing by other than God, though he disavows them in his heart — asked about it. Dr. Salah al-Sawi (fatwa no. 82416, 2 September 2010) advised him to guard his time rather than waste it on cartoons and the like, and to occupy himself with higher things; occasional viewing for recreation or for the scientific benefit of documentaries is acceptable if free of other objectionable content, and their false words do not harm him so long as he disavows them in his heart and has enough understanding of the religion to tell truth from falsehood in what they say. Recorded as AMJA's answer."
  ur: "ایک سائل نے ان پروگراموں کے بارے میں پوچھا جن میں کفر کے الفاظ آتے ہیں حالانکہ وہ دل سے انکار کرتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82416، 2 ستمبر 2010)⁩ کے مطابق وقت کا تحفظ بہتر ہے؛ کبھی کبھار تفریح یا علمی فائدے کے لیے دیکھنا جائز ہے بشرط دیگر منکرات نہ ہوں اور وہ باطل کو دل میں برا جانے۔"
  es: "Un consultante que ve documentales y dibujos animados extranjeros —que pueden contener expresiones de incredulidad como «la ira de la naturaleza» o juramentos que no sean de Dios, aunque él los repudie en su corazón— preguntó al respecto. El Dr. Salah al-Sawi (fatwa n.º 82416, 2 de septiembre de 2010) le aconsejó que cuidara su tiempo en lugar de desperdiciarlo en dibujos animados y similares, y que se dedicara a cosas más elevadas; ver documentales ocasionalmente por recreación o para el beneficio científico es aceptable si no contienen otros contenidos objetables, y sus falsas palabras no le perjudican siempre que las repudie en su corazón y tenga suficiente conocimiento de la religión para discernir la verdad de la falsedad en lo que dicen. Registrada como respuesta de AMJA."
  fr: "Un homme qui regarde des documentaires et des dessins animés étrangers – susceptibles de contenir des propos incrédules tels que « la colère de la nature » ou des blasphèmes, bien qu'il les rejette intérieurement – a posé la question. Le Dr Salah al-Sawi (fatwa n° 82416, 2 septembre 2010) lui a conseillé de ne pas gaspiller son temps avec des dessins animés et autres programmes similaires, et de se consacrer à des activités plus élevées. Il a précisé qu'un visionnage occasionnel, à des fins de divertissement ou d'intérêt scientifique, de documentaires était acceptable s'ils ne contenaient aucun autre élément répréhensible, et que les propos erronés qu'ils véhiculent ne lui nuisaient pas tant qu'il les rejetait intérieurement et qu'il possédait une compréhension suffisante de la religion pour discerner le vrai du faux dans leurs propos. Cette réponse a été consignée dans la fatwa de l'AMJA."
  tr: "Yabancı belgesel programları ve karikatürleri takip eden bir soru soran kişi, 'doğanın gazabı' veya 'Allah'tan başka birine yemin etmek' gibi inançsızlık ifadeleri söyleyebilir, oysa o bunu kalbinde reddeder. Dr. Salah Al-Sawy (Fetva No. 82416, 2 Eylül 2010) ona zamanını korumasını, çizgi film izlemek ve benzeri israf şeylerle harcamamasını ve iyi şeylere odaklanmasını tavsiye etti. Zaman zaman eğlence veya bilimsel fayda için belgesel programlarda başka ahlaksız eylemlerden arınmış olmaları halinde bunu yapmanın zararı yoktur. Yalan hakkında söyledikleri, kalbinde inkar ettiği ve doğruyu yalandan ayırt edecek hukuk bilgisine sahip olduğu sürece ona zarar vermez."
  id: "Seorang penanya yang mengikuti program dokumenter dan kartun asing mungkin mengucapkan kata-kata tidak percaya, seperti mengatakan 'murka alam' atau 'bersumpah demi Allah selain Allah,' sementara ia menyangkal hal itu dalam hatinya. Dr. Salah Al-Sawy (Fatwa No. 82416 tanggal 2 September 2010) menjawab dengan menasihatinya untuk menjaga waktunya, tidak membuangnya menonton kartun dan hal-hal pemboros serupa, serta fokus pada hal-hal baik. Tidak ada salahnya melakukannya sesekali untuk rekreasi atau demi manfaat ilmiah dari program dokumenter jika program tersebut bebas dari tindakan tidak bermoral lainnya. Apa yang mereka katakan tentang kebohongan tidak merugikan dirinya selama ia menyangkalnya di dalam hatinya dan memiliki yurisprudensi untuk membedakan kebenaran dari kebohongan."
