id: work/fatwa-amja-irregular-menses-istihada
class: work
kind: fatwa
label: { ar: "الحيض والاستحاضة", en: "Menses past its course — istihada and its discipline", ur: "حیض سے زیادہ خون — استحاضہ" }
summary:
  ar: "سألت امرأة أن دم حيضها يدوم عادة سبعة أيام لكنه اختلف هذا الشهر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85787 بتاريخ 30 أكتوبر 2011)⁩ أن في دم الحيض تعمل المعتادة بعادتها وتعمل المميزة بتمييزها وأقصى مدة لدم الحيض أسبوعان فما زاد عن ذلك فهو استحاضة، فتغتسل وتحفظ من انتشار الدم وتتوضأ لوقت كل صلاة وتباشر بهذا الوضوء فيما بين الوقتين كل أنواع العبادات التي تجب لها الطهارة فإذا دخل وقت الصلاة الأخرى جددت الوضوء ويستمر هذا الحال إلى أن ينقطع الدم وتعود الأمور إلى عادتها على ما فصّل."
  en: "A woman whose menses usually lasted seven days found it differed this month. Dr. Salah al-Sawi (fatwa no. 85787, 30 October 2011) answered that in menstrual blood the habitual woman works by her habit and the distinguishing woman by her distinction; the utmost span of menses is a fortnight, and what passes that is istihada — she washes, guards against the blood's spreading, does wudu for each prayer-time and performs by it, between the two times, every worship requiring purity; at the next prayer-time she renews wudu, and this holds until the blood stops and matters return to her habit — as detailed."
  ur: "ایک خاتون کے حیض کا معمول بگڑا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85787، 30 اکتوبر 2011)⁩ کے مطابق حیض کی اقصی مدت دو ہفتے ہیں — ما بعد استحاضہ ہے جس میں ہر وقت پر نیا وضو ہوتا ہے۔"
