id: work/fatwa-amja-irregular-menses-istihada
class: work
kind: fatwa
label: { ar: "الحيض والاستحاضة", en: "Menses past its course — istihada and its discipline", ur: "حیض سے زیادہ خون — استحاضہ", es: "Menstruación pasada su curso: la istihada y su disciplina", fr: "Les menstruations terminées — istihada et sa discipline", tr: "Adet ve İstihada", id: "Menstruasi dan Istihada" }
summary:
  ar: "سألت امرأة أن دم حيضها يدوم عادة سبعة أيام لكنه اختلف هذا الشهر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85787 بتاريخ 30 أكتوبر 2011)⁩ أن في دم الحيض تعمل المعتادة بعادتها وتعمل المميزة بتمييزها وأقصى مدة لدم الحيض أسبوعان فما زاد عن ذلك فهو استحاضة، فتغتسل وتحفظ من انتشار الدم وتتوضأ لوقت كل صلاة وتباشر بهذا الوضوء فيما بين الوقتين كل أنواع العبادات التي تجب لها الطهارة فإذا دخل وقت الصلاة الأخرى جددت الوضوء ويستمر هذا الحال إلى أن ينقطع الدم وتعود الأمور إلى عادتها على ما فصّل."
  en: "A woman whose menses usually lasted seven days found it differed this month. Dr. Salah al-Sawi (fatwa no. 85787, 30 October 2011) answered that in menstrual blood the habitual woman works by her habit and the distinguishing woman by her distinction; the utmost span of menses is a fortnight, and what passes that is istihada — she washes, guards against the blood's spreading, does wudu for each prayer-time and performs by it, between the two times, every worship requiring purity; at the next prayer-time she renews wudu, and this holds until the blood stops and matters return to her habit — as detailed."
  ur: "ایک خاتون کے حیض کا معمول بگڑا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85787، 30 اکتوبر 2011)⁩ کے مطابق حیض کی اقصی مدت دو ہفتے ہیں — ما بعد استحاضہ ہے جس میں ہر وقت پر نیا وضو ہوتا ہے۔"
  es: "Una mujer cuyo periodo menstrual solía durar siete días descubrió que este mes era diferente. El Dr. Salah al-Sawi (fatwa n.º 85787, 30 de octubre de 2011) respondió que, en cuanto a la sangre menstrual, la mujer habitual actúa según su costumbre y la mujer que se distingue por su particularidad; la duración máxima de la menstruación es de quince días, y lo que pasa después es istihada: se lava, se protege de la propagación de la sangre, realiza la ablución para cada hora de oración y, entre ambas, realiza todos los actos de adoración que requieren pureza; en la siguiente hora de oración renueva la ablución, y esto se mantiene hasta que cesa la sangre y las cosas vuelven a su costumbre, como se detalla."
  fr: "Une femme dont les règles duraient habituellement sept jours a constaté une différence ce mois-ci. Le Dr Salah al-Sawi (fatwa n° 85787, 30 octobre 2011) a expliqué que, durant les menstruations, la femme « habituelle » agit selon ses habitudes et la femme « distinguée » selon ses particularités; la durée maximale des menstruations est de quinze jours, et ce qui suit est appelé istihada: la femme se lave, se protège des saignements, fait ses ablutions (wudu) avant chaque prière et accomplit, entre les deux, tous les actes d’adoration nécessitant pureté; à la prière suivante, elle refait ses ablutions, et ainsi de suite jusqu’à l’arrêt des saignements, après quoi elle reprend ses habitudes."
  tr: "Bir kadına adet kanının genellikle yedi gün sürdüğünü, ancak bu ayın farklı olduğunu sordum. Dr. Salah Al-Sawy (30 Ekim 2011 tarihli Fetva No. 85787) adet kanıyla olağan uygulamanın olağan şekilde yapıldığını ve ayırt edici uygulamanın farklı olduğunu söyledi. Adet kanının maksimum süresi iki hafta veya daha fazladır ve bu isidha (istihada) olarak kabul edilir. Kadın yıkanır, kanın yayılmasını engeller, her namaz zamanına kadar abdest alır ve arınma gerektiren tüm ibadet işlemleri için bu abdestleri iki zaman arasında yapar. Diğer namaz zamanı başlarsa, abdest almayı yeniler ve bu durum kanama durana ve her şey belirtilen şekilde normal düzenine dönene kadar devam eder."
  id: "Saya bertanya kepada seorang wanita bahwa darah menstruasinya biasanya berlangsung tujuh hari, tetapi bulan ini berbeda. Dr. Salah Al-Sawy menjawab (Fatwa No. 85787 tertanggal 30 Oktober 2011) bahwa dengan darah menstruasi, praktik biasa dilakukan seperti biasa, dan praktik khas itu berbeda. Durasi maksimum darah menstruasi adalah dua minggu atau lebih dianggap sebagai isisidha (istihada). Dia mandi, menjaga agar darah tidak menyebar, melakukan wudhu sampai waktu setiap doa, dan melakukan wudhu ini di antara dua waktu untuk semua jenis ibadah yang memerlukan penyucian. Jika waktu untuk doa lain dimulai, dia memperbarui wudhu, dan kondisi ini berlanjut sampai pendarahan berhenti dan keadaan kembali ke rutinitas biasa seperti yang ditentukan."
