summary:
  ar: "سأل سائل ملحوظات على كتاب حد الإسلام. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21866 بتاريخ 3 سبتمبر 2007)⁩ أنه لا ينصح بقراءة هذا الكتاب إلا لأهل العلم والمستبصرين من طلبة العلم لإظهار ما به من أخطاء عقدية قد تلبس على الناس."
  en: "A questioner asked for remarks on the book 'The Limit of Islam'. The site's sharia department (fatwa no. 21866, 3 September 2007) answered that they do not recommend reading it except to scholars and the clear-sighted among students — to expose the creed-errors in it that might deceive people. Recorded as AMJA's answer."
  ur: "ایک سائل نے کتاب حد الاسلام پر رائے پوچھی۔ شریعت شعبے ⁦(فتویٰ 21866، 3 ستمبر 2007)⁩ کے مطابق اسے صرف علماء اور مستبصر طلبہ پڑھیں تاکہ اس کی عقیدتی غلطیاں ظاہر ہوں۔"
  es: "Un usuario solicitó comentarios sobre el libro «El límite del Islam». El departamento de la sharia del sitio (fatwa n.° 21866, 3 de septiembre de 2007) respondió que no recomiendan su lectura, salvo a eruditos y estudiantes perspicaces, para desenmascarar los errores doctrinales que contiene y que podrían inducir a error. Esta respuesta fue registrada por AMJA."
