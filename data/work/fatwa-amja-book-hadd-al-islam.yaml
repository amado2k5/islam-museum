label: { ar: "كتاب حد الإسلام", en: "The book 'The Limit of Islam' — a reading caution", ur: "کتاب حد الاسلام — احتیاط", es: "El libro 'El límite del Islam': una advertencia para su lectura", fr: "Le livre « Les limites de l’islam » — une mise en garde à la lecture", tr: "İslam'ın sınır kitabı", id: "Kitab batas Islam" }
summary:
  ar: "سأل سائل ملحوظات على كتاب حد الإسلام. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21866 بتاريخ 3 سبتمبر 2007)⁩ أنه لا ينصح بقراءة هذا الكتاب إلا لأهل العلم والمستبصرين من طلبة العلم لإظهار ما به من أخطاء عقدية قد تلبس على الناس."
  en: "A questioner asked for remarks on the book 'The Limit of Islam'. The site's sharia department (fatwa no. 21866, 3 September 2007) answered that they do not recommend reading it except to scholars and the clear-sighted among students — to expose the creed-errors in it that might deceive people. Recorded as AMJA's answer."
  ur: "ایک سائل نے کتاب حد الاسلام پر رائے پوچھی۔ شریعت شعبے ⁦(فتویٰ 21866، 3 ستمبر 2007)⁩ کے مطابق اسے صرف علماء اور مستبصر طلبہ پڑھیں تاکہ اس کی عقیدتی غلطیاں ظاہر ہوں۔"
  es: "Un usuario solicitó comentarios sobre el libro «El límite del Islam». El departamento de la sharia del sitio (fatwa n.° 21866, 3 de septiembre de 2007) respondió que no recomiendan su lectura, salvo a eruditos y estudiantes perspicaces, para desenmascarar los errores doctrinales que contiene y que podrían inducir a error. Esta respuesta fue registrada por AMJA."
  fr: "Un internaute a demandé des commentaires sur le livre « Les limites de l'islam ». Le département de la charia du site (fatwa n° 21866, 3 septembre 2007) a répondu qu'il ne recommandait sa lecture qu'aux érudits et aux étudiants les plus clairvoyants, afin de mettre en évidence les erreurs doctrinales qu'il contient et qui pourraient induire les gens en erreur. Cette réponse est celle de l'AMJA."
  tr: "Bir soru soran kişi 'Hud al-Islam' kitabı hakkında yorum istedi. Web sitesindeki Şeriat bölümü (3 Eylül 2007 tarihli Fetva No. 21866), bu kitabın okunmasının ancak alimler ve doktrinsel hataları açıklığa kavuşturmak için bilgi arayanların okunmasının önerilmediğini belirtti."
  id: "Seorang penanya meminta komentar tentang buku 'Hud al-Islam.' Bagian Syariah di situs web (Fatwa No. 21866 tanggal 3 September 2007) menanggapi bahwa tidak disarankan membaca buku ini kecuali untuk para ulama dan mereka yang mencari pengetahuan untuk memperjelas kesalahan doktrinal karena buku ini dapat menimbulkan kebingungan di antara masyarakat."
