label: { ar: "حماسة أبي تمام", en: "Hamasa of Abu Tammam", es: "Hamasa de Abu Tammam", fr: "Hamasa d'Abu Tammam", ur: "ابو تمام کی حماسہ" }
summary:
  ar: "حماسة أبي تمام حبيب بن أوس الطائي، مختارات شعرية بوبها على أبواب تقيد نافرها وتضم نادرها؛ انفرد في هذه الصناعة بأوفر حظ وأنفس بضاعة حتى اقتدى به من جاء بعده، فكان يوسف البياسي ممن حفظها واتبع تبويبها في حماسته التي فرغ منها بتونس سنة ٦٤٦هـ لأنه لم يجد أقرب تبويب ولا أحسن ترتيب مما رتبته، وكانت مع الأشعار الستة ودواوين أبي تمام والمتنبي والمعري مما يحفظه الحفاظ المتقنون {cite:wafayat-ayan p. 238-239}."
  en: "Abu Tammam's Hamasa — the verse anthology whose arrangement of chapters became the industry standard: al-Bayyasi memorised it and followed its ordering in his own Hamasa (646 AH), saying he found no nearer or better disposition; it stood with the Six Diwans among what the master memorisers carried {cite:wafayat-ayan p. 238-239}."
  es: "La Hamasa de Abu Tammam — la antología en verso cuya disposición de capítulos se convirtió en el estándar de la industria: al-Bayyasi la memorizó y siguió su orden en su propia Hamasa (646 AH), diciendo que no encontró una disposición más cercana o mejor; figuraba junto con los Seis Diwans entre lo que llevaban los maestros memorizadores {cite:wafayat-ayan p. 238-239}."
  fr: "Le Hamasa d'Abu Tammam — l'anthologie de vers dont l'arrangement des chapitres est devenu la norme dans l'industrie: al-Bayyasi l'a mémorisé et a suivi son ordre dans son propre Hamasa (646 AH), disant qu'il n'avait trouvé aucune disposition plus proche ou meilleure; il figurait avec les Six Diwans parmi ce que les maîtres mémorisateurs portaient {cite: wafayat-ayan p. 238-239}."
  ur: "ابو تمام کی حماسہ - آیت انتھولوجی جس کے ابواب کی ترتیب صنعت کا معیار بن گئی: البیاسی نے اسے حفظ کیا اور اپنی حماسہ ⁦(646 ہجری)⁩ میں اس کی ترتیب پر عمل کیا، یہ کہتے ہوئے کہ اس سے زیادہ قریب یا بہتر مزاج کوئی نہیں ملا۔ یہ چھ دیوانوں کے ساتھ کھڑا تھا جو ماسٹر حفظ کرنے والوں نے لیا تھا۔ 238-239}۔"
