summary:
  ar: "حماسة أبي تمام حبيب بن أوس الطائي، مختارات شعرية بوبها على أبواب تقيد نافرها وتضم نادرها؛ انفرد في هذه الصناعة بأوفر حظ وأنفس بضاعة حتى اقتدى به من جاء بعده، فكان يوسف البياسي ممن حفظها واتبع تبويبها في حماسته التي فرغ منها بتونس سنة ٦٤٦هـ لأنه لم يجد أقرب تبويب ولا أحسن ترتيب مما رتبته، وكانت مع الأشعار الستة ودواوين أبي تمام والمتنبي والمعري مما يحفظه الحفاظ المتقنون {cite:wafayat-ayan p. 238-239}."
  en: "Abu Tammam's Hamasa — the verse anthology whose arrangement of chapters became the industry standard: al-Bayyasi memorised it and followed its ordering in his own Hamasa (646 AH), saying he found no nearer or better disposition; it stood with the Six Diwans among what the master memorisers carried {cite:wafayat-ayan p. 238-239}."
