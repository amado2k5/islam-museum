summary:
  ar: "كتاب للدكتور عبد الرحمن رأفت الباشا في سبعة «كتب»، يرسم في كل فصل صورة قصصية لصحابي أو صحابية، كثيراً ما يرويها على لسان صاحبها، ويشرح في الحواشي الألفاظ الغريبة، ويختم كل صورة بقائمة «للاستزادة» من كتب التراجم والحديث."
  en: "Dr Abd al-Rahman Ra'fat al-Basha's book in seven 'books', each chapter a narrative portrait of a Companion, often told in the subject's own voice, with glosses on difficult words in the notes and a 'for further reading' list of biographical and hadith works at the end of each portrait."
