label: { ar: "صور من حياة الصحابة", en: "Suwar min Hayat al-Sahaba (Portraits from the Lives of the Companions)", ur: "صور من حیاۃ الصحابہ", es: "Suwar min Hayat al-Sahaba (Retratos de las vidas de los Compañeros)", fr: "Suwar min Hayat al-Sahaba (Portraits tirés de la vie des Compagnons)" }
summary:
  ar: "كتاب للدكتور عبد الرحمن رأفت الباشا في سبعة «كتب»، يرسم في كل فصل صورة قصصية لصحابي أو صحابية، كثيراً ما يرويها على لسان صاحبها، ويشرح في الحواشي الألفاظ الغريبة، ويختم كل صورة بقائمة «للاستزادة» من كتب التراجم والحديث."
  en: "Dr Abd al-Rahman Ra'fat al-Basha's book in seven 'books', each chapter a narrative portrait of a Companion, often told in the subject's own voice, with glosses on difficult words in the notes and a 'for further reading' list of biographical and hadith works at the end of each portrait."
  es: "El libro del Dr. Abd al-Rahman Ra'fat al-Basha consta de siete \"libros\", cada capítulo un retrato narrativo de un Compañero, a menudo contado con la propia voz del protagonista, con glosas sobre palabras difíciles en las notas y una lista de lecturas recomendadas de obras biográficas y de hadices al final de cada retrato."
  fr: "Le livre du Dr Abd al-Rahman Ra'fat al-Basha est divisé en sept « livres », chaque chapitre étant un portrait narratif d'un Compagnon, souvent raconté par le sujet lui-même, avec des gloses sur les mots difficiles dans les notes et une liste « pour aller plus loin » d'ouvrages biographiques et de hadiths à la fin de chaque portrait."
  ur: "ڈاکٹر عبدالرحمٰن رفعت البشا کی کتاب سات 'کتابوں' میں، ہر باب ایک صحابی کا بیانیہ پورٹریٹ ہے، جو اکثر موضوع کی اپنی آواز میں بیان کیا جاتا ہے، نوٹوں میں مشکل الفاظ پر گلوز کے ساتھ اور ہر تصویر کے آخر میں سوانح اور حدیثی کاموں کی فہرست 'مزید پڑھنے کے لیے' ہے۔"
