id: work/fatwa-amja-vow-ten-loaves-pregnant
class: work
kind: fatwa
label: { ar: "نذر خبز عشرة أرغفة", en: "A vow of ten loaves of bread", ur: "دس روٹیوں کی نذر", es: "Un voto de diez panes" }
summary:
  ar: "سألت سائلة أن أختها بعد شهرين زواج نذرت إن ظهرت حامل في الشهر المقبل أن تعمل عشرة أرغفة خبز تعطيها لزملاء زوجها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86554 بتاريخ 10 مارس 2012)⁩ أنها إن كانت نذرت أن تتولى ذلك بنفسها فيلزمها الوفاء بما نذرت عند القدرة على ذلك قبل الوضع أو بعده فإن القدرة شرط في التكليف، وأما إن كان نذرها مطلقًا فتستطيع الاستعانة في الوفاء به من تشاء."
  en: "A questioner said her sister, two months into marriage, vowed that if she proved pregnant next month she would make ten loaves of bread for her husband's colleagues. Dr. Salah al-Sawi (fatwa no. 86554, 10 March 2012) answered that if she vowed to do it herself she must fulfil it when able — before or after delivery, ability being a condition of obligation; and if her vow was unqualified she may fulfil it through whomever she wills."
  ur: "ایک خاتون نے پوچھا کہ اس کی بہن نے حمل ثابت ہونے پر دس روٹیاں دینے کی نذر مانی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86554، 10 مارچ 2012)⁩ کے مطابق اگر خود کرنے کی نذر ہے تو قادر ہوتے ہی کرے؛ مطلق ہو تو کسی سے بھی کروا سکتی ہے۔"
  es: "Una persona que preguntó dijo que su hermana, a los dos meses de casada, había prometido que si quedaba embarazada el mes siguiente hornearía diez panes para los compañeros de su marido. El Dr. Salah al-Sawi (fatwa n.º 86554, 10 de marzo de 2012) respondió que si había prometido hacerlo ella misma, debía cumplir su promesa cuando le fuera posible, antes o después del parto, ya que la capacidad era una condición para la obligación; y si su promesa no tenía condiciones, podía cumplirla a través de quien quisiera."
