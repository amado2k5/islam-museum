label: { ar: "حكم بيع كتب تتضمن أخطاء علمية ومخالفات شرعية", en: "Selling books that contain scholarly errors and sharia violations", ur: "علمی غلطیوں اور شرعی مخالفتوں والی کتابوں کی فروخت", es: "Vender libros que contienen errores académicos y violaciones de la sharia.", fr: "La vente de livres contenant des erreurs scientifiques et des violations de la charia" }
summary:
  ar: "سائل سأل عن بيع كتب تتضمن أخطاء علمية ومخالفات شرعية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24334)⁩ أنه يجوز شرعًا بيع الكتب العلمية متى كانت مملوكة لصاحبها واحتوت على ما ينتفع به؛ أما إن احتوت على مخالفات شرعية ومغالطات علمية قطعت اللجان المختصة بها فيحظر تداولها، وبيّن الجواب الضوابط بالتفصيل."
  en: "A questioner asked about selling books containing scholarly errors and sharia violations. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24334) answered that scholarly books may lawfully be sold so long as they are owned by the seller and contain what benefits; but where they contain sharia violations and scholarly errors that the competent committees have determined, their circulation is prohibited — as the answer's detailed controls set out."
  ur: "ایک سائل نے ایسی کتابیں بیچنے کا حکم پوچھا جن میں علمی غلطیاں اور شرعی مخالفتیں ہوں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24334)⁩ نے جواب دیا کہ علمی کتابوں کی فروخت شرعاً جائز ہے بشرطیکہ وہ بیچنے والے کی ملکیت ہوں اور ان میں فائدہ مند مواد ہو؛ لیکن جن میں شرعی مخالفتیں اور علمی مغالطے ہوں جن کا تعین متعلقہ کمیٹیاں کر چکی ہوں ان کا رواج ممنوع ہے — جیسا کہ جواب کے ضوابط تفصیل سے بیان کرتے ہیں۔"
  es: "Un consultante preguntó sobre la venta de libros que contienen errores académicos y violaciones de la sharia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24334) respondió que los libros académicos pueden venderse legalmente siempre que sean propiedad del vendedor y contengan los beneficios esperados; pero cuando contienen violaciones de la sharia y errores académicos que los comités competentes han determinado, su circulación está prohibida, tal como se detalla en las normas de la respuesta."
  fr: "Un internaute a posé une question concernant la vente de livres contenant des erreurs scientifiques et des violations de la charia. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24334) a répondu que les livres scientifiques peuvent être vendus licitement tant qu'ils appartiennent au vendeur et qu'ils contiennent des ouvrages utiles; mais que leur diffusion est interdite lorsqu'ils contiennent des violations de la charia et des erreurs scientifiques reconnues par les comités compétents, conformément aux dispositions détaillées de la réponse."
