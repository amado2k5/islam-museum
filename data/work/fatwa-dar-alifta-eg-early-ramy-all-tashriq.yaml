id: work/fatwa-dar-alifta-eg-early-ramy-all-tashriq
class: work
kind: fatwa
label: { ar: "حكم تقديم رمي الجمار في أول أيام التشريق", en: "Throwing all the tashriq-day jamarat early on their first day", ur: "ایامِ تشریک کی ساری جمرات پہلے دن جلدی مارنا", es: "Lanzando todas las jamarat del día de tashriq temprano en su primer día.", fr: "Ils ont jeté tous les jamarat du jour de tashriq tôt le premier jour." }
summary:
  ar: "سائل سأل عن تقديم رمي جمرات أيام التشريق مجمعة في أول يوم منها لتحتم السفر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21895)⁩ ببيان حكم التقديم وجوازه أو عدمه وما يترتب عليه على ما فصّل الجواب."
  en: "A questioner asked about throwing all the tashriq-day jamarat early on their first day — the eleventh of Dhu'l-Hijja — because departure was unavoidable. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21895) answered by setting out the ruling on advancing them — whether it is allowed and what follows — as the answer details."
  ur: "ایک سائل نے سفر ناگزیر ہونے کی وجہ سے ایامِ تشریک کی ساری جمرات پہلے دن — ذوالحجہ کی گیارہویں — مار دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21895)⁩ نے جواب میں جلدی مارنے کا حکم اور اس کے نتائج بیان کیے۔"
  es: "Un consultante preguntó sobre la conveniencia de adelantar todas las jamarat del día de tashriq el primer día —el undécimo de Dhu'l-Hijja— debido a que la partida era inevitable. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21895) respondió exponiendo la normativa sobre adelantarlas —si está permitido y las consecuencias— tal como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de disperser tous les groupes de pèlerins (jamarat) du premier jour de Dhu al-Hijja dès le début du mois, le 11, en raison d'un départ inévitable. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21895) a répondu en exposant la décision concernant cette pratique: est-elle autorisée et quelles en sont les conséquences ? La réponse est détaillée ci-après."
