id: work/fatwa-dar-alifta-withholding-diagnosis-from-patient
class: work
kind: fatwa
label: { ar: "حكم إخفاء حقيقة المرض عن المريض لمصلحته", en: "Withholding a diagnosis from a patient for his own good", ur: "مریض سے اس کی بھلائی کے لیے بیماری کی حقیقت چھپانے کا حکم", es: "Ocultar un diagnóstico a un paciente por su propio bien.", fr: "Cacher un diagnostic à un patient pour son propre bien", tr: "Hastalığın gerçeğini hastadan gizleme kararı", id: "Putusan tentang menyembunyikan kebenaran penyakit dari pasien demi kebaikan mereka" }
summary:
  ar: "سائل يذكر أن زوج أخته مصاب بالسرطان، وأن الطبيب لم يصارحه بحالته وأخبر السائلَ بها خشية تدهوره. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن الأصل مصارحة المريض، لكن إذا رأى الطبيب بخبرته أن المصارحة تعقبها انتكاسة بدنية أو نفسية مؤثرة جاز له ألا يفصح، ولا يُعد ذلك كتمانًا مذمومًا بل تورية مأذونًا بها بقدر الحاجة، على أن يقتصر الكتمان على المريض ويُبلَّغ من يلزم من ذويه حفظًا لحقوقه، ما لم يترتب على ذلك ضرر بالغير."
  en: "A questioner says his sister's husband has cancer and that the doctor did not tell him his condition but told the questioner instead, fearing a rapid decline. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that the rule is to tell the patient, but where the doctor judges from experience that disclosure would bring a serious physical or psychological decline, he may withhold it; this is not blameworthy concealment but permitted indirection to the extent needed, provided only the patient is kept uninformed, the relatives who need to know are told so that his rights are protected, and no harm to others results."
  ur: "ایک سائل بتاتا ہے کہ اس کے بہنوئی کو کینسر ہے، اور ڈاکٹر نے تیزی سے بگڑنے کے خوف سے مریض کو نہیں بتایا بلکہ سائل کو بتایا۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ اصل یہ ہے کہ مریض کو بتایا جائے، لیکن اگر ڈاکٹر اپنے تجربے سے سمجھے کہ بتانے سے سنگین جسمانی یا نفسیاتی بگاڑ ہوگا تو وہ نہ بتائے؛ یہ قابلِ مذمت چھپانا نہیں بلکہ ضرورت کے بقدر جائز توریہ ہے، بشرطیکہ چھپانا صرف مریض سے ہو، ضروری رشتہ داروں کو بتایا جائے تاکہ اس کے حقوق محفوظ رہیں، اور دوسروں کو نقصان نہ پہنچے۔"
  es: "Un consultante afirma que el esposo de su hermana padece cáncer y que el médico no le informó de su enfermedad, sino que se la comunicó a él por temor a un rápido deterioro. El Dar al-Ifta de Egipto, en una fatwa emitida bajo el Gran Muftí Nazir Ayyad, respondió que la norma es informar al paciente, pero que si el médico considera, por experiencia, que la revelación podría provocar un grave deterioro físico o psicológico, puede omitirla; esto no constituye ocultamiento censurable, sino una comunicación indirecta permitida en la medida necesaria, siempre que solo el paciente permanezca desinformado, se informe a los familiares que deban saberlo para proteger sus derechos y no se cause daño a terceros."
  fr: "Un homme affirme que le mari de sa sœur est atteint d'un cancer et que le médecin, craignant une aggravation rapide de son état, ne l'a pas informé de sa maladie, mais l'a révélée à l'homme qui posait la question. La Cour suprême égyptienne Dar al-Ifta, dans une fatwa émise sous l'égide du grand mufti Nazir Ayyad, a répondu que la règle est d'informer le patient, mais que si le médecin estime, par expérience, que cette divulgation entraînerait une grave détérioration physique ou psychologique, il peut s'abstenir. Il ne s'agit pas d'une dissimulation blâmable, mais d'une communication indirecte permise dans la mesure nécessaire, à condition que seul le patient reste dans l'ignorance, que les proches qui doivent être informés le soient afin de protéger ses droits, et qu'aucun préjudice ne soit causé à autrui."
  tr: "Bir soru soran kişi, kız kardeşinin eşinin kanser olduğunu ve doktorun durumunu kendisine bildirmediğini, ancak kötüleşmesinden korktuğu için bildirdiğini belirtiyor. Mısır Dar al-Ifta, Müftü Nazir Ayad'ın verdiği bir fetvada yanıt vererek, hastaya karşı dürüst olmanın varsayılan olduğunu, ancak doktorun dürüstlüğün ardından önemli fiziksel veya psikolojik bir gerileme getirdiğine uzmanca inanması halinde bunu açıklamayacağını belirtti. Bu, suçlu bir gizleme olarak kabul edilmez, ancak gerektiğinde yetkilendirilen bir kelime oyunudur; ancak gizlilik hastayla sınırlı ve haklarını korumak için akrabalarına bildirilmelidir, başkalarına zarar vermedikçe."
  id: "Seorang penanya menyebutkan bahwa suami saudara perempuannya menderita kanker, dan dokter tidak memberitahunya tentang kondisinya tetapi memberitahunya karena takut memburuknya. Dar al-Ifta Mesir menanggapi fatwa yang dikeluarkan oleh Mufti Nazir Ayad, menyatakan bahwa defaultnya adalah bersikap jujur kepada pasien, tetapi jika dokter percaya dengan keahlian bahwa kejujuran diikuti oleh kemunduran fisik atau psikologis yang signifikan, ia tidak boleh mengungkapkannya. Hal ini tidak dianggap sebagai penyembunyian yang patut disalahkan, melainkan permainan kata yang diizinkan sesuai kebutuhan, asalkan kerahasiaan dibatasi hanya untuk pasien dan dilaporkan kepada kerabatnya untuk menjaga haknya, kecuali jika menimbulkan kerugian bagi orang lain."
