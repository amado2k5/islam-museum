id: work/fatwa-dar-alifta-withholding-diagnosis-from-patient
class: work
kind: fatwa
label: { ar: "حكم إخفاء حقيقة المرض عن المريض لمصلحته", en: "Withholding a diagnosis from a patient for his own good", ur: "مریض سے اس کی بھلائی کے لیے بیماری کی حقیقت چھپانے کا حکم" }
summary:
  ar: "سائل يذكر أن زوج أخته مصاب بالسرطان، وأن الطبيب لم يصارحه بحالته وأخبر السائلَ بها خشية تدهوره. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن الأصل مصارحة المريض، لكن إذا رأى الطبيب بخبرته أن المصارحة تعقبها انتكاسة بدنية أو نفسية مؤثرة جاز له ألا يفصح، ولا يُعد ذلك كتمانًا مذمومًا بل تورية مأذونًا بها بقدر الحاجة، على أن يقتصر الكتمان على المريض ويُبلَّغ من يلزم من ذويه حفظًا لحقوقه، ما لم يترتب على ذلك ضرر بالغير."
  en: "A questioner says his sister's husband has cancer and that the doctor did not tell him his condition but told the questioner instead, fearing a rapid decline. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that the rule is to tell the patient, but where the doctor judges from experience that disclosure would bring a serious physical or psychological decline, he may withhold it; this is not blameworthy concealment but permitted indirection to the extent needed, provided only the patient is kept uninformed, the relatives who need to know are told so that his rights are protected, and no harm to others results."
  ur: "ایک سائل بتاتا ہے کہ اس کے بہنوئی کو کینسر ہے، اور ڈاکٹر نے تیزی سے بگڑنے کے خوف سے مریض کو نہیں بتایا بلکہ سائل کو بتایا۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ اصل یہ ہے کہ مریض کو بتایا جائے، لیکن اگر ڈاکٹر اپنے تجربے سے سمجھے کہ بتانے سے سنگین جسمانی یا نفسیاتی بگاڑ ہوگا تو وہ نہ بتائے؛ یہ قابلِ مذمت چھپانا نہیں بلکہ ضرورت کے بقدر جائز توریہ ہے، بشرطیکہ چھپانا صرف مریض سے ہو، ضروری رشتہ داروں کو بتایا جائے تاکہ اس کے حقوق محفوظ رہیں، اور دوسروں کو نقصان نہ پہنچے۔"
