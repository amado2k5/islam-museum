id: work/fatwa-amja-rapprochement-taqrib
class: work
kind: fatwa
label: { ar: "دعوى التقريب بين السنة والشيعة", en: "The call to Sunni–Shia rapprochement — its political and creed senses", ur: "سنی شیعہ تقریب — سیاسی اور عقیدتی معنی" }
summary:
  ar: "سأل سائل عن مبرر من ينادون بالتقريب بعد اطلاعه على مؤلفات شيعية فيها مفاهيم خطيرة وما ألفه علماء السنة في هذا النحو. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21855 بتاريخ 28 مايو 2007)⁩ أن الدعوة إلى التقريب تعبير مجمل: فإن قصد بها التقريب في الإطار السياسي وفي إطار المصالح المشتركة للفريقين فهي دعوة مقبولة بل لا بد منها حقنًا للدماء وتأمينًا للسابلة وتمكينًا للناس من أن يتقلبوا في أسفارهم وأوطانهم آمنين وهي أساس استباب الأمن وعمارة البلدان وهو إطار قابل بطبيعته للمداراة والتسامح بل والتنازل عن بعض الحقوق إن لزم، وأما التقريب في إطار العقيدة فغير ممكن لأن الفروق بين المذهبين جوهرية لا تقبل التلفيق على ما فصّل."
  en: "A questioner — having read Shiite books with grave notions and the Sunni scholars' answers — asked what the callers to rapprochement base themselves on. Dr. Salah al-Sawi (fatwa no. 21855, 28 May 2007) answered that the call to taqrib is an ambiguous term: if it means rapprochement in the political frame and in the two sides' common interests, it is an acceptable call — indeed necessary to spare blood, secure the roads, and let people travel and dwell in their lands safely; it is the basis of settled security and flourishing lands, and by nature admits tact, tolerance and even the yielding of some claims if needed. But rapprochement in the creed-frame is impossible, the differences between the two doctrines being essential and not admitting fusion — as the answer details. Recorded as AMJA's answer."
  ur: "ایک سائل نے سنی شیعہ تقریب کی دعوت کا جواز پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21855، 28 مئی 2007)⁩ کے مطابق سیاسی و مصالح مشترکہ کے دائرے میں تقریب مقبول بلکہ ضروری ہے؛ عقیدے کے دائرے میں ممکن نہیں۔"
