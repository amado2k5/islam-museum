id: work/fatwa-amja-rapprochement-taqrib
class: work
kind: fatwa
label: { ar: "دعوى التقريب بين السنة والشيعة", en: "The call to Sunni–Shia rapprochement — its political and creed senses", ur: "سنی شیعہ تقریب — سیاسی اور عقیدتی معنی", es: "El llamamiento al acercamiento suní-chií: sus implicaciones políticas y religiosas.", fr: "L’appel au rapprochement sunnite-chiite — ses dimensions politiques et religieuses" }
summary:
  ar: "سأل سائل عن مبرر من ينادون بالتقريب بعد اطلاعه على مؤلفات شيعية فيها مفاهيم خطيرة وما ألفه علماء السنة في هذا النحو. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21855 بتاريخ 28 مايو 2007)⁩ أن الدعوة إلى التقريب تعبير مجمل: فإن قصد بها التقريب في الإطار السياسي وفي إطار المصالح المشتركة للفريقين فهي دعوة مقبولة بل لا بد منها حقنًا للدماء وتأمينًا للسابلة وتمكينًا للناس من أن يتقلبوا في أسفارهم وأوطانهم آمنين وهي أساس استباب الأمن وعمارة البلدان وهو إطار قابل بطبيعته للمداراة والتسامح بل والتنازل عن بعض الحقوق إن لزم، وأما التقريب في إطار العقيدة فغير ممكن لأن الفروق بين المذهبين جوهرية لا تقبل التلفيق على ما فصّل."
  en: "A questioner — having read Shiite books with grave notions and the Sunni scholars' answers — asked what the callers to rapprochement base themselves on. Dr. Salah al-Sawi (fatwa no. 21855, 28 May 2007) answered that the call to taqrib is an ambiguous term: if it means rapprochement in the political frame and in the two sides' common interests, it is an acceptable call — indeed necessary to spare blood, secure the roads, and let people travel and dwell in their lands safely; it is the basis of settled security and flourishing lands, and by nature admits tact, tolerance and even the yielding of some claims if needed. But rapprochement in the creed-frame is impossible, the differences between the two doctrines being essential and not admitting fusion — as the answer details. Recorded as AMJA's answer."
  ur: "ایک سائل نے سنی شیعہ تقریب کی دعوت کا جواز پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21855، 28 مئی 2007)⁩ کے مطابق سیاسی و مصالح مشترکہ کے دائرے میں تقریب مقبول بلکہ ضروری ہے؛ عقیدے کے دائرے میں ممکن نہیں۔"
  es: "Un consultante, tras leer libros chiítas con ideas profundas y las respuestas de los eruditos sunitas, preguntó en qué se basaban los defensores del acercamiento. El Dr. Salah al-Sawi (fatwa n.º 21855, 28 de mayo de 2007) respondió que el llamado al taqrib es un término ambiguo: si se refiere al acercamiento en el ámbito político y en función de los intereses comunes de ambas partes, es un llamado aceptable, incluso necesario para evitar derramamiento de sangre, garantizar la seguridad de las carreteras y permitir que la gente viaje y habite en sus tierras con seguridad; es la base de una seguridad estable y tierras prósperas, y por su naturaleza admite tacto, tolerancia e incluso la cesión de algunas reivindicaciones si fuera necesario. Pero el acercamiento en el ámbito religioso es imposible, ya que las diferencias entre ambas doctrinas son esenciales y no admiten fusión, como se detalla en la respuesta. Registrado como respuesta de AMJA."
  fr: "Un lecteur, ayant pris connaissance d'ouvrages chiites aux conceptions profondes et des réponses des érudits sunnites, a demandé sur quoi se fondaient les partisans du rapprochement. Le Dr Salah al-Sawi (fatwa n° 21855, 28 mai 2007) a répondu que l'appel au taqrib est un terme ambigu: s'il signifie un rapprochement dans le cadre politique et dans l'intérêt commun des deux parties, c'est un appel acceptable, voire nécessaire pour épargner des effusions de sang, sécuriser les routes et permettre aux populations de circuler et de vivre en toute sécurité sur leurs terres; il est le fondement d'une sécurité durable et de terres prospères, et admet par nature le tact, la tolérance et même la concession de certaines revendications si besoin est. Mais un rapprochement sur le plan doctrinal est impossible, les différences entre les deux doctrines étant essentielles et incompatibles avec toute fusion, comme le précise la réponse. Réponse enregistrée par l'AMJA."
