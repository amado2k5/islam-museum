id: work/fatwa-dar-alifta-eg-passing-miqat-by-plane
class: work
kind: fatwa
label: { ar: "حكم تجاوز الميقات بدون إحرام للقادم عبر الطائرة", en: "Passing the miqat without ihram for the air traveller", ur: "ہوائی سفر کرنے والے کے لیے میقات بغیر احرام عبور کرنے کا حکم", es: "El viajero aéreo puede cruzar el miqat sin ihram.", fr: "Passage du miqat sans ihram pour le voyageur aérien", tr: "Uçakla gelen biri için Miqat'ın İhrama girmeden atlanması kararı", id: "Aturan tentang melewatkan Miqat tanpa memasuki Ihram bagi seseorang yang datang dengan pesawat" }
summary:
  ar: "سائل سأل عن ميقات من يقصد المدينة المنورة من مصر عبر الطائرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23958)⁩ أن ميقات الإحرام لمن يتوجه من مصر إلى زيارة النبي في المدينة المنورة مباشرة هو ميقات أهل المدينة، وأنه يحرم قبل محاذاته كما فصّل الجواب في حال المسافر جوًّا."
  en: "A questioner asked the miqat for one travelling from Egypt to Medina by air. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23958) answered that the ihram point for one heading from Egypt directly to visit the Prophet's grave in Medina is the miqat of the people of Medina, and that the air traveller must assume ihram before passing opposite it, as the answer details."
  ur: "ایک سائل نے مصر سے ہوائی جہاز سے مدینہ منورہ جانے والے کے میقات کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23958)⁩ نے جواب دیا کہ مصر سے سیدھے مدینہ میں نبی کی زیارت کے لیے جانے والے کا احرام کا میقات اہلِ مدینہ کا میقات ہے، اور ہوائی مسافر کو اس کے مقابل آنے سے پہلے احرام باندھنا ہوگا، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un viajero preguntó cuál era el miqat para quien viajaba de Egipto a Medina en avión. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 23958) respondió que el punto de ihram para quien se dirige directamente desde Egipto a visitar la tumba del Profeta en Medina es el miqat de la gente de Medina, y que el viajero aéreo debe ponerse en estado de ihram antes de pasar frente a él, como se detalla en la respuesta."
  fr: "Une personne a posé la question du miqat pour un voyageur se rendant d'Égypte à Médine par avion. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23958) a répondu que le point d'ihram pour une personne se rendant directement d'Égypte au tombeau du Prophète à Médine est le miqat des habitants de Médine, et que le voyageur aérien doit revêtir l'ihram avant de passer en face de ce point, comme le précise la réponse."
  tr: "Bir soru soran kişi, Mısır'dan uçakla Medine'ye seyahat edenlere mikat hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 23958), Mısır'dan Peygamber'i doğrudan Medine'ye ziyaret etmek için giden birinin mikatının Medine halkı için mikat olduğunu ve bir hava yolcusu durumunda ayrıntılı olarak belirtildiği gibi, ihramın birleşmeden önce girdiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang miqat bagi mereka yang bepergian ke Madinah dari Mesir dengan pesawat. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 23958) menjawab bahwa miqat bagi seseorang yang pergi dari Mesir untuk mengunjungi Nabi langsung di Madinah adalah miqat bagi rakyat Madinah, dan bahwa ia memasuki ihram sebelum pertemuan tersebut, seperti yang dijelaskan dalam kasus seorang pelayar udara."
