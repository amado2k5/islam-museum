id: work/fatwa-dar-alifta-eg-passing-miqat-by-plane
class: work
kind: fatwa
label: { ar: "حكم تجاوز الميقات بدون إحرام للقادم عبر الطائرة", en: "Passing the miqat without ihram for the air traveller", ur: "ہوائی سفر کرنے والے کے لیے میقات بغیر احرام عبور کرنے کا حکم" }
summary:
  ar: "سائل سأل عن ميقات من يقصد المدينة المنورة من مصر عبر الطائرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23958)⁩ أن ميقات الإحرام لمن يتوجه من مصر إلى زيارة النبي في المدينة المنورة مباشرة هو ميقات أهل المدينة، وأنه يحرم قبل محاذاته كما فصّل الجواب في حال المسافر جوًّا."
  en: "A questioner asked the miqat for one travelling from Egypt to Medina by air. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23958) answered that the ihram point for one heading from Egypt directly to visit the Prophet's grave in Medina is the miqat of the people of Medina, and that the air traveller must assume ihram before passing opposite it, as the answer details."
  ur: "ایک سائل نے مصر سے ہوائی جہاز سے مدینہ منورہ جانے والے کے میقات کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23958)⁩ نے جواب دیا کہ مصر سے سیدھے مدینہ میں نبی کی زیارت کے لیے جانے والے کا احرام کا میقات اہلِ مدینہ کا میقات ہے، اور ہوائی مسافر کو اس کے مقابل آنے سے پہلے احرام باندھنا ہوگا، جیسا کہ جواب میں تفصیل ہے۔"
