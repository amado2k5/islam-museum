  es: "Una colección de estudios franceses de Mohammed Arkoun que aplican las ciencias humanas a la crítica del pensamiento islámico, publicada por Maisonneuve et Larose, París, en 1984 (378 páginas); su traducción al árabe apareció en Dar al-Saqi, Londres, en 2001."
