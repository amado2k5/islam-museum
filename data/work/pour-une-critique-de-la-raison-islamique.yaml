summary:
  ar: "مجموعة دراسات بالفرنسية لمحمد أركون في نقد الفكر الإسلامي بأدوات العلوم الإنسانية، صدرت عن دار ميزونوف ولاروز بباريس سنة 1984 في 378 صفحة، وصدرت ترجمتها العربية عن دار الساقي بلندن سنة 2001."
  en: "A collection of French studies by Mohammed Arkoun applying the human sciences to the critique of Islamic thought, published by Maisonneuve et Larose, Paris, in 1984 (378 pages); its Arabic translation appeared from Dar al-Saqi, London, in 2001."
  ur: "محمد ارکون کے فرانسیسی مطالعات کا مجموعہ جو انسانی علوم کے ذریعے اسلامی فکر کی تنقید کرتا ہے؛ میزونو اے لاروز، پیرس سے 1984ء میں 378 صفحات میں شائع ہوا اور اس کا عربی ترجمہ دار الساقی، لندن سے 2001ء میں آیا۔"
  es: "Una colección de estudios franceses de Mohammed Arkoun que aplican las ciencias humanas a la crítica del pensamiento islámico, publicada por Maisonneuve et Larose, París, en 1984 (378 páginas); su traducción al árabe apareció en Dar al-Saqi, Londres, en 2001."
  fr: "Un recueil d'études françaises de Mohammed Arkoun appliquant les sciences humaines à la critique de la pensée islamique, publié par Maisonneuve et Larose, Paris, en 1984 (378 pages); sa traduction arabe est parue chez Dar al-Saqi, Londres, en 2001."
  tr: "Muhammed Arkoun'un beşeri bilimlerin araçlarıyla İslami düşüncenin eleştirisi üzerine Fransızca çalışmalardan oluşan bir derleme, 1984'te Paris'te Maisonoff ve La Rose tarafından 378 sayfa olarak yayımlandı ve Arapçaya çevirisi 2001'de Londra'da Al-Saqi tarafından yayımlandı."
  id: "Kumpulan studi dalam bahasa Prancis oleh Muhammad Arkoun tentang kritik pemikiran Islam menggunakan alat humaniora, diterbitkan oleh Maisonoff dan La Rose di Paris pada tahun 1984 dalam 378 halaman, dan terjemahan Arabnya diterbitkan oleh Al-Saqi di London pada tahun 2001."
