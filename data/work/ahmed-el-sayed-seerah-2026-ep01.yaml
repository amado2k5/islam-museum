label:
  ar: "سيرة رسول الله 2026، الحلقة 1: سيرة رسول الله 01 | فاتحة السيرة وبيان أهميتها ومقاصدها"
  en: "The Biography of the Messenger of God 2026, episode 1: Opening of the Sira, Its Importance and Its Aims"
  ur: "سیرتِ رسول اللہ 2026، قسط 1: سیرت کا آغاز، اس کی اہمیت اور مقاصد"
  fr: "La biographie du Messager de Dieu 2026, épisode 1 : Ouverture de la sira, son importance et ses buts"
  es: "La biografía del Mensajero de Dios 2026, episodio 1: Apertura de la sira, su importancia y sus objetivos"
summary:
  ar: "محاضرة افتتاحية في سلسلة مطولة عن السيرة النبوية تسير على سيرة ابن هشام. يشرح فيها سبب اختياره لهذا الكتاب ومزاياه وجهود شراحه، وأي كتب السيرة ينبغي الجمع بينها، ولماذا تهم السيرة، وخمسة مقاصد لدراستها."
  en: "Opening lecture of a long series on the Prophet's biography that follows Sirat Ibn Hisham. He explains why he chose that book, its strengths and the work of its commentators, which sira books to combine, why the sira matters, and five aims for studying it."
  ur: "سیرتِ نبوی پر ایک طویل سلسلے کا افتتاحی لیکچر جو سیرت ابن ہشام کی پیروی کرتا ہے۔ وہ بتاتے ہیں کہ انہوں نے یہ کتاب کیوں چنی، اس کی خوبیاں اور اس کے شارحین کا کام کیا ہے، سیرت کی کون سی کتابیں ملا کر پڑھنی چاہئیں، سیرت کیوں اہم ہے، اور اس کے مطالعے کے پانچ مقاصد کیا ہیں۔"
  fr: "Conférence d'ouverture d'une longue série sur la biographie du Prophète qui suit la Sira d'Ibn Hisham. Il explique pourquoi il a choisi ce livre, ses points forts et le travail de ses commentateurs, quels livres de sira il faut combiner, pourquoi la sira est importante, et cinq buts de son étude."
  es: "Conferencia inaugural de una larga serie sobre la biografía del Profeta que sigue la Sira de Ibn Hisham. Explica por qué eligió ese libro, sus puntos fuertes y la obra de sus comentaristas, qué libros de sira conviene combinar, por qué importa la sira y cinco objetivos para estudiarla."
