label:
  ar: "سيرة رسول الله 2026، الحلقة 11: التربية الأمنيّة في السيرة النبوية"
  en: "The Biography of the Messenger of God 2026, episode 11: Security awareness in the Prophet's biography"
  ur: "سیرتِ رسول اللہ 2026، قسط 11: سیرت نبوی میں سلامتی کی تربیت"
  fr: "La biographie du Messager de Dieu 2026, épisode 11 : L'éducation à la sécurité dans la biographie du Prophète"
  es: "La biografía del Mensajero de Dios 2026, episodio 11: La educación en seguridad en la biografía del Profeta"
summary:
  ar: "يختم المحاضر موضوع السابقين إلى الإسلام بمنظومة تعين على حفظ أسمائهم، ثم يبيّن سبب اختلاف الصحابة في ذكر ترتيبهم ⁦(رابعًا، ثالثًا، وغير ذلك)⁩ بسرّية السنوات الأولى. ويبني على ذلك فكرة الحسّ الأمني في سيرة النبي، ويروي قصص إسلام ابن مسعود وعمرو بن عبسة وأبي ذر، ويعرض كتابًا متأخرًا في السيرة، ثم يفتتح الموضوع التالي وهو الدعوة الجهرية."
  en: "The lecturer closes the topic of the earliest Muslims with a versified aid to memorising their names, then explains why Companions give conflicting ordinal places (fourth, third, and so on) by pointing to the secrecy of the first years. He builds on this a theme of security awareness in the Prophet's biography, retells the conversion stories of Ibn Mas'ud, Amr ibn Abasa and Abu Dharr, presents a later digest of the sira, and opens the next topic, the public call."
  ur: "مقرر ابتدائی مسلمانوں کے موضوع کو ان کے نام یاد رکھنے میں مدد دینے والی ایک منظوم تحریر کے ساتھ ختم کرتا ہے، پھر بتاتا ہے کہ صحابہ اسلام میں اپنے درجے کے بارے میں چوتھے، تیسرے وغیرہ کے متضاد بیانات کیوں دیتے ہیں، اور اس کی وجہ ابتدائی برسوں کی رازداری بتاتا ہے۔ اس بنیاد پر وہ نبی کی سیرت میں سلامتی کے شعور کا موضوع اٹھاتا ہے، ابن مسعود، عمرو بن عبسہ اور ابوذر کے قبول اسلام کے قصے سناتا ہے، سیرت کا ایک بعد کا خلاصہ پیش کرتا ہے اور اگلے موضوع یعنی اعلانیہ دعوت کا آغاز کرتا ہے۔"
  fr: "Le conférencier clôt le thème des premiers musulmans par un poème versifié qui aide à mémoriser leurs noms, puis explique pourquoi les Compagnons donnent des rangs contradictoires (quatrième, troisième, etc.) en invoquant le secret des premières années. Il en tire le thème de la vigilance en matière de sécurité dans la biographie du Prophète, raconte les conversions d'Ibn Mas'ud, d'Amr ibn Abasa et d'Abu Dharr, présente un abrégé tardif de la sira et ouvre le sujet suivant, l'appel public."
  es: "El conferenciante cierra el tema de los primeros musulmanes con un poema versificado que ayuda a memorizar sus nombres y explica por qué los Compañeros dan puestos contradictorios (cuarto, tercero, etc.), señalando el secreto de los primeros años. Sobre esto construye el tema de la conciencia de seguridad en la biografía del Profeta, relata las conversiones de Ibn Mas'ud, Amr ibn Abasa y Abu Dharr, presenta un compendio tardío de la sira y abre el tema siguiente, la llamada pública."
