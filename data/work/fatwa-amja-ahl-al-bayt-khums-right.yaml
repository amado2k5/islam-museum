id: work/fatwa-amja-ahl-al-bayt-khums-right
class: work
kind: fatwa
label: { ar: "حق آل البيت في الخمس والفيء", en: "The Prophet's family's right in the khums and fay'", ur: "اہل بیت کا خمس و فیء میں حق", es: "El derecho de la familia del Profeta en el khums y fay'", fr: "Le droit de la famille du Prophète dans le khums et le fay'", tr: "Ailenin khums ve fiyyah üzerindeki evin hakkı", id: "Hak keluarga atas rumah di khums dan fiyyah" }
summary:
  ar: "سأل سائل عن قول ابن تيمية إن لآل بيت رسول الله من الحقوق ما يجب رعايتها فإن الله جعل لهم حقًا في الخمس والفيء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80682 بتاريخ 22 ديسمبر 2009)⁩ أن الخمس والفيء تعطلا منذ تعطلت وظيفة الجهاد الشرعي وأعلنت العلمانية في كثير من البلاد الإسلامية وتراجعت فيها الشريعة عن المرجعية، وأرجو أن تعود الأمور إلى نصابها ويعود إلى آل بيت النبي حقوقهم في الخمس والفيء وما ذلك على الله بعزيز."
  en: "A questioner raised Ibn Taymiyya's saying that the Prophet's household has rights that must be observed, God having assigned them a share in the khums and fay'. Dr. Salah al-Sawi (fatwa no. 80682, 22 December 2009) answered that khums and fay' have lapsed since lawful jihad lapsed, with secularism declared in many Muslim lands and the sharia's authority receded; he hoped matters return to their right state and the Prophet's household regain their rights therein — and that is not beyond God. Recorded as AMJA's answer."
  ur: "ایک سائل نے ابن تیمیہ کے قول کے بارے میں پوچھا کہ اہل بیت کا خمس و فیء میں حق ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80682، 22 دسمبر 2009)⁩ کے مطابق یہ حقوق اصل شرعی نظام کے تعطل سے معطل ہیں اور ان کی واپسی کی امید ہے۔"
  es: "Un interlocutor mencionó la afirmación de Ibn Taymiyya de que la familia del Profeta tiene derechos que deben respetarse, pues Dios les asignó una parte del khums y el fay'. El Dr. Salah al-Sawi (fatwa n.º 80682, 22 de diciembre de 2009) respondió que el khums y el fay' han caducado desde que la yihad lícita dejó de existir, con la declaración del secularismo en muchos países musulmanes y el retroceso de la autoridad de la sharia; expresó su esperanza de que la situación vuelva a la normalidad y la familia del Profeta recupere sus derechos al respecto, y que esto no está fuera del alcance de Dios. Registrada como respuesta de AMJA."
  fr: "Un interrogateur a évoqué les propos d'Ibn Taymiyya selon lesquels la famille du Prophète possède des droits à respecter, Dieu lui ayant attribué une part du khums et du fay'. Le Dr Salah al-Sawi (fatwa n° 80682, 22 décembre 2009) a répondu que le khums et le fay' sont devenus caducs depuis la fin du jihad légitime, avec la proclamation de la laïcité dans de nombreux pays musulmans et le recul de l'autorité de la charia; il a exprimé l'espoir que les choses reviendront à leur état initial et que la famille du Prophète recouvrera ses droits, ce qui n'est pas hors de portée de Dieu. Cette réponse a été consignée dans la fatwa de l'AMJA."
  tr: "Bir soruya İbn Teymiye'nin, Allah'ın Resulu'nun Ehl-i Beyt'in korunması gereken haklara sahip olduğu, çünkü Allah'ın onlara hum ve fiy hakkı verdiği sözü soruldu. Dr. Salah Al-Sawi (22 Aralık 2009 tarihli 80682 sayılı fetva) şöyle yanıt verdi: Meşru cihadın işlevi sona erdiğinden, birçok İslam ülkesinde laiklik ilan edildi ve Şeriat dini otoritesinden çekildi. Umarım işler kendi haline döner ve Peygamber'in ailesinin hums ve fiyye hakları geri döner. Bu Allah'ın üzerine yüceltilmiştir."
  id: "Seorang penanya ditanya tentang pernyataan Ibn Taymiyyah bahwa Ahl al-Bayt Rasulullah memiliki hak yang harus dilindungi, karena Allah memberikan hak atas khums dan fiyy. Dr. Salah Al-Sawi menjawab (Fatwa No. 80682 tanggal 22 Desember 2009) bahwa khum dan fiya telah ditangguhkan sejak fungsi jihad sah berakhir, sekularisme diumumkan di banyak negara Islam, dan Syariah mundur dari otoritas agamanya. Saya berharap segala sesuatu kembali ke arah yang benar dan hak-hak keluarga Nabi dalam khums dan fiyya akan kembali. Hal ini dimuliakan kepada Allah."
