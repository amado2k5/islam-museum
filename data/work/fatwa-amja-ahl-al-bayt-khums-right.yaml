id: work/fatwa-amja-ahl-al-bayt-khums-right
class: work
kind: fatwa
label: { ar: "حق آل البيت في الخمس والفيء", en: "The Prophet's family's right in the khums and fay'", ur: "اہل بیت کا خمس و فیء میں حق" }
summary:
  ar: "سأل سائل عن قول ابن تيمية إن لآل بيت رسول الله من الحقوق ما يجب رعايتها فإن الله جعل لهم حقًا في الخمس والفيء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80682 بتاريخ 22 ديسمبر 2009)⁩ أن الخمس والفيء تعطلا منذ تعطلت وظيفة الجهاد الشرعي وأعلنت العلمانية في كثير من البلاد الإسلامية وتراجعت فيها الشريعة عن المرجعية، وأرجو أن تعود الأمور إلى نصابها ويعود إلى آل بيت النبي حقوقهم في الخمس والفيء وما ذلك على الله بعزيز."
  en: "A questioner raised Ibn Taymiyya's saying that the Prophet's household has rights that must be observed, God having assigned them a share in the khums and fay'. Dr. Salah al-Sawi (fatwa no. 80682, 22 December 2009) answered that khums and fay' have lapsed since lawful jihad lapsed, with secularism declared in many Muslim lands and the sharia's authority receded; he hoped matters return to their right state and the Prophet's household regain their rights therein — and that is not beyond God. Recorded as AMJA's answer."
  ur: "ایک سائل نے ابن تیمیہ کے قول کے بارے میں پوچھا کہ اہل بیت کا خمس و فیء میں حق ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80682، 22 دسمبر 2009)⁩ کے مطابق یہ حقوق اصل شرعی نظام کے تعطل سے معطل ہیں اور ان کی واپسی کی امید ہے۔"
