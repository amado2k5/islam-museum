label: { ar: "تحرير المجسطي", en: "The Revision of the Almagest", es: "La revisión del Almagesto", fr: "La révision de l'Almageste", ur: "الماجسٹ کی نظر ثانی" }
summary:
  ar: "تحرير نصير الدين الطوسي لكتاب «المجسطي» لبطليموس، وهو في ثلاث عشرة مقالة مقسمة إلى فصول، وفيه أشكال وجداول {cite:tahrir-majisti-bl-add-23392 p.1}. ومخطوطة المكتبة البريطانية المرقمنة تذكر في خاتمتها أن أشكالها أُتمت في قزوين في جمادى الآخرة سنة 956هـ، وهو تاريخ النسخ لا تاريخ التأليف {cite:tahrir-majisti-bl-add-23392 p.3}."
  en: "Nasir al-Din al-Tusi's annotated revision of Ptolemy's Almagest, in thirteen chapters divided into sections, with diagrams and tables {cite:tahrir-majisti-bl-add-23392 p.1}. The colophon of the digitised British Library manuscript dates the completion of its diagrams to Qazvin in Jumada al-Akhira 956 AH; this is the copying date, not the date of composition {cite:tahrir-majisti-bl-add-23392 p.3}."
  es: "Revisión anotada del Almagesto de Ptolomeo realizada por Nasir al-Din al-Tusi, en trece capítulos divididos en secciones, con diagramas y tablas {cite:tahrir-majisti-bl-add-23392 p.1}. El colofón del manuscrito digitalizado de la Biblioteca Británica fecha la finalización de sus diagramas en Qazvin en Jumada al-Akhira 956 AH; esta es la fecha de copia, no la fecha de composición {cite:tahrir-majisti-bl-add-23392 p.3}."
  fr: "La révision annotée de l'Almageste de Ptolémée par Nasir al-Din al-Tusi, en treize chapitres divisés en sections, avec diagrammes et tableaux {cite:tahrir-majisti-bl-add-23392 p.1}. Le colophon du manuscrit numérisé de la British Library date l'achèvement de ses diagrammes à Qazvin en Jumada al-Akhira 956 AH; il s'agit de la date de copie, et non de la date de composition {cite:tahrir-majisti-bl-add-23392 p.3}."
  ur: "ناصرالدین الطوسی کی بطلیموس المجسٹ کی تشریح شدہ نظرثانی، تیرہ ابواب میں، خاکوں اور جدولوں کے ساتھ حصوں میں منقسم ہے۔ ڈیجیٹائزڈ برٹش لائبریری کے مخطوطہ کا کالفون جمعۃ الآخرہ 956 ہجری میں قزوین میں اس کے خاکوں کی تکمیل کی تاریخ ہے۔ یہ کاپی کرنے کی تاریخ ہے، نہ کہ کمپوزیشن کی تاریخ۔"
