summary:
  ar: "تحرير نصير الدين الطوسي لكتاب «المجسطي» لبطليموس، وهو في ثلاث عشرة مقالة مقسمة إلى فصول، وفيه أشكال وجداول {cite:tahrir-majisti-bl-add-23392 p.1}. ومخطوطة المكتبة البريطانية المرقمنة تذكر في خاتمتها أن أشكالها أُتمت في قزوين في جمادى الآخرة سنة 956هـ، وهو تاريخ النسخ لا تاريخ التأليف {cite:tahrir-majisti-bl-add-23392 p.3}."
  en: "Nasir al-Din al-Tusi's annotated revision of Ptolemy's Almagest, in thirteen chapters divided into sections, with diagrams and tables {cite:tahrir-majisti-bl-add-23392 p.1}. The colophon of the digitised British Library manuscript dates the completion of its diagrams to Qazvin in Jumada al-Akhira 956 AH; this is the copying date, not the date of composition {cite:tahrir-majisti-bl-add-23392 p.3}."
