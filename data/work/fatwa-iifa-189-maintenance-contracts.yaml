label: { ar: "قرار مجمع الفقه الإسلامي الدولي 189 (20/4) بشأن استكمال موضوع عقود الصيانة", en: "IIFA resolution 189 (20/4) on completing the subject of maintenance contracts", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 189 (20/4): معاہدہ جاتِ مرمت کے موضوع کی تکمیل", es: "Resolución 189 (20/4) de la IIFA sobre la finalización del tema de los contratos de mantenimiento" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. أكد المجمع ما ورد في قراره 103 ⁦(11/6)⁩ من أن عقد الصيانة يترتب عليه التزام طرف بفحص وإصلاح ما تحتاجه الآلة أو أي شيء آخر من إصلاحات دورية أو طارئة لمدة معلومة في مقابل عوض معلوم، وقد يلتزم فيه الصائن بالعمل وحده أو بالعمل والمواد. وأما صور عقود الصيانة التي كان المجمع أرجأ إصدار حكم فيها في ذلك القرار فرأى تأجيلها لتحرير الصور وتحديد أحكامها ولمزيد من البحث والدراسة في دورة قادمة. وهو في معظمه قرار تأجيل لا قرار حكم جديد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). It reaffirmed its resolution 103 (11/6) that a maintenance contract obliges one party to inspect and repair whatever a machine or anything else needs of periodic or emergency repairs for a known period against a known wage, the maintainer undertaking either labour alone or labour and materials. As for the forms of maintenance contract whose ruling it had postponed in that resolution, it resolved to defer them again — to pin down the forms and specify their rulings — for further research and study at a coming session. Mostly a deferral, not a new ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس نے اپنی قرارداد 103 ⁦(11/6)⁩ کی تائید کی کہ مرمت کا معاہدہ ایک فریق کی ذمہ داری بناتا ہے کہ وہ مشین یا کسی اور چیز کی وقتی یا ہنگامی مرمت کا معائنہ اور اصلاح معلوم مدت اور معلوم معاوضے پر کرے، اور مرمت کرنے والا صرف محنت یا محنت اور مواد دونوں کا ذمہ لے سکتا ہے۔ مرمت کے معاہدوں کی وہ صورتیں جن کا حکم اس نے پہلے مؤجل کیا تھا، انہیں بھی اس نے صورتوں کے تعین اور احکام کے تعیین کے لیے مزید تحقیق و مطالعے تک اگلی مجلس کے لیے مؤجل رکھا۔ زیادہ تر مؤجل کی قرارداد ہے، نیا حکم نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 20.ª sesión en Orán (26 de Shawwal – 2 de Dhu al-Qada de 1433, 13-18 de septiembre de 2012). Reafirmó su resolución 103 (11/6) que establece que un contrato de mantenimiento obliga a una parte a inspeccionar y reparar cualquier máquina u otro bien que requiera reparaciones periódicas o de emergencia durante un período determinado a cambio de un salario fijo, asumiendo el encargado del mantenimiento solo la mano de obra o mano de obra y materiales. En cuanto a las formas de contrato de mantenimiento cuya resolución había aplazado, decidió aplazarlas nuevamente —para definir con precisión las formas y especificar sus resoluciones— para su posterior investigación y estudio en una sesión futura. Se trata principalmente de un aplazamiento, no de una nueva resolución."
