label: { ar: "المعجم الكبير ⁦(مجمع اللغة العربية بالقاهرة)⁩", en: "al-Mu'jam al-Kabir (Arabic Language Academy of Cairo)", es: "al-Mu'jam al-Kabir (Academia de la Lengua Árabe de El Cairo)", fr: "al-Mu'jam al-Kabir (Académie de langue arabe du Caire)", ur: "المعجم الکبیر ⁦(مجمع اللغۃ العربیہ قاہرہ)⁩", tr: "Al-Mu'jam Al-Kabir (Kahire'deki Arap Dil Akademisi)", id: "Al-Mu'jam Al-Kabir (Akademi Bahasa Arab di Kairo)" }
summary:
  ar: "المعجم الكبير من تأليف مجمع اللغة العربية بالقاهرة، أحد معاجم المجمع المخطط لها لبيان نشأة العربية تاريخياً. وتذكر موسوعة الإسلام التركية TDV أن المجمع أُسس سنة ١٩٣٢م ومن أهدافه معجم يبيّن تطور العربية تاريخياً، وأن أوغست فيشر شرع في معجم عربي يقابل معجم أكسفورد الإنجليزي فتوقف عمله بالحرب العالمية الثانية ووفاته سنة ١٩٤٩م، وأن الإعداد للمعجم الكبير استمر وقُدمت نسخة نموذجية من ٥٠٠ صفحة إلى المختصين سنة ١٩٥٦م. وحقوق طبعاته محفوظة للمجمع ولذلك يوصف هنا ويُشار إليه فقط."
  en: "al-Mu'jam al-Kabir, a work of the Arabic Language Academy of Cairo, one of the Academy's planned dictionaries showing the historical development of Arabic. The TDV İslâm Ansiklopedisi says the Academy was founded in 1932 with the aim, among others, of a dictionary showing the historical development of Arabic; that August Fischer's work towards an Arabic counterpart of the Oxford English Dictionary stopped with the Second World War and his death in 1949; and that preparations for al-Mu'jam al-Kabir went on, a 500-page specimen volume being submitted to specialists in 1956. The Academy holds the rights to its printings, so it is described and linked here only."
  es: "El al-Mu'jam al-Kabir, obra de la Academia de la Lengua Árabe de El Cairo, uno de los diccionarios proyectados por la Academia para mostrar el desarrollo histórico del árabe. La TDV İslâm Ansiklopedisi dice que la Academia se fundó en 1932 con el fin, entre otros, de un diccionario que mostrara el desarrollo histórico del árabe; que el trabajo de August Fischer hacia un equivalente árabe del Oxford English Dictionary se detuvo con la Segunda Guerra Mundial y su muerte en 1949; y que continuaron los preparativos del al-Mu'jam al-Kabir, presentándose a los especialistas en 1956 un volumen de muestra de 500 páginas. La Academia conserva los derechos de sus ediciones, por lo que aquí solo se describe y se enlaza."
  fr: "Le al-Mu'jam al-Kabir, œuvre de l'Académie de langue arabe du Caire, l'un des dictionnaires projetés par l'Académie pour montrer le développement historique de l'arabe. La TDV İslâm Ansiklopedisi dit que l'Académie fut fondée en 1932 avec pour but, entre autres, un dictionnaire montrant le développement historique de l'arabe ; que le travail d'August Fischer vers un équivalent arabe de l'Oxford English Dictionary s'arrêta avec la Seconde Guerre mondiale et sa mort en 1949 ; et que les préparatifs du al-Mu'jam al-Kabir se poursuivirent, un volume spécimen de 500 pages étant soumis aux spécialistes en 1956. L'Académie détient les droits de ses éditions ; il n'est ici que décrit et signalé."
  ur: "المعجم الکبیر، قاہرہ کی مجمع اللغۃ العربیہ کی تصنیف، مجمع کی ان لغات میں سے ایک جو عربی کی تاریخی نشوونما دکھانے کے لیے منصوبہ بند تھیں۔ TDV İslâm Ansiklopedisi بتاتی ہے کہ مجمع 1932ء میں قائم ہوا اور اس کے مقاصد میں عربی کی تاریخی نشوونما دکھانے والی لغت تھی؛ کہ اوگسٹ فشر کا آکسفورڈ انگلش ڈکشنری کے مقابل عربی لغت کی طرف کام دوسری جنگِ عظیم اور 1949ء میں ان کی وفات سے رک گیا؛ اور کہ المعجم الکبیر کی تیاری جاری رہی اور 1956ء میں 500 صفحات کی نمونہ جلد ماہرین کو پیش کی گئی۔ مجمع اس کی اشاعتوں کے حقوق رکھتا ہے، اس لیے یہاں صرف اس کا بیان اور حوالہ ہے۔"
  tr: "Büyük Sözlük, Arapçanın tarihsel kökenini açıklamak için planlanan sözlüklerden biri olan Kahire'deki Arap Dili Akademisi tarafından yazılmıştır. Türk İslam Ansiklopedisi (TDV), Akademi'nin 1932 yılında kurulduğunu ve amaçlarından birinin Arapçanın tarihsel gelişimini gösteren bir sözlük oluşturmak olduğunu belirtir; August Fischer, İngilizce Oxford Sözlüğü'ne karşılık gelen bir Arapça sözlük başlatmıştır, ancak çalışmaları II. Dünya Savaşı ve 1949'daki ölümü sırasında durmaktadır. Büyük Sözlüğün hazırlanması devam etmiş ve 1956'da uzmanlara 500 sayfalık model bir versiyon sunulmuştur. Baskılarının telif hakları Akademi'ye aittir, bu nedenle burada tanımlanmış ve sadece referans verilmiştir."
  id: "Kamus Agung ditulis oleh Akademi Bahasa Arab di Kairo, salah satu kamus yang direncanakan Akademi untuk menjelaskan asal-usul sejarah bahasa Arab. Ensiklopedia Islam Turki (TDV) menyebutkan bahwa Akademi didirikan pada tahun 1932 M dan salah satu tujuannya adalah membuat kamus yang menunjukkan perkembangan sejarah bahasa Arab, dan bahwa August Fischer memulai kamus Arab yang sesuai dengan Kamus Oxford Inggris, tetapi kegiatannya berhenti selama Perang Dunia II dan kematiannya pada tahun 1949. Persiapan Kamus Agung berlanjut, dan versi model 500 halaman diajukan kepada para ahli pada tahun 1956. Hak cipta edisi-edisinya dilindungi oleh Akademi, sehingga dijelaskan di sini dan hanya dirujuk saja."
