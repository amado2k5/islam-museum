summary:
  ar: "مصحف مصوّر للأطفال بالإندونيسية مع ترجمة وتفسير ميسّر، نشرته دار بيلانغي ميزان في إندونيسيا سنة 2007، ثم طبعة ثانية سنة 2008، وأعيد إخراجه سنة 2015 مع ألعاب تعليمية وقلم ناطق؛ يتكون من المصحف في خمسة عشر مجلدًا، وخمسة عشر مجلدًا من التفسير والترجمة المبسطة على الترجمة الرسمية لوزارة الشؤون الدينية، ومعجم وأقراص صوتية، كتبه أساسًا عرفان أمالي مع فريق من أكثر من عشرين عالمًا، وزكّاه علماء من كبرى المنظمات الإسلامية الإندونيسية، وتوقف إنتاجه بعد 2019."
  en: "An illustrated Indonesian children's Qur'an with translation and simplified interpretation, published by Pelangi Mizan in 2007, with a second edition in 2008 and a 2015 relaunch with educational games and a smart pen; the package comprises the mushaf in fifteen volumes and fifteen volumes of simplified interpretation and translation based on the Ministry of Religious Affairs translation, with a dictionary and audio, written mainly by Irfan Amalee with a team of over twenty scholars, endorsed by figures from Indonesia's main Islamic organisations, and discontinued after 2019."
  ur: "بچوں کے لیے انڈونیشیائی زبان میں مصور قرآن مع ترجمہ اور آسان تفسیر، جو پیلانگی میزان نے 2007 میں شائع کیا، 2008 میں دوسری اشاعت آئی اور 2015 میں تعلیمی کھیلوں اور بولنے والے قلم کے ساتھ نئی پیشکش ہوئی؛ اس میں مصحف پندرہ جلدوں میں اور وزارتِ مذہبی امور کے سرکاری ترجمے پر مبنی آسان تفسیر و ترجمے کی پندرہ جلدیں، لغت اور آڈیو شامل ہیں؛ اسے زیادہ تر عرفان امالی نے بیس سے زیادہ علما کی ٹیم کے ساتھ لکھا، انڈونیشیا کی بڑی اسلامی تنظیموں کی شخصیات نے تائید کی، اور 2019 کے بعد اس کی تیاری رک گئی۔"
