id: work/ahmed-el-sayed-seerah-lilmuslihin-ep20
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 20: غزوة أحد"
  en: "The Prophetic Biography for Reformers, episode 20: The Battle of Uhud"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 20: غزوۂ احد"
  fr: "La biographie prophétique pour les réformateurs, épisode 20 : La bataille d'Uhud"
  es: "La biografía profética para los reformadores, episodio 20: La batalla de Uhud"
summary:
  ar: "يتتبع المحاضر الأشهر الفاصلة بين بدر وأحد، من غزوة بني سليم وغارة السويق إلى المواجهة مع بني قينقاع وحياة النبي اليومية في المدينة. ثم يروي غزوة أحد في السنة الثالثة للهجرة من استعدادات قريش إلى رحيل أبي سفيان، مع التضاريس والرماة وانقلاب مجرى المعركة والدفاع عن النبي والدفن."
  en: "The speaker follows the months between Badr and Uhud: the expedition to Banu Sulaym, the raid of al-Sawiq, the confrontation with Banu Qaynuqa, and the Medinan routine of the Prophet. He then narrates the battle of Uhud in the third year of the Hijra from Quraysh's preparations to Abu Sufyan's departure, with the terrain, the archers, the reversal, the defence of the Prophet and the burials."
  ur: "مقرر بدر اور احد کے درمیان کے مہینوں کا ذکر کرتا ہے: بنو سلیم کی طرف مہم، غزوۂ سویق، بنو قینقاع سے مڈبھیڑ اور مدینہ میں نبی کی روزمرہ زندگی۔ پھر وہ ہجرت کے تیسرے سال کی غزوۂ احد کو قریش کی تیاریوں سے ابو سفیان کی واپسی تک بیان کرتا ہے، جس میں زمین کی ساخت، تیر انداز، جنگ کا پلٹنا، نبی کا دفاع اور تدفین شامل ہیں۔"
  fr: "Le conférencier suit les mois entre Badr et Uhud : l'expédition contre les Banu Sulaym, le raid d'al-Sawiq, l'affrontement avec les Banu Qaynuqa et la vie quotidienne du Prophète à Médine. Il raconte ensuite la bataille d'Uhud, en l'an trois de l'Hégire, des préparatifs de Quraysh au départ d'Abu Sufyan, avec le terrain, les archers, le renversement, la défense du Prophète et les inhumations."
  es: "El conferenciante sigue los meses entre Badr y Uhud: la expedición contra los Banu Sulaym, la incursión de al-Sawiq, el enfrentamiento con los Banu Qaynuqa y la vida cotidiana del Profeta en Medina. Después narra la batalla de Uhud, en el año tercero de la Hégira, desde los preparativos de Quraysh hasta la partida de Abu Sufyan, con el terreno, los arqueros, el vuelco de la batalla, la defensa del Profeta y los entierros."
