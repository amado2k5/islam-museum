id: work/fatwa-amja-wind-certainty-not-doubt
class: work
kind: fatwa
label: { ar: "اليقين بالحدث", en: "Must one hear a sound or find a smell — certainty vs doubt", ur: "آواز یا بو — یقین بمقابلہ شک", es: "¿Es necesario oír un sonido o percibir un olor? — certeza versus duda", fr: "Faut-il entendre un son ou sentir une odeur ? — certitude contre doute", tr: "Olayın kesinliği", id: "Kepastian peristiwa" }
summary:
  ar: "سأل سائل هل يجب أن يسمع صوتًا أو يشم رائحة ليتأكد من حاجته لإعادة الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21948 بتاريخ 31 مايو 2007)⁩ أن من خرج منه غازات انتقض وضوءه ولا يلزم أن يسمع صوتًا أو يجد ريحًا طالما تيقن وهذا الحديث محله عند الشك أما من تيقن الحدث فقد انتقض وضوءه على ما فصّل الجواب."
  en: "A questioner asked whether he must hear a sound or smell an odor to confirm needing wudu again. Dr. Salah al-Sawi (fatwa no. 21948, 31 May 2007) answered that one from whom gases exit has broken his wudu — he need not hear a sound or find a smell so long as he is certain; that hadith's place is at doubt, while one certain of the hadath has his wudu broken — as the answer details."
  ur: "کیا آواز یا بو ضروری ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21948، 31 مئی 2007)⁩ کے مطابق یقین پر وضو ٹوٹا — آواز و بو صرف شک میں معیار۔"
  es: "Un consultante preguntó si debía oír un sonido o percibir un olor para confirmar la necesidad de realizar nuevamente la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.° 21948, 31 de mayo de 2007) respondió que quien emana gases ha roto su ablución; no necesita oír un sonido ni percibir un olor, siempre que esté seguro; que la validez del hadiz es dudosa, mientras que quien está seguro del hadiz ha roto su ablución, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il devait entendre un son ou sentir une odeur pour confirmer la nécessité de refaire ses ablutions. Le Dr Salah al-Sawi (fatwa n° 21948, 31 mai 2007) a répondu que celui qui émet des gaz a rompu ses ablutions; il n'est pas nécessaire d'entendre un son ou de sentir une odeur tant que la personne est certaine de la validité de ses ablutions. La validité de ce hadith est sujette à caution, et celui qui en est certain a ses ablutions rompues, comme le précise la réponse."
  tr: "Bir soru soran, abdestlerin tekrarlanması gerekip gerekmediğinden emin olmak için bir ses veya koku duyulmalı mı diye sordu. Dr. Salah Al-Sawy (31 Mayıs 2007 tarihli Fetva No. 21948) gaz salınırsa abdest almasının geçersiz olduğunu ve kesin olduğu sürece ses veya koku duymaya gerek olmadığını yanıtladı. Bu hadis şüphe durumlarında geçerlidir, ancak olaydan kesin olan kişiler cevabında detaylandırıldığı gibi abdest alma geçersiz sayılır."
  id: "Seorang penanya bertanya apakah seseorang harus mendengar suara atau bau untuk memastikan perlunya mengulang wudhu. Dr. Salah Al-Sawy menjawab (Fatwa No. 21948 tanggal 31 Mei 2007) bahwa jika gas dilepaskan, wudunya menjadi tidak berlaku, dan tidak perlu mendengar suara atau bau selama dia yakin. Hadis ini berlaku dalam kasus keraguan, tetapi jika seseorang yakin akan kejadian itu, wudunya dibatalkan, seperti yang dijelaskan dalam jawaban."
