id: work/fatwa-amja-wind-certainty-not-doubt
class: work
kind: fatwa
label: { ar: "اليقين بالحدث", en: "Must one hear a sound or find a smell — certainty vs doubt", ur: "آواز یا بو — یقین بمقابلہ شک", es: "¿Es necesario oír un sonido o percibir un olor? — certeza versus duda" }
summary:
  ar: "سأل سائل هل يجب أن يسمع صوتًا أو يشم رائحة ليتأكد من حاجته لإعادة الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21948 بتاريخ 31 مايو 2007)⁩ أن من خرج منه غازات انتقض وضوءه ولا يلزم أن يسمع صوتًا أو يجد ريحًا طالما تيقن وهذا الحديث محله عند الشك أما من تيقن الحدث فقد انتقض وضوءه على ما فصّل الجواب."
  en: "A questioner asked whether he must hear a sound or smell an odor to confirm needing wudu again. Dr. Salah al-Sawi (fatwa no. 21948, 31 May 2007) answered that one from whom gases exit has broken his wudu — he need not hear a sound or find a smell so long as he is certain; that hadith's place is at doubt, while one certain of the hadath has his wudu broken — as the answer details."
  ur: "کیا آواز یا بو ضروری ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21948، 31 مئی 2007)⁩ کے مطابق یقین پر وضو ٹوٹا — آواز و بو صرف شک میں معیار۔"
  es: "Un consultante preguntó si debía oír un sonido o percibir un olor para confirmar la necesidad de realizar nuevamente la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.° 21948, 31 de mayo de 2007) respondió que quien emana gases ha roto su ablución; no necesita oír un sonido ni percibir un olor, siempre que esté seguro; que la validez del hadiz es dudosa, mientras que quien está seguro del hadiz ha roto su ablución, como se detalla en la respuesta."
