label: { ar: "حكم العدول عن الوعد بالبيع", en: "Going back on a promise to sell", ur: "بیچنے کے وعدے سے مکرنے کا حکم" }
summary:
  ar: "سائل سأل عن العدول عن وعد بالبيع جرى بينه وبين راغب في شراء منزل مع اتفاق على جميع المسائل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22160)⁩ ببيان حكم الوعد بالبيع وأثره على المتعاقدين على ما فصّل الجواب."
  en: "A questioner asked about going back on a promise to sell made to a would-be buyer of a house, with agreement on all the terms. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22160) answered by setting out the ruling on the promise to sell and its effect on the two parties, as the answer details."
  ur: "ایک سائل نے مکان کے ممکنہ خریدار سے بیچنے کا وعدہ کرنے اور تمام شرائط پر اتفاق کے بعد وعدے سے مکرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22160)⁩ نے جواب میں بیچنے کے وعدے کا حکم اور دونوں فریقوں پر اس کا اثر بیان کیا۔"
