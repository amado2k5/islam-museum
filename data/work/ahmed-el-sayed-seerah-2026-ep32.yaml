label:
  ar: "سيرة رسول الله 2026، الحلقة 32: نقض الصحيفة ورحلة الطائف وجوار المطعم وإسلام الطفيل"
  en: "The Biography of the Messenger of God 2026, episode 32: The tearing of the document, the journey to Taif, the protection of al-Mut'im and al-Tufayl's conversion"
  ur: "سیرتِ رسول اللہ 2026، قسط 32: دستاویز کا پھاڑا جانا، طائف کا سفر، مطعم کی پناہ اور طفیل کا اسلام"
  fr: "La biographie du Messager de Dieu 2026, épisode 32 : Le déchirement du document, le voyage à Taïf, la protection d'al-Mut'im et la conversion d'al-Tufayl"
  es: "La biografía del Mensajero de Dios 2026, episodio 32: El rasgado del documento, el viaje a Taif, la protección de al-Mut'im y la conversión de al-Tufayl"
summary:
  ar: "يقرأ من ابن هشام خبر الرجال الخمسة من قريش الذين مزقوا صحيفة المقاطعة وقصيدة أبي طالب فيهم، ثم يستخلص دروسًا في قبول المساعدة من غير المسلمين في أوقات الضعف. ويعد رحلة الطائف أقسى ما مر بالنبي، ثم ينتقل إلى قصة الطفيل بن عمرو الدوسي، موازنًا بين سندها وبين الأخبار الصحيحة."
  en: "He reads from Ibn Hisham the account of the five Quraysh men who tore up the boycott document and Abu Talib's poem about them, then draws lessons on accepting help from non-Muslims in times of weakness. He treats the Taif journey as the hardest experience of the Prophet and then turns to the story of al-Tufayl ibn Amr al-Dawsi, weighing its chain against the sound reports."
  ur: "وہ ابن ہشام سے قریش کے ان پانچ آدمیوں کا واقعہ پڑھتے ہیں جنہوں نے بائیکاٹ کی دستاویز پھاڑی اور ان کے بارے میں ابو طالب کا قصیدہ، پھر کمزوری کے وقت غیر مسلموں سے مدد قبول کرنے کے بارے میں اسباق نکالتے ہیں۔ وہ طائف کے سفر کو نبی کا سخت ترین تجربہ قرار دیتے ہیں اور پھر طفیل بن عمرو الدوسی کے قصے کی طرف آتے ہیں اور اس کی سند کو صحیح روایات کے مقابل تولتے ہیں۔"
  fr: "Il lit chez Ibn Hisham le récit des cinq hommes de Quraysh qui déchirèrent le document du boycott et le poème d'Abu Talib à leur sujet, puis tire des leçons sur l'acceptation de l'aide de non-musulmans en temps de faiblesse. Il traite le voyage à Taïf comme l'épreuve la plus dure du Prophète, puis passe à l'histoire d'al-Tufayl ibn Amr al-Dawsi, en pesant sa chaîne face aux récits authentiques."
  es: "Lee en Ibn Hisham el relato de los cinco hombres de los Quraysh que rasgaron el documento del boicot y el poema de Abu Talib sobre ellos, y luego extrae lecciones sobre aceptar la ayuda de no musulmanes en tiempos de debilidad. Trata el viaje a Taif como la experiencia más dura del Profeta y luego pasa a la historia de al-Tufayl ibn Amr al-Dawsi, sopesando su cadena frente a los relatos sólidos."
