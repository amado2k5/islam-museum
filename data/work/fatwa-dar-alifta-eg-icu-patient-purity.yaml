label: { ar: "حكم طهارة المريض المحجوز بالعناية المركزة", en: "Purity for a patient confined to intensive care", ur: "انتہائی نگہداشت میں مریض کی طہارت" }
summary:
  ar: "سائل سأل عن طهارة المريض المحجوز بالعناية المركزة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21631)⁩ أنه لا يجب على المريض المحجوز بالعناية المركزة استعمال الماء في الطهارة حال منع الأطباء له من ذلك حفاظًا عليه على ما فصّل الجواب من بدائله."
  en: "A questioner asked about purification for a patient confined to intensive care. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21631) answered that water is not obligatory upon the ICU patient when the doctors forbid it for his protection — with the alternatives the answer sets out."
  ur: "ایک سائل نے انتہائی نگہداشت میں مریض کی طہارت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21631)⁩ نے جواب دیا کہ جب ڈاکٹر منع کریں تو مریض پر پانی استعمال کرنا واجب نہیں — جواب میں متبادل طریقے بیان ہوئے۔"
