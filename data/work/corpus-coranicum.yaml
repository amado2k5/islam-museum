summary:
  ar: "مشروع بحثي رقمي لأكاديمية برلين-براندنبورغ للعلوم والإنسانيات بين 2007 و2024، أتاح على الشبكة مصادر تاريخ القرآن: صور أقدم مخطوطاته وبياناتها وتأريخ أكثر من أربعين منها بالكربون المشع، وقاعدة للقراءات، ونصوصًا من بيئة القرآن، وتعليقًا أدبيًا؛ قادته أنغيليكا نويفيرت وميخائيل ماركس، وتواصل منذ 2025 في جمعية تحمل اسمه."
  en: "A digital research project of the Berlin-Brandenburg Academy of Sciences and Humanities from 2007 to 2024 that put online the sources for the history of the Qur'an: images and data of its earliest manuscripts, with radiocarbon dating of more than forty, a database of the readings, texts from the Qur'an's environment and a literary commentary; led by Angelika Neuwirth and Michael Marx, it has continued since 2025 in an association of its name."
  ur: "برلن-برینڈنبرگ اکیڈمی آف سائنسز اینڈ ہیومینٹیز کا 2007 سے 2024 تک کا ڈیجیٹل تحقیقی منصوبہ جس نے قرآن کی تاریخ کے مآخذ آن لائن کیے: قدیم ترین مخطوطات کی تصاویر اور معلومات، چالیس سے زیادہ کی ریڈیو کاربن تاریخ، قراءات کا ڈیٹا بیس، قرآن کے ماحول کے متون اور ادبی تفسیر؛ قیادت انگیلیکا نوئیورتھ اور میخائیل مارکس نے کی، اور 2025 سے اسی نام کی انجمن میں جاری ہے۔"
