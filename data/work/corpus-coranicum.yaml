summary:
  ar: "مشروع بحثي رقمي لأكاديمية برلين-براندنبورغ للعلوم والإنسانيات بين 2007 و2024، أتاح على الشبكة مصادر تاريخ القرآن: صور أقدم مخطوطاته وبياناتها وتأريخ أكثر من أربعين منها بالكربون المشع، وقاعدة للقراءات، ونصوصًا من بيئة القرآن، وتعليقًا أدبيًا؛ قادته أنغيليكا نويفيرت وميخائيل ماركس، وتواصل منذ 2025 في جمعية تحمل اسمه."
  en: "A digital research project of the Berlin-Brandenburg Academy of Sciences and Humanities from 2007 to 2024 that put online the sources for the history of the Qur'an: images and data of its earliest manuscripts, with radiocarbon dating of more than forty, a database of the readings, texts from the Qur'an's environment and a literary commentary; led by Angelika Neuwirth and Michael Marx, it has continued since 2025 in an association of its name."
  ur: "برلن-برینڈنبرگ اکیڈمی آف سائنسز اینڈ ہیومینٹیز کا 2007 سے 2024 تک کا ڈیجیٹل تحقیقی منصوبہ جس نے قرآن کی تاریخ کے مآخذ آن لائن کیے: قدیم ترین مخطوطات کی تصاویر اور معلومات، چالیس سے زیادہ کی ریڈیو کاربن تاریخ، قراءات کا ڈیٹا بیس، قرآن کے ماحول کے متون اور ادبی تفسیر؛ قیادت انگیلیکا نوئیورتھ اور میخائیل مارکس نے کی، اور 2025 سے اسی نام کی انجمن میں جاری ہے۔"
  es: "Un proyecto de investigación digital de la Academia de Ciencias y Humanidades de Berlín-Brandeburgo, desarrollado entre 2007 y 2024, que puso en línea las fuentes para la historia del Corán: imágenes y datos de sus manuscritos más antiguos, con datación por radiocarbono de más de cuarenta, una base de datos de las lecturas, textos del entorno del Corán y un comentario literario; dirigido por Angelika Neuwirth y Michael Marx, ha continuado desde 2025 bajo una asociación que lleva su nombre."
  fr: "Un projet de recherche numérique de l'Académie des sciences et des lettres de Berlin-Brandebourg, mené de 2007 à 2024, qui a mis en ligne les sources de l'histoire du Coran: images et données de ses plus anciens manuscrits, avec datation au radiocarbone de plus de quarante d'entre eux, une base de données des lectures, des textes de l'environnement du Coran et un commentaire littéraire; dirigé par Angelika Neuwirth et Michael Marx, il se poursuit depuis 2025 au sein d'une association portant son nom."
  tr: "Berlin-Brandenburg Bilimler ve Beşeri Bilimler Akademisi tarafından 2007 ile 2024 yılları arasında yürütülen dijital araştırma projesi; Kur'an'ın tarihine dair çevrimiçi kaynaklar sundu: en eski el yazmalarının görüntüleri ve verileri, kırktan fazlası radyokarbon olarak tarihlendirilen, bir okuma tabanı, Kur'an ortamından metinler ve edebi yorumlar; Angelica Neuwirth ve Michael Marx liderliğinde ve 2025'ten beri onun adını taşıyan bir dernekle devam ediyor."
  id: "Proyek penelitian digital oleh Akademi Ilmu Pengetahuan dan Humaniora Berlin-Brandenburg antara tahun 2007 dan 2024, yang menyediakan sumber daring tentang sejarah Al-Qur'an: gambar dan data manuskrip tertuanya, yang bertanggal lebih dari empat puluh di antaranya dalam radiokarbon, basis bacaan, teks dari lingkungan Al-Qur'an, dan komentar sastra; dipimpin oleh Angelica Neuwirth dan Michael Marx, dan berlanjut sejak 2025 dalam asosiasi yang menggunakan namanya."
