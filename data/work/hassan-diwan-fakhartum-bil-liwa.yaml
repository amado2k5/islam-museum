label: { ar: "قصيدة حسان «فخرتم باللواء وشر فخر»", en: "Hassan's poem 'You boasted of the banner, the worst of boasts'", es: "El poema de Hassan: \"Te jactaste del estandarte, la peor de las jactancias\".", fr: "Le poème de Hassan « Tu t'es vanté de la bannière, la pire des vantardises »", ur: "حسن کی نظم 'تم نے جھنڈے پر فخر کیا، بد ترین شیخی'", tr: "Hassan'ın şiiri 'Sancağa ve en kötü gururla gurur duydun'", id: "Puisi Hassan 'Kau bangga pada panji dan kebanggaan terburuk'" }
summary:
  ar: "أبيات لحسان بن ثابت من الوافر على روي الباء، يهجو بها بني عبد الدار يوم أحد وقد حافظوا على لوائهم حتى قتلوا {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  en: "Verses by Hassan ibn Thabit in the wafir metre on the rhyme ba', mocking Banu Abd al-Dar at Uhud, who held their banner until they were killed {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  es: "Versos de Hassan ibn Thabit en metro wafir sobre la rima ba', burlándose de Banu Abd al-Dar en Uhud, quienes mantuvieron su estandarte hasta que fueron asesinados {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  fr: "Vers de Hassan ibn Thabit en mètre wafir sur la rime ba', se moquant des Banu Abd al-Dar à Uhud, qui ont tenu leur bannière jusqu'à ce qu'ils soient tués {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  ur: "حسن بن ثابت کی آیات وفیر میٹر میں شاعری با' پر، احد میں بنو عبد الدار کا مذاق اڑاتے ہوئے، جنہوں نے اپنے جھنڈے کو پکڑے رکھا یہاں تک کہ وہ قتل ہو گئے"
  tr: "Hasan ibn Tebit'in Al-Wafir'den Ba' ayeti üzerine yazdığı dizeler, Uhud Günü'nde Banu Abd al-Dar'ı hicveden, bayraklarını koruyarak öldürüldükleri zamana kadar {{cite:sharh-diwan-hassan-barquqi-1929 s.62}}."
  id: "Bait-bait oleh Hassan ibn Thabit dari Al-Wafir tentang narasi Ba', menyindir Banu Abd al-Dar pada Hari Uhud, sementara mereka mempertahankan panji mereka hingga terbunuh {{cite:sharh-diwan-hassan-barquqi-1929 hlm.62}}."
