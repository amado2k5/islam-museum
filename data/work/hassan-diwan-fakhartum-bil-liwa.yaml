summary:
  ar: "أبيات لحسان بن ثابت من الوافر على روي الباء، يهجو بها بني عبد الدار يوم أحد وقد حافظوا على لوائهم حتى قتلوا {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  en: "Verses by Hassan ibn Thabit in the wafir metre on the rhyme ba', mocking Banu Abd al-Dar at Uhud, who held their banner until they were killed {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  es: "Versos de Hassan ibn Thabit en metro wafir sobre la rima ba', burlándose de Banu Abd al-Dar en Uhud, quienes mantuvieron su estandarte hasta que fueron asesinados {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
  fr: "Vers de Hassan ibn Thabit en mètre wafir sur la rime ba', se moquant des Banu Abd al-Dar à Uhud, qui ont tenu leur bannière jusqu'à ce qu'ils soient tués {{cite:sharh-diwan-hassan-barquqi-1929 p.62}}."
