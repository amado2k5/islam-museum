label: { ar: "قصيدة المتنبي «آلة العيش صحة وشباب»", en: "Al-Mutanabbi's ode 'The instrument of life is health and youth'", es: "La oda de Al-Mutanabbi: \"El instrumento de la vida es la salud y la juventud\".", fr: "L'ode d'Al-Mutanabbi « L'instrument de la vie est la santé et la jeunesse »", ur: "المتنبی کا شعر 'زندگی کا آلہ صحت اور جوانی ہے'" }
summary:
  ar: "قصيدة من الخفيف على روي اللام للمتنبي، يرثي فيها أخت سيف الدولة الصغرى ويسليه ببقاء الكبرى، أنشده إياها يوم الأربعاء منتصف رمضان سنة 344هـ ⁦(955م)⁩ كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.405}}."
  en: "An ode in the khafif metre on the rhyme lam by al-Mutanabbi; lamenting Sayf al-Dawla's younger sister and consoling him with the survival of the elder, recited to him in mid-Ramadan 344 AH (955 CE), as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.405}}."
  es: "Una oda en metro khafif sobre la rima lam de al-Mutanabbi; lamentando la muerte de la hermana menor de Sayf al-Dawla y consolándolo con la supervivencia de la mayor, recitada a él a mediados del Ramadán del año 344 AH (955 d. C.), como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.405}}."
  fr: "Une ode en mètre khafif sur la rime lam par al-Mutanabbi; déplorant la mort de la jeune sœur de Sayf al-Dawla et le consolant avec la survie de l'aînée, récitée à lui au milieu du Ramadan 344 AH (955 CE), comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.405}}."
  ur: "المتنبی کی شاعری لام پر خفیف میٹر میں ایک اوڈ؛ سیف الدولہ کی چھوٹی بہن پر افسوس کا اظہار کرتے ہوئے اور بڑی کی بقا پر انہیں تسلی دیتے ہوئے، انہیں رمضان المبارک 344 ہجری ⁦(955 عیسوی)⁩ کے وسط میں پڑھا گیا، جیسا کہ دار بیروت ایڈیشن نے اس کا تعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 405}}۔"
