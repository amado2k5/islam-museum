summary:
  ar: "قصيدة من الخفيف على روي اللام للمتنبي، يرثي فيها أخت سيف الدولة الصغرى ويسليه ببقاء الكبرى، أنشده إياها يوم الأربعاء منتصف رمضان سنة 344هـ ⁦(955م)⁩ كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.405}}."
  en: "An ode in the khafif metre on the rhyme lam by al-Mutanabbi; lamenting Sayf al-Dawla's younger sister and consoling him with the survival of the elder, recited to him in mid-Ramadan 344 AH (955 CE), as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.405}}."
