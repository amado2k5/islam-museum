label: { ar: "قصيدة حسان «ذكرت القروم الصيد من آل هاشم»", en: "Hassan's reply 'You recalled the proud stallions of the house of Hashim'", es: "La respuesta de Hassan fue: \"Recordaste a los orgullosos sementales de la casa de Hashim\".", fr: "Réponse d'Hassan: « Tu as évoqué les fiers étalons de la maison de Hashim. »", ur: "حسن کا جواب تم نے ہاشم کے گھر کے مغرور گھڑے یاد کر دیے" }
summary:
  ar: "أبيات لحسان بن ثابت من الطويل على روي الباء، يجيب بها شاعر قريش بعد أحد ويذكر قتلى قريش ببدر {{cite:sharh-diwan-hassan-barquqi-1929 p.66}}."
  en: "Verses by Hassan ibn Thabit in the tawil metre on the rhyme ba', answering a Qurayshi poet after Uhud by recalling Quraysh's dead at Badr {{cite:sharh-diwan-hassan-barquqi-1929 p.66}}."
  es: "Versos de Hassan ibn Thabit en el metro tawil sobre la rima ba', respondiendo a un poeta Quraysh después de Uhud al recordar a los muertos de Quraysh en Badr {{cite:sharh-diwan-hassan-barquqi-1929 p.66}}."
  fr: "Vers de Hassan ibn Thabit en mètre tawil sur la rime ba', répondant à un poète Quraysh après Uhud en rappelant les morts Quraysh à Badr {{cite:sharh-diwan-hassan-barquqi-1929 p.66}}."
  ur: "حسن بن ثابت کی نظم بع پر تاویل میٹر میں، احد کے بعد ایک قریشی شاعر کا جواب بدر میں قریش کے مرنے والوں کو یاد کرتے ہوئے {{حوالہ:شرح دیوان-حسن برقوی-1929 ص66}}۔"
