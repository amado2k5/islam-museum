id: work/fatwa-subki-tarqiya-before-khatib
class: work
kind: fatwa
label: { ar: "الترقية بين يدي الخطيب", en: "الترقية بين يدي الخطيب والأذان داخل المسجد", ur: "خطیب کے سامنے ترقیہ اور مسجد میں اذان", es: "Promoción entre el predicador y el llamado a la oración dentro de la mezquita.", fr: "Promotion entre le prédicateur et l'appel à la prière à l'intérieur de la mosquée", tr: "Terfi hatipin elindedir", id: "Promosi ada di tangan orator" }
summary:
  ar: "سؤال عن الترقية بين يدي الخطيب والأذان داخل المسجد: أسنة أم بدعة؟ الجواب بأن الترقية مكروهة كراهة تحريم عند الحنفية وفق ما نقله الحصفكي، وأن الأذان الأول شرع لغرض محدد فلا يُزاد عليه ما يشوش على الوقت."
  ur: "سوال: خطیب کے سامنے ترقیہ اور مسجد کے اندر اذان سنت ہے یا بدعت؟ جواب: حنفی موقف کے مطابق ترقیہ مکروہ ہے، اور اذانِ اول ایک خاص مقصد کے لیے مقرر ہوئی ہے، اس لیے اس میں ایسا اضافہ نہ کیا جائے جو وقت میں خلل ڈالے۔"
  en: "Question on acclaiming before the preacher and adhan inside the mosque: sunna or innovation? The answer cites the Hanafi view that it is reprehensible, and that the adhan was set for a fixed purpose and should not be extended into disturbance."
  es: "Pregunta sobre aclamar ante el predicador y el adhan dentro de la mezquita: ¿sunna o innovación? La respuesta cita la opinión hanafí, que lo considera reprobable, y que el adhan se estableció con un propósito definido y no debe extenderse hasta causar disturbios."
  fr: "Question concernant les acclamations avant le prédicateur et l'adhan à l'intérieur de la mosquée: sunna ou innovation ? La réponse cite l'avis hanafite selon lequel cette pratique est répréhensible, et que l'adhan a été institué dans un but précis et ne doit pas être utilisé à des fins perturbatrices."
  tr: "Vaizin önünde terfi ve cami içindeki ezan hakkında bir soru: Sünnet mi yenilik mi? Cevap, Hanefilere göre terfi sevilmiyor ve yasaktır, ilk ezan belirli bir amaç için yasalaştırılmıştır, bu yüzden zamanı bozacak hiçbir şey eklenmemelidir."
  id: "Pertanyaan tentang promosi di depan penceramah dan panggilan salat di dalam masjid: Sunnah atau inovasi? Jawabannya adalah promosi tidak disukai dan dilarang menurut Hanafi, menurut laporan Al-Hasafki, dan panggilan salat pertama diatur untuk tujuan tertentu, jadi tidak ada yang mengganggu waktu yang boleh ditambahkan."
