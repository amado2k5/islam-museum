summary:
  ar: "سؤال عن الترقية بين يدي الخطيب والأذان داخل المسجد: أسنة أم بدعة؟ الجواب بأن الترقية مكروهة كراهة تحريم عند الحنفية وفق ما نقله الحصفكي، وأن الأذان الأول شرع لغرض محدد فلا يُزاد عليه ما يشوش على الوقت."
  ur: "سوال: خطیب کے سامنے ترقیہ اور مسجد کے اندر اذان سنت ہے یا بدعت؟ جواب: حنفی موقف کے مطابق ترقیہ مکروہ ہے، اور اذانِ اول ایک خاص مقصد کے لیے مقرر ہوئی ہے، اس لیے اس میں ایسا اضافہ نہ کیا جائے جو وقت میں خلل ڈالے۔"
  en: "Question on acclaiming before the preacher and adhan inside the mosque: sunna or innovation? The answer cites the Hanafi view that it is reprehensible, and that the adhan was set for a fixed purpose and should not be extended into disturbance."
