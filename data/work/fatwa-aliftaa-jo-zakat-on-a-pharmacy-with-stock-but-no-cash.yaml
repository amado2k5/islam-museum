id: work/fatwa-aliftaa-jo-zakat-on-a-pharmacy-with-stock-but-no-cash
class: work
kind: fatwa
label: { ar: "زكاة صيدلية فيها بضاعة ولا نقد", en: "Zakat on a pharmacy with stock but no cash", ur: "اسٹاک والی مگر نقدی سے خالی فارمیسی کی زکوٰۃ" }
summary:
  ar: "سؤال عن زكاة صيدلية فيها بضاعة ولا نقد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة تجب على الفور ويحرم تأخيرها مع القدرة، فإن لم يتوفر نقد ولم يمكن إلا التقسيط وجب إخراجها ولو مقسطة من ثمن البضاعة المبيعة بعد وقت الوجوب. أجابت الدائرة بأن الزكاة يجب أداؤها فورًا من يوم وجوبها ويحرم تأخيرها مع القدرة لأنها حق للفقراء، ونقلت عن النووي في المجموع (5/333) أن الزكاة تجب على الفور عند الشافعية، فإذا وجبت وتمكن من إخراجها لم يجز تأخيرها، ومن أخر بعد التمكن عصى وصار ضامنًا. وقالت إنه إن لم يتوفر نقد لإخراج الزكاة ولم يمكن إلا التقسيط، وجب إخراجها ولو مقسطة من ثمن البضاعة التي تباع بعد زمن الوجوب، بخصم مقدار معين من غلة كل يوم."
  en: "A question about zakat on a pharmacy with stock but no cash, in which Jordan's General Iftaa Department answered that zakat is due immediately and may not be delayed when one is able to pay; if no cash is available and only instalments are possible, it must be paid, even in instalments, from the price of goods sold after it fell due. The Department answered that zakat must be paid immediately from the day it falls due and may not be delayed when one is able, since it is the right of the poor, quoting al-Nawawi in al-Majmu (5/333) that in the Shafi'i school zakat must be paid at once: once due and payable it may not be delayed, and whoever delays after being able sins and becomes liable. It said that if there is no cash to pay the zakat and instalments are the only possibility, it must still be paid, even in instalments, from the price of goods sold after the due date, by setting aside a fixed amount from each day's takings."
  ur: "اسٹاک والی مگر نقدی سے خالی فارمیسی کی زکوٰۃ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکوٰۃ فوراً واجب ہے اور قدرت کے باوجود اس میں تاخیر حرام ہے؛ اگر نقد نہ ہو اور صرف قسطوں میں ممکن ہو تو وجوب کے بعد بکنے والے سامان کی قیمت سے قسطوں میں ہی سہی، ادا کرنا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ وجوب کے دن سے فوراً ادا کرنا واجب ہے اور قدرت ہوتے ہوئے اس میں تاخیر حرام ہے کیونکہ یہ فقرا کا حق ہے، اور المجموع (5/333) میں نووی سے نقل کیا کہ شافعیہ کے نزدیک زکوٰۃ فوراً واجب ہے؛ واجب ہونے اور ادائیگی ممکن ہونے کے بعد تاخیر جائز نہیں، اور جو قدرت کے بعد تاخیر کرے وہ گناہگار اور ضامن ہے۔ اس نے کہا کہ اگر زکوٰۃ کے لیے نقد نہ ہو اور صرف قسطیں ممکن ہوں تو بھی وجوب کے بعد بکنے والے سامان کی قیمت سے، ہر دن کی آمدنی سے ایک مقررہ رقم الگ کر کے، قسطوں میں ہی سہی، زکوٰۃ ادا کرنا واجب ہے۔"
