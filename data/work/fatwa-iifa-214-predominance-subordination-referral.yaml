label: { ar: "قرار مجمع الفقه الإسلامي الدولي 214 (22/10) بشأن الغلبة والتبعية في المعاملات المالية: حالاتهما وضوابطهما وشروط تحققهما", en: "IIFA resolution 214 (22/10) on predominance and subordination in financial transactions: their cases, controls and conditions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 214 (22/10): مالی معاملات میں غلبہ اور تبعیت — صورتیں، ضوابط اور شرائط" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. بعد اطلاع المجلس على توصيات ندوة علمية حول الغلبة والتبعية في المعاملات المالية عُقدت بجدة ⁦(25–26 صفر 1436هـ، 17–18 ديسمبر 2014م)⁩ ودراسة ما ورد فيها والرجوع إلى قرارات المجمع ذات الصلة ⁦(30 و188 و196)⁩، تبين له أن الموضوع بحاجة إلى التنسيق بين قرارات المجمع ذات الصلة لإعادة صياغة توصيات الندوة، فرأى تكليف أمانة المجمع بتشكيل لجنة علمية من المختصين وعرض ما تتوصل إليه على المجلس في الدورة القادمة. وهو قرار إحالة لا قرار حكم؛ وقد استكمله المجمع لاحقًا بقراره 226 ⁦(23/10)⁩ في دورته الثالثة والعشرين."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). After reviewing the recommendations of a scholarly seminar on predominance and subordination in financial transactions held in Jeddah (25–26 Safar 1436, 17–18 December 2014) and studying them with reference to the Academy's related resolutions (30, 188 and 196), it found the topic needed coordination among its related resolutions to redraft the seminar's recommendations, and resolved to charge the secretariat with forming a scholarly committee of specialists whose findings would be presented to the council at the next session. A referral rather than a ruling; the Academy completed the matter later in resolution 226 (23/10) at its 23rd session."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ جدہ میں مالی معاملات میں غلبہ اور تبعیت کے موضوع پر منعقدہ علمی سیمینار ⁦(25–26 صفر 1436ھ، 17–18 دسمبر 2014ء)⁩ کی سفارشات کا مطالعہ اور اکیڈمی کی متعلقہ قراردادوں ⁦(30، 188 اور 196)⁩ سے موازنہ کے بعد، اکیڈمی نے پایا کہ موضوع کو متعلقہ قراردادوں کے درمیان ہم آہنگی درکار ہے تاکہ سیمینار کی سفارشات دوبارہ تحریر کی جا سکیں، اس لیے اس نے اپنے سیکرٹریٹ کو ماہرین کی علمی کمیٹی بنانے کی ذمہ داری دی جس کی تجاویز اگلی مجلس میں پیش کی جائیں گی۔ یہ رجوع کی قرارداد ہے، حکم کی نہیں؛ اکیڈمی نے بعد میں تیس ویں مجلس میں قرارداد 226 ⁦(23/10)⁩ کے ساتھ معاملہ مکمل کیا۔"
