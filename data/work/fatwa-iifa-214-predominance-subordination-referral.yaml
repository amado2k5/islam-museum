label: { ar: "قرار مجمع الفقه الإسلامي الدولي 214 (22/10) بشأن الغلبة والتبعية في المعاملات المالية: حالاتهما وضوابطهما وشروط تحققهما", en: "IIFA resolution 214 (22/10) on predominance and subordination in financial transactions: their cases, controls and conditions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 214 (22/10): مالی معاملات میں غلبہ اور تبعیت — صورتیں، ضوابط اور شرائط", es: "Resolución 214 (22/10) de la IIFA sobre predominio y subordinación en las operaciones financieras: sus casos, controles y condiciones.", fr: "Résolution 214 (22/10) de l'IIFA sur la prédominance et la subordination dans les transactions financières: leurs cas, leurs contrôles et leurs conditions", tr: "Uluslararası İslami Fiqh Akademisi Kararı 214 (22/10) Finansal İşlemlerde Üstünlük ve Tabi Durum: Davaları, Kontrolleri ve Gerçekleşme Koşulları", id: "Keputusan International Islamic Fiqh Academy 214 (22/10) tentang Preponderance dan Subordinasi dalam Transaksi Keuangan: Kasus, Kontrol, dan Kondisi untuk Realisasi" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. بعد اطلاع المجلس على توصيات ندوة علمية حول الغلبة والتبعية في المعاملات المالية عُقدت بجدة ⁦(25–26 صفر 1436هـ، 17–18 ديسمبر 2014م)⁩ ودراسة ما ورد فيها والرجوع إلى قرارات المجمع ذات الصلة ⁦(30 و188 و196)⁩، تبين له أن الموضوع بحاجة إلى التنسيق بين قرارات المجمع ذات الصلة لإعادة صياغة توصيات الندوة، فرأى تكليف أمانة المجمع بتشكيل لجنة علمية من المختصين وعرض ما تتوصل إليه على المجلس في الدورة القادمة. وهو قرار إحالة لا قرار حكم؛ وقد استكمله المجمع لاحقًا بقراره 226 ⁦(23/10)⁩ في دورته الثالثة والعشرين."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). After reviewing the recommendations of a scholarly seminar on predominance and subordination in financial transactions held in Jeddah (25–26 Safar 1436, 17–18 December 2014) and studying them with reference to the Academy's related resolutions (30, 188 and 196), it found the topic needed coordination among its related resolutions to redraft the seminar's recommendations, and resolved to charge the secretariat with forming a scholarly committee of specialists whose findings would be presented to the council at the next session. A referral rather than a ruling; the Academy completed the matter later in resolution 226 (23/10) at its 23rd session."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ جدہ میں مالی معاملات میں غلبہ اور تبعیت کے موضوع پر منعقدہ علمی سیمینار ⁦(25–26 صفر 1436ھ، 17–18 دسمبر 2014ء)⁩ کی سفارشات کا مطالعہ اور اکیڈمی کی متعلقہ قراردادوں ⁦(30، 188 اور 196)⁩ سے موازنہ کے بعد، اکیڈمی نے پایا کہ موضوع کو متعلقہ قراردادوں کے درمیان ہم آہنگی درکار ہے تاکہ سیمینار کی سفارشات دوبارہ تحریر کی جا سکیں، اس لیے اس نے اپنے سیکرٹریٹ کو ماہرین کی علمی کمیٹی بنانے کی ذمہ داری دی جس کی تجاویز اگلی مجلس میں پیش کی جائیں گی۔ یہ رجوع کی قرارداد ہے، حکم کی نہیں؛ اکیڈمی نے بعد میں تیس ویں مجلس میں قرارداد 226 ⁦(23/10)⁩ کے ساتھ معاملہ مکمل کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). Tras revisar las recomendaciones de un seminario académico sobre predominio y subordinación en transacciones financieras celebrado en Yeda (25-26 de Safar de 1436, 17-18 de diciembre de 2014) y estudiarlas en relación con las resoluciones pertinentes de la Academia (30, 188 y 196), se consideró que el tema requería coordinación entre sus resoluciones pertinentes para reformular las recomendaciones del seminario, y se resolvió encomendar a la secretaría la formación de un comité académico de especialistas cuyas conclusiones se presentarían al consejo en la siguiente sesión. Se trató de una remisión más que de una resolución; la Academia concluyó el asunto posteriormente en la resolución 226 (23/10) en su 23.ª sesión."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015). Après avoir examiné les recommandations d'un séminaire scientifique sur la prédominance et la subordination dans les transactions financières, tenu à Djeddah (25-26 Safar 1436, soit 17-18 décembre 2014), et les avoir étudiées au regard des résolutions pertinentes de l'Académie (30, 188 et 196), l'Académie a estimé que le sujet nécessitait une coordination entre ses résolutions afin de reformuler les recommandations du séminaire. Elle a donc décidé de charger le secrétariat de constituer un comité scientifique de spécialistes dont les conclusions seraient présentées au Conseil lors de la session suivante. Il s'agissait d'une saisine et non d'une décision; l'Académie a tranché la question ultérieurement dans sa résolution 226 (23/10) lors de sa 23e session."
  tr: "Kuveyt Devleti'ndeki yirmi ikinci oturumunda Uluslararası İslami Fiqh Akademisi'nin toplu kararı (2–5 Jumada al-Akhirah 1436 H, 22–25 Mart 2015). Cidde'de düzenlenen finansal işlemlerde hakimiyet ve itaatkârlık üzerine bilimsel seminerin önerileri incelendikten (25–26 Safar 1436 H, 17–18 Aralık 2014) ve içeriğini gözden geçirip ilgili Akademi kararlarına (30, 188 ve 196) atıfta bulunulduktan sonra, konunun ilgili Akademi kararları arasında koordinasyon gerektirdiği anlaşıldı; bu nedenle, Akademi Sekretaryası'nı uzmanlardan oluşan bilimsel bir komite kurmak ve bulgularını bir sonraki oturumda Konsey'e sunmak üzere görevlendirmeye karar verildi. Bu bir sevk kararıdır, bir karar değil; Meclis daha sonra yirmi üçüncü oturumunda 226 (23/10) sayılı kararıyla bunu tamamlamıştır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015). Setelah meninjau rekomendasi seminar ilmiah tentang dominasi dan subordinasi dalam transaksi keuangan yang diadakan di Jeddah (25–26 Safar 1436 H, 17–18 Desember 2014), serta meninjau isinya dan merujuk pada resolusi Akademi yang relevan (30, 188, dan 196), menjadi jelas bahwa masalah ini memerlukan koordinasi di antara keputusan Akademi terkait untuk menyusun ulang rekomendasi seminar. Oleh karena itu, diputuskan untuk menugaskan Sekretariat Akademi membentuk komite ilmiah spesialis dan menyampaikan temuannya kepada Dewan pada sesi berikutnya. Ini adalah keputusan rujukan, bukan putusan; Majelis kemudian melengkapinya dengan resolusi 226 (23/10) pada sesi kedua puluh tiga."
