label: { ar: "الاستنجاء عند قضاء الحاجة", en: "Washing the passages at every wudu — only after relieving", ur: "ہر وضو پر استنجاء — صرف قضاء حاجت پر" }
summary:
  ar: "سأل سائل هل يجب غسل المخارج عند كل وضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21569 بتاريخ 7 أبريل 2008)⁩ أن أهل العلم اتفقوا على أنه لا يجب الاستنجاء إلا عند قضاء الحاجة من بول أو غائط على ما فصّل الجواب."
  en: "A questioner asked whether the passages must be washed at every wudu. Dr. Salah al-Sawi (fatwa no. 21569, 7 April 2008) answered that the scholars agree istinja is obligatory only on relieving oneself of urine or stool — as the answer details."
  ur: "ہر وضو میں دھونا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21569، 7 اپریل 2008)⁩ کے مطابق اجماع ہے — استنجاء صرف بول یا غائط پر واجب۔"
