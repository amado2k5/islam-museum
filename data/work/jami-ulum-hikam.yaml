summary:
  ar: "شرح الإمام ابن رجب الحنبلي ⁦(ت 795هـ)⁩ على خمسين حديثاً من جوامع الكلم: الستة والعشرين حديثاً التي أملاها ابن الصلاح في مجلس «الأحاديث الكلية»، وما زاد عليها النووي حتى تمت اثنين وأربعين في «الأربعين»، وثمانية أحاديث ألحقها ابن رجب بنفسه فكملت خمسين حديثاً، وسمّى كتابه «جامع العلوم والحكم في شرح خمسين حديثاً من جوامع الكلم»."
  en: "Ibn Rajab al-Hanbali's (d. 795 AH) commentary on fifty hadiths: the twenty-six of Ibn al-Salah's 'al-Ahadith al-Kulliyya', which al-Nawawi brought to forty-two in his 'Arba'un', plus eight hadiths Ibn Rajab added himself to reach fifty, naming it Jami' al-Ulum wal-Hikam."
  es: "Comentario de Ibn Rajab al-Hanbali (m. 795 AH) sobre cincuenta hadices: los veintiséis de 'al-Ahadith al-Kulliyya' de Ibn al-Salah, que al-Nawawi elevó a cuarenta y dos en su 'Arba'un', más ocho hadices que Ibn Rajab agregó él mismo para llegar a cincuenta, denominándolo Jami' al-Ulum wal-Hikam."
  fr: "Le commentaire d'Ibn Rajab al-Hanbali (mort en 795 AH) sur cinquante hadiths: les vingt-six d'Ibn al-Salah 'al-Ahadith al-Kulliyya', qu'al-Nawawi a portés à quarante-deux dans son 'Arba'un', plus huit hadiths qu'Ibn Rajab a ajoutés lui-même pour atteindre cinquante, le nommant Jami' al-Ulum wal-Hikam."
