structure: "خمسون حديثاً مرتبة على ترقيم النووي: 26 حديثاً من «الأحاديث الكلية» لابن الصلاح زاد عليها النووي إلى 42، وألحق ابن رجب ثمانية أحاديث (سمّاها في مقدمته) فتمت خمسين؛ قال ابن رجب إنه لا يتقيد بألفاظ النووي في تراجم الرواة ولا في العزو إلى الكتب (مقدمة المؤلف ص 26–28)."
