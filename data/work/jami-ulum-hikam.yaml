label: { ar: "جامع العلوم والحكم", en: "Jami' al-Ulum wal-Hikam" }
summary:
  ar: "شرح الإمام ابن رجب الحنبلي (ت 795هـ) على خمسين حديثاً من جوامع الكلم: الستة والعشرين حديثاً التي أملاها ابن الصلاح في مجلس «الأحاديث الكلية»، وما زاد عليها النووي حتى تمت اثنين وأربعين في «الأربعين»، وثمانية أحاديث ألحقها ابن رجب بنفسه فكملت خمسين حديثاً، وسمّى كتابه «جامع العلوم والحكم في شرح خمسين حديثاً من جوامع الكلم»."
  en: "Ibn Rajab al-Hanbali's (d. 795 AH) commentary on fifty hadiths: the twenty-six of Ibn al-Salah's 'al-Ahadith al-Kulliyya', which al-Nawawi brought to forty-two in his 'Arba'un', plus eight hadiths Ibn Rajab added himself to reach fifty, naming it Jami' al-Ulum wal-Hikam."
