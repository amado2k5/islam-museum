id: work/fatwa-amja-iman-increase-decrease
class: work
kind: fatwa
label: { ar: "هل يزيد الإيمان وينقص بالعمل", en: "Does iman increase and decrease with deeds", ur: "کیا ایمان اعمال سے بڑھتا گھٹتا ہے", es: "¿Aumenta o disminuye la fe con las obras?" }
summary:
  ar: "سأل سائل هل الإيمان الذي يزيد وينقص بالطاعة والمعصية هو إيمان القلب والتصديق والمعرفة أم أن أعمال الجوارح هي التي تزيد وتنقص. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83183 بتاريخ 24 نوفمبر 2010)⁩ أن أعمال القلوب تتفاوت نقصًا وزيادة كما تتفاوت أعمال الجوارح، فتصديق النبيين ليس كتصديق من سواهم وتصديق من شاهد المعجزات من الصحابة ليس كتصديق من نُقل إليه، وإخبات النبيين ومحبتهم ليس كإخبات من سواهم، وهذا بدهي في سائر الأمور المعنوية كتفاوت الذكاء والشجاعة والمروءة."
  en: "A questioner asked whether the iman that increases with obedience and decreases with sin is the heart's assent and knowledge, or whether it is the limbs' deeds that grow and shrink. Dr. Salah al-Sawi (fatwa no. 83183, 24 November 2010) answered that the heart's works vary in decrease and increase just as the limbs' works do: the prophets' assent is not like others', the assent of Companions who saw the miracles is not like that of those told later, and the prophets' humble devotion and love is not like others' — as self-evident in all intangible things like intelligence, courage and nobility."
  ur: "ایک سائل نے پوچھا کہ بڑھنے گھٹنے والا ایمان دل کا تصدیق ہے یا جوارح کے اعمال۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83183، 24 نومبر 2010)⁩ کے مطابق دل کے اعمال بھی اعضاء کے اعمال کی طرح بڑھتے گھٹتے ہیں — انبیا کا تصدیق دوسروں جیسا نہیں۔"
  es: "Un interlocutor preguntó si la fe que aumenta con la obediencia y disminuye con el pecado es el asentimiento y el conocimiento del corazón, o si son las obras de los miembros las que crecen y se reducen. El Dr. Salah al-Sawi (fatwa n.º 83183, 24 de noviembre de 2010) respondió que las obras del corazón varían en disminución y aumento, al igual que las obras de los miembros: el asentimiento de los profetas no es como el de los demás, el asentimiento de los Compañeros que vieron los milagros no es como el de aquellos a quienes se les habló después, y la humilde devoción y el amor de los profetas no son como los de los demás, como se evidencia en todas las cosas intangibles como la inteligencia, el coraje y la nobleza."
