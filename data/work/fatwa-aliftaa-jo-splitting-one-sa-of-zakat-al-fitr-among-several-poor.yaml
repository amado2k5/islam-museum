id: work/fatwa-aliftaa-jo-splitting-one-sa-of-zakat-al-fitr-among-several-poor
class: work
kind: fatwa
label: { ar: "تقسيم صاع زكاة الفطر على أكثر من فقير", en: "Dividing one sa' of zakat al-fitr among several poor people", ur: "صدقۂ فطر کا ایک صاع کئی فقیروں میں تقسیم کرنا" }
summary:
  ar: "سؤال عن تقسيم صاع زكاة الفطر على أكثر من فقير، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز توزيع الصاع أو قيمته على أكثر من فقير، لأن عدد الآخذين منه غير مقدّر. أجابت الدائرة بأن زكاة الفطر مقدّرة بصاع عن كل شخص، لكن لم يُقدّر عدد من يعطون من هذا الصاع. وخلصت إلى أنه يجوز أن يوزع الصاع على أكثر من فقير."
  en: "A question about dividing one sa' of zakat al-fitr among several poor people, in which Jordan's General Iftaa Department answered that the sa' or its value may be divided among several poor people, because the number of recipients is not fixed. The Department answered that zakat al-fitr is fixed at one sa' per person, but the number of people who may receive that sa' is not fixed. It concluded that the sa' may be distributed among more than one poor person."
  ur: "صدقۂ فطر کا ایک صاع کئی فقیروں میں تقسیم کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ صاع یا اس کی قیمت کئی فقیروں میں تقسیم کی جا سکتی ہے، کیونکہ لینے والوں کی تعداد مقرر نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ صدقۂ فطر فی کس ایک صاع مقرر ہے، لیکن اس صاع کو لینے والوں کی تعداد مقرر نہیں کی گئی۔ اس نے نتیجہ نکالا کہ ایک صاع کو ایک سے زیادہ فقیروں میں تقسیم کیا جا سکتا ہے۔"
