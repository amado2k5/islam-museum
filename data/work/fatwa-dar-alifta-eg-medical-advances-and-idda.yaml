label: { ar: "أثر المستجدات الطبية على عدة الطلاق أو الوفاة", en: "The effect of modern medical advances on the 'idda", ur: "جدید طبی ترقی کا عدت پر اثر", es: "El efecto de los avances médicos modernos en el 'idda", fr: "L'effet des progrès médicaux modernes sur les 'idda" }
summary:
  ar: "سائل سأل عن أثر المستجدات الطبية على عدة الطلاق أو الوفاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21701)⁩ أن العدة شرعت لمعان وحكم متعددة كاستبراء الرحم والتفجع على الفرقة ومنع اختلاط الأنساب وإتاحة الفرصة فبيّن الجواب مدى تأثير الطب الحديث فيها على وجهه."
  en: "A questioner asked about the effect of modern medical advances on the waiting period after divorce or widowhood. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21701) answered that 'idda was legislated for multiple meanings and wisdoms — confirming the womb's emptiness, grieving the separation, preventing mixed lineages, leaving room for reconciliation — and the answer sets out how far modern medicine bears on it."
  ur: "ایک سائل نے جدید طبی ترقی کا طلاق یا بیوگی کی عدت پر اثر پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21701)⁩ نے جواب دیا کہ عدت کئی حکمتوں کے لیے مقرر ہے — رحم کی تصدیق، فراق پر غم، نسبوں کے اختلاط سے بچاؤ، صلح کا موقع — اور جواب میں جدید طب کے اثر کی تفصیل بیان ہوئی۔"
  es: "Una persona preguntó sobre el efecto de los avances médicos modernos en el período de espera tras el divorcio o la viudez. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21701) respondió que el 'idda se legisló con múltiples significados y propósitos: confirmar el vacío del útero, lamentar la separación, prevenir la mezcla de linajes y dejar espacio para la reconciliación. La respuesta explica hasta qué punto la medicina moderna influye en este período."
  fr: "Une personne a posé une question sur l'influence des progrès de la médecine moderne sur la période d'attente après un divorce ou un veuvage. La Dar al-Ifta égyptienne (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 21701) a répondu que la 'idda avait été prescrite pour de multiples raisons: confirmer la vacance de l'utérus, faire le deuil de la séparation, prévenir les unions mixtes, et laisser place à la réconciliation. La réponse expose également l'impact de la médecine moderne sur cette période."
