summary:
  ar: "سائل سأل عن أثر المستجدات الطبية على عدة الطلاق أو الوفاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21701)⁩ أن العدة شرعت لمعان وحكم متعددة كاستبراء الرحم والتفجع على الفرقة ومنع اختلاط الأنساب وإتاحة الفرصة فبيّن الجواب مدى تأثير الطب الحديث فيها على وجهه."
  en: "A questioner asked about the effect of modern medical advances on the waiting period after divorce or widowhood. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21701) answered that 'idda was legislated for multiple meanings and wisdoms — confirming the womb's emptiness, grieving the separation, preventing mixed lineages, leaving room for reconciliation — and the answer sets out how far modern medicine bears on it."
  ur: "ایک سائل نے جدید طبی ترقی کا طلاق یا بیوگی کی عدت پر اثر پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21701)⁩ نے جواب دیا کہ عدت کئی حکمتوں کے لیے مقرر ہے — رحم کی تصدیق، فراق پر غم، نسبوں کے اختلاط سے بچاؤ، صلح کا موقع — اور جواب میں جدید طب کے اثر کی تفصیل بیان ہوئی۔"
