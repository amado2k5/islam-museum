id: work/fatwa-dar-alifta-eg-ai-in-stock-market
class: work
kind: fatwa
label: { ar: "حكم استخدام الذكاء الاصطناعي في البورصة", en: "Using artificial intelligence in the stock market", ur: "اسٹاک مارکیٹ میں مصنوعی ذہانت کا استعمال", es: "Uso de la inteligencia artificial en el mercado de valores.", fr: "Utilisation de l'intelligence artificielle sur le marché boursier" }
summary:
  ar: "سائل سأل عن استخدام الذكاء الاصطناعي في البورصة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23884)⁩ أنه يجوز استعمال الذكاء الاصطناعي في سوق المال، والاشتراك بإحدى الشركات المالية التي تطوّر نظام ذكاء اصطناعي يتخذ قرارات التداول، بشرط خلوّه من المخالفات الشرعية على ما فصّل الجواب."
  en: "A questioner asked about using artificial intelligence in the stock market. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23884) answered that AI may lawfully be used in the money market, including subscribing to a financial company developing an AI system that takes trading decisions — provided it is free of sharia violations, as the answer details."
  ur: "ایک سائل نے اسٹاک مارکیٹ میں مصنوعی ذہانت استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23884)⁩ نے جواب دیا کہ مالی بازار میں اے آئی استعمال کرنا جائز ہے، بشمول ایسی کمپنی کے ساتھ شرکت جو تجارتی فیصلے لینے والا اے آئی نظام تیار کرتی ہو — بشرطیکہ اس میں شرعی مخالفت نہ ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre el uso de la inteligencia artificial en el mercado de valores. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23884) respondió que la IA puede utilizarse legalmente en el mercado monetario, incluyendo la suscripción a una empresa financiera que desarrolle un sistema de IA para la toma de decisiones de inversión, siempre y cuando no infrinja la sharia, como se detalla en la respuesta."
  fr: "Un internaute a posé une question sur l'utilisation de l'intelligence artificielle en bourse. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23884) a répondu que l'IA peut être utilisée licitement sur le marché monétaire, y compris par le biais d'un abonnement à une société financière développant un système d'IA prenant des décisions de trading, à condition que ce système soit conforme à la charia, comme le précise la réponse."
