label: { ar: "شذرات الذهب في أخبار من ذهب", en: "Shadharat al-Dhahab fi Akhbar man Dhahab", ur: "شذرات الذہب فی اخبار من ذہب" }
summary:
  ar: "تاريخ حولي لابن العماد الحنبلي ⁦(ت ١٠٨٩هـ)⁩ يسرد الأخبار سنة سنة مع تراجم من توفوا في كل سنة؛ الجزء الثالث المقروء منه يبدأ بسنة ٣٥٠هـ {cite:shadharat-dhahab vol. 3 p. 9} {cite:shadharat-dhahab vol. 3 p. 10}."
  en: "Ibn al-Imad al-Hanbali's (d. 1089 AH) annalistic history, which gives events year by year with the obituaries of the year's dead; the third volume read here opens with the year 350 AH {cite:shadharat-dhahab vol. 3 p. 9} {cite:shadharat-dhahab vol. 3 p. 10}."
  ur: "ابن العماد الحنبلی ⁦(م ١٠٨٩ھ)⁩ کی سالانہ تاریخ، جو ہر سال کے واقعات اور اس سال وفات پانے والوں کے تذکرے ایک ایک سال کر کے بیان کرتی ہے؛ یہاں پڑھی گئی تیسری جلد سنہ ۳۵۰ھ سے شروع ہوتی ہے {cite:shadharat-dhahab vol. 3 p. 9} {cite:shadharat-dhahab vol. 3 p. 10}۔"
  es: "La historia analística de Ibn al-Imad al-Hanbali (m. 1089 AH), que presenta los acontecimientos año por año con los obituarios de los fallecidos del año; el tercer volumen que se lee aquí comienza con el año 350 AH {cite:shadharat-dhahab vol. 3 p. 9} {cite:shadharat-dhahab vol. 3 p. 10}."
  fr: "L'histoire annalistique d'Ibn al-Imad al-Hanbali (mort en 1089 AH), qui relate les événements année par année avec les nécrologies des morts de l'année; le troisième volume lu ici s'ouvre sur l'année 350 AH {cite:shadharat-dhahab vol. 3 p. 9} {cite:shadharat-dhahab vol. 3 p. 10}."
