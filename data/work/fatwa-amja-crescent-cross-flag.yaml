label: { ar: "رفع شعار الهلال مع الصليب للوحدة الوطنية", en: "Raising the crescent with the cross for national unity", ur: "قومی یکجہتی کے لیے ہلال اور صلیب کا مشترک نشان", es: "Izando la media luna con la cruz por la unidad nacional." }
summary:
  ar: "سأل سائل عن حكم رفع شعار الهلال مع الصليب للوحدة الوطنية في بلاد يعيش بها مسلمون ومسيحيون. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83460 بتاريخ 3 يناير 2011)⁩ أن الصليب شعار نصراني يرفعه أهل ملتهم وقد أمروا بإقرارهم وما يدينون، لكن المسلم يدين بأن قضية الصلب باطلة للآية، فلا يتسنى له رفع شعار يعتقد بطلانه، ولا يقدح هذا في وجوب تلاحم أبناء الوطن الواحد وتكاتفهم ضد الاختراق الأمني والاحتقان الطائفي، ويمكن أن يرفع الطرفان علم الدولة التي تظلهم جميعًا."
  en: "A questioner asked about raising a crescent-with-cross emblem for national unity in lands where Muslims and Christians live together. Dr. Salah al-Sawi (fatwa no. 83460, 3 January 2011) answered that the cross is a Christian emblem its people may raise — Muslims being commanded to leave them and their creed be — but the Muslim holds the crucifixion claim false by the verse, so he cannot raise an emblem he believes void; that does not detract from the duty of national solidarity against security breaches and sectarian tension, and the two groups may fly the flag of the state sheltering them all. Recorded as AMJA's answer."
  ur: "ایک سائل نے مسلم مسیحی رہنے والے ملک میں قومی یکجہتی کے لیے ہلال و صلیب والا نشان اٹھانے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83460، 3 جنوری 2011)⁩ کے مطابق مسلمان اس نشان کو نہیں اٹھا سکتا جسے وہ باطل مانتا ہے؛ البتہ قومی یکجہتی اور مشترک پرچم جائز ہے۔"
  es: "Un interlocutor preguntó sobre la posibilidad de izar un emblema de media luna con cruz para la unidad nacional en tierras donde conviven musulmanes y cristianos. El Dr. Salah al-Sawi (fatwa n.º 83460, 3 de enero de 2011) respondió que la cruz es un emblema cristiano que sus seguidores pueden izar —ya que se ordena a los musulmanes que no la usen y que respeten su credo—, pero el musulmán considera falsa la afirmación de la crucifixión según el versículo, por lo que no puede izar un emblema que cree nulo; esto no menoscaba el deber de solidaridad nacional contra las violaciones de seguridad y las tensiones sectarias, y ambos grupos pueden enarbolar la bandera del Estado que los acoge a todos. Registrada como respuesta de AMJA."
