label: { ar: "الواجب على من رأى الصائم يأكل أو يشرب ناسيًا", en: "The duty of one who sees a fasting person eat or drink forgetfully", ur: "اس شخص کا فرض جو بھول کر کھاتا پیتا روزہ دار دیکھے" }
summary:
  ar: "سائل سأل: ما الواجب على من رأى صائمًا يأكل أو يشرب ناسيًا في نهار رمضان؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22485)⁩ أنه يستحب لمن رأى ذلك أن يذكّره بالصيام، فهو من باب التعاون على البر والتقوى على ما فصّل الجواب."
  en: "A questioner asked the duty of one who sees a fasting person eat or drink forgetfully in Ramadan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22485) answered that it is recommended for the onlooker to remind him of the fast, that being a matter of cooperating in righteousness and piety — as the answer details."
  ur: "ایک سائل نے پوچھا کہ جو شخص رمضان میں کسی روزہ دار کو بھول کر کھاتا پیتا دیکھے اس پر کیا لازم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22485)⁩ نے جواب دیا کہ دیکھنے والے کے لیے مستحب ہے کہ اسے روزے کی یاد دلائے کیونکہ یہ نیکی اور پرہیزگاری میں تعاون ہے — جیسا کہ جواب میں تفصیل ہے۔"
