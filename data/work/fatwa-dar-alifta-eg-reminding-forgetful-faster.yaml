id: work/fatwa-dar-alifta-eg-reminding-forgetful-faster
class: work
kind: fatwa
label: { ar: "الواجب على من رأى الصائم يأكل أو يشرب ناسيًا", en: "The duty of one who sees a fasting person eat or drink forgetfully", ur: "اس شخص کا فرض جو بھول کر کھاتا پیتا روزہ دار دیکھے", es: "El deber de quien ve a una persona en ayunas comer o beber olvidadamente", fr: "Le devoir de celui qui voit une personne à jeun manger ou boire par inadvertance", tr: "Oruç tutan kişinin unutkanlıkla yemek yiyip içtiğini gören kişinin görevi.", id: "Tugas siapa pun yang melihat orang yang berpuasa makan atau minum dengan lupa." }
summary:
  ar: "سائل سأل: ما الواجب على من رأى صائمًا يأكل أو يشرب ناسيًا في نهار رمضان؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22485)⁩ أنه يستحب لمن رأى ذلك أن يذكّره بالصيام، فهو من باب التعاون على البر والتقوى على ما فصّل الجواب."
  en: "A questioner asked the duty of one who sees a fasting person eat or drink forgetfully in Ramadan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22485) answered that it is recommended for the onlooker to remind him of the fast, that being a matter of cooperating in righteousness and piety — as the answer details."
  ur: "ایک سائل نے پوچھا کہ جو شخص رمضان میں کسی روزہ دار کو بھول کر کھاتا پیتا دیکھے اس پر کیا لازم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22485)⁩ نے جواب دیا کہ دیکھنے والے کے لیے مستحب ہے کہ اسے روزے کی یاد دلائے کیونکہ یہ نیکی اور پرہیزگاری میں تعاون ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó cuál es el deber de quien ve a una persona en ayuno comer o beber sin darse cuenta durante el Ramadán. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22485) respondió que se recomienda que quien observe le recuerde el ayuno, ya que esto es una forma de cooperar en la rectitud y la piedad, como se detalla en la respuesta."
  fr: "Un internaute a demandé quel était le devoir de celui qui voit une personne jeûner manger ou boire par inadvertance pendant le Ramadan. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22485) a répondu qu'il est recommandé au témoin de lui rappeler l'obligation de jeûner, car cela relève de la piété et de la droiture, comme le précise la réponse."
  tr: "Bir soru soran kişi: Ramazan gününde unutkanlıkla yemek yiyip içen bir kişinin yükümlülüğü nedir? Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22485), bunu gören birinin oruç tutmalarını hatırlatmasının önerildiğini, çünkü bunun doğruluk ve dindarlık içinde bir işbirliği biçimi olduğunu yanıtladı."
  id: "Seorang penanya bertanya: Apa kewajiban seseorang yang melihat orang yang berpuasa makan atau minum dengan lupa selama hari Ramadan? Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22485) menjawab bahwa disarankan bagi seseorang yang melihat hal ini untuk mengingatkan mereka untuk berpuasa, karena ini adalah bentuk kerja sama dalam kebenaran dan kesalehan, seperti yang dijelaskan dalam jawaban."
