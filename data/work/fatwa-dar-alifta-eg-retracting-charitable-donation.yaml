id: work/fatwa-dar-alifta-eg-retracting-charitable-donation
class: work
kind: fatwa
label: { ar: "حكم الرجوع في التبرعات الموجهة لبعض المؤسسات الخيرية", en: "Taking back a donation directed to a charity", ur: "کسی خیراتی ادارے کو دیے گئے عطیہ سے رجوع", es: "Recuperar una donación destinada a una organización benéfica", fr: "Reprendre un don destiné à une œuvre de charité" }
summary:
  ar: "سائل سأل عن الرجوع في تبرع وجهه لوكيل ليخرجه نيابة عنه إلى مؤسسة خيرية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21940)⁩ أنه يجوز شرعًا للمتصدق أن يرجع في صدقة النافلة التي أعطاها وكيله ليخرجها نيابة عنه قبل أن يقبضها المستحق على ما فصّل الجواب."
  en: "A questioner asked about taking back a donation he gave an agent to pay out to a charity on his behalf. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21940) answered that the giver may retract voluntary charity handed to his agent for disbursement before the entitled party takes possession of it — as the answer details."
  ur: "ایک سائل نے اپنے اس عطیے سے رجوع کا حکم پوچھا جو اس نے وکیل کو دیا کہ وہ کسی خیراتی ادارے کو اس کی طرف سے ادا کرے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21940)⁩ نے جواب دیا کہ مستحق کے قبضے سے پہلے نفلی صدقہ سے رجوع جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de recuperar una donación que le había entregado a un agente para que la entregara a una organización benéfica en su nombre. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21940) respondió que el donante puede retractarse de la donación voluntaria entregada a su agente para su distribución antes de que la parte beneficiaria la reciba, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il pouvait retirer un don qu'il avait confié à un mandataire pour le verser à une œuvre caritative en son nom. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21940) a répondu que le donateur pouvait retirer le don volontaire remis à son mandataire avant que le bénéficiaire n'en prenne possession, comme le précise la réponse."
