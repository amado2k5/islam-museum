id: work/fatwa-dar-alifta-eg-eating-all-udhiyya-without-giving
class: work
kind: fatwa
label: { ar: "حكم انتفاع المضحي بالأضحية كلها دون أن يعطي شيئًا منها للفقراء", en: "The sacrificer keeping the whole udhiyya without giving the poor", ur: "قربانی ساری خود رکھنا اور غریبوں کو نہ دینا", es: "El sacrificador se queda con todo el udhiyya sin dárselo a los pobres.", fr: "Le sacrificateur conserve l'intégralité de l'udhiyya sans la donner aux pauvres", tr: "Kurbanın tüm fedakarlıktan faydalanıp fakirlere hiçbir şey vermemesi hakkındaki karar", id: "Putusan tentang pengorbanan yang mendapat manfaat dari seluruh pengorbanan tanpa memberikan satu pun kepada orang miskin" }
summary:
  ar: "سائل سأل عن انتفاع المضحي بالأضحية كلها دون أن يعطي شيئًا منها للفقراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20756)⁩ أن الأضحية سنة مؤكدة والمشروع فيها أن يجمع الشخص بين الأكل والتصدق والادخار ويكره أكلها كلها على ما فصّل الجواب."
  en: "A questioner asked about the sacrificer keeping the whole udhiyya and giving the poor nothing. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20756) answered that the sacrifice is an emphatic sunna; the practice joins eating, giving in charity and saving, and eating it all is disliked — as the answer details."
  ur: "ایک سائل نے قربانی ساری خود رکھنے اور غریبوں کو نہ دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20756)⁩ نے جواب دیا کہ قربانی مؤکد سنت ہے؛ مشروع یہ ہے کہ کھانا صدقہ اور ذخیرہ تینوں ہوں اور ساری کھانا مکروہ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre el hecho de que el sacrificador se quedara con toda la udhiyya y no diera nada a los pobres. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20756) respondió que el sacrificio es una sunna enfática; la práctica combina comer, dar en caridad y ahorrar, y comerse todo es desaconsejable, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le fait que le sacrificateur conserve l'intégralité de l'udhiyya sans rien donner aux pauvres. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20756) a répondu que le sacrifice est une sunna formelle; cette pratique associe le fait de manger, de faire l'aumône et d'épargner, et il est déconseillé de tout consommer, comme le précise la réponse."
  tr: "Bir soru soran, tüm kurbanı feda eden kişinin fakirlere hiçbir fedakarlık vermeden fayda görüp görmediğini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20756), kurbanın kesin bir sünnet olduğunu ve bir kişinin yemek, sadaka ve tasarrufu birleştirmek için reçete edildiğini ve hepsini yemekten hoşlanmaması gerektiğini söyledi, bu da cevapta açıklanmıştır."
  id: "Seorang penanya bertanya apakah orang yang mengorbankan seluruh korban mendapat manfaat tanpa memberikan sama sekali kepada orang miskin. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20756) menjawab bahwa korban adalah Sunnah yang dikonfirmasi, dan diwajibkan seseorang untuk menggabungkan makan, amal, dan menabung, serta tidak suka makan semuanya, seperti yang dijelaskan dalam jawaban."
