label: { ar: "بيتا أمامة المزيرية في قتل أبي عفك", en: "Umama al-Muzayriyya's two verses on the killing of Abu Afak", es: "Los dos versos de Umama al-Muzayriyya sobre el asesinato de Abu Afak", fr: "Les deux versets d'Umama al-Muzayriyya sur le meurtre d'Abu Afak" }
summary:
  ar: "بيتان على الطويل تخاطب فيهما أمامة أبا عفك: أنت تكذّب دين الله والمرء أحمد، لعمر الذي أمناك بئس ما يمني؛ حباك حنيف آخر الليل طعنة، أبا عفك خذها على كبر السن."
  en: "Two verses in which Umama addresses Abu Afak: you call God's religion and the man Ahmad a lie; by the life of him who fathered you, an evil issue; a true believer granted you a thrust at night's end: Abu Afak, take it in your old age."
  es: "Dos versículos en los que Umama se dirige a Abu Afak: llamas mentira a la religión de Dios y al hombre Ahmad; por la vida de quien te engendró, un producto maligno; un verdadero creyente te concedió una estocada al final de la noche: Abu Afak, acéptala en tu vejez."
  fr: "Deux versets dans lesquels Umama s'adresse à Abu Afak: tu traites de mensonge la religion de Dieu et l'homme Ahmad; par la vie de celui qui t'a engendré, tu es une mauvaise descendance; un vrai croyant t'a accordé une poussée à la fin de la nuit: Abu Afak, reçois-la dans ta vieillesse."
