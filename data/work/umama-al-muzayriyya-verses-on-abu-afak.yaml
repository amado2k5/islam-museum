  ar: "بيتان على الطويل تخاطب فيهما أمامة أبا عفك: أنت تكذّب دين الله والمرء أحمد، لعمر الذي أمناك بئس ما يمني؛ حباك حنيف آخر الليل طعنة، أبا عفك خذها على كبر السن."
  en: "Two verses in which Umama addresses Abu Afak: you call God's religion and the man Ahmad a lie; by the life of him who fathered you, an evil issue; a true believer granted you a thrust at night's end: Abu Afak, take it in your old age."
