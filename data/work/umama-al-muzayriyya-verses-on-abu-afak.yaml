class: work
kind: poem
label: { ar: "بيتا أمامة المزيرية في قتل أبي عفك", en: "Umama al-Muzayriyya's two verses on the killing of Abu Afak", es: "Los dos versos de Umama al-Muzayriyya sobre el asesinato de Abu Afak", fr: "Les deux versets d'Umama al-Muzayriyya sur le meurtre d'Abu Afak", ur: "ابو عفک کے قتل پر امہات المزائریہ کی دو آیات", tr: "İmam El-Muziriyya'nın evi Ebu Afak'ı öldürmekte", id: "Rumah Imamah Al-Muziriyya dalam pembunuhan Abu Afak" }
summary:
  ar: "بيتان على الطويل تخاطب فيهما أمامة أبا عفك: أنت تكذّب دين الله والمرء أحمد، لعمر الذي أمناك بئس ما يمني؛ حباك حنيف آخر الليل طعنة، أبا عفك خذها على كبر السن."
  en: "Two verses in which Umama addresses Abu Afak: you call God's religion and the man Ahmad a lie; by the life of him who fathered you, an evil issue; a true believer granted you a thrust at night's end: Abu Afak, take it in your old age."
  es: "Dos versículos en los que Umama se dirige a Abu Afak: llamas mentira a la religión de Dios y al hombre Ahmad; por la vida de quien te engendró, un producto maligno; un verdadero creyente te concedió una estocada al final de la noche: Abu Afak, acéptala en tu vejez."
  fr: "Deux versets dans lesquels Umama s'adresse à Abu Afak: tu traites de mensonge la religion de Dieu et l'homme Ahmad; par la vie de celui qui t'a engendré, tu es une mauvaise descendance; un vrai croyant t'a accordé une poussée à la fin de la nuit: Abu Afak, reçois-la dans ta vieillesse."
  ur: "دو آیات جن میں امامہ نے ابو آفاق کو مخاطب کیا: تم خدا کے دین کو اور احمد کو جھوٹ کہتے ہو۔ اس کی زندگی کی قسم جس نے آپ کو جنم دیا، ایک برا مسئلہ۔ ایک سچے مومن نے آپ کو رات کے آخر میں ایک زور دیا: ابو آفاق، اسے اپنے بڑھاپے میں لے لو۔"
  tr: "İmam Ebu Afak'ın hitap ettiği uzun ayete iki ayet: Allah'ın dinini inkâr ediyorsun ve kişi Ahmed'dir, çünkü sana güvenen Ömer ne kadar kötü; Hanif seni gece geç saatlerde bıçakladı, Ebu Afak, bunu yaşlılığın için kabul et."
  id: "Dua ayat dari yang panjang di mana Imamah Abu Afak berkata: Kamu menyangkal agama Allah dan orangnya adalah Ahmad, karena Umar yang telah mempercayaimu, betapa malangnya apa yang aku percayai; Hanif menusukmu larut malam, Abu Afak, anggap itu sebagai usiamu."
