id: work/fatwa-dar-alifta-eg-swimming-while-fasting
class: work
kind: fatwa
label: { ar: "مدى تأثير نزول حمام السباحة على الصوم", en: "Does entering a swimming pool affect the fast?", ur: "تندوری تالاب میں اترنے کا روزے پر اثر", es: "¿Afecta entrar en una piscina al ayuno?", fr: "L'entrée dans une piscine a-t-elle un impact sur le jeûne ?" }
summary:
  ar: "سائل سأل عن أثر نزول حمام السباحة على الصوم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22520)⁩ أن نزول حمام السباحة أثناء الصيام لا يؤثر في صحة الصوم ما لم يصل الماء إلى جوف الصائم قصدًا أو غير قصد على ما فصّل الجواب."
  en: "A questioner asked the effect of entering a swimming pool on the fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22520) answered that entering a swimming pool while fasting does not affect the validity of the fast, so long as the water does not reach the fasting person's interior, deliberately or not — as the answer details."
  ur: "ایک سائل نے تندور کے تالاب میں اترنے کے روزے پر اثر پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22520)⁩ نے جواب دیا کہ روزے میں تالاب میں اترنا روزے کی صحت پر اثر نہیں ڈالتا جب تک پانی روزہ دار کے جوف تک نہ پہنچے، عمداً یا غیر عمداً — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el efecto de entrar en una piscina en el ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22520) respondió que entrar en una piscina durante el ayuno no afecta la validez del mismo, siempre y cuando el agua no llegue al interior de la persona que ayuna, ya sea de forma deliberada o no, como se detalla en la respuesta."
  fr: "Une personne a demandé si l'entrée dans une piscine avait une incidence sur le jeûne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22520) a répondu que l'entrée dans une piscine pendant le jeûne n'en affecte pas la validité, tant que l'eau n'atteint pas l'intérieur du corps du jeûneur, que ce soit intentionnellement ou non – comme le précise la réponse."
