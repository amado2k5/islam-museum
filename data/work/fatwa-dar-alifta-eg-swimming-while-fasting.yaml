label: { ar: "مدى تأثير نزول حمام السباحة على الصوم", en: "Does entering a swimming pool affect the fast?", ur: "تندوری تالاب میں اترنے کا روزے پر اثر" }
summary:
  ar: "سائل سأل عن أثر نزول حمام السباحة على الصوم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22520)⁩ أن نزول حمام السباحة أثناء الصيام لا يؤثر في صحة الصوم ما لم يصل الماء إلى جوف الصائم قصدًا أو غير قصد على ما فصّل الجواب."
  en: "A questioner asked the effect of entering a swimming pool on the fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22520) answered that entering a swimming pool while fasting does not affect the validity of the fast, so long as the water does not reach the fasting person's interior, deliberately or not — as the answer details."
  ur: "ایک سائل نے تندور کے تالاب میں اترنے کے روزے پر اثر پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22520)⁩ نے جواب دیا کہ روزے میں تالاب میں اترنا روزے کی صحت پر اثر نہیں ڈالتا جب تک پانی روزہ دار کے جوف تک نہ پہنچے، عمداً یا غیر عمداً — جیسا کہ جواب میں تفصیل ہے۔"
