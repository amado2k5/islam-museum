id: work/fatwa-aliftaa-jo-bone-grafts-from-human-or-animal-sources
class: work
kind: fatwa
label: { ar: "العظام والأنسجة المستخرجة من إنسان ميت أو من حيوان في زراعة الأسنان", en: "Bone and tissue grafts from a dead human or an animal in dental implants", ur: "دانتوں کی پیوند کاری میں مردہ انسان یا جانور سے حاصل ہڈی اور بافتیں", es: "Injertos de hueso y tejido procedentes de un ser humano o un animal fallecido en implantes dentales.", fr: "Greffes osseuses et tissulaires provenant d'un être humain ou animal décédé pour les implants dentaires" }
summary:
  ar: "سؤال عن استخدام عظام وأنسجة مستخرجة من إنسان ميت أو من الأبقار أو الخنزير في زراعة الأسنان وعلاج اللثة، أجابت فيه دائرة الإفتاء العام الأردنية بأن التداوي بالنجس وبأجزاء الآدمي الميت يجوز إذا انعدم البديل، ولا يجوز مع وجوده، ولا فرق بين مريض مسلم وغير مسلم. أجابت الدائرة بأن الإسلام شرع التداوي، واستشهدت بحديث رواه أبو داود في الأمر بالتداوي، ونقلت قول باعشن في بشرى الكريم إن التداوي يسن مع الاعتماد على الله. وقالت إن الأصل عند الفقهاء حرمة التداوي بالنجاسة، وإنهم أجازوه استثناءً عند الحاجة، في غير الخمر الخالصة، بشرط ألا يوجد بديل طاهر، ونقلت قول زكريا الأنصاري في أسنى المطالب بجواز التداوي بنجس غير مسكر عند فقد الطاهر، وقالت إن ما خالطه نجس أولى بالجواز. وذكرت أن الفقهاء اتفقوا على حرمة التداوي بأجزاء الآدمي الميت عند وجود بديل ولو كان نجسًا، وأن الشافعية أجازوه عند انعدام البديل، ونقلت قول عبد الحميد الشرواني في حواشيه على تحفة المحتاج باحتمال جواز الجبر بعظم الآدمي الميت إذا لم يوجد غيره. وخلصت إلى أنه لا حرج في التداوي بالنجس غير الخمر الخالصة إذا انعدم البديل، ولا يجوز إن وُجد، وأنه يجوز التداوي بأجزاء الآدمي الميت إذا لم يوجد بديل ولو نجس، ولا فرق في ذلك بين المريض المسلم وغير المسلم."
  en: "A question about using bone and tissue taken from a dead human, from cattle or from pigs in dental implants and gum treatment, in which Jordan's General Iftaa Department answered that treatment with impure substances and with parts of a dead human is permitted when there is no alternative, not when one exists, and that it makes no difference whether the patient is Muslim or not. The Department answered that Islam legislated seeking medical treatment, citing a hadith reported by Abu Dawud commanding treatment, and quoting Ba'ishn in Bushra al-Karim that treatment is recommended alongside reliance on God. It said the established principle among jurists is that treatment with impure substances is forbidden, but that they allowed it by exception when needed, other than pure wine, on condition that no pure alternative exists, quoting Zakariyya al-Ansari in Asna al-Matalib that treatment with an impure, non-intoxicating substance is permitted when a pure one is lacking; it added that something merely containing an impure element is all the more permitted. It said jurists agree that treatment with parts of a dead human is forbidden when any alternative exists, even an impure one, while the Shafi'is allowed it when there is no alternative, quoting Abd al-Hamid al-Shirwani in his glosses on Tuhfat al-Muhtaj that setting a bone with a dead human's bone may be permitted if nothing else suitable is found. It concluded that there is no objection to treatment with impure substances, other than pure wine, when there is no alternative, but not when one exists; that treatment with parts of a dead human is permitted when no alternative, even an impure one, is available; and that there is no difference between a Muslim and a non-Muslim patient."
  ur: "دانتوں کی پیوند کاری اور مسوڑھوں کے علاج میں مردہ انسان، گائے یا خنزیر سے حاصل ہڈی اور بافتوں کے استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نجس چیز اور مردہ انسان کے اجزا سے علاج متبادل نہ ہونے پر جائز ہے، متبادل ہو تو نہیں، اور مریض کے مسلمان یا غیر مسلم ہونے سے فرق نہیں پڑتا۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے علاج کو مشروع کیا ہے، اس نے ابو داود کی روایت کردہ ایک حدیث کا حوالہ دیا جس میں علاج کا حکم ہے، اور بشری الکریم میں باعشن کا قول نقل کیا کہ اللہ پر بھروسے کے ساتھ علاج مسنون ہے۔ اس نے کہا کہ فقہا کے نزدیک اصل یہ ہے کہ نجس چیز سے علاج حرام ہے، مگر انہوں نے ضرورت کے وقت، خالص شراب کے سوا، بطور استثنا اس کی اجازت دی بشرطیکہ کوئی پاک متبادل نہ ہو؛ اس نے اسنی المطالب میں زکریا انصاری کا قول نقل کیا کہ پاک چیز نہ ملنے پر غیر نشہ آور نجس چیز سے علاج جائز ہے، اور کہا کہ جس چیز میں نجس جز شامل ہو وہ بدرجہ اولیٰ جائز ہے۔ اس نے کہا کہ فقہا کا اتفاق ہے کہ کوئی بھی متبادل، چاہے نجس ہو، موجود ہو تو مردہ انسان کے اجزا سے علاج حرام ہے، جبکہ شوافع نے متبادل نہ ہونے پر اسے جائز کہا؛ اس نے تحفۃ المحتاج پر حواشی میں عبد الحمید شروانی کا قول نقل کیا کہ کوئی اور مناسب چیز نہ ملے تو مردہ انسان کی ہڈی سے ہڈی جوڑنا جائز ہو سکتا ہے۔ اس نے نتیجہ نکالا کہ متبادل نہ ہو تو خالص شراب کے سوا نجس چیز سے علاج میں حرج نہیں، متبادل ہو تو جائز نہیں؛ کوئی متبادل، چاہے نجس، نہ ہو تو مردہ انسان کے اجزا سے علاج جائز ہے؛ اور مسلمان اور غیر مسلم مریض میں کوئی فرق نہیں۔"
  es: "Una pregunta sobre el uso de huesos y tejidos extraídos de un ser humano muerto, de ganado vacuno o de cerdos en implantes dentales y tratamientos de encías, a la que el Departamento General de Iftaa de Jordania respondió que el tratamiento con sustancias impuras y con partes de un ser humano muerto está permitido cuando no hay alternativa, no cuando existe, y que no importa si el paciente es musulmán o no. El Departamento respondió que el Islam legisla la búsqueda de tratamiento médico, citando un hadiz narrado por Abu Dawud que ordena el tratamiento, y citando a Ba'ishn en Bushra al-Karim que el tratamiento se recomienda junto con la confianza en Dios. Dijo que el principio establecido entre los juristas es que el tratamiento con sustancias impuras está prohibido, pero que lo permitieron excepcionalmente cuando fuese necesario, excepto el vino puro, con la condición de que no exista una alternativa pura, citando a Zakariyya al-Ansari en Asna al-Matalib que el tratamiento con una sustancia impura, no intoxicante, está permitido cuando falta una pura; agregó que algo que simplemente contiene un elemento impuro está aún más permitido. El texto afirma que los juristas coinciden en que el tratamiento con partes de un ser humano muerto está prohibido cuando existe alguna alternativa, incluso una impura, mientras que los shafiíes lo permiten cuando no hay alternativa, citando a Abd al-Hamid al-Shirwani en sus glosas sobre Tuhfat al-Muhtaj, donde afirma que la colocación de un hueso con el hueso de un ser humano muerto puede estar permitida si no se encuentra nada más adecuado. Concluye que no hay objeción al tratamiento con sustancias impuras, salvo vino puro, cuando no hay alternativa, pero sí cuando existe; que el tratamiento con partes de un ser humano muerto está permitido cuando no hay alternativa disponible, incluso una impura; y que no hay diferencia entre un paciente musulmán y uno no musulmán."
  fr: "Concernant l'utilisation d'os et de tissus provenant d'un cadavre, de bovins ou de porcs pour les implants dentaires et les traitements gingivaux, le Département général de la Iftaa jordanien a répondu que le recours à des substances impures et à des parties d'un cadavre est permis en dernier recours, et non lorsqu'une alternative existe. La religion du patient, musulman ou non, est sans incidence. Le Département a expliqué que l'islam prescrit le recours aux soins médicaux, citant un hadith rapporté par Abou Dawoud qui l'ordonne, et Ba'ishn dans Bushra al-Karim qui recommande le traitement, en parallèle de la confiance en Dieu. Il a précisé que le principe établi par les juristes est l'interdiction du traitement par des substances impures, mais qu'il est autorisé exceptionnellement en cas de nécessité, à l'exception du vin pur, à condition qu'aucune alternative pure n'existe. Le Département a cité Zakariyya al-Ansari dans Asna al-Matalib, qui autorise le traitement par une substance impure non enivrante en l'absence de substance pure, et a ajouté que la simple présence d'un élément impur est d'autant plus permise. Il est indiqué que les juristes s'accordent à dire que le traitement par des parties d'un cadavre est interdit lorsqu'il existe une alternative, même impure, tandis que les chaféites l'autorisent en l'absence d'alternative, citant Abd al-Hamid al-Shirwani dans ses gloses sur Tuhfat al-Muhtaj, selon lesquelles l'application d'un os provenant d'un cadavre peut être permise si aucune autre solution appropriée n'est trouvée. Il est conclu qu'il n'y a pas d'objection au traitement par des substances impures, autres que le vin pur, en l'absence d'alternative, mais pas lorsqu'une alternative existe; que le traitement par des parties d'un cadavre est permis lorsqu'aucune alternative, même impure, n'est disponible; et qu'il n'y a pas de différence entre un patient musulman et un patient non musulman."
