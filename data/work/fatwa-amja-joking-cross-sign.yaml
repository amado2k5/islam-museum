id: work/fatwa-amja-joking-cross-sign
class: work
kind: fatwa
label: { ar: "رسم علامة الصليب على سبيل المزح", en: "Drawing a cross sign in jest", ur: "مزاح میں صلیب کی علامت بنانا", es: "Dibujar una cruz en broma", fr: "Dessiner une croix pour plaisanter", tr: "Haçı şaka olarak çizmek", id: "Menggambar salib sebagai lelucon" }
summary:
  ar: "سأل سائل أن أحد أقاربه المشهور بالمرح رسم علامة الصليب على صدره على سبيل المزاح ويخشى أن يكون قد كفر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86565 بتاريخ 13 مارس 2012)⁩ أنه لا يعظم ذنب على التوبة وأن ندمه توبة وخوفه مما عسى أن يكون وقع فيه وحرصه على التخلص من تبعته توبة فليستدم العمل الصالح وليحرص على الرفقة الصالحة، وعلم أن الرجل قد يقع في الكفر بالله بسبب شيء من المزح كما في نزل المنافقين قد كفرتم بعد إيمانكم، وكرر أنه لا يعظم ذنب على التوبة."
  en: "A questioner said a humorous relative had drawn a cross sign on his chest in jest and he feared it was disbelief. Dr. Salah al-Sawi (fatwa no. 86565, 13 March 2012) answered that no sin is too great for repentance — his remorse is repentance, his fear of what he may have fallen into and his eagerness to shed its consequence are repentance; let him keep to good deeds and good company; and he taught that a man may fall into disbelief over a jest, as the hypocrites' verse 'you have disbelieved after your belief' came down — while repeating that no sin is too great for repentance. Recorded as AMJA's answer."
  ur: "ایک سائل نے لکھا کہ رشتہ دار نے مزاح میں سینے پر صلیب بنائی اور ڈر ہے کہ کفر ہوا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86565، 13 مارچ 2012)⁩ کے مطابق ندامت توبہ ہے؛ مزاح میں کفر بھی ممکن ہے اس لیے احتیاط رکھے اور توبہ کرے۔"
  es: "Un consultante dijo que un familiar, en tono de broma, le había dibujado una cruz en el pecho y temía que fuera un signo de incredulidad. El Dr. Salah al-Sawi (fatwa n.° 86565, 13 de marzo de 2012) respondió que ningún pecado es demasiado grande para el arrepentimiento: su remordimiento es arrepentimiento, su temor a las consecuencias y su deseo de liberarse de ellas también lo son; que se mantenga en buenas obras y en buena compañía; y enseñó que un hombre puede caer en la incredulidad por una broma, como el versículo de los hipócritas: «Has renegado de la fe después de haber creído», mientras reiteraba que ningún pecado es demasiado grande para el arrepentimiento. Registrado como respuesta de AMJA."
  fr: "Un homme a posé une question, expliquant qu'un parent, par plaisanterie, avait dessiné une croix sur sa poitrine et qu'il craignait que cela soit un signe d'incroyance. Le Dr Salah al-Sawi (fatwa n° 86565, 13 mars 2012) a répondu qu'aucun péché n'est trop grave pour être repenti: son remords est un repentir, sa crainte de ce dans quoi il a pu tomber et son désir d'en échapper sont également des repentirs; qu'il s'attache aux bonnes œuvres et aux bonnes fréquentations. Il a enseigné qu'un homme peut tomber dans l'incroyance à cause d'une plaisanterie, comme le verset concernant les hypocrites: « Vous avez mécru après avoir cru », tout en réaffirmant qu'aucun péché n'est trop grave pour être repenti. Cette réponse est consignée dans l'AMJA."
  tr: "Bir soru soran, oyunbaz tavırlarıyla bilinen akrabalarından birinin, inanmamış olabileceğinden korkarak göğsüne haç işareti çizdiğini sordu. Dr. Salah Al-Sawy (13 Mart 2012 tarihli Fetva No. 86565) günahı tövbeden büyük görmediğini, pişmanlığının tövbe olduğunu, düşebileceği şeyden korktuğunu ve sonuçlarından kurtulma isteğinin tövbe olduğunu söyledi. Doğru işleri yapmaya devam etmeli ve doğru dostluk için çabalamalı. Bir adamın, 'İmanından sonra kâr ettin' sözünde olduğu gibi, bazı şakalar yüzünden Tanrı'ya inanmamaya düşebileceğini biliyordu. Günahın tövbeden daha büyük olmadığını yineledi."
  id: "Ia bertanya kepada seorang penanya bahwa salah satu kerabatnya, yang dikenal suka bermain, telah menggambar tanda salib di dadanya sebagai lelucon, karena takut ia mungkin telah tidak percaya. Dr. Salah Al-Sawy menjawab (Fatwa No. 86565 tanggal 13 Maret 2012) bahwa ia tidak menganggap dosa lebih besar daripada pertobatan, bahwa penyesalannya adalah pertobatan, dan ketakutannya akan apa yang mungkin telah ia jatuhkan, serta keinginannya untuk melepaskan diri dari konsekuensinya adalah pertobatan. Ia harus terus melakukan perbuatan benar dan berusaha mendapatkan persahabatan yang benar. Ia tahu bahwa seseorang bisa jatuh ke dalam ketidakpercayaan kepada Tuhan karena lelucon, seperti pepatah para munafik, 'Kalian telah tidak percaya setelah imanmu.' Ia menegaskan kembali bahwa dosa tidak lebih besar daripada pertobatan."
