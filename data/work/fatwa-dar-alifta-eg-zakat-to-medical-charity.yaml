class: work
kind: fatwa
label: { ar: "حكم دفع الزكاة لجمعية تقوم بصرفها على علاج الفقراء والمساكين", en: "Paying zakat to a charity that spends it on treating the poor", ur: "فقیروں کے علاج پر خرچ کرنے والی جمعیت کو زکات دینا" }
summary:
  ar: "سائل سأل عن دفع الزكاة لجمعية تصرفها على علاج الفقراء والمساكين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21880)⁩ أنه يجوز الصرف من أموال الزكاة والصدقات في علاج الفقراء والمساكين من خلال القوافل الطبية أو غيرها بطريق التمليك على ما فصّل الجواب."
  en: "A questioner asked about paying zakat to a charity that spends it on treating the poor and needy. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21880) answered that spending zakat and charity funds on treating the poor and needy is permitted — through medical convoys or otherwise, by way of giving ownership — as the answer details."
  ur: "ایک سائل نے کسی ایسی جمعیت کو زکات دینے کا حکم پوچھا جو فقیروں اور مسکینوں کے علاج پر خرچ کرتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21880)⁩ نے جواب دیا کہ طبی قافلوں یا دیگر ذرائع سے فقیر و مسکین کے علاج پر زکات اور صدقات خرچ کرنا جائز ہے بشرطیکہ مال ان کی ملکیت میں دیا جائے — جیسا کہ جواب میں تفصیل ہے۔"
