id: work/fatwa-dar-alifta-eg-zakat-to-medical-charity
class: work
kind: fatwa
label: { ar: "حكم دفع الزكاة لجمعية تقوم بصرفها على علاج الفقراء والمساكين", en: "Paying zakat to a charity that spends it on treating the poor", ur: "فقیروں کے علاج پر خرچ کرنے والی جمعیت کو زکات دینا", es: "Pagar el zakat a una organización benéfica que lo gasta en el tratamiento de los pobres.", fr: "Verser la zakat à une œuvre de charité qui la consacre aux soins des pauvres", tr: "Zekatın yoksul ve ihtiyaç sahiplerine yardım eden bir derneğe ödenmesine ilişkin karar", id: "Aturan tentang membayar zakat kepada asosiasi yang menghabiskannya untuk merawat orang miskin dan membutuhkan" }
summary:
  ar: "سائل سأل عن دفع الزكاة لجمعية تصرفها على علاج الفقراء والمساكين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21880)⁩ أنه يجوز الصرف من أموال الزكاة والصدقات في علاج الفقراء والمساكين من خلال القوافل الطبية أو غيرها بطريق التمليك على ما فصّل الجواب."
  en: "A questioner asked about paying zakat to a charity that spends it on treating the poor and needy. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21880) answered that spending zakat and charity funds on treating the poor and needy is permitted — through medical convoys or otherwise, by way of giving ownership — as the answer details."
  ur: "ایک سائل نے کسی ایسی جمعیت کو زکات دینے کا حکم پوچھا جو فقیروں اور مسکینوں کے علاج پر خرچ کرتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21880)⁩ نے جواب دیا کہ طبی قافلوں یا دیگر ذرائع سے فقیر و مسکین کے علاج پر زکات اور صدقات خرچ کرنا جائز ہے بشرطیکہ مال ان کی ملکیت میں دیا جائے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el pago del zakat a una organización benéfica que lo destina al tratamiento de los pobres y necesitados. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21880) respondió que está permitido destinar el zakat y los fondos de organizaciones benéficas al tratamiento de los pobres y necesitados, ya sea mediante convoyes médicos o de otra manera, mediante la cesión de la propiedad, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le versement de la zakat à une œuvre caritative qui la consacre aux soins des pauvres et des nécessiteux. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21880) a répondu que l'utilisation de la zakat et des fonds caritatifs pour soigner les pauvres et les nécessiteux est permise – notamment par le biais de convois médicaux, sous forme de transfert de propriété – comme le précise la réponse."
  tr: "Bir soru soran, yoksul ve muhtaçlara yardım eden bir derneğe zekat ödenmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21880), cevabında ayrıntılı olarak belirtildiği üzere, yoksul ve muhtaçlara tıbbi kervanlar veya sahiplik yoluyla zekat ve yardım fonlarının harcanmasının caiz olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang pembayaran zakat kepada sebuah asosiasi yang menghabiskan dana untuk merawat orang miskin dan membutuhkan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21880) menjawab bahwa diperbolehkan menggunakan zakat dan dana amal untuk merawat orang miskin dan membutuhkan melalui karavan medis atau kepemilikan lainnya, seperti yang dijelaskan dalam jawaban."
