label: { ar: "حكم دراسة تاريخ وآثار الأمم السابقة", en: "Studying the history and antiquities of past nations", ur: "سابقہ اقوام کے تاریخ و آثار کا مطالعہ", es: "Estudiar la historia y las antigüedades de las naciones del pasado." }
summary:
  ar: "سائل سأل عن دراسة تاريخ وآثار الأمم السابقة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22192)⁩ أن القرآن والسنة لفتَا الأنظار في كثير من نصوصهما إلى ضرورة السير في الأرض والنظر في آثار الأمم السابقة للاعتبار، وبيّن الجواب حكم دراستها على هذا الأصل."
  en: "A questioner asked about studying the history and antiquities of past nations. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22192) answered that the Qur'an and Sunna, in many of their texts, drew attention to the necessity of travelling the earth and contemplating the remains of former nations for admonition; the answer sets out the ruling on studying them on that basis."
  ur: "ایک سائل نے سابقہ اقوام کے تاریخ و آثار کے مطالعے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22192)⁩ نے جواب دیا کہ قرآن اور سنت نے اپنے بہت سے متون میں زمین میں چلنے اور سابقہ اقوام کے آثار پر غور کر کے عبرت لینے کی طرف توجہ دلائی؛ جواب میں اسی بنا پر ان کے مطالعے کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre el estudio de la historia y las antigüedades de naciones pasadas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22192) respondió que el Corán y la Sunna, en muchos de sus textos, destacan la necesidad de viajar por la tierra y contemplar los restos de naciones pasadas para la reflexión; la respuesta expone la norma sobre su estudio sobre esa base."
