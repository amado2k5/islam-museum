label: { ar: "حكم دراسة تاريخ وآثار الأمم السابقة", en: "Studying the history and antiquities of past nations", ur: "سابقہ اقوام کے تاریخ و آثار کا مطالعہ", es: "Estudiar la historia y las antigüedades de las naciones del pasado.", fr: "Étudier l'histoire et les antiquités des nations passées", tr: "Önceki ulusların tarihi ve arkeolojisi üzerine karar", id: "Putusan tentang studi sejarah dan arkeologi bangsa-bangsa sebelumnya" }
summary:
  ar: "سائل سأل عن دراسة تاريخ وآثار الأمم السابقة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22192)⁩ أن القرآن والسنة لفتَا الأنظار في كثير من نصوصهما إلى ضرورة السير في الأرض والنظر في آثار الأمم السابقة للاعتبار، وبيّن الجواب حكم دراستها على هذا الأصل."
  en: "A questioner asked about studying the history and antiquities of past nations. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22192) answered that the Qur'an and Sunna, in many of their texts, drew attention to the necessity of travelling the earth and contemplating the remains of former nations for admonition; the answer sets out the ruling on studying them on that basis."
  ur: "ایک سائل نے سابقہ اقوام کے تاریخ و آثار کے مطالعے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22192)⁩ نے جواب دیا کہ قرآن اور سنت نے اپنے بہت سے متون میں زمین میں چلنے اور سابقہ اقوام کے آثار پر غور کر کے عبرت لینے کی طرف توجہ دلائی؛ جواب میں اسی بنا پر ان کے مطالعے کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre el estudio de la historia y las antigüedades de naciones pasadas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22192) respondió que el Corán y la Sunna, en muchos de sus textos, destacan la necesidad de viajar por la tierra y contemplar los restos de naciones pasadas para la reflexión; la respuesta expone la norma sobre su estudio sobre esa base."
  fr: "Un internaute a posé une question sur l'étude de l'histoire et des antiquités des nations passées. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22192) a répondu que le Coran et la Sunna, dans de nombreux textes, soulignent la nécessité de parcourir le monde et de contempler les vestiges des nations anciennes pour en tirer des enseignements; la réponse expose la règle concernant leur étude sur cette base."
  tr: "Bir soru soran kişi, önceki ulusların tarihi ve antikalarının incelenmesi hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22192), Kur'an ve Sünnet'in birçok metininde yeryüzünde seyahat etmenin ve önceki ulusların etkilerini değerlendirmenin gerekliliğine dikkat çektiğini ve bu ilkeye dayanarak bunların incelenmesine ilişkin hükmü netleştirdiğini yanıtladı."
  id: "Seorang penanya bertanya tentang mempelajari sejarah dan kepukan bangsa-bangsa sebelumnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22192) menjawab bahwa Al-Qur'an dan Sunnah telah menarik perhatian dalam banyak teks mereka pada pentingnya menjelajahi bumi dan mempertimbangkan dampak bangsa-bangsa terdahulu untuk dipertimbangkan, serta memperjelas aturan tentang mempelajari mereka berdasarkan prinsip ini."
