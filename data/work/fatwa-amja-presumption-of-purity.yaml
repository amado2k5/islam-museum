id: work/fatwa-amja-presumption-of-purity
class: work
kind: fatwa
label: { ar: "الأصل الطهارة", en: "The presumption of purity — no checking demanded", ur: "اصول طہارت — جانچ کی ضرورت نہیں", es: "La presunción de pureza: no se requiere ninguna comprobación.", fr: "La présomption de pureté — aucun contrôle exigé", tr: "Kökeni saflıktır", id: "Asal-usulnya adalah kemurnian" }
summary:
  ar: "سأل سائل سؤالين عن تتبع النجاسة والتطهر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21938 بتاريخ 23 نوفمبر 2005)⁩ في السؤال الأول أنه غير مطالب بذلك فالأصل الطهارة ما لم يتيقن وجود نجاسة بحاجة إلى التطهير وفي الثاني بيّن حكم ما بعد الطهارة على ما فصّل الجواب."
  en: "A questioner asked two questions about tracking impurity and purifying. Dr. Salah al-Sawi (fatwa no. 21938, 23 November 2005) answered the first: he is not tasked with it — the presumption is purity unless he is certain an impurity needing cleansing exists; the second answered the post-purification ruling — as the answer details."
  ur: "نجاست کی تلاش لازم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21938، 23 نومبر 2005)⁩ کے مطابق نہیں — اصل طہارت ہے جب تک یقین نہ ہو۔"
  es: "Un consultante formuló dos preguntas sobre el seguimiento de la impureza y la purificación. El Dr. Salah al-Sawi (fatwa n.º 21938, 23 de noviembre de 2005) respondió a la primera: no le corresponde hacerlo, ya que se presume la pureza a menos que esté seguro de que existe una impureza que requiere purificación; la segunda respondió a la norma posterior a la purificación, como se detalla en la respuesta."
  fr: "Un internaute a posé deux questions concernant la recherche d'impuretés et la purification. Le Dr Salah al-Sawi (fatwa n° 21938, 23 novembre 2005) a répondu à la première: cela ne relève pas de sa compétence – la pureté est présumée sauf s'il est certain de l'existence d'une impureté nécessitant une purification; la seconde portait sur la décision à prendre après la purification – comme le précise la réponse."
  tr: "Bir soru soran kişi kirliliğin izlenmesi ve arınma hakkında iki soru sordu. Dr. Salah Al-Sawy (Fetva No. 21938, 23 Kasım 2005 tarihli), bunun zorunlu olmadığını, çünkü varsayılan olarak saflığın arınma gerektirdiği kesin değilse arınma olduğunu söyledi. İkinci soruda, cevabında açıklandığı gibi arınma sonrası konuyla ilgili kararı açıkladı."
  id: "Seorang penanya mengajukan dua pertanyaan tentang pelacakan ketidakmurnian dan pemurnian. Dr. Salah Al-Sawy (Fatwa No. 21938 tanggal 23 November 2005) menjawab bahwa ia tidak diwajibkan melakukannya, karena default adalah pemurnian kecuali sudah pasti bahwa ketidakmurnian memerlukan pemurnian. Dalam pertanyaan kedua, ia menjelaskan putusan atas masalah tersebut setelah pemurnian sebagaimana dijelaskan dalam jawaban."
