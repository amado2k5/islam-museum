label: { ar: "الأصل الطهارة", en: "The presumption of purity — no checking demanded", ur: "اصول طہارت — جانچ کی ضرورت نہیں" }
summary:
  ar: "سأل سائل سؤالين عن تتبع النجاسة والتطهر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21938 بتاريخ 23 نوفمبر 2005)⁩ في السؤال الأول أنه غير مطالب بذلك فالأصل الطهارة ما لم يتيقن وجود نجاسة بحاجة إلى التطهير وفي الثاني بيّن حكم ما بعد الطهارة على ما فصّل الجواب."
  en: "A questioner asked two questions about tracking impurity and purifying. Dr. Salah al-Sawi (fatwa no. 21938, 23 November 2005) answered the first: he is not tasked with it — the presumption is purity unless he is certain an impurity needing cleansing exists; the second answered the post-purification ruling — as the answer details."
  ur: "نجاست کی تلاش لازم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21938، 23 نومبر 2005)⁩ کے مطابق نہیں — اصل طہارت ہے جب تک یقین نہ ہو۔"
