id: work/fatwa-amja-kissing-wife-wudu
class: work
kind: fatwa
label: { ar: "تقبيل الزوجة والوضوء", en: "Kissing one's wife and the wudu", ur: "بیوی کا بوسہ اور وضو", es: "Besar a la esposa y el wudu", fr: "Embrasser sa femme et faire ses ablutions" }
summary:
  ar: "سأل سائل هل تقبيل الرجل لزوجته ينقض الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82559 بتاريخ 17 سبتمبر 2010)⁩ أن نقض الوضوء بتقبيل الزوجة من مواضع النظر بين أهل العلم والذي يظهر أنه لا ينقض من ذلك إلا ما كان بشهوة على ما فصّل الجواب."
  en: "A questioner asked whether a man's kissing his wife breaks the wudu. Dr. Salah al-Sawi (fatwa no. 82559, 17 September 2010) answered that the wudu's breaking on kissing one's wife is among the scholars' disputed points; what appears to them is that nothing of it breaks it except what comes with desire — as the answer details."
  ur: "ایک سائل نے بیوی کے بوسے سے وضو پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82559، 17 ستمبر 2010)⁩ کے مطابق شہوت والا بوسہ ہی وضو توڑتا ہے۔"
  es: "Un consultante preguntó si el beso de un hombre a su esposa invalida la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.° 82559, 17 de septiembre de 2010) respondió que la invalidez de la ablución al besar a la esposa es uno de los puntos controvertidos entre los eruditos; según su parecer, nada la invalida excepto lo que viene con deseo, como se detalla en la respuesta."
  fr: "Un internaute a demandé si le fait pour un homme d'embrasser sa femme annulait les ablutions (wudu). Le Dr Salah al-Sawi (fatwa n° 82559, 17 septembre 2010) a répondu que la question de l'annulation des ablutions lors d'un baiser avec sa femme fait l'objet de controverses parmi les savants; selon eux, seul le désir annule les ablutions, comme le précise la réponse."
