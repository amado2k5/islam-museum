id: work/fatwa-amja-kissing-wife-wudu
class: work
kind: fatwa
label: { ar: "تقبيل الزوجة والوضوء", en: "Kissing one's wife and the wudu", ur: "بیوی کا بوسہ اور وضو" }
summary:
  ar: "سأل سائل هل تقبيل الرجل لزوجته ينقض الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82559 بتاريخ 17 سبتمبر 2010)⁩ أن نقض الوضوء بتقبيل الزوجة من مواضع النظر بين أهل العلم والذي يظهر أنه لا ينقض من ذلك إلا ما كان بشهوة على ما فصّل الجواب."
  en: "A questioner asked whether a man's kissing his wife breaks the wudu. Dr. Salah al-Sawi (fatwa no. 82559, 17 September 2010) answered that the wudu's breaking on kissing one's wife is among the scholars' disputed points; what appears to them is that nothing of it breaks it except what comes with desire — as the answer details."
  ur: "ایک سائل نے بیوی کے بوسے سے وضو پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82559، 17 ستمبر 2010)⁩ کے مطابق شہوت والا بوسہ ہی وضو توڑتا ہے۔"
