summary:
  ar: "المجموع الكبير لفتاوى تقي الدين ابن تيمية (ت 728هـ) ورسائله وقواعده، جمعه ورتبه على الموضوعات عبد الرحمن بن محمد بن قاسم وساعده ابنه محمد، وطبع مرات منها طبعة مجمع الملك فهد بالمدينة (1425هـ/2004م) وطبعة دار الوفاء بعناية عامر الجزار وأنور الباز في سبعة وثلاثين مجلداً آخرها الفهارس العامة."
  en: "The great collection of the fatwas, treatises and rules of Taqi al-Din Ibn Taymiyya (d. 728 AH), gathered and arranged by subject by Abd al-Rahman ibn Muhammad ibn Qasim with the help of his son Muhammad; it has been printed several times, among them by the King Fahd Complex in Medina (1425 AH / 2004) and by Dar al-Wafa' under Amir al-Jazzar and Anwar al-Baz in thirty-seven volumes, the last being the general indexes."
