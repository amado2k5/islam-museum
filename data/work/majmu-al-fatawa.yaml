summary:
  ar: "المجموع الكبير لفتاوى تقي الدين ابن تيمية ⁦(ت 728هـ)⁩ ورسائله وقواعده، جمعه ورتبه على الموضوعات عبد الرحمن بن محمد بن قاسم وساعده ابنه محمد، وطبع مرات منها طبعة مجمع الملك فهد بالمدينة ⁦(1425هـ/2004م)⁩ وطبعة دار الوفاء بعناية عامر الجزار وأنور الباز في سبعة وثلاثين مجلداً آخرها الفهارس العامة."
  en: "The great collection of the fatwas, treatises and rules of Taqi al-Din Ibn Taymiyya (d. 728 AH), gathered and arranged by subject by Abd al-Rahman ibn Muhammad ibn Qasim with the help of his son Muhammad; it has been printed several times, among them by the King Fahd Complex in Medina (1425 AH / 2004) and by Dar al-Wafa' under Amir al-Jazzar and Anwar al-Baz in thirty-seven volumes, the last being the general indexes."
  es: "La gran colección de fatuas, tratados y reglas de Taqi al-Din Ibn Taymiyya (fallecido en 728 AH), recopilada y organizada por temas por Abd al-Rahman ibn Muhammad ibn Qasim con la ayuda de su hijo Muhammad; ha sido impresa varias veces, entre ellas por el Complejo Rey Fahd en Medina (1425 AH / 2004) y por Dar al-Wafa' bajo Amir al-Jazzar y Anwar al-Baz en treinta y siete volúmenes, siendo el último los índices generales."
  fr: "La grande collection des fatwas, traités et règles de Taqi al-Din Ibn Taymiyya (mort en 728 AH), rassemblée et classée par sujet par Abd al-Rahman ibn Muhammad ibn Qasim avec l'aide de son fils Muhammad; elle a été imprimée à plusieurs reprises, notamment par le Complexe du Roi Fahd à Médine (1425 AH / 2004) et par Dar al-Wafa' sous Amir al-Jazzar et Anwar al-Baz en trente-sept volumes, le dernier étant les index généraux."
  ur: "تقی الدین ابن تیمیہ ⁦(متوفی 728 ہجری)⁩ کے فتاویٰ، مقالات اور احکام کا عظیم ذخیرہ، جسے عبدالرحمٰن بن محمد بن قاسم نے اپنے بیٹے محمد کی مدد سے موضوع کے لحاظ سے جمع کیا اور ترتیب دیا۔ ان میں سے کنگ فہد کمپلیکس مدینہ ⁦(1425ھ / 2004)⁩ اور دار الوفاء نے امیر الجزار اور انوار الباز کے ماتحت سینتیس جلدوں میں کئی بار چھاپے ہیں، جن میں سے آخری عام اشاریہ ہے۔"
  tr: "Taki al-Din İbn Teymiye'nin (ö. 728 Hicri) Fetvaları ve Mektupları ile Kuralları, Abd al-Rahman ibn Muhammed ibn Kasim tarafından ve oğlu Muhammed'in yardımıyla Mevdu'ya (konular) göre derlenip düzenlenmiştir. Birçok kez basılmıştır; bunlar arasında Kral Fahd'ın Medine'deki Kompleksi (1425 H/2004 CE) ve Amer al-Jazzar ile Anwar al-Baz tarafından düzenlenen Dar al-Wafa'nın otuz yedi ciltlik baskısı vardır; sonuncusu Genel Dizinler'dir."
  id: "Kumpulan Besar Fatwa Taqi al-Din Ibn Taymiyyah (wafat 728 H) dan Surat-surat serta Aturannya disusun dan diatur menurut Mawdu' (topik) oleh Abd al-Rahman ibn Muhammad ibn Qasim dan dibantu oleh putranya Muhammad. Karya ini dicetak beberapa kali, termasuk edisi King Fahd's Complex in Medina (1425 H/2004 M) dan edisi Dar al-Wafa, yang diedit oleh Amer al-Jazzar dan Anwar al-Baz, dalam tiga puluh tujuh jilid, yang terakhir adalah Indeks Umum."
