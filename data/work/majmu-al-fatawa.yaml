structure: "A subject arrangement of Ibn Taymiyya's fatwas, treatises and 'rules' (qawa'id) by the compiler Ibn Qasim, volume by volume. Volumes read for this record: vol. 7, al-Iman (Kitab al-Iman al-Kabir and Kitab al-Iman al-Awsat); vol. 8, Kitab al-Qadar; vol. 10, Kitab 'Ilm al-Suluk (al-Tuhfa al-'Iraqiyya, Amrad al-Qulub wa-Shifa'uha, al-'Ubudiyya, fatwas on fana', the Sufis, retreats, seclusion, the Ihya' and Qut al-Qulub, commentary on sayings of Abd al-Qadir al-Jilani, al-Wasiyya al-Sughra); vol. 37, the general indexes."
