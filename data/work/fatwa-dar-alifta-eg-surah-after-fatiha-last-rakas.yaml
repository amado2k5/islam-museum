label: { ar: "حكم قراءة سورة بعد الفاتحة في الركعتين الثالثة والرابعة", en: "Reading a surah after the Fatiha in the third and fourth rak'ahs", ur: "تیسری اور چوتھی رکعت میں فاتحہ کے بعد سورت پڑھنا", es: "Recitación de una sura después de la Fatiha en la tercera y cuarta rak'ah.", fr: "Réciter une sourate après la Fatiha dans la troisième et la quatrième rak'ah", tr: "Üçüncü ve dördüncü rekâtlarda Fatiha'dan sonra bir surenin okunmasına ilişkin hüküm", id: "Aturan tentang membaca Surah setelah Al-Fatiha pada rak'ah ketiga dan keempat" }
summary:
  ar: "سائل سأل عن قراءة السورة بعد الفاتحة في غير الركعتين الأوليين كالركعة الثالثة في المغرب والثالثة والرابعة من الرباعية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20855)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about reading a surah after the Fatiha in rak'ahs beyond the first two — the third of Maghrib and the third and fourth of a four-rak'ah prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20855) answered by setting out the ruling."
  ur: "ایک سائل نے پہلی دو رکعتوں کے بعد فاتحہ کے ساتھ سورت پڑھنے کا حکم پوچھا جیسے مغرب کی تیسری اور چار رکعتوں کی تیسری چوتھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20855)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre la lectura de una sura después de la Fatiha en rak'ahs más allá de las dos primeras: la tercera del Maghrib y la tercera y cuarta de una oración de cuatro rak'ahs. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20855) respondió exponiendo la normativa."
  fr: "Un fidèle a demandé s'il était permis de réciter une sourate après la Fatiha dans les rak'ahs suivantes: la troisième de la prière du Maghrib et la troisième et la quatrième d'une prière de quatre rak'ahs. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20855) a répondu en énonçant la règle."
  tr: "Bir soru soran, Mağrip'teki üçüncü reket ve dört rekatın üçüncü ve dördüncü rekâtları gibi ilk iki rekât dışında Fatiha'dan sonra surenin okunması hakkında soru sordu. Mısır'ın Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20855) bu konudaki hükmü olduğu gibi açıklığa kavuşturdu."
  id: "Seorang penanya menanyakan tentang pembacaan surah setelah Al-Fatiha dalam doa selain dua rak'ah pertama, seperti rak'ah ketiga di Maghrib dan rak'ah ketiga serta keempat dari empat rak'ah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20855) menanggapi dengan memperjelas keputusan ini sebagaimana adanya."
