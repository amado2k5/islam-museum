label: { ar: "حكم صلاة الكسوف والخسوف وكيفية أدائها", en: "The eclipse prayer and how it is performed", ur: "سورج و چاند گرہن کی نماز اور اس کا طریقہ", es: "La oración del eclipse y cómo se realiza", fr: "La prière de l'éclipse et la manière dont elle est accomplie" }
summary:
  ar: "سائل سأل عن صلاة الكسوف والخسوف وكيفية أدائها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22058)⁩ أنها سنة عن النبي وكيفيتها ركعتان في كل ركعة قيامان وقراءتان وركوعان وسجودان، وبيّن الجواب صفتها على وجه التفصيل."
  en: "A questioner asked about the solar- and lunar-eclipse prayer and how it is performed. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22058) answered that it is a Prophetic sunna of two units, each with two standings, two recitations, two bowings and two prostrations; the answer sets out its full description."
  ur: "ایک سائل نے سورج اور چاند گرہن کی نماز اور اس کے ادا کرنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22058)⁩ نے جواب دیا کہ یہ نبوی سنت ہے، دو رکعتیں جن میں ہر رکعت میں دو قیام، دو تلاوتیں، دو رکوع اور دو سجدے ہیں؛ جواب میں اس کی مکمل صفت بیان ہوئی۔"
  es: "Un consultante preguntó sobre la oración de los eclipses solares y lunares y cómo se realiza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22058) respondió que es una sunna profética de dos partes, cada una con dos posturas, dos recitaciones, dos inclinaciones y dos postraciones; la respuesta detalla su descripción completa."
  fr: "Un internaute a posé une question concernant la prière lors des éclipses solaires et lunaires et sa pratique. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22058) a répondu qu'il s'agit d'une sunna prophétique en deux unités, chacune comprenant deux stations debout, deux récitations, deux inclinaisons et deux prosternations; la réponse en donne la description complète."
