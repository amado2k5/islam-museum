summary:
  ar: "سائل سأل عن صلاة الكسوف والخسوف وكيفية أدائها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22058)⁩ أنها سنة عن النبي وكيفيتها ركعتان في كل ركعة قيامان وقراءتان وركوعان وسجودان، وبيّن الجواب صفتها على وجه التفصيل."
  en: "A questioner asked about the solar- and lunar-eclipse prayer and how it is performed. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22058) answered that it is a Prophetic sunna of two units, each with two standings, two recitations, two bowings and two prostrations; the answer sets out its full description."
  ur: "ایک سائل نے سورج اور چاند گرہن کی نماز اور اس کے ادا کرنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22058)⁩ نے جواب دیا کہ یہ نبوی سنت ہے، دو رکعتیں جن میں ہر رکعت میں دو قیام، دو تلاوتیں، دو رکوع اور دو سجدے ہیں؛ جواب میں اس کی مکمل صفت بیان ہوئی۔"
