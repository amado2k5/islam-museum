id: work/fatwa-dar-alifta-eg-returning-old-defect-goods
class: work
kind: fatwa
label: { ar: "مدى حق المشتري في رد السلعة المعيبة إذا كان العيب قديمًا", en: "The buyer's right to return a good for an old defect he did not know of", ur: "خریدار کا پرانے عیب پر چیز لوٹانے کا حق" }
summary:
  ar: "سائل سأل عن حق المشتري في رد سيارة اشتراها وتبين له عيب قديم فيها لم يعلمه البائع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20848)⁩ أن للمشتري في هذه الحالة الخيار في أن يرد السيارة المعيبة فور علمه بالعيب ما دام البائع لم يكن عالمًا به على ما فصّل الجواب."
  en: "A questioner asked the buyer's right to return a car in which he discovered an old defect the seller had not known of. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20848) answered that the buyer then has the option to return the defective car as soon as he learns of the defect — as the answer details."
  ur: "ایک سائل نے خریدار کے ایسی گاڑی لوٹانے کے حق کا حکم پوچھا جس میں پرانا عیب نکلا جسے بائع بھی نہیں جانتا تھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20848)⁩ نے جواب دیا کہ خریدار کو عیب معلوم ہوتے ہی واپس کرنے کا اختیار ہے — جیسا کہ جواب میں تفصیل ہے۔"
