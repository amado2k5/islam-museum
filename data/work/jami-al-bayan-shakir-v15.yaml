id: work/jami-al-bayan-shakir-v15
class: work
kind: tafsir-volume
label:
  ar: "جامع البيان عن تأويل آي القرآن، الجزء ١٥"
  en: "Jami' al-Bayan, vol. 15 (Shakir edition)"
  ur: "جامع البیان، جلد ۱۵ ⁦(شاکر کی تحقیق)⁩"
summary:
  ar: "الجزء ١٥ من تفسير الطبري «جامع البيان» في طبعة أحمد محمد شاكر ومحمود محمد شاكر. يغطي الآيات التي تستشهد بهذا الجزء سجلات المتحف الآن: 250 موضعا، من 10:1 إلى 12:18."
  en: "Volume 15 of al-Tabari's Jami' al-Bayan in the Shakir edition. The museum's verse records cite this volume for 250 verse positions, from 10:1 to 12:18."
  ur: "طبری کی جامع البیان کی شاکر طبعہ کی جلد ۱۵۔ میوزیم کے آیت ریکارڈ اس جلد کے 250 مقامات، 10:1 سے 12:18 تک، کا حوالہ دیتے ہیں۔"
