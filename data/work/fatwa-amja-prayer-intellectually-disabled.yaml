summary:
  ar: "سأل سائل عن حكم الصلاة لحامل الإعاقة الذهنية أي المصاب بنقص في مداركه. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86197 بتاريخ 22 ديسمبر 2011)⁩ أنه ما دام يعقل الخطاب ويدرك معنى الأمر والنهي فيلزمه إقامة الصلاة وعلى من يباشر شؤونه أن يجتهد في تعليمه وتعويده على ذلك ما استطاع ويحتسب الأجر في ذلك على ما فصّل الجواب."
  en: "A questioner asked the prayer's ruling for one bearing intellectual disability — impaired in his faculties. AMJA's fatwa committee (fatwa no. 86197, 22 December 2011) answered that so long as he comprehends address and grasps the meaning of command and prohibition, keeping the prayer is required of him; his caretaker should strive to teach and habituate him to it as possible, counting the reward in that — as the answer details."
  ur: "ذہنی معذور پر نماز؟ لجنة الفتوى ⁦(فتویٰ 86197، 22 دسمبر 2011)⁩ کے مطابق حکم نہی فہمے تو فرض — نگہبان تعلیم دے۔"
