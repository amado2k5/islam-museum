id: work/fatwa-dar-alifta-eg-selling-near-expiry-goods
class: work
kind: fatwa
label: { ar: "حكم بيع سلع أوشكت صلاحيتها على الانتهاء بعروض ترويجية", en: "Selling goods near expiry through promotional offers", ur: "میعاد ختم ہونے کے قریب اشیاء کی تشہیری آفر سے فروخت", es: "Vender productos próximos a caducar mediante ofertas promocionales", fr: "Vente de produits proches de leur date de péremption grâce à des offres promotionnelles" }
summary:
  ar: "سائل سأل عن بيع سلع ومنتجات قاربت على انتهاء صلاحيتها من خلال عروض ترويجية بخفض أسعارها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24302)⁩ أن ذلك جائز شرعًا بشرط أن تكون السلعة في ذاتها سليمة تمامًا وصالحة للاستعمال، مع بيان ميعاد انتهائها للمشتري كما فصّل الجواب."
  en: "A questioner asked about selling goods nearing their expiry through promotional offers at reduced prices. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24302) answered that this is lawful provided the goods are in themselves entirely sound and fit for use, with the expiry date disclosed to the buyer — as the answer details."
  ur: "ایک سائل نے میعاد کے ختم ہونے کے قریب اشیاء کی کم قیمت پر تشہیری آفر سے فروخت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24302)⁩ نے جواب دیا کہ یہ شرعاً جائز ہے بشرطیکہ اشیاء بذاتِ خود بالکل صحیح اور استعمال کے قابل ہوں اور خریدار کو میعاد کی تاریخ بتائی جائے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la venta de productos próximos a caducar mediante ofertas promocionales a precios reducidos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 24302) respondió que esto es lícito siempre que los productos estén en perfecto estado y sean aptos para su uso, y se le haya informado al comprador de la fecha de caducidad, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la vente de produits proches de leur date de péremption à prix réduits, dans le cadre d'offres promotionnelles. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24302) a répondu que cela est licite à condition que les produits soient en parfait état et propres à l'usage, et que la date de péremption soit clairement indiquée à l'acheteur – comme le précise la réponse."
