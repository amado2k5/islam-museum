id: work/fatwa-dar-alifta-eg-stoning-on-behalf-without-permission
class: work
kind: fatwa
label: { ar: "حكم رمي الجمرات أيام التشريق عن الغير بدون إذنه", en: "Stoning the jamarat for another in tashriq without his permission", ur: "بغیر اجازت کسی اور کی طرف سے جمرات کی رمی", es: "Lapidar la jamarat por otra en tashriq sin su permiso", fr: "Lapider la jamarat pour un autre en tashriq sans sa permission" }
summary:
  ar: "سائل سأل عن رمي الجمرات أيام التشريق عن الغير بدون إذنه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20764)⁩ أن النيابة عن الغير في رمي الجمرات جائزة شرعًا إن كانت بإذن مسبق ممن وجب عليه الرمي فإن لم تكن بإذن فحكمها على ما فصّل الجواب."
  en: "A questioner asked about stoning the jamarat for another in the days of tashriq without his permission. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20764) answered that acting for another in the stoning is lawful when by prior permission of the one obliged; without permission, the ruling is as the answer details."
  ur: "ایک سائل نے ایام تشریق میں بغیر اجازت کسی اور کی طرف سے رمی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20764)⁩ نے جواب دیا کہ پیشگی اجازت سے نائب کی رمی جائز ہے؛ بغیر اجازت کا حکم جواب میں ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de apedrear la jamarat en nombre de otra persona durante la época del tashriq sin su permiso. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20764) respondió que actuar en nombre de otro en el apedreamiento es lícito cuando se cuenta con el permiso previo de la persona obligada; sin permiso, la norma es la que se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la lapidation d'une jamarat pour le compte d'autrui durant la période de tashriq, sans son consentement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20764) a répondu que la lapidation est licite avec l'accord préalable de la personne concernée; sans cet accord, la règle est détaillée dans la réponse."
