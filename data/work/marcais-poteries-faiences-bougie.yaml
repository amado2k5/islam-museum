summary:
  ar: "دراسة لجورج مارسيه ⁦(قسنطينة 1916)⁩ لكسر خزفية إسلامية من بجاية، يؤرخها بين أواخر القرن الحادي عشر والقرن السادس عشر، ويرى أن المدينة ورثت صناعة قلعة بني حماد وصدّرت «الخزف المذهّب» {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}."
  en: "Study by Georges Marçais (Constantine 1916) of Islamic ceramic fragments from Bougie, dated between the late eleventh and sixteenth centuries, arguing that the town inherited the industry of the Qal'a of the Banu Hammad and exported 'golden faience' {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}."
  ur: "ژورژ مارسے کی تحقیق (قسنطینہ 1916ء) جو بجایہ کے اسلامی ظروف کے ٹکڑوں پر ہے، جنہیں وہ گیارھویں صدی کے اواخر سے سولھویں صدی تک کا بتاتے ہیں، اور کہتے ہیں کہ شہر نے قلعۂ بنی حماد کی صنعت ورثے میں پائی اور «سنہری فائنس» برآمد کیا {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}۔"
