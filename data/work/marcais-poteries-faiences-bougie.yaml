label: { ar: "فخار وخزف بجاية ⁦(جورج مارسيه 1916)⁩", en: "Les poteries et faïences de Bougie (Georges Marçais, 1916)", ur: "بجایہ کے ظروف اور فائنس ⁦(ژورژ مارسے 1916ء)⁩", es: "Les pories et faïences de Bougie (Georges Marçais, 1916)", tr: "Bejaia Seramik ve Seramikler (Georges Marcé 1916)", id: "Keramik dan Keramik Bejaia (Georges Marcé 1916)" }
summary:
  ar: "دراسة لجورج مارسيه ⁦(قسنطينة 1916)⁩ لكسر خزفية إسلامية من بجاية، يؤرخها بين أواخر القرن الحادي عشر والقرن السادس عشر، ويرى أن المدينة ورثت صناعة قلعة بني حماد وصدّرت «الخزف المذهّب» {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}."
  en: "Study by Georges Marçais (Constantine 1916) of Islamic ceramic fragments from Bougie, dated between the late eleventh and sixteenth centuries, arguing that the town inherited the industry of the Qal'a of the Banu Hammad and exported 'golden faience' {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}."
  ur: "ژورژ مارسے کی تحقیق ⁦(قسنطینہ 1916ء)⁩ جو بجایہ کے اسلامی ظروف کے ٹکڑوں پر ہے، جنہیں وہ گیارھویں صدی کے اواخر سے سولھویں صدی تک کا بتاتے ہیں، اور کہتے ہیں کہ شہر نے قلعۂ بنی حماد کی صنعت ورثے میں پائی اور «سنہری فائنس» برآمد کیا {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}۔"
  es: "Estudio de Georges Marçais (Constantine 1916) de fragmentos de cerámica islámica de Bougie, datados entre finales del siglo XI y el siglo XVI, argumentando que la ciudad heredó la industria del Qal'a de los Banu Hammad y exportaba 'loza dorada' {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}."
  fr: "Étude de Georges Marçais (Constantine 1916) sur des fragments de céramique islamique de Bougie, datés entre la fin du XIe et le XVIe siècle, soutenant que la ville a hérité de l'industrie du Qal'a des Banu Hammad et exportait de la « faïence dorée » {cite:marcais-poteries-faiences-bougie-1916 p. 29} {cite:marcais-poteries-faiences-bougie-1916 p. 32} {cite:marcais-poteries-faiences-bougie-1916 p. 33}."
  tr: "Georges Marcé'nin (Constantine 1916) Bejaia'dan İslami seramik parçaları üzerine yaptığı bir çalışma, 11. yüzyıl sonları ile on altıncı yüzyıllar arasında tarihlendirilmiştir ve şehrin Beni Hammad kalesinin zanaatkarlığını miras aldığını ve \"altın kaplama seramikler\" ihraç ettiğine inanmaktadır {cite:marcais-poteries-faiences-bougie-1916 s. 29} {cite:marcais-poteries-faiences-bougie-1916 s. 32} {cite:marcais-poteries-faiences-bougie-1916 s. 33}."
  id: "Sebuah studi oleh Georges Marcé (Constantine 1916) tentang fragmen keramik Islam dari Bejaia, yang menempati tanggalnya antara akhir abad kesebelas hingga abad keenam belas, dan ia percaya bahwa kota ini mewarisi kerajinan benteng Beni Hammad dan mengekspor \"keramik berlapis emas\" {cite:marcais-poteries-faiences-bougie-1916 hlm. 29} {cite:marcais-poteries-faiences-bougie-1916 hlm. 32} {cite:marcais-poteries-faiences-bougie-1916 hlm. 33}."
