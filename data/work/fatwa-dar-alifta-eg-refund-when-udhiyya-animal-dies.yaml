id: work/fatwa-dar-alifta-eg-refund-when-udhiyya-animal-dies
class: work
kind: fatwa
label: { ar: "مدى أحقية المشتري بما دفعه من ثمن الأضحية التي ماتت قبل الذبح", en: "Is the buyer entitled to what he paid for an udhiyya animal that died before slaughter?", ur: "ذبح سے پہلے مرنے والے قربانی کے جانور کی قیمت کی واپسی", es: "¿Tiene derecho el comprador a recibir lo que pagó por un animal udhiyya que murió antes del sacrificio?", fr: "L'acheteur a-t-il droit au remboursement du prix payé pour un animal udhiyya mort avant l'abattage ?" }
summary:
  ar: "سائل سأل عما دفعه من ثمن بهيمة أضحية اشتراها وعاينها ودفع أكثر ثمنها مع الاتفاق على أخذها لاحقًا فماتت قبل الذبح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20821)⁩ ببيان مدى أحقيته بما دفع على وجهه."
  en: "A questioner asked about the price he paid for an udhiyya animal he had bought, inspected and largely paid for, with delivery agreed later — and it died before slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20821) answered by setting out his entitlement to what he paid."
  ur: "ایک سائل نے قربانی کے جانور کی قیمت کے بارے میں پوچھا جو اس نے دیکھ کر خریدا، زیادہ تر قیمت ادا کی اور بعد میں لینے کا اتفاق ہوا لیکن وہ ذبح سے پہلے مر گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20821)⁩ نے جواب میں ادا شدہ رقم کے حق کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre el precio que pagó por un animal udhiyya que había comprado, inspeccionado y pagado casi en su totalidad, con entrega acordada posteriormente, pero que murió antes del sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20821) respondió indicando a qué monto tenía derecho."
  fr: "Un homme a posé une question concernant le prix qu'il avait payé pour un animal d'abattage rituel (udhiyya) qu'il avait acheté, inspecté et dont il avait réglé la majeure partie du prix, la livraison étant prévue ultérieurement; or, l'animal est mort avant d'être abattu. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20821) a répondu en précisant qu'il avait droit au remboursement de sa dette."
