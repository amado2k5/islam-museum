id: work/fatwa-dar-alifta-eg-disclosing-signs-washing-dead
class: work
kind: fatwa
label: { ar: "حرمة إفشاء العلامات السيئة التي تظهر عند تغسيل الموتى", en: "The prohibition on disclosing bad signs seen when washing the dead", ur: "مردوں کے غسل میں دکھائی دینے والی بری علامتیں ظاہر کرنے کی حرمت", es: "La prohibición de revelar malos signos observados al lavar a los muertos", fr: "L'interdiction de divulguer les mauvais signes observés lors du lavage des morts" }
summary:
  ar: "سائل سأل عن إفشاء العلامات السيئة التي تظهر عند تغسيل الموتى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22611)⁩ أن الأصل في الغسل أنه عبادة مبناها الإخلاص والستر لا التجسس والتشهير، فلا يجوز شرعًا جعل التفتيش عن عيوب الموتى أو إفشاء ما يظهر عند غسلهم من علامات سيئة."
  en: "A questioner asked about disclosing bad signs that appear when washing the dead. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22611) answered that washing is at root an act of worship built on sincerity and concealment, not prying and exposure; it is not lawful to make a search for the faults of the dead or to broadcast any bad signs that appear during the washing."
  ur: "ایک سائل نے مردوں کو غسل دیتے وقت دکھائی دینے والی بری علامتیں افشا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22611)⁩ نے جواب دیا کہ غسل بنیادی طور پر ایک عبادت ہے جس کی بنیاد اخلاص اور پردہ داری ہے، جاسوسی اور تشہیر نہیں؛ مردوں کے عیب تلاش کرنا یا غسل کے دوران دکھائی دینے والی بری علامتیں ظاہر کرنا شرعاً جائز نہیں۔"
  es: "Un consultante preguntó sobre la divulgación de malas señales que aparecen al lavar a los muertos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22611) respondió que el lavado es, en esencia, un acto de culto basado en la sinceridad y el secreto, no en la intromisión ni la exposición; no es lícito buscar los defectos de los muertos ni divulgar ninguna mala señal que aparezca durante el lavado."
  fr: "Une personne a posé une question concernant la divulgation de mauvais signes apparaissant lors de la toilette mortuaire. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22611) a répondu que la toilette mortuaire est avant tout un acte d'adoration fondé sur la sincérité et le secret, et non sur l'indiscrétion ou la divulgation; il n'est pas permis de rechercher les défauts du défunt ni de révéler les mauvais signes qui se manifesteraient pendant la toilette."
