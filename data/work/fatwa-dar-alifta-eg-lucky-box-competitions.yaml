id: work/fatwa-dar-alifta-eg-lucky-box-competitions
class: work
kind: fatwa
label: { ar: "حكم الاشتراك في مسابقات صناديق الحظ", en: "Entering 'lucky box' competitions", ur: "لکی باکس مقابلوں میں شرکت", es: "Participar en concursos de \"cajas de la suerte\"", fr: "Participer aux concours de type « boîte à surprise »" }
summary:
  ar: "سائل سأل عن الاشتراك في مسابقات ⁦(صناديق الحظ)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20836)⁩ أن الاشتراك فيها يعد من باب المقامرة وهي حرام شرعًا ويجب على المسلم البعد عن طرق المال المحرمة على ما فصّل الجواب."
  en: "A questioner asked about entering 'lucky box' competitions. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20836) answered that joining them counts as gambling, which is forbidden, and the Muslim must keep clear of unlawful ways of wealth — as the answer details."
  ur: "ایک سائل نے لکی باکس مقابلوں میں شرکت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20836)⁩ نے جواب دیا کہ یہ جوا ہے جو حرام ہے اور مسلمان کو حرام ذرائع آمدن سے بچنا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un participante preguntó sobre la posibilidad de participar en concursos de \"cajas de la suerte\". El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20836) respondió que participar en ellos se considera juego de azar, lo cual está prohibido, y que el musulmán debe mantenerse alejado de las formas ilícitas de obtener riqueza, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la participation aux jeux de hasard. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20836) a répondu que participer à ces jeux est assimilable à du jeu, ce qui est interdit, et que le musulman doit se tenir à l'écart des sources illicites d'enrichissement, comme le précise la réponse."
