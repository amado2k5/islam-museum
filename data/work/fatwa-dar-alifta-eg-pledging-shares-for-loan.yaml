label: { ar: "حكم رهن الأسهم للحصول على قرض", en: "Pledging shares to obtain a loan", ur: "قرض کے لیے حصص رہن رکھنے کا حکم", es: "Pignorar acciones para obtener un préstamo", fr: "Mettre en gage des actions pour obtenir un prêt", tr: "Kredi almak için hisse rehin verilmesi kararı", id: "Putusan tentang penggalian saham untuk memperoleh pinjaman" }
summary:
  ar: "سائل سأل عن رهن الأسهم للحصول على قرض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22259)⁩ أنه يجوز رهن الأسهم للحصول على قرض حسن دون زيادة على قدره ما دامت الأسهم مباحة شرعًا ولم يتضمن العقد غررًا، على ما فصّل الجواب."
  en: "A questioner asked about pledging shares to obtain a loan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22259) answered that shares may be pledged for an interest-free loan without any excess over its amount, provided the shares are themselves lawful and the contract contains no gharar, as the answer details."
  ur: "ایک سائل نے قرض کے لیے حصص رہن رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22259)⁩ نے جواب دیا کہ حصص رہن رکھ کر قرضِ حسن لینا جائز ہے بشرطیکہ اس پر کچھ اضافہ نہ ہو، حصص خود شرعاً مباح ہوں اور عقد میں غرر نہ ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de pignorar acciones para obtener un préstamo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22259) respondió que las acciones pueden pignorarse para obtener un préstamo sin intereses, siempre que no exceda el monto del préstamo, y siempre que las acciones sean lícitas y el contrato no contenga gharar, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le nantissement d'actions pour obtenir un prêt. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22259) a répondu que les actions peuvent être nanties pour un prêt sans intérêt, sans que cela n'excède le montant du prêt, à condition que les actions soient licites et que le contrat ne contienne aucune clause de gharar, comme le précise la réponse."
  tr: "Bir soru soran kişi, kredi almak için hisse rehin verme hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22259), iyi bir krediyi aşmadan pay almak için hisse rehin vermenin, İslam hukukuna göre izin verilen ve gharram (belirsizlik) içermediği sürece kabul edilebilir olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang menggadaikan saham untuk memperoleh pinjaman. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22259) menjawab bahwa dapat menggadaikan saham untuk memperoleh pinjaman yang baik tanpa melebihi jumlahnya, selama saham tersebut diperbolehkan menurut hukum Islam dan tidak melibatkan gharram (ketidakpastian), seperti yang dijelaskan dalam jawaban."
