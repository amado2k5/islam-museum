summary:
  ar: "سائل سأل عن تداول رسائل توديع شهر رمضان المبارك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21794)⁩ أنه لا مانع شرعًا من تداول الرسائل الخاصة بتوديع رمضان لما فيها من تنبيه المسلم بقرب انقضاء موسم الخير على ما فصّل الجواب."
  en: "A questioner asked about circulating messages bidding farewell to the month of Ramadan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21794) answered that there is no sharia barrier to circulating Ramadan-farewell messages, since they remind the Muslim that the season of goodness is nearly spent — as the answer details."
  ur: "ایک سائل نے رمضان کی الوداعی پیغامات کے تبادلے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21794)⁩ نے جواب دیا کہ ان پیغامات کے تبادلے میں شرعاً کوئی ممانعت نہیں کیونکہ وہ نیکی کے موسم کے قریب الاختتام ہونے کی یاد دہانی کراتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
