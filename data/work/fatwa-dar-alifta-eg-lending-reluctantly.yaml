id: work/fatwa-dar-alifta-eg-lending-reluctantly
class: work
kind: fatwa
label: { ar: "حكم إقراض الناس جبرًا لخاطرهم مع كراهية ذلك", en: "Lending to people against one's inclination, out of regard for them", ur: "ناخوشی کے باوجود لوگوں کے خاطر قرض دینا", es: "Prestar dinero a personas en contra de la propia voluntad, por consideración hacia ellas.", fr: "Prêter à autrui contre son gré, par égard pour lui.", tr: "İnsanları zorla borç verme kararı ama bundan nefret etmesi", id: "Aturan tentang meminjamkan orang secara paksa demi mereka sambil membenci itu" }
summary:
  ar: "سائل سأل عن إقراض المال للناس جبرًا لخاطرهم مع كراهيته لذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22122)⁩ أن إقراض المال للناس من أقرب القربات والأصل فيه أن يكون عن تراض لكونه من عقود التبرعات، وإن شابه كراهة النفس فلا يخرجه ذلك عن أجره على ما فصّل الجواب."
  en: "A questioner asked about lending money to people out of regard for them while disliking it inwardly. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22122) answered that lending is among the nearest ways of drawing near to God; it should rest on mutual consent since it is a gratuitous contract, and inward reluctance does not deprive it of reward — as the answer details."
  ur: "ایک سائل نے لوگوں کے خاطر دل میں ناپسندیدگی کے باوجود قرض دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22122)⁩ نے جواب دیا کہ قرض دینا قریب ترین قربتوں میں ہے؛ چونکہ یہ تبرع کا عقد ہے اس لیے اصولاً رضامندی پر ہونا چاہیے، اور دل کی بے رغبتی اس کے اجر کو نہیں چھینتی — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre prestar dinero a la gente por consideración, aunque en el fondo no le guste. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22122) respondió que prestar es una de las maneras más cercanas de acercarse a Dios; debe basarse en el consentimiento mutuo, ya que es un contrato gratuito, y la reticencia interna no lo priva de recompensa, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le prêt d'argent à autrui par bienveillance, malgré une réticence intérieure. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22122) a répondu que le prêt est l'un des moyens les plus directs de se rapprocher de Dieu; il doit reposer sur un consentement mutuel puisqu'il s'agit d'un contrat gratuit, et une réticence intérieure ne le prive pas de récompense, comme le précise la réponse."
  tr: "Bir soru soran kişi, insanlara duygularını tatmin etmek için para vermeyi sordu, oysa bundan hoşlanmadı. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22122), insanlara para ödünç vermenin en yakın bağlılık eylemlerinden biri olduğunu ve orijinal ilkenin bunun karşılıklı anlaşmayla yapılması gerektiğini, çünkü bunun bir bağış sözleşmesi olduğunu yanıtladı. Hoşlanmama eşlik etse bile, bu onun ödülünden mahrum bırakmaz, cevabında detaylandırıldığı gibi."
  id: "Seorang penanya menanyakan tentang meminjamkan uang kepada orang sebagai cara untuk memuaskan perasaan mereka, meskipun ia tidak menyukainya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22122) menjawab bahwa meminjamkan uang kepada orang adalah salah satu tindakan pengabdian yang paling dekat, dan prinsip aslinya adalah harus dilakukan dengan persetujuan bersama karena merupakan kontrak donasi. Meskipun disertai dengan ketidaksukaan, itu tidak menghilangkan ganjarannya, seperti yang dijelaskan dalam jawaban."
