id: work/fatwa-amja-brotherhood-classification
class: work
kind: fatwa
label: { ar: "حكم وصف الجماعات الدعوية بالضلالة", en: "Classifying dawa groups as deviant", ur: "دعوتی جماعتوں کو گمراہ کہنے کا ضابطہ", es: "Clasificar a los grupos dawa como desviados", fr: "Classer les groupes dawa comme déviants" }
summary:
  ar: "سأل سائل ثلاثة أسئلة عن جماعة الإخوان المسلمين منها هل هي من الجماعات الضالة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87474 بتاريخ 21 سبتمبر 2012)⁩ أنه ليس من سنة المجمع الحديث عن الجماعات والرموز الدعوية وإنما يصف الحق والباطل ويترك للمستفتي تحقيق المناط، ولا يكون التجمع الدعوي فرقة من الفرق إلا إذا تحزب على أصل كلي بدعي يخالف الثابت بالكتاب والسنة والإجماع أو على بدع مخترعة تغلب على سعيه، ولا يعرفون ذلك عن جماعة الإخوان المسلمين بل تجمع دعوي انتصب لنصرة الشريعة وإقامة الدولة الإسلامية فهي لا تصنف في تلك الفرق، وإن عرف ذلك عن فصيل منها في قطر بعينه وسم به بعينه ولا يتعدى حكمه، وأجاب عن بقية أسئلته على ما فصّل."
  en: "A questioner put three questions about the Muslim Brotherhood, including whether it counts among the deviant groups. Dr. Salah al-Sawi (fatwa no. 87474, 21 September 2012) answered that it is not the Assembly's practice to discuss dawa groups and figures — it describes truth and falsehood and leaves the questioner to apply the criterion; a dawa collective is not a deviant faction unless it rallies around an innovated root principle contradicting what is fixed by Book, sunna and consensus, or around novel practices that dominate its striving, and they know no such thing of the Muslim Brotherhood, a dawa collective standing for the sharia's support and an Islamic state — it is not classed among those factions; if a branch in a given country is known for that, that branch alone bears the mark without the ruling spreading beyond it — and he answered the remaining questions as detailed. Recorded as AMJA's answer."
  ur: "ایک سائل نے اخوان المسلمین کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87474، 21 ستمبر 2012)⁩ کے مطابق مجمع جماعتوں پر بات نہیں کرتا بلکہ اصول بیان کرتا ہے؛ اس کی رو سے اخوان گمراہ فرقوں میں شمار نہیں، البتہ کسی خاص ملک کے شعبے کو جدا دیکھا جائے۔"
  es: "Un interlocutor formuló tres preguntas sobre los Hermanos Musulmanes, incluyendo si se les considera grupos desviados. El Dr. Salah al-Sawi (fatwa n.º 87474, 21 de septiembre de 2012) respondió que no es práctica de la Asamblea debatir sobre grupos y figuras de la dawa; se trata de describir la verdad y la falsedad, dejando al interlocutor la tarea de aplicar el criterio. Un colectivo de dawa no es una facción desviada a menos que se agrupe en torno a un principio fundamental innovador que contradiga lo establecido por el Libro, la Sunna y el consenso, o en torno a prácticas novedosas que dominen su actividad. La Asamblea desconocía tal cosa respecto a los Hermanos Musulmanes, un colectivo de dawa que defiende la sharia y un Estado islámico; no se le clasifica entre esas facciones. Si una rama en un país determinado es conocida por ello, solo esa rama lleva la marca sin que la norma se extienda más allá de ella. Respondió a las preguntas restantes con detalle. Registrado como respuesta de AMJA."
  fr: "Un intervenant a posé trois questions concernant les Frères musulmans, notamment celle de savoir s'ils comptent parmi les groupes déviants. Le Dr Salah al-Sawi (fatwa n° 87474, 21 septembre 2012) a répondu que l'Assemblée n'a pas pour pratique de discuter des groupes et personnalités de la da'wa; elle se contente de décrire le vrai et le faux et laisse à l'intervenant le soin d'appliquer le critère. Un collectif de da'wa n'est pas une faction déviante à moins qu'il ne se rallie à un principe fondamental novateur contredisant ce qui est établi par le Coran, la Sunna et le consensus, ou à des pratiques nouvelles qui dominent son action. Or, l'Assemblée n'a connaissance d'aucun cas similaire chez les Frères musulmans, un collectif de da'wa prônant le soutien à la charia et à un État islamique; ils ne sont donc pas classés parmi ces factions. Si une branche dans un pays donné est connue pour cela, seule cette branche en porte la marque, sans que la décision ne s'étende au-delà. Il a ensuite répondu aux autres questions de manière détaillée. Cette réponse a été consignée dans l'AMJA."
