summary:
  ar: "كتاب زكريا بن محمد القزويني صاحب عجائب المخلوقات، على مقدمة وسبعة أقاليم، جمع فيه ما عرف وسمع وشاهد من خصائص البلاد والعباد، وتاريخ تأليفه سنة أربع وسبعين وست مئة {cite:kashf-zunun-furqan p. 179-180}."
  en: "Qazwini's geography — a muqaddima and seven climes gathering what he knew, heard and witnessed of the lands' and peoples' peculiarities, dated 674 {cite:kashf-zunun-furqan p. 179-180}."
  es: "La geografía de Qazwini — un muqaddima y siete climas que recopilan lo que sabía, oyó y presenció sobre las peculiaridades de las tierras y los pueblos, fechada en 674 {cite:kashf-zunun-furqan p. 179-180}."
  fr: "La géographie de Qazwini — une muqaddima et sept climats rassemblant ce qu'il savait, entendait et dont il avait été témoin des particularités des terres et des peuples, datée de 674 {cite:kashf-zunun-furqan p. 179-180}."
  ur: "قزوینی کا جغرافیہ - ایک مقدّمہ اور سات موسموں کو جمع کرتے ہوئے جو اس نے زمینوں اور لوگوں کی خصوصیات کے بارے میں جانا، سنا اور دیکھا، تاریخ 674۔ 179-180}۔"
  tr: "Yaratılış Mucizeleri'nin yazarı Zakeriye ibn Muhammed el-Kazwini'nin kitabı, önsöz ve yedi bölgeyle birlikte, toprakların ve halklarının özellikleri hakkında bilinen, duyulan ve tanıklık edilenleri derlediği ve yazıldığı tarihin 1674 yılına ait olduğu belirtilmiştir {atıf:kashf-zunun-furqan, s. 179-180}."
  id: "Kitab Zakariya ibn Muhammad al-Qazwini, penulis Keajaiban Penciptaan, dengan pengantar dan tujuh wilayah, di mana ia mengumpulkan apa yang diketahui, didengar, dan disaksikan tentang karakteristik tanah dan penduduknya, dan tanggal penyusunannya adalah tahun 1674 {cite:kashf-zunun-furqan, hlm. 179-180}."
