id: work/fatwa-amja-menses-breaks-istihada
class: work
kind: fatwa
label: { ar: "انقطاع دم الحيض وعودته", en: "Menses that stops and returns within its span", ur: "حیض کا ٹہرنا اور لوٹنا", es: "Menstruación que se detiene y regresa dentro de su lapso", fr: "Des règles qui s'arrêtent et reviennent au cours de leur cycle." }
summary:
  ar: "سألت امرأة أن دم حيضها يأتي خمسة أيام ثم يتوقف ثم يعود. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82054 بتاريخ 5 أغسطس 2010)⁩ أنه إذا كان مجموع هذه الأيام لا يتجاوز أقصى مدة الحيض وهي خمسة عشر يومًا فجميع ما تراه المرأة من الدم في هذه الفترة حيض، وأما ما يتخللها من نقاء فللعلماء فيه قولان: منهم من يقول إنه طهر صحيح فيجب عليها الاغتسال إذا رأته والصلاة، ومنهم من يقول إنه من الحيض فلا تغتسل على ما فصّل الجواب من الموازنة بين القولين."
  en: "A woman said her menstrual blood comes five days, stops, then returns. Dr. Salah al-Sawi (fatwa no. 82054, 5 August 2010) answered that if the days' total does not exceed menses' utmost span — fifteen days — all the blood she sees in that span is menses; as for the intervening clearness, the scholars have two sayings: some count it true purity, so she must wash and pray on seeing it; others count it of the menses, so she does not wash — the answer weighing between them."
  ur: "حیض ٹہر کر لوٹ آئے تو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82054، 5 اگست 2010)⁩ کے مطابق پندرہ دن کے اندر سب خون حیض ہے؛ بیچ کی صفائی پر دو قول ہیں۔"
  es: "Una mujer dijo que su sangrado menstrual aparece durante cinco días, se detiene y luego regresa. El Dr. Salah al-Sawi (fatwa n.° 82054, 5 de agosto de 2010) respondió que si el total de días no excede la duración máxima de la menstruación (quince días), todo el sangrado que ve durante ese período es menstruación; en cuanto a la claridad intermedia, los eruditos tienen dos opiniones: algunos lo consideran pureza verdadera, por lo que debe lavarse y orar al verlo; otros lo consideran parte de la menstruación, por lo que no debe lavarse; la respuesta depende de ambas opiniones."
  fr: "Une femme a rapporté que ses règles duraient cinq jours, s'arrêtaient, puis revenaient. Le Dr Salah al-Sawi (fatwa n° 82054, 5 août 2010) a répondu que si la durée totale des règles ne dépasse pas quinze jours, la durée maximale des menstruations, alors tout le sang observé pendant cette période est considéré comme faisant partie des menstruations. Quant aux saignements entre les saignements, les savants ont deux avis: certains les considèrent comme une pureté absolue, auquel cas la femme doit se laver et prier; d'autres les considèrent comme faisant partie des menstruations, auquel cas il n'est pas nécessaire de se laver. La réponse se situe entre ces deux extrêmes."
