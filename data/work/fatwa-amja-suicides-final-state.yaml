id: work/fatwa-amja-suicides-final-state
class: work
kind: fatwa
label: { ar: "مآل المنتحر عند أهل السنة", en: "The suicide's fate — the Sunni position of hope and fear", ur: "خودکشی کرنے والے کا انجام — اہل سنت کا موقف", es: "El destino del suicida: la postura sunita de esperanza y temor.", fr: "Le destin du suicidé — la position sunnite d'espoir et de peur", tr: "Ehl-sünnet'e göre intihar edenin akıbeti", id: "Nasib orang yang bunuh diri menurut Ahl al-Sunnah" }
summary:
  ar: "سأل سائل عن مريض انتحر ما مآله عند الله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77562 بتاريخ 25 يناير 2009)⁩ أن المريض المنتحر مضى إلى جوار ربه وحسابه على الله ونرجو أن تكون علته النفسية قد اشتدت به فدفعته إلى الانتحار على غير إرادة حرة فيكون في إطار عفو الله، وهذا أمر لا سبيل إلى معرفته على وجه التحقيق فلا يتدخل بين الله وعباده فيه، ولا يستغل كثيرًا بمآلات الناس في الآخرة فهو مفوض إلى خالقهم، وموقف أهل السنة في مآلات أهل القبلة أنهم يرجون للمحسنين ويخافون على المسيئين ولا يجزمون لمعين بجنة ونار إلا من وردت فيه نصوص تخبر بمآله."
  en: "A questioner asked about the hereafter-fate of a sick man who killed himself. Dr. Salah al-Sawi (fatwa no. 77562, 25 January 2009) answered that the man has gone to his Lord and his account is on God; it is hoped his mental illness had grown so severe it drove him to suicide without free will, placing him within God's pardon — a matter none can now truly know and none should interpose between God and His servants; one should not be much occupied with people's final fates, consigned to their Creator; the Sunni position on the people of the qibla is hope for the well-doers and fear for the wrongdoers, with no certain verdict for any individual — paradise or fire — absent a text declaring his fate."
  ur: "ایک سائل نے خودکشی کرنے والے مریض کے انجام کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77562، 25 جنوری 2009)⁩ کے مطابق حساب اللہ کے سپرد ہے اور نفسیاتی علت شاید اسے معافی کے دائرے میں لائے؛ اہل سنت نیکوں کے لیے امید اور برے کے لیے خوف رکھتے ہیں۔"
  es: "Un consultante preguntó sobre el destino en el más allá de un hombre enfermo que se suicidó. El Dr. Salah al-Sawi (fatwa n.° 77562, 25 de enero de 2009) respondió que el hombre ha ido a su Señor y su cuenta está en manos de Dios; se espera que su enfermedad mental se haya agravado tanto que lo haya llevado al suicidio sin libre albedrío, colocándolo dentro del perdón de Dios, un asunto que nadie puede saber con certeza y en el que nadie debería interponerse entre Dios y Sus siervos; no se debe preocupar demasiado por el destino final de las personas, que está en manos de su Creador; la postura sunita sobre la gente de la qibla es de esperanza para los que obran bien y temor para los que obran mal, sin un veredicto certero para ningún individuo —paraíso o fuego— a falta de un texto que declare su destino."
  fr: "Un internaute a posé une question sur le sort après la mort d'un malade qui s'est suicidé. Le Dr Salah al-Sawi (fatwa n° 77562, 25 janvier 2009) a répondu que cet homme est allé auprès de son Seigneur et que son sort est entre les mains de Dieu. Il est à espérer que sa maladie mentale ait atteint un tel degré de gravité qu'elle l'ait poussé au suicide contre son gré, le plaçant ainsi sous la protection divine – une chose que nul ne peut désormais connaître avec certitude et sur laquelle nul ne doit s'interposer entre Dieu et Ses serviteurs. Il ne faut pas s'inquiéter outre mesure du destin final des personnes, qui relève de leur Créateur. La position sunnite concernant les fidèles de la qibla est celle de l'espoir pour les bienfaisants et de la crainte pour les malfaisants, sans verdict certain pour aucun individu – paradis ou enfer – en l'absence d'un texte déclarant son destin."
  tr: "İntihar eden bir hasta hakkında soru soruldu: Allah ile kaderi nedir? Dr. Salah Al-Sawy (25 Ocak 2009 tarihli 77562 sayılı fetva) intihar eden hastanın Rab'be vefat ettiğini ve hesabının Allah'ta olduğunu yanıtladı. Umarız psikolojik hastalığı kötüleşmiş ve isteği dışında intihar etmeye itmiştir, böylece Allah'ın bağışlaması çerçevesindedir. Bu tam olarak anlaşılamayan bir şeydir, bu yüzden Allah ile kulleri arasında müdahale etmez ve ahiret halkının kaderini Yaratıcılarına emanet ettiği gibi sömürmez. Ahl-sünnetin kıble ahlilerinin akıbeti hakkındaki duruşu, iyilik yapanları ummak, kötü işleyenlerden korkmak ve bir kişiyi, kaderini bildiren ayetlerde bahsedilenler dışında cennet ve cehennemde bir kişi için yargılamamaktır."
  id: "Seorang penanya ditanya tentang seorang pasien yang bunuh diri: apa nasibnya di hadapan Allah. Dr. Salah Al-Sawy menjawab (Fatwa No. 77562 tanggal 25 Januari 2009) bahwa pasien yang bunuh diri telah wafat kepada Tuhan-Nya, dan perhitungannya adalah kepada Allah. Kami berharap penyakit psikologisnya semakin parah dan mendorongnya untuk bunuh diri tanpa kehendaknya, sehingga hal itu berada dalam kerangka pengampunan Allah. Ini adalah sesuatu yang tidak dapat dipahami sepenuhnya, sehingga dia tidak ikut campur antara Allah dan hamba-Nya dalam hal ini, juga tidak mengeksploitasi nasib orang-orang di akhirat, karena dia dipercayakan kepada Pencipta mereka. Posisi Ahl al-Sunnah mengenai nasib umat Kiblat adalah mereka berharap kepada para pelaku kebaikan, takut pada pelaku kesalahan, dan tidak menghakimi seseorang atas dasar orang di Surga dan Neraka kecuali bagi mereka yang nasibnya disebutkan dalam ayat-ayat yang memberitahu nasib mereka."
