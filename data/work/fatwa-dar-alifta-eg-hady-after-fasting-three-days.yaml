id: work/fatwa-dar-alifta-eg-hady-after-fasting-three-days
class: work
kind: fatwa
label: { ar: "حكم الهدي لمن صام ثلاثة أيام في الحج ثم قدر عليه", en: "The hady for one who fasted three days in Hajj then gained the means", ur: "حج میں تین روزے رکھنے والے پر ہدی جب وہ بعد میں استطاعت پائے", es: "El hady para quien ayunó tres días en el Hajj luego obtuvo los medios" }
summary:
  ar: "سائل سأل عن رجل صام ثلاثة أيام في الحج بدلًا عن الهدي حيث لم تكن لديه القدرة المالية ثم قدر عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20831)⁩ أنه لا يجب عليه الهدي بعدما صام ثلاثة أيام بدلًا عنه حيث لم تكن لديه القدرة على ما فصّل الجواب."
  en: "A questioner asked about a man who fasted three days in Hajj in place of the hady for lack of means, then gained the ability. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20831) answered that the hady is not due from him since he fasted three days in its place while he lacked ability — as the answer details."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس نے استطاعت نہ ہونے پر ہدی کے بدلے حج میں تین روزے رکھے پھر بعد میں استطاعت پائی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20831)⁩ نے جواب دیا کہ اس پر ہدی واجب نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un hombre que ayunó tres días durante el Hajj en lugar del hady por falta de recursos, y que posteriormente adquirió la capacidad para realizarlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20831) respondió que no le corresponde realizar el hady, ya que ayunó tres días en su lugar mientras carecía de la capacidad para hacerlo, como se detalla en la respuesta."
