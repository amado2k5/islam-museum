id: work/fatwa-amja-attributing-feeling-to-god
class: work
kind: fatwa
label: { ar: "الشعور صفة لله؟", en: "Attributing feeling to God — the names are revealed", ur: "اللہ کے لیے شعور کا صفت کہنا", es: "Atribuir sentimientos a Dios: los nombres se revelan", fr: "Attribuer des sentiments à Dieu — les noms sont révélés" }
summary:
  ar: "سأل سائل عن قول قائل وتألمت ولم يشعر بألمي سواك هل تنسب صفة الشعور لله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21873 بتاريخ 28 نوفمبر 2007)⁩ أن الأصل أن أسماء الله وصفاته توقيفية فينبغي أن يقال ولم يعلم بألمي سواك."
  en: "A questioner asked about the line 'I suffered, and none but You felt my pain' — may feeling be attributed to God? Dr. Salah al-Sawi (fatwa no. 21873, 28 November 2007) answered that the rule is God's names and attributes are revealed, not coined — it should rather be said 'none but You knew my pain'."
  ur: "ایک سائل نے «میرے درد کو تمھارے سوا کسی نے محسوس نہیں کیا» کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21873، 28 نومبر 2007)⁩ کے مطابق اسماء و صفات توقیفی ہیں — «تمی علم نہ تھا» کہنا چاہیے۔"
  es: "Un interlocutor preguntó sobre la frase «Sufrí, y solo Tú sentiste mi dolor»: ¿puede atribuirse el sentimiento a Dios? El Dr. Salah al-Sawi (fatwa n.º 21873, 28 de noviembre de 2007) respondió que la regla es que los nombres y atributos de Dios son revelados, no inventados; más bien debería decirse «solo Tú conociste mi dolor»."
  fr: "Un internaute a posé une question concernant la phrase « J’ai souffert, et nul autre que Toi n’a ressenti ma douleur »: peut-on attribuer cette sensation à Dieu ? Le Dr Salah al-Sawi (fatwa n° 21873, 28 novembre 2007) a répondu que, selon la règle, les noms et attributs de Dieu sont révélés et non inventés; il faudrait plutôt dire: « Nul autre que Toi n’a connu ma douleur »."
