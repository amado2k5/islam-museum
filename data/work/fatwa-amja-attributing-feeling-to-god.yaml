id: work/fatwa-amja-attributing-feeling-to-god
class: work
kind: fatwa
label: { ar: "الشعور صفة لله؟", en: "Attributing feeling to God — the names are revealed", ur: "اللہ کے لیے شعور کا صفت کہنا" }
summary:
  ar: "سأل سائل عن قول قائل وتألمت ولم يشعر بألمي سواك هل تنسب صفة الشعور لله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21873 بتاريخ 28 نوفمبر 2007)⁩ أن الأصل أن أسماء الله وصفاته توقيفية فينبغي أن يقال ولم يعلم بألمي سواك."
  en: "A questioner asked about the line 'I suffered, and none but You felt my pain' — may feeling be attributed to God? Dr. Salah al-Sawi (fatwa no. 21873, 28 November 2007) answered that the rule is God's names and attributes are revealed, not coined — it should rather be said 'none but You knew my pain'."
  ur: "ایک سائل نے «میرے درد کو تمھارے سوا کسی نے محسوس نہیں کیا» کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21873، 28 نومبر 2007)⁩ کے مطابق اسماء و صفات توقیفی ہیں — «تمی علم نہ تھا» کہنا چاہیے۔"
