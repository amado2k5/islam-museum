summary:
  ar: "ألبوم ريمكسات من ألبومي نصرت فتح علي خان ومايكل بروك «مست مست» و«Night Song»، صدر عن ريل وورلد سنة 1997 بعد وفاة نصرت في أغسطس من السنة نفسها وأُهدي إلى ذكراه؛ أعاد مزج مقطوعاته فنانون بريطانيون آسيويون منهم تالفين سينغ وأيجن داب فاونديشن ونيتين سوني."
  en: "A remix album from Nusrat Fateh Ali Khan and Michael Brook's Mustt Mustt and Night Song, released by Real World in 1997 after Khan's death that August and dedicated to his memory; its remixers include Talvin Singh, Asian Dub Foundation and Nitin Sawhney."
  ur: "نصرت فتح علی خان اور مائیکل بروک کے «مست مست» اور «نائٹ سونگ» کے ریمکسز کا البم، جو اگست 1997 میں نصرت کی وفات کے بعد اسی سال ریئل ورلڈ سے جاری ہوا اور ان کی یاد کے نام کیا گیا۔"
  es: "Un álbum de remezclas de \"Must Mustt\" y \"Night Song\" de Nusrat Fateh Ali Khan y Michael Brook, publicado por Real World en 1997 tras la muerte de Khan en agosto de ese año y dedicado a su memoria; entre sus remezcladores se encuentran Talvin Singh, Asian Dub Foundation y Nitin Sawhney."
  fr: "Un album de remixes de Mustt Mustt et Night Song de Nusrat Fateh Ali Khan et Michael Brook, sorti chez Real World en 1997 après la mort de Khan en août de la même année et dédié à sa mémoire; parmi ses remixeurs figurent Talvin Singh, Asian Dub Foundation et Nitin Sawhney."
  tr: "Nusrat Fateh Ali Khan ve Michael Brook albümlerinden oluşan \"Mist Mist\" ve \"Night Song\" adlı remix albümleri, Nusrat'ın aynı yılın Ağustos ayında vefatından sonra 1997'de Real World tarafından yayımlandı ve onun anısına ithaf edildi; parçaları Talvin Singh, Aigen Dab Foundation ve Nitin Soni gibi İngiliz-Asyalı sanatçılar tarafından remikslendi."
  id: "Album remix dari album Nusrat Fateh Ali Khan dan Michael Brook, \"Mist Mist\" dan \"Night Song,\" dirilis oleh Real World pada tahun 1997 setelah kematian Nusrat pada Agustus tahun yang sama dan didedikasikan untuk mengenangnya; lagu-lagunya di-remix oleh artis Inggris-Asia termasuk Talvin Singh, Aigen Dab Foundation, dan Nitin Soni."
