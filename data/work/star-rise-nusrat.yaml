summary:
  ar: "ألبوم ريمكسات من ألبومي نصرت فتح علي خان ومايكل بروك «مست مست» و«Night Song»، صدر عن ريل وورلد سنة 1997 بعد وفاة نصرت في أغسطس من السنة نفسها وأُهدي إلى ذكراه؛ أعاد مزج مقطوعاته فنانون بريطانيون آسيويون منهم تالفين سينغ وأيجن داب فاونديشن ونيتين سوني."
  en: "A remix album from Nusrat Fateh Ali Khan and Michael Brook's Mustt Mustt and Night Song, released by Real World in 1997 after Khan's death that August and dedicated to his memory; its remixers include Talvin Singh, Asian Dub Foundation and Nitin Sawhney."
  ur: "نصرت فتح علی خان اور مائیکل بروک کے «مست مست» اور «نائٹ سونگ» کے ریمکسز کا البم، جو اگست 1997 میں نصرت کی وفات کے بعد اسی سال ریئل ورلڈ سے جاری ہوا اور ان کی یاد کے نام کیا گیا۔"
