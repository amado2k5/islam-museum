id: work/fatwa-islamweb-dreaming-of-blasphemy
class: work
kind: fatwa
label: { ar: "من رأى في نومه أنه يشتم الذات الإلهية", en: "Dreaming that one has uttered blasphemy", ur: "خواب میں خود کو اللہ کی شان میں گستاخی کرتے دیکھنا" }
summary:
  ar: "سائل ملتزم بالصلاة رأى في منامه أنه يسب الرب، بعد أيام من سماعه شخصًا يفعل ذلك في مكالمة، ويسأل عن حكمه. أجاب مركز الفتوى في إسلام ويب بأنه لا يؤاخذ بما يرى في منامه أنه قاله أو فعله، لأن النائم مرفوع عنه التكليف حتى يستيقظ، واستدل بحديث رفع القلم عن ثلاثة."
  en: "A practising questioner dreamt that he had cursed God, a few days after overhearing someone do so in a phone call, and asks what the ruling is. The IslamWeb fatwa centre answered that he is not held to account for anything he sees himself saying or doing in a dream, because the sleeper is free of legal responsibility until he wakes, citing the hadith that the pen is lifted from three."
  ur: "ایک نمازی سائل نے، ایک فون کال میں کسی کو ایسا کرتے سننے کے چند دن بعد، خواب دیکھا کہ وہ رب کو برا بھلا کہہ رہا ہے، اور اس کا حکم پوچھتا ہے۔ اسلام ویب کے مرکزِ فتویٰ نے جواب دیا کہ خواب میں جو کچھ وہ کہتا یا کرتا دیکھے اس پر مؤاخذہ نہیں، کیونکہ سویا ہوا شخص جاگنے تک مکلف نہیں، اور اس پر اس حدیث سے استدلال کیا کہ تین افراد سے قلم اٹھا لیا گیا ہے۔"
