summary:
  ar: "كتاب الخوارزمي في الجبر والمقابلة. يذكر محققا طبعة القاهرة سنة 1939 أنه في مقدمة كتب تراثهم العلمي التي يعتنون بنشرها {cite:khwarizmi-jabr-cairo-1939 p.11}، وأن مخطوطهم الأصلي نسخة كُتبت بعد وفاة المؤلف بنحو خمسمائة سنة، فقد يحمل أخطاء نسخ {cite:khwarizmi-jabr-cairo-1939 p.12}."
  en: "al-Khwarizmi's treatise on al-jabr and al-muqabala. The editors of the 1939 Cairo edition place it first among the scientific books of their heritage they chose to publish, and note that their base manuscript was a copy made about five hundred years after the author's death, so the text may carry copying errors."
