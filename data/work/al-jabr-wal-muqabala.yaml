label: { ar: "كتاب الجبر والمقابلة", en: "al-Kitab al-mukhtasar fi Hisab al-Jabr wal-Muqabala (The Algebra of al-Khwarizmi)", es: "al-Kitab al-mukhtasar fi Hisab al-Jabr wal-Muqabala (El álgebra de al-Khwarizmi)", fr: "al-Kitab al-mukhtasar fi Hisab al-Jabr wal-Muqabala (L'Algèbre d'al-Khwarizmi)", ur: "الکتاب المختصر فی حساب الجبر والمقابلہ ⁦(الخوارزمی کا الجبرا)⁩" }
summary:
  ar: "كتاب مختصر في حساب الجبر والمقابلة ألّفه محمد بن موسى الخوارزمي في عهد المأمون، يذكر في مقدمته أنه وضعه لحاجة الناس في المواريث والوصايا والمقاسمات والتجارات ومساحة الأرضين {cite:khwarizmi-jabr-cairo-1939 p.30}. يبدأ بالضروب الستة للمعادلات وبراهينها الهندسية، ثم أبواب الضرب والجمع والنقصان والمسائل، ثم المعاملات والمساحة، ثم كتاب الوصايا وحساب الدور {cite:khwarizmi-jabr-cairo-1939 p.35}."
  en: "A concise book on reckoning by al-jabr and al-muqabala written by Muhammad ibn Musa al-Khwarizmi under the caliph al-Ma'mun, which its preface says was made for people's needs in inheritance, bequests, partitions, trade and land measurement. It opens with the six types of equation and their geometric proofs, then multiplication, addition and subtraction of terms and worked problems, then commercial transactions and mensuration, then a book of bequests including the circular-reckoning problems."
  es: "Un libro conciso sobre el cálculo de bienes según Al-Jabr y Al-Muqabala, escrito por Muhammad ibn Musa al-Khwarizmi bajo el califa Al-Ma'mun, cuyo prefacio indica que fue creado para satisfacer las necesidades de la gente en materia de herencias, legados, particiones, comercio y medición de tierras. Comienza con los seis tipos de ecuaciones y sus demostraciones geométricas, seguido de la multiplicación, la suma y la resta de términos y problemas resueltos, luego las transacciones comerciales y la medición, y finalmente un libro sobre legados que incluye problemas de cálculo circular."
  fr: "Un ouvrage concis sur le calcul selon al-jabr et al-muqabala, écrit par Muhammad ibn Musa al-Khwarizmi sous le calife al-Ma'mun. Sa préface indique qu'il était destiné à répondre aux besoins des gens en matière d'héritage, de legs, de partage, de commerce et de mesurage foncier. Il s'ouvre sur les six types d'équations et leurs démonstrations géométriques, puis aborde la multiplication, l'addition et la soustraction de termes ainsi que des problèmes résolus, ensuite les transactions commerciales et la géométrie, et enfin un livre sur les legs incluant les problèmes de calcul circulaire."
  ur: "حساب کتاب پر ایک جامع کتاب الجبر اور المقابلہ جو محمد بن موسیٰ الخوارزمی نے خلیفہ المامون کے دور میں لکھی ہے، جس کا پیش لفظ کہتا ہے کہ وراثت، وصیت، تقسیم، تجارت اور زمین کی پیمائش میں لوگوں کی ضروریات کے لیے بنائی گئی تھی۔ یہ چھ قسم کی مساوات اور ان کے ہندسی ثبوتوں کے ساتھ کھلتا ہے، پھر شرائط اور کام کے مسائل کی ضرب، اضافہ اور گھٹاؤ، پھر تجارتی لین دین اور حیض، پھر وصیت کی کتاب بشمول سرکلر حساب کے مسائل۔"
