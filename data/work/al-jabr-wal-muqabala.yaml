kind: book
label: { ar: "كتاب الجبر والمقابلة", en: "al-Kitab al-mukhtasar fi Hisab al-Jabr wal-Muqabala (The Algebra of al-Khwarizmi)" }
summary:
  ar: "كتاب مختصر في حساب الجبر والمقابلة ألّفه محمد بن موسى الخوارزمي في عهد المأمون، يذكر في مقدمته أنه وضعه لحاجة الناس في المواريث والوصايا والمقاسمات والتجارات ومساحة الأرضين {cite:khwarizmi-jabr-cairo-1939 p.30}. يبدأ بالضروب الستة للمعادلات وبراهينها الهندسية، ثم أبواب الضرب والجمع والنقصان والمسائل، ثم المعاملات والمساحة، ثم كتاب الوصايا وحساب الدور {cite:khwarizmi-jabr-cairo-1939 p.35}."
  en: "A concise book on reckoning by al-jabr and al-muqabala written by Muhammad ibn Musa al-Khwarizmi under the caliph al-Ma'mun, which its preface says was made for people's needs in inheritance, bequests, partitions, trade and land measurement. It opens with the six types of equation and their geometric proofs, then multiplication, addition and subtraction of terms and worked problems, then commercial transactions and mensuration, then a book of bequests including the circular-reckoning problems."
