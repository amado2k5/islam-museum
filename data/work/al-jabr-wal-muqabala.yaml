structure: "Preface (scan pp. 29-30); the three kinds of number and the six types (scan pp. 30-35); geometric proofs of the three compound types (scan pp. 35-43); bab al-darb, multiplication of terms (scan pp. 43-46); bab al-jam' wal-nuqsan, addition and subtraction including surds (scan pp. 46-50); bab al-masa'il al-sitt, six model problems (scan pp. 50-54); bab al-masa'il al-mukhtalifa, miscellaneous problems (scan pp. 54-69); bab al-mu'amalat, transactions (scan pp. 69-70); bab al-misaha, mensuration (scan pp. 70-82); kitab al-wasaya, bequests, with bab al-'ayn wal-dayn, further bequest chapters, al-wasiyya bil-dirham, al-takmila, hisab al-dawr (marriage, manumission, acknowledgement and salam in final illness) (scan pp. 83-122). Scan pages of the Cairo 1939 edition."
