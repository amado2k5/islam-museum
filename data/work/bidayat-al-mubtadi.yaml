summary:
  ar: "متن في الفقه الحنفي ألّفه المرغيناني أولاً، جمع فيه بين مختصر القدوري والجامع الصغير لمحمد بن الحسن، ولم يتجاوزهما إلا فيما دعت الضرورة إليه لكثرة وقوعه، ورتّبه على ترتيب الجامع الصغير؛ ثم شرحه في كفاية المنتهي ثم في الهداية. {cite:hidaya-bakdash-v1 p.7} {cite:hidaya-bakdash-v1 p.50} {cite:hidaya-bakdash-v1 p.51}"
  en: "A Hanafi base text that al-Marghinani wrote first, combining al-Quduri's Mukhtasar with Muhammad ibn al-Hasan's al-Jami' al-Saghir, going beyond them only where frequent cases required, and following the order of al-Jami' al-Saghir; he then commented on it in Kifayat al-Muntahi and in al-Hidaya."
  ur: "مرغینانی کا پہلا لکھا ہوا حنفی متن، جس میں انہوں نے مختصر القدوری اور محمد بن الحسن کی الجامع الصغیر کو جمع کیا، اور ان سے صرف وہاں آگے بڑھے جہاں کثرتِ وقوع کی وجہ سے ضرورت تھی، اور اسے الجامع الصغیر کی ترتیب پر رکھا؛ پھر اس کی شرح کفایۃ المنتہی اور پھر الہدایہ میں کی۔"
  es: "Un texto base hanafí que al-Marghinani escribió primero, combinando el Mukhtasar de al-Quduri con al-Jami' al-Saghir de Muhammad ibn al-Hasan, yendo más allá de ellos solo cuando era necesario en casos frecuentes, y siguiendo el orden de al-Jami' al-Saghir; luego lo comentó en Kifayat al-Muntahi y en al-Hidaya."
  fr: "Un texte de base hanafite qu'al-Marghinani a écrit en premier, combinant le Mukhtasar d'al-Quduri avec al-Jami' al-Saghir de Muhammad ibn al-Hasan, allant au-delà seulement là où les cas fréquents l'exigeaient, et suivant l'ordre d'al-Jami' al-Saghir; il l'a ensuite commenté dans Kifayat al-Muntahi et dans al-Hidaya."
  tr: "Hanefi fıkıhı üzerine bir metin, ilk olarak Al-Marghinani tarafından yazılmıştır; burada Mukhtasar al-Quduri ile Muhammed ibn al-Hasan'ın al-Jami'al-Saghir'ini birleştirmiş ve sıkça geçtikleri için gerektiğinde aşmıştır. Bunları Al-Jami'al-Saghir sırasına göre düzenlemiş; ardından Kifayat al-Muntaha'da ve ardından al-Hidayah'da açıklamıştır. {cite:hideya-bakdash-v1 s.7} {cite:hidaya-bakdash-v1 s.50} {cite:hidaya-bakdash-v1 s.51}"
  id: "Sebuah teks tentang fiqhologi Hanafi yang pertama kali ditulis oleh Al-Marghinani, di mana ia menggabungkan Mukhtasar al-Quduri dan al-Jami' al-Saghir karya Muhammad ibn al-Hasan, dan hanya melebihinya jika diperlukan karena sering terjadi. Ia menyusunnya sesuai urutan Al-Jami' al-Saghir; kemudian menjelaskannya dalam Kifayat al-Muntaha dan kemudian dalam al-Hidayah. {cite:hidaya-bakdash-v1 hlm.7} {cite:hidaya-bakdash-v1 hlm.50} {cite:hidaya-bakdash-v1 hlm.51}"
