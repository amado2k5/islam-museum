id: work/fatwa-amja-wiping-over-shoes
class: work
kind: fatwa
label: { ar: "المسح على الحذاء", en: "Wiping over the shoe or khuff — terms and times", ur: "جوتے پر مسح — شرائط و مدت", es: "Limpiar el zapato o khuff: términos y tiempos" }
summary:
  ar: "سأل سائل عن حكم المسح على الحذاء في الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79985 بتاريخ 16 سبتمبر 2009)⁩ أنه لا حرج في المسح على الحذاء أو الخف ما دام يغطي محل الفرض من الرجلين إذا لبسه على طهارة ومدة المسح للمقيم يوم وليلة وللمسافر ثلاثة أيام بلياليها على ما فصّل الجواب من شروط المسح على الخفين."
  en: "A questioner asked the ruling on wiping over the shoe in wudu. Dr. Salah al-Sawi (fatwa no. 79985, 16 September 2009) answered that there is no harm in wiping over shoe or khuff so long as it covers the obligatory place of the feet and was put on in purity; the wiping's term is a day and a night for the resident and three days with their nights for the traveller — the answer detailing the conditions of wiping the khuffs."
  ur: "جوتے پر مسح؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79985، 16 ستمبر 2009)⁩ کے مطابق طہارت پر پہنا ہوا جوتا ٹھیک — مقیم کو ایک دن رات مسافر کو تین۔"
  es: "Un consultante preguntó sobre la norma relativa a la limpieza del calzado durante la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.º 79985, 16 de septiembre de 2009) respondió que no hay inconveniente en limpiar el calzado o el khuff siempre que cubra la zona obligatoria de los pies y se haya colocado en estado de pureza. El período de limpieza es de un día y una noche para el residente y de tres días con sus respectivas noches para el viajero, detallando así las condiciones para limpiar los khuffs."
