id: work/fatwa-dar-alifta-eg-believing-weather-forecasts
class: work
kind: fatwa
label: { ar: "حكم التصديق بالأرصاد الجوية المتوقعة للطقس في المستقبل", en: "Believing meteorological weather forecasts", ur: "موسمی پیشگوئیوں پر اعتماد کا حکم", es: "Creer en los pronósticos meteorológicos", fr: "Croire aux prévisions météorologiques" }
summary:
  ar: "سائل سأل عن التصديق بالتوقعات المعلنة من هيئة الأرصاد الجوية المتعلقة بحالة الطقس لفترة قادمة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22134)⁩ أنه لا مانع شرعًا من التصديق بها وبيّن الجواب الفرق بين ذلك وبين ادعاء علم الغيب."
  en: "A questioner asked about believing the published forecasts of the meteorological authority for coming weather. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22134) answered that nothing in the sharia bars believing them; the answer sets out the difference between this and claiming knowledge of the unseen."
  ur: "ایک سائل نے محکمہ ارصاد کی شائع شدہ موسمی پیشگوئیوں پر اعتماد کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22134)⁩ نے جواب دیا کہ ان پر اعتماد کرنے میں شرعاً کوئی مانع نہیں؛ جواب میں اس اور غیب کے علم کے دعوے کے درمیان فرق بیان ہوا۔"
  es: "Un interlocutor preguntó sobre la conveniencia de creer en los pronósticos meteorológicos publicados por la autoridad meteorológica. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22134) respondió que nada en la sharia prohíbe creer en ellos; la respuesta expone la diferencia entre esto y pretender tener conocimiento de lo invisible."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22134) sur la fiabilité des prévisions météorologiques publiées par les autorités égyptiennes. La fatwa indique que rien dans la charia n'interdit d'y croire, en précisant la différence avec la prétention de connaître l'invisible."
