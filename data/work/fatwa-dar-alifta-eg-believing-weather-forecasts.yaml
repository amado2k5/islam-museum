label: { ar: "حكم التصديق بالأرصاد الجوية المتوقعة للطقس في المستقبل", en: "Believing meteorological weather forecasts", ur: "موسمی پیشگوئیوں پر اعتماد کا حکم" }
summary:
  ar: "سائل سأل عن التصديق بالتوقعات المعلنة من هيئة الأرصاد الجوية المتعلقة بحالة الطقس لفترة قادمة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22134)⁩ أنه لا مانع شرعًا من التصديق بها وبيّن الجواب الفرق بين ذلك وبين ادعاء علم الغيب."
  en: "A questioner asked about believing the published forecasts of the meteorological authority for coming weather. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22134) answered that nothing in the sharia bars believing them; the answer sets out the difference between this and claiming knowledge of the unseen."
  ur: "ایک سائل نے محکمہ ارصاد کی شائع شدہ موسمی پیشگوئیوں پر اعتماد کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22134)⁩ نے جواب دیا کہ ان پر اعتماد کرنے میں شرعاً کوئی مانع نہیں؛ جواب میں اس اور غیب کے علم کے دعوے کے درمیان فرق بیان ہوا۔"
