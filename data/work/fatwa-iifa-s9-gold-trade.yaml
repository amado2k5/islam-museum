label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن تجارة الذهب والحلول الشرعية لاجتماع الصرف والحوالة", en: "IIFA resolution on trading gold and lawful solutions where exchange meets transfer", ur: "اکیڈمی کی قرارداد: سونے کی تجارت اور صرف و حوالہ کے شرعی حل", es: "Resolución de la IIFA sobre el comercio de oro y soluciones legales donde el intercambio se encuentra con la transferencia.", fr: "Résolution de l'IIFA sur le commerce de l'or et les solutions légales lorsque l'échange rencontre le transfert", tr: "Uluslararası İslami Fiqh Akademisi'nin altın ticareti ve değişim ile transfer toplantıları için Şeriat çözümleri hakkında kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai perdagangan emas dan solusi Syariah untuk pertemuan pertukaran dan transfer" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: يجوز شراء الذهب والفضة بالشيكات المصدقة بشرط التقابض في المجلس، وأكد عدم جواز مبادلة الذهب المصوغ بذهب غير مصوغ أكثر مقدارًا لأنه لا عبرة بالجودة والصياغة في مبادلة الذهب بالذهب، وبيّن الحلول الشرعية لاجتماع الصرف والحوالة على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on trading gold and the lawful solutions where currency exchange meets remittance: gold and silver may be bought with certified cheques provided mutual taking in the session; exchanging worked gold for a greater amount of unworked gold is forbidden since quality and craftsmanship carry no weight in gold-for-gold; the lawful solutions are detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ سونے کی تجارت پر: تصدیق شدہ چیک سے خرید ممکن بشرط مجلس میں قبض؛ کاریگری والے سونے کو زیادہ خام سونے سے بدلنا جائز نہیں۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre el comercio de oro y las soluciones legales en las que el cambio de divisas se combina con las remesas: el oro y la plata pueden comprarse con cheques certificados siempre que haya aceptación mutua en la sesión; se prohíbe el intercambio de oro trabajado por una mayor cantidad de oro sin trabajar, ya que la calidad y la artesanía no tienen peso en el intercambio de oro por oro; se detallan las soluciones legales."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur le commerce de l'or et les solutions légales lorsque l'échange de devises rencontre le transfert de fonds: l'or et l'argent peuvent être achetés avec des chèques certifiés à condition d'une prise en charge mutuelle au cours de la session; l'échange d'or travaillé contre une plus grande quantité d'or non travaillé est interdit car la qualité et le savoir-faire n'ont aucune importance dans un échange or contre or; les solutions légales sont détaillées."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dokuzuncu oturumunda (Abu Dabi, Nisan 1995) kararı: Altın ve gümüşün onaylı çeklerle satın alınması, ancak bunlar konseyde değiş tokuş edilirse kabul edilebilir. Altının rafine edilmemiş altına değiş tokuş edilmesinin izin verilmediğini, çünkü altın ile altın değişiminde kalite ve işçiliğin önemli olmadığını, değişim ve transfer kombinasyonuna ilişkin yasal çözümlerin ayrıntılı olarak belirtildiğini teyit etti."
  id: "Keputusan International Islamic Fiqh Academy dalam sesi kesembilannya (Abu Dhabi, April 1995): Diperbolehkan membeli emas dan perak dengan cek bersertifikat asalkan dipertukarkan di dewan. Dewan menegaskan bahwa pertukaran emas dengan emas mentah tidak diperbolehkan karena kualitas dan keahlian tidak penting dalam pertukaran emas dengan emas, dan solusi hukum untuk kombinasi pertukaran dan transfer sebagaimana dijelaskan."
