id: work/fatwa-dar-alifta-eg-washing-burnt-deceased
class: work
kind: fatwa
label: { ar: "حكم تغسيل الميت المصاب بالحروق", en: "Washing a deceased who suffered burns", ur: "جلے ہوئے میت کو غسل دینا", es: "Lavar a un fallecido que sufrió quemaduras.", fr: "Laver un défunt ayant subi des brûlures", tr: "Yanık alan ölenin yıkanmasına ilişkin karar", id: "Putusan tentang mencuci orang yang telah mengalami luka bakar" }
summary:
  ar: "سائل سأل عن تغسيل الميت المصاب بالحروق. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21958)⁩ أن حكم تغسيل المحروق يتوقف على حال جسده بعد الوفاة فإن كان سليمًا وأمكن غسله وتعميمه بالماء من غير ضرر غُسِّل وإلا انتقل إلى التيمم على ما فصّل الجواب."
  en: "A questioner asked about washing a deceased who suffered burns. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21958) answered that the ruling depends on the body's state after death: if intact and washable without harm it is washed; otherwise the matter passes to tayammum — as the answer details."
  ur: "ایک سائل نے جلے ہوئے میت کو غسل دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21958)⁩ نے جواب دیا کہ حکم موت کے بعد جسد کی حالت پر موقوف ہے: اگر صحیح اور بغیر نقصان دھویا جا سکے تو غسل دیا جائے ورنہ تیمم کی طرف رجوع ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el lavado de un difunto que sufrió quemaduras. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21958) respondió que la norma depende del estado del cuerpo después de la muerte: si está intacto y se puede lavar sin sufrir daños, se procede al lavado; de lo contrario, el asunto pasa a tayammum, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le lavage d'un défunt brûlé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21958) a répondu que la décision dépend de l'état du corps après le décès: s'il est intact et lavable sans dommage, on peut le laver; sinon, la question relève du tayammum, comme le précise la réponse."
  tr: "Bir soru soran kişi, yanık olan bir kişinin yıkanması hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21958), yanık kişinin yıkanmasına ilişkin hükmün, yanan kişinin ölüm sonrası durumuna bağlı olduğunu söyledi. Eğer sağlıklıysa ve zarar vermeden suyla yıkanıp dolaştırmak mümkünse, yıkanması gerekir; aksi takdirde, cevapta açıklandığı gibi kuru abdest alma yöntemine geçer."
  id: "Seorang penanya menanyakan tentang mencuci orang yang meninggal yang mengalami luka bakar. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21958) menjawab bahwa keputusan tentang mencuci orang yang terbakar tergantung pada kondisi orang yang terbakar setelah kematian. Jika dia sehat dan memungkinkan untuk mencuci serta mengalirkannya dengan air tanpa membahayakan, maka harus mandi; jika tidak, dia melanjutkan ke wudhu kering seperti yang dijelaskan dalam jawaban."
