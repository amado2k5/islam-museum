summary:
  ar: "ترجمة إنجليزية للقرآن وضعها السعودي عبد العزيز بن فهد المبارك من الأحساء، صدرت أول مرة في بيروت سنة 2008 وما تزال تُنقّح، على منهج حرفي صارم يرفض الترجمة بالمعنى، فيتبع التركيب العربي كلمة بكلمة ويكتب ألفاظًا عربية بنظام نقل خاص ويضع علامات نحوية فوق السطر، ومعها مقدمة تقارب تسعين صفحة؛ وترى جوانا بينك أن الناتج عسير على القارئ."
  en: "An English translation of the Qur'an by the Saudi Abdulaziz F. AlMubarak of al-Ahsa, first published in Beirut in 2008 and constantly revised since, on a strictly literal method that rejects translation by meaning: it follows the Arabic word by word, transliterates Arabic terms in its own system and marks grammar with superscript letters, with an introduction of nearly ninety pages; Johanna Pink finds the result impenetrable for readers."
  ur: "قرآن کا انگریزی ترجمہ از سعودی عبد العزیز بن فہد المبارک، احساء سے، جو 2008 میں بیروت سے پہلی بار شائع ہوا اور مسلسل نظرِ ثانی ہوتی رہی؛ سخت لفظی طریقے پر جو بالمعنی ترجمے کو رد کرتا ہے، عربی تراکیب کی لفظ بہ لفظ پیروی کرتا ہے، عربی الفاظ اپنے نظام میں لکھتا ہے اور بالائی حروف سے نحوی علامات دیتا ہے؛ مقدمہ تقریباً نوے صفحات کا ہے، اور یوہانا پنک کے نزدیک نتیجہ قاری کے لیے دشوار ہے۔"
