label: { ar: "الترجمة النصية للقرآن المجيد ⁦(عبد العزيز المبارك)⁩", en: "The Textual Translation for The Qur'aan The Supreme (Abdulaziz AlMubarak)", ur: "دی ٹیکسچوئل ٹرانسلیشن فار دی قرآن دی سپریم ⁦(عبد العزیز المبارک)⁩", es: "Traducción textual del Corán, el Supremo (Abdulaziz AlMubarak)", fr: "La traduction textuelle du Coran par le Suprême (Abdulaziz AlMubarak)", tr: "Kur'an-ı Kerim'in Metinsel Çevirisi (Abdulaziz Al-Mubarak)", id: "Terjemahan Tekstual Al-Qur'an (Abdulaziz Al-Mubarak)" }
summary:
  ar: "ترجمة إنجليزية للقرآن وضعها السعودي عبد العزيز بن فهد المبارك من الأحساء، صدرت أول مرة في بيروت سنة 2008 وما تزال تُنقّح، على منهج حرفي صارم يرفض الترجمة بالمعنى، فيتبع التركيب العربي كلمة بكلمة ويكتب ألفاظًا عربية بنظام نقل خاص ويضع علامات نحوية فوق السطر، ومعها مقدمة تقارب تسعين صفحة؛ وترى جوانا بينك أن الناتج عسير على القارئ."
  en: "An English translation of the Qur'an by the Saudi Abdulaziz F. AlMubarak of al-Ahsa, first published in Beirut in 2008 and constantly revised since, on a strictly literal method that rejects translation by meaning: it follows the Arabic word by word, transliterates Arabic terms in its own system and marks grammar with superscript letters, with an introduction of nearly ninety pages; Johanna Pink finds the result impenetrable for readers."
  ur: "قرآن کا انگریزی ترجمہ از سعودی عبد العزیز بن فہد المبارک، احساء سے، جو 2008 میں بیروت سے پہلی بار شائع ہوا اور مسلسل نظرِ ثانی ہوتی رہی؛ سخت لفظی طریقے پر جو بالمعنی ترجمے کو رد کرتا ہے، عربی تراکیب کی لفظ بہ لفظ پیروی کرتا ہے، عربی الفاظ اپنے نظام میں لکھتا ہے اور بالائی حروف سے نحوی علامات دیتا ہے؛ مقدمہ تقریباً نوے صفحات کا ہے، اور یوہانا پنک کے نزدیک نتیجہ قاری کے لیے دشوار ہے۔"
  es: "Una traducción al inglés del Corán realizada por el saudí Abdulaziz F. AlMubarak de al-Ahsa, publicada por primera vez en Beirut en 2008 y revisada constantemente desde entonces, con un método estrictamente literal que rechaza la traducción por significado: sigue el árabe palabra por palabra, translitera los términos árabes en su propio sistema y marca la gramática con letras en superíndice, con una introducción de casi noventa páginas; Johanna Pink considera que el resultado es impenetrable para los lectores."
  fr: "Une traduction anglaise du Coran par le Saoudien Abdulaziz F. AlMubarak d'al-Ahsa, publiée pour la première fois à Beyrouth en 2008 et constamment révisée depuis, selon une méthode strictement littérale qui rejette la traduction par le sens: elle suit le texte arabe mot à mot, translittère les termes arabes dans son propre système et marque la grammaire avec des lettres en exposant, avec une introduction de près de quatre-vingt-dix pages; Johanna Pink trouve le résultat impénétrable pour les lecteurs."
  tr: "Suudi Abdulaziz bin Fahd Al-Mubarak tarafından Al-Ahsa'dan hazırlanan Kur'an'ın İngilizce çevirisi, ilk olarak 2008'de Beyrut'ta yayımlanmış ve anlam açısından çeviriyi reddeden katı bir kelime kelime yöntemle revize edilmektedir. Arapça yapı kelimesi kelimesine takip eder; Arapça kelimeler özel bir iletim sistemiyle yazılır, satırın üzerine dilbilgisel işaretler koyar ve yaklaşık doksan sayfalık bir giriş içerir; Joanna Pink ise sonucu okuyucu için zor bulmaktadır."
  id: "Terjemahan bahasa Inggris Al-Quran yang disiapkan oleh Saudi Abdulaziz bin Fahd Al-Mubarak dari Al-Ahsa, pertama kali diterbitkan di Beirut pada tahun 2008 dan masih direvisi, mengikuti metode harfiah ketat yang menolak terjemahan makna. Struktur bahasa Arab mengikuti kata demi kata, menulis kata-kata Arab dalam sistem transmisi khusus, menempatkan tanda tata bahasa di atas garis, bersama dengan pengantar hampir sembilan puluh halaman; Joanna Pink melihat hasilnya sulit bagi pembaca."
