summary:
  ar: "كتاب لأبي الشيخ الأصبهاني ⁦(274–369هـ)⁩ في آثار عظمة الخالق في خلقه، وهو المصدر الرئيس لهيئة السيوطي السنية حتى يكاد كل فصل فيها يرجع إليه {cite:heinen-islamic-cosmology p. 48}."
  en: "A book by Abu al-Shaykh al-Isfahani (274–369 AH) on the signs of the Creator's greatness in creation, the chief source of al-Suyuti's al-Hay'a al-saniyya, to which almost every fragment of it is owed {cite:heinen-islamic-cosmology p. 48}."
  ur: "ابو الشیخ اصبہانی ⁦(274–369ھ)⁩ کی کتاب جو مخلوقات میں خالق کی عظمت کے آثار پر ہے؛ سیوطی کی الہیئۃ السنیہ کا بنیادی ماخذ {cite:heinen-islamic-cosmology p. 48}."
  es: "Un libro de Abu al-Shaykh al-Isfahani (274–369 AH) sobre los signos de la grandeza del Creador en la creación, la principal fuente de al-Hay'a al-saniyya de al-Suyuti, a la que se debe casi cada fragmento de la misma {cite:heinen-islamic-cosmology p. 48}."
  fr: "Un livre d'Abu al-Shaykh al-Isfahani (274–369 AH) sur les signes de la grandeur du Créateur dans la création, la principale source de l'al-Hay'a al-saniyya d'al-Suyuti, à laquelle presque chaque fragment est dû {cite:heinen-islamic-cosmology p. 48}."
  tr: "Ebu Şeyh el-İsfahani'nin (274–369 H) Yaratıcı'nın yaratılışındaki büyüklüğünün etkileri üzerine bir kitap olup, neredeyse her bölümü {cite:heinen-Islamic-cosmology s. 48} referans almaktadır."
  id: "Sebuah buku oleh Abu Sheikh al-Isfahani (274–369 H) tentang pengaruh kebesaran Sang Pencipta dalam ciptaan-Nya, dan merupakan sumber utama sistem Sunni Suyuti, sehingga hampir setiap babnya merujuk pada {cite:heinen-Islamic-cosmology hlm. 48}."
