id: work/fatwa-dar-alifta-eg-working-in-commercial-insurance
class: work
kind: fatwa
label: { ar: "حكم العمل في شركات التأمين التجاري", en: "Working in commercial insurance companies", ur: "کمرشل انشورنس کمپنیوں میں کام کا حکم", es: "Trabajar en compañías de seguros comerciales", fr: "Travailler dans des compagnies d'assurance commerciale" }
summary:
  ar: "سائل سأل عن العمل في شركات التأمين التجاري. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22171)⁩ أن العمل في شركات التأمين جائز شرعًا ولا حرج فيه والمال المتحصل منه من جملة الكسب الحلال، على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about working in commercial insurance companies. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22171) answered that working in insurance companies is lawful and there is no harm in it; the money earned is of lawful gain, under the controls the answer details."
  ur: "ایک سائل نے کمرشل انشورنس کمپنیوں میں کام کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22171)⁩ نے جواب دیا کہ انشورنس کمپنیوں میں کام شرعاً جائز ہے اور اس میں حرج نہیں؛ اس سے کمایا ہوا مال حلال کسب میں داخل ہے، جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Un consultante preguntó sobre la posibilidad de trabajar en compañías de seguros comerciales. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22171) respondió que trabajar en compañías de seguros es lícito y no conlleva ningún perjuicio; el dinero ganado es de origen lícito, según los controles que se detallan en la respuesta."
  fr: "Une personne a posé une question concernant le travail dans les compagnies d'assurance commerciales. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22171) a répondu que travailler dans les compagnies d'assurance est licite et sans danger; les gains sont licites, sous réserve des conditions détaillées dans la réponse."
