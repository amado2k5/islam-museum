summary:
  ar: "كتاب بالفرنسية للأديب اللبناني أمين معلوف يروي الحروب الصليبية من خلال المؤرخين العرب، صدر أول مرة سنة 1983، وترجمه جون روثتشايلد إلى الإنجليزية ⁦(دار الساقي، لندن 1984)⁩، وصدرت له طبعة عربية عن دار الفارابي ببيروت."
  en: "A French book by the Lebanese writer Amin Maalouf telling the Crusades through the Arab chroniclers; first published in 1983, translated into English by Jon Rothschild (Al Saqi, London, 1984), with an Arabic edition from Dar al-Farabi, Beirut."
  ur: "لبنانی ادیب امین معلوف کی فرانسیسی کتاب جو عرب مؤرخین کے ذریعے صلیبی جنگوں کی کہانی سناتی ہے؛ پہلی بار 1983ء میں شائع ہوئی، جان روتھسچائلڈ نے انگریزی ترجمہ کیا ⁦(الساقی، لندن 1984ء)⁩، اور دار الفارابی، بیروت سے عربی ایڈیشن بھی آیا۔"
  es: "Un libro francés del escritor libanés Amin Maalouf que narra las Cruzadas a través de los cronistas árabes; publicado por primera vez en 1983, traducido al inglés por Jon Rothschild (Al Saqi, Londres, 1984), con una edición en árabe de Dar al-Farabi, Beirut."
  fr: "Un livre français de l'écrivain libanais Amin Maalouf racontant les croisades à travers les chroniqueurs arabes; publié pour la première fois en 1983, traduit en anglais par Jon Rothschild (Al Saqi, Londres, 1984), avec une édition arabe de Dar al-Farabi, Beyrouth."
  tr: "Lübnanlı yazar Amin Maalouf tarafından yazılmış, Haçlı Seferlerini Arap tarihçileri aracılığıyla anlatan Fransızca bir kitap, ilk olarak 1983'te yayımlanmış, John Rothschild tarafından İngilizceye çevrilmiş (Dar Al-Saqi, Londra 1984) ve Arapça baskısı Beyrut'ta Dar Al-Farabi tarafından yayımlanmıştır."
  id: "Sebuah buku dalam bahasa Prancis karya penulis Lebanon Amin Maalouf yang menceritakan Perang Salib melalui sejarawan Arab, pertama kali diterbitkan pada tahun 1983, diterjemahkan ke dalam bahasa Inggris oleh John Rothschild (Dar Al-Saqi, London 1984), dan edisi Arab diterbitkan oleh Dar Al-Farabi di Beirut."
