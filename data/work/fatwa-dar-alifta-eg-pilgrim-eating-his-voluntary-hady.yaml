id: work/fatwa-dar-alifta-eg-pilgrim-eating-his-voluntary-hady
class: work
kind: fatwa
label: { ar: "حكم أكل الحاج من هدي التطوع الخاص به", en: "A pilgrim eating of his own voluntary hady", ur: "حاجی کا اپنی نفلی ہدی کا گوشت کھانا", es: "Un peregrino comiendo su propio hady voluntario", fr: "Un pèlerin mangeant son propre hady volontaire", tr: "Gönüllü adaklarından yiyen hacı hakkındaki karar", id: "Putusan tentang peziarah yang makan dari persembahan sukarela" }
summary:
  ar: "سائل سأل عن أكل الحاج من هدي التطوع الخاص به. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21921)⁩ أنه يجوز للحاج أن يأكل من هدي التطوع مطلقًا سواء ذبح في الحرم أم خارجه على ما فصّل الجواب."
  en: "A questioner asked about a pilgrim eating of his own voluntary hady (sacrificial animal). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21921) answered that a pilgrim may eat of a voluntary hady without restriction — whether it was slaughtered inside or outside the Haram — as the answer details."
  ur: "ایک سائل نے حاجی کے اپنی نفلی ہدی کا گوشت کھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21921)⁩ نے جواب دیا کہ حاجی نفلی ہدی کا گوشت کھا سکتا ہے خواہ وہ حرم میں ذبح ہو یا باہر — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó sobre la posibilidad de que un peregrino coma de su propio hady (animal de sacrificio voluntario). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21921) respondió que un peregrino puede comer de un hady voluntario sin restricciones, ya sea que haya sido sacrificado dentro o fuera del Haram, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant la consommation par un pèlerin de la viande de son propre hady (animal sacrifié volontairement). La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21921) a répondu qu'un pèlerin peut consommer la viande d'un hady sacrifié volontairement sans restriction, qu'il ait été abattu à l'intérieur ou à l'extérieur du Haram, comme le précise la réponse."
  tr: "Bir soru soran kişi, hacının gönüllü sunusunu yemesini sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21921), cevabında ayrıntılı olarak belirtildiği üzere, bir hacının Haram içinde veya dışında kesilmiş olsun, gönüllü adaklar yemesinin caiz olduğunu yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang peziarah yang memakan persembahan sukarelanya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21921) menjawab bahwa seorang peziarah diperbolehkan untuk menerima persembahan sukarela dalam keadaan apapun, baik yang dibantai di dalam maupun di luar Haram, seperti yang dijelaskan dalam jawaban."
