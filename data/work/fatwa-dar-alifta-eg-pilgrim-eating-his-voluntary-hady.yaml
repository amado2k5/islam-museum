label: { ar: "حكم أكل الحاج من هدي التطوع الخاص به", en: "A pilgrim eating of his own voluntary hady", ur: "حاجی کا اپنی نفلی ہدی کا گوشت کھانا" }
summary:
  ar: "سائل سأل عن أكل الحاج من هدي التطوع الخاص به. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21921)⁩ أنه يجوز للحاج أن يأكل من هدي التطوع مطلقًا سواء ذبح في الحرم أم خارجه على ما فصّل الجواب."
  en: "A questioner asked about a pilgrim eating of his own voluntary hady (sacrificial animal). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21921) answered that a pilgrim may eat of a voluntary hady without restriction — whether it was slaughtered inside or outside the Haram — as the answer details."
  ur: "ایک سائل نے حاجی کے اپنی نفلی ہدی کا گوشت کھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21921)⁩ نے جواب دیا کہ حاجی نفلی ہدی کا گوشت کھا سکتا ہے خواہ وہ حرم میں ذبح ہو یا باہر — جیسا کہ جواب میں تفصیل ہے۔"
