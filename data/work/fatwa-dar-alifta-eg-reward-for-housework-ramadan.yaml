id: work/fatwa-dar-alifta-eg-reward-for-housework-ramadan
class: work
kind: fatwa
label: { ar: "ثواب المرأة على الأعمال المنزلية التي تقوم بها في رمضان", en: "A woman's reward for her housework in Ramadan", ur: "رمضان میں عورت کے گھریلو کاموں کا ثواب", es: "La recompensa de una mujer por sus labores domésticas durante el Ramadán.", fr: "La récompense d'une femme pour ses tâches ménagères pendant le Ramadan" }
summary:
  ar: "سائلة سألت عن ثوابها على الأعمال والأعباء المنزلية التي تقوم بها في رمضان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21751)⁩ أن المرأة تثاب على الأعمال والأعباء المنزلية التي تقوم بها في رمضان وفي غيره وثوابها في رمضان مضاعف على ما فصّل الجواب."
  en: "A woman asked about her reward for the housework and burdens she carries out in Ramadan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21751) answered that the woman is rewarded for housework in Ramadan and outside it, and her reward in Ramadan is multiplied — as the answer details."
  ur: "ایک عورت نے رمضان میں اپنے گھریلو کاموں کا ثواب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21751)⁩ نے جواب دیا کہ عورت کو رمضان اور غیر رمضان دونوں میں گھریلو کاموں کا ثواب ملتا ہے اور رمضان میں یہ ثواب بڑھا ہوا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer preguntó sobre la recompensa que recibe por las tareas domésticas y las responsabilidades que asume durante el Ramadán. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21751) respondió que la mujer es recompensada por las tareas domésticas tanto durante el Ramadán como fuera de él, y que su recompensa durante el Ramadán se multiplica, tal como se detalla en la respuesta."
  fr: "Une femme a demandé quelle serait sa récompense pour les tâches ménagères et les charges qu'elle assume pendant le Ramadan. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21751) a répondu que la femme est récompensée pour son travail domestique, aussi bien pendant le Ramadan qu'en dehors de ce mois, et que sa récompense est multipliée pendant le Ramadan, comme le précise la réponse."
