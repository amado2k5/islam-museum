id: work/fatwa-dar-alifta-eg-reward-for-housework-ramadan
class: work
kind: fatwa
label: { ar: "ثواب المرأة على الأعمال المنزلية التي تقوم بها في رمضان", en: "A woman's reward for her housework in Ramadan", ur: "رمضان میں عورت کے گھریلو کاموں کا ثواب" }
summary:
  ar: "سائلة سألت عن ثوابها على الأعمال والأعباء المنزلية التي تقوم بها في رمضان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21751)⁩ أن المرأة تثاب على الأعمال والأعباء المنزلية التي تقوم بها في رمضان وفي غيره وثوابها في رمضان مضاعف على ما فصّل الجواب."
  en: "A woman asked about her reward for the housework and burdens she carries out in Ramadan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21751) answered that the woman is rewarded for housework in Ramadan and outside it, and her reward in Ramadan is multiplied — as the answer details."
  ur: "ایک عورت نے رمضان میں اپنے گھریلو کاموں کا ثواب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21751)⁩ نے جواب دیا کہ عورت کو رمضان اور غیر رمضان دونوں میں گھریلو کاموں کا ثواب ملتا ہے اور رمضان میں یہ ثواب بڑھا ہوا ہے — جیسا کہ جواب میں تفصیل ہے۔"
