label: { ar: "الجمعة على عامل في فرنسا", en: "A worker in France — Jumu'a is among the firmest rites", ur: "فرانس میں ملازم — جمعہ سب سے مؤکد شعار", es: "Un trabajador en Francia: Jumu'a es uno de los ritos más firmes." }
summary:
  ar: "سأل شاب مقيم في فرنسا يعمل في شركة ويحافظ على الصلوات عن أدائه الجمعة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86469 بتاريخ 22 فبراير 2012)⁩ أن صلاة الجمعة من آكد شرائع الدين ويتعين المحافظة على أدائها بكل طريق ففي الحديث لينتهن أقوام عن ودعهم الجمعات أو ليختمن الله على قلوبهم وليكونن من الغافلين على ما فصّل الجواب من طرق تمكينه من أدائها."
  en: "A young man resident in France, working at a company and keeping his prayers, asked about Jumu'a. AMJA's fatwa committee (fatwa no. 86469, 22 February 2012) answered that the Friday prayer is among the firmest rites of the religion and must be kept by every means — the hadith warns that people must cease leaving the Jumu'as or God will seal their hearts — the answer detailing ways to secure its performance."
  ur: "فرانس میں جمعہ؟ لجنة الفتوى ⁦(فتویٰ 86469، 22 فروری 2012)⁩ کے مطابق جمعہ مؤکد ترین شعار — ہر طریقے سے ادا کرنا لازم۔"
  es: "Un joven residente en Francia, que trabaja en una empresa y cumple con sus oraciones, preguntó sobre la oración del viernes (Jumu'a). El comité de fatuas de AMJA (fatua n.° 86469, 22 de febrero de 2012) respondió que la oración del viernes es uno de los ritos más firmes de la religión y debe cumplirse a toda costa; el hadiz advierte que la gente debe dejar de faltar a la oración del viernes o Dios sellará sus corazones. La respuesta detalla las maneras de asegurar su cumplimiento."
