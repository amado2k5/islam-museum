class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 13: بيعة العقبة"
  en: "The Prophetic Biography for Reformers, episode 13: The pledge of al-Aqaba"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 13: بیعتِ عقبہ"
  fr: "La biographie prophétique pour les réformateurs, épisode 13 : Le serment d'al-Aqaba"
  es: "La biografía profética para los reformadores, episodio 13: El juramento de al-Aqaba"
summary:
  ar: "يتناول المجلس الثالث عشر من سلسلة السيرة النبوية للمصلحين آخر الأحداث المكية قبل الهجرة: عرض النبي نفسه على قبائل العرب في الأسواق وموسم الحج، ثم الستة من الخزرج، والاثنا عشر في العام التالي، والسبعون وزيادة في بيعة العقبة الثانية، اعتمادا على روايتي جابر وكعب بن مالك. ويناقش المحاضر كيف منحت البيعة الأنصار اسمهم، ووفاءهم اللاحق في بدر وأحد، والدروس التي يستخلصها لمن يعمل للإصلاح اليوم."
  en: "The thirteenth session of the series on the Prophetic biography for reformers treats the last Meccan events before the migration: the Prophet's presenting himself to the Arab tribes at the markets and the pilgrimage season, the six men of the Khazraj, the twelve of the following year and the seventy-odd of the second pledge of al-Aqaba, drawing on the accounts of Jabir and Ka'b ibn Malik. The speaker discusses how the pledge gave the Ansar their name, their later loyalty at Badr and Uhud, and the lessons he draws for those who work for reform today."
  ur: "السیرۃ النبویۃ للمصلحین سلسلے کی تیرہویں نشست ہجرت سے پہلے کے آخری مکی واقعات بیان کرتی ہے: نبی کا بازاروں اور حج کے موسم میں عرب قبائل کے سامنے اپنے آپ کو پیش کرنا، پھر خزرج کے چھ افراد، اگلے سال کے بارہ افراد اور بیعتِ عقبہ ثانیہ کے ستر سے زائد افراد، جابر اور کعب بن مالک کی روایات کی بنیاد پر۔ مقرر بحث کرتا ہے کہ بیعت نے انصار کو ان کا نام کیسے دیا، بدر اور احد میں ان کی بعد کی وفاداری، اور آج اصلاح کے لیے کام کرنے والوں کے لیے وہ کون سے اسباق نکالتا ہے۔"
  fr: "La treizième séance de la série sur la biographie prophétique pour les réformateurs traite des derniers événements mecquois avant l'émigration : la présentation du Prophète aux tribus arabes dans les marchés et à la saison du pèlerinage, les six hommes des Khazraj, les douze de l'année suivante et les soixante-dix et plus du second serment d'al-Aqaba, d'après les récits de Jabir et de Ka'b ibn Malik. Le conférencier explique comment le serment a donné aux Ansar leur nom, leur fidélité ultérieure à Badr et à Uhud, et les leçons qu'il en tire pour ceux qui œuvrent aujourd'hui à la réforme."
  es: "La decimotercera sesión de la serie sobre la biografía profética para los reformadores trata los últimos acontecimientos de La Meca antes de la emigración: la presentación del Profeta a las tribus árabes en los mercados y en la temporada de la peregrinación, los seis hombres de los Jazray, los doce del año siguiente y los setenta y tantos del segundo juramento de al-Aqaba, según los relatos de Jabir y de Ka'b ibn Malik. El conferenciante explica cómo el juramento dio a los Ansar su nombre, su fidelidad posterior en Badr y Uhud, y las lecciones que extrae para quienes trabajan hoy por la reforma."
