summary:
  ar: "كتاب أفرده ابن دريد لجمع ألفاظ النبي وموجز أقواله، ذكره المسعودي فيمن جمعوا ألفاظ النبي في كتبهم مع أبي إسحاق الزجاجي وأبي عبد الله نفطويه وجعفر بن محمد بن حمدان الموصلي {cite:muruj-al-dhahab p. 594}."
  en: "Ibn Durayd's dedicated collection of the Prophet's utterances — cited with the collections of al-Zajjaji, Naftawayh and al-Mawsili {cite:muruj-al-dhahab p. 594}."
  es: "La colección dedicada de Ibn Durayd de las expresiones del Profeta — citada junto con las colecciones de al-Zajjaji, Naftawayh y al-Mawsili {cite:muruj-al-dhahab p. 594}."
  fr: "Le recueil dédié par Ibn Durayd des paroles du Prophète — cité avec les recueils d'al-Zajjaji, Naftawayh et al-Mawsili {cite:muruj-al-dhahab p. 594}."
  ur: "ابن دورید کا نبی کے ارشادات کا مخصوص مجموعہ - جس کا حوالہ الزجاجی، نفتاویہ اور الموسیلی کے مجموعوں کے ساتھ دیا گیا ہے۔ 594}۔"
  tr: "İbn Duraid tarafından Peygamber'in sözlerini toplamak ve sözlerini özetlemek için ithaf edilen bir kitap, El-Mes'udi tarafından Peygamber'in sözlerini kitaplarında Ebu İshaq al-Zajcaci, Ebu Abdullah Naftuyya ve Ca'far ibn Muhammed ibn Hamdan el-Mevsili ile birlikte toplayanlar arasında anılır {cite:muruj-al-dhahab, s. 594}."
  id: "Sebuah kitab yang didedikasikan oleh Ibn Duraid untuk mengumpulkan kata-kata Nabi dan merangkum kata-katanya, yang disebutkan oleh Al-Mas'udi di antara mereka yang mengumpulkan kata-kata Nabi dalam kitab-kitabnya bersama Abu Ishaq al-Zajjaji, Abu Abdullah Naftuyya, dan Ja'far ibn Muhammad ibn Hamdan al-Mawsili {cite:muruj-al-dhahab, hlm. 594}."
