id: work/fatwa-aliftaa-jo-a-bank-banning-resale-of-a-financed-car
class: work
kind: fatwa
label: { ar: "اشتراط البنك عدم بيع السيارة الممولة حتى سداد الأقساط", en: "A bank stipulating that a financed car may not be sold until the instalments are paid", ur: "بینک کی شرط کہ قسطیں پوری ہونے تک فنانس شدہ گاڑی نہ بیچی جائے" }
summary:
  ar: "سؤال عن شراء سيارة عن طريق البنك مع اشتراطه منع بيعها حتى سداد الأقساط، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذا الشرط لا يصح لمناقضته مقتضى البيع، إلا إذا كان على سبيل رهن السيارة لصالح البنك فلا تباع إلا بإذنه. أجابت الدائرة بأن الأصل في الشروط بين المتعاقدين الصحة إلا ما نافى مقتضى العقد، ونقلت تقسيم القليوبي في حاشيته على كنز الراغبين للشروط إلى خمسة أحوال، آخرها الشرط المخالف لمقتضى العقد، وهو المفسد له. وقالت إن المرابحة للآمر بالشراء نوع من البيوع، فلا يصح للبنك اشتراط عدم بيع المبيع لأن ملكه انتقل إلى العميل، ولكن يجوز له اشتراط رهن المبيع لصالحه فلا يباع بعد رهنه إلا بإذنه. وقالت إنه لا يجوز للعميل أن يدفع جزءًا من الثمن للبائع الأول ولا للبنك، وإنما يدفع مبلغ ضمان جدية لا يُعد جزءًا من الثمن. وخلصت إلى أنه لا يصح للبنك اشتراط عدم البيع حتى سداد الأقساط إلا على سبيل الرهن، فيصح البيع حينئذ بإذن البنك."
  en: "A question about buying a car through a bank that forbids selling it until the instalments are paid, in which Jordan's General Iftaa Department answered that this condition is invalid because it contradicts the nature of a sale, unless it takes the form of a mortgage of the car in the bank's favour, in which case it may be sold only with the bank's permission. The Department answered that conditions agreed by contracting parties are valid in principle unless they contradict what the contract entails, citing al-Qalyubi's division of conditions in his gloss on Kanz al-Raghibin into five cases, the last being a condition contrary to the contract's requirements, which invalidates it. It said that murabaha for a purchase orderer is a kind of sale, so the bank may not stipulate that the item not be sold, since ownership has passed to the client, but it may stipulate a mortgage over the item in its favour, after which it may be sold only with the bank's permission. It said the client may not pay any part of the price to the original seller or to the bank; he pays instead a good-faith deposit that is not counted as part of the price. It concluded that the bank may not validly stipulate that the car not be sold until the instalments are paid, except by way of mortgage, in which case a sale is valid with the bank's permission."
  ur: "بینک کے ذریعے ایسی گاڑی خریدنے کے بارے میں سوال جس میں بینک قسطیں پوری ہونے تک اسے بیچنے سے منع کرتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط بیع کے تقاضے کے خلاف ہونے کی وجہ سے درست نہیں، سوائے اس کے کہ یہ بینک کے حق میں گاڑی کے رہن کی صورت میں ہو، اس صورت میں وہ صرف بینک کی اجازت سے بیچی جا سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ معاہدہ کرنے والوں کی شرائط اصلاً درست ہیں سوائے ان کے جو معاہدے کے تقاضے کے خلاف ہوں، اور کنز الراغبین پر قلیوبی کے حاشیے سے شرائط کی پانچ صورتوں کی تقسیم نقل کی، جن میں آخری معاہدے کے تقاضے کے خلاف شرط ہے جو اسے فاسد کر دیتی ہے۔ اس نے کہا کہ خریداری کا حکم دینے والے کے لیے مرابحہ بیع کی ایک قسم ہے، اس لیے بینک یہ شرط نہیں لگا سکتا کہ چیز نہ بیچی جائے کیونکہ اس کی ملکیت گاہک کو منتقل ہو چکی، البتہ وہ اپنے حق میں اس چیز کے رہن کی شرط لگا سکتا ہے، جس کے بعد وہ اس کی اجازت کے بغیر نہیں بیچی جا سکتی۔ اس نے کہا کہ گاہک قیمت کا کوئی حصہ نہ پہلے بیچنے والے کو دے سکتا ہے نہ بینک کو؛ وہ صرف سنجیدگی کی ضمانت کی رقم دیتا ہے جو قیمت کا حصہ شمار نہیں ہوتی۔ اس نے نتیجہ نکالا کہ بینک کا قسطیں پوری ہونے تک گاڑی نہ بیچنے کی شرط لگانا درست نہیں، سوائے رہن کے طور پر، اس صورت میں بینک کی اجازت سے فروخت درست ہے۔"
