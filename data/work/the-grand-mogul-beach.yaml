  es: "Catálogo de la exposición de Milo Cleveland Beach (1978) sobre la pintura mogol bajo Jahangir y Shah Jahan, que presenta los manuscritos y álbumes imperiales y luego dieciséis pintores con sus obras documentadas y atribuidas {cite:beach-grand-mogul-1978 p. 5}."
  fr: "Le catalogue d'exposition de Milo Cleveland Beach (1978) sur la peinture moghole sous Jahangir et Shah Jahan, présentant les manuscrits et albums impériaux puis seize peintres avec leurs œuvres documentées et attribuées {cite:beach-grand-mogul-1978 p. 5}."
