label: { ar: "كتاب إمامة ولد العباس", en: "Imamat wuld al-'Abbas", es: "Imamat wuld al-'Abbas", fr: "L'imamat serait al-'Abbas", ur: "امامت ولد العباس", tr: "Abbas'ın Oğlunun İmamat Kitabı", id: "Kitab Imamate dari Anak Abbas" }
summary:
  ar: "كتاب صنعه عمرو بن بحر الجاحظ يحتج فيه لمذهب الراوندية ويذكر فعل أبي بكر في فدك وقصته مع فاطمة ومطالبتها بإرثها من أبيها واستشهادها ببعلها وابنيها وأم أيمن، وعند المسعودي لم يصنفه الجاحظ استقصاء للحجاج للراوندية لأنه لم يكن مذهبه ولكن فعل ذلك تماجناً وتطرباً {cite:muruj-al-dhahab p. 224}."
  en: "al-Jahiz's book arguing the Rawandiyya's Abbasid-imamate claim through Fatima's Fadak dispute — composed, Mas'udi says, in sport and show rather than conviction {cite:muruj-al-dhahab p. 224}."
  es: "El libro de al-Jahiz que argumenta la pretensión de los Rawandiyya sobre el imamato abasí a través de la disputa de Fátima por Fadak, compuesto, según Mas'udi, por diversión y ostentación más que por convicción {cite:muruj-al-dhahab p. 224}."
  fr: "Le livre d'al-Jahiz défendant la revendication de l'imamat abbasside de la Rawandiyya à travers le différend de Fatima sur Fadak — composé, dit Mas'udi, dans le jeu et le spectacle plutôt que par conviction {cite:muruj-al-dhahab p. 224}."
  ur: "الجہیز کی کتاب فاطمہ کے فدک کے تنازعہ کے ذریعے راوندیہ کے عباسی امامت کے دعوے پر بحث کرتی ہے - مسعودی کا کہنا ہے کہ، قائل ہونے کے بجائے کھیل اور شو میں تحریر کیا گیا ہے {حوالہ: مروج الذہب ص۔ 224}۔"
  tr: "Amr ibn Bahr al-Jahiz'in Rawandi okulunu savunduğu bir kitapta, Ebu Bekir'in Fadak'taki eylemi, Fatimah ile hikayesi, babasından miras alma iddiası, kocası, iki oğlu ve Üm Ayman'ı anma bahseder. El-Mes'udi'ye göre, El-Cahiz bunu El-Hacac'ın Rawandizmi araştırması olarak derlememiştir çünkü bu onun okulu değildir, ancak coşku ve sevinçle yapmıştır {atıf:Muruj-al-Dhahab, s. 224}."
  id: "Sebuah buku yang ditulis oleh Amr ibn Bahr al-Jahiz di mana ia berargumen untuk aliran pemikiran Rawandi, menyebutkan tindakan Abu Bakr dalam Fadak, kisahnya dengan Fatimah, klaim warisan dari ayahnya, kutipan suaminya, dua putranya, dan um Ayman. Menurut al-Mas'udi, Al-Jahiz tidak menyusunnya sebagai penyelidikan oleh Al-Hajjaj terhadap Rawandisme karena itu bukan sekolahnya, tetapi ia melakukannya karena antusiasme dan kegembiraan {cite:muruj-al-dhahab, hlm. 224}."
