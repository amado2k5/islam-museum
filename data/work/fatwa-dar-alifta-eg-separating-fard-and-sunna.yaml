id: work/fatwa-dar-alifta-eg-separating-fard-and-sunna
class: work
kind: fatwa
label: { ar: "حكم متابعة النفل بعد الفرض دون فصل بينهما", en: "Praying the sunna right after the fard with no separation", ur: "فرض کے فوراً بعد بغیر وقفے نفل پڑھنا", es: "Rezar la sunna justo después de la fard sin separación" }
summary:
  ar: "سائل سأل عن متابعة النفل بعد الفرض دون فصل بينهما بذكر أو كلام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21779)⁩ أنه يسن للمصلي الفصل بين الفريضة والسنة سواء أفصل بجلسة يسيرة أم بفعل حركة أو انتقال عن المكان على ما فصّل الجواب."
  en: "A questioner asked about following the sunna prayer right after the fard with no separation by dhikr or speech. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21779) answered that separating the obligatory from the sunna is commended — whether by a brief sitting, a movement, or moving from the spot — as the answer details."
  ur: "ایک سائل نے فرض کے بعد بغیر وقفے نفل پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21779)⁩ نے جواب دیا کہ فرض اور سنت کے درمیان فاصلہ کرنا مستحب ہے — خواہ تھوڑی دیر بیٹھنے سے، حرکت سے یا جگہ بدلنے سے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de realizar la oración sunna inmediatamente después de la fard, sin realizar ninguna separación mediante dhikr o palabras. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21779) respondió que separar lo obligatorio de lo sunna es recomendable, ya sea mediante una breve sentada, un movimiento o alejándose del lugar, como se detalla en la respuesta."
