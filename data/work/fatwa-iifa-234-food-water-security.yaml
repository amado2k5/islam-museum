label: { ar: "قرار مجمع الفقه الإسلامي الدولي 234 (24/5) بشأن تحقيق الأمن الغذائي والمائي وأهم المشكلات التي تواجهها الدول الإسلامية وآثاره على التحديات المستقبلية للأمة الإسلامية", en: "IIFA resolution 234 (24/5) on achieving food and water security, the main problems facing Islamic countries and its effects on the future challenges of the Muslim community", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 234 (24/5): خوراک اور پانی کی تحفظ حاصل کرنا، اسلامی ممالک کے سامنے اہم مسائل اور امت کے مستقبل کے چیلنجوں پر اس کے اثرات", es: "Resolución 234 (24/5) de la IIFA sobre el logro de la seguridad alimentaria e hídrica, los principales problemas que enfrentan los países islámicos y sus efectos en los futuros desafíos de la comunidad musulmana." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩. عرّف المجمع الأمن المائي بتوفير المياه الصالحة للاستخدام البشري بما يكفي لتلبية متطلبات البلاد في الكم والنوع واستمرار ذلك دون تأثر، والأمن الغذائي بتوفير الغذاء الصحي السليم للأفراد مع ضمان الحد الأدنى من الحاجات الغذائية لجميع أفراد المجتمع. وإذ يدعو الإسلام إلى المحافظة والاقتصاد في الماء والغذاء وينهى عن الإسراف والتبذير، أوصى المجمع بأن تضع حكومات الدول الإسلامية قضية الأمن المائي والغذائي في مقدمة اهتماماتها وتضع سياسات لترشيد الاستهلاك؛ وأن يقتصد المسلمون شرعًا في استهلاك الماء والغذاء؛ وأن يجتهد علماء الماء والزراعة والبيئة لإيجاد الحلول مستفيدين من تقنيات الثورة الصناعية الرابعة في تدوير المياه ضمن ضوابط الشريعة؛ وأن تتعاون الدول الإسلامية لمواجهة نقص الماء والغذاء مع المنظمات المتخصصة؛ واستخدام التقنيات الحديثة في إنتاج البذور وتحسين التنمية الزراعية؛ والاستفادة مما جاءت به الشريعة لتنمية الموارد الزراعية بإحياء الموات بضوابطه الشرعية وإزالة العقبات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019). It defined water security as providing water fit for human use sufficient for a country's needs in quantity and quality, on a lasting basis, and food security as providing sound, healthy food to individuals while guaranteeing the minimum nutritional needs of everyone in society. Since Islam calls for conservation and economy in water and food and forbids extravagance and waste, it recommended that the governments of Islamic countries put water and food security at the top of their concerns with policies for rationalising consumption; that Muslims be legally bound to be economical in consuming water and food; that specialists in water, agriculture and the environment strive for solutions, benefiting from Fourth Industrial Revolution techniques in water recycling within the controls of the sharia; that Islamic countries cooperate with one another and with specialised regional and international organisations against water and food shortage; that modern techniques in seed production and agricultural development be used; and that the states benefit from what the sharia provides for developing agricultural resources through the revival of dead land (ihya' al-mawat) under its legal controls, removing the obstacles in its way."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں۔ اکیڈمی نے آبی تحفظ کی تعریف انسانی استعمال کے قابل پانی کی ایسی فراہمی کے طور پر کی جو ملک کی ضروریات کو مقدار اور معیار میں مستقل طور پر پورا کرے، اور خوراکی تحفظ کی تعریف افراد کو صحتمند صحیح خوراک دینے اور معاشرے کے ہر فرد کی کم از کم غذائی ضرورت کی ضمانت کے طور پر کی۔ چونکہ اسلام پانی اور خوراک میں تحفظ و اعتدال کی دعوت دیتا اور فضول خرچی سے منع کرتا ہے، اس نے سفارش کی کہ اسلامی ممالک کی حکومتیں آبی و خوراکی تحفظ کو ترجیح دیں اور استعمال کے اعتدال کی پالیسیاں بنائیں؛ مسلمان شرعاً پانی و خوراک میں اعتدال کریں؛ آب، زراعت اور ماحول کے ماہرین چوتھی صنعتی انقلاب کی تکنیکوں سے پانی کی تدویر میں شرعی ضوابط کے ساتھ حل تلاش کریں؛ اسلامی ممالک پانی و خوراک کی کمی کے خلاف باہم اور متخصص علاقائی و بین الاقوامی اداروں سے تعاون کریں؛ بیج کی پیداوار اور زرعی ترقی میں جدید تکنیکیں استعمال ہوں؛ اور ریاستیں زرعی وسائل کی ترقی کے لیے شریعت کے اصولِ احیاءِ موات کو شرعی ضوابط کے ساتھ استعمال کریں اور رکاوٹیں دور کریں۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019). Definió la seguridad hídrica como el suministro de agua apta para el uso humano suficiente para las necesidades de un país en cantidad y calidad, de forma duradera, y la seguridad alimentaria como el suministro de alimentos sanos y saludables a las personas, garantizando al mismo tiempo las necesidades nutricionales mínimas de todos en la sociedad. Dado que el Islam exige conservación y economía en el agua y los alimentos y prohíbe la extravagancia y el despilfarro, recomendó que los gobiernos de los países islámicos prioricen la seguridad hídrica y alimentaria con políticas para racionalizar el consumo; que los musulmanes estén legalmente obligados a ser económicos en el consumo de agua y alimentos; que los especialistas en agua, agricultura y medio ambiente se esfuercen por encontrar soluciones, aprovechando las técnicas de la Cuarta Revolución Industrial en el reciclaje de agua dentro de los controles de la sharia; que los países islámicos cooperen entre sí y con organizaciones regionales e internacionales especializadas contra la escasez de agua y alimentos; que se utilicen técnicas modernas en la producción de semillas y el desarrollo agrícola; y que los estados se beneficien de lo que la sharia prevé para el desarrollo de los recursos agrícolas mediante la recuperación de tierras muertas (ihya' al-mawat) bajo sus controles legales, eliminando los obstáculos que se interponen en su camino."
