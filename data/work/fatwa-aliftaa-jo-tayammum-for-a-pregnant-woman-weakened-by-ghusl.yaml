id: work/fatwa-aliftaa-jo-tayammum-for-a-pregnant-woman-weakened-by-ghusl
class: work
kind: fatwa
label: { ar: "التيمم للحامل التي يتعبها الغسل", en: "Tayammum for a pregnant woman whom ghusl exhausts", ur: "حاملہ کا تیمم جسے غسل سے سخت تکلیف ہو" }
summary:
  ar: "سؤال عن التيمم للحامل التي يتعبها الغسل، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يصار إلى التيمم مع القدرة على الماء بتسخينه وتدفئة المكان، فإن تعذر ذلك وكان الغسل يضرها ضررًا بالغًا تيممت، وعليها قضاء الصلوات. أجابت الدائرة بأنه لا يصار إلى التيمم بدلًا عن الغسل الواجب مع القدرة على استعمال الماء، كأن يسخن الماء ويدفأ مكان الاغتسال ونحو ذلك من الاحترازات. وقالت إنه إن لم يجد ذلك أو تعذر، وكان الغسل يؤدي إلى ضرر بالغ، فلها التيمم للعجز عن استعمال الماء، لكن عليها قضاء الصلوات التي صلتها بهذا التيمم. ونقلت من كتاب بشرى الكريم أن البرد لا يبيح التيمم إلا إذا لم تنفع التدفئة ولم يوجد ما يسخن به الماء وخيف ضرر في النفس أو العضو أو حدوث مرض أو زيادته، وأن مجرد التألم بالماء لا يبيح التيمم."
  en: "A question about tayammum for a pregnant woman whom ghusl exhausts, in which Jordan's General Iftaa Department answered that tayammum is not resorted to while water can be used by heating it and warming the room; if that is impossible and ghusl would cause serious harm she may perform tayammum, but must make up the prayers. The Department answered that tayammum may not replace an obligatory ghusl while one is able to use water, for example by heating the water, warming the place of bathing and similar precautions. It said that if this does not help or cannot be done, and ghusl would cause serious harm, she may perform tayammum because she is unable to use water owing to the harm, but she must make up the prayers she performed with that tayammum. It quoted Bushra al-Karim that cold permits tayammum only if warming does not help, nothing is available to heat the water, and harm is feared to life or limb or the onset or worsening of illness, and that mere discomfort from water does not permit tayammum."
  ur: "حاملہ کا تیمم جسے غسل سے سخت تکلیف ہو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پانی گرم کر کے اور جگہ گرم کر کے استعمال ممکن ہو تو تیمم نہیں، اور اگر یہ ممکن نہ ہو اور غسل سے شدید نقصان ہو تو تیمم کرے، لیکن نمازوں کی قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ پانی استعمال کرنے کی قدرت ہو، مثلاً پانی گرم کر کے اور غسل کی جگہ گرم کر کے یا ایسی دوسری احتیاطوں سے، تو فرض غسل کی جگہ تیمم نہیں کیا جائے گا۔ اس نے کہا کہ اگر اس سے فائدہ نہ ہو یا یہ ممکن نہ ہو، اور غسل شدید نقصان کا باعث ہو، تو نقصان کی وجہ سے پانی کے استعمال سے عاجز ہونے کی بنا پر وہ تیمم کر سکتی ہے، لیکن اس تیمم سے پڑھی گئی نمازوں کی قضا اس پر ہے۔ اس نے بشریٰ الکریم سے نقل کیا کہ سردی تیمم کو اسی وقت جائز کرتی ہے جب گرمائش فائدہ نہ دے، پانی گرم کرنے کا سامان نہ ہو، اور جان، عضو یا بیماری پیدا ہونے یا بڑھنے کا خوف ہو، اور محض پانی سے تکلیف تیمم کو جائز نہیں کرتی۔"
