id: work/fatwa-aliftaa-jo-tayammum-for-a-pregnant-woman-weakened-by-ghusl
class: work
kind: fatwa
label: { ar: "التيمم للحامل التي يتعبها الغسل", en: "Tayammum for a pregnant woman whom ghusl exhausts", ur: "حاملہ کا تیمم جسے غسل سے سخت تکلیف ہو", es: "Tayammum para una mujer embarazada a la que el ghusl agota", fr: "Tayammum pour une femme enceinte qui épuise son ghusl", tr: "Güslden yorulmuş hamile kadınlar için Tayammum", id: "Tayammum untuk wanita hamil yang lelah dengan ghusl" }
summary:
  ar: "سؤال عن التيمم للحامل التي يتعبها الغسل، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يصار إلى التيمم مع القدرة على الماء بتسخينه وتدفئة المكان، فإن تعذر ذلك وكان الغسل يضرها ضررًا بالغًا تيممت، وعليها قضاء الصلوات. أجابت الدائرة بأنه لا يصار إلى التيمم بدلًا عن الغسل الواجب مع القدرة على استعمال الماء، كأن يسخن الماء ويدفأ مكان الاغتسال ونحو ذلك من الاحترازات. وقالت إنه إن لم يجد ذلك أو تعذر، وكان الغسل يؤدي إلى ضرر بالغ، فلها التيمم للعجز عن استعمال الماء، لكن عليها قضاء الصلوات التي صلتها بهذا التيمم. ونقلت من كتاب بشرى الكريم أن البرد لا يبيح التيمم إلا إذا لم تنفع التدفئة ولم يوجد ما يسخن به الماء وخيف ضرر في النفس أو العضو أو حدوث مرض أو زيادته، وأن مجرد التألم بالماء لا يبيح التيمم."
  en: "A question about tayammum for a pregnant woman whom ghusl exhausts, in which Jordan's General Iftaa Department answered that tayammum is not resorted to while water can be used by heating it and warming the room; if that is impossible and ghusl would cause serious harm she may perform tayammum, but must make up the prayers. The Department answered that tayammum may not replace an obligatory ghusl while one is able to use water, for example by heating the water, warming the place of bathing and similar precautions. It said that if this does not help or cannot be done, and ghusl would cause serious harm, she may perform tayammum because she is unable to use water owing to the harm, but she must make up the prayers she performed with that tayammum. It quoted Bushra al-Karim that cold permits tayammum only if warming does not help, nothing is available to heat the water, and harm is feared to life or limb or the onset or worsening of illness, and that mere discomfort from water does not permit tayammum."
  ur: "حاملہ کا تیمم جسے غسل سے سخت تکلیف ہو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پانی گرم کر کے اور جگہ گرم کر کے استعمال ممکن ہو تو تیمم نہیں، اور اگر یہ ممکن نہ ہو اور غسل سے شدید نقصان ہو تو تیمم کرے، لیکن نمازوں کی قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ پانی استعمال کرنے کی قدرت ہو، مثلاً پانی گرم کر کے اور غسل کی جگہ گرم کر کے یا ایسی دوسری احتیاطوں سے، تو فرض غسل کی جگہ تیمم نہیں کیا جائے گا۔ اس نے کہا کہ اگر اس سے فائدہ نہ ہو یا یہ ممکن نہ ہو، اور غسل شدید نقصان کا باعث ہو، تو نقصان کی وجہ سے پانی کے استعمال سے عاجز ہونے کی بنا پر وہ تیمم کر سکتی ہے، لیکن اس تیمم سے پڑھی گئی نمازوں کی قضا اس پر ہے۔ اس نے بشریٰ الکریم سے نقل کیا کہ سردی تیمم کو اسی وقت جائز کرتی ہے جب گرمائش فائدہ نہ دے، پانی گرم کرنے کا سامان نہ ہو، اور جان، عضو یا بیماری پیدا ہونے یا بڑھنے کا خوف ہو، اور محض پانی سے تکلیف تیمم کو جائز نہیں کرتی۔"
  es: "Una pregunta sobre el tayammum para una mujer embarazada a quien el ghusl le resulta perjudicial, a la que el Departamento General de Iftaa de Jordania respondió que no se recurre al tayammum mientras se pueda usar agua calentándola y calentando la habitación; si esto es imposible y el ghusl le causaría un daño grave, puede realizar el tayammum, pero debe recuperar las oraciones. El Departamento respondió que el tayammum no puede reemplazar un ghusl obligatorio mientras se pueda usar agua, por ejemplo, calentándola, calentando el lugar del baño y tomando precauciones similares. Dijo que si esto no ayuda o no se puede hacer, y el ghusl le causaría un daño grave, puede realizar el tayammum porque no puede usar agua debido al daño, pero debe recuperar las oraciones que realizó con ese tayammum. Citaba a Bushra al-Karim, quien afirmaba que el frío permite el tayammum solo si calentar el agua no ayuda, no hay nada disponible para calentarla y se teme que se produzcan daños a la vida o a la integridad física, o el inicio o empeoramiento de una enfermedad, y que la mera incomodidad causada por el agua no permite el tayammum."
  fr: "Une question concernant le tayammum pour une femme enceinte épuisée par le ghusl a été posée au Département général de la Ifta de Jordanie. Ce département a répondu que le tayammum n'est pas requis tant que l'eau peut être utilisée, en la chauffant et en chauffant la pièce. Si cela est impossible et que le ghusl présente un risque grave pour sa santé, la femme peut accomplir le tayammum, mais doit rattraper les prières manquées. Le Département a précisé que le tayammum ne peut se substituer au ghusl obligatoire tant que l'eau est disponible, par exemple en la chauffant, en chauffant le lieu du bain et en prenant des précautions similaires. Il a ajouté que si cela ne suffit pas ou est impossible, et que le ghusl présente un risque grave pour sa santé, la femme peut accomplir le tayammum car elle est dans l'incapacité d'utiliser l'eau en raison de ce risque, mais elle doit rattraper les prières accomplies grâce à ce tayammum. Elle cite Bushra al-Karim selon laquelle le froid ne permet le tayammum que si le réchauffement est inefficace, si rien n'est disponible pour chauffer l'eau, et si l'on craint un danger pour la vie ou l'intégrité physique, ou l'apparition ou l'aggravation d'une maladie, et qu'une simple gêne due à l'eau ne permet pas le tayammum."
  tr: "Ürdün Genel Fetva Dairesi, ghusldan yorgun düşen hamile kadınlar için tayammum hakkında bir soruya yanıt verdi; eğer su mekanı ısıtıp ısıtabiliyorsa tayammum kabul edilemez. Eğer bu mümkün değilse ve ghusl ona ciddi zarar verirse, tayammum yapılır ve namazları uydurmak zorundadır. Daire, su kullanma ve banyo yerini ısıtma gibi zorunlu ghuslların yerine tayammum yapılmaması gerektiğini yanıtladı ve benzeri önlemler alındı. Eğer bu bulunmazsa veya imkansızsa ve ghusl ciddi zarar verirse, su kullanamadığı için teyemmen yapabileceği, ancak bu teyememle bağlantılı duaları uydurması gerektiği belirtilir. Buşra el-Kerim kitabından alıntı yapılır; soğuğun tayammum yapmasına izin vermediği, ancak ısıtmanın etkili olmadığı sürece izin verdiği, suyu ısıtacak bir şey olmadığı, vücuda veya uzuvlara zarar gelme korkusu, hastalığın ortaya çıkması veya artması korkusu olduğu ve sadece suyun getirdiği ağrının tayammum yapmasına izin vermediği belirtilir."
  id: "Sebuah pertanyaan tentang tayammum untuk wanita hamil yang kelelahan akibat ghusl, Departemen Fatwa Umum Yordania menjawab bahwa tayammum tidak diperbolehkan jika air mampu menghangatkan dan menghangatkan tempat. Jika hal itu tidak memungkinkan dan ghusl menyebabkan luka parah, tayammum dilakukan dan dia harus melengkapi doa. Departemen menjawab bahwa tayammum tidak boleh dilakukan sebagai pengganti ghusl wajib dengan kemampuan menggunakan air, seperti memanaskan air dan menghangatkan tempat mandi, serta tindakan pencegahan serupa. Dikatakan bahwa jika hal ini tidak ditemukan atau tidak memungkinkan, dan ghusl menyebabkan kerusakan parah, dia boleh melakukan tayammum karena tidak bisa menggunakan air, tetapi dia harus mengerjakan doa yang terkait dengan tayammum tersebut. Surat kutip dari buku Bushra al-Karim bahwa dingin tidak mengizinkan tayammum kecuali pemanasan tidak efektif, tidak ada yang menghangatkan air, dan ada ketakutan akan bahaya pada tubuh atau anggota tubuh, atau terjadinya atau meningkatnya penyakit, dan hanya rasa sakit dari air tidak memungkinkan tayammum."
