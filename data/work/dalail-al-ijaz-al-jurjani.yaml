label:
  ar: "دلائل الإعجاز في علم المعاني"
  en: "Dala'il al-I'jaz (al-Jurjani)"
  ur: "دلائل الاعجاز جرجانی"
  fr: "Dala'il al-I'jaz (al-Jurjani)"
  es: "Dala'il al-I'jaz (al-Jurjani)"
summary:
  ar: "كتاب دلائل الإعجاز في علم المعاني لعبد القاهر الجرجاني، وفيه يقول إن النظم ليس إلا أن يضع المتكلم كلامه الوضع الذي يقتضيه علم النحو {cite:dalail-al-ijaz-shakir-1992 1 p.81}، ويقيم عليه أن الفصاحة والبلاغة تُنسبان إلى المعاني لا إلى اللفظ من حيث هو لفظ {cite:dalail-al-ijaz-shakir-1992 1 p.407}، وأن التحدي يقتضي أن يكون الوصف المطلوب معلوماً للمتحدَّين {cite:dalail-al-ijaz-shakir-1992 1 p.385}."
  en: "Abd al-Qahir al-Jurjani's Dala'il al-I'jaz fi Ilm al-Ma'ani, in which he says nazm is nothing but that the speaker place his speech as the science of nahw requires {cite:dalail-al-ijaz-shakir-1992 1 p.81}, and argues that eloquence and rhetoric belong to meanings, not to the word as word {cite:dalail-al-ijaz-shakir-1992 1 p.407}, and that the challenge requires that the attribute asked for be known to those challenged {cite:dalail-al-ijaz-shakir-1992 1 p.385}."
  ur: "عبد القاہر جرجانی کی دلائل الاعجاز فی علم المعانی، جس میں وہ کہتے ہیں کہ نظم یہی ہے کہ متکلم اپنا کلام اس ترتیب پر رکھے جس کا علمِ نحو تقاضا کرتا ہے {cite:dalail-al-ijaz-shakir-1992 1 p.81}، اور دلیل دیتے ہیں کہ فصاحت اور بلاغت معانی کی صفت ہیں، لفظ کی بحیثیت لفظ نہیں {cite:dalail-al-ijaz-shakir-1992 1 p.407}، اور یہ کہ تحدی کا تقاضا ہے کہ مطلوبہ وصف ان لوگوں کو معلوم ہو جنھیں چیلنج کیا گیا {cite:dalail-al-ijaz-shakir-1992 1 p.385}۔"
  fr: "Dala'il al-I'jaz fi Ilm al-Ma'ani d'Abd al-Qahir al-Jurjani, où il dit que le nazm n'est rien d'autre que le fait pour le locuteur de placer son discours comme l'exige la science du nahw {cite:dalail-al-ijaz-shakir-1992 1 p.81}, et soutient que l'éloquence et la rhétorique appartiennent aux sens, non au mot comme mot {cite:dalail-al-ijaz-shakir-1992 1 p.407}, et que le défi exige que l'attribut demandé soit connu de ceux qu'on défie {cite:dalail-al-ijaz-shakir-1992 1 p.385}."
  es: "Dala'il al-I'jaz fi Ilm al-Ma'ani de Abd al-Qahir al-Jurjani, donde dice que el nazm no es sino que el hablante coloque su discurso como exige la ciencia del nahw {cite:dalail-al-ijaz-shakir-1992 1 p.81}, y sostiene que la elocuencia y la retórica pertenecen a los sentidos, no a la palabra como palabra {cite:dalail-al-ijaz-shakir-1992 1 p.407}, y que el desafío exige que el atributo pedido sea conocido por los desafiados {cite:dalail-al-ijaz-shakir-1992 1 p.385}."
