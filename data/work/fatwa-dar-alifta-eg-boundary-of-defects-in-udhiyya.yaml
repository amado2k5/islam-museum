label: { ar: "الحد الفاصل بين القليل والكثير في عيوب الأضحية", en: "The boundary between slight and gross defects in the udhiyya", ur: "قربانی کے عیوب میں معمولی اور بڑے کی حد", es: "El límite entre defectos leves y graves en el udhiyya" }
summary:
  ar: "سائل سأل عن الحد الفاصل بين القليل والكثير في عيوب الأضحية وعن خروف فيه عرج يسير لم يظهر وقت الشراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20693)⁩ أنه يجوز شرعًا التضحية بالخروف الذي فيه عرج يسير وتكون الأضحية صحيحة مجزئة على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about the boundary between slight and gross defects in the udhiyya, concerning a lamb with a slight limp unnoticed at purchase. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20693) answered that sacrificing it is lawful and the udhiyya valid and sufficient — with the criteria set out in the answer."
  ur: "ایک سائل نے قربانی کے عیوب کی حد اور ایک معمولی لنگڑے ممنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20693)⁩ نے جواب دیا کہ اس کی قربانی جائز اور کافی ہے — ضوابط جواب میں ہیں۔"
  es: "Un consultante preguntó sobre la distinción entre defectos leves y graves en la udhiyya, en relación con un cordero que cojeaba levemente y que no se había notado al comprarlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20693) respondió que su sacrificio es lícito y que la udhiyya es válida y suficiente, según los criterios establecidos en la respuesta."
