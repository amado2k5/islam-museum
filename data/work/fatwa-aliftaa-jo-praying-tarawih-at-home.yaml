id: work/fatwa-aliftaa-jo-praying-tarawih-at-home
class: work
kind: fatwa
label: { ar: "أداء صلاة التراويح في البيت", en: "Praying tarawih at home", ur: "تراویح گھر میں پڑھنا" }
summary:
  ar: "سؤال عن أداء صلاة التراويح في البيت، أجابت فيه دائرة الإفتاء العام الأردنية بأن السنة صلاتها جماعة في المسجد، ولا حرج في صلاتها أحيانًا جماعة مع الأهل في البيت لسبب. أجابت الدائرة بأن من السنة أن يصلي المسلم التراويح جماعة في المسجد. وقالت إنه لو صلاها أحيانًا جماعة مع أهله في البيت لسبب من الأسباب فلا حرج في ذلك."
  en: "A question about praying tarawih at home, in which Jordan's General Iftaa Department answered that the sunna is to pray it in congregation in the mosque, and that there is no objection to sometimes praying it in congregation with one's family at home for a reason. The Department answered that the sunna is for a Muslim to pray tarawih in congregation in the mosque. It said that if he sometimes prays it in congregation with his family at home for some reason, there is no objection."
  ur: "تراویح گھر میں پڑھنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سنت یہ ہے کہ تراویح مسجد میں جماعت سے پڑھی جائے، اور کسی وجہ سے کبھی کبھار گھر والوں کے ساتھ جماعت سے پڑھنے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ سنت یہ ہے کہ مسلمان تراویح مسجد میں جماعت سے پڑھے۔ اس نے کہا کہ اگر وہ کسی وجہ سے کبھی کبھار گھر میں اپنے گھر والوں کے ساتھ جماعت سے پڑھ لے تو اس میں حرج نہیں۔"
