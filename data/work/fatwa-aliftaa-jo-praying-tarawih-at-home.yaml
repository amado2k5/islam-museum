id: work/fatwa-aliftaa-jo-praying-tarawih-at-home
class: work
kind: fatwa
label: { ar: "أداء صلاة التراويح في البيت", en: "Praying tarawih at home", ur: "تراویح گھر میں پڑھنا", es: "Rezar el tarawih en casa", fr: "Prier les tarawih à la maison", tr: "Evde Teravih namazlarını kılmak", id: "Melaksanakan salat Taraweeh di rumah" }
summary:
  ar: "سؤال عن أداء صلاة التراويح في البيت، أجابت فيه دائرة الإفتاء العام الأردنية بأن السنة صلاتها جماعة في المسجد، ولا حرج في صلاتها أحيانًا جماعة مع الأهل في البيت لسبب. أجابت الدائرة بأن من السنة أن يصلي المسلم التراويح جماعة في المسجد. وقالت إنه لو صلاها أحيانًا جماعة مع أهله في البيت لسبب من الأسباب فلا حرج في ذلك."
  en: "A question about praying tarawih at home, in which Jordan's General Iftaa Department answered that the sunna is to pray it in congregation in the mosque, and that there is no objection to sometimes praying it in congregation with one's family at home for a reason. The Department answered that the sunna is for a Muslim to pray tarawih in congregation in the mosque. It said that if he sometimes prays it in congregation with his family at home for some reason, there is no objection."
  ur: "تراویح گھر میں پڑھنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سنت یہ ہے کہ تراویح مسجد میں جماعت سے پڑھی جائے، اور کسی وجہ سے کبھی کبھار گھر والوں کے ساتھ جماعت سے پڑھنے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ سنت یہ ہے کہ مسلمان تراویح مسجد میں جماعت سے پڑھے۔ اس نے کہا کہ اگر وہ کسی وجہ سے کبھی کبھار گھر میں اپنے گھر والوں کے ساتھ جماعت سے پڑھ لے تو اس میں حرج نہیں۔"
  es: "Una pregunta sobre la oración de Tarawih en casa, a la que el Departamento General de Iftaa de Jordania respondió que la sunna es rezarla en congregación en la mezquita, y que no hay inconveniente en rezarla ocasionalmente en congregación con la familia en casa por algún motivo. El Departamento respondió que la sunna es que un musulmán rece Tarawih en congregación en la mezquita. Añadió que si ocasionalmente la reza en congregación con su familia en casa por algún motivo, no hay inconveniente."
  fr: "Concernant la prière de tarawih à domicile, le Département général de la Iftaa en Jordanie a répondu que la sunna recommande de la prier en congrégation à la mosquée, mais qu'il n'y a pas d'objection à la prier occasionnellement en famille à la maison pour une raison particulière. Le Département a précisé que la sunna est pour un musulman de prier tarawih en congrégation à la mosquée. Il a ajouté que si, occasionnellement, il la prie en famille à la maison pour une raison quelconque, cela ne pose aucun problème."
  tr: "Evde teravih namazı kılınmasıyla ilgili bir soruya ise, Ürdün Genel Fetva Dairesi, camide cemaatle namaz kılmanın Sünnet olduğunu ve bazen aile evde cemaatle namaz kılmanın bir sebepten dolayı izin verdiğini yanıtladı. Daire, bir Müslümanın camide cemaatte teravih namazının sünnet olduğunu belirtti. Bazen cemaatte aile evde bir nedenle namaz kılılırsa, bunun zararı olmadığını belirtti."
  id: "Sebuah pertanyaan tentang pelaksanaan shalat Taraweeh di rumah, Departemen Fatwa Umum Yordania menjawab bahwa adalah Sunnah untuk berdoa dalam jemaat di masjid, dan terkadang diperbolehkan berdoa bersama keluarga di rumah karena suatu alasan. Departemen menjawab bahwa adalah Sunnah bagi seorang Muslim untuk berdoa Taraweeh dalam jemaat di masjid. Mereka mengatakan bahwa jika kadang-kadang shalat dilakukan dalam jemaat bersama keluarga di rumah karena satu alasan, tidak ada salahnya itu."
