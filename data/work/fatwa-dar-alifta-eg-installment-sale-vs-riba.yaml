id: work/fatwa-dar-alifta-eg-installment-sale-vs-riba
class: work
kind: fatwa
label: { ar: "حكم البيع بالتقسيط والفرق بينه وبين الربا", en: "Sale by installments and its difference from riba", ur: "اقساط پر بیع اور سود سے اس کا فرق", es: "Venta a plazos y su diferencia con la usura", fr: "Vente à tempérament et sa différence avec le riba" }
summary:
  ar: "سائل سأل عن حكم البيع بالتقسيط والفرق بينه وبين الربا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23885)⁩ أنه لا مانع شرعًا من بيع السلع الاستهلاكية بنظام التقسيط مع زيادة معلومة على الثمن الأصلي وأجل معلوم، وبيّن الجواب الفارق بين هذه الزيادة والربا المحرم."
  en: "A questioner asked the ruling on sale by installments and its difference from riba. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23885) answered that nothing bars selling consumer goods on installments with a known increase over the base price for a known term, and the answer sets out the difference between this increase and forbidden riba."
  ur: "ایک سائل نے اقساط پر بیع کا حکم اور سود سے اس کا فرق پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23885)⁩ نے جواب دیا کہ معلوم مدت میں اصل قیمت پر معلوم اضافے کے ساتھ خوردنی اشیاء اقساط پر بیچنے میں شرعاً کوئی مانع نہیں، اور جواب میں اس اضافے اور حرام سود کے درمیان فرق بیان کیا گیا۔"
  es: "Un consultante preguntó sobre la normativa relativa a la venta a plazos y su diferencia con la usura (riba). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 23885) respondió que nada prohíbe la venta de bienes de consumo a plazos con un incremento conocido sobre el precio base durante un plazo determinado, y la respuesta establece la diferencia entre este incremento y la usura prohibida."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23885) sur la question de la vente à tempérament et sa différence avec l'usure (riba). La fatwa égyptienne n° 23885 indique qu'aucune disposition n'interdit la vente de biens de consommation à tempérament avec une majoration connue par rapport au prix de base et pour une durée déterminée. La réponse précise la différence entre cette majoration et l'usure (riba), pratique interdite."
