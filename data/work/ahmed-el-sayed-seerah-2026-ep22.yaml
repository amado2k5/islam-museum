class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 22: سيرة رسول الله 22 | التعريف بمهاجري الحبشة وسيرهم ووفياتهم"
  en: "The Biography of the Messenger of God 2026, episode 22: The Emigrants to Abyssinia: Who They Were, Their Lives and Their Deaths"
  ur: "سیرتِ رسول اللہ 2026، قسط 22: مہاجرین حبشہ کا تعارف، ان کی سیرتیں اور وفاتیں"
  fr: "La biographie du Messager de Dieu 2026, épisode 22 : Les émigrés en Abyssinie : qui ils étaient, leurs vies et leurs morts"
  es: "La biografía del Mensajero de Dios 2026, episodio 22: Los emigrados a Abisinia: quiénes fueron, sus vidas y sus muertes"
summary:
  ar: "يبدأ المحاضر بسيرة خباب بن الأرت، ثم يتم قائمة ابن إسحاق لمهاجري الحبشة بحسب البطون: جمح وسهم وعدي وعامر بن لؤي والحارث بن فهر. ويتوقف طويلاً عند هشام بن العاص وعند أسر من السابقين إلى الإسلام خرجت من بيوت كبار خصوم قريش، ويختم بشعر عبد الله بن الحارث وبفائدة فقهية للسهيلي في الهجرة حفاظاً على الدين."
  en: "He opens with a biography of Khabbab ibn al-Aratt, then completes Ibn Ishaq's list of the emigrants to Abyssinia by clan: Jumah, Sahm, Adi, Amir ibn Luayy and al-Harith ibn Fihr. He dwells on Hisham ibn al-As and on families of the early Muslims who came out of houses of Quraysh's leading opponents, and closes with poetry of Abdullah ibn al-Harith and a jurisprudential note of al-Suhayli on emigrating to protect one's religion."
  ur: "مقرر خباب بن الارت کی سوانح سے آغاز کرتے ہیں، پھر ابن اسحاق کی مہاجرین حبشہ کی فہرست قبیلوں کے لحاظ سے مکمل کرتے ہیں: جمح، سہم، عدی، عامر بن لؤی اور حارث بن فہر۔ وہ ہشام بن العاص پر اور ابتدائی مسلمانوں کے ان خاندانوں پر دیر تک ٹھہرتے ہیں جو قریش کے بڑے مخالفین کے گھروں سے نکلے، اور آخر میں عبداللہ بن حارث کے اشعار اور دین کی حفاظت کے لیے ہجرت کے بارے میں سہیلی کے ایک فقہی نکتے پر بات ختم کرتے ہیں۔"
  fr: "Il ouvre par une biographie de Khabbab ibn al-Aratt, puis complète la liste d'Ibn Ishaq des émigrés en Abyssinie par clan : Jumah, Sahm, Adi, Amir ibn Luayy et al-Harith ibn Fihr. Il s'attarde sur Hisham ibn al-As et sur des familles des premiers musulmans issues des maisons des principaux adversaires de Quraych, et conclut par la poésie d'Abdallah ibn al-Harith et par une note juridique d'al-Suhayli sur l'émigration pour protéger sa religion."
  es: "Abre con una biografía de Jabbab ibn al-Aratt y completa luego la lista de Ibn Ishaq de los emigrados a Abisinia por clanes: Yumah, Sahm, Adi, Amir ibn Luayy y al-Harith ibn Fihr. Se detiene en Hisham ibn al-As y en familias de los primeros musulmanes que salieron de las casas de los principales opositores de los quraishíes, y cierra con la poesía de Abdalá ibn al-Harith y una nota jurídica de al-Suhayli sobre emigrar para proteger la religión."
