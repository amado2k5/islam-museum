label:
  ar: "إرشاد الساري لشرح صحيح البخاري"
  en: "Irshad al-Sari li-Sharh Sahih al-Bukhari"
  ur: "ارشاد الساری لشرح صحیح البخاری"
summary:
  ar: "شرح شهاب الدين أحمد بن محمد القسطلاني (ت 923هـ) على صحيح البخاري، مزج فيه الشرح بالمتن مزجاً وميّز الأصل بالحمرة، ويحرر الروايات ويضبط الألفاظ ويشرح الغريب، واستمد كثيراً من «فتح الباري» لابن حجر؛ وصدّره بمقدمة في خمسة فصول: فضل أهل الحديث، وأول من دوّن الحديث، ومصطلح الحديث، وشرط البخاري وصحيحه، ونسب البخاري وسيرته {cite:irshad-sari-amiriyya-1323 p. 5-6} {cite:irshad-sari-amiriyya-1323 p. 21}."
  en: "The commentary of Shihab al-Din Ahmad b. Muhammad al-Qastallani (d. 923 AH) on Sahih al-Bukhari, blending commentary into the text and marking the original in red, establishing the variant transmissions, fixing the wording and explaining rare words, and drawing heavily on Ibn Hajar's Fath al-Bari; it opens with an introduction in five chapters: the merit of the hadith scholars, the first to compile hadith, hadith terminology, al-Bukhari's conditions and his Sahih, and al-Bukhari's lineage and life {cite:irshad-sari-amiriyya-1323 p. 5-6} {cite:irshad-sari-amiriyya-1323 p. 21}."
  ur: "شہاب الدین احمد بن محمد قسطلانی (وفات 923ھ) کی صحیح بخاری کی شرح، جس میں شرح کو متن میں ملا دیا گیا اور اصل کو سرخی سے ممتاز کیا گیا؛ اس میں روایات کی تحریر، الفاظ کا ضبط اور غریب کی شرح ہے، اور ابن حجر کی «فتح الباری» سے بہت استفادہ کیا گیا؛ اس کے شروع میں پانچ فصلوں کا مقدمہ ہے: اہلِ حدیث کی فضیلت، تدوینِ حدیث کا آغاز، اصطلاحاتِ حدیث، بخاری کی شرط اور ان کی صحیح، اور بخاری کا نسب اور سیرت {cite:irshad-sari-amiriyya-1323 p. 5-6} {cite:irshad-sari-amiriyya-1323 p. 21}۔"
