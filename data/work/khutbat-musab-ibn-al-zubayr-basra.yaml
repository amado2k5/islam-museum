summary:
  ar: "خطبة مصعب بن الزبير بالبصرة سنة ٨٠هـ حين ولاه أخوه عبد الله بن الزبير العراق."
  en: "Mus'ab ibn al-Zubayr's sermon in Basra in 80 AH when his brother Abdullah made him governor of Iraq."
  ur: "۸۰ھ میں بصرہ میں مصعب کی خطبہ جب بھائی عبداللہ بن زبیر نے عراق کا والی بنایا۔"
  es: "Sermón de Mus'ab ibn al-Zubayr en Basora en el año 80 de la Hégira, cuando su hermano Abdullah lo nombró gobernador de Irak."
  fr: "Le sermon de Mus'ab ibn al-Zubayr à Bassora en 80 AH, lorsque son frère Abdullah le nomma gouverneur d'Irak."
  tr: "80 Hicri yılında, kardeşi Abdullah ibn al-Zubayr tarafından Irak valisi olarak atanan Mus'ab ibn al-Zubayr'ın Basra'daki vaazı."
  id: "Khotbah Mus'ab ibn al-Zubayr di Basra pada tahun 80 H ketika saudaranya Abdullah ibn al-Zubayr mengangkatnya sebagai gubernur Irak."
