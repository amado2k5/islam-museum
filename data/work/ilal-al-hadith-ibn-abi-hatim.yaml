structure: "أقوال في فضل معرفة العلل (الجزء الأول، ص 13 من المسح) ← «بيان علل أخبار رويت في الطهارة» ثم الصلاة والزكاة والصوم والمناسك (الجزء الأول) ← الأطعمة والأشربة والأضاحي والصيد والفرائض والقرآن وتفسيره والزهد والإيمان وثواب الأعمال والدعاء والأدب والطب والفضائل ودلائل النبوة والخراج (الجزء الثاني)؛ كل مسألة مرقمة تبدأ غالباً بـ«سألت أبي» أو «سألت أبا زرعة»"
