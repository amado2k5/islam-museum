label: { ar: "علل الحديث لابن أبي حاتم", en: "Ilal al-Hadith of Ibn Abi Hatim" }
summary:
  ar: "كتاب عبد الرحمن بن أبي حاتم الرازي (ت 327هـ) في علل الحديث، جمع فيه أسئلته لأبيه أبي حاتم ولأبي زرعة الرازي عن أحاديث وقع فيها خطأ أو اختلاف في الإسناد أو المتن وأجوبتهما، مرتبة على أبواب الفقه ثم التفسير والزهد والإيمان والأدب والفضائل وغيرها. قال ناشره محب الدين الخطيب إنه فحص فيه علل نحو ثلاثة آلاف حديث، وتتجاوز مسائله المرقمة في الطبعة السلفية 2800 مسألة."
  en: "Abd al-Rahman ibn Abi Hatim al-Razi's (d. 327 AH) book on the hidden defects of hadith, collecting his questions to his father Abu Hatim and to Abu Zur'a al-Razi about hadith with an error or a disagreement in chain or text, and their answers, arranged by the chapters of law and then Qur'an commentary, renunciation, faith, manners, virtues and more. Its publisher Muhibb al-Din al-Khatib says it examines the defects of about three thousand hadith; the Salafiyya printing numbers more than 2,800 questions."
