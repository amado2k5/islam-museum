label: { ar: "علل الحديث لابن أبي حاتم", en: "Ilal al-Hadith of Ibn Abi Hatim", es: "Ilal al-Hadith de Ibn Abi Hatim", fr: "Ilal al-Hadith d'Ibn Abi Hatim", ur: "ابن ابی حاتم کی علل الحدیث", tr: "İbn Ebi Hatim'in Hadislerin Kusurları", id: "Kekurangan Hadis oleh Ibn Abi Hatim" }
summary:
  ar: "كتاب عبد الرحمن بن أبي حاتم الرازي ⁦(ت 327هـ)⁩ في علل الحديث، جمع فيه أسئلته لأبيه أبي حاتم ولأبي زرعة الرازي عن أحاديث وقع فيها خطأ أو اختلاف في الإسناد أو المتن وأجوبتهما، مرتبة على أبواب الفقه ثم التفسير والزهد والإيمان والأدب والفضائل وغيرها. قال ناشره محب الدين الخطيب إنه فحص فيه علل نحو ثلاثة آلاف حديث، وتتجاوز مسائله المرقمة في الطبعة السلفية 2800 مسألة."
  en: "Abd al-Rahman ibn Abi Hatim al-Razi's (d. 327 AH) book on the hidden defects of hadith, collecting his questions to his father Abu Hatim and to Abu Zur'a al-Razi about hadith with an error or a disagreement in chain or text, and their answers, arranged by the chapters of law and then Qur'an commentary, renunciation, faith, manners, virtues and more. Its publisher Muhibb al-Din al-Khatib says it examines the defects of about three thousand hadith; the Salafiyya printing numbers more than 2,800 questions."
  es: "El libro de Abd al-Rahman ibn Abi Hatim al-Razi (fallecido en el año 327 de la Hégira) sobre los defectos ocultos de los hadices, recopila sus preguntas a su padre Abu Hatim y a Abu Zur'a al-Razi acerca de hadices con errores o discrepancias en la cadena de transmisión o el texto, y sus respuestas, organizado por capítulos sobre la ley y luego sobre el comentario del Corán, la renuncia, la fe, las costumbres, las virtudes y otros temas. Su editor, Muhibb al-Din al-Khatib, afirma que examina los defectos de unos tres mil hadices; la edición salafista cifra las preguntas en más de 2800."
  fr: "L'ouvrage d'Abd al-Rahman ibn Abi Hatim al-Razi (mort en 327 AH) sur les défauts cachés des hadiths rassemble ses questions à son père Abu Hatim et à Abu Zur'a al-Razi concernant les hadiths comportant une erreur ou une divergence dans la chaîne de transmission ou le texte, ainsi que leurs réponses, classées par chapitres: droit, commentaire du Coran, renoncement, foi, mœurs, vertus, etc. Son éditeur, Muhibb al-Din al-Khatib, affirme qu'il examine les défauts d'environ trois mille hadiths; l'édition salafiste en recense plus de 2 800."
  ur: "عبدالرحمٰن بن ابی حاتم الرازی ⁦(متوفی 327ھ)⁩ کی حدیث کے چھپے ہوئے نقائص پر مشتمل کتاب، اپنے والد ابو حاتم اور ابو زرعہ الرازی سے حدیث کے سلسلہ یا متن میں غلطی یا اختلاف کے بارے میں ان کے سوالات جمع کرنا، اور ان کے جوابات، تبصرے، قانون، تبصرے، عقیدہ، شریعت اور اصول کے مطابق ترتیب دیے گئے ہیں۔ آداب، فضائل اور بہت کچھ۔ اس کے ناشر محب الدین الخطیب کا کہنا ہے کہ اس میں تقریباً تین ہزار احادیث کے نقائص کا جائزہ لیا گیا ہے۔ سلفیہ پرنٹنگ نمبر 2,800 سے زیادہ سوالات ہیں۔"
  tr: "Abdülrahman bin Ebi Hatim el-Razi'nin (ö. 327 Hicri yılı) hadislerin nedenleri üzerine kitabı, babası Ebu Hatim ve Ebu Zur'ah al-Razi'den, hadislerin zincirinde veya metinde hata veya farklılık ve cevaplar hakkında sorularını toplamıştır; bu sorular fihhih, ardından tefsir, münzevi, inanç, edebiyat, erdemler ve diğer bölümler altında düzenlenmiştir. Yayınevi Muhibdin el-Hatib yaklaşık üç bin hadisi incelediğini ve selefi baskıda sayılanan sayıların 2.800'ü aştığını belirtmiştir."
  id: "Kitab Abd al-Rahman ibn Abi Hatim al-Razi (wafat 327 H) tentang sebab-sebab hadis, di mana ia mengumpulkan pertanyaannya dari ayahnya Abu Hatim dan Abu Zur'ah al-Razi tentang hadis di mana kesalahan atau perbedaan terjadi dalam rantai atau teks dan jawabannya, yang diatur berdasarkan bab-bab yurisprudensi, kemudian tafsir, asketisme, iman, sastra, kebajikan, dan lainnya. Penerbitnya, Muhib al-Din al-Khatib, mengatakan ia menelaah sekitar tiga ribu hadits, dan edisi yang dihitung dalam edisi Salafi melebihi 2.800 edisi."
