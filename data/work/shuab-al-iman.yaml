summary:
  ar: "الجامع لشعب الإيمان للبيهقي (ت 458هـ)، مصنف في فروع الإيمان يعدّها شعباً مرتبة بالأبواب؛ الجزء العاشر من طبعة دار الرشد (1423هـ) يضم الشعبتين الخمسين إلى السابعة والخمسين، ومنها التمسك بالجماعة والحكم بين الناس والأمر بالمعروف والتعاون على البر والحياء وبر الوالدين وصلة الأرحام وحسن الخلق."
  en: "al-Bayhaqi's (d. 458 AH) al-Jami' li-Shu'ab al-Iman, arranged as chapters on the branches of faith. Volume 10 of the Dar al-Rushd edition (1423 AH) covers branches 50 to 57: adherence to the community, judging between people, enjoining good and forbidding wrong, cooperation in piety, modesty, honouring parents, keeping ties of kinship and good character."
