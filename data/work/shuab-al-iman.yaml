summary:
  ar: "الجامع لشعب الإيمان للبيهقي ⁦(ت 458هـ)⁩، مصنف في فروع الإيمان يعدّها شعباً مرتبة بالأبواب؛ الجزء العاشر من طبعة دار الرشد ⁦(1423هـ)⁩ يضم الشعبتين الخمسين إلى السابعة والخمسين، ومنها التمسك بالجماعة والحكم بين الناس والأمر بالمعروف والتعاون على البر والحياء وبر الوالدين وصلة الأرحام وحسن الخلق."
  en: "al-Bayhaqi's (d. 458 AH) al-Jami' li-Shu'ab al-Iman, arranged as chapters on the branches of faith. Volume 10 of the Dar al-Rushd edition (1423 AH) covers branches 50 to 57: adherence to the community, judging between people, enjoining good and forbidding wrong, cooperation in piety, modesty, honouring parents, keeping ties of kinship and good character."
  es: "La obra de al-Bayhaqi (fallecido en el año 458 de la Hégira), titulada al-Jami' li-Shu'ab al-Iman, está organizada en capítulos sobre las ramas de la fe. El volumen 10 de la edición de Dar al-Rushd (1423 de la Hégira) abarca las ramas 50 a 57: adhesión a la comunidad, discernimiento entre las personas, exhortación al bien y prohibición del mal, cooperación en la piedad, modestia, respeto a los padres, mantenimiento de los lazos familiares y buen carácter."
  fr: "L'ouvrage d'al-Bayhaqi (mort en 458 AH), al-Jami' li-Shu'ab al-Iman, est organisé en chapitres consacrés aux branches de la foi. Le volume 10 de l'édition Dar al-Rushd (1423 AH) traite des branches 50 à 57: l'attachement à la communauté, le discernement entre les personnes, l'injonction au bien et l'interdiction du mal, la coopération dans la piété, la modestie, le respect des parents, le maintien des liens de parenté et la bonne moralité."
  ur: "بیہقی کی ⁦(متوفی 458ھ)⁩ الجامع لی شعب الایمان، ایمان کی شاخوں کے ابواب کے طور پر ترتیب دی گئی ہے۔ دارالرشد ایڈیشن ⁦(1423ھ)⁩ کی جلد 10 شاخوں 50 سے 57 تک پر محیط ہے: برادری کی پابندی کرنا، لوگوں کے درمیان فیصلہ کرنا، نیکی کا حکم دینا اور برائی سے روکنا، تقویٰ میں تعاون، تواضع، والدین کا احترام، رشتہ داری اور حسن سلوک۔"
