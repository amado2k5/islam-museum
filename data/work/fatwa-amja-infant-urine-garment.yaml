id: work/fatwa-amja-infant-urine-garment
class: work
kind: fatwa
label: { ar: "بول الغلام والجارية", en: "A boy's urine sprinkled, a girl's washed — the two rules", ur: "لڑکے لڑکی کا پیشاب — چھینٹ اور دھلائی" }
summary:
  ar: "سأل سائل عن حكم بول الطفل على الثياب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23261 بتاريخ 7 يوليو 2008)⁩ أن القاعدة أنه ينضح من بول الغلام ما لم يتغذ بالطعام فإذا تغذى به فإنه يغسل وأما الجارية فإنه يغسل بولها مطلقًا طعمت أو لم تطعم والأصل في ذلك ما أخرجه البخاري وغيره من حديث أم قيس بنت محصن على ما فصّل الجواب."
  en: "A questioner asked the ruling on an infant's urine reaching the clothes. Dr. Salah al-Sawi (fatwa no. 23261, 7 July 2008) answered that the rule is sprinkling over a boy's urine so long as he is not yet fed food — once he is fed, it is washed; as for a girl, her urine is washed in every case, fed or not; the root of it is what al-Bukhari and others narrated from Umm Qays bint Mihsan — as the answer details."
  ur: "بچے کا پیشاب کپڑوں پر؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23261، 7 جولائی 2008)⁩ کے مطابق لڑکے پر چھینٹ کافی جب تک کھانا نہ کھائے؛ لڑکی کا دھونا ہوگا۔"
