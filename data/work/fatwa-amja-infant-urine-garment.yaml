id: work/fatwa-amja-infant-urine-garment
class: work
kind: fatwa
label: { ar: "بول الغلام والجارية", en: "A boy's urine sprinkled, a girl's washed — the two rules", ur: "لڑکے لڑکی کا پیشاب — چھینٹ اور دھلائی", es: "La orina de un niño esparcida, la de una niña lavada: las dos reglas", fr: "L'urine d'un garçon aspergée, celle d'une fille lavée — les deux règles", tr: "Çocuğun idrarı ve köle kızın idrarı", id: "Urine anak laki-laki dan urin budak perempuan" }
summary:
  ar: "سأل سائل عن حكم بول الطفل على الثياب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23261 بتاريخ 7 يوليو 2008)⁩ أن القاعدة أنه ينضح من بول الغلام ما لم يتغذ بالطعام فإذا تغذى به فإنه يغسل وأما الجارية فإنه يغسل بولها مطلقًا طعمت أو لم تطعم والأصل في ذلك ما أخرجه البخاري وغيره من حديث أم قيس بنت محصن على ما فصّل الجواب."
  en: "A questioner asked the ruling on an infant's urine reaching the clothes. Dr. Salah al-Sawi (fatwa no. 23261, 7 July 2008) answered that the rule is sprinkling over a boy's urine so long as he is not yet fed food — once he is fed, it is washed; as for a girl, her urine is washed in every case, fed or not; the root of it is what al-Bukhari and others narrated from Umm Qays bint Mihsan — as the answer details."
  ur: "بچے کا پیشاب کپڑوں پر؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23261، 7 جولائی 2008)⁩ کے مطابق لڑکے پر چھینٹ کافی جب تک کھانا نہ کھائے؛ لڑکی کا دھونا ہوگا۔"
  es: "Un consultante preguntó sobre la norma relativa a la orina de un bebé que llega a la ropa. El Dr. Salah al-Sawi (fatwa n.º 23261, 7 de julio de 2008) respondió que la norma es rociar la orina de un niño mientras no haya comido; una vez que coma, se lava. En cuanto a una niña, su orina se lava en todos los casos, coma o no; el origen de esta norma se encuentra en lo que al-Bujari y otros narraron de Umm Qays bint Mihsan, como se detalla en la respuesta."
  fr: "Une personne a posé la question concernant la règle à suivre si l'urine d'un nourrisson tache ses vêtements. Le Dr Salah al-Sawi (fatwa n° 23261, 7 juillet 2008) a répondu que la règle consiste à essuyer l'urine d'un garçon tant qu'il n'a pas encore été nourri; une fois nourri, on lave ses vêtements. Quant à une fille, son urine doit être lavée systématiquement, qu'elle ait été nourrie ou non. Cette règle est fondée sur un hadith rapporté par al-Bukhari et d'autres, d'après Umm Qays bint Mihsan, comme le précise la réponse."
  tr: "Bir çocuğun idrarının kıyafetlere uygulanması hakkındaki karar hakkında bir soru soruldu. Dr. Salah Al-Sawi (7 Temmuz 2008 tarihli 23261 No'lu Fetva) şöyle yanıt verdi: Kural, çocuğun idrarının yiyecekle beslenmediği sürece boşalmasıdır. Eğer yiyecekle beslenirse, yıkanmalıdır. Köle kız ise, beslenmiş olup olmamasına bakılmaksızın idrarını yıkar. Bunun temel dayanağı, Al-Buhari ve diğerlerinin Um Kais bint Muhsin'in hadislerinden rivayet ettikleridir; bu da cevapta açıklanmıştır."
  id: "Seorang penanya ditanya tentang keputusan urin anak pada pakaian. Dr. Salah Al-Sawi menjawab (Fatwa No. 23261 tanggal 7 Juli 2008) bahwa aturannya adalah urin anak laki-laki keluar kecuali ia diberi nutrisi dengan makanan. Jika ia diberi makan dengan itu, ia harus dicuci. Sedangkan budak perempuan, ia mencuci urinnya tanpa memandang apakah ia diberi makan atau tidak. Dasar dasarnya adalah apa yang diceritakan oleh Al-Bukhari dan lainnya dari hadits um Qais bint Muhsin, seperti yang dijelaskan dalam jawaban."
