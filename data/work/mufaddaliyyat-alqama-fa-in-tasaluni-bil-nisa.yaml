summary:
  ar: "قصيدة في المفضليات من الطويل على روي الباء، منها «فإن تسألوني بالنساء فإنني بصير بأدواء النساء طبيب»، كما في طبعة المطبعة الرحمانية {{cite:mufaddaliyyat-rahmaniyya-1926 p.187}}."
  en: "A poem of the Mufaddaliyyat in the tawil metre on the rhyme ba, containing \"If you ask me about women, I am a skilled physician of women's ailments\", as in the Rahmaniyya edition {{cite:mufaddaliyyat-rahmaniyya-1926 p.187}}."
  es: "Un poema de la Mufaddaliyyat en metro tawil con rima ba, que contiene \"Si me preguntas sobre las mujeres, soy un médico experto en dolencias femeninas\", como en la edición Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.187}}."
  fr: "Un poème du Mufaddaliyyat en mètre tawil sur la rime ba, contenant « Si vous me demandez des informations sur les femmes, je suis un médecin compétent des maladies des femmes », comme dans l'édition Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.187}}."
