label: { ar: "عقيلة أتراب القصائد في أسنى المقاصد", en: "'Aqilat Atrab al-Qasa'id fi Asna al-Maqasid (al-Ra'iyya)", ur: "عقیلۃ اتراب القصائد فی اسنی المقاصد ⁦(الرائیہ)⁩" }
summary:
  ar: "قصيدة القاسم بن فِيرُّه الشاطبي الرعيني الأندلسي ⁦(ت 590هـ)⁩ في رسم المصحف على حرف الراء، فتُعرف بالرائية؛ عدّها السيوطي بين كتب الرسم، وشرحها السخاوي في «الوسيلة إلى كشف العقيلة»، وشرحها ابن جبارة المقدسي في شرح مخطوط {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 486}."
  en: "The poem of al-Qasim ibn Firruh al-Shatibi al-Ru'ayni al-Andalusi (d. 590 AH) on the spelling of the mushaf, rhymed in ra' and so called the Ra'iyya; al-Suyuti counts it among the books of rasm, al-Sakhawi commented on it in al-Wasila ila Kashf al-'Aqila, and Ibn Jubara al-Maqdisi in a commentary that survives in manuscript {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 486}."
  ur: "قاسم بن فیرہ شاطبی رعینی اندلسی ⁦(م 590ھ)⁩ کا مصحف کے رسم پر قصیدہ جو را کی قافیہ بندی پر ہے اس لیے رائیہ کہلاتا ہے؛ سیوطی اسے کتبِ رسم میں گنتے ہیں، سخاوی نے اس کی شرح «الوسیلۃ الی کشف العقیلۃ» میں اور ابن جبارہ مقدسی نے ایک مخطوط شرح میں کی {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 486}۔"
  es: "El poema de al-Qasim ibn Firruh al-Shatibi al-Ru'ayni al-Andalusi (m. 590 d. H.) sobre la ortografía del mushaf, rimado en ra' y llamado Ra'iyya; al-Suyuti lo cuenta entre los libros de rasm, al-Sakhawi lo comentó en al-Wasila ila Kashf al-'Aqila, e Ibn Jubara al-Maqdisi en un comentario que sobrevive en un manuscrito {citar:itqan-suyuti p. 37} {citar:itqan-suyuti p. 486}."
  fr: "Le poème d'al-Qasim ibn Firruh al-Shatibi al-Ru'ayni al-Andalusi (mort en 590 AH) sur l'orthographe du mushaf, rimé en ra' et ainsi appelé Ra'iyya; al-Suyuti le compte parmi les livres de rasm, al-Sakhawi l'a commenté dans al-Wasila ila Kashf al-'Aqila, et Ibn Jubara al-Maqdisi dans un commentaire qui survit dans le manuscrit {cite:itqan-suyuti p. 37} {cite: itqan-suyuti p. 486}."
