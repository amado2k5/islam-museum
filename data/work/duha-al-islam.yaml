summary:
  ar: "ضحى الإسلام لأحمد أمين، الجزء الثاني من سلسلته في تاريخ الفكر الإسلامي؛ يعالج في ثلاثة أجزاء الحياة الاجتماعية ⁦(سكان المملكة الإسلامية، الصراع بين العرب والموالي، الشعوبية، الرقيق، حياة اللهو والجد، الزندقة والإيمان)⁩، والثقافات ⁦(الفارسية والهندية واليونانية الرومانية والعربية والدينية وامتزاجها)⁩، والحركة العلمية ⁦(معاهد العلم، الحديث والتفسير، التشريع، اللغة والنحو، التاريخ)⁩، والعقائد والمذاهب ⁦(نشأة علم الكلام، المعتزلة، الشيعة، المرجئة، الخوارج)⁩ في العصر العباسي الأول {cite:duha-islam p. 6-7}."
  en: "Ahmad Amin's Duha al-Islam — the middle volume of his trilogy on Islamic intellectual history, covering Abbasid-era social life, the constituent cultures, the scholarly movement and the creeds {cite:duha-islam p. 6-7}."
  es: "Duha al-Islam de Ahmad Amin — el volumen central de su trilogía sobre la historia intelectual islámica, que abarca la vida social de la era abasí, las culturas constituyentes, el movimiento académico y los credos {cite:duha-islam p. 6-7}."
  fr: "Duha al-Islam d'Ahmad Amin — le volume intermédiaire de sa trilogie sur l'histoire intellectuelle islamique, couvrant la vie sociale de l'époque abbasside, les cultures constitutives, le mouvement savant et les croyances {cite:duha-islam p. 6-7}."
  ur: "احمد امین کی دوحہ الاسلام - اسلامی فکری تاریخ پر ان کی تریی کی درمیانی جلد، جس میں عباسی دور کی سماجی زندگی، بنیادی ثقافتوں، علمی تحریک اور عقائد کا احاطہ کیا گیا ہے۔ 6-7}۔"
  tr: "Ahmed Amin'in Duha al-Islam adlı eseri, İslam düşüncesinin tarihi üzerine serisinin ikinci bölümü; sosyal yaşamı üç bölümde ele alır (İslam Krallığı nüfusu, Araplar ile Mevaliler arasındaki çatışma, Şuubiye, kölelik, eğlence ve büyükbabalık yaşamı, sapkınlık ve inanç), kültürler (Fars, Hint, Yunan, Roma, Arap ve dini ve bunların karışımı), bilimsel hareket (bilgi enstitüleri, hadis ve tefsir, mevzuat, dil ve dilbilgisi, tarih) ve doktrinler ile okullar (teoloji, Mu'tazila, Şii, Murji'i, Harici hali) erken Abbasi döneminde ortaya çıkmıştır {atıf:Duha-İslam, s. 6-7}."
  id: "Duha al-Islam oleh Ahmed Amin, bagian kedua dari seri tentang sejarah pemikiran Islam; buku ini membahas kehidupan sosial dalam tiga bagian (populasi Kerajaan Islam, konflik antara Arab dan Mawali, Shu'ubiya, perbudakan, kehidupan hiburan dan keturunan, bid'ah dan iman), budaya (Persia, India, Yunani, Romawi, Arab, dan agama serta perpaduannya), gerakan ilmiah (institut pengetahuan, hadis dan tafsir, legislasi, bahasa dan tata bahasa, sejarah), serta doktrin dan sekolah (munculnya teologi, Mu'tazila, Syiah, Murji'i, Kharijit) pada era Abbasiyah awal {cite:Duha-Islam, hlm. 6-7}."
