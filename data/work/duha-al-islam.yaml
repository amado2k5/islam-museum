summary:
  ar: "ضحى الإسلام لأحمد أمين، الجزء الثاني من سلسلته في تاريخ الفكر الإسلامي؛ يعالج في ثلاثة أجزاء الحياة الاجتماعية (سكان المملكة الإسلامية، الصراع بين العرب والموالي، الشعوبية، الرقيق، حياة اللهو والجد، الزندقة والإيمان)، والثقافات (الفارسية والهندية واليونانية الرومانية والعربية والدينية وامتزاجها)، والحركة العلمية (معاهد العلم، الحديث والتفسير، التشريع، اللغة والنحو، التاريخ)، والعقائد والمذاهب (نشأة علم الكلام، المعتزلة، الشيعة، المرجئة، الخوارج) في العصر العباسي الأول {cite:duha-islam p. 6-7}."
  en: "Ahmad Amin's Duha al-Islam — the middle volume of his trilogy on Islamic intellectual history, covering Abbasid-era social life, the constituent cultures, the scholarly movement and the creeds {cite:duha-islam p. 6-7}."
