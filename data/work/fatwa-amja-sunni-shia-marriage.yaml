id: work/fatwa-amja-sunni-shia-marriage
class: work
kind: fatwa
label: { ar: "زواج السنية من الشيعي", en: "Marriage between a Sunni and a Shia", ur: "سنی اور شیعہ میں نکاح", es: "Matrimonio entre un sunita y un chiíta", fr: "Mariage entre un sunnite et un chiite", tr: "Bir Sünninin Bir Şii ile Evliliği", id: "Pernikahan seorang Sunni dengan Syiah" }
summary:
  ar: "سأل سائل هل يمنع شرعًا زواج فتاة مسلمة سنية من شاب مسلم شيعي أو العكس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79514 بتاريخ 26 يوليو 2009)⁩ أن من كان من أهل القبلة يصح عقد النكاح له، والشيعة ليسوا سواء: فمنهم العامة وأشباه العامة الذين لا يعرفون من مواريث التشيع إلا الانتماء التاريخي فهؤلاء لهم حكم أمثالهم من عوام أهل السنة، وأما من يتدين بسب الشيخين أو سب أم المؤمنين مما برأها الله منه أو القول بتحريف القرآن فلا يصح عقده لأن هذه العقائد لا تجتمع مع أصل الإيمان، ومن كان بين هؤلاء وهؤلاء فلا يحب للمسلمة السنية أن تجازف بالزواج منه لأن التجانس العقدي والكفاءة في الدين والخلق من آكد أسباب نجاح الزواج."
  en: "A questioner asked whether the sharia bars a Sunni Muslim woman from marrying a Shia Muslim man, or vice versa. Dr. Salah al-Sawi (fatwa no. 79514, 26 July 2009) answered that whoever is of the people of the qibla can validly contract marriage, and the Shia are not one kind: the common folk and near-common who know of Shia inheritance only a historical affiliation carry the ruling of their like among the Sunni public; but one who holds as religion cursing the two Shaykhs, or cursing the Mother of the Believers in what God cleared her of, or the Quran's distortion — his contract is invalid, such beliefs being incompatible with the root of faith; whoever lies between, a Sunni woman is not encouraged to risk marrying him, since creedal compatibility and equivalence in religion and character are among the firmest grounds of a sound marriage. Recorded as AMJA's answer."
  ur: "ایک سائل نے سنی لڑکی اور شیعہ لڑکے کے نکاح کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79514، 26 جولائی 2009)⁩ کے مطابق اہل قبلہ کا نکاح صحیح ہے مگر جس کی معتقدات ایمان سے متصادم ہوں اس کا نکاح باطل؛ بیچ والے سے سنی لڑکی کو رجوع نہیں کرانا چاہیے۔"
  es: "Un consultante preguntó si la sharia prohíbe que una mujer musulmana sunita se case con un hombre musulmán chiita, o viceversa. El Dr. Salah al-Sawi (fatwa n.° 79514, 26 de julio de 2009) respondió que quien pertenece a la gente de la qibla puede contraer matrimonio válidamente, y que los chiitas no son un grupo homogéneo: la gente común y la gente cercana a la gente común que conoce la herencia chiita solo por una afiliación histórica siguen la norma de su afinidad entre el público sunita; pero quien profesa como religión maldecir a los dos jeques, o maldecir a la Madre de los Creyentes por lo que Dios la exoneró, o distorsionar el Corán, su matrimonio es inválido, ya que tales creencias son incompatibles con la raíz de la fe; en cualquier caso intermedio, no se recomienda a una mujer sunita que se arriesgue a casarse con él, ya que la compatibilidad de credos y la equivalencia en religión y carácter son algunos de los fundamentos más sólidos de un matrimonio válido. Registrado como respuesta de AMJA."
  fr: "Une personne a demandé si la charia interdisait à une femme musulmane sunnite d'épouser un homme musulman chiite, et inversement. Le Dr Salah al-Sawi (fatwa n° 79514, 26 juillet 2009) a répondu que quiconque appartient à la communauté de la qibla peut contracter un mariage valide. Les chiites ne forment pas un groupe homogène: les gens ordinaires et ceux qui se situent dans la qibla et qui n'ont qu'une affiliation historique au chiisme suivent la même règle que leurs semblables parmi la population sunnite; mais celui qui professe une religion maudit les deux cheikhs, ou maudit la Mère des Croyants pour des propos dont Dieu l'a innocentée, ou encore une interprétation erronée du Coran, son mariage est invalide, de telles croyances étant incompatibles avec le fondement de la foi. Une femme sunnite n'est pas encouragée à prendre le risque d'épouser un tel homme, car la compatibilité des croyances et l'équivalence en matière de religion et de caractère sont parmi les fondements les plus solides d'un mariage sain. Cette réponse a été consignée dans l'AMJA."
  tr: "Bir soru soran, Sünni Müslüman bir kızın genç bir Şii Müslümanla evlenmesinin dini olarak yasak olup olmadığı ya da tam tersi olup olmadığı soruldu. Dr. Salah Al-Sawy (26 Temmuz 2009 tarihli 79514 sayılı fetva) ki, kim Kıble'den olursa olsun geçerli, evlilik sözleşmesi onun için geçerli ve Şiiler eşit değildir: bunlar arasında sadece Şii kökenli tarihsel bağlılığı bilen sıradan ve yarı laik insanlar vardır ve bu kişiler de aynı ortak Sünni takipçileri olarak hükmetmek. İki şeyhi aşağılayarak, İnananlar Annesi'ni Allah'ın onu temizlediği şeyden hakaret ederek ya da Kur'an'ın çarpıtılmış olduğunu söyleyerek dindar olanlar için sözleşmeleri geçersizdir çünkü bu inançlar inancın özüne uymaz. Bunlar ile bu insanlar arasında kim olursa olsun, Sünni Müslüman kadın onunla evlenme riskini almamalıdır, çünkü doktrinsel uyum ve din ile karakter yetkinliği başarılı bir evliliğin en temel nedenlerindendir."
  id: "Seorang penanya ditanya apakah secara agama dilarang bagi gadis Muslim Sunni untuk menikah dengan Muslim Syiah muda, atau sebaliknya. Dr. Salah Al-Sawy menjawab (Fatwa No. 79514 tanggal 26 Juli 2009) bahwa siapa pun yang berasal dari Qibla adalah sah, kontrak pernikahan berlaku untuknya, dan Syiah tidak setara: di antara mereka ada orang biasa dan semi-awam yang hanya mengetahui afiliasi sejarah dari warisan Syiah, dan orang-orang ini memiliki aturan yang sama dengan pengikut Sunni mereka yang sama. Adapun mereka yang beragama dengan menghina kedua sheikh, atau dengan menghina Ibu Orang Beriman dari apa yang telah dibersihkan Tuhan, atau dengan mengatakan Al-Qur'an telah didistorsi, kontrak mereka tidak berlaku karena kepercayaan tersebut tidak sesuai dengan inti iman. Siapapun yang berada di antara mereka dan orang-orang ini, seorang wanita Muslim Sunni tidak boleh mengambil risiko menikahinya, karena harmoni doktrinal dan kompetensi dalam agama serta karakter adalah alasan paling mendasar untuk pernikahan yang sukses."
