id: work/fatwa-dar-alifta-eg-perfume-on-ihram-garments
class: work
kind: fatwa
label: { ar: "حكم وضع الطيب على ملابس الإحرام قبل لبسها", en: "Putting perfume on the ihram garments before wearing them", ur: "احرام کے کپڑوں پر پہننے سے پہلے خوشبو لگانا", es: "Aplicar perfume a las prendas de ihram antes de usarlas.", fr: "Appliquer du parfum sur les vêtements d'ihram avant de les porter" }
summary:
  ar: "سائل سأل عن وضع الطيب على ملابس الإحرام قبل لبسها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21903)⁩ أنه يجوز لمريد النسك أن يطيب ملابسه التي يحرم فيها قبل إحرامه وله استدامة لبسها مدة الإحرام فإن نزعها لسبب فلا يطيبها من جديد على ما فصّل الجواب."
  en: "A questioner asked about putting perfume on the ihram garments before wearing them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21903) answered that the intending pilgrim may perfume the garments he will assume ihram in, before ihram, and may keep wearing them through the ihram; if he takes them off for a reason he does not perfume them anew — as the answer details."
  ur: "ایک سائل نے احرام کے کپڑے پہننے سے پہلے انہیں خوشبو دار کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21903)⁩ نے جواب دیا کہ حج یا عمرہ کا ارادہ کرنے والا احرام سے پہلے اپنے کپڑے خوشبو دار کر سکتا ہے اور احرام کے دوران پہنے رہ سکتا ہے؛ کسی وجہ سے اتارے تو دوبارہ خوشبو نہیں لگائے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó sobre la conveniencia de perfumar las prendas del ihram antes de usarlas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21903) respondió que el peregrino puede perfumar las prendas con las que se pondrá el ihram antes de entrar en él y puede seguir usándolas durante el ihram; si se las quita por algún motivo, no debe perfumarlas de nuevo, como se detalla en la respuesta."
  fr: "Un pèlerin a demandé s'il était permis de parfumer les vêtements d'ihram avant de les revêtir. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21903) a répondu que le pèlerin peut parfumer les vêtements qu'il portera pour l'ihram avant de s'y soumettre, et peut les garder pendant toute la durée de l'ihram; s'il les retire pour une raison quelconque, il n'est pas nécessaire de les parfumer à nouveau, comme le précise la réponse."
