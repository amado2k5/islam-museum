label: { ar: "قرار مجمع الفقه الإسلامي الدولي 180 (19/6) بشأن العنف في نطاق الأسرة", en: "IIFA resolution 180 (19/6) on violence within the family", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 180 (19/6): خاندان کے دائرے میں تشدد" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. عرّف العنف الأسري بأفعال أو أقوال شديدة قاسية من فرد على فرد من الأسرة تلحق أذى ماديًا أو معنويًا، ووصفه بأنه سلوك محرم لمجافاته مقاصد الشريعة في حفظ النفس والعقل. وعدّد في نصه ما لا يعده عنفًا ولا تمييزًا «في المنظور الإسلامي» — منها الأحكام المنظمة للمعاشرة الزوجية، وقيود منع الحمل والإجهاض، واشتراط إذن الزوج لسفر الزوجة وحدها، وولاية الولي على البكر، وقسمة الميراث الشرعية، والطلاق ضمن ضوابطه، وتعدد الزوجات المبني على العدل. وفي معالجة الخلافات الزوجية سرد المنهج الذي تبناه: تجنب الشتم والسب والتحقير، ثم التدرج بالوعظ فالهجر فما سماه «الضرب غير المبرح» مقيدًا بأنه يكاد يكون تلويحًا لا فعلًا وأن اللجوء إليه خلاف الأولى مستشهدًا بعدم ضربه لامرأة قط، ثم الحَكَمين عند استفحال الخلاف فنظام الطلاق بدرجاته. وأكد توصيات على ثلاثة أصعدة: الأسري ⁦(التربية الإيمانية والحوار)⁩، والمؤسسي ⁦(توعية وتدريس معالجة العنف وتنسيق حكومي)⁩، والدولي ⁦(عرض الاتفاقيات الدولية الخاصة بالمرأة والطفل على علماء الشريعة والقانون قبل التوقيع، ورفض ما يراه متعارضًا مع الأحكام الشرعية من بنودها)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It defined family violence as harsh acts or words by one member against another causing physical or moral harm — prohibited conduct at odds, it said, with the law's purposes of protecting life and reason. Its text then listed what it does not count as violence or discrimination 'from the Islamic perspective' — including the rules governing marital relations, restrictions on contraception for the unmarried and on abortion, the husband's-permission condition for a wife's unaccompanied travel, the guardian's authority over a virgin's marriage, the fixed inheritance shares, divorce within its rules, and polygamy conditioned on justice. For marital conflict it set out its chosen sequence: avoid insults and humiliation; then the graded response of admonition, then separation in bed, then what it called 'non-severe beating' — qualified as nearly a gesture rather than a blow, resort to which is 'contrary to what is preferable', citing that the Prophet never struck a woman; then the two arbiters when conflict deepens; then divorce in its degrees. It closed with recommendations at three levels: family (faith-based upbringing and dialogue), institutional (awareness programmes, school curricula, ministerial coordination) and international (referring international conventions on women and children to scholars of law and religion before signature, and rejecting clauses it holds contrary to the sharia)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے خاندانی تشدد کی تعریف کی: کسی فرد کا خاندان کے دوسرے فرد پر سخت فعل یا قول جو مادی یا معنوی نقصان پہنچائے — اور اسے حرام سلوک قرار دیا جو نفس و عقل کی حفاظت کے شرعی مقاصد سے ٹکراتا ہے۔ متن نے پھر وہ امور گنوائے جنہیں وہ 'اسلامی نظریے' سے تشدد یا امتیاز نہیں مانتا — جن میں ازدواجی معاشرت کے احکام، غیر شادی شدہ کے لیے مانعِ حمل اور اسقاط پر پابندیاں، بیوی کے اکیلے سفر کے لیے شوہر کی اجازت کی شرط، کنواری کی شادی پر ولی کا اختیار، میراث کے مقررہ حصے، ضوابط کے اندر طلاق اور عدل کی شرط پر تعددِ ازواج شامل ہیں۔ ازدواجی اختلاف کے ازالے میں اس نے اپنا منتخب تدریجی منہج بیان کیا: گالی، تحقیر سے اجتناب؛ پھر نصیحت، پھر بستر میں ہجرت، پھر وہ جسے اس نے 'غیر شدید مار' کہا — جسے تقریباً صرف اشارے کے قریب اور 'خلافِ اولیٰ' قرار دیا، اس بات کی شہادت کے ساتھ کہ نبی نے کبھی کسی عورت کو نہیں مارا؛ پھر اختلاف بڑھنے پر دو حکم؛ پھر اپنی درجات کے ساتھ طلاق۔ آخر میں تین سطحوں پر سفارشات: خاندانی ⁦(ایمانی تربیت اور مکالمہ)⁩، ادارہ جاتی ⁦(شعوری پروگرام، نصاب، وزارتی ربط)⁩ اور بین الاقوامی ⁦(خواتین و اطفال سے متعلق معاہدوں پر دستخط سے پہلے شرع و قانون کے علماء کی رائے، اور وہ شقیں رد کرنا جو اس کے نزدیک شریعت سے متصادم ہیں)⁩۔"
