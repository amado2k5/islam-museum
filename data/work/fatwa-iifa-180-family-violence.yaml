label: { ar: "قرار مجمع الفقه الإسلامي الدولي 180 (19/6) بشأن العنف في نطاق الأسرة", en: "IIFA resolution 180 (19/6) on violence within the family", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 180 (19/6): خاندان کے دائرے میں تشدد", es: "Resolución 180 (19/6) de la IIFA sobre la violencia en el seno de la familia.", fr: "Résolution 180 (19/6) de l'IIFA sur la violence familiale", tr: "Uluslararası İslami Fiqh Akademisi Aile İçindeki Şiddet Konulu 180 (19/6) sayılı Kararı", id: "Resolusi Akademi Fiqh Islam Internasional 180 (19/6) tentang Kekerasan dalam Keluarga" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. عرّف العنف الأسري بأفعال أو أقوال شديدة قاسية من فرد على فرد من الأسرة تلحق أذى ماديًا أو معنويًا، ووصفه بأنه سلوك محرم لمجافاته مقاصد الشريعة في حفظ النفس والعقل. وعدّد في نصه ما لا يعده عنفًا ولا تمييزًا «في المنظور الإسلامي» — منها الأحكام المنظمة للمعاشرة الزوجية، وقيود منع الحمل والإجهاض، واشتراط إذن الزوج لسفر الزوجة وحدها، وولاية الولي على البكر، وقسمة الميراث الشرعية، والطلاق ضمن ضوابطه، وتعدد الزوجات المبني على العدل. وفي معالجة الخلافات الزوجية سرد المنهج الذي تبناه: تجنب الشتم والسب والتحقير، ثم التدرج بالوعظ فالهجر فما سماه «الضرب غير المبرح» مقيدًا بأنه يكاد يكون تلويحًا لا فعلًا وأن اللجوء إليه خلاف الأولى مستشهدًا بعدم ضربه لامرأة قط، ثم الحَكَمين عند استفحال الخلاف فنظام الطلاق بدرجاته. وأكد توصيات على ثلاثة أصعدة: الأسري ⁦(التربية الإيمانية والحوار)⁩، والمؤسسي ⁦(توعية وتدريس معالجة العنف وتنسيق حكومي)⁩، والدولي ⁦(عرض الاتفاقيات الدولية الخاصة بالمرأة والطفل على علماء الشريعة والقانون قبل التوقيع، ورفض ما يراه متعارضًا مع الأحكام الشرعية من بنودها)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It defined family violence as harsh acts or words by one member against another causing physical or moral harm — prohibited conduct at odds, it said, with the law's purposes of protecting life and reason. Its text then listed what it does not count as violence or discrimination 'from the Islamic perspective' — including the rules governing marital relations, restrictions on contraception for the unmarried and on abortion, the husband's-permission condition for a wife's unaccompanied travel, the guardian's authority over a virgin's marriage, the fixed inheritance shares, divorce within its rules, and polygamy conditioned on justice. For marital conflict it set out its chosen sequence: avoid insults and humiliation; then the graded response of admonition, then separation in bed, then what it called 'non-severe beating' — qualified as nearly a gesture rather than a blow, resort to which is 'contrary to what is preferable', citing that the Prophet never struck a woman; then the two arbiters when conflict deepens; then divorce in its degrees. It closed with recommendations at three levels: family (faith-based upbringing and dialogue), institutional (awareness programmes, school curricula, ministerial coordination) and international (referring international conventions on women and children to scholars of law and religion before signature, and rejecting clauses it holds contrary to the sharia)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے خاندانی تشدد کی تعریف کی: کسی فرد کا خاندان کے دوسرے فرد پر سخت فعل یا قول جو مادی یا معنوی نقصان پہنچائے — اور اسے حرام سلوک قرار دیا جو نفس و عقل کی حفاظت کے شرعی مقاصد سے ٹکراتا ہے۔ متن نے پھر وہ امور گنوائے جنہیں وہ 'اسلامی نظریے' سے تشدد یا امتیاز نہیں مانتا — جن میں ازدواجی معاشرت کے احکام، غیر شادی شدہ کے لیے مانعِ حمل اور اسقاط پر پابندیاں، بیوی کے اکیلے سفر کے لیے شوہر کی اجازت کی شرط، کنواری کی شادی پر ولی کا اختیار، میراث کے مقررہ حصے، ضوابط کے اندر طلاق اور عدل کی شرط پر تعددِ ازواج شامل ہیں۔ ازدواجی اختلاف کے ازالے میں اس نے اپنا منتخب تدریجی منہج بیان کیا: گالی، تحقیر سے اجتناب؛ پھر نصیحت، پھر بستر میں ہجرت، پھر وہ جسے اس نے 'غیر شدید مار' کہا — جسے تقریباً صرف اشارے کے قریب اور 'خلافِ اولیٰ' قرار دیا، اس بات کی شہادت کے ساتھ کہ نبی نے کبھی کسی عورت کو نہیں مارا؛ پھر اختلاف بڑھنے پر دو حکم؛ پھر اپنی درجات کے ساتھ طلاق۔ آخر میں تین سطحوں پر سفارشات: خاندانی ⁦(ایمانی تربیت اور مکالمہ)⁩، ادارہ جاتی ⁦(شعوری پروگرام، نصاب، وزارتی ربط)⁩ اور بین الاقوامی ⁦(خواتین و اطفال سے متعلق معاہدوں پر دستخط سے پہلے شرع و قانون کے علماء کی رائے، اور وہ شقیں رد کرنا جو اس کے نزدیک شریعت سے متصادم ہیں)⁩۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 19.ª sesión en Sharjah (1–5 Jumada al-Ula 1430, 26–30 de abril de 2009). Definió la violencia familiar como actos o palabras duras de un miembro contra otro que causan daño físico o moral, conducta prohibida que contradice, dijo, los propósitos de la ley de proteger la vida y la razón. Su texto luego enumeró lo que no considera violencia o discriminación \"desde la perspectiva islámica\", incluyendo las reglas que rigen las relaciones matrimoniales, las restricciones a la anticoncepción para las solteras y al aborto, la condición del permiso del esposo para el viaje no acompañado de una esposa, la autoridad del tutor sobre el matrimonio de una virgen, las partes fijas de la herencia, el divorcio dentro de sus reglas y la poligamia condicionada a la justicia. Para el conflicto matrimonial estableció su secuencia elegida: evitar insultos y humillaciones; Luego, la respuesta gradual de amonestación, luego la separación en la cama, luego lo que denominó \"golpes no severos\" —calificados como casi un gesto más que un golpe, cuyo recurso es \"contrario a lo preferible\", citando que el Profeta nunca golpeó a una mujer—; luego los dos árbitros cuando el conflicto se profundiza; luego el divorcio en sus diferentes grados. Concluyó con recomendaciones en tres niveles: familiar (educación basada en la fe y diálogo), institucional (programas de sensibilización, planes de estudio escolares, coordinación ministerial) e internacional (remitir los convenios internacionales sobre mujeres y niños a eruditos del derecho y la religión antes de su firma, y rechazar las cláusulas que considera contrarias a la sharia)."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009) définit la violence familiale comme des actes ou des paroles blessantes d'un membre envers un autre, causant un préjudice physique ou moral – une conduite prohibée, contraire, selon elle, aux objectifs de la loi qui sont la protection de la vie et de la raison. Le texte énumère ensuite ce qui n'est pas considéré comme de la violence ou de la discrimination « du point de vue islamique » – notamment les règles régissant les relations conjugales, les restrictions relatives à la contraception pour les femmes non mariées et à l'avortement, l'obligation pour le mari de permettre à sa femme de voyager seule, l'autorité du tuteur sur le mariage d'une vierge, le partage fixe de l'héritage, le divorce dans le respect de ses règles et la polygamie sous réserve de justice. Concernant les conflits conjugaux, la résolution préconise d'éviter les insultes et les humiliations. Puis, la réponse progressive de l'avertissement, puis la séparation au lit, puis ce qu'elle qualifiait de « châtiment corporel non violent » — décrit comme un simple geste plutôt qu'un coup, dont le recours est « contraire à ce qui est préférable », citant le fait que le Prophète n'a jamais frappé une femme; puis, l'intervention de deux médiateurs lorsque le conflit s'envenime; puis, le divorce sous ses différentes formes. Elle se concluait par des recommandations à trois niveaux: familial (éducation religieuse et dialogue), institutionnel (programmes de sensibilisation, programmes scolaires, coordination ministérielle) et international (soumission des conventions internationales relatives aux femmes et aux enfants à des spécialistes du droit et des religions avant signature, et rejet des clauses qu'elle juge contraires à la charia)."
  tr: "Uluslararası İslami Fikh Akademisi'nin on dokuzuncu oturumunda Şariah'ta toplu kararı (1–5 Cümde el-Avval 1430 Hayır, 26–30 Nisan 2009). Aile içi şiddet, bir bireyin başka bir aile üyesine karşı ağır ve sert eylem veya sözleri olarak tanımlanır ve Şeriat'ın yaşam ve zihni koruma amaçlarına aykırı olarak yasaklanmış davranış olarak tanımlanır. Metninde, İslami bakış açısından şiddet veya ayrımcılık olarak kabul edilmeyenleri sıralar—evlilik içinde birlikte yaşamı düzenleyen hükümler, gebelik ve kürtajın önlenmesine ilişkin kısıtlamalar, eşin yalnız seyahat etmesine izin verilmesi, bakire üzerinde vasilik, mirasın şeriata göre bölünmesi, kurallar dahilinde boşanma ve adalete dayalı çok eşlilik gibi hükümler yer alır. Evlilik anlaşmazlıklarını ele alırken, benimsediği yaklaşımı sıraladı: hakaret, küfür ve aşağılamadan kaçınmak, ardından \"şiddetsiz dövme\" dediği şeyi yavaş yavaş azarlayıp bırakmak, bunun neredeyse bir ima olduğunu belirtmek ve bunu bir eylemden ziyade bir ima olarak tanımlamak, ve buna başvurmak, kadına asla vurulmamak, ardından anlaşmazlık büyürken iki karar ve boşanma sisteminin derecelerini göstermek. Üç düzeyde öneriler vurguladı: aile (inanç temelli eğitim ve diyalog), kurumsal (şiddet tedavisi ve hükümet koordinasyonu farkındalık yaratma ve öğretme) ve uluslararası (kadınlar ve çocuklarla ilgili uluslararası anlaşmaları şeriat ve hukukçulara imzalamadan önce sunmak ve Şeriat kararlarına aykırı gördüğü şeyleri reddetmek)."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430 H, 26–30 April 2009). Kekerasan dalam rumah tangga didefinisikan sebagai tindakan atau kata-kata yang berat dan keras oleh satu individu terhadap anggota keluarga lain yang menyebabkan kerugian materi atau moral, dan digambarkan sebagai perilaku terlarang karena melanggar tujuan Syariah dalam menjaga kehidupan dan pikiran. Kekerasan ini menyebutkan dalam teksnya apa yang tidak dianggap sebagai kekerasan atau diskriminasi 'dari perspektif Islam'—termasuk ketentuan yang mengatur hidup bersama dalam pernikahan, pembatasan pencegahan kehamilan dan aborsi, persyaratan izin suami agar istri bepergian sendiri, perwalian atas perawan, pembagian warisan menurut Syariah, perceraian sesuai peraturannya, dan poligami berdasarkan keadilan. Dalam menangani perselisihan pernikahan, ia mencantumkan pendekatan yang diambilnya: menghindari hinaan, makian, dan penghinaan, lalu secara bertahap menegur dan kemudian meninggalkan apa yang ia sebut \"pemukulan tidak berat,\" membatasi bahwa itu hampir sekadar petunjuk daripada tindakan, dan menggunakannya bertentangan dengan yang pertama, dengan alasan tidak pernah memukul perempuan, lalu dua putusan saat perselisihan meningkat, dan sistem perceraian dalam tingkatnya. Ia menekankan rekomendasi di tiga tingkat: keluarga (pendidikan dan dialog berbasis iman), institusional (meningkatkan kesadaran dan mengajarkan pengobatan kekerasan serta koordinasi pemerintah), dan internasional (menyampaikan perjanjian internasional terkait perempuan dan anak-anak kepada para ahli Syariah dan hukum sebelum menandatangani, serta menolak apa yang dianggapnya bertentangan dengan putusan Syariah)."
