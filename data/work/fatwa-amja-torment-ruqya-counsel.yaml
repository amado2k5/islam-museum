id: work/fatwa-amja-torment-ruqya-counsel
class: work
kind: fatwa
label: { ar: "معذب يُنصح بالرقية", en: "A tormented questioner advised to seek trusted Qur'an healers", ur: "اذیت میں مبتلا — رقیہ کا مشورہ", es: "A un hombre atormentado se le aconsejó que buscara sanadores coránicos de confianza.", fr: "Un questionneur tourmenté a été conseillé de consulter des guérisseurs coraniques de confiance." }
summary:
  ar: "شكا سائل أنه يتعذب عذابًا شديدًا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87415 بتاريخ 7 سبتمبر 2012)⁩ أن لعله يعرض نفسه على بعض الثقات من المعالجين بالقرآن فربما أصابته عين أو مس ونحوه وعليه بالإكثار من ذكر الله وقراءة المعوذتين وسورة البقرة والدعاء على ما فصّل الجواب."
  en: "A questioner complained of severe torment. AMJA's fatwa committee (fatwa no. 87415, 7 September 2012) answered that he should perhaps present himself to trusted Qur'an healers — an evil eye or touch may have struck him — with much remembrance of God, reading the two refuge-surahs and al-Baqara, and supplication — as the answer details."
  ur: "شدید اذیت؟ لجنة الفتوى ⁦(فتویٰ 87415، 7 ستمبر 2012)⁩ کا مشورہ: مہتم بالشأن راقی، ذکر، معوذتین، البقرہ، دعا۔"
  es: "Un consultante se quejó de un tormento severo. El comité de fatuas de AMJA (fatua n.° 87415, 7 de septiembre de 2012) respondió que tal vez debería acudir a sanadores coránicos de confianza —pudo haber sido afectado por el mal de ojo o el mal de ojo— con mucho recuerdo de Dios, recitando las dos suras de refugio y al-Baqara, y haciendo súplicas, como se detalla en la respuesta."
  fr: "Un homme se plaignait de terribles tourments. Le comité des fatwas de l'AMJA (fatwa n° 87415, 7 septembre 2012) a répondu qu'il devrait peut-être se présenter à des guérisseurs coraniques de confiance — il aurait pu être victime d'un mauvais œil ou d'un mauvais contact — en invoquant abondamment Dieu, en récitant les deux sourates de refuge et la sourate Al-Baqara, et en faisant des supplications — comme le détaille la réponse."
