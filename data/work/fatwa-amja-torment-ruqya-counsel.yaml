label: { ar: "معذب يُنصح بالرقية", en: "A tormented questioner advised to seek trusted Qur'an healers", ur: "اذیت میں مبتلا — رقیہ کا مشورہ" }
summary:
  ar: "شكا سائل أنه يتعذب عذابًا شديدًا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87415 بتاريخ 7 سبتمبر 2012)⁩ أن لعله يعرض نفسه على بعض الثقات من المعالجين بالقرآن فربما أصابته عين أو مس ونحوه وعليه بالإكثار من ذكر الله وقراءة المعوذتين وسورة البقرة والدعاء على ما فصّل الجواب."
  en: "A questioner complained of severe torment. AMJA's fatwa committee (fatwa no. 87415, 7 September 2012) answered that he should perhaps present himself to trusted Qur'an healers — an evil eye or touch may have struck him — with much remembrance of God, reading the two refuge-surahs and al-Baqara, and supplication — as the answer details."
  ur: "شدید اذیت؟ لجنة الفتوى ⁦(فتویٰ 87415، 7 ستمبر 2012)⁩ کا مشورہ: مہتم بالشأن راقی، ذکر، معوذتین، البقرہ، دعا۔"
