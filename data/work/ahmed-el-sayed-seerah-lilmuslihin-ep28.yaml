class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 28: غزوة خيبر"
  en: "The Prophetic Biography for Reformers, episode 28: The Expedition of Khaybar"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 28: غزوۂ خیبر"
  fr: "La biographie prophétique pour les réformateurs, épisode 28 : L'expédition de Khaybar"
  es: "La biografía profética para los reformadores, episodio 28: La expedición de Jaybar"
summary:
  ar: "يستعيد قصة سلمة بن الأكوع في غزوة ذي قرد، ثم يتتبع روايته التي تجمع الحديبية وذا قرد وخيبر. ثم يعالج حملة خيبر: أسبابها وحصار الحصون ومقتل مرحب على يد علي والشاة المسمومة، والأحكام الفقهية التي يقول إنها ترتبط بهذه الغزوة."
  en: "He recalls the Dhu Qarad story of Salama ibn al-Akwa and follows Salama's report linking Hudaybiyya, Dhu Qarad and Khaybar. He then treats the Khaybar campaign: its causes, the siege of the forts, the killing of Marhab by Ali, the poisoned sheep, and the fiqh rulings he says belong to this expedition."
  ur: "وہ غزوۂ ذی قرد میں سلمہ بن الاکوع کا قصہ یاد کرتے ہیں اور پھر سلمہ کی اس روایت کو آگے بڑھاتے ہیں جو حدیبیہ، ذی قرد اور خیبر کو جوڑتی ہے۔ پھر وہ خیبر کی مہم کو دیکھتے ہیں: اس کے اسباب، قلعوں کا محاصرہ، علی کے ہاتھوں مرحب کا قتل، زہر آلود بکری، اور وہ فقہی احکام جو ان کے بقول اس غزوے سے وابستہ ہیں۔"
  fr: "Il rappelle l'histoire de Salama ibn al-Akwa à Dhu Qarad et suit le récit de Salama qui relie Hudaybiyya, Dhu Qarad et Khaybar. Il traite ensuite la campagne de Khaybar : ses causes, le siège des forts, la mort de Marhab de la main d'Ali, le mouton empoisonné et les règles de jurisprudence qui, selon lui, se rattachent à cette expédition."
  es: "Recuerda la historia de Salama ibn al-Akwa en Dhu Qarad y sigue el relato de Salama que une Hudaybiyya, Dhu Qarad y Jaybar. Después trata la campaña de Jaybar: sus causas, el asedio de las fortalezas, la muerte de Marhab a manos de Ali, la oveja envenenada y las normas de jurisprudencia que, según él, pertenecen a esta expedición."
