id: work/fatwa-dar-alifta-eg-died-before-slaughtering-udhiyya
class: work
kind: fatwa
label: { ar: "الحكم المترتب على من أراد الأضحية وفاته وقتها ولم يضحّ", en: "One who intended the udhiyya but died in its time without sacrificing", ur: "قربانی کا ارادہ مگر وقت میں وفات ہو گئی", es: "Aquel que pretendía realizar el udhiyya pero murió en su tiempo sin haber realizado el sacrificio.", fr: "Celui qui avait l'intention de faire l'udhiyya mais qui mourut à temps sans avoir pu se sacrifier" }
summary:
  ar: "سائل سأل عن من أراد الأضحية وفاته وقتها ولم يضحّ. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21935)⁩ أن للأضحية وقتًا معلومًا لا يجزئ ذبحها قبله ولا بعده وغروب شمس ثالث أيام التشريق آخره، وبيّن الجواب ما يترتب على من مات قبل الذبح على وجهه."
  en: "A questioner asked about one who intended the udhiyya sacrifice and whose death came in its time before he sacrificed. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21935) answered that the sacrifice has a set time — slaughter before or after does not count — ending at sunset of the third tashriq day; the answer sets out what follows for one who died before slaughtering."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جس نے قربانی کا ارادہ کیا مگر ذبح کرنے سے پہلے اس کے وقت میں وفات ہو گئی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21935)⁩ نے جواب دیا کہ قربانی کا وقت مقرر ہے — اس سے پہلے یا بعد کا ذبح کافی نہیں — اور اس کا ختم تشریک کے تیسرے دن غروبِ آفتاب ہے؛ ذبح سے پہلے مرنے والے کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre alguien que tenía la intención de realizar el sacrificio udhiyya y cuya muerte ocurrió antes de que se realizara. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21935) respondió que el sacrificio tiene un tiempo establecido —no importa si se realiza antes o después— y termina al atardecer del tercer día de tashriq; la respuesta detalla lo que sucede con quien muere antes del sacrificio."
  fr: "Un internaute a posé une question concernant une personne ayant l'intention d'accomplir le sacrifice d'Udhiyya et décédée avant son terme. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21935) a répondu que le sacrifice a un délai précis – un abattage avant ou après n'est pas pris en compte – se terminant au coucher du soleil du troisième jour de Tashriq; la réponse expose ensuite la procédure applicable à celui qui est décédé avant l'abattage."
