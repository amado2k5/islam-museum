summary:
  ar: "«شرح مشكل الآثار» لأبي جعفر أحمد بن محمد بن سلامة الطحاوي ⁦(ت 321هـ)⁩: يعرض الأحاديث والآثار التي يبدو ظاهرها متعارضاً، ويجمع بينها أو يبيّن ناسخها أو يرجّح بينها، دون أن يلتزم مذهباً بعينه. {cite:sharh-mushkil-al-athar-arnaout p. 8}"
  en: "Abu Ja'far al-Tahawi's (d. 321 AH) book on reports whose wording seems to conflict. He reconciles them, identifies abrogation, or weighs one against another, without binding himself to a single school. {cite:sharh-mushkil-al-athar-arnaout p. 8}"
  es: "El libro de Abu Ja'far al-Tahawi (m. 321 AH) trata sobre relatos cuya redacción parece contradictoria. Los concilia, identifica las abrogaciones o los compara, sin adherirse a ninguna escuela en particular. {cite:sharh-mushkil-al-athar-arnaout p. 8}"
  fr: "L'ouvrage d'Abu Ja'far al-Tahawi (mort en 321 AH) traite des hadiths dont la formulation semble contradictoire. Il les concilie, identifie les abrogations et les compare, sans se rallier à une seule école de pensée. {cite:sharh-mushkil-al-athar-arnaout p. 8}"
