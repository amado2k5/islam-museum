id: work/fatwa-dar-alifta-eg-changing-nusuk-when-umrah-impossible
class: work
kind: fatwa
label: { ar: "حكم تغيير النسك لمن نوى التمتع ثم تعذر عليه أداء العمرة قبل الحج", en: "Changing the rite for one who intended tamattu' then could not perform umrah before Hajj", ur: "تمتع کا ارادہ کرنے والے کا نسک بدلنا جب عمرہ ممکن نہ ہو" }
summary:
  ar: "سائل سأل عمن أحرم بالعمرة متمتعًا بها إلى الحج ثم تغير برنامج الرحلة بالذهاب إلى زيارة المدينة فتعذر عليه أداء العمرة قبل الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20822)⁩ ببيان حكم تغيير النسك في هذه الصورة على وجهه."
  en: "A questioner asked about one who entered ihram for umrah as mutamatti', then the trip's plan changed with a visit to Medina and umrah before Hajj became impossible. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20822) answered by setting out the ruling on changing the rite in this case."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس نے تمتع کے طور پر عمرے کا احرام باندھا پھر مدینہ جانے کے سبب سفر کا پروگرام بدل گیا اور حج سے پہلے عمرہ ممکن نہ رہا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20822)⁩ نے جواب میں نسک بدلنے کا حکم بیان کیا۔"
