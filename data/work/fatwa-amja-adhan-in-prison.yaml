id: work/fatwa-amja-adhan-in-prison
class: work
kind: fatwa
label: { ar: "الأذان في السجون", en: "Must Muslim prisoners appoint one to raise the adhan", ur: "قیدیوں میں اذان — فرض کفایہ", es: "¿Deben los presos musulmanes designar a alguien para que eleve el adhan?", fr: "Les prisonniers musulmans doivent-ils désigner une personne pour lancer l'adhan ?", tr: "Hapishanelerde ezan", id: "Seruan untuk berdoa di penjara" }
summary:
  ar: "سأل سائل هل يجب شرعًا على المساجين المسلمين أن يحددوا من بينهم فردًا ليرفع الأذان. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21991 بتاريخ 14 أكتوبر 2012)⁩ أن الأذان شعار الإسلام وإعلام بدخول وقت الصلاة ودعوة إليها وهو فرض كفاية على المسلمين في كل بلد فإذا قام به بعض الناس في البلدة سقط وجوبه عن الباقين على ما فصّل الجواب من حال المساجين."
  en: "A questioner asked whether Muslim prisoners must appoint one among them to raise the adhan. AMJA's fatwa committee (fatwa no. 21991, 14 October 2012) answered that the adhan is Islam's emblem, announcing the prayer time's entry and calling to it — a collective duty on Muslims in every land; when some in a town perform it, its obligation falls from the rest — as the answer details for prisoners."
  ur: "قیدیوں کی اذان؟ لجنة الفتوى ⁦(فتویٰ 21991، 14 اکتوبر 2012)⁩ کے مطابق اذان ہر بستی پر فرض کفایہ — بعض کے کرنے سے باقی سے ساقط۔"
  es: "Un interlocutor preguntó si los presos musulmanes deben designar a uno de ellos para que eleve el adhan. El comité de fatwas de AMJA (fatwa n.º 21991, 14 de octubre de 2012) respondió que el adhan es el emblema del Islam, que anuncia la llegada de la hora de la oración y la convoca a ella; es un deber colectivo para los musulmanes de todo el mundo; cuando algunos en una ciudad lo realizan, la obligación recae sobre el resto, como se detalla en la respuesta para los presos."
  fr: "Un internaute a demandé si les prisonniers musulmans devaient désigner l'un d'entre eux pour lancer l'adhan. Le comité des fatwas de l'AMJA (fatwa n° 21991, 14 octobre 2012) a répondu que l'adhan est l'emblème de l'islam, annonçant le début de l'heure de la prière et invitant à la prière – un devoir collectif pour les musulmans du monde entier; lorsque certains, dans une ville, l'obligation s'en acquitte incombe à tous – comme le précise la réponse concernant les prisonniers."
  tr: "Bir soru soran kişi, Müslüman mahkumların azanı kılmak için aralarından tek bir kişi seçmeleri dini olarak zorunlu olup olmadığını sordu. Amerikan Şeriat Hukukçuları Konseyi Fetva Komitesi (Fetva No. 21991, 14 Ekim 2012), ezanın İslam'ın simgesi ve namaz vaktinin başladığının ve ona çağrının bir işareti olduğunu yanıtladı. Bu, her ülkedeki Müslümanlar için ortak bir yükümlülüktür. Kasabada bazı kişiler bunu yaparsa, mahkumların durumu detaylı olarak belirtildiği gibi, bu yükümlülük diğerlerinden kaldırılır."
  id: "Seorang penanya bertanya apakah tahanan Muslim secara agama diwajibkan memilih satu individu dari antara mereka untuk memanggil adhan. Komite Fatwa Dewan Hukum Syariah Amerika (Fatwa No. 21991 tanggal 14 Oktober 2012) menjawab bahwa adhan adalah lambang Islam dan sinyal dimulainya waktu salat serta seruan terhadapnya. Ini adalah kewajiban kolektif bagi Muslim di setiap negara. Jika beberapa orang di kota melakukannya, kewajiban itu dicabut dari yang lain, seperti yang dirinci mengenai kondisi tahanan."
