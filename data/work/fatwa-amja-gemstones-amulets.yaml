id: work/fatwa-amja-gemstones-amulets
class: work
kind: fatwa
label: { ar: "لبس الأحجار الكريمة والتمائم لدفع الأرواح", en: "Wearing gemstones and amulets against evil spirits", ur: "روحوں سے بچاؤ کے لیے نگینے اور تعویذ", es: "Usar piedras preciosas y amuletos contra los malos espíritus.", fr: "Porter des pierres précieuses et des amulettes contre les mauvais esprits" }
summary:
  ar: "سأل سائل عن لبس الأحجار الكريمة كالزمرد والياقوت والماس أو تعليقها لدفع الأرواح الشريرة وجلب الحظ وعن كتابة آيات لذلك الغرض. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86951 بتاريخ 9 يونيو 2012)⁩ أنه لا يحل تعليق الأحجار الكريمة ولا غيرها بقصد دفع الأرواح الخبيثة لأنه لا يسوق الخير إلا الله ولا يصرف السوء إلا الله، مستشهدًا بحديث «من علق تميمة فقد أشرك» وحديث الرقى والتمائم والتولة شرك، وختم باللجوء إلى الله وحسن الظن به والضراعة إليه."
  en: "A questioner asked about wearing gemstones — emerald, ruby, diamond — or hanging them to repel evil spirits and draw luck, and about writing verses for that purpose. Dr. Salah al-Sawi (fatwa no. 86951, 9 June 2012) answered that hanging gemstones or anything else to ward off evil spirits is unlawful, since none brings good or repels harm but God, citing the hadiths that whoever hangs an amulet has committed shirk and that ruqya-of-that-kind, amulets and love-charms are shirk, and closing with counsel to resort to God with good opinion and earnest prayer. Recorded as AMJA's answer."
  ur: "ایک سائل نے روحوں اور بدقسمتی سے بچاؤ کے لیے نگینے اور تعویذ پہننے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86951، 9 جون 2012)⁩ کے مطابق یہ جائز نہیں کیونکہ نفع نقصان صرف اللہ کے ہاتھ میں ہے؛ تعویذ والی احادیث کے حوالے سے — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un consultante preguntó sobre el uso de piedras preciosas —esmeralda, rubí, diamante— o colgarlas para repeler espíritus malignos y atraer la buena fortuna, y sobre la escritura de versos con ese propósito. El Dr. Salah al-Sawi (fatwa n.° 86951, 9 de junio de 2012) respondió que colgar piedras preciosas o cualquier otra cosa para alejar los espíritus malignos es ilícito, ya que nadie trae el bien ni repele el mal excepto Dios, citando hadices que afirman que quien cuelga un amuleto comete shirk (idolatría) y que la ruqya de ese tipo, los amuletos y los talismanes de amor son shirk, y concluyó aconsejando recurrir a Dios con buena voluntad y oración sincera. Registrada como respuesta de AMJA."
  fr: "Un internaute a posé une question concernant le port de pierres précieuses — émeraudes, rubis, diamants — ou leur suspension pour repousser les mauvais esprits et attirer la chance, ainsi que la rédaction de versets à cette fin. Le Dr Salah al-Sawi (fatwa n° 86951, 9 juin 2012) a répondu que porter des pierres précieuses ou tout autre objet pour conjurer les mauvais esprits est illicite, car nul n'apporte le bien ni ne repousse le mal si ce n'est Dieu. Il a cité les hadiths selon lesquels quiconque porte une amulette commet du shirk (associationnisme) et que les rituels de roqya de ce type, les amulettes et les charmes d'amour sont du shirk. Il a conclu en conseillant de se tourner vers Dieu avec bienveillance et ferveur dans la prière. Cette réponse est consignée dans la lettre AMJA."
