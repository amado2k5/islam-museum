label: { ar: "المفردات في غريب القرآن", en: "Mufradat fi gharib al-Qur'an", ur: "مفردات فی غریب القرآن", es: "Mufradat fi gharib al-Qur'an", fr: "Mufradat fi gharib al-Qur'an" }
summary:
  ar: "معجم الراغب الأصفهاني في ألفاظ القرآن مرتب على الحروف، يبرز فيه ذوقه في التحليل الدلالي الدقيق، وأثره بادي في التفسير وفي معاجم الألفاظ بعده؛ وهو واحد من سلسلة مصنفاته في القرآن يذكر في مقدمته رسالتين سابقتين ويعد بثالثة هي «درة التأويل» {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  en: "al-Raghib al-Isfahani's alphabetical lexicon of Qur'anic vocabulary, in which his predilection for subtle semantic analysis is most pronounced; its influence can be traced in later tafsir and lexicography. One of a series of his monographs on the Qur'an, its introduction cites two earlier, apparently lost risalas and promises the Durrat al-ta'wil {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  ur: "راغب اصفہانی کا قرآنی الفاظ کا حروف تہجی پر مرتب معجم جس میں ان کا دقیق معنوی تجزیہ نمایاں ہے؛ اس کا اثر بعد کے تفاسیر اور معجنیات میں جلوہ گر ہے۔ ان کی قرآنی تصانیف کے سلسلے کی ایک کڑی، جس کے مقدمے میں دو سابقہ گم گشتہ رسائل کا ذکر اور «درۃ التاویل» کا وعدہ ہے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}۔"
  es: "el léxico alfabético del vocabulario coránico de al-Raghib al-Isfahani, en el que su predilección por el análisis semántico sutil es más pronunciada; su influencia se puede rastrear en la exégesis y la lexicografía posteriores. Una de una serie de sus monografías sobre el Corán, su introducción cita dos risalas anteriores, aparentemente perdidas, y promete el Durrat al-ta'wil {citar:encyclopaedia-of-islam-2 vol. 8 págs. 389-390}."
  fr: "le lexique alphabétique du vocabulaire coranique d'al-Raghib al-Isfahani, dans lequel sa prédilection pour l'analyse sémantique subtile est la plus prononcée; son influence peut être retracée dans l'exégèse et la lexicographie ultérieures. Faisant partie d'une série de ses monographies sur le Coran, son introduction cite deux risalas antérieures, apparemment perdues, et promet le Durrat al-ta'wil {cite:encyclopaedia-of-islam-2 vol. 8 pages 389-390}."
