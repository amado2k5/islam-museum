summary:
  ar: "معجم الراغب الأصفهاني في ألفاظ القرآن مرتب على الحروف، يبرز فيه ذوقه في التحليل الدلالي الدقيق، وأثره بادي في التفسير وفي معاجم الألفاظ بعده؛ وهو واحد من سلسلة مصنفاته في القرآن يذكر في مقدمته رسالتين سابقتين ويعد بثالثة هي «درة التأويل» {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  en: "al-Raghib al-Isfahani's alphabetical lexicon of Qur'anic vocabulary, in which his predilection for subtle semantic analysis is most pronounced; its influence can be traced in later tafsir and lexicography. One of a series of his monographs on the Qur'an, its introduction cites two earlier, apparently lost risalas and promises the Durrat al-ta'wil {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  ur: "راغب اصفہانی کا قرآنی الفاظ کا حروف تہجی پر مرتب معجم جس میں ان کا دقیق معنوی تجزیہ نمایاں ہے؛ اس کا اثر بعد کے تفاسیر اور معجنیات میں جلوہ گر ہے۔ ان کی قرآنی تصانیف کے سلسلے کی ایک کڑی، جس کے مقدمے میں دو سابقہ گم گشتہ رسائل کا ذکر اور «درۃ التاویل» کا وعدہ ہے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}۔"
