label: { ar: "معالم القربة في أحكام الحسبة", en: "Maʿalim al-Qurba fi Ahkam al-Hisba (Duties of the Market Inspector)", es: "Maʿalim al-Qurba y Ahkam al-Hisba (Deberes del inspector del mercado)", fr: "Maʿalim al-Qurba et Ahkam al-Hisba (fonctions de l'inspecteur du marché)", ur: "معلم القربا فی احکم الحسبہ ⁦(مارکیٹ انسپکٹر کے فرائض)⁩", tr: "Hisbah Kurallarında Tanrı'ya Bağlılığın Özellikleri", id: "Ciri-ciri Pengabdian kepada Tuhan dalam Aturan Hisbah" }
summary:
  ar: "كتاب في الحسبة ألفه [[person/ibn-al-ukhuwwa|ابن الأخوة]] ليعين المحتسب في عمله: الإشراف على الأسواق والموازين والمكاييل، وصيانة الآداب العامة، ومحاربة الغش والعقود المحرمة. ويصف محققا الكتاب مكانة علم الحسبة في الصدر الأول وشروط من يتولاها {cite:maalim-qurba-edition-1976 p.6} {cite:maalim-qurba-edition-1976 p.9}."
  en: "A treatise on hisba by Ibn al-Ukhuwwa, written to help the market inspector in his duties: supervising markets, weights and measures, protecting public morals, and fighting fraud and forbidden contracts. The editors describe the standing of the science of hisba in early Islam and the qualities required of its holder {cite:maalim-qurba-edition-1976 p.6} {cite:maalim-qurba-edition-1976 p.9}."
  es: "Un tratado sobre hisba de Ibn al-Ukhuwwa, escrito para ayudar al inspector de mercado en sus funciones: supervisar los mercados, las pesas y medidas, proteger la moral pública y combatir el fraude y los contratos prohibidos. Los editores describen la importancia de la ciencia de la hisba en los inicios del Islam y las cualidades requeridas para quien la practica {cite:maalim-qurba-edition-1976 p.6} {cite:maalim-qurba-edition-1976 p.9}."
  fr: "Un traité sur la hisba d'Ibn al-Ukhuwwa, rédigé pour aider l'inspecteur des marchés dans ses fonctions: la supervision des marchés, des poids et mesures, la protection de la moralité publique et la lutte contre la fraude et les contrats illicites. Les éditeurs décrivent l'importance de la science de la hisba dans l'islam primitif et les qualités requises de son titulaire {cite:maalim-qurba-edition-1976 p.6} {cite:maalim-qurba-edition-1976 p.9}."
  ur: "ابن الخووا کی طرف سے ہسبا پر ایک مقالہ، جو مارکیٹ انسپکٹر کو اس کے فرائض میں مدد کے لیے لکھا گیا ہے: بازاروں کی نگرانی، وزن اور پیمائش، عوامی اخلاق کی حفاظت، اور دھوکہ دہی اور ممنوعہ معاہدوں سے لڑنا۔ مدیران ابتدائی اسلام میں حسبہ کی سائنس کی حیثیت اور اس کے حاملین کے لیے ضروری خصوصیات کو بیان کرتے ہیں {حوالہ:مالم قربا ایڈیشن-1976 صفحہ 6} {حوالہ:مالم قربا ایڈیشن-1976 صفحہ 9}۔"
  tr: "[[kişi/ibn-al-ukhuwwa|ibn al-Ikhwa]] tarafından muhtasib'e pazarların, terazinin ve önlemlerin denetlenmesi, kamu ahlakının korunması, dolandırıcılık ve yasaklı sözleşmelerle mücadele çalışmalarına yardımcı olmak amacıyla yazılmış bir hisbah kitabı. Kitabın editörleri, hisbahın erken dönemdeki durumunu ve onu üstlenenler için koşulları anlatır {cite:maalim-qurba-edition-1976 s.6} {cite:maalim-qurba-edition-1976 s.9}."
  id: "Sebuah buku tentang hisbah yang ditulis oleh [[person/ibn-al-ukhuwwa|ibn al-Ikhwa]] untuk membantu muhtasib dalam pekerjaannya: mengawasi pasar, skala, dan langkah-langkah, menjaga moral publik, serta memerangi penipuan dan kontrak terlarang. Editor buku ini menggambarkan status hisbah pada periode awal dan kondisi bagi mereka yang memimpin hishbah {cite:maalim-qurba-edition-1976 hlm.6} {cite:maalim-qurba-edition-1976 hlm.9}."
