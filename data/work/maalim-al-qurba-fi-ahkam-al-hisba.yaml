summary:
  ar: "كتاب في الحسبة ألفه [[person/ibn-al-ukhuwwa|ابن الأخوة]] ليعين المحتسب في عمله: الإشراف على الأسواق والموازين والمكاييل، وصيانة الآداب العامة، ومحاربة الغش والعقود المحرمة. ويصف محققا الكتاب مكانة علم الحسبة في الصدر الأول وشروط من يتولاها {cite:maalim-qurba-edition-1976 p.6} {cite:maalim-qurba-edition-1976 p.9}."
  en: "A treatise on hisba by Ibn al-Ukhuwwa, written to help the market inspector in his duties: supervising markets, weights and measures, protecting public morals, and fighting fraud and forbidden contracts. The editors describe the standing of the science of hisba in early Islam and the qualities required of its holder {cite:maalim-qurba-edition-1976 p.6} {cite:maalim-qurba-edition-1976 p.9}."
