label: { ar: "حكم إقامة حفلات التخرج", en: "Holding graduation celebrations", ur: "تقریبِ فراغت کا حکم" }
summary:
  ar: "سائل سأل عن إقامة حفلات التخرج الجامعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21960)⁩ أنها أمر جائز شرعًا ما دامت تراعى فيها الآداب والضوابط الشرعية التي تضبط تصرفات المحتفلين على ما فصّل الجواب."
  en: "A questioner asked about holding university graduation celebrations. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21960) answered that they are lawful so long as the sharia etiquettes and controls governing the celebrants' conduct are observed, as the answer details."
  ur: "ایک سائل نے یونیورسٹی کی تقریبِ فراغت منانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21960)⁩ نے جواب دیا کہ یہ جائز ہے بشرطیکہ شرعی آداب اور ضوابط کی رعایت ہو جو شرکاء کے رویوں کو مضبوط کریں، جیسا کہ جواب میں تفصیل ہے۔"
