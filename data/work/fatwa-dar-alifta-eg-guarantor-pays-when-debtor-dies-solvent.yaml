id: work/fatwa-dar-alifta-eg-guarantor-pays-when-debtor-dies-solvent
class: work
kind: fatwa
label: { ar: "حكم سداد الكفيل للدين إذا مات المدين وترك مالًا يكفي", en: "The guarantor's duty when the debtor dies leaving enough money", ur: "مقروض کی وفات پر کفیل کی ذمہ داری جب ترکہ کافی ہو" }
summary:
  ar: "سائل سأل عن سداد الكفيل للدين إذا حلّ ومات المكفول عنه وترك مالًا يكفي لسداد دينه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21081)⁩ أن الدين يكون واجبًا في تركته أصالةً على ما فصّل الجواب من حكم الكفالة حينئذ."
  en: "A questioner asked about the guarantor paying a due debt when the debtor died leaving money enough to cover it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21081) answered that the debt falls due on his estate as a first charge; the ruling on the guarantee then is set out in the answer."
  ur: "ایک سائل نے پوچھا کہ جب مقروض فوت ہو کر اتنا مال چھوڑے جو قرض کے لیے کافی ہو تو کفیل کا کیا حکم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21081)⁩ نے جواب دیا کہ قرض اصل میں اس کے ترکہ پر واجب ہے؛ جواب میں کفالت کا حکم بیان ہوا۔"
