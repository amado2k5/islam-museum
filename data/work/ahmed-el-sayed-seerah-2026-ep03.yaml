label:
  ar: "سيرة رسول الله 2026، الحلقة 3: مولد النبي"
  en: "The Biography of the Messenger of God 2026, episode 3: The Birth of the Prophet"
  ur: "سیرتِ رسول اللہ 2026، قسط 3: نبی کی ولادت"
  fr: "La biographie du Messager de Dieu 2026, épisode 3 : La naissance du Prophète"
  es: "La biografía del Mensajero de Dios 2026, episodio 3: El nacimiento del Profeta"
summary:
  ar: "المجلس الثالث من سلسلة السيرة لعام 2026، وما زال في مرحلة ما قبل البعثة. يتناول فيه حادثة الفيل ورحلتي الشتاء والصيف بوصفهما تهيئة إلهية للعرب، ثم حفر زمزم من جديد، ومولد النبي والخلاف في تاريخه وفي الاحتفال به، والرضاعة في بني سعد وشق الصدر، والمرضعات الأخريات، واليتم ووفاة أمه وجده، ورعي الغنم الذي مارسه كل نبي. وفي أثناء ذلك يبين كيف يرتب أخبار ابن إسحاق في طبقات."
  en: "The third session of the 2026 seerah series, still on the period before the call to prophethood. He treats the elephant episode and the winter and summer caravans as divine preparation of the Arabs, the re-digging of Zamzam, the Prophet's birth and the debate over its date and its commemoration, the fosterage with Banu Sa'd and the opening of the chest, the other nurses, the orphanhood and the deaths of his mother and grandfather, and the shepherding that every prophet undertook. Along the way he sets out how he grades Ibn Ishaq's reports."
  ur: "2026 کے سیرت سلسلے کی تیسری نشست، جو ابھی بعثت سے پہلے کے دور میں ہے۔ اس میں وہ واقعۂ فیل اور سردی و گرمی کے تجارتی قافلوں کو عربوں کی الٰہی تیاری کے طور پر بیان کرتے ہیں، پھر زمزم کی دوبارہ کھدائی، نبی کی ولادت اور اس کی تاریخ اور اس کے منانے پر اختلاف، بنو سعد میں رضاعت اور شقِ صدر، دوسری دایاں، یتیمی اور ماں اور دادا کی وفات، اور بکریاں چرانا جو ہر نبی نے کیا۔ اسی دوران وہ بتاتے ہیں کہ ابن اسحاق کی روایات کو وہ کن درجوں میں رکھتے ہیں۔"
  fr: "Troisième séance de la série sur la sira de 2026, toujours consacrée à la période qui précède l'appel à la prophétie. Il y traite de l'épisode de l'éléphant et des caravanes d'hiver et d'été comme d'une préparation divine des Arabes, du nouveau creusement de Zamzam, de la naissance du Prophète et du débat sur sa date et sur sa commémoration, de l'allaitement chez les Banu Sa'd et de l'ouverture de la poitrine, des autres nourrices, de l'orphelinat et de la mort de sa mère et de son grand-père, et de la garde des troupeaux que tout prophète a exercée. Chemin faisant, il expose comment il classe les récits d'Ibn Ishaq."
  es: "Tercera sesión de la serie sobre la sira de 2026, todavía dentro del periodo anterior a la llamada profética. En ella trata el episodio del elefante y las caravanas de invierno y de verano como una preparación divina de los árabes, la nueva excavación de Zamzam, el nacimiento del Profeta y el debate sobre su fecha y su conmemoración, la lactancia con los Banu Sa'd y la apertura del pecho, las otras nodrizas, la orfandad y la muerte de su madre y de su abuelo, y el pastoreo que ejerció todo profeta. De paso expone cómo clasifica los relatos de Ibn Ishaq."
