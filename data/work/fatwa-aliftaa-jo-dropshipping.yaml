id: work/fatwa-aliftaa-jo-dropshipping
class: work
kind: fatwa
label: { ar: "التجارة الإلكترونية بالدروب شيبينغ", en: "Dropshipping in online trade", ur: "آن لائن تجارت میں ڈراپ شپنگ", es: "Dropshipping en el comercio online", fr: "Dropshipping dans le commerce en ligne", tr: "E-ticaret dropshipping", id: "Dropshipping e-commerce" }
summary:
  ar: "سؤال عن التجارة الإلكترونية بالدروب شيبينغ، أجابت فيه دائرة الإفتاء العام الأردنية بأن حكم الدروب شيبينغ يختلف باختلاف صوره: فالتوكيل المسبق والعمولة على الروابط وبيع السلم بثمن معجل جائزة، وبيع السلعة قبل تملكها وقبضها ممنوع. أجابت الدائرة بأن الدروب شيبينغ معاملة بيع بين ثلاثة أطراف: صاحب الموقع أو المتجر الإلكتروني، والزبون، والتاجر أو المصنع المالك للسلعة، وأن المصطلح يطلق على صور مختلفة يختلف حكمها. فالصورة الأولى أن يحصل صاحب الموقع على توكيل مسبق من المورد ببيع سلعة محددة مقابل نسبة أو مبلغ مقطوع، ويورد التاجر السلعة إلى الزبون مباشرة، وهي وكالة مباحة؛ والثانية أن يعرض رابط سلع التاجر مقابل عمولة على كل شراء يتم عبره، وهي عمولة أو دلالة مباحة. والثالثة أن يعرض سلعًا دون توكيل أو اتفاق مسبق ويبيعها للزبون قبل تملكها ودون قبض، ثم يشتريها من المورد ويطلب تسليمها للزبون، وهي من بيع ما لا يملك المنهي عنه؛ والرابعة أن يعرض سلعة محددة الأوصاف يمكنه توفيرها ويقبض ثمنها معجلًا ليوفرها في مدة متفق عليها، ثم يطلب من المورد تسليمها لعنوان الزبون، وهي من بيع السلم المباح. ونبهت الدائرة إلى أن صورًا أخرى قد يطلق عليها المصطلح، وتحتاج كل حالة منها إلى دراسة وبيان حكمها."
  en: "A question about dropshipping in online trade, in which Jordan's General Iftaa Department answered that the ruling on dropshipping depends on its form: prior agency, commission on links, and a forward sale (salam) with the price paid in advance are permitted, while selling goods before owning and possessing them is not. The Department answered that dropshipping is in practice a sale involving three parties: the owner of the website or online store, the customer, and the trader or manufacturer who owns the goods; the term covers several different forms with different rulings. In the first, the site owner obtains prior agency from the supplier to sell specified goods for a percentage or fixed fee, and the supplier ships to the customer directly: a permitted agency. In the second, the site owner displays a link to the trader's goods for a commission on each purchase made through it: a permitted commission or brokerage. In the third, the site owner displays goods without any prior agency or agreement, sells them to the customer before owning or possessing them, then buys them from the supplier and has them delivered to the customer: this is selling what one does not own, which is prohibited. In the fourth, he offers goods of specified description that he can supply, takes the price in advance and supplies them within an agreed period, asking the supplier to deliver to the customer's address: a permitted forward sale (salam). The Department noted that other forms may also go by this name, and each needs to be studied for its ruling."
  ur: "آن لائن تجارت میں ڈراپ شپنگ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ڈراپ شپنگ کا حکم اس کی صورت پر موقوف ہے: پیشگی وکالت، لنک پر کمیشن، اور پیشگی قیمت کے ساتھ بیعِ سلم جائز ہیں، جبکہ مال کی ملکیت اور قبضے سے پہلے اسے بیچنا ممنوع ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ڈراپ شپنگ عملاً تین فریقوں کے درمیان بیع ہے: ویب سائٹ یا آن لائن اسٹور کا مالک، گاہک، اور مال کا مالک تاجر یا کارخانہ؛ یہ اصطلاح کئی مختلف صورتوں پر بولی جاتی ہے جن کے احکام مختلف ہیں۔ پہلی صورت میں سائٹ کا مالک سپلائر سے مخصوص سامان بیچنے کی پیشگی وکالت فیصد یا مقررہ رقم کے عوض لیتا ہے اور سپلائر براہِ راست گاہک کو بھیجتا ہے: یہ جائز وکالت ہے۔ دوسری میں وہ تاجر کے سامان کا لنک دکھاتا ہے اور ہر خریداری پر کمیشن لیتا ہے: یہ جائز کمیشن یا دلالی ہے۔ تیسری میں وہ بغیر وکالت یا پیشگی معاہدے کے سامان دکھا کر ملکیت اور قبضے سے پہلے گاہک کو بیچ دیتا ہے، پھر سپلائر سے خرید کر گاہک کو بھجواتا ہے: یہ ایسی چیز کی بیع ہے جو ملکیت میں نہیں، جو ممنوع ہے۔ چوتھی میں وہ متعین اوصاف والا سامان پیش کرتا ہے جو وہ فراہم کر سکتا ہے، قیمت پیشگی لیتا ہے اور طے شدہ مدت میں فراہم کرتا ہے، اور سپلائر سے گاہک کے پتے پر بھجواتا ہے: یہ جائز بیعِ سلم ہے۔ ڈیپارٹمنٹ نے تنبیہ کی کہ اس اصطلاح کے تحت دوسری صورتیں بھی آ سکتی ہیں، جن میں سے ہر ایک کا حکم جاننے کے لیے مطالعہ درکار ہے۔"
  es: "Una pregunta sobre el dropshipping en el comercio electrónico, en la que el Departamento General de Iftaa de Jordania respondió que la normativa sobre dropshipping depende de su forma: se permiten la agencia previa, la comisión por enlaces y la venta anticipada (salam) con el precio pagado por adelantado, mientras que la venta de bienes antes de poseerlos no está permitida. El Departamento explicó que el dropshipping es, en la práctica, una venta que involucra a tres partes: el propietario del sitio web o tienda en línea, el cliente y el comerciante o fabricante propietario de los bienes; el término abarca varias formas diferentes con distintas normativas. En la primera, el propietario del sitio obtiene la agencia previa del proveedor para vender bienes específicos por un porcentaje o una tarifa fija, y el proveedor realiza el envío directamente al cliente: una agencia permitida. En la segunda, el propietario del sitio muestra un enlace a los bienes del comerciante a cambio de una comisión por cada compra realizada a través de él: una comisión o intermediación permitida. En el tercer caso, el propietario del sitio web exhibe productos sin representación ni acuerdo previo, los vende al cliente antes de poseerlos, luego los compra al proveedor y los hace entregar al cliente: esto constituye la venta de algo que no se posee, lo cual está prohibido. En el cuarto caso, ofrece productos de descripción específica que puede suministrar, recibe el precio por adelantado y los entrega dentro de un plazo acordado, solicitando al proveedor que los entregue en el domicilio del cliente: una venta anticipada permitida (salam). El Departamento señaló que otras formas también pueden denominarse así, y cada una debe estudiarse para determinar su interpretación."
  fr: "Une question relative au dropshipping dans le commerce en ligne a été posée au Département général de la Cour suprême de Jordanie (Iftaa). Ce dernier a précisé que la réglementation du dropshipping dépend de sa forme: l’agence préalable, la commission sur les liens et la vente à terme (salam) avec paiement anticipé sont autorisées, tandis que la vente de marchandises avant d’en être propriétaire ne l’est pas. Le Département a expliqué que le dropshipping est en pratique une vente impliquant trois parties: le propriétaire du site web ou de la boutique en ligne, le client et le vendeur ou le fabricant propriétaire des marchandises. Ce terme recouvre plusieurs formes différentes, chacune soumise à une réglementation spécifique. Dans le premier cas, le propriétaire du site obtient une agence préalable du fournisseur pour vendre des produits spécifiques contre un pourcentage ou une commission fixe, et le fournisseur expédie directement au client: il s’agit d’une agence autorisée. Dans le second cas, le propriétaire du site affiche un lien vers les produits du vendeur en échange d’une commission sur chaque achat effectué via ce lien: il s’agit d’une commission ou d’un courtage autorisé. Dans le troisième cas, le propriétaire du site présente des marchandises sans mandat ni accord préalable, les vend au client avant d'en être propriétaire ou en possession, puis les achète auprès du fournisseur et les fait livrer au client: il s'agit de la vente de biens dont on n'est pas propriétaire, ce qui est interdit. Dans le quatrième cas, il propose des marchandises dont la description est précisée et qu'il peut fournir, encaisse le prix d'avance et les livre dans un délai convenu, en demandant au fournisseur de livrer à l'adresse du client: il s'agit d'une vente à terme autorisée (salam). Le Département a noté que d'autres formes peuvent également porter cette appellation et que chacune doit être étudiée individuellement afin de déterminer sa portée."
  tr: "Dropshipping yoluyla e-ticaret hakkında bir soru, Ürdün Genel Fetva Dairesi, dropshipping'in kararının biçimlerine göre değiştiğini yanıtladı: ön yetkilendirme, bağlantı komisyonu, malların hızlandırılmış fiyatla satışı ödül olarak kabul edilir ve malları sahiplenmeden ve almadan önce satmanın yasaktır. Departman, dropshipping'in üç taraf arasında gerçekleştiğini yanıtladı: web sitesi veya online mağaza sahibi, müşteri ve ürünün sahibi satıcı veya üretici ile ilgili ve terimin farklı kararlara sahip farklı formlar için geçerli olduğunu belirtti. İlk form, web sitesi sahibinin tedarikçiden belirli bir ürünü belirli bir yüzde veya sabit bir bedelle satmak için önceden vekaletname alması ve satıcının ürünü doğrudan müşteriye teslim etmesi (bu izin verilen vekaletname) ifade edilir; ikincisi ise, satıcının mal bağlantısının her yapılan alışverişte komisyon karşılığında gösterilmesi, bunun izin verilen komisyon veya gösterge olmasıdır. Üçüncüsü, malları vekaletname veya önceden anlaşma olmadan teklif eder, müşteriye sahiplenmeden önce ve ödemeden satar, ardından tedarikçiden satın alır ve müşteriye teslimat talep eder; bu, yasak tarafın sahip olmadığı malların satışıdır; dördüncüsü ise, belirli bir ürünü sunup hızlıca teslim edilen fiyatı kabul edilen süre içinde almasıdır; ardından tedarikçi, ürünü müşterinin adresine teslim etmek zorundadır ki bu da izin verilen bir satış olarak kabul edilir. Departman, başka formların da bu terim olarak adlandırılabileceği konusunda uyardı ve her vaka kararının incelenmesi ve açıklığa kavuşturulması gerektiğini belirtti."
  id: "Pertanyaan tentang e-commerce melalui dropshipping, di mana Departemen Fatwa Umum Yordania menjawab bahwa aturan dropshipping bervariasi sesuai bentuknya: pra-otorisasi, komisi atas tautan, menjual barang dengan harga dipercepat adalah hadiah, dan menjual barang sebelum memiliki dan menerima barang dilarang. Departemen menjawab bahwa dropshipping adalah transaksi penjualan antara tiga pihak: pemilik situs web atau toko online, pelanggan, dan pedagang atau produsen yang memiliki produk, dan istilah ini berlaku untuk berbagai bentuk dengan keputusan yang berbeda. Formulir pertama adalah ketika pemilik situs web memperoleh surat kuasa sebelumnya dari pemasok untuk menjual produk tertentu dengan persentase atau jumlah tetap, dan pedagang memasok barang langsung kepada pelanggan, yang merupakan surat kuasa yang diperbolehkan; yang kedua adalah tautan barang pedagang ditampilkan sebagai imbalan komisi atas setiap pembelian yang dilakukan, yang merupakan komisi atau indikasi yang diperbolehkan. Yang ketiga adalah dia menawarkan barang tanpa surat kuasa atau perjanjian sebelumnya dan menjualnya kepada pelanggan sebelum memilikinya dan tanpa pembayaran, kemudian membelinya dari pemasok dan meminta pengiriman kepada pelanggan, yaitu penjualan barang yang bukan milik pihak terlarang; yang keempat adalah menawarkan produk tertentu yang dapat disediakan dan menerima harga yang dipercepat untuk menyerahkannya dalam jangka waktu yang disepakati, kemudian pemasok diwajibkan mengantarkannya ke alamat pelanggan, yang dianggap sebagai penjualan yang diperbolehkan. Departemen memperingatkan bahwa formulir lain dapat disebut istilah tersebut, dan setiap kasus memerlukan studi dan klarifikasi atas putusannya."
