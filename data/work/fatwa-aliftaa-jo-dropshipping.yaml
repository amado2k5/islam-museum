id: work/fatwa-aliftaa-jo-dropshipping
class: work
kind: fatwa
label: { ar: "التجارة الإلكترونية بالدروب شيبينغ", en: "Dropshipping in online trade", ur: "آن لائن تجارت میں ڈراپ شپنگ" }
summary:
  ar: "سؤال عن التجارة الإلكترونية بالدروب شيبينغ، أجابت فيه دائرة الإفتاء العام الأردنية بأن حكم الدروب شيبينغ يختلف باختلاف صوره: فالتوكيل المسبق والعمولة على الروابط وبيع السلم بثمن معجل جائزة، وبيع السلعة قبل تملكها وقبضها ممنوع. أجابت الدائرة بأن الدروب شيبينغ معاملة بيع بين ثلاثة أطراف: صاحب الموقع أو المتجر الإلكتروني، والزبون، والتاجر أو المصنع المالك للسلعة، وأن المصطلح يطلق على صور مختلفة يختلف حكمها. فالصورة الأولى أن يحصل صاحب الموقع على توكيل مسبق من المورد ببيع سلعة محددة مقابل نسبة أو مبلغ مقطوع، ويورد التاجر السلعة إلى الزبون مباشرة، وهي وكالة مباحة؛ والثانية أن يعرض رابط سلع التاجر مقابل عمولة على كل شراء يتم عبره، وهي عمولة أو دلالة مباحة. والثالثة أن يعرض سلعًا دون توكيل أو اتفاق مسبق ويبيعها للزبون قبل تملكها ودون قبض، ثم يشتريها من المورد ويطلب تسليمها للزبون، وهي من بيع ما لا يملك المنهي عنه؛ والرابعة أن يعرض سلعة محددة الأوصاف يمكنه توفيرها ويقبض ثمنها معجلًا ليوفرها في مدة متفق عليها، ثم يطلب من المورد تسليمها لعنوان الزبون، وهي من بيع السلم المباح. ونبهت الدائرة إلى أن صورًا أخرى قد يطلق عليها المصطلح، وتحتاج كل حالة منها إلى دراسة وبيان حكمها."
  en: "A question about dropshipping in online trade, in which Jordan's General Iftaa Department answered that the ruling on dropshipping depends on its form: prior agency, commission on links, and a forward sale (salam) with the price paid in advance are permitted, while selling goods before owning and possessing them is not. The Department answered that dropshipping is in practice a sale involving three parties: the owner of the website or online store, the customer, and the trader or manufacturer who owns the goods; the term covers several different forms with different rulings. In the first, the site owner obtains prior agency from the supplier to sell specified goods for a percentage or fixed fee, and the supplier ships to the customer directly: a permitted agency. In the second, the site owner displays a link to the trader's goods for a commission on each purchase made through it: a permitted commission or brokerage. In the third, the site owner displays goods without any prior agency or agreement, sells them to the customer before owning or possessing them, then buys them from the supplier and has them delivered to the customer: this is selling what one does not own, which is prohibited. In the fourth, he offers goods of specified description that he can supply, takes the price in advance and supplies them within an agreed period, asking the supplier to deliver to the customer's address: a permitted forward sale (salam). The Department noted that other forms may also go by this name, and each needs to be studied for its ruling."
  ur: "آن لائن تجارت میں ڈراپ شپنگ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ڈراپ شپنگ کا حکم اس کی صورت پر موقوف ہے: پیشگی وکالت، لنک پر کمیشن، اور پیشگی قیمت کے ساتھ بیعِ سلم جائز ہیں، جبکہ مال کی ملکیت اور قبضے سے پہلے اسے بیچنا ممنوع ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ڈراپ شپنگ عملاً تین فریقوں کے درمیان بیع ہے: ویب سائٹ یا آن لائن اسٹور کا مالک، گاہک، اور مال کا مالک تاجر یا کارخانہ؛ یہ اصطلاح کئی مختلف صورتوں پر بولی جاتی ہے جن کے احکام مختلف ہیں۔ پہلی صورت میں سائٹ کا مالک سپلائر سے مخصوص سامان بیچنے کی پیشگی وکالت فیصد یا مقررہ رقم کے عوض لیتا ہے اور سپلائر براہِ راست گاہک کو بھیجتا ہے: یہ جائز وکالت ہے۔ دوسری میں وہ تاجر کے سامان کا لنک دکھاتا ہے اور ہر خریداری پر کمیشن لیتا ہے: یہ جائز کمیشن یا دلالی ہے۔ تیسری میں وہ بغیر وکالت یا پیشگی معاہدے کے سامان دکھا کر ملکیت اور قبضے سے پہلے گاہک کو بیچ دیتا ہے، پھر سپلائر سے خرید کر گاہک کو بھجواتا ہے: یہ ایسی چیز کی بیع ہے جو ملکیت میں نہیں، جو ممنوع ہے۔ چوتھی میں وہ متعین اوصاف والا سامان پیش کرتا ہے جو وہ فراہم کر سکتا ہے، قیمت پیشگی لیتا ہے اور طے شدہ مدت میں فراہم کرتا ہے، اور سپلائر سے گاہک کے پتے پر بھجواتا ہے: یہ جائز بیعِ سلم ہے۔ ڈیپارٹمنٹ نے تنبیہ کی کہ اس اصطلاح کے تحت دوسری صورتیں بھی آ سکتی ہیں، جن میں سے ہر ایک کا حکم جاننے کے لیے مطالعہ درکار ہے۔"
