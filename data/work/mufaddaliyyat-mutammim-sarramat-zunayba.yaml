label: { ar: "قصيدة متمم بن نويرة «صرمت زنيبة حبل من لا يقطع»", en: "Mutammim ibn Nuwayra's ode 'Zunayba severed the tie'", es: "La oda de Mutammim ibn Nuwayra, 'Zunayba rompió el vínculo'.", fr: "L'ode de Mutammim ibn Nuwayra « Zunayba a rompu le lien »", ur: "مطمّم بن نویرہ کا کلام 'زنیبہ نے بندھن توڑ دیا'", tr: "Tamam ibn Nuwayrah'ın şiiri: 'Kırmayanın ipini kopardım'", id: "Puisi Tamam ibn Nuwayrah: 'Aku Memutus Tali Yang Tidak Putus'" }
summary:
  ar: "قصيدة في المفضليات ⁦(رقمها التاسع في الطبعة)⁩ على روي العين، قيل إنها لمالك أخيه، مطلعها «صرمت زنيبة حبل من لا يقطع»، كما في طبعة المطبعة الرحمانية {{cite:mufaddaliyyat-rahmaniyya-1926 p.11}}."
  en: "A poem of the Mufaddaliyyat (number nine in the edition) on the rhyme ayn, which the edition says is also said to concern his brother Malik, opening \"Zunayba severed the tie of one who does not sever\", as in the Rahmaniyya edition {{cite:mufaddaliyyat-rahmaniyya-1926 p.11}}."
  es: "Un poema del Mufaddaliyyat (número nueve en la edición) sobre la rima ayn, que según la edición también se dice que se refiere a su hermano Malik, que comienza con \"Zunayba cortó el vínculo de aquel que no lo corta\", como en la edición Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.11}}."
  fr: "Un poème du Mufaddaliyyat (numéro neuf dans l'édition) sur la rime ayn, qui, selon l'édition, concerne également son frère Malik, commençant par « Zunayba a rompu le lien de celui qui ne rompt pas », comme dans l'édition Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.11}}."
  ur: "نظم عین پر مفضلیت کی ایک نظم ⁦(ایڈیشن میں نویں نمبر)⁩، جس کے ایڈیشن میں کہا گیا ہے کہ اس کے بھائی مالک کے متعلق بھی کہا گیا ہے کہ \"زنیبہ نے اس کے بندھن کو کاٹ دیا جو نہ توڑے\" جیسا کہ رحمانیہ ایڈیشن میں ہے {{حوالہ:مفدالیات-رحمانیہ-1926}} صفحہ 11۔"
  tr: "Mufaddaliyyat'ta (baskıdaki dokuzuncu baskısı) Al-Ayn'ın anlatımına göre, kardeşi Malik tarafından yazıldığı söylenen bir şiir, \"Kesmeyen insanın ipinin kuyruğunu gerdim\" ile başlar, Rahmaniyyah Press baskısında olduğu gibi {{cite:Mufaddaliyyyat-rahmaniyya-1926 s.11}}."
  id: "Sebuah puisi dalam Mufaddaliyyat (edisi kesembilan dalam edisi ini) menurut narasi Al-Ayn, yang dikatakan karya Malik saudaranya, dimulai dengan \"Aku telah meregangkan ekor tali manusia yang tidak memotong,\" seperti dalam edisi Rahmaniyyah Press {{cite:Mufaddaliyyyat-rahmaniyya-1926 hlm.11}}."
