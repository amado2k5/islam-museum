summary:
  ar: "قصيدة في المفضليات ⁦(رقمها التاسع في الطبعة)⁩ على روي العين، قيل إنها لمالك أخيه، مطلعها «صرمت زنيبة حبل من لا يقطع»، كما في طبعة المطبعة الرحمانية {{cite:mufaddaliyyat-rahmaniyya-1926 p.11}}."
  en: "A poem of the Mufaddaliyyat (number nine in the edition) on the rhyme ayn, which the edition says is also said to concern his brother Malik, opening \"Zunayba severed the tie of one who does not sever\", as in the Rahmaniyya edition {{cite:mufaddaliyyat-rahmaniyya-1926 p.11}}."
