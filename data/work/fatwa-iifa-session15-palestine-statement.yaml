label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 15)⁩ بشأن القضية الفلسطينية ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(15th session)⁩ on the Palestinian cause ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(پندرہویں مجلس)⁩: مسئلۂ فلسطین ⁦(بیان، قرارداد نہیں)⁩", es: "Declaración de la IIFA (15.ª sesión) sobre la causa palestina (declaración, no resolución)" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(6–11 مارس 2004م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. يصف البيان بلسان المجمع ما يراه معاناة الشعب الفلسطيني تحت الاحتلال ⁦(قتل وهدم بيوت ومصادرة أراضٍ وجدار فاصل)⁩، ويدعو العالم إلى وقفها، ويؤكد حق الشعب الفلسطيني في أرضه ودولته في نصه. سُجّل بوصفه بيان المجمع، ملخصًا بحياد دون إعادة إنتاج مفرداته الخطابية."
  en: "A statement issued by the International Islamic Fiqh Academy at its 15th session in Muscat (6–11 March 2004), published among the session materials though not a numbered resolution. In the Academy's own voice it describes what it sees as the Palestinian people's suffering under occupation — killing, house demolitions, land seizure and the separation barrier — calls on the world to stop them, and affirms in its text the Palestinian people's right to their land and state. Recorded as the Academy's own statement, summarised neutrally without reproducing its rhetorical vocabulary."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، مسقط میں پندرہویں مجلس ⁦(6–11 مارچ 2004ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ اکیڈمی کی اپنی زبانی میں یہ فلسطینی عوام کی وہ تکلیف بیان کرتا ہے جو اس کے نزدیک قبضے کے تحت ہے — قتل، گھروں کی تباہی، زمین کی ضبطی اور تقسیم کن دیوار — اور دنیا سے اس کے خاتمے کی دعوت دیتا ہے، اور متن میں فلسطینی عوام کے زمین اور ریاست کے حق کی تصدیق کرتا ہے۔ یہاں اکیڈمی کے اپنے بیان کا غیر جانبدارانہ خلاصہ درج ہے، اس کے بیانیاتی الفاظ دہرائے بغیر۔"
  es: "Declaración emitida por la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión celebrada en Mascate (del 6 al 11 de marzo de 2004), publicada entre los documentos de la sesión, aunque no como resolución numerada. En palabras de la propia Academia, describe el sufrimiento del pueblo palestino bajo la ocupación —asesinatos, demoliciones de viviendas, confiscación de tierras y el muro de separación—, hace un llamamiento a la comunidad internacional para que ponga fin a estas atrocidades y afirma en su texto el derecho del pueblo palestino a su tierra y a su Estado. Esta declaración se recoge como declaración oficial de la Academia, resumida de forma neutral sin reproducir su vocabulario retórico."
