label: { ar: "حكم كتابة بعض الآيات والأذكار على الكفن", en: "Writing verses and invocations on the shroud", ur: "کفن پر آیات اور اذکار لکھنے کا حکم", es: "Escribir versos e invocaciones en la Sábana Santa.", fr: "Écrire des versets et des invocations sur le suaire" }
summary:
  ar: "سائل سأل عن كتابة بعض الآيات والأذكار على الكفن. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21810)⁩ أن كتابة بعض آيات القرآن أو غيرها مما يشتمل على صيغ الذكر وأسماء الله على الكفن حرام شرعًا على ما فصّل الجواب من علة ذلك."
  en: "A questioner asked about writing some verses and invocations on the burial shroud. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21810) answered that writing Qur'anic verses or anything containing invocations and God's names on the shroud is forbidden in the sharia — the answer explains the reason."
  ur: "ایک سائل نے کفن پر بعض آیات اور اذکار لکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21810)⁩ نے جواب دیا کہ کفن پر قرآنی آیات یا ایسی چیزیں جن میں ذکر اور اللہ کے نام ہوں لکھنا حرام ہے — جواب میں اس کی وجہ بیان ہوئی۔"
  es: "Un consultante preguntó sobre la posibilidad de escribir versículos e invocaciones en la mortaja. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21810) respondió que escribir versículos coránicos o cualquier cosa que contenga invocaciones y nombres de Dios en la mortaja está prohibido por la sharia; la respuesta explica el motivo."
  fr: "Une personne a posé une question concernant l'inscription de versets coraniques et d'invocations sur le linceul funéraire. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21810) a répondu que l'inscription de versets coraniques ou de toute inscription contenant des invocations et des noms de Dieu sur le linceul est interdite par la charia; la réponse en explique la raison."
