id: work/fatwa-dar-alifta-eg-selling-waqf-for-replacement
class: work
kind: fatwa
label: { ar: "حكم بيع الوقف لاستبداله بآخر", en: "Selling a waqf to replace it with another", ur: "وقف کو دوسرے سے بدلنے کے لیے بیچنے کا حکم", es: "Vender un waqf para reemplazarlo con otro", fr: "Vendre un waqf pour le remplacer par un autre", tr: "Bir vakıfın başka bir bağışla değiştirilmesine ilişkin karar", id: "Memutuskan penjualan dana abadi untuk menggantinya dengan yang lain" }
summary:
  ar: "سائل سأل عن بيع وقف لاستبداله بآخر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22599)⁩ أن الأصل في المسجد أنه وقف شرعي خالص لله تعالى لا يجوز بيعه أو التصرف فيه ما دام الانتفاع به ممكنًا، أما إذا تعذر الانتفاع به فحكمه كما فصّل الجواب في جواز الاستبدال بوقف آخر."
  en: "A questioner asked about selling a waqf to replace it with another. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22599) answered that in principle a mosque is a sharia waqf consecrated to God that may not be sold or disposed of so long as benefit from it is possible; where benefit has become impossible, the answer sets out when it may be exchanged for another endowment."
  ur: "ایک سائل نے وقف کو دوسرے سے بدلنے کے لیے بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22599)⁩ نے جواب دیا کہ مسجد اصولاً شرعی وقف ہے خالص اللہ کے لیے، جب تک اس سے فائدہ ممکن ہو اسے بیچنا یا تصرف کرنا جائز نہیں؛ جہاں فائدہ ناممکن ہو جائے وہاں جواب نے کب اسے دوسرے وقف سے بدلا جا سکتا ہے تفصیل سے بیان کیا۔"
  es: "Un consultante preguntó sobre la posibilidad de vender un waqf para reemplazarlo por otro. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22599) respondió que, en principio, una mezquita es un waqf sharia consagrado a Dios que no puede venderse ni enajenarse mientras sea posible obtener beneficios de él; cuando dichos beneficios se vuelven imposibles, la respuesta establece cuándo puede intercambiarse por otra donación."
  fr: "Un internaute a posé une question concernant la vente d'un waqf en vue de son remplacement par un autre. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22599) a répondu qu'en principe, une mosquée est un waqf islamique consacré à Dieu et ne peut être ni vendu ni aliéné tant qu'il est possible d'en tirer profit. Lorsque ce profit devient impossible, la réponse précise les conditions dans lesquelles un waqf peut être échangé contre un autre bien de mainmorte."
  tr: "Bir soru soran kişi, bir bağışı başka bir bağağa satmak için satılması hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22599), caminin varsayılan olarak Allah'a tamamen meşru bir bağış olduğunu ve bundan faydalanabildiğiniz sürece satılmasının veya elden çıkarılmasının izin verilmediğini yanıtladı. Ancak, bundan yararlanılamıyorsa, başka bir vakıfla değiştirilmenin caizliğiyle ilgili cevabda olduğu kadar ayrıntılı karar verilmiştir."
  id: "Seorang penanya menanyakan tentang menjual wakaf untuk ditukar dengan yang lain. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22599) menjawab bahwa kelemahan masjid adalah bahwa itu adalah wakaf yang murni sah bagi Allah Yang Maha Kuasa, dan tidak diperbolehkan menjual atau menjualnya selama masih memungkinkan untuk mendapatkan manfaat darinya. Namun, jika tidak memungkinkan untuk mendapatkan manfaat darinya, putusan tersebut sedetail dalam jawaban mengenai diperbolehkannya menggantinya dengan wakaf lain."
