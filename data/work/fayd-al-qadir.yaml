summary:
  ar: "شرح عبد الرؤوف المناوي الكبير على «الجامع الصغير» للسيوطي، أطال فيه النفس في نقد أحاديثه وبيان مرتبتها في الصحة والضعف دون أن يستوعبها، وهو خاص بالأصل دون الزيادة، كما يصفه الألباني؛ وفيه يرى المناوي أن رموز الصحة والحسن والضعف في بعض النسخ لا ينبغي الوثوق بها لغلبة تحريف النساخ {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}."
  en: "'Abd al-Ra'uf al-Munawi's large commentary on al-Suyuti's al-Jami' al-Saghir, which, as al-Albani describes it, criticises its hadiths and states their grades at length without covering all of them, and treats the original only, not the Ziyada; in it al-Munawi holds that the sigla for sound, good and weak in some copies should not be trusted because copyists so often corrupted them {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}."
  ur: "سیوطی کی «الجامع الصغیر» پر عبد الرؤوف مناوی کی بڑی شرح، جس میں البانی کے بقول انہوں نے احادیث پر تفصیلی نقد اور ان کے صحت و ضعف کے درجات بیان کیے مگر سب کا احاطہ نہیں کیا، اور یہ صرف اصل سے متعلق ہے، زیادہ سے نہیں؛ اس میں مناوی کہتے ہیں کہ بعض نسخوں میں صحیح، حسن اور ضعیف کے رموز پر نساخ کی کثرتِ تحریف کی وجہ سے اعتماد نہیں کرنا چاہیے {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}۔"
  es: "El extenso comentario de 'Abd al-Ra'uf al-Munawi sobre al-Jami' al-Saghir de al-Suyuti, que, como lo describe al-Albani, critica sus hadices y establece sus grados extensamente sin cubrirlos todos, y trata solo el original, no el Ziyada; en él, al-Munawi sostiene que no se debe confiar en las siglas para sólido, bueno y débil en algunas copias porque los copistas a menudo las corrompían {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}."
  fr: "Le grand commentaire d'Abd al-Ra'uf al-Munawi sur l'ouvrage d'al-Suyuti, al-Jami' al-Saghir, qui, comme le décrit al-Albani, critique ses hadiths et expose longuement leurs degrés sans tous les couvrir, et ne traite que de l'original, et non de la Ziyada; dans ce commentaire, al-Munawi soutient que les sigles pour « sain », « bon » et « faible » dans certaines copies ne doivent pas être considérés comme fiables car les copistes les ont si souvent corrompus {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}."
  tr: "Abd al-Raouf al-Manawi'nin Al-Suyuti'nin \"Al-Jami' al-Saghir\" eserine yaptığı yorum, hadislerine yönelik eleştirisini uzatır ve onların sıralarını gerçeklik ve zayıflık açısından anlaşılmadan netleştirir. Al-Albani'nin tarif ettiği gibi, bu eser, eklemesiz orijinale özgüdür; Al-Manawi, bazı kopyalardaki özgünlük, iyilik ve zayıflık sembollerinin kopyacı çarpıtmanın baskın olması nedeniyle güvenilmemesi gerektiğine inanır. {cite:sahih-jami-saghir-maktab-islami-1988, s. 14} {cite:sahih-jami-saghir-maktab-islami-1988, s. 21-22}."
  id: "Komentar Abd al-Raouf al-Manawi atas \"Al-Jami' al-Saghir\" karya Al-Suuji memperpanjang kritiknya terhadap hadit-haditnya dan memperjelas tingkatannya dalam hal keaslian dan kelemahan tanpa pemahaman. Komentar ini spesifik terhadap aslinya tanpa tambahan, seperti yang dijelaskan oleh Al-Albani; di dalamnya, Al-Manawi percaya bahwa simbol keaslian, kebaikan, dan kelemahan dalam beberapa salinan tidak boleh dipercaya karena dominasi distorsi penyalin. {cite:sahih-jami-saghir-maktab-islami-1988, hlm. 14} {cite:sahih-jami-saghir-maktab-islami-1988, hlm. 21-22}."
