label:
  ar: "فيض القدير شرح الجامع الصغير"
  en: "Fayd al-Qadir Sharh al-Jami' al-Saghir"
  ur: "فیض القدیر شرح الجامع الصغیر"
summary:
  ar: "شرح عبد الرؤوف المناوي الكبير على «الجامع الصغير» للسيوطي، أطال فيه النفس في نقد أحاديثه وبيان مرتبتها في الصحة والضعف دون أن يستوعبها، وهو خاص بالأصل دون الزيادة، كما يصفه الألباني؛ وفيه يرى المناوي أن رموز الصحة والحسن والضعف في بعض النسخ لا ينبغي الوثوق بها لغلبة تحريف النساخ {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}."
  en: "'Abd al-Ra'uf al-Munawi's large commentary on al-Suyuti's al-Jami' al-Saghir, which, as al-Albani describes it, criticises its hadiths and states their grades at length without covering all of them, and treats the original only, not the Ziyada; in it al-Munawi holds that the sigla for sound, good and weak in some copies should not be trusted because copyists so often corrupted them {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}."
  ur: "سیوطی کی «الجامع الصغیر» پر عبد الرؤوف مناوی کی بڑی شرح، جس میں البانی کے بقول انہوں نے احادیث پر تفصیلی نقد اور ان کے صحت و ضعف کے درجات بیان کیے مگر سب کا احاطہ نہیں کیا، اور یہ صرف اصل سے متعلق ہے، زیادہ سے نہیں؛ اس میں مناوی کہتے ہیں کہ بعض نسخوں میں صحیح، حسن اور ضعیف کے رموز پر نساخ کی کثرتِ تحریف کی وجہ سے اعتماد نہیں کرنا چاہیے {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 21-22}۔"
