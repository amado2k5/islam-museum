id: work/the-boat-ahmad-farid
class: work
kind: lecture-series
label:
  ar: "القارب: دروس في الإيمان والتقوى"
  en: "Al-Qarib (The Boat): lessons on faith and piety"
  ur: "القارب ⁦(کشتی)⁩: ایمان اور تقویٰ پر دروس"
summary:
  ar: "سلسلة من واحد وعشرين درسًا مصوّرًا قصيرًا لأحمد فريد يحفظها أرشيف أسابيل بعنوان «القارب»، ولا يرد العنوان ولا ذكر قارب في التسجيلات: أربعة عشر درسًا في الإيمان وشرفه وثمرات «شجرة الإيمان» وأسباب نمائها، على مثل الكلمة الطيبة والشجرة الطيبة، ثم سبعة في التقوى، أعلى درجات الإيمان عنده: معانيها ووصية الله والأنبياء والسلف بها، وكونها غاية العبادات، وثمراتها العاجلة من سورة الطلاق، والآجلة في الجنة."
  en: "A series of twenty-one short video lessons by Ahmad Farid kept in the Assabile archive under the title 'The Boat', though neither the title nor any boat appears in the recordings: fourteen lessons on faith, its honour, the fruits of 'the tree of faith' and the causes of its growth, built on the likeness of the good word and the good tree, then seven on piety, in his words the highest degree of faith: its meanings, its place as the counsel of God, the prophets and the early generations, its role as the goal of worship, its fruits in this world from sura al-Talaq and in paradise."
  ur: "احمد فرید کے اکیس مختصر ویڈیو دروس کا سلسلہ جو اسابیل آرکائیو میں «القارب» ⁦(کشتی)⁩ کے عنوان سے محفوظ ہے، اگرچہ ریکارڈنگز میں نہ یہ عنوان آتا ہے نہ کسی کشتی کا ذکر: چودہ دروس ایمان، اس کے شرف، «ایمان کے درخت» کے پھلوں اور اس کی نشوونما کے اسباب پر، کلمۂ طیبہ اور پاکیزہ درخت کی مثال پر قائم، پھر سات تقویٰ پر، جو ان کے نزدیک ایمان کا سب سے بلند درجہ ہے: اس کے معانی، اللہ، انبیا اور سلف کی اس کے بارے میں وصیت، عبادات کا مقصد ہونا، سورۃ الطلاق سے اس کے دنیاوی پھل اور جنت میں اخروی پھل۔"
