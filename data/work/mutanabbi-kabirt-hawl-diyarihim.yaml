label: { ar: "قصيدة المتنبي «أرق على أرق ومثلي يأرق»", en: "Al-Mutanabbi's ode 'Sleeplessness upon sleeplessness, and the like of me is sleepless'", es: "La oda de Al-Mutanabbi: \"Insomnio tras insomnio, y los que son como yo son insomnes\".", fr: "L'ode d'Al-Mutanabbi « Insomnie sur insomnie, et ceux qui me ressemblent sont insomniaques »", ur: "المتنبی کا قول 'بے خوابی پر بے خوابی اور مجھ جیسا بے خواب'" }
summary:
  ar: "قصيدة من الكامل على روي القاف، يقدّم لها الديوان بأن المتنبي قالها في صباه يمدح أبا المنتصر شجاع بن محمد بن أوس بن معن الرضى الأزدي {{cite:diwan-mutanabbi-dar-beirut-1983 p.28}}."
  en: "An ode in the kamil metre on the rhyme qaf; the edition introduces it as composed in the poet's youth in praise of Abu al-Muntasir Shuja' ibn Muhammad ibn Aws ibn Ma'n al-Rida al-Azdi {{cite:diwan-mutanabbi-dar-beirut-1983 p.28}}."
  es: "Una oda en metro kamil sobre la rima qaf; la edición la presenta como compuesta en la juventud del poeta en alabanza de Abu al-Muntasir Shuja' ibn Muhammad ibn Aws ibn Ma'n al-Rida al-Azdi {{cite:diwan-mutanabbi-dar-beirut-1983 p.28}}."
  fr: "Une ode en mètre kamil sur la rime qaf; l'édition la présente comme composée dans la jeunesse du poète en l'honneur d'Abu al-Muntasir Shuja' ibn Muhammad ibn Aws ibn Ma'n al-Rida al-Azdi {{cite:diwan-mutanabbi-dar-beirut-1983 p.28}}."
  ur: "شاعری قاف پر کامل میٹر میں ایک اوڈ؛ ایڈیشن میں ابو المنتصر شجاع ابن محمد بن اوس بن معن الرضا العزدی کی تعریف میں شاعر کی جوانی میں تحریر کردہ اس کا تعارف پیش کیا گیا ہے۔"
