label: { ar: "قصيدة المتنبي «أرق على أرق ومثلي يأرق»", en: "Al-Mutanabbi's ode 'Sleeplessness upon sleeplessness, and the like of me is sleepless'" }
summary:
  ar: "قصيدة من الكامل على روي القاف، يقدّم لها الديوان بأن المتنبي قالها في صباه يمدح أبا المنتصر شجاع بن محمد بن أوس بن معن الرضى الأزدي {{cite:diwan-mutanabbi-dar-beirut-1983 p.28}}."
  en: "An ode in the kamil metre on the rhyme qaf; the edition introduces it as composed in the poet's youth in praise of Abu al-Muntasir Shuja' ibn Muhammad ibn Aws ibn Ma'n al-Rida al-Azdi {{cite:diwan-mutanabbi-dar-beirut-1983 p.28}}."
