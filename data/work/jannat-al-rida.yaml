label: { ar: "جنة الرضى في التسليم لما قدر الله وقضى", en: "Jannat al-Rida fi al-Taslim lima Qadar Allah wa-Qada", ur: "جنت الرضا فی التسلیم لما قدر اللہ وقد", tr: "Tanrı'nın emrettiği ve emrettiği şeylere boyun eğmenin verdiği tatmin cenneti", id: "Surga kepuasan dalam penyerahan pada apa yang telah ditetapkan dan ditetapkan Tuhan" }
summary:
  ar: "كتاب الرئيس القاضي أبي يحيى ابن عاصم في التسليم للقضاء على ضياع الأندلس، صور فيه أن النصارى لم يستولوا على بلاد جامعة إلا بعد تمكينهم لأسباب الخلاف واجتهادهم في وقوع الافتراق بين المسلمين وتضريبهم بالمكر والحديعة بين ملوك الجزيرة وتحريشهم بين حماتها في الفتن المبرة {cite:nafh-tib-maqqari p. 512}."
  en: "Abu Yahya ibn Asim's consolatory work on al-Andalus's loss — its famous thesis that the Christians took no whole land until they had first sown division among its kings and protectors {cite:nafh-tib-maqqari p. 512}."
  es: "La obra consoladora de Abu Yahya ibn Asim sobre la pérdida de al-Ándalus —su famosa tesis de que los cristianos no tomaron ninguna tierra entera hasta que primero sembraron la división entre sus reyes y protectores {cite:nafh-tib-maqqari p. 512}."
  fr: "L'œuvre consolatrice d'Abu Yahya ibn Asim sur la perte d'al-Andalus — sa célèbre thèse selon laquelle les chrétiens n'ont pris aucun territoire entier avant d'avoir d'abord semé la division parmi ses rois et protecteurs {cite:nafh-tib-maqqari p. 512}."
  ur: "ابو یحییٰ بن عاصم کا اندلس کے نقصان پر تسلی کا کام - اس کا مشہور مقالہ کہ عیسائیوں نے اس وقت تک پوری زمین نہیں لی جب تک کہ وہ اس کے بادشاہوں اور محافظوں میں تقسیم نہ کر لیں۔ 512}۔"
  tr: "Baş yargıç Ebu Yahya bin Asim'in Endülüs'ün kaybını ortadan kaldırmak için teslim olmasıyla ilgili kitabı, Hristiyanların birleşik bir toprak ele geçirmediklerini, ancak Müslümanlar arasında anlaşmazlık ve bölme çabalarını, yarımadanın kralları arasında aldatma ve hileleri yaratma çabalarını ve koruyucularını doğru isyanlarda kışkırttıktan sonra ele geçirdiklerini anlatır {cite:nafh-tib-maqqari, s. 512}."
  id: "Buku oleh hakim utama Abu Yahya ibn Asim tentang penyerahan diri untuk menghilangkan kehilangan al-Andalus, di mana ia menggambarkan bahwa orang Kristen tidak merebut tanah yang bersatu kecuali setelah memungkinkan penyebab perselisihan dan upaya mereka menimbulkan perpecahan di antara umat Islam, penipuan dan tipu daya mereka di antara raja-raja semenanjung, serta menghasut pelindung mereka dalam hasutan yang benar {cite:nafh-tib-maqqari, hlm. 512}."
