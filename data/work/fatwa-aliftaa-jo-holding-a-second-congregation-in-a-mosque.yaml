id: work/fatwa-aliftaa-jo-holding-a-second-congregation-in-a-mosque
class: work
kind: fatwa
label: { ar: "إقامة جماعة ثانية في المسجد", en: "Holding a second congregation in a mosque", ur: "مسجد میں دوسری جماعت کرانا" }
summary:
  ar: "سؤال عن إقامة جماعة ثانية في المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يكره تحريها في مسجد الحي الذي له إمام راتب إلا بإذنه، وتجوز الجماعة الثانية والثالثة في المساجد المطروقة كمساجد الأسواق. أجابت الدائرة بأنه يكره تحري إقامة جماعة ثانية في المسجد غير المطروق، كمسجد الحي، إذا كان له إمام راتب، إلا بإذن الإمام، لأن ذلك يورث قدحًا في الإمام وطعنًا فيه. وقالت إن المسجد إن كان مطروقًا كمساجد الأسواق جازت فيه الجماعة الثانية والثالثة، سواء كان له إمام راتب أو لا، وسواء أذن الإمام أو لا، لأن الناس يكثر ورودهم عليه فلا يفهم من تعدد الجماعات قدح في الإمام."
  en: "A question about holding a second congregation in a mosque, in which Jordan's General Iftaa Department answered that it is disliked to deliberately hold one in a neighbourhood mosque with a regular imam unless he permits it, and that second and third congregations are permitted in busy mosques such as those in markets. The Department answered that it is disliked to deliberately hold a second congregation in a mosque that is not a thoroughfare, such as a neighbourhood mosque, when it has a regular imam, unless the imam permits it, because it implies criticism of the imam. It said that in a busy mosque, such as a market mosque, second and third congregations are permitted whether or not it has a regular imam and whether or not the imam permits it, because people come to it in large numbers and several congregations imply no criticism of the imam."
  ur: "مسجد میں دوسری جماعت کرانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ محلے کی مسجد میں جس کا مقرر امام ہو، اس کی اجازت کے بغیر قصداً دوسری جماعت مکروہ ہے، اور بازاروں جیسی گزرگاہ والی مساجد میں دوسری اور تیسری جماعت جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو مسجد گزرگاہ نہ ہو، جیسے محلے کی مسجد، اور اس کا مقرر امام ہو، اس میں امام کی اجازت کے بغیر قصداً دوسری جماعت کرانا مکروہ ہے، کیونکہ اس سے امام پر تنقید کا پہلو نکلتا ہے۔ اس نے کہا کہ اگر مسجد گزرگاہ ہو، جیسے بازاروں کی مساجد، تو اس میں دوسری اور تیسری جماعت جائز ہے، چاہے اس کا مقرر امام ہو یا نہ ہو اور امام اجازت دے یا نہ دے، کیونکہ وہاں لوگ کثرت سے آتے ہیں اور کئی جماعتوں سے امام پر تنقید نہیں سمجھی جاتی۔"
