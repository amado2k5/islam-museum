id: work/fatwa-aliftaa-jo-holding-a-second-congregation-in-a-mosque
class: work
kind: fatwa
label: { ar: "إقامة جماعة ثانية في المسجد", en: "Holding a second congregation in a mosque", ur: "مسجد میں دوسری جماعت کرانا", es: "Celebrar una segunda congregación en una mezquita.", fr: "Organiser une deuxième prière dans une mosquée", tr: "Camide ikinci bir cemaatin düzenlenmesi", id: "Mengadakan jemaat kedua di masjid" }
summary:
  ar: "سؤال عن إقامة جماعة ثانية في المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يكره تحريها في مسجد الحي الذي له إمام راتب إلا بإذنه، وتجوز الجماعة الثانية والثالثة في المساجد المطروقة كمساجد الأسواق. أجابت الدائرة بأنه يكره تحري إقامة جماعة ثانية في المسجد غير المطروق، كمسجد الحي، إذا كان له إمام راتب، إلا بإذن الإمام، لأن ذلك يورث قدحًا في الإمام وطعنًا فيه. وقالت إن المسجد إن كان مطروقًا كمساجد الأسواق جازت فيه الجماعة الثانية والثالثة، سواء كان له إمام راتب أو لا، وسواء أذن الإمام أو لا، لأن الناس يكثر ورودهم عليه فلا يفهم من تعدد الجماعات قدح في الإمام."
  en: "A question about holding a second congregation in a mosque, in which Jordan's General Iftaa Department answered that it is disliked to deliberately hold one in a neighbourhood mosque with a regular imam unless he permits it, and that second and third congregations are permitted in busy mosques such as those in markets. The Department answered that it is disliked to deliberately hold a second congregation in a mosque that is not a thoroughfare, such as a neighbourhood mosque, when it has a regular imam, unless the imam permits it, because it implies criticism of the imam. It said that in a busy mosque, such as a market mosque, second and third congregations are permitted whether or not it has a regular imam and whether or not the imam permits it, because people come to it in large numbers and several congregations imply no criticism of the imam."
  ur: "مسجد میں دوسری جماعت کرانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ محلے کی مسجد میں جس کا مقرر امام ہو، اس کی اجازت کے بغیر قصداً دوسری جماعت مکروہ ہے، اور بازاروں جیسی گزرگاہ والی مساجد میں دوسری اور تیسری جماعت جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو مسجد گزرگاہ نہ ہو، جیسے محلے کی مسجد، اور اس کا مقرر امام ہو، اس میں امام کی اجازت کے بغیر قصداً دوسری جماعت کرانا مکروہ ہے، کیونکہ اس سے امام پر تنقید کا پہلو نکلتا ہے۔ اس نے کہا کہ اگر مسجد گزرگاہ ہو، جیسے بازاروں کی مساجد، تو اس میں دوسری اور تیسری جماعت جائز ہے، چاہے اس کا مقرر امام ہو یا نہ ہو اور امام اجازت دے یا نہ دے، کیونکہ وہاں لوگ کثرت سے آتے ہیں اور کئی جماعتوں سے امام پر تنقید نہیں سمجھی جاتی۔"
  es: "Una pregunta sobre la celebración de una segunda congregación en una mezquita, a la que el Departamento General de Iftaa de Jordania respondió que no es recomendable celebrarla deliberadamente en una mezquita de barrio con un imán titular a menos que este lo permita, y que las segundas y terceras congregaciones están permitidas en mezquitas concurridas, como las de los mercados. El Departamento respondió que no es recomendable celebrar deliberadamente una segunda congregación en una mezquita que no sea una vía principal, como una mezquita de barrio, cuando tiene un imán titular, a menos que este lo permita, porque implica una crítica al imán. Dijo que en una mezquita concurrida, como una mezquita de mercado, las segundas y terceras congregaciones están permitidas independientemente de si tiene o no un imán titular y de si este lo permite o no, porque la gran cantidad de personas que asisten no implica una crítica al imán."
  fr: "Concernant la tenue d'une deuxième prière dans une mosquée, le Département général de la Iftaa en Jordanie a indiqué qu'il est déconseillé d'en organiser une délibérément dans une mosquée de quartier dotée d'un imam titulaire, sauf autorisation de ce dernier. En revanche, les deuxième et troisième prières sont autorisées dans les mosquées très fréquentées, comme celles situées sur les marchés. Le Département a précisé qu'il est déconseillé d'organiser délibérément une deuxième prière dans une mosquée qui n'est pas un lieu de passage, telle qu'une mosquée de quartier, lorsqu'elle dispose d'un imam titulaire, sauf autorisation de ce dernier, car cela pourrait être interprété comme une critique de l'imam. Il a ajouté que dans une mosquée très fréquentée, comme celle d'un marché, les deuxième et troisième prières sont autorisées, qu'il y ait ou non un imam titulaire et que ce dernier les autorise ou non, car la forte fréquentation et la présence de plusieurs prières ne constituent en aucun cas une critique de l'imam."
  tr: "Camide ikinci bir cemaat yapılmasıyla ilgili bir soruya ise, Ürdün Genel Fetva Dairesi, ücretli imamın olduğu mahalle camide ikinci cemaat namazının ancak onun izni olmadan yapılmasının hoş karşılanmadığını, ikinci ve üçüncü cemaatlerin ise pazar camileri gibi yerleşik camilerde izin verildiğini belirtti. Daire, ücretli imamı olan mahalle camisi gibi mahalle camisi gibi bir camide ikinci bir cemaat kurulmasının imamın izni olmadan soruşturulmasının istenmediğini, çünkü bunun imama karşı bir küçültme ve meydan okuma yarattığını belirtti. Cami pazar camileri gibi cemaat camisi ise, ücretli imam olsun ya da olmasın, imamın izni olsun ya da olmasın, ikinci ve üçüncü cemaatlerin mücaiz olduğunu, çünkü insanların sık sık ziyaret ettiğini ve cemaatlerin çokluğunun imamla ilgili bir eşitsizliği anlamadığını belirtti."
  id: "Mengenai mengadakan jamaah kedua di masjid, Departemen Fatwa Umum Yordania menjawab bahwa tidak disukai mengadakan shalat jamaah kedua di masjid lingkungan yang memiliki imam berbayar kecuali dengan izinnya, dan jamaah kedua dan ketiga diperbolehkan di masjid yang sudah mapan seperti masjid pasar. Departemen menjawab bahwa tidak disukai untuk menyelidiki pendirian jamaah kedua di masjid yang bukan masjid di lingkungan sekitar, seperti masjid lingkungan, jika imam tersebut dibayar, kecuali dengan izin imam, karena hal ini menimbulkan penghinaan dan tantangan terhadap imam. Departemen tersebut menyatakan bahwa jika masjid adalah masjid berjamaah seperti masjid pasar, jamaah kedua dan ketiga diperbolehkan, baik ada imam berbayar maupun tidak, dan apakah imam tersebut memiliki izin atau tidak, karena orang sering mengunjunginya, sehingga banyak jamaah tidak memahami perbedaan terhadap imam."
