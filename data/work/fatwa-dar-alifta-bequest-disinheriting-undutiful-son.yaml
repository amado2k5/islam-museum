id: work/fatwa-dar-alifta-bequest-disinheriting-undutiful-son
class: work
kind: fatwa
label: { ar: "حكم الوصية بحرمان وارث بسبب العقوق", en: "A bequest disinheriting an undutiful son", ur: "نافرمان بیٹے کو میراث سے محروم کرنے کی وصیت کا حکم" }
summary:
  ar: "سائل يسأل عن رجل توفي وقد أوصى بحرمان ابنه العاق من الميراث. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن العقوق محرم ومن الكبائر، لكنه لا يُسقط الحقوق، والإرث يدخل في ملك الوارث جبرًا بلا اختيار منه أو من المورّث، فالوصية بحرمانه لا تصح، ويستحق نصيبه ما لم يقم به مانع من موانع الإرث، وعليه أن يتدارك برّ أبيه بعد موته بالاستغفار له والصدقة عنه وصلة رحمه."
  en: "A questioner asks about a man who died after leaving a bequest that his undutiful son be denied inheritance. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that undutifulness to parents is forbidden and a major sin, but it does not cancel rights; inheritance passes to the heir by force of law, without the choice of heir or deceased, so the bequest is invalid and the son takes his share unless one of the recognised impediments to inheritance applies; he should make up for his father after his death by seeking forgiveness for him, giving charity on his behalf and keeping his ties of kinship."
  ur: "ایک سائل اس شخص کے بارے میں پوچھتا ہے جو اپنے نافرمان بیٹے کو میراث سے محروم کرنے کی وصیت کر کے فوت ہوا۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ والدین کی نافرمانی حرام اور کبیرہ گناہ ہے، مگر اس سے حقوق ساقط نہیں ہوتے؛ میراث وارث اور مورث کے اختیار کے بغیر لازمی طور پر وارث کی ملکیت میں آتی ہے، اس لیے محروم کرنے کی وصیت درست نہیں اور بیٹا اپنا حصہ پائے گا جب تک میراث کی کوئی رکاوٹ نہ ہو؛ اسے چاہیے کہ باپ کی وفات کے بعد اس کے لیے استغفار، اس کی طرف سے صدقہ اور صلہ رحمی کے ذریعے کوتاہی کی تلافی کرے۔"
