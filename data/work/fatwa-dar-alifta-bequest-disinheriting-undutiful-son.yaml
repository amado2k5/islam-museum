id: work/fatwa-dar-alifta-bequest-disinheriting-undutiful-son
class: work
kind: fatwa
label: { ar: "حكم الوصية بحرمان وارث بسبب العقوق", en: "A bequest disinheriting an undutiful son", ur: "نافرمان بیٹے کو میراث سے محروم کرنے کی وصیت کا حکم", es: "Un legado que deshereda a un hijo desobediente.", fr: "Un legs déshéritant un fils indigne", tr: "Vasiyetnamenin itaatsizlik nedeniyle varisi elinden alma kararı", id: "Putusan tentang wasiat yang mencabut ahli waris karena ketidakpatuhan" }
summary:
  ar: "سائل يسأل عن رجل توفي وقد أوصى بحرمان ابنه العاق من الميراث. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن العقوق محرم ومن الكبائر، لكنه لا يُسقط الحقوق، والإرث يدخل في ملك الوارث جبرًا بلا اختيار منه أو من المورّث، فالوصية بحرمانه لا تصح، ويستحق نصيبه ما لم يقم به مانع من موانع الإرث، وعليه أن يتدارك برّ أبيه بعد موته بالاستغفار له والصدقة عنه وصلة رحمه."
  en: "A questioner asks about a man who died after leaving a bequest that his undutiful son be denied inheritance. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that undutifulness to parents is forbidden and a major sin, but it does not cancel rights; inheritance passes to the heir by force of law, without the choice of heir or deceased, so the bequest is invalid and the son takes his share unless one of the recognised impediments to inheritance applies; he should make up for his father after his death by seeking forgiveness for him, giving charity on his behalf and keeping his ties of kinship."
  ur: "ایک سائل اس شخص کے بارے میں پوچھتا ہے جو اپنے نافرمان بیٹے کو میراث سے محروم کرنے کی وصیت کر کے فوت ہوا۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ والدین کی نافرمانی حرام اور کبیرہ گناہ ہے، مگر اس سے حقوق ساقط نہیں ہوتے؛ میراث وارث اور مورث کے اختیار کے بغیر لازمی طور پر وارث کی ملکیت میں آتی ہے، اس لیے محروم کرنے کی وصیت درست نہیں اور بیٹا اپنا حصہ پائے گا جب تک میراث کی کوئی رکاوٹ نہ ہو؛ اسے چاہیے کہ باپ کی وفات کے بعد اس کے لیے استغفار، اس کی طرف سے صدقہ اور صلہ رحمی کے ذریعے کوتاہی کی تلافی کرے۔"
  es: "Un consultante pregunta sobre un hombre que falleció tras dejar un legado en el que se estipulaba que a su hijo, por incumplimiento de sus obligaciones, se le negara la herencia. El Dar al-Ifta de Egipto, en una fatwa emitida bajo el Gran Muftí Nazir Ayyad, respondió que el incumplimiento de las obligaciones hacia los padres está prohibido y constituye un pecado grave, pero no anula los derechos; la herencia se transmite al heredero por fuerza de ley, sin que el heredero o el difunto puedan elegirla, por lo que el legado es inválido y el hijo recibe su parte a menos que se aplique alguno de los impedimentos reconocidos para la herencia; debe compensar a su padre después de su muerte pidiendo perdón por él, dando caridad en su nombre y manteniendo sus lazos de parentesco."
  fr: "Un internaute interroge Dar al-Ifta, la cour suprême d'Égypte, dans une fatwa émise sous l'égide du grand mufti Nazir Ayyad, au sujet d'un homme décédé ayant légué un testament stipulant que son fils désobéissant soit déshérité. Il y est répondu que le désobéissance envers ses parents est interdit et constitue un péché majeur, mais qu'elle n'entraîne pas la perte des droits successoraux. L'héritage est transmis de plein droit à l'héritier, sans que celui-ci ou le défunt n'ait son mot à dire. Par conséquent, le testament est invalide et le fils reçoit sa part, sauf si l'un des empêchements reconnus à la succession s'applique. Il lui est conseillé, après le décès de son père, de réparer le tort causé par son testament en implorant son pardon, en faisant l'aumône en son nom et en maintenant les liens de parenté."
  tr: "Bir sorgulayıcı, itaatsiz oğlunun mirasını elinden alması için vasiyet edilen vefat eden bir adam hakkında sorulur. Mısır Dar al-Ifta, Müftü Nazir Ayad'ın verdiği bir fetvada, itaatsizliğin yasak ve büyük bir günah olduğunu, ancak haklardan feragat etmediğini belirtmiştir. Miras, varisin ya da vasiyetin isteğiyle zorla mülkiyetine geçer. Bu nedenle, onu elinden alma vasiyeti geçerli değildir ve miras önündeki herhangi bir engeli yerine getirmedikçe payını almaya haklıdır. Babası öldükten sonra onurunu telafi etmek için af dilemeli, onun adına sadaka vermelidir ve aile bağlarını sürdürmelidir."
  id: "Seorang penanya ditanya tentang seorang pria yang meninggal dan mewariskan warisan kepada putranya yang tidak patuh. Dar al-Ifta Mesir menjawab, dalam fatwa yang dikeluarkan oleh Mufti Nazir Ayad, bahwa ketidaktaatan dilarang dan dosa besar, tetapi tidak melepaskan hak. Warisan jatuh ke bawah harta pewaris secara paksa tanpa pilihan atau wasiat. Oleh karena itu, wasiat untuk mencabut harta tidak sah, dan dia berhak atas bagiannya kecuali dia memenuhi hambatan warisan. Dia harus mengompensasi kehormatan ayahnya setelah kematiannya dengan memohon pengampunan, memberi sedekah atas namanya, dan menjaga ikatan keluarga."
