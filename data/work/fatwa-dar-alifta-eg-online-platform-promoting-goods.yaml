label: { ar: "حكم عمل منصة إلكترونية للترويج للسلع وبيعها", en: "Running an online platform that promotes and sells goods", ur: "سامان کے اشتہار اور فروخت کا آن لائن پلیٹ فارم", es: "Gestionar una plataforma en línea que promociona y vende productos.", fr: "Exploiter une plateforme en ligne qui promeut et vend des produits", tr: "Ürünlerin tanıtımı ve satışı için elektronik bir platform kurulmasına ilişkin karar", id: "Putusan tentang pembentukan platform elektronik untuk mempromosikan dan menjual barang" }
summary:
  ar: "سائل سأل عن إنشاء شركة لمنصات إلكترونية يروَّج من خلالها للسلع وتُباع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21615)⁩ أن ما تقوم به الشركة من إنشاء وتصميم المنصات وبيعها جائز شرعًا إذا لم تعلم ابتداءً استعمال المشتري للعين المبيعة في المحرم على ما فصّل الجواب."
  en: "A questioner asked about a company building online platforms through which goods are promoted and sold. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21615) answered that creating, designing and selling such platforms is lawful provided the buyer is not known from the outset to intend unlawful use of the item — as the answer details."
  ur: "ایک سائل نے ایسی کمپنی کا حکم پوچھا جو سامان کے اشتہار اور فروخت کے لیے آن لائن پلیٹ فارم بناتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21615)⁩ نے جواب دیا کہ یہ کام جائز ہے بشرطیکہ شروع ہی سے معلوم نہ ہو کہ خریدار چیز حرام کام میں استعمال کرے گا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre una empresa que crea plataformas en línea para la promoción y venta de productos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21615) respondió que la creación, el diseño y la venta de dichas plataformas son lícitos siempre que no se sepa desde el principio que el comprador tiene la intención de hacer un uso ilícito del producto, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant une entreprise développant des plateformes en ligne pour la promotion et la vente de produits. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21615) a répondu que la création, la conception et la vente de telles plateformes sont licites à condition que l'acheteur ne soit pas connu dès le départ pour avoir l'intention d'utiliser le produit à des fins illicites – comme le précise la réponse."
  tr: "Bir soru soran kişi, malların tanıtımı ve satıldığı elektronik platformlar için bir şirketin kurulması hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21615), şirketin platformları yaratma, tasarlama ve satma işlemlerinin İslam hukukuna göre izin verildiğini, alıcının Muharrem sırasında satılan ürünü ilk kullanımını bilmemesi halinde izinli olduğunu yanıtladı; bu cevabda detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang pendirian perusahaan platform elektronik yang digunakan untuk mempromosikan dan menjual barang. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21615) menjawab bahwa apa yang dilakukan perusahaan dalam membuat, merancang, dan menjual platform diperbolehkan menurut hukum Islam jika tidak mengetahui penggunaan awal barang yang dijual oleh pembeli selama Muharram, sebagaimana dijelaskan dalam jawaban."
