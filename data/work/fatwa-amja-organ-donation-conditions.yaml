id: work/fatwa-amja-organ-donation-conditions
class: work
kind: fatwa
label: { ar: "ضوابط التبرع بالأعضاء بعد الموت", en: "The conditions of post-mortem organ donation", ur: "موت کے بعد عطیہ اعضاء کی شرائط" }
summary:
  ar: "سأل سائل عن حكم التبرع بالأعضاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82446 بتاريخ 6 سبتمبر 2010)⁩ أنه لا حرج في التبرع بالأعضاء بعد الموت إذا غلب على الظن انتفاع المتبرع له بها وفق المعايير الطبية المتفق عليها بين أهل الاختصاص، بشرط أن يأذن الميت قبل موته أو ورثته بعد موته أو بموافقة ولي أمر المسلمين إن كان المتوفى مجهول الهوية أو لا ورثة له، وقد صدرت بهذا المعنى قرارات المجامع الفقهية وهيئات كبار العلماء في العالم الإسلامي."
  en: "A questioner asked the ruling on organ donation. Dr. Salah al-Sawi (fatwa no. 82446, 6 September 2010) answered that there is no harm in organ donation after death where benefit to the recipient is probable under the medical standards agreed among specialists, provided the deceased consented before death, or his heirs consent after it, or the Muslims' governing authority approves where the deceased is unidentified or heirless — the meaning, he noted, of resolutions issued by the fiqh academies and senior scholarly bodies across the Muslim world."
  ur: "ایک سائل نے عطیہ اعضاء کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82446، 6 ستمبر 2010)⁩ کے مطابق مرنے کے بعد عطیہ جائز ہے بشرط میت یا ورثاء کی اجازت، اور نامعلوم میت میں مسلم حکمران کی اجازت — فقہی مجمعوں کے قراروں کے مطابق۔"
