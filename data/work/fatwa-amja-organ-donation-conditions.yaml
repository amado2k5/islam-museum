id: work/fatwa-amja-organ-donation-conditions
class: work
kind: fatwa
label: { ar: "ضوابط التبرع بالأعضاء بعد الموت", en: "The conditions of post-mortem organ donation", ur: "موت کے بعد عطیہ اعضاء کی شرائط", es: "Condiciones de la donación de órganos post mortem", fr: "Les conditions du don d'organes post-mortem", tr: "Ölüm sonrası organ bağışı düzenlemeleri", id: "Peraturan untuk donor organ setelah kematian" }
summary:
  ar: "سأل سائل عن حكم التبرع بالأعضاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82446 بتاريخ 6 سبتمبر 2010)⁩ أنه لا حرج في التبرع بالأعضاء بعد الموت إذا غلب على الظن انتفاع المتبرع له بها وفق المعايير الطبية المتفق عليها بين أهل الاختصاص، بشرط أن يأذن الميت قبل موته أو ورثته بعد موته أو بموافقة ولي أمر المسلمين إن كان المتوفى مجهول الهوية أو لا ورثة له، وقد صدرت بهذا المعنى قرارات المجامع الفقهية وهيئات كبار العلماء في العالم الإسلامي."
  en: "A questioner asked the ruling on organ donation. Dr. Salah al-Sawi (fatwa no. 82446, 6 September 2010) answered that there is no harm in organ donation after death where benefit to the recipient is probable under the medical standards agreed among specialists, provided the deceased consented before death, or his heirs consent after it, or the Muslims' governing authority approves where the deceased is unidentified or heirless — the meaning, he noted, of resolutions issued by the fiqh academies and senior scholarly bodies across the Muslim world."
  ur: "ایک سائل نے عطیہ اعضاء کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82446، 6 ستمبر 2010)⁩ کے مطابق مرنے کے بعد عطیہ جائز ہے بشرط میت یا ورثاء کی اجازت، اور نامعلوم میت میں مسلم حکمران کی اجازت — فقہی مجمعوں کے قراروں کے مطابق۔"
  es: "Un interlocutor preguntó sobre la normativa relativa a la donación de órganos. El Dr. Salah al-Sawi (fatwa n.º 82446, 6 de septiembre de 2010) respondió que no existe ningún inconveniente en la donación de órganos tras la muerte cuando es probable que el receptor obtenga un beneficio según los estándares médicos acordados entre los especialistas, siempre que el fallecido haya dado su consentimiento antes de morir, o sus herederos lo den después, o la autoridad gobernante musulmana lo apruebe cuando el fallecido no esté identificado o no tenga herederos. Señaló que este es el significado de las resoluciones emitidas por las academias de fiqh y los principales organismos académicos de todo el mundo musulmán."
  fr: "Un internaute a interrogé le Dr Salah al-Sawi sur la question du don d'organes. Il a répondu (fatwa n° 82446, 6 septembre 2010) qu'il n'y a pas d'inconvénient au don d'organes post-mortem lorsqu'un bénéfice pour le receveur est probable selon les normes médicales reconnues par les spécialistes, à condition que le défunt ait donné son consentement avant son décès, ou ses héritiers après, ou que l'autorité musulmane compétente l'approuve lorsque le défunt est non identifié ou sans héritier – ce qui, a-t-il précisé, correspond aux résolutions émises par les académies de jurisprudence islamique et les instances savantes de haut niveau du monde musulman."
  tr: "Bir soru soran organ bağışı kararı hakkında bilgi aldı. Dr. Salah Al-Sawy (6 Eylül 2010 tarihli Fetva No. 82446), bağışçının uzmanlar arasında üzerinde anlaşılan tıbbi standartlara göre fayda sağlama olasılığı yüksek ise, merhumun veya varislerinin ölümünden önce izin vermesi veya kimliği bilinmeyen ya da varisi yoksa Müslüman vasisinin onayıyla ölümden sonra organ bağışında zarar olmadığını yanıtladı. İslam dünyasında fıkıh kurulları ve kıdemli alimler organlarının kararları bu amaçla verilmiştir."
  id: "Seorang penanya menanyakan tentang putusan donor organ. Dr. Salah Al-Sawy (Fatwa No. 82446 tanggal 6 September 2010) menjawab bahwa tidak ada bahaya dalam donor organ setelah kematian jika sangat mungkin donor akan mendapat manfaat sesuai standar medis yang disepakati di antara para spesialis, asalkan almarhum atau ahli warisnya memberikan izin sebelum kematian atau dengan persetujuan wali Muslim jika almarhum memiliki identitas yang tidak diketahui atau tidak memiliki ahli waris. Keputusan dewan yurisprudensi dan badan ulama senior di dunia Islam telah dikeluarkan untuk tujuan ini."
