id: work/fatwa-amja-tamrid-wordings
class: work
kind: fatwa
label: { ar: "صيغ التمريض في نقل الحديث", en: "The wordings of doubt in transmitting hadith", ur: "حدیث بیان کرنے میں تردد کے الفاظ", es: "Las expresiones de duda en la transmisión de hadices", fr: "Les formulations qui suscitent des doutes dans la transmission des hadiths", tr: "Hadis Aktarımında Hemşirelik Formları", id: "Formulir Keperawatan dalam Transmisi Hadis" }
summary:
  ar: "سأل سائل عن الألفاظ التي تذكر في صيغة تمريض الحديث وهل قوله ثبت عن رسول الله كذا منها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78471 بتاريخ 5 أبريل 2009)⁩ أن قوله ثبت عن رسول الله كذا ليست من صيغ التمريض كما هو ظاهر بل هي من صيغ الجزم لأنها تتضمن الالتزام بصحة الحديث فلا يصدر حديثًا بهذا التصدير إلا إذا كان جازمًا بصحته مستيقنًا بها، وأما صيغ التمريض فمثل روي بضم الراء وقيل ونحوه."
  en: "A questioner asked which wordings mark a hadith citation as doubtful, and whether 'such-and-such is established from the Messenger of God' is one. Dr. Salah al-Sawi (fatwa no. 78471, 5 April 2009) answered that 'established from the Messenger' is plainly not a wording of doubt — it is a wording of certainty, implying commitment to the hadith's soundness, so it should preface a report only when one is sure of it; the doubt wordings are like 'it is reported' with a doubled r and 'it is said' and the like."
  ur: "ایک سائل نے حدیث میں تردد اور جزم کے الفاظ پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78471، 5 اپریل 2009)⁩ کے مطابق «ثبت عن رسول اللہ» جزم کا لفظ ہے؛ تردد کے الفاظ جیسے «روی» اور «قيل» ہیں۔"
  es: "Un consultante preguntó qué expresiones indican que una cita de hadiz es dudosa, y si «tal cosa está establecida por el Mensajero de Dios» es una de ellas. El Dr. Salah al-Sawi (fatwa n.º 78471, 5 de abril de 2009) respondió que «establecido por el Mensajero» claramente no es una expresión de duda, sino de certeza, que implica un compromiso con la autenticidad del hadiz, por lo que solo debe preceder a un relato cuando se tiene la certeza de su veracidad; las expresiones de duda son como «se informa» con doble «r» y «se dice», entre otras."
  fr: "Un internaute a demandé quelles formulations indiquent qu'un hadith est douteux, et si l'expression « tel hadith est établi d'après le Messager de Dieu » en fait partie. Le Dr Salah al-Sawi (fatwa n° 78471, 5 avril 2009) a répondu que « établi d'après le Messager » n'est manifestement pas une formulation de doute; c'est une formulation de certitude, impliquant une conviction quant à l'authenticité du hadith. Par conséquent, elle ne devrait précéder un hadith que lorsqu'on en est certain. Les formulations de doute sont par exemple « il est rapporté » (avec un « r » doublé) et « il est dit »."
  tr: "Bir soru soran kişiye, emriyle ilgili olarak bahsedilen sözler ve bu ifadenin Allah'ın Elçisi (bu) tarafından doğrulanıp doğrulanmadığı soruldu. Dr. Salah Al-Sawi (5 Nisan 2009 tarihli 78471 No. Fetva) 'Allah'ın Resulü'nden böyle ve böyle bir şekilde tahsis edilmiştir' ifadesinin görünürde bir rivayet biçimi değil, hadisin özgünlüğüne bağlılığı içerdiği için kesinlik biçimi olduğunu söyledi; bu nedenle bu varsayımla hiçbir hadis yayımlanmaz, ancak kişinin gerçekliğinden emin olup emin değilse yayımlanmaz. Rivayet formları ise 'ra'da damma ile rivayet edilir' gibidir ve söylenir ve böyle devam eder."
  id: "Seorang penanya ditanya tentang kata-kata yang disebutkan dalam bentuk keperawatan, dan apakah pernyataannya disahkan dari Rasulullah (si anu) dari Rasulullah. Dr. Salah Al-Sawi menjawab (Fatwa No. 78471 tanggal 5 April 2009) bahwa pernyataannya 'Telah ditetapkan dari Rasulullah sebagai itu dan itu' bukanlah bentuk riwayat seperti yang terlihat, melainkan bentuk kepastian karena melibatkan kepatuhan pada keaslian hadits tersebut, sehingga tidak ada hadits yang diterbitkan dengan premis ini kecuali seseorang yakin akan keasliannya dan pasti. Adapun bentuk narasi, mereka seperti 'diceritakan dengan damma pada ra', dan diucapkan dan seterusnya."
