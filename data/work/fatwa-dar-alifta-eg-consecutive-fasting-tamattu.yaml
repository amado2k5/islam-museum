label: { ar: "مدى اشتراط التتابع في صوم التمتع والقران بعد الرجوع من الحج", en: "Is consecutiveness required in the fast of tamattu' and qiran after returning?", ur: "تمتع اور قران کے روزوں میں تسلسل کتنا شرط ہے" }
summary:
  ar: "سائل سأل عن اشتراط التتابع في صوم التمتع والقران بعد الرجوع من الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23909)⁩ أنه يجب على المتمتع والقارن الهدي، فإن عجز فصوم ثلاثة أيام في الحج وسبعة إذا رجع، ولا يجب التتابع في الصوم على ما فصّل الجواب."
  en: "A questioner asked whether consecutiveness is required in the fast of tamattu' and qiran after returning from Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23909) answered that the mutamatti' and the qarin owe the hady; if unable, three days fasted during Hajj and seven on returning — and consecutiveness is not obligatory in the fast, as the answer details."
  ur: "ایک سائل نے حج سے لوٹنے کے بعد تمتع اور قران کے روزوں میں تسلسل کی شرط پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23909)⁩ نے جواب دیا کہ متمتع اور قارن پر ہدی لازم ہے؛ عاجز ہو تو حج میں تین دن اور لوٹ کر سات دن روزے، اور روزوں میں تسلسل واجب نہیں، جیسا کہ جواب میں تفصیل ہے۔"
