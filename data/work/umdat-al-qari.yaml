label: { ar: "عمدة القاري شرح صحيح البخاري", en: "'Umdat al-Qari Sharh Sahih al-Bukhari", ur: "عمدۃ القاری شرح صحیح البخاری" }
summary:
  ar: "شرح بدر الدين العيني ⁦(ت 855هـ)⁩ على صحيح البخاري، سماه «عمدة القاري في شرح البخاري»، وذكر أنه ندب إليه في الدولة المؤيدية بعد أن شرح معاني الآثار وبدأ شرح سنن أبي داود؛ ابتدأه سنة 821هـ وأتمه سنة 847هـ، كما تذكر الترجمة المطبوعة مع الكتاب، في إحدى وعشرين مجلدة على تجزئة المؤلف، يتم فيه سياق الحديث، ويعين مواضع تخريجه، ويتكلم في الرجال واللغة والإعراب والمعاني والبيان واستنباط الأحكام ومذاهب الفقهاء، تحت عناوين خاصة {cite:umdat-qari-ilmiyya-2001-v1 p. 15-16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20-22}."
  en: "Badr al-Din al-'Ayni's (d. 855 AH) commentary on Sahih al-Bukhari, which he titled 'Umdat al-Qari fi Sharh al-Bukhari; he says he was moved to write it under the Mu'ayyadi state, after commenting on Ma'ani al-Athar and beginning a commentary on Abu Dawud's Sunan; according to the biography printed with it he began it in 821 and completed it in 847 AH, in twenty-one volumes by the author's division, completing the wording of hadiths al-Bukhari abridged, locating their other occurrences, and treating narrators, language, grammar, rhetoric, the derivation of rulings and the jurists' schools, under separate headings {cite:umdat-qari-ilmiyya-2001-v1 p. 15-16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20-22}."
  ur: "بدر الدین عینی (وفات 855ھ) کی صحیح بخاری کی شرح، جس کا نام انہوں نے «عمدۃ القاری فی شرح البخاری» رکھا؛ وہ کہتے ہیں کہ مؤیدی دور میں انہیں اس کی تحریک ہوئی، جب وہ معانی الآثار کی شرح لکھ چکے اور سنن ابی داود کی شرح شروع کر چکے تھے؛ کتاب کے ساتھ چھپے ترجمے کے مطابق انہوں نے اسے 821ھ میں شروع کیا اور 847ھ میں مکمل کیا، مصنف کی تقسیم پر اکیس جلدوں میں؛ اس میں وہ بخاری کی مختصر کردہ حدیث کا پورا متن لاتے ہیں، اس کے دوسرے مقامات بتاتے ہیں، اور رجال، لغت، اعراب، معانی و بیان، استنباطِ احکام اور فقہاء کے مذاہب پر الگ عنوانات کے تحت کلام کرتے ہیں {cite:umdat-qari-ilmiyya-2001-v1 p. 15-16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20-22}۔"
