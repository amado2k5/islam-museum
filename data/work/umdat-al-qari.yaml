perspectives:
  - tradition: sunni
    id: biography-pro-ayni
    stance: { ar: "للعيني الحظ الأوفر في وفاء دين شرح البخاري", en: "Al-'Ayni has the larger share in discharging the debt of commenting on al-Bukhari", ur: "شرحِ بخاری کا قرض ادا کرنے میں عینی کا حصہ بڑا ہے" }
    summary:
      ar: "الترجمة المطبوعة مع الطبعة: شرح العيني أوسع الشروح نقلاً وتحقيقاً، قليل الإحالة بخلاف ابن حجر، والظاهر عند من أنصف أن للعيني الحظ الأوفر في وفاء الدين الذي ذكره ابن خلدون عن مشايخه."
      en: "The biography printed with the edition: al-'Ayni's commentary is the widest in quotation and verification, and seldom refers the reader elsewhere, unlike Ibn Hajar's; to the fair-minded, it says, al-'Ayni has the larger share in discharging the debt that Ibn Khaldun reported from his teachers."
      ur: "ایڈیشن کے ساتھ چھپا ترجمہ: عینی کی شرح نقل و تحقیق میں سب سے وسیع ہے اور ابن حجر کے برخلاف کم حوالے دیتی ہے؛ اس کے بقول منصف کے نزدیک ابن خلدون کے مشایخ والے قرض کی ادائیگی میں عینی کا حصہ بڑا ہے۔"
    sources: [source/umdat-qari-ilmiyya-2001-v1]
  - tradition: sunni
    id: sakhawi
    stance: { ar: "القائم بذلك ابن حجر", en: "Ibn Hajar is the one who discharged it", ur: "یہ قرض ابن حجر نے ادا کیا" }
    summary:
      ar: "السخاوي، كما تنقل الترجمة: يميل إلى أن القائم بوفاء دين شرح البخاري هو شيخه ابن حجر."
      en: "Al-Sakhawi, as the biography reports: inclines to the view that his teacher Ibn Hajar is the one who discharged the debt of commenting on al-Bukhari."
      ur: "سخاوی، جیسا کہ ترجمہ نقل کرتا ہے: ان کا میلان یہ ہے کہ شرحِ بخاری کا قرض ان کے استاد ابن حجر نے ادا کیا۔"
    sources: [source/umdat-qari-ilmiyya-2001-v1]
  - tradition: sunni
    id: kashf-al-zunun
    stance: { ar: "وفّى الشرحان الدين على حد سواء", en: "Both commentaries discharged it equally", ur: "دونوں شروح نے برابر ادا کیا" }
    summary:
      ar: "صاحب كشف الظنون، كما تنقل الترجمة: حكم للشرحين بوفاء الدين على حد سواء."
      en: "The author of Kashf al-Zunun, as the biography reports: judged that the two commentaries discharged the debt equally."
      ur: "کشف الظنون کے مصنف، جیسا کہ ترجمہ نقل کرتا ہے: دونوں شروح کے حق میں برابر فیصلہ دیا۔"
