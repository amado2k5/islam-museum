id: work/fatwa-amja-do-animals-have-souls
class: work
kind: fatwa
label: { ar: "هل للحيوانات أرواح أم حياة فقط", en: "Do animals have souls or only life", ur: "کیا جانوروں میں روح ہے یا صرف حیات", es: "¿Los animales tienen alma o solo vida?", fr: "Les animaux ont-ils une âme ou seulement la vie ?" }
summary:
  ar: "سأل سائل هل للمخلوقات أرواح أم حياة فقط من السمك الكبير والصغير إلى الفراشة والنملة والدود. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80536 بتاريخ 27 نوفمبر 2009)⁩ بأن يشتغل بما ينفعه ويمس حاجته إليه في عبادته لربه وأن يوفر أوقات المفتين للأسئلة التي تمثل إغاثة علمية."
  en: "A questioner asked whether creatures — big fish and tiny ones, the butterfly, the ant, the worm — have souls or merely life. Dr. Salah al-Sawi (fatwa no. 80536, 27 November 2009) declined the speculative question, counselling him to occupy himself with what benefits him and touches his need in worshipping his Lord, and to spare the muftis' time for questions that constitute scholarly rescue. Recorded as a deferral, not a ruling."
  ur: "ایک سائل نے پوچھا کہ جانوروں میں روح ہے یا محض حیات۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80536، 27 نومبر 2009)⁩ نے اس فرضی سوال کے بجائے مفید علم کی طرف رہنمائی کی۔"
  es: "Un consultante preguntó si las criaturas —peces grandes y pequeños, la mariposa, la hormiga, el gusano— tienen alma o simplemente vida. El Dr. Salah al-Sawi (fatwa n.° 80536, 27 de noviembre de 2009) rechazó la pregunta especulativa, aconsejándole que se ocupara de lo que le beneficia y satisface sus necesidades en la adoración a su Señor, y que no dedicara el tiempo de los muftíes a cuestiones que requieren un análisis profundo. Esta pregunta se registró como una prórroga, no como una resolución."
  fr: "Un internaute a demandé si les créatures – grands et petits poissons, papillon, fourmi, ver – possèdent une âme ou seulement la vie. Le Dr Salah al-Sawi (fatwa n° 80536, 27 novembre 2009) a rejeté cette question spéculative, lui conseillant de se consacrer à ce qui lui est profitable et répond à son besoin d'adorer son Seigneur, et de ne pas solliciter le temps des muftis pour des questions relevant de l'expertise savante. Il s'agit d'un ajournement, et non d'une décision."
