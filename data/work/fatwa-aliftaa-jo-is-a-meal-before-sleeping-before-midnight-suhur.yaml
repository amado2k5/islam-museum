id: work/fatwa-aliftaa-jo-is-a-meal-before-sleeping-before-midnight-suhur
class: work
kind: fatwa
label: { ar: "هل يجزئ السحور قبل النوم قبل منتصف الليل؟", en: "Does a meal before sleeping, before midnight, count as suhur?", ur: "کیا آدھی رات سے پہلے سونے سے قبل کھانا سحری شمار ہوتا ہے؟" }
summary:
  ar: "سؤال عن هل يجزئ السحور قبل النوم قبل منتصف الليل؟، أجابت فيه دائرة الإفتاء العام الأردنية بأن السحور هو الطعام الذي يؤكل بعد منتصف الليل، وكلما قرب من الفجر كان أفضل ما لم يخش طلوع الفجر. أجابت الدائرة بأن السحور هو الطعام الذي يؤكل بعد منتصف الليل ليتقوى به المسلم على الصيام، وكلما قرب من الفجر كان أفضل. واستندت إلى حديث رواه أحمد في أن الأمة لا تزال بخير ما عجلوا الفطر وأخروا السحور، وقالت إن تأخيره أقرب للتقوي على العبادة. وقالت إن ذلك ما لم يخش طلوع الفجر، فإن تردد في بقاء الليل فالأفضل ترك السحور، واستندت إلى حديث رواه الترمذي في ترك ما يريب إلى ما لا يريب."
  en: "A question about does a meal before sleeping, before midnight, count as suhur?, in which Jordan's General Iftaa Department answered that suhur is food eaten after midnight, and that the nearer it is to dawn the better, as long as one does not fear dawn has broken. The Department answered that suhur is food eaten after midnight so that a Muslim is strengthened for the fast, and that the nearer it is to dawn the better. It relied on a hadith reported by Ahmad that the community remains in good as long as it hastens breaking the fast and delays suhur, and said that delaying it gives more strength for worship. It said this holds as long as one does not fear that dawn has broken; if one is unsure whether night remains, it is better to leave suhur, relying on a hadith reported by al-Tirmidhi about leaving what causes doubt for what does not."
  ur: "کیا آدھی رات سے پہلے سونے سے قبل کھانا سحری شمار ہوتا ہے؟ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سحری وہ کھانا ہے جو آدھی رات کے بعد کھایا جائے، اور جتنا فجر کے قریب ہو اتنا بہتر ہے، جب تک فجر طلوع ہونے کا خوف نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ سحری وہ کھانا ہے جو آدھی رات کے بعد کھایا جائے تاکہ مسلمان روزے کے لیے قوت حاصل کرے، اور جتنا فجر کے قریب ہو اتنا بہتر ہے۔ اس نے احمد کی روایت کردہ ایک حدیث پر انحصار کیا کہ امت اس وقت تک خیر پر رہے گی جب تک افطار میں جلدی اور سحری میں تاخیر کرے، اور کہا کہ تاخیر عبادت کے لیے زیادہ قوت کا باعث ہے۔ اس نے کہا کہ یہ اس وقت ہے جب فجر طلوع ہونے کا خوف نہ ہو؛ اگر رات باقی ہونے میں شک ہو تو سحری چھوڑ دینا بہتر ہے، اور شک والی چیز چھوڑ کر بے شک چیز اختیار کرنے کے بارے میں ترمذی کی روایت کردہ حدیث پر انحصار کیا۔"
