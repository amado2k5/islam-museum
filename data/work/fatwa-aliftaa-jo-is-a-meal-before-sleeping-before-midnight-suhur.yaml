id: work/fatwa-aliftaa-jo-is-a-meal-before-sleeping-before-midnight-suhur
class: work
kind: fatwa
label: { ar: "هل يجزئ السحور قبل النوم قبل منتصف الليل؟", en: "Does a meal before sleeping, before midnight, count as suhur?", ur: "کیا آدھی رات سے پہلے سونے سے قبل کھانا سحری شمار ہوتا ہے؟", es: "¿Se considera suhur la comida que se toma antes de dormir, antes de medianoche?", fr: "Un repas pris avant de dormir, avant minuit, compte-t-il comme suhur ?", tr: "Uyku öncesi suhur gece yarısından önce geçerli mi?", id: "Apakah suhoor sebelum tidur masih berlaku sebelum tengah malam?" }
summary:
  ar: "سؤال عن هل يجزئ السحور قبل النوم قبل منتصف الليل؟، أجابت فيه دائرة الإفتاء العام الأردنية بأن السحور هو الطعام الذي يؤكل بعد منتصف الليل، وكلما قرب من الفجر كان أفضل ما لم يخش طلوع الفجر. أجابت الدائرة بأن السحور هو الطعام الذي يؤكل بعد منتصف الليل ليتقوى به المسلم على الصيام، وكلما قرب من الفجر كان أفضل. واستندت إلى حديث رواه أحمد في أن الأمة لا تزال بخير ما عجلوا الفطر وأخروا السحور، وقالت إن تأخيره أقرب للتقوي على العبادة. وقالت إن ذلك ما لم يخش طلوع الفجر، فإن تردد في بقاء الليل فالأفضل ترك السحور، واستندت إلى حديث رواه الترمذي في ترك ما يريب إلى ما لا يريب."
  en: "A question about does a meal before sleeping, before midnight, count as suhur?, in which Jordan's General Iftaa Department answered that suhur is food eaten after midnight, and that the nearer it is to dawn the better, as long as one does not fear dawn has broken. The Department answered that suhur is food eaten after midnight so that a Muslim is strengthened for the fast, and that the nearer it is to dawn the better. It relied on a hadith reported by Ahmad that the community remains in good as long as it hastens breaking the fast and delays suhur, and said that delaying it gives more strength for worship. It said this holds as long as one does not fear that dawn has broken; if one is unsure whether night remains, it is better to leave suhur, relying on a hadith reported by al-Tirmidhi about leaving what causes doubt for what does not."
  ur: "کیا آدھی رات سے پہلے سونے سے قبل کھانا سحری شمار ہوتا ہے؟ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سحری وہ کھانا ہے جو آدھی رات کے بعد کھایا جائے، اور جتنا فجر کے قریب ہو اتنا بہتر ہے، جب تک فجر طلوع ہونے کا خوف نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ سحری وہ کھانا ہے جو آدھی رات کے بعد کھایا جائے تاکہ مسلمان روزے کے لیے قوت حاصل کرے، اور جتنا فجر کے قریب ہو اتنا بہتر ہے۔ اس نے احمد کی روایت کردہ ایک حدیث پر انحصار کیا کہ امت اس وقت تک خیر پر رہے گی جب تک افطار میں جلدی اور سحری میں تاخیر کرے، اور کہا کہ تاخیر عبادت کے لیے زیادہ قوت کا باعث ہے۔ اس نے کہا کہ یہ اس وقت ہے جب فجر طلوع ہونے کا خوف نہ ہو؛ اگر رات باقی ہونے میں شک ہو تو سحری چھوڑ دینا بہتر ہے، اور شک والی چیز چھوڑ کر بے شک چیز اختیار کرنے کے بارے میں ترمذی کی روایت کردہ حدیث پر انحصار کیا۔"
  es: "Una pregunta sobre si una comida antes de dormir, antes de la medianoche, cuenta como suhur, a la que el Departamento General de Iftaa de Jordania respondió que el suhur es la comida que se toma después de la medianoche, y que cuanto más cerca del amanecer, mejor, siempre que no se tema que haya amanecido. El Departamento respondió que el suhur es la comida que se toma después de la medianoche para que un musulmán se fortalezca para el ayuno, y que cuanto más cerca del amanecer, mejor. Se basó en un hadiz narrado por Ahmad que dice que la comunidad permanece en buena posición siempre que acelere la ruptura del ayuno y retrase el suhur, y dijo que retrasarlo da más fuerza para la adoración. Dijo que esto es válido siempre que no se tema que haya amanecido; si uno no está seguro de si aún es de noche, es mejor omitir el suhur, basándose en un hadiz narrado por al-Tirmidhi sobre dejar lo que causa duda por lo que no."
  fr: "Une question portait sur la validité du suhur, le repas pris avant minuit. Le Département général de la Iftaa de Jordanie a répondu que le suhur désigne les aliments consommés après minuit, et que plus on se rapproche de l'aube, mieux c'est, à condition de ne pas craindre que le jour ne soit déjà levé. Le Département a expliqué que le suhur est un repas pris après minuit afin de fortifier le musulman pour le jeûne, et que plus on se rapproche de l'aube, mieux c'est. Il s'est appuyé sur un hadith rapporté par Ahmad selon lequel la communauté demeure en bonne foi tant qu'elle hâte la rupture du jeûne et retarde le suhur, et que ce retard renforce la ferveur pour la prière. Il a précisé que cela reste valable tant qu'on ne craint pas que le jour ne soit déjà levé; en cas de doute sur la durée de la nuit, il est préférable de ne pas prendre le suhur, conformément à un hadith rapporté par al-Tirmidhi qui recommande de s'abstenir de ce qui suscite le doute pour ce qui n'en suscite pas."
  tr: "Gece yarısından önce uyumadan önce sahur yeterli mi? Ürdün Genel Fetva Dairesi, sübürün gece yarısından sonra yenmesi olduğunu ve şafak vakti ne kadar yakınsa, şafak sökmesinden korkmamak için daha iyi olduğunu söyledi. Daire, saurur'un gece yarısından sonra Müslümanı oruçta güçlendirmek için yenen yiyecek olduğunu ve şafağa ne kadar yakın olursa o kadar iyi olduğunu söyledi. Ahmed'in rivayet ettiği bir hadise dayanarak, ümmenin orucu hızla bozup sahuru ertelediği sürece hala iyi olduğunu ve ertelemenin ibadet için takvaya daha yakın olduğunu belirtti. Şafak korkusu olmadığı sürece bunun geçerli olduğunu; gece kalmakta tereddüt eden kişinin suhürünü bırakmanın daha iyi olduğunu söyledi. Ayrıca el-Tirmidi'nin şüpheli ve belirsiz olanı kaçınmakla ilgili bir hadise dayandı."
  id: "Pertanyaan apakah suhoor sebelum tidur sebelum tengah malam sudah cukup? Departemen Fatwa Jenderal Yordania menjawab bahwa suhoor adalah makanan yang dimakan setelah tengah malam, dan semakin dekat fajar, semakin baik kecuali takut fajar akan muncul. Departemen menjawab bahwa suhoor adalah makanan yang dimakan setelah tengah malam untuk memperkuat Muslim dalam puasa, dan semakin dekat dengan fajar, semakin baik. Mereka mengandalkan hadits yang diceritakan oleh Ahmad yang menyatakan bahwa umatlah masih baik-baik saja selama mereka mempercepat berbuka puasa dan menunda suhoor, dan mengatakan bahwa menundanya lebih dekat dengan kesalehan dalam ibadah. Mereka mengatakan bahwa ini selama tidak ada rasa takut akan fajar; jika seseorang ragu untuk bermalam, lebih baik meninggalkan suhoor. Mereka juga mengandalkan hadits yang diceritakan oleh al-Tirmidhi tentang menghindari apa yang diragukan dan tidak pasti."
