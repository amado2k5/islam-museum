label: { ar: "رياض الصالحين", en: "Riyad al-Salihin" }
summary:
  ar: "كتاب النووي في الترغيب والترهيب والآداب، رتبه على أبواب تتصل بالسلوك، وجمع فيه أحاديث مختارة من كتب السنة. تعده دائرة المعارف الإسلامية من مؤلفاته التي ترجع إلى ميوله الصوفية وتؤرخ الفراغ منه بسنة 670هـ/1271-1272م. وتسجل طبعتي مكة 1302 و1312 هجرية وترجمة إنجليزية لمحمد ظفر الله خان، لندن 1975م."
  en: "al-Nawawi's selection of hadiths on conduct, encouragement and warning, arranged in chapters on moral and devotional life. The Encyclopaedia of Islam lists it among the works owing to his mystical tendencies and dates its completion to 670/1271-2. It records Mecca editions of 1302 and 1312 and an English translation by Muhammad Zafrulla Khan, London 1975."
  ur: "نووی کی کتاب جس میں سلوک، ترغیب اور تنبیہ سے متعلق احادیث ابواب کی صورت میں مرتب ہیں۔ انسائیکلوپیڈیا آف اسلام اسے ان تصانیف میں شمار کرتا ہے جو نووی کے صوفیانہ رجحان کا نتیجہ ہیں، اور اس کی تکمیل 670ھ/1271-1272ء بتاتا ہے۔ وہ مکہ کی 1302ھ اور 1312ھ کی طباعتیں اور محمد ظفر اللہ خان کا انگریزی ترجمہ، لندن 1975ء، درج کرتا ہے۔"
