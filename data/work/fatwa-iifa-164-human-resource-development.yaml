id: work/fatwa-iifa-164-human-resource-development
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 164 (18/2) بشأن تنمية الموارد البشرية في العالم الإسلامي", en: "IIFA resolution 164 (18/2) on human resource development in the Islamic world", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 164 (18/2): اسلامی دنیا میں انسانی وسائل کی ترقی", es: "Resolución 164 (18/2) de la IIFA sobre el desarrollo de los recursos humanos en el mundo islámico.", fr: "Résolution 164 (18/2) de l'IIFA sur le développement des ressources humaines dans le monde islamique" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف الموارد البشرية بأنها طاقات الإنسان وخبراته باعتباره محور عملية التنمية والمكلف بمسؤولية الاستخلاف في الأرض، وقرر أن المفهوم الإسلامي لتنميتها ينطلق من أن عمارة الأرض لا تتم إلا بإعداد الإنسان القادر بكفاية وتأهيله وإطلاق طاقاته من الجوانب الجسمية والعقلية والنفسية والروحية، وأن التنمية الشاملة لا تتحقق إلا بالتربية والتعليم والتأهيل. وتناول في بنوده وسائل ذلك ومجالاته وأوصى الدول والمؤسسات بسياسات التنمية البشرية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined human resources as the human being's capacities and experience as the pivot of development, charged with the responsibility of stewardship on earth; resolved that the Islamic concept of developing them starts from building the capable human in bodily, mental, psychological and spiritual dimensions; and held that comprehensive development comes only through upbringing, education and training — with clauses on means and fields and recommendations to states and institutions on human-development policy."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے انسانی وسائل کی تعریف کی: انسان کی صلاحیتیں اور تجربہ، بطور محورِ ترقی، جو زمین میں خلافت کی ذمہ داری کا مکلف ہے؛ اور فیصلہ دیا کہ اسلامی تصور میں ان کی ترقی قابل انسان کی جسمانی، ذہنی، نفسیاتی اور روحانی جہتوں میں تیاری سے شروع ہوتی ہے اور جامع ترقی صرف تربیت، تعلیم اور اہلیت سے حاصل ہوتی ہے — اس کے بعد وسائل اور شعبے اور ریاستوں و اداروں کے لیے پالیسی سفارشات۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Definió los recursos humanos como las capacidades y la experiencia del ser humano como el eje del desarrollo, con la responsabilidad de administrarlos en la tierra; resolvió que el concepto islámico de desarrollarlos comienza con la formación del ser humano capaz en las dimensiones corporal, mental, psicológica y espiritual; y sostuvo que el desarrollo integral solo se logra mediante la crianza, la educación y la capacitación, con cláusulas sobre medios y ámbitos, y recomendaciones a los estados e instituciones sobre políticas de desarrollo humano."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, 9-14 juillet 2007). Elle définit les ressources humaines comme l'ensemble des capacités et de l'expérience de l'être humain, pilier du développement, investi de la responsabilité de leur gestion sur Terre; elle affirme que la conception islamique du développement humain commence par la formation d'un être humain capable sur les plans physique, mental, psychologique et spirituel; et elle soutient que le développement intégral ne peut s'accomplir que par l'éducation, l'instruction et la formation – assortie de dispositions relatives aux moyens et aux domaines d'intervention, ainsi que de recommandations aux États et aux institutions concernant la politique de développement humain."
