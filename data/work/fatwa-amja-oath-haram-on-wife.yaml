id: work/fatwa-amja-oath-haram-on-wife
class: work
kind: fatwa
label: { ar: "الحلف بالحرام على الزوجة", en: "Swearing by 'haram' over one's wife — zihar or oath expiation", ur: "بیوی پر حرام کی قسم — ظہار یا کفارہ", es: "Jurar por 'haram' sobre la esposa — zihar o juramento de expiación", fr: "Jurer par « haram » sur sa femme — zihar ou expiation par serment", tr: "Kadına yasak olanı yemin etmek", id: "Bersumpah demi yang terlarang pada istri" }
summary:
  ar: "سأل سائل أنه حلف بالحرام على زوجته ألا يذهب إلى بيت أهله إلا مرة واحدة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77408 بتاريخ 11 يناير 2009)⁩ أنه في حالته إن كان يريد تحريم زوجته عليه إذا فعل الأمر فعليه كفارة ظهار تحرير رقبة فإن لم يجد فصيام شهرين متتابعين فإن لم يستطع فإطعام ستين مسكينًا، وإن كان لا يريد تحريمها وإنما يريد منعها من الفعل وأنه محرم عليه وعليها ألا تفعله ففيه كفارة يمين إطعام عشرة مساكين قوت يوم أو ليلة أو كسوتهم، ومرد الأمر إلى نيته ويعلم أن الأمور مبناها على غلبة الظن فيعمل بما غلب على ظنه وما وراء ذلك عفو بإذن الله."
  en: "A questioner had sworn by 'haram' on his wife that he would not go to his family's house except once. Dr. Salah al-Sawi (fatwa no. 77408, 11 January 2009) answered that in his case, if he meant to render his wife forbidden to himself upon the act, he owes the zihar expiation — freeing a slave, or fasting two consecutive months, or feeding sixty poor; if he did not mean her forbidden but meant to bar her from the act — it being haram for him, and she is not to do it — the oath expiation applies: feeding ten poor a day's or night's staple, or clothing them. The matter returns to his intention — affairs rest on the preponderant, so act on what outweighs in his judgment; beyond that is pardon, God willing."
  ur: "ایک سائل نے بیوی پر «حرام» کی قسم کھائی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77408، 11 جنوری 2009)⁩ کے مطابق اگر نیت تحریم کی تھی تو کفارہ ظہار؛ اگر منع کی تو کفارہ یمین — معاملہ نیت پر منحصر ہے۔"
  es: "Un consultante juró por 'haram' sobre su esposa que no iría a la casa de su familia salvo una vez. El Dr. Salah al-Sawi (fatwa n.º 77408, 11 de enero de 2009) respondió que, en su caso, si pretendía que su esposa se sintiera prohibida al realizar el acto, debía realizar la expiación del zihar: liberar a un esclavo, ayunar dos meses consecutivos o alimentar a sesenta pobres. Si no pretendía prohibirle el acto, sino impedirle realizarlo —siendo haram para él y ella no debía hacerlo—, se aplica la expiación del juramento: alimentar a diez pobres con lo básico para un día o una noche, o vestirlos. El asunto vuelve a su intención: los asuntos se basan en lo que prevalece, así que actúe según lo que tenga mayor peso en su juicio; más allá de eso, hay perdón, si Dios quiere."
  fr: "Un homme avait juré, par serment (« haram »), qu'il ne se rendrait chez sa femme qu'une seule fois. Le Dr Salah al-Sawi (fatwa n° 77408, 11 janvier 2009) a répondu que, dans son cas, s'il entendait interdire à sa femme de commettre cet acte, il devait accomplir l'expiation du zihar: affranchir un esclave, jeûner deux mois consécutifs ou nourrir soixante pauvres. S'il ne l'interdisait pas, mais souhaitait l'empêcher de commettre cet acte (haram pour lui, et elle ne devant pas le faire), l'expiation du serment s'appliquait: nourrir dix pauvres de quoi se nourrir pour un jour ou une nuit, ou les vêtir. En fin de compte, tout dépend de son intention: en matière de justice, il convient d'agir selon ce qui prévaut dans son jugement; au-delà, il y a pardon, si Dieu le veut."
  tr: "Bir soru soran, karısına ailesinin evine sadece bir kez gitmeyi yasaklayacağına yemin ettiğini sordu. Dr. Salah Al-Sawy (11 Ocak 2009 tarihli 77408 sayılı Fetva) kendi durumunda, karısının bunu yapmasını yasaklamak istiyorsa, bir köleyi serbest bırakarak zihar (zihar) için kefaret ödemesi gerektiğini söyledi. Eğer bulamazsa, iki ay üst üste oruç tutar. Eğer bulamazsa, altmış fakir kişiyi doyurmak. Eğer onu yasaklamak istemiyorsa ama bunu engelliyorsa ve bu kendisi için yasaksa, o zaman yemin için kefaret on fakir kişiyi bir gün ya da gece doyurmak ya da giydirmektir. Mesele niyetine bağlıdır ve şüphenin üstünlüğüne dayandığını bilir, bu yüzden şüphesine göre hareket eder ve ardından İnşallah affeder."
  id: "Ia bertanya kepada seorang penanya bahwa ia bersumpah melarang istrinya untuk tidak pergi ke rumah keluarganya kecuali sekali. Dr. Salah Al-Sawy menjawab (Fatwa No. 77408 tanggal 11 Januari 2009) bahwa dalam kasusnya, jika ia ingin melarang istrinya melakukannya, ia harus membayar penebusan untuk zihar (zihar) dengan membebaskan seorang budak. Jika tidak menemukannya, maka berpuasa selama dua bulan berturut-turut. Jika ia tidak mampu, maka memberi makan enam puluh orang miskin. Jika ia tidak bermaksud melarangnya tetapi justru mencegahnya, dan itu dilarang baginya dan istrinya tidak boleh melakukannya, maka penebusan sumpah adalah memberi makan sepuluh orang miskin untuk makanan sehari atau semalam atau mengenakan pakaian mereka. Masalah ini tergantung pada niatnya dan ia tahu bahwa masalah didasarkan pada dominasi kecurigaan, jadi ia bertindak sesuai dengan kecurigaannya, dan yang terjadi selanjutnya adalah pengampunan, insya Allah."
