summary:
  ar: "فتوى للمجلس الفقهي لأمريكا الشمالية ⁦(نُشرت أكتوبر 2021)⁩ بشأن إشراك المرأة في المسجد؛ بيّن المجلس أن أعضاءه كانوا يجيبون فرادى عن الأسئلة فقرر إصدار موقف رسمي في المسألة على ما فصّلته الفتوى."
  en: "A fatwa of the Fiqh Council of North America (published October 2021) on the inclusion of women in the masjid; the council noted that members had answered related questions individually and therefore issued a formal position — as the fatwa details."
  ur: "فقہ کونسل آف نارتھ امریکہ کا فتویٰ ⁦(شائع شدہ اکتوبر 2021)⁩ مسجد میں خواتین کی شرکت پر؛ ارکان انفرادی جوابات دیتے تھے اس لیے رسمی موقف جاری کیا گیا — جیسا کہ فتویٰ میں تفصیل ہے۔"
  es: "Una fatwa del Consejo de Jurisprudencia Islámica de Norteamérica (publicada en octubre de 2021) sobre la inclusión de las mujeres en la mezquita; el consejo señaló que los miembros habían respondido individualmente a preguntas relacionadas y, por lo tanto, emitió una postura formal, como se detalla en la fatwa."
