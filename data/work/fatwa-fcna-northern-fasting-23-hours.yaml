label: { ar: "هل يصوم مسلمو الشمال ثلاثًا وعشرين ساعة في اليوم؟", en: "Should Muslims in the North fast 23 hours a day?", ur: "کیا شمالی علاقوں کے مسلمان 23 گھنٹے روزہ رکھیں؟", es: "¿Deben los musulmanes del norte ayunar 23 horas al día?", fr: "Les musulmans du Nord doivent-ils jeûner 23 heures par jour ?", tr: "Kuzeydeki Müslümanlar günde yirmi üç saat oruç tutar mı?", id: "Apakah Muslim utara berpuasa dua puluh tiga jam sehari?" }
summary:
  ar: "سؤال عما إذا كان على المسلمين في المناطق الشمالية صيام ثلاث وعشرين ساعة. أجاب الدكتور جاسر عودة في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2021)⁩ بعرض الآراء المختلفة في أقصى طول للصيام ومراعاة التيسير على أهل تلك المناطق على ما فصّل الجواب."
  en: "A question about whether Muslims in northern regions must fast twenty-three hours a day. Dr. Jasser Auda answered on the Fiqh Council of North America site (published November 2021), surveying the opinions on the maximum fast length with a view to easing the matter for those lands — as the answer details."
  ur: "کیا شمالی علاقوں کے مسلمانوں پر 23 گھنٹے کا روزہ واجب ہے؟ ڈاکٹر جاسر عودہ نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ مختلف آراء کا جائزہ اور سہولت کی رعایت بیان کی۔"
  es: "Una pregunta sobre si los musulmanes de las regiones del norte deben ayunar veintitrés horas al día. El Dr. Jasser Auda respondió en el sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado en noviembre de 2021), recabando opiniones sobre la duración máxima del ayuno con el fin de facilitar la situación en esas tierras, como se detalla en la respuesta."
  fr: "Une question portait sur l'obligation pour les musulmans des régions du nord de l'Amérique du Nord de jeûner vingt-trois heures par jour. Le Dr Jasser Auda y a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication: novembre 2021), en passant en revue les différents avis concernant la durée maximale du jeûne afin d'assouplir les règles pour ces régions, comme le précise sa réponse."
  tr: "Kuzey bölgelerindeki Müslümanların yirmi üç saat oruç tutmaları zorunlu olup olmadığına dair bir soru. Dr. Jasser Ouda, Kuzey Amerika Hukuk Konseyi web sitesinde (Kasım 2021'de yayımlandı) yanıt verdi; bu görüşler, oruçun maksimum süresi hakkında farklı görüşler sundu ve bu bölgelerin halkı için kolaylığı göz önünde bulundurdu; bu konu yanıtında detaylandırıldı."
  id: "Pertanyaan tentang apakah Muslim di wilayah utara diwajibkan berpuasa selama dua puluh tiga jam. Dr. Jasser Ouda menjawab di situs web Dewan Hukum Amerika Utara (diterbitkan November 2021) dengan menyampaikan pendapat berbeda tentang durasi maksimum puasa dan mempertimbangkan kemudahan bagi masyarakat di wilayah tersebut, seperti yang dijelaskan dalam jawabannya."
