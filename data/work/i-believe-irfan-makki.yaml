summary:
  ar: "الألبوم الثاني للمغني والملحن الكندي عرفان مكي، صدر عن أوايكننغ في 28 يوليو 2011 بثلاث عشرة أغنية، منها «I Believe» مع ماهر زين، و«Palestine»، و«لب په آتی» بالأردية؛ وأغنيته الأولى «Waiting for the Call» موضوع شائعة كاذبة نسبتها إلى مايكل جاكسون، كذّبها مكي سنة 2016."
  en: "The Canadian singer-songwriter Irfan Makki's second album, released by Awakening on 28 July 2011 with thirteen tracks, among them 'I Believe' with Maher Zain, 'Palestine' and the Urdu 'Lab Pae Aati'; its opening song, 'Waiting for the Call', became the subject of an internet hoax attributing it to Michael Jackson, which Makki denied in 2016."
  ur: "کینیڈین گلوکار عرفان مکی کا دوسرا البم، 28 جولائی 2011 کو اویکننگ سے تیرہ ٹریکس کے ساتھ جاری ہوا، جن میں ماہر زین کے ساتھ «آئی بیلیو»، «پیلسٹائن» اور اردو «لب پہ آتی» شامل ہیں؛ پہلا گیت «ویٹنگ فار دی کال» ایک جھوٹی افواہ کا موضوع بنا جسے مکی نے 2016 میں رد کیا۔"
