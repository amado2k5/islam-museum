label: { ar: "أبيات قطري بن الفجاءة «لا يركنن أحد إلى الإحجام»", en: "Qatari ibn al-Fuja'a's verses 'Let no one rely on holding back'", es: "Versículos de Ibn al-Fuja'a, Qatari: \"Que nadie se confíe en contenerse\".", fr: "Versets d'Ibn al-Fuja'a du Qatari: « Que personne ne compte sur la retenue »", ur: "قطری ابن الفضعہ کی آیات 'کسی کو پیچھے رہنے پر بھروسہ نہیں کرنا چاہئے'", tr: "Katri ibn el-Faca'a'nın ayetleri: 'Kimse tereddüte bırakılmamalıdır'", id: "Ayat-ayat Qatri ibn al-Faja'a: 'Tidak seorang pun boleh dibiarkan ragu'" }
summary:
  ar: "أبيات في ديوان الحماسة من الكامل على روي الميم، تقدّمها الطبعة بقولها «وقال قطري بن الفجاءة المازني» {{cite:hamasa-abu-tammam-ed-1916 p.38}}."
  en: "Verses in the Diwan al-Hamasa in the kamil metre on the rhyme mim, introduced in the edition with \"Qatari ibn al-Fuja'a al-Mazini said\" {{cite:hamasa-abu-tammam-ed-1916 p.38}}."
  es: "Versos del Diwan al-Hamasa en metro kamil sobre la rima mim, introducidos en la edición con \"Qatari ibn al-Fuja'a al-Mazini dijo\" {{cite:hamasa-abu-tammam-ed-1916 p.38}}."
  fr: "Versets du Diwan al-Hamasa en mètre kamil sur la rime mim, introduits dans l'édition avec « Qatari ibn al-Fuja'a al-Mazini a dit » {{cite:hamasa-abu-tammam-ed-1916 p.38}}."
  ur: "دیوان الحمسہ میں آیات کامل میٹر میں رم میم پر، ایڈیشن میں \"قطری ابن الفضع المزینی نے کہا\" کے ساتھ متعارف کرایا ہے"
  tr: "El-Kamil'den El-Hamasa Diwanı'ndan Mim'in rivayetine dair ayetler, öncesinde şu ifadeyle yer almaktadır: \"Katarlı ibn el-Feceah el-Mazini şöyle dedi\" {{cite:hamasa-abu-tammam-ed-1916 s.38}}."
  id: "Bait-bait dari Diwan Al-Hamasa dari Al-Kamil tentang narasi Mim, didahului oleh edisi dengan pernyataan: \"Qatari ibn al-Faja'ah al-Mazini berkata\" {{cite:hamasa-abu-tammam-ed-1916 hlm.38}}."
