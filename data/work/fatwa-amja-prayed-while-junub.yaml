id: work/fatwa-amja-prayed-while-junub
class: work
kind: fatwa
label: { ar: "صلى وهو جنب", en: "Prayed forgetting a state of janaba — the prayer is repeated", ur: "جنب ہو کر نماز — اعادہ واجب", es: "Oró olvidando un estado de janaba — la oración se repite", fr: "Prier en oubliant un état de janaba — la prière est répétée", tr: "Yanında dua etti", id: "Dia berdoa saat berada di sebelahnya" }
summary:
  ar: "سأل سائل أنه توضأ لصلاة الفجر وصلى ناسيًا أنه على جنابة ثم اغتسل في الصباح. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85472 بتاريخ 10 سبتمبر 2011)⁩ أن من صلى ثم تبين له بعد صلاته أن عليه حدثًا أكبر أو أصغر فالواجب عليه أن يتطهر من هذا الحدث وأن يعيد الصلاة لأن النبي قال لا يقبل الله صلاة بغير طهور، ولا يصح الغسل من الجنابة إلا بنية عند الجمهور قال ابن قدامة في المغني والنية من شرائط الطهارة على ما فصّل الجواب من بيان إعادة الصلاة وكيفية الغسل الصحيح."
  en: "A questioner did wudu for fajr and prayed, forgetting he was in janaba, then washed that morning. Dr. Salah al-Sawi (fatwa no. 85472, 10 September 2011) answered that one who prays then learns after his prayer that a greater or lesser hadath lay on him must purify himself of it and repeat the prayer, per the Prophet's 'God accepts no prayer without purity'; and the janaba-washing is valid only with intention at the majority — Ibn Qudama in al-Mughni counts intention among purification's conditions; the answer details repeating the prayer and the correct washing."
  ur: "ایک شخص نے جنب حالت میں بھول کر فجر پڑھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85472، 10 ستمبر 2011)⁩ کے مطابق نماز دہرانا ہوگی — بغیر طہارت نماز قبول نہیں؛ غسل نیت طلب ہے۔"
  es: "Un consultante realizó la ablución para el fajr y rezó, olvidando que estaba en janaba, y luego se lavó esa mañana. El Dr. Salah al-Sawi (fatwa n.° 85472, 10 de septiembre de 2011) respondió que quien reza y luego se entera de que le pesa un hadath mayor o menor debe purificarse de él y repetir la oración, según el Profeta: \"Dios no acepta ninguna oración sin pureza\"; y el lavado de janaba solo es válido con intención en la mayoría de edad. Ibn Qudama, en al-Mughni, incluye la intención entre las condiciones de purificación; la respuesta detalla la repetición de la oración y el lavado correcto."
  fr: "Un homme a fait ses ablutions (wudu) pour la prière de l'aube (fajr) et a prié, oubliant qu'il était en état d'impureté majeure (janaba). Il s'est ensuite lavé les mains le matin même. Le Dr Salah al-Sawi (fatwa n° 85472, 10 septembre 2011) a répondu que celui qui prie et apprend ensuite qu'une impureté majeure (hadath) pèse sur lui doit s'en purifier et refaire la prière, conformément au hadith du Prophète: « Dieu n'accepte aucune prière sans pureté ». Le lavage des mains après l'impureté majeure n'est valable qu'avec une intention précise, selon la majorité des cas – Ibn Qudama, dans al-Mughni, considère l'intention comme une condition de purification. La réponse détaille la procédure à suivre pour refaire la prière et effectuer les ablutions correctes."
  tr: "Bir soru soran kişiye, Fajr namazı için abdest alıp büyük bir ritüel kirli olduğunu unutarak namaz kılıp namaz kılmadığı ve sabah güsl yapıp namaz kılmadığı soruldu. Dr. Salah Al-Sawi (10 Eylül 2011 tarihli Fetva No. 85472) yanıtladı: Namazdan sonra büyük veya küçük bir kirlilik fark eden kişi bu kirlilikten arınmalı ve namazı tekrarlamalıdır çünkü Peygamber şöyle demiştir: Allah temizlenmeden namaz kabul etmez ve gusl ancak çoğunluğa göre niyetle namaz kabul eder. İbn Qudamah Al-Mughni'de şöyle demiştir ki, niyet arınma koşullarından biridir; bu cevabda namazın tekrarının açıklaması ve doğru ghusl yöntemi hakkında detaylandırılmıştır."
  id: "Seorang penanya ditanya apakah ia melakukan wudhu untuk shalat Fajr dan berdoa sambil lupa bahwa ia sedang dalam ketidakmurnian ritual besar, lalu melakukan ghusl di pagi hari. Dr. Salah Al-Sawi menjawab (Fatwa No. 85472 tanggal 10 September 2011) bahwa siapa pun yang berdoa dan setelah shalatnya menemukan bahwa ia memiliki kotoran minor atau besar, ia harus membersihkan dirinya dari kotoran tersebut dan mengulangi doa tersebut karena Nabi berfirman: Allah tidak menerima shalat tanpa penyucian, dan ghusl tidak berlaku dari janaba kecuali dengan niat menurut mayoritas. Ibn Qudamah berkata dalam Al-Mughni dan niat adalah salah satu syarat penyucian, sebagaimana dijelaskan dalam jawaban mengenai penjelasan mengulangi shalat dan metode ghusl yang benar."
