id: work/fatwa-amja-prayed-while-junub
class: work
kind: fatwa
label: { ar: "صلى وهو جنب", en: "Prayed forgetting a state of janaba — the prayer is repeated", ur: "جنب ہو کر نماز — اعادہ واجب" }
summary:
  ar: "سأل سائل أنه توضأ لصلاة الفجر وصلى ناسيًا أنه على جنابة ثم اغتسل في الصباح. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85472 بتاريخ 10 سبتمبر 2011)⁩ أن من صلى ثم تبين له بعد صلاته أن عليه حدثًا أكبر أو أصغر فالواجب عليه أن يتطهر من هذا الحدث وأن يعيد الصلاة لأن النبي قال لا يقبل الله صلاة بغير طهور، ولا يصح الغسل من الجنابة إلا بنية عند الجمهور قال ابن قدامة في المغني والنية من شرائط الطهارة على ما فصّل الجواب من بيان إعادة الصلاة وكيفية الغسل الصحيح."
  en: "A questioner did wudu for fajr and prayed, forgetting he was in janaba, then washed that morning. Dr. Salah al-Sawi (fatwa no. 85472, 10 September 2011) answered that one who prays then learns after his prayer that a greater or lesser hadath lay on him must purify himself of it and repeat the prayer, per the Prophet's 'God accepts no prayer without purity'; and the janaba-washing is valid only with intention at the majority — Ibn Qudama in al-Mughni counts intention among purification's conditions; the answer details repeating the prayer and the correct washing."
  ur: "ایک شخص نے جنب حالت میں بھول کر فجر پڑھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85472، 10 ستمبر 2011)⁩ کے مطابق نماز دہرانا ہوگی — بغیر طہارت نماز قبول نہیں؛ غسل نیت طلب ہے۔"
