label: { ar: "مجمل اللغة", en: "Mujmal al-Lugha", es: "Mujmal al-Lugha", fr: "Mujmal al-Lugha", ur: "مجمل اللغۃ" }
summary:
  ar: "مجمل اللغة لابن فارس، سمّاه كذلك لأنه أكثر ألفاظاً، كما يقول في مقدمته؛ وتاريخ تأليفه غير معروف على وجه اليقين. ذكر في مقدمته من مصادره الخليل والكسائي وأبا عمرو الشيباني والفراء وأبا عبيدة والأصمعي وأبا زيد الأنصاري وأبا عبيد وابن دريد دون أن يعزو إليهم في المواد. اقتصر مثل الجوهري على الصحيح الشائع. ورتّبه هجائياً بحسب الحرف الأول من الجذر، وهو أول معجم يراعي الترتيب الهجائي في الحرفين الثاني والثالث، في ثمانية وعشرين كتاباً بعدد الحروف، ينقسم كل كتاب ثلاثة أقسام: الثنائي والثلاثي وما زاد."
  en: "Ibn Faris's Mujmal al-Lugha, named, as its preface says, because it holds more words; the date of composition is not known with certainty. The preface names al-Khalil, al-Kisa'i, Abu Amr al-Shaybani, al-Farra', Abu Ubayda, al-Asma'i, Abu Zayd al-Ansari, Abu Ubayd and Ibn Durayd among the authorities, without citing them in the entries. Like al-Jawhari, he kept only common sound words. The order is alphabetical by first radical and the first dictionary to keep alphabetical order in the second and third radicals too, in 28 books by letter, each in three parts: biliteral, triliteral and longer roots."
  es: "El Mujmal al-Lugha de Ibn Faris, llamado así, como dice su prólogo, porque contiene más palabras; la fecha de composición no se conoce con certeza. El prólogo nombra entre las autoridades a al-Jalil, al-Kisa'i, Abu Amr al-Shaybani, al-Farra', Abu Ubayda, al-Asma'i, Abu Zayd al-Ansari, Abu Ubayd e Ibn Durayd, sin citarlos en las entradas. Como al-Jawhari, solo conservó palabras comunes y sanas. El orden es alfabético por el primer radical y es el primer diccionario que mantiene el orden alfabético también en el segundo y el tercero, en 28 libros por letra, cada uno en tres partes: raíces biliterales, triliterales y más largas."
  fr: "Le Mujmal al-Lugha d'Ibn Faris, ainsi nommé, dit sa préface, parce qu'il contient davantage de mots ; la date de composition n'est pas connue avec certitude. La préface cite parmi les autorités al-Khalil, al-Kisa'i, Abu Amr al-Shaybani, al-Farra', Abu Ubayda, al-Asma'i, Abu Zayd al-Ansari, Abu Ubayd et Ibn Durayd, sans les citer dans les entrées. Comme al-Jawhari, il n'a gardé que les mots courants et sains. Le classement est alphabétique selon le premier radical et c'est le premier dictionnaire à tenir l'ordre alphabétique aussi pour le deuxième et le troisième, en 28 livres par lettre, chacun en trois parties : racines biconsonantiques, triconsonantiques et plus longues."
  ur: "ابن فارس کی مجمل اللغۃ، جس کا یہ نام، مقدمے کے مطابق، اس لیے ہے کہ اس میں زیادہ الفاظ ہیں؛ اس کی تالیف کی تاریخ یقینی طور پر معلوم نہیں۔ مقدمہ ماخذ کے طور پر خلیل، کسائی، ابو عمرو شیبانی، فراء، ابو عبیدہ، اصمعی، ابو زید انصاری، ابو عبید اور ابن درید کے نام لیتا ہے مگر مداخل میں ان کا حوالہ نہیں دیتا۔ جوہری کی طرح انہوں نے صرف عام اور صحیح الفاظ رکھے۔ ترتیب پہلے حرفِ اصل کے لحاظ سے حروفِ تہجی کی ہے اور یہ پہلی لغت ہے جس نے دوسرے اور تیسرے حرف میں بھی تہجی ترتیب رکھی، حروف کی تعداد کے مطابق 28 کتب میں، ہر کتاب کے تین حصے: دو حرفی، تین حرفی اور اس سے لمبے مادے۔"
