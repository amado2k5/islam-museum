id: work/fatwa-amja-quran-sortilege
class: work
kind: fatwa
label: { ar: "التطير بالقرآن", en: "Opening the mushaf for guidance — sortilege, not consultation", ur: "مصحف کھول کر فال لینا", es: "Abrir el mushaf para obtener orientación: sortilegio, no consulta.", fr: "Ouvrir le mushaf pour s'orienter — tirage au sort, non consultation", tr: "Kur'an'la oynamak", id: "Bermain dengan Al-Qur'an" }
summary:
  ar: "سأل سائل عن عادته إذا تعرض لمشكلة أن يفتح المصحف عشوائيًا ويأخذ بالآية التي تقع عليها عينه ظانًا أنها جواب الله له. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21852 بتاريخ 16 ديسمبر 2006)⁩ أن قوله من أراد أن يكلم الله دخل في الصلاة لأن المصلي يناجي ربه ومن أراد معرفة ما يريده الله قرأ القرآن لاشتماله على أمره ونهيه فذا حق، وأما التطير بالقرآن على النحو الوارد في السؤال فلا أصل له بل هو من جنس الاستقسام بالأزلام فيكون بدعة من البدع ومنكرًا من المنكرات."
  en: "A questioner described his habit when a problem comes: opening the mushaf at random and taking the verse his eye lands on as God's answer. Dr. Salah al-Sawi (fatwa no. 21852, 16 December 2006) answered that it is true the worshipper converses with his Lord in prayer and finds God's command and prohibition in the Qur'an — but sortilege with the Qur'an in the manner described has no basis; it belongs to the order of divining by arrows, a bid'a among innovations and a wrong among wrongs."
  ur: "ایک سائل نے مصحف کھول کر فال لینے کی عادت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21852، 16 دسمبر 2006)⁩ کے مطابق نماز میں مناجات اور قرآن سے رہنمائی حق ہے مگر فال لینا ازلام کی قسم ہے — بدعت اور منکر۔"
  es: "Un consultante describió su costumbre cuando surge un problema: abrir el Corán al azar y tomar el versículo en el que se posa su mirada como la respuesta de Dios. El Dr. Salah al-Sawi (fatwa n.° 21852, 16 de diciembre de 2006) respondió que es cierto que el creyente conversa con su Señor en la oración y encuentra los mandamientos y prohibiciones de Dios en el Corán, pero adivinar con el Corán de la manera descrita carece de fundamento; pertenece al orden de la adivinación por medio de flechas, una bid'a entre las innovaciones y un error entre los errores."
  fr: "Un homme a décrit son habitude face à un problème: ouvrir le Coran au hasard et considérer le verset sur lequel son regard se pose comme la réponse divine. Le Dr Salah al-Sawi (fatwa n° 21852, 16 décembre 2006) a répondu que, s'il est vrai que le fidèle s'adresse à son Seigneur dans la prière et trouve dans le Coran les commandements et les interdictions divines, la pratique du sortilège coranique telle que décrite est sans fondement; elle s'apparente à la divination par les flèches, constitue une bid'a parmi les innovations et une faute parmi les fautes."
  tr: "Bir soru soran, Mushaf'ı rastgele açıp gözüne düşen ayeti alıp bunun Allah'ın cevabı olduğunu düşünerek alışkanlığı hakkında sorular sorulmuştur. Dr. Salah Al-Sawy (16 Aralık 2006 tarihli 21852 No. Fetva) 'Allah ile konuşmak isteyen herkes' ifadesinin namaz içinde yer aldığını çünkü namaz kılanın Rabbine dua ettiğini cevaplamıştır. Allah'ın ne istediğini bilmek isteyen Kur'an'ı okur çünkü O'nun emri ve yasağını kapsar, bu geçerli bir konudur. Soruda bahsedilen Kur'an'a iftira hiçbir dayanağı yoktur, ancak arkadaşlarıyla yapılan 'siqtis' (siqti') ile aynı niteliktedir, bu yüzden bu bir yenilik ve kınanacak bir eylemdir."
  id: "Seorang penanya ditanya tentang kebiasaannya ketika menghadapi masalah membuka Mushaf secara acak dan mengambil ayat yang jatuh ke matanya, mengira itu adalah jawaban Allah kepadanya. Dr. Salah Al-Sawy menjawab (Fatwa No. 21852 tanggal 16 Desember 2006) bahwa frasa 'Siapa yang ingin berbicara kepada Allah' dimasukkan dalam shalat karena orang yang berdoa sedang memohon kepada Tuhan-Nya. Siapa pun yang ingin tahu apa yang Allah inginkan membaca Al-Qur'an karena mencakup perintah dan larangan-Nya, ini adalah hal yang sah. Adapun fitnah Al-Qur'an seperti yang disebutkan dalam pertanyaan, tidak memiliki dasar tetapi bersifat sama dengan 'siqtis' (siqti') kepada teman-temannya, sehingga itu adalah inovasi dan tindakan yang tercela."
