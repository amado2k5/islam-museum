id: work/fatwa-dar-alifta-eg-revoking-gift-for-ingratitude
class: work
kind: fatwa
label: { ar: "حكم الرجوع في الهبة بدعوى جحود الموهوب له", en: "Reclaiming a gift on the ground of the recipient's ingratitude", ur: "عطیہ وصول کرنے والے کی ناشکری پر ہدیا واپس لینا", es: "Recuperar un regalo por ingratitud del destinatario.", fr: "Récupérer un cadeau en raison de l'ingratitude du destinataire" }
summary:
  ar: "سائل سأل عن الرجوع في هبة أعطاها لصديقه بدعوى جحود الموهوب له. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21507)⁩ أنه ليس للواهب الرجوع في المال الذي وهبه لصديقه ولا يجوز له أن يقهره على إعادة العين دون إرادته ورضاه على ما فصّل الجواب."
  en: "A questioner asked about reclaiming a gift given to a friend on the ground of the recipient's ingratitude. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21507) answered that the giver may not take back the property, nor compel him to return it without his will and consent — as the answer details."
  ur: "ایک سائل نے دوست کو دیے گئے ہدیے کو ناشکری کے عذر سے واپس لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21507)⁩ نے جواب دیا کہ عطیہ دہندہ مال واپس نہیں لے سکتا اور نہ اس کی مرضی کے بغیر چیز واپس لینے پر مجبور کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de reclamar un regalo hecho a un amigo por ingratitud del destinatario. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21507) respondió que quien hizo el regalo no puede recuperarlo ni obligarlo a devolverlo sin su voluntad y consentimiento, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la possibilité de récupérer un cadeau offert à un ami en raison de l'ingratitude de ce dernier. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21507) a répondu que le donateur ne peut ni reprendre le bien, ni contraindre le destinataire à le restituer sans son consentement, comme le précise la réponse."
