label: { ar: "حكم الرجوع في الهبة بدعوى جحود الموهوب له", en: "Reclaiming a gift on the ground of the recipient's ingratitude", ur: "عطیہ وصول کرنے والے کی ناشکری پر ہدیا واپس لینا" }
summary:
  ar: "سائل سأل عن الرجوع في هبة أعطاها لصديقه بدعوى جحود الموهوب له. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21507)⁩ أنه ليس للواهب الرجوع في المال الذي وهبه لصديقه ولا يجوز له أن يقهره على إعادة العين دون إرادته ورضاه على ما فصّل الجواب."
  en: "A questioner asked about reclaiming a gift given to a friend on the ground of the recipient's ingratitude. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21507) answered that the giver may not take back the property, nor compel him to return it without his will and consent — as the answer details."
  ur: "ایک سائل نے دوست کو دیے گئے ہدیے کو ناشکری کے عذر سے واپس لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21507)⁩ نے جواب دیا کہ عطیہ دہندہ مال واپس نہیں لے سکتا اور نہ اس کی مرضی کے بغیر چیز واپس لینے پر مجبور کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
