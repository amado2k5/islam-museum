id: work/fatwa-dar-alifta-eg-blood-on-ihram-garments
class: work
kind: fatwa
label: { ar: "حكم طهارة ملابس الإحرام إذا وقع عليها دم", en: "The purity of ihram garments when blood falls on them", ur: "احرام کے کپڑوں پر خون لگنے کی طہارت", es: "La pureza de las prendas de ihram cuando cae sangre sobre ellas.", fr: "La pureté des vêtements d'ihram lorsqu'ils sont souillés de sang" }
summary:
  ar: "سائل سأل عن طهارة ملابس الإحرام إذا وقع عليها دم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20768)⁩ أنه ينبغي على المحرم المحافظة على نظافة ملابس إحرامه فإن وقع عليها دم من المحرم نفسه وكان يسيرًا فحكمها على ما فصّل الجواب."
  en: "A questioner asked about the purity of ihram garments when blood falls on them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20768) answered that the pilgrim should keep his ihram garments clean; if a little of his own blood falls on them, the ruling is as the answer details."
  ur: "ایک سائل نے احرام کے کپڑوں پر خون لگنے کی طہارت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20768)⁩ نے جواب دیا کہ محرم کو کپڑے صاف رکھنے چاہییں؛ اگر اس کا اپنا تھوڑا خون لگ جائے تو حکم جواب میں ہے۔"
  es: "Un peregrino preguntó sobre la pureza de las vestimentas de ihram cuando les cae sangre. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20768) respondió que el peregrino debe mantener limpias sus vestimentas de ihram; si les cae un poco de su propia sangre, la norma es la que se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant la pureté des vêtements d'ihram souillés de sang. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20768) a répondu que le pèlerin doit maintenir la pureté de ses vêtements d'ihram; si une petite quantité de son propre sang les souille, la règle est celle détaillée dans la réponse."
