label: { ar: "أبيات الحارث بن وعلة الجرمي «قومي هم قتلوا أميم أخي»", en: "al-Harith ibn Wa'la al-Jarmi's verses 'My own people killed Umaym, my brother'", es: "Versos de al-Harith ibn Wa'la al-Jarmi: \"Mi propia gente mató a Umaym, mi hermano\".", fr: "Vers d'al-Harith ibn Wa'la al-Jarmi: « Mon propre peuple a tué Umaym, mon frère »", ur: "حارث بن ولاء الجرمی کی آیات 'میری اپنی قوم نے میرے بھائی امیہ کو قتل کیا'", tr: "Al-Harith ibn Wa'ilah Al-Jurmi'nin ayetleri: \"Halkım, kardeşim Umaym'i öldürdüler\"", id: "Ayat-ayat Al-Harith ibn Wa'ilah Al-Jurmi: \"Kaumku, mereka membunuh Umaym, saudaraku\"" }
summary:
  ar: "أبيات في ديوان الحماسة من الكامل على روي الميم، للحارث بن وعلة الجرمي في قتل قومه أخاه {{cite:hamasa-abu-tammam-ed-1916 p.57-58}}."
  en: "Verses in the Diwan al-Hamasa in the kamil metre on the rhyme mim, by al-Harith ibn Wa'la al-Jarmi on his own people's killing of his brother {{cite:hamasa-abu-tammam-ed-1916 p.57-58}}."
  es: "Versos del Diwan al-Hamasa en metro kamil sobre la rima mim, de al-Harith ibn Wa'la al-Jarmi sobre el asesinato de su hermano por su propia gente {{cite:hamasa-abu-tammam-ed-1916 p.57-58}}."
  fr: "Versets du Diwan al-Hamasa en mètre kamil sur la rime mim, par al-Harith ibn Wa'la al-Jarmi sur le meurtre de son frère par son propre peuple {{cite:hamasa-abu-tammam-ed-1916 p.57-58}}."
  ur: "آیات دیوان الحمسہ میں دیوان الحماسہ ان دی کامل میٹر پر رم میم پر، الحارث ابن ولاء الجرمی کی طرف سے اپنے بھائی کے اپنے لوگوں کے قتل پر"
  tr: "Al-Hamasa Diwanı'ndan Al-Kamil 'ala Rawi' al-Mim'den, kardeşi Al-Harith ibn Wa'ilah Al-Jurmi fi Qalat Qowam tarafından yazılan ayetler {{cite:hamasa-abu-tammam-ed-1916 s.57-58}}."
  id: "Ayat-ayat dari Diwan Al-Hamasa dari Al-Kamil 'ala Rawi' al-Mim, oleh Al-Harith ibn Wa'ilah Al-Jurmi fi Qalat Qowam saudaranya {{cite:hamasa-abu-tammam-ed-1916 hlm.57-58}}."
