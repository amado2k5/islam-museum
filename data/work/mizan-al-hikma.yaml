summary:
  ar: "رسالة عبد الرحمن الخازني في الموازين وعلم الأثقال، ألّفها سنة 515هـ/1121م في مرو لخزانة السلطان سنجر؛ تضم تاريخ الموازين المائية، ووصف ميزان ذي خمس كفف، وجداول أثقال نوعية للمعادن والأحجار والسوائل {cite:khazini-hall-dsb}."
  en: "Al-Khazini's treatise on balances and the science of weights, composed in 515 AH/1121 CE at Merv for Sultan Sanjar's treasury; it contains a history of hydrostatic balances, the description of a five-pan balance, and tables of specific weights for metals, gems and liquids {cite:khazini-hall-dsb}."
  ur: "الخازنی کا میزان اور علم اوزان پر رسالہ، مرو میں سلطان سنجر کے خزانے کے لیے 515ھ/1121ء میں لکھا گیا؛ اس میں آبی میزانوں کی تاریخ، پانچ پلڑوں کے میزان کا بیان اور دھاتوں، جواہر اور مائعات کے اوزانِ نوعی کے جدول ہیں {cite:khazini-hall-dsb}۔"
