id: work/fatwa-islamweb-merit-of-sunan-rawatib
class: work
kind: fatwa
label: { ar: "فضل المحافظة على السنن الرواتب", en: "The merit of keeping the regular sunna prayers", ur: "سننِ مؤکدہ کی پابندی کی فضیلت", es: "El mérito de observar las oraciones sunna regulares", fr: "Le mérite de l'accomplissement régulier des prières sunna", tr: "Sünnet'in ve düzenli uygulamaların erdemi", id: "Kebajikan menjaga Sunnah dan praktik reguler" }
summary:
  ar: "سؤال عن فضل السنن الرواتب. أجاب مركز الفتوى في إسلام ويب بأن لها فضلًا عظيمًا، وذكر حديث أم حبيبة في صحيح مسلم فيمن صلى كل يوم اثنتي عشرة ركعة تطوعًا أنه يُبنى له بيت في الجنة، ورواية الترمذي التي تعدّها: أربعًا قبل الظهر وركعتين بعدها، وركعتين بعد المغرب، وركعتين بعد العشاء، وركعتين قبل الفجر، ثم أورد ما ورد في فضل بعضها."
  en: "A question on the merit of the regular sunna prayers. The IslamWeb fatwa centre answered that their merit is great, citing the hadith of Umm Habiba in Muslim's collection that whoever prays twelve voluntary rak'as each day will have a house built in Paradise, and al-Tirmidhi's version that lists them: four before the noon prayer and two after it, two after the sunset prayer, two after the night prayer and two before the dawn prayer, then gave what is reported on the merit of particular ones."
  ur: "سننِ رواتب کی فضیلت کے بارے میں سوال۔ اسلام ویب کے مرکزِ فتویٰ نے جواب دیا کہ ان کی بڑی فضیلت ہے، اور صحیح مسلم میں ام حبیبہ کی حدیث ذکر کی کہ جو روزانہ بارہ نفل رکعتیں پڑھے اس کے لیے جنت میں گھر بنایا جاتا ہے، اور ترمذی کی روایت جو ان کی تفصیل دیتی ہے: ظہر سے پہلے چار اور بعد دو، مغرب کے بعد دو، عشاء کے بعد دو اور فجر سے پہلے دو، پھر بعض کی خاص فضیلت میں وارد روایات ذکر کیں۔"
  es: "Una pregunta sobre el mérito de las oraciones sunna regulares. El centro de fatwas de IslamWeb respondió que su mérito es grande, citando el hadiz de Umm Habiba en la colección de Muslim que dice que quien rece doce rak'as voluntarias cada día tendrá una casa construida en el Paraíso, y la versión de al-Tirmidhi que las enumera: cuatro antes de la oración del mediodía y dos después de ella, dos después de la oración del atardecer, dos después de la oración de la noche y dos antes de la oración del amanecer, luego dio lo que se informa sobre el mérito de las particulares."
  fr: "Une question portait sur le mérite des prières sunna régulières. Le centre de fatwas IslamWeb a répondu que leur mérite est grand, citant le hadith d'Umm Habiba dans le recueil de Muslim selon lequel quiconque accomplit douze rak'as surérogatoires chaque jour se verra construire une maison au Paradis, et la version d'al-Tirmidhi qui les énumère: quatre avant la prière de midi et deux après, deux après la prière du coucher du soleil, deux après la prière de la nuit et deux avant la prière de l'aube. Le centre a ensuite exposé les mérites rapportés pour chacune de ces prières."
  tr: "Sünnetin erdemi ve düzenli namazlar hakkında bir soru. IslamWeb'deki Fetva Merkezi, büyük bir erdem olduğunu belirtti ve Sahih Müslüman'da Üm Habiba hadisini, her gün gönüllü olarak on iki reket eden birinin cennette bir ev inşa edileceği hakkında anlattı. El-Tirmidi, bunu Dhuhr'den önce dört, ondan sonra iki, Mağrib'ten sonra iki, İşa'dan sonra iki ve Fecr'den önce iki kez anlatır. Sonra bazılarının erdemiyle ilgili rivayetlere değinmiştir."
  id: "Sebuah pertanyaan tentang kebajikan Sunnah dan salat yang rutin. Pusat Fatwa di IslamWeb menjawab bahwa ia memiliki kebajikan besar, dan menyebutkan hadits um Habiba dalam Sahih Muslim tentang seseorang yang berdoa dua belas rak'ah setiap hari dengan sukarela agar sebuah rumah di surga dibangun untuknya. Al-Tirmidhi menceritakannya sebagai empat sebelum Dhuhr, dua setelahnya, dua setelah Maghrib, dua setelah Isha, dan dua sebelum Fajr. Kemudian ia menyebutkan apa yang dilaporkan mengenai kebajikan beberapa di antaranya."
