id: work/fatwa-islamweb-merit-of-sunan-rawatib
class: work
kind: fatwa
label: { ar: "فضل المحافظة على السنن الرواتب", en: "The merit of keeping the regular sunna prayers", ur: "سننِ مؤکدہ کی پابندی کی فضیلت" }
summary:
  ar: "سؤال عن فضل السنن الرواتب. أجاب مركز الفتوى في إسلام ويب بأن لها فضلًا عظيمًا، وذكر حديث أم حبيبة في صحيح مسلم فيمن صلى كل يوم اثنتي عشرة ركعة تطوعًا أنه يُبنى له بيت في الجنة، ورواية الترمذي التي تعدّها: أربعًا قبل الظهر وركعتين بعدها، وركعتين بعد المغرب، وركعتين بعد العشاء، وركعتين قبل الفجر، ثم أورد ما ورد في فضل بعضها."
  en: "A question on the merit of the regular sunna prayers. The IslamWeb fatwa centre answered that their merit is great, citing the hadith of Umm Habiba in Muslim's collection that whoever prays twelve voluntary rak'as each day will have a house built in Paradise, and al-Tirmidhi's version that lists them: four before the noon prayer and two after it, two after the sunset prayer, two after the night prayer and two before the dawn prayer, then gave what is reported on the merit of particular ones."
  ur: "سننِ رواتب کی فضیلت کے بارے میں سوال۔ اسلام ویب کے مرکزِ فتویٰ نے جواب دیا کہ ان کی بڑی فضیلت ہے، اور صحیح مسلم میں ام حبیبہ کی حدیث ذکر کی کہ جو روزانہ بارہ نفل رکعتیں پڑھے اس کے لیے جنت میں گھر بنایا جاتا ہے، اور ترمذی کی روایت جو ان کی تفصیل دیتی ہے: ظہر سے پہلے چار اور بعد دو، مغرب کے بعد دو، عشاء کے بعد دو اور فجر سے پہلے دو، پھر بعض کی خاص فضیلت میں وارد روایات ذکر کیں۔"
