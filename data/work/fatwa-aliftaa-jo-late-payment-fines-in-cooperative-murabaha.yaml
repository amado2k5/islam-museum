id: work/fatwa-aliftaa-jo-late-payment-fines-in-cooperative-murabaha
class: work
kind: fatwa
label: { ar: "غرامات التأخير في مرابحة جمعية تعاونية", en: "Late-payment fines in a cooperative's murabaha financing", ur: "کوآپریٹو کی مرابحہ فنانسنگ میں تاخیر کا جرمانہ", es: "Multas por pago tardío en la financiación murabaha de una cooperativa", fr: "Pénalités de retard de paiement dans le cadre d'un financement murabaha coopératif", tr: "Murabaha Kooperatif Derneği'nde Geç Gecikme Cezaları", id: "Denda Penundaan Terlambat di Asosiasi Koperasi Murabaha" }
summary:
  ar: "سؤال عن غرامات التأخير في مرابحة جمعية تعاونية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم اشتراط غرامات تأخير على المدين، ويجوز اشتراط حلول سائر الأقساط إذا تأخر في بعضها، وللدائن الاستيثاق بالكفلاء أو الرهن. أجابت الدائرة بأنه يحرم على المدين القادر أن يماطل، واستدلت بحديث رواه البخاري معناه أن مطل الغني ظلم، وبحديث رواه أبو داود في أن مماطلة القادر تبيح عرضه وعقوبته، وقالت إن للدائن المطالبة بدينه بالطرق المناسبة دون أن يستوفي زيادة على حقه. وقالت إن فرض غرامات تأخير أو تعويض على المدين مناف لمقصد الشرع، واستشهدت بـ[[passage/quran-2-280|سورة البقرة 2:280]]، ونقلت قرار مجلس الإفتاء الأردني رقم 124 بأن الشرط الجزائي في الديون فاسد مفسد للعقد لأنه من ربا الجاهلية المحرم في [[passage/quran-2-275|سورة البقرة 2:275]]، وأحالت إلى تفسير القرطبي (3/275) في أن العرب كانت تزيد في الدين عند حلوله. وقالت إنه يجوز للدائن أن يشترط حلول سائر الأقساط إذا تأخر المدين، واستدلت بحديث رواه الترمذي في أن المسلمين على شروطهم إلا شرطًا حرم حلالًا أو أحل حرامًا، وبقرار مجمع الفقه الإسلامي رقم 51 (2/6) بجواز اشتراط حلول الأقساط عند التأخر ما دام المدين رضي به عند التعاقد، وبأن للدائن ابتداء أن يستوثق بكفلاء أو رهن."
  en: "A question about late-payment fines in a cooperative's murabaha financing, in which Jordan's General Iftaa Department answered that stipulating late-payment fines on a debtor is forbidden, while stipulating that all remaining instalments fall due if some are late is permitted, and the creditor may secure the debt with guarantors or a pledge. The Department answered that a debtor able to pay is forbidden to delay, citing a hadith narrated by al-Bukhari whose meaning is that a wealthy person's delay is wrongdoing, and one narrated by Abu Dawud that such delay makes him liable to censure and penalty; the creditor may claim his debt by proper means without taking anything beyond his right. It said that imposing late fines or compensation on the debtor runs against the purpose of the Shari'a, citing [[passage/quran-2-280|Surat al-Baqara 2:280]], and quoted resolution no. 124 of Jordan's Iftaa Council that a penalty clause in debts is void and voids the contract, being the riba of the pre-Islamic era forbidden in [[passage/quran-2-275|Surat al-Baqara 2:275]], referring to al-Qurtubi's Tafsir (3/275) on how the Arabs used to increase a debt when it fell due. It said the creditor may stipulate that all remaining instalments fall due if the debtor is late, citing a hadith narrated by al-Tirmidhi that Muslims are bound by their conditions except a condition that forbids the lawful or permits the forbidden, and resolution no. 51 (2/6) of the Islamic Fiqh Academy permitting such acceleration if the debtor agreed to it when contracting; the creditor may also secure the debt from the outset with guarantors or a pledge."
  ur: "کوآپریٹو کی مرابحہ فنانسنگ میں تاخیر کا جرمانہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مقروض پر تاخیر کا جرمانہ شرط کرنا حرام ہے، جبکہ کچھ اقساط میں تاخیر پر باقی تمام اقساط کے فوری واجب ہونے کی شرط جائز ہے، اور قرض خواہ ضامنوں یا رہن سے قرض محفوظ کر سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ادائیگی پر قادر مقروض کے لیے ٹال مٹول حرام ہے، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ مالدار کا ٹال مٹول ظلم ہے، اور ابو داود کی روایت سے کہ ایسا ٹال مٹول اسے ملامت اور سزا کا مستحق بناتا ہے؛ قرض خواہ مناسب طریقوں سے اپنے حق سے زیادہ لیے بغیر قرض کا مطالبہ کر سکتا ہے۔ اس نے کہا کہ مقروض پر تاخیر کا جرمانہ یا معاوضہ عائد کرنا شریعت کے مقصد کے خلاف ہے، اور [[passage/quran-2-280|سورۃ البقرہ 2:280]] کا حوالہ دیا، اور اردنی مجلسِ افتاء کی قرارداد نمبر 124 نقل کی کہ قرضوں میں شرطِ جزائی فاسد اور عقد کو فاسد کرنے والی ہے کیونکہ یہ جاہلیت کا سود ہے جو [[passage/quran-2-275|سورۃ البقرہ 2:275]] میں حرام کیا گیا، اور قرطبی کی تفسیر (3/275) کا حوالہ دیا کہ عرب قرض کی مدت آنے پر اس میں اضافہ کرتے تھے۔ اس نے کہا کہ قرض خواہ یہ شرط لگا سکتا ہے کہ تاخیر کی صورت میں باقی تمام اقساط فوراً واجب ہوں، اور ترمذی کی روایت کردہ حدیث سے استدلال کیا کہ مسلمان اپنی شرطوں کے پابند ہیں سوائے اس شرط کے جو حلال کو حرام یا حرام کو حلال کرے، اور اسلامی فقہ اکیڈمی کی قرارداد نمبر 51 (2/6) سے کہ اگر مقروض عقد کے وقت راضی ہو تو یہ شرط جائز ہے؛ قرض خواہ ابتدا ہی سے ضامن یا رہن کے ذریعے قرض محفوظ کر سکتا ہے۔"
  es: "Una pregunta sobre multas por mora en la financiación murabaha de una cooperativa, en la que el Departamento General de Iftaa de Jordania respondió que estipular multas por mora a un deudor está prohibido, mientras que estipular que todas las cuotas restantes vencen si algunas se retrasan está permitido, y el acreedor puede garantizar la deuda con garantes o una prenda. El Departamento respondió que un deudor que puede pagar tiene prohibido demorarse, citando un hadiz narrado por al-Bujari cuyo significado es que la demora de una persona rica es una mala acción, y uno narrado por Abu Dawud que tal demora lo hace responsable de censura y castigo; el acreedor puede reclamar su deuda por los medios adecuados sin tomar nada más allá de su derecho. Dijo que imponer multas por mora o compensación al deudor va en contra del propósito de la Sharia, citando [[passage/quran-2-280|Surat al-Baqara 2:280]], y citó la resolución n.° El núm. 124 del Consejo de Iftaa de Jordania establece que una cláusula penal en las deudas es nula y anula el contrato, siendo la usura de la era preislámica prohibida en [[passage/quran-2-275|Surat al-Baqara 2:275]], refiriéndose al Tafsir de al-Qurtubi (3/275) sobre cómo los árabes solían aumentar una deuda cuando vencía. Afirma que el acreedor puede estipular que todas las cuotas restantes vencen si el deudor se retrasa, citando un hadiz narrado por al-Tirmidhi que dice que los musulmanes están obligados por sus condiciones excepto una condición que prohíba lo lícito o permita lo ilícito, y la resolución núm. 51 (2/6) de la Academia Islámica de Fiqh que permite tal aceleración si el deudor lo aceptó al contratar; el acreedor también puede garantizar la deuda desde el principio con garantes o una prenda."
  fr: "Une question relative aux pénalités de retard dans le cadre d'un financement murabaha au sein d'une coopérative a été posée par le Département général de l'Iftaa de Jordanie. Ce dernier a statué qu'il est interdit d'imposer des pénalités de retard à un débiteur, mais qu'il est permis de stipuler que toutes les échéances restantes deviennent exigibles en cas de retard. Le créancier peut garantir la dette par des cautions ou un nantissement. Le Département a précisé qu'il est interdit à un débiteur solvable de retarder son paiement, citant un hadith rapporté par al-Bukhari selon lequel le retard de paiement d'une personne riche constitue une faute, et un autre rapporté par Abu Dawud stipulant qu'un tel retard l'expose à un blâme et à une sanction. Le créancier peut recouvrer sa créance par les voies légales sans outrepasser ses droits. Le Département a ajouté qu'imposer des pénalités de retard ou une indemnisation au débiteur est contraire aux principes de la Charia, citant le verset 280 de la sourate Al-Baqara (2:280) et la résolution n° [numéro manquant]. L'avis n° 124 du Conseil de jurisprudence islamique de Jordanie stipule qu'une clause pénale dans un contrat de dette est nulle et entraîne la nullité du contrat, car elle constitue l'usure (riba) de l'époque préislamique interdite par la sourate Al-Baqara (2:275). Cet avis se réfère au Tafsir d'Al-Qurtubi (3/275) qui décrit comment les Arabes avaient coutume d'augmenter le montant d'une dette à son échéance. Le Conseil précise que le créancier peut exiger l'exigibilité immédiate de toutes les échéances restantes en cas de retard de paiement du débiteur, citant un hadith rapporté par Al-Tirmidhi selon lequel les musulmans sont liés par leurs engagements, sauf si une clause interdit le licite ou autorise l'illicite. Il cite également la résolution n° 51 (2/6) de l'Académie de jurisprudence islamique autorisant une telle accélération si le débiteur y a consenti lors de la conclusion du contrat. Le créancier peut par ailleurs garantir la dette dès le départ par des cautions ou un nantissement."
  tr: "Bir kooperatifin Murabaha kentinde geç ödeme cezalarıyla ilgili bir soruda, Ürdün Genel Fetva Dairesi, borçluya gecikme cezası uygulanmasının yasak olduğunu ve bazı taksitlerin gecikmesi durumunda tüm taksitlerin ödenmesini talep etmenin caiz olduğunu yanıtladı. Alacaklı, kefaletlere veya ipoteğe güvenebilir. Daire, borçlunun erteleyebilen bir hadisin ertelemesinin yasak olduğunu, El-Buhari'nin rivayet ettiği ve Ebu Davud'un aktardığı, ehliyetli kişinin ertelemesinin onurunu ve cezasını sağladığını belirttiğini belirtti. Alacaklının hakkından fazlasını tahsil etmeden borcunu uygun yollarla talep edebileceğini belirtti. Borçluya gecikme cezası veya tazminat verilmesinin Şeriatın amacına aykırı olduğunu belirterek, [[pasaj/kuran-2-280|Bakaraya Suresi 2:280]]'i ve Ürdün Fetva Konseyi No. 124'ün borçlardaki ceza şartının geçersiz olduğu ve sözleşmenin İslam öncesi tefecilikten kaynaklandığı ve [[pasaj/kuran-2-275|Bakara Suresi 2:275]'te yasaklandığı kararını alıntılayarak ve El-Kurtubi'nin (3/275) Arapların borçlarının kabulü sırasında arttığına dair yorumuna atıfta bulunulmuştur. Alacaklının borçlu geç kalırsa tüm taksitlerin ödenmesini talep edebileceğini, Al-Tirmidi'nin rivayet ettiği bir hadise atıfta bulunarak, Müslümanların yasak veya izin verilen bir şarta tabi olduğu ve İslam Fıkıh Akademisi No. 51 (2/6) kararına göre, borçlu sözleşme anında bu borçla memnun olduğu sürece taksitlerin gecikmeye bağlı olabileceğini ve alacaklının başlangıçta kefalet veya rehin alabileceğini belirtmiştir."
  id: "Sebuah pertanyaan tentang denda keterlambatan pembayaran di Murabaha atas sebuah koperasi, di mana Departemen Fatwa Umum Yordania menjawab bahwa dilarang menjatuhkan denda keterlambatan pembayaran kepada debitur, dan diperbolehkan untuk meminta pembayaran semua cicilan jika beberapa di antaranya tertunda. Kreditur dapat mengandalkan penjamin atau hipotek. Departemen menjawab bahwa dilarang bagi debitur yang dapat menunda-nunda, mengutip hadits yang diceritakan oleh Al-Bukhari yang berarti orang kaya tidak adil, dan hadis yang diceritakan oleh Abu Dawood yang menyatakan bahwa penundaan oleh orang yang mampu memberikan kehormatan dan hukuman. Hadith tersebut menyatakan bahwa kreditur dapat mengklaim utangnya dengan cara yang sesuai tanpa mengumpulkan lebih dari haknya. Pernyataan tersebut menyatakan bahwa menjatuhkan denda atau kompensasi kepada debitur bertentangan dengan tujuan Syariah, dengan mengutip [[ayat/al-quran-2-280|Surah Al-Baqarah 2:280], dan mengutip keputusan Dewan Fatwa Yordania No. 124 bahwa syarat hukuman utang tidak sah dan membatalkan kontrak karena berasal dari riba pra-Islam yang dilarang dalam [[ayat/al-quran-2-275|Surah Al-Baqarah 2:275], serta merujuk pada interpretasi Al-Qurtubi (3/275) bahwa orang Arab bertambah utang pada saat pengadopsiannya. Dinyatakan bahwa kreditur dapat meminta pembayaran semua cicilan jika debitur terlambat, dengan mengutip hadits yang diceritakan oleh Al-Tirmidhi bahwa umat Muslim tunduk pada syarat kecuali yang dilarang atau dilarang, dan dengan keputusan Akademi Fiqh Islam No. 51 (2/6) bahwa cicilan dapat ditunda selama debitur puas pada saat kontrak, dan kreditur dapat awalnya mendapatkan penjamin atau gadai."
