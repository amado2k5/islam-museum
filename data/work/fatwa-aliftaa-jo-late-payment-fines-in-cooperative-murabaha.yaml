id: work/fatwa-aliftaa-jo-late-payment-fines-in-cooperative-murabaha
class: work
kind: fatwa
label: { ar: "غرامات التأخير في مرابحة جمعية تعاونية", en: "Late-payment fines in a cooperative's murabaha financing", ur: "کوآپریٹو کی مرابحہ فنانسنگ میں تاخیر کا جرمانہ" }
summary:
  ar: "سؤال عن غرامات التأخير في مرابحة جمعية تعاونية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم اشتراط غرامات تأخير على المدين، ويجوز اشتراط حلول سائر الأقساط إذا تأخر في بعضها، وللدائن الاستيثاق بالكفلاء أو الرهن. أجابت الدائرة بأنه يحرم على المدين القادر أن يماطل، واستدلت بحديث رواه البخاري معناه أن مطل الغني ظلم، وبحديث رواه أبو داود في أن مماطلة القادر تبيح عرضه وعقوبته، وقالت إن للدائن المطالبة بدينه بالطرق المناسبة دون أن يستوفي زيادة على حقه. وقالت إن فرض غرامات تأخير أو تعويض على المدين مناف لمقصد الشرع، واستشهدت بـ[[passage/quran-2-280|سورة البقرة 2:280]]، ونقلت قرار مجلس الإفتاء الأردني رقم 124 بأن الشرط الجزائي في الديون فاسد مفسد للعقد لأنه من ربا الجاهلية المحرم في [[passage/quran-2-275|سورة البقرة 2:275]]، وأحالت إلى تفسير القرطبي (3/275) في أن العرب كانت تزيد في الدين عند حلوله. وقالت إنه يجوز للدائن أن يشترط حلول سائر الأقساط إذا تأخر المدين، واستدلت بحديث رواه الترمذي في أن المسلمين على شروطهم إلا شرطًا حرم حلالًا أو أحل حرامًا، وبقرار مجمع الفقه الإسلامي رقم 51 (2/6) بجواز اشتراط حلول الأقساط عند التأخر ما دام المدين رضي به عند التعاقد، وبأن للدائن ابتداء أن يستوثق بكفلاء أو رهن."
  en: "A question about late-payment fines in a cooperative's murabaha financing, in which Jordan's General Iftaa Department answered that stipulating late-payment fines on a debtor is forbidden, while stipulating that all remaining instalments fall due if some are late is permitted, and the creditor may secure the debt with guarantors or a pledge. The Department answered that a debtor able to pay is forbidden to delay, citing a hadith narrated by al-Bukhari whose meaning is that a wealthy person's delay is wrongdoing, and one narrated by Abu Dawud that such delay makes him liable to censure and penalty; the creditor may claim his debt by proper means without taking anything beyond his right. It said that imposing late fines or compensation on the debtor runs against the purpose of the Shari'a, citing [[passage/quran-2-280|Surat al-Baqara 2:280]], and quoted resolution no. 124 of Jordan's Iftaa Council that a penalty clause in debts is void and voids the contract, being the riba of the pre-Islamic era forbidden in [[passage/quran-2-275|Surat al-Baqara 2:275]], referring to al-Qurtubi's Tafsir (3/275) on how the Arabs used to increase a debt when it fell due. It said the creditor may stipulate that all remaining instalments fall due if the debtor is late, citing a hadith narrated by al-Tirmidhi that Muslims are bound by their conditions except a condition that forbids the lawful or permits the forbidden, and resolution no. 51 (2/6) of the Islamic Fiqh Academy permitting such acceleration if the debtor agreed to it when contracting; the creditor may also secure the debt from the outset with guarantors or a pledge."
  ur: "کوآپریٹو کی مرابحہ فنانسنگ میں تاخیر کا جرمانہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مقروض پر تاخیر کا جرمانہ شرط کرنا حرام ہے، جبکہ کچھ اقساط میں تاخیر پر باقی تمام اقساط کے فوری واجب ہونے کی شرط جائز ہے، اور قرض خواہ ضامنوں یا رہن سے قرض محفوظ کر سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ادائیگی پر قادر مقروض کے لیے ٹال مٹول حرام ہے، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ مالدار کا ٹال مٹول ظلم ہے، اور ابو داود کی روایت سے کہ ایسا ٹال مٹول اسے ملامت اور سزا کا مستحق بناتا ہے؛ قرض خواہ مناسب طریقوں سے اپنے حق سے زیادہ لیے بغیر قرض کا مطالبہ کر سکتا ہے۔ اس نے کہا کہ مقروض پر تاخیر کا جرمانہ یا معاوضہ عائد کرنا شریعت کے مقصد کے خلاف ہے، اور [[passage/quran-2-280|سورۃ البقرہ 2:280]] کا حوالہ دیا، اور اردنی مجلسِ افتاء کی قرارداد نمبر 124 نقل کی کہ قرضوں میں شرطِ جزائی فاسد اور عقد کو فاسد کرنے والی ہے کیونکہ یہ جاہلیت کا سود ہے جو [[passage/quran-2-275|سورۃ البقرہ 2:275]] میں حرام کیا گیا، اور قرطبی کی تفسیر (3/275) کا حوالہ دیا کہ عرب قرض کی مدت آنے پر اس میں اضافہ کرتے تھے۔ اس نے کہا کہ قرض خواہ یہ شرط لگا سکتا ہے کہ تاخیر کی صورت میں باقی تمام اقساط فوراً واجب ہوں، اور ترمذی کی روایت کردہ حدیث سے استدلال کیا کہ مسلمان اپنی شرطوں کے پابند ہیں سوائے اس شرط کے جو حلال کو حرام یا حرام کو حلال کرے، اور اسلامی فقہ اکیڈمی کی قرارداد نمبر 51 (2/6) سے کہ اگر مقروض عقد کے وقت راضی ہو تو یہ شرط جائز ہے؛ قرض خواہ ابتدا ہی سے ضامن یا رہن کے ذریعے قرض محفوظ کر سکتا ہے۔"
