label:
  ar: "علّمني التاريخ (برنامج تلفزيوني)"
  en: "Allamani al-Tarikh, History Taught Me (television programme)"
  ur: "علّمني التاريخ: تاریخ نے مجھے سکھایا (ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني لطارق السويدان يحفظ أرشيف أسابيل منه تسعاً وعشرين حلقة قصيرة، يروي فيها مواقف فاصلة من تاريخ المسلمين ليستخرج منها «القوانين الحضارية» أو السنن التي تحكم صعود الأمم وسقوطها: مقدمة في السنن، ثم سقوط الأندلس وغرناطة، والمسلمون الذين نُصّروا قسراً، وثورة جبال البشرات، وسقوط بغداد على يد التتار، وثورة الحسين بن علي، وفتح القسطنطينية على يد محمد الفاتح."
  en: "A television programme by Tareq al-Suwaidan of which the Assabile archive keeps twenty-nine short episodes, in which he narrates decisive turning points in Muslim history to draw from them the 'civilisational laws', or sunan, that govern the rise and fall of nations: an introduction on the sunan, then the fall of al-Andalus and Granada, the Muslims forcibly converted to Christianity, the revolt of the Alpujarras, the fall of Baghdad to the Mongols, the rising of al-Husayn ibn Ali, and the conquest of Constantinople by Mehmed II."
  ur: "طارق السویدان کا ایک ٹیلی وژن پروگرام جس کی انتیس مختصر اقساط اسابیل آرکائیو میں محفوظ ہیں، جن میں وہ مسلمانوں کی تاریخ کے فیصلہ کن موڑ بیان کر کے ان سے وہ «تہذیبی قوانین» یا سنن اخذ کرتے ہیں جو قوموں کے عروج و زوال پر حاکم ہیں: سنن پر ایک تمہید، پھر اندلس اور غرناطہ کا سقوط، جبراً نصرانی بنائے گئے مسلمان، بشرات کے پہاڑوں کی بغاوت، تاتاریوں کے ہاتھوں بغداد کا سقوط، حسین بن علی کا قیام، اور محمد فاتح کے ہاتھوں قسطنطنیہ کی فتح۔"
