id: work/fatwa-amja-doubt-build-on-certainty
class: work
kind: fatwa
label: { ar: "البناء على اليقين", en: "Doubt in worship — build on the lesser, the certain", ur: "عبادت میں شک — اقل پر بنائیں", es: "La duda en la adoración: construir sobre lo menor, lo cierto.", fr: "Le doute dans le culte — bâtir sur le moindre, sur le certain", tr: "Kesinlik üzerine inşa etmek", id: "Membangun kepastian" }
summary:
  ar: "سأل سائل عن التعامل مع الشكوك في العبادة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77550 بتاريخ 24 يناير 2009)⁩ أن القاعدة في من شك في أمر من أمور العبادة أن يبني على الأقل لأنه المستيقن إلا بالنسبة لمن يستنكحه الشك أي يكثر عليه حتى صار كالوسواس أو المرض فهذا يطرح الشك ولا يلتفت إليه على ما فصّل الجواب."
  en: "A questioner asked about dealing with doubts in worship. Dr. Salah al-Sawi (fatwa no. 77550, 24 January 2009) answered that the rule for one who doubts a worship-matter is to build on the lesser, that being the certain — except for one whom doubt haunts till it becomes like waswasa or an illness: such a one casts the doubt off and pays it no heed — as the answer details."
  ur: "عبادت میں شک کا اصول؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77550، 24 جنوری 2009)⁩ کے مطابق اقل یعنی یقین پر عمل کریں؛ وسواسے والے شک چھوڑ دیں۔"
  es: "Un consultante preguntó sobre cómo afrontar las dudas en la adoración. El Dr. Salah al-Sawi (fatwa n.º 77550, 24 de enero de 2009) respondió que la regla para quien duda sobre un asunto de adoración es basarse en lo menor, es decir, en lo cierto, excepto para aquel cuya duda lo atormenta hasta convertirse en una especie de waswasa o enfermedad: tal persona desecha la duda y no le presta atención, como se detalla en la respuesta."
  fr: "Un internaute a posé une question sur la manière de gérer les doutes en matière de culte. Le Dr Salah al-Sawi (fatwa n° 77550, 24 janvier 2009) a répondu que la règle pour celui qui doute d'une question de culte est de s'appuyer sur le moindre doute, c'est-à-dire sur la certitude — sauf pour celui que le doute hante au point de devenir comme une waswasa ou une maladie: celui-ci rejette le doute et n'y prête aucune attention — comme le précise la réponse."
  tr: "İbadette şüphelerle başa çıkmak hakkında bir soru soruldu. Dr. Salah Al-Sawy (24 Ocak 2009 tarihli 77550 Fetvası) ibadetle ilgili şüphe duyan biri için kuralın en azından kesin olduğu için onu inşa etmesi gerektiğini, şüphe şüpheyle artıp takıntı veya hastalığa dönüştüğünü söyledi. Bu şüpheyi ortadan kaldırır ve cevapta açıklandığı şekilde değerlendirilmez."
  id: "Seorang penanya ditanya tentang cara menangani keraguan dalam ibadah. Dr. Salah Al-Sawy menjawab (Fatwa No. 77550 tanggal 24 Januari 2009) bahwa aturan bagi seseorang yang meragukan suatu hal ibadah setidaknya harus membangunnya karena dia yakin, kecuali bagi mereka yang ragu digoda oleh keraguan, artinya keraguan meningkat hingga menjadi seperti obsesi atau penyakit. Ini menghilangkan keraguan dan tidak dianggap seperti yang dijelaskan dalam jawaban."
