label:
  ar: "الآثار العلوية"
  en: "Al-Athar al-'Ulwiyya (The Meteorology)"
  es: "Al-Athar al-'Ulwiyya (La Meteorología)"
  fr: "Al-Athar al-'Ulwiyya (La Météorologie)"
  ur: "الاطہر العلویہ ⁦(موسمیات)⁩"
  tr: "Üst Anıtlar"
  id: "Monumen Atas"
summary:
  ar: "عنوان عربي اتخذه المترجمون والمؤلفون ليشير إلى كتاب أرسطو في الآثار الجوية ⁦(الأرصاد)⁩، وإلى كتاب ثاوفرسطس الذي يحمل الاسم نفسه، وقد ترجمه يوحنا بن البطريق، ونقل فيه ابن بهلول جزءًا من كتاب ثاوفرسطس، وصارت أفكاره عن تأثير الأفلاك في عالم ما تحت القمر أصلًا لمذهب ابن رشد وغيره {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  en: "The title the Arabs used for Aristotle's Meteorology, and also for the Meteorology of Theophrastus. Yuhanna ibn al-Bitriq translated Aristotle's work; Ibn Bahlul translated part of Theophrastus, and Aristotle's ideas on the influence of the spheres on the sublunar world shaped the later Arabic tradition, down to Ibn Rushd {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  es: "El título que los árabes usaban para la Meteorología de Aristóteles, y también para la Meteorología de Teofrasto. Juan ibn al-Bitriq tradujo la obra de Aristóteles; Ibn Bahlul tradujo parte de la de Teofrasto, y las ideas de Aristóteles sobre la influencia de las esferas en el mundo sublunar moldearon la tradición árabe posterior, hasta Ibn Rushd {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  fr: "Le titre utilisé par les Arabes pour la Météorologie d'Aristote, ainsi que pour celle de Théophraste. Jean ibn al-Bitriq a traduit l'œuvre d'Aristote; Ibn Bahlul a traduit une partie de celle de Théophraste, et les idées d'Aristote sur l'influence des sphères sur le monde sublunaire ont façonné la tradition arabe ultérieure, jusqu'à Ibn Rushd (voir: Encyclopédie de l'Islam, vol. 1, p. 785)."
  ur: "یہ عنوان عربوں نے ارسطو کے موسمیات کے لیے استعمال کیا، اور تھیوفراسٹس کے موسمیات کے لیے بھی۔ جان بن البیترک نے ارسطو کے کام کا ترجمہ کیا۔ ابن بہلول نے تھیوفراسٹس کے کچھ حصے کا ترجمہ کیا، اور ارسطو کے تصورات نے ذیلی دنیا پر دائروں کے اثر و رسوخ کے بارے میں بعد کی عربی روایت کی تشکیل کی، ابن رشد تک۔ 1 ص۔ 785}۔"
  tr: "Çevirmenler ve yazarlar tarafından Aristoteles'in meteoroloji kitabına ve İbn Bahlul'un Theophrastus'un kitabından bir bölüm alıntıladığı John ibn al-Baptuk tarafından çevrilen aynı adlı kitabına atıfta bulunmak için benimsenen Arapça bir başlık. Kürelerin Ay altındaki dünya üzerindeki etkisi hakkındaki fikirleri, İbn Rüşd ve diğerlerinin doktrininin temelini oluşturdu {cite:encyclopaedia-of-Islam-2 cilt 1, s. 785}."
  id: "Judul Arab yang diadopsi oleh penerjemah dan penulis untuk merujuk pada buku meteorologi Aristoteles, dan buku Theophrastus dengan judul yang sama, diterjemahkan oleh John ibn al-Baptuk, di mana Ibn Bahlul mengutip sebagian dari buku Theophrastus. Gagasannya tentang pengaruh bola pada dunia di bawah bulan menjadi dasar doktrin Ibn Rushd dan lainnya {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 785}."
