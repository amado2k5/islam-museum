label:
  ar: "الآثار العلوية"
  en: "Al-Athar al-'Ulwiyya (The Meteorology)"
summary:
  ar: "عنوان عربي اتخذه المترجمون والمؤلفون ليشير إلى كتاب أرسطو في الآثار الجوية (الأرصاد)، وإلى كتاب ثاوفرسطس الذي يحمل الاسم نفسه، وقد ترجمه يوحنا بن البطريق، ونقل فيه ابن بهلول جزءًا من كتاب ثاوفرسطس، وصارت أفكاره عن تأثير الأفلاك في عالم ما تحت القمر أصلًا لمذهب ابن رشد وغيره {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  en: "The title the Arabs used for Aristotle's Meteorology, and also for the Meteorology of Theophrastus. Yuhanna ibn al-Bitriq translated Aristotle's work; Ibn Bahlul translated part of Theophrastus, and Aristotle's ideas on the influence of the spheres on the sublunar world shaped the later Arabic tradition, down to Ibn Rushd {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
