id: work/fatwa-dar-alifta-eg-company-guaranteeing-other-products
class: work
kind: fatwa
label: { ar: "حكم قيام شركة بضمان منتجات شركات أخرى لمدة زمنية معينة ضد العيوب", en: "A company warranting other companies' products against defects for a period", ur: "کمپنی کا دوسری کمپنیوں کی مصنوعات کی ضمانت دینا", es: "Una empresa que garantiza los productos de otras empresas contra defectos durante un período", fr: "Une entreprise garantissant les produits d'autres entreprises contre les défauts pendant une période donnée", tr: "Bir şirketin diğer şirketlerin ürünlerini belirli bir süre için kusurlara karşı garanti eden kararı", id: "Putusan tentang perusahaan yang menjamin produk perusahaan lain untuk jangka waktu tertentu terhadap cacat" }
summary:
  ar: "سائل سأل عن تعاقده مع جهة لضمان بعض المنتجات التي اشتراها ضد العيوب غير المتوقعة التي تطرأ عليها لمدة زمنية معينة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21563)⁩ أنه لا مانع شرعًا من ذلك التعاقد على ما فصّل الجواب من ضوابطه."
  en: "A questioner asked about contracting with an entity to warrant products he bought against unexpected defects for a set period. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21563) answered there is no legal objection to such a contract — under the controls the answer sets out."
  ur: "ایک سائل نے ایسی ایجنسی سے معاہدے کا حکم پوچھا جو خریدی مصنوعات کی غیر متوقع خرابیوں کی ایک مدت تک ضمانت دے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21563)⁩ نے جواب دیا کہ ایسے معاہدے میں شرعی مانع نہیں — جواب کے ضوابط کے ساتھ۔"
  es: "Un consultante preguntó sobre la posibilidad de contratar con una entidad para que garantizara los productos que había comprado contra defectos inesperados durante un período determinado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21563) respondió que no existe ninguna objeción legal a dicho contrato, de acuerdo con los controles que se detallan en la respuesta."
  fr: "Un individu a posé une question concernant la possibilité de conclure un contrat de garantie avec une entité pour des produits achetés contre des défauts imprévus pendant une période déterminée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21563) a répondu qu'un tel contrat n'est pas juridiquement contestable, sous réserve des conditions énoncées dans la réponse."
  tr: "Bir soru soran, satın aldığı bazı ürünleri beklenmedik kusurlara karşı garanti etmek için bir kuruluşla sözleşme yapmayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21563), cevabın ayrıntılı kurallarına dayanarak sözleşmeye dini bir itiraz olmadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang kontrak dengan entitas untuk menjamin beberapa produk yang dibelinya terhadap cacat tak terduga yang mungkin terjadi dalam jangka waktu tertentu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21563) menjawab bahwa tidak ada keberatan agama terhadap kontrak berdasarkan aturan rinci jawaban."
