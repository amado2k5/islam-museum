id: work/fatwa-dar-alifta-eg-vow-conditioned-on-gods-will
class: work
kind: fatwa
label: { ar: "حكم النذر المعلق على مشيئة الله", en: "A vow conditioned on God's will", ur: "مشیتِ الٰہی پر مشروط نذر", es: "Un voto condicionado a la voluntad de Dios." }
summary:
  ar: "سائل سأل عن نذر علّقه على المشيئة بأن قال نذرت لله ذبح شاة إن شاء الله. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21494)⁩ أنه لا يجب شيء على من علّق النذر على المشيئة ما دام قد وصل الاستثناء بالنذر على ما فصّل الجواب."
  en: "A questioner asked about a vow he conditioned on God's will, saying 'I have vowed to God a sheep's slaughter, God willing.' Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21494) answered that nothing is due from one who attached the exception to the vow — as the answer details."
  ur: "ایک سائل نے اپنی نذر کا حکم پوچھی جو اس نے مشیتِ الٰہی پر مشروط کی تھی کہ ان شاء اللہ بھینٹ چڑھاؤں گا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21494)⁩ نے جواب دیا کہ استثنا نذر سے ملا ہوا ہو تو کچھ واجب نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de un voto que había condicionado a la voluntad de Dios, diciendo: \"He prometido a Dios sacrificar una oveja, si Dios quiere\". El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21494) respondió que no se debe nada a quien adjuntó la excepción al voto, como se detalla en la respuesta."
