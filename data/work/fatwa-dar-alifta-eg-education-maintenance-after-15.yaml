id: work/fatwa-dar-alifta-eg-education-maintenance-after-15
class: work
kind: fatwa
label: { ar: "مدى مشروعية استدامة نفقات التعليم للمحضون بعد بلوغه خمسة عشر عامًا", en: "Education maintenance for a ward continuing past age fifteen", ur: "پندرہ سال کے بعد بھی محضون کی تعلیم کی نفقہ", es: "Mantenimiento de la educación para un pupilo después de los quince años.", fr: "La prise en charge des études d'un pupille se poursuivant au-delà de l'âge de quinze ans", tr: "On Beş Yaşına Ulaştıktan Sonra Anaokulu Eğitim Masraflarının Desteklenmesinin Meşruiyeti", id: "Legitimasi Mendukung Biaya Pendidikan untuk Taman Kanak-Kanak Setelah Mencapai Lima Belas Tahun" }
summary:
  ar: "سائل سأل عن استدامة نفقات التعليم للمحضون بعد بلوغه خمسة عشر عامًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21726)⁩ أن نفقة التعليم نفقة ثابتة مستدامة تجب على الأب للمحضون ولو بعد بلوغه الخامسة عشرة متى توافرت شروطها على ما فصّل الجواب."
  en: "A questioner asked whether education maintenance for a ward continues past the age of fifteen. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21726) answered that education maintenance is an established continuing obligation on the father for the ward — even beyond fifteen — whenever its conditions are met, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا محضون کی تعلیم کی نفقہ پندرہ سال کی عمر کے بعد بھی جاری رہتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21726)⁩ نے جواب دیا کہ تعلیم کی نفقہ ایک ثابت اور مستمر ذمہ داری ہے جو شرائط پوری ہونے پر باپ پر واجب رہتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si la manutención educativa de un pupilo continúa después de los quince años. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21726) respondió que la manutención educativa es una obligación continua establecida para el padre hacia su pupilo, incluso después de los quince años, siempre que se cumplan sus condiciones, como se detalla en la respuesta."
  fr: "Une personne a demandé si l'obligation de subvenir aux besoins scolaires d'un pupille se poursuit au-delà de l'âge de quinze ans. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21726) a répondu que cette obligation est établie et continue pour le père envers son pupille, même au-delà de quinze ans, dès lors que les conditions requises sont remplies, comme le précise la réponse."
  tr: "Bir soru soran kişi, on beş yaşına geldikten sonra anaokulunun eğitim giderlerinin sürdürülebilirliği hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21726), eğitim giderinin, babanın on beş yaşına geldikten sonra bile çocuğa olan sabit ve sürdürülebilir bir gider olduğunu, koşulları yerine getirildiği sürece ödediğini yanıtladı."
  id: "Seorang penanya menanyakan tentang keberlanjutan biaya pendidikan untuk taman kanak-kanak setelah mencapai usia lima belas tahun. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21726) menjawab bahwa biaya pendidikan adalah pengeluaran tetap dan berkelanjutan yang harus dibayar ayah kepada anak bahkan setelah mencapai usia lima belas tahun, asalkan syaratnya terpenuhi, seperti yang dijelaskan dalam jawaban."
