id: work/fatwa-dar-alifta-eg-education-maintenance-after-15
class: work
kind: fatwa
label: { ar: "مدى مشروعية استدامة نفقات التعليم للمحضون بعد بلوغه خمسة عشر عامًا", en: "Education maintenance for a ward continuing past age fifteen", ur: "پندرہ سال کے بعد بھی محضون کی تعلیم کی نفقہ" }
summary:
  ar: "سائل سأل عن استدامة نفقات التعليم للمحضون بعد بلوغه خمسة عشر عامًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21726)⁩ أن نفقة التعليم نفقة ثابتة مستدامة تجب على الأب للمحضون ولو بعد بلوغه الخامسة عشرة متى توافرت شروطها على ما فصّل الجواب."
  en: "A questioner asked whether education maintenance for a ward continues past the age of fifteen. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21726) answered that education maintenance is an established continuing obligation on the father for the ward — even beyond fifteen — whenever its conditions are met, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا محضون کی تعلیم کی نفقہ پندرہ سال کی عمر کے بعد بھی جاری رہتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21726)⁩ نے جواب دیا کہ تعلیم کی نفقہ ایک ثابت اور مستمر ذمہ داری ہے جو شرائط پوری ہونے پر باپ پر واجب رہتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
