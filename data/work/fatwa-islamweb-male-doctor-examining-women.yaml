id: work/fatwa-islamweb-male-doctor-examining-women
class: work
kind: fatwa
label: { ar: "ضوابط كشف الطبيب على النساء ولمسهن", en: "Rules for a male doctor examining and touching female patients", ur: "مرد ڈاکٹر کے خواتین کا معائنہ کرنے اور چھونے کے ضوابط" }
summary:
  ar: "سؤال عن العمل في مهنة طبية تتطلب لمس النساء من غير شهوة لغرض التشخيص، مع وجود طبيبات لكن من غير إمكان امتناع الطبيب عن تشخيص المريضات بسبب القانون في بلد غربي أو الحرج والمشقة في بلد مسلم، أجاب فيه مركز الفتوى بإسلام ويب بأن الأصل أن تداوي المرأة المرأة والرجل الرجل، ولا يُخرج عن هذا الأصل إلا لضرورة أو حاجة، ولا يُشترط دائمًا خوف الهلاك بل تكفي الحاجة الطبية المعتادة، لأن تحريم النظر واللمس في المداواة من تحريم الوسائل سدًا للذريعة، وما حُرّم كذلك يُباح للمصلحة الراجحة. ونقل ذلك عن ابن تيمية في مجموع الفتاوى وابن القيم في روضة المحبين. وقرر أنه إن احتاج السائل إلى هذا العمل وتعذرت إحالة المريضة إلى طبيبة بسبب نظام المشفى أو ترتب ضرر عليه برفضه، فلا حرج عليه في الكشف عليهن، مع مراعاة الضوابط: استعمال حائل أثناء الفحص واللمس، وعدم مس الجلد مباشرة إلا إذا تعذر التشخيص بالحائل، والاقتصار على الموضع الذي يتطلبه التشخيص، وانتفاء الخلوة المحرمة، ناقلًا عن البهوتي في كشاف القناع أن للطبيب نظر ولمس ما تدعو الحاجة إليه بحضور محرم أو زوج."
  en: "A question about working in a medical profession that requires touching women without desire for the purpose of diagnosis, where female staff exist but the doctor cannot refuse to examine female patients because of the law in a Western country or the embarrassment and hardship of doing so in a Muslim country; the fatwa centre of IslamWeb answered that the default is that a woman treats a woman and a man treats a man, that this default is departed from only for necessity or need, and that fear of death is not always required, ordinary medical need being enough, because the prohibition of looking and touching during treatment is a prohibition of means to block a path to harm, and what is forbidden in that way becomes permitted for a preponderant interest. It quoted this from Ibn Taymiyya in Majmu' al-Fatawa and Ibn al-Qayyim in Rawdat al-Muhibbin. It ruled that if the questioner needs this work and cannot refer the patient to a female doctor because of the hospital's rules, or would be harmed by refusing, there is no blame on him in examining women, while observing the rules: using a barrier during examination and touching, not touching the skin directly unless diagnosis through a barrier is impossible, confining looking and touching to the place the diagnosis requires, and avoiding unlawful seclusion; it quoted al-Buhuti in Kashshaf al-Qina' that a doctor may look at and touch what need requires, in the presence of a mahram or husband."
  ur: "ایسے طبی پیشے میں کام کرنے کے بارے میں سوال جس میں تشخیص کی غرض سے بغیر شہوت عورتوں کو چھونا پڑتا ہے، جہاں خواتین عملہ موجود ہے لیکن ڈاکٹر مغربی ملک میں قانون کی وجہ سے یا مسلم ملک میں شرمندگی اور مشقت کی وجہ سے مریضاؤں کی تشخیص سے انکار نہیں کر سکتا؛ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ اصل یہ ہے کہ عورت کا علاج عورت اور مرد کا علاج مرد کرے، اس اصل سے صرف ضرورت یا حاجت کی بنا پر نکلا جا سکتا ہے، اور ہمیشہ ہلاکت کا خوف شرط نہیں بلکہ معمول کی طبی حاجت کافی ہے، کیونکہ علاج میں دیکھنے اور چھونے کی حرمت ذرائع کی حرمت ہے جو سدِّ ذریعہ کے لیے ہے، اور جو اس طرح حرام ہو وہ راجح مصلحت کے لیے مباح ہو جاتا ہے۔ اس نے یہ ابن تیمیہ کی مجموع الفتاویٰ اور ابن القیم کی روضۃ المحبین سے نقل کیا۔ اس نے فیصلہ کیا کہ اگر سائل کو اس کام کی ضرورت ہے اور ہسپتال کے نظام کی وجہ سے مریضہ کو خاتون ڈاکٹر کے پاس بھیجنا ممکن نہیں، یا انکار سے اسے نقصان پہنچے، تو عورتوں کا معائنہ کرنے میں اس پر کوئی حرج نہیں، ان ضوابط کے ساتھ: معائنے اور چھونے کے دوران پردہ استعمال کرنا، جلد کو براہِ راست نہ چھونا جب تک پردے کے ساتھ تشخیص ناممکن نہ ہو، دیکھنے اور چھونے کو تشخیص کی ضرورت کی جگہ تک محدود رکھنا، اور حرام خلوت سے بچنا؛ اس نے بہوتی کی کشاف القناع سے نقل کیا کہ طبیب حاجت کے مطابق دیکھ اور چھو سکتا ہے، محرم یا شوہر کی موجودگی میں۔"
