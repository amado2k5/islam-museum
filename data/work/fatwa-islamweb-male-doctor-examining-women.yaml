id: work/fatwa-islamweb-male-doctor-examining-women
class: work
kind: fatwa
label: { ar: "ضوابط كشف الطبيب على النساء ولمسهن", en: "Rules for a male doctor examining and touching female patients", ur: "مرد ڈاکٹر کے خواتین کا معائنہ کرنے اور چھونے کے ضوابط", es: "Normas para que un médico varón examine y toque a pacientes femeninas", fr: "Règles applicables à un médecin de sexe masculin qui examine et touche des patientes.", tr: "Doktor muayenesi ve kadınlara dokunma düzenlemeleri", id: "Peraturan untuk Pemeriksaan dan Sentuhan Dokter pada Wanita" }
summary:
  ar: "سؤال عن العمل في مهنة طبية تتطلب لمس النساء من غير شهوة لغرض التشخيص، مع وجود طبيبات لكن من غير إمكان امتناع الطبيب عن تشخيص المريضات بسبب القانون في بلد غربي أو الحرج والمشقة في بلد مسلم، أجاب فيه مركز الفتوى بإسلام ويب بأن الأصل أن تداوي المرأة المرأة والرجل الرجل، ولا يُخرج عن هذا الأصل إلا لضرورة أو حاجة، ولا يُشترط دائمًا خوف الهلاك بل تكفي الحاجة الطبية المعتادة، لأن تحريم النظر واللمس في المداواة من تحريم الوسائل سدًا للذريعة، وما حُرّم كذلك يُباح للمصلحة الراجحة. ونقل ذلك عن ابن تيمية في مجموع الفتاوى وابن القيم في روضة المحبين. وقرر أنه إن احتاج السائل إلى هذا العمل وتعذرت إحالة المريضة إلى طبيبة بسبب نظام المشفى أو ترتب ضرر عليه برفضه، فلا حرج عليه في الكشف عليهن، مع مراعاة الضوابط: استعمال حائل أثناء الفحص واللمس، وعدم مس الجلد مباشرة إلا إذا تعذر التشخيص بالحائل، والاقتصار على الموضع الذي يتطلبه التشخيص، وانتفاء الخلوة المحرمة، ناقلًا عن البهوتي في كشاف القناع أن للطبيب نظر ولمس ما تدعو الحاجة إليه بحضور محرم أو زوج."
  en: "A question about working in a medical profession that requires touching women without desire for the purpose of diagnosis, where female staff exist but the doctor cannot refuse to examine female patients because of the law in a Western country or the embarrassment and hardship of doing so in a Muslim country; the fatwa centre of IslamWeb answered that the default is that a woman treats a woman and a man treats a man, that this default is departed from only for necessity or need, and that fear of death is not always required, ordinary medical need being enough, because the prohibition of looking and touching during treatment is a prohibition of means to block a path to harm, and what is forbidden in that way becomes permitted for a preponderant interest. It quoted this from Ibn Taymiyya in Majmu' al-Fatawa and Ibn al-Qayyim in Rawdat al-Muhibbin. It ruled that if the questioner needs this work and cannot refer the patient to a female doctor because of the hospital's rules, or would be harmed by refusing, there is no blame on him in examining women, while observing the rules: using a barrier during examination and touching, not touching the skin directly unless diagnosis through a barrier is impossible, confining looking and touching to the place the diagnosis requires, and avoiding unlawful seclusion; it quoted al-Buhuti in Kashshaf al-Qina' that a doctor may look at and touch what need requires, in the presence of a mahram or husband."
  ur: "ایسے طبی پیشے میں کام کرنے کے بارے میں سوال جس میں تشخیص کی غرض سے بغیر شہوت عورتوں کو چھونا پڑتا ہے، جہاں خواتین عملہ موجود ہے لیکن ڈاکٹر مغربی ملک میں قانون کی وجہ سے یا مسلم ملک میں شرمندگی اور مشقت کی وجہ سے مریضاؤں کی تشخیص سے انکار نہیں کر سکتا؛ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ اصل یہ ہے کہ عورت کا علاج عورت اور مرد کا علاج مرد کرے، اس اصل سے صرف ضرورت یا حاجت کی بنا پر نکلا جا سکتا ہے، اور ہمیشہ ہلاکت کا خوف شرط نہیں بلکہ معمول کی طبی حاجت کافی ہے، کیونکہ علاج میں دیکھنے اور چھونے کی حرمت ذرائع کی حرمت ہے جو سدِّ ذریعہ کے لیے ہے، اور جو اس طرح حرام ہو وہ راجح مصلحت کے لیے مباح ہو جاتا ہے۔ اس نے یہ ابن تیمیہ کی مجموع الفتاویٰ اور ابن القیم کی روضۃ المحبین سے نقل کیا۔ اس نے فیصلہ کیا کہ اگر سائل کو اس کام کی ضرورت ہے اور ہسپتال کے نظام کی وجہ سے مریضہ کو خاتون ڈاکٹر کے پاس بھیجنا ممکن نہیں، یا انکار سے اسے نقصان پہنچے، تو عورتوں کا معائنہ کرنے میں اس پر کوئی حرج نہیں، ان ضوابط کے ساتھ: معائنے اور چھونے کے دوران پردہ استعمال کرنا، جلد کو براہِ راست نہ چھونا جب تک پردے کے ساتھ تشخیص ناممکن نہ ہو، دیکھنے اور چھونے کو تشخیص کی ضرورت کی جگہ تک محدود رکھنا، اور حرام خلوت سے بچنا؛ اس نے بہوتی کی کشاف القناع سے نقل کیا کہ طبیب حاجت کے مطابق دیکھ اور چھو سکتا ہے، محرم یا شوہر کی موجودگی میں۔"
  es: "Una pregunta sobre trabajar en una profesión médica que requiere tocar a mujeres sin deseo con fines de diagnóstico, donde hay personal femenino pero el médico no puede negarse a examinar a pacientes mujeres debido a la ley en un país occidental o a la vergüenza y dificultad de hacerlo en un país musulmán; el centro de fatuas de IslamWeb respondió que la norma general es que una mujer atienda a una mujer y un hombre a un hombre, que esta norma solo se aparta por necesidad, y que el miedo a la muerte no siempre es necesario, bastando con una necesidad médica ordinaria, porque la prohibición de mirar y tocar durante el tratamiento es una prohibición de los medios para bloquear un camino hacia el daño, y lo que está prohibido de esa manera se permite por un interés preponderante. Citó esto de Ibn Taymiyya en Majmu' al-Fatawa e Ibn al-Qayyim en Rawdat al-Muhibbin. Dictaminó que si el médico que realiza la consulta necesita este trabajo y no puede remitir a la paciente a una médica debido a las normas del hospital, o si se vería perjudicado al negarse, no hay culpa en él por examinar a las mujeres, siempre que se observen las normas: usar una barrera durante el examen y el tacto, no tocar la piel directamente a menos que el diagnóstico a través de una barrera sea imposible, limitar la mirada y el tacto al lugar que requiere el diagnóstico y evitar el aislamiento ilícito; citó a al-Buhuti en Kashshaf al-Qina' que un médico puede mirar y tocar lo que sea necesario, en presencia de un mahram o esposo."
  fr: "Concernant la question de l'exercice d'une profession médicale nécessitant des contacts physiques avec des femmes à des fins de diagnostic, dans un contexte où du personnel féminin est présent mais où le médecin ne peut refuser d'examiner des patientes en raison de la législation d'un pays occidental ou de la gêne et des difficultés que cela impliquerait dans un pays musulman, le centre de fatwas d'IslamWeb a répondu que, par défaut, une femme soigne une femme et un homme soigne un homme. Cette règle n'est écartée qu'en cas de nécessité absolue, et la crainte de la mort n'est pas toujours requise, un besoin médical ordinaire suffisant. En effet, l'interdiction de regarder et de toucher pendant un traitement constitue une mesure de prévention contre un préjudice, et ce qui est interdit de cette manière devient permis pour un intérêt supérieur. Le centre cite Ibn Taymiyya dans Majmu' al-Fatawa et Ibn al-Qayyim dans Rawdat al-Muhibbin. Il a été statué que si le médecin qui pose la question a besoin de cet examen et ne peut orienter la patiente vers une femme médecin en raison du règlement de l'hôpital, ou s'il risque d'être lésé en refusant, il n'y a pas lieu de le blâmer s'il examine des femmes, à condition de respecter les règles suivantes: utiliser une barrière lors de l'examen et du toucher, ne pas toucher directement la peau sauf si le diagnostic à travers une barrière est impossible, limiter l'observation et le toucher à la zone requise par le diagnostic et éviter tout isolement illicite; il a cité al-Buhuti dans Kashshaf al-Qina' selon lequel un médecin peut regarder et toucher ce qui est nécessaire, en présence d'un mahram ou du mari."
  tr: "Tıbbi mesleğin kadınlara tanı istemeden dokunulmasını gerektiren, kadın doktorların yanında olduğu bir soru, ancak bir doktorun Batı ülkesinde yasalar veya Müslüman ülkelerdeki zorluk ve zorluklar nedeniyle hastaları teşhis etmeyi reddetmesi imkansızdır. IslamWeb'deki Fetva Merkezi, varsayılan olarak kadının bir kadını tedavi etmesi, bir erkeğin bir erkeği tedavi etmesi gerektiği ve bu ilkenin sadece zorunluluk veya ihtiyaç nedeniyle sapıldığını yanıtladı. Ölüm korkusu her zaman gerekli değildir; olağan tıbbi ihtiyaç yeterlidir, çünkü tedavide bakmanın ve dokunmanın yasaklanması, bahaneyi engellemek için araçların yasaklanmasına benzer; yasak olan da geçerli çıkar için izin verilir. Bu, Majmu' al-Fatawa derleğindeki İbn Teymiyye ve Rawdat al-Muhibbin'deki İbn al-Qayyim tarafından bildirilmiştir. Hastanın bu işleme ihtiyacı varsa ve hastane sistemi nedeniyle doktora yönlendirilemiyorsa veya reddedilme zarar veriyorsa, muayene kurallara uyarak muayene edilmesinin zarar görmediğine hükmetti: muayene sırasında bariyer kullanma ve dokunma, tanı mümkün olmadıkça cilde doğrudan dokunmamak, tanı için gereken bölgeyle sınırlamak ve yasak inzivadan kaçınmak. Kashaf Al-Qina'da Al-Bahuti'nin bir doktorun mahram veya eş huzurunda ihtiyaç duyulan şeylere bakıp dokunabileceğini aktardı."
  id: "Pertanyaan tentang bekerja di profesi medis yang mengharuskan menyentuh perempuan tanpa keinginan untuk diagnosis, dengan dokter perempuan hadir, tetapi mustahil bagi dokter untuk menolak mendiagnosis pasien karena hukum di negara Barat atau kesulitan dan kesulitan di negara Muslim. Fatwa Center di IslamWeb menjawab bahwa default adalah perempuan harus merawat perempuan dan laki-laki harus merawat laki-laki, dan prinsip ini hanya disesuaikan karena kebutuhan atau kebutuhan. Takut mati tidak selalu diperlukan; kebutuhan medis biasa sudah cukup, karena larangan melihat dan menyentuh dalam pengobatan seperti larangan cara untuk menghalangi alasan, dan apa yang dilarang juga diperbolehkan demi kepentingan yang ada. Hal ini dilaporkan dari Ibn Taymiyyah dalam Majmu' al-Fatawa dan Ibn al-Qayyim dalam Rawdat al-Muhibbin. Ia memutuskan bahwa jika pasien membutuhkan prosedur ini dan tidak memungkinkan merujuk pasien ke dokter karena sistem rumah sakit atau jika penolakan menyebabkan kerugian, tidak ada salahnya memeriksa mereka sambil mematuhi aturan: menggunakan penghalang saat pemeriksaan dan menyentuh, tidak menyentuh kulit secara langsung kecuali diagnosis tidak mungkin, membatasi pada area yang diperlukan untuk diagnosis, dan menghindari pengasingan terlarang. Ia mengutip Al-Bahuti dalam Kashaf Al-Qina' bahwa dokter boleh melihat dan menyentuh apa yang diperlukan di hadapan mahram atau suami."
