label: { ar: "الترجمة اللاتفية لمعاني القرآن ⁦(أولديس بيرزينش)⁩", en: "The Latvian translation of the Qur'an (Uldis Bērziņš)", ur: "قرآن کا لاتویائی ترجمہ ⁦(اولدیس بیرزنش)⁩", es: "La traducción letona del Corán (Uldis Bērziņš)", fr: "La traduction lettone du Coran (Uldis Bērziņš)" }
summary:
  ar: "ترجمة أدبية لمعاني القرآن إلى اللاتفية وضعها الشاعر والمترجم والمستشرق اللاتفي أولديس بيرزينش مع الباحث في الفلسفة الفارسية يانيس إسوتس، صدرت أول مرة في ريغا عن دار زفايغزني ثم في طبعة ثانية منقّحة عن دار نيبوتنس سنة 2011؛ تُعنى بأسلوب القرآن ومحاكاة تراكيبه العربية، وتعدّ أول ترجمة كاملة منشورة باللاتفية، وما يزال الباحثون في لاتفيا يستشهدون بها."
  en: "A literary rendering of the meanings of the Qur'an into Latvian by the Latvian poet, translator and orientalist Uldis Bērziņš with the scholar of Persian philosophy Jānis Ešots, first published in Riga by Zvaigzne ABC and in a revised second edition by Neputns in 2011; it seeks to convey the Qur'an's style and imitate its Arabic syntax, is counted the first complete Latvian translation to be published, and is still cited by scholars in Latvia."
  ur: "قرآن کے معانی کا لاتویائی ادبی ترجمہ از لاتویائی شاعر، مترجم اور مستشرق اولدیس بیرزنش، فارسی فلسفے کے محقق یانس ایشوتس کے ساتھ، جو پہلی بار ریگا میں زوائگزنے نے اور 2011 میں نیپوتنس نے نظرِ ثانی شدہ دوسری اشاعت میں شائع کیا؛ اس کا مقصد قرآن کے اسلوب اور عربی تراکیب کی نقل ہے، یہ لاتویائی کا پہلا شائع شدہ مکمل ترجمہ مانا جاتا ہے، اور لاتویا کے محققین اب بھی اس کا حوالہ دیتے ہیں۔"
  es: "Una traducción literaria del significado del Corán al letón, realizada por el poeta, traductor y orientalista letón Uldis Bērziņš junto con el erudito en filosofía persa Jānis Ešots, publicada por primera vez en Riga por Zvaigzne ABC y en una segunda edición revisada por Neputns en 2011; busca transmitir el estilo del Corán e imitar su sintaxis árabe, se considera la primera traducción completa al letón que se publicó y todavía es citada por académicos en Letonia."
  fr: "Une traduction littéraire des significations du Coran en letton par le poète, traducteur et orientaliste letton Uldis Bērziņš avec le spécialiste de philosophie persane Jānis Ešots, publiée pour la première fois à Riga par Zvaigzne ABC et dans une seconde édition révisée par Neputns en 2011; elle cherche à transmettre le style du Coran et à imiter sa syntaxe arabe, est considérée comme la première traduction complète en letton à être publiée, et est encore citée par les érudits en Lettonie."
