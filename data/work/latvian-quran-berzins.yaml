label: { ar: "الترجمة اللاتفية لمعاني القرآن ⁦(أولديس بيرزينش)⁩", en: "The Latvian translation of the Qur'an (Uldis Bērziņš)", ur: "قرآن کا لاتویائی ترجمہ ⁦(اولدیس بیرزنش)⁩" }
summary:
  ar: "ترجمة أدبية لمعاني القرآن إلى اللاتفية وضعها الشاعر والمترجم والمستشرق اللاتفي أولديس بيرزينش مع الباحث في الفلسفة الفارسية يانيس إسوتس، صدرت أول مرة في ريغا عن دار زفايغزني ثم في طبعة ثانية منقّحة عن دار نيبوتنس سنة 2011؛ تُعنى بأسلوب القرآن ومحاكاة تراكيبه العربية، وتعدّ أول ترجمة كاملة منشورة باللاتفية، وما يزال الباحثون في لاتفيا يستشهدون بها."
  en: "A literary rendering of the meanings of the Qur'an into Latvian by the Latvian poet, translator and orientalist Uldis Bērziņš with the scholar of Persian philosophy Jānis Ešots, first published in Riga by Zvaigzne ABC and in a revised second edition by Neputns in 2011; it seeks to convey the Qur'an's style and imitate its Arabic syntax, is counted the first complete Latvian translation to be published, and is still cited by scholars in Latvia."
  ur: "قرآن کے معانی کا لاتویائی ادبی ترجمہ از لاتویائی شاعر، مترجم اور مستشرق اولدیس بیرزنش، فارسی فلسفے کے محقق یانس ایشوتس کے ساتھ، جو پہلی بار ریگا میں زوائگزنے نے اور 2011 میں نیپوتنس نے نظرِ ثانی شدہ دوسری اشاعت میں شائع کیا؛ اس کا مقصد قرآن کے اسلوب اور عربی تراکیب کی نقل ہے، یہ لاتویائی کا پہلا شائع شدہ مکمل ترجمہ مانا جاتا ہے، اور لاتویا کے محققین اب بھی اس کا حوالہ دیتے ہیں۔"
