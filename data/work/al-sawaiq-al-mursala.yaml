structure: "Preface ending with a question taken from Ibn Taymiyya; twenty-four chapters: (1) the meaning of ta'wil in language and usage; (2) sound and false ta'wil, with ten kinds of the false; (3) ta'wil as a report of the speaker's meaning; (4) ta'wil of reports and of commands; (5) the ta'wil of distortion and of explanation; … (19) causes that make false ta'wil acceptable; (20) that the people of ta'wil cannot establish a scriptural proof against any falsehood; (21) four causes of ta'wil; (22) praiseworthy and blameworthy disagreement; (23) the causes of disagreement among the imams; (24) the four 'idols' – answered in the extant part as two: revealed texts give no certainty (73 aspects) and reason over revelation (242 numbered aspects, 234 extant). The editors' outline: ataat-v1 PDF pp. 17–30."
