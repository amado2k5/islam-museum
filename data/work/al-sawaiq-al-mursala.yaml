summary:
  ar: "كتاب لابن قيم الجوزية ⁦(ت 751هـ)⁩ في نقد التأويل الكلامي لنصوص الصفات، في أربعة وعشرين فصلاً آخرها في «الطواغيت الأربع»: أن نصوص الوحي أدلة لفظية لا تفيد اليقين، وأن آيات الصفات مجاز، وأن أخبار الآحاد لا تفيد العلم، وأن العقل يقدَّم على النقل عند التعارض؛ والموجود منه ينتهي في الرد على الطاغوت الثاني، والباقي معروف من «مختصر الصواعق» لابن الموصلي."
  en: "A book by Ibn Qayyim al-Jawziyya (d. 751 AH) criticising the theologians' figurative interpretation (ta'wil) of the texts on God's attributes, in twenty-four chapters, the last on the 'four idols': that revealed texts are verbal proofs giving no certainty, that the verses on the attributes are figurative, that solitary reports give no knowledge, and that reason takes precedence over revelation when they conflict. The extant text breaks off in the answer to the second of these; the rest is known from Ibn al-Mawsili's abridgement."
