summary:
  ar: "كتاب لابن قيم الجوزية ⁦(ت 751هـ)⁩ في نقد التأويل الكلامي لنصوص الصفات، في أربعة وعشرين فصلاً آخرها في «الطواغيت الأربع»: أن نصوص الوحي أدلة لفظية لا تفيد اليقين، وأن آيات الصفات مجاز، وأن أخبار الآحاد لا تفيد العلم، وأن العقل يقدَّم على النقل عند التعارض؛ والموجود منه ينتهي في الرد على الطاغوت الثاني، والباقي معروف من «مختصر الصواعق» لابن الموصلي."
  en: "A book by Ibn Qayyim al-Jawziyya (d. 751 AH) criticising the theologians' figurative interpretation (ta'wil) of the texts on God's attributes, in twenty-four chapters, the last on the 'four idols': that revealed texts are verbal proofs giving no certainty, that the verses on the attributes are figurative, that solitary reports give no knowledge, and that reason takes precedence over revelation when they conflict. The extant text breaks off in the answer to the second of these; the rest is known from Ibn al-Mawsili's abridgement."
  es: "Un libro de Ibn Qayyim al-Jawziyya (m. 751 AH) que critica la interpretación figurativa (ta'wil) de los textos sobre los atributos de Dios por parte de los teólogos, en veinticuatro capítulos, el último sobre los \"cuatro ídolos\": que los textos revelados son pruebas verbales que no dan certeza, que los versículos sobre los atributos son figurativos, que los relatos aislados no aportan conocimiento, y que la razón tiene prioridad sobre la revelación cuando entran en conflicto. El texto existente se interrumpe en la respuesta a la segunda de estas afirmaciones; el resto se conoce gracias al compendio de Ibn al-Mawsili."
  fr: "Un ouvrage d'Ibn Qayyim al-Jawziyya (mort en 751 AH) critiquant l'interprétation figurative (ta'wil) des textes relatifs aux attributs de Dieu par les théologiens. Ce livre, en vingt-quatre chapitres, dont le dernier traite des « quatre idoles », affirme que les textes révélés ne sont que des preuves verbales ne conférant aucune certitude, que les versets sur les attributs sont figuratifs, que les hadiths isolés sont dépourvus de connaissance et que, en cas de contradiction, la raison prime sur la révélation. Le texte qui nous est parvenu s'interrompt à la réponse au deuxième point; la suite nous est connue grâce à l'abrégé d'Ibn al-Mawsili."
  ur: "ابن قیم الجوزیہ ⁦(متوفی 751 ہجری)⁩ کی ایک کتاب جو الہٰیات کے ماہرین کی علامتی تشریح ⁦(تاویل)⁩ پر تنقید کرتی ہے جو کہ خدا کی صفات پر مشتمل ہے، چوبیس ابواب میں، آخری 'چار بتوں' پر: جو نازل شدہ نصوص اس بات کا ثبوت ہیں کہ بعض آیات زبانی نہیں ہیں، اس بات کا کوئی ثبوت نہیں ہے کہ علامتی طور پر، یہ کہ تنہا رپورٹیں کوئی علم نہیں دیتیں، اور جب وہ متصادم ہوتے ہیں تو یہ وجہ وحی پر مقدم ہوتی ہے۔ موجودہ متن ان میں سے دوسرے کے جواب میں ٹوٹ جاتا ہے۔ باقی ابن الموسیلی کے اختصار سے معلوم ہوتا ہے۔"
  tr: "İbn Kayyim al-Jawziyya'nın (ö. 751 Hicri) niteliklerin metinlerinin teolojik yorumunu yirmi dört bölümden oluşan eleştiren bir kitabı, sonuncusu 'Dört Taghit'te yer alır: vahiy metinlerinin kesinlik sağlamayan sözlü kanıtlar olduğu, sıfat ayetlerinin mecazi olduğu, yalnız raporların bilgiye fayda sağlamadığı ve çatışma durumlarında aklın aktarımın önüne geçtiği; var olan ikinci Taghut'u çürütmekle sonuçlanır ve geri kalan şey İbn al-Mawsili'nin 'Mukhtasar al-Sawa'iq' adlı eserinden bilinir."
  id: "Sebuah buku karya Ibn Qayyim al-Jawziyya (wafat 751 H) yang mengkritik interpretasi teologis atas teks atribut, dalam dua puluh empat bab, yang terakhir ada dalam 'Empat Taghits': bahwa teks-teks wahyu adalah bukti verbal yang tidak memberikan kepastian, bahwa ayat-ayat atribut bersifat metaforis, bahwa laporan tunggal tidak menguntungkan pengetahuan, dan bahwa akal lebih diutamakan daripada transmisi dalam kasus konflik; apa yang ada berakhir dengan membantah Taghut kedua, dan sisanya diketahui dari 'Mukhtasar al-Sawa'iq' karya Ibn al-Mawsili."
