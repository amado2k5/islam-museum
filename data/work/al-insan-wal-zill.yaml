summary:
  ar: "مسرحية من فصلين لمصطفى محمود، بطلها المستشار رحمي سعودي، قاضٍ يحكم بالإعدام على متهم يعترف بالقتل، ثم تطارده أطياف من حكم عليهم حتى يقف متهماً أمام محكمة منهم تقضي بأن «يسلَّم إلى ضميره» {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}."
  en: "A play in two acts by Mostafa Mahmoud whose hero, the judge Rahmi Sa'udi, sentences to death a defendant who confesses to murder, and is then haunted by the shades of those he has condemned until he stands accused before a court of them that rules he be 'handed over to his conscience' {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}."
  ur: "مصطفیٰ محمود کا دو ایکٹ کا ڈرامہ، جس کا ہیرو جج رحمی سعودی قتل کا اعتراف کرنے والے ایک ملزم کو موت کی سزا دیتا ہے، پھر اپنے سزا یافتہ لوگوں کے سایوں کے تعاقب میں رہتا ہے، یہاں تک کہ انہی کی ایک عدالت کے سامنے ملزم بن کر کھڑا ہوتا ہے جو فیصلہ دیتی ہے کہ اسے «اس کے ضمیر کے حوالے کیا جائے» {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}۔"
  es: "Una obra en dos actos de Mostafa Mahmoud cuyo héroe, el juez Rahmi Sa'udi, condena a muerte a un acusado que confiesa un asesinato, y luego es perseguido por las sombras de aquellos a quienes ha condenado hasta que es acusado ante un tribunal de ellos que dictamina que debe ser \"entregado a su conciencia\" {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}."
  fr: "Une pièce en deux actes de Mostafa Mahmoud dont le héros, le juge Rahmi Sa'udi, condamne à mort un accusé qui avoue un meurtre, et est ensuite hanté par les ombres de ceux qu'il a condamnés jusqu'à ce qu'il soit accusé devant un tribunal composé d'eux qui décide qu'il soit « livré à sa conscience » {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}."
  tr: "Mustafa Mahmoud'un iki perdelik oyunu, başrolde Yargıç Rahmi Saudi'nin oynadığı bir oyunda, bir yargıç cinayeti itiraf eden bir sanığı cezalandırır, ardından mahkum gruplar tarafından takip edilir ve mahkeme önünde 'vicdanına teslim olması' emretilir {cite:mm-insan-wal-zill-maarif-ed2 s. 7} {cite:mm-insan-wal-zill-maarif-ed2 s. 9} {cite:mm-insan-wal-zill-maarif-ed2 s. 77}."
  id: "Sebuah drama dalam dua babak karya Mustafa Mahmoud, dibintangi oleh Hakim Rahmi Saudi, seorang hakim menjatuhkan hukuman kepada terdakwa yang mengaku membunuh, lalu dikejar oleh kelompok terdakwa sampai salah satu dari mereka berdiri di hadapan pengadilan yang memerintahkannya untuk 'menyerahkan diri pada hati nuraninya' {cite:mm-insan-wal-zill-maarif-ed2 hlm. 7} {cite:mm-insan-wal-zill-maarif-ed2 hlm. 9} {cite:mm-insan-wal-zill-maarif-ed2 hlm. 77}."
