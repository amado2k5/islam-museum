summary:
  ar: "مسرحية من فصلين لمصطفى محمود، بطلها المستشار رحمي سعودي، قاضٍ يحكم بالإعدام على متهم يعترف بالقتل، ثم تطارده أطياف من حكم عليهم حتى يقف متهماً أمام محكمة منهم تقضي بأن «يسلَّم إلى ضميره» {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}."
  en: "A play in two acts by Mostafa Mahmoud whose hero, the judge Rahmi Sa'udi, sentences to death a defendant who confesses to murder, and is then haunted by the shades of those he has condemned until he stands accused before a court of them that rules he be 'handed over to his conscience' {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}."
  ur: "مصطفیٰ محمود کا دو ایکٹ کا ڈرامہ، جس کا ہیرو جج رحمی سعودی قتل کا اعتراف کرنے والے ایک ملزم کو موت کی سزا دیتا ہے، پھر اپنے سزا یافتہ لوگوں کے سایوں کے تعاقب میں رہتا ہے، یہاں تک کہ انہی کی ایک عدالت کے سامنے ملزم بن کر کھڑا ہوتا ہے جو فیصلہ دیتی ہے کہ اسے «اس کے ضمیر کے حوالے کیا جائے» {cite:mm-insan-wal-zill-maarif-ed2 p. 7} {cite:mm-insan-wal-zill-maarif-ed2 p. 9} {cite:mm-insan-wal-zill-maarif-ed2 p. 77}۔"
