id: work/fatwa-iifa-261-mental-illness-and-legal-capacity
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 261 (6/26) بشأن أثر الأمراض النفسية على الأهلية في الشريعة الإسلامية", en: "IIFA resolution 261 (6/26) on the effect of mental illness on legal capacity in Islamic law", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 261 (6/26): اسلامی شریعت میں نفسیاتی امراض کا اہلیت پر اثر" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة عرّف فيه الأهلية بأنها صلاحية الإنسان لوجوب الحقوق له وعليه وصحة التصرفات الصادرة عنه، وهي أهلية وجوب وأهلية أداء تتعلق بالقدرة على فهم الخطاب بالعقل والعمل به بالبدن، وعرّف الأمراض النفسية بأنها مجموعة أعراض متلازمة ذات دلالة سريرية تؤثر في إدراك الفرد أو سلوكه أو وجدانه وتسبب ضعفًا أو اختلالًا في أدائه. وقرر أن الأصل أن المريض النفسي البالغ كامل الأهلية مسؤول مسؤولية كاملة عن تصرفاته ما لم يثبت غير ذلك من جهة اختصاص معتمدة، وأن الأمراض النفسية عند أهل الاختصاص ثلاثة أنواع: مفقدة للأهلية ومنقصة لها وغير مؤثرة فيها، وأن المعيار في ذلك مدى التأثير في الإدراك والتمييز والفهم وسلامة اتخاذ القرار، وهو أمر منوط بالأطباء النفسيين، وأن المريض يكون فاقدًا لأهلية الأداء إذا ثبت فقدانه القدرة على الإدراك والتمييز أو السيطرة على تصرفاته وناقصها إذا نقصت، وأن القضاء هو الذي يقرر فقدان القدرة ونقصانها. وأوصى بدورات تثقيفية للعاملين في القضاء والإفتاء عن الأمراض النفسية، ودورات مشتركة بين الأطباء والفقهاء والقضاة لإعداد أدلة إرشادية مشتركة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its twenty-sixth session in Doha, which defined legal capacity (ahliyya) as a person's fitness to bear rights and duties and for his acts to be valid, of two kinds, capacity to bear obligations and capacity to act, the latter resting on the ability to understand the law by reason and to act on it by the body; and defined mental illnesses as clinically significant syndromes that affect a person's perception, behaviour or emotions and cause weakness or disturbance in his functioning. It resolved that the default is that an adult mentally ill person of full capacity is fully responsible for his acts unless an accredited competent authority establishes otherwise; that specialists divide mental illnesses into three kinds, those that remove capacity, those that diminish it and those that do not affect it; that the criterion is the degree of effect on perception, discernment, understanding and sound decision-making, a specialist matter entrusted to psychiatrists; that a patient loses the capacity to act when loss of the ability to perceive and discern or to control his acts is established, and has diminished capacity when that ability is diminished; and that the judiciary decides the loss or diminution. It recommended educational courses on mental illness for those working in the judiciary and in fatwa, and joint courses of physicians, jurists and judges to prepare joint specialist guides."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی دوحہ میں چھبیسویں اجلاس کی اجتماعی قرارداد، جس میں اہلیت کی تعریف کی گئی کہ یہ انسان کی حقوق اور فرائض کے ثبوت اور اس کے تصرفات کی صحت کی صلاحیت ہے، جو دو قسم کی ہے، اہلیتِ وجوب اور اہلیتِ ادا، اور اہلیتِ ادا عقل سے خطاب سمجھنے اور بدن سے اس پر عمل کرنے کی قدرت سے متعلق ہے؛ اور نفسیاتی امراض کی تعریف کی گئی کہ یہ طبی اعتبار سے معنی خیز علامات کے مجموعے ہیں جو فرد کے ادراک، رویے یا جذبات پر اثر ڈالتے اور اس کی کارکردگی میں کمزوری یا خلل پیدا کرتے ہیں۔ اس نے فیصلہ کیا کہ اصل یہ ہے کہ بالغ اور کامل اہلیت والا نفسیاتی مریض اپنے تصرفات کا پوری طرح ذمہ دار ہے جب تک کوئی معتبر مختص ادارہ اس کے خلاف ثابت نہ کرے؛ ماہرین نفسیاتی امراض کو تین قسموں میں بانٹتے ہیں: اہلیت ختم کرنے والے، کم کرنے والے اور اثر نہ ڈالنے والے؛ معیار ادراک، تمیز، فہم اور درست فیصلہ سازی پر اثر کی مقدار ہے، جو ماہرینِ نفسیات کے سپرد ایک تخصصی معاملہ ہے؛ مریض اہلیتِ ادا سے محروم ہوتا ہے جب ادراک و تمیز یا اپنے تصرفات پر کنٹرول کی قدرت کا فقدان ثابت ہو، اور ناقص الاہلیت جب وہ قدرت کم ہو؛ اور عدالت ہی قدرت کے فقدان یا کمی کا فیصلہ کرتی ہے۔ اس نے عدلیہ اور افتا میں کام کرنے والوں کے لیے نفسیاتی امراض پر تعلیمی کورسوں اور ڈاکٹروں، فقہا اور قاضیوں کے مشترکہ کورسوں کی سفارش کی تاکہ مشترکہ تخصصی رہنما اصول تیار کیے جائیں۔"
