label: { ar: "قرار مجمع الفقه الإسلامي الدولي 261 (6/26) بشأن أثر الأمراض النفسية على الأهلية في الشريعة الإسلامية", en: "IIFA resolution 261 (6/26) on the effect of mental illness on legal capacity in Islamic law", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 261 (6/26): اسلامی شریعت میں نفسیاتی امراض کا اہلیت پر اثر", es: "Resolución 261 (6/26) de la IIFA sobre el efecto de la enfermedad mental en la capacidad jurídica en el derecho islámico.", fr: "Résolution 261 (6/26) de l'IIFA sur l'effet de la maladie mentale sur la capacité juridique en droit islamique" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة عرّف فيه الأهلية بأنها صلاحية الإنسان لوجوب الحقوق له وعليه وصحة التصرفات الصادرة عنه، وهي أهلية وجوب وأهلية أداء تتعلق بالقدرة على فهم الخطاب بالعقل والعمل به بالبدن، وعرّف الأمراض النفسية بأنها مجموعة أعراض متلازمة ذات دلالة سريرية تؤثر في إدراك الفرد أو سلوكه أو وجدانه وتسبب ضعفًا أو اختلالًا في أدائه. وقرر أن الأصل أن المريض النفسي البالغ كامل الأهلية مسؤول مسؤولية كاملة عن تصرفاته ما لم يثبت غير ذلك من جهة اختصاص معتمدة، وأن الأمراض النفسية عند أهل الاختصاص ثلاثة أنواع: مفقدة للأهلية ومنقصة لها وغير مؤثرة فيها، وأن المعيار في ذلك مدى التأثير في الإدراك والتمييز والفهم وسلامة اتخاذ القرار، وهو أمر منوط بالأطباء النفسيين، وأن المريض يكون فاقدًا لأهلية الأداء إذا ثبت فقدانه القدرة على الإدراك والتمييز أو السيطرة على تصرفاته وناقصها إذا نقصت، وأن القضاء هو الذي يقرر فقدان القدرة ونقصانها. وأوصى بدورات تثقيفية للعاملين في القضاء والإفتاء عن الأمراض النفسية، ودورات مشتركة بين الأطباء والفقهاء والقضاة لإعداد أدلة إرشادية مشتركة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its twenty-sixth session in Doha, which defined legal capacity (ahliyya) as a person's fitness to bear rights and duties and for his acts to be valid, of two kinds, capacity to bear obligations and capacity to act, the latter resting on the ability to understand the law by reason and to act on it by the body; and defined mental illnesses as clinically significant syndromes that affect a person's perception, behaviour or emotions and cause weakness or disturbance in his functioning. It resolved that the default is that an adult mentally ill person of full capacity is fully responsible for his acts unless an accredited competent authority establishes otherwise; that specialists divide mental illnesses into three kinds, those that remove capacity, those that diminish it and those that do not affect it; that the criterion is the degree of effect on perception, discernment, understanding and sound decision-making, a specialist matter entrusted to psychiatrists; that a patient loses the capacity to act when loss of the ability to perceive and discern or to control his acts is established, and has diminished capacity when that ability is diminished; and that the judiciary decides the loss or diminution. It recommended educational courses on mental illness for those working in the judiciary and in fatwa, and joint courses of physicians, jurists and judges to prepare joint specialist guides."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی دوحہ میں چھبیسویں اجلاس کی اجتماعی قرارداد، جس میں اہلیت کی تعریف کی گئی کہ یہ انسان کی حقوق اور فرائض کے ثبوت اور اس کے تصرفات کی صحت کی صلاحیت ہے، جو دو قسم کی ہے، اہلیتِ وجوب اور اہلیتِ ادا، اور اہلیتِ ادا عقل سے خطاب سمجھنے اور بدن سے اس پر عمل کرنے کی قدرت سے متعلق ہے؛ اور نفسیاتی امراض کی تعریف کی گئی کہ یہ طبی اعتبار سے معنی خیز علامات کے مجموعے ہیں جو فرد کے ادراک، رویے یا جذبات پر اثر ڈالتے اور اس کی کارکردگی میں کمزوری یا خلل پیدا کرتے ہیں۔ اس نے فیصلہ کیا کہ اصل یہ ہے کہ بالغ اور کامل اہلیت والا نفسیاتی مریض اپنے تصرفات کا پوری طرح ذمہ دار ہے جب تک کوئی معتبر مختص ادارہ اس کے خلاف ثابت نہ کرے؛ ماہرین نفسیاتی امراض کو تین قسموں میں بانٹتے ہیں: اہلیت ختم کرنے والے، کم کرنے والے اور اثر نہ ڈالنے والے؛ معیار ادراک، تمیز، فہم اور درست فیصلہ سازی پر اثر کی مقدار ہے، جو ماہرینِ نفسیات کے سپرد ایک تخصصی معاملہ ہے؛ مریض اہلیتِ ادا سے محروم ہوتا ہے جب ادراک و تمیز یا اپنے تصرفات پر کنٹرول کی قدرت کا فقدان ثابت ہو، اور ناقص الاہلیت جب وہ قدرت کم ہو؛ اور عدالت ہی قدرت کے فقدان یا کمی کا فیصلہ کرتی ہے۔ اس نے عدلیہ اور افتا میں کام کرنے والوں کے لیے نفسیاتی امراض پر تعلیمی کورسوں اور ڈاکٹروں، فقہا اور قاضیوں کے مشترکہ کورسوں کی سفارش کی تاکہ مشترکہ تخصصی رہنما اصول تیار کیے جائیں۔"
  es: "Una resolución colectiva de la Academia Internacional de Fiqh Islámico en su vigésimo sexta sesión en Doha, que definió la capacidad jurídica (ahliyya) como la aptitud de una persona para tener derechos y deberes y para que sus actos sean válidos, de dos tipos, capacidad para tener obligaciones y capacidad para actuar, esta última basada en la capacidad de entender la ley por la razón y actuar sobre ella por medio del cuerpo; y definió las enfermedades mentales como síndromes clínicamente significativos que afectan la percepción, el comportamiento o las emociones de una persona y causan debilidad o alteración en su funcionamiento. Resolvió que por defecto es que una persona adulta con enfermedad mental con plena capacidad es plenamente responsable de sus actos a menos que una autoridad competente acreditada establezca lo contrario; que los especialistas dividen las enfermedades mentales en tres tipos, las que eliminan la capacidad, las que la disminuyen y las que no la afectan; que el criterio es el grado de efecto sobre la percepción, el discernimiento, la comprensión y la toma de decisiones sanas, un asunto especializado confiado a los psiquiatras; Que un paciente pierde la capacidad de actuar cuando se constata la pérdida de la capacidad de percibir, discernir o controlar sus actos, y que su capacidad se ve disminuida cuando dicha capacidad se reduce; y que el poder judicial decide sobre la pérdida o disminución. Recomendó cursos de formación sobre enfermedades mentales para quienes trabajan en el poder judicial y en la emisión de fatuas, así como cursos conjuntos para médicos, juristas y jueces con el fin de elaborar guías especializadas conjuntas."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa vingt-sixième session à Doha, définit la capacité juridique (ahliyya) comme l'aptitude d'une personne à assumer des droits et des devoirs et à ce que ses actes soient valides. Cette capacité se divise en deux catégories: la capacité de contracter des obligations et la capacité d'agir, cette dernière reposant sur l'aptitude à comprendre la loi par la raison et à l'appliquer par le corps. L'Académie définit également les maladies mentales comme des syndromes cliniquement significatifs affectant la perception, le comportement ou les émotions d'une personne et entraînant une faiblesse ou une perturbation de son fonctionnement. Elle stipule que, par défaut, une personne majeure atteinte de maladie mentale et jouissant de sa pleine capacité est pleinement responsable de ses actes, sauf décision contraire d'une autorité compétente agréée. Les spécialistes classent les maladies mentales en trois catégories: celles qui entraînent la suppression de la capacité, celles qui la diminuent et celles qui ne l'affectent pas. Le critère retenu est le degré d'atteinte à la perception, au discernement, à la compréhension et à la capacité de décision, une compétence spécialisée confiée aux psychiatres. Un patient perd sa capacité d'agir lorsqu'il est établi qu'il est incapable de percevoir, de discerner ou de contrôler ses actes, et sa capacité est diminuée lorsque cette capacité est réduite. et que le pouvoir judiciaire décide de la perte ou de la diminution. Il a été recommandé de suivre des formations sur les maladies mentales à l'intention des personnes travaillant dans le système judiciaire et dans le domaine de la fatwa, ainsi que des formations conjointes pour les médecins, les juristes et les juges afin d'élaborer des guides spécialisés communs."
