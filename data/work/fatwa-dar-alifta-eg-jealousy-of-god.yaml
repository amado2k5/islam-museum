label: { ar: "بيان معنى الغيرة في حق الله تعالى", en: "The meaning of jealousy in respect of God", ur: "اللہ کے حق میں غیرت کا معنی" }
summary:
  ar: "سائل سأل عن معنى الغيرة الواردة في الحديث في حق الله تعالى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22457)⁩ أن الغيرة الواردة في حق الله غيرة مجازية محمولة على أن الله يبغض الفواحش ولذا حرّمها على عباده، على ما فصّل الجواب في محامل النص."
  en: "A questioner asked the meaning of the jealousy mentioned in the hadith in respect of God. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22457) answered that the jealousy attributed to God is a figurative jealousy carried upon the sense that God hates indecencies and therefore forbade them to His servants, as the answer details in construing the text."
  ur: "ایک سائل نے حدیث میں اللہ کے حق میں آنے والی غیرت کے معنی پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22457)⁩ نے جواب دیا کہ اللہ کے حق میں آنے والی غیرت مجازی ہے اور اس کا مطلب یہ ہے کہ اللہ بے حیائی کے کاموں سے نفرت کرتا ہے اسی لیے اپنے بندوں پر انہیں حرام کیا، جیسا کہ جواب میں متن کی تأویل بیان ہوئی۔"
