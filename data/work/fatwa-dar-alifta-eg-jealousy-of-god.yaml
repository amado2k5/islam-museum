id: work/fatwa-dar-alifta-eg-jealousy-of-god
class: work
kind: fatwa
label: { ar: "بيان معنى الغيرة في حق الله تعالى", en: "The meaning of jealousy in respect of God", ur: "اللہ کے حق میں غیرت کا معنی", es: "El significado de los celos con respecto a Dios", fr: "La signification de la jalousie à l'égard de Dieu" }
summary:
  ar: "سائل سأل عن معنى الغيرة الواردة في الحديث في حق الله تعالى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22457)⁩ أن الغيرة الواردة في حق الله غيرة مجازية محمولة على أن الله يبغض الفواحش ولذا حرّمها على عباده، على ما فصّل الجواب في محامل النص."
  en: "A questioner asked the meaning of the jealousy mentioned in the hadith in respect of God. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22457) answered that the jealousy attributed to God is a figurative jealousy carried upon the sense that God hates indecencies and therefore forbade them to His servants, as the answer details in construing the text."
  ur: "ایک سائل نے حدیث میں اللہ کے حق میں آنے والی غیرت کے معنی پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22457)⁩ نے جواب دیا کہ اللہ کے حق میں آنے والی غیرت مجازی ہے اور اس کا مطلب یہ ہے کہ اللہ بے حیائی کے کاموں سے نفرت کرتا ہے اسی لیے اپنے بندوں پر انہیں حرام کیا، جیسا کہ جواب میں متن کی تأویل بیان ہوئی۔"
  es: "Un consultante preguntó por el significado de los celos mencionados en el hadiz con respecto a Dios. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22457) respondió que los celos atribuidos a Dios son celos figurados, basados en el sentido de que Dios aborrece las indecencias y, por lo tanto, las prohibió a sus siervos, como se detalla en la interpretación del texto."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22457) sur la signification de la jalousie mentionnée dans le hadith à l'égard de Dieu. Il a répondu que cette jalousie attribuée à Dieu est une jalousie figurative, signifiant que Dieu abhorre les indécences et les interdit donc à Ses serviteurs, comme l'explique la réponse dans son interprétation du texte."
