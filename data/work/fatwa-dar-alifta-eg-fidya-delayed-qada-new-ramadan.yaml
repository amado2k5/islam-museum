id: work/fatwa-dar-alifta-eg-fidya-delayed-qada-new-ramadan
class: work
kind: fatwa
label: { ar: "مدى لزوم الفدية بسبب تأخير قضاء رمضان لعذر حتى دخل رمضان آخر", en: "Is fidya due when an excused delay of Ramadan make-up runs into the next Ramadan?", ur: "عذر کی وجہ سے قضاء مؤخر کر کے اگلا رمضان آ جائے تو فدیہ کتنا لازم ہے", es: "¿Se debe pagar la fidya cuando un retraso justificado en la recuperación del Ramadán se extiende hasta el siguiente Ramadán?", fr: "La fidya est-elle due lorsqu'un retard excusé dans la reprise des cours du Ramadan se prolonge jusqu'au Ramadan suivant ?", tr: "Ramazan'ın başka bir Ramazan gelmesine kadar bahane olarak uydurulmasının gecikmesi nedeniyle fidye gerekliliğinin boyutu", id: "Tingkat kebutuhan tebusan karena keterlambatan dalam menebus Ramadan sebagai alasan sampai Ramadan berikutnya masuk" }
summary:
  ar: "سائلة أفطرت أيامًا من رمضان بسبب العادة الشهرية ثم حملت بعد رمضان مباشرة قبل تمكنها من القضاء ودخل عليها رمضان آخر، فسألت عن الفدية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22460)⁩ ببيان مدى لزوم الفدية مع القضاء في حالها على ما فصّل الجواب."
  en: "A woman missed days of Ramadan for her monthly cycle, then became pregnant immediately after Ramadan before she could make them up, and another Ramadan came upon her — she asked about fidya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22460) answered by setting out how far fidya is due together with making up in her situation, as the answer details."
  ur: "ایک خاتون ماہواری کی وجہ سے رمضان کے دنوں میں افطار پر رہی، پھر قضاء سے پہلے حاملہ ہو گئی اور اگلا رمضان آ گیا — اس نے فدیہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22460)⁩ نے جواب میں اس کی صورت میں قضاء کے ساتھ فدیہ کتنا لازم ہے بیان کیا، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer omitió días de Ramadán debido a su menstruación, quedó embarazada inmediatamente después de Ramadán antes de poder recuperarlos, y llegó otro Ramadán. Preguntó sobre la fidya (compensación por la menstruación). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22460) respondió detallando hasta qué fecha debía pagar la fidya y cómo compensarla en su caso, como se explica en la respuesta."
  fr: "Une femme a manqué des jours de Ramadan en raison de ses règles, puis est tombée enceinte immédiatement après le Ramadan, avant de pouvoir rattraper les jours manqués. Un autre Ramadan s'est alors présenté et elle a posé une question concernant la fidya. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22460) a répondu en précisant la durée de la fidya due et les modalités de rattrapage dans sa situation, comme indiqué dans la réponse."
  tr: "Bir soru soran kişi adet dönemi nedeniyle Ramazan ayında birkaç gün orucu bozdu, ardından Ramazan sonrası hemen hamile kaldı ve orucu telafi edemedi, ardından başka bir Ramazan başladı. Fidya hakkında sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22460), cevapta detaylandırıldığı üzere, uydurma fidyanın ne ölçüde zorunlu olduğunu açıkladı."
  id: "Seorang penanya memutus puasanya selama beberapa hari Ramadan karena menstruasi, lalu hamil segera setelah Ramadan sebelum sempat berpuasa, dan Ramadan lain dimulai. Dia bertanya tentang fidya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22460) menjawab dengan menjelaskan sejauh mana fidya wajib jika itu dibuat-buat jika dibuat-buat, seperti yang dijelaskan dalam jawabannya."
