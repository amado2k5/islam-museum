id: work/fatwa-dar-alifta-eg-fidya-delayed-qada-new-ramadan
class: work
kind: fatwa
label: { ar: "مدى لزوم الفدية بسبب تأخير قضاء رمضان لعذر حتى دخل رمضان آخر", en: "Is fidya due when an excused delay of Ramadan make-up runs into the next Ramadan?", ur: "عذر کی وجہ سے قضاء مؤخر کر کے اگلا رمضان آ جائے تو فدیہ کتنا لازم ہے" }
summary:
  ar: "سائلة أفطرت أيامًا من رمضان بسبب العادة الشهرية ثم حملت بعد رمضان مباشرة قبل تمكنها من القضاء ودخل عليها رمضان آخر، فسألت عن الفدية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22460)⁩ ببيان مدى لزوم الفدية مع القضاء في حالها على ما فصّل الجواب."
  en: "A woman missed days of Ramadan for her monthly cycle, then became pregnant immediately after Ramadan before she could make them up, and another Ramadan came upon her — she asked about fidya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22460) answered by setting out how far fidya is due together with making up in her situation, as the answer details."
  ur: "ایک خاتون ماہواری کی وجہ سے رمضان کے دنوں میں افطار پر رہی، پھر قضاء سے پہلے حاملہ ہو گئی اور اگلا رمضان آ گیا — اس نے فدیہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22460)⁩ نے جواب میں اس کی صورت میں قضاء کے ساتھ فدیہ کتنا لازم ہے بیان کیا، جیسا کہ جواب میں تفصیل ہے۔"
