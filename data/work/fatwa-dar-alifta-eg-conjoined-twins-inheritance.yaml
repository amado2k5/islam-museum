summary:
  ar: "سائل سأل عن أحكام ميراث التوائم الملتصقة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21512)⁩ ببيان أن التوائم الملتصقة إذا كانت من نوع الطفيلية التي تكون في صورة جسد واحد ينمو بشكل صحيح ويحمل أعضاء إضافية فلها حكمها وبيّن الجواب الأحكام على وجهها."
  en: "A questioner asked about the inheritance rules for conjoined twins. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21512) answered by setting out that parasitic-type conjoined twins — one properly formed body carrying additional organs — have their own ruling, which the answer details."
  ur: "ایک سائل نے ملتصق جڑواں بچوں کے وراثت کے احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21512)⁩ نے جواب میں طفیلی نوع کے ملتصق جڑواں کا حکم بیان کیا۔"
