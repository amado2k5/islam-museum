summary:
  ar: "المنصف شرح كتاب التصريف لأبي عثمان المازني، كتاب في الصرف والتصريف لمؤلفه ابن جني، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 392هـ / 1002م {cite:qaf-al-munsif-ibn-jinni}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book ID 10545 {cite:shamela-org-pdf-al-munsif-ibn-jinni}. لم يقرأ المتحف الكتاب."
  en: "al-Munsif (Sharh Kitab al-Tasrif li-Abi Uthman al-Mazini), a book on morphology (sarf and tasrif) by Ibn Jinni; its date in a research summary supplied to the museum is d. 392 AH / 1002 CE {cite:qaf-al-munsif-ibn-jinni}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book ID 10545 {cite:shamela-org-pdf-al-munsif-ibn-jinni}. The museum has not read the book."
  ur: "المنصف شرح كتاب التصريف لأبي عثمان المازني، صرف و تصریف پر ایک کتاب، مصنف ابن جني؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 392ھ / 1002ء {cite:qaf-al-munsif-ibn-jinni}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book ID 10545 {cite:shamela-org-pdf-al-munsif-ibn-jinni}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Munsif (Sharh Kitab al-Tasrif li-Abi Uthman al-Mazini), livre sur la morphologie (sarf et tasrif) de Ibn Jinni ; sa date dans une synthèse de recherche remise au musée : m. 392 H / 1002 {cite:qaf-al-munsif-ibn-jinni}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book ID 10545 {cite:shamela-org-pdf-al-munsif-ibn-jinni}. Le musée n'a pas lu le livre."
  es: "al-Munsif (Sharh Kitab al-Tasrif li-Abi Uthman al-Mazini), libro sobre morfología (sarf y tasrif) de Ibn Jinni; su fecha en un resumen de investigación entregado al museo: m. 392 H. / 1002 {cite:qaf-al-munsif-ibn-jinni}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book ID 10545 {cite:shamela-org-pdf-al-munsif-ibn-jinni}. El museo no ha leído el libro."
  tr: "El-Münsif, Ebu Osman el-Mazini'nin 'Morfoloji' adlı kitabını, yazarı İbn Cinci'nin morfoloji ve morfoloji üzerine bir kitabı ve tarihini müzeye sunulan araştırma özetine göre açıkladı: ö. 392 Hicri / 1002 M.S. {atıf:qaf-al-munsif-ibn-jinni}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Evet, ve Kapsamlı Kütüphane'deki kitap: Kitap ID 10545 {atıf:şamela-org-pdf-al-munsif-ibn-jinni}. Müze kitabı okumadı."
  id: "Al-Munsif menjelaskan buku 'Morfologi' karya Abu Uthman al-Mazini, sebuah buku tentang morfologi dan morfologi karya penulisnya Ibn Jinni, serta sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 392 H / 1002 M {cite:qaf-al-munsif-ibn-jinni}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku di Perpustakaan Komprehensif: ID Buku 10545 {cite:shamela-org-pdf-al-munsif-ibn-jinni}. Museum tidak membaca buku tersebut."
