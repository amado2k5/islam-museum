label: { ar: "كشف المحجوب", en: "Kashf al-Mahjub (The Unveiling of the Veiled)", ur: "کشف المحجوب" }
summary:
  ar: "كتاب أبي الحسن علي بن عثمان الجلابي الهجويري الغزنوي بالفارسية في التصوف، يقول مقدّم ترجمته العربية إنه أقدم مؤلف في التصوف بالفارسية وأول كتاب منظم في أصوله النظرية والعملية، كتبه جواباً لسؤال أبي سعيد الهجويري عن طريقة التصوف ومقامات الصوفية، بدأه نحو 435هـ وأتمه نحو 442هـ، واعتمد فيه على اللمع والرسالة القشيرية وطبقات السلمي {cite:kashf-al-mahjub-qandil-2007-v1 p. 11} {cite:kashf-al-mahjub-qandil-2007-v1 p. 12} {cite:kashf-al-mahjub-qandil-2007-v1 p. 200}."
  en: "The Persian book on Sufism by Abu al-Hasan 'Ali ibn 'Uthman al-Jullabi al-Hujwiri al-Ghaznawi, which the introducer of its Arabic translation calls the oldest work on Sufism in Persian and the first systematic book on its theory and practice; written in answer to Abu Sa'id al-Hujwiri's question about the Sufi path and its stations, begun around 435 AH and finished around 442 AH, drawing on al-Luma', al-Qushayri's Risala and al-Sulami's Tabaqat {cite:kashf-al-mahjub-qandil-2007-v1 p. 11} {cite:kashf-al-mahjub-qandil-2007-v1 p. 12} {cite:kashf-al-mahjub-qandil-2007-v1 p. 200}."
  ur: "ابو الحسن علی بن عثمان جلابی ہجویری غزنوی کی تصوف پر فارسی کتاب، جسے اس کے عربی ترجمے کے مقدمہ نگار فارسی میں تصوف کی قدیم ترین تصنیف اور اس کے نظری و عملی اصولوں پر پہلی منظم کتاب کہتے ہیں؛ ابو سعید ہجویری کے طریقِ تصوف اور صوفیہ کے مقامات کے بارے میں سوال کے جواب میں لکھی گئی، تقریباً 435ھ میں شروع اور 442ھ کے قریب مکمل ہوئی، اور اللمع، رسالۂ قشیریہ اور سلمی کی طبقات پر مبنی ہے {cite:kashf-al-mahjub-qandil-2007-v1 p. 11} {cite:kashf-al-mahjub-qandil-2007-v1 p. 12} {cite:kashf-al-mahjub-qandil-2007-v1 p. 200}۔"
