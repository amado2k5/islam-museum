id: work/fatwa-aliftaa-jo-paying-oath-expiation-through-a-charity
class: work
kind: fatwa
label: { ar: "دفع كفارة اليمين إلى جهة خيرية", en: "Paying oath expiation through a charity", ur: "قسم کا کفارہ کسی خیراتی ادارے کے ذریعے دینا", es: "Pagar la expiación del juramento a través de una organización benéfica.", fr: "Payer l'expiation de son serment par le biais d'une œuvre de charité" }
summary:
  ar: "سؤال عن دفع كفارة اليمين إلى جهة خيرية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في توكيل جهة خيرية تطعم الفقراء والمساكين بإخراج الكفارة، لأن التوكيل في تفرقة الزكاة والكفارة والنذر جائز. أجابت الدائرة بأنه لا حرج على المسلم أن يوكل من يخرج عنه الكفارة، وأن الفقهاء نصوا على جواز التوكيل في تفرقة الزكاة والكفارة والنذر. ونقلت من مغني المحتاج (3/237) أن للمرء أن يؤدي زكاة ماله بنفسه وله أن يوكل في ذلك."
  en: "A question about paying oath expiation through a charity, in which Jordan's General Iftaa Department answered that there is no objection to appointing a charity that feeds the poor to pay the expiation, since agency in distributing zakat, expiation and vows is permitted. The Department answered that there is no objection to a Muslim appointing someone to pay the expiation on his behalf, and that jurists stated that agency is permitted in distributing zakat, expiation and vows. It quoted Mughni al-Muhtaj (3/237) that a person may pay the zakat on his wealth himself and may also appoint an agent to do so."
  ur: "قسم کا کفارہ کسی خیراتی ادارے کے ذریعے دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فقرا کو کھانا کھلانے والے خیراتی ادارے کو کفارہ ادا کرنے کا وکیل بنانے میں کوئی حرج نہیں، کیونکہ زکوٰۃ، کفارہ اور نذر کی تقسیم میں وکالت جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر کوئی حرج نہیں کہ وہ کسی کو اپنی طرف سے کفارہ ادا کرنے کا وکیل بنائے، اور فقہا نے زکوٰۃ، کفارہ اور نذر کی تقسیم میں وکالت کے جواز کی تصریح کی ہے۔ اس نے مغنی المحتاج (3/237) سے نقل کیا کہ آدمی اپنے مال کی زکوٰۃ خود ادا کر سکتا ہے اور اس کے لیے وکیل بھی بنا سکتا ہے۔"
  es: "Una pregunta sobre el pago de la expiación de un juramento a través de una organización benéfica, a la que el Departamento General de Iftaa de Jordania respondió que no hay objeción a que una organización benéfica que alimenta a los pobres pague la expiación, ya que la representación en la distribución del zakat, la expiación y los votos está permitida. El Departamento respondió que no hay objeción a que un musulmán designe a alguien para pagar la expiación en su nombre, y que los juristas han declarado que la representación está permitida en la distribución del zakat, la expiación y los votos. Citó a Mughni al-Muhtaj (3/237) que dice que una persona puede pagar el zakat sobre su patrimonio personalmente y también puede designar a un agente para que lo haga."
  fr: "Concernant la question du paiement de l'expiation des vœux par le biais d'une œuvre de charité, le Département général de la Iftaa de Jordanie a répondu qu'il n'y a aucune objection à désigner une organisation caritative venant en aide aux pauvres pour s'acquitter de cette expiation, la représentation étant permise dans la distribution de la zakat, des expiations et des vœux. Le Département a précisé qu'un musulman peut désigner une personne pour payer l'expiation en son nom et que les juristes ont statué que la représentation est autorisée dans la distribution de la zakat, des expiations et des vœux. Il a cité Mughni al-Muhtaj (3/237) selon lequel une personne peut s'acquitter elle-même de la zakat sur ses biens et désigner un mandataire pour ce faire."
