id: work/fatwa-aliftaa-jo-paying-oath-expiation-through-a-charity
class: work
kind: fatwa
label: { ar: "دفع كفارة اليمين إلى جهة خيرية", en: "Paying oath expiation through a charity", ur: "قسم کا کفارہ کسی خیراتی ادارے کے ذریعے دینا" }
summary:
  ar: "سؤال عن دفع كفارة اليمين إلى جهة خيرية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في توكيل جهة خيرية تطعم الفقراء والمساكين بإخراج الكفارة، لأن التوكيل في تفرقة الزكاة والكفارة والنذر جائز. أجابت الدائرة بأنه لا حرج على المسلم أن يوكل من يخرج عنه الكفارة، وأن الفقهاء نصوا على جواز التوكيل في تفرقة الزكاة والكفارة والنذر. ونقلت من مغني المحتاج (3/237) أن للمرء أن يؤدي زكاة ماله بنفسه وله أن يوكل في ذلك."
  en: "A question about paying oath expiation through a charity, in which Jordan's General Iftaa Department answered that there is no objection to appointing a charity that feeds the poor to pay the expiation, since agency in distributing zakat, expiation and vows is permitted. The Department answered that there is no objection to a Muslim appointing someone to pay the expiation on his behalf, and that jurists stated that agency is permitted in distributing zakat, expiation and vows. It quoted Mughni al-Muhtaj (3/237) that a person may pay the zakat on his wealth himself and may also appoint an agent to do so."
  ur: "قسم کا کفارہ کسی خیراتی ادارے کے ذریعے دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فقرا کو کھانا کھلانے والے خیراتی ادارے کو کفارہ ادا کرنے کا وکیل بنانے میں کوئی حرج نہیں، کیونکہ زکوٰۃ، کفارہ اور نذر کی تقسیم میں وکالت جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر کوئی حرج نہیں کہ وہ کسی کو اپنی طرف سے کفارہ ادا کرنے کا وکیل بنائے، اور فقہا نے زکوٰۃ، کفارہ اور نذر کی تقسیم میں وکالت کے جواز کی تصریح کی ہے۔ اس نے مغنی المحتاج (3/237) سے نقل کیا کہ آدمی اپنے مال کی زکوٰۃ خود ادا کر سکتا ہے اور اس کے لیے وکیل بھی بنا سکتا ہے۔"
