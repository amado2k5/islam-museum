id: work/fatwa-dar-alifta-eg-inheriting-trademark
class: work
kind: fatwa
label: { ar: "مدى أحقية تناقل المنفعة في العلامة التجارية والاسم التجاري بالميراث", en: "Do trademark and trade-name benefits pass by inheritance?", ur: "کیا تجارتی نشان اور تجارتی نام کا فائدہ میراث میں منتقل ہوتا ہے؟" }
summary:
  ar: "سائل سأل عن انتقال العلامة التجارية والاسم التجاري بالميراث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21846)⁩ أن العلامة التجارية والاسم التجاري يعدان مالًا ويثبت لهما أحكام المال من بيع وغيره وبوفاة صاحبهما تكون ميراثًا لورثته على ما فصّل الجواب."
  en: "A questioner asked whether a trademark and trade name pass by inheritance. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21846) answered that the trademark and trade name count as property carrying property's rulings — sale and the like — and on the owner's death they are inheritance for his heirs, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا تجارتی نشان اور تجارتی نام میراث میں منتقل ہوتے ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21846)⁩ نے جواب دیا کہ یہ مال شمار ہوتے ہیں اور مال کے احکام رکھتے ہیں — بیع وغیرہ — اور مالک کی وفات پر ورثاء کی میراث بنتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
