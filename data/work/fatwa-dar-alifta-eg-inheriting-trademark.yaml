id: work/fatwa-dar-alifta-eg-inheriting-trademark
class: work
kind: fatwa
label: { ar: "مدى أحقية تناقل المنفعة في العلامة التجارية والاسم التجاري بالميراث", en: "Do trademark and trade-name benefits pass by inheritance?", ur: "کیا تجارتی نشان اور تجارتی نام کا فائدہ میراث میں منتقل ہوتا ہے؟", es: "¿Los derechos sobre marcas registradas y nombres comerciales se transmiten por herencia?", fr: "Les avantages liés aux marques de commerce et aux noms commerciaux sont-ils transmissibles par héritage ?", tr: "Marka ve ticari addaki faydayı miras alma hakkının kapsamı", id: "Luas hak untuk mewarisi manfaat dalam merek dagang dan nama dagang" }
summary:
  ar: "سائل سأل عن انتقال العلامة التجارية والاسم التجاري بالميراث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21846)⁩ أن العلامة التجارية والاسم التجاري يعدان مالًا ويثبت لهما أحكام المال من بيع وغيره وبوفاة صاحبهما تكون ميراثًا لورثته على ما فصّل الجواب."
  en: "A questioner asked whether a trademark and trade name pass by inheritance. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21846) answered that the trademark and trade name count as property carrying property's rulings — sale and the like — and on the owner's death they are inheritance for his heirs, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا تجارتی نشان اور تجارتی نام میراث میں منتقل ہوتے ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21846)⁩ نے جواب دیا کہ یہ مال شمار ہوتے ہیں اور مال کے احکام رکھتے ہیں — بیع وغیرہ — اور مالک کی وفات پر ورثاء کی میراث بنتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si una marca registrada y un nombre comercial se transmiten por herencia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21846) respondió que la marca registrada y el nombre comercial se consideran propiedad sujeta a las normas patrimoniales —venta y similares— y que, tras el fallecimiento del propietario, se convierten en herencia para sus herederos, como se detalla en la respuesta."
  fr: "Une question a été posée concernant la transmission successorale des marques et des noms commerciaux. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21846) a répondu que les marques et les noms commerciaux sont considérés comme des biens soumis aux règles qui leur sont applicables (vente, etc.) et qu'au décès du propriétaire, ils sont transmissibles à ses héritiers, comme le précise la réponse."
  tr: "Bir soru soran marka ve ticari adın miras yoluyla devri hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21846), marka ve ticari adın mülk olarak kabul edildiğini ve mülkiyet hükümlerinin onlar için belirlendiğini, ister satış yoluyla ister başka yollarla olsun, ve sahiplerinin ölümünden sonra varislerine miras haline geldiğini yanıtladı; bu durum cevapta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang pengalihan merek dagang dan nama dagang melalui warisan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21846) menjawab bahwa merek dagang dan nama dagang dianggap sebagai properti dan keputusan properti ditetapkan untuk mereka, baik dari penjualan maupun cara lain, dan setelah pemiliknya meninggal, mereka menjadi warisan bagi ahli waris mereka, sebagaimana dijelaskan dalam jawaban."
