summary:
  ar: "تفسير «التحرير والتنوير» لمحمد الطاهر بن عاشور؛ سمّاه المؤلف «تحرير المعنى السديد، وتنوير العقل الجديد، من تفسير الكتاب المجيد»، وبيّن في مقدمته أنه يذكر أغراض كل سورة ويشرح معاني المفردات {cite:tahrir-wa-l-tanwir-ibn-ashur-dar-al-tunisia vol. 1 p. 9}."
  en: "Muhammad al-Tahir ibn Ashur's tafsir al-Tahrir wa-l-Tanwir. He gave it the full title 'Clarifying the Right Meaning and Illuminating the New Mind, from the Tafsir of the Glorious Book', and his introduction says that he states the aims of every surah and explains the vocabulary {cite:tahrir-wa-l-tanwir-ibn-ashur-dar-al-tunisia vol. 1 p. 9}."
  ur: "محمد طاہر بن عاشور کی تفسیر «التحریر والتنویر»؛ مصنف نے اس کا پورا نام «تحریر المعنی السدید وتنویر العقل الجدید من تفسیر الکتاب المجید» رکھا، اور مقدمے میں لکھا ہے کہ وہ ہر سورت کے مقاصد بیان کرتے ہیں اور الفاظ کے معانی واضح کرتے ہیں {cite:tahrir-wa-l-tanwir-ibn-ashur-dar-al-tunisia vol. 1 p. 9}۔"
  es: "El tafsir al-Tahrir wa-l-Tanwir de Muhammad al-Tahir ibn Ashur. Le dio el título completo de 'Aclarando el significado correcto e iluminando la nueva mente, del Tafsir del Libro Glorioso', y su introducción dice que expone los objetivos de cada sura y explica el vocabulario {cite:tahrir-wa-l-tanwir-ibn-ashur-dar-al-tunisia vol. 1 p. 9}."
