label: { ar: "حكم التلفظ بالنية عند كل صلاة", en: "Voicing the intention at every prayer", ur: "ہر نماز پر زبان سے نیت کہنے کا حکم" }
summary:
  ar: "سائل سأل عن التلفظ بالنية عند كل صلاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23253)⁩ أن التلفظ بالنية عند إرادة الصلاة مشروع ومندوب إليه، خاصة إذا كان يساعد المصلي على استحضار النية وجمع الهمة على الصلاة، وأن التكبير لغة العرب: النية كما فصّل الجواب."
  en: "A questioner asked about voicing the intention at every prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23253) answered that voicing the intention when intending prayer is prescribed and recommended — especially where it helps the worshipper bring the intention to mind and gather resolve — as the answer details."
  ur: "ایک سائل نے ہر نماز پر زبان سے نیت کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23253)⁩ نے جواب دیا کہ نماز کی نیت کرتے وقت اسے زبان سے کہنا مشروع اور مطلوب ہے — خصوصاً جب یہ نمازی کو نیت حاضر رکھنے اور عزم جمع کرنے میں مدد دے — جیسا کہ جواب میں تفصیل ہے۔"
