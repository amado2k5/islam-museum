summary:
  ar: "تاريخ مصر وتراجم رجالها من سنة 1100هـ/1688م إلى سنة 1236–1237هـ/1821م لعبد الرحمن بن حسن الجبرتي، يشمل أواخر العصر المملوكي العثماني والحملة الفرنسية وبداية حكم محمد علي، في أربعة أجزاء {cite:ajaib-al-athar-moreh-2013-v1 p.13} {cite:ajaib-al-athar-moreh-2013-v1 p.18}؛ اعتمد في الجزأين الأولين على مصادر مخطوطة منها معجم شيخه مرتضى الزبيدي، وفي الثالث على كتابه «مظهر التقديس» {cite:ajaib-al-athar-moreh-2013-v1 p.14} {cite:ajaib-al-athar-moreh-2013-v1 p.18}."
  en: "A history of Egypt and biographies of its men from 1100/1688 to 1236-1237/1821 by Abd al-Rahman ibn Hasan al-Jabarti, covering the late Mamluk-Ottoman period, the French expedition and the beginning of Muhammad Ali's rule, in four parts; for the first two parts he drew on manuscript sources including his teacher Murtada al-Zabidi's dictionary of shaykhs, and for the third on his own Mazhar al-taqdis."
