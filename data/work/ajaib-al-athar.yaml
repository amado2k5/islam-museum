structure: "Author's preface; part 1: 1100-1189 AH (1688-1775), events summarised by year with long obituaries of scholars, Sufis and amirs (contents vol. 1 scan p.11 ff.); part 2: from 1190 AH, events dated by day and month; part 3: 1213-1220 AH (1798-1805), the French occupation and Muhammad Ali's appointment, reworked from Mazhar al-taqdis; part 4: 1221-1236 AH (1806-1821), Muhammad Ali's rule, including the killing of the Mamluk amirs at the Citadel in 1226. Moreh edition: 4 parts and an index volume."
