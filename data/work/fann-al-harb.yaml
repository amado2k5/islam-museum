summary:
  ar: "كتاب «فن الحرب» لسون تزو، كما يقدّمه طارق السويدان في دورة الإدارة العملية: أقدم كتاب باقٍ بين أيدي الناس في علم الإدارة، كتاب عسكري يعلّم القائد قواعد إدارة الجيش والتعامل مع الخصوم، وبُنيت عليه لاحقاً كتب في الإدارة منها «فن الحرب في مجال الأعمال»."
  en: "Sun Tzu's The Art of War, as presented in Tareq al-Suwaidan's Practical Administration course: the oldest surviving book on management — a military book teaching a commander the rules of running an army and handling opponents, on which later management books such as The Art of War in Business were built."
  ur: "سن تزو کی «فن جنگ»، جیسا کہ طارق السویدان کے عملی انتظامیہ کورس میں آتا ہے: انتظامی علم کی قدیم ترین موجودہ کتاب — ایک جنگی کتاب جو سردار کو فوج چلانے اور مخالف سے نمٹنے کے اصول سکھاتی ہے، اور جس پر بعد کی انتظامی کتابیں جیسے «فن جنگ ان بزنس» قائم ہوئیں۔"
