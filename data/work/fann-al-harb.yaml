summary:
  ar: "كتاب «فن الحرب» لسون تزو، كما يقدّمه طارق السويدان في دورة الإدارة العملية: أقدم كتاب باقٍ بين أيدي الناس في علم الإدارة، كتاب عسكري يعلّم القائد قواعد إدارة الجيش والتعامل مع الخصوم، وبُنيت عليه لاحقاً كتب في الإدارة منها «فن الحرب في مجال الأعمال»."
  en: "Sun Tzu's The Art of War, as presented in Tareq al-Suwaidan's Practical Administration course: the oldest surviving book on management — a military book teaching a commander the rules of running an army and handling opponents, on which later management books such as The Art of War in Business were built."
  ur: "سن تزو کی «فن جنگ»، جیسا کہ طارق السویدان کے عملی انتظامیہ کورس میں آتا ہے: انتظامی علم کی قدیم ترین موجودہ کتاب — ایک جنگی کتاب جو سردار کو فوج چلانے اور مخالف سے نمٹنے کے اصول سکھاتی ہے، اور جس پر بعد کی انتظامی کتابیں جیسے «فن جنگ ان بزنس» قائم ہوئیں۔"
  es: "El arte de la guerra de Sun Tzu, tal como se presenta en el curso de Administración Práctica de Tareq al-Suwaidan: el libro más antiguo que se conserva sobre administración, un libro militar que enseña a un comandante las reglas para dirigir un ejército y tratar con los oponentes, sobre el cual se basaron libros de administración posteriores como El arte de la guerra en los negocios."
  fr: "L'Art de la guerre de Sun Tzu, tel que présenté dans le cours d'administration pratique de Tareq al-Suwaidan: le plus ancien ouvrage de gestion qui nous soit parvenu — un livre militaire enseignant à un commandant les règles de la direction d'une armée et de la gestion des adversaires, sur lequel se sont basés des ouvrages de gestion ultérieurs tels que L'Art de la guerre dans les affaires."
  tr: "Sun Tzu'nun \"Savaş Sanatı\" adlı kitabı, Tariq Al-Suwaidan tarafından pratik yönetim dersinde sunulmuştur: yönetim biliminde halkın elinde kalan en eski kitap, komutana ordu yönetimi kurallarını ve düşmanlarla başa çıkma kurallarını öğreten askeri bir kitap. Daha sonra yönetim üzerine kitaplar da geliştirildi; bunlar arasında \"İş Alanında Savaş Sanatı\" da vardı."
  id: "Buku Sun Tzu \"The Art of War,\" yang dipresentasikan oleh Tariq Al-Suwaidan dalam kursus manajemen praktis: buku tertua yang masih ada di tangan orang dalam ilmu administrasi, sebuah buku militer yang mengajarkan komandan aturan manajemen militer dan menghadapi musuh. Kemudian, buku-buku tentang manajemen dibangun di atasnya, termasuk \"The Art of War in the Business Field.\""
