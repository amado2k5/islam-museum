label: { ar: "قرار مجمع الفقه الإسلامي الدولي 134 (14/8) بشأن النظام العالمي الجديد والعولمة والتكتلات الإقليمية وأثرها", en: "IIFA resolution 134 (14/8) on the new world order, globalisation, regional blocs and their effects", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 134 (14/8): نئی عالمی نظام، عولمائیت، علاقائی گروہ بندی اور ان کے اثرات" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. بيّن أن العولمة تعني سهولة الانتقال في السلع والأفكار ورفع الحواجز بين الشعوب بحيث صار العالم أشبه بقرية كونية نتيجة التقدم التكنولوجي وصيغ التعامل الدولي ⁦(التكتلات الإقليمية، منظمة التجارة العالمية، الشركات العابرة للقارات)⁩، وأن ذلك رافقه في رؤية القرار استغلال القوى الكبرى والحضارة الغربية لهذه الإمكانات لمصالحها ولسيطرتها على مجالات الحياة. ثم تناول أثر العولمة في الاقتصاد والهوية والثقافة للشعوب الإسلامية وما أوصى به من موقف تجاهها. سُجّل بوصفه نص المجمع ذاته."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It described globalisation as the ease of movement of goods and ideas and the lifting of barriers between peoples — the world becoming like a small cosmic village through contemporary technology and international arrangements (regional blocs, the WTO, transcontinental corporations) — and stated its view that the great powers and contemporary Western civilisation exploited these means for their interests and domination over many fields of human life. It then addressed globalisation's effects on the economy, identity and culture of Muslim peoples and the stance it recommended. Recorded as the Academy's own text."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ اس نے عولمائیت کو بیان کیا: اشیاء اور افکار کی آزاد نقل و حرکت اور اقواموں کے مابین رکاوٹوں کا خاتمہ — جدید ٹیکنالوجی اور بین الاقوامی نظم ⁦(علاقائی گروہ، ورلڈ ٹریڈ آرگنائزیشن، بین القارات کمپنیاں)⁩ کی بدولت دنیا ایک چھوٹی سی کائناتی بستی بن گئی؛ اور اس کے نزدیک عظیم طاقتوں اور مغربی تہذیب نے ان امکانات کو اپنے مفادات اور زندگی کے میدانوں پر غلبے کے لیے استعمال کیا۔ پھر مسلم اقوام کی معیشت، شناخت اور ثقافت پر اس کے اثرات اور اس کی تجویز کردہ مؤقف۔ یہاں اکیڈمی کے اپنے متن کا خلاصہ درج ہے۔"
