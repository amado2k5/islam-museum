id: work/fatwa-aliftaa-jo-buying-and-delegating-the-sacrifice-by-phone
class: work
kind: fatwa
label: { ar: "شراء الأضاحي والتوكيل بذبحها عن طريق الهاتف", en: "Buying the sacrifice and delegating its slaughter by phone", ur: "فون کے ذریعے قربانی خریدنا اور ذبح کا وکیل بنانا" }
summary:
  ar: "سؤال عن شراء الأضاحي والتوكيل بذبحها عن طريق الهاتف، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأولى أن يذبح المضحي بيده أو يحضر، ولا حرج في توكيل الجزار بشراء أضحية وذبحها عنه، بشرط أن يعينها ويشتريها للمضحي قبل الذبح. أجابت الدائرة بأن الأولى أن يذبح المضحي أضحيته بيده إصابة للسنة، أو أن يحضرها إن أمكن. وقالت إنه لا حرج عليه في توكيل الجزار بشراء أضحية له وذبحها عنه، سواء كانت مملوكة للجزار أو كان وكيلًا في بيعها عند الحنابلة، بشرط أن يعينها الجزار ويشتريها للمضحي قبل ذبحها."
  en: "A question about buying the sacrifice and delegating its slaughter by phone, in which Jordan's General Iftaa Department answered that it is better for the sacrificer to slaughter it himself or be present, but there is no objection to appointing a butcher to buy and slaughter it, provided he designates it and buys it for the sacrificer before slaughter. The Department answered that it is better for the sacrificer to slaughter his animal with his own hand, following the Sunna, or to attend the slaughter if possible. It said there is no objection to appointing the butcher to buy an animal for him and slaughter it on his behalf, whether the animal belongs to the butcher or, according to the Hanbalis, the butcher is an agent for selling it, provided the butcher designates the animal and buys it for the sacrificer before slaughtering it."
  ur: "فون کے ذریعے قربانی خریدنا اور ذبح کا وکیل بنانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ افضل یہ ہے کہ قربانی کرنے والا خود ذبح کرے یا موجود ہو، لیکن قصاب کو خریدنے اور ذبح کرنے کا وکیل بنانے میں حرج نہیں، بشرطیکہ وہ ذبح سے پہلے جانور متعین کر کے اس کے لیے خریدے۔ ڈیپارٹمنٹ نے جواب دیا کہ افضل یہ ہے کہ قربانی کرنے والا سنت پر عمل کرتے ہوئے اپنے ہاتھ سے ذبح کرے، یا ممکن ہو تو موقع پر موجود ہو۔ اس نے کہا کہ قصاب کو اپنے لیے جانور خریدنے اور اپنی طرف سے ذبح کرنے کا وکیل بنانے میں کوئی حرج نہیں، چاہے جانور قصاب کی ملکیت ہو یا حنابلہ کے نزدیک وہ اسے بیچنے کا وکیل ہو، بشرطیکہ قصاب ذبح سے پہلے جانور متعین کرے اور قربانی کرنے والے کے لیے خریدے۔"
