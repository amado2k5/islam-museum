id: work/fatwa-dar-alifta-eg-zakat-withheld-contractor-funds
class: work
kind: fatwa
label: { ar: "حكم زكاة أموال المستخلصات المحتجزة", en: "Zakat on withheld contractor dues", ur: "روکی گئی ٹھیکیدار کی رقوم پر زکات", es: "Zakat sobre los pagos retenidos a los contratistas" }
summary:
  ar: "سائل سأل عن زكاة أموال مستخلصات المصنعيات المحتجزة لدى جهة العمل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22401)⁩ أنه ليس على المقاول المذكور أن يخرج زكاة ما يستحقه من تلك الأموال المحتجزة أو يضمها إلى أمواله الأخرى حتى يقبضها على ما فصّل الجواب."
  en: "A questioner asked about zakat on withheld progress-payment dues for fabrication work. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22401) answered that the contractor in question is not required to pay zakat on what is owed him of those withheld sums, nor to add them to his other funds, until he actually receives them — as the answer details."
  ur: "ایک سائل نے تعمیراتی کاموں کی روکی گئی پیشگی رقوم پر زکات پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22401)⁩ نے جواب دیا کہ مذکورہ ٹھیکیدار پر ان روکی ہوئی رقوموں کی زکات ادا کرنا اور انہیں اپنے دیگر مال میں مضموم کرنا لازم نہیں جب تک وہ وصول نہ کر لے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el zakat aplicable a los pagos parciales retenidos por trabajos de fabricación. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22401) respondió que el contratista en cuestión no está obligado a pagar el zakat sobre las sumas retenidas que se le adeudan, ni a añadirlas a sus otros fondos, hasta que las reciba efectivamente, tal como se detalla en la respuesta."
