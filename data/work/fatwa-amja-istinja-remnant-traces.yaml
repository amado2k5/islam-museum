id: work/fatwa-amja-istinja-remnant-traces
class: work
kind: fatwa
label: { ar: "بقايا الغائط بعد الاستنجاء", en: "Traces after water-cleansing — the recommended join", ur: "دھونے کے بعد بقایا — استجمار و استنجاء", es: "Rastros después de la limpieza con agua: la unión recomendada", fr: "Traces après le nettoyage à l'eau — joint recommandé", tr: "Temizlik sonrası atık kalıntıları (istinja)", id: "Sisa limbah setelah pembersihan (istinja)" }
summary:
  ar: "سأل سائل أنه عندما ينظف الدبر بالماء يرى آثارًا للغائط متبقية ويعاني من هذا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78797 بتاريخ 9 مايو 2009)⁩ أن من أحدث بالبول أو الغائط لزمه الاستنجاء وإن جمع بين الاستجمار بالأحجار أو بأوراق التواليت ثم بالماء فقد أحسن على ما فصّل الجواب من كيفية التنقية حتى يحصل الإنقاء."
  en: "A questioner found traces of stool remaining after cleaning with water. Dr. Salah al-Sawi (fatwa no. 78797, 9 May 2009) answered that one who has a hadath of urine or stool owes istinja; joining istijmar with stones or toilet paper followed by water is the doing-well — the answer detailing how cleansing proceeds until cleanness is had."
  ur: "دھونے کے بعد بقایا رہ جائیں؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78797، 9 مئی 2009)⁩ کے مطابق پہلے استجمار پھر پانی بہتر ہے — مکمل تنقیر مقصود۔"
  es: "Una persona que preguntó encontró rastros de heces después de limpiarse con agua. El Dr. Salah al-Sawi (fatwa n.° 78797, 9 de mayo de 2009) respondió que quien tiene un hadath de orina o heces debe istinja; unir istijmar con piedras o papel higiénico seguido de agua es lo correcto; la respuesta detalla cómo se procede a la limpieza hasta lograr la pureza."
  fr: "Un individu a constaté la présence de traces de selles après s'être nettoyé à l'eau. Le Dr Salah al-Sawi (fatwa n° 78797, 9 mai 2009) a répondu que celui qui présente des traces d'urine ou de selles doit se purifier (istinja); le rituel consistant à ajouter des pierres ou du papier toilette, puis à rincer à l'eau, est une bonne pratique. La réponse détaille la procédure de purification jusqu'à l'obtention d'une propreté complète."
  tr: "Bir soru soran kişiye, anüs suyla temizlendiğinde dışkı izleri gördüğü ve bundan muzdarip olduğu soruldu. Dr. Salah Al-Sawy (9 Mayıs 2009 tarihli 78797 Fetvası) idrar veya dışkı yapan kişinin istinja (ritüel temizlik) yapması gerektiğini ve istijmarı taş veya tuvalet kağıdı ile su ile birleştirirse, arınma yöntemine ilişkin ayrıntılı açıklamaya göre arınma sağlanana kadar iyi kabul edildiğini yanıtladı."
  id: "Seorang penanya ditanya bahwa ketika anus dibersihkan dengan air, ia melihat jejak kotoran yang tersisa dan menderita karenanya. Dr. Salah Al-Sawy menjawab (Fatwa No. 78797 tanggal 9 Mei 2009) bahwa siapa pun yang membuat urin atau kotoran harus melakukan istinja (pembersihan ritual), dan jika ia mencampurkan istijmar dengan batu atau tisu toilet, maka dengan air, ia dianggap baik menurut penjelasan rinci mengenai metode pemurnian sampai penyucian tercapai."
