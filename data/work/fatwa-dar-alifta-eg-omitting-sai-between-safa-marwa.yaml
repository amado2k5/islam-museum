label: { ar: "حكم ترك السعي بين الصفا والمروة في الحج", en: "Omitting the sa'i between Safa and Marwa in Hajj", ur: "حج میں صفا مروہ کی سعی چھوڑنا" }
summary:
  ar: "سائل سأل عن ترك السعي بين الصفا والمروة في الحج وهو بمكة ولم يغادرها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20766)⁩ أنه إذا كان بمكة ولم يغادرها فيجب عليه العودة والقيام بالسعي بين الصفا والمروة ولا يضر الفصل بين السعي والطواف على ما فصّل الجواب."
  en: "A questioner asked about omitting the sa'i between Safa and Marwa while still in Mecca. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20766) answered that while he remains in Mecca he must return and perform it, and separation between sa'i and tawaf does no harm — as the answer details."
  ur: "ایک سائل نے مکہ میں موجودگی کے باوجود صفا مروہ کی سعی چھوڑنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20766)⁩ نے جواب دیا کہ جب تک مکہ میں ہو اسے واپس جا کر سعی کرنی ہوگی اور طواف کے ساتھ وقفہ مضر نہیں — جیسا کہ جواب میں تفصیل ہے۔"
