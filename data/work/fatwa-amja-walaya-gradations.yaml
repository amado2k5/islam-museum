id: work/fatwa-amja-walaya-gradations
class: work
kind: fatwa
label: { ar: "مراتب الموالاة للكافرين", en: "The gradations of loyalty to disbelievers", ur: "کافروں سے ولایت کے درجات", es: "Los grados de lealtad hacia los no creyentes", fr: "Les degrés de loyauté envers les incrédules", tr: "İnançsızlara bağlılık sıraları", id: "Tingkat kesetiaan kepada kaum kafir" }
summary:
  ar: "سأل سائل عن آية النهي عن اتخاذ الآباء والإخوان أولياء وعن كون الولاية لها مفردات منها المحبة وهي أقسام. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84114 بتاريخ 2 أبريل 2011)⁩ أن تعبير الموالاة لأعداء الله مجمل وهو شعب متفاوتة منه ما يكون كفرًا ومنه ما لا يبلغ ذلك وإن كان الجميع منهيًّا عنه، وما يكون منه كفرًا هو التولي المطلق أو ما كان على الدين كأن يحبهم أو ينصرهم لدينهم وفسوقهم عن أمر الله، ولا يدخل في الموالاة المحرمة البر والقسط مع المسالمين لأهل الإسلام من غير المسلمين."
  en: "A questioner raised the verse forbidding taking fathers and brothers as allies, noting that loyalty has many facets including love, which has kinds. Dr. Salah al-Sawi (fatwa no. 84114, 2 April 2011) answered that 'loyalty toward God's enemies' is an ambiguous expression of uneven degrees: some of it is disbelief, some falls short, though all of it is forbidden; what counts as disbelief is absolute allegiance, or allegiance on account of religion — loving or aiding them for their faith and their transgression against God's command; kindness and equity toward peaceable non-Muslims do not enter forbidden loyalty. Recorded as AMJA's answer."
  ur: "ایک سائل نے آیت اور ولایت کے درجات پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84114، 2 اپریل 2011)⁩ کے مطابق دشمنان خدا سے ولایت کے درجے مختلف ہیں — مطلق ولایت کفر ہے؛ مگر مسالموں سے نیکی اور انصاف اس میں داخل نہیں۔"
  es: "Un consultante mencionó el versículo que prohíbe tomar como aliados a padres y hermanos, señalando que la lealtad tiene muchas facetas, incluyendo el amor, que tiene diferentes formas. El Dr. Salah al-Sawi (fatwa n.° 84114, 2 de abril de 2011) respondió que la «lealtad hacia los enemigos de Dios» es una expresión ambigua de grados desiguales: parte de ella es incredulidad, parte es insuficiente, aunque toda está prohibida; lo que se considera incredulidad es la lealtad absoluta, o la lealtad por motivos religiosos: amarlos o ayudarlos por su fe y su transgresión contra el mandato de Dios; la bondad y la equidad hacia los no musulmanes pacíficos no entran dentro de la lealtad prohibida. Registrado como respuesta de AMJA."
  fr: "Un internaute a soulevé la question du verset interdisant de prendre ses pères et ses frères pour alliés, faisant remarquer que la loyauté revêt de multiples facettes, dont l'amour, qui se décline sous différentes formes. Le Dr Salah al-Sawi (fatwa n° 84114, 2 avril 2011) a répondu que la « loyauté envers les ennemis de Dieu » est une expression ambiguë, présentant différents degrés: elle relève parfois de l'incroyance, parfois d'une forme moins stricte, mais elle est toujours interdite. Ce qui est considéré comme de l'incroyance, c'est l'allégeance absolue ou l'allégeance motivée par la religion – aimer ou aider ces personnes en raison de leur foi et de leur transgression du commandement divin. La bienveillance et l'équité envers les non-musulmans pacifiques ne relèvent pas de la loyauté interdite. Cette réponse a été consignée dans la jurisprudence AMJA."
  tr: "Bir soru soran kişi, babaların ve kardeşlerin vasi almasını yasaklayan ayet ve vesayetin sevgi gibi kategoriler gibi unsurlar içerdiği hakkında soru soruldu. Dr. Salah Al-Sawy (2 Nisan 2011 tarihli Fetva No. 84114) 'Allah'ın düşmanlarına olan 'bağlılık' teriminin genel olduğunu ve bu grubun değişken olduğunu yanıtladı: bazıları inançsızdır, bazıları inanmaz, herkes bundan yasak olsa bile. İnançsızlık olarak kabul edilen ise mutlak bağlılıktır ya da dine dayanan, onları sevmek, dinleri için desteklemek ve Allah'ın emrine karşı gelmek gibi. Yasaklı sadakat, gayrimüslimler arasında barışçıl Müslümanlara karşı doğruluk ve adaleti içermez."
  id: "Seorang penanya ditanya tentang ayat yang melarang ayah dan saudara mengambil wali dan bahwa wali memiliki unsur seperti kasih, yang merupakan kategori. Dr. Salah Al-Sawy menjawab (Fatwa No. 84114 tanggal 2 April 2011) bahwa istilah 'kesetiaan' kepada musuh Tuhan adalah umum, dan ini adalah kelompok yang bervariasi: ada yang tidak percaya dan ada yang tidak, meskipun semua orang dilarang melakukannya. Apa yang dianggap tidak percaya adalah kesetiaan mutlak atau apa yang didasarkan pada agama, seperti mengasihi atau mendukung mereka atas agama dan melanggar perintah Tuhan. Kesetiaan terlarang tidak mencakup kebenaran dan keadilan dengan Muslim yang damai di antara non-Muslim."
