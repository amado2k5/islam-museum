id: work/fatwa-amja-walaya-gradations
class: work
kind: fatwa
label: { ar: "مراتب الموالاة للكافرين", en: "The gradations of loyalty to disbelievers", ur: "کافروں سے ولایت کے درجات" }
summary:
  ar: "سأل سائل عن آية النهي عن اتخاذ الآباء والإخوان أولياء وعن كون الولاية لها مفردات منها المحبة وهي أقسام. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84114 بتاريخ 2 أبريل 2011)⁩ أن تعبير الموالاة لأعداء الله مجمل وهو شعب متفاوتة منه ما يكون كفرًا ومنه ما لا يبلغ ذلك وإن كان الجميع منهيًّا عنه، وما يكون منه كفرًا هو التولي المطلق أو ما كان على الدين كأن يحبهم أو ينصرهم لدينهم وفسوقهم عن أمر الله، ولا يدخل في الموالاة المحرمة البر والقسط مع المسالمين لأهل الإسلام من غير المسلمين."
  en: "A questioner raised the verse forbidding taking fathers and brothers as allies, noting that loyalty has many facets including love, which has kinds. Dr. Salah al-Sawi (fatwa no. 84114, 2 April 2011) answered that 'loyalty toward God's enemies' is an ambiguous expression of uneven degrees: some of it is disbelief, some falls short, though all of it is forbidden; what counts as disbelief is absolute allegiance, or allegiance on account of religion — loving or aiding them for their faith and their transgression against God's command; kindness and equity toward peaceable non-Muslims do not enter forbidden loyalty. Recorded as AMJA's answer."
  ur: "ایک سائل نے آیت اور ولایت کے درجات پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84114، 2 اپریل 2011)⁩ کے مطابق دشمنان خدا سے ولایت کے درجے مختلف ہیں — مطلق ولایت کفر ہے؛ مگر مسالموں سے نیکی اور انصاف اس میں داخل نہیں۔"
