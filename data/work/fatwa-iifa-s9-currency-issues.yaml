summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: عقد ندوة متخصصة بالتعاون مع إحدى المؤسسات المالية الإسلامية يشارك فيها مختصون في الاقتصاد والفقه وبعض أعضاء وخبراء المجمع للنظر في الطريق الأقوم للوفاء بما في الذمة من ديون والتزامات في الأحوال المختلفة على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on currency issues: a specialist seminar is to be held with an Islamic financial institution, with economists, jurists and Academy members and experts, to find the soundest way to discharge debts and obligations owed in their various states, as detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ کرنسی مسائل پر: ماہرین کی خصوصی سمینار منعقد ہو گی تاکہ قرضوں کی ادائیگی کا بہترین طریقہ تلاش ہو۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre cuestiones monetarias: se celebrará un seminario especializado con una institución financiera islámica, con economistas, juristas, miembros de la Academia y expertos, para encontrar la forma más sólida de saldar las deudas y obligaciones contraídas en sus respectivos estados, tal como se detalla."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur les questions monétaires: un séminaire spécialisé doit être organisé avec une institution financière islamique, avec des économistes, des juristes, des membres et des experts de l'Académie, afin de trouver la manière la plus sûre de s'acquitter des dettes et obligations dues dans leurs différents états, comme détaillé."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dokuzuncu oturumunda (Abu Dabi, Nisan 1995): İslami finans kurumlarından biriyle iş birliği içinde, ekonomi ve hukuk uzmanları ile Akademi'nin bazı üyeleri ve uzmanlarının katılımıyla, çeşitli durumlarda borç ve yükümlülüklerin en uygun şekilde yerine getirilmesini değerlendirmek üzere özel bir seminer düzenlemek."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kesembilannya (Abu Dhabi, April 1995): Mengadakan seminar khusus bekerja sama dengan salah satu lembaga keuangan Islam, dengan partisipasi spesialis ekonomi dan hukum, serta beberapa anggota dan ahli Akademi, untuk mempertimbangkan cara paling tepat dalam memenuhi utang dan kewajiban dalam berbagai situasi seperti yang dijelaskan."
