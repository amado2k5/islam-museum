summary:
  ar: "تفسير موضوعي لسور القرآن لمحمد الغزالي يتناول كل سورة بوصفها وحدة، صدرت طبعته الأولى عن دار الشروق بمصر سنة 1416هـ/1995م في 552 صفحة، وتُرجم إلى التاميلية."
  en: "A thematic commentary by Muhammad al-Ghazali that treats each sura as a unit; its first edition was published by Dar al-Shuruq, Egypt, in 1416/1995 (552 pages). It has been translated into Tamil."
  ur: "محمد الغزالی کی موضوعاتی تفسیر جو ہر سورت کو ایک اکائی کے طور پر دیکھتی ہے؛ اس کا پہلا ایڈیشن دار الشروق، مصر سے 1416ھ/1995ء میں 552 صفحات میں شائع ہوا، اور اس کا تامل ترجمہ بھی ہوا ہے۔"
  es: "Comentario temático de Muhammad al-Ghazali que trata cada sura como una unidad; su primera edición fue publicada por Dar al-Shuruq, Egipto, en 1416/1995 (552 páginas). Ha sido traducido al tamil."
  fr: "Ce commentaire thématique de Muhammad al-Ghazali traite chaque sourate comme une unité; sa première édition a été publiée par Dar al-Shuruq, en Égypte, en 1416/1995 (552 pages). Il a été traduit en tamoul."
  tr: "Muhammed El-Hazali tarafından Kur'an surelerinin objektif bir yorumu, her sureyi bir bütün olarak ele alır. İlk baskısı, Mısır'da Dar Al-Shoruk tarafından 1416 Hicri / 1995 yılında 552 sayfa olarak yayımlanmış ve Tamilce'ye çevrilmiştir."
  id: "Interpretasi objektif surah Al-Qur'an oleh Muhammad Al-Ghazali, yang membahas setiap surah sebagai satu kesatuan. Edisi pertamanya diterbitkan oleh Dar Al-Shorouk di Mesir pada tahun 1416 H / 1995 M dalam 552 halaman, dan diterjemahkan ke dalam bahasa Tamil."
