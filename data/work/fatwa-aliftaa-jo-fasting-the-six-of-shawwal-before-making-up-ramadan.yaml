id: work/fatwa-aliftaa-jo-fasting-the-six-of-shawwal-before-making-up-ramadan
class: work
kind: fatwa
label: { ar: "تقديم صيام الستة من شوال على قضاء رمضان", en: "Fasting the six days of Shawwal before making up Ramadan", ur: "رمضان کی قضا سے پہلے شوال کے چھ روزے" }
summary:
  ar: "سؤال عن تقديم صيام الستة من شوال على قضاء رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إن كان الفطر بعذر، وأن من أفطر بلا عذر تجب عليه المبادرة بالقضاء، وأن الجمع بين النيتين جائز والفصل أحوط. أجابت الدائرة بأن الفطر إن كان بعذر جاز تقديم الستة على القضاء، لأن القضاء حينئذ على التراخي في شوال وغيره، وصيام الستة لا يكون إلا في شوال. وقالت إن الفطر إن كان بلا عذر وجبت المبادرة إلى القضاء فورًا بعد العيد وقبل الستة، لكنه لو صام الستة جاز، ووجب عليه قضاء ما فاته بعد ذلك. وأضافت أنه يجوز الجمع بين نية القضاء وصيام الستة، وإن كان الأحوط فصل كل صيام على حدة لما فيه من زيادة الأجر وخروجًا من خلاف من منع ذلك."
  en: "A question about fasting the six days of Shawwal before making up Ramadan, in which Jordan's General Iftaa Department answered that it is permitted if the days were missed with an excuse, that someone who broke the fast without excuse must make the days up promptly, and that combining both intentions is permitted though keeping them separate is more cautious. The Department answered that if the fast was broken with an excuse, the six days may come before the make-up days, because making up is then not urgent and may be done in Shawwal or later, whereas the six days can only be fasted in Shawwal. It said that if the fast was broken without excuse, one must hasten to make it up immediately after Eid and before the six days; but if one fasts the six days, they are valid, and the missed fasts must be made up afterwards. It added that the intentions of making up and of the six days may be combined, though it is more cautious to keep each fast separate, for the greater reward and to stay clear of the disagreement of those who disallow combining."
  ur: "رمضان کی قضا سے پہلے شوال کے چھ روزے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر روزے عذر سے چھوٹے ہوں تو جائز ہے، بلا عذر چھوڑنے والے پر جلد قضا واجب ہے، اور دونوں نیتوں کو جمع کرنا جائز ہے مگر الگ رکھنا زیادہ محتاط ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر روزہ عذر سے چھوٹا ہو تو چھ روزے قضا سے پہلے رکھے جا سکتے ہیں، کیونکہ اس صورت میں قضا میں تاخیر کی گنجائش ہے، شوال میں ہو یا بعد میں، جبکہ چھ روزے صرف شوال ہی میں ہوتے ہیں۔ اس نے کہا کہ اگر روزہ بلا عذر چھوڑا ہو تو عید کے فوراً بعد اور چھ روزوں سے پہلے قضا واجب ہے؛ لیکن اگر چھ روزے رکھ لے تو درست ہیں، اور اس کے بعد چھوٹے ہوئے روزوں کی قضا واجب ہے۔ اس نے مزید کہا کہ قضا اور چھ روزوں کی نیت جمع کرنا جائز ہے، اگرچہ زیادہ اجر اور منع کرنے والوں کے اختلاف سے بچنے کے لیے ہر روزہ الگ رکھنا زیادہ محتاط ہے۔"
