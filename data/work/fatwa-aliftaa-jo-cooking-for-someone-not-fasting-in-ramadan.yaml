id: work/fatwa-aliftaa-jo-cooking-for-someone-not-fasting-in-ramadan
class: work
kind: fatwa
label: { ar: "صنع الطعام لمفطر في رمضان", en: "Cooking for someone who is not fasting in Ramadan", ur: "رمضان میں روزہ نہ رکھنے والے کے لیے کھانا بنانا", es: "Cocinar para alguien que no está ayunando en Ramadán.", fr: "Cuisiner pour une personne qui ne jeûne pas pendant le Ramadan" }
summary:
  ar: "سؤال عن صنع الطعام لمفطر في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم صنع الطعام لمن يفطر بغير عذر لأنه إعانة على المعصية. أجابت الدائرة بأنه يحرم صنع الطعام لمن يفطر بغير عذر في رمضان، لأن في ذلك إعانة على المعصية، والإعانة على المعصية معصية. واستشهدت بآية النهي عن التعاون على الإثم والعدوان في [[passage/quran-5-2|سورة المائدة 5:2]]."
  en: "A question about cooking for someone who is not fasting in Ramadan, in which Jordan's General Iftaa Department answered that cooking for someone who is not fasting without an excuse is forbidden because it is helping in wrongdoing. The Department answered that it is forbidden to cook for someone who is not fasting in Ramadan without an excuse, because it helps in wrongdoing, and helping in wrongdoing is itself wrongdoing. It cited the verse forbidding cooperation in sin and aggression in [[passage/quran-5-2|Surat al-Ma'ida 5:2]]."
  ur: "رمضان میں روزہ نہ رکھنے والے کے لیے کھانا بنانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بلا عذر روزہ نہ رکھنے والے کے لیے کھانا بنانا حرام ہے کیونکہ یہ گناہ میں مدد ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان میں بلا عذر روزہ نہ رکھنے والے کے لیے کھانا بنانا حرام ہے، کیونکہ اس میں گناہ پر مدد ہے، اور گناہ پر مدد خود گناہ ہے۔ اس نے گناہ اور زیادتی میں تعاون سے منع کرنے والی آیت [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔"
  es: "Una pregunta sobre cocinar para alguien que no está ayunando en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que cocinar para alguien que no está ayunando sin una excusa válida está prohibido porque es colaborar en una mala acción. El Departamento respondió que está prohibido cocinar para alguien que no está ayunando en Ramadán sin una excusa válida, porque colaborar en una mala acción es en sí mismo una mala acción. Citó el versículo que prohíbe la cooperación en el pecado y la agresión en [[passage/quran-5-2|Surat al-Ma'ida 5:2]]."
  fr: "Une question concernant le fait de cuisiner pour une personne ne jeûnant pas pendant le Ramadan a été posée. Le Département général de la Iftaa de Jordanie a répondu que cuisiner pour une personne ne jeûnant pas sans excuse valable est interdit, car cela revient à cautionner un acte répréhensible. Le Département a expliqué qu'il est interdit de cuisiner pour une personne ne jeûnant pas pendant le Ramadan sans excuse valable, car cela cautionne un acte répréhensible, et que cautionner un acte répréhensible est en soi un acte répréhensible. Il a cité le verset interdisant la coopération au péché et à l'agression (Sourate al-Ma'ida 5:2)."
