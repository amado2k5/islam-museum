id: work/fatwa-aliftaa-jo-cooking-for-someone-not-fasting-in-ramadan
class: work
kind: fatwa
label: { ar: "صنع الطعام لمفطر في رمضان", en: "Cooking for someone who is not fasting in Ramadan", ur: "رمضان میں روزہ نہ رکھنے والے کے لیے کھانا بنانا" }
summary:
  ar: "سؤال عن صنع الطعام لمفطر في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم صنع الطعام لمن يفطر بغير عذر لأنه إعانة على المعصية. أجابت الدائرة بأنه يحرم صنع الطعام لمن يفطر بغير عذر في رمضان، لأن في ذلك إعانة على المعصية، والإعانة على المعصية معصية. واستشهدت بآية النهي عن التعاون على الإثم والعدوان في [[passage/quran-5-2|سورة المائدة 5:2]]."
  en: "A question about cooking for someone who is not fasting in Ramadan, in which Jordan's General Iftaa Department answered that cooking for someone who is not fasting without an excuse is forbidden because it is helping in wrongdoing. The Department answered that it is forbidden to cook for someone who is not fasting in Ramadan without an excuse, because it helps in wrongdoing, and helping in wrongdoing is itself wrongdoing. It cited the verse forbidding cooperation in sin and aggression in [[passage/quran-5-2|Surat al-Ma'ida 5:2]]."
  ur: "رمضان میں روزہ نہ رکھنے والے کے لیے کھانا بنانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بلا عذر روزہ نہ رکھنے والے کے لیے کھانا بنانا حرام ہے کیونکہ یہ گناہ میں مدد ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان میں بلا عذر روزہ نہ رکھنے والے کے لیے کھانا بنانا حرام ہے، کیونکہ اس میں گناہ پر مدد ہے، اور گناہ پر مدد خود گناہ ہے۔ اس نے گناہ اور زیادتی میں تعاون سے منع کرنے والی آیت [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔"
