summary:
  ar: "مثنوية طويلة بالأردية الدكنية نظمها وجهي سنة 1609–1610م، بطلها السلطان محمد قلي قطب شاه يحلم بأميرة البنغال مشتري فيبحث عنها مع صديقه المصور عطارد {cite:zebrowski-deccani-painting-1983 p. 155} {cite:zebrowski-deccani-painting-1983 p. 156}."
  en: "A long poem in Deccani Urdu composed by Wajhi in 1609–10, whose hero, Sultan Muhammad Quli Qutb Shah, dreams of Mushtari, princess of Bengal, and seeks her with his friend the painter Utarad {cite:zebrowski-deccani-painting-1983 p. 155} {cite:zebrowski-deccani-painting-1983 p. 156}."
  ur: "وجہی کی 1609–10ء کی دکنی اردو کی طویل مثنوی، جس کا ہیرو سلطان محمد قلی قطب شاہ بنگال کی شہزادی مشتری کو خواب میں دیکھ کر اپنے دوست مصور عطارد کے ساتھ اس کی تلاش کرتا ہے {cite:zebrowski-deccani-painting-1983 p. 155} {cite:zebrowski-deccani-painting-1983 p. 156}۔"
  es: "Un largo poema en urdu deccani compuesto por Wajhi en 1609-10, cuyo héroe, el sultán Muhammad Quli Qutb Shah, sueña con Mushtari, princesa de Bengala, y la busca con su amigo el pintor Utarad {cite:zebrowski-deccani-painting-1983 p. 155} {cite:zebrowski-deccani-painting-1983 p. 156}."
  fr: "Un long poème en ourdou du Deccan composé par Wajhi en 1609-1610, dont le héros, le sultan Muhammad Quli Qutb Shah, rêve de Mushtari, princesse du Bengale, et la recherche avec son ami le peintre Utarad {cite:zebrowski-deccani-painting-1983 p. 155} {cite:zebrowski-deccani-painting-1983 p. 156}."
  tr: "Wajhi tarafından 1609–1610 yılları arasında Dekkan Urduca yazılmış uzun bir masnavi, başrolde Sultan Muhammad Quli Qutb Shah'ın Bengal prensesini hayal ettiği ve arkadaşı fotoğrafçı Merkür ile onu aradığı bir eser {cite:zebrowski-deccani-painting-1983 s. 155} {cite:zebrowski-deccani-painting-1983 s. 156}."
  id: "Sebuah masnavi panjang dalam bahasa Urdu Deccan yang disusun oleh Wajhi pada tahun 1609–1610 M, dibintangi oleh Sultan Muhammad Quli Qutb Shah yang bermimpi tentang seorang putri Bengal dan mencarinya bersama temannya fotografer Mercury {cite:zebrowski-deccani-painting-1983 hlm. 155} {cite:zebrowski-deccani-painting-1983 hlm. 156}."
