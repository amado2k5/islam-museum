id: work/fatwa-aliftaa-jo-selling-a-dead-authors-manuscript-to-publish-under-another-name
class: work
kind: fatwa
label: { ar: "بيع مخطوط مؤلف متوفى لمن يريد نشره باسمه", en: "Selling a dead author's manuscript to someone who wants to publish it under his own name", ur: "فوت شدہ مصنف کا مخطوطہ ایسے شخص کو بیچنا جو اسے اپنے نام سے شائع کرنا چاہے" }
summary:
  ar: "سؤال عن بيع مخطوط مؤلف متوفى لمن يريد نشره باسمه، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم على المشتري نسبة الكتاب لنفسه، ولا يجوز للورثة بيعه له إن علموا ذلك، ولهم بيع المؤلفات والانتفاع بريعها بشرط أن تطبع باسم مؤلفها. أجابت الدائرة بأنه يحرم على مشتري مؤلفات المتوفى أن ينسبها لنفسه، لما فيه من الغش والتزوير، وعدّته سرقة علمية، واستندت إلى حديث رواه البخاري في أن المتشبع بما لم يُعط كلابس ثوبي زور. وقالت إنه لا يجوز للورثة بيعها له إن علموا إرادته نسبتها لنفسه، ونقلت قرار مجمع الفقه الإسلامي في مؤتمره الخامس بالكويت سنة 1409هـ/1988م بأن حقوق التأليف والابتكار مصونة شرعًا ولأصحابها حق التصرف فيها. وبينت أن أموال المتوفى، ومنها حقوق التأليف والملكية الفكرية، تنتقل بوفاته إلى ورثته بحسب أنصبتهم، وأن بيع الكتب والمخطوطات المباحة المنتفع بها جائز، واستشهدت بقول النووي في المجموع (9/253) بجواز بيع كتب الحديث والفقه واللغة والأدب والطب والحساب وغيرها مما فيه منفعة مباحة. ونقلت قرار مجلس الإفتاء الأردني رقم 48 بأن حق المؤلف ينتقل بعد وفاته إلى ورثته، وخلصت إلى أنه لا حرج على الورثة في بيع هذه المؤلفات والانتفاع بريعها بشرط أن تطبع باسم مؤلفها المتوفى، ولا يجوز بيعها لمن يريد نسبتها لنفسه."
  en: "A question about selling a dead author's manuscript to someone who wants to publish it under his own name, in which Jordan's General Iftaa Department answered that the buyer may not attribute the book to himself, that the heirs may not sell it to him if they know this, and that they may sell the works and benefit from the proceeds provided they are printed under the author's name. The Department answered that the buyer of a deceased person's writings may not attribute them to himself, because it is deception and forgery, and it counted this as academic theft, relying on a hadith reported by al-Bukhari that one who boasts of what he was not given is like one wearing two garments of falsehood. It said that the heirs may not sell the works to him if they know he intends to claim them, and it quoted the resolution of the International Islamic Fiqh Academy at its fifth conference in Kuwait in 1409 AH/1988 that rights of authorship and invention are protected in the Sharia and their holders may dispose of them. It explained that the deceased's property, including authorship and intellectual property rights, passes at his death to his heirs according to their shares, and that selling permissible, beneficial books and manuscripts is allowed, citing al-Nawawi in al-Majmu (9/253) that books of hadith, fiqh, language, literature, medicine, arithmetic and other permissible useful subjects may be sold. It quoted resolution 48 of Jordan's Iftaa Council that an author's right passes to his heirs after his death, and concluded that the heirs may sell the works and benefit from their proceeds provided they are printed under the name of their deceased author, and may not sell them to someone who wants to claim them as his own."
  ur: "فوت شدہ مصنف کا مخطوطہ ایسے شخص کو بیچنا جو اسے اپنے نام سے شائع کرنا چاہے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ خریدار کے لیے کتاب اپنی طرف منسوب کرنا حرام ہے، ورثا کے لیے یہ جانتے ہوئے اسے بیچنا جائز نہیں، اور وہ تصانیف بیچ کر ان کی آمدنی سے فائدہ اٹھا سکتے ہیں بشرطیکہ وہ مصنف کے نام سے چھپیں۔ ڈیپارٹمنٹ نے جواب دیا کہ فوت شدہ کی تصانیف خریدنے والے کے لیے انہیں اپنی طرف منسوب کرنا حرام ہے، کیونکہ یہ دھوکا اور جعل سازی ہے، اور اسے علمی سرقہ قرار دیا، اور بخاری کی روایت کردہ اس حدیث پر انحصار کیا کہ جو چیز نہ ملی ہو اس پر فخر کرنے والا جھوٹ کے دو کپڑے پہننے والے کی طرح ہے۔ اس نے کہا کہ اگر ورثا جانتے ہوں کہ وہ انہیں اپنی طرف منسوب کرنا چاہتا ہے تو ان کے لیے اسے بیچنا جائز نہیں، اور اسلامی فقہ اکیڈمی کی کویت میں 1409ھ/1988ء کی پانچویں کانفرنس کی قرارداد نقل کی کہ تصنیف اور ایجاد کے حقوق شرعاً محفوظ ہیں اور ان کے مالکوں کو ان میں تصرف کا حق ہے۔ اس نے وضاحت کی کہ فوت شدہ کا مال، بشمول حقوقِ تصنیف اور دانشورانہ ملکیت، اس کی وفات پر ورثا کو ان کے حصوں کے مطابق منتقل ہو جاتا ہے، اور جائز و مفید کتابوں اور مخطوطات کی فروخت جائز ہے، اور المجموع (9/253) میں نووی کا قول پیش کیا کہ حدیث، فقہ، لغت، ادب، طب، حساب اور دیگر مفید جائز علوم کی کتابیں بیچی جا سکتی ہیں۔ اس نے اردنی افتاء کونسل کی قرارداد نمبر 48 نقل کی کہ مصنف کا حق اس کی وفات کے بعد ورثا کو منتقل ہوتا ہے، اور نتیجہ نکالا کہ ورثا یہ تصانیف بیچ کر ان کی آمدنی سے فائدہ اٹھا سکتے ہیں بشرطیکہ وہ فوت شدہ مصنف کے نام سے چھپیں، اور انہیں ایسے شخص کو بیچنا جائز نہیں جو انہیں اپنی طرف منسوب کرنا چاہے۔"
