label: { ar: "قرار مجمع الفقه الإسلامي الدولي 203 (21/9) بشأن الوراثة والهندسة الوراثية والجينوم البشري ⁦(المجين)⁩", en: "IIFA resolution 203 (21/9) on genetics, genetic engineering and the human genome", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 203 (21/9): وراثت، جینیاتی انجینئرنگ اور انسانی جینوم", es: "Resolución 203 (21/9) de la IIFA sobre genética, ingeniería genética y el genoma humano.", fr: "Résolution 203 (21/9) de l'IIFA sur la génétique, le génie génétique et le génome humain", tr: "Genetik, Genetik Mühendisliği ve İnsan Genomu (Genom) ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 203 (21/9)", id: "Resolusi Akademi Fiqh Islam Internasional 203 (21/9) mengenai Genetika, Rekayasa Genetika, dan Genom Manusia (Genom)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩ بعد توصيات ندوته الفقهية الطبية مع المنظمة الإسلامية للعلوم الطبية بجدة ⁦(13–15 ربيع الآخر 1434هـ، 23–25 فبراير 2013م)⁩ تنفيذًا لقراره 193 ⁦(20/8)⁩. قرر في الجينوم البشري أن قراءته — رسم خريطة الجينات الكاملة للإنسان — جزء من تعرف الإنسان على نفسه ووسيلة للتعرف على الأمراض الوراثية أو احتمال الإصابة بها فهي إضافة للعلوم الصحية داخلة في الفروض الكفائية، مع ضوابط: يجوز استخدامه في المجالات النافعة كالوقاية والتداوي؛ لا يجوز استخدامه استخدامًا ضارًا أو مخالفًا للشريعة؛ لا يجوز أي بحث أو معالجة أو تشخيص متعلق بجينوم شخص إلا بعد تقييم دقيق للأخطار والفوائد؛ ووجوب إذن صحيح معتبر شرعًا من الشخص أو وليه الشرعي لتحليل خريطته الجينية مع مراعاة مصلحته؛ ولكل شخص حق اختيار العلم أو عدمه بنتائج الفحص الوراثي وعواقبه؛ والسرية الكاملة للتشخيصات الجينية ولا تفشى إلا في حالات قراريه 79 ⁦(8/10)⁩ بشأن السر في المهن الطبية و142 ⁦(15/8)⁩ حول ضمان الطبيب، وعلى الطبيب أخذ موافقة المريض بإفشاء سره لأسرته إن أصيب بمرض خطير فإن لم يوافق حاول إقناعه حرصًا على حياة أسرته؛ والتأكيد على ضوابط توصية ندوته عام 1419هـ؛ ولا يجوز تعريض شخص لتمييز بسبب صفاته الوراثية للنيل من حقوقه وحرياته وكرامته؛ ولا يجوز إجراء أبحاث سريرية جينية تخالف الشريعة أو لا تحترم حقوق الإنسان التي يقرها الإسلام. وفي العلاج الجيني — نقل جزء من الحمض النووي أو جين سليم أو إحلال جين سليم محل مريض لاستعادة وظيفته — نوعان: للخلايا الجسدية يجوز بغرض العلاج بشروط أهمها ألا يفضي لضرر أعظم من الموجود، ويغلب على الظن تحقيقه الشفاء أو تخفيف الآلام، ويتعذر البديل، وتراعى شروط نقل الأعضاء في قراره 57 ⁦(6/8)⁩ ويقوم به متخصصون ذوو خبرة وأمانة؛ وأما استخدامه لاكتساب صفات كالشكل فلا يجوز للتغيير المنهي عنه والعبث وامتهان الكرامة؛ وللخلايا الجنسية يجوز الفحص الجيني لمعرفة مرض جيني، وأما علاجها في صورته الراهنة غير المراعية للأحكام الشرعية وبخاصة عدم اختلاط الأنساب فحكمه المنع للخطورة والضرر. وفي الهندسة الوراثية: لا يجوز استخدامها لتبديل البنية الجينية بما يسمى تحسين السلالة البشرية، وأي عبث جيني بشخصية الإنسان أو تدخل في أهليته للمسؤولية محظور شرعًا؛ والأصل في الاستفادة منها في النبات والحيوان الإباحة بضوابط: ألا يفضي لضرر عاجل أو آجل، ولغرض صحيح مباح دون عبث أو إسراف، وأن يتولاها أصحاب الخبرة والثقة؛ ولا يجوز استعمالها للأغراض الضارة. وفي الإرشاد الجيني: يتوخى تزويد طالبيه بالمعرفة الصحيحة والتوقعات ونسبها الإحصائية ويكون القرار لذوي العلاقة مع الطبيب دون تأثير في اتجاه معين، مع تهيئة خدماته للأسر والمقبلين على الزواج، ولا تفضي نتائجه لإجراء إجباري، والسرية التامة لنتائجه، وتوسيع المعرفة به في المعاهد والمدارس والإعلام ودور العبادة بعد تأهيل القائمين، واستشارة الأسر التي يظهر فيها مرض وراثي للأطباء. وأحكام العلاج الوراثي: المسح الوراثي الوقائي جائز بشرط وسائل مباحة آمنة ولولي الأمر الإجبار عليه عند انتشار وباء أو تعرض لمواد مشعة مؤثرة في الجينات لمصلحة دفع الضرر العام مع سرية النتائج؛ والفحص الجيني قبل الزواج جائز بالوسيلة المباحة الآمنة ولولي الأمر الإلزام به لمصلحة معتبرة عامة؛ والتشخيص قبل زرع النطفة ⁦(طفل الأنابيب)⁩ جائز بشرط إجراءات تضمن عدم خلط العينات وصيانتها؛ والفحص في أثناء الحمل له وسائل متنوعة في مراحل مختلفة فإن ثبت مرض وراثي جاز الإجهاض حسب قراره 56 ⁦(7/6)⁩؛ ويجب الفحص الجيني للمواليد للتدخل المبكر في الحالات القابلة للعلاج. وأوصى بالتوعية بالأمراض الوراثية وتقليل انتشارها؛ وتشجيع الفحص قبل الزواج عبر الإعلام والندوات ودور العبادة؛ ومناشدة الجهات الصحية زيادة وحدات الوراثة البشرية والإرشاد الجيني؛ ومتابعة المنظمة الإسلامية للعلوم الطبية للمستجدات؛ واهتمام الدول الإسلامية بالهندسة الوراثية المعتبرة شرعًا بإنشاء مراكز أبحاث متوافقة مع الشريحة وتأهيل الأطر وإدخالها التعليم وتبسيطها للعامة؛ وتوفير الدول الخدمات للمحتاجين غير القادرين لارتفاع التكاليف؛ وإلزام الشركات المنتجة للأغذية ببيان المصنَّع بالهندسة الوراثية من الطبيعي المحض ليعرف المستهلكون؛ وسن الدول تشريعات تحمي مواطنيها من اتخاذهم ميدانًا للتجارب؛ وتفعيل دور مؤسسات حماية المستهلك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013), after its juristic-medical seminar with the Islamic Organisation for Medical Sciences in Jeddah (13–15 Rabi al-Akhir 1434, 23–25 February 2013) under resolution 193 (20/8). On the human genome: reading it — mapping the complete human genes — is part of man's knowing himself and a means of recognising hereditary diseases or their likelihood, a valuable addition to health sciences falling under collective duties, with controls: it may be used for beneficial ends such as prevention and treatment; not for harmful or sharia-contrary use; no research, treatment or diagnosis on a person's genome without a prior precise risk-benefit assessment; legally valid consent of the person or his legal guardian for analysing his genetic map with regard for his interest; each person's right to choose whether to be informed of genetic-test results and their consequences; complete confidentiality of genetic diagnoses, disclosed only in the cases of its resolutions 79 (8/10) on medical-professional secrets and 142 (15/8) on physician liability — the physician taking the patient's consent to disclose a serious illness to his family and, failing it, trying to persuade him out of care for their lives; reaffirming the controls of its 1419 seminar recommendation; no discrimination against anyone for his genetic traits to strip his fundamental rights and dignity; and no clinical genome research contrary to the sharia or disrespecting the human rights Islam recognises. On gene therapy — transferring a piece of DNA or a healthy gene or substituting a healthy for a sick gene to restore function — two kinds: somatic-cell therapy is permissible for treatment under conditions including causing no greater harm than existing, a strong likelihood of cure or easing pain, absence of alternatives, the organ-transfer conditions of resolution 57 (6/8), and execution by highly skilled and trustworthy specialists; while using it to acquire traits such as appearance is forbidden as the prohibited altering of creation, frivolity and debasing dignity; for germ cells, genetic testing to detect a hereditary disease is permissible, but therapy in its current form not observing the sharia rulings — especially the non-mixing of lineages — is forbidden for its gravity and harm. On genetic engineering: it may not be used to alter the genetic make-up for so-called improving the human breed, and any genetic tampering with a person's character or interfering with his capacity for responsibility is prohibited; the default of benefiting from it in plants and animals is permissibility under controls — no immediate or delayed harm, a proper lawful purpose without frivolity or waste, and execution by trusted experts; and it may not be used for harmful ends. On genetic counseling: it aims to give seekers correct knowledge, expectations and statistical ratios, the decision resting with the persons concerned and their doctor without steering in a direction, with wide services for families and intending spouses, results leading to no compulsory procedure, complete confidentiality, wider knowledge of it in medical institutes, schools, media and places of worship after qualified training, and affected families consulting physicians. On the rulings of genetic treatment: preventive genetic screening is permissible with safe lawful means, and the ruler may impose it during epidemics or exposure to radiation or toxins affecting genes for the public good, keeping results confidential; premarital genetic testing is permissible with a safe lawful means, and the ruler may oblige it for a recognised public benefit; pre-implantation diagnosis (test-tube fertilisation) is permissible with measures guaranteeing no mixing or loss of samples; pregnancy testing has varied medical means at different stages, and if a hereditary disease is confirmed abortion is permissible per its resolution 56 (7/6); and genetic testing of newborns is obligatory for early intervention where treatment is possible. It recommended: awareness of hereditary diseases and reducing their spread; encouraging premarital testing via media, seminars and places of worship; health bodies increasing human-genetics units and genetic counselors; the IOMS tracking developments; Islamic states fostering sharia-recognised genetic engineering through research centres, qualified staff, education and media simplification; states providing services to the needy unable to bear the cost; producers of animal- and plant-source foods labelling the genetically engineered versus the purely natural for informed consumers; states legislating to protect citizens from being made fields of experiment; and activating consumer-protection institutions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں — جدہ میں اسلامی آرگنائزیشن فار میڈیکل سائنسز کے ساتھ اس کی فقہی-طبی سیمینار ⁦(13–15 ربیع الآخر 1434ھ، 23–25 فروری 2013ء)⁩ کی سفارشات کے بعد، قرارداد 193 ⁦(20/8)⁩ کے نفاذ میں۔ انسانی جینوم پر: اس کی قرأت — انسان کے مکمل جینز کا نقشہ بنانا — انسان کی خود شناسی کا حصہ اور وراثتی امراض یا ان کے امکان کی پہچان کا ذریعہ ہے، صحت کے علوم میں قیمتی اضافہ جو اجتماعی فرائض میں داخل ہے، ضوابط کے ساتھ: مفید مقاصد جیسے روک تھام اور علاج کے لیے جائز؛ نقصان دہ یا شریعت کے خلاف استعمال جائز نہیں؛ کسی شخص کے جینوم سے متعلق کوئی تحقیق، علاج یا تشخیص خطرات و فوائد کے مسبق درست جائزے کے بغیر نہیں؛ جینیاتی نقشے کے تجزیے کے لیے شخص یا اس کے شرعی ولی کی معتبر اجازت اور اس کے مفاد کا لحاظ؛ ہر شخص کا یہ حق کہ وہ چاہے کہ اسے جینیاتی جانچ کے نتائج اور ان کے انجام سے آگاہ کیا جائے یا نہ؛ جینیاتی تشخیصات کی مکمل رازداری — صرف اس کی قراردادوں 79 ⁦(8/10)⁩ برائے طبی پیشوں کے راز اور 142 ⁦(15/8)⁩ برائے طبیب کی ضمانت کی صورتوں میں افشاء — اور طبیب مریض کی اجازت لے کہ سنگین مرض کی خبر اس کے گھر والوں کو دے، نہ مانے تو ان کی جان بچانے کی خاطر قائل کرنے کی کوشش کرے؛ 1419ھ سیمینار کی سفارش کے ضوابط کی تائید؛ کسی شخص کو اس کی وراثتی خصوصیات کی بنیاد پر اس کے بنیادی حقوق، آزادیوں اور عزت کو چھیننے کے لیے امتیاز کا نشانہ نہیں بنایا جا سکتا؛ اور شریعت کے خلاف یا اسلام کے ماننے والے انسانی حقوق کی بے عزتی کرنے والی جینیاتی طبی تحقیق جائز نہیں۔ جین تھیراپی — ڈی این اے کا ٹکڑا یا صحت مند جین منتقل کرنا یا مریض جین کی جگہ صحت مند جین لگانا تاکہ اس کا کام بحال ہو — دو قسمیں: جسمانی خلیات کی تھیراپی علاج کے لیے جائز ہے شرائط کے ساتھ جن میں: موجودہ نقصان سے بڑا نقصان نہ ہو، شفا یا درد میں کمی کا قوی امکان، متبادل کا نہ ہونا، قرارداد 57 ⁦(6/8)⁩ کے اعضاء پیوند کاری کے شرائط، اور اعلیٰ مہارت و امانت والے ماہرین کا کرنا؛ جبکہ اسے صفات جیسے ظاہری شکل حاصل کرنے کے لیے استعمال کرنا جائز نہیں — تغییرِ خلقت کی ممانعت، کھیل اور عزت کی بیقدری کی وجہ سے؛ تناسلی خلیات کے لیے وراثتی مرض جاننے کی جینیاتی جانچ جائز، مگر موجودہ شکل کی تھیراپی جو شرعی احکام — بالخصوص انساب کے میل کی ممانعت — نہیں مانتی، خطرے اور نقصان کی وجہ سے ممنوع۔ جینیاتی انجینئرنگ پر: انسانی نسل کی نام نہاد بہتری کے لیے جینیاتی ساخت بدلنا جائز نہیں، اور شخصیت یا ذمہ داری کی اہلیت میں مداخلت کا ہر جینیاتی کھیل شرعاً ممنوع؛ پودوں اور جانوروں میں فائدہ اٹھانے کی اصل اباحت ہے ضوابط کے ساتھ — عاجل یا آجل نقصان نہ ہو، مقصد درست و جائز بغیر کھیل یا اسراف کے، اور تجربہ کار و قابلِ اعتماد لوگ کریں؛ نقصان دہ مقاصد کے لیے جائز نہیں۔ جینیاتی مشاورت پر: وہ طالبین کو درست علم، توقعات اور شماریاتی تناسب دینا چاہتی ہے اور فیصلہ متعلقہ افراد اور معالج کا ہو بغیر کسی سمت میں دھکیلے، خاندانوں اور شادی کے ارادہ رکھنے والوں کے لیے وسیع خدمات، نتائج کسی لازمی عمل پر نہ منتج ہوں، مکمل رازداری، طبی اداروں، مدارس، میڈیا اور عبادت گاہوں میں تربیت یافتہ افراد کے ذریعے آگہی، اور متاثرہ خاندان ڈاکٹروں سے مشورہ کریں۔ جینیاتی علاج کے احکام: وقائی جینیاتی سکریننگ محفوظ جائز ذرائع سے جائز، اور ولیِ امر وباء یا جینز پر اثر کرنے والے اشعاعی یا زہریلے مواد کے سامنے لازم کر سکتا ہے عوامی نقصان دفع کے لیے بشرط نتائج کی رازداری؛ شادی سے پہلے جینیاتی جانچ محفوظ جائز ذریعے سے جائز اور ولیِ امر معتبر عوامی مفاد کے لیے لازم کر سکتا ہے؛ لگائے جانے سے پہلے نطفہ کی تشخیص ⁦(ٹیسٹ ٹیوب بچہ)⁩ جائز ہے بشرطیکہ نمونوں کے میل یا ضیاع سے بچانے کی تدابیر ہوں؛ حمل کے دوران جانچ کے متنوع طبی طریقے مراحل میں ہیں اور وراثتی مرض ثابت ہونے پر اسقاطِ حمل اس کی قرارداد 56 ⁦(7/6)⁩ کے مطابق جائز؛ اور نوزائیدہ بچوں کی جینیاتی جانچ واجب ہے جہاں علاج ممکن ہو۔ سفارشات: وراثتی امراض کی آگہی اور پھیلاؤ میں کمی؛ شادی سے پہلے جانچ کی حوصلہ افزائی میڈیا، سیمینار اور عبادت گاہوں سے؛ صحت کے اداروں سے انسانی وراثت کے یونٹ اور جینیاتی مشاور بڑھانے کی اپیل؛ اسلامی آرگنائزیشن فار میڈیکل سائنسز سے جدتوں کی پیروی؛ اسلامی ممالک سے شرعاً معتبر جینیاتی انجینئرنگ کی ترقی — تحقیق مراکز، اہل افراد، تعلیم اور میڈیا میں سادگی؛ ریاستوں سے بے بس ضرورت مندوں کو خدمات فراہم کرنا؛ حیوانی و نباتی غذائی مصنوعات بنانے والوں پر جینیاتی انجینئرنگ سے تیار شدہ اور فطری میں فرق واضح کرنا لازم کرنا؛ شہریوں کو تجربات کا میدان بننے سے بچانے کے لیے قانون سازی؛ اور صارفین کے تحفظ کے اداروں کو فعال بنانا۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013), después de su seminario jurídico-médico con la Organización Islámica para las Ciencias Médicas en Yeda (13-15 de Rabi al-Akhir de 1434, 23-25 de febrero de 2013) bajo la resolución 193 (20/8). Sobre el genoma humano: leerlo —mapear los genes humanos completos— es parte del conocimiento que el hombre tiene de sí mismo y un medio para reconocer enfermedades hereditarias o su probabilidad, una valiosa adición a las ciencias de la salud que cae bajo deberes colectivos, con controles: puede usarse para fines beneficiosos como la prevención y el tratamiento; no para uso dañino o contrario a la sharia; ninguna investigación, tratamiento o diagnóstico en el genoma de una persona sin una evaluación previa precisa de riesgo-beneficio; consentimiento legalmente válido de la persona o su tutor legal para analizar su mapa genético teniendo en cuenta su interés; El derecho de cada persona a elegir si desea ser informada de los resultados de las pruebas genéticas y sus consecuencias; la completa confidencialidad de los diagnósticos genéticos, revelados solo en los casos de sus resoluciones 79 (8/10) sobre secretos médico-profesionales y 142 (15/8) sobre responsabilidad del médico: el médico obtiene el consentimiento del paciente para revelar una enfermedad grave a su familia y, de no obtenerlo, intenta persuadirlo para que no se ocupe de su salud, poniendo en peligro sus vidas; reafirmar los controles de su recomendación del seminario 1419; no discriminar a nadie por sus rasgos genéticos para privarlo de sus derechos fundamentales y su dignidad; y no realizar investigaciones clínicas del genoma contrarias a la sharia o que falten al respeto a los derechos humanos que reconoce el Islam. Sobre la terapia génica —transferir un fragmento de ADN o un gen sano o sustituir un gen enfermo por uno sano para restaurar la función— dos tipos: la terapia con células somáticas es permisible para el tratamiento bajo condiciones que incluyen no causar mayor daño que el existente, una alta probabilidad de curación o alivio del dolor, ausencia de alternativas, las condiciones de transferencia de órganos de la resolución 57 (6/8) y ejecución por especialistas altamente capacitados y confiables; mientras que su uso para adquirir rasgos como la apariencia está prohibido por ser una alteración prohibida de la creación, frivolidad y degradación de la dignidad; para las células germinales, las pruebas genéticas para detectar una enfermedad hereditaria son permisibles, pero la terapia en su forma actual que no observa las normas de la sharia —especialmente la no mezcla de linajes— está prohibida por su gravedad y daño. Sobre la ingeniería genética: no puede usarse para alterar la composición genética para el llamado mejoramiento de la raza humana, y cualquier manipulación genética del carácter de una persona o interferencia con su capacidad de responsabilidad está prohibida; el defecto de beneficiarse de ello en plantas y animales es permisible bajo controles: sin daño inmediato o retardado, un propósito legal adecuado sin frivolidad o desperdicio, y ejecución por expertos de confianza; y no puede usarse para fines dañinos. Sobre el asesoramiento genético: tiene como objetivo brindar a los solicitantes conocimiento correcto, expectativas y proporciones estadísticas, la decisión recae en las personas interesadas y su médico sin dirigir en una dirección, con amplios servicios para familias y cónyuges potenciales, resultados que no conducen a un procedimiento obligatorio, confidencialidad completa, conocimiento más amplio de ello en institutos médicos, escuelas, medios y lugares de culto después de una capacitación calificada, y familias afectadas consultando a médicos. Sobre las resoluciones del tratamiento genético: el cribado genético preventivo es permisible con medios legales seguros, y el gobernante puede imponerlo durante epidemias o exposición a radiación o toxinas que afecten los genes para el bien público, manteniendo los resultados confidenciales; las pruebas genéticas prematrimoniales son permisibles con un medio legal seguro, y el gobernante puede obligarlas para un beneficio público reconocido; El diagnóstico preimplantacional (fecundación in vitro) es permisible con medidas que garanticen que no se mezclen ni se pierdan las muestras; las pruebas de embarazo tienen diversos medios médicos en diferentes etapas, y si se confirma una enfermedad hereditaria, el aborto es permisible según su resolución 56 (7/6); y las pruebas genéticas de los recién nacidos son obligatorias para la intervención temprana cuando el tratamiento es posible. Se recomendó: concienciar sobre las enfermedades hereditarias y reducir su propagación; fomentar las pruebas prematrimoniales a través de los medios de comunicación, seminarios y lugares de culto; que los organismos de salud aumenten las unidades de genética humana y los asesores genéticos; que el IOMS haga un seguimiento de los avances; que los estados islámicos fomenten la ingeniería genética reconocida por la sharia a través de centros de investigación, personal cualificado, educación y simplificación de los medios de comunicación; que los estados presten servicios a los necesitados que no puedan afrontar el coste; que los productores de alimentos de origen animal y vegetal etiqueten los genéticamente modificados frente a los puramente naturales para que los consumidores estén informados; que los estados legislen para proteger a los ciudadanos de ser convertidos en campos de experimentación; y que se activen las instituciones de protección del consumidor."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013), suite à son séminaire juridico-médical avec l'Organisation islamique des sciences médicales à Djeddah (13-15 Rabi al-Akhir 1434, 23-25 février 2013), conformément à la résolution 193 (20/8). Concernant le génome humain: son séquençage – le séquençage complet des gènes humains – fait partie intégrante de la connaissance de soi et permet de reconnaître les maladies héréditaires ou leur probabilité. Il s'agit d'un apport précieux aux sciences de la santé relevant de la compétence collective, sous réserve de certaines conditions: son utilisation peut être bénéfique, notamment en matière de prévention et de traitement; elle ne peut être nuisible ou contraire à la charia; aucune recherche, aucun traitement ni aucun diagnostic ne peut être effectué sur le génome d'une personne sans une évaluation précise et préalable des risques et des bénéfices; le consentement éclairé de la personne ou de son tuteur légal est requis pour l'analyse de sa carte génétique, dans le respect de ses intérêts. Le droit de chaque personne de choisir d'être informée ou non des résultats de ses tests génétiques et de leurs conséquences; la confidentialité absolue des diagnostics génétiques, divulguée uniquement dans les cas prévus par ses résolutions 79 (8/10) sur le secret médical et 142 (15/8) sur la responsabilité du médecin – le médecin devant obtenir le consentement du patient avant de divulguer une maladie grave à sa famille et, à défaut, tenter de le dissuader de poursuivre les soins pour sauver leur vie; la confirmation des contrôles énoncés dans sa recommandation du séminaire de 1419; l'interdiction de toute discrimination fondée sur les caractéristiques génétiques qui pourrait porter atteinte aux droits fondamentaux et à la dignité de quiconque; et l'interdiction de toute recherche clinique sur le génome contraire à la charia ou ne portant pas atteinte aux droits humains reconnus par l'islam. Concernant la thérapie génique – le transfert d'un fragment d'ADN ou d'un gène sain, ou la substitution d'un gène malade par un gène sain pour restaurer une fonction – deux types sont autorisés: la thérapie cellulaire somatique est permise pour le traitement sous certaines conditions, notamment l'absence de préjudice supplémentaire par rapport à l'état actuel, une forte probabilité de guérison ou de soulagement de la douleur, l'absence d'alternatives, les conditions de transplantation d'organes prévues par la résolution 57 (6/8), et l'exécution par des spécialistes hautement qualifiés et dignes de confiance. L'utilisation de la génétique pour acquérir des caractéristiques telles que l'apparence est interdite, car elle constitue une altération prohibée de la création, une frivolité et une atteinte à la dignité humaine. Concernant les cellules germinales, les tests génétiques visant à détecter une maladie héréditaire sont autorisés, mais les thérapies génétiques, sous leur forme actuelle, qui ne respectent pas les préceptes de la charia – notamment l'interdiction du mélange des lignées – sont interdites en raison de leur gravité et de leur potentiel de nuisance. Quant au génie génétique: il ne peut être utilisé pour modifier le patrimoine génétique dans le but d'améliorer la race humaine, et toute manipulation génétique du caractère d'une personne ou portant atteinte à sa capacité de responsabilité est interdite. Son utilisation chez les plantes et les animaux, sans bénéfice apparent, est permise sous certaines conditions: absence de préjudice immédiat ou différé, finalité légitime et licite, absence de frivolité ou de gaspillage, et mise en œuvre par des experts reconnus. Enfin, il ne peut être utilisé à des fins nuisibles. Concernant le conseil génétique: il vise à fournir aux personnes concernées des informations exactes, des attentes réalistes et des statistiques fiables. La décision leur appartient, ainsi qu’à leur médecin, sans orientation. De nombreux services sont proposés aux familles et aux futurs conjoints. Les résultats n’entraînent aucune procédure obligatoire. La confidentialité est totale. Une meilleure diffusion de l’information est prévue dans les établissements médicaux, les écoles, les médias et les lieux de culte, après une formation adéquate. Les familles concernées peuvent consulter un médecin. Concernant les dispositions relatives aux traitements génétiques: le dépistage génétique préventif est autorisé par des moyens sûrs et légaux. Le souverain peut l’imposer en cas d’épidémie ou d’exposition à des radiations ou à des toxines affectant les gènes, pour l’intérêt public, en garantissant la confidentialité des résultats. Le test génétique prénuptial est autorisé par des moyens sûrs et légaux, et le souverain peut le rendre obligatoire pour un intérêt public reconnu. Le diagnostic préimplantatoire (fécondation in vitro) est autorisé avec des mesures garantissant l’absence de mélange ou de perte d’échantillons. Les tests de grossesse sont réalisés par différents moyens médicaux à différents stades, et si une maladie héréditaire est confirmée, l’interruption de grossesse est autorisée conformément à la résolution 56 (7/6). Le test génétique néonatal est obligatoire pour une intervention précoce lorsque le traitement est possible. Il a été recommandé: la sensibilisation aux maladies héréditaires et la réduction de leur propagation; la promotion des tests prénuptiaux par le biais des médias, de séminaires et des lieux de culte; le renforcement des unités de génétique humaine et du nombre de conseillers en génétique au sein des organismes de santé; le suivi des évolutions par l’IOMS; la promotion, par les États islamiques, du génie génétique conforme à la charia par le biais de centres de recherche, de personnel qualifié, de l’éducation et d’une simplification des médias; la fourniture de services aux personnes démunies incapables d’en supporter le coût; l’étiquetage, par les producteurs d’aliments d’origine animale et végétale, des produits génétiquement modifiés par rapport aux produits purement naturels afin d’informer les consommateurs; la législation, par les États, visant à protéger les citoyens contre toute utilisation comme cobayes; et l’activation des institutions de protection des consommateurs."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Riyad'daki yirmi birinci oturumunda (15–19 Muharrem 1435H, 18–22 Kasım 2013) Cidde'deki İslam Tıp Bilimleri Örgütü ile yaptığı tıbbi hukuk seminerinin tavsiyeleri doğrultusunda (13–15 Rabi'al-Thani 1434H, 23–25 Şubat 2013) 193 (20/8) sayılı kararını uygulayarak ortak kararı almıştır. İnsan genomunda, bir kişinin tam genlerinin haritalanmasının — kendini fark etmenin bir parçası olduğu ve genetik hastalıkları ya da bu hastalıklara yakalanma olasılığını tanımlamanın bir yolu olduğu kararlaştırılmıştır. Sağlık bilimlerine ek olarak, kontrollerle birlikte: önleme ve tedavi gibi faydalı alanlarda kullanılabilir; zararlı veya Şeriat'a aykırı amaçlarla kullanılmamalıdır; risk ve faydaların kapsamlı değerlendirilmesinden sonra kişinin genomuyla ilgili hiçbir araştırma, tedavi veya teşhis yapılmasına izin verilmez; ve İslam hukukuna göre geçerli kabul edilen geçerli bir izin talep edilir. veya yasal vasisi, kendi çıkarlarını gözeterek genetik haritalarını analiz etmek; her kişi genetik test sonuçlarını ve sonuçlarını bilip bilmemeye karar verme hakkına sahiptir; genetik tanıların tam gizliliği ve 79 (8/10) sayılı tıbbi mesleklerde gizlilik ile 142 (15/8) sayılı doktor garantisi kapsamındaki kararlar dışında yayılmamalıdır. Doktor, hasta ciddi bir hastalık geçirirse ailesine sırrı açıklamak için onay almalıdır; kabul etmezse, ailesinin hayatı için endişeyle ikna etmeye çalışmalıdır; ve 1419 Hicri seminerinin öneri düzenlemelerini vurgulamalı; ayrıca bir kişinin ayrımcılığa maruz kalması kabul edilemez Haklarını, özgürlüklerini ve onurlarını zedeleyen genetik özellikleri nedeniyle; Şeriat'a aykırı veya İslam tarafından tanınan insan haklarına saygı göstermeyen genetik klinik araştırmalar yapılması kabul edilemez. Gen tedavisinde—DNA'nın veya sağlıklı bir genin bir parçasının aktarılması ya da sağlıklı bir genin yerine bir hastanın işlevini geri kazandırmak için değiştirilmesi iki tür vardır: Somatik hücreler, mevcut genden daha fazla zarar vermeyen, iyileşme veya ağrı giderme olasılığı en yüksek olan koşullarda tedavi edilebilir ve başka bir alternatif mümkün değildir. Organ nakli koşulları, 57 (6/8) sayılı Karar'da gözlemlenmiş ve uzman ve dürüstlük sahibi uzmanlar tarafından yürütülmektedir; görünüm gibi özelliklerin kazanılması yasaklı değişiklikler, müdahale veya tahrip için kullanılmasına izin verilmez; cinsiyet hücreleri genetik hastalığı tespit etmek için genetik teste tabi tutulabilir; ve mevcut haliyle tedavi, özellikle soy yokluğuna uymayan dini kurallara uymayan, tehlike ve zararı önlediği düşünülmektedir. Genetik mühendislikte: insan soy iyileştirmesi olarak adlandırılan genetik yapıyı değiştirmek için kullanılması yasaktır. İnsan kişiliğine herhangi bir genetik müdahale veya sorumluluk kapasitesini etkilemek İslam hukuku tarafından yasaktır. Bitki ve hayvanlarda bundan yararlanmanın ilkesi, belirli koşullar altında izin vermektir: anında veya gecikmeli zarar vermemeli ve müdahale veya israf olmaksızın meşru ve izin verilen bir amaç için olmalıdır. Deneyimli ve güvenilir kişiler tarafından ele alınmalıdır; zararlı amaçlarla kullanılmasına izin verilmez. Genetik danışmanlıkta: başvuru sahiplerine doğru bilgi, beklentiler ve istatistiksel oranlar sağlamayı amaçlar. Karar, doktorla ilgili kişiler için geçerlidir; belirli bir yönde etkisi olmayan, ailelere ve evlenmek üzere olanlara hizmet sunarken. Sonuçlar, zorunlu prosedürler, sonuçların tam gizliliği ve enstitülerde, okullarda, medyada ve ibadet yerlerinde genetik hastalık doktorlara görünen ailelere danışıldıktan sonra bilgi genişletilmesine yol açmaz. Genetik tedavi hükümleri: Önleyici genetik tarama, izin verilen ve güvenli olduğu sürece izin verilir ve vasi, salgın veya genleri etkileyen radyoaktif maddelere maruz kalma sırasında kamu zararını gizlice önlemek için bunu zorunlu kılabilir; evlilik öncesi genetik testler güvenli ve izin verilen bir yöntemle yapılabilir ve vasi önemli bir kamu yararı için bunu talep edebilir; sperm implantasyonundan önce tanı (in vitro fertilizasyon) izin verilir, ancak prosedürler numunelerin karıştırılmamasını ve korunmasını sağlar; gebelik testlerinin farklı aşamalarda çeşitli yöntemleri vardır; genetik hastalık kanıtlanırsa, 56 (7/6) sayılı kararına göre kürtaj yapılabilir; tedavi edilebilir vakalarda erken müdahale için yenidoğanlar için genetik test gereklidir. Genetik hastalıklar konusunda farkındalığın artırılmasını ve yayılımının azaltılmasını; medya, seminerler ve ibadet yerleri aracılığıyla evlilik öncesi testlerin teşvik edilmesini; sağlık otoritelerinin insan genetiği ve genetik danışmanlık birimlerini artırmaya teşvik edilmesini; İslami Tıp Bilimleri Örgütü'nün gelişmelerini izlemesini; İslam ülkelerini grupla uyumlu araştırma merkezleri kurmaya teşvik etmelerini, personeli niteliklendirmelerini, eğitimi başlatmalarını ve halkın kolaylaştırılmasını; yüksek maliyetleri karşılayamayan ihtiyaç sahiplerine hizmet sunmasını; gıda üreticilerinin fabrikayı tamamen doğal genetik mühendisliği ile ilan etmelerini zorunlu kılmasını, böylece tüketicilerin anlayabilmesi için fabrikanın tamamen doğal genetik mühendisliği ile tanımlanmasını zorunlu kılılmasını; vatandaşlarını test alanı olarak kullanılmaktan koruyan yasaların çıkarılmasını ve tüketici koruma kurumlarının rolünün aktif hale getirilmesini önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh satu di Riyadh (15–19 Muharram 1435H, 18–22 November 2013) mengikuti rekomendasi seminar yurisprudensi medis bersama Organisasi Islam untuk Ilmu Kedokteran di Jeddah (13–15 Rabi al-Thani 1434H, 23–25 Februari 2013), melaksanakan Keputusan 193 (20/8). Diputuskan dalam genom manusia bahwa membacanya — memetakan gen lengkap seseorang — adalah bagian dari kesadaran diri dan cara untuk mengidentifikasi penyakit genetik atau kemungkinan tertular penyakit tersebut. Ini selain ilmu kesehatan yang termasuk dalam hipotesis kompetensi, dengan kontrol: dapat digunakan di bidang yang bermanfaat seperti pencegahan dan pengobatan; tidak boleh digunakan dalam hal yang berbahaya atau bertentangan dengan Syariah; tidak ada penelitian, pengobatan, atau diagnosis yang terkait dengan genom seseorang yang diperbolehkan kecuali setelah penilaian menyeluruh terhadap risiko dan manfaat; dan izin yang sah yang dianggap sah menurut hukum Islam diperlukan dari orang tersebut. atau wali hukum mereka untuk menganalisis peta genetik mereka sambil mempertimbangkan kepentingan sendiri; setiap orang berhak memilih apakah mengetahui hasil tes genetik dan konsekuensinya; kerahasiaan penuh diagnosis genetik dan tidak menyebar kecuali dalam kasus Resolusi 79 (8/10) mengenai kerahasiaan profesi medis dan 142 (15/8) mengenai jaminan dokter. Dokter harus mendapatkan persetujuan pasien untuk mengungkapkan rahasia kepada keluarganya jika mereka menderita penyakit serius; jika tidak setuju, mencoba membujuk mereka karena peduli pada kehidupan keluarganya; dan menekankan peraturan rekomendasi seminar tahun 1419 AH; dan tidak diperbolehkan melakukan diskriminasi pada seseorang Karena sifat genetiknya yang merusak hak, kebebasan, dan martabat mereka; tidak diperbolehkan melakukan penelitian klinis genetik yang bertentangan dengan Syariah atau tidak menghormati hak asasi manusia yang diakui oleh Islam. Dalam terapi gen—mentransfer sebagian DNA atau gen sehat atau mengganti gen sehat dengan pasien untuk memulihkan fungsinya—terdapat dua jenis: sel somatik dapat diobati dalam kondisi seperti tidak menyebabkan kerusakan lebih besar daripada yang ada, dengan kemungkinan besar penyembuhan atau pereda nyeri, dan tidak ada alternatif yang mungkin. Kondisi transplantasi organ dipatuhi dalam Keputusan 57 (6/8) dan dilakukan oleh spesialis yang memiliki keahlian dan integritas; penggunaannya untuk memperoleh ciri seperti penampilan tidak diperbolehkan untuk perubahan terlarang, penguasaan, atau penodaan; sel seks dapat menjalani tes genetik untuk mendeteksi penyakit genetik; dan pengobatan dalam bentuk saat ini, yang tidak mematuhi aturan agama, terutama ketiadaan garis keturunan, dianggap mencegah bahaya dan bahaya. Dalam rekayasa genetika: tidak diperbolehkan menggunakannya untuk mengubah struktur genetik dalam apa yang disebut peningkatan garis keturunan manusia. Setiap manipulasi genetik terhadap kepribadian manusia atau memengaruhi kapasitas tanggung jawab seseorang dilarang oleh hukum Islam. Prinsip untuk mendapatkan manfaat darinya pada tumbuhan dan hewan adalah mengizinkannya dalam kondisi tertentu: tidak boleh menyebabkan kerugian langsung atau tertunda, dan harus untuk tujuan yang sah dan diperbolehkan tanpa gangguan atau pemborosan. Konseling ini harus ditangani oleh individu yang berpengalaman dan dapat dipercaya; tidak diperbolehkan digunakan untuk tujuan yang berbahaya. Dalam konseling genetika: ini dimaksudkan untuk memberikan pengetahuan, harapan, dan rasio statistik yang benar bagi pemohonnya. Keputusan diberikan kepada mereka yang terlibat dengan dokter tanpa pengaruh ke arah tertentu, sambil memberikan layanan bagi keluarga dan mereka yang akan menikah. Hasilnya tidak mengarah pada prosedur wajib, kerahasiaan penuh atas hasil, dan perluasan pengetahuan tentangnya di lembaga, sekolah, media, dan tempat ibadah setelah memenuhi syarat mereka yang bertanggung jawab, serta berkonsultasi dengan keluarga jika penyakit genetik muncul kepada dokter. Ketentuan pengobatan genetik: Skrining genetik preventif diizinkan asalkan diizinkan dan aman, dan wali dapat memaksanya selama epidemi atau paparan bahan radioaktif yang memengaruhi gen untuk mencegah bahaya publik dengan kerahasiaan; tes genetik sebelum menikah diizinkan dengan cara yang aman dan diperbolehkan, dan wali dapat memerintahkannya untuk kepentingan publik yang signifikan; diagnosis sebelum implantasi sperma (fertilisasi in vitro) diizinkan asalkan prosedur memastikan sampel tidak dicampur dan dipertahankan; pengujian kehamilan memiliki berbagai metode pada tahap yang berbeda; jika penyakit genetik terbukti, aborsi diizinkan sesuai dengan keputusan 56 (7/6); tes genetik untuk bayi baru lahir diperlukan untuk intervensi dini pada kasus yang dapat diobati. Ia merekomendasikan peningkatan kesadaran tentang penyakit genetik dan pengurangan penyebarannya; mendorong tes pra-nikah melalui media, seminar, dan tempat ibadah; mendesak otoritas kesehatan untuk meningkatkan unit genetika manusia dan konseling genetik; memantau perkembangan oleh Organisasi Islam untuk Ilmu Kemedisan; mendorong negara-negara Islam untuk mendirikan pusat penelitian yang kompatibel dengan kelompok, memenuhi syarat staf, memperkenalkan pendidikan, dan menyederhanakannya untuk publik; menyediakan layanan bagi mereka yang membutuhkan dan tidak mampu membayar biaya tinggi; mewajibkan produsen makanan untuk menyatakan pabrik dengan rekayasa genetika alami murni agar konsumen dapat memahami; mengesahkan undang-undang yang melindungi warga mereka dari penggunaan sebagai tempat uji coba; dan mengaktifkan peran lembaga perlindungan konsumen."
