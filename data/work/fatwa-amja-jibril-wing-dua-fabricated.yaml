id: work/fatwa-amja-jibril-wing-dua-fabricated
class: work
kind: fatwa
label: { ar: "دعاء على جناح جبريل حديث موضوع", en: "The supplication on Jibril's wing — fabricated", ur: "جبریل کے پر پر دعا — موضوع حدیث", es: "La súplica en el ala de Jibril — fabricada", fr: "La supplication sur l'aile de Jibril — fabriquée" }
summary:
  ar: "سأل سائل عن صحة حديث دعاء مكتوب على باطن جناح جبريل عندما رفع عيسى إلى السماء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77634 بتاريخ 31 يناير 2009)⁩ أن هذا الحديث موضوع مكذوب على رسول الله لا يجوز تناقله ولا نشره ولا نسبته إلى النبي."
  en: "A questioner asked about a supplication said to be written on the inside of Jibril's wing when he raised Isa to heaven. Dr. Salah al-Sawi (fatwa no. 77634, 31 January 2009) answered that it is a fabricated lie against the Messenger of God — not to be transmitted, published, or attributed to him."
  ur: "ایک سائل نے جبریل کے پر پر لکھی دعا کی صحت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77634، 31 جنوری 2009)⁩ کے مطابق یہ موضوع حدیث ہے — نقل اور نشر اس کی جائز نہیں۔"
  es: "Un consultante preguntó acerca de una súplica que supuestamente estaba escrita en el interior del ala de Jibril cuando elevó a Isa al cielo. El Dr. Salah al-Sawi (fatwa n.° 77634, 31 de enero de 2009) respondió que se trata de una mentira inventada contra el Mensajero de Dios, que no debe ser transmitida, publicada ni atribuida a él."
  fr: "Un internaute a posé une question concernant une invocation qui aurait été inscrite à l'intérieur de l'aile de Jibril lorsqu'il a élevé Isa au ciel. Le Dr Salah al-Sawi (fatwa n° 77634, 31 janvier 2009) a répondu qu'il s'agissait d'un mensonge fabriqué de toutes pièces contre le Messager de Dieu, et qu'il ne fallait ni le transmettre, ni le publier, ni le lui attribuer."
