label: { ar: "دعاء على جناح جبريل حديث موضوع", en: "The supplication on Jibril's wing — fabricated", ur: "جبریل کے پر پر دعا — موضوع حدیث" }
summary:
  ar: "سأل سائل عن صحة حديث دعاء مكتوب على باطن جناح جبريل عندما رفع عيسى إلى السماء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77634 بتاريخ 31 يناير 2009)⁩ أن هذا الحديث موضوع مكذوب على رسول الله لا يجوز تناقله ولا نشره ولا نسبته إلى النبي."
  en: "A questioner asked about a supplication said to be written on the inside of Jibril's wing when he raised Isa to heaven. Dr. Salah al-Sawi (fatwa no. 77634, 31 January 2009) answered that it is a fabricated lie against the Messenger of God — not to be transmitted, published, or attributed to him."
  ur: "ایک سائل نے جبریل کے پر پر لکھی دعا کی صحت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77634، 31 جنوری 2009)⁩ کے مطابق یہ موضوع حدیث ہے — نقل اور نشر اس کی جائز نہیں۔"
