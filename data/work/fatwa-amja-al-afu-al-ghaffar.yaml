id: work/fatwa-amja-al-afu-al-ghaffar
class: work
kind: fatwa
label: { ar: "العفو والغفار أيهما أبلغ", en: "Al-Afuww or al-Ghaffar — which is more emphatic", ur: "عفو اور غفار — کون زیادہ بلغ ہے" }
summary:
  ar: "سأل سائل عن خلاف أهل العلم هل اسم الله الغفار أبلغ من العفو أم العكس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77772 بتاريخ 9 فبراير 2009)⁩ أن العفو هو التجاوز عن الذنب وترك العقوبة عليه أما الغفران فمن غفر الشيء أي كفره وغطاه فالغفار الساتر لذنوب عباده المتجاوز عنها، ويحتمل أن يكون العفو أبلغ من المغفرة فإن الغفران ينبئ عن الستر والعفو ينبئ عن المحو والمحو أبلغ من الستر، ونقل عن الغزالي قوله في ذلك وحظ العبد أن يعفو عن كل من ظلمه."
  en: "A questioner raised the scholars' disagreement over whether God's name al-Ghaffar is more emphatic than al-Afuww or vice versa. Dr. Salah al-Sawi (fatwa no. 77772, 9 February 2009) answered that afw is overlooking the sin and leaving its punishment, while ghifara is from ghafr — covering and veiling — so al-Ghaffar is the One who veils His servants' sins and passes over them; it is possible afw is more emphatic, ghifara indicating veiling and afw indicating erasure, and erasure is more emphatic — citing al-Ghazali to that effect, with the servant's share being that he pardon whoever wrongs him."
  ur: "ایک سائل نے عفو اور غفار میں تقابل پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77772، 9 فروری 2009)⁩ کے مطابق غفر پردہ ڈالنا ہے اور عفو محو کرنا — غزالی کے بموجب محو زیادہ بلغ ہے؛ بندے کا حصہ یہ ہے کہ وہ ظالم کو معاف کرے۔"
