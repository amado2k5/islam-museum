summary:
  ar: "تفسير أبي السعود أفندي مفتي الدولة العثمانية؛ فرغ من تسويده وزاد في وظيفته وتشريفاته ثم بيضه إلى تمامه بعد سنة فاشتهر صيته وانتشرت نسخه في الأقطار ووقع التلقي بالقبول من الفحول والكبار لحسن سبكه ولطف تعبيره فصار يقال له خطيب المفسرين، وحكم حاجي خليفة أن تفسير أحد سواه بعد الكشاف والقاضي لم يبلغ إلى ما بلغ من رتبة الاعتبار والاشتهار، وعلقت عليه تعليقة الشيخ أحمد الرومي الاقحصاري المتوفى سنة ١٠٤١ وتعليقة عظيمة لرضي الدين بن يوسف المقدسي أهداها للمولى أسعد بن سعد الدين حين دخل القدس زائراً، وشرح ديباجته الطويلة محمد بن محمد الحسيني المدعو بزيرك زاده {cite:kashf-zunun-furqan p. 348-350}."
  en: "Abu al-Su'ud Afandi's tafsir — copied fair in a year, spread to every quarter, and hailed 'khatib al-mufassirin'; Hajji Khalifa judged no commentary after al-Kashshaf and 'the Qadi' (al-Baydawi) had reached its standing, and it drew the ta'liqas of Ahmad al-Rumi and Radi al-Din al-Maqdisi's presentation copy to the mufti As'ad b. Sa'd al-Din {cite:kashf-zunun-furqan p. 348-350}."
  es: "El tafsir de Abu al-Su'ud Afandi, copiado bastante en un año, extendido a todos los rincones y aclamado como 'khatib al-mufassirin'; Hajji Khalifa no consideró ningún comentario después de que al-Kashshaf y 'el Qadi' (al-Baydawi) alcanzaron su posición, y dibujó las ta'liqas de Ahmad al-Rumi y la copia de presentación de Radi al-Din al-Maqdisi al muftí As'ad b. Sa'd al-Din {citar:kashf-zunun-furqan p. 348-350}."
  fr: "Le tafsir d'Abu al-Su'ud Afandi — copié juste en un an, diffusé dans tous les quartiers et salué « khatib al-mufassirin »; Hajji Khalifa n'a jugé aucun commentaire après qu'al-Kashshaf et « le Qadi » (al-Baydawi) aient atteint son statut, et il a attiré la copie de présentation des ta'liqas d'Ahmad al-Rumi et Radi al-Din al-Maqdisi au mufti As'ad b. Sa'd al-Din {cite:kashf-zunun-furqan p. 348-350}."
  ur: "ابو السعود آفندی کی تفسیر - ایک سال میں میلے کی نقل کی گئی، ہر سہ ماہی میں پھیل گئی، اور 'خطیب المفسرین' کو سراہا گیا۔ حجی خلیفہ نے الکشاف اور 'قدی' ⁦(البیضاوی)⁩ کے اپنے مقام کو پہنچنے کے بعد کسی تفسیر کا فیصلہ نہیں کیا، اور اس نے احمد الرومی اور ردی الدین المقدسی کے تقلید کو مفتی اسعد ب کی طرف متوجہ کیا۔ سعدالدین {سائٹ:کشف الذنون فرقان ص۱۱۔ 348-350}۔"
  tr: "Osmanlı İmparatorluğu Müftüsü Ebu el-Süud Efendi'nin Tafsiri; kararlaştırmasını tamamladı, görev ve onurlarını artırdı, ardından bir yıl sonra tamamladı. İtibarı ün kazandı, kopyaları ülke genelinde yayıldı ve hitabeti ve hitabeti sayesinde önde gelen ve seçkin kişiler tarafından iyi karşılandı, böylece tefsirlerin vaizi olarak tanındı. Hacı Halife, El-Kaşşaf ve Kadi'den sonra kimsenin tefsirinin saygı ve şöhret seviyesine ulaşmadığını hükmetti. 1041'de ölen Şeyh Ahmed al-Rumi al-Aqisari'nin tefsiri ve Radi al-Din ibn Yusuf al-Maqdisi'nin büyük bir şerhi, Kudüs'e ziyaretçi olarak girdiğinde Mawla As'ad bin Saad al-Din'e ithaf etmiştir; uzun önsözü Muhammed bin Muhammed el-Hüseyni, yani Bzirkzadeh {alıntı: Kaşf-Zunun-Furqan, s. 348-350}."
  id: "Tafsir Abu al-Saud Effendi, Mufti Kekaisaran Ottoman; ia menyelesaikan penghitamannya dan meningkatkan tugas serta kehormatannya, lalu menyelesaikannya setelah setahun. Reputasinya menjadi terkenal, tulisannya menyebar ke seluruh negeri, dan ia diterima dengan baik oleh tokoh-tokoh terkemuka berkat kefasihan dan kefasihannya, sehingga ia dikenal sebagai pengkhotbah para komentator. Haji Khalifa memutuskan bahwa tafsir siapa pun setelah Al-Kashshaf dan Qadi tidak mencapai tingkat penghormatan dan ketenaran yang tinggi. Komentar Sheikh Ahmad al-Rumi al-Aqisari, yang wafat pada tahun 1041, dan komentar besar dari Radi al-Din ibn Yusuf al-Maqdisi, yang ia dedikasikan untuk Mawla As'ad ibn Saad al-Din saat ia memasuki Yerusalem sebagai pengunjung, mengomentari kata pengantar panjangnya, Muhammad ibn Muhammad al-Husayni, yang dikenal sebagai Bzirkzadeh {cite::Kashf-Zunun-Furqan, hlm. 348-350}."
