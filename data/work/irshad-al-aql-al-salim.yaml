label: { ar: "إرشاد العقل السليم إلى مزايا القرآن الكريم" }
summary:
  ar: "تفسير أبي السعود أفندي مفتي الدولة العثمانية؛ فرغ من تسويده وزاد في وظيفته وتشريفاته ثم بيضه إلى تمامه بعد سنة فاشتهر صيته وانتشرت نسخه في الأقطار ووقع التلقي بالقبول من الفحول والكبار لحسن سبكه ولطف تعبيره فصار يقال له خطيب المفسرين، وحكم حاجي خليفة أن تفسير أحد سواه بعد الكشاف والقاضي لم يبلغ إلى ما بلغ من رتبة الاعتبار والاشتهار، وعلقت عليه تعليقة الشيخ أحمد الرومي الاقحصاري المتوفى سنة ١٠٤١ وتعليقة عظيمة لرضي الدين بن يوسف المقدسي أهداها للمولى أسعد بن سعد الدين حين دخل القدس زائراً، وشرح ديباجته الطويلة محمد بن محمد الحسيني المدعو بزيرك زاده {cite:kashf-zunun-furqan p. 348-350}."
  en: "Abu al-Su'ud Afandi's tafsir — copied fair in a year, spread to every quarter, and hailed 'khatib al-mufassirin'; Hajji Khalifa judged no commentary after al-Kashshaf and 'the Qadi' (al-Baydawi) had reached its standing, and it drew the ta'liqas of Ahmad al-Rumi and Radi al-Din al-Maqdisi's presentation copy to the mufti As'ad b. Sa'd al-Din {cite:kashf-zunun-furqan p. 348-350}."
