  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن بنوك الحليب: منع إنشاء بنوك حليب الأمهات في العالم الإسلامي وحرمة الرضاع منها."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on milk banks: it barred the establishment of human-milk banks in the Muslim world and forbade nursing from them."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ دودھ بینکوں پر: مسلم دنیا میں ماؤں کے دودھ کے بینک قائم کرنے کی منع اور ان سے دودھ پینے کی حرمت۔"
  es: "Resolución de la IIFA (Kuwait, diciembre de 1985) sobre los bancos de leche: prohibía el establecimiento de bancos de leche humana en el mundo musulmán y prohibía la lactancia materna a partir de ellos."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985) sur les banques de lait: elle interdisait la création de banques de lait humain dans le monde musulman et interdisait l'allaitement à partir de ces banques."
