id: work/fatwa-amja-wudu-for-armless-man
class: work
kind: fatwa
label: { ar: "وضوء الأقطع", en: "Wudu for a man with no hands — washing what remains", ur: "بغیر ہاتھوں کے شخص کا وضو" }
summary:
  ar: "سأل سائل كيف يتوضأ رجل أقطع بدون يدين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21939 بتاريخ 25 ديسمبر 2005)⁩ أن الله لا يكلف نفسًا إلا وسعها فهذا الرجل ينبغي عليه أن يغسل من يديه ما بقي وأما إن كان السؤال عن إمكانية غسل باقي الأعضاء فإنه يغسلها ما أمكن على ما فصّل الجواب من قاعدة التكليف بحسب الوسع."
  en: "A questioner asked how a handless man does wudu. Dr. Salah al-Sawi (fatwa no. 21939, 25 December 2005) answered that God tasks no soul beyond its capacity: this man should wash what remains of his hands; and if the question was about the rest of the limbs, he washes them as far as possible — the duty-by-capacity rule the answer details."
  ur: "بغیر ہاتھوں کا وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21939، 25 دسمبر 2005)⁩ کے مطابق جو باقی ہے دھوئے اور باقی اعضا جتنا ممکن — وسع کے مطابق تکلیف۔"
