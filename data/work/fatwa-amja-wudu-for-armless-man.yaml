id: work/fatwa-amja-wudu-for-armless-man
class: work
kind: fatwa
label: { ar: "وضوء الأقطع", en: "Wudu for a man with no hands — washing what remains", ur: "بغیر ہاتھوں کے شخص کا وضو", es: "Wudu para un hombre sin manos: lavar lo que queda", fr: "Les ablutions d'un homme sans mains — laver ce qui reste" }
summary:
  ar: "سأل سائل كيف يتوضأ رجل أقطع بدون يدين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21939 بتاريخ 25 ديسمبر 2005)⁩ أن الله لا يكلف نفسًا إلا وسعها فهذا الرجل ينبغي عليه أن يغسل من يديه ما بقي وأما إن كان السؤال عن إمكانية غسل باقي الأعضاء فإنه يغسلها ما أمكن على ما فصّل الجواب من قاعدة التكليف بحسب الوسع."
  en: "A questioner asked how a handless man does wudu. Dr. Salah al-Sawi (fatwa no. 21939, 25 December 2005) answered that God tasks no soul beyond its capacity: this man should wash what remains of his hands; and if the question was about the rest of the limbs, he washes them as far as possible — the duty-by-capacity rule the answer details."
  ur: "بغیر ہاتھوں کا وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21939، 25 دسمبر 2005)⁩ کے مطابق جو باقی ہے دھوئے اور باقی اعضا جتنا ممکن — وسع کے مطابق تکلیف۔"
  es: "Un interlocutor preguntó cómo realiza el wudu un hombre sin manos. El Dr. Salah al-Sawi (fatwa n.º 21939, 25 de diciembre de 2005) respondió que Dios no impone a ningún alma una tarea que exceda su capacidad: este hombre debe lavar lo que le queda de las manos; y si la pregunta se refería al resto de las extremidades, debe lavarlas en la medida de lo posible, según la regla de deber según la capacidad que detalla la respuesta."
  fr: "Un internaute a demandé comment un homme sans mains pouvait faire ses ablutions. Le Dr Salah al-Sawi (fatwa n° 21939, 25 décembre 2005) a répondu que Dieu n'impose à aucune âme une tâche supérieure à ses capacités: cet homme doit donc laver ce qui lui reste des mains; et si la question portait sur le reste de ses membres, il les lave autant que possible – la règle du devoir selon les capacités est détaillée dans la réponse."
