summary:
  ar: "زيجا الخوارزمي الأول والثاني، المعروفان بالسند هند، اللذان يقول ابن النديم في نص ينقله محققا طبعة القاهرة لكتاب الجبر إن الناس كانوا يعوّلون عليهما قبل الرصد وبعده {cite:khwarizmi-jabr-cairo-1939 p.22}."
  en: "Al-Khwarizmi's first and second astronomical tables (zij), known as the Sindhind, on which, in a passage of Ibn al-Nadim quoted by the Cairo editors of his algebra, people relied both before and after the observations."
  es: "Las primeras y segundas tablas astronómicas (zij) de Al-Juarismi, conocidas como Sindhind, en las que, según un pasaje de Ibn al-Nadim citado por los editores de El Cairo de su álgebra, la gente confiaba tanto antes como después de las observaciones."
  fr: "Les première et deuxième tables astronomiques (zij) d'Al-Khwarizmi, connues sous le nom de Sindhind, sur lesquelles, dans un passage d'Ibn al-Nadim cité par les éditeurs cairotes de son algèbre, les gens se sont appuyés avant et après les observations."
  ur: "الخوارزمی کی پہلی اور دوسری فلکیاتی جدولیں ⁦(زِج)⁩، جسے سندھند کہا جاتا ہے، جس پر ابن الندیم نے اپنے الجبرا کے قاہرہ کے مدیروں کے حوالے سے نقل کیا ہے، لوگوں نے مشاہدات سے پہلے اور بعد میں انحصار کیا۔"
