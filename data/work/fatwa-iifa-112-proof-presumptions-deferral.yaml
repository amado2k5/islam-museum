summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩. أجل إصدار قرار في موضوع الإثبات بالقرائن والأمارات لقصر بحثه على المستجدات وحصرها وبيان حكمها. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000). It deferred issuing a ruling on proof by presumptions and indicia, confining its study to the newly arising instances, enumerating them and stating their ruling. Recorded as a deferral, not a final ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں۔ اس نے قرائن اور امارات سے اثبات پر فیصلہ مؤجل کیا اور اپنی تحقیق نئے واقعات کی تحدید، شمار اور ان کے حکم تک محدود رکھی۔ یہ مؤجل ہے، حتمی حکم نہیں۔"
