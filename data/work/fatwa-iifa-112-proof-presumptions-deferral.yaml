label: { ar: "قرار مجمع الفقه الإسلامي الدولي 112 (12/6) بشأن الإثبات بالقرائن أو الأمارات ⁦(مؤجل)⁩", en: "IIFA resolution 112 (12/6) on proof by presumptions or indicia ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 112 (12/6): قرائن یا امارات سے اثبات ⁦(مؤجل)⁩", es: "Resolución 112 (12/6) de la IIFA sobre la prueba por presunciones o indicios (aplazada)", fr: "Résolution 112 (12/6) de l'IIFA sur la preuve par présomptions ou indices (reportée)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 112 (12/6) varsayımlar veya gösterimlerle ispat ile ilgili (ertelenmiş)", id: "Keputusan Akademi Fiqh Islam Internasional 112 (6/12) mengenai pembuktian dengan asumsi atau indikasi (ditunda)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩. أجل إصدار قرار في موضوع الإثبات بالقرائن والأمارات لقصر بحثه على المستجدات وحصرها وبيان حكمها. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000). It deferred issuing a ruling on proof by presumptions and indicia, confining its study to the newly arising instances, enumerating them and stating their ruling. Recorded as a deferral, not a final ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں۔ اس نے قرائن اور امارات سے اثبات پر فیصلہ مؤجل کیا اور اپنی تحقیق نئے واقعات کی تحدید، شمار اور ان کے حکم تک محدود رکھی۔ یہ مؤجل ہے، حتمی حکم نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión celebrada en Riad (25 de Jumada II – 1 de Rajab de 1421, del 23 al 28 de septiembre de 2000). En ella se aplazó la emisión de un dictamen sobre la prueba por presunciones e indicios, limitando su estudio a los casos más recientes, enumerándolos y estableciendo su resolución. Se registró como un aplazamiento, no como un dictamen definitivo."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000). Elle a reporté l'établissement d'une décision sur la preuve par présomption et indices, limitant son étude aux cas nouvellement apparus, les énumérant et énonçant leur statut. Cette résolution est considérée comme un report et non comme une décision définitive."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Riyad'daki on ikinci oturumunda (25 Cumedül-Ahirah – 1 Rajab 1421 H, 23–28 Eylül 2000) toplu kararı. Deliller ve göstergelerle kanıt konusundaki kararın açıklanması, tartışmasını yeni gelişmelerle sınırlamak, sınırlamak ve kararlarını netleştirmek nedeniyle ertelenmiştir. Nihai karar olarak değil, erteleme olarak kaydedilmiştir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sidang kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000 M). Penundaan mengeluarkan keputusan mengenai pembuktian dengan bukti dan indikasi karena membatasi diskusi pada perkembangan baru, membatasinya, dan memperjelas keputusan mereka. Dicatat sebagai penundaan, bukan putusan final."
