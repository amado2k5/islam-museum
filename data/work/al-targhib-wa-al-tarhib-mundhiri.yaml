perspectives:
  - tradition: sunni
    id: mundhiri
    stance: { ar: "يُذكر الحديث مع بيان حاله", en: "Hadiths are cited with their grade stated", ur: "حدیث کو اس کے درجے کے بیان کے ساتھ ذکر کیا جائے" }
    summary:
      ar: "المنذري: من تقدم من العلماء تساهلوا في أنواع من الترغيب والترهيب حتى ذكر كثير منهم الموضوع ولم يبينوا حاله؛ فهو يشير إلى درجة كل حديث، ويميّز شديد الضعف بلفظ «روي»، ويُعرض عما تحقق وضعه."
      en: "Al-Mundhiri: earlier scholars were lenient in kinds of encouragement and warning, many even citing fabricated reports without saying so; he therefore states each hadith's grade, marks the seriously weak with 'it is related', and leaves out what is shown to be fabricated."
      ur: "منذری: پہلے علماء نے ترغیب و ترہیب کی بعض اقسام میں تساہل کیا یہاں تک کہ بہت سوں نے موضوع روایت ذکر کی اور اس کا حال نہ بتایا؛ اس لیے وہ ہر حدیث کا درجہ بتاتے ہیں، شدید ضعیف کو «روی» سے ممتاز کرتے ہیں، اور ثابت شدہ موضوع کو چھوڑ دیتے ہیں۔"
    sources: [source/targhib-tarhib-qayyima]
  - tradition: sunni
    id: annotator
    stance: { ar: "لا يُحتج بالضعيف مطلقاً", en: "Weak hadith is not used as proof at all", ur: "ضعیف حدیث سے مطلقاً احتجاج نہیں" }
    summary:
      ar: "معلّق طبعة المكتبة القيمة: ذهب بعض العلماء إلى جواز الأخذ بالضعيف في فضائل الأعمال، ولا يؤخذ ذلك على إطلاقه، فما ضعفه من جهة صدق الراوي أو عدالته لا يؤخذ به، وما ضعفه لسوء حفظه أمره مقارب؛ ثم يقول إنه يميل إلى عدم الاحتجاج بالضعيف مطلقاً لا في الأحكام ولا في الفضائل."
      en: "The annotator of the al-Maktaba al-Qayyima edition: some scholars allowed acting on weak hadith in the merits of deeds, but not without qualification — a report weak because of its narrator's honesty or integrity is not used, one weak through poor memory is closer; he then says he inclines not to use weak hadith as proof at all, in rulings or in merits."
      ur: "المکتبۃ القیمہ کے ایڈیشن کے حاشیہ نگار: بعض علماء نے فضائلِ اعمال میں ضعیف پر عمل جائز رکھا، مگر یہ مطلق نہیں — جو راوی کی صداقت یا عدالت کی وجہ سے ضعیف ہو اس پر عمل نہیں، اور جو حافظے کی کمزوری سے ہو اس کا معاملہ قریب ہے؛ پھر کہتے ہیں کہ ان کا میلان یہ ہے کہ ضعیف سے نہ احکام میں احتجاج ہو نہ فضائل میں۔"
    sources: [source/targhib-tarhib-qayyima]
