label: { ar: "الترغيب والترهيب من الحديث الشريف", en: "al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri)", ur: "الترغیب والترہیب من الحدیث الشریف" }
summary:
  ar: "كتاب زكي الدين عبد العظيم المنذري ⁦(ت 656هـ)⁩ في أحاديث الترغيب والترهيب، أملاه بعد «مختصر أبي داود» و«الخلافيات» بسؤال بعض طلبته، مجرداً من الأسانيد، مقتصراً على ما ورد صريحاً في الترغيب والترهيب، يعزو كل حديث إلى مخرّجيه من الأصول السبعة والموطأ ومسند أحمد والمعاجم والمسانيد وصحيحي ابن خزيمة وابن حبان والمستدرك وغيرها، ويشير إلى درجته، ويصدّر ما صح أو حسن أو قارب بلفظ «عن» وما اشتد ضعفه بلفظ «روي»، ويختمه بباب في الرواة المختلف فيهم على حروف المعجم {cite:targhib-tarhib-qayyima j.1 p. 2-8} {cite:targhib-tarhib-qayyima j.4 p. 280}."
  en: "Zaki al-Din 'Abd al-'Azim al-Mundhiri's (d. 656 AH) collection of hadiths of encouragement and warning, dictated after his Mukhtasar of Abu Dawud and al-Khilafiyyat at a student's request, without chains and limited to reports that explicitly encourage or warn; he cites each hadith to its compilers — the seven core books, the Muwatta', Ahmad's Musnad, the Mu'jams and Musnads, the Sahihs of Ibn Khuzayma and Ibn Hibban, the Mustadrak and others — indicates its grade, opens sound, good or near-good reports with 'from' ('an) and seriously weak ones with 'it is related' (ruwiya), and closes with a chapter on disputed narrators in alphabetical order {cite:targhib-tarhib-qayyima j.1 p. 2-8} {cite:targhib-tarhib-qayyima j.4 p. 280}."
  ur: "زکی الدین عبد العظیم منذری ⁦(وفات 656ھ)⁩ کا ترغیب و ترہیب کی احادیث کا مجموعہ، جو انہوں نے «مختصر ابی داود» اور «الخلافیات» کے بعد ایک طالب علم کی درخواست پر املا کرایا، اسانید کے بغیر، صرف ان روایات تک محدود جو صراحتاً ترغیب یا ترہیب میں ہیں؛ وہ ہر حدیث کو اس کے مخرّجین — اصولِ سبعہ، موطأ، مسند احمد، معاجم و مسانید، صحیح ابن خزیمہ و ابن حبان، مستدرک وغیرہ — کی طرف منسوب کرتے ہیں، اس کا درجہ بتاتے ہیں، صحیح، حسن یا قریب کو «عن» سے اور شدید ضعیف کو «روی» سے شروع کرتے ہیں، اور آخر میں مختلف فیہ راویوں پر حروفِ تہجی کی ترتیب سے ایک باب رکھتے ہیں {cite:targhib-tarhib-qayyima j.1 p. 2-8} {cite:targhib-tarhib-qayyima j.4 p. 280}۔"
