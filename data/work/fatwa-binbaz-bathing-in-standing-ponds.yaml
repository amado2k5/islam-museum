id: work/fatwa-binbaz-bathing-in-standing-ponds
class: work
kind: fatwa
label: { ar: "حكم الاغتسال والوضوء في برك الماء الدائمة", en: "Bathing and ablution in standing ponds", ur: "ٹھہرے ہوئے تالابوں میں غسل اور وضو کا حکم" }
summary:
  ar: "سائل من الريف يذكر بركة يبقى ماؤها أشهرًا، يغتسل فيها الناس من الجنابة ويتوضأ بعضهم منها. أجاب ابن باز بأن البركة الواسعة الكثيرة الماء تبقى طاهرة ما دام طعمها ولونها وريحها لم تتغير بنجاسة، لكنه منع الاغتسال فيها من الجنابة والبول والاستنجاء فيها، استنادًا إلى النهي عن الاغتسال في الماء الدائم، وأرشد إلى أخذ الماء منها والتطهر خارجها حتى لا تتقذر على الناس."
  en: "A questioner from the countryside describes a pond whose water stands for months, in which people bathe from major impurity and some make ablution. Ibn Baz answered that a wide pond with plentiful water stays pure so long as no impurity has changed its taste, colour or smell, but he ruled out bathing in it from major impurity, urinating in it or cleaning oneself in it, citing the prohibition on bathing in standing water, and advised drawing the water out and purifying oneself outside the pond so as not to foul it for others."
  ur: "دیہات کا ایک سائل ایسے تالاب کا ذکر کرتا ہے جس کا پانی مہینوں ٹھہرا رہتا ہے اور لوگ اس میں غسلِ جنابت کرتے اور بعض وضو کرتے ہیں۔ ابن باز نے جواب دیا کہ وسیع اور زیادہ پانی والا تالاب اس وقت تک پاک رہتا ہے جب تک نجاست سے اس کا ذائقہ، رنگ یا بو نہ بدلے، لیکن انہوں نے ٹھہرے پانی میں غسل کی ممانعت کی بنیاد پر اس میں غسلِ جنابت، پیشاب اور استنجا سے منع کیا، اور ہدایت کی کہ پانی باہر نکال کر تالاب سے باہر طہارت کی جائے تاکہ وہ دوسروں کے لیے گندا نہ ہو۔"
