id: work/fatwa-binbaz-bathing-in-standing-ponds
class: work
kind: fatwa
label: { ar: "حكم الاغتسال والوضوء في برك الماء الدائمة", en: "Bathing and ablution in standing ponds", ur: "ٹھہرے ہوئے تالابوں میں غسل اور وضو کا حکم", es: "Baños y abluciones en estanques estancados.", fr: "Baignade et ablutions dans les bassins stagnants", tr: "Sürekli su havuzlarında banyo ve abdest alma ile ilgili karar", id: "Peraturan tentang mandi dan wudhu di kolam air permanen" }
summary:
  ar: "سائل من الريف يذكر بركة يبقى ماؤها أشهرًا، يغتسل فيها الناس من الجنابة ويتوضأ بعضهم منها. أجاب ابن باز بأن البركة الواسعة الكثيرة الماء تبقى طاهرة ما دام طعمها ولونها وريحها لم تتغير بنجاسة، لكنه منع الاغتسال فيها من الجنابة والبول والاستنجاء فيها، استنادًا إلى النهي عن الاغتسال في الماء الدائم، وأرشد إلى أخذ الماء منها والتطهر خارجها حتى لا تتقذر على الناس."
  en: "A questioner from the countryside describes a pond whose water stands for months, in which people bathe from major impurity and some make ablution. Ibn Baz answered that a wide pond with plentiful water stays pure so long as no impurity has changed its taste, colour or smell, but he ruled out bathing in it from major impurity, urinating in it or cleaning oneself in it, citing the prohibition on bathing in standing water, and advised drawing the water out and purifying oneself outside the pond so as not to foul it for others."
  ur: "دیہات کا ایک سائل ایسے تالاب کا ذکر کرتا ہے جس کا پانی مہینوں ٹھہرا رہتا ہے اور لوگ اس میں غسلِ جنابت کرتے اور بعض وضو کرتے ہیں۔ ابن باز نے جواب دیا کہ وسیع اور زیادہ پانی والا تالاب اس وقت تک پاک رہتا ہے جب تک نجاست سے اس کا ذائقہ، رنگ یا بو نہ بدلے، لیکن انہوں نے ٹھہرے پانی میں غسل کی ممانعت کی بنیاد پر اس میں غسلِ جنابت، پیشاب اور استنجا سے منع کیا، اور ہدایت کی کہ پانی باہر نکال کر تالاب سے باہر طہارت کی جائے تاکہ وہ دوسروں کے لیے گندا نہ ہو۔"
  es: "Un visitante del campo describió un estanque cuyas aguas permanecen estancadas durante meses, donde la gente se baña para purificarse y algunos realizan abluciones. Ibn Baz respondió que un estanque amplio con abundante agua se mantiene puro siempre que ninguna impureza altere su sabor, color u olor, pero desaconsejó bañarse en él para purificarse, orinar en él o limpiarse en él, citando la prohibición de bañarse en agua estancada, y aconsejó sacar el agua y purificarse fuera del estanque para no contaminarlo para los demás."
  fr: "Un habitant de la campagne, interrogeant Ibn Baz, décrit un étang dont l'eau stagne pendant des mois, où l'on se baigne pour se purifier d'une grande impureté et où certains font leurs ablutions. Ibn Baz répond qu'un grand étang rempli d'eau en abondance reste pur tant qu'aucune impureté n'en altère le goût, la couleur ou l'odeur. Cependant, il déconseille de s'y baigner pour se purifier d'une grande impureté, d'y uriner ou de s'y laver, invoquant l'interdiction de se baigner dans une eau stagnante. Il recommande de puiser l'eau et de se purifier à l'extérieur de l'étang afin de ne pas le souiller pour les autres."
  tr: "Kırsaldan biri, suyu aylarca kalan bir havuzdan bahseder; bu sırada insanlar büyük kirlilikten gusl yapar, bazıları ise abdest alır. İbn Baz, geniş ve bol su içeren bir havuzun, tadı, rengi ve kokusu kirlilik nedeniyle değişmediği sürece saf kaldığını söyledi. Ancak, kalıcı suda yıkanmanın yasaklanması gerekçesiyle janabah, idrar ve kendini temizlemeyi yasakladı ve suyun dışında arınmasını tavsiye etti ki insanlar için kirli olmasın."
  id: "Seorang orang dari pedesaan menyebutkan sebuah kolam yang airnya bertahan selama berbulan-bulan, di mana orang melakukan ghusl karena kotoran besar dan beberapa melakukan wudhu darinya. Ibn Baz menjawab bahwa kolam luas dengan air melimpah tetap murni selama rasa, warna, dan baunya tidak berubah karena ketidaksucian. Namun, ia melarang mandi di dalamnya dari janabah, urin, dan membersihkan diri di sana, berdasarkan larangan mandi dengan air permanen, dan menyarankan untuk mengambil air dari kolam itu dan membersihkan diri di luar air agar tidak menjadi kotor bagi manusia."
