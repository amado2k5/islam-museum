id: work/fatwa-dar-alifta-eg-mutamatti-leaving-to-medina-miqat
class: work
kind: fatwa
label: { ar: "حكم خروج المتمتع بعد مناسك العمرة إلى ميقات مكانه", en: "The mutamatti' going out to the miqat of his place after the umrah rites", ur: "تمتع کرنے والے کا عمرے کے بعد اپنے میقات پر نکلنا", es: "El mutamatti' saliendo hacia el miqat de su lugar después de los ritos de la umrah.", fr: "Le mutamatti' se rendant au miqat de son lieu de résidence après les rites de l'umra" }
summary:
  ar: "سائل مصري خرج من مكة إلى زيارة المدينة المنورة بعد الانتهاء من مناسك العمرة فسأل عن إحرامه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20824)⁩ ببيان حكم خروجه إلى ميقات مكانه على وجهه."
  en: "An Egyptian questioner left Mecca to visit Medina after finishing the umrah rites, and asked about his ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20824) answered by setting out the ruling on his going to the miqat of his place."
  ur: "ایک مصری سائل عمرے کے مناسک کے بعد مدینہ کی زیارت کو مکہ سے نکلا اور اپنے احرام کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20824)⁩ نے جواب میں اس کے اپنے میقات پر نکلنے کا حکم بیان کیا۔"
  es: "Un egipcio que realizó la peregrinación de la Umrah partió de La Meca hacia Medina y preguntó sobre su estado de ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20824) respondió exponiendo la normativa sobre su traslado al miqat de su lugar de residencia."
  fr: "Un Égyptien, après avoir accompli la umra, quitta La Mecque pour se rendre à Médine et interrogea le grand mufti égyptien, Dar al-Ifta (Dar al-Ifta, Dr Nazir Muhammad Ayyad, fatwa n° 20824), sur son statut d'ihram. Ce dernier répondit en énonçant la règle concernant son passage au miqat de son lieu de résidence."
