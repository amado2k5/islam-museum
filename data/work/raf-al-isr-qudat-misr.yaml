  ar: "ذيل الحافظ شهاب الدين أحمد بن علي بن حجر العسقلاني على أخبار قضاة مصر، بمجلد كبير؛ ولهذا الذيل مختصرات منها النجوم الزاهرة بتلخيص أخبار قضاة مصر والقاهرة {cite:kashf-zunun-furqan p. 253}."
  en: "Ibn Hajar's Raf' al-Isr 'an Qudat Misr — 'lifting the burden': his large-volume continuation of Egypt's judges, itself epitomised in the Nujum al-Zahira {cite:kashf-zunun-furqan p. 253}."
