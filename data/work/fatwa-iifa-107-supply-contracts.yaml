id: work/fatwa-iifa-107-supply-contracts
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 107 (12/1) بشأن عقود التوريد والمناقصات", en: "IIFA resolution 107 (12/1) on supply contracts and tenders", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 107 (12/1): سپلائی معاہدے اور ٹھیکے", es: "Resolución 107 (12/1) de la IIFA sobre contratos de suministro y licitaciones", fr: "Résolution 107 (12/1) de l'IIFA sur les contrats et appels d'offres d'approvisionnement" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩. عرّف عقد التوريد بأنه عقد يتعهد بمقتضاه طرف بتسليم سلع معلومة مؤجلة بصفة دورية خلال فترة معينة لطرف آخر مقابل مبلغ معين مؤجل كله أو بعضه، وقرر: إن كان محل التوريد سلعة تتطلب صناعة فالعقد استصناع تنطبق عليه أحكامه ⁦(قرار 65 ⁦(7/3)⁩)⁩؛ وإن كانت سلعة موصوفة في الذمة تسلم عند الأجل فإما أن يعجل المستورد الثمن كله فيأخذ حكم السلم بشروطه ⁦(قرار 85 ⁦(9/2)⁩)⁩، وإما تأخر. ثم تناول المناقصات والعطاءات وضوابطها الشرعية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000). It defined a supply contract as one under which a party undertakes to deliver known goods periodically over a set period to another party against a specific amount deferred in whole or part; ruled that where the subject matter requires manufacture it is istisna' governed by resolution 65 (7/3); and where it is fungible goods described in the debtor's obligation and deliverable at a term, either the price is paid in full at contract — taking the rules of salam under resolution 85 (9/2) — or it is deferred. It then addressed tenders/bids and their legal controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں۔ اس نے سپلائی عقد کی تعریف کی: عقد جس میں ایک فریق مقررہ مدت میں معلوم اشیاء وقفے سے مؤجل سپرد کرنے کا عہد کرے دوسرے فریق کو، مؤجل قیمت کے عوض؛ فیصلہ: اگر موضوع صنعت طلب چیز ہو تو یہ استصناع ہے جس پر قرارداد 65 ⁦(7/3)⁩ کے احکام لागو؛ اور اگر ذمہ میں بیان شدہ قیاسی چیز ہو جو مقررہ وقت پر دی جانی ہو تو یا پوری قیمت فوراً ادا ہو — جس پر سلام کے احکام ⁦(قرارداد 85 ⁦(9/2)⁩)⁩ — یا مؤجل۔ پھر ٹھیکوں اور مناقصوں کے شرعی ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000). Definió un contrato de suministro como aquel en el que una parte se compromete a entregar bienes conocidos periódicamente durante un período determinado a otra parte a cambio de un monto específico, total o parcialmente diferido; dictaminó que cuando el objeto requiere fabricación, es istisna', regido por la resolución 65 (7/3); y cuando se trata de bienes fungibles descritos en la obligación del deudor y entregables a plazo, el precio se paga íntegramente al momento del contrato —siguiendo las reglas de salam según la resolución 85 (9/2)— o se difiere. Luego abordó las licitaciones y sus controles legales."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1 Rajab 1421, 23-28 septembre 2000). Elle définit un contrat de fourniture comme un contrat par lequel une partie s'engage à livrer périodiquement des biens connus à une autre partie pendant une période déterminée, moyennant un montant spécifique différé en totalité ou en partie. Elle statue que lorsque l'objet du contrat requiert une fabrication, il s'agit d'un contrat d'istisna' régi par la résolution 65 (7/3). Elle précise que lorsqu'il s'agit de biens fongibles décrits dans l'obligation du débiteur et livrables à une date convenue, le prix est soit payé intégralement au moment du contrat – conformément aux règles du salam (résolution 85 (9/2)) – soit différé. L'Académie aborde ensuite la question des appels d'offres et de leur cadre juridique."
