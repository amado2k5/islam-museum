id: work/al-durra-al-madiyya
class: work
kind: book
label: { ar: "الدرة المضية في القراءات الثلاث المرضية", en: "Al-Durra al-Madiyya", ur: "الدرۃ المضیۃ فی القراءات الثلاث المرضیۃ", es: "Al-Durra al-Madiyya", fr: "Al-Durra al-Madiyya", tr: "Üç tatmin edici okumadaki parlayan inci", id: "Mutiara berkilau dalam tiga bacaan yang memuaskan" }
summary:
  ar: "منظومة لابن الجزري في القراءات الثلاث المرضية تتمة للعشرة، نظمها من «الهداية» وسمّاها «الدرة»، وتُعدّ مع «الشاطبية» متنين تتم بهما القراءات العشر الصغرى، وتذكر ترجمته أنه ألّفها وله ثماني عشرة سنة {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:tayyibat-nashr-zabi-2015 p. 7}."
  en: "Ibn al-Jazari's poem on 'the three approved readings', completing the ten; he versified the Hidaya as the completion of the ten and called it al-Durra, and his biography says he composed it at eighteen; with the Shatibiyya it forms the pair of texts by which, in the editor's phrase, the ten lesser readings are completed {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:tayyibat-nashr-zabi-2015 p. 7}."
  ur: "ابن الجزری کی «تین پسندیدہ قراءتوں» پر منظومہ جو دس کی تکمیل کرتی ہے؛ انہوں نے «الہدایہ» کو دس کی تتمہ کے طور پر منظوم کیا اور اس کا نام «الدرہ» رکھا، ان کے ترجمے کے مطابق انہوں نے اسے اٹھارہ سال کی عمر میں لکھا؛ «شاطبیہ» کے ساتھ یہ وہ دو متن ہیں جن سے، ناشر کے الفاظ میں، صغریٰ دس قراءتیں مکمل ہوتی ہیں {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:tayyibat-nashr-zabi-2015 p. 7}۔"
  es: "El poema de Ibn al-Jazari sobre las \"tres lecturas aprobadas\", que completan las diez; él versificó la Hidaya como la culminación de las diez y la llamó al-Durra, y su biografía dice que la compuso a los dieciocho años; junto con la Shatibiyya forma el par de textos con los cuales, en la frase del editor, se completan las diez lecturas menores {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:Tayyibat-Nashr-Zabi-2015 p. 7}."
  fr: "Le poème d'Ibn al-Jazari sur « les trois lectures approuvées », complétant les dix; il a mis en vers la Hidaya comme complément des dix et l'a appelée al-Durra, et sa biographie dit qu'il l'a composée à dix-huit ans; avec la Shatibiyya, elle forme la paire de textes par lesquels, selon l'expression de l'éditeur, les dix lectures mineures sont complétées {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:Tayyibat-Nashr-Zabi-2015 p. 7}."
  tr: "İbn el-Cezari'nin Peygamberlik Okumalarının Üç Işınımı üzerine yazdığı bir şiiri, on okumanın devamıdır. Onu 'El-Hidayah'dan derlemiş ve 'El-Durra' adını vermiştir. 'El-Şatibiyyah' ile birlikte on küçük okumayı tamamlayan iki metin olarak kabul edilir. Biyografisinde bunların yazarı olduğu ve on sekiz yaşında olduğu belirtilir {cite:nashr-dahman-damascus-1345-v1 s. 8} {cite:tayyibat-nashr-zabi-2015, s. 7}."
  id: "Sebuah puisi karya Ibn al-Jazari tentang Tiga Radiasi Bacaan Nabi merupakan kelanjutan dari sepuluh bacaan tersebut. Ia menyusunnya dari 'Al-Hidayah' dan menamainya 'Al-Durra'. Puisi ini dianggap sebagai dua teks bersama dengan 'Al-Shatibiyyah' yang melengkapi sepuluh bacaan kecil. Biografinya menyebutkan bahwa ia yang menulis nashr-dahman-damascus-1345-v1 hlm. 8} {cite:tayyibat-nashr-zabi-zabi-2015, hlm. 7}."
