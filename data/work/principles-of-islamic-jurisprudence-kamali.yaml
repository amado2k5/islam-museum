  es: "Un libro en inglés sobre usul al-fiqh del erudito afgano Mohammad Hashim Kamali, publicado por Pelanduk, Malasia, en 1989 (524 páginas), luego por la Islamic Texts Society, Cambridge, en una edición revisada (1991) y una tercera edición ampliada (2003)."
  fr: "Un livre en anglais sur l'usul al-fiqh par l'érudit afghan Mohammad Hashim Kamali, publié par Pelanduk, Malaisie, en 1989 (524 pages), puis par l'Islamic Texts Society, Cambridge, dans une édition révisée (1991) et une troisième édition augmentée (2003)."
  tr: "Afgan âlim Muhammed Hâşim Kemâlî'nin fıkıh usulü üzerine İngilizce kitabı; 1989'da Malezya'da Pelanduk tarafından 524 sayfa olarak, ardından Cambridge'de Islamic Texts Society tarafından 1991'de gözden geçirilmiş ve 2003'te genişletilmiş üçüncü baskı olarak yayımlandı."
  id: "Buku berbahasa Inggris tentang usul fikih karya ulama Afganistan Mohammad Hashim Kamali, diterbitkan Pelanduk di Malaysia pada 1989 setebal 524 halaman, lalu oleh Islamic Texts Society di Cambridge dalam edisi revisi 1991 dan edisi ketiga yang diperluas pada 2003."
