summary:
  ar: "كتاب بالإنجليزية في أصول الفقه للعالم الأفغاني محمد هاشم كمالي، صدر عن دار بيلاندوك في ماليزيا سنة 1989 في 524 صفحة، ثم عن جمعية النصوص الإسلامية في كامبريدج في طبعة منقحة سنة 1991 وثالثة موسعة سنة 2003."
  en: "An English book on usul al-fiqh by the Afghan scholar Mohammad Hashim Kamali, published by Pelanduk, Malaysia, in 1989 (524 pages), then by the Islamic Texts Society, Cambridge, in a revised edition (1991) and an enlarged third edition (2003)."
