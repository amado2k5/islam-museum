id: work/fatwa-aliftaa-jo-objecting-to-the-imam-combining-prayers-for-rain
class: work
kind: fatwa
label: { ar: "الاعتراض على إمام المسجد في الجمع بين الصلوات بعذر المطر", en: "Objecting to the imam combining prayers because of rain", ur: "بارش کی وجہ سے نمازیں جمع کرنے پر امام پر اعتراض" }
summary:
  ar: "سؤال عن الاعتراض على إمام المسجد في الجمع بين الصلوات بعذر المطر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز للمصلين الاعتراض على الإمام في ذلك، طلبًا للجمع أو لتركه. أجابت الدائرة بأنه لا يجوز لأحد من المصلين الاعتراض على الإمام في المسجد، سواء كان الاعتراض لطلب الجمع أو لتركه. وعللت ذلك بأن الأصل أن لدى الإمام من العلم الشرعي ما يؤهله لاتخاذ القرار في هذا الأمر."
  en: "A question about objecting to the imam combining prayers because of rain, in which Jordan's General Iftaa Department answered that worshippers may not object to the imam over this, whether to demand combining or to oppose it. The Department answered that none of the worshippers may object to the imam in the mosque, whether the objection is to demand that he combine the prayers or that he not combine them. It explained that the imam is presumed to have the knowledge of the Sharia that qualifies him to decide this matter."
  ur: "بارش کی وجہ سے نمازیں جمع کرنے پر امام پر اعتراض کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نمازیوں کے لیے اس معاملے میں امام پر اعتراض جائز نہیں، چاہے جمع کرنے کا مطالبہ ہو یا نہ کرنے کا۔ ڈیپارٹمنٹ نے جواب دیا کہ نمازیوں میں سے کسی کے لیے مسجد میں امام پر اعتراض جائز نہیں، چاہے اعتراض جمع کرنے کے مطالبے کے لیے ہو یا اسے ترک کرنے کے لیے۔ اس نے وجہ یہ بتائی کہ اصل یہ ہے کہ امام کے پاس وہ شرعی علم ہے جو اسے اس معاملے میں فیصلہ کرنے کا اہل بناتا ہے۔"
