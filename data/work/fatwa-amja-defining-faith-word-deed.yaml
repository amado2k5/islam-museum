summary:
  ar: "سأل سائل عن استشكال في تعريف الإيمان إجمالًا بأنه قول وعمل وتفصيلًا بأنه قول القلب وقول اللسان وعمل القلب وعمل اللسان وعمل الجوارح. أجاب د. وليد بسيوني ⁦(فتوى رقم 21834 بتاريخ 18 يناير 2006)⁩ أن جوابه يسير فإن هذا التعريف إنما هو للإيمان من حيث هو هو بغض النظر عن المؤمن به، فالإيمان بالله هو تصديق القلب به وإقرار اللسان به وعمل القلب واللسان والجوارح بمقتضى ذلك، والإيمان بالملائكة والكتب والرسل واليوم الآخر والقدر على هذا النسق نفسه، ومن ترك العمل بمقتضى شيء من ذلك فهو ناقص الإيمان لا خارجه بالكلية على ما فصّل."
  en: "A questioner raised a difficulty in defining faith in sum as word and deed, detailed as the heart's word, the tongue's word, the heart's deed, the tongue's deed and the limbs' deed. Dr. Walid Basyouni (fatwa no. 21834, 18 January 2006) answered that it is simple: the definition describes faith in itself, apart from what is believed — faith in God is the heart's affirming Him, the tongue's declaring Him, and the heart's, tongue's and limbs' acting accordingly; faith in the angels, books, messengers, Last Day and decree runs the same way; whoever leaves acting on any of that is deficient in faith, not outside it entirely — as the answer details."
  ur: "ایک سائل نے ایمان کی تعریف میں اشکال پوچھا۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21834، 18 جنوری 2006)⁩ کے مطابق تعریف ایمان بذاتہٰو کے لیے ہے — ہر رکن ایمان میں دل کی تصدیق زبان کا اقرار اور عمل بمقتضی شامل ہے۔"
  es: "Un consultante planteó la dificultad de definir la fe en resumen como palabra y obra, detallada como la palabra del corazón, la palabra de la lengua, la obra del corazón, la obra de la lengua y la obra de las extremidades. El Dr. Walid Basyouni (fatwa n.º 21834, 18 de enero de 2006) respondió que es sencillo: la definición describe la fe en sí misma, aparte de lo que se cree; la fe en Dios es la afirmación del corazón, la declaración de la lengua y la acción del corazón, la lengua y las extremidades en consecuencia; la fe en los ángeles, los libros, los mensajeros, el Último Día y el decreto va por el mismo camino; quien deja de actuar conforme a cualquiera de estos elementos carece de fe, no está completamente fuera de ella, como se detalla en la respuesta."
  fr: "Un internaute a soulevé une difficulté à définir la foi en somme comme la somme des paroles et des actes, détaillés comme la parole du cœur, la parole de la langue, l'acte du cœur, l'acte de la langue et l'acte des membres. Le Dr Walid Basyouni (fatwa n° 21834, 18 janvier 2006) a répondu que c'est simple: la définition décrit la foi en elle-même, indépendamment de ce qui est cru — la foi en Dieu est l'affirmation du cœur, la proclamation de la langue et l'action du cœur, de la langue et des membres en conséquence; la foi dans les anges, les livres, les messagers, le Jour du Jugement et le décret fonctionne de la même manière; celui qui s'abstient de mettre en pratique l'un de ces éléments est déficient en foi, mais non totalement dépourvu de foi — comme le précise la réponse."
  tr: "Bir soru soran kişiye, inancı genel olarak konuşma ve eylem olarak tanımlamanın zorluğu soruldu; ayrıntılı olarak ise kalbin konuşması, dilin konuşması, kalbin eylemi, dilin hareketi ve uzuvların hareketi olarak tanımlandı. Dr. Walid Basyouni (18 Ocak 2006 tarihli Fetva No. 21834) cevabının basit olduğunu, çünkü bu tanımın inanan ne olursa olsun inanç için olduğunu söyledi. Tanrı'ya inanmak, kalbe inanmak, dili kabul etmek, kalp, dil ve uzuvların buna göre hareket etmesi, meleklere, kitaplara, elçilere, Son Gün'e ve kaderin aynı şekilde inanılmasıdır. Bunlardan herhangi birine göre hareket etmeyi bırakan kişi, imanda eksiktir, tamamen dışına değil, açıklandığı gibi."
  id: "Seorang penanya ditanya tentang kesulitan dalam mendefinisikan iman secara umum sebagai ucapan dan tindakan, dan secara rinci sebagai ucapan hati, ucapan lidah, tindakan hati, tindakan lidah, dan tindakan anggota tubuh. Dr. Walid Basyouni menjawab (Fatwa No. 21834 tanggal 18 Januari 2006) bahwa jawabannya lugas, karena definisi ini merujuk pada iman pada apa adanya, tanpa memandang siapa yang beriman padanya. Iman kepada Tuhan berarti percaya pada hati, mengakui lidah di dalamnya, dan hati, lidah, serta anggota tubuh bertindak sesuai, dan percaya pada malaikat, buku, utusan, Hari Terakhir, dan takdir dengan cara yang sama. Siapa pun yang meninggalkan tindakan sesuai salah satu dari ini tidak lengkap dalam iman, bukan sepenuhnya di luar iman, seperti yang dijelaskan."
