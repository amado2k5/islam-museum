id: work/fatwa-aliftaa-jo-loan-forgiven-after-the-borrowers-death
class: work
kind: fatwa
label: { ar: "أثر إسقاط القرض عن المقترض المتوفى على من أمره بالاقتراض", en: "When a bank cancels a dead borrower's loan: what of the person he borrowed for?", ur: "جب بینک فوت شدہ قرض دار کا قرض معاف کر دے تو جس کے لیے اس نے قرض لیا اس کا کیا حکم؟" }
summary:
  ar: "سؤال عمن اقترض له شخص من بنك ربوي ثم توفي فسدّد التأمين الدين، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحكم يتوقف على صورة العلاقة بينهما. قدّمت الدائرة بأن الاقتراض بالربا محرم ومن كبائر الذنوب، وأن من وقع فيه فعليه التوبة الصادقة. ثم ميّزت بين صورتين: الأولى أن يكون السائل قد وكّل المتوفى في الاقتراض له، فهذه وكالة، لأن الوكيل لم يقترض لنفسه بل عن موكله الذي هو المقترض الحقيقي، وتصرفات الوكيل منوطة بمصلحة الموكل كما قرر تاج الدين السبكي، فإذا أسقط البنك القرض عن الوكيل سقط عن الموكل ولا يلزمه دفع الباقي للورثة. والثانية أن يكون السائل قد طلب قرضًا من المتوفى دون تحديد مصدره، فاقترض المتوفى من البنك وأقرضه، فهما عقدان منفصلان، ولا يسقط قرض السائل للمتوفى بسقوط قرض البنك. وأشارت إلى قرار سابق لمجلس الإفتاء برقم 251 لسنة 2018 في صورة قريبة."
  en: "A question from someone for whom another man took a loan from an interest-based bank and then died, with insurance paying off the debt, in which Jordan's General Iftaa Department answered that the ruling depends on how the two were related. The Department first said that borrowing on interest is forbidden and a grave sin, and that anyone who has done so must sincerely repent. It then distinguished two cases. In the first, the questioner appointed the deceased as his agent to borrow for him: this is agency, since the agent did not borrow for himself but for his principal, who is the real borrower, and an agent's acts serve the principal's interest, as Taj al-Din al-Subki stated; so if the bank cancelled the loan for the agent, it is cancelled for the principal, who owes nothing further to the heirs. In the second, the questioner asked the deceased for a loan without specifying its source, and the deceased borrowed from the bank and lent it on: these are two separate contracts, and the bank's cancellation of its loan does not cancel what the questioner owes the deceased. It referred to an earlier decision of its Iftaa Council, no. 251 of 2018, on a similar case."
  ur: "ایسے شخص کا سوال جس کے لیے کسی نے سودی بینک سے قرض لیا اور پھر فوت ہو گیا اور انشورنس نے قرض ادا کر دیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حکم دونوں کے باہمی تعلق کی صورت پر موقوف ہے۔ ڈیپارٹمنٹ نے پہلے کہا کہ سود پر قرض لینا حرام اور کبیرہ گناہ ہے، اور جو اس میں پڑ جائے اسے سچی توبہ کرنی چاہیے۔ پھر اس نے دو صورتوں میں فرق کیا۔ پہلی یہ کہ سائل نے فوت شدہ کو اپنے لیے قرض لینے کا وکیل بنایا ہو: یہ وکالت ہے، کیونکہ وکیل نے اپنے لیے نہیں بلکہ اپنے موکل کے لیے قرض لیا جو اصل قرض دار ہے، اور وکیل کے تصرفات موکل کی مصلحت سے وابستہ ہوتے ہیں جیسا کہ تاج الدین السبکی نے بیان کیا؛ لہٰذا اگر بینک نے وکیل سے قرض ساقط کر دیا تو موکل سے بھی ساقط ہو گیا اور اس پر ورثہ کو باقی رقم دینا لازم نہیں۔ دوسری یہ کہ سائل نے فوت شدہ سے قرض مانگا ہو اور اس کا ذریعہ متعین نہ کیا ہو، پھر فوت شدہ نے بینک سے قرض لے کر اسے دیا ہو: یہ دو الگ عقد ہیں، اور بینک کا قرض ساقط ہونے سے سائل کا فوت شدہ کو واجب الادا قرض ساقط نہیں ہوتا۔ اس نے اسی سے ملتی صورت میں اپنی افتاء کونسل کے سابقہ فیصلے نمبر 251 بابت 2018 کا حوالہ دیا۔"
