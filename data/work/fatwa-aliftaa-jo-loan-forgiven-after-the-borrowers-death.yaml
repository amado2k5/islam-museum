id: work/fatwa-aliftaa-jo-loan-forgiven-after-the-borrowers-death
class: work
kind: fatwa
label: { ar: "أثر إسقاط القرض عن المقترض المتوفى على من أمره بالاقتراض", en: "When a bank cancels a dead borrower's loan: what of the person he borrowed for?", ur: "جب بینک فوت شدہ قرض دار کا قرض معاف کر دے تو جس کے لیے اس نے قرض لیا اس کا کیا حکم؟", es: "Cuando un banco cancela el préstamo de un prestatario fallecido, ¿qué sucede con la persona para quien solicitó el préstamo?", fr: "Lorsqu'une banque annule le prêt d'un emprunteur décédé: qu'advient-il de la personne pour laquelle il avait emprunté ?" }
summary:
  ar: "سؤال عمن اقترض له شخص من بنك ربوي ثم توفي فسدّد التأمين الدين، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحكم يتوقف على صورة العلاقة بينهما. قدّمت الدائرة بأن الاقتراض بالربا محرم ومن كبائر الذنوب، وأن من وقع فيه فعليه التوبة الصادقة. ثم ميّزت بين صورتين: الأولى أن يكون السائل قد وكّل المتوفى في الاقتراض له، فهذه وكالة، لأن الوكيل لم يقترض لنفسه بل عن موكله الذي هو المقترض الحقيقي، وتصرفات الوكيل منوطة بمصلحة الموكل كما قرر تاج الدين السبكي، فإذا أسقط البنك القرض عن الوكيل سقط عن الموكل ولا يلزمه دفع الباقي للورثة. والثانية أن يكون السائل قد طلب قرضًا من المتوفى دون تحديد مصدره، فاقترض المتوفى من البنك وأقرضه، فهما عقدان منفصلان، ولا يسقط قرض السائل للمتوفى بسقوط قرض البنك. وأشارت إلى قرار سابق لمجلس الإفتاء برقم 251 لسنة 2018 في صورة قريبة."
  en: "A question from someone for whom another man took a loan from an interest-based bank and then died, with insurance paying off the debt, in which Jordan's General Iftaa Department answered that the ruling depends on how the two were related. The Department first said that borrowing on interest is forbidden and a grave sin, and that anyone who has done so must sincerely repent. It then distinguished two cases. In the first, the questioner appointed the deceased as his agent to borrow for him: this is agency, since the agent did not borrow for himself but for his principal, who is the real borrower, and an agent's acts serve the principal's interest, as Taj al-Din al-Subki stated; so if the bank cancelled the loan for the agent, it is cancelled for the principal, who owes nothing further to the heirs. In the second, the questioner asked the deceased for a loan without specifying its source, and the deceased borrowed from the bank and lent it on: these are two separate contracts, and the bank's cancellation of its loan does not cancel what the questioner owes the deceased. It referred to an earlier decision of its Iftaa Council, no. 251 of 2018, on a similar case."
  ur: "ایسے شخص کا سوال جس کے لیے کسی نے سودی بینک سے قرض لیا اور پھر فوت ہو گیا اور انشورنس نے قرض ادا کر دیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حکم دونوں کے باہمی تعلق کی صورت پر موقوف ہے۔ ڈیپارٹمنٹ نے پہلے کہا کہ سود پر قرض لینا حرام اور کبیرہ گناہ ہے، اور جو اس میں پڑ جائے اسے سچی توبہ کرنی چاہیے۔ پھر اس نے دو صورتوں میں فرق کیا۔ پہلی یہ کہ سائل نے فوت شدہ کو اپنے لیے قرض لینے کا وکیل بنایا ہو: یہ وکالت ہے، کیونکہ وکیل نے اپنے لیے نہیں بلکہ اپنے موکل کے لیے قرض لیا جو اصل قرض دار ہے، اور وکیل کے تصرفات موکل کی مصلحت سے وابستہ ہوتے ہیں جیسا کہ تاج الدین السبکی نے بیان کیا؛ لہٰذا اگر بینک نے وکیل سے قرض ساقط کر دیا تو موکل سے بھی ساقط ہو گیا اور اس پر ورثہ کو باقی رقم دینا لازم نہیں۔ دوسری یہ کہ سائل نے فوت شدہ سے قرض مانگا ہو اور اس کا ذریعہ متعین نہ کیا ہو، پھر فوت شدہ نے بینک سے قرض لے کر اسے دیا ہو: یہ دو الگ عقد ہیں، اور بینک کا قرض ساقط ہونے سے سائل کا فوت شدہ کو واجب الادا قرض ساقط نہیں ہوتا۔ اس نے اسی سے ملتی صورت میں اپنی افتاء کونسل کے سابقہ فیصلے نمبر 251 بابت 2018 کا حوالہ دیا۔"
  es: "Una persona que solicitó un préstamo a un banco con intereses y falleció, con la deuda cubierta por el seguro, consultó con el Departamento General de Iftaa de Jordania, quien respondió que la resolución depende de la relación entre ambos. El Departamento afirmó, en primer lugar, que pedir préstamos con intereses está prohibido y constituye un pecado grave, y que quien lo haya hecho debe arrepentirse sinceramente. A continuación, distinguió dos casos. En el primero, el consultante designó al fallecido como su agente para solicitar un préstamo en su nombre: esto constituye una representación, ya que el agente no solicitó el préstamo para sí mismo, sino para su principal, quien es el verdadero prestatario, y los actos del agente sirven a los intereses del principal, como afirmó Taj al-Din al-Subki; por lo tanto, si el banco canceló el préstamo para el agente, también se cancela para el principal, quien no tiene ninguna obligación adicional con los herederos. En el segundo caso, el consultante solicitó un préstamo al fallecido sin especificar su origen, y el fallecido lo obtuvo del banco y lo prestó: se trata de dos contratos separados, y la cancelación del préstamo por parte del banco no cancela la deuda que el consultante tenía con el fallecido. Hizo referencia a una decisión anterior de su Consejo Iftaa, la número 251 de 2018, sobre un caso similar."
  fr: "Une question a été posée par une personne pour laquelle un autre homme avait contracté un prêt auprès d'une banque à taux d'intérêt, puis était décédé, l'assurance ayant pris en charge la dette. Le Département général de la Iftaa de Jordanie a répondu que la décision dépendait du lien de parenté entre les deux personnes. Le Département a d'abord rappelé que l'emprunt à intérêt est interdit et constitue un péché grave, et que quiconque s'y est adonné doit se repentir sincèrement. Il a ensuite distingué deux cas. Dans le premier, le demandeur avait désigné le défunt comme son mandataire pour emprunter en son nom: il s'agit d'un mandat, car le mandataire n'a pas emprunté pour lui-même mais pour son mandant, qui est le véritable emprunteur. Or, les actes d'un mandataire servent les intérêts du mandant, comme l'a affirmé Taj al-Din al-Subki; par conséquent, si la banque annule le prêt pour le mandataire, il est annulé pour le mandant, qui n'a plus aucune obligation envers les héritiers. Dans le second cas, le demandeur avait sollicité un prêt auprès du défunt sans en préciser la source, et le défunt avait emprunté auprès de la banque avant de prêter à son tour: il s'agit de deux contrats distincts, et l'annulation du prêt par la banque n'annule pas la dette du demandeur envers le défunt. Elle a fait référence à une décision antérieure de son Conseil Iftaa, la n° 251 de 2018, sur un cas similaire."
