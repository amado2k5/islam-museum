label:
  ar: "همسات: وصايا الرسول للنساء"
  en: "Hamasat: the Prophet's counsels to women"
  ur: "ہمسات: عورتوں کے لیے رسول کی وصیتیں"
summary:
  ar: "برنامج من أربع عشرة حلقة قصيرة لمسعد أنور يحفظه أرشيف أسابيل باسم «همسات» ويسمّيه هو «وصايا الرسول للنساء»، سُجّل بعضه في رمضان بقوله: كل حلقة على حديث في وصية للنساء، في مكانة المرأة، والعفاف، وطلب الطلاق بغير سبب، وحق الجار، وقيام الليل، والنياحة والصبر، وحق الزوج، والتبرج، والصدقة، وإفساد الزوجة على زوجها، وتيسير المهر، والصلاة، والولي في النكاح."
  en: "A programme of fourteen short episodes by Mosaad Anwar, kept in the Assabile archive as 'Hamasat' and named by him 'The Prophet's Counsels to Women', partly recorded in Ramadan by his own words: each episode rests on a hadith of counsel to women, on women's standing, chastity, asking for divorce without cause, neighbours, night prayer, wailing and patience, the husband's right, immodest display, charity, turning a wife against her husband, an easy dower, prayer and the guardian in marriage."
  ur: "مسعد انور کا چودہ مختصر اقساط کا پروگرام جو اسابیل آرکائیو میں «ہمسات» کے نام سے محفوظ ہے اور جسے وہ خود «وصايا الرسول للنساء» کہتے ہیں؛ ان کے بقول اس کا کچھ حصہ رمضان میں ریکارڈ ہوا: ہر قسط عورتوں کے لیے وصیت کی ایک حدیث پر ہے، عورت کے مقام، عفت، بلا سبب طلاق کے مطالبے، پڑوسی کے حق، قیام اللیل، نوحہ اور صبر، شوہر کے حق، تبرج، صدقہ، بیوی کو شوہر کے خلاف بھڑکانے، مہر کی آسانی، نماز اور نکاح میں ولی پر۔"
