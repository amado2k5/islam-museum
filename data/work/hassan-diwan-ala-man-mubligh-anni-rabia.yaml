label: { ar: "قصيدة حسان «ألا من مبلغ عني ربيعا»", en: "Hassan's poem 'Who will carry word from me to Rabi'a'", es: "El poema de Hassan: \"¿Quién llevará mi mensaje a Rabi'a?\"", fr: "Le poème d'Hassan « Qui portera mon message à Rabi'a ? »", ur: "حسن کی نظم 'مجھ سے ربیعہ تک لفظ کون لے جائے گا'", tr: "Hassan'ın \"Bahar Bana Rapor Veren Kişi Hariç\" şiiri", id: "Puisi Hassan \"Kecuali Yang Melaporkan Aku Musim Semi\"" }
summary:
  ar: "أبيات لحسان بن ثابت من الوافر على روي الدال، لربيعة بن مالك ابن أبي براء، يحرضه على عامر بن الطفيل لإخفاره جوار أبيه {{cite:sharh-diwan-hassan-barquqi-1929 p.107}}."
  en: "Verses by Hassan ibn Thabit in the wafir metre on the rhyme dal, to Rabi'a, son of Abu Bara', urging him against Amir ibn al-Tufayl for breaching his father's protection {{cite:sharh-diwan-hassan-barquqi-1929 p.107}}."
  es: "Versos de Hassan ibn Thabit en metro wafir sobre la rima dal, a Rabi'a, hijo de Abu Bara', instándolo contra Amir ibn al-Tufayl por violar la protección de su padre {{cite:sharh-diwan-hassan-barquqi-1929 p.107}}."
  fr: "Vers de Hassan ibn Thabit en mètre wafir sur la rime dal, à Rabi'a, fils d'Abu Bara', l'exhortant à se défendre contre Amir ibn al-Tufayl pour avoir violé la protection de son père {{cite:sharh-diwan-hassan-barquqi-1929 p.107}}."
  ur: "حسن بن ثابت کی آیات وفیر میٹر میں رائم دال پر، ربیعہ، ابن ابی براء کو، امیر ابن الطفیل کے خلاف اپنے والد کی حفاظت کی خلاف ورزی کرنے پر زور دیتے ہوئے"
  tr: "Hassan ibn Thabit'in El-Vafir'den Dal anlatımı üzerine Rabi'ah ibn Malik ibn Abi Bara' tarafından yazdığı şiirler, onu babasına yakınlığı nedeniyle Emir ibn el-Tufail'e karşı kışkırtan şiirler {{cite:sharh-diwan-hassan-barquqi-1929 s.107}}."
  id: "Ayat oleh Hassan ibn Thabit dari Al-Wafir tentang narasi Dal, oleh Rabi'ah ibn Malik ibn Abi Bara', yang menghasutnya melawan Amir ibn al-Tufail karena kedekatannya dengan ayahnya {{cite:sharh-diwan-hassan-barquqi-1929 hlm.107}}."
