label: { ar: "قرار مجمع الفقه الإسلامي الدولي 196 (21/2) بشأن استكمال موضوع الصكوك الإسلامية", en: "IIFA resolution 196 (21/2) on completing the subject of Islamic sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 196 (21/2): اسلامی صکوک کے موضوع کی تکمیل", es: "Resolución 196 (21/2) de la IIFA sobre la finalización del tema de los sukuk islámicos.", fr: "Résolution 196 (21/2) de l'IIFA relative à l'achèvement du sujet des sukuk islamiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 196 (21/2) İslami belgeler konusunun tamamlanmasına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 196 (21/2) mengenai penyelesaian subjek instrumen Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. قرر في حكم تأجيل الأجرة في الإجارة الموصوفة في الذمة: يجوز في إجارة المنافع الموصوفة في الذمة تعجيل الأجرة وتقسيطها وتأجيلها؛ ولا تستحق الأجرة إلا بتمكين المستأجر من المنفعة فإن لم يمكن من استيفائها في الأجل المتفق عليه لا تستحق؛ ويجوز في إجارة الخدمات ⁦(التي فيها عمل)⁩ تعجيل الأجرة وتقسيطها وتأجيلها؛ ويجب ألا يؤدي ذلك إلى بيع الدين بالدين أو ربح ما لم يضمن أو بيع ما ليس عند البائع المنهي عنها شرعًا. وفي حكم تداول صكوك إجارة الموصوف في الذمة قبل تعيين محل العقد أكد قراره 188 ⁦(20/3)⁩ وقرر: لا يجوز تداول صكوك ملكية منافع الأعيان الموصوفة في الذمة قبل تعيين العين التي تستوفى منها المنفعة؛ ولا يجوز تداول صكوك ملكية الخدمات التي تستوفى من طرف موصوف في الذمة قبل تعيين الطرف إلا بمراعاة ضوابط التصرف في الديون فإذا تعين جاز التداول؛ ولا يجوز تداول الصكوك التي تمثل أعيانًا تستصنع مع تأجيرها إجارة موصوفة في الذمة قبل البدء الحقيقي للمستصنع. وفي حالات إصدار الصكوك: إذا كانت تمثل موجودات مشروع أو نشاط استثماري تختلط فيه النقود والديون والأعيان والمنافع طبقت عليها فقرة قراره 188 بحيث إن كانت الديون والنقود مستقلة عن الأعيان والمنافع والجهاز الإداري والنشاط الاقتصادي المتبوع فلا يجوز الإصدار والتداول إلا بغلبة الأعيان والمنافع، وإن شملت الملكية الجهاز الإداري القائم بالنشاط الاقتصادي المولد للنقود والديون وصار له كيان شرعي وقانوني مستقل جاز الإصدار والتداول بناء على مبدأ التبعية، والنشاط الاقتصادي المقصود العمل الذي يولد الديون والنقود على نحو مشروع. وأكد أن قرارات المجمع تسري من حين صدورها ولا تؤثر على ما سبقها من عقود ومنها صكوك صدرت باجتهاد أو فتوى معتبرة. وأما معيارا الغلبة والتبعية فرأى تأجيل إصدار قرار فيهما وأوصى باستكتاب أبحاث فيهما — وقد استكملهما المجمع لاحقًا بقرارَي 214 ⁦(22/10)⁩ و226 ⁦(23/10)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). On deferring rent in a lease of usufruct described in liability: advancing, instalment and deferral of rent are all permissible in such leases and in service leases; rent is not due unless the lessee is enabled to the usufruct — if he is not enabled to take it within the agreed term, no rent is due; and this must not lead to selling debt for debt, profiting on the unguaranteed, or the prohibited sale of what the seller does not have. On trading sukuk of leases described in liability before specifying the contract object, reaffirming resolution 188 (20/3): sukuk of ownership of the usufruct of objects described in liability may not be traded before the object from which the usufruct is taken is specified; sukuk of ownership of services taken from a party described in liability may not be traded before that party is specified except under the controls of disposing of debts — once specified they may be traded; and sukuk representing objects to be manufactured with a liability lease may not be traded before the manufactured thing actually begins. On cases of issuing sukuk: where they represent the assets of a project or investment activity mixing cash, debts, objects and usufructs, the clause of resolution 188 applies — if the debts and cash are independent of the objects, usufructs, the administrative apparatus and the followed economic activity, issue and trading are permissible only with a predominance of objects and usufructs; but if ownership includes the administrative apparatus conducting the economic activity generating the cash and debts and it has an independent legal personality, issue and trading are permissible on the principle of subordination — 'economic activity' meaning work generating debts and cash lawfully. It reaffirmed that Academy resolutions apply from issuance and do not affect earlier contracts including sukuk issued on recognised ijtihad or fatwa. On the two criteria of predominance and subordination it deferred a resolution and recommended commissioning research — completed later in resolutions 214 (22/10) and 226 (23/10)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ ذمہ میں موصوف اجارے میں اجرت مؤجل کرنے کے حکم پر: ایسے اجارے اور خدمات کے اجارے میں اجرت کی پیشگی، اقساط اور التوا سب جائز ہیں؛ اجرت اسی وقت واجب ہوتی ہے جب مستاجر کو منفعت تک پہنچ دیا جائے — اتفاق شدہ مدت میں منفعت نہ ملے تو اجرت نہیں؛ اور اس سے قرض کا قرض سے بیع، غیر ضمانت شدہ کا منافع، یا وہ حرام بیع جس کے پاس بیچنے والا نہیں، پیدا نہیں ہونا چاہیے۔ ذمہ میں موصوف اجارے کی صکوک کا ٹریڈ عقد کے محل کے تعین سے پہلے کے حکم پر — قرارداد 188 ⁦(20/3)⁩ کی تائید کرتے ہوئے: ذمہ میں موصوف اشیاء کے منافع کی ملکیت کی صکوک اس شے کے تعین سے پہلے ٹریڈ نہیں ہو سکتیں جس سے منفعت لی جائے؛ ذمہ میں موصوف فریق سے لی جانے والی خدمات کی ملکیت کی صکوک اس فریق کے تعین سے پہلے ٹریڈ نہیں ہو سکتیں سوائے قرضوں کے تصرف کے ضوابط کے ساتھ — تعین کے بعد جائز؛ اور وہ صکوک جو بناوٹ میں آنے والی اشیاء کی نمائندگی کرتی ہیں جس پر ذمہ میں اجارہ ہو، بناوٹ کے حقیقی آغاز سے پہلے ٹریڈ نہیں ہو سکتیں۔ صکوک کے اصدار کے معاملات میں: اگر وہ کسی منصوبے یا سرمایہ کاری سرگرمی کے اثاثوں کی نمائندگی کریں جن میں نقد، قرض، اشیاء اور منافع ملی ہوں تو قرارداد 188 کی دفعہ لاگو ہوتی ہے — اگر قرض اور نقد اشیاء، منافع، انتظامی ڈھانچے اور متبوع اقتصادی سرگرمی سے الگ ہوں تو اصدار و ٹریڈ صرف اشیاء و منافع کے غلبے کے ساتھ جائز؛ مگر اگر ملکیت میں نقد و قرض پیدا کرنے والی اقتصادی سرگرمی چلانے والا انتظامی ڈھانچہ شامل ہو اور اس کی الگ شرعی و قانونی شخصی ہو تو اصدار و ٹرید تبعیت کے اصول پر جائز — 'اقتصادی سرگرمی' سے مراد وہ کام جو جائز طریقے سے قرض اور نقد پیدا کرے۔ اس نے تاکید کی کہ اکیڈمی کی قراردادیں جاری ہونے سے لاگو ہوتی ہیں اور سابقہ عقود کو متاثر نہیں کرتیں جن میں معتبر اجتہاد یا فتویٰ سے جاری صکوک شامل ہیں۔ غلبہ اور تبعیت کے دو معیارات پر قرارداد مؤجل کی اور تحقیقات لکھوانے کی سفارش کی — بعد میں قراردادوں 214 ⁦(22/10)⁩ اور 226 ⁦(23/10)⁩ میں مکمل ہوئی۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013). Sobre el aplazamiento del alquiler en un arrendamiento de usufructo descrito en la responsabilidad: el adelanto, el pago a plazos y el aplazamiento del alquiler son todos permisibles en tales arrendamientos y en arrendamientos de servicios; el alquiler no es exigible a menos que el arrendatario esté habilitado para el usufructo; si no está habilitado para tomarlo dentro del plazo acordado, no se debe ningún alquiler; y esto no debe conducir a la venta de deuda por deuda, al lucro sobre lo no garantizado, o a la venta prohibida de lo que el vendedor no tiene. Sobre la negociación de sukuk de arrendamientos descritos en la responsabilidad antes de especificar el objeto del contrato, reafirmando la resolución 188 (20/3): los sukuk de propiedad del usufructo de objetos descritos en la responsabilidad no pueden negociarse antes de que se especifique el objeto del cual se toma el usufructo; Los sukuk de propiedad de servicios tomados de una parte descrita en la responsabilidad no pueden negociarse antes de que se especifique dicha parte, excepto bajo los controles de disposición de deudas; una vez especificados, pueden negociarse; y los sukuk que representan objetos a fabricar con un contrato de arrendamiento de responsabilidad no pueden negociarse antes de que comience la fabricación del bien. En los casos de emisión de sukuk: cuando representan los activos de un proyecto o actividad de inversión que mezcla efectivo, deudas, objetos y usufructos, se aplica la cláusula de la resolución 188: si las deudas y el efectivo son independientes de los objetos, los usufructos, el aparato administrativo y la actividad económica subsiguiente, la emisión y la negociación solo son permisibles con un predominio de los objetos y los usufructos; pero si la propiedad incluye el aparato administrativo que lleva a cabo la actividad económica que genera el efectivo y las deudas y tiene personalidad jurídica independiente, la emisión y la negociación son permisibles según el principio de subordinación: \"actividad económica\" significa trabajo que genera deudas y efectivo legalmente. Reafirmó que las resoluciones de la Academia se aplican desde su publicación y no afectan a los contratos anteriores, incluidos los sukuk emitidos con base en ijtihad o fatwa reconocidas. Respecto a los dos criterios de predominio y subordinación, aplazó una resolución y recomendó encargar una investigación, que se completó posteriormente en las resoluciones 214 (22/10) y 226 (23/10)."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013). Concernant le report du loyer dans un bail d'usufruit portant sur un passif: le paiement anticipé, échelonné et le report du loyer sont tous permis dans de tels baux et dans les baux de services; le loyer n'est dû que si le preneur est en mesure de jouir de l'usufruit – s'il n'est pas en mesure de le faire dans le délai convenu, aucun loyer n'est dû; et cela ne doit pas conduire à la vente de créances contre créances, à la réalisation de profits sur un bien non garanti, ou à la vente prohibée de ce que le vendeur ne possède pas. Concernant la négociation de sukuk de baux portant sur un passif avant la spécification de l'objet du contrat, réaffirmant la résolution 188 (20/3): les sukuk de propriété de l'usufruit d'objets portant sur un passif ne peuvent être négociés avant que l'objet dont provient l'usufruit ne soit spécifié; Les sukuk portant sur la propriété de services obtenus d'une partie désignée comme responsable ne peuvent être négociés avant que cette partie ne soit identifiée, sauf dans le cadre du règlement des créances; une fois identifiée, ils peuvent être négociés. De même, les sukuk représentant des biens à fabriquer dans le cadre d'un contrat de location-financement ne peuvent être négociés avant le début effectif de la fabrication. Concernant l'émission de sukuk: lorsqu'ils représentent les actifs d'un projet ou d'une activité d'investissement combinant liquidités, créances, biens et usufruits, la disposition de la résolution 188 s'applique: si les créances et les liquidités sont indépendantes des biens, des usufruits, de l'appareil administratif et de l'activité économique qui en découle, l'émission et la négociation ne sont autorisées qu'avec une prédominance des biens et des usufruits; mais si la propriété inclut l'appareil administratif menant l'activité économique générant les liquidités et les créances et que cet appareil possède une personnalité juridique distincte, l'émission et la négociation sont autorisées selon le principe de subordination – l'« activité économique » désignant toute activité générant licitement des créances et des liquidités. Elle a réaffirmé que les résolutions de l'Académie s'appliquent dès leur émission et n'affectent pas les contrats antérieurs, y compris les sukuk émis sur la base d'un ijtihad ou d'une fatwa reconnus. Concernant les deux critères de prédominance et de subordination, elle a reporté sa décision et recommandé la réalisation de recherches, menées ultérieurement dans les résolutions 214 (22/10) et 226 (23/10)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirmi birinci oturumunda Riyad'da toplu kararı (15–19 Muharrem 1435H, 18–22 Kasım 2013). Borçta belirtilen kira sözleşmesinin ertelenmesine ilişkin karar kararlaştırıldı: Borç kiralamasında belirtilen fayda için kiranın hızlandırılması, kurulması veya ertelenmesi mümkündür: Kira hızlandırılabilir, kurulabilir veya ertelenebilir; kira ancak kiracı bundan faydalanabiliyorsa ödenmelidir ve kararlaştırılan süre içinde tahsil edilemiyorsa hak kazanılmaz; kiralama hizmetlerinde (iş içeren) kira ödemesinin hızlandırılması, taksitlenmesi veya ertelenmesi mümkündür; ve bu, borç veya kâr karşılığında satılmaya veya satıcıda olmayan bir şeyin satılmasına yol açmamalıdır ki bu Şeriat tarafından yasaklanmıştır. Sözleşme yerinin belirlenmeden önce sorumlu olarak tanımlanan kira senetlerinin işlemine ilişkin olarak, 188 (20/3) sayılı kararı onaylandı ve karar verildi: Faydanın sağlandığı kalem belirlenmeden önce yükümlülükte tanımlanan mülkiyet tapularının faydaları karşılığında mülkiyet senetlerinin ticareti mümkün değildir; ve taraf atanmadan önce sorumlu olarak tanımlanan bir taraftan tahsil edilen hizmetler için mülkiyet senetleri, borç tasfiyesine ilişkin düzenlemeler tabi olmadıkça ticarete geçirilebilir. Gerekirse müzakereye izin verilir; ve imal edilmiş mülkün fiili başlamasından önce tanımlanan bir kira sözleşmesinin kiralanmasında kullanılan eşyaların ticaretine izin verilmez. Sukuk ihraç durumlarında: para, borç, nesne ve fayda içeren meşru varlıklar veya yatırım faaliyetlerini temsil ediyorsa, kararın 188. paragrafı onlara uygulanır. Borçlar ve paralar varlıklardan, faydalardan, idari mekanizmadan ve ekonomik faaliyetten bağımsızsa, ihraç ve dolaşıma yalnızca varlıklar ve faydalar baskın olduğunda izin verilir. Mülkiyet, para ve borç üreten ekonomik faaliyeti işleten idari organı da kapsıyorsa ve bağımsız bir tüzel ve tüzel kişi haline geldiyse, ihraç ve dolaşım subsidiarite ilkesine dayanabilir. Amaçlanan ekonomik faaliyet, meşru borç ve para yaratan iştir. Dernek kararlarının ihraç anından itibaren geçerli olduğunu ve geçerli içtihat veya fetva ile çıkarılan sukuklar dahil önceki sözleşmeleri etkilemediğini teyit etti. Öncelik ve itaatkâr kriterlerine gelince, bunlar hakkında karar verilmesinin ertelenmesini gördü ve bu konuda araştırma yapılmasını tavsiye etti—Akademi bunu daha sonra 214 (22/10) ve 226 (23/10) sayılı kararlarla tamamladı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sidang kedua puluh satu di Riyadh (15–19 Muharram 1435H, 18–22 November 2013). Keputusan atas keputusan penundaan sewa sewa yang dijelaskan dalam utang: Diperbolehkan mempercepat, memasang, atau menunda sewa untuk manfaat yang dijelaskan dalam sewa utang: Sewa dapat dipercepat, dipasang, atau ditunda; sewa hanya harus dibayar jika penyewa dapat memperoleh manfaat darinya, dan jika tidak dapat menagihnya dalam jangka waktu yang disepakati, maka tidak berhak; dalam layanan sewa (yang melibatkan pekerjaan), diperbolehkan mempercepat, memasang, atau menunda sewa; dan ini tidak boleh menyebabkan penjualan utang untuk utang atau keuntungan kecuali dijamin, atau menjual apa yang tidak dimiliki oleh penjual, yang dilarang oleh Syariah. Mengenai transaksi akta sewa yang digambarkan sebagai tanggung jawab sebelum menentukan tempat kontrak, keputusan No. 188 (20/3) dikukuhkan, dan diputuskan: Tidak diperbolehkan menukar akta kepemilikan untuk manfaat properti yang dijelaskan dalam kewajiban sebelum menetapkan barang dari mana manfaat tersebut berasal; dan akta kepemilikan untuk jasa yang dikumpulkan dari pihak yang disebutkan bertanggung jawab sebelum pihak tersebut ditunjuk tidak boleh diperdagangkan kecuali dengan tunduk pada peraturan penyelesaian utang. Jika perlu, negosiasi diperbolehkan; dan tidak diperbolehkan memperdagangkan akta yang mewakili barang yang digunakan untuk menyewa sewa yang dijelaskan sebelum dimulainya properti yang diproduksi. Dalam kasus penerbitan sukuk: jika mewakili aset sah atau aktivitas investasi yang melibatkan uang, utang, objek, dan manfaat, paragraf 188 keputusannya berlaku untuk mereka. Jika utang dan uang independen dari aset, manfaat, perangkat administratif, dan aktivitas ekonomi, penerbitan dan peredaran hanya diizinkan jika aset dan manfaat didominasi. Jika kepemilikan mencakup badan administratif yang menjalankan aktivitas ekonomi yang menghasilkan uang dan utang dan telah menjadi entitas hukum dan hukum independen, penerbitan dan peredaran dapat didasarkan pada prinsip subsidiaritas. Kegiatan ekonomi yang dimaksud adalah pekerjaan yang secara sah menghasilkan utang dan uang. Ia menegaskan bahwa keputusan Asosiasi berlaku sejak saat penerbitan dan tidak memengaruhi kontrak sebelumnya, termasuk sukuk yang diterbitkan berdasarkan yurisprudensi atau fatwa yang berlaku. Adapun kriteria prioritas dan subordinasi, keputusan tertunda dan merekomendasikan komisi penelitian tentang hal tersebut—yang kemudian dilengkapi Akademi dengan resolusi 214 (22/10) dan 226 (23/10)."
