label:
  ar: "شرح الحكم العطائية (سلسلة دروس)"
  en: "Sharh al-Hikam al-'Ata'iyya (lecture series)"
  ur: "شرح الحکم العطائیہ (درسی سلسلہ)"
summary:
  ar: "سلسلة من سبع عشرة حلقة لعمر عبد الكافي في أرشيف أسابيل، يشرح فيها حكم ابن عطاء الله السكندري حكمةً بعد حكمة في مجلس علم، ويستطرد إلى قصص الأنبياء والصحابة وإلى آداب الدعاء والاستخارة والصحبة."
  en: "A seventeen-episode series by Omar Abdelkafy on the Assabile archive, explaining the Hikam of Ibn Ata Allah al-Iskandari maxim by maxim in a study circle, with digressions into stories of prophets and Companions and the manners of supplication, istikhara and companionship."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا سترہ اقساط کا سلسلہ، جس میں وہ ایک علمی مجلس میں ابن عطاء اللہ اسکندری کی حکمتوں کی ایک ایک کر کے شرح کرتے ہیں، اور انبیا و صحابہ کے قصوں اور دعا، استخارہ اور صحبت کے آداب پر بھی گفتگو کرتے ہیں۔"
