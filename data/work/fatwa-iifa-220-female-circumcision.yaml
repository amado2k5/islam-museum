id: work/fatwa-iifa-220-female-circumcision
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 220 (23/4) بشأن خفاض الإناث في الفقه الإسلامي", en: "IIFA resolution 220 (23/4) on khifad (female circumcision) in Islamic jurisprudence", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 220 (23/4): فقہِ اسلامی میں خفاضِ اناث" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩. قرر المجمع أن خفاض الإناث يقصد به قطع قدر يسير من الجلدة المستعلية فوق البظر مع ترك البظر نفسه سليمًا وهو ما يسمى عملية خفاض غطاء البظر أو تخفيض قلفة البظر؛ وأنه عادة اجتماعية قديمة وجه رسول الله إلى تهذيبها على الشكل الذي يحمي الأنثى من تجاوز الحد المعتاد؛ وأن هذا الخفاض محل خلاف بين أهل العلم ولا يمارس في أكثر بلدان العالم الإسلامي وقد أباحه عدد من الفقهاء ضمن ضوابط وشروط منها أن يكون تحت إشراف طبي؛ وأنه لا يجوز المساس بأي جزء من أجزاء الجهاز التناسلي الأنثوي لما فيه من الإضرار بالإناث وحياتهن الزوجية وهذا الفعل تحرمه الشريعة ويُجرّم فاعله شرعًا ويؤيد المجمع الإجراءات المتخذة من حكومات الدول الإسلامية للقضاء على هذه التجاوزات؛ وأن الخفاض المقرر هنا لا يدخل ضمن مصطلح تشويه الأعضاء التناسلية الأنثوية أو قطعها المنصوص على منعها لدى المنظمات الصحية الدولية وبخاصة منظمة الصحة العالمية. وأوصى المجمع بمطالبة منظمة الصحة العالمية بإعادة طرح موضوع تشويه الأعضاء التناسلية للإناث للدراسة بإشراك القيادات الدينية والمجتمعية والطبية لتحسين فهمها وتحديث معلوماتها الدينية والاستعانة بالممارسين الطبيين المعاصرين عند حاجة النساء إلى الخفاض وتوضيح الفرق بينه وبين الأنواع المتفق على تجريمها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018). It ruled that khifad of females means cutting a small portion of the skin overlying the clitoris while leaving the clitoris itself intact — the operation called reduction of the clitoral hood or prepuce; that it is an old social custom which the Prophet directed to be refined in a form protecting the female from exceeding the accustomed limit; that this khifad is disputed among scholars, is not practised in most countries of the Islamic world, and a number of jurists permitted it under controls and conditions including medical supervision; that it is impermissible to touch any part of the female genital organs, given the harm to females and their married lives — an act the sharia forbids and criminalises its doer, and the Academy supports the measures taken by the governments of Islamic states to eliminate these violations; and that the khifad defined here does not fall under the term female genital mutilation or excision prohibited and warned against by international health organisations, especially the World Health Organisation. It recommended asking the WHO to raise the subject of female genital mutilation for study anew with religious, community and medical leaders participating, to improve understanding and update its religious information, and to enlist contemporary medical practitioners in hospitals when women need the khifad — clarifying the difference between it and the kinds agreed to be criminalised."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا کہ خفاضِ اناث سے مراد چٹکی ⁦(clitoris)⁩ کے اوپر کی چمڑی کا تھوڑا سا حصہ کاٹنا ہے جبکہ چٹکی خود محفوظ رہے — جسے غلافِ چٹکی کی کٹوتی یا پیش پوست کی کٹوتی کہتے ہیں؛ یہ ایک پرانی سماجی روش ہے جسے رسولِ اسلام نے اس شکل میں اصلاح کی ہدایت کی جو لڑکی کو معمول کی حد سے تجاوز سے بچائے؛ یہ خفاض اہلِ علم میں متنازع ہے اور اسلامی دنیا کے اکثر ممالک میں رائج نہیں، اور بعض فقہاء نے اسے طبی نگرانی سمیت ضوابط و شرائط کے ساتھ جائز قرار دیا؛ مؤنث تولیدی اعضاء کے کسی حصے کو چھونا جائز نہیں کیونکہ اس سے خواتین اور ان کی شادی شدہ زندگی کو نقصان ہے — یہ فعل شریعت میں حرام اور کرنے والا جرائم کا مرتکب ہے، اور اسلامی ممالک کی حکومتوں کے ان مظالم کے خاتمے کے اقدامات کی اکیڈمی حمایت کرتی ہے؛ اور یہاں مقررہ خفاض بین الاقوامی صحت کے اداروں بالخصوص عالمی ادارۂ صحت کی طرف سے ممنوع اور متنبہ کردہ مؤنث تولیدی اعضاء کی بریدگی کے اصطلاح میں داخل نہیں۔ اکیڈمی نے سفارش کی کہ عالمی ادارۂ صحت سے مؤنث تولیدی تشویہ کے موضوع کو مذہبی، سماجی اور طبی قیادت کی شرکت سے دوبارہ مطالعے کے لیے پیش کیا جائے تاکہ اس کی سمجھ اور مذہبی معلومات بہتر ہوں، اور جب خواتین کو خفاض کی ضرورت ہو تو ہسپتالوں کے معاصر طبی عملی کاروں سے استعانت ہو، اور اس کا اور جن اقسام کی جرم قرار پر اتفاق ہے ان کے فرق کی وضاحت ہو۔"
