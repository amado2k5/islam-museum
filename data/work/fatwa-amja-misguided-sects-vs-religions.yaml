label: { ar: "ضلال فرق الضلالة وأتباع الملل", en: "The deviation of misguided sects versus other religions", ur: "گمراہ فرقوں اور دیگر ادیان کا فرق", es: "La desviación de sectas descarriadas frente a otras religiones", fr: "La déviation des sectes égarées par rapport aux autres religions", tr: "Yanlış yönlendirilmiş grupların ve sıkıntının takipçilerinin yanlış yönlendirmesi", id: "Kesalahan dari kelompok yang tersesat dan pengikut kebosanan" }
summary:
  ar: "سأل سائل عن فتوى أصدرها شخص بغير علم في مسألة تتعلق بحكم فرق الضلالة وأتباع الملل الأخرى. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21865 بتاريخ 26 أغسطس 2007)⁩ أن ضلال فرق الضلالة ليس كضلال أتباع الملل الأخرى لأنهم لا يزالون من أهل القبلة في الجملة إلا من كان منهم منافقًا في الباطن أو من عرف عنه بعينه أنه تلبس بشيء من المكفرات اليقينية، وأن المتقرر عند أهل العلم أن إتباع الفرق الأخرى ليس حكمًا واحدًا يشملهم جميعًا بل التفصيل بينهم واجب، وعابت على من تجرأ على الفتوى بغير علم متسائلة ألم يطرق سمعه قول النبي إنما شفاء العي السؤال."
  en: "A questioner raised a ruling issued by one without knowledge touching the judgment of the misguided sects versus the followers of other religions. The site's sharia department (fatwa no. 21865, 26 August 2007) answered that the deviating sects' deviation is not like that of other religions' followers, for they remain of the qibla-people in general — except the inward hypocrite, or one specifically known to have engaged a certain nullifier; and scholars' settled position is that the followers of the other sects are not covered by one ruling — distinguishing among them is required; it faulted the man who dared a fatwa without knowledge: had the Prophet's 'the cure for incapacity is asking' not reached his ears? Recorded as AMJA's answer."
  ur: "ایک سائل نے بے علم فتویٰ پر سوال اٹھایا۔ شریعت شعبے ⁦(فتویٰ 21865، 26 اگست 2007)⁩ کے مطابق گمراہ فرقے اہل قبلہ میں شمار ہیں جب تک کوئی صریح ناقض ثابت نہ ہو؛ بے علم فتویٰ دینا مذموم ہے۔"
  es: "Un consultante planteó una opinión emitida por alguien sin conocimiento sobre el juicio de las sectas descarriadas frente a los seguidores de otras religiones. El departamento de sharia del sitio (fatwa n.° 21865, 26 de agosto de 2007) respondió que la desviación de las sectas no es como la de los seguidores de otras religiones, ya que en general pertenecen a la gente de la qibla, excepto el hipócrita interno o aquel que se sabe específicamente que ha participado en un anulador; y la posición establecida por los eruditos es que los seguidores de las otras sectas no están cubiertos por una sola opinión; es necesario distinguirlos; reprochó al hombre que se atrevió a emitir una fatwa sin conocimiento: ¿acaso no había escuchado las palabras del Profeta: «La cura para la incapacidad es pedir»? Registrado como respuesta de AMJA."
  fr: "Un internaute a soulevé une question concernant une fatwa émise par une personne ignorante, relative au jugement des sectes égarées par rapport aux adeptes des autres religions. Le département de la charia du site (fatwa n° 21865, 26 août 2007) a répondu que l'égarement des sectes déviantes diffère de celui des adeptes des autres religions, car elles demeurent, en général, des fidèles de la qibla – exception faite des hypocrites ou de ceux connus pour avoir eu recours à un certain gourou. La position établie des savants est que les adeptes des autres sectes ne sont pas soumis à une seule fatwa; une distinction s'impose. Le département a reproché à l'auteur de cette fatwa, émise sans connaissance du sujet, de ne pas avoir entendu le message du Prophète: « La prière est le remède à l'incapacité ». Cette réponse a été consignée dans le rapport d'AMJA."
  tr: "Bir soru soran, yanlış yönlendirme mezhebleri ve diğer mezheplerin takipçileri hakkında bilgisi olmayan bir kişinin verdiği fetva hakkında soru soruldu. Web sitesindeki Şeriat bölümü (26 Ağustos 2007 tarihli Fetva No. 21865), yanlış yönlendirme mezheblerinin yanlış yönlendirmesinin diğer mezhebin takipçilerine benzemediğini, çünkü genellikle kıblah halkı arasında kaldıklarını, içten içe münafık olanlar veya kesin bir meydan okuma eylemlerine karışmış olanlar dışında kaldıklarını yanıtladı. Alimler arasında yerleşik görüş, diğer mezhebleri takip etmenin hepsi için geçerli tek bir hüküm olmadığı, aralarında açıklamanın zorunlu olduğudur. Ayrıca, bilgisiz fetva vermeye cesaret edenleri eleştirerek, şöyle sorguladı: Peygamber'in sözleri kulaklarına ulaşmadı mı? Soru sadece bir çaredir."
  id: "Seorang penanya ditanya tentang fatwa yang dikeluarkan oleh seseorang tanpa pengetahuan mengenai aturan sekte yang salah dan pengikut sekte lain. Bagian Syariah di situs web (Fatwa No. 21865 tanggal 26 Agustus 2007) menjawab bahwa kesalahan dari sekte yang salah tidak sama dengan pengadilan pengikut sekte lain, karena umumnya mereka tetap berada di antara umat khidmat, kecuali bagi mereka yang munafik secara batin atau diketahui terlibat dalam beberapa tindakan yang menentang secara definitif. Pandangan yang mapan di kalangan ulama adalah bahwa mengikuti sekte lain bukanlah satu aturan tunggal yang berlaku untuk semuanya, tetapi penjelasan di antara mereka adalah wajib. Bagian itu juga mengkritik mereka yang berani mengeluarkan fatwa tanpa pengetahuan, mempertanyakan: Bukankah kata-kata Nabi sampai ke telinga mereka? Pertanyaan itu hanyalah obat."
