label: { ar: "ما يجب على المضحي إذا ضاعت أو ماتت أضحيته قبل يوم العيد", en: "What the sacrificer must do if his udhiyya is lost or dies before Eid", ur: "عید سے پہلے قربانی گم یا مر جائے تو کیا واجب ہے" }
summary:
  ar: "سائل سأل عن من اشترى أضحية ليذبحها يوم العيد فضاعت أو سرقت أو ماتت دون تفريط في الحفاظ عليها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20812)⁩ أنه لا حرج عليه في عدم قيامه بما فصّل الجواب من البدل على وجهه."
  en: "A questioner asked about one who bought an udhiyya to slaughter on Eid day and it was lost, stolen or died without negligence in guarding it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20812) answered that there is no blame on him — with the case of a replacement set out in the answer."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس کی قربانی عید کے دن سے پہلے گم چوری یا مر گئی بغیر اس کی کوتاہی کے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20812)⁩ نے جواب دیا کہ اس پر کوئی حرج نہیں اور بدل کا حکم جواب میں ہے۔"
