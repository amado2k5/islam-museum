id: work/fatwa-amja-women-read-quran-online
class: work
kind: fatwa
label: { ar: "قراءة القرآن دون مس المصحف", en: "Women reading Qur'an over the net — without touching the mushaf", ur: "خواتین کا قرآن پڑھنا — مصحف چھوئے بغیر", es: "Mujeres leyendo el Corán por internet, sin tocar el mushaf.", fr: "Des femmes lisent le Coran en ligne, sans toucher le mushaf." }
summary:
  ar: "سألت مجموعة سيدات يلتقين عبر النت لقراءة القرآن عن الحكم لمن كانت على غير طهارة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21950 بتاريخ 8 يوليو 2007)⁩ أنه لا بأس بقراءة القرآن بدون مس المصحف على الصحيح من أقوال أهل العلم وهو اختيار شيخ الإسلام ابن تيمية على ما فصّل الجواب."
  en: "A group of women meeting over the net to read the Qur'an asked about one not in purity. Dr. Salah al-Sawi (fatwa no. 21950, 8 July 2007) answered that there is no harm in reading the Qur'an without touching the mushaf — the soundest of the scholars' sayings and the choice of Shaykh al-Islam Ibn Taymiyya — as the answer details."
  ur: "خواتین بغیر طہارت قرآن پڑھیں؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21950، 8 جولائی 2007)⁩ کے مطابق مصحف چھوئے بغیر پڑھنا جائز — ابن تيميہ کا اختیار۔"
  es: "Un grupo de mujeres que se reunían por internet para leer el Corán preguntaron sobre la impureza ritual. El Dr. Salah al-Sawi (fatwa n.º 21950, 8 de julio de 2007) respondió que no hay inconveniente en leer el Corán sin tocar el mushaf, según la opinión más fidedigna de los eruditos y la elección del Shaykh al-Islam Ibn Taymiyya, como se detalla en la respuesta."
  fr: "Un groupe de femmes se réunissant en ligne pour lire le Coran a posé une question concernant la lecture du Coran sans contact avec le livre sacré (mushaf). Le Dr Salah al-Sawi (fatwa n° 21950, 8 juillet 2007) a répondu qu'il n'y a aucun mal à lire le Coran sans toucher le livre sacré – l'avis le plus sûr des savants et le choix du cheikh al-Islam Ibn Taymiyya – comme le précise la réponse."
