id: work/fatwa-dar-alifta-eg-zakat-paid-early-hijri-year
class: work
kind: fatwa
label: { ar: "حكم إخراج جزء من الزكاة مقدَّمًا في أول أيام السنة الهجرية", en: "Paying part of the zakat early at the start of the Hijri year", ur: "ہجری سال کے آغاز میں زکات کا حصہ پہلے نکالنا", es: "Pagar parte del zakat por adelantado al comienzo del año Hijri.", fr: "Versement anticipé d'une partie de la zakat au début de l'année hégirienne", tr: "Hicri yılının ilk gününde zekatın bir kısmının peşin ödenmesine karar verilmesi", id: "Keputusan tentang pembayaran sebagian zakat di muka pada hari pertama tahun Hijri" }
summary:
  ar: "سائل سأل عن إخراج جزء من الزكاة مقدمًا في أول أيام السنة الهجرية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21995)⁩ أنه يجوز إخراج جزء من الزكاة مقدمًا ما دام ذلك يحقق مصلحة الفقير والغني مع مراعاة الضوابط على ما فصّل الجواب."
  en: "A questioner asked about paying part of the zakat in advance at the start of the Hijri year. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21995) answered that paying a portion early is permitted as long as it serves the benefit of both poor and rich, with due controls — as the answer details."
  ur: "ایک سائل نے ہجری سال کے شروع میں زکات کا کچھ حصہ پہلے ادا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21995)⁩ نے جواب دیا کہ پہلے کچھ حصہ ادا کرنا جائز ہے بشرطیکہ اس سے فقیر اور مالدار دونوں کا مفاد ہو اور ضوابط کی رعایت ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el pago anticipado de parte del zakat al comienzo del año Hijri. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21995) respondió que el pago anticipado de una parte está permitido siempre que beneficie tanto a pobres como a ricos, con los controles pertinentes, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de verser une partie de la zakat par anticipation au début de l'année hégirienne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21995) a répondu que le versement anticipé d'une partie de la zakat est autorisé à condition qu'il profite à la fois aux pauvres et aux riches, et sous réserve des contrôles appropriés – comme le précise la réponse."
  tr: "Bir soru soran kişi, Hicri yılının ilk gününde zekatın bir kısmının peşin ödenmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21995), cevabında detaylandırılan kurallara uyularak hem fakirlerin hem de zenginlerin çıkarlarına hizmet ettiği sürece zekatın bir kısmının peşin ödenebileceğini söyledi."
  id: "Seorang penanya menanyakan tentang pembayaran sebagian zakat di muka pada hari pertama tahun Hijriah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21995) menjawab bahwa diperbolehkan membayar sebagian zakat di muka selama melayani kepentingan baik orang miskin maupun kaya, sambil mematuhi aturan yang dijelaskan dalam jawaban."
