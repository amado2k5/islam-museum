label: { ar: "اُس راہ پر ⁦(ألبوم جنيد جمشيد، 1999)⁩", en: "Us Rah Par", ur: "اُس راہ پر" }
summary:
  ar: "ثاني ألبومات مغني البوب الباكستاني جنيد جمشيد المنفردة، صدر سنة 1999 عن سوني بي إم جي بعد توقف فرقة فايتل ساينز، واستمر فيه تعاونه مع الكاتب شعيب منصور، ونجح نقديا وتجاريا؛ كتبت ذا إكسبرس تريبيون سنة 2017 أن أغنيته الرئيسة تنبئ بتحوله اللاحق من البوب إلى النعت."
  en: "The Pakistani pop singer Junaid Jamshed's second solo album, released in 1999 on Sony BMG after Vital Signs paused, continuing his work with the writer Shoaib Mansoor, and a critical and commercial success; The Express Tribune wrote in 2017 that its title song foreshadowed his later turn from pop to naat."
  ur: "پاکستانی پاپ گلوکار جنید جمشید کا دوسرا سولو البم، جو وائٹل سائنز کے وقفے کے بعد 1999 میں سونی بی ایم جی سے جاری ہوا اور جس میں شعیب منصور کے ساتھ ان کا تعاون جاری رہا؛ ایکسپریس ٹریبیون نے 2017 میں لکھا کہ اس کا عنوانی گیت ان کی بعد کی تبدیلی کا پیش خیمہ تھا۔"
