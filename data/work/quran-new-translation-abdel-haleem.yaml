summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها محمد عبد الحليم سعيد، أستاذ الدراسات الإسلامية في كلية الدراسات الشرقية والأفريقية بجامعة لندن، ونشرتها مطبعة جامعة أكسفورد سنة 2004 ثم في سلسلة «كلاسيكيات أكسفورد العالمية»؛ يصفها الناشر بأنها بإنجليزية واضحة خالية من العبارات العتيقة، تميّز الخطاب الموجّه إلى النبي، وتضيف الفقرات وعلامات الترقيم، وتضع أرقام الآيات صغيرة فوق السطر، ومعها مقدمة في تاريخ الوحي والجمع والأسلوب وقضايا التفسير، وحواشٍ تشرح الإشارات، وفهرس موضوعي."
  en: "An English rendering of the meanings of the Qur'an by Muhammad A. S. Abdel Haleem, professor of Islamic studies at SOAS, University of London, published by Oxford University Press in 2004 and then in Oxford World's Classics; the publisher describes it as plain modern English free of archaisms, identifying the dialogue addressed to the Prophet, adding paragraphing and punctuation and setting verse numbers in small superscript, with an introduction on the revelation, compilation, style and questions of interpretation, notes explaining allusions, and a thematic index."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از محمد عبد الحلیم سعید، سواس، جامعہ لندن میں اسلامیات کے پروفیسر؛ آکسفورڈ یونیورسٹی پریس نے 2004 میں اور پھر «آکسفورڈ ورلڈز کلاسکس» میں شائع کیا؛ ناشر کے بقول یہ قدامت سے پاک سادہ جدید انگریزی میں ہے، نبی سے خطاب کو نمایاں کرتا ہے، پیراگراف اور رموزِ اوقاف شامل کرتا ہے اور آیات کے نمبر چھوٹے بالائی حروف میں دیتا ہے؛ ساتھ میں وحی، جمع، اسلوب اور تفسیری مسائل پر مقدمہ، اشارات کی وضاحت کرنے والے حواشی اور موضوعاتی اشاریہ ہے۔"
