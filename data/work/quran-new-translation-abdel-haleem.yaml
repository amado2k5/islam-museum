label: { ar: "القرآن: ترجمة جديدة ⁦(محمد عبد الحليم)⁩", en: "The Qur'an: A New Translation (Abdel Haleem)", ur: "دی قرآن: نیا ترجمہ ⁦(محمد عبد الحلیم)⁩", es: "El Corán: Una nueva traducción (Abdel Haleem)", fr: "Le Coran: une nouvelle traduction (Abdel Haleem)", tr: "Kur'an: Yeni Bir Çeviri (Mohamed Abdel Halim)", id: "Al-Quran: Terjemahan Baru (Mohamed Abdel Halim)" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها محمد عبد الحليم سعيد، أستاذ الدراسات الإسلامية في كلية الدراسات الشرقية والأفريقية بجامعة لندن، ونشرتها مطبعة جامعة أكسفورد سنة 2004 ثم في سلسلة «كلاسيكيات أكسفورد العالمية»؛ يصفها الناشر بأنها بإنجليزية واضحة خالية من العبارات العتيقة، تميّز الخطاب الموجّه إلى النبي، وتضيف الفقرات وعلامات الترقيم، وتضع أرقام الآيات صغيرة فوق السطر، ومعها مقدمة في تاريخ الوحي والجمع والأسلوب وقضايا التفسير، وحواشٍ تشرح الإشارات، وفهرس موضوعي."
  en: "An English rendering of the meanings of the Qur'an by Muhammad A. S. Abdel Haleem, professor of Islamic studies at SOAS, University of London, published by Oxford University Press in 2004 and then in Oxford World's Classics; the publisher describes it as plain modern English free of archaisms, identifying the dialogue addressed to the Prophet, adding paragraphing and punctuation and setting verse numbers in small superscript, with an introduction on the revelation, compilation, style and questions of interpretation, notes explaining allusions, and a thematic index."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از محمد عبد الحلیم سعید، سواس، جامعہ لندن میں اسلامیات کے پروفیسر؛ آکسفورڈ یونیورسٹی پریس نے 2004 میں اور پھر «آکسفورڈ ورلڈز کلاسکس» میں شائع کیا؛ ناشر کے بقول یہ قدامت سے پاک سادہ جدید انگریزی میں ہے، نبی سے خطاب کو نمایاں کرتا ہے، پیراگراف اور رموزِ اوقاف شامل کرتا ہے اور آیات کے نمبر چھوٹے بالائی حروف میں دیتا ہے؛ ساتھ میں وحی، جمع، اسلوب اور تفسیری مسائل پر مقدمہ، اشارات کی وضاحت کرنے والے حواشی اور موضوعاتی اشاریہ ہے۔"
  es: "Una traducción al inglés de los significados del Corán realizada por Muhammad AS Abdel Haleem, profesor de estudios islámicos en SOAS, Universidad de Londres, publicada por Oxford University Press en 2004 y posteriormente en Oxford World's Classics; la editorial la describe como un inglés moderno y sencillo, libre de arcaísmos, que identifica el diálogo dirigido al Profeta, añade párrafos y puntuación, y coloca los números de los versículos en superíndice pequeño, con una introducción sobre la revelación, la compilación, el estilo y las cuestiones de interpretación, notas que explican las alusiones y un índice temático."
  fr: "Une traduction anglaise des significations du Coran par Muhammad AS Abdel Haleem, professeur d'études islamiques à SOAS, Université de Londres, publiée par Oxford University Press en 2004 puis dans Oxford World's Classics; l'éditeur la décrit comme un anglais moderne simple, exempt d'archaïsmes, identifiant le dialogue adressé au Prophète, ajoutant des paragraphes et de la ponctuation et plaçant les numéros de versets en petit exposant, avec une introduction sur la révélation, la compilation, le style et les questions d'interprétation, des notes expliquant les allusions et un index thématique."
  tr: "Kur'an'ın anlamlarının İngilizce çevirisi, Londra Üniversitesi Doğu ve Afrika Çalışmaları Okulu'nda İslam Çalışmaları Profesörü Mohamed Abdel Halim Said tarafından hazırlanmış, 2004 yılında Oxford University Press tarafından yayımlanmış, o zamanlar \"Oxford World Classics\" serisinde yer almıştır; yayınevi eskimiş ifadelerden arındırılmış açık İngilizce olarak tanımlamaktadır; Peygamber'e hitap edilen hitabı ayırt ederek, paragraflar ve noktalama işaretleri eklemiş, satırın üstüne küçük ayet numaraları yerleştirmiş, vahiy tarihine giriş, koleksiyon, üslup ve yorumlama konularına giriş, referansları açıklayan dipnotlar ve objektif bir dizin içermektedir."
  id: "Terjemahan bahasa Inggris dari makna Al-Qur'an yang disiapkan oleh Mohamed Abdel Halim Said, Profesor Studi Islam di School of Oriental and African Studies di University of London, diterbitkan oleh Oxford University Press pada tahun 2004, kemudian dalam seri \"Oxford World Classics\"; penerbit menggambarkannya sebagai bahasa Inggris yang jelas tanpa frasa usang, membedakan alamat yang ditujukan kepada Nabi, menambahkan paragraf dan tanda baca, menempatkan angka ayat kecil di atas garis, bersama dengan pengantar sejarah wahyu, pengumpulan, gaya, dan isu interpretasi, catatan kaki yang menjelaskan referensi, serta indeks objektif."
