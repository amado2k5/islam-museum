id: work/fatwa-amja-discharge-before-period
class: work
kind: fatwa
label: { ar: "دم قبل الدورة", en: "Discharge after wudu and blood before the period", ur: "وضو کے بعد خارجی اور عادت سے پہلے خون", es: "Secreción después del wudu y sangrado antes de la menstruación.", fr: "Écoulement après les ablutions et saignements avant les règles" }
summary:
  ar: "سألت امرأة هل عليها إعادة الوضوء إذا نزل شيء بعد الوضوء وعن دم قبل الدورة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76812 بتاريخ 9 نوفمبر 2008)⁩ أن ما يخرج من السبيلين يوجب الوضوء أيًا كان الخلاف حول طهارة بعضه أو نجاسته والدم الذي ينزل قبيل الدورة إذا كان كالمقدمات لها فإنه يلحق بها ويأخذ حكمها ويعرف ذلك بعلاماته على ما فصّل الجواب."
  en: "A woman asked whether she must redo wudu when something descends after it, and about blood before the period. Dr. Salah al-Sawi (fatwa no. 76812, 9 November 2008) answered that whatever exits the two passages obliges wudu whatever the disagreement over some of it being pure or impure; blood descending just before the period, where it is as heralding it, joins it and takes its ruling — known by its signs — as the answer details."
  ur: "وضو کے بعد خارجی اور عادت سے پہلے خون؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76812، 9 نومبر 2008)⁩ کے مطابق خارجی وضو طلب؛ مقدمہ خون حیض کا حکم رکھتا ہے۔"
  es: "Una mujer preguntó si debía repetir la ablución cuando algo descendía después de ella, y sobre la presencia de sangre antes de la menstruación. El Dr. Salah al-Sawi (fatwa n.° 76812, 9 de noviembre de 2008) respondió que todo lo que sale de los dos pasajes obliga a realizar la ablución, independientemente de la controversia sobre si parte de ella es pura o impura; la sangre que desciende justo antes de la menstruación, donde actúa como un presagio, se une a ella y se rige por sus normas —conocidas por sus signos— como se detalla en la respuesta."
  fr: "Une femme a demandé si elle devait refaire ses ablutions (wudu) en cas de saignement après les règles, et concernant les saignements avant les menstruations. Le Dr Salah al-Sawi (fatwa n° 76812, 9 novembre 2008) a répondu que tout saignement survenant après les règles nécessite de refaire les ablutions, indépendamment de toute divergence quant à sa pureté ou son impureté; les saignements survenant juste avant les règles, les annonçant, s’y ajoutent et sont soumis à la même règle – connue par ses signes –, comme le précise la réponse."
