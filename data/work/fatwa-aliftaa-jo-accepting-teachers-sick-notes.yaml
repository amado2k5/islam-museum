id: work/fatwa-aliftaa-jo-accepting-teachers-sick-notes
class: work
kind: fatwa
label: { ar: "قبول مدير المدرسة للأعذار الطبية والعرضية", en: "A head teacher accepting sick notes and casual-leave excuses", ur: "اسکول کے پرنسپل کا طبی اور ہنگامی رخصت کے عذر قبول کرنا" }
summary:
  ar: "سؤال عن إثم مدير المدرسة إذا قبل أعذار المعلمين الطبية أو العرضية الموثقة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا إثم عليه، لأنه يتصرف ضمن صلاحياته. أجابت الدائرة بأنه لا إثم على المدير إذا قبل العذر الموثق، مرضيًا كان أو عرضيًا، لأنه مفوض الصلاحيات من الوزارة، والإجازة العرضية من اختصاصه، والأنظمة تكتفي فيها بأن يكون الغياب مبررًا بين المدير والمعلم مع الإثبات. ودعت المدير إلى ألا يتعنت في الأعذار المبررة الموثقة ولا يشق على المعلمين، مستشهدة بحديث في الدعاء على من شق على الأمة وللذي رفق بها، وبشرح النووي له. وقالت في المقابل إنه لا يجوز للمعلم ولا لغيره أخذ إجازة بغير وجه حق ولا سبب، لأن ذلك من الكذب المحرم. وأضافت أن الطبيب الذي يمنح الموظف إجازة مرضية بلا سبب يستدعيها آثم وغاش للمسلمين."
  en: "A question on whether a head teacher sins by accepting teachers' documented sick notes or casual-leave excuses, in which Jordan's General Iftaa Department answered that he does not, since he is acting within his powers. The Department answered that the head commits no sin in accepting a documented excuse, whether medical or casual, because the ministry has delegated the authority to him, casual leave falls within his remit, and the regulations require only that the absence be justified between head and teacher with proof attached. It urged heads not to be obstinate over justified, documented excuses or to make things hard for teachers, citing a hadith that prays against whoever makes things hard for the community and for whoever is gentle with it, with al-Nawawi's commentary on it. Conversely, it said that neither a teacher nor anyone else may take leave without right or reason, since that is forbidden lying. It added that a doctor who gives an employee sick leave without a medical reason sins and deceives the Muslims."
  ur: "اس بارے میں سوال کہ کیا اسکول کا پرنسپل اساتذہ کے دستاویزی طبی یا ہنگامی رخصت کے عذر قبول کر کے گناہ گار ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نہیں، کیونکہ وہ اپنے اختیارات کے اندر عمل کر رہا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ دستاویزی عذر، طبی ہو یا ہنگامی، قبول کرنے پر سربراہ پر کوئی گناہ نہیں، کیونکہ وزارت نے اسے اختیار سونپا ہے، ہنگامی رخصت اسی کے دائرۂ اختیار میں ہے، اور ضوابط میں صرف اتنا مطلوب ہے کہ ثبوت کے ساتھ غیر حاضری سربراہ اور استاد کے درمیان جائز قرار پائے۔ اس نے سربراہوں کو تلقین کی کہ جائز اور دستاویزی عذر میں ہٹ دھرمی نہ کریں اور اساتذہ پر سختی نہ کریں، اور اس حدیث سے استدلال کیا جس میں امت پر سختی کرنے والے کے خلاف اور اس سے نرمی کرنے والے کے حق میں دعا ہے، اور اس پر نووی کی شرح سے۔ اس کے برعکس اس نے کہا کہ استاد یا کسی اور کے لیے بغیر حق اور بغیر سبب رخصت لینا جائز نہیں، کیونکہ یہ حرام جھوٹ ہے۔ اس نے مزید کہا کہ جو ڈاکٹر بغیر طبی سبب کے ملازم کو بیماری کی رخصت دے وہ گناہ گار اور مسلمانوں کو دھوکا دینے والا ہے۔"
