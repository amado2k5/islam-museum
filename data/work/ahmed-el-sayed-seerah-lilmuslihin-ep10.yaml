class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 10: المسلمون في الحبشة"
  en: "The Prophetic Biography for Reformers, episode 10: The Muslims in Abyssinia"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 10: حبشہ میں مسلمان"
  fr: "La biographie prophétique pour les réformateurs, épisode 10 : Les musulmans en Abyssinie"
  es: "La biografía profética para los reformadores, episodio 10: Los musulmanes en Abisinia"
summary:
  ar: "يبقى المجلس العاشر من سلسلة السيرة النبوية للمصلحين في الحبشة، ويقوم على رواية واحدة طويلة عن أم سلمة: وفد قريش بهداياه إلى النجاشي، وعرض جعفر بن أبي طالب للإسلام وجوابه عن عيسى، ورفض النجاشي تسليم المهاجرين، ثم الصدام مع من نازعه على عرشه. ثم يستخلص المتحدث منها دروسا للمصلحين: وضوح الدين، وتجدد الابتلاءات، ومتانة القاعدة المعرفية، واجتماع الكلمة، وعدم لي عنق الحق، وقوة البيان."
  en: "The tenth session of the series on the Prophetic biography for reformers stays in Abyssinia and is built around one long report from Umm Salama: the Quraysh embassy with gifts to the Negus, Jafar ibn Abi Talib's account of Islam and his answer about Jesus, the Negus's refusal to hand the emigrants over, and the clash with a rival to his throne. The speaker then draws lessons from it for reformers: clarity about the faith, renewed trials, a firm foundation of knowledge, unity, not bending the truth, and the power of clear expression."
  ur: "اصلاح کرنے والوں کے لیے سیرت نبوی کے سلسلے کی دسویں مجلس حبشہ میں ہی رہتی ہے اور ام سلمہ کی ایک طویل روایت پر قائم ہے: نجاشی کے پاس قریش کا تحائف کے ساتھ وفد، جعفر بن ابی طالب کا اسلام کا بیان اور عیسیٰ کے بارے میں ان کا جواب، نجاشی کا مہاجرین کو حوالے کرنے سے انکار، اور تخت کے ایک حریف سے ٹکراؤ۔ پھر مقرر اس سے اصلاح کاروں کے لیے سبق نکالتا ہے: دین کی وضاحت، آزمائشوں کی تجدید، علمی بنیاد کی مضبوطی، اتحاد، حق کو نہ موڑنا اور واضح بیان کی طاقت۔"
  fr: "La dixième séance de la série sur la biographie prophétique pour les réformateurs reste en Abyssinie et s'organise autour d'un long récit d'Umm Salama : l'ambassade de Quraysh avec des cadeaux auprès du Négus, l'exposé de l'islam par Jafar ibn Abi Talib et sa réponse sur Jésus, le refus du Négus de livrer les émigrés, puis l'affrontement avec un rival à son trône. Le conférencier en tire ensuite des leçons pour les réformateurs : la clarté de la foi, les épreuves renouvelées, une base solide de savoir, l'unité, ne pas plier la vérité et la force d'une expression claire."
  es: "La décima sesión de la serie sobre la biografía profética para los reformadores sigue en Abisinia y se construye en torno a un largo relato de Umm Salama: la embajada de Quraysh con regalos ante el Negus, la exposición del islam por Jafar ibn Abi Talib y su respuesta sobre Jesús, la negativa del Negus a entregar a los emigrados y el enfrentamiento con un rival a su trono. El conferenciante extrae después lecciones para los reformadores: la claridad de la fe, las pruebas renovadas, una base sólida de conocimiento, la unidad, no doblegar la verdad y la fuerza de una expresión clara."
