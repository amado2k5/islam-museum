label: { ar: "تجارب الأمم", en: "Tajarib al-Umam (The Experiences of the Nations)", ur: "تجارب الامم" }
summary:
  ar: "تاريخ عام لأبي علي مسكويه ⁦(ت 421هـ)⁩ يبدأ بما بعد الطوفان وينتهي بسنة 369هـ، جعل غايته استخراج «التجارب» النافعة في السياسة وتدبير الملك، وترك ما لا تُستفاد منه تجربة {cite:tajarib-al-umam-surush-v1 p.48} {cite:tajarib-al-umam-surush-v1 p.49} {cite:tajarib-al-umam-surush-v1 p.34}. عوّل فيه على الطبري إلى سنة 295هـ، وجعل ما بعد سنة 340هـ مما شاهده أو سمعه من ابن العميد والمهلبي وشيوخ عصره، فصار مصدراً أساسياً لتاريخ البويهيين {cite:tajarib-al-umam-surush-v1 p.31} {cite:tajarib-al-umam-surush-v1 p.34}."
  en: "A universal history by Abu Ali Miskawayh (d. 421 AH) running from after the Flood to 369 AH, whose stated aim is to draw out 'experiences' useful in politics and the conduct of rule, leaving aside what yields no lesson. He relied on al-Tabari up to 295 AH, and for the years after 340 on what he witnessed or heard from Ibn al-Amid, al-Muhallabi and the elders of his day, making it a primary source for Buyid history."
