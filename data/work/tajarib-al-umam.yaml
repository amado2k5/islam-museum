label: { ar: "تجارب الأمم", en: "Tajarib al-Umam (The Experiences of the Nations)", ur: "تجارب الامم", es: "Tajarib al-Umam (Las experiencias de las naciones)", fr: "Tajarib al-Umam (Les expériences des nations)" }
summary:
  ar: "تاريخ عام لأبي علي مسكويه ⁦(ت 421هـ)⁩ يبدأ بما بعد الطوفان وينتهي بسنة 369هـ، جعل غايته استخراج «التجارب» النافعة في السياسة وتدبير الملك، وترك ما لا تُستفاد منه تجربة {cite:tajarib-al-umam-surush-v1 p.48} {cite:tajarib-al-umam-surush-v1 p.49} {cite:tajarib-al-umam-surush-v1 p.34}. عوّل فيه على الطبري إلى سنة 295هـ، وجعل ما بعد سنة 340هـ مما شاهده أو سمعه من ابن العميد والمهلبي وشيوخ عصره، فصار مصدراً أساسياً لتاريخ البويهيين {cite:tajarib-al-umam-surush-v1 p.31} {cite:tajarib-al-umam-surush-v1 p.34}."
  en: "A universal history by Abu Ali Miskawayh (d. 421 AH) running from after the Flood to 369 AH, whose stated aim is to draw out 'experiences' useful in politics and the conduct of rule, leaving aside what yields no lesson. He relied on al-Tabari up to 295 AH, and for the years after 340 on what he witnessed or heard from Ibn al-Amid, al-Muhallabi and the elders of his day, making it a primary source for Buyid history."
  es: "Historia universal de Abu Ali Miskawayh (fallecido en el año 421 de la Hégira), que abarca desde después del Diluvio hasta el año 369 de la Hégira, cuyo objetivo declarado es extraer experiencias útiles para la política y la administración del gobierno, dejando de lado aquello que no aporta ninguna enseñanza. Se basó en al-Tabari hasta el año 295 de la Hégira, y para los años posteriores al 340, en lo que presenció o escuchó de Ibn al-Amid, al-Muhallabi y los ancianos de su época, convirtiéndola en una fuente primaria para la historia buyí."
  fr: "Une histoire universelle d'Abu Ali Miskawayh (mort en 421 AH) couvrant la période allant de l'après-Déluge à 369 AH, dont l'objectif déclaré est de tirer des enseignements utiles en politique et dans la conduite du gouvernement, en écartant ce qui ne présente aucun intérêt. Il s'appuie sur al-Tabari jusqu'en 295 AH, et pour les années postérieures à 340 AH, sur les observations et les récits d'Ibn al-Amid, d'al-Muhallabi et des anciens de son époque, ce qui en fait une source primordiale pour l'histoire bouyide."
  ur: "ابو علی مسکاوی ⁦(متوفی 421 ہجری)⁩ کی ایک عالمگیر تاریخ جو سیلاب کے بعد سے 369 ہجری تک چل رہی ہے، جس کا بیان کردہ مقصد سیاست اور حکمرانی کے طرز عمل میں مفید 'تجربات' نکالنا ہے، جس سے کوئی سبق حاصل نہیں ہوتا۔ اس نے 295 ہجری تک الطبری پر انحصار کیا، اور 340 کے بعد کے سالوں تک اس نے ابن العمید، المحلبی اور اپنے دور کے بزرگوں سے جو کچھ دیکھا یا سنا اس پر انحصار کیا، اور اسے بیع کی تاریخ کا بنیادی ماخذ بنا۔"
