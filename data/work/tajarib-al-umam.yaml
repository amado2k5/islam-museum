structure: "Author's preface (vol. 1 pp. 47-50); history of the nations after the Flood, the Persian kings from the Pishdadids (with the Testament of Ardashir and Anushirvan's account of his own conduct), then Islamic history year by year; vol. 6 covers 327-369 AH. In the Imami edition: 6 parts following the Aya Sofya manuscript's division, with 43 pages moved from part 2 to complete the pre-Umayyad period in part 1; vol. 7 the dhayl (Abu Shuja al-Rudhrawari's continuation and Hilal al-Sabi's history) and appendix; vol. 8 indexes. Title also found in the manuscripts as 'Tajarib al-umam wa-awaqib al-himam'."
