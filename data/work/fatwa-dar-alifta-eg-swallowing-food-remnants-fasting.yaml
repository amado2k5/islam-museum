class: work
kind: fatwa
label: { ar: "أثر ابتلاع الصائم بقايا الطعام التي بين أسنانه على صيامه", en: "Does swallowing food remnants between the teeth break the fast?", ur: "دانتوں میں اٹکا کھانا نگلنے کا روزے پر اثر", es: "¿Tragar restos de comida entre los dientes rompe el ayuno?" }
summary:
  ar: "سائل سأل عن أثر ابتلاع الصائم بقايا الطعام التي بين أسنانه على صيامه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21748)⁩ أن الصائم لا يفطر بما يجري به ريقه من بقايا طعام قليل لا يمكنه الاحتراز عنه وإخراجه من فمه على ما فصّل الجواب."
  en: "A questioner asked about the effect of a faster swallowing food remnants between his teeth. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21748) answered that the fast is not broken by the little food remnants carried down by saliva that he cannot guard against or remove from his mouth — as the answer details."
  ur: "ایک سائل نے دانتوں میں اٹکی ہوئی تھوڑی سی خوراک نگل جانے کا روزے پر اثر پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21748)⁩ نے جواب دیا کہ رال کے ساتھ اتنی تھوڑی باقیات نگل جانے سے روزہ نہیں ٹوٹتا جن سے بچا اور نکالا نہ جا سکے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el efecto de tragar más rápido y dejar restos de comida entre los dientes. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21748) respondió que el ayuno no se rompe por los pequeños restos de comida que quedan en la boca, arrastrados por la saliva, que no puede evitar o eliminar, como se detalla en la respuesta."
