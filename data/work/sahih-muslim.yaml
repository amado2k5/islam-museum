education:
  did_you_know:
    ar: "«المسند الصحيح المختصر بنقل العدل عن العدل» لأبي الحسين مسلم النيسابوري؛ اشتهر بجمعه طرق الحديث الواحد في موضع واحد وبمقدمته التأسيسية في علم المصطلح."
    en: "Muslim al-Naysaburi's 'abridged authentic musnad through the transmission of the trustworthy from the trustworthy' is famed for gathering every chain of one hadith in a single place — and for a prologue that founded the science of hadith terminology."
    ur: "مسلم نیشاپوری کی «ثقہ سے ثقہ کی روایت کے ساتھ مختصر صحیح مسند» اس شہرت کی حامل ہے کہ ایک حدیث کی ساری سندیں ایک جگہ جمع کیں — اور اس کا دیباچہ علمِ مصطلح کی بنیاد بنا۔"
    sources: [source/sahih-muslim, source/encyclopaedia-of-islam-2]
class: work
