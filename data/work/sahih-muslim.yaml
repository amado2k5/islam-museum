summary:
  ar: "المسند الصحيح المختصر بنقل العدل عن العدل إلى رسول الله لمسلم بن الحجاج القشيري النيسابوري (ت 261هـ): ثاني أشهر كتب الحديث، اشتهر بجمعه طرق الحديث الواحد في موضع واحد وبمقدمته في المصطلح التي صارت نصاً تأسيسياً في علم الحديث."
  en: "The Musnad al-Sahih of Muslim ibn al-Hajjaj al-Naysaburi (d. 261 AH): the second most celebrated hadith collection, famed for gathering the variant transmissions of each report in one place and for its introductory essay that became a founding text of hadith method."
