label: { ar: "صحيح مسلم", en: "Sahih Muslim" }
summary:
  ar: "المسند الصحيح المختصر بنقل العدل عن العدل إلى رسول الله لمسلم بن الحجاج القشيري النيسابوري ⁦(ت 261هـ)⁩: ثاني أشهر كتب الحديث، اشتهر بجمعه طرق الحديث الواحد في موضع واحد وبمقدمته في المصطلح التي صارت نصاً تأسيسياً في علم الحديث. وتذكر دائرة المعارف الإسلامية أن إجماع أهل الحديث من السنة يجعله مع صحيح البخاري أوثق مجموعتين، وأن ترتيب أبوابه يجعله، في رأي كاتب المقال، أنفع الكتب الستة للمؤرخين المحدثين."
  en: "The Musnad al-Sahih of Muslim ibn al-Hajjaj al-Naysaburi (d. 261 AH): the second most celebrated hadith collection, famed for gathering the variant transmissions of each report in one place and for its introductory essay that became a founding text of hadith method. The Encyclopaedia of Islam reports that the consensus of Sunni hadith experts ranks it with al-Bukhari's Sahih as the most reliable collection, and its author judges the chapter arrangement to make it the most useful of the Six Books for modern historians."
  ur: "مسلم بن الحجاج نیشاپوری ⁦(وفات 261ھ)⁩ کی «المسند الصحیح»: حدیث کی دوسری مشہور ترین کتاب، جو ایک حدیث کے سب طرق ایک جگہ جمع کرنے اور اپنے مقدمے کے لیے مشہور ہے جو علمِ حدیث کا بنیادی متن بنا۔ دائرۃ المعارف الاسلامیہ بتاتا ہے کہ سنی محدثین کا اجماع اسے بخاری کی صحیح کے ساتھ سب سے معتبر مجموعہ مانتا ہے، اور مضمون نگار کی رائے میں ابواب کی ترتیب اسے جدید مؤرخین کے لیے کتبِ ستہ میں سب سے مفید بناتی ہے۔"
