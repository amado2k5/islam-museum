label:
  ar: "إرشاد الفحول إلى تحقيق الحق من علم الأصول"
  en: "Irshad al-Fuhul ila Tahqiq al-Haqq min Ilm al-Usul"
  ur: "ارشاد الفحول الی تحقیق الحق من علم الاصول"
summary:
  ar: "كتاب في أصول الفقه لمحمد بن علي الشوكاني، فرغ منه يوم الأربعاء 4 محرم 1231هـ، رتّبه على مقدمة وسبعة مقاصد ⁦(الكتاب، والسنة، والإجماع، والأوامر والنواهي والعموم والخصوص وما يتصل بها، والقياس والاستدلال، والاجتهاد والتقليد، والتعادل والترجيح)⁩ وخاتمة؛ يحكي فيه أقوال الأصوليين ثم يرجّح ما يراه الحق بالدليل، وينكر فيه التقليد ويرى أن الاجتهاد ميسر للمتأخرين. {cite:irshad-al-fuhul-dar-al-fikr p.5} {cite:irshad-al-fuhul-dar-al-fikr p.289} {cite:irshad-al-fuhul-dar-al-fikr p.291}"
  en: "A work on the principles of jurisprudence (usul al-fiqh) by Muhammad ibn Ali al-Shawkani, finished on Wednesday 4 Muharram 1231 AH (December 1815), arranged in an introduction, seven aims (the Book, the Sunna, consensus, commands, prohibitions, the general and the particular and related topics, analogy and inference, independent reasoning and imitation, and the weighing of conflicting proofs) and a conclusion; it reports the positions of the usul scholars and then argues for what the author holds to be right on the evidence, rejecting imitation (taqlid) and holding that independent reasoning is easier for later scholars."
  ur: "محمد بن علی شوکانی کی اصولِ فقہ پر کتاب، جو انہوں نے بدھ 4 محرم 1231ھ (دسمبر 1815ء) کو مکمل کی؛ ایک مقدمہ، سات مقاصد (کتاب، سنت، اجماع، اوامر و نواہی اور عموم و خصوص وغیرہ، قیاس و استدلال، اجتہاد و تقلید، تعادل و ترجیح) اور ایک خاتمے پر مرتب؛ اس میں وہ اصولیوں کے اقوال نقل کر کے دلیل کی بنیاد پر اپنی ترجیح بیان کرتے ہیں، تقلید کا انکار کرتے ہیں اور کہتے ہیں کہ متأخرین کے لیے اجتہاد آسان ہو گیا ہے۔"
