summary:
  ar: "كتاب بالأردية لسيد محمد سليم ⁦(نُشر 2001م)⁩ في تاريخ الكتابة والخط العربي ومدارسه، يختص بتوسعه في الخطاطين في الهند وباكستان {cite:salim-tarikh-khatt-o-khattatin-2001 p. 9}."
  en: "Urdu book by Syed Muhammad Salim (published 2001) on the history of writing and of Arabic-script calligraphy and its schools, notable for its wide coverage of calligraphers in India and Pakistan {cite:salim-tarikh-khatt-o-khattatin-2001 p. 9}."
  ur: "سید محمد سلیم کی اردو کتاب ⁦(اشاعت 2001ء)⁩ جو کتابت اور عربی رسم الخط کی خطاطی اور اس کے دبستانوں کی تاریخ ہے، اور ہندوستان و پاکستان کے خطاطوں کے وسیع بیان کی وجہ سے ممتاز ہے {cite:salim-tarikh-khatt-o-khattatin-2001 p. 9}۔"
  es: "Libro en urdu de Syed Muhammad Salim (publicado en 2001) sobre la historia de la escritura y de la caligrafía en escritura árabe y sus escuelas, notable por su amplia cobertura de calígrafos en India y Pakistán {cite:salim-tarikh-khatt-o-khattatin-2001 p. 9}."
  fr: "Livre en ourdou de Syed Muhammad Salim (publié en 2001) sur l'histoire de l'écriture et de la calligraphie en caractères arabes et de ses écoles, remarquable pour sa large couverture des calligraphes en Inde et au Pakistan {cite:salim-tarikh-khatt-o-khattatin-2001 p. 9}."
  tr: "Sayyid Muhammad Salim tarafından Urduca bir kitap (2001'de yayımlandı), Arap yazının, hat sanatının ve okullarının tarihini konu alır; bu kitap Hindistan ve Pakistan'daki hattatlar arasında yaygınlaşmasına odaklanır {cite:salim-history-khatt-o-khattatin-2001, s. 9}."
  id: "Sebuah buku dalam bahasa Urdu oleh Sayyid Muhammad Salim (diterbitkan 2001) tentang sejarah penulisan Arab, kaligrafi, dan sekolah-sekolahnya, yang mengkhususkan diri dalam perluasan di kalangan kaligrafer di India dan Pakistan {cite:salim-history-khatt-o-khattatin-2001, hlm. 9}."
