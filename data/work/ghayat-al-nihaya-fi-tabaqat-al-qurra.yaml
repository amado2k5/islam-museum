label: { ar: "غاية النهاية في أسماء رجال القراءات ⁦(طبقات القراء)⁩", en: "Ghayat al-Nihaya fi Asma' Rijal al-Qira'at (Tabaqat al-Qurra')", ur: "غایۃ النہایہ فی اسماء رجال القراءات ⁦(طبقات القراء)⁩", tr: "Okuma Adamlarının Adındaki Nihai Amaç (Tebaqat al-Qurra'at)", id: "Tujuan Tertinggi dalam Nama-nama Orang-orang Bacaan (Tabaqat al-Qurra'at)" }
summary:
  ar: "كتاب ابن الجزري في تراجم رجال القراءات «أولي الرواية والدراية»، ألّفه ليعرَف حال رواة القراءات كما يُعرف حال رجال الحديث، إذ صحة السند ركن من أركان القراءة؛ ويعدّه في مصنفاته مع «طبقات القراء» الكبرى والصغرى، وتحيل إليه حواشي طبعة «الإتقان» المحققة في تراجم القراء {cite:nashr-dahman-damascus-1345-v1 p. 203} {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:itqan-suyuti p. 486}."
  en: "Ibn al-Jazari's biographical dictionary of the men of the readings, 'those of transmission and understanding', written so that the state of the narrators of the readings could be known as that of hadith narrators is, since a sound chain is a pillar of a valid reading; he lists it among his works beside the larger and smaller 'classes of readers', and the notes of the edited Itqan send readers to it for biographies of the readers {cite:nashr-dahman-damascus-1345-v1 p. 203} {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:itqan-suyuti p. 486}."
  ur: "ابن الجزری کی قراءات کے رجال کے تراجم کی کتاب، «اولی الروایہ والدرایہ»، اس لیے لکھی گئی کہ قراءات کے راویوں کا حال اسی طرح معلوم ہو جیسے محدثین کے رجال کا، کیونکہ صحتِ سند قراءت کا ایک رکن ہے؛ وہ اسے اپنی تصانیف میں «طبقات القراء» کبریٰ و صغریٰ کے ساتھ گنتے ہیں، اور «الاتقان» کے محقق ایڈیشن کے حواشی قراء کے تراجم کے لیے اس کا حوالہ دیتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 203} {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:itqan-suyuti p. 486}۔"
  es: "El diccionario biográfico de Ibn al-Jazari sobre los hombres de las lecturas, 'aquellos de transmisión y comprensión', escrito para que el estado de los narradores de las lecturas pudiera conocerse como el de los narradores de hadices, puesto que una cadena sólida es un pilar de una lectura válida; lo enumera entre sus obras junto a las 'clases de lectores' más grandes y más pequeñas, y las notas del Itqan editado remiten a los lectores a él para las biografías de los lectores {cite:nashr-dahman-damascus-1345-v1 p. 203} {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:itqan-suyuti p. 486}."
  fr: "Le dictionnaire biographique d'Ibn al-Jazari sur les hommes des lectures, « ceux de la transmission et de la compréhension », écrit de manière à ce que le statut des narrateurs des lectures puisse être connu comme celui des narrateurs de hadiths, puisqu'une chaîne de transmission solide est un pilier d'une lecture valide; il le classe parmi ses œuvres aux côtés des « classes de lecteurs » plus ou moins importantes, et les notes de l'Itqan édité y renvoient les lecteurs pour des biographies des lecteurs {cite:nashr-dahman-damascus-1345-v1 p. 203} {cite:nashr-dahman-damascus-1345-v1 p. 8} {cite:itqan-suyuti p. 486}."
  tr: "İbn el-Cezeri'nin okuma adamlarının biyografileri üzerine yazdığı \"Rivayet ve Bilgi Olanları\" adlı kitabı, hem okuma anlatıcılarının hem de hadis rivayetçilerinin durumunu anlamak için yazılmıştır; çünkü zincirin özgünlüğü okumanın temel taşlarından biridir; eserlerinde büyük ve küçük \"Tabaqat al-Kurraa\" baskılarıyla birlikte ele alır ve okuyucuların biyografilerinde doğrulanan \"El-İtqan\" baskısının kenar notlarında da ona atıfta bulunur {atıf:nashr-dahman-damascus-1345-v1, s. 486}."
  id: "Buku Ibn al-Jazari tentang biografi para tokoh pembacaan, \"Mereka yang Memiliki Narasi dan Pengetahuan,\" ditulis untuk memahami kondisi para narator bacaan serta kondisi para narator hadits, karena keaslian rantai tersebut adalah pilar pembacaan; ia memikirkannya dalam karya-karyanya bersama edisi besar dan kecil \"Tabaqat al-Qurraa\", dan catatan pinggir edisi \"Al-Itqan,\" yang diverifikasi dalam biografi para pembaca, merujuk kepadanya {cite:nashr-dahman-damascus-1345-v1, hlm. 486}."
