label:
  ar: "أهل الجنة ⁦(برنامج تلفزيوني رمضاني)⁩"
  en: "Ahl al-Janna: The People of Paradise (Ramadan television programme)"
  ur: "اہل الجنۃ: جنت والے ⁦(رمضانی ٹیلی وژن پروگرام)⁩"
summary:
  ar: "برنامج تلفزيوني رمضاني لمصطفى حسني، تجعله ويكيبيديا العربية في رمضان 2013، يحفظ منه أرشيف أسابيل ثماني وعشرين حلقة مصوّرة من ثلاث وعشرين دقيقة إلى ثلاث وثلاثين، صُوّر أكثرها في الطبيعة بين الجبال والأنهار والبساتين: «رحلة» متخيَّلة لزيارة أهل الجنة، في كل حلقة خلق من أخلاقهم ⁦(حب الخير، والأمانة، وحفظ اللسان، والصدق، والعفة، والتواضع، والرحمة، والوفاء، والقناعة، والإتقان، وسلامة الصدر، والحلم، والعفو، والشجاعة، والرضا، والبر، والتفاؤل، والكرم، والشكر وغيرها)⁩ يقابله خلق يقول إن الشيطان يريد أن يصنعه في الإنسان، ثم حلقة عن ليلة القدر، وحلقة عن عشرة حصون من الشيطان، وخاتمة عن الولاية."
  en: "A Ramadan television programme by Mustafa Hosny, dated by the Arabic Wikipedia to Ramadan 2013, of which the Assabile archive keeps twenty-eight video episodes of twenty-three to thirty-three minutes, most filmed outdoors among mountains, rivers and orchards: an imagined 'journey' to visit the people of Paradise, each episode taking one of their traits (love of good, trustworthiness, guarding the tongue, truthfulness, chastity, humility, gentleness, keeping covenants, contentment, excellence in work, a sound heart, forbearance, pardon, courage, contentment with God's decree, duty to parents, optimism, generosity, gratitude and others) set against a trait he says Satan wants to make in man, with an episode on the Night of Decree, one on ten fortifications against Satan, and a closing episode on God's protecting friendship (wilaya)."
  ur: "مصطفیٰ حسنی کا رمضانی ٹیلی وژن پروگرام، جسے عربی ویکیپیڈیا رمضان 2013 کا بتاتا ہے، جس کی تئیس سے تینتیس منٹ کی اٹھائیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں، جن میں سے اکثر پہاڑوں، دریاؤں اور باغوں میں فلمائی گئیں: جنت والوں سے ملاقات کا ایک تصوراتی «سفر»، ہر قسط میں ان کی کوئی خوبی ⁦(بھلائی سے محبت، امانت، زبان کی حفاظت، سچائی، پاکدامنی، عاجزی، نرمی، عہد کی پاسداری، قناعت، کام میں عمدگی، سینے کی صفائی، بردباری، عفو، شجاعت، تقدیر پر رضا، والدین سے نیکی، امید، سخاوت، شکر وغیرہ)⁩ اس خصلت کے مقابل جسے وہ کہتے ہیں کہ شیطان انسان میں پیدا کرنا چاہتا ہے؛ ایک قسط شبِ قدر پر، ایک شیطان سے دس حفاظتوں پر، اور آخری قسط ولایت پر۔"
