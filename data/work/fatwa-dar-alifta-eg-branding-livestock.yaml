id: work/fatwa-dar-alifta-eg-branding-livestock
class: work
kind: fatwa
label: { ar: "حكم كيّ الماشية بالنار لتمييزها", en: "Branding livestock with fire to mark them", ur: "مویشیوں کو نشان کے لیے داغنے کا حکم", es: "Marcar el ganado con fuego para identificarlo.", fr: "Marquer le bétail au feu pour le marquer", tr: "Sığırları ayırt etmek için ateşle ütülenmesiyle ilgili karar", id: "Aturan tentang sapi yang disetrika dengan api untuk membedakan mereka" }
summary:
  ar: "سائل سأل عن كيّ الماشية بالنار لتمييزها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21983)⁩ أنه لا مانع شرعًا من وسم الرجل ماشيته بإحداث علامة فيها عن طريق الكي إذا دعت الحاجة وتعين الطريق على ما فصّل الجواب من مراعاة أحكام الرفق بالحيوان."
  en: "A questioner asked about branding livestock with fire to mark them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21983) answered that nothing in the sharia bars a man marking his livestock by cautery where need calls and the way is determined — with the rules of kindness to animals that the answer details."
  ur: "ایک سائل نے مویشیوں کو پہچان کے لیے آگ سے داغنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21983)⁩ نے جواب دیا کہ ضرورت ہو اور طریقہ متعین ہو تو مالک کے اپنے مویشیوں کو نشان لگانے میں شرعاً کوئی مانع نہیں — جواب میں جانوروں کے ساتھ رفق کے احکام بھی بیان ہوئے۔"
  es: "Un consultante preguntó sobre la posibilidad de marcar el ganado con fuego. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21983) respondió que nada en la sharia prohíbe que un hombre marque su ganado mediante cauterización cuando sea necesario y se determine el procedimiento, respetando las normas de bondad hacia los animales que se detallan en la respuesta."
  fr: "Un internaute a posé une question concernant le marquage du bétail au feu. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21983) a répondu que rien dans la charia n'interdit à un homme de marquer son bétail par cautérisation lorsque cela s'avère nécessaire et que la méthode est déterminée, dans le respect des règles de bienveillance envers les animaux, détaillées dans la réponse."
  tr: "Bir soru soran kişi, sığırların ayırt edilmesi için ateşle yakılması hakkında soru sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21983), bir adamın hayvanlarını işaretleyerek gerekirse onları yakarak işaretlemesine dini bir itiraz olmadığını ve hayvanlara zulüm kuralları konusunda detaylı olarak yolu netleştirmesini söyledi."
  id: "Seorang penanya menanyakan tentang ternak yang dibakar dengan api untuk membedakannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21983) menjawab bahwa tidak ada keberatan agama bagi seorang pria menandai ternaknya dengan menandai ternaknya dengan membakar mereka jika perlu dan untuk memperjelas jalannya, sebagaimana dijelaskan mengenai aturan kekejaman terhadap hewan."
