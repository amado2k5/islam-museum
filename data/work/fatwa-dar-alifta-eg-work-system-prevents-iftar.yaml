id: work/fatwa-dar-alifta-eg-work-system-prevents-iftar
class: work
kind: fatwa
label: { ar: "حكم إفطار من يحول نظام العمل بينه وبين الإفطار وقت المغرب", en: "May one whose work prevents iftar at maghrib not fast?", ur: "جس کا کام وقتِ مغرب افطار سے روکے اس کا حکم", es: "¿Acaso quien cuyo trabajo impide el iftar al mediodía no puede ayunar?", fr: "Celui dont le travail l'empêche de jeûner à l'heure du maghrib peut-il être dispensé de jeûner ?" }
summary:
  ar: "سائل يعمل في مكان يحول نظامه بينه وبين الإفطار وقت المغرب فسأل عن جواز إفطار رمضان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21758)⁩ أنه لا يجوز له أن يفطر شهر رمضان ما دام لا يلحقه بعمله ضرر جسيم يصحبه مشقة فوق المعتاد على ما فصّل الجواب."
  en: "A man whose workplace system keeps him from breaking fast at maghrib asked whether he may abandon the Ramadan fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21758) answered that he may not leave the fast so long as his work brings him no severe harm or extraordinary hardship — as the answer details."
  ur: "ایک شخص کا کام وقتِ مغرب افطار کرنے سے روکتا ہے؛ اس نے رمضان میں روزہ نہ رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21758)⁩ نے جواب دیا کہ جب تک کام سے شدید نقصان یا غیر معمولی مشقت نہ ہو، روزہ نہیں چھوڑ سکتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre cuyo sistema laboral le impide romper el ayuno al amanecer preguntó si podía abandonar el ayuno de Ramadán. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21758) respondió que no podía abandonar el ayuno siempre y cuando su trabajo no le causara daños graves ni dificultades extraordinarias, como se detalla en la respuesta."
  fr: "Un homme, dont le règlement intérieur l'empêche de rompre le jeûne au maghrib, a demandé s'il pouvait interrompre le jeûne du Ramadan. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21758) a répondu qu'il ne pouvait pas rompre le jeûne tant que son travail ne lui causait pas de préjudice grave ou de difficultés exceptionnelles, comme le précise la réponse."
