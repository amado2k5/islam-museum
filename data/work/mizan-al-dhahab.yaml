summary:
  ar: "ميزان الذهب في صناعة شعر العرب، كتاب في العروض والقوافي لمؤلفه أحمد الهاشمي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 1362هـ / 1943م {cite:archive-org-mizan-al-dhahab}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "Mizan al-Dhahab fi Sinaat Shir al-Arab, a book on prosody (arud and qawafi) by Ahmad al-Hashimi; its date in a research summary supplied to the museum is d. 1362 AH / 1943 CE {cite:archive-org-mizan-al-dhahab}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "ميزان الذهب في صناعة شعر العرب، عروض و قوافی پر ایک کتاب، مصنف أحمد الهاشمي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 1362ھ / 1943ء {cite:archive-org-mizan-al-dhahab}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Mizan al-Dhahab fi Sinaat Shir al-Arab, livre sur la prosodie (arud et qawafi) de Ahmad al-Hashimi ; sa date dans une synthèse de recherche remise au musée : m. 1362 H / 1943 {cite:archive-org-mizan-al-dhahab}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "Mizan al-Dhahab fi Sinaat Shir al-Arab, libro sobre prosodia (arud y qawafi) de Ahmad al-Hashimi; su fecha en un resumen de investigación entregado al museo: m. 1362 H. / 1943 {cite:archive-org-mizan-al-dhahab}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
