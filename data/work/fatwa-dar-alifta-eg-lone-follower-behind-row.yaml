label: { ar: "حكم صلاة المأموم منفردًا خلف الإمام أو خلف الصف", en: "A lone follower praying behind the imam or behind the row", ur: "اکیلے مقتدی کا امام یا صف کے پیچھے نماز پڑھنا" }
summary:
  ar: "سائل سأل عن صلاة المأموم منفردًا خلف الإمام أو خلف الصف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21782)⁩ أن السنة للمأموم الواحد أن يقف عن يمين الإمام فإن خالف ذلك فوقف خلفه من غير عذر صحت صلاته مع الكراهة على ما فصّل الجواب."
  en: "A questioner asked about a lone follower praying separately behind the imam or behind the row. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21782) answered that the sunna is for a single follower to stand at the imam's right; if he stands behind without excuse his prayer is valid though disliked — as the answer details."
  ur: "ایک سائل نے اکیلے مقتدی کے امام یا صف کے پیچھے الگ کھڑے ہو کر نماز پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21782)⁩ نے جواب دیا کہ سنت یہ ہے کہ اکیلا مقتدی امام کے دائیں کھڑا ہو؛ بلا عذر پیچھے کھڑا ہو تو نماز صحیح ہے مگر مکروہ — جیسا کہ جواب میں تفصیل ہے۔"
