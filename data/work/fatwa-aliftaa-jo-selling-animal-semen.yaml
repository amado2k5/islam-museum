id: work/fatwa-aliftaa-jo-selling-animal-semen
class: work
kind: fatwa
label: { ar: "بيع مني الحيوانات واستئجار الفحل", en: "Selling animal semen and hiring a stud", ur: "جانوروں کا مادۂ منویہ بیچنا اور نر جانور کرائے پر لینا" }
summary:
  ar: "سؤال عن بيع مني الحيوانات والفرق بينه وبين النهي عن عسب الفحل، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع المني المستخرج من حيوان طاهر جائز، وأن النهي يتعلق باستئجار الفحل لتحقيق الحمل لما فيه من الغرر. أجابت الدائرة بأنه لا حرج في بيع مني الحيوانات أو أخذ الأجرة على تلقيحه إذا كان من حيوان طاهر غير الكلب والخنزير، لأنه إذا جاز بيع الكل جاز بيع الجزء. وقالت إن علة النهي عن عسب الفحل أن استئجاره لتحقيق الحمل غرر، لأن الحمل غير مضمون، ولأن المنفعة غير معلومة ولا مقدور على تسليمها، كما ذكر ابن حجر العسقلاني في فتح الباري، وهذه الإشكالات لا توجد في بيع المني المستخرج نفسه. ونقلت عن ابن حجر الهيتمي في الزواجر وعن الشبراملسي في حاشيته على نهاية المحتاج أن من استأجر الفحل زمنًا معينًا لينتفع به مطلقًا جاز له استعماله في الإنزاء تبعًا لا قصدًا. وخلصت إلى جواز استئجار الفحل بمبلغ معين لزمن معين لعموم الانتفاع، وأن للمستأجر أن ينتفع به في النزو تبعًا."
  en: "A question on selling animal semen and how it differs from the prohibition on stud fees, in which Jordan's General Iftaa Department answered that selling semen extracted from a pure animal is permitted, and that the prohibition concerns hiring a stud to produce a pregnancy, because of the uncertainty involved. The Department answered that there is no objection to selling animal semen or charging for inseminating with it if it comes from a pure animal other than a dog or a pig, since if selling the whole is allowed, selling a part is too. It said the reason for the prohibition on stud fees is that hiring a stud to produce a pregnancy is uncertain, since pregnancy is not guaranteed and the benefit is neither known nor deliverable, as Ibn Hajar al-Asqalani stated in Fath al-Bari; none of these problems arise in selling extracted semen itself. It quoted Ibn Hajar al-Haytami's al-Zawajir and al-Shabramallisi's gloss on Nihayat al-Muhtaj that someone who hires a stud for a set time to use as he wishes may use it for covering as a by-product rather than as the purpose. It concluded that hiring a stud for a set sum and a set time for general use is a valid hire, and the hirer may use it for covering as a by-product."
  ur: "جانوروں کا مادۂ منویہ بیچنے اور اس کے نر جانور کی جفتی کی اجرت کی ممانعت سے فرق کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پاک جانور سے نکالا گیا مادہ بیچنا جائز ہے، اور ممانعت غرر کی وجہ سے حمل کے لیے نر کو کرائے پر لینے سے متعلق ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ کتے اور خنزیر کے علاوہ کسی پاک جانور کا مادہ بیچنے یا اس سے تلقیح کی اجرت لینے میں حرج نہیں، کیونکہ جب کل کا بیچنا جائز ہے تو جز کا بھی جائز ہے۔ اس نے کہا کہ جفتی کی اجرت کی ممانعت کی علت یہ ہے کہ حمل کے لیے نر کو کرائے پر لینا غرر ہے، کیونکہ حمل یقینی نہیں اور منفعت نہ معلوم ہے نہ اس کی سپردگی ممکن، جیسا کہ ابن حجر عسقلانی نے فتح الباری میں ذکر کیا؛ نکالے گئے مادے کی بیع میں یہ مسائل نہیں۔ اس نے ابن حجر الہیتمی کی الزواجر اور نہایۃ المحتاج پر شبراملسی کے حاشیے سے نقل کیا کہ جو نر کو مقررہ وقت کے لیے عمومی فائدے کے لیے کرائے پر لے، وہ اسے مقصد کے طور پر نہیں بلکہ تبعاً جفتی میں استعمال کر سکتا ہے۔ اس نے نتیجہ نکالا کہ عمومی فائدے کے لیے مقررہ رقم پر مقررہ وقت کے لیے نر کو کرائے پر لینا درست اجارہ ہے، اور کرایہ دار تبعاً اس سے جفتی کا فائدہ اٹھا سکتا ہے۔"
