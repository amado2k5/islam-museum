id: work/fatwa-aliftaa-jo-aquarium-water-and-fish-waste
class: work
kind: fatwa
label: { ar: "ماء حوض سمك الزينة وروثه", en: "Aquarium water and fish waste", ur: "زینتی مچھلیوں کے حوض کا پانی اور ان کا فضلہ" }
summary:
  ar: "سؤال عن ماء حوض سمك الزينة وروثه، أجابت فيه دائرة الإفتاء العام الأردنية بأن ماء حوض سمك الزينة طاهر ما لم يتغير، وأن قليل روث السمك معفو عنه ما لم يغير الماء. أجابت الدائرة بأن ماء الحوض الذي فيه سمك الزينة طاهر ما لم يتغير، وأن قليل روث السمك معفو عنه ما لم يتغير الماء به. ونقلت من حاشية الجمل على شرح المنهج (1/178) أنه يعفى عن قليل شعر غير المأكول وقليل شعر المركوب لمشقة الاحتراز منه، وعن روث السمك كذلك إلا أن يغير الماء."
  en: "A question about aquarium water and fish waste, in which Jordan's General Iftaa Department answered that aquarium water containing ornamental fish is pure unless it changes, and that a small amount of fish waste is excused unless it alters the water. The Department answered that the water of a tank containing ornamental fish is pure as long as it does not change, and that a small amount of fish waste is excused unless the water is altered by it. It quoted the Hashiya of al-Jamal on Sharh al-Manhaj (1/178) that a little hair of an inedible animal or of a riding animal is excused because it is hard to avoid, and that fish waste is likewise excused unless it changes the water."
  ur: "زینتی مچھلیوں کے حوض کا پانی اور ان کا فضلہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زینتی مچھلیوں کے حوض کا پانی جب تک تبدیل نہ ہو پاک ہے، اور مچھلی کا تھوڑا فضلہ معاف ہے جب تک پانی کو تبدیل نہ کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ زینتی مچھلیوں والے حوض کا پانی جب تک تبدیل نہ ہو پاک ہے، اور مچھلی کا تھوڑا فضلہ معاف ہے جب تک اس سے پانی تبدیل نہ ہو۔ اس نے شرح المنہج پر جمل کے حاشیے (1/178) سے نقل کیا کہ غیر ماکول جانور اور سواری کے جانور کے تھوڑے بال اس سے بچنے کی مشقت کی وجہ سے معاف ہیں، اور مچھلی کا فضلہ بھی اسی طرح معاف ہے، الا یہ کہ پانی کو تبدیل کر دے۔"
