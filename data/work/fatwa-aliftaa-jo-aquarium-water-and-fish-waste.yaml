id: work/fatwa-aliftaa-jo-aquarium-water-and-fish-waste
class: work
kind: fatwa
label: { ar: "ماء حوض سمك الزينة وروثه", en: "Aquarium water and fish waste", ur: "زینتی مچھلیوں کے حوض کا پانی اور ان کا فضلہ", es: "Agua de acuario y desechos de peces", fr: "Déchets d'eau d'aquarium et de poissons" }
summary:
  ar: "سؤال عن ماء حوض سمك الزينة وروثه، أجابت فيه دائرة الإفتاء العام الأردنية بأن ماء حوض سمك الزينة طاهر ما لم يتغير، وأن قليل روث السمك معفو عنه ما لم يغير الماء. أجابت الدائرة بأن ماء الحوض الذي فيه سمك الزينة طاهر ما لم يتغير، وأن قليل روث السمك معفو عنه ما لم يتغير الماء به. ونقلت من حاشية الجمل على شرح المنهج (1/178) أنه يعفى عن قليل شعر غير المأكول وقليل شعر المركوب لمشقة الاحتراز منه، وعن روث السمك كذلك إلا أن يغير الماء."
  en: "A question about aquarium water and fish waste, in which Jordan's General Iftaa Department answered that aquarium water containing ornamental fish is pure unless it changes, and that a small amount of fish waste is excused unless it alters the water. The Department answered that the water of a tank containing ornamental fish is pure as long as it does not change, and that a small amount of fish waste is excused unless the water is altered by it. It quoted the Hashiya of al-Jamal on Sharh al-Manhaj (1/178) that a little hair of an inedible animal or of a riding animal is excused because it is hard to avoid, and that fish waste is likewise excused unless it changes the water."
  ur: "زینتی مچھلیوں کے حوض کا پانی اور ان کا فضلہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زینتی مچھلیوں کے حوض کا پانی جب تک تبدیل نہ ہو پاک ہے، اور مچھلی کا تھوڑا فضلہ معاف ہے جب تک پانی کو تبدیل نہ کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ زینتی مچھلیوں والے حوض کا پانی جب تک تبدیل نہ ہو پاک ہے، اور مچھلی کا تھوڑا فضلہ معاف ہے جب تک اس سے پانی تبدیل نہ ہو۔ اس نے شرح المنہج پر جمل کے حاشیے (1/178) سے نقل کیا کہ غیر ماکول جانور اور سواری کے جانور کے تھوڑے بال اس سے بچنے کی مشقت کی وجہ سے معاف ہیں، اور مچھلی کا فضلہ بھی اسی طرح معاف ہے، الا یہ کہ پانی کو تبدیل کر دے۔"
  es: "Una pregunta sobre el agua de acuario y los desechos de los peces, en la que el Departamento General de Iftaa de Jordania respondió que el agua de un acuario que contiene peces ornamentales es pura a menos que cambie, y que una pequeña cantidad de desechos de peces está exenta a menos que altere el agua. El Departamento respondió que el agua de un tanque que contiene peces ornamentales es pura siempre que no cambie, y que una pequeña cantidad de desechos de peces está exenta a menos que altere el agua. Citó la Hashiya de al-Jamal en Sharh al-Manhaj (1/178) que dice que un poco de pelo de un animal no comestible o de un animal de monta está exento porque es difícil de evitar, y que los desechos de peces también están exentos a menos que cambien el agua."
  fr: "Une question relative à l'eau d'aquarium et aux déchets de poissons a été posée au Département général de la Iftaa de Jordanie. Ce dernier a répondu que l'eau d'un aquarium contenant des poissons d'ornement est pure tant qu'elle reste inchangée, et qu'une petite quantité de déchets de poissons est tolérée sauf si elle altère l'eau. Le Département a précisé que l'eau d'un aquarium contenant des poissons d'ornement est pure tant qu'elle ne se modifie pas, et qu'une petite quantité de déchets de poissons est tolérée sauf si elle altère l'eau. Il a cité la Hashiya d'al-Jamal sur Sharh al-Manhaj (1/178) selon laquelle quelques poils d'un animal non comestible ou d'un animal de selle sont tolérés car difficiles à éviter, et que les déchets de poissons sont également tolérés sauf s'ils modifient l'eau."
