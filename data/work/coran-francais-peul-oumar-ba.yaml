summary:
  ar: "أول ترجمة مكتوبة لمعاني القرآن إلى لغة الفولاني بالحرف اللاتيني، وضعها المثقف الموريتاني السنغالي عمر باه، ونشرتها دار لارماتان في باريس مع وكالة التعاون الثقافي والتقني سنة 1982 وأعيد طبعها سنة 2001، بتقديم ليوبولد سيدار سنغور مؤرخ في 1970؛ فيها الترجمة الفرنسية والفولانية في عمودين دون النص العربي ولا حواشٍ، والعمود الفرنسي في الحقيقة ترجمة بلاشير مع عناصر من مونتيه دون ذكرهما."
  en: "The first written translation of the meanings of the Qur'an into Fula in Latin script, by the Mauritanian-Senegalese intellectual Oumar Bâ, published in Paris by L'Harmattan with the Agence de Coopération Culturelle et Technique in 1982 and reprinted in 2001, with a preface by Léopold Sédar Senghor dated 1970; it sets French and Fula in two columns, without the Arabic text or notes, and its French column is in fact Blachère's translation with elements from Montet, unacknowledged."
  ur: "فولانی زبان میں لاطینی رسم الخط میں قرآن کے معانی کا پہلا تحریری ترجمہ، از موریتانوی سینیگالی دانشور عمر با، جو 1982 میں پیرس سے لارماتان نے ثقافتی و تکنیکی تعاون ایجنسی کے ساتھ شائع کیا اور 2001 میں دوبارہ چھپا، لیوپولڈ سیدار سینگور کے 1970 کے مقدمے کے ساتھ؛ فرانسیسی اور فولانی دو کالموں میں ہیں، عربی متن اور حواشی کے بغیر، اور فرانسیسی کالم دراصل بلاشیر کا ترجمہ ہے جس میں مونتیہ کے اجزا ہیں، بغیر حوالے کے۔"
