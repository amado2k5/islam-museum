label: { ar: "القرآن: فرنسي فولاني ⁦(عمر باه)⁩", en: "Le Coran: Français–Peul (Oumar Bâ)", ur: "لو کوران: فرانسیسی–پیول ⁦(عمر با)⁩", es: "Le Coran: Français–Peul (Oumar Bâ)", fr: "Le Coran: Français–Peul (Oumar Bâ)", tr: "Kur'an: Fulani Fransızcası (Omar Bah)", id: "Al-Quran: Bahasa Prancis Fulani (Omar Bah)" }
summary:
  ar: "أول ترجمة مكتوبة لمعاني القرآن إلى لغة الفولاني بالحرف اللاتيني، وضعها المثقف الموريتاني السنغالي عمر باه، ونشرتها دار لارماتان في باريس مع وكالة التعاون الثقافي والتقني سنة 1982 وأعيد طبعها سنة 2001، بتقديم ليوبولد سيدار سنغور مؤرخ في 1970؛ فيها الترجمة الفرنسية والفولانية في عمودين دون النص العربي ولا حواشٍ، والعمود الفرنسي في الحقيقة ترجمة بلاشير مع عناصر من مونتيه دون ذكرهما."
  en: "The first written translation of the meanings of the Qur'an into Fula in Latin script, by the Mauritanian-Senegalese intellectual Oumar Bâ, published in Paris by L'Harmattan with the Agence de Coopération Culturelle et Technique in 1982 and reprinted in 2001, with a preface by Léopold Sédar Senghor dated 1970; it sets French and Fula in two columns, without the Arabic text or notes, and its French column is in fact Blachère's translation with elements from Montet, unacknowledged."
  ur: "فولانی زبان میں لاطینی رسم الخط میں قرآن کے معانی کا پہلا تحریری ترجمہ، از موریتانوی سینیگالی دانشور عمر با، جو 1982 میں پیرس سے لارماتان نے ثقافتی و تکنیکی تعاون ایجنسی کے ساتھ شائع کیا اور 2001 میں دوبارہ چھپا، لیوپولڈ سیدار سینگور کے 1970 کے مقدمے کے ساتھ؛ فرانسیسی اور فولانی دو کالموں میں ہیں، عربی متن اور حواشی کے بغیر، اور فرانسیسی کالم دراصل بلاشیر کا ترجمہ ہے جس میں مونتیہ کے اجزا ہیں، بغیر حوالے کے۔"
  es: "La primera traducción escrita de los significados del Corán al fula en escritura latina, realizada por el intelectual mauritano-senegalés Oumar Bâ, fue publicada en París por L'Harmattan con la Agence de Coopération Culturelle et Technique en 1982 y reimpresa en 2001, con un prefacio de Léopold Sédar Senghor fechado en 1970; presenta el francés y el fula en dos columnas, sin el texto árabe ni notas, y su columna en francés es, de hecho, la traducción de Blachère con elementos de Montet, sin reconocer su autoría."
  fr: "La première traduction écrite des significations du Coran en peul en caractères latins, par l'intellectuel mauritanien-sénégalais Oumar Bâ, publiée à Paris par L'Harmattan avec l'Agence de Coopération Culturelle et Technique en 1982 et réimprimée en 2001, avec une préface de Léopold Sédar Senghor datée de 1970; elle présente le français et le peul sur deux colonnes, sans le texte arabe ni les notes, et sa colonne française est en fait la traduction de Blachère avec des éléments de Montet, non reconnus."
  tr: "Kur'an'ın Fulani diline yazılı olarak Latin alfabesiyle yazılmış ilk yazılı çevirisi, Moritanya-Senegalli entelektüel Omar Bah tarafından hazırlanmış, 1982'de Paris'te Larmattan tarafından Kültürel ve Teknik İşbirliği Ajansı ile iş birliği içinde yayımlanmış ve 2001'de 1970 tarihli Léopold Sédar Senghor tarafından yeniden basılmıştır; Fransızca ve Fulani çevirilerini iki sütunda Arapça metin veya kenar boşlukları olmadan içerirken, Fransızca sütun aslında Montague'den unsurlar içeren Blachère çevirisidir ancak bunları belirtmemektedir."
  id: "Terjemahan tertulis pertama makna Al-Qur'an ke dalam bahasa Fulani dalam aksara Latin disiapkan oleh intelektual Mauritania-Senegal Omar Bah, diterbitkan oleh Larmattan di Paris bekerja sama dengan Badan Kerja Sama Budaya dan Teknis pada tahun 1982, dan dicetak ulang pada tahun 2001, disajikan oleh Léopold Sédar Senghor bertanggal 1970; terjemahan ini mencakup terjemahan Prancis dan Fulani dalam dua kolom tanpa teks atau margin Arab, sementara kolom Prancis sebenarnya adalah terjemahan Blachère dengan unsur-unsur dari Montague tanpa menyebutkannya."
