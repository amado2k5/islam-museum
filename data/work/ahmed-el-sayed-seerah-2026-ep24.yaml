label:
  ar: "سيرة رسول الله 2026، الحلقة 24: لماذا دعا النبي بإسلام عمر؟"
  en: "The Biography of the Messenger of God 2026, episode 24: Why Did the Prophet Pray for Umar's Islam?"
  ur: "سیرتِ رسول اللہ 2026، قسط 24: نبی نے عمر کے اسلام کے لیے دعا کیوں کی؟"
  fr: "La biographie du Messager de Dieu 2026, épisode 24 : Pourquoi le Prophète a-t-il prié pour l'islam d'Umar ?"
  es: "La biografía del Mensajero de Dios 2026, episodio 24: ¿Por qué rezó el Profeta por el islam de Umar?"
summary:
  ar: "يفتتح المحاضر السنة السادسة من الدعوة بعمر بن الخطاب. ويتناول الروايات الواردة في دعاء النبي بإسلام عمر، والصفات التي جعلت عمر مصدر قوة للإسلام في مكة ثم في خلافته، وأقوال الصحابة في الثناء عليه. ويختم ببني عدي، عشيرة عمر، ونسبه وأقاربه وذريته."
  en: "The lecturer opens the sixth year of the mission with Umar ibn al-Khattab. He discusses the reports of the Prophet's prayer for Umar's Islam, the traits that made Umar a source of strength for Islam in Mecca and later as caliph, and Companions' tributes to him. He closes with Umar's clan, Banu Adi, his lineage, relatives and descendants."
  ur: "مقرر دعوت کے چھٹے سال کا آغاز عمر بن الخطاب سے کرتے ہیں۔ وہ نبی کی طرف سے عمر کے اسلام کے لیے دعا کی روایات، ان صفات جنہوں نے عمر کو مکہ میں اور بعد میں خلیفہ کی حیثیت سے اسلام کے لیے قوت کا ذریعہ بنایا، اور صحابہ کی طرف سے ان کی تعریف پر بات کرتے ہیں۔ اختتام بنو عدی، یعنی عمر کے قبیلے، ان کے نسب، رشتہ داروں اور اولاد پر ہوتا ہے۔"
  fr: "Le conférencier ouvre la sixième année de la mission avec Umar ibn al-Khattab. Il discute les récits de la prière du Prophète pour l'islam d'Umar, les traits qui firent d'Umar une source de force pour l'islam à La Mecque puis comme calife, et les éloges des Compagnons à son égard. Il termine par le clan d'Umar, les Banu Adi, sa généalogie, ses proches et ses descendants."
  es: "El conferenciante abre el sexto año de la misión con Umar ibn al-Khattab. Trata los relatos de la oración del Profeta por el islam de Umar, los rasgos que hicieron de Umar una fuente de fortaleza para el islam en La Meca y más tarde como califa, y los elogios de los Compañeros hacia él. Termina con el clan de Umar, los Banu Adi, su linaje, sus parientes y sus descendientes."
