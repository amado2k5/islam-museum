label: { ar: "أبيات القتال الكلابي «نشدت زيادا والمقامة بيننا»", en: "al-Qattal al-Kilabi's verses 'I adjured Ziyad'", es: "Los versos de al-Qattal al-Kilabi 'Conjuré a Ziyad'", fr: "Les vers d'al-Qattal al-Kilabi 'J'ai adjuré Ziyad'", ur: "قتال الکلبی کی آیات 'میں نے زیاد کو ملعون کیا'", tr: "Köpek dövüş dizeleri: \"Aramızda Ziada ve Makam'ı söyledim\"", id: "Bait pertarungan anjing: \"Aku menyanyikan Ziada dan Maqam di antara kita\"" }
summary:
  ar: "أبيات في ديوان الحماسة من الطويل على روي الميم، يقولها القتال الكلابي بعد قتله زيادا أخا ابنة عمه {{cite:hamasa-abu-tammam-ed-1916 p.56}}."
  en: "Verses in the Diwan al-Hamasa in the tawil metre on the rhyme mim, said by al-Qattal al-Kilabi after he killed Ziyad, the brother of his cousin {{cite:hamasa-abu-tammam-ed-1916 p.56}}."
  es: "Versos del Diwan al-Hamasa en metro tawil sobre la rima mim, dicho por al-Qattal al-Kilabi después de matar a Ziyad, hermano de su primo {{cite:hamasa-abu-tammam-ed-1916 p.56}}."
  fr: "Versets du Diwan al-Hamasa en mètre tawil sur la rime mim, dits par al-Qattal al-Kilabi après avoir tué Ziyad, le frère de son cousin {{cite:hamasa-abu-tammam-ed-1916 p.56}}."
  ur: "دیوان الحمسہ میں آیات میم پر تاویل میٹر میں، قتال الکلبی نے اپنے کزن کے بھائی زیاد کو قتل کرنے کے بعد کہا۔"
  tr: "Hamasa Diwanı'nda, kuzeninin kızının kardeşi Ziyad'ı öldürdükten sonra köpek dövüşçüleri tarafından okunan meemin anlatımına dair Al-Tawil'deki dizeler {{cite:hamasa-abu-tammam-ed-1916 s.56}}."
  id: "Bait-bait dalam Diwan Hamasa dari Al-Tawil tentang narasi meem, yang dibacakan oleh para petarung anjing setelah membunuh Ziyad, saudara dari putri sepupunya {{cite:hamasa-abu-tammam-ed-1916 hlm.56}}."
