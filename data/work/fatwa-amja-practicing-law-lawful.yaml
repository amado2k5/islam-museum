id: work/fatwa-amja-practicing-law-lawful
class: work
kind: fatwa
label: { ar: "مهنة المحاماة", en: "Practising law — lawful advocacy", ur: "وکالت کا پیشہ — جائز", es: "Ejercicio de la abogacía: defensa legal." }
summary:
  ar: "سأل سائل عن حكم العمل بالمحاماة. أجاب د. وليد بن إدريس المنيسي ⁦(فتوى رقم 902 بتاريخ 7 نوفمبر 2005)⁩ أن المحاماة جائزة في الشريعة الإسلامية وهي من باب التوكيل في الخصومة الذي نص على جوازه فقهاء المذاهب الأربعة فيجوز للمسلم العمل بالمحاماة لينصر المظلومين ويستخلص لهم حقوقهم بشرط أن يكون عنده قدر من العلم بالشريعة يمنعه من التعاون على الإثم والعدوان، ولا فرق بين الترافع أمام المحاكم الإسلامية أو الأجنبية أو الوضعية فالعبرة بجواز التحاكم في أصل القضية لا بمكان الترافع."
  en: "A questioner asked the ruling on working as a lawyer. Dr. Walid ibn Idris al-Munaysi (fatwa no. 902, 7 November 2005) answered that advocacy is lawful in the Islamic sharia, belonging to delegation in litigation — which the jurists of the four madhhabs expressly permit; a Muslim may work as a lawyer to aid the wronged and extract their rights, provided he holds enough knowledge of the sharia to bar him from cooperation in sin and aggression; and it makes no difference whether he pleads before Islamic, foreign or civil courts — what counts is the lawfulness of referring judgment in the case itself, not the place of pleading."
  ur: "ایک سائل نے وکالت کے پیشے کا حکم پوچھا۔ ڈاکٹر وليد المنيسي ⁦(فتویٰ 902، 7 نومبر 2005)⁩ کے مطابق وکالت جائز ہے بشرط گناہ پر تعاون نہ ہو — اہم بات مقدمے کا جائز ہونا ہے نہ کہ عدالت کی جگہ۔"
  es: "Un interlocutor preguntó sobre la jurisprudencia relativa al ejercicio de la abogacía. El Dr. Walid ibn Idris al-Munaysi (fatwa n.º 902, 7 de noviembre de 2005) respondió que la abogacía es lícita en la sharia islámica, ya que forma parte de la delegación en litigios, lo cual es expresamente permitido por los juristas de las cuatro madhhabs. Un musulmán puede ejercer como abogado para ayudar a los perjudicados y exigirles sus derechos, siempre que posea suficiente conocimiento de la sharia para abstenerse de colaborar en el pecado y la agresión. No importa si litiga ante tribunales islámicos, extranjeros o civiles; lo que cuenta es la licitud de la remisión del caso a juicio, no el lugar donde se litiga."
