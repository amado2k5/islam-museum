id: work/fatwa-amja-measured-istibra
class: work
kind: fatwa
label: { ar: "الاستبراء العادي", en: "Ordinary istibra — no straining the self", ur: "عادی استبراء — تکلف نہیں" }
summary:
  ar: "سأل سائل أنه يستبرئ جيدًا بعد البول ويبذل جهدًا كبيرًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21955 بتاريخ 16 سبتمبر 2007)⁩ أنه لا ينبغي له أن يشق على نفسه حتى لا يبغض إليها عبادة ربها وتستجلب لها الأمراض العضوية والنفسية وإنما يكتفي بالاستبراء العادي الذي يغلب معه على ظنه انقطاع البول على ما فصّل الجواب."
  en: "A questioner described straining hard to istibra after urinating. Dr. Salah al-Sawi (fatwa no. 21955, 16 September 2007) answered that he should not strain himself — lest he make worshipping his Lord hateful to his soul and bring it bodily and mental illnesses; he suffices with the ordinary istibra at which the urine's ceasing prevails in his suspicion — as the answer details."
  ur: "استبراء میں بہت محنت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21955، 16 ستمبر 2007)⁩ کے مطابق عادی استبراء کافی — خود کو مشقت میں نہ ڈالے۔"
