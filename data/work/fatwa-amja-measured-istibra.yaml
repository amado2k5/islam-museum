id: work/fatwa-amja-measured-istibra
class: work
kind: fatwa
label: { ar: "الاستبراء العادي", en: "Ordinary istibra — no straining the self", ur: "عادی استبراء — تکلف نہیں", es: "Istibra ordinaria: sin esfuerzo.", fr: "Istibra ordinaire — pas de tension sur soi" }
summary:
  ar: "سأل سائل أنه يستبرئ جيدًا بعد البول ويبذل جهدًا كبيرًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21955 بتاريخ 16 سبتمبر 2007)⁩ أنه لا ينبغي له أن يشق على نفسه حتى لا يبغض إليها عبادة ربها وتستجلب لها الأمراض العضوية والنفسية وإنما يكتفي بالاستبراء العادي الذي يغلب معه على ظنه انقطاع البول على ما فصّل الجواب."
  en: "A questioner described straining hard to istibra after urinating. Dr. Salah al-Sawi (fatwa no. 21955, 16 September 2007) answered that he should not strain himself — lest he make worshipping his Lord hateful to his soul and bring it bodily and mental illnesses; he suffices with the ordinary istibra at which the urine's ceasing prevails in his suspicion — as the answer details."
  ur: "استبراء میں بہت محنت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21955، 16 ستمبر 2007)⁩ کے مطابق عادی استبراء کافی — خود کو مشقت میں نہ ڈالے۔"
  es: "Un consultante describió que hacía un gran esfuerzo para realizar la istibra después de orinar. El Dr. Salah al-Sawi (fatwa n.° 21955, 16 de septiembre de 2007) respondió que no debía esforzarse, para no hacer que la adoración a su Señor le resultara odiosa y le causara enfermedades físicas y mentales; le bastaba con la istibra ordinaria, en la que, según su sospecha, cesaba la micción, como se detalla en la respuesta."
  fr: "Un homme a décrit avoir dû faire un effort considérable pour uriner jusqu'à la fin de la miction. Le Dr Salah al-Sawi (fatwa n° 21955, 16 septembre 2007) a répondu qu'il ne devait pas faire d'efforts excessifs, de peur de rendre l'adoration de son Seigneur déplaisante à son âme et de lui causer des maladies physiques et mentales; il lui suffit de faire l'effort normal jusqu'à ce que la miction cesse, comme le précise la réponse."
