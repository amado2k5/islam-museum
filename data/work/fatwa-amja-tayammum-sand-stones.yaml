id: work/fatwa-amja-tayammum-sand-stones
class: work
kind: fatwa
label: { ar: "التيمم بالرمل", en: "Tayammum with sand — every face of the earth", ur: "ریت سے تیمم — زمین کا ہر اوپر", es: "Tayammum con arena — cada cara de la tierra", fr: "Tayammum avec du sable — chaque face de la terre" }
summary:
  ar: "سأل سائل هل يجوز التيمم بالرمل للمريض الذي لا يقدر على الماء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83287 بتاريخ 11 ديسمبر 2010)⁩ أنه يصح التيمم بكل ما صعد على وجه الأرض من تراب وحجر ورمل ونحو ذلك ولا يشترط التراب لقوله تعالى فتيمموا صعيدا طيبا والصعيد وجه الأرض، وقال شيخ الإسلام ابن تيمية يجوز التيمم بغير التراب كالحجر والرمل على ما فصّل الجواب."
  en: "A questioner asked whether a patient who cannot manage water may do tayammum with sand. Dr. Salah al-Sawi (fatwa no. 83287, 11 December 2010) answered that tayammum is valid with whatever rises on the earth's face — dust, stone, sand and the like, dust not being a condition, per 'tayammum with clean ground', ground being the earth's surface; Ibn Taymiyya said tayammum is lawful with other than dust, as with stone and sand — as the answer details."
  ur: "ایک سائل نے مریض کے لیے ریت سے تیمم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83287، 11 دسمبر 2010)⁩ کے مطابق زمین کا ہر اوپری جزو کافی ہے — ابن تيميہ بھی یہی کہتے ہیں۔"
  es: "Un consultante preguntó si un paciente que no puede ingerir agua puede realizar el tayammum con arena. El Dr. Salah al-Sawi (fatwa n.º 83287, 11 de diciembre de 2010) respondió que el tayammum es válido con todo lo que se encuentra en la superficie de la tierra: polvo, piedra, arena y similares, sin que el polvo sea una condición, según el concepto de \"tayammum con tierra limpia\", entendiendo la tierra como la superficie terrestre; Ibn Taymiyya afirmó que el tayammum es lícito con otros materiales que no sean polvo, como la piedra y la arena, como se detalla en la respuesta."
  fr: "Un internaute a demandé si un patient incapable d'ingérer de l'eau pouvait pratiquer le tayammum avec du sable. Le Dr Salah al-Sawi (fatwa n° 83287, 11 décembre 2010) a répondu que le tayammum est valide avec tout ce qui se trouve à la surface de la terre – poussière, pierres, sable, etc. –, la poussière n'étant pas une condition requise, conformément à la règle du « tayammum sur un sol propre », le sol désignant la surface terrestre. Ibn Taymiyya a précisé que le tayammum est licite avec d'autres matériaux que la poussière, comme les pierres et le sable, comme le détaille la réponse."
