id: work/fatwa-dar-alifta-eg-postponing-work-for-overtime
class: work
kind: fatwa
label: { ar: "حكم تأجيل العمل وقت الدوام ليكون عملًا إضافيًّا", en: "Postponing assigned work to hours paid as overtime", ur: "ڈیوٹی کے اوقات کا کام اوور ٹائم کے لیے مؤخر کرنا", es: "Posponer el trabajo asignado a horas pagadas como horas extras", fr: "Reporter les tâches assignées à des heures payées en heures supplémentaires", tr: "Çalışma saatleri içinde çalışmanın ertelenmesine ilişkin karar fazla mesai olarak kabul edilir", id: "Putusan tentang penundaan kerja selama jam kerja menjadi lembur" }
summary:
  ar: "سائل سأل عن تأجيل العامل عمله في وقت الدوام لينجزه عملًا إضافيًّا بأجر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21599)⁩ أن قيام العامل بما أنيط به من مهام وتكاليف بموجب العقد المبرم بينه وبين جهة العمل أمر واجب شرعًا وبيّن الجواب حكم التأجيل المذكور على وجهه."
  en: "A questioner asked about an employee postponing his assigned work from duty hours to do it as paid overtime. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21599) answered that performing the tasks contractually assigned by the employer is legally obligatory, and the answer sets out the ruling on the described postponement."
  ur: "ایک سائل نے ملازم کے ڈیوٹی کے اوقات کا کام اوور ٹائم میں مؤخر کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21599)⁩ نے جواب دیا کہ معاہدے کے مطابق سونپے گئے کام کرنا شرعاً واجب ہے اور اس مؤخر کرنے کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre un empleado que posponía su trabajo asignado fuera de su horario laboral para realizarlo como horas extras remuneradas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21599) respondió que realizar las tareas asignadas contractualmente por el empleador es legalmente obligatorio, y la respuesta establece el dictamen sobre el aplazamiento descrito."
  fr: "Un internaute a posé une question concernant un employé qui reporte son travail pendant ses heures normales afin de l'effectuer en heures supplémentaires rémunérées. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21599) a répondu que l'exécution des tâches contractuellement assignées par l'employeur est une obligation légale, et la réponse expose la règle concernant le report décrit."
  tr: "Bir soru soran kişi, işçinin iş saatleri içinde ek iş yapmak için ertelenmesini ve ücretli olarak yapılmasını sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21599), işçinin işveren ile kendisi arasındaki sözleşme kapsamında kendisine verilen görev ve görevleri yerine getirmesinin dini bir zorunluluk olduğunu ve cevabın yukarıda bahsedilen erteleme kararı olduğunu belirtmiştir."
  id: "Seorang penanya menanyakan tentang penundaan pekerjaan pekerja selama jam kerja untuk menyelesaikan pekerjaan tambahan dengan upah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21599) menjawab bahwa pelaksanaan tugas dan tugas yang diberikan oleh pekerja berdasarkan kontrak antara dia dan majikan adalah kewajiban agama, dan jawabannya adalah putusan penundaan tersebut."
