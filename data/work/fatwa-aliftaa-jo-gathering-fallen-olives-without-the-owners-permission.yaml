id: work/fatwa-aliftaa-jo-gathering-fallen-olives-without-the-owners-permission
class: work
kind: fatwa
label: { ar: "جمع ثمار الزيتون المتساقطة دون إذن صاحب الأرض", en: "Gathering fallen olives without the owner's permission", ur: "مالکِ زمین کی اجازت کے بغیر گرے ہوئے زیتون جمع کرنا" }
summary:
  ar: "سؤال عن جمع ثمار الزيتون المتساقطة دون إذن صاحب الأرض، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل عدم جواز الأخذ من ثمر الغير إلا بإذنه، لكن يتسامح في التقاط بقايا القطاف بأربعة شروط: أن يكون بعد قطاف أصحابها، وألا تكون مسورة أو قريبة من المنزل، وأن يغلب الظن بعفو المالك، وألا يتلف الشجر. أجابت الدائرة بأن الأصل أنه لا يجوز الأكل من الشجر المثمر المزروع في البيوت أو البساتين إلا بإذن صاحبه، واستدلت بحديث رواه أحمد في المسند معناه أنه لا يحل مال امرئ إلا بطيب نفس منه. وقالت إنه يمكن التسامح في بقايا اقتطاف الثمار بأربعة شروط: أن يلتقط البقايا بعد قطاف أصحابها لا قبله؛ وألا تكون الأرض مسورة أو قريبة من حرم المنزل وإلا وجب الاستئذان؛ وأن يغلب على الظن عفو المالك، كأن يشتهر العرف بالتسامح في ذلك؛ وأن يحافظ الملتقط على الشجر فلا يعرضه للإتلاف أو التكسير. ونقلت عن مغني المحتاج (3/592) أن التقاط السنابل ونحوها وقت الحصاد جائز إذا ظن إعراض المالك عنها أو رضاه بأخذها، ولا فرق بين أن يكون الآخذ من أهل الزكاة أو لا وإن خالف الزركشي في الثاني، لأن هذا القدر مما يغتفر كما جرى عليه السلف والخلف."
  en: "A question about gathering fallen olives without the owner's permission, in which Jordan's General Iftaa Department answered that in principle one may not take another's fruit without permission, but gleaning what is left after harvest is tolerated on four conditions: it is after the owners have harvested, the land is not fenced or near a house, the owner's consent can be presumed, and the trees are not damaged. The Department answered that in principle one may not eat from fruit trees planted at homes or in orchards without the owner's permission, citing a hadith narrated by Ahmad in al-Musnad whose meaning is that a person's property is not lawful to others except with his willing consent. It said that leftovers after the fruit harvest may be tolerated on four conditions: the gleaner takes what remains only after the owners have harvested, not before; the land is not fenced or close to the precincts of a house, in which case permission must be sought; the owner's forgiveness is likely, for example where custom is known to tolerate gleaning; and the gleaner takes care of the trees and does not damage or break them. It quoted Mughni al-Muhtaj (3/592) that gleaning ears of grain and the like at harvest time is permitted if one presumes the owner has abandoned them or is content for them to be taken, whether or not the gleaner is eligible for zakat, although al-Zarkashi differed on the latter point, since this small amount is overlooked, as the early and later generations practised."
  ur: "مالکِ زمین کی اجازت کے بغیر گرے ہوئے زیتون جمع کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصلاً کسی کا پھل اس کی اجازت کے بغیر لینا جائز نہیں، لیکن فصل کے بعد بچا ہوا چننا چار شرطوں کے ساتھ گوارا ہے: مالکوں کی کٹائی کے بعد ہو، زمین باڑ والی یا گھر کے قریب نہ ہو، مالک کی رضا کا غالب گمان ہو، اور درختوں کو نقصان نہ پہنچے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصلاً گھروں یا باغوں میں لگے پھل دار درختوں سے مالک کی اجازت کے بغیر کھانا جائز نہیں، اور اس حدیث سے استدلال کیا جو احمد نے المسند میں روایت کی جس کا مفہوم ہے کہ کسی شخص کا مال اس کی خوش دلی کے بغیر حلال نہیں۔ اس نے کہا کہ پھل اتارنے کے بعد بچی ہوئی چیزوں میں چار شرطوں کے ساتھ نرمی ہو سکتی ہے: چننے والا مالکوں کی کٹائی کے بعد بچا ہوا لے، پہلے نہیں؛ زمین باڑ والی یا گھر کی حدود کے قریب نہ ہو، ورنہ اجازت لینا ضروری ہے؛ مالک کی معافی کا غالب گمان ہو، مثلاً جب عرف میں اس کی اجازت مشہور ہو؛ اور چننے والا درختوں کا خیال رکھے اور انہیں نقصان نہ پہنچائے یا نہ توڑے۔ اس نے مغنی المحتاج (3/592) سے نقل کیا کہ کٹائی کے وقت بالیاں وغیرہ چننا جائز ہے اگر گمان ہو کہ مالک نے انہیں چھوڑ دیا ہے یا ان کے لینے پر راضی ہے، چاہے چننے والا زکوٰۃ کا مستحق ہو یا نہیں، اگرچہ دوسری بات میں زرکشی نے اختلاف کیا، کیونکہ یہ تھوڑی مقدار معاف ہے جیسا کہ سلف و خلف کا عمل رہا۔"
