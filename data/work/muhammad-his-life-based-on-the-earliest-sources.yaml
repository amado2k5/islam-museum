summary:
  ar: "سيرة للنبي بالإنجليزية لمارتن لينغز ⁦(أبو بكر سراج الدين)⁩ مبنية على المصادر العربية الأولى، صدرت عن ألن وأنوين وجمعية النصوص الإسلامية في لندن سنة 1983، ثم في طبعة منقحة سنة 1991."
  en: "An English life of the Prophet by Martin Lings (Abu Bakr Siraj al-Din) built on the earliest Arabic sources, published by Allen & Unwin and the Islamic Texts Society, London, in 1983, with a revised edition in 1991."
  ur: "مارٹن لنگز ⁦(ابوبکر سراج الدین)⁩ کی انگریزی سیرتِ نبوی جو ابتدائی عربی مآخذ پر مبنی ہے؛ ایلن اینڈ اَنوِن اور اسلامک ٹیکسٹس سوسائٹی، لندن سے 1983ء میں شائع ہوئی، اور 1991ء میں نظرثانی شدہ ایڈیشن آیا۔"
  es: "Una biografía del Profeta escrita en inglés por Martin Lings (Abu Bakr Siraj al-Din), basada en las fuentes árabes más antiguas, fue publicada por Allen & Unwin y la Islamic Texts Society de Londres en 1983, con una edición revisada en 1991."
  fr: "Une biographie anglaise du Prophète par Martin Lings (Abu Bakr Siraj al-Din) basée sur les plus anciennes sources arabes, publiée par Allen & Unwin et l'Islamic Texts Society, Londres, en 1983, avec une édition révisée en 1991."
  tr: "Martin Lings (Abu Bakr Siraj al-Din) tarafından İngilizce olarak hazırlanmış Peygamber biyografisi, erken Arap kaynaklarına dayanan, 1983'te Allen & Unwin ve İslami Metinler Derneği tarafından Londra'da yayımlanmış, ardından 1991'de gözden geçirilmiş baskısı olarak yayımlanmıştır."
  id: "Biografi Nabi dalam bahasa Inggris oleh Martin Lings (Abu Bakr Siraj al-Din), berdasarkan sumber Arab awal, diterbitkan oleh Allen & Unwin dan Islamic Texts Society di London pada tahun 1983, kemudian dalam edisi revisi pada tahun 1991."
