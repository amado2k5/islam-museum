id: work/fatwa-dar-alifta-eg-nonconsecutive-oath-expiation-fast
class: work
kind: fatwa
label: { ar: "حكم عدم التتابع في صيام كفارة اليمين", en: "Breaking up the oath-expiation fast", ur: "کفارۂ یمین کے روزے متواتر نہ رکھنا", es: "Romper el ayuno de expiación del juramento", fr: "Rompre le jeûne d'expiation du serment" }
summary:
  ar: "سائل سأل عن التتابع في صيام كفارة اليمين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22025)⁩ أنه يجوز لمن عجز عن إطعام عشرة مساكين أو كسوتهم فانتقل إلى صيام ثلاثة أيام أن يصومها متتابعة أو متفرقة على ما فصّل الجواب."
  en: "A questioner asked about consecutiveness in the oath-expiation fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22025) answered that one unable to feed or clothe ten poor persons who moves to fasting three days may fast them consecutively or apart, as the answer details."
  ur: "ایک سائل نے کفارۂ یمین کے روزوں میں تتابع کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22025)⁩ نے جواب دیا کہ جو دس مساکین کو کھانا یا کپڑا نہ دے سکے اور تین دن روزے پر آئے وہ انہیں مسلسل یا جدا جدا رکھ سکتا ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la consecutividad del ayuno de expiación. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22025) respondió que quien no puede alimentar ni vestir a diez personas pobres y decide ayunar tres días puede hacerlo de forma consecutiva o por separado, según se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la régularité du jeûne expiatoire. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22025) a répondu que celui qui est incapable de nourrir ou d'habiller dix personnes pauvres et qui décide de jeûner trois jours peut le faire consécutivement ou séparément, comme le précise la réponse."
