summary:
  ar: "أغنية صوفية لحّنها أ. ر. رحمن سنة 2005 لمعين الدين الجشتي، بعد خمسة عشر عاما من زياراته لضريحه في أجمير، وغناها بنفسه بكلمات كاشف، ثم اختارها المخرج أشوتوش غواريكر لفيلم «جودا أكبر» سنة 2008 في مشهد يرى فيه أكبر نورا روحيا وهو يشاهد المنشدين والراقصين."
  en: "A Sufi song A. R. Rahman composed in 2005 for Mu'in al-Din Chishti, after fifteen years of visits to his shrine at Ajmer, and sang himself to lyrics by Kashif; the director Ashutosh Gowariker chose it for the 2008 film Jodhaa Akbar, for a scene in which Akbar sees a spiritual light as he watches the singers and dancers."
  ur: "صوفیانہ گیت جو اے آر رحمان نے 2005 میں معین الدین چشتی کے لیے بنایا، اجمیر میں ان کی درگاہ پر پندرہ برس کی حاضری کے بعد، اور کاشف کے بولوں پر خود گایا؛ ہدایت کار آشوتوش گواریکر نے اسے 2008 کی فلم «جودھا اکبر» کے ایک منظر کے لیے چنا۔"
