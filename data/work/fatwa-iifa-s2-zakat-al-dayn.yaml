summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية بالكويت ⁦(ديسمبر 1985م)⁩ بشأن زكاة الديون: تجب الزكاة على رب الدين عن كل سنة إذا كان المدين مليئًا باذلًا، وتجب عليه بعد دوران الحول من يوم القبض إذا كان المدين معسرًا أو مماطلًا."
  en: "IIFA's resolution at its second session in Kuwait (December 1985) on the zakat of debts: zakat falls due on the creditor for each year when the debtor is solvent and paying, and due after a full year from the day of receipt when the debtor is insolvent or procrastinating."
  ur: "اکیڈمی کی دوسری مجلس ⁦(کویت، دسمبر 1985ء)⁩ کی قرارداد قرضوں کی زکوٰۃ پر: مدیون قادر ہو تو ہر سال دائین پر زکوٰۃ ہے؛ معسر یا ٹال مٹول کرنے والا ہو تو وصولی کے دن سے سال گزرنے پر واجب ہوتی ہے۔"
