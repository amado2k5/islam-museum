label: { ar: "قرار مجمع الفقه الإسلامي الدولي 1 (2/1) بشأن زكاة الديون", en: "IIFA resolution 1 (2/1) on the zakat of debts", ur: "اکیڈمی کی قرارداد 1 (2/1): قرضوں کی زکوٰۃ", es: "Resolución 1 (2/1) de la IIFA sobre el zakat de las deudas", fr: "Résolution 1 (2/1) de l'IIFA sur la zakat des dettes", tr: "Uluslararası İslami Fiqh Akademisi Kararı 1 (2/1) Borçlar Zekatı ile İlgili", id: "Keputusan Akademi Fiqh Islam Internasional 1 (2/1) mengenai Zakat atas Utang" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية بالكويت ⁦(ديسمبر 1985م)⁩ بشأن زكاة الديون: تجب الزكاة على رب الدين عن كل سنة إذا كان المدين مليئًا باذلًا، وتجب عليه بعد دوران الحول من يوم القبض إذا كان المدين معسرًا أو مماطلًا."
  en: "IIFA's resolution at its second session in Kuwait (December 1985) on the zakat of debts: zakat falls due on the creditor for each year when the debtor is solvent and paying, and due after a full year from the day of receipt when the debtor is insolvent or procrastinating."
  ur: "اکیڈمی کی دوسری مجلس ⁦(کویت، دسمبر 1985ء)⁩ کی قرارداد قرضوں کی زکوٰۃ پر: مدیون قادر ہو تو ہر سال دائین پر زکوٰۃ ہے؛ معسر یا ٹال مٹول کرنے والا ہو تو وصولی کے دن سے سال گزرنے پر واجب ہوتی ہے۔"
  es: "Resolución de la IIFA en su segunda sesión en Kuwait (diciembre de 1985) sobre el zakat de las deudas: el zakat vence para el acreedor por cada año cuando el deudor es solvente y paga, y vence después de un año completo desde el día de la recepción cuando el deudor es insolvente o posterga el pago."
  fr: "Résolution de l'IIFA lors de sa deuxième session au Koweït (décembre 1985) sur la zakat des dettes: la zakat est due par le créancier chaque année lorsque le débiteur est solvable et paie, et est due après une année complète à compter du jour de la réception lorsque le débiteur est insolvable ou tarde à payer."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin Kuveyt'teki ikinci oturumunda (Aralık 1985) alacaklar üzerine zekatla ilgili kararı: Borçlu savurganlık doluysa, borçlunun sahibinden her yıl için zekat, borçlu iflas etmiş veya ertelemişse ay yılından sonra ödenmelidir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keduanya di Kuwait (Desember 1985) mengenai Zakat atas utang: Zakat harus dibayar oleh pemilik debitur setiap tahun jika debitur penuh dengan boros, dan jatuh tempo setelah tahun lunar sejak hari penerimaan jika debitur bangkrut atau menunda-nunda."
