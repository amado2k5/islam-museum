label: { ar: "الزاهر في غريب ألفاظ الشافعي", en: "al-Zahir fi Gharib Alfaz al-Shafi'i", es: "al-Zahir fi Gharib Alfaz al-Shafi'i", fr: "al-Zahir fi Gharib Alfaz al-Shafi'i", ur: "الزاہر فی غریب الفاظ الشافعی", tr: "Al-Zaher, Alshafi'i'nin tuhaf sözleriyle", id: "Al-Zaher dalam kata-kata aneh Alshafi'i" }
summary:
  ar: "الزاهر في غريب ألفاظ الشافعي للأزهري، يشرح الألفاظ الغريبة والنادرة الواردة في «مختصر المزني»، وهو اختصار المزني، أقرب أصحاب الشافعي وتلاميذه إليه، لكتب الشافعي. وهو معجم فقهي حقّقه محمد جبر الألفي ونُشر بالكويت ١٣٩٩هـ/١٩٧٩م."
  en: "al-Azhari's al-Zahir fi gharib alfaz al-Shafi'i, which explains the rare and unusual words in al-Muzani's Mukhtasar, the abridgement of al-Shafi'i's books made by al-Muzani, al-Shafi'i's closest friend and pupil. It is a legal lexicon, edited by Muhammad Jabr al-Alfi (Kuwait 1399/1979)."
  es: "El al-Zahir fi gharib alfaz al-Shafi'i de al-Azhari, que explica las palabras raras e inusuales del Mukhtasar de al-Muzani, el compendio de los libros de al-Shafi'i hecho por al-Muzani, su amigo y discípulo más cercano. Es un léxico jurídico, editado por Muhammad Jabr al-Alfi (Kuwait 1399/1979)."
  fr: "Le al-Zahir fi gharib alfaz al-Shafi'i d'al-Azhari, qui explique les mots rares et inhabituels du Mukhtasar d'al-Muzani, abrégé des livres d'al-Shafi'i fait par al-Muzani, son plus proche ami et disciple. C'est un lexique juridique, édité par Muhammad Jabr al-Alfi (Koweït 1399/1979)."
  ur: "ازہری کی الزاہر فی غریب الفاظ الشافعی، جو مختصر المزنی کے غریب اور نادر الفاظ کی شرح کرتی ہے؛ مختصر المزنی، امام شافعی کے قریب ترین دوست اور شاگرد مزنی کی امام شافعی کی کتب سے تلخیص ہے۔ یہ فقہی لغت ہے جسے محمد جبر الالفی نے کویت 1399ھ/1979ء میں شائع کیا۔"
  tr: "Al-Zahir fi Gharib Alfaz Al-Shafi'i, Al-Azhari'nin yazdığı 'Mukhtasar al-Muzani'de bulunan nadir ve sıra dışı terimleri açıklar; bu kelime, al-Şafi'i'nin en yakın arkadaşları ve öğrencileri olan al-Muzani'nin kitaplarının kısaltmasıdır. Bu, Muhammad Jabr al-Alfi tarafından düzenlenen ve 1399 Hicri / 1979 yılında Kuveyt'te yayımlanan bir fıkıh sözlüğüdür."
  id: "Al-Zahir fi Gharib Alfaz Al-Shafi'i oleh Al-Azhari menjelaskan istilah langka dan tidak biasa yang ditemukan dalam 'Mukhtasar al-Muzani,' yang merupakan singkatan dari al-Muzani, sahabat dan murid terdekat al-Shafi'i darinya, dari buku-buku al-Shafi'i. Ini adalah kamus firisprudensi yang diedit oleh Muhammad Jabr al-Alfi dan diterbitkan di Kuwait pada tahun 1399 H / 1979 M."
