id: work/fatwa-amja-praying-in-mosque-built-on-haram
class: work
kind: fatwa
label: { ar: "الصلاة في مسجد أسس بالحرام", en: "Praying in a mosque built with unlawful funds", ur: "حرام مال سے بنائی گئی مسجد میں نماز" }
summary:
  ar: "سائل سأل عن حكم الصلاة في مسجد بني من أموال اختلط فيها الحلال بالحرام كأموال ربوية أو عوائد أنشطة محرمة. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21823 بتاريخ 14 أكتوبر 2012)⁩ أن الأصل صحة الصلاة في هذا المسجد، وإثم المال الحرام على كاسبه، إلا إذا بنيت المساجد من خالص أموال المتورطين في المكاسب المحرمة وقصد بترك الصلاة فيها الإنكار عليهم ورُجي أن يحملهم ذلك على مراجعة الحق فلا حرج — ما لم يؤد ذلك إلى ترك الجمع والجماعات."
  en: "A questioner asked about praying in a mosque built from money in which lawful and unlawful funds were mixed, such as riba income or proceeds of prohibited activities. The Assembly of Muslim Jurists of America (fatwa no. 21823, 14 October 2012) answered that in principle the prayer in such a mosque is valid, the sin of the unlawful gain resting on its earner — unless mosques were built entirely from the money of those involved in illicit earnings and boycotting prayer there is intended as censure reasonably hoped to turn them back to the right, in which case there is no harm, so long as it does not lead to abandoning Friday and congregational prayers."
  ur: "ایک سائل نے اس مسجد میں نماز کا حکم پوچھا جو ایسے مال سے بنی ہو جس میں حلال اور حرام ملے ہوں — جیسے سودی آمدنی یا حرام سرگرمیوں کی آمدن۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21823، 14 اکتوبر 2012)⁩ نے جواب دیا کہ اصولاً اس مسجد میں نماز صحیح ہے اور حرام کسب کا گناہ اس کے کمانے والے پر ہے — سوائے اس صورت کے کہ مساجد محض حرام کسب کرنے والوں کے مال سے بنی ہوں اور وہاں نماز چھوڑنے کا مقصد ان پر تنبیہ ہو جس سے ان کے حق پر لوٹنے کی امید ہو تو حرج نہیں — بشرطیکہ اس سے جمعہ اور نمازِ با جماعت نہ چھوٹے۔"
