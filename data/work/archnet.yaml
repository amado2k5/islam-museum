summary:
  ar: "مشروع رقمي مفتوح في العمارة الإسلامية والبيئة المبنية في المجتمعات المسلمة، تصوّره الآغا خان الرابع ورئيس معهد ماساتشوستس للتقنية وعميد كلية العمارة فيه سنة 1998، وأُطلق رسميًا في 27 سبتمبر 2002، وتديره منذ 2011 مؤسسة الآغا خان للثقافة ومركز توثيق الآغا خان في المعهد، وصار مفتوحًا بلا تسجيل منذ يناير 2014."
  en: "An open digital project on Islamic architecture and the built environment of Muslim societies, conceived in 1998 by Aga Khan IV, the president of MIT and the dean of its School of Architecture and Planning, officially launched on 27 September 2002, maintained since 2011 by the Aga Khan Trust for Culture and the Aga Khan Documentation Center at MIT, and open without logins since January 2014."
  ur: "اسلامی فنِ تعمیر اور مسلم معاشروں کے تعمیری ماحول کا کھلا ڈیجیٹل منصوبہ، جس کا تصور 1998 میں آغا خان چہارم، ایم آئی ٹی کے صدر اور اس کے اسکول آف آرکیٹیکچر کے ڈین نے کیا؛ 27 ستمبر 2002 کو باضابطہ اجرا؛ 2011 سے آغا خان ٹرسٹ برائے ثقافت اور ایم آئی ٹی کا آغا خان دستاویزی مرکز چلاتے ہیں؛ جنوری 2014 سے بغیر لاگ اِن کھلا۔"
