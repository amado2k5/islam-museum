label: { ar: "أحسن التقاسيم في معرفة الأقاليم", en: "Ahsan al-Taqasim fi Ma'rifat al-Aqalim", es: "Ahsan al-Taqasim fi Ma'rifat al-Aqalim", fr: "Ahsan al-Taqasim fi Ma'rifat al-Aqalim", ur: "احسن التقاسم فی معرفۃ العقل", tr: "Bölgeleri bilmede en iyi bölümler", id: "Divisi terbaik dalam mengetahui wilayah-wilayah tersebut" }
summary:
  ar: "مجلد للشيخ شمس الدين أبي عبد الله محمد بن أحمد المقدسي الحنفي؛ كتاب مرتب على الأقاليم العرفية ذكر فيه أحوال الربع المعمور وبلاده وبره وبحره وجبله ونهره وطرقه ومسالكه ومعادنه وخواصه، وقال إنه لا بد منه للمسافرين ولا غنى عنه للعلماء والرؤساء، جمعه بعدما جال ودخل الأقاليم وتفطن مساحتها بالفراسخ واستعان على ما لم يشاهده بالفحص عنه من الناس {cite:kashf-zunun-furqan p. 206}."
  en: "Al-Muqaddasi's Ahsan al-Taqasim — the division of the inhabited quarter's climes with their lands, seas, mountains, rivers, routes, mines and properties, compiled from his own travels and verified inquiry; 'indispensable to travellers, scholars and chiefs' {cite:kashf-zunun-furqan p. 206}."
  es: "El Ahsan al-Taqasim de Al-Muqaddasi — la división de los climas de la zona habitada con sus tierras, mares, montañas, ríos, rutas, minas y propiedades, compilado a partir de sus propios viajes e investigaciones verificadas; 'indispensable para viajeros, eruditos y jefes' {cite:kashf-zunun-furqan p. 206}."
  fr: "Ahsan al-Taqasim d'Al-Muqaddasi — la division des climats du quartier habité avec leurs terres, mers, montagnes, rivières, routes, mines et propriétés, compilée à partir de ses propres voyages et d'une enquête vérifiée; « indispensable aux voyageurs, aux érudits et aux chefs » {cite: kashf-zunun-furqan p. 206}."
  ur: "المقدسی کا احسن التقاسم — آباد علاقوں کے آب و ہوا کی ان کی زمینوں، سمندروں، پہاڑوں، دریاؤں، راستوں، بارودی سرنگوں اور جائیدادوں کے ساتھ تقسیم، ان کے اپنے سفر اور تصدیق شدہ تحقیقات سے مرتب کردہ؛ مسافروں، علماء اور سرداروں کے لیے ناگزیر ہے 206}۔"
  tr: "Şeyh Şemseddin Ebu Abdullah Muhammed bin Ahmed al-Maqdisi al-Hanafi tarafından yazılmış bir cilt; geleneksel bölgeler üzerine düzenlenmiş bir kitap; burada yerleşim bölgesinin koşullarını, topraklarını, topraklarını, denizlerini, dağlarını, nehirlerini, yolları, yollarını, madenlerini ve mülklerini anlatmıştır. Bunun yolcular için vazgeçilmez ve alimler ile liderler için vazgeçilmez olduğunu belirtmiştir. Bölgeleri gezdikten ve girdikten sonra, bölgeleri Farsakhlar aracılığıyla anladıktan ve insanlardan görmediği şeylerden yardım istedikten sonra derlemiştir {atıf:Kaşf-Zunun-Furqan, s. 206}."
  id: "Sebuah buku oleh Sheikh Shams al-Din Abu Abdullah Muhammad ibn Ahmad al-Maqdisi al-Hanafi; sebuah buku yang disusun tentang daerah adat, di mana ia menggambarkan kondisi kawasan berpenghuni, tanahnya, tanahnya, laut, gunung, sungai, jalan, jalur, tambang, dan properti. Ia mengatakan bahwa buku ini sangat penting bagi para pelancong dan tak tergantikan bagi para ulama dan pemimpin. Ia menyusunnya setelah melakukan perjalanan dan memasuki wilayah-wilayah tersebut, memahami wilayahnya melalui farsakh, dan mencari bantuan dari apa yang belum pernah ia lihat dari orang-orang {cite:kashf-zunun-furqan, hlm. 206}."
