structure: "Preface and introductory sections (BGA III scan pp. 11-72: the seas and rivers p. 20; names and their variants p. 34; peculiarities of the regions p. 42; the schools and the dhimma p. 47; what he witnessed p. 53; disputed places p. 56; the climes of the world and the qibla p. 68; the realm of Islam p. 72); then the fourteen regions: the Arab regions Jazirat al-Arab, Iraq (p. 123), Aqur (p. 146), Sham (p. 161), Misr (p. 203), Maghrib (p. 225), with the desert of the Arabs (p. 258); the non-Arab regions al-Mashriq (p. 270), al-Daylam (p. 363), al-Rihab, al-Jibal (p. 394), Khuzistan (p. 412), Fars (p. 430), Kirman and al-Sind (p. 484). Scan pages."
