summary:
  ar: "مجلد للشيخ شمس الدين أبي عبد الله محمد بن أحمد المقدسي الحنفي؛ كتاب مرتب على الأقاليم العرفية ذكر فيه أحوال الربع المعمور وبلاده وبره وبحره وجبله ونهره وطرقه ومسالكه ومعادنه وخواصه، وقال إنه لا بد منه للمسافرين ولا غنى عنه للعلماء والرؤساء، جمعه بعدما جال ودخل الأقاليم وتفطن مساحتها بالفراسخ واستعان على ما لم يشاهده بالفحص عنه من الناس {cite:kashf-zunun-furqan p. 206}."
  en: "Al-Muqaddasi's Ahsan al-Taqasim — the division of the inhabited quarter's climes with their lands, seas, mountains, rivers, routes, mines and properties, compiled from his own travels and verified inquiry; 'indispensable to travellers, scholars and chiefs' {cite:kashf-zunun-furqan p. 206}."
