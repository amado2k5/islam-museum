id: work/fatwa-dar-alifta-eg-selling-udhiyya-before-slaughter
class: work
kind: fatwa
label: { ar: "حكم بيع الأضحية بعد شرائها وقبل ذبحها", en: "Selling the udhiyya after buying it, before slaughter", ur: "قربانی کا جانور خریدنے کے بعد ذبح سے پہلے بیچنا", es: "Vender el udhiyya después de comprarlo, antes del sacrificio." }
summary:
  ar: "سائل سأل عن بيع الأضحية بعد شرائها وقبل ذبحها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21920)⁩ أن الأضحية من الشعائر المسنونة ولا تتعين بمجرد نية الأضحية المصاحبة للشراء ويجوز بيعها لمن اشتراها ثم اشترى غيرها على ما فصّل الجواب."
  en: "A questioner asked about selling the udhiyya animal after buying it and before slaughtering. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21920) answered that the udhiyya is a commended rite and does not become designated merely by the intention accompanying purchase; the buyer may sell it and buy another — as the answer details."
  ur: "ایک سائل نے قربانی کا جانور خریدنے کے بعد ذبح سے پہلے بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21920)⁩ نے جواب دیا کہ قربانی مستحب شعائر میں ہے اور خرید کے ساتھ ہونے والی نیت سے وہ مخصوص نہیں ہو جاتا؛ خریدار اسے بیچ کر دوسرا خرید سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de vender el animal de la udhiyya después de comprarlo y antes de sacrificarlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21920) respondió que la udhiyya es un rito recomendable y no se designa simplemente por la intención que acompaña a la compra; el comprador puede venderlo y comprar otro, como se detalla en la respuesta."
