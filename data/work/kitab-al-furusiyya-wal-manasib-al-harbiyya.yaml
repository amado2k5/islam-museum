summary:
  ar: "مصنّف عسكري للحسن الرماح نجم الدين الأحدب ⁦(ت 1294-1295م)⁩، محفوظ في مخطوطتين بباريس ⁦(BN ancien fonds 2825 وfonds Asselin 643)⁩ مزخرفتين بصور ملوّنة؛ أهم أبوابه النيرنجيات والنيران الاصطناعية، وفيه وصف تطهير الملح برماد الخشب والتبلور، دون أي سلاح ناري {cite:partington-greek-fire-gunpowder-1960}."
  en: "A military treatise by al-Hasan al-Rammah Najm al-Din al-Ahdab ⁦(d. 1294-95)⁩, preserved in two Paris manuscripts ⁦(BN ancien fonds 2825 and fonds Asselin 643)⁩ with coloured figures; its most important sections concern pyrotechnics and artificial fires, including saltpetre purification with wood ashes and crystallisation, but no firearm {cite:partington-greek-fire-gunpowder-1960}."
  ur: "حسن رماح نجم الدین احدب ⁦(وفات 1294-95)⁩ کی جنگی رسالہ، پیرس کے دو مخطوطوں ⁦(BN ancien fonds 2825 اور fonds Asselin 643)⁩ میں رنگین تصویروں کے ساتھ محفوظ؛ اہم ترین ابواب نیرنگی اور مصنوعی آگوں پر ہیں جن میں ملح کی تصفیہ شامل ہے، مگر کوئی اسلحہ ناری نہیں {cite:partington-greek-fire-gunpowder-1960}۔"
  es: "Un tratado militar de al-Hasan al-Rammah Najm al-Din al-Ahdab (m. 1294-95), conservado en dos manuscritos de París (BN ancien fonds 2825 y fonds Asselin 643) con figuras coloreadas; sus secciones más importantes tratan sobre pirotecnia y fuegos artificiales, incluyendo la purificación del salitre con cenizas de madera y la cristalización, pero no sobre armas de fuego {cite:partington-greek-fire-gunpowder-1960}."
  fr: "Un traité militaire d'al-Hasan al-Rammah Najm al-Din al-Ahdab (mort en 1294-95), conservé dans deux manuscrits parisiens (BN ancien fonds 2825 et fonds Asselin 643) avec des figures en couleur; ses sections les plus importantes concernent la pyrotechnie et les feux artificiels, y compris la purification du salpêtre avec des cendres de bois et la cristallisation, mais pas d'armes à feu {cite:partington-greek-fire-gunpowder-1960}."
  tr: "Al-Hasan al-Rimah Najm al-Din al-Ahdab'ın (ö. 1294-1295) askeri eseri, iki Paris el yazmasında (BN ancien fonds 2825 ve fonds Asselin 643) korunmuş, renkli resimlerle süslenmiştir; ana bölümleri Nirangiyat ve yapay ateşlerdir ve odun külü ile tuzun arıtılması ve herhangi bir ateşli silah olmadan kristalleşmesini anlatır {cite:partington-greek-fire-gunpowder-1960}."
  id: "Sebuah karya militer oleh Al-Hasan al-Rimah Najm al-Din al-Ahdab (wafat 1294-1295 M), yang disimpan dalam dua manuskrip Paris (BN ancien fonds 2825 dan fonds Asselin 643), dihiasi dengan gambar berwarna-warni; bagian utamanya adalah Nirangiyat dan api buatan, dan menggambarkan pemurnian garam dengan abu kayu dan kristalisasi, tanpa senjata api {cite:partington-greek-fire-gunpowder-1960}."
