id: work/fatwa-dar-alifta-eg-selling-debt-deferred
class: work
kind: fatwa
label: { ar: "حكم بيع الدين لغير المدين بثمن مؤجل", en: "Selling a debt to a third party for a deferred price", ur: "قرض تیسرے فریق کو مؤجل قیمت پر بیچنا", es: "Vender una deuda a un tercero a un precio diferido.", fr: "Vendre une créance à un tiers à un prix différé" }
summary:
  ar: "سائل سأل عن بيع الدين المستقر في ذمة المشتري لطرف ثالث بثمن مؤجل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22127)⁩ أن ذلك محرم شرعًا لأنه يندرج تحت بيع الكالئ بالكالئ المنهي عنه، على ما فصّل الجواب."
  en: "A questioner asked about selling a debt established on the buyer to a third party for a deferred price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22127) answered that this is forbidden — it falls under the sale of debt for debt that the texts prohibit, as the answer details."
  ur: "ایک سائل نے خریدار کے ذمے قائم قرض کو تیسرے فریق کو مؤجل قیمت پر بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22127)⁩ نے جواب دیا کہ یہ حرام ہے کیونکہ وہ ممنوع 'دین بدین' کے فروخت میں داخل ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de vender una deuda contraída con el comprador a un tercero a plazos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22127) respondió que esto está prohibido, ya que se considera una venta de deuda por deuda, tal como lo detalla la respuesta."
  fr: "Un internaute a posé une question concernant la vente d'une dette contractée par l'acheteur à un tiers à un prix différé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22127) a répondu que cela est interdit: il s'agit d'une vente de dette contre dette, prohibée par les textes, comme le précise la réponse."
