id: work/fatwa-amja-sneezing-non-muslim-bless
class: work
kind: fatwa
label: { ar: "تشميت العاطس غير المسلم", en: "Blessing a sneezing non-Muslim", ur: "غیر مسلم چھینکنے والے کو دعا", es: "Bendecir a un no musulmán que estornuda", fr: "Bénir un non-musulman qui éternue" }
summary:
  ar: "سأل سائل هل يجوز تشميت العاطس غير المسلم بما تعارفوا عليه من ألفاظ مثل Bless you في أمريكا وليس فيها دعاء لهم بالرحمة ولا بالمغفرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23201 بتاريخ 24 يونيو 2008)⁩ أن أبا داود أخرج وصححه الحاكم من حديث أبي موسى الأشعري أن اليهود كانوا يتعاطسون عند النبي رجاء أن يقول يرحمكم الله فكان يقول يهديكم الله ويصلح بالكم، ونقل عن ابن دقيق العيد أن من قال إن التشميت الدعاء بالخير دخل الكفار في عموم الأمر به ومن خصه بالرحمة لم يدخلوا، وابن حجر قال إن هذا البحث أنشأه من حيث اللغة وأما من حيث الشرع فحديث أبي موسى دال على أنهم يدخلون في مطلق الأمر بالتشميت."
  en: "A questioner asked whether one may bless a sneezing non-Muslim with their customary phrases like 'Bless you' in America, which contain no prayer for mercy or forgiveness. Dr. Salah al-Sawi (fatwa no. 23201, 24 June 2008) answered that Abu Dawud narrated — al-Hakim grading it sound — Abu Musa al-Ash'ari's report that the Jews used to sneeze before the Prophet hoping he would say 'God have mercy on you', and he would say 'God guide you and mend your state'; Ibn Daqiq al-Id noted that those who make tashmit a prayer of good bring the disbelievers into the command's generality, while those limiting it to mercy do not; and Ibn Hajar held that legally Abu Musa's hadith shows they enter the general command to bless."
  ur: "ایک سائل نے غیر مسلم چھینکنے والے کو «Bless you» کہنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23201، 24 جون 2008)⁩ کے مطابق ابوداؤد کی روایت میں نبی یہودیوں کو «اللہ ہدایت دے اور حال سنوارے» کہتے تھے — خیر کی دعا جائز ہے۔"
  es: "Un consultante preguntó si se puede bendecir a un no musulmán que estornuda con frases habituales como \"Salud\" en Estados Unidos, que no contienen ninguna oración de misericordia o perdón. El Dr. Salah al-Sawi (fatwa n.º 23201, 24 de junio de 2008) respondió que Abu Dawud narró —al-Hakim lo calificó como sólido— el relato de Abu Musa al-Ash'ari de que los judíos solían estornudar ante el Profeta con la esperanza de que dijera \"Dios tenga misericordia de ti\", y él decía \"Dios te guíe y mejore tu estado\"; Ibn Daqiq al-Id señaló que quienes hacen del tashmit una oración de bien incluyen a los incrédulos en la generalidad del mandato, mientras que quienes lo limitan a la misericordia no lo hacen; e Ibn Hajar sostuvo que legalmente el hadiz de Abu Musa muestra que entran en el mandato general de bendecir."
  fr: "Un internaute a demandé si l'on pouvait bénir un non-musulman qui éternue en utilisant les formules de politesse habituelles comme « À vos souhaits » en Amérique, qui ne contiennent aucune invocation de miséricorde ou de pardon. Le Dr Salah al-Sawi (fatwa n° 23201, 24 juin 2008) a répondu qu'Abou Dawoud avait rapporté – al-Hakim autorisant ce hadith – le récit d'Abou Moussa al-Ash'ari selon lequel les Juifs éternuaient devant le Prophète en espérant qu'il dirait « Que Dieu vous fasse miséricorde », et qu'il répondait « Que Dieu vous guide et améliore votre situation ». Ibn Daqiq al-Id a noté que ceux qui font de la bénédiction une prière de bienfaisance incluent les non-croyants dans la portée générale de ce commandement, tandis que ceux qui la limitent à la miséricorde ne le font pas. Enfin, Ibn Hajar a soutenu que, juridiquement, le hadith d'Abou Moussa démontre qu'ils relèvent du commandement général de bénir."
