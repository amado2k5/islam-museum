id: work/fatwa-amja-sneezing-non-muslim-bless
class: work
kind: fatwa
label: { ar: "تشميت العاطس غير المسلم", en: "Blessing a sneezing non-Muslim", ur: "غیر مسلم چھینکنے والے کو دعا" }
summary:
  ar: "سأل سائل هل يجوز تشميت العاطس غير المسلم بما تعارفوا عليه من ألفاظ مثل Bless you في أمريكا وليس فيها دعاء لهم بالرحمة ولا بالمغفرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23201 بتاريخ 24 يونيو 2008)⁩ أن أبا داود أخرج وصححه الحاكم من حديث أبي موسى الأشعري أن اليهود كانوا يتعاطسون عند النبي رجاء أن يقول يرحمكم الله فكان يقول يهديكم الله ويصلح بالكم، ونقل عن ابن دقيق العيد أن من قال إن التشميت الدعاء بالخير دخل الكفار في عموم الأمر به ومن خصه بالرحمة لم يدخلوا، وابن حجر قال إن هذا البحث أنشأه من حيث اللغة وأما من حيث الشرع فحديث أبي موسى دال على أنهم يدخلون في مطلق الأمر بالتشميت."
  en: "A questioner asked whether one may bless a sneezing non-Muslim with their customary phrases like 'Bless you' in America, which contain no prayer for mercy or forgiveness. Dr. Salah al-Sawi (fatwa no. 23201, 24 June 2008) answered that Abu Dawud narrated — al-Hakim grading it sound — Abu Musa al-Ash'ari's report that the Jews used to sneeze before the Prophet hoping he would say 'God have mercy on you', and he would say 'God guide you and mend your state'; Ibn Daqiq al-Id noted that those who make tashmit a prayer of good bring the disbelievers into the command's generality, while those limiting it to mercy do not; and Ibn Hajar held that legally Abu Musa's hadith shows they enter the general command to bless."
  ur: "ایک سائل نے غیر مسلم چھینکنے والے کو «Bless you» کہنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23201، 24 جون 2008)⁩ کے مطابق ابوداؤد کی روایت میں نبی یہودیوں کو «اللہ ہدایت دے اور حال سنوارے» کہتے تھے — خیر کی دعا جائز ہے۔"
