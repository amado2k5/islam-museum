class: work
kind: fatwa
label: { ar: "حكم ترك صلاة الجمعة بسبب البرد الشديد والمطر", en: "Missing Friday prayer for severe cold and rain", ur: "شدید سردی اور بارش کی وجہ سے جمعہ چھوڑنا", es: "Falta la oración del viernes por el fuerte frío y la lluvia." }
summary:
  ar: "سائل سأل عن ترك صلاة الجمعة بسبب البرد الشديد والمطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21687)⁩ أنه يجوز ترك الجمعة بسبب المطر الذي يحدث وحلًا ويصعب معه حضورها في المسجد أو خوف البرد الشديد الذي لا يُحتمل على ما فصّل الجواب."
  en: "A questioner asked about leaving Friday prayer for severe cold and rain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21687) answered that one may miss it for rain that makes the ground muddy and attending the mosque hard, or fear of unbearable severe cold — as the answer details."
  ur: "ایک سائل نے شدید سردی اور بارش کی وجہ سے جمعہ ترک کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21687)⁩ نے جواب دیا کہ ایسی بارش جس سے کیچڑ ہو اور مسجد جانا مشکل ہو یا ناقابلِ برداشت سردی کے خوف سے جمعہ چھوڑنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de no asistir a la oración del viernes debido al frío intenso y la lluvia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21687) respondió que se puede faltar si la lluvia enloda el suelo y dificulta la asistencia a la mezquita, o por temor a un frío intenso e insoportable, como se detalla en la respuesta."
