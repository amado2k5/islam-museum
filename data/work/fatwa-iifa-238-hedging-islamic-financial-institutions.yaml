label: { ar: "قرار مجمع الفقه الإسلامي الدولي 238 (24/9) بشأن عمليات التحوط في المؤسسات المالية الإسلامية", en: "IIFA resolution 238 (24/9) on hedging operations in Islamic financial institutions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 238 (24/9): اسلامی مالیاتی اداروں میں ہیجنگ کے عمل", es: "Resolución 238 (24/9) de la IIFA sobre operaciones de cobertura en instituciones financieras islámicas." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩، بعد اطلاعه على توصيات ندوته العلمية في التحوط ⁦(جدّة، 24–25 رجب 1440هـ، 31 مارس – 1 أبريل 2019م)⁩. أكد المجمع قراره 224 ⁦(23/8)⁩ في التحوط بجميع فقراته ⁦(مفاهيم التحوط والخطر والحماية، موقف الشريعة، الضوابط الشرعية للصيغ والأساليب)⁩. وقرر أن من معاملات التحوط الجائزة: التحوط الاقتصادي القائم على تنويع الأصول والمحافظ وهو مطلوب شرعًا لحسن إدارة الموارد؛ التحوط التعاوني عبر التأمين التكافلي تأكيدًا لقراري 9 ⁦(2/9)⁩ و200 ⁦(21/6)⁩؛ التحوط التعاقدي الموازي ⁦(السلم والاستصناع الموازيين)⁩ بشرط استقلال كل عقد عن الآخر في حقوقه والتزاماته؛ العقود المركبة بالاقتران لا بالشرط كالجمع بين المرابحة والمشاركة والإجارة والمشاركة والمرابحة وبيع العربون مع ضوابط العربون؛ التحوط بخيار الشرط من نكول العميل مع إعطاء الخيار للطرف الآخر؛ والتحوط بصيغ الضمان لوقاية رأس المال. ومن الممنوع: التحوط بالقروض المتبادلة بعملتين بالشرط وهو إقراض بشرط إقراض مجمع على منعه؛ وتحوطات ضمان رأس المال في الأسهم والصكوك كضمان القيمة الاسمية من المُصدر، وتعهد المضارب بإقراض المحفظة، ومنع حملة الصكوك من التصرف، وعدم نقل ملكية الأصول إليهم، واشتراط إقراض المدير لهم عند نقص الربح — لمخالفتها قراري 30 ⁦(4/5)⁩ و188 ⁦(20/3)⁩ ولعدم تحمل المستثمرين الغرم مقابل الغنم. وفصّل أدوات التحوط البديلة للمشتقات فمنع المواعدة الملزمة والوعود المتقابلة والإيجاب الممتد والتورق المتقابل في الصرف ومبادلات مؤشرات الأسعار، لاشتمالها على ما منعته قراراته في بيع العملات آجلًا والمواعدة الملزمة والتورق ⁦(قرارات 102، 40، 52، 157، 179)⁩. وأوصى المجالس الشرعية وهيئات الفتوى بمراعاة مقاصد الشريعة، وإدارات الاستثمار والخزينة والجهات الرقابية بضوابط التحوط الشرعية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019), after reviewing the recommendations of its scholarly seminar on hedging in Islamic financial institutions (Jeddah, 24–25 Rajab 1440, 31 March – 1 April 2019). It reaffirmed in full its resolution 224 (23/8) on hedging — the concepts of hedging, risk and protection, the sharia's position, and the legal controls on its forms and methods. It held permissible, as general hedging transactions: economic hedging through diversification of assets, portfolios and structures — legally required for good resource management; cooperative hedging through takaful insurance, affirming resolutions 9 (2/9) and 200 (21/6); parallel contractual hedging (parallel salam and istisna') provided each contract stays independent of the other in rights and obligations; compound contracts joined by conjunction not condition — murabaha with musharaka, ijara with musharaka, murabaha with earnest-money sale observing its controls; hedging through khiyar al-shart against a client's default with the option given to the other party; and guarantee structures protecting invested capital. It held prohibited: hedging through mutually conditioned loans in two currencies — a 'lend me and I lend you' arrangement agreed forbidden; and hedges guaranteeing capital in shares and sukuk, such as the issuer guaranteeing nominal value, the mudarib undertaking to lend to the portfolio, barring sukuk holders from disposing of assets, not transferring asset ownership to investors, and conditioning a manager loan on low profits — all contrary to resolutions 30 (4/5) and 188 (20/3) because investors bear no risk for the gain. It detailed alternative-to-derivative instruments, forbidding for currency and interest-rate-index hedging the binding mutual promise, reciprocal promises, the extended offer and paired tawarruq, per its resolutions 102, 40, 52, 157 and 179 on forward currency sales, binding promises and tawarruq. It recommended that sharia boards, fatwa bodies and scholars keep the objectives of the sharia in view, and investment, treasury and supervisory bodies observe the legal controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں، جدہ میں منعقدہ ہیجنگ کی علمی ندوات ⁦(24–25 رجب 1440ھ، 31 مارچ – 1 اپریل 2019ء)⁩ کی سفارشات کے بعد۔ اس نے اپنی قرارداد 224 ⁦(23/8)⁩ ⁦(مالی معاملات میں ہیجنگ: ضوابط اور احکام)⁩ کو ہر شق میں دہرایا۔ جائز ہیجنگ صورتوں میں اس نے شمار کیا: اثاثوں اور پورٹ فولیوز کی تنوع پر مبنی معاشی ہیجنگ — وسائل کے حسن انتظام کے لیے شرعاً مطلوب؛ تکافلی انشورنس کے ذریعے تعاونی ہیجنگ، قراردادیں 9 ⁦(2/9)⁩ اور 200 ⁦(21/6)⁩ کی تائید میں؛ متوازی معاہداتی ہیجنگ ⁦(سلم و استصناعِ متوازی)⁩ بشرطیکہ ہر معاہدہ حقوق و التزامات میں آزاد ہو؛ شرط کے بجائے اقتران سے جڑے مرکب معاہدے مثل مرابحہ مع مشارکہ، اجارہ مع مشارکہ، مرابحہ مع بیعِ عربوں عربی ضوابط کے ساتھ؛ کلائنٹ کی انحرافی صورت میں خیارِ شرط سے ہیجنگ جس میں دوسرے فریق کو اختیار دیا جائے؛ اور سرمایہ کے تحفظ کے لیے ضمانت کی صورتیں۔ ممنوع میں: دو کرنسیوں میں شرط لگا کر باہمی قرضوں کی ہیجنگ — یعنی ⁦«مجھے قرض دو، میں تمھیں قرض دوں»⁩ جس کی ممنوعیت پر اتفاق ہے؛ اور حصص و صکوک میں سرمایے کی ضمانت کی ہیجنگیں مثل جاری کنندہ کا اصلی قدر کی ضمانت، مضارب کا پورٹ فولیو کو قرض دینے کا عہد، صکوک داروں کو تصرف سے روکنا، اثاثوں کی ملکیت سرمایہ داروں کو منتقل نہ کرنا، اور منافع کم ہونے پر مینیجر کے قرض کی شرط — یہ سب قراردادیں 30 ⁦(4/5)⁩ اور 188 ⁦(20/3)⁩ کی خلاف ورزی ہے کیونکہ سرمایہ دار منفعت کے بدل خطرہ نہیں اٹھاتے۔ اس نے مشتقات کے متبادل اوزار تفصیل کر دیے اور کرنسی اور شرح سود کے اشاریوں کی ہیجنگ میں پابند باہمی وعدہ، متقابل وعدے، طویل پیشکش اور متقابل تورق ممنوع قرار دیے — اپنی قراردادیں 102، 40، 52، 157 اور 179 کے مطابق۔ سفارشات میں شرعی بورڈز، ادارۂ فتویٰ اور محققین سے مقاصدِ شریعت کی رعایت اور سرمایہ کاری، خزانہ اور نگران اداروں سے شرعی ضوابط کی پابندی شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019), tras revisar las recomendaciones de su seminario académico sobre cobertura en instituciones financieras islámicas (Yeda, 24-25 Rajab 1440, 31 de marzo - 1 de abril de 2019). Reafirmó en su totalidad su resolución 224 (23/8) sobre cobertura: los conceptos de cobertura, riesgo y protección, la posición de la sharia y los controles legales sobre sus formas y métodos. Mantuvo permisibles, como transacciones de cobertura general: cobertura económica a través de la diversificación de activos, carteras y estructuras, legalmente requerida para una buena gestión de recursos; cobertura cooperativa a través del seguro takaful, afirmando las resoluciones 9 (2/9) y 200 (21/6); cobertura contractual paralela (salam paralelo e istisna') siempre que cada contrato permanezca independiente del otro en derechos y obligaciones; Contratos compuestos unidos por conjunción no condición — murabaha con musharaka, ijara con musharaka, murabaha con venta de arras observando sus controles; cobertura a través de khiyar al-shart contra el incumplimiento de un cliente con la opción dada a la otra parte; y estructuras de garantía que protegen el capital invertido. Sostuvo prohibido: cobertura a través de préstamos mutuamente condicionados en dos monedas — un acuerdo de 'préstame y te presto' acordado prohibido; y coberturas que garantizan capital en acciones y sukuk, tales como el emisor garantiza el valor nominal, el mudarib se compromete a prestar a la cartera, prohíbe a los tenedores de sukuk disponer de activos, no transfiere la propiedad de los activos a los inversores y condiciona un préstamo del administrador a bajas ganancias — todo contrario a las resoluciones 30 (4/5) y 188 (20/3) porque los inversores no asumen ningún riesgo por la ganancia. Detalló instrumentos alternativos a los derivados, prohibiendo para la cobertura de divisas e índices de tipos de interés la promesa mutua vinculante, las promesas recíprocas, la oferta extendida y el tawarruq emparejado, según sus resoluciones 102, 40, 52, 157 y 179 sobre ventas de divisas a plazo, promesas vinculantes y tawarruq. Recomendó que los consejos de la sharia, los organismos de fatwa y los eruditos tengan presentes los objetivos de la sharia, y que los organismos de inversión, tesorería y supervisión observen los controles legales."
