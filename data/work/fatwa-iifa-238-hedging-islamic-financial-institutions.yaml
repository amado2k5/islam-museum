label: { ar: "قرار مجمع الفقه الإسلامي الدولي 238 (24/9) بشأن عمليات التحوط في المؤسسات المالية الإسلامية", en: "IIFA resolution 238 (24/9) on hedging operations in Islamic financial institutions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 238 (24/9): اسلامی مالیاتی اداروں میں ہیجنگ کے عمل", es: "Resolución 238 (24/9) de la IIFA sobre operaciones de cobertura en instituciones financieras islámicas.", fr: "Résolution 238 (24/9) de l'IIFA sur les opérations de couverture dans les institutions financières islamiques", tr: "İslami finans kurumlarında riskten korunma işlemlerine ilişkin Uluslararası İslami Fiqh Akademisi Kararı 238 (24/9)", id: "Resolusi Akademi Fiqh Islam Internasional 238 (24/9) mengenai operasi lindung nilai di lembaga keuangan Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩، بعد اطلاعه على توصيات ندوته العلمية في التحوط ⁦(جدّة، 24–25 رجب 1440هـ، 31 مارس – 1 أبريل 2019م)⁩. أكد المجمع قراره 224 ⁦(23/8)⁩ في التحوط بجميع فقراته ⁦(مفاهيم التحوط والخطر والحماية، موقف الشريعة، الضوابط الشرعية للصيغ والأساليب)⁩. وقرر أن من معاملات التحوط الجائزة: التحوط الاقتصادي القائم على تنويع الأصول والمحافظ وهو مطلوب شرعًا لحسن إدارة الموارد؛ التحوط التعاوني عبر التأمين التكافلي تأكيدًا لقراري 9 ⁦(2/9)⁩ و200 ⁦(21/6)⁩؛ التحوط التعاقدي الموازي ⁦(السلم والاستصناع الموازيين)⁩ بشرط استقلال كل عقد عن الآخر في حقوقه والتزاماته؛ العقود المركبة بالاقتران لا بالشرط كالجمع بين المرابحة والمشاركة والإجارة والمشاركة والمرابحة وبيع العربون مع ضوابط العربون؛ التحوط بخيار الشرط من نكول العميل مع إعطاء الخيار للطرف الآخر؛ والتحوط بصيغ الضمان لوقاية رأس المال. ومن الممنوع: التحوط بالقروض المتبادلة بعملتين بالشرط وهو إقراض بشرط إقراض مجمع على منعه؛ وتحوطات ضمان رأس المال في الأسهم والصكوك كضمان القيمة الاسمية من المُصدر، وتعهد المضارب بإقراض المحفظة، ومنع حملة الصكوك من التصرف، وعدم نقل ملكية الأصول إليهم، واشتراط إقراض المدير لهم عند نقص الربح — لمخالفتها قراري 30 ⁦(4/5)⁩ و188 ⁦(20/3)⁩ ولعدم تحمل المستثمرين الغرم مقابل الغنم. وفصّل أدوات التحوط البديلة للمشتقات فمنع المواعدة الملزمة والوعود المتقابلة والإيجاب الممتد والتورق المتقابل في الصرف ومبادلات مؤشرات الأسعار، لاشتمالها على ما منعته قراراته في بيع العملات آجلًا والمواعدة الملزمة والتورق ⁦(قرارات 102، 40، 52، 157، 179)⁩. وأوصى المجالس الشرعية وهيئات الفتوى بمراعاة مقاصد الشريعة، وإدارات الاستثمار والخزينة والجهات الرقابية بضوابط التحوط الشرعية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019), after reviewing the recommendations of its scholarly seminar on hedging in Islamic financial institutions (Jeddah, 24–25 Rajab 1440, 31 March – 1 April 2019). It reaffirmed in full its resolution 224 (23/8) on hedging — the concepts of hedging, risk and protection, the sharia's position, and the legal controls on its forms and methods. It held permissible, as general hedging transactions: economic hedging through diversification of assets, portfolios and structures — legally required for good resource management; cooperative hedging through takaful insurance, affirming resolutions 9 (2/9) and 200 (21/6); parallel contractual hedging (parallel salam and istisna') provided each contract stays independent of the other in rights and obligations; compound contracts joined by conjunction not condition — murabaha with musharaka, ijara with musharaka, murabaha with earnest-money sale observing its controls; hedging through khiyar al-shart against a client's default with the option given to the other party; and guarantee structures protecting invested capital. It held prohibited: hedging through mutually conditioned loans in two currencies — a 'lend me and I lend you' arrangement agreed forbidden; and hedges guaranteeing capital in shares and sukuk, such as the issuer guaranteeing nominal value, the mudarib undertaking to lend to the portfolio, barring sukuk holders from disposing of assets, not transferring asset ownership to investors, and conditioning a manager loan on low profits — all contrary to resolutions 30 (4/5) and 188 (20/3) because investors bear no risk for the gain. It detailed alternative-to-derivative instruments, forbidding for currency and interest-rate-index hedging the binding mutual promise, reciprocal promises, the extended offer and paired tawarruq, per its resolutions 102, 40, 52, 157 and 179 on forward currency sales, binding promises and tawarruq. It recommended that sharia boards, fatwa bodies and scholars keep the objectives of the sharia in view, and investment, treasury and supervisory bodies observe the legal controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں، جدہ میں منعقدہ ہیجنگ کی علمی ندوات ⁦(24–25 رجب 1440ھ، 31 مارچ – 1 اپریل 2019ء)⁩ کی سفارشات کے بعد۔ اس نے اپنی قرارداد 224 ⁦(23/8)⁩ ⁦(مالی معاملات میں ہیجنگ: ضوابط اور احکام)⁩ کو ہر شق میں دہرایا۔ جائز ہیجنگ صورتوں میں اس نے شمار کیا: اثاثوں اور پورٹ فولیوز کی تنوع پر مبنی معاشی ہیجنگ — وسائل کے حسن انتظام کے لیے شرعاً مطلوب؛ تکافلی انشورنس کے ذریعے تعاونی ہیجنگ، قراردادیں 9 ⁦(2/9)⁩ اور 200 ⁦(21/6)⁩ کی تائید میں؛ متوازی معاہداتی ہیجنگ ⁦(سلم و استصناعِ متوازی)⁩ بشرطیکہ ہر معاہدہ حقوق و التزامات میں آزاد ہو؛ شرط کے بجائے اقتران سے جڑے مرکب معاہدے مثل مرابحہ مع مشارکہ، اجارہ مع مشارکہ، مرابحہ مع بیعِ عربوں عربی ضوابط کے ساتھ؛ کلائنٹ کی انحرافی صورت میں خیارِ شرط سے ہیجنگ جس میں دوسرے فریق کو اختیار دیا جائے؛ اور سرمایہ کے تحفظ کے لیے ضمانت کی صورتیں۔ ممنوع میں: دو کرنسیوں میں شرط لگا کر باہمی قرضوں کی ہیجنگ — یعنی ⁦«مجھے قرض دو، میں تمھیں قرض دوں»⁩ جس کی ممنوعیت پر اتفاق ہے؛ اور حصص و صکوک میں سرمایے کی ضمانت کی ہیجنگیں مثل جاری کنندہ کا اصلی قدر کی ضمانت، مضارب کا پورٹ فولیو کو قرض دینے کا عہد، صکوک داروں کو تصرف سے روکنا، اثاثوں کی ملکیت سرمایہ داروں کو منتقل نہ کرنا، اور منافع کم ہونے پر مینیجر کے قرض کی شرط — یہ سب قراردادیں 30 ⁦(4/5)⁩ اور 188 ⁦(20/3)⁩ کی خلاف ورزی ہے کیونکہ سرمایہ دار منفعت کے بدل خطرہ نہیں اٹھاتے۔ اس نے مشتقات کے متبادل اوزار تفصیل کر دیے اور کرنسی اور شرح سود کے اشاریوں کی ہیجنگ میں پابند باہمی وعدہ، متقابل وعدے، طویل پیشکش اور متقابل تورق ممنوع قرار دیے — اپنی قراردادیں 102، 40، 52، 157 اور 179 کے مطابق۔ سفارشات میں شرعی بورڈز، ادارۂ فتویٰ اور محققین سے مقاصدِ شریعت کی رعایت اور سرمایہ کاری، خزانہ اور نگران اداروں سے شرعی ضوابط کی پابندی شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019), tras revisar las recomendaciones de su seminario académico sobre cobertura en instituciones financieras islámicas (Yeda, 24-25 Rajab 1440, 31 de marzo - 1 de abril de 2019). Reafirmó en su totalidad su resolución 224 (23/8) sobre cobertura: los conceptos de cobertura, riesgo y protección, la posición de la sharia y los controles legales sobre sus formas y métodos. Mantuvo permisibles, como transacciones de cobertura general: cobertura económica a través de la diversificación de activos, carteras y estructuras, legalmente requerida para una buena gestión de recursos; cobertura cooperativa a través del seguro takaful, afirmando las resoluciones 9 (2/9) y 200 (21/6); cobertura contractual paralela (salam paralelo e istisna') siempre que cada contrato permanezca independiente del otro en derechos y obligaciones; Contratos compuestos unidos por conjunción no condición — murabaha con musharaka, ijara con musharaka, murabaha con venta de arras observando sus controles; cobertura a través de khiyar al-shart contra el incumplimiento de un cliente con la opción dada a la otra parte; y estructuras de garantía que protegen el capital invertido. Sostuvo prohibido: cobertura a través de préstamos mutuamente condicionados en dos monedas — un acuerdo de 'préstame y te presto' acordado prohibido; y coberturas que garantizan capital en acciones y sukuk, tales como el emisor garantiza el valor nominal, el mudarib se compromete a prestar a la cartera, prohíbe a los tenedores de sukuk disponer de activos, no transfiere la propiedad de los activos a los inversores y condiciona un préstamo del administrador a bajas ganancias — todo contrario a las resoluciones 30 (4/5) y 188 (20/3) porque los inversores no asumen ningún riesgo por la ganancia. Detalló instrumentos alternativos a los derivados, prohibiendo para la cobertura de divisas e índices de tipos de interés la promesa mutua vinculante, las promesas recíprocas, la oferta extendida y el tawarruq emparejado, según sus resoluciones 102, 40, 52, 157 y 179 sobre ventas de divisas a plazo, promesas vinculantes y tawarruq. Recomendó que los consejos de la sharia, los organismos de fatwa y los eruditos tengan presentes los objetivos de la sharia, y que los organismos de inversión, tesorería y supervisión observen los controles legales."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019), après examen des recommandations de son séminaire scientifique sur la couverture dans les institutions financières islamiques (Djeddah, 24-25 Rajab 1440, 31 mars – 1er avril 2019). Elle a réaffirmé intégralement sa résolution 224 (23/8) sur la couverture – les concepts de couverture, de risque et de protection, la position de la charia et les contrôles juridiques sur ses formes et méthodes. Elle a jugé licites, en tant qu'opérations de couverture générales: la couverture économique par diversification des actifs, des portefeuilles et des structures – légalement requise pour une bonne gestion des ressources; la couverture coopérative par assurance takaful, confirmant les résolutions 9 (2/9) et 200 (21/6); la couverture contractuelle parallèle (salam et istisna' parallèles) à condition que chaque contrat reste indépendant de l'autre en termes de droits et d'obligations. Les contrats composés unis par conjonction et non par condition – murabaha avec musharaka, ijara avec musharaka, murabaha avec vente d'acompte sous réserve du respect de ses contrôles; la couverture par khiyar al-shart contre le défaut d'un client avec option accordée à l'autre partie; et les structures de garantie protégeant le capital investi. La Cour a jugé interdits: la couverture par des prêts mutuellement conditionnés en deux devises – un accord de type « prêt réciproque » – et les couvertures garantissant le capital en actions et sukuk, telles que la garantie de la valeur nominale par l'émetteur, l'engagement du mudarib à prêter au portefeuille, l'interdiction faite aux détenteurs de sukuk de disposer des actifs, le non-transfert de la propriété des actifs aux investisseurs et la conditionnalité d'un prêt du gestionnaire à de faibles profits – toutes ces pratiques étant contraires aux résolutions 30 (4/5) et 188 (20/3) car les investisseurs ne supportent aucun risque en contrepartie du gain. Elle détaillait les instruments alternatifs aux produits dérivés, interdisant, pour la couverture des taux de change et des indices de taux d'intérêt, les promesses mutuelles contraignantes, les promesses réciproques, l'offre étendue et le tawarruq apparié, conformément à ses résolutions 102, 40, 52, 157 et 179 relatives aux ventes de devises à terme, aux promesses contraignantes et au tawarruq. Elle recommandait aux conseils de la charia, aux instances de fatwa et aux oulémas de garder à l'esprit les objectifs de la charia, et aux organismes d'investissement, de trésorerie et de surveillance de respecter les contrôles juridiques."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin Dubai'deki 24. oturumunda (7–9 Rabi'al-Awwal 1441H, 4–6 Kasım 2019), çit üzerine bilimsel seminerinin önerilerinin incelenmesinden sonra (Cidde, 24–25 Rajab 1440H, 31 Mart – 1 Nisan 2019) toplu kararı verilmiştir. Akademi, 224 (23/8) sayılı kararını tüm paragraflarında (koruma, risk ve koruma kavramları, Şeriat'ın pozisyonu ve biçim ve yöntemler için Şeriat kontrolleri) onaylamıştır. İzin verilen korunma işlemleri arasında: Şeriat'ın uygun kaynak yönetimi için gerekli olan varlık ve portföy çeşitlendirmesine dayalı ekonomik hedging; 9 (2/9) ve 200 (21/6) kararlarını onaylayan takaful sigorta yoluyla işbirlikçi korunma; her sözleşmenin hak ve yükümlülüklerinde diğerinden bağımsız olması koşuluyla paralel sözleşmesel korunma (paralel salam ve istisna'); koşullu değil, birlikte birleştirilmiş sözleşmeler; örneğin murabaha, ortaklık, ortaklık, murabaha ve mevduat satışının mevduat kontrolleri ile birleştirilmesi gibi; müşterinin temerrüde karşı koşul opsiyonuyla korunma, diğer tarafa seçenek tanınırken; ve sermayeyi korumak için garanti biçimlerinde korunma. Yasaklananlar arasında: iki para biriminde karşılıklı kredilerle korunma, yani kombine kredi koşuluyla kredi verme; hisse senetleri ve sukuklarda sermaye garantilerinin korunması, örneğin ihraççıdan nominal değerin garanti edilmesi, spekülatörlerin portföy ödünç verme taahhüdü, sukuk sahiplerinin işlemlerini elden çıkarmasının engellenmesi, varlıkların mülkiyetini onlara devretmemesi ve 30 (4/5) ve 188 (20/3) sayılı Kararların ihlali ve yatırımcıların koyunlar için para cezası ödeyememesi nedeniyle açık olması durumunda yöneticiden kredi vermesini talep etmek. Türevler için alternatif hedging araçlarını detaylandırdı; bağlayıcı atamaları, karşılıklı vaatleri, uzatılmış onaylamaları, döviz kuru ticaretini ve fiyat endeksi borsalarını yasakladı; bunlar arasında kararlarının daha sonra para satımını yasakladığı şeyler, bağlayıcı atamalar ve Tauruk (Kararlar 102, 40, 52, 157, 179) yer alıyordu. Şeriat konseyleri ve fetva organlarının, Şeriat, yatırım departmanları, hazine ve düzenleyici kurumların hedeflerini Şeriat koruma düzenlemeleriyle takip etmelerini tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi ke-24 di Dubai (7–9 Rabi' al-Awwal 1441H, 4–6 November 2019), setelah meninjau rekomendasi seminar ilmiahnya tentang hedge (Jeddah, 24–25 Rajab 1440H, 31 Maret – 1 April 2019). Akademi menegaskan keputusan 224 (23/8) tentang hedge dalam semua paragrafnya (konsep hedge, risiko, dan perlindungan, posisi Syariah, serta kontrol Syariah untuk bentuk dan metode). Diputuskan bahwa di antara transaksi lindung nilai yang diizinkan adalah: lindung nilai ekonomi berbasis diversifikasi aset dan portofolio, yang diwajibkan oleh Syariah untuk pengelolaan sumber daya yang tepat; lindung nilai koperasi melalui asuransi takaful yang mengonfirmasi keputusan 9 (2/9) dan 200 (21/6); lindung nilai kontraktual paralel (salam dan istisna') paralel asalkan setiap kontrak independen dari yang lain dalam hak dan kewajibannya; kontrak digabungkan secara koitif daripada kondisional, seperti menggabungkan murabaha, kemitraan, kemitraan, murabaha, dan penjualan deposit dengan kontrol simpanan; lindung nilai berdasarkan opsi syarat terhadap gagal bayar klien sambil memberikan opsi kepada pihak lain; dan lindung nilai dalam bentuk jaminan untuk melindungi modal. Yang dilarang meliputi: lindung nilai dengan pinjaman timbal balik dalam dua mata uang dengan syarat, yaitu pemberian pinjaman dengan syarat pinjaman gabungan terhadapnya; lindung nilai jaminan modal pada saham dan sukuk, seperti menjamin nilai nominal dari penerbit, komitmen spekulan untuk meminjamkan portofolio, mencegah pemegang sukuk menjual tindakan mereka, tidak mengalihkan kepemilikan aset kepada mereka, dan mewajibkan manajer untuk meminjamkan kepada mereka jika terjadi kekurangan — karena pelanggaran Resolusi 30 (4/5) dan 188 (20/3) serta ketidakmampuan investor menanggung denda atas domba. Ia merinci alat lindung nilai alternatif untuk derivatif, melarang penunjukan yang mengikat, janji timbal balik, afirmasi diperpanjang, perdagangan nilai tukar, dan bursa indeks harga, karena ini mencakup apa yang dilarang keputusannya dalam penjualan mata uang kemudian, penunjukan yang mengikat, dan Tauruk (Keputusan 102, 40, 52, 157, 179). Ia merekomendasikan agar dewan Syariah dan badan fatwa mematuhi tujuan Syariah, departemen investasi, perbendaharaan, dan badan regulasi dengan regulasi lindung nilai Syariah."
