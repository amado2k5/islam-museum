label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن تغير قيمة العملة", en: "IIFA resolution on the change of currency value", ur: "اکیڈمی کی قرارداد: قدر کرنسی میں تبدیلی", es: "Resolución de la IIFA sobre el cambio de valor de la moneda", fr: "Résolution de l'IIFA sur la modification de la valeur monétaire", tr: "Uluslararası İslami Fiqh Akademisi'nin döviz değeri değişikliklerine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai perubahan nilai mata uang" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩ استكمالًا لقرار الدورة الثالثة في النقود الورقية: العبرة في وفاء الديون الثابتة بعملة ما هي بالمثل لا بالقيمة لأن الديون تقضى بأمثالها، فلا يجوز ربط الديون الثابتة في الذمة أيًا كان مصدرها بمستوى الأسعار."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988), completing the third session's paper-money ruling: debts fixed in a currency are repaid by nominal value, not real value, since debts are discharged by their like — debts owed may not be linked to the price level whatever their source."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: قرضیں اپنی مثل سے ادا ہوتی ہیں نہ کہ قدر کے اعتبار سے؛ مقررہ قرضوں کو قیمتوں کی سطح سے جوڑنا جائز نہیں۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988), que completa la decisión sobre el papel moneda de la tercera sesión: las deudas fijadas en una moneda se pagan por su valor nominal, no por su valor real, ya que las deudas se cancelan por sus equivalentes; las deudas contraídas no pueden estar vinculadas al nivel de precios, cualquiera que sea su origen."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988), complétant la décision de la troisième session sur la monnaie fiduciaire: les dettes fixées dans une monnaie sont remboursées par leur valeur nominale et non par leur valeur réelle, puisque les dettes sont acquittées par leur équivalent — les dettes dues ne peuvent être liées au niveau des prix quelle que soit leur source."
  tr: "Uluslararası İslami Fiqh Akademisi'nin beşinci oturumunda (Kuveyt, Aralık 1988) kararı, üçüncü oturumun kağıt para kararını sürdürerek: Anahtar, sabit borçların eşdeğeri değil, bir para biriminde ödenmesidir, çünkü borçlar eşdeğer olarak kapatılır. Sabit borçların, kaynağı ne olursa olsun, fiyat seviyesine bağlaması kabul edilemez."
  id: "Keputusan International Islamic Fiqh Academy pada sesi kelima (Kuwait, Desember 1988), melanjutkan keputusan sesi ketiga tentang uang kertas: Kuncinya adalah pembayaran utang tetap dalam mata uang, bukan yang setara, karena utang diselesaikan dalam nilai setara. Tidak diperbolehkan mengaitkan utang tetap, tanpa memandang sumbernya, dengan tingkat harga."
