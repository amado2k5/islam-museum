summary:
  ar: "ترجمة بوسنية لمعاني القرآن وضعها المستعرب البوسني إسعاد دوراكوفيتش، أتمّها سنة 2002 ونشرتها دار سفيتلوست في سراييفو سنة 2004 مع النص العربي في مجلد واحد؛ تجعل همّها نقل بلاغة القرآن، ومنها الالتفات، فتترجم السور المكية شعرًا مقفّى والمدنية نثرًا في الغالب، مع حواشٍ قصيرة توافق في عمومها آراء أهل السنة؛ لقيت عناية في الأوساط العلمية، ونقدها مترجمون آخرون في ثبات المصطلح."
  en: "A Bosnian rendering of the meanings of the Qur'an by the Bosnian Arabist Esad Duraković, completed in 2002 and published with the Arabic text in one volume by Svjetlost in Sarajevo in 2004; it sets out to convey the Qur'an's rhetoric, including iltifat, rendering the Meccan suras in rhymed verse and the Medinan mostly in prose, with short notes generally in line with mainstream Sunni views; it drew attention in scholarly circles, and other translators criticised its inconsistency of terms."
  ur: "قرآن کے معانی کا بوسنیائی ترجمہ از بوسنیائی ماہرِ عربی اسعاد دوراکووچ، جو 2002 میں مکمل ہوا اور 2004 میں سرائیوو میں سویتلوست نے عربی متن کے ساتھ ایک جلد میں شائع کیا؛ اس کا مقصد قرآن کی بلاغت، بشمول التفات، کو منتقل کرنا ہے، مکی سورتیں مقفیٰ نظم میں اور مدنی زیادہ تر نثر میں، مختصر حواشی عموماً اہلِ سنت کی عام آرا کے مطابق؛ علمی حلقوں میں توجہ ملی، اور دوسرے مترجمین نے اصطلاحات کی عدم یکسانی پر تنقید کی۔"
