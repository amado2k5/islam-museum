label: { ar: "القرآن مع الترجمة ⁦(إسعاد دوراكوفيتش)⁩", en: "Kuran s prijevodom (Esad Duraković)", ur: "کوران س پریوودوم ⁦(اسعاد دوراکووچ)⁩", es: "Kuran s prijevodom (Esad Duraković)", fr: "Le prijevodom de Kuran (Esad Duraković)" }
summary:
  ar: "ترجمة بوسنية لمعاني القرآن وضعها المستعرب البوسني إسعاد دوراكوفيتش، أتمّها سنة 2002 ونشرتها دار سفيتلوست في سراييفو سنة 2004 مع النص العربي في مجلد واحد؛ تجعل همّها نقل بلاغة القرآن، ومنها الالتفات، فتترجم السور المكية شعرًا مقفّى والمدنية نثرًا في الغالب، مع حواشٍ قصيرة توافق في عمومها آراء أهل السنة؛ لقيت عناية في الأوساط العلمية، ونقدها مترجمون آخرون في ثبات المصطلح."
  en: "A Bosnian rendering of the meanings of the Qur'an by the Bosnian Arabist Esad Duraković, completed in 2002 and published with the Arabic text in one volume by Svjetlost in Sarajevo in 2004; it sets out to convey the Qur'an's rhetoric, including iltifat, rendering the Meccan suras in rhymed verse and the Medinan mostly in prose, with short notes generally in line with mainstream Sunni views; it drew attention in scholarly circles, and other translators criticised its inconsistency of terms."
  ur: "قرآن کے معانی کا بوسنیائی ترجمہ از بوسنیائی ماہرِ عربی اسعاد دوراکووچ، جو 2002 میں مکمل ہوا اور 2004 میں سرائیوو میں سویتلوست نے عربی متن کے ساتھ ایک جلد میں شائع کیا؛ اس کا مقصد قرآن کی بلاغت، بشمول التفات، کو منتقل کرنا ہے، مکی سورتیں مقفیٰ نظم میں اور مدنی زیادہ تر نثر میں، مختصر حواشی عموماً اہلِ سنت کی عام آرا کے مطابق؛ علمی حلقوں میں توجہ ملی، اور دوسرے مترجمین نے اصطلاحات کی عدم یکسانی پر تنقید کی۔"
  es: "Una traducción bosnia de los significados del Corán realizada por el arabista bosnio Esad Duraković, completada en 2002 y publicada junto con el texto árabe en un solo volumen por Svjetlost en Sarajevo en 2004; su objetivo es transmitir la retórica del Corán, incluyendo el iltifat, traduciendo las suras de La Meca en verso rimado y las de Medina mayoritariamente en prosa, con breves notas generalmente acordes con las opiniones sunitas mayoritarias; atrajo la atención en los círculos académicos, y otros traductores criticaron su inconsistencia terminológica."
  fr: "Une traduction bosniaque des significations du Coran par l'arabiste bosnien Esad Duraković, achevée en 2002 et publiée avec le texte arabe en un seul volume par Svjetlost à Sarajevo en 2004; elle vise à transmettre la rhétorique du Coran, y compris les iltifat, en traduisant les sourates mecquoises en vers rimés et les sourates médinoises principalement en prose, avec de courtes notes généralement conformes aux vues sunnites dominantes; elle a attiré l'attention dans les milieux universitaires, et d'autres traducteurs ont critiqué son incohérence terminologique."
