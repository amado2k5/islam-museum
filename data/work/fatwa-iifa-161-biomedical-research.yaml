label: { ar: "قرار مجمع الفقه الإسلامي الدولي 161 (17/10) بشأن الضوابط الشرعية للبحوث الطبية البيولوجية", en: "IIFA resolution 161 (17/10) on the legal controls for biomedical research on humans", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 161 (17/10): انسان پر حیاتیاتی طبی تحقیق کے شرعی ضوابط", es: "Resolución 161 (17/10) de la IIFA sobre los controles legales para la investigación biomédica en seres humanos.", fr: "Résolution 161 (17/10) de l'IIFA relative aux contrôles juridiques de la recherche biomédicale sur l'être humain", tr: "Biyomedikal Araştırmalar için Şeriat Düzenlemeleri ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 161 (17/10)", id: "Resolusi Akademi Fiqh Islam Internasional 161 (17/10) mengenai Peraturan Syariah untuk Penelitian Biomedis" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على وثيقة الندوة التي أقامتها المنظمة الإسلامية للعلوم الطبية بالقاهرة ⁦(1425هـ/2004م)⁩ حول «القواعد الإرشادية الأخلاقية العالمية لأبحاث الطب الحيوي المتعلقة بالجوانب الإنسانية — رؤية إسلامية». اعتمد المجمع المبادئ العامة والأسس التي بُنيت عليها الضوابط المنظمة للبحوث الطبية البيولوجية على الإنسان في تلك الوثيقة، وناقش في نصه ضوابط الموافقة المستنيرة والمصلحة والضرر وحماية الفئات الضعيفة والمراجعة الأخلاقية للأبحاث."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing the document of the seminar held by the Islamic Organisation for Medical Sciences in Cairo (1425/2004) on 'international ethical guidelines for biomedical research involving human subjects — an Islamic perspective'. The Academy adopted the general principles and foundations on which that document's controls for biomedical research on humans are built, its own text treating controls for informed consent, benefit and harm, protection of vulnerable groups and ethical review of research."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، قاہرہ میں اسلامی آرگنائزیشن فار میڈیکل سائنسز کی سیمینار ⁦(1425ھ/2004ء)⁩ کی دستاویز 'انسانی جوانب سے متعلق حیاتیاتی طبی تحقیق کے بین الاقوامی اخلاقی رہنما اصول — اسلامی زاویہ' کے جائزے کے بعد۔ اکیڈمی نے اس دستاویز کے انسانی طبی تحقیق کے ضوابط جن عمومی اصولوں اور بنیادوں پر قائم ہیں انھیں اپنایا، اور اپنے متن میں آگاہ کردہ رضامندی، نفع و نقصان، کمزور گروہوں کی حفاظت اور تحقیق کے اخلاقی جائزے کے ضوابط بیان کیے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión celebrada en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, del 24 al 28 de junio de 2006), tras examinar el documento del seminario celebrado por la Organización Islámica para las Ciencias Médicas en El Cairo (1425/2004) sobre «Directrices éticas internacionales para la investigación biomédica con sujetos humanos: una perspectiva islámica». La Academia adoptó los principios generales y los fundamentos sobre los que se basan las normas de control de dicho documento para la investigación biomédica en seres humanos, y su propio texto aborda las normas relativas al consentimiento informado, el beneficio y el daño, la protección de los grupos vulnerables y la revisión ética de la investigación."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006), après examen du document du séminaire organisé par l'Organisation islamique des sciences médicales au Caire (1425/2004) sur les « Lignes directrices éthiques internationales pour la recherche biomédicale impliquant des sujets humains – une perspective islamique ». L'Académie a adopté les principes généraux et les fondements sur lesquels reposent les contrôles de ce document pour la recherche biomédicale sur des sujets humains, ainsi que son propre texte traitant des contrôles relatifs au consentement éclairé, aux bénéfices et aux risques, à la protection des groupes vulnérables et à l'évaluation éthique de la recherche."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on yedinci oturumunda (28 Cümde el-Avval – 2 Cumedül-Ahirah 1427 Ahri, 24–28 Haziran 2006) toplu kararı, Kahire'deki İslami Tıp Bilimleri Örgütü tarafından düzenlenen 'İnsan Yönleriyle İlgili Biyomedikal Araştırmalar için Küresel Etik Rehberler — İslami Bir Perspektif' başlıklı seminer belgesini inceledikten sonra (1425 Hicri / 2004 M.S.) topluca karar. Akademi, bu belgede insan üzerinde biyolojik tıbbi araştırmaları düzenleyen düzenlemelerin temel ilkelerini ve temellerini benimsemiş ve metinde bilgilendirilmiş onam, ilgi ve zarar, savunmasız grupların korunması ve araştırmaların etik incelemesi üzerindeki kontrolleri tartışmıştır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ketujuh belas di Amman (28 Jumada al-Awwal – 2 Jumada al-Akhirah 1427 H, 24–28 Juni 2006), setelah meninjau dokumen seminar yang diadakan oleh Organisasi Islam untuk Ilmu Kedokteran di Kairo (1425 H / 2004 M) tentang 'Pedoman Etika Global untuk Penelitian Biomedis Terkait Aspek Manusia — Perspektif Islam.' Akademi mengadopsi prinsip umum dan dasar yang menjadi dasar regulasi penelitian medis biologis pada manusia dalam dokumen tersebut, dan membahas dalam teksnya pengendalian persetujuan yang diinformasikan, kepentingan dan bahaya, perlindungan kelompok rentan, serta tinjauan etis penelitian."
