label: { ar: "قرار مجمع الفقه الإسلامي الدولي 161 (17/10) بشأن الضوابط الشرعية للبحوث الطبية البيولوجية", en: "IIFA resolution 161 (17/10) on the legal controls for biomedical research on humans", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 161 (17/10): انسان پر حیاتیاتی طبی تحقیق کے شرعی ضوابط" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على وثيقة الندوة التي أقامتها المنظمة الإسلامية للعلوم الطبية بالقاهرة ⁦(1425هـ/2004م)⁩ حول «القواعد الإرشادية الأخلاقية العالمية لأبحاث الطب الحيوي المتعلقة بالجوانب الإنسانية — رؤية إسلامية». اعتمد المجمع المبادئ العامة والأسس التي بُنيت عليها الضوابط المنظمة للبحوث الطبية البيولوجية على الإنسان في تلك الوثيقة، وناقش في نصه ضوابط الموافقة المستنيرة والمصلحة والضرر وحماية الفئات الضعيفة والمراجعة الأخلاقية للأبحاث."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing the document of the seminar held by the Islamic Organisation for Medical Sciences in Cairo (1425/2004) on 'international ethical guidelines for biomedical research involving human subjects — an Islamic perspective'. The Academy adopted the general principles and foundations on which that document's controls for biomedical research on humans are built, its own text treating controls for informed consent, benefit and harm, protection of vulnerable groups and ethical review of research."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، قاہرہ میں اسلامی آرگنائزیشن فار میڈیکل سائنسز کی سیمینار ⁦(1425ھ/2004ء)⁩ کی دستاویز 'انسانی جوانب سے متعلق حیاتیاتی طبی تحقیق کے بین الاقوامی اخلاقی رہنما اصول — اسلامی زاویہ' کے جائزے کے بعد۔ اکیڈمی نے اس دستاویز کے انسانی طبی تحقیق کے ضوابط جن عمومی اصولوں اور بنیادوں پر قائم ہیں انھیں اپنایا، اور اپنے متن میں آگاہ کردہ رضامندی، نفع و نقصان، کمزور گروہوں کی حفاظت اور تحقیق کے اخلاقی جائزے کے ضوابط بیان کیے۔"
