summary:
  ar: "ثالث ألبومات الاستوديو الرسمية لسامي يوسف، صدر في 29 أكتوبر 2010 عن إي تي إم إنترناشونال بعد خلافه مع أوايكننغ، بخمس عشرة أغنية بالعربية والإنجليزية والتركية والفارسية، سجّلها في بريطانيا ومصر وجنوب أفريقيا والإمارات؛ فيه نسخ جديدة من أغان صدرت في «بدونك» دون موافقته، ومنها «أتيتني» بأربع لغات."
  en: "Sami Yusuf's third official studio album, released on 29 October 2010 by ETM International after his split with Awakening, with fifteen songs in Arabic, English, Turkish and Persian recorded in Britain, Egypt, South Africa and the UAE; it carries new versions of songs issued without his consent on Without You, among them 'You Came To Me' in four languages."
  ur: "سامی یوسف کا تیسرا سرکاری اسٹوڈیو البم، 29 اکتوبر 2010 کو ای ٹی ایم انٹرنیشنل سے پندرہ گیتوں کے ساتھ جاری ہوا، جو برطانیہ، مصر، جنوبی افریقہ اور امارات میں ریکارڈ ہوئے؛ اس میں «وِدآؤٹ یو» کے گیتوں کے نئے ورژن ہیں۔"
