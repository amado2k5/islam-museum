id: work/fatwa-amja-infant-impurity-wudu
class: work
kind: fatwa
label: { ar: "نجاسة الرضيع ووضوء الأم", en: "An infant's impurity does not break the mother's wudu", ur: "بچے کی نجاست — ماں کا وضو نہیں ٹوٹتا", es: "La impureza de un bebé no anula el wudu de la madre.", fr: "L'impureté d'un nourrisson n'invalide pas les ablutions de sa mère." }
summary:
  ar: "سألت امرأة هل نجاسة طفلها الرضيع تنقض وضوءها إذا باشرتها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21693 بتاريخ 29 يناير 2008)⁩ أن نجاسة الطفل الرضيع لا تنقض وضوء أمه إذا باشرتها وإنما يجب عليها غسل ما أصابها من النجاسة ثم تصلي على ما فصّل الجواب."
  en: "A woman asked whether her infant's impurity breaks her wudu when she handles it. Dr. Salah al-Sawi (fatwa no. 21693, 29 January 2008) answered that a nursing infant's impurity does not break its mother's wudu if she handles it; what binds her is washing the impurity that reached her, then praying — as the answer details."
  ur: "بچے کی نجاست سے ماں کا وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21693، 29 جنوری 2008)⁩ کے مطابق وضو نہیں ٹوٹتا — نجاست دھو کر نماز پڑھے۔"
  es: "Una mujer preguntó si la impureza de su bebé invalidaba su wudu al manipularlo. El Dr. Salah al-Sawi (fatwa n.° 21693, 29 de enero de 2008) respondió que la impureza de un bebé lactante no invalida el wudu de su madre si lo manipula; lo que la obliga es lavar la impureza que llegó a ella y luego rezar, como se detalla en la respuesta."
  fr: "Une femme a demandé si l'impureté de son nourrisson invalidait ses ablutions lorsqu'elle le manipulait. Le Dr Salah al-Sawi (fatwa n° 21693, 29 janvier 2008) a répondu que l'impureté d'un nourrisson allaité n'invalide pas les ablutions de sa mère si elle le manipule; ce qui la lie, c'est de se laver de l'impureté qui l'a atteinte, puis de prier – comme le précise la réponse."
