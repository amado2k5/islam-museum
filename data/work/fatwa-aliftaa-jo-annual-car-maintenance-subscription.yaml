id: work/fatwa-aliftaa-jo-annual-car-maintenance-subscription
class: work
kind: fatwa
label: { ar: "حكم الاشتراك السنوي لصيانة السيارات", en: "An annual car maintenance subscription", ur: "گاڑی کی دیکھ بھال کی سالانہ رکنیت", es: "Una suscripción anual al mantenimiento del coche", fr: "Un abonnement annuel d'entretien automobile", tr: "Araç bakımı için yıllık abonelik kararı", id: "Putusan tentang iuran tahunan untuk perawatan mobil" }
summary:
  ar: "سؤال عن الاشتراك السنوي لصيانة السيارة وإصلاحها دوريًّا، أجازته دائرة الإفتاء العام الأردنية بشرط معلومية العمل والأجرة. أجابت الدائرة بأن عقد الصيانة يلتزم فيه أحد الطرفين بمراقبة الآلة دوريًّا وإصلاح ما يتعطل منها أو استبداله، وكيّفته بأنه إجارة على عمل بأجر متفق عليه. وقالت إن فيه شبهة غرر لأن العطل قد يقع وقد لا يقع، لكنه غرر يسير مغتفر جرت به الأعراف وتدعو إليه الحاجة، قياسًا على الإجارة والجعالة، ونقلت عن النووي في المجموع التفريق بين الغرر الظاهر وما تدعو إليه الحاجة. واستشهدت بقرار مجمع الفقه الإسلامي الدولي رقم 103 (11/6) في عقد الصيانة، وخلصت إلى جواز الاشتراك بشرط أن يكون العمل معلومًا بدقة وكذلك الأجرة، مع التزام الشركة بأعمال الصيانة والمراقبة والتزام المالك بالأجور وثمن القطع حسب الاتفاق."
  en: "A question on an annual subscription for periodic car maintenance and repair, which Jordan's General Iftaa Department permitted provided the work and the fee are clearly defined. The Department answered that in a maintenance contract one party undertakes to inspect a machine periodically and repair or replace whatever fails, and classified it as a hire of services for an agreed fee. It said the contract carries some uncertainty, since a breakdown may or may not occur, but this is minor uncertainty that custom accepts and need calls for, by analogy with hire and reward contracts, citing al-Nawawi's al-Majmu' on the difference between avoidable uncertainty and what need requires. It cited the International Islamic Fiqh Academy's resolution 103 (11/6) on maintenance contracts, and concluded that the subscription is permitted provided the work is precisely defined and so is the fee, with the company bound to the maintenance and inspection and the owner to the fees and the price of parts as agreed."
  ur: "گاڑی کی وقتاً فوقتاً دیکھ بھال اور مرمت کی سالانہ رکنیت کے بارے میں سوال، جسے اردن کے جنرل افتاء ڈیپارٹمنٹ نے کام اور اجرت کے واضح ہونے کی شرط پر جائز قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ دیکھ بھال کے معاہدے میں ایک فریق مشین کی دوری جانچ اور خراب پرزوں کی مرمت یا تبدیلی کا ذمہ لیتا ہے، اور اسے طے شدہ اجرت پر کام کا اجارہ قرار دیا۔ اس نے کہا کہ اس میں غرر کا شبہ ہے کیونکہ خرابی ہو بھی سکتی ہے اور نہیں بھی، لیکن یہ معمولی غرر ہے جسے عرف قبول کرتا ہے اور ضرورت اس کی متقاضی ہے، اجارہ اور جعالہ پر قیاس کرتے ہوئے، اور نووی کی المجموع سے ظاہر غرر اور ضرورت والے غرر کا فرق نقل کیا۔ اس نے دیکھ بھال کے معاہدے پر بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 103 (11/6) کا حوالہ دیا، اور نتیجہ نکالا کہ رکنیت جائز ہے بشرطیکہ کام اور اجرت دونوں ٹھیک ٹھیک طے ہوں، کمپنی دیکھ بھال اور نگرانی کی پابند ہو اور مالک معاہدے کے مطابق اجرت اور پرزوں کی قیمت کا۔"
  es: "Una pregunta sobre una suscripción anual para el mantenimiento y reparación periódicos de automóviles, que el Departamento General de Iftaa de Jordania autorizó siempre que el trabajo y la tarifa estuvieran claramente definidos. El Departamento respondió que, en un contrato de mantenimiento, una de las partes se compromete a inspeccionar la máquina periódicamente y a reparar o reemplazar lo que falle, y lo clasificó como un alquiler de servicios por una tarifa acordada. Indicó que el contrato conlleva cierta incertidumbre, ya que puede ocurrir o no una avería, pero que se trata de una incertidumbre menor que la costumbre acepta y que la necesidad exige, por analogía con los contratos de alquiler con contraprestación, citando la obra de al-Nawawi, al-Majmu', sobre la diferencia entre la incertidumbre evitable y lo que requiere la necesidad. Citó la resolución 103 (11/6) de la Academia Internacional de Fiqh Islámico sobre contratos de mantenimiento y concluyó que la suscripción está permitida siempre que el trabajo y la tarifa estén definidos con precisión, estando la empresa obligada al mantenimiento y la inspección, y el propietario a las tarifas y el precio de las piezas acordados."
  fr: "Une question portait sur un abonnement annuel pour l'entretien et la réparation périodiques d'un véhicule. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie l'a autorisé à condition que les travaux et les frais soient clairement définis. Le Département a répondu que, dans un contrat d'entretien, une partie s'engage à inspecter périodiquement le véhicule et à réparer ou remplacer les pièces défectueuses. Il a classé ce contrat comme une prestation de services moyennant des frais convenus. Il a précisé que le contrat comporte une certaine incertitude, une panne étant possible, mais que cette incertitude mineure est acceptée par la coutume et justifiée par les besoins, par analogie avec les contrats de location-vente. Le Département a cité l'ouvrage « al-Majmu' » d'al-Nawawi sur la distinction entre l'incertitude évitable et celle qu'exigent les besoins. Il a également cité la résolution 103 (11/6) de l'Académie internationale de jurisprudence islamique (Fiqh) relative aux contrats d'entretien et a conclu que l'abonnement est autorisé à condition que les travaux et les frais soient précisément définis. L'entreprise est tenue d'assurer l'entretien et l'inspection, et le propriétaire de payer les frais et le prix des pièces convenus."
  tr: "Yıllık araç bakım ve onarım aboneliğiyle ilgili bir soru, iş ve ücretlerin bilinmesi koşuluyla Ürdün Genel Fetva Müdürlüğü tarafından onaylandı. Departman, bakım sözleşmesinin bir tarafın makineyi düzenli olarak denetlemesini ve arızalı olanları tamir etmeyi veya değiştirmesini zorunlu kıldığını ve bunun üzerinde anlaşılmış ücretle bir iş kiralama olduğunu belirtti. Gharar konusunda şüphe olduğunu, çünkü arızanın olup olmayabileceğini, ancak bunun affedilen ve alışılmış küçük bir hararın olduğunu, kiralama ve devreye alma benzerliğiyle bunu gerektirdiğini belirtti. Al-Nawawi'nin Al-Majmu'da görünen gharar ile ihtiyacın gerektirdiği arasındaki ayrımı yaptığı belirtildi. Uluslararası İslami Fıkıh Akademisi'nin bakım sözleşmesindeki 103 (11/6) sayılı kararına atıfta bulunarak, işin ve ücretin tam olarak bilinmesi, şirketin bakım ve denetim işlerine bağlı olması ve işletmenin sözleşmeye göre ücret ve parça fiyatını ödemesi şartıyla katılımın mümkün olduğunu sonucuna vardı."
  id: "Sebuah pertanyaan mengenai langganan tahunan untuk pemeliharaan dan perbaikan mobil disetujui oleh Departemen Fatwa Umum Yordania asalkan pekerjaan dan upah diketahui. Departemen menjawab bahwa kontrak pemeliharaan mewajibkan salah satu pihak untuk secara rutin memeriksa mesin dan memperbaiki atau mengganti kerusakan apa pun, dan bahwa itu adalah sewa untuk pekerjaan dengan upah yang disepakati. Departemen menyatakan bahwa ada keraguan terhadap gharar karena kesalahan bisa terjadi atau tidak, tetapi gharar minor yang dimaafkan dan lazim serta menuntutnya, dengan analogi pada leasing dan commissioning. Al-Nawawi dikutip dalam Al-Majmu membedakan antara gharar yang tampak dan apa yang dibutuhkan kebutuhan. Pengadilan mengutip keputusan International Islamic Fiqh Academy No. 103 (11/6) dalam kontrak pemeliharaan dan menyimpulkan bahwa partisipasi diperbolehkan asalkan pekerjaan tersebut diketahui secara tepat serta upahnya, dengan perusahaan berkomitmen untuk memelihara dan memantau pekerjaan, dan pemilik membayar upah dan harga suku cadang sesuai dengan perjanjian."
