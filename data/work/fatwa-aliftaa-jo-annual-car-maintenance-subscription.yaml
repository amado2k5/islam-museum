id: work/fatwa-aliftaa-jo-annual-car-maintenance-subscription
class: work
kind: fatwa
label: { ar: "حكم الاشتراك السنوي لصيانة السيارات", en: "An annual car maintenance subscription", ur: "گاڑی کی دیکھ بھال کی سالانہ رکنیت" }
summary:
  ar: "سؤال عن الاشتراك السنوي لصيانة السيارة وإصلاحها دوريًّا، أجازته دائرة الإفتاء العام الأردنية بشرط معلومية العمل والأجرة. أجابت الدائرة بأن عقد الصيانة يلتزم فيه أحد الطرفين بمراقبة الآلة دوريًّا وإصلاح ما يتعطل منها أو استبداله، وكيّفته بأنه إجارة على عمل بأجر متفق عليه. وقالت إن فيه شبهة غرر لأن العطل قد يقع وقد لا يقع، لكنه غرر يسير مغتفر جرت به الأعراف وتدعو إليه الحاجة، قياسًا على الإجارة والجعالة، ونقلت عن النووي في المجموع التفريق بين الغرر الظاهر وما تدعو إليه الحاجة. واستشهدت بقرار مجمع الفقه الإسلامي الدولي رقم 103 (11/6) في عقد الصيانة، وخلصت إلى جواز الاشتراك بشرط أن يكون العمل معلومًا بدقة وكذلك الأجرة، مع التزام الشركة بأعمال الصيانة والمراقبة والتزام المالك بالأجور وثمن القطع حسب الاتفاق."
  en: "A question on an annual subscription for periodic car maintenance and repair, which Jordan's General Iftaa Department permitted provided the work and the fee are clearly defined. The Department answered that in a maintenance contract one party undertakes to inspect a machine periodically and repair or replace whatever fails, and classified it as a hire of services for an agreed fee. It said the contract carries some uncertainty, since a breakdown may or may not occur, but this is minor uncertainty that custom accepts and need calls for, by analogy with hire and reward contracts, citing al-Nawawi's al-Majmu' on the difference between avoidable uncertainty and what need requires. It cited the International Islamic Fiqh Academy's resolution 103 (11/6) on maintenance contracts, and concluded that the subscription is permitted provided the work is precisely defined and so is the fee, with the company bound to the maintenance and inspection and the owner to the fees and the price of parts as agreed."
  ur: "گاڑی کی وقتاً فوقتاً دیکھ بھال اور مرمت کی سالانہ رکنیت کے بارے میں سوال، جسے اردن کے جنرل افتاء ڈیپارٹمنٹ نے کام اور اجرت کے واضح ہونے کی شرط پر جائز قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ دیکھ بھال کے معاہدے میں ایک فریق مشین کی دوری جانچ اور خراب پرزوں کی مرمت یا تبدیلی کا ذمہ لیتا ہے، اور اسے طے شدہ اجرت پر کام کا اجارہ قرار دیا۔ اس نے کہا کہ اس میں غرر کا شبہ ہے کیونکہ خرابی ہو بھی سکتی ہے اور نہیں بھی، لیکن یہ معمولی غرر ہے جسے عرف قبول کرتا ہے اور ضرورت اس کی متقاضی ہے، اجارہ اور جعالہ پر قیاس کرتے ہوئے، اور نووی کی المجموع سے ظاہر غرر اور ضرورت والے غرر کا فرق نقل کیا۔ اس نے دیکھ بھال کے معاہدے پر بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 103 (11/6) کا حوالہ دیا، اور نتیجہ نکالا کہ رکنیت جائز ہے بشرطیکہ کام اور اجرت دونوں ٹھیک ٹھیک طے ہوں، کمپنی دیکھ بھال اور نگرانی کی پابند ہو اور مالک معاہدے کے مطابق اجرت اور پرزوں کی قیمت کا۔"
