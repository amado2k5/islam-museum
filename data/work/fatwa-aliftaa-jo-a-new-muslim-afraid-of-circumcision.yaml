id: work/fatwa-aliftaa-jo-a-new-muslim-afraid-of-circumcision
class: work
kind: fatwa
label: { ar: "حديث الإسلام الذي يخاف الختان", en: "A new Muslim who is afraid of circumcision", ur: "نو مسلم جو ختنے سے ڈرتا ہو" }
summary:
  ar: "سؤال عن حديث الإسلام الذي يخاف الختان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يطالب بالختان إن كان يتضرر به بشهادة طبيب ثقة، فإن كان مجرد خوف أمكن تأجيله حتى يطمئن ولا ينفر من الإسلام، مع إزالة النجاسة. أجابت الدائرة بأن هذا الشخص إن كان يتضرر من عملية الختان بناء على رأي طبيب ثقة فلا يطالب بها. وقالت إن الأمر إن كان مجرد خوف من العملية أمكن تأجيلها إلى أن يطمئن لذلك ولا ينفر من الإسلام، مع مراعاة إزالة النجاسة من الموضع المستور."
  en: "A question about a new Muslim who is afraid of circumcision, in which Jordan's General Iftaa Department answered that he is not required to be circumcised if a trustworthy doctor says it would harm him, and if it is only fear it may be postponed until he is at ease and not put off Islam, while keeping the area free of impurity. The Department answered that if this person would be harmed by circumcision, based on the opinion of a trustworthy doctor, he is not required to have it. It said that if it is merely fear of the operation, it may be postponed until he feels at ease with it and is not put off Islam, while taking care to remove impurity from the covered area."
  ur: "نو مسلم جو ختنے سے ڈرتا ہو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر قابلِ اعتماد ڈاکٹر کے مطابق ختنہ اسے نقصان دے تو اس سے مطالبہ نہیں، اور اگر محض خوف ہو تو اسے مطمئن ہونے اور اسلام سے دور نہ ہونے تک مؤخر کیا جا سکتا ہے، نجاست صاف رکھنے کے ساتھ۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر قابلِ اعتماد ڈاکٹر کی رائے کے مطابق اس شخص کو ختنے سے نقصان ہو تو اس سے اس کا مطالبہ نہیں کیا جائے گا۔ اس نے کہا کہ اگر یہ محض آپریشن کا خوف ہو تو اسے اس وقت تک مؤخر کیا جا سکتا ہے جب تک وہ مطمئن نہ ہو جائے اور اسلام سے متنفر نہ ہو، ساتھ ہی پوشیدہ جگہ سے نجاست دور کرنے کا خیال رکھے۔"
