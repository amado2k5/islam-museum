id: work/fatwa-aliftaa-jo-a-new-muslim-afraid-of-circumcision
class: work
kind: fatwa
label: { ar: "حديث الإسلام الذي يخاف الختان", en: "A new Muslim who is afraid of circumcision", ur: "نو مسلم جو ختنے سے ڈرتا ہو", es: "Un nuevo musulmán que tiene miedo a la circuncisión.", fr: "Un nouveau musulman qui a peur de la circoncision" }
summary:
  ar: "سؤال عن حديث الإسلام الذي يخاف الختان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يطالب بالختان إن كان يتضرر به بشهادة طبيب ثقة، فإن كان مجرد خوف أمكن تأجيله حتى يطمئن ولا ينفر من الإسلام، مع إزالة النجاسة. أجابت الدائرة بأن هذا الشخص إن كان يتضرر من عملية الختان بناء على رأي طبيب ثقة فلا يطالب بها. وقالت إن الأمر إن كان مجرد خوف من العملية أمكن تأجيلها إلى أن يطمئن لذلك ولا ينفر من الإسلام، مع مراعاة إزالة النجاسة من الموضع المستور."
  en: "A question about a new Muslim who is afraid of circumcision, in which Jordan's General Iftaa Department answered that he is not required to be circumcised if a trustworthy doctor says it would harm him, and if it is only fear it may be postponed until he is at ease and not put off Islam, while keeping the area free of impurity. The Department answered that if this person would be harmed by circumcision, based on the opinion of a trustworthy doctor, he is not required to have it. It said that if it is merely fear of the operation, it may be postponed until he feels at ease with it and is not put off Islam, while taking care to remove impurity from the covered area."
  ur: "نو مسلم جو ختنے سے ڈرتا ہو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر قابلِ اعتماد ڈاکٹر کے مطابق ختنہ اسے نقصان دے تو اس سے مطالبہ نہیں، اور اگر محض خوف ہو تو اسے مطمئن ہونے اور اسلام سے دور نہ ہونے تک مؤخر کیا جا سکتا ہے، نجاست صاف رکھنے کے ساتھ۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر قابلِ اعتماد ڈاکٹر کی رائے کے مطابق اس شخص کو ختنے سے نقصان ہو تو اس سے اس کا مطالبہ نہیں کیا جائے گا۔ اس نے کہا کہ اگر یہ محض آپریشن کا خوف ہو تو اسے اس وقت تک مؤخر کیا جا سکتا ہے جب تک وہ مطمئن نہ ہو جائے اور اسلام سے متنفر نہ ہو، ساتھ ہی پوشیدہ جگہ سے نجاست دور کرنے کا خیال رکھے۔"
  es: "Una pregunta sobre un nuevo musulmán que teme a la circuncisión, a la que el Departamento General de Iftaa de Jordania respondió que no está obligado a circuncidarse si un médico de confianza afirma que le causaría daño, y si se trata solo de temor, puede posponerse hasta que se sienta tranquilo y no se aleje del Islam, manteniendo la zona libre de impurezas. El Departamento respondió que si esta persona sufriría daño por la circuncisión, según la opinión de un médico de confianza, no está obligado a realizarla. Dijo que si se trata simplemente de temor a la operación, puede posponerse hasta que se sienta tranquilo y no se aleje del Islam, teniendo cuidado de eliminar la impureza de la zona cubierta."
  fr: "Concernant un nouveau musulman craignant la circoncision, le Département général de la Iftaa en Jordanie a répondu qu'il n'est pas tenu de se faire circoncire si un médecin digne de confiance estime que cela lui serait préjudiciable. Si sa crainte est uniquement liée à l'opération, celle-ci peut être reportée jusqu'à ce qu'il se sente à l'aise et ne se détourne pas de l'islam, à condition de maintenir une pureté rituelle. Le Département a précisé que si, selon l'avis d'un médecin digne de confiance, la circoncision présente un risque pour la santé de cette personne, elle n'est pas obligatoire. Il a ajouté que si sa crainte est uniquement liée à l'opération elle-même, celle-ci peut être reportée jusqu'à ce qu'il se sente à l'aise et ne se détourne pas de l'islam, à condition de veiller à la pureté rituelle de la zone circoncise."
