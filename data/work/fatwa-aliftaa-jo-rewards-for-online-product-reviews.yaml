id: work/fatwa-aliftaa-jo-rewards-for-online-product-reviews
class: work
kind: fatwa
label: { ar: "حكم أخذ مكافأة أو كود خصم مقابل تقييم المنتجات على مواقع الشراء", en: "Taking a reward or discount code for reviewing products on shopping sites", ur: "خریداری کی ویب سائٹوں پر مصنوعات کے ریویو کے بدلے انعام یا ڈسکاؤنٹ کوڈ لینا", es: "Obtener un código de recompensa o descuento por reseñar productos en sitios de compras.", fr: "Recevoir une récompense ou un code de réduction en échange de la rédaction d'avis sur des produits sur des sites marchands", tr: "Satın alma sitelerinde ürün incelemeleri için ödül veya indirim kodu alma kararı", id: "Keputusan tentang penerimaan hadiah atau kode diskon untuk ulasan produk di situs pembelian" }
summary:
  ar: "سؤال عن المكافآت المالية وأكواد الخصم التي تقدمها مواقع الشراء مقابل تقييم المنتجات، أجازتها دائرة الإفتاء العام الأردنية بشرط صدق التقييم. أجابت الدائرة بأن المبلغ الذي يمنحه الموقع مقابل تقييم تجربة الشراء لا حرج فيه إذا كان التقييم حقيقيًا صادقًا، لأنه مكافأة من الموقع. وقالت إن كود الخصم الذي يقدمه الموقع نفسه جزء من العروض الترويجية لجذب الزبائن بلا مقابل، فهو من عقود التبرعات التي يُعفى فيها عن الغرر. وأما تقييم المنتجات دون استخدامها أو التحقق من جودتها طمعًا في المكافأة فعدّته تغريرًا وخديعة للمشترين وتقييمًا زائفًا من قبيل الكذب والغش ومخالفًا للنصيحة، واشترطت تجنب أي تلاعب أو تضليل وأن يكون التقييم أمينًا صادقًا."
  en: "A question on the cash rewards and discount codes shopping sites offer for product reviews, which Jordan's General Iftaa Department permitted provided the review is honest. The Department answered that a sum the site grants for reviewing the purchase experience is unobjectionable if the review is genuine and truthful, since it is a reward from the site. It said a discount code offered by the site itself is part of its promotions to attract customers without anything in return, making it a gratuitous transaction in which uncertainty is excused. Reviewing products without using them or checking their quality, in the hope of a reward, it described as misleading and deceiving buyers, a false review akin to lying and fraud and contrary to sincere counsel; it required that any manipulation or deception be avoided and that the review be honest and truthful."
  ur: "خریداری کی ویب سائٹوں کی جانب سے مصنوعات کے ریویو کے بدلے نقد انعامات اور ڈسکاؤنٹ کوڈ کے بارے میں سوال، جنہیں اردن کے جنرل افتاء ڈیپارٹمنٹ نے ریویو کے سچا ہونے کی شرط پر جائز قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ خریداری کے تجربے کے ریویو پر ویب سائٹ کی دی ہوئی رقم میں کوئی حرج نہیں اگر ریویو حقیقی اور سچا ہو، کیونکہ یہ ویب سائٹ کی طرف سے انعام ہے۔ اس نے کہا کہ ویب سائٹ کا اپنا ڈسکاؤنٹ کوڈ گاہکوں کو متوجہ کرنے کی تشہیری پیشکش کا حصہ ہے جو بلا معاوضہ ہے، اس لیے یہ تبرع کا معاملہ ہے جس میں غرر معاف ہے۔ اور انعام کے لالچ میں مصنوعات کو استعمال یا ان کا معیار جانچے بغیر ریویو دینے کو اس نے خریداروں کو دھوکا دینا قرار دیا، جو جھوٹ اور ملاوٹ کی طرح جعلی ریویو اور خیر خواہی کے خلاف ہے؛ اس نے شرط رکھی کہ ہر قسم کی ہیرا پھیری اور گمراہی سے بچا جائے اور ریویو امانت داری اور سچائی سے ہو۔"
  es: "Una pregunta sobre las recompensas en efectivo y los códigos de descuento que ofrecen los sitios de compras a cambio de reseñas de productos, que el Departamento General de Iftaa de Jordania permite siempre que la reseña sea honesta. El Departamento respondió que la suma que el sitio otorga por reseñar la experiencia de compra es aceptable si la reseña es genuina y veraz, ya que se trata de una recompensa del sitio. Indicó que un código de descuento ofrecido por el propio sitio forma parte de sus promociones para atraer clientes sin obtener nada a cambio, lo que lo convierte en una transacción gratuita en la que se justifica la incertidumbre. Reseñar productos sin usarlos ni comprobar su calidad, con la esperanza de obtener una recompensa, se considera engañoso para los compradores, una reseña falsa similar a mentir y a cometer fraude, y contraria a un consejo sincero; por lo tanto, exigió que se evitara cualquier manipulación o engaño y que la reseña fuera honesta y veraz."
  fr: "Une question portait sur les récompenses en espèces et les codes de réduction offerts par les sites marchands en échange d'avis sur des produits. Le Département général de la Cour suprême de Jordanie (Iftaa) a autorisé ces pratiques à condition que l'avis soit honnête. Le Département a répondu qu'une somme versée par le site pour un avis sur l'expérience d'achat est acceptable si l'avis est sincère et authentique, puisqu'il s'agit d'une récompense offerte par le site. Il a précisé qu'un code de réduction offert par le site lui-même fait partie de ses promotions visant à attirer les clients sans contrepartie, ce qui en fait une transaction gratuite où l'incertitude est excusée. En revanche, rédiger des avis sur des produits sans les avoir utilisés ni en avoir vérifié la qualité, dans l'espoir d'une récompense, est considéré comme trompeur et mensonger envers les acheteurs. Il s'agit d'un faux avis assimilable à un mensonge et à une fraude, et contraire à la bonne foi. Le Département a exigé que toute manipulation ou tromperie soit évitée et que l'avis soit honnête et sincère."
  tr: "Ürün değerlendirmeleri karşılığında satın alma sitelerinin sunduğu finansal ödüller ve indirim kodları hakkında bir soru, puanın doğru olması koşuluyla Ürdün Kamu Fetva Departmanı tarafından onaylandı. Departman, satın alma deneyimini değerlendirmek için sitenin verdiği tutarın, değerlendirme gerçek ve dürüst ise sorun olmadığını, çünkü bunun siteden bir ödül olduğunu yanıtladı. Sitenin kendisinin sunduğu indirim kodunun, gharardan muaf tutan gönüllü bir sözleşme olduğu için müşterileri ücretsiz çekmek için promosyon tekliflerinin bir parçası olduğunu belirtti. Ürünleri kullanmadan veya kalite doğrulanmadan ödül kazanmak için değerlendirme yapılması ise alıcıları aldatma ve aldatma, yalan ve dolandırıcılık gibi yanlış değerlendirme, tavsiyelere aykırı olarak değerlendirildi ve her türlü manipülasyon veya yanıltıcıdan kaçınılması, değerlendirmenin dürüst olması gerektiğini belirtti."
  id: "Pertanyaan tentang hadiah finansial dan kode diskon yang ditawarkan oleh situs pembelian sebagai imbalan atas evaluasi produk disetujui oleh Departemen Fatwa Publik Yordania asalkan penilaian tersebut akurat. Departemen menanggapi bahwa jumlah yang diberikan situs untuk evaluasi pengalaman pembelian tidak menjadi masalah jika penilaian tersebut asli dan jujur, karena merupakan hadiah dari situs. Departemen tersebut menyatakan bahwa kode diskon yang ditawarkan oleh situs itu sendiri merupakan bagian dari penawaran promosi untuk menarik pelanggan secara gratis, karena merupakan kontrak sukarela yang membebaskan dari gharar. Adapun evaluasi produk tanpa menggunakan atau memverifikasi kualitasnya untuk mendapatkan hadiah, mereka menganggapnya sebagai penipuan dan penipuan pembeli, penilaian palsu seperti kebohongan dan penipuan, bertentangan dengan saran, dan mengharuskan menghindari manipulasi atau menyesatkan serta evaluasi harus jujur."
