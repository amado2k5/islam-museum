id: work/fatwa-aliftaa-jo-rewards-for-online-product-reviews
class: work
kind: fatwa
label: { ar: "حكم أخذ مكافأة أو كود خصم مقابل تقييم المنتجات على مواقع الشراء", en: "Taking a reward or discount code for reviewing products on shopping sites", ur: "خریداری کی ویب سائٹوں پر مصنوعات کے ریویو کے بدلے انعام یا ڈسکاؤنٹ کوڈ لینا" }
summary:
  ar: "سؤال عن المكافآت المالية وأكواد الخصم التي تقدمها مواقع الشراء مقابل تقييم المنتجات، أجازتها دائرة الإفتاء العام الأردنية بشرط صدق التقييم. أجابت الدائرة بأن المبلغ الذي يمنحه الموقع مقابل تقييم تجربة الشراء لا حرج فيه إذا كان التقييم حقيقيًا صادقًا، لأنه مكافأة من الموقع. وقالت إن كود الخصم الذي يقدمه الموقع نفسه جزء من العروض الترويجية لجذب الزبائن بلا مقابل، فهو من عقود التبرعات التي يُعفى فيها عن الغرر. وأما تقييم المنتجات دون استخدامها أو التحقق من جودتها طمعًا في المكافأة فعدّته تغريرًا وخديعة للمشترين وتقييمًا زائفًا من قبيل الكذب والغش ومخالفًا للنصيحة، واشترطت تجنب أي تلاعب أو تضليل وأن يكون التقييم أمينًا صادقًا."
  en: "A question on the cash rewards and discount codes shopping sites offer for product reviews, which Jordan's General Iftaa Department permitted provided the review is honest. The Department answered that a sum the site grants for reviewing the purchase experience is unobjectionable if the review is genuine and truthful, since it is a reward from the site. It said a discount code offered by the site itself is part of its promotions to attract customers without anything in return, making it a gratuitous transaction in which uncertainty is excused. Reviewing products without using them or checking their quality, in the hope of a reward, it described as misleading and deceiving buyers, a false review akin to lying and fraud and contrary to sincere counsel; it required that any manipulation or deception be avoided and that the review be honest and truthful."
  ur: "خریداری کی ویب سائٹوں کی جانب سے مصنوعات کے ریویو کے بدلے نقد انعامات اور ڈسکاؤنٹ کوڈ کے بارے میں سوال، جنہیں اردن کے جنرل افتاء ڈیپارٹمنٹ نے ریویو کے سچا ہونے کی شرط پر جائز قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ خریداری کے تجربے کے ریویو پر ویب سائٹ کی دی ہوئی رقم میں کوئی حرج نہیں اگر ریویو حقیقی اور سچا ہو، کیونکہ یہ ویب سائٹ کی طرف سے انعام ہے۔ اس نے کہا کہ ویب سائٹ کا اپنا ڈسکاؤنٹ کوڈ گاہکوں کو متوجہ کرنے کی تشہیری پیشکش کا حصہ ہے جو بلا معاوضہ ہے، اس لیے یہ تبرع کا معاملہ ہے جس میں غرر معاف ہے۔ اور انعام کے لالچ میں مصنوعات کو استعمال یا ان کا معیار جانچے بغیر ریویو دینے کو اس نے خریداروں کو دھوکا دینا قرار دیا، جو جھوٹ اور ملاوٹ کی طرح جعلی ریویو اور خیر خواہی کے خلاف ہے؛ اس نے شرط رکھی کہ ہر قسم کی ہیرا پھیری اور گمراہی سے بچا جائے اور ریویو امانت داری اور سچائی سے ہو۔"
