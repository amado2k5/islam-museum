id: work/fatwa-aliftaa-jo-delaying-the-division-of-an-inheritance
class: work
kind: fatwa
label: { ar: "تأخير توزيع الميراث وأجرة الشقق الموروثة", en: "Delaying the division of an inheritance and the rent of inherited flats", ur: "میراث کی تقسیم میں تاخیر اور وراثتی فلیٹوں کا کرایہ" }
summary:
  ar: "سؤال عن تأخير توزيع تركة فيها عقار وشقق مع حاجة بعض الإخوة إلى حصصهم وأخذ الأم أجرة الشقق كلها، أجابت فيه دائرة الإفتاء العام الأردنية بأن التركة تُقسم متى أمكن، وأنه لا يجوز منع وارث يطالب بنصيبه، وأن من البر توفير دخل كريم للأم دون تفريط في حقوق الورثة. أجابت الدائرة بأن الأصل توزيع التركة بعد وفاة المورث متى أمكن تجنبًا للخلاف وضياع الحقوق، وأن الورثة إن اتفقوا على إبقاء العقار على هيئته شركاء فيه كل بحسب نصيبه جاز، ولا يجوز لأحدهم الامتناع عن القسمة إذا طالب أحدهم بنصيبه. وقالت إن كل ما يملكه الإنسان يصير بعد وفاته ملكًا لجميع الورثة، وإن لكل وارث المطالبة بحقه من أجرة العقارات والشقق المؤجرة، وإن هذه المطالبة لا تُعد عقوقًا للوالدين. ونصحت الأطراف باللجوء إلى الحوار، فإن تعذر فللوارث رفع الأمر إلى القضاء. وقالت إن من البر أن يوفر الورثة لوالدتهم مصدر دخل يحقق لها حياة كريمة باعتدال وتوازن دون تفريط في حقوق الباقين، وإن نفقة الوالدين الفقيرين على الأولاد الموسرين، مستشهدة بالمادة 197 من قانون الأحوال الشخصية الأردني رقم 15 لسنة 2019."
  en: "A question about delaying the division of an estate of property and flats while some brothers need their shares and the mother takes all the rent, in which Jordan's General Iftaa Department answered that an estate is divided as soon as possible, that no heir claiming his share may be refused, and that it is kindness to secure the mother a decent income without neglecting the heirs' rights. The Department answered that an estate should in principle be divided after the death as soon as possible, to avoid disputes and lost rights; if the heirs agree to keep the property as it is, owning it jointly each according to his share, that is permitted, but none of them may refuse division when one of them claims his share. It said that everything a person owns becomes the property of all the heirs after his death, that each heir may claim his right to the rent from let property and flats, and that making this claim is not disobedience to parents. It advised the parties to resolve the matter through dialogue and, if that fails, said an heir may take it to court. It said it is kindness for the heirs to provide their mother with a source of income for a decent life, with moderation and balance and without neglecting the others' rights, and that maintenance of poor parents falls on their well-off children, citing article 197 of Jordan's Personal Status Law No. 15 of 2019."
  ur: "ایسے ترکے کی تقسیم میں تاخیر کے بارے میں سوال جس میں جائیداد اور فلیٹ ہیں، جبکہ کچھ بھائیوں کو اپنے حصوں کی ضرورت ہے اور والدہ تمام کرایہ لیتی ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ترکہ جتنی جلد ممکن ہو تقسیم کیا جائے، اپنا حصہ مانگنے والے کسی وارث کو روکا نہیں جا سکتا، اور ورثا کے حقوق میں کوتاہی کیے بغیر والدہ کے لیے باعزت آمدنی کا انتظام نیکی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ وفات کے بعد جتنی جلد ممکن ہو ترکہ تقسیم کیا جائے تاکہ اختلاف اور حقوق کے ضیاع سے بچا جائے؛ اگر ورثا جائیداد کو اسی حالت میں رکھنے پر متفق ہوں اور ہر ایک اپنے حصے کے مطابق اس میں شریک ہو تو جائز ہے، لیکن جب کوئی وارث اپنا حصہ مانگے تو کسی کے لیے تقسیم سے انکار جائز نہیں۔ اس نے کہا کہ انسان کی ہر ملکیت اس کی وفات کے بعد تمام ورثا کی ملکیت بن جاتی ہے، ہر وارث کرائے پر دی گئی جائیداد اور فلیٹوں کے کرائے میں اپنے حق کا مطالبہ کر سکتا ہے، اور یہ مطالبہ والدین کی نافرمانی شمار نہیں ہوتا۔ اس نے فریقوں کو بات چیت سے معاملہ حل کرنے کا مشورہ دیا، اور کہا کہ اگر یہ ممکن نہ ہو تو وارث معاملہ عدالت میں لے جا سکتا ہے۔ اس نے کہا کہ یہ نیکی ہے کہ ورثا اپنی والدہ کے لیے باعزت زندگی کی آمدنی کا ذریعہ فراہم کریں، اعتدال اور توازن کے ساتھ اور دوسروں کے حقوق میں کوتاہی کیے بغیر، اور یہ کہ غریب والدین کا نفقہ خوشحال اولاد پر ہے؛ اس نے اردن کے قانون احوال شخصیہ نمبر 15 سال 2019 کی دفعہ 197 کا حوالہ دیا۔"
