class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 5: بعثة النبي عند سن الأربعين"
  en: "The Biography of the Messenger of God 2026, episode 5: The Mission of the Prophet at the Age of Forty"
  ur: "سیرتِ رسول اللہ 2026، قسط 5: نبی کی بعثت چالیس سال کی عمر میں"
  fr: "La biographie du Messager de Dieu 2026, épisode 5 : La mission du Prophète à l'âge de quarante ans"
  es: "La biografía del Mensajero de Dios 2026, episodio 5: La misión del Profeta a la edad de cuarenta años"
summary:
  ar: "يفتتح المجلس الخامس مرحلة البعثة. يبين المحاضر الكتب التي سيعتمد عليها من هنا، ويناقش أهمية سن الأربعين وكيف فسّر المفسرون بلوغ الأشد، ويقارن بين الروايتين الطويلتين لبدء الوحي: رواية عائشة في صحيح البخاري ورواية عبيد بن عمير عند ابن إسحاق، ويختم بالإرهاصات التي سبقت الوحي وخلوة النبي في حراء."
  en: "The fifth session opens the period of the prophetic mission. The speaker sets out the books he will rely on from here, discusses why the age of forty matters and how commentators read the age of full strength, compares the two long accounts of the start of revelation (Aisha's report in al-Bukhari and Ubayd ibn Umayr's report in Ibn Ishaq), and closes with the preparatory signs before revelation and the Prophet's retreat in Hira."
  ur: "پانچویں نشست بعثت کے دور کا آغاز کرتی ہے۔ مقرر وہ کتابیں بیان کرتے ہیں جن پر وہ یہاں سے آگے انحصار کریں گے، چالیس سال کی عمر کی اہمیت اور مفسرین کے نزدیک اشد یعنی پوری قوت کو پہنچنے کے مفہوم پر بات کرتے ہیں، وحی کے آغاز کے دو طویل بیانات کا موازنہ کرتے ہیں، یعنی بخاری میں عائشہ کی روایت اور ابن اسحاق میں عبید بن عمیر کی روایت، اور وحی سے پہلے کی تیاری کی علامات اور نبی کے غارِ حرا میں خلوت اختیار کرنے پر ختم کرتے ہیں۔"
  fr: "La cinquième séance ouvre la période de la mission. Le conférencier présente les livres sur lesquels il s'appuiera désormais, discute de l'importance de l'âge de quarante ans et de la manière dont les commentateurs comprennent l'âge de la pleine force, compare les deux longs récits du début de la révélation, celui d'Aïcha dans al-Bukhari et celui d'Ubayd ibn Umayr chez Ibn Ishaq, et termine par les signes préparatoires qui ont précédé la révélation et la retraite du Prophète à Hira."
  es: "La quinta sesión abre el período de la misión. El conferenciante expone los libros en los que se apoyará a partir de ahora, discute por qué importa la edad de cuarenta años y cómo entienden los comentaristas la edad de plena fuerza, compara los dos largos relatos del comienzo de la revelación, el de Aisha en al-Bujari y el de Ubayd ibn Umayr en Ibn Ishaq, y concluye con las señales preparatorias previas a la revelación y el retiro del Profeta en Hira."
