label: { ar: "قصيدة سلامة بن جندل «أودى الشباب حميدا ذو التعاجيب»", en: "Salama ibn Jandal's ode 'Youth has gone, praised, the possessor of wonders'", es: "La oda de Salama ibn Jandal: «La juventud se ha ido, alabada, poseedora de maravillas».", fr: "Ode de Salama ibn Jandal: « La jeunesse s'en est allée, louée, possessrice de merveilles »", ur: "سلمہ بن جندل کی غزل ’’جوانی چلی گئی، قابل تعریف، عجائبات کے مالک‘‘" }
summary:
  ar: "قصيدة في المفضليات من البسيط على روي الباء، مطلعها «أودى الشباب حميدا ذو التعاجيب أودى وذلك شأو غير مطلوب»، كما في طبعة المطبعة الرحمانية {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  en: "A poem of the Mufaddaliyyat in the basit metre on the rhyme ba, opening \"Youth has gone, praised, the possessor of wonders; it has gone, and that is a goal not to be sought\", as in the Rahmaniyya edition {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  es: "Un poema de la Mufaddaliyyat en metro basit con rima ba, que comienza con \"La juventud se ha ido, alabada, poseedora de maravillas; se ha ido, y esa es una meta que no debe buscarse\", como en la edición Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  fr: "Un poème du Mufaddaliyyat en mètre basit sur la rime ba, commençant par « La jeunesse est partie, louée, possessrice de merveilles; elle est partie, et c'est un but à ne pas rechercher », comme dans l'édition Rahmaniyya {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  ur: "شاعری با پر باسط میٹر میں مفضلیت کی ایک نظم، جس کا آغاز \"جوانی گئی، تعریف کی گئی، عجائبات کی مالک، چلی گئی، اور یہ ایک ایسا مقصد ہے جس کی تلاش نہ کی جائے\"، جیسا کہ رحمانیہ ایڈیشن {{حوالہ:مفدالیات-رحمانیہ-1926}} صفحہ 4 میں ہے۔"
