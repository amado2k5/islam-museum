id: work/fatwa-amja-kawthar-basin-prophets
class: work
kind: fatwa
label: { ar: "حوض الكوثر والأنبياء", en: "The Kawthar basin — is it the Prophet's alone", ur: "حوض کوثر — کیا صرف نبی کا ہے", es: "La cuenca de Kawthar: ¿es solo del Profeta?", fr: "Le bassin de Kawthar — est-il uniquement celui du Prophète ?", tr: "El-Kawthar Havzası ve Peygamberler", id: "Cekungan Al-Kawthar dan Para Nabi" }
summary:
  ar: "سأل سائل عن حوض الكوثر هل هو للنبي وحده أم لكل رسول حوض وما أسماؤها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23371 بتاريخ 24 يوليو 2008)⁩ أن للكوثر في الشرع معنيين الأول أنه نهر في الجنة أعطاه الله لنبيه وهذا المعنى المراد في قوله إنا أعطيناك الكوثر كما فسره النبي بذلك في صحيح مسلم عن أنس، والثاني حوض النبي الذي يرد عليه أمته يوم القيامة يشربون منه قبل دخول الجنة، وأما باقي الرسل فلم يرد في نص أن لكل منهم حوضًا معلوم الاسم."
  en: "A questioner asked about the Kawthar basin — the Prophet's alone or does every messenger have one, and their names. Dr. Salah al-Sawi (fatwa no. 23371, 24 July 2008) answered that al-Kawthar holds two meanings in the sharia: a river in paradise God gave His prophet — the meaning of 'We gave you al-Kawthar' as the Prophet himself glossed it in Sahih Muslim from Anas — and the Prophet's basin to which his ummah comes on Judgment Day drinking before entering paradise; for the other messengers no text reports a named basin for each."
  ur: "ایک سائل نے پوچھا کہ حوض کوثر صرف نبی کا ہے یا ہر رسول کا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23371، 24 جولائی 2008)⁩ کے مطابق کوثر کا ایک مطلب جنت کا نهر ہے اور دوسرا نبی کا حوض جس سے امت پانی پیے گی؛ باقی رسولوں کے حوض کی کوئی نص نہیں۔"
  es: "Un interlocutor preguntó acerca de la fuente de Kawthar: ¿era solo para el Profeta o cada mensajero tenía una, y cuáles eran sus nombres? El Dr. Salah al-Sawi (fatwa n.° 23371, 24 de julio de 2008) respondió que al-Kawthar tiene dos significados en la sharia: un río en el paraíso que Dios le dio a su profeta —el significado de «Te dimos al-Kawthar», como lo explicó el propio Profeta en Sahih Muslim de Anas— y la fuente del Profeta a la que su ummah acude el Día del Juicio para beber antes de entrar en el paraíso; para los demás mensajeros, ningún texto menciona una fuente con nombre para cada uno."
  fr: "Un internaute a posé une question concernant le bassin de Kawthar: était-il réservé au Prophète ou chaque messager en possédait-il un, et quels étaient leurs noms ? Le Dr Salah al-Sawi (fatwa n° 23371, 24 juillet 2008) a répondu qu’al-Kawthar a deux significations en charia: une rivière du paradis que Dieu a donnée à Son Prophète – le sens de « Nous t’avons donné al-Kawthar », comme le Prophète l’a lui-même exprimé dans Sahih Muslim, d’après Anas – et le bassin du Prophète où sa communauté se rend le Jour du Jugement pour boire avant d’entrer au paradis; aucun texte ne mentionne de bassin nommé pour chacun des autres messagers."
  tr: "Bir soru soran El-Kavtar havzası hakkında sordu: Sadece Peygamber için mi yoksa her elçi için mi ve isimleri nedir? Dr. Salah El-Savi (24 Temmuz 2008 tarihli 23371 No. Fetva) şöyle yanıtladı: Birincisi, Allah'ın Peygamberine verdiği cennetteki bir nehirdir; bu, Peygamber'in Sahih Müslüman Anas'ta açıkladığı 'Gerçekten size El-Kövtər'i verdik' ifadesinin anlamıdır. İkincisi ise Peygamber'in leğnesidir; milleti Cennet'e girmeden önce Diriliş Günü'nde su içmek üzere buraya dönerler. Diğer elçiler için ise, her birinin bilinen bir havuzu olduğu açıkça belirtilmemiştir."
  id: "Seorang penanya bertanya tentang cekungan Al-Kawthar: Apakah hanya untuk Nabi atau untuk setiap rasul dan siapa nama mereka? Dr. Salah Al-Sawi menjawab (Fatwa No. 23371 tanggal 24 Juli 2008) bahwa Al-Kawthar memiliki dua makna dalam Syariah: pertama, itu adalah sungai di Surga yang diberikan Allah kepada Nabi-Nya, yang merupakan arti dari ungkapan 'Sesungguhnya, Kami telah memberikan Al-Kawthar kepadamu' seperti yang dijelaskan oleh Nabi dalam Sahih Muslim dari Anas. Yang kedua adalah cekungan Nabi, tempat bangsanya akan kembali pada Hari Kebangkitan untuk minum sebelum memasuki Surga. Adapun para rasul lainnya, tidak secara eksplisit dinyatakan bahwa masing-masing dari mereka memiliki cekungan yang diketahui."
