summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: السر ما يفضي به الإنسان إلى آخر مستكتمًا إياه ويشمل ما دلّت قرائنه على طلب الكتمان وخصوصيات الإنسان وعيوبه التي يكره اطلاع الناس عليها، وهو أمانة لدى من استودع حفظه، وبيّن أحكام كتمه وإفشائه في المهن الطبية على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on secrecy in the medical professions: a secret is what a person imparts to another in confidence, including what circumstances mark for concealment and the private matters and faults he dislikes people seeing; it is a trust with its keeper — with the rulings on keeping and disclosing it in medicine detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ طبی رازداری پر: راز امانت ہے جسے سونپا جائے؛ طبی پیشوں میں چھپانے اور ظاہر کرنے کے احکام بیان ہوئے۔"
