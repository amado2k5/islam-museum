label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن السر في المهن الطبية", en: "IIFA resolution on secrecy in the medical professions", ur: "اکیڈمی کی قرارداد: طبی پیشوں میں رازداری", es: "Resolución de la IIFA sobre el secreto profesional en la medicina", fr: "Résolution de l'IIFA sur le secret dans les professions médicales", tr: "Uluslararası İslami Fiqh Akademisi'nin tıp mesleklerinde gizliliğe ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai kerahasiaan dalam profesi medis" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: السر ما يفضي به الإنسان إلى آخر مستكتمًا إياه ويشمل ما دلّت قرائنه على طلب الكتمان وخصوصيات الإنسان وعيوبه التي يكره اطلاع الناس عليها، وهو أمانة لدى من استودع حفظه، وبيّن أحكام كتمه وإفشائه في المهن الطبية على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on secrecy in the medical professions: a secret is what a person imparts to another in confidence, including what circumstances mark for concealment and the private matters and faults he dislikes people seeing; it is a trust with its keeper — with the rulings on keeping and disclosing it in medicine detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ طبی رازداری پر: راز امانت ہے جسے سونپا جائے؛ طبی پیشوں میں چھپانے اور ظاہر کرنے کے احکام بیان ہوئے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre el secreto en las profesiones médicas: un secreto es aquello que una persona le confía a otra, incluyendo las circunstancias que justifican su ocultación y los asuntos privados y defectos que no desea que otros vean; es un fideicomiso que recae sobre quien lo guarda, con las normas detalladas sobre su custodia y divulgación en medicina."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur le secret dans les professions médicales: un secret est ce qu'une personne confie à une autre, y compris les circonstances qui justifient la dissimulation et les affaires privées et les défauts qu'elle ne souhaite pas que les gens voient; c'est une confiance avec son dépositaire — avec les règles détaillées sur la conservation et la divulgation de ce secret en médecine."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) karar aldığı karar: Sır, bir kişiyi gizleyen başka birine götüren şeydir; kanıtlarının gizlilik talebine işaret ettiği ve insanların ifşa etmekten hoşlanmadığı ayrıntılar ve kusurlar dahildir. Güvencesini korumakla görevli kişiye emanet edilen bir güvendir; tıp mesleklerinde gizlenmesi ve açıklanmasına ilişkin kararlar ayrıntılı olarak netleştirilmiştir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kedelapan (Brunei, Juni 1993): Rahasia adalah apa yang membawa seseorang kepada orang lain yang menyembunyikannya, termasuk apa yang ditunjukkan oleh buktinya sebagai permintaan kerahasiaan, serta kekhasan dan cacat yang tidak disukai orang untuk diungkapkan. Ini adalah trust yang dipercayakan kepada orang yang dipercayakan untuk menjaganya, dan telah memperjelas keputusan tentang penyembunyian dan pengungkapan dalam profesi medis seperti yang dijelaskan."
