label: { ar: "تبيين كذب المفتري فيما نُسب إلى الشيخ أبي الحسن الأشعري", en: "Tabyin Kadhib al-Muftari (Ibn 'Asakir)", ur: "تبیین کذب المفتری ⁦(ابن عساکر)⁩", es: "Tabyin Kadhib al-Muftari (Ibn 'Asakir)", fr: "Tabyin Kadhib al-Muftari (Ibn 'Asakir)", tr: "İftiraçının Şeyh Ebu el-Hasan el-Eş'ari'ye atfedilen yalanların açıklanması", id: "Memperjelas kebohongan pencemaran nama baik mengenai apa yang dikaitkan dengan Sheikh Abu al-Hasan al-Ash'ari" }
summary:
  ar: "مجلد لابن عساكر في الرد على المفتري على الشيخ أبي الحسن الأشعري والذب عنه {cite:tarikh-islam-dhahabi p. 75}، وهو من كتابيه الدفاعيين على مذهب الأشعري، طُبع بتحقيق الكوثري بدمشق سنة ١٩٢٨م {cite:encyclopaedia-of-islam-2 vol. 3 p. 746-747}."
  en: "Ibn 'Asakir's one-volume apology exposing 'the lies of the slanderer' concerning what was imputed to Abu al-Hasan al-Ash'ari {cite:tarikh-islam-dhahabi p. 75}; one of his two Ash'ari apologetic works, printed by al-Kawthari at Damascus in 1928 {cite:encyclopaedia-of-islam-2 vol. 3 p. 746-747}."
  ur: "ابن عساکر کی ایک جلد والی تصنیف جس میں شیخ ابوالحسن اشعری پر بندھے گئے الزامات کے 'افترا پرداز کی جھوٹ' کا انکشاف ہے {cite:tarikh-islam-dhahabi p. 75}؛ ان کی دو اشعری دفاعی تصانیف میں سے ایک، 1928ء میں کوثری کی تحقیق سے دمشق میں طبع ہوئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 746-747}۔"
  es: "La apología en un solo volumen de Ibn 'Asakir que expone 'las mentiras del calumniador' con respecto a lo que se le imputó a Abu al-Hasan al-Ash'ari {cite:tarikh-islam-dhahabi p. 75}; una de sus dos obras apologéticas ash'ari, impresa por al-Kawthari en Damasco en 1928 {cite: encyclopaedia-of-islam-2 vol. 3 p. 746-747}."
  fr: "L'apologie en un volume d'Ibn 'Asakir exposant « les mensonges du calomniateur » concernant ce qui a été imputé à Abu al-Hasan al-Ash'ari {cite:tarikh-islam-dhahabi p. 75}; l'un de ses deux ouvrages apologétiques ash'arites, imprimé par al-Kawthari à Damas en 1928 {cite: encyclopaedia-of-islam-2 vol. 3 p. 746-747}."
  tr: "İbn Asakir'in Şeyh Ebu el-Hasan el-Eş'ari'ye karşı uydurucuyu çürüten ve onu savunan bir cildi {atıf:Tarikh-Islam-dhahabi, s. 75}, Ash'ari okulu üzerine savunma kitaplarından biridir ve 1928'de Şam'da el-Kavtari tarafından basılmıştır {cite:Encyclopaedia-of-Islam-2 cilt 3, s. 746-747}."
  id: "Sebuah jilid oleh Ibn Asakir yang membantah pembuat karya terhadap Sheikh Abu al-Hasan al-Ash'ari dan membelanya {cite:Tarikh-Islam-dhahabi, hlm. 75}, yang merupakan salah satu buku pembelaannya tentang aliran Ash'ari, dicetak dengan verifikasi oleh al-Kawthari di Damaskus pada tahun 1928 {cite:Encyclopaedia-of-Islam-2 vol. 3, hlm. 746-747}."
