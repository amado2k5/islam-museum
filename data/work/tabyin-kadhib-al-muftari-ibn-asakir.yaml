summary:
  ar: "مجلد لابن عساكر في الرد على المفتري على الشيخ أبي الحسن الأشعري والذب عنه {cite:tarikh-islam-dhahabi p. 75}، وهو من كتابيه الدفاعيين على مذهب الأشعري، طُبع بتحقيق الكوثري بدمشق سنة ١٩٢٨م {cite:encyclopaedia-of-islam-2 vol. 3 p. 746-747}."
  en: "Ibn 'Asakir's one-volume apology exposing 'the lies of the slanderer' concerning what was imputed to Abu al-Hasan al-Ash'ari {cite:tarikh-islam-dhahabi p. 75}; one of his two Ash'ari apologetic works, printed by al-Kawthari at Damascus in 1928 {cite:encyclopaedia-of-islam-2 vol. 3 p. 746-747}."
  ur: "ابن عساکر کی ایک جلد والی تصنیف جس میں شیخ ابوالحسن اشعری پر بندھے گئے الزامات کے 'افترا پرداز کی جھوٹ' کا انکشاف ہے {cite:tarikh-islam-dhahabi p. 75}؛ ان کی دو اشعری دفاعی تصانیف میں سے ایک، 1928ء میں کوثری کی تحقیق سے دمشق میں طبع ہوئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 746-747}۔"
