id: work/fatwa-dar-alifta-eg-fidyah-for-missed-prayers-of-deceased
class: work
kind: fatwa
label: { ar: "حكم إخراج الفدية عن الصلوات الفائتة عن الميت", en: "Paying fidyah for the deceased's missed prayers", ur: "میت کی چھوٹی نمازوں کی فدیہ", es: "Pagar la fidyah por las oraciones no realizadas del difunto.", fr: "Payer la fidyah pour les prières manquées du défunt" }
summary:
  ar: "سائل سأل عن إخراج الفدية عن الصلوات الفائتة على الميت. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21506)⁩ أنه يجب على المكلف الاهتمام بأمر الصلاة المفروضة ويحرم عليه التهاون في أدائها ولا تصح الصلاة عن الميت مطلقًا على ما فصّل الجواب."
  en: "A questioner asked about paying fidyah for the deceased's missed prayers. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21506) answered that the obligated person must attend to the prescribed prayer — neglect of it is forbidden — and prayer on behalf of the dead is not valid at all, as the answer details."
  ur: "ایک سائل نے میت کی چھوٹی نمازوں کی فدیہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21506)⁩ نے جواب دیا کہ فرض نماز کی پابندی واجب ہے اس میں غفلت حرام ہے اور میت کی طرف سے نماز بالکل صحیح نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca del pago de la fidyah por las oraciones omitidas del difunto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21506) respondió que la persona obligada debe asistir a la oración prescrita —su omisión está prohibida— y que la oración en nombre del difunto no es válida en absoluto, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le paiement de la fidyah pour les prières manquées d'un défunt. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21506) a répondu que la personne tenue de s'acquitter de la prière prescrite doit l'accomplir – son omission est interdite – et que la prière pour le défunt est nulle, comme le précise la réponse."
