label: { ar: "شهود الجمعة وفتح المساجد", en: "Attending Friday prayers and reopening the mosques — the COVID ruling", ur: "جمعہ اور مساجد کی کھل — کورونا فیصلہ", es: "Asistir a las oraciones del viernes y reabrir las mezquitas: la normativa sobre el COVID", fr: "La participation à la prière du vendredi et la réouverture des mosquées: la décision relative à la COVID", tr: "Cuma Tanıkları ve Camilerin Açılışı", id: "Saksi Jumat dan Pembukaan Masjid" }
summary:
  ar: "وردت إلى لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا تساؤلات عدة عن حكم شهود الجمعة والجماعات وحكم فتح المساجد من قبل إداراتها لاستيعاب المصلين الراغبين في ظل جائحة كورونا. أجابت اللجنة ⁦(فتوى رقم 87757 بتاريخ 10 مايو 2020)⁩ بتفصيل الأحكام في ذلك على ما ورد في الجواب."
  en: "AMJA's fatwa committee received several questions on the ruling of attending Friday and congregational prayers and on mosque administrations reopening to hold worshippers amid the COVID pandemic. The committee (fatwa no. 87757, 10 May 2020) answered detailing the rulings on all of it as the response sets out."
  ur: "جمعہ اور مساجد کی کھل؟ لجنة الفتوى ⁦(فتویٰ 87757، 10 مئی 2020)⁩ نے نازلے کے تمام احکام تفصیل سے بیان کیے۔"
  es: "El comité de fatuas de AMJA recibió varias preguntas sobre la normativa relativa a la asistencia a las oraciones del viernes y a las oraciones en congregación, así como sobre la reapertura de las mezquitas para recibir a los fieles en medio de la pandemia de COVID-19. El comité (fatua n.º 87757, del 10 de mayo de 2020) respondió detallando las resoluciones al respecto, tal como se expone en la respuesta."
  fr: "Le comité des fatwas de l'AMJA a reçu plusieurs questions concernant la participation aux prières du vendredi et aux prières collectives, ainsi que la réouverture des mosquées aux fidèles dans le contexte de la pandémie de COVID-19. Le comité (fatwa n° 87757, 10 mai 2020) a répondu en détaillant sa position sur chacun de ces points, comme indiqué dans sa réponse."
  tr: "Amerika Şeriat Hukukçuları Akademisi Fetva Komitesi'ne Cuma günü verilen karar ve cemaat tanıkları ile koronavirüs pandemisi sırasında ibadet edenleri ağırlamak isteyen ibadet edenleri ağırlamak için cami yönetimleri tarafından açılan kararla ilgili çeşitli sorular geldi. Komite, yanıtta belirtildiği gibi (10 Mayıs 2020 tarihli 87757 sayılı Fetva) bu konudaki kararları ayrıntılı olarak açıkladı."
  id: "Beberapa pertanyaan diterima oleh Komite Fatwa di Akademi Ahli Hukum Syariah di Amerika mengenai putusan pada hari Jumat dan saksi jemaat, serta keputusan tentang masjid yang dibuka oleh administrasi mereka untuk mengakomodasi jamaah yang ingin mengakomodasi mereka yang ingin mengakomodasi selama pandemi virus corona. Komite menanggapi (Fatwa No. 87757 tertanggal 10 Mei 2020) dengan merinci putusan terkait masalah ini sebagaimana tercantum dalam tanggapan."
