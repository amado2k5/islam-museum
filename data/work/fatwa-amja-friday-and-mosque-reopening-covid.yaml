summary:
  ar: "وردت إلى لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا تساؤلات عدة عن حكم شهود الجمعة والجماعات وحكم فتح المساجد من قبل إداراتها لاستيعاب المصلين الراغبين في ظل جائحة كورونا. أجابت اللجنة ⁦(فتوى رقم 87757 بتاريخ 10 مايو 2020)⁩ بتفصيل الأحكام في ذلك على ما ورد في الجواب."
  en: "AMJA's fatwa committee received several questions on the ruling of attending Friday and congregational prayers and on mosque administrations reopening to hold worshippers amid the COVID pandemic. The committee (fatwa no. 87757, 10 May 2020) answered detailing the rulings on all of it as the response sets out."
