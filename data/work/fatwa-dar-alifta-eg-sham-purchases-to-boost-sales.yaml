label: { ar: "حكم الشراء الوهمي لمنتجات بعض التجار لزيادة رواج بضاعتهم وأخذ أجر عليه", en: "Sham purchases of merchants' goods to boost their sales, for a fee", ur: "تاجروں کی فروخت بڑھانے کے لیے جعلی خرید اور اجرت" }
summary:
  ar: "سائل سأل عن القيام بشراء وهمي لمنتجات بعض التجار لزيادة رواج بضاعتهم وأخذ أجر على ذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20671)⁩ أن القيام بشراء وهمي للمنتجات لكي يراها الناس بسرعة ويغترون بها يشتمل على عدة محاذير كالصورية في الشراء على ما فصّل الجواب."
  en: "A questioner asked about making sham purchases of merchants' goods to increase their sales, taking a fee for it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20671) answered that it involves several prohibitions, including formality in the purchase — as the answer details."
  ur: "ایک سائل نے تاجروں کی فروخت بڑھانے کے لیے جعلی خریداری اور اس پر اجرت لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20671)⁩ نے جواب دیا کہ اس میں کئی محاذر ہیں بشمول صوریت — جیسا کہ جواب میں تفصیل ہے۔"
