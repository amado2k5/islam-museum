id: work/fatwa-dar-alifta-eg-sham-purchases-to-boost-sales
class: work
kind: fatwa
label: { ar: "حكم الشراء الوهمي لمنتجات بعض التجار لزيادة رواج بضاعتهم وأخذ أجر عليه", en: "Sham purchases of merchants' goods to boost their sales, for a fee", ur: "تاجروں کی فروخت بڑھانے کے لیے جعلی خرید اور اجرت", es: "Compras simuladas de mercancías de comerciantes para aumentar sus ventas, a cambio de una comisión.", fr: "Achats fictifs de marchandises de commerçants pour augmenter leurs ventes, moyennant des frais." }
summary:
  ar: "سائل سأل عن القيام بشراء وهمي لمنتجات بعض التجار لزيادة رواج بضاعتهم وأخذ أجر على ذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20671)⁩ أن القيام بشراء وهمي للمنتجات لكي يراها الناس بسرعة ويغترون بها يشتمل على عدة محاذير كالصورية في الشراء على ما فصّل الجواب."
  en: "A questioner asked about making sham purchases of merchants' goods to increase their sales, taking a fee for it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20671) answered that it involves several prohibitions, including formality in the purchase — as the answer details."
  ur: "ایک سائل نے تاجروں کی فروخت بڑھانے کے لیے جعلی خریداری اور اس پر اجرت لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20671)⁩ نے جواب دیا کہ اس میں کئی محاذر ہیں بشمول صوریت — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de realizar compras ficticias de mercancías a comerciantes para aumentar sus ventas, cobrando una comisión por ello. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20671) respondió que esto implica varias prohibiciones, incluida la formalidad en la compra, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la pratique consistant à effectuer de faux achats de marchandises auprès de commerçants afin d'augmenter leurs ventes, moyennant une commission. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20671) a répondu que cette pratique enfreint plusieurs interdictions, notamment en ce qui concerne les formalités de l'achat, comme le détaille la réponse."
