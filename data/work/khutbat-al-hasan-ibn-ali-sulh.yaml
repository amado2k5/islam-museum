  fr: "Le sermon d'al-Hasan répondant à ceux qui s'opposaient à sa paix avec Mu'awiya, tel que la sira le transmet."
  tr: "Biyografi yazarlarının anlattığı üzere, el-Hasan ibn Ali'nin Muaviye ile uzlaşmaya itiraz edenlere verdiği vaaz."
  id: "Khotbah al-Hasan ibn Ali ketika ia menanggapi mereka yang menentang rekonsiliasi dengan Muawiya, sebagaimana diceritakan oleh para penulis biografi."
