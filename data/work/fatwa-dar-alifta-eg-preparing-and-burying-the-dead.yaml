id: work/fatwa-dar-alifta-eg-preparing-and-burying-the-dead
class: work
kind: fatwa
label: { ar: "حكم تجهيز الميت ودفنه", en: "Preparing and burying the deceased", ur: "میت کی تدفین و تکفین کا حکم", es: "Preparar y enterrar al difunto", fr: "Préparation et inhumation du défunt", tr: "Ölenlerin hazırlanması ve gömülmesine ilişkin karar", id: "Putusan tentang persiapan dan pemakaman almarhum" }
summary:
  ar: "سائل سأل عن تجهيز الميت ودفنه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22268)⁩ أنه من المقرر شرعًا أن دفن جسد المتوفى حق ثابت لكل مسلم صيانة لآدميته ومراعاة لحرمته، وبيّن الجواب ما يشرع في الغسل والتكفين والدفن."
  en: "A questioner asked about preparing and burying the deceased. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22268) answered that burying the body of the deceased is a confirmed right of every Muslim — preserving his humanity and honouring him; the answer sets out what is prescribed for washing, shrouding and burial."
  ur: "ایک سائل نے میت کی تدفین و تکفین کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22268)⁩ نے جواب دیا کہ شرعاً یہ مقرر ہے کہ میت کے جسد کی تدفین ہر مسلمان کا قائم حق ہے — اس کی انسانیت کی حفاظت اور اس کی حرمت کے احترام کے لیے؛ جواب میں غسل، کفن اور دفن کے احکام بیان ہوئے۔"
  es: "Una persona preguntó sobre la preparación y el entierro del difunto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22268) respondió que enterrar el cuerpo del difunto es un derecho confirmado de todo musulmán, para preservar su humanidad y honrarlo; la respuesta detalla lo que se prescribe para el lavado, el amortajamiento y el entierro."
  fr: "Un internaute a posé une question concernant la préparation et l'inhumation du défunt. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22268) a répondu que l'inhumation du corps du défunt est un droit inaliénable pour tout musulman, respectant ainsi sa dignité et lui rendant hommage; la réponse détaille les prescriptions relatives à la toilette mortuaire, à l'enveloppement et à l'inhumation."
  tr: "Bir soru soran kişi ölenin hazırlanması ve defin işlemleri hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22268), ölen kişinin bedeninin gömülmesinin her Müslümanın onurunu koruması ve kutsallığına saygı göstermesi için yerleşik bir hak olduğu dini olarak kabul edildiğini yanıtladı. Cevap, yıkanma, kefenle örtme ve gömme için nelerin şart olduğunu netleştirdi."
  id: "Seorang penanya menanyakan tentang persiapan dan pemakaman almarhum. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22268) menjawab bahwa secara agama telah ditetapkan bahwa menguburkan jenazah almarhum adalah hak yang telah ditetapkan bagi setiap Muslim untuk menjaga martabat dan menghormati kesucian mereka. Jawabannya menjelaskan apa yang diwajibkan untuk mencuci, menutupi, dan mengubur."
