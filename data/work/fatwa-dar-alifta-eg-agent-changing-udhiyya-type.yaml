label: { ar: "حكم مخالفة الوكيل للموكل في نوع الأضحية", en: "The agent departing from the kind of udhiyya the principal specified", ur: "وکیل کا موکل کی بتائی قربانی کی قسم بدلنا" }
summary:
  ar: "سائل سأل عن وكيل خالف الموكل في نوع الأضحية التي وكّله فيها تعيينًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20802)⁩ أن توكيل المسلم غيره في التضحية عنه بشاة تعيينًا جائز شرعًا ولا يجوز للوكيل مخالفة الموكل فيما وكّله فيه على ما فصّل الجواب."
  en: "A questioner asked about an agent departing from the specified kind of udhiyya the principal commissioned. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20802) answered that deputising another to sacrifice a specified sheep is lawful, and the agent may not contravene the principal's commission — as the answer details."
  ur: "ایک سائل نے وکیل کے موکل کی بتائی قربانی کی قسم سے ہٹنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20802)⁩ نے جواب دیا کہ مقررہ بھیڑ کی قربانی کے لیے وکالت جائز ہے اور وکیل اس کی خلاف ورزی نہیں کر سکتا — جیسا کہ جواب میں تفصیل ہے۔"
