id: work/fatwa-dar-alifta-eg-agent-changing-udhiyya-type
class: work
kind: fatwa
label: { ar: "حكم مخالفة الوكيل للموكل في نوع الأضحية", en: "The agent departing from the kind of udhiyya the principal specified", ur: "وکیل کا موکل کی بتائی قربانی کی قسم بدلنا", es: "El agente que se aparta del tipo de udhiyya especificado por el principal", fr: "L'agent s'écartant du type d'udhiyya spécifié par le principal", tr: "Ajanın kurban türüyle ilgili ilkesi ihlal ettiğine karar verilmesi", id: "Memutuskan pelanggaran agen terhadap prinsip terkait jenis pengorbanan" }
summary:
  ar: "سائل سأل عن وكيل خالف الموكل في نوع الأضحية التي وكّله فيها تعيينًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20802)⁩ أن توكيل المسلم غيره في التضحية عنه بشاة تعيينًا جائز شرعًا ولا يجوز للوكيل مخالفة الموكل فيما وكّله فيه على ما فصّل الجواب."
  en: "A questioner asked about an agent departing from the specified kind of udhiyya the principal commissioned. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20802) answered that deputising another to sacrifice a specified sheep is lawful, and the agent may not contravene the principal's commission — as the answer details."
  ur: "ایک سائل نے وکیل کے موکل کی بتائی قربانی کی قسم سے ہٹنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20802)⁩ نے جواب دیا کہ مقررہ بھیڑ کی قربانی کے لیے وکالت جائز ہے اور وکیل اس کی خلاف ورزی نہیں کر سکتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que un agente se apartara del tipo específico de udhiyya que el mandante le había encargado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20802) respondió que delegar en otra persona el sacrificio de una oveja específica es lícito, y que el agente no puede contravenir el encargo del mandante, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un mandataire s'écartant du type d'udhiyya spécifié par le mandant. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20802) a répondu que le fait de déléguer à une autre personne le sacrifice d'un mouton spécifié est licite et que le mandataire ne peut contrevenir à la mission confiée au mandant, comme le précise la réponse."
  tr: "Bir soru soran, atanan kurban türü konusunda müdürle anlaşmazlık yaşayan bir ajan hakkında soru sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20802), bir Müslümanı başka bir Müslümana onun adına koyun kurban etmesi için atamanın İslam hukukuna göre izin olduğunu ve temsilcinin kendisine emanet ettiği görevde asıl kişiye karşı çıkmasının yasak olduğunu yanıtlamıştır; bu da cevabında ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang seorang agen yang tidak setuju dengan prinsipal mengenai jenis pengorbanan yang membuatnya ditunjuk berdasarkan pengangkatan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20802) menjawab bahwa mengangkat seorang Muslim kepada orang lain untuk mengorbankan seekor domba atas namanya diperbolehkan menurut hukum Islam, dan tidak diperbolehkan bagi agen tersebut untuk menentang prinsipal dalam apa yang dipercayakan kepadanya, seperti yang dijelaskan dalam jawaban."
