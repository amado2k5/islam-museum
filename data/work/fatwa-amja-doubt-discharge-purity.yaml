id: work/fatwa-amja-doubt-discharge-purity
class: work
kind: fatwa
label: { ar: "الشك في المني", en: "A doubtful discharge — purity stands until certainty", ur: "منی کا شک — طہارت قائم رہتی ہے", es: "Una descarga dudosa: la pureza se mantiene hasta que haya certeza.", fr: "Une libération douteuse — la pureté demeure jusqu'à certitude", tr: "Menide şüphe", id: "Keraguan pada sperma" }
summary:
  ar: "سأل سائل أنه أجرى عملية في أنفه وصار ينزل دمًا وشك فيما وجد من بلل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83917 بتاريخ 7 مارس 2011)⁩ أن الأصل هو الطهارة حتى يستيقن زوالها بما يوجب ذلك من نزول المني أو جماع ونحوه، وما دام لم يستيقن أن البلل الذي وجده مني فلا يلزمه الاغتسال منه لأن الأصل عدم وجوبه والأصل هو الطهارة حتى يخرج منها بيقين، ومن عجز عن استعمال الماء لمرض فإنه يتيمم وقد شرع الله رخصة التيمم لمثل هذه الحالات على ما فصّل."
  en: "A questioner had surgery on his nose, bled, and doubted some wetness he found. Dr. Salah al-Sawi (fatwa no. 83917, 7 March 2011) answered that the rule is purity stands until its removal is certain — by descent of semen, intercourse and the like; as long as he is not certain the wetness is semen no washing binds him, the default being no obligation and purity until certainty removes it; and one unable to use water for illness does tayammum, a dispensation God legislated for such states — as the answer details."
  ur: "ایک شخص کو آپریشن کے بعد بلل کا شک تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83917، 7 مارچ 2011)⁩ کے مطابق طہارت قائم رہتی ہے جب تک یقین نہ ہو؛ مریض پر تیمم ہے۔"
  es: "Un consultante se sometió a una cirugía nasal, sangró y notó cierta humedad. El Dr. Salah al-Sawi (fatwa n.° 83917, 7 de marzo de 2011) respondió que la regla es que la pureza se mantiene hasta que su eliminación sea segura, ya sea por la presencia de semen, relaciones sexuales o similares; mientras no esté seguro de que la humedad sea semen, no está obligado a realizar ningún lavado, pues por defecto no hay obligación y la pureza se mantiene hasta que la certeza la elimine; y quien no puede usar agua para tratar una enfermedad realiza el tayammum, una dispensa que Dios legisló para tales estados, como se detalla en la respuesta."
  fr: "Un homme ayant subi une opération du nez et ayant saigné a eu des doutes quant à la présence d'humidité. Le Dr Salah al-Sawi (fatwa n° 83917, 7 mars 2011) a répondu que la règle de pureté demeure jusqu'à ce que la cause de l'humidité soit certaine – par écoulement de sperme, rapports sexuels, etc. Tant qu'il n'est pas certain que cette humidité soit du sperme, aucun lavage ne l'oblige, la pureté restant demeurant jusqu'à ce que la certitude soit levée. Celui qui ne peut utiliser d'eau pour cause de maladie pratique le tayammum, une dispense divine pour de tels cas, comme le précise la réponse."
  tr: "Bir soruya burnuna ameliyat olmuş ve kanamaya başlamış, bulduğu ıslaklıktan şüphe duymuştur. Dr. Salah Al-Sawy (7 Mart 2011 tarihli Fetva No. 83917) yanıtlamıştır; bu da meni boşalması veya cinsel ilişki gerektirecektir. Bulunan ıslaklığın kendisinden kaynaklandığından emin olmadığı sürece, ghusl yapmak zorunda değildir çünkü varsayılan olarak zorunlu değildir ve kesin olarak serbest bırakılana kadar arınmadır. Eğer hastalık nedeniyle su kullanamazsa, teyemem (kuru abdest) yapar ve Allah bu tür durumlar için tayammum için yasal izin vermiştir, açıklandığı gibi."
  id: "Seorang penanya ditanya bahwa ia menjalani operasi hidung dan mulai berdarah serta meragukan kelembapan yang ditemukannya. Dr. Salah Al-Sawy menjawab (Fatwa No. 83917 tanggal 7 Maret 2011) bahwa default-nya adalah pemurnian sampai ia yakin akan diangkat, yang memerlukan ejakulasi sperma atau hubungan seksual atau sejenisnya. Selama ia tidak yakin bahwa kelembapan yang ditemukan berasal darinya, ia tidak wajib melakukan ghusl karena defaultnya adalah tidak wajib, dan default-nya adalah purifikasi sampai dilepaskan dengan pasti. Jika seseorang tidak dapat menggunakan air karena sakit, ia melakukan tayammum (wudhu kering), dan Allah telah menetapkan izin untuk tayammum dalam kasus seperti itu, seperti yang dijelaskan."
