summary:
  ar: "كتاب الواحدي ⁦(ت 468هـ)⁩ في أسباب نزول آيات القرآن، وهو عند حاجي خليفة أشهر ما صنف في هذا الشأن {cite:kashf-zunun-furqan p. 381-382}؛ ألّفه لإفادة المبتدئين «إبانة ما أنزل فيه من الأسباب»، لأنه يرى أنه يمتنع معرفة تفسير الآية دون الوقوف على قصتها وبيان نزولها، وأنه لا يحل القول في الأسباب إلا بالرواية والسماع {cite:asbab-nuzul-wahidi-ilmiyya-1991 p.10}؛ ويذكر محققه ماهر ياسين فحل أنه جمع فيه أسباب النزول لأكثر من 500 آية مسندة أو معلقة، وأن اسمه الذي سماه به مؤلفه «أسباب نزول القرآن» {cite:asbab-nuzul-wahidi-maiman-2005 p.7} {cite:asbab-nuzul-wahidi-maiman-2005 p.49}."
  en: "Al-Wahidi's (d. 468 AH) book on the occasions on which Qur'anic verses were revealed, which Hajji Khalifa calls the most famous work in the field; he wrote it to teach beginners 'what occasions there were for what was revealed', holding that a verse's interpretation cannot be known without its story and the account of its revelation, and that one may speak of these occasions only by transmission and hearing. Its editor Mahir Yasin Fahl says it gathers the occasions of more than 500 verses, with or without chains, and that its author's own title is Asbab nuzul al-Qur'an."
  es: "El libro de Al-Wahidi (fallecido en el año 468 de la Hégira) sobre las ocasiones en que se revelaron los versículos coránicos, que Hajji Khalifa considera la obra más famosa en este campo, fue escrito para enseñar a los principiantes «cuáles fueron las ocasiones de revelación», sosteniendo que la interpretación de un versículo no puede conocerse sin su historia y el relato de su revelación, y que solo se puede hablar de estas ocasiones mediante la transmisión y la escucha. Su editor, Mahir Yasin Fahl, afirma que recopila las ocasiones de más de 500 versículos, con o sin cadenas de transmisión, y que el título original del autor es Asbab nuzul al-Qur'an."
  fr: "L'ouvrage d'Al-Wahidi (mort en 468 AH) sur les circonstances de la révélation des versets coraniques, considéré par Hajji Khalifa comme l'œuvre la plus célèbre en la matière, fut écrit pour enseigner aux débutants les circonstances de chaque révélation. Il soutenait que l'interprétation d'un verset est indissociable de son contexte historique et du récit de sa révélation, et que ces circonstances ne peuvent être connues que par transmission orale. Son éditeur, Mahir Yasin Fahl, précise qu'il rassemble les circonstances de plus de 500 versets, avec ou sans chaînes de transmission, et que son auteur l'a lui-même intitulé « Asbab nuzul al-Qur'an »."
  ur: "الواحدی ⁦(متوفی 468ھ)⁩ کی کتاب ان مواقع پر جن پر قرآنی آیات نازل ہوئیں، جسے حاجی خلیفہ میدان میں سب سے مشہور کام کہتے ہیں۔ اس نے اسے ابتدائیوں کو یہ سکھانے کے لیے لکھا کہ 'جو کچھ نازل ہوا ہے اس کے کیا مواقع تھے'، اس کا خیال تھا کہ کسی آیت کی تفسیر اس کے قصہ اور اس کے نزول کے حساب کے بغیر نہیں جانی جا سکتی، اور یہ کہ کوئی بھی ان مواقع کے بارے میں صرف ترسیل اور سماعت سے بات کر سکتا ہے۔ اس کے ایڈیٹر ماہر یاسین فہل کہتے ہیں کہ یہ 500 سے زائد آیات کے مواقع کو جمع کرتا ہے، بغیر زنجیروں کے، اور اس کے مصنف کا اپنا عنوان اصباب نزول القرآن ہے۔"
  tr: "El-Vahidi'nin (ö. 468 Hicri) Kur'an ayetlerinin vahyedilmesinin nedenleri üzerine kitabı, Hacı Halife tarafından bu konudaki en ünlü çalışma olarak kabul edilir {atıf:kaşf-zunun-furqan, s. 381-382}; \"içinde vahy edilenleri akıllarla açıklayarak\" yeni başlayanlar için faydalı olmak amacıyla yazılmıştır; çünkü bir ayetin yorumunu bilmenin hikayesini incelemeden ve vahiyini açıklamadan bilinmeyeceğine ve nedenlerin ancak rivayet ve işitme yoluyla tartışılmasının mümkün olmadığını düşünür. {alıntı: asbab-nuzul-wahidi-ilmiyya-1991 s.10}; editörü Maher Yassin Fahl, 500'den fazla bağlantılı veya askıya alınmış ayetin vahyedilme nedenlerini topladığını ve yazarı tarafından verilen ismin \"Asbab Nuzul-Wahidi-Maiman-2005 s.7} {cite:asbab-nuzul-wahidi-maiman-2005 s.49} olduğunu belirtmektedir."
  id: "Buku Al-Wahidi (wafat 468 H) tentang alasan wahyu ayat-ayat Al-Qur'an, yang dianggap oleh Haji Khalifa sebagai karya paling terkenal tentang subjek ini {sitasi: Kashf-Zunun-Furqan, hlm. 381-382}; buku ini ditulis untuk manfaat pemula dengan \"memperjelas apa yang diwahyukan di dalamnya melalui alasan,\" karena ia percaya mustahil mengetahui penafsiran suatu ayat tanpa memeriksa kisahnya dan menjelaskan wahyunya, dan bahwa tidak diperbolehkan membahas penyebabnya kecuali melalui narasi dan pendengaran. {sitasi: asbab-nuzul-wahidi-ilmiyya-1991 hlm.10}; editornya Maher Yassin Fahl menyebutkan bahwa ia mengumpulkan alasan pengungkapan lebih dari 500 bait yang terkait atau ditangguhkan, dan nama yang diberikan oleh penulisnya adalah \"Asbab Nuzul-Wahidi-Maiman-2005 hlm.7} {cite:asbab-nuzul-wahidi-maiman-2005 hlm.49}."
