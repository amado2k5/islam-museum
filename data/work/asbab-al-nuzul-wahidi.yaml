structure: "Author's preface (on the revelation in instalments, the duty of transmission in this science, the caution of the early generations); an opening section on the beginnings of revelation, how the Qur'an first came down and Gabriel's custody of it; then the occasions verse by verse in the order of the suras, each heading 'His saying, Mighty and Exalted: ... (the verse)' (Ilmiyya ed. pp. 9-11; Maiman ed. study pp. 52-53)."
