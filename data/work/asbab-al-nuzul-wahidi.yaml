label: { ar: "أسباب نزول القرآن (أسباب النزول)", en: "Asbab Nuzul al-Qur'an (Asbab al-Nuzul)", ur: "اسباب نزول القرآن (اسباب النزول)" }
summary:
  ar: "كتاب الواحدي (ت 468هـ) في أسباب نزول آيات القرآن، وهو عند حاجي خليفة أشهر ما صنف في هذا الشأن {cite:kashf-zunun-furqan p. 381-382}؛ ألّفه لإفادة المبتدئين «إبانة ما أنزل فيه من الأسباب»، لأنه يرى أنه يمتنع معرفة تفسير الآية دون الوقوف على قصتها وبيان نزولها، وأنه لا يحل القول في الأسباب إلا بالرواية والسماع {cite:asbab-nuzul-wahidi-ilmiyya-1991 p.10}؛ ويذكر محققه ماهر ياسين فحل أنه جمع فيه أسباب النزول لأكثر من 500 آية مسندة أو معلقة، وأن اسمه الذي سماه به مؤلفه «أسباب نزول القرآن» {cite:asbab-nuzul-wahidi-maiman-2005 p.7} {cite:asbab-nuzul-wahidi-maiman-2005 p.49}."
  en: "Al-Wahidi's (d. 468 AH) book on the occasions on which Qur'anic verses were revealed, which Hajji Khalifa calls the most famous work in the field; he wrote it to teach beginners 'what occasions there were for what was revealed', holding that a verse's interpretation cannot be known without its story and the account of its revelation, and that one may speak of these occasions only by transmission and hearing. Its editor Mahir Yasin Fahl says it gathers the occasions of more than 500 verses, with or without chains, and that its author's own title is Asbab nuzul al-Qur'an."
