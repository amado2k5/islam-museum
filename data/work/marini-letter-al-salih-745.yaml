label: { ar: "رسالة أبي الحسن المريني إلى الملك الصالح إسماعيل", en: "Letter of Abu al-Hasan al-Marini to al-Malik al-Salih Isma'il", es: "Carta de Abu al-Hasan al-Marini a al-Malik al-Salih Isma'il", fr: "Lettre d'Abou al-Hasan al-Marini à al-Malik al-Salih Isma'il", ur: "ابو الحسن المرینی کا المالک الصالح اسماعیل کو خط" }
summary:
  ar: "نسخة الكتاب الذي خاطب به أمير المسلمين السلطان أبو الحسن المريني ملك المغرب السلطان الملك الصالح بن السلطان الملك الناصر محمد بن قلاوون، ووصل إلى مصر في النصف وقيل في العشر الأواخر من شعبان سنة ٧٤٥؛ مطلعه: من عند عبد الله أمير المسلمين المجاهد في سبيل الله المنصور بفضل الله سلطان البرين حامي العدوتين مؤثر المرابطة والمثاغرة، إلى محل ولدنا السلطان الجليل الملك الصالح أبي الوليد إسماعيل ابن الملك الناصر محمد؛ ومن ألقاب الناصر محمد فيه: والد السلاطين الأخيار عاقد لواء النصر في قهر الأرمن والفرنج والتتار ومحيي رسوم الجهاد {cite:nafh-tib-maqqari p. 390-391}."
  en: "The letter in which Amir al-Mu'minin Abu al-Hasan al-Marini, 'sultan of the two shores, guardian of both banks,' addressed al-Malik al-Salih Isma'il son of al-Nasir Muhammad ibn Qalawun — reaching Egypt in mid-Shawwal 745 — with the full chancery titulature and the praise of al-Nasir as 'raiser of the banner of victory over Armenians, Franks and Tatars' {cite:nafh-tib-maqqari p. 390-391}."
  es: "La carta en la que Amir al-Mu'minin Abu al-Hasan al-Marini, 'sultán de las dos orillas, guardián de ambas riberas', se dirigió a al-Malik al-Salih Isma'il hijo de al-Nasir Muhammad ibn Qalawun —llegando a Egipto a mediados de Shawwal 745— con la titulación completa de la cancillería y elogiando a al-Nasir como 'el que enarboló la bandera de la victoria sobre los armenios, francos y tártaros' {cite:nafh-tib-maqqari p. 390-391}."
  fr: "La lettre dans laquelle Amir al-Mu'minin Abu al-Hasan al-Marini, « sultan des deux rives, gardien des deux rives », s'adressait à al-Malik al-Salih Isma'il, fils d'al-Nasir Muhammad ibn Qalawun — parvenant en Égypte au milieu du Shawwal 745 — avec la titulature complète de chancellerie et l'éloge d'al-Nasir comme « celui qui a hissé l'étendard de la victoire sur les Arméniens, les Francs et les Tatars » {cite: nafh-tib-maqqari p. 390-391}."
  ur: "وہ خط جس میں امیر المومنین ابو الحسن المرینی، 'دونوں ساحلوں کے سلطان، دونوں کناروں کے نگہبان' نے ملک الصالح اسماعیل ولد ناصر محمد بن قلاون کو مخاطب کیا تھا - جو کہ وسط شوال 745 میں مصر پہنچ رہا تھا، جس میں مکمل الصدور و عنایت کا اعلان کیا گیا تھا۔ آرمینی، فرینک اور تاتاروں پر فتح کا جھنڈا 390-391}۔"
