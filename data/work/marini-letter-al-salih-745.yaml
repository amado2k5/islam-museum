label: { ar: "رسالة أبي الحسن المريني إلى الملك الصالح إسماعيل" }
summary:
  ar: "نسخة الكتاب الذي خاطب به أمير المسلمين السلطان أبو الحسن المريني ملك المغرب السلطان الملك الصالح بن السلطان الملك الناصر محمد بن قلاوون، ووصل إلى مصر في النصف وقيل في العشر الأواخر من شعبان سنة ٧٤٥؛ مطلعه: من عند عبد الله أمير المسلمين المجاهد في سبيل الله المنصور بفضل الله سلطان البرين حامي العدوتين مؤثر المرابطة والمثاغرة، إلى محل ولدنا السلطان الجليل الملك الصالح أبي الوليد إسماعيل ابن الملك الناصر محمد؛ ومن ألقاب الناصر محمد فيه: والد السلاطين الأخيار عاقد لواء النصر في قهر الأرمن والفرنج والتتار ومحيي رسوم الجهاد {cite:nafh-tib-maqqari p. 390-391}."
  en: "The letter in which Amir al-Mu'minin Abu al-Hasan al-Marini, 'sultan of the two shores, guardian of both banks,' addressed al-Malik al-Salih Isma'il son of al-Nasir Muhammad ibn Qalawun — reaching Egypt in mid-Shawwal 745 — with the full chancery titulature and the praise of al-Nasir as 'raiser of the banner of victory over Armenians, Franks and Tatars' {cite:nafh-tib-maqqari p. 390-391}."
