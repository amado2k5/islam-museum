id: work/fatwa-dar-alifta-eg-bipolar-disorder-and-marriage
class: work
kind: fatwa
label: { ar: "أثر مرض اضطراب ثنائي القطب على عقد الزواج", en: "The effect of bipolar disorder on the marriage contract", ur: "دو قطبی بیماری کا عقدِ نکاح پر اثر", es: "El efecto del trastorno bipolar en el contrato matrimonial", fr: "L'effet du trouble bipolaire sur le contrat de mariage", tr: "Bipolar Bozukluğun Evlilik Sözleşmesine Etkisi", id: "Dampak Gangguan Bipolar terhadap Kontrak Pernikahan" }
summary:
  ar: "سائل سأل عن أثر إصابة الزوج بمرض اضطراب ثنائي القطب على عقد الزواج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20847)⁩ أنه لا حرج على الزوجة شرعًا في أن ترفع أمرها إلى القضاء بطلب التفريق للعيب بسبب إصابة الزوج بالمرض المذكور على ما فصّل الجواب."
  en: "A questioner asked about the effect of the husband's bipolar disorder on the marriage contract. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20847) answered that the wife may, without sin, take her matter to court seeking dissolution for the defect caused by the illness — as the answer details."
  ur: "ایک سائل نے شوہر کی دو قطبی بیماری کے عقد نکاح پر اثر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20847)⁩ نے جواب دیا کہ بیوی عدالت سے عیب کی بنیاد پر تفریق کی درخواست کر سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre el efecto del trastorno bipolar del esposo en el contrato matrimonial. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20847) respondió que la esposa puede, sin pecar, llevar su caso a los tribunales solicitando la disolución del matrimonio por el defecto causado por la enfermedad, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'incidence du trouble bipolaire du mari sur le contrat de mariage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20847) a répondu que l'épouse peut, sans commettre de péché, saisir le tribunal afin d'obtenir la dissolution du mariage pour cause de trouble lié à la maladie – comme le précise la réponse."
  tr: "Bir soru soran kişi, kocanın bipolar bozukluk teşhisinin evlilik sözleşmesi üzerindeki etkisini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20847), cevabında ayrıntılı olarak belirtildiği üzere, eşin hastalığı nedeniyle ayrılık talebinde bulunmasına dini bir itiraz olmadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang dampak diagnosis gangguan bipolar suami terhadap kontrak pernikahan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20847) menjawab bahwa tidak ada keberatan agama bagi istri untuk mengajukan kasus ke pengadilan meminta pemisahan karena penyakit suami, seperti yang dijelaskan dalam jawabannya."
