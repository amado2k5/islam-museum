summary:
  ar: "سائل سأل عن أثر إصابة الزوج بمرض اضطراب ثنائي القطب على عقد الزواج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20847)⁩ أنه لا حرج على الزوجة شرعًا في أن ترفع أمرها إلى القضاء بطلب التفريق للعيب بسبب إصابة الزوج بالمرض المذكور على ما فصّل الجواب."
  en: "A questioner asked about the effect of the husband's bipolar disorder on the marriage contract. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20847) answered that the wife may, without sin, take her matter to court seeking dissolution for the defect caused by the illness — as the answer details."
  ur: "ایک سائل نے شوہر کی دو قطبی بیماری کے عقد نکاح پر اثر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20847)⁩ نے جواب دیا کہ بیوی عدالت سے عیب کی بنیاد پر تفریق کی درخواست کر سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
