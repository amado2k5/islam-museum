label: { ar: "قصيدة المتنبي «لكل امرئ من دهره ما تعودا»", en: "Al-Mutanabbi's ode 'Every man has from his fortune what he is accustomed to'", es: "La oda de Al-Mutanabbi: \"Cada hombre recibe de su fortuna lo que está acostumbrado\".", fr: "L'ode d'Al-Mutanabbi: « Chaque homme a de sa fortune ce à quoi il est habitué »", ur: "المتنبی کا قول 'ہر آدمی کے پاس اپنی قسمت سے وہی ہوتا ہے جس کا وہ عادی ہے'", tr: "Al-Mutanabbi'nin şiiri: \"Her insan kendi döneminde alışık olduğu şeylere sahiptir\"", id: "Puisi Al-Mutanabbi: \"Setiap orang memiliki apa yang biasa mereka temui di zamannya\"" }
summary:
  ar: "قصيدة من الطويل على روي الدال يمدح بها المتنبي سيف الدولة ويهنئه بعيد الأضحى سنة 342هـ ⁦(953م)⁩، أنشده إياها في ميدانه بحلب وهما على فرسيهما، كما يقدّم لها الديوان {{cite:diwan-mutanabbi-dar-beirut-1983 p.370}}."
  en: "An ode in the tawil metre on the rhyme dal praising Sayf al-Dawla and congratulating him on the Feast of Sacrifice in 342 AH (953 CE); the edition says the poet recited it to him on their horses in his parade-ground at Aleppo {{cite:diwan-mutanabbi-dar-beirut-1983 p.370}}."
  es: "Una oda en metro tawil sobre la rima dal que alaba a Sayf al-Dawla y lo felicita en la Fiesta del Sacrificio en 342 AH (953 d. C.); la edición dice que el poeta se la recitó a caballo en su plaza de armas en Alepo {{cite:diwan-mutanabbi-dar-beirut-1983 p.370}}."
  fr: "Une ode en mètre tawil sur la rime dal louant Sayf al-Dawla et le félicitant à l'occasion de la Fête du Sacrifice en 342 AH (953 CE); l'édition dit que le poète la lui a récitée sur leurs chevaux dans son terrain de parade à Alep {{cite:diwan-mutanabbi-dar-beirut-1983 p.370}}."
  ur: "سیف الدولہ کی تعریف کرتے ہوئے اور انہیں 342 ہجری ⁦(953 عیسوی)⁩ میں قربانی کے تہوار پر مبارکباد دیتے ہوئے شاعری کی دال پر تاویل میٹر میں ایک نظم؛ ایڈیشن کہتا ہے کہ شاعر نے اسے حلب میں اپنے پریڈ گراؤنڈ میں گھوڑوں پر بیٹھ کر سنایا۔"
  tr: "Al-Tawil'in Dal anlatımı üzerine yazdığı bir şiir; burada Al-Mutanabbi, Sayf al-Dawla'yı över ve 342 Hicri Yılı'nda (953 M.S.) Ramazan Bayramı'nda kutlar; bu şiir, Halep'teki tarlasında atlarında okumuştur. Ayrıca bu şiiri {{cite:diwan-mutanabbi-dar-beirut-1983 s.370}} koleksiyonuna da dahil eder."
  id: "Sebuah puisi oleh Al-Tawil tentang narasi Dal, di mana Al-Mutanabbi memuji Sayf al-Dawla dan mengucapkan selamat atas Idul Fitri tahun 342 H (953 M), yang dibacakan olehnya di ladangnya di Aleppo saat mereka sedang menunggang kuda. Ia juga memperkenalkannya ke dalam kumpulan {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.370}}."
