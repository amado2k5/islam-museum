summary:
  ar: "قصيدة من الطويل على روي الدال يمدح بها المتنبي سيف الدولة ويهنئه بعيد الأضحى سنة 342هـ ⁦(953م)⁩، أنشده إياها في ميدانه بحلب وهما على فرسيهما، كما يقدّم لها الديوان {{cite:diwan-mutanabbi-dar-beirut-1983 p.370}}."
  en: "An ode in the tawil metre on the rhyme dal praising Sayf al-Dawla and congratulating him on the Feast of Sacrifice in 342 AH (953 CE); the edition says the poet recited it to him on their horses in his parade-ground at Aleppo {{cite:diwan-mutanabbi-dar-beirut-1983 p.370}}."
