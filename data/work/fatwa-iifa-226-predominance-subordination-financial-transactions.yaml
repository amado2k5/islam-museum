label: { ar: "قرار مجمع الفقه الإسلامي الدولي 226 (23/10) بشأن الغلبة والتبعية في المعاملات المالية: حالاتهما وضوابطهما وشروط تحققهما", en: "IIFA resolution 226 (23/10) on predominance and subordination in financial transactions: their cases, controls and conditions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 226 (23/10): مالی معاملات میں غلبہ اور تبعیت: ان کی صورتیں، ضوابط اور شرائط", es: "Resolución 226 (23/10) de la IIFA sobre predominio y subordinación en las operaciones financieras: sus casos, controles y condiciones.", fr: "Résolution 226 (23/10) de l'IIFA sur la prédominance et la subordination dans les transactions financières: leurs cas, leurs contrôles et leurs conditions", tr: "Uluslararası İslami Fıkıh Akademisi Kararı 226 (23/10) Finansal İşlemlerde Üstünlük ve Subsidiarite: Davaları, Kontrolleri ve Gerçekleşme Koşulları", id: "Keputusan International Islamic Fiqh Academy 226 (23/10) tentang Preponderance dan Subsidiaritas dalam Transaksi Keuangan: Kasus, Kontrol, dan Kondisi untuk Realisasi" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩، بعد اعتماد الصياغة النهائية لتوصيات ندوته مع مجموعة البنك الإسلامي للتنمية ⁦(جدة، 25–26 صفر 1436هـ)⁩ بناء على قراره 214 ⁦(22/10)⁩ وبالنظر إلى قراراته 30 و188 و196. قرر المجمع: أولًا تأكيد قراره 30 في أن تداول الورقة المالية ⁦(سهمًا أو صكًا أو وحدة)⁩ قبل مباشرة العمل مبادلة نقد بنقد تطبق عليها أحكام الصرف، وإذا تحولت الموجودات إلى ديون طبقت أحكام التصرف في الديون. ثانيًا أن قاعدة التبعية ⁦(التّابع تابع)⁩ مقررة شرعًا فيجوز العمل بها في تداول الأوراق المالية بشرط تحقق المتبوع، وضابطه وجود النشاط والعمل والكيان المسؤول عن تقليب المال، فيجوز التداول دون اعتبار نسبة النقود والديون ضمن الموجودات لأنها تابعة لا مستقلة، مع بقاء الأصل المتبوع في جميع مراحل التداول. ثالثًا إذا كانت الأوراق المالية لا تمثل نشاطًا تجاريًا بل ملكية شائعة في تمويلات مؤسسة مالية فإن كان موجوداتها مختلطة من نقود وديون وأعيان ومنافع جاز تداولها بشرط غلبة الأعيان والمنافع، وضابطها أن تزيد عن النصف ⁦(50%)⁩. رابعًا لا يجوز اتخاذ الجواز ذريعة أو حيلة لتصكيك الديون وتداولها بإضافة أعيان ومنافع لتصوير الغلبة. وطبق القاعدتين على الصكوك والوحدات الاستثمارية: استيفاء العقد أركانه الشرعية، وجواز التداول إذا غلبت الأعيان أو المنافع أو الخدمات بعد قفل الاكتتاب وبدء النشاط، ومراعاة أحكام الصرف والديون قبله، وتفصيل أحكام صكوك ملكية منافع الأعيان المعينة والموصوفة في الذمة وملكية الخدمات قبل إعادة الإجارة وبعدها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), adopting the final wording of recommendations from its seminar with the Islamic Development Bank Group (Jeddah, 25–26 Safar 1436), reworked under resolution 214 (22/10) and in view of resolutions 30, 188 and 196. It ruled: first, reaffirming resolution 30 that trading a security (share, sukuk or unit) when the pooled money has not yet begun operating is exchanging money for money, governed by the rules of currency exchange, and if the assets turn into debts the rules on disposing of debts apply. Second, the principle of subordination (the subordinate takes the ruling of what it follows) is established in the sharia and may govern trading securities provided the dominant element exists — its criterion being the presence of an activity, work and a responsible entity (institution or company) turning over the money; the security may then be traded regardless of the share of cash and debts in its assets as those are subordinate, not independent, provided the dominant element persists through all stages of trading. Third, where securities do not represent a trading activity but common ownership in financings from a financial institution, mixed assets of cash, debts, tangibles and usufruct may be traded at the agreed price provided tangibles and usufruct predominate — its criterion exceeding half (50%). Fourth, the permissibility may not be made a device or trick to securitise and trade debts, as by adding tangibles and usufruct to fabricate predominance. It applied the two principles to sukuk and investment units: the underlying contract must fulfil its sharia elements; trading is permissible when tangibles, usufruct or services predominate after subscription closes and activity begins, while before it the rules of exchange and debts apply; and it detailed the rulings on sukuk of ownership of usufruct of identified assets, usufruct of assets described in obligation, and service-ownership sukuk before and after re-leasing."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں، اسلامی ترقیاتی بینک گروپ کے ساتھ منعقدہ ندوات ⁦(جدہ، 25–26 صفر 1436ھ)⁩ کی سفارشات کی حتمی صورت کے اندراج کے بعد، قرارداد 214 ⁦(22/10)⁩ اور قراردادیں 30، 188، 196 کی روشنی میں۔ اس نے فیصلہ کیا: اول، قرارداد 30 کی تائید کہ سرمایہ کاری شروع ہونے سے پہلے سیکیورٹی ⁦(حصہ، صک یا یونٹ)⁩ کا تبادلہ نقد کے بدلے نقد ہے جس پر صرف کے احکام لاگو ہیں، اور اگر موجودات قرض بن جائیں تو قرض کے تصرف کے احکام لاگو ہوں گے۔ دوم، تبعیت کا اصول ⁦(تابع، متبوع کا حکم رکھتا ہے)⁩ شرعاً مقرر ہے اور سیکیورٹیوں کی خرید و فروخت میں اس پر عمل کیا جاسکتا ہے بشرطیکہ متبوع عنصر موجود ہو — اس کا معیار ایسی سرگرمی، کام اور ذمہ دار ادارہ ⁦(ادارہ یا کمپنی)⁩ کا ہونا ہے جو مال کو گھماتا ہو؛ پھر موجودات میں نقد اور قرضوں کے تناسب کو ملحوظ کیے بغیر خرید و فروخت جائز ہے کیونکہ وہ تابع ہیں، بشرطیکہ ہر مرحلے میں متبوع قائم رہے۔ سوم، جہاں سیکیورٹیاں تجارتی سرگرمی کی نمائندگی نہیں کرتیں بلکہ مالی ادارے کی فنانسنگز میں مشترک ملکیت ہیں، وہاں نقد، قرض، عین اور منفعت کے مرکب موجودات متفقہ قیمت پر تبادلہ ہوسکتے ہیں بشرطیکہ عین و منفعت غالب ہوں — معیار نصف ⁦(50%)⁩ سے زائد۔ چہارم، اس جواز کو قرضوں کی سیکیورٹی بنانے اور فروخت کا ذریعہ یا حیلہ نہیں بنایا جاسکتا، مثلاً عین و منفعت ملا کر غلبہ کی تصویر بنانا۔ اس نے دونوں اصولوں کو صکوک اور سرمایہ کاری یونٹس پر لاگو کیا: بنیادی معاہدہ شرعی ارکان پر پورا ہو؛ سبسکرپشن بند اور سرگرمی شروع ہونے کے بعد عین، منفعت یا خدمات کے غالب ہونے پر فروخت جائز ہے، اس سے پہلے صرف و قرض کے احکام لاگو ہیں؛ اور عینوں کے منافع کی ملکیت کے صکوک، ذمہ میں مخصوص منافع اور خدمات کی ملکیت کے صکوک کے احکام دوبارہ اجارے سے پہلے اور بعد میں تفصیل ہوئے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018), adoptando la redacción final de las recomendaciones de su seminario con el Grupo del Banco Islámico de Desarrollo (Jeddah, 25-26 Safar 1436), reelaborada bajo la resolución 214 (22/10) y en vista de las resoluciones 30, 188 y 196. Dictaminó: primero, reafirmar la resolución 30 que negociar un valor (acción, sukuk o unidad) cuando el dinero mancomunado aún no ha comenzado a operar es un intercambio de dinero por dinero, regido por las reglas de cambio de divisas, y si los activos se convierten en deudas se aplican las reglas sobre la disposición de deudas. Segundo, el principio de subordinación (el subordinado toma la regla de lo que sigue) está establecido en la sharia y puede regir la negociación de valores siempre que exista el elemento dominante —su criterio es la presencia de una actividad, trabajo y una entidad responsable (institución o empresa) que mueve el dinero; el valor puede entonces negociarse independientemente de la proporción de efectivo y deudas en sus activos, ya que estos son subordinados, no independientes, siempre que el elemento dominante persista en todas las etapas de la negociación. Tercero, cuando los valores no representan una actividad comercial sino propiedad común en financiamientos de una institución financiera, los activos mixtos de efectivo, deudas, bienes tangibles y usufructo pueden negociarse al precio acordado siempre que los bienes tangibles y el usufructo predominen —su criterio es que supere la mitad (50%). Cuarto, la permisibilidad no puede convertirse en un artificio o truco para titularizar y negociar deudas, como agregando bienes tangibles y usufructo para fabricar predominio. Aplicó los dos principios a los sukuk y unidades de inversión: el contrato subyacente debe cumplir con sus elementos sharia; Se permite el comercio cuando predominan los bienes tangibles, el usufructo o los servicios después del cierre de la suscripción y el inicio de la actividad, mientras que antes se aplican las reglas de intercambio y deuda; y detalló las resoluciones sobre sukuk de propiedad del usufructo de activos identificados, usufructo de activos descritos en la obligación y sukuk de propiedad de servicios antes y después del nuevo arrendamiento."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018), adoptant la formulation finale des recommandations de son séminaire avec le Groupe de la Banque islamique de développement (Djeddah, 25-26 Safar 1436), remaniée conformément à la résolution 214 (22/10) et à la lumière des résolutions 30, 188 et 196. Elle a statué: premièrement, réaffirmant la résolution 30 selon laquelle la négociation d'un titre (action, sukuk ou unité) lorsque les fonds mis en commun n'ont pas encore commencé à être utilisés constitue un échange d'argent contre de l'argent, régi par les règles du change, et si les actifs se transforment en dettes, les règles relatives à la liquidation des dettes s'appliquent. Deuxièmement, le principe de subordination (le subordonné est soumis à la décision de ce qui lui est subordonné) est établi en droit islamique et peut régir le négoce de titres à condition que l'élément dominant existe – son critère étant la présence d'une activité, d'un travail et d'une entité responsable (institution ou société) qui effectue les transactions. Le titre peut alors être négocié indépendamment de la part de liquidités et de dettes dans son actif, car celles-ci sont subordonnées et non indépendantes, pourvu que l'élément dominant persiste à toutes les étapes de la négociation. Troisièmement, lorsque les titres ne représentent pas une activité de négociation mais une participation commune dans des financements d'un établissement financier, les actifs mixtes (liquidités, dettes, biens corporels et usufruit) peuvent être négociés au prix convenu à condition que les biens corporels et l'usufruit prédominent – leur critère étant de plus de la moitié (50 %). Quatrièmement, la licéité ne doit pas servir de stratagème pour titriser et négocier des dettes, par exemple en ajoutant des biens corporels et de l'usufruit pour créer artificiellement une prédominance. Ces deux principes ont été appliqués aux sukuk et aux unités d'investissement: le contrat sous-jacent doit satisfaire aux exigences de la charia. Les échanges sont autorisés lorsque les biens corporels, l'usufruit ou les services prédominent après la clôture de la souscription et le début de l'activité, tandis qu'avant cela, les règles de l'échange et des dettes s'appliquent; et il détaille les décisions sur les sukuk de propriété d'usufruit d'actifs identifiés, l'usufruit d'actifs décrits dans l'obligation et les sukuk de propriété de services avant et après la relocation."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Safar 1440 H, 28 Ekim – 1 Kasım 2018) toplu kararı, İslam Kalkınma Bankası Grubu (Cidde, 25–26 Safar 1436 H) ile yaptığı seminerin önerilerinin nihai metnini kabul ettikten sonra, 214 (22/10) kararına dayanarak ve 30, 188 ve 196 sayılı kararlarını dikkate alarak. Akademi karar verdi: İlk olarak, çalışmaya başlamadan önce bir menkul kıymetin (hisse senedi, sukuk veya birim) ticaretinin nakit-nakit değişimi olduğunu ve varlıklar borca dönüşürse borç tasarrufu hükümlerinin uygulandığını onaylamaya karar verdi. İkinci olarak, bağlılık ilkesi (bağımlı ikincil) Şeriat ile belirlenir ve menkul kıymet alım satımında, faaliyet, iş ve parayı transfer eden kuruluşun varlığı tarafından doğrulanıp kısıtlandığı sürece uygulanabilir. Bu nedenle, varlıklar içindeki para ve borçların oranı dikkate alınmadan işlem yapılmasına izin verilir; çünkü bunlar bağımsız değil, bağımlıdır ve aşağıdaki varlık ticaretin tüm aşamalarında kalır. Üçüncüsü: Menkul kıymetler ticari faaliyet değil, finansal kurumların finansmanında ortak mülkiyet anlamına geliyorsa, varlıkları para, borçlar, gerçek varlıklar ve faydalarla karışmışsa, varlıklar ve faydalar geçerli olduğu ve koşulları yarıdan (%50) fazla olduğu sürece işlem yapılabilir. Dördüncüsü, izin verilebilirlik, borçları kapatmak ve varlıklar ve faydalar ekleyerek hakimiyet yaratmak için bir bahane veya hile olarak kullanılamaz. Bu iki kuralı sukuk ve yatırım birimlerine uyguladı: sözleşme yasal temellerini yerine getirir, abonelik kapandıktan ve faaliyet başladıktan sonra varlıklar, faydalar veya hizmetler üstün gelirse işlemlere izin verir, ödemeler ve borç kararlarının değerlendirilmesi, belirli ve tanımlanmış varlıkların mülkiyet tapuları için ayrıntılı hükümler ve kira geri ödemesinden önce ve sonra hizmetlerin mülkiyeti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Safar 1440 H, 28 Oktober – 1 November 2018), setelah mengadopsi redaksi akhir rekomendasi seminar dengan Kelompok Bank Pembangunan Islam (Jeddah, 25–26 Safar 1436 H) berdasarkan keputusan 214 (22/10) dan mempertimbangkan resolusi 30, 188, dan 196. Akademi memutuskan: Pertama, menegaskan keputusan 30 bahwa perdagangan sekuritas (saham, sukuk, atau unit) sebelum memulai pekerjaan adalah pertukaran uang tunai yang tunai tunai dan tunai yang tunduk pada aturan pertukaran, dan jika aset berubah menjadi utang, ketentuan pelunasan utang berlaku. Kedua, prinsip afiliasi (bawahan tanggungan) ditetapkan oleh Syariah dan dapat diterapkan dalam perdagangan sekuritas asalkan subjek diverifikasi dan dibatasi oleh keberadaan aktivitas, pekerjaan, dan entitas yang bertanggung jawab atas transfer uang. Oleh karena itu, perdagangan diperbolehkan tanpa mempertimbangkan proporsi uang dan utang dalam aset karena mereka bergantung, bukan independen, dengan aset berikut tetap berada di semua tahap perdagangan. Ketiga: Jika sekuritas tidak mewakili aktivitas komersial melainkan kepemilikan bersama dalam lembaga keuangan pembiayaan, jika aset mereka dicampur dengan uang, utang, aset nyata, dan manfaat, maka sekuritas tersebut dapat diperdagangkan asalkan aset dan manfaat tersebut menang, dan syaratnya adalah melebihi setengah (50%). Keempat, izin tidak boleh digunakan sebagai dalih atau trik untuk melunasi utang dan memperdagangkannya dengan menambahkan aset dan manfaat untuk menciptakan dominasi. Ia menerapkan dua aturan ini pada sukuk dan unit investasi: kontrak memenuhi pilar hukumnya, memungkinkan transaksi jika aset, manfaat, atau jasa berlaku setelah langganan ditutup dan aktivitas dimulai, pertimbangan pencairan dan putusan utang di hadapannya, ketentuan rinci untuk akta kepemilikan aset tertentu dan yang dijelaskan, serta kepemilikan jasa sebelum dan sesudah pelunasan sewa."
