id: work/fatwa-dar-alifta-braille-mushaf-in-prayer
class: work
kind: fatwa
label: { ar: "حكم قراءة القرآن بطريقة برايل أثناء الصلاة", en: "Reading a Braille mushaf during prayer", ur: "نماز میں بریل مصحف سے قرآن پڑھنے کا حکم", es: "Leer un Corán en Braille durante la oración", fr: "Lecture d'un mushaf en braille pendant la prière" }
summary:
  ar: "سائل من ذوي الإعاقة البصرية يريد أن يقرأ في صلاته، فرضًا ونفلًا، من مصحف مكتوب بطريقة برايل، وهو ما يقتضي تحريك اليدين والأنامل على الأسطر. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن ذلك جائز للإمام والمنفرد، وأن تحريك الأصابع لتتبع الأسطر حركة من أجل القراءة لا تُبطل الصلاة، مع السكون في سائر الأعضاء قدر الإمكان، بشرط أن يكون المصحف مراجعًا من اللجان المختصة."
  en: "A visually impaired questioner wants to recite in his obligatory and voluntary prayers from a mushaf printed in Braille, which requires moving his hands and fingertips along the lines. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that this is permitted for an imam or one praying alone; moving the fingers to follow the lines is movement for the sake of reading and does not invalidate the prayer, provided the other limbs stay as still as possible and the Braille mushaf has been checked by the competent review committees."
  ur: "ایک نابینا سائل اپنی فرض اور نفل نمازوں میں بریل میں لکھے مصحف سے قراءت کرنا چاہتا ہے، جس کے لیے ہاتھوں اور انگلیوں کو سطروں پر حرکت دینی پڑتی ہے۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ امام اور اکیلے نمازی دونوں کے لیے یہ جائز ہے؛ سطروں کے پیچھے انگلیاں چلانا قراءت ہی کی حرکت ہے جو نماز کو باطل نہیں کرتی، بشرطیکہ باقی اعضاء حتی الامکان ساکن رہیں اور بریل مصحف متعلقہ کمیٹیوں سے جانچا ہوا ہو۔"
  es: "Un consultante con discapacidad visual desea recitar en sus oraciones obligatorias y voluntarias un Corán impreso en Braille, lo que requiere mover las manos y las yemas de los dedos siguiendo las líneas. El Dar al-Ifta de Egipto, en una fatwa emitida bajo la dirección del Gran Muftí Nazir Ayyad, respondió que esto está permitido para un imán o para quien reza solo; mover los dedos para seguir las líneas es un movimiento para facilitar la lectura y no invalida la oración, siempre que las demás extremidades permanezcan lo más quietas posible y el Corán en Braille haya sido revisado por los comités de revisión competentes."
  fr: "Un fidèle malvoyant souhaite réciter ses prières obligatoires et surérogatoires à partir d'un mushaf imprimé en braille, ce qui implique de suivre les lignes du bout des doigts. La Dar al-Ifta d'Égypte, dans une fatwa émise sous l'égide du grand mufti Nazir Ayyad, a répondu que cela est permis pour un imam ou une personne priant seule; le déplacement des doigts pour suivre les lignes est considéré comme un mouvement nécessaire à la lecture et n'invalide pas la prière, à condition que les autres membres restent aussi immobiles que possible et que le mushaf en braille ait été vérifié par les comités de révision compétents."
