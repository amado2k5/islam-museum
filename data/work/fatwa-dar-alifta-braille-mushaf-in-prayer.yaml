id: work/fatwa-dar-alifta-braille-mushaf-in-prayer
class: work
kind: fatwa
label: { ar: "حكم قراءة القرآن بطريقة برايل أثناء الصلاة", en: "Reading a Braille mushaf during prayer", ur: "نماز میں بریل مصحف سے قرآن پڑھنے کا حکم" }
summary:
  ar: "سائل من ذوي الإعاقة البصرية يريد أن يقرأ في صلاته، فرضًا ونفلًا، من مصحف مكتوب بطريقة برايل، وهو ما يقتضي تحريك اليدين والأنامل على الأسطر. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن ذلك جائز للإمام والمنفرد، وأن تحريك الأصابع لتتبع الأسطر حركة من أجل القراءة لا تُبطل الصلاة، مع السكون في سائر الأعضاء قدر الإمكان، بشرط أن يكون المصحف مراجعًا من اللجان المختصة."
  en: "A visually impaired questioner wants to recite in his obligatory and voluntary prayers from a mushaf printed in Braille, which requires moving his hands and fingertips along the lines. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that this is permitted for an imam or one praying alone; moving the fingers to follow the lines is movement for the sake of reading and does not invalidate the prayer, provided the other limbs stay as still as possible and the Braille mushaf has been checked by the competent review committees."
  ur: "ایک نابینا سائل اپنی فرض اور نفل نمازوں میں بریل میں لکھے مصحف سے قراءت کرنا چاہتا ہے، جس کے لیے ہاتھوں اور انگلیوں کو سطروں پر حرکت دینی پڑتی ہے۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ امام اور اکیلے نمازی دونوں کے لیے یہ جائز ہے؛ سطروں کے پیچھے انگلیاں چلانا قراءت ہی کی حرکت ہے جو نماز کو باطل نہیں کرتی، بشرطیکہ باقی اعضاء حتی الامکان ساکن رہیں اور بریل مصحف متعلقہ کمیٹیوں سے جانچا ہوا ہو۔"
