id: work/fatwa-amja-dua-for-physical-beauty
class: work
kind: fatwa
label: { ar: "الدعاء بجمال الوجه والجوارح", en: "Asking God for beauty of face and limbs", ur: "چہرے اور جسم کی خوبصورتی کی دعا", es: "Pidiéndole a Dios belleza en el rostro y las extremidades." }
summary:
  ar: "سأل سائل هل يجوز أن يدعو الإنسان ربه أن يرزقه جمال الوجه والمظهر والجوارح والخلقة وهل يمكن أن يستجيب الله له في زماننا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23301 بتاريخ 14 يوليو 2008)⁩ أن للعبد أن يدعو ربه بما شاء من خيري الدنيا والآخرة على ألا يتضمن دعاؤه إثمًا ولا قطيعة رحم وليس فيما ذكر شيء من ذلك فليدع الله وهو موقن بالإجابة محسنًا الظن بربه فهو سبحانه جواد كريم."
  en: "A questioner asked whether one may pray for beauty of face, appearance, limbs and form, and whether God could grant it in our time. Dr. Salah al-Sawi (fatwa no. 23301, 14 July 2008) answered that a servant may ask his Lord whatever he wishes of this world's and the next's good, so long as his prayer contains no sin and no kinship-cutting — and what he mentioned holds none of that; let him pray certain of answer, thinking well of his Lord, who is generous and bountiful."
  ur: "ایک سائل نے چہرے اور جسم کی خوبصورتی کی دعا کے جواز پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23301، 14 جولائی 2008)⁩ کے مطابق دعا جائز ہے بشرط اس میں گناہ یا صلہ قطع نہ ہو — یقین اور نیک گمان کے ساتھ مانگے۔"
  es: "Un consultante preguntó si se puede orar por la belleza del rostro, la apariencia, las extremidades y la figura, y si Dios podría concederla en nuestros días. El Dr. Salah al-Sawi (fatwa n.° 23301, 14 de julio de 2008) respondió que un siervo puede pedirle a su Señor lo que desee para el bien de este mundo y del más allá, siempre que su oración no contenga pecado ni repudio a los parientes; y lo que mencionó no contiene nada de eso. Que ore con la certeza de una respuesta, pensando bien de su Señor, que es generoso y bondadoso."
