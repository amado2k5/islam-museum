id: work/fatwa-amja-dua-for-physical-beauty
class: work
kind: fatwa
label: { ar: "الدعاء بجمال الوجه والجوارح", en: "Asking God for beauty of face and limbs", ur: "چہرے اور جسم کی خوبصورتی کی دعا", es: "Pidiéndole a Dios belleza en el rostro y las extremidades.", fr: "Demander à Dieu la beauté du visage et des membres", tr: "Yüz ve uzuvların güzelliği için dua etmek", id: "Berdoa untuk keindahan wajah dan anggota tubuh" }
summary:
  ar: "سأل سائل هل يجوز أن يدعو الإنسان ربه أن يرزقه جمال الوجه والمظهر والجوارح والخلقة وهل يمكن أن يستجيب الله له في زماننا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23301 بتاريخ 14 يوليو 2008)⁩ أن للعبد أن يدعو ربه بما شاء من خيري الدنيا والآخرة على ألا يتضمن دعاؤه إثمًا ولا قطيعة رحم وليس فيما ذكر شيء من ذلك فليدع الله وهو موقن بالإجابة محسنًا الظن بربه فهو سبحانه جواد كريم."
  en: "A questioner asked whether one may pray for beauty of face, appearance, limbs and form, and whether God could grant it in our time. Dr. Salah al-Sawi (fatwa no. 23301, 14 July 2008) answered that a servant may ask his Lord whatever he wishes of this world's and the next's good, so long as his prayer contains no sin and no kinship-cutting — and what he mentioned holds none of that; let him pray certain of answer, thinking well of his Lord, who is generous and bountiful."
  ur: "ایک سائل نے چہرے اور جسم کی خوبصورتی کی دعا کے جواز پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23301، 14 جولائی 2008)⁩ کے مطابق دعا جائز ہے بشرط اس میں گناہ یا صلہ قطع نہ ہو — یقین اور نیک گمان کے ساتھ مانگے۔"
  es: "Un consultante preguntó si se puede orar por la belleza del rostro, la apariencia, las extremidades y la figura, y si Dios podría concederla en nuestros días. El Dr. Salah al-Sawi (fatwa n.° 23301, 14 de julio de 2008) respondió que un siervo puede pedirle a su Señor lo que desee para el bien de este mundo y del más allá, siempre que su oración no contenga pecado ni repudio a los parientes; y lo que mencionó no contiene nada de eso. Que ore con la certeza de una respuesta, pensando bien de su Señor, que es generoso y bondadoso."
  fr: "Un homme a demandé si l'on pouvait prier pour la beauté du visage, de l'apparence, des membres et de la silhouette, et si Dieu pouvait l'exaucer de nos jours. Le Dr Salah al-Sawi (fatwa n° 23301, 14 juillet 2008) a répondu qu'un serviteur peut demander à son Seigneur tout bienfait qu'il désire dans ce monde et dans l'autre, pourvu que sa prière soit exempte de péché et de toute forme de rupture des liens de parenté – or, la prière mentionnée n'en comporte aucune; qu'il prie avec la certitude d'être exaucé, en ayant une bonne opinion de son Seigneur, généreux et bienfaisant."
  tr: "Bir soru soran, bir kişinin yüzün, görünüşünün, uzuvlarının ve karakterinin güzelliğini Rab'binden dilemesi ve Allah'ın zamanımızda ona cevap verip veremeyeceğini sormuştur. Dr. Salah Al-Sawy (14 Temmuz 2008 tarihli 23301 No. fetva) bir hizmetkârın bu dünyada ve ahirette istediği her iyiliği Rab'e dilemesi gerektiğini, ancak duasının günah veya aile bağlarının koparılması içermemesi şartıyla, cevabını kesin olarak dilediğini söyledi. Bunların hiçbiri konuda belirtilmemiştir. Cevabını kesin olarak Allah'a çağırsın, Allah'tan iyi bir şey beklesin, çünkü O cömerttir, cömerttir."
  id: "Seorang penanya bertanya apakah diperbolehkan bagi seseorang untuk berdoa kepada Tuhannya agar diberikan keindahan wajah, penampilan, anggota tubuh, dan karakter, serta apakah Allah dapat menjawab di zaman kita. Dr. Salah Al-Sawy menjawab (Fatwa No. 23301 tanggal 14 Juli 2008) bahwa seorang hamba dapat memohon kepada Tuhannya dengan segala kebaikan yang diinginkannya di dunia ini dan akhirat, asalkan doanya tidak melibatkan dosa atau memutuskan ikatan keluarga. Tidak ada satu pun dari hal ini yang disebutkan dalam masalah ini. Biarlah dia memohon kepada Allah dengan pasti akan jawabannya, mengharapkan Allah dengan baik, karena Dia Murah Hati, Murah Hati."
