id: work/fatwa-aliftaa-jo-writing-off-a-debt-as-zakat
class: work
kind: fatwa
label: { ar: "إسقاط الدين عن المدين واحتسابه من الزكاة", en: "Writing off a debt and counting it as zakat", ur: "قرض معاف کر کے اسے زکوٰۃ شمار کرنا" }
summary:
  ar: "سؤال عن إسقاط الدين عن المدين واحتسابه من الزكاة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجزئ عن الزكاة وإنما هو صدقة، والأحسن أن يقبض الدائن الدين ثم يعطي المدين من زكاته إن كان من مستحقيها. أجابت الدائرة بأن إسقاط الدين عن المدين بنية احتسابه من الزكاة لا يجزئ عن الزكاة، وإنما هو صدقة يثاب عليها، لأن من شروط الزكاة أن ينويها الدافع عند دفع المال، والدين قد ثبت في ذمة المقترض فلا يصح نقل النية إلى الزكاة. وقالت إن الأحسن أن يقبض الدائن الدين من المدين، ثم يعيد إليه ما يجب عليه إخراجه زكاة أو جزءًا منه، إن كان المدين من الأصناف الثمانية المستحقة للزكاة. ونقلت من عمدة السالك أن الدافع لو أعطى فقيرًا بشرط أن يرده إليه وفاءً لدين، أو قال له: جعلت ما لي في ذمتك زكاة، لم يجزئ، وأنه إن أعطاه بنية أن يقضيه منه دون شرط جاز، ولا يلزم الوفاء بذلك."
  en: "A question about writing off a debt and counting it as zakat, in which Jordan's General Iftaa Department answered that it does not count as zakat and is a charitable gift, and that it is better for the creditor to collect the debt and then give the debtor from his zakat if he is eligible. The Department answered that writing off a debt with the intention of counting it as zakat does not discharge zakat, but is a rewarded act of charity, because zakat requires the giver to intend it at the time of handing over the money, and the debt is already established on the borrower, so the intention cannot be transferred to zakat. It said it is better for the creditor to collect the debt from the debtor and then give him back all or part of the zakat he owes, if the debtor belongs to the eight categories entitled to zakat. It quoted Umdat al-Salik that if the giver hands money to a poor person on condition that he return it in payment of a debt, or says, 'I have made what you owe me zakat,' it does not count, whereas if he gives it intending that the debtor repay him from it, without making that a condition, it counts, and the debtor is not bound to repay."
  ur: "قرض معاف کر کے اسے زکوٰۃ شمار کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ زکوٰۃ کے لیے کافی نہیں بلکہ صدقہ ہے، اور بہتر یہ ہے کہ قرض خواہ قرض وصول کر کے، اگر مقروض مستحق ہو، اسے اپنی زکوٰۃ دے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ شمار کرنے کی نیت سے قرض معاف کرنا زکوٰۃ کے لیے کافی نہیں، بلکہ ایک صدقہ ہے جس پر ثواب ملتا ہے، کیونکہ زکوٰۃ کی شرط ہے کہ دینے والا مال دیتے وقت زکوٰۃ کی نیت کرے، اور قرض پہلے ہی مقروض کے ذمے ثابت ہے، اس لیے نیت کو زکوٰۃ کی طرف منتقل کرنا درست نہیں۔ اس نے کہا کہ بہتر یہ ہے کہ قرض خواہ مقروض سے قرض وصول کرے، پھر اگر مقروض زکوٰۃ کے آٹھ مستحق طبقات میں سے ہو تو اپنی واجب زکوٰۃ یا اس کا کچھ حصہ اسے لوٹا دے۔ اس نے عمدۃ السالک سے نقل کیا کہ اگر کوئی فقیر کو اس شرط پر دے کہ وہ اسے قرض کی ادائیگی میں واپس کرے، یا کہے کہ میں نے تمہارے ذمے اپنا قرض زکوٰۃ بنا دیا، تو کافی نہیں، اور اگر بغیر شرط اس نیت سے دے کہ مقروض اسی سے ادا کرے گا تو کافی ہے، اور مقروض پر ادائیگی لازم نہیں۔"
