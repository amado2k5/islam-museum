id: work/fatwa-aliftaa-jo-wiping-over-socks
class: work
kind: fatwa
label: { ar: "المسح على الجوربين", en: "Wiping over socks", ur: "جرابوں پر مسح" }
summary:
  ar: "سؤال عن المسح على الجوربين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز المسح على غالب الجوارب المعروفة اليوم لأنها لا تتحقق فيها شروط المسح، وبيّنت تلك الشروط. أجابت الدائرة بأنه لا يجوز المسح على غالب الجوارب المعروفة اليوم، لأنها لا تتحقق فيها شروط المسح. وقالت إن الرخصة وردت في المسح على الخفين وعلى الجوربين بشروط: أن يكونا ثخينين لا ينفذ منهما الماء المصبوب، وأن يمكن متابعة المشي فيهما، وأن يُلبسا على طهارة، وأن يسترا جميع القدم إلى الكعبين، أي العظمين الناتئين، وألا يكونا مخرّقين."
  en: "A question about wiping over socks in wudu, in which Jordan's General Iftaa Department answered that most socks worn today may not be wiped over because they do not meet the conditions for wiping, and set out those conditions. The Department answered that wiping over most of the socks known today is not permitted, because they do not meet the conditions for wiping. It said that the dispensation came for wiping over leather footwear (khuffs) and socks under conditions: that they are thick and do not let poured water through, that one can keep walking in them, that they are put on in a state of purity, that they cover the whole foot up to the ankles, meaning the protruding ankle bones, and that they are not torn."
  ur: "جرابوں پر مسح کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ آج کل کی زیادہ تر جرابوں پر مسح جائز نہیں کیونکہ ان میں مسح کی شرائط پوری نہیں ہوتیں، اور وہ شرائط بیان کیں۔ ڈیپارٹمنٹ نے جواب دیا کہ آج کل معروف زیادہ تر جرابوں پر مسح جائز نہیں، کیونکہ ان میں مسح کی شرائط پوری نہیں ہوتیں۔ اس نے کہا کہ رخصت چمڑے کے موزوں اور جرابوں پر ان شرائط کے ساتھ آئی ہے: وہ موٹے ہوں اور ڈالا گیا پانی ان سے نہ گزرے، ان میں مسلسل چلنا ممکن ہو، انہیں طہارت کی حالت میں پہنا گیا ہو، وہ پورے پاؤں کو ٹخنوں یعنی ابھری ہوئی ہڈیوں تک ڈھانپیں، اور پھٹے ہوئے نہ ہوں۔"
