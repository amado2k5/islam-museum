id: work/fatwa-dar-alifta-eg-home-congregation-with-wife
class: work
kind: fatwa
label: { ar: "مدى تحقق ثواب الجماعة بصلاة الرجل في البيت بزوجته", en: "Is congregation's reward attained by a man praying at home with his wife?", ur: "کیا گھر میں بیوی کے ساتھ نماز سے جماعت کا ثواب ملتا ہے؟", es: "¿Se alcanza la recompensa de la congregación cuando un hombre ora en casa con su esposa?", fr: "Un homme qui prie chez lui avec sa femme obtient-il la récompense de la congrégation ?" }
summary:
  ar: "سائل سأل عن تحقق ثواب الجماعة بصلاة الرجل في البيت بزوجته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21769)⁩ أن صلاة الجماعة من أعظم شعائر الإسلام رغّب فيها بمضاعفة الثواب وبيّن الجواب حكم تحققها بالجماعة المنزلية على وجهه."
  en: "A questioner asked whether the congregation's reward is attained by a man praying at home with his wife. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21769) answered that congregational prayer is among the greatest rites of Islam, encouraged with multiplied reward; the answer sets out how far a household congregation shares in it."
  ur: "ایک سائل نے پوچھا کہ کیا مرد کا گھر میں بیوی کے ساتھ نماز پڑھنے سے جماعت کا ثواب ملتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21769)⁩ نے جواب دیا کہ نمازِ جماعت اسلام کی عظیم شعائر میں ہے جس میں اجر کے بڑھنے کی ترغیب ہے؛ جواب میں گھریلو جماعت کے حصول کا حکم بیان ہوا۔"
  es: "Un interlocutor preguntó si un hombre que reza en casa con su esposa obtiene la recompensa de la congregación. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21769) respondió que la oración en congregación es uno de los ritos más importantes del Islam, y que se fomenta con una recompensa multiplicada. La respuesta detalla hasta qué punto la congregación familiar participa de ella."
  fr: "Un internaute a demandé si un homme priant chez lui avec sa femme bénéficiait de la récompense de la prière en congrégation. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21769) a répondu que la prière en congrégation compte parmi les plus grands rites de l'islam, encouragée par une récompense multipliée; la réponse précise dans quelle mesure la prière en congrégation au sein d'un foyer y contribue."
