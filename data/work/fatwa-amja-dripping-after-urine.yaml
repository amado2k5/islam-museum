id: work/fatwa-amja-dripping-after-urine
class: work
kind: fatwa
label: { ar: "التنقيط بعد البول", en: "Dripping after urinating — guarding and timed wudu", ur: "پیشاب کے بعد قطرے — تحفظ", es: "Goteo después de orinar: protección y wudu cronometrado", fr: "Écoulement après la miction — protection et ablutions chronométrées" }
summary:
  ar: "سأل سائل أنه يعاني من التنقيط بعد التنزه من البول. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79176 بتاريخ 14 يونيو 2009)⁩ أن من به سلس البول يلزمه أن يتحفظ وأن يتوضأ لوقت كل صلاة إذا كان لا يعرف وقتًا لانقطاع بوله أما إذا كان يعلم أنه لو انتظر بعد فراغه من قضاء حاجته مدة معينة سينقطع بوله فإنه ينتظر تلك المدة على ما فصّل الجواب."
  en: "A questioner suffered dripping after clearing himself of urine. Dr. Salah al-Sawi (fatwa no. 79176, 14 June 2009) answered that one with urinary incontinence must guard himself and do wudu for each prayer's time where he knows no hour of its ceasing; but if he knows that waiting a set span after relieving himself will stop the urine, he waits that span — as the answer details."
  ur: "پیشاب کے بعد قطرے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79176، 14 جون 2009)⁩ کے مطابق تحفظ کرے اور ہر وقت پر وضو؛ معلوم ٹھراؤ ہو تو انتظار۔"
  es: "Un consultante sufrió goteo después de orinar. El Dr. Salah al-Sawi (fatwa n.° 79176, 14 de junio de 2009) respondió que quien padece incontinencia urinaria debe cuidarse y realizar la ablución (wudu) para cada hora de oración si desconoce la hora en que esta terminará; pero si sabe que esperar un tiempo determinado después de orinar detendrá el goteo, debe esperar ese tiempo, como se detalla en la respuesta."
  fr: "Un homme a signalé des fuites urinaires après avoir uriné. Le Dr Salah al-Sawi (fatwa n° 79176, 14 juin 2009) a répondu que la personne souffrant d'incontinence urinaire doit se protéger et faire ses ablutions (wudu) à chaque heure de prière si elle ignore l'heure de fin des fuites; mais si elle sait qu'attendre un certain temps après avoir uriné arrêtera les fuites, elle doit respecter ce délai, comme le précise la réponse."
