summary:
  ar: "كتاب حواري لمصطفى محمود يرد فيه على أسئلة صديق ملحد درس في فرنسا، في فصول منها: من خلق الله، والقدر والحساب، ولماذا خلق الله الشر، والجنة والنار، وهل الدين أفيون، والمرأة، والروح، والحج، والقرآن، وموقف الدين من التطور {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 9} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 161}."
  en: "Mostafa Mahmoud's dialogue in which he answers an atheist friend educated in France, in chapters including who created God, predestination and accountability, why God created evil, paradise and hell, whether religion is an opium, women, the soul, the pilgrimage, the Qur'an, and religion's position on evolution {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 9} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 161}."
  ur: "مصطفیٰ محمود کی مکالماتی کتاب جس میں وہ فرانس میں پڑھے ایک ملحد دوست کے سوالات کا جواب دیتے ہیں، ابواب میں: اللہ کو کس نے پیدا کیا، تقدیر اور حساب، اللہ نے شر کیوں پیدا کیا، جنت و دوزخ، کیا دین افیون ہے، عورت، روح، حج، قرآن، اور ارتقا پر دین کا موقف {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 9} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 161}۔"
