id: work/fatwa-dar-alifta-eg-traveller-abstaining-on-arrival
class: work
kind: fatwa
label: { ar: "حكم إمساك المسافر بقية يومه إذا قدم من السفر", en: "A traveller abstaining the rest of the day on arriving", ur: "سفر سے آنے والے مسافر کا باقی دن روک رکھنا" }
summary:
  ar: "سائل أفطر حال سفره ثم قدم بلده في نهار رمضان فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21728)⁩ أنه ينبغي على المسافر الذي أفطر حال سفره ثم قدم بلده في نهار رمضان أن يمسك بقية يومه وبيّن الجواب ما يترتب على ذلك من قضاء على وجهه."
  en: "A man broke his fast while travelling then reached his home on a Ramadan day and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21728) answered that the traveller who broke his fast on the road then arrived home during a Ramadan day should abstain for the rest of it; the answer sets out the making-up that follows."
  ur: "ایک شخص نے سفر میں روزہ توڑا اور رمضان کے دن گھر پہنچ گیا؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21728)⁩ نے جواب دیا کہ اسے دن کا باقی حصہ روک رکھنا چاہیے اور جواب میں قضاء کا حکم بیان ہوا۔"
