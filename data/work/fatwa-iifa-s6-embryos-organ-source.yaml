label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن استخدام الأجنة مصدرًا لزراعة الأعضاء", en: "IIFA resolution on using embryos as a source for organ transplants", ur: "اکیڈمی کی قرارداد: اعضاء کی پیوندکاری کے لیے جنین کا استعمال", es: "Resolución de la IIFA sobre el uso de embriones como fuente para trasplantes de órganos.", fr: "Résolution de l'IIFA sur l'utilisation des embryons comme source de greffes d'organes", tr: "Uluslararası İslami Fıkıh Akademisi'nin organ nakli için embriyoların kaynağı olarak kullanılmasına ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penggunaan embrio sebagai sumber transplantasi organ" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: لا يجوز استخدام الأجنة مصدرًا للأعضاء المطلوب زرعها في إنسان آخر إلا بضوابط منها عدم جواز إحداث إجهاض لأجل ذلك واقتصاره على الإجهاض الطبيعي أو لعذر شرعي، وبيّن بقية الضوابط على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on embryos as a source for organ transplants: their use is barred except under controls — no abortion may be induced for that purpose, limited to spontaneous abortion or abortion for a lawful excuse — with the remaining controls set out."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: اعضاء کے لیے جنین کا استعمال صرف مخصوص ضوابط پر ممکن؛ اس مقصد کے لیے اسقاط جائز نہیں۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990) sobre los embriones como fuente para trasplantes de órganos: su uso está prohibido excepto bajo controles —no se puede inducir ningún aborto con ese fin, limitándose al aborto espontáneo o al aborto por una causa justificada— y se establecen los demás controles."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les embryons comme source de transplantations d'organes: leur utilisation est interdite sauf sous certaines conditions — aucun avortement ne peut être provoqué à cette fin, limité à l'avortement spontané ou à l'avortement pour un motif légitime — les autres conditions étant définies."
  tr: "Uluslararası İslami Fiqh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) kararı: Embriyoların organların başka bir insana nakledilmesi için kaynak olarak kullanılması, ancak belirli koşullar altında kullanılması izinlidir; bunlar arasında kürtajın bu amaçla yapılmasının yasaklanması, doğal kürtajla veya meşru bir nedenle sınırlandırılması ve diğer düzenlemelerin detaylandırıldığı şekilde netleştirilmesi yer almaktadır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Tidak diperbolehkan menggunakan embrio sebagai sumber transplantasi organ ke manusia lain kecuali dalam kondisi tertentu, termasuk larangan melakukan aborsi untuk tujuan tersebut dan membatasinya pada aborsi alami atau alasan yang sah, serta memperjelas peraturan lain sebagaimana dijelaskan."
