  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: لا يجوز استخدام الأجنة مصدرًا للأعضاء المطلوب زرعها في إنسان آخر إلا بضوابط منها عدم جواز إحداث إجهاض لأجل ذلك واقتصاره على الإجهاض الطبيعي أو لعذر شرعي، وبيّن بقية الضوابط على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on embryos as a source for organ transplants: their use is barred except under controls — no abortion may be induced for that purpose, limited to spontaneous abortion or abortion for a lawful excuse — with the remaining controls set out."
