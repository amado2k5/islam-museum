label: { ar: "كتاب الروح", en: "Kitab al-Ruh", ur: "کتاب الروح", es: "Kitab al-Ruh", fr: "Kitab al-Ruh", tr: "Ruhun Kitabı", id: "Kitab Roh" }
summary:
  ar: "كتاب الروح لابن قيم الجوزية ⁦(691–751هـ)⁩، رسالة في حقيقة الروح وأحوالها بعد الموت، تُعرض في إحدى وعشرين مسألة، من هل يعرف الميت زيارة الحي إلى هل النفس واحدة أم ثلاث، والنسخة المقروءة طبعة دار عطاءات العلم، الطبعة الثالثة ⁦(1440هـ/2019م)⁩ {cite:kitab-al-ruh-atta-2019 p. 4} {cite:kitab-al-ruh-atta-2019 p. 2}."
  en: "Ibn Qayyim al-Jawziyya's (691–751 AH) treatise on the nature of the soul and its states after death, set out in twenty-one questions, from whether the dead know the visits of the living to whether the self is one or three. The copy read is the Dar Atta'at al-Ilm third edition (1440 AH / 2019 CE) {cite:kitab-al-ruh-atta-2019 p. 4} {cite:kitab-al-ruh-atta-2019 p. 2}."
  ur: "ابن قیم الجوزیہ ⁦(691 تا 751ھ)⁩ کا رسالہ، روح کی حقیقت اور موت کے بعد اس کے احوال پر، جو اکیس مسائل میں پیش کیا گیا ہے: کیا میت زندوں کی زیارت پہچانتی ہے، سے لے کر کیا نفس ایک ہے یا تین۔ زیرِ مطالعہ نسخہ دار عطاءات العلم کا تیسرا ایڈیشن ہے ⁦(1440ھ / 2019ء)⁩ {cite:kitab-al-ruh-atta-2019 p. 4} {cite:kitab-al-ruh-atta-2019 p. 2}۔"
  es: "El tratado de Ibn Qayyim al-Jawziyya (691–751 AH) sobre la naturaleza del alma y sus estados después de la muerte, planteado en veintiuna preguntas, desde si los muertos conocen las visitas de los vivos hasta si el yo es uno o tres. La copia consultada es la tercera edición de Dar Atta'at al-Ilm (1440 AH / 2019 CE) {cite:kitab-al-ruh-atta-2019 p. 4} {cite:kitab-al-ruh-atta-2019 p. 2}."
  fr: "Le traité d'Ibn Qayyim al-Jawziyya (691-751 AH) sur la nature de l'âme et ses états après la mort, formulé en vingt et une questions, allant de la connaissance par les morts des visites des vivants à la question de savoir si le soi est un ou trois. L'exemplaire consulté est la troisième édition de Dar Atta'at al-Ilm (1440 AH / 2019 CE) {cite:kitab-al-ruh-atta-2019 p. 4} {cite:kitab-al-ruh-atta-2019 p. 2}."
  tr: "İbn Qayyim al-Jawziyyah'ın (691–751 H) Ruh Kitabı, ölümden sonraki ruhun gerçekliği ve halleri üzerine yirmi bir sayı halinde sunulmuştur; ölen kişinin yaşayanları ziyaret etmeyi bilip bilmediğinden, ruhun bir mi üç mü olduğuna kadar ve okunabilir versiyonu Dar Ata'at al-Ilm baskısı, üçüncü baskı (1440 H/2019 AD) {cite:kitab-al-ruh-atta-2019 s. 4} {cite:kitab-al-ruh-atta-2019 s. 2}."
  id: "Kitab Jiwa oleh Ibn Qayyim al-Jawziyyah (691–751 H), sebuah risalah tentang realitas jiwa dan keadaannya setelah kematian, disajikan dalam dua puluh satu edisi, mulai dari apakah almarhum mengetahui kunjungan ke yang hidup hingga apakah jiwa itu satu atau tiga, dan versi yang dapat dibaca adalah edisi ketiga Dar Ata'at al-Ilm, edisi ketiga (1440 H/2019 M) {cite:kitab-al-ruh-atta-2019 hlm. 4} {cite:kitab-al-ruh-atta-2019 hlm. 2}."
