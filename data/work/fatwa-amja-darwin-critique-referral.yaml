id: work/fatwa-amja-darwin-critique-referral
class: work
kind: fatwa
label: { ar: "طلب بحث في نقد نظرية دارون", en: "Request for a study critiquing Darwin's theory", ur: "نظریہ ڈارون پر تنقیدی مقالے کی درخواست" }
summary:
  ar: "سأل طالب مساعدةً في تقديم بحث لجامعة أسترالية عن نقد نظرية دارون من عالم مسلم موثقة من جامعة معتمدة في أسرع وقت. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81759 بتاريخ 28 يونيو 2010)⁩ أن ما سأل عنه لا يدخل في اهتمام المجمع في الوقت الراهن، ويمكنه الاتصال بالهيئة العالمية للإعجاز العلمي في القرآن والسنة وهي هيئة متخصصة في هذه القضايا وأمثالها."
  en: "A student asked for help preparing for an Australian university a documented study critiquing Darwin's theory by a Muslim scholar. Dr. Salah al-Sawi (fatwa no. 81759, 28 June 2010) answered that the request lies outside the Assembly's current concerns, and referred him to the International Commission on Scientific Signs in the Quran and Sunna, a body specialising in such questions. Recorded as a referral, not a ruling."
  ur: "ایک طالب نے ڈارون کے نظریے پر مسلم عالم کے تنقیدی مقالے کی درخواست کی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81759، 28 جون 2010)⁩ کے مطابق یہ مجمع کی توجہ سے باہر ہے اور اس نے قرآن و سنت میں علمی اعجاز کے عالمی ادارے کی طرف رجوع کی تلقین کی۔"
