id: work/fatwa-aliftaa-jo-urea-in-moisturising-creams
class: work
kind: fatwa
label: { ar: "إضافة اليوريا إلى كريمات الترطيب", en: "Adding urea to moisturising creams", ur: "موئسچرائزنگ کریموں میں یوریا شامل کرنا" }
summary:
  ar: "سؤال عن إضافة اليوريا إلى كريمات الترطيب، أجابت فيه دائرة الإفتاء العام الأردنية بأن اليوريا الصناعية طاهرة لا حرج في استعمالها، وأن العضوية المستخرجة من البول نجسة إلا إذا استحالت، ويجوز التداوي بها عند عدم البديل. أجابت الدائرة بأن اليوريا مركب عضوي تفرزه أجسام الحيوانات والإنسان ويخرج غالبًا مع البول، وأنها تُنتج اليوم صناعيًا وتُستعمل في الأعلاف والأسمدة والأدوية والبلاستيك وغيرها. وقالت إن اليوريا الصناعية طاهرة لأنها تُصنع من تفاعل غاز الأمونيا مع ثاني أكسيد الكربون تحت ضغط مرتفع، والقاعدة أن الأصل في الأشياء الطهارة. وقالت إن اليوريا العضوية المستخرجة من البول نجسة لاختلاطها به، فإن استُعملت للتداوي جاز ذلك عند عدم البديل الطاهر، ونقلت عن الخطيب الشربيني في مغني المحتاج جواز التداوي بالنجس عند فقد الطاهر. وقالت إنها إن أُضيفت إليها مواد تُذهب أوصافها وتحيلها إلى مادة أخرى حُكم بطهارتها عند الحنفية القائلين بالاستحالة، ونقلت عن ابن الهمام في فتح القدير. وخلصت إلى أنه لا حرج في استعمال اليوريا الصناعية في المستحضرات التجميلية والطبية، ولا في العضوية إذا استحالت، وأنه يجوز التداوي بالعضوية وإن لم تستحل بشرط عدم البديل وعدم الضرر، والمرجع في ذلك الجهات الرقابية على تصنيع الأدوية."
  en: "A question about adding urea to moisturising creams, in which Jordan's General Iftaa Department answered that synthetic urea is pure and may be used, while organic urea extracted from urine is impure unless it has been transformed, and may be used as medicine when there is no alternative. The Department answered that urea is an organic compound produced by animal and human bodies and mostly excreted in urine, and that it is now made industrially and used in animal feed, fertilisers, medicines, plastics and other products. It said synthetic urea is pure because it is made by reacting ammonia gas with carbon dioxide under high pressure, and the rule is that things are pure in principle. It said organic urea taken from urine is impure because it is mixed with it, but may be used for treatment when no pure alternative exists, citing al-Khatib al-Shirbini's Mughni al-Muhtaj on treatment with impure substances when nothing pure is available. It said that if other substances are added that remove its properties and turn it into a different substance, it is judged pure by the Hanafis, who hold that impure things become pure through transformation (istihala), citing Ibn al-Humam's Fath al-Qadir. It concluded that there is no objection to synthetic urea in cosmetic and medical preparations, nor to organic urea once transformed, and that untransformed organic urea may be used for treatment provided there is no alternative and no harm, as judged by the authorities that oversee drug manufacture."
  ur: "موئسچرائزنگ کریموں میں یوریا شامل کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مصنوعی یوریا پاک ہے اور اس کے استعمال میں حرج نہیں، جبکہ پیشاب سے نکالی گئی نامیاتی یوریا نجس ہے الا یہ کہ اس کی ماہیت بدل جائے، اور متبادل نہ ہونے پر علاج میں اس کا استعمال جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ یوریا ایک نامیاتی مرکب ہے جو جانوروں اور انسان کے جسم بناتے ہیں اور زیادہ تر پیشاب کے ساتھ خارج ہوتا ہے، اور آج یہ صنعتی طور پر تیار ہو کر جانوروں کی خوراک، کھاد، ادویات، پلاسٹک وغیرہ میں استعمال ہوتا ہے۔ اس نے کہا کہ مصنوعی یوریا پاک ہے کیونکہ یہ امونیا گیس اور کاربن ڈائی آکسائیڈ کے زیادہ دباؤ پر تعامل سے بنتی ہے، اور قاعدہ یہ ہے کہ چیزوں میں اصل پاکی ہے۔ اس نے کہا کہ پیشاب سے نکالی گئی نامیاتی یوریا اس کے ساتھ ملنے کی وجہ سے نجس ہے، لیکن پاک متبادل نہ ہو تو علاج میں اس کا استعمال جائز ہے؛ اس نے خطیب شربینی کی مغنی المحتاج سے پاک چیز نہ ملنے پر نجس سے علاج کا جواز نقل کیا۔ اس نے کہا کہ اگر اس میں ایسے مادے ملائے جائیں جو اس کی صفات ختم کر کے اسے دوسری چیز میں بدل دیں تو حنفیہ کے نزدیک، جو استحالہ کے قائل ہیں، وہ پاک ہے؛ اس نے ابن الہمام کی فتح القدیر سے نقل کیا۔ اس نے نتیجہ نکالا کہ مصنوعی یوریا کو کاسمیٹک اور طبی مصنوعات میں استعمال کرنے میں حرج نہیں، نہ ہی ماہیت بدلی ہوئی نامیاتی یوریا میں، اور غیر تبدیل شدہ نامیاتی یوریا سے علاج متبادل نہ ہونے اور نقصان نہ ہونے کی شرط پر جائز ہے، جس کا تعین ادویات کی تیاری کی نگرانی کرنے والے ادارے کریں گے۔"
