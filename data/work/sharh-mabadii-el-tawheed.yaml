class: work
kind: lecture-series
label:
  ar: "شرح مبادئ التوحيد"
  en: "A commentary on the principles of tawhid (Mabadi' al-Tawhid)"
  ur: "توحید کے اصولوں کی شرح ⁦(شرح مبادئ التوحید)⁩"
  es: "Un comentario sobre los principios del tawhid (Mabadi' al-Tawhid)"
  fr: "Un commentaire sur les principes du tawhid (Mabadi' al-Tawhid)"
summary:
  ar: "سلسلة من اثنتي عشرة حلقة لـوجدي غنيم يحفظها أرشيف أسابيل باسم «شرح مبادئ التوحيد»؛ تتناول الحلقات شرح متن في أصول التوحيد على نقاطه: أقسام التوحيد الثلاثة — توحيد الذات والأسماء والصفات، وتوحيد الربوبية، وتوحيد الألوهية — ثم تتابع النقاط في مظاهر الشرك والعبودية: شرك اتباع الهوى، واتخاذ الأولياء من دون الله، ومظاهر الشرك التفصيلية كالدعاء إلى غير الله، والشفاعة وأنواعها، والنذر وأحكامه وكفارته، والتوسل وأنواعه، وخصائص الألوهية التي لا يشارك فيها أحد، وعبادة الأموات والمظاهر الطبيعية، والشيطان من الجن وحربه على بني آدم، وتختم السلسلة بشرح الشهادتين والرد على من يستهين بهما وببراهين الألوهية."
  en: "A twelve-episode series by Wagdy Ghoneim kept in the Assabile archive as 'Sharh Mabadi' al-Tawhid' (a commentary on the principles of tawhid); the episodes treat a creed text on its numbered points: the three divisions of tawhid — the unity of essence, names and attributes, lordship, and divinity — then follow its points on manifestations of shirk and servanthood: the shirk of following desires, taking allies other than God, detailed manifestations such as calling on other than God, intercession and its kinds, vows and their rulings and expiation, means of approach and their kinds, the attributes exclusive to divinity, the worship of the dead and of natural phenomena, Satan of the jinn and his war on the children of Adam, and the series closes with the two testimonies, the refutation of those who belittle them, and proofs of divinity."
  ur: "وجدی غنیم کا بارہ اقساط کا سلسلہ جو اسابیل آرکائیو میں «شرح مبادئ التوحید» کے نام سے محفوظ ہے؛ اقساط توحید کے اصولوں کے ایک متن کو اس کے مرقم نکات پر بیان کرتی ہیں: توحید کے تین پہلو — ذات، ناموں اور صفات کا توحید، ربوبیت کا توحید اور الوہیت کا توحید — پھر شرک اور عبودیت کے نکات: ہوای کے پیچھے چلنے کا شرک، اللہ کے سوا اولیاء بنانا، دعا کو غیر اللہ کی طرف کرنا جیسے شرک کے تفصیلی مظاہر، شفاعت اور اس کی اقسام، منت اور اس کے احکام اور کفارہ، توسّل اور اس کی اقسام، الوہیت کی وہ خصوصیات جن میں کوئی شریک نہیں، مردوں اور فطری مظاہر کی عبادت، جنوں میں سے إبلیس اور آلِ آدم پر اس کی جنگ، اور آخر میں دونوں شہادتوں کی شرح، ان کو حقیر سمجھنے والوں کا رد، اور الوہیت کے دلائل۔"
  es: "Una serie de doce episodios de Wagdy Ghoneim, conservada en el archivo de Assabile como 'Sharh Mabadi' al-Tawhid' (un comentario sobre los principios del tawhid); los episodios tratan un texto de credo sobre sus puntos numerados: las tres divisiones del tawhid —la unidad de esencia, nombres y atributos, señorío y divinidad— luego siguen sus puntos sobre manifestaciones de shirk y servidumbre: el shirk de seguir los deseos, tomar aliados que no sean Dios, manifestaciones detalladas como invocar a otros que no sean Dios, la intercesión y sus tipos, los votos y sus reglas y expiación, los medios de aproximación y sus tipos, los atributos exclusivos de la divinidad, el culto a los muertos y a los fenómenos naturales, Satanás de los jinn y su guerra contra los hijos de Adán, y la serie cierra con los dos testimonios, la refutación de aquellos que los menosprecian y las pruebas de la divinidad."
  fr: "Une série en douze épisodes de Wagdy Ghoneim, conservée dans les archives d'Assabile sous le titre « Sharh Mabadi' al-Tawhid » (un commentaire sur les principes du tawhid); les épisodes traitent un texte de croyance selon ses points numérotés: les trois divisions du tawhid — l'unité de l'essence, les noms et attributs, la seigneurie et la divinité — puis ses points sur les manifestations du shirk et de la servitude: le shirk consistant à suivre ses désirs, à prendre d'autres alliés que Dieu, des manifestations détaillées telles que l'invocation d'autres que Dieu, l'intercession et ses types, les vœux et leurs règles et l'expiation, les moyens d'approche et leurs types, les attributs exclusifs à la divinité, le culte des morts et des phénomènes naturels, Satan des djinns et sa guerre contre les enfants d'Adam, et la série se termine par les deux témoignages, la réfutation de ceux qui les rabaissent et les preuves de la divinité."
