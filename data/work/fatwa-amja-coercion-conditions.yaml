id: work/fatwa-amja-coercion-conditions
class: work
kind: fatwa
label: { ar: "شروط الإكراه المعفو عنه", en: "The conditions of excusable coercion", ur: "معفو جبر کی شرائط", es: "Las condiciones de la coerción excusable", fr: "Les conditions de la coercition excusable", tr: "Af Edilen Zorlama Koşulları", id: "Ketentuan untuk Pemaksaan yang Diberi Pengampunan" }
summary:
  ar: "سأل سائل هل يعذر المكره مطلقًا وهل يعذر من يقول لو كنت في تلك الحالة لفعلت جهرًا أو في نفسه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77741 بتاريخ 7 فبراير 2009)⁩ أن مسائل الإكراه دقيقة متشعبة وصفوة القول فيها أن الإكراه شرعًا حمل الغير على تصرف لا يريده ولا يرضاه، وشروط الإكراه المعفو عن فاعله: قدرة المكرِه على إيقاع ما هدد به، وخوف المكرَه من إيقاعه، وأن يكون المهدد به قتلًا أو إتلاف عضو أو ما في حكمه مما يوجب غمًّا يعدم الرضا، وأن يكون المكرَه ممتنعًا عن الفعل لولا الإكراه، وأن يكون محل الفعل متعينًا، وألا يكون للمكره مندوحة على ما فصّل."
  en: "A questioner asked whether the coerced is excused unconditionally, and whether one who says 'in that case I would have done it' — aloud or in himself — is excused. Dr. Salah al-Sawi (fatwa no. 77741, 7 February 2009) answered that coercion-questions are delicate and branching; the essence: sharia coercion is forcing another into an act he neither wills nor accepts, and the conditions for the coerced to be excused are the coercer's power to carry out his threat, the coerced's fear of it, the threat being killing, loss of a limb or what ranks as such — distress removing consent — that the coerced would have refrained but for the coercion, that the act's object is definite, and that he has no way out, as detailed."
  ur: "ایک سائل نے جبر میں معذوریت کی شرائط پوچھیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77741، 7 فروری 2009)⁩ کے مطابق شرعی جبر کی شرائط ہیں — جانے والے کی طاقت، متاثرہ کا خوف، قتل یا عضو کے نقصان کی دھمکی، بغیر جبر امتناع، اور کوئی مفر نہ ہونا۔"
  es: "Un interlocutor preguntó si la persona coaccionada queda exonerada incondicionalmente y si quien dice «en ese caso yo lo habría hecho» —en voz alta o en silencio— queda exonerado. El Dr. Salah al-Sawi (fatwa n.º 77741, 7 de febrero de 2009) respondió que las cuestiones de coacción son delicadas y complejas; en esencia: la coacción islámica consiste en obligar a otra persona a realizar un acto que ni quiere ni acepta, y las condiciones para que la persona coaccionada quede exonerada son el poder del coaccionador para cumplir su amenaza, el temor de la persona coaccionada a ello, que la amenaza sea la muerte, la pérdida de una extremidad o algo similar —la angustia anula el consentimiento—, que la persona coaccionada se hubiera abstenido de no ser por la coacción, que el objeto del acto sea definido y que no tenga escapatoria, como se detalla."
  fr: "Un internaute a demandé si la personne contrainte est excusée inconditionnellement, et si celle qui déclare « dans ce cas, je l'aurais fait » – à voix haute ou intérieurement – est excusée. Le Dr Salah al-Sawi (fatwa n° 77741, 7 février 2009) a répondu que les questions relatives à la contrainte sont complexes et multiformes; en substance: la contrainte selon la charia consiste à forcer autrui à commettre un acte qu'il ne veut ni n'accepte. Les conditions pour que la personne contrainte soit excusée sont les suivantes: le pouvoir de l'auteur de la contrainte de mettre sa menace à exécution; la crainte de la victime face à cette menace; la nature de la menace (mort, amputation ou autre préjudice assimilable – une détresse entraînant la perte du consentement); la preuve que la victime se serait abstenue sans la contrainte; le but de l'acte; et l'absence d'échappatoire de la victime, comme détaillé précédemment."
  tr: "Bir soru soran kişiye, zorlamanın hiç affedilip edilmediği ve eğer ben o durumda olsaydım açıkça ya da kendi zihninde hareket ederdim diyen kişinin affedilip edilmediği soruldu. Dr. Salah Al-Sawy (7 Şubat 2009 tarihli 77741 sayılı Fetva) zorlama konularının ayrıntılı ve karmaşık olduğunu, zorlamanın başkasını istemediği veya onaylamadığı bir şeyi yapmaya yasal olarak zorlamak olduğunu yanıtladı. Affedilen zorlamanın koşulları şunlardır: zorlamanın tehdit ettiği şeyi gerçekleştirebilme yeteneği, zorlamanın bundan korkması, tehdit olarak bir uzvu öldürme veya zarar verme gibi rızasız sıkıntı yaratacak bir şey olması, zorlama uğrayan kişinin zorlamadan eylemden kaçınması, eylemin konusu spesifik olması ve zorlamanın belirtildiği şekilde mazur gösterilmemesi gerektiğidir."
  id: "Seorang penanya ditanya apakah paksaan itu dimaafkan sama sekali, dan apakah seseorang yang mengatakan bahwa jika saya berada dalam keadaan itu, saya akan bertindak secara terbuka atau dalam pikirannya sendiri dimaafkan. Dr. Salah Al-Sawy menjawab (Fatwa No. 77741 tanggal 7 Februari 2009) bahwa isu pemaksaan sangat rinci dan kompleks, dan pernyataan yang jelas adalah bahwa pemaksaan secara hukum memaksa orang lain untuk bertindak yang tidak mereka inginkan maupun setujui. Syarat untuk pemaksaan yang dimaafkan adalah: kemampuan pemaksaan untuk melaksanakan apa yang diancamnya, ketakutan pemaksaan terhadapnya, ancaman berupa membunuh atau melukai anggota tubuh atau sesuatu yang setara yang akan menyebabkan tekanan tanpa persetujuan, orang yang dipaksa menahan diri dari tindakan tanpa paksaan, subjek tindakan yang spesifik, dan pemaksaan tidak boleh dimaafkan seperti yang ditentukan."
