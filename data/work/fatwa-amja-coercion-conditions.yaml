id: work/fatwa-amja-coercion-conditions
class: work
kind: fatwa
label: { ar: "شروط الإكراه المعفو عنه", en: "The conditions of excusable coercion", ur: "معفو جبر کی شرائط" }
summary:
  ar: "سأل سائل هل يعذر المكره مطلقًا وهل يعذر من يقول لو كنت في تلك الحالة لفعلت جهرًا أو في نفسه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77741 بتاريخ 7 فبراير 2009)⁩ أن مسائل الإكراه دقيقة متشعبة وصفوة القول فيها أن الإكراه شرعًا حمل الغير على تصرف لا يريده ولا يرضاه، وشروط الإكراه المعفو عن فاعله: قدرة المكرِه على إيقاع ما هدد به، وخوف المكرَه من إيقاعه، وأن يكون المهدد به قتلًا أو إتلاف عضو أو ما في حكمه مما يوجب غمًّا يعدم الرضا، وأن يكون المكرَه ممتنعًا عن الفعل لولا الإكراه، وأن يكون محل الفعل متعينًا، وألا يكون للمكره مندوحة على ما فصّل."
  en: "A questioner asked whether the coerced is excused unconditionally, and whether one who says 'in that case I would have done it' — aloud or in himself — is excused. Dr. Salah al-Sawi (fatwa no. 77741, 7 February 2009) answered that coercion-questions are delicate and branching; the essence: sharia coercion is forcing another into an act he neither wills nor accepts, and the conditions for the coerced to be excused are the coercer's power to carry out his threat, the coerced's fear of it, the threat being killing, loss of a limb or what ranks as such — distress removing consent — that the coerced would have refrained but for the coercion, that the act's object is definite, and that he has no way out, as detailed."
  ur: "ایک سائل نے جبر میں معذوریت کی شرائط پوچھیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77741، 7 فروری 2009)⁩ کے مطابق شرعی جبر کی شرائط ہیں — جانے والے کی طاقت، متاثرہ کا خوف، قتل یا عضو کے نقصان کی دھمکی، بغیر جبر امتناع، اور کوئی مفر نہ ہونا۔"
