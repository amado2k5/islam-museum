label: { ar: "الرأي الشرعي في مشروع يدعو إلى الاجتماع ونبذ الفرقة", en: "The sharia view of a project calling to unity and rejecting division", ur: "اتحاد اور تفرقہ سے بچنے والی تنظیم پر شرعی رائے", es: "La visión islámica de un proyecto que aboga por la unidad y rechaza la división.", fr: "La vision de la charia d'un projet appelant à l'unité et rejetant la division", tr: "Bölünmeyi reddetme çağrısında bulunan bir projeye ilişkin Şeriat görüşü", id: "Pendapat Syariah tentang proyek yang menyerukan pengumpulan dan penolakan perpecahan" }
summary:
  ar: "سائل عرض مشروعًا دعويًّا يدعو إلى الاجتماع ونبذ الفرقة وأرفق تصوراته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21990)⁩ ببيان ما ظهر لها من مشروعية الفكرة وضوابطها بعد الاطلاع على المعروض ومناقشته، على ما فصّل الجواب."
  en: "A questioner presented a da'wa project calling people to unity and the rejection of division, attaching his conception. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21990) answered — after reviewing and discussing the proposal — by setting out the idea's lawfulness and its controls, as the answer details."
  ur: "ایک سائل نے اتحاد اور تفرقہ سے اجتناب کی دعوت دینے والا ایک دعوتی منصوبہ پیش کیا اور اس کا خاکہ منسلک کیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21990)⁩ نے پیشکش کے جائزے اور مباحثے کے بعد اس کا شرعی حکم اور ضوابط بیان کیے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante presentó un proyecto de da'wa que hacía un llamado a la unidad y al rechazo de la división, adjuntando su propuesta. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21990) respondió, tras revisar y debatir la propuesta, estableciendo la legalidad de la idea y sus controles, tal como se detalla en la respuesta."
  fr: "Un individu a présenté un projet de da'wa appelant à l'unité et au rejet de la division, en exposant sa conception. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21990) a répondu, après avoir examiné et discuté la proposition, en précisant sa légalité et ses modalités, comme le détaille la réponse."
  tr: "Bir soru soran kişi, toplanmayı ve bölünmeyi reddetmeyi talep eden dini bir öneri sundu ve görüşlerini ekledi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21990), yanıtında detaylandırıldığı üzere, öneriyi inceleyip tartıştıktan sonra fikrin meşruiyetini ve kriterlerini netleştirdi."
  id: "Seorang penanya mengajukan proposal agama yang menyerukan pengumpulan dan penolakan perpecahan, serta melampirkan pandangannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21990) menanggapi dengan memperjelas apa yang mereka temukan sebagai legitimasi gagasan dan kriterianya setelah meninjau dan mendiskusikan usulan tersebut, sebagaimana dirinci dalam tanggapan."
