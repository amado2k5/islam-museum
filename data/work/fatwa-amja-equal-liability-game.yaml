label: { ar: "التسوية في الجزاء بين العمد والخطأ", en: "Equal compensation in game-killing, intent or error", ur: "شکار قتل میں عمد و خطا کی برابری" }
summary:
  ar: "سأل سائل على أي دليل اعتمدت المذاهب الأربع على التسوية في الجزاء بين العمد والخطأ في قتل صيد الحرم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77618 بتاريخ 29 يناير 2009)⁩ أن الدليل هو ما ذكره له أن هذا من جنس ضمان المتلفات وهذه تسوى فيها بين العمد والخطأ وهي قاعدة عامة في الشريعة."
  en: "A questioner asked on what proof the four madhhabs based their equalising of compensation between intentional and accidental killing of game in the sanctuary. Dr. Salah al-Sawi (fatwa no. 77618, 29 January 2009) answered that the proof is what he had told him: this falls under liability for destroyed property, in which intent and error are treated alike — a general principle of the sharia."
  ur: "ایک سائل نے حرم کے شکار کے قتل میں عمد و خطا کی برابری کی دلیل پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77618، 29 جنوری 2009)⁩ کے مطابق یہ تلف شدہ مال کی ضمانت کے تحت آتا ہے جس میں عمد و خطا برابر ہے — شریعت کا عام اصول۔"
