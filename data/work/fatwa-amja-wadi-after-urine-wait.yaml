id: work/fatwa-amja-wadi-after-urine-wait
class: work
kind: fatwa
label: { ar: "سائل بعد البول", en: "Fluid after urinating — wait for its ceasing", ur: "پیشاب کے بعد سیال — ٹھراؤ کا انتظار", es: "Líquido después de orinar: espere a que cese.", fr: "Liquide après la miction — attendez que cela cesse", tr: "İdrar sonrası sıvı", id: "Cairan setelah buang air kecil" }
summary:
  ar: "سأل سائل أنه بعد البول ينزل منه سائل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77830 بتاريخ 15 فبراير 2009)⁩ أنه إذا انضبط وقت لنزول هذا السائل وانقطاعه فيجب عليه أن ينتظر حتى ينقطع ثم يستنجي ويتوضأ ثم يباشر ما شاء من العبادات التي يشترط لها الطهارة أما إذا كان دائمًا غير منقطع فإنه يتوضأ لوقت كل صلاة على ما فصّل الجواب."
  en: "A questioner described a fluid descending after he urinates. Dr. Salah al-Sawi (fatwa no. 77830, 15 February 2009) answered that where a time is fixed for the fluid's descending and ceasing, he must wait till it ceases, then do istinja and wudu, then perform whatever purity-conditioned worship he wishes; where it is constant and unceasing, he does wudu for each prayer's time — as the answer details."
  ur: "پیشاب کے بعد سیال؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77830، 15 فروری 2009)⁩ کے مطابق معلوم ٹھراؤ کا انتظار کرے؛ مسلسل ہو تو ہر وقت پر وضو۔"
  es: "Un consultante describió un líquido que descendía después de orinar. El Dr. Salah al-Sawi (fatwa n.° 77830, 15 de febrero de 2009) respondió que, cuando hay un tiempo fijo para que el líquido descienda y cese, debe esperar hasta que cese, luego realizar el istinja y el wudu, y después realizar cualquier acto de adoración condicionado a la pureza que desee; cuando es constante e incesante, realiza el wudu para el tiempo de cada oración, como se detalla en la respuesta."
  fr: "Un homme a décrit un écoulement après avoir uriné. Le Dr Salah al-Sawi (fatwa n° 77830, 15 février 2009) a répondu que lorsque l'écoulement est limité dans le temps, il doit attendre la fin de l'écoulement, puis accomplir l'istinja et les ablutions (wudu), et enfin réaliser les actes d'adoration requis par la pureté rituelle. En revanche, lorsque l'écoulement est continu, il doit effectuer les ablutions (wudu) à chaque heure de prière, comme le précise la réponse."
  tr: "Bir soru soran kişi, idrardan sonra sıvı çıkıp çıkmadığını sordu. Dr. Salah Al-Sawy (15 Şubat 2009 tarihli 77830 Fetvası) yanıtladı: Bu sıvının boşaltılması ve durması için bir zaman belirlenirse, sıvının durmasını beklemesi, ardından temizlenme, abdest kullanımı ve ardından saflık gerektiren ibadet işlemlerine başlaması gerekir. Ancak her zaman kesintisiz olursa, cevabında açıklandığı gibi her namaz zamanı boyunca abdest alması gerekir."
  id: "Seorang penanya bertanya apakah cairan keluar setelah urine. Dr. Salah Al-Sawy menjawab (Fatwa No. 77830 tanggal 15 Februari 2009) bahwa jika waktu ditetapkan untuk keluarnya dan menghentikan cairan ini, ia harus menunggu hingga cairan itu berhenti, lalu melakukan pembersihan, melakukan wudhu, dan kemudian memulai ibadah yang memerlukan kemurnian. Namun, jika selalu tanpa henti, ia harus melakukan wudhu selama setiap waktu doa, seperti yang dijelaskan dalam jawaban."
