summary:
  ar: "تفسير للقرآن الكريم ألقاه محمد متولي الشعراوي على الناس، ثم دُوّن في كتب تحمل اسم «تفسير الشعراوي» أو «الخواطر». يمضي مع الآيات بالترتيب، ويجمع بين بيان المعنى اللغوي والتعليق الاجتماعي والوعظ. تستند هذه البطاقة إلى نسخة ممسوحة واحدة لم تُتحقق طبعتها بعد."
  en: "A Qur'an commentary delivered orally by Muhammad Mutawalli al-Sha'rawi and later transcribed in books titled Tafsir al-Sha'rawi or al-Khawatir. It takes the verses in order and combines the explanation of meaning with social commentary and admonition. This card rests on one scanned copy whose edition has not been verified."
  es: "Un comentario del Corán transmitido oralmente por Muhammad Mutawalli al-Sha'rawi y posteriormente transcrito en libros titulados Tafsir al-Sha'rawi o al-Khawatir. Presenta los versículos en orden y combina la explicación de su significado con comentarios sociales y exhortaciones. Esta tarjeta se basa en una copia escaneada cuya edición no ha sido verificada."
  fr: "Ce commentaire du Coran, transmis oralement par Muhammad Mutawalli al-Sha'rawi et transcrit ultérieurement dans des ouvrages intitulés Tafsir al-Sha'rawi ou al-Khawatir, présente les versets dans l'ordre et allie l'explication du sens à des commentaires sociaux et des exhortations. Cette fiche est basée sur une copie numérisée dont l'édition n'a pas été vérifiée."
  ur: "قرآن کی ایک تفسیر جسے محمد متولی الشعراوی نے زبانی طور پر پیش کیا اور بعد میں تفسیر الشعراوی یا الخواطر کے نام سے کتابوں میں نقل کیا گیا۔ یہ آیات کو ترتیب سے لیتا ہے اور معنی کی وضاحت کو سماجی تفسیر اور نصیحت کے ساتھ جوڑتا ہے۔ یہ کارڈ ایک اسکین شدہ کاپی پر ٹکا ہوا ہے جس کے ایڈیشن کی تصدیق نہیں ہوئی ہے۔"
  tr: "Muhammed Metvalli El-Şaarawi tarafından halka sunulan bir Kur'an-i Kerim Tefsiri, ardından \"Tefsir-Şaaravi\" veya \"El-Khawatir\" adlı kitaplarda kaydedilmiştir. Ayetleri sırayla ilerler, dilsel açıklama, toplumsal yorum ve vaazı birleştirir. Bu kart, henüz tamamlanmamış tek bir taranmış kopyaya dayanır."
  id: "Tafsir Al-Qur'an yang disampaikan oleh Muhammad Metwally Al-Shaarawi kepada masyarakat, kemudian dicatat dalam buku berjudul \"Tafsir Al-Shaarawi\" atau \"Al-Khawatir.\" Tafsir ini melanjutkan ayat-ayat secara berurutan, menggabungkan penjelasan linguistik, komentar sosial, dan khotbah. Kartu ini didasarkan pada satu salinan hasil scan yang edisinya belum selesai."
