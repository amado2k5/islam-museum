summary:
  ar: "تفسير للقرآن الكريم ألقاه محمد متولي الشعراوي على الناس، ثم دُوّن في كتب تحمل اسم «تفسير الشعراوي» أو «الخواطر». يمضي مع الآيات بالترتيب، ويجمع بين بيان المعنى اللغوي والتعليق الاجتماعي والوعظ. تستند هذه البطاقة إلى نسخة ممسوحة واحدة لم تُتحقق طبعتها بعد."
  en: "A Qur'an commentary delivered orally by Muhammad Mutawalli al-Sha'rawi and later transcribed in books titled Tafsir al-Sha'rawi or al-Khawatir. It takes the verses in order and combines the explanation of meaning with social commentary and admonition. This card rests on one scanned copy whose edition has not been verified."
