label: { ar: "متن أبي شجاع — غاية الاختصار", en: "Matn Abi Shujaʿ", es: "Matn Abi Shujaʿ", fr: "Matn Abi Shujaʿ", ur: "متن ابی شجاع", tr: "Abu Şuca'nın metni — En Özlü Özlük", id: "Teks Abu Shuja' — Keringkasan Tertinggi" }
summary:
  ar: "غاية الاختصار المعروف بمتن أبي شجاع في فقه الشافعية لأحمد بن الحسين بن أحمد الأصفهاني أبي شجاع ⁦(ت. 593هـ تقريباً)⁩ نثرية جمعت أبواب الفقه من الطهارة إلى الجنايات؛ أشهر متون الشافعية للمبتدئ {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Ghayat al-Ikhtisar, known as Matn Abi Shuja', in Shafi'i fiqh by Ahmad ibn al-Husayn al-Asfahani Abu Shuja' (d. ca. 593 AH) — a prose manual gathering the fiqh chapters from tahara to jinayat; the best-known Shafi'i primer for beginners {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Ghayat al-Ikhtisar, conocido como Matn Abi Shuja', en Shafi'i fiqh de Ahmad ibn al-Husayn al-Asfahani Abu Shuja' (m. ca. 593 AH): un manual en prosa que reúne los capítulos de fiqh desde tahara hasta jinayat; el manual shafi'í más conocido para principiantes {cita:al-mutun-al-ilmiyya-azhar} {cita:al-aalam}."
  fr: "Ghayat al-Ikhtisar, connu sous le nom de Matn Abi Shuja', dans le fiqh Shafi'i par Ahmad ibn al-Husayn al-Asfahani Abu Shuja' (décédé vers 593 AH) — un manuel en prose rassemblant les chapitres du fiqh de tahara à jinayat; l'introduction Shafi'i la plus connue pour les débutants {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "غیاث الاختصار، جسے متن ابی شجاع کے نام سے جانا جاتا ہے، شافعی فقہ میں احمد بن الحسین اصفہانی ابو شجاع ⁦(متوفی 593 ہجری)⁩ - طہرہ سے لے کر جنیات تک فقہ کے ابواب کو جمع کرنے والا ایک نثری کتابچہ؛ مبتدیوں کے لیے سب سے مشہور شافعی پرائمر {حوالہ: المتون العلمیہ ازہر}"
  tr: "Ahmed ibn al-Husayn ibn Ahmad al-Isfahani Abu Şuca' (yaklaşık 593 Hicri yıllarında öldü) tarafından Şafii fiqhında Ebu Şuca'nın metni olarak bilinen kısaltma, fıkâhın saflıktan ceza konularına kadar fıkh bölümlerini bir araya getiren bir düzyazı metinidir; yeni başlayanlar için en ünlü Şafii metinleri {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  id: "Singkatan yang dikenal sebagai teks Abu Shuja' dalam fiqhologi Shafi'i oleh Ahmad ibn al-Husayn ibn Ahmad al-Isfahani Abu Shuja' (wafat sekitar 593 H) adalah teks prosa yang mengumpulkan bab-bab fiksi dari kemurnian hingga masalah kriminal; teks Syafi'i yang paling terkenal untuk pemula {cite:al-mutun-al-ilmiyya-azhar} {cite:al-al-aalam}"
