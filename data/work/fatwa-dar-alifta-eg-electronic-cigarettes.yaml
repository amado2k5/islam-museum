id: work/fatwa-dar-alifta-eg-electronic-cigarettes
class: work
kind: fatwa
label: { ar: "حكم السجائر الإلكترونية", en: "The ruling on electronic cigarettes", ur: "الیکٹرانک سگریٹ کا حکم", es: "La sentencia sobre los cigarrillos electrónicos", fr: "La décision concernant les cigarettes électroniques", tr: "Elektronik Sigaralar Hakkında Karar", id: "Putusan tentang Rokok Elektronik" }
summary:
  ar: "سائل سأل عن حكم السجائر الإلكترونية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20752)⁩ أن التدخين حرام شرعًا لما ثبت من ضرره وعلى ذلك فالحكم الشرعي في السجائر الإلكترونية يرجع إلى مدى الضرر الواقع منها على ما فصّل الجواب."
  en: "A questioner asked about the ruling on electronic cigarettes. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20752) answered that smoking is haram for its proven harm, and the ruling on e-cigarettes turns on the degree of harm they cause — as the answer details."
  ur: "ایک سائل نے الیکٹرانک سگریٹ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20752)⁩ نے جواب دیا کہ تمباکو نوشی اپنے نقصان کی وجہ سے حرام ہے اور ای سگریٹ کا حکم اس کے ضرر کی مقدار پر منحصر ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la normativa relativa a los cigarrillos electrónicos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20752) respondió que fumar es haram (prohibido) por el daño comprobado que causa, y que la normativa sobre los cigarrillos electrónicos depende del grado de daño que provoquen, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question sur la position des autorités concernant les cigarettes électroniques. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20752) a répondu que fumer est haram en raison de sa nocivité avérée, et que la position des autorités concernant les cigarettes électroniques dépend du degré de nocivité qu'elles engendrent, comme le précise la réponse."
  tr: "Bir soru soran elektronik sigaralarla ilgili kararı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20752), sigaranın kanıtlanmış zararı nedeniyle dini olarak yasak olduğunu yanıtladı. Bu nedenle, elektronik sigaralarla ilgili yasal karar, verdikleri zararın boyutuna bağlıdır; bu durum yanıtta açıklanmıştır."
  id: "Seorang penanya menanyakan tentang putusan mengenai rokok elektronik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20752) menjawab bahwa merokok dilarang secara agama karena terbukti berbahaya. Oleh karena itu, putusan hukum tentang rokok elektronik bergantung pada tingkat bahaya yang ditimbulkannya, seperti yang dijelaskan dalam jawaban."
