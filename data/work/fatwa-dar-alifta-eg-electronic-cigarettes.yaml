summary:
  ar: "سائل سأل عن حكم السجائر الإلكترونية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20752)⁩ أن التدخين حرام شرعًا لما ثبت من ضرره وعلى ذلك فالحكم الشرعي في السجائر الإلكترونية يرجع إلى مدى الضرر الواقع منها على ما فصّل الجواب."
  en: "A questioner asked about the ruling on electronic cigarettes. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20752) answered that smoking is haram for its proven harm, and the ruling on e-cigarettes turns on the degree of harm they cause — as the answer details."
  ur: "ایک سائل نے الیکٹرانک سگریٹ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20752)⁩ نے جواب دیا کہ تمباکو نوشی اپنے نقصان کی وجہ سے حرام ہے اور ای سگریٹ کا حکم اس کے ضرر کی مقدار پر منحصر ہے — جیسا کہ جواب میں تفصیل ہے۔"
