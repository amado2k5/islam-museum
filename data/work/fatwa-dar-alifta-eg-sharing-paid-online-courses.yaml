id: work/fatwa-dar-alifta-eg-sharing-paid-online-courses
class: work
kind: fatwa
label: { ar: "حكم مشاركة الكورسات التعليمية", en: "Sharing paid online courses with non-subscribers", ur: "ادا شدہ آن لائن کورسز دوسروں کے ساتھ بانٹنا", es: "Compartir cursos online de pago con personas que no son suscriptoras.", fr: "Partager des cours en ligne payants avec des non-abonnés" }
summary:
  ar: "سائل سأل عن إشراك غير المشترك معه في مشاهدة الكورسات التعليمية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20902)⁩ أنه لا يجوز شرعًا لغير المشترك إشراك غيره معه في مشاهدتها ما لم يأذن صاحبها لأنها من الحقوق المادية التي لا يجوز الاعتداء عليها على ما فصّل الجواب."
  en: "A questioner asked about letting a non-subscriber share his access to paid online courses. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20902) answered that it is not lawful without the owner's permission, being among the material rights that may not be transgressed — as the answer details."
  ur: "ایک سائل نے ادا شدہ آن لائن کورسز غیر صارف کو دکھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20902)⁩ نے جواب دیا کہ مالک کی اجازت کے بغیر یہ جائز نہیں کیونکہ یہ مادی حقوق ہیں جن پر تجاوز جائز نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de que una persona que no es suscriptora comparta su acceso a cursos en línea de pago. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20902) respondió que no es lícito sin el permiso del propietario, ya que se trata de un derecho fundamental que no puede ser vulnerado, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de partager l'accès à des cours en ligne payants avec une personne non abonnée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20902) a répondu que cela n'est pas licite sans l'autorisation du titulaire des droits, car il s'agit d'un droit fondamental inviolable, comme le précise la réponse."
