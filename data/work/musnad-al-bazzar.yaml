summary:
  ar: "المسند الكبير المعلل للحافظ أبي بكر أحمد بن عمرو البزار البصري (ت 292هـ)، رتّب فيه الأحاديث على مسانيد الصحابة بحسب الفضل، مبتدئاً بالخلفاء الأربعة، وتكلم فيه على تفرّد الرواة وعلل الأسانيد وأحوال الرجال؛ عُرف بمسند البزار، وسُمّي المسند الكبير والمسند المعلل والبحر الزخار، وجمع الهيثمي زوائده في «كشف الأستار». {cite:musnad-bazzar-anas-thesis-1413 p.35} {cite:musnad-bazzar-anas-thesis-1413 p.36} {cite:musnad-bazzar-anas-thesis-1413 p.70} {cite:musnad-bazzar-anas-thesis-1413 p.98}"
  en: "The large annotated Musnad of al-Hafiz Abu Bakr Ahmad ibn Amr al-Bazzar of Basra (d. 292 AH), arranging hadith by the Companions who related them in order of merit, beginning with the four caliphs, with comments on narrators' sole transmissions, defects in chains and the standing of narrators; known as Musnad al-Bazzar, also called al-Musnad al-Kabir, al-Musnad al-Mu'allal and al-Bahr al-Zakhkhar, its additional hadiths were collected by al-Haythami in Kashf al-Astar."
  ur: "حافظ ابو بکر احمد بن عمرو بزار بصری (م 292ھ) کی بڑی معلّل مسند، جس میں احادیث صحابہ کی مسانید پر فضیلت کی ترتیب سے ہیں، خلفائے اربعہ سے آغاز؛ اس میں راویوں کے تفرد، اسانید کی علل اور رجال کے احوال پر کلام ہے؛ یہ مسند البزار کے نام سے معروف ہے، اسے المسند الکبیر، المسند المعلّل اور البحر الزخار بھی کہا گیا، اور ہیثمی نے اس کے زوائد «کشف الاستار» میں جمع کیے۔"
