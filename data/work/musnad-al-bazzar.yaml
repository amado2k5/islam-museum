summary:
  ar: "المسند الكبير المعلل للحافظ أبي بكر أحمد بن عمرو البزار البصري ⁦(ت 292هـ)⁩، رتّب فيه الأحاديث على مسانيد الصحابة بحسب الفضل، مبتدئاً بالخلفاء الأربعة، وتكلم فيه على تفرّد الرواة وعلل الأسانيد وأحوال الرجال؛ عُرف بمسند البزار، وسُمّي المسند الكبير والمسند المعلل والبحر الزخار، وجمع الهيثمي زوائده في «كشف الأستار». {cite:musnad-bazzar-anas-thesis-1413 p.35} {cite:musnad-bazzar-anas-thesis-1413 p.36} {cite:musnad-bazzar-anas-thesis-1413 p.70} {cite:musnad-bazzar-anas-thesis-1413 p.98}"
  en: "The large annotated Musnad of al-Hafiz Abu Bakr Ahmad ibn Amr al-Bazzar of Basra (d. 292 AH), arranging hadith by the Companions who related them in order of merit, beginning with the four caliphs, with comments on narrators' sole transmissions, defects in chains and the standing of narrators; known as Musnad al-Bazzar, also called al-Musnad al-Kabir, al-Musnad al-Mu'allal and al-Bahr al-Zakhkhar, its additional hadiths were collected by al-Haythami in Kashf al-Astar."
  ur: "حافظ ابو بکر احمد بن عمرو بزار بصری ⁦(م 292ھ)⁩ کی بڑی معلّل مسند، جس میں احادیث صحابہ کی مسانید پر فضیلت کی ترتیب سے ہیں، خلفائے اربعہ سے آغاز؛ اس میں راویوں کے تفرد، اسانید کی علل اور رجال کے احوال پر کلام ہے؛ یہ مسند البزار کے نام سے معروف ہے، اسے المسند الکبیر، المسند المعلّل اور البحر الزخار بھی کہا گیا، اور ہیثمی نے اس کے زوائد «کشف الاستار» میں جمع کیے۔"
  es: "El extenso Musnad anotado de al-Hafiz Abu Bakr Ahmad ibn Amr al-Bazzar de Basora (m. 292 AH), que ordena los hadices de los Compañeros que los relataron en orden de mérito, comenzando con los cuatro califas, con comentarios sobre las transmisiones únicas de los narradores, los defectos en las cadenas y la posición de los narradores; conocido como Musnad al-Bazzar, también llamado al-Musnad al-Kabir, al-Musnad al-Mu'allal y al-Bahr al-Zakhkhar, sus hadices adicionales fueron recopilados por al-Haythami en Kashf al-Astar."
  fr: "Le grand Musnad annoté d'al-Hafiz Abu Bakr Ahmad ibn Amr al-Bazzar de Basra (mort en 292 AH), classant les hadiths des Compagnons qui les ont rapportés par ordre de mérite, en commençant par les quatre califes, avec des commentaires sur les transmissions uniques des narrateurs, les défauts dans les chaînes et le statut des narrateurs; connu sous le nom de Musnad al-Bazzar, également appelé al-Musnad al-Kabir, al-Musnad al-Mu'allal et al-Bahr al-Zakhkhar, ses hadiths supplémentaires ont été rassemblés par al-Haythami dans Kashf al-Astar."
  tr: "Hafız Ebu Bekir Ahmed bin Amr al-Bazzar al-Basri (ö. 292 H) tarafından yazılmış Büyük Müsned, hadisleri Sahabelerin Musnadlarına göre erdeme göre düzenlemiştir; dört halifeden başlayarak. Rivayetçilerin benzersizliğini, rivayet zincirlerinin nedenlerini ve rivayetçilerin koşullarını tartışmıştır; Musnad al-Bazzar olarak tanınmıştır ve bu eser Büyük Musnad, Seçkin Musnad ve Al-Bahr al-Zakhar olarak adlandırılmıştır. El-Heythami eklemelerini 'Kaşf el-Estar'da derlemiştir. {alıntı:) musnad-bazzar-anas-tez-1413 s.35} {cite:musnad-bazzar-anas-tez-1413 s.36} {cite:musnad-bazzar-anas-tez-1413 s.70} {cite:musnad-bazzar-anas-thesis-1413 s.98}"
  id: "Musnad Besar yang Beralasan oleh Hafiz Abu Bakr Ahmad ibn Amr al-Bazzar al-Basri (wafat 292 H), di mana ia menyusun hadis menurut Musnad para Sahabat berdasarkan kebajikan, dimulai dari empat khalifah. Ia membahas keunikan para narator, alasan adanya rantai narator, dan kondisi para narator; ia dikenal sebagai Musnad al-Bazzar, dan disebut Musnad Agung, Musnad Terhormat, dan Al-Bahr al-Zakhar. Al-Haythami menyusun tambahannya dalam 'Kashf al-Astar'. {cite:musnad-bazzar-anas-thesis-1413 hlm.35} {cite:musnad-bazzar-anas-thesis-1413 hlm.36} {cite:musnad-bazzar-anas-thesis-1413 hlm.70} {cite:musnad-bazzar-anas-thesis-1413 hlm.98}"
