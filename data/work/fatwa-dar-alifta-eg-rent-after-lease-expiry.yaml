label: { ar: "حكم أجرة المدة الزائدة بعد انتهاء عقد الإيجار", en: "Rent for the extra period after a lease ends", ur: "اجارہ ختم ہونے کے بعد اضافی مدت کا کرایہ" }
summary:
  ar: "سائل سأل عن أجرة المدة الزائدة بعد انتهاء عقد إجارة الأرض الزراعية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21829)⁩ أن الأصل في عقد إجارة الأرض الزراعية أن ينتهي بانتهاء المدة المتفق عليها وترد الأرض المستأجرة إلى صاحبها وبيّن الجواب حكم ما بعد ذلك على وجهه."
  en: "A questioner asked about rent for the extra period after an agricultural-land lease ends. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21829) answered that the default is that a farmland lease ends when its agreed term ends and the land returns to its owner; the answer sets out the ruling for what follows."
  ur: "ایک سائل نے زرعی زمین کے اجارے کی مدت ختم ہونے کے بعد اضافی مدت کے کرایے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21829)⁩ نے جواب دیا کہ اصول یہ ہے کہ اجارہ طے شدہ مدت کے ختم ہونے پر ختم ہو جاتا ہے اور زمین مالک کو واپس مل جاتی ہے؛ اس کے بعد کا حکم جواب میں بیان ہوا۔"
