id: work/fatwa-amja-paying-taxes-abroad
class: work
kind: fatwa
label: { ar: "دفع الضرائب للدولة المضيفة", en: "Paying taxes to the host state", ur: "میزبان حکومت کو ٹیکس دینا", es: "Pagar impuestos al estado anfitrión", fr: "Payer des impôts à l'État hôte", tr: "Ev sahibi ülkeye vergi ödemek", id: "Membayar pajak ke negara tuan rumah" }
summary:
  ar: "سأل مصري عن قريبه المقيم في أمريكا وعن من يخطئه ويقول بجواز معاداته لدفعه الضرائب لحكومة تتخذ مواقف معادية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79064 بتاريخ 1 يونيو 2009)⁩ أن حكم الإقامة خارج بلاد الإسلام يختلف من فرد إلى آخر بحسب ظروفه وملابساته، فمن كان قادرًا على إظهار دينه وآمنًا من الفتنة فيه فلا حرج عليه أن يقيم حيث شاء على أن تكون له نية صالحة من طلب علم أو تحصيل رزق أو فرار بدين، وأما الضرائب فالأصل فيها أنها تعود في صورة خدمات إلى دافعيها وما ينفق منها في الفساد فمن جنس تزاحم المصالح والمفاسد وتداخل المنافع والمضار في أزمنة الفتن على ما فصّل."
  en: "A questioner asked about his Egyptian relative living in America, whom some fault — even deeming him an enemy — for paying taxes to a government with hostile positions. Dr. Salah al-Sawi (fatwa no. 79064, 1 June 2009) answered that residing outside Muslim lands is judged person by person, per circumstances: one able to show his religion and safe from trial may live where he wills — the lands are God's and the servants God's — with a good intention of seeking knowledge, earning a living or fleeing with his faith; as for taxes, they return as services to their payers, and what is spent from them in corruption belongs to the weighing of benefits and harms and the entangling of the two in times of trial, as detailed. Recorded as AMJA's answer."
  ur: "ایک سائل نے امریکہ مقیم قریبی کے ٹیکس دینے پر تنقید کا مسئلہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79064، 1 جون 2009)⁩ کے مطابق اقامت کا حکم حالات کے مطابق بدلتا ہے؛ ٹیکس خدمات میں لوٹتے ہیں اور فساد میں صرف ہونے والا حصہ مصلحت مفسدت کے جھگڑے میں آتا ہے۔"
  es: "Un consultante preguntó sobre su pariente egipcio residente en Estados Unidos, a quien algunos culpan —e incluso lo consideran un enemigo— por pagar impuestos a un gobierno con posturas hostiles. El Dr. Salah al-Sawi (fatwa n.° 79064, 1 de junio de 2009) respondió que la residencia fuera de tierras musulmanas se juzga individualmente, según las circunstancias: quien pueda demostrar su religión y esté a salvo de juicio puede vivir donde desee —las tierras son de Dios y los siervos de Dios— con la buena intención de buscar conocimiento, ganarse la vida o huir con su fe; en cuanto a los impuestos, estos se devuelven como servicios a quienes los pagan, y lo que se gasta en corrupción corresponde a la ponderación de beneficios y perjuicios y a la resolución de ambos en tiempos de prueba, como se detalla. Registrada como respuesta de AMJA."
  fr: "Un internaute a posé une question concernant un parent égyptien résidant aux États-Unis, que certains critiquent – le considérant même comme un ennemi – pour payer des impôts à un gouvernement aux positions hostiles. Le Dr Salah al-Sawi (fatwa n° 79064, 1er juin 2009) a répondu que la résidence hors des terres musulmanes est une affaire individuelle, qui dépend des circonstances: celui qui peut prouver sa religion et qui est à l’abri des poursuites judiciaires peut vivre où bon lui semble – la terre et les serviteurs appartiennent à Dieu – avec la bonne intention d’acquérir des connaissances, de gagner sa vie ou de fuir en préservant sa foi; quant aux impôts, ils sont considérés comme un service rendu à ceux qui les paient, et ce qui est détourné à des fins de corruption relève de la mise en balance des avantages et des inconvénients, et de la nécessité de les concilier en cas de procès, comme expliqué en détail. Cette réponse a été consignée dans l’AMJA."
  tr: "Bir Mısırlı, Amerika'da yaşayan akrabasını ve onu yanlış anlayan, düşmanca tutumlar benimseyen bir hükümete vergi ödediği için karşı çıkabileceğini iddia edenleri sormuştur. Dr. Salah Al-Sawy (1 Haziran 2009 tarihli 79064 sayılı Fetva) İslam ülkeleri dışında ikamet hakkındaki kararın bireyden kişiye koşullarına ve detaylarına göre değiştiğini yanıtlamıştır. Dinini ortaya koyabilen ve içinde isyandan korunan kişi, iyi niyetleri olduğu sürece bilgi aramak, geçimini sağlamak veya borçtan kaçmak gibi iyi niyetleri olduğu sürece istediği yerde yaşaması suçlanmaz. Vergiler konusunda ise, orijinal ilke, bunların ödeyenlere hizmet olarak geri verilmesidir ve yolsuzluğa harcanan miktar, çıkar çatışmaları, yolsuzluklar ve çatışma zamanlarında fayda ve zararların örtüşmesi türden olur, açıklandığı gibi."
  id: "Seorang Mesir menanyakan tentang kerabatnya yang tinggal di Amerika dan tentang mereka yang salah menganggapnya dan mengklaim bahwa dia diizinkan menentangnya karena membayar pajak kepada pemerintah yang mengambil sikap bermusuhan. Dr. Salah Al-Sawy menjawab (Fatwa No. 79064 tanggal 1 Juni 2009) bahwa aturan tentang tinggal di luar negara Islam berbeda-beda tergantung pada situasi dan rincian mereka. Siapa pun yang mampu mewujudkan agamanya dan aman dari hasutan di dalamnya tidak disalahkan untuk tinggal di mana pun mereka mau, asalkan mereka memiliki niat baik seperti mencari ilmu, mencari nafkah, atau melarikan diri dari utang. Adapun pajak, prinsip aslinya adalah pajak dikembalikan sebagai jasa kepada pembayarnya, dan apa yang dihabiskan untuk korupsi adalah jenis yang bertentangan dengan kepentingan dan korupsi serta tumpang tindih manfaat dan kerugian selama masa konflik, seperti yang dijelaskan."
