id: work/fatwa-amja-paying-taxes-abroad
class: work
kind: fatwa
label: { ar: "دفع الضرائب للدولة المضيفة", en: "Paying taxes to the host state", ur: "میزبان حکومت کو ٹیکس دینا", es: "Pagar impuestos al estado anfitrión" }
summary:
  ar: "سأل مصري عن قريبه المقيم في أمريكا وعن من يخطئه ويقول بجواز معاداته لدفعه الضرائب لحكومة تتخذ مواقف معادية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79064 بتاريخ 1 يونيو 2009)⁩ أن حكم الإقامة خارج بلاد الإسلام يختلف من فرد إلى آخر بحسب ظروفه وملابساته، فمن كان قادرًا على إظهار دينه وآمنًا من الفتنة فيه فلا حرج عليه أن يقيم حيث شاء على أن تكون له نية صالحة من طلب علم أو تحصيل رزق أو فرار بدين، وأما الضرائب فالأصل فيها أنها تعود في صورة خدمات إلى دافعيها وما ينفق منها في الفساد فمن جنس تزاحم المصالح والمفاسد وتداخل المنافع والمضار في أزمنة الفتن على ما فصّل."
  en: "A questioner asked about his Egyptian relative living in America, whom some fault — even deeming him an enemy — for paying taxes to a government with hostile positions. Dr. Salah al-Sawi (fatwa no. 79064, 1 June 2009) answered that residing outside Muslim lands is judged person by person, per circumstances: one able to show his religion and safe from trial may live where he wills — the lands are God's and the servants God's — with a good intention of seeking knowledge, earning a living or fleeing with his faith; as for taxes, they return as services to their payers, and what is spent from them in corruption belongs to the weighing of benefits and harms and the entangling of the two in times of trial, as detailed. Recorded as AMJA's answer."
  ur: "ایک سائل نے امریکہ مقیم قریبی کے ٹیکس دینے پر تنقید کا مسئلہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79064، 1 جون 2009)⁩ کے مطابق اقامت کا حکم حالات کے مطابق بدلتا ہے؛ ٹیکس خدمات میں لوٹتے ہیں اور فساد میں صرف ہونے والا حصہ مصلحت مفسدت کے جھگڑے میں آتا ہے۔"
  es: "Un consultante preguntó sobre su pariente egipcio residente en Estados Unidos, a quien algunos culpan —e incluso lo consideran un enemigo— por pagar impuestos a un gobierno con posturas hostiles. El Dr. Salah al-Sawi (fatwa n.° 79064, 1 de junio de 2009) respondió que la residencia fuera de tierras musulmanas se juzga individualmente, según las circunstancias: quien pueda demostrar su religión y esté a salvo de juicio puede vivir donde desee —las tierras son de Dios y los siervos de Dios— con la buena intención de buscar conocimiento, ganarse la vida o huir con su fe; en cuanto a los impuestos, estos se devuelven como servicios a quienes los pagan, y lo que se gasta en corrupción corresponde a la ponderación de beneficios y perjuicios y a la resolución de ambos en tiempos de prueba, como se detalla. Registrada como respuesta de AMJA."
