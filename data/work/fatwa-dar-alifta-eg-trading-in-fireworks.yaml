id: work/fatwa-dar-alifta-eg-trading-in-fireworks
class: work
kind: fatwa
label: { ar: "حكم التجارة في المفرقعات واستعمالها", en: "Trading in and using fireworks", ur: "پٹاخوں کی تجارت اور استعمال", es: "Comercio y uso de fuegos artificiales", fr: "commerce et utilisation des feux d'artifice", tr: "Ticaret ve havai fişek kullanımı hakkındaki karar", id: "Putusan tentang perdagangan dan penggunaan petasan" }
summary:
  ar: "سائل سأل عن التجارة في المفرقعات والألعاب النارية واستعمالها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21762)⁩ أنه يحرم شرعًا استعمال الأفراد المفرقعات والألعاب النارية لأنها وسيلة لإصابة النفس والآخرين بالأذى على ما فصّل الجواب."
  en: "A questioner asked about trading in fireworks and firecrackers and using them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21762) answered that individuals using firecrackers and fireworks is forbidden in the sharia, being a means of harm to oneself and others — as the answer details."
  ur: "ایک سائل نے پٹاخوں کی تجارت اور استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21762)⁩ نے جواب دیا کہ ان کا استعمال حرام ہے کیونکہ یہ اپنی اور دوسروں کی جان و مال کے نقصان کا ذریعہ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el comercio y el uso de fuegos artificiales y petardos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21762) respondió que el uso de petardos y fuegos artificiales por parte de particulares está prohibido por la sharia, ya que constituye un medio para dañarse a uno mismo y a los demás, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le commerce et l'utilisation de feux d'artifice et de pétards. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21762) a répondu que l'utilisation de feux d'artifice et de pétards par des particuliers est interdite par la charia, car elle constitue un moyen de nuire à soi-même et à autrui – comme le précise la réponse."
  tr: "Bir soru soran kişi, havai fişek ticareti ve havai fişek ticareti ile bunların kullanımı hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21762), insanların havai fişek ve havai fişek kullanmalarının dini olarak yasak olduğunu, çünkü bunların kendine ve başkalarına zarar vermek için bir araç olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang perdagangan kembang api dan kembang api serta penggunaannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21762) menjawab bahwa secara agama dilarang bagi individu menggunakan kembang api karena merupakan cara untuk melukai diri sendiri dan orang lain, seperti yang dijelaskan dalam jawaban."
