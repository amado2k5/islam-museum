id: work/leadership-development-academy-1-program
class: work
kind: lecture-series
label:
  ar: "أكاديمية إعداد القادة ⁦(دورة تدريبية مصوّرة)⁩"
  en: "Akadimiyyat I'dad al-Qada, the Academy for Preparing Leaders (filmed training course)"
  ur: "أكاديمية إعداد القادة: قائدین کی تیاری کی اکیڈمی ⁦(فلمائی گئی تربیتی کورس)⁩"
summary:
  ar: "دورة تدريبية مصوّرة لطارق السويدان في أكاديمية قيادية مقيمة عُقدت في تركيا نحو 2007–2008، يحفظ أرشيف أسابيل اثنين وعشرين درساً منها: إدارة الحياة، والتأليف والإلقاء، وتحليل الشخصيات والمنظمات، وصناعة القائد، والإبداع، والتخطيط الاستراتيجي والتشغيلي، والتغيير، والقوة والنفوذ، وتمارين الفريق."
  en: "A filmed training course by Tareq al-Suwaidan at a residential leadership academy held in Turkey around 2007-2008, of which the Assabile archive keeps twenty-two lessons: life management, authorship and public speaking, analysing personalities and organisations, making the leader, creativity, strategic and operational planning, change, power and influence, and team exercises."
  ur: "ترکی میں تقریباً 2007–2008 میں منعقد ایک اقامتی قیادتی اکیڈمی میں طارق السویدان کا فلمایا گیا تربیتی کورس، جس کے بائیس اسباق اسابیل آرکائیو میں محفوظ ہیں: زندگی کا انتظام، تالیف اور خطابت، شخصیات اور تنظیموں کا تجزیہ، قائد سازی، تخلیقیت، سٹریٹجک اور آپریشنل منصوبہ بندی، تبدیلی، قوت و اثر، اور ٹیم کی مشقیں۔"
