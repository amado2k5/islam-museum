id: work/fatwa-iifa-241-covid-contracts-financial-obligations
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 241 (25/3) بشأن آثار جائحة كورونا على أحكام المعاملات والعقود والالتزامات المالية", en: "IIFA resolution 241 (25/3) on the effects of the COVID-19 pandemic on the rulings on transactions, contracts and financial obligations", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 241 (25/3): کورونا وبا کے معاملات، معاہدوں اور مالی التزامات کے احکام پر اثرات", es: "Resolución 241 (25/3) de la IIFA sobre los efectos de la pandemia de COVID-19 en las resoluciones sobre transacciones, contratos y obligaciones financieras.", fr: "Résolution 241 (25/3) de l'IIFA relative aux effets de la pandémie de COVID-19 sur les décisions relatives aux transactions, aux contrats et aux obligations financières", tr: "Uluslararası İslami Fiqh Akademisi Kararı 241 (25/3) Koronavirüs pandemisinin işlemler, sözleşmeler ve mali yükümlülükler üzerindeki etkilerine ilişkin", id: "Keputusan International Islamic Fiqh Academy 241 (25/3) mengenai dampak pandemi Coronavirus terhadap keputusan transaksi, kontrak, dan kewajiban keuangan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، إلحاقًا بقراره 240 ⁦(25/2)⁩ في أثر الجائحة على العبادات والأسرة والجنايات. قرر المجمع أن كورونا من الأعذار الطارئة التي تجيز إعادة النظر في الالتزامات التعاقدية تأجيلًا أو فسخًا أو إسقاطًا؛ وللمتضرر في العقود المعطلة إلغاء العقد واستعادة العربون وهامش الجدية أو التصالح على إيقاف التنفيذ مؤقتًا أو تخفيف التزامه؛ ولا أثر للجائحة في الإيجار السكني بعد حصول الانتفاع، وتبقى الأجرة دينًا في ذمة المستأجر المعسر؛ ولا يجوز الإلزام بالشرط الجزائي إذا كانت الجائحة سبب التأخير؛ ويجوز بإشراف الدولة إعادة توزيع الرواتب أو تخفيضها مع تخفيض ساعات العمل بقدر نقص المنفعة؛ ويجوز اللجوء للتأمين التجاري بقدر الحاجة عند عدم توفر التأمين التعاوني الإسلامي؛ ويصلح في المتأخرات المتعثرة بما يقتضي العدل؛ ولما يشبه كورونا من الأوبئة أحكامها. وأوصى بمبادرات إنسانية للتخفيف من آثار الإفلاس ودعم الدول الأقل نموًا والنازحين واللاجئين، وبعطايا الشركات والمصارف والمحسنين."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), as a companion to its resolution 240 (25/2) on the pandemic's effect on worship, family and offences. It ruled that COVID-19 is among the emergency excuses allowing contractual obligations to be revisited by deferral, rescission or discharge; that the injured party in contracts whose conclusion or execution is suspended may cancel and recover the deposit and earnest margin, or agree to suspend execution or reduce their obligation; that the pandemic has no effect on residential rent once the leased property has been used, the rent remaining a debt on the insolvent tenant; that a penalty clause may not be enforced when the pandemic caused the delay; that under state supervision salaries may be redistributed or cut in proportion to reduced working hours and lost benefit; that recourse to commercial insurance is allowed to the extent of need where Islamic cooperative insurance is unavailable; that arrears on financing contracts whose instalments the pandemic disrupted should be settled justly; and that comparable epidemics take the same rulings. It recommended organised humanitarian initiatives against bankruptcy's effects and support for least-developed countries, displaced people and refugees, and donations from companies, banks and benefactors."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی قرارداد 240 ⁦(25/2)⁩ کے تسلسل میں۔ اکیڈمی نے فیصلہ کیا کہ کورونا ان اچانک اذروں میں ہے جو معاہداتی التزامات پر نظرِ ثانی — التوا، فسخ یا اسقاط — کی اجازت دیتے ہیں؛ معطل معاہدوں میں متاثرہ فریق معاہدہ منسوخ کر کے بیعانہ اور جدیت کی رقم واپس لے سکتا ہے یا عبوری التوا یا التزام کی تخفیف پر صلح کر سکتا ہے؛ رہائشی کرایہ پر وبا کا اثر نہیں جب استفادہ ہو چکا ہو، کرایہ معسر کرایہ دار کے ذمہ قرض رہتا ہے؛ جب تاخیر کا سبب وبا ہو تو شرطِ جزائی نافذ نہیں کیا جا سکتا؛ ریاستی نگرانی میں تنخواہوں کی از سرِ نو تقسیم یا کمی کم اوقاتِ کار کے تناسب سے جائز ہے؛ اسلامی تعاونی بیمہ دستیاب نہ ہو تو ضرورت کے مطابق تجارتی بیمہ جائز ہے؛ تعطل شدہ اقساط کا صلح انصاف کے تقاضے سے ہو؛ اور ایسی ہی اوباؤں کو وہی احکام ہیں۔ سفارشات میں دیوالیہ پن کے اثرات کے خلاف انسانی مبادرات، کم ترقی یافتہ ممالک، بے گھر افراد اور مہاجرین کی معاونت، اور کمپنیوں، بینکوں اور نیکوکاروں کے عطیات شامل ہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023), como complemento de su resolución 240 (25/2) sobre el efecto de la pandemia en el culto, la familia y los delitos. Dictaminó que la COVID-19 se encuentra entre las excusas de emergencia que permiten revisar las obligaciones contractuales mediante aplazamiento, rescisión o liberación; que la parte perjudicada en contratos cuya conclusión o ejecución se suspende puede cancelar y recuperar el depósito y el margen de garantía, o acordar suspender la ejecución o reducir su obligación; que la pandemia no tiene efecto sobre el alquiler residencial una vez que la propiedad arrendada se ha utilizado, el alquiler sigue siendo una deuda para el inquilino insolvente; que una cláusula penal no puede hacerse cumplir cuando la pandemia causó la demora; que bajo supervisión estatal los salarios pueden redistribuirse o recortarse en proporción a las horas de trabajo reducidas y los beneficios perdidos; que se permite recurrir a seguros comerciales en la medida de la necesidad cuando no está disponible el seguro cooperativo islámico; que los atrasos en los contratos de financiación cuyas cuotas se vieron interrumpidas por la pandemia deben saldarse con justicia; y que epidemias similares reciban las mismas resoluciones. Recomendó iniciativas humanitarias organizadas para contrarrestar los efectos de la quiebra y el apoyo a los países menos adelantados, las personas desplazadas y los refugiados, así como donaciones de empresas, bancos y benefactores."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023), complémentaire à sa résolution 240 (25/2) relative à l'impact de la pandémie sur le culte, la famille et les infractions. Elle a statué que la COVID-19 figure parmi les cas d'urgence permettant de réexaminer les obligations contractuelles par le biais d'un report, d'une résiliation ou d'une extinction; que la partie lésée dans les contrats dont la conclusion ou l'exécution est suspendue peut annuler le contrat et recouvrer l'acompte et la marge de garantie, ou convenir d'une suspension d'exécution ou d'une réduction de son obligation; que la pandémie n'a aucun effet sur le loyer d'un logement une fois celui-ci occupé, le loyer demeurant une dette du locataire insolvable; qu'une clause pénale ne peut être appliquée lorsque le retard est imputable à la pandémie; que, sous contrôle de l'État, les salaires peuvent être redistribués ou réduits proportionnellement à la réduction du temps de travail et à la perte de revenus; que le recours à une assurance commerciale est autorisé dans la mesure du nécessaire lorsque l'assurance coopérative islamique n'est pas disponible. Il a été demandé que les arriérés de contrats de financement dont les échéances ont été perturbées par la pandémie soient réglés équitablement et que les mêmes décisions soient prises en cas d'épidémies comparables. Le rapport a recommandé des initiatives humanitaires organisées pour contrer les effets de la faillite et un soutien aux pays les moins avancés, aux personnes déplacées et aux réfugiés, ainsi que des dons d'entreprises, de banques et de bienfaiteurs."
  tr: "Uluslararası İslami Fiqh Akademisi'nin 25. oturumunda (29 Recep – 3 Şa'ban 1444 H, 20–23 Şubat 2023) Cidde'deki toplu kararı, pandeminin ibadet, aile ve suçlar üzerindeki etkisi üzerine 240 (25/2) sayılı kararını takiben. Akademi, COVID-19'un acil bir bahane olduğunu, sözleşme yükümlülüklerinin erteleme, iptal veya iptal yoluyla yeniden değerlendirilmesine olanak tanıyan bir bahane olduğuna karar verdi; geçersiz sözleşmelerden zarar gören taraf sözleşmeyi iptal edebilir, depozito ve teminat marjını tahsil edebilir veya yükümlülüğünün geçici askıya alınması veya azaltılmasıyla uzlaşabilir; pandeminin yardımdan sonra konut kirası üzerinde etkisi yoktur ve kira iflas etmiş kiracının borcu olarak kalır; gecikmenin sebebi pandemiyse ceza maddesi zorunlu değildir; devlet gözetimi altında maaşlar yeniden dağıtılabilir veya azaltılabilir, çalışma saatleri azaldılırsa, istilami kooperatif sigortası mevcut olmadığında ticari sigortaya başvurulabilir; adaletle uyumlu olmayan borçlar için uygundur; ve COVID-19'a benzer pandemi hükümleri geçerlidir. İflasın etkilerini hafifletmek, en az gelişmiş ülkeleri, yerinden edilmiş kişileri ve mültecileri desteklemek için insani girişimler ve şirketler, bankalar ve hayırseverlerden bağış yapılmasını önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023), setelah keputusan 240 (25/2) mengenai dampak pandemi terhadap ibadah, keluarga, dan kejahatan. Akademi memutuskan bahwa COVID-19 adalah alasan darurat yang memungkinkan peninjauan kembali kewajiban kontraktual dengan penundaan, pembatalan, atau pembatalan; pihak yang dirugikan dalam kontrak yang dibatalkan dapat membatalkan kontrak, memulihkan margin deposit dan kewajiban, atau menerima penangguhan sementara atau pengurangan kewajiban mereka; pandemi tidak berdampak pada sewa hunian setelah tunjangan, dan sewa tetap menjadi utang yang harus dibayar oleh penyewa yang bangkrut; klausul sanksi tidak wajib jika pandemi menjadi penyebab keterlambatan; di bawah pengawasan negara, gaji dapat didistribusikan ulang atau dikurangi, bersama dengan pengurangan jam kerja hingga manfaat yang dikurangi; asuransi komersial dapat digunakan sesuai kebutuhan ketika asuransi koperasi Islam tidak tersedia; dan sesuai untuk tunggakan yang tidak sesuai dengan keadilan; serta ketentuan pandemi yang mirip dengan COVID-19 berlaku. Ia merekomendasikan inisiatif kemanusiaan untuk mengurangi dampak kebangkrutan, mendukung negara-negara paling kurang berkembang, orang-orang yang mengungsi, dan pengungsi, serta donasi dari perusahaan, bank, dan dermawan."
