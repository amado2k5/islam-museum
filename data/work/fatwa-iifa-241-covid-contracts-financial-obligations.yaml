id: work/fatwa-iifa-241-covid-contracts-financial-obligations
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 241 (25/3) بشأن آثار جائحة كورونا على أحكام المعاملات والعقود والالتزامات المالية", en: "IIFA resolution 241 (25/3) on the effects of the COVID-19 pandemic on the rulings on transactions, contracts and financial obligations", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 241 (25/3): کورونا وبا کے معاملات، معاہدوں اور مالی التزامات کے احکام پر اثرات" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، إلحاقًا بقراره 240 ⁦(25/2)⁩ في أثر الجائحة على العبادات والأسرة والجنايات. قرر المجمع أن كورونا من الأعذار الطارئة التي تجيز إعادة النظر في الالتزامات التعاقدية تأجيلًا أو فسخًا أو إسقاطًا؛ وللمتضرر في العقود المعطلة إلغاء العقد واستعادة العربون وهامش الجدية أو التصالح على إيقاف التنفيذ مؤقتًا أو تخفيف التزامه؛ ولا أثر للجائحة في الإيجار السكني بعد حصول الانتفاع، وتبقى الأجرة دينًا في ذمة المستأجر المعسر؛ ولا يجوز الإلزام بالشرط الجزائي إذا كانت الجائحة سبب التأخير؛ ويجوز بإشراف الدولة إعادة توزيع الرواتب أو تخفيضها مع تخفيض ساعات العمل بقدر نقص المنفعة؛ ويجوز اللجوء للتأمين التجاري بقدر الحاجة عند عدم توفر التأمين التعاوني الإسلامي؛ ويصلح في المتأخرات المتعثرة بما يقتضي العدل؛ ولما يشبه كورونا من الأوبئة أحكامها. وأوصى بمبادرات إنسانية للتخفيف من آثار الإفلاس ودعم الدول الأقل نموًا والنازحين واللاجئين، وبعطايا الشركات والمصارف والمحسنين."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), as a companion to its resolution 240 (25/2) on the pandemic's effect on worship, family and offences. It ruled that COVID-19 is among the emergency excuses allowing contractual obligations to be revisited by deferral, rescission or discharge; that the injured party in contracts whose conclusion or execution is suspended may cancel and recover the deposit and earnest margin, or agree to suspend execution or reduce their obligation; that the pandemic has no effect on residential rent once the leased property has been used, the rent remaining a debt on the insolvent tenant; that a penalty clause may not be enforced when the pandemic caused the delay; that under state supervision salaries may be redistributed or cut in proportion to reduced working hours and lost benefit; that recourse to commercial insurance is allowed to the extent of need where Islamic cooperative insurance is unavailable; that arrears on financing contracts whose instalments the pandemic disrupted should be settled justly; and that comparable epidemics take the same rulings. It recommended organised humanitarian initiatives against bankruptcy's effects and support for least-developed countries, displaced people and refugees, and donations from companies, banks and benefactors."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی قرارداد 240 ⁦(25/2)⁩ کے تسلسل میں۔ اکیڈمی نے فیصلہ کیا کہ کورونا ان اچانک اذروں میں ہے جو معاہداتی التزامات پر نظرِ ثانی — التوا، فسخ یا اسقاط — کی اجازت دیتے ہیں؛ معطل معاہدوں میں متاثرہ فریق معاہدہ منسوخ کر کے بیعانہ اور جدیت کی رقم واپس لے سکتا ہے یا عبوری التوا یا التزام کی تخفیف پر صلح کر سکتا ہے؛ رہائشی کرایہ پر وبا کا اثر نہیں جب استفادہ ہو چکا ہو، کرایہ معسر کرایہ دار کے ذمہ قرض رہتا ہے؛ جب تاخیر کا سبب وبا ہو تو شرطِ جزائی نافذ نہیں کیا جا سکتا؛ ریاستی نگرانی میں تنخواہوں کی از سرِ نو تقسیم یا کمی کم اوقاتِ کار کے تناسب سے جائز ہے؛ اسلامی تعاونی بیمہ دستیاب نہ ہو تو ضرورت کے مطابق تجارتی بیمہ جائز ہے؛ تعطل شدہ اقساط کا صلح انصاف کے تقاضے سے ہو؛ اور ایسی ہی اوباؤں کو وہی احکام ہیں۔ سفارشات میں دیوالیہ پن کے اثرات کے خلاف انسانی مبادرات، کم ترقی یافتہ ممالک، بے گھر افراد اور مہاجرین کی معاونت، اور کمپنیوں، بینکوں اور نیکوکاروں کے عطیات شامل ہیں۔"
