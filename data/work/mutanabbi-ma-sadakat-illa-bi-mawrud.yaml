label: { ar: "قصيدة المتنبي «ما سدكت علة بمورود» في رثاء تغلب بن داود", en: "Al-Mutanabbi's elegy 'No illness clung to a watering-place' for Taghlib ibn Dawud", es: "La elegía de Al-Mutanabbi, «Ninguna enfermedad se aferró a un abrevadero», dedicada a Taghlib ibn Dawud.", fr: "Élégie d'Al-Mutanabbi « Aucune maladie ne s'accrochait à un point d'eau » pour Taghlib ibn Dawud", ur: "تغلب ابن داؤد کے لیے المتنبی کی تصنیف 'پانی کے مقام سے کوئی بیماری نہیں لگی'", tr: "Al-Mutanabbi'nin Taghlib ibn Davud'un Ağıtı'nda yazdığı \"Bir Kaynakla Sorunu Çözmedim\" şiiri", id: "Puisi Al-Mutanabbi \"Saya Tidak Memperbaiki Masalah dengan Sumber\" dalam Ratapan Taghlib ibn Dawood" }
summary:
  ar: "قصيدة من البسيط على روي الدال للمتنبي، يرثي فيها أبا وائل تغلب بن داود بن حمدان وقد توفي في حمص سنة 338هـ ⁦(949م)⁩ كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.293}}."
  en: "An ode in the basit metre on the rhyme dal by al-Mutanabbi; lamenting Abu Wa'il Taghlib ibn Dawud ibn Hamdan, who died at Homs in 338 AH (949 CE), as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.293}}."
  es: "Una oda en metro basit sobre la rima dal de al-Mutanabbi; lamentando a Abu Wa'il Taghlib ibn Dawud ibn Hamdan, quien murió en Homs en 338 AH (949 d. C.), como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.293}}."
  fr: "Une ode en mètre basit sur la rime dal par al-Mutanabbi; déplorant la mort d'Abu Wa'il Taghlib ibn Dawud ibn Hamdan, décédé à Homs en 338 AH (949 CE), comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.293}}."
  ur: "المتنبی کی شاعری کی دال پر باسط میٹر میں ایک اوڈ؛ ابو وائل تغلب ابن داؤد بن حمدان پر افسوس کا اظہار کرتے ہوئے، جو 338 ہجری ⁦(949 عیسوی)⁩ میں حمص میں فوت ہوئے، جیسا کہ دار بیروت ایڈیشن نے اسے متعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 293}}۔"
  tr: "Al-Mutanabbi'nin Dal Anlatımı üzerine Al-Basit'ten bir şiir; bu şiirde, 338 Hicri (949 M.S.) yılında Homs'ta ölen Ebu Va'il Taghlib ibn Davud ibn Hamdan'a ağıt tutar. Ayrıca Diwan Dar Beyrut tarafından da tanıtılır {{cite:diwan-mutanabbi-dar-beirut-1983 s.293}}."
  id: "Sebuah puisi dari Al-Basit tentang Narasi Dal oleh Al-Mutanabbi, di mana ia meratapi Abu Wa'il Taghlib ibn Dawud ibn Hamdan, yang meninggal di Homs pada tahun 338 H (949 M). Puisi ini juga diperkenalkan oleh Diwan Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.293}}."
