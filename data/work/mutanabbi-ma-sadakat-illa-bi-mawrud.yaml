summary:
  ar: "قصيدة من البسيط على روي الدال للمتنبي، يرثي فيها أبا وائل تغلب بن داود بن حمدان وقد توفي في حمص سنة 338هـ ⁦(949م)⁩ كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.293}}."
  en: "An ode in the basit metre on the rhyme dal by al-Mutanabbi; lamenting Abu Wa'il Taghlib ibn Dawud ibn Hamdan, who died at Homs in 338 AH (949 CE), as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.293}}."
