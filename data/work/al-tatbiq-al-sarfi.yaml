summary:
  ar: "التطبيق الصرفي، كتاب في الصرف والتصريف لمؤلفه عبده الراجحي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نُشر 1973م; ت 2010م {cite:wikipedia-ar-abduh-al-rajihi}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا؛ فالذي في فهرس الشاملة بحسب الملف هو التطبيق النحوي فقط {cite:mr-mas-shamela-nahw-sarf-books}. لم يقرأ المتحف الكتاب."
  en: "al-Tatbiq al-Sarfi, a book on morphology (sarf and tasrif) by Abduh al-Rajihi; its date in a research summary supplied to the museum is pub. 1973 CE; d. 2010 CE {cite:wikipedia-ar-abduh-al-rajihi}. The summary's answer on its presence in the Shamela library: No: according to the file, only al-Tatbiq al-Nahwi is in the Shamela index {cite:mr-mas-shamela-nahw-sarf-books}. The museum has not read the book."
  ur: "التطبيق الصرفي، صرف و تصریف پر ایک کتاب، مصنف عبده الراجحي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: اشاعت 1973ء; وفات 2010ء {cite:wikipedia-ar-abduh-al-rajihi}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق شاملہ کی فہرست میں صرف التطبیق النحوی ہے {cite:mr-mas-shamela-nahw-sarf-books}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Tatbiq al-Sarfi, livre sur la morphologie (sarf et tasrif) de Abduh al-Rajihi ; sa date dans une synthèse de recherche remise au musée : publ. 1973; m. 2010 {cite:wikipedia-ar-abduh-al-rajihi}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : selon le fichier, seul al-Tatbiq al-Nahwi figure dans l'index de Shamela {cite:mr-mas-shamela-nahw-sarf-books}. Le musée n'a pas lu le livre."
  es: "al-Tatbiq al-Sarfi, libro sobre morfología (sarf y tasrif) de Abduh al-Rajihi; su fecha en un resumen de investigación entregado al museo: publ. 1973; m. 2010 {cite:wikipedia-ar-abduh-al-rajihi}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: según el archivo, solo al-Tatbiq al-Nahwi figura en el índice de Shamela {cite:mr-mas-shamela-nahw-sarf-books}. El museo no ha leído el libro."
  tr: "Morfolojik Uygulama, yazarı Abdu Al-Rajhi tarafından morfoloji ve morfoloji üzerine bir kitaptır ve müzeye sunulan bir araştırma özetine göre tarihini anlatır: 1973'te yayımlanmıştır; ö. 2010 {cite:wikipedia-ar-abduh-al-rajihi}. Özetin Kapsamlı Kütüphane'deki varlığına cevabı: Hayır; dosyaya göre Kapsamlı İndeks'te bulunan sadece dilbilgisel uygulama {cite:mr-mas-shamela-nahw-sarf-books}. Müze kitabı okumamıştır."
  id: "Aplikasi Morfologi adalah buku tentang morfologi dan morfologi karya penulisnya Abdu Al-Rajhi, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: diterbitkan pada tahun 1973; wafat 2010 {cite:wikipedia-ar-abduh-al-rajihi}. Jawaban ringkasan atas keberadaannya di Perpustakaan Komprehensif: Tidak; apa yang tercantum dalam Indeks Komprehensif menurut berkas hanyalah aplikasi tata bahasa {cite:mr-mas-shamela-nahw-sarf-books}. Museum tidak membaca buku tersebut."
