summary:
  ar: "دراسة بالإنجليزية لفريد دونر في نشأة الكتابة التاريخية عند المسلمين الأوائل، صدرت عن دار داروين في برينستون سنة 1998 في 358 صفحة ضمن سلسلة دراسات العصور القديمة المتأخرة والإسلام المبكر."
  en: "An English study by Fred M. Donner of the beginnings of historical writing among the early Muslims, published by Darwin Press, Princeton, in 1998 (358 pages) in the Studies in Late Antiquity and Early Islam series."
  ur: "فریڈ ڈونر کا انگریزی مطالعہ جو ابتدائی مسلمانوں میں تاریخ نویسی کے آغاز پر ہے؛ ڈارون پریس، پرنسٹن سے 1998ء میں 358 صفحات میں اسٹڈیز اِن لیٹ اینٹیکویٹی اینڈ ارلی اسلام سلسلے میں شائع ہوا۔"
  es: "Un estudio en inglés de Fred M. Donner sobre los comienzos de la escritura histórica entre los primeros musulmanes, publicado por Darwin Press, Princeton, en 1998 (358 páginas) en la serie Estudios sobre la Antigüedad Tardía y el Islam Temprano."
  fr: "Une étude anglaise de Fred M. Donner sur les débuts de l'écriture historique chez les premiers musulmans, publiée par Darwin Press, Princeton, en 1998 (358 pages) dans la série Studies in Late Antiquity and Early Islam."
  tr: "Fred Donner tarafından erken Müslümanlar arasında tarihsel yazının ortaya çıkışı üzerine İngilizce bir çalışma, 1998'de Princeton'daki Darwin Yayıncılık tarafından yayımlanmış, Geç Antik Çağ ve Erken İslam Çalışmaları serisinin bir parçası olarak 358 sayfa uzunluğundadır."
  id: "Sebuah studi bahasa Inggris oleh Fred Donner tentang kemunculan penulisan sejarah di kalangan Muslim awal, diterbitkan oleh Darwin Publishing House di Princeton pada tahun 1998, mencakup 358 halaman sebagai bagian dari seri Studi Akhir Zaman Kuno dan Islam Awal."
