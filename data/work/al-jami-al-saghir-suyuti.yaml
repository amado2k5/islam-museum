label:
  ar: "الجامع الصغير من حديث البشير النذير"
  en: "al-Jami' al-Saghir min Hadith al-Bashir al-Nadhir"
  ur: "الجامع الصغیر من حدیث البشیر النذیر"
summary:
  ar: "كتاب في الأحاديث الوجيزة لجلال الدين السيوطي ⁦(ت 911هـ)⁩، مرتب على حروف المعجم مراعياً أول الحديث، مقتضب من كتابه الكبير «جمع الجوامع»، مع رموز للمخرّجين، فرغ منه سنة 907هـ كما ينقل النبهاني؛ وجعل له ذيلاً سماه «زيادة الجامع»، وشرحه عبد الرؤوف المناوي في «فيض القدير» {cite:sahih-jami-saghir-maktab-islami-1988 p. 34-36}."
  en: "A collection of short hadiths by Jalal al-Din al-Suyuti (d. 911 AH), in alphabetical order by the opening of each hadith, excerpted from his large Jam' al-Jawami', with sigla for the compilers who transmit each report; al-Nabhani reports that he finished it in 907 AH; he added a supplement, Ziyadat al-Jami', and 'Abd al-Ra'uf al-Munawi commented on it in Fayd al-Qadir {cite:sahih-jami-saghir-maktab-islami-1988 p. 34-36}."
  ur: "جلال الدین سیوطی (وفات 911ھ) کا مختصر احادیث کا مجموعہ، حدیث کے ابتدائی الفاظ کے لحاظ سے حروفِ تہجی کی ترتیب پر، ان کی بڑی کتاب «جمع الجوامع» سے ماخوذ، تخریج کرنے والوں کے رموز کے ساتھ؛ نبہانی کے مطابق وہ اس سے 907ھ میں فارغ ہوئے؛ انہوں نے اس پر «زیادۃ الجامع» نامی ذیل لکھا، اور عبد الرؤوف مناوی نے «فیض القدیر» میں اس کی شرح کی {cite:sahih-jami-saghir-maktab-islami-1988 p. 34-36}۔"
