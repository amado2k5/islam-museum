summary:
  ar: "سائل سأل عن مدى اعتبار خروج الحاضنة للعمل أغلب اليوم من مسقطات الحضانة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21059)⁩ أن العمل في ذاته ليس من مسوغات إسقاط الحضانة وإنما إثبات التقصير في حق الصغير أو إهماله هو المسوغ لإسقاطها على ما فصّل الجواب."
  en: "A questioner asked whether the custodian's going out to work most of the day forfeits custody. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21059) answered that work in itself is not among the grounds for losing custody; what forfeits it is proven neglect of the child — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا سرپرست کا دن بھر کام پر جانا حضانت کا سبب بنتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21059)⁩ نے جواب دیا کہ کام بذات خود حضانت ختم کرنے کا سبب نہیں بلکہ بچے کی طرف ثابت شدہ کوتاہی وہ سبب ہے — جیسا کہ جواب میں تفصیل ہے۔"
