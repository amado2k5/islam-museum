id: work/fatwa-amja-convincing-someone-of-islam
class: work
kind: fatwa
label: { ar: "كيف ندعو إلى الإسلام", en: "How to call a person to Islam", ur: "اسلام کی دعوت کا طریقہ", es: "Cómo invitar a una persona al Islam", fr: "Comment appeler une personne à l'islam" }
summary:
  ar: "سأل سائل كيف يمكننا إقناع شخص بالإسلام. أجاب د. حاتم الحاج ⁦(فتوى رقم 21838 بتاريخ 14 مايو 2006)⁩ بجملة عملية: الاستعانة بالله فقلوب العباد بين إصبعيه، وأن حسن الخلق قد يكون أبلغ بمائة مرة من الكلام، وإظهار ضعف وتناقض ما هو عليه من معتقدات، والتعريف بالإسلام وجماله وشموليته وإحكامه، والتعريف برسول الله وسيرته العطرة ومعجزاته، ونصحه بمطالعة المواقع الإسلامية المختلفة للمزيد من التفصيل عن كل عنصر."
  en: "A questioner asked how to convince a person of Islam. Dr. Hatim al-Hajj (fatwa no. 21838, 14 May 2006) gave a practical list: seek God's help — servants' hearts are between His two fingers; good character may speak a hundred times louder than words; show the weakness and contradiction of what he holds; introduce Islam's beauty, comprehensiveness and soundness; introduce the Messenger of God, his fragrant life and his miracles — and consult the Islamic sites for more detail on each point."
  ur: "ایک سائل نے اسلام کی دعوت کا طریقہ پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21838، 14 مئی 2006)⁩ کے مطابق اللہ سے مدد، اچھا اخلاق، موجودہ عقیدے کی کمزوری ظاہر کرنا، اسلام اور سیرت کا تعارف۔"
  es: "Un interlocutor preguntó cómo convencer a una persona del Islam. El Dr. Hatim al-Hajj (fatwa n.º 21838, 14 de mayo de 2006) ofreció una lista práctica: buscar la ayuda de Dios —los corazones de los siervos están entre Sus dedos—; el buen carácter puede hablar cien veces más alto que las palabras; mostrar la debilidad y la contradicción de sus creencias; presentar la belleza, la exhaustividad y la solidez del Islam; presentar al Mensajero de Dios, su vida ejemplar y sus milagros; y consultar los sitios web islámicos para obtener más detalles sobre cada punto."
  fr: "Un internaute a demandé comment convaincre quelqu'un de se convertir à l'islam. Le Dr Hatim al-Hajj (fatwa n° 21838, 14 mai 2006) a donné une liste pratique: implorer l'aide de Dieu – le cœur des serviteurs est entre Ses mains; une bonne conduite vaut mille mots; démontrer les faiblesses et les contradictions de ses croyances; présenter la beauté, la richesse et la solidité de l'islam; présenter le Messager de Dieu, sa vie exemplaire et ses miracles – et consulter des sites islamiques pour approfondir chaque point."
