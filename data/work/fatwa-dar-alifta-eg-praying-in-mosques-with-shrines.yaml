label: { ar: "حكم الصلاة في المساجد التي بها أضرحة وحكم بناء الأضرحة", en: "Praying in mosques containing tombs, and building tombs", ur: "مزارات والی مسجدوں میں نماز اور مزار بنانا" }
summary:
  ar: "سائل سأل عن الصلاة في المساجد التي بها أضرحة وحكم بناء الأضرحة والدعاء عندها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20907)⁩ أن بناء الأضرحة جائز شرعًا والذهاب إلى هذه الأماكن والدعاء إلى الله عندها مستحب ولا حرج فيه على ما فصّل الجواب."
  en: "A questioner asked about praying in mosques containing tombs, building tombs, and supplicating at them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20907) answered that building tombs is lawful, and going to such places and supplicating to God there is recommended without blame — as the answer details."
  ur: "ایک سائل نے مزاروں والی مسجدوں میں نماز، مزار بنانے اور وہاں دعا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20907)⁩ نے جواب دیا کہ مزار بنانا جائز ہے اور وہاں جا کر اللہ سے دعا کرنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
