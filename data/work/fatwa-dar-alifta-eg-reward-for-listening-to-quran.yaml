summary:
  ar: "سائل سأل عن ثواب سماع القرآن الكريم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21705)⁩ أن قراءة القرآن أو الاستماع لتلاوته كلاهما من أفضل العبادات وأكدت نصوص الشرع فضلهما وثوابهما على ما فصّل الجواب."
  en: "A questioner asked about the reward for listening to the Qur'an. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21705) answered that reading the Qur'an and listening to its recitation are both among the best of worship, whose merit and reward the sharia's texts affirm — as the answer details."
  ur: "ایک سائل نے قرآن سننے کا ثواب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21705)⁩ نے جواب دیا کہ قرآن پڑھنا اور اس کی تلاوت سننا دونوں بہترین عبادات ہیں جن کے فضائل شرعی نصوص نے بیان کیے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la recompensa por escuchar el Corán. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21705) respondió que leer el Corán y escuchar su recitación se encuentran entre las mejores formas de adoración, cuyo mérito y recompensa afirman los textos de la sharia, como se detalla en la respuesta."
