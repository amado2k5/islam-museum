summary:
  ar: "موقع إلكتروني فلسطيني إخباري حواري تفاعلي أسسه شباب فلسطينيون سنة 2001، شعاره «صوت فلسطين إلى العالم وصوت العالم إلى فلسطين»؛ تصفه ويكيبيديا العربية بأنه إسلامي الانتماء ومرتبط بالمركز الفلسطيني للإعلام، وتقول الشبكة إنها لا تتبنى موقفًا حزبيًا؛ وتذكر أن أكثر من خمسين من أعضائها قُتلوا بنيران الجيش الإسرائيلي حتى حرب غزة 2014."
  en: "A Palestinian interactive news and discussion website founded by young Palestinians in 2001 under the motto 'the voice of Palestine to the world and the voice of the world to Palestine'; Arabic Wikipedia describes it as Islamic in affiliation and linked to the Palestinian Information Center, while the network says it takes no party position; it says more than fifty of its members had been killed by the Israeli army by the 2014 Gaza war."
  ur: "فلسطینی خبری و مباحثی تفاعلی ویب سائٹ جسے فلسطینی نوجوانوں نے 2001 میں قائم کیا، نعرہ «دنیا تک فلسطین کی آواز اور فلسطین تک دنیا کی آواز»؛ عربی ویکیپیڈیا اسے اسلامی وابستگی والی اور فلسطینی انفارمیشن سینٹر سے منسلک کہتا ہے، جبکہ شبکہ خود کو غیر جماعتی کہتا ہے؛ اس کے بقول 2014 کی غزہ جنگ تک اس کے پچاس سے زیادہ اراکین اسرائیلی فوج کے ہاتھوں مارے گئے۔"
