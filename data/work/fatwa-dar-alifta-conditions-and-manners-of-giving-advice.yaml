id: work/fatwa-dar-alifta-conditions-and-manners-of-giving-advice
class: work
kind: fatwa
label: { ar: "شروط النصيحة وضوابطها", en: "The conditions and manners of giving advice (nasiha)", ur: "نصیحت کی شرائط اور ضوابط" }
summary:
  ar: "سؤال من رجل رفع أخوه الصغير صوته على أخيهم الأكبر أثناء تشاور عائلي ويرغب في نصحه، عن الشروط والضوابط التي يلتزم بها عند النصيحة، أجابت فيه دار الإفتاء المصرية بأن نصحه من محاسن الأخلاق ومقتضيات التناصح المشروع، على أن يراعي فيه أن تكون النصيحة خالصة لله، وأن تؤدى سرًّا ما أمكن صيانة لكرامة المنصوح، وبلطف ورفق وعبارة مناسبة دون تعيير، وألا تكون مشروطة بقبوله، وألا يترتب عليها ضرر معتبر في الحاضر أو المستقبل. بيّنت الدار منزلة النصيحة بتعريف الجرجاني والنسفي وحديث الدين النصيحة وحديث حق المسلم على المسلم، وعرضت قولين في حكمها: وجوبها مطلقًا عينًا أو كفاية كما قال ابن بطال والعيني والنفراوي والعدوي، أو التفريق بين الندب ابتداءً والوجوب عند الاستنصاح كما قال ابن عاشور. ثم فصّلت الضوابط مستدلة بحديث إنما الأعمال بالنيات، وبأقوال الشافعي وسفيان بن عيينة وابن قدامة وابن رجب وابن حجر في الإسرار بالنصيحة، وبسنة النبي في التعريض بقوله ما بال أقوام كما في قصة بريرة، وبكلام ابن حزم في الأخلاق والسير في التعريض وعدم اشتراط القبول، وبحديث الرفق وكلام النفراوي، وبقاعدة لا ضرر ولا ضرار عند الشاطبي والزركشي وما قاله ابن بطال في سقوطها عند خشية الأذى."
  en: "A question from a man whose younger brother raised his voice at their eldest brother during a family consultation and who wishes to advise him, asking what conditions and rules he must observe in giving the advice; Dar al-Ifta al-Misriyya answered that advising him is among the finest of manners and part of the lawful mutual counsel that sharia encourages, provided the advice is sincerely for God, given in private wherever possible to protect the dignity of the person advised, offered gently and kindly in suitable words without shaming, not made conditional on his acceptance, and not productive of appreciable harm now or later. Dar al-Ifta set out the standing of advice through the definitions of al-Jurjani and al-Nasafi, the hadith that religion is sincere counsel and the hadith on a Muslim's rights over a Muslim, and presented two views on its ruling: that it is obligatory in all cases, whether individually or collectively, as Ibn Battal, al-Ayni, al-Nafrawi and al-Adawi hold, or that unsolicited advice is recommended while advice that is asked for becomes obligatory, as Ibn Ashur holds. It then detailed the rules, citing the hadith that deeds are judged by intentions; the sayings of al-Shafi'i, Sufyan ibn Uyayna, Ibn Qudama, Ibn Rajab and Ibn Hajar on giving advice in private; the Prophet's practice of indirect reproof with the words 'what is the matter with people who...', as in the story of Barira; Ibn Hazm's words in al-Akhlaq wa-l-Siyar on indirect speech and on not making acceptance a condition; the hadith on gentleness and al-Nafrawi's remarks; and the rule that there is no harm and no reciprocating harm, cited from al-Shatibi and al-Zarkashi, with Ibn Battal's statement that the duty lapses when harm is feared."
  ur: "ایک شخص کا سوال جس کے چھوٹے بھائی نے خاندانی مشاورت کے دوران سب سے بڑے بھائی پر آواز بلند کی اور وہ اسے نصیحت کرنا چاہتا ہے، کہ نصیحت کرتے وقت کون سی شرائط اور ضوابط کی پابندی کرے؛ دار الافتاء مصر نے جواب دیا کہ اسے نصیحت کرنا بہترین اخلاق اور اس مشروع باہمی نصیحت کے تقاضوں میں سے ہے جس کی شریعت نے ترغیب دی، بشرطیکہ نصیحت خالص اللہ کے لیے ہو، جہاں تک ممکن ہو خلوت میں دی جائے تاکہ نصیحت کیے جانے والے کی عزت محفوظ رہے، نرمی اور شفقت سے مناسب الفاظ میں بغیر شرمندہ کرنے کے پیش کی جائے، اس کے قبول کرنے پر مشروط نہ ہو، اور اس سے حال یا مستقبل میں کوئی معتبر نقصان نہ ہو۔ دار الافتاء نے نصیحت کا مقام جرجانی اور نسفی کی تعریف، حدیث 'دین نصیحت ہے' اور مسلمان کے مسلمان پر حقوق کی حدیث سے بیان کیا، اور اس کے حکم میں دو قول پیش کیے: ہر صورت میں واجب، عینی یا کفائی، جیسا کہ ابن بطال، عینی، نفراوی اور عدوی کہتے ہیں، یا یہ فرق کہ بن مانگی نصیحت مستحب اور مانگی گئی نصیحت واجب ہے، جیسا کہ ابن عاشور کہتے ہیں۔ پھر اس نے ضوابط کی تفصیل کی، حدیث 'اعمال نیتوں سے ہیں' سے؛ شافعی، سفیان بن عیینہ، ابن قدامہ، ابن رجب اور ابن حجر کے خلوت میں نصیحت کے اقوال سے؛ نبی کی 'ما بال اقوام' کے الفاظ سے بالواسطہ تنبیہ کی سنت سے جیسے بریرہ کے قصے میں؛ ابن حزم کے الاخلاق والسیر میں کنایے اور قبول کی شرط نہ لگانے کے الفاظ سے؛ نرمی کی حدیث اور نفراوی کے کلام سے؛ اور شاطبی اور زرکشی کے نقل کردہ قاعدہ لا ضرر ولا ضرار اور ابن بطال کے اس قول سے کہ اذیت کے خوف پر یہ فریضہ ساقط ہو جاتا ہے۔"
