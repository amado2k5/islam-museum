label: { ar: "قراءة الحائض للقرآن", en: "The menstruant reading the Qur'an — the schools weighed", ur: "حائضہ کا قرآن پڑھنا — اقوال", es: "La menstruante leyendo el Corán: las escuelas sopesaron", fr: "La femme menstruée lisant le Coran — les écoles pesaient", tr: "Regl kadının Kur'an'ı okuması", id: "Pembacaan Al-Qur'an oleh wanita yang sedang menstruasi" }
summary:
  ar: "سألت امرأة هل يجوز قراءة القرآن غيبًا للحائض وقراءة السور المأثورة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23234 بتاريخ 1 يوليو 2008)⁩ أن أهل العلم اختلفوا في قراءة الحائض للقرآن فذهب جماعة إلى تحريم ذلك وألحقوها بالجنب وذهب آخرون إلى جواز قراءتها لها دون مس المصحف والراجح عنده الجواز للحاجة إذ قد يطول أمد الحيض والنفاس على ما فصّل الجواب من ذكر الأقوال وأدلتها."
  en: "A woman asked whether a menstruant may read the Qur'an from memory and the transmitted suras. Dr. Salah al-Sawi (fatwa no. 23234, 1 July 2008) answered that the scholars disagreed: a party forbade it and annexed her to the junub person, others permitted her reading without touching the mushaf; what preponderates for him is permission for the need — menses and postpartum possibly running long — the answer marshalling the positions and their proofs."
  ur: "حائضہ قرآن پڑھ سکتی ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23234، 1 جولائی 2008)⁩ کے مطابق اقوال مختلف ہیں؛ راجح مصحف چھوئے بغیر پڑھنے کی اجازت ہے۔"
  es: "Una mujer preguntó si una mujer menstruante puede leer el Corán de memoria y las suras transmitidas. El Dr. Salah al-Sawi (fatwa n.° 23234, 1 de julio de 2008) respondió que los eruditos discrepaban: algunos lo prohibían y la consideraban en estado de impureza ritual (junub), otros le permitían leer sin tocar el mushaf. Lo que prevalece para él es el permiso para la necesidad —la menstruación y el posparto, posiblemente prolongados—, la respuesta recogiendo las posturas y sus pruebas."
  fr: "Une femme a demandé si une femme indisposée pouvait lire le Coran de mémoire et les sourates transmises. Le Dr Salah al-Sawi (fatwa n° 23234, 1er juillet 2008) a répondu que les savants étaient partagés: certains l’interdisaient et la considéraient comme impure, d’autres l’autorisaient à lire sans toucher au mushaf. Pour lui, l’avis prévalait en raison du besoin – menstruations et suites de couches pouvant être prolongées – et sa réponse rassemblait les différentes positions et leurs arguments."
  tr: "Bir kadına, regl kadın yokken Kur'an okumanın ve aktarılan surelerin okunmasının caiz olup olmadığı soruldu. Dr. Salah Al-Sawi, (1 Temmuz 2008 tarihli 23234 No. Fetva) alimlerin regl kadınların Kur'an okuma konusundaki görüşlerinde farklı görüşler olduğunu yanıtladı. Bazıları Kur'an'ı yasak bulup cenabeye (janabe) ekledi, bazıları ise Mushaf'a dokunmadan okunmasına izin verdi. Tercih edilen görüş, bunun zorunluluk nedeniyle izin verildiğidir; çünkü adet süresi ve doğum sonrası kanamanın süresi uzabiliyor, bu da cevabın ve kanıtlarla ilgili verilen yanıtta ayrıntılı olarak belirtilmiştir."
  id: "Seorang wanita ditanya apakah diperbolehkan membaca Al-Quran tanpa kehadiran wanita yang sedang menstruasi dan membaca surah yang disampaikan. Dr. Salah Al-Sawi menjawab (Fatwa No. 23234 tanggal 1 Juli 2008) bahwa para ulama berbeda pendapat mengenai pembacaan Al-Qur'an oleh wanita yang sedang menstruasi. Beberapa menganggapnya terlarang dan melampirkannya pada janabah (janabah), sementara yang lain mengizinkan membacanya tanpa menyentuh Mushaf. Pandangan yang dipilih adalah bahwa hal ini diperbolehkan karena kebutuhan, karena durasi menstruasi dan pendarahan pasca persalinan dapat diperpanjang, sebagaimana dijelaskan dalam jawaban mengenai pernyataan dan buktinya."
