label: { ar: "قراءة الحائض للقرآن", en: "The menstruant reading the Qur'an — the schools weighed", ur: "حائضہ کا قرآن پڑھنا — اقوال" }
summary:
  ar: "سألت امرأة هل يجوز قراءة القرآن غيبًا للحائض وقراءة السور المأثورة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23234 بتاريخ 1 يوليو 2008)⁩ أن أهل العلم اختلفوا في قراءة الحائض للقرآن فذهب جماعة إلى تحريم ذلك وألحقوها بالجنب وذهب آخرون إلى جواز قراءتها لها دون مس المصحف والراجح عنده الجواز للحاجة إذ قد يطول أمد الحيض والنفاس على ما فصّل الجواب من ذكر الأقوال وأدلتها."
  en: "A woman asked whether a menstruant may read the Qur'an from memory and the transmitted suras. Dr. Salah al-Sawi (fatwa no. 23234, 1 July 2008) answered that the scholars disagreed: a party forbade it and annexed her to the junub person, others permitted her reading without touching the mushaf; what preponderates for him is permission for the need — menses and postpartum possibly running long — the answer marshalling the positions and their proofs."
  ur: "حائضہ قرآن پڑھ سکتی ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23234، 1 جولائی 2008)⁩ کے مطابق اقوال مختلف ہیں؛ راجح مصحف چھوئے بغیر پڑھنے کی اجازت ہے۔"
