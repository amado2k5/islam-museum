id: work/fatwa-dar-alifta-eg-seclusion-with-divorcer-during-idda
class: work
kind: fatwa
label: { ar: "حكم الخلوة بين المرأة والمطلق أثناء فترة العدة", en: "Seclusion between a woman and her divorcer during 'idda", ur: "عدت کے دوران عورت اور مطلق کا خلوت", es: "Aislamiento entre una mujer y su exmarido durante el 'iddah'.", fr: "Isolement entre une femme et son ex-mari pendant la période de divorce", tr: "Bekleme süresi boyunca kadın ile boşanmış koca arasındaki inzivaya ilişkin karar", id: "Putusan tentang pengasingan antara seorang wanita dan suami yang telah bercerai selama masa tunggu" }
summary:
  ar: "سائلة سألت عن جلوس مطلقها معها لرؤية طفلهما أثناء العدة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21822)⁩ أنه لا مانع شرعًا من جلوس المطلق مع مطلقته البائن لرؤية طفلهما شريطة عدم الخلوة بينهما إذ هي أجنبية عنه على ما فصّل الجواب."
  en: "A divorced woman asked about her divorcer sitting with her to see their child during 'idda. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21822) answered that there is no sharia barrier to the divorcer sitting with his irrevocably divorced ex-wife to see their child — provided there is no seclusion between them, since she is now a non-mahram to him — as the answer details."
  ur: "ایک مطلقہ عورت نے پوچھا کہ عدت کے دوران اس کا سابق شوہر بچے سے ملنے کے لیے اس کے ساتھ بیٹھ سکتا ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21822)⁩ نے جواب دیا کہ طلاق دینے والے کا بائن مطلقہ کے ساتھ بچے سے ملنے کے لیے بیٹھنا جائز ہے بشرطیکہ خلوت نہ ہو کیونکہ وہ اب اس کی اجنبی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer divorciada preguntó si su exmarido podía sentarse con ella para ver a su hijo durante el período de 'idda. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21822) respondió que no existe ningún impedimento por la sharia para que el divorciado se siente con su exesposa, de la que está irrevocablemente divorciado, para ver a su hijo, siempre que no haya aislamiento entre ellos, ya que ella ahora no es una mahram para él, como se detalla en la respuesta."
  fr: "Une femme divorcée a demandé si son ex-mari pouvait s'asseoir avec elle pour voir leur enfant pendant la période de 'idda. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21822) a répondu qu'il n'y a pas d'obstacle islamique à ce que l'homme divorcé s'assoie avec son ex-femme, dont le divorce est irrévocable, pour voir leur enfant, à condition qu'il n'y ait pas d'isolement entre eux, puisqu'elle n'est plus un mahram pour lui, comme le précise la réponse."
  tr: "Bir soru soran kişi, bekleme süresi boyunca eski eşinin çocuklarını görmek için yanında oturduğunu sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21822), boşanmış bir adamın boşanmış eşiyle birlikte çocuğunu görmek için oturmasına dini bir itiraz olmadığını, çünkü karısının ona yabancı olduğunu belirtti."
  id: "Seorang penanya menanyakan tentang mantan suaminya yang duduk bersamanya untuk melihat anak mereka selama masa tunggu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21822) menjawab bahwa tidak ada keberatan agama bagi seorang pria yang bercerai duduk bersama istrinya yang bercerai untuk melihat anaknya, asalkan tidak ada pengasingan di antara mereka, karena dia adalah orang asing baginya, seperti yang dijelaskan dalam jawaban."
