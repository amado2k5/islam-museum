summary:
  ar: "سؤال عن الموقف الإسلامي من التبرع بالأعضاء وزراعتها. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر أكتوبر 2021)⁩ بأنه يوافق كثيرًا من العلماء والمجالس الإفتائية الوطنية والدولية على اعتبار التبرع بالأعضاء وزراعتها جائزًا شرعًا على ما فصّل الجواب من الضوابط."
  en: "A question about the Islamic stance on organ donation and transplantation. The Fiqh Council of North America (published October 2021) answered that it agrees with many scholars and national and international fatwa councils in considering it Islamically permissible — with the conditions set out in the answer."
  ur: "اعضا کے عطیہ اور پیوند کاری کا اسلامی حکم۔ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ اکتوبر 2021)⁩ نے جواب دیا کہ یہ بہت سے علماء اور مجالس کی طرح جائز قرار دیتا ہے — شرائط جواب میں ہیں۔"
  es: "Una pregunta sobre la postura islámica respecto a la donación y el trasplante de órganos. El Consejo de Jurisprudencia Islámica de Norteamérica (publicado en octubre de 2021) respondió que coincide con muchos eruditos y consejos de fatuas nacionales e internacionales al considerarlo permisible desde el punto de vista islámico, con las condiciones que se detallan en la respuesta."
