label: { ar: "في التبرع بالأعضاء وزراعتها", en: "On Organ Donation and Transplantation", ur: "اعضا کے عطیہ اور پیوند کاری پر", es: "Sobre la donación y el trasplante de órganos", fr: "Sur le don et la transplantation d'organes", tr: "Organ bağışı ve naklinde", id: "Dalam donasi dan transplantasi organ" }
summary:
  ar: "سؤال عن الموقف الإسلامي من التبرع بالأعضاء وزراعتها. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر أكتوبر 2021)⁩ بأنه يوافق كثيرًا من العلماء والمجالس الإفتائية الوطنية والدولية على اعتبار التبرع بالأعضاء وزراعتها جائزًا شرعًا على ما فصّل الجواب من الضوابط."
  en: "A question about the Islamic stance on organ donation and transplantation. The Fiqh Council of North America (published October 2021) answered that it agrees with many scholars and national and international fatwa councils in considering it Islamically permissible — with the conditions set out in the answer."
  ur: "اعضا کے عطیہ اور پیوند کاری کا اسلامی حکم۔ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ اکتوبر 2021)⁩ نے جواب دیا کہ یہ بہت سے علماء اور مجالس کی طرح جائز قرار دیتا ہے — شرائط جواب میں ہیں۔"
  es: "Una pregunta sobre la postura islámica respecto a la donación y el trasplante de órganos. El Consejo de Jurisprudencia Islámica de Norteamérica (publicado en octubre de 2021) respondió que coincide con muchos eruditos y consejos de fatuas nacionales e internacionales al considerarlo permisible desde el punto de vista islámico, con las condiciones que se detallan en la respuesta."
  fr: "Une question portait sur la position de l'islam concernant le don et la transplantation d'organes. Le Conseil de jurisprudence islamique d'Amérique du Nord (publication d'octobre 2021) a répondu qu'il partageait l'avis de nombreux érudits et conseils de fatwas nationaux et internationaux en considérant cela comme permis par l'islam, sous réserve des conditions énoncées dans la réponse."
  tr: "Organ bağışı ve nakli konusundaki İslami tutum hakkında bir soru. Kuzey Amerika Fiqh Konseyi (Ekim 2021'de yayımlandı), birçok alim ile ulusal ve uluslararası fetva konseyinin, ayrıntılı düzenlemelere dayanarak organ bağışı ve naklinin dini olarak izin verilebilir olduğu konusunda hemfikir olduğunu yanıtladı."
  id: "Sebuah pertanyaan tentang sikap Islam terhadap donor dan transplantasi organ. Dewan Fiqh Amerika Utara (diterbitkan Oktober 2021) menanggapi bahwa banyak ulama serta dewan fatwa nasional dan internasional sepakat bahwa donasi dan transplantasi organ diperbolehkan secara agama, berdasarkan peraturan rinci yang ada."
