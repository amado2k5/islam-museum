id: work/fatwa-dar-alifta-eg-intention-required-at-udhiyya-slaughter
class: work
kind: fatwa
label: { ar: "مدى اشتراط النية عند ذبح الأضحية وموقف من لم يعقد النية لها من أول ذي الحجة", en: "Whether intention is required at the sacrifice's slaughter", ur: "قربانی کے ذبح پر نیت کی شرط" }
summary:
  ar: "سائل سأل عن اشتراط النية عند ذبح الأضحية وموقف من لم يعقد النية لها من أول ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20697)⁩ أن الأضحية تجزئ ما دام المضحي مستحضرًا النية حال الذبح ولا يشترط أن يعقدها من أول ذي الحجة على ما فصّل الجواب."
  en: "A questioner asked whether intention is a condition at the sacrifice's slaughter and the position of one who did not form it from the first of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20697) answered that the udhiyya suffices so long as the sacrificer holds the intention at slaughter; forming it from the first of Dhu'l-Hijja is not required — as the answer details."
  ur: "ایک سائل نے قربانی کے ذبح پر نیت کی شرط اور ذوالحجہ کی پہلی سے نیت نہ کرنے والے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20697)⁩ نے جواب دیا کہ ذبح کے وقت نیت ہو تو قربانی کافی ہے اور پہلی ذوالحجہ سے نیت شرط نہیں — جیسا کہ جواب میں تفصیل ہے۔"
