id: work/fatwa-dar-alifta-eg-intention-required-at-udhiyya-slaughter
class: work
kind: fatwa
label: { ar: "مدى اشتراط النية عند ذبح الأضحية وموقف من لم يعقد النية لها من أول ذي الحجة", en: "Whether intention is required at the sacrifice's slaughter", ur: "قربانی کے ذبح پر نیت کی شرط", es: "Si se requiere intención en el sacrificio", fr: "La question de savoir si l'intention est requise lors du sacrifice", tr: "Kurbanı kesirken niyet gerekliliğinin kapsamı ve Hicce'nin başından itibaren niyet yapmayanların durumu", id: "Tingkat persyaratan niat saat membantai korban dan posisi mereka yang tidak membuat niat sejak awal Dhu al-Hijjah" }
summary:
  ar: "سائل سأل عن اشتراط النية عند ذبح الأضحية وموقف من لم يعقد النية لها من أول ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20697)⁩ أن الأضحية تجزئ ما دام المضحي مستحضرًا النية حال الذبح ولا يشترط أن يعقدها من أول ذي الحجة على ما فصّل الجواب."
  en: "A questioner asked whether intention is a condition at the sacrifice's slaughter and the position of one who did not form it from the first of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20697) answered that the udhiyya suffices so long as the sacrificer holds the intention at slaughter; forming it from the first of Dhu'l-Hijja is not required — as the answer details."
  ur: "ایک سائل نے قربانی کے ذبح پر نیت کی شرط اور ذوالحجہ کی پہلی سے نیت نہ کرنے والے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20697)⁩ نے جواب دیا کہ ذبح کے وقت نیت ہو تو قربانی کافی ہے اور پہلی ذوالحجہ سے نیت شرط نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si la intención es una condición para el sacrificio y cuál es la situación de quien no la formó desde el primer día de Dhu'l-Hijja. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20697) respondió que la udhiyya es suficiente siempre que quien realiza el sacrificio mantenga la intención; no es necesario formarla desde el primer día de Dhu'l-Hijja, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'intention était une condition nécessaire au sacrifice et quelle était la position de celui qui ne l'avait pas formée dès le premier jour de Dhu al-Hijja. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20697) a répondu que l'udhiyya suffit tant que le sacrificateur a l'intention au moment du sacrifice; la former dès le premier jour de Dhu al-Hijja n'est pas requis, comme le précise la réponse."
  tr: "Bir soru soran kişi, kurbanın katliamında niyet şartı ve Zhu-Hicce'nin başından itibaren niyet yapmayanların konumu hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20697), kurbanın kurbanın kesim anında niyeti aklında tutması halinde geçerli olduğunu ve Zhu-Hicce'nin başından itibaren bunu yapmak zorunda olmadığını cevapta belirtmiştir."
  id: "Seorang penanya menanyakan tentang persyaratan niat saat menyembelih korban dan posisi mereka yang tidak merencanakannya sejak awal Dhu al-Hijjah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20697) menjawab bahwa korban itu sah selama pengorbanan memiliki niat tersebut pada saat penyembelihan, dan tidak diwajibkan melakukannya sejak awal Dhu al-Hijjah, seperti yang dijelaskan dalam jawaban."
