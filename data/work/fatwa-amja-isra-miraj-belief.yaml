label: { ar: "الإسراء والمعراج وحدود الإنكار", en: "Al-Isra and al-Mi'raj — the bounds of denial", ur: "اسراء و معراج اور انکار کی حد", es: "Al-Isra y al-Mi'raj: los límites de la negación", fr: "Al-Isra et al-Mi'raj — les limites du déni", tr: "İsra, Mi'raj ve İnkarın Sınırları", id: "Isra, Mi'raj, dan Batas-batas Penyangkalan" }
summary:
  ar: "سأل سائل هل الإسراء والمعراج مما علم من الدين بالضرورة وهل منكره كافر وما حكم من اعتبره رؤية منامية وهل صح عن عائشة ومعاوية وحذيفة أنه كان بالروح. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23427 بتاريخ 31 يوليو 2008)⁩ أن منكر أصل الإسراء والمعراج كافر بإجماع المسلمين لأن الله جعله قرآنًا يتلى، أما من زعم أنه كان رؤيا منامية فقد خالف الحق وجانب الصواب ولكنه لا يكفر لأن هذا مما اختلف فيه الناس وهو من دقائق العلم التي قد يجهلها بعض العامة، وقد نقل عن عائشة ومعاوية أن ذلك كان بالروح ولم يفقد جسده لكن فرق بين من يقول كان بالروح فقط ومن يقول كان منامًا فعائشة ومعاوية لم يقولا كان منامًا وإنما قالا أسري بروحه ولم يفقد جسده."
  en: "A questioner asked whether the Isra and Mi'raj is religiously necessary knowledge, whether denying it is disbelief, the ruling on calling it a dream-vision, and whether Aisha, Mu'awiya and Hudhayfa really said it was by the spirit. Dr. Salah al-Sawi (fatwa no. 23427, 31 July 2008) answered that the denier of the Isra and Mi'raj itself is a disbeliever by the Muslims' consensus, God having made it recited Qur'an; one claiming it a dream errs and misses the right but is not a disbeliever — the matter was disputed and belongs to knowledge's subtleties some common folk miss; Aisha and Mu'awiya reported it by the spirit without his body being lost — but saying 'by the spirit only' differs from saying 'a dream': they did not say dream, they said 'he was carried by his spirit; his body was not lost'."
  ur: "ایک سائل نے اسراء و معراج کے انکار کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23427، 31 جولائی 2008)⁩ کے مطابق اصل معراج کا منکر اجماع سے کافر ہے؛ خواب کہنے والا غلطی پر ہے مگر کافر نہیں — عائشہ و معاویہ نے روح کا سفر کہا خواب نہیں۔"
  es: "Un interlocutor preguntó si el Isra y el Mi'raj son conocimiento religiosamente necesario, si negarlo es incredulidad, cuál es el dictamen sobre llamarlo visión onírica y si Aisha, Mu'awiya y Hudhayfa realmente dijeron que fue por medio del espíritu. El Dr. Salah al-Sawi (fatwa n.° 23427, 31 de julio de 2008) respondió que quien niega el Isra y el Mi'raj es un incrédulo según el consenso de los musulmanes, ya que Dios lo hizo recitado en el Corán; quien afirma que es un sueño se equivoca y no es correcto, pero no es un incrédulo; el asunto fue disputado y pertenece a las sutilezas del conocimiento que algunas personas comunes pasan por alto; Aisha y Mu'awiya lo relataron por medio del espíritu sin que su cuerpo se perdiera, pero decir \"solo por el espíritu\" difiere de decir \"un sueño\": no dijeron sueño, dijeron \"fue llevado por su espíritu; su cuerpo no se perdió\"."
  fr: "Un internaute a demandé si l'Isra et le Mi'raj constituent une connaissance religieusement nécessaire, si les nier relève de l'incroyance, ce qu'il en est de la qualification de rêve ou de vision, et si Aïcha, Mu'awiya et Hudhayfa ont réellement affirmé qu'ils avaient été transmis par l'esprit. Le Dr Salah al-Sawi (fatwa n° 23427, 31 juillet 2008) a répondu que, selon le consensus musulman, celui qui nie l'Isra et le Mi'raj est un incroyant, Dieu ayant fait réciter le Coran; celui qui prétend qu'il s'agit d'un rêve se trompe et manque la vérité, mais n'est pas un incroyant – la question a fait l'objet de controverses et relève des subtilités du savoir qui échappent à certains profanes; Aïcha et Mu'awiya ont rapporté que l'Isra et le Mi'raj avaient été transmis par l'esprit sans que le corps de l'ange ne soit perdu – mais dire « par l'esprit seulement » diffère de dire « un rêve »: ils n'ont pas parlé de rêve, ils ont dit « il a été transporté par son esprit; son corps n'a pas été perdu »."
  tr: "Bir soruya şöyle soruldu: İsra ve Mi'raj dinin bir parçası olarak bilinir mi? İnkar eden kâfir midir? Rüya vizyonu olarak görenler hakkında karar nedir? Aisha, Muaviye ve Hudhaifa tarafından ruhta olduğu doğrudur mu? Dr. Salah Al-Sawy (31 Temmuz 2008 tarihli 23427 No. fetva) İsrail ve Mi'raj'ın kökenini reddedenin Müslümanlar arasında oybirliğiyle inanmadığını, çünkü Allah'ın Kur'an'ı okunacak bir kuran yaptığını yanıtladı. Rüya vizyonu olduğunu iddia edenler ise gerçeği ve doğru tarafı terhalediyor, ancak kâfir sayılmazlar çünkü bu, halkın bazılarının bilmediği ince bilgilerden biridir. Aişe ve Muaviye'den rivayet edilmiştir ki, bu ruh tarafından yapılmıştır ve bedenini kaybetmemiştir."
  id: "Seorang penanya ditanya: Apakah Isra dan Mi'raj bagian dari agama ini memang sudah diketahui? Apakah orang yang menyangkalnya adalah kafir? Apa putusan mereka yang menganggapnya sebagai penglihatan mimpi? Apakah benar dari Aisha, Muawiyah, dan Hudhaifa bahwa itu ada dalam jiwa? Dr. Salah Al-Sawy menjawab (Fatwa No. 23427 tanggal 31 Juli 2008) bahwa orang yang menyangkal asal-usul Isra dan Mi'raj adalah kafir bulat di kalangan Muslim karena Allah menjadikan Al-Quran untuk dibaca. Adapun mereka yang mengklaim itu adalah penglihatan mimpi, mereka bertentangan dengan kebenaran dan sisi yang benar, tetapi mereka tidak dianggap kafir karena ini adalah pengetahuan halus yang mungkin tidak diketahui oleh sebagian masyarakat umum. Dinawayatkan dari Aisha dan Muawiyah bahwa itu berasal dari jiwa dan tidak kehilangan tubuhnya."
