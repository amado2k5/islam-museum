id: work/fatwa-dar-alifta-moving-the-dead-from-the-grave
class: work
kind: fatwa
label: { ar: "حكم نقل الميت من قبره بعد دفنه للضرورة", en: "Moving the dead from the grave after burial out of necessity", ur: "ضرورت کے تحت دفن کے بعد میت کو قبر سے منتقل کرنا" }
summary:
  ar: "سؤال عن نقل الميت من قبره إلى قبر آخر للضرورة، أجابت فيه دار الإفتاء المصرية بأن الأصل التحريم وأنه يجوز لضرورة أو حاجة أو مصلحة معتبرة. أجابت الدار بأن الأصل حرمة نبش القبر ونقل الميت إلا لضرورة أو حاجة أو مصلحة معتبرة شرعًا لا تتحقق إلا بنقله. واشترطت احترام الميت في نقله، وحفظ جسده أو ما بقي منه وستره، واللطف في حمله، وإذن الجهات الرسمية المختصة والالتزام باللوائح المنظمة. ومثّلت لما ذكره الفقهاء من أسباب النبش بدفنه لغير القبلة أو بلا غسل أو كفن، أو في أرض مغصوبة، أو وقوع مال في القبر، أو خوف تضرر القبور بالمياه، أو مصلحة عامة كشق طريق."
  en: "A question on moving the dead from one grave to another out of necessity, in which Egypt's Dar al-Ifta answered that it is forbidden in principle but permitted for a necessity, need or recognised benefit. Dar al-Ifta answered that opening a grave and moving the dead is forbidden in principle, except for a necessity, need or legally recognised benefit that cannot be achieved without moving him. It required that the deceased be treated with respect in the move, that his body or what remains of it be preserved and covered, that he be carried gently, and that the competent official authorities permit it and their regulations be followed. It gave as examples the grounds jurists list for opening a grave: burial facing away from the qibla, without washing or shroud, or in usurped land; property dropped into the grave; danger of water damage to graves; or a public interest such as building a road."
  ur: "ضرورت کے تحت میت کو ایک قبر سے دوسری قبر منتقل کرنے کے بارے میں سوال، جس میں مصر کے دار الافتاء نے کہا کہ اصل حرمت ہے مگر ضرورت، حاجت یا معتبر مصلحت کے لیے جائز ہے۔ دار الافتاء نے جواب دیا کہ قبر کھولنا اور میت کو منتقل کرنا اصلاً حرام ہے، سوائے کسی ایسی ضرورت، حاجت یا شرعی مصلحت کے جو منتقلی کے بغیر پوری نہ ہو۔ اس نے شرط رکھی کہ منتقلی میں میت کا احترام ہو، اس کا جسم یا باقی ماندہ حصہ محفوظ اور ڈھکا رہے، نرمی سے اٹھایا جائے، اور متعلقہ سرکاری اداروں کی اجازت اور ضوابط کی پابندی ہو۔ اس نے فقہا کی ذکر کردہ وجوہات کی مثالیں دیں: قبلے کے بغیر، غسل یا کفن کے بغیر یا غصب شدہ زمین میں دفن، قبر میں مال گر جانا، پانی سے قبروں کو نقصان کا خطرہ، یا سڑک بنانے جیسی عام مصلحت۔"
