id: work/fatwa-iifa-201-slaughter-after-electric-stunning
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 201 (21/7) بشأن الذكاة بعد التدويخ بالصدمة الكهربائية في ضوء المستجدات", en: "IIFA resolution 201 (21/7) on lawful slaughter after electric-shock stunning in light of new developments", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 201 (21/7): بجلی کے جھٹکے سے بے ہوش کرنے کے بعد حلال ذبح — جدید ترقیات کی روشنی میں", es: "Resolución 201 (21/7) de la IIFA sobre el sacrificio legal tras el aturdimiento por electrocución a la luz de los nuevos acontecimientos." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. قرر المجمع: أولًا تأكيد ما ورد في قراره 95 ⁦(10/3)⁩ بشأن الذبائح. ثانيًا بشأن المستجدات كلف أمانة المجمع بتشكيل لجنة من بعض أعضائه وبعض خبرائه للقيام بزيارات ميدانية للدول التي تستورد منها اللحوم، ومن مهام اللجنة: وضع معايير إجرائية تضمن تحقق الذكاة بالضوابط الشرعية؛ والتثبت من مطابقة الذكاة التي تقع في مصانع إنتاج اللحوم للأحكام الشرعية للذكاة طبقًا للقرار المشار إليه؛ ومطالبة معهد المقاييس والمواصفات للدول الإسلامية ⁦(سيميك)⁩ بالتأكد من مصداقية الشهادات التي تصدرها الجهات المعنية بهذا الأمر."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). It ruled: first, reaffirming its resolution 95 (10/3) on slaughtered animals. Second, concerning the new developments, it charged the secretariat with forming a committee of some Academy members and experts to conduct field visits to the countries from which meat is imported, its tasks being: setting procedural standards guaranteeing that lawful slaughter is realised under the sharia controls; verifying that slaughter performed in meat-production plants conforms to the legal rulings of dhabihah per the cited resolution; and asking the Standards and Metrology Institute for Islamic Countries (SMIIC) to verify the credibility of the certificates issued by the bodies concerned with this matter."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ اکیڈمی نے فیصلہ کیا: پہلا، اپنی قرارداد 95 ⁦(10/3)⁩ برائے ذبیحوں کی تائید۔ دوسرا، جدید ترقیات کے معاملے میں اس نے اپنے سیکرٹریٹ کو ارکان اور ماہرین کی ایک کمیٹی بنانے کی ذمہ داری دی جو ان ممالک کے میدانی دورے کرے جن سے گوشت درآمد ہوتا ہے، کمیٹی کے کام ہوں گے: ایسے طریقہ کار کے معیارات مقرر کرنا جو شرعی ضوابط کے مطابق ذبح کی تحقق کی ضمانت دیں؛ گوشت کی پیداوار کے کارخانوں میں ہونے والی ذبح کی ذبیحہ کے شرعی احکام سے مطابقت کی تصدیق مذکورہ قرارداد کے مطابق؛ اور اسلامی ممالک کے معیارات و پیمائش ادارے ⁦(سملیک)⁩ سے اس معاملے کے متعلق اداروں کی جاری کردہ سرٹیفکیٹس کی مصداقیت کی تصدیق کا مطالبہ۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013). En ella se dictaminó: primero, reafirmar su resolución 95 (10/3) sobre animales sacrificados. Segundo, en relación con los nuevos acontecimientos, se encargó a la secretaría la formación de un comité integrado por miembros y expertos de la Academia para realizar visitas de campo a los países de donde se importa la carne, con las siguientes tareas: establecer normas de procedimiento que garanticen que el sacrificio lícito se realice conforme a los controles de la sharia; verificar que el sacrificio realizado en las plantas de producción de carne se ajuste a las normas legales de dhabihah según la resolución citada; y solicitar al Instituto de Normas y Metrología para Países Islámicos (SMIIC) que verifique la credibilidad de los certificados emitidos por los organismos competentes en esta materia."
