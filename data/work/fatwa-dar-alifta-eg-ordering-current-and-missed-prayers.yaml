id: work/fatwa-dar-alifta-eg-ordering-current-and-missed-prayers
class: work
kind: fatwa
label: { ar: "كيفية الترتيب بين الصلاة الحاضرة والفائتة عند ضيق الوقت", en: "Ordering the present and the missed prayer when time is short", ur: "وقت کی تنگی میں حاضرہ اور فائتہ نماز کی ترتیب", es: "Cómo encargar el regalo y la oración omitida cuando el tiempo es limitado.", fr: "Commander le cadeau et la prière manquée quand le temps presse", tr: "Zaman kısıtlı olduğunda şimdiki ve kaçırılan dualar arasında nasıl düzenleme yapılır", id: "Cara mengatur antara doa saat ini dan doa yang terlewat saat waktu terbatas" }
summary:
  ar: "سائل سأل عمن فاتته صلاة العصر لعذر حتى دخل وقت المغرب وضاق الوقت بحيث لا يتسع إلا لأداء إحداهما. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20849)⁩ ببيان ما يقدم من الصلاتين على وجهه."
  en: "A questioner asked about one who missed Asr for an excuse until Maghrib time entered and time sufficed for only one of them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20849) answered by setting out which of the two prayers takes precedence."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس کا عصر کسی عذر سے قضا ہوا اور وقت صرف ایک نماز کے لیے بچا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20849)⁩ نے جواب میں بتایا کہ دونوں میں سے کون سی نماز پہلے ادا ہوگی۔"
  es: "Un interlocutor preguntó sobre alguien que omitió la oración de Asr con una excusa hasta que llegó la hora de Maghrib y solo le alcanzó el tiempo para una de ellas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20849) respondió indicando cuál de las dos oraciones tiene prioridad."
  fr: "Un internaute a posé une question concernant une personne ayant manqué la prière d'Asr, prétextant que l'heure du Maghrib approchait et que le temps ne suffisait plus que pour une seule des deux. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20849) a répondu en précisant laquelle des deux prières est prioritaire."
  tr: "Bir soru soran, Magrip zamanı başlayana kadar bir bahane nedeniyle Asr namazını kaçıran ve zaman o kadar daralmış ki sadece birini kabul edebildiği için sormuştur. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20849) yüzüne kılınan iki namazı netleştirerek yanıt verdi."
  id: "Seorang penanya menanyakan tentang seseorang yang melewatkan shalat Asr karena alasan sampai waktu Maghrib dimulai, dan waktu menjadi sangat ketat sehingga hanya bisa menampung satu dari mereka. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20849) menanggapi dengan menjelaskan dua doa yang dilakukan di hadapannya."
