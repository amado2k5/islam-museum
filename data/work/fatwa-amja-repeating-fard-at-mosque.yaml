label: { ar: "تكرار الفرض مع الجماعة", en: "Praying the same obligation twice — home then mosque", ur: "ایک فرض دو بار — گھر پھر مسجد", es: "Rezar la misma obligación dos veces: primero en casa y luego en la mezquita.", fr: "Accomplir deux fois la même obligation: à la maison puis à la mosquée.", tr: "Zorunlu duayı grupla tekrar etmek", id: "Mengulangi doa wajib bersama kelompok" }
summary:
  ar: "سأل سائل هل يجوز أن يصلي الفرض مرتين مرة في البيت ومرة في المسجد. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86406 بتاريخ 29 يناير 2012)⁩ أنه لا حرج فيما ذكر وتحسب له إحداهما نافلة والأخرى تجزئه عن الفريضة مستدلة بحديث أبي ذر في صحيح مسلم على ما فصّل الجواب."
  en: "A questioner asked whether he may pray the same obligation twice — once at home and once at the mosque. AMJA's fatwa committee (fatwa no. 86406, 29 January 2012) answered that there is no harm in what he described: one counts for him as voluntary and the other discharges the duty, citing Abu Dharr's hadith in Sahih Muslim — as the answer details."
  ur: "فرض دو بار؟ لجنة الفتوى ⁦(فتویٰ 86406، 29 جنوری 2012)⁩ کے مطابق جائز — ایک فریضہ دوسری نفل — حدیث ابوذر۔"
  es: "Un consultante preguntó si podía rezar la misma obligación dos veces: una en casa y otra en la mezquita. El comité de fatuas de AMJA (fatua n.º 86406, 29 de enero de 2012) respondió que no hay inconveniente en lo que describió: una de las oraciones se considera voluntaria y la otra cumple con el deber, citando el hadiz de Abu Dharr en Sahih Muslim, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il pouvait accomplir deux fois la même obligation religieuse: une fois chez lui et une fois à la mosquée. Le comité des fatwas de l'AMJA (fatwa n° 86406, 29 janvier 2012) a répondu qu'il n'y avait aucun mal à cela: l'une des prières est considérée comme volontaire et l'autre comme une obligation, citant un hadith d'Abu Dharr rapporté dans Sahih Muslim, comme le précise la réponse."
  tr: "Bir soru soran kişi, zorunlu namazın iki kez kılınmasının mümkün olup olmadığını sordu: bir kez evde, bir kez camide. Amerika İslami Hukukçular Meclisi'ndeki Fetva Komitesi (29 Ocak 2012 tarihli Fetva No. 86406), bahsedilenin zararı olmadığını, birinin gönüllü, diğerinin ise namaz için yeterli kabul edildiğini ve cevabın açıklamasında açıklanan Ebu Zerr'in Sahih Müslüman dilindeki hadislerini aktararak yanıtladı."
  id: "Seorang penanya bertanya apakah diperbolehkan shalat wajib dua kali: sekali di rumah dan sekali di masjid. Komite Fatwa di Majelis Ahli Hukum Islam di Amerika (Fatwa No. 86406 tanggal 29 Januari 2012) menjawab bahwa tidak ada salahnya apa yang disebutkan, dan satu dianggap sukarela dan yang lain dianggap cukup untuk shalat wajib, dengan mengutip hadits Abu Dharr dalam Sahih Muslim seperti yang dijelaskan dalam penjelasan jawaban."
