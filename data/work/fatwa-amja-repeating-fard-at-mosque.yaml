label: { ar: "تكرار الفرض مع الجماعة", en: "Praying the same obligation twice — home then mosque", ur: "ایک فرض دو بار — گھر پھر مسجد" }
summary:
  ar: "سأل سائل هل يجوز أن يصلي الفرض مرتين مرة في البيت ومرة في المسجد. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86406 بتاريخ 29 يناير 2012)⁩ أنه لا حرج فيما ذكر وتحسب له إحداهما نافلة والأخرى تجزئه عن الفريضة مستدلة بحديث أبي ذر في صحيح مسلم على ما فصّل الجواب."
  en: "A questioner asked whether he may pray the same obligation twice — once at home and once at the mosque. AMJA's fatwa committee (fatwa no. 86406, 29 January 2012) answered that there is no harm in what he described: one counts for him as voluntary and the other discharges the duty, citing Abu Dharr's hadith in Sahih Muslim — as the answer details."
  ur: "فرض دو بار؟ لجنة الفتوى ⁦(فتویٰ 86406، 29 جنوری 2012)⁩ کے مطابق جائز — ایک فریضہ دوسری نفل — حدیث ابوذر۔"
