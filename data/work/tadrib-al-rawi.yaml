id: work/tadrib-al-rawi
class: work
kind: book
label: { ar: "تدريب الراوي في شرح تقريب النواوي", en: "Tadrib al-Rawi fi Sharh Taqrib al-Nawawi", ur: "تدریب الراوی فی شرح تقریب النبوی۔" }
summary:
  ar: "شرح جلال الدين السيوطي ⁦(849–911هـ)⁩ على «التقريب والتيسير» للنووي، وهو مختصر النووي لكتاب ابن الصلاح في علوم الحديث. يمزج المتن بالشرح، فيورد لفظ النووي بين قوسين ثم يزيد عليه تخريج الأقوال والأحاديث ونقول الحفاظ بعد ابن الصلاح كالعراقي والبلقيني وابن حجر، ويجمع في المسائل المختلف فيها الأقوال وقائليها."
  en: "Jalal al-Din al-Suyuti's (849–911 AH) commentary on al-Nawawi's al-Taqrib wa-l-Taysir, al-Nawawi's abridgement of Ibn al-Salah's book on the hadith sciences. It blends text and commentary, giving al-Nawawi's words in brackets and adding the sources of sayings and hadith and the views of later masters such as al-Iraqi, al-Bulqini and Ibn Hajar; on disputed points it gathers the positions and their holders."
  es: "El comentario de Jalal al-Din al-Suyuti (849-911 AH) sobre al-Nawawi, al-Taqrib wa-l-Taysir, compendio del libro de Ibn al-Salah sobre las ciencias del hadiz, combina texto y comentario, citando las palabras de al-Nawawi entre corchetes y añadiendo las fuentes de dichos y hadices, así como las opiniones de maestros posteriores como al-Iraqi, al-Bulqini e Ibn Hajar. En los puntos controvertidos, recopila las posturas y a sus defensores."
  fr: "Le commentaire de Jalal al-Din al-Suyuti (849-911 AH) sur l'ouvrage d'al-Nawawi, al-Taqrib wa-l-Taysir, abrégé par al-Nawawi du livre d'Ibn al-Salah sur les sciences du hadith, mêle texte et commentaire. Il présente les propos d'al-Nawawi entre parenthèses et y ajoute les sources des hadiths et des opinions de maîtres postérieurs tels qu'al-Iraqi, al-Bulqini et Ibn Hajar. Sur les points litigieux, il rassemble les différentes positions et leurs tenants."
  ur: "جلال الدین السیوطی کی تفسیر ⁦(849-911 ہجری)⁩ النووی کی التقریب والتیسیر کی تفسیر، ابن الصلاح کی حدیث کے علوم پر کتاب کا اختصار۔ اس میں متن اور تفسیر کو ملایا گیا ہے، النووی کے الفاظ کو بریکٹ میں دیا گیا ہے اور اقوال اور حدیث کے ماخذ اور بعد کے استاذ جیسے عراقی، البقینی اور ابن حجر کے خیالات شامل کیے گئے ہیں۔ متنازعہ نکات پر یہ عہدوں اور ان کے حاملین کو جمع کرتا ہے۔"
