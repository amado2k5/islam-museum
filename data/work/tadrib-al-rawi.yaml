label: { ar: "تدريب الراوي في شرح تقريب النواوي", en: "Tadrib al-Rawi fi Sharh Taqrib al-Nawawi" }
summary:
  ar: "شرح جلال الدين السيوطي (849–911هـ) على «التقريب والتيسير» للنووي، وهو مختصر النووي لكتاب ابن الصلاح في علوم الحديث. يمزج المتن بالشرح، فيورد لفظ النووي بين قوسين ثم يزيد عليه تخريج الأقوال والأحاديث ونقول الحفاظ بعد ابن الصلاح كالعراقي والبلقيني وابن حجر، ويجمع في المسائل المختلف فيها الأقوال وقائليها."
  en: "Jalal al-Din al-Suyuti's (849–911 AH) commentary on al-Nawawi's al-Taqrib wa-l-Taysir, al-Nawawi's abridgement of Ibn al-Salah's book on the hadith sciences. It blends text and commentary, giving al-Nawawi's words in brackets and adding the sources of sayings and hadith and the views of later masters such as al-Iraqi, al-Bulqini and Ibn Hajar; on disputed points it gathers the positions and their holders."
