label: { ar: "رواية اختطاف الجن رجلًا زمن عمر", en: "The report of jinn abducting a man in Umar's time", ur: "عمر کے زمانے میں جنوں کے اغوا کی روایت", es: "El relato del secuestro de un hombre por un genio en tiempos de Umar" }
summary:
  ar: "سأل سائل عن صحة الاستدلال برواية اختطاف الجن رجلًا في زمن عمر بن الخطاب على جواز الاستعانة بالجن كما طرح أحد الرقاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81531 بتاريخ 22 مايو 2010)⁩ أن هذه المسألة من مسائل النظر بين أهل العلم، وهذه الرواية تحتمل الصدق والكذب وهي وإن صحت لا تصلح دليلًا مستقلًّا فيها لأن الدليل هو الوحي المعصوم قرآنًا وسنة صحيحة وكل الناس بعد ذلك يؤخذ من قوله ويترك، ومثل هذه الروايات يستأنس بها لكنها لا تصلح دليلًا نهائيًّا فيما ذكر."
  en: "A questioner asked about one raqi's citing the report that jinn abducted a man in Umar ibn al-Khattab's time as proof that seeking the jinn's help is lawful. Dr. Salah al-Sawi (fatwa no. 81531, 22 May 2010) answered that this is among the questions open to scholarly consideration; the report could be true or false, and even if sound it cannot stand as an independent proof — the proof is the protected revelation, Quran and sound sunna, and everyone after may have his words taken or left; such reports are used for comfort, not as final evidence here. Recorded as AMJA's answer."
  ur: "ایک سائل نے راقی کے اس استدلال کے بارے میں پوچھا کہ عمر کے زمانے میں جنوں نے شخص کو اغوا کیا — کیا جنوں سے مدد جائز ثابت ہوتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81531، 22 مئی 2010)⁩ کے مطابق روایت صادق یا کاذب دونوں ہوسکتی ہے اور آخری دلیل صرف وحی معصوم ہے۔"
  es: "Un interlocutor preguntó sobre la cita de un raqi, quien afirmó que un genio raptó a un hombre en tiempos de Umar ibn al-Khattab como prueba de que buscar la ayuda de los genios es lícito. El Dr. Salah al-Sawi (fatwa n.° 81531, 22 de mayo de 2010) respondió que esta es una de las cuestiones sujetas a la consideración de los eruditos; el relato podría ser verdadero o falso, e incluso si fuera auténtico, no puede considerarse una prueba independiente. La prueba reside en la revelación protegida, el Corán y la sunna auténtica, y cada persona posterior puede ver sus palabras tomadas o no; tales relatos se utilizan para brindar consuelo, no como evidencia definitiva. Registrado como respuesta de AMJA."
