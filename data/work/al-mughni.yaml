summary:
  ar: شرح ابن قدامة المقدسي على مختصر الخرقي، وهو أشهر شروح المختصر؛ يكتب المسألة من المتن ثم يبيّن أقوال الأئمة وأدلتها ويرجّح، وكان في تسع مجلدات بخط مؤلفه، وأغلب نسخه اليوم في ثلاثة عشر مجلداً.
  en: "Ibn Qudama al-Maqdisi's commentary on the Mukhtasar of al-Kharaqi, the most famous of its commentaries; he writes out each question from the base text, then lays out the imams' positions and their evidence and gives his preference. It ran to nine volumes in the author's own hand, and most copies today are in thirteen volumes."
