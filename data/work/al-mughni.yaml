summary:
  ar: شرح ابن قدامة المقدسي على مختصر الخرقي، وهو أشهر شروح المختصر؛ يكتب المسألة من المتن ثم يبيّن أقوال الأئمة وأدلتها ويرجّح، وكان في تسع مجلدات بخط مؤلفه، وأغلب نسخه اليوم في ثلاثة عشر مجلداً. وتذكره دائرة المعارف الإسلامية بين مؤلفات ابن قدامة في الفقه الوضعي، وتقول إنه طُبع في اثني عشر مجلداً في القاهرة بين 1922 و1930م ولا يزال يتمتع بسمعة كبيرة.
  ur: "ابن قدامہ مقدسی کی مختصر الخرقی پر سب سے مشہور شرح، جو مؤلف کے اپنے ہاتھ سے نو جلدوں میں تھی اور آج اس کے زیادہ تر نسخے تیرہ جلدوں میں ہیں۔ اسلامی انسائیکلوپیڈیا اسے ابن قدامہ کی فقہی تصانیف میں گنتا ہے اور کہتا ہے کہ یہ 1922 تا 1930ء قاہرہ میں بارہ جلدوں میں چھپی اور آج بھی بڑی شہرت رکھتی ہے۔"
  en: "Ibn Qudama al-Maqdisi's commentary on the Mukhtasar of al-Kharaqi, the most famous of its commentaries; he writes out each question from the base text, then lays out the imams' positions and their evidence and gives his preference. It ran to nine volumes in the author's own hand, and most copies today are in thirteen volumes. The Encyclopaedia of Islam lists it among Ibn Qudama's works on positive law and says it was printed in twelve volumes at Cairo in 1922-30 and still enjoys a great reputation."
  es: "El comentario de Ibn Qudama al-Maqdisi sobre el Mukhtasar de al-Kharaqi, el más famoso de sus comentarios, transcribe cada pregunta del texto original, expone las posturas de los imanes y sus argumentos, y expresa su preferencia. Constaba de nueve volúmenes escritos de puño y letra del autor, y la mayoría de las copias actuales constan de trece volúmenes. La Enciclopedia del Islam la incluye entre las obras de Ibn Qudama sobre derecho positivo y afirma que se imprimió en doce volúmenes en El Cairo entre 1922 y 1930, y que aún goza de gran prestigio."
  fr: "Le commentaire d'Ibn Qudama al-Maqdisi sur le Mukhtasar d'al-Kharaqi, le plus célèbre de ses commentaires, expose chaque question à partir du texte source, puis présente les positions des imams et leurs arguments, et donne son avis personnel. Rédigé de la main de l'auteur, cet ouvrage comptait neuf volumes, et la plupart des éditions actuelles en comptent treize. L'Encyclopédie de l'Islam le recense parmi les œuvres d'Ibn Qudama relatives au droit positif et précise qu'il fut imprimé en douze volumes au Caire entre 1922 et 1930 et qu'il jouit encore aujourd'hui d'une grande renommée."
  tr: "İbn Qudamah al-Maqdisi'nin Mukhtasar al-Kharqi üzerine yaptığı tefhi, Muhtaşar üzerine en ünlü şerh; ana metinden bu sayıyı yazar, ardından imamların ifadelerini ve delillerini netleştirir ve onlara ağırlık verir. Kendi el yazısıyla dokuz cilt halinde yayımlanmış, günümüzde el yazmalarının çoğu ise on üç ciltte bulunmaktadır. İslami Ansiklopedi, onu İbn Kudeme'nin pratik hukuk eserleri arasında anmakta, 1922 ile 1930 yılları arasında Kahire'de on iki cilt halinde basıldığını ve hâlâ büyük bir üne sahip olduğunu belirtmektedir."
  id: "Komentar Ibn Qudamah al-Maqdisi atas Mukhtasar al-Kharqi, yang merupakan komentar paling terkenal tentang Mukhtasar; ia menulis edisi dari teks utama, kemudian memperjelas pernyataan dan bukti para imam serta memberikan bobot pada mereka. Komentar ini diterbitkan dalam sembilan jilid dengan tulisan tangannya sendiri, dengan sebagian besar manuskripnya hingga kini dalam tiga belas jilid. Ensiklopedia Islam menyebutnya di antara karya-karya Ibn Qudamah dalam bidang hukum praktis, menyatakan bahwa karya ini dicetak dalam dua belas jilid di Kairo antara tahun 1922 dan 1930 dan masih memiliki reputasi besar."
