  en: "al-Mughni"
summary:
  ar: شرح ابن قدامة المقدسي على مختصر الخرقي، وهو أشهر شروح المختصر؛ يكتب المسألة من المتن ثم يبيّن أقوال الأئمة وأدلتها ويرجّح، وكان في تسع مجلدات بخط مؤلفه، وأغلب نسخه اليوم في ثلاثة عشر مجلداً. وتذكره دائرة المعارف الإسلامية بين مؤلفات ابن قدامة في الفقه الوضعي، وتقول إنه طُبع في اثني عشر مجلداً في القاهرة بين 1922 و1930م ولا يزال يتمتع بسمعة كبيرة.
  ur: "ابن قدامہ مقدسی کی مختصر الخرقی پر سب سے مشہور شرح، جو مؤلف کے اپنے ہاتھ سے نو جلدوں میں تھی اور آج اس کے زیادہ تر نسخے تیرہ جلدوں میں ہیں۔ اسلامی انسائیکلوپیڈیا اسے ابن قدامہ کی فقہی تصانیف میں گنتا ہے اور کہتا ہے کہ یہ 1922 تا 1930ء قاہرہ میں بارہ جلدوں میں چھپی اور آج بھی بڑی شہرت رکھتی ہے۔"
  en: "Ibn Qudama al-Maqdisi's commentary on the Mukhtasar of al-Kharaqi, the most famous of its commentaries; he writes out each question from the base text, then lays out the imams' positions and their evidence and gives his preference. It ran to nine volumes in the author's own hand, and most copies today are in thirteen volumes. The Encyclopaedia of Islam lists it among Ibn Qudama's works on positive law and says it was printed in twelve volumes at Cairo in 1922-30 and still enjoys a great reputation."
