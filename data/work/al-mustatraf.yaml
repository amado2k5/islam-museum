summary:
  ar: "موسوعة أدبية للأبشيهي في أربعة وثمانين باباً، يقول في خطبته إنه جمع فيها من الأحاديث والأمثال والشعر والحكايات والنوادر ما لم يجتمع في كتاب واحد، تبدأ بباب في مباني الإسلام وتنتهي بباب في الصلاة على النبي {cite:mustatraf-bulac-lithograph p. 10} {cite:mustatraf-bulac-lithograph p. 11} {cite:mustatraf-bulac-lithograph p. 14}."
  en: "Al-Abshihi's literary encyclopaedia in eighty-four chapters, in which, his preface says, he gathered hadith, proverbs, poetry, stories and witticisms not found together in any one book; it begins with a chapter on the pillars of Islam and ends with one on invoking blessings on the Prophet {cite:mustatraf-bulac-lithograph p. 10} {cite:mustatraf-bulac-lithograph p. 11} {cite:mustatraf-bulac-lithograph p. 14}."
  ur: "ابشیہی کا چوراسی ابواب پر مشتمل ادبی دائرۃ المعارف، جس میں ان کے خطبے کے مطابق انہوں نے احادیث، امثال، شعر، حکایات اور نوادر جمع کیے جو کسی ایک کتاب میں اکٹھے نہ تھے؛ اس کا آغاز ارکانِ اسلام کے باب سے اور اختتام نبی پر درود کے باب پر ہوتا ہے {cite:mustatraf-bulac-lithograph p. 10} {cite:mustatraf-bulac-lithograph p. 11} {cite:mustatraf-bulac-lithograph p. 14}۔"
