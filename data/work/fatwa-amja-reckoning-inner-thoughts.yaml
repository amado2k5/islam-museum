id: work/fatwa-amja-reckoning-inner-thoughts
class: work
kind: fatwa
label: { ar: "المحاسبة على ما في الأنفس", en: "Reckoning for what lies in the hearts — al-Baqara 284", ur: "دل کی باتوں کا حساب — بقرہ 284", es: "El ajuste de cuentas por lo que yace en los corazones — al-Baqara 284", fr: "Le jugement de ce qui se trouve dans les cœurs — al-Baqara 284", tr: "Kendinde olanlar için sorumluluk", id: "Akuntabilitas atas apa yang ada dalam diri sendiri" }
summary:
  ar: "سأل سائل عن آية إن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله هل يعني أن من نوى فاحشة ولم يفعلها يعاقب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76689 بتاريخ 23 أكتوبر 2008)⁩ أن من رحمة الله أنه تجاوز لهذه الأمة عما حدثت به نفسها ما لم تعمل به أو تتكلم به وقد صح الخبر بذلك عنه، وثبت في الصحيحين أن العبد إذا هم بحسنة فلم يعملها كتبها الله حسنة وإن هم بها وعملها كتبها عشر حسنات وإذا هم بسيئة فلم يعملها لم تكتب عليه وإن هم بها فعملها كتبت سيئة، وأما الآية فقد ثبت في صحيح مسلم نسخها ورفعها بآية لا يكلف الله نفسًا إلا وسعها."
  en: "A questioner asked whether 'whether you reveal what is in your souls or hide it, God will call you to account' means one who intends a wrong but does not do it is punished. Dr. Salah al-Sawi (fatwa no. 76689, 23 October 2008) answered that of God's mercy He has overlooked for this ummah what the soul stirs with, so long as it is not acted on or spoken — the Prophet's report establishing it — and in the two Sahihs: whoever resolves on a good deed and does not do it has one good written; does it and ten; resolves on an evil and does not do it, nothing is written; does it and one evil. The verse was abrogated — established in Sahih Muslim — by 'God does not charge a soul beyond its capacity'."
  ur: "ایک سائل نے بقرہ 284 کے تحت نیت کا حساب پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76689، 23 اکتوبر 2008)⁩ کے مطابق امت کے وسوسے معاف ہیں جب تک عمل یا کہہ نہ لے — اور آیت کی نسخ مسلم کی حدیث سے ثابت ہے۔"
  es: "Un interlocutor preguntó si la frase «ya sea que reveléis lo que hay en vuestras almas o lo ocultéis, Dios os pedirá cuentas» significa que quien tiene la intención de hacer algo malo pero no lo hace es castigado. El Dr. Salah al-Sawi (fatwa n.º 76689, 23 de octubre de 2008) respondió que, por la misericordia de Dios, Él ha pasado por alto para esta ummah lo que el alma anhela, siempre que no se lleve a cabo ni se mencione —el relato del Profeta lo establece— y en los dos Sahihs: «Quien decide hacer una buena acción y no la realiza, tiene una buena acción registrada; si la realiza, diez; quien decide hacer una mala acción y no la realiza, no se registra nada; si la realiza, una mala acción». El versículo fue abrogado —establecido en Sahih Muslim— por «Dios no impone a un alma una carga mayor de la que puede soportar»."
  fr: "Un internaute a demandé si le verset « que vous révéliez ce qui est dans vos âmes ou que vous le cachiez, Dieu vous demandera des comptes » signifiait que celui qui a l'intention de mal agir mais ne la commet pas est puni. Le Dr Salah al-Sawi (fatwa n° 76689, 23 octobre 2008) a répondu que, par Sa miséricorde, Dieu a pardonné à cette communauté les aspirations de l'âme, tant qu'elles ne sont ni mises en pratique ni exprimées – un hadith confirmé par le Prophète – et que les deux Sahihs stipulent: « Quiconque prend la résolution d'une bonne action et ne l'accomplit pas, une bonne action lui est inscrite; s'il l'accomplit, il en compte dix; quiconque prend la résolution d'une mauvaise action et ne l'accomplit pas, rien ne lui est inscrit; s'il l'accomplit, il en compte une mauvaise. » Ce verset a été abrogé – comme l'indique le Sahih Muslim – par: « Dieu n'impose à aucune âme une charge supérieure à ses capacités. »"
  tr: "Bir soruya şu ayet hakkında soru soruldu: 'Eğer kendinizde olanı açığa çıkarır veya gizlerseniz, Allah sizi bunun hesabını verir.' Bu, ahlaksızlık niyetinde olup bunu yapmayan kişinin cezalandırılacağı anlamına mı gelir? Dr. Salah Al-Sawi (23 Ekim 2008 tarihli 76689 sayılı fetva) yanıtlamıştır; Allah'ın merhametiyle bu ulusa kendisine yaptıkları ve kendisinin yapmadığı şeyleri affeder ve bu rivayet O'ndan doğrudur. İki Sahih'te belirtilmiştir ki, bir hizmetkar iyi bir iş yapıp yapmazsa, Allah bunu iyi bir iş olarak kaydeder; eğer onlar bundan endişe duyarlarsa ve yaparlarsa, onu on iyi iş olarak kaydeder; eğer kötü bir iş yapıp yapmazlarsa, bu onun için kaydedilmez; eğer endişelenirlerse ve yaparlarsa, bu kötü olarak kaydedilir. Ayete gelince, Sahih Müslüm'de onun kaldırıldığı ve bir ayetle yükseltildiği belirtilmiştir: Allah bir ruhu kapasitesinden fazla yüklemez."
  id: "Seorang penanya ditanya tentang ayat tersebut: 'Jika kalian mengungkapkan atau menyembunyikan apa yang ada dalam diri kalian, Allah akan menuntut pertanggungjawaban atas hal itu.' Apakah ini berarti siapa pun yang berniat melakukan kejahatan dan tidak melakukannya akan dihukum? Dr. Salah Al-Sawi menjawab (Fatwa No. 76689 tanggal 23 Oktober 2008) bahwa atas rahmat Allah Dia mengampuni bangsa ini atas apa yang telah mereka lakukan pada dirinya sendiri yang tidak ditindaki atau dibicarakan, dan laporan itu asli darinya. Memang benar Telah ditetapkan dalam dua Syah bahwa jika seorang hamba berbuat baik tetapi tidak melakukannya, Allah mencatatnya sebagai perbuatan baik, dan jika mereka peduli dan melakukannya, Dia mencatatnya sebagai sepuluh perbuatan baik; dan jika mereka melakukan perbuatan buruk tetapi tidak melakukannya, maka itu tidak dicatat untuknya; dan jika mereka peduli dan melakukannya, maka itu dicatat sebagai kejahatan. Adapun ayat tersebut, telah ditetapkan dalam Sahih Muslim bahwa ia dibatalkan dan diangkat dengan sebuah ayat: Allah tidak membebankan jiwa melebihi kemampuannya."
