id: work/fatwa-amja-wudu-uncovered-awra-spouse
class: work
kind: fatwa
label: { ar: "الوضوء وكشف العورة", en: "Doing wudu uncovered before one's spouse", ur: "شوہر کے سامنے بے پردہ وضو" }
summary:
  ar: "سألت امرأة هل يجوز لها الوضوء أمام زوجها كاشفة شيئًا من عورتها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82833 بتاريخ 11 أكتوبر 2010)⁩ أن ستر العورة شرط في صحة الصلاة وليس شرطًا في صحة الوضوء فلا حرج أن تتوضأ المرأة أمام زوجها كاشفة شيئًا من عورتها أو أن يتوضأ الرجل أمام زوجته كاشفًا شيئًا من عورته فإن الله أجاز إبداء الزينة للأزواج في قوله تعالى ولا يبدين زينتهن إلا لبعولتهن على ما فصّل."
  en: "A woman asked whether she may do wudu before her husband uncovering something of her awra. Dr. Salah al-Sawi (fatwa no. 82833, 11 October 2010) answered that covering the awra is a condition of the prayer's validity, not of the wudu's — so no harm in a woman doing wudu before her husband uncovering some of her awra, nor a man before his wife, God having permitted a wife showing her adornment to her husband in 'they show not their adornment save to their husbands' — as detailed."
  ur: "ایک خاتون نے شوہر کے سامنے وضو پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82833، 11 اکتوبر 2010)⁩ کے مطابق ستر صرف نماز کی شرط ہے — وضو میں حرج نہیں۔"
