id: work/fatwa-amja-wudu-uncovered-awra-spouse
class: work
kind: fatwa
label: { ar: "الوضوء وكشف العورة", en: "Doing wudu uncovered before one's spouse", ur: "شوہر کے سامنے بے پردہ وضو", es: "Hacer el wudu descubierto frente a la esposa", fr: "Faire ses ablutions (wudu) découvert devant son conjoint" }
summary:
  ar: "سألت امرأة هل يجوز لها الوضوء أمام زوجها كاشفة شيئًا من عورتها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82833 بتاريخ 11 أكتوبر 2010)⁩ أن ستر العورة شرط في صحة الصلاة وليس شرطًا في صحة الوضوء فلا حرج أن تتوضأ المرأة أمام زوجها كاشفة شيئًا من عورتها أو أن يتوضأ الرجل أمام زوجته كاشفًا شيئًا من عورته فإن الله أجاز إبداء الزينة للأزواج في قوله تعالى ولا يبدين زينتهن إلا لبعولتهن على ما فصّل."
  en: "A woman asked whether she may do wudu before her husband uncovering something of her awra. Dr. Salah al-Sawi (fatwa no. 82833, 11 October 2010) answered that covering the awra is a condition of the prayer's validity, not of the wudu's — so no harm in a woman doing wudu before her husband uncovering some of her awra, nor a man before his wife, God having permitted a wife showing her adornment to her husband in 'they show not their adornment save to their husbands' — as detailed."
  ur: "ایک خاتون نے شوہر کے سامنے وضو پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82833، 11 اکتوبر 2010)⁩ کے مطابق ستر صرف نماز کی شرط ہے — وضو میں حرج نہیں۔"
  es: "Una mujer preguntó si podía realizar el wudu ante su marido descubriendo parte de su awra. El Dr. Salah al-Sawi (fatwa n.º 82833, 11 de octubre de 2010) respondió que cubrir el awra es una condición para la validez de la oración, no del wudu; por lo tanto, no hay problema en que una mujer realice el wudu ante su marido descubriendo parte de su awra, ni un hombre ante su esposa, ya que Dios ha permitido que una esposa muestre sus adornos a su marido en «no muestran sus adornos sino a sus maridos», como se detalla."
  fr: "Une femme a demandé si elle pouvait faire ses ablutions (wudu) devant son mari en découvrant partiellement son intimité (awra). Le Dr Salah al-Sawi (fatwa n° 82833, 11 octobre 2010) a répondu que couvrir l'intimité (awra) est une condition de validité de la prière, et non des ablutions. Il n'y a donc aucun mal à ce qu'une femme fasse ses ablutions devant son mari en découvrant partiellement son intimité, ni qu'un homme le fasse devant sa femme, Dieu ayant permis à une femme de montrer ses atours à son mari, comme indiqué dans le verset: « Elles ne montrent leurs atours qu'à leurs maris »."
