summary:
  ar: رسالة ابن النفيس الفلسفية عن طفل يستنبط الدين والعلم وحده في جزيرة — أقدم رواية فلسفية مكتملة ومن أصول الخيال العلمي.
  en: Ibn al-Nafis's philosophical tale of a child who deduces religion and science alone on an island — the earliest complete
    philosophical novel, a root of science fiction.
  es: "El relato filosófico de Ibn al-Nafis sobre un niño que deduce la religión y la ciencia en soledad en una isla —la primera novela filosófica completa, una de las raíces de la ciencia ficción—."
  fr: "Le récit philosophique d'Ibn al-Nafis, qui raconte l'histoire d'un enfant décelant seul la religion et la science sur une île — le plus ancien roman philosophique complet, une racine de la science-fiction."
  ur: "ابن النفیس کی ایک ایسے بچے کی فلسفیانہ کہانی جو صرف ایک جزیرے پر مذہب اور سائنس کو اخذ کرتا ہے - قدیم ترین مکمل فلسفیانہ ناول، سائنس فکشن کی جڑ۔"
  tr: "İbn el-Nafis'in, bir adada tek başına din ve bilimi alan bir çocuk hakkında felsefi incelemesi — en eski tam felsefi roman ve bilim kurgunun kökenlerinden biri."
  id: "Risalah filsafat Ibn al-Nafi tentang seorang anak yang mengambil agama dan ilmu pengetahuan sendirian di sebuah pulau — novel filsafat tertua yang lengkap dan salah satu asal-usul fiksi ilmiah."
