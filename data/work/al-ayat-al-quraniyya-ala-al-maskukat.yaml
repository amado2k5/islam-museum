label: { ar: "الآيات القرآنية على المسكوكات الإسلامية: دراسة مقارنة", en: "Qur'anic Verses on Islamic Coins: A Comparative Study", ur: "اسلامی سکوں پر قرآنی آیات: تقابلی مطالعہ" }
summary:
  ar: "كتاب فرج الله أحمد يوسف ⁦(الرياض 1423هـ/2003م)⁩ يتتبع 72 آية قرآنية نقشت على الدنانير والدراهم والفلوس منذ تعريب النقود سنة 77هـ، ويحلل أسباب نقشها في ظروف كل عصر السياسية والمذهبية والاقتصادية، وينشر 76 قطعة نقدية لأول مرة {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  en: "Farajallah Ahmad Yusuf's book (Riyadh, 2003) following 72 Qur'anic verses inscribed on dinars, dirhams and fulus from the Arabisation of coinage in 77 AH, analysing why each was inscribed in its political, sectarian and economic setting, and publishing 76 coins for the first time {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  ur: "فرج اللہ احمد یوسف کی کتاب (ریاض 2003) جو 77ھ میں سکوں کی تعریب سے دیناروں، درہموں اور فلوس پر کندہ 72 آیات کا سراغ لگاتی، ہر دور کے سیاسی، مسلکی اور معاشی حالات میں ان کے کندہ ہونے کی وجوہ کا تجزیہ کرتی اور 76 سکے پہلی بار شائع کرتی ہے {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
