id: work/fatwa-dar-alifta-eg-lesser-release-how-achieved
class: work
kind: fatwa
label: { ar: "ما يحصل به التحلل الأصغر في الحج", en: "By what the lesser release in Hajj is achieved", ur: "حج میں تحلل اصغر کس عمل سے ہوتا ہے", es: "¿Por qué se logra la liberación menor en el Hajj?", fr: "Par quoi est accomplie la libération mineure lors du Hajj" }
summary:
  ar: "سائل سأل عما يحصل به التحلل الأصغر في الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20688)⁩ أن التحلل الأول أو الأصغر للمحرم بالحج يحصل بفعل واحد من أعمال يوم النحر الثلاثة وهي رمي جمرة العقبة والحلق أو التقصير والطواف والسعي على ما فصّل الجواب."
  en: "A questioner asked by what the lesser release in Hajj is achieved. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20688) answered that the first or lesser release is achieved by one of the three works of the day of sacrifice — stoning the aqaba jamra, shaving or shortening, and the tawaf with sa'i — as the answer details."
  ur: "ایک سائل نے حج میں تحلل اصغر کے حصول کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20688)⁩ نے جواب دیا کہ یہ یوم نحر کے تین اعمال میں سے کسی ایک سے ہوتا ہے — رمی حلق یا تقصیر اور طواف و سعی — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó cómo se logra la liberación menor en el Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20688) respondió que la primera o menor liberación se logra mediante una de las tres obras del día del sacrificio: lapidar la jamra de Aqaba, afeitarse o acortarse, y el tawaf con sa'i, como se detalla en la respuesta."
  fr: "Un pèlerin a demandé comment s'obtient la première sanctification (ou ablution mineure) lors du Hajj. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20688) a répondu que cette première sanctification est obtenue par l'un des trois actes du jour du sacrifice: la lapidation de l'Aqaba Jamra, le rasage ou le raccourcissement des cheveux, et le tawaf avec le sa'i, comme le précise la réponse."
