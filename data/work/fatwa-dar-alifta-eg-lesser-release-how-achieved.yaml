label: { ar: "ما يحصل به التحلل الأصغر في الحج", en: "By what the lesser release in Hajj is achieved", ur: "حج میں تحلل اصغر کس عمل سے ہوتا ہے" }
summary:
  ar: "سائل سأل عما يحصل به التحلل الأصغر في الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20688)⁩ أن التحلل الأول أو الأصغر للمحرم بالحج يحصل بفعل واحد من أعمال يوم النحر الثلاثة وهي رمي جمرة العقبة والحلق أو التقصير والطواف والسعي على ما فصّل الجواب."
  en: "A questioner asked by what the lesser release in Hajj is achieved. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20688) answered that the first or lesser release is achieved by one of the three works of the day of sacrifice — stoning the aqaba jamra, shaving or shortening, and the tawaf with sa'i — as the answer details."
  ur: "ایک سائل نے حج میں تحلل اصغر کے حصول کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20688)⁩ نے جواب دیا کہ یہ یوم نحر کے تین اعمال میں سے کسی ایک سے ہوتا ہے — رمی حلق یا تقصیر اور طواف و سعی — جیسا کہ جواب میں تفصیل ہے۔"
