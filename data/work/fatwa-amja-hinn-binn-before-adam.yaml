id: work/fatwa-amja-hinn-binn-before-adam
class: work
kind: fatwa
label: { ar: "الحن والبن قبل آدم", en: "The hinn and binn before Adam", ur: "آدم سے پہلے حن اور بن" }
summary:
  ar: "سأل سائل عن روايات لبعض الصحابة أن الله خلق قبل آدم مخلوقات اسمها الحن والبن فما هما. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77690 بتاريخ 4 فبراير 2009)⁩ أن من المعروف عند أهل العلم أن الله خلق الجن قبل خلق آدم وأنه أمر إبليس الذي كان من الجن أن يسجد لآدم فأبى فكان من الكافرين، وأما البن فلم يسمع بهم، وأرجو أن يشتغل بما ينفعه فإن كل مسألة لا ينبني عليها عمل فالخوض فيها من التكلف الذي نهينا عنه."
  en: "A questioner cited reports from some Companions that God created before Adam creatures called the hinn and the binn, and asked what they are. Dr. Salah al-Sawi (fatwa no. 77690, 4 February 2009) answered that scholars know God created the jinn before Adam and commanded Iblis — who was of them — to bow to Adam; he refused and was among the disbelievers. As for the binn, they had not heard of them, and he counselled him to busy himself with what benefits, since wading into questions on which no action rests is the needless exertion we were forbidden."
  ur: "ایک سائل نے آدم سے پہلے حن اور بن نامی مخلوقات کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77690، 4 فروری 2009)⁩ کے مطابق جن آدم سے پہلے پیدا ہوئے؛ «بن» کے بارے میں انہوں نے نہیں سنا اور اس نے بے عمل سوالات سے گریز کی تلقین کی۔"
