id: work/fatwa-amja-hinn-binn-before-adam
class: work
kind: fatwa
label: { ar: "الحن والبن قبل آدم", en: "The hinn and binn before Adam", ur: "آدم سے پہلے حن اور بن", es: "El hinn y el binn antes de Adán", fr: "Le hinn et le binn avant Adam" }
summary:
  ar: "سأل سائل عن روايات لبعض الصحابة أن الله خلق قبل آدم مخلوقات اسمها الحن والبن فما هما. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77690 بتاريخ 4 فبراير 2009)⁩ أن من المعروف عند أهل العلم أن الله خلق الجن قبل خلق آدم وأنه أمر إبليس الذي كان من الجن أن يسجد لآدم فأبى فكان من الكافرين، وأما البن فلم يسمع بهم، وأرجو أن يشتغل بما ينفعه فإن كل مسألة لا ينبني عليها عمل فالخوض فيها من التكلف الذي نهينا عنه."
  en: "A questioner cited reports from some Companions that God created before Adam creatures called the hinn and the binn, and asked what they are. Dr. Salah al-Sawi (fatwa no. 77690, 4 February 2009) answered that scholars know God created the jinn before Adam and commanded Iblis — who was of them — to bow to Adam; he refused and was among the disbelievers. As for the binn, they had not heard of them, and he counselled him to busy himself with what benefits, since wading into questions on which no action rests is the needless exertion we were forbidden."
  ur: "ایک سائل نے آدم سے پہلے حن اور بن نامی مخلوقات کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77690، 4 فروری 2009)⁩ کے مطابق جن آدم سے پہلے پیدا ہوئے؛ «بن» کے بارے میں انہوں نے نہیں سنا اور اس نے بے عمل سوالات سے گریز کی تلقین کی۔"
  es: "Un interlocutor citó relatos de algunos Compañeros que afirmaban que Dios creó antes de Adán a unas criaturas llamadas hinn y binn, y preguntó qué eran. El Dr. Salah al-Sawi (fatwa n.º 77690, 4 de febrero de 2009) respondió que los eruditos saben que Dios creó a los jinn antes de Adán y ordenó a Iblis —quien era uno de ellos— que se inclinara ante Adán; él se negó y se encontraba entre los incrédulos. En cuanto a los binn, no habían oído hablar de ellos, y le aconsejó que se ocupara de qué beneficios aportarían, ya que entrometerse en cuestiones sin fundamento es un esfuerzo innecesario que nos está prohibido."
  fr: "Un interrogateur a cité des récits de Compagnons selon lesquels Dieu aurait créé avant Adam des créatures appelées les djinns et les binns, et a demandé de quoi il s'agissait. Le Dr Salah al-Sawi (fatwa n° 77690, 4 février 2009) a répondu que les savants savent que Dieu a créé les djinns avant Adam et a ordonné à Iblis – qui était l'un d'eux – de se prosterner devant Adam; il a refusé et a compté parmi les mécréants. Quant aux binns, ils n'en avaient jamais entendu parler, et il lui a conseillé de s'occuper plutôt des bienfaits qu'ils pouvaient apporter, car s'engager dans des questions sans fondement est un effort inutile qui nous a été interdit."
