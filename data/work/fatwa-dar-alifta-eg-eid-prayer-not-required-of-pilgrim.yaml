id: work/fatwa-dar-alifta-eg-eid-prayer-not-required-of-pilgrim
class: work
kind: fatwa
label: { ar: "مدى مطلوبية صلاة عيد الأضحى بالنسبة للحاج", en: "Is the Eid al-Adha prayer required of the pilgrim?", ur: "کیا حاجی پر عید الاضحی کی نماز مطلوب ہے؟", es: "¿Es obligatoria la oración de Eid al-Adha para el peregrino?", fr: "La prière de l'Aïd al-Adha est-elle obligatoire pour le pèlerin ?", tr: "Hacı için gerekli Raban Bayramı namaz seviyesi", id: "Tingkat salat Idul Fitri yang diperlukan bagi para jamaah" }
summary:
  ar: "سائل سأل عن مدى مطلوبية صلاة عيد الأضحى بالنسبة للحاج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20823)⁩ أنه لا يطلب شرعًا من الحاج أداء صلاة عيد الأضحى تخفيفًا عنه ولما يشغله في هذا اليوم من وظائف الحج على ما فصّل الجواب."
  en: "A questioner asked whether the Eid al-Adha prayer is required of the pilgrim. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20823) answered that it is not legally required of him — a facilitation, given the Hajj duties occupying that day — as the answer details."
  ur: "ایک سائل نے حاجی پر عید الاضحی کی نماز کے مطلوب ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20823)⁩ نے جواب دیا کہ شرعاً اس سے مطالبہ نہیں کیونکہ اس دن وہ حج کے مناسک میں مصروف ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó si la oración del Eid al-Adha es obligatoria. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20823) respondió que no es una obligación legal, lo cual facilita las cosas dadas las obligaciones del Hajj que ocupan ese día, como se detalla en la respuesta."
  fr: "Un pèlerin a demandé si la prière de l'Aïd al-Adha était obligatoire. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20823) a répondu qu'elle n'était pas légalement requise, une simplification compte tenu des obligations du Hajj qui occupent cette journée, comme le précise la réponse."
  tr: "Bir soru soran kişi, hacı için Ramazan Bayramı namazının zorunluluğu hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 20823), hacının yükünü ve bu gün üstlendiği görevleri hafifletmek için Ramazan Bayramı namazını yapmasının dini bir zorunluluk olmadığını yanıtladı; bu yanıtta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang kewajiban shalat Idul Fitri bagi para jamaah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20823) menjawab bahwa secara agama tidak diwajibkan bagi jamaah untuk melaksanakan shalat Idul Fitri untuk meringankan beban dan tugas yang dijalankannya pada hari ini, seperti yang dijelaskan dalam jawaban."
