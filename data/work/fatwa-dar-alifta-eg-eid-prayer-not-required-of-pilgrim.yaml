label: { ar: "مدى مطلوبية صلاة عيد الأضحى بالنسبة للحاج", en: "Is the Eid al-Adha prayer required of the pilgrim?", ur: "کیا حاجی پر عید الاضحی کی نماز مطلوب ہے؟" }
summary:
  ar: "سائل سأل عن مدى مطلوبية صلاة عيد الأضحى بالنسبة للحاج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20823)⁩ أنه لا يطلب شرعًا من الحاج أداء صلاة عيد الأضحى تخفيفًا عنه ولما يشغله في هذا اليوم من وظائف الحج على ما فصّل الجواب."
  en: "A questioner asked whether the Eid al-Adha prayer is required of the pilgrim. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20823) answered that it is not legally required of him — a facilitation, given the Hajj duties occupying that day — as the answer details."
  ur: "ایک سائل نے حاجی پر عید الاضحی کی نماز کے مطلوب ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20823)⁩ نے جواب دیا کہ شرعاً اس سے مطالبہ نہیں کیونکہ اس دن وہ حج کے مناسک میں مصروف ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
