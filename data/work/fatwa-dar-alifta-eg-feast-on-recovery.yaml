id: work/fatwa-dar-alifta-eg-feast-on-recovery
class: work
kind: fatwa
label: { ar: "حكم عمل الوليمة عند الشفاء من المرض", en: "Holding a feast on recovery from illness", ur: "مرض سے شفا پر ولیمہ کرنے کا حکم", es: "Celebración de un banquete por la recuperación de la enfermedad.", fr: "Organiser un festin pour célébrer la guérison de la maladie", tr: "Hastalıktan iyileştikten sonra ziyafet düzenlenmesine ilişkin karar", id: "Putusan tentang mengadakan pesta setelah pemulihan dari penyakit" }
summary:
  ar: "سائل سأل عن حكم عمل الوليمة عند الشفاء من المرض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22526)⁩ أن عمل الوليمة عند الشفاء من المرض أمر جائز شرعًا ومندرج تحت إطعام الطعام المندوب إليه شرعًا مع مراعاة عدم الإسراف على ما فصّل الجواب."
  en: "A questioner asked about holding a feast on recovery from illness. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22526) answered that making a feast on recovering from illness is lawful in the sharia and falls under the recommended feeding of food, observing the avoidance of extravagance, as the answer details."
  ur: "ایک سائل نے مرض سے شفا پر ولیمہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22526)⁩ نے جواب دیا کہ شفا ہونے پر ولیمہ کرنا شرعاً جائز ہے اور شریعت کے مستحب کھانا کھلانے میں داخل ہے، بشرطیکہ اسراف سے بچا جائے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de celebrar un banquete tras la recuperación de una enfermedad. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22526) respondió que celebrar un banquete tras la recuperación de una enfermedad es lícito según la sharia y se incluye dentro de las recomendaciones sobre la alimentación, evitando la extravagancia, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'organisation d'un festin pour célébrer une guérison. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22526) a répondu que célébrer une guérison est licite selon la charia et relève des recommandations alimentaires, à condition d'éviter toute extravagance, comme le précise la réponse."
  tr: "Bir soru soran kişi, hastalıktan iyileştikten sonra ziyafet düzenlenmesine ilişkin kararı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22526), iyileşme sonrası ziyafet düzenlemenin İslam hukukuna göre izin olduğunu ve İslam hukukuna göre önerilen yiyeceklerle beslenmeye tabi olduğunu, ancak cevapta açıklananları aşırıya kaçmamaya dikkat ettiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang aturan mengadakan pesta setelah sembuh dari sakit. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22526) menjawab bahwa mengadakan pesta setelah pemulihan diperbolehkan menurut hukum Islam dan termasuk dalam pemberian makanan yang direkomendasikan menurut hukum Islam, sambil memastikan tidak berlebihan dalam penjelasan jawaban."
