summary:
  ar: "غريب الحديث لأبي عبيد القاسم بن سلام، من أوائل ما كُتب في غريب الحديث، وعدّه بعضهم أولها لأن ما سبقه رسائل صغيرة وهو، كما يقول مؤلفه، خلاصة عمره في أربعين سنة من العمل. وأبو عبيد هو مؤلف «غريب المصنف» أول معجم للغريب. ولم يرتب كلماته هجائياً، وينقل الخطيب البغدادي أنه رتّبه على المسانيد، وهذا الترتيب لا يظهر بوضوح في الطبعات المتداولة."
  en: "Abu Ubayd al-Qasim ibn Sallam's Gharib al-Hadith, one of the first works on the rare words of the hadith and counted by some as the first, since earlier studies were short treatises while this book, in the author's words, sums up his life in forty years of work. Abu Ubayd also wrote al-Gharib al-musannaf, the first dictionary of rare words. He did not order the words alphabetically; al-Khatib al-Baghdadi reports a musnad order, which is not clearly visible in the printed editions."
  es: "El Gharib al-Hadith de Abu Ubayd al-Qasim ibn Sallam, una de las primeras obras sobre las palabras raras del hadiz y considerada por algunos la primera, pues los estudios anteriores eran tratados breves mientras que este libro, según su autor, resume su vida en cuarenta años de trabajo. Abu Ubayd escribió también el al-Gharib al-musannaf, el primer diccionario de palabras raras. No ordenó las palabras alfabéticamente; al-Jatib al-Bagdadi menciona un orden por musnad, que no se ve claramente en las ediciones impresas."
  fr: "Le Gharib al-Hadith d'Abu Ubayd al-Qasim ibn Sallam, l'une des premières œuvres sur les mots rares du hadith et tenue par certains pour la première, les études antérieures étant de courts traités alors que ce livre, selon l'auteur, résume sa vie en quarante ans de travail. Abu Ubayd écrivit aussi al-Gharib al-musannaf, le premier dictionnaire de mots rares. Il n'ordonna pas les mots alphabétiquement ; al-Khatib al-Baghdadi rapporte un ordre par musnad, que les éditions imprimées ne montrent pas clairement."
  ur: "ابو عبید قاسم بن سلام کی غریب الحدیث، حدیث کے غریب الفاظ پر لکھی گئی ابتدائی کتابوں میں سے ایک، اور بعض کے نزدیک پہلی، کیونکہ پہلے کے کام مختصر رسائل تھے جبکہ یہ کتاب، مصنف کے بقول، چالیس سال کی محنت میں ان کی عمر کا حاصل ہے۔ ابو عبید غریب المصنف کے بھی مصنف ہیں جو غریب الفاظ کی پہلی لغت ہے۔ انہوں نے الفاظ کو تہجی ترتیب پر نہیں رکھا؛ خطیب بغدادی مسانید کی ترتیب نقل کرتے ہیں جو چھپے ہوئے نسخوں میں واضح نہیں۔"
