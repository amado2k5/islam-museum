label: { ar: "مساعدة الفقراء من تبرعات المسجد", en: "Helping the poor from mosque donations", ur: "مسجد کے عطیات سے فقرا کی مدد", es: "Ayudar a los pobres con donaciones a la mezquita", fr: "Aider les pauvres grâce aux dons des mosquées", tr: "Cami bağışlarıyla yoksullara yardım", id: "Membantu orang miskin dari sumbangan masjid" }
summary:
  ar: "سؤال عن مساعدة الفقراء من الأموال التي يتبرع بها الناس لرعاية شؤون المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك يحرم لأن المتبرع بمنزلة الواقف وشرطه معتبر، وأن كفاية الفقراء تكون من خلال لجان الزكاة. أجابت الدائرة بأنه يحرم على لجان المسجد أن تصرف شيئًا من تبرعاته في غير ما جُمعت له، لأن صرف التبرعات يكون بحسب نية المتبرع وشرطه، والمتبرع بمنزلة الواقف، والأصل التزام شرط الواقف. ونقلت قول إمام الحرمين الجويني في نهاية المطلب إن المرجع إلى شرط الواقف في صفات المستحقين ومقاديرهم وترتيبهم، وقول الشيرازي في المهذب إن غلة الوقف تُصرف على شرط الواقف. وقالت إن للفقراء والمساكين حقًا معلومًا في أموال المسلمين، وإن على أهل كل حي أن يقوموا بكفاية محتاجيه، ويمكن كفايتهم من خلال لجان الزكاة العاملة في منطقتهم. وخلصت إلى تحريم صرف شيء من تبرعات المساجد للفقراء والمساكين، لأن ما جُمع لغرض معين لا يُصرف إلى غيره وشرط المتصدق معتبر."
  en: "A question about helping the poor from money people donate for the upkeep of a mosque, in which Jordan's General Iftaa Department answered that this is forbidden, because a donor stands in the place of an endower whose condition must be respected, and that the poor are to be provided for through zakat committees. The Department answered that mosque committees may not spend any of the mosque's donations on anything other than what they were collected for, because donations are spent according to the donor's intention and condition, the donor stands in the place of an endower, and an endower's condition must in principle be kept. It quoted Imam al-Haramayn al-Juwayni in Nihayat al-Matlab that the endower's condition governs the qualities, amounts and order of those entitled, and al-Shirazi in al-Muhadhdhab that an endowment's yield is spent according to the endower's condition. It said the poor and needy have a known right in Muslims' wealth, and the people of every neighbourhood should provide for those in need there, which can be done through the zakat committees working in their area. It concluded that spending any mosque donations on the poor and needy is forbidden, because what is collected for a specific purpose may not be spent on another and the donor's condition is binding."
  ur: "لوگوں کے مسجد کی دیکھ بھال کے لیے دیے گئے عطیات سے فقرا کی مدد کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ حرام ہے، کیونکہ عطیہ دینے والا وقف کرنے والے کے درجے میں ہے جس کی شرط معتبر ہے، اور فقرا کی کفالت زکات کمیٹیوں کے ذریعے ہونی چاہیے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد کمیٹیوں کے لیے مسجد کے عطیات میں سے کچھ بھی اس مقصد کے علاوہ خرچ کرنا حرام ہے جس کے لیے وہ جمع کیے گئے، کیونکہ عطیات عطیہ دینے والے کی نیت اور شرط کے مطابق خرچ ہوتے ہیں، عطیہ دینے والا وقف کرنے والے کے درجے میں ہے، اور اصل یہ ہے کہ وقف کرنے والے کی شرط کی پابندی کی جائے۔ اس نے نہایۃ المطلب میں امام الحرمین الجوینی کا قول نقل کیا کہ مستحقین کی صفات، مقدار اور ترتیب میں وقف کرنے والے کی شرط کی طرف رجوع کیا جائے، اور المہذب میں شیرازی کا قول کہ وقف کی آمدنی وقف کرنے والے کی شرط کے مطابق خرچ ہو۔ اس نے کہا کہ فقرا اور مساکین کا مسلمانوں کے مال میں معلوم حق ہے، اور ہر محلے کے لوگوں کو وہاں کے ضرورت مندوں کی کفالت کرنی چاہیے، جو ان کے علاقے میں کام کرنے والی زکات کمیٹیوں کے ذریعے ہو سکتی ہے۔ اس نے نتیجہ نکالا کہ مساجد کے عطیات میں سے کچھ بھی فقرا اور مساکین پر خرچ کرنا حرام ہے، کیونکہ جو کسی خاص مقصد کے لیے جمع ہو وہ دوسرے مقصد میں خرچ نہیں ہو سکتا اور صدقہ دینے والے کی شرط معتبر ہے۔"
  es: "Una pregunta sobre cómo ayudar a los pobres con el dinero que la gente dona para el mantenimiento de una mezquita, a la que el Departamento General de Iftaa de Jordania respondió que esto está prohibido, porque el donante ocupa el lugar del fideicomitente, cuya condición debe respetarse, y que los pobres deben ser atendidos a través de los comités de zakat. El Departamento respondió que los comités de la mezquita no pueden gastar ninguna de las donaciones de la mezquita para nada que no sea para lo que fueron recaudadas, porque las donaciones se gastan de acuerdo con la intención y la condición del donante, el donante ocupa el lugar del fideicomitente, y la condición de este último debe, en principio, respetarse. Citó al Imam al-Haramayn al-Juwayni en Nihayat al-Matlab, donde afirma que la condición del fideicomitente rige las cualidades, cantidades y el orden de los beneficiarios, y a al-Shirazi en al-Muhadhdhab, donde afirma que el rendimiento de una donación se gasta de acuerdo con la condición del fideicomitente. El informe señalaba que los pobres y necesitados tienen un derecho reconocido sobre la riqueza de los musulmanes, y que los habitantes de cada barrio deben proveer para quienes lo necesiten, lo cual puede hacerse a través de los comités de zakat que trabajan en su zona. Concluía que está prohibido destinar las donaciones de las mezquitas a los pobres y necesitados, ya que lo recaudado para un fin específico no puede utilizarse para otro y la condición del donante es vinculante."
  fr: "Concernant l'aide aux pauvres provenant des dons destinés à l'entretien d'une mosquée, le Département général de la Iftaa de Jordanie a statué que cela est interdit. En effet, le donateur se substitue au donateur dont les conditions doivent être respectées, et l'assistance aux pauvres doit être assurée par les comités de la zakat. Le Département a précisé que ces comités ne peuvent utiliser les dons de la mosquée à d'autres fins que celles pour lesquelles ils ont été collectés, car les dons sont dépensés conformément aux intentions et aux conditions du donateur. Ce dernier se substitue au donateur, et les conditions de ce dernier doivent être respectées. Le Département a cité l'imam al-Haramayn al-Juwayni dans Nihayat al-Matlab, selon lequel les conditions du donateur déterminent les qualités, les montants et l'ordre des bénéficiaires, ainsi qu'al-Shirazi dans al-Muhadhdhab, qui affirme que les revenus d'une dot sont dépensés conformément aux conditions du donateur. Il a été affirmé que les pauvres et les nécessiteux ont un droit reconnu sur les richesses des musulmans, et que les habitants de chaque quartier doivent subvenir aux besoins des plus démunis, notamment par le biais des comités de zakat locaux. Il a été conclu qu'il est interdit de dépenser les dons faits à la mosquée au profit des pauvres et des nécessiteux, car les sommes collectées pour un usage précis ne peuvent être utilisées à d'autres fins, et l'engagement du donateur est contraignant."
  tr: "Kürdün Genel Fetva Dairesi, cami işlerine bakmak için bağışlanan fonlardan yoksullara yardım edilmesi sorusuna yanıt verdi; çünkü bağışçının bağışçı statüsüne sahip olduğu ve durumu geçerli olduğu için bunun yasak olduğunu, yoksulların yeterliliğinin zekat komiteleri aracılığıyla olduğunu belirtti. Bakanlık, cami komitelerinin bağışlarının kendisi için toplanan miktar dışında hiçbir şeye harcamasının yasak olduğunu, çünkü bağışların bağışçının niyet ve şartına göre dağıtıldığını, bağışçının da bağışlayan gibi olduğunu ve varsayılan olarak bağışçının şartına uymak olduğunu yanıtladı. Tartışmanın sonunda İmam Al-Haramayn Al-Juwayni'den, bu atıfta yararlanıcıların nitelikleri, miktarları ve sıralaması ile ilgili olarak bağışlanın durumuna ve Al-Muhadhsare'de Şirazi'nin bağışların gelirlerinin bağışçının şartına göre harcandığına dair ifadesinden alıntı yaptı. Yoksulların ve muhtaçların Müslümanların servetine sahip bilinen bir hakkı olduğu, her mahalledeki insanların ihtiyaçlarını karşılaması gerektiği ve yeterliliklerinin bölgelerinde faaliyet gösteren zekat komiteleri aracılığıyla sağlanabileceği belirtildi. Caminin yoksullara ve muhtaçlara yaptığı bağışların harcanmasının yasak olduğu, çünkü belirli bir amaç için toplanan paranın başkalarına harcanmadığı ve bağışçının durumu geçerli olduğu sonucuna varıldı."
  id: "Mengenai bantuan kaum miskin dari dana yang disumbangkan oleh masyarakat untuk mengurus urusan masjid, Departemen Fatwa Umum Yordania menjawab bahwa hal ini dilarang karena donatur memegang status sebagai donatur dan kondisinya sah, serta kecukupan orang miskin melalui komite zakat. Departemen menjawab bahwa komite masjid dilarang menghabiskan donasinya selain yang telah dikumpulkan untuknya, karena donasi disalurkan sesuai dengan niat dan kondisi pemberi sumbangan, dan donatur seperti pemberi sumbangan, dan defaultnya adalah mematuhi syarat pemberi sumbangan. Departemen mengutip Imam Al-Haramayn Al-Juwayni di akhir diskusi bahwa referensi adalah pada kondisi pemberi wakaf terkait kualitas, jumlah, dan keteraturan penerima manfaat, serta pernyataan Shirazi dalam Al-Muhadhdhab bahwa hasil wakaf dibelanjakan sesuai dengan kondisi pemberi sumbangan. Surat tersebut menyatakan bahwa orang miskin dan membutuhkan memiliki hak atas kekayaan umat Muslim, dan bahwa masyarakat di setiap lingkungan harus memenuhi kebutuhan mereka, dan kecukupan mereka dapat diberikan melalui komite zakat yang beroperasi di wilayah mereka. Surat tersebut menyimpulkan bahwa melarang membelanjakan sumbangan masjid kepada orang miskin dan membutuhkan, karena apa yang dikumpulkan untuk tujuan tertentu tidak digunakan untuk orang lain, dan kondisi donatur dianggap sah."
