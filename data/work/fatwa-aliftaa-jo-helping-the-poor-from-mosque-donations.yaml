id: work/fatwa-aliftaa-jo-helping-the-poor-from-mosque-donations
class: work
kind: fatwa
label: { ar: "مساعدة الفقراء من تبرعات المسجد", en: "Helping the poor from mosque donations", ur: "مسجد کے عطیات سے فقرا کی مدد" }
summary:
  ar: "سؤال عن مساعدة الفقراء من الأموال التي يتبرع بها الناس لرعاية شؤون المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك يحرم لأن المتبرع بمنزلة الواقف وشرطه معتبر، وأن كفاية الفقراء تكون من خلال لجان الزكاة. أجابت الدائرة بأنه يحرم على لجان المسجد أن تصرف شيئًا من تبرعاته في غير ما جُمعت له، لأن صرف التبرعات يكون بحسب نية المتبرع وشرطه، والمتبرع بمنزلة الواقف، والأصل التزام شرط الواقف. ونقلت قول إمام الحرمين الجويني في نهاية المطلب إن المرجع إلى شرط الواقف في صفات المستحقين ومقاديرهم وترتيبهم، وقول الشيرازي في المهذب إن غلة الوقف تُصرف على شرط الواقف. وقالت إن للفقراء والمساكين حقًا معلومًا في أموال المسلمين، وإن على أهل كل حي أن يقوموا بكفاية محتاجيه، ويمكن كفايتهم من خلال لجان الزكاة العاملة في منطقتهم. وخلصت إلى تحريم صرف شيء من تبرعات المساجد للفقراء والمساكين، لأن ما جُمع لغرض معين لا يُصرف إلى غيره وشرط المتصدق معتبر."
  en: "A question about helping the poor from money people donate for the upkeep of a mosque, in which Jordan's General Iftaa Department answered that this is forbidden, because a donor stands in the place of an endower whose condition must be respected, and that the poor are to be provided for through zakat committees. The Department answered that mosque committees may not spend any of the mosque's donations on anything other than what they were collected for, because donations are spent according to the donor's intention and condition, the donor stands in the place of an endower, and an endower's condition must in principle be kept. It quoted Imam al-Haramayn al-Juwayni in Nihayat al-Matlab that the endower's condition governs the qualities, amounts and order of those entitled, and al-Shirazi in al-Muhadhdhab that an endowment's yield is spent according to the endower's condition. It said the poor and needy have a known right in Muslims' wealth, and the people of every neighbourhood should provide for those in need there, which can be done through the zakat committees working in their area. It concluded that spending any mosque donations on the poor and needy is forbidden, because what is collected for a specific purpose may not be spent on another and the donor's condition is binding."
  ur: "لوگوں کے مسجد کی دیکھ بھال کے لیے دیے گئے عطیات سے فقرا کی مدد کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ حرام ہے، کیونکہ عطیہ دینے والا وقف کرنے والے کے درجے میں ہے جس کی شرط معتبر ہے، اور فقرا کی کفالت زکات کمیٹیوں کے ذریعے ہونی چاہیے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد کمیٹیوں کے لیے مسجد کے عطیات میں سے کچھ بھی اس مقصد کے علاوہ خرچ کرنا حرام ہے جس کے لیے وہ جمع کیے گئے، کیونکہ عطیات عطیہ دینے والے کی نیت اور شرط کے مطابق خرچ ہوتے ہیں، عطیہ دینے والا وقف کرنے والے کے درجے میں ہے، اور اصل یہ ہے کہ وقف کرنے والے کی شرط کی پابندی کی جائے۔ اس نے نہایۃ المطلب میں امام الحرمین الجوینی کا قول نقل کیا کہ مستحقین کی صفات، مقدار اور ترتیب میں وقف کرنے والے کی شرط کی طرف رجوع کیا جائے، اور المہذب میں شیرازی کا قول کہ وقف کی آمدنی وقف کرنے والے کی شرط کے مطابق خرچ ہو۔ اس نے کہا کہ فقرا اور مساکین کا مسلمانوں کے مال میں معلوم حق ہے، اور ہر محلے کے لوگوں کو وہاں کے ضرورت مندوں کی کفالت کرنی چاہیے، جو ان کے علاقے میں کام کرنے والی زکات کمیٹیوں کے ذریعے ہو سکتی ہے۔ اس نے نتیجہ نکالا کہ مساجد کے عطیات میں سے کچھ بھی فقرا اور مساکین پر خرچ کرنا حرام ہے، کیونکہ جو کسی خاص مقصد کے لیے جمع ہو وہ دوسرے مقصد میں خرچ نہیں ہو سکتا اور صدقہ دینے والے کی شرط معتبر ہے۔"
