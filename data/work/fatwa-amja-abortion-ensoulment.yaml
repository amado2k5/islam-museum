id: work/fatwa-amja-abortion-ensoulment
class: work
kind: fatwa
label: { ar: "الإجهاض ونفخ الروح", en: "Abortion and the breathing of the soul", ur: "اسقاط حمل اور روح کا داخل ہونا", es: "El aborto y la respiración del alma" }
summary:
  ar: "سأل سائل من أين جاء ربط بعض علماء المسلمين للإجهاض بنفخ الروح والروح من أمر ربي. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83087 بتاريخ 11 نوفمبر 2010)⁩ أن كنه الروح وكيفيتها من أمر الله لكنها تدرك بآثارها فنحن نفرق بين الحياة والموت وبين الموتى والأحياء، وعندما تدب الروح في الجنين ويعرف ذلك بآثارها كحركة الجنين في الرحم يحرم إجهاضه بالإجماع كما يحرم الاعتداء على سائر الأحياء فلا تعارض في هذا الربط."
  en: "A questioner asked where the scholars' linking of abortion to ensoulment came from, since the soul is of God's affair. Dr. Salah al-Sawi (fatwa no. 83087, 11 November 2010) answered that the soul's essence and manner are indeed God's affair, yet the soul is known by its effects — we distinguish life from death and the living from the dead; when it enters the fetus, known by its effects such as movement in the womb, aborting it is forbidden by consensus like any assault on the living, so there is no contradiction in this linkage."
  ur: "ایک سائل نے پوچھا کہ علماء نے اسقاط حمل کا ربط روح کے داخل ہونے سے کیوں بنایا جبکہ روح اللہ کے امر میں سے ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83087، 11 نومبر 2010)⁩ کے مطابق روح کے آثار سے اس کا علم ہوتا ہے؛ جنین کی حرکت ظاہر ہونے پر اسقاط اجماعاً حرام ہے۔"
  es: "Un interlocutor preguntó de dónde provenía la vinculación que hacen los eruditos entre el aborto y la infusión del alma, puesto que el alma es asunto de Dios. El Dr. Salah al-Sawi (fatwa n.º 83087, 11 de noviembre de 2010) respondió que la esencia y la naturaleza del alma son, en efecto, asunto de Dios, pero el alma se reconoce por sus efectos: distinguimos la vida de la muerte y a los vivos de los muertos; cuando entra en el feto, y se reconoce por sus efectos, como el movimiento en el útero, el aborto está prohibido por consenso, al igual que cualquier agresión contra los vivos, por lo que no hay contradicción en esta vinculación."
