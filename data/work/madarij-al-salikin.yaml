summary:
  ar: "شرح ابن قيم الجوزية ⁦(691–751هـ)⁩ على «منازل السائرين» لأبي إسماعيل الهروي الأنصاري، يتتبع منازله المائة في عشرة أقسام بالشرح والتعليق والمعارضة، ويبني عليها كلاماً واسعاً في التوحيد والأسماء والصفات والعبودية وأعمال القلوب، منطلقاً من آية «إياك نعبد وإياك نستعين» من الفاتحة."
  en: "Ibn Qayyim al-Jawziyya's (691–751 AH) commentary on Manazil al-Sa'irin by Abu Isma'il al-Harawi al-Ansari, following its hundred stations in ten sections with explanation, notes and objections, and building on them a wide discussion of God's oneness, names and attributes, servanthood and the acts of the heart, starting from the verse 'You alone we worship and You alone we ask for help' in al-Fatiha."
