structure: "Opens with the meanings of al-Fatiha (the kinds of tawhid, prophethood, recompense, the cure of hearts and bodies, the refutation of those who leave the straight path), then follows al-Harawi's hundred stations in ten sections of ten — beginnings, doors, dealings, character, principles, valleys, states, friendships, realities and ends — each with three degrees (for the common, the elect and the elect of the elect). The Dar al-Sumay'i edition divides it into five parts; part 1 runs to the section on minor and major sins, part 2 to the station of refinement, part 3 from steadfastness to intimacy, part 4 from remembrance, part 5 from unveiling to the end."
