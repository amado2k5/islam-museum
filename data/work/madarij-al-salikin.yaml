summary:
  ar: "شرح ابن قيم الجوزية ⁦(691–751هـ)⁩ على «منازل السائرين» لأبي إسماعيل الهروي الأنصاري، يتتبع منازله المائة في عشرة أقسام بالشرح والتعليق والمعارضة، ويبني عليها كلاماً واسعاً في التوحيد والأسماء والصفات والعبودية وأعمال القلوب، منطلقاً من آية «إياك نعبد وإياك نستعين» من الفاتحة."
  en: "Ibn Qayyim al-Jawziyya's (691–751 AH) commentary on Manazil al-Sa'irin by Abu Isma'il al-Harawi al-Ansari, following its hundred stations in ten sections with explanation, notes and objections, and building on them a wide discussion of God's oneness, names and attributes, servanthood and the acts of the heart, starting from the verse 'You alone we worship and You alone we ask for help' in al-Fatiha."
  es: "El comentario de Ibn Qayyim al-Jawziyya (691–751 AH) sobre Manazil al-Sa'irin de Abu Isma'il al-Harawi al-Ansari, que sigue sus cien estaciones en diez secciones con explicaciones, notas y objeciones, y construye sobre ellas una amplia discusión sobre la unicidad de Dios, sus nombres y atributos, el servicio y los actos del corazón, comenzando desde el versículo 'Solo a Ti adoramos y solo a Ti pedimos ayuda' en al-Fatiha."
  fr: "Le commentaire d'Ibn Qayyim al-Jawziyya (691-751 AH) sur Manazil al-Sa'irin d'Abu Isma'il al-Harawi al-Ansari, suivant ses cent stations en dix sections avec explications, notes et objections, et s'appuyant sur elles sur une large discussion de l'unicité de Dieu, de ses noms et attributs, du service et des actes du cœur, commençant par le verset « Toi seul que nous adorons et Toi seul dont nous demandons de l'aide » dans al-Fatiha."
