label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن توحيد بدايات الشهور القمرية", en: "IIFA resolution on unifying the starts of the lunar months", ur: "اکیڈمی کی قرارداد: قمری مہینوں کے آغاز کی یکسانیت", es: "Resolución de la IIFA sobre la unificación de los inicios de los meses lunares", fr: "Résolution de l'IIFA sur l'unification du début des mois lunaires", tr: "Uluslararası İslami Fıkıh Akademisi'nin Ay aylarının başlangıcının birleştirilmesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penyatuan awal bulan-bulan lunar" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩ بعد دراسة الدورة الثانية: إذا ثبتت الرؤية في بلد وجب على المسلمين الالتزام بها ولا عبرة لاختلاف المطالع لعموم الخطاب بالأمر بالصوم والإفطار، ويجب الاعتماد على الرؤية ويستعان بالحساب الفلكي والمراصد مراعاة للأحاديث والحقائق العلمية."
  en: "IIFA's third-session resolution (Amman, October 1986), after the second session's study: when the sighting is established in a country Muslims must follow it, and differing horizons carry no weight given the general address commanding fasting and breaking the fast; sighting is to be relied upon, assisted by astronomical calculation and observatories, heeding the hadiths and scientific facts."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: ایک ملک میں رویت ثابت ہو جائے تو اس پر عمل واجب؛ رویت کو بنیاد بنانا اور فلکی حساب سے مدد لینا مقرر کیا۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986), tras el estudio de la segunda sesión: cuando se establece la observación astronómica en un país, los musulmanes deben seguirla, y las diferencias en los horizontes no tienen importancia dada la exhortación general que ordena el ayuno y la ruptura del mismo; se debe confiar en la observación astronómica, con la ayuda de cálculos astronómicos y observatorios, teniendo en cuenta los hadices y los hechos científicos."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986), après l'étude de la deuxième session: lorsque l'observation est établie dans un pays, les musulmans doivent la suivre, et les horizons différents n'ont aucune importance étant donné l'adresse générale ordonnant le jeûne et la rupture du jeûne; l'observation doit être prise en compte, assistée par le calcul astronomique et les observatoires, en tenant compte des hadiths et des faits scientifiques."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986) ikinci oturumu inceledikten sonra kararı: Eğer bir ülkede görülme doğrulanırsa, Müslümanlar buna uymak zorundadır ve oruç ile oruç kesme emrindeki genel söylemin farklı yorumları nedeniyle bir endişe yoktur. Gözleme güvenmek ve hadisler ile bilimsel gerçekleri dikkate almak için astronomik hesaplamalar ve gözlemevlerine dayanmak gerekir."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiga (Amman, Oktober 1986) setelah mempelajari sesi kedua: Jika penampakan dikonfirmasi di suatu negara, umat Muslim harus mematuhinya, dan tidak ada kekhawatiran karena perbedaan interpretasi wacana umum yang memerintahkan puasa dan berbuka puasa. Perlu mengandalkan penampakan tersebut, dan mengandalkan perhitungan astronomi serta observatorium untuk memperhitungkan hadits dan fakta ilmiah."
