summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩ بعد دراسة الدورة الثانية: إذا ثبتت الرؤية في بلد وجب على المسلمين الالتزام بها ولا عبرة لاختلاف المطالع لعموم الخطاب بالأمر بالصوم والإفطار، ويجب الاعتماد على الرؤية ويستعان بالحساب الفلكي والمراصد مراعاة للأحاديث والحقائق العلمية."
  en: "IIFA's third-session resolution (Amman, October 1986), after the second session's study: when the sighting is established in a country Muslims must follow it, and differing horizons carry no weight given the general address commanding fasting and breaking the fast; sighting is to be relied upon, assisted by astronomical calculation and observatories, heeding the hadiths and scientific facts."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: ایک ملک میں رویت ثابت ہو جائے تو اس پر عمل واجب؛ رویت کو بنیاد بنانا اور فلکی حساب سے مدد لینا مقرر کیا۔"
