label: { ar: "تحفة الأشراف بمعرفة الأطراف", en: "Tuhfat al-Ashraf bi-Ma'rifat al-Atraf", ur: "تحفۃ الاشراف بمعرفۃ الاطراف" }
summary:
  ar: "كتاب المزي في الأطراف يجمع مسانيد الصحابة ممن جاءت أسانيدهم في الكتب الستة وغيرها مرتبةً على حروف المعجم، مع أطراف الأحاديث قبل أسانيدها، وهو من أعظم كتب الفن لأنه يضم أسانيد «السنن الكبرى» للنسائي التي لم تُطبع قطعاً {cite:encyclopaedia-of-islam-2 vol. 7 p. 240-241}؛ وألفه في ستة أسفار {cite:tarikh-islam-dhahabi p. 489}."
  en: "Al-Mizzi's atraf work collecting the musnads of the Companions whose isnads occur in the Six Books and a few minor collections, arranged alphabetically with the taraf of each hadith preceding its isnads; it is indispensable because it alone preserves the isnads of al-Nasa'i's never-printed al-Sunan al-Kubra {cite:encyclopaedia-of-islam-2 vol. 7 p. 240-241}; he composed it in six volumes {cite:tarikh-islam-dhahabi p. 489}."
  ur: "مزی کی اطراف کی کتاب جو ان صحابہ کے مسانید جمع کرتی ہے جن کی اسانید کتبِ ستہ اور چند دوسری کتابوں میں آئیں، حروفِ تہجی کے ترتیب سے، ہر حدیث کی طرف سے پہلے اس کی اسناد؛ یہ اس لیے ناگزیر ہے کہ یہ نسائی کی «السنن الکبریٰ» کی اسانید محفوظ رکھتی ہے جو کبھی چھپی نہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 240-241}؛ انہوں نے اسے چھ جلدوں میں تصنیف کیا {cite:tarikh-islam-dhahabi p. 489}۔"
