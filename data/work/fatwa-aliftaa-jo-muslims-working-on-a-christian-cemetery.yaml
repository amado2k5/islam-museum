id: work/fatwa-aliftaa-jo-muslims-working-on-a-christian-cemetery
class: work
kind: fatwa
label: { ar: "حكم عمل المسلم في مقابر غير المسلمين", en: "Muslim workers building a Christian cemetery", ur: "مسلمان مزدوروں کا مسیحی قبرستان کی تعمیر میں کام کرنا" }
summary:
  ar: "سؤال عن جواز عمل العمال المسلمين في بناء مقبرة مسيحية يُدفن فيها الأموات المسيحيون، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز للعمال المسلمين العمل في بناء وتجهيز مقابر غير المسلمين من المسيحيين في بلادنا وغيرهم، فإن ذلك من البر وحسن المعاملة، والأصل في معاملة غير المسلمين العدل والإحسان بنص آية الممتحنة، وهو حق من حقوق أهل الذمة ومظهر من مظاهر تكريم الله للإنسان بآية الإسراء، وأن السنة والآثار وأقوال الفقهاء تشرع للمسلم تقديم يد العون بأجرة أو تطوعًا لغير المسلمين فيما يحقق الكرامة الإنسانية ومنه دفنهم، فقد أمر النبي عليًا بدفن أبي طالب وقد مات على غير الإسلام كما في سنن النسائي، وقال ابن عباس في نصراني له ابن مسلم إنه كان ينبغي له أن يتبعه ويدفنه، ونقلت عن الجويني في نهاية المطلب أن تكفين الميت غير المسلم ودفنه من فروض الكفاية على المسلمين إن لم يكن له ولي من دينه، وعن الشربيني في مغني المحتاج وجوب تكفين الذمي ودفنه من بيت المال ثم على المسلمين، وعن البهوتي في كشاف القناع أنه لا بأس أن يُحفر للذمي قبر بالأجرة، فلا حرج على المسلم في العمل في مقابر غير المسلمين."
  en: "A question whether Muslim labourers may work on building a Christian cemetery in which Christian dead will be buried; Jordan's General Iftaa Department answered that Muslim workers may build and prepare cemeteries for non-Muslims, including the Christians of their country and others, since this is kindness and good dealing, the principle in dealing with non-Muslims being justice and kindness by the text of the verse of al-Mumtahana; it is among the rights of protected non-Muslims and a sign of God's honouring of the human being in the verse of al-Isra. The Sunna, the reports of the early Muslims and the jurists' statements allow a Muslim to lend a hand, whether for pay or voluntarily, to non-Muslims in what upholds human dignity, including their burial: the Prophet ordered Ali to bury Abu Talib, who died outside Islam, as in al-Nasa'i's Sunan, and Ibn Abbas said of a Christian with a Muslim son that the son should have followed his bier and buried him. The Department quoted al-Juwayni in Nihayat al-Matlab that shrouding and burying a non-Muslim who has no guardian of his own faith is a collective duty on the Muslims, al-Shirbini in Mughni al-Muhtaj that the sounder view is that shrouding and burying a protected non-Muslim is obligatory from the treasury and then on the Muslims, and al-Buhuti in Kashshaf al-Qina' that there is no harm in digging a grave for a protected non-Muslim for a fee; so there is no blame on a Muslim who works on non-Muslim cemeteries."
  ur: "اس بارے میں سوال کہ کیا مسلمان مزدور ایسے مسیحی قبرستان کی تعمیر میں کام کر سکتے ہیں جس میں مسیحی مردے دفن ہوں گے؛ اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ مسلمان مزدور ہمارے ملک کے مسیحیوں اور دوسروں سمیت غیر مسلموں کے قبرستانوں کی تعمیر اور تیاری میں کام کر سکتے ہیں، کیونکہ یہ نیکی اور اچھا سلوک ہے، اور غیر مسلموں سے معاملے میں اصل سورہ ممتحنہ کی نص سے عدل اور احسان ہے؛ یہ اہلِ ذمہ کے حقوق میں سے اور سورہ اسراء کی آیت میں اللہ کے انسان کو عزت دینے کی علامت ہے۔ سنت، آثار اور فقہا کے اقوال مسلمان کے لیے جائز قرار دیتے ہیں کہ وہ اجرت پر یا رضاکارانہ طور پر غیر مسلموں کی ان کاموں میں مدد کرے جو انسانی وقار قائم کریں، جن میں ان کی تدفین شامل ہے: نبی نے علی کو ابو طالب کو دفن کرنے کا حکم دیا جو اسلام پر نہیں مرے تھے، جیسا کہ نسائی کی سنن میں ہے، اور ابن عباس نے ایک مسیحی کے بارے میں جس کا بیٹا مسلمان تھا کہا کہ بیٹے کو اس کے جنازے کے ساتھ جانا اور اسے دفن کرنا چاہیے تھا۔ ڈیپارٹمنٹ نے جوینی کی نہایۃ المطلب سے نقل کیا کہ غیر مسلم میت کو، جس کا اپنے دین کا کوئی ولی نہ ہو، کفن دینا اور دفن کرنا مسلمانوں پر فرضِ کفایہ ہے، شربینی کی مغنی المحتاج سے کہ اصح قول پر ذمی کو کفن دینا اور دفن کرنا بیت المال سے پھر مسلمانوں پر واجب ہے، اور بہوتی کی کشاف القناع سے کہ ذمی کے لیے اجرت پر قبر کھودنے میں کوئی مضائقہ نہیں؛ لہٰذا غیر مسلموں کے قبرستانوں میں کام کرنے والے مسلمان پر کوئی حرج نہیں۔"
