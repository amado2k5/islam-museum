id: work/fatwa-dar-alifta-eg-diya-kaffara-for-abortion
class: work
kind: fatwa
label: { ar: "مدى وجوب الدية أو الكفارة بالإجهاض", en: "Whether diya or expiation is due for abortion", ur: "اسقاط جنین پر دیت یا کفارہ کی وجوب", es: "Si se debe hacer una expiación o una diya por el aborto", fr: "Que ce soit une diya ou une expiation due pour l'avortement" }
summary:
  ar: "سائل سأل عن وجوب الدية أو الكفارة بالإجهاض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20754)⁩ أنه لا تجب الدية ⁦(الغرة)⁩ ولا الكفارة على الزوجة بإجهاض الجنين الذي بلغ مائة وعشرين يومًا فما بعدها من الحمل على ما فصّل الجواب من الشرط والمقدار."
  en: "A questioner asked whether diya or expiation is due for abortion. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20754) answered that neither the diya (the ghurra) nor the kaffara falls on the wife for aborting a foetus that reached 120 days or beyond — with the conditions and measure set out in the answer."
  ur: "ایک سائل نے اسقاط جنین پر دیت یا کفارے کی وجوب پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20754)⁩ نے جواب دیا کہ ایک سو بیس دن یا اس سے زیادہ کے جنین کے اسقاط پر بیوی پر دیت ⁦(غرة)⁩ اور کفارہ واجب نہیں — شرائط اور مقدار جواب میں ہیں۔"
  es: "Una persona preguntó si se debe realizar la expiación (diya) por un aborto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20754) respondió que ni la expiación (ghurra) ni la kaffara recaen sobre la esposa por abortar un feto que alcanzó los 120 días o más, con las condiciones y medidas establecidas en la respuesta."
  fr: "Une personne a demandé si une expiation (diya) était due en cas d'avortement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20754) a répondu que ni la diya (ghurra) ni la kaffara ne sont dues à l'épouse pour un avortement survenu après 120 jours de grossesse, sous réserve des conditions et des modalités précisées dans la réponse."
