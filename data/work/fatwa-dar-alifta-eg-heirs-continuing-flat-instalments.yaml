class: work
kind: fatwa
label: { ar: "حكم استمرار الورثة في دفع ثمن شقة بالتقسيط بعد وفاة صاحبها", en: "Heirs continuing instalments on a flat after the owner's death", ur: "مالک کی وفات کے بعد ورثاء کا فلیٹ کی اقساط جاری رکھنا" }
summary:
  ar: "سائل سأل عن استمرار الورثة في دفع ثمن شقة بالتقسيط بعد وفاة مشتريها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22005)⁩ أن الأقساط التي تأخر المتوفى عن سدادها في موعدها حال حياته تُعد من الديون الحالة التي تخرج من التركة على ما فصّل الجواب من أحكام الميراث والدين."
  en: "A questioner asked about heirs continuing instalments on a flat after the buyer's death. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22005) answered that the instalments the deceased fell behind on during his life are immediate debts paid out of the estate; the answer sets out the rules of inheritance and debt in this case."
  ur: "ایک سائل نے خریدار کی وفات کے بعد ورثاء کے فلیٹ کی اقساط جاری رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22005)⁩ نے جواب دیا کہ وہ اقساط جو میت زندگی میں ادا نہ کر سکا ترکہ سے ادا ہونے والے قرضوں میں ہیں؛ جواب میں اس صورت میں میراث اور قرض کے احکام بیان ہوئے۔"
