id: work/fatwa-amja-angel-and-devil-touches
class: work
kind: fatwa
label: { ar: "لمة الملك ولمة الشيطان", en: "The angel's touch and the devil's touch — the hadith", ur: "فرشتے اور شیطان کے وسوسے — حدیث کی شرح", es: "El toque del ángel y el toque del diablo — el hadiz" }
summary:
  ar: "سأل سائل توضيح حديث إن للملك لمة وإن للشيطان لمة فلمة الملك تصديق بالحق ووعد بالخير ولمة الشيطان تكذيب بالحق ووعد بالشر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77750 بتاريخ 7 فبراير 2009)⁩ أن معنى الحديث كما هو ظاهر أن ما يقع في القلب بواسطة الملك إيعاد بالخير كالصلاة والصوم وتصديق بالحق ككتب الله ورسوله، وأما ما يقع من الشيطان إبليس أو بعض جنوده فإيعاد بالشر كالكفر والفسق والظلم وتكذيب بالحق في حق الله أو حق الخلق أو بالأمر الثابت كالتوحيد والنبوة والبعث والقيامة والنار والجنة، ولمة الشيطان تسمى وسوسة ولمة الملك تسمى إلهامًا."
  en: "A questioner asked for the meaning of 'the angel has a touch and the devil has a touch: the angel's is affirmation of truth and promise of good; the devil's is denial of truth and promise of evil'. Dr. Salah al-Sawi (fatwa no. 77750, 7 February 2009) answered that what falls into the heart by way of the angel is a promise of good — prayer, fasting — and an affirmation of truth — God's books and His messenger; what falls from the devil — Iblis or his soldiers — is a promise of evil — disbelief, wickedness, injustice — and a denial of truth in God's right, creation's right, or the established matter such as tawhid, prophethood, resurrection, the Fire and the Garden; the devil's touch is called waswasa, the angel's ilham."
  ur: "ایک سائل نے «فرشتے اور شیطان کا وسوسہ» حدیث کی شرح پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77750، 7 فروری 2009)⁩ کے مطابق فرشتے کا وسوسہ خیر کی بشارت اور حق کی تصدیق ہے؛ شیطان کا وسوسہ شر کا وعدہ اور حق کا انکار ہے۔"
  es: "Un consultante preguntó por el significado de «el ángel tiene un toque y el diablo tiene un toque: el del ángel es una afirmación de la verdad y una promesa de bien; el del diablo es una negación de la verdad y una promesa de mal». El Dr. Salah al-Sawi (fatwa n.º 77750, 7 de febrero de 2009) respondió que lo que cae en el corazón por medio del ángel es una promesa de bien —la oración, el ayuno— y una afirmación de la verdad —los libros de Dios y Su mensajero—; lo que cae del diablo —Iblis o sus soldados— es una promesa de mal —la incredulidad, la maldad, la injusticia— y una negación de la verdad en el derecho de Dios, el derecho de la creación o los asuntos establecidos como el tawhid, la profecía, la resurrección, el Fuego y el Jardín; el toque del diablo se llama waswasa, el del ángel, ilham."
