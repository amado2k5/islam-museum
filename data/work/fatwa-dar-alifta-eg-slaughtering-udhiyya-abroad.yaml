id: work/fatwa-dar-alifta-eg-slaughtering-udhiyya-abroad
class: work
kind: fatwa
label: { ar: "حكم ذبح الأضحية في غير بلد المضحي", en: "Slaughtering the udhiyya in a country other than the sacrificer's", ur: "قربانی کرنے والے کے ملک کے علاوہ قربانی ذبح کرنا", es: "Sacrificar al udhiyya en un país distinto al del sacrificador.", fr: "Abattre l'udhiyya dans un pays autre que celui du sacrificateur" }
summary:
  ar: "سائل سأل عن ذبح الأضحية في غير بلد المضحي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20819)⁩ أن التكليف بالتضحية أو العقيقة أو النذر يسقط بعجز المسلم عنه وعدم القدرة وبيّن الجواب حكم الذبح في غير بلده على وجهه."
  en: "A questioner asked about slaughtering the udhiyya in a country other than the sacrificer's own. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20819) answered that the duty of sacrifice, aqiqa or vow lapses with inability, and the answer sets out the ruling on slaughter abroad."
  ur: "ایک سائل نے قربانی کرنے والے کے اپنے ملک کے علاوہ ذبح کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20819)⁩ نے جواب دیا کہ عدم استطاعت پر قربانی عقیقہ اور نذر کا تکلف ساقط ہوتا ہے اور جواب میں بیرون ملک ذبح کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre la posibilidad de sacrificar a la udhiyya en un país distinto al del sacrificador. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20819) respondió que el deber del sacrificio, aqiqa o voto se extingue en caso de incapacidad, y la respuesta expone la normativa sobre el sacrificio en el extranjero."
  fr: "Un internaute a posé une question concernant l'abattage de l'udhiyya dans un pays autre que celui du sacrificateur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20819) a répondu que le devoir de sacrifice, l'aqiqa ou le vœu, s'éteint en cas d'incapacité, et la réponse expose la règle concernant l'abattage à l'étranger."
