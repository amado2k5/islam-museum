label: { ar: "عون الباري لحل أدلة البخاري", en: "'Awn al-Bari li-Hall Adillat al-Bukhari", ur: "عون الباری لحل ادلۃ البخاری" }
summary:
  ar: "شرح أبي الطيب صديق بن حسن بن علي الحسيني القنوجي البخاري على «التجريد الصريح لأحاديث الجامع الصحيح» لأحمد الشرجي الزبيدي، طُبع على هامش «نيل الأوطار» للشوكاني؛ ويذكر مؤلفه في آخر كتاب الجهاد أنه أتمه، وبه تم النصف الأول من الشرح، في غرة شعبان 1293هـ ببلدة بهوبال، وأن التنصيف من تجزئته هو {cite:nayl-awtar-awn-bari-hamish j.5 p. 2} {cite:nayl-awtar-awn-bari-hamish j.5 p. 380}."
  en: "Abu al-Tayyib Siddiq b. Hasan b. 'Ali al-Husayni al-Qannawji al-Bukhari's commentary on Ahmad al-Sharji al-Zabidi's al-Tajrid al-Sarih li-Ahadith al-Jami' al-Sahih, printed in the margin of al-Shawkani's Nayl al-Awtar; at the end of the Book of Jihad the author writes that he finished it — completing the first half of the commentary — on 1 Sha'ban 1293 AH in Bhopal, and that the division into halves is his own {cite:nayl-awtar-awn-bari-hamish j.5 p. 2} {cite:nayl-awtar-awn-bari-hamish j.5 p. 380}."
  ur: "ابو الطیب صدیق بن حسن بن علی حسینی قنوجی بخاری کی احمد شرجی زبیدی کی «التجرید الصریح لاحادیث الجامع الصحیح» پر شرح، جو شوکانی کی «نیل الاوطار» کے حاشیے پر چھپی؛ مصنف کتاب الجہاد کے آخر میں لکھتے ہیں کہ انہوں نے اسے — اور اس کے ساتھ شرح کا پہلا نصف — یکم شعبان 1293ھ کو بھوپال میں مکمل کیا، اور یہ تقسیم ان کی اپنی ہے {cite:nayl-awtar-awn-bari-hamish j.5 p. 2} {cite:nayl-awtar-awn-bari-hamish j.5 p. 380}۔"
