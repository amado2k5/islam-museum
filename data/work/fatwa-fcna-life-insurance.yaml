label: { ar: "هل التأمين على الحياة حلال؟", en: "Is Life Insurance Halal?", ur: "کیا لائف انشورنس حلال ہے؟", es: "¿Es halal el seguro de vida?" }
summary:
  ar: "سؤال عن حكم شراء تأمين على الحياة من شركات التأمين التقليدية في أمريكا الشمالية. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر بتاريخ 11 نوفمبر 2026)⁩ بأن وثائق التأمين على الحياة من الشركات التقليدية في أمريكا الشمالية جائزة بشرط ألا تتضمن ربا، وهو حكم يخص سياق السوق الأمريكية كما نص عليه جواب المجلس."
  en: "A question about the ruling on buying life insurance from conventional insurance companies in North America. The Fiqh Council of North America (published 11 November 2026) answered that life-insurance policies from conventional companies in North America are permissible provided they do not involve riba — a ruling the council's answer expressly scopes to the North-American market."
  ur: "شمالی امریکہ کی روایتی انشورنس کمپنیوں سے لائف انشورنس خریدنے کے حکم کا سوال۔ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ 11 نومبر 2026)⁩ نے جواب دیا کہ شمالی امریکہ کی روایتی کمپنیوں کی لائف انشورنس پالیسیاں جائز ہیں بشرطیکہ ان میں سود نہ ہو — یہ حکم کونسل کے جواب کے مطابق خاص طور پر امریکی بازار کے سیاق میں ہے۔"
  es: "Una pregunta sobre la normativa relativa a la compra de seguros de vida a compañías de seguros convencionales en Norteamérica. El Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 11 de noviembre de 2026) respondió que las pólizas de seguro de vida de compañías convencionales en Norteamérica son permisibles siempre que no impliquen usura (riba), una normativa que la respuesta del consejo aplica expresamente al mercado norteamericano."
