summary:
  ar: "أبيات في ديوان الحماسة من الطويل على روي الهمزة، تقدّمها الطبعة بقولها «وقال قيس بن الخطيم» {{cite:hamasa-abu-tammam-ed-1916 p.49}}."
  en: "Verses in the Diwan al-Hamasa in the tawil metre on the rhyme hamza, introduced in the edition with \"and Qays ibn al-Khatim said\" {{cite:hamasa-abu-tammam-ed-1916 p.49}}."
  es: "Versos del Diwan al-Hamasa en metro tawil sobre la rima hamza, introducidos en la edición con \"y Qays ibn al-Khatim dijo\" {{cite:hamasa-abu-tammam-ed-1916 p.49}}."
  fr: "Versets du Diwan al-Hamasa en mètre tawil sur la rime hamza, introduits dans l'édition avec « et Qays ibn al-Khatim a dit » {{cite:hamasa-abu-tammam-ed-1916 p.49}}."
  ur: "نظم حمزہ پر دیوان الحماسہ میں تاویل میٹر میں آیات، ایڈیشن میں \"اور قیس ابن الخطیم نے کہا\" کے ساتھ متعارف کرایا ہے"
  tr: "Hamza rivayetine göre El-Tawil'den Hamasa Diwanı'ndaki dizeler, öncesinde şu ifadeyle devam etmiştir: \"Kays ibn al-Khatim şöyle dedi\" {{cite:hamasa-abu-tammam-ed-1916 s.49}}."
  id: "Ayat-ayat dalam Diwan Hamasa dari Al-Tawil menurut riwayat Hamza, didahului oleh edisi dengan frasa: \"Qays ibn al-Khatim berkata\" {{cite:hamasa-abu-tammam-ed-1916 hlm.49}}."
