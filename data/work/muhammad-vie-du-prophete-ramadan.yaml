summary:
  ar: "سيرة للنبي بالفرنسية لطارق رمضان تستخلص منها دروساً روحية ومعاصرة، صدرت عن دار شاتليه بباريس سنة 2006، وترجمت إلى الإنجليزية بعنوان «على خطى النبي» ⁦(مطبعة جامعة أكسفورد 2007)⁩."
  en: "A French life of the Prophet by Tariq Ramadan that draws spiritual and contemporary lessons from it, published by Presses du Châtelet, Paris, in 2006, and translated into English as In the Footsteps of the Prophet (Oxford University Press, 2007)."
  ur: "طارق رمضان کی فرانسیسی سیرتِ نبوی جو اس سے روحانی اور عصری اسباق اخذ کرتی ہے؛ پریس دو شاتلے، پیرس سے 2006ء میں شائع ہوئی، اور انگریزی میں «اِن دی فٹ اسٹیپس آف دی پرافٹ» ⁦(آکسفورڈ یونیورسٹی پریس، 2007ء)⁩ کے نام سے ترجمہ ہوئی۔"
  es: "Una biografía francesa del Profeta escrita por Tariq Ramadan que extrae lecciones espirituales y contemporáneas de ella, publicada por Presses du Châtelet, París, en 2006, y traducida al inglés como In the Footsteps of the Prophet (Oxford University Press, 2007)."
  fr: "Une biographie française du Prophète par Tariq Ramadan qui en tire des leçons spirituelles et contemporaines, publiée par les Presses du Châtelet, Paris, en 2006, et traduite en anglais sous le titre In the Footsteps of the Prophet (Oxford University Press, 2007)."
  tr: "Tariq Ramadan'ın Fransızca olarak yazdığı ve ruhani ve çağdaş derslerin alındığı Peygamber'in biyografisi, 2006'da Paris'teki Châtelet tarafından yayımlandı ve İngilizceye 'In the Footsteps of the Prophet' (Oxford University Press 2007) adıyla çevrildi."
  id: "Biografi Nabi dalam bahasa Prancis oleh Tariq Ramadan, dari mana pelajaran spiritual dan kontemporer diambil, diterbitkan oleh Châtelet di Paris pada tahun 2006, dan diterjemahkan ke dalam bahasa Inggris sebagai 'In the Footsteps of the Prophet' (Oxford University Press 2007)."
