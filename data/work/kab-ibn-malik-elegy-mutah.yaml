label: { ar: "مرثية كعب بن مالك في شهداء مؤتة", en: "Ka'b ibn Malik's elegy for the Mu'tah martyrs", es: "Elegía de Ka'b ibn Malik por los mártires de Mu'tah", fr: "Élégie de Ka'b ibn Malik pour les martyrs de Mu'tah", ur: "کعب بن مالک کا متعہ شہداء کے لیے عزاداری" }
summary:
  ar: "قصيدة لكعب بن مالك الأنصاري يبكي فيها شهداء مؤتة، وصف فيها صبرهم وإقدامهم في سبيل الله. رواها ابن إسحاق في سياق حديثه عن غزوة مؤتة."
  en: "Elegy by Ka'b ibn Malik al-Ansari praising the endurance and courage of the Mu'tah martyrs. Transmitted by Ibn Ishaq within the Mu'tah narrative."
  es: "Elegía de Ka'b ibn Malik al-Ansari en alabanza de la resistencia y el valor de los mártires de Mu'tah. Transmitida por Ibn Ishaq dentro de la narración de Mu'tah."
  fr: "Élégie de Ka'b ibn Malik al-Ansari louant l'endurance et le courage des martyrs Mu'tah. Transmise par Ibn Ishaq dans le récit de Mu'tah."
  ur: "کعب بن مالک الانصاری کی طرف سے متعہ کے شہداء کی استقامت اور ہمت کی تعریف۔ اسے ابن اسحاق نے متعہ روایت میں نقل کیا ہے۔"
