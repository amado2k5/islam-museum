id: work/fatwa-amja-yawning-in-prayer
class: work
kind: fatwa
label: { ar: "التثاؤب في الصلاة", en: "Yawning — holding the hand over the mouth, in prayer or out", ur: "جمخی — منہ پر ہاتھ، نماز میں یا باہر" }
summary:
  ar: "سأل سائل عن حديث أبي هريرة في سنن أبي داود في التثاؤب. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87033 بتاريخ 29 يونيو 2012)⁩ أنه جاء في صحيح مسلم إذا تثاءب أحدكم فليمسك بيده على فمه فإن الشيطان يدخل ونقلت قول النووي أنه سواء كان التثاؤب في الصلاة أو خارجها يستحب كفه ما أمكن على ما فصّل الجواب."
  en: "A questioner asked about Abu Hurayra's yawning hadith in Sunan Abi Dawud. AMJA's fatwa committee (fatwa no. 87033, 29 June 2012) answered that Sahih Muslim has 'if one of you yawns let him hold his hand over his mouth, for the devil enters,' quoting al-Nawawi that whether in prayer or out it is liked to stifle it as far as possible — as the answer details."
  ur: "جمخی کا حکم؟ لجنة الفتوى ⁦(فتویٰ 87033، 29 جون 2012)⁩ نے صحیح مسلم کی حدیث اور النووی کا قول نقل کیا: نماز میں یا باہر دبانا مستحب۔"
