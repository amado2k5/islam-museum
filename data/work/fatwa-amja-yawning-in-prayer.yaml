id: work/fatwa-amja-yawning-in-prayer
class: work
kind: fatwa
label: { ar: "التثاؤب في الصلاة", en: "Yawning — holding the hand over the mouth, in prayer or out", ur: "جمخی — منہ پر ہاتھ، نماز میں یا باہر", es: "Bostezar — sostener la mano sobre la boca, en oración o fuera", fr: "Bâiller — en mettant la main sur la bouche, en prière ou non" }
summary:
  ar: "سأل سائل عن حديث أبي هريرة في سنن أبي داود في التثاؤب. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87033 بتاريخ 29 يونيو 2012)⁩ أنه جاء في صحيح مسلم إذا تثاءب أحدكم فليمسك بيده على فمه فإن الشيطان يدخل ونقلت قول النووي أنه سواء كان التثاؤب في الصلاة أو خارجها يستحب كفه ما أمكن على ما فصّل الجواب."
  en: "A questioner asked about Abu Hurayra's yawning hadith in Sunan Abi Dawud. AMJA's fatwa committee (fatwa no. 87033, 29 June 2012) answered that Sahih Muslim has 'if one of you yawns let him hold his hand over his mouth, for the devil enters,' quoting al-Nawawi that whether in prayer or out it is liked to stifle it as far as possible — as the answer details."
  ur: "جمخی کا حکم؟ لجنة الفتوى ⁦(فتویٰ 87033، 29 جون 2012)⁩ نے صحیح مسلم کی حدیث اور النووی کا قول نقل کیا: نماز میں یا باہر دبانا مستحب۔"
  es: "Un consultante preguntó sobre el hadiz de Abu Hurayra sobre el bostezo en Sunan Abi Dawud. El comité de fatwas de AMJA (fatwa n.° 87033, 29 de junio de 2012) respondió que Sahih Muslim dice: \"Si uno de vosotros bosteza, que se tape la boca con la mano, pues entra el diablo\", citando a al-Nawawi, quien afirma que, tanto en oración como fuera de ella, es preferible reprimir el bostezo en la medida de lo posible, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le hadith d'Abu Hurayra sur le bâillement, rapporté dans le Sunan Abi Dawud. Le comité de fatwas de l'AMJA (fatwa n° 87033, 29 juin 2012) a répondu que Sahih Muslim dit: « Si l'un d'entre vous bâille, qu'il se couvre la bouche de la main, car le diable entre », citant al-Nawawi qui affirme que, pendant la prière comme en dehors, il est recommandé de réprimer le bâillement autant que possible – comme le précise la réponse."
