summary:
  ar: "كتاب مصطفى محمود في قراءة القرآن قراءة «عصرية»، تفتتح طبعته الجديدة بأمثلة يراها سبقاً علمياً قرآنياً، ثم يروي في فصل «المعمار القرآني» لقاءه الأول بالقرآن في الكتّاب {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}."
  en: "Mostafa Mahmoud's book reading the Qur'an in a 'contemporary' way; its new edition opens with examples he regards as Qur'anic anticipations of science, and in the chapter 'The architecture of the Qur'an' he recounts his first meeting with the Qur'an in the Qur'an school {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}."
  ur: "مصطفیٰ محمود کی کتاب جو قرآن کی «عصری» قراءت پیش کرتی ہے؛ اس کا نیا ایڈیشن ان مثالوں سے شروع ہوتا ہے جنہیں وہ قرآن کی سائنسی پیش بینی سمجھتے ہیں، اور «قرآنی معمار» کے باب میں وہ مکتب میں قرآن سے اپنی پہلی ملاقات بیان کرتے ہیں {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}۔"
