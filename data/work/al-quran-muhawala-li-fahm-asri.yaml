summary:
  ar: "كتاب مصطفى محمود في قراءة القرآن قراءة «عصرية»، تفتتح طبعته الجديدة بأمثلة يراها سبقاً علمياً قرآنياً، ثم يروي في فصل «المعمار القرآني» لقاءه الأول بالقرآن في الكتّاب {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}."
  en: "Mostafa Mahmoud's book reading the Qur'an in a 'contemporary' way; its new edition opens with examples he regards as Qur'anic anticipations of science, and in the chapter 'The architecture of the Qur'an' he recounts his first meeting with the Qur'an in the Qur'an school {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}."
  ur: "مصطفیٰ محمود کی کتاب جو قرآن کی «عصری» قراءت پیش کرتی ہے؛ اس کا نیا ایڈیشن ان مثالوں سے شروع ہوتا ہے جنہیں وہ قرآن کی سائنسی پیش بینی سمجھتے ہیں، اور «قرآنی معمار» کے باب میں وہ مکتب میں قرآن سے اپنی پہلی ملاقات بیان کرتے ہیں {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}۔"
  es: "El libro de Mostafa Mahmoud, que lee el Corán de una manera \"contemporánea\", comienza con ejemplos que él considera anticipaciones coránicas de la ciencia, y en el capítulo \"La arquitectura del Corán\" relata su primer encuentro con el Corán en la escuela coránica {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}."
  fr: "Le livre de Mostafa Mahmoud, lire le Coran d'une manière « contemporaine »; sa nouvelle édition s'ouvre sur des exemples qu'il considère comme des anticipations coraniques de la science, et dans le chapitre « L'architecture du Coran », il raconte sa première rencontre avec le Coran à l'école coranique {cite:mm-quran-muhawala-digital p. 1} {cite:mm-quran-muhawala-digital p. 4}."
  tr: "Mustafa Mahmoud'un Kur'an okuma kitabı: 'Modern' bir okuma. Yeni baskısı, bilimsel bir Kur'an öncülü olarak gördüğü örneklerle açılır, ardından 'Kur'an Mimarisi' bölümünde, Kur'an ile ilk karşılaşmasını {cite:mm-kuran-muhawala-digital s. 1} {cite:mm-kuran-muhawala-digital s. 4} adlı kitapta anlatır."
  id: "Buku Mustafa Mahmoud tentang pembacaan Al-Qur'an: Bacaan 'modern'. Edisi barunya dibuka dengan contoh-contoh yang dianggap sebagai preseden ilmiah Al-Qur'an, kemudian dalam bab 'Arsitektur Al-Qur'an,' ia menceritakan pertemuan pertamanya dengan Al-Qur'an dalam buku {cite:mm-quran-muhawala-digital hlm. 1} {cite:mm-quran-muhawala-digital hlm. 4}."
