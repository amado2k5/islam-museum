id: work/fatwa-amja-tawassul-malik-al-dar
class: work
kind: fatwa
label: { ar: "أثر مالك الدار في الاستسقاء عند قبر النبي", en: "The Malik al-Dar report on seeking rain at the Prophet's grave", ur: "مالک الدار کی روایت: قبر نبوی پر بارش کی دعا", es: "El relato de Malik al-Dar sobre la búsqueda de lluvia en la tumba del Profeta", fr: "Le rapport de Malik al-Dar sur la recherche de la pluie au tombeau du Prophète", tr: "Ev sahibinin Peygamber'in mezarındaki yağmur üzerindeki etkisi", id: "Pengaruh pemilik rumah terhadap hujan di makam Nabi" }
summary:
  ar: "سأل سائل عن أثر مالك الدار الذي رواه ابن أبي شيبة في أن رجلًا جاء إلى قبر النبي في قحط زمن عمر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87024 بتاريخ 27 يونيو 2012)⁩ أن الأثر على فرض صحته ليس بحجة على جواز الاستسقاء بالنبي بعد وفاته لأن السائل مجهول ولأن عمل الصحابة على خلافه فلم يأت أحد منهم إلى قبره يسأله السقيا ولا غيرها بل عدل عمر إلى الاستسقاء بالعباس ولم ينكر عليه أحد، وأن ما فعله الرجل منكر وذريعة إلى الشرك عنده وأن الرؤى المنامية لا يثبت بها الحكم على ما فصّل."
  en: "A questioner asked about the Malik al-Dar report in Ibn Abi Shayba of a man who came to the Prophet's grave in Umar's drought. Dr. Salah al-Sawi (fatwa no. 87024, 27 June 2012) answered that, even supposing it sound, it is no proof for seeking rain through the Prophet after his death: the asker is unknown, and the Companions' practice contradicts it — none of them came to the grave to ask for rain or anything else; Umar turned instead to seeking rain through al-Abbas with no Companion objecting; what that man did was, in the fatwa's view, reprehensible and a gateway to shirk, and dream visions establish no ruling, as detailed."
  ur: "ایک سائل نے مالک الدار کی اس روایت پوچھی کہ عمر کے زمانے قحط میں ایک شخص قبر نبوی پر بارش مانگنے گیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87024، 27 جون 2012)⁩ کے مطابق یہ روایت دلیل نہیں — صحابہ کا عمل اس کے خلاف تھا اور عمر نے عباس کے وسیلے سے دعا کی۔"
  es: "Un consultante preguntó sobre el relato de Malik al-Dar, citado por Ibn Abi Shayba, acerca de un hombre que acudió a la tumba del Profeta durante la sequía de Umar. El Dr. Salah al-Sawi (fatwa n.º 87024, 27 de junio de 2012) respondió que, aun suponiendo que fuera cierto, no constituye prueba alguna para pedir lluvia a través del Profeta después de su muerte: se desconoce quién hizo la petición, y la práctica de los Compañeros la contradice; ninguno de ellos acudió a la tumba para pedir lluvia ni nada parecido; Umar, en cambio, recurrió a pedir lluvia a través de al-Abbas sin que ningún Compañero se opusiera; lo que hizo ese hombre fue, según la fatwa, reprobable y una puerta de entrada al shirk (idolatría), y las visiones oníricas no establecen ninguna norma, como se detalla."
  fr: "Un lecteur a interrogé Salah al-Sawi au sujet du hadith rapporté par Malik al-Dar et cité par Ibn Abi Shayba, relatant la venue d'un homme sur la tombe du Prophète durant la sécheresse qui sévissait sous le règne d'Umar. Le Dr Salah al-Sawi (fatwa n° 87024, 27 juin 2012) a répondu que, même si ce hadith était plausible, il ne constitue pas une preuve justifiant de solliciter la pluie auprès du Prophète après sa mort: l'identité de celui qui a formulé cette demande est inconnue, et la pratique des Compagnons la contredit – aucun d'eux ne s'est rendu sur la tombe pour demander la pluie ou quoi que ce soit d'autre; Umar s'est plutôt tourné vers al-Abbas pour implorer la pluie, sans qu'aucun Compagnon ne s'y oppose. Selon la fatwa, l'acte de cet homme est répréhensible et ouvre la voie au shirk (associationnisme), et les visions oniriques n'établissent aucune règle, comme expliqué en détail."
  tr: "İbn Ebi Şeybe'nin rivayet ettiği ev sahibinin, Ömer zamanındaki kuraklık döneminde bir adamın Peygamber'in mezarına geldiği rivayeti hakkında bir soru soruldu. Dr. Salah Al-Sawi (27 Haziran 2012 tarihli 87024 No. fetva) bunun geçerlilik üzerindeki etkisinin, Peygamber'in ölümünden sonra yağmur istemenin (Peygamber'den yağmur istemenin) izinli olmaması nedeni olmadığını, çünkü soru soran kişinin bilinmediğini ve sahabelerin ona karşı hareket ettiğini ve hiçbirinin mezarına su ya da başka bir şey istemediğini söyledi. Bunun yerine, Ömer Abbas ile yağmur aramayı haklı çıkardı ve kimse ona itiraz etmedi. Adamın yaptığı kınanacak ve ona göre çoktanrıcılık için bir bahaneydi ve rüya gören vizyonların hükmü doğrulamadığını belirtti."
  id: "Seorang penanya ditanya tentang riwayat pemilik rumah, seperti yang diceritakan oleh Ibn Abi Shaybah, bahwa seorang pria datang ke makam Nabi pada masa kekeringan pada masa Umar. Dr. Salah Al-Sawi menjawab (Fatwa No. 87024 tanggal 27 Juni 2012) bahwa pengaruh terhadap keabsahannya bukanlah alasan untuk diperbolehkan mencari hujan (memohon hujan dari Nabi setelah kematiannya), karena penanya tidak diketahui dan karena para Sahabat bertindak bertentangan dengannya, dan tidak ada satu pun dari mereka yang datang ke makamnya untuk meminta air atau hal lain. Sebaliknya, Umar membenarkan pencarian hujan kepada Abbas dan tidak ada yang menentangnya. Apa yang dilakukan pria itu tercela dan menurut dia dianggap sebagai alasan politeisme, dan bahwa penglihatan mimpi tidak mengukuhkan keputusan yang dijelaskan."
