summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: تكليف الأمانة العامة باستكتاب مزيد من البحوث في بطاقات الائتمان ليتمكن المجلس من اتخاذ القرار المناسب في دورة قادمة ⁦(انظر القرارين 63 (7/1) و87 (9/4))⁩."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on credit cards: the secretariat was tasked with commissioning further studies so the council could rule at a coming session — see resolutions 63 (7/1) and 87 (9/4)."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ کریڈٹ کارڈز پر: مزید تحقیق؛ فیصلہ اگلی مجلس تک ⁦(دیکھیں 63 (7/1)، 87 (9/4))⁩۔"
  es: "Resolución de la octava sesión de la IIFA (Brunei, junio de 1993) sobre tarjetas de crédito: se encargó a la secretaría la realización de estudios adicionales para que el consejo pudiera pronunciarse en una próxima sesión — véanse las resoluciones 63 (7/1) y 87 (9/4)."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur les cartes de crédit: le secrétariat a été chargé de commander des études supplémentaires afin que le conseil puisse statuer lors d'une prochaine session — voir les résolutions 63 (7/1) et 87 (9/4)."
