class: work
kind: fatwa
label: { ar: "الفرق بين لفظي ⁦(الصوم)⁩ و⁦(الصيام)⁩ وما يترتب عليه من أحكام", en: "The difference between the words sawm and siyam and what follows", ur: "⁦(صوم)⁩ اور ⁦(صیام)⁩ کا فرق اور اس کے احکام", es: "La diferencia entre las palabras sawm y siyam y lo que sigue", fr: "La différence entre les mots sawm et siyam et ce qui suit", tr: "Oruç ve (oruç) terimleri ile sonraki kurallar arasındaki fark", id: "Perbedaan antara istilah (puasa) dan (puasa) serta aturan yang mengikuti" }
summary:
  ar: "سائل سأل عن الفرق بين لفظي ⁦(الصوم)⁩ و⁦(الصيام)⁩ وما يترتب على ذلك من أحكام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21033)⁩ أنه لا فرق في الاستعمال الشرعي بين اللفظين في المعنى إذ يدلان على المعنى نفسه وهو الإمساك على ما فصّل الجواب."
  en: "A questioner asked about the difference between the words 'sawm' and 'siyam' and what follows legally. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21033) answered that there is no difference between the two in legal usage — both denote the same meaning, abstention — as the answer details."
  ur: "ایک سائل نے ⁦(صوم)⁩ اور ⁦(صیام)⁩ میں فرق اور اس کے احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21033)⁩ نے جواب دیا کہ شرعی استعمال میں دونوں ایک ہی معنی دیتے ہیں یعنی روک رکھنا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la diferencia entre las palabras «sawm» y «siyam» y sus implicaciones legales. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21033) respondió que no existe diferencia entre ambas en el uso legal; ambas denotan el mismo significado, abstención, como se detalla en la respuesta."
  fr: "Un internaute a posé une question sur la différence entre les mots « sawm » et « siyam » et leurs conséquences juridiques. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21033) a répondu qu'il n'y a aucune différence entre les deux en droit: ils désignent tous deux la même chose, l'abstention, comme le précise la réponse."
  tr: "Bir soru soran kişi (oruç) ve (oruç) kelimeleri ile sonrasında verilen kararlar arasındaki farkı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21033), iki terim arasında anlam açısından yasal kullanımda bir fark olmadığını, çünkü aynı anlamı ifade ettiklerini, yani cevabın açıkladığını gizlemeyi söylediklerini yanıtladı."
  id: "Seorang penanya menanyakan perbedaan antara kata (puasa) dan (puasa) serta putusan yang menyusul. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21033) menjawab bahwa tidak ada perbedaan dalam penggunaan hukum antara kedua istilah tersebut dalam makna, karena keduanya menunjukkan makna yang sama, yaitu menahan penjelasan dalam jawaban tersebut."
