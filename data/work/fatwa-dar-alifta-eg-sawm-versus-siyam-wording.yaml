label: { ar: "الفرق بين لفظي ⁦(الصوم)⁩ و⁦(الصيام)⁩ وما يترتب عليه من أحكام", en: "The difference between the words sawm and siyam and what follows", ur: "⁦(صوم)⁩ اور ⁦(صیام)⁩ کا فرق اور اس کے احکام", es: "La diferencia entre las palabras sawm y siyam y lo que sigue" }
summary:
  ar: "سائل سأل عن الفرق بين لفظي ⁦(الصوم)⁩ و⁦(الصيام)⁩ وما يترتب على ذلك من أحكام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21033)⁩ أنه لا فرق في الاستعمال الشرعي بين اللفظين في المعنى إذ يدلان على المعنى نفسه وهو الإمساك على ما فصّل الجواب."
  en: "A questioner asked about the difference between the words 'sawm' and 'siyam' and what follows legally. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21033) answered that there is no difference between the two in legal usage — both denote the same meaning, abstention — as the answer details."
  ur: "ایک سائل نے ⁦(صوم)⁩ اور ⁦(صیام)⁩ میں فرق اور اس کے احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21033)⁩ نے جواب دیا کہ شرعی استعمال میں دونوں ایک ہی معنی دیتے ہیں یعنی روک رکھنا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la diferencia entre las palabras «sawm» y «siyam» y sus implicaciones legales. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21033) respondió que no existe diferencia entre ambas en el uso legal; ambas denotan el mismo significado, abstención, como se detalla en la respuesta."
