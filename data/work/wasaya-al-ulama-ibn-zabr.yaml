label:
  ar: وصايا العلماء لابن زبر
  en: Wasaya al-Ulama' attributed to Ibn Zabr
  ur: وصایا العلماء منسوب بہ ابن زبر
  es: "Wasaya al-Ulama' atribuida a Ibn Zabr"
  fr: "Wasaya al-Ulama' attribuée à Ibn Zabr"
  tr: "İbn Zubr'un Âlimlerin Tavsiyesi"
  id: "Nasihat Para Sarjana oleh Ibn Zubr"
summary:
  ar: «وصايا العلماء» لابن زبر كتاب يذكره ابن حجر في «الدرر الكامنة» ضمن كتب سمعها رجل من عم والده يوسف بن عمر {cite:durar-kamina-jil-1993 scan vol. 3 p. 96}. ولم يوجد في الصفحة وصف لمحتواه ولا اسم مؤلفه كاملاً ولا الصيغة الأطول «عند حضور الموت». ولذلك لا يُربط بشخص بعينه في المتحف.
  en: Wasaya al-Ulama' of Ibn Zabr is a book that Ibn Hajar mentions in al-Durar al-Kamina among books a man heard from his father's uncle Yusuf ibn Umar {cite:durar-kamina-jil-1993 scan vol. 3 p. 96}. The page gives no description of its contents, no full name of its author and not the longer form 'at the approach of death'. It is therefore not linked to a particular person in the museum.
  ur: ابن زبر کی «وصایا العلماء» وہ کتاب ہے جسے ابن حجر «الدرر الکامنہ» میں ان کتابوں میں ذکر کرتے ہیں جو ایک شخص نے اپنے والد کے چچا یوسف بن عمر سے سنیں {cite:durar-kamina-jil-1993 scan vol. 3 p. 96}۔ صفحہ مضامین کا بیان، مصنف کا مکمل نام یا طویل صورت «عند حضور الموت» نہیں دیتا۔ اس لیے اسے میوزیم میں کسی خاص شخص سے نہیں جوڑا گیا۔
  es: "Wasaya al-Ulama' de Ibn Zabr es un libro que Ibn Hajar menciona en al-Durar al-Kamina entre los libros que un hombre escuchó de su tío paterno Yusuf ibn Umar {cite:durar-kamina-jil-1993 scan vol. 3 p. 96}. La página no ofrece ninguna descripción de su contenido, ni el nombre completo de su autor, ni la forma más extensa «en las proximidades de la muerte». Por lo tanto, no está vinculado a ninguna persona en particular del museo."
  fr: "Le Wasaya al-Ulama' d'Ibn Zabr est un ouvrage mentionné par Ibn Hajar dans al-Durar al-Kamina parmi les livres qu'un homme aurait entendus de l'oncle de son père, Yusuf ibn Umar (cite: durar-kamina-jil-1993 scan vol. 3 p. 96). La page ne donne aucune description de son contenu, ni le nom complet de son auteur, et n'emploie pas la formulation plus longue « à l'approche de la mort ». Il n'est donc pas associé à une personne en particulier au musée."
  tr: "İbn Zubeyr'in \"Alimlerin Vasiyetleri\" adlı kitabı, İbn Hajar'ın \"Al-Durar al-Kamina\" adlı eserinde bir adamın babasının amcası Yusuf ibn Umar'dan duyduğu kitaplar arasında bahsedilen bir kitaptır {cite:durar-kamina-jil-1993 tarama cilt 3, s. 96}. İçeriği, tam yazar adı veya daha uzun versiyonu \"ölüm anında\" hakkında bir açıklama yoktur. Bu nedenle, müzedeki herhangi bir kişiyle bağlantılı değildir."
  id: "\"Surat Wasiat Para Cendeki\" karya Ibn Zubair adalah sebuah buku yang disebutkan oleh Ibn Hajar dalam \"Al-Durar al-Kamina\" di antara buku-buku yang didengar oleh seorang pria dari paman ayahnya, Yusuf ibn Umar {cite:durar-kamina-jil-1993 scan vol. 3, hlm. 96}. Tidak ada deskripsi isinya, nama lengkap penulis, atau versi panjang \"pada saat kematian.\" Oleh karena itu, buku ini tidak terkait dengan orang tertentu di museum."
