id: work/fatwa-dar-alifta-eg-moving-mosque-endowed-furniture
class: work
kind: fatwa
label: { ar: "حكم نقل الأثاث الموقوف من مسجد إلى آخر", en: "Moving endowed furniture from one mosque to another", ur: "ایک مسجد کا وقف سامان دوسری مسجد کو دینا", es: "Traslado de muebles donados de una mezquita a otra.", fr: "Déplacer le mobilier sacré d'une mosquée à l'autre", tr: "Asılı Mobilyaların Bir Camiden Diğerine Taşınmasına Dair Karar", id: "Putusan tentang Pemindahan Perabotan Gantung dari Satu Masjid ke Masjid Lain" }
summary:
  ar: "سائل سأل عن نقل الأشياء الموقوفة على مسجد من نحو سجاد ومصابيح وغيرها إلى مسجد آخر بعد استغناء المسجد الأول عنها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21564)⁩ أنه لا مانع شرعًا من نقل الأشياء الموقوفة على المسجد المذكور بعد استغنائه عنها على ما فصّل الجواب من ضوابطه."
  en: "A questioner asked about moving things endowed to a mosque — carpets, lamps and the like — to another mosque after the first no longer needs them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21564) answered there is no legal objection to moving them once the mosque no longer needs them, under the controls the answer sets out."
  ur: "ایک سائل نے ایک مسجد کا وقف شدہ سامان قالین لیمپ وغیرہ اس کی ضرورت نہ رہنے پر دوسری مسجد کو دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21564)⁩ نے جواب دیا کہ ضرورت نہ رہنے پر منتقل کرنا جائز ہے — جواب کے ضوابط کے ساتھ۔"
  es: "Un consultante preguntó sobre la posibilidad de trasladar objetos donados a una mezquita —alfombras, lámparas y similares— a otra mezquita una vez que la primera ya no los necesita. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21564) respondió que no existe ninguna objeción legal a trasladarlos una vez que la mezquita ya no los necesite, de acuerdo con las normas que se exponen en la respuesta."
  fr: "Un internaute a demandé s'il était possible de transférer des biens légués à une mosquée — tapis, lampes, etc. — vers une autre mosquée une fois que la première n'en a plus besoin. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21564) a répondu qu'il n'y avait aucune objection légale à ce transfert, sous réserve des conditions énoncées dans la fatwa."
  tr: "Bir soru soran, orijinal cami tarafından vazgeçildikten sonra halı, lamba ve benzeri vakıf eşyaların camiden başka bir camiye aktarılması hakkında sorular sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21564), cevabın ayrıntılı kurallarına göre, vafaz edilen eşyaların söz konusu camiye devredilmesine dini bir itiraz olmadığını belirtmiştir."
  id: "Seorang penanya menanyakan tentang pemindahan barang-barang abadi dari masjid, seperti karpet, lampu, dan lainnya, ke masjid lain setelah masjid asli membatalkannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21564) menjawab bahwa tidak ada keberatan agama untuk memindahkan barang abadi ke masjid tersebut setelah dihapuskan, sesuai dengan aturan rinci jawaban."
