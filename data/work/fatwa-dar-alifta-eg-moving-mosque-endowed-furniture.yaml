id: work/fatwa-dar-alifta-eg-moving-mosque-endowed-furniture
class: work
kind: fatwa
label: { ar: "حكم نقل الأثاث الموقوف من مسجد إلى آخر", en: "Moving endowed furniture from one mosque to another", ur: "ایک مسجد کا وقف سامان دوسری مسجد کو دینا", es: "Traslado de muebles donados de una mezquita a otra." }
summary:
  ar: "سائل سأل عن نقل الأشياء الموقوفة على مسجد من نحو سجاد ومصابيح وغيرها إلى مسجد آخر بعد استغناء المسجد الأول عنها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21564)⁩ أنه لا مانع شرعًا من نقل الأشياء الموقوفة على المسجد المذكور بعد استغنائه عنها على ما فصّل الجواب من ضوابطه."
  en: "A questioner asked about moving things endowed to a mosque — carpets, lamps and the like — to another mosque after the first no longer needs them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21564) answered there is no legal objection to moving them once the mosque no longer needs them, under the controls the answer sets out."
  ur: "ایک سائل نے ایک مسجد کا وقف شدہ سامان قالین لیمپ وغیرہ اس کی ضرورت نہ رہنے پر دوسری مسجد کو دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21564)⁩ نے جواب دیا کہ ضرورت نہ رہنے پر منتقل کرنا جائز ہے — جواب کے ضوابط کے ساتھ۔"
  es: "Un consultante preguntó sobre la posibilidad de trasladar objetos donados a una mezquita —alfombras, lámparas y similares— a otra mezquita una vez que la primera ya no los necesita. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21564) respondió que no existe ninguna objeción legal a trasladarlos una vez que la mezquita ya no los necesite, de acuerdo con las normas que se exponen en la respuesta."
