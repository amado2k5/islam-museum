label: { ar: "بحث في ما لا يسع المسلم جهله ⁦(سؤال عن إعداد بحث في هذا الموضوع)⁩", en: "A study on the knowledge no Muslim may be ignorant of ⁦(asked about preparing the paper)⁩", ur: "'ہر مسلمان کے لیے لازم علم' پر تحقیقی مقالہ ⁦(مقالہ تیار کرنے کے بارے میں سوال)⁩", es: "Un estudio sobre el conocimiento que ningún musulmán puede ignorar (preguntó sobre la preparación del documento).", fr: "Une étude sur les connaissances qu'aucun musulman ne devrait ignorer (question posée à propos de la préparation du document)" }
summary:
  ar: "سائل أراد إعداد بحث في «ما لا يسع المسلم جهله». أجاب الدكتور صلاح الصاوي باسم مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21818 بتاريخ 14 أكتوبر 2012)⁩: افعل ولا حرج، موصيًا بالرجوع إلى مختصرات كتب الفقه التي جمعها ثقات أهل العلم فاستخلاص زبدتها مادة للموضوع، ثم ترتيب الأمر على منهجية، وأن يكون له مشرف شرعي يسدده ويعينه إن كان حديث عهد بالكتابة، فإن الدلالة على العلم نصف العلم."
  en: "A questioner wanted to prepare a paper on 'the knowledge no Muslim may be ignorant of'. Dr. Salah al-Sawi answered for the Assembly of Muslim Jurists of America (fatwa no. 21818, 14 October 2012): do it, and no harm — advising him to go back to the concise fiqh manuals compiled by trustworthy scholars and extract their essence as material, then organise it on a sound method, and to take a religious supervisor to guide and assist him if he is new to writing, for showing the way to knowledge is half of knowledge."
  ur: "ایک سائل 'ہر مسلمان کے لیے لازم علم' پر مقالہ تیار کرنا چاہتا تھا۔ ڈاکٹر صلاح الصاوی نے ایسملی آف مسلم جورسٹس آف امریکہ کی طرف سے ⁦(فتویٰ نمبر 21818، 14 اکتوبر 2012)⁩ جواب دیا: کر لو، کوئی حرج نہیں — اور نصیحت کی کہ قابلِ اعتماد علماء کی مرتب کردہ فقہ کی جامع مختصر کتابوں سے اصل مادہ اخذ کرے، پھر اسے کسی منہج پر مرتب کرے، اور اگر تحریر میں نیا ہے تو کوئی شرعی نگران رکھے جو رہنمائی کرے، کیونکہ علم کی طرف دلالت نصف علم ہے۔"
  es: "Un consultante deseaba preparar un trabajo sobre \"el conocimiento que ningún musulmán puede ignorar\". El Dr. Salah al-Sawi respondió en nombre de la Asamblea de Juristas Musulmanes de América (fatwa n.° 21818, 14 de octubre de 2012): hágalo, y no habrá ningún problema; aconsejándole que consultara los manuales de fiqh concisos compilados por eruditos confiables y extrajera su esencia como material, que lo organizara según un método sólido y que buscara un supervisor religioso que lo guiara y asistiera si era nuevo en la escritura, pues mostrar el camino hacia el conocimiento es la mitad del conocimiento."
  fr: "Un lecteur souhaitait rédiger un article sur « les connaissances qu'aucun musulman ne saurait ignorer ». Le Dr Salah al-Sawi a répondu au nom de l'Assemblée des juristes musulmans d'Amérique (fatwa n° 21818, 14 octobre 2012): « Faites-le, il n'y a aucun mal. » Il lui a conseillé de se référer aux manuels de fiqh concis compilés par des savants dignes de confiance, d'en extraire l'essentiel, puis de l'organiser selon une méthode rigoureuse. S'il était novice en la matière, il lui a également recommandé de se faire accompagner d'un superviseur religieux, car montrer le chemin du savoir représente déjà la moitié du savoir."
