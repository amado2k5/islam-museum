label: { ar: "بحث في ما لا يسع المسلم جهله ⁦(سؤال عن إعداد بحث في هذا الموضوع)⁩", en: "A study on the knowledge no Muslim may be ignorant of ⁦(asked about preparing the paper)⁩", ur: "'ہر مسلمان کے لیے لازم علم' پر تحقیقی مقالہ ⁦(مقالہ تیار کرنے کے بارے میں سوال)⁩" }
summary:
  ar: "سائل أراد إعداد بحث في «ما لا يسع المسلم جهله». أجاب الدكتور صلاح الصاوي باسم مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21818 بتاريخ 14 أكتوبر 2012)⁩: افعل ولا حرج، موصيًا بالرجوع إلى مختصرات كتب الفقه التي جمعها ثقات أهل العلم فاستخلاص زبدتها مادة للموضوع، ثم ترتيب الأمر على منهجية، وأن يكون له مشرف شرعي يسدده ويعينه إن كان حديث عهد بالكتابة، فإن الدلالة على العلم نصف العلم."
  en: "A questioner wanted to prepare a paper on 'the knowledge no Muslim may be ignorant of'. Dr. Salah al-Sawi answered for the Assembly of Muslim Jurists of America (fatwa no. 21818, 14 October 2012): do it, and no harm — advising him to go back to the concise fiqh manuals compiled by trustworthy scholars and extract their essence as material, then organise it on a sound method, and to take a religious supervisor to guide and assist him if he is new to writing, for showing the way to knowledge is half of knowledge."
  ur: "ایک سائل 'ہر مسلمان کے لیے لازم علم' پر مقالہ تیار کرنا چاہتا تھا۔ ڈاکٹر صلاح الصاوی نے ایسملی آف مسلم جورسٹس آف امریکہ کی طرف سے ⁦(فتویٰ نمبر 21818، 14 اکتوبر 2012)⁩ جواب دیا: کر لو، کوئی حرج نہیں — اور نصیحت کی کہ قابلِ اعتماد علماء کی مرتب کردہ فقہ کی جامع مختصر کتابوں سے اصل مادہ اخذ کرے، پھر اسے کسی منہج پر مرتب کرے، اور اگر تحریر میں نیا ہے تو کوئی شرعی نگران رکھے جو رہنمائی کرے، کیونکہ علم کی طرف دلالت نصف علم ہے۔"
