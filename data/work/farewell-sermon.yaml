id: work/farewell-sermon
education:
  did_you_know:
    ar: "خطبة عرفة سنة ١٠هـ قررت حرمة الدماء والأموال والأعراض، ووضعت دماء الجاهلية ورباها، وأوصت بالنساء، وعهدت بكتاب الله، ونفت نبياً بعده، وختمت «اللهم اشهد»."
    en: "The Arafat sermon of year 10 declared blood, property and honour inviolate, wiped out the feuds and usury of the Jahiliyya, counselled on women, bound them to God's book — and closed 'O God, bear witness'."
    ur: "سن ۱۰ھ کے عرفہ خطبہ نے خون، مال اور عزت کی حرمت قرار دی، جاہلیت کا خون و سود ختم کیا، عورتوں کے حق میں وصیت کی، کتابِ اللہ کا عہد دیا اور «اے اللہ گواہ رہ» پر ختم ہوا۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: work
kind: sermon
label: { en: "The Farewell Sermon", ar: "خطبة الوداع" }
summary:
  en: "The sermon delivered at Arafat on 9 Dhu al-Hijja 10 AH and repeated in substance at Mina on the Day of Sacrifice: sanctity of life, property and honour; the abolition of pagan vengeance and usury; counsel on women; the sufficiency of the Book of God; no prophet after him; and the witnessed testimony 'O God, bear witness'."
  ar: "الخطبة التي ألقاها النبي بعرفة في 9 ذي الحجة سنة 10هـ وأعاد جملها يوم النحر بمنى: حرمة الدماء والأموال والأعراض، ووضع دماء الجاهلية ورباها، والوصية بالنساء، والعهد بكتاب الله، وألا نبي بعده، وشهادة اللهم اشهد."
