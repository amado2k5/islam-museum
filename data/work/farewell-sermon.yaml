label: { en: "The Farewell Sermon", ar: "خطبة الوداع", es: "El sermón de despedida", fr: "Le sermon d'adieu", ur: "الوداعی خطبہ", tr: "Veda Konuşması", id: "Pidato Perpisahan" }
summary:
  en: "The sermon delivered at Arafat on 9 Dhu al-Hijja 10 AH and repeated in substance at Mina on the Day of Sacrifice: sanctity of life, property and honour; the abolition of pagan vengeance and usury; counsel on women; the sufficiency of the Book of God; no prophet after him; and the witnessed testimony 'O God, bear witness'."
  ar: "الخطبة التي ألقاها النبي بعرفة في 9 ذي الحجة سنة 10هـ وأعاد جملها يوم النحر بمنى: حرمة الدماء والأموال والأعراض، ووضع دماء الجاهلية ورباها، والوصية بالنساء، والعهد بكتاب الله، وألا نبي بعده، وشهادة اللهم اشهد."
  es: "El sermón pronunciado en Arafat el 9 de Dhu al-Hijja del año 10 de la Hégira y repetido en esencia en Mina el Día del Sacrificio: la santidad de la vida, la propiedad y el honor; la abolición de la venganza pagana y la usura; consejos sobre las mujeres; la suficiencia del Libro de Dios; que no habrá profetas después de él; y el testimonio presenciado \"Oh Dios, sé testigo\"."
  fr: "Le sermon prononcé à Arafat le 9 Dhu al-Hijja de l'an 10 de l'Hégire et repris en substance à Mina le jour du Sacrifice: le caractère sacré de la vie, des biens et de l'honneur; l'abolition de la vengeance païenne et de l'usure; des conseils sur les femmes; la suffisance du Livre de Dieu; l'absence de prophète après lui; et le témoignage attesté: « Ô Dieu, témoigne »."
  ur: "خطبہ عرفات میں 9 ذی الحجہ 10 ہجری کو دیا گیا اور منیٰ میں قربانی کے دن دہرایا گیا: جان، مال اور عزت کی حرمت؛ کافر انتقام اور سود کا خاتمہ؛ خواتین پر مشورہ؛ خدا کی کتاب کی کفایت؛ ان کے بعد کوئی نبی نہیں اور گواہی کی گواہی 'اے خدا گواہ رہنا'۔"
  tr: "Peygamber'in 10 Hile yılının 9'unda Erafah'ta verdiği vaaz, Mina'da Kurban Günü'nde tekrarlanan cümleler: kan, servet ve onurun kutsallığı, İslam öncesi dönemin kanının dökülmesi ve gasp edilmesi, kadınlara verilen öğütler, Allah Kitabı'na yemin edilme, 'Onun ardından peygamber kalmayacak' sözü ve 'Ey Allah, şahit ol' sözcüğü."
  id: "Khotbah yang disampaikan oleh Nabi di Arafah pada tanggal 9 Dhu al-Hijjah tahun 10 H, dan mengulangi kalimatnya pada Hari Kurban di Mina: kesucian darah, kekayaan, dan kehormatan, pertumpahan dan pengambilalihan darah era pra-Islam, nasihat tentang perempuan, janji kepada Kitab Allah, firman 'Tidak akan ada nabi setelah dia,' dan kesaksian 'Ya Allah, bersaksilah.'"
