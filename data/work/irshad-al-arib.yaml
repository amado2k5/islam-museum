summary:
  ar: "«معجم الأدباء» لياقوت الحموي، ويعرف أيضاً بـ«إرشاد الأريب إلى معرفة الأديب»؛ خطر له في العشرين من عمره حين لقي بآمد النحوي شميم الحلي سنة ٥٩٤هـ/١١٩٨م، وظل يغذيه من مطالعاته ولقاءاته حتى آخر عمره {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  en: "Yaqut al-Hamawi's dictionary of men of letters, also called Irshad al-Arib ila Ma'rifat al-Adib: the idea came to him in his twentieth year when he met the grammarian Shumaym al-Hilli at Amid in 594/1198, and he kept feeding it from his reading and encounters to the end of his life {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  es: "El diccionario de hombres de letras de Yaqut al-Hamawi, también llamado Irshad al-Arib ila Ma'rifat al-Adib: la idea le llegó a los veinte años cuando conoció al gramático Shumaym al-Hilli en Amid en 594/1198, y siguió alimentándola a partir de sus lecturas y encuentros hasta el final de su vida {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  fr: "Le dictionnaire des hommes de lettres de Yaqut al-Hamawi, également appelé Irshad al-Arib ila Ma'rifat al-Adib: l'idée lui est venue dans sa vingtième année lorsqu'il a rencontré le grammairien Shumaym al-Hilli à Amid en 594/1198, et il a continué à l'alimenter de ses lectures et de ses rencontres jusqu'à la fin de sa vie {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  ur: "یاقوت الحماوی کی لغت کے آدمیوں کی لغت، جسے ارشاد العریب الا معارف الادب بھی کہا جاتا ہے: یہ خیال ان کے ذہن میں بیسویں سال میں آیا جب وہ 594/1198 میں امڈ میں گرائمر شمیم الحلی سے ملے اور وہ اسے اپنی زندگی کے آخر تک پڑھتے رہے۔ {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 11ص۔ 265-266}۔"
