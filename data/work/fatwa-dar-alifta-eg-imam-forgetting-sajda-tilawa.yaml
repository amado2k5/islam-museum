id: work/fatwa-dar-alifta-eg-imam-forgetting-sajda-tilawa
class: work
kind: fatwa
label: { ar: "حكم نسيان الإمام سجدة التلاوة في الصلاة وما يجب فعله", en: "An imam forgetting the recitation prostration in prayer", ur: "امام کا نماز میں سجدہ تلاوت بھول جانا", es: "Un imán olvidando la recitación y la postración en la oración.", fr: "Un imam oubliant la récitation de la prosternation dans la prière" }
summary:
  ar: "إمام قرأ في صلاته بالناس آية فيها سجدة فنسي فلم يسجد ثم ركع فسأل عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21818)⁩ أنه لا يعود للإتيان بها بل عليه ما بيّنه الجواب من سجود السهو وغيره."
  en: "An imam read a prostration verse while leading the people, forgot and did not prostrate, then bowed; he asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21818) answered that he does not go back to perform it; what he must do — the prostration of forgetfulness and the like — is set out in the answer."
  ur: "ایک امام نے نماز میں سجدے والی آیت پڑھی، بھول گیا اور رکوع کر لیا؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21818)⁩ نے جواب دیا کہ وہ سجدے کے لیے واپس نہیں آتا؛ بلکہ جواب میں بیان کردہ سجدہ سہو وغیرہ کرے۔"
  es: "Un imán recitó un versículo de postración mientras dirigía a la congregación, lo olvidó y no se postró, luego hizo una reverencia; preguntó cuál era la norma. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21818) respondió que no era necesario volver atrás para realizarlo; lo que debía hacer —la postración por olvido y similares— se detalla en la respuesta."
  fr: "Un imam récita un verset sur la prosternation pendant la prière, oublia de se prosterner, puis s'inclina. Il demanda alors la décision de la Cour suprême. La Cour d'Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21818) répondit qu'il n'était pas nécessaire de revenir en arrière pour accomplir la prosternation; la réponse précise ce qu'il doit faire: la prosternation de l'oubli, etc."
