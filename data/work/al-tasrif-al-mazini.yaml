summary:
  ar: 'التصريف، كتاب في الصرف والتصريف لمؤلفه أبو عثمان المازني، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 249هـ / 863م {cite:wikipedia-ar-abu-uthman-al-mazini}. وجواب الملخص عن وجوده في المكتبة الشاملة:
    لا يوجد له إدراج مستقل في الشاملة، وقد حُفظ داخل المنصف لابن جني بحسب الملف، وتُذكر صفحة Usul.ai للمنصف {cite:usul-ai-munsif-al-tasrif-al-mazini}. لم يقرأ المتحف الكتاب.'
  en: 'al-Tasrif, a book on morphology (sarf and tasrif) by Abu Uthman al-Mazini; its date in a research summary supplied to the museum is d. 249 AH / 863 CE {cite:wikipedia-ar-abu-uthman-al-mazini}. The
    summary''s answer on its presence in the Shamela library: No standalone entry; the file says it is preserved inside Ibn Jinni''s al-Munsif and points to a Usul.ai page for al-Munsif {cite:usul-ai-munsif-al-tasrif-al-mazini}.
    The museum has not read the book.'
  ur: 'التصريف، صرف و تصریف پر ایک کتاب، مصنف أبو عثمان المازني؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 249ھ / 863ء {cite:wikipedia-ar-abu-uthman-al-mazini}۔ شاملہ میں موجودگی پر خلاصے کا
    جواب: شاملہ میں اس کا الگ اندراج نہیں؛ فائل کے مطابق یہ ابن جنی کی المنصف کے اندر محفوظ ہے اور المنصف کے لیے Usul.ai کا صفحہ بتاتی ہے {cite:usul-ai-munsif-al-tasrif-al-mazini}۔ میوزیم نے یہ کتاب نہیں
    پڑھی۔'
  fr: 'al-Tasrif, livre sur la morphologie (sarf et tasrif) de Abu Uthman al-Mazini ; sa date dans une synthèse de recherche remise au musée : m. 249 H / 863 {cite:wikipedia-ar-abu-uthman-al-mazini}. Réponse
    de la synthèse sur sa présence dans la bibliothèque Shamela : Pas d''entrée autonome ; selon le fichier, il est conservé dans al-Munsif d''Ibn Jinni, et une page d''Usul.ai pour al-Munsif est indiquée
    {cite:usul-ai-munsif-al-tasrif-al-mazini}. Le musée n''a pas lu le livre.'
  es: 'al-Tasrif, libro sobre morfología (sarf y tasrif) de Abu Uthman al-Mazini; su fecha en un resumen de investigación entregado al museo: m. 249 H. / 863 {cite:wikipedia-ar-abu-uthman-al-mazini}. Respuesta
    del resumen sobre su presencia en la biblioteca Shamela: Sin entrada propia; según el archivo se conserva dentro de al-Munsif de Ibn Jinni, y se indica una página de Usul.ai para al-Munsif {cite:usul-ai-munsif-al-tasrif-al-mazini}.
    El museo no ha leído el libro.'
  id: 'Al-Tasreef, sebuah buku tentang morfologi dan morfologi karya penulisnya Abu Uthman al-Mazini, dan sejarahnya menurut ringkasan penelitian yang diajukan ke museum: wafat 249 H / 863 M {cite:wikipedia-ar-abu-uthman-al-mazini}.
    Jawaban ringkasan atas keberadaannya di Perpustakaan Komprehensif: Tidak ada entri independen di Perpustakaan Komprehensif, dan disimpan di dalam al-Munsif oleh Ibn Jinni menurut berkas, serta halaman
    Usul.ai al-Muṣif {cite:usul-ai-munsif-al-tasrif-al-mazini} disebutkan. Museum tidak membaca buku tersebut.'
