label: { ar: "معرفة الصحابة لابن منده", en: "Ma'rifat al-Sahaba li-Ibn Manda", es: "Ma'rifat al-Sahaba li-Ibn Manda", fr: "Ma'rifat al-Sahaba li-Ibn Manda", ur: "معارف الصحابہ لی ابن مندہ", tr: "İbn Manda'nın Yoldaşlar Bilgisi", id: "Pengetahuan tentang Para Sahabat oleh Ibn Manda" }
summary:
  ar: "كتاب أبي بكر ابن منده الأصبهاني في أسماء الصحابة؛ أقدم الكتب الأربعة المصنفة في معرفة الصحابة، ذيل عليه أبو موسى المديني، واستقصاه ابن الأثير في أُسد الغابة وجعل له علامة ⁦(د)⁩ {cite:kashf-zunun-furqan p. 398}."
  en: "Ibn Manda's Companion biographies — the first of the four foundational works on the Sahaba, continued by Abu Musa al-Madini and exhausted by Ibn al-Athir under siglum ⁦(د)⁩ {cite:kashf-zunun-furqan p. 398}."
  es: "Las biografías de los Compañeros de Ibn Manda — la primera de las cuatro obras fundamentales sobre los Sahaba, continuada por Abu Musa al-Madini y agotada por Ibn al-Athir bajo el siglum (d) {cite:kashf-zunun-furqan p. 398}."
  fr: "Les biographies des compagnons d'Ibn Manda — la première des quatre œuvres fondamentales sur les Sahaba, poursuivie par Abu Musa al-Madini et achevée par Ibn al-Athir sous le sigle (d) {cite:kashf-zunun-furqan p. 398}."
  ur: "ابن مندہ کی صحابہ کی سوانح حیات - صحابہ پر چار بنیادی کاموں میں سے پہلا جسے ابو موسیٰ مدینی نے جاری رکھا اور ابن الثیر نے سگلم ⁦(د)⁩ کے تحت ختم کیا 398}۔"
  tr: "Ebu Bekir bin Manda el-İsfahani'nin Sahabelerin isimleri üzerine kitabı; Sahabelerin bilgisi üzerine derlenen dört kitabın en eskisi, Ebu Musa el-Medini tarafından desteklenmiş ve İbn el-Athir tarafından 'Esad al-Ghabah'da kapsamlı şekilde incelenmiştir; ona (D) işareti verilmiştir {atıf:kaşf-zunun-furqan, s. 398}."
  id: "Kitab Abu Bakr ibn Manda al-Isfahani tentang nama-nama Para Sahabat; buku tertua dari empat buku yang disusun tentang pengetahuan Para Sahabat, dilengkapi oleh Abu Musa al-Madini, dan dipelajari secara mendalam oleh Ibn al-Athir dalam 'Asad al-Ghabah,' yang memberinya tanda (D) {cite:kashf-zunun-furqan, hlm. 398}."
