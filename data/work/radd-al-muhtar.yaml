summary:
  ar: "حاشية محمد أمين ابن عابدين الدمشقي ⁦(ت 1252هـ)⁩ على «الدر المختار» للحصكفي، وهو شرح «تنوير الأبصار» للتمرتاشي، وتُعرف بحاشية ابن عابدين. تسير مع الشرح عبارةً عبارة بصيغة «قوله»، وتجمع أقوال كتب المذهب الحنفي ومتأخريه، وتعرض الخلاف بين أبي حنيفة وصاحبيه، وتنبّه على ما عليه الفتوى وعلى أثر العرف وأحوال زمان المؤلف. في المتحف جزآن مصوّران: الثالث ⁦(من العتق إلى الوقف)⁩ والرابع ⁦(من البيوع إلى الهبة، بولاق 1271هـ)⁩. {cite:radd-al-muhtar-scan-v3 p.20} {cite:radd-al-muhtar-bulaq-v4 p.2} {cite:radd-al-muhtar-bulaq-v4 p.528}"
  en: "The gloss of Muhammad Amin Ibn Abidin of Damascus (d. 1252 AH) on al-Haskafi's al-Durr al-Mukhtar, itself a commentary on al-Timurtashi's Tanwir al-Absar; it is known as Hashiyat Ibn Abidin. It follows the commentary phrase by phrase under the formula 'his words', gathers the statements of the Hanafi books and their later authorities, sets out the differences between Abu Hanifa and his two companions, and marks the view on which fatwa is given and the weight of custom and of the author's own time. The museum holds two scanned volumes: vol. 3 (manumission to waqf) and vol. 4 (sales to gifts, Bulaq 1271 AH)."
  ur: "محمد امین ابن عابدین دمشقی ⁦(وفات 1252ھ)⁩ کا حاشیہ، جو حصکفی کی «الدر المختار» پر ہے، اور وہ خود تمرتاشی کی «تنویر الابصار» کی شرح ہے؛ یہ «حاشیہ ابن عابدین» کے نام سے مشہور ہے۔ یہ «قولہ» کے صیغے سے شرح کے ایک ایک فقرے کے ساتھ چلتا ہے، حنفی کتب اور متاخرین کے اقوال جمع کرتا ہے، امام ابو حنیفہ اور صاحبین کا اختلاف بیان کرتا ہے، اور مفتیٰ بہ قول، عرف اور مصنف کے زمانے کے حالات پر تنبیہ کرتا ہے۔ میوزیم کے پاس دو اسکین شدہ جلدیں ہیں: جلد سوم ⁦(عتق سے وقف تک)⁩ اور جلد چہارم ⁦(بیوع سے ہبہ تک، بولاق 1271ھ)⁩۔"
  es: "La glosa de Muhammad Amin Ibn Abidin de Damasco (fallecido en 1252 AH) sobre al-Durr al-Mukhtar de al-Haskafi, que a su vez es un comentario sobre Tanwir al-Absar de al-Timurtashi, se conoce como Hashiyat Ibn Abidin. Sigue el comentario frase por frase bajo la fórmula «sus palabras», recopila las afirmaciones de los libros hanafíes y sus autoridades posteriores, expone las diferencias entre Abu Hanifa y sus dos compañeros, y señala la opinión sobre la que se emite la fatwa, así como el peso de la costumbre y de la época del autor. El museo conserva dos volúmenes escaneados: vol. 3 (manumisión al waqf) y vol. 4 (ventas a donaciones, Bulaq 1271 AH)."
  fr: "La glose de Muhammad Amin Ibn Abidin de Damas (mort en 1252 AH) sur al-Durr al-Mukhtar d'al-Haskafi, lui-même commentaire du Tanwir al-Absar d'al-Timurtashi, est connue sous le nom de Hashiyat Ibn Abidin. Elle reprend le commentaire phrase par phrase sous la formule « ses paroles », rassemble les affirmations des ouvrages hanafites et de leurs autorités postérieures, expose les divergences entre Abu Hanifa et ses deux compagnons, et indique l'avis sur lequel se fonde la fatwa, ainsi que le poids de la coutume et de l'opinion de l'époque de l'auteur. Le musée conserve deux volumes numérisés: le tome 3 (affranchissement et waqf) et le tome 4 (ventes et donations, Bulaq 1271 AH)."
  tr: "Muhammed Emin bin Ebidin el-Dimashqi'nin (ö. 1252 Hicri yılı) 'El-Dürr el-Muhtar' üzerine kenar notları, bu eser El-Tamartaşi'nin 'Tanwir el-Absar' üzerine bir yorumdur ve İbn Ebidin'in kenar notları olarak bilinir. Tefsirle birlikte, Hanefi ve sonraki alimlerin görüşlerini toplayan 'onun beyanı' şeklinde bir ifade sunulur; bu ifade Ebu Hanife ile iki sahabi arasındaki anlaşmazlıkları tartışır ve yazarın döneminin fetvası, gelenek ve koşullarına dikkat çeker. Müzede iki resimli cilt bulunmaktadır: üçüncüsü (Kurtuluştan Vakıfla) ve dördüncü (Satışlardan Hediyelere, Bulak 1271 H.). {atıf:] radd-al-muhtar-scan-v3 s.20} {cite:radd-al-muhtar-bulaq-v4 s.2} {cite:radd-al-muhtar-bulaq-v4 s.528}"
  id: "Catatan pinggir Muhammad Amin ibn Abidin al-Dimashqi (wafat 1252 H) tentang 'Al-Durr al-Mukhtar' oleh al-Haskafi, yang merupakan komentar atas 'Tanwir al-Absar' oleh Al-Tamartashi, yang dikenal sebagai catatan pinggir Ibn Abidin. Bersama dengan komentar, sebuah frasa dalam bentuk 'pernyataannya' disajikan, mengumpulkan pendapat Hanafi dan para sarjana berikutnya, membahas perselisihan antara Abu Hanifa dan kedua rekannya, serta menarik perhatian pada fatwa serta tradisi dan keadaan pada masa penulis. Museum ini memiliki dua volume bergambar: yang ketiga (Dari Pembebasan ke Wakaf) dan keempat (Dari Penjualan ke Hadiah, Bulaq 1271 AH). {cite:radd-al-muhtar-scan-v3 p.20} {cite:radd-al-muhtar-bulaq-v4 p.2} {cite:radd-al-muhtar-bulaq-v4 p.528}"
