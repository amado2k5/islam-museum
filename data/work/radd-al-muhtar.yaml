label:
  ar: "رد المحتار على الدر المختار"
  en: "Radd al-Muhtar ala al-Durr al-Mukhtar"
  ur: "رد المحتار علی الدر المختار"
summary:
  ar: "حاشية محمد أمين ابن عابدين الدمشقي ⁦(ت 1252هـ)⁩ على «الدر المختار» للحصكفي، وهو شرح «تنوير الأبصار» للتمرتاشي، وتُعرف بحاشية ابن عابدين. تسير مع الشرح عبارةً عبارة بصيغة «قوله»، وتجمع أقوال كتب المذهب الحنفي ومتأخريه، وتعرض الخلاف بين أبي حنيفة وصاحبيه، وتنبّه على ما عليه الفتوى وعلى أثر العرف وأحوال زمان المؤلف. في المتحف جزآن مصوّران: الثالث ⁦(من العتق إلى الوقف)⁩ والرابع ⁦(من البيوع إلى الهبة، بولاق 1271هـ)⁩. {cite:radd-al-muhtar-scan-v3 p.20} {cite:radd-al-muhtar-bulaq-v4 p.2} {cite:radd-al-muhtar-bulaq-v4 p.528}"
  en: "The gloss of Muhammad Amin Ibn Abidin of Damascus (d. 1252 AH) on al-Haskafi's al-Durr al-Mukhtar, itself a commentary on al-Timurtashi's Tanwir al-Absar; it is known as Hashiyat Ibn Abidin. It follows the commentary phrase by phrase under the formula 'his words', gathers the statements of the Hanafi books and their later authorities, sets out the differences between Abu Hanifa and his two companions, and marks the view on which fatwa is given and the weight of custom and of the author's own time. The museum holds two scanned volumes: vol. 3 (manumission to waqf) and vol. 4 (sales to gifts, Bulaq 1271 AH)."
  ur: "محمد امین ابن عابدین دمشقی ⁦(وفات 1252ھ)⁩ کا حاشیہ، جو حصکفی کی «الدر المختار» پر ہے، اور وہ خود تمرتاشی کی «تنویر الابصار» کی شرح ہے؛ یہ «حاشیہ ابن عابدین» کے نام سے مشہور ہے۔ یہ «قولہ» کے صیغے سے شرح کے ایک ایک فقرے کے ساتھ چلتا ہے، حنفی کتب اور متاخرین کے اقوال جمع کرتا ہے، امام ابو حنیفہ اور صاحبین کا اختلاف بیان کرتا ہے، اور مفتیٰ بہ قول، عرف اور مصنف کے زمانے کے حالات پر تنبیہ کرتا ہے۔ میوزیم کے پاس دو اسکین شدہ جلدیں ہیں: جلد سوم ⁦(عتق سے وقف تک)⁩ اور جلد چہارم ⁦(بیوع سے ہبہ تک، بولاق 1271ھ)⁩۔"
