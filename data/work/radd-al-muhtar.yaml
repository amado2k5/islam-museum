structure: "Gloss (hashiya) on al-Durr al-Mukhtar, ordered by the books (kutub) and chapters (abwab) of the Hanafi law manual; each note opens with the lemma «قوله» and marginal rubrics «مطلب» mark its topics. Vol. 3: Itq, Ayman, Hudud, Sariqa, Siyar (with jizya, the apostate and rebels), Laqit, Luqata, Ibaq, Mafqud, Sharika, Waqf. Vol. 4: Buyu' (with riba, salam, sarf), Kafala, Hawala, Qada', Shahadat, Wakala, Da'wa, Iqrar, Sulh, Mudaraba, Ida', Ariyya, Hiba."
