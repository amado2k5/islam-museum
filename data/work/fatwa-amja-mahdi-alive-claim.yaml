id: work/fatwa-amja-mahdi-alive-claim
class: work
kind: fatwa
label: { ar: "دعوى أن المهدي حي يرزق الآن", en: "The claim that the Mahdi is alive now", ur: "دعویٰ کہ مہدی ابھی زندہ ہے", es: "La afirmación de que el Mahdi está vivo ahora", fr: "L'affirmation selon laquelle le Mahdi est vivant maintenant", tr: "Mehdi'nin hayatta olduğu ve artık besin olduğu iddiası", id: "Klaim bahwa Mahdi masih hidup dan kini memiliki keberanian" }
summary:
  ar: "سأل سائل عن بحث منتشر في طور المظاهرات يزعم أن المهدي حي يرزق ويطعن في أدلته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85679 بتاريخ 16 أكتوبر 2011)⁩ أن المهدي حقيقة لا خرافة صحت فيه الأحاديث بل بلغت التواتر المعنوي عند بعض أهل العلم ومنها حديث ابن مسعود في ملء الأرض قسطًا وعدلًا، وأنه لم يأت في الأحاديث تعيين زمنه إلا أنه يخرج قبل خروج الدجال، وأما التنصيص على وجوده الآن فمن الرجم بالغيب والقول على الله بغير علم وينبغي عدم الاسترسال مع هذه الأقاويل."
  en: "A questioner asked about a circulating piece claiming the Mahdi is alive and providing and attacking its evidence. Dr. Salah al-Sawi (fatwa no. 85679, 16 October 2011) answered that the Mahdi is a reality, not a myth — hadiths on him are sound, reaching mutawatir in meaning for some scholars, among them Ibn Masud's hadith of filling the earth with equity and justice; the hadiths fix no time except that he emerges before the Dajjal; declaring him alive now by name is guessing at the unseen and saying of God without knowledge, not to be indulged. Recorded as AMJA's answer."
  ur: "ایک سائل نے مہدی کے ابھی زندہ ہونے کے دعوے والی تحریر پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85679، 16 اکتوبر 2011)⁩ کے مطابق مہدی کا آنا حق ہے لیکن کسی شخص کو ابھی مہدی کہنا غیب پر رجم ہے۔"
  es: "Un consultante preguntó sobre un artículo que circulaba afirmando que el Mahdi está vivo y presentó pruebas que lo refutaban. El Dr. Salah al-Sawi (fatwa n.° 85679, 16 de octubre de 2011) respondió que el Mahdi es una realidad, no un mito; los hadices sobre él son auténticos, alcanzando un significado mutawatir para algunos eruditos, entre ellos el hadiz de Ibn Masud sobre llenar la tierra de equidad y justicia; los hadices no fijan un momento específico, salvo que aparecerá antes del Dajjal; declararlo vivo ahora por su nombre es adivinar lo invisible y hablar de Dios sin conocimiento, algo que no se debe tolerar. Registrada como respuesta de AMJA."
  fr: "Un internaute a posé une question concernant un texte circulant affirmant que le Mahdi est vivant, en présentant et en réfutant les preuves. Le Dr Salah al-Sawi (fatwa n° 85679, 16 octobre 2011) a répondu que le Mahdi est une réalité, et non un mythe: les hadiths le concernant sont authentiques et, pour certains savants, leur signification est mutawatir, notamment le hadith d’Ibn Mas’ud sur le fait qu’il remplira la terre d’équité et de justice; les hadiths ne fixent aucun moment précis, si ce n’est celui de son apparition avant le Dajjal; affirmer qu’il est vivant aujourd’hui en le nommant relève de la conjecture sur l’invisible et de l’affirmation de Dieu sans connaissance, une pratique à ne pas adopter. Cette réponse est consignée dans la notice biographique de l’AMJA."
  tr: "Gösteriler sırasında bir soru soran kişiye, Mehdi'nin hayatta olduğu, besin sağladığı ve kanıtlarının sorgulandığı iddia edilen yaygın bir araştırma soruldu. Dr. Salah Al-Sawi (16 Ekim 2011 tarihli 85679 No. Fetva) Mehdi'nin bir efsane değil, bir gerçek olduğunu ve hadislerin bunu doğruladığını; aksine, bazı alimlere göre, İbn Mes'in yeryüzünü adalet ve hakkaniyetle doldurma hadislerine göre ruhani bir aktarıma ulaştığını söyledi. Hadislerin onun tam zamanını belirtmediğini, ancak Decal ortaya çıkmadan önce ortaya çıkacağını söyledi. Şu anda varlığını açıkça belirtmek ise, görünmeyenleri taşlamak ve bilgisiz Tanrı hakkında konuşmak olarak bu tür ifadeler devam ettirilmemelidir."
  id: "Seorang penanya ditanya tentang penelitian luas selama demonstrasi yang mengklaim bahwa Mahdi masih hidup, menyediakan nafkah, dan bahwa buktinya sedang dipertanyakan. Dr. Salah Al-Sawi menjawab (Fatwa No. 85679 tanggal 16 Oktober 2011) bahwa Mahdi adalah fakta, bukan mitos, dan hadis telah mengotentiknya; sebaliknya, telah sampai ke transmisi spiritual menurut beberapa ulama, termasuk hadis Ibn Mas'ud tentang memenuhi bumi dengan keadilan dan keadilan. Ia mengatakan bahwa hadis tidak menyebutkan waktu pastinya, tetapi ia akan muncul sebelum munculnya Dajjal. Adapun secara eksplisit menyatakan keberadaannya sekarang, itu adalah merejam yang tak terlihat dan berbicara tentang Tuhan tanpa pengetahuan, dan pernyataan seperti itu tidak boleh dilanjutkan."
