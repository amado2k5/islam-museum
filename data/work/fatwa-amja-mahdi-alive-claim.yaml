id: work/fatwa-amja-mahdi-alive-claim
class: work
kind: fatwa
label: { ar: "دعوى أن المهدي حي يرزق الآن", en: "The claim that the Mahdi is alive now", ur: "دعویٰ کہ مہدی ابھی زندہ ہے" }
summary:
  ar: "سأل سائل عن بحث منتشر في طور المظاهرات يزعم أن المهدي حي يرزق ويطعن في أدلته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85679 بتاريخ 16 أكتوبر 2011)⁩ أن المهدي حقيقة لا خرافة صحت فيه الأحاديث بل بلغت التواتر المعنوي عند بعض أهل العلم ومنها حديث ابن مسعود في ملء الأرض قسطًا وعدلًا، وأنه لم يأت في الأحاديث تعيين زمنه إلا أنه يخرج قبل خروج الدجال، وأما التنصيص على وجوده الآن فمن الرجم بالغيب والقول على الله بغير علم وينبغي عدم الاسترسال مع هذه الأقاويل."
  en: "A questioner asked about a circulating piece claiming the Mahdi is alive and providing and attacking its evidence. Dr. Salah al-Sawi (fatwa no. 85679, 16 October 2011) answered that the Mahdi is a reality, not a myth — hadiths on him are sound, reaching mutawatir in meaning for some scholars, among them Ibn Masud's hadith of filling the earth with equity and justice; the hadiths fix no time except that he emerges before the Dajjal; declaring him alive now by name is guessing at the unseen and saying of God without knowledge, not to be indulged. Recorded as AMJA's answer."
  ur: "ایک سائل نے مہدی کے ابھی زندہ ہونے کے دعوے والی تحریر پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85679، 16 اکتوبر 2011)⁩ کے مطابق مہدی کا آنا حق ہے لیکن کسی شخص کو ابھی مہدی کہنا غیب پر رجم ہے۔"
