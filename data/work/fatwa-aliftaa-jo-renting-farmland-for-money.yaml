id: work/fatwa-aliftaa-jo-renting-farmland-for-money
class: work
kind: fatwa
label: { ar: "تأجير الأرض للزراعة مقابل المال", en: "Renting farmland for money", ur: "زرعی زمین نقد کرایے پر دینا" }
summary:
  ar: "سؤال عن تأجير الأرض للزراعة مقابل المال، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز تأجير الأراضي البيضاء التي لا شجر فيها بمبلغ معلوم من النقود، ولا يجوز تأجير الأراضي التي فيها أشجار مثمرة، وإنما يجوز فيها عقد المساقاة بشروطه. أجابت الدائرة بأنه يجوز إجارة الأراضي البيضاء التي لا شجر فيها بمبلغ معلوم من النقود، واستشهدت بحديث رواه مسلم عن حنظلة بن قيس أنه سأل رافع بن خديج عن كراء الأرض فذكر النهي عنه، ثم أجاب بأنه لا بأس به بالذهب والفضة، ونقلت عن النووي في شرحه على صحيح مسلم (10/198) أن الشافعي وأبا حنيفة وكثيرين أجازوا إجارتها بالذهب والفضة. وقالت إن الأراضي التي فيها أشجار مثمرة لم ينضج ثمرها لا يحل تأجيرها لأن ذلك من بيع الثمر قبل بدو صلاحه وهو منهي عنه، لكن يجوز أن يتفق العامل مع صاحب الأرض على عقد مساقاة بشروطه الشرعية. وذكرت أن مجلس الإفتاء الأردني فصّل في قراره رقم (80) بين الأراضي البيضاء التي يجوز تأجيرها بالذهب أو الفضة أو النقود، والأراضي ذات الشجر التي لا يجوز تأجيرها بالنقود لسنة أو أكثر أو أقل، قبل نضج الثمار أو بعده، ولا تعيين حصة غير شائعة من حاصلاتها."
  en: "A question about renting farmland for money, in which Jordan's General Iftaa Department answered that bare land without trees may be rented for a known sum of money, while land with fruit trees may not be rented, though a sharecropping contract for orchards (musaqat) may be made on its conditions. The Department answered that bare land without trees may be rented for a known sum of money, citing a hadith narrated by Muslim in which Hanzala ibn Qays asked Rafi ibn Khadij about renting land; Rafi mentioned that it had been prohibited, then said there was no harm in renting it for gold and silver. It quoted al-Nawawi's commentary on Sahih Muslim (10/198) that al-Shafi'i, Abu Hanifa and many others permitted renting land for gold and silver. It said that land with fruit trees whose fruit has not ripened may not be rented, since that amounts to selling fruit before it is clearly ripe, which is prohibited, but the worker and the landowner may agree a sharecropping contract for the trees (musaqat) on its Shari'a conditions. It noted that the Jordanian Iftaa Council distinguished in its resolution 80 between bare land, which may be rented for gold, silver or money, and land with trees, which may not be rented for money for a year, more or less, whether before or after the fruit ripens, nor for a fixed, unshared portion of its produce."
  ur: "زرعی زمین نقد کرایے پر دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بغیر درختوں والی خالی زمین معلوم نقد رقم پر کرایے پر دی جا سکتی ہے، جبکہ پھل دار درختوں والی زمین کرایے پر نہیں دی جا سکتی، البتہ باغ کی شراکت (مساقات) کا عقد اس کی شرائط کے ساتھ کیا جا سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ بغیر درختوں والی خالی زمین معلوم نقد رقم پر کرایے پر دینا جائز ہے، اور مسلم کی روایت کردہ حدیث کا حوالہ دیا جس میں حنظلہ بن قیس نے رافع بن خدیج سے زمین کرایے پر دینے کے بارے میں پوچھا؛ رافع نے اس کی ممانعت کا ذکر کیا، پھر کہا کہ سونے اور چاندی کے عوض اس میں کوئی حرج نہیں۔ اس نے صحیح مسلم کی شرح (10/198) میں نووی سے نقل کیا کہ شافعی، ابو حنیفہ اور بہت سے دوسروں نے سونے اور چاندی کے عوض زمین کرایے پر دینا جائز قرار دیا۔ اس نے کہا کہ جس زمین میں پھل دار درخت ہوں جن کا پھل پکا نہ ہو، اسے کرایے پر دینا حلال نہیں کیونکہ یہ پھل کے واضح طور پر پکنے سے پہلے اس کی بیع ہے، جو ممنوع ہے، البتہ کارکن اور زمین کا مالک درختوں کے لیے شرعی شرائط کے ساتھ مساقات کا عقد کر سکتے ہیں۔ اس نے ذکر کیا کہ اردن کی افتا کونسل نے اپنی قرارداد 80 میں خالی زمین، جسے سونے، چاندی یا نقد پر کرایے پر دیا جا سکتا ہے، اور درختوں والی زمین میں فرق کیا، جسے ایک سال، زیادہ یا کم، پھل پکنے سے پہلے یا بعد، نقد پر کرایے پر نہیں دیا جا سکتا، نہ اس کی پیداوار کا کوئی غیر مشترک مقررہ حصہ طے کیا جا سکتا ہے۔"
