label: { ar: "السيرة النبوية (الندوي)", en: "Al-Sira al-Nabawiyya (al-Nadwi)", ur: "السیرۃ النبویہ (ندوی)" }
summary:
  ar: "كتاب أبي الحسن علي الحسني الندوي (1333–1420هـ) في سيرة النبي، صدرت طبعته الأولى سنة 1397هـ/1977م عن دار الشروق بجدة، وأراده مؤلفه سيرة بأسلوب عصري علمي مؤسَّسة على المصادر الأولى، تجمع بين العقل والعاطفة، وتصلح أن تُقدَّم للمسلمين وغيرهم؛ يبدأ بفصل طويل عن أحوال الأديان والأمم وجزيرة العرب ومكة في القرن السادس الميلادي، ثم يسير مع السيرة من الولادة إلى الوفاة، ثم فصل في الأخلاق والشمائل، وآخر في فضل البعثة على الإنسانية {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 42} {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 45-48} {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 749-766}."
  en: "Abu al-Hasan 'Ali al-Hasani al-Nadwi's (1333–1420 AH) biography of the Prophet, first published in 1397 AH/1977 CE by Dar al-Shuruq in Jeddah. Its author meant it as a biography written in a modern, scholarly manner on the earliest sources, joining reason and feeling and fit to be offered to Muslims and others alike. It opens with a long chapter on the religions, nations, Arabia and Mecca of the sixth century CE, follows the life from birth to death, and ends with chapters on the Prophet's character and on what his mission gave humanity {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 42} {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 45-48} {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 749-766}."
  ur: "ابو الحسن علی حسنی ندوی (1333–1420ھ) کی سیرتِ نبوی پر کتاب، جس کا پہلا ایڈیشن 1397ھ/1977ء میں دار الشروق جدہ سے شائع ہوا۔ مصنف نے اسے ایسی سیرت کے طور پر لکھا جو جدید علمی اسلوب میں ابتدائی مصادر پر مبنی ہو، عقل اور جذبے کو جمع کرے اور مسلمانوں اور غیر مسلموں دونوں کے سامنے پیش کی جا سکے۔ یہ چھٹی صدی عیسوی کے ادیان، اقوام، جزیرۂ عرب اور مکہ کے احوال پر ایک طویل فصل سے شروع ہوتی ہے، ولادت سے وفات تک سیرت کے ساتھ چلتی ہے، اور اخلاق و شمائل اور انسانیت پر بعثت کے احسان کی فصلوں پر ختم ہوتی ہے {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 42} {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 45-48} {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 749-766}۔"
