structure: "مقدمات (ص 41–56)؛ الفصل الأول: مدخل إلى السيرة — الأديان والأمم في القرن السادس، جزيرة العرب، قريش، مكة زمن البعثة (ص 57)؛ الفصل الثاني: من الولادة إلى البعثة (ص 151)؛ الفصل الثالث: العهد المكي (ص 177)؛ الفصل الرابع: الهجرة إلى المدينة (ص 223)؛ الفصل الخامس: العهد المدني (ص 247)؛ الفصل السادس: الأخلاق والشمائل (ص 559)؛ الفصل السابع: فضل البعثة المحمدية على الإنسانية (ص 605)؛ ثم جدول الأحداث والفهارس. الصفحات من نشرة دار ابن كثير 2004."
