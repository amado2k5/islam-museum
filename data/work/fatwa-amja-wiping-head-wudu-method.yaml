id: work/fatwa-amja-wiping-head-wudu-method
class: work
kind: fatwa
label: { ar: "مسح الرأس في الوضوء", en: "Wiping the head in wudu — the two reported ways", ur: "وضو میں سر کا مسح — دو صورتیں", es: "Limpiarse la cabeza en el wudu: las dos formas reportadas", fr: "S'essuyer la tête pour faire ses ablutions — les deux méthodes rapportées", tr: "Temizlik sırasında başın silme", id: "Mengelap kepala saat wudhu" }
summary:
  ar: "سأل سائل عن الكيفية الصحيحة في مسح الرأس في الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83508 بتاريخ 9 يناير 2011)⁩ أن مسح الرأس وردت فيه صفتان: الأولى أن يقبل بيديه ويدبر يبدأ بمقدم رأسه حتى يذهب بهما إلى قفاه ثم يردهما إلى المكان الذي بدأ منه وقد اتفق أهل العلم على استحباب هذه الكيفية، والثانية المسح على مقدم الرأس فقط وهو مذهب أهل الظاهر واختيار شيخ الإسلام ابن تيمية فكلاهما صحيح على ما فصّل الجواب."
  en: "A questioner asked the right way of wiping the head in wudu. Dr. Salah al-Sawi (fatwa no. 83508, 9 January 2011) answered that two manners are reported: first, moving both hands front to back — beginning at the fore of the head to the nape, then returning them to where they began, a way the scholars agree is recommended; second, wiping the fore of the head only — the Zahiris' madhhab and Ibn Taymiyya's choice; both are valid, as the answer details."
  ur: "ایک سائل نے سر مسح کرنے کا طریقہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83508، 9 جنوری 2011)⁩ کے مطابق دو صورتیں صحیح ہیں — پورا سر آگے پیچھے، یا صرف اگلا حصہ۔"
  es: "Un consultante preguntó cuál es la forma correcta de limpiarse la cabeza durante la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.° 83508, 9 de enero de 2011) respondió que se han reportado dos maneras: primero, moviendo ambas manos de adelante hacia atrás, comenzando en la frente hasta la nuca y luego volviéndolas a su posición inicial, una forma recomendada por los eruditos; segundo, limpiarse solo la frente, la escuela jurídica de los Zahiris y la elección de Ibn Taymiyya; ambas son válidas, como se detalla en la respuesta."
  fr: "Une personne a demandé quelle était la bonne manière de s'essuyer la tête lors des ablutions (wudu). Le Dr Salah al-Sawi (fatwa n° 83508, 9 janvier 2011) a répondu que deux manières sont rapportées: premièrement, en déplaçant les deux mains d'avant en arrière, du front jusqu'à la nuque, puis en les ramenant à leur point de départ; cette méthode est recommandée par les savants. Deuxièmement, en s'essuyant uniquement le front; c'est la méthode préconisée par l'école zahirite et celle d'Ibn Taymiyya. Les deux méthodes sont valides, comme le précise la réponse."
  tr: "Bir soru soran kişiye abdest alma sırasında başın doğru şekilde silinmesi gerektiği soruldu. Dr. Salah Al-Sawi (9 Ocak 2011 tarihli Fetva No. 83508) başı silmenin iki özelliği olduğunu yanıtladı: birincisi, başı silmek ellerle öpülür ve ellerini başının önünden başının arkasına getirdikten sonra tekrar başının arkasına getirir, sonra tekrar başladığı yere getirir ve alimler bu yöntemin önerisini kabul eder; ikincisi ise sadece başın önünden silmek, ki bu, Şeyh al-İslam İbn Teymiye'nin görüşü ve seçimi doğrudur ve her ikisi de ayrıntılı cevaba göre doğrudur."
  id: "Seorang penanya ditanya tentang metode yang benar untuk mengelap kepala saat wudhu. Dr. Salah Al-Sawi menjawab (Fatwa No. 83508 tanggal 9 Januari 2011) bahwa mengelap kepala memiliki dua karakteristik: pertama, mengelap kepala adalah dicium dengan tangan lalu diputar, dimulai dari bagian depan kepala hingga dibawa ke belakang kepala, lalu dikembalikan ke tempat asalnya, dan para ulama sepakat dengan rekomendasi metode ini; kedua, mengelap hanya di bagian depan kepala, yang merupakan pandangan yang tampak dan pilihan Sheikh al-Islam Ibn Taymiyyah, keduanya benar menurut jawaban rinci."
