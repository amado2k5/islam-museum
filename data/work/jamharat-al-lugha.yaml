label: { ar: "جمهرة اللغة", en: "Jamharat al-Lugha", es: "Jamharat al-Lugha", fr: "Jamharat al-Lugha", ur: "جمہرۃ اللغۃ" }
summary:
  ar: "جمهرة اللغة لابن دريد، ثالث معجم عربي بعد كتاب العين وكتاب الجيم. أهداه إلى عبد الله بن محمد بن ميكال وقدّم له بمقدمة في الترتيب والحروف ومخارجها وأوزان الأسماء. سمّاه الجمهرة لأنه أراد جمع جمهور كلام العرب المستعمل. سار على نظام العين في الأصول لكنه ترك ترتيب المخارج إلى الترتيب الهجائي، فقسّم الكلمات أولاً إلى أبواب بحسب طول الأصل ثم رتّبها من الهمزة إلى الياء، وجمع تقاليب الجذر في موضع واحد. ويلاحظ بعلبكي في «أرابيكا» أن قول ابن دريد في المقدمة إنه اختار الجمهور وترك الوحشي لا يطابق ما في المتن من غريب ونادر، وأن تقسيمه إلى أبنية جعل بنية الكتاب معقدة وأورد بعض الجذور في أبواب مختلفة. ويذكر بعلبكي في الجمهرة ٥٦٠٥ شواهد شعرية، في حين لا تتجاوز شواهد التنزيل والحديث معاً الألف."
  en: "Ibn Durayd's Jamharat al-Lugha, the third Arabic dictionary after Kitab al-Ayn and Kitab al-Jim. He dedicated it to Abdallah ibn Muhammad ibn Mikali and opened it with a preface on arrangement, letters, their points of articulation and noun patterns. He called it al-Jamhara because he meant to gather the greater part of Arabic in common use. He followed al-Ayn's root-based system but replaced its order by articulation point with alphabetical order: words are first divided into chapters by the length of the root, then ordered from hamza to ya, and the permutations of a root are treated together. Baalbaki notes in Arabica that Ibn Durayd's statement in the preface, that he chose the common speech and left aside the strange, does not fit the rare and unfamiliar material in the book, and that its division by pattern made the structure complicated and put some roots in different chapters. Baalbaki counts 5,605 poetic citations in al-Jamhara, against no more than a thousand citations from the Qur'an and hadith together."
  es: "El Jamharat al-Lugha de Ibn Durayd, el tercer diccionario árabe tras el Kitab al-Ayn y el Kitab al-Jim. Lo dedicó a Abdallah ibn Muhammad ibn Mikali y lo abrió con un prólogo sobre la ordenación, las letras, sus puntos de articulación y los patrones nominales. Lo llamó al-Jamhara porque quería reunir la mayor parte del árabe de uso común. Siguió el sistema de raíces de al-Ayn pero sustituyó su orden por puntos de articulación por el orden alfabético: las palabras se dividen primero en capítulos según la longitud de la raíz, luego se ordenan de la hamza a la ya, y las permutaciones de una raíz se tratan juntas. Baalbaki observa en Arabica que la afirmación de Ibn Durayd en el prólogo de que eligió el habla común y dejó de lado lo extraño no concuerda con el material raro y poco familiar del libro, y que su división por patrones complicó la estructura y puso algunas raíces en capítulos distintos. Baalbaki cuenta 5605 citas poéticas en la Jamhara, frente a no más de mil citas del Corán y del hadiz juntas."
  fr: "Le Jamharat al-Lugha d'Ibn Durayd, troisième dictionnaire arabe après le Kitab al-Ayn et le Kitab al-Jim. Il le dédia à Abdallah ibn Muhammad ibn Mikali et l'ouvrit par une préface sur le classement, les lettres, leurs points d'articulation et les schèmes nominaux. Il l'appela al-Jamhara parce qu'il voulait réunir la plus grande part de l'arabe d'usage courant. Il suivit le système de racines d'al-Ayn mais remplaça son ordre par points d'articulation par l'ordre alphabétique : les mots sont d'abord répartis en chapitres selon la longueur de la racine, puis rangés du hamza au ya, et les permutations d'une racine sont traitées ensemble. Baalbaki note dans Arabica que la déclaration d'Ibn Durayd dans la préface, selon laquelle il a choisi la langue courante et laissé de côté l'étrange, ne correspond pas au matériau rare et peu familier du livre, et que sa division par schèmes a compliqué la structure et placé certaines racines dans des chapitres différents. Baalbaki compte 5 605 citations poétiques dans la Jamhara, contre au plus mille citations du Coran et du hadith réunies."
  ur: "ابن درید کی جمہرۃ اللغۃ، کتاب العین اور کتاب الجیم کے بعد عربی کی تیسری لغت۔ انہوں نے اسے عبداللہ بن محمد بن میکال کے نام معنون کیا اور ترتیب، حروف، ان کے مخارج اور اسماء کے اوزان پر مقدمے سے شروع کیا۔ اس کا نام الجمہرہ اس لیے رکھا کہ وہ عربی کے مستعمل کلام کا بڑا حصہ جمع کرنا چاہتے تھے۔ انہوں نے العین کے مادوں کا نظام اپنایا مگر مخارج کی ترتیب چھوڑ کر حروفِ تہجی کی ترتیب اختیار کی: الفاظ پہلے مادے کی لمبائی کے ابواب میں بٹتے ہیں، پھر ہمزہ سے یا تک ترتیب پاتے ہیں، اور ایک مادے کے تقالیب ایک جگہ آتے ہیں۔ بعلبکی «اربیکا» میں نوٹ کرتے ہیں کہ ابن درید کا مقدمے میں یہ کہنا کہ انہوں نے عام کلام چنا اور وحشی چھوڑ دیا، کتاب کے نادر اور غیر مانوس مواد سے مطابقت نہیں رکھتا، اور اوزان کے لحاظ سے تقسیم نے ساخت کو پیچیدہ کیا اور بعض مادے مختلف ابواب میں رکھ دیے۔ بعلبکی جمہرہ میں 5,605 شعری شواہد گنتے ہیں جبکہ قرآن و حدیث کے شواہد مل کر ہزار سے زیادہ نہیں۔"
