summary:
  ar: "وردت إلى لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا أسئلة عدة عن صلاة التراويح في ظل نازلة وباء كورونا. أجابت اللجنة ⁦(فتوى رقم 87755 بتاريخ 23 أبريل 2020)⁩ بتفصيل أحكام أدائها في البيوت والجماعة فيها وما يلزم في النازلة على ما ورد في الجواب."
  en: "AMJA's fatwa committee received several questions on the tarawih prayer amid the COVID epidemic. The committee (fatwa no. 87755, 23 April 2020) answered detailing the rulings on performing it in homes, congregating for it and what the crisis requires — as the response sets out."
