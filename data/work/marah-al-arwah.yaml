summary:
  ar: "مراح الأرواح، كتاب في الصرف والتصريف لمؤلفه أحمد بن علي بن مسعود، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نحو القرنين 7–8هـ {cite:ketabonline-marah-al-arwah}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، مع شروحها في شرحان على مراح الأرواح برقم 23140 بحسب الملف {cite:shamela-org-pdf-marah-al-arwah}. لم يقرأ المتحف الكتاب."
  en: "Marah al-Arwah, a book on morphology (sarf and tasrif) by Ahmad ibn Ali ibn Mas'ud; its date in a research summary supplied to the museum is c. 7th–8th c. AH {cite:ketabonline-marah-al-arwah}. The summary's answer on its presence in the Shamela library: Yes, with commentaries in Sharhan ala Marah al-Arwah, Book ID 23140, according to the file {cite:shamela-org-pdf-marah-al-arwah}. The museum has not read the book."
  ur: "مراح الأرواح، صرف و تصریف پر ایک کتاب، مصنف أحمد بن علي بن مسعود؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: تقریباً صدی 7–8ھ {cite:ketabonline-marah-al-arwah}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، شروح کے ساتھ، شرحان علی مراح الارواح کتاب نمبر 23140، فائل کے مطابق {cite:shamela-org-pdf-marah-al-arwah}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Marah al-Arwah, livre sur la morphologie (sarf et tasrif) de Ahmad ibn Ali ibn Mas'ud ; sa date dans une synthèse de recherche remise au musée : vers VIIe–VIIIe s. H {cite:ketabonline-marah-al-arwah}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, avec des commentaires dans Sharhan ala Marah al-Arwah, numéro 23140, selon le fichier {cite:shamela-org-pdf-marah-al-arwah}. Le musée n'a pas lu le livre."
  es: "Marah al-Arwah, libro sobre morfología (sarf y tasrif) de Ahmad ibn Ali ibn Mas'ud; su fecha en un resumen de investigación entregado al museo: hacia s. VII–VIII H. {cite:ketabonline-marah-al-arwah}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, con comentarios en Sharhan ala Marah al-Arwah, libro 23140, según el archivo {cite:shamela-org-pdf-marah-al-arwah}. El museo no ha leído el libro."
