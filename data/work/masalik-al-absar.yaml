structure: "Vol. 1 (Zaki Pasha ed.): author's preface (praise of al-Nasir Muhammad ibn Qalawun, method, restriction to the realms of Islam, caution with marvels); bab 1 on the measure and state of the earth in six fasls (its sphericity, the heavens, dimensions by the Indians, Hermes, Eratosthenes, Ptolemy, al-Ma'mun's survey and Ibn al-Shatir, the inhabited quarter; the names of earth, dust and sand; mountains and rivers); then the sacred places: the Ka'ba, its kiswa and the Masjid al-Haram, the Prophet's Mosque and the mosques of Medina, al-Masjid al-Aqsa and the Dome of the Rock as built up to 743 AH, Hebron, and the Umayyad Mosque of Damascus. Contents at scan pp. 13-24."
