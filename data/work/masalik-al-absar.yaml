summary:
  ar: "موسوعة ابن فضل الله العمري الجغرافية: قسم أول في الأرض — مقدارها وأقاليمها وبحارها وقبلتها وطرقها وممالك أمصارها — وقسم ثانٍ في سكانها من طوائف الأمم والديانات والمتدينين والدول قبل الإسلام وفي الإسلام {cite:umari-masalik-1924 pp. 11-14}."
  en: "Ibn Fadl Allah al-Umari's geographical encyclopedia: a first section on the earth — its measure, climes, seas, qibla, roads and the kingdoms of its cities — and a second on its inhabitants: nations, faiths, devotees, and the dynasties before and under Islam {cite:umari-masalik-1924 pp. 11-14}."
