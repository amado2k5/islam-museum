id: work/fatwa-aliftaa-jo-combat-sports-with-blows-to-the-head
class: work
kind: fatwa
label: { ar: "ضوابط الرياضات القتالية", en: "Rules for combat sports that involve blows to the head", ur: "سر پر ضرب والے جنگی کھیلوں کے ضوابط" }
summary:
  ar: "سؤال عن حكم الرياضة التي يكون فيها الضرب على الرأس، أجابت فيه دائرة الإفتاء العام الأردنية بأن الإسلام حث على الرياضة التي تكسب الجسم اللياقة والصحة، وحرّم كل ما من شأنه الإضرار بالجسد كالضرب على الوجه والرأس الذي تبين خطره من ارتجاج الدماغ أو الوفاة، مستدلة بحديث البخاري أن من قاتل فليجتنب الوجه، وبتعليل النووي الذي نقله بدر الدين العيني في عمدة القاري بأن الوجه لطيف يجمع المحاسن ويقع به أكثر الإدراك فيُخشى من ضربه أن يبطل أو يتشوه. وقررت أن من قواعد الشرع أن ما ثبت ضرره ثبتت حرمته، فتحرم هذه الرياضات إن ترتب عليها ضرر أو أذى يلحق بالمضروب، إلا إذا اتُّخذت الإجراءات اللازمة لمنع الأذى عن اللاعبين كارتداء الخوذة والملابس الواقية ونحوها من الاحتياطات، فلا حرج حينئذ في ممارستها."
  en: "A question about the ruling on sports that involve blows to the head, in which Jordan's General Iftaa Department answered that Islam encourages sports that give the body fitness and health, and forbids whatever harms the body, such as blows to the face and head, whose danger of concussion or death has been established; it cited the hadith in al-Bukhari that whoever fights should avoid the face, and al-Nawawi's reasoning as quoted by Badr al-Din al-Ayni in Umdat al-Qari that the face is delicate, gathers a person's beauty and is the seat of most perception, so a blow to it risks disabling or disfiguring it. It ruled that it is a principle of sharia that whatever is proven harmful is proven forbidden, so these sports are forbidden if they cause harm or injury to the person struck, unless the measures needed to protect the players from injury are taken, such as wearing a helmet and protective clothing and similar precautions, in which case there is no blame in practising them."
  ur: "ایسے کھیلوں کے حکم کے بارے میں سوال جن میں سر پر ضرب لگائی جاتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے ایسی ورزش کی ترغیب دی ہے جو جسم کو تندرستی اور صحت دے، اور ہر اس چیز کو حرام کیا جو جسم کو نقصان پہنچائے، جیسے چہرے اور سر پر ضرب جس کا دماغی چوٹ یا موت کا خطرہ ثابت ہے؛ اس نے بخاری کی اس حدیث سے استدلال کیا کہ جو لڑے وہ چہرے سے بچے، اور نووی کی اس وجہ سے جو بدر الدین عینی نے عمدۃ القاری میں نقل کی کہ چہرہ نازک ہے، خوبیوں کا مجموعہ ہے اور ادراک کا زیادہ تر حصہ اسی سے ہوتا ہے، اس لیے اس پر ضرب سے اس کے ناکارہ یا بدنما ہونے کا خطرہ ہے۔ اس نے فیصلہ کیا کہ شریعت کا قاعدہ ہے کہ جس چیز کا نقصان ثابت ہو اس کی حرمت ثابت ہے، لہٰذا یہ کھیل حرام ہیں اگر ان سے ضرب کھانے والے کو نقصان یا اذیت پہنچے، سوائے اس کے کہ کھلاڑیوں کو اذیت سے بچانے کے ضروری اقدامات کیے جائیں، جیسے ہیلمٹ اور حفاظتی لباس پہننا اور اسی طرح کی احتیاطیں، تو اس صورت میں ان کے کھیلنے میں کوئی حرج نہیں۔"
