id: work/fatwa-aliftaa-jo-combat-sports-with-blows-to-the-head
class: work
kind: fatwa
label: { ar: "ضوابط الرياضات القتالية", en: "Rules for combat sports that involve blows to the head", ur: "سر پر ضرب والے جنگی کھیلوں کے ضوابط", es: "Reglas para los deportes de combate que implican golpes en la cabeza.", fr: "Règles des sports de combat impliquant des coups à la tête", tr: "Dövüş sporları düzenlemeleri", id: "Peraturan olahraga tarung" }
summary:
  ar: "سؤال عن حكم الرياضة التي يكون فيها الضرب على الرأس، أجابت فيه دائرة الإفتاء العام الأردنية بأن الإسلام حث على الرياضة التي تكسب الجسم اللياقة والصحة، وحرّم كل ما من شأنه الإضرار بالجسد كالضرب على الوجه والرأس الذي تبين خطره من ارتجاج الدماغ أو الوفاة، مستدلة بحديث البخاري أن من قاتل فليجتنب الوجه، وبتعليل النووي الذي نقله بدر الدين العيني في عمدة القاري بأن الوجه لطيف يجمع المحاسن ويقع به أكثر الإدراك فيُخشى من ضربه أن يبطل أو يتشوه. وقررت أن من قواعد الشرع أن ما ثبت ضرره ثبتت حرمته، فتحرم هذه الرياضات إن ترتب عليها ضرر أو أذى يلحق بالمضروب، إلا إذا اتُّخذت الإجراءات اللازمة لمنع الأذى عن اللاعبين كارتداء الخوذة والملابس الواقية ونحوها من الاحتياطات، فلا حرج حينئذ في ممارستها."
  en: "A question about the ruling on sports that involve blows to the head, in which Jordan's General Iftaa Department answered that Islam encourages sports that give the body fitness and health, and forbids whatever harms the body, such as blows to the face and head, whose danger of concussion or death has been established; it cited the hadith in al-Bukhari that whoever fights should avoid the face, and al-Nawawi's reasoning as quoted by Badr al-Din al-Ayni in Umdat al-Qari that the face is delicate, gathers a person's beauty and is the seat of most perception, so a blow to it risks disabling or disfiguring it. It ruled that it is a principle of sharia that whatever is proven harmful is proven forbidden, so these sports are forbidden if they cause harm or injury to the person struck, unless the measures needed to protect the players from injury are taken, such as wearing a helmet and protective clothing and similar precautions, in which case there is no blame in practising them."
  ur: "ایسے کھیلوں کے حکم کے بارے میں سوال جن میں سر پر ضرب لگائی جاتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے ایسی ورزش کی ترغیب دی ہے جو جسم کو تندرستی اور صحت دے، اور ہر اس چیز کو حرام کیا جو جسم کو نقصان پہنچائے، جیسے چہرے اور سر پر ضرب جس کا دماغی چوٹ یا موت کا خطرہ ثابت ہے؛ اس نے بخاری کی اس حدیث سے استدلال کیا کہ جو لڑے وہ چہرے سے بچے، اور نووی کی اس وجہ سے جو بدر الدین عینی نے عمدۃ القاری میں نقل کی کہ چہرہ نازک ہے، خوبیوں کا مجموعہ ہے اور ادراک کا زیادہ تر حصہ اسی سے ہوتا ہے، اس لیے اس پر ضرب سے اس کے ناکارہ یا بدنما ہونے کا خطرہ ہے۔ اس نے فیصلہ کیا کہ شریعت کا قاعدہ ہے کہ جس چیز کا نقصان ثابت ہو اس کی حرمت ثابت ہے، لہٰذا یہ کھیل حرام ہیں اگر ان سے ضرب کھانے والے کو نقصان یا اذیت پہنچے، سوائے اس کے کہ کھلاڑیوں کو اذیت سے بچانے کے ضروری اقدامات کیے جائیں، جیسے ہیلمٹ اور حفاظتی لباس پہننا اور اسی طرح کی احتیاطیں، تو اس صورت میں ان کے کھیلنے میں کوئی حرج نہیں۔"
  es: "Una pregunta sobre la normativa de los deportes que implican golpes en la cabeza, a la que el Departamento General de Iftaa de Jordania respondió que el Islam fomenta los deportes que contribuyen a la buena forma física y la salud, y prohíbe todo aquello que dañe el cuerpo, como los golpes en la cara y la cabeza, cuyo peligro de conmoción cerebral o muerte está comprobado; citó el hadiz de al-Bujari que dice que quien pelea debe evitar golpear la cara, y el razonamiento de al-Nawawi, citado por Badr al-Din al-Ayni en Umdat al-Qari, según el cual el rostro es delicado, concentra la belleza de una persona y es la sede de la mayor parte de la percepción, por lo que un golpe en él conlleva el riesgo de incapacitarlo o desfigurarlo. Dictaminó que es un principio de la sharia que todo aquello que se demuestra dañino está prohibido, por lo que estos deportes están prohibidos si causan daño o lesiones a la persona golpeada, a menos que se tomen las medidas necesarias para proteger a los jugadores de lesiones, como el uso de casco y ropa protectora y precauciones similares, en cuyo caso no hay culpa en practicarlos."
  fr: "Concernant la question de la validité des sports impliquant des coups à la tête, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que l'Islam encourage les sports qui contribuent à la forme physique et à la santé, et interdit tout ce qui nuit au corps, notamment les coups portés au visage et à la tête, dont le risque de commotion cérébrale ou de décès est avéré. Il a cité le hadith rapporté par al-Bukhari, selon lequel quiconque se bat doit éviter le visage, ainsi que le raisonnement d'al-Nawawi, rapporté par Badr al-Din al-Ayni dans Umdat al-Qari, selon lequel le visage est délicat, concentre la beauté d'une personne et est le siège de la plupart des perceptions; un coup porté à ce visage risque donc de l'invalider ou de le défigurer. Il a statué que, selon un principe de la charia, tout ce qui est reconnu nocif est reconnu interdit. Par conséquent, ces sports sont interdits s'ils causent des dommages ou des blessures à la personne frappée, à moins que les mesures nécessaires à la protection des joueurs ne soient prises, telles que le port d'un casque et de vêtements de protection, et autres précautions similaires. Dans ce cas, leur pratique n'est pas répréhensible."
  tr: "Başa darbe içeren sporlarla ilgili kararla ilgili bir soruya ise, Ürdün Genel Fetva Dairesi, İslam'ın fitness ve sağlık sağlayan sporları teşvik ettiğini ve yüz ile başa vurmak gibi vücuda zarar veren her şeyi yasakladığını ve bunun beyin sarsıntısı veya ölüm riski taşıdığı bilindiğini belirtti. El-Buhari'nin hadisini, dövüşenin yüzden kaçınması gerektiğini ve Bedr al-Din el-Ayni'nin Umdat al-Ayni'de alıntıladığı Al-Nawawi'nin gerekçesiyle aktardı -Qari, yüzün nazik olduğu, erdemleri birleştirdiği ve en çok algılanan ve algılanma olasılığı en yüksek olduğu için ona vurmanın geçersiz kılma veya şekil bozukluğu korkusu vardır. Şeriat'ın ilkelerinden birinin, zararlı olduğu kanıtlanan şeylerin belirlenmesi ve bu sporların yaralı kişiye zarar veriyorsa yasak olduğu, oyunculara zarar vermemek için gerekli önlemler alınmadıkça, örneğin kask takmak, koruyucu giysi ve benzeri önlemler almak dışında yasak olduğu kararlaştırıldı; bu durumda bunları uygulamakta zarar yoktur."
  id: "Mengenai keputusan olahraga yang melibatkan pukulan di kepala, Departemen Fatwa Jenderal Yordania menanggapi bahwa Islam mendorong olahraga yang memberikan kebugaran dan kesehatan, serta melarang segala sesuatu yang merusak tubuh, seperti memukul wajah dan kepala, yang diketahui berisiko mengalami gegar otak atau kematian. Departemen tersebut mengutip hadits Al-Bukhari bahwa siapa pun yang bertarung harus menghindari wajah, dan dengan alasan Al-Nawawi yang dikutip oleh Badr al-Din al-Ayni dalam Umdat al-Qari, bahwa wajah itu lembut, menggabungkan kebajikan, dan paling mudah dipersepsikan, sehingga ada ketakutan bahwa memukulnya akan membatalkan atau menjadi cacat. Diputuskan bahwa salah satu prinsip Syariah adalah bahwa apa yang terbukti berbahaya harus ditetapkan, dan olahraga ini dilarang jika menyebabkan bahaya pada orang yang terluka, kecuali ada tindakan yang diperlukan untuk mencegah cedera pada pemain, seperti memakai helm, pakaian pelindung, dan tindakan pencegahan serupa, dalam hal ini tidak ada salahnya melakukannya."
