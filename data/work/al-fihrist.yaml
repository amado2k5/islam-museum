summary:
  ar: "كتاب الفهرست لأبي الفرج محمد بن إسحاق النديم، فهرس مؤلفات الأمم وعلومها وأسماء الكتب ومصنفيها على عشر مقالات، من أوسع ما بقي لنا في تراجم الكتب والمؤلفين في القرن الرابع الهجري {cite:fihrist-ibn-al-nadim p. 1-49}. وصرح مصنفه في صدره بأنه فهرست كتب جميع الأمم من العرب والعجم الموجود منها بلغة العرب وقلمها في أصناف العلوم وأخبار مصنفيها وطبقات مؤلفيها وأنسابهم وتأريخ مواليدهم ومبلغ أعمارهم وأوقات وفاتهم وأماكن بلدانهم ومناقبهم منذ ابتداء كل علم اخترع إلى عصره سنة سبع وسبعين وثلاث مائة للهجرة، واقتصص ما يحتوي عليه في عشر مقالات: في وصف لغات الأمم وأقلامها وكتب الشرائع وعلوم القرآن والقراء، والنحويين البصريين والكوفيين والمخالطين، والأخباريين والملوك والكتاب والندماء والمغنين، وطبقات الشعراء الجاهليين والإسلاميين، والمتكلمين على خمسة فنون، والفقهاء والمحدثين على ثمانية، والفلاسفة والطبيعيين وأهل التعاليم والأطباء، والمسامرين والمعزمين والسحرة، ومذاهب الصائبة والثنوية ومذاهب الأمم الغريبة، والكيمائيين {cite:fihrist-ibn-al-nadim p. 3-9}، وأخبر عند نهاية المقالة الأولى أن ذلك آخر ما صنفه منها إلى يوم التصنيف مستهل شعبان سنة سبع وسبعين وثلاثمائة {cite:fihrist-ibn-al-nadim p. 98}"
  en: "Ibn al-Nadim's Fihrist — the tenth-century bibliographic encyclopaedia of books, authors and sciences in ten discourses {cite:fihrist-ibn-al-nadim p. 1-49}."
