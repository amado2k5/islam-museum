label: { ar: "الفهرست", en: "al-Fihrist", ur: "الفہرست", es: "al-Fihrist", fr: "al-Fihrist", tr: "İndeks", id: "Indeks" }
summary:
  ar: "كتاب الفهرست لأبي الفرج محمد بن إسحاق النديم، فهرس مؤلفات الأمم وعلومها وأسماء الكتب ومصنفيها على عشر مقالات، من أوسع ما بقي لنا في تراجم الكتب والمؤلفين في القرن الرابع الهجري {cite:fihrist-ibn-al-nadim p. 1-49}. وصرح مصنفه في صدره بأنه فهرست كتب جميع الأمم من العرب والعجم الموجود منها بلغة العرب وقلمها في أصناف العلوم وأخبار مصنفيها وطبقات مؤلفيها وأنسابهم وتأريخ مواليدهم ومبلغ أعمارهم وأوقات وفاتهم وأماكن بلدانهم ومناقبهم منذ ابتداء كل علم اخترع إلى عصره سنة سبع وسبعين وثلاث مائة للهجرة، واقتصص ما يحتوي عليه في عشر مقالات: في وصف لغات الأمم وأقلامها وكتب الشرائع وعلوم القرآن والقراء، والنحويين البصريين والكوفيين والمخالطين، والأخباريين والملوك والكتاب والندماء والمغنين، وطبقات الشعراء الجاهليين والإسلاميين، والمتكلمين على خمسة فنون، والفقهاء والمحدثين على ثمانية، والفلاسفة والطبيعيين وأهل التعاليم والأطباء، والمسامرين والمعزمين والسحرة، ومذاهب الصائبة والثنوية ومذاهب الأمم الغريبة، والكيمائيين {cite:fihrist-ibn-al-nadim p. 3-9}، وأخبر عند نهاية المقالة الأولى أن ذلك آخر ما صنفه منها إلى يوم التصنيف مستهل شعبان سنة سبع وسبعين وثلاثمائة {cite:fihrist-ibn-al-nadim p. 98}"
  en: "Ibn al-Nadim's Fihrist — the tenth-century bibliographic encyclopaedia of books, authors and sciences in ten discourses {cite:fihrist-ibn-al-nadim p. 1-49}."
  ur: "ابو الفرج محمد بن اسحاق ابن الندیم کی الفہرست چوتھی صدی ہجری کی کتابیات کا انسائیکلوپیڈیا ہے جو قوموں کی کتابوں، مصنفین اور علوم کو دس مقالوں میں گنواتی ہے؛ اس کا پہلا مقالہ زبانوں اور خطوط کا ہے اور اس میں قراءات، اختلافِ مصاحف اور نقط و شکل پر کتابوں کی فہرستیں بھی ہیں {cite:fihrist-ibn-al-nadim p. 1-49}۔"
  es: "El Fihrist de Ibn al-Nadim: la enciclopedia bibliográfica del siglo X sobre libros, autores y ciencias en diez discursos {cite:fihrist-ibn-al-nadim p. 1-49}."
  fr: "Le Fihrist d'Ibn al-Nadim — l'encyclopédie bibliographique du Xe siècle des livres, des auteurs et des sciences en dix discours {cite:fihrist-ibn-al-nadim p. 1-49}."
  tr: "Ebu el-Faraj Muhammed bin İshaq el-Nadim'in Al-Fihrist adlı kitabı, ulusların eserlerinin, bilimlerinin ve kitapların ve yazarlarının on bölümdeki isimlerinin bir dizini, dördüncü yüzyıl Hicri kitap ve yazarların biyografilerinde günümüze ulaşan en kapsamlı eserler arasında yer alır {atıf:fihrist-ibn-al-nadim s. 1-49}. Yazarı önsözünde, Arapların dilinde ve yazılarında tüm milletlerin, Arapların ve yazılarının kitaplarının bir dizini olduğunu açıkça belirtmiştir; bu kitap, bilim kategorileri, yazarlarının raporları, yazarlarının sınıfları, soy kütükleri, doğum tarihleri, yaşları, ölüm zamanları, ülkelerinin yerleri ve erdemlerini kapsamaktadır; bu tarih her bilimin başlangıcından 377 Hicri yılına kadar ortaya çıkmıştır. İçindekileri on maddeye özlemiştir: ulusların dillerini ve kalemlerini, dini hukuk kitaplarını, Kur'an bilimlerini ve okunucularını, Basran dilbilgicilerini, Kuşanları, muhatapları, haber yazarlarını, kralları, yazarları, yoldaşları, şarkıcıları ve şair sınıflarını anlatan İslam öncesi ve İslam alimleri, beş alanın ilahiyatçıları, sekiz alanın hukukçuları ve hadisâlimleri, filozoflar, doğa bilimciler, alimler ve hekimler, büyücüler, sihirbazlar, Seybe ve İkilik okulları, yabancı ulusların öğretileri ve kimyagerler {cite:fihrist-ibn-al-nadim s. 3-9}. İlk makalenin sonunda, bunun derlenme gününe, yani 377 Hicri yılındaki Şa'ban'ın başlangıcına kadar yazdığı son eser olduğunu bildirdi."
  id: "Buku Al-Fihrist karya Abu al-Faraj Muhammad ibn Ishaq al-Nadim, sebuah indeks karya bangsa-bangsa, ilmu mereka, serta nama-nama buku dan penulisnya dalam sepuluh bagian, merupakan salah satu karya paling luas yang masih bertahan dalam biografi buku dan penulis abad keempat H {cite:fihrist-ibn-al-nadim hlm. 1-49}. Penulisnya secara eksplisit menyatakan dalam kata pengantar bahwa ia adalah indeks dari kitab-kitab dari semua bangsa, Arab dan non-Arab, dalam bahasa orang Arab dan tulisan mereka, mencakup kategori ilmu, laporan penulisnya, kelas penulisnya, silsilah mereka, tanggal kelahiran, usia, waktu kematian, tempat negara mereka, dan kebajikan mereka sejak awal setiap ilmu yang ditemukan hingga zamannya pada tahun 377 H. Ia merangkum isinya menjadi sepuluh artikel: menggambarkan bahasa dan pena bangsa-bangsa, buku hukum agama, ilmu dan pembaca Al-Qur'an, ahli tata bahasa Basran, Kufan, lawan bicara, penulis berita, raja, penulis, teman, penyanyi, dan kelas penyair Para ulama pra-Islam dan Islam, teolog dari lima bidang, ahli hukum dan ulama hadis delapan bidang, filsuf, naturalis, ulama dan dokter, penyihir, penyihir, aliran Sa'ibah dan Dualisme, doktrin bangsa asing, dan ahli kimia {cite:fihrist-ibn-al-nadim hlm. 3-9}. Ia memberitahukan di akhir artikel pertama bahwa ini adalah karya terakhir yang ia tulis hingga hari penyusunan, awal Sha'ban pada tahun 377 H."
