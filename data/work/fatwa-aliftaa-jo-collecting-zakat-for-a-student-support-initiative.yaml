id: work/fatwa-aliftaa-jo-collecting-zakat-for-a-student-support-initiative
class: work
kind: fatwa
label: { ar: "جمع الزكاة والصدقات لمبادرة دعم الطلبة المحتاجين", en: "Collecting zakat and charity for a needy-student initiative", ur: "ضرورت مند طلبہ کی مدد کے منصوبے کے لیے زکوٰۃ اور صدقات جمع کرنا", es: "Recaudación de zakat y caridad para una iniciativa estudiantil necesitada.", fr: "Collecte de la zakat et de dons pour une initiative en faveur des étudiants nécessiteux", tr: "İhtiyaç Sahibi Öğrencileri Destekleme Girişimi İçin Zekat ve Hayır Toplama", id: "Mengumpulkan Zakat dan Amal untuk Inisiatif Mendukung Siswa yang Membutuhkan" }
summary:
  ar: "سؤال عن جمع الزكاة والصدقات لمبادرة دعم الطلبة المحتاجين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في جمع الصدقات التطوعية لمبادرة ⁦(دينار)⁩ لدعم الطلبة، أما الزكاة فلا تجمع لها إلا بضوابط: أن تصل إلى الطلبة المستحقين بتمليكهم، وأن تفصل عن الصدقات بحساب مستقل، وألا تؤخر لتدفع أقساطًا شهرية. أجابت الدائرة بأن الإسلام حث على المبادرة بالخير، ومنه ابتكار الأفكار التي تشجع الناس عليه، واستشهدت بحديث رواه مسلم معناه أن من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده، وقالت إنه لا حرج في إطلاق المبادرة لجمع الصدقات التطوعية لصالح فئة من الطلاب. وأما جمع الزكاة للمبادرة فلا يجوز إلا بضوابط: أولها أن المتطوع بجمعها وتوزيعها وكيل عن المزكين ومؤتمن على ما يدفع إليه، فيجب أن تصل الأموال إلى الطلبة المسلمين المستحقين الذين تتوافر فيهم شروط أخذ الزكاة، وذلك بتمليكهم إياها. وثانيها وجوب الفصل بين الزكاة والصدقات التطوعية بحساب مستقل لكل منهما، لأنه يحرم تعمد تأخير الزكاة بعد وجوبها مع القدرة على أدائها بقصد دفعها أقساطًا شهرية للطلبة، ومن فعل ذلك كان غاصبًا لحق الفقراء، ونقلت عن مغني المحتاج (2/129) أن الزكاة يجب أداؤها على الفور، ومن أخر أثم وضمن إن تلف المال. ونبهت الدائرة إلى ضرورة إخبار المتبرعين بالصدقات التطوعية بالغاية من جمعها وأوجه صرفها."
  en: "A question about collecting zakat and charity for a needy-student initiative, in which Jordan's General Iftaa Department answered that there is no objection to collecting voluntary charity for the \"Dinar\" initiative supporting students, but zakat may be collected for it only under conditions: it must reach eligible students as their property, be kept in a separate account from voluntary charity, and not be held back to pay out in monthly instalments. The Department answered that Islam encourages taking the initiative in good works, including devising ideas that encourage others to do good, citing a hadith narrated by Muslim whose meaning is that whoever establishes a good practice in Islam has its reward and the reward of those who act on it after him; there is no objection to launching the initiative to collect voluntary charity for a group of students. Collecting zakat for the initiative, however, is permitted only under conditions. First, the volunteer who collects and distributes it is the agent of those paying zakat and holds what he receives in trust, so the money must reach Muslim students who are eligible to receive zakat, by being transferred to their ownership. Second, zakat and voluntary charity must be kept apart, each in a separate account, since it is forbidden to deliberately delay zakat once due and payable in order to pay it to students in monthly instalments; whoever does so usurps the right of the poor. It quoted Mughni al-Muhtaj (2/129) that zakat must be paid at once, and whoever delays it sins and is liable if the wealth perishes. The Department stressed that donors of voluntary charity must be told the purpose of the collection and how it will be spent."
  ur: "ضرورت مند طلبہ کی مدد کے منصوبے کے لیے زکوٰۃ اور صدقات جمع کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ طلبہ کی مدد کے \"دینار\" منصوبے کے لیے نفلی صدقات جمع کرنے میں کوئی حرج نہیں، مگر زکوٰۃ صرف شرائط کے ساتھ جمع کی جا سکتی ہے: وہ مستحق طلبہ کو ملکیت کے طور پر پہنچے، نفلی صدقات سے الگ کھاتے میں رکھی جائے، اور ماہانہ قسطوں میں دینے کے لیے روکی نہ جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے نیکی میں پہل پر ابھارا ہے، جس میں ایسے خیالات پیش کرنا بھی شامل ہے جو دوسروں کو نیکی کی ترغیب دیں، اور مسلم کی روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ جو اسلام میں کوئی اچھا طریقہ جاری کرے اسے اس کا اجر اور بعد میں اس پر عمل کرنے والوں کا اجر ملے گا؛ طلبہ کے ایک طبقے کے لیے نفلی صدقات جمع کرنے کا منصوبہ شروع کرنے میں کوئی حرج نہیں۔ البتہ منصوبے کے لیے زکوٰۃ جمع کرنا صرف شرائط کے ساتھ جائز ہے۔ پہلی یہ کہ اسے جمع اور تقسیم کرنے والا رضاکار زکوٰۃ دینے والوں کا وکیل اور اپنے پاس آنے والے مال کا امین ہے، اس لیے مال ان مسلمان طلبہ تک پہنچنا ضروری ہے جو زکوٰۃ لینے کی شرائط پوری کرتے ہوں، انہیں مالک بنا کر۔ دوسری یہ کہ زکوٰۃ اور نفلی صدقات کو الگ الگ کھاتوں میں رکھنا واجب ہے، کیونکہ زکوٰۃ واجب اور قابلِ ادا ہونے کے بعد اسے طلبہ کو ماہانہ قسطوں میں دینے کے ارادے سے جان بوجھ کر مؤخر کرنا حرام ہے، اور ایسا کرنے والا فقرا کا حق غصب کرنے والا ہے۔ اس نے مغنی المحتاج (2/129) سے نقل کیا کہ زکوٰۃ فوراً ادا کرنا واجب ہے، اور جو تاخیر کرے وہ گناہگار ہے اور مال ضائع ہو تو ضامن ہے۔ ڈیپارٹمنٹ نے تاکید کی کہ نفلی صدقات دینے والوں کو جمع کرنے کا مقصد اور خرچ کے مصارف بتانا ضروری ہے۔"
  es: "Una pregunta sobre la recaudación de zakat y caridad para una iniciativa de estudiantes necesitados, a la que el Departamento General de Iftaa de Jordania respondió que no hay objeción a la recaudación de caridad voluntaria para la iniciativa \"Dinar\" que apoya a los estudiantes, pero el zakat solo puede recaudarse bajo ciertas condiciones: debe llegar a los estudiantes elegibles como su propiedad, mantenerse en una cuenta separada de la caridad voluntaria y no retenerse para pagarse en cuotas mensuales. El Departamento respondió que el Islam fomenta la iniciativa en buenas obras, incluyendo la ideación de propuestas que animen a otros a hacer el bien, citando un hadiz narrado por Muslim cuyo significado es que quien establece una buena práctica en el Islam tiene su recompensa y la recompensa de quienes la siguen después; no hay objeción a lanzar la iniciativa para recaudar caridad voluntaria para un grupo de estudiantes. Sin embargo, la recaudación de zakat para la iniciativa solo está permitida bajo ciertas condiciones. Primero, el voluntario que recolecta y distribuye el zakat actúa como agente de quienes lo pagan y lo mantiene en fideicomiso, por lo que el dinero debe llegar a los estudiantes musulmanes que tienen derecho a recibirlo, transfiriéndose a su nombre. Segundo, el zakat y la caridad voluntaria deben mantenerse separados, cada uno en una cuenta distinta, ya que está prohibido retrasar deliberadamente el pago del zakat una vez vencido para abonarlo a los estudiantes en cuotas mensuales; quien lo haga usurpa el derecho de los pobres. Se citó a Mughni al-Muhtaj (2/129) que establece que el zakat debe pagarse de inmediato, y quien lo retrase peca y es responsable si la riqueza se pierde. El Departamento recalcó que se debe informar a los donantes de caridad voluntaria sobre el propósito de la colecta y cómo se utilizará."
  fr: "Concernant la collecte de la zakat et des aumônes pour une initiative en faveur d'étudiants nécessiteux, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu qu'il n'y a pas d'objection à la collecte d'aumônes volontaires pour l'initiative « Dinar » soutenant les étudiants. Cependant, la zakat ne peut être collectée que sous certaines conditions: elle doit parvenir aux étudiants éligibles en tant que leur propriété, être déposée sur un compte distinct des aumônes volontaires et ne pas être mise de côté pour être versée en mensualités. Le Département a expliqué que l'islam encourage la prise d'initiatives pour les bonnes œuvres, notamment en concevant des idées incitant autrui à faire le bien. Il a cité un hadith rapporté par Muslim, selon lequel quiconque instaure une bonne pratique en islam en récolte les fruits, ainsi que ceux de ceux qui la mettent en œuvre après lui. Il n'y a donc aucune objection à lancer une initiative de collecte d'aumônes volontaires pour un groupe d'étudiants. La collecte de la zakat pour cette initiative n'est toutefois autorisée que sous certaines conditions. Premièrement, le bénévole qui collecte et distribue la zakat agit au nom des assujettis et détient les fonds reçus en fiducie. Ainsi, l'argent doit parvenir aux étudiants musulmans éligibles à la zakat, en leur étant transféré. Deuxièmement, la zakat et les dons volontaires doivent être gérés séparément, chacun sur un compte distinct. Il est en effet interdit de retarder délibérément le paiement de la zakat, une fois due, afin de la verser aux étudiants en mensualités; quiconque agit ainsi usurpe les droits des pauvres. Le ministère cite le Mughni al-Muhtaj (2/129) qui stipule que la zakat doit être versée immédiatement et que quiconque la retarde commet un péché et est responsable en cas de perte des biens collectés. Le ministère a insisté sur le fait que les donateurs de dons volontaires doivent être informés de l'objet de la collecte et de son utilisation."
  tr: "İhtiyaç sahibi öğrencileri desteklemek için zekat ve yardım toplama sorusuna Ürdün Genel Fetva Dairesi, öğrencileri desteklemek için (Dinar) girişimi için gönüllü yardım toplamanın zararı olmadığını yanıtladı. Zekat ise sadece belirli koşullar altında toplanır: hak eden öğrencilere sahiplenerek ulaşması, ayrı bir hesapta hayırseverlikten ayrılması ve aylık taksitlerin ödenmemesi gerektiği. Bakanlık, İslam'ın iyiliği başlatmayı teşvik ettiğini, insanları onu takip etmeye teşvik eden fikirler icat etmeyi de içerdiğini belirtti. Müslüman'ın anlattığı, İslam'da iyi bir uygulamayı uygulayan kişinin ödülünü ve ardından onu uygulayanların ödülünü alacağı şeklinde bir hadise atıfta bulundu. Bir grup öğrencinin yararına gönüllü yardım toplama girişimini başlatmanın zararı olmadığını belirtti. Zekat toplama başlangıçta sadece belirli koşullar altında izin verilir: Birincisi, zekatı toplayan ve dağıtan gönüllü, zekatı verenin vekil olarak hareket eder ve kendisine ödenen parayı kendisine emanet eder. Fonlar, zekat alma şartlarını karşılayan hak eden Müslüman öğrencilere mülkiyet vererek ulaşmalıdır. İkincisi, zekatın zorunlu hale geldikten sonra kasıtlı olarak ertelemesi ve öğrencilere aylık taksitleri ödemek için zekatın ertelemesi yasaktır. Bunu yapan yoksulların haklarını gasp etmektir. Mughni al-Muhtaj (2/129) şöyle bir söylemiştir: Zekatın derhal ödenmesi gerekir ve geciktiren kişi günahkar ve para kaybedilirse garantilidir. Daire, gönüllü yardım bağışçılarına toplama amacını ve harcanma şeklini bildirmenin gerekliliği konusunda uyardı."
  id: "Pertanyaan tentang pengumpulan zakat dan amal untuk inisiatif mendukung mahasiswa yang membutuhkan, di mana Departemen Fatwa Umum Yordania menanggapi bahwa tidak ada salahnya mengumpulkan amal sukarela untuk inisiatif (Dinar) guna mendukung mahasiswa. Adapun zakat, zakatlah hanya dikumpulkan dengan syarat tertentu: bahwa zakat sampai kepada siswa yang layak dengan memilikinya, bahwa dipisahkan dari amal dalam rekening terpisah, dan tidak tertunda membayar cicilan bulanan. Departemen menjawab bahwa Islam mendorong inisiasi kebaikan, termasuk menciptakan ide-ide yang mendorong orang untuk mengikutinya. Mereka mengutip sebuah hadits yang diceritakan oleh Muslim bahwa siapa pun yang melakukan praktik baik dalam Islam akan mendapatkan ganjaran dan hadiah dari mereka yang melakukannya setelahnya. Dikatakan tidak ada salahnya memulai inisiatif mengumpulkan amal sukarela demi kepentingan sekelompok pelajar. Adapun pengumpulan zakat pada awalnya, hanya diperbolehkan dengan syarat tertentu: Pertama, relawan yang mengumpulkan dan mendistribusikannya bertindak sebagai agen bagi pemberi zakat dan dipercayakan dengan apa yang dibayarkan kepadanya. Dana harus sampai kepada mahasiswa Muslim yang layak dan memenuhi syarat untuk menerima zakat, dengan memberikan kepemilikan. Kedua, wajib memisahkan zakat dari amal sukarela dengan rekening terpisah untuk masing-masing, karena dilarang sengaja menunda zakat setelah menjadi wajib sementara dapat membayarnya untuk membayar cicilan bulanan kepada mahasiswa. Siapa pun yang melakukan ini adalah merebut hak orang miskin. Departemen tersebut mengutip Mughni al-Muhtaj (2/129) bahwa zakat harus segera dibayarkan, dan siapa pun yang menundanya dianggap berdosa dan dijamin jika uang hilang. Departemen memperingatkan perlunya memberi tahu para donatur amal sukarela tentang tujuan pengumpulan dan cara penggunaannya."
