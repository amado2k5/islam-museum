id: work/fatwa-aliftaa-jo-collecting-zakat-for-a-student-support-initiative
class: work
kind: fatwa
label: { ar: "جمع الزكاة والصدقات لمبادرة دعم الطلبة المحتاجين", en: "Collecting zakat and charity for a needy-student initiative", ur: "ضرورت مند طلبہ کی مدد کے منصوبے کے لیے زکوٰۃ اور صدقات جمع کرنا" }
summary:
  ar: "سؤال عن جمع الزكاة والصدقات لمبادرة دعم الطلبة المحتاجين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في جمع الصدقات التطوعية لمبادرة (دينار) لدعم الطلبة، أما الزكاة فلا تجمع لها إلا بضوابط: أن تصل إلى الطلبة المستحقين بتمليكهم، وأن تفصل عن الصدقات بحساب مستقل، وألا تؤخر لتدفع أقساطًا شهرية. أجابت الدائرة بأن الإسلام حث على المبادرة بالخير، ومنه ابتكار الأفكار التي تشجع الناس عليه، واستشهدت بحديث رواه مسلم معناه أن من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده، وقالت إنه لا حرج في إطلاق المبادرة لجمع الصدقات التطوعية لصالح فئة من الطلاب. وأما جمع الزكاة للمبادرة فلا يجوز إلا بضوابط: أولها أن المتطوع بجمعها وتوزيعها وكيل عن المزكين ومؤتمن على ما يدفع إليه، فيجب أن تصل الأموال إلى الطلبة المسلمين المستحقين الذين تتوافر فيهم شروط أخذ الزكاة، وذلك بتمليكهم إياها. وثانيها وجوب الفصل بين الزكاة والصدقات التطوعية بحساب مستقل لكل منهما، لأنه يحرم تعمد تأخير الزكاة بعد وجوبها مع القدرة على أدائها بقصد دفعها أقساطًا شهرية للطلبة، ومن فعل ذلك كان غاصبًا لحق الفقراء، ونقلت عن مغني المحتاج (2/129) أن الزكاة يجب أداؤها على الفور، ومن أخر أثم وضمن إن تلف المال. ونبهت الدائرة إلى ضرورة إخبار المتبرعين بالصدقات التطوعية بالغاية من جمعها وأوجه صرفها."
  en: "A question about collecting zakat and charity for a needy-student initiative, in which Jordan's General Iftaa Department answered that there is no objection to collecting voluntary charity for the \"Dinar\" initiative supporting students, but zakat may be collected for it only under conditions: it must reach eligible students as their property, be kept in a separate account from voluntary charity, and not be held back to pay out in monthly instalments. The Department answered that Islam encourages taking the initiative in good works, including devising ideas that encourage others to do good, citing a hadith narrated by Muslim whose meaning is that whoever establishes a good practice in Islam has its reward and the reward of those who act on it after him; there is no objection to launching the initiative to collect voluntary charity for a group of students. Collecting zakat for the initiative, however, is permitted only under conditions. First, the volunteer who collects and distributes it is the agent of those paying zakat and holds what he receives in trust, so the money must reach Muslim students who are eligible to receive zakat, by being transferred to their ownership. Second, zakat and voluntary charity must be kept apart, each in a separate account, since it is forbidden to deliberately delay zakat once due and payable in order to pay it to students in monthly instalments; whoever does so usurps the right of the poor. It quoted Mughni al-Muhtaj (2/129) that zakat must be paid at once, and whoever delays it sins and is liable if the wealth perishes. The Department stressed that donors of voluntary charity must be told the purpose of the collection and how it will be spent."
  ur: "ضرورت مند طلبہ کی مدد کے منصوبے کے لیے زکوٰۃ اور صدقات جمع کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ طلبہ کی مدد کے \"دینار\" منصوبے کے لیے نفلی صدقات جمع کرنے میں کوئی حرج نہیں، مگر زکوٰۃ صرف شرائط کے ساتھ جمع کی جا سکتی ہے: وہ مستحق طلبہ کو ملکیت کے طور پر پہنچے، نفلی صدقات سے الگ کھاتے میں رکھی جائے، اور ماہانہ قسطوں میں دینے کے لیے روکی نہ جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے نیکی میں پہل پر ابھارا ہے، جس میں ایسے خیالات پیش کرنا بھی شامل ہے جو دوسروں کو نیکی کی ترغیب دیں، اور مسلم کی روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ جو اسلام میں کوئی اچھا طریقہ جاری کرے اسے اس کا اجر اور بعد میں اس پر عمل کرنے والوں کا اجر ملے گا؛ طلبہ کے ایک طبقے کے لیے نفلی صدقات جمع کرنے کا منصوبہ شروع کرنے میں کوئی حرج نہیں۔ البتہ منصوبے کے لیے زکوٰۃ جمع کرنا صرف شرائط کے ساتھ جائز ہے۔ پہلی یہ کہ اسے جمع اور تقسیم کرنے والا رضاکار زکوٰۃ دینے والوں کا وکیل اور اپنے پاس آنے والے مال کا امین ہے، اس لیے مال ان مسلمان طلبہ تک پہنچنا ضروری ہے جو زکوٰۃ لینے کی شرائط پوری کرتے ہوں، انہیں مالک بنا کر۔ دوسری یہ کہ زکوٰۃ اور نفلی صدقات کو الگ الگ کھاتوں میں رکھنا واجب ہے، کیونکہ زکوٰۃ واجب اور قابلِ ادا ہونے کے بعد اسے طلبہ کو ماہانہ قسطوں میں دینے کے ارادے سے جان بوجھ کر مؤخر کرنا حرام ہے، اور ایسا کرنے والا فقرا کا حق غصب کرنے والا ہے۔ اس نے مغنی المحتاج (2/129) سے نقل کیا کہ زکوٰۃ فوراً ادا کرنا واجب ہے، اور جو تاخیر کرے وہ گناہگار ہے اور مال ضائع ہو تو ضامن ہے۔ ڈیپارٹمنٹ نے تاکید کی کہ نفلی صدقات دینے والوں کو جمع کرنے کا مقصد اور خرچ کے مصارف بتانا ضروری ہے۔"
