summary:
  ar: "سؤال عن نقل الجثمان من مكان إلى آخر قبل الدفن. أجاب الدكتور ذو الفقار علي شاه في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2021)⁩ بأن الأصل دفن الناس في أقرب مكان إلى موضع الوفاة ما لم يوجد عذر قوي يقتضي النقل على ما فصّل الجواب."
  en: "A question about transferring a body from one place to another before burial. Dr. Zulfiqar Ali Shah answered on the Fiqh Council of North America site (published November 2021): people should be buried as close to the place of death as possible unless a strong excuse warrants the transfer — as the answer details."
  ur: "دفن سے پہلے میت کو ایک جگہ سے دوسری جگہ لے جانے کا سوال۔ ڈاکٹر ذوالفقار علی شاہ نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ جواب دیا کہ اصل یہ ہے کہ مقام وفات کے قریب دفن کیا جائے مگر مضبوط عذر پر نقل جائز ہے۔"
