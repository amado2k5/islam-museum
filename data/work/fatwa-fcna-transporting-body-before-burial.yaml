label: { ar: "هل يجوز نقل الجثمان قبل الدفن؟", en: "Is it allowed to transfer a dead body before burial?", ur: "کیا دفن سے پہلے میت کو دوسری جگہ لے جانا جائز ہے؟", es: "¿Está permitido trasladar un cadáver antes de su entierro?", fr: "Est-il permis de déplacer un corps avant son enterrement ?" }
summary:
  ar: "سؤال عن نقل الجثمان من مكان إلى آخر قبل الدفن. أجاب الدكتور ذو الفقار علي شاه في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2021)⁩ بأن الأصل دفن الناس في أقرب مكان إلى موضع الوفاة ما لم يوجد عذر قوي يقتضي النقل على ما فصّل الجواب."
  en: "A question about transferring a body from one place to another before burial. Dr. Zulfiqar Ali Shah answered on the Fiqh Council of North America site (published November 2021): people should be buried as close to the place of death as possible unless a strong excuse warrants the transfer — as the answer details."
  ur: "دفن سے پہلے میت کو ایک جگہ سے دوسری جگہ لے جانے کا سوال۔ ڈاکٹر ذوالفقار علی شاہ نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ جواب دیا کہ اصل یہ ہے کہ مقام وفات کے قریب دفن کیا جائے مگر مضبوط عذر پر نقل جائز ہے۔"
  es: "Una pregunta sobre el traslado de un cuerpo de un lugar a otro antes del entierro. El Dr. Zulfiqar Ali Shah respondió en el sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado en noviembre de 2021): las personas deben ser enterradas lo más cerca posible del lugar del fallecimiento, a menos que exista una razón de peso que justifique el traslado, como se detalla en la respuesta."
  fr: "Une question concernant le transfert d'un corps d'un lieu à un autre avant l'inhumation. Le Dr Zulfiqar Ali Shah a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication: novembre 2021): les personnes décédées doivent être enterrées aussi près que possible de leur lieu de décès, sauf motif impérieux justifiant le transfert, comme le précise la réponse."
