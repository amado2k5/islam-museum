id: work/fatwa-dar-alifta-eg-zakat-for-disabled-children
class: work
kind: fatwa
label: { ar: "حكم صرف الزكاة في رعاية ذوي الهمم وتقديم الخدمات لهم", en: "Spending zakat on caring for people of determination", ur: "خصوصی افراد کی دیکھ بھال پر زکات خرچ کرنا", es: "Gastar el zakat en el cuidado de las personas con discapacidad.", fr: "Consacrer la zakat aux soins des personnes en situation de handicap" }
summary:
  ar: "سائل سأل عن صرف أموال الزكاة في رعاية ذوي الهمم وتقديم الخدمات لهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21774)⁩ أنه يجوز الصرف من أموال الزكاة في رعاية الأطفال من ذوي الاحتياجات الخاصة والمعاقين من الفقراء والمساكين على ما فصّل الجواب من ضوابط التمليك."
  en: "A questioner asked about spending zakat funds on caring for people of determination and providing services to them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21774) answered that zakat funds may be spent on caring for children with special needs and on the disabled among the poor and needy — under the ownership controls the answer sets out."
  ur: "ایک سائل نے خصوصی افراد کی دیکھ بھال اور ان کی خدمت پر زکات خرچ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21774)⁩ نے جواب دیا کہ فقیر و مسکین معذور اور خصوصی بچوں کی دیکھ بھال پر زکات خرچ کرنا جائز ہے — جواب کے بیان کردہ تملیک کے ضوابط کے ساتھ۔"
  es: "Una persona preguntó sobre la conveniencia de destinar los fondos del zakat al cuidado de personas con discapacidad y a la prestación de servicios a estas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21774) respondió que los fondos del zakat pueden utilizarse para el cuidado de niños con necesidades especiales y de personas discapacitadas entre los pobres y necesitados, siempre y cuando se respeten los controles de propiedad que se establecen en la respuesta."
  fr: "Une personne a posé une question concernant l'utilisation des fonds de la zakat pour la prise en charge des personnes en situation de handicap et la fourniture de services à leur intention. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21774) a répondu que les fonds de la zakat peuvent être utilisés pour la prise en charge des enfants ayant des besoins spécifiques et des personnes handicapées parmi les plus démunies, sous réserve des conditions de propriété définies dans la fatwa."
