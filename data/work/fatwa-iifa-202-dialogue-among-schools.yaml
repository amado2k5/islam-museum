label: { ar: "قرار مجمع الفقه الإسلامي الدولي 202 (21/8) بشأن الحوار بين أتباع المذاهب الإسلامية", en: "IIFA resolution 202 (21/8) on dialogue among the followers of the Islamic schools", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 202 (21/8): اسلامی مذاہب کے پیروکاروں کے مابین مکالمہ" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. قرر المجمع: تأكيد قراراته السابقة وخصوصًا 98 ⁦(11/1)⁩ بشأن الوحدة الإسلامية و152 ⁦(17/1)⁩ بشأن الإسلام والأمة الواحدة والمذاهب العقدية والفقهية والتربوية. والحوار بين أتباع المذاهب الإسلامية هو تبادل الآراء حول موضوع معين بين أتباع المذاهب المختلفة بعيدًا عن التعصب للوصول إلى مفاهيم مشتركة أو متقاربة أو متعايشة. والحوار ضرورة اجتماعية لاستمرار الحياة واستقامتها وهو بين أتباع الملة الواحدة أكثر ضرورة وإلحاحًا في عالم تكثر فيه التكتلات والأحلاف. وللحوار آداب أهمها الإخلاص واحترام المخالف ونبذ التعصب والبعد عن قصد الظهور والغلبة واختيار أفضل أساليب الإقناع والجدال بالحسنى. وللحوار أصول تضبط مساره أهمها: الاتفاق على مرجعية واضحة وهي أصول الاستدلال المتفق عليها بين علماء الأمة والالتزام بها؛ وتحديد محل الوفاق ومحل الخلاف وجعل المتفق عليه أساسًا لبحث المختلف فيه ضمانًا للتعايش واحترام كل طرف رأي الآخر ما لم يصادم صريح الكتاب والسنة وما أجمع عليه علماء الأمة؛ ومحل الحوار المسائل الاجتهادية الظنية وأما القطعية فليست محلاً للحوار إلا من جهة التواصي عليها وكيفية تطبيقها. واعتمد المجمع الخطة التي أعدتها أمانته تنفيذًا للبرنامج العشري الصادر بقرار مؤتمر القمة الاستثنائي الثالث بمكة المكرمة ⁦(5–6 ذو القعدة 1426هـ، 7–8 ديسمبر 2005م)⁩ والتي اعتمدها كبار علماء المذاهب ⁦(28 يوليو 2008م)⁩. وأوصى: بوجوب احترام أمهات المؤمنين والصحابة وآل البيت من جميع أتباع المذاهب وعدم الإساءة إليهم بطعن أو تجريح؛ وتحريم تكفير أي فئة من المسلمين تؤمن بالله ورسوله وأركان الإسلام والإيمان ولا تنكر معلومًا من الدين بالضرورة؛ وحرمة دماء المسلمين باختلاف طوائفهم وتحريم الاقتتال بينهم مطلقًا؛ ومنع الدعوة المنظمة للمذهب المخالف بين أتباع المذاهب الأخرى لما يفضي إليه من فتنة وتفريق وإثارة ضغائن؛ وتعميم التوصيات على الدول الأعضاء لتضمينها مناهج التعليم ووسائل الإعلام والمواقف السياسية؛ وعقد ندوات وملتقيات لتعميق الحوار وإزالة العوائق والتأكيد على الثوابت المشتركة ونشر ثقافة التسامح والوسطية والاعتدال."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). It ruled: reaffirming its earlier resolutions, especially 98 (11/1) on Islamic unity and 152 (17/1) on Islam and the single umma and the doctrinal, juristic and educational schools. Dialogue among the followers of the Islamic schools is the exchange of views on a given subject between followers of different schools, away from fanaticism, to reach common, close or coexisting conceptions. Dialogue is a social necessity for the continuance and uprightness of life — all the more urgent among followers of one faith in a world of blocs and alliances. Its courtesies, chiefly: sincerity, respect for the one who differs, renouncing fanaticism, avoiding the aim of show and victory, choosing the best persuasive means and arguing in the best manner. Its foundations that govern its course: agreement on a clear reference — the agreed principles of inference among the umma's scholars, with commitment to them; defining the area of accord and of dissent, making what is agreed the basis for discussing what is disputed to guarantee coexistence, each side respecting the other's view so long as it does not collide with the explicit Book and Sunna and the consensus of the umma's scholars; and the field of dialogue is the probabilistic ijtihad questions — the certain questions are not a field for dialogue except by way of counselling on them and how to apply them. It adopted the plan prepared by its secretariat implementing the ten-year programme issued by the third extraordinary summit in Mecca (5–6 Dhu al-Qada 1426, 7–8 December 2005), endorsed by senior scholars of the schools (28 July 2008). It recommended: obligatory respect for the Mothers of the Believers, the Companions and the People of the House by all followers of the schools, without offence by disparagement; forbidding the declaring-unbeliever of any group of Muslims who believe in God and His messenger, the pillars of Islam and faith, and deny nothing known of the religion by necessity; the inviolability of Muslims' blood across their sects and the absolute prohibition of fighting between them; banning organised missionary advocacy of a rival school among followers of other schools for the strife and division it incites; generalising these recommendations to member states for their curricula, media and political positions; and holding seminars deepening dialogue, removing obstacles, affirming shared constants and spreading tolerance, moderation and balance."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ اکیڈمی نے فیصلہ کیا: اپنی سابقہ قراردادوں — بالخصوص 98 ⁦(11/1)⁩ برائے اسلامی وحدت اور 152 ⁦(17/1)⁩ برائے اسلام اور یکتائے امت اور عقیدتی، فقہی و تعلیمی مذاہب — کی تائید۔ اسلامی مذاہب کے پیروکاروں کا مکالمہ کسی موضوع پر مختلف مذاہب کے پیروکاروں کے درمیان تعصب سے دور آراء کا تبادلہ ہے تاکہ مشترک، قریب یا بقائے باہمی تصورات تک پہنچا جائے۔ مکالمہ زندگی کی بقا اور استقامت کے لیے سماجی ضرورت ہے — اور ایک ہی دین کے پیروکاروں میں اس سے بھی زیادہ، ایسے عالم میں جہاں گروہ بندی اور اتحاد عام ہیں۔ اس کے آداب میں اہم: اخلاص، مخالف کی عزت، تعصب کی نفی، ظاہر داری اور غلبے کے ارادے سے اجتناب، بہترین طریقۂ اقناع کا انتخاب اور احسن طریقے سے جدال۔ اس کے وہ اصول جو اس کے رخ کو ضبط کرتے ہیں: واضح مرجعیت پر اتفاق — امت کے علماء میں متفقہ اصولِ استدلال اور ان کی پابندی؛ وفاق اور اختلاف کے محل کا تعین اور متفقہ کو متنازعہ کی بحث کی بنیاد بنانا تاکہ بقائے باہمی برقرار رہے اور ہر فریق دوسری کی رائے کی عزت کرے جب تک کہ وہ صریح کتاب و سنت اور امت کے علماء کے اجماع سے نہ ٹکرائے؛ اور مکالمے کا محل ظنی اجتہادی مسائل ہیں — قطعی مسائل مکالمے کا محل نہیں سوائے ان پر نصیحت اور ان کے اطلاق کے طریقے کی۔ اس نے اپنے سیکرٹریٹ کے تیار کردہ منصوبے کو منظور کیا جو مکہ مکرمہ کی تیسری غیر معمولی سربراہی کانفرنس ⁦(5–6 ذو القعدہ 1426ھ، 7–8 دسمبر 2005ء)⁩ کے دس سالہ پروگرام کے نفاذ میں تھا اور جسے مذاہب کے بڑے علماء نے ⁦28 جولائی 2008ء⁩ منظور کیا۔ سفارشات: تمام مذاہب کے پیروکاروں سے امہات المومنین، صحابہ اور اہلِ بیت کے احترام کی واجبیت اور طعن یا تخریف سے برے کام کی ممانعت؛ کسی بھی مسلمان گروہ کو کافر کہنا حرام جو اللہ اور اس کے رسول اور اسلام و ایمان کے ارکان پر ایمان رکھتا ہو اور دین کے ضروری طور پر معلوم کسی امر کا انکار نہ کرے؛ سب فرقوں کے مسلمانوں کا خون حرام اور ان میں باہمی لڑائی مطلقاً حرام؛ دوسرے مذاہب کے پیروکاروں میں مخالف مذہب کی منظم تبلیغ کی ممانعت کیونکہ وہ فتنہ، تفرقہ اور دشمنی پھیلاتی ہے؛ ان سفارشات کو رکن ممالک کے نصاب، میڈیا اور سیاسی موقفوں میں شامل کرنے کی عمومی ہدایت؛ اور ایسے سیمینار اور میلے جو مکالمے کو مضبوط کریں، رکاوٹیں ہٹائیں، مشترک ثابتوں کی تاکید کریں اور رواداری، وسطیت اور اعتدال کی ثقافت پھیلائیں۔"
