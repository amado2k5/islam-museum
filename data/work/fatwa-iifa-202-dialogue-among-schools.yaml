label: { ar: "قرار مجمع الفقه الإسلامي الدولي 202 (21/8) بشأن الحوار بين أتباع المذاهب الإسلامية", en: "IIFA resolution 202 (21/8) on dialogue among the followers of the Islamic schools", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 202 (21/8): اسلامی مذاہب کے پیروکاروں کے مابین مکالمہ", es: "Resolución 202 (21/8) de la IIFA sobre el diálogo entre los seguidores de las escuelas islámicas.", fr: "Résolution 202 (21/8) de l'IIFA sur le dialogue entre les adeptes des écoles islamiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 202 (21/8) İslami düşünce okullarının takipçileri arasında diyalog hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 202 (21/8) mengenai dialog di antara para penganut aliran pemikiran Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. قرر المجمع: تأكيد قراراته السابقة وخصوصًا 98 ⁦(11/1)⁩ بشأن الوحدة الإسلامية و152 ⁦(17/1)⁩ بشأن الإسلام والأمة الواحدة والمذاهب العقدية والفقهية والتربوية. والحوار بين أتباع المذاهب الإسلامية هو تبادل الآراء حول موضوع معين بين أتباع المذاهب المختلفة بعيدًا عن التعصب للوصول إلى مفاهيم مشتركة أو متقاربة أو متعايشة. والحوار ضرورة اجتماعية لاستمرار الحياة واستقامتها وهو بين أتباع الملة الواحدة أكثر ضرورة وإلحاحًا في عالم تكثر فيه التكتلات والأحلاف. وللحوار آداب أهمها الإخلاص واحترام المخالف ونبذ التعصب والبعد عن قصد الظهور والغلبة واختيار أفضل أساليب الإقناع والجدال بالحسنى. وللحوار أصول تضبط مساره أهمها: الاتفاق على مرجعية واضحة وهي أصول الاستدلال المتفق عليها بين علماء الأمة والالتزام بها؛ وتحديد محل الوفاق ومحل الخلاف وجعل المتفق عليه أساسًا لبحث المختلف فيه ضمانًا للتعايش واحترام كل طرف رأي الآخر ما لم يصادم صريح الكتاب والسنة وما أجمع عليه علماء الأمة؛ ومحل الحوار المسائل الاجتهادية الظنية وأما القطعية فليست محلاً للحوار إلا من جهة التواصي عليها وكيفية تطبيقها. واعتمد المجمع الخطة التي أعدتها أمانته تنفيذًا للبرنامج العشري الصادر بقرار مؤتمر القمة الاستثنائي الثالث بمكة المكرمة ⁦(5–6 ذو القعدة 1426هـ، 7–8 ديسمبر 2005م)⁩ والتي اعتمدها كبار علماء المذاهب ⁦(28 يوليو 2008م)⁩. وأوصى: بوجوب احترام أمهات المؤمنين والصحابة وآل البيت من جميع أتباع المذاهب وعدم الإساءة إليهم بطعن أو تجريح؛ وتحريم تكفير أي فئة من المسلمين تؤمن بالله ورسوله وأركان الإسلام والإيمان ولا تنكر معلومًا من الدين بالضرورة؛ وحرمة دماء المسلمين باختلاف طوائفهم وتحريم الاقتتال بينهم مطلقًا؛ ومنع الدعوة المنظمة للمذهب المخالف بين أتباع المذاهب الأخرى لما يفضي إليه من فتنة وتفريق وإثارة ضغائن؛ وتعميم التوصيات على الدول الأعضاء لتضمينها مناهج التعليم ووسائل الإعلام والمواقف السياسية؛ وعقد ندوات وملتقيات لتعميق الحوار وإزالة العوائق والتأكيد على الثوابت المشتركة ونشر ثقافة التسامح والوسطية والاعتدال."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). It ruled: reaffirming its earlier resolutions, especially 98 (11/1) on Islamic unity and 152 (17/1) on Islam and the single umma and the doctrinal, juristic and educational schools. Dialogue among the followers of the Islamic schools is the exchange of views on a given subject between followers of different schools, away from fanaticism, to reach common, close or coexisting conceptions. Dialogue is a social necessity for the continuance and uprightness of life — all the more urgent among followers of one faith in a world of blocs and alliances. Its courtesies, chiefly: sincerity, respect for the one who differs, renouncing fanaticism, avoiding the aim of show and victory, choosing the best persuasive means and arguing in the best manner. Its foundations that govern its course: agreement on a clear reference — the agreed principles of inference among the umma's scholars, with commitment to them; defining the area of accord and of dissent, making what is agreed the basis for discussing what is disputed to guarantee coexistence, each side respecting the other's view so long as it does not collide with the explicit Book and Sunna and the consensus of the umma's scholars; and the field of dialogue is the probabilistic ijtihad questions — the certain questions are not a field for dialogue except by way of counselling on them and how to apply them. It adopted the plan prepared by its secretariat implementing the ten-year programme issued by the third extraordinary summit in Mecca (5–6 Dhu al-Qada 1426, 7–8 December 2005), endorsed by senior scholars of the schools (28 July 2008). It recommended: obligatory respect for the Mothers of the Believers, the Companions and the People of the House by all followers of the schools, without offence by disparagement; forbidding the declaring-unbeliever of any group of Muslims who believe in God and His messenger, the pillars of Islam and faith, and deny nothing known of the religion by necessity; the inviolability of Muslims' blood across their sects and the absolute prohibition of fighting between them; banning organised missionary advocacy of a rival school among followers of other schools for the strife and division it incites; generalising these recommendations to member states for their curricula, media and political positions; and holding seminars deepening dialogue, removing obstacles, affirming shared constants and spreading tolerance, moderation and balance."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ اکیڈمی نے فیصلہ کیا: اپنی سابقہ قراردادوں — بالخصوص 98 ⁦(11/1)⁩ برائے اسلامی وحدت اور 152 ⁦(17/1)⁩ برائے اسلام اور یکتائے امت اور عقیدتی، فقہی و تعلیمی مذاہب — کی تائید۔ اسلامی مذاہب کے پیروکاروں کا مکالمہ کسی موضوع پر مختلف مذاہب کے پیروکاروں کے درمیان تعصب سے دور آراء کا تبادلہ ہے تاکہ مشترک، قریب یا بقائے باہمی تصورات تک پہنچا جائے۔ مکالمہ زندگی کی بقا اور استقامت کے لیے سماجی ضرورت ہے — اور ایک ہی دین کے پیروکاروں میں اس سے بھی زیادہ، ایسے عالم میں جہاں گروہ بندی اور اتحاد عام ہیں۔ اس کے آداب میں اہم: اخلاص، مخالف کی عزت، تعصب کی نفی، ظاہر داری اور غلبے کے ارادے سے اجتناب، بہترین طریقۂ اقناع کا انتخاب اور احسن طریقے سے جدال۔ اس کے وہ اصول جو اس کے رخ کو ضبط کرتے ہیں: واضح مرجعیت پر اتفاق — امت کے علماء میں متفقہ اصولِ استدلال اور ان کی پابندی؛ وفاق اور اختلاف کے محل کا تعین اور متفقہ کو متنازعہ کی بحث کی بنیاد بنانا تاکہ بقائے باہمی برقرار رہے اور ہر فریق دوسری کی رائے کی عزت کرے جب تک کہ وہ صریح کتاب و سنت اور امت کے علماء کے اجماع سے نہ ٹکرائے؛ اور مکالمے کا محل ظنی اجتہادی مسائل ہیں — قطعی مسائل مکالمے کا محل نہیں سوائے ان پر نصیحت اور ان کے اطلاق کے طریقے کی۔ اس نے اپنے سیکرٹریٹ کے تیار کردہ منصوبے کو منظور کیا جو مکہ مکرمہ کی تیسری غیر معمولی سربراہی کانفرنس ⁦(5–6 ذو القعدہ 1426ھ، 7–8 دسمبر 2005ء)⁩ کے دس سالہ پروگرام کے نفاذ میں تھا اور جسے مذاہب کے بڑے علماء نے ⁦28 جولائی 2008ء⁩ منظور کیا۔ سفارشات: تمام مذاہب کے پیروکاروں سے امہات المومنین، صحابہ اور اہلِ بیت کے احترام کی واجبیت اور طعن یا تخریف سے برے کام کی ممانعت؛ کسی بھی مسلمان گروہ کو کافر کہنا حرام جو اللہ اور اس کے رسول اور اسلام و ایمان کے ارکان پر ایمان رکھتا ہو اور دین کے ضروری طور پر معلوم کسی امر کا انکار نہ کرے؛ سب فرقوں کے مسلمانوں کا خون حرام اور ان میں باہمی لڑائی مطلقاً حرام؛ دوسرے مذاہب کے پیروکاروں میں مخالف مذہب کی منظم تبلیغ کی ممانعت کیونکہ وہ فتنہ، تفرقہ اور دشمنی پھیلاتی ہے؛ ان سفارشات کو رکن ممالک کے نصاب، میڈیا اور سیاسی موقفوں میں شامل کرنے کی عمومی ہدایت؛ اور ایسے سیمینار اور میلے جو مکالمے کو مضبوط کریں، رکاوٹیں ہٹائیں، مشترک ثابتوں کی تاکید کریں اور رواداری، وسطیت اور اعتدال کی ثقافت پھیلائیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013). Reafirmó sus resoluciones anteriores, especialmente la 98 (11/1) sobre la unidad islámica y la 152 (17/1) sobre el Islam y la única umma y las escuelas doctrinales, jurídicas y educativas. El diálogo entre los seguidores de las escuelas islámicas es el intercambio de puntos de vista sobre un tema determinado entre seguidores de diferentes escuelas, lejos del fanatismo, para alcanzar concepciones comunes, cercanas o coexistentes. El diálogo es una necesidad social para la continuidad y la rectitud de la vida, tanto más urgente entre los seguidores de una misma fe en un mundo de bloques y alianzas. Sus principales virtudes son: la sinceridad, el respeto por quien discrepa, la renuncia al fanatismo, evitar el afán de ostentación y victoria, elegir los mejores medios persuasivos y argumentar de la mejor manera. Sus fundamentos que rigen su rumbo: acuerdo sobre una referencia clara: los principios de inferencia acordados entre los eruditos de la umma, con compromiso con ellos; definición del área de acuerdo y de disenso, haciendo de lo acordado la base para discutir lo disputado para garantizar la coexistencia, cada parte respetando la opinión de la otra siempre que no choque con el Libro y la Sunna explícitos y el consenso de los eruditos de la umma; y el campo de diálogo son las cuestiones probabilísticas del ijtihad: las cuestiones ciertas no son un campo para el diálogo excepto a modo de asesoramiento sobre ellas y cómo aplicarlas. Adoptó el plan preparado por su secretaría que implementa el programa decenal emitido por la tercera cumbre extraordinaria en La Meca (5-6 Dhu al-Qada 1426, 7-8 de diciembre de 2005), respaldado por eruditos de alto rango de las escuelas (28 de julio de 2008). Recomendaba: el respeto obligatorio a las Madres de los Creyentes, a los Compañeros y a la Gente de la Casa por parte de todos los seguidores de las escuelas, sin ofender mediante el menosprecio; prohibir que se declare incrédulo a cualquier grupo de musulmanes que crean en Dios y en Su mensajero, pilares del Islam y de la fe, y que no nieguen nada conocido de la religión por necesidad; la inviolabilidad de la sangre de los musulmanes entre sus sectas y la prohibición absoluta de luchar entre ellas; prohibir la promoción misionera organizada de una escuela rival entre los seguidores de otras escuelas por la discordia y la división que incita; generalizar estas recomendaciones a los Estados miembros para sus planes de estudio, medios de comunicación y posiciones políticas; y celebrar seminarios para profundizar el diálogo, eliminar obstáculos, afirmar constantes compartidas y difundir la tolerancia, la moderación y el equilibrio."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013). Elle a réaffirmé ses résolutions antérieures, notamment la résolution 98 (11/1) sur l'unité islamique et la résolution 152 (17/1) sur l'islam, l'oumma unique et les écoles doctrinales, juridiques et pédagogiques. Le dialogue entre les adeptes des écoles islamiques est un échange de vues sur un sujet donné entre les adeptes de différentes écoles, en dehors de tout fanatisme, afin de parvenir à des conceptions communes et compatibles. Le dialogue est une nécessité sociale pour la continuité et la droiture de la vie – d'autant plus urgente entre les adeptes d'une même foi dans un monde de blocs et d'alliances. Ses principales qualités sont la sincérité, le respect de celui qui pense différemment, le renoncement au fanatisme, l'absence de recherche de la gloire et de la victoire, le choix des moyens de persuasion les plus efficaces et une argumentation respectueuse. Ses fondements, qui régissent son fonctionnement, reposent sur un accord sur un référentiel clair – les principes d'inférence convenus parmi les savants de la umma, assortis d'un engagement à les respecter; la définition des domaines d'accord et de désaccord, faisant des points d'accord la base de toute discussion sur les points litigieux afin de garantir la coexistence, chaque partie respectant l'avis de l'autre tant qu'il n'est pas contraire au Coran et à la Sunna explicites, ainsi qu'au consensus des savants de la umma; et le champ du dialogue se limite aux questions d'ijtihad probabilistes – les questions certaines ne font pas l'objet de dialogue, si ce n'est pour fournir des conseils sur leur interprétation et leur application. Elle a adopté le plan élaboré par son secrétariat, mettant en œuvre le programme décennal issu du troisième sommet extraordinaire de La Mecque (5-6 Dhu al-Qada 1426, 7-8 décembre 2005), et approuvé par les plus éminents savants des écoles (28 juillet 2008). Elle a recommandé: le respect obligatoire des Mères des Croyants, des Compagnons et des Gens de la Maison par tous les adeptes des écoles, sans offense ni dénigrement; l'interdiction de déclarer incroyant tout groupe de musulmans qui croient en Dieu et en Son messager, aux piliers de l'islam et à la foi, et qui ne renient rien de connu de la religion par nécessité; l'inviolabilité du sang des musulmans au-delà de leurs sectes et l'interdiction absolue des combats entre eux; l'interdiction du prosélytisme organisé d'une école rivale auprès des adeptes d'autres écoles en raison des conflits et des divisions qu'il incite; la généralisation de ces recommandations aux États membres pour leurs programmes scolaires, leurs médias et leurs positions politiques; et la tenue de séminaires pour approfondir le dialogue, lever les obstacles, affirmer les constantes partagées et diffuser la tolérance, la modération et l'équilibre."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin Riyad'daki yirmi birinci oturumunda (15–19 Muharrem 1435H, 18–22 Kasım 2013) ortak kararı alınmıştır. Akademi karar vermiştir: Önceki kararlarını, özellikle İslami birliği ile ilgili 98 (11/1) ve İslam, tek millet ile doktrinsel, fıkıh ve eğitim okullarıyla ilgili 152 (17/1) sayılı kararlarını yeniden teyit etmek. İslami mezheplerin takipçileri arasında diyalog, farklı mezheplerin takipçileri arasında fanatizmden uzak, ortak ve benzer veya bir arada var olan kavramlara ulaşmak için belirli bir konuda görüş alışverişidir. Diyalog, yaşamın devamı ve doğruluğu için sosyal bir gerekliliktir ve aynı mezhebin takipçileri arasında fraksiyonların ve ittifakların bol olduğu bir dünyada daha da gerekli ve acildir. Diyalogun görgü kuralları vardır; bunların en önemlileri samimiyet, muhaliflere saygı, fanatizmin reddi, görünüş ve baskınlıktan kaçınma ile en iyi ikna ve argüman yöntemlerini en iyi şekilde seçmektir. Diyalogun akışını düzenleyen ilkeleri vardır; en önemlileri şunlardır: Ümmet âlimleri arasında üzerinde uzlaşılan ve onlara bağlı kalan akıl yürütme ilkeleri olan açık bir atıf üzerinde anlaşmak; anlaşma ve anlaşmazlık yerinin belirlenmesi ve farklılıkların tartışılması için temel alınanı oluşturmak ve her tarafın görüşüne saygı ve birlikte yaşamı sağlamak, ancak bu görüş açık Kur'an ve Sünnet ile Ümmet alimlerinin üzerinde anlaştıklarıyla çelişmediği sürece; diyalogun konusu spekülatif ictihadi meseleleridir, kesin konular ise yalnızca karşılıklı tavsiye ve uygulama açısından diyaloğa açıktır. Akademi, Mekke'deki Üçüncü Olağanüstü Zirve Konferansı'nın kararıyla (5–6 Dhu al-Qi'dah 1426 H, 7–8 Aralık 2005) yayımlanan on yıllık programın uygulanması için Sekretaryası tarafından hazırlanan planı onayladı; bu karar düşünce okullarının kıdemli akademisyenleri tarafından da onaylandı (28 Temmuz 2008). Şunları önerdi: Farklı mezheplerin tüm takipçilerinden İnananların Annelerine, Sahabelere ve Ehl-Beyt'e saygı gösterilmesi ve onları aşağılamamak veya karalamamak; Allah'a, Elçisi'ne, İslam'ın temel taşlarına ve inanca inanan ve dinin hiçbir bölümünü inkâr etmeyen herhangi bir Müslüman grubunun ilan edilmesinin yasaklanması; mezhepleri ne olursa olsun Müslümanların kanının kutsanması ve aralarındaki çatışmaların kesinlikle yasaklanması; anlaşmazlık, bölünme ve nefret çıkarma nedenleriyle diğer mezheplerin takipçileri arasında organize muhalif mezheplere çağrıların yasaklanması; üye devletlere bunların eğitim müfredatlarına, medyaya ve siyasi pozisyonlara dahil edilmesi için önerilerde bulunması; diyaloğu derinleştirmek, engelleri kaldırmak, ortak sabitleri vurgulamak ve hoşgörü, ılımlılık ve denge kültürünü yaymak için seminer ve forumlar düzenlemek."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh satu di Riyadh (15–19 Muharram 1435H, 18–22 November 2013). Akademi memutuskan: Menegaskan kembali resolusi-resolusi sebelumnya, terutama 98 (11/1) mengenai persatuan Islam dan 152 (17/1) mengenai Islam, satu bangsa, serta sekolah doktrinal, firih, dan pendidikan. Dialog antar penganut mazhab Islam adalah pertukaran pandangan mengenai topik tertentu di antara pengikut dari berbagai sekte, jauh dari fanatisme, guna mencapai konsep yang sama, serupa, atau hidup berdampingan. Dialog adalah kebutuhan sosial untuk kelanjutan dan keadilan kehidupan, dan bahkan lebih diperlukan dan mendesak di antara penganut sekte yang sama di dunia di mana faksi dan aliansi melimpah. Dialog memiliki etiket, yang paling penting adalah ketulusan, penghormatan terhadap lawan, penolakan terhadap fanatisme, menghindari penampilan dan dominasi, serta memilih metode terbaik dalam membujuk dan berargumen dengan cara terbaik. Dialog memiliki prinsip yang mengatur jalannya, yang paling penting adalah: menyepakati referensi yang jelas, yaitu prinsip penalaran yang disepakati di antara para ulama Ummah dan mematuhinya; menentukan tempat kesepakatan dan tempat perselisihan, serta menjadikan apa yang disepakati sebagai dasar untuk membahas perbedaan guna memastikan hidup berdampingan dan menghormati pendapat masing-masing pihak selama tidak bertentangan dengan Al-Quran dan Sunnah yang eksplisit serta apa yang telah disepakati para ulama Ummah; topik dialog adalah isu ijtihadi spekulatif, sedangkan hal-hal definitif hanya terbuka untuk dialog dalam bentuk rekomendasi bersama dan bagaimana menerapkannya. Akademi menyetujui rencana yang disusun oleh Sekretariatnya dalam pelaksanaan program sepuluh tahun yang dikeluarkan berdasarkan keputusan Konferensi Puncak Luar Biasa Ketiga di Mekah (5–6 Dhu al-Qi'dah 1426 H, 7–8 Desember 2005), yang disetujui oleh para sarjana senior dari aliran pemikiran (28 Juli 2008). Ia merekomendasikan: pentingnya menghormati Ibu Mukmin, Para Sahabat, dan Ahl al-Bayt dari semua pengikut berbagai sekte, dan tidak menghina atau mencemarkan nama baik mereka; melarang deklarasi dari setiap kelompok Muslim yang percaya kepada Allah, Rasul-Nya, pilar Islam, dan iman serta tidak selalu menyangkal bagian mana pun dari agama tersebut; menguduskan darah Muslim tanpa memandang sekte mereka dan melarang sepenuhnya pertikaian di antara mereka; melarang seruan terorganisir untuk sekte yang berlawanan di antara pengikut sekte lain karena penyebab perselisihan, perpecahan, dan kebencian; menggeneralisasi rekomendasi kepada negara anggota untuk memasukkan mereka dalam kurikulum pendidikan, media, dan posisi politik; mengadakan seminar dan forum untuk memperdalam dialog, menghilangkan hambatan, menekankan konstan bersama, dan menyebarkan budaya toleransi, moderasi, dan keseimbangan."
