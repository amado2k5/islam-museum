label: { ar: "قصص الأنبياء لابن كثير", en: "Qisas al-Anbiya' (Ibn Kathir)", ur: "قصص الانبیاء ⁦(ابن کثیر)⁩" }
summary:
  ar: "قصص الأنبياء للحافظ عماد الدين ابن كثير الدمشقي ⁦(ت 774هـ)⁩، يبدأ بآدم وينتهي بعيسى، ولا يتناول سيرة النبي محمد؛ يسوق لكل نبي الآيات ثم الأحاديث والآثار، وينبّه على ما يراه من الإسرائيليات وعلى علل الأسانيد؛ ويقع في نشرة الفرماوي في عشرين باباً من آدم وإدريس ونوح وهود وصالح وإبراهيم ولوط وشعيب إلى موسى والخضر وداود وسليمان وزكريا ويحيى وعيسى {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997 p. 6-7} {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997 p. 769-773}."
  en: "The stories of the prophets by the hadith master 'Imad al-Din Ibn Kathir of Damascus (d. 774 AH), from Adam to Jesus; it does not cover the life of the Prophet Muhammad. For each prophet it gives the verses, then the reports and sayings, pointing out what he judges to be Isra'iliyyat and defects in chains. In al-Farmawi's edition it runs to twenty chapters, from Adam, Idris, Noah, Hud, Salih, Abraham, Lot and Shu'ayb to Moses and al-Khidr, David, Solomon, Zechariah and John, and Jesus {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997 p. 6-7} {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997 p. 769-773}."
  ur: "دمشق کے حافظ عماد الدین ابن کثیر ⁦(وفات 774ھ)⁩ کی انبیاء کے قصص پر کتاب، جو آدم سے شروع ہو کر عیسیٰ پر ختم ہوتی ہے؛ اس میں نبی محمد کی سیرت شامل نہیں۔ ہر نبی کے لیے پہلے آیات، پھر احادیث اور آثار لاتی ہے، اور جنہیں مصنف اسرائیلیات سمجھتے ہیں ان پر اور سندوں کی علتوں پر تنبیہ کرتی ہے۔ فرماوی کے ایڈیشن میں یہ بیس ابواب میں ہے: آدم، ادریس، نوح، ہود، صالح، ابراہیم، لوط اور شعیب سے موسیٰ اور خضر، داؤد، سلیمان، زکریا و یحییٰ اور عیسیٰ تک {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997 p. 6-7} {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997 p. 769-773}۔"
