structure: "في نشرة الفرماوي (1997) عشرون باباً: 1 آدم (ص 11)، 2 إدريس (ص 75)، 3 نوح (ص 81)، 4 هود (ص 123)، 5 صالح (ص 145)، 6 إبراهيم (ص 165)، 7 لوط (ص 241)، 8 شعيب (ص 259)، 9 ذرية إبراهيم (ص 277)، 10 ما وقع من الأمور العجيبة (ص 291)، 11 أمم أهلكوا بعامة (ص 349)، 12 يونس (ص 361)، 13 موسى، 14 الخضر وإلياس، 15 جماعة من أنبياء بني إسرائيل، 16 داود، 17 سليمان، 18 جماعة من الأنبياء، 19 زكريا ويحيى، 20 عيسى (ص 679)؛ الفهرس ص 769–773. والأبواب والفصول من ترقيم المحقق على تقسيم المؤلف."
