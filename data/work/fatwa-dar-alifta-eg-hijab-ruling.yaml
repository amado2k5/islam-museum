label: { ar: "حكم الحجاب في الإسلام", en: "The ruling on hijab in Islam", ur: "اسلام میں حجاب کا حکم" }
summary:
  ar: "سائل سأل عن حكم الحجاب في الإسلام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22525)⁩ أن حجاب المرأة المسلمة البالغة — بما في ذلك سترها شعر رأسها — واجب شرعًا على كل من بلغت سن التكليف بنصوص الوحي، وبيّن الجواب حدوده وأدلته."
  en: "A questioner asked about the ruling on hijab in Islam. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22525) answered that the hijab of the adult Muslim woman — including covering the hair of her head — is obligatory in the sharia on every woman who reaches the age of responsibility, by the texts of revelation; the answer sets out its bounds and evidence."
  ur: "ایک سائل نے اسلام میں حجاب کے حکم کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22525)⁩ نے جواب دیا کہ بالغ مسلمان عورت کا حجاب — بشمول سر کے بالوں کا ڈھانکنا — وحی کے نصوص کے ذریعے ہر تکلیف کی عمر پہنچنے والی عورت پر شرعاً واجب ہے؛ جواب میں اس کی حدود اور ادلہ بیان ہوئے۔"
