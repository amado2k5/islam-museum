summary:
  ar: "سائل سأل عن أقل ما تنعقد به صلاة الجماعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22186)⁩ أن أقل ما تنعقد به الجماعة اثنان: واحد سوى الإمام، وبيّن الجواب ما ورد في ذلك من النصوص وأحوال القيام عن يمين الإمام."
  en: "A questioner asked about the smallest number constituting congregational prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22186) answered that the least is two — one besides the imam — and the answer sets out the texts on it and the rule of standing to the imam's right."
  ur: "ایک سائل نے نمازِ جماعت کے لیے کم از کم تعداد پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22186)⁩ نے جواب دیا کہ کم سے کم دو ہیں — امام کے علاوہ ایک — اور جواب میں متعلقہ نصوص اور امام کے دائیں کھڑے ہونے کے احوال بیان ہوئے۔"
