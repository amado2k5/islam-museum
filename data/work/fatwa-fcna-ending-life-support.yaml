label: { ar: "ما الموقف الإسلامي من إنهاء الإعاشة الطبية؟", en: "What is the Islamic view on ending life support?", ur: "لائف سپورٹ بند کرنے کا اسلامی موقف کیا ہے؟", es: "¿Cuál es la postura islámica sobre la interrupción del soporte vital?", fr: "Quel est le point de vue islamique sur l'arrêt des traitements de maintien en vie ?", tr: "Tıbbi geçimin sona erdirilmesi konusunda İslami tutum nedir?", id: "Apa sikap Islam tentang mengakhiri subsistensi medis?" }
summary:
  ar: "سؤال عن الموقف الإسلامي من سحب أو إيقاف الرعاية المُعِينة على الحياة. أجاب الشيخ مصطفى عمر في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2022)⁩ بأن المجلس يرى الطب نعمة وأن استخدام الوسائل النافعة مرغوب وبيّن الجواب أحكام السحب والإيقاف على وجهها."
  en: "A question about the Islamic stance on withdrawing or withholding life-sustaining care. Shaykh Mustafa Umar answered on the Fiqh Council of North America site (published November 2022): the council regards medicine as a blessing and beneficial treatment recommended, and the answer sets out the rulings on withdrawal and withholding."
  ur: "زندگی بچانے والی سہولت ہٹانے یا روکنے کے اسلامی حکم کا سوال۔ شیخ مصطفیٰ عمر نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2022)⁩ جواب دیا کہ طب نعمت ہے اور مفید علاج مستحب؛ ہٹانے اور روکنے کے احکام جواب میں ہیں۔"
  es: "Una pregunta sobre la postura islámica respecto a la retirada o la suspensión de la atención médica de soporte vital. El jeque Mustafa Umar respondió en el sitio web del Consejo de Fiqh de Norteamérica (publicado en noviembre de 2022): el consejo considera la medicina una bendición y un tratamiento beneficioso y recomendable, y la respuesta expone las normas sobre la retirada y la suspensión."
  fr: "Une question portait sur la position islamique concernant l'arrêt ou le refus des soins de maintien en vie. Cheikh Mustafa Umar a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication: novembre 2022): le Conseil considère la médecine comme une bénédiction et un traitement bénéfique recommandé, et sa réponse expose les règles relatives à l'arrêt et au refus des soins."
  tr: "Yaşam destekli bakımın kaldırılması veya askıya alınması konusundaki İslami tutum hakkında bir soru. Şeyh Mustafa Omar, Kuzey Amerika Fıkıh Konseyi web sitesinde (Kasım 2022'de yayımlandı) Konseyin tıbbı bir nimet olarak gördüğünü ve faydalı araçların kullanımının arzu edilir olduğunu belirtti ve çekilme ile askıya alma kararlarını buna göre açıkladı."
  id: "Sebuah pertanyaan tentang sikap Islam dalam menarik atau menangguhkan perawatan berbantuan jiwa. Sheikh Mustafa Omar menjawab di situs web Dewan Yurisprudensi Amerika Utara (diterbitkan November 2022) bahwa Dewan memandang pengobatan sebagai berkah dan penggunaan sarana yang bermanfaat adalah hal yang diinginkan, serta menjelaskan putusan tentang penarikan dan penangguhan sesuai dengan itu."
