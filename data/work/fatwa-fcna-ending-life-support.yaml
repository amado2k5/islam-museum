label: { ar: "ما الموقف الإسلامي من إنهاء الإعاشة الطبية؟", en: "What is the Islamic view on ending life support?", ur: "لائف سپورٹ بند کرنے کا اسلامی موقف کیا ہے؟", es: "¿Cuál es la postura islámica sobre la interrupción del soporte vital?" }
summary:
  ar: "سؤال عن الموقف الإسلامي من سحب أو إيقاف الرعاية المُعِينة على الحياة. أجاب الشيخ مصطفى عمر في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2022)⁩ بأن المجلس يرى الطب نعمة وأن استخدام الوسائل النافعة مرغوب وبيّن الجواب أحكام السحب والإيقاف على وجهها."
  en: "A question about the Islamic stance on withdrawing or withholding life-sustaining care. Shaykh Mustafa Umar answered on the Fiqh Council of North America site (published November 2022): the council regards medicine as a blessing and beneficial treatment recommended, and the answer sets out the rulings on withdrawal and withholding."
  ur: "زندگی بچانے والی سہولت ہٹانے یا روکنے کے اسلامی حکم کا سوال۔ شیخ مصطفیٰ عمر نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2022)⁩ جواب دیا کہ طب نعمت ہے اور مفید علاج مستحب؛ ہٹانے اور روکنے کے احکام جواب میں ہیں۔"
  es: "Una pregunta sobre la postura islámica respecto a la retirada o la suspensión de la atención médica de soporte vital. El jeque Mustafa Umar respondió en el sitio web del Consejo de Fiqh de Norteamérica (publicado en noviembre de 2022): el consejo considera la medicina una bendición y un tratamiento beneficioso y recomendable, y la respuesta expone las normas sobre la retirada y la suspensión."
