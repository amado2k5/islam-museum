id: work/fatwa-amja-quran-unchallenged-definition
class: work
kind: fatwa
label: { ar: "التحدي بالقرآن وحدوده", en: "The Qur'an's inimitability and the book's bounds", ur: "قرآن کی معجزانہ تعلیم اور کتاب کی حدود" }
summary:
  ar: "سأل سائل عن آيات التحدي بأن لا يأتي أحد من الجن والإنس بمثل القرآن ولو بسور من مثله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77583 بتاريخ 26 يناير 2009)⁩ أن الأمة أجمعت سلفًا وخلفًا على أن القرآن الكريم هو الموجود بين دفتي المصحف المفتتح بالفاتحة والمختتم بالناس، وأن البشر لا يأتون بمثله ولا بسورة منه ولو كان بعضهم لبعض ظهيرًا، ومن زعم من الغلاة وجود سور زائدة لم يقل إنهم جاءوا بها من عند أنفسهم بل زعموا أنها من عند الله وتلك قضية أخرى وهم فيها كاذبون وبطلانها ظاهر بإجماع الأمة."
  en: "A questioner cited the challenge-verses — no jinn or man can produce the like of the Qur'an or even a surah of it. Dr. Salah al-Sawi (fatwa no. 77583, 26 January 2009) answered that the ummah agreed early and late that the Qur'an is what lies between the mushaf's two covers, opening with al-Fatiha and closing with al-Nas, and that mankind cannot produce its like nor a surah of it, though they backed each other; the extremists alleging extra surahs never claimed to have made them themselves but alleged they were from God — a separate matter in which they lie, its falsity plain by the ummah's consensus. Recorded as AMJA's answer."
  ur: "ایک سائل نے قرآن کے عجز آور ہونے کی آیات پوچھیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77583، 26 جنوری 2009)⁩ کے مطابق امت متفق ہے کہ قرآن وہی ہے جو مصحف کی دونوں جلدوں کے درمیان ہے — فاتحہ سے الناس تک — اور اس جیسی ایک سورت بھی بنائی نہیں جا سکتی۔"
