id: work/fatwa-dar-alifta-eg-separating-conjoined-twins
class: work
kind: fatwa
label: { ar: "حكم فصل التوأمين الملتصقين إذا ترتب عليه موت أحدهما", en: "Separating conjoined twins when it would cause one twin's death", ur: "چپکے جڑواں بچوں کی علیحدگی جب اس سے ایک کی موت ہو", es: "Separar a gemelos siameses cuando ello pudiera causar la muerte de uno de ellos.", fr: "Séparer des jumeaux siamois lorsque cela entraînerait la mort de l'un d'eux", tr: "Birleşik ikizlerin ayrılmasına ilişkin karar, birinin ölümüne yol açarsa", id: "Putusan tentang pemisahan kembar siam jika berujung pada kematian salah satu dari mereka" }
summary:
  ar: "سائل سأل عن فصل التوأمين الملتصقين إذا ترتب عليه موت أحدهما. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22596)⁩ أنه إذا قرر الأطباء المختصون بعد الفحص الدقيق أن عملية الفصل ممكنة من الناحية الطبية والعلمية فحكمها على ما فصّل الجواب من موازنة بين حياة التوأمين وضوابط الجراحة."
  en: "A questioner asked about separating conjoined twins where the operation would entail one twin's death. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22596) answered that where specialist physicians determine after careful examination that separation is medically and scientifically feasible, its ruling follows the answer's weighing of the two lives and the conditions governing such surgery."
  ur: "ایک سائل نے چپکے جڑواں بچوں کی علیحدگی کا حکم پوچھا جب عمل سے ایک کی موت ہو۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22596)⁩ نے جواب دیا کہ جب ماہر ڈاکٹر اطمینان بخش معائنے کے بعد قرار دیں کہ علیحدگی کا عمل طبی اور سائنسی اعتبار سے ممکن ہے تو اس کا حکم جواب کے بیان کردہ دونوں زندگیوں کے توازن اور اس طرح کی سرجری کے ضوابط کے مطابق ہے۔"
  es: "Una persona preguntó sobre la separación de gemelos siameses, en casos donde la operación implicaría la muerte de uno de ellos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22596) respondió que, cuando los médicos especialistas determinan, tras un examen minucioso, que la separación es médica y científicamente factible, su dictamen se basa en la ponderación de las dos vidas y las condiciones que rigen dicha cirugía."
  fr: "Une personne a posé une question concernant la séparation de jumeaux siamois lorsque l'opération entraînerait la mort de l'un d'eux. La Dar al-Ifta égyptienne (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 22596) a répondu que lorsque des médecins spécialistes déterminent, après un examen approfondi, que la séparation est médicalement et scientifiquement possible, leur décision prend en compte la valeur des deux vies et les conditions régissant une telle intervention chirurgicale."
  tr: "Bir kişi, birleşik ikizlerin ayrılmasının birinin ölümüne yol açması durumunda olup olmadığını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22596), uzman doktorların kapsamlı bir incelemeden sonra ayrılığın tıbbi ve bilimsel olarak mümkün olduğuna karar verirse, ikizlerin yaşamı ile cerrahi işlemlerin dengelenmesinin ayrıntılı açıklamasına dayanarak değerlendirmeleri gerektiğini yanıtladı."
  id: "Seseorang menanyakan tentang pemisahan si kembar siam jika itu menyebabkan kematian salah satu dari mereka. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22596) menjawab bahwa jika dokter spesialis, setelah pemeriksaan menyeluruh, menentukan bahwa pemisahan secara medis dan ilmiah memungkinkan, mereka harus menilainya berdasarkan penjelasan rinci tentang keseimbangan hidup kembar dan prosedur bedah."
