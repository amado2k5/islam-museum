summary:
  ar: "قطر الندى وبل الصدى في النحو لعبد الله بن يوسف بن هشام الأنصاري ⁦(ت. 761هـ)⁩ نثرية جمعت أقسام الكلام والمبتدأ والخبر والنواسخ والأفعال والمفعولات والحال والتمييز والاستثناء وأسلوب الحال والمنادى والحروف والأسماء المبهمة والمرفوعات والمنصوبات والمجرورات والعطف؛ متن النحو بعد الآجرومية في الدروس {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Qatr al-Nada wa-Ball al-Sada in grammar by Ibn Hisham al-Ansari (d. 761 AH) — a prose matn gathering the parts of speech, mubtada and khabar, the abrogating verbs, objects, hal, tamyiz, exception, the vocative, the particles, the declensions and the coordination; the grammar text that follows the Ajurrumiyya in the lessons {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Qatr al-Nada wa-Ball al-Sada en gramática de Ibn Hisham al-Ansari (m. 761 d. H.): un matn en prosa que reúne las partes del discurso, mubtada y khabar; el texto de gramática que sigue al Ajurrumiyya en las lecciones {citar:al-mutun-al-ilmiyya-azhar} {citar:al-aalam}."
  fr: "Qatr al-Nada wa-Ball al-Sada en grammaire par Ibn Hisham al-Ansari (mort en 761 AH) — un matn en prose rassemblant les parties du discours, mubtada et khabar; le texte de grammaire qui suit l'Ajurrumiyya dans les leçons {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "ابن ہشام الانصاری ⁦(متوفی 761ھ)⁩ کی گرامر میں قطر الندا و بال السادۃ - ایک نثری مواد جس میں تقریر، مطبع اور خبر کے حصوں کو جمع کیا جاتا ہے۔ گرائمر کا متن جو اسباق میں اجرومیہ کی پیروی کرتا ہے {حوالہ: الموتن العلمیہ ازہر}"
