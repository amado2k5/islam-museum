id: work/fatwa-dar-alifta-eg-urfi-marriage-without-witnesses
class: work
kind: fatwa
label: { ar: "حكم الزواج العرفي بدون شهود", en: "Urfi marriage without witnesses", ur: "بغیر گواہوں کے عرفی نکاح", es: "Matrimonio en Urfi sin testigos", fr: "Mariage Urfi sans témoins", tr: "Tanıksız geleneksel evlilikle ilgili karar", id: "Putusan tentang pernikahan adat tanpa saksi" }
summary:
  ar: "سائل سأل عن زواج عرفي اكتفى فيه الرجل والمرأة بصيغتي الإيجاب والقبول دون إخبار أحد ودون إشهاد عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21594)⁩ ببيان حكم هذا العقد وما يترتب عليه على وجهه."
  en: "A questioner asked about an urfi marriage in which the man and woman sufficed with offer and acceptance, telling no one and having it witnessed by no one. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21594) answered by setting out the ruling on such a contract and what follows from it."
  ur: "ایک سائل نے ایسے عرفی نکاح کا حکم پوچھا جس میں مرد اور عورت صرف ایجاب و قبول پر اکتفا کرتے ہیں، کسی کو خبر نہ دیں اور گواہ نہ رکھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21594)⁩ نے جواب میں ایسے عقد کا حکم اور اس کے نتائج بیان کیے۔"
  es: "Un consultante preguntó sobre un matrimonio urfi en el que el hombre y la mujer se limitaban a la oferta y la aceptación, sin que nadie se lo comunicara ni hubiera testigos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21594) respondió exponiendo la normativa sobre este tipo de contrato y sus consecuencias."
  fr: "Un internaute a posé une question concernant un mariage informel (urfi) où l'homme et la femme se sont contentés d'une offre et d'une acceptation, sans en informer personne ni faire appel à aucun témoin. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21594) a répondu en exposant la règle relative à un tel contrat et ses conséquences."
  tr: "Bir soru soran kişi, erkek ve kadının hem teklif hem de kabul formlarıyla yetindiği, kimseye bilgi vermeden veya tanıklık etmediği geleneksel evlilikler hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21594), bu sözleşme hakkındaki kararı ve sonuçlarını netleştirerek yanıt verdi."
  id: "Seorang penanya menanyakan tentang pernikahan adat di mana pria dan wanita puas dengan baik formulir tawaran maupun penerimaan tanpa memberi tahu siapa pun atau menjadi saksi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21594) menanggapi dengan memperjelas keputusan kontrak ini dan implikasinya."
