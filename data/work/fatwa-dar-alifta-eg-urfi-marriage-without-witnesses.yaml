id: work/fatwa-dar-alifta-eg-urfi-marriage-without-witnesses
class: work
kind: fatwa
label: { ar: "حكم الزواج العرفي بدون شهود", en: "Urfi marriage without witnesses", ur: "بغیر گواہوں کے عرفی نکاح" }
summary:
  ar: "سائل سأل عن زواج عرفي اكتفى فيه الرجل والمرأة بصيغتي الإيجاب والقبول دون إخبار أحد ودون إشهاد عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21594)⁩ ببيان حكم هذا العقد وما يترتب عليه على وجهه."
  en: "A questioner asked about an urfi marriage in which the man and woman sufficed with offer and acceptance, telling no one and having it witnessed by no one. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21594) answered by setting out the ruling on such a contract and what follows from it."
  ur: "ایک سائل نے ایسے عرفی نکاح کا حکم پوچھا جس میں مرد اور عورت صرف ایجاب و قبول پر اکتفا کرتے ہیں، کسی کو خبر نہ دیں اور گواہ نہ رکھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21594)⁩ نے جواب میں ایسے عقد کا حکم اور اس کے نتائج بیان کیے۔"
