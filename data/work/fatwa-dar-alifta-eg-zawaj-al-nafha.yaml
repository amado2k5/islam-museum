id: work/fatwa-dar-alifta-eg-zawaj-al-nafha
class: work
kind: fatwa
label: { ar: "حكم ما يسمى بزواج النفحة", en: "The so-called 'nafha marriage'", ur: "نام نہاد 'نفحہ شادی' کا حکم", es: "El llamado 'matrimonio nafha'", fr: "Le soi-disant « mariage nafha »", tr: "Nefesin evliliği denilen karar", id: "Putusan tentang apa yang disebut pernikahan napas" }
summary:
  ar: "سائل سأل عن عقد النكاح المسمى زواج النفحة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22070)⁩ أنه يحرم إبرامه ابتداء لما ينطوي عليه من مفاسد كبرى أهمها غياب الولي وغيرها على ما فصّل الجواب."
  en: "A questioner asked about the marriage contract called 'nafha marriage'. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22070) answered that concluding it is forbidden from the outset for the grave harms it involves — chiefly the absence of the guardian, among others the answer details."
  ur: "ایک سائل نے 'نفحہ شادی' نامی عقدِ نکاح کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22070)⁩ نے جواب دیا کہ اس کا انعقاد ابتدا ہی سے حرام ہے کیونکہ اس میں بڑی مفاسد ہیں جن میں سب سے اہم ولی کی عدم موجودگی ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el contrato matrimonial denominado \"matrimonio nafha\". El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22070) respondió que está prohibido desde el principio debido a los graves perjuicios que conlleva, principalmente la ausencia del tutor, entre otros, según detalla la respuesta."
  fr: "Un internaute a posé une question concernant le contrat de mariage appelé « mariage nafha ». La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22070) a répondu que sa conclusion est interdite d'emblée en raison des graves préjudices qu'elle entraîne, notamment l'absence de tuteur, comme le précise la réponse."
  tr: "Bir soru soran biri, Nafha evliliği adı verilen evlilik sözleşmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22070), başta sonuçlandırmanın büyük zararlar nedeniyle yasak olduğunu, en önemlisinin ise vasi ve diğerlerinin yokluğu olduğunu yanıtladı; bu durum cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang kontrak pernikahan tersebut disebut kontrak pernikahan Nafha. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22070) menjawab bahwa awalnya dilarang untuk menandatangani kontrak tersebut karena kerugian besar yang ditimbulkannya, yang paling penting adalah ketidakhadiran wali dan lainnya, seperti yang dijelaskan dalam jawaban."
