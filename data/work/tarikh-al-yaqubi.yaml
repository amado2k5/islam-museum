  en: Tarikh al-Ya'qubi (The History of al-Ya'qubi)
  ur: تاریخ الیعقوبی
summary:
  ar: 'تاريخ عام لأحمد بن أبي يعقوب بن واضح الكاتب المعروف باليعقوبي، في جزأين: الأول في بدء الخليقة وأخبار الأمم الأولى، والثاني في التاريخ الإسلامي على أيام الخلفاء إلى حوادث سنة 258هـ. ويذكر المؤلف في مقدمة الجزء الثاني أنه جمع روايات الشيوخ من العلماء والرواة وأصحاب السير لاختلافهم في الأخبار والسنين. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}'
  en: 'A universal history by Ahmad ibn Abi Ya''qub ibn Wadih al-Katib, known as al-Ya''qubi, in two parts: the first on the beginning of creation and the early nations, the second on Islamic history reign by reign to the events of 258 AH. In the preface to the second part the author says he gathered the reports of earlier scholars, transmitters and biographers because they differed over events and dates. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}'
  ur: 'احمد بن ابی یعقوب بن واضح الکاتب، جو الیعقوبی کے نام سے معروف ہیں، کی ایک عمومی تاریخ دو حصوں میں: پہلا آغازِ آفرینش اور قدیم قوموں کے حالات پر، دوسرا خلفاء کے ادوار کے حساب سے 258ھ کے واقعات تک اسلامی تاریخ پر۔ دوسرے حصے کے مقدمے میں مصنف بتاتے ہیں کہ انہوں نے متقدم علماء، راویوں اور اہلِ سیر کی روایات جمع کیں کیونکہ واقعات اور سنین میں ان کا اختلاف تھا۔ {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}'
