summary:
  ar: 'تاريخ عام لأحمد بن أبي يعقوب بن واضح الكاتب المعروف باليعقوبي، في جزأين: الأول في بدء الخليقة وأخبار الأمم الأولى، والثاني في التاريخ الإسلامي على أيام الخلفاء إلى حوادث سنة 258هـ. ويذكر المؤلف في مقدمة الجزء الثاني أنه جمع روايات الشيوخ من العلماء والرواة وأصحاب السير لاختلافهم في الأخبار والسنين. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}'
  en: 'A universal history by Ahmad ibn Abi Ya''qub ibn Wadih al-Katib, known as al-Ya''qubi, in two parts: the first on the beginning of creation and the early nations, the second on Islamic history reign by reign to the events of 258 AH. In the preface to the second part the author says he gathered the reports of earlier scholars, transmitters and biographers because they differed over events and dates. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}'
  ur: 'احمد بن ابی یعقوب بن واضح الکاتب، جو الیعقوبی کے نام سے معروف ہیں، کی ایک عمومی تاریخ دو حصوں میں: پہلا آغازِ آفرینش اور قدیم قوموں کے حالات پر، دوسرا خلفاء کے ادوار کے حساب سے 258ھ کے واقعات تک اسلامی تاریخ پر۔ دوسرے حصے کے مقدمے میں مصنف بتاتے ہیں کہ انہوں نے متقدم علماء، راویوں اور اہلِ سیر کی روایات جمع کیں کیونکہ واقعات اور سنین میں ان کا اختلاف تھا۔ {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}'
  es: "Una historia universal de Ahmad ibn Abi Ya'qub ibn Wadih al-Katib, conocido como al-Ya'qubi, en dos partes: la primera sobre el comienzo de la creación y las primeras naciones, la segunda sobre la historia islámica, reinado por reinado, hasta los acontecimientos del año 258 AH. En el prefacio de la segunda parte, el autor afirma haber recopilado los relatos de eruditos, transmisores y biógrafos anteriores, ya que estos diferían en cuanto a eventos y fechas. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}"
  fr: "Une histoire universelle d'Ahmad ibn Abi Ya'qub ibn Wadih al-Katib, dit al-Ya'qubi, en deux parties: la première traite du commencement de la création et des premières nations, la seconde de l'histoire islamique règne par règne jusqu'aux événements de l'an 258 de l'Hégire. Dans la préface de la seconde partie, l'auteur explique avoir rassemblé les récits de savants, transmetteurs et biographes antérieurs en raison de leurs divergences sur les événements et les dates. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 4} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}"
  tr: "El-Ya'qubi olarak bilinen yazar Ahmed ibn Abi Ya'qub ibn Wadih'in iki bölümden oluşan genel bir tarihi: ilki yaratılışın başlangıcı ve erken ulusların haberleri, ikincisi ise halifelerin günlerinden 258 H.C. olaylarına kadar İslam tarihi üzerine. Yazar, ikinci cildin girişinde, şeyhlerin rivayetlerini, rivayet ve yıllar arasındaki farklılıklar nedeniyle alimlerden, rivayetçilerden ve biyografi yazarlarından topladığını belirtir. {kaynak:Tarikh-Yaqubi-Houtsma-1883 cilt 2 s. tarama 4} {atıf:Tarikh-Yaqubi-Houtsma-1883 cilt 2 s. 625}"
  id: "Sejarah umum oleh Ahmad ibn Abi Ya'qub ibn Wadih, penulis yang dikenal sebagai al-Ya'qubi, dalam dua bagian: yang pertama tentang awal penciptaan dan berita bangsa-bangsa awal, dan yang kedua tentang sejarah Islam dari masa khalifah hingga peristiwa tahun 258 H. Penulis menyebutkan dalam pengantar jilid kedua bahwa ia mengumpulkan narasi para syekh dari para cendekiawan, narator, dan biografer karena perbedaan laporan dan tahun. {sitasi:tarikh-yaqubi-houtsma-1883 jilid 2 hlm. scan 4} {kutip:tarikh-yaqubi-houtsma-1883 jilid 2 hlm. 625}"
