summary:
  ar: "مجموعة أغانٍ كتبها السلطان إبراهيم عادل شاه الثاني بالأردية الدكنية، وقدّم لها ظهوري بالفارسية، يرى زبروفسكي أنها تكشف ذوقه ومزجه بين التراثين الهندي والإسلامي، ويحتمل أنها كانت موضوعًا لصوره {cite:zebrowski-deccani-painting-1983 p. 67} {cite:zebrowski-deccani-painting-1983 p. 69}."
  en: "A collection of songs written in Deccani Urdu by Sultan Ibrahim Adil Shah II, with a Persian preface by Zuhuri, which Zebrowski reads as revealing his taste and his blending of Indian and Islamic traditions, and as likely subject matter for his paintings {cite:zebrowski-deccani-painting-1983 p. 67} {cite:zebrowski-deccani-painting-1983 p. 69}."
  ur: "سلطان ابراہیم عادل شاہ دوم کے دکنی اردو گیتوں کا مجموعہ، ظہوری کے فارسی دیباچے کے ساتھ، جسے زیبروسکی ان کے ذوق اور ہندوستانی و اسلامی روایات کے امتزاج کا آئینہ اور ان کی تصاویر کا ممکنہ موضوع سمجھتے ہیں {cite:zebrowski-deccani-painting-1983 p. 67} {cite:zebrowski-deccani-painting-1983 p. 69}۔"
