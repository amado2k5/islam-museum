label: { ar: "سفر باروخ", en: "The scroll of Barukh", es: "El rollo de Barukh", fr: "Le rouleau de Barukh", ur: "برخ کا طومار", tr: "Baruch Kitabı", id: "Kitab Barukh" }
summary:
  ar: "السفر الذي أثبته باروخ بن ناريا كاتب أرميا النبي وفيه نسب معد بن عدنان إلى قيدر بن إسماعيل في نحو ثلاثين أباً غير ما في نسخة ابن هشام وغيرها من أنساب العرب، أورده المسعودي شاهداً على تنازع الناس في النسب فوق معد {cite:muruj-al-dhahab p. 566}."
  en: "Barukh ibn Nariya's scroll preserving a divergent thirty-father genealogy from Ma'add to Qaydar — cited as evidence for the contention above Ma'add {cite:muruj-al-dhahab p. 566}."
  es: "El rollo de Barukh ibn Nariya que conserva una genealogía divergente de treinta padres desde Ma'add hasta Qaydar — citado como evidencia para la afirmación anterior Ma'add {cite:muruj-al-dhahab p. 566}."
  fr: "Le rouleau de Barukh ibn Nariya préservant une généalogie divergente de trente pères de Ma'add à Qaydar — cité comme preuve de l'affirmation ci-dessus Ma'add {cite:muruj-al-dhahab p. 566}."
  ur: "برخ ابن ناریہ کا طومار جس میں معد سے قیدر تک مختلف تیس باپ کا نسب نامہ محفوظ ہے - معد کے اوپر تنازعہ کے ثبوت کے طور پر نقل کیا گیا ہے۔ 566}۔"
  tr: "Peygamber Yeremya'nın kâtibi Baruch ibn Nariah tarafından doğrulanan ve Ma'ad ibn Adnan'ın soyunu yaklaşık otuz babada Qaydar ibn İsmail'e kadar izleyen kitap, İbn Hişam ve diğer Arap soy ağacı uzmanlarının el yazmalarından farklı olarak, el-Mes'udi tarafından Ma'ad üzerindeki soy hattı üzerindeki halk arasındaki anlaşmazlığın kanıtı olarak gösterilmiştir {cite:muruj-al-dhahab, s. 566}."
  id: "Kitab yang disahkan oleh Baruch ibn Nariah, juru tulis nabi Yeremia, yang menelusuri garis keturunan Ma'ad ibn Adnan hingga Qaydar ibn Ismail dalam sekitar tiga puluh leluhur, berbeda dengan yang ditemukan dalam naskah Ibn Hisham dan ahli silsilah Arab lainnya, dikutip oleh al-Mas'udi sebagai bukti perselisihan di antara orang-orang mengenai garis keturunan Ma'ad {cite:muruj-al-dhahab, hlm. 566}."
