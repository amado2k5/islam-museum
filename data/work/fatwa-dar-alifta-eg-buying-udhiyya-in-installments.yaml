summary:
  ar: "سائل سأل عن شراء الأضحية بالتقسيط. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20685)⁩ أنه يجوز شرعًا شراء الأضحية بالتقسيط من التاجر مباشرة أو عن طريق الصك بشرط أن يكون الثمن والأجل معلومين على ما فصّل الجواب."
  en: "A questioner asked about buying the udhiyya in instalments. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20685) answered that it is lawful — directly from the merchant or through a voucher — provided the price and term are known, as the answer details."
  ur: "ایک سائل نے اقساط پر قربانی خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20685)⁩ نے جواب دیا کہ تاجر سے یا واؤچر کے ذریعے جائز ہے بشرط قیمت اور مدت معلوم ہوں — جیسا کہ جواب میں تفصیل ہے۔"
