id: work/fatwa-dar-alifta-eg-buying-udhiyya-in-installments
class: work
kind: fatwa
label: { ar: "حكم شراء الأضحية بالتقسيط", en: "Buying the udhiyya in instalments", ur: "اقساط پر قربانی خریدنا", es: "Comprar el udhiyya a plazos", fr: "Achat de l'udhiyya en plusieurs fois", tr: "Kurbanın taksitli satın alınmasına ilişkin karar", id: "Putusan tentang pembelian pengorbanan secara cicilan" }
summary:
  ar: "سائل سأل عن شراء الأضحية بالتقسيط. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20685)⁩ أنه يجوز شرعًا شراء الأضحية بالتقسيط من التاجر مباشرة أو عن طريق الصك بشرط أن يكون الثمن والأجل معلومين على ما فصّل الجواب."
  en: "A questioner asked about buying the udhiyya in instalments. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20685) answered that it is lawful — directly from the merchant or through a voucher — provided the price and term are known, as the answer details."
  ur: "ایک سائل نے اقساط پر قربانی خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20685)⁩ نے جواب دیا کہ تاجر سے یا واؤچر کے ذریعے جائز ہے بشرط قیمت اور مدت معلوم ہوں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de comprar la udhiyya a plazos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20685) respondió que es lícito hacerlo, ya sea directamente del comerciante o mediante un cupón, siempre que se conozcan el precio y el plazo, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible d'acheter l'udhiyya en plusieurs fois. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20685) a répondu que cela était licite, soit directement auprès du commerçant, soit par le biais d'un bon d'achat, à condition que le prix et les modalités soient connus, comme le précise la réponse."
  tr: "Bir soru soran kişi, kurbanın taksitlerle satın alınmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20685), kurbanın doğrudan tüccardan taksitli veya çekle satın alınmasının dini olarak izin verilmesi gerektiğini, ancak fiyat ve son ödeme tarihinin cevapta ayrıntılı olarak belirtilmesi gerektiğini söyledi."
  id: "Seorang penanya menanyakan tentang pembelian kurban secara cicilan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20685) menjawab bahwa secara agama diperbolehkan membeli kurban secara angsuran langsung dari pedagang atau dengan cek, asalkan harga dan tanggal jatuh tempo ditentukan sebagaimana tercantum dalam jawaban."
