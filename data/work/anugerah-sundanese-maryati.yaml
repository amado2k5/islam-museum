summary:
  ar: "ترجمة سوندية كاملة لمعاني القرآن وضعتها مارية مرياتي ساسترويجايا، المحاضرة السابقة في اللغة السوندية بجامعة بادجادجاران، وأتمّتها سنة 2011 بعد جزء أول نشرته سنة 2009، ونشرتها رابطة خريجي الجامعة في خمسة مجلدات؛ وهي الترجمة الكاملة الوحيدة للقرآن التي وضعتها امرأة إندونيسية، بلغة الحياة اليومية مع مراعاة مستويات الخطاب، معتمدة في الغالب على الترجمة الإندونيسية الرسمية في طبعة مجمع الملك فهد سنة 1990."
  en: "A complete Sundanese rendering of the meanings of the Qur'an by Mariyah Maryati Sastrawijaya, a former lecturer in Sundanese at Padjadjaran University, completed in 2011 after a first part published in 2009 and issued by the university's alumni association in five volumes; it is the only complete Qur'an translation by an Indonesian woman, written in everyday Sundanese with care for the language's speech registers and following mainly the official Indonesian translation in its 1990 King Fahd Complex edition."
  ur: "قرآن کے معانی کا مکمل سونڈانی ترجمہ از ماریہ مریاتی ساستراوجایا، پدجادجاران یونیورسٹی میں سونڈانی کی سابق لیکچرر، جو 2009 میں پہلے پارے کی اشاعت کے بعد 2011 میں مکمل ہوا اور یونیورسٹی کی انجمنِ سابق طلبہ نے پانچ جلدوں میں شائع کیا؛ یہ کسی انڈونیشیائی خاتون کا واحد مکمل ترجمۂ قرآن ہے، روزمرہ سونڈانی میں، بول چال کے درجات کی رعایت کے ساتھ، اور زیادہ تر حکومتِ انڈونیشیا کے سرکاری ترجمے کی 1990 کی شاہ فہد کمپلیکس اشاعت پر مبنی ہے۔"
