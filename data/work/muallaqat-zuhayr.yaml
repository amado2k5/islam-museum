summary:
  ar: "إحدى المعلقات السبع، من الطويل على روي الميم، مطلعها «أمن أم أوفى دمنة لم تكلم بحومانة الدراج فالمتثلم»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}."
  en: "One of the seven Mu'allaqat, in the tawil metre on the rhyme mim, opening \"Is it for Umm Awfa, a camp that does not speak, at Hawmanat al-Darraj and al-Mutathallam?\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}."
