summary:
  ar: "كتاب الغزالي في أربعة أرباع، في كل ربع عشرة كتب: العبادات والعادات والمهلكات والمنجيات؛ قال فيه النووي إنه لو ذهبت كتب الإسلام وبقي الإحياء لأغنى، وأنكره بعض المغاربة أول وصوله إليهم حتى رأى المصنف رؤيا فتاب، وعابه ابن الجوزي فجمع أغلاطه في إعلام الأحياء بأغلاط الإحياء، وخرج أحاديثه الحافظ العراقي سنة ٧٥١ {cite:kashf-zunun-furqan p. 221-223}. ويقول الغزالي في خطبته إنه كتبه لأن علم طريق الآخرة صار «نسياً منسياً»، وإنه قصد فيه علم المعاملة دون علم المكاشفة {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}. وتذكر دائرة المعارف الإسلامية أنه ألفه في سنوات عزلته بدمشق وطوس بعد تركه التدريس في بغداد سنة 488هـ/1095م، وتعده أعظم كتبه حجماً وأهمية {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}."
  en: "Al-Ghazali's work in four quarters of ten books each, on worship, habit, the destroyers and the saviours; al-Nawawi judged it could replace all Islam's books, a Maghrebi denouncer of it famously repented after a dream, Ibn al-Jawzi collected its slips in Ilam al-Ahya', and al-Iraqi sifted its hadiths in 751 {cite:kashf-zunun-furqan p. 221-223}. In his preface al-Ghazali says he wrote it because the knowledge of the path to the hereafter had become forgotten, and that it treats the knowledge of conduct, not the knowledge of unveiling {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}. The Encyclopaedia of Islam says he composed it in his years of retirement at Damascus and Tus, after leaving his Baghdad chair in 488/1095, and calls it his greatest work in size and importance {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}."
  ur: "غزالی کی چار ارباع میں تصنیف، ہر ربع میں دس کتابیں: عبادات، عادات، مہلکات اور منجیات؛ نووی کے بقول اگر اسلام کی سب کتابیں ضائع ہو جائیں اور احیاء باقی رہے تو کافی ہو، مغرب کے ایک منکر نے خواب کے بعد توبہ کی، ابن الجوزی نے اس کی غلطیاں «اعلام الاحیاء» میں جمع کیں، اور عراقی نے 751ھ میں اس کی احادیث کی تخریج کی {cite:kashf-zunun-furqan p. 221-223}۔ غزالی اپنے مقدمے میں کہتے ہیں کہ آخرت کے راستے کا علم بھلا دیا گیا تھا، اور یہ علمِ معاملہ کی کتاب ہے، علمِ مکاشفہ کی نہیں {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}۔ انسائیکلوپیڈیا آف اسلام کے مطابق انہوں نے اسے 488ھ/1095ء میں بغداد کی مسند چھوڑنے کے بعد دمشق اور طوس کی گوشہ نشینی میں لکھا، اور اسے ضخامت اور اہمیت میں ان کی سب سے بڑی تصنیف کہتا ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}۔"
  es: "La obra de Al-Ghazali consta de cuatro partes de diez libros cada una, sobre la adoración, los hábitos, los destructores y los salvadores; Al-Nawawi consideró que podía reemplazar todos los libros del Islam, un denunciante magrebí de la obra se arrepintió después de un sueño, Ibn al-Jawzi recopiló sus fragmentos en Ilam al-Ahya', y Al-Iraqi seleccionó sus hadices en 751 {cite:kashf-zunun-furqan p. 221-223}. En su prefacio, Al-Ghazali afirma que la escribió porque el conocimiento del camino hacia el más allá se había olvidado, y que trata sobre el conocimiento de la conducta, no sobre el conocimiento de la revelación {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}. La Enciclopedia del Islam dice que la compuso en sus años de retiro en Damasco y Tus, después de dejar su cátedra en Bagdad en 488/1095, y la llama su obra más grande en tamaño e importancia {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}."
  fr: "L'œuvre d'al-Ghazali est divisée en quatre parties de dix livres chacune, traitant du culte, des habitudes, des destructeurs et des sauveurs. Al-Nawawi estima qu'elle pouvait remplacer tous les livres de l'islam. Un détracteur maghrébin se repentit après un rêve. Ibn al-Jawzi rassembla ses lamelles dans Ilam al-Ahya', et al-Iraqi en analysa les hadiths en 751 av. J.-C. (voir: Kashf-Zunun-Furqan, p. 221-223). Dans sa préface, al-Ghazali explique l'avoir écrite car la connaissance du chemin de l'au-delà était tombée dans l'oubli, et précise qu'elle traite de la connaissance de la conduite, et non de la connaissance du dévoilement (voir: Ihya-Shamela-Dar-Al-Marifa, p. 9; Ihya-Shamela-Dar-Al-Marifa, p. 16). L'Encyclopédie de l'Islam dit qu'il l'a composée pendant ses années de retraite à Damas et Tus, après avoir quitté sa chaire de Bagdad en 488/1095, et la qualifie de son œuvre la plus importante par sa taille et son importance {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}."
  tr: "El-Hazali'nin kitabı dört bölüme ayrılmıştır; her çeyrek ibadet, adetler, yıkım ve kurtuluş eylemlerini içerir. El-Nevavi, İslam kitapları kaldırılır ve canlanma devam ederse daha zengin olur diye söylemiştir. Bazı Faslılar, kitap kendilerine ulaşır ulaşmaz yazar bir vizyon görüp tövbe edene kadar reddetmiştir. İbn el-Cavazi onu eleştirmiş, 'İlam el-İhya'daki hatalarını ve uyanış hatalarını toplamıştır. Hadisleri 751 yılında el-Hafız el-Iraki'de yayımlanmıştır {alıntı:Kaşf-Zunun-Furqan, s. 221-223}. El-Gazali vaazında, bu kitabı yazdığını, çünkü ahiret yolunun bilgisi 'unutulmuş ve unutmamış' hale gelmişti ve açığa çıkarma bilgisi olmadan işlem bilimini amaçladığını {cite:ihya-şamela-dar-al-marifa, s. 9} {cite:ihya-şamela-dar-al-marifa, s. 16} İslami Ansiklopedi, Bağdat'ta öğretmenliği bıraktıktan sonra 488 Hicri / 1095 yılında Şam ve Tus'ta izole olduğu yıllarda bu kitabı yazdığını belirtir ve hacim ve önem açısından en büyük kitabı olarak kabul edilir {cite:encyclopaedia-of-Islam-2 cilt 2 s. 1088} {cite:encyclopaedia-of-Islam-2 cilt 2, s. 1089}."
  id: "Kitab Al-Ghazali dibagi menjadi empat bagian, dengan setiap bagian berisi ibadah, adat, kehancuran, dan keselamatan. Al-Nawawi berkata bahwa jika kitab-kitab Islam dihapus dan kebangkitan tetap ada, maka akan lebih kaya. Beberapa orang Maroko menyangkalnya saat kitab itu sampai kepada mereka sampai hingga penulis melihat penglihatan dan bertobat. Ibn al-Jawzi mengkritiknya, mengumpulkan kesalahannya dalam 'Ilam al-Ihya' dengan kesalahan dalam kebangkitan. Hadis-haditnya diterbitkan oleh al-Hafiz al-Iraqi pada tahun 751 {cite:Kashf-Zunun-Furqan, hlm. 221-223}. Al-Ghazali mengatakan dalam khotbahnya bahwa ia menulisnya karena pengetahuan tentang jalan menuju Akhirat telah menjadi 'terlupakan dan terlupakan,' dan bahwa ia bermaksud ilmu transaksi tanpa pengetahuan untuk membuka {cite:ihya-shamela-dar-al-marifa hlm. 9} {cite:ihya-shamela-dar-al-marifa, hlm. 16}. Ensiklopedia Islam menyebutkan bahwa ia menulisnya selama tahun-tahun isolasi di Damaskus dan Tus setelah meninggalkan pengajaran di Baghdad pada tahun 488 H / 1095 M, dan buku ini dianggap sebagai buku terbesarnya dari segi volume dan kepentingan {cite:encyclopaedia-of-Islam-2 vol. 2 hlm. 1088} {cite:encyclopaedia-of-Islam-2 vol. 2, hlm. 1089}."
