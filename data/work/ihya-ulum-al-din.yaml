summary:
  ar: "كتاب الغزالي في أربعة أرباع، في كل ربع عشرة كتب: العبادات والعادات والمهلكات والمنجيات؛ قال فيه النووي إنه لو ذهبت كتب الإسلام وبقي الإحياء لأغنى، وأنكره بعض المغاربة أول وصوله إليهم حتى رأى المصنف رؤيا فتاب، وعابه ابن الجوزي فجمع أغلاطه في إعلام الأحياء بأغلاط الإحياء، وخرج أحاديثه الحافظ العراقي سنة ٧٥١ {cite:kashf-zunun-furqan p. 221-223}. ويقول الغزالي في خطبته إنه كتبه لأن علم طريق الآخرة صار «نسياً منسياً»، وإنه قصد فيه علم المعاملة دون علم المكاشفة {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}. وتذكر دائرة المعارف الإسلامية أنه ألفه في سنوات عزلته بدمشق وطوس بعد تركه التدريس في بغداد سنة 488هـ/1095م، وتعده أعظم كتبه حجماً وأهمية {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}."
  en: "Al-Ghazali's work in four quarters of ten books each, on worship, habit, the destroyers and the saviours; al-Nawawi judged it could replace all Islam's books, a Maghrebi denouncer of it famously repented after a dream, Ibn al-Jawzi collected its slips in Ilam al-Ahya', and al-Iraqi sifted its hadiths in 751 {cite:kashf-zunun-furqan p. 221-223}. In his preface al-Ghazali says he wrote it because the knowledge of the path to the hereafter had become forgotten, and that it treats the knowledge of conduct, not the knowledge of unveiling {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}. The Encyclopaedia of Islam says he composed it in his years of retirement at Damascus and Tus, after leaving his Baghdad chair in 488/1095, and calls it his greatest work in size and importance {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}."
  ur: "غزالی کی چار ارباع میں تصنیف، ہر ربع میں دس کتابیں: عبادات، عادات، مہلکات اور منجیات؛ نووی کے بقول اگر اسلام کی سب کتابیں ضائع ہو جائیں اور احیاء باقی رہے تو کافی ہو، مغرب کے ایک منکر نے خواب کے بعد توبہ کی، ابن الجوزی نے اس کی غلطیاں «اعلام الاحیاء» میں جمع کیں، اور عراقی نے 751ھ میں اس کی احادیث کی تخریج کی {cite:kashf-zunun-furqan p. 221-223}۔ غزالی اپنے مقدمے میں کہتے ہیں کہ آخرت کے راستے کا علم بھلا دیا گیا تھا، اور یہ علمِ معاملہ کی کتاب ہے، علمِ مکاشفہ کی نہیں {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}۔ انسائیکلوپیڈیا آف اسلام کے مطابق انہوں نے اسے 488ھ/1095ء میں بغداد کی مسند چھوڑنے کے بعد دمشق اور طوس کی گوشہ نشینی میں لکھا، اور اسے ضخامت اور اہمیت میں ان کی سب سے بڑی تصنیف کہتا ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 1088} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1089}۔"
