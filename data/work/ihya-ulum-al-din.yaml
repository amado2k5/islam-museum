summary:
  ar: "كتاب الغزالي في أربعة أرباع: ربع العبادات فيه العلم وقواعد العقائد وأسرار الطهارة والصلاة والزكاة والصيام والحج وتلاوة القرآن والأذكار والأوراد، وربع العادات فيه آداب الأكل والكسب والنكاح والحلال والحرام والصحبة والعزلة والسفر والسماع والأمر بالمعروف وأخلاق النبوة، وربع المهلكات فيه شرح عجائب القلب ورياضة النفس وآفات اللسان وذم الدنيا والمال والجاه والكبر، وربع المنجيات فيه التوبة والصبر والشكر والخوف والرجاء والفقر والزهد والتوحيد والمحبة والنية والصدق والمراقبة والتفكر وذكر الموت — أربعون كتاباً؛ قال فيه النووي إنه لو ذهبت كتب الإسلام وبقي الإحياء لأغنى، وأنكره بعض المغاربة أول وصوله إليهم حتى رأى المصنف رؤيا فتاب، وعابه ابن الجوزي فجمع أغلاطه في إعلام الأحياء بأغلاط الإحياء وقال سبطه وضعه على مذاهب الصوفية وترك فيه قانون الفقه فأنكروا ما فيه من الأحاديث التي لم تصح، وخرج أحاديثه الحافظ العراقي سنة ٧٥١ {cite:kashf-zunun-furqan p. 221-223}. ويقول الغزالي في خطبته إنه كتبه لأن علم طريق الآخرة صار «نسياً منسياً»، وإنه قصد فيه علم المعاملة دون علم المكاشفة {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}."
  en: "Al-Ghazali's four-rub' masterpiece of forty books — worship, habit, the destroyers, the saviours — which al-Nawawi judged could replace all Islam's books; a Maghrebi denouncer of it famously repented after a dream, Ibn al-Jawzi collected its slips in Ilam al-Ahya', and al-Iraqi sifted its hadiths in 751 {cite:kashf-zunun-furqan p. 221-223}. In his preface al-Ghazali says he wrote it because the knowledge of the path to the hereafter had become forgotten, and that it treats the knowledge of conduct (mu'amala), not the knowledge of unveiling (mukashafa) {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}."
  ur: "غزالی کی چالیس کتابوں پر مشتمل شاہکار، چار ارباع میں: عبادات، عادات، مہلکات اور منجیات؛ نووی کے بقول اگر اسلام کی سب کتابیں ضائع ہو جائیں اور احیاء باقی رہے تو کافی ہو، مغرب کے ایک منکر نے خواب کے بعد توبہ کی، ابن الجوزی نے اس کی غلطیاں «اعلام الاحیاء» میں جمع کیں، اور عراقی نے 751ھ میں اس کی احادیث کی تخریج کی {cite:kashf-zunun-furqan p. 221-223}۔ غزالی اپنے مقدمے میں کہتے ہیں کہ انہوں نے یہ کتاب اس لیے لکھی کہ آخرت کے راستے کا علم بھلا دیا گیا تھا، اور یہ علمِ معاملہ کی کتاب ہے، علمِ مکاشفہ کی نہیں {cite:ihya-shamela-dar-al-marifa p. 9} {cite:ihya-shamela-dar-al-marifa p. 16}۔"
