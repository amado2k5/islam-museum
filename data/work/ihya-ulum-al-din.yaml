label: { ar: "إحياء علوم الدين" }
summary:
  ar: "كتاب الغزالي في أربعة أرباع: ربع العبادات فيه العلم وقواعد العقائد وأسرار الطهارة والصلاة والزكاة والصيام والحج وتلاوة القرآن والأذكار والأوراد، وربع العادات فيه آداب الأكل والكسب والنكاح والحلال والحرام والصحبة والعزلة والسفر والسماع والأمر بالمعروف وأخلاق النبوة، وربع المهلكات فيه شرح عجائب القلب ورياضة النفس وآفات اللسان وذم الدنيا والمال والجاه والكبر، وربع المنجيات فيه التوبة والصبر والشكر والخوف والرجاء والفقر والزهد والتوحيد والمحبة والنية والصدق والمراقبة والتفكر وذكر الموت — أربعون كتاباً؛ قال فيه النووي إنه لو ذهبت كتب الإسلام وبقي الإحياء لأغنى، وأنكره بعض المغاربة أول وصوله إليهم حتى رأى المصنف رؤيا فتاب، وعابه ابن الجوزي فجمع أغلاطه في إعلام الأحياء بأغلاط الإحياء وقال سبطه وضعه على مذاهب الصوفية وترك فيه قانون الفقه فأنكروا ما فيه من الأحاديث التي لم تصح، وخرج أحاديثه الحافظ العراقي سنة ٧٥١ {cite:kashf-zunun-furqan p. 221-223}."
  en: "Al-Ghazali's four-rub' masterpiece of forty books — worship, habit, the destroyers, the saviours — which al-Nawawi judged could replace all Islam's books; a Maghrebi denouncer of it famously repented after a dream, Ibn al-Jawzi collected its slips in Ilam al-Ahya', and al-Iraqi sifted its hadiths in 751 {cite:kashf-zunun-furqan p. 221-223}."
