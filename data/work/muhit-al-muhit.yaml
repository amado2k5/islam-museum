label: { ar: "محيط المحيط", en: "Muhit al-Muhit", es: "Muhit al-Muhit", fr: "Muhit al-Muhit", ur: "محیط المحیط" }
summary:
  ar: "محيط المحيط لبطرس البستاني، أول معجم عربي حديث بالعربية، أعدّه على أساس القاموس المحيط للفيروزآبادي مع إضافة مصطلحات جديدة، في مجلدين صدرا ببيروت سنة ١٨٧٠م، وله مختصر هو «قطر المحيط» ببيروت ١٨٦٧–١٨٧١م، وضبط المؤلف اسمه في مقدمته «قطر» لا «قطر»."
  en: "Butrus al-Bustani's Muhit al-Muhit, the first modern Arabic-Arabic dictionary, prepared on the basis of al-Fayruzabadi's al-Qamus al-Muhit with new terms added, in two volumes (Beirut 1870). Its abridgement is Qutr al-Muhit (Beirut 1867-1871), whose title the author's preface gives as Qutr, not Qatr."
  es: "El Muhit al-Muhit de Butrus al-Bustani, el primer diccionario árabe-árabe moderno, preparado sobre la base del al-Qamus al-Muhit de al-Fayruzabadi con términos nuevos añadidos, en dos volúmenes (Beirut 1870). Su compendio es el Qutr al-Muhit (Beirut 1867-1871), cuyo título el prólogo del autor da como Qutr, no Qatr."
  fr: "Le Muhit al-Muhit de Butrus al-Bustani, premier dictionnaire arabe-arabe moderne, préparé sur la base du al-Qamus al-Muhit d'al-Fayruzabadi avec des termes nouveaux, en deux volumes (Beyrouth 1870). Son abrégé est le Qutr al-Muhit (Beyrouth 1867-1871), dont la préface de l'auteur donne le titre comme Qutr, non Qatr."
  ur: "بطرس البستانی کی محیط المحیط، پہلی جدید عربی–عربی لغت، جو فیروزآبادی کی القاموس المحیط کی بنیاد پر نئی اصطلاحات کے اضافے کے ساتھ تیار ہوئی، دو جلدوں میں ⁦(بیروت 1870ء)⁩۔ اس کا اختصار قطر المحیط ہے ⁦(بیروت 1867–1871ء)⁩، جس کا نام مصنف نے مقدمے میں قُطر لکھا ہے نہ کہ قَطر۔"
