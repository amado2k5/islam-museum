summary:
  ar: "خطبة السفاح في الجمعة الثانية بالكوفة في أول خلافته، يعد فيها بالوفاء والعدل، ويتوعد من يخالف، ويطلب من الناس السمع والطاعة."
  en: "Al-Saffah's second Friday sermon in Kufa early in his caliphate. He promises to keep his word and to rule justly, warns those who oppose him, and asks the people for obedience."
  ur: "خلافت کے ابتدائی دنوں میں السفاح کا کوفہ میں دوسرے جمعے کا خطبہ۔ وہ وعدہ پورا کرنے اور عدل کا وعدہ کرتے ہیں، مخالفین کو خبردار کرتے ہیں، اور لوگوں سے اطاعت طلب کرتے ہیں۔"
