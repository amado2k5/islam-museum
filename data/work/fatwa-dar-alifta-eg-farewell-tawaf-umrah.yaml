label: { ar: "حكم طواف الوداع بالنسبة للمعتمر في غير وقت الحج", en: "The farewell tawaf for the umrah pilgrim outside Hajj season", ur: "موسمِ حج سے باہر معتمر کے لیے طوافِ وداع کا حکم", es: "El tawaf de despedida para el peregrino de la umrah fuera de la temporada del Hajj.", fr: "Le tawaf d'adieu pour le pèlerin de la umra en dehors de la saison du Hajj", tr: "Hac zamanı dışında Umre Tevafı için Veda Tavifı yapılmasına ilişkin karar", id: "Aturan pelaksanaan Tawaf Perpisahan bagi pelaku Umrah di luar waktu Haji" }
summary:
  ar: "سائل سأل عن طواف الوداع للمعتمر في غير وقت الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22489)⁩ أن طواف الوداع مستحب للمعتمر إذا أقام بمكة بعد فراغه من عمرته ثم أراد الخروج منها ليكون آخر عهده بالبيت، على ما فصّل الجواب."
  en: "A questioner asked about the farewell tawaf for the umrah pilgrim outside the Hajj season. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22489) answered that the farewell tawaf is recommended for the umrah pilgrim who stayed on in Mecca after finishing his umrah and then intends to leave, so that the House is the last thing he does — as the answer details."
  ur: "ایک سائل نے موسمِ حج سے باہر معتمر کے لیے طوافِ وداع کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22489)⁩ نے جواب دیا کہ طوافِ وداع معتمر کے لیے مستحب ہے اگر وہ عمرہ کے بعد مکہ میں ٹھہرا ہو اور پھر نکلنا چاہتا ہو تاکہ آخری کام بیت اللہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el tawaf de despedida para el peregrino de la umrah fuera de la temporada del Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22489) respondió que el tawaf de despedida se recomienda para el peregrino de la umrah que se queda en La Meca después de terminar su umrah y luego tiene la intención de partir, de modo que la Casa sea lo último que haga, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant le tawaf d'adieu pour le pèlerin de la Omra en dehors de la saison du Hajj. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22489) a répondu que le tawaf d'adieu est recommandé au pèlerin de la Omra qui reste à La Mecque après avoir accompli son pèlerinage et qui s'apprête à partir, afin que la visite de la Kaaba soit son dernier acte – comme le précise la réponse."
  tr: "Bir soru soran kişi, Hac zamanı dışında Umre hacı için veda Tevafı hakkında bilgi aldı. Mısır Dar al-İftası (Cumhuriyeti Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22489), cevabında ayrıntılı olarak belirtildiği üzere, hacı umresini tamamladıktan sonra Mekke'de kalır ve ardından son kez evde kalmak isterse veda Tevafı önerilmiştir."
  id: "Seorang penanya menanyakan tentang Tawaf perpisahan bagi jamaah Umrah di luar waktu Haji. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22489) menjawab bahwa Tawaf Perpisahan direkomendasikan bagi jamaah jika ia tetap di Mekah setelah menyelesaikan Umrah dan kemudian berniat pergi untuk berada di Rumah untuk terakhir kalinya, seperti yang dijelaskan dalam jawabannya."
