id: work/fatwa-aliftaa-jo-vowing-to-fast-a-whole-year
class: work
kind: fatwa
label: { ar: "نذر صوم سنة", en: "Vowing to fast a whole year", ur: "پورے سال کے روزوں کی نذر", es: "Prometiendo ayunar durante todo un año", fr: "Faire vœu de jeûner pendant un an entier", tr: "Bir yıl oruç tutmaya yemin et", id: "Berjanjilah untuk puasa setahun" }
summary:
  ar: "سؤال عن نذر صوم سنة، أجابت فيه دائرة الإفتاء العام الأردنية بأن نذر سنة معينة لا يدخل فيه العيد والتشريق ورمضان وأيام الحيض والنفاس ولا تقضى، وأن نذر سنة غير معينة يلزم فيه التتابع إن شرطه وتقضى فيه تلك الأيام إلا الحيض والنفاس. أجابت الدائرة بأن من نذر صوم سنة معينة لم يدخل في نذره العيد وأيام التشريق ورمضان وأيام الحيض والنفاس، ولا تقضى هذه الأيام. وقالت إن من نذر صوم سنة غير معينة فإن شرط التتابع لزمه، ولا يصوم أيام العيد ورمضان والحيض، لكن يجب عليه قضاء هذه الأيام إلا أيام الحيض والنفاس. ونقلت من حاشية الباجوري على شرح ابن قاسم (2/606) أن رمضان لا يقبل صوم غيره وأن العيد والتشريق لا تقبل الصوم أصلًا، فهي مستثناة شرعًا من نذر السنة المعينة ولا تقطع التتابع، وذكرت فيه خلاف الرافعي في أيام الحيض والنفاس من السنة المعينة، وقول ابن الرفعة بوجوب قضاء أيام الحيض في السنة غير المعينة كما في رمضان."
  en: "A question about vowing to fast a whole year, in which Jordan's General Iftaa Department answered that a vow for a specific year excludes the Eids, the days of tashriq, Ramadan and days of menstruation and postnatal bleeding with no make-up, and that a vow for an unspecified year binds continuity if stipulated and requires making up those days except menstruation and postnatal bleeding. The Department answered that whoever vows to fast a specific year does not include in the vow the Eid, the days of tashriq, Ramadan, or days of menstruation and postnatal bleeding, and these days are not made up. It said that whoever vows to fast an unspecified year must fast continuously if he stipulated continuity, does not fast the days of Eid, Ramadan and menstruation, but must make up those days except the days of menstruation and postnatal bleeding. It quoted the Hashiya of al-Bajuri on Ibn Qasim's commentary (2/606) that Ramadan admits no other fast and that Eid and tashriq admit no fast at all, so they are excluded by the law from a specific-year vow and do not break continuity, noting there the disagreement of al-Rafi'i over menstruation and postnatal days in a specific year, and the view of Ibn al-Rif'a that menstruation days in an unspecified year must be made up as in Ramadan."
  ur: "پورے سال کے روزوں کی نذر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ معین سال کی نذر میں عیدین، ایامِ تشریق، رمضان اور حیض و نفاس کے دن داخل نہیں اور ان کی قضا نہیں، اور غیر معین سال کی نذر میں شرط ہو تو تسلسل لازم ہے اور حیض و نفاس کے سوا ان دنوں کی قضا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو معین سال کے روزوں کی نذر مانے اس کی نذر میں عید، ایامِ تشریق، رمضان اور حیض و نفاس کے دن داخل نہیں، اور ان دنوں کی قضا نہیں۔ اس نے کہا کہ جو غیر معین سال کی نذر مانے اور تسلسل کی شرط لگائے اس پر تسلسل لازم ہے، وہ عید، رمضان اور حیض کے دنوں میں روزہ نہ رکھے، لیکن حیض و نفاس کے سوا ان دنوں کی قضا اس پر واجب ہے۔ اس نے شرح ابن قاسم پر باجوری کے حاشیے (2/606) سے نقل کیا کہ رمضان میں کوئی دوسرا روزہ نہیں ہو سکتا اور عید و تشریق میں روزہ ہوتا ہی نہیں، اس لیے یہ دن شرعاً معین سال کی نذر سے مستثنیٰ ہیں اور تسلسل نہیں توڑتے، اور اس میں معین سال کے حیض و نفاس کے دنوں میں رافعی کے اختلاف اور غیر معین سال میں حیض کے دنوں کی قضا کے بارے میں ابن الرفعہ کے قول کا ذکر ہے کہ رمضان کی طرح ان کی قضا لازم ہے۔"
  es: "Una pregunta sobre el voto de ayunar un año entero, en la que el Departamento General de Iftaa de Jordania respondió que un voto para un año específico excluye los Eids, los días de tashriq, Ramadán y los días de menstruación y sangrado posparto sin compensación, y que un voto para un año no especificado obliga a la continuidad si se estipula y requiere recuperar esos días excepto la menstruación y el sangrado posparto. El Departamento respondió que quien promete ayunar un año específico no incluye en el voto los Eids, los días de tashriq, Ramadán o los días de menstruación y sangrado posparto, y estos días no se recuperan. Dijo que quien promete ayunar un año no especificado debe ayunar de forma continua si estipuló la continuidad, no ayuna los días de Eids, Ramadán y menstruación, pero debe recuperar esos días excepto los días de menstruación y sangrado posparto. Citaba la Hashiya de al-Bajuri sobre el comentario de Ibn Qasim (2/606) de que Ramadán no admite ningún otro ayuno y que Eid y tashriq no admiten ningún ayuno en absoluto, por lo que están excluidos por la ley de un voto de año específico y no rompen la continuidad, señalando allí el desacuerdo de al-Rafi'i sobre la menstruación y los días posnatales en un año específico, y la opinión de Ibn al-Rif'a de que los días de menstruación en un año no especificado deben recuperarse como en Ramadán."
  fr: "Concernant le vœu de jeûner pendant une année entière, le Département général de la Iftaa en Jordanie a répondu qu'un vœu pour une année déterminée exclut les jours de l'Aïd, les jours de Tashriq, le Ramadan, ainsi que les jours de menstruation et de saignements post-partum, sans possibilité de rattrapage. En revanche, un vœu pour une année indéterminée impose la continuité du jeûne s'il l'a stipulé et exige le rattrapage des jours non rattrapés, à l'exception des jours de menstruation et de saignements post-partum. Le Département a précisé que quiconque fait vœu de jeûner pendant une année déterminée n'inclut pas dans ce vœu les jours de l'Aïd, les jours de Tashriq, le Ramadan, ni les jours de menstruation et de saignements post-partum, et que ces jours ne sont pas rattrapés. Il a ajouté que quiconque fait vœu de jeûner pendant une année indéterminée doit jeûner de manière continue s'il a stipulé la continuité du jeûne, à l'exception des jours de l'Aïd, du Ramadan et des jours de menstruation, mais doit rattraper ces jours non rattrapés. Il cite la Hashiya d'al-Bajuri sur le commentaire d'Ibn Qasim (2/606) selon lequel le Ramadan n'admet aucun autre jeûne et que l'Aïd et le tashriq n'admettent aucun jeûne du tout, ils sont donc exclus par la loi d'un vœu d'une année spécifique et ne rompent pas la continuité, notant là le désaccord d'al-Rafi'i sur les menstruations et les jours postnatals dans une année spécifique, et l'avis d'Ibn al-Rif'a selon lequel les jours de menstruations dans une année non spécifiée doivent être rattrapés comme pendant le Ramadan."
  tr: "Ürdün Genel Fetva Dairesi, belirli bir yıl için verilen yeminlerin Kurban Bayramı, Taşrik, Ramazan, adet ve doğum sonrası kanamayı kapsamadığını, kaçırılan günleri telafi etmediğini, belirli bir yıl için verilen yeminlerin ardışık takip gerektirdiğini ve bu günlerin adet ve doğum sonrası kanama dışında yerine getirildiği sürece sorgulandı. Daire, belirli bir yıl oruç tutmaya yemin edenlerin Kurban Bayramı, Taşrik, Ramazan, adet ve doğum sonrası dönemleri kapsamadığını ve bu günlerin kaçırılmadığını belirtti. Belirlenmeyen bir yıl oruç tutmaya yemin edenin ardışık olarak oruç tutmakla yükümlü olduğu, Ramazan bayramı, Ramazan veya adet günlerinde oruç tutmadığı, ancak adet ve doğum sonrası kanama dışında bu günleri telafi etmesi gerektiğini belirtti. El-Bajuri'nin İbn Kasım tefsiri (2/606) üzerine kenar notlarından alıntı yaptım; Ramazan başka zamanlarda oruç tutmaz, bayram ve Taşrik ise oruç için hiç geçerli değildir; bunlar dini olarak belirtilen Sünnet'in yeminlerinden muaftır ve ardı süreci kesmez. El-Rafi'i'nin adet günleri ve doğum sonrası kanama günleri, belirtilen Sünnet'ten kaynaklandığı konusundaki anlaşmazlığından ve İbn El-Rifa'ah'ın, Ramazan gibi belirtilmemiş bir sünnette adet günlerinin telafi edilmesinin zorunlu olduğu görüşünden bahsettim."
  id: "Sebuah pertanyaan tentang berpuasa Sunnah, di mana Departemen Fatwa Umum Yordania menjawab bahwa janji untuk tahun tertentu tidak mencakup Idul Fitri, Tashreeq, Ramadan, menstruasi, pendarahan pasca melahirkan, dan tidak menggantikan hari-hari yang terlewat, dan bahwa janji untuk tahun tertentu memerlukan tindak lanjut berturut-turut, asalkan hari-hari tersebut dipenuhi kecuali menstruasi dan perdarahan pasca melahirkan. Departemen menjawab bahwa siapa pun yang berjanji berpuasa pada tahun tertentu tidak termasuk Idul Fitri, hari-hari Tashreeq, Ramadan, menstruasi, dan periode pasca melahirkan, dan hari-hari ini tidak dilewatkan. Departemen menyatakan bahwa siapa pun yang bersumpah berpuasa selama tahun yang tidak ditentukan wajib berpuasa berturut-turut, dan tidak berpuasa pada hari Idul Fitri, Ramadan, atau menstruasi, tetapi harus menebus hari-hari tersebut kecuali untuk menstruasi dan perdarahan pasca melahirkan. Saya mengutip dari catatan pinggir Al-Bajuri tentang komentar Ibn Qasim (2/606) bahwa Ramadan tidak menerima puasa pada waktu lain, dan bahwa Idul Fitri dan Tashreeq sama sekali tidak sah untuk puasa; secara agama mereka dibebaskan dari kaul Sunnah yang ditentukan dan tidak mengganggu suksesi. Saya menyebutkan perbedaan pendapat Al-Rafi'i mengenai hari menstruasi dan perdarahan pasca melahirkan dari Sunnah yang ditentukan, dan pendapat Ibn Al-Rifa'ah bahwa menyusun hari menstruasi dalam Sunnah yang tidak ditentukan adalah wajib, seperti pada Ramadan."
