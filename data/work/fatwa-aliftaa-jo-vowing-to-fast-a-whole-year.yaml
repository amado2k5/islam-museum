id: work/fatwa-aliftaa-jo-vowing-to-fast-a-whole-year
class: work
kind: fatwa
label: { ar: "نذر صوم سنة", en: "Vowing to fast a whole year", ur: "پورے سال کے روزوں کی نذر" }
summary:
  ar: "سؤال عن نذر صوم سنة، أجابت فيه دائرة الإفتاء العام الأردنية بأن نذر سنة معينة لا يدخل فيه العيد والتشريق ورمضان وأيام الحيض والنفاس ولا تقضى، وأن نذر سنة غير معينة يلزم فيه التتابع إن شرطه وتقضى فيه تلك الأيام إلا الحيض والنفاس. أجابت الدائرة بأن من نذر صوم سنة معينة لم يدخل في نذره العيد وأيام التشريق ورمضان وأيام الحيض والنفاس، ولا تقضى هذه الأيام. وقالت إن من نذر صوم سنة غير معينة فإن شرط التتابع لزمه، ولا يصوم أيام العيد ورمضان والحيض، لكن يجب عليه قضاء هذه الأيام إلا أيام الحيض والنفاس. ونقلت من حاشية الباجوري على شرح ابن قاسم (2/606) أن رمضان لا يقبل صوم غيره وأن العيد والتشريق لا تقبل الصوم أصلًا، فهي مستثناة شرعًا من نذر السنة المعينة ولا تقطع التتابع، وذكرت فيه خلاف الرافعي في أيام الحيض والنفاس من السنة المعينة، وقول ابن الرفعة بوجوب قضاء أيام الحيض في السنة غير المعينة كما في رمضان."
  en: "A question about vowing to fast a whole year, in which Jordan's General Iftaa Department answered that a vow for a specific year excludes the Eids, the days of tashriq, Ramadan and days of menstruation and postnatal bleeding with no make-up, and that a vow for an unspecified year binds continuity if stipulated and requires making up those days except menstruation and postnatal bleeding. The Department answered that whoever vows to fast a specific year does not include in the vow the Eid, the days of tashriq, Ramadan, or days of menstruation and postnatal bleeding, and these days are not made up. It said that whoever vows to fast an unspecified year must fast continuously if he stipulated continuity, does not fast the days of Eid, Ramadan and menstruation, but must make up those days except the days of menstruation and postnatal bleeding. It quoted the Hashiya of al-Bajuri on Ibn Qasim's commentary (2/606) that Ramadan admits no other fast and that Eid and tashriq admit no fast at all, so they are excluded by the law from a specific-year vow and do not break continuity, noting there the disagreement of al-Rafi'i over menstruation and postnatal days in a specific year, and the view of Ibn al-Rif'a that menstruation days in an unspecified year must be made up as in Ramadan."
  ur: "پورے سال کے روزوں کی نذر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ معین سال کی نذر میں عیدین، ایامِ تشریق، رمضان اور حیض و نفاس کے دن داخل نہیں اور ان کی قضا نہیں، اور غیر معین سال کی نذر میں شرط ہو تو تسلسل لازم ہے اور حیض و نفاس کے سوا ان دنوں کی قضا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو معین سال کے روزوں کی نذر مانے اس کی نذر میں عید، ایامِ تشریق، رمضان اور حیض و نفاس کے دن داخل نہیں، اور ان دنوں کی قضا نہیں۔ اس نے کہا کہ جو غیر معین سال کی نذر مانے اور تسلسل کی شرط لگائے اس پر تسلسل لازم ہے، وہ عید، رمضان اور حیض کے دنوں میں روزہ نہ رکھے، لیکن حیض و نفاس کے سوا ان دنوں کی قضا اس پر واجب ہے۔ اس نے شرح ابن قاسم پر باجوری کے حاشیے (2/606) سے نقل کیا کہ رمضان میں کوئی دوسرا روزہ نہیں ہو سکتا اور عید و تشریق میں روزہ ہوتا ہی نہیں، اس لیے یہ دن شرعاً معین سال کی نذر سے مستثنیٰ ہیں اور تسلسل نہیں توڑتے، اور اس میں معین سال کے حیض و نفاس کے دنوں میں رافعی کے اختلاف اور غیر معین سال میں حیض کے دنوں کی قضا کے بارے میں ابن الرفعہ کے قول کا ذکر ہے کہ رمضان کی طرح ان کی قضا لازم ہے۔"
