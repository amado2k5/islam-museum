label: { ar: "جامع المبادئ والغايات ⁦(أبو علي المراكشي)⁩", en: "Jami' al-mabadi' wal-ghayat (Abu Ali al-Marrakushi)", ur: "جامع المبادی والغایات ⁦(ابو علی المراکشی)⁩", tr: "İlkeler ve Hedefler Derleyicisi (Abu Ali Al-Marrakuşi)", id: "Penyusun Prinsip dan Tujuan (Abu Ali Al-Marrakushi)" }
summary:
  ar: "موسوعة أبي علي المراكشي في علم الآلات الرصدية والمواقيت في 130 فصلًا، يعدّها كتاب مكتبة الإسكندرية من أهم ما ألف في نظرية المزولة، وكان لها أثر قوي في مصر والشام {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 17}."
  en: "Abu Ali al-Marrakushi's compendium on observational instruments and timekeeping in 130 chapters, which the Bibliotheca Alexandrina book counts among the most important works on sundial theory, influential in Egypt and Syria {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 17}."
  ur: "ابو علی المراکشی کا رصدی آلات اور اوقات پر 130 فصلوں کا جامع رسالہ، جسے مکتبۂ اسکندریہ کی کتاب دھوپ گھڑی کے نظریے پر اہم ترین تصانیف میں شمار کرتی ہے اور جس کا مصر و شام میں گہرا اثر رہا {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 17}۔"
  es: "El compendio de Abu Ali al-Marrakushi sobre instrumentos de observación y medición del tiempo en 130 capítulos, que el libro de la Bibliotheca Alexandrina cuenta entre las obras más importantes sobre la teoría del reloj de sol, influyente en Egipto y Siria {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 17}."
  fr: "Le recueil d'Abu Ali al-Marrakushi sur les instruments d'observation et la mesure du temps en 130 chapitres, que le livre de la Bibliotheca Alexandrina compte parmi les ouvrages les plus importants sur la théorie du cadran solaire, influent en Égypte et en Syrie {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 17}."
  tr: "Gözlemsel Araçlar ve Zamanlamalar Bilimi Ansiklopedisi'nin 130 bölümden oluşan Ebu Ali el-Marrakushi'nin Gözlemsel Araçlar ve Zamanlamalar Bilimi adlı eseri, İskenderiye Bibliothecası tarafından çözülme teorisi üzerine en önemli eserlerden biri olarak kabul edilir ve Mısır ile Levant'ta güçlü bir etki yaratmıştır {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006, s. 17}."
  id: "Ensiklopedia Abu Ali al-Marrakushi dalam Ilmu Instrumen dan Waktu Observasi, yang terdiri dari 130 bab, dianggap oleh Bibliotheca Alexandria sebagai salah satu karya terpenting tentang teori pelarutan, dan memiliki dampak besar di Mesir dan Levant {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006, hlm. 17}."
