  en: "Abu Ali al-Marrakushi's compendium on observational instruments and timekeeping in 130 chapters, which the Bibliotheca Alexandrina book counts among the most important works on sundial theory, influential in Egypt and Syria {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 17}."
