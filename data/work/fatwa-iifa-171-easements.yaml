label: { ar: "قرار مجمع الفقه الإسلامي الدولي 171 (18/9) بشأن حقوق الارتفاق وتطبيقاته المعاصرة في الأملاك المشتركة", en: "IIFA resolution 171 (18/9) on easement rights and their contemporary applications in shared property", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 171 (18/9): حقوقِ ارتفاق اور مشترک املاک میں ان کے عصری اطلاقات", es: "Resolución 171 (18/9) de la IIFA sobre los derechos de servidumbre y sus aplicaciones contemporáneas en la propiedad compartida.", fr: "Résolution 171 (18/9) de l'IIFA sur les droits de servitude et leurs applications contemporaines en matière de propriété partagée", tr: "Uluslararası İslami Fiqh Akademisi Kararı 171 (18/9) ile ortak mülkiyetteki irtifak hakları ve bunların güncel uygulamaları hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 171 (18/9) mengenai hak hak guna dan penerapannya pada masa kini dalam kepemilikan bersama" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف حق الارتفاق بكل ما ثبت لعقار على عقار آخر من الأمور المنتفع بها مما يقبل الاشتراك، وعدّد أصنافه الموروثة: حق الشرب ⁦(نوبة الانتفاع بالماء لسقي الزرع والحيوانات أو إجرائه بين عقارين)⁩، وحق المسيل ⁦(إسالة الفائض أو غير الصالح من الأرض المرتفعة إلى المرتفق بها أو إلى مصرف عام)⁩، وحق المرور ⁦(ثبوت المرور لأرض على أرض مجاورة)⁩، وحق التعلي ⁦(استقرار البناء الأعلى على الأسفل المملوك لغيره)⁩. وعدّد أسباب نشوئه: إذن المالك معاوضة أو تبرعًا، والضرورة، وإحياء الموات، والجوار والأملاك المشتركة، مع فتح الباب لأسباب حديثة معتبرة ما لم تخالف النصوص والقواعد ⁦(كتمديد أسلاك الكهرباء وأنابيب الصرف)⁩. وأرسى قاعدة: الأصل في المنافع الحل وفي المضار التحريم، والمياه الخاصة المحرزة لا تستحق إلا للضرورة وبثمن المثل؛ وثبت ارتفاق الشرب والإجراء والمسيل للعقار والمزارع بالعرف ⁦(ومنه إمرار الأنابيب للمصانع والصرف بلا إضرار)⁩، وحق التعلي لصاحبه يتصرف فيه بعوض وبدونه؛ وأقر الارتفاقات المعاصرة ⁦(إمرار وسائل الخدمات العامة: الاتصال والكهرباء والماء والغاز والصرف والتكييف المركزي)⁩ وأن المواقف الخاصة تتبع العين التي أبيح الوقوف من أجلها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined easement rights as whatever beneficial entitlement capable of being shared is established for one property over another, and listed the inherited kinds: the right of shurb (turns in using water for crops and animals or conducting it between properties), masil (draining surplus or unusable water from higher land to the burdened land or a public drain), passage (one land's right to pass over a neighbouring one), and elevation (an upper structure resting on another's lower structure). Causes of creation: the owner's permission by exchange or gift; necessity; revival of dead land; and neighbourhood and shared property — leaving room for new legally recognised causes not contrary to the texts and general rules (such as running power lines and drainage pipes). Its baseline rule: benefits are in principle free, harms prohibited, and privately held waters are claimable only on necessity at equivalent price; easements of drinking water, conduction and drainage attach to property and farms by custom (including running factory and sewerage pipes without harm); the elevation right-holder may dispose of it with or without compensation; contemporary easements (routing public utilities — communications, electricity, water, gas, sewerage, central air conditioning) are recognised; and private parking follows the property for which standing was permitted."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے حقِ ارتفاق کی تعریف کی: ایک جائیداد کے لیے دوسری جائیداد پر وہ فائدہ مند چیز جو اشتراک کے قابل ہو۔ وراثت میں آنے والی اقسام: حقِ شرب ⁦(فصل اور جانوروں کے لیے پانی کی نوبت یا دو جائیدادوں کے درمیان پانی بہانا)⁩، حقِ مسیل ⁦(زائد یا ناقابلِ استعمال پانی اونچی زمین سے ذمہ دار زمین یا عوامی نالے میں بہانا)⁩، حقِ مرور ⁦(ایک زمین کے لیے ہمسائی زمین سے گزرنا)⁩، اور حقِ تعلا ⁦(اوپر کی تعمیر کا دوسرے کے نچلے حصے پر ٹکنا)⁩۔ اس کے اسباب: مالک کی اجازت معاوضے یا تبرع سے؛ ضرورت؛ موات کی آبادکاری؛ اور ہمسائیگی و مشترک جائیداد — ساتھ ہی ان جدید اسباب کے لیے راستہ جو نصوص و قواعد سے نہ ٹکرائیں ⁦(بجلی کے تار اور نکاسی کے پائپ)⁩۔ بنیادی قاعدہ: منافع میں اصل حل ہے اور مضار میں حرمت؛ محرز نجی پانی صرف ضرورت پر مثل کی قیمت سے مستحق؛ شرب، اجرا اور مسیل کے ارتفاق جائیداد اور کھیتوں سے عرف کے مطابق قائم ⁦(کارخانوں اور گٹر کے پائپ بلا ضرر)⁩؛ تعلا کے مستحق کو معاوضے کے ساتھ یا بغیر اس کا تصرف؛ عصری ارتفاقات ⁦(عوامی سہولتوں کا گزرنا: مواصلات، بجلی، پانی، گیس، گٹر، مرکزی ایئر کنڈیشننگ)⁩ تسلیم؛ اور نجی پارکنگ اس جائیداد کی تابع جس کے لیے کھڑا ہونے کی اجازت تھی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Definió los derechos de servidumbre como cualquier derecho beneficioso susceptible de ser compartido que se establece para una propiedad sobre otra, y enumeró los tipos heredados: el derecho de shurb (turnos en el uso del agua para cultivos y animales o su conducción entre propiedades), masil (drenaje del agua sobrante o no utilizable de terrenos más altos hacia terrenos gravados o un desagüe público), paso (derecho de un terreno a pasar sobre uno vecino) y elevación (una estructura superior que descansa sobre la estructura inferior de otra). Causas de creación: el permiso del propietario por intercambio o donación; necesidad; recuperación de terrenos baldíos; y vecindad y propiedad compartida, dejando espacio para nuevas causas legalmente reconocidas que no contravengan los textos y las reglas generales (como el tendido de líneas eléctricas y tuberías de drenaje). Su regla básica establece que, en principio, los beneficios son gratuitos, los daños están prohibidos y las aguas de propiedad privada solo se pueden reclamar por necesidad a un precio equivalente; las servidumbres de agua potable, conducción y drenaje se vinculan a propiedades y granjas por costumbre (incluidas las tuberías de fábricas y alcantarillado que no causan daño); el titular del derecho de elevación puede disponer de él con o sin compensación; se reconocen las servidumbres contemporáneas (para el enrutamiento de servicios públicos: comunicaciones, electricidad, agua, gas, alcantarillado, aire acondicionado central); y el estacionamiento privado sigue a la propiedad para la cual se permitió el estacionamiento."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, 9-14 juillet 2007). Elle définit les servitudes comme tout droit bénéfique, susceptible d'être partagé, établi entre deux propriétés et énumère les types de servitudes hérités: le droit de shurb (droit d'utiliser l'eau pour les cultures et l'élevage ou de la faire circuler entre propriétés), le masil (drainage des eaux excédentaires ou inutilisables des terrains situés en altitude vers le terrain grevé ou un réseau d'égouts public), le droit de passage (droit d'un terrain de passer au-dessus d'un terrain voisin) et le droit d'élévation (une construction supérieure reposant sur une construction inférieure). Les causes de création d'une servitude sont: la permission du propriétaire par échange ou donation; la nécessité; la remise en état d'un terrain en friche; et les propriétés voisines et communes – laissant place à de nouvelles causes juridiquement reconnues, non contraires aux textes et aux règles générales (comme la pose de lignes électriques et de canalisations d'assainissement). Sa règle de base: les avantages sont en principe gratuits, les préjudices interdits, et les eaux privées ne peuvent être réclamées qu’en cas de nécessité et à un prix équivalent; les servitudes d’eau potable, de conduite et de drainage s’attachent aux propriétés et aux exploitations agricoles par coutume (y compris le passage de canalisations d’usine et d’égouts sans préjudice); le titulaire du droit d’élévation peut en disposer avec ou sans compensation; les servitudes contemporaines (passage des services publics — communications, électricité, eau, gaz, égouts, climatisation centrale) sont reconnues; et le stationnement privé suit la propriété pour laquelle le stationnement a été autorisé."
  tr: "Putrajaya'daki on sekizinci oturumunda (24–29 Jumada al-Akhirah 1428 H, 9–14 Temmuz 2007) Uluslararası İslami Fiqh Akademisi'nin toplu kararı. İrtifak hakkı, başka bir mülkteki mülk için kurulan ve abone olmaya uygun olan her şey ile miras kalan türlerin sayısı olarak tanımlanır: içme hakkı (suyun ekin ve hayvanların sulanması veya iki mülk arasında su transferi için kullanılması), su hakkı (fazla veya kullanılamaz suyun yüksek arazilerden fayda sağlayan araziye veya kamu giderine akışı), geçiş hakkı (arazinin bitişik araziye geçiş hakkı) ve yüksek mülk hakkı (üst binanın başkalarına ait alt arazide sağlamlığı). Ortaya çıkma nedenlerini sıraladı: mülk sahibinin değişim veya bağış yoluyla izni, zorunluluk, ölü arazinin yeniden canlandırılması, komşuluk ve ortak mülkler; modern ve geçerli nedenlerle kapının açık olması, ancak metinlere ve kurallara aykırı değilse (elektrik kabloları ve kanalizasyon borularının uzatılması gibi). Kuralı koydu: ilke, faydaların kabul edilebilir olduğu, zararların yasaktır; özel su rezervlerinin yalnızca zorunluluk nedeniyle ve eşdeğer bir bedelle ödendiği; mülk ve çiftlikler için içme, prosedürler ve sulama irtifakını gelenekle (boru işlemlerinin fabrikalara ve drenaj geçişi zararsız dahil) ve sahibine tazminatla veya tazminatsız elden çıkarılma imtiyaz hakkını belirledi; ve çağdaş irtifak haklarını (kamu hizmeti geçişi: iletişim, elektrik, su, gaz, kanalizasyon ve merkezi klima) onayladı ve özel otoparkların izin verilen mülke uygun olduğunu belirtti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sidang kedelapan belas di Putrajaya (24–29 Jumada al-Akhirah 1428 H, 9–14 Juli 2007 M). Hak hak hak milik didefinisikan sebagai segala sesuatu yang ditetapkan untuk suatu properti di properti lain yang memenuhi syarat untuk diterima, dan jumlah jenis warisan: hak minum (penggunaan air untuk mengairi tanaman dan hewan atau memindahkannya antara dua properti), hak atas air (aliran kelebihan atau tidak dapat digunakan dari tanah yang lebih tinggi ke tanah yang menguntungkan atau ke saluran pembuangan umum), hak untuk melewati (hak untuk melewati tanah ke tanah yang berdekatan), dan hak atas tall (stabilitas bangunan atas di tanah bawah milik orang lain). Ia mencantumkan alasan munculnya: izin pemilik melalui pertukaran atau donasi, kebutuhan, pemulihan tanah mati, lingkungan sekitar, dan properti bersama, dengan pintu terbuka untuk alasan modern dan sah kecuali bertentangan dengan teks dan aturan (seperti memperpanjang kabel listrik dan pipa pembuangan). Ia menetapkan aturan: prinsipnya adalah manfaat diperbolehkan dan kerugian dilarang; cadangan air pribadi hanya harus dibayar jika kebutuhan dan dengan harga setara; menetapkan hak minum, prosedur, dan irigasi untuk properti dan pertanian melalui bea cukai (termasuk jalur pipa ke pabrik dan drainase tanpa kerugian), serta hak konsesi kepada pemiliknya untuk dijual dengan atau tanpa kompensasi; dan menyetujui hak guna kontemporer (jalur layanan publik berarti: komunikasi, listrik, air, gas, limbah, dan pendingin udara sentral), serta area parkir pribadi mengikuti properti spesifik yang diperbolehkan berdiri di sini."
