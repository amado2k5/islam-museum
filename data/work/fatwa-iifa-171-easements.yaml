id: work/fatwa-iifa-171-easements
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 171 (18/9) بشأن حقوق الارتفاق وتطبيقاته المعاصرة في الأملاك المشتركة", en: "IIFA resolution 171 (18/9) on easement rights and their contemporary applications in shared property", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 171 (18/9): حقوقِ ارتفاق اور مشترک املاک میں ان کے عصری اطلاقات", es: "Resolución 171 (18/9) de la IIFA sobre los derechos de servidumbre y sus aplicaciones contemporáneas en la propiedad compartida." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف حق الارتفاق بكل ما ثبت لعقار على عقار آخر من الأمور المنتفع بها مما يقبل الاشتراك، وعدّد أصنافه الموروثة: حق الشرب ⁦(نوبة الانتفاع بالماء لسقي الزرع والحيوانات أو إجرائه بين عقارين)⁩، وحق المسيل ⁦(إسالة الفائض أو غير الصالح من الأرض المرتفعة إلى المرتفق بها أو إلى مصرف عام)⁩، وحق المرور ⁦(ثبوت المرور لأرض على أرض مجاورة)⁩، وحق التعلي ⁦(استقرار البناء الأعلى على الأسفل المملوك لغيره)⁩. وعدّد أسباب نشوئه: إذن المالك معاوضة أو تبرعًا، والضرورة، وإحياء الموات، والجوار والأملاك المشتركة، مع فتح الباب لأسباب حديثة معتبرة ما لم تخالف النصوص والقواعد ⁦(كتمديد أسلاك الكهرباء وأنابيب الصرف)⁩. وأرسى قاعدة: الأصل في المنافع الحل وفي المضار التحريم، والمياه الخاصة المحرزة لا تستحق إلا للضرورة وبثمن المثل؛ وثبت ارتفاق الشرب والإجراء والمسيل للعقار والمزارع بالعرف ⁦(ومنه إمرار الأنابيب للمصانع والصرف بلا إضرار)⁩، وحق التعلي لصاحبه يتصرف فيه بعوض وبدونه؛ وأقر الارتفاقات المعاصرة ⁦(إمرار وسائل الخدمات العامة: الاتصال والكهرباء والماء والغاز والصرف والتكييف المركزي)⁩ وأن المواقف الخاصة تتبع العين التي أبيح الوقوف من أجلها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined easement rights as whatever beneficial entitlement capable of being shared is established for one property over another, and listed the inherited kinds: the right of shurb (turns in using water for crops and animals or conducting it between properties), masil (draining surplus or unusable water from higher land to the burdened land or a public drain), passage (one land's right to pass over a neighbouring one), and elevation (an upper structure resting on another's lower structure). Causes of creation: the owner's permission by exchange or gift; necessity; revival of dead land; and neighbourhood and shared property — leaving room for new legally recognised causes not contrary to the texts and general rules (such as running power lines and drainage pipes). Its baseline rule: benefits are in principle free, harms prohibited, and privately held waters are claimable only on necessity at equivalent price; easements of drinking water, conduction and drainage attach to property and farms by custom (including running factory and sewerage pipes without harm); the elevation right-holder may dispose of it with or without compensation; contemporary easements (routing public utilities — communications, electricity, water, gas, sewerage, central air conditioning) are recognised; and private parking follows the property for which standing was permitted."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے حقِ ارتفاق کی تعریف کی: ایک جائیداد کے لیے دوسری جائیداد پر وہ فائدہ مند چیز جو اشتراک کے قابل ہو۔ وراثت میں آنے والی اقسام: حقِ شرب ⁦(فصل اور جانوروں کے لیے پانی کی نوبت یا دو جائیدادوں کے درمیان پانی بہانا)⁩، حقِ مسیل ⁦(زائد یا ناقابلِ استعمال پانی اونچی زمین سے ذمہ دار زمین یا عوامی نالے میں بہانا)⁩، حقِ مرور ⁦(ایک زمین کے لیے ہمسائی زمین سے گزرنا)⁩، اور حقِ تعلا ⁦(اوپر کی تعمیر کا دوسرے کے نچلے حصے پر ٹکنا)⁩۔ اس کے اسباب: مالک کی اجازت معاوضے یا تبرع سے؛ ضرورت؛ موات کی آبادکاری؛ اور ہمسائیگی و مشترک جائیداد — ساتھ ہی ان جدید اسباب کے لیے راستہ جو نصوص و قواعد سے نہ ٹکرائیں ⁦(بجلی کے تار اور نکاسی کے پائپ)⁩۔ بنیادی قاعدہ: منافع میں اصل حل ہے اور مضار میں حرمت؛ محرز نجی پانی صرف ضرورت پر مثل کی قیمت سے مستحق؛ شرب، اجرا اور مسیل کے ارتفاق جائیداد اور کھیتوں سے عرف کے مطابق قائم ⁦(کارخانوں اور گٹر کے پائپ بلا ضرر)⁩؛ تعلا کے مستحق کو معاوضے کے ساتھ یا بغیر اس کا تصرف؛ عصری ارتفاقات ⁦(عوامی سہولتوں کا گزرنا: مواصلات، بجلی، پانی، گیس، گٹر، مرکزی ایئر کنڈیشننگ)⁩ تسلیم؛ اور نجی پارکنگ اس جائیداد کی تابع جس کے لیے کھڑا ہونے کی اجازت تھی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Definió los derechos de servidumbre como cualquier derecho beneficioso susceptible de ser compartido que se establece para una propiedad sobre otra, y enumeró los tipos heredados: el derecho de shurb (turnos en el uso del agua para cultivos y animales o su conducción entre propiedades), masil (drenaje del agua sobrante o no utilizable de terrenos más altos hacia terrenos gravados o un desagüe público), paso (derecho de un terreno a pasar sobre uno vecino) y elevación (una estructura superior que descansa sobre la estructura inferior de otra). Causas de creación: el permiso del propietario por intercambio o donación; necesidad; recuperación de terrenos baldíos; y vecindad y propiedad compartida, dejando espacio para nuevas causas legalmente reconocidas que no contravengan los textos y las reglas generales (como el tendido de líneas eléctricas y tuberías de drenaje). Su regla básica establece que, en principio, los beneficios son gratuitos, los daños están prohibidos y las aguas de propiedad privada solo se pueden reclamar por necesidad a un precio equivalente; las servidumbres de agua potable, conducción y drenaje se vinculan a propiedades y granjas por costumbre (incluidas las tuberías de fábricas y alcantarillado que no causan daño); el titular del derecho de elevación puede disponer de él con o sin compensación; se reconocen las servidumbres contemporáneas (para el enrutamiento de servicios públicos: comunicaciones, electricidad, agua, gas, alcantarillado, aire acondicionado central); y el estacionamiento privado sigue a la propiedad para la cual se permitió el estacionamiento."
