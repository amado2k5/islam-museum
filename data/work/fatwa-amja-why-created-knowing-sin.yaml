id: work/fatwa-amja-why-created-knowing-sin
class: work
kind: fatwa
label: { ar: "لم خلقني الله وهو يعلم أني سأعمل السيئات", en: "Why did God create me knowing I would sin", ur: "اللہ نے مجھے کیوں بنایا جب وہ جانتا تھا میں گناہ کروں گا" }
summary:
  ar: "سأل سائل لماذا خلقه الله وهو يعلم أنه سيعمل السيئات ومصيره النار ألا يتناقض مع رحمته التي وسعت كل شيء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77963 بتاريخ 25 فبراير 2009)⁩ أن علم الله صفة تنكشف بها الأشياء والله لا يحاسب عباده على مقتضى علمه بهم بل على مقتضى ما يظهر من أعمالهم، والذين يطرحون هذا السؤال يسوون بين أعمال العباد الاضطرارية وأعمالهم الاختيارية وهذا مكابرة للعيان فيساوون بين حركة المرتعش من الحمى وحركة الجسد الاختيارية إلى الفاحشة، وإن الله وهب عباده أدوات التكليف والمسؤولية السمع والبصر والفؤاد وحاسبهم بمقتضاها ولو سلب شيئًا منها لأسقط من التكليف بقدره، ويبقى أن أهل الجنة ميسرون لأعمال أهل الجنة وأهل النار ميسرون لأعمال أهل النار على ما فصّل."
  en: "A questioner asked why God created him knowing he would work evils and end in the Fire — does that not contradict mercy embracing all things? Dr. Salah al-Sawi (fatwa no. 77963, 25 February 2009) answered that God's knowledge is an attribute that discloses things; God does not reckon His servants by what He knows of them but by the deeds they actually show; the askers of this question equate the compelled and the voluntary deeds of servants — plain stubbornness, like equating the feverish shiver with the body's chosen movement toward obscenity; God gave His servants the tools of responsibility — hearing, sight and heart — and reckons them thereby, and had He taken any away He would have dropped the charge to its measure; and the people of Paradise remain eased to the deeds of Paradise's people and the people of the Fire to the Fire's deeds, as detailed."
  ur: "ایک سائل نے پوچھا کہ اللہ نے کیوں پیدا کیا جب وہ جانتا تھا کہ وہ گناہ کرے گا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77963، 25 فروری 2009)⁩ کے مطابق اللہ کا علم اور بندے کا اختیاری عمل الگ ہیں — بندے کو سمع بصر فؤاد دیا گیا ہے اور حساب انہی اعمال کا ہے۔"
