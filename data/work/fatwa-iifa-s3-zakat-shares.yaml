summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩ بشأن زكاة الأسهم في الشركات: قرر تأجيل إصدار القرار الخاص به إلى الدورة الرابعة ⁦(انظر لاحقًا القرار 28 (4/3))⁩."
  en: "IIFA's third-session resolution (Amman, October 1986) on the zakat of company shares: it deferred issuing the resolution to the fourth session — later resolved in 28 (4/3)."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩ کمپنیوں کے حصص کی زکوٰۃ پر: فیصلہ چوتھی مجلس تک مؤخر ⁦(بعد ازاں قرارداد 28 (4/3))⁩۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986) sobre el zakat de las acciones de las empresas: aplazó la emisión de la resolución a la cuarta sesión, que posteriormente se resolvió en 28 (4/3)."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986) sur la zakat des actions de sociétés: elle a reporté la publication de la résolution à la quatrième session — résolue plus tard dans 28 (4/3)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986) şirket hisselerine ilişkin zekatla ilgili karar: kararının verilmesinin dördüncü oturuma ertelenmesine karar verildi (bkz. daha sonraki Karar 28 (4/3))."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiganya (Amman, Oktober 1986) mengenai zakat atas saham perusahaan: memutuskan untuk menunda penerbitan keputusannya ke sesi keempat (lihat Keputusan 28 (4/3))."
