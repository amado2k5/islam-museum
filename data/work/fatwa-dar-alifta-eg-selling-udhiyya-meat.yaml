id: work/fatwa-dar-alifta-eg-selling-udhiyya-meat
class: work
kind: fatwa
label: { ar: "حكم بيع لحوم الأضاحي", en: "Selling the meat of udhiyya sacrifices", ur: "قربانی کے گوشت کا بیچنا", es: "Venta de la carne de los sacrificios udhiyya", fr: "Vente de la viande des sacrifices d'udhiyya" }
summary:
  ar: "سائل سأل عن بيع لحوم الأضاحي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21932)⁩ أنه لا يجوز للمضحي بيع شيء من لحوم الأضاحي مطلقًا ولا إعطاء الجزار منها على سبيل الأجرة لكن له أكلها والإهداء والتصدق بها على ما فصّل الجواب."
  en: "A questioner asked about selling the meat of the udhiyya sacrifices. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21932) answered that the sacrificer may not sell any of the meat at all, nor give the butcher any of it as a wage — but he may eat of it, gift it, and give it in charity, as the answer details."
  ur: "ایک سائل نے قربانی کے گوشت بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21932)⁩ نے جواب دیا کہ قربانی کرنے والا گوشت کا کوئی حصہ ہرگز نہیں بیچ سکتا اور نہ قصاب کو اجرت کے طور پر دے سکتا ہے؛ البتہ وہ اسے خود کھا سکتا ہے، ہدیہ کر سکتا ہے اور صدقہ کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la venta de la carne de los sacrificios udhiyya. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21932) respondió que el sacrificador no puede vender nada de la carne, ni darle nada al carnicero como salario, pero sí puede comerla, regalarla y darla en caridad, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la vente de la viande des sacrifices rituels (udhiyya). La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21932) a répondu que le sacrificateur ne peut ni vendre la viande, ni la verser au boucher à titre de salaire; il peut toutefois la consommer, l'offrir ou en faire l'aumône, comme le précise la réponse."
