id: work/fatwa-dar-alifta-eg-hajj-of-one-who-died-after-arafa
class: work
kind: fatwa
label: { ar: "حكم حج من أحرم ثم مات بعد الوقوف بعرفة", en: "The Hajj of one who died after standing at Arafat", ur: "عرفہ کے وقوف کے بعد فوت ہونے والے کا حج", es: "El Hajj de alguien que murió después de estar en Arafat." }
summary:
  ar: "سائل سأل عن حج من أحرم ثم مات بعد الوقوف بعرفة قبل إتمام باقي الأعمال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20750)⁩ أن إحرامه قد انقطع بموته ولا يكمل أحد الحج عنه على ما فصّل الجواب."
  en: "A questioner asked about the Hajj of one who entered ihram then died after standing at Arafat before completing the rites. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20750) answered that his ihram was cut off by death and no one completes the Hajj for him — as the answer details."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جو احرام باندھ کر عرفہ کے وقوف کے بعد فوت ہو گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20750)⁩ نے جواب دیا کہ موت سے اس کا احرام منقطع ہو گیا اور کوئی اس کے لیے حج مکمل نہیں کرتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el Hajj de una persona que entró en estado de ihram y falleció tras permanecer en Arafat antes de completar los ritos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20750) respondió que su ihram se interrumpió por la muerte y que nadie completa el Hajj por él, como se detalla en la respuesta."
