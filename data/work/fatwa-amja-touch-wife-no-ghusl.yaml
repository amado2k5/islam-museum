id: work/fatwa-amja-touch-wife-no-ghusl
class: work
kind: fatwa
label: { ar: "المس دون إنزال", en: "Touching without emission — when the washing binds", ur: "بغیر انزال چھونا — غسل", es: "Tocar sin emitir — cuando el lavado une", fr: "Toucher sans émission — lorsque le lavage lie", tr: "Düşmeden dokun", id: "Sentuh tanpa jatuh" }
summary:
  ar: "سأل سائل هل إذا لمس رجل امرأة في فرجها ولم ينزلا السائل يجب عليهما الغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78757 بتاريخ 5 مايو 2009)⁩ أن غسل الجنابة يجب بأحد أمرين: إدخال حشفة الذكر في الفرج وإن لم ينزل المني لما روى الشيخان عن أبي هريرة، ونزول المني ولو من غير إيلاج، فما كان دون ذلك من المس فإنه لا يوجب الغسل وإن كان ينقض الوضوء على ما فصّل الجواب."
  en: "A questioner asked whether a man's touching a woman's private part, neither emitting, obliges them the washing. Dr. Salah al-Sawi (fatwa no. 78757, 5 May 2009) answered that the janaba-washing binds on one of two things: the glans' entering the part even without emission — per the two Shaykhs' report from Abu Hurayra — and semen's descending even without entry; what lies short of that, as touching, obliges no washing though it breaks the wudu — as the answer details."
  ur: "بغیر انزال چھونے سے غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78757، 5 مئی 2009)⁩ کے مطابق دخول یا انزال پر غسل واجب؛ محض چھونا وضو توڑتا ہے۔"
  es: "Un consultante preguntó si el contacto de un hombre con la parte íntima de una mujer, sin que esta emita semen, los obliga a realizar el lavado ritual. El Dr. Salah al-Sawi (fatwa n.° 78757, 5 de mayo de 2009) respondió que el lavado ritual (janaba) se basa en dos cosas: la entrada del glande en la parte íntima incluso sin emisión —según el informe de los dos jeques de Abu Hurayra— y el descenso del semen incluso sin entrada. Lo que no llega a ser eso, como el contacto físico, no obliga al lavado ritual, aunque invalida la ablución (wudu), como se detalla en la respuesta."
  fr: "Un internaute a demandé si le fait pour un homme de toucher les parties intimes d'une femme, sans éjaculation, les obligeait à se purifier. Le Dr Salah al-Sawi (fatwa n° 78757, 5 mai 2009) a répondu que la purification de la janaba (ablution rituelle) est obligatoire dans deux cas: soit la pénétration du gland, même sans éjaculation (conformément au hadith rapporté par les deux cheikhs d'après Abou Hourayra), soit la descente du sperme, même sans pénétration. En dehors de ces deux cas, le simple fait de toucher les parties intimes n'oblige pas à se purifier, bien qu'il invalide les ablutions (wudu), comme le précise la réponse."
  tr: "Bir soru soran kişi, bir erkek kadının özel bölgelerine dokunup cinsel ilişki inmezse, gusl yapmak zorunda mı olduğunu sordu. Dr. Salah Al-Sawi (5 Mayıs 2009 tarihli 78757 sayılı fetva) büyük kirlilik için ghusl'un iki şeyden biriyle gerekli olduğunu yanıtladı: Abu Huraira'dan iki şeyhin anlattığı gibi, meni boşalmasa bile erkek başının vajinaya yerleştirilmesi ve penetrasyon olmadan boşalma. Dokunmaktan daha azı gusl gerektirmez, hatta avdesti geçersiz kılsa bile, cevapta açıklandığı gibi."
  id: "Seorang penanya bertanya apakah, jika seorang pria menyentuh bagian pribadi wanita dan hubungan seksual tidak turun, mereka harus melakukan ghusl. Dr. Salah Al-Sawi menjawab (Fatwa No. 78757 tanggal 5 Mei 2009) bahwa ghusl untuk kotoran besar diperlukan oleh salah satu dari dua hal: memasukkan kepala kepala pria ke dalam vagina meskipun tidak ada sperma yang keluar, seperti yang diceritakan oleh dua Shaykh dari Abu Huraira, dan ejakulasi bahkan tanpa penetrasi. Apa pun yang kurang dari sentuhan tidak memerlukan ghusl, meskipun membatalkan wuduhan, seperti yang dijelaskan dalam jawaban."
