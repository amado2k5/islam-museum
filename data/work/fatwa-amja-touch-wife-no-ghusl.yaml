id: work/fatwa-amja-touch-wife-no-ghusl
class: work
kind: fatwa
label: { ar: "المس دون إنزال", en: "Touching without emission — when the washing binds", ur: "بغیر انزال چھونا — غسل", es: "Tocar sin emitir — cuando el lavado une" }
summary:
  ar: "سأل سائل هل إذا لمس رجل امرأة في فرجها ولم ينزلا السائل يجب عليهما الغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78757 بتاريخ 5 مايو 2009)⁩ أن غسل الجنابة يجب بأحد أمرين: إدخال حشفة الذكر في الفرج وإن لم ينزل المني لما روى الشيخان عن أبي هريرة، ونزول المني ولو من غير إيلاج، فما كان دون ذلك من المس فإنه لا يوجب الغسل وإن كان ينقض الوضوء على ما فصّل الجواب."
  en: "A questioner asked whether a man's touching a woman's private part, neither emitting, obliges them the washing. Dr. Salah al-Sawi (fatwa no. 78757, 5 May 2009) answered that the janaba-washing binds on one of two things: the glans' entering the part even without emission — per the two Shaykhs' report from Abu Hurayra — and semen's descending even without entry; what lies short of that, as touching, obliges no washing though it breaks the wudu — as the answer details."
  ur: "بغیر انزال چھونے سے غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78757، 5 مئی 2009)⁩ کے مطابق دخول یا انزال پر غسل واجب؛ محض چھونا وضو توڑتا ہے۔"
  es: "Un consultante preguntó si el contacto de un hombre con la parte íntima de una mujer, sin que esta emita semen, los obliga a realizar el lavado ritual. El Dr. Salah al-Sawi (fatwa n.° 78757, 5 de mayo de 2009) respondió que el lavado ritual (janaba) se basa en dos cosas: la entrada del glande en la parte íntima incluso sin emisión —según el informe de los dos jeques de Abu Hurayra— y el descenso del semen incluso sin entrada. Lo que no llega a ser eso, como el contacto físico, no obliga al lavado ritual, aunque invalida la ablución (wudu), como se detalla en la respuesta."
