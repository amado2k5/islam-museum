id: work/fatwa-dar-alifta-eg-rent-of-sold-property
class: work
kind: fatwa
label: { ar: "حكم استحقاق أجرة العقار بعد بيعه للمشتري", en: "Who is entitled to the rent after the property is sold?", ur: "بیچی گئی جائداد کا کرایہ کس کا حق ہے", es: "¿Quién tiene derecho al alquiler una vez vendida la propiedad?", fr: "Qui a droit au loyer après la vente du bien ?", tr: "Mülkü alıcıya sattıktan sonra kira hakkı hakkında karar", id: "Putusan tentang hak atas sewa properti setelah menjualnya kepada pembeli" }
summary:
  ar: "سائل سأل عن استحقاق أجرة بيت بيع وقد بقي من أجرته ثمانية أشهر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20861)⁩ أن الأصل أن الذي يستحق أجرة البيت عن مدة الثمانية أشهر الباقية هو المشتري ما دام لم يحصل اتفاق على خلاف ذلك على ما فصّل الجواب."
  en: "A questioner asked who is entitled to a house's rent for the remaining eight months after it was sold. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20861) answered that the default is the buyer, absent agreement to the contrary — as the answer details."
  ur: "ایک سائل نے پوچھا کہ مکان بیچنے کے بعد باقی آٹھ مہینوں کا کرایہ کس کا حق ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20861)⁩ نے جواب دیا کہ اصول یہ ہے کہ خریدار کا حق ہے جب تک کہ خلاف اتفاق نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó quién tiene derecho al alquiler de una vivienda durante los ocho meses restantes después de su venta. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20861) respondió que, salvo acuerdo en contrario, el comprador es el titular del derecho."
  fr: "Une personne a demandé qui a droit au loyer d'une maison pour les huit mois restants après sa vente. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20861) a répondu que, sauf accord contraire, c'est l'acheteur qui en a droit, comme le précise la réponse."
  tr: "Bir soru soran, sekiz ay kira süresi kaldığında satılan bir evin kira hakkı hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20861), yanıtlamıştır ki, alıcının kalan sekiz ay için kira hakkı vardır, aksi yönde bir anlaşmaya varılamadığı sürece, yanıtta detaylandırıldığı gibi."
  id: "Seorang penanya menanyakan tentang hak atas sewa rumah yang dijual ketika masih ada delapan bulan sewa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20861) menjawab bahwa default adalah pembeli berhak atas sewa untuk delapan bulan tersisa, selama tidak ada kesepakatan yang bertentangan seperti yang dijelaskan dalam jawaban."
