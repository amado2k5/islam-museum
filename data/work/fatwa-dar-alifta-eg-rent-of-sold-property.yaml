id: work/fatwa-dar-alifta-eg-rent-of-sold-property
class: work
kind: fatwa
label: { ar: "حكم استحقاق أجرة العقار بعد بيعه للمشتري", en: "Who is entitled to the rent after the property is sold?", ur: "بیچی گئی جائداد کا کرایہ کس کا حق ہے" }
summary:
  ar: "سائل سأل عن استحقاق أجرة بيت بيع وقد بقي من أجرته ثمانية أشهر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20861)⁩ أن الأصل أن الذي يستحق أجرة البيت عن مدة الثمانية أشهر الباقية هو المشتري ما دام لم يحصل اتفاق على خلاف ذلك على ما فصّل الجواب."
  en: "A questioner asked who is entitled to a house's rent for the remaining eight months after it was sold. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20861) answered that the default is the buyer, absent agreement to the contrary — as the answer details."
  ur: "ایک سائل نے پوچھا کہ مکان بیچنے کے بعد باقی آٹھ مہینوں کا کرایہ کس کا حق ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20861)⁩ نے جواب دیا کہ اصول یہ ہے کہ خریدار کا حق ہے جب تک کہ خلاف اتفاق نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
