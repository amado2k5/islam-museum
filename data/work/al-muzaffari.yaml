summary:
  ar: "تأليف المظفر بن الأفطس ملك بطليوس المسمى بالمظفري في نحو الخمسين مجلداً، ووصفه في موضع آخر بأنه التصنيف الرائق والتأليف الفائق المترجم بالتذكر المظفري خمسون مجلداً اشتمل على فنون وعلوم من مغاز وسير ومثل وخبر وجميع علوم الأدب {cite:nafh-tib-maqqari p. 470,478}."
  en: "The al-Muzaffari — the nearly fifty-volume encyclopedic compilation of al-Muzaffar ibn al-Aftas, scholar-king of Badajoz {cite:nafh-tib-maqqari p. 478}."
  es: "El al-Muzaffari: la recopilación enciclopédica de casi cincuenta volúmenes de al-Muzaffar ibn al-Aftas, rey erudito de Badajoz {citar:nafh-tib-maqqari p. 478}."
  fr: "L'al-Muzaffari — la compilation encyclopédique de près de cinquante volumes d'al-Muzaffar ibn al-Aftas, roi-érudit de Badajoz {cite:nafh-tib-maqqari p. 478}."
  ur: "المظفری - بادجوز کے عالم بادشاہ المظفر ابن الفطاس کی تقریباً پچاس جلدوں پر مشتمل انسائیکلوپیڈک تالیف۔ 478}۔"
  tr: "Bedec kralı Al-Muzaffer ibn al-Aftas, al-Muzaffari olarak bilinir, yaklaşık elli cilt halinde yazılmış ve başka yerlerde Al-Muzaffari'nin anısına çevrilmiş seçkin bir derleme ve olağanüstü bir eser olarak tanımlanmıştır. Şiir, biyografiler, atasözleri ve tüm edebi bilimler gibi sanat ve bilimleri kapsayan elli ciltten oluşur {cite:nafh-tib-maqqari, s. 470, 478}."
  id: "Al-Muzaffar ibn al-Aftas, raja Badaj, yang dikenal sebagai al-Muzaffari, disusun dalam sekitar lima puluh jilid, dan digambarkan di tempat lain sebagai kompilasi yang halus dan karya luar biasa yang diterjemahkan dengan kenangan Al-Muzaffari. Buku ini terdiri dari lima puluh jilid yang mencakup seni dan ilmu pengetahuan seperti puisi, biografi, perihasa, dan semua ilmu sastra {cite:nafh-tib-maqqari, hlm. 470, 478}."
