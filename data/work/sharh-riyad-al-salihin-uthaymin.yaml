summary:
  ar: "«شرح رياض الصالحين» للشيخ محمد بن صالح العثيمين: شرح على «رياض الصالحين» للنووي، يتتبع الأحاديث بمعانيها وفوائدها، وهذا المجلد الخامس يشرح كتاب الصلاة والصيام وبداية الحج. {cite:uthaymin-sharh-riyad-vol5 p. 39}"
  en: "Muhammad ibn Salih al-Uthaymin's commentary on al-Nawawi's Riyad al-salihin. It takes each hadith in turn for its meaning and lessons. Volume five covers prayer, fasting and the opening of pilgrimage. {cite:uthaymin-sharh-riyad-vol5 p. 39}"
  es: "Comentario de Muhammad ibn Salih al-Uthaymin sobre el Riyad al-salihin de al-Nawawi. Analiza cada hadiz por separado, distinguiendo su significado y enseñanzas. El volumen cinco trata sobre la oración, el ayuno y el inicio de la peregrinación. {cite:uthaymin-sharh-riyad-vol5 p. 39}"
  fr: "Commentaire de Muhammad ibn Salih al-Uthaymin sur le Riyad al-salihin d'al-Nawawi. Il analyse chaque hadith en détail, en expliquant son sens et ses enseignements. Le cinquième volume traite de la prière, du jeûne et du début du pèlerinage. {cite:uthaymin-sharh-riyad-vol5 p. 39}"
  ur: "محمد بن صالح العثیمین کی تفسیر النووی کی ریاض الصالحین۔ یہ ہر حدیث کو اس کے معنی اور اسباق کے بدلے لیتا ہے۔ پانچویں جلد میں نماز، روزہ اور حج کے آغاز کا احاطہ کیا گیا ہے۔ {حوالہ: اثیمین شرح ریاض جلد 5 صفحہ 39}"
  tr: "\"Şerh Riyad el-Salihin\" Şeyh Muhammed bin Salih el-Uthaymin'den: El-Nevavi'nin \"Riyad el-Salihin\" üzerine bir tefsir, hadisleri anlamları ve faydalarıyla izler. Bu beşinci cilt, Namaz Kitabı, Oruç ve Hac başlangıcını açıklar. {Kaynak:Uthaymin-Şerh-Riyad-cilt 5 s. 39}"
  id: "\"Sharh Riyadh al-Salihin\" oleh Sheikh Muhammad bin Salih al-Uthaymeen: Komentar atas \"Riyadh al-Salihin\" oleh al-Nawawi, menelusuri hadis beserta makna dan manfaatnya. Jilid kelima ini menjelaskan Kitab Doa, Puasa, dan awal Haji. {cite:uthaymin-sharh-riyad-vol5 hlm. 39}"
