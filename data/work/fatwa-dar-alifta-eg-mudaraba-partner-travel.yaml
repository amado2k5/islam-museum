id: work/fatwa-dar-alifta-eg-mudaraba-partner-travel
class: work
kind: fatwa
label: { ar: "حكم سفر المضارب بمال المضاربة", en: "The working partner travelling with mudaraba capital", ur: "مضارب کا مضاربہ کی رقم لے کر سفر کرنا" }
summary:
  ar: "سائل سأل عن سفر المضارب ⁦(ابن عمه)⁩ بمال المضاربة إلى مدينة ساحلية لاستثماره فيها في فترة الصيف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22108)⁩ أنه لا مانع من سفر المضارب لاستثمار المال سواء أكان السفر بعلم صاحب المال أم لا على ما فصّل الجواب من شروط المضاربة."
  en: "A questioner asked about the working partner (his cousin) travelling with mudaraba capital to a coastal city to invest it over the summer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22108) answered that nothing bars the working partner's travelling to invest the capital — whether or not the capital owner knows — under the mudaraba conditions the answer details."
  ur: "ایک سائل نے اپنے چچا زاد کے مضاربہ کی رقم لے کر ساحلی شہر میں سفر کر کے سرمایہ کاری کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22108)⁩ نے جواب دیا کہ مضارب کے سرمایہ کاری کے لیے سفر کرنے میں کوئی مانع نہیں — خواہ مالک کو علم ہو یا نہ ہو — جواب کے بیان کردہ مضاربہ کی شرائط کے مطابق۔"
