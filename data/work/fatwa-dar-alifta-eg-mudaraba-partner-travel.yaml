id: work/fatwa-dar-alifta-eg-mudaraba-partner-travel
class: work
kind: fatwa
label: { ar: "حكم سفر المضارب بمال المضاربة", en: "The working partner travelling with mudaraba capital", ur: "مضارب کا مضاربہ کی رقم لے کر سفر کرنا", es: "El socio colaborador que viaja con el capital de mudaraba", fr: "Le partenaire de travail voyageant avec le capital de mudaraba" }
summary:
  ar: "سائل سأل عن سفر المضارب ⁦(ابن عمه)⁩ بمال المضاربة إلى مدينة ساحلية لاستثماره فيها في فترة الصيف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22108)⁩ أنه لا مانع من سفر المضارب لاستثمار المال سواء أكان السفر بعلم صاحب المال أم لا على ما فصّل الجواب من شروط المضاربة."
  en: "A questioner asked about the working partner (his cousin) travelling with mudaraba capital to a coastal city to invest it over the summer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22108) answered that nothing bars the working partner's travelling to invest the capital — whether or not the capital owner knows — under the mudaraba conditions the answer details."
  ur: "ایک سائل نے اپنے چچا زاد کے مضاربہ کی رقم لے کر ساحلی شہر میں سفر کر کے سرمایہ کاری کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22108)⁩ نے جواب دیا کہ مضارب کے سرمایہ کاری کے لیے سفر کرنے میں کوئی مانع نہیں — خواہ مالک کو علم ہو یا نہ ہو — جواب کے بیان کردہ مضاربہ کی شرائط کے مطابق۔"
  es: "Un consultante preguntó sobre la posibilidad de que su socio (su primo) viajara con el capital de la mudaraba a una ciudad costera para invertirlo durante el verano. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22108) respondió que nada impide que el socio viaje para invertir el capital, independientemente de si el propietario del capital lo sabe o no, según las condiciones de la mudaraba que detalla la respuesta."
  fr: "Un interlocuteur a posé une question concernant le déplacement, durant l'été, du partenaire actif (son cousin) vers une ville côtière avec des capitaux issus de la mudaraba afin de les investir. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22108) a répondu que rien n'empêche le partenaire actif de voyager pour investir les capitaux – que le propriétaire des capitaux en soit informé ou non – dans le cadre des conditions de la mudaraba détaillées dans la réponse."
