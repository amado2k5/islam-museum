summary:
  ar: "كتاب في طب العيون منسوب إلى حنين بن إسحاق ⁦(ت 259هـ/873م)⁩، في عشر مقالات تغطي بنية العين والدماغ والنظر وأسباب أمراضها وأعراضها وعلاجها؛ ترجم هذا النص ضمن ما يعرف بترجمة Demetrio اللاتينية وكتاب قسطنطين الإفريقي في العيون، وبقي في نسختين مخطوطتين فقط يطابق بينهما مايرهوف سنة 1928."
  en: "A book on ophthalmology ascribed to Hunayn ibn Ishaq (d. 259 AH/873 CE), in ten treatises covering the structure of the eye, the brain, vision, the causes and symptoms of eye diseases, and their remedies; the text survives in only two known manuscripts collated by Meyerhof in 1928 and passed to Latin readers through translations known under Demetrio's and Constantinus Africanus's names."
  ur: "حنین بن اسحاق ⁦(وفات 259ھ/873ء)⁩ کو منسوب طبِ العین کی کتاب، دس مقالات میں: ساختِ چشم، دماغ، بینائی، چشم کی بیماریوں کے اسباب و علامات اور علاج؛ متن صرف دو معلوم مخطوطوں میں بچا اور مائرہوف نے 1928ء میں ملاپ کیا، اور یہ لاطینی ترجموں کے ذریعے گی summons پر پہنچا۔"
