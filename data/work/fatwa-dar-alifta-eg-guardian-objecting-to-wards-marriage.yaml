id: work/fatwa-dar-alifta-eg-guardian-objecting-to-wards-marriage
class: work
kind: fatwa
label: { ar: "حق الكافل في الاعتراض على زواج مكفولته التي تزوجت بغير ولي لها", en: "A sponsor's right to object to his ward's marriage without a guardian", ur: "کفیل کا اپنے تحت کفالت لڑکی کی بغیر ولی شادی پر اعتراض" }
summary:
  ar: "سائل سأل عن حق الكافل في الاعتراض على زواج مكفولته التي تزوجت بغير ولي لها بمهر أقل من مهر مثلها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20673)⁩ أنه يحق للكافل أن يعترض على زواج مكفولته التي تزوجت على مهر أقل من مهر مثلها بما لا يناسب وضعها على ما فصّل الجواب."
  en: "A questioner asked about a sponsor's right to object to his ward's marriage, contracted without a guardian, for less than a peer's dower. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20673) answered that he may object to a marriage ill-suited to her standing — as the answer details."
  ur: "ایک سائل نے کفیل کے اس حق کا حکم پوچھا کہ وہ اپنی تحت کفالت لڑکی کی بغیر ولی کم مهر والی شادی پر اعتراض کرے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20673)⁩ نے جواب دیا کہ اس کی حیثیت کے خلاف شادی پر اعتراض جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
