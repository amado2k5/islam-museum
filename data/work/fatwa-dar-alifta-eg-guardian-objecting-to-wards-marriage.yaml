id: work/fatwa-dar-alifta-eg-guardian-objecting-to-wards-marriage
class: work
kind: fatwa
label: { ar: "حق الكافل في الاعتراض على زواج مكفولته التي تزوجت بغير ولي لها", en: "A sponsor's right to object to his ward's marriage without a guardian", ur: "کفیل کا اپنے تحت کفالت لڑکی کی بغیر ولی شادی پر اعتراض", es: "Derecho del patrocinador a oponerse al matrimonio de su pupilo sin tutor.", fr: "Le droit d'un parrain de s'opposer au mariage de son pupille sans tuteur", tr: "Sponsorun, vasisi dışında biriyle evlenen sponsor kadının evliliğine itiraz etme hakkı", id: "Hak sponsor untuk menolak pernikahan wanita yang disponsori yang menikah dengan orang selain walinya" }
summary:
  ar: "سائل سأل عن حق الكافل في الاعتراض على زواج مكفولته التي تزوجت بغير ولي لها بمهر أقل من مهر مثلها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20673)⁩ أنه يحق للكافل أن يعترض على زواج مكفولته التي تزوجت على مهر أقل من مهر مثلها بما لا يناسب وضعها على ما فصّل الجواب."
  en: "A questioner asked about a sponsor's right to object to his ward's marriage, contracted without a guardian, for less than a peer's dower. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20673) answered that he may object to a marriage ill-suited to her standing — as the answer details."
  ur: "ایک سائل نے کفیل کے اس حق کا حکم پوچھا کہ وہ اپنی تحت کفالت لڑکی کی بغیر ولی کم مهر والی شادی پر اعتراض کرے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20673)⁩ نے جواب دیا کہ اس کی حیثیت کے خلاف شادی پر اعتراض جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el derecho de un patrocinador a oponerse al matrimonio de su pupila, contraído sin tutor legal y por una dote inferior a la de un par. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20673) respondió que puede oponerse a un matrimonio inadecuado para la posición social de la mujer, tal como se detalla en la respuesta."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20673) sur le droit d'un parrain de s'opposer au mariage de sa pupille, contracté sans tuteur, pour un montant inférieur à la dot d'un pair. Il a été répondu que le parrain pouvait s'opposer à un mariage indigne de la jeune fille, comme le précise la réponse."
  tr: "Bir soru soran, sponsorun vasisi olmadan eşdeğerinden daha az çeyiz karşılığında evlenen kadının evliliğine itiraz etme hakkı hakkında sorular sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20673), sponsorun, kendi çeyizinden daha az bir çeyiz karşılığında evlenen kadının, kendi durumuna uymayan bir şekilde evlenmesine itiraz etme hakkına sahip olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang hak sponsor untuk menolak pernikahan wanita yang disponsori yang menikah tanpa wali dengan mas kawin yang kurang dari yang setara dengannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20673) menjawab bahwa sponsor memiliki hak untuk menolak pernikahan wanita yang disponsori yang menikah dengan mas kawin yang kurang dari miliknya, dengan cara yang tidak sesuai dengan situasinya, seperti yang dijelaskan dalam jawaban."
