id: work/fatwa-dar-alifta-eg-partner-exclusive-profit
class: work
kind: fatwa
label: { ar: "حكم انفراد الشريك بالتربح من مال الشركة دون إذن", en: "A partner profiting alone from company property without permission", ur: "شریک کا بلا اجازت کمپنی کے مال سے منفرد منافع اٹھانا", es: "Un socio que se beneficia en solitario de los bienes de la empresa sin permiso.", fr: "Un associé qui tire profit seul des biens de l'entreprise sans autorisation" }
summary:
  ar: "سائل سأل عن انفراد أحد الشركاء بالتربح من عمل وصفة لتغذية الدواجن تابعة للشركة دون إذن باقي الشركاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21875)⁩ أن الأصل عدم جواز تصرف أحد الشركاء في مال الشركة وأعيانها إلا بإذن باقي الشركاء وبيّن الجواب حكم الربح على وجهه."
  en: "A questioner asked about one partner profiting alone from a poultry-feed formula belonging to the company without the other partners' permission. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21875) answered that the default is that no partner may dispose of the company's property and assets without the rest's consent; the answer sets out where the profit falls."
  ur: "ایک سائل نے ایک شریک کے بغیر دیگر شرکاء کی اجازت کمپنی کی مرغوں کی خوراک کی نسخہ کار فرمائی سے منفرد منافع اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21875)⁩ نے جواب دیا کہ اصول یہ ہے کہ کوئی شریک کمپنی کے مال اور اشیاء میں باقی شرکاء کی اجازت کے بغیر تصرف نہیں کر سکتا؛ منافع کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre el caso de un socio que se beneficiaba en solitario de una fórmula de alimento para aves de corral perteneciente a la empresa sin el permiso de los demás socios. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21875) respondió que, por defecto, ningún socio puede disponer de los bienes y activos de la empresa sin el consentimiento de los demás; la respuesta especifica a quién corresponde el beneficio."
  fr: "Un interlocuteur a posé une question concernant un associé qui pourrait tirer profit seul d'une formule d'aliments pour volailles appartenant à la société, sans l'autorisation des autres associés. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21875) a répondu que, par défaut, aucun associé ne peut disposer des biens et actifs de la société sans le consentement des autres; la réponse précise à qui est imputé le profit."
