id: work/fatwa-amja-intercourse-after-menses-ghusl
class: work
kind: fatwa
label: { ar: "الجماع بعد الحيض", en: "Intercourse after menses — washing first", ur: "حیض کے بعد جماع — پہلے غسل", es: "Relaciones sexuales después de la menstruación: lavarse primero", fr: "Rapports sexuels après les règles — se laver d'abord" }
summary:
  ar: "سألت امرأة أن زوجها أراد مجامعتها بعد فراغ دم الحيض قبل أن تغتسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84269 بتاريخ 21 أبريل 2011)⁩ أن جماع الحائض لا يحل إلا إذا خرجت من الحيض واغتسلت منه لقوله تعالى ويسألونك عن المحيض قل هو أذى فاعتزلوا النساء في المحيض ولا تقربوهن حتى يطهرن فإذا تطهرن فأتوهن من حيث أمركم الله إن الله يحب التوابين ويحب المتطهرين، وقوله فإذا تطهرن فأتوهن من حيث أمركم الله يدل على اشتراط الاغتسال على ما فصّل الجواب."
  en: "A woman said her husband wished intercourse after her menses' blood ended, before she washed. Dr. Salah al-Sawi (fatwa no. 84269, 21 April 2011) answered that intercourse with the menstruant is lawful only once she has left the menses and washed from it, per 'they ask you about menstruation: say, it is a hurt — keep apart from women in menstruation and draw not near till they are pure; when they have purified themselves, come to them as God commanded you; God loves the repentant and loves the purified' — 'when they have purified themselves' showing the washing is conditional, as the answer details."
  ur: "ایک خاتون نے حیض ختم کے بعد بغیر غسل جماع پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84269، 21 اپریل 2011)⁩ کے مطابق غسل شرط ہے — آیت اس پر دلالت کرتی ہے۔"
  es: "Una mujer dijo que su esposo deseaba tener relaciones sexuales después de que terminara su menstruación, antes de que ella se lavara. El Dr. Salah al-Sawi (fatwa n.° 84269, 21 de abril de 2011) respondió que las relaciones sexuales con la menstruante son lícitas solo una vez que haya terminado la menstruación y se haya lavado, según «te preguntan acerca de la menstruación: di: es una aflicción; aléjate de las mujeres menstruantes y no te acerques hasta que estén puras; cuando se hayan purificado, acércate a ellas como Dios te ha mandado; Dios ama a los arrepentidos y ama a los purificados». La expresión «cuando se hayan purificado» muestra que el lavado es condicional, como detalla la respuesta."
  fr: "Une femme a déclaré que son mari souhaitait avoir des relations sexuelles avec elle après la fin de ses menstruations, avant qu'elle ne se soit lavée. Le Dr Salah al-Sawi (fatwa n° 84269, 21 avril 2011) a répondu que les relations sexuelles avec une femme menstruée ne sont licites qu'après la fin de ses menstruations et sa purification, conformément au verset suivant: « Ils t'interrogent sur les menstruations: dis-leur que c'est une plaie. Éloigne-toi des femmes pendant leurs menstruations et ne t'approche pas d'elles tant qu'elles ne sont pas purifiées. Lorsqu'elles se sont purifiées, approche-toi d'elles, comme Dieu te l'a ordonné. Dieu aime les repentants et aime les purifiés. » – l'expression « lorsqu'elles se sont purifiées » indique que la purification est conditionnelle, comme le précise la réponse."
