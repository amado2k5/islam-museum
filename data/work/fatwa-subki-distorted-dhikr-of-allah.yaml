summary:
  ar: "سؤال عن جماعة تختلف في العمل بالسنة وتُحرّف لفظ الجلالة وكلمة التوحيد في حلقات الذكر بمدّ وتفخيم وزيادة حروف، وجواب علماء الأزهر بأن ذلك إثم يستوجب التعزير، وأن من رضي به أو استمع إليه فحكمه حكمهم."
  ur: "سوال: ایک گروہ حلقات ذکر میں اللہ کے نام اور کلمۂ توحید کو کھینچ کر، بھاری کر کے اور حروف بڑھا کر بگاڑتا ہے۔ جواب: یہ گناہ ہے جس پر تعزیر لازم ہے، اور جو اس پر راضی ہو یا سنے وہ انہی جیسا ہے۔"
  en: "A question on a group that distorts the divine name and the formula of tawhid in dhikr circles by stretching, thickening and adding letters; the Al-Azhar answer calls it sinful and deserving of discipline, and holds that whoever approves of it takes the same ruling."
