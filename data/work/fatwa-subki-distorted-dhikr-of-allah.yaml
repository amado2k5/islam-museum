class: work
kind: fatwa
label: { ar: "فتوى في تحريف لفظ الجلالة في الذكر الجماعي", en: "Fatwa on distorting the divine name in group dhikr", ur: "تحریفِ اللہ کے نام کا حلقۂ ذکر میں فتویٰ", es: "Fatwa sobre la distorsión del nombre divino en el dhikr grupal", fr: "Fatwa concernant la déformation du nom divin lors du dhikr en groupe", tr: "'Allah' kelimesinin toplu anma için çarpıtılması üzerine fetva", id: "Fatwa tentang penyelewengan kata 'Allah' dalam peringatan kolektif" }
summary:
  ar: "سؤال عن جماعة تختلف في العمل بالسنة وتُحرّف لفظ الجلالة وكلمة التوحيد في حلقات الذكر بمدّ وتفخيم وزيادة حروف، وجواب علماء الأزهر بأن ذلك إثم يستوجب التعزير، وأن من رضي به أو استمع إليه فحكمه حكمهم."
  ur: "سوال: ایک گروہ حلقات ذکر میں اللہ کے نام اور کلمۂ توحید کو کھینچ کر، بھاری کر کے اور حروف بڑھا کر بگاڑتا ہے۔ جواب: یہ گناہ ہے جس پر تعزیر لازم ہے، اور جو اس پر راضی ہو یا سنے وہ انہی جیسا ہے۔"
  en: "A question on a group that distorts the divine name and the formula of tawhid in dhikr circles by stretching, thickening and adding letters; the Al-Azhar answer calls it sinful and deserving of discipline, and holds that whoever approves of it takes the same ruling."
  es: "Una pregunta sobre un grupo que distorsiona el nombre divino y la fórmula del tawhid en los círculos de dhikr al estirar, engrosar y agregar letras; la respuesta de Al-Azhar lo llama pecaminoso y merecedor de disciplina, y sostiene que quien lo aprueba recibe la misma decisión."
  fr: "Une question porte sur un groupe qui déforme le nom divin et la formule du tawhid dans les cercles de dhikr en étirant, épaississant et ajoutant des lettres; la réponse d'Al-Azhar qualifie cela de péché et mérite une discipline, et soutient que quiconque l'approuve subit la même règle."
  tr: "Sünneti takip etmekte farklılık gösteren ve anma çevrelerinde 'Allah' kelimesi ile tek tanrıcılık sözünü uzunluk, vurgu ve harf ekleriyle çarpıtan bir grup hakkında bir soru; Ezher âlimlerinin cevabı, bunun günah olduğunu ve kimseyi kabul eden ya da dinleyen kişinin kendi hükmüdür cevabı."
  id: "Sebuah pertanyaan tentang kelompok yang berbeda dalam mengikuti Sunnah dan memutarbalikkan kata 'Allah' dan kata monoteisme dalam lingkaran peringatan dengan panjang, penekanan, dan penambahan huruf, serta jawaban para ulama Al-Azhar bahwa ini adalah dosa yang memerlukan hukuman yang disuka-suka, dan siapa pun yang menerima atau mendengarkannya adalah keputusannya."
