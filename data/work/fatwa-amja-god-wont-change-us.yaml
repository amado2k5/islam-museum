id: work/fatwa-amja-god-wont-change-us
class: work
kind: fatwa
label: { ar: "عبارة «الله لا يغير علينا»", en: "The phrase 'may God not change us'", ur: "جملہ «اللہ ہماری حالت نہ بدلے»", es: "La frase 'que Dios no nos cambie'", fr: "L'expression « que Dieu ne nous change pas »", tr: "\"Tanrı bizi değiştirmez\" ifadesi", id: "Frasa \"Tuhan tidak mengubah kita\"" }
summary:
  ar: "سأل سائل عن جملة الله لا يغير علينا المترددة على ألسنة المنتفعين من نظام أو حال دون النظر إلى الآخرين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81482 بتاريخ 16 مايو 2010)⁩ أنه يقدر غيرته وتطلعه إلى إغاثة المكروبين واستصلاح الأحوال، لكن ما ذكره أحد تفسيرين لهذه العبارة التي تحتمل تأويلًا آخر وهو الدعوة بدوام النعم وعدم زوالها والدعوة بالتوفيق إلى الطاعات التي تستلزم دوام النعم، فيكون من جنس الأدعية المأثورة بالتعوذ من فجاءة النقمة وتحول العافية وزوال النعمة، وقد قال تعالى ذلك بأن الله لم يك مغيرًا نعمة أنعمها على قوم حتى يغيروا ما بأنفسهم، والأصل حمل كلمات المسلم على أحسن محاملها."
  en: "A questioner objected to the phrase 'may God not change our state', common on the tongues of those who profit from a regime or condition without regard to others. Dr. Salah al-Sawi (fatwa no. 81482, 16 May 2010) answered that his zeal and desire to relieve the distressed and reform affairs is appreciated, but his reading is one of two interpretations: the phrase also bears another — an invocation for blessings to last and not vanish, and for success in the obedience that keeps blessing and well-being — like the transmitted prayers seeking refuge from sudden wrath, the turning of well-being and the removal of blessing, per 'that is because God never changes a favour He bestowed on a people until they change what is in themselves'; and the default is to carry a Muslim's words on their best sense."
  ur: "ایک سائل نے «اللہ ہمیں اسی حال پر رکھے» کہنے والوں پر اعتراض کیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81482، 16 مئی 2010)⁩ کے مطابق جملے کی ایک اور تعبیر بھی ہے — نعمت کی دوام کی دعا؛ اور اصل یہ ہے کہ مسلمان کی بات کو اچھے محمل پر رکھا جائے۔"
  es: "Un interlocutor objetó la frase «que Dios no cambie nuestra situación», común entre quienes se benefician de un régimen o condición sin importarles los demás. El Dr. Salah al-Sawi (fatwa n.º 81482, 16 de mayo de 2010) respondió que se aprecia su celo y deseo de aliviar a los afligidos y reformar los asuntos, pero que su interpretación admite dos posibles significados: la frase también tiene otra interpretaciones: una invocación para que las bendiciones perduren y no se desvanezcan, y para el éxito en la obediencia que mantiene la bendición y el bienestar, como las oraciones transmitidas que buscan refugio de la ira repentina, el cambio de bienestar y la pérdida de bendiciones, ya que «Dios nunca cambia un favor que ha concedido a un pueblo hasta que ellos cambian lo que hay en sí mismos»; y lo habitual es interpretar las palabras de un musulmán según su mejor sentido."
  fr: "Un interlocuteur a contesté l'expression « Que Dieu ne change pas notre situation », souvent employée par ceux qui profitent d'un régime ou d'une situation sans égard pour autrui. Le Dr Salah al-Sawi (fatwa n° 81482, 16 mai 2010) a répondu que son zèle et son désir de soulager les affligés et de réformer les affaires étaient certes louables, mais que son interprétation se limitait à l'une des deux suivantes: l'expression peut également être interprétée comme une invocation pour que les bénédictions perdurent et ne s'évanouissent pas, et pour la réussite dans l'obéissance qui préserve la bénédiction et le bien-être – à l'instar des prières transmises implorant la protection contre la colère divine soudaine, le déclin du bien-être et la perte de la bénédiction, car « Dieu ne retire jamais une faveur qu'Il a accordée à un peuple tant que celui-ci ne change pas ce qui est en lui »; et il convient généralement d'interpréter les paroles d'un musulman selon leur sens le plus juste."
  tr: "Bir soruya soran kişi, bir sistemden faydalananların veya başkalarının başkalarına bakmasını engelleyenlerin dilinde tekrarlanan 'Allah değişmez' ifadesi hakkında soru soruldu. Dr. Salah Al-Sawy (Fetva No. 81482, 16 Mayıs 2010 tarihli), acı çekenlere yardım etme ve koşulları iyileştirme konusundaki gayretini ve arzusunu takdir ettiğini, ancak bu iğlenin başka bir yorumu olabilecek iki yorumdan birinin nimetlerin sürekliliği ve yok olmama çağrısı ile kutsamaların devamını gerektiren ibadet eylemlerinde başarı çağrısı olduğunu söyledi. Böylece, ani felaketten, iyiliğin kaymasından ve nimetlerin yok olmasından sığınmak için bilinen bir dua türüdür. Allah'ın bir halka verdiği bir nimeti değiştirmeyeceğini, onlar kendi içlerindekini değiştirmedikçe değiştirmeyeceğini söyledi. Asıl ilke, bir Müslümanın sözlerini en iyi haliyle yorumlamaktır."
  id: "Seorang penanya ditanya tentang frasa 'Allah tidak berubah' yang diulang di lidah mereka yang mendapat manfaat dari suatu sistem atau mencegah orang lain melihat orang lain. Dr. Salah Al-Sawy (Fatwa No. 81482 tanggal 16 Mei 2010) menjawab bahwa ia menghargai semangat dan aspirasi-Nya untuk membantu yang menderita dan memperbaiki kondisi, tetapi salah satu dari dua interpretasi yang disebutkan untuk frasa ini yang bisa memiliki interpretasi lain adalah seruan untuk kesinambungan berkat dan tidak punahnya, serta seruan untuk sukses dalam ibadah yang memerlukan kelanjutan berkat. Dengan demikian, adalah jenis permohonan yang dikenal untuk mencari perlindungan dari bencana mendadak, perubahan kesejahteraan, dan hilangnya berkat. Allah Yang Maha Kuasa berfirman bahwa Allah tidak akan mengubah berkat yang diberikan-Nya kepada suatu bangsa sampai mereka mengubah apa yang ada dalam diri mereka sendiri. Prinsip aslinya adalah menafsirkan kata-kata seorang Muslim dalam bentuk terbaiknya."
