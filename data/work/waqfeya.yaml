summary:
  ar: "مكتبة رقمية على الإنترنت للكتب الشرعية المصورة، تعنى بتصويرها وإتاحتها للتنزيل، وتضم المخطوطات والرسائل العلمية والنصوص الإسلامية والكتب المصورة، وتذكر أنها تحوي قرابة عشرة ملايين صفحة أكثرها بصيغة PDF؛ أقدم لقطة لموقعها في أرشيف الإنترنت في ديسمبر 2005."
  en: "An online digital library of scanned books of the Shari'a sciences, which scans them and makes them available for download, with manuscripts, theses, Islamic texts and scanned books; it says it holds nearly ten million pages, most as PDF; its site's earliest archived capture is of December 2005."
  ur: "شرعی علوم کی اسکین شدہ کتابوں کی آن لائن ڈیجیٹل لائبریری، جو انہیں اسکین کر کے ڈاؤن لوڈ کے لیے مہیا کرتی ہے؛ مخطوطات، تحقیقی مقالات، اسلامی متون اور اسکین شدہ کتابیں؛ اپنے بقول تقریباً ایک کروڑ صفحات، زیادہ تر PDF میں؛ سب سے پرانی آرکائیو تصویر دسمبر 2005 کی۔"
  es: "Se trata de una biblioteca digital en línea de libros escaneados sobre ciencias de la Sharia, que los digitaliza y los pone a disposición para su descarga, incluyendo manuscritos, tesis, textos islámicos y libros escaneados; afirma tener casi diez millones de páginas, la mayoría en formato PDF; la captura más antigua archivada en su sitio web data de diciembre de 2005."
  fr: "Une bibliothèque numérique en ligne de livres numérisés sur les sciences de la charia, qui les numérise et les met à disposition en téléchargement, avec des manuscrits, des thèses, des textes islamiques et des livres numérisés; elle affirme contenir près de dix millions de pages, la plupart au format PDF; la capture archivée la plus ancienne de son site date de décembre 2005."
  tr: "Resimli İslami kitapların çevrimiçi dijital kütüphanesi, kopyalayıp indirilebilir hale getirmekten sorumludur. El yazmaları, bilimsel tezler, İslami metinler ve resimli kitapları içerir. Yaklaşık on milyon sayfa içerdiği ve bunların çoğu PDF formatında olduğu belirtilmektedir; internet arşivi'ndeki web sitesinin en eski anlık görüntüsü Aralık 2005'te yapılmıştır."
  id: "Perpustakaan digital daring berisi buku-buku Islam bergambar, bertanggung jawab untuk menyalin dan membuatnya tersedia untuk diunduh. Perpustakaan ini mencakup manuskrip, tesis ilmiah, teks Islam, dan buku bergambar. Perlu dicatat bahwa perpustakaan ini berisi hampir sepuluh juta halaman, sebagian besar dalam format PDF; potret tertua situs webnya di Internet Archive adalah pada Desember 2005."
