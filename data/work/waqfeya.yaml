summary:
  ar: "مكتبة رقمية على الإنترنت للكتب الشرعية المصورة، تعنى بتصويرها وإتاحتها للتنزيل، وتضم المخطوطات والرسائل العلمية والنصوص الإسلامية والكتب المصورة، وتذكر أنها تحوي قرابة عشرة ملايين صفحة أكثرها بصيغة PDF؛ أقدم لقطة لموقعها في أرشيف الإنترنت في ديسمبر 2005."
  en: "An online digital library of scanned books of the Shari'a sciences, which scans them and makes them available for download, with manuscripts, theses, Islamic texts and scanned books; it says it holds nearly ten million pages, most as PDF; its site's earliest archived capture is of December 2005."
  ur: "شرعی علوم کی اسکین شدہ کتابوں کی آن لائن ڈیجیٹل لائبریری، جو انہیں اسکین کر کے ڈاؤن لوڈ کے لیے مہیا کرتی ہے؛ مخطوطات، تحقیقی مقالات، اسلامی متون اور اسکین شدہ کتابیں؛ اپنے بقول تقریباً ایک کروڑ صفحات، زیادہ تر PDF میں؛ سب سے پرانی آرکائیو تصویر دسمبر 2005 کی۔"
