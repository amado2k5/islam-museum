id: work/fatwa-amja-driving-nonmuslim-parents-church
class: work
kind: fatwa
label: { ar: "إيصال الوالدين الكافرين إلى الكنيسة", en: "Driving non-Muslim parents to church", ur: "غیر مسلم والدین کو گرجا پہنچانا" }
summary:
  ar: "سأل سائل عن قول بعض أهل العلم بجواز إيصال الولد والديه الكافرين إلى الكنيسة لعجزهما عن الوصول إليها بأنفسهما نقلاً عن المالكية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86373 بتاريخ 22 يناير 2012)⁩ أن ما نُقل موضع نظر وأن على الولد برّ أبويه في غير معصية، وليس له برّهما بجلب الخمر لهما لما فيه من الإعانة على الإثم، وفي أحلّ الله من البر المشروع متسع، ويبذل لهما من المال ما يتحقق به الكفاية بالمعروف ويتوليان بأنفسهما أو بمن أعانهما من أهل دينهما أمر شهواتهما غير المشروعة."
  en: "A questioner cited a report from the Malikis permitting a child to drive his non-Muslim parents to church when they cannot reach it themselves. Dr. Salah al-Sawi (fatwa no. 86373, 22 January 2012) answered that the report is doubtful: the child owes his parents kindness short of disobedience, may not serve them by fetching wine since that aids sin, and has ample lawful kindness besides — spending on them befittingly while they or their co-religionists handle their unlawful wants themselves. Recorded as AMJA's answer."
  ur: "ایک سائل نے مالکیہ منقول قول پوچھا کہ غیر مسلم والدین کو گرجا پہنچانا جائز ہے یا نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86373، 22 جنوری 2012)⁩ کے مطابق بچہ والدین کے ساتھ معصیت کے سوا نیکی کرے؛ گناہ میں مدد ⁦(جیسے شراب لانا)⁩ جائز نہیں — ایم جے اے کے جواب کا خلاصہ۔"
