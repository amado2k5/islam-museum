id: work/fatwa-amja-driving-nonmuslim-parents-church
class: work
kind: fatwa
label: { ar: "إيصال الوالدين الكافرين إلى الكنيسة", en: "Driving non-Muslim parents to church", ur: "غیر مسلم والدین کو گرجا پہنچانا", es: "Llevar a padres no musulmanes a la iglesia", fr: "Conduire des parents non musulmans à l'église", tr: "İnançsız Ebeveynleri Kiliseye Teslim Etmek", id: "Menyerahkan Orang Tua yang Tidak Beriman ke Gereja" }
summary:
  ar: "سأل سائل عن قول بعض أهل العلم بجواز إيصال الولد والديه الكافرين إلى الكنيسة لعجزهما عن الوصول إليها بأنفسهما نقلاً عن المالكية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86373 بتاريخ 22 يناير 2012)⁩ أن ما نُقل موضع نظر وأن على الولد برّ أبويه في غير معصية، وليس له برّهما بجلب الخمر لهما لما فيه من الإعانة على الإثم، وفي أحلّ الله من البر المشروع متسع، ويبذل لهما من المال ما يتحقق به الكفاية بالمعروف ويتوليان بأنفسهما أو بمن أعانهما من أهل دينهما أمر شهواتهما غير المشروعة."
  en: "A questioner cited a report from the Malikis permitting a child to drive his non-Muslim parents to church when they cannot reach it themselves. Dr. Salah al-Sawi (fatwa no. 86373, 22 January 2012) answered that the report is doubtful: the child owes his parents kindness short of disobedience, may not serve them by fetching wine since that aids sin, and has ample lawful kindness besides — spending on them befittingly while they or their co-religionists handle their unlawful wants themselves. Recorded as AMJA's answer."
  ur: "ایک سائل نے مالکیہ منقول قول پوچھا کہ غیر مسلم والدین کو گرجا پہنچانا جائز ہے یا نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86373، 22 جنوری 2012)⁩ کے مطابق بچہ والدین کے ساتھ معصیت کے سوا نیکی کرے؛ گناہ میں مدد ⁦(جیسے شراب لانا)⁩ جائز نہیں — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un interlocutor citó un informe de los malikíes que permitía a un niño llevar a sus padres no musulmanes a la iglesia cuando ellos no podían llegar por sí mismos. El Dr. Salah al-Sawi (fatwa n.º 86373, 22 de enero de 2012) respondió que el informe era dudoso: el niño debe a sus padres un favor que no llega a ser desobediente, no puede servirles trayéndoles vino, puesto que eso fomenta el pecado, y además tiene muchas maneras lícitas de ser bondadoso —gastando en ellos de forma apropiada mientras ellos o sus correligionarios satisfacen sus necesidades ilícitas—. Registrada como respuesta de AMJA."
  fr: "Un interlocuteur a cité un rapport malikite autorisant un enfant à conduire ses parents non musulmans à l'église lorsqu'ils ne peuvent s'y rendre eux-mêmes. Le Dr Salah al-Sawi (fatwa n° 86373, 22 janvier 2012) a répondu que ce rapport était douteux: l'enfant doit à ses parents une forme de bienveillance sans pour autant leur désobéir, ne peut les servir en leur apportant du vin car cela encourage le péché, et dispose par ailleurs de nombreuses autres formes de bienveillance licite, notamment en dépensant convenablement pour eux, tandis qu'eux ou leurs coreligionnaires subviennent eux-mêmes à leurs besoins illicites. Cette réponse a été consignée dans la jurisprudence de l'AMJA."
  tr: "Malikilere göre, bazı alimlerin çocuğun kiliseye kendilerinin ulaşamaması nedeniyle kiliseye gönderilmesinin izinliliği hakkındaki görüşleri soruldu. Dr. Salah Al-Sawy (22 Ocak 2012 tarihli Fetva No. 86373) bildirilenlerin dikkate alınması gerektiğini, çocuğun ebeveynlerine günah olmayan şekilde saygı göstermekle yükümlü olduğunu, alkol getirme hakkı olmadığını çünkü bunun günaha yardımcı olduğunu yanıtladı. Allah'ın yasal ve yasal doğruluktan izin verdiği kadarıyla, onlara iyilikle yetecek kadar para verilir ve kendileri ya da dinlerinden yardım edenler, yasadışı arzularını yönetmelerinde kendileri veya yardım edenler."
  id: "Seorang penanya ditanya tentang pendapat beberapa ulama mengenai diperbolehkannya mengirim anak ke gereja karena ketidakmampuan mereka untuk menjangkaunya sendiri, menurut Malikis. Dr. Salah Al-Sawy menjawab (Fatwa No. 86373 tanggal 22 Januari 2012) bahwa apa yang dilaporkan harus dipertimbangkan, dan anak tersebut berkewajiban menghormati orang tuanya dengan cara yang bukan dosa, dan dia tidak berhak membawa alkohol karena itu membantu dosa. Dalam apa yang Allah izinkan dari kebenaran yang sah, ada ruang yang luas, dan uang diberikan kepada mereka yang cukup dengan kebaikan, dan mereka sendiri atau mereka yang membantu mereka dari agama mereka dalam menangani keinginan yang tidak sah itu."
