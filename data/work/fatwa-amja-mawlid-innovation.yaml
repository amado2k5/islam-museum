id: work/fatwa-amja-mawlid-innovation
class: work
kind: fatwa
label: { ar: "الاحتفال بالمولد النبوي", en: "Celebrating the Prophet's birthday", ur: "مولد نبوی کی تقریب", es: "Celebrando el cumpleaños del Profeta", fr: "Célébration de l'anniversaire du Prophète", tr: "Peygamber'in Doğum Gününü Kutlamak", id: "Merayakan Ulang Tahun Nabi" }
summary:
  ar: "سأل سائل علم من مشايخ أهل السنة أن الاحتفال بالمولد النبوي بدعة لا يجوز فاعترض عليه آخرون بتأويلات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78159 بتاريخ 11 مارس 2009)⁩ ألا يحزنه إعراض بعض من دخل في مثل هذه التأويلات عن جادة السلف، فقد علم القاصي والداني أن العبادات توقيفية وهؤلاء الذين يباشرون هذه الاحتفالات يباشرونها تنسكًا وتعبدًا فأنى لهم مشروعيتها وقد خلت منها القرون الفاضلة وهم أشد حبًا للنبي وأعلم بسنته وهديه، وأما الرؤى فلا يعول عليها في إثبات حكم شرعي لا سيما إذا جرت القرون الفاضلة على خلافه، فلا يمار في الأمر إلا مراء ظاهر ويشتغل بما ينفعه من عبادة ربه."
  en: "A questioner who learned from Sunni shaykhs that celebrating the Prophet's birthday is an impermissible innovation met objectors with interpretations. Dr. Salah al-Sawi (fatwa no. 78159, 11 March 2009) answered that the turning of some toward such interpretations away from the path of the righteous forebears should not grieve him: far and near know worship is textual, and those who perform these celebrations do so as devotion and worship — yet the virtuous generations were free of them, and they loved the Prophet more and knew his sunna and way better; as for dreams, they cannot establish a sharia ruling, especially where the virtuous generations ran otherwise — he should not dispute beyond an open argument and occupy himself with what benefits him of worship. Recorded as AMJA's answer."
  ur: "ایک سائل نے مولد کی تقریب کے بدعت ہونے پر اعتراضات پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78159، 11 مارچ 2009)⁩ کے مطابق عبادت توقیفی ہے اور اولیٰ صدیق قرون اس سے خالی تھیں؛ خواب سے شرعی حکم ثابت نہیں ہوتا۔"
  es: "Un consultante que había aprendido de jeques sunitas que celebrar el cumpleaños del Profeta es una innovación inadmisible se encontró con objeciones que le ofrecieron diversas interpretaciones. El Dr. Salah al-Sawi (fatwa n.º 78159, 11 de marzo de 2009) respondió que el hecho de que algunos se desviaran del camino de los antepasados piadosos hacia tales interpretaciones no debería preocuparle: es sabido que la adoración es textual, y quienes realizan estas celebraciones lo hacen por devoción y culto; sin embargo, las generaciones virtuosas estaban libres de ellas, y amaban más al Profeta y conocían mejor su sunna y su camino; en cuanto a los sueños, no pueden establecer una norma islámica, especialmente cuando las generaciones virtuosas actuaron de otra manera; no debería entrar en disputas más allá de un argumento abierto y ocuparse de lo que le beneficia en la adoración. Registrado como respuesta de AMJA."
  fr: "Un homme, ayant appris de cheikhs sunnites que la célébration de l'anniversaire du Prophète est une innovation interdite, a rencontré des objections et des interprétations. Le Dr Salah al-Sawi (fatwa n° 78159, 11 mars 2009) a répondu que le fait que certains se tournent vers de telles interprétations, s'éloignant ainsi de la voie des pieux ancêtres, ne devait pas l'affliger: tous savent que le culte est prescrit par le texte, et ceux qui accomplissent ces célébrations le font par dévotion et adoration; or, les générations vertueuses s'en affranchissaient, aimaient davantage le Prophète et connaissaient mieux sa sunna et sa voie; quant aux rêves, ils ne peuvent fonder une décision de la charia, surtout lorsque les générations vertueuses ont suivi une autre voie; il ne devrait pas polémiquer outre mesure et se concentrer sur ce qui lui est utile dans son adoration. (Réponse rapportée par AMJA)"
  tr: "Bir âlim, bir Sünni âlime Peygamber'in doğum gününü kutlamanın kabul edilemez bir yenilik olduğunu sordu ve diğerleri çeşitli yorumlarla itiraz etti. Dr. Salah Al-Sawi (Fetva No. 78159, 11 Mart 2009), bazı yorumlara girenlerin erken seleflerin yolunu terk etmesinden üzülmediğini, çünkü yakın ve uzak herkesin ibadet eylemlerinin kısıtlayıcı olduğunu ve bu kutlamaları başlatanların bunu münzeviyet ve ibadet için yaptığını söyledi. Erdemli nesiller onlardan ayrılmışken, Peygamber'i daha çok seviyorlar ve onun Sünneti ile rehberi hakkında daha bilgiliyken, nasıl meşruiyete sahip olabilirler? Vizyonlar ise, özellikle erdemli nesiller tam tersini takip ediyorsa, yasal bir hüküm koymak için güvenilemez. O sadece açık bir muhalefetle ilerler ve Rabbine ibadet ederken faydasını sağlar."
  id: "Seorang ulama bertanya kepada seorang ulama Sunni bahwa merayakan ulang tahun Nabi adalah inovasi yang tidak diperbolehkan, dan yang lain menentang dengan berbagai interpretasi. Dr. Salah Al-Sawi (Fatwa No. 78159 tanggal 11 Maret 2009) menjawab bahwa ia tidak sedih oleh beberapa orang yang memasuki tafsiran tersebut dengan meninggalkan jalan para pendahulu awal, karena semua orang di dekat dan jauh tahu bahwa ibadah itu membatasi, dan mereka yang memulai perayaan ini melakukannya karena asketisme dan ibadah. Bagaimana mereka bisa memiliki legitimasi ketika generasi berbudi luhur telah meninggal dari mereka, dan mereka lebih mengasihi Nabi dan lebih memahami Sunnah serta petunjuknya? Adapun penglihatan, tidak dapat diandalkan untuk menetapkan keputusan hukum, terutama jika generasi yang berbudi luhur mengikuti sebaliknya. Ia hanya bertindak dengan perbedaan pendapat yang jelas dan terlibat dalam apa yang menguntungkannya dalam menyembah Tuhan-Nya."
