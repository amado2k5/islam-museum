label: { ar: "قرار مجمع الفقه الإسلامي الدولي 181 (19/7) بشأن وقف الأسهم والصكوك والحقوق المعنوية والمنافع", en: "IIFA resolution 181 (19/7) on the waqf of shares, sukuk, intangible rights and usufructs", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 181 (19/7): حصص، صکوک، معنوی حقوق اور منافع کا وقف", es: "Resolución 181 (19/7) de la IIFA sobre el waqf de acciones, sukuk, derechos intangibles y usufructos." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. انطلق من أن الوقف من أوسع أبواب الفقه القائمة على الاجتهاد وأن نصوصه مطلقة تسع المؤبد والمؤقت والمفرز والمشاع والأعيان والمنافع والنقود والعقار والمنقول، فقرر جواز وقف أسهم الشركات المباح تملكها شرعًا والصكوك والحقوق المعنوية والمنافع ووحدات الصناديق الاستثمارية لكونها أموالًا معتبرة شرعًا. ورتّب أحكامًا منها: الأصل في الأسهم الوقفية بقاؤها واستعمال عوائدها في أغراض الوقف لا المتاجرة بها، ولا يتصرف فيها الناظر إلا لمصلحة راجحة أو بشرط الواقف وفق أحكام الاستبدال؛ إن صفيت الشركة أو سددت الصكوك جاز الاستبدال بأصول أخرى؛ الوقف المؤقت يصفى حسب شرط الواقف؛ الأسهم المشتراة بمال نقدي موقوف لا تصير وقفًا بعينها ما لم ينص الواقف؛ جواز وقف المنافع والخدمات والنقود ⁦(مستشفيات وجامعات وخدمات هاتف وكهرباء ومنافع دور وجسور وطرق)⁩؛ وقف المنفعة لمدة لا يؤثر في تصرف المالك في عينه؛ وقف الحقوق المعنوية ينقضي بانتهاء أجلها القانوني؛ وجواز التوقيت بإرادة الواقف في كل الموقوفات. وأجاز لمن حاز أموالًا مشبوهة أو محرمة لا يعرف أصحابها تطهير ذمته بوقفها على أوجه البر العامة في غير ما يقصد به التعبد ⁦(كالمساجد والمصاحف)⁩، ولمن حاز مالًا له عائد محرم أن يقف رأس المال وتكون العوائد أرصادًا لها حكم الأوقاف الخيرية مع المبادرة لاستبدالها بالحلال، مراعاةً لحرمة تملك أسهم البنوك والتأمين الربوية التقليدية. وأوصى بتعديل قوانين الأوقاف في البلدان الإسلامية وبمقررات دراسية للوقف وبدراسة لاحقة لإدارة الوقف وضوابطها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). Starting from waqf as one of the broadest ijtihad-based chapters of fiqh, its texts unqualified in covering the perpetual and temporary, the divided and undivided, tangibles, usufructs, cash, realty and movables, it ruled shares of companies whose ownership is lawful, sukuk, intangible rights, usufructs and investment-fund units all valid as waqf, being legally recognised property. Consequences it laid down: endowed shares are in principle retained with their returns applied to the waqf's purposes rather than traded, the administrator acting on them only for a preponderant benefit or by the founder's condition under the exchange rules; if the company is wound up or the sukuk redeemed, substitution into other assets is permissible; a founder-temporised waqf is wound up per his condition; shares bought with endowed cash do not themselves become waqf unless stipulated; usufructs, services and cash may be endowed (hospitals, universities, phone and electricity services, the use of houses, bridges and roads); a fixed-term usufruct waqf does not restrict the owner's dealings in the asset; waqf of intangible rights lapses at their statutory term; and temporisation is valid by the founder's will for every kind. It also permitted one holding suspect or unlawful money whose owners are unknown to clear his liability by endowing it for general charity other than acts of worship (such as mosques and mushaf printing), and one holding capital with unlawful yield to endow the principal while the yield goes to the poor — moving to replace it with lawful funds, given the prohibition of owning conventional bank and insurance shares. It recommended aligning national waqf laws with the Academy's resolutions, dedicated waqf curricula, and a later study of waqf administration."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے وقف کو فقہ کے وسیع اجتہادی ابواب میں شمار کرتے ہوئے، اس کی نصوص کو مطلق قرار دیا جو مؤبد و مؤقت، مفرز و مشاع، اعیان و منافع، نقد، عقار اور منقولہ سب کو سمیٹتی ہیں، اور یہ فیصلہ دیا کہ وہ کمپنیوں کے حصص جن کا تملک شرعاً جائز ہے، صکوک، معنوی حقوق، منافع اور سرمایہ کاری فنڈ یونٹس — سب وقف ہو سکتے ہیں کیونکہ یہ شرعی اعتبار سے مال ہیں۔ احکام میں یہ شامل ہیں: وقف شدہ حصص اصل میں باقی رہتے ہیں اور ان کا عائد وقف کے مقاصد پر صرف ہوتا ہے، بازار میں ان کی تجارت نہیں؛ منتظم انہیں صرف راجح مصلحت یا واقف کی شرط پر استبدال کے احکام کے تحت منتقل کر سکتا ہے؛ کمپنی کی تصفیہ یا صکوک کی ادائیگی پر دوسرے اثاثوں میں تبدیلی جائز؛ مؤقت وقف واقف کی شرط کے مطابق ختم ہوتا ہے؛ موقوفہ نقدی سے خریدے گئے حصص خود وقف نہیں بنتے جب تک واقف نے شرط نہ لگائی؛ منافع، خدمات اور نقد کا وقف جائز ⁦(اسپتال، جامعات، فون و بجلی کی سہولتیں، مکانات، پل اور سڑکیں)⁩؛ مدت کے لیے منفعت کا وقف مالک کے تصرفات پر اثر نہیں ڈالتا؛ معنوی حقوق کا وقف ان کی قانونی مدت ختم ہونے پر منقضی ہوتا ہے؛ اور ہر قسم کے موقوفات میں واقف کی طرف سے توقیت جائز۔ اس کے علاوہ اس نے اس شخص کی اجازت دی جس کے پاس مشبہ یا حرام مال ہو اور مالکان معلوم نہ ہوں کہ وہ اپنی ذمہ بری کرنے کے لیے اسے عام برائی کے کاموں پر وقف کرے سوائے عبادت کی نیت والے کاموں کے ⁦(مساجد یا مصحف کی طباعت جیسے)⁩؛ اور جس کے مال پر حرام عائد ہو وہ اصل رقم وقف کر سکے اور عائد مساکین پر صرف ہو، حلال سے تبدیلی کی جلد کوشش کے ساتھ، روایتی سودی بینکوں اور انشورنس کمپنیوں کے حصص رکھنے کی حرمت کے پیشِ نظر۔ سفارشات: اسلامی ممالک کے وقف قوانین کو اکیڈمی کی قراردادوں سے ہم آہنگ کیا جائے، وقف کے نصابی مضامین قائم ہوں، اور وقف کے انتظام و ضوابط پر بعد میں مطالعہ ہو۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula 1430, 26-30 de abril de 2009). Partiendo del waqf como uno de los capítulos más amplios del fiqh basados en el ijtihad, cuyos textos abarcan sin restricciones lo perpetuo y lo temporal, lo dividido y lo indiviso, los bienes tangibles, los usufructos, el efectivo, los bienes inmuebles y los bienes muebles, dictaminó que las acciones de las empresas cuya propiedad es lícita, los sukuk, los derechos intangibles, los usufructos y las unidades de fondos de inversión son todos válidos como waqf, siendo propiedad legalmente reconocida. Consecuencias que estableció: las acciones dotadas se conservan en principio y sus rendimientos se aplican a los fines del waqf en lugar de negociarse, y el administrador actúa sobre ellas solo para un beneficio preponderante o por la condición del fundador según las reglas de intercambio; si la empresa se liquida o el sukuk se rescata, la sustitución por otros activos es permisible; Un waqf temporalizado por el fundador se liquida según su condición; las acciones compradas con efectivo dotado no se convierten en waqf a menos que se estipule; se pueden dotar usufructos, servicios y efectivo (hospitales, universidades, servicios de telefonía y electricidad, uso de casas, puentes y carreteras); un waqf de usufructo a plazo fijo no restringe las transacciones del propietario con el activo; el waqf de derechos intangibles caduca en su plazo legal; y la temporalización es válida por la voluntad del fundador para todo tipo. También permitía a quien poseía dinero sospechoso o ilícito cuyos propietarios eran desconocidos saldar su deuda dotándolo para caridad general distinta de los actos de culto (como mezquitas e impresión de mushaf), y a quien poseía capital con rendimiento ilícito dotar el principal mientras el rendimiento se destinaba a los pobres, pasando a reemplazarlo con fondos lícitos, dada la prohibición de poseer acciones bancarias y de seguros convencionales. Recomendó alinear las leyes nacionales sobre el waqf con las resoluciones de la Academia, elaborar planes de estudio específicos sobre el waqf y realizar un estudio posterior sobre la administración del waqf."
