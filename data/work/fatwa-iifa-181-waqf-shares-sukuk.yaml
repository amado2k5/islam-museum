label: { ar: "قرار مجمع الفقه الإسلامي الدولي 181 (19/7) بشأن وقف الأسهم والصكوك والحقوق المعنوية والمنافع", en: "IIFA resolution 181 (19/7) on the waqf of shares, sukuk, intangible rights and usufructs", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 181 (19/7): حصص، صکوک، معنوی حقوق اور منافع کا وقف", es: "Resolución 181 (19/7) de la IIFA sobre el waqf de acciones, sukuk, derechos intangibles y usufructos.", fr: "Résolution 181 (19/7) de l'IIFA sur le waqf d'actions, de sukuk, de droits incorporels et d'usufruits", tr: "Hisselerin, Sukukların, Ahlaki Hakların ve Hakların Askıya Alınmasına İlişkin Uluslararası İslami Fiqh Akademisi Kararı 181 (19/7)", id: "Resolusi Akademi Fiqh Islam Internasional 181 (19/7) mengenai Penangguhan Saham, Sukuk, Hak Moral, dan Manfaat" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. انطلق من أن الوقف من أوسع أبواب الفقه القائمة على الاجتهاد وأن نصوصه مطلقة تسع المؤبد والمؤقت والمفرز والمشاع والأعيان والمنافع والنقود والعقار والمنقول، فقرر جواز وقف أسهم الشركات المباح تملكها شرعًا والصكوك والحقوق المعنوية والمنافع ووحدات الصناديق الاستثمارية لكونها أموالًا معتبرة شرعًا. ورتّب أحكامًا منها: الأصل في الأسهم الوقفية بقاؤها واستعمال عوائدها في أغراض الوقف لا المتاجرة بها، ولا يتصرف فيها الناظر إلا لمصلحة راجحة أو بشرط الواقف وفق أحكام الاستبدال؛ إن صفيت الشركة أو سددت الصكوك جاز الاستبدال بأصول أخرى؛ الوقف المؤقت يصفى حسب شرط الواقف؛ الأسهم المشتراة بمال نقدي موقوف لا تصير وقفًا بعينها ما لم ينص الواقف؛ جواز وقف المنافع والخدمات والنقود ⁦(مستشفيات وجامعات وخدمات هاتف وكهرباء ومنافع دور وجسور وطرق)⁩؛ وقف المنفعة لمدة لا يؤثر في تصرف المالك في عينه؛ وقف الحقوق المعنوية ينقضي بانتهاء أجلها القانوني؛ وجواز التوقيت بإرادة الواقف في كل الموقوفات. وأجاز لمن حاز أموالًا مشبوهة أو محرمة لا يعرف أصحابها تطهير ذمته بوقفها على أوجه البر العامة في غير ما يقصد به التعبد ⁦(كالمساجد والمصاحف)⁩، ولمن حاز مالًا له عائد محرم أن يقف رأس المال وتكون العوائد أرصادًا لها حكم الأوقاف الخيرية مع المبادرة لاستبدالها بالحلال، مراعاةً لحرمة تملك أسهم البنوك والتأمين الربوية التقليدية. وأوصى بتعديل قوانين الأوقاف في البلدان الإسلامية وبمقررات دراسية للوقف وبدراسة لاحقة لإدارة الوقف وضوابطها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). Starting from waqf as one of the broadest ijtihad-based chapters of fiqh, its texts unqualified in covering the perpetual and temporary, the divided and undivided, tangibles, usufructs, cash, realty and movables, it ruled shares of companies whose ownership is lawful, sukuk, intangible rights, usufructs and investment-fund units all valid as waqf, being legally recognised property. Consequences it laid down: endowed shares are in principle retained with their returns applied to the waqf's purposes rather than traded, the administrator acting on them only for a preponderant benefit or by the founder's condition under the exchange rules; if the company is wound up or the sukuk redeemed, substitution into other assets is permissible; a founder-temporised waqf is wound up per his condition; shares bought with endowed cash do not themselves become waqf unless stipulated; usufructs, services and cash may be endowed (hospitals, universities, phone and electricity services, the use of houses, bridges and roads); a fixed-term usufruct waqf does not restrict the owner's dealings in the asset; waqf of intangible rights lapses at their statutory term; and temporisation is valid by the founder's will for every kind. It also permitted one holding suspect or unlawful money whose owners are unknown to clear his liability by endowing it for general charity other than acts of worship (such as mosques and mushaf printing), and one holding capital with unlawful yield to endow the principal while the yield goes to the poor — moving to replace it with lawful funds, given the prohibition of owning conventional bank and insurance shares. It recommended aligning national waqf laws with the Academy's resolutions, dedicated waqf curricula, and a later study of waqf administration."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے وقف کو فقہ کے وسیع اجتہادی ابواب میں شمار کرتے ہوئے، اس کی نصوص کو مطلق قرار دیا جو مؤبد و مؤقت، مفرز و مشاع، اعیان و منافع، نقد، عقار اور منقولہ سب کو سمیٹتی ہیں، اور یہ فیصلہ دیا کہ وہ کمپنیوں کے حصص جن کا تملک شرعاً جائز ہے، صکوک، معنوی حقوق، منافع اور سرمایہ کاری فنڈ یونٹس — سب وقف ہو سکتے ہیں کیونکہ یہ شرعی اعتبار سے مال ہیں۔ احکام میں یہ شامل ہیں: وقف شدہ حصص اصل میں باقی رہتے ہیں اور ان کا عائد وقف کے مقاصد پر صرف ہوتا ہے، بازار میں ان کی تجارت نہیں؛ منتظم انہیں صرف راجح مصلحت یا واقف کی شرط پر استبدال کے احکام کے تحت منتقل کر سکتا ہے؛ کمپنی کی تصفیہ یا صکوک کی ادائیگی پر دوسرے اثاثوں میں تبدیلی جائز؛ مؤقت وقف واقف کی شرط کے مطابق ختم ہوتا ہے؛ موقوفہ نقدی سے خریدے گئے حصص خود وقف نہیں بنتے جب تک واقف نے شرط نہ لگائی؛ منافع، خدمات اور نقد کا وقف جائز ⁦(اسپتال، جامعات، فون و بجلی کی سہولتیں، مکانات، پل اور سڑکیں)⁩؛ مدت کے لیے منفعت کا وقف مالک کے تصرفات پر اثر نہیں ڈالتا؛ معنوی حقوق کا وقف ان کی قانونی مدت ختم ہونے پر منقضی ہوتا ہے؛ اور ہر قسم کے موقوفات میں واقف کی طرف سے توقیت جائز۔ اس کے علاوہ اس نے اس شخص کی اجازت دی جس کے پاس مشبہ یا حرام مال ہو اور مالکان معلوم نہ ہوں کہ وہ اپنی ذمہ بری کرنے کے لیے اسے عام برائی کے کاموں پر وقف کرے سوائے عبادت کی نیت والے کاموں کے ⁦(مساجد یا مصحف کی طباعت جیسے)⁩؛ اور جس کے مال پر حرام عائد ہو وہ اصل رقم وقف کر سکے اور عائد مساکین پر صرف ہو، حلال سے تبدیلی کی جلد کوشش کے ساتھ، روایتی سودی بینکوں اور انشورنس کمپنیوں کے حصص رکھنے کی حرمت کے پیشِ نظر۔ سفارشات: اسلامی ممالک کے وقف قوانین کو اکیڈمی کی قراردادوں سے ہم آہنگ کیا جائے، وقف کے نصابی مضامین قائم ہوں، اور وقف کے انتظام و ضوابط پر بعد میں مطالعہ ہو۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula 1430, 26-30 de abril de 2009). Partiendo del waqf como uno de los capítulos más amplios del fiqh basados en el ijtihad, cuyos textos abarcan sin restricciones lo perpetuo y lo temporal, lo dividido y lo indiviso, los bienes tangibles, los usufructos, el efectivo, los bienes inmuebles y los bienes muebles, dictaminó que las acciones de las empresas cuya propiedad es lícita, los sukuk, los derechos intangibles, los usufructos y las unidades de fondos de inversión son todos válidos como waqf, siendo propiedad legalmente reconocida. Consecuencias que estableció: las acciones dotadas se conservan en principio y sus rendimientos se aplican a los fines del waqf en lugar de negociarse, y el administrador actúa sobre ellas solo para un beneficio preponderante o por la condición del fundador según las reglas de intercambio; si la empresa se liquida o el sukuk se rescata, la sustitución por otros activos es permisible; Un waqf temporalizado por el fundador se liquida según su condición; las acciones compradas con efectivo dotado no se convierten en waqf a menos que se estipule; se pueden dotar usufructos, servicios y efectivo (hospitales, universidades, servicios de telefonía y electricidad, uso de casas, puentes y carreteras); un waqf de usufructo a plazo fijo no restringe las transacciones del propietario con el activo; el waqf de derechos intangibles caduca en su plazo legal; y la temporalización es válida por la voluntad del fundador para todo tipo. También permitía a quien poseía dinero sospechoso o ilícito cuyos propietarios eran desconocidos saldar su deuda dotándolo para caridad general distinta de los actos de culto (como mezquitas e impresión de mushaf), y a quien poseía capital con rendimiento ilícito dotar el principal mientras el rendimiento se destinaba a los pobres, pasando a reemplazarlo con fondos lícitos, dada la prohibición de poseer acciones bancarias y de seguros convencionales. Recomendó alinear las leyes nacionales sobre el waqf con las resoluciones de la Academia, elaborar planes de estudio específicos sobre el waqf y realizar un estudio posterior sobre la administración del waqf."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009). Partant du waqf, l'un des chapitres les plus vastes du fiqh fondés sur l'ijtihad, dont les textes couvrent sans restriction les biens perpétuels et temporaires, indivis et divisés, corporels, les usufruits, les liquidités, les biens immobiliers et mobiliers, l'Académie a statué que les actions de sociétés dont la propriété est licite, les sukuk, les droits incorporels, les usufruits et les parts de fonds d'investissement sont tous valides en tant que waqf, étant des biens légalement reconnus. Conséquences établies: les actions constituées en waqf sont en principe conservées et leurs revenus affectés aux objectifs du waqf plutôt que négociés, l'administrateur n'agissant à leur sujet que pour un bénéfice prépondérant ou conformément aux conditions du fondateur prévues par les règles de change; si la société est liquidée ou le sukuk remboursé, la substitution par d'autres actifs est permise. Un waqf temporaire créé par le fondateur est dissous conformément à ses conditions; les actions acquises grâce à des fonds constitués en waqf ne deviennent pas elles-mêmes un waqf, sauf stipulation contraire; les usufruits, les services et les liquidités peuvent être constitués en waqf (hôpitaux, universités, services de téléphonie et d’électricité, usage de maisons, de ponts et de routes); un waqf d’usufruit à durée déterminée ne restreint pas la liberté du titulaire quant à l’utilisation du bien; le waqf de droits incorporels s’éteint à son terme légal; et la temporisation est valable par testament du fondateur pour toute forme de waqf. Il a également été permis à une personne détenant des fonds suspects ou illicites dont les propriétaires sont inconnus de s’acquitter de sa dette en les léguant à des œuvres caritatives générales autres que des actes de culte (tels que des mosquées et l’impression de mushaf), et à une personne détenant un capital à rendement illicite de constituer un capital tandis que le rendement est destiné aux pauvres – en vue de le remplacer par des fonds licites, étant donné l’interdiction de posséder des actions de banques et d’assurances classiques. Il a été recommandé d’harmoniser les lois nationales sur les waqfs avec les résolutions de l’Académie, des programmes d’études dédiés aux waqfs et une étude ultérieure de l’administration des waqfs."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin on dokuzuncu oturumunda (1–5 Cumada-avvel 1430 H, 26–30 Nisan 2009) toplu kararı alınmıştır. Vakıfın, ijtihada dayalı en geniş hukuk dallarından biri olduğu ve metinlerinin mutlak olduğu tespit edilmiştir: ömür boyu, geçici, ayrı, ortak, mülkiyet, yardımlar, para, gayrimenkul ve taşınmazlar. İslam hukukuna göre sahip olunmasına izin verilen şirketlerin hisselerinin, ayrıca İslam hukukunda fon olarak kabul edilen sukuk, ahlaki haklar, faydalar ve yatırım fonu birimlerinin askıya alınmasının caiz olduğuna karar verilmiştir. Aşağıdaki kararları düzenlemiştir: Bağış hisselerinin orijinal koşulu, bağış hisselerinin tutulması ve gelirlerinin bağış amaçları için kullanılmasıdır, ticaret için değil. Denetçi, bunları yalnızca daha güçlü bir menfaat için veya takas hükümlerine göre devretme şartı altında elden çıkarabilir; şirket tasfiye edilirse veya sukuk mutabakatı yapılırsa, diğer varlıklarla değiştirilebilir; geçici bağışlar bağışın şartına göre tasfiye edilir; vakıf nakitiyle satın alınan hisseler, bağışlar tarafından belirtilmedikçe özel bir vakıf haline gelmez; yardım, hizmet ve para (hastaneler, üniversiteler, telefon ve elektrik hizmetleri ile ev, köprü ve yol yardımları) bağışlanmasının izin verilebilirliği; hak sahiplerinin fiili eylemlerini etkilemeyen bir süre için yardım bağışlaması; manevi hakların yasal süresi dolduktan sonra sona erer; ve tüm bağışlarda vakıfın iradeli iradesiyle zamanlamanın izin verilebilirliği. Sahipleri ibadet amaçlı olmayan kamu hayır amaçları (örneğin camiler ve Kur'anlar) için nasıl borçlarını vermeyi bilmeyen şüpheli veya yasaklı fonlara sahip olanların, bu fonları ibadet amaçlı olmayan kamu yardımları için bağışlamasına izin verdi. Yasadışı getirisi olanlar için sermaye ayrılabilir ve gelirler hayır kurumları hükümleri uyarınca krediye dönüştürülebilir; bunlar, banka hisselerine ve geleneksel tefecilik sigortasına sahip olma kutsallığı göz önüne alınarak helal vakıflarla değiştirilmelidir. İslam ülkelerinde vakıf yasalarının değiştirilmesini, vakıf müfredatlarının ve sonrasında vakıf yönetimi ile düzenlemelerinin incelenmesini önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sidang kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430 H, 26–30 April 2009 M). Ditegaskan bahwa waqf adalah salah satu cabang yurisprudensi terluas yang didasarkan pada ijtihad, dan teksnya mutlak: seumur hidup, sementara, separat, bersama, properti, manfaat, uang, properti, dan barang bergerak. Diputuskan bahwa diperbolehkan menangguhkan saham perusahaan yang diperbolehkan dimiliki menurut hukum Islam, serta sukuk, hak moral, manfaat, dan unit dana investasi karena dianggap dana menurut hukum Islam. Ia mengatur putusan-putusan termasuk: Syarat awal untuk saham abadi adalah penyimpanan dan penggunaan hasilnya untuk tujuan wakaf, bukan untuk diperdagangkan. Pengawas hanya dapat menjualnya dengan kepentingan yang lebih kuat atau dengan syarat pemberi dana sesuai ketentuan pertukaran; jika perusahaan dilikuidasi atau sukuk diselesaikan, dana tersebut dapat ditukar dengan aset lain; dana abadi sementara dilikuidasi sesuai dengan kondisi pemberi wakaf; saham yang dibeli dengan uang abadi tidak menjadi dana abadi khusus kecuali ditentukan oleh pemberi wakaf; diperbolehkannya dana abadi atas manfaat, jasa, dan uang (rumah sakit, universitas, layanan telepon dan listrik, serta manfaat rumah, jembatan, dan jalan); pemberian manfaat untuk jangka waktu yang tidak memengaruhi tindakan nyata pemilik; pemberian hak moral berakhir setelah berakhirnya masa hukumnya; dan kelayakan waktu oleh kehendak yang disengaja pemberi dana dalam semua wakaf. Ia mengizinkan mereka yang memiliki dana yang mencurigakan atau terlarang yang pemiliknya tidak tahu cara membersihkan tanggung jawab mereka dengan memberikan dana tersebut untuk tujuan amal publik selain yang dimaksudkan untuk ibadah (seperti masjid dan Al-Qur'an). Bagi mereka yang memiliki pengembalian ilegal, modal dapat disisihkan dan hasilnya menjadi kredit berdasarkan aturan dana abadi, dengan inisiatif untuk menggantinya dengan dana halal, sebagai pertimbangan kesucian kepemilikan saham bank dan asuransi riba tradisional. Ia merekomendasikan amandemen undang-undang wakaf di negara-negara Islam, termasuk kurikulum wakaf dan studi selanjutnya tentang manajemen dana abadi dan peraturannya."
