id: work/fatwa-dar-alifta-leaving-the-mosque-after-the-unified-call-to-prayer
class: work
kind: fatwa
label: { ar: "حكم الخروج من المسجد بعد سماع الأذان الموحَّد", en: "Leaving the mosque after hearing the unified call to prayer", ur: "متحدہ اذان سننے کے بعد مسجد سے نکلنے کا حکم" }
summary:
  ar: "سؤال عن حكم الخروج من المسجد بعد سماع الأذان الموحد، أجابت فيه دار الإفتاء المصرية بأن الأذان الموحد الذي يُرفع من المسجد المركزي ويُبث إلى سائر المساجد جائز شرعًا، ويُعدّ أذانًا لجميع المساجد التي يشملها البث، فيترتب على سماعه ما يترتب على سماع الأذان من الاستعداد للصلاة، فيكره الخروج من المسجد بعده وقبل الإقامة بغير عذر، ويجوز بغير كراهة لعذر أو حاجة كأن يكون إمامًا لمسجد آخر أو خارجًا لحضور مجلس علم. بيّنت الدار فضل الأذان وأجر المؤذنين، وأن الغاية منه الإعلام بدخول الوقت، وأن ولاة الأمر في مصر وغيرها وحّدوا الأذان لكثرة المساجد وتقاربها وما ينشأ عنه من تشويش وتفاوت، وأن مشروع وزارة الأوقاف أذان حي يلقيه مؤذن واحد بعد دخول الوقت ويُبث إلى المساجد، وهو جائز لتأدي المقصود، واستدلت بأثر ابن مسعود في الاجتزاء بأذان الحي وأثر بكير بن الأشج في تسعة مساجد بالمدينة كان أهلها يسمعون تأذين بلال، وبنصوص ابن نجيم وابن قدامة والمرداوي في كفاية أذان واحد للمصر، واشترطت أن يكون الأذان حيًا لا مسجلًا، مع مراعاة فروق التوقيت، وأن يكون تنظيمه موكولًا للجهات المسؤولة. ثم عرضت خلاف الفقهاء في الخروج بعد الأذان لغير عذر بين الكراهة عند جمهور المالكية والشافعية وبعض الحنابلة والحنفية بالتحريمية، والحرمة عند الحنابلة في الصحيح وابن حزم، واتفاقهم على جوازه للعذر."
  en: "A question about leaving the mosque after hearing the unified call to prayer, in which Dar al-Ifta al-Misriyya answered that the unified adhan, raised from a central mosque and broadcast to the other mosques, is permissible in sharia and counts as the adhan of every mosque the broadcast covers, so hearing it there carries the same consequence as hearing any adhan, namely preparing for prayer; leaving the mosque after it and before the iqama without an excuse is disliked, but leaving for an excuse or need, such as being the imam of another mosque or going to a lesson of knowledge, is allowed without dislike. Dar al-Ifta set out the merit of the adhan and the reward of muezzins, explained that its purpose is to announce the entry of the prayer time, and noted that the authorities in Egypt and elsewhere unified the adhan because of the number and closeness of mosques and the confusion and discrepancies that resulted; the Ministry of Endowments' scheme is a live adhan given by one muezzin after the time has entered and broadcast to the mosques, which is permissible because the purpose is achieved. It cited the report of Ibn Mas'ud relying on the neighbourhood's adhan and the report of Bukayr ibn al-Ashajj on nine mosques in Medina whose people heard Bilal's call, together with the statements of Ibn Nujaym, Ibn Qudama and al-Mardawi that one adhan suffices for a town, and required that the adhan be live rather than recorded, with regard for time differences, and that its organisation be left to the responsible authorities. It then set out the jurists' disagreement on leaving after the adhan without excuse, between dislike according to most Malikis, Shafi'is and some Hanbalis, and the Hanafis as prohibitive dislike, and prohibition according to the Hanbalis in the correct view and Ibn Hazm, with agreement that leaving for an excuse is allowed."
  ur: "متحدہ اذان سننے کے بعد مسجد سے نکلنے کے حکم کے بارے میں سوال، جس میں دار الافتاء مصر نے جواب دیا کہ متحدہ اذان، جو مرکزی مسجد سے دی جاتی اور باقی مساجد میں نشر ہوتی ہے، شرعاً جائز ہے اور نشریات میں شامل تمام مساجد کی اذان شمار ہوتی ہے، لہٰذا اسے سننے پر وہی اثر ہے جو کسی اذان کو سننے پر ہے، یعنی نماز کی تیاری؛ اس کے بعد اور اقامت سے پہلے بغیر عذر مسجد سے نکلنا مکروہ ہے، لیکن عذر یا حاجت کے لیے، جیسے دوسری مسجد کا امام ہونا یا علم کی مجلس میں جانا، بلا کراہت جائز ہے۔ دار الافتاء نے اذان کی فضیلت اور مؤذنوں کے اجر کو بیان کیا، واضح کیا کہ اس کا مقصد وقت کے داخل ہونے کی اطلاع ہے، اور ذکر کیا کہ مصر اور دیگر ممالک کے حکام نے مساجد کی کثرت اور قربت اور اس سے پیدا ہونے والی آوازوں کی گڑبڑ اور فرق کی وجہ سے اذان کو متحد کیا؛ وزارتِ اوقاف کا منصوبہ ایک براہِ راست اذان ہے جو ایک مؤذن وقت داخل ہونے کے بعد دیتا ہے اور مساجد میں نشر ہوتی ہے، جو جائز ہے کیونکہ مقصد حاصل ہوتا ہے۔ اس نے ابن مسعود کے محلے کی اذان پر اکتفا کے اثر اور بکیر بن اشج کے مدینہ کی نو مساجد کے اثر سے استدلال کیا جن کے لوگ بلال کی اذان سنتے تھے، اور ابن نجیم، ابن قدامہ اور مرداوی کے اقوال سے کہ شہر کے لیے ایک اذان کافی ہے، اور شرط لگائی کہ اذان براہِ راست ہو نہ کہ ریکارڈ شدہ، اوقات کے فرق کے لحاظ کے ساتھ، اور اس کا انتظام ذمہ دار اداروں کے سپرد ہو۔ پھر اس نے بغیر عذر اذان کے بعد نکلنے میں فقہا کا اختلاف بیان کیا: جمہور مالکیہ، شافعیہ اور بعض حنابلہ کے نزدیک کراہت، حنفیہ کے نزدیک کراہتِ تحریمی، اور حنابلہ کے صحیح قول اور ابن حزم کے نزدیک حرمت، عذر کے لیے جواز پر اتفاق کے ساتھ۔"
