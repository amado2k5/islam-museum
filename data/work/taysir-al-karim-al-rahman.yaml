label: { ar: "تيسير الكريم الرحمن في تفسير كلام المنان", en: "Taysir al-Karim al-Rahman fi Tafsir Kalam al-Mannan (Tafsir al-Sa'di)", ur: "تیسیر الکریم الرحمن فی تفسیر کلام المنان (تفسیرِ سعدی)" }
summary:
  ar: "تفسير عبد الرحمن بن ناصر السعدي (ت 1376هـ)، بدأه سنة 1342هـ، وقصد فيه أن يكون «المعنى هو المقصود» دون الاشتغال بحل الألفاظ والإعراب والقصص؛ طُبع جزؤه الخامس في حياته سنة 1375هـ بالمطبعة السلفية وبقيته بعد وفاته، ثم أعاد عبد الرحمن اللويحق تحقيقه على نسختيه الخطيتين."
  en: "The commentary of Abd al-Rahman ibn Nasir al-Sa'di (d. 1376 AH), begun in 1342 AH, written so that 'the meaning is the aim' rather than lexical analysis, grammar or stories; its fifth volume was printed in his lifetime in 1375 AH by al-Matba'a al-Salafiyya and the rest after his death, and Abd al-Rahman al-Luwayhiq later re-edited it from its two manuscripts."
  ur: "عبد الرحمن بن ناصر السعدی (م 1376ھ) کی تفسیر، جو 1342ھ میں شروع ہوئی، اور جس میں مقصد یہ رکھا گیا کہ «معنی ہی مقصود ہو»، الفاظ کی تحلیل، اعراب یا قصوں میں مشغول ہوئے بغیر؛ اس کی پانچویں جلد ان کی زندگی میں 1375ھ میں المطبعۃ السلفیہ سے چھپی اور باقی ان کی وفات کے بعد، پھر عبد الرحمن اللویحق نے اسے دونوں مخطوطات پر ازسرِ نو محقق کیا۔"
