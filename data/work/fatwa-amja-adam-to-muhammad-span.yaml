id: work/fatwa-amja-adam-to-muhammad-span
class: work
kind: fatwa
label: { ar: "المدة بين آدم ومحمد", en: "The span between Adam and Muhammad", ur: "آدم اور محمد کے درمیانی مدت", es: "El lapso entre Adán y Mahoma", fr: "L'intervalle entre Adam et Mahomet" }
summary:
  ar: "سأل سائل عن المدة الزمنية من آدم إلى محمد التي تلاحظ عند قراءة السير النبوية. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 21851 بتاريخ 13 نوفمبر 2006)⁩ أنه لا يوجد دليل ثابت في السيرة النبوية حول هذه المدة الزمنية ولا توجد حقائق علمية قطعية حولها وإنما هي مجرد نظريات مختلفة، ونصح السائل ألا يبذل وقته في أمثال هذه الأمور بل يركز على ما فيه النفع في دينه ودنياه."
  en: "A questioner noticed, reading the prophetic biographies, the span from Adam to Muhammad and asked about it. Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 21851, 13 November 2006) answered that no established proof exists in the prophetic biography for this span, nor decisive scientific facts — only differing theories; he counselled the questioner not to spend his time on such matters but to concentrate on what benefits his religion and his world."
  ur: "ایک سائل نے آدم سے محمد تک کی مدت پوچھی۔ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 21851، 13 نومبر 2006)⁩ کے مطابق نہ سیرت میں نہ سائنس میں کوئی قطعی ثبوت ہے — بس نظریات؛ وقت مفید کام میں لگائے۔"
  es: "Un consultante, al leer las biografías proféticas, notó el lapso de tiempo entre Adán y Mahoma y preguntó al respecto. El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.° 21851, 13 de noviembre de 2006) respondió que no existe ninguna prueba fehaciente de este lapso en las biografías proféticas, ni hechos científicos concluyentes, sino solo diferentes teorías. Le aconsejó al consultante que no dedicara su tiempo a tales asuntos, sino que se concentrara en lo que beneficia a su religión y a su mundo."
  fr: "Un lecteur, ayant remarqué l'intervalle entre Adam et Mahomet dans les biographies prophétiques, posa une question à ce sujet. Le Dr Muhammad Mawfiq al-Ghalayini (fatwa n° 21851, 13 novembre 2006) répondit qu'aucune preuve établie ni aucun fait scientifique décisif ne justifient cet intervalle, mais qu'il n'existe que des théories divergentes. Il conseilla à son interlocuteur de ne pas s'attarder sur ces questions et de se concentrer plutôt sur ce qui est bénéfique à sa religion et au monde."
