class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 4: سيرة رسول الله 04 | نظام الجاهلية"
  en: "The Biography of the Messenger of God 2026, episode 4: The System of Jahiliyya"
  ur: "سیرتِ رسول اللہ 2026، قسط 4: جاہلیت کا نظام"
  fr: "La biographie du Messager de Dieu 2026, épisode 4 : Le système de la jahiliyya"
  es: "La biografía del Mensajero de Dios 2026, episodio 4: El sistema de la yahiliyya"
summary:
  ar: "يختتم المجلس الرابع مرحلة ما قبل البعثة. يبين فيه لماذا تهم عادات الجاهلية في فهم القرآن والحديث، ويصف نظام الجاهلية وما أبقاه الإسلام منه، ويقرأ حلف الفضول والزواج من خديجة من سيرة ابن هشام مع تقدير لأخبار ابن إسحاق، ويختم بالباحثين عن دين إبراهيم."
  en: "The fourth session closes the stage before the mission. He explains why pre-Islamic customs matter for reading the Qur'an and hadith, describes the jahiliyya system and what Islam kept of it, reads Hilf al-Fudul and the marriage to Khadija from Ibn Hisham with a grading of Ibn Ishaq's reports, and ends with the seekers of Abraham's religion."
  ur: "چوتھی نشست بعثت سے پہلے کے مرحلے کو ختم کرتی ہے۔ وہ بتاتے ہیں کہ قرآن اور حدیث کو سمجھنے کے لیے جاہلیت کے رسوم کیوں اہم ہیں، جاہلیت کے نظام اور اس میں سے اسلام نے جو باقی رکھا اسے بیان کرتے ہیں، ابن ہشام سے حلفِ فضول اور خدیجہ سے نکاح پڑھتے ہیں اور ابن اسحاق کی روایات کی درجہ بندی کرتے ہیں، اور دینِ ابراہیم کے متلاشیوں پر ختم کرتے ہیں۔"
  fr: "La quatrième séance clôt l'étape qui précède la mission. Il explique pourquoi les coutumes préislamiques comptent pour lire le Coran et les hadiths, décrit le système de la jahiliyya et ce que l'islam en a conservé, lit chez Ibn Hisham le Hilf al-Fudul et le mariage avec Khadija en classant les récits d'Ibn Ishaq, et termine avec les chercheurs de la religion d'Abraham."
  es: "La cuarta sesión cierra la etapa anterior a la misión. Explica por qué las costumbres preislámicas importan para leer el Corán y los hadices, describe el sistema de la yahiliyya y lo que el islam conservó de él, lee en Ibn Hisham el Hilf al-Fudul y el matrimonio con Jadiya con una clasificación de los relatos de Ibn Ishaq, y termina con los buscadores de la religión de Abraham."
