summary:
  ar: "ترجمة منغولية لمعاني القرآن نشرتها رئاسة الشؤون الدينية التركية سنة 2020 هديةً لشعب منغوليا، ترجمها عن العربية مرحباغين صالح، مدرّس العربية، مع المراجع الشرعي بيجّيغين باتوغتوخ والمحرر تاوكين سلطان؛ نشأت فكرتها في الأقلية الكازاخية المسلمة في منغوليا، ولا حواشي فيها سوى إضافات قصيرة بين الأقواس وفهرس للمصطلحات، وتُوزع مجانًا بأعداد كبيرة."
  en: "A Mongolian rendering of the meanings of the Qur'an published by the Turkish Presidency of Religious Affairs in 2020 as a gift to the people of Mongolia, translated from the Arabic by Marhabagayin Salih, a teacher of Arabic, with Bezhzhegiyin Battogtoh as Islamic proofreader and Taukein Sultan as editor; the idea came from Mongolia's Kazakh Muslim minority, it has no notes beyond short bracketed insertions and an index of terms, and it is distributed free in large numbers."
  ur: "قرآن کے معانی کا منگولیائی ترجمہ جو ترکی کی دیانت نے 2020 میں منگولیا کے عوام کے لیے تحفے کے طور پر شائع کیا؛ عربی سے مرحباگین صالح نے ترجمہ کیا، بیجیگین باتوغتوخ نے شرعی نظرِ ثانی کی اور تاوکین سلطان نے تدوین؛ اس کا خیال منگولیا کی قازق مسلم اقلیت سے آیا، اس میں قوسین میں مختصر اضافوں اور اصطلاحات کے اشاریے کے سوا حواشی نہیں، اور یہ بڑی تعداد میں مفت تقسیم ہوتا ہے۔"
