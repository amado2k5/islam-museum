summary:
  ar: "ألبوم استوديو لسامي يوسف صدر في 1 فبراير 2016 عن أندانتي ريكوردز بأربع عشرة أغنية، وسُوّق مجلدا أول لمجموعة «سبيريتيك»؛ فيه قصائد ومدائح مثل «الهمزية» و«يا رسول الله» و«طه»، وأغنية «Ben Yürürüm Yane Yane» التركية من التراث الصوفي، وصدرت لعدد من أغانيه مصوّرات."
  en: "A studio album by Sami Yusuf released on 1 February 2016 by Andante Records with fourteen tracks and marketed as volume 1 of his Spiritique Collection; it includes devotional pieces such as 'Hamziyya', 'Ya Rasul Allah' and 'Taha' and the Turkish 'Ben Yürürüm Yane Yane', with videos for several of them."
  ur: "سامی یوسف کا اسٹوڈیو البم جو یکم فروری 2016 کو اینڈانٹے ریکارڈز سے چودہ ٹریکس کے ساتھ جاری ہوا اور «اسپریٹیک کلیکشن» کی پہلی جلد کہلایا؛ اس میں «ہمزیہ»، «یا رسول اللہ» اور «طٰہٰ» جیسی مدحیں اور ترکی «بن یورورم یانے یانے» شامل ہیں۔"
