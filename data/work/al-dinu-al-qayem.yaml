  en: "Al-Din al-Qayyim (programme)"
  ur: "الدین القیم (پروگرام)"
summary:
  ar: "برنامج من ثلاث عشرة حلقة لعمر عبد الكافي في أرشيف أسابيل، يشرح فيه معنى وصف الدين بأنه «القيّم»، ويتنقل بين العقيدة والأخلاق والتاريخ الإسلامي وغزواته وفتوحه."
  en: "A thirteen-episode programme by Omar Abdelkafy on the Assabile archive, explaining what it means to call the religion 'al-qayyim' (the upright, of supreme worth), and moving between creed, ethics, and Islamic history with its battles and conquests."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا تیرہ اقساط کا پروگرام، جس میں وہ دین کو «القیّم» کہنے کا مطلب سمجھاتے ہیں، اور عقیدہ، اخلاق اور اسلامی تاریخ، اس کے غزوات و فتوحات کے درمیان گفتگو کرتے ہیں۔"
