summary:
  ar: "موقع أخبار إسلامي بريطاني، أقدم لقطة له في أرشيف الإنترنت في 26 ديسمبر 2014، يقدّم نفسه فيها بأنه «أخبار ورأي وتحليل للمسلمين البريطانيين»، بأبواب للمملكة المتحدة والعالم والرأي."
  en: "A British Muslim news site whose earliest archived capture, of 26 December 2014, presents it as 'British Muslim news, opinion, analysis', with UK, world and opinion sections."
  ur: "برطانوی مسلم خبروں کی سائٹ، جس کی سب سے پرانی آرکائیو تصویر 26 دسمبر 2014 کی ہے، اور وہ خود کو «برطانوی مسلم خبریں، رائے، تجزیہ» کہتی ہے۔"
  es: "Un sitio web británico de noticias musulmanas cuya primera captura archivada, del 26 de diciembre de 2014, se presenta como \"Noticias, opinión y análisis de musulmanes británicos\", con secciones de Reino Unido, mundo y opinión."
  fr: "Un site d'information musulman britannique dont la plus ancienne capture d'écran archivée, datée du 26 décembre 2014, le présente comme « Actualités, opinions et analyses musulmanes britanniques », avec des sections Royaume-Uni, monde et opinions."
  tr: "Bir İngiliz İslami haber sitesi, 26 Aralık 2014 tarihli İnternet Arşivi'ndeki en eski anlık görüntüsü olarak, Birleşik Krallık, dünya ve görüş için bölümler içeren \"İngiliz Müslümanları için haber, görüş ve analiz\" olarak kendini tanıtıyor."
  id: "Sebuah situs berita Islam Inggris, yang merupakan snapshot tertua di Internet Archive pada 26 Desember 2014, menampilkan dirinya sebagai \"berita, opini, dan analisis untuk Muslim Inggris,\" dengan bagian untuk Inggris, dunia, dan opini."
