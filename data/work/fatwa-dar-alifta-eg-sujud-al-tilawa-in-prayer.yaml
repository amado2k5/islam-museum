summary:
  ar: "سائل سأل عن كيفية النزول لسجود التلاوة أثناء الصلاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22162)⁩ أن سجود التلاوة سنة مؤكدة داخل الصلاة وخارجها ومن مرّ بآية سجدة أثناء التلاوة في الصلاة فإنه يسجد، وبيّن الجواب صفة النزول والرفع منه."
  en: "A questioner asked how to go down for the prostration of recitation during prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22162) answered that the prostration of recitation is a confirmed sunna inside and outside prayer, and whoever passes a prostration verse while reciting in prayer prostrates; the answer sets out how to go down and rise."
  ur: "ایک سائل نے نماز کے دوران سجدۃ تلاوت کے لیے جھکنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22162)⁩ نے جواب دیا کہ سجدۃ تلاوت نماز کے اندر اور باہر مؤکدہ سنت ہے اور جو نماز میں تلاوت کے دوران آیتِ سجدہ سے گزرے وہ سجدہ کرے؛ جواب میں جھکنے اور اٹھنے کی صفت بیان ہوئی۔"
  es: "Un consultante preguntó cómo realizar la postración de recitación durante la oración. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22162) respondió que la postración de recitación es una sunna confirmada dentro y fuera de la oración, y que quien recita un versículo de postración en oración se postra; la respuesta detalla cómo realizar la postración y cómo levantarse."
