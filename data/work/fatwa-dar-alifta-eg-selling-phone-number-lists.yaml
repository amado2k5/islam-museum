label: { ar: "حكم بيع قائمة بأرقام الهواتف لمساعدة الآخرين في التواصل مع أصحابها", en: "Selling a list of customers' phone numbers to others", ur: "گاہکوں کے فون نمبروں کی فہرست بیچنا" }
summary:
  ar: "سائل سأل عن عمل قائمة بأرقام هواتف العملاء وبياناتهم وإعطائها لجهة أخرى مقابل مال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21664)⁩ أنه لا يجوز شرعًا قيام بعض العاملين بعمل قائمة بأرقام هواتف العملاء وبياناتهم وإعطائها لجهة أخرى على ما فصّل الجواب من علة المنع."
  en: "A questioner asked about compiling a list of customers' phone numbers and data and giving it to another party for money. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21664) answered that employees doing this is not permitted in the sharia — the answer explains why."
  ur: "ایک سائل نے گاہکوں کے فون نمبر اور معلومات کی فہرست بنا کر رقم کے عوض کسی اور کو دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21664)⁩ نے جواب دیا کہ یہ جائز نہیں — جواب میں منع کی وجہ بیان ہوئی۔"
