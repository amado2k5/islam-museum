id: work/fatwa-dar-alifta-eg-selling-phone-number-lists
class: work
kind: fatwa
label: { ar: "حكم بيع قائمة بأرقام الهواتف لمساعدة الآخرين في التواصل مع أصحابها", en: "Selling a list of customers' phone numbers to others", ur: "گاہکوں کے فون نمبروں کی فہرست بیچنا", es: "Vender una lista de números de teléfono de clientes a otras personas.", fr: "Vendre une liste de numéros de téléphone de clients à des tiers", tr: "Sahipleriyle iletişim kurmasına yardımcı olmak için telefon numaraları listesinin satışına ilişkin karar", id: "Putusan tentang penjualan daftar nomor telepon untuk membantu orang lain berkomunikasi dengan pemiliknya" }
summary:
  ar: "سائل سأل عن عمل قائمة بأرقام هواتف العملاء وبياناتهم وإعطائها لجهة أخرى مقابل مال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21664)⁩ أنه لا يجوز شرعًا قيام بعض العاملين بعمل قائمة بأرقام هواتف العملاء وبياناتهم وإعطائها لجهة أخرى على ما فصّل الجواب من علة المنع."
  en: "A questioner asked about compiling a list of customers' phone numbers and data and giving it to another party for money. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21664) answered that employees doing this is not permitted in the sharia — the answer explains why."
  ur: "ایک سائل نے گاہکوں کے فون نمبر اور معلومات کی فہرست بنا کر رقم کے عوض کسی اور کو دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21664)⁩ نے جواب دیا کہ یہ جائز نہیں — جواب میں منع کی وجہ بیان ہوئی۔"
  es: "Un usuario preguntó sobre la posibilidad de recopilar una lista de números de teléfono y datos de clientes para entregársela a terceros a cambio de dinero. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21664) respondió que esta práctica no está permitida por la sharia; la respuesta explica el motivo."
  fr: "Une personne a posé une question concernant la compilation d'une liste de numéros de téléphone et de données clients, puis leur revente à un tiers. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21664) a répondu que cette pratique est interdite par la charia et en explique les raisons."
  tr: "Bir soru soran kişi, müşterilerin telefon numaraları ve verilerinin listesini yapıp bunları para karşılığında başka bir tarafa vermeyi sordu. Mısır'ın Dar Al-Ifta'sı (Büyük Müftü Dr. Nazeer Muhammad Ayad, Fetva No. 21664), bazı çalışanların müşterilerin telefon numaraları ve verilerinden oluşan bir liste hazırlayıp başka bir tarafa vermesinin dini olarak kabul edilmediğini yanıtladı; bu da yasak gerekçesiyle ilgili yanıtta detaylandırıldı."
  id: "Seorang penanya menanyakan tentang membuat daftar nomor telepon dan data pelanggan lalu memberikannya kepada pihak lain sebagai imbalan uang. Dar Al-Ifta Mesir (Mufti Agung Dr. Nazeer Muhammad Ayad, Fatwa No. 21664) menjawab bahwa secara agama tidak diperbolehkan bagi beberapa karyawan untuk membuat daftar nomor telepon dan data pelanggan lalu memberikannya kepada pihak lain, seperti yang dijelaskan dalam jawaban mengenai alasan pelarangan tersebut."
