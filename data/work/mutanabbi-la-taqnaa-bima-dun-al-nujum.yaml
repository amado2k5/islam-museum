label: { ar: "قصيدة المتنبي «إذا غامرت في شرف مروم»", en: "Al-Mutanabbi's ode 'If you venture for a noble aim'", es: "La oda de Al-Mutanabbi: \"Si te aventuras por un noble propósito\".", fr: "L'ode d'Al-Mutanabbi « Si vous vous aventurez pour un noble but »", ur: "المتنبی کا کلام 'اگر تم نیک مقصد کے لیے کوشش کرتے ہو'", tr: "Al-Mutanabbi'nin şiiri 'Eğer Maroom'un Onuruna Girersem", id: "Puisi Al-Mutanabbi 'Jika Aku Berani Merawat Kehormatan Maroom'" }
summary:
  ar: "قصيدة من الوافر على روي الميم فيها البيت المشهور «فلا تقنع بما دون النجوم»؛ يقدّم لها الديوان بقوله إنها قيلت حين كُبست أنطاكية وهو فيها فقُتل الطخرور وأمه {{cite:diwan-mutanabbi-dar-beirut-1983 p.232}}."
  en: "An ode in the wafir metre on the rhyme mim containing the famous line \"do not be content with anything below the stars\"; the edition introduces it with the raid on Antioch while the poet was there, in which al-Tukhrur and his mother were killed {{cite:diwan-mutanabbi-dar-beirut-1983 p.232}}."
  es: "Una oda en metro wafir sobre la rima mim que contiene el famoso verso \"no te conformes con nada que esté por debajo de las estrellas\"; la edición la introduce con el ataque a Antioquía mientras el poeta estaba allí, en el que murieron al-Tukhrur y su madre {{cite:diwan-mutanabbi-dar-beirut-1983 p.232}}."
  fr: "Une ode en mètre wafir sur la rime mim contenant le vers célèbre « ne te contente de rien en dessous des étoiles »; l'édition l'introduit par le raid sur Antioche alors que le poète s'y trouvait, au cours duquel al-Tukhrur et sa mère furent tués {{cite:diwan-mutanabbi-dar-beirut-1983 p.232}}."
  ur: "رائم میم پر وفیر میٹر میں ایک اوڈ جس میں مشہور سطر ہے \"ستاروں کے نیچے کسی چیز پر راضی نہ ہو\"؛ ایڈیشن میں اس کا تعارف انطاکیہ پر چھاپے کے ساتھ کیا گیا ہے جب شاعر وہاں تھا، جس میں التخیر اور اس کی والدہ کو قتل کر دیا گیا تھا {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 232}}۔"
  tr: "Al-Wafir'in 'M' harfinin anlatımı üzerine yazdığı bir şiiri, ünlü şiiri içerir: 'Yıldızlardan daha az olanla yetinmeyin'; Diwan, bu şiirin Antakya yakalandığında söylendiğini söyleyerek başlar; Al-Takhrour ve annesi öldürülürken {{cite:diwan-mutanabbi-dar-beirut-1983 s.232}}"
  id: "Sebuah puisi karya Al-Wafir tentang narasi 'M', yang memuat bait terkenal: 'Jadi jangan puas dengan apa yang kurang dari bintang-bintang'; Diwan memperkenalkannya dengan mengatakan bahwa puisi itu diucapkan ketika Antiokhia ditangkap saat ia berada di sana, membunuh Al-Takhrour dan ibunya {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.232}}."
