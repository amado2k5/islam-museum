label: { ar: "قصيدة المتنبي «إذا غامرت في شرف مروم»", en: "Al-Mutanabbi's ode 'If you venture for a noble aim'" }
summary:
  ar: "قصيدة من الوافر على روي الميم فيها البيت المشهور «فلا تقنع بما دون النجوم»؛ يقدّم لها الديوان بقوله إنها قيلت حين كُبست أنطاكية وهو فيها فقُتل الطخرور وأمه {{cite:diwan-mutanabbi-dar-beirut-1983 p.232}}."
  en: "An ode in the wafir metre on the rhyme mim containing the famous line \"do not be content with anything below the stars\"; the edition introduces it with the raid on Antioch while the poet was there, in which al-Tukhrur and his mother were killed {{cite:diwan-mutanabbi-dar-beirut-1983 p.232}}."
