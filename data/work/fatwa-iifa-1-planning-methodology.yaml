id: work/fatwa-iifa-1-planning-methodology
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 1 بشأن تقرير شعبة التخطيط ومنهجية البحث", en: "IIFA resolution 1 on the planning division's report and research methodology", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 1: منصوبہ بندی شعبے کی رپورٹ اور تحقیقی منہج" }
summary:
  ar: "أول قرار صدر عن مجمع الفقه الإسلامي الدولي في دورته الأولى بمكة المكرمة ⁦(26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. استعرض تقرير شعبة التخطيط وقرر أن يكون البحث في المسائل والواقعات الحادثة وفق نظر يعتمد قوة الدليل الشرعي ويهتم بتحقيق المقاصد الشرعية المعتبرة ويهدف إلى التيسير ورفع الحرج ضمن قواعد الشرعية وضوابطها، مع الاستئناس بالبحوث الجادة في المذاهب الفقهية جميعها من مصادرها الأصلية، والتقيد بالواقعية والفقه المقارن والموضوعية والتجرد والسماحة في مواطن الاختلاف، وأن يصدر التقرير بغالبية الآراء مع إبراز وجهة نظر المخالف."
  en: "The first resolution of the International Islamic Fiqh Academy, at its inaugural session in Mecca (26–29 Safar 1405, 19–22 November 1984). Reviewing the planning division's report, it resolved that research into issues and new events rely on the strength of sharia evidence, pursue the recognised aims of the law, and seek ease and the lifting of hardship within sharia rules — drawing on serious studies across all schools from their original sources, keeping to realism, comparative fiqh, objectivity and tolerance amid disagreement, with reports issued by majority opinion alongside the minority view."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی پہلی قرارداد، مکہ میں پہلی مجلس ⁦(26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩ میں۔ اس نے فیصلہ کیا کہ مسائل اور نئے واقعات کی تحقیق شرعی دلیل کی قوت، شریعت کے مقاصد اور شرعی قواعد میں آسانی پر قائم ہو، تمام مذاہب کی معتبر کتب سے استفادہ ہو، تقابلی فقہ، موضوعیت اور اختلاف میں رواداری برتی جائے، اور رپورٹ اکثریت کے ساتھ اقلیتی رائے کے ساتھ جاری ہو۔"
