label: { ar: "قرار مجمع الفقه الإسلامي الدولي 1 بشأن تقرير شعبة التخطيط ومنهجية البحث", en: "IIFA resolution 1 on the planning division's report and research methodology", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 1: منصوبہ بندی شعبے کی رپورٹ اور تحقیقی منہج", es: "Resolución 1 de la IIFA sobre el informe de la división de planificación y la metodología de investigación.", fr: "Résolution 1 de l'IIFA relative au rapport et à la méthodologie de recherche de la division de la planification", tr: "Uluslararası İslami Fiqh Akademisi 1'in Planlama Bölümü raporu ve araştırma metodolojisi hakkında kararı", id: "Keputusan Akademi Fiqh Islam Internasional 1 mengenai laporan Divisi Perencanaan dan metodologi penelitian" }
summary:
  ar: "أول قرار صدر عن مجمع الفقه الإسلامي الدولي في دورته الأولى بمكة المكرمة ⁦(26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. استعرض تقرير شعبة التخطيط وقرر أن يكون البحث في المسائل والواقعات الحادثة وفق نظر يعتمد قوة الدليل الشرعي ويهتم بتحقيق المقاصد الشرعية المعتبرة ويهدف إلى التيسير ورفع الحرج ضمن قواعد الشرعية وضوابطها، مع الاستئناس بالبحوث الجادة في المذاهب الفقهية جميعها من مصادرها الأصلية، والتقيد بالواقعية والفقه المقارن والموضوعية والتجرد والسماحة في مواطن الاختلاف، وأن يصدر التقرير بغالبية الآراء مع إبراز وجهة نظر المخالف."
  en: "The first resolution of the International Islamic Fiqh Academy, at its inaugural session in Mecca (26–29 Safar 1405, 19–22 November 1984). Reviewing the planning division's report, it resolved that research into issues and new events rely on the strength of sharia evidence, pursue the recognised aims of the law, and seek ease and the lifting of hardship within sharia rules — drawing on serious studies across all schools from their original sources, keeping to realism, comparative fiqh, objectivity and tolerance amid disagreement, with reports issued by majority opinion alongside the minority view."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی پہلی قرارداد، مکہ میں پہلی مجلس ⁦(26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩ میں۔ اس نے فیصلہ کیا کہ مسائل اور نئے واقعات کی تحقیق شرعی دلیل کی قوت، شریعت کے مقاصد اور شرعی قواعد میں آسانی پر قائم ہو، تمام مذاہب کی معتبر کتب سے استفادہ ہو، تقابلی فقہ، موضوعیت اور اختلاف میں رواداری برتی جائے، اور رپورٹ اکثریت کے ساتھ اقلیتی رائے کے ساتھ جاری ہو۔"
  es: "La primera resolución de la Academia Internacional de Fiqh Islámico, en su sesión inaugural en La Meca (26-29 Safar 1405, 19-22 de noviembre de 1984). Tras revisar el informe de la división de planificación, resolvió que la investigación sobre los problemas y los nuevos acontecimientos se basa en la solidez de las pruebas de la sharia, persigue los objetivos reconocidos de la ley y busca la facilidad y la eliminación de las dificultades dentro de las normas de la sharia, recurriendo a estudios serios de todas las escuelas a partir de sus fuentes originales, manteniendo el realismo, el fiqh comparado, la objetividad y la tolerancia en medio del desacuerdo, con informes emitidos por la opinión mayoritaria junto con la opinión minoritaria."
  fr: "La première résolution de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa session inaugurale à La Mecque (26-29 Safar 1405, 19-22 novembre 1984), examinant le rapport de la division de planification, stipule que la recherche sur les questions et les événements nouveaux doit s'appuyer sur la solidité des preuves issues de la charia, poursuivre les objectifs reconnus de la loi et rechercher l'allègement des contraintes dans le respect des règles de la charia. Cette résolution doit s'appuyer sur des études approfondies menées dans toutes les écoles à partir de leurs sources originales, en privilégiant le réalisme, la jurisprudence comparée, l'objectivité et la tolérance face aux désaccords, et en publiant des rapports reflétant l'opinion majoritaire conjointement à l'opinion minoritaire."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Mekke'deki ilk oturumunda (26–29 Saf 1405 H, 19–22 Kasım 1984) yayımlanan ilk karar. Planlama Bölümü raporu, konular ve olaylar üzerine araştırmaların hukuki kanıtların gücüne dayalı bir bakış açısına dayanması, tanınmış hukuki hedeflere ulaşmaya odaklanması ve Şeriat kuralları ve düzenlemeleri içindeki zorlukları kolaylaştırmayı ve ortadan kaldırmayı amaçlaması, gerçekçiliğe bağlılık, karşılaştırmalı fıkıhat, nesnellik, tarafsızlık ve anlaşmazlık alanlarında hoşgörü dikkate alınması gerektiğine karar vermiştir. Rapor, çoğunluk görüşleriyle ve karşıt görüşleri vurgulamalı olmalıdır."
  id: "Keputusan pertama yang dikeluarkan oleh International Islamic Fiqh Academy pada sesi pertamanya di Mekah (26–29 Safar 1405 H, 19–22 November 1984 M). Laporan Divisi Perencanaan meninjau dan memutuskan bahwa penelitian tentang isu dan insiden harus didasarkan pada perspektif berdasarkan kekuatan bukti hukum, dengan fokus pada pencapaian tujuan hukum yang diakui, serta bertujuan memfasilitasi dan menghilangkan kesulitan dalam aturan dan regulasi Syariah, dengan merujuk pada penelitian serius di semua aliran yurisprudensi dari sumber aslinya, kepatuhan pada realisme, yurisprudensi komparatif, objektivitas, ketidakberpihakan, dan toleransi di area yang berbeda pendapat. Laporan harus diterbitkan dengan mayoritas pendapat dan menyoroti sudut pandang yang berlawanan."
