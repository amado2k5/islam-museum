id: work/fatwa-binbaz-funeral-of-one-who-took-his-own-life
class: work
kind: fatwa
label: { ar: "حكم الغسل والصلاة على قاتل نفسه", en: "Washing and praying over one who took his own life", ur: "خودکشی کرنے والے کا غسل اور نمازِ جنازہ" }
summary:
  ar: "سؤال عن غسل من قتل نفسه والصلاة عليه، أجاب فيه ابن باز بأنه يُغسَّل ويُصلّى عليه ويُدفن مع المسلمين. أجاب ابن باز بأنه يُغسَّل ويُكفَّن ويُصلّى عليه ويُدفن مع المسلمين، لأن قتل النفس معصية لا كفر. ورأى أنه يحسن أن يترك الإمام الأكبر أو القاضي أو أمير البلد ومن له مكانة الصلاة عليه، إنكارًا للفعل وإعلانًا لخطئه، لئلا يُظن أنه راضٍ به. وقال إن بعض المسلمين يصلون عليه مع ذلك."
  en: "A question on washing and praying over a person who took his own life, in which Ibn Baz answered that he is washed, prayed over and buried among the Muslims. Ibn Baz answered that he is washed, shrouded, prayed over and buried among the Muslims, because killing oneself is a sin, not unbelief. He held that it is good for the ruler, the judge, the governor of the town or others of standing to refrain from leading his funeral prayer, as a public disavowal of the act, so that no one thinks they approve of it. He said that other Muslims still pray over him."
  ur: "خودکشی کرنے والے کے غسل اور نمازِ جنازہ کے بارے میں سوال، جس میں ابن باز نے کہا کہ اسے غسل دیا جائے، اس کی نماز پڑھی جائے اور مسلمانوں کے ساتھ دفن کیا جائے۔ ابن باز نے جواب دیا کہ اسے غسل اور کفن دیا جائے، اس کی نماز پڑھی جائے اور مسلمانوں کے ساتھ دفن کیا جائے، کیونکہ اپنی جان لینا گناہ ہے، کفر نہیں۔ ان کے نزدیک اچھا یہ ہے کہ حاکم، قاضی، شہر کا امیر یا کوئی صاحبِ حیثیت اس کی نماز سے رک جائے تاکہ اس فعل پر انکار ظاہر ہو اور یہ گمان نہ ہو کہ وہ اس سے راضی ہیں۔ انہوں نے کہا کہ اس کے باوجود دوسرے مسلمان اس کی نماز پڑھیں۔"
