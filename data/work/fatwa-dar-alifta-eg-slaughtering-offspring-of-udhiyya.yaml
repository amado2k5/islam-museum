id: work/fatwa-dar-alifta-eg-slaughtering-offspring-of-udhiyya
class: work
kind: fatwa
label: { ar: "حكم ذبح ولد الأضحية", en: "Slaughtering the offspring of an udhiyya animal", ur: "قربانی کے جانور کے بچے کو ذبح کرنا", es: "Sacrificar la descendencia de un animal udhiyya", fr: "Abattage des petits d'un animal udhiyya", tr: "Kurban edilen yavruların katledilmesine ilişkin karar", id: "Memutuskan tentang penyembelihan keturunan korban" }
summary:
  ar: "سائل سأل عن شاة أو ناقة أو بقرة عشراء اشتراها مريد التضحية فولدت قبل وقت الذبح هل يذبح ولدها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20813)⁩ أنه إذا اشترى مريد التضحية شاة أو ناقة أو بقرة عشراء للأضحية فولدت قبل وقت الذبح فلا يذبح ولدها على ما فصّل الجواب."
  en: "A questioner asked about a pregnant sheep, camel or cow bought for udhiyya that gave birth before slaughter time — is its young slaughtered? Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20813) answered that the offspring is not slaughtered — as the answer details."
  ur: "ایک سائل نے قربانی کے لیے خریدی حامل بھیڑ اونٹنی یا گائے کے بارے میں پوچھا جس نے ذبح سے پہلے بچہ دیا — کیا بچہ ذبح ہوگا؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20813)⁩ نے جواب دیا کہ بچہ ذبح نہیں ہوتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre una oveja, camella o vaca preñada comprada para udhiyya que parió antes de la hora del sacrificio: ¿se sacrifica a sus crías? El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20813) respondió que la descendencia no se sacrifica, como se detalla en la respuesta."
  fr: "Une personne a posé la question suivante: qu’en est-il d’une brebis, d’une chamelle ou d’une vache gestante achetée pour l’udhiyya et ayant mis bas avant l’heure d’abattage ? Le petit doit-il être abattu ? La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20813) a répondu que non, comme le précise la réponse."
  tr: "Bir soru soran, kurban adanının satın aldığı ve kesim zamanından önce doğan bir koyun, dişi deve veya inek hakkında sorulduğunda—yavru kesim yapılmalı mı? Mısır Fetva Evi (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 20813), kurban edilen adamın kesim zamanından önce doğan bir koyun, dişi deve veya 'aşra' ineği satın alması durumunda, yavruları kesilmediğini, yanıtta ayrıntılı olarak belirtildiği gibi, yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang domba, unta betina, atau sapi yang dibeli oleh pemuja korban dan lahir sebelum waktu penyembelihan—apakah keturunannya akan disembelih? Fatwa House Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20813) menjawab bahwa jika pemuja korban membeli domba, unta betina, atau sapi 'ashra' untuk pengorbanan yang lahir sebelum waktu penyembelihan, keturunannya tidak disembelih, seperti yang dijelaskan dalam jawaban."
