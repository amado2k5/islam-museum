label:
  ar: "الحقوق ⁦(سلسلة خطب)⁩"
  en: "Al-Huquq: Rights (sermon series)"
  ur: "الحقوق ⁦(خطبات کا سلسلہ)⁩"
  es: "Al-Huquq: Derechos (serie de sermones)"
  fr: "Al-Huquq: Les droits (série de sermons)"
  tr: "Haklar (Konuşma Serisi)"
  id: "Hak (Seri Pidato)"
summary:
  ar: "سلسلة من خمس حلقات لعمر عبد الكافي في أرشيف أسابيل، ألقاها في جُمَع متتالية عن الحقوق: حقوق الزوجين، وحق المسلم على أخيه، وحقوق الوالدين، وحقوق الأبناء."
  en: "A five-episode series by Omar Abdelkafy on the Assabile archive, given on successive Fridays, on rights: the rights of husband and wife, the right of a Muslim over his brother, the rights of parents, and the rights of children."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا پانچ اقساط کا سلسلہ، جو انہوں نے لگاتار جمعوں میں حقوق پر دیا: میاں بیوی کے حقوق، مسلمان کا اپنے بھائی پر حق، والدین کے حقوق اور اولاد کے حقوق۔"
  es: "Una serie de cinco episodios de Omar Abdelkafy, basada en el archivo de Assabile y emitida los viernes consecutivos, sobre los derechos: los derechos del marido y la mujer, el derecho de un musulmán sobre su hermano, los derechos de los padres y los derechos de los hijos."
  fr: "Une série en cinq épisodes d'Omar Abdelkafy sur les archives Assabile, diffusée chaque vendredi, sur les droits: les droits du mari et de la femme, le droit d'un musulman sur son frère, les droits des parents et les droits des enfants."
  tr: "Asabel arşivinde Omar Abdelkafi tarafından hazırlanan beş bölümlük bir seri, haklar üzerine bir dizi derlemede sunulmuştur: eşlerin hakları, bir Müslümanın kardeşi üzerindeki hakları, ebeveynlerin hakları ve çocukların hakları."
  id: "Seri lima episode oleh Omar Abdelkafi di arsip Asabel, disajikan dalam serangkaian koleksi tentang hak: hak pasangan, hak Muslim atas saudaranya, hak orang tua, dan hak anak-anak."
