summary:
  ar: "سلسلة من خمس حلقات لعمر عبد الكافي في أرشيف أسابيل، ألقاها في جُمَع متتالية عن الحقوق: حقوق الزوجين، وحق المسلم على أخيه، وحقوق الوالدين، وحقوق الأبناء."
  en: "A five-episode series by Omar Abdelkafy on the Assabile archive, given on successive Fridays, on rights: the rights of husband and wife, the right of a Muslim over his brother, the rights of parents, and the rights of children."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا پانچ اقساط کا سلسلہ، جو انہوں نے لگاتار جمعوں میں حقوق پر دیا: میاں بیوی کے حقوق، مسلمان کا اپنے بھائی پر حق، والدین کے حقوق اور اولاد کے حقوق۔"
