id: work/fatwa-dar-alifta-eg-online-currency-exchange
class: work
kind: fatwa
label: { ar: "حكم بيع العملات عبر المنصات الإلكترونية", en: "Exchanging currencies on electronic platforms", ur: "الیکٹرانک پلیٹ فارم پر کرنسیوں کا تبادلہ", es: "Intercambio de divisas en plataformas electrónicas", fr: "Échange de devises sur les plateformes électroniques", tr: "Elektronik platformlar üzerinden para satışına ilişkin karar", id: "Keputusan tentang penjualan mata uang melalui platform elektronik" }
summary:
  ar: "سائل سأل عن استبدال العملات عبر الإنترنت والمنصات الإلكترونية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22039)⁩ أن استبدال العملات عبر الإنترنت جائز شرعًا شريطة أن يكون عن طريق القنوات الإلكترونية المرخص بتداول العملة من خلالها على ما فصّل الجواب."
  en: "A questioner asked about exchanging currencies over the internet on electronic platforms. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22039) answered that currency exchange online is lawful provided it is through electronic channels licensed for currency trading, as the answer details."
  ur: "ایک سائل نے انٹرنیٹ پر الیکٹرانک پلیٹ فارمز کے ذریعے کرنسیوں کے تبادلے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22039)⁩ نے جواب دیا کہ آن لائن کرنسی کا تبادلہ جائز ہے بشرطیکہ ایسے مجاز الیکٹرانک چینلز سے ہو جہاں کرنسی کی ٹریڈنگ کی اجازت ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre el intercambio de divisas a través de plataformas electrónicas en internet. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22039) respondió que el intercambio de divisas en línea es legal siempre que se realice a través de canales electrónicos autorizados para el comercio de divisas, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les échanges de devises sur internet via des plateformes électroniques. L'autorité égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22039) a répondu que les échanges de devises en ligne sont licites à condition d'être effectués par le biais de canaux électroniques agréés pour le commerce des devises, comme le précise la réponse."
  tr: "Bir soru soran kişi çevrimiçi ve elektronik platformlarda para değişimi hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22039), çevrimiçi para değişiminin, döviz ticaretine izin verilen lisanslı elektronik kanallar üzerinden yapılması koşuluyla dini olarak izin verildiğini yanıtladı; bu da yanıtta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang pertukaran mata uang secara online dan di platform elektronik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22039) menjawab bahwa menukar mata uang secara online diperbolehkan secara agama, asalkan dilakukan melalui saluran elektronik berlisensi yang memungkinkan perdagangan mata uang, seperti yang dijelaskan dalam jawaban."
