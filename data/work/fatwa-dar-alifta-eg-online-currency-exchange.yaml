label: { ar: "حكم بيع العملات عبر المنصات الإلكترونية", en: "Exchanging currencies on electronic platforms", ur: "الیکٹرانک پلیٹ فارم پر کرنسیوں کا تبادلہ" }
summary:
  ar: "سائل سأل عن استبدال العملات عبر الإنترنت والمنصات الإلكترونية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22039)⁩ أن استبدال العملات عبر الإنترنت جائز شرعًا شريطة أن يكون عن طريق القنوات الإلكترونية المرخص بتداول العملة من خلالها على ما فصّل الجواب."
  en: "A questioner asked about exchanging currencies over the internet on electronic platforms. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22039) answered that currency exchange online is lawful provided it is through electronic channels licensed for currency trading, as the answer details."
  ur: "ایک سائل نے انٹرنیٹ پر الیکٹرانک پلیٹ فارمز کے ذریعے کرنسیوں کے تبادلے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22039)⁩ نے جواب دیا کہ آن لائن کرنسی کا تبادلہ جائز ہے بشرطیکہ ایسے مجاز الیکٹرانک چینلز سے ہو جہاں کرنسی کی ٹریڈنگ کی اجازت ہو، جیسا کہ جواب میں تفصیل ہے۔"
