id: work/fatwa-aliftaa-jo-tayammum-in-severe-cold
class: work
kind: fatwa
label: { ar: "التيمم بدل الغسل لشدة البرد", en: "Tayammum instead of ghusl in severe cold", ur: "شدید سردی میں غسل کے بجائے تیمم" }
summary:
  ar: "سؤال عن التيمم بدل الغسل لشدة البرد، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز لمن لا يستطيع استعمال الماء لمرض، أو وجده باردًا وتعذر تسخينه وكان يتضرر به، مع وجوب قضاء ما صلاه بالتيمم. أجابت الدائرة بأن من كان مريضًا لا يستطيع استعمال الماء، أو وجد الماء باردًا وتعذر عليه تسخينه وكان يتضرر باستعماله، جاز له التيمم. وقالت إن عليه قضاء ما صلاه بالتيمم في هذه الحال، لأنه في مكان يندر فيه فقد الماء."
  en: "A question about performing tayammum instead of ghusl because of severe cold, in which Jordan's General Iftaa Department answered that it is permitted for someone whose illness prevents using water, or who finds the water cold, cannot heat it and would be harmed by it, but that prayers performed with that tayammum must be made up. The Department answered that someone who is ill and cannot use water, or who finds the water cold, cannot heat it and would be harmed by using it, may perform tayammum. It said that such a person must make up the prayers performed with tayammum in this case, because he is in a place where lack of water is rare."
  ur: "شدید سردی کی وجہ سے غسل کے بجائے تیمم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ اس شخص کے لیے جائز ہے جو بیماری کی وجہ سے پانی استعمال نہ کر سکے، یا پانی ٹھنڈا پائے، اسے گرم نہ کر سکے اور اس سے نقصان ہو، البتہ اس تیمم سے پڑھی گئی نمازوں کی قضا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو بیمار ہو اور پانی استعمال نہ کر سکے، یا پانی ٹھنڈا پائے، اسے گرم کرنا ممکن نہ ہو اور اس کے استعمال سے نقصان ہو، وہ تیمم کر سکتا ہے۔ اس نے کہا کہ اس صورت میں تیمم سے پڑھی گئی نمازوں کی قضا اس پر واجب ہے، کیونکہ وہ ایسی جگہ ہے جہاں پانی کا نہ ملنا نادر ہے۔"
