id: work/fatwa-aliftaa-jo-tayammum-in-severe-cold
class: work
kind: fatwa
label: { ar: "التيمم بدل الغسل لشدة البرد", en: "Tayammum instead of ghusl in severe cold", ur: "شدید سردی میں غسل کے بجائے تیمم", es: "Tayammum en lugar de ghusl en caso de resfriado fuerte", fr: "Tayammum au lieu de ghusl par grand froid", tr: "Yoğun soğuk nedeniyle ghusl yerine Tayammum", id: "Tayammum bukan ghusl karena dingin yang sangat" }
summary:
  ar: "سؤال عن التيمم بدل الغسل لشدة البرد، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز لمن لا يستطيع استعمال الماء لمرض، أو وجده باردًا وتعذر تسخينه وكان يتضرر به، مع وجوب قضاء ما صلاه بالتيمم. أجابت الدائرة بأن من كان مريضًا لا يستطيع استعمال الماء، أو وجد الماء باردًا وتعذر عليه تسخينه وكان يتضرر باستعماله، جاز له التيمم. وقالت إن عليه قضاء ما صلاه بالتيمم في هذه الحال، لأنه في مكان يندر فيه فقد الماء."
  en: "A question about performing tayammum instead of ghusl because of severe cold, in which Jordan's General Iftaa Department answered that it is permitted for someone whose illness prevents using water, or who finds the water cold, cannot heat it and would be harmed by it, but that prayers performed with that tayammum must be made up. The Department answered that someone who is ill and cannot use water, or who finds the water cold, cannot heat it and would be harmed by using it, may perform tayammum. It said that such a person must make up the prayers performed with tayammum in this case, because he is in a place where lack of water is rare."
  ur: "شدید سردی کی وجہ سے غسل کے بجائے تیمم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ اس شخص کے لیے جائز ہے جو بیماری کی وجہ سے پانی استعمال نہ کر سکے، یا پانی ٹھنڈا پائے، اسے گرم نہ کر سکے اور اس سے نقصان ہو، البتہ اس تیمم سے پڑھی گئی نمازوں کی قضا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو بیمار ہو اور پانی استعمال نہ کر سکے، یا پانی ٹھنڈا پائے، اسے گرم کرنا ممکن نہ ہو اور اس کے استعمال سے نقصان ہو، وہ تیمم کر سکتا ہے۔ اس نے کہا کہ اس صورت میں تیمم سے پڑھی گئی نمازوں کی قضا اس پر واجب ہے، کیونکہ وہ ایسی جگہ ہے جہاں پانی کا نہ ملنا نادر ہے۔"
  es: "Una pregunta sobre realizar tayammum en lugar de ghusl debido a un frío intenso, en la que el Departamento General de Iftaa de Jordania respondió que está permitido para alguien cuya enfermedad le impide usar agua, o que encuentra el agua fría, no puede calentarla y le perjudicaría, pero que las oraciones realizadas con ese tayammum deben recuperarse. El Departamento respondió que alguien que está enfermo y no puede usar agua, o que encuentra el agua fría, no puede calentarla y le perjudicaría usarla, puede realizar tayammum. Dijo que tal persona debe recuperar las oraciones realizadas con tayammum en este caso, porque está en un lugar donde la falta de agua es poco común."
  fr: "Une question concernant l'accomplissement du tayammum à la place du ghusl en raison d'un froid intense a été posée. Le Département général de la Iftaa de Jordanie a répondu que cela est permis à une personne dont la maladie l'empêche d'utiliser l'eau, ou qui trouve l'eau froide, ne peut la chauffer et en subirait des conséquences néfastes. Toutefois, les prières accomplies avec ce tayammum doivent être rattrapées. Le Département a précisé qu'une personne malade et ne pouvant utiliser l'eau, ou qui trouve l'eau froide, ne peut la chauffer et en subirait des conséquences néfastes, peut accomplir le tayammum. Il a ajouté que cette personne doit rattraper les prières accomplies avec le tayammum dans ce cas, car elle se trouve dans un lieu où le manque d'eau est rare."
  tr: "Şiddetli soğuk nedeniyle ghusl yerine teyemmum kılınmasıyla ilgili bir soruda, Ürdün Genel Fetva Dairesi, hastalığı nedeniyle suyu kullanamayan veya suyu soğuk bulup ısıtamayan ve zarar veren birinin tayammum ile namaz kılmasını telafi etme yükümlülüğü olduğunu yanıtladı. Daire, biri hasta olup su kullanamıyorsa ya da suyu soğuk bulup ısıtamıyorsa ve kullanırken zarar görüyorsa teyemmumun caiz olduğunu belirtti. Bu durumda tayammumla birlikte namazını uydurması gerektiği belirtildi, çünkü tayammum nadiren kaybedilen bir yerdedir."
  id: "Pertanyaan tentang melakukan tayammum sebagai pengganti ghusl karena dingin parah, di mana Departemen Fatwa Umum Yordania menjawab bahwa diperbolehkan bagi seseorang yang tidak dapat menggunakan air karena sakit, atau merasa air dingin dan tidak dapat memanaskannya serta menyebabkan bahaya, dengan kewajiban untuk menebus doa yang diucapkan dengan tayammum. Departemen menjawab bahwa jika seseorang sakit dan tidak dapat menggunakan air, atau menemukan air dingin dan tidak bisa memanaskannya dan terluka karena menggunakannya, tayammum diperbolehkan. Dalam kasus ini, dikatakan bahwa ia harus menebus apa yang ia doakan dengan tayammum, karena berada di tempat di mana air jarang hilang."
