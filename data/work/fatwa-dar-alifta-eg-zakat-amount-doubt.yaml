label: { ar: "شبهة حول مقدار الزكاة", en: "A doubt raised about the amount of zakat", ur: "زکات کی مقدار کے بارے میں شبہ" }
summary:
  ar: "سائل سأل عن شبهة أثيرت حول مقدار الزكاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21082)⁩ أن الزكاة ركن من أركان الإسلام فرضها الله على المسلمين في أموالهم إذا بلغت النصاب الشرعي وحال عليها الحول وبيّن الجواب مقدارها على وجهه."
  en: "A questioner asked about a doubt raised over the amount of zakat. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21082) answered that zakat is a pillar of Islam, imposed on Muslims' wealth when it reaches the legal nisab and a year passes over it, and the answer sets out its measure."
  ur: "ایک سائل نے زکات کی مقدار کے بارے میں اٹھائے گئے شبہ کے متعلق پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21082)⁩ نے جواب دیا کہ زکات اسلام کا رکن ہے جو مال نصاب کو پہنچ کر سال گزارے تو واجب ہوتی ہے — جواب میں اس کی مقدار بیان ہوئی۔"
