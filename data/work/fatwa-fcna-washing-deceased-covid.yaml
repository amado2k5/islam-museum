summary:
  ar: "إرشاد للدكتور ذو الفقار علي شاه في موقع المجلس الفقهي لأمريكا الشمالية ⁦(مارس 2020)⁩ عن غسل الميت أثناء الجائحة: الجنازات الجماعية والدفن مباحان والغسل يجري بالاحتياطات المعيارية ويجوز التيمم على الجثمان الذي لا يلمس والدفن بلا غسل ولا كفن عند الضرورة على ما فصّله الإرشاد."
  en: "Guidance by Dr. Zulfiqar Ali Shah on the Fiqh Council of North America site (March 2020) for washing the deceased during the pandemic: mass janazas and burials are permitted; washing proceeds with standard precautions; tayammum may be done over an untouchable corpse; and burial without washing or shroud is possible if required — as the guidance details."
  ur: "ڈاکٹر ذوالفقار علی شاہ کی ہدایت فقہ کونسل کی ویب سائٹ پر ⁦(مارچ 2020)⁩ وبا میں میت کے غسل کے بارے میں؛ اجتماعی جنازہ اور دفن جائز؛ احتیاط سے غسل؛ ناقابل لمس میت پر تیمم؛ ضرورت پر بغیر غسل کفن دفن — جیسا کہ ہدایت میں تفصیل ہے۔"
