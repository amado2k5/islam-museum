label: { ar: "غسل الميت أثناء كوفيد-19", en: "Washing the Deceased during COVID-19", ur: "کووڈ-19 کے دوران میت کو غسل دینا", es: "Lavado de cadáveres durante la COVID-19", fr: "La toilette mortuaire pendant la COVID-19", tr: "COVID-19 sırasında vefat edenlerin yıkanması", id: "Mencuci almarhum selama COVID-19" }
summary:
  ar: "إرشاد للدكتور ذو الفقار علي شاه في موقع المجلس الفقهي لأمريكا الشمالية ⁦(مارس 2020)⁩ عن غسل الميت أثناء الجائحة: الجنازات الجماعية والدفن مباحان والغسل يجري بالاحتياطات المعيارية ويجوز التيمم على الجثمان الذي لا يلمس والدفن بلا غسل ولا كفن عند الضرورة على ما فصّله الإرشاد."
  en: "Guidance by Dr. Zulfiqar Ali Shah on the Fiqh Council of North America site (March 2020) for washing the deceased during the pandemic: mass janazas and burials are permitted; washing proceeds with standard precautions; tayammum may be done over an untouchable corpse; and burial without washing or shroud is possible if required — as the guidance details."
  ur: "ڈاکٹر ذوالفقار علی شاہ کی ہدایت فقہ کونسل کی ویب سائٹ پر ⁦(مارچ 2020)⁩ وبا میں میت کے غسل کے بارے میں؛ اجتماعی جنازہ اور دفن جائز؛ احتیاط سے غسل؛ ناقابل لمس میت پر تیمم؛ ضرورت پر بغیر غسل کفن دفن — جیسا کہ ہدایت میں تفصیل ہے۔"
  es: "Orientación del Dr. Zulfiqar Ali Shah en el sitio web del Consejo de Fiqh de América del Norte (marzo de 2020) sobre el lavado de los difuntos durante la pandemia: se permiten los funerales y entierros masivos; el lavado se realiza con las precauciones estándar; se puede realizar el tayammum sobre un cadáver intocable; y es posible el entierro sin lavado ni mortaja si es necesario, como se detalla en la guía."
  fr: "Recommandations du Dr Zulfiqar Ali Shah sur le site du Conseil Fiqh d'Amérique du Nord (mars 2020) concernant la toilette mortuaire pendant la pandémie: les funérailles et les enterrements collectifs sont autorisés; la toilette se fait en respectant les précautions habituelles; le tayammum peut être pratiqué sur un corps intouchable; et l'enterrement sans toilette ni linceul est possible si nécessaire, comme le précisent les recommandations."
  tr: "Dr. Zulfiqar Ali Shah'ın Kuzey Amerika Hukuk Konseyi web sitesinde (Mart 2020) pandemi sırasında ölenlerin yıkanması hakkında rehberliği: Toplu cenaze ve defin serbesttir ve yıkama standart önlemlere göre yapılır. Tayammum, dokunulmayan bir bedende izin verilir ve gerekirse yıkama veya kefen olmadan defin yapılır, rehberde detaylandırıldığı gibi."
  id: "Panduan oleh Dr. Zulfiqar Ali Shah di situs web Dewan Hukum Amerika Utara (Maret 2020) tentang mencuci almarhum selama pandemi: Pemakaman massal dan pemakaman diperbolehkan, dan pencucian dilakukan sesuai dengan tindakan pencegahan standar. Tayammum diperbolehkan pada jenazah yang tidak disentuh, dan pemakaman tanpa pencucian atau penutup dilakukan jika diperlukan, sesuai dengan panduan tersebut."
