id: work/fatwa-amja-denying-the-fire
class: work
kind: fatwa
label: { ar: "الرد على منكري النار بعد الحساب", en: "Answering those who deny the Fire after the reckoning", ur: "حساب کے بعد جہنم کے انکار کا جواب" }
summary:
  ar: "سأل سائل عن الرد على من ينكر وجود النار بعد الحساب كقول شهود يهوه إنه بعد الحساب إما حياة أبدية للمؤمنين وإما موت لغيرهم. أجاب د. حاتم الحاج ⁦(فتوى رقم 82870 بتاريخ 15 أكتوبر 2010)⁩ أن العقل دل على المعاد والثواب والعقاب أما مدة ذلك وخلوده فليس للعقل فيه سلطان بنفي ولا إثبات فلا يعلم إلا عن طريق السمع من خبر النبي الصادق، وأن الإسلام هو الدين الظاهرة حجته غير المتناقض في أصله مع بدائه العقول فطلب تفاصيل الثواب والعقاب لا يكون إلا منه، وتابع بيان الرد على ما فصّل."
  en: "A questioner asked for the answer to those denying the Fire after the reckoning — like Jehovah's Witnesses holding that after it comes either eternal life for believers or annihilation for the rest. Dr. Hatim al-Haj (fatwa no. 82870, 15 October 2010) answered that reason proves the return and reward and punishment, but their duration and eternity lie beyond reason's power of denial or proof, known only through the truthful Prophet's report; Islam is the religion whose proof is manifest and whose root does not contradict sound reason, so the details are sought in it alone — with the rest of the answer as written. Recorded as AMJA's answer."
  ur: "ایک سائل نے حساب کے بعد جہنم کے انکار کرنے والوں کے جواب پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 82870، 15 اکتوبر 2010)⁩ کے مطابق جزا و سزا کا اثبات عقل سے ہے مگر اس کی مدت اور ابدی ہونے کا علم صرف صادق وحی سے ملتا ہے — جواب کا خلاصہ۔"
