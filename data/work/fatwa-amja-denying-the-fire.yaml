id: work/fatwa-amja-denying-the-fire
class: work
kind: fatwa
label: { ar: "الرد على منكري النار بعد الحساب", en: "Answering those who deny the Fire after the reckoning", ur: "حساب کے بعد جہنم کے انکار کا جواب", es: "Respondiendo a quienes niegan el Fuego después del Juicio Final", fr: "Répondre à ceux qui nient le Feu après le jugement" }
summary:
  ar: "سأل سائل عن الرد على من ينكر وجود النار بعد الحساب كقول شهود يهوه إنه بعد الحساب إما حياة أبدية للمؤمنين وإما موت لغيرهم. أجاب د. حاتم الحاج ⁦(فتوى رقم 82870 بتاريخ 15 أكتوبر 2010)⁩ أن العقل دل على المعاد والثواب والعقاب أما مدة ذلك وخلوده فليس للعقل فيه سلطان بنفي ولا إثبات فلا يعلم إلا عن طريق السمع من خبر النبي الصادق، وأن الإسلام هو الدين الظاهرة حجته غير المتناقض في أصله مع بدائه العقول فطلب تفاصيل الثواب والعقاب لا يكون إلا منه، وتابع بيان الرد على ما فصّل."
  en: "A questioner asked for the answer to those denying the Fire after the reckoning — like Jehovah's Witnesses holding that after it comes either eternal life for believers or annihilation for the rest. Dr. Hatim al-Haj (fatwa no. 82870, 15 October 2010) answered that reason proves the return and reward and punishment, but their duration and eternity lie beyond reason's power of denial or proof, known only through the truthful Prophet's report; Islam is the religion whose proof is manifest and whose root does not contradict sound reason, so the details are sought in it alone — with the rest of the answer as written. Recorded as AMJA's answer."
  ur: "ایک سائل نے حساب کے بعد جہنم کے انکار کرنے والوں کے جواب پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 82870، 15 اکتوبر 2010)⁩ کے مطابق جزا و سزا کا اثبات عقل سے ہے مگر اس کی مدت اور ابدی ہونے کا علم صرف صادق وحی سے ملتا ہے — جواب کا خلاصہ۔"
  es: "Un interlocutor solicitó una respuesta a quienes niegan el Fuego tras el Juicio Final, como los Testigos de Jehová, que sostienen que después de este les espera la vida eterna a los creyentes o la aniquilación a los demás. El Dr. Hatim al-Haj (fatwa n.º 82870, 15 de octubre de 2010) respondió que la razón demuestra el retorno, la recompensa y el castigo, pero su duración y eternidad escapan al poder de la razón para negarlos o probarlos, y solo se conocen a través del relato del Profeta veraz. El Islam es la religión cuya prueba es manifiesta y cuya raíz no contradice la razón sana, por lo que los detalles se buscan únicamente en él, junto con el resto de la respuesta tal como está escrita. Registrada como respuesta de AMJA."
  fr: "Un internaute a demandé la réponse à ceux qui nient l'existence du Feu après le Jugement dernier — comme les Témoins de Jéhovah qui affirment qu'après cela viennent soit la vie éternelle pour les croyants, soit l'anéantissement pour les autres. Le Dr Hatim al-Haj (fatwa n° 82870, 15 octobre 2010) a répondu que la raison prouve le retour, la récompense et le châtiment, mais que leur durée et leur éternité dépassent le pouvoir de la raison de les nier ou de les prouver, et ne sont connues que par le hadith du Prophète. L'islam est la religion dont la preuve est manifeste et dont le fondement ne contredit pas la raison saine; c'est donc en lui seul que l'on cherche les détails — le reste de la réponse étant tel qu'il a été écrit. Réponse consignée par AMJA."
