label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الذبائح", en: "IIFA resolution on slaughtered animals", ur: "اکیڈمی کی قرارداد: ذبیحے کے احکام", es: "Resolución de la IIFA sobre animales sacrificados" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: التذكية الشرعية تتم بالذبح بقطع الحلقوم والمريء والودجين وهي الطريقة المفضلة في الغنم والبقر والطيور ويجوز في غيرها، وبالنحر بالطعن في اللبة وهي المفضلة في الإبل ويجوز في غيرها، وبيّن بقية أحكام الذبائح على ما فصّل."
  en: "IIFA's tenth-session resolution (July 1997) on slaughtered animals: lawful slaughter is by dhabh — cutting the throat, gullet and jugular veins — the preferred method for sheep, cattle and birds and permitted for others; and by nahr — piercing the hollow at the neck's base — preferred for camels and permitted otherwise; the remaining rulings are detailed."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩ ذبیحے پر: شرعی ذبح حلقوم، مری اور ودجین کاٹنے سے؛ اونٹ کے لیے نحر بہتر؛ باقی احکام بیان ہوئے۔"
  es: "Resolución de la décima sesión de la IIFA (julio de 1997) sobre animales sacrificados: el sacrificio legal se realiza mediante dhabh (cortando la garganta, el esófago y las venas yugulares), método preferido para ovejas, ganado vacuno y aves, y permitido para otros animales; y mediante nahr (perforando el hueco en la base del cuello), método preferido para camellos y permitido en otros casos; las demás resoluciones se detallan a continuación."
