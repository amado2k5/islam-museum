label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الذبائح", en: "IIFA resolution on slaughtered animals", ur: "اکیڈمی کی قرارداد: ذبیحے کے احکام", es: "Resolución de la IIFA sobre animales sacrificados", fr: "Résolution de l'IIFA sur les animaux abattus", tr: "Uluslararası İslami Fiqh Akademisi'nin kesilen hayvanlara ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai hewan yang disembelih" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: التذكية الشرعية تتم بالذبح بقطع الحلقوم والمريء والودجين وهي الطريقة المفضلة في الغنم والبقر والطيور ويجوز في غيرها، وبالنحر بالطعن في اللبة وهي المفضلة في الإبل ويجوز في غيرها، وبيّن بقية أحكام الذبائح على ما فصّل."
  en: "IIFA's tenth-session resolution (July 1997) on slaughtered animals: lawful slaughter is by dhabh — cutting the throat, gullet and jugular veins — the preferred method for sheep, cattle and birds and permitted for others; and by nahr — piercing the hollow at the neck's base — preferred for camels and permitted otherwise; the remaining rulings are detailed."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩ ذبیحے پر: شرعی ذبح حلقوم، مری اور ودجین کاٹنے سے؛ اونٹ کے لیے نحر بہتر؛ باقی احکام بیان ہوئے۔"
  es: "Resolución de la décima sesión de la IIFA (julio de 1997) sobre animales sacrificados: el sacrificio legal se realiza mediante dhabh (cortando la garganta, el esófago y las venas yugulares), método preferido para ovejas, ganado vacuno y aves, y permitido para otros animales; y mediante nahr (perforando el hueco en la base del cuello), método preferido para camellos y permitido en otros casos; las demás resoluciones se detallan a continuación."
  fr: "Résolution de la dixième session de l'IIFA (juillet 1997) sur les animaux abattus: l'abattage légal se fait par dhabh — en coupant la gorge, l'œsophage et les veines jugulaires — méthode préférée pour les moutons, les bovins et les oiseaux et autorisée pour les autres; et par nahr — en perçant le creux à la base du cou — méthode préférée pour les chameaux et autorisée pour les autres; les autres décisions sont détaillées."
  tr: "Uluslararası İslami Fiqh Akademisi'nin onuncu oturumunda (Temmuz 1997) karar verilmiştir: Yasal kesim, boğaz, yemek borusu ve wajin kesimiyle yapılır; bu, koyun, sığır ve kuşlar için tercih edilen yöntemdir ve diğer durumlarda izin verilir; develerde tercih edilen ve diğer durumlarda izin verilen posa bıçaklanarak kesim; kesilen hayvanlara ilişkin diğer kararlar ise ayrıntılı olarak açıklanır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kesepuluhnya (Juli 1997): Pemotongan legal dilakukan dengan cara menyembelih leher, esofagus, dan wajin, yang merupakan metode yang disukai untuk domba, sapi, dan burung, dan diperbolehkan dalam kasus lain; penyembelihan dengan menusuk ampas, yang lebih disukai pada unta dan diperbolehkan dalam kasus lain; dan sisanya tentang hewan yang disembelih dijelaskan secara rinci."
