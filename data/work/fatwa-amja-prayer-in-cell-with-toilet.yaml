id: work/fatwa-amja-prayer-in-cell-with-toilet
class: work
kind: fatwa
label: { ar: "الصلاة في زنزانة فيها مرحاض", en: "Praying in a cramped cell holding a toilet — permitted", ur: "زنزانہ میں نماز جہاں بیت الخلا ہے", es: "Rezar en una celda estrecha que contiene un inodoro — permitido", fr: "Prier dans une cellule exiguë équipée de toilettes — autorisé" }
summary:
  ar: "سأل سائل أن أغلب غرف الحبس بالسجون ضيقة وصغيرة ويوجد المرحاض بداخلها هل يجوز الصلاة فيها. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21993 بتاريخ 14 أكتوبر 2012)⁩ أنه لا حرج في إقامة الصلاة في هذه الغرفة ويجتهد في تحاشي النجاسة ما استطاع فإن الله لا يكلف نفسًا إلا وسعها على ما فصّل الجواب."
  en: "A questioner noted that most prison cells are cramped with the toilet inside — is prayer lawful there? AMJA's fatwa committee (fatwa no. 21993, 14 October 2012) answered that there is no harm holding the prayer in such a room, striving to avoid impurity as far as possible — God tasks no soul beyond its capacity — as the answer details."
  ur: "زنزانے میں نماز؟ لجنة الفتوى ⁦(فتویٰ 21993، 14 اکتوبر 2012)⁩ کے مطابق جائز؛ نجاست سے بچے جتنا ہو سکے۔"
  es: "Un interlocutor señaló que la mayoría de las celdas de prisión son estrechas y tienen el inodoro dentro; ¿es lícito rezar allí? El comité de fatuas de AMJA (fatua n.º 21993, 14 de octubre de 2012) respondió que no hay inconveniente en rezar en una habitación así, procurando evitar la impureza en la medida de lo posible —Dios no exige a ningún alma más allá de su capacidad—, como se detalla en la respuesta."
  fr: "Un internaute a fait remarquer que la plupart des cellules de prison sont exiguës et que les toilettes s'y trouvent; la prière y est-elle licite ? Le comité des fatwas de l'AMJA (fatwa n° 21993, 14 octobre 2012) a répondu qu'il n'y a aucun mal à prier dans une telle pièce, en s'efforçant d'éviter autant que possible l'impureté — Dieu n'impose à aucune âme une tâche supérieure à ses capacités —, comme le précise la réponse."
