id: work/fatwa-aliftaa-jo-eating-hamsters
class: work
kind: fatwa
label: { ar: "حكم أكل الهامستر", en: "Eating hamsters", ur: "ہیمسٹر کھانے کا حکم" }
summary:
  ar: "سؤال عن أكل الهامستر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم لأنه من عائلة الفئران. وصفت الدائرة الهامستر بأنه حيوان صغير من القوارض، يُربى كثيرًا في أوروبا وأمريكا الشمالية، ويُعد من فصيلة الفئران، ويتميز بخديه الواسعين اللذين يخزن فيهما الطعام. وقالت إنه لم يرد في حكم أكله شيء عند الفقهاء السابقين لأنه اكتُشف متأخرًا في القرن التاسع عشر الميلادي. وبما أنه من عائلة الفئران فحكمه حكم الفأر، وأكل الفأر حرام، ونقلت عن جلال الدين المحلي أن ما ندب الشرع إلى قتله كالفأرة يحرم أكله. وخلصت إلى أنه يحرم أكل الهامستر."
  en: "A question on eating hamsters, in which Jordan's General Iftaa Department answered that it is forbidden, since the hamster belongs to the mouse family. The Department described the hamster as a small rodent widely kept in Europe and North America, counted in the mouse family and distinguished by wide cheeks in which it stores food. It said earlier jurists said nothing about eating it, since it was only discovered in the nineteenth century. Since it belongs to the mouse family, it takes the ruling on mice, and eating mice is forbidden; it quoted Jalal al-Din al-Mahalli that animals the sharia encourages killing, such as mice, may not be eaten. It concluded that eating hamsters is forbidden."
  ur: "ہیمسٹر کھانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ حرام ہے کیونکہ ہیمسٹر چوہوں کے خاندان سے ہے۔ ڈیپارٹمنٹ نے ہیمسٹر کو ایک چھوٹا کترنے والا جانور قرار دیا جو یورپ اور شمالی امریکہ میں بکثرت پالا جاتا ہے، چوہوں کے خاندان میں شمار ہوتا ہے اور اپنے چوڑے گالوں سے پہچانا جاتا ہے جن میں وہ خوراک جمع کرتا ہے۔ اس نے کہا کہ پہلے فقہاء نے اسے کھانے کے بارے میں کچھ نہیں کہا کیونکہ یہ انیسویں صدی عیسوی میں دریافت ہوا۔ چونکہ یہ چوہوں کے خاندان سے ہے اس لیے اس پر چوہے کا حکم لاگو ہوتا ہے، اور چوہا کھانا حرام ہے؛ اس نے جلال الدین المحلی سے نقل کیا کہ جن جانوروں کو مارنے کی شریعت نے ترغیب دی، جیسے چوہا، ان کا کھانا حرام ہے۔ اس نے نتیجہ نکالا کہ ہیمسٹر کھانا حرام ہے۔"
