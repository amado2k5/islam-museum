id: work/fatwa-aliftaa-jo-eating-hamsters
class: work
kind: fatwa
label: { ar: "حكم أكل الهامستر", en: "Eating hamsters", ur: "ہیمسٹر کھانے کا حکم", es: "Comer hámsteres", fr: "Manger des hamsters", tr: "Hamster yeme hakkındaki karar", id: "Aturan tentang makan hamster" }
summary:
  ar: "سؤال عن أكل الهامستر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم لأنه من عائلة الفئران. وصفت الدائرة الهامستر بأنه حيوان صغير من القوارض، يُربى كثيرًا في أوروبا وأمريكا الشمالية، ويُعد من فصيلة الفئران، ويتميز بخديه الواسعين اللذين يخزن فيهما الطعام. وقالت إنه لم يرد في حكم أكله شيء عند الفقهاء السابقين لأنه اكتُشف متأخرًا في القرن التاسع عشر الميلادي. وبما أنه من عائلة الفئران فحكمه حكم الفأر، وأكل الفأر حرام، ونقلت عن جلال الدين المحلي أن ما ندب الشرع إلى قتله كالفأرة يحرم أكله. وخلصت إلى أنه يحرم أكل الهامستر."
  en: "A question on eating hamsters, in which Jordan's General Iftaa Department answered that it is forbidden, since the hamster belongs to the mouse family. The Department described the hamster as a small rodent widely kept in Europe and North America, counted in the mouse family and distinguished by wide cheeks in which it stores food. It said earlier jurists said nothing about eating it, since it was only discovered in the nineteenth century. Since it belongs to the mouse family, it takes the ruling on mice, and eating mice is forbidden; it quoted Jalal al-Din al-Mahalli that animals the sharia encourages killing, such as mice, may not be eaten. It concluded that eating hamsters is forbidden."
  ur: "ہیمسٹر کھانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ حرام ہے کیونکہ ہیمسٹر چوہوں کے خاندان سے ہے۔ ڈیپارٹمنٹ نے ہیمسٹر کو ایک چھوٹا کترنے والا جانور قرار دیا جو یورپ اور شمالی امریکہ میں بکثرت پالا جاتا ہے، چوہوں کے خاندان میں شمار ہوتا ہے اور اپنے چوڑے گالوں سے پہچانا جاتا ہے جن میں وہ خوراک جمع کرتا ہے۔ اس نے کہا کہ پہلے فقہاء نے اسے کھانے کے بارے میں کچھ نہیں کہا کیونکہ یہ انیسویں صدی عیسوی میں دریافت ہوا۔ چونکہ یہ چوہوں کے خاندان سے ہے اس لیے اس پر چوہے کا حکم لاگو ہوتا ہے، اور چوہا کھانا حرام ہے؛ اس نے جلال الدین المحلی سے نقل کیا کہ جن جانوروں کو مارنے کی شریعت نے ترغیب دی، جیسے چوہا، ان کا کھانا حرام ہے۔ اس نے نتیجہ نکالا کہ ہیمسٹر کھانا حرام ہے۔"
  es: "Ante una pregunta sobre el consumo de hámsteres, el Departamento General de Iftaa de Jordania respondió que está prohibido, ya que el hámster pertenece a la familia de los ratones. El Departamento describió al hámster como un pequeño roedor muy común en Europa y Norteamérica, perteneciente a la familia de los ratones y caracterizado por sus amplias mejillas, donde almacena alimento. Afirmó que los juristas anteriores no se pronunciaron sobre su consumo, puesto que fue descubierto en el siglo XIX. Dado que pertenece a la familia de los ratones, aplica la normativa aplicable a estos animales, y su consumo está prohibido. Citó a Jalal al-Din al-Mahalli, quien afirmó que los animales cuya matanza fomenta la sharia, como los ratones, no pueden ser consumidos. En conclusión, el consumo de hámsteres está prohibido."
  fr: "Une question relative à la consommation de hamsters a été posée au Département général de la Iftaa en Jordanie. Ce dernier a répondu que cela est interdit, le hamster appartenant à la famille des souris. Le Département décrit le hamster comme un petit rongeur répandu en Europe et en Amérique du Nord, classé parmi les souris et reconnaissable à ses joues larges où il stocke sa nourriture. Il précise que les juristes antérieurs n'ont rien dit à ce sujet, le hamster n'ayant été découvert qu'au XIXe siècle. Appartenant à la famille des souris, le Département applique la jurisprudence relative aux souris, dont la consommation est interdite. Il cite Jalal al-Din al-Mahalli, selon lequel les animaux dont la mise à mort est autorisée par la charia, tels que les souris, ne peuvent être consommés. En conclusion, la consommation de hamsters est interdite."
  tr: "Hamster yeme durumu sorulduğunda, Ürdün Genel Fetva Dairesi bunun fare ailesine ait olduğu için yasak olduğunu söyledi. Bakanlık, hamsterı Avrupa ve Kuzey Amerika'da yaygın olarak yetiştirilen, fare olarak sınıflandırılan ve yiyecek depoladığı geniş yanaklarıyla ayırt edilen küçük bir kemirgen hayvanı olarak tanımladı. Hamsterın 19. yüzyılın sonlarında keşfedildiği için önceki hukukçulara göre yenmesiyle ilgili bir karar olmadığını belirtti. Fare ailesine ait olduğu için fare kuralıyla yönetilir ve fare yemek yasaktır. Celaluddin Al-Mahalli'nin, İslam hukukunun fare gibi öldürmeyi önerdiği şeyi yenmesi yasak olduğunu aktardı. Sonuç olarak, hamster yemenin yasak olduğu sonucuna varıldı."
  id: "Ketika ditanya tentang makan hamster, Departemen Fatwa Umum Yordania menjawab bahwa hamster dilarang karena berasal dari keluarga tikus. Departemen tersebut menggambarkan hamster sebagai hewan pengerat kecil yang banyak dipelihara di Eropa dan Amerika Utara, diklasifikasikan sebagai tikus, dan dibedakan oleh pipi lebarnya tempat menyimpan makanan. Departemen tersebut menyatakan bahwa tidak ada aturan tentang memakannya menurut para ahli hukum sebelumnya karena ditemukan pada akhir abad kesembilan belas M. Karena berasal dari keluarga tikus, maka dikuasai oleh aturan tikus, dan makan tikus dilarang. Departemen tersebut mengutip Jalaluddin Al-Mahalli yang mengatakan bahwa apa yang disarankan hukum Islam untuk membunuh seperti tikus dilarang dimakan. Mereka menyimpulkan bahwa makan hamster dilarang."
