label: { ar: "موسيقى فيلم «محمد رسول الله» ⁦(2015)⁩", en: "Muhammad: The Messenger of God (soundtrack)", ur: "فلم «محمد رسول اللہ» کی موسیقی ⁦(2015)⁩", es: "Mahoma: El Mensajero de Dios (banda sonora)", fr: "Muhammad: Le Messager de Dieu (bande originale)", tr: "\"Muhammed, Allah'ın Elçisi\" (2015) filmi için müzik", id: "Musik untuk film \"Muhammad, Messenger of God\" (2015)" }
summary:
  ar: "ألبوم موسيقى الفيلم الإيراني «محمد رسول الله» لمجيد مجيدي عن طفولة النبي، من تأليف أ. ر. رحمن مع ثلاثي جبران الفلسطيني، صدر عن سوني في 23 ديسمبر 2015 بعشرين مقطوعة؛ عمل عليه رحمن سنة ونصفا وسجّله في الهند وإيران وألمانيا وفرنسا ومصر بمئتي موسيقي، وعدّته مجلة موفي ميوزيك يو كيه من أفضل موسيقى الأفلام الآسيوية سنة 2015."
  en: "The soundtrack of Majid Majidi's Iranian film Muhammad: The Messenger of God, about the Prophet's childhood, composed by A. R. Rahman with the Palestinian Le Trio Joubran and released by Sony DADC on 23 December 2015 with twenty tracks; Rahman worked on it for a year and a half, recording in India, Iran, Germany, France and Egypt with 200 musicians, and Movie Music UK named it one of the best Asian scores of 2015."
  ur: "مجید مجیدی کی ایرانی فلم «محمد رسول اللہ» کی موسیقی، جو اے آر رحمان نے فلسطینی تری جبران کے ساتھ بنائی اور سونی نے 23 دسمبر 2015 کو بیس ٹریکس کے ساتھ جاری کی؛ یہ بھارت، ایران، جرمنی، فرانس اور مصر میں دو سو سازندوں کے ساتھ ریکارڈ ہوئی۔"
  es: "La banda sonora de la película iraní de Majid Majidi, Muhammad: The Messenger of God, sobre la infancia del Profeta, compuesta por AR Rahman con el trío palestino Le Trio Joubran y lanzada por Sony DADC el 23 de diciembre de 2015 con veinte temas; Rahman trabajó en ella durante un año y medio, grabando en India, Irán, Alemania, Francia y Egipto con 200 músicos, y Movie Music UK la nombró una de las mejores bandas sonoras asiáticas de 2015."
  fr: "La bande originale du film iranien de Majid Majidi, Muhammad: Le Messager de Dieu, qui raconte l'enfance du Prophète, a été composée par AR Rahman avec le Trio palestinien Le Trio Joubran et publiée par Sony DADC le 23 décembre 2015. Elle comprend vingt titres. Rahman y a travaillé pendant un an et demi, enregistrant en Inde, en Iran, en Allemagne, en France et en Égypte avec 200 musiciens, et Movie Music UK l'a nommée parmi les meilleures bandes originales asiatiques de 2015."
  tr: "Majid Majidi'nin Peygamber'in çocukluğunu konu alan İran film müzik albümü \"Muhammad, the Messenger of God\" ve A. R. Rahman tarafından Filistinli üçlü Gibran ile yazılmıştır ve 23 Aralık 2015'te Sony tarafından yirmi parça ile yayımlanmıştır. Rahman bir buçuk yıl boyunca üzerinde çalışmış ve Hindistan, İran, Almanya, Fransa ve Mısır'da iki yüz müzisyenle kaydetmiştir. Movie Music UK dergisi, 2015 yılında en iyi Asya film müziklerinden biri olarak değerlendirmiştir."
  id: "Album musik film Iran \"Muhammad, the Messenger of God\" oleh Majid Majidi tentang masa kecil Nabi, ditulis oleh A. R. Rahman bersama trio Palestina Gibran, dirilis oleh Sony pada 23 Desember 2015 dengan dua puluh lagu. Rahman mengerjakannya selama satu setengah tahun dan merekamnya di India, Iran, Jerman, Prancis, dan Mesir bersama dua ratus musisi. Majalah Movie Music UK menganggapnya sebagai salah satu skor musik film Asia terbaik pada tahun 2015."
