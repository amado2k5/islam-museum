summary:
  ar: "ألبوم موسيقى الفيلم الإيراني «محمد رسول الله» لمجيد مجيدي عن طفولة النبي، من تأليف أ. ر. رحمن مع ثلاثي جبران الفلسطيني، صدر عن سوني في 23 ديسمبر 2015 بعشرين مقطوعة؛ عمل عليه رحمن سنة ونصفا وسجّله في الهند وإيران وألمانيا وفرنسا ومصر بمئتي موسيقي، وعدّته مجلة موفي ميوزيك يو كيه من أفضل موسيقى الأفلام الآسيوية سنة 2015."
  en: "The soundtrack of Majid Majidi's Iranian film Muhammad: The Messenger of God, about the Prophet's childhood, composed by A. R. Rahman with the Palestinian Le Trio Joubran and released by Sony DADC on 23 December 2015 with twenty tracks; Rahman worked on it for a year and a half, recording in India, Iran, Germany, France and Egypt with 200 musicians, and Movie Music UK named it one of the best Asian scores of 2015."
  ur: "مجید مجیدی کی ایرانی فلم «محمد رسول اللہ» کی موسیقی، جو اے آر رحمان نے فلسطینی تری جبران کے ساتھ بنائی اور سونی نے 23 دسمبر 2015 کو بیس ٹریکس کے ساتھ جاری کی؛ یہ بھارت، ایران، جرمنی، فرانس اور مصر میں دو سو سازندوں کے ساتھ ریکارڈ ہوئی۔"
