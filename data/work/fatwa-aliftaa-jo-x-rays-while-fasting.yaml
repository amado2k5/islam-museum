id: work/fatwa-aliftaa-jo-x-rays-while-fasting
class: work
kind: fatwa
label: { ar: "التصوير الشعاعي للصائم في رمضان", en: "X-rays while fasting in Ramadan", ur: "رمضان میں روزے دار کا ایکسرے" }
summary:
  ar: "سؤال عن التصوير الشعاعي للصائم في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن التصوير الشعاعي بذاته لا يفطر، لكن تناول مادة لإظهار الصورة عن طريق منفذ مفتوح إلى الجوف يفطر. أجابت الدائرة بأن التصوير الشعاعي بحد ذاته لا يفطر. وقالت إنه إن أخذ الصائم دواءً أو مادة لإظهار الصورة عن طريق منفذ مفتوح إلى الجوف، كالفم والشرج، فإنه يفطر."
  en: "A question about x-rays while fasting in Ramadan, in which Jordan's General Iftaa Department answered that an X-ray itself does not break the fast, but taking a contrast substance through an open passage to the interior does. The Department answered that X-ray imaging in itself does not break the fast. It said that if the fasting person takes a medicine or substance to make the image visible through an open passage to the interior, such as the mouth or the anus, it breaks the fast."
  ur: "رمضان میں روزے دار کا ایکسرے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایکسرے بذات خود روزہ نہیں توڑتا، لیکن تصویر واضح کرنے والا مادہ کھلے راستے سے جوف میں لینا روزہ توڑ دیتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ایکسرے بذات خود روزہ نہیں توڑتا۔ اس نے کہا کہ اگر روزے دار تصویر واضح کرنے کے لیے کوئی دوا یا مادہ جوف تک کھلے راستے، جیسے منہ یا مقعد، سے لے تو روزہ ٹوٹ جاتا ہے۔"
