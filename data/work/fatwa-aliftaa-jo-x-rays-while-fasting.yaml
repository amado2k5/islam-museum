id: work/fatwa-aliftaa-jo-x-rays-while-fasting
class: work
kind: fatwa
label: { ar: "التصوير الشعاعي للصائم في رمضان", en: "X-rays while fasting in Ramadan", ur: "رمضان میں روزے دار کا ایکسرے", es: "Radiografías durante el ayuno en Ramadán", fr: "Radiographies réalisées pendant le jeûne du Ramadan", tr: "Ramazan ayında oruç tutan kişi için radyografi", id: "Radiografi untuk orang yang berpuasa selama Ramadan" }
summary:
  ar: "سؤال عن التصوير الشعاعي للصائم في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن التصوير الشعاعي بذاته لا يفطر، لكن تناول مادة لإظهار الصورة عن طريق منفذ مفتوح إلى الجوف يفطر. أجابت الدائرة بأن التصوير الشعاعي بحد ذاته لا يفطر. وقالت إنه إن أخذ الصائم دواءً أو مادة لإظهار الصورة عن طريق منفذ مفتوح إلى الجوف، كالفم والشرج، فإنه يفطر."
  en: "A question about x-rays while fasting in Ramadan, in which Jordan's General Iftaa Department answered that an X-ray itself does not break the fast, but taking a contrast substance through an open passage to the interior does. The Department answered that X-ray imaging in itself does not break the fast. It said that if the fasting person takes a medicine or substance to make the image visible through an open passage to the interior, such as the mouth or the anus, it breaks the fast."
  ur: "رمضان میں روزے دار کا ایکسرے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایکسرے بذات خود روزہ نہیں توڑتا، لیکن تصویر واضح کرنے والا مادہ کھلے راستے سے جوف میں لینا روزہ توڑ دیتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ایکسرے بذات خود روزہ نہیں توڑتا۔ اس نے کہا کہ اگر روزے دار تصویر واضح کرنے کے لیے کوئی دوا یا مادہ جوف تک کھلے راستے، جیسے منہ یا مقعد، سے لے تو روزہ ٹوٹ جاتا ہے۔"
  es: "Una pregunta sobre las radiografías durante el ayuno en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que una radiografía en sí misma no rompe el ayuno, pero sí lo hace la administración de una sustancia de contraste a través de una abertura interna. El Departamento aclaró que la obtención de imágenes por sí sola no rompe el ayuno. Explicó que si la persona que ayuna toma un medicamento o sustancia para que la imagen sea visible a través de una abertura interna, como la boca o el ano, sí se rompe el ayuno."
  fr: "Une question concernant les radiographies pendant le jeûne du Ramadan a été posée. Le Département général de la Iftaa en Jordanie a répondu que la radiographie en elle-même ne rompt pas le jeûne, mais que l'ingestion d'un produit de contraste par voie interne le rompt. Le Département a précisé que l'examen radiologique en lui-même ne rompt pas le jeûne. Il a ajouté que si la personne qui jeûne prend un médicament ou une substance permettant de visualiser l'image par une voie interne, comme la bouche ou l'anus, le jeûne est rompu."
  tr: "Ramazan ayında oruç tutan bireyler için radyografi hakkında bir soru var; Ürdün Genel Fetva Dairesi, röntgen görüntülemenin orucu bozmadığını, ancak görüntüyü açık bir çıkıştan boşluğa göstermek için bir madde alınmasının orucu bozduğunu söyledi. Bölüm, röntgen görüntülemenin orucu bozmadığını yanıtladı. Oruç tutan kişi, ağzı ve anüse gibi açık bir çıkıştan görüntüyü göstermek için ilaç veya madde alırsa orucu bozar."
  id: "Sebuah pertanyaan tentang radiografi untuk individu yang berpuasa selama Ramadan, di mana Departemen Fatwa Umum Yordania menjawab bahwa pencitraan sinar-X itu sendiri tidak memutus puasa, tetapi mengambil zat untuk memperlihatkan gambar melalui saluran terbuka ke rongga memutus puasa. Departemen menjawab bahwa pencitraan sinar-X itu sendiri tidak memutus puasa. Mereka mengatakan bahwa jika seseorang yang berpuasa mengonsumsi obat atau zat untuk menunjukkan gambar melalui saluran terbuka ke rongga, seperti mulut dan anus, maka puasa tersebut diputuskan."
