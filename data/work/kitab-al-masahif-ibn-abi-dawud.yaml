label: { ar: "كتاب المصاحف لابن أبي داود", en: "Kitab al-Masahif (Ibn Abi Dawud)", ur: "کتاب المصاحف ⁦(ابن ابی داود)⁩", es: "Kitab al-Masahif (Ibn Abi Dawud)", fr: "Kitab al-Masahif (Ibn Abi Dawud)" }
summary:
  ar: "كتاب لابن أبي داود السجستاني في المصاحف، يستند إليه السيوطي في «الإتقان» لما رُوي عن السلف في كتابة المصحف ونقطه وتعشيره وأوصافه، وتحيل إليه حواشي الطبعة المحققة بأرقام الأخبار {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}."
  en: "A book by Ibn Abi Dawud al-Sijistani on the mushafs, on which al-Suyuti draws in the Itqan for what was reported of the early generations on writing, dotting and dividing into tens, and on the form of the mushaf; the notes of the edited text refer to it by the numbers of its reports {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}."
  ur: "ابن ابی داود سجستانی کی مصاحف پر کتاب، جس پر سیوطی «الاتقان» میں مصحف کی کتابت، نقطے، تعشیر اور ہیئت کے بارے میں سلف سے مروی اخبار کے لیے انحصار کرتے ہیں؛ تحقیق شدہ متن کے حواشی اخبار کے نمبروں کے ساتھ اس کا حوالہ دیتے ہیں {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}۔"
  es: "Un libro de Ibn Abi Dawud al-Sijistani sobre los mushafs, en el que al-Suyuti se basa en el Itqan para lo que se informó de las primeras generaciones sobre la escritura, el punteado y la división en decenas, y sobre la forma del mushaf; las notas del texto editado se refieren a él por los números de sus informes {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}."
  fr: "Un livre d'Ibn Abi Dawud al-Sijistani sur les mushafs, sur lequel al-Suyuti s'appuie dans l'Itqan pour ce qui a été rapporté des premières générations sur l'écriture, la mise en forme et la division en dizaines, et sur la forme du mushaf; les notes du texte édité y font référence par les numéros de ses rapports {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246} {cite:itqan-suyuti p. 2247}."
