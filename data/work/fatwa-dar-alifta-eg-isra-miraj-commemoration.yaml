id: work/fatwa-dar-alifta-eg-isra-miraj-commemoration
class: work
kind: fatwa
label: { ar: "حكم الاحتفال بليلة الإسراء والمعراج بأنواع الطاعات", en: "Marking the Night of the Isra' and Mi'raj with acts of devotion", ur: "لیلۃ اسراء و معراج کو عبادات سے منانے کا حکم", es: "Celebrar la Noche del Isra' y el Mi'raj con actos de devoción.", fr: "Célébrer la nuit d'Isra et de Mi'raj par des actes de dévotion", tr: "İsra ve Mi'raj gecesinin çeşitli itaat eylemleriyle kutlanmasına ilişkin karar", id: "Putusan tentang perayaan malam Isra dan Mi'raj dengan berbagai tindakan ketaatan" }
summary:
  ar: "سائل سأل عن الاحتفال بذكرى الإسراء والمعراج بقراءة القرآن والاستماع إلى دروس العلم والمديح والذكر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22368)⁩ ببيان حكم إحياء تلك الذكرى بأنواع الطاعات على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about marking the Isra' and Mi'raj anniversary with Qur'an reading, listening to religious lessons, praise-poetry and remembrance. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22368) answered by setting out the ruling on honouring that remembrance with acts of devotion, under the controls the answer details."
  ur: "ایک سائل نے اسراء و معراج کی یاد قرآن خوانی، دینی دروس، مدح اور ذکر سے منانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22368)⁩ نے جواب میں اس یاد کو عبادات سے زندہ رکھنے کا حکم بیان کیا، جواب کے ضوابط کے مطابق۔"
  es: "Un consultante preguntó sobre la conveniencia de conmemorar el aniversario del Isra' y el Mi'raj mediante la lectura del Corán, la escucha de enseñanzas religiosas, la recitación de poemas de alabanza y el recuerdo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22368) respondió exponiendo la norma sobre cómo honrar dicha conmemoración con actos de devoción, según los criterios que se detallan en la respuesta."
  fr: "Une personne a posé une question concernant la commémoration de l'Isra et du Mi'raj par la lecture du Coran, l'écoute d'enseignements religieux, de poèmes de louange et le recueillement. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22368) a répondu en énonçant la règle relative à l'hommage rendu à cette commémoration par des actes de dévotion, conformément aux conditions détaillées dans la réponse."
  tr: "Bir soru soran kişi, İsra ve Mi'raj'ın yıldönümünü Kur'an okuyarak ve bilgi, övgü ve anma derslerini dinleyerek kutlamayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22368), yanıtta ayrıntılı olarak belirtildiği gibi, o yıldönümünün anılması kararını itaat eylemleriyle netleştirdi."
  id: "Seorang penanya menanyakan tentang perayaan ulang tahun Isra dan Mi'raj dengan membaca Al-Qur'an dan mendengarkan pelajaran pengetahuan, pujian, dan ingatan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22368) menanggapi dengan memperjelas putusan peringatan tersebut dengan berbagai tindakan ketaatan, seperti yang dijelaskan dalam jawaban."
