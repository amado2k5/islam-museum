label: { ar: "حكم صيام من احتلم ولم ير أثرًا للاحتلام", en: "The fast of one who had a wet dream but saw no trace", ur: "احتلام کرنے والے کا روزہ جسے کوئی اثر نظر نہ آیا" }
summary:
  ar: "سائل احتلم أثناء النوم في نهار رمضان ولم ير أثرًا فسأل عن صومه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21791)⁩ أن احتلام الصائم أثناء النوم في نهار رمضان لا يترتب عليه فساد صومه بل عليه أن يتمه وصومه صحيح شرعًا على ما فصّل الجواب."
  en: "A man had a wet dream while sleeping on a Ramadan day, saw no trace, and asked about his fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21791) answered that a faster's wet dream during a Ramadan day does not corrupt his fast — he completes it and it is valid — as the answer details."
  ur: "ایک شخص کو رمضان کے دن نیند میں احتلام ہوا اور کوئی اثر نہ ملا؛ اس نے اپنے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21791)⁩ نے جواب دیا کہ نیند میں احتلام سے روزہ فاسد نہیں ہوتا؛ وہ اسے مکمل کرے اور روزہ درست ہے — جیسا کہ جواب میں تفصیل ہے۔"
