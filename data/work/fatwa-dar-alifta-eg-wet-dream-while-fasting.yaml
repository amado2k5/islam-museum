id: work/fatwa-dar-alifta-eg-wet-dream-while-fasting
class: work
kind: fatwa
label: { ar: "حكم صيام من احتلم ولم ير أثرًا للاحتلام", en: "The fast of one who had a wet dream but saw no trace", ur: "احتلام کرنے والے کا روزہ جسے کوئی اثر نظر نہ آیا", es: "El ayuno de alguien que tuvo un sueño húmedo pero no vio rastro.", fr: "Le jeûne de celui qui a fait un rêve érotique mais n'en a vu aucune trace", tr: "Islak rüya görmüş ama bunun hiçbir izini görmemiş biri için oruç kuralları", id: "Aturan tentang puasa untuk seseorang yang pernah mengalami mimpi basah tetapi belum melihat jejak apapun" }
summary:
  ar: "سائل احتلم أثناء النوم في نهار رمضان ولم ير أثرًا فسأل عن صومه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21791)⁩ أن احتلام الصائم أثناء النوم في نهار رمضان لا يترتب عليه فساد صومه بل عليه أن يتمه وصومه صحيح شرعًا على ما فصّل الجواب."
  en: "A man had a wet dream while sleeping on a Ramadan day, saw no trace, and asked about his fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21791) answered that a faster's wet dream during a Ramadan day does not corrupt his fast — he completes it and it is valid — as the answer details."
  ur: "ایک شخص کو رمضان کے دن نیند میں احتلام ہوا اور کوئی اثر نہ ملا؛ اس نے اپنے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21791)⁩ نے جواب دیا کہ نیند میں احتلام سے روزہ فاسد نہیں ہوتا؛ وہ اسے مکمل کرے اور روزہ درست ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre tuvo un sueño húmedo mientras dormía un día de Ramadán, no vio rastro alguno y preguntó sobre su ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21791) respondió que el sueño húmedo de un ayunante durante un día de Ramadán no invalida su ayuno; lo completa y es válido, como se detalla en la respuesta."
  fr: "Un homme a eu une éjaculation nocturne pendant son sommeil un jour de Ramadan, n'en a constaté aucune trace et s'est renseigné sur la validité de son jeûne. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21791) a répondu que ce type d'éjaculation nocturne n'invalide pas le jeûne du jeûneur pendant le Ramadan: celui-ci est donc valide et accompli, comme le précise la réponse."
  tr: "Bir soru soran kişi Ramazan ayında gündüz uykusunda gece salgısı yaşadı ve hiçbir iz görmedi, bu yüzden orucunu sordu. Mısırlı Dar Al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21791), Ramazan günü oruç tutan kişinin gece salınımının orucunu geçersiz kılmadığını; aksine, orucunu tamamlamak zorunda olduğunu ve orucunun İslam hukukuna göre geçerli olduğunu yanıtladı."
  id: "Seorang penanya mengalami emisi nokturnal saat tidur di siang hari di bulan Ramadan dan tidak melihat jejaknya, sehingga ia menanyakan tentang puasanya. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21791) menjawab bahwa emisi nokturnal seseorang yang berpuasa pada hari Ramadan tidak membatalkan puasanya; melainkan ia harus menyelesaikannya, dan puasanya sah menurut hukum Islam, sebagaimana dijelaskan dalam jawaban."
