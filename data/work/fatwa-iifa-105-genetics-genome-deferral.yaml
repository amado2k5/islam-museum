label: { ar: "قرار مجمع الفقه الإسلامي الدولي 105 (11/8) بشأن الوراثة والهندسة الوراثية والجينوم البشري ⁦(مؤجل)⁩", en: "IIFA resolution 105 (11/8) on heredity, genetic engineering and the human genome ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 105 (11/8): وراثت، جینیاتی انجینئری اور انسانی جینوم ⁦(مؤجل)⁩", es: "Resolución 105 (11/8) de la IIFA sobre herencia, ingeniería genética y genoma humano (aplazada)", fr: "Résolution 105 (11/8) de l'IIFA sur l'hérédité, le génie génétique et le génome humain (reportée)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩، بعد اطلاعه على الأبحاث المقدمة وعلى قرارات وتوصيات الندوة الطبية الفقهية الحادية عشرة المنعقدة بشراكة مجمع الفقه الإسلامي بجدة والمنظمة الإسلامية للعلوم الطبية بالكويت والمكتب الإقليمي لمنظمة الصحة العالمية بالإسكندرية والإيسيسكو ⁦(جمادى الآخرة 1419هـ/أكتوبر 1998م بالكويت)⁩. قرر تأجيل إصدار قرار في الموضوع لمزيد من البحث والدراسة. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998), after reviewing the submitted research and the decisions and recommendations of the eleventh medical-fiqh seminar held jointly by the Islamic Fiqh Academy in Jeddah, the Islamic Organisation for Medical Sciences in Kuwait, the WHO regional office in Alexandria and ISESCO (Jumada II 1419 / October 1998, Kuwait). It deferred issuing a ruling on heredity, genetic engineering and the human genome for further study and research. Recorded as a deferral, not a final ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں، پیش شدہ تحقیق اور گیارہویں طبی-فقہی سمینار ⁦(جمادی الثانی 1419ھ/اکتوبر 1998ء، کویت؛ اسلامی فقہ اکیڈمی جدہ، اسلامی آرگنائزیشن برائے طبی علوم کویت، WHO کا علاقائی دفتر اسکندریہ اور آئیسیکو کے مشترکہ)⁩ کے فیصلوں و سفارشات کے مطالعے کے بعد۔ اس نے وراثت، جینیاتی انجینئری اور انسانی جینوم پر فیصلہ مزید تحقیق کے لیے مؤجل کیا۔ یہ مؤجل ہے، حتمی حکم نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su undécima sesión celebrada en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998), tras revisar las investigaciones presentadas y las decisiones y recomendaciones del undécimo seminario médico-fiqh organizado conjuntamente por la Academia Islámica de Juqh en Yeda, la Organización Islámica para las Ciencias Médicas en Kuwait, la oficina regional de la OMS en Alejandría e ISESCO (Jumada II de 1419 / octubre de 1998, Kuwait). Se aplazó la emisión de un dictamen sobre herencia, ingeniería genética y genoma humano para su posterior estudio e investigación. Se registró como un aplazamiento, no como un dictamen definitivo."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (FIQH), lors de sa 11e session à Manama (25-30 Rajab 1419, 14-19 novembre 1998), après examen des recherches soumises et des décisions et recommandations du onzième séminaire médico-judiciaire organisé conjointement par l'Académie de jurisprudence islamique de Djeddah, l'Organisation islamique des sciences médicales du Koweït, le bureau régional de l'OMS à Alexandrie et l'ISESCO (Jumada II 1419 / octobre 1998, Koweït). Elle a reporté la publication d'un avis sur l'hérédité, le génie génétique et le génome humain afin de permettre des études et recherches complémentaires. Cette décision est considérée comme un report et non comme un avis définitif."
