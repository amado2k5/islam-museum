  ar: "ورقة للدكتور جمال بدوي في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت نوفمبر 2021)⁩ تستعرض أخلاقيات الأعمال في الإسلام من الصدق في البيع إلى تحريم الربا والغش على ما فصّلته الورقة."
  en: "A paper by Dr. Jamal Badawi on the Fiqh Council of North America site (published November 2021) surveying Islamic business ethics — from honesty in trade to the prohibitions of riba and deceit — as the paper details."
  ur: "ڈاکٹر جمال بدوي کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ اسلامی کاروباری اخلاقیات پر — دیانت داری سے لے کر سود اور دھوکے کی حرمت تک — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del Dr. Jamal Badawi publicado en el sitio web del Consejo de Fiqh de Norteamérica (en noviembre de 2021) analiza la ética empresarial islámica, desde la honestidad en el comercio hasta las prohibiciones de la usura y el engaño, como se detalla en el artículo."
  fr: "Un article du Dr Jamal Badawi sur le site du Conseil Fiqh d'Amérique du Nord (publié en novembre 2021) passe en revue l'éthique commerciale islamique — de l'honnêteté dans le commerce aux interdictions du riba et de la tromperie — comme le détaille l'article."
