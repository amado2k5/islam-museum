id: work/fatwa-amja-weightier-matter-and-taqlid
class: work
kind: fatwa
label: { ar: "تقديم الأهم وتقليد العامي", en: "Putting the weightier first, and the layman's following", ur: "اہم کو مقدم رکھنا اور عوام کی تقلید" }
summary:
  ar: "سأل سائل هل يجب تقديم الأهم وهل يجوز له تقليد ابن همام الحنفي في قوله يصح التلفيق بين المذاهب مطلقًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78360 بتاريخ 27 مارس 2009)⁩ أن المشروع نقلا وعقلا إذا تعارض أمران أن يقدم أهمهما فإن تعارضت مصلحتان ولم يستطع تحقيقهما جميعًا قدم أرجحهما وإن تعارضت مفسدتان بدأ بدفع أعظمهما فإن مبنى الشريعة على تحصيل المصالح وتكميلها وتعطيل المفاسد وتقليلها، وأما التقليد فالصحيح أن العامي لا يصح له مذهب بل مذهبه مذهب من أفتاه فإذا عرضت له نازلة رفعها إلى من يثق في دينه وعلمه من أهل الفتوى فيعمل بما يفتيه به وتبرأ ذمته ولم يتعبده الله بالبحث عن فتوى إمام بعينه."
  en: "A questioner asked whether the weightier must come first, and whether he may follow Ibn Humam al-Hanafi's view that patching between madhhabs is valid absolutely. Dr. Salah al-Sawi (fatwa no. 78360, 27 March 2009) answered that when two matters conflict, scripture and reason both commend advancing the weightier: two benefits unattainable together — prefer the weightier; two harms unavoidable — ward off the graver first, the sharia being built on securing and completing benefits and disabling and minimizing harms; as for taqlid, the sound view is that the layman has no madhhab of his own — his madhhab is that of his mufti: when an issue befalls him he raises it to one he trusts in religion and learning, acts on the fatwa and is cleared, God not having bound him to seek one particular imam's opinion."
  ur: "ایک سائل نے اہم کو مقدم رکھنے اور ابن ہمام کی تلفیق کی تقلید کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78360، 27 مارچ 2009)⁩ کے مطابق مصلحت و مفسدت میں اہم مقدم ہے؛ عوام کے لیے تقلید یہ ہے کہ وہ معتمد مفتی کی فتویٰ پر عمل کرے۔"
