id: work/fatwa-amja-weightier-matter-and-taqlid
class: work
kind: fatwa
label: { ar: "تقديم الأهم وتقليد العامي", en: "Putting the weightier first, and the layman's following", ur: "اہم کو مقدم رکھنا اور عوام کی تقلید", es: "Poniendo primero lo más importante y luego lo más sencillo.", fr: "Mettre d'abord les plus importants, et le profane ensuite.", tr: "En önemlisini sunmak ve günlük dili taklit etmek", id: "Menyajikan yang paling penting dan meniru bahasa sehari-hari" }
summary:
  ar: "سأل سائل هل يجب تقديم الأهم وهل يجوز له تقليد ابن همام الحنفي في قوله يصح التلفيق بين المذاهب مطلقًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78360 بتاريخ 27 مارس 2009)⁩ أن المشروع نقلا وعقلا إذا تعارض أمران أن يقدم أهمهما فإن تعارضت مصلحتان ولم يستطع تحقيقهما جميعًا قدم أرجحهما وإن تعارضت مفسدتان بدأ بدفع أعظمهما فإن مبنى الشريعة على تحصيل المصالح وتكميلها وتعطيل المفاسد وتقليلها، وأما التقليد فالصحيح أن العامي لا يصح له مذهب بل مذهبه مذهب من أفتاه فإذا عرضت له نازلة رفعها إلى من يثق في دينه وعلمه من أهل الفتوى فيعمل بما يفتيه به وتبرأ ذمته ولم يتعبده الله بالبحث عن فتوى إمام بعينه."
  en: "A questioner asked whether the weightier must come first, and whether he may follow Ibn Humam al-Hanafi's view that patching between madhhabs is valid absolutely. Dr. Salah al-Sawi (fatwa no. 78360, 27 March 2009) answered that when two matters conflict, scripture and reason both commend advancing the weightier: two benefits unattainable together — prefer the weightier; two harms unavoidable — ward off the graver first, the sharia being built on securing and completing benefits and disabling and minimizing harms; as for taqlid, the sound view is that the layman has no madhhab of his own — his madhhab is that of his mufti: when an issue befalls him he raises it to one he trusts in religion and learning, acts on the fatwa and is cleared, God not having bound him to seek one particular imam's opinion."
  ur: "ایک سائل نے اہم کو مقدم رکھنے اور ابن ہمام کی تلفیق کی تقلید کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78360، 27 مارچ 2009)⁩ کے مطابق مصلحت و مفسدت میں اہم مقدم ہے؛ عوام کے لیے تقلید یہ ہے کہ وہ معتمد مفتی کی فتویٰ پر عمل کرے۔"
  es: "Un consultante preguntó si la opinión más importante debe ir primero y si puede seguir la postura de Ibn Humam al-Hanafi de que la conciliación entre madhhabs es absolutamente válida. El Dr. Salah al-Sawi (fatwa n.º 78360, 27 de marzo de 2009) respondió que cuando dos asuntos entran en conflicto, tanto la escritura como la razón recomiendan dar prioridad a la opinión más importante: dos beneficios inalcanzables simultáneamente: se prefiere la más importante; dos daños inevitables: se evita primero el más grave, ya que la sharia se basa en asegurar y completar los beneficios y en deshabilitar y minimizar los daños; en cuanto al taqlid, la opinión correcta es que el laico no tiene madhhab propio: su madhhab es el de su muftí: cuando le surge un problema, lo plantea a alguien en quien confía en la religión y el saber, actúa conforme a la fatwa y queda absuelto, pues Dios no le ha obligado a buscar la opinión de un imán en particular."
  fr: "Un internaute a demandé si l'avis le plus important devait prévaloir et s'il était possible de suivre l'avis d'Ibn Humam al-Hanafi selon lequel le recours à différentes écoles juridiques (madhhabs) est absolument valable. Le Dr Salah al-Sawi (fatwa n° 78360, 27 mars 2009) a répondu que, face à un conflit entre deux points, le Coran et la raison recommandent tous deux de privilégier l'avis le plus important: deux avantages inconcevables simultanément – privilégier l'avis le plus important; deux préjudices inévitables – écarter d'abord le plus grave, la charia étant fondée sur la garantie et l'accomplissement des avantages, ainsi que sur la limitation et la minimisation des préjudices. Quant au taqlid, l'avis le plus juste est que le profane n'a pas d'école juridique propre – son école juridique est celle de son mufti: lorsqu'une question se pose à lui, il la soumet à une personne de confiance en matière de religion et de savoir, suit la fatwa et est éclairé, Dieu ne l'ayant pas contraint à consulter un imam en particulier."
  tr: "Bir soru soran kişi, daha önemli olanın önceliklendirilip belirlenmemesi gerektiğini ve İbn Hammam al-Hanafi'nin düşünce mezhebleri arasındaki uydurmanın kesinlikle geçerli olduğu yönündeki ifadesini takip etmenin uygun olup olmadığını sordu. Dr. Salah Al-Sawi (27 Mart 2009 tarihli 78360 sayılı fetva) belirtti: Metinsel ve rasyonel görüş, iki konu çatışıyorsa en önemlisinin önceliklendirilmesi gerektiği; iki çıkar çatışıyorsa ve ikisi birden gerçekleştirilemiyorsa, en tercih edilenin tercih edildiği yönündedir. Eğer iki zarar varsa çatışmasını reddetmekle başlar. Şeriatın temeli, çıkarların kazanılması ve tamamlanması, zararların önlenmesi ve azaltılmasıdır. Taklit konusunda ise doğru görüş, laikin geçerli bir düşünce okuluna sahip olmadığı; aksine fetva verdiği mezhebin kendisi olduğudur. Bir mesele ortaya çıkarsa, fetvaya uygun hareket eden ve vicdanını temizleyen birine güvendiği ve Allah ona belirli bir imamın fetvasını arayarak ibadet etmediğidir."
  id: "Seorang penanya bertanya apakah yang lebih penting harus diprioritaskan, dan apakah diperbolehkan mengikuti pernyataan Ibn Hammam al-Hanafi bahwa rekayasa antar aliran pemikiran adalah mutlak valid. Dr. Salah Al-Sawi menjawab (Fatwa No. 78360 tanggal 27 Maret 2009) bahwa pendapat tekstual dan rasional yang ditetapkan adalah jika dua hal bertentangan, yang paling penting harus diprioritaskan; jika dua kepentingan bertentangan dan tidak dapat dicapai keduanya, maka yang paling disukai lebih diutamakan. Jika dua hal merugikan bertentangan, ia memulai dengan menolak yang lebih besar. Dasar Syariah didasarkan pada memperoleh dan menyelesaikan kepentingan, mencegah dan mengurangi kerugian. Mengenai peniruan, pandangan yang benar adalah bahwa orang awam tidak memiliki aliran pemikiran yang sah; melainkan aliran yang ia keluarkan fatwa. Jika suatu masalah muncul, ia merujuknya kepada seseorang yang ia percayai dalam agamanya dan pengetahuannya di antara umat fatwa, yang bertindak sesuai fatwa dan membersihkan hati nuraninya, dan Allah tidak menyembahnya dengan mencari fatwa dari seorang imam tertentu."
