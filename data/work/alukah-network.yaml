label:
  ar: "شبكة الألوكة"
  en: "Alukah Network (alukah.net)"
  ur: "شبکۃ الالوکہ ⁦(الوکہ نیٹ ورک)⁩"
summary:
  ar: "شبكة إسلامية دعوية وثقافية وعلمية وأدبية من ثلاثة عشر موقعًا بالعربية والإنجليزية، أُسست سنة 1427هـ/2006م، تضم آفاق الشريعة وثقافة ومعرفة ومجتمع وإصلاح والاستشارات وحضارة الكلمة والمسلمون في العالم والمكتبة والمكتبة الناطقة ومنتدى المجلس العلمي ومواقع شخصية لعلماء ودعاة؛ و«الألوكة» في العربية الرسالة."
  en: "An Islamic network for da'wa, culture, scholarship and letters made of thirteen sites in Arabic and English, founded in 1427 AH / 2006, among them Afaq al-Shari'a, Culture and Knowledge, Society and Reform, Consultations, the Civilisation of the Word, Muslims in the World, a library, a talking library, the al-Majlis al-Ilmi forum and personal sites of scholars and preachers; 'alukah' is Arabic for a message."
  ur: "دعوت، ثقافت، علم اور ادب کا اسلامی نیٹ ورک جو عربی اور انگریزی میں تیرہ سائٹوں پر مشتمل ہے، 1427ھ/2006 میں قائم ہوا؛ اس میں آفاق الشریعہ، ثقافت و معرفت، معاشرہ و اصلاح، مشاورت، حضارۃ الکلمہ، دنیا میں مسلمان، لائبریری، بولتی لائبریری، المجلس العلمی فورم اور علما کی ذاتی سائٹیں ہیں؛ «الالوکہ» عربی میں پیغام کو کہتے ہیں۔"
