summary:
  ar: "كتاب ديني لرشيد الدين بدأ يوم الثلاثاء التاسع من رمضان سنة 706 هـ، عقب اجتماع عقد لدى السلطان ألجايتو {cite:jami-al-tawarikh-khashshab-1960 p. 176}. يتكون من متن وذيل، ويسبقه تمهيد في مدح السلطان وأعماله، ويبحث المتن في الوحي والإلهام والمعجزة والنبوة ودرجات الأنبياء وأهل الجنة والنار {cite:jami-al-tawarikh-khashshab-1960 p. 176}."
  en: "A religious work by Rashid al-Din begun on Tuesday 9 Ramadan 706 AH, after a gathering held at the court of Sultan Oljeitu {cite:jami-al-tawarikh-khashshab-1960 p. 176}. It has a main text and an appendix, preceded by a preface praising the sultan and his works. The main text discusses revelation, inspiration, miracle, prophecy, the degrees of the prophets, and the fate of the people of Paradise and Hell {cite:jami-al-tawarikh-khashshab-1960 p. 176}."
  es: "Obra religiosa de Rashid al-Din iniciada el martes 9 de Ramadán de 706 de la Hégira, tras una reunión celebrada en la corte del sultán Oljeitu {cite:jami-al-tawarikh-khashshab-1960 p. 176}. Consta de un texto principal y un apéndice, precedidos de un prólogo que elogia al sultán y sus obras. El texto principal trata la revelación, la inspiración, el milagro, la profecía, los grados de los profetas y la suerte de los habitantes del Paraíso y del Infierno {cite:jami-al-tawarikh-khashshab-1960 p. 176}."
  fr: "Ouvrage religieux de Rashid al-Din commencé le mardi 9 ramadan 706 de l'Hégire, après une réunion tenue à la cour du sultan Oljeitu {cite:jami-al-tawarikh-khashshab-1960 p. 176}. Il comporte un texte principal et un appendice, précédés d'une préface qui loue le sultan et ses œuvres. Le texte principal traite de la révélation, de l'inspiration, du miracle, de la prophétie, des degrés des prophètes et du sort des habitants du Paradis et de l'Enfer {cite:jami-al-tawarikh-khashshab-1960 p. 176}."
  ur: "رشید الدین کی ایک مذہبی کتاب، جو منگل کے دن 9 رمضان 706ھ کو سلطان اولجایتو کے دربار کی ایک مجلس کے بعد شروع ہوئی {cite:jami-al-tawarikh-khashshab-1960 p. 176}۔ اس کا ایک متن اور ایک ذیل ہے، جس سے پہلے سلطان اور اس کے کاموں کی مدح پر مبنی تمہید ہے۔ متن میں وحی، الہام، معجزے، نبوت، انبیاء کے درجات اور جنت و دوزخ کے باشندوں کی حالت زیر بحث ہے {cite:jami-al-tawarikh-khashshab-1960 p. 176}۔"
