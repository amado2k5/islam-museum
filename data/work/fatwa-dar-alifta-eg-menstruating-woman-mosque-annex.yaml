label: { ar: "حكم دخول الحائض قاعة ملحقة بالمسجد لحضور عقد زواج", en: "A menstruating woman entering a hall attached to the mosque for a wedding", ur: "حائضہ عورت کا مسجد سے ملحقہ ہال میں شادی کی تقریب میں داخل ہونا" }
summary:
  ar: "سائل سأل عن دخول الحائض قاعة ملحقة بالمسجد لحضور عقد زواج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22386)⁩ أنه يجوز للحائض حضور عقد النكاح المنعقد في دور المناسبات الملحقة بالمسجد فهي ليست من المسجد، ولا كراهة في عبورها إلى القاعة على ما فصّل الجواب."
  en: "A questioner asked about a menstruating woman entering a hall attached to a mosque to attend a marriage contract. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22386) answered that a menstruating woman may attend the wedding held in an annexed events hall — it is not part of the mosque — and there is no dislike in her passing through to the hall, as the answer details."
  ur: "ایک سائل نے حائضہ عورت کے مسجد سے ملحقہ ہال میں عقدِ نکاح میں شریک ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22386)⁩ نے جواب دیا کہ حائضہ عورت تقریبی ہال میں ہونے والے عقد میں شرکت کر سکتی ہے کیونکہ وہ جگہ مسجد کی حصہ نہیں، اور ہال تک گزرنے میں کوئی کراہت نہیں، جیسا کہ جواب میں تفصیل ہے۔"
