label: { ar: "حكم دخول الحائض قاعة ملحقة بالمسجد لحضور عقد زواج", en: "A menstruating woman entering a hall attached to the mosque for a wedding", ur: "حائضہ عورت کا مسجد سے ملحقہ ہال میں شادی کی تقریب میں داخل ہونا", es: "Una mujer menstruante entrando a un salón anexo a la mezquita para una boda.", fr: "Une femme menstruée entre dans une salle attenante à la mosquée pour un mariage", tr: "Regl olan bir kadının camiye bağlı bir salona girip evlilik sözleşmesine katılmasına karar verme" }
summary:
  ar: "سائل سأل عن دخول الحائض قاعة ملحقة بالمسجد لحضور عقد زواج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22386)⁩ أنه يجوز للحائض حضور عقد النكاح المنعقد في دور المناسبات الملحقة بالمسجد فهي ليست من المسجد، ولا كراهة في عبورها إلى القاعة على ما فصّل الجواب."
  en: "A questioner asked about a menstruating woman entering a hall attached to a mosque to attend a marriage contract. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22386) answered that a menstruating woman may attend the wedding held in an annexed events hall — it is not part of the mosque — and there is no dislike in her passing through to the hall, as the answer details."
  ur: "ایک سائل نے حائضہ عورت کے مسجد سے ملحقہ ہال میں عقدِ نکاح میں شریک ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22386)⁩ نے جواب دیا کہ حائضہ عورت تقریبی ہال میں ہونے والے عقد میں شرکت کر سکتی ہے کیونکہ وہ جگہ مسجد کی حصہ نہیں، اور ہال تک گزرنے میں کوئی کراہت نہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de que una mujer menstruante entrara en una sala anexa a una mezquita para asistir a una ceremonia matrimonial. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22386) respondió que una mujer menstruante puede asistir a la boda celebrada en una sala de eventos anexa —que no forma parte de la mezquita— y que no hay inconveniente alguno en que acceda a dicha sala, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la possibilité pour une femme indisposée d'assister à une cérémonie de mariage dans une salle attenante à une mosquée. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22386) a répondu qu'une femme indisposée peut assister au mariage célébré dans une salle annexe – celle-ci n'étant pas une partie intégrante de la mosquée – et que sa présence dans la salle ne pose aucun problème, comme le précise la réponse."
  tr: "Bir soru soran, regl olan bir kadının camiye bitişik bir salona girip evlilik sözleşmesine katılmak için geldiğini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22386), regl olan bir kadının camiye bağlı etkinlik mekanlarında düzenlenen evlilik sözleşmesine katılmasının caiz olduğunu, çünkü caminin bir parçası olmadığını ve cevapta detaylandırıldığı gibi salondan geçmenin hoşlanmadığını söyledi."
  id: "Seorang penanya menanyakan tentang seorang wanita yang sedang menstruasi memasuki aula yang terhubung dengan masjid untuk menghadiri kontrak pernikahan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22386) menjawab bahwa diperbolehkan bagi wanita yang sedang menstruasi untuk menghadiri kontrak pernikahan yang diadakan di tempat acara yang terhubung dengan masjid, karena masjid tersebut bukan bagian dari masjid, dan tidak ada kebencian untuk melewati aula tersebut, seperti yang dijelaskan dalam jawabannya."
