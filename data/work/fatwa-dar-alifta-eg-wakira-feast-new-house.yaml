id: work/fatwa-dar-alifta-eg-wakira-feast-new-house
class: work
kind: fatwa
label: { ar: "حكم عمل الوليمة عند شراء بيت جديد ⁦(الوكيرة)⁩", en: "The housewarming feast ⁦(wakira)⁩ on buying a new home", ur: "نیا گھر خریدنے پر ولیمہ ⁦(وکیرہ)⁩ کا حکم", es: "El banquete de inauguración (wakira) al comprar una casa nueva.", fr: "Le festin de pendaison de crémaillère (wakira) lors de l'achat d'une nouvelle maison", tr: "Yeni ev satın alınırken ziyafet düzenlenmesine ilişkin karar (Al-Wakirah)", id: "Aturan tentang mengadakan pesta saat membeli rumah baru (Al-Wakirah)" }
summary:
  ar: "سائل سأل عن حكم الوليمة التي أقامها جاره عند شرائه بيتًا جديدًا ⁦(الوكيرة)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22580)⁩ أن ما قام به جاره جائز شرعًا ومندرج تحت إطعام الطعام المندوب إليه شرعًا، مع بيان آدابه وضوابطه كما فصّل الجواب."
  en: "A questioner asked about the feast his neighbour held on buying a new house (the wakira). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22580) answered that what his neighbour did is lawful and falls under the recommended feeding of food in the sharia, and the answer details its manners and controls."
  ur: "ایک سائل نے اپنے پڑوسی کے نیا گھر خریدنے پر دیے گئے ولیمے ⁦(وکیرہ)⁩ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22580)⁩ نے جواب دیا کہ اس کے پڑوسی کا یہ عمل شرعاً جائز ہے اور شریعت کے مستحب کھانا کھلانے میں داخل ہے؛ جواب میں اس کے آداب اور ضوابط بیان ہوئے۔"
  es: "Un consultante preguntó sobre el banquete que su vecino celebró al comprar una casa nueva (la wakira). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22580) respondió que lo que hizo su vecino es lícito y se ajusta a las recomendaciones de la sharia sobre la distribución de alimentos, y la respuesta detalla las normas y regulaciones al respecto."
  fr: "Un internaute a posé une question concernant le festin organisé par son voisin à l'occasion de l'achat de sa nouvelle maison (la wakira). La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22580) a répondu que cet acte était licite et relevait des recommandations de la charia en matière de distribution de nourriture, et la réponse détaille les modalités et les règles à respecter."
  tr: "Bir soru soran kişi, komşusunun yeni bir ev (Al-Wakira) alırken düzenlediği ziyafetle ilgili kuralını sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22580), komşusunun yaptığı şeyin İslam hukukuna göre izin olduğunu ve İslam hukukuna göre önerilen yiyeceği verme kategorisine girdiğini ve cevabında ayrıntılı olarak açıkladığı gibi görgü kurallarını açıkladı."
  id: "Seorang penanya menanyakan tentang keputusan pada hari raya yang diadakan oleh tetangganya saat membeli rumah baru (Al-Wakira). Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22580) menjawab bahwa apa yang dilakukan tetangganya diperbolehkan menurut hukum Islam dan termasuk dalam kategori memberinya makanan yang direkomendasikan menurut hukum Islam, menjelaskan etiket dan aturannya seperti yang dijelaskan dalam jawaban."
