label: { ar: "حكم عمل الوليمة عند شراء بيت جديد ⁦(الوكيرة)⁩", en: "The housewarming feast ⁦(wakira)⁩ on buying a new home", ur: "نیا گھر خریدنے پر ولیمہ ⁦(وکیرہ)⁩ کا حکم" }
summary:
  ar: "سائل سأل عن حكم الوليمة التي أقامها جاره عند شرائه بيتًا جديدًا ⁦(الوكيرة)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22580)⁩ أن ما قام به جاره جائز شرعًا ومندرج تحت إطعام الطعام المندوب إليه شرعًا، مع بيان آدابه وضوابطه كما فصّل الجواب."
  en: "A questioner asked about the feast his neighbour held on buying a new house (the wakira). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22580) answered that what his neighbour did is lawful and falls under the recommended feeding of food in the sharia, and the answer details its manners and controls."
  ur: "ایک سائل نے اپنے پڑوسی کے نیا گھر خریدنے پر دیے گئے ولیمے ⁦(وکیرہ)⁩ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22580)⁩ نے جواب دیا کہ اس کے پڑوسی کا یہ عمل شرعاً جائز ہے اور شریعت کے مستحب کھانا کھلانے میں داخل ہے؛ جواب میں اس کے آداب اور ضوابط بیان ہوئے۔"
