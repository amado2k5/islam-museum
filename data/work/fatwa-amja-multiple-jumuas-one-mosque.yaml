id: work/fatwa-amja-multiple-jumuas-one-mosque
class: work
kind: fatwa
label: { ar: "تعدد الجمعة في مسجد واحد", en: "Repeating Jumu'a or the Eids in one mosque — by need only", ur: "ایک مسجد میں متعدد جمعہ — ضرورت برقدر", es: "Repetir el Jumu'a o los Eids en una mezquita, solo por necesidad." }
summary:
  ar: "سأل سائل عن الشروط التي تجيز تعدد صلاة الجمعة أو العيدين في المسجد الواحد. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21985 بتاريخ 14 أكتوبر 2012)⁩ أن الأصل وحدة الجمعة وأن تكون في المسجد الجامع فإن ضاق بأهله جاز تعددها ولا حرج بالقدر الذي تندفع به الحاجة وتتحقق به المصلحة على ما فصّل الجواب."
  en: "A questioner asked the conditions permitting multiple Jumu'a or Eid prayers in one mosque. AMJA's fatwa committee (fatwa no. 21985, 14 October 2012) answered that the rule is the Jumu'a's unity in the congregational mosque; if it is too small for its people, multiplying it is lawful without harm — to the measure that answers the need and achieves the benefit — as the answer details."
  ur: "ایک مسجد میں کئی جمعے؟ لجنة الفتوى ⁦(فتویٰ 21985، 14 اکتوبر 2012)⁩ کے مطابق اصل وحدت؛ تنگی ہو تو حاجت برقدر جائز۔"
  es: "Un consultante preguntó sobre las condiciones que permiten realizar varias oraciones de Jumu'a o Eid en una misma mezquita. El comité de fatwas de AMJA (fatwa n.° 21985, 14 de octubre de 2012) respondió que la norma es que la oración de Jumu'a se realice en la misma mezquita; si es demasiado pequeña para sus feligreses, multiplicarla es lícito sin perjuicio alguno, en la medida necesaria para satisfacer la necesidad y lograr el beneficio, como se detalla en la respuesta."
