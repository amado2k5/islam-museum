id: work/fatwa-amja-multiple-jumuas-one-mosque
class: work
kind: fatwa
label: { ar: "تعدد الجمعة في مسجد واحد", en: "Repeating Jumu'a or the Eids in one mosque — by need only", ur: "ایک مسجد میں متعدد جمعہ — ضرورت برقدر", es: "Repetir el Jumu'a o los Eids en una mezquita, solo por necesidad.", fr: "Répéter la prière du vendredi (Jumu'a) ou les fêtes de l'Aïd dans une même mosquée — uniquement en cas de nécessité", tr: "Bir camide birden fazla cuma", id: "Beberapa Jumat di satu masjid" }
summary:
  ar: "سأل سائل عن الشروط التي تجيز تعدد صلاة الجمعة أو العيدين في المسجد الواحد. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21985 بتاريخ 14 أكتوبر 2012)⁩ أن الأصل وحدة الجمعة وأن تكون في المسجد الجامع فإن ضاق بأهله جاز تعددها ولا حرج بالقدر الذي تندفع به الحاجة وتتحقق به المصلحة على ما فصّل الجواب."
  en: "A questioner asked the conditions permitting multiple Jumu'a or Eid prayers in one mosque. AMJA's fatwa committee (fatwa no. 21985, 14 October 2012) answered that the rule is the Jumu'a's unity in the congregational mosque; if it is too small for its people, multiplying it is lawful without harm — to the measure that answers the need and achieves the benefit — as the answer details."
  ur: "ایک مسجد میں کئی جمعے؟ لجنة الفتوى ⁦(فتویٰ 21985، 14 اکتوبر 2012)⁩ کے مطابق اصل وحدت؛ تنگی ہو تو حاجت برقدر جائز۔"
  es: "Un consultante preguntó sobre las condiciones que permiten realizar varias oraciones de Jumu'a o Eid en una misma mezquita. El comité de fatwas de AMJA (fatwa n.° 21985, 14 de octubre de 2012) respondió que la norma es que la oración de Jumu'a se realice en la misma mezquita; si es demasiado pequeña para sus feligreses, multiplicarla es lícito sin perjuicio alguno, en la medida necesaria para satisfacer la necesidad y lograr el beneficio, como se detalla en la respuesta."
  fr: "Un internaute a demandé quelles étaient les conditions permettant d'organiser plusieurs prières du vendredi (Jumu'a) ou de l'Aïd dans une même mosquée. Le comité des fatwas de l'AMJA (fatwa n° 21985, 14 octobre 2012) a répondu que la règle est l'unité de la prière du vendredi dans la mosquée; si celle-ci est trop petite pour ses fidèles, il est permis de la multiplier sans préjudice, dans la mesure où cela répond au besoin et procure le bénéfice escompté, comme le précise la réponse."
  tr: "Bir soru soran kişiye aynı camide birden fazla Cuma veya Ramazan Bayramı namazı yapılmasına izin veren koşullar hakkında soru soruldu. Amerika İslami Hukukçular Meclisi'ndeki Fetva Komitesi (Fetva No. 21985, 14 Ekim 2012 tarihli), varsayılan olarak ana camide cuma namazı yapılması olduğunu ve insan eksikliği varsa birden fazla namaz kılmanın mümkün olduğunu, ihtiyaç karşılanıp fayda sağlandığı ölçüde zarar görmediğini yanıtladı."
  id: "Seorang penanya ditanya tentang kondisi yang memungkinkan salat Jumat atau Idul Fitri berulang kali di masjid yang sama. Komite Fatwa di Majelis Ahli Hukum Islam di Amerika (Fatwa No. 21985 tanggal 14 Oktober 2012) menjawab bahwa defaultnya adalah salat Jumat diadakan di masjid utama dan jika kekurangan orang, diperbolehkan salat ganda, dan tidak ada kerugian jika kebutuhan terpenuhi dan manfaatnya tercapai, seperti yang dijelaskan dalam jawaban."
