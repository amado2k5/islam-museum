label: { ar: "قرار مجمع الفقه الإسلامي الدولي 191 (20/6) بشأن حقوق المسجون في الفقه الإسلامي", en: "IIFA resolution 191 (20/6) on the prisoner's rights in Islamic jurisprudence", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 191 (20/6): فقہِ اسلام میں قیدی کے حقوق", es: "Resolución 191 (20/6) de la IIFA sobre los derechos del preso en la jurisprudencia islámica.", fr: "Résolution 191 (20/6) de l'IIFA sur les droits du prisonnier en jurisprudence islamique", tr: "Uluslararası İslami Fiqh Akademisi Kararı 191 (20/6) İslam fıkıhında mahkumların haklarına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 191 (20/6) mengenai hak-hak tahanan dalam yurisprudensi Islam" }
summary:
  ar: "توصية جماعية لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. أوصى مجلس المجمع بما يأتي: أن تضع أمانة المجمع مشروع وثيقة لحقوق السجناء بالتعاون مع خبراء من الدول الأعضاء؛ وأن يتولى الإشراف على السجون في كل دولة جهة مستقلة ترعى حقوق السجناء مع السعي الحثيث لمراقبة السجون وعقاب من يعتدي على تلك الحقوق؛ وأن تبني الدول الإسلامية سجونها وفق أنظمة تراعي حقوق الإنسان وكرامته ويتضمن تصميمها وسائل ضمان سلامة السجناء وكفالة حقوقهم؛ وألا تقيد حرية الأشخاص إلا بحكم قضائي يصدر وفق الضمانات القضائية التي تحقق العدالة وتجنب الظلم والتعسف؛ والعناية بالجوانب الاقتصادية للسجناء وتأهيلهم وتدريبهم على حرف مفيدة مع كفالة أجر عادل مقابل أعمالهم؛ وكفالة حق المسجون في اللقاء الاجتماعي مع أسرته وأصدقائه المعروفين بالاستقامة وتنظيم لقاءات بين الزوج وزوجته مع حفظ خصوصيتهما؛ وكفالة الحقوق التي قررتها الشريعة للسجناء من مأكل مناسب وملبس لائق ودورات مياه نظيفة وتمكين الطهارة؛ وتمكينهم من ممارسة شعائرهم الدينية بحرية والاهتمام بتعليمهم عامة والتعليم الديني خاصة وتيسير تواصلهم مع الوعاظ والمرشدين؛ والحد من العقوبات السالبة والمقيدة للحرية ما أمكن بالاستعانة بالعقوبات البدنية والبديلة للسجن؛ وعدم التوسع في الحبس الاحتياطي والاعتقال وغيره من صور التوقيف دون حكم قضائي مع سن تشريعات تضمن حقوق المطلوب القبض عليهم ووضع حد زمني أقصى للحبس الاحتياطي؛ وسن تشريعات لتعويض السجناء الذين تثبت براءتهم والمعتدى عليهم مع محاسبة المسؤولين عن الإساءات؛ وتنظيم دورات للسجناء ومسؤولي السجون للتعريف بحقوق كل منهم وواجباته والتنبيه على المقصر أو المخالف."
  en: "A collective recommendation of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). It recommended: that the secretariat draft a document of prisoners' rights with experts from member states; that each state place prison supervision in an independent body safeguarding prisoners' rights, with earnest monitoring and punishment of violators; that Islamic states build prisons under systems respecting human rights and dignity, designed to guarantee inmates' safety and rights; that no one's freedom be restricted except by a judicial ruling issued with the guarantees that achieve justice and avert wrong and arbitrariness; care for prisoners' economic conditions, qualifying and training them in useful trades during and after their sentence with a fair wage for their work; guaranteeing the prisoner's right to social visits with family and upstanding friends and organised meetings between spouses preserving privacy; guaranteeing the rights the sharia assigns prisoners — suitable food, decent clothing, clean facilities and the ability to keep purity; enabling them to practice their rites freely, attention to their education generally and religious education especially, and easy contact with preachers and guides; limiting freedom-restricting punishments as far as possible by using corporal and alternative punishments to avert the ill effects of detention; not expanding remand detention and other arrest forms without judicial ruling, legislating guarantees for detainees' rights and a maximum time-limit for remand; legislating compensation for prisoners proven innocent and for those wronged, holding abusers accountable; and organising courses for prisoners and prison officials on each party's rights and duties, with warnings to anyone lax or in breach."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی سفارش، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ سفارشات: سیکرٹریٹ رکن ممالک کے ماہرین کے ساتھ قیدیوں کے حقوق کا مسودہ تیار کرے؛ ہر ملک میں قید خانوں کی نگرانی ایک خودمختار ادارے کے سپرد ہو جو قیدیوں کے حقوق کی رعایت کرے، مکمل نگرانی اور متجاوزوں کی سزا کے ساتھ؛ اسلامی ممالک قید خانے ایسے نظام کے تحت بنائیں جو انسانی حقوق اور عزت کی رعایت رکھیں اور جن کے ڈیزائن میں قیدیوں کی حفاظت اور حقوق کی ضمانت کے تمام ذرائع ہوں؛ کسی کی آزادی محدود نہ ہو مگر عدالتی حکم سے جو انصاف کے ضمانتوں کے تحت صادر ہو اور ظلم و جبر سے بچائے؛ قیدیوں کے معاشی پہلوؤں کی دیکھ بھال — انہیں مفید ہنر سیکھانے کی تربیت اور سزا کے دوران و بعد میں کام کے بدلے منصفانہ اجر؛ قیدی کا خاندان اور نیک صحبت دوستوں سے ملنے کا حق اور میاں بیوی کے ملن کی ترتیب رازداری کے ساتھ؛ شریعت کے دیے ہوئے حقوق کی ضمانت — مناسب کھانا، لائق لباس، صاف سہولیات اور طہارت کی سہولت؛ اپنی عبادات آزادانہ انجام دینے کی سہولت، عمومی تعلیم بالخصوص دینی تعلیم پر توجہ اور واعظوں و مرشدوں سے رابطہ؛ آزادی سے محروم کرنے والی سزاؤں کی حد تک کمی — جسمانی اور متبادل سزاؤں سے قید کے منفی نتائج سے بچنا؛ ضمانت کے بغیر نظر بندی اور حراست کے توسیع نہ ہونا، گرفتار ہونے والوں کے حقوق کے ضامن قوانین اور نظر بندی کی زیادہ سے زیادہ مدت کا تعین؛ بے گناہ ثابت ہونے والے اور زیرِ ستم قیدیوں کے معاوضے کے قوانین اور ستم کرنے والے ذمہ داروں کا احتساب؛ اور قیدیوں و قید خانے کے ذمہ داران کے لیے ان کے حقوق و فرائض کی تعارفی مجالس اور کوتاہی کرنے والے کو تنبیہ۔"
  es: "Una recomendación colectiva de la Academia Internacional de Fiqh Islámico en su 20.ª sesión en Orán (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 de septiembre de 2012). Recomendó: que la secretaría redacte un documento de derechos de los presos con expertos de los Estados miembros; que cada Estado coloque la supervisión de las prisiones en un organismo independiente que salvaguarde los derechos de los presos, con un seguimiento serio y castigo de los infractores; que los Estados islámicos construyan prisiones bajo sistemas que respeten los derechos humanos y la dignidad, diseñados para garantizar la seguridad y los derechos de los reclusos; que la libertad de nadie sea restringida excepto por una resolución judicial emitida con las garantías que logren justicia y eviten el error y la arbitrariedad; cuidar las condiciones económicas de los presos, capacitándolos y capacitándolos en oficios útiles durante y después de su condena con un salario justo por su trabajo; garantizar el derecho del preso a las visitas sociales con familiares y amigos respetables y reuniones organizadas entre cónyuges que preserven la privacidad; garantizar los derechos que la sharia asigna a los presos: alimentación adecuada, ropa decente, instalaciones limpias y la capacidad de mantener la pureza; permitirles practicar sus ritos libremente, prestar atención a su educación en general y a la educación religiosa en particular, y facilitar el contacto con predicadores y guías; limitar en la medida de lo posible los castigos que restringen la libertad mediante el uso de castigos corporales y alternativos para evitar los efectos negativos de la detención; no ampliar la detención preventiva ni otras formas de arresto sin una resolución judicial, legislar garantías para los derechos de los detenidos y un límite máximo de tiempo para la detención preventiva; legislar la indemnización para los presos que sean declarados inocentes y para aquellos que hayan sufrido injusticias, responsabilizando a los abusadores; y organizar cursos para presos y funcionarios penitenciarios sobre los derechos y deberes de cada parte, con advertencias para cualquiera que sea negligente o incumpla las normas."
  fr: "Recommandation collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13-18 septembre 2012). Elle a recommandé: que le secrétariat élabore un document sur les droits des détenus avec des experts des États membres; que chaque État confie la supervision des prisons à un organisme indépendant chargé de garantir les droits des détenus, avec un suivi rigoureux et la sanction des contrevenants; que les États islamiques construisent des prisons selon des systèmes respectueux des droits humains et de la dignité, conçus pour garantir la sécurité et les droits des détenus; que la liberté de quiconque ne soit restreinte que par une décision judiciaire assortie de garanties assurant la justice et prévenant l'injustice et l'arbitraire; que les conditions économiques des détenus soient prises en compte, avec une formation professionnelle et une rémunération équitable pendant et après leur peine; que le droit des détenus aux visites familiales et amicales, ainsi qu'aux rencontres organisées entre époux dans le respect de leur vie privée, soit garanti; que les droits conférés aux détenus par la charia – alimentation adéquate, vêtements décents, installations sanitaires propres et possibilité de préserver leur pureté rituelle – soient garantis. leur permettre de pratiquer librement leurs rites, veiller à leur éducation en général et à leur éducation religieuse en particulier, et faciliter les contacts avec les prédicateurs et les guides; limiter autant que possible les peines restreignant la liberté en utilisant des châtiments corporels et des peines alternatives pour prévenir les effets néfastes de la détention; ne pas étendre la détention provisoire et les autres formes d'arrestation sans décision judiciaire, légiférer sur les garanties des droits des détenus et sur une durée maximale de détention provisoire; légiférer sur l'indemnisation des prisonniers innocentés et des victimes d'injustices, et tenir les auteurs d'abus responsables; et organiser des cours pour les prisonniers et les agents pénitentiaires sur les droits et les devoirs de chacun, avec des avertissements pour toute personne négligente ou en infraction."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Şevval – 2 Dhu-al-Qi'dah 1433 H, 13–18 Eylül 2012) toplu tavsiyesi. Konsey şunları önerdi: Akademi Sekretaryası'nın, üye devletlerden uzmanlarla iş birliği içinde mahkumların hakları hakkında bir belge hazırlaması; her ülkedeki hapishanelerin mahkumların haklarını koruyan bağımsız bir kurum tarafından denetlenmesi, cezaevlerinin izlenmesi ve bu hakları ihlal edenlerin cezalandırılması için titizlikle çaba gösterilmesi; İslam ülkelerinin hapishanelerini insan haklarına ve onuruna saygı gösteren ve mahkumların güvenliğini ve haklarını sağlamak için araçlar içeren sistemlere göre inşa etmesi; ve bireylerin özgürlüğünün yalnızca sağlanan yargısal güvencelere uygun olarak verilen bir yargı kararıyla sınırlandırılması Adalet ve adaletsizlik ile istismardan kaçınma; mahkumların ekonomik yönlerine özen göstermek, rehabilite etmek ve işlerinin adil ücretini sağlamak üzere faydalı mesleklerde eğitilmesi; mahkumların dürüstlükleriyle tanınan aile ve arkadaşlarıyla sosyal buluşma hakkının garanti altına alınması, eş ve koca arasında toplantıların düzenlenmesi ve mahremiyetlerinin korunması; Şeriat'ın mahkumlara uygun yiyecek, düzgün kıyafet, temiz banyolar ve saflık imkânı gibi haklarının garanti altına alınması; dini ritüellerini serbestçe icra etmelerinin sağlanması, genel eğitimlerine ve özellikle dini eğitime dikkat edilmesi, vaizler ve rehberlerle iletişimlerinin kolaylaştırılması; ve cezaların azaltılması Mümkün olduğunca bedensel cezalar ve hapis alternatifleri yoluyla özgürlükten mahrum bırakmak ve kısıtlamak; yargı kararı olmadan tutukluluk, gözaltı ve diğer gözaltı türlerinin genişletilmemesi, tutuklananların haklarını güvence altına alan ve tutukluluk için azami süre belirleyen yasaların çıkarılması; masum mahkumların ve saldırıya uğrayanların tazminatı için mevzuatın çıkarılması, suistimallerden sorumluların hesap vermesini sağlamak; mahkumlar ve cezaevi görevlileri için hak ve görevlerini tanıtmaları ve ihmalkar veya kuralları ihlal edenleri uyarmaları için kurslar düzenlemek."
  id: "Rekomendasi kolektif Akademi Fiqh Islam Internasional pada sesi kedua puluh di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012). Dewan merekomendasikan hal-hal berikut: agar Sekretariat Akademi menyusun dokumen tentang hak-hak narapidana bekerja sama dengan para ahli dari negara anggota; bahwa penjara di setiap negara diawasi oleh badan independen yang melindungi hak-hak narapidana, dengan upaya tekun untuk memantau penjara dan menghukum mereka yang melanggar hak tersebut; bahwa negara-negara Islam membangun penjara mereka sesuai dengan sistem yang menghormati hak asasi manusia dan martabat serta mencakup sarana untuk menjamin keselamatan dan hak narapidana; dan bahwa kebebasan individu hanya dibatasi oleh putusan yudisial yang dikeluarkan sesuai dengan jaminan yudisial yang telah dicapai Keadilan dan pencegahan ketidakadilan serta penyalahgunaan; perawatan aspek ekonomi tahanan, rehabilitasi mereka, dan pelatihan mereka dalam pekerjaan yang berguna dengan memastikan upah yang adil atas pekerjaan mereka; menjamin hak tahanan untuk berkumpul sosial dengan keluarga dan teman yang dikenal akan integritasnya, mengorganisir pertemuan antara suami dan istri sambil menjaga privasi mereka; menjamin hak-hak yang ditetapkan oleh Syariah bagi tahanan termasuk makanan yang layak, pakaian layak, kamar mandi bersih, dan kemungkinan kemurnian; memungkinkan mereka menjalankan ritual keagamaan secara bebas, memperhatikan pendidikan secara umum dan pendidikan agama secara khusus, memfasilitasi komunikasi mereka dengan pengkhotbah dan pemandu; serta mengurangi hukuman Pencabutan dan pembatasan kebebasan sebanyak mungkin melalui hukuman fisik dan alternatif penahanan; tidak memperluas penahanan pra-persidangan, penahanan, dan bentuk penahanan lainnya tanpa putusan pengadilan, mengesahkan undang-undang yang menjamin hak mereka yang dicari untuk ditangkap dan menetapkan batas waktu maksimum untuk penahanan pra-persidangan; mengesahkan undang-undang untuk mengkompensasi tahanan tak bersalah dan mereka yang telah diserang, dengan meminta pertanggungjawaban pelaku penyalahgunaan; menyelenggarakan kursus bagi tahanan dan pejabat penjara untuk memperkenalkan hak dan kewajiban mereka serta memperingatkan mereka yang lalai atau melanggar aturan."
