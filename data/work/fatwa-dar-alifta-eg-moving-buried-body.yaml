id: work/fatwa-dar-alifta-eg-moving-buried-body
class: work
kind: fatwa
label: { ar: "حكم نقل الميت من قبره بعد دفنه للضرورة", en: "Moving a buried body for necessity", ur: "ضرورت کے پیشِ نظر دفن شدہ میت کو قبر سے منتقل کرنا", es: "Trasladar un cuerpo enterrado por necesidad", fr: "Déplacer un corps enterré par nécessité", tr: "Zorunluluktan dolayı defnedilen ölülerin mezarından çıkarılmasına ilişkin karar", id: "Putusan tentang pemindahan almarhum dari makam setelah pemakaman karena kebutuhan" }
summary:
  ar: "سائل سأل عن نقل ميت من قبره بعد دفنه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24318)⁩ أن الأصل حرمة نبش القبر ونقل الميت المدفون فيه إلى مكان آخر، إلا لضرورة أو حاجة أو مصلحة معتبرة شرعًا؛ فإذا وجدت الضرورة جاز النقل بالضوابط التي فصّلها الجواب."
  en: "A questioner asked about moving a dead person from his grave after burial. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24318) answered that in principle exhuming a grave and moving its buried body elsewhere is prohibited, except for a necessity, need or sharia-recognised interest; where such necessity exists, moving is permitted under the conditions the answer details."
  ur: "ایک سائل نے دفن کے بعد میت کو اس کی قبر سے منتقل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24318)⁩ نے جواب دیا کہ اصولاً قبر کھود کر مدفون میت کو دوسری جگہ منتقل کرنا حرام ہے، سوائے ضرورت، حاجت یا شرعی مصلحت کے؛ ضرورت موجود ہو تو جواب کے بیان کردہ ضوابط کے ساتھ منتقلی جائز ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de trasladar a una persona fallecida de su tumba después del entierro. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24318) respondió que, en principio, exhumar una tumba y trasladar el cuerpo enterrado a otro lugar está prohibido, salvo por necesidad, requerimiento o interés reconocido por la sharia; cuando existe tal necesidad, el traslado está permitido bajo las condiciones que se detallan en la respuesta."
  fr: "Une personne a posé une question concernant le déplacement d'un défunt après son inhumation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24318) a répondu qu'en principe, l'exhumation d'une tombe et le déplacement du corps sont interdits, sauf en cas de nécessité, de besoin ou d'intérêt reconnu par la charia; en cas de nécessité, le déplacement est autorisé sous les conditions détaillées dans la réponse."
  tr: "Bir soru soran kişi, ölen kişinin defin sonrası mezarından nakledilmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 24318), mezarın mezardan çıkarılmasının ve başka bir yere naklinin yasak olduğunu, ancak zorunluluk, ihtiyaç veya dini açıdan geçerli bir menfaat varsa, bu nedenle nakil izin verildiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang pemindahan orang yang telah meninggal dari makamnya setelah pemakaman. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 24318) menjawab bahwa pelanggaran adalah larangan menggali kembali makam dan memindahkan jenazah yang dikuburkan ke tempat lain, kecuali karena kebutuhan, kebutuhan, atau kepentingan yang sah secara agama; jika memang ada, pemindahan diperbolehkan sesuai dengan ketentuan yang dijelaskan dalam jawaban."
