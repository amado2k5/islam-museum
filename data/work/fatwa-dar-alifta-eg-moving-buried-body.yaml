id: work/fatwa-dar-alifta-eg-moving-buried-body
class: work
kind: fatwa
label: { ar: "حكم نقل الميت من قبره بعد دفنه للضرورة", en: "Moving a buried body for necessity", ur: "ضرورت کے پیشِ نظر دفن شدہ میت کو قبر سے منتقل کرنا", es: "Trasladar un cuerpo enterrado por necesidad" }
summary:
  ar: "سائل سأل عن نقل ميت من قبره بعد دفنه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24318)⁩ أن الأصل حرمة نبش القبر ونقل الميت المدفون فيه إلى مكان آخر، إلا لضرورة أو حاجة أو مصلحة معتبرة شرعًا؛ فإذا وجدت الضرورة جاز النقل بالضوابط التي فصّلها الجواب."
  en: "A questioner asked about moving a dead person from his grave after burial. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24318) answered that in principle exhuming a grave and moving its buried body elsewhere is prohibited, except for a necessity, need or sharia-recognised interest; where such necessity exists, moving is permitted under the conditions the answer details."
  ur: "ایک سائل نے دفن کے بعد میت کو اس کی قبر سے منتقل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24318)⁩ نے جواب دیا کہ اصولاً قبر کھود کر مدفون میت کو دوسری جگہ منتقل کرنا حرام ہے، سوائے ضرورت، حاجت یا شرعی مصلحت کے؛ ضرورت موجود ہو تو جواب کے بیان کردہ ضوابط کے ساتھ منتقلی جائز ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de trasladar a una persona fallecida de su tumba después del entierro. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24318) respondió que, en principio, exhumar una tumba y trasladar el cuerpo enterrado a otro lugar está prohibido, salvo por necesidad, requerimiento o interés reconocido por la sharia; cuando existe tal necesidad, el traslado está permitido bajo las condiciones que se detallan en la respuesta."
