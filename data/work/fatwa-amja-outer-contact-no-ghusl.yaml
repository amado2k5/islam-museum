id: work/fatwa-amja-outer-contact-no-ghusl
class: work
kind: fatwa
label: { ar: "التلامس دون إيلاج", en: "Outer contact with neither entry nor emission — no washing", ur: "بغیر دخول و انزال تماس — غسل نہیں", es: "Contacto exterior sin entrada ni emisión: no se requiere lavado.", fr: "Contact extérieur sans entrée ni émission — pas de lavage", tr: "Penetrasyon olmayan temas", id: "Kontak tanpa penetrasi" }
summary:
  ar: "سأل سائل هل يجب الغسل على الزوجين إن تلامسا من الخارج دون إيلاج. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80361 بتاريخ 28 أكتوبر 2009)⁩ أن الغسل يجب بالإيلاج ولو بغير إنزال كما يجب بالإنزال ولو بغير إيلاج أما إذا لم يحدث شيء من ذلك بل كان مجرد تلامس من الخارج بلا إيلاج ولا إنزال فلا يجب الغسل على ما فصّل الجواب."
  en: "A questioner asked whether spouses' outer contact without entry obliges the washing. Dr. Salah al-Sawi (fatwa no. 80361, 28 October 2009) answered that washing binds on entry even without emission, and on emission even without entry; but where neither happened — mere contact from outside with no entry and no emission — no washing binds, as the answer details."
  ur: "بغیر دخول و انزال تماس پر غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80361، 28 اکتوبر 2009)⁩ کے مطابق دونوں میں سے کوئی نہ ہو تو غسل نہیں۔"
  es: "Un consultante preguntó si el contacto externo entre cónyuges sin penetración obliga a realizar el lavado vaginal. El Dr. Salah al-Sawi (fatwa n.° 80361, 28 de octubre de 2009) respondió que el lavado vaginal obliga incluso con penetración sin emisión, y también con emisión sin penetración; pero cuando no ocurre ninguna de las dos cosas —mero contacto externo sin penetración ni emisión— no es necesario realizar el lavado vaginal, como se detalla en la respuesta."
  fr: "Une personne a demandé si le contact extérieur entre époux, sans pénétration, rendait obligatoire le lavage. Le Dr Salah al-Sawi (fatwa n° 80361, 28 octobre 2009) a répondu que le lavage est obligatoire lors de la pénétration, même sans émission, et lors de l'émission, même sans pénétration; mais en l'absence de pénétration ni d'émission, le simple contact extérieur ne rend pas le lavage obligatoire, comme le précise la réponse."
  tr: "Bir soru soran, çiftin dışarıdan dokunması halinde ghusl'un zorunlu olup olmadığını sordu. Dr. Salah Al-Sawy (28 Ekim 2009 tarihli Fetva No. 80361) cevabında ghusl, ejala'sız bile penetrasyonda zorunludur, tıpkı ejalaj için de penetrasyon olmadan zorunludur. Ancak bunların hiçbiri gerçekleşmezse, sadece dış temas ve penetrasyon ya da boşalma olmadansa, cevabda detaylandırıldığı gibi ghusl zorunlu değildir."
  id: "Seorang penanya bertanya apakah ghusl wajib bagi pasangan jika mereka menyentuh dari luar tanpa penetrasi. Dr. Salah Al-Sawy menjawab (Fatwa No. 80361 tanggal 28 Oktober 2009) bahwa ghusl wajib dengan penetrasi bahkan tanpa ejala, sama seperti wajib pada ejalaj bahkan tanpa penetrasi. Namun, jika tidak ada yang terjadi, tetapi hanya kontak eksternal tanpa penetrasi atau ejakulasi, maka ghusl tidak wajib seperti yang dijelaskan dalam jawaban."
