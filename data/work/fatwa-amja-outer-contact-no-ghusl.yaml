id: work/fatwa-amja-outer-contact-no-ghusl
class: work
kind: fatwa
label: { ar: "التلامس دون إيلاج", en: "Outer contact with neither entry nor emission — no washing", ur: "بغیر دخول و انزال تماس — غسل نہیں" }
summary:
  ar: "سأل سائل هل يجب الغسل على الزوجين إن تلامسا من الخارج دون إيلاج. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80361 بتاريخ 28 أكتوبر 2009)⁩ أن الغسل يجب بالإيلاج ولو بغير إنزال كما يجب بالإنزال ولو بغير إيلاج أما إذا لم يحدث شيء من ذلك بل كان مجرد تلامس من الخارج بلا إيلاج ولا إنزال فلا يجب الغسل على ما فصّل الجواب."
  en: "A questioner asked whether spouses' outer contact without entry obliges the washing. Dr. Salah al-Sawi (fatwa no. 80361, 28 October 2009) answered that washing binds on entry even without emission, and on emission even without entry; but where neither happened — mere contact from outside with no entry and no emission — no washing binds, as the answer details."
  ur: "بغیر دخول و انزال تماس پر غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80361، 28 اکتوبر 2009)⁩ کے مطابق دونوں میں سے کوئی نہ ہو تو غسل نہیں۔"
