id: work/fatwa-amja-impurity-on-body-prayer
class: work
kind: fatwa
label: { ar: "إزالة النجاسة للصلاة", en: "Impurity on the praying body — removing it is a condition", ur: "نمازی کے بدن پر نجاست — صفائی شرط ہے", es: "Impureza en el cuerpo que ora: eliminarla es una condición", fr: "Impureté sur le corps en prière — l'éliminer est une condition", tr: "Dua için kirleri kaldırmak", id: "Menghilangkan kotoran untuk berdoa" }
summary:
  ar: "سأل سائل أنه ذهب إلى المسجد للصلاة وأثناء الوضوء وقع عليه أمر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85549 بتاريخ 20 سبتمبر 2011)⁩ أن إزالة النجاسة عن محمول المصلي وبدنه واجب مع الذكر والقدرة في أظهر أقوال أهل العلم، جاء في الموسوعة الفقهية أن الحنفية والشافعية والحنابلة ذهبوا إلى أنها شرط لصحة الصلاة إلا ما كان معفوًا عنه وللمالكية قولان مشهوران أحدهما أن إزالة الخبث سنة، فعلى السائل إزالة ما أصابه من النجاسة قبل الصلاة فإن عجز عن إزالتها في الوقت صلى بحاله ولا قضاء عليه على ما فصّل الجواب."
  en: "A questioner went to the mosque to pray and something befell him during wudu. Dr. Salah al-Sawi (fatwa no. 85549, 20 September 2011) answered that removing impurity from the praying person's garment and body is obligatory where remembered and possible, in the clearest of the scholars' sayings — the Kuwaiti Fiqh Encyclopedia records Hanafis, Shafi'is and Hanbalis holding it a condition of valid prayer save what is pardoned, while the Malikis have two well-known positions, one counting removal of filth a sunna; so he must remove what struck him before praying, and if unable within the time he prays as he is with no make-up owed — as the answer details."
  ur: "ایک سائل پر وضو کے دوران نجاست آ گئی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85549، 20 ستمبر 2011)⁩ کے مطابق صفائی شرط ہے لیکن عذر میں صلات بحالہ صحیح ہے۔"
  es: "Un consultante acudió a la mezquita para rezar y le ocurrió algo durante la ablución. El Dr. Salah al-Sawi (fatwa n.º 85549, 20 de septiembre de 2011) respondió que eliminar la impureza de la vestimenta y el cuerpo del rezante es obligatorio cuando se recuerda y es posible, según las opiniones más claras de los eruditos. La Enciclopedia de Fiqh de Kuwait registra que los hanafíes, shafi'ís y hanbalíes lo consideran una condición para una oración válida, salvo lo que se perdona, mientras que los malikíes tienen dos posturas bien conocidas, una de las cuales considera la eliminación de la suciedad una sunna; por lo tanto, debe eliminar lo que le afectó antes de rezar, y si no puede hacerlo dentro del tiempo, reza como está sin tener que compensarlo, como se detalla en la respuesta."
  fr: "Un fidèle se rendit à la mosquée pour prier et un incident lui arriva pendant ses ablutions. Le Dr Salah al-Sawi (fatwa n° 85549, 20 septembre 2011) répondit que la purification des vêtements et du corps du priant est obligatoire lorsqu'il s'en souvient et que cela est possible, conformément à l'avis le plus clair des savants. L'Encyclopédie de jurisprudence islamique du Koweït rapporte que les hanafites, les chaféites et les hanbalites considèrent cela comme une condition de validité de la prière, sauf en cas de pardon. Quant aux malikites, ils ont deux positions bien connues, dont l'une considère la purification comme une sunna. Le fidèle doit donc se purifier avant la prière et, s'il n'y parvient pas dans le temps imparti, il prie tel quel, sans obligation de rattrapage, comme le précise la réponse."
  tr: "Bir soruya namaz kılmak için camiye gidip gitmediği soruldu ve abdest alma sırasında emredildi. Dr. Salah Al-Sawy (20 Eylül 2011 tarihli 85549 No. fetva) ibadet edenin eşyalarından ve bedeninden kirlerin çıkarılmasının anma ve yetenekle zorunlu olduğunu yanıtladı. En açık alimlerin görüşlerine göre, fıkıh ansiklopedisi, Hanefi, Şafii ve Hanbali mezhebinin namazın geçerliliği için bir koşul olduğunu belirtir, ancak muaf olanlar hariç. Malikilerin iki bilinen görüşü vardır; bunlardan biri kirliliğin ortadan kaldırılmasının Sünnet olduğudur. Sorgulayan kişi namazdan önce kendisini etkileyen kirleri temizlemelidir. O anda çıkaramazsa, yalnız namaz kılmalı ve cevapta belirtildiği gibi uydurmamalıdır."
  id: "Seorang penanya ditanya apakah ia pergi ke masjid untuk shalat dan saat wudhu ia diperintahkan. Dr. Salah Al-Sawy menjawab (Fatwa No. 85549 tanggal 20 September 2011) bahwa menghilangkan kotoran dari barang dan tubuh jamaah adalah kewajiban dengan ingatan dan kemampuan. Menurut pendapat paling jelas para ulama, ensiklopedia firisprudensi menyatakan bahwa mazhab Hanafi, Syafi'i, dan Hanbali menganggap hal itu sebagai syarat keabsahan shalat kecuali yang dikecualikan. Umat Malik memiliki dua pendapat terkenal, salah satunya adalah bahwa menghilangkan kotoran adalah Sunnah. Penanya harus menghilangkan kotoran yang telah menimpa dirinya sebelum shalat. Jika ia tidak dapat menghilangkannya pada saat itu, ia harus berdoa sendiri dan tidak mengada-ada, seperti yang dijelaskan dalam jawaban."
