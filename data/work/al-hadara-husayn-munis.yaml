summary:
  ar: "كتاب للمؤرخ حسين مؤنس في أصول الحضارة وعوامل قيامها وتطورها، صدر سنة 1978 العددَ الأول من سلسلة «عالم المعرفة» عن المجلس الوطني للثقافة والفنون والآداب في الكويت، في 354 صفحة."
  en: "A book by the historian Husayn Muʾnis on the origins of civilization and the factors behind its rise and development, published in 1978 as the first number of the ʿĀlam al-Maʿrifa series of Kuwait's National Council for Culture, Arts and Letters (354 pages)."
  ur: "مؤرخ حسین مؤنس کی کتاب جو تہذیب کے آغاز اور اس کے عروج و ارتقا کے عوامل پر ہے؛ 1978ء میں کویت کی قومی کونسل برائے ثقافت، فنون و ادب کے سلسلے «عالم المعرفة» کے پہلے شمارے کے طور پر 354 صفحات میں شائع ہوئی۔"
  fr: "al-Ḥaḍāra (« La civilisation : étude de ses origines et des facteurs de son essor et de son développement ») est un livre de Husayn Muʾnis, publié dans la collection ʿĀlam al-Maʿrifa au Koweït en 1978. Comme l'indique son titre, il étudie les origines de la civilisation et les facteurs de son essor et de son développement."
  es: "al-Ḥaḍāra («La civilización: estudio de sus orígenes y de los factores de su surgimiento y desarrollo») es un libro de Husayn Muʾnis, publicado en la colección ʿĀlam al-Maʿrifa en Kuwait en 1978. Como indica su título, estudia los orígenes de la civilización y los factores de su surgimiento y desarrollo."
  tr: "el-Hadâra (\"Medeniyet: Doğuşunun ve Gelişmesinin Kökenleri ve Etkenleri Üzerine Bir İnceleme\"), Hüseyin Mûnis'in 1978'de Kuveyt'te ʿÂlemü'l-Maʿrife dizisinde yayımlanan kitabıdır. Başlığının da belirttiği gibi, medeniyetin kökenlerini ve doğuşunu ve gelişmesini sağlayan etkenleri inceler."
  id: "al-Ḥaḍārah (\"Peradaban: Kajian tentang Asal-Usul serta Faktor Kebangkitan dan Perkembangannya\") adalah buku karya Husain Mu'nis yang terbit dalam seri ʿĀlam al-Maʿrifah di Kuwait pada 1978. Sesuai judulnya, buku ini mengkaji asal-usul peradaban serta faktor-faktor kebangkitan dan perkembangannya."
