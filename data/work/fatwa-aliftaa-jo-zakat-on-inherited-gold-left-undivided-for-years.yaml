id: work/fatwa-aliftaa-jo-zakat-on-inherited-gold-left-undivided-for-years
class: work
kind: fatwa
label: { ar: "زكاة ذهب موروث بقي دون قسمة سنوات", en: "Zakat on inherited gold left undivided for years", ur: "برسوں بغیر تقسیم کے رہنے والے وراثتی سونے کی زکات" }
summary:
  ar: "سؤال عن ذهب تركته جدة وبقي ثلاثين سنة دون توزيع، عرضت فيه دائرة الإفتاء العام الأردنية قول الشافعية بوجوب زكاة كل السنوات الماضية عند القبض، وقول المالكية بأن الحول يبدأ من القبض، وأجازت للورثة الأخذ بأي القولين. أجابت الدائرة بأن مال المتوفى يخرج عن ملكه بوفاته وينقطع حول زكاته ويدخل في ملك الورثة، فيبدأ له حول جديد من لحظة الوفاة، فإذا قُسمت التركة حسب كل وارث حول نصيبه إن بلغ النصاب. وقالت إن المال إذا بقي مشتركًا غير مقسوم وبلغ النصاب، وهو 85 غرامًا من الذهب عيار 24، وجبت زكاته كل حول عند الشافعية، فيخرج كل وارث عند قبض نصيبه زكاة السنوات الماضية بنسبة 2.5% لأن ملكه لم ينقطع، ونقلت قول الخطيب الشربيني في مغني المحتاج في زكاة المال المغصوب والضال إذا عاد إلى صاحبه. ونقلت أن المالكية يعتبرون القبض وحولان الحول، فلا زكاة على المال الموروث لما مضى قبل قبضه، ويستأنف الوارث حولًا جديدًا بعد القبض، واستشهدت بكلام الدسوقي في حاشيته على الشرح الكبير إن المعول عليه مذهب المدونة من اعتبار القبض. وخلصت إلى أن من أراد من الورثة الأحوط فقلد الشافعية وأخرج زكاة السنوات السابقة فله ذلك، ومن قلد المالكية فبدأ الحول من يوم قبض حصته، نظرًا لطول مدة حبس المال، فلا حرج عليه."
  en: "A question about gold left by a grandmother that stayed undivided for thirty years, in which Jordan's General Iftaa Department set out the Shafi'i view that zakat for all past years is due on receipt and the Maliki view that the zakat year starts from receipt, and allowed the heirs to follow either view. The Department answered that a deceased person's wealth leaves his ownership on death, its zakat year is cut off, and it passes into the heirs' ownership, starting a new year from the moment of death; if the estate is divided, each heir reckons the year on his own share if it reaches the minimum. It said that if the wealth stays jointly held and undivided and reaches the minimum, which it gives as 85 grams of 24-carat gold, the Shafi'is hold its zakat due every year, so each heir pays the past years' zakat at 2.5% on receiving his share, because his ownership never lapsed; it quoted al-Khatib al-Shirbini in Mughni al-Muhtaj on zakat on seized or lost wealth once it returns to its owner. It reported that the Malikis require receipt and the passing of a year, so there is no zakat on inherited wealth for the years before it is received and the heir starts a new year after receipt, citing al-Dasuqi's gloss on al-Sharh al-Kabir that the relied-upon position is that of al-Mudawwana, which counts receipt. It concluded that heirs who wish to take the more cautious course may follow the Shafi'is and pay zakat for the past years, while those who follow the Malikis and start the year from the day they receive their shares, given how long the wealth was held, do nothing wrong."
  ur: "ایک دادی کے چھوڑے ہوئے سونے کے بارے میں سوال جو تیس برس بغیر تقسیم کے رہا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے شوافع کا قول بیان کیا کہ قبضے پر تمام گزشتہ برسوں کی زکات واجب ہے، اور مالکیہ کا قول کہ زکات کا سال قبضے سے شروع ہوتا ہے، اور وارثوں کو کسی بھی قول پر عمل کی اجازت دی۔ ڈیپارٹمنٹ نے جواب دیا کہ میت کا مال وفات سے اس کی ملکیت سے نکل جاتا ہے، اس کی زکات کا سال منقطع ہو جاتا ہے اور وہ وارثوں کی ملکیت میں آ جاتا ہے، جس کا نیا سال وفات کے لمحے سے شروع ہوتا ہے؛ اگر ترکہ تقسیم ہو جائے تو ہر وارث اپنے حصے کا سال شمار کرے اگر وہ نصاب کو پہنچے۔ اس نے کہا کہ اگر مال مشترک اور غیر تقسیم شدہ رہے اور نصاب کو پہنچے، جو اس نے 24 قیراط سونے کے 85 گرام بتایا، تو شوافع کے نزدیک ہر سال اس کی زکات واجب ہے، چنانچہ ہر وارث اپنا حصہ لیتے وقت گزشتہ برسوں کی زکات 2.5% کے حساب سے ادا کرے کیونکہ اس کی ملکیت منقطع نہیں ہوئی؛ اس نے غصب شدہ یا گم شدہ مال کے مالک کو واپس ملنے پر اس کی زکات کے بارے میں مغنی المحتاج سے خطیب شربینی کا قول نقل کیا۔ اس نے نقل کیا کہ مالکیہ قبضے اور سال گزرنے کا اعتبار کرتے ہیں، لہٰذا وراثتی مال پر قبضے سے پہلے کے برسوں کی زکات نہیں اور وارث قبضے کے بعد نیا سال شروع کرے؛ اس نے الشرح الکبیر پر دسوقی کے حاشیے کا حوالہ دیا کہ معتمد المدونہ کا مذہب ہے جو قبضے کا اعتبار کرتا ہے۔ اس نے نتیجہ نکالا کہ جو وارث احتیاط چاہے وہ شوافع کی تقلید میں گزشتہ برسوں کی زکات ادا کر سکتا ہے، اور جو مالکیہ کی تقلید میں، مال کے طویل عرصہ رکے رہنے کے پیش نظر، اپنا حصہ لینے کے دن سے سال شروع کرے اس پر کوئی حرج نہیں۔"
