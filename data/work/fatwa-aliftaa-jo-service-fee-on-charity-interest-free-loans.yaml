id: work/fatwa-aliftaa-jo-service-fee-on-charity-interest-free-loans
class: work
kind: fatwa
label: { ar: "رسوم الخدمات على القروض الحسنة في جمعية خيرية", en: "Service fees on a charity's interest-free loans", ur: "خیراتی انجمن کے بلا سود قرضوں پر سروس فیس" }
summary:
  ar: "سؤال من جمعية خيرية تقدم قروضًا حسنة دوارة وتخصم من المقترض 2% بدل خدمات، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز تحميل المقترض التكلفة الفعلية المباشرة للقرض دون أي زيادة، وإلا كان ربا. أجابت الدائرة بأنه يجوز تحميل المقترض تكاليف القرض من أمور مكتبية وأجور موظفين موكلين بمتابعة وفائه، بشرط أن يساوي المبلغ التكلفة الفعلية المباشرة دون أدنى زيادة ربحية، أخذًا بقول الحنفية في تحميل المستقرض أجرة كتابة الدين. واشترطت أن تكون الرسوم إدارية محضة لا ربح فيها، وأن تُحسب بدقة لا تقريبًا، وألا تُحسب فيها إلا أجور العاملين في شؤون هذه القروض وحدها، وألا تدخل فيها أجور المكان والأثاث المستعملة في معاملات أخرى، وأن تُبيَّن آلية حسابها بإشراف لجنة شرعية. وخلصت إلى أنه إذا التزمت الجهة المقرضة بهذه الشروط فلا حرج، وإلا كانت الرسوم من الربا المحرم."
  en: "A question from a charity that runs revolving interest-free loans and deducts 2% from each borrower as a service charge, in which Jordan's General Iftaa Department answered that a borrower may be charged the loan's actual direct cost without any increase, and that anything else is riba. The Department answered that a borrower may be charged the costs of the loan, such as office work and the wages of staff assigned to following up repayment, provided the amount equals the actual direct cost with no profit at all, following the Hanafi jurists, who placed the fee for writing up a debt on the borrower. It set conditions: the fees must be purely administrative with no profit, calculated exactly rather than estimated, include only the wages of staff working on these loans alone, exclude premises and furniture also used for other business, and have their method of calculation set out under the supervision of a sharia committee. It concluded that if the lender keeps to these conditions there is no objection, and otherwise the fees are forbidden riba."
  ur: "ایک خیراتی انجمن کا سوال جو گردشی بلا سود قرضے دیتی ہے اور ہر قرض دار سے سروس چارج کے طور پر 2% کاٹتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض دار سے قرض کی حقیقی براہِ راست لاگت بغیر کسی اضافے کے لی جا سکتی ہے، ورنہ یہ سود ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض دار سے قرض کے اخراجات، جیسے دفتری کام اور ادائیگی کی نگرانی پر مامور عملے کی تنخواہیں، لیے جا سکتے ہیں بشرطیکہ رقم حقیقی براہِ راست لاگت کے برابر ہو اور اس میں ذرا بھی منافع نہ ہو، اور یہ حنفی فقہاء کے قول پر مبنی ہے جنہوں نے قرض لکھنے کی اجرت قرض دار پر رکھی۔ اس نے شرائط رکھیں: فیس خالص انتظامی ہو اور اس میں منافع نہ ہو، تخمینے کے بجائے ٹھیک ٹھیک حساب ہو، صرف انہی قرضوں پر کام کرنے والے عملے کی تنخواہ شامل ہو، دوسرے کاموں میں استعمال ہونے والی جگہ اور فرنیچر کا کرایہ شامل نہ ہو، اور حساب کا طریقہ شرعی کمیٹی کی نگرانی میں واضح کیا جائے۔ اس نے نتیجہ نکالا کہ اگر قرض دینے والا ادارہ ان شرائط کی پابندی کرے تو حرج نہیں، ورنہ یہ فیس حرام سود ہے۔"
