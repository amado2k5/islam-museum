id: work/fatwa-aliftaa-jo-service-fee-on-charity-interest-free-loans
class: work
kind: fatwa
label: { ar: "رسوم الخدمات على القروض الحسنة في جمعية خيرية", en: "Service fees on a charity's interest-free loans", ur: "خیراتی انجمن کے بلا سود قرضوں پر سروس فیس", es: "Comisiones por servicios en préstamos sin intereses de una organización benéfica", fr: "Frais de service sur les prêts sans intérêt d'un organisme de bienfaisance", tr: "Bir hayır kurumunda verilen yardım amaçlı kredilerde hizmet ücretleri", id: "Biaya layanan untuk pinjaman amal di sebuah badan amal" }
summary:
  ar: "سؤال من جمعية خيرية تقدم قروضًا حسنة دوارة وتخصم من المقترض 2% بدل خدمات، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز تحميل المقترض التكلفة الفعلية المباشرة للقرض دون أي زيادة، وإلا كان ربا. أجابت الدائرة بأنه يجوز تحميل المقترض تكاليف القرض من أمور مكتبية وأجور موظفين موكلين بمتابعة وفائه، بشرط أن يساوي المبلغ التكلفة الفعلية المباشرة دون أدنى زيادة ربحية، أخذًا بقول الحنفية في تحميل المستقرض أجرة كتابة الدين. واشترطت أن تكون الرسوم إدارية محضة لا ربح فيها، وأن تُحسب بدقة لا تقريبًا، وألا تُحسب فيها إلا أجور العاملين في شؤون هذه القروض وحدها، وألا تدخل فيها أجور المكان والأثاث المستعملة في معاملات أخرى، وأن تُبيَّن آلية حسابها بإشراف لجنة شرعية. وخلصت إلى أنه إذا التزمت الجهة المقرضة بهذه الشروط فلا حرج، وإلا كانت الرسوم من الربا المحرم."
  en: "A question from a charity that runs revolving interest-free loans and deducts 2% from each borrower as a service charge, in which Jordan's General Iftaa Department answered that a borrower may be charged the loan's actual direct cost without any increase, and that anything else is riba. The Department answered that a borrower may be charged the costs of the loan, such as office work and the wages of staff assigned to following up repayment, provided the amount equals the actual direct cost with no profit at all, following the Hanafi jurists, who placed the fee for writing up a debt on the borrower. It set conditions: the fees must be purely administrative with no profit, calculated exactly rather than estimated, include only the wages of staff working on these loans alone, exclude premises and furniture also used for other business, and have their method of calculation set out under the supervision of a sharia committee. It concluded that if the lender keeps to these conditions there is no objection, and otherwise the fees are forbidden riba."
  ur: "ایک خیراتی انجمن کا سوال جو گردشی بلا سود قرضے دیتی ہے اور ہر قرض دار سے سروس چارج کے طور پر 2% کاٹتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض دار سے قرض کی حقیقی براہِ راست لاگت بغیر کسی اضافے کے لی جا سکتی ہے، ورنہ یہ سود ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض دار سے قرض کے اخراجات، جیسے دفتری کام اور ادائیگی کی نگرانی پر مامور عملے کی تنخواہیں، لیے جا سکتے ہیں بشرطیکہ رقم حقیقی براہِ راست لاگت کے برابر ہو اور اس میں ذرا بھی منافع نہ ہو، اور یہ حنفی فقہاء کے قول پر مبنی ہے جنہوں نے قرض لکھنے کی اجرت قرض دار پر رکھی۔ اس نے شرائط رکھیں: فیس خالص انتظامی ہو اور اس میں منافع نہ ہو، تخمینے کے بجائے ٹھیک ٹھیک حساب ہو، صرف انہی قرضوں پر کام کرنے والے عملے کی تنخواہ شامل ہو، دوسرے کاموں میں استعمال ہونے والی جگہ اور فرنیچر کا کرایہ شامل نہ ہو، اور حساب کا طریقہ شرعی کمیٹی کی نگرانی میں واضح کیا جائے۔ اس نے نتیجہ نکالا کہ اگر قرض دینے والا ادارہ ان شرائط کی پابندی کرے تو حرج نہیں، ورنہ یہ فیس حرام سود ہے۔"
  es: "Una organización benéfica que gestiona préstamos rotatorios sin intereses y deduce un 2 % de cada prestatario como cargo por servicio, respondió al Departamento General de Iftaa de Jordania que se puede cobrar al prestatario el costo directo real del préstamo sin ningún incremento, y que cualquier otro monto constituye riba (usura). El Departamento explicó que se pueden cobrar al prestatario los costos del préstamo, como el trabajo administrativo y los salarios del personal encargado del seguimiento de los pagos, siempre que el monto sea igual al costo directo real sin ningún beneficio, siguiendo la tradición de los juristas hanafíes, quienes atribuyen al prestatario la comisión por la gestión de la deuda. Estableció las siguientes condiciones: las comisiones deben ser puramente administrativas, sin beneficio alguno, calculadas con exactitud y no estimadas, incluir únicamente los salarios del personal que trabaja exclusivamente en estos préstamos, excluir los locales y el mobiliario utilizados para otros negocios, y su método de cálculo debe estar supervisado por un comité de la sharia. Concluyó que si el prestamista cumple con estas condiciones, no hay objeción, y de lo contrario, las comisiones constituyen riba (usura)."
  fr: "Une organisation caritative proposant des prêts renouvelables sans intérêt, assortis d'une commission de 2 % prélevée sur chaque emprunteur, a posé une question au Département général de la charia de Jordanie. Ce dernier a répondu que l'emprunteur ne peut se voir facturer que le coût direct réel du prêt, sans aucune majoration, et que tout autre frais constitue du riba (usure). Le Département a précisé que l'emprunteur peut se voir facturer les coûts liés au prêt, tels que les frais administratifs et les salaires du personnel chargé du suivi des remboursements, à condition que le montant corresponde au coût direct réel, sans aucun profit. Cette position s'inscrit dans la lignée des juristes hanafites, qui imputent les frais de constitution de la dette à l'emprunteur. Le Département a toutefois posé des conditions: les frais doivent être purement administratifs, sans profit, calculés avec précision et non estimés, couvrir uniquement les salaires du personnel affecté exclusivement à ces prêts, exclure les locaux et le mobilier utilisés pour d'autres activités, et leur méthode de calcul doit être définie sous la supervision d'un comité de la charia. En conclusion, si le prêteur respecte ces conditions, aucune objection n'est soulevée; dans le cas contraire, les frais sont considérés comme du riba (usure)."
  tr: "Faizsiz döner krediler sağlayan ve borçludan %2 hizmet ücreti kesen bir hayır kurumundan gelen bir soru, Ürdün Genel Fetva Dairesi, borçludan kredinin gerçek doğrudan maliyetinin herhangi bir artış olmadan tahsil edilebileceğini; aksi takdirde bunun tefecilik olacağını belirtti. Departman, borçludan, borçlunun ofis işleri masrafları ve ödemeyi izlemekle görevlendirilen çalışanların maaşlarının tahsil edilebileceğini, ancak tutarın gerçek doğrudan maliyete eşit olması ve kâr artışı olmadan tahsil edilebileceğini, Hanefi görüşüne göre borçludan borç yazma ücretinin tahsil edilmesi gerektiğini belirtti. Ücretlerin tamamen idari olmayan, kâr içermeyen doğru hesaplanmasını, bu kredilere katılan işçilerin ücretlerinin yalnızca hesaplanmasını, diğer işlemlerde kullanılan mülk ve mobilya ücretlerinin dahil edilmemesini ve hesaplama mekanizmasının Şeriat komitesi gözetiminde netleştirilmesini şart koştu. Komisyon, kredi veren bu koşullara uyarsa zarar görmediği; aksi takdirde ücretlerin yasaklı tefecilik olarak kabul edildiği sonucuna varıldı."
  id: "Sebuah pertanyaan dari asosiasi amal yang menyediakan pinjaman bergulir tanpa bunga dan memotong biaya layanan sebesar 2% dari peminjam, di mana Departemen Fatwa Umum Yordania menjawab bahwa peminjam dapat dikenakan biaya langsung aktual dari pinjaman tanpa kenaikan apapun; jika tidak, itu akan menjadi riba. Departemen menjawab bahwa peminjam dapat dikenakan biaya peminjam untuk urusan kantor dan gaji karyawan yang ditugaskan memantau pemenuhannya, asalkan jumlahnya sama dengan biaya langsung aktual tanpa peningkatan keuntungan, berdasarkan pandangan Hanafi bahwa peminjam harus dikenakan biaya untuk menulis utang. Departemen tersebut menetapkan bahwa biaya tersebut murni administratif tanpa keuntungan, dihitung dengan akurat dan tidak hampir, hanya upah pekerja yang terlibat dalam pinjaman tersebut yang dihitung, biaya untuk tempat dan furnitur yang digunakan dalam transaksi lain tidak termasuk, dan mekanisme perhitungan harus dijelaskan di bawah pengawasan komite Syariah. Kesimpulan tersebut bahwa jika pemberi pinjaman mematuhi ketentuan ini, tidak ada kerugian yang terjadi; jika tidak, biaya tersebut dianggap sebagai riba yang dilarang."
