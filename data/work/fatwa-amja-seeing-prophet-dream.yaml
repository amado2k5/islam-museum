id: work/fatwa-amja-seeing-prophet-dream
class: work
kind: fatwa
label: { ar: "رؤية النبي في المنام", en: "Seeing the Prophet in a dream", ur: "خواب میں نبی کی زیارت", es: "Ver al Profeta en un sueño", fr: "Voir le Prophète en rêve" }
summary:
  ar: "سأل سائل عن حديث من رآني في المنام فقد رآني حقًا هل ترتبط رؤيته في المنام بقدر معين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78162 بتاريخ 11 مارس 2009)⁩ أن من رأى النبي على الهيئة التي وصفتها كتب الشمائل فقد رأى الحق فإن الشيطان لا يتمثل به، وهذه الرؤيا دليل على عافية في الدين وبشارة بحسن الخاتمة إن شاء الله ونرجو أن تكون مقدمة لرؤيا كاملة، فيجتهد في العبادة ويكثر من الصلاة والسلام عليه ويأمل خيرًا."
  en: "A questioner asked whether the hadith 'whoever sees me in a dream has truly seen me' ties such visions to a certain rank. Dr. Salah al-Sawi (fatwa no. 78162, 11 March 2009) answered that whoever sees the Prophet in the form the Shamail books describe has seen truly, for the devil cannot take his shape; the vision indicates well-being in religion and tidings of a good ending, God willing — hopefully a prelude to a complete vision — so he should strive in worship, multiply blessings upon him and hope well."
  ur: "ایک سائل نے خواب میں نبی کی زیارت کے درجے پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78162، 11 مارچ 2009)⁩ کے مطابق شمائل کی صورت پر دیکھنا حق ہے کیونکہ شیطان اس کی صورت نہیں بن سکتا؛ یہ دین میں عافیت اور اچھے انجام کی بشارت ہے۔"
  es: "Un interlocutor preguntó si el hadiz «quien me ve en un sueño, realmente me ha visto» vincula tales visiones a un rango determinado. El Dr. Salah al-Sawi (fatwa n.º 78162, 11 de marzo de 2009) respondió que quien ve al Profeta en la forma que describen los libros de Shamail, realmente lo ha visto, pues el diablo no puede adoptar su forma; la visión indica bienestar en la religión y buenas noticias de un buen final, si Dios quiere —ojalá un preludio de una visión completa—, por lo que debe esforzarse en la adoración, recibir muchas bendiciones y tener buena fe."
  fr: "Un internaute a demandé si le hadith « Quiconque me voit en rêve m'a véritablement vu » associe de telles visions à un certain rang. Le Dr Salah al-Sawi (fatwa n° 78162, 11 mars 2009) a répondu que quiconque voit le Prophète sous la forme décrite dans les recueils de hadiths l'a véritablement vu, car le diable ne peut prendre son apparence; la vision indique le bien-être spirituel et annonce une fin heureuse, si Dieu le veut – peut-être un prélude à une vision complète – aussi doit-il redoubler d'efforts dans l'adoration, multiplier les bénédictions sur lui et garder espoir."
