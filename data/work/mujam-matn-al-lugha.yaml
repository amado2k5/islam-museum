summary:
  ar: "معجم متن اللغة لأحمد رضا، وهو معجم عربي في خمسة أجزاء، نشرته دار مكتبة الحياة؛ ويُسجَّل أن الجزأين الأول والثاني صدرا سنة ١٩٥٨م والثالث سنة ١٩٥٩م. وهو من معاجم القرن العشرين، وحقوق طبعته محفوظة ولذلك يوصف هنا ويُشار إليه فقط."
  en: "Mu'jam matn al-lugha by Ahmad Rida, an Arabic dictionary in five volumes published by Dar Maktabat al-Hayah; volumes 1 and 2 are recorded as 1958 and volume 3 as 1959. It is a twentieth-century dictionary whose edition's rights are not shown as free, so it is described and linked here only."
  es: "El Mu'jam matn al-lugha de Ahmad Rida, un diccionario árabe en cinco volúmenes publicado por Dar Maktabat al-Hayah; los volúmenes 1 y 2 constan como de 1958 y el 3 como de 1959. Es un diccionario del siglo XX cuya edición no figura como libre de derechos, por lo que aquí solo se describe y se enlaza."
  fr: "Le Mu'jam matn al-lugha d'Ahmad Rida, dictionnaire arabe en cinq volumes publié par Dar Maktabat al-Hayah ; les volumes 1 et 2 sont enregistrés en 1958 et le volume 3 en 1959. C'est un dictionnaire du XXe siècle dont l'édition n'est pas indiquée comme libre de droits ; il n'est ici que décrit et signalé."
  ur: "احمد رضا کی معجم متن اللغہ، پانچ جلدوں میں ایک عربی لغت جسے دار مکتبۃ الحیاۃ نے شائع کیا؛ جلد 1 اور 2 کا سال 1958ء اور جلد 3 کا 1959ء درج ہے۔ یہ بیسویں صدی کی لغت ہے جس کی اشاعت آزاد حقوق والی درج نہیں، اس لیے یہاں صرف اس کا بیان اور حوالہ ہے۔"
  tr: "Ahmad Reda'nın Dil Sözlüğü, Dar Maktabat Al-Hayat tarafından yayımlanan beş ciltlik Arapça sözlük; birinci ve ikinci ciltlerin 1958'de, üçüncüsünün ise 1959'da yayımlandığı kaydedilmiştir. Yirminci yüzyılın sözlüklerinden biridir ve baskı hakları saklıdır, bu nedenle burada tanımlanmış ve sadece referans verilmiştir."
  id: "Kamus Bahasa oleh Ahmad Reda, kamus Arab dalam lima jilid, diterbitkan oleh Dar Maktabat Al-Hayat; tercatat bahwa jilid pertama dan kedua diterbitkan pada tahun 1958 dan jilid ketiga pada tahun 1959. Ini adalah salah satu kamus abad kedua puluh, dan hak cetaknya dilindungi, sehingga dijelaskan di sini dan hanya disebutkan."
