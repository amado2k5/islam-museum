id: work/fatwa-aliftaa-jo-a-contracting-company-supplying-workers-abroad
class: work
kind: fatwa
label: { ar: "شركة مقاولات توريد العمال للخارج", en: "A contracting company supplying workers abroad", ur: "بیرونِ ملک مزدور فراہم کرنے والی ٹھیکیدار کمپنی" }
summary:
  ar: "سؤال عن شركة مقاولات توريد العمال للخارج، أجابت فيه دائرة الإفتاء العام الأردنية بأن عمل الشركة يكيف إجارة في الذمة لا حرج فيها، وأنه لا يجوز إعطاء مدير الشركة الأجنبية نسبة من الأرباح خارج أجرته إلا بإذن شركته. أجابت الدائرة بأن التكييف الفقهي الأقرب لعمل الشركة عقد إجارة في الذمة، إذ تستأجر من العمال خدماتهم مدة محددة بأجر متفق عليه، ثم تعيد تأجير خدماتهم بأجر أعلى، وتتحمل مصاريفهم من تأشيرة وسكن وطعام وشراب ونقل. ونقلت عن الكاساني في بدائع الصنائع (4/208) أن للأجير أن يعمل بنفسه وبأجرائه ما لم يشترط عليه العمل بيده، لأن العقد وقع على العمل، وعمل أجرائه يقع له. وقالت إن اشتراط أحد مديري الشركة الأجنبية نسبة على إحضار العمال غير جائز لأنه موظف لدى تلك الشركة، ولا يجوز للموظف أخذ نسبة أو عمولة مستقلة عن أجره المتفق عليه إلا بإذنها، وخلصت إلى أنه لا حرج في صورة عمل الشركة."
  en: "A question about a contracting company supplying workers abroad, in which Jordan's General Iftaa Department answered that the company's work is a hire of services owed as an obligation (ijara fi al-dhimma) and unobjectionable, but the foreign company's manager may not be given a share of the profits beyond his salary without his employer's permission. The Department answered that the closest legal characterisation of the company's work is a contract of hire owed as an obligation: it hires the workers' services for a set period at an agreed wage and then re-hires those services at a higher rate, bearing their visa fees, housing, food, drink and transport. It quoted al-Kasani in Bada'i al-Sana'i (4/208) that a hired worker may do the work himself or through his own hirelings unless the contract requires him to work personally, because the contract is for the work and his hirelings' work counts as his. It said the condition set by one of the foreign company's managers, taking a percentage for bringing in the workers, is not permitted, because he is that company's employee and an employee may not take a separate percentage or commission beyond his agreed pay without its permission; it concluded that the company's arrangement itself is unobjectionable."
  ur: "بیرونِ ملک مزدور فراہم کرنے والی ٹھیکیدار کمپنی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کمپنی کا کام ذمے میں اجارہ ہے جس میں حرج نہیں، لیکن غیر ملکی کمپنی کے مینیجر کو اس کی تنخواہ کے علاوہ منافع کا حصہ اس کی کمپنی کی اجازت کے بغیر دینا جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ کمپنی کے کام کی قریب ترین فقہی تکییف ذمے میں اجارہ ہے: وہ مزدوروں سے متعین مدت کے لیے طے شدہ اجرت پر ان کی خدمات لیتی ہے اور پھر انہی خدمات کو زیادہ اجرت پر آگے اجارے پر دیتی ہے، اور ان کے ویزا، رہائش، کھانے پینے اور نقل و حمل کے اخراجات برداشت کرتی ہے۔ اس نے بدائع الصنائع (4/208) میں کاسانی سے نقل کیا کہ اجیر خود یا اپنے اجیروں کے ذریعے کام کر سکتا ہے جب تک عقد میں اس پر اپنے ہاتھ سے کام کی شرط نہ ہو، کیونکہ عقد کام پر ہوا ہے اور اس کے اجیروں کا کام اسی کا شمار ہوتا ہے۔ اس نے کہا کہ غیر ملکی کمپنی کے ایک مینیجر کی طرف سے مزدور لانے پر کمیشن کی شرط جائز نہیں، کیونکہ وہ اس کمپنی کا ملازم ہے اور ملازم اپنی کمپنی کی اجازت کے بغیر طے شدہ اجرت کے علاوہ الگ کمیشن نہیں لے سکتا؛ اور نتیجہ نکالا کہ کمپنی کے کام کی صورت میں کوئی حرج نہیں۔"
