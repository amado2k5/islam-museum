label: { ar: "شركة مقاولات توريد العمال للخارج", en: "A contracting company supplying workers abroad", ur: "بیرونِ ملک مزدور فراہم کرنے والی ٹھیکیدار کمپنی", es: "Una empresa contratista que suministra trabajadores en el extranjero.", fr: "Une entreprise de sous-traitance fournissant des travailleurs à l'étranger", tr: "Yurt Dışında İşçi Tedarik Eden Sözleşmeli Şirket", id: "Perusahaan Kontrak untuk Menyediakan Pekerja di Luar Negeri" }
summary:
  ar: "سؤال عن شركة مقاولات توريد العمال للخارج، أجابت فيه دائرة الإفتاء العام الأردنية بأن عمل الشركة يكيف إجارة في الذمة لا حرج فيها، وأنه لا يجوز إعطاء مدير الشركة الأجنبية نسبة من الأرباح خارج أجرته إلا بإذن شركته. أجابت الدائرة بأن التكييف الفقهي الأقرب لعمل الشركة عقد إجارة في الذمة، إذ تستأجر من العمال خدماتهم مدة محددة بأجر متفق عليه، ثم تعيد تأجير خدماتهم بأجر أعلى، وتتحمل مصاريفهم من تأشيرة وسكن وطعام وشراب ونقل. ونقلت عن الكاساني في بدائع الصنائع (4/208) أن للأجير أن يعمل بنفسه وبأجرائه ما لم يشترط عليه العمل بيده، لأن العقد وقع على العمل، وعمل أجرائه يقع له. وقالت إن اشتراط أحد مديري الشركة الأجنبية نسبة على إحضار العمال غير جائز لأنه موظف لدى تلك الشركة، ولا يجوز للموظف أخذ نسبة أو عمولة مستقلة عن أجره المتفق عليه إلا بإذنها، وخلصت إلى أنه لا حرج في صورة عمل الشركة."
  en: "A question about a contracting company supplying workers abroad, in which Jordan's General Iftaa Department answered that the company's work is a hire of services owed as an obligation (ijara fi al-dhimma) and unobjectionable, but the foreign company's manager may not be given a share of the profits beyond his salary without his employer's permission. The Department answered that the closest legal characterisation of the company's work is a contract of hire owed as an obligation: it hires the workers' services for a set period at an agreed wage and then re-hires those services at a higher rate, bearing their visa fees, housing, food, drink and transport. It quoted al-Kasani in Bada'i al-Sana'i (4/208) that a hired worker may do the work himself or through his own hirelings unless the contract requires him to work personally, because the contract is for the work and his hirelings' work counts as his. It said the condition set by one of the foreign company's managers, taking a percentage for bringing in the workers, is not permitted, because he is that company's employee and an employee may not take a separate percentage or commission beyond his agreed pay without its permission; it concluded that the company's arrangement itself is unobjectionable."
  ur: "بیرونِ ملک مزدور فراہم کرنے والی ٹھیکیدار کمپنی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کمپنی کا کام ذمے میں اجارہ ہے جس میں حرج نہیں، لیکن غیر ملکی کمپنی کے مینیجر کو اس کی تنخواہ کے علاوہ منافع کا حصہ اس کی کمپنی کی اجازت کے بغیر دینا جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ کمپنی کے کام کی قریب ترین فقہی تکییف ذمے میں اجارہ ہے: وہ مزدوروں سے متعین مدت کے لیے طے شدہ اجرت پر ان کی خدمات لیتی ہے اور پھر انہی خدمات کو زیادہ اجرت پر آگے اجارے پر دیتی ہے، اور ان کے ویزا، رہائش، کھانے پینے اور نقل و حمل کے اخراجات برداشت کرتی ہے۔ اس نے بدائع الصنائع (4/208) میں کاسانی سے نقل کیا کہ اجیر خود یا اپنے اجیروں کے ذریعے کام کر سکتا ہے جب تک عقد میں اس پر اپنے ہاتھ سے کام کی شرط نہ ہو، کیونکہ عقد کام پر ہوا ہے اور اس کے اجیروں کا کام اسی کا شمار ہوتا ہے۔ اس نے کہا کہ غیر ملکی کمپنی کے ایک مینیجر کی طرف سے مزدور لانے پر کمیشن کی شرط جائز نہیں، کیونکہ وہ اس کمپنی کا ملازم ہے اور ملازم اپنی کمپنی کی اجازت کے بغیر طے شدہ اجرت کے علاوہ الگ کمیشن نہیں لے سکتا؛ اور نتیجہ نکالا کہ کمپنی کے کام کی صورت میں کوئی حرج نہیں۔"
  es: "Una pregunta sobre una empresa contratista que provee trabajadores en el extranjero, en la que el Departamento General de Iftaa de Jordania respondió que el trabajo de la empresa es un contrato de servicios adeudado como obligación (ijara fi al-dhimma) y no objetable, pero el gerente de la empresa extranjera no puede recibir una parte de las ganancias más allá de su salario sin el permiso de su empleador. El Departamento respondió que la caracterización legal más cercana al trabajo de la empresa es un contrato de arrendamiento adeudado como obligación: contrata los servicios de los trabajadores por un período determinado a un salario acordado y luego los vuelve a contratar a una tarifa más alta, asumiendo sus gastos de visa, alojamiento, comida, bebida y transporte. Citó a al-Kasani en Bada'i al-Sana'i (4/208) que un trabajador contratado puede realizar el trabajo él mismo o a través de sus propios empleados a menos que el contrato le exija trabajar personalmente, porque el contrato es para el trabajo y el trabajo de sus empleados cuenta como suyo. El tribunal afirmó que la condición impuesta por uno de los gerentes de la empresa extranjera, que consiste en cobrar un porcentaje por la contratación de los trabajadores, no está permitida, ya que él es empleado de dicha empresa y un empleado no puede cobrar un porcentaje o comisión adicional a su salario acordado sin su autorización; concluyó que el acuerdo de la empresa en sí mismo no es objetable."
  fr: "Une question concernant une entreprise de sous-traitance fournissant de la main-d'œuvre à l'étranger a été posée. Le Département général de la jurisprudence jordanienne (Iftaa) a répondu que l'activité de l'entreprise relève d'une obligation de travail (ijara fi al-dhimma) et n'est pas contestable. Toutefois, le gérant de l'entreprise étrangère ne peut percevoir de part des bénéfices au-delà de son salaire sans l'autorisation de son employeur. Le Département a précisé que la qualification juridique la plus proche de l'activité de l'entreprise est celle d'un contrat de travail à durée déterminée: elle embauche les travailleurs pour une période définie à un salaire convenu, puis les réembauche à un tarif plus élevé, prenant en charge leurs frais de visa, logement, nourriture, boissons et transport. Il a cité al-Kasani dans Bada'i al-Sana'i (4/208) selon lequel un travailleur embauché peut effectuer le travail lui-même ou par l'intermédiaire de ses propres sous-traitants, sauf si le contrat l'oblige à travailler personnellement, car le contrat porte sur le travail et le travail de ses sous-traitants est considéré comme le sien. Il a été indiqué que la condition imposée par l'un des responsables de la société étrangère, à savoir la perception d'un pourcentage pour le recrutement des travailleurs, n'est pas autorisée, car il est un employé de cette société et un employé ne peut percevoir un pourcentage ou une commission supplémentaire en plus de sa rémunération convenue sans son autorisation; il a été conclu que l'arrangement de la société en lui-même n'est pas contestable."
  tr: "Yurt dışında işçi tedarik eden bir sözleşmeli şirketle ilgili bir soru, Ürdün Genel Fetva Dairesi, şirketin işinin zarar görmeden kira olarak kabul edildiğini ve yabancı şirket yöneticisine ücretinin dışındaki kârın bir yüzdesini şirketin izni olmadan vermesine izin verilmediğini belirtti. Departman, şirketin işleyişine en yakın içtihati sınıflandırmasının, belirli bir süre için işçileri üzerinde anlaşılmış ücretle işe aldığı, ardından hizmetlerini daha yüksek ücretle yeniden aldığı ve vize, konaklama, yiyecek, içecek ve ulaşım gibi masraflarını karşıladığı bir sorumluluk sözleşmesi olduğunu belirtti. Al-Kasani'nin Bada'i' al-Sana'i' (4/208) adlı eserinde alıntı yaptığı, işçinin kendisi ve çalışanlarını çalışabileceğini, ancak iş için sözleşmenin imzalandığını ve çalışanlarının işinin kendisine ait olduğunu belirtti. Yabancı bir şirket yöneticisinin işçi getirmesini talep etmenin mümkün olmadığını, çünkü o şirketin çalışanı olduğunu ve bir çalışanın, onun izni olmadan kararlaştırılan ücretten bağımsız bir yüzde veya komisyon alamayacağını belirtti. Şirketin faaliyetlerinde herhangi bir zarar olmadığını sonucuna vardı."
  id: "Sebuah pertanyaan tentang perusahaan kontraktor untuk memasok pekerja di luar negeri, di mana Departemen Fatwa Umum Yordania menjawab bahwa pekerjaan perusahaan dianggap sebagai sewa tanpa kerugian apapun, dan bahwa tidak diperbolehkan memberikan persentase keuntungan kepada manajer perusahaan asing di luar upahnya kecuali dengan izin perusahaan. Departemen menjawab bahwa klasifikasi yurisprudensi terdekat terhadap operasi perusahaan adalah kontrak sewa tanggung jawab, di mana mereka mempekerjakan pekerja untuk jangka waktu tertentu dengan upah yang disepakati, kemudian mempekerjakan kembali jasa mereka dengan upah lebih tinggi, dan menanggung biaya seperti visa, akomodasi, makanan, minuman, dan transportasi. Departemen mengutip Al-Kasani dalam Bada'i' al-Sana'i' (4/208) bahwa pekerja dapat bekerja sendiri dan karyawannya kecuali ia diwajibkan bekerja secara manual, karena kontrak ditandatangani untuk pekerjaan tersebut, dan pekerjaan karyawannya adalah miliknya. Pernyataan tersebut menyatakan bahwa mewajibkan persentase manajer perusahaan asing untuk membawa pekerja tidak diperbolehkan karena ia adalah karyawan perusahaan tersebut, dan karyawan tidak boleh menerima persentase atau komisi yang terlepas dari upah yang disepakati kecuali dengan izin dari dirinya. Ia menyimpulkan bahwa tidak ada kerugian dalam operasional perusahaan."
