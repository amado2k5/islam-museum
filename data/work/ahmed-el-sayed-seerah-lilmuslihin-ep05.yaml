id: work/ahmed-el-sayed-seerah-lilmuslihin-ep05
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 5: الدعوة السرية"
  en: "The Prophetic Biography for Reformers, episode 5: The Secret Call"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 5: خفیہ دعوت"
  fr: "La biographie prophétique pour les réformateurs, épisode 5 : L'appel secret"
  es: "La biografía profética para los reformadores, episodio 5: La llamada secreta"
summary:
  ar: "تنتقل الجلسة الخامسة من أول الوحي إلى المرحلة السرية من الدعوة. يتأمل في الآيات الأولى من الوحي بوصفها دعوة إلى العلم بالله، ثم يصف من سبق إلى الإسلام: الصغار والموالي والعبيد والنساء ونفرا قليلا من أصحاب المكانة. ويستخلص أربع فوائد للمصلحين، ويختم بنص لابن إسحاق عن دور أبي بكر في جلب السابقين إلى الإسلام."
  en: "The fifth session turns from the first revelation to the secret stage of the call. He reflects on the opening verses of revelation as a call to knowledge of God, then describes who first embraced Islam: the young, the freed and enslaved, women and a few men of standing. He draws four lessons for reformers and ends with a passage of Ibn Ishaq on Abu Bakr's role in bringing early converts."
  ur: "پانچویں نشست وحی کے آغاز سے دعوت کے خفیہ مرحلے کی طرف بڑھتی ہے۔ وہ وحی کی ابتدائی آیات پر غور کرتے ہیں کہ وہ اللہ کی معرفت کی دعوت ہیں، پھر بیان کرتے ہیں کہ اسلام میں سب سے پہلے کون آیا: کم عمر لوگ، آزاد کردہ اور غلام، عورتیں اور چند صاحب مرتبہ مرد۔ وہ مصلحین کے لیے چار اسباق نکالتے ہیں اور ابن اسحاق کی اس عبارت پر ختم کرتے ہیں جو ابتدائی مسلمانوں کو لانے میں ابوبکر کے کردار کے بارے میں ہے۔"
  fr: "La cinquième séance passe de la première révélation à l'étape secrète de l'appel. Il médite sur les premiers versets de la révélation comme un appel à la connaissance de Dieu, puis décrit qui embrassa l'islam le premier : des jeunes, des affranchis et des esclaves, des femmes et quelques hommes de rang. Il tire quatre leçons pour les réformateurs et termine par un passage d'Ibn Ishaq sur le rôle d'Abu Bakr dans l'arrivée des premiers convertis."
  es: "La quinta sesión pasa de la primera revelación a la etapa secreta de la llamada. Reflexiona sobre los primeros versículos de la revelación como una invitación al conocimiento de Dios y luego describe quiénes abrazaron primero el islam: jóvenes, libertos y esclavos, mujeres y unos pocos hombres de rango. Extrae cuatro lecciones para los reformadores y termina con un pasaje de Ibn Ishaq sobre el papel de Abu Bakr en la llegada de los primeros conversos."
