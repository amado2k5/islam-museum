summary:
  ar: "المطالب العالية بزوائد المسانيد الثمانية لابن حجر العسقلاني ⁦(ت 852هـ)⁩: جمع فيه زوائد ثماني مسانيد على الكتب الستة وغيرها، مرتبة على أبواب الفقه والكتب، مع بيان حال الأسانيد. يضم المجلد الثالث عشر من طبعة دار الغيث ⁦(1420هـ، تحقيق قاسم صالح القاسم)⁩ آخر كتاب العلم وأوائل كتاب الأذكار، من الحديث 3100 إلى 3373."
  en: "al-Matalib al-Aliya bi-Zawa'id al-Masanid al-Thamaniyya by Ibn Hajar al-Asqalani (d. 852 AH): the additional reports of eight musnad collections, arranged by book and chapter, with the editor's notes on the isnads. Volume 13 of the Dar al-Ghayth edition (1420 AH, ed. Qasim Salih al-Qasim) covers the end of the Book of Knowledge and the start of the Book of Remembrance, hadiths 3100 to 3373."
  es: "al-Matalib al-Aliya bi-Zawa'id al-Masanid al-Thamaniyya de Ibn Hajar al-Asqalani (m. 852 AH): los informes adicionales de ocho colecciones de musnad, ordenados por libro y capítulo, con las notas del editor sobre los isnads. El volumen 13 de la edición Dar al-Ghayth (1420 AH, ed. Qasim Salih al-Qasim) abarca el final del Libro del Conocimiento y el comienzo del Libro del Recuerdo, hadices 3100 a"
  fr: "al-Matalib al-Aliya bi-Zawa'id al-Masanid al-Thamaniyya d'Ibn Hajar al-Asqalani (mort en 852 AH): les rapports supplémentaires de huit recueils de musnad, classés par livre et chapitre, avec les notes de l'éditeur sur les isnads. Le volume 13 de l'édition Dar al-Ghayth (1420 AH, éd. Qasim Salih al-Qasim) couvre la fin du Livre de la Connaissance et le début du Livre du Souvenir, hadiths 3100 à"
  ur: "المطلب العالیہ بی زوائد المسانید الثمانیہ از ابن حجر العسقلانی ⁦(متوفی 852ھ)⁩: آٹھ مسند مجموعوں کی اضافی رپورٹیں، کتاب اور باب کے لحاظ سے ترتیب دی گئی ہیں، جن میں اسناد پر مدیر کے نوٹس ہیں۔ دار الغیث ایڈیشن کی جلد 13 ⁦(1420 ہجری، ایڈیشن قاسم صالح القاسم)⁩ کتاب علم کے اختتام اور یاد کی کتاب کے آغاز، احادیث 3100 تا 3373 پر محیط ہے۔"
  tr: "El-Matalib el-'Aliya bi Zawa'id al-Masnāṣāṭ al-Ṣaṣṣāṭ al-Ṣāṣṭ al-Ṣāṭ (ö. 852 Hicri) tarafından İbn Hajar al-Asqalānī tarafından yazılmıştır: Burada, altı kitaba sekiz Musnad eklemelerini ve diğerlerini, fıkh ve kitap bölümlerine göre düzenlenmiş olarak, zincirlerin durumu hakkında açıklama yapmıştır. Dar al-Ghaith baskısının on üçüncü cildi (1420 Hj., Kasım Salih al-Qasim tarafından düzenlenmiştir) hadislerin son kitabı ve Adhkar Kitabı'nın başlangıcını içerir."
  id: "Al-Matalib al-'Aliya bi Zawa'id al-Masnāṣāṭ al-Ṣaṣṣāṭ al-Ṣāṣṭāṭ al-Ṣāṭ al-Ṣāṭ oleh Ibn Hajar al-Asqalānī (wafat 852 H): Di dalamnya, ia mengumpulkan tambahan delapan Musnad ke enam kitab dan lainnya, disusun menurut bab yurisprudensi dan buku, dengan penjelasan tentang status rantai. Jilid ketiga belas edisi Dar al-Ghaith (1420 H, disunting oleh Qasim Salih al-Qasim) memuat kitab pengetahuan terakhir dan awal Kitab Adhkar, dari hadits 3100 hingga 3373."
