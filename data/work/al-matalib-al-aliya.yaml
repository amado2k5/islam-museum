summary:
  ar: "المطالب العالية بزوائد المسانيد الثمانية لابن حجر العسقلاني (ت 852هـ): جمع فيه زوائد ثماني مسانيد على الكتب الستة وغيرها، مرتبة على أبواب الفقه والكتب، مع بيان حال الأسانيد. يضم المجلد الثالث عشر من طبعة دار الغيث (1420هـ، تحقيق قاسم صالح القاسم) آخر كتاب العلم وأوائل كتاب الأذكار، من الحديث 3100 إلى 3373."
  en: "al-Matalib al-Aliya bi-Zawa'id al-Masanid al-Thamaniyya by Ibn Hajar al-Asqalani (d. 852 AH): the additional reports of eight musnad collections, arranged by book and chapter, with the editor's notes on the isnads. Volume 13 of the Dar al-Ghayth edition (1420 AH, ed. Qasim Salih al-Qasim) covers the end of the Book of Knowledge and the start of the Book of Remembrance, hadiths 3100 to 3373."
