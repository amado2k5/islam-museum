summary:
  ar: "تفسير للقرآن الكريم لمحمد علي الصابوني يجمع خلاصة أقوال أئمة التفسير بأسلوب ميسّر، نُشر أول مرة في دار القرآن الكريم ببيروت سنة 1400هـ/1980م في ثلاثة مجلدات، وتُرجمت مختارات منه إلى الإنجليزية."
  en: "A Qur'an commentary by Muhammad Ali al-Sabuni that condenses the views of the classical exegetes in plain language; first published by Dar al-Qur'an al-Karim, Beirut, in 1400/1980 in three volumes. Selections have been translated into English."
  ur: "محمد علی صابونی کی تفسیرِ قرآن، جو کلاسیکی مفسرین کے اقوال کا خلاصہ آسان زبان میں پیش کرتی ہے؛ پہلی بار دار القرآن الکریم، بیروت سے 1400ھ/1980ء میں تین جلدوں میں شائع ہوئی۔ اس کے منتخب حصوں کا انگریزی ترجمہ بھی ہوا ہے۔"
  es: "Comentario del Corán de Muhammad Ali al-Sabuni que condensa las ideas de los exegetas clásicos en un lenguaje sencillo; publicado por primera vez por Dar al-Qur'an al-Karim, Beirut, en 1400/1980 en tres volúmenes. Se han traducido al inglés algunos fragmentos."
  fr: "Commentaire du Coran par Muhammad Ali al-Sabuni, qui condense les idées des exégètes classiques en langage clair; publié pour la première fois par Dar al-Qur'an al-Karim, Beyrouth, en 1400/1980 en trois volumes. Des extraits ont été traduits en anglais."
