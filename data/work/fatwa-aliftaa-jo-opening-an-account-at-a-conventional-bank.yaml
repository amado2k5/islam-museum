id: work/fatwa-aliftaa-jo-opening-an-account-at-a-conventional-bank
class: work
kind: fatwa
label: { ar: "فتح حساب في بنك تجاري للاستخدام الشخصي", en: "Opening an account at a conventional bank for personal use", ur: "ذاتی استعمال کے لیے روایتی بینک میں اکاؤنٹ کھولنا" }
summary:
  ar: "سؤال عن فتح حساب في بنك تجاري للاستخدام الشخصي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم على المسلم إن كان مخيرًا فتح حساب في البنوك الربوية ولو بلا فوائد لأنه إعانة على الربا، ولا مانع منه عند الحاجة الملحة وتعذر البنك الإسلامي. أجابت الدائرة بأنه يحرم على المسلم، إذا كان مخيرًا، أن يفتح حسابًا في البنوك الربوية حتى لو كان بدون فوائد، لما في ذلك من إعانة على الربا، واستشهدت بآية الأمر بالتعاون على البر والتقوى والنهي عن التعاون على الإثم والعدوان في [[passage/quran-5-2|سورة المائدة 5:2]]. وعللت ذلك بأن هذه البنوك تستثمر الأموال في معاملات ربوية محرمة، ففي الإيداع فيها إعانة على الحرام. وقالت إنه إذا وجدت حاجة ملحة لفتح الحساب في بنك ربوي مع عدم إمكان فتحه في بنك إسلامي فلا مانع من ذلك، وأحالت إلى فتواها رقم 471 في حكم الفوائد والجوائز البنكية."
  en: "A question about opening an account at a conventional bank for personal use, in which Jordan's General Iftaa Department answered that if he has a choice, a Muslim may not open an account at an interest-based bank, even without interest, because it aids usury, but that it is permitted in pressing need when an Islamic bank is not possible. The Department answered that if a Muslim has a choice, he may not open an account at interest-based banks even if it pays no interest, because doing so aids usury (riba), citing the verse commanding cooperation in righteousness and forbidding cooperation in sin and aggression in [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It explained that these banks invest money in forbidden interest-based dealings, so depositing with them aids what is forbidden. It said that if there is a pressing need to open an account at an interest-based bank and it cannot be opened at an Islamic bank, there is no objection, and it referred to its fatwa no. 471 on bank interest and prizes."
  ur: "ذاتی استعمال کے لیے روایتی بینک میں اکاؤنٹ کھولنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر اختیار ہو تو مسلمان کے لیے سودی بینک میں اکاؤنٹ کھولنا، چاہے بغیر سود ہو، حرام ہے کیونکہ یہ سود میں مدد ہے، البتہ شدید ضرورت اور اسلامی بینک ممکن نہ ہونے کی صورت میں جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر مسلمان کو اختیار ہو تو اس کے لیے سودی بینکوں میں اکاؤنٹ کھولنا حرام ہے، چاہے وہ بغیر سود ہو، کیونکہ اس میں سود پر مدد ہے، اور نیکی اور تقویٰ میں تعاون کا حکم اور گناہ و زیادتی میں تعاون کی ممانعت والی آیت [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے وجہ یہ بتائی کہ یہ بینک رقوم کو حرام سودی معاملات میں لگاتے ہیں، اس لیے ان میں رقم رکھنا حرام پر مدد ہے۔ اس نے کہا کہ اگر سودی بینک میں اکاؤنٹ کھولنے کی شدید ضرورت ہو اور اسلامی بینک میں کھولنا ممکن نہ ہو تو کوئی حرج نہیں، اور بینکوں کے سود اور انعامات کے حکم کے لیے اپنے فتویٰ نمبر 471 کا حوالہ دیا۔"
