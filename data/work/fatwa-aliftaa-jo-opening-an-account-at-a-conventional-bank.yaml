id: work/fatwa-aliftaa-jo-opening-an-account-at-a-conventional-bank
class: work
kind: fatwa
label: { ar: "فتح حساب في بنك تجاري للاستخدام الشخصي", en: "Opening an account at a conventional bank for personal use", ur: "ذاتی استعمال کے لیے روایتی بینک میں اکاؤنٹ کھولنا", es: "Abrir una cuenta en un banco convencional para uso personal.", fr: "Ouvrir un compte dans une banque traditionnelle pour usage personnel", tr: "Kişisel kullanım için ticari bankada hesap açmak", id: "Membuka rekening di bank komersial untuk penggunaan pribadi" }
summary:
  ar: "سؤال عن فتح حساب في بنك تجاري للاستخدام الشخصي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم على المسلم إن كان مخيرًا فتح حساب في البنوك الربوية ولو بلا فوائد لأنه إعانة على الربا، ولا مانع منه عند الحاجة الملحة وتعذر البنك الإسلامي. أجابت الدائرة بأنه يحرم على المسلم، إذا كان مخيرًا، أن يفتح حسابًا في البنوك الربوية حتى لو كان بدون فوائد، لما في ذلك من إعانة على الربا، واستشهدت بآية الأمر بالتعاون على البر والتقوى والنهي عن التعاون على الإثم والعدوان في [[passage/quran-5-2|سورة المائدة 5:2]]. وعللت ذلك بأن هذه البنوك تستثمر الأموال في معاملات ربوية محرمة، ففي الإيداع فيها إعانة على الحرام. وقالت إنه إذا وجدت حاجة ملحة لفتح الحساب في بنك ربوي مع عدم إمكان فتحه في بنك إسلامي فلا مانع من ذلك، وأحالت إلى فتواها رقم 471 في حكم الفوائد والجوائز البنكية."
  en: "A question about opening an account at a conventional bank for personal use, in which Jordan's General Iftaa Department answered that if he has a choice, a Muslim may not open an account at an interest-based bank, even without interest, because it aids usury, but that it is permitted in pressing need when an Islamic bank is not possible. The Department answered that if a Muslim has a choice, he may not open an account at interest-based banks even if it pays no interest, because doing so aids usury (riba), citing the verse commanding cooperation in righteousness and forbidding cooperation in sin and aggression in [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It explained that these banks invest money in forbidden interest-based dealings, so depositing with them aids what is forbidden. It said that if there is a pressing need to open an account at an interest-based bank and it cannot be opened at an Islamic bank, there is no objection, and it referred to its fatwa no. 471 on bank interest and prizes."
  ur: "ذاتی استعمال کے لیے روایتی بینک میں اکاؤنٹ کھولنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر اختیار ہو تو مسلمان کے لیے سودی بینک میں اکاؤنٹ کھولنا، چاہے بغیر سود ہو، حرام ہے کیونکہ یہ سود میں مدد ہے، البتہ شدید ضرورت اور اسلامی بینک ممکن نہ ہونے کی صورت میں جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر مسلمان کو اختیار ہو تو اس کے لیے سودی بینکوں میں اکاؤنٹ کھولنا حرام ہے، چاہے وہ بغیر سود ہو، کیونکہ اس میں سود پر مدد ہے، اور نیکی اور تقویٰ میں تعاون کا حکم اور گناہ و زیادتی میں تعاون کی ممانعت والی آیت [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے وجہ یہ بتائی کہ یہ بینک رقوم کو حرام سودی معاملات میں لگاتے ہیں، اس لیے ان میں رقم رکھنا حرام پر مدد ہے۔ اس نے کہا کہ اگر سودی بینک میں اکاؤنٹ کھولنے کی شدید ضرورت ہو اور اسلامی بینک میں کھولنا ممکن نہ ہو تو کوئی حرج نہیں، اور بینکوں کے سود اور انعامات کے حکم کے لیے اپنے فتویٰ نمبر 471 کا حوالہ دیا۔"
  es: "Una pregunta sobre la apertura de una cuenta en un banco convencional para uso personal, a la que el Departamento General de Iftaa de Jordania respondió que, si tiene la opción, un musulmán no puede abrir una cuenta en un banco que cobre intereses, incluso si no los paga, porque fomenta la usura, pero que está permitido en caso de necesidad imperiosa cuando no es posible abrir una cuenta en un banco islámico. El Departamento respondió que, si un musulmán tiene la opción, no puede abrir una cuenta en bancos que cobren intereses, incluso si no los paga, porque hacerlo fomenta la usura (riba), citando el versículo que ordena la cooperación en la rectitud y prohíbe la cooperación en el pecado y la agresión en [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. Explicó que estos bancos invierten dinero en transacciones prohibidas basadas en intereses, por lo que depositar dinero en ellos fomenta lo prohibido. Añadió que si existe una necesidad imperiosa de abrir una cuenta en un banco que cobre intereses y no es posible abrirla en un banco islámico, no hay objeción, y se remitió a su fatwa n.º 471 sobre intereses y premios bancarios."
  fr: "Une question relative à l'ouverture d'un compte dans une banque conventionnelle à des fins personnelles a été posée. Le Département général de la Fatwa de Jordanie a répondu que, s'il a le choix, un musulman ne peut ouvrir un compte dans une banque conventionnelle, même sans intérêts, car cela encourage l'usure. Toutefois, en cas d'urgence, lorsqu'il est impossible d'ouvrir un compte dans une banque islamique, cela est permis. Le Département a expliqué que, même si le choix lui est donné, un musulman ne peut ouvrir un compte dans une banque conventionnelle, car cela encourage l'usure (riba). Il a cité le verset 2 de la sourate 5-2 du Coran, qui ordonne la coopération dans la piété et interdit la coopération dans le péché et l'agression. Il a précisé que ces banques investissent l'argent dans des opérations illicites rémunérées à l'intérêt, et que déposer de l'argent chez elles contribue donc à ce qui est interdit. Il a ajouté que, s'il existe un besoin urgent d'ouvrir un compte dans une banque conventionnelle et qu'il est impossible d'en ouvrir un dans une banque islamique, cela ne pose pas de problème, et il a fait référence à sa fatwa n° 471 relative aux intérêts bancaires."
  tr: "Kişisel kullanım için ticari bir bankada hesap açma sorusuna Ürdün Genel Fetva Dairesi, bir Müslüman'ın özgürse faizsiz bile faiz veren bankalarda hesap açmasının yasak olduğunu, bunun tefecilik yardımı olduğunu ve acil ihtiyaç durumunda buna itiraz olmadığını ve İslami bankanın acilen işleyişin engel olduğunu yanıtladı. Daire, bir Müslüman'ın seçme şansı varsa, faizsiz olsa bile tefecilik bankalarında hesap açmasının yasak olduğunu, çünkü bunun tefecilik yardımı olduğunu söyledi. [[pasaj/kuran-kuran-5-2|Sure-El-Ma'idah 5:2]]'nde doğruluk ve takvada işbirliği emrini veren ayeti aktardı. Bu bankaların yasak tefecilik işlemlerine para yatırdığını ve bu işlemlere para yatırmanın yasak olanlara yardım olduğunu açıkladı. Faiz veren bir bankada hesap açma acil ihtiyacı varsa ancak İslami bir bankada açılamıyorsa, buna itiraz olmadığını belirtti ve faiz ve banka ödülleriyle ilgili 471 sayılı fetvasına atıfta bulundu."
  id: "Sebuah pertanyaan tentang pembukaan rekening di bank komersial untuk penggunaan pribadi, Departemen Fatwa Jenderal Yordania menjawab bahwa dilarang bagi seorang Muslim, jika dia bebas, untuk membuka rekening di bank riba meskipun tanpa bunga, karena itu adalah bantuan riba, dan tidak ada keberatan jika diperlukan secara mendesak dan bank Islam tidak mampu. Departemen menjawab bahwa dilarang bagi seorang Muslim, jika dia memiliki pilihan, untuk membuka rekening di bank riba meskipun tanpa bunga, karena itu adalah bantuan riba. Mereka mengutip ayat yang memerintahkan kerja sama dalam kebenaran dan kesalehan serta melarang kerja sama dalam dosa dan agresi dalam [[ayat/al-quran-5-2|Surah Al-Ma'idah 5:2]]. Mereka menjelaskan bahwa bank-bank ini menginvestasikan uang dalam transaksi riba yang dilarang, dan menyetor uang di dalamnya adalah bantuan dalam hal yang terlarang. Dinyatakan bahwa jika ada kebutuhan mendesak untuk membuka rekening di bank riba tetapi tidak mungkin membukanya di bank Islam, maka tidak ada keberatan terhadap hal itu, dan merujuk pada fatwa No. 471 tentang putusan bunga dan imbalan bank."
