id: work/fatwa-amja-shirk-banners-in-mosque
class: work
kind: fatwa
label: { ar: "رفع الشعائر الشركية في المسجد للتأليف", en: "Raising symbols of shirk in the mosque to win hearts", ur: "دعوت کے لیے مسجد میں شرکیہ علامات لگانا", es: "Levantar símbolos de shirk en la mezquita para ganar corazones", fr: "Ériger des symboles de shirk dans la mosquée pour gagner les cœurs" }
summary:
  ar: "سأل عامل في الدعوة في أمريكا يزور الكنائس للتعريف بالإسلام عن دعوة غير المسلمين للمسجد ورفع الإخوة لافتات شركية تأليفًا لقلوبهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81615 بتاريخ 5 يونيو 2010)⁩ أنه فرق بين تألف غير المسلمين بالسماح لهم إذا حان وقت عبادتهم وهم في مساجدنا بأدائها وبين أن نبادر نحن فنرفع هذه اللافتات الشركية فهذا ما لا تقتضيه مصلحة ولا يستوعبه اجتهاد بل هو محض الباطل الذي ينبغي أن يرد على أصحابه وينكر عليهم بما لا يؤدي إلى مفسدة أعظم، وأحال على توصيات دورة الحوار بين الأديان التي أقامها المجمع."
  en: "A dawa worker in America who visits churches to present Islam asked about inviting non-Muslims to the mosque while the brothers raised banners of shirk to soften their hearts. Dr. Salah al-Sawi (fatwa no. 81615, 5 June 2010) answered that letting non-Muslims perform their worship in our mosque when their time comes, to soften hearts, is one thing; taking the initiative to raise those banners of shirk is another — no interest requires it and no ijtihad encompasses it; it is sheer falsehood that must be answered and denounced without causing greater harm, and he referred to the recommendations of the Assembly's course on interfaith dialogue. Recorded as AMJA's answer."
  ur: "امریکہ میں دعوت کار نے پوچھا کہ مسجد میں غیر مسلم مہمانوں کے لیے شرکیہ بینر لگانا کیسا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81615، 5 جون 2010)⁩ کے مطابق عبادت کے وقت ان کی عبادت کی اجازت الگ چیز ہے؛ خود شرکیہ علامات لگانا محض باطل ہے جس کا انکار ہو۔"
  es: "Un trabajador de dawa en Estados Unidos que visita iglesias para presentar el Islam preguntó sobre invitar a no musulmanes a la mezquita mientras los hermanos izaban estandartes de shirk para ablandar sus corazones. El Dr. Salah al-Sawi (fatwa n.° 81615, 5 de junio de 2010) respondió que permitir que los no musulmanes realicen su culto en nuestra mezquita cuando llegue el momento, para ablandar los corazones, es una cosa; tomar la iniciativa de izar esos estandartes de shirk es otra: ningún interés lo requiere y ningún ijtihad lo abarca; es una pura falsedad que debe ser respondida y denunciada sin causar mayor daño, y se refirió a las recomendaciones del curso de la Asamblea sobre diálogo interreligioso. Registrado como respuesta de AMJA."
  fr: "Un prédicateur américain, qui visite les églises pour présenter l'islam, a interrogé Salah al-Sawi (fatwa n° 81615, 5 juin 2010) sur la possibilité d'inviter des non-musulmans à la mosquée, alors que certains frères brandissaient des étendards d'associationnisme (shirk) pour tenter de les amadouer. Salah al-Sawi a répondu que permettre aux non-musulmans de pratiquer leur culte dans notre mosquée, le moment venu, dans un souci d'ouverture d'esprit, est une chose; prendre l'initiative de brandir ces étendards d'associationnisme en est une autre: aucun intérêt ne le justifie et aucun critère d'interprétation (ijtihad) ne l'autorise; il s'agit d'un pur mensonge qu'il faut réfuter sans causer de tort supplémentaire. Il a ensuite renvoyé aux recommandations du cours de l'Assemblée sur le dialogue interreligieux. Cette réponse a été consignée comme la réponse de l'AMJA."
