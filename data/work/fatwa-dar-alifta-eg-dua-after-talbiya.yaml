label: { ar: "حكم الدعاء بعد التلبية", en: "Supplicating after the talbiya", ur: "تلبیہ کے بعد دعا" }
summary:
  ar: "سائل سأل عن الدعاء بعد التلبية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21909)⁩ أنه يستحب للمحرم بالحج أو العمرة أن يدعو عقب تلبيته بما شاء من خيري الدنيا والآخرة على ما فصّل الجواب."
  en: "A questioner asked about supplicating after the talbiya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21909) answered that it is recommended for the pilgrim in ihram for Hajj or umrah to supplicate after his talbiya with whatever he wishes of the good of this world and the next — as the answer details."
  ur: "ایک سائل نے تلبیہ کے بعد دعا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21909)⁩ نے جواب دیا کہ حج یا عمرہ کے محرم کے لیے تلبیہ کے بعد جو چاہے دنیا اور آخرت کی بھلائی مانگنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
