id: work/fatwa-dar-alifta-eg-dua-after-talbiya
class: work
kind: fatwa
label: { ar: "حكم الدعاء بعد التلبية", en: "Supplicating after the talbiya", ur: "تلبیہ کے بعد دعا", es: "Suplicando después de la talbiya", fr: "Supplication après la talbiya" }
summary:
  ar: "سائل سأل عن الدعاء بعد التلبية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21909)⁩ أنه يستحب للمحرم بالحج أو العمرة أن يدعو عقب تلبيته بما شاء من خيري الدنيا والآخرة على ما فصّل الجواب."
  en: "A questioner asked about supplicating after the talbiya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21909) answered that it is recommended for the pilgrim in ihram for Hajj or umrah to supplicate after his talbiya with whatever he wishes of the good of this world and the next — as the answer details."
  ur: "ایک سائل نے تلبیہ کے بعد دعا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21909)⁩ نے جواب دیا کہ حج یا عمرہ کے محرم کے لیے تلبیہ کے بعد جو چاہے دنیا اور آخرت کی بھلائی مانگنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de la súplica después de la talbiya. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21909) respondió que se recomienda que el peregrino en estado de ihram para el Hajj o la Umrah suplique después de su talbiya pidiendo lo que desee para el bien de este mundo y del más allá, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant les invocations après la talbiya. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21909) a répondu qu'il est recommandé au pèlerin en état d'ihram pour le Hajj ou la Omra d'invoquer Allah après sa talbiya, en formulant ses vœux pour le bien de ce monde et de l'au-delà – comme le précise la réponse."
