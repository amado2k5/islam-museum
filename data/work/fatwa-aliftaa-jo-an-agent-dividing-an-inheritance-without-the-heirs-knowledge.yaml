id: work/fatwa-aliftaa-jo-an-agent-dividing-an-inheritance-without-the-heirs-knowledge
class: work
kind: fatwa
label: { ar: "تصرف الوكيل في توزيع الميراث دون علم الورثة", en: "An agent dividing an inheritance without the other heirs' knowledge", ur: "وارثوں کے علم کے بغیر وکیل کا وراثت تقسیم کرنا", es: "Un agente que divide una herencia sin el conocimiento de los demás herederos.", fr: "Un agent qui partage un héritage à l'insu des autres héritiers", tr: "Vekilin mirası varislerin haberi olmadan dağıtma eylemi", id: "Tindakan agen dalam membagikan warisan tanpa sepengetahuan ahli waris" }
summary:
  ar: "سؤال عن وكيل يتصرف في توزيع مال الميراث دون علم باقي الورثة، أجابت فيه دائرة الإفتاء العام الأردنية بأن التركة ملك لجميع الورثة بحسب حصصهم، وأن الوكيل لا يجوز له إخفاء مقدار التركة ولا قسمتها على غير القسمة الشرعية ولا حرمان أحد من نصيبه. أجابت الدائرة بأن كل ما يتركه الميت من نقود وأراض وعقارات وغيرها ملك لجميع الورثة الشرعيين ذكورًا وإناثًا بحسب حصصهم المقررة، ولا يجوز لأحد من الورثة أو غيرهم أخذ شيء من التركة دون إذن صريح من جميعهم، ولا التصرف في نصيب غيره دون إذنه. وقالت إن للورثة أن يوكلوا أحدهم في التوزيع، لكن لا يجوز للوكيل إخفاء أي معلومة عن مقدار التركة، ولا قسمتها على غير القسمة الشرعية، ولا منع أحد من الورثة نصيبه، لأنه ملزم بتنفيذ أحكام الشرع في توزيع الإرث. ونقلت قول العمراني في البيان إن الميراث لا نيابة فيه إلا في قسمته وقبضه. وخلصت إلى أنه لا يجوز لأحد من الورثة أن يمنع أحدًا نصيبه الشرعي، ومن فعل ذلك كان آثمًا."
  en: "A question about an agent dividing an inheritance without the other heirs' knowledge, in which Jordan's General Iftaa Department answered that the estate belongs to all the heirs according to their shares, and that the agent may not hide the estate's size, divide it other than by the legal shares, or deprive anyone of his share. The Department answered that everything the deceased leaves, whether money, land, property or anything else, belongs to all the legal heirs, male and female, according to their fixed shares; no heir or anyone else may take anything from the estate without the explicit permission of all of them, nor deal with another's share without his permission. It said the heirs may appoint one of themselves as agent for the distribution, but the agent may not conceal any information about the estate's size, divide it other than by the legal division, or withhold any heir's share, because he is bound to carry out the rules of the law in distributing the inheritance. It quoted al-Imrani in al-Bayan that there is no agency in inheritance except in dividing and receiving it. It concluded that no heir may withhold anyone's legal share, and whoever does so is sinning."
  ur: "ایک وکیل کے بارے میں سوال جو باقی وارثوں کے علم کے بغیر وراثت کا مال تقسیم کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ترکہ تمام وارثوں کی ان کے حصوں کے مطابق ملکیت ہے، اور وکیل نہ ترکے کی مقدار چھپا سکتا ہے، نہ شرعی تقسیم کے خلاف بانٹ سکتا ہے، نہ کسی کو اس کے حصے سے محروم کر سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ میت جو کچھ چھوڑے، نقدی، زمین، جائیداد یا کچھ اور، وہ تمام شرعی وارثوں، مرد و عورت، کی ان کے مقررہ حصوں کے مطابق ملکیت ہے؛ کوئی وارث یا غیر وارث سب کی صریح اجازت کے بغیر ترکے سے کچھ نہیں لے سکتا، نہ کسی کے حصے میں اس کی اجازت کے بغیر تصرف کر سکتا ہے۔ اس نے کہا کہ وارث تقسیم کے لیے اپنے میں سے کسی کو وکیل بنا سکتے ہیں، لیکن وکیل ترکے کی مقدار کے بارے میں کوئی معلومات نہیں چھپا سکتا، نہ شرعی تقسیم کے خلاف تقسیم کر سکتا ہے، نہ کسی وارث کا حصہ روک سکتا ہے، کیونکہ وہ وراثت کی تقسیم میں شرعی احکام نافذ کرنے کا پابند ہے۔ اس نے البیان میں عمرانی کا قول نقل کیا کہ وراثت میں نیابت نہیں سوائے اس کی تقسیم اور قبضے کے۔ اس نے نتیجہ نکالا کہ کوئی وارث کسی کا شرعی حصہ نہیں روک سکتا، اور جو ایسا کرے وہ گناہ گار ہے۔"
  es: "Una pregunta sobre un agente que divide una herencia sin el conocimiento de los demás herederos, a la que el Departamento General de Iftaa de Jordania respondió que la herencia pertenece a todos los herederos según sus cuotas, y que el agente no puede ocultar el tamaño de la herencia, dividirla de forma distinta a la legal ni privar a nadie de su parte. El Departamento respondió que todo lo que deja el difunto, ya sea dinero, tierras, propiedades o cualquier otra cosa, pertenece a todos los herederos legales, hombres y mujeres, según sus cuotas establecidas; ningún heredero ni ninguna otra persona puede tomar nada de la herencia sin el permiso expreso de todos ellos, ni disponer de la parte de otro sin su autorización. Añadió que los herederos pueden designar a uno de ellos como agente para la distribución, pero el agente no puede ocultar información sobre el tamaño de la herencia, dividirla de forma distinta a la legal ni retener la parte de ningún heredero, ya que está obligado a cumplir las normas legales en la distribución de la herencia. Citó a al-Imrani en al-Bayan, donde afirma que no existe representación en la herencia salvo para dividirla y recibirla. Concluyó que ningún heredero puede retener la parte que le corresponde legalmente a nadie, y quien lo haga está pecando."
  fr: "Concernant la question de la répartition d'un héritage par un mandataire à l'insu des autres héritiers, le Département général de la jurisprudence jordanienne (Iftaa) a répondu que la succession appartient à tous les héritiers selon leurs parts respectives et que le mandataire ne peut dissimuler la valeur de l'héritage, le répartir autrement que selon les parts légales, ni priver quiconque de sa part. Le Département a précisé que tout ce que le défunt laisse, argent, terres, biens immobiliers ou autre, appartient à tous les héritiers légaux, hommes et femmes, selon leurs parts respectives; aucun héritier ni personne d'autre ne peut prélever quoi que ce soit sur la succession sans l'autorisation expresse de tous, ni disposer de la part d'un autre sans son accord. Il a ajouté que les héritiers peuvent désigner l'un d'entre eux comme mandataire pour la distribution, mais que ce dernier ne peut dissimuler aucune information concernant la valeur de l'héritage, le répartir autrement que selon les dispositions légales, ni retenir la part d'un héritier, car il est tenu d'appliquer les règles de la loi lors de la distribution de l'héritage. Le Département a cité al-Imrani dans al-Bayan, selon lequel il n'y a pas de mandat en matière d'héritage, sauf pour le partage et la réception de celui-ci. Elle a conclu qu'aucun héritier ne peut priver quiconque de sa part légale, et que quiconque le fait commet un péché."
  tr: "Miras parasının dağıtımını diğer varislerin haberi olmadan yöneten bir temsilci hakkında bir soru; Ürdün Genel Fetva Dairesi, mülkün paylarına göre tüm varislere ait olduğunu ve temsilcinin miras miktarını gizleyemeyeceğini, yasal bölünme dışında dağıtmasına ve kimseyi payından mahrum bırakmasına izin verilmediğini belirtti. Daire, ölen kişinin bıraktığı tüm para, arazi, gayrimenkul ve diğer varlıkların, belirlenen paylarına göre erkek ve kadın tüm meşru varislere ait olduğunu yanıtladı. Hiçbir varis veya başkası, hepsinin açık izni olmadan mülkten hiçbir şey alamaz, ya da başkasının payını izinsiz elden çıkaramaz. Mirasçıların birini mirası dağıtmak için atayabileceğini, ancak temsilcinin miras miktarı hakkında hiçbir bilgiyi gizlemeye, onu Şeriat sınırına göre bölmesine ve mirasçıların payını almasını engellemesine izin verilmediğini, çünkü miras dağıtımında Şeriat kurallarını uygulamak zorunda olduğunu belirtti. Al-Bayan'da Al-Umrani'nin mirasın temsil edilmediği, sadece bölünme ve alımı şeklinde olduğu belirtilmiştir. Hiçbir varisin kimseyi hak ettiği paydan mahrum bırakmasına izin verilmediği ve bunu yapanın günahkar olduğu sonucuna varılmıştır."
  id: "Pertanyaan tentang agen yang mengelola pembagian uang warisan tanpa sepengetahuan ahli waris lain, di mana Departemen Fatwa Umum Yordania menjawab bahwa harta warisan tersebut milik semua ahli waris sesuai dengan saham mereka, dan agen tidak diperbolehkan menyembunyikan jumlah harta atau mendistribusikannya di luar pembagian hukum, maupun mencabut bagian siapa pun. Departemen menjawab bahwa semua uang, tanah, properti, dan aset lain yang ditinggalkan oleh almarhum adalah milik semua ahli waris sah, laki-laki dan perempuan, sesuai dengan bagian yang ditentukan. Tidak ada ahli waris atau orang lain yang boleh mengambil apa pun dari harta tanpa izin eksplisit dari mereka semua, maupun menjual bagian orang lain tanpa izin mereka. Departemen menyatakan bahwa ahli waris dapat menunjuk salah satu dari mereka untuk membagi harta warisan, tetapi agen tidak diperbolehkan menyembunyikan informasi tentang jumlah harta, tidak membaginya di luar pembagian Syariah, maupun mencegah ahli waris menerima bagiannya, karena mereka wajib menerapkan aturan Syariah dalam pembagian warisan. Surat itu mengutip pernyataan Al-Umrani dalam Al-Bayan bahwa warisan tidak memiliki representasi kecuali dalam pembagian dan penerimaan. Surat itu menyimpulkan bahwa tidak ada ahli waris yang boleh mencabut bagian yang sah dari siapa pun, dan siapa pun yang melakukannya adalah dosa."
