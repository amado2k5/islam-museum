id: work/fatwa-aliftaa-jo-an-agent-dividing-an-inheritance-without-the-heirs-knowledge
class: work
kind: fatwa
label: { ar: "تصرف الوكيل في توزيع الميراث دون علم الورثة", en: "An agent dividing an inheritance without the other heirs' knowledge", ur: "وارثوں کے علم کے بغیر وکیل کا وراثت تقسیم کرنا" }
summary:
  ar: "سؤال عن وكيل يتصرف في توزيع مال الميراث دون علم باقي الورثة، أجابت فيه دائرة الإفتاء العام الأردنية بأن التركة ملك لجميع الورثة بحسب حصصهم، وأن الوكيل لا يجوز له إخفاء مقدار التركة ولا قسمتها على غير القسمة الشرعية ولا حرمان أحد من نصيبه. أجابت الدائرة بأن كل ما يتركه الميت من نقود وأراض وعقارات وغيرها ملك لجميع الورثة الشرعيين ذكورًا وإناثًا بحسب حصصهم المقررة، ولا يجوز لأحد من الورثة أو غيرهم أخذ شيء من التركة دون إذن صريح من جميعهم، ولا التصرف في نصيب غيره دون إذنه. وقالت إن للورثة أن يوكلوا أحدهم في التوزيع، لكن لا يجوز للوكيل إخفاء أي معلومة عن مقدار التركة، ولا قسمتها على غير القسمة الشرعية، ولا منع أحد من الورثة نصيبه، لأنه ملزم بتنفيذ أحكام الشرع في توزيع الإرث. ونقلت قول العمراني في البيان إن الميراث لا نيابة فيه إلا في قسمته وقبضه. وخلصت إلى أنه لا يجوز لأحد من الورثة أن يمنع أحدًا نصيبه الشرعي، ومن فعل ذلك كان آثمًا."
  en: "A question about an agent dividing an inheritance without the other heirs' knowledge, in which Jordan's General Iftaa Department answered that the estate belongs to all the heirs according to their shares, and that the agent may not hide the estate's size, divide it other than by the legal shares, or deprive anyone of his share. The Department answered that everything the deceased leaves, whether money, land, property or anything else, belongs to all the legal heirs, male and female, according to their fixed shares; no heir or anyone else may take anything from the estate without the explicit permission of all of them, nor deal with another's share without his permission. It said the heirs may appoint one of themselves as agent for the distribution, but the agent may not conceal any information about the estate's size, divide it other than by the legal division, or withhold any heir's share, because he is bound to carry out the rules of the law in distributing the inheritance. It quoted al-Imrani in al-Bayan that there is no agency in inheritance except in dividing and receiving it. It concluded that no heir may withhold anyone's legal share, and whoever does so is sinning."
  ur: "ایک وکیل کے بارے میں سوال جو باقی وارثوں کے علم کے بغیر وراثت کا مال تقسیم کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ترکہ تمام وارثوں کی ان کے حصوں کے مطابق ملکیت ہے، اور وکیل نہ ترکے کی مقدار چھپا سکتا ہے، نہ شرعی تقسیم کے خلاف بانٹ سکتا ہے، نہ کسی کو اس کے حصے سے محروم کر سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ میت جو کچھ چھوڑے، نقدی، زمین، جائیداد یا کچھ اور، وہ تمام شرعی وارثوں، مرد و عورت، کی ان کے مقررہ حصوں کے مطابق ملکیت ہے؛ کوئی وارث یا غیر وارث سب کی صریح اجازت کے بغیر ترکے سے کچھ نہیں لے سکتا، نہ کسی کے حصے میں اس کی اجازت کے بغیر تصرف کر سکتا ہے۔ اس نے کہا کہ وارث تقسیم کے لیے اپنے میں سے کسی کو وکیل بنا سکتے ہیں، لیکن وکیل ترکے کی مقدار کے بارے میں کوئی معلومات نہیں چھپا سکتا، نہ شرعی تقسیم کے خلاف تقسیم کر سکتا ہے، نہ کسی وارث کا حصہ روک سکتا ہے، کیونکہ وہ وراثت کی تقسیم میں شرعی احکام نافذ کرنے کا پابند ہے۔ اس نے البیان میں عمرانی کا قول نقل کیا کہ وراثت میں نیابت نہیں سوائے اس کی تقسیم اور قبضے کے۔ اس نے نتیجہ نکالا کہ کوئی وارث کسی کا شرعی حصہ نہیں روک سکتا، اور جو ایسا کرے وہ گناہ گار ہے۔"
