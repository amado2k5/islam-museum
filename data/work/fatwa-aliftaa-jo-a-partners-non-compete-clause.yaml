id: work/fatwa-aliftaa-jo-a-partners-non-compete-clause
class: work
kind: fatwa
label: { ar: "اشتراط الشريك على شريكه عدم المنافسة", en: "A partner stipulating that the other partner not compete", ur: "شریک کا دوسرے شریک پر مقابلہ نہ کرنے کی شرط لگانا" }
summary:
  ar: "سؤال عن اشتراط الشريك على شريكه ألا يؤسس عملًا منافسًا خلال الشراكة أو بعدها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الشرط صحيح لازم خلال مدة الشراكة، وباطل لا أثر له بعد انتهائها، مع تحريم إضرار الشريك السابق بالشركة أو أخذ عملائها. أجابت الدائرة بأن من القواعد المقررة أن العقد شريعة المتعاقدين، وأن اشتراط الشريك على شريكه شرطًا معتبرًا له فيه غرض مقصود، كعدم تأسيس عمل مشابه خلال الشراكة، شرط صحيح يلزم الوفاء به، واستشهدت بحديث رواه الترمذي في أن المسلمين على شروطهم إلا شرطًا حرم حلالًا أو أحل حرامًا. وقالت إن هذا الشرط صحيح لأنه يحقق مصلحة لأحد الطرفين ويدفع عنه ضررًا. وأما اشتراط عدم المنافسة بعد فسخ عقد الشركة فعدّته شرطًا باطلًا لا أثر له، لأنه يقيد حق الشريك دون وجه حق، واستشهدت بالحديث المتفق عليه في بطلان كل شرط ليس في كتاب الله. ونبهت إلى أنه لا يجوز للشريك بعد انفضاض الشركة أن يضر بشركته السابقة أو يأخذ عملاءها، استنادًا إلى حديث لا ضرر ولا ضرار الذي رواه أحمد."
  en: "A question about a partner stipulating that the other partner may not set up a competing business during or after the partnership, in which Jordan's General Iftaa Department answered that the condition is valid and binding during the partnership but void and without effect after it ends, while a former partner still may not harm the company or take its clients. The Department answered that among the established rules is that the contract is the law of the contracting parties, and that a partner stipulating a recognised condition serving a real purpose, such as not setting up a similar business during the partnership, is a valid condition that must be kept, citing a hadith reported by al-Tirmidhi that Muslims are bound by their conditions except a condition that forbids the permitted or permits the forbidden. It said this condition is valid because it secures a benefit for one party and protects him from harm. It held a condition barring competition after the partnership contract has been dissolved to be void and without effect, because it restricts the partner's right without just cause, citing the agreed-upon hadith that any condition not in the Book of God is void. It noted that after the partnership ends a partner still may not harm his former company or take its clients, relying on the hadith reported by Ahmad that there is to be no harm and no reciprocal harm."
  ur: "اس بارے میں سوال کہ ایک شریک دوسرے پر شرط لگائے کہ وہ شراکت کے دوران یا بعد میں مقابل کاروبار قائم نہ کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط شراکت کی مدت میں درست اور لازم ہے، اور ختم ہونے کے بعد باطل اور بے اثر ہے، البتہ سابق شریک کمپنی کو نقصان نہیں پہنچا سکتا اور نہ اس کے گاہک لے سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ طے شدہ قواعد میں سے ہے کہ معاہدہ فریقین کا قانون ہے، اور شریک کا ایسی معتبر شرط لگانا جس میں اس کا حقیقی مقصد ہو، جیسے شراکت کے دوران ملتا جلتا کاروبار قائم نہ کرنا، درست شرط ہے جسے پورا کرنا لازم ہے؛ اس نے ترمذی کی روایت کردہ حدیث کا حوالہ دیا کہ مسلمان اپنی شرطوں کے پابند ہیں سوائے اس شرط کے جو حلال کو حرام یا حرام کو حلال کرے۔ اس نے کہا کہ یہ شرط درست ہے کیونکہ اس سے ایک فریق کا مفاد پورا ہوتا ہے اور اس سے نقصان دور ہوتا ہے۔ اس نے معاہدۂ شراکت فسخ ہونے کے بعد مقابلہ نہ کرنے کی شرط کو باطل اور بے اثر قرار دیا، کیونکہ یہ بلا جواز شریک کے حق کو محدود کرتی ہے، اور متفق علیہ حدیث کا حوالہ دیا کہ جو شرط اللہ کی کتاب میں نہیں وہ باطل ہے۔ اس نے تنبیہ کی کہ شراکت ختم ہونے کے بعد بھی شریک اپنی سابق کمپنی کو نقصان نہیں پہنچا سکتا اور نہ اس کے گاہک لے سکتا ہے، اور احمد کی روایت کردہ حدیث لا ضرر ولا ضرار پر انحصار کیا۔"
