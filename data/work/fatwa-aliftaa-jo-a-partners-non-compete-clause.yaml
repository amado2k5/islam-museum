id: work/fatwa-aliftaa-jo-a-partners-non-compete-clause
class: work
kind: fatwa
label: { ar: "اشتراط الشريك على شريكه عدم المنافسة", en: "A partner stipulating that the other partner not compete", ur: "شریک کا دوسرے شریک پر مقابلہ نہ کرنے کی شرط لگانا", es: "Un socio estipula que el otro socio no compita.", fr: "Un partenaire stipulant que l'autre partenaire ne doit pas faire concurrence", tr: "Partnerin partnerinin rekabet etmemesi şartı", id: "Syarat pasangan bahwa pasangan mereka tidak berkompetisi" }
summary:
  ar: "سؤال عن اشتراط الشريك على شريكه ألا يؤسس عملًا منافسًا خلال الشراكة أو بعدها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الشرط صحيح لازم خلال مدة الشراكة، وباطل لا أثر له بعد انتهائها، مع تحريم إضرار الشريك السابق بالشركة أو أخذ عملائها. أجابت الدائرة بأن من القواعد المقررة أن العقد شريعة المتعاقدين، وأن اشتراط الشريك على شريكه شرطًا معتبرًا له فيه غرض مقصود، كعدم تأسيس عمل مشابه خلال الشراكة، شرط صحيح يلزم الوفاء به، واستشهدت بحديث رواه الترمذي في أن المسلمين على شروطهم إلا شرطًا حرم حلالًا أو أحل حرامًا. وقالت إن هذا الشرط صحيح لأنه يحقق مصلحة لأحد الطرفين ويدفع عنه ضررًا. وأما اشتراط عدم المنافسة بعد فسخ عقد الشركة فعدّته شرطًا باطلًا لا أثر له، لأنه يقيد حق الشريك دون وجه حق، واستشهدت بالحديث المتفق عليه في بطلان كل شرط ليس في كتاب الله. ونبهت إلى أنه لا يجوز للشريك بعد انفضاض الشركة أن يضر بشركته السابقة أو يأخذ عملاءها، استنادًا إلى حديث لا ضرر ولا ضرار الذي رواه أحمد."
  en: "A question about a partner stipulating that the other partner may not set up a competing business during or after the partnership, in which Jordan's General Iftaa Department answered that the condition is valid and binding during the partnership but void and without effect after it ends, while a former partner still may not harm the company or take its clients. The Department answered that among the established rules is that the contract is the law of the contracting parties, and that a partner stipulating a recognised condition serving a real purpose, such as not setting up a similar business during the partnership, is a valid condition that must be kept, citing a hadith reported by al-Tirmidhi that Muslims are bound by their conditions except a condition that forbids the permitted or permits the forbidden. It said this condition is valid because it secures a benefit for one party and protects him from harm. It held a condition barring competition after the partnership contract has been dissolved to be void and without effect, because it restricts the partner's right without just cause, citing the agreed-upon hadith that any condition not in the Book of God is void. It noted that after the partnership ends a partner still may not harm his former company or take its clients, relying on the hadith reported by Ahmad that there is to be no harm and no reciprocal harm."
  ur: "اس بارے میں سوال کہ ایک شریک دوسرے پر شرط لگائے کہ وہ شراکت کے دوران یا بعد میں مقابل کاروبار قائم نہ کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط شراکت کی مدت میں درست اور لازم ہے، اور ختم ہونے کے بعد باطل اور بے اثر ہے، البتہ سابق شریک کمپنی کو نقصان نہیں پہنچا سکتا اور نہ اس کے گاہک لے سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ طے شدہ قواعد میں سے ہے کہ معاہدہ فریقین کا قانون ہے، اور شریک کا ایسی معتبر شرط لگانا جس میں اس کا حقیقی مقصد ہو، جیسے شراکت کے دوران ملتا جلتا کاروبار قائم نہ کرنا، درست شرط ہے جسے پورا کرنا لازم ہے؛ اس نے ترمذی کی روایت کردہ حدیث کا حوالہ دیا کہ مسلمان اپنی شرطوں کے پابند ہیں سوائے اس شرط کے جو حلال کو حرام یا حرام کو حلال کرے۔ اس نے کہا کہ یہ شرط درست ہے کیونکہ اس سے ایک فریق کا مفاد پورا ہوتا ہے اور اس سے نقصان دور ہوتا ہے۔ اس نے معاہدۂ شراکت فسخ ہونے کے بعد مقابلہ نہ کرنے کی شرط کو باطل اور بے اثر قرار دیا، کیونکہ یہ بلا جواز شریک کے حق کو محدود کرتی ہے، اور متفق علیہ حدیث کا حوالہ دیا کہ جو شرط اللہ کی کتاب میں نہیں وہ باطل ہے۔ اس نے تنبیہ کی کہ شراکت ختم ہونے کے بعد بھی شریک اپنی سابق کمپنی کو نقصان نہیں پہنچا سکتا اور نہ اس کے گاہک لے سکتا ہے، اور احمد کی روایت کردہ حدیث لا ضرر ولا ضرار پر انحصار کیا۔"
  es: "Una pregunta sobre un socio que estipula que el otro socio no puede establecer un negocio competidor durante o después de la sociedad, a la que el Departamento General de Iftaa de Jordania respondió que la condición es válida y vinculante durante la sociedad, pero nula y sin efecto después de su disolución, mientras que un exsocio aún no puede perjudicar a la empresa ni captar a sus clientes. El Departamento respondió que entre las normas establecidas se encuentra que el contrato es la ley de las partes contratantes, y que una condición reconocida que un socio estipule con un propósito real, como no establecer un negocio similar durante la sociedad, es una condición válida que debe cumplirse, citando un hadiz narrado por al-Tirmidhi que dice que los musulmanes están obligados por sus condiciones, excepto una condición que prohíba lo permitido o permita lo prohibido. Dijo que esta condición es válida porque asegura un beneficio para una de las partes y la protege de un daño. Sostuvo que una condición que prohíbe la competencia después de la disolución del contrato de sociedad es nula y sin efecto, porque restringe el derecho del socio sin justa causa, citando el hadiz consensuado que dice que cualquier condición que no esté en el Libro de Dios es nula. Señaló que, una vez finalizada la sociedad, un socio no puede perjudicar a su antigua empresa ni captar a sus clientes, basándose en el hadiz narrado por Ahmad que establece que no debe haber daño alguno ni daño recíproco."
  fr: "Concernant une question relative à une clause stipulant que l'autre associé ne peut créer une entreprise concurrente pendant ou après la dissolution du partenariat, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a statué que cette clause est valable et contraignante pendant la durée du partenariat, mais nulle et sans effet après sa dissolution. Toutefois, l'ancien associé ne peut ni nuire à la société ni détourner sa clientèle. Le Département a expliqué que, parmi les règles établies, le contrat fait loi pour les parties contractantes et qu'une clause reconnue, servant un objectif légitime, telle que l'interdiction de créer une entreprise similaire pendant le partenariat, constitue une clause valable qui doit être respectée. Il a cité un hadith rapporté par al-Tirmidhi selon lequel les musulmans sont liés par leurs contrats, sauf par une clause interdisant ce qui est permis ou autorisant ce qui est interdit. Le Département a précisé que cette clause est valable car elle garantit un avantage à l'une des parties et la protège de tout préjudice. Il a jugé nulle et sans effet toute clause interdisant la concurrence après la dissolution du contrat de partenariat, car elle restreint les droits de l'associé sans juste motif, se référant au hadith consensuel selon lequel toute clause non mentionnée dans le Livre de Dieu est nulle. Il a été noté qu'après la fin du partenariat, un associé ne peut toujours pas nuire à son ancienne entreprise ni s'approprier ses clients, se fondant sur le hadith rapporté par Ahmad selon lequel il ne doit y avoir ni préjudice ni préjudice réciproque."
  tr: "Ortak, ortakın ortaklık sırasında veya sonrasında rekabet eden bir iş kurmaması şartına ilişkin soruya, Ürdün Genel Fetva Dairesi tarafından yanıtlandı; bu şart ortaklık dönemi boyunca geçerli ve bağlayıcı olup bittikten sonra geçersiz ve geçersiz olduğu, eski ortağın şirkete zarar vermesini veya müşterilerini almasını yasakladığı belirtildi. Bakanlık, belirlenmiş kurallardan birinin sözleşmenin tarafların Şeriatı olduğu ve ortağın ortağına olan koşulun, ortaklık süresince benzer bir iş kurmamak gibi bir amaç için bir koşul olarak kabul edildiğini, bunun yerine getirilmesi gereken geçerli bir koşul olduğunu yanıtladı. El-Tirmidi'nin anlattığı bir hadise atıfta bulunarak, Müslümanların şartlarına bağlı olduklarını belirten bir şart, yalnızca yasak veya izin verilen bir şart hariç. Bu koşulun geçerli olduğu çünkü taraflardan birinin çıkarlarına hizmet ettiği ve onları zarardan koruduğu belirtildi. Şirket sözleşmesi feshedildikten sonra rekabet yasağı koşuluna, partnerin haklarını haksız kısıtladığı için geçersiz bir koşul olarak değerlendirdi ve Allah'ın Kitabı'nda yer almayan herhangi bir şartı geçersiz kılan kararlaştırılmış hadisleri öne sürdü. Şirketin feshedilmesinden sonra, bir ortağın önceki şirketine zarar vermesinin veya müşterilerini almasının yasak olduğunu, Ahmad'ın anlattığı 'Zarar veya karşılıklı zarar yoktur' hadisi temelinde belirtti."
  id: "Pertanyaan tentang syarat mitra agar rekannya tidak mendirikan bisnis pesaing selama atau setelah kemitraan dijawab oleh Departemen Fatwa Umum Yordania bahwa syarat tersebut berlaku dan mengikat selama masa kemitraan dan batal serta tidak berlaku setelah masa kemitraan berakhir, sementara melarang mantan mitra merugikan perusahaan atau mengambil kliennya. Departemen menjawab bahwa salah satu aturan yang ditetapkan adalah kontrak adalah Syariah para pihak kontrak, dan syarat mitra terhadap rekannya dianggap sebagai syarat yang bertujuan, seperti tidak mendirikan bisnis serupa selama kemitraan, yang merupakan syarat yang sah dan harus dipenuhi. Departemen mengutip hadits yang diceritakan oleh Al-Tirmidhi yang menyatakan bahwa Muslim terikat oleh syarat-syarat mereka kecuali satu syarat yang dilarang atau dilarang. Menyatakan bahwa syarat ini berlaku karena melayani kepentingan satu pihak dan melindungi mereka dari bahaya. Adapun syarat non-kompetisi setelah kontrak perusahaan berakhir, ia menganggapnya sebagai syarat batal tanpa efek, karena membatasi hak mitra tanpa hak, mengutip hadits yang disepakati yang membatalkan syarat yang tidak tercantum dalam Kitab Allah. Ia menunjukkan bahwa setelah pembubaran perusahaan, mitra tidak diperbolehkan merugikan perusahaan sebelumnya atau mengambil kliennya, berdasarkan hadits 'Tidak ada kerugian atau kerugian balas' yang diceritakan oleh Ahmad."
