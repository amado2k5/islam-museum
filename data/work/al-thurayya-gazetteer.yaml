label:
  ar: "مشروع الثريا ⁦(معجم أماكن العالم الإسلامي المبكر)⁩"
  en: "al-Ṯurayyā Project (al-Thurayya Gazetteer)"
  ur: "الثریا منصوبہ ⁦(ابتدائی اسلامی دنیا کا مقامات نامہ)⁩"
summary:
  ar: "معجم أماكن رقمي ونموذج جغرافي للعالم الإسلامي المبكر، أعدّته معصومة سيدي ⁦(جامعة الآغا خان، لندن)⁩ وماكسيم رومانوف ⁦(جامعة هامبورغ)⁩، فيه أكثر من ألفي موضع وقرابة ذلك من مقاطع الطرق محددة على الخريطة من أطلس جورجيت كورنو للعالم العربي الإسلامي في العصر الكلاسيكي ⁦(بريل، 1983)⁩؛ بدأ العمل عليه في جامعة تافتس سنة 2013، وبياناته كلها مفتوحة."
  en: "A digital gazetteer and geospatial model of the early Islamic world by Masoumeh Seydi (Aga Khan University, London) and Maxim Romanov (Universität Hamburg), with over 2,000 places and almost as many route sections georeferenced from Georgette Cornu's atlas of the Arab-Islamic world in the classical age (Brill, 1983); work on it began at Tufts University in 2013, and all its data is open."
  ur: "ابتدائی اسلامی دنیا کا ڈیجیٹل مقامات نامہ اور جغرافیائی نمونہ، معصومہ سیدی ⁦(آغا خان یونیورسٹی، لندن)⁩ اور ماکسیم رومانوف ⁦(ہیمبرگ یونیورسٹی)⁩ کا تیار کردہ؛ جورجیٹ کورنو کے کلاسیکی دور کی عرب اسلامی دنیا کے اطلس ⁦(بریل، 1983)⁩ سے نقشے پر متعین دو ہزار سے زیادہ مقامات اور تقریباً اتنے ہی راستوں کے حصے؛ کام 2013 میں ٹفٹس یونیورسٹی میں شروع ہوا، اور اس کا سارا ڈیٹا کھلا ہے۔"
