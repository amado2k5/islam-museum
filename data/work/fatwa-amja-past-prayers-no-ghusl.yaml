id: work/fatwa-amja-past-prayers-no-ghusl
class: work
kind: fatwa
label: { ar: "صلوات بلا اغتسال", en: "Years of prayers without the obligatory washing", ur: "برسوں کی نمازیں بغیر غسل" }
summary:
  ar: "سأل شاب أنه كان يستمني منذ ثلاث سنوات ولم يعلم أنه يجب عليه الاغتسال فصلت عليه الصلوات بلا اغتسال. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83983 بتاريخ 13 مارس 2011)⁩ سائلًا الله أن يغفر له ما كان منه من تقصير في التعلم فإنه يعيش بين أظهر المسلمين ووسائل التعلم متاحة وأهل العلم متوافرون وما كان ينبغي لمثله أن يفرط في تعلم ما لا يسعه جهله من أمور العبادات وقد قال النبي الطهور شطر الإيمان، وأما ما فاته من صلوات بسبب ترك الغسل فالواجب عليه قضاؤها على ما فصّل الجواب من التفصيل."
  en: "A young man had masturbated for three years without knowing washing was obligatory, and prayers had passed over him unwashed. Dr. Salah al-Sawi (fatwa no. 83983, 13 March 2011) asked God's forgiveness for his neglect in learning — living among Muslims with the means of learning open and scholars plentiful, he ought not to have neglected learning what he may not be ignorant of in worship, and the Prophet said 'purity is half of faith'; as for the prayers that passed for want of the washing, he owes their make-up — as the answer details."
  ur: "ایک نوجوان برسوں سے بغیر غسل نمازیں پڑھتا رہا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83983، 13 مارچ 2011)⁩ کے مطابق لازم علم سیکھنا فرض تھا اور گزرے نمازوں کی قضا واجب ہے۔"
