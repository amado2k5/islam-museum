label: { ar: "الإتقان في علوم القرآن", en: "al-Itqan fi Ulum al-Qur'an", ur: "الاتقان فی علوم القرآن", es: "al-Itqan fi Ulum al-Qur'an", fr: "al-Itqan fi Ulum al-Qur'an", tr: "Kur'an Bilimlerinde Ustalık", id: "Penguasaan dalam Ilmu Al-Qur'an" }
summary:
  ar: "مجلد للشيخ جلال الدين عبد الرحمن بن أبي بكر السيوطي المتوفى سنة ٩١١هـ؛ قال حاجي خليفة: هو أشبه آثاره وأفيدها، ذكر فيه تصنيف شيخه الكافيجي واستصغره ومواقع العلوم للبلقيني واستقله، ثم وجد البرهان للزركشي كتاباً جامعاً بعد تصنيفه التحبير فاستأنف وزاد عليه إلى ثمانين نوعاً وجعله مقدمة لتفسيره الكبير الذي شرع فيه وسماه مجمع البحرين، وفي غالب الأنواع تصانيف مفردة {cite:kashf-zunun-furqan p. 177}."
  en: "Al-Suyuti's Itqan — 'the likeliest and most profitable of his works': he built on al-Zarkashi's Burhan, expanding to eighty types of Quranic science, and made it the preface to his intended great tafsir Majma' al-Bahrayn {cite:kashf-zunun-furqan p. 177}."
  ur: "جلال الدین سیوطی ⁦(م 911ھ)⁩ کی «الاتقان» اسّی نوعوں پر مشتمل قرآنی علوم کی جامع کتاب ہے، جس کی بنیاد زرکشی کی «البرہان» پر ہے اور جسے انہوں نے اپنی بڑی تفسیر «مجمع البحرین» کا مقدمہ بنایا {cite:kashf-zunun-furqan p. 177}۔"
  es: "El Itqan de Al-Suyuti — 'la más probable y provechosa de sus obras': se basó en el Burhan de al-Zarkashi, ampliándolo a ochenta tipos de ciencia coránica, y lo convirtió en el prefacio de su gran tafsir Majma' al-Bahrayn {cite:kashf-zunun-furqan p. 177}."
  fr: "L'Itqan d'Al-Suyuti — « l'œuvre la plus probable et la plus profitable »: il s'est appuyé sur le Burhan d'al-Zarkashi, l'étendant à quatre-vingts types de science coranique, et en a fait la préface de son grand tafsir Majma' al-Bahrayn {cite:kashf-zunun-furqan p. 177}."
  tr: "911 H.'de vefat eden Şeyh Celaleddin Abdül-Rahman ibn Ebi Bekir el-Süyüsü'nün bir cildi; Hacı Halife şöyle demiştir: Eserinin en benzer ve faydalı olanıdır, öğretmeni el-Kafici'nin derlemesini ve el-Balkini'nin kendisinden bağımsız olarak yer aldığı bilimlerin yerlerini küçümser. Sonra el-Burhan, el-Tahbir'i derledikten sonra el-Zarkaşi'nin kapsamlı bir kitabını buldu ve onu yeniden yazdı, seksen türe ekledi ve onu yasalaştırdığı ve Majma' al-Bahreyn adını verdiği büyük tafsirinin önsözü haline getirdi. Çoğu türde bireysel eserler bulunur {atıf:kaşf-zunun-furqan, s. 177}."
  id: "Sebuah volume oleh Sheikh Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti, yang meninggal pada tahun 911 H; Haji Khalifa berkata: Ini adalah karya yang paling mirip dan bermanfaat, menyebutkan kompilasi gurunya al-Kafiji, meremehkannya, dan lokasi ilmu pengetahuan oleh al-Balqini dan secara independen darinya. Kemudian al-Burhan menemukan sebuah buku komprehensif oleh al-Zarkashi setelah menyusun al-Tahbir dan melanjutkannya serta menambah delapan puluh tipe, menjadikannya pendahulu tafsir utamanya yang ia legislasi dan sebut Majma' al-Bahrain. Dalam sebagian besar tipe, terdapat karya-karya individual {cite:kashf-zunun-furqan, hlm. 177}."
