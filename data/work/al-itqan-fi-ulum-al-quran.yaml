summary:
  ar: "مجلد للشيخ جلال الدين عبد الرحمن بن أبي بكر السيوطي المتوفى سنة ٩١١هـ؛ قال حاجي خليفة: هو أشبه آثاره وأفيدها، ذكر فيه تصنيف شيخه الكافيجي واستصغره ومواقع العلوم للبلقيني واستقله، ثم وجد البرهان للزركشي كتاباً جامعاً بعد تصنيفه التحبير فاستأنف وزاد عليه إلى ثمانين نوعاً وجعله مقدمة لتفسيره الكبير الذي شرع فيه وسماه مجمع البحرين، وفي غالب الأنواع تصانيف مفردة {cite:kashf-zunun-furqan p. 177}."
  en: "Al-Suyuti's Itqan — 'the likeliest and most profitable of his works': he built on al-Zarkashi's Burhan, expanding to eighty types of Quranic science, and made it the preface to his intended great tafsir Majma' al-Bahrayn {cite:kashf-zunun-furqan p. 177}."
