label: { ar: "حكم صوم المرأة حال عدم التيقن من الطهر قبل الفجر", en: "The fast of a woman not certain of purity before dawn", ur: "فجر سے پہلے طہارت کے یقین نہ ہونے پر عورت کا روزہ" }
summary:
  ar: "سائلة لم تتيقن من الطهر قبل الفجر وشكت في حصوله فسألت عن صومها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21740)⁩ أنه يجب الصوم على المرأة إذا ارتفع عنها الحيض وتيقنت من الطهر قبل الفجر وإن لم تتيقن وشكت فلها حكمها على ما فصّل الجواب."
  en: "A woman not certain of attaining purity before dawn, doubting it, asked about her fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21740) answered that the fast is due on the woman whose menses lifts and who is certain of purity before dawn; the uncertain and doubtful case has its ruling, as the answer details."
  ur: "ایک عورت کو فجر سے پہلے طہارت کا یقین نہ تھا؛ اس نے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21740)⁩ نے جواب دیا کہ جس عورت کا حیض ختم ہو کر فجر سے پہلے طہارت یقینی ہو جائے اس پر روزہ واجب ہے؛ شک کی صورت کا حکم جواب میں بیان ہوا۔"
