label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الإحرام للقادم للحج والعمرة بالطائرة والباخرة", en: "IIFA resolution on ihram for hajj and umrah travellers by plane and ship", ur: "اکیڈمی کی قرارداد: ہوائی جہاز اور جہاز سے آنے والے حاجی کا احرام", es: "Resolución de la IIFA sobre el ihram para los viajeros del Hajj y la Umrah que viajan en avión y barco." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: المواقيت المكانية التي حددتها السنة يجب الإحرام منها لمريد الحج أو العمرة المار عليها أو المحاذي لها أرضًا أو جوًّا أو بحرًا لعموم الأمر بالإحرام منها في الأحاديث."
  en: "IIFA's third-session resolution (Amman, October 1986): the spatial miqats fixed by the sunna must be entered in ihram by anyone intending hajj or umrah who passes or aligns with them on land, in the air or at sea, given the generality of the hadith command to assume ihram at them."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: خشکی، ہوا یا سمندر سے میقات کے ساتھ گزرنے یا ہم پلہ ہونے والے حج اور عمرہ کے مسافر پر وہیں سے احرام واجب ہے۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986): todo aquel que tenga la intención de realizar el Hajj o la Umrah y que pase o se alinee con los miqats espaciales fijados por la Sunna debe entrar en estado de ihram, dada la generalidad del mandato del hadiz de asumir el ihram en ellos."
