label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الإحرام للقادم للحج والعمرة بالطائرة والباخرة", en: "IIFA resolution on ihram for hajj and umrah travellers by plane and ship", ur: "اکیڈمی کی قرارداد: ہوائی جہاز اور جہاز سے آنے والے حاجی کا احرام", es: "Resolución de la IIFA sobre el ihram para los viajeros del Hajj y la Umrah que viajan en avión y barco.", fr: "Résolution de l'IIFA sur l'ihram pour les pèlerins effectuant le hajj et l'umra en avion et en bateau", tr: "Uluslararası İslami Fıkıh Akademisi'nin, Hac ve Umre için uçak ve gemiyle gelenler için İhram durumuna ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai status Ihram bagi mereka yang datang untuk Haji dan Umrah dengan pesawat dan kapal" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: المواقيت المكانية التي حددتها السنة يجب الإحرام منها لمريد الحج أو العمرة المار عليها أو المحاذي لها أرضًا أو جوًّا أو بحرًا لعموم الأمر بالإحرام منها في الأحاديث."
  en: "IIFA's third-session resolution (Amman, October 1986): the spatial miqats fixed by the sunna must be entered in ihram by anyone intending hajj or umrah who passes or aligns with them on land, in the air or at sea, given the generality of the hadith command to assume ihram at them."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: خشکی، ہوا یا سمندر سے میقات کے ساتھ گزرنے یا ہم پلہ ہونے والے حج اور عمرہ کے مسافر پر وہیں سے احرام واجب ہے۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986): todo aquel que tenga la intención de realizar el Hajj o la Umrah y que pase o se alinee con los miqats espaciales fijados por la Sunna debe entrar en estado de ihram, dada la generalidad del mandato del hadiz de asumir el ihram en ellos."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986): les miqats spatiaux fixés par la sunna doivent être franchis en état d'ihram par toute personne ayant l'intention d'effectuer le hajj ou l'umrah qui passe ou s'aligne avec eux sur terre, dans les airs ou en mer, étant donné la généralité du commandement du hadith d'y prendre l'ihram."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986) kararı: Sünnet'te belirtilen mekânsal zamanlar, hacı için hac veya umre için kara, hava veya deniz yoluyla veya bitişiğinden geçerek, hadislerde İhrama girilmesi için genel emrin verilmesi nedeniyle zorunludur."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiganya (Amman, Oktober 1986): Waktu ruang yang ditentukan oleh Sunnah diperlukan bagi jamaah Haji atau Umrah, yang melewati atau berdekatan dengan darat, udara, atau laut, karena perintah umum untuk memasuki Ihram dari mereka dalam hadits."
