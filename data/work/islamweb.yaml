summary:
  ar: "بوابة إسلامية قطرية تتبع وزارة الأوقاف والشؤون الإسلامية، أُطلقت سنة 1998 موقعًا للفتوى ثم اتسعت إلى القرآن والاستشارات والصوتيات والمقالات والمكتبة، بست لغات؛ ذكرت صحيفة البينسولا سنة 2023 نحو 300 ألف فتوى و200 ألف استشارة وأكثر من نصف مليون ملف صوتي وثمانية ملايين صفحة."
  en: "A Qatari Islamic portal of the Ministry of Awqaf and Islamic Affairs, launched in 1998 as a fatwa site and widened to the Qur'an, consultations, audio, articles and a library, in six languages; The Peninsula reported in 2023 nearly 300,000 fatwas, 200,000 consultations, more than half a million audio files and eight million pages."
  ur: "وزارتِ اوقاف و امورِ اسلامیہ قطر کا اسلامی پورٹل، 1998 میں فتویٰ کی سائٹ کے طور پر شروع ہوا، پھر قرآن، مشاورت، صوتیات، مضامین اور لائبریری تک پھیلا، چھ زبانوں میں؛ دی پینسولا نے 2023 میں تقریباً 3 لاکھ فتوے، 2 لاکھ مشاورتیں، پانچ لاکھ سے زیادہ صوتی فائلیں اور اسی لاکھ صفحات بتائے۔"
