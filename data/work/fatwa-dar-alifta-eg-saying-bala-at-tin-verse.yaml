id: work/fatwa-dar-alifta-eg-saying-bala-at-tin-verse
class: work
kind: fatwa
label: { ar: "حكم قول ⁦(بلى)⁩ عند ختام سورة التين", en: "Saying 'bala' (yes indeed) at the end of Surat al-Tin", ur: "سورۃ التین کے آخر میں 'بلی' کہنے کا حکم", es: "Decir 'bala' (sí, en efecto) al final de la Sura al-Tin" }
summary:
  ar: "سائل سأل عن قول ⁦(بلى)⁩ عند ختام سورة التين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21669)⁩ أنه يستحب أن يقول الإنسان بلى عند قراءة ختام السورة سواء كان ذلك في الصلاة أو خارجها على ما فصّل الجواب."
  en: "A questioner asked about saying 'bala' (yes indeed) at the end of Surat al-Tin. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21669) answered that it is commended to say it at the surah's closing verse, whether in prayer or outside it — as the answer details."
  ur: "ایک سائل نے سورۃ التین کے اختتام پر 'بلی' کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21669)⁩ نے جواب دیا کہ آخری آیت پڑھنے پر 'بلی' کہنا نماز میں ہو یا باہر مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la costumbre de decir \"bala\" (sí, en efecto) al final de la Sura Al-Tin. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21669) respondió que es recomendable decirlo al final del versículo de la sura, ya sea en la oración o fuera de ella, como se detalla en la respuesta."
