summary:
  ar: "«المفصل في صنعة الإعراب» كتاب في علم النحو العربي نسبه ملخص بحثي قُدّم إلى المتحف إلى الزمخشري، وذكر تاريخه هكذا: وفاة المؤلف 1143–1144م / 538هـ، وقد ذكر الملخص أنه صُنّف نحو 1120–1122م {cite:wikipedia-al-mufassal-fi-sanat-al-irab-en}. وعدّه الملخص بين ستين كتاباً هي الأكثر استشهاداً بها في علوم العربية الخمسة."
  en: "al-Mufassal fi San'at al-I'rab is a work of Arabic grammar that a research summary supplied to the museum ascribes to al-Zamakhshari, giving its date as: author died 1143–1144 CE / 538 AH; composed c. 1120–1122 CE {cite:wikipedia-al-mufassal-fi-sanat-al-irab-en}. The summary counts it among sixty of the most-cited works in the five Arabic sciences."
  ur: "«المفصل فی صنعۃ الاعراب» عربی نحو کی کتاب ہے جسے عجائب گھر کو دیا گیا ایک تحقیقی خلاصہ الزمخشري سے منسوب کرتا ہے اور اس کی تاریخ یوں دیتا ہے: مصنف کی وفات 1143–1144 ء / 538 ھ، تصنیف تقریباً 1120–1122 ء {cite:wikipedia-al-mufassal-fi-sanat-al-irab-en}۔ خلاصہ اسے عربی کے پانچ علوم کی ساٹھ سب سے زیادہ حوالہ دی جانے والی کتابوں میں شمار کرتا ہے۔"
  fr: "al-Mufassal fi San'at al-I'rab est un ouvrage de grammaire arabe qu'un résumé de recherche remis au musée attribue à al-Zamakhshari, en donnant sa date ainsi : mort de l'auteur 1143–1144 ap. J.-C. / 538 de l'Hégire; composé vers 1120–1122 ap. J.-C. {cite:wikipedia-al-mufassal-fi-sanat-al-irab-en}. Le résumé le compte parmi soixante des ouvrages les plus cités dans les cinq sciences de l'arabe."
  es: "al-Mufassal fi San'at al-I'rab es una obra de gramática árabe que un resumen de investigación entregado al museo atribuye a al-Zamakhshari, y cuya fecha da así: muerte del autor 1143–1144 d. C. / 538 de la hégira; compuesto hacia 1120–1122 d. C. {cite:wikipedia-al-mufassal-fi-sanat-al-irab-en}. El resumen la cuenta entre sesenta de las obras más citadas en las cinco ciencias del árabe."
