id: work/fatwa-aliftaa-jo-a-charitys-unspent-vow-and-expiation-funds
class: work
kind: fatwa
label: { ar: "مبالغ النذور والكفارات التي بقيت سنوات في حساب جمعية خيرية", en: "Vow and expiation money left unspent for years in a charity's account", ur: "خیراتی انجمن کے کھاتے میں برسوں سے غیر خرچ شدہ نذر اور کفارے کی رقم" }
summary:
  ar: "سؤال عن جمعية خيرية تجمع النذور والكفارات وبقيت لديها مبالغ سنوات دون صرف، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجمعية وكيلة يحرم عليها تأخير إيصالها بغير عذر، فإن أُخرت وجبت المبادرة إلى إيصالها فورًا مع التوبة، وإن تلفت وجب ضمانها. أجابت الدائرة بأن الجمعيات الخيرية وكيلة عن أصحاب الكفارات والنذور في إيصالها إلى مستحقيها، فيجب على القائمين عليها المبادرة إلى ذلك، ولا يجوز تأخيرها دون عذر، وهي أمانة يجب حفظها. واستشهدت بقول الشرواني في حواشيه على تحفة المحتاج نقلًا عن التتمة إن الكفارة تجب على الفور إن كان الحنث معصية، وبقول الخطيب الشربيني في مغني المحتاج إن حاجة المستحقين ناجزة، فإن أخّر المكلف أثم وضمن إن تلف المال. وقالت إن الوكيل إذا أخّر إيصال شيء من الكفارات والنذور دون عذر أثم، ووجبت عليه المسارعة إلى إيصالها إبراءً لذمته مع التوبة والاستغفار، وإن تلفت وجب عليه ضمانها لتقصيره. وخلصت إلى تحريم تأخير إيصال الكفارات والنذور إلى المستحقين بغير عذر شرعي، ووجوب المبادرة إلى إيصالها فورًا إن أُخرت، مع التوبة، ووجوب ضمانها إن تلفت."
  en: "A question from a charity that collects vows and expiations and has held some of the money for years without spending it, in which Jordan's General Iftaa Department answered that the charity is an agent forbidden to delay delivery without excuse; if delayed, the money must be delivered at once with repentance, and if lost it must be made good. The Department answered that charities act as agents for those who owe expiations and vows in delivering them to those entitled, so those running them must hasten to do so and may not delay without excuse; the money is a trust that must be safeguarded. It cited al-Shirwani's glosses on Tuhfat al-Muhtaj, reporting from al-Tatimma that an expiation is due immediately if the broken oath was itself a sin, and al-Khatib al-Shirbini in Mughni al-Muhtaj that the recipients' need is immediate, so one who delays is sinful and liable if the money is lost. It said that an agent who delays delivering any expiation or vow without excuse is sinful and must hasten to deliver it to clear his liability, with repentance and seeking forgiveness, and is liable to make it good if it is lost through his failure. It concluded that delaying delivery of expiations and vows to those entitled without a legal excuse is forbidden; if they have been delayed, they must be delivered immediately with repentance, and if lost they must be made good."
  ur: "ایک خیراتی انجمن کے بارے میں سوال جو نذریں اور کفارے جمع کرتی ہے اور جس کے پاس کچھ رقم برسوں سے خرچ نہیں ہوئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ انجمن وکیل ہے جس کے لیے بلا عذر ادائیگی میں تاخیر حرام ہے؛ تاخیر ہو چکی ہو تو توبہ کے ساتھ فوراً پہنچانا واجب ہے، اور ضائع ہو جائے تو اس کا ضمان واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ خیراتی انجمنیں کفارے اور نذر والوں کی طرف سے انہیں مستحقین تک پہنچانے میں وکیل ہیں، لہٰذا ان کے منتظمین پر جلدی کرنا واجب ہے اور بلا عذر تاخیر جائز نہیں؛ یہ رقم امانت ہے جس کی حفاظت واجب ہے۔ اس نے تحفۃ المحتاج پر شروانی کے حواشی کا حوالہ دیا جن میں التتمہ سے نقل ہے کہ اگر قسم توڑنا خود گناہ ہو تو کفارہ فوراً واجب ہے، اور مغنی المحتاج میں خطیب شربینی کا قول کہ مستحقین کی ضرورت فوری ہے، لہٰذا تاخیر کرنے والا گناہ گار ہے اور مال ضائع ہو تو ضامن ہے۔ اس نے کہا کہ جو وکیل کسی کفارے یا نذر کو بلا عذر پہنچانے میں تاخیر کرے وہ گناہ گار ہے اور اپنی ذمہ داری سے بری ہونے کے لیے توبہ اور استغفار کے ساتھ اسے جلد پہنچانا اس پر واجب ہے، اور اگر اس کی کوتاہی سے ضائع ہو جائے تو اس کا ضمان واجب ہے۔ اس نے نتیجہ نکالا کہ بغیر شرعی عذر کے کفارے اور نذریں مستحقین تک پہنچانے میں تاخیر حرام ہے؛ تاخیر ہو چکی ہو تو توبہ کے ساتھ فوراً پہنچانا واجب ہے، اور ضائع ہو جائیں تو ان کا ضمان واجب ہے۔"
