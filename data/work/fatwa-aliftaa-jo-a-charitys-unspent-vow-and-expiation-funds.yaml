id: work/fatwa-aliftaa-jo-a-charitys-unspent-vow-and-expiation-funds
class: work
kind: fatwa
label: { ar: "مبالغ النذور والكفارات التي بقيت سنوات في حساب جمعية خيرية", en: "Vow and expiation money left unspent for years in a charity's account", ur: "خیراتی انجمن کے کھاتے میں برسوں سے غیر خرچ شدہ نذر اور کفارے کی رقم", es: "Dinero proveniente de votos y expiaciones que permanece sin gastar durante años en la cuenta de una organización benéfica.", fr: "Argent destiné aux vœux et aux expiations, laissé inutilisé pendant des années sur le compte d'une œuvre de charité", tr: "Yıllarca bir hayır kurumunun hesabında kalan yemin ve kefaret miktarları", id: "Jumlah sumpah dan penebusan yang bertahan selama bertahun-tahun dalam rekening asosiasi amal" }
summary:
  ar: "سؤال عن جمعية خيرية تجمع النذور والكفارات وبقيت لديها مبالغ سنوات دون صرف، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجمعية وكيلة يحرم عليها تأخير إيصالها بغير عذر، فإن أُخرت وجبت المبادرة إلى إيصالها فورًا مع التوبة، وإن تلفت وجب ضمانها. أجابت الدائرة بأن الجمعيات الخيرية وكيلة عن أصحاب الكفارات والنذور في إيصالها إلى مستحقيها، فيجب على القائمين عليها المبادرة إلى ذلك، ولا يجوز تأخيرها دون عذر، وهي أمانة يجب حفظها. واستشهدت بقول الشرواني في حواشيه على تحفة المحتاج نقلًا عن التتمة إن الكفارة تجب على الفور إن كان الحنث معصية، وبقول الخطيب الشربيني في مغني المحتاج إن حاجة المستحقين ناجزة، فإن أخّر المكلف أثم وضمن إن تلف المال. وقالت إن الوكيل إذا أخّر إيصال شيء من الكفارات والنذور دون عذر أثم، ووجبت عليه المسارعة إلى إيصالها إبراءً لذمته مع التوبة والاستغفار، وإن تلفت وجب عليه ضمانها لتقصيره. وخلصت إلى تحريم تأخير إيصال الكفارات والنذور إلى المستحقين بغير عذر شرعي، ووجوب المبادرة إلى إيصالها فورًا إن أُخرت، مع التوبة، ووجوب ضمانها إن تلفت."
  en: "A question from a charity that collects vows and expiations and has held some of the money for years without spending it, in which Jordan's General Iftaa Department answered that the charity is an agent forbidden to delay delivery without excuse; if delayed, the money must be delivered at once with repentance, and if lost it must be made good. The Department answered that charities act as agents for those who owe expiations and vows in delivering them to those entitled, so those running them must hasten to do so and may not delay without excuse; the money is a trust that must be safeguarded. It cited al-Shirwani's glosses on Tuhfat al-Muhtaj, reporting from al-Tatimma that an expiation is due immediately if the broken oath was itself a sin, and al-Khatib al-Shirbini in Mughni al-Muhtaj that the recipients' need is immediate, so one who delays is sinful and liable if the money is lost. It said that an agent who delays delivering any expiation or vow without excuse is sinful and must hasten to deliver it to clear his liability, with repentance and seeking forgiveness, and is liable to make it good if it is lost through his failure. It concluded that delaying delivery of expiations and vows to those entitled without a legal excuse is forbidden; if they have been delayed, they must be delivered immediately with repentance, and if lost they must be made good."
  ur: "ایک خیراتی انجمن کے بارے میں سوال جو نذریں اور کفارے جمع کرتی ہے اور جس کے پاس کچھ رقم برسوں سے خرچ نہیں ہوئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ انجمن وکیل ہے جس کے لیے بلا عذر ادائیگی میں تاخیر حرام ہے؛ تاخیر ہو چکی ہو تو توبہ کے ساتھ فوراً پہنچانا واجب ہے، اور ضائع ہو جائے تو اس کا ضمان واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ خیراتی انجمنیں کفارے اور نذر والوں کی طرف سے انہیں مستحقین تک پہنچانے میں وکیل ہیں، لہٰذا ان کے منتظمین پر جلدی کرنا واجب ہے اور بلا عذر تاخیر جائز نہیں؛ یہ رقم امانت ہے جس کی حفاظت واجب ہے۔ اس نے تحفۃ المحتاج پر شروانی کے حواشی کا حوالہ دیا جن میں التتمہ سے نقل ہے کہ اگر قسم توڑنا خود گناہ ہو تو کفارہ فوراً واجب ہے، اور مغنی المحتاج میں خطیب شربینی کا قول کہ مستحقین کی ضرورت فوری ہے، لہٰذا تاخیر کرنے والا گناہ گار ہے اور مال ضائع ہو تو ضامن ہے۔ اس نے کہا کہ جو وکیل کسی کفارے یا نذر کو بلا عذر پہنچانے میں تاخیر کرے وہ گناہ گار ہے اور اپنی ذمہ داری سے بری ہونے کے لیے توبہ اور استغفار کے ساتھ اسے جلد پہنچانا اس پر واجب ہے، اور اگر اس کی کوتاہی سے ضائع ہو جائے تو اس کا ضمان واجب ہے۔ اس نے نتیجہ نکالا کہ بغیر شرعی عذر کے کفارے اور نذریں مستحقین تک پہنچانے میں تاخیر حرام ہے؛ تاخیر ہو چکی ہو تو توبہ کے ساتھ فوراً پہنچانا واجب ہے، اور ضائع ہو جائیں تو ان کا ضمان واجب ہے۔"
  es: "Una organización benéfica que recauda votos y expiaciones y que ha retenido parte del dinero durante años sin gastarlo, respondió al Departamento General de Iftaa de Jordania que la organización benéfica es un agente al que se le prohíbe demorar la entrega sin justificación; si se demora, el dinero debe entregarse de inmediato con arrepentimiento, y si se pierde, debe ser resarcido. El Departamento explicó que las organizaciones benéficas actúan como agentes de quienes deben expiaciones y votos, entregándolos a los beneficiarios, por lo que quienes las administran deben apresurarse a hacerlo y no pueden demorarse sin justificación; el dinero es un fideicomiso que debe ser salvaguardado. Citó las glosas de al-Shirwani sobre Tuhfat al-Muhtaj, que recogen de al-Tatimma que una expiación debe hacerse inmediatamente si el juramento roto fue en sí mismo un pecado, y de al-Khatib al-Shirbini en Mughni al-Muhtaj que la necesidad de los receptores es inmediata, por lo que quien se demora es pecador y responsable si el dinero se pierde. El texto afirma que quien demora la entrega de cualquier expiación o voto sin justificación incurre en pecado y debe apresurarse a entregarlo para saldar su deuda, arrepintiéndose y pidiendo perdón. Asimismo, está obligado a resarcirlo si se pierde por su omisión. Concluye que está prohibido demorar la entrega de expiaciones y votos a quienes tienen derecho a ellos sin una excusa legal; si se han demorado, deben entregarse de inmediato con arrepentimiento, y si se pierden, deben resarcirse."
  fr: "Une organisation caritative collectant des serments et des expiations, et détenant une partie des fonds depuis des années sans les dépenser, a posé une question au Département général de la Iftaa de Jordanie. Ce dernier a répondu que l'organisation, en tant qu'intermédiaire, n'est pas autorisée à retarder le versement des sommes sans motif valable. En cas de retard, les fonds doivent être versés immédiatement, accompagnés de repentir, et en cas de perte, ils doivent être restitués. Le Département a expliqué que les organisations caritatives agissent en tant qu'intermédiaires pour le compte des débiteurs de serments et d'expiations, et doivent donc les verser aux bénéficiaires. Par conséquent, leurs responsables doivent agir rapidement et ne peuvent différer le versement sans motif valable; les fonds constituent un dépôt qui doit être protégé. Le Département a cité les gloses d'al-Shirwani sur Tuhfat al-Muhtaj, rapportant d'al-Tatimma qu'une expiation est due immédiatement si le serment rompu constituait lui-même un péché, et al-Khatib al-Shirbini dans Mughni al-Muhtaj que le besoin des bénéficiaires est immédiat. Ainsi, quiconque tarde à verser les fonds commet un péché et est responsable en cas de perte. Il a été établi que celui qui tarde à accomplir une expiation ou un vœu sans excuse valable commet un péché et doit s'empresser de le faire pour s'acquitter de son obligation, en se repentant et en implorant le pardon. Il est tenu de réparer le préjudice si celui-ci est perdu par sa négligence. Il a été conclu que le retard dans l'accomplissement des expiations et des vœux envers les personnes qui y ont droit, sans excuse légale, est interdit; s'ils ont été retardés, ils doivent être accomplis immédiatement avec repentir, et s'ils sont perdus, ils doivent être réparés."
  tr: "Yeminler ve kefaretler toplayan ve yıllarca ödenmemiş tutarları olan bir hayır kurumu hakkında bir soru; Ürdün Genel Fetva Dairesi, derneğin mazeretsiz teslimatı geciktirmesi yasak bir ajan olduğunu; gecikmesi durumunda derhal tövbe ile teslim edilmesi gerektiğini, zarar görürse garanti altına alınması gerektiğini yanıtladı. Departman, hayır kurumlarının, kefaret ve yeminleri ödeyenlerin hak sahibi alıcılarına teslim edilmesi için temsilci olarak hareket ettiğini, bu nedenle sorumluların inisiyatif alması gerektiğini yanıtladı. bunu yaparsanız, mazeretsiz geciktirmek mümkün değildir, çünkü bu güven güveni korunmalıdır. Al-Sharwani'nin Tuhfat al-Muhtaj notlarında Al-Tammah'tan alıntı yaparak alıntılanarak, eğer kırılma günahsa, hemen kefaret yapılması gerektiği ve Mughni al-Muhtaj'da El-Khatib Al-Sharbini'nin hak sahiplerinin ihtiyacının karşılandığı, ancak para kaybedilirse son yükümlü kişinin günahkar ve sorumlu olduğu ifadesini aktardı. Eğer vekil bazı kefaret ve yeminleri mazeretsiz olarak geciktirirse, günahkar olduğunu ve borçlarını tövbe ederek yerine getirmek için aceleyle teslim etmesi gerektiğini, zarar görseler bile eksikliklerinden sorumlu tutulması gerektiğini belirttiler. Sonuç olarak, hak sahiplerine hak sahiplerine yapılan kefaret ve yeminlerin gecikmesini, gecikmesi halinde hemen teslim edilme yükümlülüğünü, tövbe ve zarar görürse garanti yükümlülüğünü yasakladılar."
  id: "Sebuah pertanyaan tentang asosiasi amal yang mengumpulkan sumpah dan penebusan dan telah memiliki jumlah yang ditinggalkan selama bertahun-tahun tanpa pembayaran, di mana Departemen Fatwa Umum Yordania menjawab bahwa asosiasi tersebut adalah agen yang dilarang menunda pengiriman tanpa alasan; jika tertunda, harus segera diserahkan dengan pertobatan, dan jika rusak, harus dijamin. Departemen menjawab bahwa asosiasi amal bertindak sebagai agen bagi mereka yang membayar penebusan dan sumpah dalam menyerahkannya kepada penerima yang berhak, sehingga mereka yang bertanggung jawab harus mengambil inisiatif untuk melakukannya, dan tidak diperbolehkan menunda tanpa alasan, karena itu adalah kepercayaan yang harus dijaga. Departemen mengutip pernyataan Al-Sharwani dalam catatannya tentang Tuhfat al-Muhtaj, mengutip Al-Tammah, bahwa penebusan harus segera dibayar jika pelanggaran adalah dosa, dan pernyataan Al-Khatib Al-Sharbini dalam Mughni al-Muhtaj bahwa kebutuhan orang yang berhak terpenuhi, tetapi orang terakhir yang berwajib berdosa dan bertanggung jawab jika uang hilang. Dinyatakan bahwa jika agen menunda menyampaikan beberapa penebusan dan sumpah tanpa alasan, ia berdosa, dan ia harus segera menepatinya untuk melunaikan kewajibannya dengan pertobatan dan mencari pengampunan, meskipun mereka terluka, ia harus bertanggung jawab atas kekurangannya. Mereka menyimpulkan dengan melarang menunda pemberian penebusan dan sumpah kepada mereka yang berhak tanpa alasan yang sah, serta kewajiban untuk segera menepatinya jika tertunda, bersama dengan pertobatan, dan kewajiban untuk menjamin jika mereka dirugikan."
