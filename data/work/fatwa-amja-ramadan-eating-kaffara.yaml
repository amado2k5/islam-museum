label: { ar: "الفطر العمد في رمضان بالأكل أو الشرب", en: "Deliberate eating or drinking in Ramadan — expiation", ur: "رمضان میں دانستہ کھانا پینا — کفارہ", es: "Comer o beber deliberadamente durante el Ramadán: expiación.", fr: "Manger ou boire délibérément pendant le Ramadan — expiation", tr: "Ramazan'da Yemek veya İçmek Yoluyla Bilerek Oruç Bozmak", id: "Sengaja Memutus Puasa di Ramadan dengan Makan atau Minum" }
summary:
  ar: "سأل سائل أن أكثر أهل العلم على أن من أفطر عمدًا بالأكل أو الشرب في نهار رمضان يجب عليه القضاء فقط وأن الكفارة خاصة بالجماع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77696 بتاريخ 4 فبراير 2009)⁩ أن الخلاف وقع بين أهل العلم في وجوب الكفارة على من أفطر عمدًا بالطعام أو الشراب فالشافعية والحنابلة على عدم وجوبها إلا بالجماع لأنه مناط الكفارة في النص الموجب، والمالكية والأحناف على وجوبها في الفطر المتعمد سواء بطعام أو شراب أو جماع لاستواء الثلاثة في الحرمة، والمسألة موضع اجتهاد ولعل الأقرب إلى مقاصد الشرع قصر وجوب الكفارة على الفطر بالجماع."
  en: "A questioner noted that most scholars hold that one who deliberately breaks a Ramadan fast by eating or drinking owes only make-up, expiation being specific to intercourse. Dr. Salah al-Sawi (fatwa no. 77696, 4 February 2009) answered that scholars indeed differed: the Shafi'is and Hanbalis require no expiation except for intercourse, it being the text's specific ground; the Malikis and Hanafis require it for deliberate breaking whether by food, drink or intercourse, all three equal in prohibition; the question lies in ijtihad, and nearer to the sharia's aims, he held, is confining expiation to breaking by intercourse."
  ur: "ایک سائل نے رمضان میں دانستہ افطار پر کفارے کے اختلاف پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77696، 4 فروری 2009)⁩ کے مطابق شافعی و حنبلی کفارہ کو جماع تک محدود رکھتے ہیں، مالکی و حنفی عام رکھتے ہیں؛ مقاصد کے قریب تر یہی ہے کہ کفارہ جماع تک ہو۔"
  es: "Un interlocutor señaló que la mayoría de los eruditos sostienen que quien rompe deliberadamente el ayuno de Ramadán comiendo o bebiendo solo debe compensarlo, siendo la expiación específica para las relaciones sexuales. El Dr. Salah al-Sawi (fatwa n.° 77696, 4 de febrero de 2009) respondió que, en efecto, los eruditos difieren: los shafiíes y los hanbalíes no exigen expiación excepto por las relaciones sexuales, que es el fundamento específico del texto; los malikíes y los hanafíes la exigen para la ruptura deliberada, ya sea por comida, bebida o relaciones sexuales, siendo las tres igualmente prohibidas; la cuestión radica en el ijtihad, y, según él, lo más cercano a los objetivos de la sharia es limitar la expiación a la ruptura por relaciones sexuales."
  fr: "Un interlocuteur a fait remarquer que la plupart des savants estiment que celui qui rompt délibérément le jeûne du Ramadan en mangeant ou en buvant n'est tenu qu'à une expiation de rattrapage, l'expiation étant spécifique aux rapports sexuels. Le Dr Salah al-Sawi (fatwa n° 77696, 4 février 2009) a répondu que les savants divergent effectivement: les chaféites et les hanbalites n'exigent aucune expiation, sauf en cas de rapports sexuels, ce qui constitue le fondement explicite du texte; les malikites et les hanafites l'exigent pour toute rupture délibérée du jeûne, que ce soit par la nourriture, la boisson ou les rapports sexuels, ces trois actes étant également interdits; la question relève de l'ijtihad, et, selon lui, il est plus conforme aux objectifs de la charia de limiter l'expiation à la rupture du jeûne par les rapports sexuels."
  tr: "Bir soru soran kişiye, çoğu alimin Ramazan ayında orucu kasıtlı olarak yiyip içen kişinin sadece orucu tamamlaması gerektiğini ve kefaretin cinsel ilişkiye özgü olduğunu savunup kurmadığını sormuştur. Dr. Salah Al-Sawi, 4 Şubat 2009 tarihli 77696 No'lu Fetva) alimler arasında yiyecek veya içecekle oruç tutanların kefaret yükümlülüğü konusunda anlaşmazlık olduğunu yanıtlamıştır. Şafiiler ve Hanbaliler, bunun yalnızca cinsel ilişki yoluyla zorunlu olduğunu, çünkü yetkili metinde kefaretin temelini oluşturduğunu savunur. Malikiler ve Hanafiler, kasıtlı olarak orucu yiyecek, içecek veya cinsel ilişki yoluyla bozmanın zorunlu olduğunu savunur; çünkü bu üç kişinin yasak eşitliğine sahiptir. Bu konu ijtihad'a tabidir ve Şeriat'ın amaçlarına en yakın olanı, kefaret yükümlülüğünü cinsel ilişki yoluyla bozmakla sınırlamaktır."
  id: "Seorang penanya ditanya apakah sebagian besar ulama berpendapat bahwa siapa pun yang sengaja memutus puasa dengan makan atau minum di siang hari di Ramadan hanya harus menebus puasa, dan penebusan itu khusus untuk hubungan seksual. Dr. Salah Al-Sawi menjawab (Fatwa No. 77696 tanggal 4 Februari 2009) bahwa terdapat perbedaan pendapat di antara ulama mengenai kewajiban penebusan bagi mereka yang sengaja memutus puasa dengan makanan atau minuman. Syafi'i dan Hanbali berpendapat bahwa penebusan hanya diwajibkan melalui hubungan seksual, karena itu adalah dasar penebusan dalam teks otoritatif. Umat Malik dan Hanafi berpendapat bahwa memutus puasa dengan sengaja, baik dengan makanan, minuman, atau hubungan seksual, adalah wajib karena kesetaraan ketiganya dalam larangan tersebut. Isu ini tunduk pada ijtihad, dan mungkin tujuan terdekat dari Syariah adalah membatasi kewajiban penebusan pada memutus puasa melalui hubungan seksual."
