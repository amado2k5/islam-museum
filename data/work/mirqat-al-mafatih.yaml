summary:
  ar: "«مرقاة المفاتيح شرح مشكاة المصابيح» لعلي بن سلطان محمد القاري ⁦(ت 1014هـ)⁩: شرح على «مشكاة المصابيح» للخطيب التبريزي، يذكر فيه الحديث ثم يشرح ألفاظه ويبين معانيه وأقوال العلماء فيه. {cite:mirqat-al-mafatih-dar-kitab-vol7 p. 5}"
  en: "Ali ibn Sultan Muhammad al-Qari's (d. 1014 AH) commentary on Mishkat al-masabih of al-Khatib al-Tibrizi. It takes each hadith, explains its words and meaning, and reports the scholars' views. {cite:mirqat-al-mafatih-dar-kitab-vol7 p. 5}"
  es: "Comentario de Ali ibn Sultan Muhammad al-Qari (fallecido en 1014 AH) sobre Mishkat al-masabih de al-Khatib al-Tibrizi. Analiza cada hadiz, explica sus palabras y significado, y recoge las opiniones de los eruditos. {cite:mirqat-al-mafatih-dar-kitab-vol7 p. 5}"
  fr: "Commentaire d'Ali ibn Sultan Muhammad al-Qari (mort en 1014 AH) sur le Mishkat al-masabih d'al-Khatib al-Tibrizi. Il analyse chaque hadith, en explique le sens et rapporte les avis des savants. {cite:mirqat-al-mafatih-dar-kitab-vol7 p. 5}"
  ur: "علی ابن سلطان محمد القاری کی ⁦(متوفی 1014ھ)⁩ الخطیب التبریزی کی مشکوٰۃ المصابیح کی تفسیر۔ یہ ہر حدیث کو لیتا ہے، اس کے الفاظ اور معنی بیان کرتا ہے، اور علماء کے خیالات کو رپورٹ کرتا ہے۔ {حوالہ: مرقات المفاتیح شرح کتاب جلد 7 ص۔ 5}"
  tr: "\"Mirqat al-Mafatih Sharh Mishkat al-Masabih\" Ali ibn Sultan Muhammed el-Kari'den (ö. 1014 H.): El-Khatib el-Tabrizi'nin \"Mişkat el-Masabih\" üzerine bir tefsir; burada hadis anılır, ifadeleri açıklanır ve anlamları ile alimlerin açıklamaları netleştirilir. {atı:Mirqat-al-Mafatih-dar-Kitab-cilt 7 s. 5}"
  id: "\"Mirqat al-Mafatih Sharh Mishkat al-Masabih\" oleh Ali ibn Sultan Muhammad al-Qari (wafat 1014 H): Komentar atas \"Mishkat al-Masabih\" oleh al-Khatib al-Tabrizi, di mana hadis disebutkan, kata-katanya dijelaskan, serta makna dan pernyataan para ulama diperjelas. {cite:Mirqat-al-Mafatih-dar-kitab-vol7 hlm. 5}"
