id: work/ahmed-el-sayed-seerah-lilmuslihin-ep02
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 2: إرهاصات النبوة"
  en: "The Prophetic Biography for Reformers, episode 2: Signs Preceding Prophethood"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 2: نبوت سے پہلے کی علامات"
  fr: "La biographie prophétique pour les réformateurs, épisode 2 : Les signes précurseurs de la prophétie"
  es: "La biografía profética para los reformadores, episodio 2: Los signos que precedieron a la profecía"
summary:
  ar: "المحاضرة الثانية من سلسلة السيرة النبوية للمصلحين، وموضوعها ما وقع قبل البعثة. يصنف المتحدث الأحداث إلى علامات لفتت انتباه الناس وعلامات وتهيئة تخص النبي نفسه، ومنها عام الفيل ورؤيا أمه وشق صدره والبشارات السابقة في كتب أهل الكتاب وصدقه ورعيه للغنم وخلواته. ويستخلص من كل ذلك أن الله يهيئ من يرسلهم للمهمات العظيمة."
  en: "The second lecture of the series on the Prophet's biography for reformers, on what happened before the sending. The speaker sorts the events into signs that drew people's attention and signs and preparation aimed at the Prophet himself: the Year of the Elephant, his mother's vision, the opening of his chest, the earlier tidings in the scriptures of the People of the Book, his truthfulness, his shepherding and his retreats. He draws from each the lesson that God prepares those He sends for great tasks."
  ur: "پیغمبر کی سیرت برائے مصلحین کے سلسلے کا دوسرا لیکچر، جو بعثت سے پہلے کے واقعات پر ہے۔ مقرر واقعات کو دو حصوں میں بانٹتا ہے: وہ علامات جنھوں نے لوگوں کی توجہ مبذول کی، اور وہ علامات اور تیاری جو خود نبی سے متعلق ہیں، یعنی عام الفیل، ان کی والدہ کا خواب، شق صدر، اہل کتاب کی کتابوں میں پہلے سے دی گئی بشارتیں، ان کی سچائی، بکریاں چرانا اور خلوت۔ وہ ہر بات سے یہ سبق لیتا ہے کہ اللہ جنھیں بڑے کاموں کے لیے بھیجتا ہے انھیں پہلے تیار کرتا ہے۔"
  fr: "Deuxième conférence de la série sur la biographie du Prophète pour les réformateurs, consacrée à ce qui précède l'envoi. Le conférencier classe les événements en signes qui ont attiré l'attention des gens et en signes et préparation qui concernent le Prophète lui-même : l'année de l'Éléphant, la vision de sa mère, l'ouverture de sa poitrine, les annonces antérieures dans les écritures des gens du Livre, sa véracité, son métier de berger et ses retraites. Il en tire la leçon que Dieu prépare ceux qu'Il envoie pour de grandes tâches."
  es: "Segunda conferencia de la serie sobre la biografía del Profeta para reformadores, dedicada a lo que ocurrió antes del envío. El conferenciante clasifica los acontecimientos en signos que llamaron la atención de la gente y signos y preparación que afectan al propio Profeta: el año del Elefante, la visión de su madre, la apertura de su pecho, los anuncios previos en las escrituras de la gente del Libro, su veracidad, su oficio de pastor y sus retiros. De todo ello extrae la lección de que Dios prepara a quienes envía para grandes tareas."
