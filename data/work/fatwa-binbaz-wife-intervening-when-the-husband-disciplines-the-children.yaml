id: work/fatwa-binbaz-wife-intervening-when-the-husband-disciplines-the-children
class: work
kind: fatwa
label: { ar: "حكم تدخل المرأة عند تأديب الزوج أولاده", en: "A wife intervening when her husband disciplines his children", ur: "شوہر کے بچوں کو تادیب کرتے وقت بیوی کے مداخلت کرنے کا حکم" }
summary:
  ar: "سؤال عن حق المرأة في الكلام على زوجها إذا أدّب أولاده، أجاب فيه ابن باز بأنه لا بأس أن تتدخل إذا كان الزوج يسرف في التأديب وليس عنده بصيرة فيه، لكن بحكمة وأسلوب حسن لا بالغلظة والشدة ولا بما يسبب فراقه لها أو سبّه لها، وأن الأولى أن يكون تدخلها في غير وجود الأولاد في وقت آخر على سبيل النصيحة والتعاون على الخير، إلا أن يكون الأمر كبيرًا لا يُتحمل فلها التدخل في حضرتهم. أما إذا كان التأديب صالحًا مناسبًا لم يتجاوز الحدود فليس لها التدخل فيه لأن ذلك يفسد الأولاد عليه، بل تعينه عليه وتدعو له وتشجعه عند أولاده وفي غيبتهم."
  en: "A question about a wife's right to speak up to her husband when he disciplines his children, in which Ibn Baz answered that there is no harm in her intervening when the husband is excessive in discipline and lacks insight in it, but with wisdom and a good manner, not with harshness and severity nor in a way that leads him to leave her or insult her; it is better that she intervene when the children are not present, at another time, by way of advice and cooperation in good, unless the matter is so serious it cannot be borne, in which case she may intervene in their presence. When the discipline is sound and appropriate and does not exceed the limits, however, she should not intervene, since that would turn the children against him; rather she should support him, pray for him and encourage him, both in front of the children and in their absence."
  ur: "شوہر کے اپنے بچوں کو تادیب کرنے پر بیوی کے اس سے بات کرنے کے حق کے بارے میں سوال، جس میں ابن باز نے جواب دیا کہ اگر شوہر تادیب میں حد سے بڑھے اور اس میں بصیرت نہ رکھتا ہو تو بیوی کے مداخلت کرنے میں کوئی حرج نہیں، لیکن حکمت اور اچھے انداز سے، نہ سختی اور درشتی سے اور نہ ایسے طریقے سے جو اس کے الگ ہونے یا گالی دینے کا سبب بنے؛ بہتر یہ ہے کہ اس کی مداخلت بچوں کی موجودگی کے بغیر کسی اور وقت نصیحت اور نیکی میں تعاون کے طور پر ہو، سوائے اس کے کہ معاملہ اتنا بڑا ہو کہ برداشت نہ ہو سکے تو وہ ان کی موجودگی میں مداخلت کر سکتی ہے۔ لیکن جب تادیب درست اور مناسب ہو اور حدود سے نہ بڑھے تو اسے مداخلت نہیں کرنی چاہیے کیونکہ یہ بچوں کو اس کے خلاف کر دیتی ہے؛ بلکہ وہ اس کی مدد کرے، اس کے لیے دعا کرے اور اسے بچوں کے سامنے اور ان کی غیر موجودگی میں حوصلہ دے۔"
