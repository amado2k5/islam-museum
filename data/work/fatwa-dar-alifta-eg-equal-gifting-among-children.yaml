summary:
  ar: "سائلة سألت عن التسوية بين الابن والبنت في الهبة حال الحياة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23897)⁩ أنه يجوز للمرأة أن تهب جزءًا من مالها في حياتها لأولادها، والأصل أن تسوي بينهم في الهبة إذا استووا في الحاجة أو عدمها، وبيّن الجواب حكم التفضيل بين الأولاد."
  en: "A woman asked how to equalise son and daughter in gifts made during her lifetime. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23897) answered that a woman may gift part of her money to her children in her lifetime, and the norm is to equalise them in the gift where they are equal in need or freedom from it; the answer sets out the ruling on favouring some children over others."
  ur: "ایک خاتون نے اپنی زندگی میں بیٹے اور بیٹی کو ہبہ میں برابر رکھنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23897)⁩ نے جواب دیا کہ خاتون اپنی زندگی میں اپنے مال کا حصہ بچوں کو ہبہ کر سکتی ہے، اور اصول یہ ہے کہ جب وہ حاجت میں برابر ہوں تو ہبہ میں بھی برابر رکھے؛ جواب میں بعض اولاد پر فضیلت دینے کا حکم بھی بیان ہوا۔"
