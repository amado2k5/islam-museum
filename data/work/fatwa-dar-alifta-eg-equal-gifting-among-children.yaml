id: work/fatwa-dar-alifta-eg-equal-gifting-among-children
class: work
kind: fatwa
label: { ar: "كيفية التسوية بين الابن والبنت في الهبة حال الحياة", en: "Treating son and daughter equally in lifetime gifts", ur: "زندگی میں دئیے گئے ہبہ میں بیٹے اور بیٹی کی برابری کا طریقہ", es: "Tratar a hijo e hija por igual en cuanto a los regalos de por vida.", fr: "Offrir des cadeaux de la vie à un fils et une fille de manière égale" }
summary:
  ar: "سائلة سألت عن التسوية بين الابن والبنت في الهبة حال الحياة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23897)⁩ أنه يجوز للمرأة أن تهب جزءًا من مالها في حياتها لأولادها، والأصل أن تسوي بينهم في الهبة إذا استووا في الحاجة أو عدمها، وبيّن الجواب حكم التفضيل بين الأولاد."
  en: "A woman asked how to equalise son and daughter in gifts made during her lifetime. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23897) answered that a woman may gift part of her money to her children in her lifetime, and the norm is to equalise them in the gift where they are equal in need or freedom from it; the answer sets out the ruling on favouring some children over others."
  ur: "ایک خاتون نے اپنی زندگی میں بیٹے اور بیٹی کو ہبہ میں برابر رکھنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23897)⁩ نے جواب دیا کہ خاتون اپنی زندگی میں اپنے مال کا حصہ بچوں کو ہبہ کر سکتی ہے، اور اصول یہ ہے کہ جب وہ حاجت میں برابر ہوں تو ہبہ میں بھی برابر رکھے؛ جواب میں بعض اولاد پر فضیلت دینے کا حکم بھی بیان ہوا۔"
  es: "Una mujer preguntó cómo igualar a su hijo y a su hija en los regalos que recibe en vida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 23897) respondió que una mujer puede donar parte de su dinero a sus hijos en vida, y que la norma es igualarlos en el regalo cuando tengan la misma necesidad o carencia; la respuesta establece la norma sobre favorecer a unos hijos sobre otros."
  fr: "Une femme a demandé comment égaliser les donations faites de son vivant à son fils et à sa fille. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23897) a répondu qu'une femme peut léguer une partie de son argent à ses enfants de son vivant, et que la norme est d'égaliser les donations entre eux lorsqu'ils sont dans le même besoin ou peuvent se permettre d'en être exemptés; la réponse expose la règle concernant le fait de privilégier certains enfants par rapport à d'autres."
