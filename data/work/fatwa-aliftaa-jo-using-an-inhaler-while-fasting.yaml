id: work/fatwa-aliftaa-jo-using-an-inhaler-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال البخاخ للمريض في نهار رمضان", en: "A patient using an inhaler during the day in Ramadan", ur: "رمضان کے دن میں مریض کا انہیلر استعمال کرنا", es: "Un paciente que usa un inhalador durante el día en Ramadán.", fr: "Un patient utilise un inhalateur pendant la journée, durant le Ramadan." }
summary:
  ar: "سؤال عن استعمال المريض للبخاخ في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن البخاخ عن طريق الأنف أو الفم مفطر، فمن احتاجه في بعض الأيام استعمله وأمسك وقضى، ومن احتاجه كل يوم استعمله وأمسك وأطعم عن كل يوم مسكينًا. أجابت الدائرة بأن استعمال البخاخ عن طريق الأنف أو الفم مفطر، لأن الدواء في هذه البخاخات يُراد منه الوصول إلى الرئتين، وهما من الجوف. وقالت إن من كان يستعمله في بعض الأيام يستعمله وقت الصيام ويبقى ممسكًا ويقضي فيما بعد. وأضافت أن من كان يستعمله كل يوم يستعمله وقت الصيام ويبقى ممسكًا، ويطعم عن كل يوم مسكينًا."
  en: "A question about a patient using an inhaler during the day in Ramadan, in which Jordan's General Iftaa Department answered that an inhaler through the nose or mouth breaks the fast; someone who needs it on some days uses it, keeps refraining and makes those days up, while someone who needs it every day uses it, keeps refraining and feeds a poor person for each day. The Department answered that using an inhaler through the nose or mouth breaks the fast, because the medicine in these inhalers is meant to reach the lungs, which are part of the body's interior. It said that someone who uses it on some days uses it while fasting, keeps refraining from food and drink, and makes those days up later. It added that someone who uses it every day uses it while fasting, keeps refraining, and feeds one poor person for each day."
  ur: "رمضان کے دن میں مریض کے انہیلر استعمال کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ناک یا منہ کے ذریعے انہیلر روزہ توڑ دیتا ہے؛ جسے بعض دنوں میں ضرورت ہو وہ استعمال کرے، رکا رہے اور قضا کرے، اور جسے ہر روز ضرورت ہو وہ استعمال کرے، رکا رہے اور ہر دن کے بدلے ایک مسکین کو کھانا کھلائے۔ ڈیپارٹمنٹ نے جواب دیا کہ ناک یا منہ کے ذریعے انہیلر کا استعمال روزہ توڑ دیتا ہے، کیونکہ ان انہیلرز میں دوا کا مقصد پھیپھڑوں تک پہنچنا ہے، اور پھیپھڑے جوف کا حصہ ہیں۔ اس نے کہا کہ جو اسے بعض دنوں میں استعمال کرتا ہو وہ روزے کے وقت استعمال کرے، کھانے پینے سے رکا رہے اور بعد میں قضا کرے۔ اس نے مزید کہا کہ جو اسے ہر روز استعمال کرتا ہو وہ روزے کے وقت استعمال کرے، رکا رہے، اور ہر دن کے بدلے ایک مسکین کو کھانا کھلائے۔"
  es: "Una pregunta sobre un paciente que usa un inhalador durante el día en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que un inhalador por la nariz o la boca rompe el ayuno; quien lo necesita algunos días lo usa, continúa absteniéndose y recupera esos días, mientras que quien lo necesita todos los días lo usa, continúa absteniéndose y alimenta a una persona pobre por cada día. El Departamento respondió que usar un inhalador por la nariz o la boca rompe el ayuno porque el medicamento en estos inhaladores está destinado a llegar a los pulmones, que son parte del interior del cuerpo. Dijo que quien lo usa algunos días lo usa mientras ayuna, continúa absteniéndose de comer y beber, y recupera esos días más tarde. Añadió que quien lo usa todos los días lo usa mientras ayuna, continúa absteniéndose y alimenta a una persona pobre por cada día."
  fr: "Une question concernant l'utilisation d'un inhalateur par un patient durant la journée pendant le Ramadan a été posée. Le Département général de la Iftaa en Jordanie a répondu que l'utilisation d'un inhalateur par voie nasale ou buccale rompt le jeûne. Une personne qui en a besoin occasionnellement l'utilise, s'abstient de manger et de boire, puis rattrape les jours manqués. En revanche, une personne qui en a besoin quotidiennement l'utilise, s'abstient de manger et de boire, et nourrit une personne pauvre pour chaque jour manqué. Le Département a expliqué que l'utilisation d'un inhalateur par voie nasale ou buccale rompt le jeûne car le médicament contenu dans ces inhalateurs est destiné à atteindre les poumons, qui font partie intégrante du corps. Il a précisé qu'une personne qui utilise un inhalateur occasionnellement le fait pendant le jeûne, s'abstient de manger et de boire, et rattrape les jours manqués ultérieurement. Il a ajouté qu'une personne qui en a besoin quotidiennement l'utilise pendant le jeûne, s'abstient de manger et de boire, et nourrit une personne pauvre pour chaque jour manqué."
