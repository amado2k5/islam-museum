id: work/fatwa-binbaz-marrying-a-wifes-maternal-cousin
class: work
kind: fatwa
label: { ar: "حكم الجمع بين المرأة وابنة خالتها", en: "Being married to a woman and her maternal cousin at the same time", ur: "ایک عورت اور اس کی خالہ زاد بہن کو بیک وقت نکاح میں رکھنے کا حکم" }
summary:
  ar: "سؤال من رجل له ثلاث زوجات يريد الزواج برابعة هي ابنة خالة إحداهن برضا الطرفين، أجاب فيه ابن باز بأنه لا بأس بالجمع بين الزوجة وبنت خالتها أو بنت عمتها، ولا حرج في الجمع بين بنتي العم أو بنتي الخال أو بنتي الخالة أو بنتي العمة، وإنما الممنوع الجمع بين الأختين بنص آية النساء، والجمع بين المرأة وعمتها أو خالتها أو بنت أخيها أو بنت أختها لنهي النبي عن ذلك، لا تُنكح الصغرى على الكبرى ولا الكبرى على الصغرى، وبيّن أن المنع يشمل العمة والخالة ولو كانتا بعيدتين، فلا يُجمع بين المرأة وعمة أبيها أو عمة أمها أو عمة جدها أو جدتها، ولا بينها وخالة أمها أو خالة أبيها أو خالة جدتها، لأن خالة الأب والأم خالة لها."
  en: "A question from a man with three wives who wishes to marry a fourth, the maternal cousin of one of them, with both women's consent; Ibn Baz answered that there is no harm in being married at once to a wife and her maternal or paternal cousin, nor in combining two paternal cousins, two maternal cousins or the daughters of two aunts, and that what is forbidden is combining two sisters, by the text of the verse of al-Nisa, and combining a woman with her paternal or maternal aunt, or with her brother's or sister's daughter, since the Prophet forbade this, saying the younger is not married over the elder nor the elder over the younger. He explained that the prohibition covers aunts even at a distance: a woman may not be combined with her father's or mother's paternal aunt, or her grandfather's or grandmother's, nor with her mother's, father's or grandmother's maternal aunt, because the maternal aunt of her father or mother counts as her own."
  ur: "تین بیویوں والے ایک شخص کا سوال جو چوتھی شادی ان میں سے ایک کی خالہ زاد سے دونوں عورتوں کی رضامندی سے کرنا چاہتا ہے؛ ابن باز نے جواب دیا کہ بیوی اور اس کی خالہ زاد یا پھوپھی زاد کو بیک وقت نکاح میں رکھنے میں کوئی حرج نہیں، نہ دو چچا زاد، دو ماموں زاد یا دو خالاؤں یا پھوپھیوں کی بیٹیوں کو جمع کرنے میں، اور جو ممنوع ہے وہ سورہ نساء کی نص سے دو بہنوں کو جمع کرنا ہے، اور عورت کو اس کی پھوپھی یا خالہ یا اس کے بھائی یا بہن کی بیٹی کے ساتھ جمع کرنا، کیونکہ نبی نے اس سے منع کیا کہ چھوٹی کا بڑی پر یا بڑی کا چھوٹی پر نکاح نہ کیا جائے۔ انہوں نے واضح کیا کہ ممانعت دور کی پھوپھی اور خالہ کو بھی شامل ہے: عورت کو اس کے باپ یا ماں کی پھوپھی یا اس کے دادا یا دادی کی پھوپھی کے ساتھ جمع نہیں کیا جا سکتا، نہ اس کی ماں، باپ یا دادی کی خالہ کے ساتھ، کیونکہ باپ اور ماں کی خالہ اس کی اپنی خالہ شمار ہوتی ہے۔"
