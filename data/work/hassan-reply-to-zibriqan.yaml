label: { ar: "قصيدة حسان في الرد على الزبرقان «إن الذوائب من فهر وإخوتهم»", en: "Hassan ibn Thabit's reply to al-Zibriqan, 'The chiefs of Fihr and their brothers'" }
summary:
  ar: "قصيدة حسان بن ثابت التي أجاب بها الزبرقان بن بدر في مفاخرة وفد بني تميم؛ روى حسان أنه استُدعي وهو غائب وأنشأ في طريقه أبياتاً ثم قام فأجاب على نحو ما قال الزبرقان. يمدح فيها قريشاً والأنصار بالسنّة المتّبعة والكرم والعفة المذكورة في الوحي والبأس. أنشد ابن هشام بيتاً منها عن أبي زيد برواية أخرى، ويذكر المحققون أنها من قصيدة في أربعة عشر بيتاً."
  en: "Hassan ibn Thabit's answer to al-Zibriqan ibn Badr in the Banu Tamim contest; Hassan relates that he was summoned while absent and composed lines on the way, then answered in the same vein. It praises Quraysh and the Ansar for the sunna they established, their generosity, the chastity Revelation mentions, and their valour. Ibn Hisham gives one verse in Abu Zayd's reading; the editors note the opening lines belong to a fourteen-verse qasida."
