label: { ar: "قصيدة حسان في الرد على الزبرقان «إن الذوائب من فهر وإخوتهم»", en: "Hassan ibn Thabit's reply to al-Zibriqan, 'The chiefs of Fihr and their brothers'", es: "Respuesta de Hassan ibn Thabit a al-Zibriqan: «Los jefes de Fihr y sus hermanos».", fr: "Réponse de Hassan ibn Thabit à al-Zibriqan, « Les chefs de Fihr et leurs frères »", ur: "حسن بن ثابت کا الزبرقان کو جواب، 'فہر کے سردار اور ان کے بھائی'", tr: "Hassan'ın Al-Zabiraqan'a yanıt şiiri: 'Gerçekten kurtlar Fahr ve kardeşlerinden.'", id: "Puisi Hassan sebagai tanggapan kepada Al-Zabiraqan: 'Memang, serigala berasal dari Fahr dan saudara-saudaranya.'" }
summary:
  ar: "قصيدة حسان بن ثابت التي أجاب بها الزبرقان بن بدر في مفاخرة وفد بني تميم؛ روى حسان أنه استُدعي وهو غائب وأنشأ في طريقه أبياتاً ثم قام فأجاب على نحو ما قال الزبرقان. يمدح فيها قريشاً والأنصار بالسنّة المتّبعة والكرم والعفة المذكورة في الوحي والبأس. أنشد ابن هشام بيتاً منها عن أبي زيد برواية أخرى، ويذكر المحققون أنها من قصيدة في أربعة عشر بيتاً."
  en: "Hassan ibn Thabit's answer to al-Zibriqan ibn Badr in the Banu Tamim contest; Hassan relates that he was summoned while absent and composed lines on the way, then answered in the same vein. It praises Quraysh and the Ansar for the sunna they established, their generosity, the chastity Revelation mentions, and their valour. Ibn Hisham gives one verse in Abu Zayd's reading; the editors note the opening lines belong to a fourteen-verse qasida."
  es: "Respuesta de Hassan ibn Thabit a al-Zibriqan ibn Badr en el concurso de Banu Tamim; Hassan relata que fue convocado estando ausente y compuso versos en el camino, para luego responder en el mismo tono. Alaba a los Quraysh y a los Ansar por la sunna que establecieron, su generosidad, la castidad que menciona la Revelación y su valor. Ibn Hisham cita un verso en la lectura de Abu Zayd; los editores señalan que los versos iniciales pertenecen a una qasida de catorce versos."
  fr: "Réponse de Hassan ibn Thabit à al-Zibriqan ibn Badr lors du débat des Banu Tamim; Hassan raconte avoir été convoqué alors qu’il était absent et avoir composé des vers en chemin, puis répondu dans le même esprit. Il y loue les Quraysh et les Ansar pour la sunna qu’ils ont établie, leur générosité, la chasteté mentionnée dans la Révélation et leur vaillance. Ibn Hisham cite un verset de la lecture d’Abu Zayd; les éditeurs précisent que les premiers vers appartiennent à une qasida de quatorze vers."
  ur: "بنو تمیم کے مقابلہ میں حسن بن ثابت کا الزبرقان ابن بدر کو جواب؛ حسن بیان کرتے ہیں کہ انہیں غیر حاضری کی حالت میں طلب کیا گیا اور راستے میں سطریں لکھیں، پھر اسی طرح جواب دیا۔ اس میں قریش اور انصار کی ان کی قائم کردہ سنت، ان کی سخاوت، پاکیزگی کا ذکر اور ان کی بہادری کی تعریف کی گئی ہے۔ ابن ہشام ابو زید کی تلاوت میں ایک آیت دیتا ہے؛ ایڈیٹرز نوٹ کرتے ہیں کہ ابتدائی سطریں چودہ آیتوں پر مشتمل قصیدہ سے تعلق رکھتی ہیں۔"
  tr: "Hasan ibn Tabit'in şiirinde, el-Zaburqan ibn Bedr'in Banu Tamim'in heyetiyle övünerek karşılık verdiği şiir; Hassan, yokken çağrıldığını, yolda şiirler yazdığını, sonra ayağa kalkıp el-Zaburqan'ın dediği gibi cevap verdiğini anlattı. Şiirde, Süneti'ni takip ettikleri Sünnet, cömertlik ve vahiy ile cesarette belirtilen iffet için Kureyş ve Ensar'ı övdü. İbn Hisham, başka bir rivayette Ebu Zayd'den bir ayet okumuş, alimler ise bunun on dört dizeden oluşan bir şiir olduğunu belirtmiştir."
  id: "Puisi karya Hassan ibn Thabit, yang dijawab al-Zaburqan ibn Badr dengan membanggakan delegasi Banu Tamim; Hassan menceritakan bahwa ia dipanggil saat tidak hadir, menulis ayat-ayat dalam perjalanan, lalu berdiri dan menjawab seperti yang dikatakan al-Zaburqan. Dalam puisi itu, ia memuji Quraisy dan Ansar atas Sunnah, kemurahan hati, dan kesucian yang disebutkan dalam wahyu dan keberanian. Ibn Hisham membacakan salah satu ayat dari Abu Zayd dalam riwayat lain, dan para ulama menyebutkan bahwa itu adalah puisi dalam empat belas bait."
