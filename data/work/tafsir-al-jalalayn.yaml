structure: "Two parts in one sequence: al-Suyuti's completion (al-Baqara to al-Isra') and al-Mahalli's original part (al-Kahf to al-Nas, then al-Fatiha). Printings either follow the Mushaf order or, as in the 1278 AH lithograph, put al-Fatiha at the end with al-Mahalli's part."
