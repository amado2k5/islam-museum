label: { ar: "تفسير الجلالين", en: "Tafsir al-Jalalayn", ur: "تفسیر الجلالین" }
summary:
  ar: "تفسير موجز للقرآن كله اشترك فيه جلالان: جلال الدين المحلي ⁦(ت 864هـ)⁩ فسّر من الكهف إلى الناس ثم الفاتحة، ومات قبل أن يتمه؛ فأكمله جلال الدين السيوطي من أول البقرة إلى آخر الإسراء على نمطه، بين مستهل رمضان وعاشر شوال سنة 870هـ. يقوم على ذكر ما يُفهم به كلام الله، والاعتماد على أرجح الأقوال، وإعراب ما يحتاج إليه، والتنبيه على القراءات المشهورة، بعبارة وجيزة."
  en: "A concise commentary on the whole Qur'an by two men called Jalal al-Din: al-Mahalli (d. 864 AH) explained al-Kahf to al-Nas and then al-Fatiha and died before finishing; al-Suyuti completed it in his manner, from the start of al-Baqara to the end of al-Isra', between 1 Ramadan and 10 Shawwal 870 AH. It gives what is needed to understand the text, relies on the most preponderant opinion, parses only where needed and notes the well-known readings, in brief wording."
  ur: "پورے قرآن کی ایک مختصر تفسیر جس میں دو جلال الدین شریک ہیں: جلال الدین محلی (م 864ھ) نے سورۂ کہف سے سورۂ ناس تک اور پھر سورۂ فاتحہ کی تفسیر کی اور اسے مکمل کرنے سے پہلے وفات پا گئے؛ جلال الدین سیوطی نے ان کے طرز پر سورۂ بقرہ کے آغاز سے سورۂ اسرا کے آخر تک اسے یکم رمضان سے دس شوال 870ھ کے درمیان مکمل کیا۔ اس میں کلامِ الٰہی کے فہم کے لیے ضروری بات، راجح ترین قول پر اعتماد، ضرورت کی حد تک اعراب اور مشہور قراءتوں پر تنبیہ، مختصر عبارت میں ہے۔"
