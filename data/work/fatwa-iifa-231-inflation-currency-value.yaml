label: { ar: "قرار مجمع الفقه الإسلامي الدولي 231 (24/2) بشأن التضخم وتغير قيمة العملة", en: "IIFA resolution 231 (24/2) on inflation and the change in currency value", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 231 (24/2): مہنگائی اور کرنسی کی قدر میں تبدیلی" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩. أكد المجمع قراره 42 ⁦(5/4)⁩ الصادر في دورته الخامسة ورأى أنه يطبق في حالة عدم التضخم وفي حالة التضخم اليسير؛ وأن التضخم الفاحش يرجع في تقديره إلى التراضي، وعند انعدامه إلى القضاء أو التحكيم حسب الأحوال؛ وأنه عند حصول تضخم فاحش بعد نشوء الدين لا مانع من اتفاق الدائن والمدين عند السداد على رد الدين بالقيمة أو توزيع الضرر بين الطرفين صلحًا ويجوز إمضاؤه قضاء أو تحكيمًا، ولا يجوز الاتفاق على ذلك عند التعاقد. وأكد توصيته للحكومات الإسلامية الواردة في قراره 115 ⁦(12/9)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019). It reaffirmed its resolution 42 (5/4), issued at its fifth session, holding that it applies when there is no inflation and when inflation is slight; that severe inflation is assessed by mutual agreement, or, failing agreement, by a court or arbitration as the case requires; and that when severe inflation occurs after a debt arises, there is no objection to creditor and debtor agreeing at repayment to repay the debt by value or to distribute the loss between them by settlement, which may be confirmed by a court or arbitration — but such an agreement may not be made at the time of contracting. It reaffirmed its recommendation to Islamic governments in resolution 115 (12/9)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں۔ اکیڈمی نے پانچویں مجلس کی اپنی قرارداد 42 ⁦(5/4)⁩ کی تائید کی اور قرار دیا کہ وہ عدمِ مہنگائی اور ہلکی مہنگائی کی صورت میں لاگو ہے؛ شدید مہنگائی کا تعین باہمی اتفاق سے ہوگا اور اتفاق نہ ہو تو عدالت یا ثالثی سے، حالات کے مطابق؛ اور جب قرض کے قیام کے بعد شدید مہنگائی ہو تو ادائیگی کے وقت دیندار و مقروض اس پر اتفاق کرسکتے ہیں کہ قرض قدر کے حساب سے لوٹایا جائے یا نقصان دونوں میں صلحاً بانٹا جائے، جسے عدالت یا ثالثی بھی نافذ کرسکتی ہے — مگر معاہدے کے وقت ایسا اتفاق جائز نہیں۔ اس نے قرارداد 115 ⁦(12/9)⁩ میں اسلامی حکومتوں کے لیے اپنی سفارش کی تائید کی۔"
