id: work/fatwa-dar-alifta-eg-making-up-ashura-fast
class: work
kind: fatwa
label: { ar: "حكم قضاء صيام يوم عاشوراء", en: "Making up the 'Ashura fast", ur: "عاشورہ کے روزے کی قضاء", es: "Reuniendo el 'Ashura rápido'" }
summary:
  ar: "سائل سأل عن قضاء صيام يوم عاشوراء لمن فاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21982)⁩ أن صيام عاشوراء مستحب شرعًا وهو من النفل الراتب الذي يشرع قضاؤه ويستحب للمعتاد عليه الذي فاته أن يقضيه على ما فصّل الجواب."
  en: "A questioner asked about making up the 'Ashura fast for one who missed it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21982) answered that fasting 'Ashura is recommended and is a regular voluntary devotion whose make-up is prescribed; it is recommended for one accustomed to it who missed it to make it up, as the answer details."
  ur: "ایک سائل نے عاشورہ کا روزہ رہ جانے پر اس کی قضاء کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21982)⁩ نے جواب دیا کہ عاشورہ کا روزہ مستحب اور معمول کا نفل ہے جس کی قضاء مشروع ہے؛ جس کے رہ گیا وہ اس کی قضاء کر لے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de recuperar el ayuno de Ashura si lo había omitido. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21982) respondió que el ayuno de Ashura es recomendable y constituye una devoción voluntaria y regular cuya recuperación está prescrita; se recomienda a quien esté acostumbrado a él y lo haya omitido que lo recupere, como se detalla en la respuesta."
