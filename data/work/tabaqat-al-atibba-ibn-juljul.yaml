label:
  ar: "طبقات الأطباء والحكماء"
  en: "Classes of Physicians and Wise Men"
  ur: "طبقات الاطباء و الحکماء"
  es: "Clases de médicos y sabios"
  fr: "Catégories de médecins et de sages"
summary:
  ar: "مقالة ابن جلجل القرطبي ⁦(ت 394هـ؟/نحو 994م)⁩ في تراجم الأطباء والحكماء، ألّفها نحو سنة 377هـ/987م؛ أقدم معجم باقٍ لتراجم الأطباء في التراث الإسلامي، يرتبهم من أطباء اليونان إلى أطباء الأندلس المعاصرين له، ويعتمد قسمه القديم على تاريخ إسحاق بن حنين {cite:encyclopaedia-of-islam-2}."
  en: "Ibn Juljul of Cordoba's ⁦(d. c. 384 AH/994 CE?)⁩ treatise on the generations of physicians and sages, composed about 377 AH/987 CE; the earliest surviving biographical dictionary of physicians in the Islamic tradition, arranging them from the Greek physicians to his Andalusi contemporaries, with its ancient section dependent on Ishaq ibn Hunayn's history {cite:encyclopaedia-of-islam-2}."
  ur: "ابن جلجل قرطبی ⁦(و. تقریباً 384ھ/994ء؟)⁩ کی اطباء و حکماء کی طبقات پر مقالہ، تقریباً 377ھ/987ء میں تصنیف شدہ؛ اسلامی روایت میں اطباء کی تراجم کا قدیم ترین باقی ماندہ معجم، جس میں یونانی اطباء سے عہدِ مصنف کے اندلسی اطباء تک مرتب ہیں؛ قدیم حصہ اسحاق بن حنین کی تاریخ پر مبنی ہے {cite:encyclopaedia-of-islam-2}۔"
  es: "Tratado de Ibn Juljul de Córdoba (¿384 AH/994 d. C.?) sobre las generaciones de médicos y sabios, compuesto alrededor del 377 AH/987 d. C.; el diccionario biográfico de médicos más antiguo que se conserva en la tradición islámica, que los ordena desde los médicos griegos hasta sus contemporáneos andalusíes, con su sección antigua basada en la historia de Ishaq ibn Hunayn {cite:encyclopaedia-of-islam-2}."
  fr: "Le traité d'Ibn Juljul de Cordoue (mort vers 384 AH/994 CE ?) sur les générations de médecins et de sages, composé vers 377 AH/987 CE; le plus ancien dictionnaire biographique de médecins de la tradition islamique qui nous soit parvenu, les classant des médecins grecs à ses contemporains andalous, sa section ancienne étant basée sur l'histoire d'Ishaq ibn Hunayn {cite:encyclopaedia-of-islam-2}."
