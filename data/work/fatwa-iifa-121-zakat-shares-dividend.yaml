label: { ar: "قرار مجمع الفقه الإسلامي الدولي 121 (13/3) بشأن زكاة الأسهم المقتناة بغرض الاستفادة من ريعها", en: "IIFA resolution 121 (13/3) on zakat on shares held to benefit from their dividends", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 121 (13/3): صرف منافع کے حصول کی نیت سے رکھی گئی شیئرز کی زکوٰۃ", es: "Resolución 121 (13/3) de la IIFA sobre el zakat en acciones mantenidas para beneficiarse de sus dividendos.", fr: "Résolution 121 (13/3) de l'IIFA relative à la zakat sur les actions détenues pour bénéficier de leurs dividendes", tr: "Gelirlerinden yararlanmak amacıyla edinilen hisselere zekat verilmesine ilişkin Uluslararası İslami Fiqh Akademisi Kararı 121 (13/3)", id: "Keputusan Akademi Fiqh Islam Internasional 121 (13/3) mengenai zakat atas saham yang diperoleh untuk tujuan memperoleh hasil dari hasilnya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩، استكمالًا لقراره 28 ⁦(4/3)⁩ بشأن زكاة الأسهم في الشركات الذي نص على أن المساهم إن لم تزك الشركة أموالها وجب عليه زكاة ما يخص أسهمه إن أمكن معرفته من حساباتها، وإلا فإن كان مساهمًا بقصد الاستفادة من الريع لا التجارة زكاها زكاة المستغلات ⁦(لا زكاة في أصل السهم وإنما في الريع بعد الحول)⁩. ثم قرر تفصيل أحكام زكاة الأسهم المقتناة لغرض الريع وحسابها وضوابطها في ضوء ذلك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001), completing its resolution 28 (4/3) on zakat on company shares, which provided that where the company has not paid zakat, the shareholder must pay zakat attributable to his shares if he can work it out from the company's accounts; otherwise, if he holds shares to benefit from the annual yield rather than to trade, he pays zakat on them as income-yielding assets — no zakat on the share principal, only on the yield after a year. It then set out the detailed rulings for computing zakat on shares held for their dividend and its controls in that light."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں، اپنی قرارداد 28 ⁦(4/3)⁩ برائے کمپنی شیئرز کی زکوٰۃ کے تتمہ کے طور پر — جس میں تھا کہ اگر کمپنی نے اپنے مال کی زکوٰۃ نہ ادا کی ہو تو حصہ دار اپنے حصے کی زکوٰۃ ادا کرے گا اگر کمپنی کے حسابات سے معلوم کر سکے؛ ورنہ اگر حصے صرف سالانہ منافع کے لیے رکھی گئی ہوں نہ کہ تجارت کے لیے تو وہ مستغلات کے حساب سے زکوٰۃ دے گا — اصل حصے پر زکوٰۃ نہیں، صرف سال ہونے کے بعد منافع پر۔ پھر اسی روشنی میں ریع کے لیے رکھی گئی شیئرز کی زکوٰۃ کے تفصیلی احکام اور حساب کے ضوابط۔"
  es: "Una resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 13.ª sesión en Kuwait (del 7 al 12 de Shawwal de 1422, del 22 al 27 de diciembre de 2001), que completa su resolución 28 (4/3) sobre el zakat en acciones de empresas, dispuso que cuando la empresa no haya pagado el zakat, el accionista debe pagar el zakat correspondiente a sus acciones si puede calcularlo a partir de las cuentas de la empresa; de lo contrario, si posee acciones para beneficiarse del rendimiento anual en lugar de para negociar, paga el zakat sobre ellas como activos generadores de ingresos, sin zakat sobre el capital de las acciones, solo sobre el rendimiento después de un año. Luego, estableció las normas detalladas para calcular el zakat en acciones mantenidas por sus dividendos y sus controles en ese sentido."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 13e session au Koweït (7-12 Shawwal 1422, 22-27 décembre 2001), a complété sa résolution 28 (4/3) relative à la zakat sur les actions de sociétés. Cette résolution stipule que lorsque la société n'a pas versé la zakat, l'actionnaire doit s'acquitter de la zakat due sur ses actions s'il peut la calculer à partir des comptes de la société. En revanche, s'il détient des actions pour bénéficier du rendement annuel plutôt que pour les spéculer, il est redevable de la zakat sur celles-ci en tant qu'actifs productifs de revenus – la zakat ne s'applique pas au capital de l'action, mais uniquement au rendement après un an. La résolution a ensuite énoncé les règles détaillées de calcul de la zakat sur les actions détenues pour leurs dividendes et les dispositions applicables en la matière."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt'teki on üçüncü oturumunda (7–12 Şevval 1422 H, 22–27 Aralık 2001) toplu kararı, şirket hisselerine ilişkin zekatla ilgili 28 (4/3) sayılı kararını sürdürür; bu karar, bir hissedar şirketin fonlarından zekat ödemezse, hesaplarından biliniyorsa payları için zekat ödemesi gerektiğini belirtir; aksi takdirde, eğer pay sahibi ticari değil, kira avantajı sağlamak amacıyla olan hissedarsa, işletilen mallar üzerinde (ana hisse için değil, bir yıl sonra kira üzerine zekat) zekat ödemek amacıyla yapılır. Daha sonra, kira amacıyla edinilen paylar üzerindeki zekatın kararlarını ayrıntılı olarak hesaplamaya ve düzenlemelerine göre bu doğrultuda karar vermiştir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi ketiga belas di Kuwait (7–12 Shawwal 1422 AH, 22–27 Desember 2001), melanjutkan Keputusan 28 (4/3) mengenai zakat atas saham perusahaan, yang menetapkan bahwa jika pemegang saham tidak membayar zakat atas dana perusahaan, maka ia harus membayar zakat atas sahamnya jika diketahui dari laporan keuangan; jika tidak, jika ia adalah pemegang saham dengan niat memperoleh manfaat dari sewa, bukan perdagangan, zakat atas barang eksploitasi (bukan zakat atas saham utama, tetapi sewa setelah satu tahun). Ia kemudian memutuskan untuk merinci putusan tentang zakat atas saham yang diperoleh untuk tujuan sewa, menghitungnya, dan peraturannya berdasarkan hal ini."
