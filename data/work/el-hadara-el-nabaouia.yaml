issue:
  ar: "هل تُقرأ أحاديث النبي بالحقائق العلمية الحديثة، وهل يصح أن يُسمّى ذلك إعجازًا، وهل تصلح الحقيقة العلمية للحكم على صحة الحديث؟"
  en: "Should the Prophet's hadith be read through modern scientific findings, may that be called a miracle, and can a scientific finding serve to judge a hadith's soundness?"
  ur: "کیا نبی کی احادیث کو جدید سائنسی حقائق کی روشنی میں پڑھا جائے، کیا اسے اعجاز کہنا درست ہے، اور کیا سائنسی حقیقت حدیث کی صحت پر حکم لگانے کا ذریعہ بن سکتی ہے؟"
