id: work/el-hadara-el-nabaouia
class: work
kind: lecture-series
label:
  ar: "الحضارة النبوية (سلسلة دروس)"
  en: "Al-Hadara al-Nabawiyya: 'The Prophetic Civilisation' (lesson series)"
  ur: "الحضارة النبوية: «نبوی تہذیب» (دروس کا سلسلہ)"
summary:
  ar: "سلسلة من ثلاثين حلقة صوتية لزغلول النجار في أرشيف أسابيل، يعرض فيها ضوابط الإعجاز العلمي في السنة النبوية ومبرراته، ثم يشرح أحاديث في الأرض والبحر والقمر والكسوف والأهلة والطب والطعام والنوم والمطر والرضاعة والوراثة والسواك وعجب الذنب والمفاصل والتمر وعلامات الساعة، في ضوء ما يراه من حقائق العلم، وكل ذلك قوله هو."
  en: "A series of thirty audio episodes by Zaghloul El-Naggar on the Assabile archive, in which he sets out the rules and reasons for the 'scientific miracle' in the Prophet's Sunna, then explains hadith on the earth, the sea, the moon, eclipses, the new moons, medicine, food, sleep, rain, suckling, heredity, the tooth-stick, the tailbone, the joints, dates and the signs of the Hour in the light of what he takes to be scientific fact; all of it is his own account."
  ur: "اسابیل آرکائیو میں زغلول النجار کی تیس آڈیو اقساط کا سلسلہ، جس میں وہ سنت نبوی میں «سائنسی اعجاز» کے ضوابط اور اسباب بیان کرتے ہیں، پھر زمین، سمندر، چاند، گرہن، ہلال، طب، کھانے، نیند، بارش، رضاعت، وراثت، مسواک، عجب الذنب، جوڑوں، کھجور اور قیامت کی نشانیوں سے متعلق احادیث کی اس کی روشنی میں شرح کرتے ہیں جسے وہ سائنسی حقیقت سمجھتے ہیں؛ یہ سب ان کا اپنا بیان ہے۔"
