label:
  ar: "إعجاز القرآن"
  en: "I'jaz al-Qur'an (al-Baqillani)"
  ur: "اعجاز قرآن ⁦(باقلانی)⁩"
  es: "I'jaz al-Qur'an (al-Baqillani)"
  fr: "I'jaz al-Coran (al-Baqillani)"
  tr: "Kur'an'ın Mucizevliği"
  id: "Keajaiban Al-Qur'an"
summary:
  ar: "كتاب «إعجاز القرآن» للقاضي أبي بكر الباقلاني يُعد من الكتب الأصلية في بابه، طُبع مراراً وصار مرجعاً كلاسيكياً في موضوع الإعجاز؛ وهو واحد من ستة كتب باقية للباقلاني من أصل اثنين وخمسين أثراً أحصاها القاضي عياض {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  en: "Al-Baqillani's I'jaz al-Qur'an, printed several times, is regarded as a classic work on the subject of the Qur'an's inimitability; it is one of only six extant works out of the fifty-two titles that the qadi Iyad listed for him {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  ur: "باقلانی کی «اعجاز قرآن» بار بار چھپ چکی اور اعجاز کے موضوع پر کلاسیکی مرجع شمار ہوتی ہے؛ قاضی عیاض نے ان کی باواں تصانیف گنوائیں جن میں سے صرف چھ باقی ہیں، یہ ان میں سے ایک ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}۔"
  es: "El I'jaz al-Qur'an de Al-Baqillani, impreso varias veces, es considerado una obra clásica sobre el tema de la inimitable naturaleza del Corán; es una de las seis únicas obras existentes de los cincuenta y dos títulos que el cadí Iyad enumeró para él {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  fr: "L'ouvrage I'jaz al-Qur'an d'Al-Baqillani, imprimé à plusieurs reprises, est considéré comme un classique sur le sujet de l'inimitabilité du Coran; c'est l'un des six seuls ouvrages existants sur les cinquante-deux titres que le cadi Iyad a répertoriés pour lui {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  tr: "Hakim Ebu Bekir el-Baqillani'nin \"Kur'an'ın Mucizevi Doğası\" adlı kitabı, alanında özgün eserlerden biri olarak kabul edilir, birçok kez basılmış ve mucizeler konusunda klasik bir referans haline gelmiştir; el-Baqillani'nin el-Baqillani'nin elli iki eserinden günümüze ulaşan altı kitabından biridir {atıf:İslam Ansiklopedisi-2 cilt 1, s. 1018}."
  id: "Buku \"The Miraculous Nature of the Qur'an\" karya Hakim Abu Bakr al-Baqillani dianggap sebagai salah satu karya asli di bidangnya, dicetak beberapa kali dan menjadi referensi klasik tentang mukjizat; ini adalah salah satu dari enam buku al-Baqillani yang masih ada dari lima puluh dua karya yang disebutkan oleh Hakim Iyad {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 1018}."
