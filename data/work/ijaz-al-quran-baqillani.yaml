summary:
  ar: "كتاب «إعجاز القرآن» للقاضي أبي بكر الباقلاني يُعد من الكتب الأصلية في بابه، طُبع مراراً وصار مرجعاً كلاسيكياً في موضوع الإعجاز؛ وهو واحد من ستة كتب باقية للباقلاني من أصل اثنين وخمسين أثراً أحصاها القاضي عياض {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  en: "Al-Baqillani's I'jaz al-Qur'an, printed several times, is regarded as a classic work on the subject of the Qur'an's inimitability; it is one of only six extant works out of the fifty-two titles that the qadi Iyad listed for him {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  ur: "باقلانی کی «اعجاز قرآن» بار بار چھپ چکی اور اعجاز کے موضوع پر کلاسیکی مرجع شمار ہوتی ہے؛ قاضی عیاض نے ان کی باواں تصانیف گنوائیں جن میں سے صرف چھ باقی ہیں، یہ ان میں سے ایک ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}۔"
