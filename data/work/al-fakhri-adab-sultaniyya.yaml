summary:
  ar: "تاريخ ابن الطقطقي الذي ألّفه بالموصل سنة ٧٠١هـ لفخر الدين عيسى بن إبراهيم؛ يجمع مرشداً موجزاً للملوك ثم تراجم الخلفاء إلى المستعصم يعقب كل منها تراجم وزرائه، ونقله هندوشاه بن سنجر إلى الفارسية سنة ٧٢٣–٧٢٤هـ بعنوان «تجارب السلف» {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  en: "Ibn al-Tiqtaqa's history, composed at Mosul in 701/1302 for Fakhr al-Din Isa ibn Ibrahim: a brief Furstenspiegel followed by lives of the caliphs down to al-Musta'sim, each with the lives of that caliph's viziers; Hindushah ibn Sanjar turned it into Persian in 723-4/1323-4 as Tajarib al-salaf {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  ur: "ابن طقطقی کی تاریخ جو موصل میں 701ھ/1302ء میں فخر الدین عیسیٰ بن ابراہیم کے لیے لکھی گئی: مختصر مرشد الملوک، پھر مستعصم تک خلفاء کی تراجم مع ان کے وزراء کی تراجم؛ ہندوشاہ بن سنجر نے 723-4ھ/1323-4ء میں اسے «تجارب السلف» کے نام سے فارسی میں منتقل کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}۔"
