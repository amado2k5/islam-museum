summary:
  ar: "تاريخ ابن الطقطقي الذي ألّفه بالموصل سنة ٧٠١هـ لفخر الدين عيسى بن إبراهيم؛ يجمع مرشداً موجزاً للملوك ثم تراجم الخلفاء إلى المستعصم يعقب كل منها تراجم وزرائه، ونقله هندوشاه بن سنجر إلى الفارسية سنة ٧٢٣–٧٢٤هـ بعنوان «تجارب السلف» {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  en: "Ibn al-Tiqtaqa's history, composed at Mosul in 701/1302 for Fakhr al-Din Isa ibn Ibrahim: a brief Furstenspiegel followed by lives of the caliphs down to al-Musta'sim, each with the lives of that caliph's viziers; Hindushah ibn Sanjar turned it into Persian in 723-4/1323-4 as Tajarib al-salaf {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  ur: "ابن طقطقی کی تاریخ جو موصل میں 701ھ/1302ء میں فخر الدین عیسیٰ بن ابراہیم کے لیے لکھی گئی: مختصر مرشد الملوک، پھر مستعصم تک خلفاء کی تراجم مع ان کے وزراء کی تراجم؛ ہندوشاہ بن سنجر نے 723-4ھ/1323-4ء میں اسے «تجارب السلف» کے نام سے فارسی میں منتقل کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}۔"
  es: "Historia de Ibn al-Tiqtaqa, compuesta en Mosul en 701/1302 para Fakhr al-Din Isa ibn Ibrahim: un breve Furstenspiegel seguido de vidas de los califas hasta al-Musta'sim, cada una con las vidas de los visires de ese califa; Hindushah ibn Sanjar la tradujo al persa en 723-4/1323-4 como Tajarib al-salaf {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  fr: "L'histoire d'Ibn al-Tiqtaqa, composée à Mossoul en 701/1302 pour Fakhr al-Din Isa ibn Ibrahim: un bref Furstenspiegel suivi des vies des califes jusqu'à al-Musta'sim, chacune avec les vies des vizirs de ce calife; Hindushah ibn Sanjar l'a traduite en persan en 723-4/1323-4 sous le titre de Tajarib al-salaf {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  tr: "701 Hicri yılında Musul'da Fakhr al-Din İsa ibn İbrahim tarafından yazılan İbn el-Taktaqi'nin Tarihi, krallar hakkında kısa bir rehber, ardından el-Mustasim'e kadar halifelerin biyografilerini ve ardından bakanlarının biyografilerini derler. 723–724 Hicri yıllarında Hinduşah bin Sancar tarafından Farsçaya \"Tajarab al-Salaf\" başlığıyla çevrilmiştir {cite:Encyclopaedia-of-Islam-2 cilt 3, s. 988}."
  id: "Sejarah Ibn al-Taqtaqi, yang ditulis di Mosul pada tahun 701 H oleh Fakhr al-Din Isa ibn Ibrahim, menyusun panduan singkat tentang raja, kemudian biografi khalifah untuk al-Musta'sim, masing-masing diikuti oleh biografi para menterinya. Buku ini diterjemahkan oleh Hindushah ibn Sanjar ke dalam bahasa Persia pada tahun 723–724 H dengan judul \"Tajarab al-Salaf\" {cite:Encyclopaedia-of-Islam-2 vol. 3, hlm. 988}."
