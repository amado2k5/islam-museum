id: work/fatwa-dar-alifta-eg-wedding-feast
class: work
kind: fatwa
label: { ar: "حكم عمل وليمة الزواج", en: "The wedding feast", ur: "شادی کا ولیمہ", es: "El banquete de bodas", fr: "Le festin de noces" }
summary:
  ar: "سائل سأل عن حكم عمل وليمة الزواج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22403)⁩ أن وليمة الزواج سنة في أصلها ومندرجة تحت إطعام الطعام المندوب إليه شرعًا مع مراعاة عدم الإسراف والتبذير، على ما فصّل الجواب."
  en: "A questioner asked about the wedding feast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22403) answered that the wedding walima is a sunna in origin and falls under the recommended feeding of food in the sharia, observing avoidance of extravagance and waste, as the answer details."
  ur: "ایک سائل نے شادی کے ولیمے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22403)⁩ نے جواب دیا کہ ولیمۂ عروس اصولاً سنت ہے اور شریعت کے مستحب کھانا کھلانے میں داخل ہے، بشرطیکہ اسراف اور فضول خرچی نہ ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre el banquete de bodas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22403) respondió que la walima nupcial es de origen sunna y se encuentra dentro de las recomendaciones de la sharia sobre la distribución de alimentos, evitando la extravagancia y el derroche, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le festin de mariage. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22403) a répondu que la walima de mariage est une sunna et relève des recommandations alimentaires de la charia, tout en préconisant d'éviter le gaspillage et l'extravagance, comme le précise la réponse."
