label: { ar: "حكم إخراج زكاة الفطر لأسر المتوفين في غزة", en: "Paying zakat al-fitr to bereaved families in Gaza", ur: "غزہ میں فوت شدہ افراد کے خاندانوں کو زکات الفطر دینا", es: "Pago del zakat al-fitr a las familias en duelo en Gaza", fr: "Versement de la zakat al-fitr aux familles endeuillées à Gaza", tr: "Gazze'de ölenlerin ailelerine Zekat el-Fitr ödenmesine ilişkin karar", id: "Putusan tentang pembayaran Zakat al-Fitr kepada keluarga almarhum di Gaza" }
summary:
  ar: "سائل سأل عن إخراج زكاة الفطر لأسر المتوفين في غزة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21786)⁩ أن الزكاة شرعت أصالة لبناء الإنسان وسد حاجاته فإذا تعلق الأمر باستبقاء المهج واستقامة الحياة فمصارفها تتسع على ما فصّل الجواب من ضوابط."
  en: "A questioner asked about paying zakat al-fitr to families bereaved in Gaza. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21786) answered that zakat was instituted originally to build the human being and meet needs; where preserving life itself is at stake, its channels widen — as the answer details with its controls."
  ur: "ایک سائل نے غزہ میں فوت شدہ افراد کے خاندانوں کو زکات الفطر دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21786)⁩ نے جواب دیا کہ زکات اصل میں انسان کی تکمیل اور ضروریات پوری کرنے کے لیے مقرر ہے؛ جب جان بچانے کا معاملہ ہو تو اس کے مصارف وسیع ہو جاتے ہیں — جیسا کہ جواب میں ضوابط کے ساتھ بیان ہوا۔"
  es: "Un interlocutor preguntó sobre el pago del zakat al-fitr a las familias en duelo en Gaza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21786) respondió que el zakat se instituyó originalmente para el desarrollo humano y para satisfacer necesidades; cuando la preservación de la vida misma está en juego, sus mecanismos se amplían, como se detalla en la respuesta con sus respectivos controles."
  fr: "Un internaute a posé une question concernant le versement de la zakat al-fitr aux familles endeuillées à Gaza. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21786) a répondu que la zakat avait été instituée à l'origine pour l'édification de l'être humain et la satisfaction de ses besoins; lorsque la préservation de la vie elle-même est en jeu, son champ d'application s'élargit, comme le précise la réponse, notamment en ce qui concerne les modalités d'application."
  tr: "Bir soru soran kişi, Gazze'deki vefat edenlerin ailelerine Zekat el-Fitr ödemesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21786), zekatın öncelikle bir kişinin yetiştirilmesi ve ihtiyaçlarını karşılamak için yasalaştırıldığını söyledi. Yaşam ve dürüst yaşam sürdürme söz konusu olduğunda, harcamaları ayrıntılı düzenlemelere göre geniştir."
  id: "Seorang penanya menanyakan tentang pembayaran Zakat al-Fitr untuk keluarga almarhum di Gaza. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21786) menjawab bahwa zakat terutama diatur untuk membangun seseorang dan memenuhi kebutuhannya. Dalam hal menjaga kehidupan dan kehidupan yang baik, pengeluarannya sangat luas sesuai dengan peraturan rinci."
