summary:
  ar: "سائل سأل عن إخراج زكاة الفطر لأسر المتوفين في غزة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21786)⁩ أن الزكاة شرعت أصالة لبناء الإنسان وسد حاجاته فإذا تعلق الأمر باستبقاء المهج واستقامة الحياة فمصارفها تتسع على ما فصّل الجواب من ضوابط."
  en: "A questioner asked about paying zakat al-fitr to families bereaved in Gaza. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21786) answered that zakat was instituted originally to build the human being and meet needs; where preserving life itself is at stake, its channels widen — as the answer details with its controls."
  ur: "ایک سائل نے غزہ میں فوت شدہ افراد کے خاندانوں کو زکات الفطر دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21786)⁩ نے جواب دیا کہ زکات اصل میں انسان کی تکمیل اور ضروریات پوری کرنے کے لیے مقرر ہے؛ جب جان بچانے کا معاملہ ہو تو اس کے مصارف وسیع ہو جاتے ہیں — جیسا کہ جواب میں ضوابط کے ساتھ بیان ہوا۔"
  es: "Un interlocutor preguntó sobre el pago del zakat al-fitr a las familias en duelo en Gaza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21786) respondió que el zakat se instituyó originalmente para el desarrollo humano y para satisfacer necesidades; cuando la preservación de la vida misma está en juego, sus mecanismos se amplían, como se detalla en la respuesta con sus respectivos controles."
