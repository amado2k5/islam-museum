label: { ar: "قرار مجمع الفقه الإسلامي الدولي 115 (12/9) بشأن التضخم وتغير قيمة العملة", en: "IIFA resolution 115 (12/9) on inflation and changes in currency value", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 115 (12/9): افراطِ زر اور کرنسی کی قدر میں تبدیلی", es: "Resolución 115 (12/9) de la IIFA sobre inflación y variaciones del valor de la moneda." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد اطلاعه على البيان الختامي للندوة الفقهية الاقتصادية لدراسة قضايا التضخم ⁦(حلقاتها الثلاث بجدة وكوالالمبور والمنامة)⁩. أكد العمل بقراره 42 ⁦(5/4)⁩: العبرة في وفاء الديون الثابتة بعملة ما هي بالمثل لا بالقيمة، لأن الديون تقضى بأمثالها ولا يجوز ربطها بمستوى الأسعار. وأجاز التحوط عند التعاقد ضد تضخم متوقع بإجراء الدين بغير العملة المتوقع هبوطها: بالذهب أو الفضة، أو سلعة مثلية، أو سلة سلع مثلية، أو عملة أخرى أكثر ثباتًا، أو سلة عملات — على أن يكون بدل الدين بمثل ما وقع به. ثم استكمل ضوابط المعالجة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after the final statement of the joint fiqh-economics seminar on inflation (three rounds in Jeddah, Kuala Lumpur and Manama). It reaffirmed resolution 42 (5/4): debts fixed in a currency are repaid in kind, not in value — debts are settled by their like and may not be indexed to price levels. And it permitted hedging at contracting against expected inflation by denominating the debt in something other than the currency expected to fall: gold or silver, a fungible commodity, a basket of fungible commodities, another more stable currency, or a basket of currencies — provided the repayment equal what the debt was made in. It then completed the controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، افراطِ زر پر مشترکہ فقہی-اقتصادی سمینار ⁦(جدہ، کوالالمپور اور منامہ میں تین مراحل)⁩ کے حتمی بیان کے مطالعے کے بعد۔ اس نے قرارداد 42 ⁦(5/4)⁩ کی تاکید کی: کسی کرنسی میں مقررہ قرض کی ادائیگی اس کے مثل سے ہوتی ہے قدر سے نہیں — قرض اپنے مثل سے ادا ہوتے ہیں اور انہیں قیمتوں کی سطح سے جوڑنا جائز نہیں۔ اور متوقع افراطِ زر سے تحفظ کے لیے عقد کے وقت قرض کو گرتے متوقع کرنسی کے بجائے درج ذیل میں رکھنے کی اجازت دی: سونا یا چاندی؛ قیاسی مال؛ قیاسی اشیاء کی ٹوکری؛ زیادہ مستحکم کرنسی؛ یا کرنسیوں کی ٹوکری — بشرطیکہ ادائیگی اسی میں ہو جس میں قرض لگا تھا۔ پھر باقی ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), tras la declaración final del seminario conjunto de jurisprudencia y economía sobre la inflación (tres rondas en Yeda, Kuala Lumpur y Manama). Reafirmó la resolución 42 (5/4): las deudas fijadas en una moneda se reembolsan en especie, no en valor; las deudas se liquidan por su equivalente y no pueden indexarse a los niveles de precios. Y permitió la cobertura al contratar contra la inflación esperada denominando la deuda en algo distinto de la moneda que se esperaba que cayera: oro o plata, una materia prima fungible, una cesta de materias primas fungibles, otra moneda más estable o una cesta de monedas, siempre que el reembolso fuera igual a la moneda en la que se realizó la deuda. Luego completó los controles."
