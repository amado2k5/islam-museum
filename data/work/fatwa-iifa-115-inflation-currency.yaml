label: { ar: "قرار مجمع الفقه الإسلامي الدولي 115 (12/9) بشأن التضخم وتغير قيمة العملة", en: "IIFA resolution 115 (12/9) on inflation and changes in currency value", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 115 (12/9): افراطِ زر اور کرنسی کی قدر میں تبدیلی", es: "Resolución 115 (12/9) de la IIFA sobre inflación y variaciones del valor de la moneda.", fr: "Résolution 115 (12/9) de l'IIFA sur l'inflation et les variations de la valeur monétaire", tr: "Enflasyon ve döviz değeri değişiklikleri ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 115 (12/9)", id: "Resolusi Akademi Fiqh Islam Internasional 115 (12/9) mengenai inflasi dan perubahan nilai mata uang" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد اطلاعه على البيان الختامي للندوة الفقهية الاقتصادية لدراسة قضايا التضخم ⁦(حلقاتها الثلاث بجدة وكوالالمبور والمنامة)⁩. أكد العمل بقراره 42 ⁦(5/4)⁩: العبرة في وفاء الديون الثابتة بعملة ما هي بالمثل لا بالقيمة، لأن الديون تقضى بأمثالها ولا يجوز ربطها بمستوى الأسعار. وأجاز التحوط عند التعاقد ضد تضخم متوقع بإجراء الدين بغير العملة المتوقع هبوطها: بالذهب أو الفضة، أو سلعة مثلية، أو سلة سلع مثلية، أو عملة أخرى أكثر ثباتًا، أو سلة عملات — على أن يكون بدل الدين بمثل ما وقع به. ثم استكمل ضوابط المعالجة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after the final statement of the joint fiqh-economics seminar on inflation (three rounds in Jeddah, Kuala Lumpur and Manama). It reaffirmed resolution 42 (5/4): debts fixed in a currency are repaid in kind, not in value — debts are settled by their like and may not be indexed to price levels. And it permitted hedging at contracting against expected inflation by denominating the debt in something other than the currency expected to fall: gold or silver, a fungible commodity, a basket of fungible commodities, another more stable currency, or a basket of currencies — provided the repayment equal what the debt was made in. It then completed the controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، افراطِ زر پر مشترکہ فقہی-اقتصادی سمینار ⁦(جدہ، کوالالمپور اور منامہ میں تین مراحل)⁩ کے حتمی بیان کے مطالعے کے بعد۔ اس نے قرارداد 42 ⁦(5/4)⁩ کی تاکید کی: کسی کرنسی میں مقررہ قرض کی ادائیگی اس کے مثل سے ہوتی ہے قدر سے نہیں — قرض اپنے مثل سے ادا ہوتے ہیں اور انہیں قیمتوں کی سطح سے جوڑنا جائز نہیں۔ اور متوقع افراطِ زر سے تحفظ کے لیے عقد کے وقت قرض کو گرتے متوقع کرنسی کے بجائے درج ذیل میں رکھنے کی اجازت دی: سونا یا چاندی؛ قیاسی مال؛ قیاسی اشیاء کی ٹوکری؛ زیادہ مستحکم کرنسی؛ یا کرنسیوں کی ٹوکری — بشرطیکہ ادائیگی اسی میں ہو جس میں قرض لگا تھا۔ پھر باقی ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), tras la declaración final del seminario conjunto de jurisprudencia y economía sobre la inflación (tres rondas en Yeda, Kuala Lumpur y Manama). Reafirmó la resolución 42 (5/4): las deudas fijadas en una moneda se reembolsan en especie, no en valor; las deudas se liquidan por su equivalente y no pueden indexarse a los niveles de precios. Y permitió la cobertura al contratar contra la inflación esperada denominando la deuda en algo distinto de la moneda que se esperaba que cayera: oro o plata, una materia prima fungible, una cesta de materias primas fungibles, otra moneda más estable o una cesta de monedas, siempre que el reembolso fuera igual a la moneda en la que se realizó la deuda. Luego completó los controles."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), suite à la déclaration finale du séminaire conjoint de jurisprudence islamique et d'économie sur l'inflation (trois sessions à Djeddah, Kuala Lumpur et Manama), a réaffirmé la résolution 42 (5/4): les dettes libellées en monnaie sont remboursées en nature, et non en valeur; elles sont réglées par leur nature et ne peuvent être indexées sur les prix. Elle a autorisé la couverture contre l'inflation anticipée par le biais de contrats, en libellé la dette dans une autre devise que celle dont on prévoyait la dépréciation: or ou argent, matière première fongible, panier de matières premières fongibles, autre devise plus stable ou panier de devises, à condition que le remboursement soit équivalent à la devise de la dette. Elle a ensuite complété les mesures de contrôle."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Riyad'daki on ikinci oturumunda (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 Eylül 2000) toplu kararı, Enflasyon Konuları Ekonomik Fıkıh Sempozyumu'nun (Cidde, Kuala Lumpur ve Manama'daki üç oturumu) nihai bildirisi incelendikten sonra. 42 (5/4) sayılı Kararının uygulanmasını onayladı: Sabit borçların para biriminde tasfiyesinde anahtar değer değil, karşılıklılıktır, çünkü borçlar karşılıklılıkla kapatılır ve fiyat seviyelerine bağlanamaz. Beklenen enflasyona karşı küçülürken, beklenen düşüş dışında borç yaparak tedbirlere izin verdi: altın, gümüş, eşdeğer mallar, eşdeğer mallar sepetleri, daha istikrarlı başka bir para birimi veya para sepetleri — borç tazminatı gerçekleşenle eşdeğer olduğu sürece. Sonra işlem kontrollerini tamamlayın."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000), setelah meninjau pernyataan akhir Simposium Yurisprudensi Ekonomi tentang Isu Inflasi (tiga sesi di Jeddah, Kuala Lumpur, dan Manama). Keputusan ini menegaskan pelaksanaan Keputusan 42 (5/4): Kunci penyelesaian utang tetap dalam mata uang adalah timbal balik, bukan nilai, karena utang diselesaikan berdasarkan ekuivalen dan tidak dapat dikaitkan dengan tingkat harga. Keputusan ini memungkinkan tindakan pencegahan saat kontraksi terhadap inflasi yang diharapkan dengan melakukan utang dalam mata uang selain penurunan yang diharapkan: emas, perak, barang setara, keranjang barang setara, mata uang lain yang lebih stabil, atau keranjang mata uang — asalkan kompensasi utang setara dengan yang terjadi. Kemudian selesaikan kontrol pemrosesan."
