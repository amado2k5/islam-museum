label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن السندات", en: "IIFA resolution on bonds", ur: "اکیڈمی کی قرارداد: بانڈز", es: "Resolución de la IIFA sobre bonos", fr: "Résolution de l'IIFA sur les obligations", tr: "Uluslararası İslami Fiqh Akademisi'nin tahvillerle ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai ikatan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: السندات التي تمثل التزامًا بدفع مبلغها مع فائدة منسوبة إليه أو نفع مشروط محرمة شرعًا إصدارًا وشراءً وتداولًا لأنها قروض ربوية سواء كانت الجهة المصدرة خاصة أو عامة ترتبط بالدولة، ولا أثر لتسميتها شهادات أو صكوكًا استثمارية أو ادخارية على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on bonds: bonds representing a commitment to pay their amount with attributed interest or a conditional benefit are forbidden in issue, purchase and trading, being riba loans whether the issuer is private or state-linked; naming them certificates or investment or savings deeds changes nothing, as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ بانڈز پر: سود وابستہ بانڈ جاری کرنا، خریدنا اور فروخت کرنا حرام ہے — یہ ربوی قرض ہیں، نام بدلنے سے حکم نہیں بدلتا۔"
  es: "Resolución de la sexta sesión de la IIFA (Jeddah, marzo de 1990) sobre bonos: los bonos que representan un compromiso de pago de su importe con los intereses correspondientes o un beneficio condicional están prohibidos en su emisión, compra y negociación, ya que constituyen préstamos usurarios, independientemente de que el emisor sea privado o esté vinculado al Estado; denominarlos certificados, escrituras de inversión o de ahorro no cambia nada, como detalla la resolución."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les obligations: les obligations représentant un engagement à payer leur montant avec intérêts attribués ou un avantage conditionnel sont interdites d'émission, d'achat et de négociation, étant des prêts riba, que l'émetteur soit privé ou lié à l'État; les nommer certificats, titres d'investissement ou d'épargne ne change rien, comme le précise la résolution."
  tr: "Uluslararası İslami Fiqh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990): Faiz veya koşullu fayda ile birlikte ödeme yükümlülüğü olan tahviller, ihraççı kuruluş özel ya da kamu olsun, devlete bağlı olsun, faiz kredisi olduğu için ihraç edildiğinde, satın alınırken veya dolaşımda dini olarak yasaktır. Yatırım veya tasarruf sertifikası ya da sukuk olarak tanımlanmaları belirtildiği gibi bir etkiye sahip değildir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Obligasi yang merupakan kewajiban membayar jumlahnya dengan bunga yang diberikan atau manfaat bersyarat secara agama dilarang secara agama dalam penerbitan, pembelian, atau peredaran karena merupakan pinjaman riba, baik entitas penerbitnya swasta maupun publik, yang terkait dengan negara. Penunjukan sebagai sertifikat investasi atau tabungan atau sukuk tidak memiliki efek sebagaimana ditentukan."
