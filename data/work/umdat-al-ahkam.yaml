label:
  ar: "عمدة الأحكام"
  en: "Umdat al-Ahkam"
  ur: "عمدۃ الاحکام"
summary:
  ar: "كتاب عبد الغني المقدسي (ت 600هـ) «العمدة في الأحكام»، جمع فيه أحاديث الأحكام مما اتفق عليه البخاري ومسلم، في جزأين، وعدّه ابن رجب من تصانيفه بغير إسناد. {cite:dhayl-tabaqat-hanabila-faqi-v2 p.19} ألّفه بسؤال بعض إخوانه، ورتّبه على أبواب الفقه من الطهارة إلى العتق في 423 حديثاً في طبعة الفاريابي، ويسميه المصنف في قائمة كتبه «الأحكام الصغرى» تمييزاً له عن «الأحكام الكبرى»، وعليه أكثر من ثلاثين شرحاً. {cite:umdat-al-ahkam-faryabi-2002 p.39} {cite:umdat-al-ahkam-faryabi-2002 p.40} {cite:umdat-al-ahkam-faryabi-2002 p.244} {cite:umdat-al-ahkam-zuhayri-1419 p.17} {cite:umdat-al-ahkam-faryabi-2002 p.21} {cite:umdat-al-ahkam-faryabi-2002 p.22} {cite:umdat-al-ahkam-faryabi-2002 p.23}"
  en: "Abd al-Ghani al-Maqdisi's (d. 600 AH) al-Umda fi al-Ahkam, a collection of legal hadith on which al-Bukhari and Muslim agree, in two parts; Ibn Rajab lists it among his works compiled without chains of transmission. He wrote it at the request of a fellow scholar, arranged by the chapters of law from purity to manumission in 423 hadiths in al-Faryabi's edition; it is called 'the Smaller Rulings' (al-Ahkam al-Sughra) to distinguish it from 'the Larger Rulings', and has more than thirty commentaries."
  ur: "عبد الغنی مقدسی (م 600ھ) کی «العمدۃ فی الاحکام»، احکام کی ان احادیث کا مجموعہ جن پر بخاری اور مسلم متفق ہیں، دو جزوں میں؛ ابن رجب نے اسے ان کی بغیر سند والی تصانیف میں شمار کیا۔ انہوں نے یہ ایک رفیق کی فرمائش پر لکھی، فقہ کے ابواب پر طہارت سے عتق تک، فاریابی کے نسخے میں 423 احادیث؛ اسے «الاحکام الصغریٰ» بھی کہا جاتا ہے تاکہ «الاحکام الکبریٰ» سے ممتاز ہو، اور اس پر تیس سے زیادہ شروح ہیں۔"
