summary:
  ar: "كتاب عبد الغني المقدسي ⁦(ت 600هـ)⁩ «العمدة في الأحكام»، جمع فيه أحاديث الأحكام مما اتفق عليه البخاري ومسلم، في جزأين، وعدّه ابن رجب من تصانيفه بغير إسناد. {cite:dhayl-tabaqat-hanabila-faqi-v2 p.19} ألّفه بسؤال بعض إخوانه، ورتّبه على أبواب الفقه من الطهارة إلى العتق في 423 حديثاً في طبعة الفاريابي، ويسميه المصنف في قائمة كتبه «الأحكام الصغرى» تمييزاً له عن «الأحكام الكبرى»، وعليه أكثر من ثلاثين شرحاً. {cite:umdat-al-ahkam-faryabi-2002 p.39} {cite:umdat-al-ahkam-faryabi-2002 p.40} {cite:umdat-al-ahkam-faryabi-2002 p.244} {cite:umdat-al-ahkam-zuhayri-1419 p.17} {cite:umdat-al-ahkam-faryabi-2002 p.21} {cite:umdat-al-ahkam-faryabi-2002 p.22} {cite:umdat-al-ahkam-faryabi-2002 p.23}"
  en: "Abd al-Ghani al-Maqdisi's (d. 600 AH) al-Umda fi al-Ahkam, a collection of legal hadith on which al-Bukhari and Muslim agree, in two parts; Ibn Rajab lists it among his works compiled without chains of transmission. He wrote it at the request of a fellow scholar, arranged by the chapters of law from purity to manumission in 423 hadiths in al-Faryabi's edition; it is called 'the Smaller Rulings' (al-Ahkam al-Sughra) to distinguish it from 'the Larger Rulings', and has more than thirty commentaries."
  ur: "عبد الغنی مقدسی ⁦(م 600ھ)⁩ کی «العمدۃ فی الاحکام»، احکام کی ان احادیث کا مجموعہ جن پر بخاری اور مسلم متفق ہیں، دو جزوں میں؛ ابن رجب نے اسے ان کی بغیر سند والی تصانیف میں شمار کیا۔ انہوں نے یہ ایک رفیق کی فرمائش پر لکھی، فقہ کے ابواب پر طہارت سے عتق تک، فاریابی کے نسخے میں 423 احادیث؛ اسے «الاحکام الصغریٰ» بھی کہا جاتا ہے تاکہ «الاحکام الکبریٰ» سے ممتاز ہو، اور اس پر تیس سے زیادہ شروح ہیں۔"
  es: "La obra de Abd al-Ghani al-Maqdisi (fallecido en el año 600 de la Hégira), al-Umda fi al-Ahkam, es una recopilación de hadices jurídicos en la que coinciden al-Bujari y Muslim, dividida en dos partes. Ibn Rajab la incluye entre sus obras compiladas sin cadenas de transmisión. La escribió a petición de un colega erudito, y en la edición de al-Faryabi, los 423 hadices están ordenados por capítulos de la ley, desde la pureza hasta la manumisión. Se la conoce como «las Reglas Menores» (al-Ahkam al-Sughra) para distinguirla de «las Reglas Mayores», y cuenta con más de treinta comentarios."
  fr: "L'ouvrage d'Abd al-Ghani al-Maqdisi (mort en 600 AH), al-Umda fi al-Ahkam, recueil de hadiths juridiques en deux parties, sur lequel s'accordent al-Bukhari et Muslim, est cité par Ibn Rajab parmi ses œuvres compilées sans chaîne de transmission. Rédigé à la demande d'un confrère, il est organisé par chapitres de droit, de la pureté à l'affranchissement, et comprend 423 hadiths dans l'édition d'al-Faryabi. Ce recueil est appelé « Les Petites Règles » (al-Ahkam al-Sughra) pour le distinguer des « Grandes Règles », et compte plus de trente commentaires."
  tr: "'Abd al-Ghani al-Maqdisi (ö. 600 H) adlı 'Al-Umda fi al-Ahkam' adlı kitap, el-Buhari ve Müslüman arasında üzerinde anlaşılan hükümlerin hadislerini iki cilt halinde derlemiştir ve İbn Recep bunu aktarım zinciri olmayan eserlerinden biri olarak kabul etmiştir. {alıntı:Dhayl-tabaqat-hanabila-faqi-v2 s.19} Bazı kardeşleriyle danıştıktan sonra yazdı ve Al-Faryabi baskısında 423 hadisle saflıktan kurtuluşa hukuk bölümlerine ayırdı. Yazar, kitabı 'Al-Ahkam al-Sughra' olarak adlandırarak 'Al-Ahkam al-Kubra'dan ayırt eder ve otuzdan fazla şerh içerir. {cite:Umdat-al-ahkam-faryabi-2002 s.39} {cite:umdat-al-ahkam-faryabi-2002 s.40} {cite:umdat-al-ahkam-faryabi-2002 s.244} {cite:umdat-al-ahkam-zuhayri-1419 s.17} {cite:umdat-al-ahkam-faryabi-2002 s.21} {cite:umdat-al-ahkam-faryabi-2002 s.22} {cite:umdat-al-ahkam-faryabi-2002 s.23}"
  id: "Buku 'Abd al-Ghani al-Maqdisi (wafat 600 H) 'Al-Umda fi al-Ahkam' mengumpulkan hadits-hadits yang disepakati oleh al-Bukhari dan Muslim dalam dua jilid, dan Ibn Rajab menganggapnya sebagai salah satu karyanya tanpa rantai transmisi. {cite:dhayl-tabaqat-hanabila-faqi-v2 hlm.19} Ia menulisnya setelah berkonsultasi dengan beberapa saudaranya dan mengaturnya ke dalam bab-bab yurisprudensi dari kemurnian hingga pembebasan dalam 423 hadis edisi Al-Faryabi. Penulis menamainya dalam daftar kitabnya 'Al-Ahkam al-Sughra' untuk membedakannya dari 'Al-Ahkam al-Kubra', dan memuat lebih dari tiga puluh komentar. {cite:umdat-al-ahkam-faryabi-2002 hlm.39} {cite:umdat-al-ahkam-faryabi-2002 hlm.40} {cite:umdat-al-ahkam-faryabi-2002 p.244} {cite:umdat-al-ahkam-zuhayri-1419 p.17} {cite:umdat-al-ahkam-faryabi-2002 p.21} {cite:umdat-al-ahkam-faryabi-2002 p.22} {cite:umdat-al-ahkam-faryabi-2002 p.23}"
