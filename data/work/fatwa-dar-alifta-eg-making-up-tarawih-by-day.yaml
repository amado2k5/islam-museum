id: work/fatwa-dar-alifta-eg-making-up-tarawih-by-day
class: work
kind: fatwa
label: { ar: "حكم قضاء صلاة التراويح نهارًا", en: "Making up tarawih prayer by day", ur: "تراویح کی قضاء دن میں کرنے کا حکم", es: "Preparación de la oración de Tarawih durante el día", fr: "Rattraper la prière de tarawih par jour", tr: "Gündüz Teravih namazlarının hazırlanmasına ilişkin karar", id: "Peraturan tentang pembuatan shalat Taraweeh pada siang hari" }
summary:
  ar: "سائل سأل عن قضاء صلاة التراويح نهارًا لمن فاتته بسبب الإجهاد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22531)⁩ أن صلاة التراويح سنة مؤكدة باتفاق الفقهاء، ومن فاتته لسبب كالإجهاد وأراد قضاءها نُدب له ذلك على مذهب من أجازه من أهل العلم كما فصّل الجواب."
  en: "A questioner asked about making up the tarawih prayer by day after missing it through exhaustion. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22531) answered that tarawih is a confirmed sunna by the jurists' consensus; whoever misses it for a cause such as fatigue and wants to make it up is recommended to do so on the doctrine of those scholars who allow it, as the answer details."
  ur: "ایک سائل نے تھکن کی وجہ سے چھوٹی تراویح دن میں قضاء کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22531)⁩ نے جواب دیا کہ تراویح فقہاء کے اتفاق سے مؤکدہ سنت ہے؛ جو اس سے کسی سبب مثلاً تھکن کے باعث رہ جائے اور قضاء کرنا چاہے تو اسے اسے مستحب کہا گیا ان اہل علم کے مذہب پر جو اس کی اجازت دیتے ہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de recuperar la oración de Tarawih durante el día tras haberla omitido por agotamiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22531) respondió que el Tarawih es una sunna confirmada por consenso de los juristas; quien la omita por una causa como el cansancio y desee recuperarla, debe hacerlo según la doctrina de los eruditos que lo permiten, como se detalla en la respuesta."
  fr: "Un fidèle a demandé s'il était possible de rattraper la prière de tarawih en journée après l'avoir manquée pour cause de fatigue. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22531) a répondu que la prière de tarawih est une sunna confirmée par consensus des juristes; il est recommandé à quiconque la manque pour une raison telle que la fatigue et souhaite la rattraper de le faire conformément à la doctrine des savants qui l'autorisent, comme le précise la réponse."
  tr: "Bir soru soran kişi, yorgunluk nedeniyle namaz kaçıranlar için gündüz Teravih namazlarının hazırlanmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22531), teravih namazının hukukçuların mutabakatıyla onaylanmış bir sünnet olduğunu ve stres gibi nedenlerle kaçıran ve telafi etmek isteyenlerin, onaylayan alimlerin görüşüne göre tavsiye edildiğini ve yanıtta detaylandırıldığı şeklinde yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang cara membuat shalat Taraweeh di siang hari bagi mereka yang melewatkannya karena kelelahan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22531) menjawab bahwa shalat Taraweeh adalah Sunnah yang dikonfirmasi oleh kesepakatan para ahli hukum, dan siapa pun yang melewatkannya karena alasan seperti stres dan ingin menebusnya direkomendasikan menurut pendapat para ulama yang mengizinkan, sebagaimana dijelaskan dalam jawabannya."
