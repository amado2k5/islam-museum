id: work/fatwa-dar-alifta-eg-making-up-tarawih-by-day
class: work
kind: fatwa
label: { ar: "حكم قضاء صلاة التراويح نهارًا", en: "Making up tarawih prayer by day", ur: "تراویح کی قضاء دن میں کرنے کا حکم" }
summary:
  ar: "سائل سأل عن قضاء صلاة التراويح نهارًا لمن فاتته بسبب الإجهاد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22531)⁩ أن صلاة التراويح سنة مؤكدة باتفاق الفقهاء، ومن فاتته لسبب كالإجهاد وأراد قضاءها نُدب له ذلك على مذهب من أجازه من أهل العلم كما فصّل الجواب."
  en: "A questioner asked about making up the tarawih prayer by day after missing it through exhaustion. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22531) answered that tarawih is a confirmed sunna by the jurists' consensus; whoever misses it for a cause such as fatigue and wants to make it up is recommended to do so on the doctrine of those scholars who allow it, as the answer details."
  ur: "ایک سائل نے تھکن کی وجہ سے چھوٹی تراویح دن میں قضاء کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22531)⁩ نے جواب دیا کہ تراویح فقہاء کے اتفاق سے مؤکدہ سنت ہے؛ جو اس سے کسی سبب مثلاً تھکن کے باعث رہ جائے اور قضاء کرنا چاہے تو اسے اسے مستحب کہا گیا ان اہل علم کے مذہب پر جو اس کی اجازت دیتے ہیں، جیسا کہ جواب میں تفصیل ہے۔"
