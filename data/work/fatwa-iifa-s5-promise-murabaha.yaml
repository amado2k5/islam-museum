label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الوفاء بالوعد والمرابحة للآمر بالشراء", en: "IIFA resolution on honouring a promise and murabaha to the purchase-orderer", ur: "اکیڈمی کی قرارداد: وعدہ کی وفا اور مرابحہ للآمر بالشراء" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩ بعد تأجيل الدورة الرابعة: بيع المرابحة للآمر بالشراء إذا وقع على سلعة بعد دخولها في ملك المأمور وحصول القبض المطلوب شرعًا فهو بيع جائز ما دامت على المأمور مسؤولية التلف قبل التسليم وتبعة الرد بالعيب الخفي وتوافرت شروط البيع، وبيّن حكم الوعد فيها على ما فصّل."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988), after the fourth session's deferral: murabaha to the purchase-orderer concluded on goods after they enter the orderer's ownership with the legally required possession is a valid sale, so long as the orderer bears loss before delivery and the liability for hidden-defect return, with the ruling on the promise set out."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: مرابحہ للآمر بالشراء جائز ہے جب مال قبضے کے بعد آمر کی ملکیت میں آ جائے اور نقصان و عیب کی ذمہ داری اس پر ہو؛ وعدے کا حکم بیان ہوا۔"
