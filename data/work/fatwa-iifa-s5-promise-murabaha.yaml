id: work/fatwa-iifa-s5-promise-murabaha
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الوفاء بالوعد والمرابحة للآمر بالشراء", en: "IIFA resolution on honouring a promise and murabaha to the purchase-orderer", ur: "اکیڈمی کی قرارداد: وعدہ کی وفا اور مرابحہ للآمر بالشراء", es: "Resolución de la IIFA sobre el cumplimiento de una promesa y el acuerdo murabaha con el comprador.", fr: "Résolution de l'IIFA sur le respect d'une promesse et la murabaha envers le donneur d'ordre" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩ بعد تأجيل الدورة الرابعة: بيع المرابحة للآمر بالشراء إذا وقع على سلعة بعد دخولها في ملك المأمور وحصول القبض المطلوب شرعًا فهو بيع جائز ما دامت على المأمور مسؤولية التلف قبل التسليم وتبعة الرد بالعيب الخفي وتوافرت شروط البيع، وبيّن حكم الوعد فيها على ما فصّل."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988), after the fourth session's deferral: murabaha to the purchase-orderer concluded on goods after they enter the orderer's ownership with the legally required possession is a valid sale, so long as the orderer bears loss before delivery and the liability for hidden-defect return, with the ruling on the promise set out."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: مرابحہ للآمر بالشراء جائز ہے جب مال قبضے کے بعد آمر کی ملکیت میں آ جائے اور نقصان و عیب کی ذمہ داری اس پر ہو؛ وعدے کا حکم بیان ہوا۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988), tras el aplazamiento de la cuarta sesión: la murabaha al comprador celebrada sobre bienes después de que estos entren en propiedad del comprador con la posesión legalmente requerida es una venta válida, siempre que el comprador asuma la pérdida antes de la entrega y la responsabilidad por la devolución por defectos ocultos, con la resolución sobre la promesa establecida."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988), après le report de la quatrième session: la murabaha conclue avec le donneur d'ordre sur des marchandises après qu'elles soient entrées en possession du donneur d'ordre avec la possession légalement requise constitue une vente valable, à condition que le donneur d'ordre supporte la perte avant la livraison et la responsabilité du retour pour vice caché, la décision relative à la promesse étant énoncée."
