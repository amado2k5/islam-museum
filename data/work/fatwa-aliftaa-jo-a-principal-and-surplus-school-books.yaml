id: work/fatwa-aliftaa-jo-a-principal-and-surplus-school-books
class: work
kind: fatwa
label: { ar: "مدير مدرسة والكتب المدرسية الزائدة", en: "A school principal and surplus school books", ur: "اسکول کے پرنسپل اور زائد درسی کتابیں" }
summary:
  ar: "سؤال عن مدير مدرسة والكتب المدرسية الزائدة، أجابت فيه دائرة الإفتاء العام الأردنية بأن المدير مؤتمن على الكتب ويجب عليه التقيد بتعليمات الوزارة؛ فإن سمحت ببيعها أو هبتها جاز، وإن منعت حرم، والواجب إعادتها أو استئذان الوزارة في بيعها ووضع ثمنها لصالح المدرسة. أجابت الدائرة بأن الموظف أجير لدى الجهة التي يعمل لديها ومؤتمن في عمله، فيجب عليه مراعاة أنظمتها وتعليماتها، ولا يجوز له التصرف إلا في حدود المأذون به. وقالت إنه لا يجوز له بيع الكتب ولا هبتها باسمه الشخصي، لأن ذلك تعد وأكل للمال العام، وهو من السحت المحرم. وخلصت إلى أن المدير مؤتمن على ما في يديه، فإن كانت تعليمات الوزارة تسمح ببيع الكتب أو هبتها جاز التصرف بها، وإن كانت تمنع حرم ذلك، والواجب إعادة الكتب الزائدة إلى الوزارة أو استئذانها في بيعها ووضع ثمنها لصالح المدرسة."
  en: "A question about a school principal and surplus school books, in which Jordan's General Iftaa Department answered that the principal holds the books in trust and must follow the ministry's instructions: if they allow selling or giving them away, he may; if they forbid it, it is forbidden, and he must return the surplus books or ask the ministry's permission to sell them and put the money toward the school. The Department answered that an employee is a hired agent of the body he works for and is entrusted with his work, so he must observe its regulations and instructions and may act only within what he is permitted. It said he may not sell or give away the books in his own name, since that is a transgression and a consuming of public money, a forbidden unlawful gain. It concluded that the principal holds in trust what is in his hands: if the ministry's instructions allow the books to be sold or given away, he may do so; if they forbid it, it is forbidden, and he must return the surplus books to the ministry or seek its permission to sell them and put the proceeds toward the school."
  ur: "اسکول کے پرنسپل اور زائد درسی کتابیں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پرنسپل کتابوں کا امین ہے اور وزارت کی ہدایات کا پابند ہے؛ اگر وہ بیچنے یا ہبہ کرنے کی اجازت دیں تو جائز، منع کریں تو حرام، اور زائد کتابیں واپس کرنا یا وزارت سے بیچنے کی اجازت لے کر قیمت اسکول کے مفاد میں لگانا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم اپنے ادارے کا اجیر اور اپنے کام میں امین ہے، اس لیے اس کے ضوابط اور ہدایات کی پابندی واجب ہے اور وہ صرف اجازت کی حد میں تصرف کر سکتا ہے۔ اس نے کہا کہ وہ کتابیں اپنے ذاتی نام سے نہ بیچ سکتا ہے نہ ہبہ کر سکتا ہے، کیونکہ یہ زیادتی اور سرکاری مال کھانا ہے، جو حرام کمائی ہے۔ اس نے نتیجہ نکالا کہ پرنسپل اپنے ہاتھ کی چیزوں کا امین ہے؛ اگر وزارت کی ہدایات کتابیں بیچنے یا ہبہ کرنے کی اجازت دیں تو جائز ہے، اور اگر منع کریں تو حرام، اور زائد کتابیں وزارت کو واپس کرنا یا اس سے بیچنے کی اجازت لے کر قیمت اسکول کے مفاد میں رکھنا واجب ہے۔"
