label: { ar: "مدير مدرسة والكتب المدرسية الزائدة", en: "A school principal and surplus school books", ur: "اسکول کے پرنسپل اور زائد درسی کتابیں", es: "Un director de escuela y libros escolares sobrantes", fr: "Un directeur d'école et des livres scolaires excédentaires", tr: "Müdür ve Fazla Ders Kitapları", id: "Kepala Sekolah dan Buku Teks Berlebih" }
summary:
  ar: "سؤال عن مدير مدرسة والكتب المدرسية الزائدة، أجابت فيه دائرة الإفتاء العام الأردنية بأن المدير مؤتمن على الكتب ويجب عليه التقيد بتعليمات الوزارة؛ فإن سمحت ببيعها أو هبتها جاز، وإن منعت حرم، والواجب إعادتها أو استئذان الوزارة في بيعها ووضع ثمنها لصالح المدرسة. أجابت الدائرة بأن الموظف أجير لدى الجهة التي يعمل لديها ومؤتمن في عمله، فيجب عليه مراعاة أنظمتها وتعليماتها، ولا يجوز له التصرف إلا في حدود المأذون به. وقالت إنه لا يجوز له بيع الكتب ولا هبتها باسمه الشخصي، لأن ذلك تعد وأكل للمال العام، وهو من السحت المحرم. وخلصت إلى أن المدير مؤتمن على ما في يديه، فإن كانت تعليمات الوزارة تسمح ببيع الكتب أو هبتها جاز التصرف بها، وإن كانت تمنع حرم ذلك، والواجب إعادة الكتب الزائدة إلى الوزارة أو استئذانها في بيعها ووضع ثمنها لصالح المدرسة."
  en: "A question about a school principal and surplus school books, in which Jordan's General Iftaa Department answered that the principal holds the books in trust and must follow the ministry's instructions: if they allow selling or giving them away, he may; if they forbid it, it is forbidden, and he must return the surplus books or ask the ministry's permission to sell them and put the money toward the school. The Department answered that an employee is a hired agent of the body he works for and is entrusted with his work, so he must observe its regulations and instructions and may act only within what he is permitted. It said he may not sell or give away the books in his own name, since that is a transgression and a consuming of public money, a forbidden unlawful gain. It concluded that the principal holds in trust what is in his hands: if the ministry's instructions allow the books to be sold or given away, he may do so; if they forbid it, it is forbidden, and he must return the surplus books to the ministry or seek its permission to sell them and put the proceeds toward the school."
  ur: "اسکول کے پرنسپل اور زائد درسی کتابیں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پرنسپل کتابوں کا امین ہے اور وزارت کی ہدایات کا پابند ہے؛ اگر وہ بیچنے یا ہبہ کرنے کی اجازت دیں تو جائز، منع کریں تو حرام، اور زائد کتابیں واپس کرنا یا وزارت سے بیچنے کی اجازت لے کر قیمت اسکول کے مفاد میں لگانا واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم اپنے ادارے کا اجیر اور اپنے کام میں امین ہے، اس لیے اس کے ضوابط اور ہدایات کی پابندی واجب ہے اور وہ صرف اجازت کی حد میں تصرف کر سکتا ہے۔ اس نے کہا کہ وہ کتابیں اپنے ذاتی نام سے نہ بیچ سکتا ہے نہ ہبہ کر سکتا ہے، کیونکہ یہ زیادتی اور سرکاری مال کھانا ہے، جو حرام کمائی ہے۔ اس نے نتیجہ نکالا کہ پرنسپل اپنے ہاتھ کی چیزوں کا امین ہے؛ اگر وزارت کی ہدایات کتابیں بیچنے یا ہبہ کرنے کی اجازت دیں تو جائز ہے، اور اگر منع کریں تو حرام، اور زائد کتابیں وزارت کو واپس کرنا یا اس سے بیچنے کی اجازت لے کر قیمت اسکول کے مفاد میں رکھنا واجب ہے۔"
  es: "Una pregunta sobre un director de escuela y libros escolares sobrantes, a la que el Departamento General de Iftaa de Jordania respondió que el director custodia los libros y debe seguir las instrucciones del ministerio: si se permite venderlos o regalarlos, puede hacerlo; si se prohíbe, está prohibido, y debe devolver los libros sobrantes o solicitar permiso al ministerio para venderlos y destinar el dinero a la escuela. El Departamento respondió que un empleado es un agente contratado por la entidad para la que trabaja y se le confía su trabajo, por lo que debe observar sus reglamentos e instrucciones y solo puede actuar dentro de lo que le está permitido. Dijo que no puede vender ni regalar los libros a su propio nombre, ya que eso es una transgresión y un consumo de dinero público, una ganancia ilícita prohibida. Concluyó que el director custodia lo que está en sus manos: si las instrucciones del ministerio permiten vender o regalar los libros, puede hacerlo; si se prohíbe, está prohibido, y debe devolver los libros sobrantes al ministerio o solicitar su permiso para venderlos y destinar el producto a la escuela."
  fr: "Concernant une question relative à un directeur d'école et aux manuels scolaires excédentaires, le Département général de la sagesse (Iftaa) de Jordanie a répondu que le directeur détient les manuels en dépôt et doit se conformer aux instructions du ministère: si celles-ci autorisent leur vente ou leur don, il peut le faire; dans le cas contraire, cela est interdit, et il doit restituer les manuels excédentaires ou demander l'autorisation du ministère pour les vendre et affecter le produit de la vente à l'école. Le Département a expliqué qu'un employé est un mandataire de l'organisme pour lequel il travaille et qu'il est tenu de respecter ses règlements et instructions, et d'agir uniquement dans les limites de ce qui lui est permis. Il a précisé qu'il ne peut ni vendre ni donner les manuels en son nom propre, car cela constitue une transgression et un détournement de fonds publics, un gain illicite. En conclusion, le directeur détient en dépôt ce qui lui est confié: si les instructions du ministère autorisent la vente ou le don des manuels, il peut le faire; dans le cas contraire, cela est interdit, et il doit restituer les manuels excédentaires au ministère ou demander son autorisation pour les vendre et affecter le produit de la vente à l'école."
  tr: "Bir okul müdürü ve fazla okul ders kitapları hakkında bir soru; Ürdün Genel Fetva Dairesi, müdürün kitapların emanet edildiğini ve bakanlığın talimatlarına uyması gerektiğini yanıtladı; eğer kitapların satılmasına veya bağışlanmasına izin verilirse bu mümkündür, ancak yasaksa, yasaktır ve kitapları iade etmek veya bakanlıktan izin almak zorunludur; bu kitapları satıp fiyatı okul lehine koymak zorundadır. Departman, çalışanın çalıştığı kurumun çalışanı olduğunu ve işinin kendisine emanet edildiğini, bu nedenle yönetmeliklere ve talimatlara uyması gerektiğini, ancak izin verilen sınırlar dahilinde hareket edebileceğini belirtti. Kişisel adına kitap satmasının veya hediye etmesinin yasak olduğunu, bunun kamu fonlarının zimmete geçirmesi olarak kabul edildiğini ve yasaklanmış müsaderenin yasak olduğunu belirtti. Müdürün sahip olduğu şeylerin emanet edildiği sonucuna varıldı; bakanlığın talimatları kitapların satışına veya bağışlanmasına izin veriyorsa, kitapların elden çıkarılmasına izin verilir, ancak yasaklarsa, fazla kitapların bakanlığa iade edilmesi veya satma izni alınması ve fiyatlarının okul lehine belirlenmesi gerekir."
  id: "Pertanyaan tentang kepala sekolah dan buku pelajaran surplus sekolah, di mana Departemen Fatwa Umum Yordania menjawab bahwa kepala sekolah dipercayakan dengan buku-buku tersebut dan harus mematuhi instruksi kementerian; jika buku tersebut diizinkan dijual atau disumbangkan, maka diperbolehkan, tetapi jika dilarang, dilarang, dan wajib mengembalikannya atau mendapatkan izin kementerian untuk menjualnya serta menetapkan harga untuk pihak sekolah. Departemen menjawab bahwa seorang karyawan adalah karyawan dari entitas tempat ia bekerja dan dipercayakan dengan pekerjaannya, sehingga ia harus mematuhi peraturan dan instruksi serta hanya boleh bertindak sesuai batas yang diizinkan. Departemen menyatakan bahwa ia tidak diperbolehkan menjual atau memberikan buku atas nama pribadinya, karena hal ini dianggap sebagai tindakan penggelapan dana publik, dan penyitaan dilarang dilarang. Kesimpulan tersebut menyimpulkan bahwa kepala sekolah dipercayakan atas apa yang dimilikinya; jika instruksi kementerian mengizinkan penjualan atau donasi buku, maka diperbolehkan untuk menjualnya, tetapi jika dilarang, maka surplus buku tersebut harus dikembalikan ke kementerian atau mendapatkan izin untuk menjualnya dan menetapkan harga untuk pihak sekolah."
