id: work/fatwa-dar-alifta-eg-sunscreen-in-ihram
class: work
kind: fatwa
label: { ar: "حكم استعمال الواقي الشمسي للمحرم", en: "Using sunscreen while in ihram", ur: "احرام میں سن اسکرین لگانے کا حکم", es: "Usar protector solar durante el estado de ihram.", fr: "Utiliser de la crème solaire pendant l'ihram" }
summary:
  ar: "سائل سأل عن استعمال الواقي الشمسي للمحرم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21908)⁩ أنه يجوز للمحرم ذكرًا أو أنثى استخدام كريم الواقي الشمسي في بدنه أثناء إحرامه إذا لم يضف إليه مادة عطرية على ما فصّل الجواب."
  en: "A questioner asked about a pilgrim in ihram using sunscreen. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21908) answered that a pilgrim — male or female — may use sunscreen on the body while in ihram provided no perfumed substance is added to it, as the answer details."
  ur: "ایک سائل نے احرام میں سن اسکرین استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21908)⁩ نے جواب دیا کہ محرم — مرد ہو یا عورت — جسم پر سن اسکرین لگا سکتا ہے بشرطیکہ اس میں خوشبو دار مادہ نہ ملا ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un visitante preguntó sobre la posibilidad de que un peregrino en estado de ihram utilice protector solar. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21908) respondió que un peregrino, hombre o mujer, puede usar protector solar en el cuerpo mientras está en estado de ihram, siempre que no se le añada ninguna sustancia perfumada, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant l'utilisation de crème solaire par un pèlerin en état d'ihram. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21908) a répondu qu'un pèlerin, homme ou femme, peut utiliser de la crème solaire sur le corps pendant l'ihram, à condition qu'elle ne contienne aucun parfum, comme le précise la réponse."
