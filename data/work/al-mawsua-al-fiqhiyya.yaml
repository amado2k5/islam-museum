summary:
  ar: "موسوعة فقهية مرتبة على أبواب العبادات ثم بقية الأبواب، تبدأ بالطهارة ثم الصلاة والجنائز والزكاة والصيام والحج والعمرة. الملف المحفوظ نسخة رقمية من مكتبة الشاملة؛ وصفحة عنوانها تنسبها إلى موقع الدرر السنية بإشراف علوي بن عبد القادر السقاف في ثلاثة أجزاء، وهذا لا يطابق الموسوعة الفقهية الكويتية المعروفة {cite:fiqh-mawsua-foulabook-copy p.1} {cite:fiqh-mawsua-foulabook-copy p.2}."
  en: "A fiqh encyclopedia arranged by topic, starting with the worship chapters (purity, prayer, funerals, zakat, fasting, pilgrimage). The digital copy's title page credits the Dorar.net compilation under Alawi al-Saqqaf in three volumes, which does not match the Kuwaiti encyclopedia by name or size."
  es: "Una enciclopedia de fiqh organizada por temas, comenzando con los capítulos sobre la adoración (pureza, oración, funerales, zakat, ayuno, peregrinación). La página del título de la copia digital atribuye la compilación de Dorar.net a Alawi al-Saqqaf en tres volúmenes, lo cual no coincide con la enciclopedia kuwaití ni en nombre ni en tamaño."
  fr: "Une encyclopédie de fiqh organisée par thèmes, commençant par les chapitres relatifs au culte (pureté, prière, funérailles, zakat, jeûne, pèlerinage). La page de titre de la version numérique mentionne la compilation de Dorar.net sous le titre « Alawi al-Saqqaf » en trois volumes, ce qui ne correspond ni au titre ni à la taille de l'encyclopédie koweïtienne."
  ur: "ایک فقہ انسائیکلوپیڈیا جو عنوان کے لحاظ سے ترتیب دیا گیا ہے، جس کا آغاز عبادت کے ابواب ⁦(طہارت، نماز، جنازہ، زکوٰۃ، روزہ، حج)⁩ سے ہوتا ہے۔ ڈیجیٹل کاپی کا ٹائٹل پیج تین جلدوں میں علوی الثقاف کے تحت Dorar.net کی تالیف کا سہرا دیتا ہے، جو نام یا سائز کے اعتبار سے کویتی انسائیکلوپیڈیا سے میل نہیں کھاتا۔"
  tr: "İbadet eylemlerinin bölümlerine göre düzenlenmiş bir fikıh ansiklopedisi, ardından arınma, dua, cenazeler, zekat, oruç, hac ve umre ile başlayan diğer bölümler yer alır. Korunan dosya, Al-Shamelah Kütüphanesi'nden dijital bir kopyadır; ve başlığı Al-Durar Al-Sunniyya web sitesine atfedilen ve Alevi bin Abdul Kadir Al-Saqqaf tarafından denetlenen üç cilt halinde bir sayfadır. Bu, ünlü Kuveyt hukuk ansiklopedisi {cite:fiqh-mawsua-foulabook-copy s.1} {cite:fiqh-mawsua-foulabook-copy s.2} ile uyuşmaz."
  id: "Ensiklopedia yurisprudensi yang diorganisir berdasarkan bab-bab ibadah, lalu bab-bab lainnya, dimulai dengan penyucian, kemudian doa, pemakaman, zakat, puasa, ziarah, dan Umrah. File yang disimpan adalah salinan digital dari Perpustakaan Al-Shamelah; dan halaman dengan judulnya yang dikaitkan dengan situs web Al-Durar Al-Sunniyya yang diawasi oleh Alawi bin Abdul Qadir Al-Saqqaf dalam tiga volume. Ini tidak sesuai dengan ensiklopedia yurisprudensi Kuwait yang terkenal {cite:fiqh-mawsua-foulabook-copy hlm.1} {cite:fiqh-mawsua-foulabook-copy hlm.2}"
