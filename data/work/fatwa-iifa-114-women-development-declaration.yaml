id: work/fatwa-iifa-114-women-development-declaration
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 114 (12/8) بشأن الإعلان الإسلامي لدور المرأة في تنمية المجتمع المسلم", en: "IIFA resolution 114 (12/8) on the Islamic Declaration on the role of women in developing the Muslim community", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 114 (12/8): مسلم معاشرے کی ترقی میں خواتین کے کردار کا اسلامی اعلامیہ", es: "Resolución 114 (12/8) de la IIFA sobre la Declaración Islámica sobre el papel de la mujer en el desarrollo de la comunidad musulmana." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد الاطلاع على توصيات ندوة الخبراء حول دور المرأة في تنمية المجتمع الإسلامي المنعقدة بطهران ⁦(ذو القعدة 1415هـ/أبريل 1995م)⁩ بموجب قرار القمة الإسلامي السابع، والمعدلة في دورتي المجمع التاسعة والعاشرة، وفي ضوء ما وصفه النص بالقيم التي أحاط الإسلام المرأة بها وبيانات إسلامية صدرت تجاه مؤتمرات المرأة العالمية. قرر أن من أهداف الإسلام بناء مجتمع يكون فيه لكل من الرجل والمرأة دور متكامل في البناء والتنمية، وأن الإسلام أعطى المرأة حقوقها كاملة على أساس ينسجم مع شخصيتها وقدراتها، وأقر الإعلان الإسلامي لدور المرأة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after reviewing the recommendations of the Tehran experts' seminar on women's role in developing the Muslim community (Dhu al-Qa'da 1415 / April 1995), held under a Seventh Islamic Summit decision and amended at the Academy's 9th and 10th sessions, and in light of what the text calls the values Islam surrounds women with and the Islamic statements issued toward world women's conferences. It resolved that among Islam's aims is building a society in which men and women each have an integral role in construction and development, that Islam gave women their rights in full on a basis consistent with her personality and capacities, and adopted the Islamic Declaration on women's role."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، تہران ماہرین سمینار ⁦(ذوالقعدہ 1415ھ/اپریل 1995ء)⁩ کی سفارشات کے مطالعے کے بعد — جو ساتویں اسلامی سمٹ کے فیصلے پر منعقد ہوئی اور اکیڈمی کی نویں اور دسویں مجلسوں میں ترمیم شدہ — اور اس کے متن کے بقول اسلام کی خواتین کو دی ہوئی اقدار اور عالمی خواتین کانفرنسوں کے جواب میں جاری اسلامی بیانات کی روشنی میں۔ فیصلہ: اسلام کے مقاصد میں ایسے معاشرے کی تعمیر ہے جس میں مرد اور عورت دونوں کا تعمیر و ترقی میں مکمل کردار ہو؛ اسلام نے عورت کو اس کی شخصیت اور صلاحیتوں کے مطابق اس کے پورے حقوق دیے؛ اور خواتین کے کردار کا اسلامی اعلامیہ منظور کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), tras revisar las recomendaciones del seminario de expertos de Teherán sobre el papel de la mujer en el desarrollo de la comunidad musulmana (Dhu al-Qa'da 1415 / abril de 1995), celebrada en virtud de una decisión de la Séptima Cumbre Islámica y enmendada en las sesiones 9.ª y 10.ª de la Academia, y a la luz de lo que el texto denomina los valores con los que el Islam rodea a las mujeres y las declaraciones islámicas emitidas en el marco de las conferencias mundiales sobre la mujer. Se resolvió que entre los objetivos del Islam se encuentra la construcción de una sociedad en la que hombres y mujeres tengan un papel integral en la construcción y el desarrollo, que el Islam otorgó a las mujeres sus derechos plenamente sobre una base coherente con su personalidad y capacidades, y se adoptó la Declaración Islámica sobre el papel de la mujer."
