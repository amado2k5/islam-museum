label: { ar: "قرار مجمع الفقه الإسلامي الدولي 114 (12/8) بشأن الإعلان الإسلامي لدور المرأة في تنمية المجتمع المسلم", en: "IIFA resolution 114 (12/8) on the Islamic Declaration on the role of women in developing the Muslim community", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 114 (12/8): مسلم معاشرے کی ترقی میں خواتین کے کردار کا اسلامی اعلامیہ", es: "Resolución 114 (12/8) de la IIFA sobre la Declaración Islámica sobre el papel de la mujer en el desarrollo de la comunidad musulmana.", fr: "Résolution 114 (12/8) de l'IIFA sur la Déclaration islamique concernant le rôle des femmes dans le développement de la communauté musulmane", tr: "Uluslararası İslami Fiqh Akademisi Kararı 114 (12/8) Kadını Müslüman Toplumunun Kalkınmasında Rolüne İlişkin İslami Bildirge ile ilgili", id: "Resolusi Akademi Fiqh Islam Internasional 114 (12/8) mengenai Deklarasi Islam tentang Peran Perempuan dalam Pembangunan Masyarakat Muslim" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد الاطلاع على توصيات ندوة الخبراء حول دور المرأة في تنمية المجتمع الإسلامي المنعقدة بطهران ⁦(ذو القعدة 1415هـ/أبريل 1995م)⁩ بموجب قرار القمة الإسلامي السابع، والمعدلة في دورتي المجمع التاسعة والعاشرة، وفي ضوء ما وصفه النص بالقيم التي أحاط الإسلام المرأة بها وبيانات إسلامية صدرت تجاه مؤتمرات المرأة العالمية. قرر أن من أهداف الإسلام بناء مجتمع يكون فيه لكل من الرجل والمرأة دور متكامل في البناء والتنمية، وأن الإسلام أعطى المرأة حقوقها كاملة على أساس ينسجم مع شخصيتها وقدراتها، وأقر الإعلان الإسلامي لدور المرأة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after reviewing the recommendations of the Tehran experts' seminar on women's role in developing the Muslim community (Dhu al-Qa'da 1415 / April 1995), held under a Seventh Islamic Summit decision and amended at the Academy's 9th and 10th sessions, and in light of what the text calls the values Islam surrounds women with and the Islamic statements issued toward world women's conferences. It resolved that among Islam's aims is building a society in which men and women each have an integral role in construction and development, that Islam gave women their rights in full on a basis consistent with her personality and capacities, and adopted the Islamic Declaration on women's role."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، تہران ماہرین سمینار ⁦(ذوالقعدہ 1415ھ/اپریل 1995ء)⁩ کی سفارشات کے مطالعے کے بعد — جو ساتویں اسلامی سمٹ کے فیصلے پر منعقد ہوئی اور اکیڈمی کی نویں اور دسویں مجلسوں میں ترمیم شدہ — اور اس کے متن کے بقول اسلام کی خواتین کو دی ہوئی اقدار اور عالمی خواتین کانفرنسوں کے جواب میں جاری اسلامی بیانات کی روشنی میں۔ فیصلہ: اسلام کے مقاصد میں ایسے معاشرے کی تعمیر ہے جس میں مرد اور عورت دونوں کا تعمیر و ترقی میں مکمل کردار ہو؛ اسلام نے عورت کو اس کی شخصیت اور صلاحیتوں کے مطابق اس کے پورے حقوق دیے؛ اور خواتین کے کردار کا اسلامی اعلامیہ منظور کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), tras revisar las recomendaciones del seminario de expertos de Teherán sobre el papel de la mujer en el desarrollo de la comunidad musulmana (Dhu al-Qa'da 1415 / abril de 1995), celebrada en virtud de una decisión de la Séptima Cumbre Islámica y enmendada en las sesiones 9.ª y 10.ª de la Academia, y a la luz de lo que el texto denomina los valores con los que el Islam rodea a las mujeres y las declaraciones islámicas emitidas en el marco de las conferencias mundiales sobre la mujer. Se resolvió que entre los objetivos del Islam se encuentra la construcción de una sociedad en la que hombres y mujeres tengan un papel integral en la construcción y el desarrollo, que el Islam otorgó a las mujeres sus derechos plenamente sobre una base coherente con su personalidad y capacidades, y se adoptó la Declaración Islámica sobre el papel de la mujer."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), après examen des recommandations du séminaire d'experts de Téhéran sur le rôle des femmes dans le développement de la communauté musulmane (Dhu al-Qa'da 1415 / avril 1995), tenu suite à une décision du Septième Sommet islamique et amendé lors des 9e et 10e sessions de l'Académie, et à la lumière des valeurs que l'islam attribue aux femmes et des déclarations islamiques faites lors des conférences mondiales sur les femmes. Il a été décidé que l'islam vise notamment à bâtir une société où hommes et femmes participent pleinement à sa construction et à son développement, que l'islam reconnaît pleinement les droits des femmes en fonction de leur personnalité et de leurs capacités, et que la Déclaration islamique sur le rôle des femmes a été adoptée."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on ikinci oturumunda (25 Cumada-el-Ahhirah – 1 Recep 1421 H, 23–28 Eylül 2000) Tahran'da düzenlenen Yedinci İslami Zirve Kararı uyarınca (Dhu al-Qi'dah 1415 Hile / Nisan 1995 M.S.) Yedinci İslami Zirve Kararı uyarınca yapılan ve metnin İslam'ın kadınları kapsadığı değerler ile küresel kadın konferanslarıyla ilgili yapılan İslami açıklamalar ışığında değerlendirildiği toplu karar. İslam'ın amaçlarından birinin, hem erkeklerin hem de kadınların inşa ve kalkınmada entegre rol oynadığı bir toplum inşa etmek olduğu, kadınlara kişilikleri ve yetenekleri temelinde tam haklar verdiği ve Kadınların Rolü İslami Bildirgesi'ni onayladığı kararlaştırılmıştır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000 M), setelah meninjau rekomendasi Simposium Ahli tentang Peran Perempuan dalam Pembangunan Masyarakat Islam yang diadakan di Teheran (Dhu al-Qi'dah 1415 AH / April 1995 M) sesuai dengan Resolusi KTT Islam Ketujuh, yang diamandemen pada sesi kesembilan dan kesepuluh Majelis, dan berdasarkan apa yang digambarkan teks sebagai nilai-nilai yang mencakup perempuan dan pernyataan Islam yang dikeluarkan terkait konferensi perempuan global. Diputuskan bahwa salah satu tujuan Islam adalah membangun masyarakat di mana laki-laki dan perempuan memiliki peran terintegrasi dalam pembangunan dan pembangunan, dan bahwa Islam telah memberikan hak penuh kepada perempuan berdasarkan kepribadian dan kemampuan mereka, serta meratifikasi Deklarasi Islam tentang Peran Perempuan."
