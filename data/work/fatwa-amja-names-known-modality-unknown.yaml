id: work/fatwa-amja-names-known-modality-unknown
class: work
kind: fatwa
label: { ar: "معاني الأسماء والصفات معلومة وكيفياتها مجهولة", en: "The meanings of the names and attributes are known, their how is unknown", ur: "اسماء و صفات کے معانی معلوم اور کیفیت مجہول", es: "Se conocen los significados de los nombres y atributos, pero se desconoce cómo se originan.", fr: "On connaît la signification des noms et des attributs, mais on ignore comment.", tr: "İsimlerin ve sıfatların anlamları bilinir, ancak nitelikleri bilinmemektedir.", id: "Makna kata benda dan kata sifat sudah diketahui, dan kualitasnya tidak diketahui." }
summary:
  ar: "سأل سائل عن معاني أسماء الله الحسنى وصفاته العليا هل ما أدركناه منها من شرح العلماء واللغة هو كل المعنى. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80531 بتاريخ 25 نوفمبر 2009)⁩ أن القاعدة في باب الأسماء والصفات أن معانيها معلومة يدركها أهل العلم والبصيرة أما كيفياتها فهي المجهولة التي لا سبيل للبشر إلى إدراك كنهها، فالمعنى معلوم والكيف مجهول."
  en: "A questioner asked whether the meanings of God's beautiful names and high attributes — as we grasp them through the scholars' explanations and language — exhaust their sense. Dr. Salah al-Sawi (fatwa no. 80531, 25 November 2009) answered that in the names-and-attributes chapter the rule is that their meanings are known to people of learning and insight, while their modalities are the unknowable that no human can reach the essence of — the meaning is known, the how is unknown."
  ur: "ایک سائل نے پوچھا کہ اسمائے حسنی کے معانی وہی ہیں جو علماء کی شرح سے ہم جانتے ہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80531، 25 نومبر 2009)⁩ کے مطابق معانی معلوم ہیں مگر کیفیت مجہول ہے۔"
  es: "Un interlocutor preguntó si los significados de los bellos nombres y altos atributos de Dios —tal como los comprendemos a través de las explicaciones y el lenguaje de los eruditos— agotan su sentido. El Dr. Salah al-Sawi (fatwa n.° 80531, 25 de noviembre de 2009) respondió que, en el capítulo sobre nombres y atributos, la regla es que sus significados son conocidos por las personas de conocimiento y discernimiento, mientras que sus modalidades son incognoscibles, cuya esencia ningún ser humano puede alcanzar; el significado es conocido, el cómo es desconocido."
  fr: "Un internaute a demandé si la signification des beaux noms et attributs de Dieu, tels que nous les comprenons à travers les explications et le langage des savants, épuise leur sens. Le Dr Salah al-Sawi (fatwa n° 80531, 25 novembre 2009) a répondu que, dans le chapitre consacré aux noms et attributs, la règle est que leur signification est connue des personnes instruites et perspicaces, tandis que leurs modalités demeurent inconnaissables, hors de portée de l'homme; la signification est connue, mais le comment reste inconnu."
  tr: "Bir soruya Allah'ın En Güzel İsimleri ve O'nun yüce sıfatlarının anlamları hakkında soru soruldu. Bunlardan alimlerin ve dilin açıklamalarından anladığımız şey tüm anlam mıdır? Dr. Salah Al-Sawy (25 Kasım 2009 tarihli Fetva No. 80531) isimler ve sıfatlarla ilgili kuralın anlamlarının alimler ve sezgi insanlar tarafından bilinip anlaşıldığını, ancak niteliklerinin bilinmediğini ve insanların özünü kavrayamadığını; anlamın bilindiğini ve niteliklerin bilinmediğini yanıtladı."
  id: "Seorang penanya ditanya tentang makna Nama-nama Terindah Allah dan sifat-sifat-Nya yang mulia. Apakah apa yang kita pahami dari mereka dari penjelasan para ulama dan bahasa adalah seluruh maknanya? Dr. Salah Al-Sawy menjawab (Fatwa No. 80531 tanggal 25 November 2009) bahwa aturan mengenai nama dan atribut adalah maknanya diketahui dan dipahami oleh para ulama dan orang-orang yang berwawasan, sementara kualitasnya tidak diketahui dan manusia tidak dapat memahami esensinya; makna diketahui dan kualitasnya tidak diketahui."
