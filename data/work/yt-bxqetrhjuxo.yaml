summary:
 ar: "محاضرة للمفتي إسماعيل بن موسى منك تحث المؤمنين على البقاء في الجماعة، ومواصلة التعلم عن سيرة النبي، والتثبت في الحديث."
 en: "A lecture by Mufti Ismail ibn Musa Menk encouraging believers to stay within the community, to keep learning about the Prophet, and to weigh hadith with care."
 ur: "مفتی اسماعیل ابن موسیٰ مینک کا ایک لیکچر جس میں مومنین کو جماعت میں رہنے، نبی کے بارے میں سیکھنے اور حدیث کو احتیاط سے تولنے کی ترغیب دی گئی۔"
 es: "Una conferencia del Muftí Ismail ibn Musa Menk animando a los creyentes a permanecer dentro de la comunidad, a seguir aprendiendo sobre el Profeta y a sopesar los hadices con cuidado."
 fr: "Une conférence du mufti Ismail ibn Musa Menk encourageant les croyants à rester au sein de la communauté, à continuer d'apprendre sur le Prophète et à peser les hadiths avec soin."
 tr: "Müftü İsmail bin Musa'nın sizden verdiği bir ders var; müminlere cemaatte kalmaları, Peygamber'in biyografisi hakkında öğrenmeye devam etmeleri ve hadislerde titiz olmaları çağrısında bulunuyor."
 id: "Sebuah ceramah dari Mufti Ismail bin Musa dari Anda yang mendorong para mukmin untuk tetap berada dalam komunitas, terus mempelajari biografi Nabi, dan rajin dalam hadis."
