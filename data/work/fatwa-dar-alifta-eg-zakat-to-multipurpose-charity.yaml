label: { ar: "حكم دفع الزكاة لجمعية خيرية لصرفها في أنشطتها المختلفة", en: "Paying zakat to a charity for its varied activities", ur: "کسی خیراتی جمعیت کو اس کے مختلف کاموں کے لیے زکات دینا", es: "Pagar el zakat a una organización benéfica por sus diversas actividades.", fr: "Versement de la zakat à une œuvre de charité pour ses activités variées", tr: "Bir hayır kurumuna çeşitli faaliyetlerine harcamak üzere zekat ödenmesine ilişkin karar", id: "Putusan tentang pembayaran zakat kepada asosiasi amal untuk digunakan dalam berbagai kegiatannya" }
summary:
  ar: "سائل سأل عن دفع الزكاة لجمعية خيرية تصرفها في أنشطتها المختلفة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21738)⁩ أنه يجوز الصرف من أموال الزكاة في كل ما ورد من الأنشطة المتعلقة بالإنفاق على الفقراء والمساكين من الأيتام وغيرهم على ما فصّل الجواب."
  en: "A questioner asked about paying zakat to a charity that spends it on its varied activities. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21738) answered that zakat funds may be spent on every listed activity connected with spending on the poor and needy — orphans and others — as the answer details."
  ur: "ایک سائل نے کسی خیراتی جمعیت کو اس کے مختلف کاموں کے لیے زکات دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21738)⁩ نے جواب دیا کہ فقیروں اور مسکین — یتیموں وغیرہ — پر خرچ سے متعلق ہر سرگرمی پر زکات خرچ کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre el pago del zakat a una organización benéfica que lo destina a sus diversas actividades. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21738) respondió que los fondos del zakat pueden utilizarse para todas las actividades enumeradas relacionadas con el gasto a los pobres y necesitados —huérfanos y otros—, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le versement de la zakat à une organisation caritative qui la dépense pour ses diverses activités. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21738) a répondu que les fonds de la zakat peuvent être utilisés pour toutes les activités listées liées à l'aide aux pauvres et aux nécessiteux — orphelins et autres — comme le précise la réponse."
  tr: "Bir soru soran, çeşitli faaliyetlerine harcayan bir hayır kurumuna zekat ödemeyi sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21738), cevabında ayrıntılı olarak belirtildiği üzere, zekat fonlarının yoksullar, muhtaçlar, yetimler ve diğerlerine yapılan harcamalarla ilgili tüm faaliyetlere harcanmasının caiz olduğunu yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang pembayaran zakat kepada sebuah asosiasi amal yang digunakan untuk berbagai kegiatannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21738) menjawab bahwa diperbolehkan menggunakan dana zakat untuk semua kegiatan yang berkaitan dengan pengeluaran bagi orang miskin, membutuhkan, yatim piatu, dan lainnya, sebagaimana dijelaskan dalam jawaban."
