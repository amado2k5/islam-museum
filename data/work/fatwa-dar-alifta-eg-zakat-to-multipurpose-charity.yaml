summary:
  ar: "سائل سأل عن دفع الزكاة لجمعية خيرية تصرفها في أنشطتها المختلفة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21738)⁩ أنه يجوز الصرف من أموال الزكاة في كل ما ورد من الأنشطة المتعلقة بالإنفاق على الفقراء والمساكين من الأيتام وغيرهم على ما فصّل الجواب."
  en: "A questioner asked about paying zakat to a charity that spends it on its varied activities. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21738) answered that zakat funds may be spent on every listed activity connected with spending on the poor and needy — orphans and others — as the answer details."
  ur: "ایک سائل نے کسی خیراتی جمعیت کو اس کے مختلف کاموں کے لیے زکات دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21738)⁩ نے جواب دیا کہ فقیروں اور مسکین — یتیموں وغیرہ — پر خرچ سے متعلق ہر سرگرمی پر زکات خرچ کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
