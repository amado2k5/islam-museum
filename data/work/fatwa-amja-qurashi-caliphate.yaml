id: work/fatwa-amja-qurashi-caliphate
class: work
kind: fatwa
label: { ar: "القرشية في الإمامة العظمى", en: "The Qurashi condition in the supreme imamate", ur: "قریشیت — عظمٰی امامت کی شرط", es: "La condición de los Qurashi en el imamato supremo", fr: "La condition des Qurashi dans l'imamat suprême", tr: "Büyük İmamat'taki Qureyşler", id: "Quraisy di Imamat Agung" }
summary:
  ar: "سأل سائل هل تشترط القرشية في الإمامة العظمى وكيف يتماشى ذلك مع العدل والتساوي بين البشر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3263 بتاريخ 22 يوليو 2007)⁩ أن شرط القرشية صحت به النصوص وهو ليس تفضيلًا لفساقهم أو عوامهم على سائر المسلمين وإنما هو تفضيل لأهل الدين والكفاية منهم على غيرهم وذلك فضل الله يؤتيه من يشاء."
  en: "A questioner asked whether Qurashi descent is a condition of the supreme imamate and how that fits justice and human equality. Dr. Salah al-Sawi (fatwa no. 3263, 22 July 2007) answered that the texts establish the Qurashi condition; it is no preferring of their sinners or commoners over other Muslims but a preferring of their religious and capable over others — that is God's bounty given to whom He wills. Recorded as AMJA's answer."
  ur: "ایک سائل نے امامت عظمٰی میں قریشیت کی شرط پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3263، 22 جولائی 2007)⁩ کے مطابق نصوص اس شرط پر ہیں — یہ دیندار و کافی افراد کی ترجیح ہے نہ کہ فاسقوں کی۔"
  es: "Un interlocutor preguntó si la ascendencia Qurashi es un requisito para el imamato supremo y cómo esto se relaciona con la justicia y la igualdad humana. El Dr. Salah al-Sawi (fatwa n.° 3263, 22 de julio de 2007) respondió que los textos establecen la condición Qurashi; no se trata de una preferencia por sus pecadores o plebeyos sobre otros musulmanes, sino de una preferencia por sus religiosos y capaces sobre los demás; esa es la gracia de Dios, otorgada a quien Él quiere. Registrada como respuesta de AMJA."
  fr: "Un internaute a demandé si l'appartenance à la lignée qurashitienne était une condition de l'imamat suprême et comment cela s'accordait avec la justice et l'égalité humaine. Le Dr Salah al-Sawi (fatwa n° 3263, 22 juillet 2007) a répondu que les textes établissent cette condition; il ne s'agit pas de privilégier les pécheurs ou les gens du peuple par rapport aux autres musulmans, mais de privilégier les religieux et les capables – une grâce divine accordée à qui Il veut. Cette réponse a été consignée dans la notice biographique de l'AMJA."
  tr: "Bir soru soran kişiye, Kureyş'in Büyük İmamat için koşulunun olup olmadığı ve bunun insanlar arasında adalet ve eşitlikle nasıl örtüştüğü soruldu. Dr. Salah Al-Sawi (22 Temmuz 2007 tarihli 3263 No. Fetva) Kurayş şartının metinlerde geçerli olduğunu, günahkarları veya sıradan insanları diğer Müslümanlara tercih etmek değil, dindar ve yeterli olanları diğerlerine tercih etmek olduğunu ve bunun Allah'ın istediğine verdiği lütfunun olduğunu yanıtladı."
  id: "Seorang penanya ditanya apakah syarat Quraisy untuk Imamat Agung dan bagaimana hal ini sejalan dengan keadilan dan kesetaraan antar manusia. Dr. Salah Al-Sawi menjawab (Fatwa No. 3263 tanggal 22 Juli 2007) bahwa syarat Quraisy berlaku dalam teks, dan bukan preferensi bagi orang berdosa atau rakyat biasa dibandingkan Muslim lain, melainkan preferensi kepada yang beragama dan cukup di antara mereka dibandingkan yang lain, dan itulah rahmat Allah yang Dia berikan kepada siapa pun yang Dia kehendaki."
