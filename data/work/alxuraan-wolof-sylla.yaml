summary:
  ar: "ترجمة ولوفية لمعاني القرآن وضعها المفكر السنغالي أسان سيلا ونشرتها جمعية الدعوة الإسلامية العالمية في ليبيا سنة 2003 بالحرف اللاتيني الرسمي في السنغال، مع النص العربي في صفحة مقابلة على رواية حفص، دون حواشٍ، وبأسماء سور مترجمة إلى الولوفية؛ وهي مع ترجمة للأحمدية أول ترجمة كاملة حديثة إلى الولوفية، واعتمد فيها على دروس تفسير مسجلة لعلماء داكار وعلى تفسير ابن كثير وترجمات فرنسية."
  en: "A Wolof rendering of the meanings of the Qur'an by the Senegalese thinker Assane Sylla, published by the Libya-based World Islamic Call Society in 2003 in Senegal's official Latin script, with the Arabic text on the facing page in the Hafs reading, without footnotes, and with the sura names translated into Wolof; with an Ahmadiyya translation it is the first modern complete Wolof Qur'an, and it drew on recorded tafsir lessons of Dakar scholars, Ibn Kathir and French translations."
  ur: "قرآن کے معانی کا وولوف ترجمہ از سینیگالی مفکر اسان سیلا، جو لیبیا کی ورلڈ اسلامک کال سوسائٹی نے 2003 میں سینیگال کے سرکاری لاطینی رسم الخط میں شائع کیا، روایتِ حفص کے مطابق مقابل صفحے پر عربی متن کے ساتھ، بغیر حواشی کے، اور سورتوں کے نام وولوف میں؛ احمدیہ کے ایک ترجمے کے ساتھ یہ وولوف کا پہلا جدید مکمل ترجمہ ہے، اور اس میں داکار کے علما کے ریکارڈ شدہ دروسِ تفسیر، ابن کثیر اور فرانسیسی تراجم سے مدد لی گئی۔"
