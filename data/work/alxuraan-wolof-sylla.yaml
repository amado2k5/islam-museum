label: { ar: "الخوران: ترجمة معاني القرآن إلى الولوفية ⁦(أسان سيلا)⁩", en: "Alxuraan: the Wolof translation of Assane Sylla", ur: "الخوران: وولوف ترجمۂ قرآن ⁦(اسان سیلا)⁩", es: "Alxuraan: la traducción wólof de Assane Sylla", fr: "Alxuraan: la traduction wolof d’Assane Sylla", tr: "El-Hurran: Kur'an Anlamlarının Wolfiyye'ye (Asan Sila) Çevirisi", id: "Al-Khurran: Penerjemahan Makna Al-Qur'an ke dalam Wolfiyya (Asan Sila)" }
summary:
  ar: "ترجمة ولوفية لمعاني القرآن وضعها المفكر السنغالي أسان سيلا ونشرتها جمعية الدعوة الإسلامية العالمية في ليبيا سنة 2003 بالحرف اللاتيني الرسمي في السنغال، مع النص العربي في صفحة مقابلة على رواية حفص، دون حواشٍ، وبأسماء سور مترجمة إلى الولوفية؛ وهي مع ترجمة للأحمدية أول ترجمة كاملة حديثة إلى الولوفية، واعتمد فيها على دروس تفسير مسجلة لعلماء داكار وعلى تفسير ابن كثير وترجمات فرنسية."
  en: "A Wolof rendering of the meanings of the Qur'an by the Senegalese thinker Assane Sylla, published by the Libya-based World Islamic Call Society in 2003 in Senegal's official Latin script, with the Arabic text on the facing page in the Hafs reading, without footnotes, and with the sura names translated into Wolof; with an Ahmadiyya translation it is the first modern complete Wolof Qur'an, and it drew on recorded tafsir lessons of Dakar scholars, Ibn Kathir and French translations."
  ur: "قرآن کے معانی کا وولوف ترجمہ از سینیگالی مفکر اسان سیلا، جو لیبیا کی ورلڈ اسلامک کال سوسائٹی نے 2003 میں سینیگال کے سرکاری لاطینی رسم الخط میں شائع کیا، روایتِ حفص کے مطابق مقابل صفحے پر عربی متن کے ساتھ، بغیر حواشی کے، اور سورتوں کے نام وولوف میں؛ احمدیہ کے ایک ترجمے کے ساتھ یہ وولوف کا پہلا جدید مکمل ترجمہ ہے، اور اس میں داکار کے علما کے ریکارڈ شدہ دروسِ تفسیر، ابن کثیر اور فرانسیسی تراجم سے مدد لی گئی۔"
  es: "Una interpretación en wolof de los significados del Corán realizada por el pensador senegalés Assane Sylla, publicada por la World Islamic Call Society, con sede en Libia, en 2003 en el alfabeto latino oficial de Senegal, con el texto árabe en la página opuesta en lectura Hafs, sin notas a pie de página y con los nombres de las suras traducidos al wolof; con una traducción ahmadí, es el primer Corán wolof moderno completo, y se basó en lecciones de tafsir grabadas de eruditos de Dakar, Ibn Kathir y traducciones francesas."
  fr: "Une traduction en wolof des significations du Coran par le penseur sénégalais Assane Sylla, publiée par la World Islamic Call Society, basée en Libye, en 2003, en caractères latins officiels du Sénégal, avec le texte arabe sur la page en regard dans la lecture de Hafs, sans notes de bas de page, et avec les noms des sourates traduits en wolof; avec une traduction ahmadiyya, il s'agit du premier Coran complet moderne en wolof, et il s'appuie sur des leçons de tafsir enregistrées de savants de Dakar, d'Ibn Kathir et de traductions françaises."
  tr: "Kur'an'ın anlamlarının Wolfia çevirisi, Senegalli düşünür Assane Sila tarafından hazırlanmış ve 2003 yılında Libya'daki Dünya İslami Davah Derneği tarafından Senegal'de resmi Latin alfabesiyle yayımlanmıştır; Arapça metin Hafs'ın rivayetinin karşısında, kenar boşlukları olmadan ve sureler Wolfiyya'ya çevrilmiştir; bu çeviri Ahmediye çevirisi ve Dakar âlimlerinden kaydedilmiş tafsir dersleri, İbn Kathir'in tefsirleri ve Fransızca çevirilere dayanan ilk modern tam Wulufca çeviri ile birlikte yapılmıştır."
  id: "Terjemahan Wolfia tentang makna Al-Qur'an disiapkan oleh pemikir Senegal Assane Sila dan diterbitkan oleh Asosiasi Da'wah Islam Dunia di Libya pada tahun 2003 dalam aksara Latin resmi di Senegal, dengan teks Arab di halaman berlawanan dengan narasi Hafs, tanpa margin, dan surah diterjemahkan ke dalam Wolfiyya; terjemahan Ahmadiyya dan terjemahan lengkap modern pertama ke dalam Wulufian, berdasarkan pelajaran tafsir yang direkam dari ulama Dakar, tafsir Ibn Kathir, dan terjemahan Prancis."
