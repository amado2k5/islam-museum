id: work/fatwa-dar-alifta-eg-dividing-vowed-udhiyya-thirds
class: work
kind: fatwa
label: { ar: "حكم تقسيم الأضحية المنذورة أثلاثًا", en: "Dividing a vowed udhiyya into thirds", ur: "نذر والی قربانی کا تین حصوں میں تقسیم", es: "Dividir un udhiyya hecho en tercios" }
summary:
  ar: "سائل سأل عن تقسيم الأضحية المنذورة غير المعينة لجهة محددة أثلاثًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21930)⁩ أن تقسيم المنذورة غير المعينة لجهة كالفقراء وغيرهم أثلاثًا كشأن المستحب في الأصل جائز على ما فصّل الجواب."
  en: "A questioner asked about dividing a vowed udhiyya — not earmarked for a specific group — into thirds. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21930) answered that dividing an unassigned vowed sacrifice into thirds, like the recommended default, is permissible — as the answer details."
  ur: "ایک سائل نے نذر والی قربانی کو — جو کسی خاص گروہ کے لیے مقرر نہ ہو — تین حصوں میں بانٹنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21930)⁩ نے جواب دیا کہ غیر مقررہ نذر کی قربانی کو تین حصوں میں بانٹنا جائز ہے جیسا کہ اصولاً مستحب طریقہ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de dividir en tercios un udhiyya prometido —no destinado a un grupo específico—. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21930) respondió que dividir un sacrificio prometido no asignado en tercios, como se recomienda por defecto, es permisible, tal como se detalla en la respuesta."
