id: work/fatwa-binbaz-how-a-lawful-marriage-is-contracted
class: work
kind: fatwa
label: { ar: "كيفية النكاح الشرعي", en: "How a lawful marriage is contracted", ur: "شرعی نکاح کس طرح ہوتا ہے" }
summary:
  ar: "سؤال من شاب يريد الزواج ويسأل كيف يباشر زوجته على ما فعله النبي وما يرتديه وهل يبتعد عنها إن كانت حاملًا، أجاب فيه الشيخ ابن باز بأن الزواج الشرعي معروف: يخطب المرأة ويسأل عن دينها وحالها، فإذا عرف أنها صالحة مسلمة عقد له وليها عند بعض طلبة العلم بحضرة شاهدين عدلين، فيقول الولي زوجتك ويقول الزوج قبلت على مهر معروف بينهما بحسب ما تيسر، فيكون العقد بأربعة: الولي والزوج وشاهدان. وذكر أن بعض أهل العلم استحب للزوج إذا دخل على زوجته أن يصلي ركعتين ويدعو الله أن يوفق بينهما، وأن يسأل الله عند لمسها خيرها وخير ما جبلت عليه ويتعوذ من شرها وشر ما جبلت عليه، ثم يتصل بها إذا شاء. وفصّل في الحمل: إن حملت منه فلا بأس أن يطأها حاملًا، ولا يطأ الحائض ولا النفساء، أما إن دخل عليها فوجدها حاملًا من غيره فلها عدة من غيره والنكاح باطل."
  en: "A question from a young man who wished to marry and asked how to approach his wife in the way the Prophet did, what to wear, and whether to keep away from her if she is pregnant; Shaykh Ibn Baz answered that lawful marriage is well known: the man proposes to the woman and asks about her religion and circumstances, and once he knows she is a suitable Muslim, her guardian contracts the marriage for him in the presence of some students of knowledge who can explain what is proper, before two upright witnesses, the guardian saying 'I have married her to you' and the groom saying 'I accept', for a dower known between them according to their means, so that the contract rests on four: the guardian, the groom and two witnesses. He mentioned that some scholars recommended that the husband, on first entering upon his wife, pray two units and ask God to bring the two together, and that when he touches her he ask God for her good and the good of her nature and seek refuge from her evil and the evil of her nature, after which he may be intimate with her if he wishes. On pregnancy he distinguished: if she has conceived by him, there is no harm in intercourse while she is pregnant, though not during menstruation or post-natal bleeding; but if he entered upon her and found her pregnant by another man, she owes a waiting period for that other man and the marriage is void."
  ur: "ایک نوجوان کا سوال جو شادی کرنا چاہتا ہے اور پوچھتا ہے کہ نبی کے طریقے پر اپنی بیوی کے پاس کیسے جائے، کیا پہنے، اور اگر وہ حاملہ ہو تو کیا اس سے دور رہے؛ شیخ ابن باز نے جواب دیا کہ شرعی نکاح معروف ہے: مرد عورت کو پیغام دیتا ہے، اس کے دین اور حال کے بارے میں پوچھتا ہے، اور جب جان لے کہ وہ نیک مسلمان اور اس کے لیے مناسب ہے تو اس کا ولی کچھ طالبانِ علم کے پاس، جو اسے مناسب باتیں بتا سکیں، دو عادل گواہوں کی موجودگی میں اس کے لیے نکاح کرتا ہے، ولی کہتا ہے میں نے اس کا نکاح تم سے کر دیا اور دولہا کہتا ہے میں نے قبول کیا، دونوں کے درمیان معلوم مہر پر جو آسانی سے ممکن ہو؛ یوں عقد چار افراد پر قائم ہوتا ہے: ولی، دولہا اور دو گواہ۔ انہوں نے ذکر کیا کہ بعض اہلِ علم نے مستحب کہا کہ شوہر بیوی کے پاس پہلی بار جائے تو دو رکعت پڑھے اور اللہ سے دعا کرے کہ ان دونوں کے درمیان موافقت پیدا کرے، اور اسے چھوتے وقت اللہ سے اس کی اور اس کی فطرت کی بھلائی مانگے اور اس کی اور اس کی فطرت کی برائی سے پناہ مانگے، پھر چاہے تو اس سے قربت کرے۔ حمل کے بارے میں انہوں نے فرق کیا: اگر اس سے حاملہ ہو تو حمل میں قربت میں کوئی حرج نہیں، البتہ حیض اور نفاس میں نہیں؛ لیکن اگر وہ اس کے پاس گیا اور اسے کسی دوسرے سے حاملہ پایا تو اس پر دوسرے کی عدت ہے اور نکاح باطل ہے۔"
