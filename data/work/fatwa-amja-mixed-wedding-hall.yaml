id: work/fatwa-amja-mixed-wedding-hall
class: work
kind: fatwa
label: { ar: "حضور زفاف مختلط", en: "Attending a brother's wedding in a mixed hall", ur: "شادی کی مخلوط محفل میں شرکت", es: "Asistir a la boda de un hermano en un salón mixto.", fr: "Assister au mariage de son frère dans une salle mixte", tr: "Karma bir düğüne katılmak", id: "Menghadiri pernikahan campuran" }
summary:
  ar: "سألت فتاة منتقبة هل يجوز حضور زفاف أخيها في قاعة مختلطة قد تصحبها منكرات. أجاب د. وليد بن إدريس المنيسي ⁦(فتوى رقم 1873 بتاريخ 8 ديسمبر 2006)⁩ أن اجتماع الرجال والنساء في مكان واحد ليس محرمًا طالما لم تحصل خلوة بين رجل واحد وامرأة واحدة أجنبية عنه لا ثالث معهما في غرفة مغلقة وطالما لم يؤد الاجتماع إلى عمل محرم كتبرج النساء وخضوعهن بالقول ونحو ذلك مما يوقع في الفتنة، فإذا خلا الحفل من المنكرات فلا مانع من حضوره شرعًا ولو كان مختلطًا، وإذا وجدت بعض المنكرات وحضر بنية نصحهم ودعوتهم فالأعمال بالنيات، ونوصى بالحذر."
  en: "A veiled young woman asked whether she may attend her brother's wedding in a mixed hall possibly holding objectionable things. Dr. Walid ibn Idris al-Munaysi (fatwa no. 1873, 8 December 2006) answered that men and women gathering in one place is not forbidden so long as no seclusion occurs between a single man and a single unrelated woman with no third in a closed room, and so long as the gathering does not lead to forbidden acts such as women's display and soft speech or whatever stirs temptation; if the party is free of objectionables there is no legal bar to attending even mixed, and if some objectionables are present, attending with the intention of advising and inviting them is governed by intentions — with a caution to be careful."
  ur: "ایک لڑکی نے بھائی کی مخلوط شادی میں شرکت پوچھی۔ ڈاکٹر ولید المنيسي ⁦(فتویٰ 1873، 8 دسمبر 2006)⁩ کے مطابق اجتماع خود حرام نہیں — خلوہ اور منکرات نہ ہوں تو شرکت جائز؛ منکرات ہوں تو نصیحت کی نیت سے۔"
  es: "Una joven velada preguntó si podía asistir a la boda de su hermano en un salón mixto donde posiblemente se encontraran cosas inapropiadas. El Dr. Walid ibn Idris al-Munaysi (fatwa n.º 1873, 8 de diciembre de 2006) respondió que la reunión de hombres y mujeres en un mismo lugar no está prohibida siempre que no haya intimidad entre un hombre y una mujer sin parentesco, sin la presencia de una tercera persona en una habitación cerrada, y siempre que la reunión no dé lugar a actos prohibidos como exhibicionismo femenino, conversaciones inapropiadas o cualquier cosa que incite a la tentación; si la fiesta está libre de elementos inapropiados, no existe impedimento legal para asistir, incluso en reuniones mixtas, y si hay elementos inapropiados presentes, asistir con la intención de aconsejar e invitar a las personas se rige por las intenciones, con la advertencia de tener cuidado."
  fr: "Une jeune femme voilée a demandé si elle pouvait assister au mariage de son frère dans une salle mixte où pourraient se trouver des éléments répréhensibles. Le Dr Walid ibn Idris al-Munaysi (fatwa n° 1873, 8 décembre 2006) a répondu que la présence d'hommes et de femmes en un même lieu n'est pas interdite tant qu'aucun homme et aucune femme non apparentés ne se retrouvent seuls dans une pièce fermée, sans la présence d'une tierce personne, et tant que cette réunion n'entraîne pas d'actes interdits tels que l'exhibitionnisme féminin, les paroles douces ou tout ce qui pourrait susciter la tentation. Si la fête est exempte d'éléments répréhensibles, rien ne s'oppose légalement à y assister, même dans une salle mixte. En revanche, si des éléments répréhensibles sont présents, la présence de ces personnes dans le but de les conseiller et de les inviter est soumise à l'appréciation des intentions, avec la mise en garde d'agir avec prudence."
  tr: "Niqab takan bir kıza, kardeşinin düğününe karma bir salonda katılmasının ve ahlaksız davranışların eşlik edilip edilmeyeceğini sordum. Dr. Velid bin İdris El-Munisi (8 Aralık 2006 tarihli 1873 No'lu Fetva), erkek ve kadınların aynı yerde toplanmasının yasak olmadığını, bir erkek ile kendisiyle akraba olmayan bir kadın arasında inzivaya çekilmediği sürece yasak olmadığını ve üçüncü bir kişinin kapalı bir odada onlarla birlikte olmadığını söyledi. Toplanma, kadınların kendilerini göstermesi ve fitne sebep eden sözlere boyun eğmesi gibi yasak bir eyleme yol açmadığı sürece, tören ahlaksız eylemlerden arınmışsa, karışık olsa bile İslam hukukuna göre katılmaya itiraz yoktur. Bazı ahlaksız eylemler bulunursa ve kişi onları öğütlemek ve davet etmek amacıyla katılırsa, bu eylemler niyetlere dayanır ve dikkatli olunması tavsiye edilir."
  id: "Saya bertanya kepada seorang gadis yang mengenakan niqab apakah diperbolehkan menghadiri pernikahan saudaranya di aula campuran yang mungkin disertai dengan tindakan tidak bermoral. Dr. Walid bin Idris Al-Munisi (Fatwa No. 1873 tanggal 8 Desember 2006) menjawab bahwa pria dan wanita berkumpul di tempat yang sama tidak dilarang selama tidak ada pengasingan antara satu pria dan satu wanita yang tidak memiliki hubungan keluarga, bukan pihak ketiga yang bersama mereka di ruangan tertutup. Selama pertemuan tersebut tidak menyebabkan tindakan terlarang seperti wanita yang menunjukkan diri dan tunduk pada kata-kata atau tindakan serupa yang menyebabkan fitnah, maka jika upacara bebas dari tindakan tidak bermoral, tidak ada keberatan untuk menghadirinya menurut hukum Islam, meskipun itu campuran. Jika ditemukan beberapa tindakan tidak bermoral dan seseorang menghadiri dengan niat untuk memberi nasihat dan mengundangnya, maka tindakan tersebut didasarkan pada niat, dan kehati-hatian dianjurkan."
