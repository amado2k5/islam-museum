id: work/fatwa-amja-mixed-wedding-hall
class: work
kind: fatwa
label: { ar: "حضور زفاف مختلط", en: "Attending a brother's wedding in a mixed hall", ur: "شادی کی مخلوط محفل میں شرکت", es: "Asistir a la boda de un hermano en un salón mixto." }
summary:
  ar: "سألت فتاة منتقبة هل يجوز حضور زفاف أخيها في قاعة مختلطة قد تصحبها منكرات. أجاب د. وليد بن إدريس المنيسي ⁦(فتوى رقم 1873 بتاريخ 8 ديسمبر 2006)⁩ أن اجتماع الرجال والنساء في مكان واحد ليس محرمًا طالما لم تحصل خلوة بين رجل واحد وامرأة واحدة أجنبية عنه لا ثالث معهما في غرفة مغلقة وطالما لم يؤد الاجتماع إلى عمل محرم كتبرج النساء وخضوعهن بالقول ونحو ذلك مما يوقع في الفتنة، فإذا خلا الحفل من المنكرات فلا مانع من حضوره شرعًا ولو كان مختلطًا، وإذا وجدت بعض المنكرات وحضر بنية نصحهم ودعوتهم فالأعمال بالنيات، ونوصى بالحذر."
  en: "A veiled young woman asked whether she may attend her brother's wedding in a mixed hall possibly holding objectionable things. Dr. Walid ibn Idris al-Munaysi (fatwa no. 1873, 8 December 2006) answered that men and women gathering in one place is not forbidden so long as no seclusion occurs between a single man and a single unrelated woman with no third in a closed room, and so long as the gathering does not lead to forbidden acts such as women's display and soft speech or whatever stirs temptation; if the party is free of objectionables there is no legal bar to attending even mixed, and if some objectionables are present, attending with the intention of advising and inviting them is governed by intentions — with a caution to be careful."
  ur: "ایک لڑکی نے بھائی کی مخلوط شادی میں شرکت پوچھی۔ ڈاکٹر ولید المنيسي ⁦(فتویٰ 1873، 8 دسمبر 2006)⁩ کے مطابق اجتماع خود حرام نہیں — خلوہ اور منکرات نہ ہوں تو شرکت جائز؛ منکرات ہوں تو نصیحت کی نیت سے۔"
  es: "Una joven velada preguntó si podía asistir a la boda de su hermano en un salón mixto donde posiblemente se encontraran cosas inapropiadas. El Dr. Walid ibn Idris al-Munaysi (fatwa n.º 1873, 8 de diciembre de 2006) respondió que la reunión de hombres y mujeres en un mismo lugar no está prohibida siempre que no haya intimidad entre un hombre y una mujer sin parentesco, sin la presencia de una tercera persona en una habitación cerrada, y siempre que la reunión no dé lugar a actos prohibidos como exhibicionismo femenino, conversaciones inapropiadas o cualquier cosa que incite a la tentación; si la fiesta está libre de elementos inapropiados, no existe impedimento legal para asistir, incluso en reuniones mixtas, y si hay elementos inapropiados presentes, asistir con la intención de aconsejar e invitar a las personas se rige por las intenciones, con la advertencia de tener cuidado."
