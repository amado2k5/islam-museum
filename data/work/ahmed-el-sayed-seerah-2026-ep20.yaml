kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 20: سيرة رسول الله 20 | قيادة جعفر لمهاجري الحبشة وأثر التربية النبوية في ثباتهم"
  en: "The Biography of the Messenger of God 2026, episode 20: Ja'far's leadership of the emigrants to Abyssinia and the effect of prophetic upbringing on their steadfastness"
  ur: "سیرتِ رسول اللہ 2026، قسط 20: حبشہ کے مہاجرین پر جعفر کی قیادت اور ان کی ثابت قدمی پر نبوی تربیت کا اثر"
  fr: "La biographie du Messager de Dieu 2026, épisode 20 : Le commandement de Ja'far sur les émigrés en Abyssinie et l'effet de l'éducation prophétique sur leur fermeté"
  es: "La biografía del Mensajero de Dios 2026, episodio 20: El liderazgo de Ja'far sobre los emigrados a Abisinia y el efecto de la educación profética en su firmeza"
summary:
  ar: "الجلسة الثانية عن الهجرة إلى الحبشة. يعرّف المحاضر بخالد بن سعيد بن العاص وأسرته اعتمادًا على الذهبي والسهيلي، ثم يستأنف قائمة ابن إسحاق للمهاجرين بطنًا بطنًا، ثم يقرأ رواية أم سلمة الطويلة عن وفد قريش إلى النجاشي وخطبة جعفر وحكم النجاشي، ويستخلص منها دروسًا في التربية النبوية والقيادة."
  en: "The second session on the migration to Abyssinia. The speaker profiles Khalid ibn Said ibn al-As and his family from al-Dhahabi and al-Suhayli, resumes Ibn Ishaq's list of the emigrants clan by clan, then reads Umm Salama's long account of the Quraysh embassy to the Negus, Ja'far's speech and the Negus's verdict, drawing lessons on prophetic upbringing and leadership."
  ur: "حبشہ کی ہجرت پر دوسری نشست۔ مقرر ذہبی اور سہیلی کی بنیاد پر خالد بن سعید بن العاص اور ان کے خاندان کا تعارف کراتے ہیں، پھر ابن اسحاق کی مہاجرین کی فہرست قبیلہ بہ قبیلہ جاری رکھتے ہیں، اس کے بعد قریش کے وفد کے نجاشی کے پاس جانے کا ام سلمہ کا طویل بیان، جعفر کی تقریر اور نجاشی کا فیصلہ پڑھتے ہیں، اور ان سے نبوی تربیت اور قیادت کے اسباق اخذ کرتے ہیں۔"
  fr: "Deuxième séance sur l'émigration en Abyssinie. Le conférencier présente Khalid ibn Sa'id ibn al-As et sa famille d'après al-Dhahabi et al-Suhayli, reprend la liste d'Ibn Ishaq des émigrés clan par clan, puis lit le long récit d'Umm Salama sur l'ambassade de Quraysh auprès du Négus, le discours de Ja'far et le verdict du Négus, et en tire des leçons sur l'éducation prophétique et le commandement."
  es: "Segunda sesión sobre la emigración a Abisinia. El conferenciante presenta a Khalid ibn Sa'id ibn al-As y a su familia a partir de al-Dhahabi y al-Suhayli, retoma la lista de Ibn Ishaq de los emigrados clan por clan y lee después el largo relato de Umm Salama sobre la embajada de los Quraysh ante el Negus, el discurso de Ja'far y el veredicto del Negus, extrayendo lecciones sobre la educación profética y el liderazgo."
