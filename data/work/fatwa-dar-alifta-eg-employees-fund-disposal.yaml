label: { ar: "حكم جمعيات الموظفين والتصرف في أموال أصحابها بدون إذن", en: "Employees' rotating associations and disposing of members' money without permission", ur: "ملازمین کی بچت جمعیت اور بغیر اجازت رقم میں تصرف", es: "Asociaciones rotativas de empleados y disposición del dinero de los miembros sin permiso", fr: "Associations tournantes des employés et utilisation de l'argent des membres sans autorisation" }
summary:
  ar: "سائل سأل عن جمعية الموظفين والتصرف في أموال أصحابها بدون إذن. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20957)⁩ أن جمعية الموظفين جائزة شرعًا ولا يجوز لمن يقوم على إدارتها التصرف في الأموال بغير إذن أصحابها على ما فصّل الجواب."
  en: "A questioner asked about employees' rotating associations and disposing of members' money without permission. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20957) answered that the association is lawful, but whoever administers it may not dispose of the money without its owners' permission — as the answer details."
  ur: "ایک سائل نے ملازمین کی بچت جمعیت اور اس کے رکنوں کی رقم میں بغیر اجازت تصرف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20957)⁩ نے جواب دیا کہ جمعیت جائز ہے لیکن منتظم کو بغیر اجازت تصرف کا حق نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre las asociaciones rotativas de empleados y la disposición del dinero de los miembros sin autorización. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20957) respondió que la asociación es lícita, pero quien la administre no puede disponer del dinero sin el permiso de sus propietarios, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les associations à rotation des employés et la possibilité de disposer de l'argent de leurs membres sans leur autorisation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20957) a répondu que l'association est licite, mais que son administrateur ne peut disposer de l'argent sans l'accord des propriétaires, comme le précise la réponse."
