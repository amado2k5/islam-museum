summary:
  ar: "كتاب ليوسف القرضاوي في السياسة الشرعية على ضوء النصوص والمقاصد، صدرت طبعته الأولى عن مكتبة وهبة بالقاهرة سنة 1998 في 353 صفحة، ثم عن مؤسسة الرسالة ببيروت سنة 2000."
  en: "A book by Yusuf al-Qaradawi on governance according to the Sharia's texts and aims; its first edition was published by Maktabat Wahba, Cairo, in 1998 (353 pages), followed by a Mu'assasat al-Risala edition in Beirut in 2000."
  ur: "یوسف القرضاوی کی کتاب جو نصوص اور مقاصدِ شریعت کی روشنی میں سیاستِ شرعیہ پر ہے؛ اس کا پہلا ایڈیشن مکتبہ وہبہ، قاہرہ سے 1998ء میں 353 صفحات میں، پھر مؤسسۃ الرسالہ، بیروت سے 2000ء میں شائع ہوا۔"
  es: "Un libro de Yusuf al-Qaradawi sobre la gobernanza según los textos y objetivos de la Sharia; su primera edición fue publicada por Maktabat Wahba, El Cairo, en 1998 (353 páginas), seguida de una edición de Mu'assasat al-Risala en Beirut."
  fr: "Un ouvrage de Yusuf al-Qaradawi sur la gouvernance selon les textes et les objectifs de la charia; sa première édition a été publiée par Maktabat Wahba, au Caire, en 1998 (353 pages), suivie d'une édition Mu'assasat al-Risala à Beyrouth en 1998."
  tr: "Yusuf Al-Karadawi'nin metinler ve hedefler ışığında Şeriat siyaseti üzerine yazdığı kitabın ilk baskısı 1998'de Kahire'deki Wahba Kütüphanesi tarafından 353 sayfa olarak, ardından 2000'de Beyrut'taki Al-Risala Vakfı tarafından yayımlandı."
  id: "Sebuah buku karya Yusuf Al-Qaradawi tentang politik Syariah dalam konteks teks dan tujuan, edisi pertamanya diterbitkan oleh Perpustakaan Wahba di Kairo pada tahun 1998 dengan 353 halaman, kemudian oleh Al-Risala Foundation di Beirut pada tahun 2000."
