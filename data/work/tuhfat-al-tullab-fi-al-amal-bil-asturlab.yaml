label: { ar: "تحفة الطلاب في العمل بالأسطرلاب ⁦(ابن الصفار)⁩", en: "Tuhfat al-tullab fi al-amal bil-asturlab (Ibn al-Saffar)", ur: "تحفۃ الطلاب فی العمل بالاسطرلاب ⁦(ابن الصفار)⁩", tr: "Astrolab Çalışmalarında Öğrencilerin Başyapıtı (İbn el-Saffar)", id: "Mahakarya Mahasiswa dalam Astrolabe (Ibn Al-Saffar)" }
summary:
  ar: "رسالة لأبي القاسم ابن الصفار الأندلسي في استعمال الأسطرلاب، تُرجمت إلى اللاتينية نحو 1134م وإلى العبرية في أواخر القرن الثالث عشر، ولها نسخة في مكتبة الأزهر {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 15}."
  en: "Treatise by Abu al-Qasim Ibn al-Saffar al-Andalusi on using the astrolabe, translated into Latin about 1134 and into Hebrew in the late thirteenth century, with a copy in al-Azhar Library {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 15}."
  ur: "اسطرلاب کے استعمال پر ابو القاسم ابن الصفار اندلسی کا رسالہ، جس کا تقریباً 1134ء میں لاطینی اور تیرھویں صدی کے اواخر میں عبرانی ترجمہ ہوا، اور جس کا ایک نسخہ ازہر لائبریری میں ہے {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 15}۔"
  es: "Tratado de Abu al-Qasim Ibn al-Saffar al-Andalusi sobre el uso del astrolabio, traducido al latín alrededor de 1134 y al hebreo a finales del siglo XIII, con una copia en la Biblioteca de al-Azhar {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 15}."
  fr: "Traité d'Abu al-Qasim Ibn al-Saffar al-Andalusi sur l'utilisation de l'astrolabe, traduit en latin vers 1134 et en hébreu à la fin du XIIIe siècle, avec une copie à la bibliothèque d'al-Azhar {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 15}."
  tr: "Abu al-Kasim ibn al-Saffar al-Andalusi tarafından astrolabın kullanımı üzerine bir risale, yaklaşık 1134 yılında Latince'ye ve on üçüncü yüzyılın sonlarında İbranice'ye çevrilmiş ve El-Ezher Kütüphanesi'nde bir kopyası bulunmaktadır {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 15}."
  id: "Sebuah risalah oleh Abu al-Qasim ibn al-Saffar al-Andalusi tentang penggunaan astrolab, diterjemahkan ke dalam bahasa Latin sekitar tahun 1134 M dan ke dalam bahasa Ibrani pada akhir abad ketiga belas, dan memiliki salinannya di Perpustakaan Al-Azhar {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 14} {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 15}."
