summary:
  ar: "محرك بحث إسلامي على الإنترنت أُطلق في 9 يوليو 2013، كان يجمع النتائج من محركات أخرى مثل غوغل وبينغ ويعرض ما يعدّه حلالًا ويحجب ما يعدّه محرّمًا بحسب الشريعة؛ تناقلت إطلاقه وكالات وصحف في آسيا وأوروبا، وتذكر ويكيبيديا أنه يبدو متوقفًا منذ فبراير 2025."
  en: "An Islamic internet search engine launched on 9 July 2013 that gathered results from other engines such as Google and Bing and showed what it deemed halal, blocking what it deemed haram by Sharia; its launch was reported by agencies and papers in Asia and Europe, and Wikipedia says it appears defunct since February 2025."
  ur: "اسلامی انٹرنیٹ سرچ انجن جو 9 جولائی 2013 کو شروع ہوا؛ گوگل اور بنگ جیسے انجنوں کے نتائج جمع کر کے وہ دکھاتا جسے حلال سمجھتا اور جسے شریعت کے مطابق حرام سمجھتا اسے روکتا؛ ایشیا اور یورپ کے اداروں نے اس کے آغاز کی خبر دی، اور ویکیپیڈیا کے مطابق فروری 2025 سے بظاہر بند ہے۔"
