  tr: "Helal Google'da arama (Arama Motoru)"
  id: "Googling Halal (Mesin Pencari)"
summary:
  ar: "محرك بحث إسلامي على الإنترنت أُطلق في 9 يوليو 2013، كان يجمع النتائج من محركات أخرى مثل غوغل وبينغ ويعرض ما يعدّه حلالًا ويحجب ما يعدّه محرّمًا بحسب الشريعة؛ تناقلت إطلاقه وكالات وصحف في آسيا وأوروبا، وتذكر ويكيبيديا أنه يبدو متوقفًا منذ فبراير 2025."
  en: "An Islamic internet search engine launched on 9 July 2013 that gathered results from other engines such as Google and Bing and showed what it deemed halal, blocking what it deemed haram by Sharia; its launch was reported by agencies and papers in Asia and Europe, and Wikipedia says it appears defunct since February 2025."
  ur: "اسلامی انٹرنیٹ سرچ انجن جو 9 جولائی 2013 کو شروع ہوا؛ گوگل اور بنگ جیسے انجنوں کے نتائج جمع کر کے وہ دکھاتا جسے حلال سمجھتا اور جسے شریعت کے مطابق حرام سمجھتا اسے روکتا؛ ایشیا اور یورپ کے اداروں نے اس کے آغاز کی خبر دی، اور ویکیپیڈیا کے مطابق فروری 2025 سے بظاہر بند ہے۔"
  es: "El 9 de julio de 2013 se lanzó un motor de búsqueda islámico en internet que recopilaba resultados de otros motores como Google y Bing y mostraba lo que consideraba halal, bloqueando lo que consideraba haram según la Sharia; agencias y periódicos de Asia y Europa informaron sobre su lanzamiento, y Wikipedia afirma que parece estar inactivo desde febrero de 2025."
  fr: "Un moteur de recherche islamique a été lancé le 9 juillet 2013. Il collectait les résultats d'autres moteurs comme Google et Bing et affichait ce qu'il considérait comme halal, bloquant ce qu'il jugeait haram selon la charia. Son lancement a été rapporté par des agences et des journaux en Asie et en Europe, et Wikipédia indique qu'il semble inactif depuis février 2025."
  tr: "9 Temmuz 2013'te başlatılan İslami bir çevrimiçi arama motoru olan bu motor, Google ve Bing gibi diğer motorlardan sonuç topladı, helal olarak gördüğü şeyleri gösterdi ve Şeriat'a göre yasak gördüklerini sakladı; lansmanı Asya ve Avrupa'daki ajanslar ve gazeteler tarafından dolaşıma girdi ve Wikipedia, Şubat 2025'ten beri askıya alındığını belirtiyor."
  id: "Mesin pencari online Islam yang diluncurkan pada 9 Juli 2013, mengumpulkan hasil dari mesin lain seperti Google dan Bing, menampilkan apa yang dianggap halal, dan menahan apa yang dianggap dilarang menurut Syariah; peluncurannya disebarkan oleh lembaga dan surat kabar di Asia dan Eropa, dan Wikipedia mencatat bahwa tampaknya mesin ini telah ditangguhkan sejak Februari 2025."
