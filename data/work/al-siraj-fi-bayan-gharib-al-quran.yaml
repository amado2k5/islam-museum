summary:
  ar: "مختصر معاصر في معاني غريب ألفاظ القرآن على ترتيب السور، للدكتور محمد بن عبد العزيز الخضيري، جمعه «من كتب التفسير والغريب ومعاني القرآن القديمة والمعاصرة»، وسهّل عبارته وحاول صياغة الأقوال المختلفة في عبارة واحدة جامعة متى أمكن، وإلا لجأ إلى الترجيح؛ نشره كرسي القرآن الكريم وعلومه بجامعة الملك سعود {cite:siraj-gharib-quran-khudayri-1435 p.2} {cite:siraj-gharib-quran-khudayri-1435 p.6}."
  en: "A contemporary concise work on the meanings of the rare words of the Qur'an in sura order, by Dr Muhammad ibn Abd al-Aziz al-Khudayri, compiled 'from old and modern books of tafsir, gharib and ma'ani al-Qur'an', in simplified wording, combining differing views into one comprehensive phrase where possible and otherwise choosing between them; published by the Chair of the Holy Qur'an and its Sciences at King Saud University."
