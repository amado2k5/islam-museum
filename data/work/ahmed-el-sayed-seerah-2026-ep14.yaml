class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 14: كيف غيّر الإسلام أسماء العرب؟"
  en: "The Biography of the Messenger of God 2026, episode 14: How did Islam change Arab names?"
  ur: "سیرتِ رسول اللہ 2026، قسط 14: اسلام نے عربوں کے نام کیسے بدلے؟"
  fr: "La biographie du Messager de Dieu 2026, épisode 14 : Comment l'Islam a-t-il changé les noms des Arabes ?"
  es: "La biografía del Mensajero de Dios 2026, episodio 14: ¿Cómo cambió el islam los nombres de los árabes?"
summary:
  ar: "يقدّم المتحدث ترجمة أبي سلمة المخزومي من كتاب أهل بدر، ثم عرضًا لبني مخزوم ونسل المغيرة من كتاب في أنساب قريش. ويتأمل كيف غيّر الإسلام أسماء العرب، ويعود إلى رواية ابن هشام عن مجلس الوليد في موسم الحج، وأسباب رفض قريش للدعوة، وملاحظات السهيلي اللغوية."
  en: "The speaker presents the biography of Abu Salama al-Makhzumi from the book on the Badr veterans, then a survey of the Makhzum clan and the line of al-Mughira from a Quraysh genealogy book. He reflects on how Islam changed Arab naming and returns to Ibn Hisham's account of al-Walid's council at the pilgrimage season, the reasons for Quraysh's rejection, and al-Suhayli's linguistic notes."
  ur: "مقرر بدریوں پر لکھی گئی کتاب سے ابو سلمہ مخزومی کی سوانح پیش کرتے ہیں، پھر قریش کے انساب کی ایک کتاب سے بنو مخزوم اور مغیرہ کی نسل کا جائزہ لیتے ہیں۔ وہ اس پر غور کرتے ہیں کہ اسلام نے عربوں کے ناموں کو کیسے بدلا، اور پھر ابن ہشام کی اس روایت کی طرف لوٹتے ہیں جو حج کے موسم میں ولید کی مجلس، قریش کے انکار کے اسباب اور سہیلی کے لغوی نکات سے متعلق ہے۔"
  fr: "Le conférencier présente la biographie d'Abu Salama al-Makhzumi tirée du livre sur les vétérans de Badr, puis un aperçu du clan Makhzum et de la lignée d'al-Mughira d'après un livre de généalogie de Quraysh. Il réfléchit à la façon dont l'Islam a changé les noms des Arabes et revient au récit d'Ibn Hisham sur le conseil d'al-Walid à la saison du pèlerinage, aux raisons du rejet de Quraysh et aux notes linguistiques d'al-Suhayli."
  es: "El conferenciante presenta la biografía de Abu Salama al-Makhzumi tomada del libro sobre los veteranos de Badr y luego un repaso del clan Makhzum y la línea de al-Mughira a partir de un libro de genealogía de Quraysh. Reflexiona sobre cómo el islam cambió los nombres de los árabes y vuelve al relato de Ibn Hisham sobre el consejo de al-Walid en la temporada de la peregrinación, las razones del rechazo de Quraysh y las notas lingüísticas de al-Suhayli."
