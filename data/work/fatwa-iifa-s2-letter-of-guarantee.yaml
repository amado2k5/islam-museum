label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن خطاب الضمان", en: "IIFA resolution on the letter of guarantee", ur: "اکیڈمی کی قرارداد: ضمانت نامہ ⁦(لیٹر آف گارنٹی)⁩", es: "Resolución de la IIFA sobre la carta de garantía" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن خطاب الضمان: قرر عدم جواز أخذ العوض على الكفالة لأن أداء الكفيل مبلغ الضمان يشبه القرض الذي جر نفعًا على المقرض وهو ممنوع شرعًا، فلا يجوز أخذ الأجر على خطاب الضمان لقاء عملية الضمان سواء بغطاء أم بدونه، وتجوز المصاريف الإدارية لإصداره على ما فصّل القرار."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on the letter of guarantee: no fee may be taken on the guarantee itself — the guarantor paying the sum resembles a loan drawing benefit to the lender, which is prohibited — whether the letter is covered or not, while the administrative costs of issuing it are permissible, as the resolution details."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ لیٹر آف گارنٹی پر: ضمانت پر معاوضہ جائز نہیں کیونکہ یہ سود جیسا ہے؛ البتہ جاری کرنے کی انتظامی فیس جائز ہے۔"
  es: "Resolución de la IIFA de su segunda sesión (Kuwait, diciembre de 1985) sobre la carta de garantía: no se puede cobrar ninguna comisión por la garantía en sí misma, ya que el pago de dicha suma por parte del garante se asemeja a un préstamo que beneficia al prestamista, lo cual está prohibido, independientemente de si la carta está cubierta o no, mientras que los gastos administrativos de su emisión son permisibles, como se detalla en la resolución."
