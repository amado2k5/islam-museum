summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن خطاب الضمان: قرر عدم جواز أخذ العوض على الكفالة لأن أداء الكفيل مبلغ الضمان يشبه القرض الذي جر نفعًا على المقرض وهو ممنوع شرعًا، فلا يجوز أخذ الأجر على خطاب الضمان لقاء عملية الضمان سواء بغطاء أم بدونه، وتجوز المصاريف الإدارية لإصداره على ما فصّل القرار."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on the letter of guarantee: no fee may be taken on the guarantee itself — the guarantor paying the sum resembles a loan drawing benefit to the lender, which is prohibited — whether the letter is covered or not, while the administrative costs of issuing it are permissible, as the resolution details."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ لیٹر آف گارنٹی پر: ضمانت پر معاوضہ جائز نہیں کیونکہ یہ سود جیسا ہے؛ البتہ جاری کرنے کی انتظامی فیس جائز ہے۔"
  es: "Resolución de la IIFA de su segunda sesión (Kuwait, diciembre de 1985) sobre la carta de garantía: no se puede cobrar ninguna comisión por la garantía en sí misma, ya que el pago de dicha suma por parte del garante se asemeja a un préstamo que beneficia al prestamista, lo cual está prohibido, independientemente de si la carta está cubierta o no, mientras que los gastos administrativos de su emisión son permisibles, como se detalla en la resolución."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985) sur la lettre de garantie: aucun frais ne peut être perçu sur la garantie elle-même — le garant payant la somme s'apparente à un prêt tirant profit du prêteur, ce qui est interdit — que la lettre soit couverte ou non, tandis que les frais administratifs de son émission sont autorisés, comme le précise la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin ikinci oturumunda (Kuveyt, Aralık 1985) garanti mektubu ile ilgili kararı: Garanti için tazminat alınmasının mümkün olmadığına karar verilmiştir çünkü garantörün teminat tutarını ödemesi, kredi verenin yararına olan bir krediye benzer ve dini olarak yasaktır. Bu nedenle, garanti mektubunun ödeme süreci karşılığında teminat altında veya teminatsız olarak alınması mümkün değildir ve kararda belirtildiği gibi düzenleme için idari giderler kabul edilebilirdir."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keduanya (Kuwait, Desember 1985) mengenai surat jaminan: Diputuskan bahwa tidak diperbolehkan menerima kompensasi atas jaminan karena pembayaran jaminan oleh penjamin serupa dengan pinjaman yang menguntungkan pemberi pinjaman, yang secara agama dilarang. Oleh karena itu, tidak diperbolehkan menerima pembayaran surat jaminan sebagai imbalan atas proses jaminan, baik dalam perlindungan maupun tanpa perlindungan, dan biaya administrasi untuk penerbitannya diperbolehkan sebagaimana dijelaskan dalam keputusan."
