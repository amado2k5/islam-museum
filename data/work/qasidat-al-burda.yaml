  tr: "Müslümanlar arasında en ünlü övgü şiirlerinden biri olan 'Al-Burda' şiirinin ön kartı olan 'Al-Busiri Al-Durriya'nın Övgü Yıldızları'; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk puisi 'Al-Burda,' 'Bintang-bintang Al-Busiri Al-Durriya dalam Pujian,' puisi pujian paling terkenal di kalangan Muslim; sumber-sumbernya di halaman belum ditinjau."
