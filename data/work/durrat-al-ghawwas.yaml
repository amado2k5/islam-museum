summary:
  ar: "درة الغواص في أوهام الخواص للحريري، كتاب في أخطاء الناس في اللغة، ذيّل عليه الجواليقي بكتابه «تكملة إصلاح ما تغلط فيه العامة»، وشرحه شهاب الدين الخفاجي شرحاً نقدياً كتبه لمراد الرابع وطُبع في إسطنبول سنة ١٢٩٩هـ."
  en: "al-Hariri's Durrat al-ghawwas fi awham al-khawass, a book on the mistakes people make in the language. al-Jawaliqi added a supplement to it, Takmilat islah ma taghlat fihi al-amma, and Shihab al-Din al-Khafaji wrote a critical commentary on it for Murad IV, printed at Istanbul in 1299 AH."
  es: "La Durrat al-ghawwas fi awham al-khawass de al-Hariri, un libro sobre los errores que comete la gente en la lengua. Al-Jawaliqi le añadió un suplemento, Takmilat islah ma taghlat fihi al-amma, y Shihab al-Din al-Khafaji escribió un comentario crítico para Murad IV, impreso en Estambul en 1299 AH."
  fr: "La Durrat al-ghawwas fi awham al-khawass d'al-Hariri, livre sur les fautes que les gens commettent dans la langue. Al-Jawaliqi y ajouta un supplément, Takmilat islah ma taghlat fihi al-amma, et Shihab al-Din al-Khafaji en écrivit un commentaire critique pour Murad IV, imprimé à Istanbul en 1299 AH."
  ur: "حریری کی درۃ الغواص فی اوہام الخواص، زبان میں لوگوں کی غلطیوں پر کتاب۔ جوالیقی نے اس پر تکملۃ اصلاح ما تغلط فیہ العامہ کے نام سے ذیل لکھی، اور شہاب الدین خفاجی نے مراد چہارم کے لیے اس کی تنقیدی شرح لکھی جو استنبول میں 1299ھ میں چھپی۔"
