label: { ar: "قرار مجمع الفقه الإسلامي الدولي 129 (14/3) بشأن عقد المقاولة والتعمير: حقيقته، تكييفه، صوره", en: "IIFA resolution 129 (14/3) on the contracting ⁦(muqawala)⁩ and construction contract: its nature, characterisation and forms", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 129 (14/3): عقدِ مقاولت اور تعمیر — حقیقت، تخفیظ اور صورتیں", es: "Resolución 129 (14/3) de la IIFA sobre la contratación (muqawala) y el contrato de construcción: su naturaleza, caracterización y formas.", fr: "Résolution 129 (14/3) de l'IIFA relative au contrat de passation de marchés (muqawala) et au contrat de construction: sa nature, sa caractérisation et ses formes", tr: "Uluslararası İslami Fiqh Akademisi Kararı 129 (14/3) ile ilgili sözleşme ve kentsel yeniden inşa sözleşmesi: gerçekliği, karakterizasyonu ve biçimi", id: "Keputusan Akademi Fiqh Islam Internasional 129 (14/3) mengenai kontrak kontrak dan rekonstruksi perkotaan: realitas, karakterisasi, dan bentuknya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩، مراعاة لأدلة الشرع وقواعده ولمكانة عقد المقاولة في تنشيط الصناعة والتمويل والاقتصاد. عرّف المقاولة بأنها عقد يتعهد أحد طرفيه بمقتضاه أن يصنع شيئًا أو يؤدي عملًا مقابل بدل يتعهد به الطرف الآخر، وقرر جوازه سواء قدم المقاول العمل والمادة ⁦(الاستصناع عند الفقهاء)⁩ أو قدم العمل فقط ⁦(الإجارة على العمل)⁩، مع إحالة الصورة الأولى إلى قرار المجمع 65 ⁦(7/3)⁩ بشأن الاستصناع، واشتراط في الثانية أن يكون الأجر معلومًا مقدارًا وكيفية. ثم عالج صور العقد وشروطه وما يطرأ عليه من تعديل."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003), mindful of the contract's role in industry, finance and the Islamic economy. It defined muqawala as a contract whereby one party undertakes to make a thing or do work against a consideration undertaken by the other; ruled it lawful whether the contractor supplies work and material (the jurists' istisna') or work alone (hire-of-work ijara) — referring the first form to resolution 65 (7/3) on istisna' and requiring in the second that the wage be known in amount and manner. It then treated the contract's forms, conditions and modifications."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں، اس عقد کی صنعت، مالیات اور اسلامی معیشت میں اہمیت کے پیشِ نظر۔ اس نے مقاولت کی تعریف کی: عقد جس میں ایک فریق کسی چیز کی تعمیر یا کام کی انجام دہی کا عہد کرے بدلے کے عوض جو دوسرا فریق ادا کرے؛ فیصلہ: یہ جائز ہے خواہ مقاول کام اور مادہ دونوں دیں ⁦(فقہاء کی استصناع)⁩ یا صرف کام ⁦(اجارہ برائے کام)⁩ — پہلی صورت کو قرارداد 65 ⁦(7/3)⁩ کی طرف رجوع اور دوسری میں اجرت معلوم و مقدار و طور کی شرط۔ پھر عقد کی صورتیں، شرائط اور ترامیم۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (8-13 de Dhu al-Qa'da de 1423, 11-16 de enero de 2003), teniendo en cuenta el papel del contrato en la industria, las finanzas y la economía islámica. Definió la muqawala como un contrato por el cual una parte se compromete a fabricar un bien o realizar un trabajo a cambio de una contraprestación asumida por la otra; dictaminó que es lícito tanto si el contratista suministra la obra y los materiales (el istisna' de los juristas) como si solo suministra la obra (el ijara de contratación de obra), remitiendo la primera forma a la resolución 65 (7/3) sobre istisna' y exigiendo en la segunda que se conozca el salario en cuanto a importe y forma. A continuación, trató las formas, condiciones y modificaciones del contrato."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003), consciente du rôle du contrat dans l'industrie, la finance et l'économie islamique, a défini la muqawala comme un contrat par lequel une partie s'engage à réaliser une prestation ou un travail en contrepartie d'une contrepartie fournie par l'autre. Elle a jugé licite que le contractant fournisse à la fois la main-d'œuvre et les matériaux (istisna' des juristes) ou uniquement la main-d'œuvre (ijara de travail à façon), renvoyant la première forme à la résolution 65 (7/3) sur l'istisna' et exigeant, dans la seconde, que le montant et les modalités de la rémunération soient connus. Elle a ensuite examiné les formes, les conditions et les modifications du contrat."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dördüncü oturumunda (8–13 Dhu al-Qi'dah 1423H, 11–16 Ocak 2003) Doha'da verilen toplu karar, Şeriat'ın kanıtları ve kuralları ile sözleşmenin sanayi, finans ve ekonomiyi canlandırmadaki statüsünü dikkate almıştır. Bu sözleşme, bir tarafın diğer taraf tarafından üstlenilen tazminat karşılığında bir şey üretmeyi veya iş yapmayı taahhüt ettiği ve yüklenicinin işi ve ürünü (hukukçulara göre istisna') ya da sadece (iş için kiralama) yapıp yapmadığına izin verildiği belirlenmiştir; ilk versiyonda Meclis'in istisna' ile ilgili 65 (7/3) sayılı kararına atıfta bulunulmuş, ikinci versiyonda ise ücretin miktar ve usul olarak belirtilmesini şart koşmuştur. Daha sonra sözleşmenin formları, koşulları ve herhangi bir değişikliği ele almıştır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi keempat belas di Doha (8–13 Dhu al-Qi'dah 1423H, 11–16 Januari 2003), dengan mempertimbangkan bukti dan aturan Syariah serta status kontrak dalam merangsang industri, keuangan, dan ekonomi. Keputusan ini menetapkan kontrak di mana satu pihak berkomitmen untuk memproduksi sesuatu atau melakukan pekerjaan sebagai imbalan atas kompensasi yang dilakukan oleh pihak lain, dan diperbolehkan apakah kontraktor melakukan pekerjaan dan barang tersebut (istisna' menurut ahli hukum) atau hanya (sewa untuk pekerjaan), dengan versi pertama merujuk pada keputusan Majelis 65 (7/3) mengenai istisna', dan dalam versi kedua menetapkan bahwa biaya harus ditentukan dalam jumlah dan cara. Kemudian disebutkan bentuk, syarat, dan setiap modifikasi kontrak."
