summary:
  ar: "المعجم الوسيط من معاجم مجمع اللغة العربية بالقاهرة الذي أُنشئ سنة ١٩٣٢م. ومن أهدافه معجم يبين تطور العربية تاريخياً، وقد توقف عمل المستشرق أوغست فيشر نحو معجم عربي يقابل معجم أكسفورد الإنجليزي بالحرب العالمية الثانية ووفاته سنة ١٩٤٩م، واستمر الإعداد للمعجم الكبير وقُدمت نسخة نموذجية من ٥٠٠ صفحة إلى المختصين سنة ١٩٥٦م. وبطلب من وزارة المعارف المصرية سنة ١٩٣٦م لمعجم متوسط الحجم يضم المصطلحات العلمية والفنية مع الأشكال والصور نشأ الوسيط. محفوظ الحقوق ويوصف هنا فقط."
  en: "al-Mu'jam al-Wasit, one of the dictionaries of the Arabic Language Academy of Cairo, founded in 1932. One of the Academy's aims was a dictionary showing the historical development of Arabic; August Fischer's work towards an Arabic counterpart of the Oxford English Dictionary stopped with the Second World War and his death in 1949, preparations for al-Mu'jam al-kabir went on, and a 500-page specimen volume was submitted to specialists in 1956. The Egyptian Ministry of Education's request in 1936 for a medium-sized dictionary of scientific and technical terms, with figures and illustrations, led to the Wasit. It remains in copyright and is described here only."
  es: "El al-Mu'jam al-Wasit, uno de los diccionarios de la Academia de la Lengua Árabe de El Cairo, fundada en 1932. Uno de sus fines era un diccionario que mostrara el desarrollo histórico del árabe; el trabajo de August Fischer hacia un equivalente árabe del Oxford English Dictionary se detuvo con la Segunda Guerra Mundial y su muerte en 1949, continuaron los preparativos del al-Mu'jam al-kabir y en 1956 se presentó a los especialistas un volumen de muestra de 500 páginas. La petición del Ministerio de Educación egipcio en 1936 de un diccionario de tamaño medio de términos científicos y técnicos, con figuras e ilustraciones, dio lugar al Wasit. Sigue protegido por derechos de autor y aquí solo se describe."
  fr: "Le al-Mu'jam al-Wasit, l'un des dictionnaires de l'Académie de langue arabe du Caire, fondée en 1932. L'un de ses buts était un dictionnaire montrant le développement historique de l'arabe ; le travail d'August Fischer vers un équivalent arabe de l'Oxford English Dictionary s'arrêta avec la Seconde Guerre mondiale et sa mort en 1949, les préparatifs du al-Mu'jam al-kabir se poursuivirent et un volume spécimen de 500 pages fut soumis aux spécialistes en 1956. La demande du ministère égyptien de l'Éducation en 1936 d'un dictionnaire de taille moyenne de termes scientifiques et techniques, avec figures et illustrations, donna le Wasit. Il reste sous droit d'auteur et n'est ici que décrit."
  ur: "المعجم الوسیط، قاہرہ کی مجمع اللغۃ العربیہ کی لغات میں سے ایک، جو 1932ء میں قائم ہوئی۔ اس کے مقاصد میں ایک ایسی لغت تھی جو عربی کی تاریخی نشوونما دکھائے؛ اوگسٹ فشر کا آکسفورڈ انگلش ڈکشنری کے مقابل عربی لغت کی طرف کام دوسری جنگِ عظیم اور 1949ء میں ان کی وفات سے رک گیا، المعجم الکبیر کی تیاری جاری رہی اور 1956ء میں 500 صفحات کی نمونہ جلد ماہرین کو پیش کی گئی۔ مصری وزارتِ تعلیم کی 1936ء میں متوسط حجم کی سائنسی اور فنی اصطلاحات پر مشتمل، شکلوں اور تصویروں کے ساتھ لغت کی درخواست سے الوسیط وجود میں آئی۔ یہ کاپی رائٹ میں ہے اور یہاں صرف اس کا بیان ہے۔"
  tr: "Al-Mu'jam Al-Waseet, 1932 yılında kurulan Kahire Arap Dili Akademisi'nin sözlüklerinden biridir. Amaçlarından biri, Arapçanın tarihsel gelişimini gösteren bir sözlüktür. Oryantalist August Fischer'in çalışmaları, II. Dünya Savaşı sırasında İngilizce Oxford Sözlüğü'ne karşılık gelen bir Arapça sözlük üzerinde çalışmayı bırakmış ve 1949'da ölmüştür. Büyük Sözlük için hazırlıklar devam etmiş ve 1956'da uzmanlara 500 sayfalık model bir versiyon sunulmuştur. 1936'da Mısır Eğitim Bakanlığı'nın bilimsel ve sanatsal terimlerle şekil ve imgeleri içeren orta boyutlu bir sözlük talebi üzerine Al-Waseet kurulmuştur. Hakları saklıdır ve burada açıklanmıştır."
  id: "Al-Mu'jam Al-Waseet adalah salah satu kamus Akademi Bahasa Arab di Kairo, yang didirikan pada tahun 1932. Salah satu tujuannya adalah kamus yang menunjukkan perkembangan historis bahasa Arab. Karya orientalis August Fischer berhenti mengerjakan kamus Arab yang sesuai dengan Kamus Oxford Inggris selama Perang Dunia II, dan ia meninggal pada tahun 1949. Persiapan untuk Kamus Besar berlanjut, dan versi model 500 halaman diserahkan kepada para ahli pada tahun 1956. Atas permintaan Kementerian Pendidikan Mesir pada tahun 1936 untuk kamus berukuran sedang yang berisi istilah ilmiah dan artistik dengan bentuk dan gambar, Al-Waseet didirikan. Hak dilindungi dan dijelaskan di sini."
