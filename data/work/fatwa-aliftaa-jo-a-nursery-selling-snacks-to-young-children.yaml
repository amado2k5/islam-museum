id: work/fatwa-aliftaa-jo-a-nursery-selling-snacks-to-young-children
class: work
kind: fatwa
label: { ar: "حضانة تبيع المأكولات لأطفال غير مميزين", en: "A nursery selling snacks to children too young to discern", ur: "ناسمجھ بچوں کو کھانے کی چیزیں بیچنے والی نرسری", es: "Una guardería que vende bocadillos a niños demasiado pequeños para discernir.", fr: "Une crèche vendant des en-cas à des enfants trop jeunes pour discerner" }
summary:
  ar: "سؤال عن حضانة تبيع المأكولات لأطفال غير مميزين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في بيع الصغير غير المميز وشرائه للأشياء اليسيرة بإذن وليه وفيما جرى به العرف، أخذًا بمذهب الحنابلة، والأولى أن يرسل الأهل الطعام أو يتعاقدوا مع إدارة المدرسة. أجابت الدائرة بأن الفقهاء اتفقوا على عدم صحة بيع الصغير غير المميز وشرائه في الأمور ذات القيمة المعتبرة، ونقلت عن الماوردي في الحاوي الكبير (5/368) أن شراء الصبي باطل عند الشافعية ولا يتوقف على إجازة الولي، وقالت إن الأولى أن يعطي الأهل الصغار ما يحتاجونه أو يتعاقدوا مع إدارة المدرسة على إعطائهم من المقصف. وقالت إنه إذا تعذر ذلك فقد ذهب الحنابلة إلى صحة تصرف غير المميز في الأشياء اليسيرة، ونقلت عن ابن قدامة في المغني (4/186) أن تصرفه لا يصح ولو أذن الولي إلا في اليسير، مستشهدًا بما روي عن أبي الدرداء أنه اشترى عصفورًا من صبي فأطلقه، ونقلت عن المرداوي في الإنصاف أن صحة تصرفه في اليسير هي الصحيح من المذهب. وخلصت إلى أنه لا حرج في بيع غير المميز وشرائه للمحقرات والأشياء اليسيرة بشرط إذن الولي وفيما جرى به العرف، والأولى تعاقد الأهل مع إدارة المدرسة أو إرسال الطعام مع الصغير."
  en: "A question about a nursery selling snacks to children too young to discern, in which Jordan's General Iftaa Department answered that, following the Hanbali school, a child too young to discern may buy and sell trivial items with the guardian's permission and within custom, though it is better for parents to send food or contract with the school's management. The Department answered that jurists agree that the sales and purchases of a child too young to discern are invalid in matters of significant value, quoting al-Mawardi in al-Hawi al-Kabir (5/368) that in the Shafi'i school a boy's purchase is void and does not depend on the guardian's approval; it said it is better for parents to give young children what they need or to arrange with the school's management for them to be given food from the canteen. It said that where this is not possible, the Hanbalis hold that such a child's dealings are valid in trivial matters, quoting Ibn Qudama in al-Mughni (4/186) that his dealings are invalid even with the guardian's permission except in small things, citing the report that Abu al-Darda bought a sparrow from a boy and set it free, and quoting al-Mardawi in al-Insaf that validity in small matters is the correct view of the school. It concluded that there is no objection to such a child buying and selling inexpensive, trivial items, on condition of the guardian's permission and within what custom accepts, though it is better for parents to arrange with the school or send food with the child."
  ur: "ناسمجھ بچوں کو کھانے کی چیزیں بیچنے والی نرسری کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حنابلہ کے مذہب کے مطابق ناسمجھ بچہ ولی کی اجازت اور عرف کی حد میں معمولی چیزیں خرید و فروخت کر سکتا ہے، البتہ بہتر یہ ہے کہ گھر والے کھانا ساتھ بھیجیں یا اسکول انتظامیہ سے معاہدہ کریں۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہا کا اتفاق ہے کہ قابلِ لحاظ قیمت والی چیزوں میں ناسمجھ بچے کی خرید و فروخت درست نہیں، اور الحاوی الکبیر (5/368) میں ماوردی سے نقل کیا کہ شافعیہ کے نزدیک بچے کی خرید باطل ہے اور ولی کی منظوری پر موقوف نہیں؛ اور کہا کہ بہتر یہ ہے کہ گھر والے بچوں کو ضرورت کی چیزیں دیں یا اسکول انتظامیہ سے کینٹین سے دینے کا معاہدہ کریں۔ اس نے کہا کہ اگر یہ ممکن نہ ہو تو حنابلہ معمولی چیزوں میں ایسے بچے کے تصرف کو درست مانتے ہیں، اور المغنی (4/186) میں ابن قدامہ سے نقل کیا کہ ولی کی اجازت سے بھی اس کا تصرف درست نہیں سوائے معمولی چیز کے، اس روایت کے ساتھ کہ ابو الدرداء نے ایک بچے سے چڑیا خرید کر آزاد کر دی، اور الانصاف میں مرداوی سے نقل کیا کہ معمولی چیزوں میں اس کا تصرف درست ہونا مذہب کا صحیح قول ہے۔ اس نے نتیجہ نکالا کہ ناسمجھ بچے کا حقیر اور کم قیمت چیزیں خریدنا بیچنا ولی کی اجازت اور عرف کی حد میں جائز ہے، البتہ بہتر یہ ہے کہ گھر والے اسکول سے معاہدہ کریں یا بچے کے ساتھ کھانا بھیجیں۔"
  es: "Una pregunta sobre una guardería que vendía refrigerios a niños demasiado pequeños para discernir, a la que el Departamento General de Iftaa de Jordania respondió que, según la escuela Hanbali, un niño demasiado pequeño para discernir puede comprar y vender artículos de poca importancia con el permiso del tutor y dentro de la costumbre, aunque es mejor que los padres envíen comida o hagan un acuerdo con la administración de la escuela. El Departamento respondió que los juristas coinciden en que las ventas y compras de un niño demasiado pequeño para discernir son inválidas en asuntos de valor significativo, citando a al-Mawardi en al-Hawi al-Kabir (5/368) que en la escuela Shafi'i la compra de un niño es nula y no depende de la aprobación del tutor; dijo que es mejor que los padres les den a los niños pequeños lo que necesitan o que hagan un arreglo con la administración de la escuela para que se les dé comida del comedor. Se indicó que, cuando esto no es posible, los hanbalíes sostienen que las transacciones de un niño son válidas en asuntos triviales, citando a Ibn Qudama en al-Mughni (4/186) que afirma que sus transacciones son inválidas incluso con el permiso del tutor, excepto en cosas pequeñas; citando el relato de que Abu al-Darda compró un gorrión a un niño y lo liberó; y citando a al-Mardawi en al-Insaf que la validez en asuntos menores es la opinión correcta de la escuela. Se concluyó que no hay objeción a que dicho niño compre y venda artículos baratos y triviales, con la condición del permiso del tutor y dentro de lo que acepta la costumbre, aunque es mejor que los padres se comuniquen con la escuela o envíen comida con el niño."
  fr: "Concernant la vente de friandises par une crèche à des enfants trop jeunes pour discerner la valeur d'un bien, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que, selon l'école hanbalite, un enfant trop jeune pour discerner la valeur d'un bien peut acheter et vendre des articles de faible importance avec l'autorisation de son tuteur et conformément aux usages. Toutefois, il est préférable que les parents fournissent de la nourriture ou s'arrangent avec la direction de l'école. Le Département a précisé que les juristes s'accordent à dire que les ventes et les achats effectués par un enfant trop jeune pour discerner la valeur d'un bien sont nuls, citant al-Mawardi dans al-Hawi al-Kabir (5/368). Selon ce dernier, dans l'école chaféite, l'achat d'un garçon est nul et ne dépend pas de l'approbation de son tuteur. Il a ajouté qu'il est préférable que les parents donnent aux jeunes enfants ce dont ils ont besoin ou qu'ils prennent des dispositions avec la direction de l'école pour qu'ils puissent se restaurer à la cantine. Il est indiqué que, lorsque cela s'avère impossible, les Hanbalites considèrent que les transactions d'un tel enfant sont valides pour les petites choses. Ils citent Ibn Qudama dans al-Mughni (4/186) selon lequel ses transactions sont invalides, même avec la permission du tuteur, sauf pour les petites sommes. Ils mentionnent également le récit d'Abu al-Darda achetant un moineau à un garçon et le relâchant, et citent al-Mardawi dans al-Insaf, qui affirme que la validité pour les petites choses est l'avis correct de l'école. Il est conclu qu'il n'y a pas d'objection à ce qu'un tel enfant achète et vende des objets peu coûteux et sans importance, sous réserve de la permission du tuteur et dans le respect des usages, bien qu'il soit préférable que les parents prennent des dispositions avec l'école ou confient de la nourriture à l'enfant."
