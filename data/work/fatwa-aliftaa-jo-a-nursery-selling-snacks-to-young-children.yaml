id: work/fatwa-aliftaa-jo-a-nursery-selling-snacks-to-young-children
class: work
kind: fatwa
label: { ar: "حضانة تبيع المأكولات لأطفال غير مميزين", en: "A nursery selling snacks to children too young to discern", ur: "ناسمجھ بچوں کو کھانے کی چیزیں بیچنے والی نرسری" }
summary:
  ar: "سؤال عن حضانة تبيع المأكولات لأطفال غير مميزين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في بيع الصغير غير المميز وشرائه للأشياء اليسيرة بإذن وليه وفيما جرى به العرف، أخذًا بمذهب الحنابلة، والأولى أن يرسل الأهل الطعام أو يتعاقدوا مع إدارة المدرسة. أجابت الدائرة بأن الفقهاء اتفقوا على عدم صحة بيع الصغير غير المميز وشرائه في الأمور ذات القيمة المعتبرة، ونقلت عن الماوردي في الحاوي الكبير (5/368) أن شراء الصبي باطل عند الشافعية ولا يتوقف على إجازة الولي، وقالت إن الأولى أن يعطي الأهل الصغار ما يحتاجونه أو يتعاقدوا مع إدارة المدرسة على إعطائهم من المقصف. وقالت إنه إذا تعذر ذلك فقد ذهب الحنابلة إلى صحة تصرف غير المميز في الأشياء اليسيرة، ونقلت عن ابن قدامة في المغني (4/186) أن تصرفه لا يصح ولو أذن الولي إلا في اليسير، مستشهدًا بما روي عن أبي الدرداء أنه اشترى عصفورًا من صبي فأطلقه، ونقلت عن المرداوي في الإنصاف أن صحة تصرفه في اليسير هي الصحيح من المذهب. وخلصت إلى أنه لا حرج في بيع غير المميز وشرائه للمحقرات والأشياء اليسيرة بشرط إذن الولي وفيما جرى به العرف، والأولى تعاقد الأهل مع إدارة المدرسة أو إرسال الطعام مع الصغير."
  en: "A question about a nursery selling snacks to children too young to discern, in which Jordan's General Iftaa Department answered that, following the Hanbali school, a child too young to discern may buy and sell trivial items with the guardian's permission and within custom, though it is better for parents to send food or contract with the school's management. The Department answered that jurists agree that the sales and purchases of a child too young to discern are invalid in matters of significant value, quoting al-Mawardi in al-Hawi al-Kabir (5/368) that in the Shafi'i school a boy's purchase is void and does not depend on the guardian's approval; it said it is better for parents to give young children what they need or to arrange with the school's management for them to be given food from the canteen. It said that where this is not possible, the Hanbalis hold that such a child's dealings are valid in trivial matters, quoting Ibn Qudama in al-Mughni (4/186) that his dealings are invalid even with the guardian's permission except in small things, citing the report that Abu al-Darda bought a sparrow from a boy and set it free, and quoting al-Mardawi in al-Insaf that validity in small matters is the correct view of the school. It concluded that there is no objection to such a child buying and selling inexpensive, trivial items, on condition of the guardian's permission and within what custom accepts, though it is better for parents to arrange with the school or send food with the child."
  ur: "ناسمجھ بچوں کو کھانے کی چیزیں بیچنے والی نرسری کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حنابلہ کے مذہب کے مطابق ناسمجھ بچہ ولی کی اجازت اور عرف کی حد میں معمولی چیزیں خرید و فروخت کر سکتا ہے، البتہ بہتر یہ ہے کہ گھر والے کھانا ساتھ بھیجیں یا اسکول انتظامیہ سے معاہدہ کریں۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہا کا اتفاق ہے کہ قابلِ لحاظ قیمت والی چیزوں میں ناسمجھ بچے کی خرید و فروخت درست نہیں، اور الحاوی الکبیر (5/368) میں ماوردی سے نقل کیا کہ شافعیہ کے نزدیک بچے کی خرید باطل ہے اور ولی کی منظوری پر موقوف نہیں؛ اور کہا کہ بہتر یہ ہے کہ گھر والے بچوں کو ضرورت کی چیزیں دیں یا اسکول انتظامیہ سے کینٹین سے دینے کا معاہدہ کریں۔ اس نے کہا کہ اگر یہ ممکن نہ ہو تو حنابلہ معمولی چیزوں میں ایسے بچے کے تصرف کو درست مانتے ہیں، اور المغنی (4/186) میں ابن قدامہ سے نقل کیا کہ ولی کی اجازت سے بھی اس کا تصرف درست نہیں سوائے معمولی چیز کے، اس روایت کے ساتھ کہ ابو الدرداء نے ایک بچے سے چڑیا خرید کر آزاد کر دی، اور الانصاف میں مرداوی سے نقل کیا کہ معمولی چیزوں میں اس کا تصرف درست ہونا مذہب کا صحیح قول ہے۔ اس نے نتیجہ نکالا کہ ناسمجھ بچے کا حقیر اور کم قیمت چیزیں خریدنا بیچنا ولی کی اجازت اور عرف کی حد میں جائز ہے، البتہ بہتر یہ ہے کہ گھر والے اسکول سے معاہدہ کریں یا بچے کے ساتھ کھانا بھیجیں۔"
