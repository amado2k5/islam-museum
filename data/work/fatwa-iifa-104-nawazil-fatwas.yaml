label: { ar: "قرار مجمع الفقه الإسلامي الدولي 104 (11/7) بشأن سبل الاستفادة من النوازل ⁦(الفتاوى)⁩", en: "IIFA resolution 104 (11/7) on ways to benefit from the nawazil ⁦(fatwa)⁩ literature", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 104 (11/7): نوازل ⁦(فتاویٰ)⁩ کی کتب سے استفادے کے طریقے", es: "Resolución 104 (11/7) de la IIFA sobre las formas de beneficiarse de la literatura nawazil (fatwa).", fr: "Résolution 104 (11/7) de l'IIFA sur les moyens de tirer profit de la littérature nawazil (fatwa).", tr: "Uluslararası İslami Fiqh Akademisi Kararı 104 (11/7) yeni vakalardan (fetvalar) yararlanma yolları hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 104 (7/11) mengenai cara mendapatkan manfaat dari kasus baru (fatwa)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. قرر الاستفادة من تراث الفتاوى الفقهية ⁦(النوازل)⁩ بمختلف أنواعها لإيجاد حلول للمستجدات المعاصرة: سواء في مناهج الفتوى في ضوء ضوابط الاجتهاد والاستنباط والتخريج والقواعد الفقهية، أو في الفروع التي عالج الفقهاء نظائرها في أعصارهم. وأوصى بتحقيق أهم كتب الفتاوى وإحياء الكتب الفقهية المساعدة — منها التنبيهات على المدونة للقاضي عياض، وبرنامج الشيخ عظوم، وفتاوى الإمام الغزالي، وتقويم النظر لابن الدهان، وكتب العمل في المالكية وعواصمها العلمية ⁦(فاس والقيروان وقرطبة)⁩ ومعروضات أبي السعود وغيرها — وإعداد كتاب مفصل في منهجية النوازل."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It resolved to draw on the heritage of juristic fatwa literature (the nawazil) of all kinds for solutions to contemporary questions — both in fatwa methodology under the controls of ijtihad, istinbat, takhrij and the juristic maxims, and in the branches whose analogues earlier jurists treated in their times. It recommended critical editing of the chief fatwa books and revival of supporting fiqh works — naming al-Qadi Iyad's al-Tanbihat 'ala al-Mudawwana, the program of Shaykh 'Udhum, Imam al-Ghazali's fatwas, Ibn al-Dahhan's Taqwim al-Nazar, the Maliki practice books and their scholarly capitals (Fez, Kairouan, Cordoba) and Abu al-Su'ud's arus — and preparation of a dedicated book on nawazil methodology."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ فیصلہ: معاصر مسائل کے حل کے لیے فقہی فتاویٰ کے موروث ⁦(نوازل)⁩ کی تمام اقسام سے استفادہ کیا جائے — اجتہاد، استنباط، تخریج اور قواعدِ فقہ کے ضوابط میں فتوى کی منہجیت میں بھی اور ان فروع میں بھی جن کے نظائر سابق فقہاء اپنے عہد میں پرک چکے؛ اور سفارش کی: اہم کتبِ فتاویٰ کی تحقیق اور معاون فقہی کتب کی احیاء — قاضی عیاض کی التنبیہات علی المدونہ، شیخ عظوم کا برنامج، امام غزالی کے فتاویٰ، ابن دہان کی تقویم النظر، مالکیہ کے کتبِ عمل اور ان کے علمی مراکز ⁦(فاس، قیروان، قرطبہ)⁩ اور ابو السعود کے معروضات وغیرہ — اور نوازل کی منہجیت پر ایک مفصل کتاب کی تیاری۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 11.ª sesión en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998). Se resolvió recurrir al legado de la literatura jurídica de fatwas (el nawazil) de todo tipo para encontrar soluciones a cuestiones contemporáneas, tanto en la metodología de las fatwas bajo los controles del ijtihad, el istinbat, el takhrij y las máximas jurídicas, como en las ramas cuyos análogos trataron los juristas anteriores en su época. Recomendó la edición crítica de los principales libros de fatuas y la reactivación de las obras de apoyo al fiqh, nombrando al-Tanbihat 'ala al-Mudawwana de al-Qadi Iyad, el programa de Shaykh 'Udhum, las fatwas del Imam al-Ghazali, el Taqwim al-Nazar de Ibn al-Dahhan, los libros de práctica de Maliki y sus capitales académicas (Fez, Kairuán, Córdoba) y Abu arus de al-Su'ud y preparación de un libro dedicado a la metodología nawazil."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 11e session à Manama (25-30 Rajab 1419, 14-19 novembre 1998). Elle a décidé de s'appuyer sur l'héritage de la littérature juridique des fatwas (nawazil) de toutes sortes pour répondre aux questions contemporaines — tant en matière de méthodologie des fatwas sous le contrôle de l'ijtihad, de l'istinbat, du takhrij et des maximes juridiques, que dans les branches dont les analogues ont été traités par les juristes antérieurs en leur temps. Il a recommandé l'édition critique des principaux livres de fatwa et la reprise des ouvrages de fiqh de soutien - nommant al-Tanbihat 'ala al-Mudawwana d'al-Qadi Iyad, le programme de Shaykh 'Udhum, les fatwas de l'Imam al-Ghazali, le Taqwim al-Nazar d'Ibn al-Dahhan, les livres de pratique Maliki et leurs capitales savantes (Fès, Kairouan, Cordoue) et Abu Arus d'al-Su'ud — et préparation d'un livre dédié à la méthodologie du nawazil."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Manama'daki on birinci oturumunda (25–30 Rajab 1419 H, 14–19 Kasım 1998) toplu kararı. Güncel gelişmelere çözümler bulmak için çeşitli fıkıh fetvalarının (yeni davalar) mirasından yararlanmaya karar verildi: ister fıkıh kuralları ışığında, ister fıkıhların kendi dönemlerinde ele aldığı dallarda. En önemli fetva kitaplarının düzenlenmesini ve destekleyici fıkıh kitaplarının yeniden canlandırılmasını—bunlar arasında Kadi İyad'ın Al-Tanbihat 'ala Al-Mudawwana'sı, Şeyh Azum'un programı, İmam El-Gazali'nin fetvaları, İbn el-Dahan'ın Takvim el-Nazar'ı, Maliki işleri ve onların bilimsel başkentleri (Fez, Kairuan ve Kordoba) üzerine çalışma kitapları ile Ebu Al-Saud sergileri gibi eserler dahil olmak üzere yeniden canlandırılmasını, ayrıca yeni meselelerin metodolojisi üzerine ayrıntılı bir kitap hazırlanmasını önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesebelasnya di Manama (25–30 Rajab 1419 H, 14–19 November 1998 M). Memutuskan untuk memanfaatkan warisan berbagai jenis fatwa yurisprudensi (kasus baru) untuk menemukan solusi atas perkembangan kontemporer: baik dalam metodologi fatwa berdasarkan aturan ijtihad, deduksi, autentikasi, dan aturan yurisprudensi, maupun dalam cabang yang ditangani para ahli hukum pada zamannya. Ia merekomendasikan penyuntingan buku-buku fatwa terpenting dan menghidupkan kembali buku-buku pendukung hukum—termasuk Al-Tanbihat 'ala Al-Mudawwana karya Qadi Iyad, program Sheikh Azum, fatwa Imam Al-Ghazali, Taqwim al-Nazar karya Ibn al-Dahan, buku-buku tentang urusan Maliki dan ibu kota ilmiahnya (Fez, Kairouan, dan Cordoba), serta pameran Abu Al-Saud, antara lain—dan menyiapkan buku rinci tentang metodologi isu-isu baru."
