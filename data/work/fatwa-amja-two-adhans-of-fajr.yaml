id: work/fatwa-amja-two-adhans-of-fajr
class: work
kind: fatwa
label: { ar: "أذانا الفجر", en: "The first Fajr adhan an hour early — the two calls explained", ur: "فجر کی دو اذانیں — پہلی تنبیہ", es: "El primer adhan del Fajr una hora antes: se explican las dos llamadas.", fr: "Le premier appel à la prière de Fajr une heure plus tôt — les deux appels expliqués", tr: "Şafak çağırıyor", id: "Fajar memanggil" }
summary:
  ar: "سأل سائل عن جواز الأذان الأول للفجر قبل ساعة من موعده. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 85935 بتاريخ 17 نوفمبر 2011)⁩ أن للفجر أذانين أحدهما للتنبيه على اقتراب موعده فيرجع القائم ويوقظ النائم والثاني عند دخول الوقت لما ثبت في الصحيحين على ما فصّل الجواب."
  en: "A questioner asked whether the first Fajr adhan may be called an hour before its time. AMJA's fatwa committee (fatwa no. 85935, 17 November 2011) answered that Fajr has two adhans: one announcing the approach of its time — the one standing returns and the sleeper wakes — and the second at the time's entry, as established in the two Sahihs — as the answer details."
  ur: "فجر کی پہلی اذان پہلے؟ لجنة الفتوى ⁦(فتویٰ 85935، 17 نومبر 2011)⁩ کے مطابق دو اذانیں — تنبیہ اور دخول وقت — صحیحین کی سنت۔"
  es: "Un consultante preguntó si el primer adhan del Fajr puede realizarse una hora antes de su hora. El comité de fatwas de AMJA (fatwa n.° 85935, 17 de noviembre de 2011) respondió que el Fajr tiene dos adhans: uno que anuncia la llegada de su hora —el que indica a quien está de pie que regresa y al que duerme que se despierta— y el segundo al entrar en la hora indicada, como se establece en los dos Sahihs —como se detalla en la respuesta—."
  fr: "Un internaute a demandé si le premier adhan de Fajr pouvait être lancé une heure avant son heure. Le comité de fatwas de l'AMJA (fatwa n° 85935, 17 novembre 2011) a répondu que le Fajr comporte deux adhans: le premier annonçant l'approche de son heure – celui qui est debout revient et celui qui dort se réveille – et le second à l'entrée dans l'heure, comme établi dans les deux Sahihs – comme le précise la réponse."
  tr: "Bir soru soran kişiye, Fajr için ilk ezan çağrısının planlanan saatinden bir saat önce yapılmasının caizliği hakkında soru soruldu. Amerikan Şeriat Hukukçuları Konseyi'ndeki Fetva Komitesi (17 Kasım 2011 tarihli Fetva No. 85935), Fajr'un iki azanı olduğunu yanıtladı: biri yaklaşan zamanı uyarmak için ve aykırı geri dönüp uyuyan kişiyi uyandırmak için, diğeri ise iki Sahih'te belirtildiği gibi, cevapta açıklandığı üzere zamanın başlangıcında gerçekleşir."
  id: "Seorang penanya ditanya tentang diperbolehkannya panggilan salat pertama untuk Fajr satu jam sebelum waktu yang dijadwalkan. Komite Fatwa di American Council of Sharia Jurists (Fatwa No. 85935 tanggal 17 November 2011) menjawab bahwa Fajr memiliki dua adhan: satu untuk memberi peringatan akan waktu yang akan datang agar stander kembali dan membangunkan yang tidur, dan yang kedua saat waktu dimulai, seperti yang ditetapkan dalam dua Sahih, seperti dijelaskan dalam jawaban."
