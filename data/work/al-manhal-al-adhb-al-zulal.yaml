label: { ar: "المنهل العذب الزلال في حل التقويم ورؤية الهلال ⁦(ابن المجدي)⁩", en: "al-Manhal al-adhb al-zulal fi hall al-taqwim wa-ru'yat al-hilal (Ibn al-Majdi)", ur: "المنہل العذب الزلال فی حل التقویم و رؤیۃ الہلال ⁦(ابن المجدی)⁩", tr: "Takvimin çözümünde saf ve saf bahar ve hilal (İbn el-Macdi) görülmesi", id: "Mata Air Murni Murni dalam Larutan Kalender dan Penampakan Bulan Sabit (Ibn al-Majdi)" }
summary:
  ar: "رسالة موجزة لأحمد بن المجدي في معرفة أوائل الشهور العربية بالحساب وطرق رؤية الهلال، يبدو من سياقها أنها كتبت في أوائل القرن التاسع الهجري {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}."
  en: "Short treatise by Ahmad ibn al-Majdi on finding the beginnings of the Arab months by calculation and on sighting the crescent, apparently written in the early ninth century AH {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}."
  ur: "احمد بن المجدی کا مختصر رسالہ جو حساب سے عربی مہینوں کے آغاز اور رؤیتِ ہلال کے طریقوں پر ہے، اور سیاق سے نویں صدی ہجری کے آغاز میں لکھا گیا معلوم ہوتا ہے {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}۔"
  es: "Breve tratado de Ahmad ibn al-Majdi sobre cómo encontrar el comienzo de los meses árabes mediante cálculos y la observación de la luna creciente, aparentemente escrito a principios del siglo IX AH {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}."
  fr: "Court traité d'Ahmad ibn al-Majdi sur la recherche des débuts des mois arabes par le calcul et sur l'observation du croissant, apparemment écrit au début du IXe siècle AH {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}."
  tr: "Ahmed ibn al-Majdi'nin erken Arap aylarının aritmetiği ve hilal görme yöntemleri hakkında kısa bir incelemesi; bağlamı kitabın dokuzuncu yüzyılın başlarında HICRIM'de yazıldığını göstermektedir {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 33}."
  id: "Sebuah risalah singkat oleh Ahmad ibn al-Majdi tentang pengetahuan bulan-bulan Arab awal dalam aritmatika dan metode pengamatan bulan sabit, yang konteksnya menunjukkan bahwa karya ini ditulis pada awal abad kesembilan H {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 33}."
