label: { ar: "موسوعة أعلام العلماء والأدباء العرب والمسلمين", en: "Mawsu'at A'lam al-Ulama' wa-l-Adaba' al-Arab wa-l-Muslimin", ur: "موصوف العلام العلماء والادبۃ العرب والمسلمین", tr: "Arap ve Müslüman Alimler ve Yazarlar Ansiklopedisi", id: "Ensiklopedia Sarjana dan Penulis Arab serta Muslim" }
summary:
  ar: "موسوعة مؤسسية في ثمانية مجلدات تترجم لعلماء وأدباء العرب والمسلمين مرتبةً على حروف المعجم، من مشاريع المنظمة العربية للتربية والثقافة والعلوم؛ تجمع لكل علم نسبه ونشأته ومآثره ومصنفاته مع فهارس ومصادر."
  en: "An institutional encyclopedia in eight volumes of alphabetically arranged biographies of Arab and Muslim scholars and writers — an ALECSO project — recording for each figure his lineage, upbringing, achievements and works, with indexes and sources."
  es: "Una enciclopedia institucional en ocho volúmenes con biografías ordenadas alfabéticamente de eruditos y escritores árabes y musulmanes —un proyecto de ALECSO— que registra para cada figura su linaje, educación, logros y obras, con índices y fuentes."
  fr: "Une encyclopédie institutionnelle en huit volumes de biographies classées par ordre alphabétique d'érudits et d'écrivains arabes et musulmans — un projet ALECSO — répertoriant pour chaque figure sa lignée, son éducation, ses réalisations et ses œuvres, avec des index et des sources."
  ur: "ایک ادارہ جاتی انسائیکلوپیڈیا جس میں آٹھ جلدوں میں حروف تہجی سے ترتیب دی گئی عرب اور مسلم اسکالرز اور مصنفین کی سوانح حیات - ایک ALECSO پروجیکٹ - ہر شخصیت کے لیے اس کے نسب، پرورش، کامیابیوں اور کاموں کو اشاریہ جات اور ذرائع کے ساتھ ریکارڈ کرتا ہے۔"
  tr: "Arap Eğitim, Kültür ve Bilim Örgütü'nün projelerinden alfabetik olarak Arap ve Müslüman Arap ve Müslüman alimlerini ve yazarlarını alfabetik olarak çeviren, her bilimi kökeni, başarıları ve eserleriyle birlikte dizinler ve kaynaklarla birlikte derleyen sekiz ciltlik kurumsal bir ansiklopedi."
  id: "Sebuah ensiklopedia institusional dalam delapan jilid yang menerjemahkan para sarjana dan penulis Arab dan Muslim Arab serta Muslim, yang disusun secara alfabetis, dari proyek-proyek Organisasi Arab untuk Pendidikan, Kebudayaan dan Ilmu Pengetahuan; mengumpulkan setiap ilmu beserta garis keturunan, asal-usul, pencapaian, dan karyanya, beserta indeks dan sumber."
