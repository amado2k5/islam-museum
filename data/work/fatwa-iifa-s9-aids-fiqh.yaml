label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مرض نقص المناعة المكتسب ⁦(الإيدز)⁩ والأحكام الفقهية المتعلقة به", en: "IIFA resolution on AIDS and its fiqh rulings", ur: "اکیڈمی کی قرارداد: ایڈز اور اس کے فقہی احکام", es: "Resolución de la IIFA sobre el SIDA y sus dictámenes de fiqh" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: بناء على المعلومات الطبية المتوافرة بأن العدوى بالإيدز لا تحدث عن طريق المعايشة أو الملامسة أو التنفس أو الحشرات أو الاشتراك في الأكل والشرب أو حمامات السباحة أو أدوات الطعام ونحوها، بيّن أحكام عزل المريض وغيرها من الأحكام الفقهية المتعلقة بالمرض على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on AIDS and its fiqh rulings: on the medical finding that infection does not occur through coexistence, contact, breathing, insects, shared food and drink, swimming pools or utensils, it sets out the rulings on isolating the patient and the other fiqh questions the disease raises, as detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ ایڈز پر: روزمرہ معاشرت سے متلقیشن نہیں ہوتی اس طبی اصول پر مریض کی تنہائی اور دیگر فقہی احکام بیان ہوئے۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre el SIDA y sus dictámenes fiqh: sobre la conclusión médica de que la infección no se produce por coexistencia, contacto, respiración, insectos, alimentos y bebidas compartidos, piscinas o utensilios, establece los dictámenes sobre el aislamiento del paciente y las demás cuestiones fiqh que plantea la enfermedad, como se detalla."
