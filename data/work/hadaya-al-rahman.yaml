label:
  ar: "هدايا الرحمن ⁦(برنامج رمضاني)⁩"
  en: "Hadaya al-Rahman: Gifts of the Merciful (Ramadan programme)"
  ur: "ہدایا الرحمن: رحمٰن کے تحفے ⁦(رمضانی پروگرام)⁩"
summary:
  ar: "برنامج رمضاني قصير لمصطفى حسني يحفظ منه أرشيف أسابيل تسعًا وعشرين حلقة مصوّرة من دقيقتين ونصف إلى خمس دقائق ونصف، يتكلم فيها المتحدث وحده؛ في كل حلقة «هدية من هدايا الرحمن»: حديث في عمل يسير أجره كبير ⁦(الاستغفار للمؤمنين، والسعي على الأرملة والمسكين، وصدقة السر، والجمعة، وصلاة الجنازة، وركعتا التوبة، وذكر السوق، وتفطير الصائم، والضحى، وخواتيم البقرة، والتهليل والتسبيح، وسيد الاستغفار، والدلالة على الخير، وإماطة الأذى، والمشي إلى المسجد، والمسح على رأس اليتيم، والصلاة على النبي، والجلوس بعد الفجر، وكثرة السجود، وترديد الأذان)⁩، يشرح معناه ثم يسأل لماذا جعل الله فيه هذا الأجر."
  en: "A short Ramadan programme by Mustafa Hosny of which the Assabile archive keeps twenty-nine video episodes of two and a half to five and a half minutes, the speaker alone; each presents one 'gift of the Merciful', a hadith on a small deed with a great reward (asking forgiveness for the believers, caring for the widow and the poor, secret charity, the Friday prayer, the funeral prayer, the two rak'as of repentance, the remembrance on entering the market, feeding a fasting person, the forenoon prayer, the last verses of al-Baqara, the formulas of tahlil and tasbih, the master supplication of forgiveness, guiding to good, removing harm from the road, walking to the mosque, wiping an orphan's head, invoking blessings on the Prophet, sitting after the dawn prayer, much prostration and repeating the call to prayer), explains its meaning and then asks why God placed such a reward in it."
  ur: "مصطفیٰ حسنی کا ایک مختصر رمضانی پروگرام جس کی ڈھائی سے ساڑھے پانچ منٹ کی انتیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں، مقرر اکیلے؛ ہر قسط «رحمٰن کا ایک تحفہ» پیش کرتی ہے: کسی چھوٹے عمل کے بڑے اجر کی حدیث ⁦(مومنوں کے لیے استغفار، بیوہ اور مسکین کی خدمت، چھپا صدقہ، جمعہ، نمازِ جنازہ، توبہ کی دو رکعتیں، بازار کا ذکر، روزہ افطار کرانا، چاشت، سورۃ البقرہ کی آخری آیات، تہلیل و تسبیح، سید الاستغفار، نیکی کی رہنمائی، راستے سے تکلیف ہٹانا، مسجد کی طرف چلنا، یتیم کے سر پر ہاتھ پھیرنا، نبی پر درود، فجر کے بعد بیٹھنا، کثرتِ سجود اور اذان کا جواب)⁩، اس کا مطلب سمجھاتی ہے اور پھر پوچھتی ہے کہ اللہ نے اس میں یہ اجر کیوں رکھا۔"
