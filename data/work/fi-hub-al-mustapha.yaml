label:
  ar: "في حب المصطفى ⁦(برنامج تلفزيوني)⁩"
  en: "In the Love of al-Mustafa (television programme)"
  ur: "فی حب المصطفیٰ: مصطفیٰ کی محبت میں ⁦(ٹیلی وژن پروگرام)⁩"
  es: "En el amor de al-Mustafa (programa de televisión)"
  fr: "Dans l'amour d'al-Mustafa (émission de télévision)"
  tr: "Seçilmiş Kişiye Aşık (TV Programı)"
  id: "In Love with the Chosen One (Program TV)"
summary:
  ar: "برنامج تلفزيوني قصير لعبلة الكحلاوي، بُث في رمضان 1428هـ على قناة الرسالة بحسب ويكيبيديا العربية، يحفظ أرشيف أسابيل منه سبعًا وعشرين حلقة مصوّرة ⁦(ثلاث وعشرون منها مختلفة)⁩ من عشر دقائق تقريبًا: المحبة ومنبعها، واصطفاء النبي، والأمهات اللاتي أرضعنه وربينه، وصدقه وثباته في مكة، والمقاطعة وعام الحزن، وخديجة وورقة، وبيعتا العقبة ومصعب بن عمير، والهجرة إلى الحبشة ثم إلى المدينة، وعلي وخيبر، والأخلاق في العبادة والاقتصاد والسياسة، والتواضع والجود، والتربية، والمرأة، والتوحيد والآخرة والمسؤولية الشخصية، ثم وفاة النبي."
  en: "A short television programme by Abla al-Kahlawi, broadcast in Ramadan 1428 AH on the al-Risala channel according to the Arabic Wikipedia, of which the Assabile archive keeps twenty-seven video episodes (twenty-three distinct) of about ten minutes each: love and its source, the choosing of the Prophet, the women who nursed and raised him, his truthfulness and steadfastness in Mecca, the boycott and the Year of Sorrow, Khadija and Waraqa, the pledges of al-Aqaba and Mus'ab ibn Umayr, the migrations to Abyssinia and to Medina, Ali and Khaybar, ethics in worship, economy and politics, humility and generosity, education, women, tawhid, the hereafter and personal responsibility, and the Prophet's death."
  ur: "عبلہ الکحلاوی کا ایک مختصر ٹیلی وژن پروگرام، جو عربی ویکیپیڈیا کے مطابق رمضان 1428ھ میں الرسالہ چینل پر نشر ہوا، اور جس کی ستائیس ویڈیو اقساط ⁦(ان میں تئیس الگ)⁩ اسابیل آرکائیو میں محفوظ ہیں، ہر ایک تقریباً دس منٹ کی: محبت اور اس کا سرچشمہ، نبی کا انتخاب، وہ خواتین جنہوں نے انہیں دودھ پلایا اور پالا، مکہ میں ان کی سچائی اور ثابت قدمی، مقاطعہ اور عام الحزن، خدیجہ اور ورقہ، عقبہ کی بیعتیں اور مصعب بن عمیر، حبشہ اور پھر مدینہ کی ہجرت، علی اور خیبر، عبادت، معیشت اور سیاست میں اخلاق، تواضع اور سخاوت، تربیت، عورت، توحید، آخرت اور ذاتی ذمہ داری، اور نبی کی وفات۔"
  es: "Un breve programa de televisión de Abla al-Kahlawi, emitido en Ramadán de 1428 AH en el canal al-Risala según la Wikipedia en árabe, del cual el archivo Assabile conserva veintisiete episodios de vídeo (veintritte distintos) de unos diez minutos cada uno: el amor y su origen, la elección del Profeta, las mujeres que lo amamantaron y criaron, su veracidad y firmeza en La Meca, el boicot y el Año del Dolor, Khadija y Waraqa, las promesas de al-Aqaba y Mus'ab ibn Umayr, las migraciones a Abisinia y a Medina, Ali y Khaybar, la ética en el culto, la economía y la política, la humildad y la generosidad, la educación, las mujeres, el tawhid, el más allá y la responsabilidad personal, y la muerte del Profeta."
  fr: "Un court programme télévisé d'Abla al-Kahlawi, diffusé pendant le Ramadan 1428 AH sur la chaîne al-Risala selon Wikipédia arabe, dont les archives Assabile conservent vingt-sept épisodes vidéo (vingt-trois distincts) d'environ dix minutes chacun: l'amour et sa source, le choix du Prophète, les femmes qui l'ont nourri et élevé, sa véracité et sa constance à La Mecque, le boycott et l'Année du Chagrin, Khadija et Waraqa, les serments d'al-Aqaba et de Mus'ab ibn Umayr, les migrations vers l'Abyssinie et vers Médine, Ali et Khaybar, l'éthique dans le culte, l'économie et la politique, l'humilité et la générosité, l'éducation, les femmes, le tawhid, l'au-delà et la responsabilité personnelle, et la mort du Prophète."
  tr: "Abla Al-Kahlavi tarafından Ramazan 1428 H.'de Arapça Vikipedi'ye göre Al-Risala kanalında yayınlanan kısa bir televizyon programı. İsabel'in arşivi, yaklaşık on dakikalık yirmi yedi kaydedilmiş bölümü (bunların yirmi üçü farklı) saklamaktadır: Sevgi ve Kaynağı, Peygamber'in Seçimi, Onu Emziren ve Büyüten Anneler, Mekke'deki Doğruluğu ve Kararlılığı, Boykot ve Keder Yılı, Hatice ve Varka, Akabah ve Mus'ab bin Umair'in Yeminleri, Medine'ye ve ardından Habeş'e göç, Ali ve Haybar, ibadet etikleri, ekonomi, siyaset, alçakgönüllülük ve cömertlik, yetiştirilme, kadınlar, tek tanrıcılık ve ahiret, kişisel sorumluluk ve ardından Peygamber'in ölümü."
  id: "Program televisi singkat oleh Abla Al-Kahlawi, disiarkan pada Ramadan 1428 AH di saluran Al-Risala menurut Wikipedia Arab. Arsip Isabel menyimpan dua puluh tujuh episode tercatat (dua puluh tiga di antaranya berbeda) masing-masing sekitar sepuluh menit: Cinta dan Sumbernya, Pilihan Nabi, Para Ibu yang Menyusui dan Membesarkannya, Kebenaran dan Keteguhannya di Mekah, Boikot dan Tahun Kesedihan, Khadijah dan Warqah, Ikrar Aqabah dan Mus'ab ibn Umair, migrasi ke Abyssinia dan kemudian ke Madinah, Ali dan Khaybar, etika dalam ibadah, ekonomi, politik, kerendahan hati dan kemurahan hati, didikan, perempuan, monoteisme dan akhirat, tanggung jawab pribadi, dan kemudian kematian Nabi."
