kind: lecture-series
label:
  ar: "في حب المصطفى (برنامج تلفزيوني)"
  en: "In the Love of al-Mustafa (television programme)"
  ur: "فی حب المصطفیٰ: مصطفیٰ کی محبت میں (ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني قصير لعبلة الكحلاوي، بُث في رمضان 1428هـ على قناة الرسالة بحسب ويكيبيديا العربية، يحفظ أرشيف أسابيل منه سبعًا وعشرين حلقة مصوّرة (ثلاث وعشرون منها مختلفة) من عشر دقائق تقريبًا: المحبة ومنبعها، واصطفاء النبي، والأمهات اللاتي أرضعنه وربينه، وصدقه وثباته في مكة، والمقاطعة وعام الحزن، وخديجة وورقة، وبيعتا العقبة ومصعب بن عمير، والهجرة إلى الحبشة ثم إلى المدينة، وعلي وخيبر، والأخلاق في العبادة والاقتصاد والسياسة، والتواضع والجود، والتربية، والمرأة، والتوحيد والآخرة والمسؤولية الشخصية، ثم وفاة النبي."
  en: "A short television programme by Abla al-Kahlawi, broadcast in Ramadan 1428 AH on the al-Risala channel according to the Arabic Wikipedia, of which the Assabile archive keeps twenty-seven video episodes (twenty-three distinct) of about ten minutes each: love and its source, the choosing of the Prophet, the women who nursed and raised him, his truthfulness and steadfastness in Mecca, the boycott and the Year of Sorrow, Khadija and Waraqa, the pledges of al-Aqaba and Mus'ab ibn Umayr, the migrations to Abyssinia and to Medina, Ali and Khaybar, ethics in worship, economy and politics, humility and generosity, education, women, tawhid, the hereafter and personal responsibility, and the Prophet's death."
  ur: "عبلہ الکحلاوی کا ایک مختصر ٹیلی وژن پروگرام، جو عربی ویکیپیڈیا کے مطابق رمضان 1428ھ میں الرسالہ چینل پر نشر ہوا، اور جس کی ستائیس ویڈیو اقساط (ان میں تئیس الگ) اسابیل آرکائیو میں محفوظ ہیں، ہر ایک تقریباً دس منٹ کی: محبت اور اس کا سرچشمہ، نبی کا انتخاب، وہ خواتین جنہوں نے انہیں دودھ پلایا اور پالا، مکہ میں ان کی سچائی اور ثابت قدمی، مقاطعہ اور عام الحزن، خدیجہ اور ورقہ، عقبہ کی بیعتیں اور مصعب بن عمیر، حبشہ اور پھر مدینہ کی ہجرت، علی اور خیبر، عبادت، معیشت اور سیاست میں اخلاق، تواضع اور سخاوت، تربیت، عورت، توحید، آخرت اور ذاتی ذمہ داری، اور نبی کی وفات۔"
