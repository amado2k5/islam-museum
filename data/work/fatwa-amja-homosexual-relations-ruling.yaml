label: { ar: "حكم العلاقات المحرمة", en: "The ruling on unlawful relations — a teaching for students of Islam", ur: "نامشروع تعلقات کا حکم", es: "El dictamen sobre las relaciones ilícitas: una enseñanza para los estudiantes del Islam.", fr: "La décision concernant les relations illicites — un enseignement pour les étudiants de l'islam", tr: "Yasaklı ilişkiler hakkındaki karar", id: "Putusan tentang hubungan terlarang" }
summary:
  ar: "سأل سائل عن حكم الإسلام في الشذوذ الجنسي بين الرجال أو النساء لمن يدرسون الإسلام ويريدون الاهتداء. أجاب مجمع فقهاء الشريعة ⁦(فتوى رقم 309 بتاريخ 15 يوليو 2004)⁩ أن الأصل في العلاقة الجنسية المشروعة أنها تكون بين الرجل وزوجه ويشرع لهما كل صور الاستمتاع إلا الإتيان من الدبر فإنه لا يشرع قال تعالى والذين هم لفروجهم حافظون إلا على أزواجهم أو ما ملكت أيمانهم فإنهم غير ملومين وقال نساؤكم حرث لكم فأتوا حرثكم أنى شئتم، ويجب تعليم ذلك لكل من أراد معرفة أحكام الإسلام في هذا الباب على ما فصّل الجواب."
  en: "A questioner asked Islam's ruling on homosexual relations — male or female — for people studying Islam seeking guidance. The Assembly of Muslim Jurists (fatwa no. 309, 15 July 2004) answered that the lawful sexual relation is, in principle, between a man and his wife, every form of intimacy being allowed them save anal intercourse, which is not lawful — 'those who guard their private parts, save from their spouses or what their hands own, are blameless', and 'your women are a tillage; come to your tillage as you will'; this must be taught to all seeking Islam's rules in this chapter, as the answer details. Recorded as AMJA's answer."
  ur: "ایک سائل نے نامشروع تعلقات کا حکم پوچھا۔ مجمع فقہاء ⁦(فتویٰ 309، 15 جولائی 2004)⁩ کے مطابق جائز تعلق صرف شوہر بیوی میں ہے اور اس میں بھی دبر حرام ہے — آیات اس پر ہیں۔"
  es: "Un consultante preguntó sobre la norma islámica respecto a las relaciones homosexuales —tanto entre hombres como entre mujeres— para quienes estudian el Islam en busca de orientación. La Asamblea de Juristas Musulmanes (fatwa n.º 309, 15 de julio de 2004) respondió que la relación sexual lícita es, en principio, entre un hombre y su esposa, permitiéndoseles toda forma de intimidad salvo el coito anal, que no es lícito: «Quienes guardan su castidad, salvo la de sus cónyuges o la de sus propias manos, son inocentes», y «vuestras mujeres son un cultivo; cultivadlas como queráis». Esto debe enseñarse a todos los que buscan las normas islámicas en este capítulo, como se detalla en la respuesta. Registrado como respuesta de la AMJA."
  fr: "Une personne a interrogé l'Assemblée des juristes musulmans (fatwa n° 309 du 15 juillet 2004) sur la position de l'islam concernant les relations homosexuelles, qu'elles soient entre hommes ou femmes. L'Assemblée a répondu que la relation sexuelle licite est, en principe, celle entre un homme et son épouse, toute forme d'intimité leur étant permise à l'exception des rapports anaux, qui sont illicites. « Ceux qui préservent leur chasteté, sauf de leurs épouses ou de leurs mains, sont irréprochables », et « vos femmes sont un champ; allez à votre champ comme bon vous semble ». Cet enseignement doit être transmis à tous ceux qui étudient les règles de l'islam dans ce chapitre, comme le précise la réponse. Cette réponse est enregistrée comme étant celle de l'AMJA."
  tr: "İslam'ı öğrenen ve rehberlik arayanlar için erkekler veya kadınlar arasındaki cinsel sapkınlık hakkındaki İslam hükmünü soran kişiye soruldu. Şeriat Hukukçuları Meclisi (15 Temmuz 2004 tarihli 309 sayılı fetva), yasal cinsel ilişkinin varsayılan olarak erkek ile karısı arasında olması gerektiğini, anal ilişki hariç her türlü zevkin onlar için zorunlu olduğunu yanıtladı, çünkü bu yasa değildir. Yüce Allah şöyle dedi: \"Ve eşleri ya da sağ ellerinde olanlar dışında özel bölgelerini koruyanlar suçlanamaz.\" Ve dedi ki, \"Kadınlarınız sizin için bir tarladır, istediğiniz yere tarlanıza gelin.\" Bu, bu konuda İslam'ın hükümlerini bilmek isteyen herkese öğretilmelidir, cevabında ayrıntılı olarak belirtildiği gibi."
  id: "Seorang penanya ditanya tentang aturan Islam mengenai penyimpangan seksual antara pria atau wanita bagi mereka yang mempelajari Islam dan mencari bimbingan. Majelis Ahli Hukum Syariah (Fatwa No. 309 tanggal 15 Juli 2004) menjawab bahwa standar dalam hubungan seksual yang sah adalah hubungan itu harus antara pria dan istrinya, dan segala bentuk kenikmatan ditetapkan untuk mereka kecuali hubungan seks anal, karena tidak diatur oleh undang-undang. Allah Yang Maha Kuasa berfirman: \"Dan mereka yang menjaga bagian pribadi mereka kecuali istri atau apa yang dimiliki tangan kanan mereka, mereka tidak boleh disalahkan.\" Dan Dia berkata, \"Wanita-Mu adalah ladang bagimu, maka datanglah ke ladangmu di mana pun kamu mau.\" Hal ini harus diajarkan kepada siapa saja yang ingin mengetahui aturan Islam dalam hal ini, seperti yang dijelaskan dalam jawaban."
