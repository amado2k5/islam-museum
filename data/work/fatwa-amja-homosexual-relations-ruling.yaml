id: work/fatwa-amja-homosexual-relations-ruling
class: work
kind: fatwa
label: { ar: "حكم العلاقات المحرمة", en: "The ruling on unlawful relations — a teaching for students of Islam", ur: "نامشروع تعلقات کا حکم" }
summary:
  ar: "سأل سائل عن حكم الإسلام في الشذوذ الجنسي بين الرجال أو النساء لمن يدرسون الإسلام ويريدون الاهتداء. أجاب مجمع فقهاء الشريعة ⁦(فتوى رقم 309 بتاريخ 15 يوليو 2004)⁩ أن الأصل في العلاقة الجنسية المشروعة أنها تكون بين الرجل وزوجه ويشرع لهما كل صور الاستمتاع إلا الإتيان من الدبر فإنه لا يشرع قال تعالى والذين هم لفروجهم حافظون إلا على أزواجهم أو ما ملكت أيمانهم فإنهم غير ملومين وقال نساؤكم حرث لكم فأتوا حرثكم أنى شئتم، ويجب تعليم ذلك لكل من أراد معرفة أحكام الإسلام في هذا الباب على ما فصّل الجواب."
  en: "A questioner asked Islam's ruling on homosexual relations — male or female — for people studying Islam seeking guidance. The Assembly of Muslim Jurists (fatwa no. 309, 15 July 2004) answered that the lawful sexual relation is, in principle, between a man and his wife, every form of intimacy being allowed them save anal intercourse, which is not lawful — 'those who guard their private parts, save from their spouses or what their hands own, are blameless', and 'your women are a tillage; come to your tillage as you will'; this must be taught to all seeking Islam's rules in this chapter, as the answer details. Recorded as AMJA's answer."
  ur: "ایک سائل نے نامشروع تعلقات کا حکم پوچھا۔ مجمع فقہاء ⁦(فتویٰ 309، 15 جولائی 2004)⁩ کے مطابق جائز تعلق صرف شوہر بیوی میں ہے اور اس میں بھی دبر حرام ہے — آیات اس پر ہیں۔"
