id: work/fatwa-aliftaa-jo-insuring-receivables
class: work
kind: fatwa
label: { ar: "التأمين على الذمم المدينة", en: "Insuring receivables", ur: "قابل وصول قرضوں کا بیمہ" }
summary:
  ar: "سؤال عن تاجر عرضت عليه شركة تأمين ذممه المدينة على التجار مقابل نسبة سنوية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في التأمين على الديون إذا كان التأمين تعاونيًا وكان الدين ناشئًا عن معاملة مباحة، ولا يجوز إذا كان التأمين تجاريًا. أجابت الدائرة بأن حكم التأمين على الديون يختلف باختلاف طبيعة التأمين، فإن كان تجاريًا حرم التعامل به، لأن التأمين التجاري محرم في قول جمهور الفقهاء والمجامع الفقهية لكونه من العقود المبنية على المقامرة والميسر. وقالت إن التأمين إن كان إسلاميًا تعاونيًا جاز التعامل به، لأنه قائم على التكافل والتعاون والتبرع بين المشتركين في الصندوق، وهو قول عامة المجامع الفقهية ودور الإفتاء المعاصرة. وخلصت إلى أنه لا حرج في التأمين على الديون إذا كان التأمين تعاونيًا، لأن خطر التأخر في السداد أو عدمه من الأخطار التي يجوز التأمين عليها، بشرط أن يكون الدين ناشئًا عن معاملة مباحة، ولا يجوز إذا كان التأمين تجاريًا."
  en: "A question from a trader offered insurance by a company on the debts other traders owe him in return for an annual percentage, in which Jordan's General Iftaa Department answered that insuring debts is unobjectionable if the insurance is cooperative and the debt arises from a lawful transaction, and not permitted if the insurance is commercial. The Department answered that the ruling on insuring debts depends on the type of insurance: if it is commercial, dealing in it is forbidden, because commercial insurance is forbidden in the view of the majority of jurists and the fiqh academies, as a contract built on gambling. It said that if the insurance is Islamic cooperative insurance, dealing in it is permitted, because it rests on mutual guarantee, cooperation and donation among the members of the fund, which is the view of most fiqh academies and contemporary fatwa bodies. It concluded that insuring debts is unobjectionable if the insurance is cooperative, since the risk of late payment or non-payment is one that may be insured against, provided the debt arises from a lawful transaction, and that it is not permitted if the insurance is commercial."
  ur: "ایک تاجر کے بارے میں سوال جسے ایک کمپنی نے سالانہ فیصد کے بدلے دوسرے تاجروں پر واجب اس کے قرضوں کا بیمہ پیش کیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر بیمہ تعاونی ہو اور قرض جائز معاملے سے پیدا ہوا ہو تو قرضوں کا بیمہ جائز ہے، اور اگر بیمہ تجارتی ہو تو جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ قرضوں کے بیمے کا حکم بیمے کی نوعیت سے بدلتا ہے: اگر تجارتی ہو تو اس میں معاملہ حرام ہے، کیونکہ جمہور فقہا اور فقہی اکیڈمیوں کے نزدیک تجارتی بیمہ جوئے پر مبنی معاہدہ ہونے کی وجہ سے حرام ہے۔ اس نے کہا کہ اگر بیمہ اسلامی تعاونی ہو تو اس میں معاملہ جائز ہے، کیونکہ یہ فنڈ کے شرکا کے درمیان باہمی کفالت، تعاون اور تبرع پر قائم ہے، اور یہی اکثر فقہی اکیڈمیوں اور معاصر دارالافتاؤں کا قول ہے۔ اس نے نتیجہ نکالا کہ اگر بیمہ تعاونی ہو تو قرضوں کا بیمہ جائز ہے، کیونکہ ادائیگی میں تاخیر یا عدم ادائیگی کا خطرہ ان خطرات میں سے ہے جن کا بیمہ ہو سکتا ہے، بشرطیکہ قرض جائز معاملے سے پیدا ہوا ہو، اور اگر بیمہ تجارتی ہو تو جائز نہیں۔"
