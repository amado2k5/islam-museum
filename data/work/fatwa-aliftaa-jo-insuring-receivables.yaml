label: { ar: "التأمين على الذمم المدينة", en: "Insuring receivables", ur: "قابل وصول قرضوں کا بیمہ", es: "Asegurar las cuentas por cobrar", fr: "Assurer les créances", tr: "Sorumluluk Sigortası", id: "Asuransi Tanggung Jawab" }
summary:
  ar: "سؤال عن تاجر عرضت عليه شركة تأمين ذممه المدينة على التجار مقابل نسبة سنوية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في التأمين على الديون إذا كان التأمين تعاونيًا وكان الدين ناشئًا عن معاملة مباحة، ولا يجوز إذا كان التأمين تجاريًا. أجابت الدائرة بأن حكم التأمين على الديون يختلف باختلاف طبيعة التأمين، فإن كان تجاريًا حرم التعامل به، لأن التأمين التجاري محرم في قول جمهور الفقهاء والمجامع الفقهية لكونه من العقود المبنية على المقامرة والميسر. وقالت إن التأمين إن كان إسلاميًا تعاونيًا جاز التعامل به، لأنه قائم على التكافل والتعاون والتبرع بين المشتركين في الصندوق، وهو قول عامة المجامع الفقهية ودور الإفتاء المعاصرة. وخلصت إلى أنه لا حرج في التأمين على الديون إذا كان التأمين تعاونيًا، لأن خطر التأخر في السداد أو عدمه من الأخطار التي يجوز التأمين عليها، بشرط أن يكون الدين ناشئًا عن معاملة مباحة، ولا يجوز إذا كان التأمين تجاريًا."
  en: "A question from a trader offered insurance by a company on the debts other traders owe him in return for an annual percentage, in which Jordan's General Iftaa Department answered that insuring debts is unobjectionable if the insurance is cooperative and the debt arises from a lawful transaction, and not permitted if the insurance is commercial. The Department answered that the ruling on insuring debts depends on the type of insurance: if it is commercial, dealing in it is forbidden, because commercial insurance is forbidden in the view of the majority of jurists and the fiqh academies, as a contract built on gambling. It said that if the insurance is Islamic cooperative insurance, dealing in it is permitted, because it rests on mutual guarantee, cooperation and donation among the members of the fund, which is the view of most fiqh academies and contemporary fatwa bodies. It concluded that insuring debts is unobjectionable if the insurance is cooperative, since the risk of late payment or non-payment is one that may be insured against, provided the debt arises from a lawful transaction, and that it is not permitted if the insurance is commercial."
  ur: "ایک تاجر کے بارے میں سوال جسے ایک کمپنی نے سالانہ فیصد کے بدلے دوسرے تاجروں پر واجب اس کے قرضوں کا بیمہ پیش کیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر بیمہ تعاونی ہو اور قرض جائز معاملے سے پیدا ہوا ہو تو قرضوں کا بیمہ جائز ہے، اور اگر بیمہ تجارتی ہو تو جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ قرضوں کے بیمے کا حکم بیمے کی نوعیت سے بدلتا ہے: اگر تجارتی ہو تو اس میں معاملہ حرام ہے، کیونکہ جمہور فقہا اور فقہی اکیڈمیوں کے نزدیک تجارتی بیمہ جوئے پر مبنی معاہدہ ہونے کی وجہ سے حرام ہے۔ اس نے کہا کہ اگر بیمہ اسلامی تعاونی ہو تو اس میں معاملہ جائز ہے، کیونکہ یہ فنڈ کے شرکا کے درمیان باہمی کفالت، تعاون اور تبرع پر قائم ہے، اور یہی اکثر فقہی اکیڈمیوں اور معاصر دارالافتاؤں کا قول ہے۔ اس نے نتیجہ نکالا کہ اگر بیمہ تعاونی ہو تو قرضوں کا بیمہ جائز ہے، کیونکہ ادائیگی میں تاخیر یا عدم ادائیگی کا خطرہ ان خطرات میں سے ہے جن کا بیمہ ہو سکتا ہے، بشرطیکہ قرض جائز معاملے سے پیدا ہوا ہو، اور اگر بیمہ تجارتی ہو تو جائز نہیں۔"
  es: "Un comerciante preguntó sobre una compañía que ofrecía seguros para las deudas que otros comerciantes le debían a cambio de un porcentaje anual. El Departamento General de Iftaa de Jordania respondió que asegurar deudas es aceptable si el seguro es cooperativo y la deuda surge de una transacción lícita, pero no está permitido si el seguro es comercial. El Departamento explicó que la normativa sobre el seguro de deudas depende del tipo de seguro: si es comercial, está prohibido, ya que la mayoría de los juristas y las academias de fiqh lo consideran un contrato basado en el juego. Sin embargo, si se trata de un seguro cooperativo islámico, está permitido, puesto que se fundamenta en la garantía mutua, la cooperación y la donación entre los miembros del fondo, opinión que comparten la mayoría de las academias de fiqh y los organismos de fatwa contemporáneos. Se concluyó que asegurar las deudas es aceptable si el seguro es cooperativo, ya que el riesgo de retraso o impago es algo que se puede asegurar, siempre que la deuda surja de una transacción legal, y que no está permitido si el seguro es comercial."
  fr: "Un commerçant s'est renseigné sur la possibilité, offerte par une compagnie, d'assurer les dettes que d'autres commerçants lui doivent en échange d'un pourcentage annuel. Le Département général de la Fatwa de Jordanie a répondu que l'assurance de dettes est autorisée si elle est coopérative et que la dette résulte d'une transaction licite, mais interdite si elle est commerciale. Le Département a précisé que la décision concernant l'assurance de dettes dépend du type d'assurance: si elle est commerciale, son utilisation est prohibée, car l'assurance commerciale est considérée comme illicite par la majorité des juristes et des académies de jurisprudence islamique (fiqh), car elle s'apparente à un contrat basé sur le jeu. En revanche, si l'assurance est une assurance coopérative islamique, son utilisation est autorisée, car elle repose sur la garantie mutuelle, la coopération et les dons entre les membres du fonds, ce qui correspond à l'avis de la plupart des académies de jurisprudence islamique et des instances de fatwa contemporaines. Elle a conclu que l'assurance des dettes n'est pas contestable si l'assurance est coopérative, puisque le risque de retard ou de non-paiement est un risque qui peut être assuré, à condition que la dette résulte d'une transaction licite, et qu'elle n'est pas autorisée si l'assurance est commerciale."
  tr: "Bir tüccarın bir tüccara yıllık yüzde karşılığında borçlu teklif ettiği soruda, Ürdün Genel Fetva Dairesi, sigorta işbirlikçi ise ve borç izin verilen bir işlemden kaynaklanıyorsa borç sigortasının zararı olmadığını, sigortanın ticari ise ise izin verilmediğini yanıtladı. Bakanlık, borç sigortası kararının sigortanın niteliğine göre değiştiğini; ticari ise ticari sigortanın yasak olduğunu, çünkü çoğu hukukçu ve fıkıh kuruluna göre ticari sigortanın yasak olduğunu, çünkü bunun kumar ve kolaylaştırmaya dayalı bir sözleşme olduğunu yanıtladı. Sigorta İslami ve kooperatif ise, fon katılımcıları arasında dayanışma, işbirliği ve bağış temelinde olduğu için bununla ilgilenmenin izin verilebileceğini belirtti; bu, çoğu fıkıh kurulu ve çağdaş fetva evlerinin görüşüdür. Sigorta işbirlikçi ise borçların sigortalanmasının zararı olmadığı sonucuna varıldı; çünkü gecikme veya ödenmeme riski, borç izin verilen bir işlemden kaynaklanıyorsa sigortalanabilir ve sigorta ticari ise izin verilmez."
  id: "Sebuah pertanyaan tentang seorang pedagang yang perusahaan asuransi menawarkan debitur kepada pedagang dengan persentase tahunan, di mana Departemen Fatwa Umum Yordania menjawab bahwa tidak ada salahnya mengasuransikan utang jika asuransi tersebut kooperatif dan utang berasal dari transaksi yang diperbolehkan, dan tidak diperbolehkan jika asuransi tersebut komersial. Departemen menjawab bahwa aturan asuransi utang berbeda-beda tergantung pada jenis asuransi; jika itu komersial, dilarang untuk mengurusnya, karena asuransi komersial dilarang menurut mayoritas ahli hukum dan dewan yurisprudensi karena merupakan kontrak yang didasarkan pada perjudian dan fasilitasi. Departemen menyatakan bahwa jika asuransi bersifat Islam dan kooperatif, maka diperbolehkan untuk mengurusnya karena didasarkan pada solidaritas, kerja sama, dan donasi di antara peserta dana, yang merupakan pandangan sebagian besar dewan yurisprudensi dan rumah fatwa kontemporer. Pengadilan menyimpulkan bahwa tidak ada kerugian dalam mengasuransikan utang jika asuransi bersifat kooperatif, karena risiko keterlambatan atau tidak dibayar adalah risiko yang dapat diasuransikan, asalkan utang berasal dari transaksi yang diperbolehkan, dan tidak diperbolehkan jika asuransi tersebut bersifat komersial."
