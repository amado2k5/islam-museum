label: { ar: "مدى ورود شيء مخصوص في صيام أيام العشر من ذي الحجة ومشروعية ذلك", en: "The standing of fasting the ten days of Dhu'l-Hijja", ur: "ذوالحجہ کے عشرہ کے روزوں کی مشروعیت", es: "La postura de ayunar los diez días de Dhu'l-Hijja", fr: "Le jeûne des dix jours de Dhu'l-Hijja" }
summary:
  ar: "سائل سأل عما ورد في صيام أيام العشر من ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20678)⁩ أنه يسن صيام العشر الأول من ذي الحجة وهو من أجل المستحبات وأعظم القربات وقد وردت في ثبوته وأفضليته النصوص على ما فصّل الجواب."
  en: "A questioner asked what has been transmitted about fasting the ten days of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20678) answered that it is recommended — among the noblest voluntary works — with texts establishing it set out in the answer."
  ur: "ایک سائل نے ذوالحجہ کے عشرہ کے روزوں کے بارے میں ثابت احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20678)⁩ نے جواب دیا کہ یہ مستحب اور عظیم قربتوں میں ہے — جواب میں نصوص بیان ہوئے۔"
  es: "Un interlocutor preguntó qué se ha transmitido acerca del ayuno de los diez días de Dhu'l-Hijja. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20678) respondió que es recomendable —entre las obras voluntarias más nobles— y los textos que lo establecen se exponen en la respuesta."
  fr: "Un internaute a demandé ce qui avait été transmis concernant le jeûne des dix jours de Dhu al-Hijja. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20678) a répondu que ce jeûne était recommandé – parmi les œuvres surérogatoires les plus nobles – et a cité les textes qui le justifient."
