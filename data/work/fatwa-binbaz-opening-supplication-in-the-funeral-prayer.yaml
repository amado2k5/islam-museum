id: work/fatwa-binbaz-opening-supplication-in-the-funeral-prayer
class: work
kind: fatwa
label: { ar: "حكم دعاء الاستفتاح في صلاة الجنازة", en: "The opening supplication in the funeral prayer", ur: "نمازِ جنازہ میں دعائے استفتاح کا حکم", es: "La súplica inicial en la oración fúnebre", fr: "La supplication d'ouverture dans la prière funéraire", tr: "Cenaze duasında açılış duası hakkındaki karar", id: "Putusan tentang doa pembuka dalam doa pemakaman" }
summary:
  ar: "سؤال عن وجوب دعاء الاستفتاح في الصلاة على الميت، أجاب فيه ابن باز بأن صلاة الجنازة مخففة، وأن العلماء ذكروا أنه لا يُستفتح فيها، بل يبدأ المصلي بالتعوذ والبسملة ويقرأ الفاتحة، لأنها صلاة يُطلب فيها تعجيل الميت والإسراع به، فالأفضل ألا يكون فيها استفتاح، وهذا هو المنصوص عند أهل العلم. وذكر أن بعض أهل العلم يرى فيها استفتاحًا، لكن الأقرب عنده عدمه، لأنها صلاة مخففة ليست ذات ركوع ولا سجود."
  en: "A question whether the opening supplication (du'a al-istiftah) is obligatory in the prayer over the dead, in which Ibn Baz answered that the funeral prayer is a lightened prayer, and that the scholars have said there is no opening supplication in it: the worshipper begins with seeking refuge and the basmala and recites al-Fatiha, because it is a prayer in which haste with the dead is sought, so it is better that there be no opening supplication, and this is what is stated by the people of knowledge. He noted that some scholars hold that there is an opening supplication in it, but that the closer view in his judgement is that there is none, because it is a lightened prayer with neither bowing nor prostration."
  ur: "میت پر نماز میں دعائے استفتاح کے واجب ہونے کے بارے میں سوال، جس میں ابن باز نے جواب دیا کہ نمازِ جنازہ ایک ہلکی نماز ہے، اور علما نے کہا ہے کہ اس میں استفتاح نہیں: نمازی تعوذ اور بسم اللہ سے شروع کر کے فاتحہ پڑھتا ہے، کیونکہ یہ ایسی نماز ہے جس میں میت کو جلد لے جانا مطلوب ہے، لہٰذا بہتر یہ ہے کہ اس میں استفتاح نہ ہو، اور اہلِ علم کے نزدیک یہی منصوص ہے۔ انہوں نے ذکر کیا کہ بعض اہلِ علم اس میں استفتاح کے قائل ہیں، لیکن ان کے نزدیک قریب تر یہ ہے کہ نہ ہو، کیونکہ یہ ہلکی نماز ہے جس میں نہ رکوع ہے نہ سجود۔"
  es: "Una pregunta sobre si la súplica inicial (du'a al-istiftah) es obligatoria en la oración por los difuntos, a lo que Ibn Baz respondió que la oración fúnebre es una oración ligera, y que los eruditos han dicho que no hay súplica inicial en ella: el orante comienza buscando refugio y la basmala y recita al-Fatiha, porque es una oración en la que se busca la prontitud con el difunto, por lo que es mejor que no haya súplica inicial, y esto es lo que afirman los sabios. Señaló que algunos eruditos sostienen que sí hay una súplica inicial, pero que la opinión más cercana en su juicio es que no la hay, porque es una oración ligera sin inclinación ni postración."
  fr: "À la question de savoir si l'invocation initiale (du'a al-istiftah) est obligatoire dans la prière pour les défunts, Ibn Baz répondit que cette prière est une prière allégée et que les savants s'accordent à dire qu'elle ne comporte pas d'invocation initiale: le fidèle commence par implorer la protection divine, récite la basmala et la Fatiha, car il s'agit d'une prière où l'on implore le repos éternel du défunt; il est donc préférable qu'il n'y ait pas d'invocation initiale, et c'est l'avis des gens de science. Il nota que certains savants soutiennent qu'une invocation initiale est requise, mais que, selon lui, l'avis le plus juste est qu'elle n'est pas nécessaire, car il s'agit d'une prière allégée sans inclinaison ni prosternation."
  tr: "Cenaze namazında açılış namazının zorunluluğu hakkında İbn Baz yanıt verdi; cenaze namazının hafifletildiğini ve alimlerin namaz kılanın namazı açmadığını belirttiğini belirtti. Bunun yerine, namaz kılan kişi ta'wudhudh ve Basmala ile başlar ve Al-Fatiha okur; çünkü bu dua merhumun acele ettirildiği ve hızlandırıldığı bir duadır. Açılış duası olmaması tercih edilir, ki bu da alimlerin açıkça belirttiği şeydir. Bazı alimlerin bunu açılış duası olarak gördüğünü, ancak en yakın görüşün ona ait olmadığını, çünkü eğilme veya secde gerektirmeyen hafifletilmiş bir dua olduğunu belirtti."
  id: "Sebuah pertanyaan tentang kewajiban doa pembuka dalam doa pemakaman untuk almarhum, Ibn Baz menjawab bahwa doa pemakaman diringankan, dan para ulama menyebutkan bahwa orang yang berdoa tidak membukanya. Sebaliknya, doa dimulai dengan ta'wudhudh dan Basmala serta membaca Al-Fatiha, karena doa tersebut adalah doa di mana almarhum dipercepat dan dipercepat. Lebih baik bukan doa pembukaan, yang secara eksplisit dinyatakan oleh para ulama. Ia menyebutkan bahwa beberapa ulama menganggapnya sebagai doa pembukaan, tetapi pandangan terdekat tidak sebanding, karena doa itu ringan dan tidak memerlukan tunduk atau sujud."
