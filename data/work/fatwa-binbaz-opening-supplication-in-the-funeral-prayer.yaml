id: work/fatwa-binbaz-opening-supplication-in-the-funeral-prayer
class: work
kind: fatwa
label: { ar: "حكم دعاء الاستفتاح في صلاة الجنازة", en: "The opening supplication in the funeral prayer", ur: "نمازِ جنازہ میں دعائے استفتاح کا حکم" }
summary:
  ar: "سؤال عن وجوب دعاء الاستفتاح في الصلاة على الميت، أجاب فيه ابن باز بأن صلاة الجنازة مخففة، وأن العلماء ذكروا أنه لا يُستفتح فيها، بل يبدأ المصلي بالتعوذ والبسملة ويقرأ الفاتحة، لأنها صلاة يُطلب فيها تعجيل الميت والإسراع به، فالأفضل ألا يكون فيها استفتاح، وهذا هو المنصوص عند أهل العلم. وذكر أن بعض أهل العلم يرى فيها استفتاحًا، لكن الأقرب عنده عدمه، لأنها صلاة مخففة ليست ذات ركوع ولا سجود."
  en: "A question whether the opening supplication (du'a al-istiftah) is obligatory in the prayer over the dead, in which Ibn Baz answered that the funeral prayer is a lightened prayer, and that the scholars have said there is no opening supplication in it: the worshipper begins with seeking refuge and the basmala and recites al-Fatiha, because it is a prayer in which haste with the dead is sought, so it is better that there be no opening supplication, and this is what is stated by the people of knowledge. He noted that some scholars hold that there is an opening supplication in it, but that the closer view in his judgement is that there is none, because it is a lightened prayer with neither bowing nor prostration."
  ur: "میت پر نماز میں دعائے استفتاح کے واجب ہونے کے بارے میں سوال، جس میں ابن باز نے جواب دیا کہ نمازِ جنازہ ایک ہلکی نماز ہے، اور علما نے کہا ہے کہ اس میں استفتاح نہیں: نمازی تعوذ اور بسم اللہ سے شروع کر کے فاتحہ پڑھتا ہے، کیونکہ یہ ایسی نماز ہے جس میں میت کو جلد لے جانا مطلوب ہے، لہٰذا بہتر یہ ہے کہ اس میں استفتاح نہ ہو، اور اہلِ علم کے نزدیک یہی منصوص ہے۔ انہوں نے ذکر کیا کہ بعض اہلِ علم اس میں استفتاح کے قائل ہیں، لیکن ان کے نزدیک قریب تر یہ ہے کہ نہ ہو، کیونکہ یہ ہلکی نماز ہے جس میں نہ رکوع ہے نہ سجود۔"
