id: work/fatwa-amja-who-created-the-creator
class: work
kind: fatwa
label: { ar: "ما قبل الخالق؟", en: "What came before the Creator — an answer to the seeker", ur: "خالق سے پہلے کیا؟", es: "¿Qué existía antes del Creador? — una respuesta para el buscador" }
summary:
  ar: "سألت سائلة شاكرة عن السؤال الذي يحيرها: ما قبل الصفر؟ وما قبل الخالق؟ أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21500 بتاريخ 19 مارس 2008)⁩ أنه يتقبل العقل هذه الحقائق البديهية: ما قبل الصفر الصفر وما قبل أصل المادة المادة وما قبل العدم العدم، فيتقبل العقل أنه ليس قبل الخالق خالق والله ليس قبله بداية لأنه ببساطة هو البداية ذاتها، وكما يتقبل العقل أنه ليس له نهاية فيمكنه الاقتناع بأنه ليس له بداية."
  en: "A woman asking gratefully posed what puzzles her: what is before zero? and what is before the Creator? The site's sharia department (fatwa no. 21500, 19 March 2008) answered that the mind accepts these self-evident truths: before zero is zero, before matter's origin is matter, before nothingness is nothingness — so the mind accepts that there is no creator before the Creator; God has no beginning before Him, for He is, simply, the beginning itself; and as the mind accepts He has no end, it can be convinced He has no beginning."
  ur: "ایک سائلہ نے خالق سے پہلے کیا ہے پوچھا۔ شریعت شعبے ⁦(فتویٰ 21500، 19 مارچ 2008)⁩ کے مطابق جیسے صفر سے پہلے صفر ہے ویسے خالق سے پہلے خالق نہیں — اللہ خود آغاز ہے۔"
  es: "Una mujer, agradecida, planteó su inquietud: ¿qué hay antes del cero? ¿Y qué hay antes del Creador? El departamento de la sharia del sitio (fatwa n.° 21500, 19 de marzo de 2008) respondió que la mente acepta estas verdades evidentes: antes del cero hay cero, antes del origen de la materia hay materia, antes de la nada hay nada; por lo tanto, la mente acepta que no hay creador antes del Creador; Dios no tiene principio antes de Él, porque Él es, simplemente, el principio mismo; y como la mente acepta que Él no tiene fin, puede convencerse de que Él no tiene principio."
