id: work/fatwa-amja-who-created-the-creator
class: work
kind: fatwa
label: { ar: "ما قبل الخالق؟", en: "What came before the Creator — an answer to the seeker", ur: "خالق سے پہلے کیا؟", es: "¿Qué existía antes del Creador? — una respuesta para el buscador", fr: "Ce qui existait avant le Créateur — une réponse au chercheur", tr: "Yaratıcıdan önce mi?", id: "Sebelum Sang Pencipta?" }
summary:
  ar: "سألت سائلة شاكرة عن السؤال الذي يحيرها: ما قبل الصفر؟ وما قبل الخالق؟ أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21500 بتاريخ 19 مارس 2008)⁩ أنه يتقبل العقل هذه الحقائق البديهية: ما قبل الصفر الصفر وما قبل أصل المادة المادة وما قبل العدم العدم، فيتقبل العقل أنه ليس قبل الخالق خالق والله ليس قبله بداية لأنه ببساطة هو البداية ذاتها، وكما يتقبل العقل أنه ليس له نهاية فيمكنه الاقتناع بأنه ليس له بداية."
  en: "A woman asking gratefully posed what puzzles her: what is before zero? and what is before the Creator? The site's sharia department (fatwa no. 21500, 19 March 2008) answered that the mind accepts these self-evident truths: before zero is zero, before matter's origin is matter, before nothingness is nothingness — so the mind accepts that there is no creator before the Creator; God has no beginning before Him, for He is, simply, the beginning itself; and as the mind accepts He has no end, it can be convinced He has no beginning."
  ur: "ایک سائلہ نے خالق سے پہلے کیا ہے پوچھا۔ شریعت شعبے ⁦(فتویٰ 21500، 19 مارچ 2008)⁩ کے مطابق جیسے صفر سے پہلے صفر ہے ویسے خالق سے پہلے خالق نہیں — اللہ خود آغاز ہے۔"
  es: "Una mujer, agradecida, planteó su inquietud: ¿qué hay antes del cero? ¿Y qué hay antes del Creador? El departamento de la sharia del sitio (fatwa n.° 21500, 19 de marzo de 2008) respondió que la mente acepta estas verdades evidentes: antes del cero hay cero, antes del origen de la materia hay materia, antes de la nada hay nada; por lo tanto, la mente acepta que no hay creador antes del Creador; Dios no tiene principio antes de Él, porque Él es, simplemente, el principio mismo; y como la mente acepta que Él no tiene fin, puede convencerse de que Él no tiene principio."
  fr: "Une femme, exprimant sa gratitude, a posé la question qui l'intrigue: qu'y a-t-il avant le zéro ? Et qu'y a-t-il avant le Créateur ? Le département de la charia du site (fatwa n° 21500, 19 mars 2008) a répondu que l'esprit accepte ces vérités évidentes: avant le zéro, il y a zéro; avant l'origine de la matière, il y a matière; avant le néant, il y a néant. L'esprit accepte donc qu'il n'y a pas de créateur avant le Créateur; Dieu n'a pas de commencement avant Lui, car Il est, tout simplement, le commencement même; et comme l'esprit accepte qu'Il n'a pas de fin, il peut être convaincu qu'Il n'a pas de commencement."
  tr: "Minnettar bir soruya onu şaşırtan soruyu sordum: Sıfırdan önce ne vardır? Ve Yaratıcıdan önce? Web sitesindeki dini bölüm (Fetva No. 21500, 19 Mart 2008) aklın şu apaçık gerçekleri kabul ettiğini yanıtladı: sıfırdan önce, maddenin kökeninden önce ve hiçlikten önce hiçliktir. Zihin, Yaratıcı'dan önce yaratıcı olmadığını kabul eder ve Tanrı O'ndan önce bir başlangıç yapmaz çünkü O sadece başlangıçtır. Akıl sonu olmadığını kabul ettiği gibi, başlangıcı olmadığına da ikna edilebilir."
  id: "Saya bertanya kepada seorang penanya yang bersyukur tentang pertanyaan yang membingungkannya: Apa yang terjadi sebelum nol? Dan sebelum Sang Pencipta? Bagian agama di situs web (Fatwa No. 21500 tanggal 19 Maret 2008) menjawab bahwa akal menerima fakta-fakta yang jelas ini: sebelum nol nol, sebelum asal mula materi, dan sebelum kehampaan adalah kehampaan. Pikiran menerima bahwa tidak ada pencipta sebelum Sang Pencipta, dan Tuhan tidak mendahului Dia karena Dia hanyalah awal itu sendiri. Sama seperti akal menerima bahwa ia tidak memiliki akhir, ia dapat diyakinkan bahwa ia tidak memiliki awal."
