id: work/fatwa-aliftaa-jo-a-car-raffle-at-a-charity-bazaar
class: work
kind: fatwa
label: { ar: "السحب على سيارة في بازار خيري", en: "A car raffle at a charity bazaar", ur: "خیراتی بازار میں گاڑی کی قرعہ اندازی" }
summary:
  ar: "سؤال من جمعية خيرية تريد بيع قسائم مدفوعة للسحب على سيارة لزيادة ريع بازار مخصص للإغاثة، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذا السحب محرم لأنه من القمار، واقترحت بديلًا بتذاكر دخول تُشترى تبرعًا دون سحب. أجابت الدائرة بأن الأصل في المسابقات التي يدخلها المشترك محتملًا الربح أو الخسارة المادية أنها من القمار المحرم الذي عده العلماء من الكبائر. وقالت إن السحب المذكور يأخذ حكم المسابقات المحرمة، ولا يغير الحكم أن تكون الجائزة من أموال المتسابقين أو تبرعًا من طرف خارجي، ولا أن يكون الريع لغاية مطلوبة شرعًا، لأن الغاية لا تبرر الوسيلة، ولأن كل مشترك إما أن يغنم وإما أن يغرم. واقترحت بديلًا بأن تُطرح أوراق لدخول البازار بثمن رمزي، كدينار، يشتريها الناس تبرعًا طلبًا للأجر لا للربح، دون سحب على البطاقات. وخلصت إلى تحريم تنظيم السحب المذكور، ونصحت باستبداله بجمع تبرعات تذهب إلى المحتاجين في غزة."
  en: "A question from a charity that wanted to sell paid coupons for a car raffle to raise a relief bazaar's proceeds, in which Jordan's General Iftaa Department answered that the raffle is forbidden as gambling, and proposed instead entry tickets bought as a donation with no draw. The Department answered that competitions in which the participant stands either to gain or to lose money are, in principle, forbidden gambling, which scholars count among the major sins. It said the draw described takes the ruling of forbidden competitions, and the ruling does not change whether the prize comes from the participants' money or is donated by an outside party, nor because the proceeds serve a lawful aim, since the end does not justify the means and every participant either wins or loses. It proposed instead that bazaar entry tickets be offered at a token price, such as a dinar, which people buy as a donation seeking reward rather than gain, with no draw on the tickets. It concluded that organising the draw is forbidden, and advised replacing it with a collection of donations for those in need in Gaza."
  ur: "ایک خیراتی انجمن کا سوال جو امدادی بازار کی آمدنی بڑھانے کے لیے گاڑی کی قرعہ اندازی کے ادا شدہ کوپن بیچنا چاہتی تھی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ قرعہ اندازی جوا ہونے کی وجہ سے حرام ہے، اور اس کے بجائے بغیر قرعہ اندازی کے عطیے کے طور پر خریدے جانے والے داخلہ ٹکٹ تجویز کیے۔ ڈیپارٹمنٹ نے جواب دیا کہ جن مقابلوں میں شریک مالی نفع یا نقصان کے امکان کے ساتھ داخل ہو وہ اصلاً حرام جوا ہیں، جسے علماء نے کبیرہ گناہوں میں شمار کیا ہے۔ اس نے کہا کہ مذکورہ قرعہ اندازی حرام مقابلوں کے حکم میں ہے، اور حکم اس سے نہیں بدلتا کہ انعام شرکا کے مال سے ہو یا کسی بیرونی فریق کا عطیہ، نہ اس سے کہ آمدنی کسی شرعاً مطلوب مقصد کے لیے ہو، کیونکہ مقصد ذریعے کو جائز نہیں بناتا اور ہر شریک یا تو جیتتا ہے یا ہارتا ہے۔ اس نے متبادل تجویز کیا کہ بازار میں داخلے کے ٹکٹ معمولی قیمت، مثلاً ایک دینار، پر پیش کیے جائیں جنہیں لوگ نفع کے بجائے اجر کی نیت سے عطیہ کے طور پر خریدیں، اور ٹکٹوں پر کوئی قرعہ اندازی نہ ہو۔ اس نے نتیجہ نکالا کہ مذکورہ قرعہ اندازی کا انتظام حرام ہے، اور مشورہ دیا کہ اسے غزہ کے ضرورت مندوں کے لیے عطیات جمع کرنے سے بدل دیا جائے۔"
