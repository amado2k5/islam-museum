structure: "فاتحة المؤلف وثبت مصادره (ص5–14 من طبعة دار الكتب العلمية)؛ القسم الأول في مناقب الأعداد (ص15–70): الباب الأول فيما تضمن ذكر العشرة وغيرهم (ص17)، الثاني فيما تضمن ذكر العشرة (ص31)، الثالث فيما دون العشرة منهم (ص37)، الرابع فيما اختص بالخلفاء الأربعة (ص47)، الخامس فيما اختص بأبي بكر وعمر وعثمان (ص61)؛ القسم الثاني في مناقب الآحاد (ص71–): أبو بكر (ص73، في خمسة عشر فصلاً)، عمر (ص271)، عثمان (ص446)، علي (ص544)، طلحة (ص686)، الزبير (ص712)، عبد الرحمن بن عوف (ص742)، سعد بن أبي وقاص (ص760)، سعيد بن زيد (ص778)، أبو عبيدة بن الجراح (ص786)."
