label: { ar: "الرياض النضرة في مناقب العشرة", en: "al-Riyad al-Nadira fi Manaqib al-'Ashara", ur: "الریاض النضرہ فی مناقب العشرہ" }
summary:
  ar: "كتاب في فضائل العشرة المبشرين بالجنة لمحب الدين الطبري المكي الشافعي ⁦(ت 694هـ)⁩، يجمع الأحاديث والآثار محذوفة الأسانيد معزوة إلى مخرّجيها من نحو مئات المصادر والأجزاء الحديثية، في قسمين: مناقب الأعداد في خمسة أبواب، ومناقب الآحاد في عشرة أبواب لكل واحد من العشرة باب."
  en: "A book on the virtues of the ten Companions promised Paradise by Muhibb al-Din al-Tabari of Mecca, a Shafi'i (d. 694 AH). It gathers hadiths and reports without their chains but referred to their sources, drawn from hundreds of books and hadith fascicles, in two sections: the virtues of groups, in five chapters, and the virtues of individuals, in ten chapters, one for each of the ten."
