label: { ar: "المحكم في نقط المصاحف", en: "al-Muhkam fi Naqt al-Masahif", ur: "المحکم فی نقط المصاحف", es: "al-Muhkam fi Naqt al-Masahif", fr: "al-Muhkam fi Naqt al-Masahif", tr: "Kur'an'daki maddelerde hakem", id: "Arbiter dalam poin-poin Al-Qur'an" }
summary:
  ar: "كتاب أبي عمرو الداني في نقط المصاحف وشكلها، تحيل إليه حواشي «الإتقان» المحققة لبيان من ابتدأ النقط والشكل وما كُره منه وما أُجيز، وينقل السيوطي عن الداني أنه لا يستجيز النقط بالسواد ويرى أن تكون الحركات والتنوين والتشديد والسكون والمد بالحمرة والهمزات بالصفرة {cite:itqan-suyuti p. 2245} {cite:itqan-suyuti p. 2249}."
  en: "Abu Amr al-Dani's book on the dotting and vowelling of the mushafs. The notes of the edited Itqan refer to it for who began dotting and vowelling and what was disliked and allowed, and al-Suyuti reports that al-Dani does not allow dotting in black ink and would have the vowels, tanwin, shadda, sukun and madd in red and the hamzas in yellow {cite:itqan-suyuti p. 2245} {cite:itqan-suyuti p. 2249}."
  ur: "ابو عمرو دانی کی مصاحف کے نقطے اور شکل پر کتاب؛ «الاتقان» کے محقق حواشی اس کا حوالہ اس کے لیے دیتے ہیں کہ نقط و شکل کی ابتدا کس نے کی اور کیا ناپسند اور کیا جائز رہا، اور سیوطی دانی سے نقل کرتے ہیں کہ وہ سیاہی سے نقطے لگانا جائز نہیں سمجھتے اور چاہتے ہیں کہ حرکات، تنوین، تشدید، سکون اور مد سرخ اور ہمزے زرد رنگ میں ہوں {cite:itqan-suyuti p. 2245} {cite:itqan-suyuti p. 2249}۔"
  es: "El libro de Abu Amr al-Dani sobre la puntuación y la vocalización de los mushafs. Las notas del Itqan editado hacen referencia a él para saber quién empezó a utilizar la puntuación y la vocalización, qué se desaprobaba y qué se permitía, y al-Suyuti informa que al-Dani no permite la puntuación en tinta negra y que las vocales, tanwin, shadda, sukun y madd estarían en rojo y las hamzas en amarillo {cite:itqan-suyuti p. 2245} {cite:itqan-suyuti p. 2249}."
  fr: "L'ouvrage d'Abu Amr al-Dani sur la ponctuation et la vocalisation des mushafs est cité dans les notes de l'édition Itqan, qui précisent qui a introduit cette pratique et ce qui était autorisé ou non. Al-Suyuti rapporte qu'al-Dani n'autorise pas la ponctuation à l'encre noire et préconise l'utilisation du rouge pour les voyelles, le tanwin, le shadda, le sukun et le madd, et du jaune pour les hamzas (citations: Itqan-Suyuti, p. 2245 et 2249)."
  tr: "Ebu Amr el-Dani'nin Kur'an'ın noktalar ve morfolojisi üzerine kitabı, 'El-İtqan'ın kenar notlarıyla ona atıfta bulunur; bu notlar nokta ve şekillerin kimden başladığını, neyin sevilmediğini ve neyin izin verildiğini açıklar. El-Dani'den al-Suyuti, siyah noktalara izin vermediğini ve ünlülerin, tanweenin, şaddah, sukun ve uzatmanın kırmızı, hamzat ise sarı olması gerektiğine inandığını bildirir. {cite:itqan-suyuti s. 2245} {cite:itqan-suyuti s. 2249}."
  id: "Buku Abu Amr al-Dani tentang titik dan morfologi Al-Qur'an merujuk kepadanya dengan catatan pinggir 'Al-Itqan' yang menjelaskan siapa yang memulai titik dan bentuk, apa yang tidak disukai dan apa yang diperbolehkan. Al-Suyuti melaporkan dari Al-Dani bahwa ia tidak mengizinkan titik hitam dan percaya bahwa vokal, tanween, shaddah, sukoon, dan pemanjangan harus berwarna merah dan hamzat harus kuning. {cite:itqan-suyuti hlm. 2245} {cite:itqan-suyuti hlm. 2249}."
