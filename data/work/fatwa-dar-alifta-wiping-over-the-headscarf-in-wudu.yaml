id: work/fatwa-dar-alifta-wiping-over-the-headscarf-in-wudu
class: work
kind: fatwa
label: { ar: "حكم الاقتصار على المسح فوق الخمار في الوضوء", en: "Wiping only over the headscarf in ablution", ur: "وضو میں صرف خمار کے اوپر مسح کرنے کا حکم", es: "Limpiarse únicamente sobre el pañuelo de la cabeza durante la ablución.", fr: "S'essuyer uniquement sur le foulard lors des ablutions", tr: "El çekim sırasında peçenin silinmesini sınırlama kuralları", id: "Aturan tentang pembatasan penghapusan di atas kerudung saat wudhu" }
summary:
  ar: "سؤال عن امرأة يصعب عليها في عملها خلع الخمار عند الوضوء، هل يجوز لها المسح عليه بدلًا من مسح الرأس، أجابت فيه دار الإفتاء المصرية بأن القدر الواجب في مسح الرأس إيصال البلل إلى أي جزء منه ولو قلّ كشعرة أو جزء منها، وهو ما تستطيعه المرأة بمسح مقدم رأسها من تحت خمارها، فلا تكتفي بالمسح على الخمار بل تمسح الشعر بالقدر الذي تستطيعه، فإن وضعت يدها المبتلة فوق الخمار فوصل البلل إلى الشعر أجزأها وصح وضوؤها. بيّنت الدار إجماع الفقهاء على أن مسح الرأس ركن من أركان الوضوء مع اختلافهم في القدر الواجب، وأن الفتوى على مذهب الشافعية في إجزاء مسح بعض الشعر في حد الرأس، وأن الاقتصار على المسح فوق الخمار لا يصح به الوضوء عند الحنفية والمالكية والحنابلة في رواية وجماعة من السلف لعدم تحقق المسح المأمور به ولأن الخمار لا يشق نزعه كالطاقية، ووافقهم الشافعية إن لم يصل البلل إلى الشعر، ونقلت فعل عائشة بإدخال يدها من تحت الرداء، ثم ذكرت أن الحنابلة في المذهب وابن حزم يجيزون المسح على الخمار استنادًا إلى حديث بلال في المسح على الخفين والخمار وفعل أم سلمة والحسن، بشرط أن يكون مدارًا تحت الحلق وملبوسًا على طهارة كاملة وفي مدة مسح الخفين."
  en: "A question about a woman who finds it hard at work to remove her headscarf for ablution and asks whether she may wipe over it instead of wiping her head; Dar al-Ifta al-Misriyya answered that the obligatory minimum in wiping the head is conveying moisture to any part of it, however small, even a single hair or part of one, which a woman can do by wiping the front of her head from under her scarf, so she should not be content with wiping over the scarf but should wipe the hair itself as far as she can; if she places her wet hand on the scarf and the moisture reaches the hair, that suffices and her ablution is valid. Dar al-Ifta set out the jurists' consensus that wiping the head is an essential element of ablution while they differ on the obligatory amount, that the fatwa follows the Shafi'i view that wiping part of the hair within the bounds of the head suffices, and that wiping only over the scarf does not make ablution valid according to the Hanafis, Malikis, Hanbalis in one report and a group of early scholars, because the commanded wiping is not achieved and because a scarf is not hard to remove, like a cap; the Shafi'is agree when the moisture does not reach the hair. It cited Aisha's practice of putting her hand under her wrap, then noted that the Hanbali school proper and Ibn Hazm allow wiping over the scarf on the strength of Bilal's hadith on wiping over the khuffs and the khimar and the practice of Umm Salama and al-Hasan, on condition that it is wound under the throat, worn in a state of full purity, and within the period allowed for wiping over khuffs."
  ur: "ایک خاتون کے بارے میں سوال جسے کام کے دوران وضو کے لیے خمار اتارنا مشکل ہے اور وہ پوچھتی ہے کہ کیا سر کے مسح کی جگہ اس پر مسح کر سکتی ہے؛ دار الافتاء مصر نے جواب دیا کہ سر کے مسح میں واجب مقدار اس کے کسی بھی حصے تک تری پہنچانا ہے خواہ کم ہو، جیسے ایک بال یا اس کا حصہ، جو عورت اپنے خمار کے نیچے سے سر کے اگلے حصے کا مسح کر کے کر سکتی ہے، لہٰذا وہ خمار پر مسح پر اکتفا نہ کرے بلکہ جتنا ہو سکے بالوں پر مسح کرے؛ اگر وہ گیلا ہاتھ خمار پر رکھے اور تری بالوں تک پہنچ جائے تو کافی ہے اور وضو درست ہے۔ دار الافتاء نے بیان کیا کہ فقہا کا اجماع ہے کہ سر کا مسح وضو کے ارکان میں سے ہے گو واجب مقدار میں اختلاف ہے، فتویٰ شافعیہ کے اس قول پر ہے کہ سر کی حد میں کچھ بالوں کا مسح کافی ہے، اور صرف خمار پر مسح سے حنفیہ، مالکیہ، ایک روایت میں حنابلہ اور سلف کے ایک گروہ کے نزدیک وضو درست نہیں کیونکہ مامور مسح حاصل نہیں ہوتا اور خمار ٹوپی کی طرح اتارنے میں مشکل نہیں؛ شافعیہ اس وقت ان سے متفق ہیں جب تری بالوں تک نہ پہنچے۔ اس نے عائشہ کا چادر کے نیچے ہاتھ ڈالنے کا عمل نقل کیا، پھر ذکر کیا کہ حنابلہ اپنے مذہب میں اور ابن حزم خمار پر مسح کی اجازت دیتے ہیں، بلال کی موزوں اور خمار پر مسح کی حدیث اور ام سلمہ اور حسن کے عمل کی بنا پر، بشرطیکہ وہ گلے کے نیچے لپٹا ہو، مکمل طہارت پر پہنا گیا ہو اور موزوں پر مسح کی مدت کے اندر ہو۔"
  es: "Una mujer que tiene dificultades para quitarse el pañuelo para la ablución en el trabajo y pregunta si puede pasar la mano por encima en lugar de pasarse la mano por la cabeza, recibió la respuesta de Dar al-Ifta al-Misriyya de que lo mínimo obligatorio al pasarse la mano por la cabeza es humedecer cualquier parte de ella, por pequeña que sea, incluso un solo cabello o parte de uno, lo cual una mujer puede hacer pasándose la parte delantera de la cabeza por debajo del pañuelo. Por lo tanto, no debe conformarse con pasar la mano por encima del pañuelo, sino que debe pasarse la mano por el cabello en la medida de lo posible. Si coloca la mano mojada sobre el pañuelo y la humedad llega al cabello, eso es suficiente y su ablución es válida. Dar al-Ifta expone el consenso de los juristas de que limpiarse la cabeza es un elemento esencial de la ablución, aunque difieren en la cantidad obligatoria, que la fatwa sigue la opinión shafi'í de que limpiar parte del cabello dentro de los límites de la cabeza es suficiente, y que limpiarse solo sobre el pañuelo no hace válida la ablución según los hanafíes, malikíes, hanbalíes en un informe y un grupo de eruditos antiguos, porque no se logra la limpieza ordenada y porque un pañuelo no es difícil de quitar, como un gorro; los shafi'ís están de acuerdo cuando la humedad no llega al cabello. Citaba la práctica de Aisha de poner su mano debajo de su velo, y luego señalaba que la escuela Hanbali propiamente dicha e Ibn Hazm permiten limpiar sobre el pañuelo basándose en el hadiz de Bilal sobre limpiar sobre los khuffs y el khimar y la práctica de Umm Salama y al-Hasan, con la condición de que esté enrollado debajo de la garganta, usado en un estado de pureza completa y dentro del período permitido para limpiar sobre los khuffs."
  fr: "Une femme, ayant des difficultés à retirer son foulard pour ses ablutions au travail, se demande si elle peut s'essuyer la tête par-dessus le foulard plutôt que par-dessus. Dar al-Ifta al-Misriyya répond que le minimum requis pour s'essuyer la tête est d'humidifier la moindre partie du visage, même un seul cheveu ou une partie de cheveu. Pour ce faire, elle peut s'essuyer le devant de la tête par-dessous son foulard. Elle ne doit donc pas se contenter de s'essuyer par-dessus le foulard, mais doit s'essuyer les cheveux eux-mêmes autant que possible. Si elle pose sa main humide sur le foulard et que l'humidité atteint les cheveux, cela suffit et ses ablutions sont valides. Dar al-Ifta a exposé le consensus des juristes sur le fait que s'essuyer la tête est un élément essentiel des ablutions, même s'ils divergent sur la quantité obligatoire. La fatwa suit l'avis shafi'ite selon lequel s'essuyer une partie des cheveux à l'intérieur de la tête suffit. Selon les hanafites, les malikites, les hanbalites (d'après un rapport) et un groupe d'érudits anciens, s'essuyer uniquement par-dessus le foulard ne valide pas les ablutions, car l'essuyage prescrit n'est pas effectué et qu'un foulard est facile à enlever, comme un bonnet. Les shafi'ites sont d'accord lorsque l'humidité n'atteint pas les cheveux. Elle a cité la pratique d'Aïcha consistant à mettre sa main sous son châle, puis a noté que l'école hanbalite proprement dite et Ibn Hazm autorisent à essuyer le foulard en se fondant sur le hadith de Bilal concernant l'essuyage des khuffs et du khimar et sur la pratique d'Umm Salama et d'al-Hasan, à condition qu'il soit enroulé sous la gorge, porté en état de pureté absolue et dans le délai imparti pour essuyer les khuffs."
  tr: "Kabdest alma sırasında himarı çıkarmakta zorlanan bir kadın hakkında bir soru: Başını silmek yerine üstünü silmesi caiz midir? Mısırlı Dar al-Ifta, başın silinmesi için gerekli önlemin, saç veya küçük bir kısmı bile olsa, başının herhangi bir yerine ıslaklık sürmek olduğunu yanıtladı. Bir kadın, başının önünü khimarının altından silerek bunu yapabilir. Sadece himarın üzerine değil, saçını da mümkün olduğunca silmelidir. Eğer ıslak elini himarın üzerine koyarsa ve ıslaklık saça ulaşırsa, bu geçerlidir ve abdest alması geçerlidir. Dar, fıkıhlıların başın silmenin bir abdest direği olduğu görüşünü netleştirdi, ancak gerekli miktar konusunda farklılık gösterdiler. Fetva, saçın başa kadar silinmesinin yeterliliği konusundaki Şafii okuluna dayanır ve himarın üzerine silmeyi sınırlamak, Hanefi, Maliki ve Hanbali rivayetlerine ve erken nesillere göre wudu doğrulmaz, çünkü emredilen silme yerine getirilmez ve himarın çıkarılması o kadar zor değildir şapka. Şafiiler, ıslaklık saça ulaşmazsa kabul ettiler. Ayrıca Aişe'nin pelerinin altından elini sokma hareketini de bildirdiler. Sonra okuldaki Hanbalılar ve İbn Hazm'ın, Bilal'in hadislerine dayanarak hhimeri silmeye izin verdikleri, tıpkı Um Salama ve El-Hasan gibi, kulak altında, tam saflıkta ve çorapların silinme sırasında yapılması şartıyla izin verdikleri belirtildi."
  id: "Pertanyaan tentang seorang wanita yang kesulitan melepas khimar saat wudhu: Apakah diperbolehkan dia mengusapnya daripada mengelap kepala? Dar al-Ifta Mesir menjawab bahwa langkah yang diperlukan untuk mengelap kepala adalah dengan mengoleskan kelembapan pada bagian mana pun, meskipun sekecil rambut atau sebagian. Ini yang bisa dilakukan seorang wanita dengan mengelap bagian depan kepalanya dari bawah khimar. Dia tidak hanya harus mengelap khimar tetapi juga mengelap rambut sebanyak mungkin. Jika dia meletakkan tangan basahnya di atas khimar dan kelembapan mencapai rambut, itu sah dan wudusnya sah. Dar menjelaskan bahwa mengelap kepala adalah pilar wudhu yang ditetapkan, meskipun mereka berbeda dalam jumlah yang dibutuhkan. Fatwa ini didasarkan pada mazhab Shafi'i mengenai kecukupan mengelap rambut hingga batas kepala, dan pembatasan mengelap di atas khimar tidak membenarkan wudu menurut narasi Hanafi, Maliki, dan Hanbali serta kelompok generasi awal karena pengeringan yang diperintahkan tidak dipenuhi dan karena khimar tidak sesulit topi. Syafi'i setuju jika kelembapan tidak mencapai rambut. Mereka juga melaporkan tindakan Aisha memasukkan tangannya dari bawah jubah. Kemudian disebutkan bahwa Hanbalis di sekolah dan Ibn Hazm mengizinkan mengelap khimar berdasarkan hadits Bilal tentang mengelap kaus kaki dan khimar, seperti halnya um Salama dan Al-Hasan, asalkan dilakukan di bawah telinga, dipakai dengan kemurnian penuh, dan selama masa mengelap kaus kaki."
