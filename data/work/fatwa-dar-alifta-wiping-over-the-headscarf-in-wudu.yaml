id: work/fatwa-dar-alifta-wiping-over-the-headscarf-in-wudu
class: work
kind: fatwa
label: { ar: "حكم الاقتصار على المسح فوق الخمار في الوضوء", en: "Wiping only over the headscarf in ablution", ur: "وضو میں صرف خمار کے اوپر مسح کرنے کا حکم" }
summary:
  ar: "سؤال عن امرأة يصعب عليها في عملها خلع الخمار عند الوضوء، هل يجوز لها المسح عليه بدلًا من مسح الرأس، أجابت فيه دار الإفتاء المصرية بأن القدر الواجب في مسح الرأس إيصال البلل إلى أي جزء منه ولو قلّ كشعرة أو جزء منها، وهو ما تستطيعه المرأة بمسح مقدم رأسها من تحت خمارها، فلا تكتفي بالمسح على الخمار بل تمسح الشعر بالقدر الذي تستطيعه، فإن وضعت يدها المبتلة فوق الخمار فوصل البلل إلى الشعر أجزأها وصح وضوؤها. بيّنت الدار إجماع الفقهاء على أن مسح الرأس ركن من أركان الوضوء مع اختلافهم في القدر الواجب، وأن الفتوى على مذهب الشافعية في إجزاء مسح بعض الشعر في حد الرأس، وأن الاقتصار على المسح فوق الخمار لا يصح به الوضوء عند الحنفية والمالكية والحنابلة في رواية وجماعة من السلف لعدم تحقق المسح المأمور به ولأن الخمار لا يشق نزعه كالطاقية، ووافقهم الشافعية إن لم يصل البلل إلى الشعر، ونقلت فعل عائشة بإدخال يدها من تحت الرداء، ثم ذكرت أن الحنابلة في المذهب وابن حزم يجيزون المسح على الخمار استنادًا إلى حديث بلال في المسح على الخفين والخمار وفعل أم سلمة والحسن، بشرط أن يكون مدارًا تحت الحلق وملبوسًا على طهارة كاملة وفي مدة مسح الخفين."
  en: "A question about a woman who finds it hard at work to remove her headscarf for ablution and asks whether she may wipe over it instead of wiping her head; Dar al-Ifta al-Misriyya answered that the obligatory minimum in wiping the head is conveying moisture to any part of it, however small, even a single hair or part of one, which a woman can do by wiping the front of her head from under her scarf, so she should not be content with wiping over the scarf but should wipe the hair itself as far as she can; if she places her wet hand on the scarf and the moisture reaches the hair, that suffices and her ablution is valid. Dar al-Ifta set out the jurists' consensus that wiping the head is an essential element of ablution while they differ on the obligatory amount, that the fatwa follows the Shafi'i view that wiping part of the hair within the bounds of the head suffices, and that wiping only over the scarf does not make ablution valid according to the Hanafis, Malikis, Hanbalis in one report and a group of early scholars, because the commanded wiping is not achieved and because a scarf is not hard to remove, like a cap; the Shafi'is agree when the moisture does not reach the hair. It cited Aisha's practice of putting her hand under her wrap, then noted that the Hanbali school proper and Ibn Hazm allow wiping over the scarf on the strength of Bilal's hadith on wiping over the khuffs and the khimar and the practice of Umm Salama and al-Hasan, on condition that it is wound under the throat, worn in a state of full purity, and within the period allowed for wiping over khuffs."
  ur: "ایک خاتون کے بارے میں سوال جسے کام کے دوران وضو کے لیے خمار اتارنا مشکل ہے اور وہ پوچھتی ہے کہ کیا سر کے مسح کی جگہ اس پر مسح کر سکتی ہے؛ دار الافتاء مصر نے جواب دیا کہ سر کے مسح میں واجب مقدار اس کے کسی بھی حصے تک تری پہنچانا ہے خواہ کم ہو، جیسے ایک بال یا اس کا حصہ، جو عورت اپنے خمار کے نیچے سے سر کے اگلے حصے کا مسح کر کے کر سکتی ہے، لہٰذا وہ خمار پر مسح پر اکتفا نہ کرے بلکہ جتنا ہو سکے بالوں پر مسح کرے؛ اگر وہ گیلا ہاتھ خمار پر رکھے اور تری بالوں تک پہنچ جائے تو کافی ہے اور وضو درست ہے۔ دار الافتاء نے بیان کیا کہ فقہا کا اجماع ہے کہ سر کا مسح وضو کے ارکان میں سے ہے گو واجب مقدار میں اختلاف ہے، فتویٰ شافعیہ کے اس قول پر ہے کہ سر کی حد میں کچھ بالوں کا مسح کافی ہے، اور صرف خمار پر مسح سے حنفیہ، مالکیہ، ایک روایت میں حنابلہ اور سلف کے ایک گروہ کے نزدیک وضو درست نہیں کیونکہ مامور مسح حاصل نہیں ہوتا اور خمار ٹوپی کی طرح اتارنے میں مشکل نہیں؛ شافعیہ اس وقت ان سے متفق ہیں جب تری بالوں تک نہ پہنچے۔ اس نے عائشہ کا چادر کے نیچے ہاتھ ڈالنے کا عمل نقل کیا، پھر ذکر کیا کہ حنابلہ اپنے مذہب میں اور ابن حزم خمار پر مسح کی اجازت دیتے ہیں، بلال کی موزوں اور خمار پر مسح کی حدیث اور ام سلمہ اور حسن کے عمل کی بنا پر، بشرطیکہ وہ گلے کے نیچے لپٹا ہو، مکمل طہارت پر پہنا گیا ہو اور موزوں پر مسح کی مدت کے اندر ہو۔"
