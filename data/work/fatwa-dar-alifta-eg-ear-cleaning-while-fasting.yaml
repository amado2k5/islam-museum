id: work/fatwa-dar-alifta-eg-ear-cleaning-while-fasting
class: work
kind: fatwa
label: { ar: "حكم تنظيف الأذن عند الطبيب أثناء الصوم", en: "Having the ear cleaned by a doctor while fasting", ur: "روزے میں ڈاکٹر سے کان کی صفائی", es: "Que un médico le limpie los oídos en ayunas." }
summary:
  ar: "سائل سأل عن تنظيف الأذن بمائع عند الطبيب أثناء الصوم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21746)⁩ أن تنظيف الأذن بمائع سواء كان عند الطبيب أو بواسطة الإنسان نفسه أثناء الصوم لا يفطر ما دامت طبلة الأذن سليمة على ما فصّل الجواب."
  en: "A questioner asked about having the ear cleaned with a fluid by a doctor while fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21746) answered that cleaning the ear with a fluid — by a doctor or oneself — while fasting does not break the fast so long as the eardrum is intact, as the answer details."
  ur: "ایک سائل نے روزے میں ڈاکٹر سے مائع سے کان کی صفائی کرانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21746)⁩ نے جواب دیا کہ کان کی صفائی — ڈاکٹر سے ہو یا خود سے — روزہ نہیں توڑتی جب تک کان کا پردہ سلامت ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de que un médico le limpiara el oído con un líquido durante el ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21746) respondió que limpiar el oído con un líquido —ya sea por un médico o por uno mismo— durante el ayuno no invalida el ayuno siempre y cuando el tímpano esté intacto, como se detalla en la respuesta."
