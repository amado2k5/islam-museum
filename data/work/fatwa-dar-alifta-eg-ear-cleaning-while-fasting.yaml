id: work/fatwa-dar-alifta-eg-ear-cleaning-while-fasting
class: work
kind: fatwa
label: { ar: "حكم تنظيف الأذن عند الطبيب أثناء الصوم", en: "Having the ear cleaned by a doctor while fasting", ur: "روزے میں ڈاکٹر سے کان کی صفائی", es: "Que un médico le limpie los oídos en ayunas.", fr: "Se faire nettoyer l'oreille par un médecin à jeun", tr: "Oruç sırasında doktorun kulağı temizlemesi hakkındaki karar", id: "Aturan tentang pembersihan telinga oleh dokter saat puasa" }
summary:
  ar: "سائل سأل عن تنظيف الأذن بمائع عند الطبيب أثناء الصوم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21746)⁩ أن تنظيف الأذن بمائع سواء كان عند الطبيب أو بواسطة الإنسان نفسه أثناء الصوم لا يفطر ما دامت طبلة الأذن سليمة على ما فصّل الجواب."
  en: "A questioner asked about having the ear cleaned with a fluid by a doctor while fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21746) answered that cleaning the ear with a fluid — by a doctor or oneself — while fasting does not break the fast so long as the eardrum is intact, as the answer details."
  ur: "ایک سائل نے روزے میں ڈاکٹر سے مائع سے کان کی صفائی کرانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21746)⁩ نے جواب دیا کہ کان کی صفائی — ڈاکٹر سے ہو یا خود سے — روزہ نہیں توڑتی جب تک کان کا پردہ سلامت ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de que un médico le limpiara el oído con un líquido durante el ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21746) respondió que limpiar el oído con un líquido —ya sea por un médico o por uno mismo— durante el ayuno no invalida el ayuno siempre y cuando el tímpano esté intacto, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le nettoyage de l'oreille par un médecin pendant le jeûne. La Dar al-Ifta égyptienne (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 21746) a répondu que ce nettoyage, effectué par un médecin ou par la personne elle-même, pendant le jeûne, ne rompt pas ce dernier tant que le tympan est intact, comme le précise la réponse."
  tr: "Bir soru soran kişi, oruç sırasında doktor muayenehanesinde kulağın sıvı ile temizlenmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21746), kulak zarı sağlam olduğu sürece orucu açmadığını yanıtladı; bu detaylı cevapta açıklanmıştır."
  id: "Seorang penanya menanyakan tentang membersihkan telinga dengan cairan di kantor dokter saat berpuasa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21746) menjawab bahwa membersihkan telinga dengan cairan, baik oleh dokter maupun oleh seseorang saat berpuasa, tidak memutus puasa selama gendang telinga masih utuh, seperti yang dijelaskan dalam jawaban rinci."
