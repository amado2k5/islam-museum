label: { ar: "أبيات عبد الله بن أنيس في قتل ابن نبيح الهذلي", en: "Abdullah ibn Unays's verses on killing Ibn Nubayh al-Hudhali", es: "Versículos de Abdullah ibn Unays sobre el asesinato de Ibn Nubayh al-Hudhali", fr: "Vers d'Abdullah ibn Unays sur le meurtre d'Ibn Nubayh al-Hudhali", ur: "عبداللہ بن انیس کی آیات ابن نبیح ہذلی کے قتل پر", tr: "Abdullah ibn Anis'in İbn Nubey el-Hudhali'nin öldürülmesiyle ilgili dizeleri", id: "Ayat-ayat Abdullah ibn Anis tentang pembunuhan Ibn Nubayh al-Hudhali" }
summary:
  ar: "سبعة أبيات على روي الدال يرويها ابن هشام لعبد الله بن أنيس: ترك ابن ثور كالحوار وحوله نوائح يشققن الجيوب، تناوله بسيف مهند والظعن خلفه، وقال له والسيف يعجم رأسه: أنا ابن أنيس فارساً غير قعدد، خذها بضربة ماجد حنيف على دين النبي محمد، وكان إذا همّ النبي بكافر سبق إليه باللسان واليد."
  en: "Seven dal-rhymed verses Ibn Hisham reports as Abdullah ibn Unays's: he left Ibn Thawr like a camel calf with wailing women rending their collars around him, struck him with an Indian sword while the litters were behind, and told him as the sword bit his head: I am Ibn Unays, a horseman of no base stock; take that from a noble hanif upon the religion of the Prophet Muhammad; whenever the Prophet set his mind on an unbeliever he was first to him with tongue and hand."
  es: "Siete versos con rima dal que Ibn Hisham reporta como de Abdullah ibn Unays: dejó a Ibn Thawr como un ternero de camello con mujeres llorando que rasgaban sus collares a su alrededor, lo golpeó con una espada india mientras las literas estaban detrás, y le dijo mientras la espada le mordía la cabeza: Soy Ibn Unays, un jinete de estirpe noble; toma eso de un noble hanif sobre la religión del Profeta Muhammad; siempre que el Profeta se fijaba en un incrédulo, él era el primero en atacarlo con la lengua y la mano."
  fr: "Ibn Hisham rapporte sept vers rimés en dal, attribués à Abdullah ibn Unays: il laissa Ibn Thawr comme un chamelon, entouré de femmes en pleurs qui lui arrachaient leurs colliers, le frappa d'un sabre indien tandis que les litières étaient derrière, et lui dit alors que le sabre lui mordait la tête: Je suis Ibn Unays, un cavalier de haute lignée; tenez cela d'un noble dévot de la religion du Prophète Muhammad; chaque fois que le Prophète s'en prenait à un incroyant, il était le premier à le frapper, verbalement et physiquement."
  ur: "ابن ہشام نے عبداللہ ابن انیس کی روایت کی ہے: اس نے ابن ثور کو اونٹ کے بچھڑے کی طرح چھوڑ دیا جس میں روتی ہوئی عورتیں اس کے گرد گریبان پھیر رہی تھیں، اسے ہندوستانی تلوار سے مارا جب کہ کوڑے پیچھے تھے، اور اس سے کہا کہ تلوار اس کے سر پر کاٹ رہی ہے: میں ابن انیس کا گھوڑا ہوں؛ میں گھوڑے کا سوار نہیں ہوں۔ اس کو دین محمد پر کسی شریف حنیف سے لے لو۔ نبی جب بھی کسی کافر پر دل لگاتے تو سب سے پہلے زبان اور ہاتھ سے اس کی طرف آتے۔"
  tr: "İbn Hişam'ın Abdullah ibn Anis'e anlattığı yedi ayet: İbn Tevr sohbeti bıraktı ve etrafında cepleri bölen ağıtlar vardı. Onu Muhannad'ın kılıcı ve arkasında kılıcı ile aldı ve başını sıkarak, kılıç sıkıca ona şöyle dedi: Ben Anis'in oğluyum, kılıçsız bir şövalyeyim. Bunu Majid Hanif'in Peygamber Muhammed'in dinine yaptığı darbeyle birlikte kabul et. Peygamber bir kâfirle ilgilendiğinde, dili ve eliyle ondan önce gelirdi."
  id: "Tujuh ayat yang diceritakan oleh Ibn Hisham kepada Abdullah ibn Anis: Ibn Thawr meninggalkan percakapan dan di sekelilingnya ratapan yang membelah kantongnya. Dia mengambilnya dengan pedang Muhannad dan pedang di belakangnya, dan berkata kepadanya, dengan pedang mencengkeram kepalanya: Aku adalah putra Anis, seorang ksatria tanpa pedang. Terimalah dengan serangan Majid Hanif terhadap agama Nabi Muhammad. Ketika Nabi berurusan dengan seorang kafir, dia akan mendahuluinya dengan lidah dan tangan."
