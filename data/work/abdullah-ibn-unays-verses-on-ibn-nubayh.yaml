label: { ar: "أبيات عبد الله بن أنيس في قتل ابن نبيح الهذلي", en: "Abdullah ibn Unays's verses on killing Ibn Nubayh al-Hudhali" }
summary:
  ar: "سبعة أبيات على روي الدال يرويها ابن هشام لعبد الله بن أنيس: ترك ابن ثور كالحوار وحوله نوائح يشققن الجيوب، تناوله بسيف مهند والظعن خلفه، وقال له والسيف يعجم رأسه: أنا ابن أنيس فارساً غير قعدد، خذها بضربة ماجد حنيف على دين النبي محمد، وكان إذا همّ النبي بكافر سبق إليه باللسان واليد."
  en: "Seven dal-rhymed verses Ibn Hisham reports as Abdullah ibn Unays's: he left Ibn Thawr like a camel calf with wailing women rending their collars around him, struck him with an Indian sword while the litters were behind, and told him as the sword bit his head: I am Ibn Unays, a horseman of no base stock; take that from a noble hanif upon the religion of the Prophet Muhammad; whenever the Prophet set his mind on an unbeliever he was first to him with tongue and hand."
