id: work/fatwa-dar-alifta-eg-tayammum-over-makeup
class: work
kind: fatwa
label: { ar: "حكم تيمم المرأة التي تضع مستحضرات التجميل", en: "A woman wearing make-up resorting to tayammum", ur: "میک اپ والی عورت کا تیمم کرنا", es: "Una mujer maquillada recurriendo al tayammum", fr: "Une femme maquillée qui a recours au tayammum", tr: "Kozmetik giyen bir kadın için tayammum kararı", id: "Putusan tentang tayammum untuk wanita yang mengenakan kosmetik" }
summary:
  ar: "سائل سأل عن تيمم المرأة التي تضع مستحضرات التجميل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21946)⁩ أنه لا يجوز شرعًا الانتقال من فرض الوضوء أو الغسل إلى رخصة التيمم إلا عند فقد الماء حقيقة أو حكمًا على ما فصّل الجواب."
  en: "A questioner asked about a woman wearing make-up resorting to tayammum. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21946) answered that one may not move from the duty of wudu or ghusl to the licence of tayammum except when water is absent in fact or in law — as the answer details."
  ur: "ایک سائل نے میک اپ پہننے والی عورت کے تیمم کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21946)⁩ نے جواب دیا کہ وضو یا غسل کی فرضیت سے تیمم کی رخصت کی طرف صرف اس وقت جا سکتا ہے جب پانی حقیقت یا حکم میں نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre una mujer que usa maquillaje y recurre al tayammum. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21946) respondió que no se puede pasar de la obligación del wudu o ghusl a la permisividad del tayammum excepto cuando el agua está ausente de hecho o de derecho, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant une femme maquillée qui aurait recours au tayammum. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21946) a répondu qu'il est interdit de passer de l'obligation des ablutions (wudu ou ghusl) à la permission de pratiquer le tayammum, sauf en cas d'absence d'eau, que ce soit de fait ou de droit – comme le précise la réponse."
  tr: "Bir soru soran kişi, kozmetik giyen bir kadının teyem'i (teyammum) hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21946), İslam hukukunda su kaybı veya hüküm verme durumunda veya hüküm verme durumunda evdu veya güsl yükümlülüğünden teyammum imtiyazına geçmenin izin verilmediğini yanıtladı; bu cevabda açıklandı."
  id: "Seorang penanya menanyakan tentang tayammum (tayammum) seorang wanita yang mengenakan kosmetik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21946) menjawab bahwa tidak diperbolehkan dalam hukum Islam untuk beralih dari kewajiban wudu atau ghusl ke konsesi tayammum kecuali ketika air benar-benar hilang atau melalui keputusan, seperti yang dijelaskan dalam jawaban."
