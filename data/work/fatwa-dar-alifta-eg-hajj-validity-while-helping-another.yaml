id: work/fatwa-dar-alifta-eg-hajj-validity-while-helping-another
class: work
kind: fatwa
label: { ar: "مدى إجزاء الحج والعمرة لمن يقوم بمساعدة غيره في أداء المناسك", en: "Does helping another through the rites affect one's own Hajj?", ur: "دوسرے کی مناسک میں مدد کرنے والے کا اپنا حج", es: "¿Afecta el hecho de ayudar a otra persona durante los ritos al propio Hajj?", fr: "Le fait d'aider une autre personne à accomplir les rites a-t-il une incidence sur son propre Hajj ?", tr: "Hac ve Umre için başkalarına ritüelleri yerine getirmede yardımcı olanlara verilen ödülün boyutu", id: "Besarnya hadiah untuk Haji dan Umrah bagi mereka yang membantu orang lain dalam melaksanakan ritual" }
summary:
  ar: "سائل سأل عن إجزاء حجه وعمرته وهو يساعد والدته المسنة في الطواف والسعي بدفعها على كرسي متحرك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20683)⁩ أن مناسك الحج والعمرة صحيحة شرعًا بالنسبة للسائل إذا قام بمساعدة والدته المسنة بدفعها في الطواف والسعي على ما فصّل الجواب."
  en: "A questioner asked whether his own Hajj and umrah remain valid while he pushes his elderly mother in a wheelchair through tawaf and sa'i. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20683) answered that his rites are valid in the sharia — as the answer details."
  ur: "ایک سائل نے پوچھا کہ بزرگ والدہ کو وہیل چیئر پر طواف اور سعی کراتے ہوئے اس کا اپنا حج درست رہتا ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20683)⁩ نے جواب دیا کہ اس کی مناسک صحیح ہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si su propia peregrinación a La Meca (Hajj) y su umrah seguían siendo válidas mientras él empujaba a su anciana madre en silla de ruedas durante el tawaf y el sa'i. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20683) respondió que sus ritos son válidos según la sharia, como se detalla en la respuesta."
  fr: "Un homme a demandé si ses propres rites du Hajj et de la Omra restaient valides pendant qu'il poussait sa mère âgée en fauteuil roulant lors du tawaf et du sa'i. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20683) a répondu que ses rites étaient valides selon la charia, comme le précise la réponse."
  tr: "Bir soru soran kişi, yaşlı annesine Tevif ve Sey'de tekerlekli sandalyede iterek yardım ederken Hac ve Umresinin geçerliliğini sordu. Mısır Dar Al-İfta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20683), cevabında ayrıntılı olarak belirtildiği üzere, soru soran kişinin yaşlı annesini Tewif ve Sa'i'de iterek yardım etmesi halinde Hac ve Umre ayinlerinin İslam hukukuna göre geçerli olduğunu belirtmiştir."
  id: "Seorang penanya menanyakan tentang keabsahan Haji dan Umrahnya sambil membantu ibunya yang sudah lanjut usia di Tawaf dan Sa'i dengan mendorongnya di kursi roda. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20683) menjawab bahwa upacara Haji dan Umrah berlaku menurut hukum Islam bagi penanya jika ia membantu ibunya yang sudah lanjut usia dengan mendorongnya ke dalam Tawaf dan Sa'i, seperti yang dijelaskan dalam jawaban."
