id: work/fatwa-dar-alifta-eg-hajj-validity-while-helping-another
class: work
kind: fatwa
label: { ar: "مدى إجزاء الحج والعمرة لمن يقوم بمساعدة غيره في أداء المناسك", en: "Does helping another through the rites affect one's own Hajj?", ur: "دوسرے کی مناسک میں مدد کرنے والے کا اپنا حج" }
summary:
  ar: "سائل سأل عن إجزاء حجه وعمرته وهو يساعد والدته المسنة في الطواف والسعي بدفعها على كرسي متحرك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20683)⁩ أن مناسك الحج والعمرة صحيحة شرعًا بالنسبة للسائل إذا قام بمساعدة والدته المسنة بدفعها في الطواف والسعي على ما فصّل الجواب."
  en: "A questioner asked whether his own Hajj and umrah remain valid while he pushes his elderly mother in a wheelchair through tawaf and sa'i. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20683) answered that his rites are valid in the sharia — as the answer details."
  ur: "ایک سائل نے پوچھا کہ بزرگ والدہ کو وہیل چیئر پر طواف اور سعی کراتے ہوئے اس کا اپنا حج درست رہتا ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20683)⁩ نے جواب دیا کہ اس کی مناسک صحیح ہیں — جیسا کہ جواب میں تفصیل ہے۔"
