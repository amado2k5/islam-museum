id: work/fatwa-aliftaa-jo-imported-sheep-for-the-sacrifice
class: work
kind: fatwa
label: { ar: "التضحية بالذبائح الرومانية والأسترالية", en: "Romanian and Australian sheep for the sacrifice", ur: "رومانیہ اور آسٹریلیا کی بھیڑوں کی قربانی", es: "Ovejas rumanas y australianas para el sacrificio", fr: "Des moutons roumains et australiens pour le sacrifice", tr: "Roma ve Avustralya kurbanları", id: "Pengorbanan Romawi dan Australia" }
summary:
  ar: "سؤال عن التضحية بالذبائح الرومانية والأسترالية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الشاة تجزئ إذا بلغت السن المعتبرة شرعًا وسلمت من العيوب المضرة، بصرف النظر عن بلد المنشأ. أجابت الدائرة بأن الشاة إذا توفرت فيها شروط الأضحية من بلوغ السن المعتبرة شرعًا والسلامة من العيوب المضرة أجزأت، بصرف النظر عن بلد المنشأ. وقالت إنه يجوز بذلك التضحية بالذبائح الرومانية والأسترالية والإسبانية والهندية والسودانية والبلدية وغيرها."
  en: "A question about romanian and Australian sheep for the sacrifice, in which Jordan's General Iftaa Department answered that a sheep is valid if it has reached the age the law requires and is free of harmful defects, whatever its country of origin. The Department answered that a sheep that meets the conditions of the sacrifice, having reached the age the law requires and being free of harmful defects, is valid regardless of its country of origin. It said that Romanian, Australian, Spanish, Indian, Sudanese, local and other sheep may therefore be offered."
  ur: "رومانیہ اور آسٹریلیا کی بھیڑوں کی قربانی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بھیڑ اگر شرعی عمر کو پہنچی ہو اور نقصان دہ عیوب سے پاک ہو تو قربانی درست ہے، خواہ وہ کسی ملک کی ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ جس بھیڑ میں قربانی کی شرائط پوری ہوں، یعنی شرعی طور پر معتبر عمر کو پہنچی ہو اور نقصان دہ عیوب سے پاک ہو، وہ کافی ہے چاہے اس کا ملکِ پیدائش کوئی بھی ہو۔ اس نے کہا کہ اس لیے رومانیہ، آسٹریلیا، اسپین، ہندوستان، سوڈان، مقامی اور دیگر بھیڑوں کی قربانی جائز ہے۔"
  es: "Una pregunta sobre ovejas rumanas y australianas para el sacrificio, a la que el Departamento General de Iftaa de Jordania respondió que una oveja es válida si ha alcanzado la edad exigida por la ley y está libre de defectos perjudiciales, independientemente de su país de origen. El Departamento respondió que una oveja que cumple con las condiciones del sacrificio, habiendo alcanzado la edad exigida por la ley y estando libre de defectos perjudiciales, es válida sin importar su país de origen. Añadió que, por lo tanto, se pueden ofrecer ovejas rumanas, australianas, españolas, indias, sudanesas, locales y de otras procedencias."
  fr: "Une question concernant les moutons roumains et australiens destinés au sacrifice a été posée. Le Département général de la Iftaa de Jordanie a répondu qu'un mouton est valable s'il a atteint l'âge requis par la loi et est exempt de défauts nocifs, quelle que soit son origine. Le Département a précisé qu'un mouton répondant aux conditions du sacrifice, à savoir avoir atteint l'âge légal et être exempt de défauts nocifs, est valable indépendamment de son pays d'origine. Il a ajouté que les moutons roumains, australiens, espagnols, indiens, soudanais, locaux et autres peuvent donc être offerts en sacrifice."
  tr: "Roma ve Avustralya kesilmiş hayvanlarının kurban edilmesi hakkında bir soru, Ürdün Genel Fetva Dairesi, bir koyunun yasal olarak geçerli yaşa ulaşması ve zararlı kusurlardan arınmış olması halinde geçerli olduğunu yanıtladı. Bakanlık, koyunun kurban koşullarını yasal olarak geçerli yaşa ulaşması ve zararlı kusurlardan arınması durumunda, menşe ülkesi ne olursa olsun yeterli olduğunu yanıtladı. Roma, Avustralya, İspanyol, Hint, Sudan, belediye ve diğer kesilen hayvanların kurban edilmesinin izin verildiğini belirtti."
  id: "Sebuah pertanyaan tentang pengorbanan hewan yang disembelih oleh Romawi dan Australia, di mana Departemen Fatwa Umum Yordania menjawab bahwa domba sah jika mencapai usia hukum yang sah dan bebas dari cacat berbahaya, terlepas dari negara asal. Departemen menjawab bahwa jika domba memenuhi syarat pengorbanan mencapai usia yang sah secara hukum dan bebas dari cacat berbahaya, maka sudah cukup, terlepas dari negara asal. Departemen tersebut menyatakan bahwa pengorbanan hewan Romawi, Australia, Spanyol, India, Sudan, kota, dan hewan lain yang disembelih diperbolehkan."
