id: work/fatwa-aliftaa-jo-imported-sheep-for-the-sacrifice
class: work
kind: fatwa
label: { ar: "التضحية بالذبائح الرومانية والأسترالية", en: "Romanian and Australian sheep for the sacrifice", ur: "رومانیہ اور آسٹریلیا کی بھیڑوں کی قربانی" }
summary:
  ar: "سؤال عن التضحية بالذبائح الرومانية والأسترالية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الشاة تجزئ إذا بلغت السن المعتبرة شرعًا وسلمت من العيوب المضرة، بصرف النظر عن بلد المنشأ. أجابت الدائرة بأن الشاة إذا توفرت فيها شروط الأضحية من بلوغ السن المعتبرة شرعًا والسلامة من العيوب المضرة أجزأت، بصرف النظر عن بلد المنشأ. وقالت إنه يجوز بذلك التضحية بالذبائح الرومانية والأسترالية والإسبانية والهندية والسودانية والبلدية وغيرها."
  en: "A question about romanian and Australian sheep for the sacrifice, in which Jordan's General Iftaa Department answered that a sheep is valid if it has reached the age the law requires and is free of harmful defects, whatever its country of origin. The Department answered that a sheep that meets the conditions of the sacrifice, having reached the age the law requires and being free of harmful defects, is valid regardless of its country of origin. It said that Romanian, Australian, Spanish, Indian, Sudanese, local and other sheep may therefore be offered."
  ur: "رومانیہ اور آسٹریلیا کی بھیڑوں کی قربانی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بھیڑ اگر شرعی عمر کو پہنچی ہو اور نقصان دہ عیوب سے پاک ہو تو قربانی درست ہے، خواہ وہ کسی ملک کی ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ جس بھیڑ میں قربانی کی شرائط پوری ہوں، یعنی شرعی طور پر معتبر عمر کو پہنچی ہو اور نقصان دہ عیوب سے پاک ہو، وہ کافی ہے چاہے اس کا ملکِ پیدائش کوئی بھی ہو۔ اس نے کہا کہ اس لیے رومانیہ، آسٹریلیا، اسپین، ہندوستان، سوڈان، مقامی اور دیگر بھیڑوں کی قربانی جائز ہے۔"
