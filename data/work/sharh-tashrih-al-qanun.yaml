id: work/sharh-tashrih-al-qanun
class: work
kind: book
label: { ar: "شرح تشريح القانون", en: "Commentary on the Anatomy of the Canon", es: "Comentario sobre la anatomía del canon", fr: "Commentaire sur l'anatomie du canon" }
summary:
  ar: "شرح ابن النفيس على مباحث التشريح في القانون لابن سينا. جمع فيه ما قاله ابن سينا في الكتابين الأول والثالث ليكون كلامه في التشريح في موضع واحد، وذكر في مقدمته أنه اعتمد في صور الأعضاء الباطنة على جالينوس، وفي منافعها على النظر {cite:sharh-tashrih-qanun-print p.1}. ويتناول الفصول الأولى منه عظام الرأس والفك والأسنان والفقار {cite:sharh-tashrih-qanun-print p.9} {cite:sharh-tashrih-qanun-print p.35}."
  en: "Ibn al-Nafis's commentary on the anatomy passages of Ibn Sina's Canon. He gathers what Ibn Sina said in Books I and III into one place, and says in his preface that he relied on Galen for the shapes of the inner organs and on reasoned inquiry for their uses {cite:sharh-tashrih-qanun-print p.1}. The opening sections treat the bones of the skull, jaws, teeth and spine {cite:sharh-tashrih-qanun-print p.9} {cite:sharh-tashrih-qanun-print p.35}."
  es: "Comentario de Ibn al-Nafis sobre los pasajes de anatomía del Canon de Ibn Sina. Reúne en un solo lugar lo que Ibn Sina dijo en los Libros I y III, y afirma en su prefacio que se basó en Galeno para las formas de los órganos internos y en la investigación razonada para sus funciones {cite:sharh-tashrih-qanun-print p.1}. Las secciones iniciales tratan sobre los huesos del cráneo, las mandíbulas, los dientes y la columna vertebral {cite:sharh-tashrih-qanun-print p.9} {cite:sharh-tashrih-qanun-print p.35}."
  fr: "Le commentaire d'Ibn al-Nafis sur les passages d'anatomie du Canon d'Ibn Sina rassemble en un seul volume les propos d'Ibn Sina dans les Livres I et III. Dans sa préface, il précise s'être appuyé sur Galien pour la forme des organes internes et sur une réflexion raisonnée quant à leur fonction (voir: sharh-tashrih-qanun-print p.1). Les premières sections traitent des os du crâne, des mâchoires, des dents et de la colonne vertébrale (voir: sharh-tashrih-qanun-print p.9 et p.35)."
