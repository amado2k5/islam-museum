label: { ar: "قرار مجمع الفقه الإسلامي الدولي 193 (20/8) بشأن الهندسة الوراثية والجينوم البشري ⁦(تأجيل)⁩", en: "IIFA resolution 193 (20/8) on genetic engineering and the human genome ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 193 (20/8): جینیاتی انجینئرنگ اور انسانی جینوم ⁦(مؤجل)⁩", es: "Resolución 193 (20/8) de la IIFA sobre ingeniería genética y el genoma humano (aplazada)", fr: "Résolution 193 (20/8) de l'IIFA sur le génie génétique et le génome humain (reportée)", tr: "Uluslararası İslami Fiqh Akademisi Gen Mühendisliği ve İnsan Genomu Hakkında 193 (20/8) sayılı Karar (Erteleme)", id: "Resolusi Akademi Fiqh Islam Internasional 193 (20/8) tentang Rekayasa Genetika dan Genom Manusia (Penundaan)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. كان الموضوع «الهندسة الوراثية والجينوم البشري الجيني من المنظور الإسلامي» قد ورد إلى أمانة المجمع بالبحوث ودارت حوله المناقشات، فرأى المجمع تأجيل إصدار حكم فيه إلى دورة قادمة، وكلف بعقد ندوة فقهية طبية متخصصة بالتعاون مع المنظمة الإسلامية للعلوم الطبية لدراسته استيفاءً. وهو قرار تأجيل لا قرار حكم؛ وقد استكمله المجمع لاحقًا في قراره 203 ⁦(21/9)⁩ بعد ندوة جدة ⁦(ربيع الآخر 1434هـ)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). The subject 'genetic engineering and the human genome from the Islamic perspective' had come to the secretariat with research papers and been discussed, and the Academy resolved to defer a ruling to a coming session, commissioning a specialised juristic-medical seminar with the Islamic Organisation for Medical Sciences to study it fully. A deferral, not a ruling; the Academy completed the subject in resolution 203 (21/9) after the Jeddah seminar of Rabi al-Akhir 1434."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ موضوع 'اسلامی نظریے میں جینیاتی انجینئرنگ اور انسانی جینوم' پر تحقیقات آ چکی تھیں اور مباحث ہو چکے، مگر اکیڈمی نے حکم جاری کرنا اگلی مجلس تک مؤجل کیا اور اسلامی آرگنائزیشن فار میڈیکل سائنسز کے ساتھ ایک مخصوص فقہی-طبی سیمینار منعقد کرانے کا حکم دیا۔ یہ مؤجل کی قرارداد ہے، حکم کی نہیں؛ اکیڈمی نے بعد میں جدہ کی سیمینار ⁦(ربيع الآخر 1434ھ)⁩ کے بعد قرارداد 203 ⁦(21/9)⁩ میں موضوع مکمل کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 20.ª sesión en Orán (26 de Shawwal – 2 de Dhu al-Qada de 1433, 13-18 de septiembre de 2012). El tema «Ingeniería genética y el genoma humano desde la perspectiva islámica» había llegado a la secretaría con trabajos de investigación y se había debatido, y la Academia resolvió aplazar la decisión a una sesión posterior, encargando un seminario jurídico-médico especializado a la Organización Islámica de Ciencias Médicas para su estudio exhaustivo. Un aplazamiento, no una decisión; la Academia concluyó el estudio del tema en la resolución 203 (21/9) tras el seminario de Yeda de Rabi al-Akhir de 1434."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, soit du 13 au 18 septembre 2012). Le sujet « Génie génétique et génome humain dans une perspective islamique » avait été soumis au secrétariat, accompagné de documents de recherche, et avait fait l'objet de discussions. L'Académie avait décidé de reporter sa décision à une session ultérieure et avait mandaté l'Organisation islamique des sciences médicales pour organiser un séminaire juridico-médical spécialisé afin d'étudier la question en profondeur. Il s'agissait d'un report, et non d'une décision; l'Académie a finalement traité ce sujet dans sa résolution 203 (21/9) après le séminaire de Djeddah du mois de Rabi al-Akhir 1434."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Şevval – 2 Dfu al-Qi'de 1433 H, 13–18 Eylül 2012) toplu kararı. \"Genetik Mühendisliği ve İslami Perspektiften İnsan Genomu\" başlıklı konu, Akademi'nin Araştırma ve Tartışmalar Sekreterliği'ne sunuldu. Akademi, bu kararın verilmesini gelecekteki bir oturuma ertelemeye karar verdi ve İslami Tıp Bilimleri Örgütü ile iş birliği içinde kapsamlı bir tıbbi hukuk semineri düzenlemekle görevlendirildi. Bu karar bir erteleme değil, bir erteleme idi; Akademi, Cidde Sempozyumu'ndan (Rabi'al-Thani 1434 Hicri) sonra 203 (21/9) sayılı kararıyla bunu tamamladı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012 M). Topik \"Rekayasa Genetika dan Genom Manusia dari Perspektif Islam\" diajukan ke Sekretariat Akademi untuk Penelitian dan Diskusi. Akademi memutuskan untuk menunda keputusan yang dikeluarkan ke sesi berikutnya dan ditugaskan mengadakan seminar yurisprudensi medis khusus bekerja sama dengan Organisasi Islam untuk Ilmu Kedokteran untuk mempelajarinya secara mendalam. Keputusan ini merupakan penundaan, bukan keputusan; Akademi kemudian menyelesaikannya dalam keputusan 203 (21/9) setelah Simposium Jeddah (Rabi' al-Thani 1434 H)."
