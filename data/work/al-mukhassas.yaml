summary:
  ar: "المخصص لابن سيده، معجم موسوعي كبير مرتّب على نحو غريب المصنف لأبي عبيد القاسم بن سلام، جمع فيه مضامين رسائل اللغويين القدماء في الموضوعات. ألّفه، كما ألّف المحكم، بطلب من مجاهد العامري أمير دانية، ليجمع للأدباء والشعراء والخطباء المترادفات ودقائق الفروق بينها. وله مقدمة طويلة في أصل اللغة، وسبعة عشر كتاباً منها كتاب الإنسان وكتاب النساء وكتاب الخيل، تنقسم إلى أبواب."
  en: "Ibn Sida's al-Mukhassas, a large encyclopaedic dictionary arranged like Abu Ubayd al-Qasim ibn Sallam's al-Gharib al-musannaf, which brings together the contents of the early specialist treatises by subject. He wrote it, like al-Muhkam, at the request of Mujahid al-Amiri, emir of Denia, to give writers, poets and orators the synonyms and the shades of meaning between them. It has a long preface on the origin of language and seventeen books, among them the Book of Man, of Women and of Horses, divided into chapters."
  es: "El al-Mukhassas de Ibn Sida, un gran diccionario enciclopédico ordenado como el al-Gharib al-musannaf de Abu Ubayd al-Qasim ibn Sallam, que reúne por temas el contenido de los antiguos tratados especializados. Lo escribió, como el al-Muhkam, a petición de Mujahid al-Amiri, emir de Denia, para ofrecer a escritores, poetas y oradores los sinónimos y los matices entre ellos. Tiene un largo prólogo sobre el origen de la lengua y diecisiete libros, entre ellos el Libro del Hombre, de las Mujeres y de los Caballos, divididos en capítulos."
  fr: "Le al-Mukhassas d'Ibn Sida, grand dictionnaire encyclopédique ordonné comme le al-Gharib al-musannaf d'Abu Ubayd al-Qasim ibn Sallam, qui rassemble par sujets le contenu des anciens traités spécialisés. Il l'écrivit, comme al-Muhkam, à la demande de Mujahid al-Amiri, émir de Denia, pour offrir aux écrivains, poètes et orateurs les synonymes et les nuances qui les séparent. Il comporte une longue préface sur l'origine de la langue et dix-sept livres, dont le Livre de l'Homme, des Femmes et des Chevaux, divisés en chapitres."
  ur: "ابن سیدہ کی المخصص، ایک بڑی انسائیکلوپیڈیائی لغت جو ابو عبید قاسم بن سلام کی غریب المصنف کی طرز پر مرتب ہے اور قدیم ماہرینِ لغت کے موضوعاتی رسائل کے مضامین کو یکجا کرتی ہے۔ انہوں نے اسے، المحکم کی طرح، دانیہ کے امیر مجاہد عامری کی فرمائش پر لکھا تاکہ ادیبوں، شاعروں اور خطیبوں کو مترادفات اور ان کے باریک فرق مل سکیں۔ اس کا ایک طویل مقدمہ زبان کی اصل پر ہے اور سترہ کتابیں ہیں جن میں کتاب الانسان، کتاب النساء اور کتاب الخیل ہیں، ابواب میں تقسیم۔"
