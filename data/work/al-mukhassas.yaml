summary:
  ar: "المخصص لابن سيده، معجم موسوعي كبير مرتّب على نحو غريب المصنف لأبي عبيد القاسم بن سلام، جمع فيه مضامين رسائل اللغويين القدماء في الموضوعات. ألّفه، كما ألّف المحكم، بطلب من مجاهد العامري أمير دانية، ليجمع للأدباء والشعراء والخطباء المترادفات ودقائق الفروق بينها. وله مقدمة طويلة في أصل اللغة، وسبعة عشر كتاباً منها كتاب الإنسان وكتاب النساء وكتاب الخيل، تنقسم إلى أبواب. وينقل بعلبكي قول ابن سيده في علة وضعه المخصص مبوَّباً بعد المحكم المجنَّس: أنه أجدى على الخطيب والشاعر المتخيرين من الأسماء الكثيرة للشيء ما يلائم سجعاً أو قافية، ويرى في تعاصر المبوَّب والمجنَّس قروناً دليلاً على أن لكل منهما غرضاً وفائدة."
  en: "Ibn Sida's al-Mukhassas, a large encyclopaedic dictionary arranged like Abu Ubayd al-Qasim ibn Sallam's al-Gharib al-musannaf, which brings together the contents of the early specialist treatises by subject. He wrote it, like al-Muhkam, at the request of Mujahid al-Amiri, emir of Denia, to give writers, poets and orators the synonyms and the shades of meaning between them. It has a long preface on the origin of language and seventeen books, among them the Book of Man, of Women and of Horses, divided into chapters. Baalbaki quotes Ibn Sida's reason for making al-Mukhassas a thematic book after the root-ordered al-Muhkam: it served the orator and poet, who choose among the many names of a thing what suits a rhymed prose or a rhyme; and he sees in the centuries of coexistence of the two kinds proof that each has its own purpose."
  es: "El al-Mukhassas de Ibn Sida, un gran diccionario enciclopédico ordenado como el al-Gharib al-musannaf de Abu Ubayd al-Qasim ibn Sallam, que reúne por temas el contenido de los antiguos tratados especializados. Lo escribió, como el al-Muhkam, a petición de Mujahid al-Amiri, emir de Denia, para ofrecer a escritores, poetas y oradores los sinónimos y los matices entre ellos. Tiene un largo prólogo sobre el origen de la lengua y diecisiete libros, entre ellos el Libro del Hombre, de las Mujeres y de los Caballos, divididos en capítulos. Baalbaki cita la razón de Ibn Sida para hacer del al-Mukhassas un libro temático tras el al-Muhkam ordenado por raíces: servía al orador y al poeta, que eligen entre los muchos nombres de una cosa el que conviene a una prosa rimada o a una rima; y ve en los siglos de coexistencia de los dos tipos la prueba de que cada uno tiene su propósito."
  fr: "Le al-Mukhassas d'Ibn Sida, grand dictionnaire encyclopédique ordonné comme le al-Gharib al-musannaf d'Abu Ubayd al-Qasim ibn Sallam, qui rassemble par sujets le contenu des anciens traités spécialisés. Il l'écrivit, comme al-Muhkam, à la demande de Mujahid al-Amiri, émir de Denia, pour offrir aux écrivains, poètes et orateurs les synonymes et les nuances qui les séparent. Il comporte une longue préface sur l'origine de la langue et dix-sept livres, dont le Livre de l'Homme, des Femmes et des Chevaux, divisés en chapitres. Baalbaki cite la raison d'Ibn Sida de faire d'al-Mukhassas un livre thématique après al-Muhkam classé par racines : il servait l'orateur et le poète, qui choisissent parmi les nombreux noms d'une chose celui qui convient à une prose rimée ou à une rime ; et il voit dans les siècles de coexistence des deux types la preuve que chacun a son but."
  ur: "ابن سیدہ کی المخصص، ایک بڑی انسائیکلوپیڈیائی لغت جو ابو عبید قاسم بن سلام کی غریب المصنف کی طرز پر مرتب ہے اور قدیم ماہرینِ لغت کے موضوعاتی رسائل کے مضامین کو یکجا کرتی ہے۔ انہوں نے اسے، المحکم کی طرح، دانیہ کے امیر مجاہد عامری کی فرمائش پر لکھا تاکہ ادیبوں، شاعروں اور خطیبوں کو مترادفات اور ان کے باریک فرق مل سکیں۔ اس کا ایک طویل مقدمہ زبان کی اصل پر ہے اور سترہ کتابیں ہیں جن میں کتاب الانسان، کتاب النساء اور کتاب الخیل ہیں، ابواب میں تقسیم۔ بعلبکی ابن سیدہ کی وہ وجہ نقل کرتے ہیں جس سے انہوں نے مادوں پر مرتب المحکم کے بعد المخصص کو موضوعاتی کتاب بنایا: یہ خطیب اور شاعر کے لیے زیادہ مفید تھی جو کسی شے کے بہت سے ناموں میں سے وہ چنتے ہیں جو سجع یا قافیے کے موافق ہو؛ اور وہ دونوں اقسام کے صدیوں ساتھ رہنے کو اس بات کا ثبوت سمجھتے ہیں کہ ہر ایک کا اپنا مقصد ہے۔"
