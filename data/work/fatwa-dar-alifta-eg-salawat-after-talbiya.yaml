id: work/fatwa-dar-alifta-eg-salawat-after-talbiya
class: work
kind: fatwa
label: { ar: "حكم الصلاة على النبي بعد التلبية", en: "Sending blessings on the Prophet after the talbiya", ur: "تلبیہ کے بعد درود", es: "Enviar bendiciones al Profeta después de la talbiya", fr: "Envoyant des bénédictions sur le Prophète après la talbiya" }
summary:
  ar: "سائل سأل عن ختم المحرم بالحج تلبيته بالصلاة على النبي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20677)⁩ أن ختم المحرم تلبيته بالصلاة على النبي أمر مستحب لأن الملبي وافد على ما فصّل الجواب."
  en: "A questioner asked about the pilgrim closing his talbiya with blessings on the Prophet. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20677) answered that ending the talbiya with the salawat is recommended, the one saying it being an arriving guest — as the answer details."
  ur: "ایک سائل نے حاجی کے تلبیہ کے بعد درود پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20677)⁩ نے جواب دیا کہ یہ مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó sobre la costumbre de concluir su talbiya con bendiciones para el Profeta. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20677) respondió que se recomienda finalizar la talbiya con el salawat, siendo quien la pronuncia un invitado que llega, tal como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant la pratique consistant à conclure la talbiya par une bénédiction sur le Prophète. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20677) a répondu qu'il est recommandé de terminer la talbiya par la salawat, celui qui la prononce étant un hôte arrivant, comme le précise la réponse."
