label: { ar: "حكم الصلاة على النبي بعد التلبية", en: "Sending blessings on the Prophet after the talbiya", ur: "تلبیہ کے بعد درود" }
summary:
  ar: "سائل سأل عن ختم المحرم بالحج تلبيته بالصلاة على النبي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20677)⁩ أن ختم المحرم تلبيته بالصلاة على النبي أمر مستحب لأن الملبي وافد على ما فصّل الجواب."
  en: "A questioner asked about the pilgrim closing his talbiya with blessings on the Prophet. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20677) answered that ending the talbiya with the salawat is recommended, the one saying it being an arriving guest — as the answer details."
  ur: "ایک سائل نے حاجی کے تلبیہ کے بعد درود پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20677)⁩ نے جواب دیا کہ یہ مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
