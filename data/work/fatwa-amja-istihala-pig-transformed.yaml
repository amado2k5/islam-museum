id: work/fatwa-amja-istihala-pig-transformed
class: work
kind: fatwa
label: { ar: "استحالة الخنزير", en: "The pig transformed — does istihala purify it", ur: "خنزیر کی استحالہ — پاکی؟", es: "El cerdo transformado: ¿lo purifica el istihala?", fr: "Le cochon transformé — l'istihala le purifie-t-il ?" }
summary:
  ar: "سأل سائل أنه باستحالة النجاسة تطهر فما حكم الخنزير إذا تحولت عينه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21944 بتاريخ 11 مايو 2006)⁩ أن الخنزير محرم لذاته لذا فالأصل عند الفقهاء أنه إذا تحولت عينه إلى شيء آخر أنه لا يطهر ويظل على الحرمة الأصلية على خلاف بينهم في تفاصيل الأحياء والميتة والجزء والكل على ما فصّل الجواب."
  en: "A questioner noted that impurity is purified by transformation (istihala) and asked about the pig whose substance transforms. Dr. Salah al-Sawi (fatwa no. 21944, 11 May 2006) answered that the pig is forbidden in itself; so the jurists' rule is that where its substance transforms into something else it is not purified and remains on its original prohibition — with differences among them over the living, the dead, part and whole — as the answer details."
  ur: "خنزیر کی استحالہ سے پاکی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21944، 11 مئی 2006)⁩ کے مطابق اصل یہ کہ ذاتی حرام استحالہ سے پاک نہیں ہوتا۔"
  es: "Un consultante señaló que la impureza se purifica mediante la transformación (istihala) y preguntó acerca del cerdo, cuya sustancia se transforma. El Dr. Salah al-Sawi (fatwa n.° 21944, 11 de mayo de 2006) respondió que el cerdo está prohibido en sí mismo; por lo tanto, la regla de los juristas es que cuando su sustancia se transforma en otra cosa, no se purifica y permanece sujeta a su prohibición original, con diferencias entre ellos respecto a los vivos, los muertos, las partes y el todo, como se detalla en la respuesta."
  fr: "Un internaute a fait remarquer que l'impureté est purifiée par transformation (istihala) et a interrogé Salah al-Sawi (fatwa n° 21944, 11 mai 2006) sur le cas du porc dont la substance se transforme. Il a répondu que le porc est interdit en soi; par conséquent, la règle des juristes est que, lorsque sa substance se transforme en autre chose, elle n'est pas purifiée et demeure soumise à son interdiction initiale – avec des divergences entre eux quant à savoir si le porc est vivant, mort, en partie ou en entier – comme le précise la réponse."
