id: work/fatwa-amja-istihala-pig-transformed
class: work
kind: fatwa
label: { ar: "استحالة الخنزير", en: "The pig transformed — does istihala purify it", ur: "خنزیر کی استحالہ — پاکی؟" }
summary:
  ar: "سأل سائل أنه باستحالة النجاسة تطهر فما حكم الخنزير إذا تحولت عينه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21944 بتاريخ 11 مايو 2006)⁩ أن الخنزير محرم لذاته لذا فالأصل عند الفقهاء أنه إذا تحولت عينه إلى شيء آخر أنه لا يطهر ويظل على الحرمة الأصلية على خلاف بينهم في تفاصيل الأحياء والميتة والجزء والكل على ما فصّل الجواب."
  en: "A questioner noted that impurity is purified by transformation (istihala) and asked about the pig whose substance transforms. Dr. Salah al-Sawi (fatwa no. 21944, 11 May 2006) answered that the pig is forbidden in itself; so the jurists' rule is that where its substance transforms into something else it is not purified and remains on its original prohibition — with differences among them over the living, the dead, part and whole — as the answer details."
  ur: "خنزیر کی استحالہ سے پاکی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21944، 11 مئی 2006)⁩ کے مطابق اصل یہ کہ ذاتی حرام استحالہ سے پاک نہیں ہوتا۔"
