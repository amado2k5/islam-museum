  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986) sobre bonos muqarada (mudaraba) y bonos de desarrollo e inversión: la secretaría recibió el encargo de encargar estudios para que la Academia pudiera decidir en su cuarta sesión, lo que posteriormente se resolvió en 30 (4/5)."
