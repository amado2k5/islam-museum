summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: تكليف الأمانة العامة بإعداد عدد من البحوث في سندات المقارضة وسندات التنمية والاستثمار ليتمكن المجمع من اتخاذ القرار المناسب في دورته الرابعة ⁦(انظر القرار 30 (4/5))⁩."
  en: "IIFA's third-session resolution (Amman, October 1986) on muqarada (mudaraba) bonds and development and investment bonds: the secretariat was tasked with commissioning studies so the Academy could decide at its fourth session — later resolved in 30 (4/5)."
