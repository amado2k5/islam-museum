summary:
  ar: "كتاب البلاذري أحمد بن يحيى بن جابر ⁦(ت نحو 279هـ)⁩ في الفتوحات، وصفه مؤلفه في أوله بأنه سوق واختصار لحديث جماعة من أهل العلم بالحديث والسيرة وفتوح البلدان مع رد بعضه على بعض؛ يبدأ بسيرة النبي ملخصة من نزول قباء ثم أخبار الردة، ثم يستقصي الفتوحات إقليماً إقليماً: الشام، فتوح مصر والمغرب حتى الأندلس وجزر البحر، فتوح السواد وتأسيس الكوفة والبصرة وواسط وبغداد، الجبال وهمذان وأصبهان، مقتل يزدجرد، الري وقومس وقزوين وأذربيجان، الموصل وشهرزور وجرجان وطبرستان، كور دجلة، الأهواز وفارس وكرمان وسجستان وكابل وخراسان والسند، ويختم بأحكام الخراج والعطاء — ويذكر المحققان في مقدمتهما أن البلاذري كان يروي حول الواقعة الواحدة روايات متعددة فامتاز ببصيرة المؤرخ الناقد لا مجرد مدون للروايات."
  en: "Al-Baladhuri's (d. c. 279 AH) book of the conquests, described by its author in its opening as a relaying and abridgement of the reports of the learned in hadith, siyar and the conquests of the lands, collated against one another; it opens with a condensed siyar from the halt at Quba' through the Ridda news, then pursues the conquests region by region — Syria, Egypt and the Maghreb to al-Andalus and the islands, the Sawad and the foundations of Kufa, Basra, Wasit and Baghdad, the Jibal and Hamadhan and Isfahan, the killing of Yazdajird, Ray, Qumis, Qazwin, Azerbaijan, Mosul, Shahrazur, Jurjan and Tabaristan, the Tigris districts, Ahwaz, Fars, Kirman, Sijistan, Kabul, Khurasan and Sind — closing with the rulings of kharaj and stipends; the editors note in their introduction that al-Baladhuri narrated several reports around a single event, showing the insight of a critical historian rather than a mere recorder (Mu'assasat al-Ma'arif ed., intro pp. 5–7 and book opening p. 8)."
  es: "El libro de las conquistas de Al-Baladhuri (dc 279 AH), descrito por su autor en su apertura como un reencuentro y resumen de los informes de los eruditos en hadices, siyar y las conquistas de las tierras, cotejados entre sí; comienza con un siyar condensado desde la parada en Quba' hasta las noticias de Ridda, luego sigue las conquistas región por región: Siria, Egipto y el Magreb hasta al-Ándalus y las islas, el Sawad y las fundaciones de Kufa, Basora, Wasit y Bagdad, el Jibal y Hamadhan e Isfahán, la matanza de Yazdajird, Ray, Qumis, Qazwin, Azerbaiyán, Mosul, Shahrazur, Jurjan y Tabaristán, los distritos del Tigris, Ahwaz, Fars, Kirman, Sijistan, Kabul, Jorasán y Sind, y termina con los dictamen de kharaj y estipendios; Los editores señalan en su introducción que al-Baladhuri narró varios informes sobre un mismo acontecimiento, lo que demuestra la perspicacia de un historiador crítico en lugar de un simple cronista (Mu'assasat al-Ma'arif ed., introducción, págs. 5-7 y comienzo del libro, pág. 8)."
  fr: "Le livre des conquêtes d'Al-Baladhuri (mort en 279 AH), décrit par son auteur dans son introduction comme un recueil et un abrégé des rapports des savants en matière de hadiths, de siyar et de conquêtes des terres, compilés les uns par les autres; il s'ouvre sur un siyar condensé depuis l'escale à Quba' jusqu'aux nouvelles de Ridda, puis poursuit les conquêtes région par région — la Syrie, l'Égypte et le Maghreb jusqu'à al-Andalus et les îles, le Sawad et les fondations de Kufa, Bassora, Wasit et Bagdad, le Jibal, Hamadhan et Ispahan, le massacre de Yazdajird, Ray, Qumis, Qazwin, l'Azerbaïdjan, Mossoul, Shahrazur, Jurjan et Tabaristan, les districts du Tigre, Ahwaz, Fars, Kirman, Sijistan, Kaboul, Khorasan et Sind — se terminant par les décisions relatives au kharaj et aux pensions; Les éditeurs notent dans leur introduction qu'al-Baladhuri a relaté plusieurs événements, démontrant ainsi la perspicacité d'un historien critique plutôt que celle d'un simple chroniqueur (Mu'assasat al-Ma'arif éd., intro pp. 5-7 et ouverture du livre p. 8)."
  ur: "البلادھوری کی فتوحات کی کتاب ⁦(ڈی سی 279ھ)⁩، جس کے مصنف نے اپنے آغاز میں حدیث، سیار اور زمینوں کی فتوحات میں علماء کی رپورٹوں کو ایک دوسرے کے خلاف جمع کرنے اور ان کا خلاصہ بیان کیا ہے۔ یہ ردہ کی خبروں کے ذریعے قبا کے مقام سے ایک گاڑھی سیار کے ساتھ کھلتا ہے، پھر خطہ کے لحاظ سے فتوحات کے علاقے کا تعاقب کرتا ہے - شام، مصر اور مغرب سے لے کر اندلس اور جزائر، سواد اور کوفہ کی بنیادیں، بصرہ، وصیت اور بغداد، جبل و حماد، قتل یفساد، قتل یصفی، قطبی قزوین، آذربائیجان، موصل، شہرازور، جرجان اور طبرستان، دجلہ کے اضلاع، اہواز، فارس، کرمان، سجستان، کابل، خراسان اور سندھ — خرج اور وظیفہ کے احکام کے ساتھ اختتام؛ مدیران اپنے تعارف میں نوٹ کرتے ہیں کہ البلادھوری نے ایک واقعہ کے گرد کئی رپورٹیں بیان کیں، جو محض ایک ریکارڈر کے بجائے ایک تنقیدی مورخ کی بصیرت کو ظاہر کرتی ہیں ⁦(مؤسسات المعارف ایڈیشن، تعارف صفحہ 5-7 اور کتاب کا آغاز صفحہ 8)⁩۔"
