label: { ar: "فتوح البلدان", en: "Futuh al-Buldan" }
summary:
  ar: "كتاب البلاذري أحمد بن يحيى بن جابر (ت نحو 279هـ) في الفتوحات، وصفه مؤلفه في أوله بأنه سوق واختصار لحديث جماعة من أهل العلم بالحديث والسيرة وفتوح البلدان مع رد بعضه على بعض؛ يبدأ بسيرة النبي ملخصة من نزول قباء ثم أخبار الردة، ثم يستقصي الفتوحات إقليماً إقليماً: الشام، فتوح مصر والمغرب حتى الأندلس وجزر البحر، فتوح السواد وتأسيس الكوفة والبصرة وواسط وبغداد، الجبال وهمذان وأصبهان، مقتل يزدجرد، الري وقومس وقزوين وأذربيجان، الموصل وشهرزور وجرجان وطبرستان، كور دجلة، الأهواز وفارس وكرمان وسجستان وكابل وخراسان والسند، ويختم بأحكام الخراج والعطاء — ويذكر المحققان في مقدمتهما أن البلاذري كان يروي حول الواقعة الواحدة روايات متعددة فامتاز ببصيرة المؤرخ الناقد لا مجرد مدون للروايات."
  en: "Al-Baladhuri's (d. c. 279 AH) book of the conquests, described by its author in its opening as a relaying and abridgement of the reports of the learned in hadith, siyar and the conquests of the lands, collated against one another; it opens with a condensed siyar from the halt at Quba' through the Ridda news, then pursues the conquests region by region — Syria, Egypt and the Maghreb to al-Andalus and the islands, the Sawad and the foundations of Kufa, Basra, Wasit and Baghdad, the Jibal and Hamadhan and Isfahan, the killing of Yazdajird, Ray, Qumis, Qazwin, Azerbaijan, Mosul, Shahrazur, Jurjan and Tabaristan, the Tigris districts, Ahwaz, Fars, Kirman, Sijistan, Kabul, Khurasan and Sind — closing with the rulings of kharaj and stipends; the editors note in their introduction that al-Baladhuri narrated several reports around a single event, showing the insight of a critical historian rather than a mere recorder (Mu'assasat al-Ma'arif ed., intro pp. 5–7 and book opening p. 8)."
