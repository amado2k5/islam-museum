summary:
  ar: "المصنف للإمام عبد الرزاق بن همام الصنعاني ⁦(ت 211هـ)⁩؛ من أقدم كتب السنة المجموعة، وفيه آثار عن مكاتبات النبي والخلفاء."
  en: "Abd al-Razzaq ibn Humam al-San'ani's (d. 211 AH) Musannaf; one of the earliest hadith collections, containing reports on the Prophet's and caliphs' correspondence."
  es: "El Musannaf de Abd al-Razzaq ibn Humam al-San'ani (fallecido en el año 211 de la Hégira); una de las colecciones de hadices más antiguas, que contiene relatos sobre la correspondencia entre el Profeta y los califas."
  fr: "Le Musannaf d'Abd al-Razzaq ibn Humam al-San'ani (mort en 211 AH); l'une des plus anciennes collections de hadiths, contenant des rapports sur la correspondance du Prophète et des califes."
  ur: "عبد الرزاق بن ہمام الصانعانی ⁦(متوفی 211ھ)⁩ مصحف؛ قدیم ترین احادیث کے مجموعوں میں سے ایک، جس میں رسول اللہ اور خلفائے راشدین کی خط و کتابت کی رپورٹیں شامل ہیں۔"
  tr: "İmam Abd al-Razzaq ibn Hammam al-San'ani (ö. 211 H) tarafından yazılmış Musannaf; Sünnet'in en eski toplanmış kitaplarından biridir ve Peygamber ile halifeler arasındaki yazışmaların izlerini içerir."
  id: "Musannaf oleh Imam Abd al-Razzaq ibn Hammam al-San'ani (wafat 211 H); ini adalah salah satu kitab Sunnah tertua yang dikumpulkan, memuat jejak korespondensi antara Nabi dan para khalifah."
