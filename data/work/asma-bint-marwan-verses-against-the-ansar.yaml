summary:
  ar: "أربعة أبيات على المتقارب تهجو فيها عصماء بني مالك والنبيت وعوفاً وبني الخزرج: أطعتم غريباً ليس من مراد ولا مذحج، ترجونه بعد قتل الرؤوس كما يُرتجى مرق المنضج، وتتمنى رجلاً أنفاً يبتغي غرّته فيقطع أمل المرتجي."
  en: "Four verses in which Asma' reviles Banu Malik, al-Nabit, Awf and Banu al-Khazraj: you obeyed a stranger of neither Murad nor Madhhij, hoping in him after the killing of your chiefs as one hopes for broth from a cooked pot; and she wishes for a proud man who would catch him unawares and cut off the hope of those who hope."
