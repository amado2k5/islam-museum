label: { ar: "أبيات عصماء بنت مروان في عيب الأنصار وطاعتهم «الأتاوي»", en: "Asma' bint Marwan's verses reviling the Ansar for obeying 'the stranger'", es: "Los versos de Asma bint Marwan que vilipendian a los Ansar por obedecer al \"extranjero\".", fr: "Les vers d'Asma' bint Marwan injuriant les Ansar pour avoir obéi à « l'étranger »", ur: "اسماء بنت مروان کی آیات انصار کو 'اجنبی' کی اطاعت کرنے پر طعنہ دیتی ہیں۔" }
summary:
  ar: "أربعة أبيات على المتقارب تهجو فيها عصماء بني مالك والنبيت وعوفاً وبني الخزرج: أطعتم غريباً ليس من مراد ولا مذحج، ترجونه بعد قتل الرؤوس كما يُرتجى مرق المنضج، وتتمنى رجلاً أنفاً يبتغي غرّته فيقطع أمل المرتجي."
  en: "Four verses in which Asma' reviles Banu Malik, al-Nabit, Awf and Banu al-Khazraj: you obeyed a stranger of neither Murad nor Madhhij, hoping in him after the killing of your chiefs as one hopes for broth from a cooked pot; and she wishes for a proud man who would catch him unawares and cut off the hope of those who hope."
  es: "Cuatro versículos en los que Asma' insulta a Banu Malik, al-Nabit, Awf y Banu al-Khazraj: obedecisteis a un extraño que no era ni de Murad ni de Madhhij, esperando en él después de la muerte de vuestros jefes como quien espera caldo de una olla cocida; y ella desea un hombre orgulloso que lo tome por sorpresa y corte la esperanza de aquellos que tienen esperanza."
  fr: "Quatre versets dans lesquels Asma' injurie les Banu Malik, al-Nabit, Awf et Banu al-Khazraj: vous avez obéi à un étranger qui n'était ni de Murad ni de Madhhij, espérant en lui après le meurtre de vos chefs comme on espère du bouillon dans une marmite cuite; et elle souhaite un homme fier qui le surprendrait et anéantirait l'espoir de ceux qui espèrent."
  ur: "چار آیات جن میں اسماء بنو مالک، النبیت، عوف اور بنو الخزرج کو برا بھلا کہتی ہیں: تم نے کسی اجنبی کی اطاعت کی، نہ مراد اور نہ مدحج، اپنے سرداروں کے قتل کے بعد اس سے اس طرح امید لگائے جیسے پکائے ہوئے برتن سے شوربے کی امید رکھتے ہیں۔ اور وہ ایک متکبر آدمی کی خواہش رکھتی ہے جو اسے بے خبر پکڑے اور امید رکھنے والوں کی امید کاٹ ڈالے۔"
