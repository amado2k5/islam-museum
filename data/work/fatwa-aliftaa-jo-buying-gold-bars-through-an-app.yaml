id: work/fatwa-aliftaa-jo-buying-gold-bars-through-an-app
class: work
kind: fatwa
label: { ar: "شراء سبائك الذهب عن طريق تطبيق", en: "Buying gold bars through an app", ur: "ایپ کے ذریعے سونے کی اینٹیں خریدنا" }
summary:
  ar: "سؤال عن شراء سبائك الذهب عن طريق تطبيق، أجابت فيه دائرة الإفتاء العام الأردنية بأن تداول الذهب عبر التطبيق جائز إذا تحقق القبض بإحدى وسائله الأربع، ويحرم إن لم تتحقق، وأن إعادة البيع للتاجر نفسه لا حرج فيها إن لم يكن عن اتفاق مسبق. أجابت الدائرة بأن الإسلام شدد في بيع الأموال الربوية، واستدلت بحديث رواه مسلم في الأصناف الستة، وقالت إن الذهب بالذهب يشترط فيه التماثل في الوزن والقبض في مجلس العقد، وأما الذهب بالعملة فيشترط فيه القبض في المجلس فقط. وذكرت أن قبض الذهب يتحقق بإحدى وسائل: أن يقبض المشتري السبيكة بنفسه في المجلس، أو يقبضها وكيله، أو تعين السبيكة بأرقام وعلامات تميزها ويمكن المشتري من التصرف فيها، أو تحفظ بشهادات في مخازن مرخصة ذات أنظمة ضابطة تكون الجهة القائمة عليها وكيلًا عن حامل الشهادة، وأحالت إلى المعيار الشرعي رقم 57 للمؤسسات المالية الإسلامية. وقالت إن كثيرًا من عمليات بيع الذهب بالمضاربة لا تلتزم بهذه الضوابط، فإن تحقق القبض بإحدى الوسائل الأربع جاز التداول، وإلا حرم. وأما إعادة بيع السبيكة للتاجر نفسه فالأصل أن تباع لغيره حذرًا من بيع العينة المنهي عنه، لكن إن تم ذلك من غير اتفاق مسبق ولا نية فلا حرج فيه، مع مراعاة شروط البيع السابقة."
  en: "A question about buying gold bars through an app, in which Jordan's General Iftaa Department answered that trading gold through the app is permitted if possession is achieved by one of four recognised means and forbidden otherwise, and that reselling to the same dealer is acceptable when there was no prior agreement. The Department answered that Islam is strict about selling the commodities subject to riba, citing the hadith narrated by Muslim on the six commodities; gold exchanged for gold requires equal weight and possession in the session of the contract, while gold sold for currency requires only possession in the session. It listed the means by which possession of gold is achieved: the buyer takes the bar himself in the session; his agent takes it; the bar is designated by numbers and marks that distinguish it and the buyer is enabled to dispose of it; or it is held under certificates in licensed vaults governed by regulations, with the vault operator acting as agent for the certificate holder, referring to Shari'a Standard No. 57 for Islamic financial institutions. It said many speculative gold trades observe none of these controls; if possession occurs by one of the four means, trading is permitted, and if not, it is forbidden. On reselling the bar to the same dealer, it said the principle is to sell it to someone else to avoid the prohibited 'ina sale, but if this happens without any prior agreement or intention, there is no objection, provided the earlier conditions of sale are met."
  ur: "ایپ کے ذریعے سونے کی اینٹیں خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر چار معتبر طریقوں میں سے کسی ایک سے قبضہ ہو جائے تو ایپ کے ذریعے سونے کا لین دین جائز ہے ورنہ حرام، اور پہلے سے طے شدہ معاہدے کے بغیر اسی تاجر کو دوبارہ بیچنے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے ربوی اموال کی بیع میں سختی کی ہے، اور چھ اشیا والی حدیث سے استدلال کیا جسے مسلم نے روایت کیا؛ سونے کے بدلے سونے میں وزن کی برابری اور مجلسِ عقد میں قبضہ شرط ہے، جبکہ سونا کرنسی کے بدلے بیچنے میں صرف مجلس میں قبضہ شرط ہے۔ اس نے قبضے کے طریقے بتائے: خریدار مجلس میں خود اینٹ پر قبضہ کرے؛ اس کا وکیل قبضہ کرے؛ اینٹ کو ممتاز نمبروں اور نشانات سے متعین کر کے خریدار کو اس میں تصرف کا اختیار دیا جائے؛ یا وہ لائسنس یافتہ گوداموں میں ضابطوں کے تحت سرٹیفکیٹوں کے ذریعے رکھی جائے اور گودام چلانے والا ادارہ سرٹیفکیٹ رکھنے والے کا وکیل ہو، اور اسلامی مالیاتی اداروں کے شرعی معیار نمبر 57 کا حوالہ دیا۔ اس نے کہا کہ سونے کی بہت سی سٹے بازی والی خرید و فروخت ان ضوابط کی پابندی نہیں کرتی؛ اگر ان چار طریقوں میں سے کسی ایک سے قبضہ ہو جائے تو لین دین جائز ہے، ورنہ حرام۔ اسی تاجر کو اینٹ دوبارہ بیچنے کے بارے میں اس نے کہا کہ اصل یہ ہے کہ ممنوع بیعِ عینہ سے بچنے کے لیے کسی اور کو بیچی جائے، لیکن اگر یہ پہلے سے کسی معاہدے یا نیت کے بغیر ہو تو کوئی حرج نہیں، بشرطیکہ بیع کی سابقہ شرائط پوری ہوں۔"
