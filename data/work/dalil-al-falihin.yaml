summary:
  ar: "«دليل الفالحين لطرق رياض الصالحين» لمحمد بن علان الصديقي ⁦(ت 1057هـ)⁩: شرح على «رياض الصالحين» للنووي، يبين طرق الأحاديث ويشرح معانيها وفوائدها، وفي مجلداته أبواب الرياض مرتبة على أبوابها. {cite:dalil-al-falihin-dar-al-marifa-vol1-2004 p. 1}"
  en: "Ibn Allan al-Siddiqi's (d. 1057 AH) commentary on al-Nawawi's Riyad al-salihin. It sets out the routes of the hadiths and explains their meanings and benefits, following the chapters of the Riyad. {cite:dalil-al-falihin-dar-al-marifa-vol1-2004 p. 1}"
  es: "Comentario de Ibn Allan al-Siddiqi (m. 1057 AH) sobre el Riyad al-salihin de al-Nawawi. En él se exponen las rutas de los hadices y se explican sus significados y beneficios, siguiendo los capítulos del Riyad. {cite:dalil-al-falihin-dar-al-marifa-vol1-2004 p. 1}"
  fr: "Commentaire d'Ibn Allan al-Siddiqi (mort en 1057 AH) sur le Riyad al-salihin d'al-Nawawi. Il expose la chaîne des hadiths et explique leur signification et leurs bienfaits, en suivant les chapitres du Riyad. {cite:dalil-al-falihin-dar-al-marifa-vol1-2004 p. 1}"
  ur: "ابن علان الصدیقی ⁦(متوفی 1057ھ)⁩ کی تفسیر النووی کی ریاض الصالحین۔ اس میں احادیث کے راستے متعین کیے گئے ہیں اور ان کے معانی اور فوائد بیان کیے گئے ہیں۔ {حوالہ:دلیل الفالحین شرح المرفاء جلد1-2004 ص۔ 1}"
