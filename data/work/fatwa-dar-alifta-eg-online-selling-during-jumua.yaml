id: work/fatwa-dar-alifta-eg-online-selling-during-jumua
class: work
kind: fatwa
label: { ar: "حكم البيع الإلكتروني في وقت الجمعة", en: "Online selling at the time of the Friday prayer", ur: "جمعے کے وقت آن لائن فروخت", es: "Venta online en el momento de la oración del viernes.", fr: "Vente en ligne au moment de la prière du vendredi" }
summary:
  ar: "سائل سأل عن الانشغال بالبيع الإلكتروني من وقت النداء بالأذان الثاني لصلاة الجمعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21493)⁩ أنه لا يجوز لمن وجب عليه حضور صلاة الجمعة أن ينشغل بالبيع الإلكتروني من وقت النداء بالأذان الثاني لصلاة الجمعة على ما فصّل الجواب."
  en: "A questioner asked about busying oneself with online selling from the second call of the Friday prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21493) answered that one obliged to attend the Friday prayer may not be occupied with online selling from the second adhan — as the answer details."
  ur: "ایک سائل نے جمعے کی دوسری اذان کے وقت سے آن لائن فروخت میں مشغول ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21493)⁩ نے جواب دیا کہ جس پر جمعہ واجب ہو اسے اس وقت سے فروخت میں مشغول ہونا جائز نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la conveniencia de dedicarse a las ventas en línea desde la segunda llamada a la oración del viernes. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21493) respondió que quien está obligado a asistir a la oración del viernes no puede dedicarse a las ventas en línea desde la segunda llamada a la oración, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la possibilité de se consacrer à la vente en ligne dès le deuxième appel à la prière du vendredi. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21493) a répondu que celui qui est tenu d'assister à la prière du vendredi ne peut se livrer à la vente en ligne dès le deuxième adhan, comme le précise la réponse."
