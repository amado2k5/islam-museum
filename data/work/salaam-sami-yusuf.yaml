label: { ar: "سلام ⁦(ألبوم سامي يوسف، 2012)⁩", en: "Salaam (Sami Yusuf album)", ur: "سلام ⁦(سامی یوسف کا البم، 2012)⁩" }
summary:
  ar: "ألبوم الاستوديو الخامس لسامي يوسف، صدر عن إي تي إم إنترناشونال في 22 ديسمبر 2012 بست عشرة أغنية؛ وصفه بأنه احتفاء بـ«التعدد في الظاهر والوحدة في الباطن» وبالسلام بين الناس، ونال شهادة بلاتينية في جنوب شرق آسيا، وصدرت له طبعة تركية بخمس أغان أعاد تسجيلها بالتركية."
  en: "Sami Yusuf's fifth studio album, released by ETM International on 22 December 2012 with sixteen tracks; he described it as celebrating 'outward multiplicity and inward unity' and peace between people, it went platinum in South-East Asia, and a Turkish edition carried five songs he re-recorded in Turkish."
  ur: "سامی یوسف کا پانچواں اسٹوڈیو البم، 22 دسمبر 2012 کو ای ٹی ایم انٹرنیشنل سے سولہ ٹریکس کے ساتھ جاری ہوا؛ انہوں نے اسے «ظاہر میں کثرت اور باطن میں وحدت» اور لوگوں کے درمیان امن کا جشن کہا، اور جنوب مشرقی ایشیا میں اسے پلاٹینم سند ملی۔"
