label: { ar: "اللمعة في حل الكواكب السبعة ⁦(الكوم الريشي)⁩", en: "al-Lum'a fi hall al-kawakib al-sab'a (al-Kawm al-Rishi)", ur: "اللمعۃ فی حل الکواکب السبعۃ ⁦(الکوم الریشی)⁩" }
summary:
  ar: "اختصار لأحمد الكوم الريشي لزيج ابن الشاطر مع تصحيح ما رآه فيه من أخطاء، فيه جداول للتواريخ والكواكب والكسوف ورؤية الهلال وأطوال البلاد وعروضها {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 30} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 31}."
  en: "Ahmad al-Kawm al-Rishi's abridgement of Ibn al-Shatir's zij with corrections of what he saw as errors, with tables for eras, planets, eclipses, crescent visibility and the coordinates of towns {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 30} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 31}."
  ur: "احمد الکوم الریشی کا ابن الشاطر کی زیج کا اختصار، اس میں جو غلطیاں انہیں نظر آئیں ان کی تصحیح کے ساتھ، جس میں تقویموں، سیاروں، کسوف، رؤیتِ ہلال اور شہروں کے طول و عرض کی جدولیں ہیں {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 30} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 31}۔"
