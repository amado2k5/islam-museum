id: work/tawil-mukhtalif-al-hadith
class: work
kind: book
label: { ar: "تأويل مختلف الحديث", en: "The Interpretation of Conflicting Narrations", es: "La interpretación de narraciones contradictorias", fr: "L'interprétation des récits contradictoires", ur: "متضاد روایتوں کی تشریح" }
summary:
  ar: "«تأويل مختلف الحديث» لابن قتيبة الدينوري ⁦(ت 276هـ)⁩: يرد على الشبهات التي تزعم تناقض الأحاديث بعضها مع بعض، أو مخالفتها للقرآن أو للعقل، ويضم ردّاً على أعيان المتكلمين وأصحاب الرأي، وباباً لأهل الحديث، وأكثر من مئة مسألة في دعوى التناقض. {cite:tawil-mukhtalif-al-hadith-hilali p. 7}"
  en: "Ibn Qutayba al-Dinawari's (d. 276 AH) reply to charges that hadiths contradict one another, the Qur'an or reason. It answers named theologians and the people of opinion, sets a chapter on the people of hadith, and treats about a hundred alleged contradictions. {cite:tawil-mukhtalif-al-hadith-hilali p. 7}"
  es: "Respuesta de Ibn Qutayba al-Dinawari (m. 276 AH) a las acusaciones de que los hadices se contradicen entre sí, con el Corán o con la razón. Responde a teólogos y personas de opinión, dedica un capítulo a la gente del hadiz y trata alrededor de un centenar de supuestas contradicciones. {cite:tawil-mukhtalif-al-hadith-hilali p. 7}"
  fr: "Réponse d'Ibn Qutayba al-Dinawari (mort en 276 AH) aux accusations de contradictions entre les hadiths, avec le Coran ou la raison. Il répond aux théologiens et aux commentateurs reconnus, consacre un chapitre aux spécialistes du hadith et traite d'une centaine de contradictions supposées. {cite:tawil-mukhtalif-al-hadith-hilali p. 7}"
  ur: "ابن قتیبہ الدنوری ⁦(متوفی 276ھ)⁩ کا جواب ان الزامات کا کہ احادیث ایک دوسرے، قرآن یا دلیل سے متصادم ہیں۔ یہ نامی الہیات اور اہل نظر کے جوابات دیتا ہے، اہل حدیث پر ایک باب مرتب کرتا ہے، اور تقریباً سو مبینہ تضادات کا علاج کرتا ہے۔ {حوالہ:تاویل المختلف الحدیث ہلالی ص۔ 7}"
