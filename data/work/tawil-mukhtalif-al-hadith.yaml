summary:
  ar: "«تأويل مختلف الحديث» لابن قتيبة الدينوري (ت 276هـ): يرد على الشبهات التي تزعم تناقض الأحاديث بعضها مع بعض، أو مخالفتها للقرآن أو للعقل، ويضم ردّاً على أعيان المتكلمين وأصحاب الرأي، وباباً لأهل الحديث، وأكثر من مئة مسألة في دعوى التناقض. {cite:tawil-mukhtalif-al-hadith-hilali p. 7}"
  en: "Ibn Qutayba al-Dinawari's (d. 276 AH) reply to charges that hadiths contradict one another, the Qur'an or reason. It answers named theologians and the people of opinion, sets a chapter on the people of hadith, and treats about a hundred alleged contradictions. {cite:tawil-mukhtalif-al-hadith-hilali p. 7}"
