summary:
  ar: "«تأويل مختلف الحديث» لابن قتيبة الدينوري (ت 276هـ)، كتاب يتناول الأحاديث التي يبدو ظاهرها متعارضاً ويقدّم وجوه الجمع بينها، وفيه في الصفحات المحققة نقد لمنهج الرأي والقياس عند أصحاب أبي حنيفة مع أمثلة من الفقه. {cite:tawil-mukhtalif-al-hadith-hilali p. 130}"
  en: "Ibn Qutayba al-Dinawari's (d. 276 AH) book on hadiths whose wording seems to conflict and how they can be reconciled. The sampled pages of this edition (pp. 130–141) criticise the method of opinion (ra'y) and analogy among Abu Hanifa's followers through worked examples. {cite:tawil-mukhtalif-al-hadith-hilali p. 130}"
