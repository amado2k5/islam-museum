id: work/fatwa-aliftaa-jo-zakat-on-a-stalled-housing-project
class: work
kind: fatwa
label: { ar: "زكاة مشروع إسكان متعثر", en: "Zakat on a stalled housing project", ur: "رکے ہوئے رہائشی منصوبے پر زکوٰۃ" }
summary:
  ar: "سؤال عن زكاة مشروع إسكان متعثر، أجابت فيه دائرة الإفتاء العام الأردنية بأن الشقق المعدة للبيع تزكى زكاة عروض التجارة كل سنة، لكن إذا تعثر إتمام البناء بحيث لا يستطيع صاحبها التصرف فيها فلا تجب الزكاة كل سنة، ويزكيها لسنة واحدة عند البيع وفق مذهب المالكية. أجابت الدائرة بأن الأصل وجوب الزكاة في كل ما يعد للتجارة، واستشهدت بـ[[passage/quran-2-267|سورة البقرة 2:267]] وبقول مجاهد بن جبر إن المقصود فيها التجارة كما في تفسير ابن كثير (1/697)، وقالت إن الشقق المعدة للبيع تقيم كل سنة قمرية وتزكى زكاة عروض التجارة، واستدلت بحديث سمرة بن جندب الذي رواه أبو داود والبيهقي في إخراج الصدقة مما يعد للبيع. وقالت إن المالكية ذهبوا في حال كساد البيع أو تعثر البناء إلى عدم وجوب الزكاة كل سنة، وإنما تزكى عند البيع لسنة واحدة، ونقلت من المدونة الكبرى (1/309) أن من اشترى سلعًا يريد بيعها، وليس ممن يدير ماله في التجارة، فبارت عليه ومضت أحوال، فلا زكاة عليه حتى يبيع، فإذا باع زكى زكاة واحدة. وخلصت إلى أنه لا تجب الزكاة على صاحب الشقق إذا تعثر إتمام بنائها بحيث لا يستطيع التصرف فيها، ويزكيها لسنة واحدة عند بيعها وفق مذهب المالكية."
  en: "A question about zakat on a stalled housing project, in which Jordan's General Iftaa Department answered that flats held for sale bear zakat on trade goods every year, but if completion stalls so that the owner cannot dispose of them, zakat is not due each year and is paid for one year on sale, following the Maliki school. The Department answered that zakat is in principle due on everything held for trade, citing [[passage/quran-2-267|Surat al-Baqara 2:267]] and Mujahid ibn Jabr's explanation that it refers to trade, as in Tafsir Ibn Kathir (1/697); it said that flats held for sale are valued every lunar year and bear zakat on trade goods, citing the hadith of Samura ibn Jundab, narrated by Abu Dawud and al-Bayhaqi, on paying charity from what is prepared for sale. It said that when sales stagnate or construction stalls, the Malikis hold that zakat is not due every year but only for a single year upon sale, quoting al-Mudawwana al-Kubra (1/309) that someone who buys goods to sell, without regularly turning over his capital in trade, and whose goods fail to sell over several years, owes no zakat on them until he sells, and then pays a single year's zakat. It concluded that the owner of the flats owes no zakat while completion is stalled such that he cannot dispose of them, and pays one year's zakat when he sells them, following the Maliki school."
  ur: "رکے ہوئے رہائشی منصوبے پر زکوٰۃ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فروخت کے لیے رکھے فلیٹوں پر ہر سال تجارتی سامان کی زکوٰۃ ہے، لیکن اگر تعمیر رک جائے اور مالک ان میں تصرف نہ کر سکے تو ہر سال زکوٰۃ واجب نہیں، اور مالکی مذہب کے مطابق فروخت پر ایک سال کی زکوٰۃ دی جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ تجارت کے لیے رکھی ہر چیز پر زکوٰۃ واجب ہے، اور [[passage/quran-2-267|سورۃ البقرہ 2:267]] اور مجاہد بن جبر کی اس تفسیر کا حوالہ دیا کہ اس سے مراد تجارت ہے، جیسا کہ تفسیر ابن کثیر (1/697) میں ہے؛ اس نے کہا کہ فروخت کے لیے رکھے فلیٹوں کی ہر قمری سال قیمت لگائی جائے اور تجارتی سامان کی زکوٰۃ دی جائے، اور سمرہ بن جندب کی حدیث سے استدلال کیا جسے ابو داود اور بیہقی نے روایت کیا، کہ فروخت کے لیے تیار مال سے صدقہ نکالا جائے۔ اس نے کہا کہ مالکیہ کے نزدیک جب فروخت مندی کا شکار ہو یا تعمیر رک جائے تو ہر سال زکوٰۃ واجب نہیں، بلکہ فروخت پر صرف ایک سال کی زکوٰۃ ہے، اور المدونۃ الکبریٰ (1/309) سے نقل کیا کہ جو شخص بیچنے کے لیے سامان خریدے اور تجارت میں مسلسل سرمایہ نہ گھماتا ہو، اور سامان کئی سال نہ بکے، اس پر بیچنے تک زکوٰۃ نہیں، اور بیچنے پر ایک زکوٰۃ دے۔ اس نے نتیجہ نکالا کہ فلیٹوں کے مالک پر اس وقت تک زکوٰۃ واجب نہیں جب تک تعمیر اس طرح رکی ہو کہ وہ ان میں تصرف نہ کر سکے، اور مالکی مذہب کے مطابق فروخت کے وقت ایک سال کی زکوٰۃ دے۔"
