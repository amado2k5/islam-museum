id: work/fatwa-dar-alifta-eg-persisting-in-fajr-qunut
class: work
kind: fatwa
label: { ar: "حكم المداومة على القنوت في الفجر", en: "Persisting in the qunut at dawn prayer", ur: "فجر میں قنوت پر لگاتار عمل کا حکم", es: "Perseverar en la oración del qunut al amanecer", fr: "Persévérer dans la prière du qunut à l'aube" }
summary:
  ar: "سائل سأل عن المداومة على القنوت في صلاة الفجر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22064)⁩ أن القنوت في الفجر وغيره من الفرائض مشروع عند النوازل باتفاق العلماء، وبيّن الجواب حكم المداومة عليه خارج النوازل على وجهه."
  en: "A questioner asked about persisting in the qunut supplication at the dawn prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22064) answered that the qunut in the dawn and other obligatory prayers is prescribed at times of calamity by agreement of the scholars; the answer sets out the ruling on persisting in it outside such times."
  ur: "ایک سائل نے فجر میں قنوت پر لگاتار عمل کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22064)⁩ نے جواب دیا کہ فجر اور دیگر فرض نمازوں میں قنوت آفات کے وقت علماء کے اتفاق سے مشروع ہے؛ ایسے اوقات کے باہر اس پر لگاتار عمل کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre la persistencia en la súplica del qunut durante la oración del amanecer. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22064) respondió que la súplica del qunut en la oración del amanecer y otras oraciones obligatorias está prescrita en tiempos de calamidad por consenso de los eruditos; la respuesta expone la norma sobre la persistencia en ella fuera de dichos tiempos."
  fr: "Un lecteur a posé une question concernant la persistance de l'invocation du qunut lors de la prière de l'aube. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22064) a répondu que l'invocation du qunut à l'aube et lors des autres prières obligatoires est prescrite en période de calamité, par consensus des savants; la réponse expose la règle concernant sa persistance en dehors de ces périodes."
