id: work/fatwa-dar-alifta-eg-late-payment-surcharge-on-debt
class: work
kind: fatwa
label: { ar: "حكم اشتراط المقرض على المقترض زيادة عند التأخر عن سداد الدين", en: "A lender stipulating an increase for late repayment", ur: "ادائیگی میں تاخیر پر قرض دہندہ کی شرطِ اضافہ", es: "Un prestamista que estipula un aumento por pago tardío", fr: "Un prêteur exigeant une augmentation en cas de retard de paiement", tr: "Borç verenin, borç alanın gecikmeli borç ödemesi durumunda zam ödemesini talep etmesine karar verilmesi", id: "Putusan tentang pemberi pinjaman yang mewajibkan peminjam membayar kenaikan jika terjadi keterlambatan pembayaran utang" }
summary:
  ar: "سائل سأل عن اشتراط المقرض على المقترض زيادة في مقدار الدين إذا تأخر عن السداد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20676)⁩ أن الاتفاق بين الدائن والمدين على اشتراط زيادة في مقدار الدين إذا تأخر المدين عن السداد غير جائز شرعًا فيبطل على ما فصّل الجواب."
  en: "A questioner asked about a lender stipulating an increase on the debt if the borrower repays late. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20676) answered that such a stipulation is not lawful in the sharia and is void — as the answer details."
  ur: "ایک سائل نے دیر سے ادائیگی پر قرض میں اضافے کی شرط کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20676)⁩ نے جواب دیا کہ یہ شرط شرعاً جائز نہیں اور باطل ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que un prestamista estipule un aumento en la deuda si el prestatario se retrasa en el pago. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20676) respondió que dicha estipulación no es lícita en la sharia y es nula, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la possibilité pour un prêteur d'exiger une augmentation du taux d'intérêt en cas de retard de paiement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20676) a répondu qu'une telle clause est illicite selon la charia et est donc nulle, comme le précise la réponse."
  tr: "Bir soru soran, borçlunun ödemeyi geciktirirse borç tutarını artırması gerekliliğini sormuştur. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20676), alacaklı ile borçlu arasında borçlu ödemeyi geciktirirse borç tutarının artırılmasını talep etme anlaşmasının İslam hukukuna göre uygun olmadığını ve bu nedenle cevabın ayrıntılı olarak geçersiz kıldığını belirtmiştir."
  id: "Seorang penanya menanyakan tentang persyaratan pemberi pinjaman agar peminjam meningkatkan jumlah utang jika mereka menunda pembayaran. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20676) menjawab bahwa perjanjian antara kreditur dan debitur untuk mewajibkan peningkatan jumlah utang jika debitur menunda pembayaran tidak diperbolehkan menurut hukum Islam, sehingga perjanjian tersebut dibatalkan sebagaimana dijelaskan dalam jawaban."
