summary:
  ar: "أقدم مصنف مستقل باقٍ في مغازي رسول الله وسيره. جمعه محمد بن عمر بن واقد الأسلمي، مولاهم وقاضي المدينة المتوفى سنة 207هـ، ورتبه على السرايا والغزوات من مقدم النبوة إلى سنة إحدى عشرة في ثلاثة أجزاء. يُستشهد به هنا عبر نص المكتبة الشاملة الذي يطابق طبعة مارسدن جونز ⁦(أكسفورد 1966)⁩."
  en: "The earliest surviving monograph on the Prophet's campaigns. Compiled by Muhammad ibn Umar ibn Waqid al-Aslami, mawla of Banu Hashim and qadi of Medina (d. 207 AH), arranged by sariyya and ghazwa from the emigration to year 11 in three parts. Cited here through al-Maktaba al-Shamila's digital text matching the Marsden Jones Oxford edition (1966)."
