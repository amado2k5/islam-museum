summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن أطفال الأنابيب: قرر تأجيل البت في الموضوع إلى الدورة القادمة وكلف الشيخ الدكتور بكر أبو زيد رئيس المجمع بإعداد دراسة وافية تلم بالمعطيات الفقهية والطبية وتوجيه الأمانة العامة ما يصل إليها إلى الأعضاء قبل الدورة بثلاثة أشهر."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on test-tube babies: it deferred a ruling to the next session, tasked the Academy's president Shaykh Dr. Bakr Abu Zayd with preparing a full study covering the fiqh and medical data, and directed the secretariat to circulate it to members three months ahead."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ ٹیوب بچوں پر: فیصلہ اگلی مجلس تک مؤخر؛ صدر بکر ابو زید کو جامع تحقیق کی ذمہ داری سونپی گئی۔"
  es: "Resolución de la segunda sesión de la IIFA (Kuwait, diciembre de 1985) sobre bebés probeta: aplazó la decisión hasta la siguiente sesión, encargó al presidente de la Academia, el jeque Dr. Bakr Abu Zayd, la preparación de un estudio completo que abarcara los datos jurisprudenciales y médicos, y ordenó a la secretaría que lo distribuyera a los miembros con tres meses de antelación."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985) sur les bébés-éprouvettes: elle a reporté une décision à la session suivante, a chargé le président de l'Académie, le cheikh Dr. Bakr Abu Zayd, de préparer une étude complète couvrant le fiqh et les données médicales, et a ordonné au secrétariat de la diffuser aux membres trois mois à l'avance."
