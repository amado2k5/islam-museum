  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن أطفال الأنابيب: قرر تأجيل البت في الموضوع إلى الدورة القادمة وكلف الشيخ الدكتور بكر أبو زيد رئيس المجمع بإعداد دراسة وافية تلم بالمعطيات الفقهية والطبية وتوجيه الأمانة العامة ما يصل إليها إلى الأعضاء قبل الدورة بثلاثة أشهر."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on test-tube babies: it deferred a ruling to the next session, tasked the Academy's president Shaykh Dr. Bakr Abu Zayd with preparing a full study covering the fiqh and medical data, and directed the secretariat to circulate it to members three months ahead."
