summary:
  ar: "الألبوم الثاني للمغني والملحن المصري حمزة نمرة، صدر عن أوايكننغ سنة 2011 بست عشرة أغنية بالعربية والمصرية، منها «إنسان» و«الميدان» و«على باب الله» و«حاصر حصارك»، وأغنيتان إضافيتان منهما «اسمي مصر» مسجلة حيا؛ أنتجه حمزة نمرة مع محمد دياب وحازم وفي."
  en: "The Egyptian singer-songwriter Hamza Namira's second album, released by Awakening in 2011 with sixteen songs in Arabic and Egyptian Arabic, among them 'Insan', 'El-Midan', 'Ala Bab Allah' and 'Hasir Hisarak', and two bonus tracks including a live 'Esmy Masr'; produced by Namira with Mohamed Diab and Hazem Wefy."
  ur: "مصری گلوکار اور موسیقار حمزہ نمرہ کا دوسرا البم، جو 2011 میں اویکننگ سے سولہ عربی گیتوں کے ساتھ جاری ہوا، جن میں «انسان»، «المیدان» اور «علی باب اللہ» شامل ہیں۔"
