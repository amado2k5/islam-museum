label: { ar: "كتاب التوحيد وإثبات صفات الرب عز وجل", en: "Kitab al-Tawhid wa-Ithbat Sifat al-Rabb (Ibn Khuzayma)", ur: "کتاب التوحید و اثبات صفات الرب ⁦(ابن خزیمہ)⁩", es: "Kitab al-Tawhid wa-Ithbat Sifat al-Rabb (Ibn Juzayma)", tr: "Tek Tanrıcılık Kitabı ve Her Şeye Gücü Yeten Tanrı'nın Niteliklerinin Onaylanması", id: "Kitab Monoteisme dan Penegasan Sifat-sifat Allah Yang Maha Kuasa" }
summary:
  ar: "كتاب ابن خزيمة النيسابوري ⁦(223–311هـ)⁩ في إثبات صفات الله بالأسانيد: النفس والوجه واليدين والعلو والاستواء والنزول والكلام والقرآن، ورؤية المؤمنين ربهم في الآخرة، ورؤية النبي ربه، والضحك، والشفاعة؛ أملاه سنة 309هـ قبل وفاته بسنتين، ويقول محققه إنه يزيد على سبعمائة وخمسين حديثاً، ورواه عنه حفيده أبو طاهر محمد بن الفضل {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}."
  en: "Ibn Khuzayma of Nishapur's (223–311 AH) book affirming God's attributes through chains of transmission: the Self, the Face, the two Hands, highness and the rising over the Throne, the descent, speech and the Qur'an, the believers' vision of their Lord in the hereafter, the Prophet's vision of his Lord, laughter, and intercession; he dictated it in 309 AH, two years before his death, his editor counts more than 750 reports in it, and it was transmitted from him by his grandson Abu Tahir Muhammad ibn al-Fadl {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}."
  ur: "ابن خزیمہ نیشاپوری ⁦(223–311ھ)⁩ کی کتاب جس میں سندوں کے ساتھ اللہ کی صفات کا اثبات ہے: نفس، وجہ، دونوں ہاتھ، علو اور عرش پر استوا، نزول، کلام اور قرآن، آخرت میں مومنوں کا اپنے رب کو دیکھنا، نبی کا اپنے رب کو دیکھنا، ضحک اور شفاعت؛ انہوں نے اسے وفات سے دو سال پہلے 309ھ میں املا کرایا، محقق کے مطابق اس میں ساڑھے سات سو سے زیادہ حدیثیں ہیں، اور ان سے ان کے پوتے ابو طاہر محمد بن الفضل نے اسے روایت کیا {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}۔"
  es: "El libro de Ibn Khuzayma de Nishapur (223–311 AH) que afirma los atributos de Dios a través de cadenas de transmisión: el Ser, el Rostro, las dos Manos, la altura y la elevación sobre el Trono, el descenso, el habla y el Corán, la visión de los creyentes de su Señor en el más allá, la visión del Profeta de su Señor, la risa y la intercesión; lo dictó en 309 AH, dos años antes de su muerte, su editor cuenta más de 750 informes en él, y fue transmitido de él por su nieto Abu Tahir Muhammad ibn al-Fadl {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {citar: kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {citar: kitab-al-tawhid-ibn-khuzayma-shahwan-1988-estudio p. 68}."
  fr: "L'ouvrage d'Ibn Khuzayma de Nishapur (223-311 AH) affirmant les attributs de Dieu à travers des chaînes de transmission: le Soi, le Visage, les deux Mains, la grandeur et l'ascension sur le Trône, la descente, la parole et le Coran, la vision du Seigneur par les croyants dans l'au-delà, la vision du Seigneur par le Prophète, le rire et l'intercession; il l'a dicté en 309 AH, deux ans avant sa mort. Son éditeur y dénombre plus de 750 récits, et il a été transmis par son petit-fils Abu Tahir Muhammad ibn al-Fadl. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}."
  tr: "İbn Houzaymah el-Nezaburi'nin (223–311 H) Allah'ın niteliklerini aktarım zincirleriyle onaylayan kitabı: ruh, yüz, eller, yükselme, yükselme, ayakta durma, iniş, konuşma, Kur'an, müminlerin Rablerinin ahirette görmesi, Peygamber'in Rab'bi vizyonu, kahkaha ve aracılık; bu kitabı ölümünden iki yıl önce, 309 Hicri yılında dikte etmiştir. Editörü, yedi yüz elliden fazla hadis içerdiğini ve torunu Ebu Tahir Muhammed bin el-Fadl tarafından ondan rivayet edildiğini belirtir {cit:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study s. 45-48} {cite: Kitab-al-Tawhid-ibn-Khuzayma-Shahwan-1988-çalışma s. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-çalışma s. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-çalışma s. 68}."
  id: "Kitab Ibn Khuzaymah al-Naysaburi (223–311 H) menegaskan sifat-sifat Allah dengan rantai transmisi: jiwa, wajah, tangan, pengangkatan, ketinggian, berdiri, turun, ucapan, Al-Qur'an, visi orang mukmin tentang Tuhan mereka di akhirat, penglihatan Nabi tentang Tuhannya, tawa, dan perantaraan; ia mendiktekannya pada tahun 309 H, dua tahun sebelum wafatnya. Editornya mengatakan bahwa buku itu memuat lebih dari tujuh ratus lima puluh hadits, dan diceritakan darinya oleh cucunya Abu Tahir Muhammad ibn al-Fadl {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study hlm. 45-48} {cite: Kitab-al-Tawhid-ibn-Khuzayma-Shahwan-1988-Study hlm. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study hlm. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study hlm. 68}."
