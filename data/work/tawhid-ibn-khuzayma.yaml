structure: "مقدمة المؤلف (ص 7)، ثم أبواب مرقمة: النفس (من ص 11)، الوجه (ص 24)، اليد واليدان وخلق آدم (ص 81–170)، العلو وأن الله في السماء (ص 254)، النزول، الكلام وتكليم موسى وصفة الوحي والقرآن (ص 346–404)، رؤية المؤمنين ربهم يوم القيامة (ص 437)، رؤية النبي ربه (الباب 47، ص 477) وأخبار عائشة في نفيها (الباب 48، ص 548)، الضحك (الباب 49، ص 563)، الشفاعة (الباب 51، ص 589 وما بعدها)، ثم الفهارس (ص 910). الصفحات من طبعة الشهوان 1988. وقسمته النسخ الخطية ثمانية أجزاء (الدراسة ص 48–49)."
