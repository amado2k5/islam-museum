label: { ar: "كتاب التوحيد وإثبات صفات الرب عز وجل", en: "Kitab al-Tawhid wa-Ithbat Sifat al-Rabb (Ibn Khuzayma)", ur: "کتاب التوحید و اثبات صفات الرب (ابن خزیمہ)" }
summary:
  ar: "كتاب ابن خزيمة النيسابوري (223–311هـ) في إثبات صفات الله بالأسانيد: النفس والوجه واليدين والعلو والاستواء والنزول والكلام والقرآن، ورؤية المؤمنين ربهم في الآخرة، ورؤية النبي ربه، والضحك، والشفاعة؛ أملاه سنة 309هـ قبل وفاته بسنتين، ويقول محققه إنه يزيد على سبعمائة وخمسين حديثاً، ورواه عنه حفيده أبو طاهر محمد بن الفضل {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}."
  en: "Ibn Khuzayma of Nishapur's (223–311 AH) book affirming God's attributes through chains of transmission: the Self, the Face, the two Hands, highness and the rising over the Throne, the descent, speech and the Qur'an, the believers' vision of their Lord in the hereafter, the Prophet's vision of his Lord, laughter, and intercession; he dictated it in 309 AH, two years before his death, his editor counts more than 750 reports in it, and it was transmitted from him by his grandson Abu Tahir Muhammad ibn al-Fadl {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}."
  ur: "ابن خزیمہ نیشاپوری (223–311ھ) کی کتاب جس میں سندوں کے ساتھ اللہ کی صفات کا اثبات ہے: نفس، وجہ، دونوں ہاتھ، علو اور عرش پر استوا، نزول، کلام اور قرآن، آخرت میں مومنوں کا اپنے رب کو دیکھنا، نبی کا اپنے رب کو دیکھنا، ضحک اور شفاعت؛ انہوں نے اسے وفات سے دو سال پہلے 309ھ میں املا کرایا، محقق کے مطابق اس میں ساڑھے سات سو سے زیادہ حدیثیں ہیں، اور ان سے ان کے پوتے ابو طاہر محمد بن الفضل نے اسے روایت کیا {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 45-48} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 53} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 61} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 68}۔"
