summary:
  ar: "ألبوم المغني السنغالي يوسو ندور مع أوركسترا فتحي سلامة المصرية، صدر عن نونساتش في 8 يونيو 2004 باسم «مصر» وفي السنغال باسم «شكرا لله»؛ أغانيه بالولوفية في مديح مشايخ الطرق الصوفية في السنغال مثل أحمدو بمبا، ونال جائزة غرامي لأفضل ألبوم موسيقى عالمية معاصرة، وأثار جدلا في السنغال ومصر."
  en: "The Senegalese singer Youssou N'Dour's album with the Egyptian Fathy Salama Orchestra, released by Nonesuch on 8 June 2004 as Egypt and in Senegal as Sant Allah (Thanks to God); its Wolof songs praise the Sufi masters of Senegal such as Amadou Bamba, it won the Grammy for Best Contemporary World Music Album, and it was boycotted in Senegal and banned in Egypt."
  ur: "سینیگال کے گلوکار یوسو اندور کا مصری فتحی سلامہ آرکسٹرا کے ساتھ البم، 8 جون 2004 کو نونسچ سے جاری ہوا؛ وولوف گیت سینیگال کے صوفی مشائخ جیسے احمدو بامبا کی مدح میں ہیں، اسے بہترین معاصر عالمی موسیقی البم کا گریمی ملا، اور سینیگال و مصر میں اس پر تنازع ہوا۔"
