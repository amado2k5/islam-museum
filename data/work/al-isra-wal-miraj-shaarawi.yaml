label: { ar: "الإسراء والمعراج ⁦(الشعراوي)⁩", en: "al-Isra' wal-Mi'raj (al-Sha'rawi)", es: "al-Isra' wal-Mi'raj (al-Sha'rawi)", fr: "al-Isra' wal-Mi'raj (al-Sha'rawi)" }
summary:
  ar: "كتاب الشيخ محمد متولي الشعراوي في الإسراء والمعراج. يعرض الإسراء والمعراج في سياق الدعوة الإسلامية بين البعثة والهجرة، ويتناول أول سورة الإسراء وآيتها الأولى {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 5}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}. النص من طبعة دار الجيل ⁦(٢٠٠٣م)⁩. بطاقة مسودة: لم تُراجع الفصول الأخرى بعد."
  en: "Muhammad Mutawalli al-Sha'rawi's book on the Isra' and Mi'raj. It places the night journey within the early da'wa, between the bi'tha and the hijra, and opens with the first verse of Sura al-Isra' {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 5}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}. Text from the Dar al-Jeel 2003 edition. Draft: the later chapters are not yet checked."
  es: "Libro de Muhammad Mutawalli al-Sha'rawi sobre el Isra' y el Mi'raj. Sitúa el viaje nocturno dentro de la da'wa temprana, entre la bi'tha y la hijra, y comienza con el primer versículo de la Sura al-Isra' {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 5}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}. Texto de la edición de Dar al-Jeel de 2003. Borrador: los capítulos posteriores aún no han sido revisados."
  fr: "L'ouvrage de Muhammad Mutawalli al-Sha'rawi sur l'Isra et le Mi'raj situe le voyage nocturne au début de la da'wa, entre la bi'tha et l'hijra, et s'ouvre sur le premier verset de la sourate al-Isra. [Références: al-isra-wal-miraj-dar-al-jeel-2003, p. 5 et 6]. Texte tiré de l'édition Dar al-Jeel de 2003. Version préliminaire: les chapitres suivants n'ont pas encore été vérifiés."
