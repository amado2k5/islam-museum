  ar: "كتاب الشيخ محمد متولي الشعراوي في الإسراء والمعراج. يعرض الإسراء والمعراج في سياق الدعوة الإسلامية بين البعثة والهجرة، ويتناول أول سورة الإسراء وآيتها الأولى {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 5}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}. النص من طبعة دار الجيل (٢٠٠٣م). بطاقة مسودة: لم تُراجع الفصول الأخرى بعد."
  en: "Muhammad Mutawalli al-Sha'rawi's book on the Isra' and Mi'raj. It places the night journey within the early da'wa, between the bi'tha and the hijra, and opens with the first verse of Sura al-Isra' {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 5}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 6}. Text from the Dar al-Jeel 2003 edition. Draft: the later chapters are not yet checked."
