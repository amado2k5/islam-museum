label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن حكم إجراء العقود بآلات الاتصال الحديثة", en: "IIFA resolution on concluding contracts by modern communication devices", ur: "اکیڈمی کی قرارداد: جدید مواصلاتی ذرائع سے معاہدے", es: "Resolución de la IIFA sobre la celebración de contratos mediante dispositivos de comunicación modernos.", fr: "Résolution de l'IIFA sur la conclusion de contrats par des moyens de communication modernes", tr: "Uluslararası İslami Fıkıh Akademisi'nin modern iletişim cihazlarıyla sözleşme yürütülmesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai putusan pelaksanaan kontrak menggunakan perangkat komunikasi modern" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: التعاقد بين الحاضرين يشترط له اتحاد المجلس وتطابق الإيجاب والقبول والموالاة بحسب العرف، وإذا تم بين غائبين لا يجمعهما مكان واحد ولا يرى أحدهما الآخر حال التعاقد ولا يسمع كلامه وكان بينهما وسيلة نقل فوري فله حكم الحاضرين على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on contracts by modern communication: contracting between present parties requires unity of session, offer matching acceptance, and immediacy per custom; where absent parties use an instantaneous medium, their contract carries the ruling of present parties, as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: حاضرین کے عقد کے لیے اتحاد مجلس شرط؛ غائبین کا فوری ذریعے سے عقد حاضرین کے حکم میں ہے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990) sobre los contratos mediante comunicación moderna: la contratación entre las partes presentes requiere unidad de sesión, aceptación equivalente de la oferta e inmediatez según la costumbre; cuando las partes ausentes utilizan un medio instantáneo, su contrato conlleva la decisión de las partes presentes, como se detalla en la resolución."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les contrats par communication moderne: la conclusion d'un contrat entre des parties présentes exige l'unité de session, une offre et une acceptation correspondantes, et l'immédiateté selon la coutume; lorsque des parties absentes utilisent un moyen instantané, leur contrat porte la décision des parties présentes, comme le précise la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) kararı: Katılımcılar arasındaki sözleşmeler, konseyin birliğini ve geleneklere uygun teklif, kabul ve sadakatin uygunluğunu gerektirir. Eğer aynı yerde birleşmemiş, sözleşme süresince birbirini görmeyen, kimse onun sözlerini duymayan ve aralarında hemen ulaşım aracı bulunan kişiler arasında ise, kararda belirtilen şekilde orada bulunanların kararı alınır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Kontrak antara peserta mensyaratkan persatuan dewan dan kesesuaian penawaran, penerimaan, dan kesetiaan sesuai adat. Jika kontrak antara orang yang tidak hadir yang tidak bersatu di tempat yang sama, tidak saling melihat selama kontrak, dan tidak ada yang mendengar kata-katanya, serta ada sarana transportasi langsung di antara mereka, maka ia akan memiliki keputusan dari mereka yang hadir sebagaimana dijelaskan dalam keputusan."
