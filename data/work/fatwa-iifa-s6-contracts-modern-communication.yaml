summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: التعاقد بين الحاضرين يشترط له اتحاد المجلس وتطابق الإيجاب والقبول والموالاة بحسب العرف، وإذا تم بين غائبين لا يجمعهما مكان واحد ولا يرى أحدهما الآخر حال التعاقد ولا يسمع كلامه وكان بينهما وسيلة نقل فوري فله حكم الحاضرين على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on contracts by modern communication: contracting between present parties requires unity of session, offer matching acceptance, and immediacy per custom; where absent parties use an instantaneous medium, their contract carries the ruling of present parties, as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: حاضرین کے عقد کے لیے اتحاد مجلس شرط؛ غائبین کا فوری ذریعے سے عقد حاضرین کے حکم میں ہے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990) sobre los contratos mediante comunicación moderna: la contratación entre las partes presentes requiere unidad de sesión, aceptación equivalente de la oferta e inmediatez según la costumbre; cuando las partes ausentes utilizan un medio instantáneo, su contrato conlleva la decisión de las partes presentes, como se detalla en la resolución."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les contrats par communication moderne: la conclusion d'un contrat entre des parties présentes exige l'unité de session, une offre et une acceptation correspondantes, et l'immédiateté selon la coutume; lorsque des parties absentes utilisent un moyen instantané, leur contrat porte la décision des parties présentes, comme le précise la résolution."
