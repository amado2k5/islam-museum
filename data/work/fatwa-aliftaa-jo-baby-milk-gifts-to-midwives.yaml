id: work/fatwa-aliftaa-jo-baby-milk-gifts-to-midwives
class: work
kind: fatwa
label: { ar: "هدايا وكلاء حليب الأطفال للقابلات", en: "Gifts from baby-milk agents to midwives", ur: "بچوں کے دودھ کے ایجنٹوں کے دائیوں کو تحفے" }
summary:
  ar: "سؤال من وكيل حليب أطفال يريد الترويج لمنتجه بإهداء القابلات في المستشفيات، أجابت فيه دائرة الإفتاء العام الأردنية بأن الهدية حرام إن كانت مقابل ترويج حصري بلا ميزة للمنتج، وجائزة إن كانت ترويجًا للشركة دون تأثير على قرار القابلات. بدأت الدائرة بأن الهبة مستحبة بالإجماع، ونقلت في ذلك عن البغوي والنووي. وقالت إن الشركة إن كانت تقدم الهدايا للقابلات مقابل أن يروجن لمنتجها حصرًا دون أن تكون له ميزة على غيره مع ارتفاع سعره، فتقديم الهدية وقبولها حرام لأنه من باب الرشوة. وإن كانت تهديهن ترويجًا لنفسها فقط دون ضغط عليهن أو تأثير على قرارهن، فتقديم الهدية وقبولها جائز، وأحالت إلى قراري مجلس الإفتاء رقم 145 و249."
  en: "A question from a baby-milk agent who wants to promote his product by giving gifts to midwives in hospitals, in which Jordan's General Iftaa Department answered that the gifts are forbidden if given in return for exclusively promoting a product with no advantage over others, and permitted if they only promote the company without influencing the midwives' decisions. The Department began by saying that giving gifts is recommended by consensus, quoting al-Baghawi and al-Nawawi. It said that if the company gives the midwives gifts in return for promoting its product exclusively, although it has no advantage over others and costs more, then giving and accepting the gift is forbidden as a form of bribery. If it gives them gifts only to promote itself, without pressuring them or influencing their decisions, giving and accepting the gift is permitted; it referred to decisions 145 and 249 of the Iftaa Council."
  ur: "بچوں کے دودھ کے ایک ایجنٹ کا سوال جو ہسپتالوں میں دائیوں کو تحفے دے کر اپنی مصنوعات کی تشہیر کرنا چاہتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر تحفے کسی ایسی مصنوع کی خصوصی تشہیر کے بدلے ہوں جسے دوسروں پر کوئی برتری نہیں تو حرام ہیں، اور اگر دائیوں کے فیصلے پر اثر ڈالے بغیر صرف کمپنی کی تشہیر ہوں تو جائز ہیں۔ ڈیپارٹمنٹ نے آغاز میں کہا کہ ہبہ بالاجماع مستحب ہے، اور اس بارے میں بغوی اور نووی سے نقل کیا۔ اس نے کہا کہ اگر کمپنی دائیوں کو اس کے بدلے تحفے دے کہ وہ صرف اسی کی مصنوع کی تشہیر کریں، حالانکہ اسے دوسروں پر کوئی برتری نہیں اور وہ مہنگی ہے، تو تحفہ دینا اور لینا رشوت کے باب سے ہونے کی وجہ سے حرام ہے۔ اور اگر وہ دباؤ ڈالے یا ان کے فیصلے پر اثر ڈالے بغیر صرف اپنی تشہیر کے لیے تحفے دے تو تحفہ دینا اور لینا جائز ہے؛ اس نے افتاء کونسل کے فیصلوں نمبر 145 اور 249 کا حوالہ دیا۔"
