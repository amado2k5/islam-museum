id: work/fatwa-aliftaa-jo-baby-milk-gifts-to-midwives
class: work
kind: fatwa
label: { ar: "هدايا وكلاء حليب الأطفال للقابلات", en: "Gifts from baby-milk agents to midwives", ur: "بچوں کے دودھ کے ایجنٹوں کے دائیوں کو تحفے", es: "Regalos de distribuidores de leche infantil a matronas", fr: "Cadeaux des agents de lait infantile aux sages-femmes", tr: "Ebe Maması Ajanları Hediyeleri", id: "Hadiah Agen Susu Formula Bayi untuk Bidan" }
summary:
  ar: "سؤال من وكيل حليب أطفال يريد الترويج لمنتجه بإهداء القابلات في المستشفيات، أجابت فيه دائرة الإفتاء العام الأردنية بأن الهدية حرام إن كانت مقابل ترويج حصري بلا ميزة للمنتج، وجائزة إن كانت ترويجًا للشركة دون تأثير على قرار القابلات. بدأت الدائرة بأن الهبة مستحبة بالإجماع، ونقلت في ذلك عن البغوي والنووي. وقالت إن الشركة إن كانت تقدم الهدايا للقابلات مقابل أن يروجن لمنتجها حصرًا دون أن تكون له ميزة على غيره مع ارتفاع سعره، فتقديم الهدية وقبولها حرام لأنه من باب الرشوة. وإن كانت تهديهن ترويجًا لنفسها فقط دون ضغط عليهن أو تأثير على قرارهن، فتقديم الهدية وقبولها جائز، وأحالت إلى قراري مجلس الإفتاء رقم 145 و249."
  en: "A question from a baby-milk agent who wants to promote his product by giving gifts to midwives in hospitals, in which Jordan's General Iftaa Department answered that the gifts are forbidden if given in return for exclusively promoting a product with no advantage over others, and permitted if they only promote the company without influencing the midwives' decisions. The Department began by saying that giving gifts is recommended by consensus, quoting al-Baghawi and al-Nawawi. It said that if the company gives the midwives gifts in return for promoting its product exclusively, although it has no advantage over others and costs more, then giving and accepting the gift is forbidden as a form of bribery. If it gives them gifts only to promote itself, without pressuring them or influencing their decisions, giving and accepting the gift is permitted; it referred to decisions 145 and 249 of the Iftaa Council."
  ur: "بچوں کے دودھ کے ایک ایجنٹ کا سوال جو ہسپتالوں میں دائیوں کو تحفے دے کر اپنی مصنوعات کی تشہیر کرنا چاہتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر تحفے کسی ایسی مصنوع کی خصوصی تشہیر کے بدلے ہوں جسے دوسروں پر کوئی برتری نہیں تو حرام ہیں، اور اگر دائیوں کے فیصلے پر اثر ڈالے بغیر صرف کمپنی کی تشہیر ہوں تو جائز ہیں۔ ڈیپارٹمنٹ نے آغاز میں کہا کہ ہبہ بالاجماع مستحب ہے، اور اس بارے میں بغوی اور نووی سے نقل کیا۔ اس نے کہا کہ اگر کمپنی دائیوں کو اس کے بدلے تحفے دے کہ وہ صرف اسی کی مصنوع کی تشہیر کریں، حالانکہ اسے دوسروں پر کوئی برتری نہیں اور وہ مہنگی ہے، تو تحفہ دینا اور لینا رشوت کے باب سے ہونے کی وجہ سے حرام ہے۔ اور اگر وہ دباؤ ڈالے یا ان کے فیصلے پر اثر ڈالے بغیر صرف اپنی تشہیر کے لیے تحفے دے تو تحفہ دینا اور لینا جائز ہے؛ اس نے افتاء کونسل کے فیصلوں نمبر 145 اور 249 کا حوالہ دیا۔"
  es: "Una consulta de un agente de leche infantil que deseaba promocionar su producto mediante obsequios a las parteras en los hospitales, a la que el Departamento General de Iftaa de Jordania respondió que los obsequios están prohibidos si se ofrecen a cambio de la promoción exclusiva de un producto sin ninguna ventaja sobre otros, y están permitidos si solo promocionan a la empresa sin influir en las decisiones de las parteras. El Departamento comenzó diciendo que la entrega de obsequios es recomendada por consenso, citando a al-Baghawi y al-Nawawi. Añadió que si la empresa obsequia a las parteras con regalos a cambio de la promoción exclusiva de su producto, aunque este no tenga ninguna ventaja sobre otros y sea más caro, entonces dar y aceptar el obsequio está prohibido por considerarse una forma de soborno. Si los obsequios se ofrecen únicamente para promocionarse a sí misma, sin presionarlas ni influir en sus decisiones, dar y aceptar el obsequio está permitido; hizo referencia a las decisiones 145 y 249 del Consejo de Iftaa."
  fr: "Un représentant d'une marque de lait infantile souhaitant promouvoir son produit en offrant des cadeaux aux sages-femmes dans les hôpitaux a été interrogé par le Département général de la jurisprudence islamique (Iftaa) de Jordanie. Ce dernier a statué que les cadeaux sont interdits s'ils sont offerts en échange de la promotion exclusive d'un produit sans avantage concurrentiel, et autorisés s'ils visent uniquement à promouvoir l'entreprise sans influencer les décisions des sages-femmes. Le Département a d'abord rappelé que l'offre de cadeaux est recommandée par consensus, citant al-Baghawi et al-Nawawi. Il a précisé que si l'entreprise offre des cadeaux aux sages-femmes en échange de la promotion exclusive de son produit, malgré l'absence d'avantage concurrentiel et un prix plus élevé, alors offrir et accepter ces cadeaux est interdit et constitue une forme de corruption. En revanche, si les cadeaux sont offerts uniquement à des fins de promotion, sans pression ni influence sur les sages-femmes, leur attribution est autorisée. Le Département a fait référence aux décisions 145 et 249 du Conseil de la jurisprudence islamique (Iftaa)."
  tr: "Ürününü hastanelerdeki ebelere hediye ederek tanıtmak isteyen bir bebek maması temsilcisinin sorusuna gelince, Ürdün Genel Fetva Dairesi, hediyenin ürün için herhangi bir avantaj olmadan özel tanıtım amaçlı olması durumunda yasak olduğunu, ebe kararını etkilemeden şirket için promosyon ise izin verildiğini söyledi. Bakanlık, hediyenin oybirliğiyle tavsiye edildiğini belirterek başladı ve bu konuda Al-Baghawi ile Al-Nawawi'nin sözlerini aktardı. Şirket, ürünün yüksek fiyatı nedeniyle diğerlerine karşı avantajı olmadan ebelere özel tanıtım karşılığında hediye veriyorsa, hediye vermenin ve kabul etmenin rüşvet olarak kabul edildiği için yasak olduğunu belirtti. Hediye sadece kendisi için bir promosyon olarak verilirse, baskı veya kararları etkilenmeden, hediye verme ve kabul etme izinlidir ve Fetva Konseyi'nin 145 ve 249 sayılı kararlarına atıfta bulunuldu."
  id: "Sebuah pertanyaan dari agen susu formula bayi yang ingin mempromosikan produknya dengan memberikannya kepada bidan di rumah sakit, Departemen Fatwa Umum Yordania menjawab bahwa hadiah tersebut dilarang jika untuk promosi eksklusif tanpa keuntungan bagi produk, dan diperbolehkan jika untuk promosi perusahaan tanpa mempengaruhi keputusan bidan. Departemen memulai dengan menyatakan bahwa hadiah tersebut direkomendasikan secara bulat dan mengutip Al-Baghawi dan Al-Nawawi mengenai hal ini. Departemen tersebut menyatakan bahwa jika perusahaan memberikan hadiah kepada bidan sebagai imbalan atas promosi eksklusif produknya tanpa memiliki keunggulan atas yang lain karena harga yang tinggi, maka memberikan dan menerima hadiah tersebut dilarang karena dianggap sebagai suap. Jika hadiah hanya diberikan sebagai promosi untuk dirinya sendiri tanpa tekanan atau pengaruh keputusan mereka, maka memberikan dan menerima hadiah diperbolehkan, dan hal ini merujuk pada keputusan Dewan Fatwa No. 145 dan 249."
