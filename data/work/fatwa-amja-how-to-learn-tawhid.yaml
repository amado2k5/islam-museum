label: { ar: "كيف يتعلم طالب العلم التوحيد", en: "How the seeker learns tawhid", ur: "طالب علم توحید کیسے سیکھے", es: "Cómo el buscador aprende el tawhid" }
summary:
  ar: "سأل سائل على طالب العلم أن يتعلم كيف يوحد الله فكيف يوحده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77975 بتاريخ 25 فبراير 2009)⁩ أن الإقرار المجمل بالتوحيد متحقق لدى المسلمين كافة فما منهم أحد إلا ويقر لله بالوحدانية ولمحمد بالرسالة، أما تفاصيل التوحيد وحقائقه فهذا الذي ينبغي تعلمه من خلال القراءة في كتب العقائد ونصحه بقراءة سلسلة العقائد للدكتور عمر سليمان الأشقر فإنها نافعة لمثله، وإن شق عليه الحصول عليها فليدخل على موقعه فيجد كتاب فاعلم أنه لا إله إلا الله فيقرأه فإنه نافع له ومن هنا يبدأ وكل خطوة ستسلمه للتي تليها."
  en: "A questioner asked how a seeker of knowledge learns to affirm God's oneness — 'how do I affirm it'. Dr. Salah al-Sawi (fatwa no. 77975, 25 February 2009) answered that the general profession of tawhid is realized in all Muslims — none of them but professes God's oneness and Muhammad's messengership — while the details and realities of tawhid are what must be learned, by reading the creed books: he recommended Dr. Umar Sulayman al-Ashqar's Beliefs series as useful for him, or if hard to get, his own book 'Know that there is no god but God' on his site — let him begin there and each step will deliver him to the next."
  ur: "ایک سائل نے توحید سیکھنے کا طریقہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77975، 25 فروری 2009)⁩ کے مطابق مجموعی اقرار سب میں ہے مگر تفصیلات کتب عقائد سے سیکھے جائیں — اشقر کی سلسلہ عقائد یا ان کی اپنی کتاب۔"
  es: "Un consultante preguntó cómo un buscador de conocimiento aprende a afirmar la unicidad de Dios: \"¿Cómo puedo afirmarla?\". El Dr. Salah al-Sawi (fatwa n.° 77975, 25 de febrero de 2009) respondió que la profesión general del tawhid se realiza en todos los musulmanes: ninguno de ellos deja de profesar la unicidad de Dios y la misión de Mahoma; mientras que los detalles y las realidades del tawhid son lo que se debe aprender leyendo los libros del credo. Recomendó la serie \"Creencias\" del Dr. Umar Sulayman al-Ashqar como útil, o, si le resulta difícil conseguirla, su propio libro \"Sabe que no hay más dios que Dios\" en su sitio web. Que comience por ahí y cada paso lo llevará al siguiente."
