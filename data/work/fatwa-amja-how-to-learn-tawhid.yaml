id: work/fatwa-amja-how-to-learn-tawhid
class: work
kind: fatwa
label: { ar: "كيف يتعلم طالب العلم التوحيد", en: "How the seeker learns tawhid", ur: "طالب علم توحید کیسے سیکھے", es: "Cómo el buscador aprende el tawhid", fr: "Comment le chercheur apprend le tawhid", tr: "Bilgi öğrencisi tektanrıcılığı nasıl öğrenir", id: "Bagaimana pelajar pengetahuan belajar monoteisme" }
summary:
  ar: "سأل سائل على طالب العلم أن يتعلم كيف يوحد الله فكيف يوحده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77975 بتاريخ 25 فبراير 2009)⁩ أن الإقرار المجمل بالتوحيد متحقق لدى المسلمين كافة فما منهم أحد إلا ويقر لله بالوحدانية ولمحمد بالرسالة، أما تفاصيل التوحيد وحقائقه فهذا الذي ينبغي تعلمه من خلال القراءة في كتب العقائد ونصحه بقراءة سلسلة العقائد للدكتور عمر سليمان الأشقر فإنها نافعة لمثله، وإن شق عليه الحصول عليها فليدخل على موقعه فيجد كتاب فاعلم أنه لا إله إلا الله فيقرأه فإنه نافع له ومن هنا يبدأ وكل خطوة ستسلمه للتي تليها."
  en: "A questioner asked how a seeker of knowledge learns to affirm God's oneness — 'how do I affirm it'. Dr. Salah al-Sawi (fatwa no. 77975, 25 February 2009) answered that the general profession of tawhid is realized in all Muslims — none of them but professes God's oneness and Muhammad's messengership — while the details and realities of tawhid are what must be learned, by reading the creed books: he recommended Dr. Umar Sulayman al-Ashqar's Beliefs series as useful for him, or if hard to get, his own book 'Know that there is no god but God' on his site — let him begin there and each step will deliver him to the next."
  ur: "ایک سائل نے توحید سیکھنے کا طریقہ پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77975، 25 فروری 2009)⁩ کے مطابق مجموعی اقرار سب میں ہے مگر تفصیلات کتب عقائد سے سیکھے جائیں — اشقر کی سلسلہ عقائد یا ان کی اپنی کتاب۔"
  es: "Un consultante preguntó cómo un buscador de conocimiento aprende a afirmar la unicidad de Dios: \"¿Cómo puedo afirmarla?\". El Dr. Salah al-Sawi (fatwa n.° 77975, 25 de febrero de 2009) respondió que la profesión general del tawhid se realiza en todos los musulmanes: ninguno de ellos deja de profesar la unicidad de Dios y la misión de Mahoma; mientras que los detalles y las realidades del tawhid son lo que se debe aprender leyendo los libros del credo. Recomendó la serie \"Creencias\" del Dr. Umar Sulayman al-Ashqar como útil, o, si le resulta difícil conseguirla, su propio libro \"Sabe que no hay más dios que Dios\" en su sitio web. Que comience por ahí y cada paso lo llevará al siguiente."
  fr: "Un lecteur a demandé comment un chercheur de connaissance apprend à affirmer l'unicité de Dieu: « Comment puis-je l'affirmer ? » Le Dr Salah al-Sawi (fatwa n° 77975, 25 février 2009) a répondu que la profession de foi générale du tawhid est une réalité pour tous les musulmans – aucun d'eux ne manque de professer l'unicité de Dieu et la prophétie de Muhammad – mais que les détails et les réalités du tawhid doivent être appris par la lecture des ouvrages de référence sur la religion. Il a recommandé la série « Beliefs » du Dr Umar Sulayman al-Ashqar, ou, à défaut, son propre livre « Know that there's no god as God » disponible sur son site. Il lui a conseillé de commencer par là, chaque étape le menant à la suivante."
  tr: "Bir soru soran kişi, bilgi öğrencisine Allah'ı nasıl birleştireceğini ve O'nu nasıl birleştireceğini öğrenmesini istedi. Dr. Salah Al-Sawy (25 Şubat 2009 tarihli 77975 No. Fetva) tek tanrıcılığın genel onayının tüm Müslümanlar arasında gerçekleştiğini söyledi; hiçbiri mesajın Allah'ın ve Muhammed'in birliğini kabul etmemektedir. Tek tanrıcılığın ayrıntıları ve gerçekleri ise, inanç kitaplarını okuyarak ve Dr. Ömer Süleyman El-Aşkar'ın inanç serisini okumasını tavsiye ederek öğrenilmesi gereken budur, çünkü bu onun gibi biri için faydalıdır. Eğer bunu elde etmek zorsa, web sitesini ziyaret edip bir kitap bulmalı ve Allah'tan başka bir tanrı olmadığını bilmeli, bu yüzden okumalı, çünkü bu ona faydalıdır. Buradan başlar ve her adım bir sonrakine devredilir."
  id: "Seorang penanya meminta pelajar ilmu pengetahuan untuk belajar bagaimana menyatukan Allah dan bagaimana menyatukan-Nya. Dr. Salah Al-Sawy menjawab (Fatwa No. 77975 tanggal 25 Februari 2009) bahwa penegasan umum moneedisme diwujudkan di antara semua umat Muslim; tidak ada yang tidak mengakui kesatuan Allah dan Muhammad dalam pesan tersebut. Adapun rincian dan fakta monoteisme, inilah yang harus dipelajari dengan membaca kitab-kitab kredo, dan menyarankan agar ia membaca rangkaian kredo Dr. Omar Suleiman Al-Ashqar, karena itu bermanfaat bagi seseorang seperti dirinya. Jika mendapatkannya sulit, ia harus mengunjungi situs webnya dan menemukan sebuah buku serta mengetahui bahwa tidak ada tuhan selain Allah, maka bacalah itu, karena itu menguntungkannya. Dari sini, ia memulai, dan setiap langkah akan diserahkan ke langkah berikutnya."
