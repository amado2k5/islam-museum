id: work/fatwa-aliftaa-jo-taking-medicine-to-delay-menstruation-in-ramadan
class: work
kind: fatwa
label: { ar: "صيام من أخذت دواءً لتأخير الحيض", en: "Fasting after taking medicine to delay menstruation", ur: "حیض مؤخر کرنے کی دوا لینے والی کا روزہ" }
summary:
  ar: "سؤال عن امرأة أخذت دواءً لتأخير الحيض وصامت، أجابت فيه دائرة الإفتاء العام الأردنية بأن صيامها صحيح، لكنها لا تُنصح بذلك لعدم الضرورة، ويحرم عليها تناوله إن كان يضر بها ولو احتمالًا. أجابت الدائرة بأن المرأة إذا أخذت دواءً فلم تر دم الحيض وصامت فصيامها صحيح. وقالت إنها لا تُنصح بذلك إذ لا ضرورة له، وإن كان الدواء يضر بها ولو احتمالًا حرم عليها تناوله."
  en: "A question about a woman who took medicine to delay menstruation and fasted, in which Jordan's General Iftaa Department answered that her fast is valid, but that she is not advised to do so as there is no necessity, and that taking it is forbidden if it harms her, even possibly. The Department answered that if a woman takes medicine, sees no menstrual blood and fasts, her fast is valid. It said she is not advised to do this since there is no necessity for it, and if the medicine harms her, even possibly, taking it is forbidden for her."
  ur: "ایک خاتون کے بارے میں سوال جس نے حیض مؤخر کرنے کی دوا لے کر روزہ رکھا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس کا روزہ درست ہے، لیکن ضرورت نہ ہونے کی وجہ سے اسے اس کا مشورہ نہیں دیا جاتا، اور اگر دوا سے نقصان ہو، چاہے صرف امکان ہو، تو اسے لینا حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر عورت دوا لے، حیض کا خون نہ دیکھے اور روزہ رکھے تو اس کا روزہ درست ہے۔ اس نے کہا کہ اسے اس کا مشورہ نہیں دیا جاتا کیونکہ اس کی ضرورت نہیں، اور اگر دوا اسے نقصان دے، چاہے صرف امکان ہو، تو اس کا لینا اس پر حرام ہے۔"
