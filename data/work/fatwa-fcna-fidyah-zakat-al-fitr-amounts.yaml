label: { ar: "مقدار الفدية وزكاة الفطر", en: "The Amount of Fidyah and Zakat al-Fitr", ur: "فدیہ اور زکات فطر کی مقدار", es: "La cantidad de Fidyah y Zakat al-Fitr", fr: "Le montant de la Fidyah et de la Zakat al-Fitr", tr: "Fidya ve Zekat el-Fitr miktarı", id: "Jumlah Fidya dan Zakat al-Fitr" }
summary:
  ar: "بيان من المجلس الفقهي لأمريكا الشمالية في مقدار الفدية — وهي ما يدفعه من لم يستطع الصوم عن كل يوم — وزكاة الفطر: أوصى المجلس بأن تكون الفدية 15 دولارًا لليوم وزكاة الفطر 10 دولارات للشخص في عام 2026، مع تفصيل الجواب أساس التقدير وطريقة الدفع."
  en: "A statement of the Fiqh Council of North America on the amounts of fidyah — the payment for each day someone unable to fast misses — and of zakat al-fitr: the Council recommends $15 per day for fidyah and $10 per person for zakat al-fitr in 2026, and the answer details the basis of the estimate and the method of payment."
  ur: "فقہ کونسل آف نارتھ امریکہ کا بیان فدیہ کی مقدار — وہ رقم جو صوم کی استطاعت نہ رکھنے والا ہر دن کے عوض دیتا ہے — اور زکات فطر پر: کونسل نے 2026 میں فدیہ 15 ڈالر فی دن اور زکات فطر 10 ڈالر فی شخص تجویز کی ہے، اور جواب میں تخمینے کی بنیاد اور ادائیگی کا طریقہ بیان ہے۔"
  es: "Declaración del Consejo de Jurisprudencia Islámica de Norteamérica sobre las cantidades de fidyah —el pago por cada día que una persona que no puede ayunar pierde— y de zakat al-fitr: el Consejo recomienda 15 dólares al día para fidyah y 10 dólares por persona para zakat al-fitr en 2026, y la respuesta detalla la base de la estimación y el método de pago."
  fr: "Déclaration du Conseil Fiqh d'Amérique du Nord sur les montants de la fidyah (l'aumône pour chaque jour manqué par une personne incapable de jeûner) et de la zakat al-fitr: le Conseil recommande 15 $ par jour pour la fidyah et 10 $ par personne pour la zakat al-fitr en 2026, et la réponse détaille la base de l'estimation et le mode de paiement."
  tr: "Kuzey Amerika Fikıh Konseyi'nin her gün oruç tutamayanlar tarafından ödenen fidya miktarı ve Zekat al-Fitr'e ilişkin açıklaması: Konsey, 2026'da fidyanın kişi başı 15 dolar, zekat el-Fitr'in ise kişi başı 10 dolar olmasını önerdi ve cevabında tahmin ve ödeme yönteminin temelleri yer aldı."
  id: "Pernyataan dari Dewan Fiqh Amerika Utara tentang jumlah fidya — yang dibayarkan oleh mereka yang tidak dapat berpuasa setiap hari — dan Zakat al-Fitr: Dewan merekomendasikan agar fidya $15 per hari dan Zakat al-Fitr $10 per orang pada tahun 2026, dengan jawaban yang merinci dasar estimasi dan metode pembayaran."
