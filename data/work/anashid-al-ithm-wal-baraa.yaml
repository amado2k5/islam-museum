label: { ar: "أناشيد الإثم والبراءة", en: "Anashid al-Ithm wa-l-Bara'a", ur: "اناشید الاثم والبراءۃ" }
summary:
  ar: "نصوص نثرية لمصطفى محمود في الحب والخيانة والعذاب والانتحار والمرأة والحرية، يبدأ أولها بسؤال «الحب ما هو؟» ويجيب بأنه «التناسب.. تناسب النفوس»، ويختم الكتاب بمناجاة طويلة بعنوان «دعاء العبد الخطاء» {cite:mm-anashid-al-ithm-maarif-ed2 p. 3} {cite:mm-anashid-al-ithm-maarif-ed2 p. 5} {cite:mm-anashid-al-ithm-maarif-ed2 p. 51}."
  en: "Prose pieces by Mostafa Mahmoud on love, betrayal, suffering, suicide, women and freedom; the first asks 'What is love?' and answers that it is 'fitness... the fitness of souls', and the book closes with a long intimate prayer titled 'Prayer of the erring servant' {cite:mm-anashid-al-ithm-maarif-ed2 p. 3} {cite:mm-anashid-al-ithm-maarif-ed2 p. 5} {cite:mm-anashid-al-ithm-maarif-ed2 p. 51}."
  ur: "محبت، بے وفائی، عذاب، خودکشی، عورت اور آزادی پر مصطفیٰ محمود کی نثری تحریریں؛ پہلی تحریر پوچھتی ہے «محبت کیا ہے؟» اور جواب دیتی ہے کہ وہ «مناسبت... روحوں کی مناسبت» ہے، اور کتاب «خطاکار بندے کی دعا» کے عنوان سے ایک طویل مناجات پر ختم ہوتی ہے {cite:mm-anashid-al-ithm-maarif-ed2 p. 3} {cite:mm-anashid-al-ithm-maarif-ed2 p. 5} {cite:mm-anashid-al-ithm-maarif-ed2 p. 51}۔"
