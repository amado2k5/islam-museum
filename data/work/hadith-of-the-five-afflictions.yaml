summary:
  ar: "كلمة للنبي إلى المهاجرين يرويها عبد الله بن عمر في خبر بعث عبد الرحمن بن عوف: خمس خصال يستعيذ بالله أن تدركهم: ظهور الفاحشة فيظهر الطاعون، ونقص المكيال فيأتي الجدب وجور السلطان، ومنع الزكاة فيُمنع القطر، ونقض العهد فيُسلّط العدو، وترك الحكم بكتاب الله فيكون البأس بينهم."
  en: "Words of the Prophet to the Muhajirun transmitted by Abdullah ibn Umar in the account of Abd al-Rahman ibn Awf's dispatch: five things he sought refuge from befalling them: open indecency bringing plague, short measure bringing famine and tyranny, withheld zakat bringing drought, broken covenants bringing an outside enemy, and rulers not judging by God's book bringing internal strife."
