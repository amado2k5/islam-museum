label:
  ar: "سيرة رسول الله 2026، الحلقة 23: خلاصة الستة أعوام الأولى من السيرة النبوية"
  en: "The Biography of the Messenger of God 2026, episode 23: Summary of the First Six Years of the Prophetic Biography"
  ur: "سیرتِ رسول اللہ 2026، قسط 23: سیرت نبوی کے پہلے چھ برسوں کا خلاصہ"
  fr: "La biographie du Messager de Dieu 2026, épisode 23 : Bilan des six premières années de la biographie prophétique"
  es: "La biografía del Mensajero de Dios 2026, episodio 23: Resumen de los seis primeros años de la biografía del Profeta"
summary:
  ar: "يبدأ المحاضر بالتعريف بالصحابي المبكر عبد الله بن سهيل، ثم يستكمل عدداً من أطراف فصل الحبشة في سيرة ابن إسحاق، مثل تولي النجاشي الحكم والثورة عليه. ويخصص معظم الحلقة لقائمة من نحو خمسة عشر درساً عاماً يستخلصها من السنوات الست الأولى من الدعوة، ويختمها بقراءة سريعة لسورة فصلت في ضوء تلك الدروس."
  en: "The lecturer first profiles the early Companion Abdullah ibn Suhayl, then closes several loose ends of the Abyssinia chapter from Ibn Ishaq's biography (the Negus's accession, the revolt against him). Most of the episode is a list of about fifteen general lessons he draws from the first six years of the mission, and it ends with a quick reading of Surah Fussilat in light of those lessons."
  ur: "مقرر پہلے ابتدائی صحابی عبداللہ بن سہیل کا تعارف کراتے ہیں، پھر ابن اسحاق کی سیرت میں حبشہ کے باب کے کئی ادھورے سرے سمیٹتے ہیں، جیسے نجاشی کا تخت نشین ہونا اور اس کے خلاف بغاوت۔ قسط کا بیشتر حصہ ان تقریباً پندرہ عمومی اسباق کی فہرست ہے جو وہ دعوت کے پہلے چھ برسوں سے اخذ کرتے ہیں، اور اختتام پر انہی اسباق کی روشنی میں سورہ فصلت کی تیز رفتار قراءت ہے۔"
  fr: "Le conférencier présente d'abord le Compagnon de la première heure Abdallah ibn Suhayl, puis il règle plusieurs points restés en suspens du chapitre sur l'Abyssinie dans la biographie d'Ibn Ishaq (l'accession du Négus, la révolte contre lui). La plus grande partie de l'épisode est une liste d'une quinzaine de leçons générales qu'il tire des six premières années de la mission, et il se termine par une lecture rapide de la sourate Fussilat à la lumière de ces leçons."
  es: "El conferenciante presenta primero al Compañero temprano Abdallah ibn Suhayl y después cierra varios cabos sueltos del capítulo de Abisinia de la biografía de Ibn Ishaq (el ascenso del Negus y la rebelión contra él). La mayor parte del episodio es una lista de unas quince lecciones generales que extrae de los seis primeros años de la misión, y termina con una lectura rápida de la sura Fussilat a la luz de esas lecciones."
