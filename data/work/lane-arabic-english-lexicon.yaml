summary:
  ar: "«معجم لين العربي الإنجليزي»، ويُعرف بعنوانه العربي «مد القاموس»، من تأليف إدوارد وليام لين، في ثمانية أجزاء، وتُسجَّل له طبعة سنة ١٨٦٣م عن دار ويليام ونوركيت في لندن وإدنبرة. ويرى كاتب في «The Digital Orientalist» أنه لا نظير له منذ ١٨٦٣م، غير أنه ينتهي عند حرف القاف: فالجذور بعده موجودة لكنها غير مستوفاة. ويُسجَّل أنه في الملك العام. نصه الكامل في مكتبة بيرسيوس الرقمية، ومسوح صفحاته في أرشيف تيندل، وتوجد نسخة نصية مرقمنة في أرشيف الإنترنت."
  en: "An Arabic-English Lexicon by Edward William Lane, also known by its Arabic title Madd al-Qamus, in eight parts; an 1863 edition by William and Norgate, London and Edinburgh, is recorded. A writer for The Digital Orientalist calls it unequalled since 1863, although it runs only to the letter qaf: roots after it are present but not complete. It is recorded as in the public domain. The full text is on the Perseus Digital Library, page scans are in the Tyndale archive, and a digitized text version is on the Internet Archive."
  es: "El An Arabic-English Lexicon de Edward William Lane, conocido también por su título árabe Madd al-Qamus, en ocho partes; se registra una edición de 1863 de William and Norgate, Londres y Edimburgo. Un autor de The Digital Orientalist lo considera sin igual desde 1863, aunque llega solo hasta la letra qaf: las raíces posteriores están presentes pero no completas. Figura como de dominio público. El texto completo está en la Perseus Digital Library, hay escaneos de las páginas en el archivo Tyndale y una versión de texto digitalizada en el Internet Archive."
  fr: "L'An Arabic-English Lexicon d'Edward William Lane, connu aussi sous son titre arabe Madd al-Qamus, en huit parties ; une édition de 1863 de William and Norgate, Londres et Édimbourg, est enregistrée. Un auteur de The Digital Orientalist le juge sans égal depuis 1863, bien qu'il ne couvre que jusqu'à la lettre qaf : les racines suivantes sont présentes mais incomplètes. Il est enregistré comme appartenant au domaine public. Le texte intégral est sur la Perseus Digital Library, des numérisations de pages sont dans l'archive Tyndale et une version texte numérisée est sur l'Internet Archive."
  ur: "ایڈورڈ ولیم لین کی An Arabic-English Lexicon، جو اپنے عربی نام مد القاموس سے بھی معروف ہے، آٹھ حصوں میں؛ 1863ء کا ایک ایڈیشن ولیم اینڈ نارگیٹ، لندن اور ایڈنبرا، درج ہے۔ The Digital Orientalist کے ایک لکھنے والے کے نزدیک 1863ء سے اس کا کوئی ثانی نہیں، اگرچہ یہ حرف قاف تک ہی ہے: اس کے بعد کے مادے موجود ہیں مگر مکمل نہیں۔ اسے عوامی ملکیت میں درج کیا گیا ہے۔ مکمل متن پرسیوس ڈیجیٹل لائبریری میں ہے، صفحات کے اسکین ٹنڈیل آرکائیو میں، اور ایک ڈیجیٹل متنی نسخہ انٹرنیٹ آرکائیو پر۔"
