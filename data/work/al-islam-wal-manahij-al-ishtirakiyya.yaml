summary:
  ar: "كتاب لمحمد الغزالي ألّفه، بحسب تقديم الكتاب، سنة 1947 تكملة لكتابه «الإسلام والأوضاع الاقتصادية»، ويقارن فيه بين مبادئ الإسلام الاقتصادية والمناهج الاشتراكية المعاصرة {cite:islam-wal-manahij-nahdat-misr-2005 p.2} {cite:islam-wal-manahij-nahdat-misr-2005 p.5}. ما يعرضه المؤلف في هذا الكتاب من تقويم للاشتراكية رأيه هو، ويُعرض هنا بوصفه رأي المؤلف لا حكماً عاماً من المتحف."
  en: "Muhammad al-Ghazali's book, which its preface says he wrote in 1947 as a sequel to his Islam and Economic Conditions; it compares Islamic economic principles with contemporary socialist methods. The critical assessment of socialism is the author's own reading and is presented as such {cite:islam-wal-manahij-nahdat-misr-2005 p.2} {cite:islam-wal-manahij-nahdat-misr-2005 p.5}."
  es: "El libro de Muhammad al-Ghazali, que según su prefacio escribió en 1947 como continuación de su obra Islam y condiciones económicas, compara los principios económicos islámicos con los métodos socialistas contemporáneos. La evaluación crítica del socialismo es la propia interpretación del autor y se presenta como tal {cite:islam-wal-manahij-nahdat-misr-2005 p.2} {cite:islam-wal-manahij-nahdat-misr-2005 p.5}."
  fr: "L'ouvrage de Muhammad al-Ghazali, dont la préface indique qu'il a été écrit en 1947 comme suite à son livre *Islam et conditions économiques*, compare les principes économiques islamiques aux méthodes socialistes contemporaines. L'analyse critique du socialisme est l'interprétation personnelle de l'auteur et est présentée comme telle {cite:islam-wal-manahij-nahdat-misr-2005 p.2} {cite:islam-wal-manahij-nahdat-misr-2005 p.5}."
