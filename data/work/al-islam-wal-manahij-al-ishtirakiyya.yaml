summary:
  ar: "كتاب لمحمد الغزالي ألّفه، بحسب تقديم الكتاب، سنة 1947 تكملة لكتابه «الإسلام والأوضاع الاقتصادية»، ويقارن فيه بين مبادئ الإسلام الاقتصادية والمناهج الاشتراكية المعاصرة {cite:islam-wal-manahij-nahdat-misr-2005 p.2} {cite:islam-wal-manahij-nahdat-misr-2005 p.5}. ما يعرضه المؤلف في هذا الكتاب من تقويم للاشتراكية رأيه هو، ويُعرض هنا بوصفه رأي المؤلف لا حكماً عاماً من المتحف."
  en: "Muhammad al-Ghazali's book, which its preface says he wrote in 1947 as a sequel to his Islam and Economic Conditions; it compares Islamic economic principles with contemporary socialist methods. The critical assessment of socialism is the author's own reading and is presented as such {cite:islam-wal-manahij-nahdat-misr-2005 p.2} {cite:islam-wal-manahij-nahdat-misr-2005 p.5}."
