summary:
  ar: "تاريخ بخارى كتاب في تاريخ بخارى ألّفه بالعربية أبو بكر محمد بن جعفر النرشخي وقدّمه إلى الأمير السامانيّ نوح بن نصر سنة 332هـ/943-944م، وهو كتابه الوحيد المعروف. وتقول المقالة إن النص الفارسي المتداول مغيَّر كثيراً عن أصله، وهو ترجمة أنجزها أبو نصر أحمد بن محمد القبوي سنة 522هـ/1128م وأوصلها إلى سنة 365هـ/975-976م، ثم اختصرها محمد بن زفر سنة 574هـ/1178-1179م وزاد عليها غيره في العهد المغولي. وتعدّ دائرة المعارف الإسلامية الكتاب ذا قيمة كبيرة لتاريخ آسيا الوسطى المبكر في العهدين الطاهري والسامانيّ {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  en: "The Tarikh-i Bukhara is a history of Bukhara written in Arabic by Abu Bakr Muhammad ibn Ja'far al-Narshakhi and presented to the Samanid amir Nuh ibn Nasr in 332/943-4; it is his only known book. The Persian text we have, the article says, is much altered from its original form: al-Qubawi translated it in 522/1128 and brought it down to 365/975-6, Muhammad ibn Zufar abridged and expanded it in 574/1178-9, and an unknown author added the Mongol conquest. The Encyclopaedia of Islam calls it very valuable for the early Islamic history of Central Asia and for the Tahirid and Samanid periods {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  ur: "تاریخِ بخارا بخارا کی تاریخ ہے جو ابو بکر محمد بن جعفر نرشخی نے عربی میں لکھی اور 332ھ/943-944ء میں سامانی امیر نوح بن نصر کو پیش کی؛ یہی ان کی واحد معروف کتاب ہے۔ موجودہ فارسی متن اصل سے بہت بدلا ہوا ہے: قباوی نے 522ھ/1128ء میں اس کا ترجمہ کیا اور اسے 365ھ/975-976ء تک پہنچایا، محمد بن زفر نے 574ھ/1178-1179ء میں اس کا اختصار کیا اور اضافے کیے، اور ایک نامعلوم مصنف نے منگول فتح کا حال شامل کیا۔ دائرۃ المعارف الاسلامیہ اسے وسطی ایشیا کی ابتدائی اسلامی تاریخ اور طاہری و سامانی ادوار کے لیے بہت قیمتی قرار دیتا ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  es: "El Tarikh-i Bukhara es una historia de Bujará escrita en árabe por Abu Bakr Muhammad ibn Ja'far al-Narshakhi y presentada al emir samaní Nuh ibn Nasr en 332/943-4; es su único libro conocido. El texto persa que conservamos, según el artículo, está muy alterado respecto a su forma original: al-Qubawi lo tradujo en 522/1128 y lo actualizó en 365/975-6, Muhammad ibn Zufar lo abrevió y amplió en 574/1178-9, y un autor desconocido añadió la conquista mongola. La Enciclopedia del Islam la considera muy valiosa para la historia islámica temprana de Asia Central y para los periodos tahirí y samaní {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  fr: "Le Tarikh-i Bukhara est une histoire de Boukhara écrite en arabe par Abu Bakr Muhammad ibn Ja'far al-Narshakhi et présentée à l'émir samanide Nuh ibn Nasr en 332/943-4; c'est son seul ouvrage connu. Le texte persan dont nous disposons, selon l'article, est très différent de l'original: al-Qubawi l'a traduit en 522/1128 et l'a ramené à 365/975-6, Muhammad ibn Zufar l'a abrégé et augmenté en 574/1178-9, et un auteur inconnu y a ajouté la conquête mongole. L'Encyclopédie de l'Islam le considère comme un ouvrage précieux pour l'histoire islamique ancienne de l'Asie centrale et pour les périodes tahiride et samanide (encyclopaedia-of-islam-2 vol. 7 p. 1020)."
  tr: "Buhara'nın Tarihi, Ebu Bekir Muhammed bin Ca'far el-Narşahi tarafından Arapça yazılmış ve 332 H / 943-944 yılında Samani prensi Nuh ibn Nasr'a hediye edilen Buhara tarihi üzerine bir kitaptır. Bu, bilinen tek kitabıdır. Makalede, yaygın olarak dolaşan Farsça metnin orijinalinden önemli ölçüde değiştiği belirtilir. Bu çeviri, Ebu Nasr Ahmed ibn Muhammed el-Kubavi tarafından 522 Hj/1128 yılında tamamlanmış, 365 Hicri / 975-976 yıllarına kadar uzatılmış, ardından Muhammed bin Zafar tarafından 574 Hicri / 1178-1179 yılında kısaltılmış ve Moğol döneminde başkaları tarafından eklenmiştir. İslami Ansiklopedi, kitabı Tahiri ve Samani dönemlerinde Orta Asya'nın erken tarihi için büyük değer taşımaktadır {atıf:İslam ansiklopedisi-2 cilt 7, s. 1020}."
  id: "Sejarah Bukhara adalah sebuah buku tentang sejarah Bukhara yang ditulis dalam bahasa Arab oleh Abu Bakr Muhammad ibn Ja'far al-Narshakhi, yang menyerahkannya kepada pangeran Samanid Nuh ibn Nasr pada tahun 332 H/943-944 M. Ini adalah satu-satunya buku yang diketahui oleh Baku. Artikel tersebut menyatakan bahwa teks Persia yang umum beredar telah berubah secara signifikan dari aslinya. Ini adalah terjemahan yang diselesaikan oleh Abu Nasr Ahmad ibn Muhammad al-Qubawi pada tahun 522 H/1128 M, yang diperpanjang hingga tahun 365 H / 975-976 M, kemudian diringkas oleh Muhammad ibn Zafar pada tahun 574 H / 1178-1179 M dan ditambahkan oleh orang lain selama era Mongol. Ensiklopedia Islam menganggap buku ini sangat berharga untuk sejarah awal Asia Tengah selama era Tahiri dan Samanid {cite:ensiklopedia-dari-Islam-2 vol. 7, hlm. 1020}."
