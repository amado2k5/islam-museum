label: { ar: "تاريخ بخارى", en: "Tarikh-i Bukhara", ur: "تاریخِ بخارا" }
summary:
  ar: "تاريخ بخارى كتاب في تاريخ بخارى ألّفه بالعربية أبو بكر محمد بن جعفر النرشخي وقدّمه إلى الأمير السامانيّ نوح بن نصر سنة 332هـ/943-944م، وهو كتابه الوحيد المعروف. وتقول المقالة إن النص الفارسي المتداول مغيَّر كثيراً عن أصله، وهو ترجمة أنجزها أبو نصر أحمد بن محمد القبوي سنة 522هـ/1128م وأوصلها إلى سنة 365هـ/975-976م، ثم اختصرها محمد بن زفر سنة 574هـ/1178-1179م وزاد عليها غيره في العهد المغولي. وتعدّ دائرة المعارف الإسلامية الكتاب ذا قيمة كبيرة لتاريخ آسيا الوسطى المبكر في العهدين الطاهري والسامانيّ {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  en: "The Tarikh-i Bukhara is a history of Bukhara written in Arabic by Abu Bakr Muhammad ibn Ja'far al-Narshakhi and presented to the Samanid amir Nuh ibn Nasr in 332/943-4; it is his only known book. The Persian text we have, the article says, is much altered from its original form: al-Qubawi translated it in 522/1128 and brought it down to 365/975-6, Muhammad ibn Zufar abridged and expanded it in 574/1178-9, and an unknown author added the Mongol conquest. The Encyclopaedia of Islam calls it very valuable for the early Islamic history of Central Asia and for the Tahirid and Samanid periods {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  ur: "تاریخِ بخارا بخارا کی تاریخ ہے جو ابو بکر محمد بن جعفر نرشخی نے عربی میں لکھی اور 332ھ/943-944ء میں سامانی امیر نوح بن نصر کو پیش کی؛ یہی ان کی واحد معروف کتاب ہے۔ موجودہ فارسی متن اصل سے بہت بدلا ہوا ہے: قباوی نے 522ھ/1128ء میں اس کا ترجمہ کیا اور اسے 365ھ/975-976ء تک پہنچایا، محمد بن زفر نے 574ھ/1178-1179ء میں اس کا اختصار کیا اور اضافے کیے، اور ایک نامعلوم مصنف نے منگول فتح کا حال شامل کیا۔ دائرۃ المعارف الاسلامیہ اسے وسطی ایشیا کی ابتدائی اسلامی تاریخ اور طاہری و سامانی ادوار کے لیے بہت قیمتی قرار دیتا ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
