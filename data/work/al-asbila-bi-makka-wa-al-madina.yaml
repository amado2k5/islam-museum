summary:
  ar: "دراسة تاريخية آثارية لمحمد حمزة إسماعيل الحداد ⁦(القاهرة، 2004)⁩ عن أسبلة الماء في مكة والمدينة وطرق الحج، في فصلين: تاريخي يتتبع السقايات والأسبلة عصراً عصراً، وآثاري يدرس طرزها {cite:haddad-asbila-makka-madina-2004 p.5} {cite:haddad-asbila-makka-madina-2004 p.6}."
  en: "A historical and archaeological study by Muhammad Hamza Isma'il al-Haddad (Cairo, 2004) of the water sabils of Mecca, Medina and the pilgrim roads, in two chapters: a history of the siqayas and sabils period by period, and an archaeological study of their types {cite:haddad-asbila-makka-madina-2004 p.5} {cite:haddad-asbila-makka-madina-2004 p.6}."
  es: "Un estudio histórico y arqueológico realizado por Muhammad Hamza Isma'il al-Haddad (El Cairo, 2004) de los sabils acuáticos de La Meca, Medina y los caminos de peregrinación, en dos capítulos: una historia de los siqayas y sabils período por período, y un estudio arqueológico de sus tipos {cite:haddad-asbila-makka-madina-2004 p.5} {cite:haddad-asbila-makka-madina-2004 pág.6}."
  fr: "Une étude historique et archéologique par Muhammad Hamza Isma'il al-Haddad (Le Caire, 2004) des sabils aquatiques de La Mecque, Médine et des chemins de pèlerinage, en deux chapitres: une histoire des siqayas et des sabils période par période, et une étude archéologique de leurs types {cite:haddad-asbila-makka-madina-2004 p.5} {cite:haddad-asbila-makka-madina-2004 p.6}."
  ur: "محمد حمزہ اسماعیل الحداد ⁦(قاہرہ، 2004)⁩ کی طرف سے مکہ، مدینہ اور حجاج کی سڑکوں کے آبی سبیلوں کا ایک تاریخی اور آثار قدیمہ کا مطالعہ، دو ابواب میں: سقائوں اور سبیلوں کی مدت کے لحاظ سے تاریخ، اور ان کی اقسام کا آثار قدیمہ کا مطالعہ۔ {حوالہ:حداد-اسبیلہ-مکہ-مدینہ-2004 صفحہ 6}۔"
  tr: "Muhammed Hamza İsmail Al-Haddad tarafından (Kahire, 2004) Mekke ve Medine'deki su çeşmeleri ile hac yolları üzerine iki bölümden oluşan tarihsel arkeolojik çalışma: sulama kanalları ve su yollarını dönemden döneme izleyen tarihsel bir çalışma ve bunların tarzlarına dair arkeolojik bir çalışma {cite:haddad-asbila-makka-madina-2004 s.5} {cite:haddad-asbila-makka-madina-2004 s.6}."
  id: "Studi arkeologi sejarah oleh Muhammad Hamza Ismail Al-Haddad (Kairo, 2004) tentang air mancur di Mekah dan Madinah serta jalur ziarah, dalam dua bab: studi sejarah yang menelusuri kanal irigasi dan saluran air dari era ke zaman, dan studi arkeologi tentang gayanya {cite:haddad-asbila-makka-madina-2004 hlm.5} {cite:haddad-asbila-makka-madina-2004 hlm.6}."
