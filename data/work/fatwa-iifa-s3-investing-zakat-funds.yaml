id: work/fatwa-iifa-s3-investing-zakat-funds
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن توظيف الزكاة في مشاريع ذات ريع", en: "IIFA resolution on investing zakat funds in revenue projects", ur: "اکیڈمی کی قرارداد: منافع بخش منصوبوں میں زکوٰۃ کی سرمایہ کاری", es: "Resolución de la IIFA sobre la inversión de fondos de zakat en proyectos generadores de ingresos.", fr: "Résolution de l'IIFA sur l'investissement des fonds de la zakat dans des projets générateurs de revenus", tr: "Gelir getiren projelerde zekatın kullanımına ilişkin Uluslararası İslami Fiqh Akademisi kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penggunaan Zakat dalam proyek-proyek penghasil pendapatan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: يجوز من حيث المبدأ توظيف أموال الزكاة في مشاريع استثمارية تنتهي بتمليك أصحاب الاستحقاق أو تابعة للجهة الشرعية المسؤولة عن جمع الزكاة وتوزيعها، بشرط تلبية الحاجة الماسة الفورية للمستحقين وتوافر ضمانات كافية للبعد عن الخسائر."
  en: "IIFA's third-session resolution (Amman, October 1986): zakat funds may in principle be invested in projects ending in ownership for the eligible recipients, or belonging to the sharia body responsible for collecting and distributing zakat — provided recipients' immediate pressing needs are met and sufficient safeguards against loss exist."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: زکوٰۃ کے فنڈز ایسے منصوبوں میں لگائے جا سکتے ہیں جن کا انجام مستحقین کی ملکیت ہو — بشرط فوری ضرورتیں پوری ہوں اور نقصان سے تحفظ ہو۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986): los fondos del zakat pueden, en principio, invertirse en proyectos que resulten en la propiedad de los beneficiarios elegibles, o que pertenezcan al organismo de la sharia responsable de recaudar y distribuir el zakat, siempre que se satisfagan las necesidades inmediatas y urgentes de los beneficiarios y existan suficientes salvaguardias contra las pérdidas."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986): les fonds de la zakat peuvent en principe être investis dans des projets aboutissant à la propriété des bénéficiaires éligibles, ou appartenant à l'organisme de la charia chargé de collecter et de distribuer la zakat — à condition que les besoins urgents et pressants des bénéficiaires soient satisfaits et que des garanties suffisantes contre les pertes existent."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986) kararı: Prensip olarak, zekat fonları, hak sahiplerinin mülkiyetinde veya zekat toplama ve dağıtımından sorumlu meşru makama bağlı yatırım projelerine yatırılabilir; ancak uygun alıcıların acil ihtiyaçları karşılanır ve kayıpları önlemek için yeterli garantiler mevcuttur."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi ketiganya (Amman, Oktober 1986): Pada prinsipnya, dana zakat dapat diinvestasikan dalam proyek investasi yang berakhir dengan kepemilikan penerima manfaat atau yang berafiliasi dengan otoritas sah yang bertanggung jawab mengumpulkan dan mendistribusikan zakat, asalkan kebutuhan mendesak yang mendesak dari penerima yang memenuhi syarat terpenuhi dan jaminan yang cukup tersedia untuk menghindari kerugian."
