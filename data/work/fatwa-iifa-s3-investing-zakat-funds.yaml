label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن توظيف الزكاة في مشاريع ذات ريع", en: "IIFA resolution on investing zakat funds in revenue projects", ur: "اکیڈمی کی قرارداد: منافع بخش منصوبوں میں زکوٰۃ کی سرمایہ کاری", es: "Resolución de la IIFA sobre la inversión de fondos de zakat en proyectos generadores de ingresos." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: يجوز من حيث المبدأ توظيف أموال الزكاة في مشاريع استثمارية تنتهي بتمليك أصحاب الاستحقاق أو تابعة للجهة الشرعية المسؤولة عن جمع الزكاة وتوزيعها، بشرط تلبية الحاجة الماسة الفورية للمستحقين وتوافر ضمانات كافية للبعد عن الخسائر."
  en: "IIFA's third-session resolution (Amman, October 1986): zakat funds may in principle be invested in projects ending in ownership for the eligible recipients, or belonging to the sharia body responsible for collecting and distributing zakat — provided recipients' immediate pressing needs are met and sufficient safeguards against loss exist."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: زکوٰۃ کے فنڈز ایسے منصوبوں میں لگائے جا سکتے ہیں جن کا انجام مستحقین کی ملکیت ہو — بشرط فوری ضرورتیں پوری ہوں اور نقصان سے تحفظ ہو۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986): los fondos del zakat pueden, en principio, invertirse en proyectos que resulten en la propiedad de los beneficiarios elegibles, o que pertenezcan al organismo de la sharia responsable de recaudar y distribuir el zakat, siempre que se satisfagan las necesidades inmediatas y urgentes de los beneficiarios y existan suficientes salvaguardias contra las pérdidas."
