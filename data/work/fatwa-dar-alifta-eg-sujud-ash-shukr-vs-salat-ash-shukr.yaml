label: { ar: "الفرق بين سجود الشكر وصلاة الشكر", en: "The difference between the prostration of thanks and the prayer of thanks", ur: "سجدۂ شکر اور نمازِ شکر میں فرق", es: "La diferencia entre la postración de acción de gracias y la oración de acción de gracias", fr: "La différence entre la prosternation de remerciement et la prière de remerciement" }
summary:
  ar: "سائل سأل عن الفرق بين سجود الشكر وصلاة الشكر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21663)⁩ أن سجود الشكر سجدة واحدة يؤديها المسلم عند حصول نعمة له أو بأحد المسلمين أو عند اندفاع نقمة وبيّن الجواب صلاة الشكر على وجهه."
  en: "A questioner asked the difference between the prostration of thanks and the prayer of thanks. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21663) answered that the prostration of thanks is a single prostration performed when a blessing arrives for oneself or another Muslim or a calamity is averted, and the answer sets out the prayer of thanks."
  ur: "ایک سائل نے سجدۂ شکر اور نمازِ شکر میں فرق پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21663)⁩ نے جواب دیا کہ سجدۂ شکر ایک سجدہ ہے جو نعمت ملنے یا مصیبت ٹلنے پر کیا جاتا ہے؛ نمازِ شکر کی تفصیل جواب میں بیان ہوئی۔"
  es: "Un interlocutor preguntó por la diferencia entre la postración de agradecimiento y la oración de agradecimiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21663) respondió que la postración de agradecimiento es una sola postración que se realiza cuando se recibe una bendición para uno mismo o para otro musulmán, o cuando se evita una calamidad, y la respuesta expone la oración de agradecimiento."
  fr: "Un internaute a demandé la différence entre la prosternation de remerciement et la prière de remerciement. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21663) a répondu que la prosternation de remerciement est une prosternation unique effectuée lorsqu'une bénédiction est accordée à soi-même ou à un autre musulman, ou lorsqu'un malheur est évité, et que la réponse expose la prière de remerciement."
