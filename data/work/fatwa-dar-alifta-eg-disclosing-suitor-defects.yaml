id: work/fatwa-dar-alifta-eg-disclosing-suitor-defects
class: work
kind: fatwa
label: { ar: "حكم الإخبار بما في الخاطب من عيوب", en: "Telling of a suitor's faults", ur: "رشتہ مانگنے والے کی خامیوں کا بتانا", es: "Revelar los defectos de un pretendiente", fr: "Révéler les défauts d'un prétendant", tr: "Muhatapın kusurlar hakkında bilgilendirilmesine ilişkin karar", id: "Putusan tentang pemberitahuan kepada penerima tentang cacat tersebut" }
summary:
  ar: "سائل سأل عمن استُشير في شأن شاب تقدم لخطبة ابنة جاره وهو يعلم عنه صفات غير حسنة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22034)⁩ ببيان حكم إخبار المستشير بما يعلم من عيوب الخاطب وأنه من النصيحة لا من الغيبة على ما فصّل الجواب."
  en: "A questioner asked about a man consulted regarding a youth who proposed to his neighbour's daughter while knowing for certain some bad traits in him. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22034) answered by setting out the ruling on telling the consulter what he knows of the suitor's faults — it is sincere advice, not backbiting, as the answer details."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جس سے پڑوسی کی بیٹی کے لیے رشتہ مانگنے والے نوجوان کے باب میں مشورہ لیا گیا اور وہ اس میں بعض بری صفات یقیناً جانتا تھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22034)⁩ نے جواب دیا کہ مشورہ دینے والے کو خامیوں کا بتانا خیرخواہی ہے نہ کہ غیبت — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un hombre al que se consultó acerca de un joven que le propuso matrimonio a la hija de su vecino, a sabiendas de que tenía ciertos defectos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22034) respondió exponiendo la norma sobre informar al consultante de lo que sabe acerca de los defectos del pretendiente; se trata de un consejo sincero, no de una calumnia, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un homme consulté au sujet d'un jeune homme qui avait demandé la main de la fille de son voisin, alors qu'il connaissait certains défauts chez ce dernier. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22034) a répondu en énonçant la règle selon laquelle il est conseillé, au consultant, de révéler au prétendant ce que l'on sait de ses défauts: il s'agit d'un conseil sincère, et non de médisance, comme le précise la réponse."
  tr: "Bir soru soran, kötü niyetlerini bildiği halde komşusunun kızına evlenme teklif eden genç bir adam hakkında kime danışıldığı sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22034), talibin kusurlarını danışmana bildirme kararını netleştirerek, bunun cevapta ayrıntılı olarak belirtildiği gibi bir tavsiye olduğunu, arkadan iğrenmek olmadığını belirtti."
  id: "Seorang penanya bertanya tentang siapa yang diajak bicara mengenai seorang pemuda yang melamar putri tetangganya sementara dia mengetahui sifat-sifat buruknya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22034) menjawab dengan memperjelas putusan tentang pemberitahuan kepada konsultatif tentang kesalahan pelamar, menyatakan bahwa itu adalah nasihat, bukan fitnah, seperti yang dijelaskan dalam jawaban."
