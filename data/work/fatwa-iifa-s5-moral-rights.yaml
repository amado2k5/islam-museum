label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الحقوق المعنوية", en: "IIFA resolution on moral (intangible) rights", ur: "اکیڈمی کی قرارداد: معنوی حقوق", es: "Resolución de la IIFA sobre derechos morales (intangibles)", fr: "Résolution de l'IIFA sur les droits moraux (immatériels)", tr: "Uluslararası İslami Fiqh Akademisi'nin ahlaki haklara ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai hak moral" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: الاسم التجاري والعنوان التجاري والعلامة التجارية والتأليف والاختراع أو الابتكار حقوق خاصة لأصحابها أصبح لها في العرف المعاصر قيمة مالية معتبرة وهي معتد بها شرعًا فلا يجوز الاعتداء عليها، ويجوز التصرف فيها أو الترخيص بها على ما فصّل القرار."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on intangible rights: trade name, trade address, trademark, authorship and invention or innovation are special rights of their holders that carry recognised financial value in contemporary custom, are acknowledged in the sharia, and may not be infringed; they may be disposed of or licensed as the resolution details."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: تجارتی نام، ٹریڈ مارک، تصنیف و ایجاد کے حقوق شرعی اعتبار رکھتے ہیں؛ ان پر تجاوز حرام، فروخت و لائسنس جائز۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre derechos intangibles: el nombre comercial, la dirección comercial, la marca registrada, la autoría y la invención o innovación son derechos especiales de sus titulares que tienen un valor financiero reconocido en la costumbre contemporánea, están reconocidos en la sharia y no pueden ser infringidos; pueden ser enajenados o licenciados según se detalla en la resolución."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988) sur les droits incorporels: le nom commercial, l'adresse commerciale, la marque de commerce, la paternité et l'invention ou l'innovation sont des droits spéciaux de leurs détenteurs qui ont une valeur financière reconnue dans la coutume contemporaine, sont reconnus dans la charia et ne peuvent être enfreints; ils peuvent être cédés ou concédés sous licence comme le précise la résolution."
  tr: "Uluslararası İslami Fiqh Akademisi'nin beşinci oturumunda (Kuveyt, Aralık 1988): Ticari isimler, ticari unvanlar, ticari markalar, yazarlıklar, buluşlar veya buluşlar, sahipleri için çağdaş gelenekte önemli mali değere sahip, İslam hukuku tarafından tanınan ve ihlal edilemez özel haklara sahiptir. Kararda belirtildiği gibi elden çıkarılabilir veya lisanslanabilirler."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kelimanya (Kuwait, Desember 1988): Nama dagang, hak dagang, merek dagang, kepengarangan, penemuan, atau penemuan memiliki hak khusus bagi pemiliknya yang memiliki nilai finansial signifikan dalam kebiasaan kontemporer, diakui oleh hukum Islam, dan tidak boleh dilanggar. Nama tersebut dapat dijual atau dilisensikan sebagaimana dirinci dalam keputusan."
