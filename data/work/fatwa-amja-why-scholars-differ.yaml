label: { ar: "حكمة اختلاف الفقهاء", en: "Why the jurists differ — God's wisdom in the texts", ur: "فقہاء کا اختلاف — اللہ کی حکمت", es: "¿Por qué difieren los juristas? — La sabiduría de Dios en los textos", fr: "Pourquoi les juristes divergent-ils ? — La sagesse divine dans les textes", tr: "Hukukçular arasındaki farklılıkların ardındaki bilgelik", id: "Kebijaksanaan di balik perbedaan di antara para ahli hukum" }
summary:
  ar: "سأل سائل عن سر اختلاف الفقهاء والمحدثين في المسائل. أجاب د. وليد بسيوني ⁦(فتوى رقم 21826 بتاريخ 11 أبريل 2005)⁩ أن اختلافهم في كثير من المسائل العلمية أو العملية له أسباب علمية وحكم علية اقتضته، ولو شاء الله أن يجعل جميع نصوص الوحيين على نحو لا يحتملان في الفهم إلا وجهًا واحدًا ما أعجزه ذلك، لكنه برحمته وحكمته جعل منها ما هو محكم قطعي يمثل المشترك الإيماني العام بين أهل القبلة وجعل منها ما يحتمل الاجتهاد ليتسع على الأمة وتتدرب عقولها وتحصل الثواب على اجتهادها."
  en: "A questioner asked for the reason jurists and hadith-scholars differ on questions. Dr. Walid Basyouni (fatwa no. 21826, 11 April 2005) answered that their disagreement in many scholarly and practical matters has causes and wise purposes — had God willed, He could have made all the two revelations' texts admit but one reading; but in His mercy and wisdom He made some decisive and certain, representing the common faith-ground of the qibla-people, and some open to ijtihad, giving the ummah room, training its minds, and rewarding its effort."
  ur: "ایک سائل نے علماء کے اختلاف کی حکمت پوچھی۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21826، 11 اپریل 2005)⁩ کے مطابق اللہ نے بعض نصوص قطعی رکھیے ہیں اور بعض اجتہاد پذیر — تاکہ امت کو وسعت ذہن کی تربیت اور اجتہاد کا ثواب ملے۔"
  es: "Un interlocutor preguntó por qué los juristas y los eruditos del hadiz discrepan en ciertas cuestiones. El Dr. Walid Basyouni (fatwa n.º 21826, 11 de abril de 2005) respondió que su desacuerdo en muchos asuntos académicos y prácticos tiene causas y propósitos sabios: si Dios hubiera querido, podría haber hecho que los textos de ambas revelaciones admitieran una sola lectura; pero en su misericordia y sabiduría, hizo que algunos fueran decisivos y ciertos, representando el fundamento común de la fe de la gente de la qibla, y otros abiertos al ijtihad, dando margen a la ummah, educando sus mentes y recompensando su esfuerzo."
  fr: "Un internaute a demandé pourquoi les juristes et les spécialistes du hadith divergent sur certaines questions. Le Dr Walid Basyouni (fatwa n° 21826, 11 avril 2005) a répondu que leurs désaccords sur de nombreux points, tant savants que pratiques, ont des causes et des desseins judicieux: si Dieu l’avait voulu, Il aurait pu limiter les textes des deux révélations à une seule interprétation; mais, dans Sa miséricorde et Sa sagesse, Il en a établi certains, définitifs et incontestables, représentant le fondement de la foi commune des croyants qui s’orientent vers la qibla, et d’autres ouverts à l’ijtihad, laissant ainsi à la communauté musulmane la liberté d’interpréter, guidant son esprit et récompensant ses efforts."
  tr: "Bir soruya hukukçular ile hadis âlimleri arasındaki farklılıkların nedeni soruldu. Dr. Walid Basyouni (Fetva No. 21826, 11 Nisan 2005), birçok bilimsel veya pratik konudaki farklılıklarının bilimsel nedenler ve yüceltme yargısı olduğunu ve bunu zorunlu kıldığını yanıtladı. Eğer Allah, iki vahyin tüm metinlerini sadece bir yönü anlamasının imkansız olmasını isteseydi, bu onun için imkansız olurdu. Ama merhameti ve hikmetiyle, onları kıble halkı arasında genel ortak inancı temsil eden açık ve kesin hale getirdi ve bunları ijtihadın ulusu genişletmesine, zihnini eğitmesine ve ijtihadının ödülünü kazanmasına olanak tanıyan bir şey haline getirdi."
  id: "Seorang penanya ditanya tentang alasan di balik perbedaan antara ahli hukum dan ulama hadis dalam isu-isu. Dr. Walid Basyouni (Fatwa No. 21826 tanggal 11 April 2005) menjawab bahwa perbedaan mereka dalam banyak isu ilmiah atau praktis memiliki alasan ilmiah dan penilaian kemuliaan yang menuntutnya. Jika Allah menghendaki semua teks dari dua wahyu sehingga hanya memahami satu aspek saja tidak mungkin baginya, maka hal itu tidak mungkin baginya. Namun dengan rahmat dan kebijaksanaan-Nya, Dia membuatnya jelas dan definitif yang mewakili iman umum di antara umat qibla, dan menjadikannya sesuatu yang memungkinkan ijtihad memperluas bangsa, melatih pikirannya, dan mendapatkan ganjaran atas ijtihad-nya."
