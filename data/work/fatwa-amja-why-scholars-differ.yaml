id: work/fatwa-amja-why-scholars-differ
class: work
kind: fatwa
label: { ar: "حكمة اختلاف الفقهاء", en: "Why the jurists differ — God's wisdom in the texts", ur: "فقہاء کا اختلاف — اللہ کی حکمت" }
summary:
  ar: "سأل سائل عن سر اختلاف الفقهاء والمحدثين في المسائل. أجاب د. وليد بسيوني ⁦(فتوى رقم 21826 بتاريخ 11 أبريل 2005)⁩ أن اختلافهم في كثير من المسائل العلمية أو العملية له أسباب علمية وحكم علية اقتضته، ولو شاء الله أن يجعل جميع نصوص الوحيين على نحو لا يحتملان في الفهم إلا وجهًا واحدًا ما أعجزه ذلك، لكنه برحمته وحكمته جعل منها ما هو محكم قطعي يمثل المشترك الإيماني العام بين أهل القبلة وجعل منها ما يحتمل الاجتهاد ليتسع على الأمة وتتدرب عقولها وتحصل الثواب على اجتهادها."
  en: "A questioner asked for the reason jurists and hadith-scholars differ on questions. Dr. Walid Basyouni (fatwa no. 21826, 11 April 2005) answered that their disagreement in many scholarly and practical matters has causes and wise purposes — had God willed, He could have made all the two revelations' texts admit but one reading; but in His mercy and wisdom He made some decisive and certain, representing the common faith-ground of the qibla-people, and some open to ijtihad, giving the ummah room, training its minds, and rewarding its effort."
  ur: "ایک سائل نے علماء کے اختلاف کی حکمت پوچھی۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21826، 11 اپریل 2005)⁩ کے مطابق اللہ نے بعض نصوص قطعی رکھیے ہیں اور بعض اجتہاد پذیر — تاکہ امت کو وسعت ذہن کی تربیت اور اجتہاد کا ثواب ملے۔"
