id: work/fatwa-amja-vows-in-affliction
class: work
kind: fatwa
label: { ar: "النذور التي تقال عند البلاء", en: "Vows uttered during afflictions", ur: "مصیبت کے وقت کی گئی نذریں", es: "Votos pronunciados durante las aflicciones" }
summary:
  ar: "سأل سائل يتكرر معه أن يقع في ابتلاء فيدعو الله إن خلصه ليفعلن كذا وينوي الفعل حقًا ثم لا يفعل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86169 بتاريخ 18 ديسمبر 2011)⁩ أن من نذر أن يطيع الله فليطعه ومن نذر أن يعصيه فلا يعصه، ونذره من جنس نذر المجازاة وهو مكروه فالنذر لا يأتي بخير ولكنه يستخرج به من البخيل، لكن ما دام موضوعه طاعة فيلزمه الوفاء به، ومن عجز عن الوفاء بنذره تحلل منه بكفارة يمين، ونصحه بالوفاء بنذوره وتقديرها بما يغلب على ظنه وأن يخرج كفارة يمين احتياطًا لما فاته منها وأن يكف عن مثل هذه النذور مستقبلًا."
  en: "A questioner who keeps promising God certain acts if He delivers him from affliction — sincerely meaning them, then not doing them — asked about it. Dr. Salah al-Sawi (fatwa no. 86169, 18 December 2011) answered that whoever vows to obey God should obey Him and whoever vows to disobey Him should not disobey; his is a conditional vow, which is disliked — a vow brings nothing but draws something out of the miser — yet since its object is obedience it must be fulfilled; whoever cannot fulfil his vow is released by an oath's expiation. He advised fulfilling his vows, gauging them by his best judgment, paying an oath-expiation out of caution for what lapsed, and leaving off such vows in future. Recorded as AMJA's answer."
  ur: "ایک سائل مصیبت میں اللہ سے عہد کرتا ہے پھر پورا نہیں کرتا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86169، 18 دسمبر 2011)⁩ کے مطابق یہ مشروط نذر مکروہ ہے مگر طاعت کی نذر وفا کے قابل ہے؛ عاجز قسم کا کفارہ دے اور آئندہ ایسی نذریں نہ کرے۔"
  es: "Un consultante que prometía a Dios ciertas acciones si lo libraba de la aflicción —con sinceridad, pero sin cumplirlas— preguntó al respecto. El Dr. Salah al-Sawi (fatwa n.° 86169, 18 de diciembre de 2011) respondió que quien jura obedecer a Dios debe obedecerle y quien jura desobedecerle no debe desobedecerle; el suyo es un voto condicional, lo cual es reprobable —un voto no trae nada, pero sí algo del avaro—, sin embargo, dado que su objeto es la obediencia, debe cumplirse; quien no puede cumplir su voto queda liberado mediante la expiación del juramento. Aconsejó cumplir los votos, evaluarlos según el propio criterio, pagar la expiación del juramento por precaución ante lo incumplido y abstenerse de hacer tales votos en el futuro. Registrado como respuesta de AMJA."
