label: { ar: "قرار مجمع الفقه الإسلامي الدولي 221 (23/5) بشأن الإجراءات الفكرية والعملية لمواجهة الغلو والتطرف وما يسمى بالإرهاب في هذه الأيام في شتى الميادين والمجالات", en: "IIFA resolution 221 (23/5) on intellectual and practical measures to confront excess, extremism and what is called terrorism in these days in every field", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 221 (23/5): ہر میدان میں غلو، انتہا پسندی اور نام نہاد دہشت گردی کا مقابلہ کرنے کے فکری و عملی اقدامات", es: "Resolución 221 (23/5) de la IIFA sobre medidas intelectuales y prácticas para hacer frente a los excesos, el extremismo y lo que se denomina terrorismo en la actualidad en todos los ámbitos.", fr: "Résolution 221 (23/5) de l'IIFA relative aux mesures intellectuelles et pratiques à prendre pour lutter contre les excès, l'extrémisme et ce que l'on appelle aujourd'hui le terrorisme dans tous les domaines.", tr: "Uluslararası İslami Fiqh Akademisi Kararı 221 (23/5) günümüzde aşırılık, aşırılık ve sözde terörizmle mücadelede entelektüel ve pratik önlemler hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 221 (23/5) mengenai langkah-langkah intelektual dan praktis untuk menghadapi ekstremisme, ekstremisme, dan apa yang disebut terorisme saat ini di berbagai bidang dan bidang" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩. قرر المجمع أن التطرف بجميع أشكاله وأنواعه حرام بنصوص الكتاب والسنة، وتزداد الحرمة إذا أدى بصاحبه إلى الاعتداء على الأنفس والأعراض والأموال والعقول والأديان. وأصدر ثلاث عشرة توصية منها: النهوض بالخطاب الديني في المساجد مضمونًا وأسلوبًا وربطه بالواقع المعاش؛ رفع المستوى المعيشي والوظيفي للإمام والمؤذن وعقد دورات تأهيلية للعاملين في المساجد؛ إنشاء مراكز للقرآن في كل دولة بإشراف مختصين بأحدث الوسائل التعليمية لمواجهة الفكر المتطرف؛ اختيار مفتين أكفاء وتعيينهم في مدن وأقاليم الدول، واعتماد الإفتاء الجماعي في النوازل إحياءً لفقه الاجتهاد الجماعي، وتشريعات تمنع غير المؤهلين من الإفتاء بعقوبات رادعة؛ تحديث المساقات الدراسية باتجاه ثقافة احترام حقوق الإنسان ونبذ العنف والتطرف والإلحاد والاعتراف بحق الآخر في الاختلاف؛ بناء المناهج بما يوافق عقيدة الأمة وثوابتها جامعًا بين الأصالة والمعاصرة ومراجعة ما فيها من مضامين مغلوطة عن الإسلام؛ دعوة المؤسسات الإعلامية إلى خطاب الوسطية والاعتدال والاعتماد على الحقائق؛ تصحيح المفاهيم المغلوطة لمصطلحات شرعية كالجهاد والخلافة والولاء والبراء والحاكمية التي يستغل بها الشباب للصراعات؛ إدراج مساقات تنبذ العنف والجريمة والتعصب وتعزز الوعي بحرمة الاعتداء على الدماء والأموال والأعراض؛ برنامج ثقافي شامل ترعاه مؤسسات الدولة لتصحيح النظرة إلى الإسلام وترسيخ الثوابت؛ سياسة تعليمية تعزز التسامح والمواطنة والتفكير الناقد واحترام الرأي الآخر؛ الاستفادة من التجارب الناجحة في مواجهة التطرف؛ وفتح الحوار مع ذوي الفكر المتطرف لدحض شبهاتهم وإعادتهم إلى الحياة الاجتماعية الوسطية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018). It ruled that extremism in all its forms and kinds is forbidden by the texts of the Book and the Sunnah, the prohibition growing graver when it leads its adherent to attack lives, honour, property, minds and religions. It issued thirteen recommendations, among them: raising the standard of religious discourse in mosques in content and method, tied to lived reality; improving the living and professional level of imams and muezzins with qualifying courses for mosque workers; establishing Quran centres in every state under distinguished specialists in the readings and Quranic sciences with the latest teaching means against extremist thought; selecting competent muftis for the cities and regions of each state, adopting collective ifta for public new events to revive collective ijtihad, and legislating to bar the unqualified from issuing fatwas with deterrent penalties; updating study courses toward a culture of human-rights respect and rejection of violence, extremism and atheism, recognising the other's right to diversity; building curricula consonant with the community's creed and fundamentals, joining authenticity with contemporaneity and correcting misconceptions about Islam; calling media institutions to adopt the discourse of moderation and rely on facts; correcting the distorted concepts of legal terms such as jihad, the caliphate, loyalty-and-disavowal and sovereignty that the young are exploited with in conflicts; introducing courses rejecting violence, crime and bigotry and strengthening awareness of the sanctity of blood, property and honour; a comprehensive cultural programme sponsored by the state to correct the view of Islam and entrench its fundamentals; an educational policy fostering tolerance, citizenship, critical thinking and respect for the other opinion; benefiting from successful experiences in countering extremism; and opening dialogue with holders of extremist thought to refute their doubts and return them to moderate social life and coexistence."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا کہ ہر شکل کی انتہا پسندی کتاب و سنت کی نصوص سے حرام ہے، اور جب یہ اپنے پیروکار کو جان، عزت، مال، عقل اور مذاہب پر حملے تک پہنچائے تو اس کی حرمت بڑھ جاتی ہے۔ اس نے تیرہ سفارشات جاری کیں جن میں شامل ہیں: مساجد کے دینی خطاب کو مضمون و اسلوب میں بلند کرنا اور اسے زندہ حقیقت سے جوڑنا؛ ائمہ و مؤذنوں کی معاشی و ملازمتی سطح بلند کرنا اور مسجد کے کارکنوں کے لیے تربیتی کورسز؛ ہر ملک میں قرآن کے مراکز کا قیام ماہرینِ قراءات و علومِ قرآن کی نگرانی میں جدید تدریسی ذرائع سے تاکہ انتہا پسند فکر کا مقابلہ ہو؛ ہر ملک کے شہروں اور اضلاع میں اہل مفتیوں کا انتخاب، نوازل میں اجتماعی افتا کو اپنا کر اجتہادِ اجتماعی کے فقہ کی احیاء، اور نااہل افراد کی افتا پر رکاوٹ کے قوانین و باز رکھنے والی سزائیں؛ تعلیمی نصاب کی تازہ کاری انسانی حقوق کے احترام اور تشدد، انتہا پسندی اور الحاد کی نفی اور دوسرے کے اختلاف کے حق کی تسلیم کی طرف؛ منہاج کو امت کے عقیدہ اور ثوابت کے مطابق اصالت و عصریت کے امتزاج سے بنانا اور اسلام کے بارے میں غلط مواد کی اصلاح؛ ذرائع ابلاغ سے وسطیت و اعتدال کے خطاب اور حقائق پر انحصار کی دعوت؛ جہاد، خلافت، ولاء و براء اور حاکمیت جیسی شرعی اصطلاحات کے مسخ شدہ تصورات کی اصلاح جن سے نوجوانوں کو تنازعوں میں استعمال کیا جاتا ہے؛ تشدد، جرم اور تعصب کی نفی کرنے والے اور خون، مال اور عزت کی حرمت کے شعور بڑھانے والے مضامین کا ادراج؛ ریاستی اداروں کے زیرِ اہتمام ایک جامع ثقافتی پروگرام برائے اسلام کی تصویر کی تصحیح اور ثوابت کی ترویج؛ رواداری، شہریت، تنقیدی فکر اور مخالف رائے کے احترام پر مبنی تعلیمی پالیسی؛ انتہا پسندی کے مقابلے کے کامیاب تجربات سے استفادہ؛ اور انتہا پسند فکر رکھنے والوں سے مکالمہ کر کے ان کے شبہات کا رد اور انہیں معتدل سماجی زندگی اور بقائے باہمی کی طرف لوٹانا۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018). Dictaminó que el extremismo en todas sus formas y tipos está prohibido por los textos del Corán y la Sunnah, la prohibición se agrava cuando lleva a su seguidor a atacar vidas, honor, propiedad, mentes y religiones. Emitió trece recomendaciones, entre ellas: elevar el nivel del discurso religioso en las mezquitas en contenido y método, vinculado a la realidad vivida; mejorar el nivel de vida y profesional de los imanes y muecines con cursos de cualificación para los trabajadores de las mezquitas; establecer centros del Corán en cada estado bajo la dirección de distinguidos especialistas en lecturas y ciencias coránicas con los medios de enseñanza más recientes contra el pensamiento extremista; seleccionar muftíes competentes para las ciudades y regiones de cada estado, adoptar ifta colectivo para nuevos eventos públicos para revivir el ijtihad colectivo, y legislar para prohibir que los no cualificados emitan fatwas con sanciones disuasorias; Actualizar los planes de estudio hacia una cultura de respeto a los derechos humanos y rechazo a la violencia, el extremismo y el ateísmo, reconociendo el derecho del otro a la diversidad; elaborar planes de estudio acordes con el credo y los fundamentos de la comunidad, combinando autenticidad con contemporaneidad y corrigiendo ideas erróneas sobre el Islam; instar a los medios de comunicación a adoptar un discurso moderado y basarse en los hechos; corregir los conceptos distorsionados de términos legales como yihad, califato, lealtad y negación, y soberanía, con los que se explota a los jóvenes en los conflictos; introducir cursos que rechacen la violencia, el crimen y la intolerancia, y que fortalezcan la conciencia sobre la santidad de la sangre, la propiedad y el honor; un programa cultural integral patrocinado por el Estado para corregir la visión del Islam y afianzar sus fundamentos; una política educativa que fomente la tolerancia, la ciudadanía, el pensamiento crítico y el respeto por la opinión ajena; aprovechar las experiencias exitosas en la lucha contra el extremismo; y abrir el diálogo con los defensores del pensamiento extremista para refutar sus dudas y reintegrarlos a una vida social moderada y a la coexistencia pacífica."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018). Elle a statué que l'extrémisme, sous toutes ses formes, est interdit par les textes du Coran et de la Sunna, cette interdiction étant d'autant plus grave qu'il conduit ses adeptes à s'en prendre à des personnes, à l'honneur, aux biens, aux esprits et aux religions. Elle a formulé treize recommandations, parmi lesquelles: rehausser le niveau du discours religieux dans les mosquées, tant sur le fond que sur la forme, en l'ancrant dans la réalité vécue; améliorer le niveau de vie et professionnel des imams et des muezzins par des formations qualificatives; créer des centres coraniques dans chaque État, dirigés par des spécialistes reconnus des lectures et des sciences coraniques et dotés des méthodes pédagogiques les plus modernes pour lutter contre la pensée extrémiste; désigner des muftis compétents pour les villes et les régions de chaque État; adopter l'ifta collective pour les événements publics d'actualité afin de raviver l'ijtihad collectif; et légiférer pour interdire aux personnes non qualifiées d'émettre des fatwas, sous peine de sanctions dissuasives. Mettre à jour les programmes d'études afin de promouvoir une culture du respect des droits humains et du rejet de la violence, de l'extrémisme et de l'athéisme, en reconnaissant le droit de chacun à la diversité; élaborer des programmes d'études conformes aux valeurs et aux principes fondamentaux de la communauté, alliant authenticité et modernité et corrigeant les idées fausses sur l'islam; inciter les médias à adopter un discours modéré et à s'appuyer sur les faits; corriger les conceptions déformées de termes juridiques tels que le djihad, le califat, la loyauté et le désaveu, et la souveraineté, dont les jeunes sont instrumentalisés dans les conflits; introduire des cours rejetant la violence, le crime et le sectarisme et renforçant la conscience du caractère sacré du sang, des biens et de l'honneur; un programme culturel complet financé par l'État pour corriger la vision de l'islam et consolider ses fondements; une politique éducative favorisant la tolérance, la citoyenneté, l'esprit critique et le respect des opinions divergentes; tirer profit des expériences réussies de lutte contre l'extrémisme; et instaurer un dialogue avec les tenants de la pensée extrémiste afin de réfuter leurs doutes et de les ramener à une vie sociale modérée et à la coexistence pacifique."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Sefer 1440 H, 28 Ekim – 1 Kasım 2018) toplu kararı. Akademi, aşırıcılığın her biçim ve türüyle Kur'an ve Sünnet metinleri tarafından yasak olduğuna ve failini hayatlara, onura, mülke, zihinlere ve dinlere saldırmaya yönlendirmesi halinde yasakların arttığına karar verdi. On üç öneride bulundu: camilerde dini söylemin içerik ve üslup olarak ilerletilmesi ve yaşanmış gerçeklikle ilişkilendirilmesi; imam ve müezzinlerin yaşam ve istihdam standartlarının yükseltilmesi ve cami çalışanları için yeterlilik kurslarının düzenlenmesi; her ülkede aşırılık yanlısı ideolojiyle mücadele etmek için en son eğitim araçlarını kullanan uzmanlar tarafından denetlenen Kur'an merkezlerinin kurulması; yetkin müftülerin seçilip ülkelerin şehir ve bölgelerinde atanması; kolektif ictihad fıkıhını canlandırmak için güncel konularda kolektif fetvaların kabul edilmesi; niteliksiz kişilerin fetva vermesini caydırıcı cezalarla engellemek; ve müfredatları insan haklarına saygı kültürüne doğru güncellemek Şiddeti, aşırılığı ve ateizmi reddetmek ve başkalarının farklı olma hakkını tanımak; ulusun inancı ve sabitleriyle uyumlu müfredatlar oluşturmak ve özgünlük ile modernliği birleştirmek, İslam hakkında yanıltıcı içeriği gözden geçirmek; medya kurumlarını ılımlılık, denge ve gerçeklere dayanma söylemini benimsemeye çağırmak; gençlerin çatışmalarda kullandığı cihat, halifelik, sadakat, reddetme ve yönetişim gibi dini terimlerin yanlış anlamalarını düzeltmek; şiddeti, suçu ve fanatizmi reddeden ve kan, mülk ve onura yönelik saldırganlığın kutsallığına farkındalık yaratan kurslar dahil; kurumlar tarafından desteklenen kapsamlı bir kültürel program Devlet, İslam görüşünü düzeltmek ve sabitleri pekiştirmek; hoşgörü, vatandaşlık, eleştirel düşünce ve karşıt görüşlere saygıyı teşvik eden bir eğitim politikası; aşırılıkla mücadelede başarılı deneyimlerden faydalanmak; ve aşırı düşünürlerle diyalog başlatmak, şüphelerini çürütmek ve onları ılımlı bir toplumsal yaşama geri döndürmek."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-23 di Madinah (19–23 Safar 1440 H, 28 Oktober – 1 November 2018). Akademi memutuskan bahwa ekstremisme dalam segala bentuk dan jenisnya dilarang oleh teks Al-Qur'an dan Sunnah, dan larangannya meningkat jika menyebabkan pelakunya menyerang nyawa, kehormatan, properti, pikiran, dan agama. Ia mengeluarkan tiga belas rekomendasi, termasuk: memajukan wacana agama di masjid secara isi dan gaya serta mengaitkannya dengan realitas hidup; meningkatkan standar hidup dan pekerjaan imam dan muezzin serta mengadakan kursus kualifikasi bagi pekerja masjid; mendirikan pusat Al-Quran di setiap negara yang diawasi oleh para spesialis yang menggunakan alat pendidikan terbaru untuk menghadapi ideologi ekstremis; memilih mufti yang kompeten dan menunjuk mereka di kota dan wilayah negara; mengadopsi fatwa kolektif tentang isu-isu kontemporer untuk menghidupkan kembali yurisprudensi ijtihad kolektif; legislasi yang mencegah individu yang tidak memenuhi syarat mengeluarkan fatwa dengan sanksi pencegahan; dan memperbarui kurikulum menuju budaya penghormatan hak asasi manusia Menolak kekerasan, ekstremisme, dan ateisme, serta mengakui hak orang lain untuk berbeda; membangun kurikulum yang selaras dengan kepercayaan dan konstanta bangsa yang menggabungkan keaslian dan modernitas serta meninjau konten menyesatkan tentang Islam; menyerukan institusi media untuk mengadopsi wacana moderasi, keseimbangan, dan ketergantungan pada fakta; memperbaiki kesalahpahaman tentang istilah agama seperti jihad, khilafah, loyalitas, penolakan, dan pemerintahan, yang dimanfaatkan oleh kaum muda untuk konflik; termasuk kursus yang menolak kekerasan, kejahatan, dan fanatisme serta meningkatkan kesadaran akan kesucian agresi terhadap darah, properti, dan kehormatan; program budaya komprehensif yang disponsori oleh institusi Negara untuk memperbaiki pandangan Islam dan mengkonsolidasikan konstanta; kebijakan pendidikan yang mendorong toleransi, kewarganegaraan, berpikir kritis, dan menghormati pendapat yang berlawanan; memanfaatkan pengalaman sukses dalam menghadapi ekstremisme; serta membuka dialog dengan pemikir ekstremis untuk membantah keraguan mereka dan mengembalikan mereka ke kehidupan sosial yang moderat."
