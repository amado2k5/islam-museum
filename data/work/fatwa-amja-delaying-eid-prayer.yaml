label: { ar: "تأجيل صلاة العيدين", en: "Delaying the Eid prayers a day or two — refused", ur: "عید نماز میں تاخیر — ممنوع", es: "Retrasar las oraciones del Eid uno o dos días — rechazado", fr: "Retarder les prières de l'Aïd d'un jour ou deux — refusé", tr: "Ramazan Bayramı namazının ertelenmesi", id: "Penundaan salat Idul Fitri" }
summary:
  ar: "سأل سائل عن جواز تأجيل صلاة العيدين يومًا أو يومين. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87601 بتاريخ 17 أكتوبر 2012)⁩ أن كل ما ذكر من مصالح ملغاة لأنها وردت في مقابلة نصوص وإجماع عملي ومن أراد شهود الجمعة يوم العيد فأمامه ذلك إذ المساجد ستقيم الصلاتين العيد والجمعة معًا على ما فصّل الجواب."
  en: "A questioner asked whether the Eid prayers may be delayed a day or two. AMJA's fatwa committee (fatwa no. 87601, 17 October 2012) answered that every benefit mentioned is voided, for it stands against texts and practical consensus; and whoever wishes to attend Jumu'a on Eid day has it before him, since the mosques will hold both prayers together — as the answer details."
  ur: "عید مؤخر؟ لجنة الفتوى ⁦(فتویٰ 87601، 17 اکتوبر 2012)⁩ کے مطابق ذکر کردہ مصالح نصوص و اجماع کے مقابل ملغی ہیں۔"
  es: "Un interlocutor preguntó si las oraciones del Eid podrían retrasarse uno o dos días. El comité de fatuas de AMJA (fatua n.º 87601, 17 de octubre de 2012) respondió que todo beneficio mencionado queda anulado, ya que contraviene los textos y el consenso práctico; y quien desee asistir a la oración del viernes (Jumu'a) el día del Eid tiene la oportunidad de hacerlo, puesto que las mezquitas celebrarán ambas oraciones simultáneamente, como se detalla en la respuesta."
  fr: "Un internaute a demandé si les prières de l'Aïd pouvaient être reportées d'un jour ou deux. Le comité des fatwas de l'AMJA (fatwa n° 87601, 17 octobre 2012) a répondu que tout avantage mentionné est nul, car cela contrevient aux textes et au consensus pratique; et que quiconque souhaite assister à la prière du vendredi (Jumu'a) le jour de l'Aïd peut le faire, puisque les mosquées organiseront les deux prières simultanément, comme le précise la réponse."
  tr: "Bir soruya Ramazan Bayramı namazının bir veya iki gün ertelenmesinin uygunluğu soruldu. Amerikan Şeriat Hukukçuları Konseyi'ndeki Fetva Komitesi (17 Ekim 2012 tarihli Fetva No. 87601), tüm bahsedilen çıkarların metinler ve pratik uzlaşma bağlamında sunulduğu için geçersiz olduğunu söyledi. Cuma gününü Eid gününe tanıklık etmek isteyen herkes bunu yapmakta özgürdür; çünkü camiler hem Eid hem de Cuma namazlarını birlikte yapar, bu cevapta detaylandırılmıştır."
  id: "Seorang penanya ditanya tentang kelayakan menunda shalat Idul Fitri selama satu atau dua hari. Komite Fatwa di Dewan Hukum Syariah Amerika (Fatwa No. 87601 tanggal 17 Oktober 2012) menanggapi bahwa semua kepentingan yang disebutkan dibatalkan karena disajikan dalam konteks teks dan konsensus praktis. Siapa pun yang ingin menyaksikan Jumat pada hari Idul Fitri bebas melakukannya, karena masjid akan mengadakan salat Idul Fi dan Jumat bersama-sama, seperti yang dijelaskan dalam jawaban."
