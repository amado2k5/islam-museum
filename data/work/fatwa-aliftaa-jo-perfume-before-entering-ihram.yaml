id: work/fatwa-aliftaa-jo-perfume-before-entering-ihram
class: work
kind: fatwa
label: { ar: "حكم وضع الطيب قبل الإحرام", en: "Applying perfume before entering the state of ihram", ur: "احرام سے پہلے خوشبو لگانے کا حکم", es: "Aplicarse perfume antes de entrar en estado de ihram.", fr: "Appliquer du parfum avant d'entrer en état d'ihram", tr: "İhrama girmeden önce parfüm sürülmesine ilişkin karar", id: "Aturan tentang mengoleskan parfum sebelum memasuki Ihram" }
summary:
  ar: "سؤال عن حكم وضع العطر قبل الإحرام، أجابت فيه دائرة الإفتاء العام الأردنية بأن وضع شيء من الطيب قبل الإحرام لا يضر وإن بقي أثره إلى ما بعده، بل يُسن التطيب للحاج والمعتمر قبل الإحرام، ناقلة عن نووي الجاوي في نهاية الزين (1/212) أن التطيب في البدن قبل الإحرام من سننه للذكر وغيره بعد الغسل بأي طيب كان والأفضل المسك، ولا بأس باستدامة الطيب في البدن بعد الإحرام، إلا أن تلزم المرأة بالإحداد فتزيله، وأن التطيب في الثوب مباح لا مندوب على المعتمد، لكن من نزع ثوبه المطيب ورائحته فيه ثم لبسه لزمته الفدية."
  en: "A question about applying perfume before entering the state of ihram, in which Jordan's General Iftaa Department answered that applying some perfume before ihram does no harm even if its trace lasts afterwards, and that perfuming is in fact a Sunna for the pilgrim before ihram; it quoted Nawawi al-Jawi in Nihayat al-Zayn (1/212) that perfuming the body just before ihram is among its Sunna practices for men and women alike, after the ritual bath, with any perfume, musk being best, and that continuing to carry the perfume on the body after ihram is unobjectionable, except that a woman who becomes bound to mourning after ihram must remove it; perfuming the garment, however, is merely permitted and not recommended on the authoritative view, and one who takes off a perfumed garment while its scent remains and then puts it on again owes a ransom (fidya)."
  ur: "احرام سے پہلے خوشبو لگانے کے حکم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ احرام سے پہلے کچھ خوشبو لگانا نقصان نہیں دیتا چاہے اس کا اثر بعد تک رہے، بلکہ حاجی اور عمرہ کرنے والے کے لیے احرام سے پہلے خوشبو لگانا سنت ہے؛ اس نے نووی جاوی کی نہایۃ الزین (1/212) سے نقل کیا کہ احرام سے کچھ پہلے بدن پر خوشبو لگانا مرد اور عورت دونوں کے لیے اس کی سنتوں میں سے ہے، غسل کے بعد، کسی بھی خوشبو سے، اور مشک بہتر ہے، اور احرام کے بعد بدن پر خوشبو کا باقی رہنا بلا مضائقہ ہے، سوائے اس کے کہ عورت پر احرام کے بعد سوگ لازم ہو جائے تو اسے زائل کرے؛ البتہ کپڑے پر خوشبو لگانا معتمد قول پر محض مباح ہے نہ کہ مستحب، اور جو خوشبو لگا کپڑا اتارے جبکہ اس میں خوشبو باقی ہو اور پھر پہن لے اس پر فدیہ لازم ہے۔"
  es: "Una pregunta sobre la aplicación de perfume antes de entrar en el estado de ihram, en la que el Departamento General de Iftaa de Jordania respondió que aplicarse algo de perfume antes del ihram no causa daño incluso si su rastro perdura después, y que perfumarse es de hecho una Sunna para el peregrino antes del ihram; citó a Nawawi al-Jawi en Nihayat al-Zayn (1/212) que perfumar el cuerpo justo antes del ihram está entre sus prácticas Sunna tanto para hombres como para mujeres, después del baño ritual, con cualquier perfume, siendo el almizcle el mejor, y que continuar llevando el perfume en el cuerpo después del ihram no es objetable, excepto que una mujer que queda obligada a guardar luto después del ihram debe quitárselo; perfumar la vestimenta, sin embargo, solo está permitido y no recomendado según la opinión autorizada, y quien se quita una prenda perfumada mientras su aroma permanece y luego se la vuelve a poner debe un rescate (fidya)."
  fr: "Une question concernant l'application de parfum avant l'entrée en état d'ihram a été posée par le Département général de la jurisprudence islamique de Jordanie. Ce dernier a répondu que l'application d'un peu de parfum avant l'ihram ne présente aucun inconvénient, même si son odeur persiste par la suite, et que se parfumer est en réalité une sunna pour le pèlerin avant l'ihram. Il cite Nawawi al-Jawi dans Nihayat al-Zayn (1/212) selon lequel se parfumer le corps juste avant l'ihram fait partie des pratiques sunna pour les hommes et les femmes, après le bain rituel, avec n'importe quel parfum, le musc étant préférable. Il est permis de conserver le parfum sur le corps après l'ihram, sauf pour une femme qui doit observer le deuil après l'ihram et qui doit alors l'enlever. En revanche, parfumer le vêtement est seulement permis et non recommandé selon l'avis faisant autorité, et celui qui retire un vêtement parfumé alors que son parfum persiste puis le remet doit payer une rançon (fidya)."
  tr: "İhram öncesi parfüm sürülmesine ilişkin bir hükmü Ürdün Genel Fetva Müdürlüğü yanıtlamıştır; İhram öncesi parfüm sürmenin zararı yoktur, etkisi sonrasında da sürse bile. Bunun yerine, hacı ve umre uygulayıcısına İhram öncesi parfüm sürülmesi tavsiye edilir. Nihayat al-Zain'de (1/212) Nawawi Al-Cavi'nin alıntısıyla, İhram öncesi vücuda sürmenin anma için ve husldan sonra sürtülmesi sünnettir ve herhangi bir parfüm tercih edilir. İhram sonrası bedende parfüm sürmek tercih edilir, kadın iddad etmek ve çıkarmak zorunda değilse. Parfümün giysilere sürülmesi caizdir ve güvenilen kişi tarafından önerilmez. Ancak, parfümlü giysisini çıkarıp koklayan ve sonra giyen kişi fidya ödemelidir."
  id: "Pertanyaan tentang aturan penggunaan parfum sebelum Ihram dijawab oleh Departemen Fatwa Umum Yordania bahwa mengaplikasikan sesuatu yang beraroma sebelum Ihram tidak merugikan meskipun efeknya bertahan setelahnya. Sebaliknya, disarankan untuk mengoleskan parfum pada peziarah dan pelaku Umrah sebelum Ihram. Surat itu mengutip Nawawi Al-Jawi dalam Nihayat al-Zain (1/212) bahwa mengoleskan parfum pada tubuh sebelum Ihram adalah Sunnah untuk mengenang dan lainnya setelah ghusl, dengan parfum apa pun lebih disukai. Lebih baik menyimpan parfum di tubuh setelah Ihram, kecuali wanita tersebut wajib melakukan ihaddad dan melepasnya. Mengoleskan parfum pada pakaian diperbolehkan dan tidak dianjurkan oleh yang dipercaya. Namun, siapa pun yang melepas pakaian beraroma dan mencium lalu memakainya harus membayar fidya."
