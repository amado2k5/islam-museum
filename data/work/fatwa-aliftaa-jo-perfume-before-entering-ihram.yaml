id: work/fatwa-aliftaa-jo-perfume-before-entering-ihram
class: work
kind: fatwa
label: { ar: "حكم وضع الطيب قبل الإحرام", en: "Applying perfume before entering the state of ihram", ur: "احرام سے پہلے خوشبو لگانے کا حکم" }
summary:
  ar: "سؤال عن حكم وضع العطر قبل الإحرام، أجابت فيه دائرة الإفتاء العام الأردنية بأن وضع شيء من الطيب قبل الإحرام لا يضر وإن بقي أثره إلى ما بعده، بل يُسن التطيب للحاج والمعتمر قبل الإحرام، ناقلة عن نووي الجاوي في نهاية الزين (1/212) أن التطيب في البدن قبل الإحرام من سننه للذكر وغيره بعد الغسل بأي طيب كان والأفضل المسك، ولا بأس باستدامة الطيب في البدن بعد الإحرام، إلا أن تلزم المرأة بالإحداد فتزيله، وأن التطيب في الثوب مباح لا مندوب على المعتمد، لكن من نزع ثوبه المطيب ورائحته فيه ثم لبسه لزمته الفدية."
  en: "A question about applying perfume before entering the state of ihram, in which Jordan's General Iftaa Department answered that applying some perfume before ihram does no harm even if its trace lasts afterwards, and that perfuming is in fact a Sunna for the pilgrim before ihram; it quoted Nawawi al-Jawi in Nihayat al-Zayn (1/212) that perfuming the body just before ihram is among its Sunna practices for men and women alike, after the ritual bath, with any perfume, musk being best, and that continuing to carry the perfume on the body after ihram is unobjectionable, except that a woman who becomes bound to mourning after ihram must remove it; perfuming the garment, however, is merely permitted and not recommended on the authoritative view, and one who takes off a perfumed garment while its scent remains and then puts it on again owes a ransom (fidya)."
  ur: "احرام سے پہلے خوشبو لگانے کے حکم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ احرام سے پہلے کچھ خوشبو لگانا نقصان نہیں دیتا چاہے اس کا اثر بعد تک رہے، بلکہ حاجی اور عمرہ کرنے والے کے لیے احرام سے پہلے خوشبو لگانا سنت ہے؛ اس نے نووی جاوی کی نہایۃ الزین (1/212) سے نقل کیا کہ احرام سے کچھ پہلے بدن پر خوشبو لگانا مرد اور عورت دونوں کے لیے اس کی سنتوں میں سے ہے، غسل کے بعد، کسی بھی خوشبو سے، اور مشک بہتر ہے، اور احرام کے بعد بدن پر خوشبو کا باقی رہنا بلا مضائقہ ہے، سوائے اس کے کہ عورت پر احرام کے بعد سوگ لازم ہو جائے تو اسے زائل کرے؛ البتہ کپڑے پر خوشبو لگانا معتمد قول پر محض مباح ہے نہ کہ مستحب، اور جو خوشبو لگا کپڑا اتارے جبکہ اس میں خوشبو باقی ہو اور پھر پہن لے اس پر فدیہ لازم ہے۔"
