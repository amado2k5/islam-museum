id: work/fatwa-dar-alifta-eg-praying-with-anomalous-readings
class: work
kind: fatwa
label: { ar: "حكم الصلاة بالقراءات الشاذة", en: "Praying with the anomalous readings", ur: "شاذ قراءتوں سے نماز پڑھنے کا حکم", es: "Orar con las lecturas anómalas" }
summary:
  ar: "سائل سأل عن الصلاة بالقراءات الشاذة المخالفة للرسم العثماني. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21954)⁩ أن الصلاة بالقراءات الشاذة عمدًا يبطلها لفقدان القراءة أحد أركانها ولكونها مخالفة للمصحف الذي أجمعت عليه الأمة على ما فصّل الجواب."
  en: "A questioner asked about praying with the anomalous (shadh) readings that diverge from the Uthmanic rasm. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21954) answered that deliberately praying with anomalous readings invalidates the prayer — recitation loses one of its pillars and departs from the mushaf the community agreed upon — as the answer details."
  ur: "ایک سائل نے عثمانی رسم سے ہٹ کر شاذ قراءتوں سے نماز پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21954)⁩ نے جواب دیا کہ دانستہ شاذ قراءتوں سے نماز پڑھنا اسے باطل کر دیتا ہے کیونکہ قراءت کا ایک رکن فوت ہوتا اور وہ اُس مصحف سے ہٹتی ہے جس پر امت متفق ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de rezar con las lecturas anómalas (shadh) que divergen del rasm utmánico. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21954) respondió que rezar deliberadamente con lecturas anómalas invalida la oración: la recitación pierde uno de sus pilares y se aparta del mushaf acordado por la comunidad, como se detalla en la respuesta."
