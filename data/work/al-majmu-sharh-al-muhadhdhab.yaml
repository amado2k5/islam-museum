label:
  ar: "المجموع شرح المهذب"
  en: "al-Majmu' Sharh al-Muhadhdhab"
  ur: "المجموع شرح المہذب"
summary:
  ar: "شرح يحيى بن شرف النووي (ت 676هـ) على «المهذب» لأبي إسحاق الشيرازي في الفقه الشافعي. يشرح عبارة المصنف، ويحرر المذهب وأوجه الأصحاب، ثم يعقد فروعاً بعنوان «في مذاهب العلماء» يذكر فيها أقوال الصحابة والتابعين وأئمة المذاهب مع أدلتهم وجوابه عنها. ولم يتمّه النووي، وفي الطبعة التي في المتحف «تكملة» في أجزاء يكتبها محمد نجيب المطيعي الذي صحّح الكتاب «وأكمله بعد نقصان». {cite:majmu-irshad-v8 p.5} {cite:majmu-irshad-v8 p.27} {cite:majmu-irshad-v8 p.108}"
  en: "The commentary of Yahya ibn Sharaf al-Nawawi (d. 676 AH) on Abu Ishaq al-Shirazi's al-Muhadhdhab in Shafi'i law. It explains the author's text, establishes the school's doctrine and the views of its masters, and then gives sections headed 'on the views of the scholars' setting out the positions of Companions, Successors and the founders of the schools with their evidence and al-Nawawi's replies. Al-Nawawi did not finish it; the edition the museum holds has a multi-volume 'Takmila' (completion) by Muhammad Najib al-Muti'i, who corrected the book 'and completed it after it had been incomplete'."
  ur: "یحییٰ بن شرف نووی (وفات 676ھ) کی ابو اسحاق شیرازی کی «المہذب» پر شافعی فقہ میں شرح۔ یہ مصنف کی عبارت کی شرح کرتی ہے، مذہب اور اصحاب کی وجوہ کی تحریر کرتی ہے، پھر «فی مذاہب العلماء» کے عنوان سے فروع قائم کرتی ہے جن میں صحابہ، تابعین اور ائمہ مذاہب کے اقوال دلائل کے ساتھ اور نووی کا ان پر جواب ذکر ہوتا ہے۔ نووی اسے مکمل نہ کر سکے؛ میوزیم کے پاس موجود ایڈیشن میں کئی جلدوں پر مشتمل «تکملہ» ہے جو محمد نجیب المطیعی کا ہے، جنہوں نے کتاب کی تصحیح کی «اور ناقص رہنے کے بعد اسے مکمل کیا»۔"
