label: { ar: "حكم صيام من تنزف طيلة شهر رمضان بورم في الرحم", en: "The fast of a woman bleeding all Ramadan from a uterine tumour", ur: "رحم کی ورم کی وجہ سے سارا رمضان خون آنے والی عورت کا روزہ" }
summary:
  ar: "سائلة أصابها ورم في الرحم فهي تنزف طيلة شهر رمضان فسألت عن صومها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21753)⁩ أن المرأة التي تنزف طوال الشهر يرجع في أمرها إلى الطبيب المتخصص فإن أخبر أن الدم دم حيض فإن كان يماثل عادتها في القدر والزمان فلها حكمها على ما فصّل الجواب."
  en: "A woman with a uterine tumour bleeding through the whole of Ramadan asked about her fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21753) answered that her case is referred to the specialist: if the blood is declared menses matching her habit in amount and time it has one ruling, otherwise another — as the answer details."
  ur: "رحم کی ورم والی عورت کو سارا رمضان خون آتا ہے؛ اس نے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21753)⁩ نے جواب دیا کہ ایسے معاملے میں ماہر ڈاکٹر کی رائے لی جائے؛ اگر خون حیض قرار پائے اور عادت کے مطابق ہو تو ایک حکم، ورنہ دوسرا — جیسا کہ جواب میں تفصیل ہے۔"
