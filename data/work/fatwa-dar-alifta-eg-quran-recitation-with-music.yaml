id: work/fatwa-dar-alifta-eg-quran-recitation-with-music
class: work
kind: fatwa
label: { ar: "حكم قراءة القرآن مصحوبًا بموسيقى", en: "Reciting the Quran accompanied by music", ur: "موسیقی کے ساتھ قرآن پڑھنا", es: "Recitar el Corán acompañado de música", fr: "Réciter le Coran accompagné de musique", tr: "Kur'an'ın müzikle birlikte okunmasına ilişkin karar", id: "Aturan tentang membaca Al-Qur'an yang diiringi musik" }
summary:
  ar: "سائل سأل عن عمل مقاطع لآيات من القرآن الكريم مصحوبة بأنواع الموسيقى أو الاستماع إليها أو الترويج لها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21581)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about making clips of Quranic verses accompanied by kinds of music, listening to them or promoting them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21581) answered by setting out the ruling."
  ur: "ایک سائل نے قرآنی آیات کے ایسے کلپس بنانے جن کے ساتھ موسیقی ہو، سننے یا پھیلانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21581)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un interlocutor preguntó sobre la posibilidad de crear vídeos con versículos coránicos acompañados de música, escucharlos o promocionarlos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21581) respondió exponiendo la normativa."
  fr: "Un internaute a posé une question concernant la création de clips vidéo de versets coraniques accompagnés de musique, leur écoute ou leur diffusion. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21581) a répondu en énonçant la règle."
  tr: "Bir soru soran kişi, Kur'an-ı Kerim'den ayetlerin çeşitli müzik türleri eşliğinde alıntılar yapmak, dinlemek veya tanıtmak hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21581) bu konudaki kararı kendi tarzında açıklayarak yanıt verdi."
  id: "Seorang penanya menanyakan tentang membuat kutipan ayat-ayat dari Al-Qur'an yang disertai berbagai jenis musik, mendengarkannya, atau mempromosikannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21581) menanggapi dengan memperjelas keputusan ini dengan caranya sendiri."
