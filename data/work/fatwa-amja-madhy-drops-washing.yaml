id: work/fatwa-amja-madhy-drops-washing
class: work
kind: fatwa
label: { ar: "نزول قطرات المذي", en: "Years of madhy drops — washing the member and wudu", ur: "مذی کے قطرے — غسل عضو اور وضو", es: "Años de gotas de madhy: lavar el miembro y el wudu", fr: "Des années de gouttes folles — laver le membre et faire les ablutions" }
summary:
  ar: "سأل سائل أنه يعاني منذ سنين من نزول قطرات لزجة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82447 بتاريخ 6 سبتمبر 2010)⁩ أن المذي يوجب غسل الذكر وما أصابه من البدن مع الوضوء فعن علي قال كنت رجلًا مذاء فاستحييت أن أسأل رسول الله لمكان ابنته فأمرت المقداد بن الأسود فسأله فقال يغسل ذكره وأنثييه ويتوضأ رواه أبو داود على ما فصّل الجواب."
  en: "A questioner had suffered for years from viscous drops descending. Dr. Salah al-Sawi (fatwa no. 82447, 6 September 2010) answered that madhy obliges washing the member and whatever of the body it touched, together with wudu — per Ali's 'I was a man of much madhy and shied from asking the Messenger of God for his daughter's sake, so I had al-Miqdad ask him; he said: he washes his member and his anus and does wudu', narrated by Abu Dawud — as the answer details."
  ur: "ایک شخص برسوں سے مذی کے قطرے پاتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82447، 6 ستمبر 2010)⁩ کے مطابق عضو اور متاثرہ بدن دھوئے اور وضو کرے — ابو داود کی حدیث۔"
  es: "Un consultante había sufrido durante años de goteos viscosos. El Dr. Salah al-Sawi (fatwa n.° 82447, 6 de septiembre de 2010) respondió que el madhy obliga a lavar el miembro y cualquier parte del cuerpo que haya tocado, junto con el wudu, según Ali: «Yo era un hombre con mucho madhy y me daba vergüenza preguntarle al Mensajero de Dios por el bien de su hija, así que le pedí a al-Miqdad que le preguntara; él dijo: se lava el miembro y el ano y hace el wudu», narrado por Abu Dawud, como detalla la respuesta."
  fr: "Un homme souffrait depuis des années de pertes vaginales visqueuses. Le Dr Salah al-Sawi (fatwa n° 82447, 6 septembre 2010) a répondu que le madhy (abstinence sexuelle) impose de se laver le membre et toutes les parties du corps avec lesquelles il a été en contact, en plus des ablutions (wudu) – conformément au hadith d'Ali: « J'étais un homme très obsédé par le madhy et j'hésitais à interroger le Messager de Dieu par égard pour sa fille. J'ai donc demandé à al-Miqdad de le faire; il a répondu: il se lave le membre et l'anus et fait ses ablutions », rapporté par Abu Dawud – comme le précise la réponse."
