kind: lecture-series
label:
  ar: "تأملات قرآنية 1 (سلسلة دروس)"
  en: "Ta'ammulat Qur'aniyya 1: Qur'anic reflections (lesson series)"
  ur: "تأملات قرآنیہ 1: قرآنی غور و فکر (دروس کا سلسلہ)"
summary:
  ar: "سلسلة من تسع حلقات تلفزيونية قصيرة ليوسف القرضاوي في أرشيف أسابيل، يتأمل فيها آيات من سور آل عمران والنساء والمائدة والأنعام: أهل الكتاب واصطفاء آدم ونوح، ومريم وزكريا والكرامات، والمرأة والميراث والأسرة، والآيات المبشّرات والاستغفار، والطيبات والأيمان، وسورة الأنعام سورة التوحيد."
  en: "A series of nine short television episodes by Yusuf al-Qaradawi on the Assabile archive, reflecting on verses of Al Imran, al-Nisa', al-Ma'ida and al-An'am: the People of the Book and the choosing of Adam and Noah, Maryam, Zakariyya and marvels, women, inheritance and the family, the verses of good news and asking forgiveness, good things and oaths, and al-An'am as the sura of God's oneness."
  ur: "اسابیل آرکائیو میں یوسف قرضاوی کی نو مختصر ٹیلی وژن اقساط کا سلسلہ، جس میں وہ آل عمران، النساء، المائدہ اور الانعام کی آیات پر غور کرتے ہیں: اہل کتاب اور آدم و نوح کا انتخاب، مریم، زکریا اور کرامات، عورت، میراث اور خاندان، بشارت والی آیات اور استغفار، پاکیزہ چیزیں اور قسمیں، اور توحید کی سورت کے طور پر الانعام۔"
