label: { ar: "كيفية حساب الزكاة لشركة تعمل في التطوير العقاري", en: "Calculating zakat for a real-estate development company", ur: "رئیل اسٹیٹ ڈویلپمنٹ کمپنی کی زکات کا حساب" }
summary:
  ar: "سائل سأل عن حساب زكاة شركة تعمل في التطوير العقاري. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22360)⁩ أن الزكاة تجب في الأموال النقدية والأرصدة البنكية والمواد الخام التي يبقى أثرها في المعمار كالحديد والإسمنت، وبيّن الجواب طريقة الحساب على وجهه."
  en: "A questioner asked how to compute zakat for a company working in real-estate development. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22360) answered that zakat is due on cash funds, bank balances and raw materials whose substance remains in the building — iron, cement and the like; the answer sets out the method of calculation."
  ur: "ایک سائل نے رئیل اسٹیٹ ڈویلپمنٹ کمپنی کی زکات کے حساب کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22360)⁩ نے جواب دیا کہ زکات نقد رقموں، بینک بیلنس اور ان خام مال پر واجب ہے جن کا وجود عمارت میں باقی رہتا ہے جیسے لوہا اور سیمنٹ؛ جواب میں حساب کی تفصیل بیان ہوئی۔"
