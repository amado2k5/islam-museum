label:
  ar: "سيرة رسول الله 2026، الحلقة 19: سيرة رسول الله 19 | المهاجرون إلى الحبشة"
  en: "The Biography of the Messenger of God 2026, episode 19: The emigrants to Abyssinia"
  ur: "سیرتِ رسول اللہ 2026، قسط 19: حبشہ کی طرف ہجرت کرنے والے"
  fr: "La biographie du Messager de Dieu 2026, épisode 19 : Les émigrés en Abyssinie"
  es: "La biografía del Mensajero de Dios 2026, episodio 19: Los emigrados a Abisinia"
summary:
  ar: "تبدأ المحاضرة بترجمة موجزة لحمزة بن عبد المطلب مأخوذة من كتاب مرجعي في أهل بدر، ثم يشرع المحاضر في الهجرة إلى الحبشة: رواية ابن إسحاق، والفوائد التي يستخلصها، وقراءته الخاصة لسبب بقاء المهاجرين هناك حتى خيبر، وأسماء المجموعة الأولى والمجموعة اللاحقة، ومرويات التفسير التي تربط بعض الآيات بالهجرة."
  en: "The lecture opens with a short biography of Hamza ibn Abd al-Muttalib taken from a reference work on the Badr veterans, then begins the emigration to Abyssinia: Ibn Ishaq's account, the lessons the speaker draws, his own reading of why the emigrants stayed away until Khaybar, the names of the first group and of the later group, and tafsir reports that link verses to the emigration."
  ur: "لیکچر کا آغاز بدر کے شرکاء پر ایک حوالہ جاتی کتاب سے لی گئی حمزہ بن عبدالمطلب کی مختصر سوانح سے ہوتا ہے، پھر حبشہ کی ہجرت شروع ہوتی ہے: ابن اسحاق کا بیان، مقرر کے اخذ کردہ اسباق، ان کی اپنی رائے کہ مہاجرین خیبر تک کیوں دور رہے، پہلے اور بعد کے گروہ کے نام، اور تفسیر کی وہ روایات جو بعض آیات کو ہجرت سے جوڑتی ہیں۔"
  fr: "La conférence s'ouvre sur une courte biographie de Hamza ibn Abd al-Muttalib tirée d'un ouvrage de référence sur les vétérans de Badr, puis aborde l'émigration en Abyssinie : le récit d'Ibn Ishaq, les leçons que le conférencier en tire, sa propre lecture des raisons pour lesquelles les émigrés sont restés loin jusqu'à Khaybar, les noms du premier groupe et du groupe suivant, et les rapports d'exégèse qui relient des versets à l'émigration."
  es: "La conferencia comienza con una breve biografía de Hamza ibn Abd al-Muttalib tomada de una obra de referencia sobre los veteranos de Badr y pasa luego a la emigración a Abisinia: el relato de Ibn Ishaq, las lecciones que extrae el conferenciante, su propia lectura de por qué los emigrados permanecieron lejos hasta Jaybar, los nombres del primer grupo y del grupo posterior, y los relatos de exégesis que vinculan versículos con la emigración."
