class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 122 (13/4) بشأن المشاركة المتناقصة في ضوء العقود المستجدة ⁦(مؤجل)⁩", en: "IIFA resolution 122 (13/4) on diminishing partnership in the light of recent contracts ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 122 (13/4): جدید عقود کی روشنی میں گھٹتی ہوئی شراکت ⁦(مؤجل)⁩", es: "Resolución 122 (13/4) de la IIFA sobre la disminución de la participación accionaria a la luz de los contratos recientes (aplazada)", fr: "Résolution 122 (13/4) de l'IIFA sur la diminution du partenariat à la lumière des contrats récents (reportée)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 122 (13/4) yeni sözleşmeler nedeniyle katılımın azalmasına ilişkin (ertelenmiş)", id: "Keputusan Akademi Fiqh Islam Internasional 122 (13/4) mengenai penurunan partisipasi sehubungan dengan kontrak baru (ditunda)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩، بعد اطلاعه على الأبحاث المقدمة بخصوص المشاركة المتناقصة في ضوء العقود المستجدة والمناقشات التي دارت حولها بمشاركة الأعضاء والخبراء. قرر تأجيل النظر في الموضوع لإصدار قراره الخاص إلى دورة قادمة لمزيد من الدراسة والبحث. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا؛ وقد استُوفي الموضوع لاحقًا بقرار 136 ⁦(15/2)⁩ في دورة مسقط."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001), after reviewing the research on diminishing partnership in the light of recently devised contracts and the members' and experts' discussion. It deferred deciding the topic to a later session for further study and research. Recorded as a deferral, not a final ruling; the subject was later settled in resolution 136 (15/2) at the Muscat session."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں، جدید عقود کی روشنی میں گھٹتی ہوئی شراکت پر پیش شدہ تحقیق اور ارکان و ماہرین کی مباحث کے بعد۔ اس نے موضوع کے فیصلے کو مزید تحقیق کے لیے آئندہ مجلس تک مؤجل کیا۔ یہ مؤجل ہے، حتمی حکم نہیں؛ یہ موضوع بعد میں مسقط مجلس میں قرارداد 136 ⁦(15/2)⁩ سے طے ہوا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 13.ª sesión celebrada en Kuwait (del 7 al 12 de Shawwal de 1422, del 22 al 27 de diciembre de 2001), tras revisar la investigación sobre la disminución de la participación accionaria a la luz de los contratos recientemente elaborados y el debate entre los miembros y expertos. Se aplazó la decisión sobre el tema para una sesión posterior con el fin de profundizar en el estudio y la investigación. Si bien se registró como un aplazamiento, no como una resolución definitiva, el asunto se resolvió posteriormente en la resolución 136 (15/2) de la sesión de Mascate."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 13e session au Koweït (7-12 Shawwal 1422, 22-27 décembre 2001), après examen des recherches sur la diminution des partenariats à la lumière des contrats récemment élaborés et des discussions entre les membres et les experts. Elle a reporté la décision sur ce sujet à une session ultérieure pour approfondir l'étude et la recherche. Cette résolution, non définitive, a été consignée comme un report; la question a été tranchée ultérieurement par la résolution 136 (15/2) lors de la session de Mascate."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on üçüncü oturumunda (7–12 Shawwal 1422H, 22–27 Aralık 2001) toplu kararı, son sözleşmeler ve üyeler ile uzmanların katılımıyla yapılan tartışmalar ışığında katılımın azalmasına ilişkin sunulan araştırmaların incelenmesi sonucunda. Konunun değerlendirilmesinin ertelenerek kendi kararının daha ileri bir çalışma ve araştırma için gelecekteki oturuma ertelenmesine karar verildi. Bu karar nihai bir karar değil, erteleme olarak kaydedildi; konu daha sonra Muskat oturumunda 136 (15/2) sayılı Karar ile sonuçlandırıldı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi ketiga belas di Kuwait (7–12 Shawwal 1422H, 22–27 Desember 2001), setelah meninjau penelitian yang diajukan mengenai penurunan partisipasi mengingat kontrak-kontrak terbaru dan diskusi yang dilakukan dengan partisipasi anggota dan ahli. Diputuskan untuk menunda pertimbangan masalah ini guna mengeluarkan keputusan sendiri ke sesi berikutnya untuk studi dan penelitian lebih lanjut. Keputusan tersebut dicatat sebagai penundaan, bukan putusan akhir; masalah ini kemudian diselesaikan oleh Keputusan 136 (15/2) dalam sesi Muscat."
