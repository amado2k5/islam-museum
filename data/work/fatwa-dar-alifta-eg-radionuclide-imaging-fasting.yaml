summary:
  ar: "سائل مريض صائم أجرى الأشعة بابتلاع عقار النوكليدات المشعة سائلًا أو جامدًا فسأل عن صومه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21766)⁩ ببيان حكم وصول هذا العقار المشع إلى الجوف على الصيام على وجهه."
  en: "A fasting patient undergoing imaging by swallowing a radionuclide drug — liquid or solid — asked about his fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21766) answered by setting out how this radioactive agent reaching the inner body affects the fast."
  ur: "روزہ دار مریض نے ریڈیو نیوکلیائیڈ ادویہ — مائع یا جامد — نگل کر امیجنگ کرائی اور روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21766)⁩ نے جواب میں اس مادے کے جسم کے اندر جانے کا روزے پر اثر بیان کیا۔"
