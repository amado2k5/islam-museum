id: work/fatwa-amja-spitting-left-waswasa
class: work
kind: fatwa
label: { ar: "التفل عن اليسار في الصلاة", en: "When the mind strays in prayer — refuge, head-turn, left-spittle", ur: "نماز میں وسوسہ — تعوذ اور بائیں تھوک", es: "Cuando la mente se desvía en la oración: refugio, giro de cabeza, saliva izquierda" }
summary:
  ar: "سأل سائل أنه خلال الصلاة إذا ذهب تفكيرهم لشيء غير الصلاة هل يتفلون عن اليسار. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86021 بتاريخ 30 نوفمبر 2011)⁩ أنه يشرع للمصلي إذا أحس بوسوسة الشيطان له في صلاته أن يتعوذ بالله منه ثم يلتفت برأسه فقط ويتفل عن يساره ثلاثًا لما روى مسلم عن عثمان بن أبي العاص على ما فصّل الجواب."
  en: "A questioner asked whether, when thought strays to other than the prayer, one spits to the left. AMJA's fatwa committee (fatwa no. 86021, 30 November 2011) answered that the worshipper feeling the devil's whispering in his prayer is taught to seek God's refuge, turn only his head and spit to his left three times — for Muslim's hadith of Uthman b. Abi'l-As — as the answer details."
  ur: "نماز میں وسوسہ آئے تو؟ لجنة الفتوى ⁦(فتویٰ 86021، 30 نومبر 2011)⁩ کے مطابق تعوذ، سر گھمانا، بائیں تین بار تھوک — حدیث مسلم۔"
  es: "Un interlocutor preguntó si, cuando los pensamientos se desvían de la oración, se debe escupir hacia la izquierda. El comité de fatuas de AMJA (fatua n.º 86021, 30 de noviembre de 2011) respondió que al devoto que siente las insinuaciones del diablo durante su oración se le enseña a buscar refugio en Dios, girar únicamente la cabeza y escupir tres veces hacia la izquierda, según el hadiz de Uthman b. Abi'l-As de Muslim, como se detalla en la respuesta."
