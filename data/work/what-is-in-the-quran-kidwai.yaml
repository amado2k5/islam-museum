summary:
  ar: "عرض بالإنجليزية البسيطة لمعاني القرآن وضعه عبد الرحيم قدوائي، الأستاذ في جامعة علي كره الإسلامية وصاحب ببليوغرافيات معروفة لترجمات القرآن الإنجليزية، صدر أول مرة سنة 2013، وطبعته الثالثة المنقّحة سنة 2023 عن دار فيفا في نيودلهي؛ يصفه صاحبه بأنه ليس ترجمة بالمعنى الدقيق بل إعادة صياغة لمعنى القرآن ورسالته، ومعه 410 حواشٍ تعرّف بالمفاهيم الإسلامية الأساسية."
  en: "A simple-English presentation of the meanings of the Qur'an by Abdur Raheem Kidwai of Aligarh Muslim University, well known for his bibliographies of English Qur'an translations, first published in 2013 and in a revised third edition by Viva Books, New Delhi, in 2023; its author describes it as not strictly a translation but a paraphrase of the meaning and message of the Qur'an, with 410 footnotes introducing basic Islamic concepts."
  ur: "قرآن کے معانی کی سادہ انگریزی میں پیشکش از عبد الرحیم قدوائی، علی گڑھ مسلم یونیورسٹی سے وابستہ اور انگریزی تراجمِ قرآن کی معروف کتابیات کے مصنف، جو 2013 میں پہلی بار اور 2023 میں نئی دہلی کی ویوا بکس سے تیسری نظرِ ثانی شدہ اشاعت میں شائع ہوئی؛ مصنف اسے دقیق معنی میں ترجمہ نہیں بلکہ قرآن کے معنی اور پیغام کی بازگوئی کہتے ہیں، اور اس میں بنیادی اسلامی تصورات پر 410 حواشی ہیں۔"
