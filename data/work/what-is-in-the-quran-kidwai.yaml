label: { ar: "ما في القرآن؟ رسالة القرآن بالإنجليزية البسيطة ⁦(عبد الرحيم قدوائي)⁩", en: "What is in the Quran? Message of the Quran in Simple English (Abdur Raheem Kidwai)", ur: "واٹ از اِن دی قرآن؟ ⁦(عبد الرحیم قدوائی)⁩", es: "¿Qué contiene el Corán? El mensaje del Corán en inglés sencillo (Abdur Raheem Kidwai)", fr: "Que contient le Coran ? Le message du Coran en anglais simple (Abdur Raheem Kidwai)", tr: "Kur'an'da Ne Var? Kur'an'ın Basit İngilizce Mesajı (Abdul Rahim Qadwaei)", id: "Apa isi Al-Qur'an? Pesan Al-Qur'an dalam Bahasa Inggris Sederhana (Abdul Rahim Qadwaei)" }
summary:
  ar: "عرض بالإنجليزية البسيطة لمعاني القرآن وضعه عبد الرحيم قدوائي، الأستاذ في جامعة علي كره الإسلامية وصاحب ببليوغرافيات معروفة لترجمات القرآن الإنجليزية، صدر أول مرة سنة 2013، وطبعته الثالثة المنقّحة سنة 2023 عن دار فيفا في نيودلهي؛ يصفه صاحبه بأنه ليس ترجمة بالمعنى الدقيق بل إعادة صياغة لمعنى القرآن ورسالته، ومعه 410 حواشٍ تعرّف بالمفاهيم الإسلامية الأساسية."
  en: "A simple-English presentation of the meanings of the Qur'an by Abdur Raheem Kidwai of Aligarh Muslim University, well known for his bibliographies of English Qur'an translations, first published in 2013 and in a revised third edition by Viva Books, New Delhi, in 2023; its author describes it as not strictly a translation but a paraphrase of the meaning and message of the Qur'an, with 410 footnotes introducing basic Islamic concepts."
  ur: "قرآن کے معانی کی سادہ انگریزی میں پیشکش از عبد الرحیم قدوائی، علی گڑھ مسلم یونیورسٹی سے وابستہ اور انگریزی تراجمِ قرآن کی معروف کتابیات کے مصنف، جو 2013 میں پہلی بار اور 2023 میں نئی دہلی کی ویوا بکس سے تیسری نظرِ ثانی شدہ اشاعت میں شائع ہوئی؛ مصنف اسے دقیق معنی میں ترجمہ نہیں بلکہ قرآن کے معنی اور پیغام کی بازگوئی کہتے ہیں، اور اس میں بنیادی اسلامی تصورات پر 410 حواشی ہیں۔"
  es: "Una presentación en inglés sencillo de los significados del Corán por Abdur Raheem Kidwai de la Universidad Musulmana de Aligarh, bien conocido por sus bibliografías de traducciones del Corán al inglés, publicada por primera vez en 2013 y en una tercera edición revisada por Viva Books, Nueva Delhi, en 2023; su autor la describe no estrictamente como una traducción, sino como una paráfrasis del significado y el mensaje del Corán, con 410 notas a pie de página que introducen conceptos islámicos básicos."
  fr: "Une présentation en anglais simple des significations du Coran par Abdur Raheem Kidwai de l'Université musulmane d'Aligarh, bien connu pour ses bibliographies de traductions anglaises du Coran, publiée pour la première fois en 2013 et dans une troisième édition révisée par Viva Books, New Delhi, en 2023; son auteur la décrit non pas comme une traduction stricte mais comme une paraphrase du sens et du message du Coran, avec 410 notes de bas de page introduisant les concepts islamiques de base."
  tr: "Kur'an'ın anlamlarının basit İngilizce sunumu, Ali Kara İslam Üniversitesi profesörü ve Kur'an'ın İngilizce çevirilerinin bilinen bibliyografyalarının yazarı Abdul Rahim Qadwaei tarafından hazırlanmıştır. İlk olarak 2013 yılında yayımlanmış ve üçüncü gözden geçirilmiş baskısı 2023 yılında Yeni Delhi'deki Viva Yayınevi tarafından yayımlanmıştır. Yazarı, kitabı kesin bir çeviri değil, Kur'an'ın anlamı ve mesajının yeniden formülasyonu olarak tanımlamaktadır ve temel İslami kavramları tanıtan 410 kenar notu ile birlikte belirtmektedir."
  id: "Presentasi sederhana dalam bahasa Inggris tentang makna Al-Qur'an, yang disiapkan oleh Abdul Rahim Qadwaei, seorang profesor di Universitas Islam Ali Kara dan penulis bibliografi terkenal terjemahan Al-Qur'an dalam bahasa Inggris. Buku ini pertama kali diterbitkan pada tahun 2013, dan edisi revisi ketiganya diterbitkan pada tahun 2023 oleh Viva Publishing House di New Delhi. Penulisnya menggambarkannya bukan sebagai terjemahan yang tepat, melainkan sebagai reformulasi makna dan pesan Al-Qur'an, bersama dengan 410 catatan pinggir yang memperkenalkan konsep-konsep dasar Islam."
