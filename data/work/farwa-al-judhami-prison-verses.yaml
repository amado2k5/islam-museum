label: { ar: "أبيات فروة بن عمرو الجذامي في محبسه وعند صلبه", en: "Farwa ibn Amr al-Judhami's verses in prison and at his crucifixion" }
summary:
  ar: "أبيات قالها فروة بن عمرو الجذامي حين حبسه الروم لإسلامه: يخاطب سليمى ويذكر الروم بين الباب والقروان، ويوصي ألا تكحل العين بعده، ويخاطب أبا كبيشة بأنه لا يُقطع لسانه وسط الأعزة وأنه جمع جودة وشجاعة وبياناً؛ وبيتان حين أجمعوا على صلبه بماء عفراء، وبيت يرويه الزهري قاله حين قُدّم ليُقتل: بلّغ سراة المسلمين بأنني سِلم لربي أعظمي ومقامي."
  en: "Verses Farwa ibn Amr al-Judhami composed when the Romans imprisoned him for his Islam: he addresses Sulayma, describes the Romans between the gate and the troughs, asks that no eye be kohl'd after him, and tells Abu Kubaysha that his tongue is not cut among the mighty and that he has gathered generosity, courage and eloquence; two verses when they resolved to crucify him at the water of Afra', and one verse al-Zuhri reports he said as he was brought out to die: tell the chiefs of the Muslims that my bones and my standing are at peace with my Lord."
