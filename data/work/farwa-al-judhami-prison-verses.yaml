label: { ar: "أبيات فروة بن عمرو الجذامي في محبسه وعند صلبه", en: "Farwa ibn Amr al-Judhami's verses in prison and at his crucifixion", es: "Versos de Farwa ibn Amr al-Judhami en prisión y en su crucifixión.", fr: "Vers de Farwa ibn Amr al-Judhami en prison et lors de sa crucifixion", ur: "فروا بن عمرو الجھمی کی آیات جیل میں اور اس کے مصلوب ہونے کے وقت" }
summary:
  ar: "أبيات قالها فروة بن عمرو الجذامي حين حبسه الروم لإسلامه: يخاطب سليمى ويذكر الروم بين الباب والقروان، ويوصي ألا تكحل العين بعده، ويخاطب أبا كبيشة بأنه لا يُقطع لسانه وسط الأعزة وأنه جمع جودة وشجاعة وبياناً؛ وبيتان حين أجمعوا على صلبه بماء عفراء، وبيت يرويه الزهري قاله حين قُدّم ليُقتل: بلّغ سراة المسلمين بأنني سِلم لربي أعظمي ومقامي."
  en: "Verses Farwa ibn Amr al-Judhami composed when the Romans imprisoned him for his Islam: he addresses Sulayma, describes the Romans between the gate and the troughs, asks that no eye be kohl'd after him, and tells Abu Kubaysha that his tongue is not cut among the mighty and that he has gathered generosity, courage and eloquence; two verses when they resolved to crucify him at the water of Afra', and one verse al-Zuhri reports he said as he was brought out to die: tell the chiefs of the Muslims that my bones and my standing are at peace with my Lord."
  es: "Versos que Farwa ibn Amr al-Judhami compuso cuando los romanos lo encarcelaron por su Islam: se dirige a Sulayma, describe a los romanos entre la puerta y los abrevaderos, pide que nadie se maquille los ojos después de él y le dice a Abu Kubaysha que su lengua no ha sido cortada entre los poderosos y que ha reunido generosidad, coraje y elocuencia; dos versos cuando decidieron crucificarlo en las aguas de Afra', y un verso que al-Zuhri relata que dijo cuando lo sacaron para morir: díganles a los jefes de los musulmanes que mis huesos y mi posición están en paz con mi Señor."
  fr: "Farwa ibn Amr al-Judhami composa des versets lorsqu'il fut emprisonné par les Romains pour sa foi en l'islam: il s'adresse à Sulayma, décrit les Romains entre la porte et les abreuvoirs, demande qu'on ne lui maquille pas les yeux au khôl, et dit à Abu Kubaysha que sa langue n'est pas coupée parmi les puissants et qu'il a fait preuve de générosité, de courage et d'éloquence; deux versets furent composés lorsqu'ils décidèrent de le crucifier aux eaux d'Afra', et un verset qu'al-Zuhri rapporte qu'il aurait dit alors qu'on l'emmenait pour mourir: « Dites aux chefs des musulmans que mes os et mon sort sont en paix auprès de mon Seigneur. »"
  ur: "آیات فروا بن عمرو الجثمی نے اس وقت لکھیں جب رومیوں نے ان کے اسلام کی وجہ سے اسے قید کیا: وہ سلیمہ سے خطاب کرتا ہے، رومیوں کو دروازے اور حوض کے درمیان بیان کرتا ہے، اس کے بعد کوئی آنکھ نہ لگانے کی درخواست کرتا ہے، اور ابو کبیشہ سے کہتا ہے کہ اس کی زبان طاقتوروں کے درمیان نہیں کٹی ہے اور اس نے ہمت اور ہم آہنگی جمع کی ہے۔ دو آیتیں جب انہوں نے اسے عفراء کے پانی پر سولی پر چڑھانے کا ارادہ کیا، اور ایک آیت الزہری بیان کرتی ہے کہ جب وہ مرنے کے لیے نکالے گئے تو انہوں نے کہا: مسلمانوں کے سرداروں سے کہہ دو کہ میری ہڈیاں اور میرا قیام میرے رب کے پاس سلامت ہے۔"
