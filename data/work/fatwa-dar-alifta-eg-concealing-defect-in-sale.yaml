id: work/fatwa-dar-alifta-eg-concealing-defect-in-sale
class: work
kind: fatwa
label: { ar: "حكم التدليس بإخفاء العيب ومدى صحة البيع وثبوت الخيار للمشتري", en: "Concealing a defect in a sale — its validity and the buyer's option", ur: "بیع میں عیب چھپانا — بیع کی صحت اور خریدار کا خیار", es: "Ocultar un defecto en una venta: su validez y la opción del comprador.", fr: "Dissimulation d'un vice de vente: sa validité et les options de l'acheteur", tr: "Dolandırıcılık kararı, kusurun gizlenmesi, satışın geçerliliği ve alıcı için opsiyonun oluşturulması", id: "Putusan tentang penipuan dengan menyembunyikan cacat, keabsahan penjualan, dan penetapan opsi bagi pembeli" }
summary:
  ar: "سائل سأل عن بائع تعمد إخفاء عيب موجود في سيارة عن المشتري. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20904)⁩ أن البائع إن كان قد تعمد إخفاء العيب فإنه يأثم شرعًا وبيّن الجواب صحة البيع وثبوت الخيار للمشتري على وجهه."
  en: "A questioner asked about a seller who deliberately concealed a defect in a car from the buyer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20904) answered that deliberate concealment is sinful, and the answer sets out the sale's validity and the buyer's option."
  ur: "ایک سائل نے ایسے بائع کا حکم پوچھا جس نے گاڑی کا عیب خریدار سے چھپایا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20904)⁩ نے جواب دیا کہ جان بوجھ کر عیب چھپانا گناہ ہے اور جواب میں بیع کی صحت اور خریدار کے خیار کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre un vendedor que ocultó deliberadamente un defecto en un automóvil al comprador. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20904) respondió que la ocultación deliberada es un pecado, y la respuesta establece la validez de la venta y la opción del comprador."
  fr: "Un internaute a posé une question concernant un vendeur qui aurait délibérément dissimulé un défaut de sa voiture à l'acheteur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20904) a répondu que la dissimulation délibérée est un péché, et sa réponse précise la validité de la vente et les droits de l'acheteur."
  tr: "Bir soru soran, alıcıdan kasıtlı olarak bir aracın kusurunu gizleyen bir satıcı hakkında soru sordu. Mısır Dar al-Ifta'sı (Büyük Müftü Dr. Nazeer Muhammad Ayad, Fetva No. 20904), satıcının kusuru kasıtlı olarak gizlediyse dini günah işlediğini ve cevabın satışın geçerli olduğu ve alıcının seçeneğinin olduğu gibi olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang penjual yang sengaja menyembunyikan cacat pada mobil dari pembeli. Dar al-Ifta Mesir (Grand Mufti Dr. Nazeer Muhammad Ayad, Fatwa No. 20904) menjawab bahwa jika penjual sengaja menyembunyikan cacat tersebut, maka ia berdosa secara agama, dan jawabannya adalah bahwa penjualan tersebut sah dan opsi pembeli sudah ditetapkan sebagaimana adanya."
