id: work/fatwa-dar-alifta-eg-zakat-for-patients-healthcare
class: work
kind: fatwa
label: { ar: "حكم الصرف من أموال الزكاة والصدقات على الرعاية الصحية للمرضى", en: "Spending zakat and charity funds on patients' healthcare", ur: "زکات اور صدقات سے مریضوں کی طبی دیکھ بھال", es: "Gastar el zakat y los fondos de caridad en la atención médica de los pacientes.", fr: "Dépenser la zakat et les fonds caritatifs pour les soins de santé des patients", tr: "Zekat ve hayır kurumlarının hastalar için sağlık hizmetlerine harcanmasına ilişkin karar", id: "Putusan tentang pengeluaran zakat dan dana amal untuk layanan kesehatan bagi pasien" }
summary:
  ar: "سائل سأل عن الصرف من أموال الزكاة والصدقات على الرعاية الصحية للمرضى عبر مشروع صحي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22074)⁩ أنه يجوز الصرف من أموال الزكاة في علاج الفقراء والمساكين على أن يكون ذلك بطريق التمليك على ما فصّل الجواب."
  en: "A questioner asked about spending zakat and charity funds on patients' healthcare through a health project. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22074) answered that zakat funds may be spent on treating the poor and needy provided it reaches them by way of ownership, as the answer details."
  ur: "ایک سائل نے صحت کے منصوبے کے ذریعے زکات اور صدقات سے مریضوں کی طبی دیکھ بھال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22074)⁩ نے جواب دیا کہ فقراء اور مساکین کے علاج پر زکات خرچ کی جا سکتی ہے بشرطیکہ ان تک ملکیت کی صورت میں پہنچے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de destinar fondos de zakat y caridad a la atención médica de pacientes a través de un proyecto de salud. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22074) respondió que los fondos de zakat pueden utilizarse para el tratamiento de los pobres y necesitados, siempre que les lleguen de forma directa, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'utilisation de la zakat et des dons affranchis pour financer les soins de santé des patients dans le cadre d'un projet de santé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22074) a répondu que les fonds de la zakat peuvent être utilisés pour soigner les pauvres et les nécessiteux à condition qu'ils leur parviennent directement, comme le précise la réponse."
  tr: "Bir soru soran kişi, sağlık projesi kapsamında hastalar için sağlık hizmetlerine zekat ve yardım fonlarının harcanmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22074), cevabında detaylandırıldığı gibi, zekat fonlarının yoksul ve muhtaçlara yardım etmek için harcanmasının caiz olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang penggunaan zakat dan dana amal untuk layanan kesehatan pasien melalui proyek kesehatan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22074) menjawab bahwa dana zakat diperbolehkan digunakan untuk merawat orang miskin dan membutuhkan, asalkan dilakukan secara kepemilikan seperti yang dijelaskan dalam jawaban."
