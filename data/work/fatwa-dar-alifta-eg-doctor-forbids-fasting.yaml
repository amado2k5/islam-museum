id: work/fatwa-dar-alifta-eg-doctor-forbids-fasting
class: work
kind: fatwa
label: { ar: "حكم صوم من نهاه الطبيب عن الصوم", en: "The fast of one whose doctor forbade him fasting", ur: "جسے ڈاکٹر نے روزے سے منع کیا اس کا حکم", es: "El ayuno de aquel a quien su médico le prohibió ayunar.", fr: "Le jeûne de celui à qui son médecin l'avait interdit", tr: "Oruç tutmayı yasaklayan doktorun oruç kararı", id: "Keputusan tentang puasa dari dokter yang melarang puasa" }
summary:
  ar: "مريض نهاه الطبيب الثقة المختص عن الصوم في رمضان خوفًا عليه من الهلاك أو مضاعفات المرض فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21755)⁩ أنه يجب عليه الإفطار وبيّن الجواب ما يترتب على ذلك من قضاء أو فدية على وجهه."
  en: "A sick man whose trusted specialist doctor forbade him fasting in Ramadan — fearing for his life or complications — asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21755) answered that he must break the fast; the answer sets out what follows in making up or fidya."
  ur: "ایک مریض کو قابلِ اعتماد ماہر ڈاکٹر نے رمضان میں روزے سے منع کیا — جان یا پیچیدگیوں کے خوف سے؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21755)⁩ نے جواب دیا کہ اسے روزہ توڑنا چاہیے اور جواب میں قضاء یا فدیہ کا حکم بیان ہوا۔"
  es: "Un hombre enfermo, cuyo médico especialista de confianza le había prohibido ayunar durante el Ramadán —por temor a su vida o a complicaciones—, consultó al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21755) respondió que debía romper el ayuno; la respuesta detalla los pasos a seguir para la compensación o fidya."
  fr: "Un homme malade, dont le médecin spécialiste de confiance lui avait interdit de jeûner pendant le Ramadan – craignant pour sa vie ou des complications – a consulté la Cour suprême égyptienne (Dar al-Ifta, le grand mufti Dr Nazir Muhammad Ayyad, fatwa n° 21755), a répondu qu'il devait rompre le jeûne; la réponse détaille ensuite la procédure de rattrapage (fidya)."
  tr: "Güvenilir bir uzman doktor tarafından ölüm korkusu veya hastalık komplikasyonları nedeniyle Ramazan ayında oruç tutması yasaklandı, bu yüzden kararını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21755), orucunu bozması gerektiğini belirterek, oruç veya fidyanın yüzüne uydurulmasının sonuçlarını açıkladı."
  id: "Seorang pasien dilarang oleh dokter spesialis terpercaya untuk berpuasa di Ramadan karena takut kematian atau komplikasi penyakit, sehingga ia menanyakan tentang keputusannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21755) menyatakan bahwa ia harus berbuka puasa, menjelaskan konsekuensi dari menebus puasa atau fidya di wajahnya."
