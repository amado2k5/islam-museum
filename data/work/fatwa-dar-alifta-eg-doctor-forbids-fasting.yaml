label: { ar: "حكم صوم من نهاه الطبيب عن الصوم", en: "The fast of one whose doctor forbade him fasting", ur: "جسے ڈاکٹر نے روزے سے منع کیا اس کا حکم" }
summary:
  ar: "مريض نهاه الطبيب الثقة المختص عن الصوم في رمضان خوفًا عليه من الهلاك أو مضاعفات المرض فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21755)⁩ أنه يجب عليه الإفطار وبيّن الجواب ما يترتب على ذلك من قضاء أو فدية على وجهه."
  en: "A sick man whose trusted specialist doctor forbade him fasting in Ramadan — fearing for his life or complications — asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21755) answered that he must break the fast; the answer sets out what follows in making up or fidya."
  ur: "ایک مریض کو قابلِ اعتماد ماہر ڈاکٹر نے رمضان میں روزے سے منع کیا — جان یا پیچیدگیوں کے خوف سے؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21755)⁩ نے جواب دیا کہ اسے روزہ توڑنا چاہیے اور جواب میں قضاء یا فدیہ کا حکم بیان ہوا۔"
