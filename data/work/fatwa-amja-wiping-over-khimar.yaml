id: work/fatwa-amja-wiping-over-khimar
class: work
kind: fatwa
label: { ar: "المسح على الخمار", en: "Wiping over the head-cover in wudu", ur: "خمار پر مسح" }
summary:
  ar: "سألت امرأة عن الوضوء عند ارتداء الخمار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81296 بتاريخ 12 أبريل 2010)⁩ أن المشهور من مذهب الإمام أحمد جواز المسح على الخمار إذا كان مدارًا تحت الحلق لأن ذلك قد ورد عن بعض نساء الصحابة فيجوز للمرأة المسح على الخمار إذا كان محكم الشد ومدارًا تحت الحلق ويجوز لها أن تمسح على ما تحته من الخمار على ما فصّل الجواب."
  en: "A woman asked about wudu while wearing the head-cover. Dr. Salah al-Sawi (fatwa no. 81296, 12 April 2010) answered that the well-known position of Imam Ahmad's madhhab permits wiping over the khimar when wrapped under the chin, this being reported of some women of the Companions; so a woman may wipe over a khimar tied firm and looped under the chin, and may wipe over what lies beneath it — as the answer details."
  ur: "خمار پہن کر وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81296، 12 اپریل 2010)⁩ کے مطابق امام احمد کے مشہور قول سے ٹھوڑی کے نیچے لپیٹے خمار پر مسح جائز ہے۔"
