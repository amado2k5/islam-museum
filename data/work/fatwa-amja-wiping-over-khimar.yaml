id: work/fatwa-amja-wiping-over-khimar
class: work
kind: fatwa
label: { ar: "المسح على الخمار", en: "Wiping over the head-cover in wudu", ur: "خمار پر مسح", es: "Pasar la prenda por encima de la cabeza en el wudu.", fr: "Essuyer le couvre-chef pendant les ablutions", tr: "Örtüyü silmek", id: "Mengelap tirai" }
summary:
  ar: "سألت امرأة عن الوضوء عند ارتداء الخمار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81296 بتاريخ 12 أبريل 2010)⁩ أن المشهور من مذهب الإمام أحمد جواز المسح على الخمار إذا كان مدارًا تحت الحلق لأن ذلك قد ورد عن بعض نساء الصحابة فيجوز للمرأة المسح على الخمار إذا كان محكم الشد ومدارًا تحت الحلق ويجوز لها أن تمسح على ما تحته من الخمار على ما فصّل الجواب."
  en: "A woman asked about wudu while wearing the head-cover. Dr. Salah al-Sawi (fatwa no. 81296, 12 April 2010) answered that the well-known position of Imam Ahmad's madhhab permits wiping over the khimar when wrapped under the chin, this being reported of some women of the Companions; so a woman may wipe over a khimar tied firm and looped under the chin, and may wipe over what lies beneath it — as the answer details."
  ur: "خمار پہن کر وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81296، 12 اپریل 2010)⁩ کے مطابق امام احمد کے مشہور قول سے ٹھوڑی کے نیچے لپیٹے خمار پر مسح جائز ہے۔"
  es: "Una mujer preguntó acerca de la ablución (wudu) mientras usaba el velo. El Dr. Salah al-Sawi (fatwa n.° 81296, 12 de abril de 2010) respondió que la postura bien conocida de la escuela jurídica del Imam Ahmad permite limpiar sobre el khimar cuando está envuelto bajo la barbilla, lo cual se ha reportado en algunas mujeres de los Compañeros; por lo tanto, una mujer puede limpiar sobre un khimar bien atado y sujeto bajo la barbilla, y puede limpiar sobre lo que se encuentra debajo, como se detalla en la respuesta."
  fr: "Une femme a posé une question concernant les ablutions (wudu) lorsqu'elle porte le khimar. Le Dr Salah al-Sawi (fatwa n° 81296, 12 avril 2010) a répondu que l'avis bien connu de l'école de pensée de l'imam Ahmad autorise à s'essuyer le visage par-dessus le khimar lorsqu'il est enroulé sous le menton, pratique rapportée par certaines femmes parmi les Compagnons. Ainsi, une femme peut s'essuyer le visage par-dessus un khimar bien noué et enroulé sous le menton, et s'essuyer également le visage qui se trouve en dessous, comme le précise la réponse."
  tr: "Bir kadına ximar takarken abdest kullanımı soruldu. Dr. Salah Al-Sawi (12 Nisan 2010 tarihli 81296 No. Fetva) İmam Ahmed'in bilinen görüşünün, himar boğaz altına konursa onu silmeye izin verdiğini, bazı kadın arkadaşların da bildirdiği gibi belirtti. Bu nedenle, kadın khimar sıkıca sıkılmış ve boğazın altındaysa ve altındaki himarı da silebilir, cevapta açıklandığı gibi."
  id: "Seorang wanita ditanya tentang wudhu saat mengenakan khimar. Dr. Salah Al-Sawi menjawab (Fatwa No. 81296 tanggal 12 April 2010) bahwa pandangan terkenal tentang Imam Ahmad mengizinkan mengelap khimar jika diletakkan di bawah tenggorokan, seperti yang dilaporkan oleh beberapa sahabat wanita. Oleh karena itu, seorang wanita dapat mengelap khimar jika khimar dikencang rapat dan di bawah tenggorokan, dan dia boleh mengelap khimar di bawahnya, seperti yang dijelaskan dalam jawaban."
