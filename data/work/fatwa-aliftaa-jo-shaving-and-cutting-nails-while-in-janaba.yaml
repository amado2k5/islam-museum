id: work/fatwa-aliftaa-jo-shaving-and-cutting-nails-while-in-janaba
class: work
kind: fatwa
label: { ar: "حكم حلق شعر الجسم وقص الأظافر لمن كان جنبًا", en: "Shaving body hair and cutting nails while in a state of major ritual impurity", ur: "حالتِ جنابت میں جسم کے بال مونڈنے اور ناخن کاٹنے کا حکم", es: "Afeitarse el vello corporal y cortarse las uñas estando en estado de impureza ritual mayor.", fr: "Se raser les poils du corps et se couper les ongles en état d'impureté rituelle majeure" }
summary:
  ar: "سؤال عن حكم حلق شعر الجسم وقص الأظافر لمن كان جنبًا، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يُندب للجنب ألا يزيل شيئًا من بدنه إلا بعد الغسل، ناقلة عن بشرى الكريم بشرح مسائل التعليم ⁦(ص135)⁩ تعليل ذلك بأن الأجزاء تعود إليه في الآخرة فيعود جنبًا تبكيتًا له، ويقال إن كل شعرة تطالب بجنابتها، وعن حاشية الشبراملسي على نهاية المحتاج (2/341) أن من أراد الجمع بين الحلق والغسل يوم الجمعة وعليه جنابة ينبغي أن يؤخر الحلق عن الغسل ليزيل الغسل أثرها عن الشعر."
  en: "A question about the ruling on shaving body hair and cutting nails while in a state of major ritual impurity (janaba), in which Jordan's General Iftaa Department answered that it is recommended for a person in that state not to remove anything from his body until after the ritual bath, quoting Bushra al-Karim bi-Sharh Masa'il al-Ta'lim (p. 135) that the reason given is that the parts return to him in the hereafter and so return in a state of impurity as a rebuke to him, and that it is said every hair will demand its purification, and quoting al-Shibramallisi's gloss on Nihayat al-Muhtaj (2/341) that one who wishes to combine shaving and bathing on Friday while in a state of impurity should delay the shaving until after the bath, so that the bath removes the trace of impurity from the hair."
  ur: "حالتِ جنابت میں جسم کے بال مونڈنے اور ناخن کاٹنے کے حکم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ جنبی کے لیے مستحب ہے کہ غسل سے پہلے اپنے بدن سے کوئی چیز نہ اتارے، بشریٰ الکریم بشرح مسائل التعلیم ⁦(ص 135)⁩ سے نقل کرتے ہوئے کہ اس کی وجہ یہ بتائی گئی کہ وہ اجزا آخرت میں اس کی طرف لوٹتے ہیں تو اس کی سرزنش کے لیے جنبی حالت میں لوٹتے ہیں، اور کہا جاتا ہے کہ ہر بال اپنی جنابت کا مطالبہ کرے گا، اور شبراملسی کے نہایۃ المحتاج پر حاشیے (2/341) سے کہ جو جمعے کے دن جنابت کی حالت میں مونڈنے اور غسل کو جمع کرنا چاہے اسے مونڈنے کو غسل کے بعد تک مؤخر کرنا چاہیے تاکہ غسل بالوں سے جنابت کا اثر دور کر دے۔"
  es: "Una pregunta sobre la norma relativa al afeitado del vello corporal y al corte de uñas en estado de impureza ritual mayor (janaba), en la que el Departamento General de Iftaa de Jordania respondió que se recomienda a una persona en ese estado no quitarse nada del cuerpo hasta después del baño ritual, citando a Bushra al-Karim bi-Sharh Masa'il al-Ta'lim (p. 135) que la razón dada es que las partes le regresan en el más allá y, por lo tanto, regresan en estado de impureza como una reprimenda para él, y que se dice que cada cabello exigirá su purificación, y citando la glosa de al-Shibramallisi sobre Nihayat al-Muhtaj (2/341) que quien desee combinar el afeitado y el baño el viernes en estado de impureza debe retrasar el afeitado hasta después del baño, para que el baño elimine el rastro de impureza del cabello."
  fr: "Une question concernant la règle relative au rasage des poils et à la coupe des ongles en état d'impureté rituelle majeure (janaba) a été posée. Le Département général de la Iftaa de Jordanie a répondu qu'il est recommandé à une personne dans cet état de ne rien retirer de son corps avant le bain rituel, citant Bushra al-Karim bi-Sharh Masa'il al-Ta'lim (p. 135) selon lequel la raison invoquée est que les parties du corps reviennent à la personne dans l'au-delà et reviennent donc impures comme un reproche, et que chaque poil réclamera sa purification. Le Département a également cité le commentaire d'al-Shibramallisi sur Nihayat al-Muhtaj (2/341) selon lequel celui qui souhaite combiner rasage et bain le vendredi en état d'impureté doit reporter le rasage après le bain, afin que celui-ci élimine toute trace d'impureté des poils."
