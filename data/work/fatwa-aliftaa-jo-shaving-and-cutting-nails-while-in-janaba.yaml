id: work/fatwa-aliftaa-jo-shaving-and-cutting-nails-while-in-janaba
class: work
kind: fatwa
label: { ar: "حكم حلق شعر الجسم وقص الأظافر لمن كان جنبًا", en: "Shaving body hair and cutting nails while in a state of major ritual impurity", ur: "حالتِ جنابت میں جسم کے بال مونڈنے اور ناخن کاٹنے کا حکم" }
summary:
  ar: "سؤال عن حكم حلق شعر الجسم وقص الأظافر لمن كان جنبًا، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يُندب للجنب ألا يزيل شيئًا من بدنه إلا بعد الغسل، ناقلة عن بشرى الكريم بشرح مسائل التعليم ⁦(ص135)⁩ تعليل ذلك بأن الأجزاء تعود إليه في الآخرة فيعود جنبًا تبكيتًا له، ويقال إن كل شعرة تطالب بجنابتها، وعن حاشية الشبراملسي على نهاية المحتاج (2/341) أن من أراد الجمع بين الحلق والغسل يوم الجمعة وعليه جنابة ينبغي أن يؤخر الحلق عن الغسل ليزيل الغسل أثرها عن الشعر."
  en: "A question about the ruling on shaving body hair and cutting nails while in a state of major ritual impurity (janaba), in which Jordan's General Iftaa Department answered that it is recommended for a person in that state not to remove anything from his body until after the ritual bath, quoting Bushra al-Karim bi-Sharh Masa'il al-Ta'lim (p. 135) that the reason given is that the parts return to him in the hereafter and so return in a state of impurity as a rebuke to him, and that it is said every hair will demand its purification, and quoting al-Shibramallisi's gloss on Nihayat al-Muhtaj (2/341) that one who wishes to combine shaving and bathing on Friday while in a state of impurity should delay the shaving until after the bath, so that the bath removes the trace of impurity from the hair."
  ur: "حالتِ جنابت میں جسم کے بال مونڈنے اور ناخن کاٹنے کے حکم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ جنبی کے لیے مستحب ہے کہ غسل سے پہلے اپنے بدن سے کوئی چیز نہ اتارے، بشریٰ الکریم بشرح مسائل التعلیم ⁦(ص 135)⁩ سے نقل کرتے ہوئے کہ اس کی وجہ یہ بتائی گئی کہ وہ اجزا آخرت میں اس کی طرف لوٹتے ہیں تو اس کی سرزنش کے لیے جنبی حالت میں لوٹتے ہیں، اور کہا جاتا ہے کہ ہر بال اپنی جنابت کا مطالبہ کرے گا، اور شبراملسی کے نہایۃ المحتاج پر حاشیے (2/341) سے کہ جو جمعے کے دن جنابت کی حالت میں مونڈنے اور غسل کو جمع کرنا چاہے اسے مونڈنے کو غسل کے بعد تک مؤخر کرنا چاہیے تاکہ غسل بالوں سے جنابت کا اثر دور کر دے۔"
