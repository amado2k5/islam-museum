id: work/fatwa-amja-christian-wife-conversion-doubt
class: work
kind: fatwa
label: { ar: "إسلام الزوجة النصرانية محل الاشتباه", en: "The Christian wife's doubtful Islam", ur: "مسیحی بیوی کا مشتبہ اسلام", es: "El Islam dudoso de la esposa cristiana", fr: "L'islam douteux de l'épouse chrétienne" }
summary:
  ar: "سأل رجل تزوج امرأة نصرانية فأسلمت ظاهرًا وأرادت إشهار إسلامها ثم أخبرته أنها لم تسلم يومًا وإنما كانت تفعل لإسعاده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85565 بتاريخ 22 سبتمبر 2011)⁩ أن الأمر في محل الاشتباه: فمن نظر إلى إقرارها بالإسلام وقبولها إشهاره رأى أنها أسلمت وأن ما وقع بعد ذلك ردة، ومن نظر إلى إقرارها بأنها لم تسلم قط قال إنها لا تزال على كفرها الأول، وخير له أن يفارقها لأن الأصل في الفروج الحرمة حتى يثبت حلها بيقين."
  en: "A man who married a Christian woman — she outwardly accepted Islam and wished to declare it at al-Azhar, then told him she had never believed and only acted to please him — asked where he stands. Dr. Salah al-Sawi (fatwa no. 85565, 22 September 2011) answered that the matter is doubtful: viewing her acknowledgment of Islam and consent to declare it makes her a Muslim whose later act is apostasy; viewing her own testimony that she never believed keeps her on her first state; it is better for him to part from her, since the default of the private parts is prohibition until permission is proven with certainty. Recorded as AMJA's answer."
  ur: "ایک شخص نے پوچھا کہ اس کی مسیحی بیوی نے ظاہراً اسلام قبول کیا پھر کہا کہ کبھی مسلمان نہیں تھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85565، 22 ستمبر 2011)⁩ کے مطابق معاملہ مشتبہ ہے اس لیے اسے چھوڑ دینا بہتر ہے — شک میں اصل حرمت ہے۔"
  es: "Un hombre que se casó con una mujer cristiana —ella aceptó el islam públicamente y deseaba declararse como tal en Al-Azhar, pero luego le dijo que nunca había creído y que solo lo había hecho para complacerlo— preguntó cuál era su situación. El Dr. Salah al-Sawi (fatwa n.° 85565, 22 de septiembre de 2011) respondió que el asunto es dudoso: considerando que su reconocimiento del islam y su consentimiento para declararlo la convierten en musulmana, su acto posterior constituye apostasía; considerando que su propio testimonio de que nunca creyó la mantiene en su estado inicial; es mejor que él se separe de ella, ya que la falta de intimidad implica prohibición hasta que se demuestre con certeza el consentimiento. Registrado como respuesta de AMJA."
  fr: "Un homme qui a épousé une chrétienne – celle-ci s'était convertie à l'islam et souhaitait se convertir à al-Azhar, avant de lui avouer n'avoir jamais cru et avoir agi ainsi uniquement pour lui faire plaisir – a demandé quelle était sa position. Le Dr Salah al-Sawi (fatwa n° 85565, 22 septembre 2011) a répondu que la situation était ambiguë: si l'on considère que sa conversion à l'islam et son consentement à se convertir font d'elle une musulmane dont l'acte ultérieur constitue une apostasie; si l'on considère son propre témoignage de n'avoir jamais cru, elle reste dans son état initial; il est préférable pour lui de se séparer d'elle, car l'absence de relations intimes est interdite jusqu'à ce que la permission soit prouvée avec certitude. Cette réponse a été consignée dans la fatwa de l'AMJA."
