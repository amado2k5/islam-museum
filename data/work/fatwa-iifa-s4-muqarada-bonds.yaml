summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩ بعد تأجيل الدورة الثالثة: سندات المقارضة أداة استثمارية تقوم على تجزئة رأس مال المضاربة بإصدار صكوك ملكية على أساس وحدات متساوية القيمة مسجلة بأسماء أصحابها يملكون بها حصصًا شائعة في رأس مال المضاربة، وبيّن الأحكام التفصيلية على ما جاء في القرار."
  en: "IIFA's fourth-session resolution 30 (4/5) (Jeddah, February 1988), after the third session's deferral: muqarada bonds are an investment instrument dividing mudaraba capital by issuing ownership certificates in equal-value units registered to their holders as common shares in the mudaraba capital, with the detailed rulings set out."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد 30 (4/5) ⁦(جدہ، فروری 1988ء)⁩: مضاربہ بانڈز سرمایہ کاری کا آلہ ہیں جو مضاربہ کے سرمائے کو برابر حصص میں تقسیم کرتے ہیں؛ تفصیلی احکام بیان ہوئے۔"
