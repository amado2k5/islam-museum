id: work/fatwa-dar-alifta-eg-poor-agent-taking-zakat
class: work
kind: fatwa
label: { ar: "حكم أخذ الوكيل الفقير المحتاج من مال الزكاة", en: "A poor, needy agent taking from the zakat money", ur: "فقیر و محتاج وکیل کا زکات کے مال سے لینا" }
summary:
  ar: "سائل سأل عن وكيل فقير محتاج أُوكِل في إخراج الزكاة هل يأخذ منها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21840)⁩ أنه إذا كان الوكيل في وكالته مقيدًا بصرف الزكاة في جهة معينة أو إلى أشخاص معينين فله حكم وإن أطلقت له الوكالة فله حكم آخر بيّنه الجواب."
  en: "A questioner asked about a poor, needy agent appointed to pay out zakat — may he take from it? Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21840) answered that if the agent is restricted to a designated channel or persons he has one ruling, and if the agency is unrestricted he has another, as the answer sets out."
  ur: "ایک سائل نے اس فقیر و محتاج وکیل کے بارے میں پوچھا جسے زکات ادا کرنے کا وکیل بنایا گیا — کیا وہ اس میں سے لے سکتا ہے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21840)⁩ نے جواب دیا کہ اگر وکالت مقررہ مصرف یا افراد تک محدود ہے تو ایک حکم ہے اور اگر مطلق ہے تو دوسرا — جیسا کہ جواب نے بیان کیا۔"
