label: { ar: "حكم استخدام الذكاء الاصطناعي في كتابة المحتوى العلمي ثم نشره", en: "Using AI to write scholarly content and publish it", ur: "علمی مواد لکھنے اور شائع کرنے میں اے آئی کا استعمال" }
summary:
  ar: "سائل سأل عن استخدام الذكاء الاصطناعي في كتابة المحتوى العلمي ثم نشره. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22203)⁩ أن الذكاء الاصطناعي وسيلة مباحة لإنشاء المحتوى العلمي متى كان مجرد أداة مساعدة في البحث وجمع المعلومات على أن يتحقق الباحث مما يخرجه، على ما فصّل الجواب."
  en: "A questioner asked about using AI to write scholarly content and then publish it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22203) answered that AI is a lawful means of producing scholarly content as long as it remains a tool assisting research and the gathering of information — with the researcher verifying its output — as the answer details."
  ur: "ایک سائل نے علمی مواد لکھنے اور پھر شائع کرنے میں اے آئی کے استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22203)⁩ نے جواب دیا کہ اے آئی علمی مواد پیدا کرنے کا جائز ذریعہ ہے جب تک وہ تحقیق اور معلومات جمع کرنے میں صرف معاون ٹول رہے — اور محقق اس کی پیداوار کی تصدیق کرے — جیسا کہ جواب میں تفصیل ہے۔"
