label: { ar: "القرآن: شرح للأطفال ⁦(عبد الواحد فان بوميل)⁩", en: "De Koran: uitleg voor kinderen (Abdul Wahid van Bommel)", ur: "دی کوران: اُتلیخ وور کنڈرن ⁦(عبد الواحد فان بومل)⁩", es: "De Corán: uitleg voor kinderen (Abdul Wahid van Bommel)", fr: "Le Coran: uitleg voor kinderen (Abdul Wahid van Bommel)", tr: "Kur'an: Çocuklar için Açıklama (Abdulwahid van Bommel)", id: "Al-Qur'an: Penjelasan untuk Anak-anak (Abdulwahid van Bommel)" }
summary:
  ar: "أول تفسير للقرآن للأطفال بالهولندية، وضعه عبد الواحد فان بوميل، الإمام والأستاذ في الجامعة الإسلامية في روتردام، في سلسلة مجلدات صدر أولها سنة 2017 والثاني سنة 2020 والثالث سنة 2024، يدور كل منها على أحد أولي العزم من الرسل؛ يترجم فيه بنفسه الآيات المختارة ويشرحها بأسلوب «التفلسف مع الأطفال» لمن بين العاشرة والرابعة عشرة، مع رسوم للفنان البوسني سناد عليتش."
  en: "The first interpretation of the Qur'an for children in Dutch, by Abdul Wahid van Bommel, an imam and professor at the Islamic University of Rotterdam, in a series of volumes, the first in 2017, the second in 2020 and the third in 2024, each centred on one of the five resolute prophets; he translates the selected verses himself and explains them in a 'philosophising with children' style for ages ten to fourteen, with illustrations by the Bosnian artist Senad Alić."
  ur: "ہالینڈی زبان میں بچوں کے لیے قرآن کی پہلی تفسیر، از عبد الواحد فان بومل، امام اور اسلامک یونیورسٹی آف روٹرڈیم کے پروفیسر، جلدوں کے سلسلے میں: پہلی 2017، دوسری 2020 اور تیسری 2024 میں، ہر جلد ایک اولو العزم رسول پر؛ منتخب آیات کا ترجمہ وہ خود کرتے ہیں اور دس سے چودہ سال کے بچوں کے لیے «بچوں کے ساتھ فلسفیانہ گفتگو» کے انداز میں ان کی وضاحت کرتے ہیں، بوسنیائی فنکار سناد علیچ کی تصاویر کے ساتھ۔"
  es: "La primera interpretación del Corán para niños en neerlandés, obra de Abdul Wahid van Bommel, imán y profesor de la Universidad Islámica de Róterdam, consta de una serie de volúmenes: el primero en 2017, el segundo en 2020 y el tercero en 2024, cada uno centrado en uno de los cinco profetas; él mismo traduce los versículos seleccionados y los explica en un estilo de \"filosofía con niños\" para edades comprendidas entre los diez y los catorce años, con ilustraciones del artista bosnio Senad Alić."
  fr: "La première interprétation du Coran pour enfants en néerlandais, par Abdul Wahid van Bommel, imam et professeur à l'Université islamique de Rotterdam, en une série de volumes, le premier en 2017, le deuxième en 2020 et le troisième en 2024, chacun centré sur l'un des cinq prophètes résolus; il traduit lui-même les versets sélectionnés et les explique dans un style « philosophique avec les enfants » pour les dix à quatorze ans, avec des illustrations de l'artiste bosnien Senad Alić."
  tr: "Çocuklar için Kur'an'ın Hollandaca ilk yorumu, Rotterdam İslam Üniversitesi'nde imam ve profesör olan Abdul Wahid van Bommel tarafından bir dizi cilt halinde yazılmıştır; ilki 2017'de, ikincisi 2020'de ve üçüncüsü 2024'te yayımlanmıştır. Her biri en kararlı elçilerden birine odaklanır; bu kitapta, seçilen ayetleri şahsen çevirir ve on ila on dört yaş arası çocuklarla 'felsefe yapma' tarzında, Bosnalı sanatçı Sanad Alić'in illüstrasyonlarıyla açıklar."
  id: "Interpretasi pertama Al-Qur'an untuk anak-anak dalam bahasa Belanda disusun oleh Abdul Wahid van Bommel, seorang imam dan profesor di Universitas Islam Rotterdam, dalam serangkaian volume, yang pertama diterbitkan pada tahun 2017, yang kedua pada tahun 2020, dan yang ketiga pada tahun 2024. Masing-masing berfokus pada salah satu utusan yang paling teguh; di dalamnya, ia secara pribadi menerjemahkan ayat-ayat yang dipilih dan menjelaskannya dengan gaya 'berfilsafat bersama anak-anak' untuk mereka yang berusia sepuluh hingga empat belas tahun, dengan ilustrasi oleh seniman Bosnia Sanad Alić."
