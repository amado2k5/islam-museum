summary:
  ar: "أول تفسير للقرآن للأطفال بالهولندية، وضعه عبد الواحد فان بوميل، الإمام والأستاذ في الجامعة الإسلامية في روتردام، في سلسلة مجلدات صدر أولها سنة 2017 والثاني سنة 2020 والثالث سنة 2024، يدور كل منها على أحد أولي العزم من الرسل؛ يترجم فيه بنفسه الآيات المختارة ويشرحها بأسلوب «التفلسف مع الأطفال» لمن بين العاشرة والرابعة عشرة، مع رسوم للفنان البوسني سناد عليتش."
  en: "The first interpretation of the Qur'an for children in Dutch, by Abdul Wahid van Bommel, an imam and professor at the Islamic University of Rotterdam, in a series of volumes, the first in 2017, the second in 2020 and the third in 2024, each centred on one of the five resolute prophets; he translates the selected verses himself and explains them in a 'philosophising with children' style for ages ten to fourteen, with illustrations by the Bosnian artist Senad Alić."
  ur: "ہالینڈی زبان میں بچوں کے لیے قرآن کی پہلی تفسیر، از عبد الواحد فان بومل، امام اور اسلامک یونیورسٹی آف روٹرڈیم کے پروفیسر، جلدوں کے سلسلے میں: پہلی 2017، دوسری 2020 اور تیسری 2024 میں، ہر جلد ایک اولو العزم رسول پر؛ منتخب آیات کا ترجمہ وہ خود کرتے ہیں اور دس سے چودہ سال کے بچوں کے لیے «بچوں کے ساتھ فلسفیانہ گفتگو» کے انداز میں ان کی وضاحت کرتے ہیں، بوسنیائی فنکار سناد علیچ کی تصاویر کے ساتھ۔"
