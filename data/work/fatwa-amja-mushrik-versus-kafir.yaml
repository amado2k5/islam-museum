label: { ar: "المشرك والكافر", en: "The mushrik and the kafir — al-Ma'ida and al-Baqara reconciled", ur: "مشرک اور کافر — مائدہ اور بقرہ کی تطبیق", es: "El politeísta y el infiel — al-Ma'ida y al-Baqara se reconciliaron", fr: "Le polythéiste et le mécréant — al-Ma'ida et al-Baqara réconciliés", tr: "Çoktanrıcı ve kâfir", id: "Politeis dan kafir" }
summary:
  ar: "سأل سائل عن الفرق الدقيق بين المشرك والكافر وكيف نفهم الجمع بين آيتي المائدة في حل نساء أهل الكتاب والبقرة في تحريم نكاح المشركات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77277 بتاريخ 28 ديسمبر 2008)⁩ أن سورة المائدة من أواخر ما نزل وقد ورد فيها حل نساء أهل الكتاب على الرغم من تحقق معنى الشرك فيهم فيكون ذلك تخصيصًا لآية البقرة التي تحرم نكاح المشركات حتى يؤمن، ولبعض أهل العلم طريقة أخرى في الجمع أن أهل الكتاب رغم تحقق معنى الشرك فيهم إلا أن هذه التسمية لا تنصرف إليهم عند الإطلاق بل تنصرف إلى من لا يدين بدين سماوي كقوله إن الذين كفروا من أهل الكتاب والمشركين في نار جهنم خالدين فيها."
  en: "A questioner asked the precise difference between the mushrik and the kafir, and how to reconcile al-Ma'ida's permitting women of the People of the Book with al-Baqara's forbidding marriage to the idolaters until they believe. Dr. Salah al-Sawi (fatwa no. 77277, 28 December 2008) answered that al-Ma'ida is among the last revealed, and its permitting Book-women despite shirk's meaning holding in them makes it a specification of al-Baqara; some scholars reconcile another way — the People of the Book, though the meaning of shirk holds in them, are not the ones this name turns to unqualified: it turns to those who hold no heavenly religion, as in 'the disbelievers among the People of the Book and the idolaters are in hellfire forever'."
  ur: "ایک سائل نے مشرک اور کافر کا فرق اور آیتوں کی تطبیق پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77277، 28 دسمبر 2008)⁩ کے مطابق مائدہ کی آیت بقرہ کے حکم کی تخصیص ہے، یا یہ کہ اہل کتاب پر «مشرک» کا اطلاق نہیں ہوتا۔"
  es: "Un consultante preguntó cuál era la diferencia precisa entre el mushrik y el kafir, y cómo conciliar la permisividad de al-Ma'ida hacia las mujeres de la Gente del Libro con la prohibición de al-Baqara de contraer matrimonio con los idólatras hasta que crean. El Dr. Salah al-Sawi (fatwa n.º 77277, 28 de diciembre de 2008) respondió que al-Ma'ida se encuentra entre las últimas revelaciones, y que su permisividad hacia las mujeres del Libro, a pesar de que el significado de shirk persista en ellas, lo convierte en una especificación de al-Baqara; algunos eruditos lo concilian de otra manera: la Gente del Libro, aunque el significado de shirk persista en ellos, no es a quienes se refiere este nombre sin reservas, sino a aquellos que no profesan ninguna religión celestial, como en «los incrédulos entre la Gente del Libro y los idólatras están en el fuego del infierno para siempre»."
  fr: "Un lecteur a demandé la différence précise entre le polythéiste (mushrik) et le mécréant (kafir), et comment concilier l'autorisation donnée par al-Ma'ida aux femmes des Gens du Livre d'épouser les idolâtres avec l'interdiction faite par al-Baqara de se marier avec eux jusqu'à leur conversion. Le Dr Salah al-Sawi (fatwa n° 77277, 28 décembre 2008) a répondu qu'al-Ma'ida figure parmi les dernières révélations et que le fait qu'elle autorise les femmes des Gens du Livre, malgré la présence du polythéisme en elles, en fait une spécificité d'al-Baqara. D'autres savants proposent une autre explication: les Gens du Livre, bien que la notion de polythéisme soit présente en eux, ne sont pas ceux pour qui ce terme s'applique sans nuance; il s'applique à ceux qui ne professent aucune religion, comme dans l'affirmation: « les mécréants parmi les Gens du Livre et les idolâtres sont voués à l'enfer éternel »."
  tr: "Bir kişiye, bir mushrik ile kâfir arasındaki kesin fark ve Kitap Ahli Kadınların ve Bekarah'ın kadınlarının mürik kadınlarla evlenmesini yasaklamada İcaz'a ilişkin Mezide ayetlerinin birleşimini nasıl anlayabileceği soruldu. Dr. Salah Al-Sawi (28 Aralık 2008 tarihli 77277 No'lu Fetva) Mes'in Suresi'nin son vahiylerden biri olduğunu ve Halkın kadınlarının izinliliğini içerdiğini yanıtladı. Kitap, çoktanrıcılığın anlamı onların arasında yerleşmiş olmasına rağmen. Bu, inanana kadar çürkperestlerle evlenmeyi yasaklayan Bekarah ayetinin bir belirtmesidir. Bazı alimlerin başka bir uzlaşma yöntemi vardır: çoktanrıcılığın anlamı Kitap Ehlileri arasında doğrulanmış olsa da, bu tanımlama genel olarak onlara değil, ilahi bir dine inanmayanlara uygulanır; örneğin O'nun sözü gibi: Kitap Ahli ve çok tanrılılar arasında inkar edenler, Cehennem ateşinde sonsuza dek kalırlar."
  id: "Seorang penanya ditanya tentang perbedaan tepat antara seorang musyrik dan seorang kafir, serta bagaimana memahami kombinasi ayat-ayat Al-Ma'idah mengenai kelayakan perempuan Umat Kitab dan Al-Baqarah dalam melarang pernikahan dengan perempuan politeis. Dr. Salah Al-Sawi menjawab (Fatwa No. 77277 tanggal 28 Desember 2008) bahwa Surah Al-Ma'idah adalah salah satu wahyu terakhir dan memuat izin perempuan umat Kitab meskipun makna politeisme telah ditetapkan di antara mereka. Ini adalah spesifikasi untuk ayat Al-Baqarah, yang melarang pernikahan dengan politeis sampai seseorang percaya. Beberapa ulama memiliki metode rekonsiliasi lain: meskipun makna politeisme dikonfirmasi di antara Umat Kitab itu, sebutan ini tidak diterapkan pada mereka secara umum, melainkan kepada mereka yang tidak mengikuti agama ilahi, seperti perkataan-Nya: Mereka yang tidak percaya di antara Umat Kitab dan politeis akan kekal selamanya dalam api Neraka."
