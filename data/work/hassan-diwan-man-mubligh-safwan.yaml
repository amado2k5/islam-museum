summary:
  ar: "أبيات هجاء لحسان بن ثابت من الكامل على روي الباء، كما في شرح البرقوقي الذي يذكر بحرها في رأسها {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. الهجاء هنا وصف أدبي من الديوان ولا يتبنى المتحف حكمه."
  en: "Satirical verses by Hassan ibn Thabit in the kamil metre on the rhyme الباء, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. The satire is reported as a literary text; the museum does not adopt its judgement."
