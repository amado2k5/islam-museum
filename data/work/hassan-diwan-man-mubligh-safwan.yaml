label: { ar: "هجاء حسان لصفوان بن أمية «من مبلغ صفوان أن عجوزه»", en: "Hassan's satire of Safwan ibn Umayya, 'Who will tell Safwan that his old woman'", es: "La sátira de Hassan sobre Safwan ibn Umayya, '¿Quién le dirá a Safwan que su anciana?'", fr: "La satire de Hassan sur Safwan ibn Umayya, « Qui dira à Safwan que sa vieille femme »", ur: "صفوان بن امیہ کا حسن کا طنز، 'صفوان کو کون بتائے گا کہ اس کی بوڑھی عورت'" }
summary:
  ar: "أبيات هجاء لحسان بن ثابت من الكامل على روي الباء، كما في شرح البرقوقي الذي يذكر بحرها في رأسها {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. الهجاء هنا وصف أدبي من الديوان ولا يتبنى المتحف حكمه."
  en: "Satirical verses by Hassan ibn Thabit in the kamil metre on the rhyme الباء, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. The satire is reported as a literary text; the museum does not adopt its judgement."
  es: "Versos satíricos de Hassan ibn Thabit en metro kamil con rima الباء, como en el comentario de al-Barquqi, que indica el metro en su encabezado {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. La sátira se considera un texto literario; el museo no comparte esta valoración."
  fr: "Vers satiriques de Hassan ibn Thabit en mètre kamil sur la rime الباء, comme dans le commentaire d'al-Barquqi, qui mentionne le mètre dans son introduction {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. La satire est considérée comme un texte littéraire; le musée ne partage pas cette opinion."
  ur: "نظم الباء پر کامل میٹر میں حسن بن ثابت کی طنزیہ آیات، جیسا کہ البرکی کی تفسیر میں، جس میں میٹر کو اس کے عنوان {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 55}} میں لکھا گیا ہے۔ طنز کو ایک ادبی متن کے طور پر رپورٹ کیا جاتا ہے۔ میوزیم اپنے فیصلے کو نہیں اپناتا ہے۔"
