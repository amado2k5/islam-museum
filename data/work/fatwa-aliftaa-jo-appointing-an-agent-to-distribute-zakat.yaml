id: work/fatwa-aliftaa-jo-appointing-an-agent-to-distribute-zakat
class: work
kind: fatwa
label: { ar: "التوكيل في توزيع الزكاة والصدقة", en: "Appointing an agent to distribute zakat and charity", ur: "زکات اور صدقہ کی تقسیم کے لیے وکیل بنانا", es: "Designar a un agente para distribuir el zakat y la caridad.", fr: "Désigner un agent pour distribuer la zakat et les œuvres de charité" }
summary:
  ar: "سؤال عن التوكيل في توزيع الزكاة والصدقة وشروطه، أجابت فيه دائرة الإفتاء العام الأردنية بأنه جائز إذا كان الوكيل ثقة أمينًا، وذكرت شروطًا يلتزمها الوكيل. أجابت الدائرة بأنه يجوز لمن وجبت عليه الزكاة أن يوكل غيره في توزيعها بشرط أن يكون ثقة صادقًا أمينًا، وأن ينوي المزكي الزكاة عند توكيل غير المسلم. وقالت إن الوكيل لا يأخذ من الزكاة لنفسه ولا لمن تجب عليه نفقتهم، ونقلت عن النووي في المجموع أن المالك أو وكيله إذا فرق الزكاة سقط سهم العامل. وقالت إن على الوكيل أن يوصلها إلى المستحقين دون تأخير، ونقلت عن الخطيب الشربيني في مغني المحتاج وجوب أداء الزكاة على الفور. وقالت إنها تُدفع إلى الفقراء مباشرة، فلا يُبنى منها مسجد أو مدرسة أو مستشفى، لأن هذه ليست من الأصناف المحددة، ونقلت عن ابن قاسم الغزي في فتح القريب أن المراد بسبيل الله المجاهدون المتطوعون. وقالت إن على الوكيل أن يلتزم شرط الموكل في جهة التوزيع ونوعه، ونقلت عن البجيرمي أن شرط المتبرع كشرط الواقف، فإن شرطها نقدًا لم يصرفها طعامًا أو أعيانًا، وإن شرطها طعامًا جاز بناء على قول الحنفية بجواز دفع القيمة، ونقلت عن النووي في المجموع منع الشافعية إخراج القيمة وأن أبا حنيفة يجيزه."
  en: "A question about appointing an agent to distribute zakat and charity and the conditions for doing so, in which Jordan's General Iftaa Department answered that it is permitted if the agent is reliable and trustworthy, and set out conditions the agent must keep. The Department answered that a person who owes zakat may appoint someone else to distribute it, provided the agent is reliable, honest and trustworthy, and that the payer forms the intention of zakat when appointing a non-Muslim agent. It said the agent may take nothing of the zakat for himself or for those he must support, citing al-Nawawi's al-Majmu that when the owner or his agent distributes zakat, the share of the zakat collectors lapses. It said the agent must deliver it to those entitled without delay, citing al-Khatib al-Shirbini's Mughni al-Muhtaj that zakat must be paid immediately. It said zakat is given to the poor directly, so no mosque, school or hospital may be built from it, since these are not among the designated categories, citing Ibn Qasim al-Ghazzi's Fath al-Qarib that 'in the way of God' means volunteer fighters. It said the agent must keep to the payer's stipulations on where and in what form it is distributed, citing al-Bujayrimi that a donor's stipulation is like that of the founder of an endowment: if the payer specified cash, the agent may not give food or goods, and if he specified food this is allowed on the Hanafi view that value may be given; it cited al-Nawawi's al-Majmu that the Shafi'is do not allow giving value, while Abu Hanifa does."
  ur: "زکات اور صدقہ کی تقسیم کے لیے وکیل بنانے اور اس کی شرطوں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر وکیل قابل اعتماد اور امانت دار ہو تو یہ جائز ہے، اور وہ شرطیں بیان کیں جن کی پابندی وکیل پر لازم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جس پر زکات واجب ہو وہ کسی دوسرے کو اس کی تقسیم کا وکیل بنا سکتا ہے بشرطیکہ وہ قابل اعتماد، سچا اور امانت دار ہو، اور غیر مسلم کو وکیل بنانے کی صورت میں زکات دینے والا خود زکات کی نیت کرے۔ اس نے کہا کہ وکیل زکات میں سے نہ اپنے لیے کچھ لے اور نہ ان کے لیے جن کا نفقہ اس پر واجب ہے؛ اس نے نووی کی المجموع سے نقل کیا کہ جب مالک یا اس کا وکیل زکات تقسیم کرے تو عاملین کا حصہ ساقط ہو جاتا ہے۔ اس نے کہا کہ وکیل پر لازم ہے کہ زکات بلا تاخیر مستحقین تک پہنچائے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ زکات فوراً ادا کرنا واجب ہے۔ اس نے کہا کہ زکات براہ راست فقرا کو دی جائے، اس سے مسجد، مدرسہ یا ہسپتال نہ بنایا جائے کیونکہ یہ مقررہ اقسام میں شامل نہیں؛ اس نے ابن قاسم الغزی کی فتح القریب سے نقل کیا کہ اللہ کی راہ سے مراد رضاکار مجاہدین ہیں۔ اس نے کہا کہ وکیل تقسیم کی جگہ اور صورت میں مؤکل کی شرط کا پابند ہے؛ اس نے بجیرمی سے نقل کیا کہ عطیہ دینے والے کی شرط وقف کرنے والے کی شرط جیسی ہے: اگر اس نے نقد کی شرط رکھی تو وکیل کھانا یا سامان نہیں دے سکتا، اور اگر کھانے کی شرط رکھی تو حنفیہ کے قول کی بنا پر جائز ہے جو قیمت دینے کو جائز کہتے ہیں؛ اس نے نووی کی المجموع سے نقل کیا کہ شافعیہ قیمت دینے کو جائز نہیں کہتے جبکہ ابو حنیفہ جائز کہتے ہیں۔"
  es: "Una pregunta sobre el nombramiento de un agente para distribuir el zakat y la caridad, y las condiciones para hacerlo, fue respondida por el Departamento General de Iftaa de Jordania, quien indicó que está permitido si el agente es confiable y digno de confianza, y estableció las condiciones que este debe cumplir. El Departamento explicó que quien debe zakat puede nombrar a otra persona para distribuirlo, siempre que el agente sea confiable, honesto y digno de confianza, y que el pagador manifieste la intención de realizar el zakat al nombrar a un agente no musulmán. Añadió que el agente no puede tomar nada del zakat para sí mismo ni para quienes debe mantener, citando la obra Al-Majmu de Al-Nawawi, que establece que cuando el propietario o su agente distribuye el zakat, la parte de los recaudadores se pierde. Asimismo, indicó que el agente debe entregarlo a quienes tienen derecho a él sin demora, citando la obra Mughni al-Muhtaj de Al-Khatib Al-Shirbini, que establece que el zakat debe pagarse de inmediato. Afirmó que el zakat se entrega directamente a los pobres, por lo que no se puede construir ninguna mezquita, escuela u hospital con él, ya que estos no se encuentran entre las categorías designadas, citando el Fath al-Qarib de Ibn Qasim al-Ghazzi, que dice que \"en el camino de Dios\" significa combatientes voluntarios. Añadió que el agente debe atenerse a las estipulaciones del pagador sobre dónde y en qué forma se distribuye, citando a al-Bujayrimi, que dice que la estipulación de un donante es como la del fundador de una fundación: si el pagador especificó efectivo, el agente no puede dar alimentos ni bienes, y si especificó alimentos, esto está permitido según la visión Hanafi de que se puede dar valor; citó al-Majmu de al-Nawawi, que dice que los Shafi'is no permiten dar valor, mientras que Abu Hanifa sí."
  fr: "Une question relative à la désignation d'un mandataire pour la distribution de la zakat et des aumônes, ainsi qu'aux conditions afférentes, a été posée. Le Département général de la Iftaa de Jordanie a répondu que cela est permis si le mandataire est fiable et digne de confiance, et a précisé les conditions que ce dernier doit respecter. Le Département a indiqué qu'une personne redevable de la zakat peut désigner un tiers pour la distribuer, à condition que ce dernier soit fiable, honnête et digne de confiance, et que le payeur exprime clairement son intention de verser la zakat lors de la désignation d'un mandataire non musulman. Il a précisé que le mandataire ne peut rien conserver de la zakat pour lui-même ni pour les personnes à sa charge, citant l'ouvrage « al-Majmu » d'al-Nawawi selon lequel, lorsque le propriétaire ou son mandataire distribue la zakat, la part des collecteurs de zakat est perdue. Le Département a ajouté que le mandataire doit la remettre sans délai aux bénéficiaires, citant l'ouvrage « Mughni al-Muhtaj » d'al-Khatib al-Shirbini selon lequel la zakat doit être versée immédiatement. Il est précisé que la zakat est versée directement aux pauvres, et qu'elle ne peut donc servir à la construction de mosquées, d'écoles ou d'hôpitaux, ces établissements n'étant pas concernés par les catégories désignées. Le texte cite Fath al-Qarib d'Ibn Qasim al-Ghazzi, selon lequel « sur la voie de Dieu » désigne les combattants volontaires. Il est également indiqué que le mandataire doit respecter les stipulations du donateur quant au lieu et à la forme de distribution. Al-Bujayrimi explique que les stipulations d'un donateur sont similaires à celles du fondateur d'une fondation: si le donateur a spécifié une somme d'argent, le mandataire ne peut distribuer ni nourriture ni biens; s'il a spécifié de la nourriture, cela est autorisé selon l'école hanafite, qui autorise les dons en nature. Le texte cite al-Majmu d'al-Nawawi, qui indique que les chaféites n'autorisent pas les dons en nature, contrairement à l'école hanafite."
