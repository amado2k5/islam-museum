id: work/fatwa-aliftaa-jo-appointing-an-agent-to-distribute-zakat
class: work
kind: fatwa
label: { ar: "التوكيل في توزيع الزكاة والصدقة", en: "Appointing an agent to distribute zakat and charity", ur: "زکات اور صدقہ کی تقسیم کے لیے وکیل بنانا" }
summary:
  ar: "سؤال عن التوكيل في توزيع الزكاة والصدقة وشروطه، أجابت فيه دائرة الإفتاء العام الأردنية بأنه جائز إذا كان الوكيل ثقة أمينًا، وذكرت شروطًا يلتزمها الوكيل. أجابت الدائرة بأنه يجوز لمن وجبت عليه الزكاة أن يوكل غيره في توزيعها بشرط أن يكون ثقة صادقًا أمينًا، وأن ينوي المزكي الزكاة عند توكيل غير المسلم. وقالت إن الوكيل لا يأخذ من الزكاة لنفسه ولا لمن تجب عليه نفقتهم، ونقلت عن النووي في المجموع أن المالك أو وكيله إذا فرق الزكاة سقط سهم العامل. وقالت إن على الوكيل أن يوصلها إلى المستحقين دون تأخير، ونقلت عن الخطيب الشربيني في مغني المحتاج وجوب أداء الزكاة على الفور. وقالت إنها تُدفع إلى الفقراء مباشرة، فلا يُبنى منها مسجد أو مدرسة أو مستشفى، لأن هذه ليست من الأصناف المحددة، ونقلت عن ابن قاسم الغزي في فتح القريب أن المراد بسبيل الله المجاهدون المتطوعون. وقالت إن على الوكيل أن يلتزم شرط الموكل في جهة التوزيع ونوعه، ونقلت عن البجيرمي أن شرط المتبرع كشرط الواقف، فإن شرطها نقدًا لم يصرفها طعامًا أو أعيانًا، وإن شرطها طعامًا جاز بناء على قول الحنفية بجواز دفع القيمة، ونقلت عن النووي في المجموع منع الشافعية إخراج القيمة وأن أبا حنيفة يجيزه."
  en: "A question about appointing an agent to distribute zakat and charity and the conditions for doing so, in which Jordan's General Iftaa Department answered that it is permitted if the agent is reliable and trustworthy, and set out conditions the agent must keep. The Department answered that a person who owes zakat may appoint someone else to distribute it, provided the agent is reliable, honest and trustworthy, and that the payer forms the intention of zakat when appointing a non-Muslim agent. It said the agent may take nothing of the zakat for himself or for those he must support, citing al-Nawawi's al-Majmu that when the owner or his agent distributes zakat, the share of the zakat collectors lapses. It said the agent must deliver it to those entitled without delay, citing al-Khatib al-Shirbini's Mughni al-Muhtaj that zakat must be paid immediately. It said zakat is given to the poor directly, so no mosque, school or hospital may be built from it, since these are not among the designated categories, citing Ibn Qasim al-Ghazzi's Fath al-Qarib that 'in the way of God' means volunteer fighters. It said the agent must keep to the payer's stipulations on where and in what form it is distributed, citing al-Bujayrimi that a donor's stipulation is like that of the founder of an endowment: if the payer specified cash, the agent may not give food or goods, and if he specified food this is allowed on the Hanafi view that value may be given; it cited al-Nawawi's al-Majmu that the Shafi'is do not allow giving value, while Abu Hanifa does."
  ur: "زکات اور صدقہ کی تقسیم کے لیے وکیل بنانے اور اس کی شرطوں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر وکیل قابل اعتماد اور امانت دار ہو تو یہ جائز ہے، اور وہ شرطیں بیان کیں جن کی پابندی وکیل پر لازم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جس پر زکات واجب ہو وہ کسی دوسرے کو اس کی تقسیم کا وکیل بنا سکتا ہے بشرطیکہ وہ قابل اعتماد، سچا اور امانت دار ہو، اور غیر مسلم کو وکیل بنانے کی صورت میں زکات دینے والا خود زکات کی نیت کرے۔ اس نے کہا کہ وکیل زکات میں سے نہ اپنے لیے کچھ لے اور نہ ان کے لیے جن کا نفقہ اس پر واجب ہے؛ اس نے نووی کی المجموع سے نقل کیا کہ جب مالک یا اس کا وکیل زکات تقسیم کرے تو عاملین کا حصہ ساقط ہو جاتا ہے۔ اس نے کہا کہ وکیل پر لازم ہے کہ زکات بلا تاخیر مستحقین تک پہنچائے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ زکات فوراً ادا کرنا واجب ہے۔ اس نے کہا کہ زکات براہ راست فقرا کو دی جائے، اس سے مسجد، مدرسہ یا ہسپتال نہ بنایا جائے کیونکہ یہ مقررہ اقسام میں شامل نہیں؛ اس نے ابن قاسم الغزی کی فتح القریب سے نقل کیا کہ اللہ کی راہ سے مراد رضاکار مجاہدین ہیں۔ اس نے کہا کہ وکیل تقسیم کی جگہ اور صورت میں مؤکل کی شرط کا پابند ہے؛ اس نے بجیرمی سے نقل کیا کہ عطیہ دینے والے کی شرط وقف کرنے والے کی شرط جیسی ہے: اگر اس نے نقد کی شرط رکھی تو وکیل کھانا یا سامان نہیں دے سکتا، اور اگر کھانے کی شرط رکھی تو حنفیہ کے قول کی بنا پر جائز ہے جو قیمت دینے کو جائز کہتے ہیں؛ اس نے نووی کی المجموع سے نقل کیا کہ شافعیہ قیمت دینے کو جائز نہیں کہتے جبکہ ابو حنیفہ جائز کہتے ہیں۔"
