id: work/fatwa-amja-despair-forgiveness-whispers
class: work
kind: fatwa
label: { ar: "وساوس عن النار وعفو الظالم", en: "Whispers of the Fire and forgiving a wrongdoer", ur: "دوزخ کے وسوسے اور ظالم کی معافی", es: "Susurros del fuego y el perdón a un malhechor", fr: "Murmures du Feu et pardonner à celui qui a fait du mal" }
summary:
  ar: "سأل سائل ثلاثة أسئلة منها قوله إذا فعل معصية خلاص سأدخل النار وعفوه عن ظالم وخواطر سيئة مرجت بنفسه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78104 بتاريخ 6 مارس 2009)⁩ أن الأول والثاني سبقت الإجابة عنهما، وأما الثالث فما كان من الخواطر السانحة التي سرعان ما تزول بعد الروية والتأمل فأرجو أن يكون في دائرة العفو، ونصحه أن يعظم نبيه ويعرف له قدره حتى لا تقع في نفسه نحوه مثل هذه الخواطر مرة أخرى فيكثر من القراءة في سيرته وشمائله ويتعرف عليه أكثر فمن عرف رسول الله أحبه ومن أحبه ازداد له تعظيمًا وتوقيرًا."
  en: "A questioner asked three things — saying 'that's it, I'll enter the Fire' after a sin, pardoning one who wronged him, and evil passing thoughts against his better self. Dr. Salah al-Sawi (fatwa no. 78104, 6 March 2009) answered the first two earlier; as to the third, fleeting thoughts that vanish upon reflection fall, he hopes, within pardon — and he advised him to magnify his Prophet and know his worth so such thoughts never return: read much in his sira and Shamail and come to know him better, for whoever knows the Messenger of God loves him, and whoever loves him grows in awe of him."
  ur: "ایک سائل نے گناہ کے بعد نومیدی، ظالم کی معافی اور بری خیالات کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78104، 6 مارچ 2009)⁩ کے مطابق عارضی خیالات عفو میں ہیں؛ نبی کی سیرت و شمائل پڑھ کر اس کی تعظیم کرے۔"
  es: "Un consultante preguntó tres cosas: decir \"eso es todo, entraré en el Fuego\" después de un pecado, perdonar a quien le hizo daño y los malos pensamientos que van en contra de su propio bien. El Dr. Salah al-Sawi (fatwa n.° 78104, 6 de marzo de 2009) respondió a las dos primeras anteriormente; en cuanto a la tercera, los pensamientos fugaces que se desvanecen al reflexionar entran, según su esperanza, dentro del perdón, y le aconsejó que glorificara a su Profeta y reconociera su valía para que tales pensamientos nunca volvieran: lee mucho en su sira y Shamail y llega a conocerlo mejor, pues quien conoce al Mensajero de Dios lo ama, y quien lo ama crece en reverencia hacia él."
  fr: "Un homme a posé trois questions: dire « ça y est, j’irai en Enfer » après avoir commis un péché; pardonner à celui qui lui a fait du tort; et les mauvaises pensées passagères contre sa propre personne. Le Dr Salah al-Sawi (fatwa n° 78104, 6 mars 2009) a déjà répondu aux deux premières; quant à la troisième, il espère que les pensées fugaces qui s’évanouissent après réflexion sont pardonnables et lui conseille de glorifier son Prophète et de connaître sa valeur afin que de telles pensées ne reviennent jamais: « Lisez beaucoup dans sa Sira et ses Shamail et apprenez à mieux le connaître, car celui qui connaît le Messager de Dieu l’aime, et celui qui l’aime grandit en admiration devant lui. »"
