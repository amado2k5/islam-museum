id: work/fatwa-amja-evil-eye-real
class: work
kind: fatwa
label: { ar: "حقيقة العين والحسد", en: "The reality of the evil eye and envy", ur: "نظر بد اور حسد کی حقیقت", es: "La realidad del mal de ojo y la envidia", fr: "La réalité du mauvais œil et de l'envie", tr: "Gözün Gerçeği ve Kıskançlık", id: "Kebenaran Mata dan Iri" }
summary:
  ar: "سألت امرأة عانت من تراجع مستواها الدراسي هل حقيقي ما يقال من تعرض الإنسان للعين والحسد. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81873 بتاريخ 15 يوليو 2010)⁩ أن العين حق وقد تدخل الجمل القدر والرجل القبر ولا يكون من تأثيرها شيء إلا بإذن الله الكوني لقوله تعالى في السحر والسحرة وما هم بضارين به من أحد إلا بإذن الله، وأما التفريق بين ما يكون من السحر أو العين فهناك من المعالجين بالقرآن من أهل السنة من لديه هذه الدربة فلتبحث عن أحدهم من ذوي الديانة والكفاية، فإن هذا باب يكثر فيه الدجالون والمبطلون مما يقتضي التحري والتدقيق، ونسأل الله أن يمسح عليها بيمينه الشافية."
  en: "A woman whose academic standing had declined asked whether the evil eye and envy are real and can reach the point of effect. Dr. Salah al-Sawi (fatwa no. 81873, 15 July 2010) answered that the eye is real — it can bring a camel into a pot and a man into a grave — yet none of its effect happens except by God's cosmic permission, as He said of magic and magicians that they harm no one except by God's leave; for telling whether an affliction is from magic or the eye there are Quran-therapists among the Sunnis with the skill — let her seek one of them, religious and competent, for this door draws many impostors, demanding care and scrutiny — praying God wipe over her with His healing right hand. Recorded as AMJA's answer."
  ur: "ایک خاتون نے پوچھا کہ نظر بد اور حسد حقیقت ہیں اور اثر کر سکتے ہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81873، 15 جولائی 2010)⁩ کے مطابق نظر حق ہے مگر اس کا اثر اللہ کے اذن سے ہوتا ہے؛ قرآن سے علاج کرنے والے اہل سنت میں سے دینیات و اہلیت والے کو تلاش کرے۔"
  es: "Una mujer cuyo prestigio académico había disminuido preguntó si el mal de ojo y la envidia son reales y pueden tener efecto. El Dr. Salah al-Sawi (fatwa n.º 81873, 15 de julio de 2010) respondió que el mal de ojo es real —puede llevar a un camello a una olla y a un hombre a una tumba—, pero ninguno de sus efectos se produce sin el permiso cósmico de Dios, como Él dijo de la magia y los magos que no dañan a nadie sin el permiso de Dios; para discernir si una aflicción proviene de la magia o del mal de ojo, existen terapeutas coránicos entre los sunitas con la habilidad necesaria —que busque a uno de ellos, religioso y competente, pues esta puerta atrae a muchos impostores, que exigen cuidado y escrutinio—, rogando a Dios que la proteja con su mano derecha sanadora. Registrado como respuesta de AMJA."
  fr: "Une femme dont les résultats scolaires avaient décliné a demandé si le mauvais œil et l'envie étaient réels et pouvaient avoir des conséquences concrètes. Le Dr Salah al-Sawi (fatwa n° 81873, 15 juillet 2010) a répondu que le mauvais œil est réel – il peut faire entrer un chameau dans une marmite et un homme dans une tombe – mais que ses effets ne se produisent que par la permission divine, tout comme Il a dit de la magie et des magiciens qu'ils ne nuisent à personne sans Sa permission. Pour déterminer si un mal est dû à la magie ou au mauvais œil, il existe des coranistes sunnites compétents; qu'elle consulte l'un d'eux, pieux et compétent, car ce domaine attire de nombreux imposteurs, exigeant prudence et discernement. Elle a prié pour que Dieu la protège de Sa main guérisseuse. (Réponse rapportée par AMJA.)"
  tr: "Akademik başarısında düşüş yaşayan bir kadına bir kişinin nazar ve kıskançlığa maruz kalmasıyla ilgili söylenenlerin doğru olup olmadığını sordum. Dr. Salah Al-Sawy (15 Temmuz 2010 tarihli 81873 sayılı fetva) şöyle yanıt verdi: Nazar gerçektir, deve kader, insan mezara girer ve etkisinin ancak evrensel Allah'ın izniyle olur, Allah izni dışında kimseye zarar vermezler. Sihir ile nazar arasındaki ayrım konusunda, Ehl-sünnet arasında Kur'an'da bu yolu olanlar vardır. O halde, dini ve yetkin kişiler arasından birini arayın, çünkü bu konuda birçok sahtekar ve sakatlık artıyor, bu da araştırma ve inceleme gerektiriyor. Allah'tan sağ eliyle onu silmesini diliyoruz."
  id: "Saya bertanya kepada seorang wanita yang mengalami penurunan prestasi akademiknya apakah apa yang dikatakan tentang seseorang yang terpapar mata jahat dan iri itu benar. Dr. Salah Al-Sawy menjawab (Fatwa No. 81873 tanggal 15 Juli 2010) bahwa mata jahat itu nyata, dan unta memasuki takdir dan manusia masuk ke kubur, dan efeknya hanya dengan izin Allah universal, seperti yang Dia katakan tentang sihir dan penyihir, dan mereka tidak menyakiti siapa pun kecuali dengan izin Tuhan. Adapun membedakan antara sihir dan mata jahat, ada mereka yang diperlakukan oleh Al-Quran di antara Ahl al-Sunnah yang memiliki jalan ini. Jadi carilah salah satu dari mereka di antara mereka yang beragama, karena ini adalah topik di mana banyak penipu dan pembatalan bertambah besar, yang memerlukan penyelidikan dan pengawasan. Kita memohon kepada Tuhan untuk menghapus dirinya dengan tangan kanan-Nya yang menyembuhkan."
