label: { ar: "قرار مجمع الفقه الإسلامي الدولي 262 (7/26) بشأن الحوكمة الشرعية في المؤسسات المالية الإسلامية", en: "IIFA resolution 262 (7/26) on sharia governance in Islamic financial institutions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 262 (7/26): اسلامی مالیاتی اداروں میں شرعی حکمرانی", es: "Resolución 262 (7/26) de la IIFA sobre la gobernanza islámica en las instituciones financieras islámicas.", fr: "Résolution 262 (7/26) de l'IIFA sur la gouvernance de la charia dans les institutions financières islamiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 262 (7/26) İslami Finans Kurumlarında Şeriat Yönetişimi ile İlgili", id: "Resolusi Akademi Fiqh Islam Internasional 262 (26/7) mengenai Tata Kelola Syariah di Lembaga Keuangan Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي يعرّف الحوكمة الشرعية في المؤسسات المالية الإسلامية ويضع لها ضوابط. أكد المجمع قراره رقم 177 (3/19) في دور الرقابة الشرعية على البنوك الإسلامية وضوابط الاجتهاد والفتوى في الهيئات الشرعية. وعرّف الحوكمة الشرعية بأنها منظومة من الأنظمة والقواعد والسياسات والإجراءات تضبط الالتزام الشرعي وتوازن بين الأهداف الاقتصادية والامتثال والسمعة المؤسسية، ودعا إلى توحيد المرجعية الشرعية للصناعة المالية الإسلامية. وقرر أنه لا يجوز لإدارات المؤسسات أي سلطة تؤثر في استقلال أعضاء الهيئات الشرعية، وأن على الهيئات وجهات التصنيف والتدقيق الالتزام بقرارات المجمع وتجنب المنتجات التي منعها، وعلى السلطات الإشرافية حوكمة إصدارات الصكوك بما يضمن ملكية حملتها الحقيقية لموجوداتها وتحملهم تبعاتها."
  en: "A collective resolution of the International Islamic Fiqh Academy defining sharia governance in Islamic financial institutions and setting rules for it. The Academy reaffirmed its resolution 177 (3/19) on the role of sharia supervision in Islamic banks and the rules it laid down for ijtihad and fatwa in sharia boards. It defined sharia governance as a system of regulations, rules, policies and procedures that secures sharia compliance while balancing economic aims, compliance and institutional reputation, and called for a unified sharia reference for the Islamic finance industry. It resolved that institutions' management may hold no power that affects the independence of sharia board members; that boards, rating and audit bodies must follow the Academy's resolutions and avoid products it has barred; and that supervisory authorities must govern sukuk issues so that holders truly own the underlying assets and bear their consequences."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جو اسلامی مالیاتی اداروں میں شرعی حکمرانی کی تعریف اور اس کے ضوابط طے کرتی ہے۔ اکیڈمی نے اسلامی بینکوں میں شرعی نگرانی کے کردار اور شرعی بورڈوں میں اجتہاد و فتویٰ کے ضوابط سے متعلق اپنی قرارداد 177 (3/19) کی توثیق کی۔ اس نے شرعی حکمرانی کی تعریف ایسے نظاموں، قواعد، پالیسیوں اور طریقۂ کار کے مجموعے سے کی جو شرعی پابندی کو یقینی بنائے اور معاشی اہداف، تعمیل اور ادارہ جاتی ساکھ میں توازن رکھے، اور اسلامی مالیاتی صنعت کے لیے متحد شرعی مرجع کی دعوت دی۔ اس نے طے کیا کہ اداروں کی انتظامیہ کو شرعی بورڈ کے ارکان کی آزادی پر اثر انداز ہونے کا کوئی اختیار نہیں؛ بورڈ اور درجہ بندی و آڈٹ کے ادارے اکیڈمی کی قراردادوں کے پابند ہوں اور ممنوعہ مصنوعات سے بچیں؛ اور نگران ادارے صکوک کے اجرا کو اس طرح منظم کریں کہ حاملین واقعی اثاثوں کے مالک ہوں اور ان کے نتائج برداشت کریں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica que define la gobernanza de la sharia en las instituciones financieras islámicas y establece sus normas. La Academia reafirmó su resolución 177 (3/19) sobre el papel de la supervisión de la sharia en los bancos islámicos y las normas que estableció para el ijtihad y la fatwa en los consejos de la sharia. Definió la gobernanza de la sharia como un sistema de regulaciones, normas, políticas y procedimientos que garantiza el cumplimiento de la sharia, equilibrando los objetivos económicos, el cumplimiento y la reputación institucional, y solicitó una referencia unificada de la sharia para el sector de las finanzas islámicas. Resolvió que la administración de las instituciones no puede tener poder que afecte la independencia de los miembros del consejo de la sharia; que los consejos, los organismos de calificación y auditoría deben seguir las resoluciones de la Academia y evitar los productos que ha prohibido; y que las autoridades supervisoras deben regular las emisiones de sukuk de manera que los tenedores posean realmente los activos subyacentes y asuman sus consecuencias."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) définit la gouvernance conforme à la charia dans les institutions financières islamiques et établit des règles en la matière. L'Académie a réaffirmé sa résolution 177 (3/19) relative au rôle de la supervision de la charia dans les banques islamiques et les règles qu'elle a édictées concernant l'ijtihad et la fatwa au sein des comités de la charia. Elle définit la gouvernance conforme à la charia comme un système de réglementations, de règles, de politiques et de procédures garantissant le respect de la charia tout en conciliant objectifs économiques, conformité et réputation institutionnelle, et appelle à l'élaboration d'un référentiel unifié de la charia pour le secteur de la finance islamique. Elle a décidé que la direction des institutions ne peut détenir aucun pouvoir susceptible d'affecter l'indépendance des membres des comités de la charia; que les conseils d'administration, les organismes de notation et d'audit doivent se conformer aux résolutions de l'Académie et éviter les produits qu'elle a interdits; et que les autorités de surveillance doivent encadrer les émissions de sukuk de manière à ce que les détenteurs soient véritablement propriétaires des actifs sous-jacents et en assument les conséquences."
  tr: "Uluslararası İslami Fiqh Akademisi'nin İslami finans kurumlarında Şeriat yönetimini tanımlayan ve bunun için düzenlemeler koyan ortak kararı. Akademi, İslami bankalar üzerindeki Şeriat denetiminin rolü ve şeriat organlarındaki ectihad ile fetvanın kontrolüne ilişkin 177 (3/19) sayılı Kararını onaylamıştır. Şeriat yönetimini, Şeriat uyumunu düzenleyen ve ekonomik hedefler, uyum ve kurumsal itibarı dengeleyen sistemler, kurallar, politikalar ve prosedürler sistemi olarak tanımlamış ve İslami finans sektörü için Şeriat referansının birleştirilmesini talep etmiştir. Kurum yönetimlerinin Şeriat organlarının üyelerinin bağımsızlığını etkileme yetkisine sahip olamayacağına, kurullar ile sınıflandırma ve denetim otoritelerinin Akademi kararlarına uyması ve bunları yasaklayan ürünlerden kaçınması gerektiğine karar vermiştir. Denetim otoriteleri, sukuk ihraç işlemlerini gerçek sahiplerinin varlıklarına sahip olmasını ve sonuçlarını üstlenmesini sağlamak için yönetmelidir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional yang mendefinisikan tata kelola Syariah di lembaga keuangan Islam dan menetapkan regulasi untuknya. Akademi menegaskan Keputusan No. 177 (3/19) tentang peran pengawasan Syariah atas bank Islam dan pengendalian ijtihad serta fatwa dalam badan Syariah. Keputusan ini mendefinisikan tata kelola Syariah sebagai sistem sistem, aturan, kebijakan, dan prosedur yang mengatur kepatuhan Syariah serta menyeimbangkan tujuan ekonomi, kepatuhan, dan reputasi institusional, serta menyerukan penyatuan referensi Syariah untuk industri keuangan Islam. Keputusan tersebut memutuskan bahwa administrasi institusi tidak boleh memiliki kewenangan untuk mempengaruhi independensi anggota badan Syariah, dan bahwa dewan serta otoritas klasifikasi dan audit harus mematuhi keputusan Akademi serta menghindari produk yang melarangnya. Otoritas pengawas harus mengatur penerbitan sukuk untuk memastikan pemegang sebenarnya memiliki aset mereka dan menanggung konsekuensinya."
