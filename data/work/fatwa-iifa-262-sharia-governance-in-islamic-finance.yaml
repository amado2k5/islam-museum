label: { ar: "قرار مجمع الفقه الإسلامي الدولي 262 (7/26) بشأن الحوكمة الشرعية في المؤسسات المالية الإسلامية", en: "IIFA resolution 262 (7/26) on sharia governance in Islamic financial institutions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 262 (7/26): اسلامی مالیاتی اداروں میں شرعی حکمرانی" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي يعرّف الحوكمة الشرعية في المؤسسات المالية الإسلامية ويضع لها ضوابط. أكد المجمع قراره رقم 177 (3/19) في دور الرقابة الشرعية على البنوك الإسلامية وضوابط الاجتهاد والفتوى في الهيئات الشرعية. وعرّف الحوكمة الشرعية بأنها منظومة من الأنظمة والقواعد والسياسات والإجراءات تضبط الالتزام الشرعي وتوازن بين الأهداف الاقتصادية والامتثال والسمعة المؤسسية، ودعا إلى توحيد المرجعية الشرعية للصناعة المالية الإسلامية. وقرر أنه لا يجوز لإدارات المؤسسات أي سلطة تؤثر في استقلال أعضاء الهيئات الشرعية، وأن على الهيئات وجهات التصنيف والتدقيق الالتزام بقرارات المجمع وتجنب المنتجات التي منعها، وعلى السلطات الإشرافية حوكمة إصدارات الصكوك بما يضمن ملكية حملتها الحقيقية لموجوداتها وتحملهم تبعاتها."
  en: "A collective resolution of the International Islamic Fiqh Academy defining sharia governance in Islamic financial institutions and setting rules for it. The Academy reaffirmed its resolution 177 (3/19) on the role of sharia supervision in Islamic banks and the rules it laid down for ijtihad and fatwa in sharia boards. It defined sharia governance as a system of regulations, rules, policies and procedures that secures sharia compliance while balancing economic aims, compliance and institutional reputation, and called for a unified sharia reference for the Islamic finance industry. It resolved that institutions' management may hold no power that affects the independence of sharia board members; that boards, rating and audit bodies must follow the Academy's resolutions and avoid products it has barred; and that supervisory authorities must govern sukuk issues so that holders truly own the underlying assets and bear their consequences."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جو اسلامی مالیاتی اداروں میں شرعی حکمرانی کی تعریف اور اس کے ضوابط طے کرتی ہے۔ اکیڈمی نے اسلامی بینکوں میں شرعی نگرانی کے کردار اور شرعی بورڈوں میں اجتہاد و فتویٰ کے ضوابط سے متعلق اپنی قرارداد 177 (3/19) کی توثیق کی۔ اس نے شرعی حکمرانی کی تعریف ایسے نظاموں، قواعد، پالیسیوں اور طریقۂ کار کے مجموعے سے کی جو شرعی پابندی کو یقینی بنائے اور معاشی اہداف، تعمیل اور ادارہ جاتی ساکھ میں توازن رکھے، اور اسلامی مالیاتی صنعت کے لیے متحد شرعی مرجع کی دعوت دی۔ اس نے طے کیا کہ اداروں کی انتظامیہ کو شرعی بورڈ کے ارکان کی آزادی پر اثر انداز ہونے کا کوئی اختیار نہیں؛ بورڈ اور درجہ بندی و آڈٹ کے ادارے اکیڈمی کی قراردادوں کے پابند ہوں اور ممنوعہ مصنوعات سے بچیں؛ اور نگران ادارے صکوک کے اجرا کو اس طرح منظم کریں کہ حاملین واقعی اثاثوں کے مالک ہوں اور ان کے نتائج برداشت کریں۔"
