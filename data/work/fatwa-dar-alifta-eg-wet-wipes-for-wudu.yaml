label: { ar: "حكم استخدام المناديل المبللة بالماء في الوضوء", en: "Using water-moistened wipes for wudu", ur: "وضو کے لیے تر وائپس کا استعمال", es: "Usar toallitas húmedas para el wudu.", fr: "Utilisation de lingettes humides pour les ablutions" }
summary:
  ar: "سائل سأل عن استخدام المناديل المبللة بالماء في الوضوء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21966)⁩ أنه يشترط لصحة الوضوء جريان الماء على الأعضاء الواجب غسلها ولا يصح الاكتفاء بالمسح عليها، وبيّن الجواب حكم استعمال المناديل المبللة على هذا الأصل."
  en: "A questioner asked about using water-moistened wipes for wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21966) answered that valid wudu requires water to flow over the limbs that must be washed — wiping alone does not suffice; the answer sets out the ruling on moist wipes on that basis."
  ur: "ایک سائل نے وضو کے لیے تر وائپس کے استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21966)⁩ نے جواب دیا کہ صحیح وضو کے لیے واجب اعضاء پر پانی کا بہنا شرط ہے اور صرف مسح کافی نہیں؛ اسی بنا پر تر وائپس کا حکم جواب میں بیان ہوا۔"
  es: "Una persona preguntó sobre el uso de toallitas húmedas para el wudu. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21966) respondió que el wudu válido requiere que el agua fluya sobre las extremidades que deben lavarse; limpiarlas solas no es suficiente. La respuesta expone la norma sobre las toallitas húmedas sobre esa base."
  fr: "Une personne a posé une question concernant l'utilisation de lingettes humides pour les ablutions. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21966) a répondu que des ablutions valides nécessitent que l'eau coule sur les membres à laver; s'essuyer le corps ne suffit pas. La réponse expose la règle relative aux lingettes humides sur cette base."
