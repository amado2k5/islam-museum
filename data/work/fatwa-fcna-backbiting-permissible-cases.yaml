label: { ar: "ما هي الحالات التي تجوز فيها الغيبة؟", en: "In Which Cases Is Backbiting Permissible?", ur: "کون سے حالات میں غیبت جائز ہے؟", es: "¿En qué casos está permitido hablar mal de los demás a espaldas de los demás?", fr: "Dans quels cas la médisance est-elle permise ?", tr: "Hangi durumlarda sırt ifadesi yapılabilir?", id: "Dalam kasus apa saja penghinaan diperbolehkan?" }
summary:
  ar: "سؤال عن الحالات التي تجوز فيها الغيبة. أجاب المجلس الفقهي لأمريكا الشمالية باستعراض الأصل في تحريم الغيبة ثم الاستثناءات التي أجازها الفقهاء كالتظلم والاستفتاء والاستعانة والتحذير من أهل الأذى ونحوها، مع ضابط الحاجة في كل حالة."
  en: "A question on the cases in which backbiting is permissible. The Fiqh Council of North America answered by restating the norm of its prohibition, then the exceptions the jurists allow — seeking redress of a wrong, seeking a ruling, seeking help, warning against harm-doers and the like — with need as the governing condition in each case."
  ur: "سوال: کن حالات میں غیبت جائز ہے؟ فقہ کونسل آف نارتھ امریکہ نے جواب میں پہلے اس کے تحریم کا اصول بیان کیا پھر فقہاء کی اجازت یافتہ استثنائات — شکایتِ مظلومیت، فتویٰ طلبی، مدد طلبی، نقصان پہنچانے والوں سے آگاہ کرنا وغیرہ — اور ہر حال میں ضرورت کا ضابط بطور شرط۔"
  es: "Se planteó una pregunta sobre los casos en los que la difamación es permisible. El Consejo de Jurisprudencia Islámica de Norteamérica respondió reiterando la norma de su prohibición y luego las excepciones que permiten los juristas: buscar reparación por un agravio, solicitar un dictamen, pedir ayuda, advertir sobre quienes causan daño, etc., siendo la necesidad la condición determinante en cada caso."
  fr: "Une question portait sur les cas où la médisance est permise. Le Conseil de jurisprudence islamique d'Amérique du Nord a répondu en réaffirmant la norme de son interdiction, puis en énumérant les exceptions admises par les juristes — demander réparation d'un tort, solliciter une décision, demander de l'aide, mettre en garde contre les personnes malveillantes, etc. — le besoin étant la condition déterminante dans chaque cas."
  tr: "Sırtından iğrenmenin izin verilen durumlarla ilgili bir soru. Kuzey Amerika Hukuk Komitesi, sırttan ibaretin yasaklanmasına ilişkin ilkeyi, ardından hukukçuların izin verdiği istisnaları (temyizler, dini kararlar arama, yardım isteme, zararlı kişilere karşı uyarılar ve benzeri) her durumda zorunluluk kriteriyle inceleyerek yanıt verdi."
  id: "Sebuah pertanyaan tentang kasus-kasus di mana fitnah diperbolehkan. Dewan Yurisprudensi Amerika Utara menanggapi dengan meninjau prinsip mengenai larangan fitnah, lalu pengecualian yang diizinkan oleh ahli hukum, seperti banding, mencari putusan agama, mencari bantuan, peringatan terhadap orang berbahaya, dan sejenisnya, dengan kriteria kebutuhan dalam setiap kasus."
