summary:
  ar: "كتاب مارك زبروفسكي (1983) يعيد بناء التصوير في سلطنات الدكن من أواخر القرن السادس عشر إلى الفتح المغولي في ثمانينيات القرن السابع عشر، ثم في حيدرآباد والأقاليم حتى القرن التاسع عشر {cite:zebrowski-deccani-painting-1983 p. 1}."
  en: "Mark Zebrowski's book (1983) reconstructing painting in the Deccan sultanates from the late sixteenth century to the Mughal conquest of the 1680s, and then at Hyderabad and the provinces into the nineteenth century {cite:zebrowski-deccani-painting-1983 p. 1}."
  ur: "مارک زیبروسکی کی کتاب (1983) جو دکن کی سلطنتوں میں سولہویں صدی کے آخر سے 1680ء کی دہائی کی مغل فتح تک، اور پھر حیدرآباد اور صوبوں میں انیسویں صدی تک کی مصوری کی تشکیلِ نو کرتی ہے {cite:zebrowski-deccani-painting-1983 p. 1}۔"
  es: "El libro de Mark Zebrowski (1983) reconstruye la pintura en los sultanatos del Decán desde finales del siglo XVI hasta la conquista mogol de la década de 1680, y luego en Hyderabad y las provincias hasta el siglo XIX {cite:zebrowski-deccani-painting-1983 p. 1}."
  fr: "Le livre de Mark Zebrowski (1983) reconstruit la peinture dans les sultanats du Deccan de la fin du XVIe siècle à la conquête moghole des années 1680, puis à Hyderabad et dans les provinces jusqu'au XIXe siècle {cite:zebrowski-deccani-painting-1983 p. 1}."
  tr: "Mark Zebrowski'nin kitabı (1983), 16. yüzyıl sonlarından 1880'lerdeki Babür fetihine kadar Dekkan sultanlıklarında resim yapımı yeniden yapılandırır; ardından Haydarabad ve eyaletlerde 19. yüzyıla kadar sürmüştür {cite:Zebrowski-deccani-painting-1983 s. 1}."
  id: "Buku Mark Zebrowski (1983) merekonstruksi lukisan di kesultanan Deccan dari akhir abad ke-16 hingga penaklukan Mughal pada tahun 1880-an, kemudian di Hyderabad dan provinsi-provinsi hingga abad ke-19 {cite:Zebrowski-deccani-painting-1983 hlm. 1}."
