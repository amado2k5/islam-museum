summary:
  ar: "قوالي لحّنه أ. ر. رحمن لفيلم «روكستار» الهندي سنة 2011 وأهداه إلى الصوفي نظام الدين أولياء، يغنيه رحمن مع جاويد علي وموهيت تشوهان والإخوة نظامي، بكلمات إرشاد كامل؛ كتبه للمشهد الذي يلجأ فيه بطل الفيلم إلى ضريح نظام الدين في دلهي ويعيش مع القوالين، ونال جائزة ميرتشي لأغنية تمثل التقليد الصوفي."
  en: "A qawwali composed by A. R. Rahman for the 2011 Hindi film Rockstar and dedicated to the Sufi saint Nizamuddin Auliya, sung by Rahman with Javed Ali, Mohit Chauhan and the Nizami Bandhu to lyrics by Irshad Kamil; written for the scene in which the hero takes refuge at the Nizamuddin Dargah in Delhi among the qawwals, it won a Mirchi Music Award as a song representing the Sufi tradition."
  ur: "اے آر رحمان کی قوالی جو 2011 کی ہندی فلم «راک اسٹار» کے لیے بنی اور صوفی بزرگ نظام الدین اولیا کے نام کی گئی؛ رحمان، جاوید علی، موہت چوہان اور نظامی بندھو نے ارشاد کامل کے بولوں پر گائی، اور یہ اس منظر کے لیے لکھی گئی جب ہیرو دلی کی درگاہ نظام الدین میں قوالوں کے ساتھ رہتا ہے۔"
