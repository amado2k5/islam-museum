summary:
  ar: "الكامل في التاريخ لعز الدين ابن الأثير الجزري (ت 630هـ)، تاريخ عام على السنين من بدء الخلق إلى أيامه، اعتمد فيه على تاريخ الطبري وزاد عليه أخبار المغرب والأندلس والدولة الأتابكية والحروب الصليبية. وفي شذرات الذهب التاريخ المشهور بالكامل على الحوادث والسنين في عشر مجلدات وهو من خيار التواريخ ابتدأ فيه من أول الزمان إلى سنة تسع وعشرين وست مئة {cite:shadharat-dhahab p. 137}."
  en: "Ibn al-Athir's universal annalistic history — built on al-Tabari with added Maghreb, Andalus, Zangid and Crusade coverage."
