summary:
  ar: "الكامل في التاريخ لعز الدين ابن الأثير الجزري ⁦(ت 630هـ)⁩، تاريخ عام على السنين من بدء الخلق إلى أيامه، اعتمد فيه على تاريخ الطبري وزاد عليه أخبار المغرب والأندلس والدولة الأتابكية والحروب الصليبية. وفي شذرات الذهب التاريخ المشهور بالكامل على الحوادث والسنين في عشر مجلدات وهو من خيار التواريخ ابتدأ فيه من أول الزمان إلى سنة تسع وعشرين وست مئة {cite:shadharat-dhahab p. 137}."
  en: "Ibn al-Athir's universal annalistic history — built on al-Tabari with added Maghreb, Andalus, Zangid and Crusade coverage."
  es: "La historia analística universal de Ibn al-Athir, basada en la obra de al-Tabari con la adición de información sobre el Magreb, Al-Ándalus, la dinastía Zangí y las Cruzadas."
  fr: "L'histoire annalistique universelle d'Ibn al-Athir — construite sur al-Tabari avec une couverture supplémentaire du Maghreb, d'Andalousie, des Zangides et des croisades."
  ur: "ابن الثیر کی عالمگیر تجزیاتی تاریخ - مغرب، اندلس، زنگید اور صلیبی جنگ کی اضافی کوریج کے ساتھ الطبری پر بنائی گئی ہے۔"
  tr: "Izz al-Din Ibn al-Athir al-Jazari (ö. 630 Hicri) tarafından yazılmış Al-Kamil fi al-Tarikh, yaratılışın başlangıcından günlerine kadar olan yılların genel bir tarihini anlatır; el-Tabari'nin tarihine dayanır ve Mağrip, el-Endülüs, Atabeg devleti ve Haçlı Seferleri hakkında haberler ekler. Şadharat al-Dhahab'da ünlü tarih, olaylar ve yıllar üzerine on cilt halinde tamamlanmıştır ve zamanın başlangıcından 629 Hicri yılına kadar en iyi kronikler arasında yer alır {cite:shadharat-dhahab, s. 137}."
  id: "Al-Kamil fi al-Tarikh oleh Izz al-Din Ibn al-Athir al-Jazari (wafat 630 H), sebuah sejarah umum tentang tahun-tahun dari awal penciptaan hingga hari-harinya, yang mengandalkan sejarah al-Tabari dan menambahkan berita tentang Maghreb, al-Andalus, negara Atabeg, dan Perang Salib. Dalam Shadharat al-Dhahab, sejarah terkenal lengkap tentang peristiwa dan tahun dalam sepuluh jilid, dan merupakan salah satu kronik terbaik, dimulai dari awal waktu hingga tahun 629 H {cite:shadharat-dhahab, hlm. 137}."
