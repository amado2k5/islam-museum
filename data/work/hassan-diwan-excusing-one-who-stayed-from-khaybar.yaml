summary:
  ar: "أبيات لحسان بن ثابت من الطويل على روي الراء، يعذر بها إياس بن عبيد وأمه أم أيمن وقد تخلف عن خيبر، وفي النص ذكر أيمن {{cite:sharh-diwan-hassan-barquqi-1929 p.201}}."
  en: "Verses by Hassan ibn Thabit in the tawil metre on the rhyme ra', excusing Iyas ibn Ubayd (whose mother is Umm Ayman), who stayed behind from Khaybar; the text itself names Ayman {{cite:sharh-diwan-hassan-barquqi-1929 p.201}}."
