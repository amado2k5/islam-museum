label: { ar: "أبيات حسان في عذر من تخلف عن خيبر «على حين أن قالت لأيمن أمه»", en: "Hassan's verses excusing one who stayed behind from Khaybar", es: "Los versos de Hassan excusan a quien se quedó atrás de Khaybar.", fr: "Les vers d'Hassan excusent celui qui est resté à Khaybar", ur: "حسن کی آیات خیبر سے پیچھے رہنے والے کا عذر" }
summary:
  ar: "أبيات لحسان بن ثابت من الطويل على روي الراء، يعذر بها إياس بن عبيد وأمه أم أيمن وقد تخلف عن خيبر، وفي النص ذكر أيمن {{cite:sharh-diwan-hassan-barquqi-1929 p.201}}."
  en: "Verses by Hassan ibn Thabit in the tawil metre on the rhyme ra', excusing Iyas ibn Ubayd (whose mother is Umm Ayman), who stayed behind from Khaybar; the text itself names Ayman {{cite:sharh-diwan-hassan-barquqi-1929 p.201}}."
  es: "Versos de Hassan ibn Thabit en metro tawil sobre la rima ra', excusando a Iyas ibn Ubayd (cuya madre es Umm Ayman), que se quedó atrás de Khaybar; el texto mismo nombra a Ayman {{cite:sharh-diwan-hassan-barquqi-1929 p.201}}."
  fr: "Vers de Hassan ibn Thabit dans le mètre tawil sur la rime ra', excusant Iyas ibn Ubayd (dont la mère est Umm Ayman), qui est resté de Khaybar; le texte lui-même nomme Ayman {{cite:sharh-diwan-hassan-barquqi-1929 p.201}}."
  ur: "حسن بن ثابت کی آیات تاویل میٹر میں نظم رع میں، ایاس بن عبید ⁦(جن کی والدہ ام ایمن ہیں)⁩ کو معاف کرتے ہوئے، جو خیبر سے پیچھے رہ گئے تھے۔ متن خود ایمن کا نام رکھتا ہے {{حوالہ:شارح-دیوان-حسن برقوی-1929 صفحہ 201}}۔"
