summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: الأصل الذي تقرره النصوص والقواعد الشرعية ترك الناس أحرارًا في بيعهم وشرائهم وتصرفهم في ممتلكاتهم في إطار أحكام الشريعة وضوابطها، وبيّن متى يجوز التدخل في تحديد الأرباح على ما فصّل القرار."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on fixing merchants' profits: the principle established by texts and sharia rules is leaving people free in selling, buying and disposing of their property within the bounds and controls of the sharia, and it sets out when intervention in profit-fixing is permitted."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: اصل یہ ہے کہ لوگ خرید و فروخت میں آزاد ہیں؛ منافع مقرر کرنے میں مداخلت کی صورتیں بیان ہوئیں۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre la fijación de los beneficios de los comerciantes: el principio establecido por los textos y las normas de la sharia es dejar a las personas libres para vender, comprar y disponer de sus bienes dentro de los límites y controles de la sharia, y establece cuándo se permite la intervención en la fijación de beneficios."
