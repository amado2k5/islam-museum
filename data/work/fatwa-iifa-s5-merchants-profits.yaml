label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن تحديد أرباح التجار", en: "IIFA resolution on fixing merchants' profits", ur: "اکیڈمی کی قرارداد: تاجروں کے منافع کا تعین", es: "Resolución de la IIFA sobre la fijación de los beneficios de los comerciantes.", fr: "Résolution de l'IIFA sur la fixation des bénéfices des commerçants", tr: "Uluslararası İslami Fıkıh Akademisi'nin tüccarların kârlarının belirlenmesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penentuan keuntungan pedagang" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: الأصل الذي تقرره النصوص والقواعد الشرعية ترك الناس أحرارًا في بيعهم وشرائهم وتصرفهم في ممتلكاتهم في إطار أحكام الشريعة وضوابطها، وبيّن متى يجوز التدخل في تحديد الأرباح على ما فصّل القرار."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on fixing merchants' profits: the principle established by texts and sharia rules is leaving people free in selling, buying and disposing of their property within the bounds and controls of the sharia, and it sets out when intervention in profit-fixing is permitted."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: اصل یہ ہے کہ لوگ خرید و فروخت میں آزاد ہیں؛ منافع مقرر کرنے میں مداخلت کی صورتیں بیان ہوئیں۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre la fijación de los beneficios de los comerciantes: el principio establecido por los textos y las normas de la sharia es dejar a las personas libres para vender, comprar y disponer de sus bienes dentro de los límites y controles de la sharia, y establece cuándo se permite la intervención en la fijación de beneficios."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988) sur la fixation des profits des commerçants: le principe établi par les textes et les règles de la charia consiste à laisser les gens libres de vendre, d'acheter et de disposer de leurs biens dans les limites et sous le contrôle de la charia, et elle précise quand une intervention dans la fixation des profits est autorisée."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin beşinci oturumunda (Kuveyt, Aralık 1988) karar aldığı karar: Metinler ve Şeriat kurallarıyla belirlenen ilke, insanların Şeriat hükümleri ve düzenlemeleri çerçevesinde mülklerini satma, satın alma ve elden çıkarma özgürlüğüne sahip olmalarını sağlamak ve kararda belirtilen kâr belirlemeye müdahale etmenin ne zaman mümkün olduğunu netleştirmektir."
  id: "Keputusan International Islamic Fiqh Academy dalam sesi kelimanya (Kuwait, Desember 1988): Prinsip yang ditetapkan oleh teks dan aturan Syariah adalah membiarkan orang bebas menjual, membeli, dan menjual properti mereka dalam kerangka putusan dan peraturan Syariah, serta memperjelas kapan diperbolehkan untuk campur tangan dalam menentukan keuntungan sebagaimana ditentukan dalam keputusan."
