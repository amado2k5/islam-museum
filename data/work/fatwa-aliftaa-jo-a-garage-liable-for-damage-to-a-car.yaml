id: work/fatwa-aliftaa-jo-a-garage-liable-for-damage-to-a-car
class: work
kind: fatwa
label: { ar: "ضمان صاحب الكراج لما تلف من سيارة في يده", en: "A garage owner's liability for damage to a car in his hands", ur: "گیراج مالک کی اپنے پاس موجود گاڑی کو پہنچنے والے نقصان کی ذمہ داری" }
summary:
  ar: "سؤال عن سيارة في محل تصليح تحركت أثناء تشغيل صاحب المحل لها فاصطدمت بسيارة أخرى، أجابت فيه دائرة الإفتاء العام الأردنية بأن صاحب الكراج أجير مشترك يضمن ما تلف في يده، ولا شيء على مالك السيارة إلا إذا نجم التلف عن حادث لا يمكن التحرز منه. أجابت الدائرة بأن أصحاب الحرف كالنجارين والخياطين ومن يعملون في صيانة المركبات يسمون عند الفقهاء أجراء مشتركين لأنهم يتقبلون العمل من أكثر من شخص، وأنهم ضامنون، وهو مذهب الحنفية وقول عند الشافعية، ونصت عليه مجلة الأحكام العدلية في المادة 611 بضمان الأجير المشترك ما تولد عن فعله سواء كان بتعدٍّ وتقصير أم لا. ونقلت تعليل البابرتي في العناية شرح الهداية بأن تضمين الأجير المشترك استحسان عند الصاحبين صيانة لأموال الناس، لأنه يقبل أعيانًا كثيرة رغبة في الأجر وقد يعجز عن حفظها. وذكرت أن هذا الضمان مقيد بثلاثة شروط نقلتها عن حاشية ابن عابدين: أن يكون في قدرة الأجير دفع التلف، وأن يكون محل العمل مسلّمًا إليه، وأن يكون المضمون مما يجوز ضمانه بالعقد فلا يُضمن الآدمي. وخلصت إلى أن مالك المركبة إذا دفعها لصاحب مرآب الصيانة دخلت في ضمانه، فيضمن كل ما تلف في يده لأنه أجير مشترك، ولا شيء على مالك المركبة إلا إذا نجم التلف عن حادث لا يمكن التحرز منه."
  en: "A question about a car at a repair shop that moved while the owner of the shop was starting it and hit another car, in which Jordan's General Iftaa Department answered that the garage owner is a common hired worker liable for what is damaged in his hands, and the car owner owes nothing unless the damage came from an accident that could not be guarded against. The Department answered that craftsmen such as carpenters, tailors and those who maintain vehicles are called common hired workers by the jurists, since they take work from more than one person, and that they are liable; this is the Hanafi school and one view among the Shafi'is, and article 611 of the Majalla states that a common hired worker is liable for harm arising from his act whether or not he transgressed or was negligent. It quoted al-Babarti in al-Inaya, his commentary on al-Hidaya, explaining that holding the common worker liable is a juristic preference of the two companions of Abu Hanifa to protect people's property, since he accepts many items out of desire for more pay and may be unable to guard them all. It noted that this liability is bound by three conditions, quoted from Ibn Abidin's gloss: that the worker could have prevented the damage, that the item was handed over to him, and that the thing is of a kind that can be guaranteed by contract, so a human being is not. It concluded that once the car owner hands his vehicle to the garage owner it enters the garage owner's liability, so he is liable for everything damaged in his hands as a common hired worker, and the car owner owes nothing unless the damage arose from an accident that could not be guarded against."
  ur: "مرمت کی دکان پر موجود ایک گاڑی کے بارے میں سوال جو دکان کے مالک کے اسٹارٹ کرنے پر چل پڑی اور دوسری گاڑی سے ٹکرا گئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ گیراج کا مالک اجیر مشترک ہے جو اپنے ہاتھ میں ہونے والے نقصان کا ضامن ہے، اور گاڑی کے مالک پر کچھ نہیں سوائے اس کے کہ نقصان ایسے حادثے سے ہو جس سے بچنا ممکن نہ تھا۔ ڈیپارٹمنٹ نے جواب دیا کہ بڑھئی، درزی اور گاڑیوں کی مرمت کرنے والے جیسے کاریگروں کو فقہا اجیر مشترک کہتے ہیں کیونکہ وہ ایک سے زیادہ لوگوں کا کام لیتے ہیں، اور وہ ضامن ہیں؛ یہ حنفی مذہب اور شوافع کا ایک قول ہے، اور مجلۃ الاحکام العدلیہ کی دفعہ 611 میں ہے کہ اجیر مشترک اپنے فعل سے پیدا ہونے والے نقصان کا ضامن ہے چاہے اس نے زیادتی یا کوتاہی کی ہو یا نہیں۔ اس نے الہدایہ کی شرح العنایہ میں بابرتی کی یہ توجیہ نقل کی کہ اجیر مشترک کو ضامن ٹھہرانا ابو حنیفہ کے دونوں شاگردوں کے نزدیک لوگوں کے مال کی حفاظت کے لیے استحسان ہے، کیونکہ وہ زیادہ اجرت کی خاطر بہت سی چیزیں قبول کرتا ہے اور ممکن ہے سب کی حفاظت نہ کر سکے۔ اس نے ذکر کیا کہ یہ ضمان تین شرطوں سے مقید ہے جو اس نے حاشیہ ابن عابدین سے نقل کیں: نقصان روکنا اجیر کے بس میں ہو، کام کی چیز اس کے حوالے کی گئی ہو، اور وہ چیز ایسی ہو جس کا معاہدے سے ضمان ہو سکے، لہٰذا انسان کا ضمان نہیں۔ اس نے نتیجہ نکالا کہ جب گاڑی کا مالک اپنی گاڑی گیراج والے کے حوالے کرے تو وہ اس کے ضمان میں آ جاتی ہے، لہٰذا اجیر مشترک ہونے کی وجہ سے وہ اپنے ہاتھ میں ہونے والے ہر نقصان کا ضامن ہے، اور گاڑی کے مالک پر کچھ نہیں سوائے اس کے کہ نقصان ایسے حادثے سے ہو جس سے بچنا ممکن نہ تھا۔"
