summary:
  ar: "رسالة مفقودة لـ[[person/al-battani|البتاني]] عملها للوزير أبي الحسن علي بن محمد بن الفرات، وعنوانها هو عنوان الباب الرابع والخمسين من الزيج في مطارح الشعاعات {cite:nallino-albatenii-opus-astronomicum p. 28}."
  en: "A lost epistle by [[person/al-battani|al-Battani]] written for the vizier Abu al-Hasan Ali ibn Muhammad ibn al-Furat; its title is that of chapter 54 of the Zij, on the projection of rays {cite:nallino-albatenii-opus-astronomicum p. 28}."
  ur: "[[person/al-battani|البتانی]] کا ایک گمشدہ رسالہ جو وزیر ابو الحسن علی بن محمد بن الفرات کے لیے لکھا گیا؛ اس کا عنوان زیج کے چون ویں باب ⁦(شعاعوں کے مطارح)⁩ کا عنوان ہے {cite:nallino-albatenii-opus-astronomicum p. 28}."
  es: "Una epístola perdida de al-Battani escrita para el visir Abu al-Hasan Ali ibn Muhammad ibn al-Furat; su título es el del capítulo 54 del Zij, sobre la proyección de rayos {citar:nallino-albatenii-opus-astronomicum p. 28}."
  fr: "Une épître perdue de [[person/al-battani|al-Battani]] écrite pour le vizir Abu al-Hasan Ali ibn Muhammad ibn al-Furat; son titre est celui du chapitre 54 du Zij, sur la projection des rayons {cite:nallino-albatenii-opus-astronomicum p. 28}."
  tr: "[[kişi/al-battani|al-Battani]] tarafından yazılan, bakan Abu al-Hasan Ali ibn Muhammed ibn al-Furat tarafından yazılan kayıp bir mektup, Radial Places bölümünde Zij'in elli dördüncü bölümü başlığı olarak adlandırılmıştır {cite:nallino-albatenii-opus-astronomicum s. 28}."
  id: "Surat yang hilang oleh [[orang/al-battani|al-Battani]] yang ditulis oleh menteri Abu al-Hasan Ali ibn Muhammad ibn al-Furat, berjudul sebagai judul bab lima puluh empat Zij di Radial Places {cite:nallino-albatenii-opus-astronomicum hlm. 28}."
