label: { ar: "أبيات الفرزدق في الأقرع بن حابس وأسرى بني العنبر", en: "Al-Farazdaq's verses on al-Aqra' ibn Habis and the captives of Banu al-Anbar", es: "Versos de Al-Farazdaq sobre al-Aqra' ibn Habis y los cautivos de Banu al-Anbar", fr: "Versets d'Al-Farazdaq sur al-Aqra' ibn Habis et les captifs de Banu al-Anbar" }
summary:
  ar: "ثلاثة أبيات من قصيدة للفرزدق يوردها ابن هشام عقب خبر سبي بني العنبر: أن ابن حابس قام عند رسول الله بخطة حازم طامح إلى المجد، فأُطلق له الأسرى الذين في الحبال مغللة أعناقهم، وكفى أمهات الخالفين غلاء الفداء وسهام المقاسم."
  en: "Three verses from a longer poem by al-Farazdaq that Ibn Hisham quotes after the account of the Banu al-Anbar captives: that Ibn Habis stood before the Messenger of God with a resolute, glory-seeking plea, and the captives bound in ropes with fettered necks were released for him, sparing the mothers of those left behind the price of ransom and the arrows of the division of spoils."
  es: "Tres versos de un poema más extenso de al-Farazdaq que Ibn Hisham cita después del relato de los cautivos de Banu al-Anbar: que Ibn Habis se presentó ante el Mensajero de Dios con una súplica resuelta y gloriosa, y los cautivos atados con cuerdas y con el cuello encadenado fueron liberados para él, evitando así a las madres de los que quedaron atrás el precio del rescate y las flechas del reparto del botín."
  fr: "Trois vers d'un poème plus long d'al-Farazdaq qu'Ibn Hisham cite après le récit des captifs de Banu al-Anbar: qu'Ibn Habis se présenta devant le Messager de Dieu avec une plaidoirie résolue et glorieuse, et que les captifs liés par des cordes et enchaînés par le cou furent libérés pour lui, épargnant ainsi aux mères de ceux qui restaient le prix de la rançon et les flèches du partage du butin."
