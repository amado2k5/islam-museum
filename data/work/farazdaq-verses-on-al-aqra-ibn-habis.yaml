summary:
  ar: "ثلاثة أبيات من قصيدة للفرزدق يوردها ابن هشام عقب خبر سبي بني العنبر: أن ابن حابس قام عند رسول الله بخطة حازم طامح إلى المجد، فأُطلق له الأسرى الذين في الحبال مغللة أعناقهم، وكفى أمهات الخالفين غلاء الفداء وسهام المقاسم."
  en: "Three verses from a longer poem by al-Farazdaq that Ibn Hisham quotes after the account of the Banu al-Anbar captives: that Ibn Habis stood before the Messenger of God with a resolute, glory-seeking plea, and the captives bound in ropes with fettered necks were released for him, sparing the mothers of those left behind the price of ransom and the arrows of the division of spoils."
