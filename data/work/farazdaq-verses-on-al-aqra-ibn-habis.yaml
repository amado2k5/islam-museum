label: { ar: "أبيات الفرزدق في الأقرع بن حابس وأسرى بني العنبر", en: "Al-Farazdaq's verses on al-Aqra' ibn Habis and the captives of Banu al-Anbar", es: "Versos de Al-Farazdaq sobre al-Aqra' ibn Habis y los cautivos de Banu al-Anbar", fr: "Versets d'Al-Farazdaq sur al-Aqra' ibn Habis et les captifs de Banu al-Anbar", ur: "الفرزدق کی آیات الاقراء ابن حابس اور بنو الانبار کے اسیروں کے بارے میں", tr: "El-Ferazdaq'ın El-Aqra' ibn Habis ve Banu el-Anbar'ın esirleri hakkındaki dizeleri", id: "Ayat-ayat Al-Farazdaq tentang Al-Aqra' ibn Habis dan tawanan Banu Al-Anbar" }
summary:
  ar: "ثلاثة أبيات من قصيدة للفرزدق يوردها ابن هشام عقب خبر سبي بني العنبر: أن ابن حابس قام عند رسول الله بخطة حازم طامح إلى المجد، فأُطلق له الأسرى الذين في الحبال مغللة أعناقهم، وكفى أمهات الخالفين غلاء الفداء وسهام المقاسم."
  en: "Three verses from a longer poem by al-Farazdaq that Ibn Hisham quotes after the account of the Banu al-Anbar captives: that Ibn Habis stood before the Messenger of God with a resolute, glory-seeking plea, and the captives bound in ropes with fettered necks were released for him, sparing the mothers of those left behind the price of ransom and the arrows of the division of spoils."
  es: "Tres versos de un poema más extenso de al-Farazdaq que Ibn Hisham cita después del relato de los cautivos de Banu al-Anbar: que Ibn Habis se presentó ante el Mensajero de Dios con una súplica resuelta y gloriosa, y los cautivos atados con cuerdas y con el cuello encadenado fueron liberados para él, evitando así a las madres de los que quedaron atrás el precio del rescate y las flechas del reparto del botín."
  fr: "Trois vers d'un poème plus long d'al-Farazdaq qu'Ibn Hisham cite après le récit des captifs de Banu al-Anbar: qu'Ibn Habis se présenta devant le Messager de Dieu avec une plaidoirie résolue et glorieuse, et que les captifs liés par des cordes et enchaînés par le cou furent libérés pour lui, épargnant ainsi aux mères de ceux qui restaient le prix de la rançon et les flèches du partage du butin."
  ur: "الفرازدق کی ایک طویل نظم کے تین اشعار جو ابن ہشام نے بنو الانبار کے اسیروں کے بیان کے بعد نقل کیے ہیں: کہ ابن حابس ایک پختہ اور عزت طلب التجا کے ساتھ رسول اللہ کے سامنے کھڑا ہوا، اور اس کے لیے رسیوں میں بندھے ہوئے قیدیوں کو رہا کر دیا گیا، اور ان کے پیچھے نیزوں کی قیمتیں چھوڑنے والوں کو چھوڑ دیا گیا۔ مال غنیمت کی تقسیم."
  tr: "Banu El-Anbar'ın esaret haberini takip eden İbn Hişam tarafından anlatılan bir şiirden üç dize: İbn Habis, Allah'ın Elçisi'nin önünde şan peşinde kararlı bir planla durdu, bu yüzden iplerle boyunları bağlı olan esirleri serbest bıraktı ve halifelerin anneleri yüksek fidye ve bölünme oklarından kurtuldu."
  id: "Tiga bait dari puisi Al-Farazdaq yang diceritakan oleh Ibn Hisham setelah berita penawanan Banu Al-Anbar: bahwa Ibn Habis berdiri di hadapan Rasul Allah dengan rencana tegas yang menginginkan kemuliaan, sehingga ia membebaskan para tawanan yang terikat tali dengan leher terikat, dan para ibu khalifah terhindar dari tebusan tinggi dan panah perpecahan."
