summary:
  ar: "إحدى المعلقات السبع، من الكامل على روي الميم، مطلعها «عفت الديار محلها فمقامها بمنى تأبد غولها فرجامها»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.95}}."
  en: "One of the seven Mu'allaqat, in the kamil metre on the rhyme mim, opening \"The abodes are effaced, their halting-places and their lodging-places, at Mina; Ghawl and Rijam have become desolate\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.95}}."
