label: { ar: "معلقة لبيد بن ربيعة «عفت الديار محلها فمقامها»", en: "The Mu'allaqa of Labid ibn Rabi'a, 'The abodes are effaced'", es: "El Mu'allaqa de Labid ibn Rabi'a, 'Las moradas están borradas'", fr: "La Mu'allaqa de Labid ibn Rabi'a, « Les demeures sont effacées »", ur: "لبید بن ربیعہ کا مقلقہ، 'مکانیں مٹ گئی ہیں'", tr: "Labid bin Rabi'ah'ın şerhi: 'Vatan yerini ve yerini terk etti.'", id: "Komentar Labid ibn Rabi'ah: 'Tanah air telah meninggalkan tempatnya dan tempatnya.'" }
summary:
  ar: "إحدى المعلقات السبع، من الكامل على روي الميم، مطلعها «عفت الديار محلها فمقامها بمنى تأبد غولها فرجامها»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.95}}."
  en: "One of the seven Mu'allaqat, in the kamil metre on the rhyme mim, opening \"The abodes are effaced, their halting-places and their lodging-places, at Mina; Ghawl and Rijam have become desolate\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.95}}."
  es: "Uno de los siete Mu'allaqat, en metro kamil sobre la rima mim, comienza con \"Las moradas han sido borradas, sus lugares de descanso y sus alojamientos, en Mina; Ghawl y Rijam se han vuelto desolados\", como en el comentario de al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.95}}."
  fr: "L'un des sept Mu'allaqat, en mètre kamil sur la rime mim, commençant par « Les demeures sont effacées, leurs lieux de halte et leurs lieux d'hébergement, à Mina; Ghawl et Rijam sont devenus désolés », comme dans le commentaire d'al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.95}}."
  ur: "سات معلقات میں سے ایک، نظم میم پر کامل میٹر میں، کھلتے ہوئے \"منیٰ میں رہائش گاہیں، ان کے ٹھہرنے کی جگہیں اور ان کے قیام کی جگہیں، ویران ہو گئی ہیں\"، جیسا کہ الزوزانی کی تفسیر میں ہے۔"
  tr: "Al-Kamil 'ala Rawi al-Mim'den gelen yedi Mu'allakat'tan biri olan bu eserin başlığı şöyledir: \"Topraklar yerlerini terk etti, yerleri Mina'dadır, hortlakçıları oraklarını sürdürür,\" Al-Zawzani tarafından açıklanmıştır {{cite:sharh-muallaqat-sab-zawzani-1921 s.95}}."
  id: "Salah satu dari tujuh Mu'allaqat, dari Al-Kamil 'ala Rawi al-Mim, pembukaannya adalah \"Tanah meninggalkan tempatnya, jadi tempatnya di Mina, hantu mereka melanggengkan sabit mereka,\" seperti dijelaskan oleh Al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 hlm.95}}."
