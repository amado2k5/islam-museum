label: { ar: "في استعمال الماريجوانا", en: "On the Use of Marijuana", ur: "ماریجانا کے استعمال پر", es: "Sobre el uso de la marihuana", fr: "Sur l'usage du cannabis", tr: "Esrar kullanımında", id: "Dalam penggunaan ganja" }
summary:
  ar: "سؤال عن الموقف الإسلامي من استعمال الماريجوانا لغرض الترفيه أو العلاج. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر أكتوبر 2021)⁩ ببيان مركّبَي نبتة القنب الأساسيين وحكم استعمالها في الحالتين على ما فصّل الجواب."
  en: "A question about the Islamic stance on using marijuana recreationally or medically. The Fiqh Council of North America (published October 2021) answered by setting out the cannabis plant's two key chemicals and the ruling on each use — as the answer details."
  ur: "تفریحی یا طبی مقصد سے ماریجانا کے استعمال کا اسلامی حکم۔ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ اکتوبر 2021)⁩ نے بھنگ کے دو بنیادی مرکبات اور ہر استعمال کا حکم بیان کیا۔"
  es: "Una pregunta sobre la postura islámica respecto al uso recreativo o medicinal de la marihuana. El Consejo de Jurisprudencia Islámica de Norteamérica (publicado en octubre de 2021) respondió detallando los dos componentes químicos clave de la planta de cannabis y la normativa aplicable a cada uso, tal como se especifica en la respuesta."
  fr: "Une question portait sur la position de l'islam concernant l'usage récréatif ou médical du cannabis. Le Conseil de jurisprudence islamique d'Amérique du Nord (publication d'octobre 2021) y a répondu en présentant les deux principaux composés chimiques de la plante et la décision relative à chaque usage, comme le détaille la réponse."
  tr: "Esrarın eğlence veya terapötik amaçlarla kullanımına ilişkin İslami tutum hakkında bir soru. Kuzey Amerika Hukuk Konseyi (Ekim 2021'de yayımlandı), yanıtta yanıt vererek, kenevir bitkisinin iki ana bileşiğini ve her iki durumda da kullanımıyla ilgili kararı açıklamakta, yanıtta detaylandırılmıştır."
  id: "Sebuah pertanyaan tentang sikap Islam terhadap penggunaan ganja untuk tujuan rekreasi atau terapeutik. Dewan Yurisprudensi Amerika Utara (diterbitkan Oktober 2021) menanggapi dengan memperjelas dua senyawa utama tanaman ganja dan putusan mengenai penggunaannya dalam kedua kasus tersebut, seperti yang dijelaskan dalam jawaban."
