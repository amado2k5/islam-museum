label: { ar: "قرار مجمع الفقه الإسلامي الدولي 216 (22/12) بشأن زيارة القدس: الأهداف والأحكام الشرعية", en: "IIFA resolution 216 (22/12) on visiting Jerusalem: its aims and legal rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 216 (22/12): بیت المقدس کی زیارت — مقاصد اور شرعی احکام", es: "Resolución 216 (22/12) de la IIFA sobre la visita a Jerusalén: sus objetivos y resoluciones legales.", fr: "Résolution 216 (22/12) de l'IIFA sur la visite de Jérusalem: ses objectifs et ses décisions juridiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 216 (22/12) Kudüs ziyaretine ilişkin olarak: Hedefler ve Şeriat Kararları", id: "Resolusi Akademi Fiqh Islam Internasional 216 (22/12) mengenai kunjungan ke Yerusalem: Tujuan dan Putusan Syariah" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. انتهى المجمع بعد اطلاعه على البحوث والمناقشات الموسعة إلى أن الحكم الشرعي لزيارة القدس مندوب ومرغّب فيه، ولكن النقاش دار حول تحقق المصالح والمفاسد في ذلك، ورأى أن تقدير هذه المصالح يعود إلى المختصين من أولي الأمر والسياسة في بلاد المسلمين. وذكّر المجمع جميع المسلمين بأن قضية القدس الشريف قضية الأمة بأجمعها وأن من الواجب نصرتها وتأييد أهلها وأهل فلسطين ودعمهم، وأن القدس الشريف ليست لأهل فلسطين وحدهم وإنما هي للمسلمين جميعًا، وأن الحفاظ على المسجد الأقصى المبارك من جملة إيمان المسلمين ومسؤولياتهم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). After reviewing the research and extensive discussions it concluded that the legal ruling on visiting Jerusalem is that it is recommended and encouraged, the debate turning on whether the benefits and harms of it are realised, and the Academy held that weighing those benefits belongs to the specialists among those charged with authority and policy in the Muslim countries. It reminded all Muslims that the cause of Jerusalem is the cause of the whole community, that it is a duty to support it and stand by its people and the people of Palestine, that Jerusalem does not belong to the Palestinians alone but to all Muslims, and that guarding al-Aqsa Mosque is part of the Muslims' faith and responsibilities."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ تحقیقات اور وسیع مباحث کے مطالعے کے بعد اکیڈمی اس نتیجے پر پہنچی کہ بیت المقدس کی زیارت کا شرعی حکم مستحب اور محبوب ہے، مگر بحث اس پر چلی کہ اس میں مصالح اور مفاسد کی تحقق کس طرح ہوتی ہے، اور اکیڈمی نے رائے دی کہ ان مصالح کا اندازہ مسلم ممالک کے اولوالامر اور سیاست کے ماہرین کا ہے۔ اکیڈمی نے تمام مسلمانوں کو یاد دلایا کہ بیت المقدس کا مسئلہ پوری امت کا مسئلہ ہے، اس کی نصرت اور وہاں کے لوگوں اور اہلِ فلسطین کی حمایت اور ان کی مدد واجب ہے، بیت المقدس صرف اہلِ فلسطین کی نہیں بلکہ تمام مسلمانوں کی ہے، اور مسجدِ اقصیٰ کی حفاظت مسلمانوں کے ایمان اور ان کی ذمہ داریوں میں سے ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión celebrada en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). Tras revisar la investigación y celebrar extensos debates, concluyó que la normativa legal sobre la visita a Jerusalén es que se recomienda y se fomenta, centrándose el debate en si se comprenden los beneficios y los perjuicios que conlleva. La Academia sostuvo que la evaluación de dichos beneficios corresponde a los especialistas con autoridad y capacidad política en los países musulmanes. Recordó a todos los musulmanes que la causa de Jerusalén es la causa de toda la comunidad, que es un deber apoyarla y estar al lado de su pueblo y del pueblo palestino, que Jerusalén no pertenece solo a los palestinos, sino a todos los musulmanes, y que la protección de la Mezquita de Al-Aqsa forma parte de la fe y las responsabilidades de los musulmanes."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015). Après examen des recherches et discussions approfondies, l'Académie a conclu que, juridiquement, les visites à Jérusalem sont recommandées et encouragées. Le débat porte sur la prise en compte des avantages et des inconvénients de ces visites. L'Académie a estimé que l'évaluation de ces avantages relève de la compétence des spécialistes parmi les autorités et les décideurs politiques des pays musulmans. Elle a rappelé à tous les musulmans que la cause de Jérusalem est celle de toute la communauté, qu'il est du devoir de la soutenir et de se tenir aux côtés de ses habitants et du peuple palestinien, que Jérusalem n'appartient pas seulement aux Palestiniens mais à tous les musulmans, et que la protection de la mosquée Al-Aqsa fait partie intégrante de la foi et des responsabilités des musulmans."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt Devleti'ndeki yirmi ikinci oturumunda (2–5 Cumedül-Ahhirah 1436 H, 22–25 Mart 2015) ortak kararı. Kapsamlı araştırma ve tartışmalar incelendikten sonra, Akademi, Kudüs'ün ziyaret edilmesine ilişkin dini kararın tavsiye edildiği ve arzu edilir olduğunu, ancak tartışmanın çıkar ve zararların farkına odaklandığını ve bu çıkarların değerlendirilmesinin Müslüman topraklardaki yetkililer ve siyasetçiler arasındaki uzmanlara ait olduğunu belirtmiştir. Akademi, tüm Müslümanlara Kudüs-El-Şerif davasının tüm milletin davası olduğunu, onu desteklemenin ve halkını ve Filistin halkını desteklemenin zorunlu olduğunu, Kudüs-Şerif'in sadece Filistin halkı için değil, tüm Müslümanlar için olduğunu ve mübarek El-Aksa Camii'nin korunmasının Müslümanların inancı ve sorumlulukları arasında olduğunu hatırlatmıştır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015 M). Setelah meninjau penelitian dan diskusi yang mendalam, Akademi menyimpulkan bahwa aturan agama tentang kunjungan ke Yerusalem direkomendasikan dan diinginkan, tetapi diskusi berpusat pada realisasi kepentingan dan kerugian dalam melakukannya, dan menganggap bahwa penilaian kepentingan tersebut berada pada para ahli di antara otoritas dan politisi di wilayah Muslim. Akademi mengingatkan semua Muslim bahwa perjuangan Al-Quds Al-Sharif adalah perjuangan seluruh bangsa dan bahwa wajib untuk mendukungnya dan mendukung rakyatnya serta rakyat Palestina, dan bahwa Al-Quds Al-Sharif bukan hanya untuk rakyat Palestina tetapi untuk semua Muslim, dan bahwa melestarikan Masjid Al-Aqsa yang diberkati adalah salah satu kepercayaan dan tanggung jawab umat Muslim."
