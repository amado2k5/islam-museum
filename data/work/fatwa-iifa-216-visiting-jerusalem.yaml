label: { ar: "قرار مجمع الفقه الإسلامي الدولي 216 (22/12) بشأن زيارة القدس: الأهداف والأحكام الشرعية", en: "IIFA resolution 216 (22/12) on visiting Jerusalem: its aims and legal rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 216 (22/12): بیت المقدس کی زیارت — مقاصد اور شرعی احکام" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. انتهى المجمع بعد اطلاعه على البحوث والمناقشات الموسعة إلى أن الحكم الشرعي لزيارة القدس مندوب ومرغّب فيه، ولكن النقاش دار حول تحقق المصالح والمفاسد في ذلك، ورأى أن تقدير هذه المصالح يعود إلى المختصين من أولي الأمر والسياسة في بلاد المسلمين. وذكّر المجمع جميع المسلمين بأن قضية القدس الشريف قضية الأمة بأجمعها وأن من الواجب نصرتها وتأييد أهلها وأهل فلسطين ودعمهم، وأن القدس الشريف ليست لأهل فلسطين وحدهم وإنما هي للمسلمين جميعًا، وأن الحفاظ على المسجد الأقصى المبارك من جملة إيمان المسلمين ومسؤولياتهم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). After reviewing the research and extensive discussions it concluded that the legal ruling on visiting Jerusalem is that it is recommended and encouraged, the debate turning on whether the benefits and harms of it are realised, and the Academy held that weighing those benefits belongs to the specialists among those charged with authority and policy in the Muslim countries. It reminded all Muslims that the cause of Jerusalem is the cause of the whole community, that it is a duty to support it and stand by its people and the people of Palestine, that Jerusalem does not belong to the Palestinians alone but to all Muslims, and that guarding al-Aqsa Mosque is part of the Muslims' faith and responsibilities."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ تحقیقات اور وسیع مباحث کے مطالعے کے بعد اکیڈمی اس نتیجے پر پہنچی کہ بیت المقدس کی زیارت کا شرعی حکم مستحب اور محبوب ہے، مگر بحث اس پر چلی کہ اس میں مصالح اور مفاسد کی تحقق کس طرح ہوتی ہے، اور اکیڈمی نے رائے دی کہ ان مصالح کا اندازہ مسلم ممالک کے اولوالامر اور سیاست کے ماہرین کا ہے۔ اکیڈمی نے تمام مسلمانوں کو یاد دلایا کہ بیت المقدس کا مسئلہ پوری امت کا مسئلہ ہے، اس کی نصرت اور وہاں کے لوگوں اور اہلِ فلسطین کی حمایت اور ان کی مدد واجب ہے، بیت المقدس صرف اہلِ فلسطین کی نہیں بلکہ تمام مسلمانوں کی ہے، اور مسجدِ اقصیٰ کی حفاظت مسلمانوں کے ایمان اور ان کی ذمہ داریوں میں سے ہے۔"
