id: work/fatwa-aliftaa-jo-selling-spoiled-or-expired-goods
class: work
kind: fatwa
label: { ar: "بيع المواد التالفة أو منتهية الصلاحية", en: "Selling spoiled or expired goods", ur: "خراب یا میعاد ختم شدہ اشیا بیچنا" }
summary:
  ar: "سؤال عن بيع المواد التالفة أو منتهية الصلاحية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم بيع المواد الفاسدة أو منتهية الصلاحية أو التلاعب بتواريخها، وأن البائع إن تسبب بيعها في موت أحد كان متعديًا عليه الدية والكفارة، ولولي الأمر فرض عقوبات تعزيرية رادعة. أجابت الدائرة بأن الإسلام حث على الطيب ونهى عن استبداله بالمحرم في النفقة والتجارة، واستشهدت بـ[[passage/quran-2-267|سورة البقرة 2:267]] وبتفسير ابن كثير (1/697) في النهي عن العدول عن الحلال إلى الحرام، وبحديث رواه أحمد وابن ماجه في نفي الضرر والضرار، وقالت إن من ذلك منع بيع المواد الغذائية الفاسدة أو المنتهية الصلاحية أو التلاعب بتاريخ إنتاجها أو انتهائها. وقالت إن التاجر الذي يعلم بانتهاء صلاحية المواد يحرم عليه بيعها لأنها تضر غالبًا، وإن أخذ ثمنها أكل لأموال الناس بالباطل، واستشهدت بـ[[passage/quran-4-29|سورة النساء 4:29]]، وإنه من الغش المحرم، واستدلت بحديث رواه مسلم معناه أن من غش فليس من أمته. وقالت إن هذه المواد إذا تسببت في موت أحد وثبت ذلك طبيًا فالمتسبب متعد والتعدي سبب للضمان، كمن وضع حجارة في الطريق العام، وإن التغرير ببيع مواد فاسدة على أنها سليمة نوع من الإكراه، ونقلت عن الجويني في نهاية المطلب (16/127) أن بيع الطعام المسموم لمن يغلب أنه يأكله يضاهي الإكراه من جهة إفضائه إلى الهلاك. وخلصت إلى أن البائع العالم بالخطر إذا أدى أكل المادة إلى موت آكل غير عالم بها فعليه الدية والكفارة لأنه متسبب، وكذلك إن لم يعلم بفسادها لأن تاريخ الصلاحية المكتوب بمثابة الإعلام له، ولولي الأمر أن يفرض على بائعي هذه المواد عقوبات تعزيرية رادعة."
  en: "A question about selling spoiled or expired goods, in which Jordan's General Iftaa Department answered that selling spoiled or expired goods, or tampering with their dates, is forbidden; a seller whose goods cause someone's death is a transgressor owing blood money (diya) and expiation, and the authorities may impose deterrent discretionary penalties. The Department answered that Islam urges what is wholesome and forbids replacing it with the unlawful in spending and trade, citing [[passage/quran-2-267|Surat al-Baqara 2:267]], Tafsir Ibn Kathir (1/697) on not turning from the lawful to the unlawful, and a hadith narrated by Ahmad and Ibn Majah that there is to be no harm and no reciprocal harm; this includes banning the sale of spoiled or expired food and tampering with production or expiry dates. It said that a trader who knows goods have expired is forbidden to sell them since they usually cause harm, that taking their price is consuming people's wealth wrongfully, citing [[passage/quran-4-29|Surat al-Nisa' 4:29]], and that it is forbidden cheating, citing a hadith narrated by Muslim whose meaning is that whoever cheats does not belong to the Prophet's community. It said that if such goods cause a death and this is medically established, the one who caused it is a transgressor and transgression entails liability, like someone who places stones on a public road; deceiving buyers by selling spoiled goods as sound is a kind of coercion, quoting al-Juwayni in Nihayat al-Matlab (16/127) that selling poisoned food to someone likely to eat it resembles coercion because it leads to death. It concluded that a seller who knew the danger owes blood money and expiation as the cause if the food kills an eater who did not know, and likewise if he did not know it was spoiled, since the printed expiry date counts as notice to him; the authorities may impose deterrent discretionary penalties on those who sell such goods."
  ur: "خراب یا میعاد ختم شدہ اشیا بیچنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ خراب یا میعاد ختم شدہ اشیا بیچنا یا ان کی تاریخوں میں ہیرا پھیری حرام ہے؛ جس بیچنے والے کی اشیا کسی کی موت کا سبب بنیں وہ زیادتی کرنے والا ہے جس پر دیت اور کفارہ ہے، اور حکام عبرت ناک تعزیری سزائیں دے سکتے ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے پاکیزہ چیزوں پر ابھارا اور خرچ اور تجارت میں انہیں حرام سے بدلنے سے منع کیا، اور [[passage/quran-2-267|سورۃ البقرہ 2:267]]، حلال سے حرام کی طرف نہ پھرنے کے بارے میں تفسیر ابن کثیر (1/697)، اور احمد اور ابن ماجہ کی روایت کردہ حدیث کا حوالہ دیا کہ نہ نقصان پہنچانا ہے نہ نقصان کا بدلہ نقصان؛ اسی میں خراب یا میعاد ختم شدہ غذائی اشیا کی فروخت اور ان کی تاریخِ تیاری یا اختتام میں ہیرا پھیری کی ممانعت شامل ہے۔ اس نے کہا کہ جو تاجر جانتا ہو کہ اشیا کی میعاد ختم ہو چکی ہے اس پر انہیں بیچنا حرام ہے کیونکہ وہ عموماً نقصان دہ ہوتی ہیں، ان کی قیمت لینا لوگوں کا مال ناحق کھانا ہے، اور [[passage/quran-4-29|سورۃ النساء 4:29]] کا حوالہ دیا، اور یہ حرام دھوکہ ہے، اور مسلم کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ جو دھوکہ دے وہ نبی کی امت میں سے نہیں۔ اس نے کہا کہ اگر یہ اشیا کسی کی موت کا سبب بنیں اور طبی طور پر ثابت ہو تو سبب بننے والا زیادتی کرنے والا ہے اور زیادتی ضمان کا سبب ہے، جیسے کوئی عام راستے میں پتھر رکھ دے؛ اور خراب اشیا کو صحیح بتا کر بیچنا ایک قسم کا اکراہ ہے، اور نہایۃ المطلب (16/127) میں جوینی سے نقل کیا کہ زہریلا کھانا ایسے شخص کو بیچنا جس کے کھانے کا غالب گمان ہو، ہلاکت تک پہنچانے کے لحاظ سے اکراہ کے مشابہ ہے۔ اس نے نتیجہ نکالا کہ خطرہ جاننے والا بیچنے والا، اگر نہ جاننے والا کھانے والا مر جائے، سبب ہونے کی وجہ سے دیت اور کفارہ ادا کرے گا، اور اسی طرح اگر اسے خرابی کا علم نہ ہو، کیونکہ لکھی ہوئی میعاد اس کے لیے اطلاع کے حکم میں ہے؛ اور حکام ایسی اشیا بیچنے والوں پر عبرت ناک تعزیری سزائیں عائد کر سکتے ہیں۔"
