label: { ar: "الصلاة قاعدًا وفي السيارة", en: "Praying seated or in a car — the standing pillar and its exemptions", ur: "بیٹھ کر یا گاڑی میں نماز — قیام کا رکن", es: "Orar sentado o en un automóvil: el pilar de pie y sus excepciones.", fr: "Prier assis ou en voiture — le pilier debout et ses exemptions" }
summary:
  ar: "سأل سائل عن الصلاة في السيارة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87593 بتاريخ 16 أكتوبر 2012)⁩ أن القيام ركن من أركان الصلاة لقوله تعالى وقوموا لله قانتين ومن عجز عنه صلى قاعدًا فمن عجز عن القعود صلى على جنب مستدلة بحديث عمران بن حصين على ما فصّل الجواب من أحكام العاجز والمسافر."
  en: "A questioner asked about praying in a car. AMJA's fatwa committee (fatwa no. 87593, 16 October 2012) answered that standing is a pillar of the prayer — 'stand to God in devotion' — so one unable to stand prays seated, and one unable to sit prays on his side, citing the hadith of Imran b. al-Husayn — as the answer details the rulings for the unable and the traveler."
  ur: "گاڑی میں نماز؟ لجنة الفتوى ⁦(فتویٰ 87593، 16 اکتوبر 2012)⁩ کے مطابق قیام رکن؛ معذور بیٹھ کر، مزید معذور لیٹ کر پڑھے — عمران بن حصین کی حدیث۔"
  es: "Un consultante preguntó sobre la posibilidad de rezar en un automóvil. El comité de fatuas de AMJA (fatua n.° 87593, 16 de octubre de 2012) respondió que estar de pie es un pilar de la oración —«ponerse de pie ante Dios con devoción»—, por lo que quien no puede estar de pie reza sentado, y quien no puede sentarse reza de lado, citando el hadiz de Imran b. al-Husayn —ya que la respuesta detalla las normas para las personas con discapacidad y para quienes viajan."
  fr: "Une personne a posé une question concernant la prière en voiture. Le comité des fatwas de l'AMJA (fatwa n° 87593, 16 octobre 2012) a répondu que la position debout est un pilier de la prière – « se tenir debout devant Dieu avec dévotion » – et que, par conséquent, celui qui ne peut se tenir debout prie assis, et celui qui ne peut s'asseoir prie sur le côté, citant le hadith d'Imran b. al-Husayn. La réponse détaille les règles pour la personne incapable et le voyageur."
