summary:
  ar: "بوابة إسلامية روسية اللغة ⁦(ولها نسخة إنجليزية)⁩ أنشأتها الإدارة الدينية لمسلمي داغستان سنة 2001 بمشاركة عدد من المؤسسات، تنشر الأخبار والمقالات والنصوص الدينية والاستشارات، ويعدّها باحثون روس من أكبر المواقع الإسلامية في الإنترنت الروسي؛ انتقل مقرها إلى داغستان سنة 2011."
  en: "A Russian-language Islamic portal (with an English version) founded by the Spiritual Administration of Muslims of Dagestan in 2001 with several foundations, publishing news, articles, religious texts and consultations; Russian scholars count it among the largest Islamic sites of the Russian internet, and its headquarters moved to Dagestan in 2011."
  ur: "روسی زبان کا اسلامی پورٹل ⁦(انگریزی نسخے کے ساتھ)⁩ جسے داغستان کے مسلمانوں کی دینی انتظامیہ نے 2001 میں کئی اداروں کے ساتھ قائم کیا؛ خبریں، مضامین، دینی متون اور مشاورت شائع کرتا ہے؛ روسی محققین اسے روسی انٹرنیٹ کی سب سے بڑی اسلامی سائٹوں میں شمار کرتے ہیں؛ 2011 میں مرکز داغستان منتقل ہوا۔"
