id: work/fatwa-aliftaa-jo-an-online-intermediarys-refund-for-late-shipping
class: work
kind: fatwa
label: { ar: "لمن يكون تعويض تأخر الشحن: للوسيط أم للزبون؟", en: "Who gets compensation for late shipping: the intermediary or the customer?", ur: "تاخیر سے شپنگ کا معاوضہ کس کا ہے: درمیانی کا یا گاہک کا؟" }
summary:
  ar: "سؤال عن وسيطة لموقع إلكتروني تدفع ثمن طلبات الزبائن مسبقًا، ويعرض الموقع إرجاع المبلغ تعويضًا عن تأخر الشحن، أجابت فيه دائرة الإفتاء العام الأردنية بأن المبلغ المسترد للزبون إذا كانت الوسيطة وكيلة عنه، ولها إذا كانت تشتري السلع لنفسها ثم تبيعها له. أجابت الدائرة بأن الحكم يتوقف على طبيعة العلاقة العقدية بين الوسيط والزبائن. وقالت إن الوسيط إذا كان وكيلًا يوصل الطلبات ويأخذ أجرة التوصيل وعمولة الوكالة، فإن تصرفات الوكيل لمصلحة الموكل، فلا يجوز له أخذ أي استرداد نقدي من المورد، ويكون المبلغ المسترد من حق الزبون. وإذا كان الوسيط يشتري السلع من ماله الخاص ثم يبيعها للزبائن جاز له أخذ المبالغ المستردة، لأن السلعة دخلت في ملكه وضمانه قبل بيعها. وخلصت إلى أن المبلغ المسترد للزبون إذا كان الوسيط وكيلًا عنه في الشراء والتوصيل، وللوسيط إذا كان يشتري السلع لنفسه ثم يبيعها."
  en: "A question from an intermediary for an online shop who pays in advance for customers' orders, where the shop offers a refund as compensation for late shipping, in which Jordan's General Iftaa Department answered that the refund belongs to the customer if the intermediary acts as the customer's agent, and to the intermediary if she buys the goods for herself and then sells them. The Department answered that the ruling depends on the nature of the contractual relationship between the intermediary and the customers. It said that if the intermediary is an agent who delivers orders and takes a delivery fee and an agency commission, the rule that an agent acts for the principal's benefit applies, so the agent may not keep any cash refund from the supplier, and the refund belongs to the customer. If the intermediary buys the goods with her own money and then sells them to customers, she may keep the refunds, because the goods entered her ownership and risk before she sold them. It concluded that the refund belongs to the customer when the intermediary is the customer's agent in buying and delivering, and to the intermediary when she buys the goods for herself and then sells them."
  ur: "ایک آن لائن دکان کی درمیانی خاتون کے بارے میں سوال جو گاہکوں کے آرڈرز کی قیمت پیشگی ادا کرتی ہے، اور دکان تاخیر سے شپنگ کے معاوضے کے طور پر رقم واپس کرنے کی پیشکش کرتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر درمیانی گاہک کی وکیل ہو تو واپس ملنے والی رقم گاہک کی ہے، اور اگر وہ سامان اپنے لیے خرید کر پھر بیچتی ہو تو اس کی۔ ڈیپارٹمنٹ نے جواب دیا کہ حکم درمیانی اور گاہکوں کے درمیان معاہداتی تعلق کی نوعیت پر موقوف ہے۔ اس نے کہا کہ اگر درمیانی ایسا وکیل ہو جو آرڈر پہنچاتا ہے اور ترسیل کی اجرت اور وکالت کا کمیشن لیتا ہے، تو یہ قاعدہ لاگو ہوتا ہے کہ وکیل کے تصرفات مؤکل کے مفاد میں ہوتے ہیں، لہٰذا وکیل سپلائر سے ملنے والی کوئی نقد واپسی نہیں رکھ سکتا اور وہ رقم گاہک کا حق ہے۔ اگر درمیانی اپنے پیسوں سے سامان خرید کر پھر گاہکوں کو بیچے تو وہ واپس ملنے والی رقم رکھ سکتی ہے، کیونکہ بیچنے سے پہلے سامان اس کی ملکیت اور ضمان میں آ چکا تھا۔ اس نے نتیجہ نکالا کہ جب درمیانی خریداری اور ترسیل میں گاہک کی وکیل ہو تو واپس ملنے والی رقم گاہک کی ہے، اور جب وہ سامان اپنے لیے خرید کر بیچے تو اس کی۔"
