id: work/fatwa-amja-madhy-incontinence-tayammum
class: work
kind: fatwa
label: { ar: "سلس المذي والتيمم", en: "Madhy incontinence outdoors — is tayammum open to him", ur: "سلس مذی — تیمم" }
summary:
  ar: "سأل سائل أنه يمضي طول اليوم خارج البيت ويعاني من سلس المذي فيجد صعوبة في الوضوء لكل صلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76784 بتاريخ 5 نوفمبر 2008)⁩ أن التيمم يشرع عند فقد الماء أو العجز عن استعماله والمشقة التي تبيح الترخص هي المشقة الزائدة التي تعنت أصحابها وترهقهم من أمرهم عسرًا أما المشقة العادية فلا تكفي وعليه أن يتوضأ لكل صلاة ما دام قادرًا على استعمال الماء على ما فصّل الجواب."
  en: "A questioner spends all day outdoors with madhy incontinence and finds wudu for every prayer hard. Dr. Salah al-Sawi (fatwa no. 76784, 5 November 2008) answered that tayammum is legislated where water is lacking or unusable; the hardship licensing the dispensation is the surpassing hardship that harries its people and wearies them — ordinary hardship does not suffice; so he does wudu for each prayer as long as he can use water — as the answer details."
  ur: "سلس مذی اور تیمم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76784، 5 نومبر 2008)⁩ کے مطابق معمولی دقت کافی نہیں — پانی ملے تو ہر وقت پر وضو۔"
