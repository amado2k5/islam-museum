id: work/fatwa-amja-madhy-incontinence-tayammum
class: work
kind: fatwa
label: { ar: "سلس المذي والتيمم", en: "Madhy incontinence outdoors — is tayammum open to him", ur: "سلس مذی — تیمم", es: "Madhy incontinencia al aire libre: ¿está Tayammum abierto a él?", fr: "Incontinence Madhy à l'extérieur — le tayammum lui est-il ouvert ?", tr: "Smooth Flow ve Tayammum", id: "Aliran Lancar dan Tayammum" }
summary:
  ar: "سأل سائل أنه يمضي طول اليوم خارج البيت ويعاني من سلس المذي فيجد صعوبة في الوضوء لكل صلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76784 بتاريخ 5 نوفمبر 2008)⁩ أن التيمم يشرع عند فقد الماء أو العجز عن استعماله والمشقة التي تبيح الترخص هي المشقة الزائدة التي تعنت أصحابها وترهقهم من أمرهم عسرًا أما المشقة العادية فلا تكفي وعليه أن يتوضأ لكل صلاة ما دام قادرًا على استعمال الماء على ما فصّل الجواب."
  en: "A questioner spends all day outdoors with madhy incontinence and finds wudu for every prayer hard. Dr. Salah al-Sawi (fatwa no. 76784, 5 November 2008) answered that tayammum is legislated where water is lacking or unusable; the hardship licensing the dispensation is the surpassing hardship that harries its people and wearies them — ordinary hardship does not suffice; so he does wudu for each prayer as long as he can use water — as the answer details."
  ur: "سلس مذی اور تیمم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76784، 5 نومبر 2008)⁩ کے مطابق معمولی دقت کافی نہیں — پانی ملے تو ہر وقت پر وضو۔"
  es: "Un consultante pasa todo el día al aire libre con incontinencia fecal y le resulta difícil realizar la ablución (wudu) para cada oración. El Dr. Salah al-Sawi (fatwa n.° 76784, 5 de noviembre de 2008) respondió que el tayammum está legislado donde hay escasez o imposibilidad de usar agua; la dificultad que justifica esta dispensa es la mayor dificultad que aflige y agota a quienes la practican; las dificultades ordinarias no son suficientes; por lo tanto, realiza la ablución para cada oración siempre que pueda usar agua, como se detalla en la respuesta."
  fr: "Un homme souffrant d'incontinence fécale (madhy) passe ses journées dehors et trouve difficile de faire ses ablutions pour chaque prière. Le Dr Salah al-Sawi (fatwa n° 76784, 5 novembre 2008) a répondu que le tayammum est prescrit lorsque l'eau est rare ou inutilisable; la difficulté justifiant cette dispense est l'épreuve extrême qui accable et épuise les personnes concernées – une difficulté ordinaire ne suffit pas; ainsi, il fait ses ablutions pour chaque prière tant qu'il a accès à l'eau – comme le précise la réponse."
  tr: "Bir soru soran kişi, tüm günü evin dışında sıvı kaçırma nedeniyle her nama için abdestim yapmasını zorlaştıran bir şekilde geçirip geçirmediğini sordu. Dr. Salah Al-Sawi (5 Kasım 2008 tarihli 76784 No. Fetva) suyun kaybolması veya kullanılamaması durumunda teyammumun reçete edildiğini yanıtladı. Taviz verilmesine izin veren zorluk, sahiplerinin inatçılığından kaynaklanan aşırı zorluk ve onları zorlukla yükletirken, sıradan zorluk yeterli değildir ve cevabında açıklandığı gibi, her namazda su kullanabildiği sürece abdest almak zorundadır."
  id: "Seorang penanya bertanya apakah ia menghabiskan sepanjang hari di luar rumah dengan inkontinensia cairan, yang membuatnya sulit untuk melakukan wudhu setiap kali berdoa. Dr. Salah Al-Sawi menjawab (Fatwa No. 76784 tanggal 5 November 2008) bahwa tayammum diresepkan ketika air hilang atau tidak dapat digunakan. Kesulitan yang memungkinkan konsesi adalah kesulitan berlebihan yang disebabkan oleh keras kepala pemiliknya dan membebani mereka dengan kesulitan, sementara kesulitan biasa tidak cukup, dan ia harus melakukan wudhu untuk setiap doa selama masih mampu menggunakan air, seperti yang dijelaskan dalam jawaban."
