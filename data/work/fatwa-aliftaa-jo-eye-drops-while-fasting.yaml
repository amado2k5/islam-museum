id: work/fatwa-aliftaa-jo-eye-drops-while-fasting
class: work
kind: fatwa
label: { ar: "قطرة العين للصائم", en: "Eye drops while fasting", ur: "روزے دار کے لیے آنکھ کے قطرے" }
summary:
  ar: "سؤال عن قطرة العين للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تبطل الصيام وإن أحس الصائم بطعمها في حلقه. أجابت الدائرة بأن قطرة العين لا تبطل الصيام وإن أحس الصائم بطعمها في حلقه. وعللت ذلك بأن العين ليست منفذًا مفتوحًا إلى الجوف."
  en: "A question about using eye drops while fasting, in which Jordan's General Iftaa Department answered that they do not invalidate the fast, even if the fasting person tastes them in the throat. The Department answered that eye drops do not invalidate the fast, even if the fasting person tastes them in the throat. It explained that the eye is not an open passage to the body's interior (al-jawf)."
  ur: "روزے دار کے لیے آنکھ کے قطروں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ روزہ نہیں توڑتے، چاہے روزے دار کو حلق میں ان کا ذائقہ محسوس ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ آنکھ کے قطرے روزہ نہیں توڑتے، چاہے روزے دار کو حلق میں ان کا ذائقہ محسوس ہو۔ اس نے وجہ یہ بتائی کہ آنکھ جسم کے اندرونی حصے (جوف) تک کھلا راستہ نہیں۔"
