id: work/fatwa-aliftaa-jo-court-compensation-after-leaving-a-fixed-term-job
class: work
kind: fatwa
label: { ar: "تعويض المحكمة لموظف ترك عقدًا محدد المدة", en: "Court compensation for an employee who left a fixed-term contract", ur: "مقررہ مدت کا معاہدہ چھوڑنے والے ملازم کے لیے عدالتی معاوضہ" }
summary:
  ar: "سؤال عن تعويض المحكمة لموظف ترك عقدًا محدد المدة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج على الموظف في المطالبة بحقوقه التي كفلها قانون العمل وأخذ ما حكم به القاضي من تعويض سوى الفائدة القانونية، إذا خلت مطالبته من الكذب والتزوير. أجابت الدائرة بأن الأصل أن العقد شريعة المتعاقدين فيجب احترام شروطه، واستشهدت بـ[[passage/quran-5-1|سورة المائدة 5:1]] وبحديث علقه البخاري بصيغة الجزم معناه أن المسلمين عند شروطهم. وقالت إنه لا حرج على الموظف في المطالبة بالتعويض الذي يقرره قانون العمل عند الفصل التعسفي، لأن القانون وضع لحفظ مصالح العامل ورب العمل، وتصرف الراعي منوط بالمصلحة، والقانون بمثابة العرف العام، والمعروف عرفًا كالمشروط شرطًا، فتدخل بنوده في عقود العمل تلقائيًا. وخلصت إلى أن له أخذ ما حكم به القاضي وفق القانون من غير كذب ولا تزوير، سوى الفائدة القانونية، وأن الورع إذا رأى التعويض أكبر من الضرر أن يأخذ ما يعادل ضرره ويدع ما زاد."
  en: "A question about court compensation for an employee who left a fixed-term contract, in which Jordan's General Iftaa Department answered that the employee may claim the rights labour law guarantees him and take the compensation the judge awarded, except the legal interest, if his claim involved no lying or forgery. The Department answered that the principle is that a contract is the law of the contracting parties, so its terms must be respected, citing [[passage/quran-5-1|Surat al-Ma'ida 5:1]] and a hadith that al-Bukhari cites in suspended form with certainty, whose meaning is that Muslims are bound by their conditions. It said the employee may claim the compensation that labour law sets for arbitrary dismissal, since the law was made to protect the interests of both worker and employer, a ruler's measures are tied to the public interest, and the law has the standing of general custom; what is customary counts as stipulated, so its provisions are implicitly part of every employment contract in the country. It concluded that he may take what the judge awarded under the law, provided there was no lying or forgery, except the legal interest; piety suggests that if he sees the award as larger than the harm he suffered, he takes the equivalent of his harm and leaves the rest."
  ur: "مقررہ مدت کا معاہدہ چھوڑنے والے ملازم کے لیے عدالتی معاوضہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ملازم لیبر قانون کے دیے ہوئے حقوق کا مطالبہ کر سکتا ہے اور جج کا دیا ہوا معاوضہ لے سکتا ہے، سوائے قانونی سود کے، بشرطیکہ اس کے دعوے میں جھوٹ یا جعل سازی نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ عقد فریقین کا قانون ہے، اس لیے اس کی شرائط کا احترام واجب ہے، اور [[passage/quran-5-1|سورۃ المائدہ 5:1]] اور اس حدیث کا حوالہ دیا جسے بخاری نے جزم کے صیغے سے معلقاً ذکر کیا، جس کا مفہوم ہے کہ مسلمان اپنی شرطوں کے پابند ہیں۔ اس نے کہا کہ ملازم ناجائز برطرفی پر لیبر قانون کا مقرر کردہ معاوضہ مانگ سکتا ہے، کیونکہ قانون مزدور اور آجر دونوں کے مفادات کے تحفظ کے لیے ہے، حاکم کے اقدامات مصلحت سے وابستہ ہیں، اور قانون عرفِ عام کی حیثیت رکھتا ہے؛ جو عرف میں معروف ہو وہ شرط کی طرح ہے، اس لیے اس کی شقیں ملک کے ہر ملازمتی معاہدے میں خود بخود شامل ہیں۔ اس نے نتیجہ نکالا کہ وہ قانون کے مطابق جج کا دیا ہوا معاوضہ لے سکتا ہے بشرطیکہ جھوٹ یا جعل سازی نہ ہو، سوائے قانونی سود کے؛ اور تقویٰ یہ ہے کہ اگر وہ معاوضے کو اپنے نقصان سے زیادہ سمجھے تو نقصان کے برابر لے اور باقی چھوڑ دے۔"
