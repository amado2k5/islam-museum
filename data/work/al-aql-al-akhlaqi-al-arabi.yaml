summary:
  ar: "الجزء الرابع والأخير من مشروع «نقد العقل العربي» لمحمد عابد الجابري، يحلل فيه نظم القيم في الثقافة العربية، صدر عن مركز دراسات الوحدة العربية ببيروت سنة 2001 في 640 صفحة."
  en: "The fourth and final part of Mohammed Abed al-Jabri's Critique of Arab Reason, analysing the value systems of Arab culture, published by the Centre for Arab Unity Studies, Beirut, in 2001 (640 pages)."
  ur: "محمد عابد الجابری کے منصوبے «نقد العقل العربی» کا چوتھا اور آخری حصہ جو عرب ثقافت میں اقدار کے نظاموں کا تجزیہ کرتا ہے؛ مرکز دراسات الوحدۃ العربیۃ، بیروت سے 2001ء میں 640 صفحات میں شائع ہوا۔"
  es: "La cuarta y última parte de la Crítica de la razón árabe de Mohammed Abed al-Jabri, que analiza los sistemas de valores de la cultura árabe, publicada por el Centro de Estudios de la Unidad Árabe, Beirut, en 2001 (640 páginas)."
  fr: "La quatrième et dernière partie de la Critique de la raison arabe de Mohammed Abed al-Jabri, analysant les systèmes de valeurs de la culture arabe, publiée par le Centre d'études sur l'unité arabe, Beyrouth, en 2001 (640 pages)."
  tr: "Muhammed Abed Al-Jabri'nin Arap kültüründeki değer sistemlerini analiz ettiği \"Arap Zihninin Eleştirisi\" projesinin dördüncü ve son bölümü, 2001 yılında Beyrut'taki Arap Birliği Çalışmaları Merkezi tarafından yayımlanan, 640 sayfa uzunluğundadır."
  id: "Bagian keempat dan terakhir dari proyek \"Kritik Pikiran Arab\" oleh Muhammad Abed Al-Jabri, di mana ia menganalisis sistem nilai dalam budaya Arab, diterbitkan oleh Center for Arab Unity Studies di Beirut pada tahun 2001, dengan 640 halaman."
