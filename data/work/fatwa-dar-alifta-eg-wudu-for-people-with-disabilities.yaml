id: work/fatwa-dar-alifta-eg-wudu-for-people-with-disabilities
class: work
kind: fatwa
label: { ar: "كيفية وضوء ذوي الاحتياجات الخاصة", en: "How people with special needs perform wudu", ur: "خصوصی ضروریات والے افراد کا وضو", es: "Cómo realizan el wudu las personas con necesidades especiales", fr: "Comment les personnes ayant des besoins spéciaux effectuent leurs ablutions" }
summary:
  ar: "سائل سأل عن كيفية وضوء ذوي الهمم من أصحاب الاحتياجات الخاصة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20765)⁩ أن الشرع راعى في وضوئهم أعذارهم وعمد إلى رفع الحرج عنهم على ما فصّل الجواب من أحوالهم."
  en: "A questioner asked how people with special needs perform wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20765) answered that the sharia took account of their excuses and acted to lift hardship from them — with their cases set out in the answer."
  ur: "ایک سائل نے خصوصی ضروریات والے افراد کے وضو کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20765)⁩ نے جواب دیا کہ شریعت نے ان کے معذوریتوں کی رعایت کی اور حرج اٹھا دیا — جواب میں ان کے احوال بیان ہوئے۔"
  es: "Una persona preguntó cómo realizan el wudu las personas con necesidades especiales. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20765) respondió que la sharia tuvo en cuenta sus excusas y actuó para aliviarles las dificultades, y sus casos se exponen en la respuesta."
  fr: "Une personne a demandé comment les personnes ayant des besoins spécifiques accomplissent leurs ablutions. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20765) a répondu que la charia prenait en compte leurs circonstances particulières et agissait pour les soulager des difficultés, en détaillant leurs cas dans la réponse."
