id: work/fatwa-aliftaa-jo-students-using-chatgpt-for-research
class: work
kind: fatwa
label: { ar: "استعانة الطلبة بتقنية ChatGPT في إعداد الأبحاث", en: "Students using ChatGPT to prepare research", ur: "طلبہ کا تحقیق کی تیاری میں ChatGPT سے مدد لینا", es: "Estudiantes que utilizan ChatGPT para preparar investigaciones", fr: "Des étudiants utilisent ChatGPT pour préparer leurs recherches", tr: "ChatGPT teknolojisini araştırma makaleleri hazırlamak için kullanan öğrenciler", id: "Siswa yang menggunakan teknologi ChatGPT untuk menyiapkan makalah penelitian" }
summary:
  ar: "سؤال عن استعانة الطلبة بتقنية ChatGPT في إعداد الأبحاث، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز للطالب أن يعد بالتقنية الجهد الأصلي المقصود في البحث وينسبه إلى نفسه لأنه كذب وغش، ولا حرج في الاستعانة بها في الجهد الشكلي كجمع المعلومات والمصادر والتدقيق اللغوي. أجابت الدائرة بأن ChatGPT نموذج تفاعلي قائم على الذكاء الاصطناعي من تطوير شركة OpenAI أطلق في نوفمبر 2022، يمكن استخدامه في إنشاء المحتوى وكتابة المقالات والمساعدة في الأبحاث، وأن حكم استعماله في الأبحاث والواجبات يتوقف على نوع الجهد. فالجهد الأصلي المقصود لذاته، وهو صياغة المعلومات واستخلاص النتائج وترتيب الأفكار ومناقشة القضايا، لا يجوز إعداده بهذه التقنية ونسبته إلى النفس لإيهام المشرفين، لأن البحث وسيلة تقييم، وفي ذلك نيل علامة غير مستحقة ومساواة بالمجتهدين، واستدلت بحديث متفق عليه معناه أن المتظاهر بما لم يعط كلابس ثوبي زور، وبـ[[passage/quran-9-119|سورة التوبة 9:119]]، وبحديث رواه مسلم معناه أن من غشنا فليس منا، وقالت إن ذلك كذب وغش وتزوير. وأما الجهد الشكلي، كالبحث في محركات البحث وجمع المعلومات والإحصائيات والمصادر والتدقيق اللغوي، فلا حرج في الاستعانة فيه بأي وسيلة من وسائل الذكاء الاصطناعي تعطي البحث قوة وأصالة علمية. ونصحت الدائرة الطلبة والباحثين بالابتعاد عن الكذب والغش والتزوير، والمحافظة على الاجتهاد الشخصي في كتابة دراساتهم، واستعمال هذه التقنيات فيما يرضاه الله."
  en: "A question about students using ChatGPT to prepare research, in which Jordan's General Iftaa Department answered that a student may not have the technology produce the core intellectual effort of a research paper and present it as his own, since that is lying and cheating, but may use it for formal tasks such as gathering information and sources and proofreading. The Department answered that ChatGPT is an interactive model based on artificial intelligence, developed by the American company OpenAI and launched in November 2022, which can be used to create content, write articles and help with research; the ruling on using it for research and assignments depends on the kind of effort involved. The original effort that is the point of the work, namely formulating information, drawing conclusions, ordering ideas and discussing open questions, may not be produced with this technology and attributed to oneself to mislead supervisors, since research is a means of assessment, and this earns an undeserved grade and puts the student on a par with those who worked hard. It cited a hadith agreed upon by al-Bukhari and Muslim whose meaning is that one who pretends to have what he was not given is like one wearing two garments of falsehood, [[passage/quran-9-119|Surat al-Tawba 9:119]], and a hadith narrated by Muslim whose meaning is that whoever cheats us is not of us, calling this lying, cheating and forgery. As for formal effort, such as using search engines, gathering information, statistics and sources, and proofreading, there is no objection to using any artificial-intelligence tool that gives the research strength and scholarly authenticity. The Department advised students and researchers to avoid lying, cheating and forgery, to keep their own personal effort in writing their studies, and to use these technologies in ways pleasing to God."
  ur: "طلبہ کا تحقیق کی تیاری میں ChatGPT سے مدد لینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ طالب علم تحقیق کی اصل فکری محنت اس ٹیکنالوجی سے تیار کروا کر اپنی طرف منسوب نہیں کر سکتا کیونکہ یہ جھوٹ اور دھوکہ ہے، البتہ معلومات اور مآخذ جمع کرنے اور زبان کی درستی جیسے ظاہری کاموں میں اس سے مدد لے سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ChatGPT مصنوعی ذہانت پر مبنی ایک تعاملی ماڈل ہے جسے امریکی کمپنی OpenAI نے تیار کیا اور نومبر 2022 میں جاری کیا، جو مواد بنانے، مضامین لکھنے اور تحقیق میں مدد کے لیے استعمال ہو سکتا ہے؛ تحقیق اور اسائنمنٹس میں اس کے استعمال کا حکم محنت کی نوعیت پر موقوف ہے۔ اصل محنت جو بذاتِ خود مقصود ہے، یعنی معلومات کی تشکیل، نتائج اخذ کرنا، خیالات کی ترتیب اور مسائل پر بحث، اسے اس ٹیکنالوجی سے تیار کر کے نگرانوں کو دھوکہ دینے کے لیے اپنی طرف منسوب کرنا جائز نہیں، کیونکہ تحقیق جانچ کا ذریعہ ہے، اور اس سے غیر مستحق نمبر ملتے اور محنتی طلبہ کے برابری ہوتی ہے۔ اس نے متفق علیہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ جو ایسی چیز کا اظہار کرے جو اسے نہیں دی گئی وہ جھوٹ کے دو کپڑے پہننے والے کی طرح ہے، نیز [[passage/quran-9-119|سورۃ التوبہ 9:119]] اور مسلم کی روایت کردہ حدیث کا جس کا مفہوم ہے کہ جو ہمیں دھوکہ دے وہ ہم میں سے نہیں، اور اسے جھوٹ، دھوکہ اور جعل سازی قرار دیا۔ رہی ظاہری محنت، جیسے سرچ انجن سے تلاش، معلومات، اعداد و شمار اور مآخذ جمع کرنا اور زبان کی درستی، تو اس میں مصنوعی ذہانت کے کسی بھی ذریعے سے مدد لینے میں کوئی حرج نہیں جو تحقیق کو مضبوطی اور علمی اصالت دے۔ ڈیپارٹمنٹ نے طلبہ اور محققین کو نصیحت کی کہ جھوٹ، دھوکے اور جعل سازی سے بچیں، اپنی تحقیق لکھنے میں ذاتی محنت برقرار رکھیں، اور ان ٹیکنالوجیز کو اللہ کی رضا کے مطابق استعمال کریں۔"
  es: "Ante una pregunta sobre el uso de ChatGPT por parte de los estudiantes para preparar investigaciones, el Departamento de Estudios Generales de Jordania respondió que un estudiante no puede utilizar esta tecnología para realizar el trabajo intelectual principal de un trabajo de investigación y presentarlo como propio, ya que esto constituye mentira y trampa. Sin embargo, sí puede utilizarla para tareas formales como la recopilación de información y fuentes, y la revisión. El Departamento explicó que ChatGPT es un modelo interactivo basado en inteligencia artificial, desarrollado por la empresa estadounidense OpenAI y lanzado en noviembre de 2022, que puede utilizarse para crear contenido, escribir artículos y ayudar en la investigación. La decisión sobre su uso para investigaciones y trabajos académicos depende del tipo de esfuerzo que implique. El esfuerzo original, que es el objetivo del trabajo (formular información, extraer conclusiones, organizar ideas y debatir cuestiones abiertas), no puede producirse con esta tecnología y atribuirse a uno mismo para engañar a los supervisores, ya que la investigación es un medio de evaluación, y esto conlleva una calificación inmerecida y pone al estudiante al mismo nivel que quienes se han esforzado. Se citó un hadiz consensuado por al-Bujari y Muslim cuyo significado es que quien pretende tener lo que no le fue dado es como quien viste dos vestiduras de falsedad, [[passage/quran-9-119|Surat al-Tawba 9:119]], y un hadiz narrado por Muslim cuyo significado es que quien nos engaña no es de los nuestros, llamando a esto mentira, engaño y falsificación. En cuanto al esfuerzo formal, como el uso de motores de búsqueda, la recopilación de información, estadísticas y fuentes, y la corrección de pruebas, no hay objeción al uso de cualquier herramienta de inteligencia artificial que le dé solidez a la investigación y autenticidad académica. El Departamento aconsejó a los estudiantes e investigadores que evitaran mentir, engañar y falsificar, que mantuvieran su propio esfuerzo personal al escribir sus estudios y que usaran estas tecnologías de maneras agradables a Dios."
  fr: "Concernant l'utilisation de ChatGPT par les étudiants pour préparer leurs recherches, le Département général de l'Iftaa en Jordanie a répondu qu'un étudiant ne peut pas se servir de cette technologie pour réaliser l'essentiel du travail intellectuel d'un article de recherche et le présenter comme étant le sien, car cela constituerait une fraude. En revanche, ChatGPT peut être utilisé pour des tâches formelles telles que la collecte d'informations et de sources, ainsi que la relecture. Le Département a expliqué que ChatGPT est un modèle interactif basé sur l'intelligence artificielle, développé par la société américaine OpenAI et lancé en novembre 2022. Cet outil permet de créer du contenu, de rédiger des articles et d'effectuer des recherches. L'autorisation de l'utiliser pour la recherche et les travaux universitaires dépend de la nature du travail fourni. Le travail initial, qui constitue l'essence même du travail – formuler des informations, tirer des conclusions, organiser les idées et aborder les questions ouvertes – ne peut être réalisé à l'aide de cette technologie et attribué à l'étudiant dans le but de tromper les responsables. La recherche étant un moyen d'évaluation, une telle pratique entraînerait une note injustifiée et mettrait l'étudiant sur un pied d'égalité avec ceux qui ont fourni un travail rigoureux. Le document citait un hadith rapporté par al-Bukhari et Muslim, selon lequel celui qui prétend posséder ce qui ne lui a pas été donné est comme celui qui porte deux vêtements de mensonge [[passage/quran-9-119|Sourate al-Tawba 9:119]], ainsi qu'un hadith rapporté par Muslim affirmant que quiconque nous trompe n'est pas des nôtres, qualifiant ces actes de mensonge, de tromperie et de falsification. Concernant les efforts formels, tels que l'utilisation de moteurs de recherche, la collecte d'informations, de statistiques et de sources, et la relecture, l'utilisation de tout outil d'intelligence artificielle renforçant la rigueur et l'authenticité scientifique de la recherche n'est pas contestée. Le département a conseillé aux étudiants et aux chercheurs d'éviter le mensonge, la tricherie et la falsification, de privilégier leur propre travail de rédaction et d'utiliser ces technologies d'une manière conforme à la volonté divine."
  tr: "Öğrencilerin ChatGPT teknolojisini araştırma hazırlarken kullandığına dair bir soruya Ürdün Genel Fetva Bölümü tarafından yanıtlandı; bir öğrencinin teknolojiye orijinal araştırma çabasını vaat etmemesi ve bunu kendine atfetmemesi gerektiği, çünkü bunun yalan ve hile olduğunu ve bilgi, kaynak toplama veya düzeltme gibi resmi amaçlar için kullanmanın zararı olmadığını belirtti. Bölüm, ChatGPT'nin Kasım 2022'de OpenAI tarafından geliştirilen yapay zeka tabanlı etkileşimli bir model olduğunu, içerik oluşturmak, makale yazmak ve araştırmaya yardımcı olmak için kullanılabileceğini, ayrıca araştırma ve ödevlerde kullanımının çaba türüne bağlı olduğunu yanıtladı. Kendi başına amaçlanan çaba—bilgi formüle etmek, sonuç çıkarmak, fikirleri düzenlemek ve konuları tartışmak—bu teknikle hazırlanmamalı veya danışmanları kandırmak için kendine atfedilmemelidir, çünkü araştırma bir değerlendirme aracıdır; hak edilmemiş bir işaret elde etmek ve bunu müctehidlerle eşitlemek içindir. Sahte giysiler giyiyormuş gibi davranan kişinin sahte giysiler giymeden kendisine ait olduğu anlaşılmış bir hadise ve [[pasaj/kuran-9-119|Tövbe Suresi 9:119] ile Müslüman tarafından anlatılan bir hadise dayanıyordu; yani hile yapan bizden biri değildir ve bunun yalan, hile ve sahtecilik olduğu söylenir. Arama motorlarında arama yapmak, bilgi, istatistik, kaynak toplamak ve dilsel doğrulama gibi resmi çabalar için, araştırmaya bilimsel güç ve özgünlük kazandıran herhangi bir yapay zeka aracının kullanılmasında zarar yoktur. Bölüm, öğrencilere ve araştırmacılara yalan söylemekten, kopya çekmekten ve sahtecilikten kaçınmalarını, çalışmalarını yazarken kişisel özeni sürdürmelerini ve bu teknikleri Tanrı'yı memnun edecek şekilde kullanmalarını tavsiye etti."
  id: "Sebuah pertanyaan tentang siswa yang menggunakan teknologi ChatGPT dalam mempersiapkan penelitian dijawab oleh Departemen Fatwa Umum Yordania bahwa seorang siswa tidak boleh menjanjikan teknologi tersebut upaya penelitian asli dan mengaitkannya dengan diri mereka sendiri karena itu adalah kebohongan dan kecurangan, dan tidak ada salahnya menggunakannya untuk upaya formal seperti mengumpulkan informasi, sumber, atau proofreading. Departemen tersebut menjawab bahwa ChatGPT adalah model interaktif berbasis AI yang dikembangkan oleh OpenAI yang diluncurkan pada November 2022, yang dapat digunakan untuk membuat konten, menulis artikel, dan membantu penelitian, dan bahwa penggunaannya dalam penelitian dan tugas tergantung pada jenis upaya yang dilakukan. Upaya yang dimaksudkan untuk dirinya sendiri—yaitu merumuskan informasi, menarik kesimpulan, mengatur ide, dan membahas isu—tidak boleh dipersiapkan dengan teknik ini atau dikaitkan dengan diri sendiri untuk menipu pengawas, karena penelitian adalah sarana evaluasi, mencapai nilai yang tidak layak dan menyamakannya dengan mujtahid. Penelitian ini didasarkan pada hadis yang disepakati bahwa seseorang yang berpura-pura mengenakan pakaian palsu tanpa diberi pakaian palsu, dan dengan [[ayat/al-Quran-9-119|Surah At-Tawbah 9:119], serta hadis yang diceritakan oleh Muslim yang berarti bahwa siapa pun yang menipu bukanlah salah satu dari kita, dan dikatakan bahwa ini adalah kebohongan, kecurangan, dan pemalsuan. Adapun upaya formal, seperti mencari di mesin pencari, mengumpulkan informasi, statistik, sumber, dan verifikasi linguistik, tidak ada salahnya menggunakan cara kecerdasan buatan yang memberikan kekuatan ilmiah dan keaslian pada penelitian. Departemen tersebut menyarankan mahasiswa dan peneliti untuk menghindari kebohongan, kecurangan, dan pemalsuan, menjaga ketekunan pribadi dalam menulis studi mereka, serta menggunakan teknik-teknik ini dengan cara yang menyenangkan Tuhan."
