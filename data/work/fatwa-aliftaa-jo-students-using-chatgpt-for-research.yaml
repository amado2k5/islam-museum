id: work/fatwa-aliftaa-jo-students-using-chatgpt-for-research
class: work
kind: fatwa
label: { ar: "استعانة الطلبة بتقنية ChatGPT في إعداد الأبحاث", en: "Students using ChatGPT to prepare research", ur: "طلبہ کا تحقیق کی تیاری میں ChatGPT سے مدد لینا" }
summary:
  ar: "سؤال عن استعانة الطلبة بتقنية ChatGPT في إعداد الأبحاث، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز للطالب أن يعد بالتقنية الجهد الأصلي المقصود في البحث وينسبه إلى نفسه لأنه كذب وغش، ولا حرج في الاستعانة بها في الجهد الشكلي كجمع المعلومات والمصادر والتدقيق اللغوي. أجابت الدائرة بأن ChatGPT نموذج تفاعلي قائم على الذكاء الاصطناعي من تطوير شركة OpenAI أطلق في نوفمبر 2022، يمكن استخدامه في إنشاء المحتوى وكتابة المقالات والمساعدة في الأبحاث، وأن حكم استعماله في الأبحاث والواجبات يتوقف على نوع الجهد. فالجهد الأصلي المقصود لذاته، وهو صياغة المعلومات واستخلاص النتائج وترتيب الأفكار ومناقشة القضايا، لا يجوز إعداده بهذه التقنية ونسبته إلى النفس لإيهام المشرفين، لأن البحث وسيلة تقييم، وفي ذلك نيل علامة غير مستحقة ومساواة بالمجتهدين، واستدلت بحديث متفق عليه معناه أن المتظاهر بما لم يعط كلابس ثوبي زور، وبـ[[passage/quran-9-119|سورة التوبة 9:119]]، وبحديث رواه مسلم معناه أن من غشنا فليس منا، وقالت إن ذلك كذب وغش وتزوير. وأما الجهد الشكلي، كالبحث في محركات البحث وجمع المعلومات والإحصائيات والمصادر والتدقيق اللغوي، فلا حرج في الاستعانة فيه بأي وسيلة من وسائل الذكاء الاصطناعي تعطي البحث قوة وأصالة علمية. ونصحت الدائرة الطلبة والباحثين بالابتعاد عن الكذب والغش والتزوير، والمحافظة على الاجتهاد الشخصي في كتابة دراساتهم، واستعمال هذه التقنيات فيما يرضاه الله."
  en: "A question about students using ChatGPT to prepare research, in which Jordan's General Iftaa Department answered that a student may not have the technology produce the core intellectual effort of a research paper and present it as his own, since that is lying and cheating, but may use it for formal tasks such as gathering information and sources and proofreading. The Department answered that ChatGPT is an interactive model based on artificial intelligence, developed by the American company OpenAI and launched in November 2022, which can be used to create content, write articles and help with research; the ruling on using it for research and assignments depends on the kind of effort involved. The original effort that is the point of the work, namely formulating information, drawing conclusions, ordering ideas and discussing open questions, may not be produced with this technology and attributed to oneself to mislead supervisors, since research is a means of assessment, and this earns an undeserved grade and puts the student on a par with those who worked hard. It cited a hadith agreed upon by al-Bukhari and Muslim whose meaning is that one who pretends to have what he was not given is like one wearing two garments of falsehood, [[passage/quran-9-119|Surat al-Tawba 9:119]], and a hadith narrated by Muslim whose meaning is that whoever cheats us is not of us, calling this lying, cheating and forgery. As for formal effort, such as using search engines, gathering information, statistics and sources, and proofreading, there is no objection to using any artificial-intelligence tool that gives the research strength and scholarly authenticity. The Department advised students and researchers to avoid lying, cheating and forgery, to keep their own personal effort in writing their studies, and to use these technologies in ways pleasing to God."
  ur: "طلبہ کا تحقیق کی تیاری میں ChatGPT سے مدد لینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ طالب علم تحقیق کی اصل فکری محنت اس ٹیکنالوجی سے تیار کروا کر اپنی طرف منسوب نہیں کر سکتا کیونکہ یہ جھوٹ اور دھوکہ ہے، البتہ معلومات اور مآخذ جمع کرنے اور زبان کی درستی جیسے ظاہری کاموں میں اس سے مدد لے سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ChatGPT مصنوعی ذہانت پر مبنی ایک تعاملی ماڈل ہے جسے امریکی کمپنی OpenAI نے تیار کیا اور نومبر 2022 میں جاری کیا، جو مواد بنانے، مضامین لکھنے اور تحقیق میں مدد کے لیے استعمال ہو سکتا ہے؛ تحقیق اور اسائنمنٹس میں اس کے استعمال کا حکم محنت کی نوعیت پر موقوف ہے۔ اصل محنت جو بذاتِ خود مقصود ہے، یعنی معلومات کی تشکیل، نتائج اخذ کرنا، خیالات کی ترتیب اور مسائل پر بحث، اسے اس ٹیکنالوجی سے تیار کر کے نگرانوں کو دھوکہ دینے کے لیے اپنی طرف منسوب کرنا جائز نہیں، کیونکہ تحقیق جانچ کا ذریعہ ہے، اور اس سے غیر مستحق نمبر ملتے اور محنتی طلبہ کے برابری ہوتی ہے۔ اس نے متفق علیہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ جو ایسی چیز کا اظہار کرے جو اسے نہیں دی گئی وہ جھوٹ کے دو کپڑے پہننے والے کی طرح ہے، نیز [[passage/quran-9-119|سورۃ التوبہ 9:119]] اور مسلم کی روایت کردہ حدیث کا جس کا مفہوم ہے کہ جو ہمیں دھوکہ دے وہ ہم میں سے نہیں، اور اسے جھوٹ، دھوکہ اور جعل سازی قرار دیا۔ رہی ظاہری محنت، جیسے سرچ انجن سے تلاش، معلومات، اعداد و شمار اور مآخذ جمع کرنا اور زبان کی درستی، تو اس میں مصنوعی ذہانت کے کسی بھی ذریعے سے مدد لینے میں کوئی حرج نہیں جو تحقیق کو مضبوطی اور علمی اصالت دے۔ ڈیپارٹمنٹ نے طلبہ اور محققین کو نصیحت کی کہ جھوٹ، دھوکے اور جعل سازی سے بچیں، اپنی تحقیق لکھنے میں ذاتی محنت برقرار رکھیں، اور ان ٹیکنالوجیز کو اللہ کی رضا کے مطابق استعمال کریں۔"
