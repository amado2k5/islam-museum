id: work/fatwa-dar-alifta-eg-father-insulting-mother
class: work
kind: fatwa
label: { ar: "كيفية تعامل الأولاد مع أبيهم الذي يهين أمهم", en: "How children should treat a father who insults their mother", ur: "بچوں کا ایسے باپ سے سلوک جو ماں کی توہین کرے", es: "Cómo deben tratar los hijos a un padre que insulta a su madre.", fr: "Comment les enfants doivent se comporter avec un père qui insulte leur mère", tr: "Çocuklar, annelerine hakaret eden babalarıyla nasıl başa çıkıyor?", id: "Bagaimana anak laki-laki menghadapi ayah mereka yang menghina ibu mereka" }
summary:
  ar: "سائل سأل عن كيفية تعامل الأولاد مع أبيهم الذي يهين أمهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21838)⁩ أن للأب حق البر والإحسان في جميع الأحوال ولا يسقط هذا الحق بإساءته أو سوء تصرفاته مع الأم وعلى الأولاد التوازن في المعاملة على ما فصّل الجواب."
  en: "A questioner asked how children should treat a father who insults their mother. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21838) answered that the father holds the right of dutifulness and kindness in all circumstances — his bad behaviour towards the mother does not remove that right — and the children should keep balance in their treatment, as the answer details."
  ur: "ایک سائل نے پوچھا کہ بچے اپنے ایسے باپ سے کیا سلوک کریں جو ان کی ماں کی توہین کرتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21838)⁩ نے جواب دیا کہ باپ کا نیکی اور احسان کا حق ہر حال میں ہے اور اس کی بدسلوکی سے یہ حق ساقط نہیں ہوتا؛ بچوں کو معاملے میں توازن رکھنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó cómo deben tratar los hijos a un padre que insulta a su madre. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21838) respondió que el padre tiene el derecho a ser obediente y bondadoso en todas las circunstancias —su mal comportamiento hacia la madre no le quita ese derecho— y que los hijos deben mantener el equilibrio en su trato, como se detalla en la respuesta."
  fr: "Une personne a demandé comment les enfants devaient se comporter avec un père qui insulte leur mère. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21838) a répondu que le père a le droit d'agir avec dévouement et bienveillance en toutes circonstances – son mauvais comportement envers la mère ne le prive pas de ce droit – et que les enfants doivent faire preuve d'équilibre dans leur comportement, comme le précise la réponse."
  tr: "Bir soru soran, çocukların annelerine hakaret eden babalarıyla nasıl başa çıkması gerektiğini sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21838), babanın her durumda iyilik ve iyilik hakkı olduğunu ve bu hak, anneye karşı kötü davranış veya kötü davranışla feragat edilmediğini söyledi. Çocuklar, cevapta detaylandırıldığı gibi, davranışlarında dengeyi korumalıdır."
  id: "Seorang penanya bertanya bagaimana anak-anak harus memperlakukan ayah mereka yang menghina ibunya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21838) menjawab bahwa ayah berhak atas kebaikan dan kebaikan dalam segala keadaan, dan hak ini tidak dilepaskan oleh kesalahan atau perilaku buruk terhadap ibu. Anak-anak harus menjaga keseimbangan dalam urusan mereka, seperti yang dijelaskan dalam jawaban."
