label: { ar: "ترجمة القرآن المقدس بالمليالمية ⁦(بهاء الدين محمد الندوي)⁩", en: "Vishudda Qur'an Vivarthanam (Bahauddeen Muhammed Nadwi)", ur: "وشُدّھ قرآن ووَرتنم ⁦(بہاء الدین محمد ندوی)⁩" }
summary:
  ar: "ترجمة مليالمية لمعاني القرآن وضعها بهاء الدين محمد الندوي، أحد مؤسسي جامعة دار الهدى الإسلامية في كيرالا ورئيسها منذ 2009، بدأها سنة 2004 ونشرها سنة 2015 في مجلد واحد؛ وهي أول ترجمة مليالمية تعرض الآيات في فقرات على ترتيبها مع تقسيم موضوعي، ومعها مقدمة مطوّلة عن مقاصد القرآن، وشروح لأسباب النزول وما يسميه «الإعجاز العلمي»، وخرائط لأحداث السيرة."
  en: "A Malayalam rendering of the meanings of the Qur'an by Bahauddeen Muhammed Nadwi, co-founder of Darul Huda Islamic University in Kerala and its vice chancellor since 2009, begun in 2004 and published in one volume in 2015; it is the first Malayalam translation to set the verses, in their canonical order, in thematic paragraphs, with a long preface on the purposes of the Qur'an, commentary on the occasions of revelation and what he presents as its 'scientific miracles', and maps of the events of the Prophet's life."
  ur: "قرآن کے معانی کا ملیالم ترجمہ از بہاء الدین محمد ندوی، کیرالا کی دار الہدیٰ اسلامک یونیورسٹی کے بانیوں میں سے اور 2009 سے اس کے وائس چانسلر، جو 2004 میں شروع ہوا اور 2015 میں ایک جلد میں شائع ہوا؛ یہ پہلا ملیالم ترجمہ ہے جو آیات کو ان کی ترتیب میں موضوعاتی پیراگرافوں میں پیش کرتا ہے، ساتھ میں مقاصدِ قرآن پر طویل مقدمہ، اسبابِ نزول اور جسے وہ «سائنسی اعجاز» کہتے ہیں اس پر شرح، اور سیرت کے واقعات کے نقشے ہیں۔"
