label: { ar: "كتاب الأغاني" }
summary:
  ar: "كتاب الأغاني لأبي الفرج علي بن الحسين الأصبهاني، كتاب لم يؤلف مثله اتفاقاً؛ سأل أبو محمد المهلبي مؤلفه في كم جمعه فذكر أنه جمعه في خمسين سنة وأنه كتب في عمره مرة واحدة بخطه وأهداه إلى سيف الدولة فأنفذ له ألف دينار، فلما سمع الصاحب بن عباد قال لقد قصر سيف الدولة وإنه ليستحق أضعافها إذ كان للزاهد فكاهة وللعالم مادة وزيادة وللكاتب بضاعة وتجارة وللملك طيبة ولذاذة، وقال لقد اشتملت خزانتي على مئة ألف وسبعة عشر ألف مجلد ما فيها سميري غيره، وكان عضد الدولة لا يفارقه في سفره ولا حضره وبيعت مسودته بسوق بغداد بأربعة آلاف درهم، وذكر ابن خلكان أن ابن عباد كان يستصحب في أسفاره حمل ثلاثين جملاً من كتب الأدب فلما وصل إليه هذا الكتاب لم يكن بعد ذلك يستصحب غيره لاستغنائه به عنها {cite:kashf-zunun-furqan p. 527-528}."
  en: "Abu l-Faraj al-Isfahani's Aghani, 'a book whose like was never written': fifty years in the gathering, the author's only autograph, gifted to Sayf al-Dawla for a thousand dinars — whereupon the Sahib Ibn Abbad declared the prince had shortchanged him, called it his sole companion among the 117,000 volumes of his library, and thereafter replaced his thirty-camel train of adab books with it; its draft sold at Baghdad's suq for 4,000 dirhams and Adud al-Dawla never left it {cite:kashf-zunun-furqan p. 527-528}."
