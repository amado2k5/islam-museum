summary:
  ar: "كتاب الأغاني لأبي الفرج علي بن الحسين الأصبهاني، كتاب لم يؤلف مثله اتفاقاً؛ سأل أبو محمد المهلبي مؤلفه في كم جمعه فذكر أنه جمعه في خمسين سنة وأنه كتب في عمره مرة واحدة بخطه وأهداه إلى سيف الدولة فأنفذ له ألف دينار، فلما سمع الصاحب بن عباد قال لقد قصر سيف الدولة وإنه ليستحق أضعافها إذ كان للزاهد فكاهة وللعالم مادة وزيادة وللكاتب بضاعة وتجارة وللملك طيبة ولذاذة، وقال لقد اشتملت خزانتي على مئة ألف وسبعة عشر ألف مجلد ما فيها سميري غيره، وكان عضد الدولة لا يفارقه في سفره ولا حضره وبيعت مسودته بسوق بغداد بأربعة آلاف درهم، وذكر ابن خلكان أن ابن عباد كان يستصحب في أسفاره حمل ثلاثين جملاً من كتب الأدب فلما وصل إليه هذا الكتاب لم يكن بعد ذلك يستصحب غيره لاستغنائه به عنها {cite:kashf-zunun-furqan p. 527-528}."
  en: "Abu l-Faraj al-Isfahani's Aghani, 'a book whose like was never written': fifty years in the gathering, the author's only autograph, gifted to Sayf al-Dawla for a thousand dinars — whereupon the Sahib Ibn Abbad declared the prince had shortchanged him, called it his sole companion among the 117,000 volumes of his library, and thereafter replaced his thirty-camel train of adab books with it; its draft sold at Baghdad's suq for 4,000 dirhams and Adud al-Dawla never left it {cite:kashf-zunun-furqan p. 527-528}."
  es: "El Aghani de Abu l-Faraj al-Isfahani, 'un libro como nunca se escribió': cincuenta años de recopilación, el único autógrafo del autor, regalado a Sayf al-Dawla por mil dinares, tras lo cual Sahib Ibn Abbad declaró que el príncipe lo había estafado, lo llamó su único compañero entre los 117.000 volúmenes de su biblioteca, y a partir de entonces reemplazó su caravana de treinta camellos de libros de adab con él; su borrador se vendió en el zoco de Bagdad por 4.000 dirhams y Adud al-Dawla nunca se separó de él {cite:kashf-zunun-furqan p. 527-528}."
  fr: "L'Aghani d'Abu l-Faraj al-Isfahani, « un livre sans pareil »: cinquante ans de collecte, seul exemplaire autographe de l'auteur, offert à Sayf al-Dawla pour mille dinars — sur quoi le Sahib Ibn Abbad déclara que le prince l'avait escroqué, le qualifia de son seul compagnon parmi les 117 000 volumes de sa bibliothèque, et remplaça par la suite sa caravane de trente chameaux de livres d'adab par celui-ci; son exemplaire fut vendu au souk de Bagdad pour 4 000 dirhams et Adud al-Dawla ne le quitta jamais {cite:kashf-zunun-furqan p. 527-528}."
  ur: "ابو الفراج اصفہانی کی آغاخانی، 'ایک ایسی کتاب جس کی طرح کبھی نہیں لکھی گئی': اجتماع میں پچاس سال، مصنف کا واحد آٹوگراف، سیف الدولہ کو ایک ہزار دینار میں تحفے میں دیا گیا - جس کے بعد صاحب ابن عباد نے اعلان کیا کہ شہزادے نے اسے مختصر کیا ہے، اسے اپنا واحد ساتھی قرار دیا، اور اس کی جلدوں میں سے 01،01،01، 01،01، 100، 100، 100، 100، 100، 1000 کے درمیان۔ ادب کی کتابوں کی اپنی تیس اونٹوں کی ریل گاڑی کو بدل دیا۔ اس کا مسودہ بغداد کے سوق میں 4,000 درہم میں فروخت ہوا اور عود الدولہ نے اسے کبھی نہیں چھوڑا۔ 527-528}۔"
  tr: "Ebu el-Faraj Ali bin el-Hüseyin el-İsfahani'nin Şarkılar Kitabı, tesadüfen yazılmış diğer kitaplardan farklıdır; Ebu Muhammed el-Muhallabi yazarına ne kadar derlediğini sordu ve yazara elli yılda derlediğini, hayatında bir kez kendi el yazısıyla yazdığını ve Seyf-i Devle'ye hediye ettiğini, onun da ona bin dinar sattığını söyledi. Bunu duyunca Sahib bin Abbad, 'Seyf-el-Devle onu kısalttı ve çok daha fazlasını hak ediyor, çünkü münzevi mizah sahibi, alimin maddi ve ekleme var, yazarın mal ve ticareti var, kralın iyiliği ve neşesi var.' dedi. 'Hazinemde yüz bin var.' dedi. Ve on yedi bin cilt, bunların hiçbirinde başka bir şey Samirce yoktu. Adud al-Dawla onu seyahatlerinde ya da katılımlarında hiç bırakmadı ve el yazması Bağdat pazarında dört bin dirhem karşılığında satıldı. İbn Hallikan, İbn Abbad'ın seyahatlerinde otuz edebi kitap taşıdığını, ancak bu kitapları aldıktan sonra başka kitapları almaya devam ettiğini, çünkü onları karşılayamadığını belirtti {atıf:kaşf-zunun-furqan, s. 527-528}."
  id: "Kitab Lagu oleh Abu al-Faraj Ali ibn al-Husayn al-Isfahani adalah buku yang berbeda dari yang ditulis secara kebetulan; Abu Muhammad al-Muhallabi menanyakan kepada penulisnya berapa banyak yang telah ia kumpulkan, dan ia menyebutkan bahwa ia telah menyusunnya dalam lima puluh tahun, dan bahwa ia pernah menulisnya sekali dalam hidupnya dengan tulisan tangannya sendiri dan memberikannya kepada Sayf al-Dawla, yang kemudian menjual seribu dinar kepadanya. Ketika ia mendengar ini, Sahib ibn Abbad berkata, 'Sayf al-Dawla telah mempersingkatnya dan pantas mendapatkan lebih banyak lagi, karena pertapa memiliki humor, ulama memiliki materi dan tambahan, penulis memiliki barang dan perdagangan, dan raja memiliki kebaikan dan kegembiraan.' Ia berkata, 'Perbendaharaanku berisi seratus ribu.' Dan tujuh belas ribu jilid, yang tidak ada yang memuat bahasa Samiri lainnya. Adud al-Dawla tidak pernah meninggalkannya dalam perjalanan atau kehadirannya, dan manuskripnya dijual di pasar Baghdad seharga empat ribu dirham. Ibn Khallikan menyebutkan bahwa Ibn 'Abbad biasa membawa tiga puluh buku sastra dalam perjalanannya, tetapi ketika menerima buku-buku tersebut, ia tidak lagi membawa buku lain karena tidak mampu membelinya {cite:kashf-zunun-furqan, hlm. 527-528}."
