id: work/fatwa-dar-alifta-eg-laser-hair-removal-fasting
class: work
kind: fatwa
label: { ar: "مدى تأثير جلسة الليزر لإزالة الشعر للمرأة على صيامها", en: "Does a laser hair-removal session affect a woman's fast?", ur: "کیا لیزر سیشن کا عورت کے روزے پر اثر ہے؟" }
summary:
  ar: "سائلة سألت عن تأثير خضوعها لجلسة الليزر لإزالة الشعر وهي صائمة على صومها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21765)⁩ أن خضوعها لجلسة الليزر لإزالة الشعر وهي صائمة لا يؤثر على صومها حتى وإن سبق الفعل وضع بعض المراهم على ما فصّل الجواب."
  en: "A woman asked whether undergoing a laser hair-removal session while fasting affects her fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21765) answered that the session does not affect her fast — even if some ointments were applied beforehand — as the answer details."
  ur: "ایک عورت نے پوچھا کہ روزے کی حالت میں لیزر سے بال ہٹانے کے سیشن کا اس کے روزے پر کیا اثر ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21765)⁩ نے جواب دیا کہ سیشن کا روزے پر کوئی اثر نہیں — خواہ پہلے کوئی مرہم لگا گیا ہو — جیسا کہ جواب میں تفصیل ہے۔"
