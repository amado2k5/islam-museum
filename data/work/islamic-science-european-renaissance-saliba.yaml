summary:
  ar: "كتاب بالإنجليزية لجورج صليبا عن نشأة العلم في الحضارة الإسلامية وصلته بعلم النهضة الأوروبية، متخذًا الفلك نموذجًا، صدر عن مطبعة معهد ماساتشوستس للتقنية سنة 2007."
  en: "An English book by George Saliba on the rise of science in Islamic civilization and its relation to the science of the European Renaissance, taking astronomy as its model, published by MIT Press in 2007."
  ur: "جارج صلیبا کی انگریزی کتاب جو اسلامی تہذیب میں سائنس کے عروج اور یورپی نشاۃِ ثانیہ کی سائنس سے اس کے تعلق پر ہے اور فلکیات کو نمونہ بناتی ہے؛ ایم آئی ٹی پریس سے 2007ء میں شائع ہوئی۔"
  fr: "Islamic Science and the Making of the European Renaissance de George Saliba retrace l'essor et le déclin de la tradition scientifique islamique et le rapport de la science islamique à la science européenne de la Renaissance. Il expose les récits convenus sur la science islamique, en discute les insuffisances et propose un autre récit."
  es: "Islamic Science and the Making of the European Renaissance, de George Saliba, describe el auge y la caída de la tradición científica islámica y la relación de la ciencia islámica con la ciencia europea del Renacimiento. Expone los relatos convencionales sobre la ciencia islámica, discute sus deficiencias y propone una narración alternativa."
  tr: "Islamic Science and the Making of the European Renaissance, George Saliba'nın İslam bilim geleneğinin yükselişini ve düşüşünü ve İslam biliminin Rönesans dönemi Avrupa bilimiyle ilişkisini ele alan kitabıdır. Kitap İslam bilimine dair alışılmış anlatıları ortaya koyar, eksiklerini gösterir ve alternatif bir anlatı önerir."
  id: "Islamic Science and the Making of the European Renaissance karya George Saliba menguraikan kebangkitan dan kemunduran tradisi ilmiah Islam serta hubungan sains Islam dengan sains Eropa pada masa Renaisans. Buku ini memaparkan narasi lazim tentang sains Islam, menunjukkan kekurangannya, dan mengusulkan narasi alternatif."
