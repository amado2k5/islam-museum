id: work/fatwa-amja-vow-of-obedience
class: work
kind: fatwa
label: { ar: "النذر", en: "The vow", ur: "نذر" }
summary:
  ar: "سائل عن نذر نذره. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87070 بتاريخ 6 يوليو 2012)⁩ أنه يلزمه الوفاء بنذره لأنه نذر طاعة لا نذر معصية، وأنه لا يشرع له أن يأكل منه ولا أن يطعم منه أولاده عند جماهير أهل العلم، بل يكون في مصارف الزكاة كالفقراء والمساكين ونحوهم."
  en: "A questioner asked about a vow he had made. The Assembly of Muslim Jurists of America (fatwa no. 87070, 6 July 2012) answered that he must fulfil it because it is a vow of obedience, not of disobedience; that he may not eat of it nor feed his children from it according to the majority of scholars; and that it goes to the zakat recipients such as the poor and needy and the like."
  ur: "ایک سائل نے اپنی کی ہوئی نذر کے بارے میں پوچھا۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 87070، 6 جولائی 2012)⁩ نے جواب دیا کہ اس پر اپنی نذر پوری کرنا لازم ہے کیونکہ یہ طاعت کی نذر ہے معصیت کی نہیں؛ جمهور علماء کے نزدیک نہ وہ خود اس میں سے کھا سکتا ہے نہ اپنے بچوں کو کھلا سکتا ہے؛ بلکہ یہ زکات کے مصارف یعنی فقراء اور مساکین جیسے لوگوں میں جائے گی۔"
