label: { ar: "قرار مجمع الفقه الإسلامي الدولي 204 (21/10) بشأن التقاتل بين المسلمين باسم الجهاد ⁦(تأجيل)⁩", en: "IIFA resolution 204 (21/10) on fighting between Muslims in the name of jihad ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 204 (21/10): مسلمانوں کے آپس کی لڑائی — بہ نامِ جہاد ⁦(مؤجل)⁩", es: "Resolución 204 (21/10) de la IIFA sobre los enfrentamientos entre musulmanes en nombre de la yihad (aplazada)", fr: "Résolution 204 (21/10) de l'IIFA sur les combats entre musulmans au nom du djihad (reportée)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. بعد اطلاع المجلس على البحوث الواردة بخصوص موضوع التقاتل بين المسلمين باسم الجهاد واستماعه إلى المناقشات التي دارت حوله، قرر تأجيل إصدار قرار في الموضوع لمزيد من البحث والدرس. وهو قرار تأجيل لا قرار حكم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). After reviewing the research submitted on fighting between Muslims in the name of jihad and hearing the discussions around it, it resolved to postpone issuing a resolution on the subject for further research and study. A deferral, not a ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ جہاد کے نام سے مسلمانوں کی آپس کی لڑائی کے موضوع پر آنے والی تحقیقات کا جائزہ اور مباحث کے بعد اکیڈمی نے فیصلہ کیا کہ موضوع پر قرارداد جاری کرنا مزید تحقیق و مطالعے کے لیے مؤجل کیا جائے۔ یہ مؤجل کی قرارداد ہے، حکم کی نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 21.ª sesión celebrada en Riad (del 15 al 19 de Muharram de 1435, del 18 al 22 de noviembre de 2013). Tras revisar la investigación presentada sobre los enfrentamientos entre musulmanes en nombre de la yihad y escuchar los debates al respecto, se decidió aplazar la emisión de una resolución sobre el tema para profundizar en la investigación y el estudio. Se trata de un aplazamiento, no de una resolución."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013). Après avoir examiné les recherches soumises sur les combats entre musulmans au nom du djihad et entendu les débats à ce sujet, l'Académie a décidé de reporter la publication d'une résolution afin de permettre des recherches et des études complémentaires. Il s'agit d'un report, et non d'une décision."
