label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن أحكام النقود الورقية وتغير قيمة العملة", en: "IIFA resolution on the rulings of paper money and currency-value change", ur: "اکیڈمی کی قرارداد: کاغذی کرنسی کے احکام اور قدر میں تبدیلی", es: "Resolución de la IIFA sobre las normas relativas al papel moneda y al cambio de valor de la moneda.", fr: "Résolution de l'IIFA sur les décisions relatives à la monnaie fiduciaire et à la variation de la valeur des devises" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: النقود الورقية نقود اعتبارية فيها صفة الثمنية كاملة ولها أحكام الذهب والفضة في الربا والزكاة والسلم وسائر أحكامها، وأجل النظر في مسألة تغير قيمة العملة حتى تستوفي الدراسة لتنظر في الدورة الرابعة."
  en: "IIFA's third-session resolution (Amman, October 1986): paper currencies are conventional money carrying the full attribute of price, governed by gold and silver's rules in riba, zakat, salam and the rest; the question of changing currency value was deferred for fuller study to the fourth session."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: کاغذی کرنسی مکمل ثمن ہے اور سونے چاندی کے احکام ⁦(ربا، زکوٰۃ، سلام)⁩ اس پر لاگو ہیں؛ قدر کرنسی کی تبدیلی کا معاملہ اگلی مجلس تک مؤخر ہوا۔"
  es: "Resolución de la tercera sesión de la IIFA (Amán, octubre de 1986): los billetes son dinero convencional que posee el atributo completo del precio, regido por las reglas del oro y la plata en materia de riba, zakat, salam y demás; la cuestión del cambio de valor de la moneda se aplazó para un estudio más exhaustivo hasta la cuarta sesión."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986): les monnaies papier sont des monnaies conventionnelles qui portent pleinement l'attribut du prix, régies par les règles de l'or et de l'argent en matière de riba, de zakat, de salam et autres; la question de la modification de la valeur de la monnaie a été reportée à la quatrième session pour un examen plus approfondi."
