label: { ar: "قصيدة حسان «فإن تصلح فإنك عابدي»", en: "Hassan's satire of Banu Abid 'If you mend your ways, you are an Abidi'", es: "La sátira de Hassan sobre los Banu Abid: \"Si enmendas tus errores, eres un Abidi\".", fr: "Satire de Hassan sur les Banu Abid: « Si vous changez de comportement, vous êtes un Abidi »", ur: "بنو عابد کا حسن کا طنز 'اگر تم اپنے طریقے ٹھیک کرو تو عابدی ہو'", tr: "Hassan'ın şiiri: \"Eğer doğruysan, benim ibadet edenimsin.\"", id: "Puisi Hassan: \"Jika engkau benar, maka engkau adalah penyembahku.\"" }
summary:
  ar: "أبيات لحسان بن ثابت من الوافر على روي الدال، يهجو بها بني عابد بن عبد الله بن عمرو بن مخزوم {{cite:sharh-diwan-hassan-barquqi-1929 p.142-143}}."
  en: "Verses by Hassan ibn Thabit in the wafir metre on the rhyme dal, satirising Banu Abid ibn Abdallah ibn Amr ibn Makhzum {{cite:sharh-diwan-hassan-barquqi-1929 p.142-143}}."
  es: "Versos de Hassan ibn Thabit en la métrica wafir sobre la rima dal, satirizando a Banu Abid ibn Abdallah ibn Amr ibn Makhzum {{cita:sharh-diwan-hassan-barquqi-1929 p.142-143}}."
  fr: "Versets de Hassan ibn Thabit au wafir mètre sur la rime dal, satirisant Banu Abid ibn Abdallah ibn Amr ibn Makhzum {{cite:sharh-diwan-hassan-barquqi-1929 p.142-143}}."
  ur: "حسان بن ثابت کی آیات وفیر میٹر میں رائم دال پر، بنو عابد ابن عبداللہ ابن عمرو ابن مخزوم پر طنز کرتے ہوئے {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 142-143}}۔"
  tr: "Hassan ibn Thabit'in Al-Wafir'den Dal anlatımı üzerine dizeleri, Banu Abid ibn Abdullah ibn Amr ibn Makhzum hicveyi {{cite:sharh-diwan-hassan-barquqi-1929 s.142-143}}."
  id: "Ayat-ayat oleh Hassan ibn Thabit dari Al-Wafir tentang narasi Dal, menyindir Banu Abid ibn Abdullah ibn Amr ibn Makhzum {{cite:sharh-diwan-hassan-barquqi-1929 hlm.142-143}}."
