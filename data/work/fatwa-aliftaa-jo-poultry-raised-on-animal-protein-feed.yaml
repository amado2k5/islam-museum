id: work/fatwa-aliftaa-jo-poultry-raised-on-animal-protein-feed
class: work
kind: fatwa
label: { ar: "أكل دواجن رُبّيت على أعلاف فيها بروتين حيواني", en: "Eating poultry raised on feed with animal protein", ur: "حیوانی پروٹین والی خوراک پر پالی گئی مرغیوں کا گوشت کھانا", es: "Consumir aves de corral criadas con piensos que contienen proteínas animales.", fr: "Consommer de la volaille élevée avec des aliments contenant des protéines animales" }
summary:
  ar: "سؤال عن دواجن تُعلف بمساحيق بروتينية مصنوعة من مخلفات مسالخ قد تحوي آثار خنزير، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تأخذ حكم الجلّالة إذا كان غالب علفها طاهرًا ولم يتغير لحمها، فلا حرج في أكلها بعد تذكيتها. أجابت الدائرة بأن الأصل كراهة إطعام الحيوان المأكول النجاسة، ونقلت ذلك عن ابن حجر الهيتمي في تحفة المحتاج. وقالت إن الحيوان الذي يتغذى على النجاسة يأخذ حكم الجلّالة، فيُكره أكل لحمه عند الشافعية إذا تغير ريحه أو طعمه، ولا يُكره إن لم يظهر فيه تغير، ونقلت عن زكريا الأنصاري في أسنى المطالب وعن الخطيب الشربيني في مغني المحتاج. وذكرت أن بعض العلماء قيدوا وصف الجلّالة بأن يكون غالب علف الحيوان نجسًا، وأن نسبة هذه المساحيق في العلف المذكور صغيرة وباقي مكوناته طاهرة. وخلصت إلى أن هذه الدواجن لا تأخذ حكم الجلّالة إذا كان غالب طعامها طاهرًا ولم يظهر فساد في لحمها أو بيضها ولم يثبت ضرر أكلها عند أهل الاختصاص، فلا حرج في أكلها بعد تذكيتها، وأنه يُكره أكلها إن كان علفها كله نجسًا أو ظهر الفساد في لحمها، والأولى حينئذ أن تُعلف علفًا طيبًا مدة قبل ذبحها."
  en: "A question about poultry fed protein powders made from slaughterhouse waste that may carry traces of pork, in which Jordan's General Iftaa Department answered that such birds do not count as jallala (animals that feed on filth) if most of their feed is pure and their meat is unchanged, so they may be eaten once properly slaughtered. The Department answered that feeding filth to an animal that is eaten is disliked in principle, citing Ibn Hajar al-Haytami's Tuhfat al-Muhtaj. It said an animal that feeds on filth takes the ruling of the jallala: for the Shafi'is its meat is disliked if its smell or taste has changed and not disliked if no change appears, citing Zakariyya al-Ansari's Asna al-Matalib and al-Khatib al-Shirbini's Mughni al-Muhtaj. It noted that some scholars apply the term jallala only when most of an animal's feed is impure, and that these powders make up a small share of the feed described, the rest being pure. It concluded that the birds do not take the ruling of the jallala if most of their food is pure, no spoilage appears in their meat or eggs and specialists find no harm in eating them, so there is no objection to eating them after proper slaughter; if all their feed is impure or their meat spoils, eating them is disliked, and it is better to give them good feed for a while before slaughter."
  ur: "ان مرغیوں کے بارے میں سوال جنہیں مذبح خانوں کے فضلے سے بنے پروٹین پاؤڈر کھلائے جاتے ہیں جن میں سور کے اثرات ہو سکتے ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر ان کی زیادہ تر خوراک پاک ہو اور گوشت میں تبدیلی نہ ہو تو وہ جلّالہ ⁦(نجاست کھانے والا جانور)⁩ کے حکم میں نہیں، اور شرعی ذبح کے بعد انہیں کھانے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ کھائے جانے والے جانور کو نجاست کھلانا اصلاً مکروہ ہے، اور ابن حجر الہیتمی کی تحفۃ المحتاج سے نقل کیا۔ اس نے کہا کہ نجاست کھانے والا جانور جلّالہ کے حکم میں ہے: شافعیہ کے نزدیک اگر اس کی بو یا ذائقہ بدل جائے تو اس کا گوشت مکروہ ہے اور تبدیلی ظاہر نہ ہو تو مکروہ نہیں؛ اس نے زکریا الانصاری کی اسنی المطالب اور خطیب شربینی کی مغنی المحتاج سے نقل کیا۔ اس نے ذکر کیا کہ بعض علما جلّالہ کا وصف اسی وقت لگاتے ہیں جب جانور کی زیادہ تر خوراک نجس ہو، اور مذکورہ خوراک میں یہ پاؤڈر تھوڑا حصہ ہیں اور باقی اجزا پاک ہیں۔ اس نے نتیجہ نکالا کہ اگر ان مرغیوں کی زیادہ تر خوراک پاک ہو، ان کے گوشت یا انڈوں میں خرابی ظاہر نہ ہو اور ماہرین کے نزدیک ان کا کھانا نقصان دہ نہ ہو تو وہ جلّالہ کے حکم میں نہیں اور شرعی ذبح کے بعد انہیں کھانے میں حرج نہیں؛ اور اگر ساری خوراک نجس ہو یا گوشت خراب ہو جائے تو کھانا مکروہ ہے، اور بہتر ہے کہ ذبح سے پہلے کچھ مدت انہیں پاک خوراک دی جائے۔"
  es: "Una pregunta sobre aves de corral alimentadas con polvos de proteína elaborados a partir de desechos de matadero que pueden contener trazas de carne de cerdo, en la que el Departamento General de Iftaa de Jordania respondió que dichas aves no se consideran jallala (animales que se alimentan de inmundicia) si la mayor parte de su alimento es puro y su carne no ha cambiado, por lo que pueden consumirse una vez sacrificadas adecuadamente. El Departamento respondió que alimentar con inmundicia a un animal que se va a consumir es desaconsejable en principio, citando el Tuhfat al-Muhtaj de Ibn Hajar al-Haytami. Dijo que un animal que se alimenta de inmundicia se rige por la norma de los jallala: para los shafi'ís, su carne es desaconsejable si su olor o sabor ha cambiado y no lo es si no aparece ningún cambio, citando el Asna al-Matalib de Zakariyya al-Ansari y el Mughni al-Muhtaj de al-Khatib al-Shirbini. Se señaló que algunos estudiosos aplican el término jallala solo cuando la mayor parte del alimento de un animal es impuro, y que estos polvos constituyen una pequeña parte del alimento descrito, siendo el resto puro. Se concluyó que las aves no se consideran jallala si la mayor parte de su alimento es puro, no presentan deterioro en su carne ni en sus huevos, y los especialistas no encuentran inconveniente en consumirlas, por lo que no hay objeción a comerlas después de un sacrificio adecuado; si todo su alimento es impuro o su carne se deteriora, se desaconseja su consumo, y es mejor alimentarlas con buena comida durante un tiempo antes del sacrificio."
  fr: "Concernant la volaille nourrie avec des poudres protéinées issues de déchets d'abattoirs susceptibles de contenir des traces de porc, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que ces volailles ne sont pas considérées comme jallala (animaux se nourrissant d'immondices) si leur alimentation est majoritairement pure et que leur viande est intacte. Elles peuvent donc être consommées après un abattage rituel. Le Département a précisé qu'il est déconseillé, par principe, de nourrir un animal destiné à la consommation avec des immondices, citant le Tuhfat al-Muhtaj d'Ibn Hajar al-Haytami. Il a ajouté qu'un animal se nourrissant d'immondices est soumis au statut de jallala: selon l'école chaféite, sa viande est déconseillée si son odeur ou son goût a changé, et non déconseillée si aucun changement n'est constaté, citant l'Asna al-Matalib de Zakariyya al-Ansari et le Mughni al-Muhtaj d'al-Khatib al-Shirbini. Il a été noté que certains érudits n'appliquent le terme « jallala » que lorsque la majeure partie de l'alimentation d'un animal est impure, et que ces poudres ne représentent qu'une petite partie de l'alimentation décrite, le reste étant pur. Il a été conclu que les oiseaux ne sont pas concernés par la règle du « jallala » si la majeure partie de leur nourriture est pure, si leur chair et leurs œufs ne présentent aucune altération et si les spécialistes ne voient aucun inconvénient à les consommer; il n'y a donc aucune objection à les manger après un abattage rituel; en revanche, si toute leur alimentation est impure ou si leur chair est avariée, leur consommation est déconseillée, et il est préférable de leur donner une alimentation de qualité pendant un certain temps avant l'abattage."
