summary:
  ar: "كتاب العروض، كتاب في العروض والقوافي لمؤلفه ابن جني، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 392هـ / 1002م {cite:google-books-kitab-al-arud-ibn-jinni}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "Kitab al-Arud, a book on prosody (arud and qawafi) by Ibn Jinni; its date in a research summary supplied to the museum is d. 392 AH / 1002 CE {cite:google-books-kitab-al-arud-ibn-jinni}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "كتاب العروض، عروض و قوافی پر ایک کتاب، مصنف ابن جني؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 392ھ / 1002ء {cite:google-books-kitab-al-arud-ibn-jinni}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Kitab al-Arud, livre sur la prosodie (arud et qawafi) de Ibn Jinni ; sa date dans une synthèse de recherche remise au musée : m. 392 H / 1002 {cite:google-books-kitab-al-arud-ibn-jinni}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "Kitab al-Arud, libro sobre prosodia (arud y qawafi) de Ibn Jinni; su fecha en un resumen de investigación entregado al museo: m. 392 H. / 1002 {cite:google-books-kitab-al-arud-ibn-jinni}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
