summary:
  ar: "كتاب ليوسف القرضاوي في ظاهرة الصحوة الإسلامية ونقد الغلو، صدر في الدوحة عن رئاسة المحاكم الشرعية والشؤون الدينية في قطر سنة 1981 في 228 صفحة، ثم عن مؤسسة الرسالة."
  en: "A book by Yusuf al-Qaradawi on the Islamic revival and a critique of excess, published in Doha by Qatar's Presidency of Sharia Courts and Religious Affairs in 1981 (228 pages) and later by Mu'assasat al-Risala."
  ur: "یوسف القرضاوی کی کتاب جو اسلامی بیداری اور غلو پر تنقید سے متعلق ہے؛ دوحہ میں قطر کی رئاسۃ المحاکم الشرعیۃ والشؤون الدینیۃ سے 1981ء میں 228 صفحات میں، پھر مؤسسۃ الرسالہ سے شائع ہوئی۔"
  es: "Un libro de Yusuf al-Qaradawi sobre el renacimiento islámico y una crítica del exceso, publicado en Doha por la Presidencia de Tribunales Sharia y Asuntos Religiosos de Qatar en 1981 (228 páginas) y más tarde por Mu'assasat al-Risala."
  fr: "Un livre de Yusuf al-Qaradawi sur le renouveau islamique et une critique des excès, publié à Doha par la présidence qatarienne des tribunaux de la charia et des affaires religieuses en 1981 (228 pages) puis par Mu'assasat al-Risala."
  tr: "Yusuf Al-Karadawi tarafından yazılmış, İslami uyanış olgusu ve aşırılığa yönelik bir eleştiri üzerine bir kitap, 1981'de Katar Şeriat Mahkemeleri ve Dini İşler Başkanlığı tarafından Doha'da yayımlanmış, 228 sayfadan oluşmaktadır ve o dönemde Al-Risalah Vakfı tarafından yayımlanmıştır."
  id: "Sebuah buku karya Yusuf Al-Qaradawi tentang fenomena kebangkitan Islam dan kritik terhadap ekstremisme, diterbitkan di Doha oleh Kepresidenan Pengadilan Syariah dan Urusan Agama di Qatar pada tahun 1981, terdiri dari 228 halaman, yang saat itu oleh Yayasan Al-Risalat (Al-Risalah Foundation)."
