id: work/fatwa-islamweb-joining-prayers-during-a-medical-test
class: work
kind: fatwa
label: { ar: "جواز الجمع بين الصلاتين بسبب أعراض إجراء التحاليل الطبية", en: "Joining two prayers because of the symptoms of a medical test", ur: "طبی ٹیسٹ کی علامات کی وجہ سے دو نمازیں جمع کرنے کا جواز" }
summary:
  ar: "سؤال عن مريض يريد إجراء تحليل فرط نمو البكتيريا في الأمعاء الدقيقة يُعطى فيه محلولًا سكريًا قد يسبب له إسهالًا ومغصًا وغازات لساعات أو ليوم كامل، سأل هل ثبت جمع النبي بين الصلاتين جمعًا فعليًا وهل يجوز له الجمع بسبب هذه الأعراض، أجاب فيه مركز الفتوى بإسلام ويب بأنه ثبت في صحيح مسلم عن ابن عباس أن النبي جمع بين الظهر والعصر وبين المغرب والعشاء بالمدينة من غير خوف ولا مطر لئلا يحرج أمته، وأن بعض العلماء حمله على الجمع الصوري، ورجّح جمع من المحققين أنه جمع حقيقي للمرض أو الحاجة، كما نقل النووي عن أحمد والقاضي حسين والخطابي والمتولي والروياني، وأن جماعة من الأئمة أجازوا الجمع في الحضر للحاجة لمن لا يتخذه عادة. وقرر أنه يجوز للسائل الجمع بين الظهر والعصر وبين المغرب والعشاء تقديمًا أو تأخيرًا بحسب الأرفق بحالته لدفع مشقة الإسهال والغازات والانشغال بالاستبراء والوضوء لكل صلاة، وأن التداوي وإجراء الفحوصات مشروع ولا يلزمه الامتناع عن التحليل، فإن استمرت الأعراض طوال وقت الصلاتين فحكمه حكم أصحاب الأعذار الدائمة كصاحب سلس البول، فيتطهر ويصلي الصلاتين مجموعتين ولا يضره ما يخرج منه، ونقل عن البهوتي في كشاف القناع إباحة الجمع للمستحاضة ومن في حكمها استنادًا إلى حديث حمنة."
  en: "A question from a patient about to undergo a small-intestine bacterial overgrowth test, in which he is given a sugar solution that may cause diarrhoea, cramps and gas for hours or a whole day; he asked whether it is established that the Prophet joined two prayers in reality and whether he may join them because of these symptoms. The fatwa centre of IslamWeb answered that it is established in Sahih Muslim from Ibn Abbas that the Prophet joined the noon and afternoon prayers and the sunset and night prayers in Medina without fear or rain, so as not to burden his community; some scholars read this as an apparent joining, but a number of careful scholars held it to be a real joining for illness or need, as al-Nawawi reports from Ahmad, Qadi Husayn, al-Khattabi, al-Mutawalli and al-Ruyani, and a group of imams allowed joining when resident for a need, for one who does not make it a habit. It ruled that the questioner may join the noon and afternoon prayers, and the sunset and night prayers, by advancing or delaying as is easier for his condition, to ward off the hardship of acute diarrhoea, recurrent gas and the burden of cleansing and ablution for each prayer; that medical treatment and tests are legitimate and he need not forgo the test; and that if the symptoms last through the whole time of the two prayers he is treated like those with a permanent excuse, such as urinary incontinence, so he purifies himself, performs ablution and prays the two prayers joined, unharmed by what leaves his body, quoting al-Buhuti in Kashshaf al-Qina' on the permission for a woman with chronic bleeding and those like her to join prayers on the strength of the hadith of Hamna."
  ur: "ایک مریض کا سوال جو چھوٹی آنت میں بیکٹیریا کی زیادتی کا ٹیسٹ کروانا چاہتا ہے جس میں شکر کا محلول پلایا جاتا ہے جو گھنٹوں یا پورے دن کے لیے اسہال، مروڑ اور گیس کا سبب بن سکتا ہے؛ اس نے پوچھا کہ کیا نبی کا دو نمازوں کو حقیقی طور پر جمع کرنا ثابت ہے اور کیا وہ ان علامات کی وجہ سے جمع کر سکتا ہے۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ صحیح مسلم میں ابن عباس سے ثابت ہے کہ نبی نے مدینہ میں بغیر خوف اور بارش کے ظہر و عصر اور مغرب و عشا کو جمع کیا تاکہ اپنی امت کو تنگی میں نہ ڈالیں؛ بعض علما نے اسے صوری جمع قرار دیا، لیکن محققین کی ایک جماعت نے اسے بیماری یا حاجت کے لیے حقیقی جمع مانا، جیسا کہ نووی نے احمد، قاضی حسین، خطابی، متولی اور رویانی سے نقل کیا، اور اماموں کے ایک گروہ نے حاجت پر حضر میں جمع کی اجازت دی اس کے لیے جو اسے عادت نہ بنائے۔ اس نے فیصلہ کیا کہ سائل ظہر و عصر اور مغرب و عشا کو اپنی حالت کے لیے آسان صورت میں تقدیم یا تاخیر سے جمع کر سکتا ہے، تاکہ شدید اسہال، بار بار گیس اور ہر نماز کے لیے استبرا اور وضو کی مشقت دور ہو؛ علاج اور طبی ٹیسٹ مشروع ہیں اور اس پر ٹیسٹ چھوڑنا لازم نہیں؛ اور اگر علامات دونوں نمازوں کے پورے وقت جاری رہیں تو اس کا حکم دائمی معذوروں کا ہے جیسے پیشاب کے قطروں والا، لہٰذا وہ طہارت اور وضو کر کے دونوں نمازیں جمع کر کے پڑھے اور جو کچھ نکلے اس سے اسے نقصان نہیں، بہوتی کی کشاف القناع سے مستحاضہ اور اس جیسے معذوروں کے لیے حمنہ کی حدیث کی بنا پر جمع کی اجازت نقل کرتے ہوئے۔"
