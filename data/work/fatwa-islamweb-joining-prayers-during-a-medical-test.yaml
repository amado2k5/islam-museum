id: work/fatwa-islamweb-joining-prayers-during-a-medical-test
class: work
kind: fatwa
label: { ar: "جواز الجمع بين الصلاتين بسبب أعراض إجراء التحاليل الطبية", en: "Joining two prayers because of the symptoms of a medical test", ur: "طبی ٹیسٹ کی علامات کی وجہ سے دو نمازیں جمع کرنے کا جواز", es: "Unir dos oraciones debido a los síntomas de una prueba médica", fr: "Jonction de deux prières en raison des symptômes d'un test médical" }
summary:
  ar: "سؤال عن مريض يريد إجراء تحليل فرط نمو البكتيريا في الأمعاء الدقيقة يُعطى فيه محلولًا سكريًا قد يسبب له إسهالًا ومغصًا وغازات لساعات أو ليوم كامل، سأل هل ثبت جمع النبي بين الصلاتين جمعًا فعليًا وهل يجوز له الجمع بسبب هذه الأعراض، أجاب فيه مركز الفتوى بإسلام ويب بأنه ثبت في صحيح مسلم عن ابن عباس أن النبي جمع بين الظهر والعصر وبين المغرب والعشاء بالمدينة من غير خوف ولا مطر لئلا يحرج أمته، وأن بعض العلماء حمله على الجمع الصوري، ورجّح جمع من المحققين أنه جمع حقيقي للمرض أو الحاجة، كما نقل النووي عن أحمد والقاضي حسين والخطابي والمتولي والروياني، وأن جماعة من الأئمة أجازوا الجمع في الحضر للحاجة لمن لا يتخذه عادة. وقرر أنه يجوز للسائل الجمع بين الظهر والعصر وبين المغرب والعشاء تقديمًا أو تأخيرًا بحسب الأرفق بحالته لدفع مشقة الإسهال والغازات والانشغال بالاستبراء والوضوء لكل صلاة، وأن التداوي وإجراء الفحوصات مشروع ولا يلزمه الامتناع عن التحليل، فإن استمرت الأعراض طوال وقت الصلاتين فحكمه حكم أصحاب الأعذار الدائمة كصاحب سلس البول، فيتطهر ويصلي الصلاتين مجموعتين ولا يضره ما يخرج منه، ونقل عن البهوتي في كشاف القناع إباحة الجمع للمستحاضة ومن في حكمها استنادًا إلى حديث حمنة."
  en: "A question from a patient about to undergo a small-intestine bacterial overgrowth test, in which he is given a sugar solution that may cause diarrhoea, cramps and gas for hours or a whole day; he asked whether it is established that the Prophet joined two prayers in reality and whether he may join them because of these symptoms. The fatwa centre of IslamWeb answered that it is established in Sahih Muslim from Ibn Abbas that the Prophet joined the noon and afternoon prayers and the sunset and night prayers in Medina without fear or rain, so as not to burden his community; some scholars read this as an apparent joining, but a number of careful scholars held it to be a real joining for illness or need, as al-Nawawi reports from Ahmad, Qadi Husayn, al-Khattabi, al-Mutawalli and al-Ruyani, and a group of imams allowed joining when resident for a need, for one who does not make it a habit. It ruled that the questioner may join the noon and afternoon prayers, and the sunset and night prayers, by advancing or delaying as is easier for his condition, to ward off the hardship of acute diarrhoea, recurrent gas and the burden of cleansing and ablution for each prayer; that medical treatment and tests are legitimate and he need not forgo the test; and that if the symptoms last through the whole time of the two prayers he is treated like those with a permanent excuse, such as urinary incontinence, so he purifies himself, performs ablution and prays the two prayers joined, unharmed by what leaves his body, quoting al-Buhuti in Kashshaf al-Qina' on the permission for a woman with chronic bleeding and those like her to join prayers on the strength of the hadith of Hamna."
  ur: "ایک مریض کا سوال جو چھوٹی آنت میں بیکٹیریا کی زیادتی کا ٹیسٹ کروانا چاہتا ہے جس میں شکر کا محلول پلایا جاتا ہے جو گھنٹوں یا پورے دن کے لیے اسہال، مروڑ اور گیس کا سبب بن سکتا ہے؛ اس نے پوچھا کہ کیا نبی کا دو نمازوں کو حقیقی طور پر جمع کرنا ثابت ہے اور کیا وہ ان علامات کی وجہ سے جمع کر سکتا ہے۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ صحیح مسلم میں ابن عباس سے ثابت ہے کہ نبی نے مدینہ میں بغیر خوف اور بارش کے ظہر و عصر اور مغرب و عشا کو جمع کیا تاکہ اپنی امت کو تنگی میں نہ ڈالیں؛ بعض علما نے اسے صوری جمع قرار دیا، لیکن محققین کی ایک جماعت نے اسے بیماری یا حاجت کے لیے حقیقی جمع مانا، جیسا کہ نووی نے احمد، قاضی حسین، خطابی، متولی اور رویانی سے نقل کیا، اور اماموں کے ایک گروہ نے حاجت پر حضر میں جمع کی اجازت دی اس کے لیے جو اسے عادت نہ بنائے۔ اس نے فیصلہ کیا کہ سائل ظہر و عصر اور مغرب و عشا کو اپنی حالت کے لیے آسان صورت میں تقدیم یا تاخیر سے جمع کر سکتا ہے، تاکہ شدید اسہال، بار بار گیس اور ہر نماز کے لیے استبرا اور وضو کی مشقت دور ہو؛ علاج اور طبی ٹیسٹ مشروع ہیں اور اس پر ٹیسٹ چھوڑنا لازم نہیں؛ اور اگر علامات دونوں نمازوں کے پورے وقت جاری رہیں تو اس کا حکم دائمی معذوروں کا ہے جیسے پیشاب کے قطروں والا، لہٰذا وہ طہارت اور وضو کر کے دونوں نمازیں جمع کر کے پڑھے اور جو کچھ نکلے اس سے اسے نقصان نہیں، بہوتی کی کشاف القناع سے مستحاضہ اور اس جیسے معذوروں کے لیے حمنہ کی حدیث کی بنا پر جمع کی اجازت نقل کرتے ہوئے۔"
  es: "Una pregunta de un paciente que estaba a punto de someterse a una prueba de sobrecrecimiento bacteriano del intestino delgado, en la que se le administra una solución de azúcar que puede causar diarrea, calambres y gases durante horas o un día entero; preguntó si está comprobado que el Profeta unió dos oraciones en realidad y si puede unirse a ellas debido a estos síntomas. El centro de fatwas de IslamWeb respondió que está establecido en Sahih Muslim de Ibn Abbas que el Profeta unió las oraciones del mediodía y de la tarde y las oraciones del atardecer y de la noche en Medina sin temor a la lluvia, para no ser una carga para su comunidad; algunos eruditos lo interpretaron como una unión aparente, pero varios eruditos cuidadosos sostuvieron que era una unión real por enfermedad o necesidad, como informa al-Nawawi de Ahmad, Qadi Husayn, al-Khattabi, al-Mutawalli y al-Ruyani, y un grupo de imanes permitió unirse cuando residía por necesidad, para quien no lo hacía un hábito. Dictaminó que el consultante puede unirse a las oraciones del mediodía y de la tarde, y a las oraciones del atardecer y de la noche, adelantándolas o retrasándolas según le resulte más fácil en su condición, para evitar las dificultades de la diarrea aguda, los gases recurrentes y la carga de la limpieza y la ablución para cada oración; que el tratamiento médico y las pruebas son legítimos y no necesita renunciar a la prueba; y que si los síntomas duran todo el tiempo de las dos oraciones se le trata como a aquellos con una excusa permanente, como la incontinencia urinaria, por lo que se purifica, realiza la ablución y reza las dos oraciones juntas, sin sufrir daño alguno por lo que sale de su cuerpo, citando a al-Buhuti en Kashshaf al-Qina' sobre el permiso para que una mujer con sangrado crónico y aquellas como ella unan las oraciones en base al hadiz de Hamna."
  fr: "Un patient sur le point de subir un test de prolifération bactérienne de l'intestin grêle, au cours duquel on lui administre une solution sucrée susceptible de provoquer diarrhée, crampes et gaz pendant plusieurs heures, voire une journée entière, a demandé s'il était établi que le Prophète ait réellement regroupé deux prières et s'il pouvait lui-même les accomplir en raison de ces symptômes. Le centre de fatwas d'IslamWeb a répondu que, selon le Sahih Muslim d'après Ibn Abbas, le Prophète regroupait les prières de midi et de l'après-midi, ainsi que celles du coucher du soleil et de la nuit à Médine, sans crainte ni pluie, afin de ne pas surcharger sa communauté. Certains savants interprètent cela comme un regroupement apparent, tandis que d'autres, plus rigoureux, considèrent qu'il s'agissait d'un regroupement réel pour cause de maladie ou de nécessité. Al-Nawawi rapporte d'après Ahmad, Qadi Husayn, al-Khattabi, al-Mutawalli et al-Ruyani. Un groupe d'imams a autorisé ce regroupement, pour les résidents, en cas de besoin, à condition que cela ne soit pas une habitude. Il a été statué que le demandeur pouvait regrouper les prières de midi et de l'après-midi, ainsi que celles du coucher du soleil et de la nuit, en les avançant ou en les retardant selon son état, afin d'éviter les désagréments liés à une diarrhée aiguë, aux flatulences récurrentes et à la contrainte des ablutions pour chaque prière; que les traitements et examens médicaux étaient légitimes et qu'il ne devait pas renoncer aux examens; et que si les symptômes persistaient pendant toute la durée des deux prières, il était traité comme ceux qui bénéficiaient d'une excuse permanente, telle que l'incontinence urinaire; il pouvait alors se purifier, effectuer ses ablutions et prier les deux prières ensemble, sans être affecté par les sécrétions de son corps, citant al-Buhuti dans Kashshaf al-Qina' concernant la permission accordée à une femme souffrant de saignements chroniques et à celles qui lui ressemblent de regrouper les prières, en se fondant sur le hadith de Hamna."
