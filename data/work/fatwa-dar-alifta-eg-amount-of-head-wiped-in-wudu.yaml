id: work/fatwa-dar-alifta-eg-amount-of-head-wiped-in-wudu
class: work
kind: fatwa
label: { ar: "القدر الواجب مسحه من الرأس في الوضوء", en: "The amount of the head that must be wiped in wudu", ur: "وضو میں سر کے کس حصے کا مسح واجب ہے" }
summary:
  ar: "سائل سأل عن القدر الواجب مسحه من الرأس في الوضوء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21608)⁩ أن القدر الواجب مسحه من الرأس هو ما يدخل تحت مسمى المسح ويتحقق بإمرار بعض اليد على بعض الرأس ولو بمسح بعض الشعر على ما فصّل الجواب."
  en: "A questioner asked how much of the head must be wiped in wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21608) answered that the obligatory amount is whatever falls under the name of wiping — realised by passing part of the hand over part of the head, even over part of the hair — as the answer details."
  ur: "ایک سائل نے وضو میں سر کا کتنا حصہ مسح کرنا واجب ہے پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21608)⁩ نے جواب دیا کہ واجب مقدار وہ ہے جسے مسح کہا جا سکے ہاتھ کا کچھ حصہ سر کے کچھ حصے پر پھیر لینے سے حاصل ہو جاتا ہے خواہ کچھ بالوں پر ہی ہو — جیسا کہ جواب میں تفصیل ہے۔"
