label:
  ar: "السيرة النبوية للمصلحين، الحلقة 24: غزوة بني قريظة"
  en: "The Prophetic Biography for Reformers, episode 24: The Expedition of Banu Qurayza"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 24: غزوہ بنو قریظہ"
  fr: "La biographie prophétique pour les réformateurs, épisode 24 : L'expédition contre les Banu Qurayza"
  es: "La biografía profética para los reformadores, episodio 24: La expedición contra los Banu Qurayza"
summary:
  ar: "يواصل المحاضر الحديث بعد غزوة الخندق إلى حصار بني قريظة: نداء جبريل، وإلقاء الرعب في المحاصرين، واستسلامهم وحكم سعد بن معاذ، ثم دعاء سعد ووفاته. ثم يتناول الزواج بزينب بنت جحش بوصفه الإبطال العملي للتبني، ويختم بالخلاف في صلاة العصر في الطريق الذي يقرؤه نموذجًا للخلاف المعتبر."
  en: "The lecturer continues from the Battle of the Trench to the siege of Banu Qurayza: the angel Jibril's summons, the terror cast into the besieged, their surrender and Sa'd ibn Mu'adh's judgment, and Sa'd's prayer and death. He then treats the marriage to Zaynab bint Jahsh as the practical end of adoption, and closes with the dispute over praying the afternoon prayer on the road, which he reads as a model of accepted disagreement."
  ur: "مقرر غزوہ خندق کے بعد بنو قریظہ کے محاصرے کا بیان جاری رکھتے ہیں: جبریل کی پکار، محصورین کے دلوں میں ڈالا گیا رعب، ان کا ہتھیار ڈالنا اور سعد بن معاذ کا فیصلہ، پھر سعد کی دعا اور وفات۔ اس کے بعد وہ زینب بنت جحش سے نکاح کو تبنیت کے عملی خاتمے کے طور پر بیان کرتے ہیں، اور آخر میں راستے میں نمازِ عصر پڑھنے کے اختلاف پر بات ختم کرتے ہیں جسے وہ قابلِ اعتبار اختلاف کا نمونہ سمجھتے ہیں۔"
  fr: "Le conférencier poursuit après la bataille du Fossé avec le siège des Banu Qurayza : l'appel de l'ange Jibril, la terreur jetée dans le cœur des assiégés, leur reddition et le jugement de Sa'd ibn Mu'adh, puis la prière et la mort de Sa'd. Il traite ensuite le mariage avec Zaynab bint Jahsh comme la fin concrète de l'adoption, et termine sur le désaccord à propos de la prière de l'après-midi faite en chemin, qu'il lit comme un modèle de désaccord admis."
  es: "El conferenciante continúa tras la batalla de la Zanja con el asedio de los Banu Qurayza: la llamada del ángel Jibril, el terror lanzado en los sitiados, su rendición y el juicio de Sa'd ibn Mu'adh, y luego la súplica y la muerte de Sa'd. Después trata el matrimonio con Zaynab bint Jahsh como el fin práctico de la adopción y cierra con la disputa sobre rezar la oración de la tarde en el camino, que lee como modelo de desacuerdo admitido."
