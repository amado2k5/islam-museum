id: work/fatwa-aliftaa-jo-enemas-and-suppositories-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال التحاميل والحقن الشرجية للصائم", en: "Enemas and suppositories while fasting", ur: "روزے میں انیما اور سپوزیٹری کا استعمال", es: "Enemas y supositorios durante el ayuno", fr: "Lavements et suppositoires pendant le jeûne", tr: "Oruç tutan bireylerde fitil ve lavman kullanımı", id: "Penggunaan supositoria dan enema untuk individu yang berpuasa" }
summary:
  ar: "سؤال عن استعمال التحاميل والحقن الشرجية للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحقن الشرجية والتحاميل في أحد السبيلين من المفطرات، وأن المحتاج إليها يستعملها ويمسك ويقضي. أجابت الدائرة بأن الحقن الشرجية أو التحاميل في أحد السبيلين من المفطرات. واستندت إلى أثر عن ابن عباس رواه البيهقي في السنن الكبرى بأن الفطر مما دخل لا مما خرج، وقالت إن عمومه يدل على أن ما دخل مفطر سواء كان مطعومًا أو غير مطعوم. وقالت إنه ينبغي استعمالها قبل الفجر أو بعد الإفطار، فإن احتاج إليها استعملها وبقي ممسكًا وقضى ذلك اليوم."
  en: "A question about enemas and suppositories while fasting, in which Jordan's General Iftaa Department answered that enemas and suppositories in either passage break the fast, and that someone who needs them uses them, keeps refraining and makes the day up. The Department answered that enemas or suppositories in either passage are among the things that break the fast. It relied on a report from Ibn Abbas, transmitted by al-Bayhaqi in al-Sunan al-Kubra, that breaking the fast comes from what enters the body, not from what leaves it, and said its general wording shows that whatever enters breaks the fast, whether it is food or not. It said they should be used before dawn or after breaking the fast; if someone needs one during the day, he uses it, keeps refraining from food and drink, and makes that day up."
  ur: "روزے میں انیما اور سپوزیٹری کا استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دونوں راستوں میں سے کسی میں انیما یا سپوزیٹری روزہ توڑ دیتی ہے، اور جسے ضرورت ہو وہ استعمال کرے، رکا رہے اور قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ دونوں راستوں میں سے کسی میں انیما یا سپوزیٹری روزہ توڑنے والی چیزوں میں سے ہے۔ اس نے ابن عباس کے ایک اثر پر انحصار کیا جسے بیہقی نے السنن الکبریٰ میں روایت کیا کہ روزہ اس چیز سے ٹوٹتا ہے جو اندر جائے نہ کہ جو باہر نکلے، اور کہا کہ اس کے عموم سے معلوم ہوتا ہے کہ اندر جانے والی چیز روزہ توڑتی ہے چاہے کھانے کی ہو یا نہ ہو۔ اس نے کہا کہ انہیں فجر سے پہلے یا افطار کے بعد استعمال کرنا چاہیے؛ اگر دن میں ضرورت ہو تو استعمال کرے، کھانے پینے سے رکا رہے اور اس دن کی قضا کرے۔"
  es: "Una pregunta sobre enemas y supositorios durante el ayuno, en la que el Departamento General de Iftaa de Jordania respondió que los enemas y supositorios, en cualquiera de sus formas, rompen el ayuno, y que quien los necesite los use, continúe absteniéndose y recupere el día. El Departamento respondió que los enemas o supositorios, en cualquiera de sus formas, se encuentran entre las cosas que rompen el ayuno. Se basó en un informe de Ibn Abbas, transmitido por al-Bayhaqi en al-Sunan al-Kubra, que dice que la ruptura del ayuno proviene de lo que entra en el cuerpo, no de lo que sale de él, y dijo que su redacción general muestra que todo lo que entra rompe el ayuno, sea alimento o no. Dijo que deben usarse antes del amanecer o después de romper el ayuno; si alguien necesita uno durante el día, lo usa, continúa absteniéndose de comer y beber, y recupera ese día."
  fr: "Une question concernant les lavements et les suppositoires pendant le jeûne a été posée par le Département général de la Ifta de Jordanie. Ce dernier a répondu que les lavements et les suppositoires, quel que soit le passage cité, rompent le jeûne. Il a précisé que celui qui en a besoin les utilise, continue de s'abstenir et rattrape le jour manqué. Le Département a indiqué que les lavements et les suppositoires, dans les deux passages, font partie des actes qui rompent le jeûne. Il s'est appuyé sur un hadith d'Ibn Abbas, transmis par al-Bayhaqi dans al-Sunan al-Kubra, selon lequel la rupture du jeûne est liée à ce qui entre dans le corps, et non à ce qui en sort. Le Département a ajouté que la formulation générale du texte montre que tout ce qui entre rompt le jeûne, qu'il s'agisse de nourriture ou non. Il a précisé que les lavements et les suppositoires doivent être utilisés avant l'aube ou après la rupture du jeûne. Si un lavement ou un suppositoire est nécessaire pendant la journée, il doit l'utiliser, continuer de s'abstenir de manger et de boire, et rattraper le jour manqué."
  tr: "Oruç tutan kişiler için fitil ve lavman kullanımıyla ilgili bir soru, Ürdün Genel Fetva Dairesi, lavman ve fitilin orucu bozan iki yoldan biri olduğunu, ihtiyacı olanların onları kullanması, tutunması ve oruçları tamamlaması gerektiğini yanıtladı. Daire, lavman veya fitilin orucu bozmanın iki yolundan biri olduğunu yanıtladı. El-Sünen El-Kubra'da Al-Bayhaqi tarafından anlatılan İbn Abbas'ın raporuna dayanarak, oruç kırmanın çıkarılan değil, giren şeyden kaynaklandığını, genel anlamının girenin aşılı olsun ya da olmasın bozulduğunu gösterdiğini belirtti. Şafak öncesi veya oruçtan sonra kullanılması gerektiğini; gerekirse kullanılıp tutulmaya devam edilmesi ve günü telafi edilmesi gerektiğini belirtti."
  id: "Sebuah pertanyaan tentang penggunaan supositoria dan enema untuk orang yang berpuasa, di mana Departemen Fatwa Umum Yordania menjawab bahwa enema dan supositoria adalah salah satu dari dua cara yang memutus puasa, dan bahwa mereka yang membutuhkannya harus menggunakannya, bertahan, dan mengerjakan puasa. Departemen menjawab bahwa enema atau suppositoria adalah salah satu dari dua cara yang memutus puasa. Mereka mengandalkan laporan dari Ibn Abbas yang diceritakan oleh Al-Bayhaqi dalam Al-Sunan Al-Kubra bahwa berbuka puasa berasal dari apa yang masuk, bukan apa yang dikeluarkan, dan mengatakan bahwa makna umumnya menunjukkan bahwa apa yang masuk adalah yang dilanggar baik divaksinasi maupun tidak. Dikatakan bahwa enema atau suppositoria harus digunakan sebelum fajar atau setelah berpuasa; jika perlu, gunakan dan tetap pegang dan selesaikan hari."
