id: work/fatwa-aliftaa-jo-enemas-and-suppositories-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال التحاميل والحقن الشرجية للصائم", en: "Enemas and suppositories while fasting", ur: "روزے میں انیما اور سپوزیٹری کا استعمال" }
summary:
  ar: "سؤال عن استعمال التحاميل والحقن الشرجية للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحقن الشرجية والتحاميل في أحد السبيلين من المفطرات، وأن المحتاج إليها يستعملها ويمسك ويقضي. أجابت الدائرة بأن الحقن الشرجية أو التحاميل في أحد السبيلين من المفطرات. واستندت إلى أثر عن ابن عباس رواه البيهقي في السنن الكبرى بأن الفطر مما دخل لا مما خرج، وقالت إن عمومه يدل على أن ما دخل مفطر سواء كان مطعومًا أو غير مطعوم. وقالت إنه ينبغي استعمالها قبل الفجر أو بعد الإفطار، فإن احتاج إليها استعملها وبقي ممسكًا وقضى ذلك اليوم."
  en: "A question about enemas and suppositories while fasting, in which Jordan's General Iftaa Department answered that enemas and suppositories in either passage break the fast, and that someone who needs them uses them, keeps refraining and makes the day up. The Department answered that enemas or suppositories in either passage are among the things that break the fast. It relied on a report from Ibn Abbas, transmitted by al-Bayhaqi in al-Sunan al-Kubra, that breaking the fast comes from what enters the body, not from what leaves it, and said its general wording shows that whatever enters breaks the fast, whether it is food or not. It said they should be used before dawn or after breaking the fast; if someone needs one during the day, he uses it, keeps refraining from food and drink, and makes that day up."
  ur: "روزے میں انیما اور سپوزیٹری کا استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دونوں راستوں میں سے کسی میں انیما یا سپوزیٹری روزہ توڑ دیتی ہے، اور جسے ضرورت ہو وہ استعمال کرے، رکا رہے اور قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ دونوں راستوں میں سے کسی میں انیما یا سپوزیٹری روزہ توڑنے والی چیزوں میں سے ہے۔ اس نے ابن عباس کے ایک اثر پر انحصار کیا جسے بیہقی نے السنن الکبریٰ میں روایت کیا کہ روزہ اس چیز سے ٹوٹتا ہے جو اندر جائے نہ کہ جو باہر نکلے، اور کہا کہ اس کے عموم سے معلوم ہوتا ہے کہ اندر جانے والی چیز روزہ توڑتی ہے چاہے کھانے کی ہو یا نہ ہو۔ اس نے کہا کہ انہیں فجر سے پہلے یا افطار کے بعد استعمال کرنا چاہیے؛ اگر دن میں ضرورت ہو تو استعمال کرے، کھانے پینے سے رکا رہے اور اس دن کی قضا کرے۔"
