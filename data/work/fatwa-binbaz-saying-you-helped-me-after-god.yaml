id: work/fatwa-binbaz-saying-you-helped-me-after-god
class: work
kind: fatwa
label: { ar: "حكم قول: أنت ساعدتني في كذا بعد الله", en: "Saying 'you helped me with this after God'", ur: "یہ کہنا کہ 'اللہ کے بعد تم نے میری مدد کی' کا حکم" }
summary:
  ar: "سؤال عن جواز قول القائل لشخص: أنت الذي ساعدتني في كذا بعد الله، أجاب فيه ابن باز بأنه لا بأس بذلك، وكذلك قول: لولا الله ثم أنت، وهذا من الله ثم منك، وأنت ساعدتني بعد الله في كذا؛ وأن الذي لا يجوز هو العطف بالواو كقول: لولا الله وأنت، وهذا من الله ومنك، وما شاء الله وأنت، فهذه الواو هي التي لا تجوز، أما ثم وبعد فلا بأس بهما."
  en: "A question whether one may say to a person 'it was you who helped me with such-and-such after God', in which Ibn Baz answered that there is no harm in it, nor in saying 'were it not for God and then you', 'this is from God and then from you', or 'you helped me after God with such-and-such'; what is not permitted is joining with the conjunction 'and', as in 'were it not for God and you', 'this is from God and you', or 'what God wills and you', since it is this 'and' that is impermissible, whereas 'then' and 'after' are unobjectionable."
  ur: "اس بارے میں سوال کہ کیا کسی شخص سے یہ کہنا جائز ہے کہ 'اللہ کے بعد تم ہی نے فلاں کام میں میری مدد کی'، جس میں ابن باز نے جواب دیا کہ اس میں کوئی حرج نہیں، نہ یہ کہنے میں کہ 'اگر اللہ نہ ہوتا پھر تم'، 'یہ اللہ کی طرف سے ہے پھر تمہاری طرف سے'، یا 'تم نے اللہ کے بعد فلاں کام میں میری مدد کی'؛ جو جائز نہیں وہ 'اور' کے ساتھ ملانا ہے، جیسے 'اگر اللہ اور تم نہ ہوتے'، 'یہ اللہ اور تمہاری طرف سے ہے'، یا 'جو اللہ چاہے اور تم'، کیونکہ یہی 'اور' ناجائز ہے، جبکہ 'پھر' اور 'بعد' میں کوئی حرج نہیں۔"
