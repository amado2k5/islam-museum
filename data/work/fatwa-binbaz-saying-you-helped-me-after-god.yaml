id: work/fatwa-binbaz-saying-you-helped-me-after-god
class: work
kind: fatwa
label: { ar: "حكم قول: أنت ساعدتني في كذا بعد الله", en: "Saying 'you helped me with this after God'", ur: "یہ کہنا کہ 'اللہ کے بعد تم نے میری مدد کی' کا حکم", es: "Decir 'me ayudaste con esto después de Dios'", fr: "Dire « tu m'as aidé avec ça après Dieu »", tr: "Şöyle bir şeyde bana Allah yardımı yaptın demeye karar", id: "Putusan yang mengatakan: Engkau telah membantuku dalam hal ini setelah Allah" }
summary:
  ar: "سؤال عن جواز قول القائل لشخص: أنت الذي ساعدتني في كذا بعد الله، أجاب فيه ابن باز بأنه لا بأس بذلك، وكذلك قول: لولا الله ثم أنت، وهذا من الله ثم منك، وأنت ساعدتني بعد الله في كذا؛ وأن الذي لا يجوز هو العطف بالواو كقول: لولا الله وأنت، وهذا من الله ومنك، وما شاء الله وأنت، فهذه الواو هي التي لا تجوز، أما ثم وبعد فلا بأس بهما."
  en: "A question whether one may say to a person 'it was you who helped me with such-and-such after God', in which Ibn Baz answered that there is no harm in it, nor in saying 'were it not for God and then you', 'this is from God and then from you', or 'you helped me after God with such-and-such'; what is not permitted is joining with the conjunction 'and', as in 'were it not for God and you', 'this is from God and you', or 'what God wills and you', since it is this 'and' that is impermissible, whereas 'then' and 'after' are unobjectionable."
  ur: "اس بارے میں سوال کہ کیا کسی شخص سے یہ کہنا جائز ہے کہ 'اللہ کے بعد تم ہی نے فلاں کام میں میری مدد کی'، جس میں ابن باز نے جواب دیا کہ اس میں کوئی حرج نہیں، نہ یہ کہنے میں کہ 'اگر اللہ نہ ہوتا پھر تم'، 'یہ اللہ کی طرف سے ہے پھر تمہاری طرف سے'، یا 'تم نے اللہ کے بعد فلاں کام میں میری مدد کی'؛ جو جائز نہیں وہ 'اور' کے ساتھ ملانا ہے، جیسے 'اگر اللہ اور تم نہ ہوتے'، 'یہ اللہ اور تمہاری طرف سے ہے'، یا 'جو اللہ چاہے اور تم'، کیونکہ یہی 'اور' ناجائز ہے، جبکہ 'پھر' اور 'بعد' میں کوئی حرج نہیں۔"
  es: "Una pregunta sobre si se puede decir a una persona \"fuiste tú quien me ayudó con tal y cual cosa después de Dios\", a lo que Ibn Baz respondió que no hay daño en ello, ni en decir \"si no fuera por Dios y luego tú\", \"esto es de Dios y luego de ti\", o \"me ayudaste después de Dios con tal y cual cosa\"; lo que no está permitido es unir con la conjunción \"y\", como en \"si no fuera por Dios y tú\", \"esto es de Dios y de ti\", o \"lo que Dios quiera y tú\", ya que es este \"y\" el que no está permitido, mientras que \"luego\" y \"después\" no son objetables."
  fr: "À la question de savoir si l'on peut dire à quelqu'un « c'est toi qui m'as aidé pour telle ou telle chose après Dieu », Ibn Baz répondit qu'il n'y a pas de mal à cela, ni à dire « sans Dieu et ensuite toi », « ceci vient de Dieu et ensuite de toi », ou « tu m'as aidé après Dieu pour telle ou telle chose »; ce qui n'est pas permis, c'est l'emploi de la conjonction « et », comme dans « sans Dieu et toi », « ceci vient de Dieu et toi », ou « ce que Dieu veut et toi », car c'est ce « et » qui est inadmissible, tandis que « ensuite » et « après » ne posent aucun problème."
  tr: "Birinin 'Allah'tan sonra bana şu ve şu konuda yardım eden sensin' demesi caiz olup olmadığı hakkında bir soru. İbn Baz bunun zararı olmadığını söyledi ve aynı şekilde: Allah olmasaydı, sen, bu Allah'tandır, sonra senden ve Allah'tan sonra bana yardım ettin; ve caiz olmayan şey, \"Allah ve sen olmasaydı, bu Allah'tan ve sizdendir, Allah'ın ve sizin dileklerinizdir.\" dedi. Bu waw kabul edilemezdir, fakat o zaman ve sonra mücaizdir."
  id: "Pertanyaan tentang diperbolehkannya seseorang berkata: Engkau yang membantu saya dengan ini dan itu setelah Allah. Ibn Baz menjawab bahwa tidak ada salahnya dengan itu, dan juga berkata: Jika bukan karena Allah, maka kamu, dan ini dari Allah, maka dari kamu, dan kamu membantu saya setelah Allah dalam hal ini dan itu; dan yang tidak boleh adalah berkoordinasi dengan waw, seperti berkata: Jika bukan karena Allah dan kamu, dan ini dari Allah dan dari kamu, dan apa yang Allah kehendaki dan kamu. Waw ini adalah yang tidak diperbolehkan, tetapi kemudian dan sesudahnya diperbolehkan."
