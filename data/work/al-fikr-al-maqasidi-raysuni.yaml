summary:
  ar: "كتاب لأحمد الريسوني في قواعد التفكير المقاصدي وفوائده، أعاد موقع المؤلف نشره كتاباً إلكترونياً مجانياً ضمن سلسلة «كتاب الإصلاح» في يونيو 2015."
  en: "A book by Ahmed al-Raysuni on the rules and benefits of maqasid-based reasoning; the author's site reissued it as a free e-book in the Kitab al-Islah series in June 2015."
  ur: "احمد رئیسونی کی کتاب جو مقاصدی فکر کے قواعد اور فوائد پر ہے؛ مصنف کی ویب سائٹ نے جون 2015ء میں اسے «کتاب الاصلاح» سلسلے میں مفت برقی کتاب کے طور پر دوبارہ شائع کیا۔"
  es: "Un libro de Ahmed al-Raysuni sobre las reglas y los beneficios del razonamiento basado en los maqasid; el sitio web del autor lo reeditó como libro electrónico gratuito en la serie Kitab al-Islah en junio de 2015."
  fr: "Un livre d'Ahmed al-Raysuni sur les règles et les avantages du raisonnement basé sur les maqasid; le site de l'auteur l'a réédité en tant que livre électronique gratuit dans la série Kitab al-Islah en juin 2015."
  tr: "Ahmed Al-Raysouni'nin amaçlı düşüncenin ilkeleri ve faydaları üzerine yazdığı bir kitap, Haziran 2015'te \"Reform Kitabı\" serisinin bir parçası olarak yazarın web sitesinde ücretsiz e-kitap olarak yeniden yayımlandı."
  id: "Sebuah buku karya Ahmed Al-Raysouni tentang prinsip dan manfaat berpikir yang bertujuan, diterbitkan ulang oleh situs web penulis sebagai e-book gratis sebagai bagian dari seri \"Book of Reform\" pada Juni 2015."
