  es: "Un libro breve de Ahmed al-Raysuni sobre las reglas y los beneficios del razonamiento basado en los maqasid, publicado por primera vez por Manshurat al-Zaman en Rabat en diciembre de 1999 como n.º 9 de la serie Kitab al-Jayb."
  fr: "Un court livre d'Ahmed al-Raysuni sur les règles et les apports du raisonnement fondé sur les maqasid, publié pour la première fois par Manshurat al-Zaman à Rabat en décembre 1999, n° 9 de la collection Kitab al-Jayb."
  tr: "Ahmed er-Reysûnî'nin makasıd temelli düşünmenin kuralları ve faydaları üzerine kısa kitabı; ilk baskısı Aralık 1999'da Rabat'ta Menşûrâtü'z-Zemen tarafından Kitâbü'l-Ceyb dizisinin 9. sayısı olarak yayımlandı."
  id: "Buku ringkas karya Ahmad al-Raisuni tentang kaidah dan manfaat penalaran berbasis maqasid, pertama kali diterbitkan Manshurat al-Zaman di Rabat pada Desember 1999 sebagai nomor 9 seri Kitab al-Jayb."
