summary:
  ar: "كتيب لأحمد الريسوني في قواعد التفكير المقاصدي وفوائده، صدرت طبعته الأولى عن منشورات الزمن في الرباط في ديسمبر 1999، العدد 9 من سلسلة «كتاب الجيب»."
  en: "A short book by Ahmed al-Raysuni on the rules and benefits of maqasid-based reasoning, first published by Manshurat al-Zaman in Rabat in December 1999 as no. 9 of the Kitab al-Jayb series."
