id: work/fatwa-aliftaa-jo-running-a-turkish-bath
class: work
kind: fatwa
label: { ar: "ضوابط دخول الحمامات التركية والعمل فيها", en: "Rules for using and working in a Turkish bath", ur: "ترکی حمام میں جانے اور کام کرنے کے ضوابط" }
summary:
  ar: "سؤال من صاحب حمام تركي عن حكم عمله، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في العمل فيه مع مراعاة الضوابط الشرعية من ستر العورة وغض البصر. بدأت الدائرة بأن الإسلام عني بالنظافة والطهارة، وأن المقصود بالحمام في الأحاديث الحمام العام الذي يُقصد للتنظف والتطبب، ويشبهه اليوم ما يُستعمل من حمامات البخار في مراكز علاج السمنة. وقالت إن دخول الرجال مباح مع ستر العورة وغض البصر، وإن دخول النساء يُكره بلا عذر كالعلاج أو نظافة لا تتيسر إلا بذلك، مستشهدة بحديث في ذم خلع المرأة ثيابها في غير بيتها، وبنص من مغني المحتاج للشافعية. وإذا دعت الحاجة إلى دخول المرأة فعليها أن تتأكد أن القائمين على المكان نساء فقط، وأن تلتزم حدود العورة أمام النساء، فلا تتساهل في لباس يكشف أغلب جسدها ولا في لمس العورة بلا ضرورة، وأن تغض بصرها. وخلصت إلى أنه لا حرج على المرأة في العمل في هذه الأماكن مع مراعاة الضوابط الشرعية من غض البصر وعدم التساهل في لمس النساء إلا بقدر الحاجة."
  en: "A question from the owner of a Turkish bath about his business, in which Jordan's General Iftaa Department answered that working there is permissible provided the sharia rules on covering and lowering the gaze are kept. The Department began by noting that Islam gives weight to cleanliness and purity, and that the bath meant in the hadith reports is the public bath used for washing and treatment, which today resembles the steam baths of weight-loss clinics. It said men may enter with their nakedness covered and their gaze lowered, while it is disliked for women to enter without an excuse such as treatment or a cleanliness that cannot be had otherwise, citing a hadith that censures a woman undressing outside her home and a passage from the Shafi'i work Mughni al-Muhtaj. Where a woman needs to enter, she should make sure that only women run the place, keep the limits of covering in front of other women, avoid clothing that exposes most of her body or touching private parts without necessity, and lower her gaze. It concluded that there is no objection to women working in such places provided these rules are kept, lowering the gaze and touching other women only as far as needed."
  ur: "ایک ترکی حمام کے مالک کا اپنے کاروبار کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ستر اور نظر جھکانے کے شرعی ضوابط کی پابندی کے ساتھ اس میں کام کرنے میں حرج نہیں۔ ڈیپارٹمنٹ نے آغاز میں کہا کہ اسلام صفائی اور طہارت کو اہمیت دیتا ہے، اور احادیث میں حمام سے مراد وہ عام حمام ہے جو نہانے اور علاج کے لیے جایا جاتا ہے، جس کی آج کی مثال موٹاپے کے علاج کے مراکز کے بھاپ والے حمام ہیں۔ اس نے کہا کہ مردوں کا داخلہ ستر ڈھانپنے اور نظر جھکانے کے ساتھ جائز ہے، جبکہ خواتین کا بغیر عذر، جیسے علاج یا ایسی صفائی جو اس کے بغیر ممکن نہ ہو، داخل ہونا مکروہ ہے، اور اس پر عورت کے اپنے گھر سے باہر کپڑے اتارنے کی مذمت والی حدیث اور شافعی کتاب مغنی المحتاج کی ایک عبارت سے استدلال کیا۔ اگر عورت کو جانے کی ضرورت ہو تو وہ یقینی بنائے کہ جگہ کا انتظام صرف خواتین کے ہاتھ میں ہے، دوسری خواتین کے سامنے ستر کی حدود کی پابندی کرے، ایسا لباس نہ پہنے جو جسم کا اکثر حصہ ظاہر کرے، بلا ضرورت ستر کو نہ چھوئے، اور نظر جھکائے رکھے۔ اس نے نتیجہ نکالا کہ ان ضوابط کی پابندی کے ساتھ خواتین کے ایسی جگہوں پر کام کرنے میں کوئی حرج نہیں، نظر جھکانے اور ضرورت کی حد تک ہی دوسری خواتین کو چھونے کے ساتھ۔"
