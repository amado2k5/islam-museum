label: { ar: "ضوابط دخول الحمامات التركية والعمل فيها", en: "Rules for using and working in a Turkish bath", ur: "ترکی حمام میں جانے اور کام کرنے کے ضوابط", es: "Normas para el uso y el trabajo en un baño turco", fr: "Règles d'utilisation et de fonctionnement d'un hammam turc", tr: "Türk Hamamlarına Giriş ve Çalışma Düzenlemeleri", id: "Peraturan untuk Masuk dan Bekerja di Pemandian Turki" }
summary:
  ar: "سؤال من صاحب حمام تركي عن حكم عمله، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في العمل فيه مع مراعاة الضوابط الشرعية من ستر العورة وغض البصر. بدأت الدائرة بأن الإسلام عني بالنظافة والطهارة، وأن المقصود بالحمام في الأحاديث الحمام العام الذي يُقصد للتنظف والتطبب، ويشبهه اليوم ما يُستعمل من حمامات البخار في مراكز علاج السمنة. وقالت إن دخول الرجال مباح مع ستر العورة وغض البصر، وإن دخول النساء يُكره بلا عذر كالعلاج أو نظافة لا تتيسر إلا بذلك، مستشهدة بحديث في ذم خلع المرأة ثيابها في غير بيتها، وبنص من مغني المحتاج للشافعية. وإذا دعت الحاجة إلى دخول المرأة فعليها أن تتأكد أن القائمين على المكان نساء فقط، وأن تلتزم حدود العورة أمام النساء، فلا تتساهل في لباس يكشف أغلب جسدها ولا في لمس العورة بلا ضرورة، وأن تغض بصرها. وخلصت إلى أنه لا حرج على المرأة في العمل في هذه الأماكن مع مراعاة الضوابط الشرعية من غض البصر وعدم التساهل في لمس النساء إلا بقدر الحاجة."
  en: "A question from the owner of a Turkish bath about his business, in which Jordan's General Iftaa Department answered that working there is permissible provided the sharia rules on covering and lowering the gaze are kept. The Department began by noting that Islam gives weight to cleanliness and purity, and that the bath meant in the hadith reports is the public bath used for washing and treatment, which today resembles the steam baths of weight-loss clinics. It said men may enter with their nakedness covered and their gaze lowered, while it is disliked for women to enter without an excuse such as treatment or a cleanliness that cannot be had otherwise, citing a hadith that censures a woman undressing outside her home and a passage from the Shafi'i work Mughni al-Muhtaj. Where a woman needs to enter, she should make sure that only women run the place, keep the limits of covering in front of other women, avoid clothing that exposes most of her body or touching private parts without necessity, and lower her gaze. It concluded that there is no objection to women working in such places provided these rules are kept, lowering the gaze and touching other women only as far as needed."
  ur: "ایک ترکی حمام کے مالک کا اپنے کاروبار کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ستر اور نظر جھکانے کے شرعی ضوابط کی پابندی کے ساتھ اس میں کام کرنے میں حرج نہیں۔ ڈیپارٹمنٹ نے آغاز میں کہا کہ اسلام صفائی اور طہارت کو اہمیت دیتا ہے، اور احادیث میں حمام سے مراد وہ عام حمام ہے جو نہانے اور علاج کے لیے جایا جاتا ہے، جس کی آج کی مثال موٹاپے کے علاج کے مراکز کے بھاپ والے حمام ہیں۔ اس نے کہا کہ مردوں کا داخلہ ستر ڈھانپنے اور نظر جھکانے کے ساتھ جائز ہے، جبکہ خواتین کا بغیر عذر، جیسے علاج یا ایسی صفائی جو اس کے بغیر ممکن نہ ہو، داخل ہونا مکروہ ہے، اور اس پر عورت کے اپنے گھر سے باہر کپڑے اتارنے کی مذمت والی حدیث اور شافعی کتاب مغنی المحتاج کی ایک عبارت سے استدلال کیا۔ اگر عورت کو جانے کی ضرورت ہو تو وہ یقینی بنائے کہ جگہ کا انتظام صرف خواتین کے ہاتھ میں ہے، دوسری خواتین کے سامنے ستر کی حدود کی پابندی کرے، ایسا لباس نہ پہنے جو جسم کا اکثر حصہ ظاہر کرے، بلا ضرورت ستر کو نہ چھوئے، اور نظر جھکائے رکھے۔ اس نے نتیجہ نکالا کہ ان ضوابط کی پابندی کے ساتھ خواتین کے ایسی جگہوں پر کام کرنے میں کوئی حرج نہیں، نظر جھکانے اور ضرورت کی حد تک ہی دوسری خواتین کو چھونے کے ساتھ۔"
  es: "Una pregunta del propietario de un baño turco sobre su negocio, a la que el Departamento General de Iftaa de Jordania respondió que trabajar allí es permisible siempre que se respeten las normas de la sharia sobre cubrirse y bajar la mirada. El Departamento comenzó señalando que el Islam otorga importancia a la limpieza y la pureza, y que el baño al que se refieren los hadices es el baño público utilizado para el lavado y el tratamiento, que hoy se asemeja a los baños de vapor de las clínicas de adelgazamiento. Añadió que los hombres pueden entrar con el cuerpo cubierto y la mirada baja, mientras que no es recomendable que las mujeres entren sin una justificación como un tratamiento o una limpieza que no se pueda lograr de otra manera, citando un hadiz que censura a una mujer que se desnuda fuera de su casa y un pasaje de la obra shafi'í Mughni al-Muhtaj. Cuando una mujer necesite entrar, debe asegurarse de que solo mujeres administren el lugar, mantener los límites de la vestimenta frente a otras mujeres, evitar la ropa que exponga demasiado su cuerpo o tocar partes íntimas innecesariamente, y bajar la mirada. Se concluyó que no hay objeción a que las mujeres trabajen en esos lugares siempre que se respeten estas normas, bajando la mirada y tocando a otras mujeres solo en la medida necesaria."
  fr: "Le propriétaire d'un hammam a posé une question concernant son établissement. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que l'exploitation d'un hammam est autorisée à condition de respecter les règles de la charia relatives à la pudeur et au regard baissé. Le Département a d'abord souligné l'importance accordée à la propreté et à la pureté en islam, et a précisé que le hammam mentionné dans les hadiths est le bain public utilisé pour les ablutions et les soins, qui ressemble aujourd'hui aux bains de vapeur des centres d'amincissement. Il a indiqué que les hommes peuvent y entrer, à condition d'être couverts et de baisser le regard. En revanche, il est déconseillé aux femmes d'y entrer sans motif valable, tel qu'un soin médical ou un besoin de propreté qu'elles ne peuvent satisfaire autrement. Le Département a cité un hadith condamnant le fait qu'une femme se déshabille hors de son domicile et un passage de l'ouvrage chaféite Mughni al-Muhtaj. Si une femme doit entrer dans un hammam, elle doit s'assurer que l'établissement est géré exclusivement par des femmes, respecter les limites de la pudeur en présence d'autres femmes, éviter les vêtements trop décolletés ou tout contact avec les parties intimes sans nécessité, et baisser le regard. Elle a conclu qu'il n'y avait pas d'objection à ce que des femmes travaillent dans de tels endroits à condition que ces règles soient respectées, en baissant le regard et en ne touchant les autres femmes que dans la mesure nécessaire."
  tr: "Türk hamamı sahibinin yaptığı çalışmaya ilişkin kararla ilgili bir soruya yanıt verdi; Ürdün Genel Fetva Dairesi, özel bölgeleri kapatmak ve bakışı aşağı indirmek gibi dini kurallara uyarak burada çalışmanın zararı olmadığını söyledi. Daire, İslam'ın temizlik ve saflıkla ilgilendiğini ve hadislerdeki 'banyo' teriminin, bugün obezite tedavi merkezlerinde kullanılan buharlı banyolara benzeyen temizlik ve tedavi amaçlı kamu hamamını ifade ettiğini belirtti. Erkeklerin özel bölgeleri kapatarak ve bakışları aşağı indirerek girmesinin izin verildiğini, kadınların ise mazeretsiz girmesinin sevilmediğini, örneğin sadece bunun için mümkün olan muamele veya temizlik gibi şeyleri içerdiğini belirtti; bir hadise bir hadis ve Şafii okuluna göre Mughni al-Muhtac'tan bir metni gösterdi. Bir kadının içeri girmesi gerekiyorsa, yerin sorumlusunun sadece kadınlardan oluşmasını sağlamalı ve kadınların önünde 'awrah' sınırlarına uymalıdır. Vücudunun çoğunu açığa çıkaran veya özel bölgelerine gereksiz yere dokunan kıyafetlerde hoşgörülü olmamalı ve bakışlarını aşağı indirmelidir. Kadının bu yerlerde çalışmasının bir zararı olmadığını, bakışları indirme ve gerektiğinde kadınlara dokunmada hoşgörülü olmamak gibi dini kurallara uymasının bir zararı olmadığını sonucuna vardı."
  id: "Sebuah pertanyaan dari pemilik pemandian Turki mengenai keputusan atas pekerjaannya, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa tidak ada salahnya bekerja di dalamnya sambil mematuhi pedoman agama seperti menutupi bagian pribadi dan menundukkan pandangan. Departemen memulai dengan menyatakan bahwa Islam berkaitan dengan kebersihan dan kemurnian, dan bahwa istilah 'mandi' dalam hadits merujuk pada pemandian umum yang dimaksudkan untuk pembersihan dan perawatan, yang saat ini mirip dengan pemandian uap yang digunakan di pusat perawatan obesitas. Departemen menyatakan bahwa diperbolehkan bagi pria untuk masuk sambil menutupi bagian pribadi dan menundukkan pandangan, dan bahwa wanita yang masuk tanpa alasan tidak disukai, seperti perlakuan atau kebersihan yang hanya mungkin dilakukan untuk itu, mengutip hadits yang mengutuk wanita melepas pakaiannya di luar rumah dan teks dari Mughni al-Muhtaj menurut mazhab Shafi'i. Jika seorang wanita perlu masuk, dia harus memastikan bahwa orang yang bertanggung jawab hanya perempuan, dan dia harus mematuhi batas 'awrah di depan wanita. Dia tidak boleh bersikap lunak dalam pakaian yang memperlihatkan sebagian besar tubuhnya atau menyentuh bagian pribadinya tanpa perlu, dan dia harus menundukkan pandangan. Dia menyimpulkan bahwa tidak ada salahnya bagi seorang wanita untuk bekerja di tempat-tempat ini, sambil mematuhi pedoman agama seperti menundukkan pandangan dan tidak bersikap lunak dalam menyentuh wanita kecuali jika diperlukan."
