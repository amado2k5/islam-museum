summary:
  ar: "كتاب التعريفات للشريف الجرجاني، جمعه مؤلفه، كما يذكر، من أهم ما كُتب قبله في العلوم الإسلامية تيسيراً على الطلبة، ورتّبه هجائياً. يضم أهم المصطلحات في التفسير والحديث والفقه والكلام والتصوف واللغة العربية وآدابها والفلسفة والمنطق والرياضيات والفلك والطب، ويذكر معنى اللفظ في اللغة ثم تعريفه في العلوم المختلفة. تعريفاته موجزة وبعضها في التصوف والفلسفة غامض، ومن مصادره سيبويه والكسائي والفراء وأبو حنيفة وأبو يوسف والشافعي وابن عربي وأبو طالب المكي والقشيري."
  en: "al-Sharif al-Jurjani's Kitab al-Ta'rifat, which its author says he compiled from the main earlier works in the Islamic sciences to ease the way for students, arranged alphabetically. It holds the main terms of tafsir, hadith, fiqh, kalam, Sufism, Arabic language and literature, philosophy, logic, mathematics, astronomy and medicine, giving a term's meaning in the dictionary and then its definitions in the different sciences. The definitions are terse and some, in Sufism and philosophy, remain obscure; the authorities drawn on include Sibawayh, al-Kisa'i, al-Farra', Abu Hanifa, Abu Yusuf, al-Shafi'i, Ibn al-Arabi, Abu Talib al-Makki and al-Qushayri."
  es: "El Kitab al-Ta'rifat de al-Sharif al-Jurjani, que su autor dice haber compilado a partir de las principales obras anteriores en las ciencias islámicas para facilitar el camino a los estudiantes, ordenado alfabéticamente. Contiene los principales términos de tafsir, hadiz, fiqh, kalam, sufismo, lengua y literatura árabes, filosofía, lógica, matemáticas, astronomía y medicina, dando el sentido del término en el diccionario y luego sus definiciones en las distintas ciencias. Las definiciones son concisas y algunas, en sufismo y filosofía, quedan oscuras; entre las autoridades utilizadas están Sibawayh, al-Kisa'i, al-Farra', Abu Hanifa, Abu Yusuf, al-Shafi'i, Ibn al-Arabi, Abu Talib al-Makki y al-Qushayri."
  fr: "Le Kitab al-Ta'rifat d'al-Sharif al-Jurjani, que son auteur dit avoir compilé à partir des principaux ouvrages antérieurs des sciences islamiques pour faciliter la tâche des étudiants, classé alphabétiquement. Il contient les principaux termes du tafsir, du hadith, du fiqh, du kalam, du soufisme, de la langue et de la littérature arabes, de la philosophie, de la logique, des mathématiques, de l'astronomie et de la médecine, donnant le sens du terme dans le dictionnaire puis ses définitions dans les différentes sciences. Les définitions sont concises et certaines, en soufisme et en philosophie, restent obscures ; parmi les autorités utilisées figurent Sibawayh, al-Kisa'i, al-Farra', Abu Hanifa, Abu Yusuf, al-Shafi'i, Ibn al-Arabi, Abu Talib al-Makki et al-Qushayri."
  ur: "شریف جرجانی کی کتاب التعریفات، جسے مصنف کے بقول انہوں نے طلبہ کی آسانی کے لیے اسلامی علوم میں اپنے سے پہلے کی اہم کتابوں سے مرتب کیا اور حروفِ تہجی پر ترتیب دیا۔ اس میں تفسیر، حدیث، فقہ، کلام، تصوف، عربی زبان و ادب، فلسفہ، منطق، ریاضی، فلکیات اور طب کی اہم اصطلاحات ہیں، لفظ کا لغوی معنی اور پھر مختلف علوم میں اس کی تعریفیں۔ تعریفیں مختصر ہیں اور تصوف و فلسفہ کی کچھ مبہم رہ گئی ہیں؛ مآخذ میں سیبویہ، کسائی، فراء، ابو حنیفہ، ابو یوسف، شافعی، ابن عربی، ابو طالب مکی اور قشیری شامل ہیں۔"
  tr: "Yazarı tarafından derlenen 'Al-Ta'rifat' adlı kitap, yazarı tarafından derlenen ve kendisinden önce İslam bilimlerinde yazılmış en önemli eserlerden biridir; öğrencileri kolaylaştırmak için alfabetik sırada düzenlenmiştir. Tefsir, hadis, fıhhi, teoloji, tasavvuf, Arap dili ve edebiyatı, felsefe, mantık, matematik, astronomi ve tıptaki en önemli terimleri içerir; ayrıca terimin dildeki anlamını ve çeşitli bilimlerdeki tanımlarını belirtir. Tanımları özüdür ve bazıları tasavvuf ve felsefede belirsizdir. Kaynakları arasında Sibawayh, Al-Kisai, Al-Farra', Abu Hanifa, Abu Yusuf, Al-Shafi'i, İbn Arabi, Abu Talib Al-Makki ve Al-Qushayri bulunmaktadır."
  id: "Buku 'Al-Ta'rifat' karya Al-Sharif Al-Jurjani, yang disusun oleh penulisnya, seperti disebutkan, adalah salah satu karya terpenting yang ditulis sebelum beliau dalam ilmu Islam untuk memudahkan para siswa, yang diatur secara alfabetis. Buku ini memuat istilah-istilah terpenting dalam tafsir, hadis, fisur, teologi, tasawuf, bahasa Arab dan sastranya, filsafat, logika, matematika, astronomi, dan kedokteran, serta juga menyebutkan makna istilah dalam bahasa dan kemudian definisinya dalam berbagai ilmu. Definisinya ringkas, dan beberapa dalam Sufisme dan filsafat ambigu. Di antara sumbernya adalah Sibawayh, Al-Kisai, Al-Farra', Abu Hanifa, Abu Yusuf, Al-Shafi'i, Ibn Arabi, Abu Talib Al-Makki, dan Al-Qushayri."
