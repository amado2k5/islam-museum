label:
  ar: "الصاحبي في فقه اللغة العربية ومسائلها وسنن العرب في كلامها"
  en: "al-Sahibi fi Fiqh al-Lugha (Ibn Faris)"
  ur: "الصاحبی فی فقہ اللغۃ ابن فارس"
  fr: "al-Sahibi fi Fiqh al-Lugha (Ibn Faris)"
  es: "al-Sahibi fi Fiqh al-Lugha (Ibn Faris)"
summary:
  ar: "كتاب الصاحبي لأحمد بن فارس في فقه اللغة العربية ومسائلها وسنن العرب في كلامها؛ يقرر في أوله أن لغة العرب توقيف {cite:sahibi-baydun-1997 p.13}، ثم يفضّل العربية في البيان والسعة {cite:sahibi-baydun-1997 p.19}، ويبحث لغة القرآن وهل فيه من غير كلام العرب {cite:sahibi-baydun-1997 p.32-33}، ويذكر أن ما وصل من كلام العرب أقله {cite:sahibi-baydun-1997 p.36}. يذكر محققه أنه سُمّي بالصاحبي لأن مؤلفه قدمه إلى الصاحب بن عباد {cite:sahibi-baydun-1997 p.8}."
  en: "al-Sahibi by Ahmad ibn Faris, on the jurisprudence of the Arabic language, its questions and the customs of the Arabs in speech; it opens by holding that the language of the Arabs is tawqif, taught {cite:sahibi-baydun-1997 p.13}, then argues the superiority of Arabic in clear expression and range {cite:sahibi-baydun-1997 p.19}, takes up the language of the Qur'an and whether it holds anything outside Arab speech {cite:sahibi-baydun-1997 p.32-33}, and says that what has reached us of Arab speech is the lesser part {cite:sahibi-baydun-1997 p.36}. Its editor says it was named al-Sahibi because the author presented it to al-Sahib ibn Abbad {cite:sahibi-baydun-1997 p.8}."
  ur: "احمد بن فارس کی الصاحبی عربی زبان کی فقہ، اس کے مسائل اور عربوں کے کلام کے طریقوں پر ہے؛ ابتدا میں وہ کہتے ہیں کہ عربوں کی زبان توقیف ہے {cite:sahibi-baydun-1997 p.13}، پھر عربی کو بیان اور وسعت میں فضیلت دیتے ہیں {cite:sahibi-baydun-1997 p.19}، قرآن کی زبان اور اس میں غیرِ عرب کلام کی موجودگی پر بحث کرتے ہیں {cite:sahibi-baydun-1997 p.32-33}، اور کہتے ہیں کہ عربوں کے کلام کا جو حصہ ہم تک پہنچا وہ کم ہے {cite:sahibi-baydun-1997 p.36}۔ محقق بتاتے ہیں کہ اس کا نام الصاحبی اس لیے پڑا کہ مصنف نے اسے صاحب بن عباد کو پیش کیا {cite:sahibi-baydun-1997 p.8}۔"
  fr: "al-Sahibi d'Ahmad ibn Faris, sur la jurisprudence de la langue arabe, ses questions et les usages des Arabes dans leur parler ; il s'ouvre en tenant que la langue des Arabes est tawqif, enseignée {cite:sahibi-baydun-1997 p.13}, puis plaide la supériorité de l'arabe en clarté et en étendue {cite:sahibi-baydun-1997 p.19}, aborde la langue du Coran et la question de savoir s'il contient quoi que ce soit hors du parler arabe {cite:sahibi-baydun-1997 p.32-33}, et dit que ce qui nous est parvenu du parler arabe en est la moindre part {cite:sahibi-baydun-1997 p.36}. Son éditeur dit qu'il fut nommé al-Sahibi parce que l'auteur le présenta à al-Sahib ibn Abbad {cite:sahibi-baydun-1997 p.8}."
  es: "al-Sahibi de Ahmad ibn Faris, sobre la jurisprudencia de la lengua árabe, sus cuestiones y los usos de los árabes al hablar; se abre sosteniendo que la lengua de los árabes es tawqif, enseñada {cite:sahibi-baydun-1997 p.13}, luego defiende la superioridad del árabe en claridad y amplitud {cite:sahibi-baydun-1997 p.19}, trata la lengua del Corán y si contiene algo ajeno al habla árabe {cite:sahibi-baydun-1997 p.32-33}, y dice que lo que nos ha llegado del habla árabe es la parte menor {cite:sahibi-baydun-1997 p.36}. Su editor dice que se llamó al-Sahibi porque el autor lo presentó a al-Sahib ibn Abbad {cite:sahibi-baydun-1997 p.8}."
