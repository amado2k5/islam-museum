id: work/fatwa-aliftaa-jo-using-the-phone-during-paid-overtime
class: work
kind: fatwa
label: { ar: "الانشغال بالهاتف أثناء العمل الإضافي", en: "Using the phone during paid overtime", ur: "اوور ٹائم کے دوران فون میں مشغول ہونا", es: "Usar el teléfono durante las horas extras remuneradas", fr: "Utilisation du téléphone pendant les heures supplémentaires rémunérées", tr: "Fazla mesai sırasında telefonla meşgul olmak", id: "Sibuk dengan telepon saat lembur" }
summary:
  ar: "سؤال عن الانشغال بالهاتف أثناء العمل الإضافي، أجابت فيه دائرة الإفتاء العام الأردنية بأن على الموظف الالتزام بأنظمة العمل الإضافي والصدق والحضور، وله شغل وقت الفراغ بما ينفع إذا أنجز مسؤولياته، فإن أخر العمل لانشغاله بأموره فلا يحل له أجر الوقت الضائع ويعيد قدره. أجابت الدائرة بأن على الموظف التزام التعليمات والأنظمة المتعلقة بساعات العمل الإضافية، والتزام الصدق واجتناب التحايل والكذب، واستشهدت بـ[[passage/quran-9-119|سورة التوبة 9:119]]، وأن على من كلف بالعمل الإضافي الحضور في مكان العمل ولو لم تكن لديه مهام. وقالت إنه في هذه الحال يجتهد في قضاء الوقت لصالح مؤسسته، فإن لم يكن له عمل فلا بأس أن يشغل وقته بما ينفع كقراءة القرآن والكتب أو سماع الدروس العلمية، بشرط أن يكون قد أنجز كل ما هو مسؤول عنه. وقالت إنه إن كان عنده عمل وجب عليه إتمامه، وله الرد على المكالمات ونحوها من الشواغل الشخصية بحسب العرف المقبول دون أن يتأخر العمل، فإن أخر العمل بسبب أموره الشخصية فلا يحل له أجر الوقت الذي ضيعه، وعليه أن يعيد قدره للمؤسسة بأي وسيلة ممكنة."
  en: "A question about using the phone during paid overtime, in which Jordan's General Iftaa Department answered that an employee must follow the overtime rules, be truthful and be present; he may fill idle time with something beneficial once his duties are done, but if he delays work for personal matters, the pay for the wasted time is not lawful for him and he must return its value. The Department answered that an employee must follow the instructions and regulations on overtime hours, be truthful and avoid deception and lying, citing [[passage/quran-9-119|Surat al-Tawba 9:119]], and that whoever is assigned overtime must be present at the workplace even if he has no tasks. It said that in that case he should do his best to use the time for his institution's benefit; if he has no work, there is no harm in spending the time on something useful such as reading the Qur'an or books or listening to lessons, provided he has completed everything he is responsible for. It said that if he has work, he must spend the time completing it, and may answer calls or attend to other personal matters within accepted custom so long as the work is not delayed; if the work is postponed because of his personal matters, the pay for the time he wasted is not lawful for him, and he must return its equivalent to the institution by any possible means."
  ur: "اوور ٹائم کے دوران فون میں مشغول ہونا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ملازم پر اوور ٹائم کے قواعد، سچائی اور حاضری کی پابندی لازم ہے؛ ذمہ داریاں پوری کرنے کے بعد خالی وقت مفید کام میں گزار سکتا ہے، لیکن اگر ذاتی کاموں سے کام میں تاخیر کرے تو ضائع وقت کی اجرت اس کے لیے حلال نہیں اور وہ اس کی مقدار واپس کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم پر اوور ٹائم کے اوقات سے متعلق ہدایات اور ضوابط کی پابندی، سچائی اور حیلے و جھوٹ سے اجتناب لازم ہے، اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا؛ اور جسے اوور ٹائم سونپا گیا ہو وہ کام کی جگہ پر موجود رہے، چاہے اس کے پاس کوئی کام نہ ہو۔ اس نے کہا کہ اس صورت میں وہ ممکنہ حد تک وقت اپنے ادارے کے فائدے میں گزارنے کی کوشش کرے؛ اگر کوئی کام نہ ہو تو مفید چیزوں، جیسے قرآن یا کتابیں پڑھنے یا علمی دروس سننے، میں وقت گزارنے میں حرج نہیں، بشرطیکہ وہ اپنی تمام ذمہ داریاں پوری کر چکا ہو۔ اس نے کہا کہ اگر اس کے پاس کام ہو تو اسے مکمل کرنا واجب ہے، اور وہ قابلِ قبول عرف کے مطابق کالوں کا جواب یا دیگر ذاتی کام کر سکتا ہے بشرطیکہ کام میں تاخیر نہ ہو؛ اگر ذاتی کاموں کی وجہ سے کام مؤخر ہو جائے تو ضائع کیے گئے وقت کی اجرت اس کے لیے حلال نہیں، اور اسے ہر ممکن طریقے سے اس کی مقدار ادارے کو لوٹانی ہوگی۔"
  es: "Una pregunta sobre el uso del teléfono durante las horas extras remuneradas, en la que el Departamento General de Iftaa de Jordania respondió que un empleado debe seguir las normas sobre horas extras, ser veraz y estar presente; puede ocupar el tiempo ocioso con algo provechoso una vez que haya terminado sus deberes, pero si retrasa el trabajo por asuntos personales, no le corresponde el pago por el tiempo perdido y debe devolver su valor. El Departamento respondió que un empleado debe seguir las instrucciones y regulaciones sobre las horas extras, ser veraz y evitar el engaño y la mentira, citando [[passage/quran-9-119|Surat al-Tawba 9:119]], y que quien sea asignado a horas extras debe estar presente en el lugar de trabajo incluso si no tiene tareas. Dijo que en ese caso debe hacer todo lo posible para usar el tiempo en beneficio de su institución; si no tiene trabajo, no hay problema en emplear el tiempo en algo útil como leer el Corán o libros o escuchar lecciones, siempre que haya completado todo lo que es responsable. Se estipulaba que, si tenía trabajo, debía dedicar el tiempo necesario para completarlo, y podía contestar llamadas o atender otros asuntos personales dentro de la costumbre aceptada, siempre y cuando el trabajo no se retrasara; si el trabajo se posponía debido a asuntos personales, no le correspondía el pago por el tiempo perdido, y debía devolver su equivalente a la institución por cualquier medio posible."
  fr: "Concernant l'utilisation du téléphone pendant les heures supplémentaires rémunérées, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu qu'un employé doit respecter la réglementation relative aux heures supplémentaires, être honnête et présent. Il peut occuper son temps libre par une activité utile une fois ses tâches accomplies, mais s'il retarde son travail pour des raisons personnelles, la rémunération du temps perdu n'est pas licite et il doit en rembourser la valeur. Le Département a précisé qu'un employé doit respecter les instructions et réglementations relatives aux heures supplémentaires, être honnête et éviter toute tromperie ou mensonge, citant le verset 9:119 de la sourate At-Tawba (9:119). Il a également indiqué que toute personne effectuant des heures supplémentaires doit être présente sur son lieu de travail, même sans tâche à accomplir. Dans ce cas, il est recommandé à l'employé de faire de son mieux pour utiliser ce temps au profit de son institution. S'il n'a pas de travail, il peut consacrer ce temps à une activité utile comme la lecture du Coran ou d'autres ouvrages, ou l'écoute de cours, à condition d'avoir terminé toutes ses obligations. Il est stipulé que s'il a du travail, il doit consacrer le temps nécessaire à son achèvement et peut répondre à des appels ou s'occuper d'autres affaires personnelles dans le respect des usages, pourvu que le travail ne soit pas retardé; si le travail est reporté en raison de ses affaires personnelles, la rémunération du temps perdu ne lui est pas due et il doit en restituer l'équivalent à l'institution par tous les moyens possibles."
  tr: "Fazla mesai sırasında telefonla meşgul olmakla ilgili bir soru, Ürdün Genel Fetva Dairesi, çalışanın fazla mesai düzenlemelerine, dürüstlüğe ve devamlılığa uyması ve boş zamanlarını sorumluluklarını yerine getirirse kendisine fayda sağlayacak şekilde değerlendirmesi gerektiğini yanıtladı. Kendi işleriyle meşgul oldukları için işi geciktirirlerse, kaybedilen zaman için tazminat almaya hakları yoktur ve geri ödeyeceklerdir. Daire, çalışanın fazla mesai ile ilgili talimat ve düzenlemelere uyması, dürüst olması ve aldatma ile yalan söylememesi gerektiğini yanıtladı. [[pasaj/kuran-9-119|Tevbe Suresi 9:119]]]'a atıfta bulundu ve fazla mesai yapanların görevleri olmasa bile işyerinde bulunmaları gerektiğini belirtti. Bu durumda, kurumun yararına zaman ayırmaya çalışmak gerektiği; eğer işsizlerse, sorumlu oldukları tüm görevleri tamamladıkları sürece Kur'an ve kitap okumak ya da bilimsel dersler dinlemek gibi faydalı şeylerle vakit geçirmeleri caiz olduğu belirtildi. Eğer tamamlaması gereken bir işi varsa ve kabul edilen geleneklere göre çağrılara ve benzeri kişisel endişelere yanıt verebilirse, kişisel nedenlerle işi geciktirirse, boşa harcadığı zaman için tazminat almaya hakkı olmadığını ve değerini kuruma her şekilde geri vermesi gerektiğini söyledi."
  id: "Pertanyaan tentang sibuk dengan telepon saat lembur, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa karyawan harus mematuhi peraturan lembur, kejujuran, dan kehadiran, serta mengisi waktu luang dengan cara yang menguntungkan mereka jika menjalankan tanggung jawabnya. Jika mereka menunda kerja karena sibuk dengan urusan sendiri, mereka tidak berhak atas kompensasi atas waktu yang hilang dan akan membayarnya. Departemen menjawab bahwa karyawan harus mematuhi instruksi dan peraturan terkait jam lembur, jujur, dan menghindari penipuan serta kebohongan. Departemen tersebut mengutip [[ayat/al-quran-9-119|Surah At-Tawbah 9:119]], dan bahwa mereka yang ditugaskan lembur harus hadir di tempat kerja meskipun tidak memiliki tugas. Departemen tersebut menyatakan bahwa dalam kasus ini, seseorang harus berusaha menghabiskan waktu demi kepentingan institusinya; jika tidak memiliki pekerjaan, diperbolehkan mengisi waktu dengan hal-hal berguna seperti membaca Al-Qur'an dan buku atau mendengarkan pelajaran ilmiah, asalkan mereka telah menyelesaikan semua tugas yang menjadi tanggung jawabnya. Dia mengatakan bahwa jika dia memiliki pekerjaan yang harus diselesaikan dan dapat menjawab panggilan serta kekhawatiran pribadi serupa sesuai kebiasaan yang diterima tanpa menunda pekerjaan, jika dia menunda pekerjaan karena urusan pribadi, dia tidak berhak atas kompensasi atas waktu yang telah terbuang, dan dia harus mengembalikan nilainya kepada institusi dengan cara apa pun."
