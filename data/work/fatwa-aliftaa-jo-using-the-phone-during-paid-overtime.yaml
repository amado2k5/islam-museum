id: work/fatwa-aliftaa-jo-using-the-phone-during-paid-overtime
class: work
kind: fatwa
label: { ar: "الانشغال بالهاتف أثناء العمل الإضافي", en: "Using the phone during paid overtime", ur: "اوور ٹائم کے دوران فون میں مشغول ہونا" }
summary:
  ar: "سؤال عن الانشغال بالهاتف أثناء العمل الإضافي، أجابت فيه دائرة الإفتاء العام الأردنية بأن على الموظف الالتزام بأنظمة العمل الإضافي والصدق والحضور، وله شغل وقت الفراغ بما ينفع إذا أنجز مسؤولياته، فإن أخر العمل لانشغاله بأموره فلا يحل له أجر الوقت الضائع ويعيد قدره. أجابت الدائرة بأن على الموظف التزام التعليمات والأنظمة المتعلقة بساعات العمل الإضافية، والتزام الصدق واجتناب التحايل والكذب، واستشهدت بـ[[passage/quran-9-119|سورة التوبة 9:119]]، وأن على من كلف بالعمل الإضافي الحضور في مكان العمل ولو لم تكن لديه مهام. وقالت إنه في هذه الحال يجتهد في قضاء الوقت لصالح مؤسسته، فإن لم يكن له عمل فلا بأس أن يشغل وقته بما ينفع كقراءة القرآن والكتب أو سماع الدروس العلمية، بشرط أن يكون قد أنجز كل ما هو مسؤول عنه. وقالت إنه إن كان عنده عمل وجب عليه إتمامه، وله الرد على المكالمات ونحوها من الشواغل الشخصية بحسب العرف المقبول دون أن يتأخر العمل، فإن أخر العمل بسبب أموره الشخصية فلا يحل له أجر الوقت الذي ضيعه، وعليه أن يعيد قدره للمؤسسة بأي وسيلة ممكنة."
  en: "A question about using the phone during paid overtime, in which Jordan's General Iftaa Department answered that an employee must follow the overtime rules, be truthful and be present; he may fill idle time with something beneficial once his duties are done, but if he delays work for personal matters, the pay for the wasted time is not lawful for him and he must return its value. The Department answered that an employee must follow the instructions and regulations on overtime hours, be truthful and avoid deception and lying, citing [[passage/quran-9-119|Surat al-Tawba 9:119]], and that whoever is assigned overtime must be present at the workplace even if he has no tasks. It said that in that case he should do his best to use the time for his institution's benefit; if he has no work, there is no harm in spending the time on something useful such as reading the Qur'an or books or listening to lessons, provided he has completed everything he is responsible for. It said that if he has work, he must spend the time completing it, and may answer calls or attend to other personal matters within accepted custom so long as the work is not delayed; if the work is postponed because of his personal matters, the pay for the time he wasted is not lawful for him, and he must return its equivalent to the institution by any possible means."
  ur: "اوور ٹائم کے دوران فون میں مشغول ہونا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ملازم پر اوور ٹائم کے قواعد، سچائی اور حاضری کی پابندی لازم ہے؛ ذمہ داریاں پوری کرنے کے بعد خالی وقت مفید کام میں گزار سکتا ہے، لیکن اگر ذاتی کاموں سے کام میں تاخیر کرے تو ضائع وقت کی اجرت اس کے لیے حلال نہیں اور وہ اس کی مقدار واپس کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم پر اوور ٹائم کے اوقات سے متعلق ہدایات اور ضوابط کی پابندی، سچائی اور حیلے و جھوٹ سے اجتناب لازم ہے، اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا؛ اور جسے اوور ٹائم سونپا گیا ہو وہ کام کی جگہ پر موجود رہے، چاہے اس کے پاس کوئی کام نہ ہو۔ اس نے کہا کہ اس صورت میں وہ ممکنہ حد تک وقت اپنے ادارے کے فائدے میں گزارنے کی کوشش کرے؛ اگر کوئی کام نہ ہو تو مفید چیزوں، جیسے قرآن یا کتابیں پڑھنے یا علمی دروس سننے، میں وقت گزارنے میں حرج نہیں، بشرطیکہ وہ اپنی تمام ذمہ داریاں پوری کر چکا ہو۔ اس نے کہا کہ اگر اس کے پاس کام ہو تو اسے مکمل کرنا واجب ہے، اور وہ قابلِ قبول عرف کے مطابق کالوں کا جواب یا دیگر ذاتی کام کر سکتا ہے بشرطیکہ کام میں تاخیر نہ ہو؛ اگر ذاتی کاموں کی وجہ سے کام مؤخر ہو جائے تو ضائع کیے گئے وقت کی اجرت اس کے لیے حلال نہیں، اور اسے ہر ممکن طریقے سے اس کی مقدار ادارے کو لوٹانی ہوگی۔"
