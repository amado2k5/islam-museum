id: work/fatwa-amja-ecg-exposing-chest
class: work
kind: fatwa
label: { ar: "تخطيط القلب وكشف الصدر", en: "A heart tracing that exposes the chest", ur: "ای سی جی اور سینہ کھلنا", es: "Un registro cardíaco que deja al descubierto el pecho.", fr: "Un tracé cardiaque qui expose la poitrine", tr: "EKG ve göğüs muayenesi", id: "EKG dan pemeriksaan dada" }
summary:
  ar: "سألت امرأة طلبت منها الطبيبة إجراء تخطيط للقلب يكشف الصدر وهي ترى نفسها سليمة عن حكم إجرائه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81629 بتاريخ 7 يونيو 2010)⁩ أن كشف العورات للتداوي يترخص فيه عند الحاجة الماسة وإلا فالأصل أن تتولى علاج المسلمة طبيبة مسلمة فإن لم تتيسر فطبيبة غير مسلمة فإن لم تتيسر فطبيب مسلم فإن لم يتيسر فطبيب غير مسلم، فإن كانت تستشعر أن لا حاجة لها إلى هذا وغلب على ظنها ذلك فلعل إلغاء الموعد أرضى لله وأقرب إلى قواعد الشريعة."
  en: "A woman whose doctor ordered an ECG — which exposes the chest — though she felt well asked whether to proceed. Dr. Salah al-Sawi (fatwa no. 81629, 7 June 2010) answered that exposing the awra for treatment is relaxed only under pressing need; otherwise a Muslim woman is treated by a Muslim female doctor, failing that a non-Muslim female, failing that a Muslim male doctor, failing that a non-Muslim male — so if she senses no need for it and her judgment outweighs it, cancelling the appointment is likely more pleasing to God and nearer to the sharia's rules."
  ur: "ایک خاتون نے پوچھا کہ ای سی جی میں سینہ کھلتا ہے اور وہ خود کو صحت مند سمجھتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81629، 7 جون 2010)⁩ کے مطابق علاج کے لیے ستر کھولنا صرف سخت ضرورت میں جائز ہے اور خاتون ڈاکٹر کی ترتیب رعایت ہو؛ ضرورت غالب نہ ہو تو ملتوی کرنا بہتر۔"
  es: "Una mujer a la que su médico le ordenó un electrocardiograma (ECG), que deja al descubierto el tórax, aunque se sentía bien, preguntó si debía proceder con el tratamiento. El Dr. Salah al-Sawi (fatwa n.º 81629, 7 de junio de 2010) respondió que la exposición del awra para recibir tratamiento solo se permite en casos de extrema necesidad; de lo contrario, una mujer musulmana es atendida por una médica musulmana, en su defecto por una médica no musulmana, en su defecto por un médico musulmán, en su defecto por un médico no musulmán. Por lo tanto, si ella no siente la necesidad de realizarse el tratamiento y su juicio prevalece, cancelar la cita probablemente sea más grato a Dios y esté más en consonancia con las normas de la sharia."
  fr: "Une femme, à qui son médecin avait prescrit un électrocardiogramme (ECG) – examen qui expose la poitrine –, bien qu'elle se sente bien, a demandé s'il convenait de procéder à l'examen. Le Dr Salah al-Sawi (fatwa n° 81629, 7 juin 2010) a répondu que l'exposition de la poitrine pour un traitement n'est autorisée qu'en cas d'urgence absolue; autrement, une femme musulmane est soignée par une médecin musulmane, à défaut par une femme non musulmane, à défaut par un médecin musulman, à défaut par un médecin non musulman. Par conséquent, si elle n'en ressent pas le besoin et que son jugement l'emporte, annuler le rendez-vous est probablement plus agréable à Dieu et plus conforme aux préceptes de la charia."
  tr: "Bir kadın, göğsü açığa çıkarmak için bir doktordan EKG yapmasını istedi ve bu karardan habersiz olduğunu düşünüyor. Dr. Salah Al-Sawy (7 Haziran 2010 tarihli 81629 sayılı fetva) acil durumlarda tedavi için özel bölgelerin çıkarılmasının izin verildiğini, aksi takdirde varsayılan olarak Müslüman bir doktorun Müslüman bir kadını tedavi etmesi gerektiğini söyledi. Bu mümkün değilse, gayrimüslim bir doktor; mümkün değilse Müslüman bir doktor; değilse gayrimüslim bir doktor. Eğer buna gerek olmadığını düşünüyor ve aksi yönde şüpheleniyorsa, belki de randevunun iptal edilmesi Allah'a uygun ve Şeriat ilkelerine daha yakındır."
  id: "Seorang wanita meminta dokter melakukan EKG untuk membuka dada, dan dia merasa tidak mengetahui keputusan tersebut. Dr. Salah Al-Sawy menjawab (Fatwa No. 81629 tanggal 7 Juni 2010) bahwa membuka bagian pribadi untuk perawatan diperbolehkan dalam kasus mendesak; jika tidak, standar adalah dokter Muslim harus merawat wanita Muslim. Jika itu tidak memungkinkan, maka dokter non-Muslim; jika tidak memungkinkan, maka dokter Muslim; jika tidak, maka dokter non-Muslim; jika tidak, maka dokter non-Muslim. Jika dia merasa tidak perlu dan curiga sebaliknya, maka membatalkan janji tersebut menyenangkan Tuhan dan lebih dekat dengan prinsip Syariah."
