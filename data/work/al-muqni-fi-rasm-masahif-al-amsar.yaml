id: work/al-muqni-fi-rasm-masahif-al-amsar
class: work
kind: book
label: { ar: "المقنع في معرفة مرسوم مصاحف أهل الأمصار", en: "al-Muqni' fi Ma'rifat Marsum Masahif Ahl al-Amsar", ur: "المقنع فی معرفۃ مرسوم مصاحف اہل الامصار" }
summary:
  ar: "كتاب أبي عمرو الداني في رسم المصاحف العثمانية في الأمصار، عدّه السيوطي أول كتب الرسم التي سمّاها، وتحيل إليه حواشي طبعة «الإتقان» المحققة في مواضع الخلاف بين رسم المشارقة والمغاربة، وأعلن ناشر «التيسير» أنه سيتبعه به {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 2202} {cite:taysir-pretzl-istanbul-1930 p. 10}."
  en: "Abu Amr al-Dani's book on the spelling of the Uthmanic mushafs of the cities. Al-Suyuti names it first among the books on rasm, the notes of the edited Itqan refer to it for points where eastern and western spelling differ, and the editor of the Taysir announced it as his next edition {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 2202} {cite:taysir-pretzl-istanbul-1930 p. 10}."
  ur: "ابو عمرو دانی کی شہروں کے عثمانی مصاحف کے رسم پر کتاب؛ سیوطی نے رسم کی کتابوں میں اسے سب سے پہلے نام لیا، «الاتقان» کے محقق ایڈیشن کے حواشی مشرقی اور مغربی رسم کے اختلافی مقامات میں اس کا حوالہ دیتے ہیں، اور «التیسیر» کے ناشر نے اسے اپنی اگلی اشاعت کے طور پر ذکر کیا {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 2202} {cite:taysir-pretzl-istanbul-1930 p. 10}۔"
  es: "El libro de Abu Amr al-Dani sobre la ortografía de los mushafs utmánicos de las ciudades. Al-Suyuti lo nombra primero entre los libros sobre rasm, las notas del Itqan editado se refieren a él en los puntos donde difieren la ortografía oriental y occidental, y el editor del Taysir lo anunció como su próxima edición {cite:itqan-suyuti p. 37} {cite:itqan-suyuti p. 2202} {cite:taysir-pretzl-istanbul-1930 p. 10}."
