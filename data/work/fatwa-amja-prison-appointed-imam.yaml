label: { ar: "إمام السجن المعين", en: "The prison-appointed imam — accepted if qualified", ur: "جیل کا نامزد امام — اہل ہو تو مقبول", es: "El imán designado por la prisión —aceptado si cumple con los requisitos—" }
summary:
  ar: "سأل سائل هل يفرض على المسلمين المساجين تسمية إمامهم الذي يؤمهم في الصلوات. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21992 بتاريخ 14 أكتوبر 2012)⁩ أنه إذا سمت إدارة السجن إمامًا تحققت فيه شروط الإمامة فلا حرج في قبوله أما إذا اختارت لهم من لا يصلح للإمامة كان لهم التنبيه على ذلك وبيان المواصفات المطلوبة شرعًا فيمن يؤمهم على ما فصّل الجواب."
  en: "A questioner asked whether imprisoned Muslims must name the imam who leads their prayers. AMJA's fatwa committee (fatwa no. 21992, 14 October 2012) answered that if the prison administration appoints an imam meeting the imamate's conditions, accepting him is unobjectionable; if it chooses for them one unfit, they may point that out and set out the qualities required in their leader — as the answer details."
  ur: "جیل کا امام؟ لجنة الفتوى ⁦(فتویٰ 21992، 14 اکتوبر 2012)⁩ کے مطابق شرائط پورا ہو تو قبول؛ نااہل ہو تو تنبیہ جائز۔"
  es: "Un interlocutor preguntó si los musulmanes encarcelados deben nombrar al imán que dirige sus oraciones. El comité de fatuas de AMJA (fatua n.º 21992, 14 de octubre de 2012) respondió que si la administración penitenciaria designa a un imán que cumpla con las condiciones del imamato, aceptarlo no presenta objeciones; si elige a uno que no sea idóneo, pueden señalarlo y exponer las cualidades que se requieren de su líder, tal como se detalla en la respuesta."
