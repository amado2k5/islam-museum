id: work/fatwa-dar-alifta-eg-shortened-prayer-old-hometown
class: work
kind: fatwa
label: { ar: "حكم قصر الصلاة لمن غيّر محل إقامته حال سفره إلى بلده القديم", en: "Shortening prayer for one who changed residence when visiting his old town", ur: "اپنے پرانے شہر سفر کرنے والے منتقل شدہ شخص کے لیے نماز قصر کا حکم", es: "Oración abreviada para quien cambió de residencia al visitar su ciudad natal.", fr: "Prière abrégée pour celui qui a changé de résidence lors d'une visite dans sa ville natale" }
summary:
  ar: "سائل انتقل مع زوجته وأولاده إلى محل إقامة جديد وسأل عن قصر الصلاة حين يسافر إلى بلده القديم الذي تركه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22632)⁩ أن سفره من محل إقامته الحالي إلى بلده القديم الذي انتقل عنه سفرٌ يجيز له قصر الصلاة على ما فصّل الجواب من ضوابط الوطن والإقامة."
  en: "A questioner who moved with his wife and children to a new place of residence asked about shortening prayers when travelling back to his old town. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22632) answered that travelling from his current home to the old town he left counts as travel permitting the shortening of prayer, under the controls the answer sets for home and residence."
  ur: "ایک سائل اپنی بیوی بچوں سمیت نئی جائے سکونت منتقل ہو گیا اور اپنے پرانے شہر جانے پر نماز قصر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22632)⁩ نے جواب دیا کہ اس کی موجودہ رہائش سے اس کے پرانے شہر کا سفر ایسا سفر ہے جو نماز قصر کی اجازت دیتا ہے، جواب کے بیان کردہ وطن اور قیام کے ضوابط کے مطابق۔"
  es: "Un consultante que se mudó con su esposa e hijos a una nueva residencia preguntó sobre la posibilidad de acortar las oraciones al regresar a su ciudad natal. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22632) respondió que viajar desde su domicilio actual a la ciudad que dejó atrás se considera un viaje que permite acortar la oración, según las normas que la respuesta establece para el hogar y la residencia."
  fr: "Un homme ayant déménagé avec sa femme et ses enfants s'est renseigné sur la possibilité de raccourcir la prière lors de son retour dans sa ville d'origine. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22632) a répondu que le déplacement entre son domicile actuel et sa ville d'origine est considéré comme un déplacement autorisant le raccourcissement de la prière, conformément aux règles établies pour le domicile et la résidence."
