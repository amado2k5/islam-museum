id: work/fatwa-amja-strength-4000-fabricated
class: work
kind: fatwa
label: { ar: "قوة أربعة آلاف رجل افتراء", en: "The 'strength of four thousand men' claim is a fabrication", ur: "چار ہزار آدمیوں کی طاقت — افترا", es: "La afirmación de que tienen la \"fuerza de cuatro mil hombres\" es una invención.", fr: "L'affirmation selon laquelle ils auraient la « force de quatre mille hommes » est une invention." }
summary:
  ar: "سأل سائل عن حديث سمع في درس أن الله أعطى رسوله قوة أربعة آلاف رجل هل هو صحيح. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77630 بتاريخ 30 يناير 2009)⁩ أنه لم يسمع بهذا الحديث بل هو من مفتريات أعداء الإسلام في مقام الطعن في النبي، وممن رفع عقيرته به القمص زكريا بطرس عليه من الله ما يستحق، ونبهه إلى مثل هذه الدسائس."
  en: "A questioner heard in a lesson that God gave His messenger the strength of four thousand men, and asked if the hadith is sound. Dr. Salah al-Sawi (fatwa no. 77630, 30 January 2009) answered that he had never heard of it — it is rather among the fabrications of Islam's enemies aiming to impugn the Prophet, among those trumpeting it the priest Zakaria Boutros, whom God will repay; he warned him to mind such forgeries."
  ur: "ایک سائل نے نبی کو چار ہزار کی طاقت دینے کی روایت کی صحت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77630، 30 جنوری 2009)⁩ کے مطابق ایسی کوئی حدیث نہیں سنی — یہ مخالفین کا افترا ہے اور اس نے ایسی دسائس سے خبردار کیا۔"
  es: "Un lector escuchó en una lección que Dios le dio a su mensajero la fuerza de cuatro mil hombres y preguntó si el hadiz era auténtico. El Dr. Salah al-Sawi (fatwa n.° 77630, 30 de enero de 2009) respondió que nunca había oído hablar de él; más bien, se trata de una invención de los enemigos del Islam que buscan desacreditar al Profeta, entre quienes lo difunden se encuentra el sacerdote Zakaria Boutros, a quien Dios recompensará. Le advirtió que tuviera cuidado con tales falsificaciones."
  fr: "Lors d'un cours, un auditeur, ayant entendu dire que Dieu avait donné à Son Messager la force de quatre mille hommes, demanda si ce hadith était authentique. Le Dr Salah al-Sawi (fatwa n° 77630, 30 janvier 2009) répondit qu'il n'en avait jamais entendu parler et que ce hadith figurait parmi les inventions des ennemis de l'islam cherchant à discréditer le Prophète. Parmi ceux qui le colportent se trouve le prêtre Zakaria Boutros, que Dieu punira. Il mit en garde l'auditeur contre de tels mensonges."
