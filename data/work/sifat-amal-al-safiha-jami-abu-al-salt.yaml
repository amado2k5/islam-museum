class: work
kind: treatise
label:
  { ar: "صفة عمل الصفيحة الجامعة تقوّم بها جميع الكواكب السبعة ⁦(أبو الصلت)⁩", en: "Sifat 'amal al-safiha al-jami'a taqawwama biha jami' al-kawakib al-sab'a (Abu al-Salt)", ur: "صفت عمل الصفیحۃ الجامعۃ ⁦(ابو الصلت)⁩" }
summary:
  ar: "رسالة أبي الصلت أمية بن عبد العزيز الداني الأندلسي ⁦(ت 529هـ)⁩ في بناء واستعمال «الصفيحة الجامعة» التي تقوّم بها حركات الكواكب السبعة جميعاً؛ يصفها معجم BEA بأنها آخر الإكواتوريومات الأندلسية المعروفة الثلاثة وربما كانت حلقة وصل بالإكواتوريومات الشرقية {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}."
  en: "Treatise by Abu al-Salt Umayya ibn Abd al-Aziz al-Dani al-Andalusi (d. 529 AH) on building and using the 'universal plate' by which the motions of all seven planets are computed; the BEA calls it the last of the three known Andalusian equatoria and a possible link to the eastern equatoria {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}."
  ur: "ابو الصلت امیہ بن عبد العزیز دانی اندلسی ⁦(529ھ میں وفات)⁩ کا رسالہ «جامع صفیحہ» کی تعمیر و استعمال پر جس سے ساتوں سیاروں کی حرکتیں گنی جاتی ہیں؛ BEA اسے تین معلوم اندلسی ایکواتوریومات میں آخری قرار دیتا ہے اور مشرقی ایکواتوریومات سے ممکنہ کڑی کہتا ہے {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}۔"
  es: "Tratado de Abu al-Salt Umayya ibn Abd al-Aziz al-Dani al-Andalusi (m. 529 AH) sobre la construcción y el uso de la 'placa universal' mediante la cual se calculan los movimientos de los siete planetas; la BEA la denomina la última de las tres ecuatorias andalusíes conocidas y un posible vínculo con las ecuatorias orientales {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}."
