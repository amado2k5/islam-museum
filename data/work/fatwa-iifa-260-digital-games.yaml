id: work/fatwa-iifa-260-digital-games
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 260 (5/26) بشأن الألعاب الرقمية ⁦(الإلكترونية)⁩: أحكامها وضوابطها", en: "IIFA resolution 260 (5/26) on digital (electronic) games: rulings and rules", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 260 (5/26): ڈیجیٹل (الیکٹرانک) گیمز کے احکام اور ضوابط" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة أكّد فيه قراره السابق رقم 127 (1/14) بشأن بطاقات المسابقات، وعرّف الألعاب الرقمية بأنها نشاطات تفاعلية حركية وذهنية عبر تقنية حديثة أو تطبيق رقمي كألعاب الحركة والمغامرة والألغاز والألعاب الرياضية الإلكترونية، وقرر أن الأصل في ممارستها الإباحة، فتجوز إذا لم تشتمل على محرمات ولم يصحبها إضرار بالدين أو النفس أو العقل أو المال أو النسل ولم تؤد إلى الاعتداء على الغير أو تفويت الواجبات، وأن إنتاجها والاتجار بها جائز إذا خلا من هذه المفاسد ويثبت لصاحبها حق الملكية الفكرية، وأن الاتجار ببطاقاتها جائز إذا كانت سابقة الدفع وتمثل منافع معلومة. وأوصى بإصدار أدلة التربية الرقمية وسن تشريعات تحد من مخاطرها، وتوجيه الوالدين إلى الرقابة بحسب الفئة العمرية، وعقد ندوات إعلامية عن إيجابياتها وسلبياتها، وتوجيه المبرمجين إلى إيجاد بديل نافع جاذب."
  en: "A collective resolution of the International Islamic Fiqh Academy at its twenty-sixth session in Doha, which reaffirmed its earlier resolution 127 (1/14) on competition cards, defined digital games as interactive physical and mental activities through modern technology or a digital application, such as action, adventure, puzzle and electronic sports games, and resolved that the default for playing them is permissibility: they are allowed if they contain nothing forbidden, cause no harm to religion, life, mind, property or progeny, and do not lead to aggression against others or the neglect of duties; that producing and trading them is permitted when free of these harms, with the author's intellectual property right recognised; and that trading in game cards is permitted if they are prepaid and represent known benefits. It recommended issuing digital-education guides and enacting legislation that limits the games' risks, directing parents to supervise according to age group, holding media seminars on their benefits and harms, and guiding programmers to create beneficial and attractive alternatives."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی دوحہ میں چھبیسویں اجلاس کی اجتماعی قرارداد، جس میں اس نے مقابلے کے کارڈوں کے بارے میں اپنی سابقہ قرارداد 127 (1/14) کی تاکید کی، ڈیجیٹل گیمز کی تعریف کی کہ یہ جدید ٹیکنالوجی یا ڈیجیٹل ایپلی کیشن کے ذریعے جسمانی اور ذہنی تعاملی سرگرمیاں ہیں جیسے ایکشن، ایڈونچر، پہیلیوں اور الیکٹرانک کھیلوں کی گیمز، اور فیصلہ کیا کہ انہیں کھیلنے میں اصل اباحت ہے: یہ جائز ہیں اگر ان میں کوئی حرام چیز نہ ہو، دین، جان، عقل، مال یا نسل کو نقصان نہ پہنچائیں، اور دوسروں پر زیادتی یا واجبات کے ضیاع تک نہ لے جائیں؛ ان کی تیاری اور تجارت ان مفاسد سے خالی ہونے پر جائز ہے اور بنانے والے کا فکری ملکیت کا حق ثابت ہے؛ اور گیم کارڈوں کی تجارت جائز ہے اگر وہ پیشگی ادائیگی والے ہوں اور معلوم منافع کی نمائندگی کریں۔ اس نے ڈیجیٹل تربیت کے رہنما اصول جاری کرنے اور گیمز کے خطرات کم کرنے والی قانون سازی، والدین کو عمر کے گروہ کے مطابق نگرانی کی ہدایت، ان کے فوائد اور نقصانات پر میڈیا سیمینار، اور پروگرامروں کو مفید اور پرکشش متبادل بنانے کی رہنمائی کی سفارش کی۔"
