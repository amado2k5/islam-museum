label: { ar: "قرار مجمع الفقه الإسلامي الدولي 260 (5/26) بشأن الألعاب الرقمية ⁦(الإلكترونية)⁩: أحكامها وضوابطها", en: "IIFA resolution 260 (5/26) on digital (electronic) games: rulings and rules", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 260 (5/26): ڈیجیٹل ⁦(الیکٹرانک)⁩ گیمز کے احکام اور ضوابط", es: "Resolución 260 (5/26) de la IIFA sobre juegos digitales (electrónicos): resoluciones y reglas", fr: "Résolution IIFA 260 (5/26) sur les jeux numériques (électroniques): décisions et règles", tr: "Uluslararası İslami Fiqh Akademisi Kararı 260 (5/26) dijital (e-spor) ile ilgili hükümleri ve düzenlemeleri", id: "Resolusi Akademi Fiqh Islam Internasional 260 (26/5) mengenai digital (e-sports): ketentuan dan regulasinya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة أكّد فيه قراره السابق رقم 127 (1/14) بشأن بطاقات المسابقات، وعرّف الألعاب الرقمية بأنها نشاطات تفاعلية حركية وذهنية عبر تقنية حديثة أو تطبيق رقمي كألعاب الحركة والمغامرة والألغاز والألعاب الرياضية الإلكترونية، وقرر أن الأصل في ممارستها الإباحة، فتجوز إذا لم تشتمل على محرمات ولم يصحبها إضرار بالدين أو النفس أو العقل أو المال أو النسل ولم تؤد إلى الاعتداء على الغير أو تفويت الواجبات، وأن إنتاجها والاتجار بها جائز إذا خلا من هذه المفاسد ويثبت لصاحبها حق الملكية الفكرية، وأن الاتجار ببطاقاتها جائز إذا كانت سابقة الدفع وتمثل منافع معلومة. وأوصى بإصدار أدلة التربية الرقمية وسن تشريعات تحد من مخاطرها، وتوجيه الوالدين إلى الرقابة بحسب الفئة العمرية، وعقد ندوات إعلامية عن إيجابياتها وسلبياتها، وتوجيه المبرمجين إلى إيجاد بديل نافع جاذب."
  en: "A collective resolution of the International Islamic Fiqh Academy at its twenty-sixth session in Doha, which reaffirmed its earlier resolution 127 (1/14) on competition cards, defined digital games as interactive physical and mental activities through modern technology or a digital application, such as action, adventure, puzzle and electronic sports games, and resolved that the default for playing them is permissibility: they are allowed if they contain nothing forbidden, cause no harm to religion, life, mind, property or progeny, and do not lead to aggression against others or the neglect of duties; that producing and trading them is permitted when free of these harms, with the author's intellectual property right recognised; and that trading in game cards is permitted if they are prepaid and represent known benefits. It recommended issuing digital-education guides and enacting legislation that limits the games' risks, directing parents to supervise according to age group, holding media seminars on their benefits and harms, and guiding programmers to create beneficial and attractive alternatives."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی دوحہ میں چھبیسویں اجلاس کی اجتماعی قرارداد، جس میں اس نے مقابلے کے کارڈوں کے بارے میں اپنی سابقہ قرارداد 127 (1/14) کی تاکید کی، ڈیجیٹل گیمز کی تعریف کی کہ یہ جدید ٹیکنالوجی یا ڈیجیٹل ایپلی کیشن کے ذریعے جسمانی اور ذہنی تعاملی سرگرمیاں ہیں جیسے ایکشن، ایڈونچر، پہیلیوں اور الیکٹرانک کھیلوں کی گیمز، اور فیصلہ کیا کہ انہیں کھیلنے میں اصل اباحت ہے: یہ جائز ہیں اگر ان میں کوئی حرام چیز نہ ہو، دین، جان، عقل، مال یا نسل کو نقصان نہ پہنچائیں، اور دوسروں پر زیادتی یا واجبات کے ضیاع تک نہ لے جائیں؛ ان کی تیاری اور تجارت ان مفاسد سے خالی ہونے پر جائز ہے اور بنانے والے کا فکری ملکیت کا حق ثابت ہے؛ اور گیم کارڈوں کی تجارت جائز ہے اگر وہ پیشگی ادائیگی والے ہوں اور معلوم منافع کی نمائندگی کریں۔ اس نے ڈیجیٹل تربیت کے رہنما اصول جاری کرنے اور گیمز کے خطرات کم کرنے والی قانون سازی، والدین کو عمر کے گروہ کے مطابق نگرانی کی ہدایت، ان کے فوائد اور نقصانات پر میڈیا سیمینار، اور پروگرامروں کو مفید اور پرکشش متبادل بنانے کی رہنمائی کی سفارش کی۔"
  es: "Una resolución colectiva de la Academia Internacional de Jurisprudencia Islámica, en su vigésimo sexta sesión celebrada en Doha, que reafirmó su resolución anterior 127 (1/14) sobre tarjetas de juego, definió los juegos digitales como actividades físicas y mentales interactivas mediante tecnología moderna o una aplicación digital, como juegos de acción, aventura, rompecabezas y deportes electrónicos. Resolvió que la norma general para jugarlos es la permisibilidad: están permitidos si no contienen nada prohibido, no causan daño a la religión, la vida, la mente, la propiedad ni la descendencia, y no conducen a la agresión contra otros ni al incumplimiento de los deberes; que su producción y comercialización están permitidas cuando no causan estos daños, reconociéndose el derecho de propiedad intelectual del autor; y que el comercio de tarjetas de juego está permitido si son prepagadas y representan beneficios conocidos. Recomendó la publicación de guías de educación digital y la promulgación de leyes que limiten los riesgos de los juegos, instando a los padres a supervisar según la edad de los niños, organizando seminarios para los medios de comunicación sobre sus beneficios y perjuicios, y orientando a los programadores para que creen alternativas beneficiosas y atractivas."
  fr: "Lors de sa vingt-sixième session à Doha, l'Académie internationale de jurisprudence islamique (Fiqh) a adopté une résolution collective réaffirmant sa résolution antérieure n° 127 (1/14) relative aux cartes de jeu. Cette résolution définit les jeux numériques comme des activités interactives, physiques et mentales, réalisées grâce aux technologies modernes ou à une application numérique. Elle inclut notamment les jeux d'action, d'aventure, de réflexion et de sport électronique. L'Académie a statué que la licéité est le principe par défaut: les jeux sont autorisés s'ils ne contiennent aucun élément interdit, ne portent pas atteinte à la religion, à la vie, à l'esprit, aux biens ou à la descendance, et n'incitent ni à l'agression envers autrui ni à la négligence des devoirs. La production et la commercialisation de ces jeux sont permises lorsqu'ils sont exempts de ces préjudices, le droit de propriété intellectuelle de l'auteur étant reconnu. L'Académie a également autorisé l'échange de cartes de jeu prépayées présentant des avantages connus. Elle a recommandé la publication de guides d'éducation numérique et l'adoption d'une législation limitant les risques liés à ces jeux, incitant les parents à superviser les jeux en fonction de l'âge de leurs enfants, organisant des séminaires sur les avantages et les inconvénients des jeux numériques, et encourageant les développeurs à créer des alternatives attrayantes et bénéfiques."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki yirmi altıncı oturumunda ortak kararı, yarışma kartlarıyla ilgili önceki 127 (1/14) sayılı kararını onaylamıştır. Dijital oyunlar, modern teknoloji veya aksiyon, macera, bulmacalar ve elektronik spor oyunları gibi dijital uygulamalar aracılığıyla etkileşimli, motorlu ve zihinsel faaliyetlerdir. Varsayılan uygulamanın izin verilebileceğine karar verildi; çünkü yasaklar içermiyorsa, dine, yaşama, zihniye, mülkiyete veya soyuna zarar vermiyor, başkalarına zarar vermiyor veya görevleri ihmal etmiyorsa kabul edilebilir. Üretimleri ve ticareti, bu tür zararlardan arındırıldıkları ve fikri mülkiyet hakları sahibine kanıtlandığı sürece izinlidir. Kartlarının takas edilmesi, ön ödemeli ve bilinen faydaları temsil ediyorsa izin verilir. Dijital eğitim rehberleri yayımlanmasını ve riskleri azaltmak için yasalar çıkarılmasını, ebeveynlerin yaş grubuna göre denetim yapmalarını, artı ve eksileri hakkında medya seminerleri düzenlemeyi ve programcılara faydalı ve çekici bir alternatif bulmalarını tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-26 di Doha menegaskan keputusan sebelumnya No. 127 (1/14) mengenai kartu kompetisi. Permainan digital adalah aktivitas interaktif, motorik, dan mental melalui teknologi modern atau aplikasi digital seperti aksi, petualangan, teka-teki, dan permainan olahraga elektronik. Diputuskan bahwa praktik default adalah diperbolehkan, karena diperbolehkan jika tidak melibatkan larangan, tidak merusak agama, kehidupan, pikiran, properti, atau garis keturunan, dan tidak menyebabkan kerugian bagi orang lain atau mengabaikan kewajiban. Produksi dan perdagangannya diperbolehkan jika bebas dari kerugian tersebut dan hak kekayaan intelektual terbukti kepada pemiliknya. Perdagangan kartu mereka diperbolehkan jika kartu tersebut dibayar di muka dan mewakili manfaat yang diketahui. Laporan ini merekomendasikan penerbitan panduan pendidikan digital dan pengesahan undang-undang untuk mengurangi risikonya, mengarahkan orang tua untuk mengawasi sesuai kelompok usia, mengadakan seminar media tentang kelebihan dan kekurangannya, serta membimbing para programmer untuk menemukan alternatif yang bermanfaat dan menarik."
