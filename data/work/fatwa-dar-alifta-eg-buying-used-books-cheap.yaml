id: work/fatwa-dar-alifta-eg-buying-used-books-cheap
class: work
kind: fatwa
label: { ar: "حكم شراء الكتب المستعملة بسعر أرخص من أماكن مخصصة لها", en: "Buying used books cheaply at their usual spots", ur: "معین مقامات سے مستعمل کتابیں سستی خریدنا", es: "Comprar libros usados baratos en sus lugares habituales.", fr: "Acheter des livres d'occasion à bas prix dans leurs emplacements habituels" }
summary:
  ar: "سائل سأل عن شراء الكتب المستعملة بسعر زهيد من أماكن مخصصة لذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22017)⁩ أن شراءها جائز شرعًا ما دامت ملكيتها آلت إلى البائع بطريق شرعي صحيح، على ما فصّل الجواب."
  en: "A questioner asked about buying used books at a low price from places set aside for that. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22017) answered that buying them is lawful so long as their ownership passed to the seller by a sound lawful means, as the answer details."
  ur: "ایک سائل نے مخصوص مقامات سے مستعمل کتابیں سستی قیمت پر خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22017)⁩ نے جواب دیا کہ خریدنا جائز ہے بشرطیکہ کتابوں کی ملکیت بائع کو کسی صحیح شرعی طریقے سے منتقل ہوئی ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de comprar libros usados a bajo precio en lugares destinados a tal fin. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22017) respondió que la compra es lícita siempre que la propiedad se haya transferido al vendedor por medios legales y legítimos, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'achat de livres d'occasion à bas prix dans des lieux spécialisés. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22017) a répondu que cet achat est licite à condition que la propriété des livres ait été transférée au vendeur par un moyen légal et valable, comme le précise la réponse."
