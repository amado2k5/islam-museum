label: { ar: "حكم صلاة الجمعة إذا وافقت يوم عيد", en: "Friday prayer when it falls on an Eid", ur: "جمعہ کا دن عید سے مل جائے تو نمازِ جمعہ", es: "La oración del viernes cuando cae en un Eid" }
summary:
  ar: "سائل سأل عن صلاة الجمعة إذا وافقت يوم عيد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21914)⁩ أن الجمعة تقام في المساجد عملًا بالأصل والأكمل والأجزل ثوابًا أن يصلي المكلف صلاة العيد والجمعة معًا على ما فصّل الجواب."
  en: "A questioner asked about the Friday prayer when it coincides with an Eid. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21914) answered that Friday prayer is held in the mosques on the default rule, and the most complete and most rewarded is for the worshipper to pray both the Eid prayer and the Friday prayer — as the answer details."
  ur: "ایک سائل نے عید کے دن جمعہ پڑ جانے پر نمازِ جمعہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21914)⁩ نے جواب دیا کہ اصول کے مطابق مسجدوں میں جمعہ قائم ہوتا ہے اور مکمل اور زیادہ اجر یہ ہے کہ شخص عید اور جمعہ دونوں پڑھے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la oración del viernes cuando coincide con el Eid. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21914) respondió que la oración del viernes se realiza en las mezquitas por norma general, y que lo más completo y meritorio es que el fiel rece tanto la oración del Eid como la del viernes, como se detalla en la respuesta."
