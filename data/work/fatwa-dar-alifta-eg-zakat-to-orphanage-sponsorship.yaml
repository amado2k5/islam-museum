label: { ar: "حكم دفع الزكاة لدار الأيتام من أجل كفالة طفل", en: "Paying zakat to an orphanage to sponsor a child", ur: "یتیم خانے کو بچے کی کفالت کے لیے زکات دینا", es: "Pagar el zakat a un orfanato para apadrinar a un niño.", fr: "Verser la zakat à un orphelinat pour parrainer un enfant", tr: "Çocuk destekçiliği nedeniyle bir yetimhaneye zekat ödenmesine ilişkin karar", id: "Putusan tentang pembayaran zakat kepada panti asuhan untuk sponsor anak" }
summary:
  ar: "سائل سأل عن دفع الزكاة لدار الأيتام من أجل كفالة طفل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21735)⁩ أن اليتيم الذي لا يملك ما يفي باحتياجاته مصرف من مصارف الزكاة يجوز دفع الزكاة له إن كان بالغًا عاقلًا رشيدًا على ما فصّل الجواب من حكم الصغير."
  en: "A questioner asked about paying zakat to an orphanage to sponsor a child. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21735) answered that an orphan without means to meet his needs is a zakat channel; it may be paid to him if he is adult, sane and discerning, and the case of the young orphan is set out in the answer."
  ur: "ایک سائل نے یتیم خانے کو بچے کی کفالت کے لیے زکات دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21735)⁩ نے جواب دیا کہ ضرورت مند یتیم زکات کا مصرف ہے؛ اگر وہ بالغ، عاقل اور رشید ہو تو اسے دیا جا سکتا ہے اور نابالغ کا حکم جواب میں بیان ہوا۔"
  es: "Una persona preguntó sobre el pago del zakat a un orfanato para apadrinar a un niño. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21735) respondió que un huérfano sin recursos para cubrir sus necesidades es un canal para el zakat; se le puede pagar si es adulto, está en pleno uso de sus facultades mentales y es capaz de discernir, y el caso del joven huérfano se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le versement de la zakat à un orphelinat pour parrainer un enfant. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21735) a répondu qu'un orphelin sans ressources est un bénéficiaire potentiel de la zakat; celle-ci peut lui être versée s'il est majeur, sain d'esprit et capable de discernement. Le cas du jeune orphelin est détaillé dans la réponse."
  tr: "Bir soru soran kişi, çocuk sponsorluğu için bir yetimhaneye zekat ödemeyi sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21735), zekat fonlarından ihtiyaçlarını karşılayacak kadar yetim olmayan bir yetimin olgun, aklı başında ve sağlıklı yetişkinse zekat alabileceğini yanıtlamıştır; bu kararda reşit olmayanlar hakkındaki kararda ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang pembayaran zakat kepada panti asuhan untuk sponsor anak. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21735) menjawab bahwa anak yatim yang tidak memiliki cukup dana zakat untuk memenuhi kebutuhannya dapat diberikan zakat jika ia dewasa, waras, dan sehat, sebagaimana dijelaskan mengenai putusan tentang anak di bawah umur."
