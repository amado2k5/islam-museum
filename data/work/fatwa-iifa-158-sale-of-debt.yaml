id: work/fatwa-iifa-158-sale-of-debt
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 158 (17/7) بشأن بيع الدين", en: "IIFA resolution 158 (17/7) on the sale of debt", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 158 (17/7): قرض کی بیع" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على قراريه 101 ⁦(11/4)⁩ بشأن بيع الدين وسندات القرض و139 ⁦(15/5)⁩ بشأن بطاقات الائتمان. قرر: يعد من فسخ الدين بالدين الممنوع كل ما يفضي إلى زيادة الدين على المدين مقابل الزيادة في الأجل أو يكون ذريعة إليه، ومنه معاملة بين الدائن والمدين تنشئ مديونية جديدة لسداد الأولى كلها أو بعضها ⁦(كشراء المدين سلعة من الدائن بثمن مؤجل ثم بيعها نقدًا للسداد)⁩؛ وتناول صور بيع الدين المعاصرة في المصارف والمؤسسات المالية وضوابط حوالة الدين وبيعه لغير المدين والخصم ⁦(الإسناد)⁩ وما يجوز وما يمتنع منها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing resolutions 101 (11/4) on the sale of debt and loan instruments and 139 (15/5) on credit cards. It ruled that cancelling debt for debt, prohibited in the law, covers whatever increases the debt on the debtor in exchange for extending its term or serves as a device to that end — including a transaction between creditor and debtor creating a new liability to settle the first in whole or part (such as the debtor buying a commodity from the creditor on deferred price then reselling it for cash to pay the debt). It then treated contemporary forms of debt sale in banks and financial institutions and the controls of debt assignment (hawala), sale to third parties and discounting — what is permissible and what is not."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، قراردادوں 101 ⁦(11/4)⁩ برائے قرض کی بیع و قرضے کی سندات اور 139 ⁦(15/5)⁩ برائے کریڈٹ کارڈز کے جائزے کے بعد۔ اس نے فیصلہ دیا کہ قرض کے بدلے قرض کی ممنوع تصفیہ میں وہ سب داخل ہے جو مدت بڑھانے کے بدلے مدین کا قرض بڑھائے یا اس کا ذریعہ ہو — بشمول دائن و مدین کے درمیان وہ لین دین جو پہلی مديونیت کے تمام یا جزوی ادا کرنے کے لیے نیا قرض پیدا کرے ⁦(جیسے مدین دائن سے مؤجل قیمت پر جنس خرید کر نقد بیچ کر قرض ادا کرے)⁩۔ پھر بینکوں اور مالی اداروں میں قرض کی بیع کی عصری صورتیں اور حوالۂ دین، تیسرے کو فروخت اور ڈسکاؤنٹنگ کے ضوابط — کیا جائز اور کیا ممنوع۔"
