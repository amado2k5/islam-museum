id: work/fatwa-iifa-158-sale-of-debt
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 158 (17/7) بشأن بيع الدين", en: "IIFA resolution 158 (17/7) on the sale of debt", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 158 (17/7): قرض کی بیع", es: "Resolución 158 (17/7) de la IIFA sobre la venta de deuda", fr: "Résolution 158 (17/7) de l'IIFA relative à la vente de créances" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على قراريه 101 ⁦(11/4)⁩ بشأن بيع الدين وسندات القرض و139 ⁦(15/5)⁩ بشأن بطاقات الائتمان. قرر: يعد من فسخ الدين بالدين الممنوع كل ما يفضي إلى زيادة الدين على المدين مقابل الزيادة في الأجل أو يكون ذريعة إليه، ومنه معاملة بين الدائن والمدين تنشئ مديونية جديدة لسداد الأولى كلها أو بعضها ⁦(كشراء المدين سلعة من الدائن بثمن مؤجل ثم بيعها نقدًا للسداد)⁩؛ وتناول صور بيع الدين المعاصرة في المصارف والمؤسسات المالية وضوابط حوالة الدين وبيعه لغير المدين والخصم ⁦(الإسناد)⁩ وما يجوز وما يمتنع منها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing resolutions 101 (11/4) on the sale of debt and loan instruments and 139 (15/5) on credit cards. It ruled that cancelling debt for debt, prohibited in the law, covers whatever increases the debt on the debtor in exchange for extending its term or serves as a device to that end — including a transaction between creditor and debtor creating a new liability to settle the first in whole or part (such as the debtor buying a commodity from the creditor on deferred price then reselling it for cash to pay the debt). It then treated contemporary forms of debt sale in banks and financial institutions and the controls of debt assignment (hawala), sale to third parties and discounting — what is permissible and what is not."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، قراردادوں 101 ⁦(11/4)⁩ برائے قرض کی بیع و قرضے کی سندات اور 139 ⁦(15/5)⁩ برائے کریڈٹ کارڈز کے جائزے کے بعد۔ اس نے فیصلہ دیا کہ قرض کے بدلے قرض کی ممنوع تصفیہ میں وہ سب داخل ہے جو مدت بڑھانے کے بدلے مدین کا قرض بڑھائے یا اس کا ذریعہ ہو — بشمول دائن و مدین کے درمیان وہ لین دین جو پہلی مديونیت کے تمام یا جزوی ادا کرنے کے لیے نیا قرض پیدا کرے ⁦(جیسے مدین دائن سے مؤجل قیمت پر جنس خرید کر نقد بیچ کر قرض ادا کرے)⁩۔ پھر بینکوں اور مالی اداروں میں قرض کی بیع کی عصری صورتیں اور حوالۂ دین، تیسرے کو فروخت اور ڈسکاؤنٹنگ کے ضوابط — کیا جائز اور کیا ممنوع۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24–28 de junio de 2006), tras revisar las resoluciones 101 (11/4) sobre la venta de instrumentos de deuda y préstamos y 139 (15/5) sobre tarjetas de crédito. Dictaminó que la cancelación de deuda por deuda, prohibida por la ley, abarca todo aquello que aumenta la deuda del deudor a cambio de extender su plazo o que sirve como mecanismo para tal fin, incluyendo una transacción entre acreedor y deudor que crea una nueva obligación para saldar la primera total o parcialmente (como cuando el deudor compra una mercancía al acreedor a plazos y luego la revende al contado para pagar la deuda). A continuación, analizó las formas contemporáneas de venta de deuda en bancos e instituciones financieras y los controles de la cesión de deuda (hawala), la venta a terceros y el descuento: qué es permisible y qué no."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006), après examen des résolutions 101 (11/4) relative à la vente de titres de créance et d'instruments de prêt et 139 (15/5) relative aux cartes de crédit, a statué que l'annulation d'une dette par une autre, interdite par la loi, englobe tout ce qui augmente la dette du débiteur en échange d'un allongement de son échéance ou qui sert de procédé à cette fin – y compris une transaction entre créancier et débiteur créant une nouvelle obligation pour régler la première en tout ou partie (par exemple, l'achat par le débiteur d'une marchandise auprès du créancier à prix différé, puis sa revente au comptant pour rembourser la dette). L'Académie a ensuite examiné les formes contemporaines de vente de créances dans les banques et les institutions financières, ainsi que les contrôles relatifs à la cession de créances (hawala), à la vente à des tiers et à l'escompte – en précisant ce qui est permis et ce qui ne l'est pas."
