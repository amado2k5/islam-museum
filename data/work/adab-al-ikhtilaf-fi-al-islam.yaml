summary:
  ar: "كتاب لطه جابر العلواني في آداب الخلاف بين العلماء وأسبابه، صدرت ترجمته الإنجليزية «The Ethics of Disagreement in Islam» عن المعهد العالمي للفكر الإسلامي بهيرندن سنة 1992 في 158 صفحة."
  en: "A book by Taha Jabir al-Alwani on the causes and etiquette of disagreement among scholars; its English translation, The Ethics of Disagreement in Islam, was published by the International Institute of Islamic Thought, Herndon, in 1992 (158 pages)."
  ur: "طہ جابر العلوانی کی کتاب جو علما کے اختلاف کے اسباب اور آداب پر ہے؛ اس کا انگریزی ترجمہ «دی ایتھکس آف ڈس ایگریمنٹ اِن اسلام» انٹرنیشنل انسٹی ٹیوٹ آف اسلامک تھاٹ، ہرنڈن سے 1992ء میں 158 صفحات میں شائع ہوا۔"
  es: "Un libro de Taha Jabir al-Alwani sobre las causas y la etiqueta del desacuerdo entre los eruditos; su traducción al inglés, The Ethics of Disagreement in Islam, fue publicada por el Instituto Internacional de Pensamiento Islámico, Herndon, en 1992 (158 páginas)."
  fr: "Un livre de Taha Jabir al-Alwani sur les causes et l'étiquette du désaccord entre les érudits; sa traduction anglaise, The Ethics of Disagreement in Islam, a été publiée par The International Institute of Islamic Thought, Herndon, en 1992 (158 pages)."
