id: work/fatwa-dar-alifta-eg-buying-customs-seized-goods
class: work
kind: fatwa
label: { ar: "حكم شراء مصادرات الجمارك", en: "Buying goods confiscated by customs", ur: "کسٹم کی ضبط شدہ چیزیں خریدنا", es: "Comprar artículos confiscados por la aduana", fr: "Achat de marchandises confisquées par les douanes", tr: "Gümrük Müsaderelerinin Satın Alınmasına İlişkin Karar", id: "Putusan tentang Pembelian Penyitaan Bea Cukai" }
summary:
  ar: "سائل سأل عن شراء البضائع التي صادرتها الجمارك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20850)⁩ أن هذه البضائع المصادرة آلت ملكيتها للدولة بصورة صحيحة شرعًا وقانونًا ويحق للدولة أن تتصرف فيها بكافة أنواع التصرف الناقل للملكية على ما فصّل الجواب."
  en: "A questioner asked about buying goods confiscated by customs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20850) answered that such goods have validly passed to state ownership under sharia and law, and the state may dispose of them by any ownership-transferring act — as the answer details."
  ur: "ایک سائل نے کسٹم کی ضبط شدہ چیزیں خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20850)⁩ نے جواب دیا کہ ایسی چیزیں شرعاً اور قانوناً ریاست کی ملکیت میں آ گئیں اور ریاست انہیں منتقل کر سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la compra de bienes confiscados por la aduana. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20850) respondió que dichos bienes han pasado válidamente a ser propiedad del Estado según la sharia y la ley, y que el Estado puede disponer de ellos mediante cualquier acto de transferencia de propiedad, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'achat de marchandises confisquées par les douanes. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20850) a répondu que ces marchandises sont valablement devenues propriété de l'État en vertu de la charia et de la loi, et que l'État peut en disposer par tout acte de transfert de propriété, comme le précise la réponse."
  tr: "Bir soru soran kişi, gümrük tarafından el konulan malların satın alınması hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20850), el konulan malların mülkiyetin yasal ve dini olarak devlete devredildiğini ve devletin bunları herhangi bir şekilde elden çıkarma hakkına sahip olduğunu yanıtladı; bu da yanıtta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang pembelian barang yang disita oleh bea cukai. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20850) menjawab bahwa barang yang disita ini telah secara sah dan religius dialihkan kepemilikan kepada negara, dan negara berhak melepaskannya dengan cara apa pun yang mengalihkan kepemilikan, sebagaimana dijelaskan dalam jawaban."
