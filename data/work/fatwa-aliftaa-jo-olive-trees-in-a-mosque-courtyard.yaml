id: work/fatwa-aliftaa-jo-olive-trees-in-a-mosque-courtyard
class: work
kind: fatwa
label: { ar: "أشجار الزيتون في حرم المسجد", en: "Olive trees in a mosque's grounds", ur: "مسجد کے احاطے میں زیتون کے درخت" }
summary:
  ar: "سؤال عن أشجار الزيتون في حرم المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن ثمر الشجر المغروس للمسجد يصرف لمصالحه، والمغروس للعامة يأكل منه من دخل المسجد، وأن الأب المتبرع بنفقات المسجد ليس له أخذ مقابل تبرعه، مع وجوب الرجوع إلى وزارة الأوقاف. أجابت الدائرة بأن الأشجار المثمرة في المسجد إذا غرست للمسجد لم يجز صرف ثمرها إلا في مصالحه، وإذا غرست للسبيل أي للعامة جاز لكل من دخل المسجد من المسلمين أن يأكل منها، وإن جهلت نية الغارس فهي كالمسبلة حيث جرت العادة بذلك. واستندت إلى تحفة المحتاج (6/295) في أن ثمرة الشجرة المغروسة للمسجد ليست مباحة بلا عوض بل يصرف الإمام عوضها في مصالح المسجد، وأن المغروسة مسبلة يجوز أكلها بلا عوض، وللإمام قلع الشجرة إن رأى ذلك. وقالت إن الوالد متبرع فليس له أن يأخذ مقابل تبرعه للمسجد، وإن وزارة الأوقاف هي الجهة المشرفة على شؤون الوقف فلا بد من الرجوع إليها والنظر في التعليمات الشرعية والإدارية المنظمة لذلك."
  en: "A question about olive trees in a mosque's grounds, in which Jordan's General Iftaa Department answered that the fruit of trees planted for a mosque goes to the mosque's needs, while trees planted for the public may be eaten from by anyone entering the mosque, and that a father who donates the mosque's running costs may not take a return for his donation; the Ministry of Awqaf must be consulted. The Department answered that fruit trees in a mosque, if planted for the mosque, may have their fruit used only for the mosque's interests; if planted for public use, any Muslim entering the mosque may eat from them; and if the planter's intention is unknown, they count as planted for public use where that is the custom. It relied on Tuhfat al-Muhtaj (6/295) that the fruit of a tree planted for the mosque is not free to take without payment, its value being spent by the imam on the mosque's interests, whereas a tree planted for public use may be eaten from freely, and the imam may uproot a tree if he sees fit. It said the father is a donor, so he may not take anything in return for his donation to the mosque, and that the Ministry of Awqaf supervises endowment affairs, so it must be consulted along with the religious and administrative instructions governing such matters."
  ur: "مسجد کے احاطے میں زیتون کے درخت کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مسجد کے لیے لگائے گئے درخت کا پھل مسجد کی ضروریات میں صرف ہوگا، عام لوگوں کے لیے لگائے گئے درخت سے مسجد میں آنے والا کھا سکتا ہے، اور مسجد کے اخراجات عطیہ کرنے والا والد اپنے عطیے کا عوض نہیں لے سکتا؛ وزارتِ اوقاف سے رجوع ضروری ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد میں پھل دار درخت اگر مسجد کے لیے لگائے گئے ہوں تو ان کا پھل صرف مسجد کے مفادات میں خرچ ہوگا؛ اگر عام لوگوں کے لیے لگائے گئے ہوں تو مسجد میں آنے والا ہر مسلمان ان سے کھا سکتا ہے؛ اور اگر لگانے والے کی نیت معلوم نہ ہو تو جہاں ایسا رواج ہو وہ عام کے لیے وقف شدہ کی طرح ہیں۔ اس نے تحفۃ المحتاج (6/295) پر اعتماد کیا کہ مسجد کے لیے لگائے گئے درخت کا پھل بلا عوض مباح نہیں بلکہ امام اس کا عوض مسجد کے مفادات میں خرچ کرے گا، جبکہ عام کے لیے لگائے گئے درخت سے بلا عوض کھانا جائز ہے، اور امام مناسب سمجھے تو درخت اکھاڑ سکتا ہے۔ اس نے کہا کہ والد متبرع ہیں، اس لیے مسجد کو دیے گئے عطیے کا عوض نہیں لے سکتے، اور وزارتِ اوقاف وقف کے معاملات کی نگران ہے، لہٰذا اس سے اور ان امور کو منظم کرنے والی شرعی و انتظامی ہدایات سے رجوع ضروری ہے۔"
