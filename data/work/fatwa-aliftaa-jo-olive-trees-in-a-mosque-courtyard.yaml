label: { ar: "أشجار الزيتون في حرم المسجد", en: "Olive trees in a mosque's grounds", ur: "مسجد کے احاطے میں زیتون کے درخت", es: "Olivos en los terrenos de una mezquita", fr: "Oliviers dans l'enceinte d'une mosquée", tr: "Cami avlusunda zeytin ağaçları", id: "Pohon zaitun di halaman masjid" }
summary:
  ar: "سؤال عن أشجار الزيتون في حرم المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن ثمر الشجر المغروس للمسجد يصرف لمصالحه، والمغروس للعامة يأكل منه من دخل المسجد، وأن الأب المتبرع بنفقات المسجد ليس له أخذ مقابل تبرعه، مع وجوب الرجوع إلى وزارة الأوقاف. أجابت الدائرة بأن الأشجار المثمرة في المسجد إذا غرست للمسجد لم يجز صرف ثمرها إلا في مصالحه، وإذا غرست للسبيل أي للعامة جاز لكل من دخل المسجد من المسلمين أن يأكل منها، وإن جهلت نية الغارس فهي كالمسبلة حيث جرت العادة بذلك. واستندت إلى تحفة المحتاج (6/295) في أن ثمرة الشجرة المغروسة للمسجد ليست مباحة بلا عوض بل يصرف الإمام عوضها في مصالح المسجد، وأن المغروسة مسبلة يجوز أكلها بلا عوض، وللإمام قلع الشجرة إن رأى ذلك. وقالت إن الوالد متبرع فليس له أن يأخذ مقابل تبرعه للمسجد، وإن وزارة الأوقاف هي الجهة المشرفة على شؤون الوقف فلا بد من الرجوع إليها والنظر في التعليمات الشرعية والإدارية المنظمة لذلك."
  en: "A question about olive trees in a mosque's grounds, in which Jordan's General Iftaa Department answered that the fruit of trees planted for a mosque goes to the mosque's needs, while trees planted for the public may be eaten from by anyone entering the mosque, and that a father who donates the mosque's running costs may not take a return for his donation; the Ministry of Awqaf must be consulted. The Department answered that fruit trees in a mosque, if planted for the mosque, may have their fruit used only for the mosque's interests; if planted for public use, any Muslim entering the mosque may eat from them; and if the planter's intention is unknown, they count as planted for public use where that is the custom. It relied on Tuhfat al-Muhtaj (6/295) that the fruit of a tree planted for the mosque is not free to take without payment, its value being spent by the imam on the mosque's interests, whereas a tree planted for public use may be eaten from freely, and the imam may uproot a tree if he sees fit. It said the father is a donor, so he may not take anything in return for his donation to the mosque, and that the Ministry of Awqaf supervises endowment affairs, so it must be consulted along with the religious and administrative instructions governing such matters."
  ur: "مسجد کے احاطے میں زیتون کے درخت کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مسجد کے لیے لگائے گئے درخت کا پھل مسجد کی ضروریات میں صرف ہوگا، عام لوگوں کے لیے لگائے گئے درخت سے مسجد میں آنے والا کھا سکتا ہے، اور مسجد کے اخراجات عطیہ کرنے والا والد اپنے عطیے کا عوض نہیں لے سکتا؛ وزارتِ اوقاف سے رجوع ضروری ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد میں پھل دار درخت اگر مسجد کے لیے لگائے گئے ہوں تو ان کا پھل صرف مسجد کے مفادات میں خرچ ہوگا؛ اگر عام لوگوں کے لیے لگائے گئے ہوں تو مسجد میں آنے والا ہر مسلمان ان سے کھا سکتا ہے؛ اور اگر لگانے والے کی نیت معلوم نہ ہو تو جہاں ایسا رواج ہو وہ عام کے لیے وقف شدہ کی طرح ہیں۔ اس نے تحفۃ المحتاج (6/295) پر اعتماد کیا کہ مسجد کے لیے لگائے گئے درخت کا پھل بلا عوض مباح نہیں بلکہ امام اس کا عوض مسجد کے مفادات میں خرچ کرے گا، جبکہ عام کے لیے لگائے گئے درخت سے بلا عوض کھانا جائز ہے، اور امام مناسب سمجھے تو درخت اکھاڑ سکتا ہے۔ اس نے کہا کہ والد متبرع ہیں، اس لیے مسجد کو دیے گئے عطیے کا عوض نہیں لے سکتے، اور وزارتِ اوقاف وقف کے معاملات کی نگران ہے، لہٰذا اس سے اور ان امور کو منظم کرنے والی شرعی و انتظامی ہدایات سے رجوع ضروری ہے۔"
  es: "Una pregunta sobre los olivos en los terrenos de una mezquita, en la que el Departamento General de Iftaa de Jordania respondió que el fruto de los árboles plantados para una mezquita se destina a las necesidades de la mezquita, mientras que los árboles plantados para el público pueden ser consumidos por cualquier persona que entre en la mezquita, y que un padre que dona los gastos de funcionamiento de la mezquita no puede recibir ningún beneficio por su donación; se debe consultar al Ministerio de Awqaf. El Departamento respondió que los árboles frutales en una mezquita, si se plantaron para la mezquita, pueden tener su fruto solo para los intereses de la mezquita; si se plantaron para uso público, cualquier musulmán que entre en la mezquita puede comer de ellos; y si se desconoce la intención del plantador, se consideran plantados para uso público donde esa sea la costumbre. Se basó en Tuhfat al-Muhtaj (6/295), que establece que el fruto de un árbol plantado para la mezquita no puede tomarse gratuitamente, ya que el imán lo destina a los intereses de la mezquita. En cambio, de un árbol plantado para uso público se puede comer libremente, y el imán puede arrancarlo si lo considera oportuno. Afirmó que el padre es un donante, por lo que no puede recibir nada a cambio de su donación a la mezquita, y que el Ministerio de Awqaf supervisa los asuntos de dotación, por lo que debe consultarse con él, junto con las instrucciones religiosas y administrativas que rigen estas cuestiones."
  fr: "Concernant la présence d'oliviers dans l'enceinte d'une mosquée, le Département général de la Fatah de Jordanie a répondu que les fruits des arbres plantés pour la mosquée sont destinés à ses besoins, tandis que les fruits des arbres plantés pour le public peuvent être consommés par toute personne entrant dans la mosquée. Il a également été précisé qu'un père contribuant aux frais de fonctionnement de la mosquée ne peut prétendre à aucun avantage en contrepartie de son don et qu'il convient de consulter le ministère des Awqaf. Le Département a expliqué que les arbres fruitiers situés dans une mosquée, s'ils sont plantés pour la mosquée, ne peuvent être utilisés que pour ses besoins; s'ils sont plantés pour le public, tout musulman entrant dans la mosquée peut en consommer les fruits; et si l'intention du planteur est inconnue, ils sont considérés comme plantés pour le public, conformément à la coutume. Il s'est appuyé sur le traité Tuhfat al-Muhtaj (6/295) selon lequel les fruits d'un arbre planté pour la mosquée ne peuvent être consommés gratuitement, leur valeur étant dépensée par l'imam pour les besoins de la mosquée, tandis que les fruits d'un arbre planté pour le public peuvent être consommés librement, et l'imam peut déraciner un arbre s'il le juge nécessaire. Il a été précisé que le père étant donateur, il ne peut rien recevoir en échange de son don à la mosquée, et que le ministère des Awqaf supervise les affaires de dotation, et qu'il convient donc de le consulter en tenant compte des instructions religieuses et administratives régissant ces questions."
  tr: "Caminin türbesindeki zeytin ağaçlarıyla ilgili bir soruda, Ürdün Genel Fetva Dairesi, cami için dikilen ağaçların meyvesinin kendi çıkarları için harcandığını, halka dikilen meyvelerin ise caminin geliri tarafından tüketildiğini yanıtladı. Caminin masraflarını bağışlayan baba, bağışı için ödeme alma hakkına sahip değildir ve Awqaf Bakanlığı'na başvurmak zorundadır. Daire, cami için dikilen meyve ağaçlarının meyvelerinin kendi çıkarları dışında harcanmasının yasak olduğunu yanıtladı. kamu amaçlı dikildiğinde, camiye giren herhangi bir Müslümanın bu ağacdan yemek yemesi caizdir. Eğer ekicinin niyeti bilinmiyorsa, bu misbala gibidir, gelenek olduğu gibi. Tuhfat al-Muhtaj (6/295) şerine, cami için dikilen ağacın meyvesinin tazminat ödemeden izin verilemeyeceğini; bunun yerine imamın tazminatını caminin çıkarlarına harcayabileceğini, dikilen kişinin tazminatsız yemek yemesine izin verildiğini ve imamın uygun gördüğünde ağacı kökünden sökebileceğini belirtmiştir. Babanın bağışçı olduğunu ve camiye yaptığı bağış için herhangi bir ödeme almaması gerektiğini, ayrıca Vakıflar Bakanlığı'nın vakıf işlerinin denetleyici organı olması nedeniyle bu konuya başvurulup yasal ve idari talimatların dikkate alınması gerektiğini söyledi."
  id: "Sebuah pertanyaan tentang pohon zaitun di ruang suci masjid, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa buah pohon yang ditanam untuk masjid digunakan untuk kepentingan sendiri, dan buah yang ditanam untuk masyarakat dikonsumsi oleh pendapatan masjid. Ayah yang menyumbangkan biaya masjid tidak berhak menerima pembayaran atas sumbangannya, dengan kewajiban untuk merujuk ke Kementerian Awqaf. Departemen menjawab bahwa pohon buah di masjid, jika ditanam untuk masjid, tidak diperbolehkan menghabiskan buahnya kecuali untuk kepentingan pribadi. Jika ditanam untuk kepentingan umum, diperbolehkan bagi setiap Muslim yang masuk ke masjid untuk makan dari mereka. Jika niat penanam tidak diketahui, maka itu seperti misbala, seperti adat. Ia berdasarkan Tuhfat al-Muhtaj (6/295) bahwa buah pohon yang ditanam untuk masjid tidak diperbolehkan tanpa kompensasi; sebaliknya, imam dapat menghabiskan kompensasinya untuk kepentingan masjid, dan yang ditanam diizinkan makan tanpa kompensasi, dan imam dapat mencabut pohon jika dianggap perlu. Dia mengatakan bahwa ayah adalah donatur dan tidak seharusnya menerima pembayaran atas donasinya ke masjid, dan karena Kementerian Wakaf adalah badan pengawas urusan wakaf, maka perlu merujuk ke Kementerian Wakaf dan mempertimbangkan instruksi hukum serta administratif yang mengatur hal ini."
