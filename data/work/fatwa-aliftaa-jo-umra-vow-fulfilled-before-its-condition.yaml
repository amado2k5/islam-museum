id: work/fatwa-aliftaa-jo-umra-vow-fulfilled-before-its-condition
class: work
kind: fatwa
label: { ar: "أداء عمرة منذورة قبل تحقق شرط النذر", en: "Performing a vowed umrah before the vow's condition is met", ur: "نذر کی شرط پوری ہونے سے پہلے نذر کا عمرہ ادا کرنا", es: "Realizar una umrah prometida antes de que se cumpla la condición del voto.", fr: "Accomplir une omra promise avant que la condition du vœu ne soit remplie", tr: "Yeminin şartını yerine getirmeden önce yemin etmek", id: "Melaksanakan Umrah Sumpah sebelum memenuhi syarat sumpah" }
summary:
  ar: "سؤال عمن نذر عمرة إن حصل على مبلغ مستحق، ثم اعتمر قبل حصوله عليه، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأحوط انتظار تحقق الشرط، وأن من فعل المنذور قبله وتعذرت عليه الإعادة تبرأ ذمته على مذهب الحنابلة. أجابت الدائرة بأن النذر التزام قربة غير واجبة بالشرع، فإذا انعقد لزم الوفاء به، وأن العلماء اختلفوا في تقديم الوفاء بالنذر المعلق قبل تحقق شرطه. فالشافعية أجازوا تقديم النذر المالي دون البدني، والحج والعمرة عندهم من البدني، ونقلت عن زكريا الأنصاري في أسنى المطالب، وعن إمام الحرمين الجويني في نهاية المطلب أن النيابة في الحج رخصة للضرورة. والحنفية قالوا إن ما أُدي قبل الشرط يكون نفلًا وتلزم الإعادة، ونقلت عن الشرنبلالي في مراقي الفلاح، والحنابلة أجازوا التقديم، ونقلت عن البهوتي في كشاف القناع. وخلصت إلى أن الأحوط أن ينتظر الناذر تحقق الشرط لتبرأ ذمته بالإجماع، فإن كان قد فعل المنذور قبله وتعذرت عليه الإعادة فلا مانع من الحكم ببراءة ذمته بناء على مذهب الحنابلة."
  en: "A question from someone who vowed an umrah if he received money owed to him and then performed it before receiving the money, in which Jordan's General Iftaa Department answered that the safer course is to wait for the condition, and that someone who acted early and cannot repeat the act is discharged on the Hanbali view. The Department answered that a vow is a commitment to an act of devotion the sharia does not require, which must be fulfilled once made, and that scholars differ on fulfilling a conditional vow before its condition is met. The Shafi'is allow a financial vow to be fulfilled early but not a bodily one, and count hajj and umrah as bodily, quoting Zakariyya al-Ansari's Asna al-Matalib, and Imam al-Haramayn al-Juwayni's Nihayat al-Matlab that proxy hajj is a concession for necessity. The Hanafis hold that what is done before the condition is voluntary and must be repeated, quoting al-Shurunbulali's Maraqi al-Falah, while the Hanbalis allow early fulfilment, quoting al-Buhuti's Kashshaf al-Qina'. It concluded that the safer course is for the person to wait until the condition is met, so that he is discharged by consensus, but if he has already performed the vowed act and cannot repeat it, he may be judged discharged on the Hanbali view."
  ur: "ایک شخص کا سوال جس نے نذر مانی کہ اگر اسے واجب الادا رقم ملی تو عمرہ کرے گا، پھر رقم ملنے سے پہلے عمرہ کر لیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ احتیاط شرط پوری ہونے کا انتظار کرنے میں ہے، اور جس نے پہلے ادا کر دیا اور دوبارہ نہ کر سکے وہ حنابلہ کے مذہب پر بری الذمہ ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ نذر ایسی عبادت کا التزام ہے جو شریعت نے واجب نہیں کی، اور منعقد ہونے کے بعد اسے پورا کرنا لازم ہے، اور علماء میں اختلاف ہے کہ معلق نذر شرط سے پہلے ادا ہو سکتی ہے یا نہیں۔ شافعیہ مالی نذر کو پہلے ادا کرنے کی اجازت دیتے ہیں، بدنی کو نہیں، اور حج و عمرہ کو بدنی شمار کرتے ہیں؛ اس نے زکریا الانصاری کی اسنی المطالب سے، اور امام الحرمین الجوینی کی نہایۃ المطلب سے نقل کیا کہ حج میں نیابت ضرورت کی رخصت ہے۔ حنفیہ کہتے ہیں کہ شرط سے پہلے کیا گیا عمل نفل ہے اور دوبارہ لازم ہے، اور اس نے شرنبلالی کی مراقی الفلاح سے نقل کیا، جبکہ حنابلہ پہلے ادا کرنے کی اجازت دیتے ہیں، اور اس نے بہوتی کی کشاف القناع سے نقل کیا۔ اس نے نتیجہ نکالا کہ احتیاط یہ ہے کہ نذر ماننے والا شرط پوری ہونے کا انتظار کرے تاکہ بالاجماع بری الذمہ ہو، لیکن اگر وہ پہلے ادا کر چکا ہو اور دوبارہ نہ کر سکے تو حنابلہ کے مذہب پر اسے بری الذمہ قرار دینے میں حرج نہیں۔"
  es: "Una persona que había prometido realizar la umrah si recibía dinero que se le debía y luego la realizaba antes de recibirlo, fue consultada por el Departamento General de Iftaa de Jordania, quien respondió que lo más seguro es esperar a que se cumpla la condición, y que quien actuó antes de tiempo y no puede repetir el acto queda eximido de la obligación según la visión hanbalí. El Departamento explicó que un voto es un compromiso con un acto de devoción que la sharia no exige, el cual debe cumplirse una vez realizado, y que los eruditos difieren sobre el cumplimiento de un voto condicional antes de que se cumpla su condición. Los shafiíes permiten que un voto financiero se cumpla antes de tiempo, pero no uno físico, y consideran el hajj y la umrah como actos físicos, citando el Asna al-Matalib de Zakariyya al-Ansari y el Nihayat al-Matlab del Imam al-Haramayn al-Juwayni, que establecen que el hajj por poder es una concesión por necesidad. Los hanafíes sostienen que lo que se hace antes de que se cumpla la condición es voluntario y debe repetirse, citando el Maraqi al-Falah de al-Shurunbulali, mientras que los hanbalíes permiten el cumplimiento anticipado, citando el Kashshaf al-Qina' de al-Buhuti. Concluyeron que lo más seguro es que la persona espere hasta que se cumpla la condición, para que quede liberada por consenso; pero si ya ha realizado el acto prometido y no puede repetirlo, puede ser considerada liberada según la visión hanbalí."
  fr: "Une personne ayant fait vœu d'accomplir la umra demandait si elle devait recevoir une somme d'argent avant de l'avoir perçue. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu qu'il était plus prudent d'attendre la réalisation de la condition requise et que, selon l'école hanbalite, celui qui agit prématurément et ne peut renouveler son vœu est libéré de son obligation. Le Département a expliqué qu'un vœu est un engagement à un acte de dévotion non exigé par la charia, qui doit être accompli une fois formulé. Les savants divergent quant à l'accomplissement d'un vœu conditionnel avant que sa condition ne soit remplie. Les chaféites autorisent l'accomplissement anticipé d'un vœu financier, mais pas d'un vœu d'engagement corporel, et considèrent le hajj et la umra comme des pèlerinages corporels. Ils citent l'ouvrage Asna al-Matalib de Zakariyya al-Ansari et le Nihayat al-Matlab de l'imam al-Haramayn al-Juwayni, selon lesquels le hajj par procuration est une dérogation accordée en cas de nécessité. Les hanafites considèrent que l'acte accompli avant la réalisation de la condition est volontaire et doit être répété, citant le Maraqi al-Falah d'al-Shurunbulali, tandis que les hanbalites autorisent son accomplissement anticipé, citant le Kashshaf al-Qina' d'al-Buhuti. Il en ressort que la solution la plus sûre est d'attendre que la condition soit remplie, afin d'être libérée par consensus. Cependant, si l'acte promis a déjà été accompli et qu'il est impossible de le répéter, la libération peut être prononcée selon l'école hanbalite."
  tr: "Umre yemin eden, uygun miktarda alıp umre almadan önce kılan birine ilişkin bir soruya ise, Ürdün Genel Fetva Dairesi, şartın yerine getirilmesini beklemenin daha temkinli olduğunu, yemin eden ve tekrarlayamayan kişinin Hanbali okuluna göre yerine getirildiğini yanıtladı. Bölüm, yeminin İslam hukukuna göre zorunlu olmayan bir ibadet bağlılığı olduğunu, eğer tamamlanırsa yerine getirilmesi gerektiğini yanıtladı. Alimler, askıya alınmış bir yemin koşulu yerine getirilmeden önce yerine getirilmesini önceliklendirme konusunda farklı görüşlere sahiptir. Şafi'lere maddi yemin sunma hakkı fiziksel değil, hac ve umre ise onlar için fiziksel olarak kabul edilir. Asna al-Matalib'de Zekeriye el-Ensari ve İmam el-Haramyn el-Cuveyni'den tartışmanın sonunda Hac zamanı vekaletin zorunluluktan kaynaklanan bir taviz olduğunu aktardılar. Hanafiler, şart öncesinde yapılanın gönüllü kabul edildiğini ve tekrarlanması gerektiğini söylediler. Maraqi Al-Falah'ta Al-Sharnibalali'den rapor verdim, Hanbaliler öncelik hakkı verdi ve Al-Buhuti'den alıntı yaptım. Onlar, sorumluluğunun uzlaşmayla temizlenmesi için koşulun yerine getirilmesini beklemenin daha akıllıca olduğunu sonucuna vardılar. Eğer yemini kendisinden önce yaptıysa ve tekrarlaması imkânsızsa, Hanbali okuluna göre tahliye edilmesine itiraz yoktur."
  id: "Sebuah pertanyaan tentang seseorang yang bersumpah untuk melaksanakan Umrah jika menerima jumlah yang tepat dan kemudian melaksanakan Umrah sebelum menerimanya, Departemen Fatwa Umum Yordania menjawab bahwa lebih berhati-hati menunggu syarat terpenuhi, dan siapa pun yang mengucapkan sumpah sebelum dan tidak dapat mengulanginya akan dilaksanakan sesuai mazhab Hanbali. Departemen menjawab bahwa sumpah tersebut adalah komitmen untuk beribadah yang tidak wajib menurut hukum Islam, dan jika telah diselesaikan, harus dipenuhi. Para ulama berbeda pendapat tentang memprioritaskan pemenuhan janji yang ditangguhkan sebelum syaratnya terpenuhi. Syafi'i mengizinkan menyampaikan sumpah keuangan daripada yang fisik, dan Haji serta Umrah dianggap fisik bagi mereka. Mereka mengutip Zakariya Al-Ansari dalam Asna al-Matalib dan Imam al-Haramayn al-Juwayni di akhir diskusi bahwa proxy dalam Haji adalah konsesi karena kebutuhan. Hanafi mengatakan bahwa apa yang dilakukan sebelum kondisi tersebut dianggap sukarela dan harus diulang. Saya melaporkan dari Al-Sharnibalali dalam Maraqi Al-Falah, dan Hanbalis mengizinkan prioritas, dan saya mengutip dari Al-Buhuti dalam Kashshaf Al-Qina'. Mereka menyimpulkan bahwa lebih bijaksana jika sumpah menunggu syarat itu dipenuhi untuk membersihkan tanggung jawabnya melalui konsensus. Jika dia sudah mengucapkan sumpah itu sebelumnya dan tidak mungkin mengulangnya, tidak ada keberatan untuk memutuskan pembebasan berdasarkan aliran Hanbali."
