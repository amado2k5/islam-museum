id: work/fatwa-aliftaa-jo-umra-vow-fulfilled-before-its-condition
class: work
kind: fatwa
label: { ar: "أداء عمرة منذورة قبل تحقق شرط النذر", en: "Performing a vowed umrah before the vow's condition is met", ur: "نذر کی شرط پوری ہونے سے پہلے نذر کا عمرہ ادا کرنا" }
summary:
  ar: "سؤال عمن نذر عمرة إن حصل على مبلغ مستحق، ثم اعتمر قبل حصوله عليه، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأحوط انتظار تحقق الشرط، وأن من فعل المنذور قبله وتعذرت عليه الإعادة تبرأ ذمته على مذهب الحنابلة. أجابت الدائرة بأن النذر التزام قربة غير واجبة بالشرع، فإذا انعقد لزم الوفاء به، وأن العلماء اختلفوا في تقديم الوفاء بالنذر المعلق قبل تحقق شرطه. فالشافعية أجازوا تقديم النذر المالي دون البدني، والحج والعمرة عندهم من البدني، ونقلت عن زكريا الأنصاري في أسنى المطالب، وعن إمام الحرمين الجويني في نهاية المطلب أن النيابة في الحج رخصة للضرورة. والحنفية قالوا إن ما أُدي قبل الشرط يكون نفلًا وتلزم الإعادة، ونقلت عن الشرنبلالي في مراقي الفلاح، والحنابلة أجازوا التقديم، ونقلت عن البهوتي في كشاف القناع. وخلصت إلى أن الأحوط أن ينتظر الناذر تحقق الشرط لتبرأ ذمته بالإجماع، فإن كان قد فعل المنذور قبله وتعذرت عليه الإعادة فلا مانع من الحكم ببراءة ذمته بناء على مذهب الحنابلة."
  en: "A question from someone who vowed an umrah if he received money owed to him and then performed it before receiving the money, in which Jordan's General Iftaa Department answered that the safer course is to wait for the condition, and that someone who acted early and cannot repeat the act is discharged on the Hanbali view. The Department answered that a vow is a commitment to an act of devotion the sharia does not require, which must be fulfilled once made, and that scholars differ on fulfilling a conditional vow before its condition is met. The Shafi'is allow a financial vow to be fulfilled early but not a bodily one, and count hajj and umrah as bodily, quoting Zakariyya al-Ansari's Asna al-Matalib, and Imam al-Haramayn al-Juwayni's Nihayat al-Matlab that proxy hajj is a concession for necessity. The Hanafis hold that what is done before the condition is voluntary and must be repeated, quoting al-Shurunbulali's Maraqi al-Falah, while the Hanbalis allow early fulfilment, quoting al-Buhuti's Kashshaf al-Qina'. It concluded that the safer course is for the person to wait until the condition is met, so that he is discharged by consensus, but if he has already performed the vowed act and cannot repeat it, he may be judged discharged on the Hanbali view."
  ur: "ایک شخص کا سوال جس نے نذر مانی کہ اگر اسے واجب الادا رقم ملی تو عمرہ کرے گا، پھر رقم ملنے سے پہلے عمرہ کر لیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ احتیاط شرط پوری ہونے کا انتظار کرنے میں ہے، اور جس نے پہلے ادا کر دیا اور دوبارہ نہ کر سکے وہ حنابلہ کے مذہب پر بری الذمہ ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ نذر ایسی عبادت کا التزام ہے جو شریعت نے واجب نہیں کی، اور منعقد ہونے کے بعد اسے پورا کرنا لازم ہے، اور علماء میں اختلاف ہے کہ معلق نذر شرط سے پہلے ادا ہو سکتی ہے یا نہیں۔ شافعیہ مالی نذر کو پہلے ادا کرنے کی اجازت دیتے ہیں، بدنی کو نہیں، اور حج و عمرہ کو بدنی شمار کرتے ہیں؛ اس نے زکریا الانصاری کی اسنی المطالب سے، اور امام الحرمین الجوینی کی نہایۃ المطلب سے نقل کیا کہ حج میں نیابت ضرورت کی رخصت ہے۔ حنفیہ کہتے ہیں کہ شرط سے پہلے کیا گیا عمل نفل ہے اور دوبارہ لازم ہے، اور اس نے شرنبلالی کی مراقی الفلاح سے نقل کیا، جبکہ حنابلہ پہلے ادا کرنے کی اجازت دیتے ہیں، اور اس نے بہوتی کی کشاف القناع سے نقل کیا۔ اس نے نتیجہ نکالا کہ احتیاط یہ ہے کہ نذر ماننے والا شرط پوری ہونے کا انتظار کرے تاکہ بالاجماع بری الذمہ ہو، لیکن اگر وہ پہلے ادا کر چکا ہو اور دوبارہ نہ کر سکے تو حنابلہ کے مذہب پر اسے بری الذمہ قرار دینے میں حرج نہیں۔"
