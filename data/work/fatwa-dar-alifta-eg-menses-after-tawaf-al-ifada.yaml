id: work/fatwa-dar-alifta-eg-menses-after-tawaf-al-ifada
class: work
kind: fatwa
label: { ar: "حكم من طافت طواف الإفاضة ثم رأت دم الحيض", en: "She completed tawaf al-ifada then saw menstrual blood", ur: "طوافِ افاضہ کے بعد حیض دیکھنے والی عورت" }
summary:
  ar: "سائل سأل عن امرأة طافت طواف الإفاضة ثم رأت دم الحيض بعد الانتهاء من أدائها له. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21015)⁩ أن طوافها صحيح مجزئ سواء تيقنت موضع الدم أم لم تتيقن على ما فصّل الجواب."
  en: "A questioner asked about a woman who performed tawaf al-ifada then saw menstrual blood after finishing it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21015) answered that her tawaf is valid and suffices, whether she is certain of the blood's timing or not — as the answer details."
  ur: "ایک سائل نے اس عورت کے بارے میں پوچھا جس نے طوافِ افاضہ کیا پھر مکمل ہونے کے بعد حیض کا خون دیکھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21015)⁩ نے جواب دیا کہ اس کا طواف صحیح اور کافی ہے خواہ خون کے وقت کو یقینی جانے یا نہ جانے — جیسا کہ جواب میں تفصیل ہے۔"
