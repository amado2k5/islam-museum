label: { ar: "رسالة الشقندي في تفضيل الأندلس على بر العدوة", en: "al-Shaqundi's Epistle on the Excellence of al-Andalus over the Farther Shore", es: "Epístola de al-Shaqundi sobre la excelencia de al-Ándalus en la costa lejana.", fr: "Épître d'al-Shaqundi sur l'excellence d'al-Andalus au-delà de la rive opposée", ur: "الشقندی کا خط بعید ساحل پر الندلس کی فضیلت پر", tr: "El-Şaqandi'nin Düşmanın Toprağına Karşı Endülüs'ün Tercihi üzerine İnceleme", id: "Risalah Al-Shaqandi tentang Preferensi Al-Andalus dibandingkan Tanah Musuh" }
summary:
  ar: "رسالة أدبية للشقندي في تفضيل الأندلس وأهلها على بر العدوة، تعد من أشهر نصوص الفخر الأندلسي؛ يستشهد بها المقري في نفح الطيب في وصف قرطبة وإشبيلية وغرناطة ومدن الأندلس وعلمائها، ومن مذاهبها قوله في غرناطة إنها دمشق بلاد الأندلس ومسرح الأبصار ومطمح الأنفس، وذكره اعتدال هواء إشبيلية وعذوبة مائها {cite:nafh-tib-maqqari p. 612-613}."
  en: "al-Shaqundi's celebrated epistle ranking al-Andalus above the farther shore — one of the most famous pieces of Andalusi pride literature, quoted by al-Maqqari throughout Nafh al-Tib on Cordoba, Seville, Granada and the country's scholars {cite:nafh-tib-maqqari p. 612-613}."
  es: "La célebre epístola de al-Shaqundi que sitúa a al-Ándalus por encima de la otra orilla, citada por al-Maqqari a lo largo de Nafh al-Tib sobre Córdoba, Sevilla, Granada y los eruditos del país {cite:nafh-tib-maqqari p. 612-613}."
  fr: "La célèbre épître d'al-Shaqundi classant al-Andalus au-dessus de la rive opposée — citée par al-Maqqari tout au long de Nafh al-Tib sur Cordoue, Séville, Grenade et les érudits du pays {cite:nafh-tib-maqqari p. 612-613}."
  ur: "الشقندی کے مشہور خط کی درجہ بندی الاندلس کو ساحل سے اوپر ہے - اندلس کے قابل فخر ادب کے سب سے مشہور ٹکڑوں میں سے ایک، المقاری نے قرطبہ، سیویل، غرناطہ اور ملک کے علما نے نفح الطب میں نقل کیا ہے۔ 612-613}۔"
  tr: "Al-Shaqqandi'nin Al-Endülüs ve halkını Al-Adwa topraklarına tercih eden edebi bir risalesi, Endülüs gururunun en ünlü metinlerinden biri olarak kabul edilir; Al-Maqri tarafından Nafh al-Tib'de Cordoba, Sevilla, Granada şehirleri ve Al-Andalus'un şehirleri ile alimleri ve okulları arasında Granada'nın Şam, el-Endülüs'ün ülkesi, görme tiyatrosu ve ruhun hırsı olduğu yönündeki ifadesi yer alır; Sevilla'nın ılıman havası ve suyunun tazeliğinden bahseder {cite:nafh-tib-maqqari, s. 612-613}."
  id: "Sebuah risalah sastra oleh Al-Shaqqandi yang lebih memilih Al-Andalus dan penduduknya daripada tanah Al-Adwa, dianggap sebagai salah satu teks kebanggaan Andalusia yang paling terkenal; dikutip oleh Al-Maqri dalam Nafh al-Tib dalam menggambarkan Cordoba, Sevilla, Granada, kota-kota dan ulama Al-Andalus, serta di antara sekolahnya adalah pernyataannya tentang Granada bahwa itu adalah Damaskus, tanah al-Andalus, teater penglihatan, dan ambisi jiwa, menyebutkan udara Sevilla yang sedang dan kesegaran airnya {cite:nafh-tib-maqqari, hlm. 612-613}."
