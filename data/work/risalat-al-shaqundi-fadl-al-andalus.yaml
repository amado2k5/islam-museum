summary:
  ar: "رسالة أدبية للشقندي في تفضيل الأندلس وأهلها على بر العدوة، تعد من أشهر نصوص الفخر الأندلسي؛ يستشهد بها المقري في نفح الطيب في وصف قرطبة وإشبيلية وغرناطة ومدن الأندلس وعلمائها، ومن مذاهبها قوله في غرناطة إنها دمشق بلاد الأندلس ومسرح الأبصار ومطمح الأنفس، وذكره اعتدال هواء إشبيلية وعذوبة مائها {cite:nafh-tib-maqqari p. 612-613}."
  en: "al-Shaqundi's celebrated epistle ranking al-Andalus above the farther shore — one of the most famous pieces of Andalusi pride literature, quoted by al-Maqqari throughout Nafh al-Tib on Cordoba, Seville, Granada and the country's scholars {cite:nafh-tib-maqqari p. 612-613}."
  es: "La célebre epístola de al-Shaqundi que sitúa a al-Ándalus por encima de la otra orilla, citada por al-Maqqari a lo largo de Nafh al-Tib sobre Córdoba, Sevilla, Granada y los eruditos del país {cite:nafh-tib-maqqari p. 612-613}."
  fr: "La célèbre épître d'al-Shaqundi classant al-Andalus au-dessus de la rive opposée — citée par al-Maqqari tout au long de Nafh al-Tib sur Cordoue, Séville, Grenade et les érudits du pays {cite:nafh-tib-maqqari p. 612-613}."
