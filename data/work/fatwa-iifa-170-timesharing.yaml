label: { ar: "قرار مجمع الفقه الإسلامي الدولي 170 (18/8) بشأن عقد التملك الزمني ⁦(TIME SHARING)⁩", en: "IIFA resolution 170 (18/8) on the time-sharing ownership contract", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 170 (18/8): ٹائم شیئرنگ ⁦(وقت کے اشتراک سے تملک)⁩ کا عقد", es: "Resolución 170 (18/8) de la IIFA sobre el contrato de propiedad compartida.", fr: "Résolution 170 (18/8) de l'IIFA relative au contrat de propriété à temps partagé", tr: "Uluslararası İslami Fiqh Akademisi Kararı 170 (18/8) ZAMAN PAYLAŞİMİ Sözleşmesi ile ilgili", id: "Keputusan Akademi Fiqh Islam Internasional 170 (18/8) mengenai Kontrak TIME SHARING" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف التملك الزمني المشترك بأنه عقد على تملك حصص شائعة إما شراءً لعين معلومة على الشيوع أو استئجارًا لمنافع عين معلومة لمدد متعاقبة يُنتفع بها بالمهايأة الزمانية أو المكانية مع خيار التعيين بفترة محددة في بعض الحالات. وقسمه إلى تملك تام للعين والمنفعة بشراء حصة شائعة للبيع، وتملك ناقص للمنفعة فقط باستئجار حصة شائعة بعقد الإجارة. وقرر جواز شراء حصة مشاعة في عين واستئجار حصة مشاعة في منفعة محددة لمدة مع الاتفاق على الانتفاع بالمهايأة، وتناول ضوابط النقل والتداول بين الشركاء والرسوم والتنازل وما يتعلق بالحقوق المشتركة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined shared temporal ownership as a contract over undivided shares — either buying an undivided share in a known asset or leasing the usufruct of a known asset for successive periods, the benefit being divided between the parties by time or place allocation, with an option of fixed assignment in some cases. It distinguished full ownership of asset and usufruct by buying an undivided share under a sale contract from deficient ownership of the usufruct only by leasing an undivided share under an ijara. It ruled that buying an undivided share in an asset and leasing an undivided share in a defined usufruct for a period with agreed time-sharing of use is permissible, and addressed controls for transfer, trading among partners, fees, assignment and common rights."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے وقت کے اشتراک سے تملک کی تعریف کی: شائع حصوں کا عقد — کسی معلوم عین کا شائع حصہ خریدنا یا کسی معلوم عین کے منافع مسلسل مدتوں کے لیے کرائے پر لینا، جس میں فائدہ وقت یا جگہ کی بانٹ سے اٹھایا جائے اور بعض صورتوں میں طے شدہ مدت کا اختیار بھی ہو۔ اس نے اسے دو میں تقسیم کیا: عین و منفعت کی مکمل تملک — بیع کے عقد سے شائع حصے کی خرید کے ذریعے؛ اور صرف منفعت کی ناقص تملک — اجارہ کے عقد سے شائع حصے کے کرائے کے ذریعے۔ فیصلہ: عین میں شائع حصہ خریدنا اور طے شدہ منفعت میں شائع حصہ مدت کے لیے کرائے پر لینا مع اتفاقِ مہایئہ جائز ہے؛ اور ساتھیوں کے درمیان منتقلی، تجارت، فیس، حوالگی اور مشترک حقوق کے ضوابط بھی بیان ہوئے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Definió la propiedad temporal compartida como un contrato sobre participaciones indivisas, ya sea la compra de una participación indivisa en un bien conocido o el arrendamiento del usufructo de un bien conocido por períodos sucesivos, dividiéndose el beneficio entre las partes por asignación temporal o espacial, con opción de cesión fija en algunos casos. Distinguió la plena propiedad del bien y el usufructo mediante la compra de una participación indivisa en virtud de un contrato de compraventa de la propiedad deficiente del usufructo únicamente mediante el arrendamiento de una participación indivisa en virtud de un contrato de ijara. Dictaminó que la compra de una participación indivisa en un bien y el arrendamiento de una participación indivisa en un usufructo definido por un período con un régimen de uso compartido acordado es permisible, y abordó los controles para la transferencia, el comercio entre socios, las tarifas, la cesión y los derechos comunes."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, soit du 9 au 14 juillet 2007) définit la propriété temporelle partagée comme un contrat portant sur des parts indivises: soit l'achat d'une part indivise d'un bien connu, soit la location de l'usufruit d'un bien connu pour des périodes successives, le bénéfice étant réparti entre les parties selon une allocation temporelle ou spatiale, avec une option de cession définitive dans certains cas. Elle distingue la pleine propriété du bien et de l'usufruit, acquise par l'achat d'une part indivise dans le cadre d'un contrat de vente, de la propriété partielle de l'usufruit, obtenue par la location d'une part indivise dans le cadre d'un contrat d'ijara. Elle statue que l'achat d'une part indivise d'un bien et la location d'une part indivise d'un usufruit défini pour une période déterminée, avec un partage temporel d'utilisation convenu, sont permis. Elle aborde également les règles relatives au transfert, aux échanges entre associés, aux honoraires, aux cessions et aux droits communs."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Putrajaya'daki on sekizinci oturumunda (24–29 Jumada al-Akhirah 1428 H, 9–14 Temmuz 2007) toplu kararı olarak kabul edilmiştir. Ortak geçici mülkiyet, bilinen bir hissenin satın alınması veya ardışık dönemler için bilinen belirli bir hissenin kiralanması, belirli bir payın zamansal veya mekânsal ayarlama yoluyla faydalanması, bazı durumlarda belirli bir süre için belirlenme seçeneğiyle ortak hisse sahipliği sözleşmesi olarak tanımlanmıştır. Mülkiyeti tam mülkiyet ve ortak hisse satın alarak fayda olarak ikiye ayrılmıştır; kısmi mülkiyet ise kira sözleşmesi kapsamında ortak hisse kiralanmıştır. Bir varlıkta ortak hisse satın almanın ve belirli bir faydada ortak hisse kiralamanın belirli bir süre için izin verildiğine, paydan yararlanma anlaşması ile ortaklar arasındaki devr-takas, ücretler, devretme ve ortak haklarla ilgili düzenlemelerin ele alınmasına karar vermiştir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sidang kedelapan belas di Putrajaya (24–29 Jumada al-Akhirah 1428 H, 9–14 Juli 2007). Kepemilikan temporal bersama didefinisikan sebagai kontrak kepemilikan saham biasa, baik pembelian saham yang diketahui atau sewa saham spesifik yang diketahui untuk periode berturut-turut, dengan keuntungan melalui penyesuaian temporal atau spasial, dengan opsi penetapan untuk periode tertentu dalam beberapa kasus. Keputusan ini membaginya menjadi kepemilikan penuh atas properti dan manfaat dengan membeli saham bersama untuk dijual, dan kepemilikan sebagian hanya untuk manfaat dengan menyewakan saham bersama berdasarkan kontrak sewa. Keputusan diputuskan bahwa diperbolehkan membeli saham biasa dalam suatu aset dan menyewakan saham biasa dalam manfaat tertentu untuk jangka waktu tertentu, dengan kesepakatan untuk memperoleh manfaat dari saham tersebut, serta mengatur peraturan transfer dan pertukaran antar mitra, biaya, pengalihan, dan hak bersama yang terkait."
