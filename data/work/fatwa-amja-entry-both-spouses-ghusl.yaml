id: work/fatwa-amja-entry-both-spouses-ghusl
class: work
kind: fatwa
label: { ar: "الإيلاج يوجب الغسل على الزوجين", en: "Entry alone — the washing binds both spouses", ur: "دخول — دونوں پر غسل", es: "La entrada sola —el lavado vincula a ambos cónyuges", fr: "L'entrée seule — le lavage lie les deux époux", tr: "Penetrasyon, kocaların ghusl (ritüel banyo) yapmasını gerektirir", id: "Penetrasi mengharuskan suami melakukan ghusl (mandi ritual)" }
summary:
  ar: "سألت امرأة سؤالًا عن الجنابة بين الزوجين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78613 بتاريخ 21 أبريل 2009)⁩ أن الغسل يجب بالإنزال ولو بغير إيلاج وبالإيلاج ولو بغير إنزال فإذا أولج زوجها فقد وجب الغسل على كليهما سواء أنزل أم لم ينزل وسواء أنزلت هي أم لم تنزل على ما فصّل الجواب."
  en: "A woman asked a precise question on the spouses' janaba. Dr. Salah al-Sawi (fatwa no. 78613, 21 April 2009) answered that the washing binds on emission even without entry, and on entry even without emission; if her husband entered, the washing binds them both whether he emitted or not and whether she did or not — as the answer details."
  ur: "دخول کے بغیر انزال پر بھی غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78613، 21 اپریل 2009)⁩ کے مطابق دخول پر دونوں پر غسل واجب چاہے انزال ہو یا نہ ہو۔"
  es: "Una mujer formuló una pregunta precisa sobre el janaba de los cónyuges. El Dr. Salah al-Sawi (fatwa n.º 78613, 21 de abril de 2009) respondió que el lavado obliga a ambos en caso de eyaculación, incluso sin eyaculación, y en caso de eyaculación, incluso sin eyaculación; si su esposo eyaculó, el lavado los obliga a ambos, independientemente de si él eyaculó o no, y de si ella lo hizo o no, como se detalla en la respuesta."
  fr: "Une femme a posé une question précise concernant la janaba des époux. Le Dr Salah al-Sawi (fatwa n° 78613, 21 avril 2009) a répondu que les ablutions sont obligatoires, que ce soit lors de l'émission des selles, même sans entrée, ou lors de l'entrée, même sans émission. Si son mari entre, les ablutions les lient tous deux, qu'il ait éjaculé ou non, et qu'elle ait éjaculé ou non – comme le précise la réponse."
  tr: "Bir kadına eşler arasında jabebe hakkında bir soru soruldu. Dr. Salah Al-Sawi (21 Nisan 2009 tarihli 78613 No'lu Fetva) cevabında hüslün ejabah sırasında zorunlu olduğunu, penetrasyon olmasa bile, boşalma olmasa bile. Eğer kocası cinsel ilişkiye girerse, cevabda açıklandığı gibi, kocası cinsel ilişkiye girse de, her ikisi için de zorunludur; kadın inip gelmese de bu cevapta açıklanmıştır."
  id: "Seorang wanita ditanya tentang janabah antara pasangan. Dr. Salah Al-Sawi menjawab (Fatwa No. 78613 tanggal 21 April 2009) bahwa ghusl wajib dilakukan pada ejabah, meskipun tanpa penetrasi, dan bahkan jika itu bukan ejakulasi. Jika suaminya melakukan hubungan seksual, maka ghusl wajib bagi keduanya, baik dia turun atau tidak, dan apakah dia turun atau tidak, seperti yang dijelaskan dalam jawaban."
