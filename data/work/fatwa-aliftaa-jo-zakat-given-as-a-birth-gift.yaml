id: work/fatwa-aliftaa-jo-zakat-given-as-a-birth-gift
class: work
kind: fatwa
label: { ar: "إعطاء الزكاة نقوطًا للولادة", en: "Giving zakat as a birth gift", ur: "زکوٰۃ کو ولادت کے تحفے کے طور پر دینا" }
summary:
  ar: "سؤال عن إعطاء صديقة محتاجة زكاة المال على أنها نقوط لولادتها، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك يجوز إذا كانت لا تملك ما يكفيها وليست مكفية بنفقة من تجب عليه نفقتها. أجابت الدائرة بأن الزكاة حق واجب في المال بشروطه، تُعطى للأصناف الثمانية المذكورة في القرآن. وعرّفت النقوط بأنه ما يُهدى من المال وغيره في الأفراح والمناسبات، والمتجه أنه هبة لصاحب المناسبة لا قرض يُسترد، ونقلت ذلك عن ابن حجر الهيتمي. وخلصت إلى أن الصديقة إن كانت لا تملك ما يكفيها وليست مكفية بنفقة من تجب نفقتها عليه، جاز إعطاؤها النقوط واحتسابه من الزكاة."
  en: "A question on giving zakat to a friend in need in the form of a birth gift, in which Jordan's General Iftaa Department answered that this is allowed if the friend lacks enough for her needs and is not provided for by someone obliged to maintain her. The Department answered that zakat is a right due on wealth under its conditions, given to the eight categories named in the Qur'an. It defined nuqut as money or other things given at celebrations and occasions, and said the sounder view is that it is a gift to the person celebrating, not a loan to be returned, quoting Ibn Hajar al-Haytami. It concluded that if the friend lacks enough for her needs and is not provided for by someone obliged to maintain her, the gift may be given and counted as zakat."
  ur: "کسی ضرورت مند سہیلی کو ولادت کے تحفے کی صورت میں زکوٰۃ دینے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے اگر سہیلی کے پاس بقدرِ کفایت مال نہ ہو اور جس پر اس کا نفقہ واجب ہے وہ اس کی کفالت نہ کر رہا ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ اپنی شرائط کے ساتھ مال میں واجب حق ہے، جو قرآن میں مذکور آٹھ مصارف کو دی جاتی ہے۔ اس نے نقوط کی تعریف کی کہ یہ خوشی اور مواقع پر دیا جانے والا مال یا دوسری چیزیں ہیں، اور کہا کہ راجح یہ ہے کہ یہ صاحبِ تقریب کو ہبہ ہے، واپس لیا جانے والا قرض نہیں، اور یہ ابن حجر الہیتمی سے نقل کیا۔ اس نے نتیجہ نکالا کہ اگر سہیلی کے پاس بقدرِ کفایت مال نہ ہو اور جس پر اس کا نفقہ واجب ہے وہ اس کی کفالت نہ کر رہا ہو، تو اسے یہ تحفہ دے کر زکوٰۃ میں شمار کیا جا سکتا ہے۔"
