label: { ar: "تغيير الجنس", en: "Changing one's sex — the fiqh academy's ruling", ur: "جنس کی تبدیلی — مجمع فقہ کا فیصلہ", es: "Cambiar de sexo: la decisión de la academia de fiqh", fr: "Changer de sexe: la décision de l’académie de jurisprudence islamique", tr: "cinsiyet değişikliği", id: "perubahan jenis kelamin" }
summary:
  ar: "سأل سائل عن حكم تغيير الجنس في الإسلام. أجاب د. حاتم الحاج ⁦(فتوى رقم 21840 بتاريخ 28 مايو 2006)⁩ بإحالته إلى فتوى مجمع الفقه الإسلامي التابع لرابطة العالم الإسلامي الصادرة في دورته الحادية عشرة بمكة المكرمة من 13 إلى 20 رجب 1409هـ فبراير 1989م، وأورد نصها في الجواب على ما يقرره المجمع في المسألة."
  en: "A questioner asked the ruling on changing one's sex in Islam. Dr. Hatim al-Hajj (fatwa no. 21840, 28 May 2006) referred him to the fatwa of the Islamic Fiqh Academy of the Muslim World League issued at its eleventh session in Mecca, 13–20 Rajab 1409 AH (February 1989), reproducing its text with what the Academy resolves on the matter. Recorded as AMJA's answer."
  ur: "ایک سائل نے جنس تبدیلی کا حکم پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21840، 28 مئی 2006)⁩ نے رابطہ عالم اسلامی کے مجمع فقہ کے رجب 1409ہ کے فیصلے کی طرف رجوع کرایا۔"
  es: "Un consultante preguntó sobre la norma relativa al cambio de sexo en el Islam. El Dr. Hatim al-Hajj (fatwa n.º 21840, 28 de mayo de 2006) lo remitió a la fatwa de la Academia Islámica de Jurisprudencia Islámica de la Liga Mundial Musulmana, emitida en su undécima sesión en La Meca, del 13 al 20 de Rajab de 1409 AH (febrero de 1989), reproduciendo su texto con la resolución de la Academia sobre el tema. Esta respuesta de la AMJA quedó registrada."
  fr: "Un internaute a interrogé le Dr Hatim al-Hajj sur la question du changement de sexe en Islam. Le Dr Hatim al-Hajj (fatwa n° 21840, 28 mai 2006) l'a renvoyé à la fatwa de l'Académie de jurisprudence islamique de la Ligue islamique mondiale, émise lors de sa onzième session à La Mecque, du 13 au 20 Rajab 1409 AH (février 1989), et en a reproduit le texte, précisant la position de l'Académie sur ce sujet. Cette réponse a été consignée dans la notice de l'AMJA."
  tr: "İslam'da cinsiyet değişikliğiyle ilgili karar hakkında bir soru soruldu. Dr. Hatim Al-Hajj (28 Mayıs 2006 tarihli 21840 sayılı fetva) kendisini Müslüman Dünya Birliği'ne bağlı İslami Fıkıh Akademisi'nin 13-20 Rajab 1409 ve Şubat 1989 tarihlerinde Mekke'de yayımlanan on birinci oturumunda yayımlanan fetvasına yönlendirerek yanıtladı ve bu metnin Konsey'in bu konudaki kararına verdiği yanıta metnini dahil etti."
  id: "Seorang penanya ditanya tentang putusan perubahan gender dalam Islam. Dr. Hatim Al-Hajj menjawab (Fatwa No. 21840 tanggal 28 Mei 2006) dengan merujuk kepadanya pada fatwa Akademi Fiqh Islam yang berafiliasi dengan Muslim World League, yang dikeluarkan pada sidang kesebelasnya di Mekah dari 13 hingga 20 Rajab 1409 H dan Februari 1989 M, serta memasukkan teksnya dalam jawaban atas keputusan Dewan mengenai hal tersebut."
