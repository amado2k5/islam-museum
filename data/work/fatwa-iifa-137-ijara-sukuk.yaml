label: { ar: "قرار مجمع الفقه الإسلامي الدولي 137 (15/3) بشأن صكوك الإجارة", en: "IIFA resolution 137 (15/3) on ijara sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 137 (15/3): اجارہ صکوک" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. بيّن أن فكرة صكوك الإجارة تقوم على التصكيك ⁦(التسنيد/التوريق)⁩: إصدار أوراق مالية قابلة للتداول مبنية على مشروع استثماري يدر دخلًا، بتحويل الأعيان والمنافع المتعلقة بعقد الإجارة إلى صكوك تتداول في سوق ثانوية، وعرّفها بأنها سندات ذات قيمة متساوية تمثل حصصًا شائعة في ملكية أعيان أو منافع ذات دخل. وأكد أن صك الإجارة لا يمثل مبلغًا من النقود ولا دينًا على جهة بل ورقة مالية تمثل سهمًا شائعًا من ملكية عين استعمالية مؤجرة ⁦(عقار أو طائرة أو باخرة أو مجموعة أعيان)⁩. ثم ضبط أحكام إصدارها وتداولها وما يترتب على ملكيتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It explained that ijara sukuk rest on securitisation — issuing tradable financial instruments built on an income-yielding investment project — converting the assets and usufructs covered by an ijara contract into sukuk tradable on a secondary market, defining them as equal-value certificates representing undivided shares in the ownership of income-yielding assets or usufructs. The ijara sukuk, it stressed, represents neither a sum of money nor a debt on any party but a financial instrument representing an undivided share in the ownership of a leased usable asset (real estate, aircraft, ship, or a pool of such assets). It then regulated their issuance, trading and the consequences of owning them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے بیان کیا کہ اجارہ صکوک کا تصور تصکیک پر قائم ہے — آمدنی والے سرمایہ کاری منصوبے پر قابلِ تداول مالی دستاویزات کا اجرا — جس میں اجارہ عقد کے تحت آنے والی اعیان اور منافع صکوک میں بدل دی جاتی ہیں جو ثانوی بازار میں تجارت ہوں؛ اور تعریف کی: یکساں قیمت کی سندات جو آمدنی والی اعیان یا منافع کی ملکیت میں شائع حصوں کی نمائندگی کرتی ہیں۔ تاکید: اجارہ صک نہ نقد رقم کی نمائندگی کرتا ہے نہ کسی جہت کا قرض، بلکہ کرائے پر دی گئی استعمالی عین ⁦(جائیداد، طیارہ، جہاز یا ایسی اعیان کا مجموعہ)⁩ کی ملکیت میں شائع حصہ کی مالی دستاویز ہے۔ پھر اجرا، تجارت اور ملکیت کے اثرات کے ضوابط۔"
