label: { ar: "قرار مجمع الفقه الإسلامي الدولي 137 (15/3) بشأن صكوك الإجارة", en: "IIFA resolution 137 (15/3) on ijara sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 137 (15/3): اجارہ صکوک", es: "Resolución 137 (15/3) de la IIFA sobre ijara sukuk", fr: "Résolution 137 (15/3) de l'IIFA sur les sukuk ijara", tr: "Uluslararası İslami Fiqh Akademisi Kararı 137 (15/3) İcara Sukuk ile ilgili", id: "Resolusi Akademi Fiqh Islam Internasional 137 (15/3) mengenai Ijarah Sukuk" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. بيّن أن فكرة صكوك الإجارة تقوم على التصكيك ⁦(التسنيد/التوريق)⁩: إصدار أوراق مالية قابلة للتداول مبنية على مشروع استثماري يدر دخلًا، بتحويل الأعيان والمنافع المتعلقة بعقد الإجارة إلى صكوك تتداول في سوق ثانوية، وعرّفها بأنها سندات ذات قيمة متساوية تمثل حصصًا شائعة في ملكية أعيان أو منافع ذات دخل. وأكد أن صك الإجارة لا يمثل مبلغًا من النقود ولا دينًا على جهة بل ورقة مالية تمثل سهمًا شائعًا من ملكية عين استعمالية مؤجرة ⁦(عقار أو طائرة أو باخرة أو مجموعة أعيان)⁩. ثم ضبط أحكام إصدارها وتداولها وما يترتب على ملكيتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It explained that ijara sukuk rest on securitisation — issuing tradable financial instruments built on an income-yielding investment project — converting the assets and usufructs covered by an ijara contract into sukuk tradable on a secondary market, defining them as equal-value certificates representing undivided shares in the ownership of income-yielding assets or usufructs. The ijara sukuk, it stressed, represents neither a sum of money nor a debt on any party but a financial instrument representing an undivided share in the ownership of a leased usable asset (real estate, aircraft, ship, or a pool of such assets). It then regulated their issuance, trading and the consequences of owning them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے بیان کیا کہ اجارہ صکوک کا تصور تصکیک پر قائم ہے — آمدنی والے سرمایہ کاری منصوبے پر قابلِ تداول مالی دستاویزات کا اجرا — جس میں اجارہ عقد کے تحت آنے والی اعیان اور منافع صکوک میں بدل دی جاتی ہیں جو ثانوی بازار میں تجارت ہوں؛ اور تعریف کی: یکساں قیمت کی سندات جو آمدنی والی اعیان یا منافع کی ملکیت میں شائع حصوں کی نمائندگی کرتی ہیں۔ تاکید: اجارہ صک نہ نقد رقم کی نمائندگی کرتا ہے نہ کسی جہت کا قرض، بلکہ کرائے پر دی گئی استعمالی عین ⁦(جائیداد، طیارہ، جہاز یا ایسی اعیان کا مجموعہ)⁩ کی ملکیت میں شائع حصہ کی مالی دستاویز ہے۔ پھر اجرا، تجارت اور ملکیت کے اثرات کے ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004). Explicaba que los sukuk ijara se basan en la titulización —la emisión de instrumentos financieros negociables construidos sobre un proyecto de inversión generador de ingresos—, convirtiendo los activos y usufructos cubiertos por un contrato ijara en sukuk negociables en un mercado secundario, definiéndolos como certificados de igual valor que representan participaciones indivisas en la propiedad de activos generadores de ingresos o usufructos. El sukuk ijara, recalcó, no representa ni una suma de dinero ni una deuda para ninguna parte, sino un instrumento financiero que representa una participación indivisa en la propiedad de un activo utilizable arrendado (bienes inmuebles, aeronaves, buques o un conjunto de dichos activos). A continuación, reguló su emisión, negociación y las consecuencias de su posesión."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 15e session à Mascate (14-19 Muharram 1425, soit 6-11 mars 2004) explique que les sukuk ijara reposent sur la titrisation – l'émission d'instruments financiers négociables adossés à un projet d'investissement générateur de revenus – convertissant les actifs et les usufruits couverts par un contrat ijara en sukuk négociables sur un marché secondaire. Ces sukuk sont définis comme des certificats de valeur égale représentant des parts indivises de la propriété d'actifs générateurs de revenus ou d'usufruits. La résolution souligne que les sukuk ijara ne constituent ni une somme d'argent ni une dette pour quelque partie que ce soit, mais un instrument financier représentant une part indivise de la propriété d'un actif utilisable loué (bien immobilier, aéronef, navire ou ensemble de tels actifs). Elle réglemente ensuite leur émission, leur négociation et les conséquences de leur détention."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on beşinci oturumunda Muskat'ta (14–19 Muharrem 1425H, 6–11 Mart 2004) toplu kararı. İcara Sukuk kavramının menkul kıymetleştirmeye dayandığını açıkladı: kira sözleşmesiyle ilgili varlıkları ve faydaları ikincil piyasada işlem gören sukuklara dönüştürülerek gelir sağlayan bir yatırım projesine dayalı ticarete açılabilir menkul kıymetler ihraç etmek; bunları, varlıkların mülkiyetindeki ortak hisseleri veya gelir getiren faydaları temsil eden eşit değerde tahviller olarak tanımlamıştır. İcara Sukuk'un herhangi bir tüzel kişiye borçlu bir miktar para veya borç değil, kiralık bir hizmet kaleminin (gayrimenkul, uçak, gemi veya varlık grubu) ortak payını temsil eden bir finansal senet olduğunu doğruladı. Daha sonra ihraç ve dolaşıma ilişkin karşılıklar düzenlenir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi kelima belas di Muscat (14–19 Muharram 1425H, 6–11 Maret 2004). Ia menjelaskan bahwa konsep Sukuk Ijarah didasarkan pada sekuritisasi: penerbitan surat berharga yang dapat diperdagangkan berdasarkan proyek investasi yang menghasilkan pendapatan dengan mengubah aset dan manfaat terkait kontrak sewa menjadi sukuk yang diperdagangkan di pasar sekunder, dan mendefinisikannya sebagai obligasi dengan nilai setara yang mewakili saham biasa dalam kepemilikan aset atau manfaat penghasilan. Ia menegaskan bahwa Sukuk Ijarah tidak mewakili jumlah uang atau utang yang terutang kepada entitas manapun, melainkan surat utang keuangan yang mewakili bagian bersama kepemilikan barang utilitas sewaan (properti, pesawat, kapal, atau kelompok aset). Kemudian ketentuan penerbitan, peredaran, dan konsekuensi kepemilikan tersebut diatur."
