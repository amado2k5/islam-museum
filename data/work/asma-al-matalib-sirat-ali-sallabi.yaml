label: { ar: "أسمى المطالب في سيرة أمير المؤمنين علي بن أبي طالب", en: "Asma al-Matalib fi Sirat Amir al-Mu'minin Ali ibn Abi Talib", ur: "اسمی المطالب فی سیرۃ امیر المؤمنین علی بن ابی طالب" }
summary:
  ar: "دراسة معاصرة لعلي محمد الصلابي في شخصية علي بن أبي طالب وعصره، الجزء الرابع من سلسلته «تاريخ الخلفاء الراشدين»؛ فرغ منها ظهر السبت 17 ربيع الآخر 1424هـ/7 يونيو 2003م، وتتناول عليّاً بمكة وفي عهد الخلفاء قبله، وبيعته وصفاته، ومؤسساته المالية والقضائية والولاية، ومعركتي الجمل وصفين والتحكيم، وموقفه من الخوارج والشيعة، ثم استشهاده."
  en: "A contemporary study by Ali Muhammad al-Sallabi of the person and times of Ali ibn Abi Talib, volume four of his History of the Rightly Guided Caliphs; finished at noon on Saturday 17 Rabi' II 1424 / 7 June 2003, it treats Ali in Mecca and under the caliphs before him, his accession and qualities, his financial, judicial and provincial institutions, the battles of the Camel and Siffin and the arbitration, his stance towards the Kharijites and the Shi'a, and his martyrdom."
