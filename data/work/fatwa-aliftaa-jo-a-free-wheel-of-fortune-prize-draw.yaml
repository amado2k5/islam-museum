id: work/fatwa-aliftaa-jo-a-free-wheel-of-fortune-prize-draw
class: work
kind: fatwa
label: { ar: "دولاب الحظ", en: "A 'wheel of fortune' prize draw", ur: "'قسمت کا پہیہ' انعامی قرعہ اندازی" }
summary:
  ar: "سؤال عن دولاب الحظ، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا بأس به إذا كان الدخول فيه مجانيًا تمنحه الشركة للزبون، وهو حينئذ هبة من التاجر. أجابت الدائرة بأن الدخول في المسابقة إذا كان مجانيًا غير مدفوع الثمن، بحيث تمنحه الشركة للزبون ليدخل في سحب على الجوائز، فلا بأس فيه ولا حرج. وقالت إنه يعد بذلك هبة من التاجر، واستندت إلى قرار مجلس الإفتاء رقم 3/2010."
  en: "A question about a 'wheel of fortune' prize draw, in which Jordan's General Iftaa Department answered that there is no objection if entry is free and given by the company to the customer, in which case it is a gift from the merchant. The Department answered that if entry into the competition is free and not paid for, with the company giving it to the customer so that he enters a prize draw, there is no harm or objection in it. It said that in that case it counts as a gift from the merchant, relying on Iftaa Council resolution no. 3/2010."
  ur: "'قسمت کا پہیہ' انعامی قرعہ اندازی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر اس میں شرکت مفت ہو اور کمپنی گاہک کو دے، تو کوئی حرج نہیں اور یہ تاجر کی طرف سے ہبہ ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر مقابلے میں شرکت مفت ہو اور اس کی قیمت نہ دی جائے، یعنی کمپنی گاہک کو انعامی قرعہ اندازی میں شرکت کا موقع دے، تو اس میں کوئی حرج نہیں۔ اس نے کہا کہ اس صورت میں یہ تاجر کی طرف سے ہبہ شمار ہوتا ہے، اور افتاء کونسل کی قرارداد نمبر 3/2010 پر انحصار کیا۔"
