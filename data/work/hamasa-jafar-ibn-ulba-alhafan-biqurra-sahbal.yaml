summary:
  ar: "أبيات في ديوان الحماسة من الطويل على روي اللام، تقدّمها الطبعة بقولها «قال جعفر بن علبة الحارثي» {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  en: "Verses in the Diwan al-Hamasa in the tawil metre on the rhyme lam, introduced in the edition with \"Ja'far ibn Ulba al-Harithi said\" {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  es: "Versos del Diwan al-Hamasa en metro tawil sobre la rima lam, introducidos en la edición con \"Ja'far ibn Ulba al-Harithi dijo\" {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  fr: "Versets du Diwan al-Hamasa en mètre tawil sur la rime lam, introduits dans l'édition avec « Ja'far ibn Ulba al-Harithi a dit » {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  ur: "دیوان الحمسہ میں آیات لام پر تاویل میٹر میں، ایڈیشن میں \"جعفر ابن البا الحارثی نے کہا\" کے ساتھ متعارف کرایا ہے"
  tr: "Al-Tawil'den Al-Hamasa Diwanı'nda lamın anlatımına dair dizeler, \"Ja'far ibn 'Ullab al-Harithi\" ifadesinin yer aldığı baskı ile başlar {{cite:hamasa-abu-tammam-ed-1916 s.11}}."
  id: "Bait-bait dalam Diwan Al-Hamasa dari Al-Tawil tentang narasi lam, didahului oleh edisi dengan pernyataan \"Ja'far ibn 'Ullab al-Harithi\" {{cite:hamasa-abu-tammam-ed-1916 hlm.11}}."
