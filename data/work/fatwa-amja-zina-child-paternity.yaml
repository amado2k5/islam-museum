id: work/fatwa-amja-zina-child-paternity
class: work
kind: fatwa
label: { ar: "استلحاق ولد الزنا لأبيه", en: "Attributing a child of zina to his father — AMJA's resolution", ur: "زنا کی اولاد کا نسب — مجمع کا فیصلہ", es: "Atribuir un hijo de adulterio a su padre: resolución de AMJA", fr: "Attribuer un enfant né de la fornication à son père — Résolution de l'AMJA", tr: "Zina oğlunun babasına bağlanması", id: "Keterikatan anak yang berzina dengan ayahnya" }
summary:
  ar: "سأل سائل عن رجل زنى بامرأة فحملت منه هل يستلحق ولده منها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77386 بتاريخ 8 يناير 2009)⁩ أن مجمع فقهاء الشريعة بأمريكا بحث هذه القضية وبعد روية وأناة وتأجيل امتد لعامين انتهى قراره إلى جواز استلحاق الزاني لولده من الزنا فيلحق به وتثبت له جميع حقوق الولد الصلبي رعاية لتشوف الشارع لإثبات النسب حيث يثبته ولو بأضعف طريق ولا ينفيه إلا بأقواها، وانتهى قرار المجمع إلى العمل بذلك مبدئيًا خارج ديار الإسلام وإمهال النظر في تطبيقه داخل بلاد الإسلام إلى دورات وبحوث قادمة ويمكن مراجعة القرار على موقع المجمع."
  en: "A questioner asked whether a man who fathered a child by zina may claim the child as his own. Dr. Salah al-Sawi (fatwa no. 77386, 8 January 2009) answered that the Assembly of Muslim Jurists of America studied the matter and, after deliberation and a deferral stretching two years, concluded that the fornicator may claim his zina-child, who then attaches to him with all the rights of a legitimate child — honouring the Lawgiver's eagerness to establish lineage, which He affirms by the weakest route and negates only by the strongest; the resolution operates provisionally outside Muslim lands, while its application inside them awaits further sessions and studies; the resolution can be reviewed on the Assembly's site."
  ur: "ایک سائل نے زنا سے پیدا بچے کا نسب پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77386، 8 جنوری 2009)⁩ کے مطابق مجمع نے دو سال کی تحقیق کے بعد فیصلہ کیا کہ باپ بچے کو اپنا مان سکتا ہے اور اسے جائز اولاد کے حقوق ملیں گے — فی الحال غیر اسلامی ممالک کے لیے۔"
  es: "Un interlocutor preguntó si un hombre que engendró un hijo por adulterio puede reclamarlo como propio. El Dr. Salah al-Sawi (fatwa n.º 77386, 8 de enero de 2009) respondió que la Asamblea de Juristas Musulmanes de América estudió el asunto y, tras deliberar y aplazar la decisión durante dos años, concluyó que el fornicador puede reclamar a su hijo por adulterio, quien entonces se vincula a él con todos los derechos de un hijo legítimo, en cumplimiento del afán del Legislador por establecer el linaje, que Él afirma por la vía más débil y niega solo por la más fuerte. La resolución opera provisionalmente fuera de los países musulmanes, mientras que su aplicación dentro de ellos está pendiente de nuevas sesiones y estudios. La resolución puede consultarse en el sitio web de la Asamblea."
  fr: "Un internaute a demandé si un homme ayant engendré un enfant hors mariage (zina) pouvait le reconnaître comme son propre fils. Le Dr Salah al-Sawi (fatwa n° 77386, 8 janvier 2009) a répondu que l'Assemblée des juristes musulmans d'Amérique avait étudié la question et, après délibération et un report de deux ans, avait conclu que l'homme ayant commis l'adultère pouvait reconnaître l'enfant né hors mariage, lequel s'attache alors à lui avec tous les droits d'un enfant légitime. Cette décision respecte la volonté du Législateur d'établir la filiation, qu'Il affirme par la voie la plus faible et ne réfute que par la plus forte. La résolution s'applique provisoirement hors des pays musulmans, son application au sein de ces pays étant soumise à des sessions et des études complémentaires. La résolution peut être consultée sur le site de l'Assemblée."
  tr: "Bir soru soran kişi, bir kadınla zina eden ve kadının hamile kaldığı bir adamın çocuğunun onunla akraba olup olmayacağını sordu. Dr. Salah Al-Sawy (8 Ocak 2009 tarihli 77386 sayılı Fetva) Amerika Şeriat Hukukçuları Akademisi'nin bu konuyu incelediğini yanıtladı. İki yıl süren gözlem, sabır ve gecikmenin ardından, karar, zina edenin çocuğunu zinadan çıkarıp ona katılmasının izin verildiğine karar verdi ve çarmıha gerilmiş çocuğun tüm hakları, en zayıf yollarla bile soy kurma yasasında kurulup en güçlü yollarla reddedildiği sonucuna varıldı. Akademi'nin kararı, başlangıçta bunu İslam toprakları dışında uygulamak ve uygulamanın İslam topraklarında değerlendirilmesini gelecekteki kurs ve araştırmalara ertelemekti. Karar Akademi'nin web sitesinde incelenebilir."
  id: "Seorang penanya menanyakan tentang seorang pria yang berzina dengan seorang wanita dan wanita itu hamil olehnya, apakah anaknya akan memiliki hubungan keluarga dengannya. Dr. Salah Al-Sawy menjawab (Fatwa No. 77386 tanggal 8 Januari 2009) bahwa Akademi Ahli Hukum Syariah di Amerika telah meneliti masalah ini. Setelah dua tahun pengamatan, kesabaran, dan penundaan, keputusan mereka menyimpulkan bahwa diperbolehkan bagi pelaku zina untuk bergabung dengan anaknya dari perselingkuhan dan bergabung dengannya, dan semua hak anak yang disalibkan ditetapkan untuk melihat hukum menetapkan garis keturunan, di mana hukum itu menegakkannya bahkan dengan cara yang paling lemah dan hanya menolaknya dengan cara yang paling kuat. Keputusan Akademi adalah untuk awalnya menerapkan hal ini di luar tanah Islam dan menunda pertimbangan penerapannya di dalam negeri Islam hingga kursus dan penelitian berikutnya. Keputusan ini dapat ditinjau di situs web Akademi."
