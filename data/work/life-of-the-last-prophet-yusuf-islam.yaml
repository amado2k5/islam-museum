label: { ar: "حياة النبي الخاتم ⁦(The Life of the Last Prophet)⁩", en: "The Life of the Last Prophet", ur: "دی لائف آف دی لاسٹ پرافٹ", es: "La vida del último profeta", fr: "La vie du dernier prophète", tr: "Son Peygamberin Hayatı", id: "Kehidupan Nabi Terakhir" }
summary:
  ar: "أول ألبوم أصدره يوسف إسلام بعد تركه صناعة البوب الغربية سنة 1978، صدر في 1 أبريل 1995 عن ماونتن أوف لايت وجمال، وهو عمل منطوق يروي سيرة النبي من يتمه إلى وفاته في أربعة وثلاثين فصلا تتخللها قراءات وأناشيد؛ أراد به مدح النبي، ومخاطبة الشباب ومن يريد فهم الإسلام، وشرح سبب تركه الصناعة في ذروة شهرته."
  en: "Yusuf Islam's first album after leaving the Western pop business in 1978, released on 1 April 1995 on Mountain of Light/Jamal: a spoken-word telling of the Prophet's life from orphanhood to death in thirty-four sections, with recitations and songs between them, meant to praise the Prophet, to reach young people and those who wish to understand Islam, and to explain why he left the business at the height of his career."
  ur: "مغربی پاپ صنعت 1978 میں چھوڑنے کے بعد یوسف اسلام کا پہلا البم، یکم اپریل 1995 کو ماؤنٹین آف لائٹ اور جمال سے جاری ہوا؛ یہ نبی کی سیرت کا یتیمی سے وفات تک چونتیس حصوں میں بیان ہے، جس کا مقصد نبی کی مدح، نوجوانوں اور اسلام سمجھنے کے خواہش مندوں تک پہنچنا اور صنعت چھوڑنے کی وجہ بتانا تھا۔"
  es: "El primer álbum de Yusuf Islam tras abandonar la industria del pop occidental en 1978, publicado el 1 de abril de 1995 por Mountain of Light/Jamal, es un relato hablado de la vida del Profeta desde su orfandad hasta su muerte, dividido en treinta y cuatro secciones, con recitaciones y canciones intercaladas, destinado a alabar al Profeta, a llegar a los jóvenes y a quienes desean comprender el Islam, y a explicar por qué dejó la industria en la cima de su carrera."
  fr: "Le premier album de Yusuf Islam après son départ de l'industrie de la pop occidentale en 1978, sorti le 1er avril 1995 sur Mountain of Light/Jamal: un récit parlé de la vie du Prophète, de son enfance d'orphelin à sa mort, en trente-quatre sections, avec des récitations et des chansons entre elles, destiné à louer le Prophète, à toucher les jeunes et ceux qui souhaitent comprendre l'islam, et à expliquer pourquoi il a quitté l'industrie au sommet de sa carrière."
  tr: "Youssef Islam'ın 1978'de Batı pop endüstrisinden ayrıldıktan sonra çıkardığı ilk albüm, 1 Nisan 1995'te Mountain of Light and Beauty tarafından yayımlandı. Bu eser, Peygamber'in yetimliğinden ölümüne kadar olan hayatını otuz dört bölümde anlatan sözlü bir eser; aralara okumalar ve ilahiler serpiştirilmiş; Peygamber'i övmek, gençlere ve İslam'ı anlamak isteyenlere hitap etmek ve şöhretinin zirvesinde neden sektörü terk ettiğini açıklamayı amaçlamaktadır."
  id: "Album pertama Youssef Islam yang dirilis setelah meninggalkan industri pop Barat pada tahun 1978 dirilis pada 1 April 1995 oleh Mountain of Light and Beauty. Ini adalah karya lisan yang menceritakan kehidupan Nabi dari masa yatim piatu hingga wafatnya dalam tiga puluh empat bab, diselingi dengan pembacaan dan himne; karya ini bertujuan memuji Nabi, berbicara kepada para pemuda dan mereka yang ingin memahami Islam, serta menjelaskan mengapa ia meninggalkan industri ini pada puncak ketenarannya."
