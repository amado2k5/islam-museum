label: { ar: "حياة النبي الخاتم ⁦(The Life of the Last Prophet)⁩", en: "The Life of the Last Prophet", ur: "دی لائف آف دی لاسٹ پرافٹ" }
summary:
  ar: "أول ألبوم أصدره يوسف إسلام بعد تركه صناعة البوب الغربية سنة 1978، صدر في 1 أبريل 1995 عن ماونتن أوف لايت وجمال، وهو عمل منطوق يروي سيرة النبي من يتمه إلى وفاته في أربعة وثلاثين فصلا تتخللها قراءات وأناشيد؛ أراد به مدح النبي، ومخاطبة الشباب ومن يريد فهم الإسلام، وشرح سبب تركه الصناعة في ذروة شهرته."
  en: "Yusuf Islam's first album after leaving the Western pop business in 1978, released on 1 April 1995 on Mountain of Light/Jamal: a spoken-word telling of the Prophet's life from orphanhood to death in thirty-four sections, with recitations and songs between them, meant to praise the Prophet, to reach young people and those who wish to understand Islam, and to explain why he left the business at the height of his career."
  ur: "مغربی پاپ صنعت 1978 میں چھوڑنے کے بعد یوسف اسلام کا پہلا البم، یکم اپریل 1995 کو ماؤنٹین آف لائٹ اور جمال سے جاری ہوا؛ یہ نبی کی سیرت کا یتیمی سے وفات تک چونتیس حصوں میں بیان ہے، جس کا مقصد نبی کی مدح، نوجوانوں اور اسلام سمجھنے کے خواہش مندوں تک پہنچنا اور صنعت چھوڑنے کی وجہ بتانا تھا۔"
