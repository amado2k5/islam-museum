summary:
  ar: "في المنطق والحكمة لابن سينا؛ شرحه الإمام فخر الدين محمد بن عمر الرازي المتوفى سنة ٦٠٦هـ وله لباب الإشارات لخصه منها، ومن شروحه شرح العلامة المحقق نصير الدين محمد بن الحسن الطوسي، والمحاكمة بين الشارحين لقطب الدين {cite:kashf-zunun-furqan p. 339}."
  en: "Avicenna's al-Isharat wal-Tanbihat — his last and most contested summa of logic and wisdom, with Fakhr al-Din al-Razi's sharh and Lubab, Nasir al-Din al-Tusi's commentary and Qutb al-Din's arbitration between them {cite:kashf-zunun-furqan p. 339}."
  es: "Al-Isharat wal-Tanbihat de Avicena: su último y más controvertido resumen de lógica y sabiduría, con sharh y Lubab de Fakhr al-Din al-Razi, el comentario de Nasir al-Din al-Tusi y el arbitraje de Qutb al-Din entre ellos {citar:kashf-zunun-furqan p. 339}."
  fr: "Al-Isharat wal-Tanbihat d'Avicenne — son dernier et le plus controversé résumé de logique et de sagesse, avec le sharh et Lubab de Fakhr al-Din al-Razi, le commentaire de Nasir al-Din al-Tusi et l'arbitrage de Qutb al-Din entre eux {cite:kashf-zunun-furqan p. 339}."
  ur: "ایویسینا کی الاشرات والتنبیحات - منطق اور حکمت کا اس کا آخری اور سب سے زیادہ مقابلہ شدہ خلاصہ، فخر الدین الرازی کی شرح و لباب، ناصر الدین الطوسی کی تفسیر اور قطب الدین کی ثالثی کے ساتھ۔ 339}۔"
  tr: "İbn Sina'nın mantık ve hikmetinde; 606 Hicri'de ölen İmam Fakhr al-Din Muhammed bin Ömer el-Razi tarafından açıklanmıştır. 'Bab al-İsharat'ı yazmış ve ondan özetlemiştir. Tefsirleri arasında, âlim ve araştırmacı Nasir al-Din Muhammed bin el-Hasan el-Tusi'nin tefsiri ve Kutsubdin yorumcularının 'Al-Muhadassaqat bayn al-Hadassah' (kaynak:kaşf-zunun-furqan, s. 339} tefsiri bulunmaktadır."
  id: "Dalam logika dan kebijaksanaan oleh Ibn Sina; dijelaskan oleh Imam Fakhr al-Din Muhammad ibn Umar al-Razi, yang meninggal pada tahun 606 H. Ia menulis 'Bab al-Isharat' dan merangkum dari sana. Di antara komentarnya adalah komentar oleh ulama dan penyelidik Nasir al-Din Muhammad ibn al-Hasan al-Tusi, dan 'Al-Muhadassaqat bayn al-Hadassah' oleh para komentator Qutb al-Din {cite:kashf-zunun-furqan, hlm. 339}."
