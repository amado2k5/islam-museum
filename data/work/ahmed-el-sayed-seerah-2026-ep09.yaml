label:
  ar: "سيرة رسول الله 2026، الحلقة 9: الرعيل الأول من الصحابة"
  en: "The Biography of the Messenger of God 2026, episode 9: The first generation of the Companions"
  ur: "سیرتِ رسول اللہ 2026، قسط 9: صحابہ کی پہلی جماعت"
  fr: "La biographie du Messager de Dieu 2026, épisode 9 : La première génération des Compagnons"
  es: "La biografía del Mensajero de Dios 2026, episodio 9: La primera generación de los Compañeros"
summary:
  ar: "يُنهي المحاضر الحديث عن أوائل المسلمين. يتناول من هم السابقون الأولون في القرآن بحسب أقوال العلماء، ثم يستعرض تقسيم ابن سعد للمهاجرين من أهل بدر بحسب بطون قريش، ويعرّف برجال أقل شهرة من تلك القائمة اعتمادًا على ما يورده ابن سعد من نسبهم وهجرتهم إلى الحبشة ومن آواهم في المدينة ومن آخى بينهم وبين غيرهم، ومن غزواتهم ووفاتهم."
  en: "The lecturer finishes the topic of the early converts. He discusses who the Qur'anic early forerunners were according to scholars, then walks through Ibn Sa'd's grouping of the emigrant Badr veterans by Quraysh clan, and profiles less famous men from that list using Ibn Sa'd's details on lineage, migration to Abyssinia, hosts in Medina, pairing in brotherhood, battles and death."
  ur: "مقرر ابتدائی مسلمانوں کا موضوع مکمل کرتا ہے۔ وہ بتاتا ہے کہ علما کے مطابق قرآن میں مذکور سابقین اولین کون تھے، پھر ابن سعد کی طرف سے بدر میں شریک مہاجرین کی قریش کے خاندانوں کے لحاظ سے تقسیم کا جائزہ لیتا ہے، اور اس فہرست کے کم مشہور افراد کا تعارف کراتا ہے، جس میں ابن سعد کی دی ہوئی تفصیلات یعنی نسب، حبشہ کی ہجرت، مدینہ میں میزبان، مواخات میں ساتھی، غزوات اور وفات شامل ہیں۔"
  fr: "Le conférencier termine le sujet des premiers convertis. Il présente ceux que les savants considèrent comme les premiers précurseurs cités dans le Coran, puis parcourt le classement que fait Ibn Sa'd des émigrés vétérans de Badr selon les clans de Quraysh, et dresse le portrait d'hommes moins célèbres de cette liste à partir des détails d'Ibn Sa'd sur leur lignage, leur migration en Abyssinie, leurs hôtes à Médine, leur frère de fraternité, leurs batailles et leur mort."
  es: "El conferenciante termina el tema de los primeros conversos. Expone quiénes fueron los primeros precursores citados en el Corán según los eruditos, luego recorre la clasificación que hace Ibn Sa'd de los emigrados veteranos de Badr por clanes de Quraysh, y presenta a hombres menos famosos de esa lista a partir de los datos de Ibn Sa'd sobre su linaje, su migración a Abisinia, sus anfitriones en Medina, su hermano de fraternidad, sus batallas y su muerte."
