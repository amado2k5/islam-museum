id: work/fatwa-amja-intercourse-before-ghusl
class: work
kind: fatwa
label: { ar: "الجماع قبل الاغتسال", en: "Intercourse after the period's end, before washing", ur: "حیض کے بعد غسل سے پہلے جماع", es: "Relaciones sexuales después del final del período, antes de lavarse.", fr: "Les rapports sexuels après la fin des règles, avant la toilette", tr: "Banyo öncesi cinsel ilişki", id: "Hubungan seks sebelum mandi" }
summary:
  ar: "سأل سائل عن حكم الجماع بعد انقطاع الدورة عن الزوجة قبل أن تغتسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81452 بتاريخ 10 مايو 2010)⁩ أن جماهير أهل العلم على أن جماع الحائض لا يكون إلا بعد انقطاع حيضها وتطهرها من المحيض لقوله تعالى ولا تقربوهن حتى يطهرن فإذا تطهرن فأتوهن من حيث أمركم الله إن الله يحب التوابين ويحب المتطهرين أي إذا اغتسلن هكذا فسره الجمهور، وللحنفية قول بجوازه بعد انقطاع الدم إذا تجاوز العادة على ما فصّل الجواب."
  en: "A questioner asked the ruling on intercourse after the wife's period ended, before she washed. Dr. Salah al-Sawi (fatwa no. 81452, 10 May 2010) answered that the majority of scholars hold intercourse with the menstruant comes only after her menses has ceased and she has purified herself from it, per 'draw not near till they are pure; when they have purified themselves, come to them as God commanded you — God loves the repentant and loves the purified', the majority reading 'purified' as washed; the Hanafis permit it after the blood's ceasing once it passes the habit — as detailed."
  ur: "حیض ختم مگر غسل سے پہلے جماع؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81452، 10 مئی 2010)⁩ کے مطابق جمہور غسل شرط مانتے ہیں؛ حنفی عادت گزرنے پر اجازت دیتے ہیں۔"
  es: "Un consultante preguntó sobre la norma relativa a las relaciones sexuales después de que la esposa haya terminado su período, antes de que se haya lavado. El Dr. Salah al-Sawi (fatwa n.º 81452, 10 de mayo de 2010) respondió que la mayoría de los eruditos sostienen que las relaciones sexuales con la menstruante solo se permiten después de que su menstruación haya cesado y se haya purificado de ella, según «no os acerquéis hasta que estén puras; cuando se hayan purificado, acercaos a ellas como Dios os ha mandado: Dios ama a los arrepentidos y ama a los purificados», interpretando la mayoría «purificadas» como lavadas; los hanafíes lo permiten después de que cese la sangre una vez que haya pasado el hábito, como se detalla."
  fr: "Un internaute a interrogé Salah al-Sawi sur la règle concernant les rapports sexuels après la fin des menstruations, avant que l'épouse ne se soit lavée. Le Dr Salah al-Sawi (fatwa n° 81452, 10 mai 2010) a répondu que la majorité des savants estiment que les rapports sexuels avec une femme menstruée ne sont autorisés qu'après la fin de ses menstruations et sa purification, conformément au commandement: « N'approchez pas d'elles tant qu'elles ne sont pas pures; lorsqu'elles se sont purifiées, approchez-vous d'elles comme Dieu vous l'a ordonné. Dieu aime les repentants et aime les purifiés. » La majorité interprète « purifié » comme « lavé ». Les hanafites autorisent les rapports sexuels après l'arrêt des menstruations, une fois les règles accomplies, comme détaillé ci-après."
  tr: "Bir soru soran kişi, kadın ghusl yapmadan önce adet dönemi durduktan sonra cinsel ilişkiye ilişkin hüküm hakkında soru soruldu. Dr. Salah Al-Sawy (10 Mayıs 2010 tarihli Fetva No. 81452) çoğunluğun, regl olan bir kadınla ilişkinin ancak adet dönemi bittikten ve kadının adet görmekten arındıktan sonra gerçekleştiğini düşündüğünü söyledi; Allah'ın dediği gibi: \"Onlar arınana kadar onlara yaklaşmayın. Ve saf olduklarında, Allah'ın size emrettiği gibi zayıflayın. Gerçekten Allah tövbe edenleri sever, kendini arındıranları sever,\" yani guslu yaptıklarında çoğunluk böyle yorumlamıştır. Hanefi okulu kanaması durduktan sonra, normal süreyi aştıktan sonra izin verir, açıklamada açıklandığı gibi."
  id: "Seorang penanya ditanya tentang aturan hubungan seksual setelah menstruasi berhenti bagi istri sebelum melakukan ghusl. Dr. Salah Al-Sawy menjawab (Fatwa No. 81452 tanggal 10 Mei 2010) bahwa mayoritas ulama berpendapat bahwa hubungan seksual dengan wanita yang sedang menstruasi hanya terjadi setelah menstruasi berhenti dan dia disucikan dari menstruasi, seperti yang dikatakan Allah Yang Maha Kuasa: \"Jangan mendekati mereka sampai mereka membersihkan diri. Dan ketika mereka menjadi suci, maka lemahkanlah diri mereka seperti yang Allah perintahkan kepadamu. Sesungguhnya, Allah mengasihi mereka yang bertobat dan mengasihi mereka yang membersihkan diri,\" artinya ketika mereka melakukan ghusl, begitulah penafsiran mayoritas. Aliran pemikiran Hanafi mengizinkan setelah pendarahan berhenti, jika melebihi periode biasa, seperti yang dijelaskan dalam penjelasan."
