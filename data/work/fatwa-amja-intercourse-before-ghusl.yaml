id: work/fatwa-amja-intercourse-before-ghusl
class: work
kind: fatwa
label: { ar: "الجماع قبل الاغتسال", en: "Intercourse after the period's end, before washing", ur: "حیض کے بعد غسل سے پہلے جماع" }
summary:
  ar: "سأل سائل عن حكم الجماع بعد انقطاع الدورة عن الزوجة قبل أن تغتسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81452 بتاريخ 10 مايو 2010)⁩ أن جماهير أهل العلم على أن جماع الحائض لا يكون إلا بعد انقطاع حيضها وتطهرها من المحيض لقوله تعالى ولا تقربوهن حتى يطهرن فإذا تطهرن فأتوهن من حيث أمركم الله إن الله يحب التوابين ويحب المتطهرين أي إذا اغتسلن هكذا فسره الجمهور، وللحنفية قول بجوازه بعد انقطاع الدم إذا تجاوز العادة على ما فصّل الجواب."
  en: "A questioner asked the ruling on intercourse after the wife's period ended, before she washed. Dr. Salah al-Sawi (fatwa no. 81452, 10 May 2010) answered that the majority of scholars hold intercourse with the menstruant comes only after her menses has ceased and she has purified herself from it, per 'draw not near till they are pure; when they have purified themselves, come to them as God commanded you — God loves the repentant and loves the purified', the majority reading 'purified' as washed; the Hanafis permit it after the blood's ceasing once it passes the habit — as detailed."
  ur: "حیض ختم مگر غسل سے پہلے جماع؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81452، 10 مئی 2010)⁩ کے مطابق جمہور غسل شرط مانتے ہیں؛ حنفی عادت گزرنے پر اجازت دیتے ہیں۔"
