id: work/fatwa-amja-al-luhaydi-mahdi-claimant
class: work
kind: fatwa
label: { ar: "اللحيدي المدعي للمهدوية", en: "Al-Luhaydi the Mahdi claimant — prophethood is sealed", ur: "لحيدی — مہدی کا مدعی" }
summary:
  ar: "سأل سائل أسئلة حول طائفة اللحيدي في اليمن الذين يزعمون أنه المهدي المنتظر وأنه رسول من عند الله. أجاب د. وليد بسيوني ⁦(فتوى رقم 21841 بتاريخ 20 يوليو 2006)⁩ أن من زعم أن النبوة والرسالة لم تختم بمحمد بن عبد الله فقد أتى بما يناقض أصل الإسلام والدين وإجماع الأمة منعقد على ذلك، وأما تفاصيل ما تعتقده هذه الطائفة فلا علم له بها وأحال إلى ما كتبه د. ناصر بن عبد الكريم العقل حول موضوع المهدي."
  en: "A questioner asked about the Luhaydi sect in Yemen claiming their man is the awaited Mahdi and a messenger from God. Dr. Walid Basyouni (fatwa no. 21841, 20 July 2006) answered that whoever claims prophethood and the message were not sealed with Muhammad ibn Abdullah brings what contradicts the foundation of Islam and the religion — the ummah's consensus stands on it; as for the details of what this sect holds he had no knowledge of them, referring to Dr. Nasir ibn Abd al-Karim al-Aql's writings on the Mahdi question."
  ur: "ایک سائل نے یمن کے لحيدی فرقے کے مہدی دعوے پوچھے۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21841، 20 جولائی 2006)⁩ کے مطابق ختم نبوت پر امت کا اجماع ہے — اس کا انکار دین کی بنیاد کے خلاف ہے۔"
