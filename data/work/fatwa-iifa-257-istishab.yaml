label: { ar: "قرار مجمع الفقه الإسلامي الدولي 257 (2/26) بشأن الاستصحاب وتطبيقاته في النوازل والمستجدات المعاصرة", en: "IIFA resolution 257 (2/26) on istishab (presumption of continuity) and its applications in contemporary cases", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 257 (2/26): استصحاب اور عصری نوازل و مستجدات میں اس کے اطلاق", es: "Resolución 257 (2/26) de la IIFA sobre istishab (presunción de continuidad) y sus aplicaciones en casos contemporáneos.", fr: "Résolution 257 (2/26) de l'IIFA sur l'istishab (présomption de continuité) et ses applications dans les cas contemporains", tr: "Uluslararası İslami Fiqh Akademisi Kararı 257 (2/26) İstişab ve çağdaş konular ile gelişmelerdeki uygulamaları hakkında", id: "Keputusan Akademi Fiqh Islam Internasional 257 (2/26) mengenai Istishab dan penerapannya dalam isu dan perkembangan kontemporer" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩. عرّف المجمع الاستصحاب بأنه الحكم بثبوت أمر في الزمان الثاني بناء على ثبوته في الزمان الأول عند عدم ما يقتضي التغيير، وقرر أنه دليل شرعي لا يُنشئ حكمًا جديدًا بل يفيد استدامة حكم سابق، وأن الفقيه يأخذ حكم الحادثة من استصحاب الحال نفيًا وإثباتًا: إن كان التردد في زواله فالأصل بقاؤه، وإن كان في ثبوته فالأصل عدم ثبوته. وبيّن أهميته في الاجتهاد في العبادات والمعاملات المالية والأحوال الشخصية والسياسة الشرعية والقضاء، وضبط العمل به بثلاثة: غلبة الظن بانتفاء الدليل أو السبب المغيّر بعد استفراغ الوسع في البحث، ومراعاة مقاصد الشريعة العامة والخاصة، وألا يقوم بتنزيله على الوقائع إلا المؤهلون للاجتهاد المتمكنون من قواعد الاستنباط."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025). It defined istishab as ruling that a state of affairs continues in a later time because it was established in an earlier time, absent anything requiring change, and ruled that it is a sharia evidence that creates no new ruling but sustains an existing one. The jurist takes the ruling of a new case from the presumption of continuity in negation and affirmation: if the doubt concerns its lapse, the default is its continuance; if it concerns its establishment, the default is that it is not established. The resolution stated its importance for ijtihad in worship, financial transactions, personal status, sharia policy and the judiciary, and set three controls: predominant belief that no contrary evidence or cause exists after exhaustive search, regard for the general and particular objectives of the sharia, and that only those qualified for ijtihad may apply it to cases."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں۔ اکیڈمی نے استصحاب کی تعریف ایسے حکم کے طور پر کی جس میں پہلے زمانے میں ثابت کسی امر کو دوسرے زمانے میں بھی ثابت قرار دیا جائے جب تبدیلی کا کوئی موجب نہ ہو، اور فیصلہ کیا کہ یہ شرعی دلیل ہے جو نیا حکم نہیں بناتا بلکہ سابقہ حکم کی تداوم کرتا ہے۔ فقیہ نئے واقعہ کا حکم نفی و اثبات میں استصحابِ حال سے لیتا ہے: اگر شک اس کے زوال میں ہو تو اصل اس کے بقا ہے، اور اگر شک اس کے ثبوت میں ہو تو اصل عدمِ ثبوت ہے۔ قرارداد نے عبادات، مالی معاملات، احوالِ شخصیہ، سیاستِ شرعیہ اور قضا میں اجتہاد کے لیے اس کی اہمیت بیان کی اور اس کے استعمال کے تین ضوابط مقرر کیے: بھرپور تحقیق کے بعد مخالف دلیل یا سبب کے عدم موجودگی کا غالب گمان، شریعت کے عمومی و خصوصی مقاصد کی رعایت، اور یہ کہ اسے وقائع پر صرف اہلِ اجتہاد ہی منطبق کر سکتے ہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 26.ª sesión en Doha (6-10 de Dhu al-Qa'da de 1446, 4-8 de mayo de 2025). Definió el istishab como la decisión de que un estado de cosas continúa en un momento posterior porque se estableció en un momento anterior, a falta de algo que requiera cambio, y dictaminó que es una prueba de la sharia que no crea una nueva norma, sino que sostiene una existente. El jurista toma la decisión de un nuevo caso de la presunción de continuidad en la negación y la afirmación: si la duda se refiere a su caducidad, la norma general es su continuidad; si se refiere a su establecimiento, la norma general es que no está establecido. La resolución destacó su importancia para el ijtihad en el culto, las transacciones financieras, el estado civil, la política de la sharia y el poder judicial, y estableció tres controles: la creencia predominante de que no existe ninguna prueba o causa contraria después de una búsqueda exhaustiva, el respeto por los objetivos generales y particulares de la sharia, y que solo aquellos calificados para el ijtihad pueden aplicarla a los casos."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 26e session à Doha (6-10 Dhu al-Qa'da 1446, soit 4-8 mai 2025) définit l'istishab comme la décision selon laquelle un état de choses se poursuit ultérieurement parce qu'il a été établi antérieurement, en l'absence de tout élément exigeant un changement. Elle stipule qu'il s'agit d'une preuve conforme à la charia qui ne crée pas de nouvelle règle mais confirme une règle existante. Le juriste fonde sa décision sur la présomption de continuité, par la négation et l'affirmation: si le doute porte sur la cessation, la règle par défaut est la continuité; s'il porte sur l'établissement, la règle par défaut est l'absence d'établissement. La résolution souligne l'importance de l'istishab pour l'ijtihad dans le culte, les transactions financières, le statut personnel, la politique de la charia et le système judiciaire, et établit trois critères: la conviction prédominante qu'aucune preuve ou cause contraire n'existe après une recherche exhaustive; le respect des objectifs généraux et particuliers de la charia; et la compétence exclusive des juristes pour appliquer l'ijtihad aux cas d'espèce."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki 26. oturumunda (6–10 Dhu al-Qi'dah 1446 H, 4–8 Mayıs 2025) toplu kararı. Akademi, istishab'ı, bir konunun ikinci kez kurulmasına ilişkin karar olarak tanımladı; bu karar ilk kez kurulmasına dayanarak hiçbir değişiklik gerekmemektedir. Bunun yeni bir karar yaratmadığını, aksine önceki bir kararın devamını teyit eden hukuki bir delil olduğunu belirtmiştir. Hukukçu, bir olayın hükmünü devletin istishab'ından hem inkâr hem de onaylama yoluyla alır: eğer feshedilmesi konusunda tereddüt varsa, varsayılan kalmasıdır; eğer yerleşirse, varsayılan olarak kurulmamasıdır. İbadet, mali işlemler, kişisel statü, Şeriat siyaseti ve yargı alanlarındaki önemini açıklığa kavuşturdu ve uygulamasını üç unsurla düzenledi: esas olarak tüm olası araştırmaları tükendikten sonra kanıt yokluğundan veya değişen bir gerekçeden şüphe etmek, genel ve özel Şeriat'ın amaçlarını gözlemlemek ve bunu yalnızca çıkarım ilkelerine hakim nitelikli kişiler tarafından gerçeklere uygulamak."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-26 di Doha (6–10 Dhu al-Qi'dah 1446 H, 4–8 Mei 2025). Akademi mendefinisikan istishab sebagai putusan atas penetapan suatu perkara untuk kedua kalinya berdasarkan pendiriannya pada percobaan pertama ketika tidak diperlukan perubahan. Akademi menyatakan bahwa itu adalah bukti hukum yang tidak menciptakan putusan baru tetapi justru mengonfirmasi kelanjutan putusan sebelumnya. Ahli hukum mengambil putusan suatu peristiwa dari istishab negara baik dalam bentuk penyangkalan maupun penegasan: jika ada keraguan tentang pembubarannya, maka kelalaian adalah keadaannya; jika ditetapkan, kelalaian adalah ketidakberadaannya. Ia menjelaskan pentingnya dalam ijtihad dalam tindakan ibadah, transaksi keuangan, status pribadi, politik Syariah, dan peradilan, serta mengatur penerapannya dengan tiga hal: terutama meragukan ketiadaan bukti atau perubahan alasan setelah melakukan semua penelitian yang mungkin, mengamati tujuan Syariah umum dan spesifik, dan menerapkannya pada fakta hanya oleh individu yang berkualifikasi dan menguasai prinsip deduksi."
