id: work/fatwa-dar-alifta-eg-custody-returns-after-waiver
class: work
kind: fatwa
label: { ar: "حكم عودة الحضانة للحاضنة بعد التنازل عنها أو بعد سقوطها", en: "Does custody return to the custodian after its waiver or lapse?", ur: "دستبرداری یا زوال کے بعد حضانت کی واپسی", es: "¿La custodia regresa al custodio después de su renuncia o vencimiento?", fr: "La garde revient-elle au dépositaire après sa renonciation ou son expiration ?" }
summary:
  ar: "سائل سأل عن عودة الحضانة للأم بعد التنازل عنها أو بعد سقوطها بحكم القضاء بسبب مانع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21035)⁩ أنه لا مانع شرعًا من أن تعود الحضانة للأم بعد سقوطها بحكم القضاء بسبب مانع ما دام هذا المانع قد زال على ما فصّل الجواب."
  en: "A questioner asked whether custody returns to the mother after its waiver or after lapsing by court order due to an impediment. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21035) answered there is no legal objection to custody returning to the mother once the impediment that caused its lapse has gone — as the answer details."
  ur: "ایک سائل نے پوچھا کہ دستبرداری یا کسی مانع کی وجہ سے عدالتی حکم سے ختم ہونے کے بعد حضانت ماں کو واپس مل سکتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21035)⁩ نے جواب دیا کہ مانع زائل ہونے پر واپسی جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó si la custodia regresa a la madre después de renunciar a ella o después de que caduque por orden judicial debido a un impedimento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21035) respondió que no existe ninguna objeción legal para que la custodia regrese a la madre una vez que haya desaparecido el impedimento que causó su caducidad, como se detalla en la respuesta."
  fr: "Une question a été posée: la garde de l’enfant est-elle restituée à la mère après une renonciation ou après une extinction de l’autorité parentale par décision de justice pour cause d’empêchement ? La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21035) a répondu qu’il n’y a aucune objection légale à ce que la garde soit restituée à la mère une fois l’empêchement ayant entraîné l’extinction de l’autorité parentale levé, comme le précise la réponse."
