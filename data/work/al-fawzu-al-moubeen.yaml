label:
  ar: "الفوز المبين (سلسلة دروس)"
  en: "Al-Fawz al-Mubin (lecture series)"
  ur: "الفوز المبین (درسی سلسلہ)"
summary:
  ar: "سلسلة من أربع عشرة حلقة لعمر عبد الكافي في أرشيف أسابيل، يعرض فيها طرقًا عملية يسيرة إلى «الفوز المبين»، ويرى أن الناس يستهينون بالحلول البسيطة ويظنون أن هذا الفوز لا يُنال إلا بالأعمال الكبرى."
  en: "A fourteen-episode series by Omar Abdelkafy on the Assabile archive, setting out simple, practical paths to 'the manifest triumph' (al-fawz al-mubin); he argues that people belittle simple remedies and think this triumph is reached only through great deeds."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا چودہ اقساط کا سلسلہ، جس میں وہ «الفوز المبین» (کھلی کامیابی) تک پہنچنے کے آسان عملی راستے بیان کرتے ہیں؛ ان کے نزدیک لوگ سادہ حل کو حقیر سمجھتے ہیں اور گمان کرتے ہیں کہ یہ کامیابی صرف بڑے اعمال سے ملتی ہے۔"
