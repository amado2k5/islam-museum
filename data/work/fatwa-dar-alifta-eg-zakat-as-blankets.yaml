label: { ar: "حكم إخراج الزكاة في صورة بطاطين", en: "Paying zakat in the form of blankets", ur: "کمبلوں کی صورت میں زکات ادا کرنا" }
summary:
  ar: "سائل سأل عن إخراج الزكاة في صورة بطاطين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21771)⁩ أن الأصل إخراجها من جنس المال الذي وجبت فيه ويجوز إخراجها بالقيمة نقدًا كما يجوز إخراجها بالقيمة عينًا كالبطاطين على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about paying zakat in the form of blankets. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21771) answered that the default is paying it from the kind of wealth it was due on; it may be paid as cash value, and may likewise be paid as value in goods such as blankets — under the controls the answer sets out."
  ur: "ایک سائل نے کمبلوں کی صورت میں زکات ادا کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21771)⁩ نے جواب دیا کہ اصول یہ ہے کہ زکات اسی مال کی جنس سے ادا ہو جس پر واجب ہوئی؛ اس کی مالیت نقد اور مالیت کے برابر سامان جیسے کمبل بھی دیے جا سکتے ہیں — جواب کے بیان کردہ ضوابط کے ساتھ۔"
