summary:
  ar: "سائل سأل عن بائع زاد على السعر الذي اتفق مع المشتري عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20834)⁩ أن الأصل في هذه الصورة من البيع أن يرد الرجل المذكور الزيادة التي زادها على المشتري في ثمن المبيع على ما فصّل الجواب."
  en: "A questioner asked about a seller who added over the price agreed with the buyer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20834) answered that the default in this form of sale is that the man return the excess he added to the buyer — as the answer details."
  ur: "ایک سائل نے بائع کے طے شدہ قیمت سے زیادہ لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20834)⁩ نے جواب دیا کہ اصول یہ ہے کہ وہ زائد رقم خریدار کو لوٹائے — جیسا کہ جواب میں تفصیل ہے۔"
