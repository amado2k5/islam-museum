id: work/fatwa-islamqa-eating-bread-without-condiment
class: work
kind: fatwa
label: { ar: "هل ورد نهي عن أكل الخبز دون إدام؟", en: "Is eating bread without a condiment forbidden?", ur: "کیا سالن کے بغیر روٹی کھانے کی ممانعت ہے؟" }
summary:
  ar: "سؤال عن ورود نهي عن أكل الخبز بلا إدام. أجاب موقع الإسلام سؤال وجواب بأنه لم يقف على حديث ثابت في ذلك، وأن الأصل جواز أكل الخبز وحده أو مع ما تيسّر من الإدام، ولا يلزم المسلم أن يتكلف تحصيل الإدام، واستشهد بأن النبي كان يأكل كما يأكل قومه مما يتيسر عنده."
  en: "A question on whether any prohibition on eating bread without a condiment has come down. IslamQA answered that it found no established hadith on this, that the basic ruling is that bread may be eaten alone or with whatever condiment is at hand, and that no one need go to trouble to obtain one, noting that the Prophet ate as his people ate, from whatever was available."
  ur: "سوال کہ کیا سالن کے بغیر روٹی کھانے کی کوئی ممانعت آئی ہے۔ اسلام سوال و جواب نے جواب دیا کہ اسے اس بارے میں کوئی ثابت حدیث نہیں ملی، اصل یہ ہے کہ روٹی اکیلی یا جو سالن میسر ہو اس کے ساتھ کھانا جائز ہے، اور سالن حاصل کرنے کا تکلف لازم نہیں؛ اور ذکر کیا کہ نبی اپنی قوم کی طرح جو میسر ہوتا وہی کھاتے تھے۔"
