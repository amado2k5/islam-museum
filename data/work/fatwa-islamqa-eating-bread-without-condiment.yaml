id: work/fatwa-islamqa-eating-bread-without-condiment
class: work
kind: fatwa
label: { ar: "هل ورد نهي عن أكل الخبز دون إدام؟", en: "Is eating bread without a condiment forbidden?", ur: "کیا سالن کے بغیر روٹی کھانے کی ممانعت ہے؟", es: "¿Está prohibido comer pan sin ningún condimento?", fr: "Est-il interdit de manger du pain sans condiment ?", tr: "Ekmek yemeyi yük olmadan yemeyi yasaklayan bir kelime var mı?", id: "Apakah ada kata yang melarang makan roti tanpa beban?" }
summary:
  ar: "سؤال عن ورود نهي عن أكل الخبز بلا إدام. أجاب موقع الإسلام سؤال وجواب بأنه لم يقف على حديث ثابت في ذلك، وأن الأصل جواز أكل الخبز وحده أو مع ما تيسّر من الإدام، ولا يلزم المسلم أن يتكلف تحصيل الإدام، واستشهد بأن النبي كان يأكل كما يأكل قومه مما يتيسر عنده."
  en: "A question on whether any prohibition on eating bread without a condiment has come down. IslamQA answered that it found no established hadith on this, that the basic ruling is that bread may be eaten alone or with whatever condiment is at hand, and that no one need go to trouble to obtain one, noting that the Prophet ate as his people ate, from whatever was available."
  ur: "سوال کہ کیا سالن کے بغیر روٹی کھانے کی کوئی ممانعت آئی ہے۔ اسلام سوال و جواب نے جواب دیا کہ اسے اس بارے میں کوئی ثابت حدیث نہیں ملی، اصل یہ ہے کہ روٹی اکیلی یا جو سالن میسر ہو اس کے ساتھ کھانا جائز ہے، اور سالن حاصل کرنے کا تکلف لازم نہیں؛ اور ذکر کیا کہ نبی اپنی قوم کی طرح جو میسر ہوتا وہی کھاتے تھے۔"
  es: "Se planteó la cuestión de si existía alguna prohibición de comer pan sin condimento. IslamQA respondió que no había encontrado ningún hadiz establecido al respecto, que la norma básica es que el pan se puede comer solo o con cualquier condimento que se tenga a mano, y que nadie necesita molestarse en conseguirlo, señalando que el Profeta comía como comía su pueblo, con lo que había disponible."
  fr: "Une question portait sur l'existence d'une interdiction de manger du pain sans condiment. IslamQA a répondu n'avoir trouvé aucun hadith authentique à ce sujet, précisant que la règle générale est que le pain peut être consommé seul ou avec le condiment disponible, et qu'il n'est pas nécessaire de se donner la peine d'en trouver. Le site a également rappelé que le Prophète mangeait comme son peuple, avec ce qu'il avait à disposition."
  tr: "Edam olmadan ekmek yeme yasağına ilişkin bir soru. İslam web sitesi soru-cevapta bu konuda kesin bir hadis bulamadığını ve orijinal kuralın ekmeği yalnız veya edam'da mevcut olanla birlikte yemenin izin verildiğini, Müslümanın edam yükünü üstlenmesinin zorunlu olmadığını belirtti. Peygamber'in, halkı ne yediğini yediği gibi yediğini belirtti."
  id: "Sebuah pertanyaan tentang larangan makan roti tanpa edam. Situs Islam menjawab sesi tanya jawab bahwa mereka tidak menemukan hadits yang dikonfirmasi mengenai hal ini, dan bahwa aturan aslinya adalah makan roti sendiri atau dengan apa yang tersedia di edam diperbolehkan, dan seorang Muslim tidak diwajibkan menanggung beban edam. Mereka menyebutkan bahwa Nabi makan seperti umatnya makan apa pun yang tersedia untuknya."
