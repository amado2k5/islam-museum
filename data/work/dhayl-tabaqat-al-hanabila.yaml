summary:
  ar: "كتاب ابن رجب الحنبلي ⁦(736–795هـ)⁩ في تراجم فقهاء الحنابلة ومحدثيهم، ذيّل به على طبقات ابن أبي يعلى، ورتبه على الوفيات سنةً سنة؛ ويبدأ جزؤه الثاني في طبعة الفقي بوفيات المائة السابعة من سنة 601. يكثر فيه من النقل عن المؤرخين قبله، ثم يعقّب بقوله «قلت» برأيه ونقده."
  en: "Ibn Rajab al-Hanbali's (736–795 AH) biographical dictionary of Hanbali jurists and traditionists, a continuation of Ibn Abi Ya'la's Tabaqat, arranged by year of death; in al-Fiqi's edition its second part opens the deaths of the seventh century from 601 AH. It quotes earlier historians at length and then adds the author's own judgement, introduced by «qultu» (I say)."
  es: "El diccionario biográfico de juristas y tradicionalistas hanbalíes de Ibn Rajab al-Hanbali (736-795 AH), continuación del Tabaqat de Ibn Abi Ya'la, ordenado por año de fallecimiento; en la edición de al-Fiqi, su segunda parte abarca las muertes del siglo VII a partir del 601 AH. Cita extensamente a historiadores anteriores y luego añade el juicio del autor, introducido por «qultu» (yo digo)."
  fr: "Le dictionnaire biographique des juristes et traditionalistes hanbalites d'Ibn Rajab al-Hanbali (736-795 AH), qui fait suite aux Tabaqat d'Ibn Abi Ya'la, est organisé par année de décès. Dans l'édition d'al-Fiqi, sa seconde partie aborde les décès du VIIe siècle à partir de 601 AH. L'ouvrage cite abondamment des historiens antérieurs, puis ajoute le propre jugement de l'auteur, introduit par « qultu » (je dis)."
  ur: "ابن رجب الحنبلی کی ⁦(736-795 ہجری)⁩ حنبلی فقہاء اور محدثین کی سوانحی لغت، ابن ابی یعلی کی طبقات کا تسلسل، سال وفات کے لحاظ سے ترتیب دیا گیا ہے۔ الفقی کے ایڈیشن میں اس کا دوسرا حصہ ساتویں صدی کے 601 ہجری سے ہونے والی وفاتوں کو کھولتا ہے۔ یہ پہلے کے مورخین کا طوالت کے ساتھ حوالہ دیتا ہے اور پھر مصنف کے اپنے فیصلے کو شامل کرتا ہے، جسے «قلتو» ⁦(میں کہتا ہوں)⁩ نے متعارف کرایا ہے۔"
