label: { ar: "الذيل على طبقات الحنابلة", en: "al-Dhayl ala Tabaqat al-Hanabila" }
summary:
  ar: "كتاب ابن رجب الحنبلي (736–795هـ) في تراجم فقهاء الحنابلة ومحدثيهم، ذيّل به على طبقات ابن أبي يعلى، ورتبه على الوفيات سنةً سنة؛ ويبدأ جزؤه الثاني في طبعة الفقي بوفيات المائة السابعة من سنة 601. يكثر فيه من النقل عن المؤرخين قبله، ثم يعقّب بقوله «قلت» برأيه ونقده."
  en: "Ibn Rajab al-Hanbali's (736–795 AH) biographical dictionary of Hanbali jurists and traditionists, a continuation of Ibn Abi Ya'la's Tabaqat, arranged by year of death; in al-Fiqi's edition its second part opens the deaths of the seventh century from 601 AH. It quotes earlier historians at length and then adds the author's own judgement, introduced by «qultu» (I say)."
