summary:
  ar: "السلم المنورق في علم المنطق لعبد الرحمن الأخضري ⁦(ت. 983هـ)⁩ منظومة في مائة وأربعة وأربعين بيتاً على بحر الرجز جمعت أقسام الكلام والمفرد والمركب والتصورات والتصديقات والقياسات والأدلة؛ متن المنطق المدرسي الأول {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Al-Sullam al-Munawraq in the science of logic by Abd al-Rahman al-Akhdari (d. 983 AH) — a didactic poem of a hundred and forty-four rajaz lines gathering the divisions of speech, the simple and the compound, conceptions and assents, syllogisms and proofs; the first logic text of the schools {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Al-Sullam al-Munawraq en la ciencia de la lógica por Abd al-Rahman al-Akhdari (m. 983 AH) — un poema didáctico de ciento cuarenta y cuatro versos rajaz que reúne las divisiones del habla, lo simple y lo compuesto, conceptos y asentimientos, silogismos y demostraciones; el primer texto de lógica de las escuelas {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  fr: "Al-Sullam al-Munawraq dans la science de la logique par Abd al-Rahman al-Akhdari (d. 983 AH) — un poème didactique de cent quarante-quatre lignes rajaz rassemblant les divisions du discours, le simple et le composé, les conceptions et les assentiments, les syllogismes et les preuves; le premier texte de logique des écoles {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "علم منطق میں السلم المنورق از عبدالرحمن الخدری ⁦(متوفی 983ھ)⁩ - ایک سو چالیس رجز سطروں کی ایک نثری نظم ہے جس میں تقریر کی تقسیم، سادہ اور مرکب، تصورات اور اثاثے، صوتیات اور ثبوت شامل ہیں۔ مکاتب کا پہلا منطقی متن {حوالہ: المتون العلمیہ ازہر} {حوالہ: العالم}۔"
