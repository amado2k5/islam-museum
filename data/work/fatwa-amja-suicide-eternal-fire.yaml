id: work/fatwa-amja-suicide-eternal-fire
class: work
kind: fatwa
label: { ar: "هل المنتحر مخلد في النار", en: "Is the suicide eternally in the Fire", ur: "کیا خودکشی کرنے والا ہمیشہ دوزخ میں", es: "¿El suicidio está eternamente en el fuego?", fr: "Le suicide est-il éternellement dans le feu ?", tr: "İntihar eden kişi yangında ölümsüz mü?", id: "Apakah orang yang bunuh diri itu abadi dalam kebakaran" }
summary:
  ar: "سأل سائل عن حديث من تردى من جبل فقتل نفسه فهو في نار جهنم يتردى فيه خالدًا مخلدًا هل يعني ذلك خلود المنتحر المسلم في النار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78687 بتاريخ 28 أبريل 2009)⁩ أن قاتل نفسه جزاؤه الخلود في النار للحديث المذكور وقد يعفو الله عنه فأمره مفوض إلى الله لقوله تعالى إن الله لا يغفر أن يشرك به ويغفر ما دون ذلك لمن يشاء."
  en: "A questioner cited the hadith that one who throws himself from a mountain and kills himself falls forever in hellfire, asking whether the Muslim suicide is eternally damned. Dr. Salah al-Sawi (fatwa no. 78687, 28 April 2009) answered that the self-killer's recompense is eternity in the Fire per the hadith he cited — yet God may pardon him, his affair consigned to God per 'God does not forgive shirk but forgives what is less for whom He wills'."
  ur: "ایک سائل نے خودکشی کے خلود پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78687، 28 اپریل 2009)⁩ کے مطابق حدیث میں خلود کی وعید ہے مگر اللہ معاف کر سکتا ہے — معاملہ اس کے سپرد۔"
  es: "Un consultante citó el hadiz que dice que quien se arroja desde una montaña y se suicida cae eternamente en el fuego del infierno, preguntando si el musulmán que se suicida está condenado eternamente. El Dr. Salah al-Sawi (fatwa n.° 78687, 28 de abril de 2009) respondió que la recompensa del suicida es la eternidad en el Fuego según el hadiz que citó; sin embargo, Dios puede perdonarlo, pues su asunto queda en manos de Dios, pues «Dios no perdona la idolatría, pero perdona lo que es menor a quien Él quiere»."
  fr: "Un interrogateur a cité le hadith selon lequel celui qui se jette du haut d'une montagne et se tue est voué à la damnation éternelle en enfer, demandant si le suicide musulman entraîne la damnation éternelle. Le Dr Salah al-Sawi (fatwa n° 78687, 28 avril 2009) a répondu que, conformément au hadith cité, la rétribution du suicidaire est l'éternité en Enfer; toutefois, Dieu peut lui pardonner, son sort étant entre Ses mains, car « Dieu ne pardonne pas le shirk, mais pardonne ce qui est moindre à qui Il veut »."
  tr: "Bir soru soran kişi, dağdan düşüp kendini öldüren birinin hadisi hakkında soruldu; çünkü o, Cehennem Ateşi'ndedir ve sonsuza dek düşecektir. Bu, intihar eden Müslümanın sonsuza dek ateşte kalacağı anlamına mı gelir? Dr. Salah Al-Sawy (28 Nisan 2009 tarihli 78687 sayılı fetva) şöyle yanıtladı: Bahsedilen hadise göre bir katilin ödülü ateşte ebedi ve Allah onu affetsin. Onun işi Allah'a emanet edilmiştir, Allah'ın dediği gibi: Gerçekten Allah kendisiyle ortakları affetmez, ancak istediğinden daha azını bağışlar."
  id: "Seorang penanya ditanya tentang hadits seseorang yang jatuh dari gunung dan bunuh diri, karena dia berada di Api Neraka, di mana dia akan jatuh selamanya dan selamanya. Apakah ini berarti Muslim yang bunuh diri akan selamanya dalam Api? Dr. Salah Al-Sawy menjawab (Fatwa No. 78687 tanggal 28 April 2009) bahwa balasan bagi pembunuh adalah abadi dalam Api, menurut hadits yang disebutkan, dan Allah dapat mengampuninya. Perkara ini dipercayakan kepada Allah, seperti yang Allah katakan: Sebenarnya, Allah tidak mengampuni rekan yang bersekutu dengannya, tetapi Dia mengampuni lebih sedikit daripada yang Dia kehendaki."
