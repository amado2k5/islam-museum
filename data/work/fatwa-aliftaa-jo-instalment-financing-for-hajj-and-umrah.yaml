id: work/fatwa-aliftaa-jo-instalment-financing-for-hajj-and-umrah
class: work
kind: fatwa
label: { ar: "تمويل رحلات الحج والعمرة بالأقساط عبر بنك", en: "Bank instalment financing for hajj and umrah trips", ur: "بینک کے ذریعے حج و عمرہ کے سفر کی قسطوں میں فنانسنگ", es: "Financiación bancaria a plazos para viajes de Hajj y Umrah.", fr: "Financement bancaire à tempérament pour les voyages du hajj et de l'umra" }
summary:
  ar: "سؤال عن شركة حج وعمرة اتفقت مع بنك على بيع مرابحة للعملاء بالأقساط، أجابت فيه دائرة الإفتاء العام الأردنية بأن تمويل هذه المنافع يُكيّف على أساس الإجارة الموصوفة في الذمة والإجارة الموازية، وبيّنت ضوابطه ومنها منع غرامات التأخير. أجابت الدائرة بأن عقود تمويل المنافع تقوم على اتفاق المؤسسة الممولة مع شركات السياحة والسفر على الشروط والمواصفات التي يطلبها العميل، ثم شراء المؤسسة هذه المنفعة منها وإعادة بيعها للعميل بالتقسيط، وأن هذه العملية تُكيّف على أساس الإجارة الموصوفة في الذمة والإجارة الموازية. وذكرت من ضوابطها أن تكون المنفعة معلومة الصفات، ومتقوَّمة شرعًا وعرفًا، وأن يلتزم الممول بتقديم المنفعة للعميل حتى النهاية، فإن امتنعت الشركة عن تقديم الخدمة رجع العميل على الممول ما لم يكن سبب الامتناع منصوصًا عليه في العقد. وأضافت ألا يشترط الممول على العميل غرامات تأخير عند التأخر في السداد، لأنها من الربا المحرم. وخلصت إلى وجوب إنشاء العقود وفق الإجارة الموصوفة في الذمة والإجارة الموازية وضبطهما بهذه الشروط."
  en: "A question about a hajj and umrah company that agreed with a bank on instalment sales to its clients, in which Jordan's General Iftaa Department answered that financing such services is structured as a lease of a described service owed in liability together with a parallel lease, and set out its conditions, including a ban on late-payment penalties. The Department answered that contracts financing services rest on the financing institution agreeing with the travel companies on the terms and specifications the client requires, buying that service from them, and reselling it to the client in instalments, and that this is structured as a lease of a described service owed in liability (ijara mawsufa fi al-dhimma) together with a parallel lease. Among its conditions it listed that the service be known by its specifications, that it have recognised value in law and custom, and that the financier remain bound to deliver the service to the client to the end, so that if the company refuses to provide the service the client has recourse against the financier, unless the cause of refusal is stated in the contract. It added that the financier may not impose late-payment penalties on the client, because such penalties are forbidden usury. It concluded that the contracts must be drawn up as a lease of a described service owed in liability and a parallel lease, governed by these conditions."
  ur: "حج و عمرہ کی ایک کمپنی کے بارے میں سوال جس نے اپنے گاہکوں کو قسطوں پر فروخت کے لیے بینک سے معاہدہ کیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایسی خدمات کی فنانسنگ ذمے میں موصوف اجارہ اور متوازی اجارے کی بنیاد پر ترتیب دی جاتی ہے، اور اس کی شرائط بیان کیں جن میں تاخیر کے جرمانوں کی ممانعت شامل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ خدمات کی فنانسنگ کے معاہدے اس بنیاد پر ہوتے ہیں کہ فنانسنگ ادارہ ٹریول کمپنیوں سے گاہک کی مطلوبہ شرائط اور خصوصیات پر اتفاق کرے، ان سے یہ خدمت خریدے اور پھر گاہک کو قسطوں پر بیچ دے، اور یہ عمل ذمے میں موصوف اجارہ اور متوازی اجارے کی بنیاد پر ترتیب پاتا ہے۔ اس کی شرائط میں اس نے ذکر کیا کہ خدمت کی خصوصیات معلوم ہوں، وہ شرعاً اور عرفاً قیمت رکھتی ہو، اور فنانسر آخر تک گاہک کو خدمت فراہم کرنے کا پابند رہے، لہٰذا اگر کمپنی خدمت دینے سے انکار کرے تو گاہک فنانسر سے رجوع کرے، سوائے اس کے کہ انکار کا سبب معاہدے میں درج ہو۔ اس نے مزید کہا کہ فنانسر گاہک پر ادائیگی میں تاخیر کے جرمانے نہیں لگا سکتا، کیونکہ یہ حرام سود ہیں۔ اس نے نتیجہ نکالا کہ معاہدے ذمے میں موصوف اجارہ اور متوازی اجارے کے مطابق بنائے جائیں اور ان شرائط کے پابند ہوں۔"
  es: "Una pregunta sobre una empresa de Hajj y Umrah que acordó con un banco la venta a plazos a sus clientes, en la que el Departamento General de Iftaa de Jordania respondió que la financiación de dichos servicios se estructura como un arrendamiento de un servicio descrito, sujeto a una obligación, junto con un arrendamiento paralelo, y estableció sus condiciones, incluyendo la prohibición de penalizaciones por mora. El Departamento respondió que los contratos de financiación de servicios se basan en que la entidad financiera acuerde con las empresas de viajes los términos y especificaciones que el cliente requiere, les compre dicho servicio y se lo revenda al cliente a plazos, y que esto se estructura como un arrendamiento de un servicio descrito, sujeto a una obligación (ijara mawsufa fi al-dhimma), junto con un arrendamiento paralelo. Entre sus condiciones, enumeró que el servicio debe ser conocido por sus especificaciones, que debe tener un valor reconocido por la ley y la costumbre, y que la entidad financiera está obligada a prestar el servicio al cliente hasta el final, de modo que si la empresa se niega a prestar el servicio, el cliente tiene derecho a reclamar contra la entidad financiera, a menos que la causa de la negativa esté estipulada en el contrato. Añadió que la entidad financiera no puede imponer penalizaciones por mora al cliente, ya que dichas penalizaciones constituyen usura prohibida. Concluyó que los contratos deben redactarse como un contrato de arrendamiento de un servicio descrito, sujeto a una obligación, y un contrato de arrendamiento paralelo, regido por estas condiciones."
  fr: "Une question concernait une entreprise organisant des pèlerinages à La Mecque (Hajj et Omra) qui avait conclu un accord avec une banque pour la vente à tempérament à ses clients. Le Département général de l'Iftaa de Jordanie a répondu que le financement de tels services est structuré comme un contrat de location d'un service défini, assorti d'une obligation de paiement, et a précisé ses conditions, notamment l'interdiction des pénalités de retard. Le Département a expliqué que les contrats de financement de services reposent sur l'accord entre l'établissement financier et l'agence de voyages concernant les conditions et spécifications requises par le client, l'achat de ce service auprès de celle-ci et sa revente au client par mensualités. Ce montage est structuré comme un contrat de location d'un service défini, assorti d'une obligation de paiement (ijara mawsufa fi al-dhimma), et d'une obligation de paiement. Parmi les conditions, le Département a indiqué que le service doit être connu par ses spécifications, avoir une valeur reconnue en droit et en coutume, et que le financeur est tenu de fournir le service au client dans son intégralité. Ainsi, si l'entreprise refuse de fournir le service, le client dispose d'un recours contre le financeur, sauf si le motif du refus est stipulé dans le contrat. Il a été précisé que le financier ne peut imposer de pénalités de retard au client, car de telles pénalités constituent une usure interdite. Il a été conclu que les contrats doivent être établis sous la forme d'un contrat de location d'un service décrit et d'un contrat de location parallèle, régi par les présentes conditions."
