id: work/fatwa-aliftaa-jo-instalment-financing-for-hajj-and-umrah
class: work
kind: fatwa
label: { ar: "تمويل رحلات الحج والعمرة بالأقساط عبر بنك", en: "Bank instalment financing for hajj and umrah trips", ur: "بینک کے ذریعے حج و عمرہ کے سفر کی قسطوں میں فنانسنگ" }
summary:
  ar: "سؤال عن شركة حج وعمرة اتفقت مع بنك على بيع مرابحة للعملاء بالأقساط، أجابت فيه دائرة الإفتاء العام الأردنية بأن تمويل هذه المنافع يُكيّف على أساس الإجارة الموصوفة في الذمة والإجارة الموازية، وبيّنت ضوابطه ومنها منع غرامات التأخير. أجابت الدائرة بأن عقود تمويل المنافع تقوم على اتفاق المؤسسة الممولة مع شركات السياحة والسفر على الشروط والمواصفات التي يطلبها العميل، ثم شراء المؤسسة هذه المنفعة منها وإعادة بيعها للعميل بالتقسيط، وأن هذه العملية تُكيّف على أساس الإجارة الموصوفة في الذمة والإجارة الموازية. وذكرت من ضوابطها أن تكون المنفعة معلومة الصفات، ومتقوَّمة شرعًا وعرفًا، وأن يلتزم الممول بتقديم المنفعة للعميل حتى النهاية، فإن امتنعت الشركة عن تقديم الخدمة رجع العميل على الممول ما لم يكن سبب الامتناع منصوصًا عليه في العقد. وأضافت ألا يشترط الممول على العميل غرامات تأخير عند التأخر في السداد، لأنها من الربا المحرم. وخلصت إلى وجوب إنشاء العقود وفق الإجارة الموصوفة في الذمة والإجارة الموازية وضبطهما بهذه الشروط."
  en: "A question about a hajj and umrah company that agreed with a bank on instalment sales to its clients, in which Jordan's General Iftaa Department answered that financing such services is structured as a lease of a described service owed in liability together with a parallel lease, and set out its conditions, including a ban on late-payment penalties. The Department answered that contracts financing services rest on the financing institution agreeing with the travel companies on the terms and specifications the client requires, buying that service from them, and reselling it to the client in instalments, and that this is structured as a lease of a described service owed in liability (ijara mawsufa fi al-dhimma) together with a parallel lease. Among its conditions it listed that the service be known by its specifications, that it have recognised value in law and custom, and that the financier remain bound to deliver the service to the client to the end, so that if the company refuses to provide the service the client has recourse against the financier, unless the cause of refusal is stated in the contract. It added that the financier may not impose late-payment penalties on the client, because such penalties are forbidden usury. It concluded that the contracts must be drawn up as a lease of a described service owed in liability and a parallel lease, governed by these conditions."
  ur: "حج و عمرہ کی ایک کمپنی کے بارے میں سوال جس نے اپنے گاہکوں کو قسطوں پر فروخت کے لیے بینک سے معاہدہ کیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایسی خدمات کی فنانسنگ ذمے میں موصوف اجارہ اور متوازی اجارے کی بنیاد پر ترتیب دی جاتی ہے، اور اس کی شرائط بیان کیں جن میں تاخیر کے جرمانوں کی ممانعت شامل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ خدمات کی فنانسنگ کے معاہدے اس بنیاد پر ہوتے ہیں کہ فنانسنگ ادارہ ٹریول کمپنیوں سے گاہک کی مطلوبہ شرائط اور خصوصیات پر اتفاق کرے، ان سے یہ خدمت خریدے اور پھر گاہک کو قسطوں پر بیچ دے، اور یہ عمل ذمے میں موصوف اجارہ اور متوازی اجارے کی بنیاد پر ترتیب پاتا ہے۔ اس کی شرائط میں اس نے ذکر کیا کہ خدمت کی خصوصیات معلوم ہوں، وہ شرعاً اور عرفاً قیمت رکھتی ہو، اور فنانسر آخر تک گاہک کو خدمت فراہم کرنے کا پابند رہے، لہٰذا اگر کمپنی خدمت دینے سے انکار کرے تو گاہک فنانسر سے رجوع کرے، سوائے اس کے کہ انکار کا سبب معاہدے میں درج ہو۔ اس نے مزید کہا کہ فنانسر گاہک پر ادائیگی میں تاخیر کے جرمانے نہیں لگا سکتا، کیونکہ یہ حرام سود ہیں۔ اس نے نتیجہ نکالا کہ معاہدے ذمے میں موصوف اجارہ اور متوازی اجارے کے مطابق بنائے جائیں اور ان شرائط کے پابند ہوں۔"
