summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: تأجيل النظر في بيع الاسم التجاري والترخيص إلى الدورة الخامسة لاستيفاء دراسته مع مراعاة أمور منها منهجية متقاربة في البحث وتحرير المسألة وتحديد نطاق المصطلحات المتداولة على ما فصّل."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on selling a trade name and licensing: it deferred the subject to the fifth session for full study, noting among other things the need for a coherent methodology that defines the question and the scope of the terms in circulation."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩ تجارتی نام کی فروخت پر: موضوع پانچویں مجلس تک مؤخر، منہج اور اصطلاحات کی وضاحت کی ہدایت کے ساتھ۔"
  es: "La resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre la venta de nombres comerciales y la concesión de licencias: aplazó el tema a la quinta sesión para su estudio exhaustivo, señalando, entre otras cosas, la necesidad de una metodología coherente que defina la cuestión y el alcance de los términos en circulación."
