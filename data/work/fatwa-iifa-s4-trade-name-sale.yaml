label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن بيع الاسم التجاري والترخيص", en: "IIFA resolution on selling a trade name and licensing", ur: "اکیڈمی کی قرارداد: تجارتی نام کی فروخت اور لائسنس", es: "Resolución de la IIFA sobre la venta de una marca comercial y la concesión de licencias.", fr: "Résolution de l'IIFA sur la vente d'une marque commerciale et l'octroi de licences", tr: "Uluslararası İslami Fiqh Akademisi'nin ticari isimlerin satışı ve lisanslama ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penjualan nama dagang dan lisensi" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: تأجيل النظر في بيع الاسم التجاري والترخيص إلى الدورة الخامسة لاستيفاء دراسته مع مراعاة أمور منها منهجية متقاربة في البحث وتحرير المسألة وتحديد نطاق المصطلحات المتداولة على ما فصّل."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on selling a trade name and licensing: it deferred the subject to the fifth session for full study, noting among other things the need for a coherent methodology that defines the question and the scope of the terms in circulation."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩ تجارتی نام کی فروخت پر: موضوع پانچویں مجلس تک مؤخر، منہج اور اصطلاحات کی وضاحت کی ہدایت کے ساتھ۔"
  es: "La resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre la venta de nombres comerciales y la concesión de licencias: aplazó el tema a la quinta sesión para su estudio exhaustivo, señalando, entre otras cosas, la necesidad de una metodología coherente que defina la cuestión y el alcance de los términos en circulación."
  fr: "Résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur la vente d'une marque commerciale et l'octroi de licences: elle a reporté la question à la cinquième session pour une étude approfondie, notant entre autres la nécessité d'une méthodologie cohérente qui définisse la question et la portée des termes en circulation."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin dördüncü oturumunda (Cidde, Şubat 1988) kararı: Ticari ismin satışı ve lisanslamasının incelenmesinin, araştırmada benzer bir metodoloji dahil olmak üzere dikkate alınarak beşinci oturuma ertelenmesi, konunun iyileştirilmesi ve yaygın kullanılan terimlerin kapsamının ayrıntılı olarak tanımlanması."
  id: "Keputusan International Islamic Fiqh Academy dalam sesi keempatnya (Jeddah, Februari 1988): Penundaan pertimbangan penjualan nama dagang dan perizinan hingga sesi kelima untuk menyelesaikan studinya, dengan mempertimbangkan hal-hal termasuk metodologi serupa dalam penelitian, penyempurnaan isu, dan penentuan cakupan istilah yang umum digunakan secara rinci."
