label: { ar: "قرآني الأول ⁦(مايفا)⁩ من مجموعة شامل", en: "My First Al-Qur'an (MyFA, Syaamil)", ur: "مائی فرسٹ القرآن ⁦(مائفا، شامل)⁩", es: "Mi primer Corán (MyFA, Syaamil)", fr: "Mon premier Coran (MyFA, Syaamil)", tr: "İlk Kur'anım (Maeva) Shamel Grubu'ndan", id: "Al-Qur'an pertama saya (Maeva) dari Shamel Group" }
summary:
  ar: "مصحف إندونيسي للأطفال أطلقته مجموعة شامل في باندونغ سنة 2010، في جزأين: المصحف العربي في مجلدين، والترجمة الرسمية لوزارة الشؤون الدينية في طبعة 2004 بنصها في مجلدين مع السيرة وقصص الأنبياء وخريطة لرحلة الدعوة وفقرات «الآن عرفت» ومعجم ثلاثي اللغة، مطبوع على ورق ملوّن بغلاف متين؛ وكان من أنجح منتجات المجموعة بين 2010 و2012، وبيع مع قلم إلكتروني."
  en: "An Indonesian children's Qur'an launched by the Syaamil Group of Bandung in 2010, in two parts: the Arabic mushaf in two volumes, and the 2004 edition of the Ministry of Religious Affairs translation, verbatim, in two volumes with the sira, stories of the prophets, a map of the Prophet's da'wa journeys, 'Now I Know' notes and a trilingual dictionary, printed on coloured paper with a durable cover; it was among the group's most successful products in 2010–2012 and was sold with an e-pen."
  ur: "بچوں کا انڈونیشیائی قرآن جو باندونگ کے شامل گروپ نے 2010 میں جاری کیا، دو حصوں میں: عربی مصحف دو جلدوں میں، اور وزارتِ مذہبی امور کے ترجمے کی 2004 کی اشاعت بعینہٖ دو جلدوں میں، سیرت، انبیا کے قصوں، دعوتی سفروں کے نقشے، «اب میں جان گیا» کے نوٹس اور سہ لسانی لغت کے ساتھ، رنگین کاغذ اور مضبوط جلد پر؛ یہ 2010 سے 2012 تک گروپ کی کامیاب ترین مصنوعات میں تھا اور الیکٹرانک قلم کے ساتھ فروخت ہوا۔"
  es: "El grupo Syaamil de Bandung lanzó en 2010 una edición indonesia del Corán para niños, en dos partes: el mushaf árabe en dos volúmenes y la edición de 2004 de la traducción del Ministerio de Asuntos Religiosos, textual, en dos volúmenes con la sira, historias de los profetas, un mapa de los viajes de da'wa del Profeta, notas \"Ahora lo sé\" y un diccionario trilingüe, impreso en papel de color con una cubierta resistente; fue uno de los productos más exitosos del grupo entre 2010 y 2012 y se vendía con un lápiz electrónico."
  fr: "Un Coran indonésien pour enfants, lancé par le groupe Syaamil de Bandung en 2010, en deux parties: le mushaf arabe en deux volumes et l’édition 2004 de la traduction du ministère des Affaires religieuses, littérale, en deux volumes avec la sira, des histoires des prophètes, une carte des voyages de da’wa du Prophète, des notes « Maintenant je sais » et un dictionnaire trilingue, imprimé sur du papier coloré avec une couverture résistante; il a été l’un des produits les plus réussis du groupe entre 2010 et 2012 et était vendu avec un stylo électronique."
  tr: "2010 yılında Bandung'da Shamel Group tarafından iki bölümden oluşan Endonezya çocuk Kur'anıdır: iki ciltlik Arapça Kur'an ve 2004 baskısında Dini İşler Bakanlığı tarafından resmi çeviri; metni biyografi, peygamberlerin hikayeleri, misyon yolculuğunun haritası, \"Şimdi Biliyorum\" adlı paragraflar ve renkli kağıda basılmış sağlam kapaklı üç dilli sözlük ile iki ciltlik metni içerir; 2010-2012 yılları arasında grubun en başarılı ürünlerinden biri olmuş, elektronik kalemle satılmıştır."
  id: "Al-Qur'an anak-anak Indonesia yang diluncurkan oleh Shamel Group di Bandung pada tahun 2010, dalam dua bagian: Al-Qur'an Arab dalam dua volume, dan terjemahan resmi oleh Kementerian Urusan Agama pada edisi 2004 dengan teksnya dalam dua jilid berisi biografi, kisah para nabi, peta perjalanan misi, paragraf dari \"Now I Know,\" dan kamus trilingual yang dicetak di atas kertas berwarna dengan sampul yang kokoh; ini adalah salah satu produk paling sukses grup tersebut antara tahun 2010 dan 2012, dijual dengan pena elektronik."
