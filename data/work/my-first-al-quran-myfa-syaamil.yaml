summary:
  ar: "مصحف إندونيسي للأطفال أطلقته مجموعة شامل في باندونغ سنة 2010، في جزأين: المصحف العربي في مجلدين، والترجمة الرسمية لوزارة الشؤون الدينية في طبعة 2004 بنصها في مجلدين مع السيرة وقصص الأنبياء وخريطة لرحلة الدعوة وفقرات «الآن عرفت» ومعجم ثلاثي اللغة، مطبوع على ورق ملوّن بغلاف متين؛ وكان من أنجح منتجات المجموعة بين 2010 و2012، وبيع مع قلم إلكتروني."
  en: "An Indonesian children's Qur'an launched by the Syaamil Group of Bandung in 2010, in two parts: the Arabic mushaf in two volumes, and the 2004 edition of the Ministry of Religious Affairs translation, verbatim, in two volumes with the sira, stories of the prophets, a map of the Prophet's da'wa journeys, 'Now I Know' notes and a trilingual dictionary, printed on coloured paper with a durable cover; it was among the group's most successful products in 2010–2012 and was sold with an e-pen."
  ur: "بچوں کا انڈونیشیائی قرآن جو باندونگ کے شامل گروپ نے 2010 میں جاری کیا، دو حصوں میں: عربی مصحف دو جلدوں میں، اور وزارتِ مذہبی امور کے ترجمے کی 2004 کی اشاعت بعینہٖ دو جلدوں میں، سیرت، انبیا کے قصوں، دعوتی سفروں کے نقشے، «اب میں جان گیا» کے نوٹس اور سہ لسانی لغت کے ساتھ، رنگین کاغذ اور مضبوط جلد پر؛ یہ 2010 سے 2012 تک گروپ کی کامیاب ترین مصنوعات میں تھا اور الیکٹرانک قلم کے ساتھ فروخت ہوا۔"
