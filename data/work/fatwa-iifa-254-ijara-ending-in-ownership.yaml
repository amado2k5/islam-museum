label: { ar: "قرار مجمع الفقه الإسلامي الدولي 254 (25/16) بشأن تجديد النظر في قضايا مستجدة في التطبيقات المعاصرة للإجارة المنتهية بالتمليك", en: "IIFA resolution 254 (25/16) on renewing consideration of new issues in contemporary applications of lease ending in ownership", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 254 (25/16): تملیک پر ختم ہونے والے اجارے کے عصری اطلاقات میں نئے مسائل پر نظرِ ثانی", es: "Resolución 254 (25/16) de la IIFA sobre la revisión de nuevas cuestiones en las aplicaciones contemporáneas del arrendamiento que termina en propiedad.", fr: "Résolution 254 (25/16) de l'IIFA relative au réexamen des nouvelles questions soulevées par les applications contemporaines des contrats de location-acquisition" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. اطلع المجمع على قراراته السابقة في الموضوع: قرار 44 ⁦(5/6)⁩ في الإيجار المنتهي بالتمليك، وقرار 110 ⁦(12/4)⁩ في الإيجار المنتهي بالتمليك وصكوك التأجير، وقرار 115 ⁦(9/12)⁩ في التضخم وتغير قيمة العملة، وقرار 228 ⁦(23/12)⁩ في قضايا الصكوك، وقرار 238 ⁦(24/9)⁩ في التحوط في المؤسسات المالية الإسلامية، وعلى البحوث المقدمة، وقرر تأجيل البت في الموضوع لمزيد من البحث والدراسة مع التوصية بعقد ندوة متخصصة حوله."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). After reviewing its earlier resolutions on the subject — 44 (5/6) on lease ending in ownership, 110 (12/4) on the same and on ijara sukuk, 115 (9/12) on inflation and the change in currency value, 228 (23/12) on sukuk questions and 238 (24/9) on hedging in Islamic financial institutions — and the submitted research, it decided to defer a ruling on the new issues in contemporary applications of lease ending in ownership for further research and study, recommending a specialised seminar."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے اپنی پچھلی قراردادوں — 44 ⁦(5/6)⁩ ⁦(تملیک پر ختم ہونے والا اجارہ)⁩، 110 ⁦(12/4)⁩ ⁦(وہی موضوع اور اجارہ صکوک)⁩، 115 ⁦(9/12)⁩ ⁦(مہنگائی اور کرنسی کی قدر میں تبدیلی)⁩، 228 ⁦(23/12)⁩ ⁦(صکوک کے مسائل)⁩ اور 238 ⁦(24/9)⁩ ⁦(اسلامی مالیاتی اداروں میں ہیجنگ)⁩ — اور پیش کردہ تحقیقات کا جائزہ لیا، اور تملیک پر ختم ہونے والے اجارے کے عصری اطلاقات میں نئے مسائل پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرتے ہوئے ایک مخصوص سیمینار کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023). Tras revisar sus resoluciones anteriores sobre el tema —44 (5/6) sobre arrendamiento que termina en propiedad, 110 (12/4) sobre el mismo y sobre ijara sukuk, 115 (9/12) sobre inflación y cambio de valor de la moneda, 228 (23/12) sobre cuestiones de sukuk y 238 (24/9) sobre cobertura en instituciones financieras islámicas— y la investigación presentada, decidió aplazar un dictamen sobre las nuevas cuestiones en las aplicaciones contemporáneas del arrendamiento que termina en propiedad para una mayor investigación y estudio, recomendando un seminario especializado."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023). Après avoir examiné ses résolutions antérieures sur le sujet — la résolution 44 (5/6) relative aux contrats de location avec option d'achat, la résolution 110 (12/4) sur le même sujet et sur les sukuk ijara, la résolution 115 (9/12) sur l'inflation et la variation du taux de change, la résolution 228 (23/12) sur les questions relatives aux sukuk et la résolution 238 (24/9) sur la couverture des risques dans les institutions financières islamiques — ainsi que les recherches soumises, elle a décidé de reporter sa décision sur les nouvelles problématiques liées aux applications contemporaines des contrats de location avec option d'achat afin de permettre des recherches et des études complémentaires, et a recommandé la tenue d'un séminaire spécialisé."
