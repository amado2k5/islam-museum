label: { ar: "قرار مجمع الفقه الإسلامي الدولي 254 (25/16) بشأن تجديد النظر في قضايا مستجدة في التطبيقات المعاصرة للإجارة المنتهية بالتمليك", en: "IIFA resolution 254 (25/16) on renewing consideration of new issues in contemporary applications of lease ending in ownership", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 254 (25/16): تملیک پر ختم ہونے والے اجارے کے عصری اطلاقات میں نئے مسائل پر نظرِ ثانی" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. اطلع المجمع على قراراته السابقة في الموضوع: قرار 44 ⁦(5/6)⁩ في الإيجار المنتهي بالتمليك، وقرار 110 ⁦(12/4)⁩ في الإيجار المنتهي بالتمليك وصكوك التأجير، وقرار 115 ⁦(9/12)⁩ في التضخم وتغير قيمة العملة، وقرار 228 ⁦(23/12)⁩ في قضايا الصكوك، وقرار 238 ⁦(24/9)⁩ في التحوط في المؤسسات المالية الإسلامية، وعلى البحوث المقدمة، وقرر تأجيل البت في الموضوع لمزيد من البحث والدراسة مع التوصية بعقد ندوة متخصصة حوله."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). After reviewing its earlier resolutions on the subject — 44 (5/6) on lease ending in ownership, 110 (12/4) on the same and on ijara sukuk, 115 (9/12) on inflation and the change in currency value, 228 (23/12) on sukuk questions and 238 (24/9) on hedging in Islamic financial institutions — and the submitted research, it decided to defer a ruling on the new issues in contemporary applications of lease ending in ownership for further research and study, recommending a specialised seminar."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے اپنی پچھلی قراردادوں — 44 ⁦(5/6)⁩ ⁦(تملیک پر ختم ہونے والا اجارہ)⁩، 110 ⁦(12/4)⁩ ⁦(وہی موضوع اور اجارہ صکوک)⁩، 115 ⁦(9/12)⁩ ⁦(مہنگائی اور کرنسی کی قدر میں تبدیلی)⁩، 228 ⁦(23/12)⁩ ⁦(صکوک کے مسائل)⁩ اور 238 ⁦(24/9)⁩ ⁦(اسلامی مالیاتی اداروں میں ہیجنگ)⁩ — اور پیش کردہ تحقیقات کا جائزہ لیا، اور تملیک پر ختم ہونے والے اجارے کے عصری اطلاقات میں نئے مسائل پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرتے ہوئے ایک مخصوص سیمینار کی سفارش کی۔"
