  ar: "فن التقطيع الشعري والقافية، كتاب في العروض والقوافي لمؤلفه صفاء خلوصي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نُشر 1962–1963م; ت 1995م {cite:mustansiriyah-fann-al-taqti-al-shiri-wa-al-qafiya}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "Fann al-Taqti al-Shiri wa-l-Qafiya, a book on prosody (arud and qawafi) by Safa' Khulusi; its date in a research summary supplied to the museum is pub. 1962–1963 CE; d. 1995 CE {cite:mustansiriyah-fann-al-taqti-al-shiri-wa-al-qafiya}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "فن التقطيع الشعري والقافية، عروض و قوافی پر ایک کتاب، مصنف صفاء خلوصي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: اشاعت 1962–1963ء; وفات 1995ء {cite:mustansiriyah-fann-al-taqti-al-shiri-wa-al-qafiya}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Fann al-Taqti al-Shiri wa-l-Qafiya, livre sur la prosodie (arud et qawafi) de Safa' Khulusi ; sa date dans une synthèse de recherche remise au musée : publ. 1962–1963; m. 1995 {cite:mustansiriyah-fann-al-taqti-al-shiri-wa-al-qafiya}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "Fann al-Taqti al-Shiri wa-l-Qafiya, libro sobre prosodia (arud y qawafi) de Safa' Khulusi; su fecha en un resumen de investigación entregado al museo: publ. 1962–1963; m. 1995 {cite:mustansiriyah-fann-al-taqti-al-shiri-wa-al-qafiya}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
