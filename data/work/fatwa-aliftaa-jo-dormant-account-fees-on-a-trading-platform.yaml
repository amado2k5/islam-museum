label: { ar: "رسوم الحساب غير النشط في شركات تداول الأسهم", en: "Dormant-account fees at share-trading brokers", ur: "حصص کی ٹریڈنگ کمپنیوں میں غیر فعال اکاؤنٹ کی فیس", es: "Comisiones por cuentas inactivas en los intermediarios de bolsa.", fr: "Frais de compte inactif chez les courtiers en actions", tr: "Hisse Senedi İşlem Şirketlerinde Etkin Olmayan Hesap Ücretleri", id: "Biaya Akun Tidak Aktif di Perusahaan Perdagangan Saham" }
summary:
  ar: "سؤال عن شركة وساطة في الأسهم تشترط رسمًا قدره مئة دولار على الحساب الذي لا يُتداول فيه أحد عشر شهرًا متواصلة، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذا الشرط محرم لأنه أكل لأموال الناس بالباطل. بيّنت الدائرة أن المستثمر في الأسهم يشتري ويبيع لتحقيق الربح، وتأخذ شركة الوساطة عمولتها عند البيع والشراء، وقد يحتفظ بالأسهم سنوات لأرباحها أو يجمد التداول حتى ترتفع قيمتها حماية لرأس ماله، فيصير الحساب راكدًا. وقالت إن فرض الشركة غرامة على الحساب الراكد أكل لأموال الناس بالباطل، لأنها لا تتحمل شيئًا من عمل أو مال بسبب تجميده، وإنما تفقد العمولة فتعوضها بالغرامة. وخلصت إلى أنه يحرم على الشركة أن تشترط ذلك."
  en: "A question on a share broker whose contract charges a $100 fee on any account with no trades for eleven consecutive months, in which Jordan's General Iftaa Department answered that the condition is forbidden, as consuming people's wealth wrongfully. The Department explained that a share investor buys and sells for profit, the broker taking its commission on each purchase and sale, and that an investor may hold shares for years for their dividends, or freeze trading until their value recovers to protect his capital, leaving the account dormant. It said a broker's fee on a dormant account is consuming people's wealth wrongfully, since freezing the account costs it no work or money; it only loses its commission and makes it up with the fee. It concluded that the company may not impose this condition."
  ur: "حصص کے ایک بروکر کے بارے میں سوال جس کا معاہدہ ہر اس اکاؤنٹ پر سو ڈالر فیس لیتا ہے جس میں مسلسل گیارہ ماہ کوئی لین دین نہ ہو، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط حرام ہے کیونکہ یہ لوگوں کا مال ناحق کھانا ہے۔ ڈیپارٹمنٹ نے واضح کیا کہ حصص کا سرمایہ کار منافع کے لیے خرید و فروخت کرتا ہے اور بروکر ہر خرید و فروخت پر کمیشن لیتا ہے، اور سرمایہ کار منافع کے لیے برسوں حصص رکھ سکتا ہے یا اپنے سرمائے کی حفاظت کے لیے قیمت بڑھنے تک ٹریڈنگ روک سکتا ہے، جس سے اکاؤنٹ غیر فعال ہو جاتا ہے۔ اس نے کہا کہ غیر فعال اکاؤنٹ پر بروکر کی فیس لوگوں کا مال ناحق کھانا ہے، کیونکہ اکاؤنٹ روکنے سے اس پر کوئی محنت یا مالی بوجھ نہیں پڑتا؛ وہ صرف اپنا کمیشن کھوتا ہے اور فیس سے اس کی تلافی کرتا ہے۔ اس نے نتیجہ نکالا کہ کمپنی کے لیے یہ شرط لگانا حرام ہے۔"
  es: "Una consulta sobre un corredor de bolsa cuyo contrato cobra una comisión de 100 dólares por cada cuenta sin operaciones durante once meses consecutivos, a la que el Departamento General de Iftaa de Jordania respondió que esta condición está prohibida, ya que supone un despilfarro indebido del patrimonio de las personas. El Departamento explicó que un inversor en acciones compra y vende para obtener ganancias, y que el corredor cobra su comisión por cada compra y venta. Asimismo, indicó que un inversor puede conservar las acciones durante años para obtener dividendos o suspender las operaciones hasta que su valor se recupere, protegiendo así su capital y dejando la cuenta inactiva. Afirmó que el cobro de una comisión por una cuenta inactiva supone un despilfarro indebido del patrimonio de las personas, puesto que suspender la cuenta no le supone ningún coste; simplemente pierde su comisión y la compensa con la tarifa. Concluyó que la empresa no puede imponer esta condición."
  fr: "Une question concernait un courtier dont le contrat prévoyait des frais de 100 dollars pour tout compte resté inactif pendant onze mois consécutifs. Le Département général de la Cour islamique de Jordanie (Iftaa) a répondu que cette condition était interdite, car elle constituait un détournement de fonds. Le Département a expliqué qu'un investisseur achète et vend des actions dans un but lucratif, le courtier percevant sa commission sur chaque transaction. Un investisseur peut conserver ses actions pendant des années pour percevoir les dividendes, ou suspendre ses transactions jusqu'à ce que leur valeur se redresse afin de protéger son capital, laissant ainsi le compte inactif. Le Département a affirmé que les frais prélevés par le courtier sur un compte inactif représentaient un détournement de fonds, car le blocage du compte ne lui occasionnait aucun travail ni dépense; il perdait simplement sa commission, compensée par ces frais. Il a conclu que la société n'était pas autorisée à imposer cette condition."
  tr: "On bir ay boyunca kesintisiz işlem görmeyen bir hesap için yüz dolar ücret talep eden bir borsa aracı kurumu hakkında soruya Ürdün Genel Fetva Dairesi, bu şartın yasa dışı şekilde insanların parasını tükettiğini söyledi. Bakanlık, yatırımcının kâr etmek için hisse senedi alıp sattığını, aracı kurumun ise alım-satımdan komisyon aldığını, sermayesini korumak için hisseleri yıllarca elinde tutabileceğini veya değer artana kadar ticareti dondurabileceğini, böylece hesabı pasif hale getirebileceğini açıkladı. Hareketsiz bir hesaba para cezası vermenin, insanların parasını yasa dışı şekilde tüketmek olduğunu, çünkü para dondurulduğunda para veya iş taşımadığını, bunun yerine komisyonu kaybedip para cezası ile telafi ettirdiğini belirtti. Şirketin bunu talep etmesinin yasak olduğu sonucuna varıldı."
  id: "Sebuah pertanyaan tentang perusahaan pialang saham yang mengenakan biaya seratus dolar pada akun yang tidak diperdagangkan secara terus-menerus selama sebelas bulan, Departemen Fatwa Umum Yordania menanggapi bahwa kondisi ini dilarang karena secara ilegal mengonsumsi uang orang. Departemen menjelaskan bahwa investor membeli dan menjual saham untuk mendapatkan keuntungan, dan perusahaan pialang mengambil komisi dari pembelian dan penjualan, serta dapat memegang saham selama bertahun-tahun untuk keuntungan atau membekukan perdagangan sampai nilainya naik untuk melindungi modal, sehingga akun tersebut tidak aktif. Departemen tersebut menyatakan bahwa mengenakan denda pada rekening yang dorman berarti mengonsumsi uang orang secara ilegal, karena tidak memiliki bisnis atau uang akibat pembekuan, melainkan kehilangan komisi dan menggantinya dengan denda. Departemen menyimpulkan bahwa dilarang bagi perusahaan untuk mewajibkan hal ini."
