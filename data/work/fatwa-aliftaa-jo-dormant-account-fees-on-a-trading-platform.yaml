id: work/fatwa-aliftaa-jo-dormant-account-fees-on-a-trading-platform
class: work
kind: fatwa
label: { ar: "رسوم الحساب غير النشط في شركات تداول الأسهم", en: "Dormant-account fees at share-trading brokers", ur: "حصص کی ٹریڈنگ کمپنیوں میں غیر فعال اکاؤنٹ کی فیس" }
summary:
  ar: "سؤال عن شركة وساطة في الأسهم تشترط رسمًا قدره مئة دولار على الحساب الذي لا يُتداول فيه أحد عشر شهرًا متواصلة، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذا الشرط محرم لأنه أكل لأموال الناس بالباطل. بيّنت الدائرة أن المستثمر في الأسهم يشتري ويبيع لتحقيق الربح، وتأخذ شركة الوساطة عمولتها عند البيع والشراء، وقد يحتفظ بالأسهم سنوات لأرباحها أو يجمد التداول حتى ترتفع قيمتها حماية لرأس ماله، فيصير الحساب راكدًا. وقالت إن فرض الشركة غرامة على الحساب الراكد أكل لأموال الناس بالباطل، لأنها لا تتحمل شيئًا من عمل أو مال بسبب تجميده، وإنما تفقد العمولة فتعوضها بالغرامة. وخلصت إلى أنه يحرم على الشركة أن تشترط ذلك."
  en: "A question on a share broker whose contract charges a $100 fee on any account with no trades for eleven consecutive months, in which Jordan's General Iftaa Department answered that the condition is forbidden, as consuming people's wealth wrongfully. The Department explained that a share investor buys and sells for profit, the broker taking its commission on each purchase and sale, and that an investor may hold shares for years for their dividends, or freeze trading until their value recovers to protect his capital, leaving the account dormant. It said a broker's fee on a dormant account is consuming people's wealth wrongfully, since freezing the account costs it no work or money; it only loses its commission and makes it up with the fee. It concluded that the company may not impose this condition."
  ur: "حصص کے ایک بروکر کے بارے میں سوال جس کا معاہدہ ہر اس اکاؤنٹ پر سو ڈالر فیس لیتا ہے جس میں مسلسل گیارہ ماہ کوئی لین دین نہ ہو، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط حرام ہے کیونکہ یہ لوگوں کا مال ناحق کھانا ہے۔ ڈیپارٹمنٹ نے واضح کیا کہ حصص کا سرمایہ کار منافع کے لیے خرید و فروخت کرتا ہے اور بروکر ہر خرید و فروخت پر کمیشن لیتا ہے، اور سرمایہ کار منافع کے لیے برسوں حصص رکھ سکتا ہے یا اپنے سرمائے کی حفاظت کے لیے قیمت بڑھنے تک ٹریڈنگ روک سکتا ہے، جس سے اکاؤنٹ غیر فعال ہو جاتا ہے۔ اس نے کہا کہ غیر فعال اکاؤنٹ پر بروکر کی فیس لوگوں کا مال ناحق کھانا ہے، کیونکہ اکاؤنٹ روکنے سے اس پر کوئی محنت یا مالی بوجھ نہیں پڑتا؛ وہ صرف اپنا کمیشن کھوتا ہے اور فیس سے اس کی تلافی کرتا ہے۔ اس نے نتیجہ نکالا کہ کمپنی کے لیے یہ شرط لگانا حرام ہے۔"
