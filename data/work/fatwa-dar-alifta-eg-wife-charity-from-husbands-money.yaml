id: work/fatwa-dar-alifta-eg-wife-charity-from-husbands-money
class: work
kind: fatwa
label: { ar: "حكم تصدق الزوجة من مال زوجها", en: "The wife giving charity from her husband's money", ur: "بیوی کا شوہر کے مال سے صدقہ کرنا", es: "La esposa donando dinero de su marido a la caridad", fr: "L'épouse qui fait des dons caritatifs avec l'argent de son mari" }
summary:
  ar: "سائل سأل عن تصدق الزوجة من مال زوجها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21609)⁩ أنه لا يجوز للزوجة أن تتصدق من مال زوجها بالشيء الثمين حتى يأذن لها صراحةً أما الشيء اليسير الذي يُعلم أنه لا يأبه به الزوج فتفصيله في الجواب."
  en: "A questioner asked about the wife giving charity from her husband's money. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21609) answered that she may not give valuable things without his explicit permission; the case of the trifling thing he is known not to care about is set out in the answer."
  ur: "ایک سائل نے بیوی کے شوہر کے مال سے صدقہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21609)⁩ نے جواب دیا کہ قیمتی چیز اس کی صریح اجازت کے بغیر نہیں دی جا سکتی؛ معمولی چیز جس کی شوہر پرواہ نہیں کرتا اس کا حکم جواب میں ہے۔"
  es: "Una persona preguntó sobre la posibilidad de que la esposa diera limosna con el dinero de su marido. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21609) respondió que ella no puede dar objetos de valor sin su permiso explícito; el caso de un objeto insignificante que se sabe que a él no le importa se expone en la respuesta."
  fr: "Une personne a posé une question concernant le don d'aumônes par une épouse utilisant l'argent de son mari. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21609) a répondu qu'elle ne peut donner de biens de valeur sans son autorisation expresse; le cas d'une chose insignifiante à laquelle il est connu pour ne pas accorder d'importance est exposé dans la réponse."
