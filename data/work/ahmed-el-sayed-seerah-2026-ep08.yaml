id: work/ahmed-el-sayed-seerah-2026-ep08
class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 8: \"قم فأنذر\" بداية الدعوة النبوية"
  en: "The Biography of the Messenger of God 2026, episode 8: Rise and warn: the beginning of the prophetic call"
  ur: "سیرتِ رسول اللہ 2026، قسط 8: اٹھو اور خبردار کرو: نبوی دعوت کا آغاز"
  fr: "La biographie du Messager de Dieu 2026, épisode 8 : Lève-toi et avertis : le début de l'appel prophétique"
  es: "La biografía del Mensajero de Dios 2026, episodio 8: Levántate y advierte: el comienzo de la llamada profética"
summary:
  ar: "يجمع أحمد السيد أولًا ما أورده ابن كثير من روايات في كيفية مجيء الوحي إلى النبي، ثم يتناول الصلاة في أول الأمر ورواية ابن إسحاق عن فرضها. ثم يقرأ مطلع سورة المدثر بوصفه أول أوامر الدعوة، وأخيرًا يقرأ ابن إسحاق وابن هشام في أوائل المسلمين قبل الجهر بالدعوة، مستكملًا ذلك بتراجم من طبقات ابن سعد."
  en: "Ahmed Elsayed first gathers Ibn Kathir's compilation of reports on how revelation came to the Prophet, then treats the early prayer and Ibn Ishaq's account of its institution. He then reads the opening of surat al-Muddaththir as the first commands of the call, and finally reads Ibn Ishaq and Ibn Hisham on the first Muslims before the public call, supplemented with biographical notes from Ibn Sa'd's Tabaqat."
  ur: "احمد السید پہلے ابن کثیر کی جمع کردہ ان روایات کو یکجا کرتے ہیں جو نبی تک وحی کے آنے کی کیفیت بیان کرتی ہیں، پھر ابتدائی نماز اور اس کی فرضیت کے بارے میں ابن اسحاق کا بیان لیتے ہیں۔ اس کے بعد وہ سورۃ المدثر کی ابتدا کو دعوت کے پہلے احکام کے طور پر پڑھتے ہیں، اور آخر میں عام دعوت سے پہلے کے ابتدائی مسلمانوں کے بارے میں ابن اسحاق اور ابن ہشام کو پڑھتے ہیں، جس کی تکمیل ابن سعد کی طبقات کے سوانحی نکات سے ہوتی ہے۔"
  fr: "Ahmed Elsayed rassemble d'abord la compilation d'Ibn Kathir sur la manière dont la révélation venait au Prophète, puis traite de la prière des débuts et du récit d'Ibn Ishaq sur son institution. Il lit ensuite le début de la sourate al-Muddaththir comme les premiers ordres de l'appel, et enfin Ibn Ishaq et Ibn Hicham sur les premiers musulmans avant l'appel public, complétés par des notes biographiques tirées des Tabaqat d'Ibn Sa'd."
  es: "Ahmed Elsayed reúne primero la compilación de Ibn Kathir sobre cómo le llegaba la revelación al Profeta, y luego trata la oración de los comienzos y el relato de Ibn Ishaq sobre su institución. Después lee el comienzo de la sura al-Muddaththir como las primeras órdenes de la llamada, y por último lee a Ibn Ishaq y a Ibn Hisham sobre los primeros musulmanes antes de la llamada pública, completado con notas biográficas de las Tabaqat de Ibn Sa'd."
