label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 17)⁩ بشأن فلسطين والمسجد الأقصى والعراق والصومال ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(17th session)⁩ on Palestine and al-Aqsa, Iraq and Somalia ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(سترہویں مجلس)⁩: فلسطین اور مسجدِ اقصیٰ، عراق اور صومالیہ ⁦(بیان، قرارداد نہیں)⁩" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(24–28 يونيو 2006م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. يصف البيان بلسان المجمع أوضاع فلسطين والحصار على شعبها وما سماه اعتداءات على المدنيين والمصادرة والجدار الفاصل، ويدعو الدول الإسلامية والعالم إلى رفع المعاناة، ويؤكد مكانة القدس والمسجد الأقصى لدى المسلمين ويدين ما يصفه بمخططات مساس بالمقدسات، ويطالب بإنهاء الاحتلال وحق الشعب الفلسطيني في دولته، مع إشادة بالدور الأردني في رعاية المقدسات؛ ويتناول كذلك الأوضاع في العراق والصومال بنفس الإطار. سُجّل هنا بوصفه بيان المجمع، ملخصًا بحياد."
  en: "A statement issued by the International Islamic Fiqh Academy at its 17th session in Amman (24–28 June 2006), published among the session materials though not a numbered resolution. In the Academy's own voice it describes conditions in Palestine, the siege of its population, what it terms attacks on civilians, land confiscation and the separation barrier; calls on Muslim states and the world to relieve the suffering; affirms the standing of Jerusalem and al-Aqsa for Muslims and condemns what it describes as schemes against the sanctities; demands an end to the occupation and the Palestinian people's right to their state; praises Jordan's role in caring for the holy sites; and addresses Iraq and Somalia in the same frame. Recorded here as the Academy's own statement, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، عمان میں سترہویں مجلس ⁦(24–28 جون 2006ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ اکیڈمی کی اپنی زبانی میں یہ فلسطین کے حالات، اس کے عوام پر محاصرہ، اس کے بیان کردہ شہریوں پر حملے، زمین کی ضبطی اور تقسیم کن دیوار بیان کرتا ہے؛ اسلامی ممالک اور دنیا سے تکلیف اٹھانے کا مطالبہ کرتا ہے؛ مسلمانوں کے لیے یروشلم اور مسجدِ اقصیٰ کے مقام کی تصدیق اور مقدسات کے خلاف اس کے بیان کردہ منصوبوں کی مذمت کرتا ہے؛ قبضے کے خاتمے اور فلسطینی عوام کی ریاست کے حق کا مطالبہ کرتا ہے؛ مقدسات کی نگہبانی میں اردن کے کردار کی تحسین کرتا ہے؛ اور اسی فریم میں عراق اور صومالیہ کا بھی ذکر کرتا ہے۔ یہاں اکیڈمی کے اپنے بیان کے طور پر غیر جانبدارانہ خلاصہ درج ہے۔"
