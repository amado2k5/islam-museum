label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الأخذ بالرخصة وحكمه", en: "IIFA resolution on taking the concession (rukhsa) and its ruling", ur: "اکیڈمی کی قرارداد: رخصت اختیار کرنے کا حکم", es: "Resolución de la IIFA sobre la toma de la concesión (rukhsa) y su dictamen" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: الرخصة الشرعية ما شرع من الأحكام لعذر تخفيفًا عن المكلفين مع قيام السبب الموجب للحكم الأصلي، ولا خلاف في مشروعية الأخذ بها إذا وجدت أسبابها بشرط التحقق من دواعيها والاقتصار على مواضعها ومراعاة الضوابط، وبيّن ضوابط الأخذ بها وأحكامها على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on the sharia concession (rukhsa): it is a ruling legislated for an excuse to lighten the burden on the mukallaf while the original ground stands; there is no dispute over its lawfulness when its reasons exist, provided its causes are verified, it stays within its places, and the controls are kept — all set out in the resolution."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ رخصت پر: شرعی رخصت عذر کی بنا پر دی گئی آسانی ہے؛ اس کے اسباب موجود ہوں تو لینا جائز بشرط ضوابط۔"
  es: "Resolución de la octava sesión de la IIFA (Brunei, junio de 1993) sobre la concesión de la sharia (rukhsa): es una norma legislada para aliviar la carga del mukallaf mientras se mantenga el fundamento original; no hay controversia sobre su legalidad cuando existen sus razones, siempre que se verifiquen sus causas, se mantenga dentro de los límites establecidos y se respeten los controles, todo ello estipulado en la resolución."
