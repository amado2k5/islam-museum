label: { ar: "قرار مجمع الفقه الإسلامي الدولي 194 (20/9) بشأن الإثبات بالقرائن والأمارات ⁦(المستجدات)⁩", en: "IIFA resolution 194 (20/9) on proof by circumstantial evidence and indicia ⁦(new developments)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 194 (20/9): قرائن اور امارات سے ثبوت ⁦(جدید ترقیات)⁩", es: "Resolución 194 (20/9) de la IIFA sobre la prueba mediante indicios y pruebas circunstanciales (novedades)", fr: "Résolution 194 (20/9) de l'IIFA sur la preuve par des preuves circonstancielles et des indices (nouveaux développements)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 194 (20/9) varsayımlar ve öncüllerle ispat hakkındaki (güncellemeler)", id: "Keputusan Akademi Fiqh Islam Internasional 194 (20/9) mengenai pembuktian melalui asumsi dan predikat (pembaruan)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. عرّف القرينة بأنها أمر ظاهر يستفاد منه في معرفة أمر مجهول، ولها مفهوم واسع يستوعب أنواعاً متعددة وقد استجدت قرائن كثيرة مع تطور الحياة العلمية كالبصمة بأنواعها والتصوير والتسجيل الصوتي والتوقيع الإلكتروني والرسائل الإلكترونية. وقرر في العمل بالقرائن: الأصل ألا يقضى إلا بحجة شرعية تبين الحق من إقرار أو شهادة أو يمين، فإن لم يوجد جاز العمل بالقرائن القطعية نصية أو قضائية، وعلى ذلك يجوز الاعتماد على القرائن القطعية المستجدة في إثبات الحقوق المالية والجرائم المختلفة ما عدا الحدود والقصاص؛ ويجوز الاعتماد على القرائن في إثبات العقود ما لم يرد عليها ما يبطلها؛ ويستأنس بالقرائن غير القطعية لإثبات الحقوق إذا وجدت دلائل أخرى يطمئن إليها القضاء. وفي البصمة الوراثية: هي من الناحية العلمية وسيلة لا تكاد تخطئ في التحقق من الوالدية البيولوجية والتحقق من الشخصية لا سيما في الطب الشرعي، وترقى إلى القرائن القوية التي يأخذ بها أكثر الفقهاء في غير قضايا الحدود، وتمثل تطوراً عصرياً ضخماً في مجال القيافة التي تعتد به جمهرة المذاهب في إثبات النسب المتنازع فيه على أن تؤخذ من عدة مختبرات؛ ويمكن الاستئناس بها في إثبات النسب فيما يؤخذ فيه بالقافة من باب أولى: التنازع على مجهول النسب بصوره المذكورة عند الفقهاء؛ والاشتباه في المواليد في المستشفيات ومراكز رعايتهم وفي أطفال الأنابيب؛ وضياع الأطفال واختلاطهم بالحوادث والكوارث وتعذر معرفة أهليهم وكذا الجثث مجهولة الهوية بالحروب وغيرها. ولا يجوز الاعتماد على البصمة الوراثية في نفي النسب ولا تقدم على اللعان."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). It defined qarina (circumstantial evidence) as a manifest matter from which an unknown matter is learnt, having a wide notion covering many kinds, many of them new with the development of scientific life — fingerprints of every type, photography, audio recording, electronic signature, electronic messages and the like. On acting on circumstantial evidence: the default is that judgment is only by a legal proof revealing the right — confession, testimony or oath; if none exists, acting on conclusive evidence, textual or judicial, is permissible. Accordingly: reliance on the new conclusive evidence is permissible in establishing financial rights and the various crimes, except the prescribed punishments and retaliation; reliance on circumstantial evidence in establishing contracts is permissible unless invalidated; and non-conclusive evidence may be drawn on for establishing rights where other indications exist that the court finds reassuring. On the genetic fingerprint: scientifically an almost infallible means of verifying biological parenthood and identity, especially in forensic medicine, rising to the strong evidence most jurists accept outside hudud cases, and a massive modern development in physiognomy (qiyafa), which the majority of the schools credit in proving disputed lineage — provided the evidence is taken from several laboratories. It may be drawn on in establishing lineage, with greater reason than qiyafa, in: disputes over persons of unknown lineage in the forms the jurists describe; suspected mix-ups of newborns in hospitals and care centres and likewise test-tube babies; and children lost or mixed up through accidents and disasters whose families cannot be known, and unidentified bodies from wars and the like. Genetic evidence may not be relied on to negate lineage, nor does it take precedence over li'an."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس نے قرینہ کی تعریف کی: ایک ظاہر امر جس سے نامعلوم امر معلوم ہوتا ہے؛ اس کا وسیع مفہوم کئی اقسام کو سمیٹتا ہے اور علمی زندگی کی ترقی سے نئی قرائنیں نکلیں — ہر قسم کے بصمات، فوٹوگرافی، صوتی ریکارڈنگ، الیکٹرانک دستخط اور برقی پیغامات۔ قرائن پر عمل کے بارے میں: اصل یہ ہے کہ فیصلہ صرف شرعی حجت — اقرار، شہادت یا قسم — سے ہو؛ نہ ہو تو قطعی قرائن — نصی یا قضائی — پر عمل جائز۔ اس بنیاد پر: نئی قطعی قرائنوں پر انحصار مالی حقوق اور مختلف جرائم کے ثبوت میں جائز سوائے حدود اور قصاص کے؛ عقود کے ثبوت میں قرائن پر انحصار جائز جب تک انہیں باطل کرنے والی چیز نہ آئے؛ اور غیر قطعی قرائن سے حقوق کے ثبوت میں استعانت ہو سکتی ہے جہاں دوسری دلیلیں موجود ہوں جن پر عدالت کو اطمینان ہو۔ جینیاتی بصمہ پر: علمی طور پر حیاتیاتی والدیت اور شخصیت کی تصدیق کا تقریباً معصوم ذریعہ بالخصوص فرانزک میڈیسن میں، وہ مضبوط قرینہ ہے جسے اکثر فقہاء غیر حدود معاملات میں لیتے ہیں اور قیافہ — جسے اکثریت مذاہب متنازعہ نسب کے ثبوت میں مانتی ہیں — کا عصری بڑا توسیع شدہ روپ، بشرطیکہ یہ کئی لیبارٹریوں سے لیا جائے۔ نسب ثابت کرنے میں قیافہ سے زیادہ ترجیح سے استعانت ہو سکتی ہے: نامعلوم نسب پر تنازعہ کی وہ صورتیں جو فقہاء نے بیان کیں؛ اسپتالوں اور رعایت مراکز میں نوزائیدوں کی مشتبہ خلفش اور ٹیسٹ ٹیوب بچوں کا شک؛ حادثات و آفات میں بچوں کا کھو جانا اور مل جانا جس سے ان کے گھر والے معلوم نہ ہو سکیں اور جنگوں سے نا معلوم لاشیں۔ جینیاتی بصمے پر انحصار نسب کے انکار میں جائز نہیں اور نہ وہ لعان پر مقدم ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 20.ª sesión en Orán (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 de septiembre de 2012). Definió qarina (prueba circunstancial) como un asunto manifiesto del cual se aprende un asunto desconocido, con una noción amplia que abarca muchos tipos, muchos de ellos nuevos con el desarrollo de la vida científica: huellas dactilares de todo tipo, fotografía, grabación de audio, firma electrónica, mensajes electrónicos y similares. Sobre actuar sobre la prueba circunstancial: por defecto es que el juicio es solo por una prueba legal que revele el derecho: confesión, testimonio o juramento; si no existe ninguna, actuar sobre prueba concluyente, textual o judicial, es permisible. En consecuencia: confiar en la nueva prueba concluyente es permisible para establecer derechos financieros y los diversos delitos, excepto las penas prescritas y la represalia; confiar en la prueba circunstancial para establecer contratos es permisible a menos que sean invalidados; y la evidencia no concluyente puede utilizarse para establecer derechos cuando existan otros indicios que el tribunal considere tranquilizadores. Sobre la huella genética: científicamente un medio casi infalible para verificar la paternidad biológica y la identidad, especialmente en medicina forense, llegando a ser la sólida evidencia que la mayoría de los juristas aceptan fuera de los casos hudud, y un desarrollo moderno masivo en fisonomía (qiyafa), que la mayoría de las escuelas reconocen para probar linaje disputado, siempre que la evidencia se tome de varios laboratorios. Puede utilizarse para establecer el linaje, con mayor fundamento que la qiyafa, en: disputas sobre personas de linaje desconocido en las formas que describen los juristas; sospechas de confusiones de recién nacidos en hospitales y centros de atención y también bebés probeta; y niños perdidos o mezclados por accidentes y desastres cuyas familias no se pueden conocer, y cuerpos no identificados de guerras y similares. No se puede confiar en la evidencia genética para negar el linaje, ni tiene precedencia sobre el li'an."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13-18 septembre 2012). Elle définit la qarina (preuve circonstancielle) comme un élément manifeste permettant d'appréhender un fait inconnu. Cette notion est vaste et englobe de nombreuses formes, dont beaucoup sont nouvelles avec le développement des sciences: empreintes digitales, photographies, enregistrements audio, signatures électroniques, messages électroniques, etc. Concernant l'utilisation des preuves circonstancielles: par défaut, le jugement repose uniquement sur une preuve légale établissant le droit – aveu, témoignage ou serment; à défaut, il est permis d'agir sur la base d'une preuve concluante, textuelle ou judiciaire. En conséquence: le recours à une nouvelle preuve concluante est permis pour établir les droits financiers et les différentes infractions, à l'exception des peines prévues et des représailles; le recours aux preuves circonstancielles est permis pour établir les contrats, sauf s'ils sont invalidés. Des preuves non concluantes peuvent être utilisées pour établir des droits lorsque d'autres indices rassurants existent. Concernant l'empreinte génétique: scientifiquement, c'est un moyen quasi infaillible de vérifier la filiation biologique et l'identité, notamment en médecine légale, constituant une preuve solide acceptée par la plupart des juristes en dehors des affaires relevant de la loi hudud. Elle représente également un progrès majeur en physiognomonie (qiyafa), à laquelle la majorité des écoles de pensée reconnaissent la valeur probante de la filiation contestée, à condition que les analyses proviennent de plusieurs laboratoires. Elle peut être utilisée pour établir la filiation, avec plus de fondement que la qiyafa, dans les cas suivants: litiges concernant des personnes d'ascendance inconnue, tels que décrits par les juristes; suspicions d'échanges de nouveau-nés dans les hôpitaux et les centres de soins, y compris les bébés éprouvettes; enfants perdus ou dont les familles sont inconnues suite à des accidents ou des catastrophes; corps non identifiés provenant de guerres, etc. Les preuves génétiques ne peuvent être utilisées pour contester la filiation et ne prévalent pas sur le li'an."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 Eylül 2012) toplu kararı alınmıştır. Kanıt, bilinmeyen bir konuyu anlamak için kullanılan görünür bir madde olarak tanımlanır ve çeşitli türleri kapsayan geniş bir kavrama sahiptir. Bilimsel yaşamın gelişimiyle birlikte çeşitli türlerde parmak izi alma, fotoğrafçılık, ses kaydı, elektronik imzalar ve elektronik mesajlar gibi birçok ipucu ortaya çıkmıştır. Varsayımların uygulanması konusunda şu kararı belirlemiştir: Varsayılan durum, yalnızca beyan, tanıklık veya yemin hakkını netleştiren bir hukuki dayanakla hükmedilmesi gerektiğidir. Kanıt yoksa, metinsel veya yargısal olsun, kesin varsayımların uygulanması mümkündür. Buna göre, mali hakları ve hudud ile qisas hariç çeşitli suçları kanıtlamak için yeni oluşturulmuş kesin varsayımlara dayanmak mümkündür; sözleşmeleri geçersiz kılan kanıt olmadıkça varsayımlara dayanmak mümkündür; ve yargıyı güvence altına alan başka kanıtlar varsa, hakları kanıtlamak için kesin olmayan varsayımlara dayanılır. Genetik parmak izi ile ilgili olarak: bilimsel olarak, özellikle adli tıpta biyolojik babalık ve kişiliği doğrulamada nadiren hata yapan bir yöntemdir. Hudud davaları dışında çoğu hukukçu tarafından benimsenen güçlü kanıt olarak kabul edilir. Qiyaf alanında büyük modern bir gelişmeyi temsil eder ve çoğu okul tarafından tartışmalı soy hattını belirlemede yaygın olarak kabul edilir, tabii ki birden fazla laboratuvardan alınırsa. Öncelikle soyun belirlenmesi için kullanılır; hukukçuların belirttiği bilinmeyen ebeveynlik anlaşmazlıkları; hastane ve bakım merkezlerinde doğumlar ile tüp bebek tedavisinde şüphe; çocuk kaybı, kazalar ve felaketlerle karışması, ailelerinin tanımlanamaması, ayrıca savaşlarda ve diğer konularda kimliği belirlenemeyen cesetlerin tanımlanamaması. Soy soyunu reddetmek için genetik parmak izine güvenmek mümkün değildir ve lanetten önce gelmez (Li'an)."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012 M). Bukti didefinisikan sebagai materi yang tampak digunakan untuk memahami materi yang tidak diketahui, dan memiliki konsep luas yang mencakup berbagai jenis. Banyak petunjuk muncul seiring perkembangan kehidupan ilmiah, seperti pengambilan sidik jari berbagai jenis, fotografi, perekaman suara, tanda tangan elektronik, dan pesan elektronik. Ia menetapkan mengenai penerapan prasangka: default-nya adalah bahwa asumsi tersebut hanya boleh diputuskan oleh dasar hukum yang memperjelas hak dari deklarasi, kesaksian, atau sumpah. Jika tidak ada bukti, diperbolehkan menerapkan dugaan konklusif, baik tekstual maupun yudisial. Oleh karena itu, diperbolehkan mengandalkan prasangka konklusif yang baru ditetapkan untuk membuktikan hak finansial dan berbagai kejahatan kecuali hudud dan qisa; diperbolehkan mengandalkan prasangka untuk menetapkan kontrak kecuali ada bukti yang membatalkannya; dan dugaan non-konklusif dijadikan dasar untuk membuktikan hak jika ada bukti lain yang meyakinkan yudikatif. Mengenai sidik jari genetik: secara ilmiah, ini adalah metode yang jarang salah dalam memverifikasi ayah biologis dan kepribadian, terutama dalam kedokteran forensik. Ini dianggap sebagai bukti kuat yang diadopsi oleh sebagian besar ahli hukum di luar kasus Hudud. Ini merupakan perkembangan modern besar di bidang Qiyaf, yang secara luas diterima oleh mayoritas sekolah dalam menetapkan garis keturunan yang diperdebatkan, asalkan diambil dari beberapa laboratorium. Ini dapat digunakan terutama untuk menetapkan garis keturunan dalam kasus Qaffah diambil, termasuk: perselisihan tentang asal-usul orang tua yang tidak diketahui seperti yang disebutkan oleh ahli hukum; kecurigaan tentang kelahiran di rumah sakit dan pusat perawatan, serta dalam IVF; kehilangan anak, pencampuran mereka dengan kecelakaan dan bencana, serta ketidakmampuan mengidentifikasi keluarga, serta jenazah yang tidak teridentifikasi dalam perang dan masalah lainnya. Tidak diperbolehkan mengandalkan sidik jari genetik untuk menyangkal garis keturunan dan tidak mendahului sumpah serapah (Li'an)."
