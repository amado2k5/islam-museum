summary:
  ar: "خطبة داود بن علي في مسجد الكوفة بعد هزيمة بني أمية، يشكر الله فيها على إهلاك عدوهم ويذكر حق آل البيت في الخلافة. تنقلها كتب التاريخ بروايات متعددة."
  en: "Dawud ibn Ali's sermon in the Kufa mosque after the Umayyad defeat. He thanks God for destroying the enemy and speaks of the house's right to rule. Histories transmit it in several versions."
  ur: "بنو امیہ کی شکست کے بعد کوفہ کی مسجد میں داود بن علی کا خطبہ، جس میں وہ اللہ کا شکر ادا کرتے ہیں اور اہل بیت کے حق خلافت کا ذکر کرتے ہیں۔ تاریخی کتابوں میں اس کی کئی روایتیں ملتی ہیں۔"
  es: "Sermón de Dawud ibn Ali en la mezquita de Kufa tras la derrota de los Omeyas. Agradece a Dios por la destrucción del enemigo y proclama el derecho de la casa a gobernar. Existen varias versiones históricas que lo transmiten."
  fr: "Le sermon de Dawud ibn Ali à la mosquée de Koufa après la défaite des Omeyyades. Il remercie Dieu d'avoir anéanti l'ennemi et affirme le droit de sa famille à régner. Les récits historiques en rapportent plusieurs versions."
  tr: "Emevilerin yenilgisinden sonra Kufa Camii'nde Davud bin Ali'nin vaazında düşmanlarını yok ettiği için Allah'a şükrettiği ve Ehl-Beyt'in halifeliğe olan hakkından bahsettiği vaaz. Bu vaaz, çeşitli rivayetlerle tarihî kitaplarda aktarılmıştır."
  id: "Khotbah Dawud ibn Ali di masjid Kufa setelah kekalahan Umayyah, di mana ia bersyukur kepada Tuhan karena telah menghancurkan musuh mereka dan menyebutkan hak Ahl al-Bayt atas kekhalifahan. Khotbah ini disampaikan dalam buku-buku sejarah melalui berbagai narasi."
