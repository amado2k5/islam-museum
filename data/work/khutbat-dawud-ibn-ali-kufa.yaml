summary:
  ar: "خطبة داود بن علي في مسجد الكوفة بعد هزيمة بني أمية، يشكر الله فيها على إهلاك عدوهم ويذكر حق آل البيت في الخلافة. تنقلها كتب التاريخ بروايات متعددة."
  en: "Dawud ibn Ali's sermon in the Kufa mosque after the Umayyad defeat. He thanks God for destroying the enemy and speaks of the house's right to rule. Histories transmit it in several versions."
  ur: "بنو امیہ کی شکست کے بعد کوفہ کی مسجد میں داود بن علی کا خطبہ، جس میں وہ اللہ کا شکر ادا کرتے ہیں اور اہل بیت کے حق خلافت کا ذکر کرتے ہیں۔ تاریخی کتابوں میں اس کی کئی روایتیں ملتی ہیں۔"
