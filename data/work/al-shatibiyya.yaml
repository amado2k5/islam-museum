summary:
  ar: "حرز الأماني ووجه التهاني في القراءات السبع للقاسم الشاطبي ⁦(ت. 590هـ)⁩ في نحو ألف ومائة وثلاث وسبعين بيتاً على بحر الطويل؛ منظومة علم القراءات التي لخّصت الطيبة? لا — التي جمعت التحرير والطيبة في القراءات السبع من طريقي الشاطبية {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Hirz al-Amani wa-Wajh al-Tahani on the seven readings by al-Qasim al-Shatibi (d. 590 AH) — about 1,173 long-metre lines; the didactic poem that gathered the rules of the seven qira'at through the two Shatibi paths of al-Tayyiba {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Hirz al-Amani wa-Wajh al-Tahani sobre las siete lecturas de al-Qasim al-Shatibi (m. 590 AH) — aproximadamente 1.173 versos de metro largo; el poema didáctico que reunió las reglas de las siete qira'at a través de los dos caminos Shatibi de al-Tayyiba {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  fr: "Hirz al-Amani wa-Wajh al-Tahani sur les sept lectures par al-Qasim al-Shatibi (d. 590 AH) — environ 1 173 vers de mètre long; le poème didactique qui a rassemblé les règles des sept qira'at à travers les deux voies Shatibi d'al-Tayyiba {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "القاسم الشاطبی ⁦(متوفی 590 ہجری)⁩ کی سات تلاوتوں پر ہرز الامانی و وجح التہانی - تقریباً 1,173 لمبی میٹر لائنیں؛ وہ نثری نظم جس نے الطیبہ کے دو شاطبی راستوں کے ذریعے سات قیراط کے قواعد کو جمع کیا ہے"
