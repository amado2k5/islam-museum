id: work/fatwa-aliftaa-jo-appointing-an-agent-for-the-sacrifice-abroad
class: work
kind: fatwa
label: { ar: "التوكيل بالأضحية خارج الأردن", en: "Appointing an agent for the sacrifice outside Jordan", ur: "اردن سے باہر قربانی کے لیے وکیل بنانا" }
summary:
  ar: "سؤال عن التوكيل بالأضحية خارج الأردن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز التوكيل بذبح الأضحية لشخص أو جمعية ولو في غير بلد المضحي، بشرط التزام الوكيل بشروطها، والأفضل أن يباشرها بنفسه. أجابت الدائرة بأنه يجوز التوكيل بذبح الأضحية لشخص أو جمعية خيرية ولو في غير بلد المضحي، على أن يلتزم الوكيل بشروط الأضحية من السلامة من العيوب والسن ووقت الذبح والتوزيع. وقالت إن الأفضل أن يباشر المضحي أضحيته بنفسه ليحصل له كامل ثوابها وبركتها."
  en: "A question about appointing an agent for the sacrifice outside Jordan, in which Jordan's General Iftaa Department answered that a person or charity may be appointed to slaughter the sacrifice even outside the sacrificer's country, provided the agent observes its conditions, though it is better to do it oneself. The Department answered that one may appoint a person or a charity to slaughter the sacrifice even in a country other than the sacrificer's, provided the agent observes the conditions of the sacrifice regarding freedom from defects, age, time of slaughter and distribution. It said it is better for the sacrificer to carry it out himself so that he gains the full reward and blessing of the sacrifice."
  ur: "اردن سے باہر قربانی کے لیے وکیل بنانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قربانی کے ذبح کے لیے کسی شخص یا ادارے کو وکیل بنانا جائز ہے، چاہے قربانی کرنے والے کے ملک سے باہر ہو، بشرطیکہ وکیل اس کی شرائط کی پابندی کرے، البتہ خود کرنا افضل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی ذبح کرنے کے لیے کسی شخص یا خیراتی ادارے کو وکیل بنانا جائز ہے، چاہے قربانی کرنے والے کے ملک کے علاوہ کہیں ہو، بشرطیکہ وکیل عیوب سے سلامتی، عمر، ذبح کے وقت اور تقسیم سے متعلق قربانی کی شرائط کی پابندی کرے۔ اس نے کہا کہ افضل یہ ہے کہ قربانی کرنے والا خود قربانی کرے تاکہ اسے اس کا پورا ثواب اور برکت حاصل ہو۔"
