label: { ar: "قصيدة حسان «لو كنت من هاشم أو من بني أسد»", en: "Hassan's satire of Musafi' 'If you were of Hashim or of Banu Asad'", es: "La sátira de Hassan sobre Musafi: \"Si fueras de Hashim o de Banu Asad\".", fr: "Satire de Hassan sur Musafi: « Si tu étais de Hashim ou de Banu Asad »", ur: "حسن کا مصحفی کا طنز ’’تم ہاشم کے ہوتے یا بنو اسد کے‘‘", tr: "Hassan'ın şiiri 'Eğer Haşim'den ya da Bani Asad'dan olsaydım'", id: "Puisi Hassan 'If I Were from Hashim or Bani Asad'" }
