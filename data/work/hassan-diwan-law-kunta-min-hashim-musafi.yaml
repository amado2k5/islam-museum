  en: "Verses by Hassan ibn Thabit in the basit metre on the rhyme dal, satirising Musafi' ibn Iyad al-Taymi {{cite:sharh-diwan-hassan-barquqi-1929 p.133-134}}."
  es: "Versos de Hassan ibn Thabit en el metro basit sobre la rima dal, satirizando a Musafi' ibn Iyad al-Taymi {{cita:sharh-diwan-hassan-barquqi-1929 p.133-134}}."
  fr: "Versets de Hassan ibn Thabit au basit mètre sur la rime dal, satirisant Musafi' ibn Iyad al-Taymi {{cite:sharh-diwan-hassan-barquqi-1929 p.133-134}}."
  ur: "شاعری دال پر باسط میٹر میں حسن بن ثابت کی آیات، مصحفی ابن عیاض التیمی پر طنز کرتے ہوئے {{حوالہ: شرح دیوان-حسن برقوی-1929 صفحہ 133-134}}۔"
  tr: "Hasan ibn Tabit'in 'dal' anlatımı üzerine al-Basit'ten şiirleri, Musaf'i ibn Iyad al-Taymi'yi hicvediyor {{cite:sharh-diwan-hassan-barquqi-1929 s.133-134}}."
  id: "Bait-bait oleh Hassan ibn Thabit dari al-Basit tentang narasi 'dal', menyindir Musaf'i ibn Iyad al-Taymi {{cite:sharh-diwan-hassan-barquqi-1929 hlm.133-134}}."
