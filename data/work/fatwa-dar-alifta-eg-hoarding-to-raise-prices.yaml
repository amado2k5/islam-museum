id: work/fatwa-dar-alifta-eg-hoarding-to-raise-prices
class: work
kind: fatwa
label: { ar: "حكم الاحتكار بقصد زيادة الأسعار", en: "Hoarding goods to drive up prices", ur: "قیمتیں بڑھانے کے لیے ذخیرہ اندوزی کا حکم", es: "Acaparar productos para aumentar los precios." }
summary:
  ar: "سائل سأل عن شراء السلع وتخزينها وحبسها حتى تقل بين الناس ثم رفع سعرها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22228)⁩ أن ذلك احتكار حرمه الشرع لما فيه من استغلال حاجة الناس، وبيّن الجواب حكم الدولة والمجتمع فيه."
  en: "A questioner asked about buying goods, storing them and withholding them until they become scarce, then raising their price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22228) answered that this is the hoarding the sharia forbids, exploiting people's need; the answer sets out the role of state and society in it."
  ur: "ایک سائل نے اشیاء خرید کر ذخیرہ کرنے اور لوگوں میں کمی ہو جانے تک روکے رکھنے پھر قیمت بڑھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22228)⁩ نے جواب دیا کہ یہ وہ احتکار ہے جسے شریعت نے حرام کیا کیونکہ اس میں لوگوں کی ضرورت کا استحصال ہے؛ جواب میں اس معاملے میں ریاست اور معاشرے کے کردار کی تفصیل ہے۔"
  es: "Un consultante preguntó sobre la compra de bienes, su almacenamiento y retención hasta que escaseen, para luego aumentar su precio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22228) respondió que esto constituye acaparamiento, prohibido por la sharia, y que se explota la necesidad de la gente; la respuesta expone el papel del Estado y la sociedad en este fenómeno."
