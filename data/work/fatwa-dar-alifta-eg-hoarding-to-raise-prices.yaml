id: work/fatwa-dar-alifta-eg-hoarding-to-raise-prices
class: work
kind: fatwa
label: { ar: "حكم الاحتكار بقصد زيادة الأسعار", en: "Hoarding goods to drive up prices", ur: "قیمتیں بڑھانے کے لیے ذخیرہ اندوزی کا حکم", es: "Acaparar productos para aumentar los precios.", fr: "Accumuler des marchandises pour faire monter les prix", tr: "Fiyatları artırma niyetiyle tekel kararı", id: "Putusan monopoli dengan tujuan menaikkan harga" }
summary:
  ar: "سائل سأل عن شراء السلع وتخزينها وحبسها حتى تقل بين الناس ثم رفع سعرها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22228)⁩ أن ذلك احتكار حرمه الشرع لما فيه من استغلال حاجة الناس، وبيّن الجواب حكم الدولة والمجتمع فيه."
  en: "A questioner asked about buying goods, storing them and withholding them until they become scarce, then raising their price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22228) answered that this is the hoarding the sharia forbids, exploiting people's need; the answer sets out the role of state and society in it."
  ur: "ایک سائل نے اشیاء خرید کر ذخیرہ کرنے اور لوگوں میں کمی ہو جانے تک روکے رکھنے پھر قیمت بڑھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22228)⁩ نے جواب دیا کہ یہ وہ احتکار ہے جسے شریعت نے حرام کیا کیونکہ اس میں لوگوں کی ضرورت کا استحصال ہے؛ جواب میں اس معاملے میں ریاست اور معاشرے کے کردار کی تفصیل ہے۔"
  es: "Un consultante preguntó sobre la compra de bienes, su almacenamiento y retención hasta que escaseen, para luego aumentar su precio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22228) respondió que esto constituye acaparamiento, prohibido por la sharia, y que se explota la necesidad de la gente; la respuesta expone el papel del Estado y la sociedad en este fenómeno."
  fr: "Un internaute a posé une question concernant l'achat de marchandises, leur stockage et leur rétention jusqu'à ce qu'elles deviennent rares, puis l'augmentation de leur prix. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22228) a répondu que cette pratique constitue une thésaurisation interdite par la charia, exploitant la détresse des populations; la réponse expose le rôle de l'État et de la société dans ce phénomène."
  tr: "Bir soru soran kişi, malların insanlar arasında kıt hale gelene kadar satın alınması, depolanması ve depolanması, ardından fiyatlarının yükseltilmesi hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22228), bunun halkın ihtiyaçlarının sömürülmesi nedeniyle yasaklı bir tekel olduğunu ve cevabın devlet ve toplumun bu konuda hüküm sürmesi olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang membeli, menyimpan, dan menyimpan barang hingga menjadi langka di antara masyarakat, lalu menaikkan harganya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22228) menjawab bahwa ini adalah monopoli larangan karena eksploitasi kebutuhan rakyat, dan jawabannya adalah pemerintahan negara dan masyarakat atasnya."
