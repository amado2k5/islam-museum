summary:
  ar: "سؤال عن حكم ما يصنعه أهل الميت من الطعام في المآتم، وتجمع الناس عليه. الجواب: بدعة مكروهة، إذا لم يكن في الورثة قاصر، وإن كان فيهم قاصر فهو حرام، ومثله الأكل منه."
  en: "Question on the food the bereaved family prepares for mourning gatherings, to which people gather. The answer: a disliked innovation when there are no minor heirs; if there are minors among the heirs it is forbidden, and so is eating from it."
  ur: "سوال: ماتم کے مجالس میں اهلِ میت کی طرف سے تیار کیا گیا کھانا جس پر لوگ جمع ہوں، اس کا حکم۔ جواب: اگر ورثاء میں کوئی قاصر نہ ہو تو مکروہ بدعت ہے؛ اگر ان میں قاصر ہوں تو حرام ہے، اور اس میں سے کھانا بھی ایسا ہی ہے۔"
