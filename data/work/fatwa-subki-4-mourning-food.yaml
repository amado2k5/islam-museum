label: { ar: "حكم إعمال الميت من الطعام في المآتم", en: "Fatwa on the food prepared by the family of the deceased at mourning gatherings", ur: "ماتم کے مجالس میں اهلِ میت کے بنائے ہوئے کھانے پر فتویٰ", es: "Fatwa sobre la comida preparada por la familia del difunto en las reuniones de duelo.", fr: "Fatwa concernant la nourriture préparée par la famille du défunt lors des réunions de deuil", tr: "Cenazelerde ölen kişinin yemek yemesiyle ilgili karar", id: "Putusan tentang almarhum makan makanan selama pemakaman" }
summary:
  ar: "سؤال عن حكم ما يصنعه أهل الميت من الطعام في المآتم، وتجمع الناس عليه. الجواب: بدعة مكروهة، إذا لم يكن في الورثة قاصر، وإن كان فيهم قاصر فهو حرام، ومثله الأكل منه."
  en: "Question on the food the bereaved family prepares for mourning gatherings, to which people gather. The answer: a disliked innovation when there are no minor heirs; if there are minors among the heirs it is forbidden, and so is eating from it."
  ur: "سوال: ماتم کے مجالس میں اهلِ میت کی طرف سے تیار کیا گیا کھانا جس پر لوگ جمع ہوں، اس کا حکم۔ جواب: اگر ورثاء میں کوئی قاصر نہ ہو تو مکروہ بدعت ہے؛ اگر ان میں قاصر ہوں تو حرام ہے، اور اس میں سے کھانا بھی ایسا ہی ہے۔"
  es: "Pregunta sobre la comida que la familia doliente prepara para las reuniones de duelo, a las que asisten las personas. La respuesta: una práctica desaconsejada cuando no hay herederos menores de edad; si hay menores entre los herederos, está prohibido, al igual que comer de ella."
  fr: "Question concernant les mets que la famille endeuillée prépare pour les réunions de deuil. Réponse: une pratique mal vue en l’absence d’héritiers mineurs; en présence d’héritiers mineurs, elle est interdite, de même que le fait d’en consommer."
  tr: "Ölen kişinin ailesinin cenazelerde hazırladığı yiyeceklerle ilgili bir karar hakkında bir soru ve insanlar bu konuda toplanmıştır. Cevap: Varisler arasında reşit olmayan yoksa, aralarında reşit olmayan varsa ve benzer şekilde ondan yemek yasaktır, bu da hoş karşılanmayan bir yeniliktir."
  id: "Pertanyaan tentang aturan makanan yang disiapkan oleh keluarga almarhum di pemakaman, dan orang-orang berkumpul untuk menikmatinya. Jawaban: Merupakan inovasi yang tidak disukai jika tidak ada anak di bawah umur di antara para ahli waris, dan jika ada anak di bawah umur, maka dilarang, dan demikian pula, makan dari itu."
