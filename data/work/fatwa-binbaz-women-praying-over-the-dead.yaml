id: work/fatwa-binbaz-women-praying-over-the-dead
class: work
kind: fatwa
label: { ar: "حكم صلاة النساء على الميت وتشييعهن للجنائز", en: "Women praying over the dead and following funerals", ur: "عورتوں کا نمازِ جنازہ پڑھنا اور جنازے کے ساتھ جانا" }
summary:
  ar: "سؤال عن حضور النساء الجنائز، فرّق فيه ابن باز بين الصلاة على الميت وتشييعه إلى المقبرة. أجاب ابن باز بأنه لا بأس أن تصلي المرأة على الميت مع الناس، وذكر أن النساء صلين على جنازة النبي. وقال إن الممنوع عليهن هو تشييع الميت إلى المقبرة وزيارة القبور. ووصف صلاتهن على الموتى مع الناس بأنها مشروعة."
  en: "A question on women attending funerals, in which Ibn Baz distinguished praying over the deceased from following the bier to the cemetery. Ibn Baz answered that there is no harm in a woman praying over the deceased with the people, noting that women prayed over the Prophet's body. He said what they are barred from is following the deceased to the cemetery and visiting graves. He described their praying over the dead together with the people as legitimate."
  ur: "عورتوں کے جنازوں میں شریک ہونے کے بارے میں سوال، جس میں ابن باز نے میت کی نماز اور قبرستان تک جنازے کے ساتھ جانے میں فرق کیا۔ ابن باز نے جواب دیا کہ عورت لوگوں کے ساتھ میت کی نماز پڑھے تو کوئی حرج نہیں، اور ذکر کیا کہ عورتوں نے نبی کی نمازِ جنازہ پڑھی تھی۔ انہوں نے کہا کہ ان کے لیے ممنوع یہ ہے کہ میت کے ساتھ قبرستان جائیں اور قبروں کی زیارت کریں۔ انہوں نے لوگوں کے ساتھ ان کی نمازِ جنازہ کو مشروع قرار دیا۔"
