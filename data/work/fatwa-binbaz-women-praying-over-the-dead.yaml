id: work/fatwa-binbaz-women-praying-over-the-dead
class: work
kind: fatwa
label: { ar: "حكم صلاة النساء على الميت وتشييعهن للجنائز", en: "Women praying over the dead and following funerals", ur: "عورتوں کا نمازِ جنازہ پڑھنا اور جنازے کے ساتھ جانا", es: "Mujeres rezando por los difuntos y siguiendo los funerales.", fr: "Des femmes prient pour les morts et assistent aux funérailles" }
summary:
  ar: "سؤال عن حضور النساء الجنائز، فرّق فيه ابن باز بين الصلاة على الميت وتشييعه إلى المقبرة. أجاب ابن باز بأنه لا بأس أن تصلي المرأة على الميت مع الناس، وذكر أن النساء صلين على جنازة النبي. وقال إن الممنوع عليهن هو تشييع الميت إلى المقبرة وزيارة القبور. ووصف صلاتهن على الموتى مع الناس بأنها مشروعة."
  en: "A question on women attending funerals, in which Ibn Baz distinguished praying over the deceased from following the bier to the cemetery. Ibn Baz answered that there is no harm in a woman praying over the deceased with the people, noting that women prayed over the Prophet's body. He said what they are barred from is following the deceased to the cemetery and visiting graves. He described their praying over the dead together with the people as legitimate."
  ur: "عورتوں کے جنازوں میں شریک ہونے کے بارے میں سوال، جس میں ابن باز نے میت کی نماز اور قبرستان تک جنازے کے ساتھ جانے میں فرق کیا۔ ابن باز نے جواب دیا کہ عورت لوگوں کے ساتھ میت کی نماز پڑھے تو کوئی حرج نہیں، اور ذکر کیا کہ عورتوں نے نبی کی نمازِ جنازہ پڑھی تھی۔ انہوں نے کہا کہ ان کے لیے ممنوع یہ ہے کہ میت کے ساتھ قبرستان جائیں اور قبروں کی زیارت کریں۔ انہوں نے لوگوں کے ساتھ ان کی نمازِ جنازہ کو مشروع قرار دیا۔"
  es: "En una pregunta sobre la asistencia de las mujeres a los funerales, Ibn Baz distinguió entre rezar por el difunto y acompañar el féretro al cementerio. Ibn Baz respondió que no hay inconveniente en que una mujer rece por el difunto junto con los fieles, señalando que las mujeres rezaron por el cuerpo del Profeta. Añadió que lo que les está prohibido es acompañar al difunto al cementerio y visitar las tumbas. Describió como legítimo que recen por los muertos junto con los fieles."
  fr: "Interrogé sur la présence des femmes aux funérailles, Ibn Baz a distingué la prière pour le défunt du fait d'accompagner le corbillard au cimetière. Il a répondu qu'il n'y avait aucun mal à ce qu'une femme prie pour le défunt avec les autres, rappelant que des femmes avaient prié pour le corps du Prophète. Il a précisé que ce qui leur était interdit était d'accompagner le défunt au cimetière et de se recueillir sur les tombes. Il a jugé légitime qu'elles prient pour le défunt avec les autres."
