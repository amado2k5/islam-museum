label:
  ar: "الإيمانيات"
  en: "The articles of faith (al-imaniyyat)"
  ur: "ارکانِ ایمان ⁦(الإیمانیات)⁩"
  es: "Los artículos de fe (al-imaniyyat)"
  fr: "Les articles de foi (al-imaniyyat)"
summary:
  ar: "سلسلة من ثلاث عشرة حلقة لـوجدي غنيم يحفظها أرشيف أسابيل باسم «الإيمانيات»؛ تغطي الحلقات السبع الأولى الإيمان بالله وأركانه وعلاقته بالعمل الصالح، ثم الإيمان بالكتب السماوية وبختمها القرآن، ثم الإيمان بالرسل وبشريتهم ومهمتهم في تبليغ التوحيد، وتختم الحلقات الست الأخيرة الإيمان بالملائكة وأعمالهم في علم الغيب وعلم الشهادة، ثم الإيمان باليوم الآخر وعلامات الساعة وأهوالها وجزاء الأعمال، ثم الإيمان بالقدر شرعيًا وخلقيًا."
  en: "A thirteen-episode series by Wagdy Ghoneim kept in the Assabile archive as 'Al-Imaniyyat' (the articles of faith); the first seven episodes treat faith in God and its three foundations and its bearing on righteous action, then faith in the revealed books and the Qur'an as their seal, then faith in the messengers, their humanity and their call to tawhid, and the final six episodes treat faith in the angels and their works in the unseen and the witnessed, then faith in the Last Day, its signs and its reckoning of deeds, then faith in divine decree in its legal and creative senses."
  ur: "وجدی غنیم کا تیرہ اقساط کا سلسلہ جو اسابیل آرکائیو میں «الإیمانیات» کے نام سے محفوظ ہے؛ پہلی سات اقساط ایمان باللہ، اس کے تین ارکان اور نیک عمل سے اس کا تعلق، پھر آسمانی کتب پر ایمان اور ان کی تصدیق کرنے والی قرآن، اور پھر انبیاء کرام پر ایمان، ان کی بشریت اور توحید کی دعوت بیان کرتی ہیں، اور آخری چھ اقساط فرشتوں پر ایمان اور غیب و مشاہدہ میں ان کے اعمال، پھر یومِ آخرت پر ایمان، اس کی علامتیں اور اعمال کا حساب، اور آخر میں شرعی اور خلقی قدر پر ایمان بیان کرتی ہیں۔"
  es: "Una serie de trece episodios de Wagdy Ghoneim, conservada en el archivo de Assabile como 'Al-Imaniyyat' (los artículos de fe); los primeros siete episodios tratan sobre la fe en Dios y sus tres fundamentos y su relación con la acción justa, luego la fe en los libros revelados y el Corán como su sello, luego la fe en los mensajeros, su humanidad y su llamado al tawhid, y los últimos seis episodios tratan sobre la fe en los ángeles y sus obras en lo invisible y lo presenciado, luego la fe en el Último Día, sus signos y su cálculo de las obras, luego la fe en el decreto divino en sus sentidos legal y creativo."
  fr: "Une série de treize épisodes de Wagdy Ghoneim conservée dans les archives d'Assabile sous le titre « Al-Imaniyyat » (les articles de foi); les sept premiers épisodes traitent de la foi en Dieu et de ses trois fondements et de son influence sur l'action vertueuse, puis de la foi dans les livres révélés et le Coran comme leur sceau, puis de la foi dans les messagers, leur humanité et leur appel au tawhid, et les six derniers épisodes traitent de la foi dans les anges et leurs œuvres dans l'invisible et le visible, puis de la foi dans le Jour dernier, ses signes et son jugement des actes, puis de la foi dans le décret divin dans ses sens légal et créateur."
