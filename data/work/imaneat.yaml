label:
  ar: "الإيمانيات"
  en: "The articles of faith (al-imaniyyat)"
  ur: "ارکانِ ایمان ⁦(الإیمانیات)⁩"
summary:
  ar: "سلسلة من ثلاث عشرة حلقة لـوجدي غنيم يحفظها أرشيف أسابيل باسم «الإيمانيات»؛ تغطي الحلقات السبع الأولى الإيمان بالله وأركانه وعلاقته بالعمل الصالح، ثم الإيمان بالكتب السماوية وبختمها القرآن، ثم الإيمان بالرسل وبشريتهم ومهمتهم في تبليغ التوحيد. الحلقات الثماني الباقية لم تُعدَّن بعد."
  en: "A thirteen-episode series by Wagdy Ghoneim kept in the Assabile archive as 'Al-Imaniyyat' (the articles of faith); the seven episodes mined so far treat faith in God and its three foundations and its bearing on righteous action, then faith in the revealed books and the Qur'an as their seal, then faith in the messengers, their humanity and their call to tawhid. The remaining eight episodes are not yet mined."
  ur: "وجدی غنیم کا تیرہ اقساط کا سلسلہ جو اسابیل آرکائیو میں «الإیمانیات» کے نام سے محفوظ ہے؛ اس وقت تک نکالی گئی سات اقساط ایمان باللہ، اس کے تین ارکان اور نیک عمل سے اس کا تعلق، پھر آسمانی کتب پر ایمان اور ان کی تصدیق کرنے والی قرآن، اور پھر انبیاء کرام پر ایمان، ان کی بشریت اور توحید کی دعوت بیان کرتی ہیں۔ باقی آٹھ اقساط ابھی نکالی نہیں گئیں۔"
