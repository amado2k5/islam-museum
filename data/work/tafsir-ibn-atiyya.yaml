label:
  ar: "المحرر الوجيز في تفسير الكتاب العزيز"
  en: "al-Muharrar al-Wajiz fi Tafsir al-Kitab al-'Aziz (Tafsir Ibn Atiyya)"
  ur: "المحرر الوجیز فی تفسیر الکتاب العزیز ⁦(تفسیر ابن عطیہ)⁩"
summary:
  ar: "تفسير القاضي أبي محمد عبد الحق بن عطية الأندلسي ⁦(ت 541هـ)⁩، قصد فيه أن يكون «جامعًا وجيزًا محررًا»: يتتبع ألفاظ الآية ويورد القراءات مستعملها وشاذها وأقوال العلماء منسوبة إليهم، ويقلل من القصص الإسرائيلية؛ وقدّم له بأبواب في علوم القرآن، وأثّر في القرطبي وابن جزي وأبي حيان والثعالبي."
  en: "The commentary of the judge Abu Muhammad Abd al-Haqq ibn Atiyya of al-Andalus (d. 541 AH), intended to be 'comprehensive, concise and precise': it follows the words of each verse, gives all the readings, accepted and irregular, and the scholars' views attributed to them, and keeps Israelite tales to a minimum. It opens with chapters on the Qur'anic sciences and shaped al-Qurtubi, Ibn Juzayy, Abu Hayyan and al-Tha'alibi."
  ur: "قاضی ابو محمد عبد الحق بن عطیہ اندلسی ⁦(م 541ھ)⁩ کی تفسیر، جسے انہوں نے «جامع، مختصر اور محرر» بنانا چاہا: یہ آیت کے الفاظ کا تتبع کرتی، تمام قراءات — رائج اور شاذ — اور علما کے اقوال ان کی نسبت کے ساتھ لاتی، اور اسرائیلی قصے کم سے کم رکھتی ہے۔ اس کے شروع میں علومِ قرآن پر ابواب ہیں، اور اس نے قرطبی، ابن جزی، ابو حیان اور ثعالبی کو متاثر کیا۔"
