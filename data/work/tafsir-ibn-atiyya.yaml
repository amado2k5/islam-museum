structure: "مقدمة المؤلف وأبوابها: فضل القرآن؛ فضل تفسيره والكلام على لغته وإعرابه؛ ما قيل في الكلام في تفسير القرآن والجرأة عليه ومراتب المفسرين؛ معنى حديث الأحرف السبعة؛ جمع القرآن وشكله ونقطه وتحزيبه وتعشيره؛ الألفاظ التي لها تعلق بلغات العجم؛ إعجاز القرآن؛ ألفاظ يقتضي الإيجاز استعمالها؛ تفسير أسماء القرآن والسورة والآية؛ ثم تفسير السور على ترتيب المصحف."
