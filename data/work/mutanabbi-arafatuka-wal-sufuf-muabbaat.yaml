label: { ar: "قصيدة المتنبي «عرفتك والصفوف معبآت»", en: "Al-Mutanabbi's ode 'I knew you, with the ranks drawn up'", es: "La oda de Al-Mutanabbi: \"Te conocí, con las filas formadas\".", fr: "L'ode d'Al-Mutanabbi « Je te connaissais, avec les rangs déployés »", ur: "المتنبی کا شعر 'میں آپ کو جانتا تھا، صفوں کے ساتھ'", tr: "Al-Mutanabbi'nin 'Seni Tanıdım ve Sıralar Tıklım Dolu' adlı şiiri", id: "Puisi Al-Mutanabbi 'Aku Mengenalmu dan Barisan Penuh Sesak'" }
summary:
  ar: "قصيدة من الوافر على روي الجيم للمتنبي، قالها وقد صف سيف الدولة الجيش في منزل يعرف بالسنبوس كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.309}}."
  en: "An ode in the wafir metre on the rhyme jim by al-Mutanabbi; said when Sayf al-Dawla drew up the army at a halting-place called al-Sunbus, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.309}}."
  es: "Una oda en metro wafir sobre la rima jim de al-Mutanabbi; dicha cuando Sayf al-Dawla reunió al ejército en un lugar de descanso llamado al-Sunbus, como lo introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.309}}."
  fr: "Une ode en mètre wafir sur la rime jim par al-Mutanabbi; dite lorsque Sayf al-Dawla a rassemblé l'armée à un lieu de halte appelé al-Sunbus, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.309}}."
  ur: "المتنبی کی رائم جم پر وفیر میٹر میں ایک اوڈ؛ کہا کہ جب سیف الدولہ نے السنبس نامی ایک ٹھکانے والی جگہ پر فوج کو متوجہ کیا، جیسا کہ دار بیروت ایڈیشن نے اسے متعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 ص.309}}۔"
  tr: "Al-Wafir'in 'ala Ru'i al-Jim' adlı şiiri, Al-Mutanabbi tarafından yazılan, Sayf al-Dawla tarafından yazılan, Diwan Dar Beyrut tarafından sunulan Sanbus adlı evde orduyu anlatır {{cite:diwan-mutanabbi-dar-beirut-1983 s.309}}."
  id: "Sebuah puisi oleh Al-Wafir 'ala Ru'i al-Jim oleh Al-Mutanabbi, yang disusun oleh Sayf al-Dawla yang menggambarkan tentara di sebuah rumah yang dikenal sebagai Sanbus, sebagaimana dipersembahkan oleh Diwan Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.309}}."
