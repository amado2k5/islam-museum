label: { ar: "معاني القرآن الكريم مع حواشٍ توضيحية ⁦(محمد تقي العثماني)⁩", en: "The Meanings of the Noble Qur'an with Explanatory Notes (Taqi Usmani)", ur: "دی میننگز آف دی نوبل قرآن وِد ایکسپلینیٹری نوٹس ⁦(مفتی محمد تقی عثمانی)⁩" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها محمد تقي العثماني، صدرت أول مرة سنة 2007 عن مكتبة معارف القرآن في كراتشي، ثم في طبعة فاخرة عن «تراث» في لندن سنة 2020 بعنوان «القرآن الكريم: المعنى مع حواشٍ توضيحية»؛ نشأت من عمل لجنة ترجمت تفسير أبيه محمد شفيع «معارف القرآن» إلى الإنجليزية، وتضم مقدمة عن تاريخ القرآن وتفسيره، ومقدمات للسور، وحواشي تعتمد في الغالب على علماء ديوبند، وفهرسًا موضوعيًا."
  en: "An English rendering of the meanings of the Qur'an by Muhammad Taqi Usmani, first published in 2007 by Maktaba Ma'ariful Quran in Karachi and in a luxury edition by Turath of London in 2020 as The Noble Qur'an: Meaning with Explanatory Notes; it grew out of the committee that translated his father Muhammad Shafi's tafsir Ma'ariful Qur'an into English, and carries an introduction on the history and interpretation of the Qur'an, sura introductions, notes drawn mainly from Deobandi scholarship, and a thematic index."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از مفتی محمد تقی عثمانی، جو 2007 میں کراچی میں مکتبہ معارف القرآن سے پہلی بار اور 2020 میں لندن میں تراث سے «دی نوبل قرآن: میننگ وِد ایکسپلینیٹری نوٹس» کے نام سے عمدہ اشاعت میں چھپا؛ یہ ان کے والد مفتی محمد شفیع کی تفسیر «معارف القرآن» کے انگریزی ترجمے کی کمیٹی کے کام سے نکلا، اور اس میں قرآن کی تاریخ و تفسیر پر مقدمہ، سورتوں کے تعارف، زیادہ تر علمائے دیوبند پر مبنی حواشی اور موضوعاتی اشاریہ شامل ہیں۔"
