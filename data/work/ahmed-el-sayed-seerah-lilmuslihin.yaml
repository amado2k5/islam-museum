label:
  ar: "السيرة النبوية للمصلحين لأحمد السيد"
  en: "The Prophetic Biography for Reformers by Ahmed Elsayed"
  ur: "احمد السید کی اصلاح کرنے والوں کے لیے سیرتِ نبوی"
  fr: "La biographie prophétique pour les réformateurs, par Ahmed Elsayed"
  es: "La biografía profética para los reformadores, por Ahmed Elsayed"
summary:
  ar: "سلسلة من اثنتين وثلاثين محاضرة لأحمد السيد في سيرة النبي محمد موجهة إلى المصلحين، نُشرت صوتًا في بودكاست السلسلة بين مارس وأكتوبر 2023، وتمضي من المقدمة إلى المجلس الأخير في غزوتي حنين وتبوك وحجة الوداع. وهي كما يصفها في الحلقة الأولى من سلسلته لسنة 2026 السلسلة الثانية له في السيرة، وقد ركز فيها على دروس الإصلاح. تنقل هذه السجلات ما يرويه ويشرحه في كل حلقة منسوبًا إليه، وتحيل إلى الحلقة كاملة دون تحديد وقت. وهي مصدر ثانوي حديث، لا مصدر أولي ولا شاهد مستقل على الوقائع."
  en: "A series of thirty-two lectures by Ahmed Elsayed on the biography of the Prophet Muhammad, addressed to reformers and published as audio in his podcast between March and October 2023. It runs from an introduction to a last session on the expeditions of Hunayn and Tabuk and the farewell pilgrimage. As he describes it in the first episode of his 2026 series, it was his second series on the sira and stressed the lessons for reform. These records give what he narrates and explains in each episode, attributed to him, and cite the whole episode with no time. It is a modern secondary source, not a primary source and not independent corroboration of the events."
  ur: "احمد السید کے بتیس لیکچرز کا ایک سلسلہ نبی محمد کی سیرت پر، جو اصلاح کرنے والوں کے لیے ہے اور مارچ سے اکتوبر 2023 کے درمیان ان کے پوڈکاسٹ میں آڈیو کے طور پر شائع ہوا۔ یہ تعارف سے شروع ہو کر غزوۂ حنین و تبوک اور حجۃ الوداع پر آخری مجلس تک جاتا ہے۔ جیسا کہ وہ اپنے 2026 کے سلسلے کی پہلی قسط میں بتاتے ہیں، یہ سیرت پر ان کا دوسرا سلسلہ تھا اور اس میں اصلاح کے اسباق پر زور تھا۔ یہ اندراجات ہر قسط میں ان کا بیان اور شرح انہی کی طرف منسوب کر کے دیتے ہیں اور پوری قسط کا حوالہ دیتے ہیں، کسی وقت کے بغیر۔ یہ ایک جدید ثانوی ماخذ ہے؛ نہ بنیادی ماخذ ہے اور نہ واقعات کی آزاد تصدیق۔"
  fr: "Une série de trente-deux conférences d'Ahmed Elsayed sur la biographie du Prophète Muhammad, destinée aux réformateurs et publiée en audio dans son podcast entre mars et octobre 2023. Elle va d'une introduction à une dernière séance sur les expéditions de Hunayn et de Tabuk et le pèlerinage d'adieu. Comme il le dit dans le premier épisode de sa série de 2026, c'était sa deuxième série sur la sira et elle insistait sur les leçons pour la réforme. Ces notices rapportent ce qu'il raconte et explique dans chaque épisode, en le lui attribuant, et citent l'épisode entier, sans indication de temps. C'est une source secondaire moderne, ni une source primaire ni une corroboration indépendante des événements."
  es: "Una serie de treinta y dos conferencias de Ahmed Elsayed sobre la biografía del Profeta Muhammad, dirigida a los reformadores y publicada en audio en su pódcast entre marzo y octubre de 2023. Va desde una introducción hasta una última sesión sobre las expediciones de Hunayn y Tabuk y la peregrinación de despedida. Como él mismo la describe en el primer episodio de su serie de 2026, fue su segunda serie sobre la sira y hacía hincapié en las lecciones para la reforma. Estos registros recogen lo que narra y explica en cada episodio, atribuido a él, y citan el episodio completo, sin indicar el minuto. Es una fuente secundaria moderna, ni fuente primaria ni corroboración independiente de los hechos."
