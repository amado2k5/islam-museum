  id: "Safinat al-Najat fi Fiqh al-Shafi'iyyah karya Salim ibn Abdullah ibn Samir al-Hadrami (wafat 1271 H) adalah sebuah karya prosa yang mengumpulkan tindakan ibadah dan transaksi paling awal menurut aliran tersebut; teks pemula dalam aliran Hadramaut dan Jawa {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
