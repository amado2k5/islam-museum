id: work/fatwa-aliftaa-jo-completed-thirty-days-then-moved-to-a-country-still-fasting
class: work
kind: fatwa
label: { ar: "من صام ثلاثين يومًا ثم انتقل إلى بلد لا يزال أهله صائمين", en: "Completing thirty days of fasting, then moving to a country still fasting", ur: "تیس روزے پورے کر کے ایسے ملک جانا جہاں لوگ ابھی روزے سے ہوں" }
summary:
  ar: "سؤال عن من صام ثلاثين يومًا ثم انتقل إلى بلد لا يزال أهله صائمين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يوافقهم في صوم آخر الشهر ويمسك معهم وجوبًا وإن أتم ثلاثين يومًا، لأنه صار منهم. أجابت الدائرة بأن من أتم الصيام في بلده ثم سافر إلى بلد آخر فوجدهم صائمين وافقهم في صوم آخر الشهر. وقالت إنه يمسك معهم وجوبًا وإن أتم ثلاثين يومًا، وإن كان أهل بلده قد عيّدوا، لأنه صار منهم."
  en: "A question about completing thirty days of fasting, then moving to a country still fasting, in which Jordan's General Iftaa Department answered that he joins them in fasting the end of the month and must refrain with them even if he has completed thirty days, because he has become one of them. The Department answered that someone who completed the fast in his country and then travelled to another country and found its people fasting joins them in fasting the end of the month. It said he must refrain from eating with them even if he has completed thirty days, and even though his own country has celebrated Eid, because he has become one of them."
  ur: "تیس روزے پورے کر کے ایسے ملک جانا جہاں لوگ ابھی روزے سے ہوں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ مہینے کے آخر کے روزے میں ان کے ساتھ موافقت کرے اور ان کے ساتھ لازماً رکا رہے، چاہے تیس روزے پورے کر چکا ہو، کیونکہ وہ انہی میں سے ہو گیا۔ ڈیپارٹمنٹ نے جواب دیا کہ جس نے اپنے ملک میں روزے مکمل کیے پھر دوسرے ملک گیا اور انہیں روزے سے پایا، وہ مہینے کے آخر کے روزے میں ان کے ساتھ موافقت کرے۔ اس نے کہا کہ وہ ان کے ساتھ لازماً کھانے پینے سے رکا رہے، چاہے تیس روزے پورے کر چکا ہو اور اس کے ملک میں عید ہو چکی ہو، کیونکہ وہ انہی میں سے ہو گیا۔"
