label: { ar: "من صام ثلاثين يومًا ثم انتقل إلى بلد لا يزال أهله صائمين", en: "Completing thirty days of fasting, then moving to a country still fasting", ur: "تیس روزے پورے کر کے ایسے ملک جانا جہاں لوگ ابھی روزے سے ہوں", es: "Completar treinta días de ayuno y luego mudarse a un país donde todavía se practica el ayuno.", fr: "Après trente jours de jeûne, se rendre dans un pays où le jeûne est encore pratiqué.", tr: "Otuz gün oruç tutan kişi, sonra hala oruç tutan bir ülkeye taşındı", id: "Siapa pun yang berpuasa selama tiga puluh hari lalu pindah ke negara yang rakyatnya masih berpuasa" }
summary:
  ar: "سؤال عن من صام ثلاثين يومًا ثم انتقل إلى بلد لا يزال أهله صائمين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يوافقهم في صوم آخر الشهر ويمسك معهم وجوبًا وإن أتم ثلاثين يومًا، لأنه صار منهم. أجابت الدائرة بأن من أتم الصيام في بلده ثم سافر إلى بلد آخر فوجدهم صائمين وافقهم في صوم آخر الشهر. وقالت إنه يمسك معهم وجوبًا وإن أتم ثلاثين يومًا، وإن كان أهل بلده قد عيّدوا، لأنه صار منهم."
  en: "A question about completing thirty days of fasting, then moving to a country still fasting, in which Jordan's General Iftaa Department answered that he joins them in fasting the end of the month and must refrain with them even if he has completed thirty days, because he has become one of them. The Department answered that someone who completed the fast in his country and then travelled to another country and found its people fasting joins them in fasting the end of the month. It said he must refrain from eating with them even if he has completed thirty days, and even though his own country has celebrated Eid, because he has become one of them."
  ur: "تیس روزے پورے کر کے ایسے ملک جانا جہاں لوگ ابھی روزے سے ہوں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ مہینے کے آخر کے روزے میں ان کے ساتھ موافقت کرے اور ان کے ساتھ لازماً رکا رہے، چاہے تیس روزے پورے کر چکا ہو، کیونکہ وہ انہی میں سے ہو گیا۔ ڈیپارٹمنٹ نے جواب دیا کہ جس نے اپنے ملک میں روزے مکمل کیے پھر دوسرے ملک گیا اور انہیں روزے سے پایا، وہ مہینے کے آخر کے روزے میں ان کے ساتھ موافقت کرے۔ اس نے کہا کہ وہ ان کے ساتھ لازماً کھانے پینے سے رکا رہے، چاہے تیس روزے پورے کر چکا ہو اور اس کے ملک میں عید ہو چکی ہو، کیونکہ وہ انہی میں سے ہو گیا۔"
  es: "Una pregunta sobre completar treinta días de ayuno y luego trasladarse a un país donde aún se practica el ayuno, a lo que el Departamento General de Iftaa de Jordania respondió que se une a ellos en el ayuno al final del mes y debe abstenerse de comer con ellos incluso después de haber completado treinta días, porque se ha convertido en uno de ellos. El Departamento respondió que quien completó el ayuno en su país y luego viajó a otro país donde encontró a su gente ayunando, se une a ellos en el ayuno al final del mes. Dijo que debe abstenerse de comer con ellos incluso después de haber completado treinta días, e incluso aunque su propio país haya celebrado el Eid, porque se ha convertido en uno de ellos."
  fr: "Une question concernait le fait d'avoir jeûné pendant trente jours, puis de se rendre dans un pays où le jeûne est encore en cours. Le Département général de la Iftaa en Jordanie a répondu que la personne concernée se joint au jeûne des habitants pour la fin du mois et doit s'abstenir de manger avec eux, même après avoir accompli les trente jours de jeûne, car elle est devenue l'un des leurs. Le Département a précisé que quiconque a jeûné dans son pays puis s'est rendu dans un autre pays où les habitants jeûnent se joint à eux pour la fin du mois. Il a ajouté qu'il doit s'abstenir de manger avec eux, même après avoir accompli les trente jours de jeûne et même si son propre pays a célébré l'Aïd, car il est devenu l'un des leurs."
  tr: "Otuz gün oruç tutup sonra halkı hala oruç tutan bir ülkeye taşınan birine dair bir soruya Ürdün Genel Fetva Dairesi, ay sonunda oruç tutma konusunda onlarla hemfikir olduğunu ve otuz gün tamamlasa bile oruç tutmayı zorunlu kıldığını çünkü o onlardan biri olduğunu yanıtladı. Daire, kendi ülkesinde oruç tutan ve sonra başka bir ülkeye gidip ay sonunda oruç tutan kişinin, ay sonunda oruç tutma konusunda onlarla aynı fikirde olduğunu söyledi. Ülkesinin halkı orucu geri getirmiş olsa bile, otuz gün tamamlasa bile onlarla oruç tutmayı zorunlu tuttuğunu söyledi, çünkü o da onlardan biri oldu."
  id: "Sebuah pertanyaan tentang seseorang yang berpuasa selama tiga puluh hari lalu pindah ke negara yang rakyatnya masih berpuasa, Departemen Fatwa Jenderal Yordania menjawab bahwa dia setuju dengan mereka untuk berpuasa di akhir bulan dan berkewajiban berpuasa bersama mereka meskipun dia sudah menyelesaikan tiga puluh hari, karena dia adalah salah satunya. Departemen menjawab bahwa siapa pun yang menyelesaikan puasa di negaranya sendiri lalu pergi ke negara lain dan menemukan mereka berpuasa di akhir bulan, dia setuju dengan mereka untuk puasa di akhir bulan. Dikatakan bahwa dia berkewajiban berpuasa bersama mereka meskipun dia menyelesaikan tiga puluh hari, meskipun rakyat negaranya telah kembali puasa, karena dia telah menjadi salah satu dari mereka."
