label: { ar: "كيفية سداد الدين المرهون بالذهب وحكم أخذ الأجرة على حفظه", en: "Repaying a debt pledged with gold and charging for keeping it", ur: "سونے کے عوض قرض کی ادائیگی اور اس کی حفاظت کی اجرت" }
summary:
  ar: "سائل سأل عن سداد دين مرهون فيه ذهب وحكم أخذ صاحب الرهن أجرة على حفظه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21749)⁩ أنه لا يجوز لصاحب الدين أن يطلب مبلغًا أكبر مما أقرضه ويجب عليه رد المرهون عند سداد الدين على ما فصّل الجواب."
  en: "A questioner asked about repaying a debt secured by a gold pledge and whether the pledge-holder may charge for keeping it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21749) answered that the lender may not demand more than he lent and must return the pledge when the debt is repaid — as the answer details."
  ur: "ایک سائل نے سونے کی گروی رکھی ہوئی قرض کی ادائیگی اور اس کی حفاظت پر اجرت لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21749)⁩ نے جواب دیا کہ قرض دینے والا اپنی رقم سے زیادہ نہیں مانگ سکتا اور قرض ادا ہونے پر گروی چیز واپس کرے — جیسا کہ جواب میں تفصیل ہے۔"
