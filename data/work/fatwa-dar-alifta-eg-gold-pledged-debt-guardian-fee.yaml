id: work/fatwa-dar-alifta-eg-gold-pledged-debt-guardian-fee
class: work
kind: fatwa
label: { ar: "كيفية سداد الدين المرهون بالذهب وحكم أخذ الأجرة على حفظه", en: "Repaying a debt pledged with gold and charging for keeping it", ur: "سونے کے عوض قرض کی ادائیگی اور اس کی حفاظت کی اجرت", es: "Pagar una deuda pignorada con oro y cobrar por mantenerla", fr: "Rembourser une dette garantie par de l'or et facturer sa conservation", tr: "Altına verilen bir borcun nasıl ödeneceği ve bunun güvenliği için kira alınması kararı", id: "Cara melunasi utang yang dijaminkan dalam emas dan aturan tentang pemungutan sewa untuk pengamanannya" }
summary:
  ar: "سائل سأل عن سداد دين مرهون فيه ذهب وحكم أخذ صاحب الرهن أجرة على حفظه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21749)⁩ أنه لا يجوز لصاحب الدين أن يطلب مبلغًا أكبر مما أقرضه ويجب عليه رد المرهون عند سداد الدين على ما فصّل الجواب."
  en: "A questioner asked about repaying a debt secured by a gold pledge and whether the pledge-holder may charge for keeping it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21749) answered that the lender may not demand more than he lent and must return the pledge when the debt is repaid — as the answer details."
  ur: "ایک سائل نے سونے کی گروی رکھی ہوئی قرض کی ادائیگی اور اس کی حفاظت پر اجرت لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21749)⁩ نے جواب دیا کہ قرض دینے والا اپنی رقم سے زیادہ نہیں مانگ سکتا اور قرض ادا ہونے پر گروی چیز واپس کرے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el reembolso de una deuda garantizada con una prenda de oro y si el acreedor prendario puede cobrar por su custodia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21749) respondió que el prestamista no puede exigir más de lo prestado y debe devolver la prenda una vez saldada la deuda, tal como se detalla en la respuesta."
  fr: "Une question portait sur le remboursement d'une dette garantie par un nantissement d'or et sur la possibilité pour le créancier de percevoir des frais de conservation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21749) a répondu que le prêteur ne peut exiger plus que le montant prêté et doit restituer le nantissement une fois la dette remboursée, comme le précise la réponse."
  tr: "Bir soru soran kişi, altını içeren ipotekli borcun ödenmesi hakkında soru sordu ve hükmü, ipotek sahibinin borcu korumak için ücret alması gerektiği yönündeydi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21749), borçlunun verdiği borcun üzerinde bir miktar talep etmesinin kabul edilmediğini ve ipotekli mülkü geri ödemede geri vermesi gerektiğini cevapta ayrıntılı olarak belirtti."
  id: "Seorang penanya menanyakan tentang pelunasan utang yang digadaikan yang melibatkan emas, dan putusannya adalah bahwa pemilik hipotek harus mengenakan biaya untuk melindungi utang tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21749) menjawab bahwa tidak diperbolehkan bagi debitur untuk menuntut jumlah yang lebih besar dari yang dipinjamkan dan harus mengembalikan properti yang digadaikan setelah pelunasan sebagaimana dijelaskan dalam jawaban."
