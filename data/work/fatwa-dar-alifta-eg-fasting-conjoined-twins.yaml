label: { ar: "حكم صوم رمضان للتوأمين الملتصقين والترخص بالفطر", en: "Fasting Ramadan for conjoined twins and the license to break it", ur: "چپکے جڑواں بچوں کے لیے رمضان کے روزے اور افطار کی رخصت" }
summary:
  ar: "سائل سأل عن صوم التوأمين الملتصقين في رمضان والترخص بالفطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22521)⁩ أنه إذا اتحد التوأمان الملتصقان في القلب أو المخ فهما شخص واحد يحصل الصوم في حقه بالإمساك عن المفطرات، أما إن انفصلا في هذه الأعضاء فلكل حكمه، وبيّن الجواب الترخص بالفطر عند المشقة."
  en: "A questioner asked about conjoined twins' fasting in Ramadan and the license to break it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22521) answered that conjoined twins sharing a heart or brain count as one person, the fast being performed by abstention from its nullifiers; where they are separate in those organs each has his own ruling — and the answer sets out the license to break the fast under hardship."
  ur: "ایک سائل نے چپکے جڑواں بچوں کے رمضان کے روزے اور افطار کی رخصت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22521)⁩ نے جواب دیا کہ جو جڑواں دل یا دماغ میں متحد ہوں وہ ایک شخص شمار ہوتے ہیں اور ان کے حق میں روزہ افطار کرنے والی چیزوں سے اجتناب سے حاصل ہوتا ہے؛ اگر ان اعضاء میں جدا ہوں تو ہر ایک کا اپنا حکم ہے — اور جواب میں مشقت کی صورت میں افطار کی رخصت بیان ہوئی۔"
