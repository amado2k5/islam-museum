id: work/fatwa-dar-alifta-eg-fasting-conjoined-twins
class: work
kind: fatwa
label: { ar: "حكم صوم رمضان للتوأمين الملتصقين والترخص بالفطر", en: "Fasting Ramadan for conjoined twins and the license to break it", ur: "چپکے جڑواں بچوں کے لیے رمضان کے روزے اور افطار کی رخصت", es: "El ayuno de Ramadán para gemelos siameses y la licencia para romperlo", fr: "Le jeûne du Ramadan pour les jumeaux siamois et le droit de le rompre" }
summary:
  ar: "سائل سأل عن صوم التوأمين الملتصقين في رمضان والترخص بالفطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22521)⁩ أنه إذا اتحد التوأمان الملتصقان في القلب أو المخ فهما شخص واحد يحصل الصوم في حقه بالإمساك عن المفطرات، أما إن انفصلا في هذه الأعضاء فلكل حكمه، وبيّن الجواب الترخص بالفطر عند المشقة."
  en: "A questioner asked about conjoined twins' fasting in Ramadan and the license to break it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22521) answered that conjoined twins sharing a heart or brain count as one person, the fast being performed by abstention from its nullifiers; where they are separate in those organs each has his own ruling — and the answer sets out the license to break the fast under hardship."
  ur: "ایک سائل نے چپکے جڑواں بچوں کے رمضان کے روزے اور افطار کی رخصت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22521)⁩ نے جواب دیا کہ جو جڑواں دل یا دماغ میں متحد ہوں وہ ایک شخص شمار ہوتے ہیں اور ان کے حق میں روزہ افطار کرنے والی چیزوں سے اجتناب سے حاصل ہوتا ہے؛ اگر ان اعضاء میں جدا ہوں تو ہر ایک کا اپنا حکم ہے — اور جواب میں مشقت کی صورت میں افطار کی رخصت بیان ہوئی۔"
  es: "Un consultante preguntó sobre el ayuno de los gemelos siameses durante el Ramadán y la autorización para romperlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22521) respondió que los gemelos siameses que comparten un corazón o un cerebro cuentan como una sola persona, y que el ayuno se realiza absteniéndose de los alimentos que lo anulan; cuando están separados en esos órganos, cada uno tiene su propia norma, y la respuesta establece la autorización para romper el ayuno en caso de dificultades."
  fr: "Un internaute a posé une question concernant le jeûne des jumeaux siamois pendant le Ramadan et la possibilité de le rompre. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22521) a répondu que les jumeaux siamois partageant un cœur ou un cerveau sont considérés comme une seule personne, le jeûne étant alors annulé par l'abstention de ces organes. En revanche, lorsqu'ils sont séparés au niveau de ces organes, chaque cas est soumis à une règle distincte. La réponse précise également la possibilité de rompre le jeûne en cas de difficultés."
