id: work/fatwa-dar-alifta-eg-repeated-ihram-breaches-one-fidya
class: work
kind: fatwa
label: { ar: "تعدد الكفارات في الحج عند ارتكاب محظورات الإحرام", en: "Multiple expiations for repeated breaches of ihram in Hajj", ur: "حج میں محظورات کی تکرار پر کفارے کی تکثر", es: "Múltiples expiaciones por repetidas violaciones del ihram en el Hajj.", fr: "Expiations multiples pour les violations répétées de l'ihram lors du Hajj", tr: "Hac sırasında İhram yasaklarını uygularken birden fazla kefaret", id: "Penebusan dosa berulang saat Haji melakukan larangan Ihram" }
summary:
  ar: "سائل سأل عن تعدد الكفارات عند تكرار محظور من محظورات الإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20696)⁩ أنه إذا ارتكب المحرم بالحج محظورًا وكرره فتجب عليه فدية واحدة ما لم يكفر عنه على ما فصّل الجواب."
  en: "A questioner asked about multiple expiations when a prohibition of ihram is repeated. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20696) answered that repeating the same breach obliges a single fidya so long as it was not expiated in between — as the answer details."
  ur: "ایک سائل نے احرام کے کسی محظور کی تکرار پر کفاروں کی تکثر پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20696)⁩ نے جواب دیا کہ درمیان میں کفارہ نہ دیا ہو تو ایک ہی فدیہ واجب ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de las expiaciones múltiples cuando se repite la prohibición del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20696) respondió que repetir la misma infracción obliga a una sola fidya siempre que no haya sido expiada entretanto, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les expiations multiples en cas de récidive d'une interdiction d'ihram. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20696) a répondu que la récidive d'une même infraction n'entraîne qu'une seule fidya, à condition qu'elle n'ait pas été expiée entre-temps – comme le précise la réponse."
  tr: "Bir soru soran kişi, İhram yasaklarından yasak bir şeyi tekrar ederken yapılan çoklu kefaretleri sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 20696), ihramda bir kişi hac sırasında yasak bir eylem yapıp tekrarlarsa, cevabında açıklandığı gibi, kefaret etmezse bir fidya yapılması gerektiğini cevaplamıştır."
  id: "Seorang penanya menanyakan tentang berbagai penebusan saat mengulangi suatu hal yang dilarang dari larangan Ihram. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20696) menjawab bahwa jika seseorang dalam Ihram melakukan tindakan terlarang selama Haji dan mengulanginya, satu fidya harus dibayar kecuali ia menebusnya, seperti yang dijelaskan dalam jawaban."
