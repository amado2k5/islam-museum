label: { ar: "تعدد الكفارات في الحج عند ارتكاب محظورات الإحرام", en: "Multiple expiations for repeated breaches of ihram in Hajj", ur: "حج میں محظورات کی تکرار پر کفارے کی تکثر", es: "Múltiples expiaciones por repetidas violaciones del ihram en el Hajj." }
summary:
  ar: "سائل سأل عن تعدد الكفارات عند تكرار محظور من محظورات الإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20696)⁩ أنه إذا ارتكب المحرم بالحج محظورًا وكرره فتجب عليه فدية واحدة ما لم يكفر عنه على ما فصّل الجواب."
  en: "A questioner asked about multiple expiations when a prohibition of ihram is repeated. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20696) answered that repeating the same breach obliges a single fidya so long as it was not expiated in between — as the answer details."
  ur: "ایک سائل نے احرام کے کسی محظور کی تکرار پر کفاروں کی تکثر پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20696)⁩ نے جواب دیا کہ درمیان میں کفارہ نہ دیا ہو تو ایک ہی فدیہ واجب ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de las expiaciones múltiples cuando se repite la prohibición del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20696) respondió que repetir la misma infracción obliga a una sola fidya siempre que no haya sido expiada entretanto, como se detalla en la respuesta."
