label: { ar: "قصيدة الزبرقان بن بدر في الفخر بقومه بين يدي النبي", en: "Al-Zibriqan ibn Badr's boasting poem before the Prophet", es: "El poema jactancioso de Al-Zibriqan ibn Badr ante el Profeta", fr: "Le poème vantard d'Al-Zibriqan ibn Badr devant le Prophète", ur: "الزبرقان بن بدر کا نبی کے سامنے فخریہ شعر" }
summary:
  ar: "قصيدة الفخر التي قام بها الزبرقان بن بدر في مفاخرة وفد بني تميم بمسجد النبي سنة 9هـ: نحن الكرام، منا الملوك، نُطعم عند القحط، ونُفاخر فنغلب. أجابه حسان بن ثابت. يثبت ابن هشام روايتين لبعض ألفاظها رواهما له بعض بني تميم."
  en: "The boast al-Zibriqan ibn Badr declaimed in the Banu Tamim delegation's contest at the Prophet's mosque in 9 AH: we are the noble, ours are the kings, we feed in drought and win every boast. Hassan ibn Thabit answered it. Ibn Hisham records two variant readings he heard from men of Tamim."
  es: "La jactancia que al-Zibriqan ibn Badr proclamó en el concurso de la delegación Banu Tamim en la mezquita del Profeta en el año 9 de la Hégira: «Somos los nobles, nuestros son los reyes, prosperamos en tiempos de sequía y ganamos en toda jactancia». Hassan ibn Thabit la replicó. Ibn Hisham registra dos variantes textuales que escuchó de hombres de Tamim."
  fr: "Lors du concours organisé par la délégation des Banu Tamim à la mosquée du Prophète en l'an 9 de l'Hégire, al-Zibriqan ibn Badr proclama avec véhémence: « Nous sommes les nobles, les nôtres sont les rois, nous prospérons même en temps de sécheresse et remportons tous les concours. » Hassan ibn Thabit lui répondit. Ibn Hisham rapporte deux variantes de lecture qu'il aurait entendues de la bouche d'hommes de Tamim."
  ur: "فخر الزبرقان ابن بدر نے 9 ہجری میں مسجد نبوی میں بنو تمیم کے وفد کے مقابلہ میں اعلان کیا: ہم ہی اعلیٰ ہیں، ہمارے بادشاہ ہیں، ہم قحط میں کھانا کھاتے ہیں اور ہر فخر کو جیتتے ہیں۔ حسان بن ثابت نے جواب دیا۔ ابن ہشام نے تمیم کے آدمیوں سے سننے والے دو مختلف قراء ت درج کیے ہیں۔"
