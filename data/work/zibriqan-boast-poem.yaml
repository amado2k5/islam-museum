summary:
  ar: "قصيدة الفخر التي قام بها الزبرقان بن بدر في مفاخرة وفد بني تميم بمسجد النبي سنة 9هـ: نحن الكرام، منا الملوك، نُطعم عند القحط، ونُفاخر فنغلب. أجابه حسان بن ثابت. يثبت ابن هشام روايتين لبعض ألفاظها رواهما له بعض بني تميم."
  en: "The boast al-Zibriqan ibn Badr declaimed in the Banu Tamim delegation's contest at the Prophet's mosque in 9 AH: we are the noble, ours are the kings, we feed in drought and win every boast. Hassan ibn Thabit answered it. Ibn Hisham records two variant readings he heard from men of Tamim."
