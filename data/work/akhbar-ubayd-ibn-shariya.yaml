label: { ar: "أخبار عبيد بن شرية", en: "The Akhbar of Ubayd ibn Shariya", es: "El Akhbar de Ubayd ibn Shari'ah", fr: "L'Akhbar d'Ubayd ibn Shari'ah", ur: "عبید بن شریح کا اخبار", tr: "Ubaid bin Shriyah Haberleri", id: "Berita tentang Ubaid bin Shriyah" }
summary:
  ar: "كتاب عبيد بن شرية الجرهمي في أخبار الماضين وتشعب الأنساب، كان متداولاً في أيدي الناس مشهوراً في زمن المسعودي، وذكر كثير من ذوي المعرفة بأخبارهم أن هذه أخبار موضوعة من خرافات مصنوعة نظمها من تقرب للملوك بروايتها، وسبيلها سبيل الكتب المترجمة من الفارسية والهندية والرومية {cite:muruj-al-dhahab p. 549-550}."
  en: "Ubayd ibn Shariya's famous circulating book of the ancients' lore — which al-Mas'udi reports the learned dismissed as fabricated romances composed to court kings, of a piece with the translated Persian, Indian and Greek story-collections {cite:muruj-al-dhahab p. 549-550}."
  es: "El famoso libro de Ubayd ibn Shariya sobre la tradición de los antiguos, que según al-Mas'udi los eruditos descartaron como romances inventados compuestos para cortejar a los reyes, en consonancia con las colecciones de cuentos persas, indios y griegos traducidas {cite:muruj-al-dhahab p. 549-550}."
  fr: "Le célèbre livre d'Ubayd ibn Shariya, qui circulait sur les savoirs des anciens, a été rejeté par les savants comme des romans fabriqués composés pour les rois de cour, dans la même veine que les recueils d'histoires persans, indiens et grecs traduits {cite:muruj-al-dhahab p. 549-550}."
  ur: "عبید بن شریعہ کی مشہور زمانہ قدیم کی کتاب - جسے المسعودی نے درباری بادشاہوں پر مشتمل من گھڑت رومانس کے طور پر مسترد کر دیا ہے، فارسی، ہندوستانی اور یونانی کہانیوں کے مجموعوں کا ترجمہ کیا ہے {حوالہ: مروج الذہب صفحہ۔ 549-550}۔"
  tr: "'Ubayd ibn Shriyyah al-Jurhami Geçmiş Anlatımları ve Soy Dalları Üzerine' adlı kitap, el-Mas'udi döneminde halk arasında geniş çapta dolaşmıştır. Birçok bilgili kişi, hikâyeleriyle, bunların krallara yaklaşanların anlatımlarına göre uydurulmuş hikayeler olduğunu ve kaynaklarının Farsça, Hintçe ve Romaca'dan kitapların çevirisi olduğunu belirtmiştir {cite:muruj-al-dhahab, s. 549-550}."
  id: "Buku 'Ubayd ibn Shriyyah al-Jurhami tentang Kisah Masa Lalu dan Cabang-cabang Garis Keturunan' banyak beredar di kalangan masyarakat pada masa al-Mas'udi. Banyak orang berpengetahuan dalam cerita mereka menyebutkan bahwa cerita-cerita ini adalah rekaan yang disusun oleh mereka yang mendekati raja berdasarkan narasi mereka, dan sumbernya adalah terjemahan buku dari bahasa Persia, Hindi, dan Romawi {cite:muruj-al-dhahab, hlm. 549-550}."
