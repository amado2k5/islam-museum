id: work/fatwa-dar-alifta-eg-buyer-charging-shafee-extra
class: work
kind: fatwa
label: { ar: "حكم طلب المشتري من الشفيع ثمنًا زائدًا عما دفعه", en: "May the buyer charge the pre-emptor more than he paid?", ur: "کیا خریدار شفیع سے ادا شدہ قیمت سے زیادہ مانگ سکتا ہے", es: "¿Puede el comprador cobrar al titular del derecho de tanteo más de lo que pagó?", fr: "L'acheteur peut-il facturer au préempteur un prix supérieur à celui qu'il a payé ?" }
summary:
  ar: "سائل سأل عن طلب المشتري من الشفيع ثمنًا زائدًا عما دفعه للبائع الأول. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20954)⁩ أنه لا يجوز للمشتري أن يطلب من الشفيع ثمنًا زائدًا عما دفعه لوجوب أخذها بالثمن الأول باتفاق الفقهاء على ما فصّل الجواب."
  en: "A questioner asked about the buyer demanding from the pre-emptor a price exceeding what he paid the first seller. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20954) answered that he may not — the jurists agree the pre-emptor takes at the first price — as the answer details."
  ur: "ایک سائل نے خریدار کے شفیع سے پہلی قیمت سے زیادہ مانگنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20954)⁩ نے جواب دیا کہ ایسا جائز نہیں کیونکہ فقہاء کے اتفاق سے شفیع پہلی قیمت پر لیتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que el comprador exigiera al tercero un precio superior al que pagó al primer vendedor. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20954) respondió que no puede hacerlo, ya que los juristas coinciden en que el tercero adquiere el bien al primer precio, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'acheteur pouvait exiger du vendeur un prix supérieur à celui payé au premier vendeur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20954) a répondu que cela était impossible: les juristes s'accordent à dire que le vendeur acquiert le prix initialement proposé, comme le précise la réponse."
