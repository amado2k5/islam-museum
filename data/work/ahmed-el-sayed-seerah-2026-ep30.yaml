label:
  ar: "سيرة رسول الله 2026، الحلقة 30: الشبهات التي واجه بها المشركون دعوة النبي"
  en: "The Biography of the Messenger of God 2026, episode 30: The objections the polytheists raised against the Prophet's call"
  ur: "سیرتِ رسول اللہ 2026، قسط 30: نبی کی دعوت کے خلاف مشرکین کے اعتراضات"
  fr: "La biographie du Messager de Dieu 2026, épisode 30 : Les objections des polythéistes contre l'appel du Prophète"
  es: "La biografía del Mensajero de Dios 2026, episodio 30: Las objeciones de los politeístas contra la llamada del Profeta"
summary:
  ar: "يستأنف المحاضر قراءة سيرة ابن هشام برواية ابن إسحاق عند سنوات الحصار في الشعب، ويمرّ على الفصول التي جمعت اعتراضات زعماء قريش وحججهم على النبي والآيات التي رُوي أنها نزلت جوابًا على كل منها. ويلاحظ اختلاف أسلوب كل خصم، ويعلّق على عناية ابن إسحاق في بيان أسانيده، ويختم بخبر ابن أم مكتوم ومطلع سورة عبس."
  en: "The lecturer resumes reading Ibn Hisham's recension of Ibn Ishaq, at the years of the siege in the valley, and goes through the chapters that gather the objections and arguments the Meccan leaders raised against the Prophet, with the verses reported to have answered each. He notes the different style of each opponent, comments on Ibn Ishaq's care in marking his chains of report, and ends with the report on Ibn Umm Maktum and the opening of Surat Abasa."
  ur: "مقرر ابن اسحاق کی روایت سے ابن ہشام کی سیرت کی قرأت دوبارہ شروع کرتے ہیں، شعب میں محاصرے کے برسوں سے، اور ان ابواب سے گزرتے ہیں جن میں مکہ کے سرداروں کے نبی پر اعتراضات اور دلائل جمع ہیں، ساتھ وہ آیات جو ہر ایک کے جواب میں نازل ہونا روایت ہوئی ہیں۔ وہ ہر مخالف کے مختلف انداز کی طرف توجہ دلاتے ہیں، ابن اسحاق کے اپنی اسناد واضح کرنے کے اہتمام پر تبصرہ کرتے ہیں، اور ابن ام مکتوم کی روایت اور سورہ عبس کے آغاز پر ختم کرتے ہیں۔"
  fr: "Le conférencier reprend la lecture de la recension d'Ibn Hisham d'Ibn Ishaq, aux années du siège dans la vallée, et parcourt les chapitres qui rassemblent les objections et les arguments des chefs mecquois contre le Prophète, avec les versets rapportés comme leur répondant. Il note le style différent de chaque adversaire, commente le soin d'Ibn Ishaq à signaler ses chaînes de transmission, et termine par le récit d'Ibn Umm Maktum et l'ouverture de la sourate Abasa."
  es: "El conferenciante retoma la lectura de la recensión de Ibn Hisham de Ibn Ishaq, en los años del cerco en el valle, y repasa los capítulos que reúnen las objeciones y los argumentos que los jefes mecanos plantearon contra el Profeta, con los versículos que se cuentan como respuesta a cada uno. Señala el estilo distinto de cada adversario, comenta el cuidado de Ibn Ishaq al marcar sus cadenas de transmisión y termina con el relato de Ibn Umm Maktum y el comienzo de la sura Abasa."
