id: work/fatwa-dar-alifta-eg-umrah-upon-umrah
class: work
kind: fatwa
label: { ar: "حكم الإحرام بالعمرة على العمرة", en: "Assuming ihram for a second umrah before finishing the first", ur: "ایک عمرہ مکمل کرنے سے پہلے دوسرے عمرے کا احرام", es: "Tomar el estado de ihram para una segunda umrah antes de terminar la primera." }
summary:
  ar: "سائل أحرم بالعمرة ثم أحرم بأخرى عليها قبل إتمام مناسك الأولى فسأل عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21785)⁩ أن الإحرام بالثانية قبل إتمام الأولى يجعل الثانية لغوًا وبيّن الجواب معنى ذلك وما يترتب عليه على وجهه."
  en: "A man assumed ihram for an umrah and then assumed ihram for another before completing the first's rites; he asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21785) answered that assuming ihram for the second before completing the first renders the second void, and the answer explains what that entails."
  ur: "ایک شخص نے عمرہ کا احرام باندھا اور پہلے کے مناسک مکمل کرنے سے پہلے دوسرے کا احرام باندھ لیا؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21785)⁩ نے جواب دیا کہ اس سے دوسرا عمرہ لغو ہو جاتا ہے اور جواب میں اس کے نتائج بیان ہوئے۔"
  es: "Un hombre se puso en estado de ihram para una umrah y luego para otra antes de completar los ritos de la primera; consultó sobre la norma. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21785) respondió que ponerse en estado de ihram para la segunda antes de completar la primera invalida la segunda, y la respuesta explica las implicaciones de ello."
