label: { ar: "بيان المقصود بالشائعات ومخاطرها وسبل الوقاية منها في ضوء الشريعة", en: "What rumours are, their dangers and safeguards against them in the light of the sharia", ur: "افواہ سے کیا مراد ہے، ان کے خطرات اور شریعت کی روشنی میں ان سے بچاؤ کے طریقے", es: "Qué son los rumores, sus peligros y las medidas de protección contra ellos a la luz de la sharia.", fr: "Que sont les rumeurs, quels sont leurs dangers et comment s'en prémunir à la lumière de la charia ?", tr: "Söylentilerin anlamını, risklerini ve Şeriat ışığında önleme yollarını netleştirmek", id: "Menjelaskan makna rumor, risikonya, dan cara mencegahnya berdasarkan Syariah" }
summary:
  ar: "سائل سأل: ما المقصود بالشائعات، وما أبرز مخاطرها والعوامل التي تسهم في انتشارها، وكيف وجهت الشريعة إلى مواجهتها؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24427)⁩ بأن الشائعات هي الأخبار والمعلومات التي يجري تداولها بين الناس دون التحقق من صحتها، وقد تكون مختلقة من أصلها أو صحيحة خالطها تحريف أو مبالغة، وبيّن الجواب مخاطرها وكيف واجهتها الشريعة."
  en: "A questioner asked what is meant by rumours, their chief dangers and the factors behind their spread, and how the sharia directs Muslims to confront them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24427) answered that rumours are news and information circulated among people without verification of their truth — sometimes fabricated outright, sometimes true reports mixed with distortion or exaggeration — and the answer sets out their dangers and the sharia's countermeasures."
  ur: "ایک سائل نے پوچھا کہ افواہ سے کیا مراد ہے، اس کے اہم خطرات اور اس کے پھیلاؤ میں معاون عوامل کیا ہیں، اور شریعت نے ان کا مقابلہ کیسے سکھایا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24427)⁩ نے جواب دیا کہ افواہ وہ خبریں اور معلومات ہیں جو لوگوں میں بغیر تصدیق گردش کرتی ہیں — کبھی بالکل گھڑی ہوئیں اور کبھی سچی خبریں جن میں تحریف یا مبالغہ مل گیا ہو — اور جواب میں ان کے خطرات اور شریعت کے تدابیر بیان کیے گئے۔"
  es: "Un interlocutor preguntó qué se entiende por rumores, cuáles son sus principales peligros y los factores que influyen en su propagación, y cómo la sharia orienta a los musulmanes para que los combatan. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 24427) respondió que los rumores son noticias e información que circulan entre la gente sin verificar su veracidad —a veces inventadas por completo, a veces informes veraces mezclados con distorsiones o exageraciones— y la respuesta expone sus peligros y las contramedidas de la sharia."
  fr: "Un internaute a demandé ce que l'on entend par rumeurs, quels sont leurs principaux dangers et les facteurs qui favorisent leur propagation, et comment la charia enjoint aux musulmans de les combattre. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24427) a répondu que les rumeurs sont des nouvelles et des informations qui circulent sans vérification de leur véracité – parfois totalement inventées, parfois des faits avérés mêlés de distorsion ou d'exagération – et la réponse expose leurs dangers ainsi que les mesures de la charia pour les contrer."
  tr: "Bir soru soran kişi: Söylentilerden kastı nedir, başlıca tehlikeleri nelerdir, yayılmalarına katkıda bulunan faktörler nelerdir ve Şeriat bunlarla nasıl mücadele etti? Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 24427), söylentilerin gerçeklikleri doğrulanmadan insanlar arasında dolaşan haber ve bilgi olduğunu yanıtladı. Bunlar kökenlerinden uydurulmuş olabilir ya da çarpıtma ya da abartı ile karıştırılmış gerçek olabilir. Cevap, risklerini ve Şeriat'ın onlarla nasıl karşılaştığını açıkladı."
  id: "Seorang penanya bertanya: Apa yang dimaksud dengan rumor, apa bahaya utamanya, dan faktor-faktor yang berkontribusi pada penyebarannya, dan bagaimana Syariah mengarahkan untuk menghadapinya? Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 24427) menanggapi bahwa rumor adalah berita dan informasi yang beredar di antara masyarakat tanpa memverifikasi keasliannya. Rumor tersebut mungkin dibuat-buat dari asalnya atau otentik dicampur dengan distorsi atau berlebihan. Jawabannya memperjelas risiko mereka dan bagaimana Syariah menghadapinya."
