id: work/fatwa-amja-wine-as-disinfectant
class: work
kind: fatwa
label: { ar: "الخمر معقمًا", en: "Wine as disinfectant — no, while lawful alternatives exist", ur: "شراب بطور جراثیم کش — جائز نہیں", es: "El vino como desinfectante: no, aunque existen alternativas legales." }
summary:
  ar: "سأل سائل عن حكم استخدام الخمر أو المشروبات الكحولية معقمًا في ضوء قلة توفر المعقمات. أجابت اللجنة الدائمة للإفتاء بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87742 بتاريخ 30 مارس 2020)⁩ أن استخدام الخمر والمشروبات الكحولية كمعقم لا يجوز ولا يصار إليه إلا في حال الضرورة القصوى لوجود البدائل المباحة عوضًا عنها من الصابون بأنواعه ومعقمات اليد وبعض مواد التنظيف الكيماوية المعروفة بقتل الفيروسات والبكتيريا، وعليه لا يجوز بيع الخمر وشراؤها لهذا الغرض لما استقر في الشريعة من تحريم بيعها وشرائها على ما فصّل."
  en: "A questioner asked whether wine or alcoholic drinks may be used as disinfectant amid the sanitizer shortage. AMJA's Permanent Fatwa Committee (no. 87742, 30 March 2020) answered that using wine and alcoholic drinks as disinfectant is not lawful and is resorted to only in utmost necessity, since lawful alternatives exist in their place — soaps of every kind, hand sanitizers and certain chemical cleaners known to kill viruses and bacteria; accordingly selling and buying wine for this purpose is not lawful, per the sharia's settled prohibition on trading in it — as the answer details."
  ur: "ایک سائل نے شراب کو جراثیم کش بنانے کا حکم پوچھا۔ مجمع کی کمیٹی ⁦(فتویٰ 87742، 30 مارچ 2020)⁩ کے مطابق بدل موجود ہونے پر جائز نہیں اور خرید فروخت بھی حرام ہے۔"
  es: "Un usuario preguntó si el vino o las bebidas alcohólicas podían utilizarse como desinfectante ante la escasez de desinfectantes para manos. El Comité Permanente de Fatwas de AMJA (n.º 87742, 30 de marzo de 2020) respondió que el uso de vino y bebidas alcohólicas como desinfectante no es lícito y solo se recurre a ello en casos de extrema necesidad, ya que existen alternativas lícitas: jabones de todo tipo, desinfectantes para manos y ciertos limpiadores químicos conocidos por eliminar virus y bacterias; por consiguiente, la compraventa de vino con este fin no es lícita, según la prohibición establecida por la sharia sobre su comercio, como se detalla en la respuesta."
