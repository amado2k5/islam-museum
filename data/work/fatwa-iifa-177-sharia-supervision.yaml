label: { ar: "قرار مجمع الفقه الإسلامي الدولي 177 (19/3) بشأن دور الرقابة الشرعية في ضبط أعمال البنوك الإسلامية", en: "IIFA resolution 177 (19/3) on the role of sharia supervision in controlling the work of Islamic banks", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 177 (19/3): اسلامی بینکوں کے امور کی ضبط کاری میں شرعی نگرانی کا کردار", es: "Resolución 177 (19/3) de la IIFA sobre el papel de la supervisión de la sharia en el control del trabajo de los bancos islámicos.", fr: "Résolution 177 (19/3) de l'IIFA sur le rôle de la supervision de la charia dans le contrôle des activités des banques islamiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 177 (19/3) İslami bankaların faaliyetlerinin düzenlenmesinde Şeriat denetiminin rolüne ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 177 (19/3) mengenai peran pengawasan Syariah dalam mengatur operasi bank-bank Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. عرّف الرقابة الشرعية بأنها إصدار الفتاوى والأحكام المتعلقة بنشاط المؤسسة المالية ومتابعة تنفيذها والتأكد من سلامة تطبيقها، وجعل مكوناتها ثلاثة: هيئة الرقابة الشرعية وهي مجموعة لا تقل عن ثلاثة من المتخصصين في الفقه الإسلامي وبخاصة فقه المعاملات ممن تتحقق فيهم الأهلية العلمية والدراية بالواقع العملي، تصدر الفتاوى وتراجع المعاملات وتقدم تقريرًا للجمعية العامة وتكون قراراتها ملزمة، مع اشتراط استقلالها بأن يكون تعيين أعضائها وإعفاؤهم وتحديد مكافآتهم من الجمعية العامة؛ والرقابة الشرعية الداخلية بوصفها جهازًا تنفيذيًا يتابع التطبيق؛ والتدقيق الشرعي الخارجي. وبين أهمية الرقابة في تحقيق مصداقية المؤسسات الإسلامية واشترط لأدائها ضوابط في التكوين والاختصاص والاستقلالية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It defined sharia supervision as issuing the fatwas and legal rulings concerning a financial institution's activity, following up their implementation and verifying sound application, and made its components three: the sharia supervisory board — a group of no fewer than three specialists in Islamic jurisprudence, especially the law of transactions, combining scholarly competence with practical awareness, which issues fatwas, reviews transactions, reports to the general assembly and whose decisions are binding, its independence secured by the general assembly appointing, dismissing and remunerating its members; internal sharia supervision as an executive body tracking application; and external sharia audit. It set out the importance of supervision for the credibility of Islamic institutions and the controls required for its composition, remit and independence."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے شرعی نگرانی کی تعریف کی: مالی ادارے کی سرگرمی سے متعلق فتاویٰ اور شرعی احکام جاری کرنا، ان پر عمل کی نگرانی اور درست اطلاق کی تصدیق؛ اور اس کے تین اجزا قرار دیے: شرعی نگران بورڈ — فقہِ اسلامی بالخصوص فقہِ معاملات کے کم از کم تین ماہرین کا مجموعہ جس میں علمی اہلیت اور عملی واقعیت کی شناخت دونوں ہوں، جو فتاویٰ جاری کرے، معاملات کا جائزہ لے، جنرل اسمبلی کو رپورٹ دے اور جس کے فیصلے لازم ہوں، اس کی خود مختاری اس امر سے قائم ہو کہ ارکان کی تقرری، برطرفی اور معاوضہ جنرل اسمبلی کرے؛ داخلی شرعی نگرانی بطور انتظامی نظام جو اطلاق کی پیروی کرے؛ اور بیرونی شرعی آڈٹ۔ متن میں اسلامی اداروں کی ساکھ کے لیے اس نگرانی کی اہمیت اور اس کی تشکیل، دائرۂ اختیار اور آزادی کے ضوابط بیان ہوئے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009). Definió la supervisión de la sharia como la emisión de fatuas y resoluciones legales relativas a la actividad de una institución financiera, el seguimiento de su implementación y la verificación de su correcta aplicación, y estableció tres componentes: el consejo de supervisión de la sharia —un grupo de al menos tres especialistas en jurisprudencia islámica, especialmente en derecho de transacciones, que combinan competencia académica con conocimiento práctico, que emite fatuas, revisa transacciones, informa a la asamblea general y cuyas decisiones son vinculantes, cuya independencia está garantizada por la asamblea general que nombra, destituye y remunera a sus miembros—; la supervisión interna de la sharia como órgano ejecutivo que supervisa la aplicación; y la auditoría externa de la sharia. Se destacó la importancia de la supervisión para la credibilidad de las instituciones islámicas y los controles necesarios para su composición, ámbito de actuación e independencia."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009) définit la supervision de la charia comme l'émission de fatwas et de décisions juridiques concernant l'activité d'un établissement financier, le suivi de leur mise en œuvre et la vérification de leur application conforme. Elle définit ses composantes comme suit: le conseil de supervision de la charia – un groupe d'au moins trois spécialistes en jurisprudence islamique, notamment en droit des transactions, alliant compétence académique et sens pratique, qui émet des fatwas, examine les transactions, fait rapport à l'assemblée générale et dont les décisions sont contraignantes, son indépendance étant garantie par le pouvoir de nomination, de révocation et de rémunération de ses membres par l'assemblée générale; la supervision interne de la charia, un organe exécutif chargé du suivi de l'application; et l'audit externe de la charia. La résolution souligne l'importance de la supervision pour la crédibilité des institutions islamiques et les contrôles nécessaires à sa composition, à son mandat et à son indépendance."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dokuzuncu oturumunda (1–5 Jumada al-Awwal 1430 H, 26–30 Nisan 2009) toplu kararı olarak tanımlanmıştır. Şeriat denetimi, finansal kurumun faaliyetleriyle ilgili fetva ve hükümler vermek, uygulamalarını izlemek, doğru uygulamalarını sağlamak ve bileşenlerini üç olarak oluşturmak olarak tanımlanmıştır: Şeriat Denetim Kurulu, özellikle işlem fıkıhatı alanında bilimsel yetkinlik ve pratik bilgiye sahip en az üç uzmandan oluşur. Fetva yayımlar, işlemleri inceler, Genel Kurul'a rapor sunar ve kararları bağlayıcıdır; bağımsızlığı üyelerinin atanması, görevden alınması ve ücretleri Genel Kurul tarafından belirlenmesi şart koşuluyla belirlenir; uygulamayı izleyen yürütme organı olarak iç Şeriat denetimi; ve dış Şeriat denetimi. İslami kurumların güvenilirliğinin sağlanmasında denetimin önemini vurguladı ve performanslarının eğitim, uzmanlaşma ve bağımsızlık konularında kontrollere tabi olması gerektiğini belirtti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430 H, 26–30 April 2009). Pengawasan Syariah didefinisikan sebagai mengeluarkan fatwa dan putusan terkait kegiatan lembaga keuangan, memantau pelaksanaannya, memastikan penerapannya yang tepat, dan menjadikan komponennya sebagai tiga: Dewan Pengawas Syariah, yang terdiri dari tidak kurang dari tiga spesialis yurisprudensi Islam, khususnya yurisprudensi transaksional, yang memiliki kompetensi ilmiah dan pengetahuan praktis. Dewan ini mengeluarkan fatwa, meninjau transaksi, menyerahkan laporan ke Majelis Umum, dan keputusannya bersifat mengikat, dengan independensi yang menetapkan bahwa anggotanya diangkat, diberhentikan, dan remunerasi ditentukan oleh Majelis Umum; pengawasan internal Syariah sebagai badan eksekutif yang memantau pelaksanaan; dan audit eksternal Syariah. Ia menyoroti pentingnya pengawasan dalam mencapai kredibilitas institusi Islam dan menetapkan bahwa kinerjanya harus tunduk pada pengawasan dalam pelatihan, spesialisasi, dan independensi."
