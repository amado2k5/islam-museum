label: { ar: "قرار المؤتمر الثالث عشر لوزراء الخارجية بشأن إنشاء المجمع الفقهي الإسلامي", en: "Thirteenth Foreign Ministers' conference resolution establishing the fiqh academy", ur: "تیرہویں وزرائے خارجہ کانفرنس کی قرارداد: فقہ اکیڈمی کا قیام", es: "Resolución de la decimotercera conferencia de ministros de Asuntos Exteriores por la que se establece la academia de fiqh.", fr: "Résolution de la treizième conférence des ministres des Affaires étrangères établissant l'académie de fiqh", tr: "İslam Fiqh Akademisi'nin kurulmasına ilişkin 13. Dışişleri Bakanları Konferansı Kararı", id: "Keputusan Konferensi Menteri Luar Negeri ke-13 mengenai pendirian Akademi Fiqh Islam" }
summary:
  ar: "قرار المؤتمر الثالث عشر لوزراء خارجية الدول الإسلامية بشأن إنشاء المجمع الفقهي الإسلامي وهو الوثيقة التنفيذية التالية لقرار القمة التي أتمت قيام الأكاديمية ونظمت صلتها بالدول الأعضاء على ما نصّ عليه القرار في موقع الأكاديمية."
  en: "The Thirteenth Islamic Conference of Foreign Ministers' resolution establishing the fiqh academy — the implementing instrument following the summit resolution that completed the Academy's establishment and ordered its relations with member states — as the resolution states on the Academy's site."
  ur: "تیرہویں اسلامی کانفرنس برائے وزرائے خارجہ کی قرارداد جس کے تحت اکیڈمی کا قیام مکمل ہوا اور رکن ممالک سے اس کے تعلقات کا انتظام ہوا — جیسا کہ اکیڈمی کی ویب سائٹ پر قرارداد میں ہے۔"
  es: "La resolución de la Decimotercera Conferencia Islámica de Ministros de Asuntos Exteriores por la que se establece la academia de fiqh —el instrumento de implementación tras la resolución de la cumbre que completó el establecimiento de la Academia y ordenó sus relaciones con los Estados miembros—, tal como se indica en la resolución en el sitio web de la Academia."
  fr: "La résolution de la treizième Conférence islamique des ministres des Affaires étrangères établissant l'académie de fiqh — l'instrument de mise en œuvre faisant suite à la résolution du sommet qui a achevé la création de l'Académie et a ordonné ses relations avec les États membres — comme le stipule la résolution sur le site de l'Académie."
  tr: "İslam Ülkeleri Dışişleri Bakanları On Üçüncü Konferansı'nın İslam Fiqh Akademisi'nin kurulmasına ilişkin kararı, Akademi'nin kurulmasını tamamlayan ve üye devletlerle ilişkilerini düzenleyen zirve kararının ardından yürütme belgesidir."
  id: "Keputusan Konferensi Menteri Luar Negeri Negara-negara Islam Ketiga Belas mengenai pendirian Akademi Fiqh Islam, yang merupakan dokumen eksekutif setelah keputusan KTT yang menyelesaikan pendirian Akademi dan mengatur hubungannya dengan negara anggota sebagaimana diatur dalam resolusi di situs web Akademi."
