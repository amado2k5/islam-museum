summary:
  ar: "قرار المؤتمر الثالث عشر لوزراء خارجية الدول الإسلامية بشأن إنشاء المجمع الفقهي الإسلامي وهو الوثيقة التنفيذية التالية لقرار القمة التي أتمت قيام الأكاديمية ونظمت صلتها بالدول الأعضاء على ما نصّ عليه القرار في موقع الأكاديمية."
  en: "The Thirteenth Islamic Conference of Foreign Ministers' resolution establishing the fiqh academy — the implementing instrument following the summit resolution that completed the Academy's establishment and ordered its relations with member states — as the resolution states on the Academy's site."
  ur: "تیرہویں اسلامی کانفرنس برائے وزرائے خارجہ کی قرارداد جس کے تحت اکیڈمی کا قیام مکمل ہوا اور رکن ممالک سے اس کے تعلقات کا انتظام ہوا — جیسا کہ اکیڈمی کی ویب سائٹ پر قرارداد میں ہے۔"
  es: "La resolución de la Decimotercera Conferencia Islámica de Ministros de Asuntos Exteriores por la que se establece la academia de fiqh —el instrumento de implementación tras la resolución de la cumbre que completó el establecimiento de la Academia y ordenó sus relaciones con los Estados miembros—, tal como se indica en la resolución en el sitio web de la Academia."
