label:
  ar: "أهالينا ⁦(برنامج تلفزيوني)⁩"
  en: "Ahalina: Our Families (television programme)"
  ur: "اہالینا: ہمارے گھر والے ⁦(ٹیلی وژن پروگرام)⁩"
summary:
  ar: "برنامج تلفزيوني قصير لعبد الرحمن منصور عن الأسرة، يحفظ منه أرشيف أسابيل ثلاث عشرة حلقة مصوّرة من ربع ساعة تقريبًا، يتكلم فيها وحده: مهارات التواصل بين الزوجين، ومفاتيح القلوب، ومحبة الأبناء وعلاماتها، و«المدمرات العشر» في التربية، وتحبيب الأولاد في الصلاة في أربع مراحل من العمر من الطفولة المبكرة إلى المراهقة، وقسوة بعض الآباء على الأبناء وأسباب الود بينهم، ثم العقوبة في التربية؛ والحلقة الأخيرة تعد بحلقة في ضوابط الضرب ليست في الأرشيف."
  en: "A short television programme on family life by Abd al-Rahman Mansour, of which the Assabile archive keeps thirteen video episodes of about a quarter of an hour, the speaker alone: skills of communication between spouses, the keys to hearts, parents' love for their children and its signs, the 'ten destroyers' of upbringing, making children love prayer across four stages from early childhood to adolescence, fathers' harshness towards their children and what builds affection between them, and punishment in upbringing; the last episode promises one on the rules of striking a child that is not in the archive."
  ur: "عبد الرحمٰن منصور کا خاندانی زندگی پر ایک مختصر ٹیلی وژن پروگرام، جس کی تقریباً پندرہ منٹ کی تیرہ ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں، مقرر اکیلے: میاں بیوی کے رابطے کی مہارتیں، دلوں کی کنجیاں، اولاد سے والدین کی محبت اور اس کی علامتیں، تربیت کی «دس تباہ کن چیزیں»، ابتدائی بچپن سے نوجوانی تک چار مرحلوں میں بچوں کے دل میں نماز کی محبت، باپوں کی اولاد پر سختی اور ان کے درمیان محبت کے اسباب، اور تربیت میں سزا؛ آخری قسط مارنے کے ضوابط پر ایک قسط کا وعدہ کرتی ہے جو آرکائیو میں نہیں۔"
