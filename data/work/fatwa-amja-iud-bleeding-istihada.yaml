id: work/fatwa-amja-iud-bleeding-istihada
class: work
kind: fatwa
label: { ar: "دم اللولب استحاضة", en: "Bleeding after an IUD — istihada, not menses", ur: "لولب کے بعد خون — استحاضہ" }
summary:
  ar: "سألت امرأة أن الدم نزل بعد تركيب اللولب ثم توقف وبعد أسبوع نزل دم غير معاد الدورة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23057 بتاريخ 24 مايو 2008)⁩ أن ما نزل من الدم بعد تركيب اللولب مباشرة الظاهر أنه نزيف واستحاضة وليس من جنس دم الحيض فلا يمنع الصلاة ولا سائر ما تلزم له الطهارة من العبادات ومثل ذلك ما ينزل بعد العمليات على ما فصّل الجواب."
  en: "A woman had blood descend after an IUD was fitted, stop, then descend a week later outside her period. Dr. Salah al-Sawi (fatwa no. 23057, 24 May 2008) answered that blood descending right after the fitting is outwardly a haemorrhage and istihada, not of the kind of menstrual blood — barring neither the prayer nor other purity-bound worship; the like of it is what descends after operations — as the answer details."
  ur: "لولب لگوانے کے بعد خون؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23057، 24 مئی 2008)⁩ کے مطابق یہ استحاضہ ہے — نماز و دیگر عبادات باقی۔"
