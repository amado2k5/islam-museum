label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مداواة الرجل للمرأة", en: "IIFA resolution on a man treating a woman", ur: "اکیڈمی کی قرارداد: مرد معالج کا عورت کا علاج", es: "Resolución de la IIFA sobre un hombre que trata mal a una mujer.", fr: "Résolution de l'IIFA concernant un homme soignant une femme", tr: "Uluslararası İslami Fiqh Akademisi'nin erkeklerin kadınlara muamele görmesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai pria yang memperlakukan wanita" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: الأصل أن تقوم طبيبة متخصصة بالكشف على المريضة، فإن لم تتوافر فطبيبة غير مسلمة ثقة، فإن لم تتوافر فطبيب مسلم، فإن لم يتوافر جاز أن يقوم مقامه طبيب غير مسلم، على أن يطلع من جسم المرأة على قدر الحاجة في التشخيص والعلاج على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on a man treating a woman: in principle a specialist woman physician examines the patient; if unavailable, a trustworthy non-Muslim woman physician; then a Muslim physician; then a non-Muslim physician may take his place — with only what diagnosis and treatment requires of the woman's body exposed, as detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: اصول یہ ہے کہ خاتون معالج معائنہ کرے؛ ترتیب وار متبادل بیان ہوئے اور ضرورت کے مطابق ہی جسم کھولا جا سکتا ہے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre un hombre que trata a una mujer: en principio, una médica especialista examina a la paciente; si no está disponible, una médica no musulmana de confianza; luego un médico musulmán; luego un médico no musulmán puede ocupar su lugar, quedando expuesto únicamente el cuerpo de la mujer según lo requieran el diagnóstico y el tratamiento, como se detalla."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur un homme soignant une femme: en principe, une femme médecin spécialiste examine la patiente; si elle n'est pas disponible, une femme médecin non musulmane digne de confiance; puis un médecin musulman; puis un médecin non musulman peut prendre sa place — avec seulement ce que le diagnostic et le traitement requièrent du corps de la femme exposé, comme détaillé."
  tr: "Uluslararası İslami Fiqh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) karar verilmiştir: Varsayılan kural, hastayı muayene eden uzman bir kadın doktordur; eğer mevcut değilse güvenilir bir gayrimüslim doktor; yoksa Müslüman bir doktor; yoksa, kadının bedeni teşhis ve tedavi için gerektiğinde incelendiği sürece, ayrıntılı olarak belirtildiği şekilde, gayrimüslim bir doktor onun yerine hareket edebilir."
  id: "Keputusan International Islamic Fiqh Academy dalam sesi kedelapan (Brunei, Juni 1993): Aturan default adalah dokter perempuan spesialis harus memeriksa pasien; jika tidak tersedia, maka dokter non-Muslim yang dapat dipercaya; jika tidak, dokter Muslim dapat bertindak menggantikannya, asalkan tubuh perempuan diperiksa sesuai kebutuhan untuk diagnosis dan pengobatan, sesuai rincian."
