label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مداواة الرجل للمرأة", en: "IIFA resolution on a man treating a woman", ur: "اکیڈمی کی قرارداد: مرد معالج کا عورت کا علاج", es: "Resolución de la IIFA sobre un hombre que trata mal a una mujer." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: الأصل أن تقوم طبيبة متخصصة بالكشف على المريضة، فإن لم تتوافر فطبيبة غير مسلمة ثقة، فإن لم تتوافر فطبيب مسلم، فإن لم يتوافر جاز أن يقوم مقامه طبيب غير مسلم، على أن يطلع من جسم المرأة على قدر الحاجة في التشخيص والعلاج على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on a man treating a woman: in principle a specialist woman physician examines the patient; if unavailable, a trustworthy non-Muslim woman physician; then a Muslim physician; then a non-Muslim physician may take his place — with only what diagnosis and treatment requires of the woman's body exposed, as detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: اصول یہ ہے کہ خاتون معالج معائنہ کرے؛ ترتیب وار متبادل بیان ہوئے اور ضرورت کے مطابق ہی جسم کھولا جا سکتا ہے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre un hombre que trata a una mujer: en principio, una médica especialista examina a la paciente; si no está disponible, una médica no musulmana de confianza; luego un médico musulmán; luego un médico no musulmán puede ocupar su lugar, quedando expuesto únicamente el cuerpo de la mujer según lo requieran el diagnóstico y el tratamiento, como se detalla."
