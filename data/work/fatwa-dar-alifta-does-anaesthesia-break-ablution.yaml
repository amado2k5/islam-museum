id: work/fatwa-dar-alifta-does-anaesthesia-break-ablution
class: work
kind: fatwa
label: { ar: "مدى تأثير التخدير على الوضوء", en: "Does anaesthesia break ablution?", ur: "بے ہوشی کی دوا ⁦(اینستھیزیا)⁩ کا وضو پر اثر", es: "¿La anestesia interrumpe la ablución?", fr: "L'anesthésie interrompt-elle les ablutions ?", tr: "Anestezinin abdest üzerindeki etkisinin kapsamı", id: "Tingkat pengaruh anestesi terhadap wudhu" }
summary:
  ar: "سؤال عن مريض ستُجرى له عملية جراحية بالتخدير، هل يُنتقض وضوؤه بالتخدير الكلي أو النصفي، أجابت فيه دار الإفتاء المصرية بأن كلًا من التخدير الكلي والنصفي ناقض للوضوء شرعًا، لأنه مظنة خروج الحدث من غير إدراك أو شعور. عرّفت الدار التخدير بما في كشاف اصطلاحات الفنون والمعجم الوسيط ومعجم المصطلحات الطبية وقسمته إلى عام وقطني وموضعي، وبيّنت أن من نواقض الوضوء زوال العقل على أي وجه كان بإجماع نقله ابن المنذر، وأن ابن قدامة جعل الأدوية المزيلة للعقل ناقضة إجماعًا لأن حس أصحابها أبعد من حس النائم، وأن النووي نص على أن زوال العقل بالبنج أو الدواء ينقض الوضوء. وقررت أن التخدير الكلي ناقض لأنه مزيل للعقل، وأن التخدير النصفي القطني وإن لم يصحبه زوال العقل فإنه يزيل التحكم والشعور بالأعضاء من السرة إلى أسفل ومنها السبيلان، فكان مظنة خروج الناقض، مستدلة بحديث العينان وكاء السه وحديث استرخاء المفاصل، وبأن النوم إنما جُعل ناقضًا لأنه مظنة الخروج فأُقيم المسبِّب مقام السبب كما قال المناوي والشرنبلالي وعلي القاري."
  en: "A question about a patient about to undergo surgery under anaesthesia, asking whether general or partial anaesthesia breaks his ablution; Dar al-Ifta al-Misriyya answered that both general and partial anaesthesia break ablution in sharia, because each creates a likelihood that something invalidating passes from the body without awareness. Dar al-Ifta defined anaesthesia from Kashshaf Istilahat al-Funun, al-Mu'jam al-Wasit and the medical glossary of the Arabic Language Academy, dividing it into general, spinal and local; it explained that loss of reason in any form breaks ablution by the consensus reported by Ibn al-Mundhir, that Ibn Qudama counted drugs that remove reason as invalidating by consensus because such people's senses are further gone than a sleeper's, and that al-Nawawi stated that loss of reason through banj or medicine breaks ablution. It ruled that general anaesthesia breaks ablution as it removes reason, and that spinal anaesthesia, though it does not remove reason, removes control of and sensation in the limbs from the navel down, including the two passages, so it creates a likelihood of something invalidating passing; it cited the hadith that the eyes are the drawstring of the anus and the hadith on the relaxing of the joints, and the principle that sleep was made an invalidator only because it makes such a passage likely, the cause being put in place of the effect, as al-Munawi, al-Shurunbulali and Ali al-Qari explain."
  ur: "ایک مریض کے بارے میں سوال جس کا بے ہوشی کی دوا کے ساتھ آپریشن ہونا ہے، کہ کیا مکمل یا جزوی بے ہوشی سے اس کا وضو ٹوٹ جاتا ہے؛ دار الافتاء مصر نے جواب دیا کہ مکمل اور جزوی بے ہوشی دونوں شرعاً وضو توڑتی ہیں، کیونکہ دونوں میں بغیر ادراک اور احساس حدث نکلنے کا گمان ہوتا ہے۔ دار الافتاء نے بے ہوشی کی تعریف کشاف اصطلاحات الفنون، المعجم الوسیط اور عربی زبان اکیڈمی کی طبی اصطلاحات کی لغت سے کی اور اسے عام، ریڑھ کی اور مقامی میں تقسیم کیا؛ بیان کیا کہ کسی بھی صورت میں عقل کا زائل ہونا ابن المنذر کے نقل کردہ اجماع سے وضو توڑتا ہے، ابن قدامہ نے عقل زائل کرنے والی دواؤں کو بالاجماع ناقض شمار کیا کیونکہ ایسے لوگوں کا حس سونے والے سے زیادہ دور ہوتا ہے، اور نووی نے تصریح کی کہ بنج یا دوا سے عقل کا زائل ہونا وضو توڑتا ہے۔ اس نے فیصلہ کیا کہ مکمل بے ہوشی وضو توڑتی ہے کیونکہ یہ عقل زائل کرتی ہے، اور ریڑھ کی جزوی بے ہوشی، گو اس سے عقل زائل نہیں ہوتی، ناف سے نیچے کے اعضا پر کنٹرول اور احساس زائل کرتی ہے جن میں دونوں راستے شامل ہیں، لہٰذا اس میں ناقض چیز کے نکلنے کا گمان ہے؛ اس نے اس حدیث سے استدلال کیا کہ آنکھیں مقعد کا بندھن ہیں اور جوڑوں کے ڈھیلے ہونے کی حدیث سے، اور اس اصول سے کہ نیند کو صرف اس لیے ناقض بنایا گیا کہ وہ ایسے نکلنے کا گمان پیدا کرتی ہے، تو سبب کو مسبب کی جگہ رکھا گیا، جیسا کہ مناوی، شرنبلالی اور علی قاری نے بیان کیا۔"
  es: "Una pregunta sobre un paciente a punto de someterse a una cirugía bajo anestesia, preguntando si la anestesia general o parcial invalida su ablución; Dar al-Ifta al-Misriyya respondió que tanto la anestesia general como la parcial invalidan la ablución según la sharia, porque cada una crea la probabilidad de que algo invalidante salga del cuerpo sin que el paciente se dé cuenta. Dar al-Ifta definió la anestesia a partir de Kashshaf Istilahat al-Funun, al-Mu'jam al-Wasit y el glosario médico de la Academia de la Lengua Árabe, dividiéndola en general, espinal y local; explicó que la pérdida de la razón en cualquier forma invalida la ablución según el consenso reportado por Ibn al-Mundhir, que Ibn Qudama consideró los medicamentos que eliminan la razón como invalidantes por consenso porque los sentidos de esas personas están más afectados que los de un dormido, y que al-Nawawi afirmó que la pérdida de la razón a través de banj o medicamentos invalida la ablución. Dictaminó que la anestesia general invalida la ablución al eliminar la razón, y que la anestesia espinal, aunque no elimina la razón, elimina el control y la sensibilidad en las extremidades desde el ombligo hacia abajo, incluyendo los dos conductos, por lo que crea la probabilidad de que pase algo que invalide la menstruación; citó el hadiz de que los ojos son el cordón del ano y el hadiz sobre la relajación de las articulaciones, y el principio de que el sueño se convirtió en un invalidante solo porque hace probable tal paso, colocando la causa en lugar del efecto, como explican al-Munawi, al-Shurunbulali y Ali al-Qari."
  fr: "Une question concernant un patient sur le point de subir une intervention chirurgicale sous anesthésie générale ou partielle invalide ses ablutions a été posée. Dar al-Ifta al-Misriyya a répondu que, selon la charia, les deux anesthésies invalident les ablutions, car chacune crée un risque d'élimination inconsciente d'une substance invalidante. Dar al-Ifta a défini l'anesthésie d'après Kashshaf Istilahat al-Funun, al-Mu'jam al-Wasit et le glossaire médical de l'Académie de la langue arabe, la divisant en anesthésie générale, rachidienne et locale. L'ouvrage explique que, selon le consensus rapporté par Ibn al-Mundhir, la perte de conscience sous toutes ses formes invalide les ablutions. Ibn Qudama considère également, par consensus, les médicaments altérant la raison comme invalidants, car les sens des personnes concernées sont alors plus altérés que ceux d'un dormeur. Enfin, al-Nawawi a affirmé que la perte de conscience due à la consommation de médicaments invalide les ablutions. Il a été statué que l'anesthésie générale invalide les ablutions car elle supprime la raison, et que l'anesthésie rachidienne, bien qu'elle ne supprime pas la raison, supprime le contrôle et la sensation des membres du nombril jusqu'aux pieds, y compris les deux voies urinaires, créant ainsi une probabilité d'émission invalidante; il a cité le hadith selon lequel les yeux sont le cordon de serrage de l'anus et le hadith sur le relâchement des articulations, et le principe selon lequel le sommeil n'est considéré comme invalidant que parce qu'il rend une telle émission probable, la cause étant placée à la place de l'effet, comme l'expliquent al-Munawi, al-Shurunbulali et Ali al-Qari."
  tr: "Anestezi ameliyatı olacak bir hasta hakkında, abdest almasının genel mi yoksa kısmi anestezi ile mi iptal edilip edilmediğine dair bir soru. Mısır Dar al-Ifta, İslam hukukuna göre hem genel hem de kısmi anestezinin abdesti geçersiz kıldığını, çünkü olayın farkındalık veya his olmadan gerçekleşmiş olabileceğini yanıtladı. Anestezi Evi, abdestleri Kashaf al-Finun terminolojisi Al-Mu'jam al-Waseet ve Tıbbi Terminoloji Sözlüğü ile tanımladı; bunu genel, yerel ve yerel olarak ayırarak, abdestin etkisiz kılıcılarından birinin herhangi bir biçimde zekâ kaybı olduğunu açıkladı; bu durum İbn al-Mundhir'in aktardığına göre. İbn Qudamah, zihni alan ilaçların geçersiz olduğunu oybirliğiyle ilan etti çünkü sahiplerinin duyuları uyuyan bir kişininkinden daha uzaktır. Al-Nawawi, anestezi veya ilaçla zekâ kaybının abdest almayı geçersiz kıldığını belirtti. Tam anestezinin geçersiz olduğu çünkü zihni ortadan kaldırdığına ve bel anestezinin, zihin kaybı eşlik etmese bile, göbekten aşağıya doğru organların, iki escil dahil olmak üzere, kontrol ve hislerini ortadan kaldırdığı kararlaştırıldı. Böylece, göz hadisi, eklemlerin şişmesi ve eklemlerin gevşemesi temelinde geçersiz edici unsurun çıkarıldığı, uykunun ise boşalma varsayımı olduğu için geçersiz hale getirildiği ve sebep sebebin yerine konduğu düşünülüyordu; Al-Manawi, Al-Sharnbalali ve Ali Al-Qari'nin dediği gibi."
  id: "Pertanyaan tentang pasien yang akan menjalani operasi anestesi, apakah wudunya dibatalkan oleh anestesi umum atau parsial. Dar al-Ifta Mesir menjawab bahwa baik anestesi umum maupun parsial membatalkan wudhu menurut hukum Islam, karena kemungkinan kejadian itu terjadi tanpa kesadaran atau sensasi. Rumah Anestesi mendefinisikan wudhu dalam terminologi Kashaf al-Finun, Al-Mu'jam al-Waseet, dan Kamus Terminologi Medis, membaginya menjadi umum, lokal, dan lokal, dengan memperjelas bahwa salah satu penentu wudhu adalah hilangnya intelek dalam bentuk apapun, seperti yang dilaporkan oleh Ibn al-Mundhir. Ibn Qudamah secara bulat menyatakan obat yang menghilangkan pikiran tidak valid karena indera pemiliknya lebih jauh daripada orang yang sedang tidur. Al-Nawawi menyatakan bahwa hilangnya intelek akibat anestesi atau obat membatalkan wudhu. Diputuskan bahwa anestesi total tidak sah karena menghilangkan pikiran, dan anestesi lumbal, meskipun tidak disertai dengan kehilangan akal, menghilangkan kontrol dan sensasi organ dari pusar ke bawah, termasuk dua esciles. Dengan demikian, kemungkinan bahwa invalidator diangkat, berdasarkan hadits mata, pembengkakan sendi, dan relaksasi sendi, dan tidur menjadi tidak valid karena merupakan asumsi ejakulasi, sehingga penyebab ditempatkan di tempat penyebab, seperti yang dikatakan Al-Manawi, Al-Sharnbalali, dan Ali Al-Qari."
