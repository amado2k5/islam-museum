id: work/fatwa-dar-alifta-does-anaesthesia-break-ablution
class: work
kind: fatwa
label: { ar: "مدى تأثير التخدير على الوضوء", en: "Does anaesthesia break ablution?", ur: "بے ہوشی کی دوا ⁦(اینستھیزیا)⁩ کا وضو پر اثر" }
summary:
  ar: "سؤال عن مريض ستُجرى له عملية جراحية بالتخدير، هل يُنتقض وضوؤه بالتخدير الكلي أو النصفي، أجابت فيه دار الإفتاء المصرية بأن كلًا من التخدير الكلي والنصفي ناقض للوضوء شرعًا، لأنه مظنة خروج الحدث من غير إدراك أو شعور. عرّفت الدار التخدير بما في كشاف اصطلاحات الفنون والمعجم الوسيط ومعجم المصطلحات الطبية وقسمته إلى عام وقطني وموضعي، وبيّنت أن من نواقض الوضوء زوال العقل على أي وجه كان بإجماع نقله ابن المنذر، وأن ابن قدامة جعل الأدوية المزيلة للعقل ناقضة إجماعًا لأن حس أصحابها أبعد من حس النائم، وأن النووي نص على أن زوال العقل بالبنج أو الدواء ينقض الوضوء. وقررت أن التخدير الكلي ناقض لأنه مزيل للعقل، وأن التخدير النصفي القطني وإن لم يصحبه زوال العقل فإنه يزيل التحكم والشعور بالأعضاء من السرة إلى أسفل ومنها السبيلان، فكان مظنة خروج الناقض، مستدلة بحديث العينان وكاء السه وحديث استرخاء المفاصل، وبأن النوم إنما جُعل ناقضًا لأنه مظنة الخروج فأُقيم المسبِّب مقام السبب كما قال المناوي والشرنبلالي وعلي القاري."
  en: "A question about a patient about to undergo surgery under anaesthesia, asking whether general or partial anaesthesia breaks his ablution; Dar al-Ifta al-Misriyya answered that both general and partial anaesthesia break ablution in sharia, because each creates a likelihood that something invalidating passes from the body without awareness. Dar al-Ifta defined anaesthesia from Kashshaf Istilahat al-Funun, al-Mu'jam al-Wasit and the medical glossary of the Arabic Language Academy, dividing it into general, spinal and local; it explained that loss of reason in any form breaks ablution by the consensus reported by Ibn al-Mundhir, that Ibn Qudama counted drugs that remove reason as invalidating by consensus because such people's senses are further gone than a sleeper's, and that al-Nawawi stated that loss of reason through banj or medicine breaks ablution. It ruled that general anaesthesia breaks ablution as it removes reason, and that spinal anaesthesia, though it does not remove reason, removes control of and sensation in the limbs from the navel down, including the two passages, so it creates a likelihood of something invalidating passing; it cited the hadith that the eyes are the drawstring of the anus and the hadith on the relaxing of the joints, and the principle that sleep was made an invalidator only because it makes such a passage likely, the cause being put in place of the effect, as al-Munawi, al-Shurunbulali and Ali al-Qari explain."
  ur: "ایک مریض کے بارے میں سوال جس کا بے ہوشی کی دوا کے ساتھ آپریشن ہونا ہے، کہ کیا مکمل یا جزوی بے ہوشی سے اس کا وضو ٹوٹ جاتا ہے؛ دار الافتاء مصر نے جواب دیا کہ مکمل اور جزوی بے ہوشی دونوں شرعاً وضو توڑتی ہیں، کیونکہ دونوں میں بغیر ادراک اور احساس حدث نکلنے کا گمان ہوتا ہے۔ دار الافتاء نے بے ہوشی کی تعریف کشاف اصطلاحات الفنون، المعجم الوسیط اور عربی زبان اکیڈمی کی طبی اصطلاحات کی لغت سے کی اور اسے عام، ریڑھ کی اور مقامی میں تقسیم کیا؛ بیان کیا کہ کسی بھی صورت میں عقل کا زائل ہونا ابن المنذر کے نقل کردہ اجماع سے وضو توڑتا ہے، ابن قدامہ نے عقل زائل کرنے والی دواؤں کو بالاجماع ناقض شمار کیا کیونکہ ایسے لوگوں کا حس سونے والے سے زیادہ دور ہوتا ہے، اور نووی نے تصریح کی کہ بنج یا دوا سے عقل کا زائل ہونا وضو توڑتا ہے۔ اس نے فیصلہ کیا کہ مکمل بے ہوشی وضو توڑتی ہے کیونکہ یہ عقل زائل کرتی ہے، اور ریڑھ کی جزوی بے ہوشی، گو اس سے عقل زائل نہیں ہوتی، ناف سے نیچے کے اعضا پر کنٹرول اور احساس زائل کرتی ہے جن میں دونوں راستے شامل ہیں، لہٰذا اس میں ناقض چیز کے نکلنے کا گمان ہے؛ اس نے اس حدیث سے استدلال کیا کہ آنکھیں مقعد کا بندھن ہیں اور جوڑوں کے ڈھیلے ہونے کی حدیث سے، اور اس اصول سے کہ نیند کو صرف اس لیے ناقض بنایا گیا کہ وہ ایسے نکلنے کا گمان پیدا کرتی ہے، تو سبب کو مسبب کی جگہ رکھا گیا، جیسا کہ مناوی، شرنبلالی اور علی قاری نے بیان کیا۔"
