id: work/fatwa-amja-maliki-incontinence-rule
class: work
kind: fatwa
label: { ar: "سلس البول عند المالكية", en: "Urinary incontinence in the Maliki school", ur: "مالکیوں کے نزدیک سلس بول", es: "Incontinencia urinaria en la escuela Maliki", fr: "Incontinence urinaire à l'école Maliki" }
summary:
  ar: "سأل سائل عن حكم سلس البول عند المالكية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80544 بتاريخ 30 نوفمبر 2009)⁩ أن المعروف عند المالكية أن المستحاضة يستحب لها الوضوء عند كل صلاة ولا يجب عليها وقد قاسوا عليها صاحب السلس إذا لازمه كل الوقت أو جله أو نصفه وتفصيل ذلك عندهم أن السلس لا ينقض إذا لازم نصف زمن الوقات على ما فصّل الجواب."
  en: "A questioner asked the Maliki rule for urinary incontinence. Dr. Salah al-Sawi (fatwa no. 80544, 30 November 2009) answered that it is known of the Malikis that the mustahada is recommended wudu at each prayer without its being required; they analogised to her the incontinence-holder whose excuse attends all, most or half the time — their detail being that the incontinence does not break wudu when it persists through half the prayer-time or more — as the answer details."
  ur: "مالکی مذہب میں سلس بول؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80544، 30 نومبر 2009)⁩ کے مطابق ہر نماز پر وضو مستحب نہ کہ واجب — آدھے وقت لازم رہے تو نہیں توڑتا۔"
  es: "Un consultante preguntó sobre la norma malikí para la incontinencia urinaria. El Dr. Salah al-Sawi (fatwa n.° 80544, 30 de noviembre de 2009) respondió que es sabido entre los malikíes que la mustahada es una ablución recomendada en cada oración, aunque no sea obligatoria; la compararon con la persona incontinente cuya excusa se presenta todo el tiempo, la mayor parte del tiempo o la mitad del tiempo, y especificaron que la incontinencia no invalida la ablución cuando persiste durante la mitad del tiempo de oración o más, como se detalla en la respuesta."
  fr: "Une personne a posé la question concernant la règle malikite relative à l'incontinence urinaire. Le Dr Salah al-Sawi (fatwa n° 80544, 30 novembre 2009) a répondu que, selon les malikites, il est recommandé aux personnes ayant la pratique religieuse (mustahada) de faire leurs ablutions (wudu) à chaque prière, sans que cela soit obligatoire. Ils ont comparé cette recommandation à celle d'une personne incontinente dont l'excuse est valable pendant toute la durée de la prière, la plupart du temps ou la moitié du temps. Leur précision est que l'incontinence ne invalide pas les ablutions si elle persiste pendant la moitié de la durée de la prière, voire plus, comme le détaille la réponse."
