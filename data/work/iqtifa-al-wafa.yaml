label: { ar: "اقتفاء الوفا بأخبار دار المصطفى", en: "Iqtifa' al-Wafa bi-Akhbar Dar al-Mustafa (al-Samhudi)", ur: "اعتکاف الوفاء بی اخبار دار المصطفٰی ⁦(السمہدی)⁩", tr: "Sadakatin Ardından Dar el-Mustafa'nın Haberiyle", id: "Mengikuti Kesetiaan dengan Berita Dar Al-Mustafa" }
summary:
  ar: "الكتاب الكبير المفصّل الأول من كتب السمهودي الثلاثة في تاريخ المدينة، لم يتم، إذ تركه مؤلفه في المسجد النبوي وسافر إلى مكة فاحترق فيما احترق من أماكن المسجد، كما يذكر محقق «وفاء الوفا» {cite:samhudi-wafa-al-wafa p.6}."
  en: "The first and largest of al-Samhudi's three books on the history of Medina, never finished: its author left it in the Prophet's Mosque when he travelled to Mecca and it burned in the fire that struck parts of the mosque, as the editor of Wafa' al-Wafa' relates."
  es: "El primero y más extenso de los tres libros de al-Samhudi sobre la historia de Medina, nunca se terminó: su autor lo dejó en la Mezquita del Profeta cuando viajó a La Meca y se quemó en el incendio que afectó a partes de la mezquita, como relata el editor de Wafa' al-Wafa'."
  fr: "Le premier et le plus important des trois livres d'al-Samhudi sur l'histoire de Médine, jamais achevé: son auteur l'a laissé dans la mosquée du Prophète lorsqu'il s'est rendu à La Mecque et il a brûlé dans l'incendie qui a touché une partie de la mosquée, comme le raconte l'éditeur de Wafa' al-Wafa'."
  ur: "مدینہ کی تاریخ پر السمھودی کی تین کتابوں میں سے پہلی اور سب سے بڑی کتاب کبھی ختم نہیں ہوئی: اس کے مصنف نے اسے مسجد نبوی میں چھوڑ دیا جب وہ مکہ گئے اور یہ اس آگ میں جل گئی جس نے مسجد کے کچھ حصوں کو مارا، جیسا کہ وفاء الوفاء کے مدیر نے بتایا ہے۔"
  tr: "Medine tarihine dair üç Samhudi kitabından oluşan büyük ve ayrıntılı ilk kitap tamamlanmadı; çünkü yazarı onu Peygamber Camii'nde bıraktı ve Mekke'ye gitti ve caminin yanan kısımlarında yandı; bunu 'Wafa al-Wafa' editörü de belirtmiştir {cite:samhudi-wafa-al-wafa, s.6}."
  id: "Buku pertama yang besar dan rinci dari tiga kitab Samhudi tentang sejarah Madinah tidak selesai, karena penulisnya meninggalkannya di Masjid Nabi dan pergi ke Mekah, di mana buku itu terbakar di bagian-bagian masjid yang terbakar, seperti yang disebutkan oleh editor 'Wafa al-Wafa' {cite:samhudi-wafa-al-wafa, hlm.6}."
