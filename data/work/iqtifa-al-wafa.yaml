  ar: "الكتاب الكبير المفصّل الأول من كتب السمهودي الثلاثة في تاريخ المدينة، لم يتم، إذ تركه مؤلفه في المسجد النبوي وسافر إلى مكة فاحترق فيما احترق من أماكن المسجد، كما يذكر محقق «وفاء الوفا» {cite:samhudi-wafa-al-wafa p.6}."
  en: "The first and largest of al-Samhudi's three books on the history of Medina, never finished: its author left it in the Prophet's Mosque when he travelled to Mecca and it burned in the fire that struck parts of the mosque, as the editor of Wafa' al-Wafa' relates."
