summary:
  ar: "الكتاب الكبير المفصّل الأول من كتب السمهودي الثلاثة في تاريخ المدينة، لم يتم، إذ تركه مؤلفه في المسجد النبوي وسافر إلى مكة فاحترق فيما احترق من أماكن المسجد، كما يذكر محقق «وفاء الوفا» {cite:samhudi-wafa-al-wafa p.6}."
  en: "The first and largest of al-Samhudi's three books on the history of Medina, never finished: its author left it in the Prophet's Mosque when he travelled to Mecca and it burned in the fire that struck parts of the mosque, as the editor of Wafa' al-Wafa' relates."
  es: "El primero y más extenso de los tres libros de al-Samhudi sobre la historia de Medina, nunca se terminó: su autor lo dejó en la Mezquita del Profeta cuando viajó a La Meca y se quemó en el incendio que afectó a partes de la mezquita, como relata el editor de Wafa' al-Wafa'."
  fr: "Le premier et le plus important des trois livres d'al-Samhudi sur l'histoire de Médine, jamais achevé: son auteur l'a laissé dans la mosquée du Prophète lorsqu'il s'est rendu à La Mecque et il a brûlé dans l'incendie qui a touché une partie de la mosquée, comme le raconte l'éditeur de Wafa' al-Wafa'."
