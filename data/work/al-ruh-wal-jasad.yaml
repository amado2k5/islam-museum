summary:
  ar: "مجموعة مقالات لمصطفى محمود، صدرت طبعتها الأولى عن دار النهضة العربية بالقاهرة سنة 1394هـ، في عجز الألفاظ عن الحقائق الإلهية، و«عصر الصراخ»، والسعادة، والجنة والنار، والماء، والنفس، وأصنام العصر، وفي فصل أخير يرى فيه أن للإنسان وجوداً سابقاً على الميلاد {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}."
  en: "A collection of essays by Mostafa Mahmoud, first published by Dar al-Nahda al-Arabiyya in Cairo in 1394 AH, on the inability of words to convey divine realities, 'the age of shouting', happiness, Paradise and Hell, water, the self, the idols of the age, and, in a last chapter, his view that man existed before birth {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}."
  ur: "مصطفیٰ محمود کے مضامین کا مجموعہ، جس کا پہلا ایڈیشن دار النہضۃ العربیہ قاہرہ سے 1394ھ میں شائع ہوا؛ موضوعات: الٰہی حقائق کے بیان سے الفاظ کا عجز، «چیخ کا دور»، خوشی، جنت و جہنم، پانی، نفس، دور کے بت، اور آخری باب میں ان کی یہ رائے کہ انسان کا پیدائش سے پہلے بھی وجود تھا {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}۔"
  es: "Una colección de ensayos de Mostafa Mahmoud, publicada por primera vez por Dar al-Nahda al-Arabiyya en El Cairo en 1394 AH, sobre la incapacidad de las palabras para transmitir realidades divinas, 'la era de los gritos', la felicidad, el Paraíso y el Infierno, el agua, el yo, los ídolos de la época y, en un último capítulo, su punto de vista de que el hombre existía antes del nacimiento {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}."
  fr: "Un recueil d'essais de Mostafa Mahmoud, publié pour la première fois par Dar al-Nahda al-Arabiyya au Caire en 1394 AH, sur l'incapacité des mots à transmettre les réalités divines, « l'âge des cris », le bonheur, le Paradis et l'Enfer, l'eau, le soi, les idoles de l'époque et, dans un dernier chapitre, son point de vue selon lequel l'homme existait avant la naissance {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}."
  tr: "Mustafa Mahmoud'un ilk baskısı, 1394 Hicri yılında Kahire'de Dar Al-Nahda Al-Arabiya tarafından yayımlanmış, kelimelerin ilahi gerçekleri ortaya koyamaması, 'ağlama çağı', mutluluk, cennet ve cehennem, su, ruh ve dönemin putları üzerine makaleler derlemesi. Son bir bölümde, insanın doğumdan önce bir varoluşu olduğunu savunur {cite:mm-ruh-wal-jasad-nahda-ed1 s. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 s. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 s. 97}."
  id: "Kumpulan artikel oleh Mustafa Mahmoud, edisi pertama yang diterbitkan oleh Dar Al-Nahda Al-Arabiya di Kairo pada tahun 1394 H, tentang ketidakmampuan kata-kata untuk mengungkapkan kebenaran ilahi, 'zaman menangis', kebahagiaan, surga dan neraka, air, jiwa, dan berhala pada zaman itu. Dalam bab terakhir, ia berargumen bahwa manusia memiliki keberadaan sebelum kelahiran {cite:mm-ruh-wal-jasad-nahda-ed1 hlm. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 hlm. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 hlm. 97}."
