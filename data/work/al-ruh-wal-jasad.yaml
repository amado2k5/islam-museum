summary:
  ar: "مجموعة مقالات لمصطفى محمود، صدرت طبعتها الأولى عن دار النهضة العربية بالقاهرة سنة 1394هـ، في عجز الألفاظ عن الحقائق الإلهية، و«عصر الصراخ»، والسعادة، والجنة والنار، والماء، والنفس، وأصنام العصر، وفي فصل أخير يرى فيه أن للإنسان وجوداً سابقاً على الميلاد {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}."
  en: "A collection of essays by Mostafa Mahmoud, first published by Dar al-Nahda al-Arabiyya in Cairo in 1394 AH, on the inability of words to convey divine realities, 'the age of shouting', happiness, Paradise and Hell, water, the self, the idols of the age, and, in a last chapter, his view that man existed before birth {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}."
  ur: "مصطفیٰ محمود کے مضامین کا مجموعہ، جس کا پہلا ایڈیشن دار النہضۃ العربیہ قاہرہ سے 1394ھ میں شائع ہوا؛ موضوعات: الٰہی حقائق کے بیان سے الفاظ کا عجز، «چیخ کا دور»، خوشی، جنت و جہنم، پانی، نفس، دور کے بت، اور آخری باب میں ان کی یہ رائے کہ انسان کا پیدائش سے پہلے بھی وجود تھا {cite:mm-ruh-wal-jasad-nahda-ed1 p. 6} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 10} {cite:mm-ruh-wal-jasad-maarif-ed7 p. 97}۔"
