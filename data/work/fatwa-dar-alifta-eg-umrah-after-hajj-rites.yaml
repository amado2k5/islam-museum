label: { ar: "حكم أداء العمرة عقب الانتهاء من أعمال الحج", en: "Performing umrah after finishing the Hajj rites", ur: "حج کے مناسک کے بعد عمرہ کرنا", es: "Realizar la Umrah después de finalizar los ritos del Hajj.", fr: "Accomplir la umra après avoir terminé les rites du Hajj", tr: "Hac ritüelleri tamamlandıktan sonra umre kılınma kuralı", id: "Aturan pelaksanaan Umrah setelah menyelesaikan ritual Haji" }
summary:
  ar: "سائل سأل عن أداء العمرة بعد الانتهاء من مناسك الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20833)⁩ أنه يجوز شرعًا أداء العمرة بعد الانتهاء من مناسك الحج وذلك بالخروج إلى التنعيم أو مسجد السيدة عائشة على ما فصّل الجواب."
  en: "A questioner asked about performing umrah after completing the Hajj rites. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20833) answered that it is lawful — by going out to al-Tan'im or the mosque of Aisha — as the answer details."
  ur: "ایک سائل نے حج کے مناسک مکمل کرنے کے بعد عمرہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20833)⁩ نے جواب دیا کہ یہ جائز ہے تنعیم یا مسجد عائشہ جا کر — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de realizar la Umrah después de completar los ritos del Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20833) respondió que es lícito hacerlo, acudiendo a al-Tan'im o a la mezquita de Aisha, como se detalla en la respuesta."
  fr: "Un fidèle a demandé s'il était possible d'accomplir la umra après avoir accompli les rites du hajj. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20833) a répondu que cela était licite, en se rendant à al-Tan'im ou à la mosquée d'Aïcha, comme le précise la réponse."
  tr: "Bir soru soran kişi, Hac ritüelleri tamamlandıktan sonra Umre'yi icra etmeyi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20833), cevabında detaylandırıldığı üzere, Hac rituellerini tamamladıktan sonra El-Taneem veya Bayan Aişe Camii'ne giderek Umre'nin dini olarak iciz olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang pelaksanaan Umrah setelah menyelesaikan ritual Haji. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20833) menjawab bahwa secara agama diperbolehkan melakukan Umrah setelah menyelesaikan ritual Haji dengan pergi ke Al-Taneem atau Masjid Lady Aisha, seperti yang dijelaskan dalam jawabannya."
