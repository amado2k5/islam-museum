label: { ar: "كتاب الخراج وصنعة الكتابة لقدامة بن جعفر", en: "Kitab al-Kharaj wa-Sina'at al-Kitaba of Qudama ibn Ja'far", es: "Kitab al-Kharaj wa-Sina'at al-Kitaba de Qudama ibn Ja'far", fr: "Kitab al-Kharaj wa-Sina'at al-Kitaba de Qudama ibn Ja'far", ur: "کتاب الخراج و سینا الکتاب قدامہ ابن جعفر", tr: "Qudamah bin Ja'far'ın Kharaj Kitabı ve Yazma Zagatı", id: "Kitab Kharaj dan Kerajinan Menulis oleh Qudamah bin Ja'far" }
summary:
  ar: "كتاب لأبي الفرج قدامة بن جعفر الكاتب البغدادي في الخراج وصنعة الكتابة، مرتب في «منازل» وأبواب؛ نشر دي خويه منه في المجلد السادس من المكتبة الجغرافية العربية الباب الحادي عشر من المنزلة الخامسة في ديوان البريد والسكك والطرق، وأبواباً من المنزلة السادسة في قسمة المعمور من الأرض {cite:masalik-mamalik-ibn-khurdadhbih p.192} {cite:masalik-mamalik-ibn-khurdadhbih p.238}."
  en: "A book by Abu al-Faraj Qudama ibn Ja'far, the Baghdadi secretary, on land tax and the secretary's craft, arranged in 'stations' (manazil) and chapters; de Goeje printed in BGA VI chapter 11 of the fifth station, on the postal office, post stages and roads, and chapters of the sixth station on the division of the inhabited earth."
  es: "Un libro de Abu al-Faraj Qudama ibn Ja'far, el secretario de Bagdad, sobre el impuesto sobre la tierra y el oficio de secretario, organizado en 'estaciones' (manazil) y capítulos; de Goeje imprimió en BGA VI el capítulo 11 de la quinta estación, sobre la oficina de correos, las paradas de correos y los caminos, y capítulos de la sexta estación sobre la división de la tierra habitada."
  fr: "Un livre d'Abu al-Faraj Qudama ibn Ja'far, le secrétaire bagdadien, sur l'impôt foncier et le métier de secrétaire, organisé en « stations » (manazil) et en chapitres; de Goeje imprimé dans BGA VI chapitre 11 de la cinquième station, sur le bureau de poste, les étapes postales et les routes, et chapitres de la sixième station sur la division de la terre habitée."
  ur: "ابو الفراج قدامہ ابن جعفر کی ایک کتاب، بغدادی سکریٹری، لینڈ ٹیکس اور سیکرٹری کے ہنر پر، 'اسٹیشنز' ⁦(منازل)⁩ اور ابواب میں ترتیب دی گئی ہے۔ de Goeje پانچویں اسٹیشن کے BGA VI کے باب 11 میں، پوسٹل آفس، ڈاک کے مراحل اور سڑکوں پر، اور آباد زمین کی تقسیم پر چھٹے اسٹیشن کے ابواب میں چھپی۔"
  tr: "Bağdalı yazıcı Ebu el-Faraj Qudamah ibn Ca'far'ın kharaj ve yazma zanaatı üzerine 'Manazil' ve bölümler halinde düzenlenmiş bir kitabı; de Khoye, Arap Coğrafya Kütüphanesi'nin altıncı cildinde, Posta, Demiryolları ve Karayolları Bürosu'nda beşinci derecenin on birinci bölümünde ve altıncı sıradan yerleşik toprakların bölünmesiyle ilgili bölümlerde yayımlamıştır {cite:masalik-mamalik-ibn-khurdadhbih s.192} {cite:masalik-mamalik-ibn-khurdadhbih s.238}."
  id: "Sebuah buku karya Abu al-Faraj Qudamah ibn Ja'far, juru tulis Baghdadi, tentang kharaj dan seni menulis, disusun dalam 'Manazil' dan bab-bab; de Khoye menerbitkannya dalam volume keenam Perpustakaan Geografi Arab, bab sebelas peringkat kelima di Biro Pos, Kereta Api, dan Jalan, serta bab dari peringkat keenam tentang pembagian tanah berpenghuni {cite:masalik-mamalik-ibn-khurdadhbih hlm.192} {cite:masalik-mamalik-ibn-khurdadhbih hlm.238}."
