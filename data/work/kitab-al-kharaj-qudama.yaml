summary:
  ar: "كتاب لأبي الفرج قدامة بن جعفر الكاتب البغدادي في الخراج وصنعة الكتابة، مرتب في «منازل» وأبواب؛ نشر دي خويه منه في المجلد السادس من المكتبة الجغرافية العربية الباب الحادي عشر من المنزلة الخامسة في ديوان البريد والسكك والطرق، وأبواباً من المنزلة السادسة في قسمة المعمور من الأرض {cite:masalik-mamalik-ibn-khurdadhbih p.192} {cite:masalik-mamalik-ibn-khurdadhbih p.238}."
  en: "A book by Abu al-Faraj Qudama ibn Ja'far, the Baghdadi secretary, on land tax and the secretary's craft, arranged in 'stations' (manazil) and chapters; de Goeje printed in BGA VI chapter 11 of the fifth station, on the postal office, post stages and roads, and chapters of the sixth station on the division of the inhabited earth."
