id: work/fatwa-amja-hearing-arousal-emission
class: work
kind: fatwa
label: { ar: "نزول المني بلا جماع", en: "Emission without intercourse — the washing binds", ur: "بغیر جماع انزال — غسل واجب", es: "Emisión sin coito: el lavado ata", fr: "Émission sans rapport sexuel — les liens de lavage", tr: "Cinsel ilişki olmadan meninin aşağı inmesi", id: "Sperma turun tanpa hubungan seksual" }
summary:
  ar: "سأل سائل ما حكم إذا سمع ما أثاره فنزل منه المني. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80134 بتاريخ 5 أكتوبر 2009)⁩ أن الغسل كما يجب بالجماع ولو بغير إنزال فإنه يجب بنزول المني ولو بغير جماع والمني هو الماء الذي يخرج عند اشتداد الشهوة ويعقبه فتور واسترخاء فإن كان ما نزل منه منيًّا وجب عليه الغسل وإن كان مذيًا فالوضوء والاستنجاء على ما فصّل الجواب."
  en: "A questioner heard something that aroused him and semen descended. Dr. Salah al-Sawi (fatwa no. 80134, 5 October 2009) answered that as the washing binds on intercourse even without emission, so it binds on the descent of semen even without intercourse — semen being the water that leaves at desire's height followed by lassitude; if what descended was semen the washing binds him, and if madhy then wudu and istinja — as the answer details."
  ur: "بغیر جماع منی نکلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80134، 5 اکتوبر 2009)⁩ کے مطابق منی کے نزول پر غسل واجب؛ مذی ہو تو وضو۔"
  es: "Un consultante escuchó algo que lo excitó y se le escapó semen. El Dr. Salah al-Sawi (fatwa n.° 80134, 5 de octubre de 2009) respondió que, así como el lavado obliga a la relación sexual incluso sin eyaculación, también obliga al descenso del semen incluso sin relación sexual; el semen es el líquido que sale en el punto álgido del deseo seguido de languidez; si lo que descendió fue semen, el lavado lo obliga, y si fue madhy, entonces wudu e istinja, como se detalla en la respuesta."
  fr: "Un homme a entendu quelque chose qui l'a excité et du sperme est descendu. Le Dr Salah al-Sawi (fatwa n° 80134, 5 octobre 2009) a répondu que, de même que les ablutions purifient lors d'un rapport sexuel même sans éjaculation, elles purifient également lors de la descente de sperme même sans rapport sexuel – le sperme étant l'eau qui s'écoule au paroxysme du désir, suivie de la lassitude; si ce qui est descendu était du sperme, les ablutions purifient l'homme, et si c'était de l'excitation, alors les ablutions (wudu) et l'éjaculation (istinja) sont nécessaires – comme le précise la réponse."
  tr: "Bir soru soran kişiye, onu uyaran ve boşalan şeyi duyarsa hüküm nedir diye soruldu. Dr. Salah Al-Sawi (5 Ekim 2009 tarihli 80134 No. Fetva) şöyle yanıtladı: Hüsl, boşalma olmasa bile cinsel ilişkide zorunludur, bu yüzden boşalma sırasında bile zorunludur. Meni, arzu arttığında çıkan su, ardından serinlik ve rahatlama gelir. Boşalan meni, yani sperm ise gusl zorunludur; eğer nidhiya'dan geliyorsa, wudu ve istinja (temizlikten sonra arınma) cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya ditanya apa putusannya jika ia mendengar apa yang membangkitkan dan ejakulasi darinya. Dr. Salah Al-Sawi menjawab (Fatwa No. 80134 tanggal 5 Oktober 2009) bahwa ghusl adalah kewajiban saat berhubungan seks, bahkan tanpa ejakulasi, sehingga tetap wajib saat ejakulasi meskipun tidak berhubungan seks. Sperma adalah air yang keluar saat hasrat semakin kuat, diikuti oleh kesejukan dan relaksasi. Jika yang dicairkan adalah sperma, maka ghusl adalah kewajiban, dan jika berasal dari nidhiya, maka wudu dan istinja (pembersihan setelah pembersihan) dijelaskan dalam jawabannya."
