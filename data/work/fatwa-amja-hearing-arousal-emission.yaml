id: work/fatwa-amja-hearing-arousal-emission
class: work
kind: fatwa
label: { ar: "نزول المني بلا جماع", en: "Emission without intercourse — the washing binds", ur: "بغیر جماع انزال — غسل واجب", es: "Emisión sin coito: el lavado ata" }
summary:
  ar: "سأل سائل ما حكم إذا سمع ما أثاره فنزل منه المني. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80134 بتاريخ 5 أكتوبر 2009)⁩ أن الغسل كما يجب بالجماع ولو بغير إنزال فإنه يجب بنزول المني ولو بغير جماع والمني هو الماء الذي يخرج عند اشتداد الشهوة ويعقبه فتور واسترخاء فإن كان ما نزل منه منيًّا وجب عليه الغسل وإن كان مذيًا فالوضوء والاستنجاء على ما فصّل الجواب."
  en: "A questioner heard something that aroused him and semen descended. Dr. Salah al-Sawi (fatwa no. 80134, 5 October 2009) answered that as the washing binds on intercourse even without emission, so it binds on the descent of semen even without intercourse — semen being the water that leaves at desire's height followed by lassitude; if what descended was semen the washing binds him, and if madhy then wudu and istinja — as the answer details."
  ur: "بغیر جماع منی نکلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80134، 5 اکتوبر 2009)⁩ کے مطابق منی کے نزول پر غسل واجب؛ مذی ہو تو وضو۔"
  es: "Un consultante escuchó algo que lo excitó y se le escapó semen. El Dr. Salah al-Sawi (fatwa n.° 80134, 5 de octubre de 2009) respondió que, así como el lavado obliga a la relación sexual incluso sin eyaculación, también obliga al descenso del semen incluso sin relación sexual; el semen es el líquido que sale en el punto álgido del deseo seguido de languidez; si lo que descendió fue semen, el lavado lo obliga, y si fue madhy, entonces wudu e istinja, como se detalla en la respuesta."
