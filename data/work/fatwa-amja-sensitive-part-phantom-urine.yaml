id: work/fatwa-amja-sensitive-part-phantom-urine
class: work
kind: fatwa
label: { ar: "وسواس نزول البول", en: "Feeling urine descend with nothing in the clothes — ignore the doubt", ur: "بول کے نزول کا وہم — شک نظر انداز" }
summary:
  ar: "سأل سائل أن فرجه حساس جدًا ويحس دائمًا بنزول بول لكنه لا يجد شيئًا في الثياب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78031 بتاريخ 1 مارس 2009)⁩ أن القاعدة أن من يستنكحه الشك ويكثر عليه لا يلتفت إليه ولا يبني عليه بل يطرحه ويعتبره كأن لم يكن حتى يخرج من دوامته فلا يعد صلاته ولا يلتفت إلى هذا الشك على ما فصّل الجواب."
  en: "A questioner whose private part is very sensitive always feels urine descending, yet finds nothing in the clothes. Dr. Salah al-Sawi (fatwa no. 78031, 1 March 2009) answered that the rule for one whom doubt haunts and multiplies on is to pay it no heed and build nothing on it — casting it off as though it were not, until he leaves its whirlpool; so he does not repeat his prayer and gives this doubt no mind — as the answer details."
  ur: "بول نزول کا احساس مگر کپڑے خشک؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78031، 1 مارچ 2009)⁩ کے مطابق کثرت شک پر التفات نہیں — نماز نہ دہرائے۔"
