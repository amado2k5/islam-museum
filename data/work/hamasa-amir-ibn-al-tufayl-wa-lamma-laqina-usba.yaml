label: { ar: "أبيات عامر بن الطفيل «ولما لقينا عصبة تغلبية»", en: "Amir ibn al-Tufayl's verses 'When we met a band of Taghlib'", es: "Versos de Amir ibn al-Tufayl: 'Cuando nos encontramos con una banda de Taghlib'", fr: "Vers d'Amir ibn al-Tufayl « Quand nous avons rencontré une bande de Taghlib »", ur: "امیر بن الطفیل کی آیات 'جب ہم تغلب کے ایک گروہ سے ملے'", tr: "Emir bin el-Tufeyl'in ayetleri: \"Ve bir Taglibid grubuyla karşılaştığımızda\"", id: "Ayat-ayat Amir ibn al-Tufayl: \"Dan ketika kami bertemu dengan kelompok Taghlibid\"" }
summary:
  ar: "بيتان في ديوان الحماسة من الطويل على روي الراء، تقدّمهما الطبعة بقولها «وقال عامر بن الطفيل» {{cite:hamasa-abu-tammam-ed-1916 p.39}}."
  en: "Two verses in the Diwan al-Hamasa in the tawil metre on the rhyme ra, introduced in the edition with \"Amir ibn al-Tufayl said\" {{cite:hamasa-abu-tammam-ed-1916 p.39}}."
  es: "Dos versos en el Diwan al-Hamasa en metro tawil sobre la rima ra, introducidos en la edición con \"Amir ibn al-Tufayl dijo\" {{cite:hamasa-abu-tammam-ed-1916 p.39}}."
  fr: "Deux versets du Diwan al-Hamasa en mètre tawil sur la rime ra, introduits dans l'édition avec « Amir ibn al-Tufayl a dit » {{cite:hamasa-abu-tammam-ed-1916 p.39}}."
  ur: "دیوان الحمسہ میں دیوان الحماسہ میں دو آیات تاویل میٹر آن رائم را، ایڈیشن میں \"امیر ابن الطفیل نے کہا\" کے ساتھ متعارف کروائی ہیں۔"
  tr: "Hamasa Diwanı'nda El-Tawil'den Ra'nın söylemi üzerine iki beyit, öncesinde şu ifadeyle yer alan baskı yer alır: \"Amir ibn al-Tufayl şöyle dedi\" {{cite:hamasa-abu-tammam-ed-1916 s.39}}."
  id: "Dua bait dalam Diwan Hamasa dari Al-Tawil tentang retorika Ra', didahului oleh edisi dengan pernyataan: \"Amir ibn al-Tufayl berkata\" {{cite:hamasa-abu-tammam-ed-1916 hlm.39}}."
