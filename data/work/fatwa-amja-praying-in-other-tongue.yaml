label: { ar: "الصلاة بغير العربية", en: "Finding Arabic hard — may he pray in another language", ur: "عربی مشکل — دوسری زبان میں نماز؟", es: "Le resulta difícil el árabe; ojalá rece en otro idioma.", fr: "Trouver l'arabe difficile — puisse-t-il prier dans une autre langue" }
summary:
  ar: "سأل سائل أنه يصعب عليه تعلم الصلاة باللغة العربية هل يجوز أن يصلي بلغة أخرى. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21997 بتاريخ 14 أكتوبر 2012)⁩ أن فريضة الصلاة لا تسقط بحال من الأحوال والتكليف إنما يكون في حدود الوسع والطاقة لقوله تعالى لا يكلف الله نفسًا إلا وسعها وحديث إذا أمرتكم بأمر فأتوا منه ما استطعتم على ما فصّل الجواب من حال العاجز عن العربية."
  en: "A questioner found learning the prayer in Arabic hard — may he pray in another language? AMJA's fatwa committee (fatwa no. 21997, 14 October 2012) answered that the prayer's obligation never lapses, and duty reaches only within capacity — 'God tasks no soul beyond its capacity' and 'when I command you a thing, do of it what you can' — the answer detailing the case of one unable to manage Arabic."
  ur: "عربی نہ آئے تو نماز؟ لجنة الفتوى ⁦(فتویٰ 21997، 14 اکتوبر 2012)⁩ کے مطابق فرض نہیں گرتا؛ وسع کے مطابق ادا — عاجز کی حالت بیان ہوئی۔"
  es: "Un consultante encontró difícil aprender la oración en árabe; ¿puede rezar en otro idioma? El comité de fatuas de AMJA (fatua n.° 21997, 14 de octubre de 2012) respondió que la obligación de la oración nunca caduca y que el deber solo llega hasta donde la capacidad de cada uno: «Dios no impone a ningún alma una tarea que vaya más allá de su capacidad» y «cuando yo te ordene algo, haz lo que puedas». La respuesta detallaba el caso de una persona incapaz de dominar el árabe."
  fr: "Un homme, ayant des difficultés à apprendre la prière en arabe, a demandé s'il pouvait prier dans une autre langue. Le comité des fatwas de l'AMJA (fatwa n° 21997, 14 octobre 2012) a répondu que l'obligation de la prière ne cesse jamais et que le devoir ne dépasse pas les capacités de chacun: « Dieu n'impose à aucune âme une charge supérieure à ses capacités » et « lorsque Je vous ordonne une chose, faites-en ce que vous pouvez ». La réponse détaille le cas d'une personne ne maîtrisant pas l'arabe."
