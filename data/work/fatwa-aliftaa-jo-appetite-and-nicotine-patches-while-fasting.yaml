id: work/fatwa-aliftaa-jo-appetite-and-nicotine-patches-while-fasting
class: work
kind: fatwa
label: { ar: "وضع لاصق يمنع الجوع أو لاصق للإقلاع عن التدخين أثناء الصيام", en: "Wearing an appetite-suppressing or nicotine patch while fasting", ur: "روزے میں بھوک روکنے یا تمباکو نوشی چھڑانے والا پیچ لگانا", es: "Usar un parche supresor del apetito o de nicotina durante el ayuno.", fr: "Porter un patch coupe-faim ou à la nicotine pendant le jeûne", tr: "Açlığı önlemek için yapıştırıcı veya oruç sırasında sigarayı bırakma etiketi uygulayın", id: "Oleskan lem untuk mencegah rasa lapar atau stiker berhenti merokok saat puasa" }
summary:
  ar: "سؤال عن وضع لاصق يمنع الجوع أو لاصق للإقلاع عن التدخين أثناء الصيام، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا داعي له لمن تسحر وأفطر على السنة، لكنه لا يفطر لأنه غير مغذٍّ ولا يدخل الجوف من منفذ مفتوح. أجابت الدائرة بأن الصيام عبادة عظيمة وركن من أركان الإسلام، وأن من تسحر على السنة وأفطر على السنة لا تدركه مشقة عظيمة، فلا داعي لوضع هذا اللاصق. وقالت إن اللاصق مع ذلك لا يفطر، لأنه غير مغذٍّ ولا يدخل الجوف من منفذ مفتوح."
  en: "A question about wearing an appetite-suppressing or nicotine patch while fasting, in which Jordan's General Iftaa Department answered that there is no need for it for someone who takes the pre-dawn meal and breaks the fast as the Sunna teaches, but that it does not break the fast because it is not nourishing and does not enter the body's interior through an open passage. The Department answered that fasting is a great act of worship and one of the pillars of Islam, and that someone who takes the pre-dawn meal and breaks the fast as the Sunna teaches meets no great hardship, so there is no need for such a patch. It said that the patch nevertheless does not break the fast, because it is not nourishing and does not enter the body's interior (al-jawf) through an open passage."
  ur: "روزے میں بھوک روکنے یا تمباکو نوشی چھڑانے والا پیچ لگانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو سنت کے مطابق سحری اور افطار کرے اسے اس کی ضرورت نہیں، لیکن یہ روزہ نہیں توڑتا کیونکہ یہ غذا نہیں اور کھلے راستے سے جوف میں داخل نہیں ہوتا۔ ڈیپارٹمنٹ نے جواب دیا کہ روزہ ایک عظیم عبادت اور اسلام کا ایک رکن ہے، اور جو سنت کے مطابق سحری اور افطار کرے اسے بڑی مشقت نہیں ہوتی، اس لیے اس پیچ کی ضرورت نہیں۔ اس نے کہا کہ اس کے باوجود پیچ روزہ نہیں توڑتا، کیونکہ یہ غذا نہیں اور کھلے راستے سے جوف میں داخل نہیں ہوتا۔"
  es: "Una pregunta sobre el uso de parches supresores del apetito o de nicotina durante el ayuno, a la que el Departamento General de Iftaa de Jordania respondió que no es necesario para quien toma la comida antes del amanecer y rompe el ayuno según la Sunna, pero que no rompe el ayuno porque no es nutritivo y no entra al interior del cuerpo por una vía abierta. El Departamento respondió que el ayuno es un gran acto de adoración y uno de los pilares del Islam, y que quien toma la comida antes del amanecer y rompe el ayuno según la Sunna no experimenta grandes dificultades, por lo que no hay necesidad de dicho parche. Dijo que, no obstante, el parche no rompe el ayuno porque no es nutritivo y no entra al interior del cuerpo (al-jawf) por una vía abierta."
  fr: "Concernant le port d'un patch coupe-faim ou à la nicotine pendant le jeûne, le Département général de la Iftaa en Jordanie a répondu qu'il n'est pas nécessaire pour celui qui prend le repas de l'aube et rompt le jeûne conformément à la Sunna. Toutefois, le patch ne rompt pas le jeûne car il n'est pas nourrissant et ne pénètre pas dans l'organisme par un canal ouvert. Le Département a expliqué que le jeûne est un acte d'adoration majeur et un pilier de l'islam, et que celui qui prend le repas de l'aube et rompt le jeûne selon la Sunna ne rencontre aucune difficulté particulière, rendant ainsi le port d'un tel patch inutile. Il a précisé que, malgré tout, le patch ne rompt pas le jeûne car il n'est pas nourrissant et ne pénètre pas dans l'organisme (al-jawf) par un canal ouvert."
  tr: "Oruç sırasında açlığı önlemek için etiket veya sigarayı bırakmak için bant yapıştırılması sorulduğunda, Ürdün Genel Fetva Dairesi, sünnet günü orucu bozan ve suhür yapan birine gerek olmadığını, ancak orucunu bozmadığını çünkü besleyici olmadığını ve açık bir çıkıştan girmediğini yanıtladı. Daire, orucun büyük bir ibadet eylemi ve İslam'ın temel direği olduğunu, Sünnet'te shurur olup orucunu Sünnet'te bozarsa, büyük bir zorluk yaşamadığını, bu yapıştırıcıyı uygulamaya gerek olmadığını belirtti. Yapıştırıcının orucu bozmadığını, çünkü besleyici olmadığını ve açık bir açıklıktan çukura girmediğini belirtti."
  id: "Ketika ditanya tentang cara menempelkan stiker untuk mencegah lapar atau lakban untuk berhenti merokok saat berpuasa, Departemen Fatwa Jenderal Yordania menjawab bahwa tidak perlu seseorang yang memiliki suhoor dan berbuka puasa pada Sunnah, tetapi dia tidak memutus puasanya karena tidak bergizi dan tidak masuk ke lembah melalui saluran terbuka. Departemen menjawab bahwa puasa adalah tindakan ibadah yang besar dan merupakan tonggak Islam, dan bahwa siapa pun yang memiliki suhoor pada Sunnah dan berbuka puasa pada Sunnah tidak mengalami kesulitan besar, sehingga tidak perlu mengaplikasikan perekat ini. Dikatakan bahwa perekat tidak memutus puasa karena tidak memberi nutrisi dan tidak masuk ke dalam rongga melalui lubang terbuka."
