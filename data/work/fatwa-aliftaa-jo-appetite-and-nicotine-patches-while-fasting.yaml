id: work/fatwa-aliftaa-jo-appetite-and-nicotine-patches-while-fasting
class: work
kind: fatwa
label: { ar: "وضع لاصق يمنع الجوع أو لاصق للإقلاع عن التدخين أثناء الصيام", en: "Wearing an appetite-suppressing or nicotine patch while fasting", ur: "روزے میں بھوک روکنے یا تمباکو نوشی چھڑانے والا پیچ لگانا" }
summary:
  ar: "سؤال عن وضع لاصق يمنع الجوع أو لاصق للإقلاع عن التدخين أثناء الصيام، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا داعي له لمن تسحر وأفطر على السنة، لكنه لا يفطر لأنه غير مغذٍّ ولا يدخل الجوف من منفذ مفتوح. أجابت الدائرة بأن الصيام عبادة عظيمة وركن من أركان الإسلام، وأن من تسحر على السنة وأفطر على السنة لا تدركه مشقة عظيمة، فلا داعي لوضع هذا اللاصق. وقالت إن اللاصق مع ذلك لا يفطر، لأنه غير مغذٍّ ولا يدخل الجوف من منفذ مفتوح."
  en: "A question about wearing an appetite-suppressing or nicotine patch while fasting, in which Jordan's General Iftaa Department answered that there is no need for it for someone who takes the pre-dawn meal and breaks the fast as the Sunna teaches, but that it does not break the fast because it is not nourishing and does not enter the body's interior through an open passage. The Department answered that fasting is a great act of worship and one of the pillars of Islam, and that someone who takes the pre-dawn meal and breaks the fast as the Sunna teaches meets no great hardship, so there is no need for such a patch. It said that the patch nevertheless does not break the fast, because it is not nourishing and does not enter the body's interior (al-jawf) through an open passage."
  ur: "روزے میں بھوک روکنے یا تمباکو نوشی چھڑانے والا پیچ لگانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو سنت کے مطابق سحری اور افطار کرے اسے اس کی ضرورت نہیں، لیکن یہ روزہ نہیں توڑتا کیونکہ یہ غذا نہیں اور کھلے راستے سے جوف میں داخل نہیں ہوتا۔ ڈیپارٹمنٹ نے جواب دیا کہ روزہ ایک عظیم عبادت اور اسلام کا ایک رکن ہے، اور جو سنت کے مطابق سحری اور افطار کرے اسے بڑی مشقت نہیں ہوتی، اس لیے اس پیچ کی ضرورت نہیں۔ اس نے کہا کہ اس کے باوجود پیچ روزہ نہیں توڑتا، کیونکہ یہ غذا نہیں اور کھلے راستے سے جوف میں داخل نہیں ہوتا۔"
