authors: [person/ibn-balban-ala-al-din-ali]
genre: [hadith]
summary:
  ar: "ترتيب الأمير علاء الدين علي بن بلبان الفارسي ⁦(ت 739هـ)⁩ لصحيح ابن حبان على الكتب والأبواب الفقهية، بعد أن كان على خمسة أقسام وأربعمائة نوع يعسر الكشف منها؛ لم يحذف منه شيئاً، وصدّره بمقدمة في ثلاثة فصول: ترجمة ابن حبان، ونص خطبته وخواتيم أقسامه، وقائمة الكتب والأبواب {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 10, 49-50, 127}."
  en: "The rearrangement by al-Amir 'Ala' al-Din 'Ali ibn Balban al-Farisi (d. 739 AH) of Ibn Hibban's Sahih into legal books and chapters, replacing its five divisions and four hundred types, which were hard to search; he dropped nothing, and prefaced it with a three-part introduction: Ibn Hibban's biography, the text of his preface and the closing words of his divisions, and the list of books and chapters {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 10, 49-50, 127}."
  ur: "امیر علاء الدین علی بن بلبان فارسی ⁦(وفات 739ھ)⁩ کی صحیح ابن حبان کو فقہی کتب اور ابواب پر ترتیب، جبکہ اصل پانچ اقسام اور چار سو انواع پر تھی جن میں تلاش مشکل تھی؛ انہوں نے اس میں سے کچھ حذف نہیں کیا، اور اس کے شروع میں تین فصلوں کا مقدمہ رکھا: ابن حبان کا ترجمہ، ان کے خطبے اور اقسام کے خاتموں کا متن، اور کتب و ابواب کی فہرست {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 10, 49-50, 127}۔"
