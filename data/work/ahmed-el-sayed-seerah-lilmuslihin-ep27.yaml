class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 27: غزوة ذي قرد"
  en: "The Prophetic Biography for Reformers, episode 27: The Expedition of Dhu Qarad"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 27: غزوۂ ذی قرد"
  fr: "La biographie prophétique pour les réformateurs, épisode 27 : L'expédition de Dhu Qarad"
  es: "La biografía profética para los reformadores, episodio 27: La expedición de Dhu Qarad"
summary:
  ar: "يختم المحاضر حديثه عن صلح الحديبية، ثم يروي الإغارة على إبل النبي قرب المدينة والمطاردة التي صارت غزوة ذي قرد، متّبعا رواية سلمة بن الأكوع في صحيح مسلم. ويستخلص دروسا في تكريم الجهد وفي حياة نبوية لا فراغ فيها."
  en: "The lecturer closes his treatment of the Hudaybiyya settlement, then tells the raid on the Prophet's camels near Medina and the pursuit that became the expedition of Dhu Qarad, following Salama ibn al-Akwa's account in Sahih Muslim. He draws lessons on honouring effort and on a Prophetic life without idle time."
  ur: "مقرر حدیبیہ کے صلح پر اپنی گفتگو مکمل کرتے ہیں، پھر مدینہ کے قریب نبی کے اونٹوں پر حملے اور اس تعاقب کو بیان کرتے ہیں جو غزوۂ ذی قرد بن گیا، اور صحیح مسلم میں سلمہ بن الاکوع کی روایت کی پیروی کرتے ہیں۔ وہ کوشش کی قدردانی اور بغیر خالی وقت کی حیاتِ نبوی کے بارے میں اسباق نکالتے ہیں۔"
  fr: "Le conférencier conclut son traitement du traité de Hudaybiyya, puis raconte le raid contre les chameaux du Prophète près de Médine et la poursuite qui devint l'expédition de Dhu Qarad, d'après le récit de Salama ibn al-Akwa' dans Sahih Muslim. Il en tire des leçons sur la reconnaissance de l'effort et sur une vie prophétique sans temps mort."
  es: "El conferenciante cierra su tratamiento del tratado de Hudaybiyya y luego relata el asalto a los camellos del Profeta cerca de Medina y la persecución que se convirtió en la expedición de Dhu Qarad, siguiendo el relato de Salama ibn al-Akwa' en Sahih Muslim. Extrae lecciones sobre honrar el esfuerzo y sobre una vida profética sin tiempos muertos."
