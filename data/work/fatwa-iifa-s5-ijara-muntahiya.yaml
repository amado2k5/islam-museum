label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الإيجار المنتهي بالتمليك", en: "IIFA resolution on lease ending in ownership", ur: "اکیڈمی کی قرارداد: کرایہ بہ تملیک", es: "Resolución de la IIFA sobre la finalización del contrato de arrendamiento en propiedad.", fr: "Résolution de l'IIFA relative à la fin du bail et à l'acquisition du bien", tr: "Uluslararası İslami Fiqh Akademisi'nin mülkiyetle kira sözleşmesinin sona ermesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai sewa yang berakhir dengan kepemilikan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩ بعد تأجيل الدورة الرابعة: الأولى الاكتفاء عن صور الإيجار المنتهي بالتمليك ببدائل منها البيع بالأقساط مع ضمانات كافية وعقد إجارة مع إعطاء المالك الخيار للمستأجر بعد وفاء الأقساط في وضع الصيغة الأنسب، وبيّن الأحكام على ما فصّل."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988), after the fourth session's deferral: the lease-ending-in-ownership forms are better replaced by alternatives including instalment sale with sufficient guarantees, and a lease contract giving the owner the option to offer the tenant the most suitable form after all rent instalments are paid — with the rulings detailed."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: کرایہ بہ تملیک کی بجائے متبادل صورتیں ⁦(اقساط کی بیع، کرایہ مع اختیار)⁩ بہتر ہیں؛ احکام بیان ہوئے۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988), tras el aplazamiento de la cuarta sesión: es mejor sustituir las formas de arrendamiento que finalizan en propiedad por alternativas que incluyan la venta a plazos con garantías suficientes y un contrato de arrendamiento que dé al propietario la opción de ofrecer al inquilino la forma más adecuada una vez que se hayan pagado todas las cuotas de alquiler, con las resoluciones detalladas."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988), après le report de la quatrième session: les formes de bail se terminant par une acquisition sont mieux remplacées par des alternatives telles que la vente à tempérament avec des garanties suffisantes et un contrat de bail donnant au propriétaire la possibilité de proposer au locataire la forme la plus appropriée après le paiement de tous les loyers — avec les décisions détaillées."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dördüncü oturumun ertelenmesinden sonra beşinci oturumunda (Kuveyt, Aralık 1988) kararı: Birincisi, mülkiyetle sona eren kira biçimlerini, yeterli garantili taksitli satışlar ve kiracıya taksitleri ödedikten sonra kiracıya en uygun formülü oluşturma seçeneği tanıyan ve kararların detaylı şekilde netleştirildiği bir kira sözleşmesi gibi alternatiflerle sınırlamaktır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi kelima (Kuwait, Desember 1988) setelah penundaan sesi keempat: Yang pertama adalah membatasi bentuk sewa yang berakhir dengan kepemilikan dengan alternatif seperti penjualan cicilan dengan jaminan yang memadai dan kontrak sewa dengan pemilik yang memberikan opsi kepada penyewa setelah membayar cicilan untuk merumuskan formula yang paling sesuai, serta memperjelas keputusan sesuai rincian."
