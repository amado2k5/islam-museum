summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩ بعد تأجيل الدورة الرابعة: الأولى الاكتفاء عن صور الإيجار المنتهي بالتمليك ببدائل منها البيع بالأقساط مع ضمانات كافية وعقد إجارة مع إعطاء المالك الخيار للمستأجر بعد وفاء الأقساط في وضع الصيغة الأنسب، وبيّن الأحكام على ما فصّل."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988), after the fourth session's deferral: the lease-ending-in-ownership forms are better replaced by alternatives including instalment sale with sufficient guarantees, and a lease contract giving the owner the option to offer the tenant the most suitable form after all rent instalments are paid — with the rulings detailed."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: کرایہ بہ تملیک کی بجائے متبادل صورتیں ⁦(اقساط کی بیع، کرایہ مع اختیار)⁩ بہتر ہیں؛ احکام بیان ہوئے۔"
