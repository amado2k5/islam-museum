id: work/fatwa-dar-alifta-eg-selling-carpets-with-divine-name
class: work
kind: fatwa
label: { ar: "حكم بيع السجاد المكتوب عليه لفظ الجلالة", en: "Selling carpets bearing the name of God", ur: "لفظِ جلالت لکھے قالین فروخت کرنا", es: "Venta de alfombras con el nombre de Dios" }
summary:
  ar: "سائل سأل عن بيع سجاد مكتوب عليه لفظ الجلالة يُفرش ويُداس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21613)⁩ بوجوب تعظيم ما عظّمه الله من الكلمات القرآنية والأسماء الربانية وبيّن الجواب حكم ذلك على وجهه."
  en: "A questioner asked about selling carpets bearing the name of God that are spread and stepped upon. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21613) answered by affirming the duty of revering what God has exalted — Quranic words and divine names — and set out the ruling accordingly."
  ur: "ایک سائل نے ایسے قالین بیچنے کا حکم پوچھا جن پر لفظِ جلالت لکھا ہو اور جو بچھائے اور روندے جائیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21613)⁩ نے قرآنی کلمات اور ربانی اسماء کے تعظیم کے واجب ہونے کو بیان کر کے حکم لکھا۔"
  es: "Un consultante preguntó sobre la venta de alfombras con el nombre de Dios que se extienden y se pisan. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21613) respondió afirmando el deber de reverenciar lo que Dios ha exaltado —las palabras coránicas y los nombres divinos— y estableció la norma correspondiente."
