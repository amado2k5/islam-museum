summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها الكندي الأمريكي توماس بالانتاين إيرفنغ، المعروف بالحاج تعليم علي، ونُشرت سنة 1985، وهي أول ترجمة للقرآن بالإنجليزية الأمريكية، وثانية الترجمتين الأصليتين اللتين وضعهما مسلمون ونُشرتا في الولايات المتحدة بعد ترجمة الهلالي وخان؛ كتبها بلغة موجزة سلسة لأبناء الجيلين الثاني والثالث من مسلمي أمريكا الشمالية ولغير المسلمين، وموّلها متبرعون منهم عائلة عاصي صاحبة شركة ميدامار للأغذية الحلال في سيدار رابيدز."
  en: "An English rendering of the meanings of the Qur'an by the Canadian-American T. B. Irving, known as al-Hajj Ta'lim Ali, published in 1985: the first Qur'an translation in American English, and the second of the two original translations by Muslims published in the United States after Hilali–Khan; written in succinct, fluent English for second- and third-generation North American Muslims and for non-Muslims, it was funded by donors including the Aossey family of the Midamar halal food company in Cedar Rapids."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از کینیڈی امریکی ٹی بی اروِنگ، جو الحاج تعلیم علی کہلاتے ہیں، 1985 میں شائع ہوا: امریکی انگریزی میں قرآن کا پہلا ترجمہ، اور ہلالی و خان کے بعد امریکہ میں شائع ہونے والے مسلمانوں کے دو اصل تراجم میں دوسرا؛ شمالی امریکہ کے مسلمانوں کی دوسری اور تیسری نسل اور غیر مسلموں کے لیے مختصر اور رواں انگریزی میں لکھا گیا، اور اس کی مالی معاونت میں سیڈر ریپڈز کی حلال خوراک کمپنی میدامار کے مالک عاصی خاندان شامل تھا۔"
