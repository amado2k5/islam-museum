  fr: "Livret bilingue publié par le Centre des pièces islamiques du Conseil national du Qatar pour la culture, les arts et le patrimoine, présentant la numismatique islamique et montrant des pièces des dynasties des Omeyyades à l'ère saoudienne {cite:nccah-islamic-coins-brochure p. 3} {cite:nccah-islamic-coins-brochure p. 4}."
