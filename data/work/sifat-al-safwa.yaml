structure: "مقدمة المؤلف ونقده للحلية (ص25–30)؛ باب في فضل الأولياء؛ ذكر النبي؛ الصحابة على طبقاتهم في الفضل؛ الصحابيات؛ ثم التابعون ومن بعدهم على البلدان: المدينة، مكة، الطائف، اليمن، بغداد، المدائن، واسط، البصرة، الأبلة … حتى نخشب في المشرق، ثم عكبرا والموصل والشام ومصر والمغرب والجبال والجزائر والسواحل والبوادي، ثم من لقوا في الطريق وبعرفة والطواف، ثم من لم يعرف اسمه، ثم البنيات الصغار، ثم عباد الجن (خطة المؤلف ص29–30)؛ 1031 ترجمة في طبعة طرطوسي."
