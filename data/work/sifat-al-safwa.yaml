summary:
  ar: "كتاب لأبي الفرج ابن الجوزي ⁦(ت 597هـ)⁩ في أخبار الزهاد والعباد، ألّفه اختصاراً وتهذيباً لـ«حلية الأولياء» لأبي نعيم الأصبهاني مع زيادات كثيرة؛ يفتتحه بذكر النبي ثم الصحابة والصحابيات ثم التابعين ومن بعدهم مرتبين على البلدان من المدينة ومكة إلى أقاصي المشرق والمغرب، ويزيد عدد من فيه على ألف شخص منهم أكثر من مائتي امرأة."
  en: "Abu al-Faraj Ibn al-Jawzi's (d. 597 AH) book on the ascetics and devout, written as an abridgement and correction of Abu Nu'aym al-Isfahani's Hilyat al-Awliya' with many additions. It opens with the Prophet, then the Companions male and female, then the Successors and later generations arranged by city from Medina and Mecca to the far East and West; it covers more than a thousand people, over two hundred of them women."
  es: "El libro de Abu al-Faraj Ibn al-Jawzi (fallecido en el año 597 de la Hégira) sobre los ascetas y los devotos, escrito como compendio y corrección de Hilyat al-Awliya' de Abu Nu'aym al-Isfahani, con numerosas adiciones. Comienza con el Profeta, seguido de los Compañeros, tanto hombres como mujeres, y luego los Sucesores y las generaciones posteriores, ordenados por ciudad desde Medina y La Meca hasta el Lejano Oriente y Occidente; abarca a más de mil personas, de las cuales más de doscientas son mujeres."
  fr: "L'ouvrage d'Abu al-Faraj Ibn al-Jawzi (mort en 597 AH) sur les ascètes et les pieux est une version abrégée et corrigée de la Hilyat al-Awliya' d'Abu Nu'aym al-Isfahani, enrichie de nombreux ajouts. Il débute par le Prophète, puis présente les Compagnons, hommes et femmes, ensuite les Successeurs et les générations suivantes, classés par ville, de Médine et La Mecque jusqu'à l'Extrême-Orient et l'Extrême-Occident; il traite de plus d'un millier de personnes, dont plus de deux cents femmes."
  ur: "ابو الفراج ابن الجوزی ⁦(متوفی 597ھ)⁩ کی کتاب سنیاسیوں اور متقیوں پر، ابو نعیم اصفہانی کی ہلیۃ الاولیاء کے اختصار اور تصحیح کے طور پر بہت سے اضافے کے ساتھ لکھی گئی ہے۔ یہ نبی کے ساتھ کھلتا ہے، پھر صحابہ مرد و عورت، پھر جانشینوں اور بعد کی نسلوں نے مدینہ اور مکہ سے مشرق اور مغرب تک شہر کے لحاظ سے ترتیب دی تھی۔ اس میں ایک ہزار سے زیادہ افراد شامل ہیں، جن میں سے دو سو سے زیادہ خواتین ہیں۔"
