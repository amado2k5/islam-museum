summary:
  ar: "كتاب لأبي الفرج ابن الجوزي (ت 597هـ) في أخبار الزهاد والعباد، ألّفه اختصاراً وتهذيباً لـ«حلية الأولياء» لأبي نعيم الأصبهاني مع زيادات كثيرة؛ يفتتحه بذكر النبي ثم الصحابة والصحابيات ثم التابعين ومن بعدهم مرتبين على البلدان من المدينة ومكة إلى أقاصي المشرق والمغرب، ويزيد عدد من فيه على ألف شخص منهم أكثر من مائتي امرأة."
  en: "Abu al-Faraj Ibn al-Jawzi's (d. 597 AH) book on the ascetics and devout, written as an abridgement and correction of Abu Nu'aym al-Isfahani's Hilyat al-Awliya' with many additions. It opens with the Prophet, then the Companions male and female, then the Successors and later generations arranged by city from Medina and Mecca to the far East and West; it covers more than a thousand people, over two hundred of them women."
