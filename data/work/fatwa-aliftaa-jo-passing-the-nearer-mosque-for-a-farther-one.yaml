id: work/fatwa-aliftaa-jo-passing-the-nearer-mosque-for-a-farther-one
class: work
kind: fatwa
label: { ar: "تخطي المسجد القريب إلى المسجد البعيد", en: "Passing the nearer mosque to pray in a farther one", ur: "قریبی مسجد چھوڑ کر دور کی مسجد جانا", es: "Pasar por la mezquita más cercana para rezar en una más lejana.", fr: "Passer devant la mosquée la plus proche pour prier dans une mosquée plus éloignée", tr: "Yakındaki camiyi atlayarak uzak camiye gidin", id: "Lewati masjid terdekat ke masjid yang jauh" }
summary:
  ar: "سؤال عن تخطي المسجد القريب إلى المسجد البعيد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأفضل الصلاة في البعيد الأكثر جماعة ما لم تختل جماعة القريب بتخلفه، فإن اختلت كان القريب أفضل. أجابت الدائرة بأن المسجد البعيد إن كانت جماعته أكثر، ولا تختل جماعة المسجد القريب بتخلف المصلي عنه، فالأفضل أن يصلي في المسجد البعيد. وقالت إن جماعة المسجد القريب إن كانت تختل بتخلفه، بأن يكون إمامها أو ممن يحضر الناس بحضوره، فصلاته في القريب أفضل، لتحصل الجماعة في البلد في موضعين. واستندت إلى حديث رواه أحمد وأبو داود والنسائي في أن صلاة الرجل مع غيره أزكى من صلاته وحده، وأن ما كان أكثر جماعة فهو أحب إلى الله."
  en: "A question about passing the nearer mosque to pray in a farther one, in which Jordan's General Iftaa Department answered that it is better to pray in the farther mosque with the larger congregation unless the nearer mosque's congregation would suffer from his absence, in which case the nearer one is better. The Department answered that if the farther mosque has a larger congregation and the nearer mosque's congregation would not suffer from his absence, it is better to pray in the farther mosque. It said that if the nearer mosque's congregation would suffer from his absence, because he is its imam or people attend when he attends, then praying in the nearer mosque is better, so that congregations are held in two places in the town. It relied on a hadith reported by Ahmad, Abu Dawud and al-Nasa'i that a man's prayer with others is purer than his prayer alone, and that the larger the congregation the more beloved it is to God."
  ur: "قریبی مسجد چھوڑ کر دور کی مسجد جانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دور کی بڑی جماعت والی مسجد میں نماز بہتر ہے جب تک قریبی مسجد کی جماعت اس کی غیر موجودگی سے متاثر نہ ہو؛ اگر متاثر ہو تو قریبی مسجد بہتر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر دور کی مسجد کی جماعت بڑی ہو اور قریبی مسجد کی جماعت نمازی کی غیر موجودگی سے متاثر نہ ہو تو دور کی مسجد میں نماز پڑھنا بہتر ہے۔ اس نے کہا کہ اگر قریبی مسجد کی جماعت اس کی غیر موجودگی سے متاثر ہو، مثلاً وہ اس کا امام ہو یا اس کے آنے سے لوگ آتے ہوں، تو قریبی مسجد میں نماز بہتر ہے، تاکہ شہر میں دو جگہ جماعت قائم ہو۔ اس نے احمد، ابو داود اور نسائی کی روایت کردہ ایک حدیث پر انحصار کیا کہ آدمی کی دوسروں کے ساتھ نماز اکیلے کی نماز سے زیادہ پاکیزہ ہے، اور جماعت جتنی بڑی ہو اللہ کو اتنی زیادہ محبوب ہے۔"
  es: "Una pregunta sobre la conveniencia de rezar en una mezquita más lejana en lugar de la más cercana, a lo que el Departamento General de Iftaa de Jordania respondió que es mejor rezar en la mezquita más lejana con una congregación más numerosa, a menos que la congregación de la mezquita más cercana sufra su ausencia, en cuyo caso la más cercana es preferible. El Departamento respondió que si la mezquita más lejana tiene una congregación mayor y la congregación de la mezquita más cercana no se vería afectada por su ausencia, es mejor rezar en la mezquita más lejana. Añadió que si la congregación de la mezquita más cercana se vería afectada por su ausencia, ya sea porque él es su imán o porque la gente asiste cuando él asiste, entonces rezar en la mezquita más cercana es preferible, de modo que se celebren congregaciones en dos lugares de la ciudad. Se basó en un hadiz narrado por Ahmad, Abu Dawud y al-Nasa'i que afirma que la oración de un hombre en compañía es más pura que su oración en solitario, y que cuanto mayor sea la congregación, más amada es por Dios."
  fr: "Une question concernant le choix entre prier dans une mosquée plus éloignée et la mosquée la plus proche a été posée par le Département général de la Ifta de Jordanie. Ce dernier a répondu qu'il est préférable de prier dans la mosquée la plus éloignée, car elle est plus fréquentée, sauf si l'absence de l'imam nuit à la communauté de la mosquée la plus proche. Dans ce cas, il est préférable de prier dans la mosquée la plus proche. Le Département a précisé que si la mosquée la plus éloignée a une plus grande assemblée et que l'absence de l'imam ne nuit pas à la communauté de la mosquée la plus proche, il est préférable de prier dans la mosquée la plus éloignée. Il a ajouté que si l'absence de l'imam nuit à la communauté de la mosquée la plus proche, par exemple parce que l'imam en est l'usage ou parce que les fidèles assistent aux offices lorsqu'il est présent, alors il est préférable de prier dans la mosquée la plus proche. Ainsi, les prières en groupe sont maintenues dans deux lieux de prière de la ville. Le Département s'est appuyé sur un hadith rapporté par Ahmad, Abu Dawud et An-Nasa'i, selon lequel la prière en groupe est plus pure que la prière solitaire, et plus l'assemblée est nombreuse, plus elle est aimée de Dieu."
  tr: "Yakındaki camiyi uzak camiye atlama sorusunda, Ürdün Genel Fetva Dairesi, yakındaki cemaat gecikme nedeniyle en büyük cemaatin olduğu uzak camide namaz kılmanın tercih edildiğini; aksi takdirde yakındaki caminin daha iyi olduğunu yanıtladı. Daire, yakındaki caminin cemaati daha büyükse ve yakındaki caminin cemaati ibadet edenin gecikmesiyle aksamıyorsa, uzak camide namaz kılmanın daha iyi olduğunu söyledi. Yakındaki caminin cemaati gecikme nedeniyle aksadıysa, imamın veya katılanların yakındaki camide namaz kılmasının daha iyi olduğunu, böylece şehirdeki cemaatin iki yerde toplandığını belirtti. Ahmed, Ebu Davud ve En-Nasa'i tarafından anlatılan bir hadise dayanarak, bir insanın başkalarıyla birlikte namazının tek başına namazından daha saf olduğunu ve cemaat ne kadar büyükse Allah'a o kadar çok sevilir demiştir."
  id: "Sebuah pertanyaan tentang melewati masjid terdekat ke masjid yang jauh, Departemen Fatwa Jenderal Yordania menjawab bahwa lebih baik shalat di masjid yang lebih jauh dengan jemaat terbesar kecuali jemaat terganggu oleh keterlambatannya; jika memang demikian, masjid terdekat lebih baik. Departemen menjawab bahwa jika jamaah masjid terdekat lebih besar dan jamaah masjid terdekat tidak terganggu oleh keterlambatan jamaah, lebih baik shalat di masjid yang jauh. Mereka mengatakan bahwa jika jamaah masjid terdekat terganggu oleh keterlambatannya, imam atau orang yang menghadiri orang harus salat di masjid terdekat lebih baik, sehingga jamaah di kota diadakan di dua tempat. Dinaikkan pada hadits yang dijajarkan oleh Ahmad, Abu Dawood, dan An-Nasa'i bahwa shalat seseorang bersama orang lain lebih murni daripada solatnya sendiri, dan semakin besar jamaah, semakin disayangi Allah."
