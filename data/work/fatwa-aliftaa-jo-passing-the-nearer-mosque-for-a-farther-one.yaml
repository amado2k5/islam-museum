id: work/fatwa-aliftaa-jo-passing-the-nearer-mosque-for-a-farther-one
class: work
kind: fatwa
label: { ar: "تخطي المسجد القريب إلى المسجد البعيد", en: "Passing the nearer mosque to pray in a farther one", ur: "قریبی مسجد چھوڑ کر دور کی مسجد جانا" }
summary:
  ar: "سؤال عن تخطي المسجد القريب إلى المسجد البعيد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأفضل الصلاة في البعيد الأكثر جماعة ما لم تختل جماعة القريب بتخلفه، فإن اختلت كان القريب أفضل. أجابت الدائرة بأن المسجد البعيد إن كانت جماعته أكثر، ولا تختل جماعة المسجد القريب بتخلف المصلي عنه، فالأفضل أن يصلي في المسجد البعيد. وقالت إن جماعة المسجد القريب إن كانت تختل بتخلفه، بأن يكون إمامها أو ممن يحضر الناس بحضوره، فصلاته في القريب أفضل، لتحصل الجماعة في البلد في موضعين. واستندت إلى حديث رواه أحمد وأبو داود والنسائي في أن صلاة الرجل مع غيره أزكى من صلاته وحده، وأن ما كان أكثر جماعة فهو أحب إلى الله."
  en: "A question about passing the nearer mosque to pray in a farther one, in which Jordan's General Iftaa Department answered that it is better to pray in the farther mosque with the larger congregation unless the nearer mosque's congregation would suffer from his absence, in which case the nearer one is better. The Department answered that if the farther mosque has a larger congregation and the nearer mosque's congregation would not suffer from his absence, it is better to pray in the farther mosque. It said that if the nearer mosque's congregation would suffer from his absence, because he is its imam or people attend when he attends, then praying in the nearer mosque is better, so that congregations are held in two places in the town. It relied on a hadith reported by Ahmad, Abu Dawud and al-Nasa'i that a man's prayer with others is purer than his prayer alone, and that the larger the congregation the more beloved it is to God."
  ur: "قریبی مسجد چھوڑ کر دور کی مسجد جانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دور کی بڑی جماعت والی مسجد میں نماز بہتر ہے جب تک قریبی مسجد کی جماعت اس کی غیر موجودگی سے متاثر نہ ہو؛ اگر متاثر ہو تو قریبی مسجد بہتر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر دور کی مسجد کی جماعت بڑی ہو اور قریبی مسجد کی جماعت نمازی کی غیر موجودگی سے متاثر نہ ہو تو دور کی مسجد میں نماز پڑھنا بہتر ہے۔ اس نے کہا کہ اگر قریبی مسجد کی جماعت اس کی غیر موجودگی سے متاثر ہو، مثلاً وہ اس کا امام ہو یا اس کے آنے سے لوگ آتے ہوں، تو قریبی مسجد میں نماز بہتر ہے، تاکہ شہر میں دو جگہ جماعت قائم ہو۔ اس نے احمد، ابو داود اور نسائی کی روایت کردہ ایک حدیث پر انحصار کیا کہ آدمی کی دوسروں کے ساتھ نماز اکیلے کی نماز سے زیادہ پاکیزہ ہے، اور جماعت جتنی بڑی ہو اللہ کو اتنی زیادہ محبوب ہے۔"
