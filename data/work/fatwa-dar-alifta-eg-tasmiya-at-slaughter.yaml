id: work/fatwa-dar-alifta-eg-tasmiya-at-slaughter
class: work
kind: fatwa
label: { ar: "وقت التسمية عند الذبح والحكم لو نسيها", en: "When to say the tasmiya at slaughter, and if it is forgotten", ur: "ذبح پر تسمیہ کا وقت اور بھول جانے کا حکم", es: "Cuándo decir el tasmiya en el sacrificio, y si se olvida", fr: "Quand réciter la tasmiya lors de l'abattage, et si on l'oublie" }
summary:
  ar: "سائل سأل عن وقت التسمية عند الذبح والحكم لو نسيها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22316)⁩ أن التسمية عند الذبح سنة ووقتها عند فعل الذبح ويجوز إيقاعها قبله بوقت يسير لا يشعر بالانفصال، وبيّن الجواب حكم من نسيها."
  en: "A questioner asked about the timing of the tasmiya (naming God's name) at slaughter and the ruling if it is forgotten. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22316) answered that the tasmiya is a sunna said at the act of slaughter, and it may be said shortly before if no separation is felt; the answer sets out the ruling on one who forgets it."
  ur: "ایک سائل نے ذبح پر بسم اللہ کہنے کا وقت اور بھول جانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22316)⁩ نے جواب دیا کہ ذبح پر تسمیہ سنت ہے اور اس کا وقت ذبح کے فعل کے ساتھ ہے، ذرا پہلے کہا جا سکتا ہے بشرطیکہ فاصلہ محسوس نہ ہو؛ بھول جانے والے کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre el momento de recitar la tasmiya (invocar el nombre de Dios) durante el sacrificio y la norma que rige su olvido. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22316) respondió que la tasmiya es una sunna que se recita durante el sacrificio y que puede recitarse poco antes si no se percibe ninguna separación; la respuesta expone la norma para quien la olvida."
  fr: "Une personne a posé une question concernant le moment opportun pour réciter la tasmiya (invocation du nom de Dieu) lors de l'abattage et la règle à suivre en cas d'oubli. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22316) a répondu que la tasmiya est une sunna récitée au moment de l'abattage et qu'elle peut être récitée peu avant si l'on ne ressent pas de séparation spirituelle; la réponse expose la règle à suivre pour celui qui l'oublie."
