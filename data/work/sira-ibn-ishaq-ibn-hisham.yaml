label: { ar: "سيرة ابن إسحاق برواية ابن هشام", en: "The Sira of Ibn Ishaq in Ibn Hisham's recension" }
summary:
  ar: "أقدم سيرة نبوية متصلة باقية؛ ألفها محمد بن إسحاق ⁦(ت 151هـ)⁩ ثم هذّبها ولخصها عبد الملك بن هشام ⁦(ت 213هـ أو 218هـ)⁩ فصارت المعروفة بـ«السيرة النبوية لابن هشام». لا تبقى سيرة ابن إسحاق عملًا مستقلًا، وما أسقطه ابن هشام محفوظ عند الطبري والأزرقي. وتباينت أحكام نقاد الرجال على ابن إسحاق، فمنهم من وثّقه ومنهم من تركه في الحديث وقبله في المغازي."
  en: "The earliest surviving continuous biography of the Prophet, composed by Muhammad ibn Ishaq (d. 151 AH) and abridged and recast by Abd al-Malik ibn Hisham (d. 213 or 218 AH), the text known as Ibn Hisham's Sira. Ibn Ishaq's own Sira does not survive as a single work, and passages Ibn Hisham omitted are preserved by al-Tabari and al-Azraqi. Early Muslim critics of narrators judged Ibn Ishaq very differently, some accepting him and others accepting him on maghazi but not on hadith."
  ur: "سب سے قدیم متصل نبوی سیرت جو باقی ہے۔ اسے محمد بن اسحاق نے لکھا اور عبد الملک بن ہشام نے اس کی تہذیب و تلخیص کی، اسی لیے یہ ابن ہشام کی سیرت کے نام سے معروف ہے۔ ابن اسحاق کی اپنی سیرت ایک کتاب کی صورت میں باقی نہیں، اور ابن ہشام کے چھوڑے ہوئے حصے طبری اور ازرقی کے ہاں محفوظ ہیں۔ راویوں کے ابتدائی ناقدین نے ابن اسحاق کے بارے میں مختلف رائے دی، کسی نے قبول کیا اور کسی نے مغازی میں قبول کیا مگر حدیث میں نہیں۔"
