summary:
  ar: "كتاب السير والمغازي لمحمد بن إسحاق المطلبي ⁦(ت 151هـ)⁩، أقدم سيرة مستقلة عن السيرة النبوية؛ النسخة المقروءة تحقيق سهيل زكار، دار الفكر. يختلف عن recension ابن هشام التي تحمل المصنف نفسه ضمن عنوانها."
  en: "Muhammad ibn Ishaq al-Muttalibi's Kitab al-Sira wa-l-Maghazi (d. 151 AH), the earliest independent sira; the copy read is Suhayl Zakkar's edition (Dar al-Fikr). Distinct from the Ibn Hisham recension."
  es: "Kitab al-Sira wa-l-Maghazi de Muhammad ibn Ishaq al-Muttalibi (m. 151 d. H.), la primera sira independiente; la copia leída es la edición de Suhayl Zakkar (Dar al-Fikr). Distinto de la recensión de Ibn Hisham."
  fr: "Kitab al-Sira wa-l-Maghazi de Muhammad ibn Ishaq al-Muttalibi (mort en 151 AH), la première sira indépendante; l'exemplaire lu est l'édition de Suhayl Zakkar (Dar al-Fikr). Distinct de la recension d'Ibn Hisham."
  ur: "محمد بن اسحاق المطلبی کی کتاب السیرۃ والمغازی ⁦(متوفی 151ھ)⁩، قدیم ترین آزاد سیرہ؛ پڑھی جانے والی کاپی سہیل زکر کا ایڈیشن ⁦(دار الفکر)⁩ ہے۔ ابن ہشام کی تجدید سے ممتاز۔"
