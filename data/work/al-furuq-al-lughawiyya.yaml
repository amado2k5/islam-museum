summary:
  ar: "الفروق اللغوية لأبي هلال العسكري، كتاب يبحث في الفروق الدقيقة بين معاني الكلمات المترادفة. حقّقه حسام الدين القدسي اعتماداً على أربع نسخ ⁦(بيروت، دون تاريخ)⁩، واختصره مؤلف مجهول في «مختصر كتاب الفروق» طُبع ببولاق ١٣٢٣هـ وبالقاهرة ١٩٢٦م."
  en: "Abu Hilal al-Askari's al-Furuq al-lughawiyya, a book on the fine differences in meaning between words that are usually taken as synonyms. Husam al-Din al-Qudsi edited it from four manuscripts (Beirut, n.d.), and an unknown author abridged it as Mukhtasar Kitab al-Furuq, printed at Bulaq (1323 AH) and Cairo (1926)."
  es: "El al-Furuq al-lughawiyya de Abu Hilal al-Askari, un libro sobre las diferencias sutiles de significado entre palabras que suelen tomarse por sinónimas. Husam al-Din al-Qudsi lo editó a partir de cuatro manuscritos (Beirut, s. f.), y un autor desconocido lo abrevió en el Mukhtasar Kitab al-Furuq, impreso en Bulaq (1323 AH) y El Cairo (1926)."
  fr: "Le al-Furuq al-lughawiyya d'Abu Hilal al-Askari, ouvrage sur les différences fines de sens entre des mots que l'on tient d'ordinaire pour synonymes. Husam al-Din al-Qudsi l'a édité d'après quatre manuscrits (Beyrouth, s. d.), et un auteur inconnu l'a abrégé dans le Mukhtasar Kitab al-Furuq, imprimé à Boulaq (1323 AH) et au Caire (1926)."
  ur: "ابو ہلال العسکری کی الفروق اللغویہ، ان الفاظ کے معانی میں باریک فرق کی کتاب جنہیں عموماً مترادف سمجھا جاتا ہے۔ حسام الدین القدسی نے اسے چار نسخوں کی بنیاد پر شائع کیا ⁦(بیروت، بدون تاریخ)⁩، اور ایک نامعلوم مصنف نے اس کی مختصر مختصر کتاب الفروق کے نام سے کی جو بولاق ⁦(1323ھ)⁩ اور قاہرہ ⁦(1926ء)⁩ میں چھپی۔"
