label: { ar: "كيفية الغسل من الاحتلام", en: "How to bathe after nocturnal emission — step by step", ur: "احتلام کے بعد غسل کا طریقہ", es: "Cómo bañarse después de una emisión nocturna: paso a paso", fr: "Comment se laver après une émission nocturne — étape par étape", tr: "Islak rüyalardan sonra nasıl yıkanılır", id: "Cara mencuci setelah mimpi basah" }
summary:
  ar: "سأل سائل كيفية الاغتسال في حالة الاستحلام وعاقبة غير المغتسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21940 بتاريخ 26 يناير 2006)⁩ أن يبدأ بتنظيف جسمه من أي نجاسة ثم يغسل يديه بالصابون ثم يتوضأ ثم يفيض الماء على شقه الأيمن ثم الأيسر ثم على جميع بدنه مع ما بيّن الجواب من وجوبه لأداء الصلاة وترك الذنب في التسويف."
  en: "A questioner asked how to bathe after nocturnal emission and the consequence of not bathing. Dr. Salah al-Sawi (fatwa no. 21940, 26 January 2006) answered: first clean the body of any impurity, wash the hands with soap, do wudu, then pour water over the right side then the left then the whole body — with what the answer sets out of its being obligatory for the prayer and the sin of delaying it."
  ur: "احتلام کا غسل کیسے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21940، 26 جنوری 2006)⁩ کے مطابق نجاست دھو کر وضو پھر دائیں بائیں سارے بدن پر پانی؛ تاخیر گناہ۔"
  es: "Una persona preguntó cómo bañarse después de una eyaculación nocturna y las consecuencias de no hacerlo. El Dr. Salah al-Sawi (fatwa n.° 21940, 26 de enero de 2006) respondió: primero, limpiar el cuerpo de cualquier impureza, lavarse las manos con jabón, realizar la ablución (wudu), luego verter agua sobre el lado derecho, después sobre el izquierdo y finalmente sobre todo el cuerpo; la respuesta establece que esto es obligatorio para la oración y que retrasarla constituye un pecado."
  fr: "Un internaute a demandé comment se laver après une émission nocturne et quelles étaient les conséquences de ne pas se laver. Le Dr Salah al-Sawi (fatwa n° 21940, 26 janvier 2006) a répondu: « Premièrement purifier son corps de toute impureté, se laver les mains au savon, faire ses ablutions (wudu), puis se verser de l’eau sur le côté droit, puis le gauche, puis sur tout le corps. » La réponse souligne que cette étape est obligatoire pour la prière et que le fait de la retarder constitue un péché."
  tr: "Bir soru soran, abdest alma halinde ghusl'un nasıl yapılacağını ve guslu yapan kişi dışında birinin sonuçlarını sormuştur. Dr. Salah Al-Sawy (26 Ocak 2006 tarihli 21940 sayılı fetva) önce vücudunu herhangi bir kirden temizlemesi, sonra ellerini sabunla yıkaması, ardından abdest alması, ardından sağ tarafına, sonra sol tarafına, sonra tüm vücuduna su dökmesi gerektiğini, namaz kılma ve erteleme günahından kaçınma yükümlülüğünün açıklanmasını sağlamıştır."
  id: "Seorang penanya bertanya bagaimana melakukan ghusl dalam keadaan wudhu dan konsekuensi dari seseorang selain yang melakukan ghusl. Dr. Salah Al-Sawy menjawab (Fatwa No. 21940 tanggal 26 Januari 2006) bahwa ia harus mulai dengan membersihkan tubuhnya dari segala kotoran, lalu mencuci tangan dengan sabun, kemudian melakukan wudhu, kemudian menuangkan air ke sisi kanan, kemudian ke sisi kiri, kemudian ke seluruh tubuhnya, beserta penjelasan tentang kewajiban untuk berdoa dan menghindari dosa menunda-nunda."
