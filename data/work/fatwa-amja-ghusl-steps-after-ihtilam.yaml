label: { ar: "كيفية الغسل من الاحتلام", en: "How to bathe after nocturnal emission — step by step", ur: "احتلام کے بعد غسل کا طریقہ" }
summary:
  ar: "سأل سائل كيفية الاغتسال في حالة الاستحلام وعاقبة غير المغتسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21940 بتاريخ 26 يناير 2006)⁩ أن يبدأ بتنظيف جسمه من أي نجاسة ثم يغسل يديه بالصابون ثم يتوضأ ثم يفيض الماء على شقه الأيمن ثم الأيسر ثم على جميع بدنه مع ما بيّن الجواب من وجوبه لأداء الصلاة وترك الذنب في التسويف."
  en: "A questioner asked how to bathe after nocturnal emission and the consequence of not bathing. Dr. Salah al-Sawi (fatwa no. 21940, 26 January 2006) answered: first clean the body of any impurity, wash the hands with soap, do wudu, then pour water over the right side then the left then the whole body — with what the answer sets out of its being obligatory for the prayer and the sin of delaying it."
  ur: "احتلام کا غسل کیسے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21940، 26 جنوری 2006)⁩ کے مطابق نجاست دھو کر وضو پھر دائیں بائیں سارے بدن پر پانی؛ تاخیر گناہ۔"
