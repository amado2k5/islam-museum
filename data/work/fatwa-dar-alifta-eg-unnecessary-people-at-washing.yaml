label: { ar: "حكم حضور من لا يحتاج إليه في غسل الميت", en: "The presence of unnecessary people at the washing of the dead", ur: "غسل کے وقت غیر ضروری لوگوں کی موجودگی" }
summary:
  ar: "سائل سأل عن حضور من لا يحتاج إليه في غسل الميت. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21675)⁩ أنه يستحب عند تغسيل الميت ستر الموضع الذي يغسل فيه لأن حرمة جسد الميت كحرمته حيًّا وستره وعدم إفشاء ما يظهر منه على ما فصّل الجواب."
  en: "A questioner asked about unnecessary people attending the washing of the dead. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21675) answered that covering the place of washing is commended, for the dead body's sanctity is as it was in life — screening it and not spreading what appears — as the answer details."
  ur: "ایک سائل نے غسل کے وقت غیر ضروری لوگوں کی موجودگی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21675)⁩ نے جواب دیا کہ غسل کی جگہ ڈھانپنا مستحب ہے کیونکہ مُردے کے بدن کی حرمت جیسی زندگی میں تھی؛ اسے ڈھانپنا اور کچھ ظاہر ہو تو نہ پھیلانا — جیسا کہ جواب میں تفصیل ہے۔"
