label: { ar: "حكم استخدام الموظف المعلومات الخاصة بالشركة في المصلحة الخاصة", en: "An employee using company information for his own benefit", ur: "ملازم کا کمپنی کی معلومات اپنے مفاد میں استعمال کرنا" }
summary:
  ar: "سائل سأل عن استخدام الموظف المعلومات الخاصة بالشركة في مصالحه الخاصة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22388)⁩ أنه يحرم على العامل استخدام المعلومات الخاصة بالشركة والانتفاع بها في مصالحه الخاصة؛ فهو مؤتمن على العمل الذي يقوم به على ما فصّل الجواب."
  en: "A questioner asked about an employee using his company's private information for his own benefit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22388) answered that it is forbidden for the worker to use the company's private information and profit by it for his personal interests — he is entrusted with the work he performs, as the answer details."
  ur: "ایک سائل نے ملازم کے کمپنی کی نجی معلومات اپنے مفاد میں استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22388)⁩ نے جواب دیا کہ ملازم پر کمپنی کی نجی معلومات اپنے ذاتی مفاد میں استعمال کرنا حرام ہے — وہ اپنے کام کا امین ہے، جیسا کہ جواب میں تفصیل ہے۔"
