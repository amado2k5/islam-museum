summary:
  ar: "كتاب أبي بكر الرازي الكبير في الطب. تعرض النسخة التي قرأناها مجلدها الأول، وفيه ثلاثة أجزاء: أمراض الرأس، وأمراض العين، وأمراض الأذن والأنف والأسنان {cite:hawi-razi-dar-kutub-ilmiyya p.1}، ويبدأ الجزء الأول بأمراض الرأس {cite:hawi-razi-dar-kutub-ilmiyya p.5}."
  en: "Abu Bakr al-Razi's large medical work. The volume read here has three parts: diseases of the head, of the eye, and of the ear, nose and teeth {cite:hawi-razi-dar-kutub-ilmiyya p.1}; the first part begins with diseases of the head {cite:hawi-razi-dar-kutub-ilmiyya p.5}."
  es: "La extensa obra médica de Abu Bakr al-Razi. El volumen que aquí se lee consta de tres partes: enfermedades de la cabeza, del ojo y del oído, nariz y dientes {cite:hawi-razi-dar-kutub-ilmiyya p.1}; la primera parte comienza con las enfermedades de la cabeza {cite:hawi-razi-dar-kutub-ilmiyya p.5}."
  fr: "L'ouvrage médical majeur d'Abu Bakr al-Razi. Le volume présenté ici comporte trois parties: maladies de la tête, de l'œil et de l'oreille, du nez et des dents {cite:hawi-razi-dar-kutub-ilmiyya p.1}; la première partie commence par les maladies de la tête {cite:hawi-razi-dar-kutub-ilmiyya p.5}."
