label: { ar: "خروج لا إرادي", en: "Involuntary emissions — istinja and timed wudu", ur: "لارادی خارجی — استنجاء اور وضو", es: "Emisiones involuntarias: istinja y wudu cronometrado" }
summary:
  ar: "سأل سائل أنه تكررت له في الآونة الأخيرة نجاسة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23177 بتاريخ 19 يونيو 2008)⁩ أن سلس البول أو المني الذي لا يخرج دفقًا بشهوة وإنما يخرج بطريقة لا إرادية ولا شهوة معها لا يلزم منه إلا الاستنجاء والوضوء لوقت كل صلاة ثم يباشر بهذا الوضوء ما شاء من العبادات على ما فصّل الجواب."
  en: "A questioner had recurring impurity befall him lately. Dr. Salah al-Sawi (fatwa no. 23177, 19 June 2008) answered that incontinence of urine, or semen leaving not in a gush with desire but involuntarily with no desire present, obliges only istinja and wudu for each prayer's time — then he performs by it whatever worship he wishes — as the answer details."
  ur: "لارادی خارجی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23177، 19 جون 2008)⁩ کے مطابق شہوت کے بغیر خارج ہونے والے پر استنجاء اور ہر وقت پر وضو کافی۔"
  es: "Un consultante había sufrido recientemente de impureza recurrente. El Dr. Salah al-Sawi (fatwa n.º 23177, 19 de junio de 2008) respondió que la incontinencia urinaria, o la salida involuntaria de semen sin deseo, no en un chorro repentino, obliga únicamente a realizar el istinja y el wudu para cada oración; luego, con ello, puede realizar cualquier acto de adoración que desee, como se detalla en la respuesta."
