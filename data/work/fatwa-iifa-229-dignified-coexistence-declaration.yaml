label: { ar: "قرار مجمع الفقه الإسلامي الدولي 229 (23/13) بشأن إعلان التعايش الكريم في ظل الإسلام", en: "IIFA resolution 229 (23/13) adopting the Declaration of Dignified Coexistence under Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 229 (23/13): اسلام کی رو میں باوقار بقائے باہمی کا اعلامیہ", es: "Resolución 229 (23/13) de la IIFA por la que se adopta la Declaración de Coexistencia Digna en el Islam." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩ أصدر فيه إعلانًا بعنوان ⁦«التعايش الكريم في ظل الإسلام»⁩ نظرًا لما تمر به الأمة من مشكلات داخلية وتحديات خارجية، مستلهمًا وثيقة المدينة التي كتبها رسول الله بين أهلها وفئاتها. استعرض الإعلان في ثمانية وعشرين بندًا أهم مبادئ الإسلام في التعايش، منها: عمومية دعوة الإسلام لكل الناس وطريق إبلاغها الحكمة والموعظة الحسنة؛ تكريم الله للإنسان المستخلف وحرمة إيذائه حيًا أو ميتًا؛ إيمان المسلم بسائر الأنبياء والكتب المنزلة؛ عدم الإكراه في الدخول إلى الإسلام؛ عصمة النفس الإنسانية فقتل نفس واحدة كقتل الناس جميعا؛ تحريم البغي والعدوان واعتباره إفسادًا في الأرض؛ حرمة الاعتداء على النفس والمال والعرض إلا بحق؛ الأسرة أساس بناء المجتمع؛ السلام شعار الإسلام وأساس العلاقة مع الآخرين والبر بالمسالمين؛ الجنوح إلى السلم العادل؛ تنديد الإسلام بكل صور ما يسمى بالإرهاب؛ الرحمة والحلم والعفو والتسامح من صفات رسول الإسلام؛ وجوب الوسطية والاعتدال وجرمية التطرف والغلو؛ التعاون بين بني الإنسان لخير البشرية؛ حقوق غير المسلمين في بلاد المسلمين كحقوق المسلمين وحرية بقائهم على أديانهم؛ عدم التفريق بين البشر لونًا أو جنسًا أو لسانًا لأصلهم الواحد وعدم التفريق بين الذكر والأنثى في الكرامة؛ الدعوة إلى العدل دون نظر لدين أو لون؛ الحث على العلم؛ وجوب العمل والسعي للرزق؛ الصلح بين المسلمين وكف الباغي؛ التكافل الاجتماعي؛ والتنمية الشاملة. ودعا الإعلان على ضوء هذه المبادئ إلى ترجمتها في السياسات والتشريعات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), in which it issued a declaration titled 'Dignified Coexistence under Islam' in view of the internal problems and external challenges facing the Muslim community, drawing on the Covenant of Medina written between its various groups. In twenty-eight clauses the declaration reviews Islam's main principles of coexistence, among them: the universal call of Islam to all people, to be conveyed with wisdom and fair exhortation; God's honouring of the human being as His vicegerent and the inviolability of his person, living or dead; the Muslim's faith in all prophets and revealed books; entry into Islam by full freedom without compulsion; the inviolability of the soul — killing one soul being like killing all mankind; the prohibition of transgression and aggression as corruption on earth; no attack on life, property or honour except by right; the family as the foundation of society; peace as a hallmark of Islam and the basis of relations with others, with kindness to the peaceable; inclining to just peace; Islam's condemnation of all that is called terrorism in these days; mercy, forbearance, pardon and tolerance among the Prophet's traits; moderation and balance as the Muslim's required course and extremism and excess a crime; cooperation among human beings for mankind's good; non-Muslims in Muslim lands holding the same rights as Muslims with freedom to keep their faiths; no discrimination between people by colour, sex or tongue for their single origin, nor between male and female in human dignity; a call to justice regardless of religion or colour; the urging of knowledge; work and striving for provision as a duty; reconciliation between Muslims and checking the transgressor; social solidarity; and comprehensive development. The declaration called for these principles to be embodied in policies and legislation."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں، جس میں اس نے امت کے داخلی مسائل اور خارجی چیلنجوں کو دیکھتے ہوئے ⁦«اسلام کی رو میں باوقار بقائے باہمی»⁩ کا اعلامیہ جاری کیا، جس کی اساس مدینہ کی مختلف جماعتوں کے درمیان لکھی گئی میثاقِ مدینہ ہے۔ اعلامیہ نے اٹھائیس شقوں میں بقائے باہمی کے اسلامی اصول پیش کیے، جن میں شامل ہیں: اسلام کی دعوت کی عمومیت تمام انسانوں کے لیے اور اسے حکمت و نیک نصیحت سے پہنچانا؛ خلیفۂ اللہ انسان کی تکریم اور زندہ یا مردہ اس کے تکلیف دینے کی حرمت؛ تمام انبیاء اور آسمانی کتابوں پر ایمان؛ اسلام میں داخلے میں کوئی جبر نہ ہونا؛ نفسِ انسانی کی حرمت — ایک نفس کا قتل پوری انسانیت کا قتل؛ بغاوت اور تجاوز کی تحریم اور اسے زمین میں فساد قرار دینا؛ جان، مال اور عزت پر بلا حق حملے کی حرمت؛ خاندان بطور معاشرے کی اساس؛ امن اسلام کی نشانی اور دوسروں سے تعلق کی اساس اور امن پسندوں کے ساتھ بھلائی؛ منصفانہ صلح کی طرف جھکاؤ؛ اس زمانے میں دہشت گردی کہلانے والی ہر شکل کی اسلامی مذمت؛ رحمت، بردباری، معافی اور رواداری نبی اسلام کی صفات میں؛ مسلمان پر وسطیت و اعتدال کا راستہ واجب اور غلو و انتہا پسندی جرم؛ انسانیت کی بھلائی کے لیے انسانوں میں تعاون؛ مسلم ممالک میں غیر مسلموں کے مسلمانوں جیسے حقوق اور اپنے عقائد پر رہنے کی آزادی؛ ایک ہی اصل ہونے کی وجہ سے رنگ، جنس یا زبان کے سبب تفریق نہ ہونا اور مرد و عورت میں وقار میں فرق نہ ہونا؛ مذہب یا رنگ کے بغیر عدل کی دعوت؛ علم کی ترغیب؛ روزی کی جستجو میں عمل واجب؛ مسلمانوں میں صلح اور باغی کا روکنا؛ سماجی تکافل؛ اور جامع ترقی۔ اعلامیہ نے ان اصولوں کو پالیسیوں اور قوانین میں عملی شکل دینے کی دعوت دی۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018), en la que emitió una declaración titulada \"Coexistencia digna bajo el Islam\" en vista de los problemas internos y los desafíos externos que enfrenta la comunidad musulmana, basándose en el Pacto de Medina escrito entre sus diversos grupos. En veintiocho cláusulas la declaración revisa los principales principios de coexistencia del Islam, entre ellos: el llamado universal del Islam a todas las personas, que debe transmitirse con sabiduría y exhortación justa; el honor de Dios al ser humano como su vicerregente y la inviolabilidad de su persona, viva o muerta; la fe del musulmán en todos los profetas y libros revelados; la entrada al Islam por plena libertad sin coacción; la inviolabilidad del alma: matar un alma es como matar a toda la humanidad; la prohibición de la transgresión y la agresión como corrupción en la tierra; ningún ataque a la vida, la propiedad o el honor excepto por derecho; la familia como fundamento de la sociedad; La paz como sello distintivo del Islam y fundamento de las relaciones con los demás, con bondad hacia los pacíficos; inclinación hacia una paz justa; la condena del Islam a todo lo que se denomina terrorismo en la actualidad; la misericordia, la tolerancia, el perdón y la indulgencia entre los rasgos del Profeta; la moderación y el equilibrio como conducta obligatoria del musulmán y el extremismo y el exceso como delito; la cooperación entre los seres humanos para el bien de la humanidad; los no musulmanes en tierras musulmanas con los mismos derechos que los musulmanes y libertad para practicar su fe; la no discriminación entre las personas por color, sexo o idioma por su origen, ni entre hombres y mujeres en cuanto a la dignidad humana; un llamado a la justicia sin importar la religión o el color; el fomento del conocimiento; el trabajo y el esfuerzo por el sustento como deber; la reconciliación entre los musulmanes y el control del transgresor; la solidaridad social; y el desarrollo integral. La declaración instó a que estos principios se plasmaran en políticas y legislación."
