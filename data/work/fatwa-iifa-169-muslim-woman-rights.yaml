label: { ar: "قرار مجمع الفقه الإسلامي الدولي 169 (18/7) بشأن حقوق وواجبات المرأة المسلمة", en: "IIFA resolution 169 (18/7) on the rights and duties of the Muslim woman", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 169 (18/7): مسلم عورت کے حقوق اور فرائض" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩، من نوع القرارات التوصياتية. استحضر مساواة الرجل والمرأة في نصه في استحقاق التكريم وشؤون العقيدة وفرائض العبادات والأمر بالمعروف والعمل الصالح والمسؤولية والجزاء وحق التعليم والتصرفات المالية مع ضوابط، وأن الأصل شمول خطاب التكليف للرجال والنساء إلا ما خص به أحدهما. وقرر: للمرأة أن تملك ما شاءت من العقارات والمنقولات على ضوابط الملكية الشرعية؛ وعملها يخضع لضوابط شرعية وتُشجع في نصه على المجالات «التي تتفوق فيها نظرًا لطبيعتها الخاصة». ثم سرد حقوقًا وواجبات في الأسرة والمجتمع والعمل العام وفق المنظور الذي تبناه المجمع."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007), of the recommendation type. Its preamble asserts the equality of man and woman in entitlement to divine honour, creed, acts of worship, enjoining right, good works, responsibility and recompense, the right to education and financial dealings within controls, and that the address of obligation covers men and women alike except where one is specified. It resolved that the woman may own whatever property she wishes, realty and movables, under the legal rules of ownership; and that her work is subject to legal controls, the text encouraging fields 'in which she excels given her particular nature'. It then enumerated rights and duties in family, society and public work within the frame the Academy adopted."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں، سفارشی نوعیت کی۔ تمہید میں مرد اور عورت کی برابری بیان ہوئی: الٰہی تکریم، عقیدہ، عبادات، نیکی کا حکم، نیک عمل، ذمہ داری اور جزا، تعلیم کا حق اور مالی تصرفات میں ضوابط کے ساتھ؛ اور کہ تکلیف کا خطاب مرد و زن دونوں کو سمیٹتا ہے سوائے اس کے جو کسی ایک کو مخصوص ہو۔ فیصلے: عورت جائز شرعی ضوابط کے تحت جو چاہے عقار اور منقولہ مالک بن سکتی ہے؛ اور اس کا کام شرعی ضوابط کے تابع ہے اور متن ان شعبوں کی ترغیب دیتا ہے 'جن میں وہ اپنی خاص فطرت کے سبب ممتاز ہوتی ہے'۔ پھر خاندان، معاشرے اور عوامی کام میں حقوق و فرائض اسی فریم میں گنوائے گئے۔"
