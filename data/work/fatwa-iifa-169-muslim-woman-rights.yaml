kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 169 (18/7) بشأن حقوق وواجبات المرأة المسلمة", en: "IIFA resolution 169 (18/7) on the rights and duties of the Muslim woman", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 169 (18/7): مسلم عورت کے حقوق اور فرائض", es: "Resolución 169 (18/7) de la IIFA sobre los derechos y deberes de la mujer musulmana.", fr: "Résolution 169 (18/7) de l'IIFA sur les droits et devoirs de la femme musulmane" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩، من نوع القرارات التوصياتية. استحضر مساواة الرجل والمرأة في نصه في استحقاق التكريم وشؤون العقيدة وفرائض العبادات والأمر بالمعروف والعمل الصالح والمسؤولية والجزاء وحق التعليم والتصرفات المالية مع ضوابط، وأن الأصل شمول خطاب التكليف للرجال والنساء إلا ما خص به أحدهما. وقرر: للمرأة أن تملك ما شاءت من العقارات والمنقولات على ضوابط الملكية الشرعية؛ وعملها يخضع لضوابط شرعية وتُشجع في نصه على المجالات «التي تتفوق فيها نظرًا لطبيعتها الخاصة». ثم سرد حقوقًا وواجبات في الأسرة والمجتمع والعمل العام وفق المنظور الذي تبناه المجمع."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007), of the recommendation type. Its preamble asserts the equality of man and woman in entitlement to divine honour, creed, acts of worship, enjoining right, good works, responsibility and recompense, the right to education and financial dealings within controls, and that the address of obligation covers men and women alike except where one is specified. It resolved that the woman may own whatever property she wishes, realty and movables, under the legal rules of ownership; and that her work is subject to legal controls, the text encouraging fields 'in which she excels given her particular nature'. It then enumerated rights and duties in family, society and public work within the frame the Academy adopted."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں، سفارشی نوعیت کی۔ تمہید میں مرد اور عورت کی برابری بیان ہوئی: الٰہی تکریم، عقیدہ، عبادات، نیکی کا حکم، نیک عمل، ذمہ داری اور جزا، تعلیم کا حق اور مالی تصرفات میں ضوابط کے ساتھ؛ اور کہ تکلیف کا خطاب مرد و زن دونوں کو سمیٹتا ہے سوائے اس کے جو کسی ایک کو مخصوص ہو۔ فیصلے: عورت جائز شرعی ضوابط کے تحت جو چاہے عقار اور منقولہ مالک بن سکتی ہے؛ اور اس کا کام شرعی ضوابط کے تابع ہے اور متن ان شعبوں کی ترغیب دیتا ہے 'جن میں وہ اپنی خاص فطرت کے سبب ممتاز ہوتی ہے'۔ پھر خاندان، معاشرے اور عوامی کام میں حقوق و فرائض اسی فریم میں گنوائے گئے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007), de carácter recomendatorio. Su preámbulo afirma la igualdad del hombre y la mujer en el derecho al honor divino, la religión, los actos de culto, el derecho a la observancia, las buenas obras, la responsabilidad y la retribución, el derecho a la educación y a las transacciones financieras dentro de los límites establecidos, y que la obligación abarca por igual a hombres y mujeres, salvo que se especifique lo contrario. Resuelve que la mujer puede poseer cualquier propiedad que desee, tanto inmuebles como muebles, conforme a las normas legales de propiedad; y que su trabajo está sujeto a controles legales, fomentando el desarrollo de áreas «en las que sobresale dada su naturaleza particular». A continuación, enumera los derechos y deberes en la familia, la sociedad y el trabajo público dentro del marco adoptado por la Academia."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, soit 9-14 juillet 2007), de type recommandation. Son préambule affirme l'égalité de l'homme et de la femme quant à leurs droits à l'honneur divin, à la croyance, aux actes de culte, au droit d'ordonner, aux bonnes œuvres, à la responsabilité et à la rétribution, au droit à l'éducation et aux transactions financières encadrées. Elle stipule également que l'obligation de diligence s'applique aux hommes comme aux femmes, sauf mention contraire. La résolution stipule que la femme peut posséder tous les biens qu'elle souhaite, immobiliers et mobiliers, conformément aux règles légales de propriété; et que son travail est soumis à un contrôle légal, le texte encourageant les domaines « où elle excelle compte tenu de sa nature particulière ». Elle énumère ensuite les droits et devoirs au sein de la famille, de la société et dans le cadre de la fonction publique, selon le cadre adopté par l'Académie."
