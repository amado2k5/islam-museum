id: work/fatwa-aliftaa-jo-surgery-under-anaesthesia-while-fasting
class: work
kind: fatwa
label: { ar: "إجراء عملية جراحية تحت التخدير للصائم", en: "Surgery under anaesthesia while fasting", ur: "روزے کی حالت میں بے ہوشی کے تحت آپریشن", es: "Cirugía bajo anestesia en ayunas", fr: "Intervention chirurgicale sous anesthésie générale à jeun", tr: "Oruç tutan kişi için anestezi altında ameliyat yapılması", id: "Melakukan operasi di bawah anestesi untuk orang yang berpuasa" }
summary:
  ar: "سؤال عن إجراء عملية جراحية تحت التخدير للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأن التخدير نفسه لا يفطر بشرط ألا يبقى المريض تحته جميع النهار، لكن قد يحدث في العملية مفطر آخر يوجب القضاء. أجابت الدائرة بأن التخدير نفسه لا يفطر، لأن غازات التخدير ليست ذات جرم، وإبر التخدير تحت الجلد كذلك. واشترطت ألا يمكث المريض جميع النهار تحت التخدير، فإن كان مفيقًا في أول النهار صح صومه، وكذا لو أفاق بعد العملية ولو لحظة قبل الغروب. وقالت إن العملية قد يقع فيها مفطر آخر، كدخول أجسام إلى الجوف، فإن حصل ذلك فعليه القضاء."
  en: "A question about surgery under anaesthesia while fasting, in which Jordan's General Iftaa Department answered that anaesthesia itself does not break the fast, provided the patient is not under it for the whole day, but that another fast-breaking act may occur during the operation and require making the day up. The Department answered that anaesthesia itself does not break the fast, because anaesthetic gases have no physical substance, and anaesthetic injections under the skin are likewise. It set the condition that the patient not remain under anaesthesia for the whole day: if he was awake at the start of the day his fast is valid, and likewise if he wakes after the operation even a moment before sunset. It said that something else that breaks the fast may occur during an operation, such as substances entering the interior, and if that happens he must make the day up."
  ur: "روزے کی حالت میں بے ہوشی کے تحت آپریشن کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بے ہوشی بذات خود روزہ نہیں توڑتی بشرطیکہ مریض پورا دن بے ہوش نہ رہے، لیکن آپریشن میں کوئی اور روزہ توڑنے والی چیز پیش آ سکتی ہے جس سے قضا لازم ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ بے ہوشی بذات خود روزہ نہیں توڑتی، کیونکہ بے ہوشی کی گیسوں کا کوئی جسم نہیں، اور جلد کے نیچے بے ہوشی کے انجکشن بھی ایسے ہی ہیں۔ اس نے شرط رکھی کہ مریض پورا دن بے ہوش نہ رہے: اگر دن کے شروع میں ہوش میں تھا تو روزہ درست ہے، اور اسی طرح اگر آپریشن کے بعد غروب سے ایک لمحہ پہلے بھی ہوش میں آ جائے۔ اس نے کہا کہ آپریشن میں کوئی اور روزہ توڑنے والی چیز پیش آ سکتی ہے، جیسے اجسام کا جوف میں داخل ہونا، اور ایسا ہو تو اس پر قضا ہے۔"
  es: "Una pregunta sobre cirugía bajo anestesia durante el ayuno, a la que el Departamento General de Iftaa de Jordania respondió que la anestesia en sí misma no rompe el ayuno, siempre que el paciente no esté bajo ella durante todo el día, pero que puede ocurrir otro acto que rompa el ayuno durante la operación y requiera recuperar el día. El Departamento explicó que la anestesia en sí no rompe el ayuno porque los gases anestésicos no tienen sustancia física, al igual que las inyecciones de anestesia subcutánea. Estableció la condición de que el paciente no permanezca bajo anestesia durante todo el día: si estaba despierto al comienzo del día, su ayuno es válido, y lo mismo si despierta después de la operación, incluso un momento antes del atardecer. Añadió que puede ocurrir algo más que rompa el ayuno durante una operación, como la entrada de sustancias al organismo, y que si eso sucede, el paciente debe recuperar el día."
  fr: "Une question concernant une intervention chirurgicale sous anesthésie pendant le jeûne a été posée. Le Département général de la Iftaa en Jordanie a répondu que l'anesthésie en elle-même ne rompt pas le jeûne, à condition que le patient ne soit pas anesthésié toute la journée. Cependant, un autre acte rompant le jeûne peut survenir pendant l'opération et nécessiter de rattraper le jour de jeûne. Le Département a expliqué que l'anesthésie en elle-même ne rompt pas le jeûne car les gaz anesthésiques et les injections sous-cutanées sont dépourvus de substance physique. Il a précisé que la condition requise est que le patient ne reste pas anesthésié toute la journée: s'il était éveillé au début de la journée, son jeûne est valide, de même s'il se réveille après l'opération, même juste avant le coucher du soleil. Il a ajouté que d'autres éléments rompant le jeûne peuvent survenir pendant l'opération, comme la pénétration de substances dans l'organisme, et que dans ce cas, le patient doit rattraper le jour de jeûne."
  tr: "Ürdün Genel Fetva Dairesi, oruç tutan bir kişinin anestezi altında ameliyat yapılmasıyla ilgili soruya yanıt verdi; anestezin, hasta tüm gün oruç altında kalmadığı sürece orucu bozmaz, ancak ameliyat sırasında orucu telafi etmeyi gerektiren başka bir kırıcı oluşabilir. Bölüm, anestezinin orucu bozmadığını, çünkü anestezik gazların suç olmadığını ve anestezik iğnelerin de derinin altında olduğunu belirtti. Hastanın tüm gün anestezi altında kalmaması gerektiği; günün erken saatlerinde uyanırsa orucu geçerli sayılır ve ameliyattan sonra gün batımından bir an önce bilinç kazanırsa da geçerlidir. Ameliyat sırasında başka bir kırıcı olabileceği, örneğin cesetlerin boşluğa girmesi gibi durumlar olabileceği; böyle bir durumda orucu telafi etmesi gerektiği belirtildi."
  id: "Pertanyaan tentang melakukan operasi di bawah anestesi untuk orang yang berpuasa dijawab oleh Departemen Fatwa Umum Yordania bahwa anestesi itu sendiri tidak memutus puasa asalkan pasien tidak berada di bawah puasa sepanjang hari, tetapi gangguan lain dapat terjadi selama operasi yang memerlukan kelanjutan puasa. Departemen menjawab bahwa anestesi itu sendiri tidak memutus puasa karena gas anestesi bukanlah sesuatu yang kriminal, dan jarum anestesi juga ada di bawah kulit. Departemen tersebut menetapkan bahwa pasien tidak boleh berada di bawah anestesi sepanjang hari; jika dia bangun pagi-pagi, puasanya sah, dan demikian juga, jika dia sadar kembali setelah operasi bahkan sesaat sebelum matahari terbenam. Dikatakan bahwa gangguan lain mungkin terjadi selama operasi, seperti tubuh yang masuk ke rongga; jika itu terjadi, dia harus mengejar puasa."
