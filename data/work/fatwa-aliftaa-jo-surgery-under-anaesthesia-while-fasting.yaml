id: work/fatwa-aliftaa-jo-surgery-under-anaesthesia-while-fasting
class: work
kind: fatwa
label: { ar: "إجراء عملية جراحية تحت التخدير للصائم", en: "Surgery under anaesthesia while fasting", ur: "روزے کی حالت میں بے ہوشی کے تحت آپریشن" }
summary:
  ar: "سؤال عن إجراء عملية جراحية تحت التخدير للصائم، أجابت فيه دائرة الإفتاء العام الأردنية بأن التخدير نفسه لا يفطر بشرط ألا يبقى المريض تحته جميع النهار، لكن قد يحدث في العملية مفطر آخر يوجب القضاء. أجابت الدائرة بأن التخدير نفسه لا يفطر، لأن غازات التخدير ليست ذات جرم، وإبر التخدير تحت الجلد كذلك. واشترطت ألا يمكث المريض جميع النهار تحت التخدير، فإن كان مفيقًا في أول النهار صح صومه، وكذا لو أفاق بعد العملية ولو لحظة قبل الغروب. وقالت إن العملية قد يقع فيها مفطر آخر، كدخول أجسام إلى الجوف، فإن حصل ذلك فعليه القضاء."
  en: "A question about surgery under anaesthesia while fasting, in which Jordan's General Iftaa Department answered that anaesthesia itself does not break the fast, provided the patient is not under it for the whole day, but that another fast-breaking act may occur during the operation and require making the day up. The Department answered that anaesthesia itself does not break the fast, because anaesthetic gases have no physical substance, and anaesthetic injections under the skin are likewise. It set the condition that the patient not remain under anaesthesia for the whole day: if he was awake at the start of the day his fast is valid, and likewise if he wakes after the operation even a moment before sunset. It said that something else that breaks the fast may occur during an operation, such as substances entering the interior, and if that happens he must make the day up."
  ur: "روزے کی حالت میں بے ہوشی کے تحت آپریشن کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بے ہوشی بذات خود روزہ نہیں توڑتی بشرطیکہ مریض پورا دن بے ہوش نہ رہے، لیکن آپریشن میں کوئی اور روزہ توڑنے والی چیز پیش آ سکتی ہے جس سے قضا لازم ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ بے ہوشی بذات خود روزہ نہیں توڑتی، کیونکہ بے ہوشی کی گیسوں کا کوئی جسم نہیں، اور جلد کے نیچے بے ہوشی کے انجکشن بھی ایسے ہی ہیں۔ اس نے شرط رکھی کہ مریض پورا دن بے ہوش نہ رہے: اگر دن کے شروع میں ہوش میں تھا تو روزہ درست ہے، اور اسی طرح اگر آپریشن کے بعد غروب سے ایک لمحہ پہلے بھی ہوش میں آ جائے۔ اس نے کہا کہ آپریشن میں کوئی اور روزہ توڑنے والی چیز پیش آ سکتی ہے، جیسے اجسام کا جوف میں داخل ہونا، اور ایسا ہو تو اس پر قضا ہے۔"
