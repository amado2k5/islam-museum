summary:
  ar: "موقع دعوي خيري متعدد اللغات تابع لجمعية الدعوة وتوعية الجاليات بحي الربوة في الرياض، يقول إن غايته تبليغ الإسلام إلى الناس بجميع لغاتهم الحية وإيجاد مرجعية مجانية للتعريف به، وتتبعه موسوعات ترجمة معاني القرآن والأحاديث والمصطلحات الإسلامية؛ أقدم لقطة له في أرشيف الإنترنت في ديسمبر 2000."
  en: "A charitable multilingual da'wa website of the Da'wa and Community Awareness Society in the al-Rabwah district of Riyadh, which says its aim is to convey Islam to people in all living languages and to offer a free reference introducing it, with encyclopedias of translated Qur'anic meanings, hadith and Islamic terms; its earliest archived capture is of December 2000."
  ur: "ریاض کے محلہ الربوہ کی جمعیۃ الدعوۃ و توعیۃ الجالیات کی خیراتی کثیر لسانی دعوتی ویب سائٹ، جو کہتی ہے کہ اس کا مقصد اسلام کو تمام زندہ زبانوں میں پہنچانا اور اس کے تعارف کا مفت مرجع فراہم کرنا ہے؛ اس کے ساتھ ترجمۂ معانیِ قرآن، احادیث اور اسلامی اصطلاحات کی موسوعات ہیں؛ سب سے پرانی آرکائیو تصویر دسمبر 2000 کی۔"
