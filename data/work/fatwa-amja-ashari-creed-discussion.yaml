label: { ar: "الأشاعرة وآداب الخلاف العقدي", en: "The Ash'aris and the manners of creedal disagreement", ur: "اشاعرہ اور عقیدے میں اختلاف کے آداب", es: "Los Ash'aris y las formas de desacuerdo doctrinal", fr: "Les Ash'arites et les manières de gérer les désaccords doctrinaux" }
summary:
  ar: "سأل سائل عن رأي أمجد في عقيدة أهل السنة والجماعة الأشاعرة السواد الأعظم وفي من يعتدي عليها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81577 بتاريخ 30 مايو 2010)⁩ أن البغي والاعتداء لا يحل سواء على هذه العقيدة أم على غيرها فبالعدل قامت السماوات والأرض، والأشاعرة أصابوا في أشياء وأخطأوا في أخرى وتناقش الأمور بين أهلها وعلى وجهها وفي إطار التناصح بالبينات والحجج العلمية بعيدًا عن أجواء التراشق بالتهم والمناكر."
  en: "A questioner asked AMJA's view of the creed of the Ash'aris — the great majority of the people of the sunna and the community — and of those who attack it. Dr. Salah al-Sawi (fatwa no. 81577, 30 May 2010) answered that transgression is unlawful whether against this creed or any other — by justice the heavens and earth stand; the Ash'aris got some things right and erred in others, and matters are discussed among their people on their merits, within mutual counsel, with proofs and scholarly arguments and far from the atmosphere of trading accusations and abuse. Recorded as AMJA's answer."
  ur: "ایک سائل نے اشاعرہ کے عقیدے اور اس پر حملہ کرنے والوں کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81577، 30 مئی 2010)⁩ کے مطابق بغی و زیادتی جائز نہیں؛ اشاعرہ بعض باتوں میں درست اور بعض میں خطا پر ہیں اور اختلاف علمی دلائل اور خیر خواہی کے دائرے میں ہونا چاہیے۔"
  es: "Un interlocutor preguntó a AMJA sobre la postura del credo de los ash'aris —la gran mayoría de los seguidores de la sunna y de la comunidad— y sobre quienes lo atacan. El Dr. Salah al-Sawi (fatwa n.º 81577, 30 de mayo de 2010) respondió que la transgresión es ilícita, ya sea contra este credo o contra cualquier otro; por la justicia subsisten los cielos y la tierra. Los ash'aris acertaron en algunos aspectos y se equivocaron en otros, y los asuntos se discuten entre ellos según sus méritos, en consulta mutua, con pruebas y argumentos eruditos, lejos de un ambiente de acusaciones y abusos. Esta respuesta de AMJA quedó registrada."
  fr: "Un internaute a interrogé l'AMJA sur la position de cette dernière concernant la doctrine des Ash'arites — qui représente la grande majorité des sunnites et de la communauté — et sur ceux qui la critiquent. Le Dr Salah al-Sawi (fatwa n° 81577, 30 mai 2010) a répondu que toute transgression est illicite, qu'elle vise cette doctrine ou toute autre — car la justice règne en maître; les Ash'arites ont parfois raison et parfois tort, et les questions sont débattues au sein de leur communauté selon leurs mérites, dans un esprit de concertation, avec des preuves et des arguments savants, loin de tout climat d'accusations et d'injures. Cette réponse a été consignée dans l'AMJA."
