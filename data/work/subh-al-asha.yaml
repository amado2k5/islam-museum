label: { ar: "صبح الأعشى في كتابة الإنشا", en: "Subh al-A'sha fi Kitabat al-Insha", ur: "صبح الاعشیٰ فی کتابۃ الانشا" }
summary:
  ar: "موسوعة أبي العباس أحمد القلقشندي في صناعة كتابة الإنشاء بديوان السلطنة المملوكية، رتّبها على مقدمة وعشر مقالات وخاتمة، وجعلها شرحاً موسّعاً لمقامة أنشأها نحو سنة 791هـ حين استقر في كتابة الإنشاء، مستوعباً ما في «التعريف» لابن فضل الله العمري و«تثقيف التعريف» لابن ناظر الجيش {cite:subh-al-asha-cairo-v1 p.7} {cite:subh-al-asha-cairo-v1 p.8} {cite:subh-al-asha-cairo-v1 p.10}؛ ويُختم بأبواب في البريد والحمام الرسائلي ونقل الثلج والمناور {cite:subh-al-asha-cairo-v14 p.412}."
  en: "Abu al-Abbas Ahmad al-Qalqashandi's encyclopedia of the chancery secretary's craft in the Mamluk sultanate, arranged in an introduction, ten maqalas and a conclusion, written as an expanded commentary on a maqama he composed around 791 AH on joining the chancery, taking in all of Ibn Fadl Allah al-Umari's al-Ta'rif and Ibn Nazir al-Jaysh's Tathqif al-Ta'rif; it ends with chapters on the barid, the pigeon post, the carriage of ice and the beacons."
