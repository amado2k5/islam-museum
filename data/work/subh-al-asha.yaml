structure: "Muqaddima in five babs (merit of writing; meaning of kitaba and insha, preference of prose; qualities and manners of secretaries; the chancery and its officials; its rules); maqala 1: what the secretary needs (sciences, scripts, materials); 2: routes and realms (al-masalik wa-l-mamalik); 3: names, kunyas, titles and the forms of documents; 4: correspondence; 5: appointments (wilayat); 6: religious charges, remissions, grants, tarkhanas, change of fiscal year, memoranda; 7: iqta' grants; 8: oaths; 9: peace treaties and their annulment; 10: other kinds of writing outside the diwans; khatima: barid stations, pigeon-post routes and towers, ice convoys from Syria, beacons and crop-burnings (vol. 14 pp. 389-401). Plan in vol. 1 pp. 10-30."
