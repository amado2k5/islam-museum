label:
  ar: "برنامج مذكرات إبليس"
  en: "Mudhakkirat Iblis (Memoirs of Iblis) programme"
  ur: "پروگرام مذکرات ابلیس"
summary:
  ar: "برنامج رمضاني لعمر عبد الكافي يتخيل فيه الإنسان إبليس يكتب مذكراته، ليكشف من لسانه مداخله إلى النفس وحيله وما يغري به الناس، ثم يعرض سبل الوقاية منه، وفق تسجيلات أسبابيل."
  en: "A Ramadan programme by Omar Abdelkafy that imagines Iblis writing his memoirs, as a device for exposing the ways he approaches the soul and the tricks he uses, and then sets out how to guard against them, as recorded in the Assabile archive."
  ur: "عمر عبد الکافی کا رمضان کا پروگرام جس میں وہ ابلیس کے اپنی یادداشتیں لکھنے کا تصور باندھتے ہیں تاکہ اس کی زبان سے نفس میں اس کے داخل ہونے کے راستے اور اس کی چالیں سامنے آئیں، پھر ان سے بچاؤ کی راہیں بیان کرتے ہیں، اسابیل کے ذخیرے کے مطابق۔"
