label: { ar: "قرار مجمع الفقه الإسلامي الدولي 175 (19/1) بشأن الحرية الدينية في الشريعة الإسلامية: أبعادها وضوابطها", en: "IIFA resolution 175 (19/1) on religious freedom in Islamic law: its dimensions and controls", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 175 (19/1): شریعتِ اسلامی میں مذہبی آزادی — اس کے ابعاد اور ضوابط", es: "Resolución 175 (19/1) de la IIFA sobre la libertad religiosa en el derecho islámico: sus dimensiones y controles.", fr: "Résolution 175 (19/1) de l'IIFA sur la liberté religieuse en droit islamique: ses dimensions et ses contrôles", tr: "Uluslararası İslami Fiqh Akademisi Kararı 175 (19/1) İslami Şeriatta Dini Özgürlük: Boyutları ve Kontrolleri", id: "Resolusi Akademi Fiqh Islam Internasional 175 (19/1) tentang Kebebasan Beragama dalam Syariah Islam: Dimensi dan Kontrolnya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. قرر المجمع في نصه: أن الحرية الدينية مبدأ مقرر في الشريعة الإسلامية ينطلق من الفطرة ويقترن بالمسؤولية وغايتها تحقيق الكرامة الإنسانية؛ وأنها مكفولة في المجتمع مع صيانتها مما وصفه بالأفكار الوافدة التي تستهدف الهوية الإسلامية؛ وأن المسلمين يلتزمون مبدأ عدم الإكراه في الدين ومارسوا عبر التاريخ التسامح مع من عاش في ظل الدولة الإسلامية، داعيًا في المقابل إلى احترام الخصوصيات الإسلامية ووقف ما سماه التطاول على المقدسات؛ وأن التنوع المذهبي حالة طبيعية والتعاون بين المسلمين على اختلاف مذاهبهم واجب؛ وأن إثارة الشكوك في «المسلمات والثوابت» خطر على المجتمع يستوجب الردع؛ وأن الفتوى بالردة أو التكفير مردها إلى أهل العلم المعتبرين مع تولي القضاء الاستتابة وإزالة الشبهات؛ وأن «المجاهرة بالردة» تشكل في رأي المجمع خطرًا على وحدة المجتمع يستحق صاحبها عقوبة ينزلها القضاء، مع قوله إن ذلك لا يتنافى مع الحرية الدينية لمن يحترم المشاعر الدينية والنظام العام. وأوصى الحكومات بتوفير حاجات المجتمع الرئيسة ومنها الحرية المسؤولة والغذاء والسكن والعلاج والتعليم وفرص العمل."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). In the Academy's own text: religious freedom is an established principle of Islamic law, rooted in human nature, joined to responsibility, and aimed at human dignity; it is guaranteed in society while being guarded against what it calls imported ideas targeting Islamic identity; Muslims uphold the principle of no compulsion in religion and historically practised tolerance toward those living under Islamic rule, while the resolution calls in return for respect for Islamic sensibilities and an end to what it terms affronts to the sacred; doctrinal diversity among Muslims is natural and cooperation across schools a duty; raising doubts about 'established fundamentals' is a danger warranting deterrence; fatwas of apostasy or excommunication belong to recognised scholars, with the courts handling the repentance procedure and removal of doubts the jurists stipulate; and 'publicly proclaimed apostasy' is, in the Academy's view, a danger to social unity whose perpetrator merits a court-imposed penalty — which it states does not conflict with religious freedom for those who respect religious feelings and public order. It recommends governments supply society's chief needs, including responsible freedom, food, housing, medical care, education and employment."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اکیڈمی کے اپنے متن کے مطابق: مذہبی آزادی شریعتِ اسلامی کا مقررہ اصول ہے جو فطرت سے نکلتا ہے، ذمہ داری سے جڑا ہے اور انسانی وقار کو مقصود رکھتا ہے؛ یہ معاشرے میں محفوظ ہے مگر اسے اُن آمدہ افکار سے بچانا ہے جو اکیڈمی کے بقول اسلامی شناخت کو نشانہ بناتی ہیں؛ مسلمان دین میں جبر نہ ہونے کے اصول کے پابند ہیں اور تاریخ بھر اسلامی ریاست کے زیرِ سایہ رہنے والوں کے ساتھ رواداری برتتے آئے ہیں، جب کہ قرارداد بدلے میں اسلامی تقدسات کے احترام اور اقدسات کے خلاف بے ادبی کے سدِ باب کا مطالبہ کرتی ہے؛ مسلمانوں کے مذہبی اختلافات فطری ہیں اور مذاہب کے باوجود تعاون شرعی فرض ہے؛ 'معلوم بالضرورہ ثوابت' کے بارے میں شکوک پھیلانا معاشرے کے لیے خطرہ ہے جس کی روک تھام واجب ہے؛ ردت یا تکفیر کی فتویٰ مستند اہلِ علم کا اختیار ہے اور عدالت استتابہ اور شبہات کے ازالے کا فقہی نظام سنبھالتی ہے؛ اور 'علانیہ ارتداد' اکیڈمی کے نزدیک معاشرتی وحدت کے لیے خطرہ ہے جس کا مرتکب عدالتی سزا کا مستحق ہے — اگرچہ متن کہتا ہے کہ یہ مذہبی آزادی سے متصادم نہیں جو مذہبی جذبات اور عوامی نظم کا احترام کرے۔ سفارش میں حکومتوں سے معاشرے کی بنیادی ضروریات — ذمہ دارانہ آزادی، خوراک، رہائش، علاج، تعلیم اور روزگار — فراہم کرنے کا مطالبہ کیا گیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009). En el propio texto de la Academia: la libertad religiosa es un principio establecido del derecho islámico, arraigado en la naturaleza humana, unido a la responsabilidad y orientado a la dignidad humana; está garantizada en la sociedad mientras se protege contra lo que llama ideas importadas que atacan la identidad islámica; los musulmanes defienden el principio de no coacción en la religión y la tolerancia históricamente practicada hacia quienes viven bajo el dominio islámico, mientras que la resolución pide a cambio respeto por las sensibilidades islámicas y el fin de lo que denomina afrentas a lo sagrado; la diversidad doctrinal entre los musulmanes es natural y la cooperación entre escuelas un deber; plantear dudas sobre los \"fundamentos establecidos\" es un peligro que justifica la disuasión; las fatuas de apostasía o excomunión pertenecen a eruditos reconocidos, y los tribunales manejan el procedimiento de arrepentimiento y la eliminación de las dudas que estipulan los juristas; La «apostasía públicamente proclamada» es, a juicio de la Academia, un peligro para la unidad social cuyo autor merece una sanción judicial, la cual, según afirma, no entra en conflicto con la libertad religiosa de quienes respetan los sentimientos religiosos y el orden público. Recomienda que los gobiernos satisfagan las necesidades básicas de la sociedad, incluyendo la libertad responsable, la alimentación, la vivienda, la atención médica, la educación y el empleo."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009). Selon le texte de l'Académie: la liberté religieuse est un principe fondamental du droit islamique, ancré dans la nature humaine, indissociable de la responsabilité et visant à préserver la dignité humaine; elle est garantie dans la société tout en étant protégée contre ce qu'elle qualifie d'idées importées ciblant l'identité islamique; les musulmans défendent le principe de non-contrainte en matière de religion et ont toujours pratiqué la tolérance envers ceux qui vivent sous domination islamique, tandis que la résolution appelle en contrepartie au respect des sensibilités islamiques et à la fin de ce qu'elle considère comme des affronts au sacré; la diversité doctrinale parmi les musulmans est naturelle et la coopération entre les écoles un devoir; remettre en question les « fondements établis » constitue un danger justifiant la dissuasion; les fatwas d'apostasie ou d'excommunication relèvent de la compétence des savants reconnus, les tribunaux étant chargés de la procédure de repentir et de la levée des doutes stipulés par les juristes. L’« apostasie proclamée publiquement » constitue, de l’avis de l’Académie, un danger pour l’unité sociale dont l’auteur mérite une sanction judiciaire. L’Académie précise que cette sanction n’est pas incompatible avec la liberté religieuse pour ceux qui respectent les convictions religieuses et l’ordre public. Elle recommande aux gouvernements de subvenir aux besoins fondamentaux de la société, notamment en matière de liberté responsable, d’alimentation, de logement, de soins médicaux, d’éducation et d’emploi."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dokuzuncu oturumunda (1–5 Cumada-el-Awwal 1430 H, 26–30 Nisan 2009) toplu kararı. Konsey metninde şöyle karar verdi: dini özgürlüğün, İslami Şeriat'ta doğuştan gelen doğaya dayanan, sorumluluğa bağlı bir ilke olduğu, amacının insan onuruna ulaşmak olduğu; toplumda garanti altına alındığını, ancak İslami kimliği hedef alan ithal fikirlerin korunduğunu; Müslümanların dinde zorlama ilkesine bağlı kaldığını ve tarihsel olarak İslam devleti altında yaşayanlara hoşgörü gösterdiklerini belirtti. Karşılığında, İslami özgünlüklere saygı gösterilmesini ve kutsal yerlere yapılan müdahaleye son verilmesini; mezhepsel çeşitliliğin doğal bir durum olduğunu ve Müslümanlar arasında iş birliğini talep etti Farklı mezheplerine rağmen zorunludur; \"yerleşik ilkeler ve sabitler\" hakkında şüphe uyandırmak, toplum için caydırıcılık gerektiren bir tehlikedir; dinden dönme veya tekfir ilan eden fetvaların saygın alimlere bağlı olduğu, yargının ise tövbe ve şüpheleri ortadan kaldırma rolünü üstlendiği; ve Akademi'nin görüşüne göre, \"açıkça dinden dönmek\"in, yargı tarafından cezalandırılması gereken toplum birliğine tehlike oluşturduğu, ancak dini duygulara ve kamu düzenine saygı gösterenler için dini özgürlükle çelişmediği belirtilmektedir. Hükümetlerin toplumun temel ihtiyaçlarını karşılamasını tavsiye etti; bunlar arasında sorumlu özgürlük, gıda, konut, sağlık hizmetleri, eğitim ve iş fırsatları yer alıyordu."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430 H, 26–30 April 2009 M). Dewan memutuskan dalam teksnya: bahwa kebebasan beragama adalah prinsip yang ditetapkan dalam Syariah Islam yang didasarkan pada sifat bawaan, terkait dengan tanggung jawab, dan tujuannya adalah mencapai martabat manusia; bahwa kebebasan itu dijamin dalam masyarakat sambil mempertahankan apa yang digambarkan sebagai gagasan impor yang menargetkan identitas Islam; bahwa Muslim mematuhi prinsip non-koersi dalam agama dan secara historis menerapkan toleransi terhadap mereka yang hidup di bawah negara Islam. Sebagai imbalannya, Dewan menyerukan penghormatan terhadap kekhasan Islam dan mengakhiri apa yang disebut pelanggaran terhadap situs suci; bahwa keberagaman sektarian adalah keadaan alami dan kerja sama antar Muslim Meskipun memiliki sekte yang berbeda, fatwa ini wajib; menimbulkan keraguan tentang \"prinsip dan konstanta yang sudah mapan\" adalah bahaya bagi masyarakat yang memerlukan pencegahan; bahwa fatwa yang menyatakan murtad atau takfir disebabkan oleh para sarjana terkemuka, dengan peradilan mengambil peran pertobatan dan menghilangkan keraguan; dan bahwa \"secara terbuka menyatakan murtad\" menurut Akademi merupakan bahaya bagi persatuan masyarakat yang pelakunya layak mendapat hukuman dari peradilan, sambil menyatakan bahwa hal ini tidak bertentangan dengan kebebasan beragama bagi mereka yang menghormati sentimen agama dan ketertiban umum. Ia merekomendasikan agar pemerintah memenuhi kebutuhan utama komunitas, termasuk kebebasan yang bertanggung jawab, makanan, perumahan, layanan kesehatan, pendidikan, dan peluang kerja."
