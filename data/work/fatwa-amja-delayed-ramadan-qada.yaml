id: work/fatwa-amja-delayed-ramadan-qada
class: work
kind: fatwa
label: { ar: "تأخير قضاء رمضان", en: "Post-natal fasting debt carried past the next Ramadan", ur: "نفاس کا قرض اگلے رمضان تک" }
summary:
  ar: "سألت امرأة أنها كانت نفساء في رمضان 2010 ففطرت الشهر كله وعوضت جزءًا منه قبل رمضان الموالي وبقي عليها قضاء. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86770 بتاريخ 22 أبريل 2012)⁩ أنه إن كان تأخير القضاء حتى أدركها رمضان آخر لعذر فلا إثم عليها ولا فدية ولكن يلزمها القضاء عند أول قدرة وفي صيام الفريضة يجب تبييت النية من الليل على ما فصّل الجواب."
  en: "A woman was in post-natal bleeding through Ramadan 2010, broke the whole month and made up part before the next Ramadan, the rest still owed. AMJA's fatwa committee (fatwa no. 86770, 22 April 2012) answered that if delaying the makeup until another Ramadan came was for an excuse, no sin and no fidya is on her — but she must make it up at first ability, and for an obligatory fast the intention must be settled overnight — as the answer details."
  ur: "نفاس کی قضاء مؤخر؟ لجنة الفتوى ⁦(فتویٰ 86770، 22 اپریل 2012)⁩ کے مطابق عذر ہو تو نہ گناہ نہ فدیہ؛ پہلی استطاعت پر قضاء، رات کو نیت۔"
