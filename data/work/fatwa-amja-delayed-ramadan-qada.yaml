id: work/fatwa-amja-delayed-ramadan-qada
class: work
kind: fatwa
label: { ar: "تأخير قضاء رمضان", en: "Post-natal fasting debt carried past the next Ramadan", ur: "نفاس کا قرض اگلے رمضان تک", es: "Deuda de ayuno posparto que se arrastra más allá del siguiente Ramadán.", fr: "Les dettes de jeûne postnatal sont reportées au-delà du Ramadan suivant.", tr: "Ramazan Namazının Gecikmesi", id: "Penundaan Salat Ramadan yang Terlewat" }
summary:
  ar: "سألت امرأة أنها كانت نفساء في رمضان 2010 ففطرت الشهر كله وعوضت جزءًا منه قبل رمضان الموالي وبقي عليها قضاء. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86770 بتاريخ 22 أبريل 2012)⁩ أنه إن كان تأخير القضاء حتى أدركها رمضان آخر لعذر فلا إثم عليها ولا فدية ولكن يلزمها القضاء عند أول قدرة وفي صيام الفريضة يجب تبييت النية من الليل على ما فصّل الجواب."
  en: "A woman was in post-natal bleeding through Ramadan 2010, broke the whole month and made up part before the next Ramadan, the rest still owed. AMJA's fatwa committee (fatwa no. 86770, 22 April 2012) answered that if delaying the makeup until another Ramadan came was for an excuse, no sin and no fidya is on her — but she must make it up at first ability, and for an obligatory fast the intention must be settled overnight — as the answer details."
  ur: "نفاس کی قضاء مؤخر؟ لجنة الفتوى ⁦(فتویٰ 86770، 22 اپریل 2012)⁩ کے مطابق عذر ہو تو نہ گناہ نہ فدیہ؛ پہلی استطاعت پر قضاء، رات کو نیت۔"
  es: "Una mujer sufrió sangrado posparto durante el Ramadán de 2010, interrumpió el mes completo y recuperó parte antes del siguiente Ramadán, quedando pendiente el resto. El comité de fatwas de AMJA (fatwa n.° 86770, 22 de abril de 2012) respondió que si el aplazamiento de la recuperación hasta el siguiente Ramadán fue una excusa, no incurrió en pecado ni en fidya, pero debía recuperar el tiempo perdido en cuanto pudiera, y para un ayuno obligatorio la intención debía quedar establecida de un día para otro, como se detalla en la respuesta."
  fr: "Une femme a souffert d'hémorragie post-partum pendant le Ramadan 2010. Elle a interrompu son jeûne pendant tout le mois et en a rattrapé une partie avant le Ramadan suivant, le reste restant dû. Le comité de fatwas de l'AMJA (fatwa n° 86770, 22 avril 2012) a répondu que si le report du rattrapage jusqu'au Ramadan suivant constituait une excuse, elle n'avait commis ni péché ni fidya, mais qu'elle devait rattraper le jeûne dès que possible. De plus, pour un jeûne obligatoire, l'intention devait être prise pendant la nuit, comme le précise la réponse."
  tr: "Bir kadına 2010 Ramazan ayında doğum sonrası kanaması olduğunu sordum, bu yüzden tüm ay boyunca orucunu bozdu ve bir kısmını ertesi Ramazan'dan önce telafi etti, yine de kaçırdığı namazları telafi etmek zorundaydı. Amerikan Şeriat Hukukçuları Akademisi Fetva Komitesi (22 Nisan 2012 tarihli Fetva No. 86770), kaçırılan oruçun başka bir Ramazan ona ulaşana kadar ertelenmesi halinde günah veya fidya olmadığını, ancak en kısa sürede orucu telafi etmek zorunda olduğunu yanıtladı. Zorunlu namazın oruç tutulurken, niyet cevabında detaylandırıldığı üzere gece gece yapılmalıdır."
  id: "Saya bertanya kepada seorang wanita bahwa dia mengalami pendarahan pasca melahirkan selama Ramadan 2010, jadi dia berbuka puasa selama sebulan penuh dan menebus sebagian sebelum Ramadan berikutnya, dan dia masih harus mengejar salat yang terlewat. Komite Fatwa di American Academy of Sharia Jurists (Fatwa No. 86770 tanggal 22 April 2012) menanggapi bahwa jika puasa yang terlewat ditunda sampai Ramadan lain sampai kepadanya karena alasan, tidak ada dosa atau fidya yang ditanggung olehnya, tetapi dia wajib menebus puasa secepat mungkin. Dalam berpuasa salat wajib, niatnya harus dilakukan semalam di malam hari, seperti yang dijelaskan dalam jawaban."
