summary:
  ar: "إرشادات أصدرها المجلس الفقهي لأمريكا الشمالية ⁦(16 مارس 2020، إعداد الدكتور ذو الفقار علي شاه)⁩ لوباء كورونا تتضمن توصية كبار السن وأمهات الصغار والأطفال وأصحاب الأعراض بالامتناع عن ارتياد المساجد على ما نصّت عليه الإرشادات."
  en: "Guidelines issued by the Fiqh Council of North America (16 March 2020, prepared by Dr. Zulfiqar Ali Shah) for the coronavirus epidemic, recommending that the elderly, mothers with small children, children and the symptomatic stop attending mosques — as the guidelines set out."
  ur: "فقہ کونسل آف نارتھ امریکہ کی ہدایات ⁦(16 مارچ 2020، تیاری: ڈاکٹر ذوالفقار علی شاہ)⁩ کورونا وبا کے لیے، جن میں بزرگوں چھوٹے بچوں اور علامات والوں کو مسجد نہ آنے کی سفارش ہے — جیسا کہ ہدایات میں ہیں۔"
  es: "Directrices emitidas por el Consejo de Jurisprudencia Islámica de Norteamérica (16 de marzo de 2020, elaboradas por el Dr. Zulfiqar Ali Shah) para la epidemia de coronavirus, que recomiendan que las personas mayores, las madres con niños pequeños, los niños y las personas sintomáticas dejen de asistir a las mezquitas, tal como se establece en las directrices."
  fr: "Les directives publiées par le Conseil Fiqh d'Amérique du Nord (16 mars 2020, préparées par le Dr Zulfiqar Ali Shah) concernant l'épidémie de coronavirus recommandent aux personnes âgées, aux mères avec de jeunes enfants, aux enfants et aux personnes présentant des symptômes de cesser de fréquenter les mosquées, conformément aux directives."
