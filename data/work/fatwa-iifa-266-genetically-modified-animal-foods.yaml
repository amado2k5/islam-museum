label: { ar: "قرار مجمع الفقه الإسلامي الدولي 266 (11/26) بشأن الأغذية المحورة وراثيًا من أصل حيواني", en: "IIFA resolution 266 (11/26) on genetically modified foods of animal origin", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 266 (11/26): حیوانی اصل کی جینیاتی طور پر تبدیل شدہ غذائیں" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي أباح استهلاك الأغذية المحورة وراثيًا من أصل حيواني بثلاثة ضوابط. عرّف المجمع هذه الأغذية بأنها منتجات تُستخلص من حيوانات حية عُدّلت مادتها الوراثية بالهندسة الجينية، بإدخال جينات من حيوانات أخرى أو حذف جينات أو تعديلها أو إعادة ترتيبها. وذكر أن غاية التحوير زيادة مقاومة الحيوان للآفات وتحسين قيمته الغذائية وتسريع نموه أو تكييفه مع بيئات معينة. وأباح استهلاكها بشروط: أن يجري التحوير بطرق آمنة غير مخالفة للشرع ولا مضرة بالصحة، وأن يكون بين حيوانين يباح أكلهما، وأن يُفصح عن المعلومات اللازمة عن الغذاء المحور وطريقة إعداده."
  en: "A collective resolution of the International Islamic Fiqh Academy permitting genetically modified foods of animal origin under three conditions. The Academy defined these foods as products taken from living animals whose genetic material has been altered by genetic engineering, by inserting genes from other animals or by deleting, modifying or rearranging genes. It noted that the aims of such modification are to make the animal more resistant to disease, improve its nutritional value, speed its growth or adapt it to particular environments. It permitted consuming them on conditions: the modification is done by safe methods that neither contravene the sharia nor harm health; it takes place between two animals that are lawful to eat; and the necessary information about the modified food and how it was produced is disclosed."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جس نے تین شرائط کے ساتھ حیوانی اصل کی جینیاتی طور پر تبدیل شدہ غذاؤں کو جائز قرار دیا۔ اکیڈمی نے ان غذاؤں کی تعریف ایسی مصنوعات سے کی جو ان زندہ جانوروں سے حاصل ہوں جن کا جینیاتی مادہ جینیاتی انجینئرنگ سے بدلا گیا ہو، دوسرے جانوروں کے جین داخل کر کے یا جین حذف، تبدیل یا از سرِ نو ترتیب دے کر۔ اس نے ذکر کیا کہ اس تبدیلی کا مقصد جانور کی بیماریوں کے خلاف مزاحمت بڑھانا، غذائی قدر بہتر کرنا، نشوونما تیز کرنا یا اسے خاص ماحول کے مطابق ڈھالنا ہے۔ اس نے شرائط کے ساتھ انہیں کھانے کی اجازت دی: تبدیلی محفوظ طریقوں سے ہو جو شریعت کے خلاف اور صحت کے لیے مضر نہ ہوں؛ یہ دو ایسے جانوروں کے درمیان ہو جن کا کھانا جائز ہے؛ اور تبدیل شدہ غذا اور اس کی تیاری کے طریقے کی ضروری معلومات ظاہر کی جائیں۔"
