id: work/fatwa-aliftaa-jo-zakat-left-unpaid-into-a-second-year
class: work
kind: fatwa
label: { ar: "زكاة لم تُخرج حتى حال حول آخر", en: "Zakat left unpaid until a second year passes", ur: "زکات جو دوسرا سال گزرنے تک ادا نہ ہوئی" }
summary:
  ar: "سؤال عمن ملك نصابًا ولم يزكه حتى حال حول آخر، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة تجب على الفور ويأثم من أخرها بلا عذر، وأن مقدار الزكاة الواجبة لا يزكى مرة أخرى بل يُطرح من وعاء العام التالي. أجابت الدائرة بأن الزكاة عبادة مالية مفروضة تجب فورًا من يوم وجوبها لأنها حق للفقراء، وأن من أخرها بغير عذر أثم وصار ضامنًا لها، ونقلت قول النووي في المجموع بذلك. وقالت إن المال المفصول المحفوظ زكاةً لا تجب فيه الزكاة مرة أخرى لأنه صار ملكًا للفقراء، مع إثم المزكي بالتأخير إن تمكن ولم يخرجه. ونقلت قول أبي إسحاق الشيرازي في المهذب إن من عنده نصاب وجبت فيه الزكاة فلم يؤدها حتى حال حول آخر لم تجب عليه زكاة الحول الثاني في ذلك المقدار، لأن الفقراء ملكوا قدر الفرض من النصاب. وخلصت إلى أن المال الواجب إخراجه زكاةً لا تجب فيه الزكاة مرة أخرى، فيُجنب مقدار الزكاة كل عام ويُحسم من وعاء المال في العام الذي يليه."
  en: "A question about someone who held the zakat minimum and did not pay until another year passed, in which Jordan's General Iftaa Department answered that zakat is due immediately and delaying it without excuse is a sin, and that the amount already due is not zakated again but is deducted from the following year's base. The Department answered that zakat is an obligatory financial act of worship that must be paid immediately from the day it falls due, because it is the right of the poor, and that whoever delays it without excuse sins and becomes liable for it, quoting al-Nawawi in al-Majmu to that effect. It said that money set aside and kept as zakat is not subject to zakat again, because it has become the property of the poor, though the payer sins by delaying if he was able to pay and did not. It quoted Abu Ishaq al-Shirazi in al-Muhadhdhab that someone holding a minimum on which zakat fell due, who did not pay until another year passed, owes no second year's zakat on that amount, because the poor came to own the due share of the minimum. It concluded that the amount due as zakat is not zakated again: each year's zakat is set aside and deducted from the wealth's base in the following year."
  ur: "ایسے شخص کے بارے میں سوال جو نصاب کا مالک تھا اور دوسرا سال گزرنے تک زکات ادا نہ کی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکات فوراً واجب ہوتی ہے اور بلا عذر تاخیر گناہ ہے، اور واجب شدہ مقدار پر دوبارہ زکات نہیں بلکہ وہ اگلے سال کے حساب سے منہا ہوگی۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات فرض مالی عبادت ہے جو واجب ہونے کے دن سے فوراً ادا کرنی ہوتی ہے کیونکہ یہ فقرا کا حق ہے، اور جو بلا عذر تاخیر کرے وہ گناہ گار اور اس کا ضامن ہے؛ اس نے اس پر المجموع میں نووی کا قول نقل کیا۔ اس نے کہا کہ جو مال زکات کے طور پر الگ کر کے رکھا گیا اس پر دوبارہ زکات واجب نہیں کیونکہ وہ فقرا کی ملکیت بن چکا، البتہ اگر قدرت کے باوجود ادا نہ کیا تو تاخیر کا گناہ ہے۔ اس نے المہذب میں ابو اسحاق شیرازی کا قول نقل کیا کہ جس کے پاس ایسا نصاب ہو جس پر زکات واجب ہوئی اور اس نے دوسرا سال گزرنے تک ادا نہ کی، اس پر اس مقدار میں دوسرے سال کی زکات واجب نہیں، کیونکہ فقرا نصاب میں سے فرض کی مقدار کے مالک ہو گئے۔ اس نے نتیجہ نکالا کہ زکات میں واجب مقدار پر دوبارہ زکات نہیں: ہر سال کی زکات الگ کی جائے اور اگلے سال مال کے حساب سے منہا کی جائے۔"
