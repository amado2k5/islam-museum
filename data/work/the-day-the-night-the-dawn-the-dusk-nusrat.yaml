summary:
  ar: "ألبوم قوالي لنصرت فتح علي خان صدر عن شاناشي بثلاث مقطوعات طويلة من تأليفه، منها «Halka Halka Suroor» و«Mera Piya Ghar Aaya»؛ تؤرخه المقالة بسنة 1991 وويكي بيانات بسنة 1990، وكتبت عنه واشنطن بوست أن كلماته تجمع التصوف وشؤون القلب."
  en: "A qawwali album by Nusrat Fateh Ali Khan on Shanachie, with three long pieces of his own, among them 'Halka Halka Suroor' and 'Mera Piya Ghar Aaya'; the article dates it 1991 and Wikidata 1990, and The Washington Post wrote that its lyrics embrace both Sufi mysticism and matters of the heart."
  ur: "نصرت فتح علی خان کا قوالی البم، شاناشی سے تین طویل کلاموں کے ساتھ، جن میں «ہلکا ہلکا سرور» اور «میرا پیا گھر آیا» شامل ہیں؛ مضمون اسے 1991 اور ویکی ڈیٹا 1990 کا بتاتا ہے۔"
