class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 2: أهمية معرفة الأنساب في السيرة النبوية"
  en: "The Biography of the Messenger of God 2026, episode 2: The Importance of Knowing Lineages in the Prophet's Biography"
  ur: "سیرتِ رسول اللہ 2026، قسط 2: سیرتِ نبوی میں انساب کے علم کی اہمیت"
  fr: "La biographie du Messager de Dieu 2026, épisode 2 : L'importance de connaître les généalogies dans la biographie du Prophète"
  es: "La biografía del Mensajero de Dios 2026, episodio 2: La importancia de conocer los linajes en la biografía del Profeta"
summary:
  ar: "يرى المتحدث أن معرفة أنساب العرب وقريش لازمة لقراءة كتب الحديث والسير الأولى، مستندا إلى ابن حزم والطبري وأبواب كثيرة من صحيح البخاري، ويتتبع نسب النبي إلى عدنان. ثم ينتقل إلى الأخبار عن النبي قبل البعثة عند أهل الكتاب والكهان والجن، ويختم بقصة سلمان الفارسي."
  en: "The speaker argues that knowing Arab and Qurayshi lineages is needed to read the hadith collections and the early biographies, drawing on Ibn Hazm, al-Tabari and many chapters of al-Bukhari, and traces the Prophet's line to Adnan. He then turns to reports of the Prophet before his mission among scripture people, soothsayers and the jinn, closing with the story of Salman al-Farisi."
  ur: "مقرر کی دلیل ہے کہ عرب اور قریش کے انساب کا علم کتبِ حدیث اور ابتدائی سیرت کی کتابیں پڑھنے کے لیے ضروری ہے، اور وہ ابن حزم، طبری اور صحیح بخاری کے کئی ابواب سے استفادہ کرتے ہوئے نبی کا نسب عدنان تک بیان کرتے ہیں۔ پھر وہ بعثت سے پہلے اہلِ کتاب، کاہنوں اور جنوں کے ہاں نبی کے بارے میں اخبار کا ذکر کرتے ہیں، اور سلمان فارسی کی کہانی پر اختتام کرتے ہیں۔"
  fr: "Le conférencier soutient que connaître les généalogies des Arabes et de Quraysh est nécessaire pour lire les recueils de hadiths et les premières biographies, en s'appuyant sur Ibn Hazm, al-Tabari et de nombreux chapitres d'al-Bukhari, et il retrace la lignée du Prophète jusqu'à Adnan. Il passe ensuite aux récits sur le Prophète avant sa mission chez les gens du Livre, les devins et les djinns, et conclut avec l'histoire de Salman al-Farisi."
  es: "El conferenciante sostiene que conocer los linajes de los árabes y de los Quraysh es necesario para leer las colecciones de hadices y las primeras biografías, apoyándose en Ibn Hazm, al-Tabari y muchos capítulos de al-Bukhari, y traza la línea del Profeta hasta Adnan. Luego pasa a los relatos sobre el Profeta antes de su misión entre la gente de las Escrituras, los adivinos y los genios, y concluye con la historia de Salman al-Farisi."
