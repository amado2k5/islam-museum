summary:
  ar: "كتاب بالإنجليزية لويندي شو عن إدراك الفنون في الخطاب الإسلامي التاريخي، صدر عن مطبعة جامعة كامبريدج سنة 2019، ونال تنويه جائزة ألبرت حوراني للكتاب سنة 2020."
  en: "An English book by Wendy M. K. Shaw on the perception of the arts in the discourse of historical Islam, published by Cambridge University Press in 2019; it received the Honorable Mention of the 2020 Albert Hourani Book Award."
  ur: "وینڈی شا کی انگریزی کتاب جو تاریخی اسلام کے فکری مباحث میں فنون کے ادراک پر ہے؛ کیمبرج یونیورسٹی پریس سے 2019ء میں شائع ہوئی اور 2020ء میں البرٹ حورانی بک ایوارڈ کا اعزازی تذکرہ پایا۔"
  fr: "What Is “Islamic” Art? Between Religion and Perception de Wendy M. K. Shaw explore la perception des arts, dont la peinture, la musique et la géométrie, à travers la sphère discursive de l'islam historique : Coran, hadith, soufisme, philosophie antique et poésie. Selon la présentation de l'éditeur, le livre a commencé comme une exploration de l'image en islam et s'est achevé en cherchant comment, en renonçant à des notions comme l'image et l'art, penser la perception à travers l'islam."
  es: "What Is “Islamic” Art? Between Religion and Perception, de Wendy M. K. Shaw, explora la percepción de las artes, entre ellas la pintura, la música y la geometría, a través de la esfera discursiva del islam histórico: el Corán, el hadiz, el sufismo, la filosofía antigua y la poesía. Según la presentación de la editorial, el libro empezó como una exploración de la imagen en el islam y terminó explorando cómo, dejando de lado conceptos como imagen y arte, pensar la percepción a través del islam."
  tr: "What Is “Islamic” Art? Between Religion and Perception, Wendy Shaw'un resim, musiki ve geometri dahil sanatların algılanışını Kur'an, hadis, tasavvuf, antik felsefe ve şiir gibi tarihî İslam'ın söylem alanı üzerinden inceleyen kitabıdır. Yayıncının tanıtımına göre kitap İslam'da imgeye dair bir araştırma olarak başlamış, imge ve sanat kavramlarını bir kenara bırakarak algının İslam üzerinden nasıl kavranabileceğini araştırmaya varmıştır."
  id: "What Is “Islamic” Art? Between Religion and Perception karya Wendy Shaw mengkaji persepsi atas seni, termasuk lukisan, musik, dan geometri, melalui ranah wacana Islam historis, termasuk Al-Qur'an, hadis, tasawuf, filsafat kuno, dan puisi. Menurut deskripsi penerbit, buku ini bermula sebagai penjelajahan tentang citra dalam Islam dan berakhir dengan menelusuri bagaimana persepsi dapat dipahami melalui Islam tanpa bertolak dari konsep citra dan seni."
