label:
  ar: "قصة وفكرة ⁦(برنامج تلفزيوني)⁩"
  en: "Qissa wa-Fikra, A Story and an Idea (television programme)"
  ur: "قصة وفكرة: ایک قصہ اور ایک فکر ⁦(ٹیلی وژن پروگرام)⁩"
  es: "Qissa wa-Fikra, Una historia y una idea (programa de televisión)"
  fr: "Qissa wa-Fikra, Une histoire et une idée (programme télévisé)"
  tr: "Hikaye ve Fikir (TV Programı)"
  id: "Cerita dan Ide (Program TV)"
summary:
  ar: "برنامج تلفزيوني لطارق السويدان يحفظ منه أرشيف أسابيل تسعًا وعشرين حلقة، تقرن كل حلقة سيرة شخصية تاريخية، من التاريخ الإسلامي أو من تاريخ العالم، بفكرة واحدة يستخرج منها الدروس، مثل التضحية من أجل الفكرة، والتغيير، وعلاقة العلماء بالحكام، والاستبداد، والإصلاح المتدرج، والتسامح، والعقل والدين."
  en: "A television programme by Tareq al-Suwaidan, twenty-nine episodes of which are kept in the Assabile archive; each episode pairs the life of one historical figure, from Islamic or world history, with one idea from which he draws lessons, such as sacrifice for an idea, change, scholars and rulers, despotism, gradual reform, tolerance, and reason and religion."
  ur: "طارق السویدان کا ٹیلی وژن پروگرام جس کی انتیس اقساط اسابیل آرکائیو میں محفوظ ہیں؛ ہر قسط اسلامی یا عالمی تاریخ کی کسی ایک شخصیت کی زندگی کو ایک فکر سے جوڑتی ہے اور اس سے اسباق نکالتی ہے، جیسے فکر کے لیے قربانی، تبدیلی، علما اور حکمران، استبداد، بتدریج اصلاح، درگزر، اور عقل و دین۔"
  es: "Un programa de televisión de Tareq al-Suwaidan, del cual se conservan veintinueve episodios en el archivo de Assabile; cada episodio relaciona la vida de una figura histórica, de la historia islámica o universal, con una idea de la que extrae lecciones, como el sacrificio por una idea, el cambio, los eruditos y gobernantes, el despotismo, la reforma gradual, la tolerancia y la razón y la religión."
  fr: "Une émission de télévision de Tareq al-Suwaidan, dont vingt-neuf épisodes sont conservés dans les archives d'Assabile; chaque épisode associe la vie d'une figure historique, de l'histoire islamique ou mondiale, à une idée dont il tire des leçons, telles que le sacrifice pour une idée, le changement, les érudits et les dirigeants, le despotisme, la réforme progressive, la tolérance, et la raison et la religion."
  tr: "Tariq Al-Suwaidan tarafından hazırlanan ve Isabel'in arşivini yirmi dokuz bölümde koruduğu bir televizyon programı olan bu program, her bölüme İslam tarihi veya dünya tarihinden bir tarihsel biyografi eşlik eder; bu fikirden ders çıkarılan tek bir fikir vardır; örneğin fikir için fedakarlık, değişim, alimler ile yöneticiler arasındaki ilişki, zorbalık, kademeli reform, hoşgörü, akıl ve din."
  id: "Program televisi karya Tariq Al-Suwaidan yang menyimpan arsip Isabel dalam dua puluh sembilan episode, setiap episode disertai dengan biografi sejarah, dari sejarah Islam atau sejarah dunia, dengan satu gagasan yang menjadi sumber pelajaran, seperti pengorbanan untuk gagasan, perubahan, hubungan antara ulama dan penguasa, tirani, reformasi bertahap, toleransi, akal, dan agama."
