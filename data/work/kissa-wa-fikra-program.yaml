label:
  ar: "قصة وفكرة ⁦(برنامج تلفزيوني)⁩"
  en: "Qissa wa-Fikra, A Story and an Idea (television programme)"
  ur: "قصة وفكرة: ایک قصہ اور ایک فکر ⁦(ٹیلی وژن پروگرام)⁩"
summary:
  ar: "برنامج تلفزيوني لطارق السويدان يحفظ منه أرشيف أسابيل تسعًا وعشرين حلقة، تقرن كل حلقة سيرة شخصية تاريخية، من التاريخ الإسلامي أو من تاريخ العالم، بفكرة واحدة يستخرج منها الدروس، مثل التضحية من أجل الفكرة، والتغيير، وعلاقة العلماء بالحكام، والاستبداد، والإصلاح المتدرج، والتسامح، والعقل والدين."
  en: "A television programme by Tareq al-Suwaidan, twenty-nine episodes of which are kept in the Assabile archive; each episode pairs the life of one historical figure, from Islamic or world history, with one idea from which he draws lessons, such as sacrifice for an idea, change, scholars and rulers, despotism, gradual reform, tolerance, and reason and religion."
  ur: "طارق السویدان کا ٹیلی وژن پروگرام جس کی انتیس اقساط اسابیل آرکائیو میں محفوظ ہیں؛ ہر قسط اسلامی یا عالمی تاریخ کی کسی ایک شخصیت کی زندگی کو ایک فکر سے جوڑتی ہے اور اس سے اسباق نکالتی ہے، جیسے فکر کے لیے قربانی، تبدیلی، علما اور حکمران، استبداد، بتدریج اصلاح، درگزر، اور عقل و دین۔"
