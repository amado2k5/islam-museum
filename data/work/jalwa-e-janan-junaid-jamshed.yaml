label: { ar: "جلوهٔ جاناں ⁦(ألبوم جنيد جمشيد، 2005)⁩", en: "Jalwa-e-Janan", ur: "جلوۂ جاناں" }
summary:
  ar: "أول ألبوم ديني روحي لمغني البوب الباكستاني السابق جنيد جمشيد، سُجّل سنة 2005 في قناة كيو تي في وصدر عن هيرا ستيريو، بنعوت وأدعية بالأردية والبشتوية من شعر إقبال وعزيز الحسن الغوري وتقي العثماني؛ أشهر ما فيه نعت «محمد کا روضہ قریب آرہا ہے»."
  en: "The first religious and spiritual album of the former Pakistani pop singer Junaid Jamshed, recorded in 2005 at QTV and released by Heera Stereo, with naats and supplications in Urdu and Pashto to poetry by Iqbal, Aziz al-Hasan Ghouri and Taqi Usmani; its best-known naat is 'Muhammad Ka Roza Qareeb Aaraha Hai'."
  ur: "سابق پاکستانی پاپ گلوکار جنید جمشید کا پہلا دینی و روحانی البم، 2005 میں کیو ٹی وی پر ریکارڈ ہوا اور ہیرا اسٹیریو سے جاری ہوا؛ اس کی سب سے مشہور نعت «محمد کا روضہ قریب آ رہا ہے» ہے، اور اس میں اقبال، عزیز الحسن غوری اور تقی عثمانی کا کلام ہے۔"
