summary:
  ar: "كتاب صوفي لمحمد بن عبد الجبار النفري، يصفه مصطفى محمود بأنه «مجموعة قصاصات» تركها النفري بعد وفاته وجمعها أتباعه، تجري على صيغة «أوقفني» و«قال لي ربي»، ويرى أنها لغة الصوفية في التعبير عما يُلقى في القلب لا دعوى نبوة {cite:mm-raaytu-allah-maarif-1976 p. 20}."
  en: "A Sufi book by Muhammad ibn Abd al-Jabbar al-Niffari, which Mostafa Mahmoud describes as 'a collection of scraps' left by al-Niffari at his death and gathered by his followers, cast in the forms 'He stayed me' and 'my Lord said to me'; he holds that this is the Sufis' way of speaking of what is cast into the heart, not a claim to prophethood {cite:mm-raaytu-allah-maarif-1976 p. 20}."
  ur: "محمد بن عبد الجبار نفری کی صوفیانہ کتاب، جسے مصطفیٰ محمود «پرزوں کا مجموعہ» کہتے ہیں جو نفری نے وفات کے بعد چھوڑے اور ان کے پیروکاروں نے جمع کیے، اور جو «اوقفنی» اور «قال لی ربی» کے اسلوب میں ہیں؛ ان کے نزدیک یہ دل میں ڈالی جانے والی بات کو بیان کرنے کی صوفیانہ زبان ہے، نبوت کا دعویٰ نہیں {cite:mm-raaytu-allah-maarif-1976 p. 20}۔"
