id: work/fatwa-aliftaa-jo-working-in-a-hotel
class: work
kind: fatwa
label: { ar: "العمل في الفنادق", en: "Working in a hotel", ur: "ہوٹل میں ملازمت" }
summary:
  ar: "سؤال عن العمل في الفنادق، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز في الأعمال التي لا مباشرة فيها للمحرمات ولا إعانة عليها كالإدارة، ويحرم في الأعمال التي تباشرها أو تعين عليها كتقديم الخمور ونقلها. أجابت الدائرة بأنه يجوز العمل في الفنادق والمطاعم والمحلات في الأعمال التي لا مباشرة فيها للمحرمات ولا إعانة عليها، مثل الأعمال الإدارية. وقالت إن الأعمال التي تباشر المحرمات أو تعين عليها، مثل تقديم الخمور أو نقلها أو شرائها أو المحاسبة عليها أو الاتفاق على شرائها، يحرم العمل فيها، واستشهدت بـ[[passage/quran-5-2|سورة المائدة 5:2]]. وبينت أن أصل عمل الفنادق والمطاعم مباح، وأن الحرام الطارئ في بعض ما يقام فيها يتحمل وزره القائمون عليه، وأن العلماء أجازوا معاملة من اختلط ماله الحلال بالحرام، وأحالت إلى فتواها رقم 2697."
  en: "A question about working in a hotel, in which Jordan's General Iftaa Department answered that it is permitted in jobs that neither involve nor aid forbidden things, such as administration, and forbidden in jobs that do, such as serving or transporting alcohol. The Department answered that working in hotels, restaurants and shops is permitted in jobs that neither directly involve forbidden things nor aid them, such as administrative work. It said that jobs that directly involve or aid forbidden things, such as serving, transporting, buying or accounting for alcohol, or arranging its purchase, are forbidden, citing [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It explained that the basic business of hotels and restaurants is permissible, that the sin of forbidden things occasionally done there rests on those who run them, and that scholars permit dealing with someone whose lawful wealth is mixed with unlawful wealth, referring to its fatwa no. 2697."
  ur: "ہوٹل میں ملازمت کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایسی ملازمتوں میں جائز ہے جن میں حرام کا براہِ راست ارتکاب یا اس میں مدد نہ ہو، جیسے انتظامی کام، اور ایسی ملازمتوں میں حرام ہے جن میں ہو، جیسے شراب پیش کرنا یا لانا لے جانا۔ ڈیپارٹمنٹ نے جواب دیا کہ ہوٹلوں، ریستورانوں اور دکانوں میں ایسے کاموں میں ملازمت جائز ہے جن میں حرام کا براہِ راست ارتکاب یا اس میں مدد نہ ہو، جیسے انتظامی کام۔ اس نے کہا کہ جن کاموں میں حرام کا براہِ راست ارتکاب یا اس میں مدد ہو، جیسے شراب پیش کرنا، لانا لے جانا، خریدنا، اس کا حساب رکھنا یا اس کی خریداری طے کرنا، ان میں ملازمت حرام ہے، اور [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے وضاحت کی کہ ہوٹلوں اور ریستورانوں کا اصل کاروبار مباح ہے، ان میں کبھی ہونے والے حرام کا گناہ ان کے منتظمین پر ہے، اور علما نے ایسے شخص سے معاملہ جائز قرار دیا ہے جس کا حلال مال حرام سے مل گیا ہو، اور اپنے فتویٰ نمبر 2697 کا حوالہ دیا۔"
