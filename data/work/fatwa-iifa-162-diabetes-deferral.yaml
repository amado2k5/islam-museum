id: work/fatwa-iifa-162-diabetes-deferral
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 162 (17/11) بشأن مرض السكري وصيام شهر رمضان ⁦(تأجيل)⁩", en: "IIFA resolution 162 (17/11) on diabetes and fasting Ramadan ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 162 (17/11): ذیابیطس اور ماہِ رمضان کا روزہ ⁦(مؤجل)⁩", es: "Resolución 162 (17/11) de la IIFA sobre diabetes y ayuno durante el Ramadán (aplazada).", fr: "Résolution 162 (17/11) de l'IIFA sur le diabète et le jeûne du Ramadan (reportée)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩. بعد اطلاعه على البحث الوارد بخصوص مرض السكري وصيام شهر رمضان واستماعه إلى المناقشات، قرر إرجاء إصدار قرار في الموضوع للحاجة إلى مزيد من الدراسات والأبحاث، وأوصى المنظمة الإسلامية للعلوم الطبية بالكويت بتشكيل لجنة من الأطباء والفقهاء لدراسة مرض السكري وعلاقته بصيام رمضان. وهو قرار تأجيل لا قرار حكم؛ وقد استكمله المجمع بقراره 183 ⁦(19/9)⁩ بعد ندوتي المنظمة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006). After reviewing the submitted paper on diabetes and fasting Ramadan and hearing the discussions, it resolved to postpone issuing a decision for want of further studies, recommending that the Islamic Organisation for Medical Sciences in Kuwait form a committee of physicians and jurists to study diabetes and its relation to the Ramadan fast. A deferral, not a ruling; the Academy completed the subject in resolution 183 (19/9) after the organisation's two seminars."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں۔ ذیابیطس اور ماہِ رمضان کے روزے پر آئی تحقیق کے جائزے اور مباحث کے بعد اس نے مزید مطالعے کی ضرورت کے سبب فیصلہ مؤجل کیا اور کویت کی اسلامی آرگنائزیشن فار میڈیکل سائنسز سے سفارش کی کہ معالجین اور فقہاء کی مشترکہ کمیٹی ذیابیطس اور رمضان کے روزے کے تعلق کا مطالعہ کرے۔ یہ مؤجل کی قرارداد ہے، حکم کی نہیں؛ اکیڈمی نے بعد میں تنظیم کی دو سیمیناروں کے بعد قرارداد 183 ⁦(19/9)⁩ میں موضوع مکمل کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24-28 de junio de 2006). Tras revisar el documento presentado sobre la diabetes y el ayuno de Ramadán y escuchar los debates, se resolvió aplazar la emisión de una decisión por falta de estudios adicionales, recomendando a la Organización Islámica de Ciencias Médicas de Kuwait que formara un comité de médicos y juristas para estudiar la diabetes y su relación con el ayuno de Ramadán. Se trató de un aplazamiento, no de una decisión; la Academia concluyó el tema en la resolución 183 (19/9) después de los dos seminarios de la organización."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, soit du 24 au 28 juin 2006). Après examen du document soumis sur le diabète et le jeûne du Ramadan et audition des participants, l'Académie a décidé de reporter sa décision, faute d'études complémentaires, et a recommandé à l'Organisation islamique des sciences médicales du Koweït de constituer un comité de médecins et de juristes chargé d'étudier le diabète et son lien avec le jeûne du Ramadan. Il s'agissait d'un report, et non d'une décision; l'Académie a clos le dossier sur ce sujet dans sa résolution 183 (19/9) à l'issue des deux séminaires organisés par l'Organisation."
