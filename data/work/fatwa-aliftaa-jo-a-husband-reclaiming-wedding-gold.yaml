id: work/fatwa-aliftaa-jo-a-husband-reclaiming-wedding-gold
class: work
kind: fatwa
label: { ar: "مطالبة الزوج بالذهب الذي أهداه لزوجته في حفل الزفاف", en: "A husband reclaiming the gold he gave his wife at the wedding", ur: "شادی کی تقریب میں بیوی کو دیا گیا سونا شوہر کا واپس مانگنا", es: "Un marido reclamando el oro que le regaló a su esposa en la boda.", fr: "Un mari récupère l'or qu'il avait offert à sa femme lors de leur mariage.", tr: "Kocanın, düğün töreninde eşine hediye ettiği altın için talebi", id: "Klaim suami atas emas yang ia hadiahkan kepada istrinya saat upacara pernikahan" }
summary:
  ar: "سؤال عن زوج أهدى زوجته ذهبًا في حفل الزفاف ثم طالب به مدعيًا أنه حقه، أجابت فيه دائرة الإفتاء العام الأردنية بأن الذهب حق للزوجة سواء كان جزءًا من المهر أو هبة قبضتها. أجابت الدائرة بأن الذهب الذي يقدمه الزوج لعروسه في حفل الزفاف إما أن يكون جزءًا من المهر وإما أن يكون هدية وهبة. وقالت إنه إن كان جزءًا من المهر، أي اتُفق عليه عند العقد ووُثق في عقد الزواج، فهو حق خالص للزوجة. وقالت إنه إن كان هدية فتجري عليه أحكام الهبة، فتلزم بالقبض وتصير ملكًا للزوجة ولا يحق للزوج الرجوع فيها، واستدلت بحديث رواه أبو داود في النهي عن الرجوع في العطية إلا عطية الوالد لولده. وذكرت أن القانون المدني الأردني نص في المادة 579 على أن من موانع الرجوع في الهبة أن تكون من أحد الزوجين للآخر. وخلصت إلى أن الفصل في أي خلاف آخر بين الزوجين يرجع إلى القضاء."
  en: "A question about a husband who gave his wife gold at the wedding party and later claimed it back as his own, in which Jordan's General Iftaa Department answered that the gold belongs to the wife, whether it was part of the dower or a gift she had received. The Department answered that gold a husband gives his bride at the wedding party is either part of the dower (mahr) or a present and gift. It said that if it is part of the dower, meaning it was agreed at the marriage contract and recorded in it, it belongs entirely to the wife. It said that if it was a present, the rules of gifts apply: a gift becomes binding once received and becomes the wife's property, and the husband may not take it back. It cited a hadith reported by Abu Dawud forbidding taking back a gift, except a father's gift to his child. It noted that Article 579 of the Jordanian Civil Code lists a gift from one spouse to the other among the cases in which a gift cannot be revoked. It concluded that any other dispute between the spouses is for the courts to settle."
  ur: "اس شوہر کے بارے میں سوال جس نے شادی کی تقریب میں بیوی کو سونا دیا اور بعد میں اسے اپنا حق کہہ کر واپس مانگا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونا بیوی کا ہے، چاہے وہ مہر کا حصہ ہو یا ایسا تحفہ جو اس نے وصول کر لیا۔ ڈیپارٹمنٹ نے جواب دیا کہ شوہر شادی کی تقریب میں دلہن کو جو سونا دیتا ہے وہ یا تو مہر کا حصہ ہوتا ہے یا تحفہ اور ہبہ۔ اس نے کہا کہ اگر وہ مہر کا حصہ ہو، یعنی نکاح کے وقت طے ہو کر نکاح نامے میں درج ہو، تو وہ خالصتاً بیوی کا حق ہے۔ اس نے کہا کہ اگر وہ تحفہ تھا تو اس پر ہبہ کے احکام لاگو ہوں گے: قبضے سے ہبہ لازم ہو جاتا ہے اور بیوی کی ملکیت بن جاتا ہے، اور شوہر اسے واپس نہیں لے سکتا؛ اس نے ابو داود کی روایت کردہ ایک حدیث سے استدلال کیا جس میں دیا ہوا تحفہ واپس لینے سے منع کیا گیا ہے سوائے والد کے اپنی اولاد کو دیے گئے تحفے کے۔ اس نے ذکر کیا کہ اردنی سول قانون کی دفعہ 579 میں میاں بیوی میں سے ایک کا دوسرے کو ہبہ ان صورتوں میں شامل ہے جن میں ہبہ واپس نہیں لیا جا سکتا۔ اس نے نتیجہ نکالا کہ میاں بیوی کے درمیان کسی اور اختلاف کا فیصلہ عدالت کرے گی۔"
  es: "Una pregunta sobre un esposo que le regaló oro a su esposa en la fiesta de bodas y luego lo reclamó como suyo, fue respondida por el Departamento General de Iftaa de Jordania, que dictaminó que el oro pertenece a la esposa, ya sea que formara parte de la dote o fuera un regalo recibido. El Departamento explicó que el oro que un esposo le da a su esposa en la fiesta de bodas es parte de la dote (mahr) o un regalo. Si forma parte de la dote, es decir, si fue acordado en el contrato matrimonial y registrado en él, pertenece enteramente a la esposa. Si fue un regalo, se aplican las normas sobre regalos: un regalo se vuelve vinculante una vez recibido y pasa a ser propiedad de la esposa, y el esposo no puede recuperarlo. Citó un hadiz narrado por Abu Dawud que prohíbe recuperar un regalo, excepto el regalo de un padre a su hijo. Señaló que el artículo 579 del Código Civil jordano incluye los regalos de un cónyuge al otro entre los casos en que un regalo no puede ser revocado. Concluyó que cualquier otra disputa entre los cónyuges debe ser resuelta por los tribunales."
  fr: "Concernant un mari ayant offert de l'or à son épouse lors de la cérémonie de mariage, puis l'ayant réclamé comme étant le sien, le Département général de la sagesse (Iftaa) de Jordanie a statué que l'or appartient à l'épouse, qu'il fasse partie de la dot ou qu'il s'agisse d'un cadeau. Le Département a précisé que l'or offert par un mari à sa femme lors de la cérémonie de mariage constitue soit une partie de la dot (mahr), soit un cadeau. Il a indiqué que s'il s'agit d'une partie de la dot, c'est-à-dire que cela a été convenu dans le contrat de mariage et consigné dans celui-ci, l'or appartient entièrement à l'épouse. Il a ajouté que s'il s'agit d'un cadeau, les règles relatives aux donations s'appliquent: une donation devient contraignante dès sa réception et devient la propriété de l'épouse, et le mari ne peut la reprendre. Le Département a cité un hadith rapporté par Abou Dawoud interdisant de reprendre un cadeau, à l'exception de celui d'un père à son enfant. Il a également rappelé que l'article 579 du Code civil jordanien mentionne les donations entre époux parmi les cas où une donation est irrévocable. Enfin, il a conclu que tout autre différend entre les époux relève de la compétence des tribunaux."
  tr: "Düğünde eşine altın hediye edip sonra bunu hakkı olarak talep eden bir kocanla ilgili bir soruya ise, Ürdün Genel Fetva Dairesi, altının eşin hakkı olduğunu, ister çeyizin bir parçası olsun ister onun elinden hediye edilsin, ceyiz olarak kabul edildiğini söyledi. Daire, kocanın düğünde gelinine verdiği altının ya çeyizin bir parçası ya da hediye ve hediye olduğunu belirtti. Eğer bu altın çeyizin bir parçasıysa, yani evlilik sözleşmesi sırasında üzerinde anlaşılmış ve evlilik sözleşmesinde belgelenmişse, bunun kadının saf hakkı olduğunu belirtti. Eğer hediye ise hediye kurallarının geçerli olduğunu, bu yüzden alması zorunlu olduğunu ve eşin malı olduğunu, kocanın ise bunu geri alma hakkı olmadığını söyledi. Ebu Davud'un anlattığı, babanın çocuğuna hediye vermesi dışında hediye başvurusunu yasaklayan bir hadise atıfta bulundu. Ürdün Medeni Kanunu'nun 579. maddesinde hediyeye başvurulmanın bir eşten diğerine yapılması gerektiğini belirttiğini belirtti. Eşler arasındaki diğer uyuşmazlıkların çözümünün yargıya bağlı olduğunu belirtti."
  id: "Sebuah pertanyaan tentang suami yang memberikan emas kepada istrinya di sebuah pernikahan dan kemudian mengklaimnya sebagai haknya, Departemen Fatwa Umum Yordania menjawab bahwa emas adalah hak istri, baik itu bagian dari mas kawin atau hadiah dari tangannya. Departemen menjawab bahwa emas yang diberikan suami kepada pengantin wanita pada pernikahan adalah bagian dari mas kawin atau hadiah dan hadiah. Departemen tersebut menyatakan bahwa jika emas itu bagian dari mas kawin, artinya telah disepakati pada saat kontrak pernikahan dan didokumentasikan dalam kontrak pernikahan, maka itu adalah hak murni istri. Departemen tersebut menyatakan bahwa jika itu adalah hadiah, aturan hadiah berlaku, sehingga emas wajib menerimanya dan menjadi milik istri, dan suami tidak berhak mencabutnya. Dia mengutip hadits yang diceritakan oleh Abu Dawood yang melarang penggunaan hadiah kecuali untuk hadiah ayah kepada anaknya. Ia menyatakan bahwa Kode Perdata Yordania menetapkan dalam Pasal 579 bahwa penggunaan hadiah harus dari satu pasangan ke pasangan lainnya. Ia menyimpulkan bahwa penyelesaian sengketa lain antara pasangan adalah hak peradilan."
