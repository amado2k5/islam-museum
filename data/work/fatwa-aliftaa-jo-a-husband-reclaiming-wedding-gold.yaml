id: work/fatwa-aliftaa-jo-a-husband-reclaiming-wedding-gold
class: work
kind: fatwa
label: { ar: "مطالبة الزوج بالذهب الذي أهداه لزوجته في حفل الزفاف", en: "A husband reclaiming the gold he gave his wife at the wedding", ur: "شادی کی تقریب میں بیوی کو دیا گیا سونا شوہر کا واپس مانگنا" }
summary:
  ar: "سؤال عن زوج أهدى زوجته ذهبًا في حفل الزفاف ثم طالب به مدعيًا أنه حقه، أجابت فيه دائرة الإفتاء العام الأردنية بأن الذهب حق للزوجة سواء كان جزءًا من المهر أو هبة قبضتها. أجابت الدائرة بأن الذهب الذي يقدمه الزوج لعروسه في حفل الزفاف إما أن يكون جزءًا من المهر وإما أن يكون هدية وهبة. وقالت إنه إن كان جزءًا من المهر، أي اتُفق عليه عند العقد ووُثق في عقد الزواج، فهو حق خالص للزوجة. وقالت إنه إن كان هدية فتجري عليه أحكام الهبة، فتلزم بالقبض وتصير ملكًا للزوجة ولا يحق للزوج الرجوع فيها، واستدلت بحديث رواه أبو داود في النهي عن الرجوع في العطية إلا عطية الوالد لولده. وذكرت أن القانون المدني الأردني نص في المادة 579 على أن من موانع الرجوع في الهبة أن تكون من أحد الزوجين للآخر. وخلصت إلى أن الفصل في أي خلاف آخر بين الزوجين يرجع إلى القضاء."
  en: "A question about a husband who gave his wife gold at the wedding party and later claimed it back as his own, in which Jordan's General Iftaa Department answered that the gold belongs to the wife, whether it was part of the dower or a gift she had received. The Department answered that gold a husband gives his bride at the wedding party is either part of the dower (mahr) or a present and gift. It said that if it is part of the dower, meaning it was agreed at the marriage contract and recorded in it, it belongs entirely to the wife. It said that if it was a present, the rules of gifts apply: a gift becomes binding once received and becomes the wife's property, and the husband may not take it back. It cited a hadith reported by Abu Dawud forbidding taking back a gift, except a father's gift to his child. It noted that Article 579 of the Jordanian Civil Code lists a gift from one spouse to the other among the cases in which a gift cannot be revoked. It concluded that any other dispute between the spouses is for the courts to settle."
  ur: "اس شوہر کے بارے میں سوال جس نے شادی کی تقریب میں بیوی کو سونا دیا اور بعد میں اسے اپنا حق کہہ کر واپس مانگا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونا بیوی کا ہے، چاہے وہ مہر کا حصہ ہو یا ایسا تحفہ جو اس نے وصول کر لیا۔ ڈیپارٹمنٹ نے جواب دیا کہ شوہر شادی کی تقریب میں دلہن کو جو سونا دیتا ہے وہ یا تو مہر کا حصہ ہوتا ہے یا تحفہ اور ہبہ۔ اس نے کہا کہ اگر وہ مہر کا حصہ ہو، یعنی نکاح کے وقت طے ہو کر نکاح نامے میں درج ہو، تو وہ خالصتاً بیوی کا حق ہے۔ اس نے کہا کہ اگر وہ تحفہ تھا تو اس پر ہبہ کے احکام لاگو ہوں گے: قبضے سے ہبہ لازم ہو جاتا ہے اور بیوی کی ملکیت بن جاتا ہے، اور شوہر اسے واپس نہیں لے سکتا؛ اس نے ابو داود کی روایت کردہ ایک حدیث سے استدلال کیا جس میں دیا ہوا تحفہ واپس لینے سے منع کیا گیا ہے سوائے والد کے اپنی اولاد کو دیے گئے تحفے کے۔ اس نے ذکر کیا کہ اردنی سول قانون کی دفعہ 579 میں میاں بیوی میں سے ایک کا دوسرے کو ہبہ ان صورتوں میں شامل ہے جن میں ہبہ واپس نہیں لیا جا سکتا۔ اس نے نتیجہ نکالا کہ میاں بیوی کے درمیان کسی اور اختلاف کا فیصلہ عدالت کرے گی۔"
