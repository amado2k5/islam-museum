summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: بيع العربون أن يدفع المشتري للبائع مبلغًا يحتسب من الثمن إن أخذ السلعة ويكون للبائع إن تركها، وتجري الإجارة مجراه لأنها بيع المنافع، ويستثنى ما يشترط لصحته قبض بدل أو بدلين في مجلس العقد كالسلم والصرف، وبيّن الحكم على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on the earnest-money sale: the buyer pays the seller a sum counted toward the price if he takes the goods and kept by the seller if he leaves them; ijara is treated alike as a sale of benefits; sales requiring possession of one or both countervalues in the session — salam and sarf — are excepted, with the ruling set out."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ بیع عربون پر: خریدار کی دی گئی رقم مال لینے پر قیمت میں شمار ہوتی ہے ورنہ بیچنے والے کی؛ اجارہ بھی اسی حکم میں، سلام اور صرف مستثنیٰ۔"
