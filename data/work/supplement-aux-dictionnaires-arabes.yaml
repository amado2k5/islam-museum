summary:
  ar: "«تكملة المعاجم العربية» لرينهارت دوزي، المستشرق الهولندي ⁦(ولد في ليدن ١٨٢٠م)⁩، في مجلدين، صدر في ليدن بين ١٨٧٧ و١٨٨١م وأعيد طبعه في بيروت ١٩٦٨م."
  en: "Reinhart Dozy's Supplement aux dictionnaires arabes, a supplement to the earlier Arabic dictionaries by the Dutch orientalist (born at Leiden in 1820), in two volumes, Leiden 1877-1881, reprinted at Beirut in 1968."
  es: "El Supplement aux dictionnaires arabes de Reinhart Dozy, suplemento a los diccionarios árabes anteriores por el orientalista neerlandés (nacido en Leiden en 1820), en dos volúmenes, Leiden 1877-1881, reimpreso en Beirut en 1968."
  fr: "Le Supplément aux dictionnaires arabes de Reinhart Dozy, supplément aux dictionnaires arabes antérieurs par l'orientaliste néerlandais (né à Leyde en 1820), en deux volumes, Leyde 1877-1881, réimprimé à Beyrouth en 1968."
  ur: "رائن ہارٹ دوزی کا Supplement aux dictionnaires arabes، ولندیزی مستشرق ⁦(پیدائش لائیڈن 1820ء)⁩ کا پہلی عربی لغات پر ضمیمہ، دو جلدوں میں، لائیڈن 1877–1881ء، بیروت میں 1968ء میں دوبارہ چھپا۔"
  tr: "Hollandalı oryantalist Reinhart Dozy tarafından (1820 Leiden doğumlu) \"Arap Sözlüklerine Ek\" adlı iki cilt halinde 1877-1881 yılları arasında Leiden'de yayımlanmış ve 1968'de Beyrut'ta yeniden basılmıştır."
  id: "\"Suplemen Kamus Arab\" oleh Reinhart Dozy, orientalis Belanda (lahir di Leiden 1820), dalam dua volume, diterbitkan di Leiden antara tahun 1877 dan 1881 dan dicetak ulang di Beirut pada tahun 1968."
