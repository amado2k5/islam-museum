label: { ar: "كتاب الزهد لأحمد بن حنبل", en: "Kitab al-Zuhd of Ahmad ibn Hanbal", ur: "کتاب الزہد ⁦(احمد بن حنبل)⁩" }
summary:
  ar: "كتاب أحمد بن حنبل ⁦(ت 241هـ)⁩ في الزهد برواية ابنه عبد الله وزياداته، يعرض زهد الأنبياء ثم الصحابة ثم التابعين؛ ينقل الناشر عن ابن تيمية أنه «أجود ما صنف» في الزهد، ويرى محمود بن شوقي بن مفلح أن المطبوع المتداول مختصر لأصل كان عشرين جزءاً كما يذكر ابن خير الإشبيلي {cite:zuhd-ahmad-dkim-1983 p. 7} {cite:zuhd-ahmad-juz13-rayahin-2026 p. 7}."
  en: "Ahmad ibn Hanbal's (d. 241 AH) book on renunciation, transmitted with additions by his son Abd Allah, presenting the renunciation of the prophets, then the Companions, then the Successors; the publisher quotes Ibn Taymiyya calling it 'the best work' on the subject, and Mahmud ibn Shawqi ibn Muflih holds that the current printed text is an abridgement of an original of twenty parts, as Ibn Khayr al-Ishbili records {cite:zuhd-ahmad-dkim-1983 p. 7} {cite:zuhd-ahmad-juz13-rayahin-2026 p. 7}."
  ur: "احمد بن حنبل ⁦(م 241ھ)⁩ کی زہد پر کتاب، ان کے بیٹے عبد اللہ کی روایت اور زیادات کے ساتھ، جو انبیا پھر صحابہ پھر تابعین کا زہد پیش کرتی ہے؛ ناشر ابن تیمیہ سے نقل کرتے ہیں کہ یہ اس موضوع پر «بہترین تصنیف» ہے، اور محمود بن شوقی بن مفلح کی رائے ہے کہ رائج مطبوعہ متن ایک بیس اجزا والی اصل کا اختصار ہے، جیسا کہ ابن خیر اشبیلی ذکر کرتے ہیں {cite:zuhd-ahmad-dkim-1983 p. 7} {cite:zuhd-ahmad-juz13-rayahin-2026 p. 7}۔"
