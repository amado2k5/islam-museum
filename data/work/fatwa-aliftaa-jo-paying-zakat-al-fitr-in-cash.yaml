id: work/fatwa-aliftaa-jo-paying-zakat-al-fitr-in-cash
class: work
kind: fatwa
label: { ar: "دفع زكاة الفطر نقدًا", en: "Paying zakat al-fitr in cash", ur: "صدقۂ فطر نقد ادا کرنا", es: "Pagar el zakat al-fitr en efectivo", fr: "Payer la zakat al-fitr en espèces", tr: "Zekat el-Fitr'in nakit olarak ödenmesi", id: "Membayar Zakat al-Fitr secara tunai" }
summary:
  ar: "سؤال عن دفع زكاة الفطر نقدًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل إخراجها من غالب قوت البلد، ونقلت أن فقهاء الحنفية أجازوا دفع القيمة نقدًا. أجابت الدائرة بأن الأصل أن تخرج زكاة الفطر من غالب قوت البلد، وأن غالب القوت في الأردن القمح أو الأرز، وقدّرتها بـ2500 غرام عن كل شخص، وقالت إن إعطاء هذا المقدار من الأرز للفقراء سهل، وإن هذا هو الصحيح في كل المذاهب. ونقلت أن فقهاء الحنفية أجازوا دفع القيمة نقدًا، لأنه أنفع للفقير وأيسر على المزكي."
  en: "A question about paying zakat al-fitr in cash, in which Jordan's General Iftaa Department answered that the basic rule is to pay it from the land's staple food, and reported that Hanafi jurists permit paying its value in cash. The Department answered that the basic rule is to pay zakat al-fitr from the land's staple food, which in Jordan is wheat or rice, set the amount at 2,500 grams per person, said it is easy to give this amount of rice to the poor and needy, and said this is correct in all the schools. It reported that Hanafi jurists permit paying the value in cash, because it is more useful to the poor and easier for the giver."
  ur: "صدقۂ فطر نقد ادا کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصل یہ ہے کہ اسے ملک کی عام خوراک سے ادا کیا جائے، اور نقل کیا کہ حنفی فقہا نے اس کی قیمت نقد دینے کو جائز کہا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ صدقۂ فطر ملک کی عام خوراک سے ادا کیا جائے، جو اردن میں گندم یا چاول ہے، اس کی مقدار فی کس 2500 گرام بتائی، کہا کہ یہ مقدار چاول فقرا اور مساکین کو دینا آسان ہے، اور یہی تمام مذاہب میں درست ہے۔ اس نے نقل کیا کہ حنفی فقہا نے قیمت نقد دینے کو جائز کہا ہے، کیونکہ یہ فقیر کے لیے زیادہ مفید اور دینے والے کے لیے آسان ہے۔"
  es: "Una pregunta sobre el pago del zakat al-fitr en efectivo, a la que el Departamento General de Iftaa de Jordania respondió que la regla básica es pagarlo con el alimento básico del país, e informó que los juristas hanafíes permiten el pago de su valor en efectivo. El Departamento respondió que la regla básica es pagar el zakat al-fitr con el alimento básico del país, que en Jordania es trigo o arroz, fijando la cantidad en 2500 gramos por persona, diciendo que es fácil dar esta cantidad de arroz a los pobres y necesitados, y que esto es correcto en todas las escuelas. Informó que los juristas hanafíes permiten el pago del valor en efectivo porque es más útil para los pobres y más fácil para el donante."
  fr: "Une question relative au paiement de la zakat al-fitr en espèces a été posée au Département général de la Iftaa en Jordanie. Ce dernier a répondu que la règle de base est de la payer en espèces à partir de denrées alimentaires de base, et a indiqué que les juristes hanafites autorisent le paiement en espèces. Le Département a précisé que la règle de base est de payer la zakat al-fitr en espèces à partir de denrées alimentaires de base, qui en Jordanie sont le blé ou le riz, et a fixé le montant à 2 500 grammes par personne. Il a souligné qu'il est facile de distribuer cette quantité de riz aux pauvres et aux nécessiteux, et que cette pratique est conforme à l'avis de toutes les écoles de pensée. Le Département a également indiqué que les juristes hanafites autorisent le paiement en espèces, car cela est plus utile aux pauvres et plus simple pour le donateur."
  tr: "Zekat el-Fitr'in nakit ödenmesiyle ilgili bir soruya gelince, Ürdün Genel Fetva Müdürlüğü, temerrütün ülkenin çoğu gıdasından ödenmek olduğunu ve Hanefi hukukçularının bu miktarın nakit olarak ödenmesine izin verdiğini bildirdi. Bakanlık, varsayılan olarak ülkenin çoğu gıdasından Zekat al-Fitr ödenmesi olduğunu ve Ürdün'de ana gıdanın kişi başı tahmini 2500 gram olan buğday veya pirinç olduğunu belirtti. Bu miktardaki pirinç yoksullara verilmesinin kolay olduğunu ve bunun tüm düşünce mezheblerinde doğru olduğunu belirtti. Hanefi hukukçuların, bu miktarın nakit olarak ödenmesine izin verdiğini, bunun fakirler için daha faydalı ve zekat verenler için daha kolay olduğunu bildirdi."
  id: "Sebuah pertanyaan tentang pembayaran Zakat al-Fitr secara tunai, Departemen Fatwa Umum Yordania menjawab bahwa defaultnya adalah membayar dari sebagian besar makanan negara, dan melaporkan bahwa ahli hukum Hanafi mengizinkan pembayaran uang tunai. Departemen menjawab bahwa defaultnya adalah membayar Zakat al-Fitr dari sebagian besar makanan negara, dan makanan utama di Yordania adalah gandum atau beras, diperkirakan 2500 gram per orang. Departemen tersebut mengatakan bahwa memberikan jumlah beras sebanyak ini kepada orang miskin itu mudah, dan ini adalah pandangan yang benar di semua aliran pemikiran. Mereka melaporkan bahwa ahli hukum Hanafi mengizinkan membayar jumlah tersebut secara tunai karena lebih menguntungkan bagi yang miskin dan lebih mudah bagi pemberi zakat."
