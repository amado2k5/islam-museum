id: work/fatwa-aliftaa-jo-paying-zakat-al-fitr-in-cash
class: work
kind: fatwa
label: { ar: "دفع زكاة الفطر نقدًا", en: "Paying zakat al-fitr in cash", ur: "صدقۂ فطر نقد ادا کرنا" }
summary:
  ar: "سؤال عن دفع زكاة الفطر نقدًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل إخراجها من غالب قوت البلد، ونقلت أن فقهاء الحنفية أجازوا دفع القيمة نقدًا. أجابت الدائرة بأن الأصل أن تخرج زكاة الفطر من غالب قوت البلد، وأن غالب القوت في الأردن القمح أو الأرز، وقدّرتها بـ2500 غرام عن كل شخص، وقالت إن إعطاء هذا المقدار من الأرز للفقراء سهل، وإن هذا هو الصحيح في كل المذاهب. ونقلت أن فقهاء الحنفية أجازوا دفع القيمة نقدًا، لأنه أنفع للفقير وأيسر على المزكي."
  en: "A question about paying zakat al-fitr in cash, in which Jordan's General Iftaa Department answered that the basic rule is to pay it from the land's staple food, and reported that Hanafi jurists permit paying its value in cash. The Department answered that the basic rule is to pay zakat al-fitr from the land's staple food, which in Jordan is wheat or rice, set the amount at 2,500 grams per person, said it is easy to give this amount of rice to the poor and needy, and said this is correct in all the schools. It reported that Hanafi jurists permit paying the value in cash, because it is more useful to the poor and easier for the giver."
  ur: "صدقۂ فطر نقد ادا کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصل یہ ہے کہ اسے ملک کی عام خوراک سے ادا کیا جائے، اور نقل کیا کہ حنفی فقہا نے اس کی قیمت نقد دینے کو جائز کہا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ صدقۂ فطر ملک کی عام خوراک سے ادا کیا جائے، جو اردن میں گندم یا چاول ہے، اس کی مقدار فی کس 2500 گرام بتائی، کہا کہ یہ مقدار چاول فقرا اور مساکین کو دینا آسان ہے، اور یہی تمام مذاہب میں درست ہے۔ اس نے نقل کیا کہ حنفی فقہا نے قیمت نقد دینے کو جائز کہا ہے، کیونکہ یہ فقیر کے لیے زیادہ مفید اور دینے والے کے لیے آسان ہے۔"
