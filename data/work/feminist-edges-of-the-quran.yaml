summary:
  ar: "دراسة بالإنجليزية لعائشة هداية الله، أستاذة الدراسات الإسلامية بجامعة سان فرانسيسكو، تعرض التفسير النسوي الأمريكي للقرآن وتناقشه نقدياً، صدرت عن مطبعة جامعة أكسفورد سنة 2014."
