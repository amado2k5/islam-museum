  es: "Un estudio en inglés de Aysha A. Hidayatullah, de la Universidad de San Francisco, que examina y responde críticamente a la exégesis feminista estadounidense del Corán; publicado por Oxford University Press en 2014."
  fr: "Une étude en anglais d'Aysha A. Hidayatullah de l'Université de San Francisco qui examine et répond de manière critique à l'exégèse féministe américaine du Coran; publiée par Oxford University Press en 2014."
