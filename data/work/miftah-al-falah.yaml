label: { ar: "مفتاح الفلاح ومصباح الأرواح", en: "Miftah al-Falah wa-Misbah al-Arwah", ur: "مفتاح الفلاح و مصباح الارواح" }
summary:
  ar: "كتاب في الذكر منسوب في طبعته الأولى إلى تاج الدين ابن عطاء الله السكندري، يقول مؤلفه إنه لم ير من صنف في الذكر كتاباً كاملاً كافياً، فرتبه على قسمين: الأول في ماهية الذكر وفضله وآدابه وفوائده والتوحيد والمعرفة وما ينبغي لأهل الطريق، والثاني في شرح الأذكار وأولها كلمة لا إله إلا الله، ثم الرقى وأذكار الصباح والمساء والسفر وعيادة المريض {cite:miftah-al-falah-saada-1332 p. 3} {cite:miftah-al-falah-saada-1332 p. 4} {cite:miftah-al-falah-saada-1332 p. 53}."
  en: "A book on remembrance of God (dhikr), attributed in its first printing to Taj al-Din Ibn 'Ata' Allah al-Iskandari; its author says he had seen no complete and sufficient book on dhikr, and arranged it in two parts: the first on what dhikr is, its merit, rules of conduct and benefits, unification, gnosis and the duties of the people of the path; the second explaining the formulas of remembrance, first of them 'there is no god but God', followed by healing invocations and the remembrances of morning and evening, travel and visiting the sick {cite:miftah-al-falah-saada-1332 p. 3} {cite:miftah-al-falah-saada-1332 p. 4} {cite:miftah-al-falah-saada-1332 p. 53}."
  ur: "ذکر پر ایک کتاب جو اپنے پہلے ایڈیشن میں تاج الدین ابن عطاء اللہ سکندری سے منسوب ہے؛ مصنف کہتے ہیں کہ انہوں نے ذکر پر کوئی مکمل اور کافی کتاب نہ دیکھی، اس لیے اسے دو حصوں میں مرتب کیا: پہلا ذکر کی حقیقت، فضیلت، آداب، فوائد، توحید، معرفت اور اہلِ طریق کے فرائض پر؛ دوسرا اذکار کی شرح پر، جن میں پہلا «لا الٰہ الا اللہ» ہے، پھر رقیے اور صبح و شام، سفر اور عیادت کے اذکار {cite:miftah-al-falah-saada-1332 p. 3} {cite:miftah-al-falah-saada-1332 p. 4} {cite:miftah-al-falah-saada-1332 p. 53}۔"
