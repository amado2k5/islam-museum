id: work/fatwa-dar-alifta-eg-woman-gloves-in-ihram
class: work
kind: fatwa
label: { ar: "حكم لبس القفازين للمرأة المحرمة", en: "A woman in ihram wearing gloves", ur: "محرمہ عورت کا دستانے پہننا", es: "Una mujer en estado de ihram con guantes", fr: "Une femme en état d'ihram portant des gants", tr: "Yasak bir kadın için eldiven giyme kararı", id: "Aturan tentang memakai sarung tangan untuk wanita terlarang" }
summary:
  ar: "سائل سأل عن لبس القفازين للمرأة حال إحرامها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20956)⁩ أن لبس القفازين للمرأة حال إحرامها من محظورات الإحرام التي يجب عليها تركها ما دامت محرمة وبيّن الجواب ما يجب عليها على وجهه."
  en: "A questioner asked about a woman wearing gloves while in ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20956) answered that wearing gloves is among the prohibitions of ihram a woman must leave while in the state; the answer sets out what is due from her."
  ur: "ایک سائل نے احرام کی حالت میں عورت کے دستانے پہننے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20956)⁩ نے جواب دیا کہ احرام میں دستانے محظورات میں ہیں؛ جواب میں اس پر واجب حکم بیان ہوا۔"
  es: "Una persona preguntó sobre la conveniencia de que una mujer use guantes durante el estado de ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20956) respondió que usar guantes está entre las prohibiciones del ihram que una mujer debe abandonar mientras se encuentra en ese estado; la respuesta detalla lo que le corresponde a ella."
  fr: "Une personne a posé une question concernant le port de gants par une femme en état d'ihram. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20956) a répondu que le port de gants figure parmi les interdits de l'ihram et qu'une femme doit s'en affranchir pendant son état d'ihram; la réponse précise ce qui lui est dû."
  tr: "Bir soru soran kişi, İhram'da eldiven takan bir kadın hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20956), ihram sırasında bir kadının eldiven takmasının ihramda olduğu sürece ayrılması gerektiği yasaklarından biri olduğunu ve yüzünde ne yapması gerektiğini açıkladı."
  id: "Seorang penanya menanyakan tentang seorang wanita yang mengenakan sarung tangan saat berada di Ihram. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20956) menjawab bahwa mengenakan sarung tangan untuk seorang wanita selama Ihram adalah salah satu larangan Ihram yang harus dia tinggalkan selama masih di Ihram, dan menjelaskan apa yang harus dilakukan pada wajahnya."
