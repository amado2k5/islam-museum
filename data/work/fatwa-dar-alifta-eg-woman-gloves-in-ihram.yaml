label: { ar: "حكم لبس القفازين للمرأة المحرمة", en: "A woman in ihram wearing gloves", ur: "محرمہ عورت کا دستانے پہننا" }
summary:
  ar: "سائل سأل عن لبس القفازين للمرأة حال إحرامها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20956)⁩ أن لبس القفازين للمرأة حال إحرامها من محظورات الإحرام التي يجب عليها تركها ما دامت محرمة وبيّن الجواب ما يجب عليها على وجهه."
  en: "A questioner asked about a woman wearing gloves while in ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20956) answered that wearing gloves is among the prohibitions of ihram a woman must leave while in the state; the answer sets out what is due from her."
  ur: "ایک سائل نے احرام کی حالت میں عورت کے دستانے پہننے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20956)⁩ نے جواب دیا کہ احرام میں دستانے محظورات میں ہیں؛ جواب میں اس پر واجب حکم بیان ہوا۔"
