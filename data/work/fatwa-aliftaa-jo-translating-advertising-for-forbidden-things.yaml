id: work/fatwa-aliftaa-jo-translating-advertising-for-forbidden-things
class: work
kind: fatwa
label: { ar: "ترجمة الإعلانات المروجة للمحرمات", en: "Translating advertising for forbidden things", ur: "حرام چیزوں کی تشہیر کا ترجمہ" }
summary:
  ar: "سؤال من مترجم لموقع يترجم أحيانًا عروضًا لمطاعم وفنادق تتعلق بالخمور أو بمنتجعات للمثليين، أجابت فيه دائرة الإفتاء العام الأردنية بأن الترجمة مباحة في الأصل، ويحرم منها ما فيه إعانة على الحرام أو ترويج له. أجابت الدائرة بأن العمل في الترجمة مباح في الأصل، بشرط ألا تتصل مجالاته بالإعانة المباشرة على المحرمات أو الترويج لها. وقالت إن ما فيه إعانة على الحرام لا تجوز ترجمته، كالدعاية لما تعده الدائرة رذيلة وفسادًا ولشرب الخمور، مستدلة بالأمر القرآني بالتعاون على البر والتقوى والنهي عن التعاون على الإثم. وخلصت إلى أنه يحرم العمل في ترجمة ما اتصل بالحرام أو يروج له، ويباح ترجمة ما لا يتعلق بذلك."
  en: "A question from a website translator who sometimes translates restaurant and hotel offers involving alcohol or resorts for gay people, in which Jordan's General Iftaa Department answered that translation is permitted in principle, but not where it directly helps or promotes what is forbidden. The Department answered that translation work is permitted in principle, provided its fields are not tied to directly assisting or promoting forbidden things. It said material that assists the forbidden may not be translated, such as advertising for what the Department regards as vice and corruption, or for drinking alcohol, pointing to the Qur'anic command to cooperate in righteousness and piety and not in sin. It concluded that translating material tied to or promoting the forbidden is not permitted, while translating what has no such connection is permitted."
  ur: "ایک ویب سائٹ کے مترجم کا سوال جو کبھی شراب یا ہم جنس پرستوں کے ریزورٹس سے متعلق ریستورانوں اور ہوٹلوں کی پیشکشوں کا ترجمہ کرتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ترجمہ اصلاً جائز ہے، لیکن جس میں حرام کی براہِ راست مدد یا تشہیر ہو وہ ناجائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ترجمے کا کام اصلاً جائز ہے، بشرطیکہ اس کے شعبوں کا حرام چیزوں کی براہِ راست مدد یا تشہیر سے تعلق نہ ہو۔ اس نے کہا کہ جس مواد میں حرام کی مدد ہو اس کا ترجمہ جائز نہیں، جیسے ان چیزوں کی تشہیر جنہیں ڈیپارٹمنٹ برائی اور فساد سمجھتا ہے، یا شراب نوشی کی تشہیر؛ اس نے نیکی اور تقویٰ میں تعاون اور گناہ میں تعاون نہ کرنے کے قرآنی حکم سے استدلال کیا۔ اس نے نتیجہ نکالا کہ حرام سے متعلق یا اس کی تشہیر کرنے والے مواد کا ترجمہ ناجائز ہے، اور جو اس سے متعلق نہ ہو اس کا ترجمہ جائز ہے۔"
