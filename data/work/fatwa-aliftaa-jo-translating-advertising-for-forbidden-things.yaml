id: work/fatwa-aliftaa-jo-translating-advertising-for-forbidden-things
class: work
kind: fatwa
label: { ar: "ترجمة الإعلانات المروجة للمحرمات", en: "Translating advertising for forbidden things", ur: "حرام چیزوں کی تشہیر کا ترجمہ", es: "Traduciendo publicidad de cosas prohibidas", fr: "Traduire la publicité pour des choses interdites", tr: "Tabu teşvik eden reklamların çevirisi", id: "Terjemahan iklan yang mempromosikan tabu" }
summary:
  ar: "سؤال من مترجم لموقع يترجم أحيانًا عروضًا لمطاعم وفنادق تتعلق بالخمور أو بمنتجعات للمثليين، أجابت فيه دائرة الإفتاء العام الأردنية بأن الترجمة مباحة في الأصل، ويحرم منها ما فيه إعانة على الحرام أو ترويج له. أجابت الدائرة بأن العمل في الترجمة مباح في الأصل، بشرط ألا تتصل مجالاته بالإعانة المباشرة على المحرمات أو الترويج لها. وقالت إن ما فيه إعانة على الحرام لا تجوز ترجمته، كالدعاية لما تعده الدائرة رذيلة وفسادًا ولشرب الخمور، مستدلة بالأمر القرآني بالتعاون على البر والتقوى والنهي عن التعاون على الإثم. وخلصت إلى أنه يحرم العمل في ترجمة ما اتصل بالحرام أو يروج له، ويباح ترجمة ما لا يتعلق بذلك."
  en: "A question from a website translator who sometimes translates restaurant and hotel offers involving alcohol or resorts for gay people, in which Jordan's General Iftaa Department answered that translation is permitted in principle, but not where it directly helps or promotes what is forbidden. The Department answered that translation work is permitted in principle, provided its fields are not tied to directly assisting or promoting forbidden things. It said material that assists the forbidden may not be translated, such as advertising for what the Department regards as vice and corruption, or for drinking alcohol, pointing to the Qur'anic command to cooperate in righteousness and piety and not in sin. It concluded that translating material tied to or promoting the forbidden is not permitted, while translating what has no such connection is permitted."
  ur: "ایک ویب سائٹ کے مترجم کا سوال جو کبھی شراب یا ہم جنس پرستوں کے ریزورٹس سے متعلق ریستورانوں اور ہوٹلوں کی پیشکشوں کا ترجمہ کرتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ترجمہ اصلاً جائز ہے، لیکن جس میں حرام کی براہِ راست مدد یا تشہیر ہو وہ ناجائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ترجمے کا کام اصلاً جائز ہے، بشرطیکہ اس کے شعبوں کا حرام چیزوں کی براہِ راست مدد یا تشہیر سے تعلق نہ ہو۔ اس نے کہا کہ جس مواد میں حرام کی مدد ہو اس کا ترجمہ جائز نہیں، جیسے ان چیزوں کی تشہیر جنہیں ڈیپارٹمنٹ برائی اور فساد سمجھتا ہے، یا شراب نوشی کی تشہیر؛ اس نے نیکی اور تقویٰ میں تعاون اور گناہ میں تعاون نہ کرنے کے قرآنی حکم سے استدلال کیا۔ اس نے نتیجہ نکالا کہ حرام سے متعلق یا اس کی تشہیر کرنے والے مواد کا ترجمہ ناجائز ہے، اور جو اس سے متعلق نہ ہو اس کا ترجمہ جائز ہے۔"
  es: "Una pregunta de un traductor de sitios web que a veces traduce ofertas de restaurantes y hoteles que incluyen alcohol o complejos turísticos para personas homosexuales, fue respondida por el Departamento General de Iftaa de Jordania, que indicó que la traducción está permitida en principio, pero no cuando ayuda o promueve directamente lo prohibido. El Departamento respondió que el trabajo de traducción está permitido en principio, siempre que sus áreas no estén vinculadas a ayudar o promover directamente lo prohibido. Añadió que el material que ayuda a lo prohibido no puede traducirse, como la publicidad de lo que el Departamento considera vicio y corrupción, o del consumo de alcohol, haciendo referencia al mandato coránico de cooperar en la rectitud y la piedad y no en el pecado. Concluyó que traducir material vinculado a lo prohibido o que lo promueva no está permitido, mientras que traducir lo que no tenga dicha conexión sí lo está."
  fr: "Un traducteur de site web, qui traduit parfois des offres de restaurants et d'hôtels proposant de l'alcool ou des séjours pour personnes homosexuelles, a posé une question au Département général de la Fatah de Jordanie. Ce dernier a répondu que la traduction est permise en principe, sauf lorsqu'elle contribue directement à promouvoir ce qui est interdit. Le Département a précisé que le travail de traduction est autorisé, à condition que son domaine ne soit pas directement lié à la promotion ou à l'aide apportée à des activités interdites. Il a indiqué que les documents qui contribuent à l'interdit ne peuvent être traduits, comme la publicité pour ce que le Département considère comme le vice et la corruption, ou pour la consommation d'alcool, en se référant au commandement coranique d'œuvrer ensemble pour la droiture et la piété, et non pour le péché. Il a conclu que la traduction de documents liés à l'interdit ou en faisant la promotion est interdite, tandis que la traduction de documents sans lien avec l'interdit est autorisée."
  tr: "Bazen alkolle ilgili restoran ve oteller ya da eşcinseller için tatil köyleri için teklifleri çeviren bir web sitesi için bir tercümanın sorusuna cevap verdi; Ürdün Genel Fetva Dairesi, çevirinin aslında izin verilebilir olduğunu ve yasak olanı destekleyen veya teşvik eden her şeyin yasak olduğunu belirtti. Bakanlık, çeviri çalışmasının aslında yasak eylemlere doğrudan yardım veya teşvik etmekle ilgili olmadığı sürece aslinde izin verilebilir olduğunu belirtti. Yasakta yardımcı olan şeylerin, departmanın kötü ve yolsuzluk olarak gördüğü şeyleri teşvik etmek ya da alkol içmek gibi tercüme edilmesinin izin verilmediğini, Kur'an'ın doğruluk ve takvada işbirliği yapma ve günahta işbirliği yasaklamayı gerekçe göstererek belirtti. Yasaklanan veya teşvik edilen şeylerin çevirisinin yasak olduğunu, bununla ilgisi olmayanların ise tercüme edilmesinin izin verildiğini belirtti."
  id: "Sebuah pertanyaan dari seorang penerjemah untuk sebuah situs web yang kadang menerjemahkan penawaran restoran dan hotel terkait alkohol atau resor untuk kaum homoseksual, di mana Departemen Fatwa Umum Yordania menjawab bahwa penerjemahan awalnya diperbolehkan dan bahwa segala sesuatu yang membantu atau mempromosikan hal terlarang dilarang. Departemen tersebut menjawab bahwa pekerjaan penerjemahan awalnya diperbolehkan, asalkan bidangnya tidak langsung terkait dengan membantu atau mempromosikan tindakan terlarang. Departemen tersebut menyatakan bahwa apa yang membantu dalam hal terlarang tidak diperbolehkan diterjemahkan, seperti mempromosikan apa yang dianggap departemen sebagai kejahatan dan korupsi, atau minum alkohol, dengan mengutip perintah Al-Qur'an untuk bekerja sama dalam kebenaran dan kesalehan serta melarang kerja sama dalam dosa. Departemen tersebut menyimpulkan bahwa dilarang menerjemahkan apa yang terkait atau dipromosikan sebagai hal terlarang, dan diperbolehkan menerjemahkan apa yang tidak terkait dengan itu."
