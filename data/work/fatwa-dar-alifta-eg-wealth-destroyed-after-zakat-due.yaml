id: work/fatwa-dar-alifta-eg-wealth-destroyed-after-zakat-due
class: work
kind: fatwa
label: { ar: "حكم الزكاة في المال إذا هلك بعد وجوب الزكاة فيه", en: "If wealth perishes after zakat became due on it", ur: "زکات کے واجب ہونے کے بعد مال ہلاک ہو جائے تو حکم" }
summary:
  ar: "سائل سأل عن حكم الزكاة إذا هلك المال بعد وجوبها فيه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22174)⁩ أن الزكاة تجب إذا بلغ المال نصابًا ⁦(خمسة وثمانون جرامًا من الذهب عيار إحدى وعشرين)⁩ ومضى عليه حول قمري، وبيّن الجواب حكم من هلك ماله بعد تمام الحول على وجهه."
  en: "A questioner asked about zakat when wealth perishes after it had become due. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22174) answered that zakat falls due when wealth reaches the nisab (eighty-five grams of twenty-one-carat gold) and a lunar year passes over it; the answer sets out the ruling for one whose wealth is lost after the year completes."
  ur: "ایک سائل نے پوچھا کہ زکات واجب ہونے کے بعد مال ہلاک ہو جائے تو کیا حکم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22174)⁩ نے جواب دیا کہ زکات تب واجب ہوتی ہے جب مال نصاب ⁦(اکیس کیرٹ سونے کا پچاسی گرام)⁩ تک پہنچے اور اس پر قمری سال گزر جائے؛ سال پورا ہونے کے بعد مال کے ہلاک ہونے کا حکم جواب میں بیان ہوا۔"
