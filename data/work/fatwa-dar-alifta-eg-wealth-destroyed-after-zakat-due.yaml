id: work/fatwa-dar-alifta-eg-wealth-destroyed-after-zakat-due
class: work
kind: fatwa
label: { ar: "حكم الزكاة في المال إذا هلك بعد وجوب الزكاة فيه", en: "If wealth perishes after zakat became due on it", ur: "زکات کے واجب ہونے کے بعد مال ہلاک ہو جائے تو حکم", es: "Si la riqueza perece después de que el zakat se haya vuelto exigible sobre ella", fr: "Si la richesse disparaît après que la zakat soit devenue due,", tr: "Zekattan sonra zenginlik yok olursa zekatın hükmü zorunludur", id: "Aturan tentang zakat atas kekayaan jika kekayaan itu musnah setelah zakat adalah wajib" }
summary:
  ar: "سائل سأل عن حكم الزكاة إذا هلك المال بعد وجوبها فيه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22174)⁩ أن الزكاة تجب إذا بلغ المال نصابًا ⁦(خمسة وثمانون جرامًا من الذهب عيار إحدى وعشرين)⁩ ومضى عليه حول قمري، وبيّن الجواب حكم من هلك ماله بعد تمام الحول على وجهه."
  en: "A questioner asked about zakat when wealth perishes after it had become due. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22174) answered that zakat falls due when wealth reaches the nisab (eighty-five grams of twenty-one-carat gold) and a lunar year passes over it; the answer sets out the ruling for one whose wealth is lost after the year completes."
  ur: "ایک سائل نے پوچھا کہ زکات واجب ہونے کے بعد مال ہلاک ہو جائے تو کیا حکم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22174)⁩ نے جواب دیا کہ زکات تب واجب ہوتی ہے جب مال نصاب ⁦(اکیس کیرٹ سونے کا پچاسی گرام)⁩ تک پہنچے اور اس پر قمری سال گزر جائے؛ سال پورا ہونے کے بعد مال کے ہلاک ہونے کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre el zakat cuando la riqueza se pierde después de haber vencido. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22174) respondió que el zakat vence cuando la riqueza alcanza el nisab (ochenta y cinco gramos de oro de veintiún quilates) y transcurre un año lunar; la respuesta establece la norma para quien pierde su riqueza después de que finaliza el año."
  fr: "Un internaute a posé une question concernant la zakat en cas de perte de biens après son échéance. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22174) a répondu que la zakat est due lorsque les biens atteignent le nisab (quatre-vingt-cinq grammes d'or 21 carats) et qu'une année lunaire s'est écoulée. La réponse précise la règle applicable à celui dont les biens sont perdus après la fin de l'année."
  tr: "Bir soru soran kişi, servetin yükümlülüğünden sonra zekatın kaybolması durumunda verilen hükmü hakkında soru sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22174), servet nisaba (seksen beş gram 21 ayar altın) ulaştığında ve bir ay yılı geçmişse zekatın zorunlu olduğunu yanıtladı. Cevap, tam ay yılı yüzünde serveti kaybedilen kişinin hükmünü netleştirir."
  id: "Seorang penanya bertanya tentang putusan zakat jika kekayaan hilang setelah kewajibannya terhadapnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22174) menjawab bahwa zakat wajib jika kekayaan mencapai nisab (delapan puluh lima gram emas 21 karat) dan tahun lunar telah berlalu. Jawabannya memperjelas keputusan seseorang yang kekayaannya hilang setelah tahun lunar penuh berada di wajahnya."
