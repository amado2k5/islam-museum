id: work/fatwa-dar-alifta-eg-buy-sell-same-party-one-majlis
class: work
kind: fatwa
label: { ar: "حكم البيع والشراء من نفس الطرفين في مجلس واحد", en: "Buying and selling with the same parties in one sitting", ur: "ایک ہی مجلس میں اسی فریق سے خرید اور فروخت", es: "Comprar y vender con las mismas partes en una misma sesión.", fr: "Acheter et vendre avec les mêmes parties en une seule séance" }
summary:
  ar: "تاجر يرغب في شراء الذهب من مالكيه بثمن حال وقبل دفع ثمنه يبيعه إليهم بثمن مؤجل فسأل عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21848)⁩ ببيان حكم هذه المعاملة وضوابطها على وجهه."
  en: "A trader wishes to buy gold from its owners for a cash price and, before paying them, sell it back to them at a deferred price, and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21848) answered by setting out the ruling on this arrangement and its controls."
  ur: "ایک تاجر سونا ان کے مالکان سے نقد قیمت پر خریدنا چاہتا ہے اور قیمت ادا کرنے سے پہلے اسے انہی کو مؤجل قیمت پر واپس بیچنا چاہتا ہے؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21848)⁩ نے جواب میں اس معاملے کا حکم اور اس کے ضوابط بیان کیے۔"
  es: "Un comerciante desea comprar oro a sus propietarios al contado y, antes de pagarles, revendérselo a plazos, y solicitó una resolución judicial al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21848) respondió estableciendo la normativa sobre este acuerdo y sus controles."
  fr: "Un négociant souhaite acheter de l'or à ses propriétaires au comptant et, avant de les payer, leur revendre à un prix différé. Il a donc demandé l'avis juridique. Le Dar al-Ifta égyptien (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21848) a répondu en énonçant la règle relative à cet arrangement et ses conditions."
