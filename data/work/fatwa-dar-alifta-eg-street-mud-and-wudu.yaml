label: { ar: "أثر طين الشوارع الناتج من الأمطار على صحة الوضوء", en: "Street mud from rain and the validity of wudu", ur: "بارش کی سڑک کی کیچڑ اور وضو کی صحت", es: "El barro de la calle tras la lluvia y la validez del wudu.", fr: "La boue des rues due à la pluie et la validité des ablutions", tr: "Yağmurdan kaynaklanan sokak çamurunun abdest alma geçerliliği üzerindeki etkisi", id: "Dampak lumpur jalanan akibat hujan terhadap keabsahan wudhu" }
summary:
  ar: "سائل سأل عن طين الشوارع الناتج من الأمطار وأثره على الطهارة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22292)⁩ أن الأصل طهارة طين الشارع فإذا أصاب الوحل المكلف في بدنه أو ثيابه أو حذائه فهو طاهر ما لم تكن عين النجاسة فيه ظاهرة، على ما فصّل الجواب."
  en: "A questioner asked about street mud produced by rain and its effect on purity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22292) answered that the default is the purity of street mud: if mud strikes a person's body, clothes or shoes it is pure, unless actual impurity is evident in it — as the answer details."
  ur: "ایک سائل نے بارش سے بننے والی سڑک کی کیچڑ اور اس کے طہارت پر اثر کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22292)⁩ نے جواب دیا کہ اصول یہ ہے کہ سڑک کی کیچڑ پاک ہے: اگر کیچڑ بدن، کپڑے یا جوتے پر لگے تو وہ پاک ہے جب تک اس میں نجاست کا وجود ظاہر نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el lodo de la calle producido por la lluvia y su efecto en la pureza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22292) respondió que, por defecto, el lodo de la calle es puro: si el lodo toca el cuerpo, la ropa o los zapatos de una persona, se considera puro, a menos que presente impurezas evidentes, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la boue de rue produite par la pluie et son impact sur la pureté. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22292) a répondu que, par défaut, la boue de rue est considérée comme pure: si la boue entre en contact avec le corps, les vêtements ou les chaussures d'une personne, elle est pure, sauf si une impureté manifeste y est présente – comme le précise la réponse."
  tr: "Bir soru soran kişi, yağmurdan kaynaklanan sokaklardan çıkan çamur ve bunun saflık üzerindeki etkisi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22292), varsayılan olarak sokak çamurunun saflığını; çamur kişinin bedenine, kıyafetlerine veya ayakkabılarına değerse, cevabında ayrıntılı olarak belirtildiği gibi, içinde kirlilik gözü görünmedikçe saf sayılır."
  id: "Seorang penanya bertanya tentang lumpur dari jalanan akibat hujan dan dampaknya terhadap kemurnian. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22292) menjawab bahwa default-nya adalah kemurnian lumpur jalanan; jika lumpur menyentuh tubuh, pakaian, atau sepatu seseorang, maka ia murni kecuali mata kotoran terlihat di dalamnya, seperti yang dijelaskan dalam jawaban."
