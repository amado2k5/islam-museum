label: { ar: "قرار مجمع الفقه الإسلامي الدولي 131 (14/5) بشأن مسؤولية سائق وسائل النقل الجماعية في القتل الخطأ وتعدد الكفارة ⁦(مؤجل)⁩", en: "IIFA resolution 131 (14/5) on the mass-transit driver's liability in accidental killing and multiplicity of expiation ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 131 (14/5): عوامی نقل و حمل کے ڈرائیور کی غیر ارادی قتل میں ذمہ داری اور تکثیرِ کفارہ ⁦(مؤجل)⁩", es: "Resolución 131 (14/5) de la IIFA sobre la responsabilidad del conductor de transporte público en caso de homicidio accidental y la multiplicidad de expiaciones (aplazada)", fr: "Résolution 131 (14/5) de l'IIFA sur la responsabilité du conducteur de transport en commun en cas d'homicide involontaire et la multiplicité des dommages-intérêts (reportée)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 131 (14/5) kazara öldürme ve çoklu kefaret sorumluluğuna ilişkin (ertelenmiş)", id: "Keputusan Akademi Fiqh Islam Internasional 131 (14/5) mengenai tanggung jawab pengemudi transportasi massal atas pembunuhan tidak sengaja dan penebusan ganda (ditunda)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. أجل الموضوع لدراسة ثلاث مسائل شرعية وإعداد بحوث مستقلة في كل منها: تعدد الكفارة بتعدد القتل؛ البدائل عند فقد العاقلة أو تعذر تحملها؛ وحرمان القاتل خطأ من الإرث. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا، ونص على ما يقتضي بحثه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It deferred the topic pending study of three questions with separate research papers on each: whether expiation multiplies with the number of deaths; the alternatives where the 'aqila (the killer's extended kin liable for blood money) is absent or cannot bear it; and the accidental killer's disinheritance. Recorded as a deferral, not a final ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ اس نے موضوع کو تین شرعی مسائل کی تحقیق اور ہر ایک پر الگ مقالہ تک مؤجل کیا: کیا قتل کی تکثیر سے کفارہ بھی متعدد ہوتا ہے؛ عاقلہ ⁦(قاتل کے عائلی ذمہ داران دی کے ادا کرنے والے)⁩ کے نہ ہونے یا برداشت نہ کرنے کی صورت میں بدل؛ اور غیر ارادی قاتل کا وراثت سے محرومی۔ یہ مؤجل ہے، حتمی حکم نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (8-13 de Dhu al-Qa'da de 1423, 11-16 de enero de 2003). Se aplazó el tema a la espera del estudio de tres cuestiones, cada una con sus respectivos trabajos de investigación: si la expiación se multiplica con el número de muertes; las alternativas cuando la 'aqila (la familia extensa del asesino responsable de la indemnización por homicidio) está ausente o no puede asumirla; y la desheredación del asesino accidental. Se registró como un aplazamiento, no como una resolución definitiva."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003). Elle a reporté l'examen de la question en attendant l'étude de trois points, chacun faisant l'objet d'un document de recherche distinct: la question de savoir si l'expiation est proportionnelle au nombre de décès; les alternatives lorsque l'aqila (la famille élargie du meurtrier tenue au paiement du prix du sang) est absente ou incapable de le supporter; et la question du déshéritage du meurtrier involontaire. Cette résolution est considérée comme un report et non comme une décision définitive."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dördüncü oturumunda Doha'da (8–13 Dhu al-Qi'dah 1423 H, 11–16 Ocak 2003) toplu kararı alındı. Konu, üç hukuki konuyu incelemek ve her biri hakkında bağımsız araştırma hazırlamak üzere ertelendi: çoklu öldürmelerle çoklu kefaret; 'aqilah'ın kaybı veya taşıyamaması durumunda alternatifler; ve haksız katilin mirastan mahrum bırakılması. Bu karar nihai bir karar değil, erteleme olarak kaydedildi ve soruşturulması gerekenler belirtildi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi keempat belas di Doha (8–13 Dhu al-Qi'dah 1423 H, 11–16 Januari 2003). Topik ini ditunda untuk mempelajari tiga isu hukum dan menyiapkan penelitian independen masing-masing: penebusan ganda dengan pembunuhan berganda; alternatif dalam kasus kehilangan atau ketidakmampuan menanggung 'aqilah; dan mencabut warisan pelaku yang salah. Keputusan tersebut dicatat sebagai penundaan, bukan putusan final, dan menetapkan apa yang diperlukan penyelidikan."
