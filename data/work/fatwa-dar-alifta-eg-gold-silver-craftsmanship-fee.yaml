id: work/fatwa-dar-alifta-eg-gold-silver-craftsmanship-fee
class: work
kind: fatwa
label: { ar: "حكم إضافة قيمة المصنعية على مشغولات الذهب والفضة", en: "Adding the workmanship fee to gold and silver ware", ur: "سونے چاندی کے زیورات پر اجرتِ صنعت کا اضافہ", es: "Agregar el costo de mano de obra a los artículos de oro y plata.", fr: "Ajout des frais de main-d'œuvre aux articles en or et en argent", tr: "Altın ve gümüş iş parçalarına zanaatkarlığın değerini artırma kararı", id: "Memutuskan tentang penambahan nilai kerajinan pada benda kerja emas dan perak" }
summary:
  ar: "سائل سأل عن إضافة ما يعرف بالمصنعية إلى الثمن عند بيع الذهب والفضة المصوغين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21567)⁩ أن إضافة المصنعية إلى الثمن عند بيع الذهب والفضة المصوغين أمر جائز شرعًا شأنهما في ذلك شأن سائر السلع على ما فصّل الجواب."
  en: "A questioner asked about adding the workmanship fee to the price when selling worked gold and silver. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21567) answered that adding the fee is lawful — their case here is like other goods — as the answer details."
  ur: "ایک سائل نے سونے چاندی کے زیورات کی فروخت میں قیمت کے ساتھ اجرتِ صنعت شامل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21567)⁩ نے جواب دیا کہ یہ جائز ہے ان کا حکم بھی دوسری چیزوں جیسا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de añadir el coste de la mano de obra al precio de venta de oro y plata trabajados. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21567) respondió que añadir dicho coste es lícito —su caso es similar al de otros bienes—, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'ajout des frais de main-d'œuvre au prix de vente d'objets en or et en argent travaillés était autorisé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21567) a répondu que cet ajout était licite, leur cas étant comparable à celui des autres biens, comme le précise la réponse."
  tr: "Bir soru soran, dövme altın ve gümüş satarken fiyata zanaatkarlık olarak bilinen şeyin eklenmesi hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21567), dövülmüş altın ve gümüş satarken fiyata zanaatkarlık ücretinin eklenmesinin, diğer mallarda olduğu gibi, İslam hukukunda da izin verilebilir olduğunu yanıtlamıştır; bu da cevabında ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang penambahan apa yang disebut kerajinan pada harga saat menjual emas dan perak tempa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21567) menjawab bahwa menambahkan biaya kerajinan pada harga saat menjual emas dan perak tempa diperbolehkan dalam hukum Islam, seperti halnya barang lain, sebagaimana dijelaskan dalam jawaban."
