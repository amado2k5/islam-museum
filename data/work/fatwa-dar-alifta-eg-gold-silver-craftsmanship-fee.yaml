label: { ar: "حكم إضافة قيمة المصنعية على مشغولات الذهب والفضة", en: "Adding the workmanship fee to gold and silver ware", ur: "سونے چاندی کے زیورات پر اجرتِ صنعت کا اضافہ" }
summary:
  ar: "سائل سأل عن إضافة ما يعرف بالمصنعية إلى الثمن عند بيع الذهب والفضة المصوغين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21567)⁩ أن إضافة المصنعية إلى الثمن عند بيع الذهب والفضة المصوغين أمر جائز شرعًا شأنهما في ذلك شأن سائر السلع على ما فصّل الجواب."
  en: "A questioner asked about adding the workmanship fee to the price when selling worked gold and silver. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21567) answered that adding the fee is lawful — their case here is like other goods — as the answer details."
  ur: "ایک سائل نے سونے چاندی کے زیورات کی فروخت میں قیمت کے ساتھ اجرتِ صنعت شامل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21567)⁩ نے جواب دیا کہ یہ جائز ہے ان کا حکم بھی دوسری چیزوں جیسا ہے — جیسا کہ جواب میں تفصیل ہے۔"
