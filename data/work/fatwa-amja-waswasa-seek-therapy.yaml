id: work/fatwa-amja-waswasa-seek-therapy
class: work
kind: fatwa
label: { ar: "الوسواس والعلاج النفسي", en: "Waswasa and psychiatric treatment — no harm to faith or marriage", ur: "وسوسہ اور نفسیاتی علاج" }
summary:
  ar: "سأل سائل موسوس يخشى أثر وساوسه على إيمانه وعلى علاقته بزوجته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84392 بتاريخ 9 مايو 2011)⁩ بأن سأل الله أن يمسح عليه بيمنه الشافية ويجمع له بين الأجر والعافية وحثه على التماس أسباب العلاج من هذا الوسواس عند بعض الثقات من الأطباء النفسيين فما أنزل الله من داء إلا أنزل له دواء علمه من علمه وجهله من جهله، وما يتحدث عنه لا أثر له على إيمانه ولا على علاقته بزوجته فليطرح عنه هذا الوسواس ولا يلتفت إليه ويقبل على نفسه فيستصلح أحوالها ويتخذ رفقة صالحة تعينه على أمر دينه ودنياه ويكثر من الذكر وتلاوة القرآن."
  en: "A chronic whisperer feared his waswasa might affect his faith and his marriage. Dr. Salah al-Sawi (fatwa no. 84392, 9 May 2011) prayed God wipe over him with His healing hand and join reward with health, urging him to seek treatment for the waswasa with trustworthy psychiatrists — God sent down no illness without sending its cure, known to some and unknown to others; what he describes has no effect on his faith nor on his bond with his wife — let him cast the whispering off, give it no heed, turn to mending his own state, take righteous company aiding his religion and world, and abound in remembrance and Qur'an recitation."
  ur: "ایک موسوس سائل کو وسوسے کے ایمان اور نکاح پر اثر کا خوف تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84392، 9 مئی 2011)⁩ کے مطابق اس کا کوئی اثر نہیں — معتبر نفسیاتی معالج سے علاج کرے اور ذکر قرآن میں لگے۔"
