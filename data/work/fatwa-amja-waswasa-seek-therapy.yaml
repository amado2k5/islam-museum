id: work/fatwa-amja-waswasa-seek-therapy
class: work
kind: fatwa
label: { ar: "الوسواس والعلاج النفسي", en: "Waswasa and psychiatric treatment — no harm to faith or marriage", ur: "وسوسہ اور نفسیاتی علاج", es: "Waswasa y tratamiento psiquiátrico: no perjudican la fe ni el matrimonio.", fr: "Waswasa et traitement psychiatrique — sans incidence sur la foi ni sur le mariage" }
summary:
  ar: "سأل سائل موسوس يخشى أثر وساوسه على إيمانه وعلى علاقته بزوجته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84392 بتاريخ 9 مايو 2011)⁩ بأن سأل الله أن يمسح عليه بيمنه الشافية ويجمع له بين الأجر والعافية وحثه على التماس أسباب العلاج من هذا الوسواس عند بعض الثقات من الأطباء النفسيين فما أنزل الله من داء إلا أنزل له دواء علمه من علمه وجهله من جهله، وما يتحدث عنه لا أثر له على إيمانه ولا على علاقته بزوجته فليطرح عنه هذا الوسواس ولا يلتفت إليه ويقبل على نفسه فيستصلح أحوالها ويتخذ رفقة صالحة تعينه على أمر دينه ودنياه ويكثر من الذكر وتلاوة القرآن."
  en: "A chronic whisperer feared his waswasa might affect his faith and his marriage. Dr. Salah al-Sawi (fatwa no. 84392, 9 May 2011) prayed God wipe over him with His healing hand and join reward with health, urging him to seek treatment for the waswasa with trustworthy psychiatrists — God sent down no illness without sending its cure, known to some and unknown to others; what he describes has no effect on his faith nor on his bond with his wife — let him cast the whispering off, give it no heed, turn to mending his own state, take righteous company aiding his religion and world, and abound in remembrance and Qur'an recitation."
  ur: "ایک موسوس سائل کو وسوسے کے ایمان اور نکاح پر اثر کا خوف تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84392، 9 مئی 2011)⁩ کے مطابق اس کا کوئی اثر نہیں — معتبر نفسیاتی معالج سے علاج کرے اور ذکر قرآن میں لگے۔"
  es: "Un hombre que murmuraba constantemente temía que su waswasa pudiera afectar su fe y su matrimonio. El Dr. Salah al-Sawi (fatwa n.° 84392, 9 de mayo de 2011) oró para que Dios lo sanara con Su mano sanadora y le otorgara una recompensa junto con la salud, instándolo a buscar tratamiento para la waswasa con psiquiatras de confianza. Dios no envió ninguna enfermedad sin enviar su cura, conocida por algunos y desconocida por otros; lo que describe no afecta su fe ni su vínculo con su esposa. Que se deshaga de los susurros, que no les preste atención, que se dedique a mejorar su propia situación, que se rodee de gente justa que ayude a su religión y al mundo, y que abunde en el recuerdo y la recitación del Corán."
  fr: "Un homme souffrant de waswasa (influences maléfiques) craignait que celles-ci n'affectent sa foi et son mariage. Le Dr Salah al-Sawi (fatwa n° 84392, 9 mai 2011) a prié Dieu de le guérir et de lui accorder Sa récompense et Sa santé, l'exhortant à consulter des psychiatres de confiance pour soigner ses waswasa. Il a affirmé: « Dieu n'envoie aucune maladie sans en envoyer le remède, connu des uns et inconnu des autres; ce qu'il décrit n'a aucune incidence sur sa foi ni sur son mariage. Qu'il se débarrasse de ces waswasa, qu'il n'y prête aucune attention, qu'il se consacre à son propre bien-être, qu'il fréquente des personnes vertueuses qui œuvrent pour sa religion et le monde, et qu'il multiplie les invocations et la récitation du Coran. »"
