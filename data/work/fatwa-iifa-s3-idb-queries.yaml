summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: يجوز أخذ أجور عن خدمات القروض في حدود النفقات الفعلية وكل زيادة عليها من الربا المحرم، وبيّن أحكام عمليات الإيجار التي وعد بها البنك الإسلامي للتنمية على وجهها."
  en: "IIFA's third-session resolution (Amman, October 1986) answering the Islamic Development Bank's queries: fees for loan services may be taken within actual expenses, while any addition over actual services is riba forbidden in the sharia; it then set out the rulings of the bank's promised leasing operations."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: قرضوں کی خدمات پر حقیقی اخراجات کی حد میں فیس جائز، اضافہ ربا ہے؛ پھر بینک کی لیزنگ کارروائیوں کے احکام بیان کیے۔"
  es: "La resolución de la tercera sesión de la IIFA (Amán, octubre de 1986) en respuesta a las preguntas del Banco Islámico de Desarrollo establecía que las comisiones por servicios de préstamo podían cobrarse dentro de los gastos reales, mientras que cualquier adición sobre los servicios reales es riba, prohibida por la sharia; a continuación, exponía las normas relativas a las operaciones de arrendamiento prometidas por el banco."
