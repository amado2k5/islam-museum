label: { ar: "قرار مجمع الفقه الإسلامي الدولي 167 (18/5) بشأن المقاصد الشرعية ودورها في استنباط الأحكام", en: "IIFA resolution 167 (18/5) on the purposes of the law ⁦(maqasid)⁩ and their role in deriving rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 167 (18/5): مقاصدِ شریعت اور احکام کے استنباط میں ان کا کردار", es: "Resolución 167 (18/5) de la IIFA sobre los propósitos de la ley (maqasid) y su función en la derivación de resoluciones.", fr: "Résolution 167 (18/5) de l'IIFA sur les objectifs de la loi (maqasid) et leur rôle dans l'élaboration des décisions", tr: "Şeriatın amaçları ve hüküm çıkarmadaki rolüne ilişkin Uluslararası İslami Fiqh Akademisi Kararı 167 (18/5)", id: "Resolusi Akademi Fiqh Islam Internasional 167 (18/5) mengenai tujuan Syariah dan perannya dalam merumuskan putusan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف مقاصد الشريعة بأنها المعاني والحكم العامة والغايات التي قصد الشارع تحقيقها من تشريع الأحكام جلبًا لمصالح العباد في الدنيا والآخرة، وعدّد وظائف اعتبارها في الاجتهاد: النظر الشمولي لنصوص الشريعة وأحكامها؛ كونها من المرجحات في اختلاف الفقهاء؛ والتبصر بمآلات أفعال المكلفين وتطبيق الأحكام عليها. وقرر أن اعتبار المقاصد بمراتبها الإطار الأساس المناسب لحقوق الإنسان، وأكد أهمية استحضارها في الاجتهاد، وأن الإعمال الصحيح لها لا يعطل دلالة النصوص الشرعية والإجماعات الصحيحة، وأهمية دراسة أبعادها الاجتماعية والاقتصادية والتربوية والسياسية وأثرها في الفهم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined the maqasid of the law as the general meanings, rationales and ends the Lawgiver intended through legislating rulings to procure the servants' interests in this world and the next, and listed functions of taking them into account in ijtihad: a holistic view of the legal texts and rulings; their role among the weights that settle juristic disagreements; and foresight of the consequences of the obligated's acts when applying rulings. It resolved that the maqasid at their various levels form the proper basic frame for human rights; affirmed the importance of keeping them present in ijtihad; held that their correct employment does not suspend the import of legal texts and sound consensuses; and urged study of their social, economic, educational and political dimensions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے مقاصدِ شریعت کی تعریف کی: وہ مجموعی معانی، حکمتیں اور غايات جنہیں شارع نے احکام کی شریعت کے ذریعے بندوں کے دنیا و آخرت کے مفاد کے لیے مقصود کیا؛ اور اجتہاد میں ان کے لحاظ کے کام گنوائے: نصوص اور احکام کی کلی نظر؛ فقہی اختلافات میں ترجیح کا ذریعہ ہونا؛ اور مکلف کے اعمال کے عواقب کا شعور جب احکام منطبق ہوں۔ اس نے فیصلہ دیا کہ مقاصد اپنی مختلف درجات کے ساتھ انسانی حقوق کا مناسب بنیادی ڈھانچہ ہیں؛ اجتہاد میں ان کے استحضار کی اہمیت کی تصدیق کی؛ کہا کہ ان کا صحیح اطلاق نصوص اور درست اجماعوں کی دلالت کو معطل نہیں کرتا؛ اور ان کے سماجی، معاشی، تربیتی اور سیاسی ابعاد کے مطالعے کی تاکید کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Definió los maqasid del derecho como los significados generales, fundamentos y fines que el Legislador pretendía, mediante la legislación, para velar por los intereses de los siervos en este mundo y en el más allá, y enumeró las funciones de tenerlos en cuenta en el ijtihad: una visión holística de los textos y dictámenes jurídicos; su papel entre los criterios que resuelven las discrepancias jurídicas; y la previsión de las consecuencias de los actos del obligado al aplicar los dictámenes. Resolvió que los maqasid, en sus diversos niveles, constituyen el marco básico adecuado para los derechos humanos; afirmó la importancia de mantenerlos presentes en el ijtihad; sostuvo que su correcta aplicación no suspende la importancia de los textos jurídicos y los consensos sólidos; e instó al estudio de sus dimensiones sociales, económicas, educativas y políticas."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, 9-14 juillet 2007). Cette résolution définit les maqasid de la loi comme les significations générales, les justifications et les fins que le Législateur a voulu, par l'intermédiaire de ses décisions, assurer aux serviteurs dans ce monde et dans l'autre. Elle énumère les fonctions de leur prise en compte dans l'ijtihad: une vision globale des textes et décisions juridiques; leur rôle parmi les critères permettant de trancher les désaccords juridiques; et la capacité d'anticiper les conséquences des actes des personnes tenues de respecter la loi lors de son application. L'Académie affirme que les maqasid, à leurs différents niveaux, constituent le cadre fondamental approprié des droits de l'homme; elle souligne l'importance de les maintenir présents dans l'ijtihad; elle considère que leur utilisation correcte ne suspend pas la portée des textes juridiques et des consensus solides; et elle encourage l'étude de leurs dimensions sociales, économiques, éducatives et politiques."
  tr: "Putrajaya'daki on sekizinci oturumunda Uluslararası İslami Fiqh Akademisi'nin toplu kararı (24–29 Cumedül-Akhirah 1428 H, 9–14 Temmuz 2007). Şeriatın hedeflerini, kanuna koyucunun bu dünyada ve ahirette hizmetkârların çıkarlarına hizmet edecek kararlar çıkararak ve bunları ijtihadda değerlendirme işlevlerini sayarak ulaşmak istediği genel anlamlar, hükümler ve hedefler olarak tanımladı: Şeriat'ın kapsamlı değerlendirilmesi Metinler ve kararlar, çünkü bunlar hukukçular arasında tercih edilenler arasındadır; ve hesap verebilir olanların eylemlerinin sonuçlarına dair içgörüler ve kararları onlara uygular. Maqasid'in tüm kadrolarıyla insan hakları için uygun temel çerçeve olarak kabul edilmesi gerektiğine karar verdi, bunların ijtihadda dikkate alınmasının önemini vurguladı ve doğru uygulanmasının Şeriat metinlerinin ve doğru uzlaşığın önemini, sosyal, ekonomik, eğitimsel ve siyasi boyutlarının incelenmesinin ve anlayışa etkilerinin önemini ortadan kaldırmadığını belirtti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedelapan belas di Putrajaya (24–29 Jumada al-Akhirah 1428 H, 9–14 Juli 2007 M). Ia mendefinisikan tujuan Syariah sebagai makna umum, keputusan, dan tujuan yang ingin dicapai oleh Pembuat Undang-undang dengan membuat peraturan untuk melayani kepentingan pelayan di dunia ini dan akhirat, serta merinci fungsi pertimbangannya dalam ijtihad: pertimbangan komprehensif terhadap teks dan putusan Syariah, sebagaimana menjadi pilihan utama para ahli hukum; dan wawasan tentang hasil tindakan mereka yang bertanggung jawab dan menerapkan putusan terhadapnya. Ia memutuskan bahwa Maqasid, di semua tingkatannya, harus dianggap sebagai kerangka dasar yang tepat untuk hak asasi manusia, menekankan pentingnya mempertimbangkannya dalam ijtihad, dan bahwa penerapan yang benar tidak menghilangkan makna teks Syariah dan konsensus yang benar, serta pentingnya mempelajari dimensi sosial, ekonomi, pendidikan, dan politiknya serta dampaknya terhadap pemahaman."
