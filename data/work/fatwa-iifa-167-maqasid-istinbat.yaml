label: { ar: "قرار مجمع الفقه الإسلامي الدولي 167 (18/5) بشأن المقاصد الشرعية ودورها في استنباط الأحكام", en: "IIFA resolution 167 (18/5) on the purposes of the law ⁦(maqasid)⁩ and their role in deriving rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 167 (18/5): مقاصدِ شریعت اور احکام کے استنباط میں ان کا کردار" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. عرّف مقاصد الشريعة بأنها المعاني والحكم العامة والغايات التي قصد الشارع تحقيقها من تشريع الأحكام جلبًا لمصالح العباد في الدنيا والآخرة، وعدّد وظائف اعتبارها في الاجتهاد: النظر الشمولي لنصوص الشريعة وأحكامها؛ كونها من المرجحات في اختلاف الفقهاء؛ والتبصر بمآلات أفعال المكلفين وتطبيق الأحكام عليها. وقرر أن اعتبار المقاصد بمراتبها الإطار الأساس المناسب لحقوق الإنسان، وأكد أهمية استحضارها في الاجتهاد، وأن الإعمال الصحيح لها لا يعطل دلالة النصوص الشرعية والإجماعات الصحيحة، وأهمية دراسة أبعادها الاجتماعية والاقتصادية والتربوية والسياسية وأثرها في الفهم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). It defined the maqasid of the law as the general meanings, rationales and ends the Lawgiver intended through legislating rulings to procure the servants' interests in this world and the next, and listed functions of taking them into account in ijtihad: a holistic view of the legal texts and rulings; their role among the weights that settle juristic disagreements; and foresight of the consequences of the obligated's acts when applying rulings. It resolved that the maqasid at their various levels form the proper basic frame for human rights; affirmed the importance of keeping them present in ijtihad; held that their correct employment does not suspend the import of legal texts and sound consensuses; and urged study of their social, economic, educational and political dimensions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے مقاصدِ شریعت کی تعریف کی: وہ مجموعی معانی، حکمتیں اور غايات جنہیں شارع نے احکام کی شریعت کے ذریعے بندوں کے دنیا و آخرت کے مفاد کے لیے مقصود کیا؛ اور اجتہاد میں ان کے لحاظ کے کام گنوائے: نصوص اور احکام کی کلی نظر؛ فقہی اختلافات میں ترجیح کا ذریعہ ہونا؛ اور مکلف کے اعمال کے عواقب کا شعور جب احکام منطبق ہوں۔ اس نے فیصلہ دیا کہ مقاصد اپنی مختلف درجات کے ساتھ انسانی حقوق کا مناسب بنیادی ڈھانچہ ہیں؛ اجتہاد میں ان کے استحضار کی اہمیت کی تصدیق کی؛ کہا کہ ان کا صحیح اطلاق نصوص اور درست اجماعوں کی دلالت کو معطل نہیں کرتا؛ اور ان کے سماجی، معاشی، تربیتی اور سیاسی ابعاد کے مطالعے کی تاکید کی۔"
