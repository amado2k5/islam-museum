label: { ar: "دفع الزكاة للحملات السياسية", en: "Giving Zakat for Political Campaigns", ur: "سیاسی مہمات کے لیے زکات دینا", es: "Donar Zakat para campañas políticas", fr: "Versement de la Zakat pour les campagnes politiques", tr: "Siyasi Kampanyalar İçin Zekat Ödemek", id: "Membayar Zakat untuk Kampanye Politik" }
summary:
  ar: "سؤال عن جواز دفع الزكاة لحملات سياسية تُرجى لتغيير السياسة العامة في قضية إنسانية جارية. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر بتاريخ 24 أكتوبر 2026 تقريبًا بحسب ترتيب الموقع)⁩، وتناول الجواب أصناف مصارف الزكاة الثمانية في القرآن وما إذا كانت الحملات السياسية تدخل في باب «في سبيل الله» أو غيره من الأصناف عند توسيع التطبيق المعاصر لها."
  en: "A question whether zakat may be given to political campaigns hoped to change public policy on an ongoing humanitarian crisis. The Fiqh Council of North America's answer examines the eight Qur'anic categories of zakat disbursement and whether political campaigns fall under 'in the path of God' or another category under a contemporary extension of their application."
  ur: "سوال: کیا زکات ایسی سیاسی مہمات کو دی جا سکتی ہے جن سے کسی جاری انسانی بحران پر عوامی پالیسی بدلنے کی امید ہو؟ فقہ کونسل آف نارتھ امریکہ کے جواب میں زکات کے آٹھ قرآنی مصارف کا جائزہ لیا گیا اور یہ دیکھا گیا کہ کیا سیاسی مہمات 'فی سبیل اللہ' یا کسی اور صنف میں داخل ہوتی ہیں ان کے معاصر اطلاق میں۔"
  es: "Se plantea la cuestión de si el zakat puede destinarse a campañas políticas que buscan modificar las políticas públicas en el contexto de una crisis humanitaria en curso. La respuesta del Consejo de Jurisprudencia Islámica de Norteamérica examina las ocho categorías coránicas de distribución del zakat y determina si las campañas políticas se encuadran en la categoría de \"en el camino de Dios\" o en alguna otra, según una extensión contemporánea de su aplicación."
  fr: "La question de savoir si la zakat peut être versée à des campagnes politiques visant à modifier les politiques publiques face à une crise humanitaire en cours a été soulevée. La réponse du Conseil de jurisprudence islamique d'Amérique du Nord examine les huit catégories coraniques de versement de la zakat et détermine si les campagnes politiques relèvent de la catégorie « sur le chemin de Dieu » ou d'une autre catégorie, selon une interprétation contemporaine plus large de leur application."
  tr: "Devam eden insani bir konuda kamu politikasını değiştirmeyi uman siyasi kampanyalar için zekat ödemenin izin verilebilirliği hakkında bir soru. Kuzey Amerika Fiqh Konseyi (web sitesi emrine göre 24 Ekim 2026 civarında yayımlandı) yanıt verdi ve Kur'an'daki sekiz tür zekat kullanımını ve siyasi kampanyaların çağdaş uygulamaları genişletildiğinde \"Allah yoluyla\" veya başka kategoriler altında olup olmadığını ele aldı."
  id: "Sebuah pertanyaan tentang kelayakan membayar zakat untuk kampanye politik yang berharap dapat mengubah kebijakan publik dalam isu kemanusiaan yang sedang berlangsung. Dewan Fiqh Amerika Utara (diterbitkan sekitar 24 Oktober 2026, sesuai urutan situs web) menjawab, membahas delapan jenis penggunaan zakat dalam Al-Qur'an dan apakah kampanye politik termasuk dalam kategori \"di jalan Allah\" atau kategori lain ketika aplikasi kontemporernya diperluas."
