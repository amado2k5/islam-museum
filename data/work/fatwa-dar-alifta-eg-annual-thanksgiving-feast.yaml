summary:
  ar: "سائل سأل عن وليمة اعتادها والده مرة كل عام شكرًا لله على نعمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22367)⁩ أنها جائزة شرعًا لكونها مندرجة تحت إطعام الطعام المندوب إليه، على ما فصّل الجواب."
  en: "A questioner asked about a feast his father holds once a year in thanks to God for His blessings. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22367) answered that it is lawful — it falls under the recommended feeding of food — as the answer details."
  ur: "ایک سائل نے اپنے والد کی طرف سے ہر سال اللہ کے نعمتوں کے شکر میں رکھے جانے والے ولیمے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22367)⁩ نے جواب دیا کہ یہ جائز ہے کیونکہ وہ مستحب کھانا کھلانے میں داخل ہے، جیسا کہ جواب میں تفصیل ہے۔"
