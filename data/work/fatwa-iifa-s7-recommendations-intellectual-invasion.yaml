summary:
  ar: "نص توصيات الدورة السابعة لمجلس مجمع الفقه الإسلامي الدولي ⁦(مكة، مايو 1992م)⁩ بشأن ما سمّته المجمع الغزو الفكري، كما نشرتها الأمانة العامة على موقع المجمع، مسجلة منسوبة إلى المجمع."
  en: "The recommendations of IIFA's seventh session (Mecca, May 1992) on what it terms intellectual invasion, as published by the Academy's secretariat on its site — recorded as the Academy's own text."
  ur: "اکیڈمی کی ساتویں مجلس ⁦(مکہ، مئی 1992ء)⁩ کی سفارشات فکری یلغار کے موضوع پر — اکیڈمی کے اپنے متن کا خلاصہ۔"
  es: "Las recomendaciones de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre lo que denomina invasión intelectual, publicadas por la secretaría de la Academia en su sitio web —registradas como texto oficial de la Academia—."
  fr: "Les recommandations de la septième session de l'IIFA (La Mecque, mai 1992) sur ce qu'elle appelle l'invasion intellectuelle, telles que publiées par le secrétariat de l'Académie sur son site — enregistrées comme texte propre à l'Académie."
  tr: "Uluslararası İslami Fikh Akademisi Konseyi'nin (Mekke, Mayıs 1992) yedinci oturumunun önerilerinin metni, Genel Sekreterlik tarafından Akademi'nin web sitesinde yayımlanan, Akademi'ye kayıtlı ve atfedilen bu konuda Akademi'ye atfedilmiştir."
  id: "Teks rekomendasi sesi ketujuh Dewan Akademi Fiqh Islam Internasional (Mekah, Mei 1992) mengenai apa yang disebut Akademi sebagai invasi intelektual, sebagaimana dipublikasikan oleh Sekretariat Jenderal di situs web Akademi, terdaftar dan dikaitkan dengan Akademi."
