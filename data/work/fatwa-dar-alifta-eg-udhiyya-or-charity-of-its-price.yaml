label: { ar: "بيان الأفضلية بين الأضحية أو التصدق بثمنها", en: "Which is better — the udhiyya or giving its price in charity?", ur: "قربانی افضل یا اس کی قیمت صدقہ کرنا" }
summary:
  ar: "سائل سأل عن الأفضل بين الأضحية أو التصدق بثمنها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20672)⁩ أن الأضحية في وقتها أفضل من التصدق بثمنها أما في غير وقتها فتكون تبعًا للحال التي تراعى فقد تكون الصدقة أفضل على ما فصّل الجواب."
  en: "A questioner asked which is better — the udhiyya or giving its price in charity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20672) answered that in its time the sacrifice is better; outside its time it follows the circumstance, and charity may then be better — as the answer details."
  ur: "ایک سائل نے قربانی یا اس کی قیمت کا صدقہ میں افضلیت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20672)⁩ نے جواب دیا کہ اپنے وقت میں قربانی افضل ہے؛ بوقت کے باہر حالات کے مطابق صدقہ بہتر ہو سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
