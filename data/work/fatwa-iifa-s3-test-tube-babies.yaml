label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن أطفال الأنابيب", en: "IIFA resolution on test-tube babies", ur: "اکیڈمی کی قرارداد: ٹیوب بچوں کے بارے میں", es: "Resolución de la IIFA sobre bebés probeta", fr: "Résolution de l'IIFA sur les bébés éprouvettes" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩ بعد تأجيل الدورة الثانية: نصّ على خمس طرق محرمة شرعًا وممنوعة منعًا باتًّا لذاتها أو لما يترتب عليها من اختلاط الأنساب وضياع الأمومة وغيرها من المحاذير، منها التلقيح بين نطفة زوج وبييضة امرأة ليست زوجته تزرع في رحم زوجته، وجوّز الطريقتين اللتين يجري فيهما التلقيح بين الزوجين في إطار الزوجية القائمة على ما فصّل."
  en: "IIFA's third-session resolution (Amman, October 1986), after the second session's deferral: it named five methods as forbidden in the sharia — absolutely barred for themselves or for what they entail in lineage confusion, lost motherhood and other prohibited consequences — including fertilisation between a husband's sperm and the ovum of a woman not his wife implanted in the wife's womb; and it permitted the two methods where fertilisation is between the spouses within the existing marriage, as it details."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: پانچ طریقے حرام قرار دیے کیونکہ ان سے نسبوں کا اختلاط ہوتا ہے؛ دو طریقے جو خاوند اور بیوی کے درمیان جائز ازدواجی دائرے میں ہوں جائز قرار دیے۔"
  es: "La resolución de la tercera sesión de la IIFA (Amán, octubre de 1986), tras el aplazamiento de la segunda sesión, nombró cinco métodos como prohibidos por la sharia —absolutamente vetados por sí mismos o por lo que implican en términos de confusión de linaje, pérdida de la maternidad y otras consecuencias prohibidas—, incluida la fecundación entre el esperma de un marido y el óvulo de una mujer que no es su esposa, implantado en el útero de la esposa; y permitió los dos métodos en los que la fecundación se produce entre los cónyuges dentro del matrimonio existente, como se detalla en la resolución."
  fr: "La résolution de la troisième session de l'IIFA (Amman, octobre 1986), après le report de la deuxième session: elle a désigné cinq méthodes comme interdites par la charia — absolument interdites en elles-mêmes ou pour ce qu'elles entraînent en termes de confusion de lignée, de perte de maternité et d'autres conséquences prohibées — y compris la fécondation entre le sperme d'un mari et l'ovule d'une femme qui n'est pas son épouse implanté dans l'utérus de l'épouse; et elle a autorisé les deux méthodes où la fécondation a lieu entre les époux au sein du mariage existant, comme elle le détaille."
