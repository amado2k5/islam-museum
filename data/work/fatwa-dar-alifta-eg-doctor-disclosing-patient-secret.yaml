id: work/fatwa-dar-alifta-eg-doctor-disclosing-patient-secret
class: work
kind: fatwa
label: { ar: "حكم إفشاء الطبيب سر المريض إذا خشي الضرر على الآخرين", en: "A doctor disclosing a patient's secret when harm to others is feared", ur: "دوسروں کو نقصان کے خوف پر ڈاکٹر کا مریض کا راز فاش کرنا", es: "Un médico que revela el secreto de un paciente cuando se teme que otros puedan sufrir daños.", fr: "Un médecin divulguant le secret d'un patient lorsqu'il craint que cela ne nuise à autrui." }
summary:
  ar: "سائل سأل عن إفشاء الطبيب سر المريض إذا خشي الضرر على الآخرين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22068)⁩ أن الأصل حرمة إفشاء الطبيب أسرار مرضاه التي اطلع عليها بحكم مهنته ما لم توجد ضرورة تستوجب ذلك فإن وجدت أباحت الإفشاء بقدرها على ما فصّل الجواب."
  en: "A questioner asked about a doctor disclosing a patient's secret when he fears harm to others. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22068) answered that the default is the prohibition of a doctor disclosing patients' secrets learned through his profession — unless a necessity requires it, in which case disclosure is permitted to its extent, as the answer details."
  ur: "ایک سائل نے دوسروں کو نقصان کے خوف پر ڈاکٹر کے مریض کا راز فاش کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22068)⁩ نے جواب دیا کہ اصولاً ڈاکٹر کا اپنے پیشے کے سبب جانے ہوئے مریضوں کے راز فاش کرنا حرام ہے — جب تک کوئی ضرورت اس کا تقاضا نہ کرے، جس کی صورت میں اسی قدر افشاء جائز ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que un médico revele el secreto de un paciente cuando teme perjudicar a terceros. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22068) respondió que, por defecto, está prohibido que un médico revele los secretos de sus pacientes obtenidos en el ejercicio de su profesión, salvo que la necesidad lo exija, en cuyo caso la divulgación está permitida en la medida en que lo requiera, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la divulgation par un médecin d'un secret médical lorsqu'il craint de nuire à autrui. La Dar al-Ifta égyptienne (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 22068) a répondu que, par défaut, il est interdit à un médecin de divulguer des secrets médicaux appris dans le cadre de sa profession, sauf en cas de nécessité, auquel cas la divulgation est permise dans les limites indiquées dans la réponse."
