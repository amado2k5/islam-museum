label: { ar: "كتاب مسيلمة إلى النبي", en: "Musaylima's letter to the Prophet", es: "Carta de Musaylima al Profeta", fr: "Lettre de Musaylima au Prophète", ur: "مسیلمہ کا رسول اللہ کو خط", tr: "Musaylimah'ın Peygambere Kitabı", id: "Kitab Musaylimah kepada Nabi" }
summary:
  ar: "رسالة قصيرة من مسيلمة بن حبيب إلى النبي في آخر سنة عشر يسمّي فيها نفسه رسول الله ويقول إنه أُشرك في الأمر معه وإن له نصف الأرض ولقريش نصفها ولكن قريشاً قوم يعتدون؛ أجاب النبي عنها بأن الأرض لله يورثها من يشاء والعاقبة للمتقين."
  en: "A short letter from Musaylima ibn Habib to the Prophet at the end of 10 AH in which he calls himself the messenger of God, claims to have been made a partner in the matter, with half the earth his and half Quraysh's, though Quraysh transgress; the Prophet replied that the earth is God's to give to whom He wills, and the outcome is for the God-fearing."
  es: "Una breve carta de Musaylima ibn Habib al Profeta a finales del año 10 AH en la que se llama a sí mismo el mensajero de Dios, afirma haber sido hecho socio en el asunto, con la mitad de la tierra para él y la otra mitad para los Quraysh, aunque los Quraysh transgreden; el Profeta respondió que la tierra es de Dios para darla a quien Él quiera, y el resultado es para los temerosos de Dios."
  fr: "Dans une courte lettre adressée au Prophète à la fin de l'an 10 de l'Hégire, Musaylima ibn Habib se nomme le messager de Dieu et prétend avoir été associé à Quraysh dans cette affaire, la moitié de la terre lui appartenant et l'autre moitié aux Quraysh, bien que ces derniers aient transgressé les règles. Le Prophète répondit que la terre appartient à Dieu et qu'il peut la donner à qui Il veut, et que la victoire revient aux pieux."
  ur: "مسیلمہ بن حبیب کی طرف سے 10 ہجری کے آخر میں نبی کو ایک مختصر خط جس میں وہ خود کو خدا کا رسول کہتا ہے، اس معاملے میں اس کا شریک ہونے کا دعویٰ کرتا ہے، آدھی زمین اس کی اور آدھی قریش کی، حالانکہ قریش حد سے تجاوز کرتے ہیں۔ نبی نے جواب دیا کہ زمین اللہ کی ہے جسے چاہے دے، اور نتیجہ پرہیزگاروں کے لیے ہے۔"
  tr: "Musaylimah ibn Habib'in onuncu yılın sonunda Peygamber'e yazdığı kısa bir mektupta, kendisini Allah'ın Elçisi olarak adlandırdığı ve bu meselede kendisiyle ortak olduğunu, toprağın yarısına sahip olduğunu, Qureyşlerin ise yarısına sahip olduğunu, ancak Qureyşlerin saldırgan bir halk olduğunu belirtmiştir. Peygamber, yeryüzün Allah'a aittir, Onu istediği kişiye miras alır ve sonucun doğru olanlar için olduğunu belirtmiştir."
  id: "Surat singkat dari Musaylimah ibn Habib kepada Nabi pada akhir tahun kesepuluh, di mana ia menyebut dirinya Rasulullah dan mengatakan bahwa ia telah bersekutu dengannya dalam hal ini, dan bahwa ia memiliki setengah tanah dan Quraisy memiliki setengahnya, tetapi Quraisy adalah bangsa yang bersikap agresif. Nabi menjawab bahwa bumi ini milik Allah, Ia mewarisinya sesiapa pun yang dikehendaki, dan hasilnya adalah bagi orang yang bersekutu."
