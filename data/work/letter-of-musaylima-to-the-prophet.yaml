summary:
  ar: "رسالة قصيرة من مسيلمة بن حبيب إلى النبي في آخر سنة عشر يسمّي فيها نفسه رسول الله ويقول إنه أُشرك في الأمر معه وإن له نصف الأرض ولقريش نصفها ولكن قريشاً قوم يعتدون؛ أجاب النبي عنها بأن الأرض لله يورثها من يشاء والعاقبة للمتقين."
  en: "A short letter from Musaylima ibn Habib to the Prophet at the end of 10 AH in which he calls himself the messenger of God, claims to have been made a partner in the matter, with half the earth his and half Quraysh's, though Quraysh transgress; the Prophet replied that the earth is God's to give to whom He wills, and the outcome is for the God-fearing."
