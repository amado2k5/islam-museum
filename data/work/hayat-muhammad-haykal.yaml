structure: "الإهداء (ص9)؛ سجل المراجع العربية والإفرنجية (ص11)؛ تعريف بالكتاب للمراغي (ص15–20)؛ تقديم الكتاب (ص23)؛ تقديم الطبعة الثانية (ص45)؛ تقديم الطبعة الثالثة (ص81)؛ 31 فصلاً: بلاد العرب قبل الإسلام (ص83)، مكة والكعبة وقريش (ص99)، ... قصة الغرانيق (ص167)، ... غزوة بدر الكبرى (ص253)، غزوة أحد (ص281)، أزواج النبي (ص305)، ... فتح مكة (ص387)، ... حجة الوداع (ص449)، مرض النبي ووفاته (ص459)، دفن الرسول (ص471)؛ خاتمة في مبحثين، أولهما الحضارة الإسلامية كما صورها القرآن (ص481)؛ تقدير وشكر (ص537)."
