label: { ar: "حياة محمد", en: "Hayat Muhammad (The Life of Muhammad)", ur: "حیاتِ محمد" }
summary:
  ar: "سيرة نبوية حديثة لمحمد حسين هيكل، قدّم لها شيخ الأزهر محمد مصطفى المراغي في 15 فبراير 1935، كتبها مؤلفها على ما يسميه الطريقة العلمية الحديثة وجعل القرآن أوثق مراجعها، وردّ فيها على ما كتبه المستشرقون كموير ودرمنجم، ونفدت طبعتها الأولى — عشرة آلاف نسخة — في نحو ثلاثة أشهر."
  en: "A modern biography of the Prophet by Muhammad Husayn Haykal, introduced by the Shaykh of al-Azhar Muhammad Mustafa al-Maraghi on 15 February 1935; the author wrote it by what he calls the modern scientific method, treated the Qur'an as its most reliable source, and answered Orientalists such as Muir and Dermenghem. Its first edition of ten thousand copies sold out in about three months."
