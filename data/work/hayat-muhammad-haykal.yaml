label: { ar: "حياة محمد", en: "Hayat Muhammad (The Life of Muhammad)", ur: "حیاتِ محمد", es: "Hayat Muhammad (La vida de Mahoma)", fr: "Hayat Muhammad (La Vie de Muhammad)", tr: "Hayat Mohammed", id: "Hayat Mohammed" }
summary:
  ar: "سيرة نبوية حديثة لمحمد حسين هيكل، قدّم لها شيخ الأزهر محمد مصطفى المراغي في 15 فبراير 1935، كتبها مؤلفها على ما يسميه الطريقة العلمية الحديثة وجعل القرآن أوثق مراجعها، وردّ فيها على ما كتبه المستشرقون كموير ودرمنجم، ونفدت طبعتها الأولى — عشرة آلاف نسخة — في نحو ثلاثة أشهر."
  en: "A modern biography of the Prophet by Muhammad Husayn Haykal, introduced by the Shaykh of al-Azhar Muhammad Mustafa al-Maraghi on 15 February 1935; the author wrote it by what he calls the modern scientific method, treated the Qur'an as its most reliable source, and answered Orientalists such as Muir and Dermenghem. Its first edition of ten thousand copies sold out in about three months."
  es: "Biografía moderna del Profeta, escrita por Muhammad Husayn Haykal e introducida por el jeque de al-Azhar, Muhammad Mustafa al-Maraghi, el 15 de febrero de 1935. El autor la escribió utilizando lo que él denomina el método científico moderno, considerando el Corán como su fuente más fiable y respondiendo a orientalistas como Muir y Dermenghem. Su primera edición, de diez mil ejemplares, se agotó en aproximadamente tres meses."
  fr: "Une biographie moderne du Prophète par Muhammad Husayn Haykal, présentée par le cheikh d'al-Azhar Muhammad Mustafa al-Maraghi le 15 février 1935. L'auteur, s'appuyant sur une méthode qu'il qualifie de scientifique moderne, considère le Coran comme sa source la plus fiable et répond aux orientalistes tels que Muir et Dermenghem. La première édition, tirée à dix mille exemplaires, fut épuisée en trois mois environ."
  ur: "محمد حسین ہیکل کی ایک جدید سوانح حیات، جسے شیخ الازہر محمد مصطفیٰ المراغی نے 15 فروری 1935 کو متعارف کرایا؛ مصنف نے اسے جدید سائنسی طریقہ کے ذریعہ لکھا، قرآن کو اس کا سب سے قابل اعتماد ذریعہ سمجھا، اور مستشرقین جیسے Muir اور Dermenghem کو جواب دیا۔ اس کی دس ہزار کاپیاں کا پہلا ایڈیشن تقریباً تین ماہ میں فروخت ہو گیا۔"
  tr: "Muhammed Hüseyin Haykal'in modern peygamberlik biyografisi, 15 Şubat 1935'te El-Ezher Şeyhi Muhammed Mustafa El-Maraghi tarafından sunulmuştur. Yazar, modern bilimsel yöntem olarak adlandırdığı yöntemle yazmış ve Kur'an'ı en güvenilir kaynak yapmıştır. Muir ve Darmanjam gibi Oryantalistlerin yazdıklarını çürütmektedir. İlk baskısı — on bin kopya — yaklaşık üç ayda tükenmiştir."
  id: "Biografi nubuat modern Muhammad Hussein Heikal, dipresentasikan oleh Sheikh Al-Azhar Muhammad Mustafa Al-Maraghi pada 15 Februari 1935. Penulisnya menulisnya sesuai dengan apa yang ia sebut metode ilmiah modern, menjadikan Al-Quran sebagai referensi paling dapat diandalkan. Buku ini membantah apa yang ditulis oleh orientalis seperti Muir dan Darmanjam. Edisi pertamanya—sepuluh ribu eksemplar—terjual habis dalam waktu sekitar tiga bulan."
