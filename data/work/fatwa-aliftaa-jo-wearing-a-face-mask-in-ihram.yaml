id: work/fatwa-aliftaa-jo-wearing-a-face-mask-in-ihram
class: work
kind: fatwa
label: { ar: "لبس الكمامة للمحرم", en: "Wearing a face mask in ihram", ur: "احرام میں ماسک پہننا" }
summary:
  ar: "سؤال عن لبس الكمامة للمحرم، أجابت فيه دائرة الإفتاء العام الأردنية بأن لبس الرجل الكمامة في الإحرام من المحظورات الموجبة للفدية ابتداء، لكن إن ألزمت الجهات الرسمية المحرم بلبسها بسبب الأوبئة جاز للرجل والمرأة ولا إثم ولا فدية. أجابت الدائرة بأن الأصل حرمة تغطية المرأة المحرمة وجهها، ويباح للرجل ستر وجهه بما لا يعد ملبوسًا مخيطًا عادة، واستدلت بحديث رواه البخاري في الثياب التي يجتنبها المحرم، ومنه ألا تنتقب المرأة المحرمة ولا تلبس القفازين، ونقلت عن النووي في متن الإيضاح في المناسك (ص45) أن غير الرأس لا يحرم ستره بالإزار والرداء، وإنما يحرم الملبوس المعمول على قدر البدن أو عضو منه. وقالت إن وضع الرجل الكمامة على وجهه في الإحرام من المحظورات التي تجب فيها الفدية ابتداء لأنها ملبوس يغطي جزءًا من البدن، لكن إن أجبرت الجهات الرسمية المحرم على لبسها بسبب الأوبئة ونحوها أبيح ذلك للرجل والمرأة بلا فدية ولا إثم، واستندت إلى شرح المقدمة الحضرمية (ص666) فيما يباح للحاجة وما يفعل إكراهًا. وخلصت إلى أن الالتزام بهذه التعليمات أولى من مخالفتها وتعريض النفس والآخرين لخطر العدوى."
  en: "A question about wearing a face mask in ihram, in which Jordan's General Iftaa Department answered that a man wearing a face mask in ihram commits a prohibited act that in principle requires a compensatory offering (fidya), but if the authorities require masks because of epidemics, men and women may wear them with no sin and no fidya. The Department answered that in principle a woman in ihram may not cover her face, while a man may cover his face with something not normally considered a fitted garment, citing a hadith narrated by al-Bukhari on the garments a pilgrim avoids, including that a woman in ihram should not wear a face veil or gloves, and quoting al-Nawawi in Matn al-Idah fi al-Manasik (p. 45) that covering parts other than the head with a wrap or cloak is not forbidden, only garments made to fit the body or one of its limbs. It said that a man placing a mask over his face in ihram is in principle a prohibited act requiring fidya, since it is a garment covering part of the body; but if the authorities compel pilgrims to wear masks because of epidemics or similar reasons, it is permitted for men and women without fidya or sin, relying on Sharh al-Muqaddima al-Hadramiyya (p. 666) on what is permitted out of need and what is done under compulsion. It concluded that following these instructions is better than breaking them and exposing oneself and others to the risk of infection."
  ur: "احرام میں ماسک پہننا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ احرام میں مرد کا ماسک پہننا اصلاً ممنوع ہے جس پر فدیہ واجب ہوتا ہے، لیکن اگر سرکاری ادارے وبا کی وجہ سے ماسک لازم کریں تو مرد و عورت دونوں کے لیے جائز ہے، نہ گناہ نہ فدیہ۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ احرام والی عورت چہرہ نہیں ڈھانپ سکتی، جبکہ مرد ایسی چیز سے چہرہ ڈھانپ سکتا ہے جو عادتاً سلا ہوا لباس نہ سمجھی جائے، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس میں ان کپڑوں کا ذکر ہے جن سے محرم بچے، جن میں یہ بھی ہے کہ احرام والی عورت نقاب اور دستانے نہ پہنے، اور متن الایضاح فی المناسک (ص 45) میں نووی سے نقل کیا کہ سر کے علاوہ حصوں کو تہبند اور چادر سے ڈھانپنا حرام نہیں، صرف وہ لباس حرام ہے جو جسم یا کسی عضو کے ناپ پر بنا ہو۔ اس نے کہا کہ احرام میں مرد کا چہرے پر ماسک لگانا اصلاً ایسا ممنوع کام ہے جس پر فدیہ واجب ہے کیونکہ یہ جسم کے حصے کو ڈھانپنے والا لباس ہے؛ لیکن اگر سرکاری ادارے وبا وغیرہ کی وجہ سے محرم کو ماسک پر مجبور کریں تو مرد و عورت دونوں کے لیے بغیر فدیہ اور گناہ کے جائز ہے، اور ضرورت کے تحت مباح اور جبراً کیے گئے کاموں کے بارے میں شرح المقدمۃ الحضرمیہ (ص 666) پر اعتماد کیا۔ اس نے نتیجہ نکالا کہ ان ہدایات کی پابندی ان کی خلاف ورزی کر کے خود کو اور دوسروں کو انفیکشن کے خطرے میں ڈالنے سے بہتر ہے۔"
