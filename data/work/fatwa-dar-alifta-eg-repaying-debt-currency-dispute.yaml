id: work/fatwa-dar-alifta-eg-repaying-debt-currency-dispute
class: work
kind: fatwa
label: { ar: "كيفية سداد الدين إذا وقع خلاف بين الورثة والدائن في تعيين نوع العملة", en: "Repaying a debt when heirs and creditor disagree on the currency", ur: "جب ورثاء اور قرض خواہ میں کرنسی پر اختلاف ہو تو قرض کیسے ادا ہو", es: "Reembolsar una deuda cuando los herederos y el acreedor no se ponen de acuerdo sobre la moneda.", fr: "Remboursement d'une dette lorsque les héritiers et le créancier sont en désaccord sur la devise", tr: "Varisler ile alacaklı arasında para birimi türünün belirlenmesi konusunda bir anlaşmazlık olduğunda borcun nasıl geri ödeneceği", id: "Cara melunasi utang jika ada perselisihan antara ahli waris dan kreditur mengenai penentuan jenis mata uang" }
summary:
  ar: "سائل سأل عن كيفية سداد قرض أخذه ميته والد إذا اختلف الورثة والدائن في تعيين نوع العملة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22551)⁩ أن القرض إن كان قد جرى بعملة الجنيه المصري فيجب شرعًا سداده بمثله دون زيادة مشروطة في قدره أو صفته، وإنما تكون الزيادة تبرعًا، وبيّن الجواب الضوابط."
  en: "A questioner asked how to repay a loan his late father had taken when the heirs and the creditor disagree over the currency of repayment. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22551) answered that if the loan was made in Egyptian pounds it must legally be repaid in the same, with no stipulated addition to its amount or quality — any addition being voluntary — as the answer's controls set out."
  ur: "ایک سائل نے اپنے مرحوم والد کے لیے گئے قرض کی ادائیگی کا طریقہ پوچھا جب ورثاء اور قرض خواہ کرنسی کی تعیین پر اختلاف رکھتے ہوں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22551)⁩ نے جواب دیا کہ اگر قرض مصری پاؤنڈ میں لیا گیا ہو تو شرعاً اسی میں ادا کرنا واجب ہے بغیر مقدار یا صفت میں مشروط اضافے کے — کوئی اضافہ صرف رضاکارانہ ہو گا — جیسا کہ جواب کے ضوابط بیان کرتے ہیں۔"
  es: "Un consultante preguntó cómo saldar un préstamo que su difunto padre había contraído cuando los herederos y el acreedor no se ponían de acuerdo sobre la moneda de pago. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22551) respondió que si el préstamo se realizó en libras egipcias, legalmente debe ser reembolsado en la misma moneda, sin estipular ningún aumento en su importe o cantidad —cualquier aumento sería voluntario—, tal como se establece en las normas de la respuesta."
  fr: "Un homme a demandé comment rembourser un prêt contracté par son défunt père lorsque les héritiers et le créancier divergent quant à la devise de remboursement. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22551) a répondu que si le prêt avait été consenti en livres égyptiennes, il devait légalement être remboursé dans cette même devise, sans aucune modification de montant ni de nature – toute modification étant facultative – conformément aux conditions énoncées dans la fatwa."
  tr: "Bir soru soran, mirasçılar ve alacaklılar para biriminin türünü belirlemede farklılık gösteriyorsa, ölen babanın aldığı bir borcun nasıl geri ödeneceğini sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22551), kredinin Mısır poundu para birimiyle verildiyse, kredi değerinde veya statüsünde herhangi bir koşullu artış olmaksızın eşdeğeriyle geri ödenmesinin dini zorunluluk olduğunu yanıtladı. Bu artış gönüllü bir bağış olarak kabul edilir. Cevap, düzenlemeleri netleştirir."
  id: "Seorang penanya bertanya bagaimana cara membayar kembali pinjaman yang diambil oleh ayah yang telah meninggal jika ahli waris dan kreditur berbeda dalam menentukan jenis mata uang. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22551) menjawab bahwa jika pinjaman dilakukan dalam mata uang pound Mesir, maka secara agama wajib melunasinya dengan setara tanpa kenaikan nilai atau status bersyarat. Kenaikan tersebut dianggap sebagai donasi sukarela. Jawabannya memperjelas peraturan."
