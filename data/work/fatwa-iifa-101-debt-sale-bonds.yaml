id: work/fatwa-iifa-101-debt-sale-bonds
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 101 (11/4) بشأن بيع الدين وسندات القرض وبدائلها الشرعية", en: "IIFA resolution 101 (11/4) on the sale of debt, loan bonds and their lawful alternatives", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 101 (11/4): قرض کی فروخت، قرض بانڈز اور ان کے شرعی بدل" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. قرر أنه لا يجوز بيع الدين المؤجل من غير المدين بنقد معجل من جنسه أو من غير جنسه لإفضائه إلى الربا، ولا بيعه بنقد مؤجل من جنسه أو غير جنسه لأنه من بيع الكالئ بالكالئ المنهي عنه، ولا فرق بين كون الدين ناشئًا عن قرض أو بيع آجل. وأكد قراريه 60 ⁦(6/11)⁩ بشأن السندات ⁦(دورة جدة 1410هـ/1990م)⁩ والفقرة ⁦(ثالثًا)⁩ من قراره 7/2/64 بشأن حسم الأوراق التجارية، وتناول البدائل الشرعية لتمويل القطاعين العام والخاص ⁦(كالصكوك والمشاركة)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It ruled that a deferred debt may not be sold to anyone other than the debtor for cash on the spot, of the same or another kind, since it leads to riba; nor sold for deferred cash of the same or another kind as that is the prohibited sale of debt for debt — whether the debt arose from a loan or a deferred sale. It reaffirmed resolutions 60 (6/11) on bonds (Jeddah, 1990) and the third clause of 7/2/64 on discounting commercial papers, and addressed lawful alternatives for financing the public and private sectors, such as sukuk and partnership."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ فیصلہ: مؤجل قرض مقروض کے سوا کسی اور کو نقد فوری میں فروخت نہیں کیا جا سکتا، اسی جنس کا ہو یا دوسری، کیونکہ یہ ربا تک لے جاتا ہے؛ نہ مؤجل نقد میں، کیونکہ یہ منع شدہ بیع کالئ بالکالئ ہے — قرض ادھار سے ہو یا مؤجل بیع سے۔ اور اس نے قراردادوں 60 ⁦(6/11)⁩ برائے بانڈز ⁦(جدہ 1990ء)⁩ اور 7/2/64 کی تیسری دفعہ برائے تجارتی کاغذات کی ڈسکاؤنٹنگ کی تاکید کی، اور عوامی و نجی شعبوں کی مالی معاونت کے شرعی بدل ⁦(صکوک اور شراکت)⁩ بیان کیے۔"
