label: { ar: "قرار مجمع الفقه الإسلامي الدولي 101 (11/4) بشأن بيع الدين وسندات القرض وبدائلها الشرعية", en: "IIFA resolution 101 (11/4) on the sale of debt, loan bonds and their lawful alternatives", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 101 (11/4): قرض کی فروخت، قرض بانڈز اور ان کے شرعی بدل", es: "Resolución 101 (11/4) de la IIFA sobre la venta de deuda, bonos de préstamo y sus alternativas legales.", fr: "Résolution 101 (11/4) de l'IIFA relative à la vente de titres de créance, d'obligations et de leurs alternatives légales", tr: "Uluslararası İslami Fiqh Akademisi Kararı 101 (11/4) borç, kredi tahvilleri ve bunların yasal alternatifleri ile ilgili", id: "Resolusi Akademi Fiqh Islam Internasional 101 (4/11) mengenai penjualan utang, obligasi pinjaman, dan alternatif hukumnya" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. قرر أنه لا يجوز بيع الدين المؤجل من غير المدين بنقد معجل من جنسه أو من غير جنسه لإفضائه إلى الربا، ولا بيعه بنقد مؤجل من جنسه أو غير جنسه لأنه من بيع الكالئ بالكالئ المنهي عنه، ولا فرق بين كون الدين ناشئًا عن قرض أو بيع آجل. وأكد قراريه 60 ⁦(6/11)⁩ بشأن السندات ⁦(دورة جدة 1410هـ/1990م)⁩ والفقرة ⁦(ثالثًا)⁩ من قراره 7/2/64 بشأن حسم الأوراق التجارية، وتناول البدائل الشرعية لتمويل القطاعين العام والخاص ⁦(كالصكوك والمشاركة)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It ruled that a deferred debt may not be sold to anyone other than the debtor for cash on the spot, of the same or another kind, since it leads to riba; nor sold for deferred cash of the same or another kind as that is the prohibited sale of debt for debt — whether the debt arose from a loan or a deferred sale. It reaffirmed resolutions 60 (6/11) on bonds (Jeddah, 1990) and the third clause of 7/2/64 on discounting commercial papers, and addressed lawful alternatives for financing the public and private sectors, such as sukuk and partnership."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ فیصلہ: مؤجل قرض مقروض کے سوا کسی اور کو نقد فوری میں فروخت نہیں کیا جا سکتا، اسی جنس کا ہو یا دوسری، کیونکہ یہ ربا تک لے جاتا ہے؛ نہ مؤجل نقد میں، کیونکہ یہ منع شدہ بیع کالئ بالکالئ ہے — قرض ادھار سے ہو یا مؤجل بیع سے۔ اور اس نے قراردادوں 60 ⁦(6/11)⁩ برائے بانڈز ⁦(جدہ 1990ء)⁩ اور 7/2/64 کی تیسری دفعہ برائے تجارتی کاغذات کی ڈسکاؤنٹنگ کی تاکید کی، اور عوامی و نجی شعبوں کی مالی معاونت کے شرعی بدل ⁦(صکوک اور شراکت)⁩ بیان کیے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 11.ª sesión en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998). Dictaminó que una deuda diferida no puede venderse a nadie que no sea el deudor por efectivo inmediato, del mismo tipo o de otro, ya que esto genera riba; ni venderse por efectivo diferido del mismo tipo o de otro, puesto que se trata de la venta prohibida de deuda por deuda, ya sea que la deuda haya surgido de un préstamo o de una venta diferida. Reafirmó las resoluciones 60 (6/11) sobre bonos (Yeda, 1990) y la tercera cláusula de la 7/2/64 sobre el descuento de pagarés comerciales, y abordó alternativas lícitas para la financiación de los sectores público y privado, como los sukuk y las sociedades."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 11e session à Manama (25-30 Rajab 1419, 14-19 novembre 1998) a statué qu'une dette différée ne peut être vendue à quiconque autre que le débiteur contre paiement comptant immédiat, que ce soit sous la même forme ou sous une autre, car cela constitue un usage usuraire (riba); de même, sa vente contre paiement différé, sous la même forme ou sous une autre, est interdite, car elle constitue une contre-vente de dette – que la dette résulte d'un prêt ou d'une vente à terme. L'Académie a réaffirmé la résolution 60 (6/11) relative aux obligations (Djeddah, 1990) et le troisième alinéa de la résolution 7/2/64 relative à l'escompte des effets de commerce, et a examiné les alternatives licites de financement des secteurs public et privé, telles que les sukuk et les partenariats."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Manama'daki on birinci oturumunda (25–30 Recep 1419H, 14–19 Kasım 1998) toplu kararı alınmıştır. Ertelenmiş borç, borçlu olmayan bir kişiden kendi türünde hızlandırılmış nakit veya tefeciliğe yol açacak raftan hazır nakit karşılığında satılamaz, ayrıca kendi türünde ertelenmiş nakit veya başka bir türde satılamaz; çünkü bu, kredi verenin yasaklı olan için yaptığı bir satıştır ve borç ile ertelenmiş satıştan kaynaklanan borç arasında fark yoktur. Tahvillerle ilgili 60 (6/11) sayılı kararını (Cidde oturumu 1410H/1990) ve ticari senetlerin mutabakatına ilişkin kararının (Üçüncü paragrafı) onaylamasını sağladı; kamu ve özel sektörün finansmanında şeriat alternatiflerini (sukuk ve katılım fonları gibi) ele aldı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesebelasnya di Manama (25–30 Rajab 1419H, 14–19 November 1998). Diputuskan bahwa utang yang ditangguhkan tidak boleh dijual dari non-debitur untuk uang tunai yang dipercepat atau siap pakai untuk menyebabkan riba, maupun menjualnya dengan uang tunai tertunda atau jenis lainnya, karena ini adalah penjualan pemberi pinjaman untuk yang dilarang, dan tidak ada perbedaan antara utang yang timbul dari pinjaman atau penjualan tertunda. Ia menegaskan Resolusi 60 (6/11) mengenai obligasi (sesi Jeddah 1410H/1990) dan paragraf (Ketiga) dari keputusannya 7/2/64 mengenai penyelesaian surat kabar komersial, yang membahas alternatif Syariah untuk pembiayaan sektor publik dan swasta (seperti sukuk dan dana partisipasi)."
