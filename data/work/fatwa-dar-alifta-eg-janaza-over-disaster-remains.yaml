id: work/fatwa-dar-alifta-eg-janaza-over-disaster-remains
class: work
kind: fatwa
label: { ar: "حكم صلاة الجنازة على الجثث المفقود بعض أجزائها في الكوارث", en: "Funeral prayer over bodies missing parts in disasters", ur: "آفات میں نامکمل لاشوں پر نمازِ جنازہ", es: "Oración fúnebre por los cuerpos a los que les faltan partes en desastres.", fr: "Prière funéraire pour les corps mutilés lors de catastrophes", tr: "Bazı felaketlerde kaybedilen cesetler için cenaze duası hakkındaki karar", id: "Putusan tentang doa pemakaman untuk jenazah yang hilang dalam beberapa bencana" }
summary:
  ar: "سائل سأل عن صلاة الجنازة على جثث مفقود بعض أجزائها في الكوارث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21652)⁩ أن مواراة أجساد موتى المسلمين الذين وافتهم المنية في إعصار ونحوه بعد تغسيلهم والصلاة عليهم واجبة شرعًا على ما فصّل الجواب."
  en: "A questioner asked about the funeral prayer over bodies missing parts after disasters. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21652) answered that burying the bodies of Muslims who died in a cyclone or the like — after washing them and praying over them — is obligatory in the sharia, as the answer details."
  ur: "ایک سائل نے آفت میں نامکمل لاشوں پر نمازِ جنازہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21652)⁩ نے جواب دیا کہ طوفان وغیرہ میں مرنے والے مسلمانوں کی لاشوں کو غسل دینے اور نماز پڑھنے کے بعد دفنانا واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la oración fúnebre por cuerpos mutilados tras desastres. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21652) respondió que enterrar los cuerpos de los musulmanes fallecidos en un ciclón o similar —tras lavarlos y rezar por ellos— es obligatorio según la sharia, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la prière funéraire pour les corps mutilés après une catastrophe. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21652) a répondu que l'inhumation des corps des musulmans décédés lors d'un cyclone ou d'une catastrophe similaire, après les avoir lavés et avoir récité une prière, est obligatoire selon la charia, comme le précise la réponse."
  tr: "Bir soru soran kişi, felaketlerde bazı parçaları eksik olan cesetler için yapılan cenaze namazını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21652), cevabında ayrıntılı olarak belirtildiği üzere, kasırga veya benzeri bir durumda ölen Müslümanların cesetlerini yıkayıp dua ettikten sonra örtülmenin dini zorunluluk olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang doa pemakaman untuk jenazah yang beberapa bagian tubuhnya hilang akibat bencana. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21652) menjawab bahwa menutupi jenazah Muslim yang meninggal dunia akibat badai atau sejenisnya setelah mencuci dan berdoa untuk mereka adalah kewajiban agama, seperti yang dijelaskan dalam jawabannya."
