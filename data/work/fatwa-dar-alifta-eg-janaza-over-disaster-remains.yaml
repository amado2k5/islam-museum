summary:
  ar: "سائل سأل عن صلاة الجنازة على جثث مفقود بعض أجزائها في الكوارث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21652)⁩ أن مواراة أجساد موتى المسلمين الذين وافتهم المنية في إعصار ونحوه بعد تغسيلهم والصلاة عليهم واجبة شرعًا على ما فصّل الجواب."
  en: "A questioner asked about the funeral prayer over bodies missing parts after disasters. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21652) answered that burying the bodies of Muslims who died in a cyclone or the like — after washing them and praying over them — is obligatory in the sharia, as the answer details."
  ur: "ایک سائل نے آفت میں نامکمل لاشوں پر نمازِ جنازہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21652)⁩ نے جواب دیا کہ طوفان وغیرہ میں مرنے والے مسلمانوں کی لاشوں کو غسل دینے اور نماز پڑھنے کے بعد دفنانا واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
