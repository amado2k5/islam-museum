label: { ar: "معلقة عمرو بن كلثوم «ألا هبي بصحنك فاصبحينا»", en: "The Mu'allaqa of Amr ibn Kulthum, 'Up, rise with your cup and give us the morning drink'", es: "El Mu'allaqa de Amr ibn Kulthum, 'Levántate, levántate con tu copa y danos la bebida de la mañana'.", fr: "La Mu'allaqa d'Amr ibn Kulthum: « Lève-toi, prends ta coupe et donne-nous la boisson du matin. »", ur: "عمرو بن کلثوم کا مقلقہ، 'اٹھو، اپنا پیالہ لے کر ہمیں صبح کا پانی پلاؤ'۔", tr: "Amr ibn Kulthum'un Mu'allaka (Söz): 'Bizi tabağına getir ve uyanalım.'", id: "Mu'allaqa (Perkataan) karya Amr ibn Kulthum: 'Bawa kami ke piringmu dan biarkan kami bangun.'" }
summary:
  ar: "إحدى المعلقات السبع، من الوافر على روي النون، مطلعها «ألا هبي بصحنك فاصبحينا ولا تبقي خمور الأندرينا»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.124}}."
  en: "One of the seven Mu'allaqat, in the wafir metre on the rhyme nun, opening \"Up, rise with your large cup and give us the morning drink, and do not spare the wines of al-Andarin\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.124}}."
  es: "Uno de los siete Mu'allaqat, en el metro wafir sobre la rima nun, comienza con \"Levántate, levántate con tu gran copa y danos la bebida de la mañana, y no escatimes los vinos de al-Andarin\", como en el comentario de al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.124}}."
  fr: "L'un des sept Mu'allaqat, dans le mètre wafir sur la rime nun, commençant par « Lève-toi, prends ta grande coupe et donne-nous la boisson du matin, et n'épargne pas les vins d'al-Andarin », comme dans le commentaire d'al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.124}}."
  ur: "سات معلقات میں سے ایک، شاعری نون پر وفیر میٹر میں، \"اُٹھو، اپنے بڑے پیالے کے ساتھ اٹھو اور ہمیں صبح کا مشروب پلاؤ، اور الاندرین کی شرابوں کو نہ چھوڑو\"، جیسا کہ الزوزانی کی تفسیر میں ہے {{حوالہ:شرح مُلَقَتِ صَبْزَانی} ص19-12}۔"
  tr: "Yedi Mu'allaqat'tan biri, El-Vafir'in Rahibe üzerine kitabından, \"Tabağınla kalkma ki uyanalım ve Andrina'nın şaraplarından ayrılma,\" diye başlar; tıpkı Al-Zawzani'nin yorumunda olduğu gibi {{cite:sharh-muallaqat-sab-zawzani-1921 s.124}}."
  id: "Salah satu dari tujuh Mu'allaqat, dari Al-Wafir tentang Biarawati, dimulai dengan \"Jangan bangun dengan piringmu agar kita terjaga, dan jangan tinggalkan anggur Andrina,\" seperti dalam komentar Al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 hlm.124}}."
