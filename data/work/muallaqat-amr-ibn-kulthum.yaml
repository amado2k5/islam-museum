summary:
  ar: "إحدى المعلقات السبع، من الوافر على روي النون، مطلعها «ألا هبي بصحنك فاصبحينا ولا تبقي خمور الأندرينا»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.124}}."
  en: "One of the seven Mu'allaqat, in the wafir metre on the rhyme nun, opening \"Up, rise with your large cup and give us the morning drink, and do not spare the wines of al-Andarin\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.124}}."
