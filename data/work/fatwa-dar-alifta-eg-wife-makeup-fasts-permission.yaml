label: { ar: "حكم استئذان المرأة زوجها في قضاء ما أفطرته من رمضان", en: "Must the wife ask her husband's leave to make up missed Ramadan fasts?", ur: "کیا بیوی کو رمضان کے قضا روزوں کے لیے شوہر سے اجازت لینی ہوگی؟" }
summary:
  ar: "سائل سأل عن وجوب استئذان المرأة زوجها الحاضر في قضاء ما فاتها من صيام رمضان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20857)⁩ أنه لا يشترط استئذانها إياه وليس للزوج أن يجبر زوجته على تأخير القضاء على ما فصّل الجواب."
  en: "A questioner asked whether the wife must seek her resident husband's leave to make up Ramadan fasts she missed. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20857) answered that his permission is not a condition, nor may the husband compel her to delay the make-up — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا بیوی کو رمضان کے قضا روزوں کے لیے شوہر کی اجازت چاہیے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20857)⁩ نے جواب دیا کہ اجازت شرط نہیں اور نہ شوہر تاخیر پر مجبور کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
