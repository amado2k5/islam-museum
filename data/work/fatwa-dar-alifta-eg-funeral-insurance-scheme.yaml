label: { ar: "حكم المشاركة في نظام تأميني لتغطية نفقات الدفن عند الوفاة", en: "Joining an insurance scheme covering funeral expenses", ur: "تدفین کے اخراجات کی انشورنس اسکیم میں شرکت" }
summary:
  ar: "سائل سأل عن المشاركة في نظام تأميني لتغطية نفقات الدفن عند الوفاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22065)⁩ أن المشاركة في دفع مبلغ التأمين الخاص بترتيبات دفن من مات من المسلمين جائزة شرعًا بل هي من التعاون على البر والتقوى على ما فصّل الجواب."
  en: "A questioner asked about joining an insurance scheme covering funeral costs at death. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22065) answered that contributing the insurance sum for burying deceased Muslims is lawful — indeed it is of the cooperation in righteousness and piety, as the answer details."
  ur: "ایک سائل نے وفات پر تدفین کے اخراجات پورے کرنے والی انشورنس اسکیم میں شرکت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22065)⁩ نے جواب دیا کہ مسلمانوں کی تدفین کے لیے انشورنس رقم ادا کرنا شرعاً جائز بلکہ نیکی اور تقویٰ کے تعاون میں ہے، جیسا کہ جواب میں تفصیل ہے۔"
