id: work/fatwa-dar-alifta-eg-funeral-insurance-scheme
class: work
kind: fatwa
label: { ar: "حكم المشاركة في نظام تأميني لتغطية نفقات الدفن عند الوفاة", en: "Joining an insurance scheme covering funeral expenses", ur: "تدفین کے اخراجات کی انشورنس اسکیم میں شرکت", es: "Contratar un plan de seguro que cubra los gastos funerarios.", fr: "Adhérer à un régime d'assurance couvrant les frais funéraires", tr: "Ölüm sonrası defin masraflarını karşılamak için sigorta sistemine katılım kararı", id: "Keputusan tentang partisipasi dalam sistem asuransi untuk menanggung biaya pemakaman setelah kematian" }
summary:
  ar: "سائل سأل عن المشاركة في نظام تأميني لتغطية نفقات الدفن عند الوفاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22065)⁩ أن المشاركة في دفع مبلغ التأمين الخاص بترتيبات دفن من مات من المسلمين جائزة شرعًا بل هي من التعاون على البر والتقوى على ما فصّل الجواب."
  en: "A questioner asked about joining an insurance scheme covering funeral costs at death. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22065) answered that contributing the insurance sum for burying deceased Muslims is lawful — indeed it is of the cooperation in righteousness and piety, as the answer details."
  ur: "ایک سائل نے وفات پر تدفین کے اخراجات پورے کرنے والی انشورنس اسکیم میں شرکت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22065)⁩ نے جواب دیا کہ مسلمانوں کی تدفین کے لیے انشورنس رقم ادا کرنا شرعاً جائز بلکہ نیکی اور تقویٰ کے تعاون میں ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de afiliarse a un plan de seguros que cubra los gastos funerarios tras el fallecimiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22065) respondió que contribuir a la suma asegurada para el entierro de musulmanes fallecidos es lícito; de hecho, se trata de una muestra de cooperación en la rectitud y la piedad, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'adhésion à une assurance couvrant les frais funéraires. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22065) a répondu que le versement de cette assurance pour l'inhumation des musulmans décédés est licite; il s'agit même d'une forme de coopération à la piété et à la droiture, comme le précise la réponse."
  tr: "Bir soru soran kişi, ölüm sonrası defin masraflarını karşılamak için bir sigorta sistemine katılmayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22065), vefat eden Müslümanların defin törenlerinin sigorta tutarının ödenmesine katılmanın İslam hukukuna göre izin verildiğini, aksine, yanıtta açıklandığı gibi, doğruluk ve takvada bir işbirliği biçimi olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang berpartisipasi dalam sistem asuransi untuk menutupi biaya pemakaman setelah kematian. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22065) menjawab bahwa berpartisipasi dalam pembayaran jumlah asuransi untuk pengaturan pemakaman Muslim yang meninggal diperbolehkan menurut hukum Islam, dan lebih tepatnya, ini adalah bentuk kerja sama dalam kebenaran dan kesalehan, seperti yang dijelaskan dalam jawaban."
