id: work/fatwa-dar-alifta-eg-continuity-between-sai-tawaf
class: work
kind: fatwa
label: { ar: "حكم الموالاة بين السعي والطواف", en: "The requirement of continuity between sa'i and tawaf", ur: "سعی اور طواف کے درمیان موالات کا حکم", es: "El requisito de continuidad entre sa'i y tawaf", fr: "L'exigence de continuité entre le sa'i et le tawaf", tr: "Sa'i ile Tawaf arasındaki süreklilik kararı", id: "Putusan tentang kesinambungan antara Sa'i dan Tawaf" }
summary:
  ar: "سائل عن رجل طاف ثم ذهب إلى البيت واستراح ثم سعى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23950)⁩ أن الموالاة بين السعي والطواف سنة على رأي جمهور الفقهاء وهو المختار للفتوى، وأن فعل صاحبه بلا حرج لكنه يكون قد ترك سنة الموالاة كما فصّل الجواب."
  en: "A questioner described a man who made tawaf, went home and rested, then performed sa'i. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23950) answered that continuity between sa'i and tawaf is a sunna on the view of the majority of jurists — the view chosen for the fatwa — so his companion's act carries no blame, though he has left the sunna of continuity, as the answer details."
  ur: "ایک سائل نے ایسے شخص کی صورت بیان کی جس نے طواف کیا، پھر گھر جا کر آرام کیا، پھر سعی کی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23950)⁩ نے جواب دیا کہ سعی اور طواف کے درمیان موالات جمهور فقہاء کے نزدیک سنت ہے — اور یہی فتوے کا منتخب قول ہے — اس لیے اس کے ساتھی کے کام میں کوئی حرج نہیں اگرچہ اس نے موالات کی سنت چھوڑی، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante describió a un hombre que realizó el tawaf, regresó a casa y descansó, y luego realizó el sa'i. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23950) respondió que la continuidad entre el sa'i y el tawaf es una sunna según la opinión de la mayoría de los juristas —la opinión elegida para la fatwa—, por lo que el acto de su compañero no conlleva ninguna culpa, aunque haya abandonado la sunna de la continuidad, como se detalla en la respuesta."
  fr: "Un internaute a décrit un homme qui, après avoir accompli le tawaf, est rentré chez lui se reposer, puis a effectué le sa'i. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23950) a répondu que la continuité entre le sa'i et le tawaf est une sunna selon l'avis majoritaire des juristes – avis retenu pour la fatwa –, et que l'acte de son compagnon n'est donc pas blâmable, bien qu'il ait dérogé à la sunna de continuité, comme le précise la réponse."
  tr: "Kendisine Tewaf yapan, sonra eve gidip dinlenen ve sonra Seyi yapan bir adam hakkında soruldu. Mısırlı Dar Al-İfte (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 23950), çoğu hukukçuya göre Seyi ile Tevif arasındaki devamın Sünnet olduğunu, fetvanın tercih edilen otoritesinin kendisi olduğunu ve fetvanı uygulayanın eyleminin zorluk çıkarmadığını, ancak cevabında ayrıntılı olarak belirtildiği gibi Sünnet'ten vazgeçtiğini yanıtladı."
  id: "Ia ditanya tentang seorang pria yang melaksanakan Tawaf, kemudian pergi ke rumah, beristirahat, dan kemudian melaksanakan Sa'i. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 23950) menjawab bahwa kelanjutan antara Sa'i dan Tawaf adalah Sunnah menurut mayoritas ahli hukum, yang merupakan otoritas utama untuk fatwa, dan bahwa tindakan orang yang melakukannya adalah tanpa kesulitan, tetapi ia telah meninggalkan Sunnah untuk melanjutkan seperti yang dijelaskan dalam jawaban."
