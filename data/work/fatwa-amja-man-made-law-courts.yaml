id: work/fatwa-amja-man-made-law-courts
class: work
kind: fatwa
label: { ar: "التحاكم إلى القوانين الوضعية", en: "Recourse to man-made law for one's rights", ur: "انسانی قوانین سے حق لینا", es: "Recurso a la ley creada por el hombre para hacer valer los propios derechos.", fr: "Recours au droit humain pour faire valoir ses droits", tr: "Pozitif Yasalara Karşı Yargılama", id: "Uji Coba Hukum Positif" }
summary:
  ar: "سأل سائل يعمل في شركة منذ خمس عشرة سنة لم تعطه حقوقه هل يلجأ إلى القضاء الوضعي. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21861 بتاريخ 26 يوليو 2007)⁩ أن التحاكم إلى القوانين الوضعية حرام ومن كبائر الذنوب لوجوب التحاكم إلى كتاب الله وسنة رسوله، لكنه فصل أن من اضطر إلى أخذ حقه من ظالم امتنع عن دفعه إلا بهذه الطريقة فإن مجرد السير في إجراءات التقاضي من التحاكم إليهم إلا إذا كان مظلومًا لم يجد من ينصره على ظالمه إلا القضاء الوضعي فإن اللجوء إليه إنما هو لغرض استخلاص الحق لا لتعطيل حكم الله، فلا بأس به على ما فصلت الجواب."
  en: "A worker of fifteen years whose company withheld his rights asked whether he may go to the civil courts. The site's sharia department (fatwa no. 21861, 26 July 2007) answered that resorting to man-made laws is forbidden and among the major sins, judgment belonging to God's book and His messenger's sunna — yet it distinguished: one driven by need to take his due from a wronger who withholds it but by this route may proceed in litigation; mere filing is not necessarily 'referring judgment to them' when the wronged finds none to aid him but the civil court, his aim being to extract his right, not to suspend God's rule — as the answer details. Recorded as AMJA's answer."
  ur: "ایک سائل کے مالک نے پندرہ سال کے حقوق روکے۔ شریعت شعبے ⁦(فتویٰ 21861، 26 جولائی 2007)⁩ کے مطابق وضعی قوانین کی طرف رجوع اصل میں حرام ہے مگر مظلوم جو اپنا حق نہ پائے اس کے لیے عذر کی تفصیل ہے۔"
  es: "Un trabajador con quince años de antigüedad, cuya empresa le había negado sus derechos, preguntó si podía acudir a los tribunales civiles. El departamento de la sharia del sitio (fatwa n.º 21861, 26 de julio de 2007) respondió que recurrir a leyes humanas está prohibido y que, entre los pecados mayores, se encuentra el juicio que pertenece al libro de Dios y a la sunna de su mensajero. Sin embargo, hizo una distinción: quien, movido por la necesidad de reclamar lo que le corresponde a quien se lo niega, puede proceder por esta vía mediante un litigio; la mera presentación de una demanda no implica necesariamente «remitir el juicio a los tribunales» cuando el perjudicado no encuentra más ayuda que la del tribunal civil, cuyo objetivo es obtener lo que le corresponde, no suspender la ley divina, como se detalla en la respuesta. Registrada como respuesta de AMJA."
  fr: "Un employé, ayant quinze ans d'ancienneté et dont l'entreprise bafouait ses droits, a demandé s'il pouvait saisir les tribunaux civils. Le département de la charia du site (fatwa n° 21861, 26 juillet 2007) a répondu que le recours aux lois humaines est interdit et constitue un péché majeur, la justice relevant du Livre de Dieu et de la Sunna de Son Messager. Toutefois, une distinction a été faite: celui qui, poussé par le besoin, souhaite obtenir ce qui lui est dû peut engager une action en justice; le simple fait de déposer une plainte ne signifie pas nécessairement « soumettre la justice à un tribunal » lorsque la victime ne trouve d'autre recours que les tribunaux civils, son objectif étant de faire valoir ses droits et non de suspendre la loi divine, comme le précise la réponse. Cette réponse a été enregistrée comme étant celle d'AMJA."
  tr: "Haklarını vermemiş bir şirkette on beş yıl çalışan bir soru soran kişiye, pozitif yargıya başvurup başvurmaması gerektiği soruldu. Web sitesinin Şeriat bölümü (26 Temmuz 2007 tarihli Fetva No. 21861), olumlu yasalar altında yargılanmanın yasak olduğunu ve Allah'ın Kitabı ile Resulu'nun sünnetine göre yargılama yükümlülüğü nedeniyle en büyük günahlardan biri olduğunu yanıtladı. Ancak, bir zalimden hakkını almak zorunda kalan kişinin bunu ancak bu şekilde ödemediği açıklığa kavuşturuldu. Bu nedenle, sadece dava işlemlerine devam etmek, haksızlığa uğramadıkça ve zulme karşı onu destekleyecek kimse yoksa yargılanmak anlamına gelmez. Buna başvurmak sadece hakkı elde etmek içindir, Allah'ın hükmünü ertelemek için değil. Dolayısıyla, ayrıntılı cevapta açıklandığı gibi, bunda bir zarar yoktur."
  id: "Seorang penanya yang telah bekerja di perusahaan selama lima belas tahun yang belum memberinya haknya ditanya apakah ia harus menggunakan sistem peradilan positif. Bagian Syariah di situs web tersebut (Fatwa No. 21861 tanggal 26 Juli 2007) menjawab bahwa diadili di bawah hukum positif adalah hal yang dilarang dan merupakan salah satu dosa besar karena kewajiban untuk mengadili menurut Kitab Allah dan Sunnah Rasul-Nya. Namun, dijelaskan bahwa siapa pun yang dipaksa mengambil haknya dari penindas menolak membayarnya kecuali dengan cara ini. Oleh karena itu, sekadar melanjutkan prosedur litigasi bukanlah soal diadili kecuali ia dirugikan dan tidak ada yang dapat mendukungnya melawan penindasnya kecuali peradilan positif. Menggunakannya hanya untuk mengambil hak, bukan untuk menangguhkan putusan Allah. Jadi, seperti yang dijelaskan dalam jawaban rinci, tidak ada salahnya."
