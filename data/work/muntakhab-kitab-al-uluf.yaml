summary:
  ar: "كتاب ابن المازيار تلميذ أبي معشر انتخب فيه كتاب الألوف وما ذكر فيه من الهياكل والبنيان العظيم الذي يحدث في العالم في كل ألف عام {cite:muruj-al-dhahab p. 556}."
  en: "Ibn al-Mazyar's epitome of his teacher Abu Ma'shar's Kitab al-Uluf on the world's millennial monuments {cite:muruj-al-dhahab p. 556}."
