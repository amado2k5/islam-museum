  ur: "ابن المزیار کا اپنے استاد ابو معشر کی کتاب الوف کا مظہر دنیا کی ہزار سالہ یادگاروں پر {حوالہ: مروج الذہب ص۱۱۔ 556}۔"
  tr: "Ebu Ma'shar'ın öğrencisi İbn el-Maziyar'ın kitabı, Binler Kitabı'nı seçmiş ve içinde her bin yılda bir dünyada meydana gelen büyük yapılar ve yapılardan bahsetmiştir {atıf:muruj-al-dhahab, s. 556}."
  id: "Kitab Ibn al-Maziyar, seorang murid Abu Ma'shar, di mana ia memilih Kitab Ribuan dan menyebutkan di dalamnya struktur dan struktur besar yang muncul di dunia setiap seribu tahun {cite:muruj-al-dhahab, hlm. 556}."
