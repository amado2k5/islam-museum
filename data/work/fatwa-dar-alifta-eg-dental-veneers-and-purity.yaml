label: { ar: "حكم عمل فينير الأسنان ومدى تأثيره على الطهارة", en: "Dental veneers and their effect on purification", ur: "دانتوں کے وینئر اور طہارت پر اثر" }
summary:
  ar: "سائل سأل عن تركيب فينير الأسنان وتأثيره على الطهارة غسلًا ووضوءًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21723)⁩ أن تركيب الفينير للأسنان أمر جائز شرعًا بشرط ألا يكون فيه ضرر على الإنسان حالًا أو مآلًا ويستوي في ذلك الرجل والمرأة على ما فصّل الجواب."
  en: "A questioner asked about fitting dental veneers and their effect on ghusl and wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21723) answered that fitting veneers is lawful provided it carries no harm to the person now or later — the same for men and women — as the answer details."
  ur: "ایک سائل نے دانتوں پر وینئر لگانے اور طہارت — غسل اور وضو — پر اس کے اثر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21723)⁩ نے جواب دیا کہ وینئر لگانا جائز ہے بشرطیکہ اس میں فی الحال یا مستقبل میں کوئی نقصان نہ ہو؛ مرد و عورت برابر ہیں — جیسا کہ جواب میں تفصیل ہے۔"
