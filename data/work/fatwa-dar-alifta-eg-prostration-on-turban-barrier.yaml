id: work/fatwa-dar-alifta-eg-prostration-on-turban-barrier
class: work
kind: fatwa
label: { ar: "حكم السجود مع وجود حائل بين الجبهة وموضع السجود كالعمامة", en: "Prostrating with a barrier such as a turban between forehead and ground", ur: "پگڑی جیسی حائل چیز کے ساتھ سجدہ کرنا", es: "Postrarse con una barrera, como un turbante, entre la frente y el suelo.", fr: "Se prosterner en utilisant une barrière telle qu'un turban entre le front et le sol", tr: "Alın ile secde yeri arasında bir bariyer olduğunda, örneğin bir sarık varsa, secde etme hakkındaki karar", id: "Aturan tentang sujud ketika ada penghalang antara dahi dan tempat sujud, seperti sorban" }
summary:
  ar: "سائل سأل عن السجود على العمامة وما شابهها من حائل بين الجبهة وموضع السجود. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21606)⁩ أن الصلاة بالكيفية المذكورة صحيحة شرعًا ما دام قد أتى المصلي ببقية الأركان على وجهها على ما فصّل الجواب."
  en: "A questioner asked about prostrating on a turban or similar barrier between the forehead and the place of prostration. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21606) answered that a prayer performed in the described manner is valid provided the worshipper has completed the remaining pillars properly — as the answer details."
  ur: "ایک سائل نے پگڑی وغیرہ حائل چیز پر سجدہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21606)⁩ نے جواب دیا کہ اس طریقے کی نماز صحیح ہے بشرطیکہ باقی ارکان پورے کیے گئے ہوں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de postrarse sobre un turbante o una barrera similar entre la frente y el lugar de la postración. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21606) respondió que una oración realizada de la manera descrita es válida siempre que el fiel haya completado correctamente los pilares restantes, como se detalla en la respuesta."
  fr: "Un fidèle a posé une question concernant la possibilité de se prosterner sur un turban ou un autre élément similaire faisant office de barrière entre le front et le lieu de prosternation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21606) a répondu qu'une prière accomplie de cette manière est valide à condition que le fidèle ait correctement accompli les autres piliers du culte, comme le précise la réponse."
  tr: "Bir soru soran kişi, sarık üzerindeki secde ve alın ile secde yeri arasındaki benzer engeller hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21606), bahsedilen namazın İslam hukukuna göre geçerli olduğunu, cevabında açıklandığı gibi ibadet edenin yüzünün kalan köşelerini yerleştirdiği sürece geçerli olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang sujud di atas sorban dan penghalang serupa antara dahi dan tempat sujud. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21606) menjawab bahwa doa dengan cara yang disebutkan berlaku menurut hukum Islam, selama jamaah telah meletakkan sudut-sudut yang tersisa di wajah mereka, seperti yang dijelaskan dalam jawaban."
