id: work/fatwa-amja-waswas-about-god
class: work
kind: fatwa
label: { ar: "وسواس قهري عن الذات الإلهية", en: "Obsessive whisperings about the divine being", ur: "ذات باری کے بارے میں قہری وسوسے" }
summary:
  ar: "سأل مريض بوسواس قهري عن الذات الإلهية أفكارًا لا يستطيع قولها ولا يدري هل تأتي بقصد ويشعر أنه لا يحس بالإيمان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83510 بتاريخ 9 يناير 2011)⁩ أن ما يجده من تلاعب الشيطان ليحزنه ويكدر عيشه والواجب ألا يسترسل معها وأن يقطع مبادئها ويقول الحمد لله الذي رد كيده إلى الوسوسة، وأن مقاومتها والثبات عليها دليل على محض الإيمان لحديث مسلم «ذاك صريح الإيمان» وبيان النووي والخطابي لمعناه على ما فصّل."
  en: "A sufferer of obsessive whisperings about the divine being — thoughts he cannot utter nor tell whether intended, leaving him feeling he has no faith — asked for help. Dr. Salah al-Sawi (fatwa no. 83510, 9 January 2011) answered that what he finds is Satan's toying to sadden him; the duty is not to follow the whisperings, to cut them at their start and to say praise be to God who reduced his plot to whispering; resisting them and standing firm is a sign of pure faith by Muslim's hadith 'that is manifest faith' with al-Nawawi's and al-Khattabi's explanations, as detailed."
  ur: "ذات الٰہی کے قہری وسوسوں میں مبتلا سائل نے رہنمائی چاہی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83510، 9 جنوری 2011)⁩ کے مطابق یہ شیطان کا کھیل ہے؛ وسوسوں کو ابتدا میں کاٹنا اور ان کے خلاف ثابت قدمی صریح ایمان کی علامت ہے — حدیث مسلم کے حوالے سے۔"
