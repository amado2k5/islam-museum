id: work/fatwa-amja-waswas-about-god
class: work
kind: fatwa
label: { ar: "وسواس قهري عن الذات الإلهية", en: "Obsessive whisperings about the divine being", ur: "ذات باری کے بارے میں قہری وسوسے", es: "Susurros obsesivos sobre el ser divino", fr: "Murmures obsessionnels à propos de l'être divin" }
summary:
  ar: "سأل مريض بوسواس قهري عن الذات الإلهية أفكارًا لا يستطيع قولها ولا يدري هل تأتي بقصد ويشعر أنه لا يحس بالإيمان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83510 بتاريخ 9 يناير 2011)⁩ أن ما يجده من تلاعب الشيطان ليحزنه ويكدر عيشه والواجب ألا يسترسل معها وأن يقطع مبادئها ويقول الحمد لله الذي رد كيده إلى الوسوسة، وأن مقاومتها والثبات عليها دليل على محض الإيمان لحديث مسلم «ذاك صريح الإيمان» وبيان النووي والخطابي لمعناه على ما فصّل."
  en: "A sufferer of obsessive whisperings about the divine being — thoughts he cannot utter nor tell whether intended, leaving him feeling he has no faith — asked for help. Dr. Salah al-Sawi (fatwa no. 83510, 9 January 2011) answered that what he finds is Satan's toying to sadden him; the duty is not to follow the whisperings, to cut them at their start and to say praise be to God who reduced his plot to whispering; resisting them and standing firm is a sign of pure faith by Muslim's hadith 'that is manifest faith' with al-Nawawi's and al-Khattabi's explanations, as detailed."
  ur: "ذات الٰہی کے قہری وسوسوں میں مبتلا سائل نے رہنمائی چاہی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83510، 9 جنوری 2011)⁩ کے مطابق یہ شیطان کا کھیل ہے؛ وسوسوں کو ابتدا میں کاٹنا اور ان کے خلاف ثابت قدمی صریح ایمان کی علامت ہے — حدیث مسلم کے حوالے سے۔"
  es: "Un hombre que sufría de pensamientos obsesivos sobre el ser divino —pensamientos que no podía expresar ni discernir si eran intencionados, lo que le hacía sentir que no tenía fe— pidió ayuda. El Dr. Salah al-Sawi (fatwa n.º 83510, 9 de enero de 2011) respondió que lo que encontraba era una artimaña de Satanás para entristecerlo; el deber es no seguir esos pensamientos, sino interrumpirlos desde el principio y alabar a Dios, quien redujo su plan a un simple susurro; resistirlos y mantenerse firme es una señal de fe pura según el hadiz musulmán «que es fe manifiesta», con las explicaciones de al-Nawawi y al-Khattabi, como se detalla."
  fr: "Un homme en proie à des murmures obsessionnels concernant la divinité – des pensées qu'il ne peut exprimer ni même savoir si elles sont intentionnelles, le laissant avec le sentiment de perdre la foi – a demandé de l'aide. Le Dr Salah al-Sawi (fatwa n° 83510, 9 janvier 2011) lui a répondu que ce qu'il perçoit est une ruse de Satan visant à l'attrister; son devoir est de ne pas suivre ces murmures, de les étouffer dans l'œuf et de louer Dieu qui a réduit son complot à de simples murmures; leur résister et demeurer ferme est un signe de foi pure, selon le hadith de Muslim, « c'est la foi manifeste », comme l'expliquent en détail al-Nawawi et al-Khattabi."
