label: { ar: "قرار مجمع الفقه الإسلامي الدولي 232 (24/3) بشأن عقود الفيديك", en: "IIFA resolution 232 (24/3) on FIDIC contracts", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 232 (24/3): فیڈک ⁦(FIDIC)⁩ معاہدے", es: "Resolución 232 (24/3) de la IIFA sobre contratos FIDIC", fr: "Résolution 232 (24/3) de l'IIFA sur les contrats FIDIC" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩. عرّف المجمع عقود الفيديك بأنها مجموعة نماذج لعقود إنشائية هندسية تهدف إلى ضبط العلاقة بين صاحب العمل أو من يقوم مقامه ومن يقومون بتنفيذ العقد لإنجاز مشروع تتعدد عناصر الإنشاء فيه بحيث يُسلَّم جاهزًا للاستعمال فيما أُعد له. ورأى أن هذه العقود جائزة شرعًا إذا تم فيها الالتزام بالأحكام والضوابط الشرعية، قياسًا لها على عقود الاستصناع والإجارة والمقاولة؛ وأن ما قد يقع فيها من نزاع ومشاحنة يحل باللجوء إلى التحكيم طبقًا لقرار المجمع 91 ⁦(9/8)⁩؛ ويجوز في حال تأخير التنفيذ عن الموعد المحدد تطبيق الشرط الجزائي طبقًا لقرار المجمع 109 ⁦(12/3)⁩؛ وأما ما يزاد في الثمن بسبب تغير ظروف التنفيذ أو تعديل محل العقد فهو تعويض عن الضرر."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019). It defined FIDIC contracts as a set of model engineering construction contracts that regulate the relation between the employer (or whoever stands in his place) and those executing the contract, to complete a project whose construction elements are numerous so that it is delivered ready for its intended use. It held that these contracts are lawful in the sharia provided the sharia rulings and controls are observed, analogising them to the contracts of istisna' (manufacture), ijara (lease) and muqawala (contracting); that disputes arising under them are settled by recourse to arbitration under its resolution 91 (9/8); that a penalty clause may be applied where execution is delayed beyond the set date under its resolution 109 (12/3); and that any addition to the price due to changed conditions of execution or an amendment to the subject-matter of the contract is compensation for harm."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں۔ اکیڈمی نے فیڈک معاہدوں کی تعریف انجینئری تعمیراتی معاہدوں کے نمونوں کے مجموعے کے طور پر کی جو آجر ⁦(یا اس کے قائم مقام)⁩ اور معاہدہ نافذ کرنے والوں کے درمیان تعلق ضبط کرتے ہیں تاکہ ایک ایسا منصوبہ مکمل ہو جس کے تعمیراتی عناصر متعدد ہوں اور وہ اپنی مقررہ استعمال کے لیے تیار حالت میں حوالے ہو۔ اس نے رائے دی کہ یہ معاہدے شرعاً جائز ہیں بشرطیکہ شرعی احکام و ضوابط کی رعایت ہو — انہیں استصناع، اجارہ اور مقاولہ کے معاہدوں پر قیاس کیا گیا؛ ان میں پیدا ہونے والے تنازعات کا حل قرارداد 91 ⁦(9/8)⁩ کے مطابق ثالثی سے ہوگا؛ مقررہ تاریخ سے تاخیر کی صورت میں قرارداد 109 ⁦(12/3)⁩ کے مطابق شرطِ جزائی لاگو ہوسکتی ہے؛ اور تعمیلی حالات کی تبدیلی یا موضوعِ معاہدہ میں ترمیم کی وجہ سے قیمت میں جو اضافہ ہو وہ نقصان کا تلافی ⁦(تعویض)⁩ ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019). Definió los contratos FIDIC como un conjunto de contratos modelo de ingeniería y construcción que regulan la relación entre el empleador (o quien lo represente) y quienes ejecutan el contrato, para completar un proyecto cuyos elementos constructivos son numerosos, de manera que se entregue listo para su uso previsto. Sostuvo que estos contratos son lícitos en la sharia siempre que se observen las normas y controles de la sharia, comparándolos con los contratos de istisna' (fabricación), ijara (arrendamiento) y muqawala (contratación); que las controversias que surjan en virtud de ellos se resuelven mediante arbitraje según su resolución 91 (9/8); que se puede aplicar una cláusula penal cuando la ejecución se retrasa más allá de la fecha establecida según su resolución 109 (12/3); y que cualquier aumento en el precio debido a cambios en las condiciones de ejecución o una modificación del objeto del contrato constituye una compensación por daños."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019) définit les contrats FIDIC comme un ensemble de contrats types de construction d'ingénierie régissant les relations entre le maître d'ouvrage (ou son représentant) et les exécutants, pour la réalisation d'un projet comportant de nombreux éléments de construction, afin qu'il soit livré prêt à l'emploi. L'Académie a statué que ces contrats sont licites au regard de la charia, sous réserve du respect de ses règles et contrôles, les assimilant aux contrats d'istisna' (fabrication), d'ijara (bail) et de muqawala (entrepreneuriat); que les litiges découlant de ces contrats sont réglés par arbitrage conformément à sa résolution 91 (9/8); qu'une clause pénale peut être appliquée en cas de retard d'exécution au-delà de la date fixée conformément à sa résolution 109 (12/3); et que toute majoration de prix due à une modification des conditions d'exécution ou à un amendement de l'objet du contrat constitue une indemnisation pour le préjudice subi."
