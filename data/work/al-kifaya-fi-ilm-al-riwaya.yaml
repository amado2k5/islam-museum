label: { ar: "الكفاية في علم الرواية", en: "al-Kifaya fi Ilm al-Riwaya" }
summary:
  ar: "كتاب الخطيب البغدادي (ت 463هـ) في قوانين الرواية وأصول علم الحديث: حجية السنة وخبر الواحد، وشروط من تُقبل روايته، وعدالة الصحابة وتعريف الصحابي، والجرح والتعديل وأحكامهما، والرواية عن أهل البدع، والتشدد في أحاديث الأحكام والتساهل في الفضائل، وترك من اختلط، وأخذ الأجرة على التحديث، وسماع الصغير، وطرق التحمل كالعرض والمناولة والإجازة والمكاتبة، وألفاظ الأداء. يذكر في مقدمته أنه ألفه رداً على من يجمع الحديث دون نظر في حال الراوي والمروي، وعلى من طعن في الحديث وأهله، ونقل محققو طبعة حيدر آباد عن ابن حجر أن الخطيب عمل في قوانين الرواية كتاباً سماه الكفاية، وعن ابن نقطة أن المحدثين بعده عيال على كتبه."
  en: "Al-Khatib al-Baghdadi's (d. 463 AH) book on the rules of transmission and the principles of hadith science: the authority of the Sunna and of single-source reports, the conditions for accepting a transmitter, the probity of the Companions and the definition of a Companion, criticism and vindication and their rulings, narration from innovators, strictness in legal hadith and leniency in reports on virtues, abandoning transmitters who became confused, payment for teaching hadith, hearing in childhood, and the modes of receiving and relaying hadith. In his preface he says he wrote it against those who collect hadith without examining transmitter and report, and against those who attack hadith and its people; the Hyderabad editors quote Ibn Hajar that al-Khatib wrote on the rules of transmission a book he named al-Kifaya, and Ibn Nuqta that the traditionists after him all depend on his books."
