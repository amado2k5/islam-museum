summary:
  ar: "كتاب الخطيب البغدادي ⁦(ت 463هـ)⁩ في قوانين الرواية وأصول علم الحديث: حجية السنة وخبر الواحد، وشروط من تُقبل روايته، وعدالة الصحابة وتعريف الصحابي، والجرح والتعديل وأحكامهما، والرواية عن أهل البدع، والتشدد في أحاديث الأحكام والتساهل في الفضائل، وترك من اختلط، وأخذ الأجرة على التحديث، وسماع الصغير، وطرق التحمل كالعرض والمناولة والإجازة والمكاتبة، وألفاظ الأداء. يذكر في مقدمته أنه ألفه رداً على من يجمع الحديث دون نظر في حال الراوي والمروي، وعلى من طعن في الحديث وأهله، ونقل محققو طبعة حيدر آباد عن ابن حجر أن الخطيب عمل في قوانين الرواية كتاباً سماه الكفاية، وعن ابن نقطة أن المحدثين بعده عيال على كتبه."
  en: "Al-Khatib al-Baghdadi's (d. 463 AH) book on the rules of transmission and the principles of hadith science: the authority of the Sunna and of single-source reports, the conditions for accepting a transmitter, the probity of the Companions and the definition of a Companion, criticism and vindication and their rulings, narration from innovators, strictness in legal hadith and leniency in reports on virtues, abandoning transmitters who became confused, payment for teaching hadith, hearing in childhood, and the modes of receiving and relaying hadith. In his preface he says he wrote it against those who collect hadith without examining transmitter and report, and against those who attack hadith and its people; the Hyderabad editors quote Ibn Hajar that al-Khatib wrote on the rules of transmission a book he named al-Kifaya, and Ibn Nuqta that the traditionists after him all depend on his books."
  es: "El libro de Al-Khatib al-Baghdadi (m. 463 AH) sobre las reglas de transmisión y los principios de la ciencia del hadiz: la autoridad de la Sunna y de los relatos de fuente única, las condiciones para aceptar a un transmisor, la probidad de los Compañeros y la definición de un Compañero, la crítica y la vindicación y sus dictámenes, la narración de los innovadores, la rigurosidad en el hadiz legal y la indulgencia en los relatos sobre virtudes, el abandono de los transmisores que se confundían, el pago por enseñar hadiz, la audición en la infancia y los modos de recibir y transmitir hadiz. En su prefacio dice que lo escribió contra aquellos que recopilan hadices sin examinar al transmisor y al relato, y contra aquellos que atacan el hadiz y a sus seguidores; los editores de Hyderabad citan a Ibn Hajar diciendo que Al-Khatib escribió sobre las reglas de transmisión un libro que tituló Al-Kifaya, e Ibn Nuqta diciendo que los tradicionalistas posteriores a él dependen de sus libros."
  fr: "L'ouvrage d'Al-Khatib al-Baghdadi (mort en 463 AH) traite des règles de transmission et des principes de la science du hadith: l'autorité de la Sunna et des hadiths à source unique, les conditions d'acceptation d'un transmetteur, la probité des Compagnons et la définition d'un Compagnon, la critique et la justification et leurs décisions, la narration des innovateurs, la rigueur dans l'interprétation des hadiths juridiques et la souplesse dans les hadiths relatifs aux vertus, l'abandon des transmetteurs devenus confus, la rémunération de l'enseignement du hadith, l'importance de l'écoute dès l'enfance, et les modes de réception et de transmission du hadith. Dans sa préface, il précise avoir écrit cet ouvrage contre ceux qui collectent les hadiths sans examiner le transmetteur et le hadith, et contre ceux qui s'attaquent au hadith et à ceux qui le pratiquent. Les éditeurs d'Hyderabad citent Ibn Hajar, selon lequel Al-Khatib a écrit sur les règles de transmission un livre intitulé al-Kifaya, et Ibn Nuqta, selon lequel les traditionnistes qui lui ont succédé se sont tous appuyés sur ses ouvrages."
  ur: "الخطیب البغدادی ⁦(متوفی 463 ہجری)⁩ کی کتاب ٹرانسمیشن کے اصولوں اور علم حدیث کے اصولوں پر ہے: سنت اور واحد ماخذ رپورٹوں کا اختیار، ٹرانسمیٹر کو قبول کرنے کی شرائط، صحابہ کی ثقاہت اور صحابی کی تعریف، تنقید و استدلال اور ان کے شرعی احکام میں سختی، شرعی احکام اور روایات میں سختی تھی۔ فضائل کی رپورٹوں میں، کنفیوژ ہو جانے والے ٹرانسمیٹر کو چھوڑنا، حدیث پڑھانے کی ادائیگی، بچپن میں سماع، اور حدیث کے وصول کرنے اور نشر کرنے کے طریقے۔ اپنے دیباچے میں وہ کہتا ہے کہ اس نے اسے ان لوگوں کے خلاف لکھا جو ٹرانسمیٹر اور رپورٹ کی جانچ کیے بغیر حدیث جمع کرتے ہیں، اور ان لوگوں کے خلاف جو حدیث اور اس کے لوگوں پر حملہ کرتے ہیں۔ حیدرآباد کے مدیران ابن حجر کا حوالہ دیتے ہیں کہ الخطیب نے روایت کے قواعد پر ایک کتاب لکھی جس کا نام اس نے الکفایہ رکھا اور ابن نکتہ کہ ان کے بعد کے محدثین کا انحصار ان کی کتابوں پر ہے۔"
  tr: "El-Hatib el-Bağdadi'nin (ö. 463 Hicri) rivayet kanunları ve hadis biliminin ilkeleri üzerine kitabı: Sünnetin otoritesi ve onun rivayeti, rivayetin kabul koşulları, sahabelerin adaleti ve sahabenin tanımı, eleştiri ve doğrulama ile onların hükümleri, yenilikçi rivayet, katılık, erdemlerde hoşgörü, karışık olanlardan kaçınma, rivayet için ücret alma, gençleri dinleme, sunum, sunum, yetkilendirme, yazışma ve icra koşulları gibi dayanıklılık yöntemlerini kullanmıştır. Girişinde, bu kitabı, rivayetçi ve rivayetçinin durumunu dikkate almadan hadis toplayan ve hadisi ile halkını eleştirenlere karşı yazdığı belirtilmiştir. Haydarabad baskısının editörleri, İbn Hacer'in El-Hatib'in rivayet kanunları üzerine El-Kifayah adlı bir kitap yazdığını ve İbn Nuqta'dan alıntı yaparak kendisinden sonraki hadis âlimlerinin onun kitaplarına dayandığını belirtmiştir."
  id: "Buku Al-Khatib al-Baghdadi (wafat 463 H) tentang hukum narasi dan prinsip-prinsip ilmu hadis: otoritas Sunnah dan narasi yang sama, syarat menerima narasinya, keadilan para Sahabat dan definisi sahabat, kritik dan pengesahan serta keputusan mereka, narasi dari orang-orang inovasi, ketegasan dalam narasi keputusan, kelonggaran dalam kebajikan, menghindari yang bingung, mengenakan biaya untuk narator, mendengarkan yang muda, metode ketahanan seperti penyampaian, penyampaian, otorisasi, korespondensi, dan ketentuan pelaksanaan. Disebutkan dalam pengantarnya bahwa ia menulisnya sebagai tanggapan kepada mereka yang mengumpulkan hadis tanpa mempertimbangkan keadaan narator dan narator, serta terhadap mereka yang mengkritik hadis dan umatnya. Editor edisi Hyderabad mengutip Ibn Hajar yang mengatakan bahwa Al-Khatib menulis sebuah buku tentang hukum narasi berjudul Al-Kifayah, dan dari Ibn Nuqta bahwa para ulama hadis setelahnya bergantung pada buku-bukunya."
