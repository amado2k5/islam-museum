summary:
  ar: "مجموعة تراجم وقصص في جزء واحد تروي سير أمهات النبي (آمنة، حليمة، أم أيمن، فاطمة بنت أسد)، وزوجاته الثلاث عشرة ومارية القبطية، وخمساً وعشرين صحابية، وبناته الأربع، وثلاثاً من حفيداته، بأسلوب قصصي مبسط؛ من إعداد محمد علي القطب ومحمد عمر الداعوق وأحمد عبد الجواد الدومي."
  en: "A single-volume collection of biographies and stories covering the Prophet's mothers (Amina, Halima, Umm Ayman, Fatima bint Asad), his thirteen wives and Maria al-Qibtiyya, twenty-five female Companions, his four daughters and three granddaughters, in a simple narrative style; compiled by Muhammad Ali al-Qutb, Muhammad Umar al-Da'uq and Ahmad Abd al-Jawad al-Dumi."
