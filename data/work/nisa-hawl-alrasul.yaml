summary:
  ar: "مجموعة تراجم وقصص في جزء واحد تروي سير أمهات النبي ⁦(آمنة، حليمة، أم أيمن، فاطمة بنت أسد)⁩، وزوجاته الثلاث عشرة ومارية القبطية، وخمساً وعشرين صحابية، وبناته الأربع، وثلاثاً من حفيداته، بأسلوب قصصي مبسط؛ من إعداد محمد علي القطب ومحمد عمر الداعوق وأحمد عبد الجواد الدومي."
  en: "A single-volume collection of biographies and stories covering the Prophet's mothers (Amina, Halima, Umm Ayman, Fatima bint Asad), his thirteen wives and Maria al-Qibtiyya, twenty-five female Companions, his four daughters and three granddaughters, in a simple narrative style; compiled by Muhammad Ali al-Qutb, Muhammad Umar al-Da'uq and Ahmad Abd al-Jawad al-Dumi."
  es: "Una colección en un solo volumen de biografías e historias que abarcan a las madres del Profeta (Amina, Halima, Umm Ayman, Fatima bint Asad), sus trece esposas y Maria al-Qibtiyya, veinticinco compañeras, sus cuatro hijas y tres nietas, en un estilo narrativo sencillo; compilada por Muhammad Ali al-Qutb, Muhammad Umar al-Da'uq y Ahmad Abd al-Jawad al-Dumi."
  fr: "Un recueil en un seul volume de biographies et d'histoires couvrant les mères du Prophète (Amina, Halima, Umm Ayman, Fatima bint Asad), ses treize épouses et Maria al-Qibtiyya, vingt-cinq Compagnes, ses quatre filles et trois petites-filles, dans un style narratif simple; compilé par Muhammad Ali al-Qutb, Muhammad Umar al-Da'uq et Ahmad Abd al-Jawad al-Dumi."
  ur: "سوانح عمریوں اور کہانیوں کا ایک واحد مجموعہ جس میں نبی کی ماؤں ⁦(آمینہ، حلیمہ، ام ایمن، فاطمہ بنت اسد)⁩، آپ کی تیرہ ازواج مطہرات اور ماریہ القبطیہ، پچیس خواتین صحابہ، ان کی چار بیٹیوں اور تین پوتیوں کا احاطہ کیا گیا ہے، ایک سادہ بیانی انداز میں؛ محمد علی القطب، محمد عمر الدعوق اور احمد عبد الجواد الدومی نے مرتب کیا۔"
