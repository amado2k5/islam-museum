id: work/fatwa-dar-alifta-eg-proxy-transferring-fathers-property
class: work
kind: fatwa
label: { ar: "حكم استخدام التوكيل في نقل ملكية عقارات الوالد دون إذنه", en: "Using a power of attorney to transfer a father's property without his consent", ur: "باپ کی اجازت کے بغیر وکالت نامے سے اس کی جائیداد منتقل کرنا", es: "Utilizar un poder notarial para transferir la propiedad de un padre sin su consentimiento.", fr: "Utiliser une procuration pour transférer les biens d'un père sans son consentement" }
summary:
  ar: "ولد لديه توكيل من والده سأل عن استخدامه في نقل ملكية عقاراته دون إذنه أو رضاه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21733)⁩ أنه لا يجوز للولد أن ينقل أملاك والده من عقارات وغيرها بموجب هذا التوكيل دون إذن والده أو رضاه فالوكيل يعمل في حدود وكالته على ما فصّل الجواب."
  en: "A son holding a power of attorney from his father asked about using it to transfer the father's real-estate ownership without his permission or consent. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21733) answered that the son may not transfer his father's properties under this power of attorney without the father's permission or approval — the agent works within his mandate, as the answer details."
  ur: "ایک بیٹے کے پاس باپ کی طرف سے وکالت نامہ تھا؛ اس نے بغیر اجازت اس کی جائیداد منتقل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21733)⁩ نے جواب دیا کہ بیٹا باپ کی اجازت یا رضامندی کے بغیر اس کی جائیداد منتقل نہیں کر سکتا کیونکہ وکیل اپنی وکالت کی حد میں کام کرتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hijo que poseía un poder notarial otorgado por su padre preguntó sobre la posibilidad de utilizarlo para transferir la propiedad inmobiliaria paterna sin su permiso o consentimiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21733) respondió que el hijo no puede transferir las propiedades de su padre en virtud de dicho poder notarial sin el permiso o la aprobación de este; el apoderado actúa dentro de sus facultades, como se detalla en la respuesta."
  fr: "Un fils, titulaire d'une procuration de son père, a demandé s'il pouvait l'utiliser pour transférer la propriété des biens immobiliers de son père sans son autorisation. La Cour suprême égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21733) a répondu que le fils ne pouvait pas transférer les biens de son père en vertu de cette procuration sans l'accord de ce dernier; le mandataire agissant dans le cadre de ses fonctions, comme le précise la réponse."
