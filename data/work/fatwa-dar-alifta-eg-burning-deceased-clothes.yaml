id: work/fatwa-dar-alifta-eg-burning-deceased-clothes
class: work
kind: fatwa
label: { ar: "حكم حرق ملابس الميت قبل الأربعين", en: "Burning the deceased's clothes before the fortieth day", ur: "چہلم سے پہلے میت کے کپڑے جلانے کا حکم" }
summary:
  ar: "سائل سأل عن حرق ملابس المتوفى قبل مرور أربعين يومًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22206)⁩ أن المحافظة على ثياب المتوفى واجبة شرعًا فهي من التركة للورثة ينتفع بها من أراد منهم أو تُتصدق بها، وأن حرقها لا أصل له، على ما فصّل الجواب."
  en: "A questioner asked about burning the deceased's clothes before forty days pass. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22206) answered that preserving the deceased's clothes is obligatory — they are part of the estate for the heirs, to be used by whoever wants them or given in charity — and that burning them has no basis, as the answer details."
  ur: "ایک سائل نے چہلم گزرنے سے پہلے میت کے کپڑے جلانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22206)⁩ نے جواب دیا کہ میت کے کپڑے محفوظ رکھنا واجب ہے کیونکہ وہ ترکہ میں داخل ہو کر ورثاء کے ہیں، جن میں سے جو چاہے استعمال کرے یا صدقہ کرے؛ جلانے کی کوئی اصل نہیں، جیسا کہ جواب میں تفصیل ہے۔"
