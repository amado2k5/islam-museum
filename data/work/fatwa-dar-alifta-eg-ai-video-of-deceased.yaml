label: { ar: "حكم عمل فيديو بالذكاء الاصطناعي لشخص ميت", en: "Making an AI video of a deceased person", ur: "مرحوم شخص کی اے آئی ویڈیو بنانے کا حکم" }
summary:
  ar: "سائل سأل عن إنشاء فيديو لشخص ميت بتقنيات الذكاء الاصطناعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22586)⁩ أن الحكم في تحريك صور الميت بتقنيات الذكاء الاصطناعي يختلف باختلاف المقصود: فإن استُخدم لإظهاره متحدثًا بما يخالف الحق أو يُنسب إليه ما لم يقل فمحرم، وما كان منه لغير غرض مشروع فحكمه بذلك على ما فصّل الجواب."
  en: "A questioner asked about creating a video of a deceased person using AI. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22586) answered that animating the dead person's images with AI is judged by its purpose: if used to make him appear to speak against the truth or to attribute to him what he did not say, it is forbidden; other purposes are ruled accordingly, as the answer details."
  ur: "ایک سائل نے مرحوم شخص کی اے آئی ویڈیو بنانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22586)⁩ نے جواب دیا کہ اے آئی سے مُردہ کی تصویریں متحرک کرنے کا حکم مقصد کے مطابق ہے: اگر اس سے اسے حق کے خلاف بولتا دکھایا جائے یا وہ بات منسوب کی جائے جو اس نے نہ کہی تو حرام ہے؛ اور جو مقصد جائز ہو اس کا حکم اسی حساب سے، جیسا کہ جواب میں تفصیل ہے۔"
