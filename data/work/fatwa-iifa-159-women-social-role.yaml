label: { ar: "قرار مجمع الفقه الإسلامي الدولي 159 (17/8) بشأن أوضاع المرأة ودورها الاجتماعي من منظور إسلامي", en: "IIFA resolution 159 (17/8) on the situation of women and their social role from an Islamic perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 159 (17/8): خواتین کے حالات اور ان کا سماجی کردار — اسلامی تناظر میں", es: "Resolución 159 (17/8) de la IIFA sobre la situación de la mujer y su papel social desde una perspectiva islámica.", fr: "Résolution 159 (17/8) de l'IIFA sur la situation des femmes et leur rôle social dans une perspective islamique" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على قراره 114 ⁦(12/8)⁩ بشأن الإعلان الإسلامي لدور المرأة في تنمية المجتمع المسلم الذي اعتبر الأسرة حجر الزاوية وقرر المساواة في الكرامة الإنسانية مع حقوق وواجبات «تلائم فطرتها وقدراتها» في نصه. تناول القرار موقف المجمع من المؤتمرات الدولية في مجال حقوق المرأة السياسية والاقتصادية والاجتماعية وما يراه موافقًا أو مخالفًا للأحكام الشرعية في نصوصها، مع توصيات لتمكين المرأة في إطار المنظور الذي تبناه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing its resolution 114 (12/8) on the Islamic declaration of the woman's role in developing Muslim society — which made the family the cornerstone, declared men and women equal in human dignity with rights and duties 'suited to her nature and capacities' in the resolution's wording. The resolution addressed the Academy's position on international conferences on women's political, economic and social rights and what it holds consistent or inconsistent with legal rulings in their texts, with recommendations for women's empowerment within the frame it adopted. Summarised neutrally here."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، اپنی قرارداد 114 ⁦(12/8)⁩ کے جائزے کے بعد جس نے خاندان کو بنیادی پتھر قرار دیا اور مرد و زن کی انسانی وقار میں برابری کے ساتھ متن کے الفاظ میں 'اس کی فطرت اور صلاحیتوں کے مطابق' حقوق و فرائض بیان کیے۔ قرارداد نے خواتین کے سیاسی، معاشی اور سماجی حقوق سے متعلق بین الاقوامی کانفرنسوں پر اکیڈمی کے موقف اور وہ امور بیان کیے جو اس کے نزدیک ان کے متون میں شرعی احکام سے موافق یا متصادم ہیں، ساتھ ہی اس کے اپنائے ہوئے فریم میں خواتین کی بااختیاری کی سفارشات۔ یہاں غیر جانبدارانہ خلاصہ درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24-28 de junio de 2006), tras revisar su resolución 114 (12/8) sobre la declaración islámica del papel de la mujer en el desarrollo de la sociedad musulmana —que considera a la familia como la piedra angular—, declaró a hombres y mujeres iguales en dignidad humana, con derechos y deberes «acordes a su naturaleza y capacidades», según la redacción de la resolución. La resolución abordó la posición de la Academia sobre las conferencias internacionales sobre los derechos políticos, económicos y sociales de la mujer y lo que considera coherente o incoherente con las resoluciones legales contenidas en sus textos, con recomendaciones para el empoderamiento de la mujer dentro del marco adoptado. Resumido aquí de forma neutral."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, soit du 24 au 28 juin 2006), après examen de sa résolution 114 (12/8) relative à la déclaration islamique du rôle de la femme dans le développement de la société musulmane – qui place la famille au cœur de cette dernière –, proclame l'égalité de dignité humaine entre hommes et femmes, leur conférant des droits et des devoirs « adaptés à leur nature et à leurs capacités », selon les termes de la résolution. Cette résolution expose la position de l'Académie sur les conférences internationales relatives aux droits politiques, économiques et sociaux des femmes et examine ce qu'elle considère comme conforme ou non aux décisions juridiques énoncées dans leurs textes. Elle formule également des recommandations pour l'autonomisation des femmes dans le cadre qu'elle a adopté. Un résumé neutre de cette résolution est présenté ci-après."
