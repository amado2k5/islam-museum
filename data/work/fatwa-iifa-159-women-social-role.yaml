label: { ar: "قرار مجمع الفقه الإسلامي الدولي 159 (17/8) بشأن أوضاع المرأة ودورها الاجتماعي من منظور إسلامي", en: "IIFA resolution 159 (17/8) on the situation of women and their social role from an Islamic perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 159 (17/8): خواتین کے حالات اور ان کا سماجی کردار — اسلامی تناظر میں" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد الاطلاع على قراره 114 ⁦(12/8)⁩ بشأن الإعلان الإسلامي لدور المرأة في تنمية المجتمع المسلم الذي اعتبر الأسرة حجر الزاوية وقرر المساواة في الكرامة الإنسانية مع حقوق وواجبات «تلائم فطرتها وقدراتها» في نصه. تناول القرار موقف المجمع من المؤتمرات الدولية في مجال حقوق المرأة السياسية والاقتصادية والاجتماعية وما يراه موافقًا أو مخالفًا للأحكام الشرعية في نصوصها، مع توصيات لتمكين المرأة في إطار المنظور الذي تبناه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing its resolution 114 (12/8) on the Islamic declaration of the woman's role in developing Muslim society — which made the family the cornerstone, declared men and women equal in human dignity with rights and duties 'suited to her nature and capacities' in the resolution's wording. The resolution addressed the Academy's position on international conferences on women's political, economic and social rights and what it holds consistent or inconsistent with legal rulings in their texts, with recommendations for women's empowerment within the frame it adopted. Summarised neutrally here."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، اپنی قرارداد 114 ⁦(12/8)⁩ کے جائزے کے بعد جس نے خاندان کو بنیادی پتھر قرار دیا اور مرد و زن کی انسانی وقار میں برابری کے ساتھ متن کے الفاظ میں 'اس کی فطرت اور صلاحیتوں کے مطابق' حقوق و فرائض بیان کیے۔ قرارداد نے خواتین کے سیاسی، معاشی اور سماجی حقوق سے متعلق بین الاقوامی کانفرنسوں پر اکیڈمی کے موقف اور وہ امور بیان کیے جو اس کے نزدیک ان کے متون میں شرعی احکام سے موافق یا متصادم ہیں، ساتھ ہی اس کے اپنائے ہوئے فریم میں خواتین کی بااختیاری کی سفارشات۔ یہاں غیر جانبدارانہ خلاصہ درج ہے۔"
