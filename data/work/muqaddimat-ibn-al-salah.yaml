label: { ar: "مقدمة ابن الصلاح ⁦(معرفة أنواع علم الحديث)⁩", en: "Muqaddimat Ibn al-Salah (Ma'rifat Anwa' Ilm al-Hadith)" }
summary:
  ar: "كتاب ابن الصلاح ⁦(ت 643هـ)⁩ في علوم الحديث، سماه في خطبته «معرفة أنواع علم الحديث» واشتهر بعلوم الحديث وبالمقدمة. قسّمه إلى خمسة وستين نوعاً، أولها معرفة الصحيح وآخرها معرفة أوطان الرواة وبلدانهم، وقال إن الأنواع قابلة للتنويع إلى ما لا يحصى. وفيه تعريفه المشهور للحديث الصحيح، ورأيه في تعذر التصحيح المستقل في عصره، وفي إفادة ما اتفق عليه الشيخان القطع."
  en: "Ibn al-Salah's (d. 643 AH) book on the hadith sciences, which he names in his preface Ma'rifat Anwa' Ilm al-Hadith and which became known as Ulum al-Hadith or the Muqaddima. He divides it into sixty-five types, the first the knowledge of the sound (sahih) hadith and the last the homelands and towns of transmitters, adding that the types could be multiplied without limit. It contains his well-known definition of the sahih hadith, his view that independent authentication had become impracticable in his age, and his view that what the two Shaykhs agree on yields certainty."
