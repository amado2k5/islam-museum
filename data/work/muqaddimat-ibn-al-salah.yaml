label: { ar: "مقدمة ابن الصلاح ⁦(معرفة أنواع علم الحديث)⁩", en: "Muqaddimat Ibn al-Salah (Ma'rifat Anwa' Ilm al-Hadith)" }
summary:
  ar: "كتاب ابن الصلاح ⁦(ت 643هـ)⁩ في علوم الحديث، سماه في خطبته «معرفة أنواع علم الحديث» واشتهر بعلوم الحديث وبالمقدمة. قسّمه إلى خمسة وستين نوعاً، أولها معرفة الصحيح وآخرها معرفة أوطان الرواة وبلدانهم، وقال إن الأنواع قابلة للتنويع إلى ما لا يحصى. وفيه تعريفه المشهور للحديث الصحيح، ورأيه في تعذر التصحيح المستقل في عصره، وفي إفادة ما اتفق عليه الشيخان القطع."
  en: "Ibn al-Salah's (d. 643 AH) book on the hadith sciences, which he names in his preface Ma'rifat Anwa' Ilm al-Hadith and which became known as Ulum al-Hadith or the Muqaddima. He divides it into sixty-five types, the first the knowledge of the sound (sahih) hadith and the last the homelands and towns of transmitters, adding that the types could be multiplied without limit. It contains his well-known definition of the sahih hadith, his view that independent authentication had become impracticable in his age, and his view that what the two Shaykhs agree on yields certainty."
  es: "El libro de Ibn al-Salah (fallecido en el año 643 de la Hégira) sobre las ciencias del hadiz, al que denomina en su prefacio Ma'rifat Anwa' Ilm al-Hadith y que posteriormente se conoció como Ulum al-Hadith o Muqaddima, lo divide en sesenta y cinco tipos: el primero, el conocimiento del hadiz auténtico (sahih), y el último, las tierras y ciudades de origen de los transmisores, añadiendo que estos tipos podrían multiplicarse indefinidamente. Contiene su conocida definición del hadiz sahih, su opinión de que la autenticación independiente se había vuelto impracticable en su época y su convicción de que aquello en lo que coinciden los dos jeques produce certeza."
  fr: "L'ouvrage d'Ibn al-Salah (mort en 643 AH) sur la science du hadith, qu'il nomme dans sa préface Ma'rifat Anwa' Ilm al-Hadith et qui devint connu sous le nom d'Ulum al-Hadith ou Muqaddima, est divisé en soixante-cinq catégories. La première concerne la connaissance du hadith authentique (sahih) et la dernière les lieux d'origine et les villes des transmetteurs. Il précise que ces catégories peuvent être multipliées indéfiniment. On y trouve sa définition bien connue du hadith authentique, son opinion selon laquelle l'authentification indépendante était devenue impossible à son époque, et son point de vue selon lequel l'accord des deux cheikhs garantit la certitude."
