  ar: "التصريف العزي، كتاب في الصرف والتصريف لمؤلفه عز الدين الزنجاني، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 655هـ / 1257م {cite:ketabonline-tasrif-al-izzi}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فهو ليس في فهرس الشاملة الرسمي بحسب الملف {cite:mr-mas-shamela-nahw-sarf-books}. لم يقرأ المتحف الكتاب."
  en: "Tasrif al-Izzi (al-Izzi fi al-Tasrif), a book on morphology (sarf and tasrif) by Izz al-Din al-Zanjani; its date in a research summary supplied to the museum is d. 655 AH / 1257 CE {cite:ketabonline-tasrif-al-izzi}. The summary's answer on its presence in the Shamela library: No: the file says it is not in the official Shamela index {cite:mr-mas-shamela-nahw-sarf-books}. The museum has not read the book."
  ur: "التصريف العزي، صرف و تصریف پر ایک کتاب، مصنف عز الدين الزنجاني؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 655ھ / 1257ء {cite:ketabonline-tasrif-al-izzi}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق یہ شاملہ کی سرکاری فہرست میں نہیں {cite:mr-mas-shamela-nahw-sarf-books}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Tasrif al-Izzi (al-Izzi fi al-Tasrif), livre sur la morphologie (sarf et tasrif) de Izz al-Din al-Zanjani ; sa date dans une synthèse de recherche remise au musée : m. 655 H / 1257 {cite:ketabonline-tasrif-al-izzi}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier dit qu'il ne figure pas dans l'index officiel de Shamela {cite:mr-mas-shamela-nahw-sarf-books}. Le musée n'a pas lu le livre."
  es: "Tasrif al-Izzi (al-Izzi fi al-Tasrif), libro sobre morfología (sarf y tasrif) de Izz al-Din al-Zanjani; su fecha en un resumen de investigación entregado al museo: m. 655 H. / 1257 {cite:ketabonline-tasrif-al-izzi}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo dice que no figura en el índice oficial de Shamela {cite:mr-mas-shamela-nahw-sarf-books}. El museo no ha leído el libro."
