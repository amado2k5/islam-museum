id: work/fatwa-amja-istinja-before-wudu
class: work
kind: fatwa
label: { ar: "الاستنجاء قبل الوضوء", en: "Order stands — istinja first, then wudu", ur: "ترتیب — پہلے استنجاء پھر وضو", es: "El orden se mantiene: primero el istinja, luego el wudu.", fr: "L'ordre est le suivant: d'abord l'istinja, puis les ablutions." }
summary:
  ar: "سأل سائل هل يمكن أن يقدم الإنسان الوضوء على الاستنجاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77593 بتاريخ 27 يناير 2009)⁩ أن الواجب هو الترتيب فالاستنجاء أولًا ثم الوضوء ثانيًا لا يصلح إلا ذلك على ما فصّل الجواب."
  en: "A questioner asked whether one may put wudu before istinja. Dr. Salah al-Sawi (fatwa no. 77593, 27 January 2009) answered that the order is required — istinja first, then wudu; nothing else serves — as the answer details."
  ur: "وضو استنجاء سے پہلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77593، 27 جنوری 2009)⁩ کے مطابق ترتیب واجب ہے — پہلے استنجاء۔"
  es: "Un consultante preguntó si se puede realizar el wudu antes del istinja. El Dr. Salah al-Sawi (fatwa n.° 77593, 27 de enero de 2009) respondió que el orden es obligatorio: primero el istinja, luego el wudu; nada más sirve, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'on pouvait faire les ablutions (wudu) avant les ablutions rituelles (istinja). Le Dr Salah al-Sawi (fatwa n° 77593, 27 janvier 2009) a répondu que cet ordre est obligatoire: les ablutions rituelles d'abord, puis les ablutions (wudu); rien d'autre n'est valable, comme le précise la réponse."
