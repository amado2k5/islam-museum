label: { ar: "قرار مجمع الفقه الإسلامي الدولي 154 (17/3) بشأن موقف الإسلام من الغلو والتطرف والإرهاب", en: "IIFA resolution 154 (17/3) on Islam's position on excess, extremism and terrorism", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 154 (17/3): غلو، انتہا پسندی اور دہشت گردی پر اسلام کا موقف", es: "Resolución 154 (17/3) de la IIFA sobre la posición del Islam respecto a los excesos, el extremismo y el terrorismo.", fr: "Résolution 154 (17/3) de l'IIFA sur la position de l'islam concernant l'excès, l'extrémisme et le terrorisme", tr: "Uluslararası İslami Fiqh Akademisi Kararı 154 (17/3) İslam'ın aşırılık, radikalizm ve terörizme karşı tutumu hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 154 (17/3) mengenai sikap Islam terhadap ekstremisme, radikalisme, dan terorisme" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بناءً على قراره السابق 128 ⁦(14/2)⁩ بشأن حقوق الإنسان والعنف الدولي الذي عرّف الإرهاب بالعدوان أو التخويف أو التهديد ماديًا أو معنويًا من دول أو جماعات أو أفراد على الإنسان في دينه أو نفسه أو عرضه أو عقله أو ماله بغير حق، وعلى ما أصدرته المؤتمرات العربية والإسلامية ورسالة عمّان. قرر تحريم جميع أعمال الإرهاب وأشكاله واعتبارها أعمالًا إجرامية تدخل في جريمة الحرابة أينما وقعت وأيًا كان مرتكبوها، وعدّ إرهابيًا من شارك مباشرة أو بالتحريض، وتناول تمييز ذلك عن حق الشعوب في مقاومة الاحتلال، وضوابط معالجة أسباب الظاهرة فكريًا وأمنيًا."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), building on its resolution 128 (14/2) on human rights and international violence — which defined terrorism as aggression, intimidation or threat, material or moral, by states, groups or individuals against a person in religion, life, honour, mind or property without right — and on Arab and Islamic conference outputs and the Amman Message. It prohibited all terrorist acts and forms as criminal acts entering the offence of hiraba wherever and by whomever committed, counted as terrorist whoever participates directly or by incitement, distinguished this from peoples' right to resist occupation, and set controls for treating the phenomenon intellectually and in security terms. Recorded here as the Academy's own text, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، اپنی قرارداد 128 ⁦(14/2)⁩ پر مبنی جس نے دہشت گردی کی تعریف کی: ریاستوں، گروہوں یا افراد کی طرف سے دین، جان، عزت، عقل یا مال پر بلا حق مادی یا معنوی عدوان، خوف یا دھمکی — اور عرب و اسلامی کانفرنسوں کے مخرجات اور پیغامِ عمان پر۔ اس نے تمام دہشت گردی کے اعمال اور صورتوں کو جرائم قرار دے کر حرابہ کی جرم میں داخل کیا، جس کی بھی طرف سے اور کہیں بھی ہوں؛ براہِ راست یا ابھارنے سے شریک ہونے والے کو بھی دہشت گرد مانا؛ اسے مقبوضہ عوام کے مزاحمت کے حق سے ممیز کیا؛ اور فکری و سکیورٹی دونوں سطح پر اس رجحان کے ازالے کے ضوابط رکھے۔ یہاں اکیڈمی کے اپنے متن کا غیر جانبدارانہ خلاصہ درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24–28 de junio de 2006), basada en su resolución 128 (14/2) sobre derechos humanos y violencia internacional —que definía el terrorismo como agresión, intimidación o amenaza, material o moral, por parte de estados, grupos o individuos contra una persona en materia de religión, vida, honor, mente o propiedad sin derecho alguno— y en los resultados de conferencias árabes e islámicas y el Mensaje de Amán. Prohibió todos los actos y formas terroristas como actos criminales que constituyen el delito de hiraba, dondequiera que se cometan y por quienquiera que sea quien los cometa, considerando terrorista a quien participe directamente o por incitación, distinguiendo esto del derecho de los pueblos a resistir la ocupación y estableciendo controles para abordar el fenómeno desde una perspectiva intelectual y de seguridad. Aquí se recoge como texto propio de la Academia, resumido de forma neutral."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006), s'appuyant sur sa résolution 128 (14/2) relative aux droits de l'homme et à la violence internationale – qui définit le terrorisme comme une agression, une intimidation ou une menace, matérielle ou morale, exercée par des États, des groupes ou des individus contre une personne dans sa religion, sa vie, son honneur, son esprit ou ses biens, sans droit – et sur les conclusions des conférences arabo-islamiques et sur le Message d'Amman. Elle interdit tous les actes et formes terroristes, les qualifiant d'actes criminels relevant du délit de hiraba, quel que soit le lieu ou l'auteur, et considère comme terroriste quiconque y participe directement ou indirectement. Elle établit une distinction avec le droit des peuples à résister à l'occupation et définit des cadres pour appréhender ce phénomène sur les plans intellectuel et sécuritaire. Le texte original de l'Académie est reproduit ici, résumé de manière neutre."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on yedinci oturumunda Amman'da (28 Cümde el-Avval – 2 Cumedül-Akhirah 1427 H, 24–28 Haziran 2006) kolektif kararı, insan hakları ve uluslararası şiddetle ilgili önceki 128 (14/2) sayılı kararına dayanarak, terörizmi devletler, gruplar veya bireyler tarafından bir kişiye dini, ruhu, onuru, zihni veya mülkü ile mülkü olmadan yönelik saldırı, yıldırma veya fiziksel ya da ahlaki tehditler olarak tanımlamış ve Arap ve İslami konferansların yayımlanması ile Amman Mektubu'na dayanmaktadır. Terörizmin tüm eylem ve biçimlerini yasaklamaya, bunları, nerede gerçekleşirse ve kim işlerse işlesin, otoyol soygunluğu suçu kapsamına giren suç eylemleri olarak kabul etmeye, doğrudan katılan veya kışkırtan herkesi terörist olarak kabul etmeye karar verdi ve bu durumun halkların işgale direnme hakkı arasındaki ayrımı ve olgunun nedenlerini entelektüel ve güvenlik açısından ele alma denetimlerini ele aldı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ketujuh belas di Amman (28 Jumada al-Awwal – 2 Jumada al-Akhirah 1427 H, 24–28 Juni 2006 M), berdasarkan keputusan sebelumnya 128 (14/2) mengenai hak asasi manusia dan kekerasan internasional, yang mendefinisikan terorisme sebagai agresi, intimidasi, atau ancaman fisik atau moral oleh negara, kelompok, atau individu terhadap seseorang dalam agama, jiwa, kehormatan, pikiran, atau properti tanpa hak, dan didasarkan pada penerbitan konferensi Arab dan Islam serta Surat Amman. Dewan memutuskan untuk melarang semua tindakan dan bentuk terorisme serta menganggapnya sebagai tindak pidana yang termasuk dalam kejahatan perampokan jalan raya di mana pun terjadi dan siapa pun yang melakukannya, serta menganggap siapa pun yang secara langsung berpartisipasi atau menghasut mereka sebagai teroris, serta membahas perbedaan antara hal ini dan hak masyarakat untuk melawan pendudukan, serta pengawasan untuk menangani penyebab fenomena tersebut secara intelektual dan keamanan."
