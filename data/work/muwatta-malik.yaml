summary:
  ar: "كتاب الموطأ لإمام دار الهجرة مالك بن أنس ⁦(ت 179هـ)⁩: من أوائل مصنفات الحديث والفقه المرتبة على الأبواب، جمعه في المدينة المنورة. روايته الأشهر رواية يحيى بن يحيى الليثي، وتتوزع كتبها من الصلاة إلى العقيقة. تصفه دائرة المعارف الإسلامية بأنه أقدم كتاب في الشريعة وصل إلينا، يقوم على عمل المدينة، وتعرف له خمس عشرة رواية."
  en: "The Muwatta of Imam Malik ibn Anas (d. 179 AH): one of the earliest hadith and jurisprudence works arranged by chapter, compiled in Medina. Its most widely read transmission is the recension of Yahya ibn Yahya al-Laythi. The Encyclopaedia of Islam describes it as the earliest surviving Muslim law-book, resting on the practice of Medina, and records fifteen recensions."
  ur: "امام مالک بن انس کی موطأ ⁦(وفات 179ھ)⁩: ابواب کے لحاظ سے مرتب حدیث و فقہ کی ابتدائی کتابوں میں سے، جو مدینہ میں جمع ہوئی۔ سب سے مشہور روایت یحییٰ بن یحییٰ لیثی کی ہے۔ دائرۃ المعارف الاسلامیہ اسے سب سے قدیم باقی ماندہ مسلم قانونی کتاب بتاتا ہے جو مدینہ کے عمل پر قائم ہے، اور اس کی پندرہ روایات کا ذکر کرتا ہے۔"
