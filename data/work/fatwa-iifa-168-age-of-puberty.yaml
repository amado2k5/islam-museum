id: work/fatwa-iifa-168-age-of-puberty
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 168 (18/6) بشأن تحديد سن البلوغ وأثره في التكليف", en: "IIFA resolution 168 (18/6) on determining the age of puberty and its effect on legal obligation", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 168 (18/6): سنِ بلوغت کا تعین اور تکلیف پر اس کا اثر" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. استحضر أن العقل مناط التكليف وأن الصغير لا يكلف حتى يبلغ مرحلة تدل على تمام الإدراك وأن لذلك أمارات بدنية، وأن اللجوء إلى تحديد سن عند عدم معرفة البلوغ الطبيعي متوافق مع قواعد الشريعة، وأن الشريعة جاءت بالاحتياط في الحدود بدرئها بالشبهات. وقرر: سن التمييز السابق للبلوغ سبع سنوات، وتصرفات من لم يبلغها باطلة، أما المميز فتصرفاته المالية ثلاث: النافعة نفعًا محضًا صحيحة نافذة، والدائرة بين النفع والضرر موقوفة على إجازة من يملكها، والضارة ضررًا محضًا لا يعتد بها؛ والبلوغ الطبيعي يثبت بأماراته البدنية أو بالسن بتمام خمس عشرة سنة. ثم تناول أثر ذلك في التكليف والحدود والأهلية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). Citing that reason is the basis of obligation, that the minor is not bound until reaching the stage showing complete discernment, that bodily signs mark it, that fixing an age where natural puberty is unknown accords with the rules of the law, and that the law prescribes caution in hudud by warding them off on doubt, it resolved: the age of discernment before puberty is seven, the transactions of one below it void; the discerning minor's financial dealings are threefold — purely beneficial ones valid and effective, those suspended between benefit and harm awaiting the authorisation of the entitled party, and purely harmful ones disregarded; and natural puberty is established by its bodily signs or by the completion of fifteen years. It then treated the consequences for obligation, hudud and legal capacity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے پیش کیا کہ عقل تکلیف کی بنیاد ہے، نابالغ اس وقت تک مکلف نہیں جب تک کامل ادراک کی منزل نہ پہنچے، اس کی جسمانی علامات ہیں، فطری بلوغت نامعلوم ہو تو عمر کا تعین شرعی قواعد سے موافق ہے، اور شریعت نے حدود میں شبہات سے دفع کے ذریعے احتیاط رکھی ہے۔ فیصلے: بلوغت سے پہلے تمیز کی عمر سات سال ہے، اس سے کم کی تصرفات باطل؛ ممیز کی مالی تصرفات تین — خالص نفع والی صحیح و نافذ، نفع و ضرر کے درمیان والی اجازت دینے والے کے مستحق کی اجازت پر موقوف، اور خالص نقصان والی غیر معتبر؛ اور فطری بلوغت اپنی جسمانی علامتوں سے یا پندرہ برس کے مکمل ہونے سے ثابت ہوتی ہے۔ اس کے بعد تکلیف، حدود اور اہلیت پر اثرات۔"
