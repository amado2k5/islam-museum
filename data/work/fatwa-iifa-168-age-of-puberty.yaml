label: { ar: "قرار مجمع الفقه الإسلامي الدولي 168 (18/6) بشأن تحديد سن البلوغ وأثره في التكليف", en: "IIFA resolution 168 (18/6) on determining the age of puberty and its effect on legal obligation", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 168 (18/6): سنِ بلوغت کا تعین اور تکلیف پر اس کا اثر", es: "Resolución 168 (18/6) de la IIFA sobre la determinación de la edad de la pubertad y su efecto en la obligación legal.", fr: "Résolution 168 (18/6) de l'IIFA relative à la détermination de l'âge de la puberté et à ses effets sur les obligations légales", tr: "Ergenlik yaşının belirlenmesi ve bunun yükümlülük üzerindeki etkisi hakkında Uluslararası İslami Fiqh Akademisi Kararı 168 (18/6)", id: "Resolusi Akademi Fiqh Islam Internasional 168 (18/6) mengenai penentuan usia pubertas dan dampaknya terhadap kewajiban" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩. استحضر أن العقل مناط التكليف وأن الصغير لا يكلف حتى يبلغ مرحلة تدل على تمام الإدراك وأن لذلك أمارات بدنية، وأن اللجوء إلى تحديد سن عند عدم معرفة البلوغ الطبيعي متوافق مع قواعد الشريعة، وأن الشريعة جاءت بالاحتياط في الحدود بدرئها بالشبهات. وقرر: سن التمييز السابق للبلوغ سبع سنوات، وتصرفات من لم يبلغها باطلة، أما المميز فتصرفاته المالية ثلاث: النافعة نفعًا محضًا صحيحة نافذة، والدائرة بين النفع والضرر موقوفة على إجازة من يملكها، والضارة ضررًا محضًا لا يعتد بها؛ والبلوغ الطبيعي يثبت بأماراته البدنية أو بالسن بتمام خمس عشرة سنة. ثم تناول أثر ذلك في التكليف والحدود والأهلية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007). Citing that reason is the basis of obligation, that the minor is not bound until reaching the stage showing complete discernment, that bodily signs mark it, that fixing an age where natural puberty is unknown accords with the rules of the law, and that the law prescribes caution in hudud by warding them off on doubt, it resolved: the age of discernment before puberty is seven, the transactions of one below it void; the discerning minor's financial dealings are threefold — purely beneficial ones valid and effective, those suspended between benefit and harm awaiting the authorisation of the entitled party, and purely harmful ones disregarded; and natural puberty is established by its bodily signs or by the completion of fifteen years. It then treated the consequences for obligation, hudud and legal capacity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں۔ اس نے پیش کیا کہ عقل تکلیف کی بنیاد ہے، نابالغ اس وقت تک مکلف نہیں جب تک کامل ادراک کی منزل نہ پہنچے، اس کی جسمانی علامات ہیں، فطری بلوغت نامعلوم ہو تو عمر کا تعین شرعی قواعد سے موافق ہے، اور شریعت نے حدود میں شبہات سے دفع کے ذریعے احتیاط رکھی ہے۔ فیصلے: بلوغت سے پہلے تمیز کی عمر سات سال ہے، اس سے کم کی تصرفات باطل؛ ممیز کی مالی تصرفات تین — خالص نفع والی صحیح و نافذ، نفع و ضرر کے درمیان والی اجازت دینے والے کے مستحق کی اجازت پر موقوف، اور خالص نقصان والی غیر معتبر؛ اور فطری بلوغت اپنی جسمانی علامتوں سے یا پندرہ برس کے مکمل ہونے سے ثابت ہوتی ہے۔ اس کے بعد تکلیف، حدود اور اہلیت پر اثرات۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007). Citando que la razón es la base de la obligación, que el menor no está obligado hasta que alcanza la etapa que muestra discernimiento completo, que los signos corporales lo marcan, que fijar una edad en la que se desconoce la pubertad natural concuerda con las normas de la ley, y que la ley prescribe cautela en hudud al protegerlos de la duda, resolvió: la edad de discernimiento antes de la pubertad es de siete años, las transacciones de uno menor de esta edad son nulas; las transacciones financieras del menor discernidor son de tres tipos: las puramente beneficiosas son válidas y efectivas, las suspendidas entre el beneficio y el daño a la espera de la autorización de la parte con derecho, y las puramente perjudiciales se ignoran; y la pubertad natural se establece por sus signos corporales o al cumplir quince años. Luego trató las consecuencias para la obligación, hudud y capacidad jurídica."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, 9-14 juillet 2007). Constatant que la raison est le fondement de l'obligation, que le mineur n'est lié qu'à l'âge de pleine capacité de discernement, que cet âge est marqué par des signes corporels, que la fixation d'un âge où la puberté naturelle est inconnue est conforme aux règles de la loi, et que la loi prescrit la prudence en matière de hudud en interdisant toute action en cas de doute, l'Académie a décidé: l'âge de la capacité de discernement avant la puberté est de sept ans, les transactions effectuées avant cet âge étant nulles; les opérations financières du mineur capable sont classées en trois catégories: celles purement bénéfiques sont valides et effectives, celles dont le caractère potentiellement néfaste est en attente d'autorisation, et celles purement nuisibles sont ignorées; et la puberté naturelle est établie par ses signes corporels ou par l'accomplissement de quinze ans. L'Académie a ensuite traité des conséquences en matière d'obligation, de hudud et de capacité juridique."
  tr: "Putrajaya'daki on sekizinci oturumunda Uluslararası İslami Fiqh Akademisi'nin toplu kararı (24–29 Jumada al-Ahhirah 1428 H, 9–14 Temmuz 2007). Hukuki sorumluluğun temelinin akl olduğunu, reşit olmayanın tam algı gösteren bir aşamaya ulaşana kadar yük altında olmadığını, bunun fiziksel göstergeler olduğunu, doğal ergenliği bilmeden yaş belirlemeye dayanmanın Şeriat kurallarıyla uyumlu olduğunu ve Şeriatın hudud cezaları konusunda şüpheleri ortadan kaldırarak temkinli davrandığını hatırlattı. Ergenliğe ulaşmadan önce ayrımcılık yaşı yedi yaştır ve henüz erişemeyenlerin eylemleri geçersizdir. Ayıran kişi için ise mali eylemleri üç vardır: tamamen faydalı, geçerli ve etkili; fayda ve zarar arasındaki çember sahibinin izniyle askıya alınır; zararlı olan tamamen zararlıdır ve geçerli değildir; ve doğal ergenlik fiziksel işaretlerle veya on beş yaşındaki yaşla belirlenir. Sonra bunun yükümlülük, hudud ve kapasite üzerindeki etkisini ele aldı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedelapan belas di Putrajaya (24–29 Jumada al-Akhirah 1428 H, 9–14 Juli 2007). Ia mengingat bahwa alasan adalah dasar tanggung jawab hukum, bahwa anak di bawah umur tidak terbebani sampai mencapai tahap persepsi penuh, dan bahwa ini memiliki indikator fisik, bahwa bergantung pada menentukan usia ketika tidak mengetahui pubertas alami sesuai dengan aturan Syariah, dan bahwa Syariah datang dengan kehati-hatian terhadap hukuman hudud dengan menghilangkan keraguan. Ia memutuskan: usia diskriminasi sebelum mencapai pubertas adalah tujuh tahun, dan tindakan mereka yang belum mencapai masa tersebut tidak sah. Adapun yang membedakan, tindakan keuangannya adalah tiga: murni menguntungkan, sah, dan efektif; lingkaran antara manfaat dan kerugian ditangguhkan dengan izin pemilik; dan yang merugikan murni merugikan dan tidak sah; dan pubertas alami ditentukan oleh tanda fisik atau usia pada usia lima belas tahun. Kemudian ia membahas dampaknya terhadap kewajiban, hudud, dan kapasitas."
