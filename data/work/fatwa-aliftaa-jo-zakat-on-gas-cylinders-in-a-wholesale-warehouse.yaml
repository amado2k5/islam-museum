id: work/fatwa-aliftaa-jo-zakat-on-gas-cylinders-in-a-wholesale-warehouse
class: work
kind: fatwa
label: { ar: "زكاة أسطوانات الغاز في مستودع بيع بالجملة", en: "Zakat on gas cylinders in a wholesale warehouse", ur: "ہول سیل گودام میں گیس سلنڈروں کی زکوٰۃ" }
summary:
  ar: "سؤال عن زكاة أسطوانات الغاز في مستودع بيع بالجملة، أجابت فيه دائرة الإفتاء العام الأردنية بأن المستودع إن اقتصرت تجارته على بيع الغاز واستبدال الأسطوانات فالزكاة في قيمة الغاز وحده لأن الأسطوانات وعاء، وإن كان يبيع الأسطوانات فارغة وممتلئة فهي عروض تجارة تجب الزكاة في قيمتها مع الغاز. أجابت الدائرة بأن الأصل وجوب الزكاة في كل ما يعد للتجارة، واستشهدت بـ[[passage/quran-2-267|سورة البقرة 2:267]] وبتفسير مجاهد لها بالتجارة كما في تفسير ابن كثير (1/697). وقالت إن المستودع إذا اقتصر عمله على تعبئة الأسطوانات وبيعها معبأة واستبدالها بأسطوانات فارغة، فالتجارة منحصرة في الغاز، فتجب الزكاة في قيمة الغاز ولا زكاة في الأسطوانات لأنها وعاء للبضاعة ولانعدام شرط النماء، واستدلت بحديث رواه البخاري معناه أنه ليس على المسلم في فرسه وغلامه صدقة، وبقول عميرة في حاشيته أن الزكاة إنما تجب في المال النامي؛ فيقوّم التاجر في نهاية الحول الغاز الذي يملكه ويضم إليه نقوده، فإن بلغ النصاب زكى الجميع بنسبة 2.5%. وأما إذا كان المستودع يبيع الأسطوانات فارغة وممتلئة ويتكسب من الحالتين، فهي عروض تجارة، وتجب الزكاة في قيمة الأسطوانة فارغة مضافًا إليها قيمة الغاز المعبأ فيها."
  en: "A question about zakat on gas cylinders in a wholesale warehouse, in which Jordan's General Iftaa Department answered that if the warehouse's trade is confined to selling gas and exchanging cylinders, zakat is due on the value of the gas alone, the cylinders being containers; if it sells cylinders both empty and full, they are trade goods and zakat is due on their value together with the gas. The Department answered that in principle zakat is due on everything held for trade, citing [[passage/quran-2-267|Surat al-Baqara 2:267]] and Mujahid's explanation of it as referring to trade, as reported in Tafsir Ibn Kathir (1/697). It said that if the warehouse only fills cylinders, sells them full and exchanges them for empty ones, the trade is confined to the gas, so zakat is due on the value of the gas and not on the cylinders, which are containers for the goods and lack the condition of growth. It cited a hadith narrated by al-Bukhari whose meaning is that a Muslim owes no alms on his horse or his slave, and Umayra's gloss that zakat is due only on growing wealth. The trader values the gas he owns at the end of the zakat year, adds his other cash, and if the total reaches the nisab pays 2.5% on all of it. If, however, the warehouse sells cylinders both empty and full and earns from both, they are trade goods, and zakat is due on the value of the empty cylinder plus the value of the gas in it."
  ur: "ہول سیل گودام میں گیس سلنڈروں کی زکوٰۃ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر گودام کی تجارت صرف گیس بیچنے اور سلنڈر بدلنے تک محدود ہو تو زکوٰۃ صرف گیس کی قیمت پر ہے کیونکہ سلنڈر برتن ہیں؛ اور اگر وہ خالی اور بھرے دونوں سلنڈر بیچتا ہو تو وہ تجارتی سامان ہیں اور گیس سمیت ان کی قیمت پر زکوٰۃ واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصلاً ہر وہ چیز جو تجارت کے لیے رکھی جائے اس پر زکوٰۃ واجب ہے، اور [[passage/quran-2-267|سورۃ البقرہ 2:267]] اور تفسیر ابن کثیر (1/697) میں منقول مجاہد کی تفسیر کا حوالہ دیا کہ اس سے مراد تجارت ہے۔ اس نے کہا کہ اگر گودام صرف سلنڈر بھرتا، بھرے ہوئے بیچتا اور خالی سلنڈروں سے بدلتا ہے تو تجارت گیس تک محدود ہے، اس لیے زکوٰۃ گیس کی قیمت پر ہے، سلنڈروں پر نہیں، کیونکہ وہ سامان کے برتن ہیں اور ان میں نمو کی شرط نہیں۔ اس نے بخاری کی روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ مسلمان پر اس کے گھوڑے اور غلام میں صدقہ نہیں، اور عمیرہ کے حاشیے کا کہ زکوٰۃ صرف بڑھنے والے مال پر ہے۔ تاجر سال کے آخر میں اپنی ملکیت کی گیس کی قیمت لگائے، اس میں اپنی دوسری نقدی ملائے، اور اگر نصاب کو پہنچے تو سب پر 2.5% زکوٰۃ دے۔ لیکن اگر گودام خالی اور بھرے دونوں سلنڈر بیچتا اور دونوں سے کماتا ہے تو وہ تجارتی سامان ہیں، اور خالی سلنڈر کی قیمت اور اس میں بھری گیس کی قیمت دونوں پر زکوٰۃ واجب ہے۔"
