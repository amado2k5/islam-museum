summary:
  ar: "كتاب لرشيد الدين جمع فيه رسائل كتبها في مسائل متفرقة، ويتكون من مقدمة وتسع عشرة رسالة، تدور حول تفسير اسم الله وتقسيم الموجودات وتفسير آيات والمعراج وأمية النبي والإحسان ومدح العلماء {cite:jami-al-tawarikh-khashshab-1960 p. 172}. كتبه بطلب من السلطان ألجايتو الذي طلب منه تفسير بعض الآيات، فزوده بكل ضروب البسط الممكنة {cite:jami-al-tawarikh-khashshab-1960 p. 172}."
  en: "A work by Rashid al-Din that gathers, in one volume, treatises he had written on several subjects. It has an introduction and nineteen treatises, on the divine name, the classification of beings, verses of the Qur'an, the ascension narrative, the unlettered status of the Prophet, the virtue of knowledge and praise of scholars {cite:jami-al-tawarikh-khashshab-1960 p. 172}. Sultan Oljeitu asked him to explain some verses, and he expanded these explanations as far as he could {cite:jami-al-tawarikh-khashshab-1960 p. 172}."
  es: "Obra de Rashid al-Din que reúne en un volumen tratados escritos sobre temas diversos. Consta de una introducción y diecinueve tratados sobre el nombre de Dios, la clasificación de los seres, versículos coránicos, el relato de la ascensión, el carácter iletrado del Profeta, el valor del saber y el elogio de los sabios {cite:jami-al-tawarikh-khashshab-1960 p. 172}. El sultán Oljeitu le pidió explicar algunos versículos, y él amplió esas explicaciones cuanto pudo {cite:jami-al-tawarikh-khashshab-1960 p. 172}."
  fr: "Ouvrage de Rashid al-Din qui réunit en un volume des traités rédigés sur des sujets variés. Il comporte une introduction et dix-neuf traités sur le nom de Dieu, la classification des êtres, des versets coraniques, le récit de l'ascension, le statut d'illettré du Prophète, la valeur du savoir et l'éloge des savants {cite:jami-al-tawarikh-khashshab-1960 p. 172}. Le sultan Oljeitu lui demanda d'expliquer certains versets, et il développa ces explications autant qu'il le put {cite:jami-al-tawarikh-khashshab-1960 p. 172}."
  ur: "رشید الدین کی ایک کتاب جس میں اس نے مختلف موضوعات پر لکھے گئے رسالے ایک جلد میں جمع کیے۔ اس میں ایک مقدمہ اور انیس رسالے ہیں، جو اسم اللہ، موجودات کی تقسیم، قرآنی آیات کی تفسیر، معراج، نبی کے ان پڑھ ہونے، علم کی فضیلت اور علماء کی مدح سے متعلق ہیں {cite:jami-al-tawarikh-khashshab-1960 p. 172}۔ سلطان اولجایتو نے اس سے کچھ آیات کی تشریح مانگی، اور اس نے ان تشریحات کو حسب امکان پھیلایا {cite:jami-al-tawarikh-khashshab-1960 p. 172}۔"
  tr: "Rashid al-Din'in çeşitli konularda yazdığı risaleleri topladığı bir kitap, önsöz ve on dokuz risaleden oluşuyordu; bu kitap Tanrı'nın adının yorumlanması, mal paylaşımı, ayetlerin yorumu, Mi'raj, Peygamber'in Umeyyesi, mükemmellik ve alimlerin övgüsünü konu alıyor {cite:jami-al-tawarikh-khashshab-1960, s. 172}. Eseri, Sultan Aljeitu'nun isteğiyle yazdı; Aljeitu, kendisinden bazı ayetleri yorumlamasını istedi ve mümkün olan tüm açıklamaları sağladı {cite:jami-al-tawarikh-khashshab-1960, s. 172}."
  id: "Sebuah buku karya Rashid al-Din yang mengumpulkan risalah yang ia tulis tentang berbagai isu, terdiri dari pengantar dan sembilan belas risalah yang berfokus pada penafsiran nama Tuhan, pembagian harta, penafsiran ayat, Mi'raj, Umayyah Nabi, keunggulan, dan pujian para ulama {cite:jami-al-tawarikh-khashshab-1960, hlm. 172}. Ia menulisnya atas permintaan Sultan Aljeitu, yang memintanya untuk menafsirkan beberapa ayat, dan ia memberikannya dengan segala penjelasan yang mungkin {cite:jami-al-tawarikh-khashshab-1960, hlm. 172}."
