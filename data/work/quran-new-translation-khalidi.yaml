label: { ar: "القرآن: ترجمة جديدة ⁦(طريف الخالدي)⁩", en: "The Qur'an: A New Translation (Tarif Khalidi)", ur: "دی قرآن: نیا ترجمہ ⁦(طریف خالدی)⁩", es: "El Corán: Una nueva traducción (Tarif Khalidi)", fr: "Le Coran: une nouvelle traduction (Tarif Khalidi)" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها المؤرخ طريف الخالدي، أستاذ الدراسات الإسلامية في الجامعة الأمريكية في بيروت، ونشرتها سلسلة كلاسيكيات بنغوين سنة 2008 خلفًا لترجمة داود القديمة في السلسلة نفسها؛ تحاول أن تنقل إيقاع القرآن وبنيته، فتعرض المقاطع القصصية والتشريعية نثرًا والمقاطع الوجدانية والغيبية في هيئة شعرية، دون حواشٍ للسياق، ووصفها ضياء الدين سردار بأنها إنجاز رائع مع مآخذ على الترقيم وغياب الفهرس."
  en: "An English rendering of the meanings of the Qur'an by the historian Tarif Khalidi, professor of Islamic studies at the American University of Beirut, published in Penguin Classics in 2008 as the successor to N. J. Dawood's old Penguin translation; it tries to convey the Qur'an's rhythm and structure, setting narrative and legislative passages as prose and dramatic and metaphysical ones in verse form, without context notes, and Ziauddin Sardar called it a magnificent achievement while faulting its numbering and its lack of an index."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از مؤرخ طریف خالدی، امریکن یونیورسٹی آف بیروت میں اسلامیات کے پروفیسر، جو 2008 میں پینگوئن کلاسکس میں اسی سلسلے کے داؤد کے پرانے ترجمے کی جگہ شائع ہوا؛ یہ قرآن کے آہنگ اور ساخت کو منتقل کرنے کی کوشش کرتا ہے، قصص اور احکام کے حصے نثر میں اور وجدانی و غیبی حصے شعری صورت میں، بغیر سیاقی حواشی کے؛ ضیاء الدین سردار نے اسے شاندار کارنامہ کہا مگر نمبر شماری اور اشاریے کی کمی پر اعتراض کیا۔"
  es: "Una traducción al inglés de los significados del Corán realizada por el historiador Tarif Khalidi, profesor de estudios islámicos en la Universidad Americana de Beirut, publicada por Penguin Classics en 2008 como sucesora de la antigua traducción de NJ Dawood para Penguin; intenta transmitir el ritmo y la estructura del Corán, presentando los pasajes narrativos y legislativos en prosa y los dramáticos y metafísicos en verso, sin notas contextuales, y Ziauddin Sardar la calificó de logro magnífico, aunque criticó su numeración y la falta de un índice."
  fr: "Une traduction anglaise des significations du Coran par l'historien Tarif Khalidi, professeur d'études islamiques à l'Université américaine de Beyrouth, publiée dans Penguin Classics en 2008 comme successeur de l'ancienne traduction Penguin de NJ Dawood; elle tente de transmettre le rythme et la structure du Coran, en présentant les passages narratifs et législatifs sous forme de prose et les passages dramatiques et métaphysiques sous forme de vers, sans notes de contexte, et Ziauddin Sardar l'a qualifiée de réalisation magnifique tout en critiquant sa numérotation et l'absence d'index."
