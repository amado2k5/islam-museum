summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها المؤرخ طريف الخالدي، أستاذ الدراسات الإسلامية في الجامعة الأمريكية في بيروت، ونشرتها سلسلة كلاسيكيات بنغوين سنة 2008 خلفًا لترجمة داود القديمة في السلسلة نفسها؛ تحاول أن تنقل إيقاع القرآن وبنيته، فتعرض المقاطع القصصية والتشريعية نثرًا والمقاطع الوجدانية والغيبية في هيئة شعرية، دون حواشٍ للسياق، ووصفها ضياء الدين سردار بأنها إنجاز رائع مع مآخذ على الترقيم وغياب الفهرس."
  en: "An English rendering of the meanings of the Qur'an by the historian Tarif Khalidi, professor of Islamic studies at the American University of Beirut, published in Penguin Classics in 2008 as the successor to N. J. Dawood's old Penguin translation; it tries to convey the Qur'an's rhythm and structure, setting narrative and legislative passages as prose and dramatic and metaphysical ones in verse form, without context notes, and Ziauddin Sardar called it a magnificent achievement while faulting its numbering and its lack of an index."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از مؤرخ طریف خالدی، امریکن یونیورسٹی آف بیروت میں اسلامیات کے پروفیسر، جو 2008 میں پینگوئن کلاسکس میں اسی سلسلے کے داؤد کے پرانے ترجمے کی جگہ شائع ہوا؛ یہ قرآن کے آہنگ اور ساخت کو منتقل کرنے کی کوشش کرتا ہے، قصص اور احکام کے حصے نثر میں اور وجدانی و غیبی حصے شعری صورت میں، بغیر سیاقی حواشی کے؛ ضیاء الدین سردار نے اسے شاندار کارنامہ کہا مگر نمبر شماری اور اشاریے کی کمی پر اعتراض کیا۔"
