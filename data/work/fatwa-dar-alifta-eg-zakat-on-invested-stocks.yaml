id: work/fatwa-dar-alifta-eg-zakat-on-invested-stocks
class: work
kind: fatwa
label: { ar: "كيفية حساب الزكاة على المال المستثمر في الأسهم", en: "Calculating zakat on money invested in stocks", ur: "حصص میں لگی رقم پر زکات کا حساب", es: "Cálculo del zakat sobre el dinero invertido en acciones", fr: "Calcul de la zakat sur l'argent investi en actions", tr: "Hisse senetlerine yatırılan paranın zekatı nasıl hesaplanır", id: "Cara menghitung zakat pada uang yang diinvestasikan di saham" }
summary:
  ar: "سائل سأل عن حساب الزكاة على المال المستثمر في الأسهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22181)⁩ أن الزكاة واجبة في الأسهم المستثمرة في البورصة إذا تحققت فيها شروط وجوب الزكاة من بلوغ النصاب وحولان الحول الهجري، وبيّن الجواب طريقة الحساب على وجهه."
  en: "A questioner asked how to compute zakat on money invested in stocks. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22181) answered that zakat is due on stock-market investments when the conditions are met — reaching the nisab and the passing of a Hijri year; the answer sets out the method of calculation."
  ur: "ایک سائل نے اسٹاک مارکیٹ میں لگی رقم پر زکات کے حساب کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22181)⁩ نے جواب دیا کہ حصص پر لگی رقم میں زکات واجب ہے جب نصاب تک پہنچنے اور ہجری سال گزرنے کی شرائط پوری ہوں؛ جواب میں حساب کا طریقہ بیان ہوا۔"
  es: "Un consultante preguntó cómo calcular el zakat sobre el dinero invertido en acciones. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22181) respondió que el zakat se debe pagar sobre las inversiones en bolsa cuando se cumplen las condiciones: alcanzar el nisab y que haya transcurrido un año Hijri; la respuesta detalla el método de cálculo."
  fr: "Un internaute a demandé comment calculer la zakat sur les sommes investies en actions. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22181) a répondu que la zakat est due sur les investissements boursiers lorsque les conditions sont remplies: l’atteinte du nisab et le passage d’une année hégirienne. La réponse détaille la méthode de calcul."
  tr: "Bir soru soran kişi, hisse senetlerine yatırılan paralar üzerinden zekatın hesaplanması hakkında soru sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22181), zekat zorunluluğu koşulları sağlandığında, örneğin nisab ve iki ay hicri yılına ulaşıldığında, borsada yatırılan hisseler üzerinde zekatın zorunlu olduğunu yanıtlamıştır. Cevap, hesaplama yöntemini buna göre netleştirmiştir."
  id: "Seorang penanya menanyakan tentang perhitungan zakat atas uang yang diinvestasikan dalam saham. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22181) menjawab bahwa zakat wajib pada saham yang diinvestasikan di bursa saham jika syarat kewajiban zakat terpenuhi, seperti mencapai nisab dan dua tahun lunar. Jawaban tersebut menjelaskan metode perhitungan sesuai dengan itu."
