summary:
  ar: "كتاب لابن أبي الدنيا ⁦(208–281هـ)⁩ في المطر والرعد والبرق والريح، جمع فيه ما ورد في ذلك من الآثار، ونقل عنه السيوطي في أبواب الظواهر الجوية {cite:heinen-islamic-cosmology p. 62} {cite:heinen-islamic-cosmology p. 63}."
  en: "A book by Ibn Abi al-Dunya (208–281 AH) on rain, thunder, lightning and wind, gathering the relevant reports; al-Suyuti quoted it in his meteorological chapters {cite:heinen-islamic-cosmology p. 62} {cite:heinen-islamic-cosmology p. 63}."
  ur: "ابن ابی الدنیا ⁦(208–281ھ)⁩ کی کتاب بارش، رعد، برق اور ہوا کے بارے میں آثار پر؛ سیوطی نے موسمی مظاہر کے ابواب میں اس سے نقل کیا {cite:heinen-islamic-cosmology p. 62}."
  es: "Un libro de Ibn Abi al-Dunya (208–281 AH) sobre la lluvia, los truenos, los relámpagos y el viento, que recopila los informes pertinentes; al-Suyuti lo citó en sus capítulos meteorológicos {cite:heinen-islamic-cosmology p. 62} {cite:heinen-islamic-cosmology p. 63}."
  fr: "Un livre d'Ibn Abi al-Dunya (208-281 AH) sur la pluie, le tonnerre, la foudre et le vent, rassemblant les rapports pertinents; al-Suyuti l'a cité dans ses chapitres météorologiques {cite:heinen-islamic-cosmology p. 62} {cite:heinen-islamic-cosmology p. 63}."
  tr: "İbn Abi Dunya'nın (208–281 H) yağmur, gök gürültüsü, şimşek ve rüzgar üzerine yazdığı bir kitapta, bu konulara dair raporlar toplanmıştır ve El-Suyuti bunu atmosferik olaylar üzerine bölümlerde alıntılamıştır {cite:heinen-islamic-cosmology, s. 62} {cite:heinen-islamic-cosmology, s. 63}."
  id: "Sebuah buku karya Ibn Abi Dunya (208–281 H) tentang hujan, guntur, petir, dan angin, di mana ia mengumpulkan laporan tentang hal-hal tersebut, dan Al-Suyuti mengutipnya dalam bab-bab tentang fenomena atmosfer {cite:heinen-islamic-cosmology, hlm. 62} {cite:heinen-islamic-cosmology, hlm. 63}."
