id: work/fatwa-amja-inner-speech-pardoned
class: work
kind: fatwa
label: { ar: "وسوسة حديث النفس معفو عنها", en: "Whispered thoughts are pardoned", ur: "دل کی وسوسہ بخشی ہوئی", es: "Los pensamientos susurrados son perdonados.", fr: "Les pensées murmurées sont pardonnées", tr: "Kendi kendine konuşma fısıltısı affedilir", id: "Bisikan bicara diri dimaafkan" }
summary:
  ar: "سأل موسوس يعيد نفس الموضوع بصيغ مختلفة هل عليه شيء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78061 بتاريخ 4 مارس 2009)⁩ أن وساوسه قد أرهقته وأنهم قد أجابوه سابقًا وذكروا له أن الله تجاوز لهذه الأمة عما حدثت به نفسها ما لم تعمل به أو تتكلم به، فلا يسترسل مع هذه الوساوس بل يقطع مبادئها ويقول الحمد لله الذي رد كيده إلى الوسوسة فإنها لا تضره بإذن الله."
  en: "A chronic whisperer who kept returning to the same topic in new shapes asked whether anything is on him. Dr. Salah al-Sawi (fatwa no. 78061, 4 March 2009) answered that his whispers had wearied him and they had answered before: God has pardoned this ummah for what its selves whisper, so long as it does not act on or utter it; he should not indulge the whispers but cut them at the root and say 'praise be to God who turned his plot into mere whispering' — it will not harm him, God willing."
  ur: "ایک موسوس سائل نے بار بار سوال کیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78061، 4 مارچ 2009)⁩ کے مطابق دل کے وسوسے معاف ہیں جب تک عمل یا زبان نہ آئے — وسوسے کو جڑ سے کاٹے اور حمد کہے۔"
  es: "Un murmurador crónico que volvía una y otra vez al mismo tema con nuevas formas preguntó si algo le afectaba. El Dr. Salah al-Sawi (fatwa n.º 78061, 4 de marzo de 2009) respondió que sus murmuraciones lo habían cansado y que ya le habían respondido antes: Dios ha perdonado a esta ummah por lo que murmura, siempre y cuando no actúe en consecuencia ni lo pronuncie; no debe ceder ante las murmuraciones, sino cortarlas de raíz y decir: «¡Alabado sea Dios que convirtió su plan en mero susurro!». Si Dios quiere, no le hará daño."
  fr: "Un homme, qui revenait sans cesse au même sujet sous différentes formes, demanda s'il était visé par une fatwa. Le Dr Salah al-Sawi (fatwa n° 78061, 4 mars 2009) répondit que ses murmures l'avaient lassé et qu'une réponse avait déjà été donnée: Dieu a pardonné à cette communauté ses murmures, pourvu qu'elle ne les mette pas en pratique ni ne les profère; il ne doit pas s'y attarder, mais les étouffer dans l'œuf et dire: « Louange à Dieu qui a réduit son complot à de simples murmures » — cela ne lui nuira pas, si Dieu le veut."
  tr: "Mussos aynı konuyu farklı biçimlerde tekrarladı: Onda bir sorun mu var? Dr. Salah Al-Sawy (4 Mart 2009 tarihli 78061 No. Fetva) fısıltılarının onu yorduğunu ve daha önce ona cevap verip, Tanrı'nın bu ulusun kendine yaptıklarını affettiğini, ancak harekete geçmeden ya da konuşmadığını söylediklerini söylediklerini söyledi. Bu fısıltılara devam etmiyor, ilkelerini kesiyor ve şöyle diyor: \"Komplosunu fısıltıya çeviren Allah'a şükürler olsun, çünkü İnşallah ona zarar vermezler.\""
  id: "Mussos mengulangi topik yang sama dalam berbagai bentuk: Apakah ada yang salah dengannya? Dr. Salah Al-Sawy menjawab (Fatwa No. 78061 tanggal 4 Maret 2009) bahwa bisikan-bisinya telah melelahkan, dan sebelumnya telah menjawabnya dan mengatakan bahwa Tuhan telah mengampuni bangsa ini atas apa yang telah dilakukannya sendiri tanpa bertindak atau membicarakannya. Dia tidak bersikeras dengan bisikan-bisikan itu tetapi memotong prinsip-prinsipnya dan berkata, \"Puji bagi Allah yang mengubah rencana-Nya kembali menjadi bisikan, karena mereka tidak menyakiti Dia, jika Allah menghendaki.\""
