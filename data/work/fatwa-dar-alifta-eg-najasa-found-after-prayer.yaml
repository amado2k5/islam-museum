id: work/fatwa-dar-alifta-eg-najasa-found-after-prayer
class: work
kind: fatwa
label: { ar: "حكم صلاة من رأى نجاسة على ثوبه بعد الانتهاء من الصلاة", en: "The prayer of one who finds impurity on his garment after finishing", ur: "نماز کے بعد کپڑے پر نجاست دیکھنے والے کی نماز", es: "La oración de aquel que encuentra impureza en su vestimenta después de terminar", fr: "La prière de celui qui trouve une impureté sur son vêtement après avoir fini", tr: "Dua tamamlandıktan sonra giysisinde kirlilik gören biri için dua etme kararı", id: "Aturan tentang berdoa untuk seseorang yang melihat kotoran pada pakaiannya setelah selesai berdoa" }
summary:
  ar: "سائل رأى نجاسة على ثوبه بعد الانتهاء من الصلاة فسأل عن حكم صلاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21747)⁩ أن طهارة الثوب والبدن والمكان شرط لصحة الصلاة ولا تصح صلاة من صلى عالمًا بالنجاسة اتفاقًا أما من علم بعد الفراغ فله حكمه على ما فصّل الجواب."
  en: "A man found impurity on his garment after finishing his prayer and asked its ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21747) answered that purity of garment, body and place is a condition of the prayer's validity; one who prays knowing of impurity — his prayer is invalid by agreement — while one who learns after finishing has his own ruling, as the answer details."
  ur: "ایک شخص نے نماز مکمل کرنے کے بعد کپڑے پر نجاست پائی؛ اس نے نماز کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21747)⁩ نے جواب دیا کہ کپڑے، بدن اور جگہ کی پاکیزگی نماز کی شرط ہے؛ جانتے ہوئے نماز پڑھنے والا — اس کی نماز اتفاق سے باطل — مگر بعد میں علم ہونے والے کا حکم الگ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre descubrió una impureza en su vestimenta tras terminar su oración y preguntó al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21747) respondió que la pureza de la vestimenta, el cuerpo y el lugar es condición para la validez de la oración; quien reza sabiendo de la impureza, su oración es inválida por acuerdo mutuo, mientras que quien se entera después de terminar tiene su propia interpretación, como se detalla en la respuesta."
  fr: "Un homme a constaté une impureté sur son vêtement après avoir accompli sa prière et a demandé un avis juridique à ce sujet. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21747) a répondu que la pureté du vêtement, du corps et du lieu est une condition de validité de la prière; celui qui prie en sachant qu'il y a une impureté – sa prière est invalide par consensus – tandis que pour celui qui s'en aperçoit après avoir terminé sa prière, il existe une autre jurisprudence, comme le précise la réponse."
  tr: "Bir soru soran kişi namazını bitirdikten sonra giysisinde kirlilik gördü ve namazına ilişkin hükmü sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21747), giysinin saflığının, bedenin ve yerin temizliğinin namazın geçerliliği için koşul olduğunu, ancak kirliliği bilerek namaz kılanın namazının oybirliğiyle geçerli olmadığını yanıtladı. Ancak, bitirdikten sonra bilen kişi, cevabında belirtilen hükmü almaya hak kazanır."
  id: "Seorang penanya melihat kotoran pada pakaiannya setelah selesai shalat dan menanyakan tentang keputusan atas doanya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21747) menjawab bahwa kemurnian pakaian, tubuh, dan tempat adalah syarat keabsahan doa, tetapi doa seseorang yang berdoa dengan mengetahui ketidakmurnian tidak sah secara konsensus. Namun, seseorang yang mengetahui setelah selesai berhak atas keputusan sebagaimana dijelaskan dalam jawaban."
