id: work/fatwa-dar-alifta-eg-najasa-found-after-prayer
class: work
kind: fatwa
label: { ar: "حكم صلاة من رأى نجاسة على ثوبه بعد الانتهاء من الصلاة", en: "The prayer of one who finds impurity on his garment after finishing", ur: "نماز کے بعد کپڑے پر نجاست دیکھنے والے کی نماز" }
summary:
  ar: "سائل رأى نجاسة على ثوبه بعد الانتهاء من الصلاة فسأل عن حكم صلاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21747)⁩ أن طهارة الثوب والبدن والمكان شرط لصحة الصلاة ولا تصح صلاة من صلى عالمًا بالنجاسة اتفاقًا أما من علم بعد الفراغ فله حكمه على ما فصّل الجواب."
  en: "A man found impurity on his garment after finishing his prayer and asked its ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21747) answered that purity of garment, body and place is a condition of the prayer's validity; one who prays knowing of impurity — his prayer is invalid by agreement — while one who learns after finishing has his own ruling, as the answer details."
  ur: "ایک شخص نے نماز مکمل کرنے کے بعد کپڑے پر نجاست پائی؛ اس نے نماز کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21747)⁩ نے جواب دیا کہ کپڑے، بدن اور جگہ کی پاکیزگی نماز کی شرط ہے؛ جانتے ہوئے نماز پڑھنے والا — اس کی نماز اتفاق سے باطل — مگر بعد میں علم ہونے والے کا حکم الگ ہے — جیسا کہ جواب میں تفصیل ہے۔"
