summary:
  ar: "من كتب المسعودي المفقودة، أتبع فيه جملاً من أخبار علي وزهده وسيره وأنواع كلامه وخطبه في أخبار آل محمد، وذكره عند انقضاء باب فضائل علي في مروج الذهب {cite:muruj-al-dhahab p. 714}."
  en: "One of Mas'udi's lost works — his collected reports of Ali and the Prophet's house, cited as his fuller treatment beyond what Muruj could hold {cite:muruj-al-dhahab p. 714}."
  es: "Una de las obras perdidas de Mas'udi: sus informes recopilados sobre Ali y la casa del Profeta, citados como su tratamiento más completo que el que Muruj pudo contener {cite:muruj-al-dhahab p. 714}."
  fr: "L'une des œuvres perdues de Mas'udi — ses rapports rassemblés sur Ali et la maison du Prophète, cités comme son traitement plus complet au-delà de ce que Muruj pouvait contenir {cite:muruj-al-dhahab p. 714}."
  ur: "مسعودی کے گمشدہ کاموں میں سے ایک - علی اور پیغمبر کے گھر کے بارے میں ان کی جمع کردہ رپورٹیں، مروج کے پاس اس سے زیادہ مکمل علاج کے طور پر حوالہ دیا گیا ہے {حوالہ: مروج الذہاب صفحہ 714}۔"
  tr: "El-Mes'udi'nin kayıp kitapları arasında, Ali'nin bazı raporlarını takip ettiği eserler arasında, Muhammed'in ailesinin hikâyeleri üzerine asketizm, biyografi, konuşma türleri ve vaazlar yer alır ve Muruj al-Dhahab'daki Ali'nin erdemleri üzerine bölümün sonunda ondan bahsedilmiştir {cite:muruj-al-dhahab, s. 714}."
  id: "Di antara buku-buku Al-Mas'udi yang hilang, ia mengikuti beberapa laporan Ali, asketisme, biografi, jenis ucapan, dan khotbah tentang kisah keluarga Muhammad, dan menyebutnya di akhir bab tentang kebajikan Ali dalam Muruj al-Dhahab {cite:muruj-al-dhahab, hlm. 714}."
