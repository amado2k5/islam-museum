summary:
  ar: "رسالة مفقودة لـ[[person/al-battani|البتاني]] ذكرها ابن النديم والقفطي وابن خلكان، ويرى نالينو أنها في حساب «التسييرات» التنجيمية، وهو موضوع الباب الخامس والخمسين من الزيج {cite:nallino-albatenii-opus-astronomicum p. 28}."
  en: "A lost treatise by [[person/al-battani|al-Battani]] listed by Ibn al-Nadim, al-Qifti and Ibn Khallikan; Nallino shows it dealt with computing astrological directions, the subject of chapter 55 of the Zij {cite:nallino-albatenii-opus-astronomicum p. 28}."
  ur: "[[person/al-battani|البتانی]] کا ایک گمشدہ رسالہ جسے ابن الندیم، قفطی اور ابن خلکان نے ذکر کیا؛ نالینو کے مطابق یہ نجومی «تسییرات» کے حساب پر تھا، جو زیج کے پچپن ویں باب کا موضوع ہے {cite:nallino-albatenii-opus-astronomicum p. 28}."
  es: "Un tratado perdido de [[persona/al-battani|al-Battani]] enumerado por Ibn al-Nadim, al-Qifti e Ibn Khallikan; Nallino muestra que trataba de calcular direcciones astrológicas, el tema del capítulo 55 del Zij {cita:nallino-albatenii-opus-astronomicum p. 28}."
  fr: "Un traité perdu de [[person/al-battani|al-Battani]] répertorié par Ibn al-Nadim, al-Qifti et Ibn Khallikan; Nallino montre qu'il traitait du calcul des directions astrologiques, sujet du chapitre 55 du Zij {cite:nallino-albatenii-opus-astronomicum p. 28}."
  tr: "[[kişi/al-battani|al-Battani]] tarafından yazılan kayıp bir mektup, İbn el-Nadim, el-Qifti ve İbn Khallikan tarafından bahsedilmiş, Nalino bunun astrolojik 'al-tasirat' hesaplamasında yer aldığını kabul eder; bu mektup Zij'in elli beşinci bölümünün konusudur {cite:nallino-albatenii-opus-astronomicum s. 28}."
  id: "Surat yang hilang oleh [[orang/al-battani|al-Battani]] yang disebutkan oleh Ibn al-Nadim, al-Qifti, dan Ibn Khallikan, dan Nalino menganggapnya sebagai bagian dari perhitungan astrologi 'al-tasirat', yang menjadi subjek bab ke-lima puluh lima Zij {cite:nallino-albatenii-opus-astronomicum hlm. 28}."
