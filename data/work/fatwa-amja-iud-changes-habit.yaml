id: work/fatwa-amja-iud-changes-habit
class: work
kind: fatwa
label: { ar: "اللولب وتغير العادة", en: "The IUD changes the monthly habit — how to judge", ur: "لولب سے عادت بدلنا — حکم", es: "El DIU cambia el hábito mensual: cómo juzgar", fr: "Le stérilet modifie les règles — comment s'y prendre", tr: "Spiral ve Alışkanlık Değişikliği", id: "IUD dan Perubahan Kebiasaan" }
summary:
  ar: "سألت امرأة متخبطة من تركيب اللولب عن أحكامها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21956 بتاريخ 3 أكتوبر 2007)⁩ أن عادة المرأة الشهرية تتغير بسبب تركيب اللولب في أغلب الحالات مما يلقي بظلال من التشويش على كثير من الأحكام من طهارة وصلاة وصوم وطواف ومس مصحف ووطء ونحوه فينبغي اعتبار ما تراه من دم على ضوء عادتها المتجددة وما ثبت بالتمييز على ما فصّل الجواب."
  en: "A woman flustered by having an IUD fitted asked about her rulings. Dr. Salah al-Sawi (fatwa no. 21956, 3 October 2007) answered that a woman's monthly habit changes with an IUD in most cases, casting confusing shadows on many rulings — purity, prayer, fasting, tawaf, touching the mushaf, intercourse and the like; so the blood she sees should be measured against her renewed habit and what distinction settles — as the answer details."
  ur: "لولب لگوانے کے بعد عادت بگڑے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21956، 3 اکتوبر 2007)⁩ کے مطابق نئی عادت اور تمييز کو بنیاد بنائیں۔"
  es: "Una mujer, confundida por la colocación de un DIU, preguntó sobre las normas al respecto. El Dr. Salah al-Sawi (fatwa n.° 21956, 3 de octubre de 2007) respondió que, en la mayoría de los casos, el ciclo menstrual de la mujer cambia con el uso del DIU, lo que genera confusión en muchas normas —como la pureza, la oración, el ayuno, el tawaf, tocar el Corán, las relaciones sexuales, etc.—; por lo que la sangre que ve debe compararse con su nuevo ciclo menstrual y determinar qué distinción se establece, como se detalla en la respuesta."
  fr: "Une femme, perturbée par la pose d'un stérilet, a interrogé le Dr Salah al-Sawi sur les règles sanitaires. Le Dr Salah al-Sawi (fatwa n° 21956, 3 octobre 2007) a répondu que les menstruations d'une femme sont modifiées par la pose d'un stérilet dans la plupart des cas, ce qui peut engendrer des interrogations sur de nombreuses règles: pureté, prière, jeûne, tawaf, contact avec le mushaf, rapports sexuels, etc. Il convient donc d'interpréter les saignements menstruels au regard de ces nouvelles habitudes et de déterminer la marche à suivre, comme le précise la réponse."
  tr: "Spiral takımı ve kararları hakkında kafası karışık bir kadına sordum. Dr. Salah Al-Sawy (Fetva No. 21956, 3 Ekim 2007) kadının adet döngüsünün çoğu durumda spiral takılması nedeniyle değiştiğini, bunun saflık, dua, oruç, çevre dolaşma, Kur'an dokunma, cinsel ilişki gibi birçok kural üzerinde kafa karışıklığı yarattığını yanıtladı. Bu nedenle, gördüğü kan, yenilenmiş adet dönemi ve ayrıcalıkla kanıtlanmış olan cevap ışığında değerlendirilmelidir."
  id: "Saya bertanya kepada seorang wanita yang bingung tentang pemasangan IUD dan keputusannya. Dr. Salah Al-Sawy (Fatwa No. 21956 tanggal 3 Oktober 2007) menjawab bahwa siklus menstruasi wanita berubah akibat pemasangan IUD dalam banyak kasus, yang menimbulkan kebingungan atas banyak aturan seperti kemurnian, shalat, puasa, keliling jalan, menyentuh Al-Quran, hubungan seksual, dan sejenisnya. Oleh karena itu, darah yang dia lihat harus dipertimbangkan berdasarkan menstruasi barunya dan apa yang telah dibuktikan dengan perbedaan, seperti yang dijelaskan dalam jawaban."
