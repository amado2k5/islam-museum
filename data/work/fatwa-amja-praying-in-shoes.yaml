id: work/fatwa-amja-praying-in-shoes
class: work
kind: fatwa
label: { ar: "الصلاة في الحذاء", en: "Praying in shoes — lawful, with a note on today's mosques", ur: "جوتوں میں نماز — جائز", es: "Orar con zapatos puestos: permitido, con una nota sobre las mezquitas actuales." }
summary:
  ar: "سأل سائل عن بيان سنة الصلاة في الحذاء. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21984 بتاريخ 14 أكتوبر 2012)⁩ أنه لا بأس في الصلاة في الحذاء لأمره بمخالفة اليهود الذين لا يصلون في نعالهم لكن المساجد لم تكن في عهد النبي على ما هي عليه اليوم من الفرش على ما فصّل الجواب من مراعاة نظافة المساجد المعاصرة."
  en: "A questioner asked how the sunna of praying in shoes is clarified. AMJA's fatwa committee (fatwa no. 21984, 14 October 2012) answered that there is no harm in praying in shoes — for the command to differ from the Jews who do not pray in their sandals — but the mosques in the Prophet's day were not carpeted as they are today, the answer weighing present-day mosque cleanliness."
  ur: "جوتوں میں نماز؟ لجنة الفتوى ⁦(فتویٰ 21984، 14 اکتوبر 2012)⁩ کے مطابق جائز؛ البتہ آج کی فرش والی مساجد کی نظافت ملحوظ۔"
  es: "Un interlocutor preguntó cómo se aclara la sunna de rezar con zapatos. El comité de fatwas de AMJA (fatwa n.º 21984, 14 de octubre de 2012) respondió que no hay inconveniente en rezar con zapatos —ya que el mandato difiere del de los judíos que no rezan con sandalias—, pero que las mezquitas en tiempos del Profeta no estaban alfombradas como lo están hoy en día, teniendo en cuenta la limpieza actual de las mezquitas."
