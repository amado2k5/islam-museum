id: work/fatwa-aliftaa-jo-wearing-energy-stones
class: work
kind: fatwa
label: { ar: "ارتداء أحجار الطاقة", en: "Wearing energy stones", ur: "توانائی کے پتھر پہننا" }
summary:
  ar: "سؤال عن ارتداء أحجار الطاقة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في التزين بالأحجار الكريمة المعتادة، وأن أحجار الطاقة للعلاج تحكمها التجربة والدراسات العلمية، فإن ثبت نفعها فلا مانع منها، على ألا يعتقد أن الحجر بذاته نافع أو ضار. أجابت الدائرة بأنه لا حرج على المرأة في التزين بلبس الأحجار الكريمة كالياقوت والعقيق وغيرها إذا كانت مما يتزين به عادة. وقالت إن ما يسمى أحجار الطاقة إذا استعمل بقصد التداوي فإن أمره تحكمه التجربة والدراسات العلمية التي تثبت أن له أثرًا أو لا، فإن دلت الدراسات أو التجارب على نفعه لصحة الإنسان فلا مانع من استعماله، لأنه من جملة خلق الله كالعقاقير المأخوذة من النبات وغيره. واشترطت ألا يعتقد المسلم أن الحجر بذاته هو النافع أو الضار، وإنما هو سبب من الأسباب، والأمر كله لله وحده."
  en: "A question about wearing energy stones, in which Jordan's General Iftaa Department answered that there is no objection to adorning oneself with customary gemstones, and that energy stones used for treatment are governed by experiment and scientific study: if their benefit is established they may be used, provided one does not believe the stone itself benefits or harms. The Department answered that there is no objection to a woman adorning herself with precious stones such as rubies, agate and the like, when they are among the things customarily worn for adornment. It said that so-called energy stones, when used for treatment, are a matter governed by experiment and scientific studies showing whether they have an effect; if studies or experience show a benefit to human health, there is no objection to using them, since they are part of God's creation like medicines taken from plants and other created things. It stipulated that a Muslim must not believe the stone itself is what benefits or harms; it is only one means among others, and the matter belongs to God alone."
  ur: "توانائی کے پتھر پہننا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ معمول کے قیمتی پتھروں سے زینت میں کوئی حرج نہیں، اور علاج کے لیے توانائی کے پتھروں کا معاملہ تجربے اور سائنسی مطالعات پر ہے؛ اگر ان کا فائدہ ثابت ہو تو استعمال میں حرج نہیں، بشرطیکہ یہ عقیدہ نہ ہو کہ پتھر بذاتِ خود نفع یا نقصان دیتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ عورت کے لیے یاقوت، عقیق اور دیگر قیمتی پتھروں سے زینت میں کوئی حرج نہیں جب وہ ان چیزوں میں سے ہوں جن سے عادتاً زینت کی جاتی ہے۔ اس نے کہا کہ نام نہاد توانائی کے پتھر اگر علاج کی نیت سے استعمال ہوں تو ان کا معاملہ تجربے اور سائنسی مطالعات پر ہے جو بتائیں کہ ان کا اثر ہے یا نہیں؛ اگر مطالعات یا تجربات انسانی صحت کے لیے ان کا فائدہ دکھائیں تو استعمال میں کوئی رکاوٹ نہیں، کیونکہ یہ بھی اللہ کی مخلوق ہیں، جیسے پودوں اور دیگر مخلوقات سے بنی دوائیں۔ اس نے شرط رکھی کہ مسلمان یہ عقیدہ نہ رکھے کہ پتھر بذاتِ خود نفع یا نقصان دیتا ہے؛ وہ محض اسباب میں سے ایک سبب ہے، اور اصل معاملہ صرف اللہ کے اختیار میں ہے۔"
