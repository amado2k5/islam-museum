label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن استفسارات المعهد العالمي للفكر الإسلامي بواشنطن", en: "IIFA resolution on the IIIT (Washington) queries — adopted answers", ur: "اکیڈمی کی قرارداد: معہد عالمی فکر اسلامی ⁦(واشنگٹن)⁩ کے سوالات کے جوابات", es: "Resolución de la IIFA sobre las consultas del IIIT (Washington): respuestas adoptadas", fr: "Résolution de l'IIFA sur les questions de l'IIIT (Washington) — réponses adoptées", tr: "Washington'daki Uluslararası İslami Düşünce Enstitüsü'nün talepleri hakkında Uluslararası İslami Fiqh Akademisi Kararı", id: "Keputusan Akademi Fiqh Islam Internasional terkait pertanyaan dari Institut Internasional Pemikiran Islam di Washington" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: أقر إجابات على استفسارات المعهد العالمي للفكر الإسلامي بواشنطن وكلف الأمانة العامة بتبليغها المعهد، ومنها حكم زواج المسلمة بغير المسلم إذا طمعت في إسلامه بعد الزواج على ما جاء في نص الإجابات."
  en: "IIFA's third-session resolution (Amman, October 1986) adopted answers to the International Institute of Islamic Thought's queries and tasked the secretariat with conveying them — including the ruling on a Muslim woman marrying a non-Muslim in the hope of his later accepting Islam, as the adopted answers set out."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: واشنگٹن کے معہد کے سوالات کے جوابات منظور کیے — بشمول مسلم خاتون کی غیر مسلم سے شادی کا حکم۔"
  es: "La resolución del tercer período de sesiones del IIFA (Amán, octubre de 1986) adoptó las respuestas a las preguntas del Instituto Internacional de Pensamiento Islámico y encargó a la secretaría que las transmitiera, incluyendo la resolución sobre el matrimonio de una mujer musulmana con un no musulmán con la esperanza de que este se convierta posteriormente al Islam, tal como se establece en las respuestas adoptadas."
  fr: "La résolution de la troisième session de l'IIFA (Amman, octobre 1986) a adopté les réponses aux questions de l'Institut international de la pensée islamique et a chargé le secrétariat de les transmettre, y compris la décision concernant le mariage d'une femme musulmane avec un non-musulman dans l'espoir que celui-ci se convertisse plus tard à l'islam, comme le prévoyaient les réponses adoptées."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986): Washington'daki Uluslararası İslami Düşünce Enstitüsü'nün sorularına verilen yanıtlar onaylandı ve Genel Sekreterliğe enstitüyü bilgilendirmesi görevi verildi; buna yanıtlarda belirtildiği üzere, evlendikten sonra Müslüman bir gayrimüslimle evlenmesi kararı da dahil olmak üzere."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiganya (Amman, Oktober 1986): Menyetujui tanggapan atas pertanyaan Institut Internasional Pemikiran Islam di Washington dan menugaskan Sekretariat Jenderal untuk memberitahukan institut, termasuk putusan tentang seorang wanita Muslim yang menikah dengan non-Muslim jika ia berharap memeluk Islam setelah menikah, sebagaimana tercantum dalam jawaban."
