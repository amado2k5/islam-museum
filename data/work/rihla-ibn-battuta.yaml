structure: "Ibn Juzayy's preface (Khayriyya ed. scan pp. 12-15); part 1: from Tangier (2 Rajab 725) through Tunis, Alexandria, Cairo, Syria, Medina, Mecca, Iraq and Persia, Yemen and the East African coast, Oman and the Gulf, Anatolia, the lands of Sultan Uzbek, Constantinople, Khwarazm, Transoxiana and Khurasan to the Indus (1 Muharram 734) (scan pp. 15-312); part 2: India and the Delhi sultanate of Muhammad Shah ibn Tughluq, the Maldives, Ceylon, China, the return to Fez, al-Andalus and the journey to Mali, ending at Fez (scan pp. 316-567)."
