id: work/fatwa-amja-hadith-not-written-claim
class: work
kind: fatwa
label: { ar: "الرد على دعوى منع تدوين السنة", en: "Answering the claim that recording the sunna was forbidden", ur: "سنت کے تصنیف پر ممنوعت کے دعوے کا جواب", es: "Respondiendo a la afirmación de que grabar la sunna estaba prohibido." }
summary:
  ar: "سأل سائل عن مقال يدعي أن النبي نهى عن تدوين السنة مستدلًا بحديث لا تكتبوا عني إلا القرآن. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82899 بتاريخ 19 أكتوبر 2010)⁩ أن المقال سلسلة من الأغاليط والأباطيل فقد اتفقت الأمة سلفًا وخلفًا على حجية السنة ودل عليه ما لا يحصى من الآيات وتؤكده بداهة العقل إذ كيف تعرف تفاصيل الصلاة والزكاة والحج بالقرآن وحده، وقد قيض الله للسنة الحفاظ الذين نقدوها نقد الصيارفة المهرة وتحقق بهم قوله إنا نحن نزلنا الذكر وإنا له لحافظون، ونبه على أن هذا العلم دين فليعرف عمن يؤخذ وأن التسوق المعرفي عبر الإنترنت ليس سبيلًا إلى الهدى."
  en: "A questioner cited an article claiming the Prophet forbade recording the sunna, citing the hadith 'write nothing from me but the Quran'. Dr. Salah al-Sawi (fatwa no. 82899, 19 October 2010) answered that the article is a chain of errors and falsehoods: the ummah, early and late, agreed on the sunna's authority, countless verses indicate it and plain reason confirms it — how would the details of prayer, zakat and hajj be known from the Quran alone? God appointed for the sunna master memorisers who vetted it as assayers vet coins, fulfilling in them 'We sent down the Reminder and We are its guardians'; he reminded the questioner that this knowledge is religion — mind whom you take your religion from — and that scavenging for religious knowledge online is no path to guidance. Recorded as AMJA's answer."
  ur: "ایک سائل نے اس مقالے کے بارے میں پوچھا جس میں دعویٰ تھا کہ نبی نے سنت لکھنے سے منع کیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82899، 19 اکتوبر 2010)⁩ کے مطابق یہ دعویٰ باطل ہے — امت سنت کے حجیت پر متفق ہے؛ ورنہ نماز زکوۃ حج کی تفصیل کیسے معلوم ہوتی۔"
  es: "Un consultante citó un artículo que afirmaba que el Profeta prohibió registrar la sunna, citando el hadiz «No escribas nada de mí excepto el Corán». El Dr. Salah al-Sawi (fatwa n.° 82899, 19 de octubre de 2010) respondió que el artículo es una cadena de errores y falsedades: la ummah, antigua y moderna, coincidió en la autoridad de la sunna, innumerables versículos lo indican y la razón lo confirma. ¿Cómo se podrían conocer los detalles de la oración, el zakat y el hajj solo a partir del Corán? Dios designó para la sunna a maestros memorizadores que la verificaron como los ensayadores verifican las monedas, cumpliendo en ellos «Enviamos el Recordatorio y Nosotros somos sus guardianes». Le recordó al consultante que este conocimiento es religión —tenga cuidado de quién toma su religión— y que buscar conocimiento religioso en línea no es un camino hacia la guía. Registrado como respuesta de AMJA."
