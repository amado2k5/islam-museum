label: { ar: "المال المستحق عند فسخ المضاربة وكيفية حسابه", en: "The money due on dissolving a mudaraba and how to calculate it", ur: "مضاربہ فسخ ہونے پر واجب رقم اور اس کا حساب", es: "El dinero adeudado al disolver una mudaraba y cómo calcularlo", fr: "Les sommes dues lors de la dissolution d'une mudaraba et comment les calculer" }
summary:
  ar: "سائل سأل عن المال المستحق عند فسخ عقد المضاربة وكيفية حسابه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21578)⁩ أن المضاربة من العقود الجائزة شرعًا من حيث الأصل ويجوز الاتفاق بين الأطراف على إنهائها وبيّن الجواب ما يستحق عندئذ على وجهه."
  en: "A questioner asked about the money due on dissolving a mudaraba contract and how to calculate it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21578) answered that mudaraba is a lawful contract in principle and the parties may agree to end it; the answer sets out what is then due."
  ur: "ایک سائل نے مضاربہ فسخ کرنے پر واجب رقم اور اس کا حساب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21578)⁩ نے جواب دیا کہ مضاربہ اصل میں جائز عقد ہے اور فریقین اتفاق سے ختم کر سکتے ہیں؛ جواب میں اس صورت میں واجب رقم بیان ہوئی۔"
  es: "Un consultante preguntó sobre el dinero adeudado al disolver un contrato de mudaraba y cómo calcularlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21578) respondió que la mudaraba es un contrato legal en principio y que las partes pueden acordar su terminación; la respuesta detalla lo que corresponde en ese caso."
  fr: "Un internaute a posé une question concernant les sommes dues lors de la dissolution d'un contrat de mudaraba et leur calcul. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21578) a répondu que la mudaraba est un contrat licite en principe et que les parties peuvent convenir d'y mettre fin; la réponse précise les sommes dues dans ce cas."
