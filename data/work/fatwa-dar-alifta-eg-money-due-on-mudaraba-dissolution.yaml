summary:
  ar: "سائل سأل عن المال المستحق عند فسخ عقد المضاربة وكيفية حسابه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21578)⁩ أن المضاربة من العقود الجائزة شرعًا من حيث الأصل ويجوز الاتفاق بين الأطراف على إنهائها وبيّن الجواب ما يستحق عندئذ على وجهه."
  en: "A questioner asked about the money due on dissolving a mudaraba contract and how to calculate it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21578) answered that mudaraba is a lawful contract in principle and the parties may agree to end it; the answer sets out what is then due."
  ur: "ایک سائل نے مضاربہ فسخ کرنے پر واجب رقم اور اس کا حساب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21578)⁩ نے جواب دیا کہ مضاربہ اصل میں جائز عقد ہے اور فریقین اتفاق سے ختم کر سکتے ہیں؛ جواب میں اس صورت میں واجب رقم بیان ہوئی۔"
