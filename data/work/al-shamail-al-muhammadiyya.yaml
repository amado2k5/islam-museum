label: { ar: "الشمائل المحمدية", en: "al-Shama'il al-Muhammadiyya", ur: "الشمائل المحمدیہ" }
summary:
  ar: "كتاب أبي عيسى محمد بن عيسى الترمذي (ت 279هـ) في صفات النبي الخَلقية والخُلقية وأحواله اليومية، وهو أول مصنف مفرد في الشمائل؛ يضم ما ينوف على أربعمائة حديث مسند في ستة وخمسين باباً تبدأ بخَلق النبي وخاتم النبوة وتنتهي بوفاته وميراثه ورؤيته في المنام، وكثرت عليه الشروح حتى جمع محققه عبده كوشك اثنين وسبعين شرحاً."
  en: "Abu Isa Muhammad ibn Isa al-Tirmidhi's (d. 279 AH) book on the Prophet's physical appearance, character and daily life, the first work devoted solely to the shama'il. It contains over four hundred hadiths with chains in fifty-six chapters, from the Prophet's physical form and the seal of prophethood to his death, his estate and seeing him in dreams; so many commentaries were written on it that its editor Abduh Kushak listed seventy-two."
genre: [hadith, sira]
made: { by_muslims: true, basis: documented, sources: [source/shamail-kushak-2012] }
