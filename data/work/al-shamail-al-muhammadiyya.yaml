structure: "56 باباً (طبعة عوامة): 1 خَلق رسول الله (ص15)، 2 خاتم النبوة (ص80)، 3 شعره (ص105)، 4 ترجله، 5 شيبه، 6 خضابه (ص134)، ثم الكحل واللباس والعيش والخف والنعل والخاتم والسيف والدرع والمغفر والعمامة والإزار (إلى الباب 18، ص232)، ثم المشية والتقنع والجلسة والتكأة والاتكاء (19–23)، ثم الأكل والخبز والإدام والوضوء والقدح والفاكهة والشراب والشرب (24–32)، ثم التعطر والكلام والضحك والمزاح والشعر (33–38)، ثم النوم والعبادة وصلاة الضحى والتطوع والصوم والقراءة والبكاء والفراش (39–46)، ثم التواضع والخُلق والحياء والحجامة والأسماء والعيش والسن (47–53)، ثم الوفاة (ص646) والميراث (ص671) والرؤيا في المنام (ص680)."
