summary:
  ar: "ترجمة إنجليزية مصوّرة للأطفال لسور جزء عمّ وضعتها شيرين شريف، الصيدلانية البريطانية من أسرة كردية نشأت في العراق، ورسمتها رسامة بريطانية، وراجعها وأجازها عبد الله بن يوسف الجديع؛ صدر الجزء الأول سنة 2018 في 47 صفحة يغطي خمسًا وعشرين سورة من الناس إلى البلد، وأعيد طبعه أكثر من ثلاث مرات، وصدر الجزء الثاني سنة 2019، ويوزَّع في بريطانيا وبلدان كثيرة، وله نسختان إسبانية وإيطالية."
  en: "An illustrated English children's translation of the suras of Juz' Amma by Shereen Sharief, a UK pharmacist born into a Kurdish family who grew up in Iraq, illustrated by a British artist and checked and approved by Abdullah ibn Yusuf al-Judai; Part 1, of 47 pages covering twenty-five suras from al-Nas to al-Balad, came out in 2018 and has been reprinted more than three times, Part 2 followed in 2019, and it is distributed in the UK and many other countries, with Spanish and Italian versions."
  ur: "جزء عم کی سورتوں کا بچوں کے لیے مصور انگریزی ترجمہ از شیریں شریف، برطانوی فارماسسٹ جو کرد خاندان میں پیدا ہوئیں اور عراق میں پلی بڑھیں؛ تصاویر ایک برطانوی فنکارہ کی ہیں اور عبد اللہ بن یوسف الجدیع نے جانچ کر منظوری دی؛ پہلا حصہ 2018 میں 47 صفحات میں الناس سے البلد تک پچیس سورتوں پر آیا اور تین سے زیادہ بار چھپا، دوسرا حصہ 2019 میں آیا، اور یہ برطانیہ اور بہت سے ممالک میں تقسیم ہوتا ہے، ہسپانوی اور اطالوی صورت میں بھی۔"
