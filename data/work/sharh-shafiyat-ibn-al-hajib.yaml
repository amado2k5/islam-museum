summary:
  ar: "شرح شافية ابن الحاجب، كتاب في الصرف والتصريف لمؤلفه الرضي الأسترابادي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت نحو 686هـ / نحو 1287م {cite:qaf-sharh-shafiyat-ibn-al-hajib}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book ID 21567 {cite:shamela-org-pdf-sharh-shafiyat-ibn-al-hajib}. لم يقرأ المتحف الكتاب."
  en: "Sharh Shafiyat Ibn al-Hajib, a book on morphology (sarf and tasrif) by al-Radi al-Astarabadhi; its date in a research summary supplied to the museum is d. c. 686 AH / c. 1287 CE {cite:qaf-sharh-shafiyat-ibn-al-hajib}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book ID 21567 {cite:shamela-org-pdf-sharh-shafiyat-ibn-al-hajib}. The museum has not read the book."
  ur: "شرح شافية ابن الحاجب، صرف و تصریف پر ایک کتاب، مصنف الرضي الأسترابادي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات تقریباً 686ھ / تقریباً 1287ء {cite:qaf-sharh-shafiyat-ibn-al-hajib}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book ID 21567 {cite:shamela-org-pdf-sharh-shafiyat-ibn-al-hajib}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Sharh Shafiyat Ibn al-Hajib, livre sur la morphologie (sarf et tasrif) de al-Radi al-Astarabadhi ; sa date dans une synthèse de recherche remise au musée : m. vers 686 H / vers 1287 {cite:qaf-sharh-shafiyat-ibn-al-hajib}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book ID 21567 {cite:shamela-org-pdf-sharh-shafiyat-ibn-al-hajib}. Le musée n'a pas lu le livre."
  es: "Sharh Shafiyat Ibn al-Hajib, libro sobre morfología (sarf y tasrif) de al-Radi al-Astarabadhi; su fecha en un resumen de investigación entregado al museo: m. hacia 686 H. / hacia 1287 {cite:qaf-sharh-shafiyat-ibn-al-hajib}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book ID 21567 {cite:shamela-org-pdf-sharh-shafiyat-ibn-al-hajib}. El museo no ha leído el libro."
  tr: "Sharh Shafiyya Ibn al-Hajib, yazarı el-Radi el-Astrabadi'nin morfoloji ve morfoloji üzerine bir kitabı ve müzeye sunulan araştırma özetine göre tarihi: ö. yaklaşık 686 Hicri / yaklaşık 1287 M.S. {kaynak:kaf-şerh-şafiyat-ibn-el-hacib}. Özetin Kapsamlı Kütüphane'deki varlığı hakkındaki yanıtı: Evet, ve Kapsamlı Kütüphane'deki kitap: Kitap ID 21567 {kaynak:şamela-org-pdf-sharh-shafiyat-ibn-al-hajib}. Müze kitabı okumadı."
  id: "Sharh Shafiyya Ibn al-Hajib, sebuah buku tentang morfologi dan morfologi oleh penulisnya al-Radi al-Astrabadi, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat sekitar 686 H / sekitar 1287 M {cite:qaf-sharh-shafiyat-ibn-al-hajib}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku di Perpustakaan Komprehensif: ID Buku 21567 {cite:shamela-org-pdf-sharh-shafiyat-ibn-al-hajib}. Museum tidak membaca buku tersebut."
