summary:
  ar: "مخطوطة في الموسيقى والرقص بالأردية الدكنية في المكتبة البريطانية (Or. 12857)، فيها 48 صورة بأسلوب «نجوم العلوم»، ربما من عهد علي عادل شاه الأول ببيجاپور نحو 1570م {cite:zebrowski-deccani-painting-1983 p. 62}."
  en: "A manuscript on music and dance in Deccani Urdu in the British Library (Or. 12857), with forty-eight paintings in the Nujum style, perhaps from Ali Adil Shah I's Bijapur, about 1570 {cite:zebrowski-deccani-painting-1983 p. 62}."
  ur: "دکنی اردو میں موسیقی اور رقص پر ایک نسخہ، برٹش لائبریری (Or. 12857) میں، نجوم کے انداز کی اڑتالیس تصاویر کے ساتھ، غالباً علی عادل شاہ اول کے بیجاپور کا، تقریباً 1570ء {cite:zebrowski-deccani-painting-1983 p. 62}۔"
  es: "Un manuscrito sobre música y danza en urdu deccani en la Biblioteca Británica (Or. 12857), con cuarenta y ocho pinturas al estilo Nujum, quizás de Bijapur de Ali Adil Shah I, alrededor de 1570 {cite:zebrowski-deccani-painting-1983 p. 62}."
  fr: "Un manuscrit sur la musique et la danse en ourdou du Deccan à la British Library (Or. 12857), avec quarante-huit peintures dans le style Nujum, peut-être de Bijapur d'Ali Adil Shah I, vers 1570 {cite:zebrowski-deccani-painting-1983 p. 62}."
  tr: "Britanya Kütüphanesi'nde (Or. 12857) Dekkan Urduca müzik ve dans üzerine bir el yazması, muhtemelen Ali Adil Şah I'in Bijapur'daki saltanatı dönemine ait olan 'Bilim Yıldızları' tarzında 48 imge içerir {cite:zebrowski-deccani-painting-1983 s. 62}."
  id: "Sebuah manuskrip tentang musik dan tari dalam bahasa Deccan Urdu di Perpustakaan Inggris (Or. 12857), berisi 48 gambar bergaya 'Bintang Ilmu Pengetahuan,' kemungkinan dari masa pemerintahan Ali Adil Shah I di Bijapur sekitar tahun 1570 M {cite:zebrowski-deccani-painting-1983 hlm. 62}."
