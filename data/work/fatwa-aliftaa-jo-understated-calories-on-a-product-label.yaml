id: work/fatwa-aliftaa-jo-understated-calories-on-a-product-label
class: work
kind: fatwa
label: { ar: "كتابة سعرات حرارية أقل من الحقيقة على منتج", en: "Understating calories on a product label", ur: "مصنوعات پر حقیقت سے کم کیلوریز لکھنا" }
summary:
  ar: "سؤال عن كتابة سعرات حرارية أقل من الحقيقة على منتج، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم ادعاء صفات في المبيع ليست فيه لأنه كذب وغش، ويجب على من وقع فيه التوبة وتصحيح المعلومات، ولا يلزمه تجنيب شيء من الأرباح لأن السعر لم يتغير، ولا بأس بالصدقة لتطييب الكسب. أجابت الدائرة بأن الإسلام حرم الكذب والغش في المعاملات، واستشهدت بـ[[passage/quran-23-8|سورة المؤمنون 23:8]] و[[passage/quran-9-119|سورة التوبة 9:119]]، وبحديث رواه مسلم معناه أن من غش المسلمين فليس منهم، وقالت إن ذكر صفات في السلعة ليست فيها كذب وغش. ونقلت قرار مجلس الإفتاء الأردني رقم 101 بأن على المسلم، تاجرًا كان أو مندوب مبيعات أو في أي موقع، أن يصدق في أقواله ويبين حقيقة كل سلعة يروج لها، ويحرم عليه الكذب والتدليس. وقالت إن على من وقع في ذلك المبادرة إلى التوبة النصوح بالإقلاع فورًا بتصحيح المعلومات المنشورة عن المنتج والإعلام بذلك، والعزم على عدم العود، والندم، والإكثار من الاستغفار والعمل الصالح. وذكرت أنه لما كان سعر المنتج لم يزد بسبب الصفات المخالفة للواقع فلا يلزم تجنيب شيء من الأرباح إذ لا فرق يرد، ولا بأس بالتصدق في وجوه الخير لتطييب الكسب."
  en: "A question about understating calories on a product label, in which Jordan's General Iftaa Department answered that claiming qualities a product does not have is forbidden as lying and cheating; whoever has done so must repent and correct the information, but need not set aside any profits since the price did not change, though giving charity to purify the earnings is fine. The Department answered that Islam forbids lying and cheating in transactions, citing [[passage/quran-23-8|Surat al-Mu'minun 23:8]] and [[passage/quran-9-119|Surat al-Tawba 9:119]] and a hadith narrated by Muslim whose meaning is that whoever cheats the Muslims is not of them, and said that attributing to goods qualities they lack is lying and cheating. It quoted resolution no. 101 of Jordan's Iftaa Council that a Muslim, whether a trader, a sales representative or in any other position, must be truthful in all he says and always show the truth about every product he promotes, and that lying and misrepresentation are forbidden to him. It said whoever has fallen into this must hasten to sincere repentance: stopping at once by correcting the published product information and announcing the correction, resolving not to repeat it, feeling remorse, and seeking forgiveness often and doing good deeds. It noted that because the product's price did not rise owing to the false description, being the same with or without it, there is no need to set aside any of the profits, as there is no difference to return; there is no harm in giving charity to purify the earnings."
  ur: "مصنوعات پر حقیقت سے کم کیلوریز لکھنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مال میں ایسی صفات کا دعویٰ جو اس میں نہ ہوں جھوٹ اور دھوکہ ہونے کی وجہ سے حرام ہے؛ ایسا کرنے والا توبہ کرے اور معلومات درست کرے، لیکن قیمت نہ بدلنے کی وجہ سے منافع الگ کرنا لازم نہیں، البتہ کمائی پاک کرنے کے لیے صدقہ اچھا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے معاملات میں جھوٹ اور دھوکہ حرام کیا ہے، اور [[passage/quran-23-8|سورۃ المؤمنون 23:8]] اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا، اور مسلم کی روایت کردہ اس حدیث کا حوالہ دیا جس کا مفہوم ہے کہ جو مسلمانوں کو دھوکہ دے وہ ان میں سے نہیں؛ اور کہا کہ مال میں ایسی صفات بیان کرنا جو اس میں نہ ہوں جھوٹ اور دھوکہ ہے۔ اس نے اردنی مجلسِ افتاء کی قرارداد نمبر 101 نقل کی کہ مسلمان، چاہے تاجر ہو یا سیلز نمائندہ یا کسی بھی منصب پر، اپنی تمام باتوں میں سچا رہے اور ہر اس چیز کی حقیقت بیان کرے جس کی وہ تشہیر کرتا ہے، اور اس پر جھوٹ اور فریب حرام ہے۔ اس نے کہا کہ جو اس میں مبتلا ہو وہ فوراً سچی توبہ کرے: شائع شدہ معلومات درست کر کے اور اس کا اعلان کر کے فوراً باز آئے، دوبارہ نہ کرنے کا عزم کرے، نادم ہو، اور کثرت سے استغفار اور نیک عمل کرے۔ اس نے بتایا کہ چونکہ غلط صفات کی وجہ سے مصنوعات کی قیمت نہیں بڑھی، بلکہ ان کے ساتھ اور ان کے بغیر ایک ہی تھی، اس لیے منافع میں سے کچھ الگ کرنا لازم نہیں کیونکہ لوٹانے کو کوئی فرق نہیں؛ کمائی کو پاک کرنے کے لیے خیر کے کاموں میں صدقہ کرنے میں کوئی حرج نہیں۔"
