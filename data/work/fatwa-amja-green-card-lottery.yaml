id: work/fatwa-amja-green-card-lottery
class: work
kind: fatwa
label: { ar: "الاشتراك في يانصيب البطاقة الخضراء", en: "Entering the green-card lottery", ur: "گرین کارڈ لاٹری میں شرکت", es: "Participar en la lotería de la tarjeta verde", fr: "Participer à la loterie de la carte verte", tr: "Yeşil Kart Piyangosuna Abone Olun", id: "Berlangganan Lotere Green Card" }
summary:
  ar: "سأل سائل عن حكم الاشتراك في قرعة البطاقة الخضراء الأمريكية حيث يسجل المشترك بياناته في الموقع مجانًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80821 بتاريخ 16 يناير 2010)⁩ أن الاشتراك في هذا النظام في ذاته لا بأس به إذا أمن الشخص المسافر إلى تلك البلاد من الفتنة في دينه وكان قادرًا على إظهاره وكانت له نية صالحة من تبليغ دعوة أو تعلم علوم كونية نافعة تمس حاجة الأمة إليها أو غير ذلك من المقاصد الصالحة."
  en: "A questioner asked whether entering the US green-card lottery — registering one's details on its site — is lawful. Dr. Salah al-Sawi (fatwa no. 80821, 16 January 2010) answered that entering the scheme itself is unobjectionable provided the traveller to those lands is safe from trial in his religion and able to show it, and has a good intention — conveying the call, learning beneficial worldly sciences the ummah needs, or other sound purposes."
  ur: "ایک سائل نے امریکی گرین کارڈ لاٹری میں شرکت کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80821، 16 جنوری 2010)⁩ کے مطابق اندراج بذات خود جائز ہے بشرط دین کے فتنے سے محفوظ ہو اور نیت اچھی ہو۔"
  es: "Un interlocutor preguntó si participar en la lotería de la tarjeta verde estadounidense —registrando los datos personales en su sitio web— es lícito. El Dr. Salah al-Sawi (fatwa n.º 80821, 16 de enero de 2010) respondió que participar en el programa en sí no tiene inconveniente, siempre que el viajero a esos países esté a salvo de cualquier juicio religioso y pueda demostrarlo, y tenga una buena intención: transmitir el llamado, aprender ciencias mundanas beneficiosas para la comunidad o cualquier otro propósito legítimo."
  fr: "Un internaute a demandé si la participation à la loterie des cartes vertes américaines – c’est-à-dire l’enregistrement de ses informations sur le site du programme – était légale. Le Dr Salah al-Sawi (fatwa n° 80821, 16 janvier 2010) a répondu que la participation en elle-même n’était pas contestable, à condition que le voyageur soit à l’abri de toute épreuve en raison de sa religion, puisse le prouver et ait de bonnes intentions – transmettre l’appel, acquérir des connaissances profanes utiles à la communauté musulmane, ou poursuivre d’autres objectifs louables."
  tr: "Bir soru soran, katılımcının bilgilerini web sitesinde ücretsiz olarak kaydettiği Amerikan Yeşil Kart çekilişine katılım hakkındaki karar hakkında soru soruldu. Dr. Salah Al-Sawy (16 Ocak 2010 tarihli Fetva No. 80821) yanıtladı; eğer bu ülkelere seyahat eden kişi dininde ayartıdan korunuyorsa, bunu gösterebiliyorsa ve ulusun ihtiyaç duyduğu bir mesaj iletmek ya da faydalı kozmik bilimleri öğrenmek ya da iyi niyetli olmak istiyorsa bu sisteme abone olmak mümkün olduğunu belirtti."
  id: "Seorang penanya ditanya tentang putusan partisipasi dalam lotere Kartu Hijau Amerika, di mana peserta mendaftarkan informasi mereka secara gratis di situs web. Dr. Salah Al-Sawy menjawab (Fatwa No. 80821 tertanggal 16 Januari 2010) bahwa berlangganan sistem ini diperbolehkan jika orang yang bepergian ke negara-negara tersebut aman dari godaan dalam agamanya, mampu menunjukkannya, dan memiliki niat baik untuk menyampaikan pesan atau mempelajari ilmu kosmik yang bermanfaat yang dibutuhkan bangsa, atau tujuan benar lainnya."
