id: work/fatwa-dar-alifta-eg-hair-nail-hadith-covers-pilgrim
class: work
kind: fatwa
label: { ar: "مدى مخاطبة الحاج الذي يريد أن يضحي بحديث عدم الأخذ من الشعر والأظفار", en: "Does the hair-and-nail hadith address the pilgrim who intends a sacrifice?", ur: "کیا قربانی چاہنے والے حاجی پر بال ناخن والی حدیث لاگو ہے" }
summary:
  ar: "سائل سأل عما إذا كان الحاج الذي يريد أن يضحي مخاطبًا بحديث عدم الأخذ من الشعر والأظفار في العشر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20695)⁩ أن الحديث الوارد في ذلك صحيح ثابت وبيّن الجواب من يشمله على وجهه."
  en: "A questioner asked whether a pilgrim who intends to offer a sacrifice is addressed by the hadith on not cutting hair and nails in the first ten. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20695) answered that the hadith is sound and established, and the answer sets out whom it covers."
  ur: "ایک سائل نے پوچھا کہ کیا قربانی کی نیت رکھنے والا حاجی عشرہ میں بال ناخن نہ کاٹنے والی حدیث میں داخل ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20695)⁩ نے جواب دیا کہ حدیث ثابت ہے اور اس کے شمولیت کا حکم جواب میں ہے۔"
