id: work/fatwa-dar-alifta-eg-hair-nail-hadith-covers-pilgrim
class: work
kind: fatwa
label: { ar: "مدى مخاطبة الحاج الذي يريد أن يضحي بحديث عدم الأخذ من الشعر والأظفار", en: "Does the hair-and-nail hadith address the pilgrim who intends a sacrifice?", ur: "کیا قربانی چاہنے والے حاجی پر بال ناخن والی حدیث لاگو ہے", es: "¿Se refiere el hadiz sobre el cabello y las uñas al peregrino que tiene la intención de ofrecer un sacrificio?", fr: "Le hadith des cheveux et des ongles s'adresse-t-il au pèlerin qui a l'intention d'accomplir un sacrifice ?", tr: "Saç ve tırnak almama hadisini feda etmek isteyen hacının ne ölçüde ele alındığı", id: "Sejauh mana peziarah yang ingin mengorbankan hadis untuk tidak mengambil rambut dan kuku ditangani" }
summary:
  ar: "سائل سأل عما إذا كان الحاج الذي يريد أن يضحي مخاطبًا بحديث عدم الأخذ من الشعر والأظفار في العشر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20695)⁩ أن الحديث الوارد في ذلك صحيح ثابت وبيّن الجواب من يشمله على وجهه."
  en: "A questioner asked whether a pilgrim who intends to offer a sacrifice is addressed by the hadith on not cutting hair and nails in the first ten. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20695) answered that the hadith is sound and established, and the answer sets out whom it covers."
  ur: "ایک سائل نے پوچھا کہ کیا قربانی کی نیت رکھنے والا حاجی عشرہ میں بال ناخن نہ کاٹنے والی حدیث میں داخل ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20695)⁩ نے جواب دیا کہ حدیث ثابت ہے اور اس کے شمولیت کا حکم جواب میں ہے۔"
  es: "Un consultante preguntó si el hadiz sobre no cortarse el cabello ni las uñas, incluido en los diez primeros preceptos, se refiere a un peregrino que tiene la intención de ofrecer un sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20695) respondió que el hadiz es auténtico y está bien establecido, y la respuesta especifica a quién abarca."
  fr: "Un internaute a demandé si le hadith relatif à l'interdiction de se couper les cheveux et les ongles, mentionné dans les dix premières minutes du pèlerinage, concernait bien le pèlerin qui a l'intention d'offrir un sacrifice. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20695) a répondu que le hadith était authentique et établi, et la réponse précise à qui il s'applique."
  tr: "Bir soru soran, kurban etmek isteyen hacıya on gün içinde saç ve tırnak almama hadislerinde hitap edilip edilmediğini sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20695), bu konuda bahsedilen hadisin gerçek ve yerleşim olduğunu ve cevabın kendi içinde dahil edenlerden açık olduğunu belirtmiştir."
  id: "Seorang penanya bertanya apakah peziarah yang ingin berkorban dijawab oleh hadis tentang tidak mengambil rambut dan kuku dalam sepuluh hari. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20695) menjawab bahwa hadis yang disebutkan dalam hal ini adalah otentik dan mapan, dan jawabannya jelas dari mereka yang memasukkannya dengan caranya sendiri."
