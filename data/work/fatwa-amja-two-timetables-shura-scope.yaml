id: work/fatwa-amja-two-timetables-shura-scope
class: work
kind: fatwa
label: { ar: "جدولان والشورى في المباح", en: "Two prayer timetables from two mosques — shura belongs to the permissible", ur: "دو جدول اوقات — شوری مباح میں", es: "Dos horarios de oración de dos mezquitas: la shura pertenece a lo permisible.", fr: "Deux horaires de prière de deux mosquées — la shura fait partie des prières permises", tr: "İki masa ve izin verilen şura", id: "Dua meja dan Shura sesuai dengan yang diperbolehkan" }
summary:
  ar: "سأل سائل أن مسجدي مدينته وزعا في سنتين جدولين لمواقيت الصلاة وإمساكية رمضان مما أحدث حرجًا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87075 بتاريخ 7 يوليو 2012)⁩ أن الشورى إنما تكون في المباحات والبدائل المشروعة ناقلة كلام البخاري في الصحيح أن الأئمة كانوا يستشيرون الأمناء من أهل العلم في الأمور المباحة أما المسائل الشرعية فمردها إلى أهل الذكر على ما فصّل الجواب."
  en: "A questioner reported that his town's two mosques distributed two prayer-timetables and Ramadan fasting charts over two years, causing hardship. AMJA's fatwa committee (fatwa no. 87075, 7 July 2012) answered that consultation belongs to permissible matters and lawful alternatives — citing al-Bukhari that the imams consulted trustworthy scholars on permissible matters to take the easiest, while shari'a questions go back to the people of knowledge — as the answer details."
  ur: "دو اوقاتی جدول؟ لجنة الفتوى ⁦(فتویٰ 87075، 7 جولائی 2012)⁩ کے مطابق شوری مباحات میں؛ شرعی مسائل اہل ذکر کے۔"
  es: "Un consultante informó que las dos mezquitas de su ciudad distribuyeron dos horarios de oración y tablas de ayuno de Ramadán durante dos años, lo que causó dificultades. El comité de fatuas de AMJA (fatua n.° 87075, 7 de julio de 2012) respondió que la consulta pertenece a asuntos permisibles y alternativas lícitas, citando a al-Bujari, quien afirma que los imanes consultaban a eruditos confiables sobre asuntos permisibles para tomar la decisión más fácil, mientras que las cuestiones de la sharia se remiten a la gente de conocimiento, como se detalla en la respuesta."
  fr: "Un individu a signalé que les deux mosquées de sa ville avaient distribué deux calendriers de prière et deux calendriers de jeûne du Ramadan pendant deux ans, ce qui avait engendré des difficultés. Le comité des fatwas de l'AMJA (fatwa n° 87075, 7 juillet 2012) a répondu que la consultation relève des questions licites et des alternatives légitimes, citant al-Bukhari selon lequel les imams consultent des savants dignes de confiance sur les questions licites afin de choisir la solution la plus simple, tandis que les questions de charia relèvent de la connaissance des spécialistes."
  tr: "Bir soru soran kişi, şehrindeki camilerin iki yıl boyunca namaz vakitleri ve Ramazan programları için iki zaman çizelgesi dağıttığını ve bunun utanç yarattığını sormuştur. Amerika Şeriat Hukukçuları Akademisi Fetva Komitesi (7 Temmuz 2012 tarihli Fetva No. 87075), Sahih'te imamların caiz konularda güvenilir alimlere danıştığını, hukuki konuların ise cevabında ayrıntılı olarak bilgi sahiplerine havale edildiğini belirten Sahih'teki ifadesini alıntılayarak istişarenin yalnızca izin verilen ve meşru alternatifler için geçerli olduğunu yanıtladı."
  id: "Seorang penanya meminta agar masjid-masjid di kotanya membagikan dua jadwal waktu salat dan jadwal Ramadan selama dua tahun, yang menyebabkan rasa malu. Komite Fatwa di Akademi Ahli Hukum Syariah di Amerika (Fatwa No. 87075 tanggal 7 Juli 2012) menanggapi bahwa konsultasi hanya berlaku untuk alternatif yang diperbolehkan dan sah, mengutip pernyataan Bukhari dalam Sahih bahwa imam dulu berkonsultasi dengan ulama terpercaya mengenai hal-hal yang diperbolehkan, sedangkan masalah hukum dirujuk kepada orang-orang berpengetahuan, seperti yang dijelaskan dalam jawaban."
