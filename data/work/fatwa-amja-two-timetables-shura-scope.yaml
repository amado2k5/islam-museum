id: work/fatwa-amja-two-timetables-shura-scope
class: work
kind: fatwa
label: { ar: "جدولان والشورى في المباح", en: "Two prayer timetables from two mosques — shura belongs to the permissible", ur: "دو جدول اوقات — شوری مباح میں" }
summary:
  ar: "سأل سائل أن مسجدي مدينته وزعا في سنتين جدولين لمواقيت الصلاة وإمساكية رمضان مما أحدث حرجًا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87075 بتاريخ 7 يوليو 2012)⁩ أن الشورى إنما تكون في المباحات والبدائل المشروعة ناقلة كلام البخاري في الصحيح أن الأئمة كانوا يستشيرون الأمناء من أهل العلم في الأمور المباحة أما المسائل الشرعية فمردها إلى أهل الذكر على ما فصّل الجواب."
  en: "A questioner reported that his town's two mosques distributed two prayer-timetables and Ramadan fasting charts over two years, causing hardship. AMJA's fatwa committee (fatwa no. 87075, 7 July 2012) answered that consultation belongs to permissible matters and lawful alternatives — citing al-Bukhari that the imams consulted trustworthy scholars on permissible matters to take the easiest, while shari'a questions go back to the people of knowledge — as the answer details."
  ur: "دو اوقاتی جدول؟ لجنة الفتوى ⁦(فتویٰ 87075، 7 جولائی 2012)⁩ کے مطابق شوری مباحات میں؛ شرعی مسائل اہل ذکر کے۔"
