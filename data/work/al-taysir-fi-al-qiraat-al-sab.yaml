structure: "Pretzl edition: table of contents (PDF pp. 7-8), editor's preface and life of al-Dani (pp. 9-13); author's introduction; chapters on the readers and transmitters, the men, the chains; isti'adha, basmala, al-Fatiha; usul: Abu Amr's idgham kabir, ha' al-kinaya, madd, hamza (in one and two words, single hamza, transfer, Abu Amr's dropping, Hamza and Hisham's pausing), izhar and idgham, fath and imala, Kisa'i's pausing on ta' marbuta, Warsh's ra's, the lam's, pausing at word ends and on the written form, Hamza's pause before hamza, ya's of possession, omitted ya's; then farsh al-huruf."
