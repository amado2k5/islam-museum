label: { ar: "التيسير في القراءات السبع", en: "al-Taysir fi al-Qira'at al-Sab'", ur: "التیسیر فی القراءات السبع" }
summary:
  ar: "كتاب في القراءات السبع لأبي عمرو عثمان بن سعيد الداني ⁦(371-444هـ)⁩، يبدأ بأبواب في أسماء القراء السبعة ورواتهم وأنسابهم وبلدانهم ووفياتهم، ثم في أسانيد المؤلف إليهم، ثم أصول القراءة كالإدغام الكبير لأبي عمرو والمد والقصر والهمز والإمالة والراءات واللامات والوقف وياءات الإضافة والزوائد، ثم فرش الحروف سورة سورة؛ ويصفه ناشره بأنه «الحجة في هذا العلم» {cite:taysir-pretzl-istanbul-1930 p. 7} {cite:taysir-pretzl-istanbul-1930 p. 8} {cite:taysir-pretzl-istanbul-1930 p. 10}."
  en: "A work on the seven Qur'an readings by Abu Amr Uthman ibn Sa'id al-Dani (371-444 AH), opening with chapters on the names of the seven readers and their transmitters, lineages, cities and death dates, then the author's chains to them, then the general principles of reading - Abu Amr's major assimilation, lengthening and shortening, the hamza, inclination (imala), the ra's and lam's, pausing, the possessive ya's and the omitted ya's - and then the particular words surah by surah; its editor calls it 'the authority in this science'."
  ur: "ابو عمرو عثمان بن سعید دانی ⁦(371-444ھ)⁩ کی قراءاتِ سبعہ پر کتاب، جو سات قراء اور ان کے راویوں کے ناموں، نسبوں، شہروں اور وفیات کے ابواب سے شروع ہوتی ہے، پھر مصنف کی ان تک اسانید، پھر قراءت کے اصول — ابو عمرو کا ادغامِ کبیر، مد و قصر، ہمزہ، امالہ، راء اور لام، وقف، یائے اضافت اور زوائد — اور پھر سورہ بسورہ فرشِ حروف؛ اس کے ناشر اسے «اس علم میں حجت» کہتے ہیں۔"
