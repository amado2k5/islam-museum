id: work/fatwa-aliftaa-jo-car-raffle-shared-purchase-scheme
class: work
kind: fatwa
label: { ar: "مشروع الشراكة في شراء سيارة ثم القرعة عليها", en: "A scheme of shared car purchase followed by a draw", ur: "گاڑی کی مشترکہ خریداری پھر قرعہ اندازی کا منصوبہ" }
summary:
  ar: "سؤال عن مشروع يشترك فيه مئتا شخص في ثمن سيارة ثم يُسحب عليها لأحدهم، أجابت فيه دائرة الإفتاء العام الأردنية بأنه محرم لأنه قائم على القمار. أجابت الدائرة بأن الأصل تحريم القمار والميسر، لأنه يتضمن أن يكسب أحد المشتركين على حساب الآخرين، فيؤدي إلى النزاع وأكل أموال الناس بالباطل. وقالت إن المشتركين في هذا المشروع يدفعون جزءًا من ثمن السيارة ليحصل عليها من تخرج له القرعة، وهذا عين القمار المحرم، وإن صورة الشراكة والملكية فيه شكلية تغطي حقيقته، بدليل أن ملكية المشتركين تنتهي بخروج القرعة وتُنتزع السيارة منهم. واستشهدت بحديث النهي عن الخمر والميسر، وبتعريف البجيرمي للميسر بأنه ما تردد فاعله بين أن يغنم وأن يغرم، وخلصت إلى أن المشروع محرم."
  en: "A question on a scheme in which two hundred people share the price of a car that is then drawn for one of them, in which Jordan's General Iftaa Department answered that it is forbidden because it rests on gambling. The Department answered that gambling and games of chance are forbidden in principle, because one participant gains at the others' expense, leading to disputes and to consuming people's wealth unjustly. It said the participants here each pay part of the car's price so that whoever the draw falls on gets the car, which is gambling itself, and the outward form of partnership and ownership is only a cover, as shown by the participants' ownership ending once the draw is made and the car being taken from them. It cited the hadith forbidding wine and games of chance, and al-Bujayrimi's definition of maysir as an act whose doer may either gain or lose, and concluded that the scheme is forbidden."
  ur: "ایک منصوبے کے بارے میں سوال جس میں دو سو افراد ایک گاڑی کی قیمت میں شریک ہوتے ہیں اور پھر قرعہ اندازی سے وہ ان میں سے ایک کو ملتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جوئے پر مبنی ہونے کی وجہ سے حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جوا اور قمار اصولاً حرام ہیں، کیونکہ اس میں ایک شریک دوسروں کی قیمت پر کماتا ہے، جو جھگڑے اور لوگوں کا مال ناحق کھانے تک لے جاتا ہے۔ اس نے کہا کہ یہاں ہر شریک گاڑی کی قیمت کا ایک حصہ دیتا ہے تاکہ جس کا قرعہ نکلے اسے گاڑی ملے، اور یہی حرام جوا ہے، اور شراکت و ملکیت کی صورت محض پردہ ہے، جس کی دلیل یہ ہے کہ قرعہ نکلتے ہی شرکاء کی ملکیت ختم ہو جاتی ہے اور گاڑی ان سے چھن جاتی ہے۔ اس نے شراب اور جوئے کی ممانعت والی حدیث اور بجیرمی کی میسر کی تعریف سے استدلال کیا کہ یہ ایسا عمل ہے جس کا کرنے والا یا تو نفع اٹھاتا ہے یا نقصان، اور نتیجہ نکالا کہ یہ منصوبہ حرام ہے۔"
