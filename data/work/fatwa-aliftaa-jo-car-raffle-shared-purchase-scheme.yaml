id: work/fatwa-aliftaa-jo-car-raffle-shared-purchase-scheme
class: work
kind: fatwa
label: { ar: "مشروع الشراكة في شراء سيارة ثم القرعة عليها", en: "A scheme of shared car purchase followed by a draw", ur: "گاڑی کی مشترکہ خریداری پھر قرعہ اندازی کا منصوبہ", es: "Un plan de compra compartida de coches seguido de un sorteo.", fr: "Un système d'achat de voiture partagée suivi d'un tirage au sort", tr: "Bir araba satın almak ve ardından üzerinde piyango çekmek için bir ortaklık projesi", id: "Proyek kemitraan untuk membeli mobil lalu mengundi undian" }
summary:
  ar: "سؤال عن مشروع يشترك فيه مئتا شخص في ثمن سيارة ثم يُسحب عليها لأحدهم، أجابت فيه دائرة الإفتاء العام الأردنية بأنه محرم لأنه قائم على القمار. أجابت الدائرة بأن الأصل تحريم القمار والميسر، لأنه يتضمن أن يكسب أحد المشتركين على حساب الآخرين، فيؤدي إلى النزاع وأكل أموال الناس بالباطل. وقالت إن المشتركين في هذا المشروع يدفعون جزءًا من ثمن السيارة ليحصل عليها من تخرج له القرعة، وهذا عين القمار المحرم، وإن صورة الشراكة والملكية فيه شكلية تغطي حقيقته، بدليل أن ملكية المشتركين تنتهي بخروج القرعة وتُنتزع السيارة منهم. واستشهدت بحديث النهي عن الخمر والميسر، وبتعريف البجيرمي للميسر بأنه ما تردد فاعله بين أن يغنم وأن يغرم، وخلصت إلى أن المشروع محرم."
  en: "A question on a scheme in which two hundred people share the price of a car that is then drawn for one of them, in which Jordan's General Iftaa Department answered that it is forbidden because it rests on gambling. The Department answered that gambling and games of chance are forbidden in principle, because one participant gains at the others' expense, leading to disputes and to consuming people's wealth unjustly. It said the participants here each pay part of the car's price so that whoever the draw falls on gets the car, which is gambling itself, and the outward form of partnership and ownership is only a cover, as shown by the participants' ownership ending once the draw is made and the car being taken from them. It cited the hadith forbidding wine and games of chance, and al-Bujayrimi's definition of maysir as an act whose doer may either gain or lose, and concluded that the scheme is forbidden."
  ur: "ایک منصوبے کے بارے میں سوال جس میں دو سو افراد ایک گاڑی کی قیمت میں شریک ہوتے ہیں اور پھر قرعہ اندازی سے وہ ان میں سے ایک کو ملتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جوئے پر مبنی ہونے کی وجہ سے حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جوا اور قمار اصولاً حرام ہیں، کیونکہ اس میں ایک شریک دوسروں کی قیمت پر کماتا ہے، جو جھگڑے اور لوگوں کا مال ناحق کھانے تک لے جاتا ہے۔ اس نے کہا کہ یہاں ہر شریک گاڑی کی قیمت کا ایک حصہ دیتا ہے تاکہ جس کا قرعہ نکلے اسے گاڑی ملے، اور یہی حرام جوا ہے، اور شراکت و ملکیت کی صورت محض پردہ ہے، جس کی دلیل یہ ہے کہ قرعہ نکلتے ہی شرکاء کی ملکیت ختم ہو جاتی ہے اور گاڑی ان سے چھن جاتی ہے۔ اس نے شراب اور جوئے کی ممانعت والی حدیث اور بجیرمی کی میسر کی تعریف سے استدلال کیا کہ یہ ایسا عمل ہے جس کا کرنے والا یا تو نفع اٹھاتا ہے یا نقصان، اور نتیجہ نکالا کہ یہ منصوبہ حرام ہے۔"
  es: "Una pregunta sobre un plan en el que doscientas personas comparten el precio de un automóvil que luego se sortea entre ellas, fue respondida por el Departamento General de Iftaa de Jordania, que declaró que está prohibido por basarse en el juego de azar. El Departamento argumentó que los juegos de azar están prohibidos en principio, ya que un participante se beneficia a expensas de los demás, lo que genera disputas y el acaparamiento injusto de la riqueza ajena. Explicó que en este caso, cada participante paga una parte del precio del automóvil para que quien resulte ganador se lo quede, lo cual constituye un juego de azar en sí mismo. La forma externa de asociación y propiedad es solo una fachada, como lo demuestra el hecho de que la propiedad de los participantes termina una vez realizado el sorteo y se les retira el automóvil. Citó el hadiz que prohíbe el vino y los juegos de azar, y la definición de maysir de al-Bujayrimi como un acto cuyo autor puede ganar o perder, y concluyó que el plan está prohibido."
  fr: "Une question portait sur un système où deux cents personnes se partagent le prix d'une voiture, tirée au sort pour en désigner une parmi elles. Le Département général de la Iftaa de Jordanie a répondu que ce système est interdit car il repose sur le jeu de hasard. Le Département a expliqué que les jeux de hasard sont interdits par principe, car un participant gagne aux dépens des autres, ce qui engendre des conflits et une appropriation injuste des biens d'autrui. Il a précisé que, dans ce cas précis, chaque participant contribue au prix de la voiture, de sorte que celui ou celle qui est désigné(e) par tirage au sort l'obtient, ce qui constitue en soi un jeu de hasard. La forme extérieure de partenariat et de propriété n'est qu'une façade, comme le démontre la perte de propriété des participants dès le tirage au sort et la confiscation du véhicule. Le Département a cité le hadith interdisant le vin et les jeux de hasard, ainsi que la définition du maysir donnée par al-Bujayrimi comme un acte dont l'auteur peut gagner ou perdre, et a conclu que ce système est interdit."
  tr: "İki yüz kişinin arabanın fiyatını paylaşıp sonra birine çektiği bir projeye ilişkin soruya Ürdün Genel Fetva Dairesi bunun kumar temelli olduğu için yasak olduğunu yanıtladı. Daire, varsayılan olarak kumar ve kumarın yasaklandığını, çünkü bir katılımcının başkalarının zararına kazanç sağladığını, bunun anlaşmazlıklara ve insanların parasının yasa dışı tüketimine yol açtığını söyledi. Bu projede katılımcıların arabanın fiyatının bir kısmını ödediğini, böylece piyangoyu kazanan kişinin arabayı alacağını ve kumarın yasak olduğu belirtildi. Ortaklık ve sahiplik biçimi yüzeysel ve gerçekliğini gizliyor; katılımcıların mülkiyetinin, piyango çekildiğinde ve araba ellerinden alındığında sona erdiği kanıtlanıyor. Alkol ve kumarı yasaklayan hadisi ve Al-Bujairmi'nin kolaylaştırıcıyı yapanın kazanmak ile para cezası arasında tereddüt ettiği tanımını örnek göstererek projenin yasak olduğu sonucuna varıldı."
  id: "Sebuah pertanyaan tentang proyek di mana dua ratus orang berbagi harga mobil lalu menariknya ke salah satu dari mereka, Departemen Fatwa Umum Yordania menjawab bahwa proyek tersebut dilarang karena didasarkan pada perjudian. Departemen menjawab bahwa larangan default adalah larangan judi dan perjudian, karena melibatkan satu peserta menghasilkan uang dengan mengorbankan orang lain, yang menyebabkan perselisihan dan konsumsi uang orang secara ilegal. Departemen tersebut menyatakan bahwa peserta proyek ini membayar sebagian harga mobil agar siapa pun yang memenangkan lotere akan menerimanya, yang memang merupakan hal yang dilarang dalam perjudian. Bentuk kemitraan dan kepemilikan di dalamnya bersifat dangkal dan menutupi kenyataannya, sebagaimana dibuktikan oleh fakta bahwa kepemilikan peserta berakhir ketika undian diundi dan mobil diambil dari mereka. Mereka mengutip hadits yang melarang alkohol dan perjudian, serta definisi Al-Bujairmi tentang fasilitator sebagai apa yang ragu-ragu antara mendapatkan dan mendenda, dan menyimpulkan bahwa proyek tersebut dilarang."
