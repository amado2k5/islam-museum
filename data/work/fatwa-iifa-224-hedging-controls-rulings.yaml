label: { ar: "قرار مجمع الفقه الإسلامي الدولي 224 (23/8) بشأن التحوط في المعاملات المالية: الضوابط والأحكام", en: "IIFA resolution 224 (23/8) on hedging in financial transactions: the controls and rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 224 (23/8): مالی معاملات میں ہیجنگ: ضوابط اور احکام", es: "Resolución 224 (23/8) de la IIFA sobre cobertura en operaciones financieras: controles y resoluciones", fr: "Résolution 224 (23/8) de l'IIFA sur la couverture dans les transactions financières: les contrôles et les décisions", tr: "Uluslararası İslami Fiqh Akademisi Kararı 224 (23/8) Finansal İşlemlerde Korunma: Kontroller ve Hükümler", id: "Keputusan International Islamic Fiqh Academy 224 (23/8) tentang Lindung Nilai dalam Transaksi Keuangan: Kontrol dan Ketentuan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩، بعد اطلاعه على توصيات ندوته العلمية ⁦«التحوط في المعاملات المالية»⁩ بدبي ⁦(26–27 أبريل 2016م)⁩ بالتعاون مع دائرة الشؤون الإسلامية والعمل الخيري. عرّف المجمع التحوط لغة بالتغطية والاتقاء والحماية، واصطلاحًا ماليًا بإجراءات منظمة لإدارة المخاطر بتحييدها أو الحد منها أو نقلها إلى طرف آخر، واصطلاحًا شرعيًا بالحماية من المخاطر وتخفيف آثارها دون حصره في عمليات الأسواق المالية القائمة غالبًا على الربا والمعاوضة على المخاطر كالمشتقات من مستقبليات واختيارات ومبادلات مؤجلة التي سبق للمجمع إعلان عدم مشروعية بعضها؛ وعرّف الخطر باحتمال هلاك المال أو وقوع الخسارة أو فوات الربح، والحماية باستخدام الوسائل المتاحة للوقاية من الخسران والنقصان والتلف وهي أعم من ضمان رأس المال. وقرر أن التحوط بمعناه العام يتفق مع مقاصد الشريعة في حفظ المال، وأن حكم التطبيقات يتوقف على التزام الصيغ بالضوابط الشرعية التي أقرها وأهمها: ألا تنطوي الصيغ على الربا أو تكون ذريعة إليه ولا على الغرر الفاحش؛ أن تكون الصيغة مشروعة في ذاتها؛ ألا تؤدي لبيع الديون بغير قيمتها الاسمية ولا لبيع الحقوق المجردة كبيوع الاختيارات الممنوعة بقرار 63 ⁦(7/1)⁩ ولا للمعاوضة على الالتزام كالأجر على الضمان الممنوع بقرار 12 ⁦(2/12)⁩؛ مراعاة مقاصد الشريعة ومآلات العقود؛ ألا تؤدي لضمان رأس المال أو الربح المتوقع من المدير أو المضارب أو الوكيل عند عدم التعدي أو التقصير؛ ألا يكون الخطر في ذاته محلًا للمعاوضة؛ وأن يكون القصد المحافظة على المال لا المضاربة على فروقات الأسعار. وأوصى بعقد ندوات مع المؤسسات المالية الإسلامية لفحص أدواتها وحث القائمين عليها على الالتزام بالضوابط."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), after reviewing the recommendations of its scholarly seminar on hedging in financial transactions held in Dubai (26–27 April 2016) with the Islamic Affairs and Charitable Activities Department. It defined hedging in language as covering, guarding and protection; in financial usage as organised procedures for managing risks by neutralising, limiting or transferring them to another party; and in the technical sense as protection against risks and alleviation of their effects — not confined to the market operations mostly resting on riba and paid risk, namely derivatives such as futures, options and deferred swaps, some of which the Academy had already declared impermissible. It defined risk as the possibility of the loss of money, loss occurring, or profit missed or below expectation, and protection as using available means to guard against loss, diminution or damage — broader than guaranteeing capital. It ruled that hedging in its general sense accords with the sharia objective of preserving wealth, and that the ruling on applications turns on the structures' observance of the legal controls it set out, chiefly: they must not contain riba or serve as a device to it, nor contain excessive gharar; the structure must be lawful in itself; they must not lead to selling debts at other than nominal value nor to selling detached rights, such as the option sales forbidden by resolution 63 (7/1), nor to paid obligations such as the fee on guarantee forbidden by resolution 12 (2/12); the objectives of the sharia and the outcomes of the contracts must be kept in view; they must not amount to guaranteeing capital or expected profit by manager, mudarib or agent absent misconduct or negligence; risk itself may not be the subject of an exchange; and the aim must be preserving wealth, not speculation on price differences. It recommended seminars with Islamic financial institutions to test their instruments against these controls and urged those running them to comply."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں، دبئی میں شعبۂ امورِ اسلامیہ کے تعاون سے منعقدہ علمی ندوات ⁦(مالی معاملات میں ہیجنگ، 26–27 اپریل 2016ء)⁩ کی سفارشات کے بعد۔ اس نے ہیجنگ کی تعریف لغت میں حفاظت اور بچاؤ، مالیاتی اصطلاح میں خطرات کو غیر مؤثر، محدود یا دوسرے فریق کو منتقل کرنے کے منظم اقدامات، اور شرعی اصطلاح میں خطرات سے حفاظت اور ان کے اثرات کی تخفیف کے طور پر کی — یہ اسے ان بازاری عملیات تک محدود نہیں کرتی جو زیادہ تر ربا اور خطرے پر معاوضہ پر مبنی ہیں، جیسے مشتقات ⁦(فیوچرز، آپشنز، مؤخر مبادلے)⁩ جن میں سے بعض کو اکیڈمی پہلے ہی ناجائز قرار دے چکی ہے۔ اس نے خطرے کی تعریف مال کے ہلاک ہونے، نقصان یا منافع ضائع یا کم ہونے کے امکان کے طور پر کی، اور حفاظت کی تعریف نقصان و کمی و تلف سے بچنے کے دستیاب ذرائع کے استعمال کے طور پر — سرمایہ کی ضمانت سے وسیع تر۔ اس نے فیصلہ دیا کہ عمومی معنی میں ہیجنگ مقاصدِ شریعت میں حفظِ مال سے متفق ہے، اور اطلاقات کا حکم شرعی ضوابط کی پابندی پر منحصر ہے، اہم ضوابط یہ ہیں: صورتوں میں ربا نہ ہو نہ وہ اس کا ذریعہ بنیں اور نہ فراوان غرر ہو؛ صورت خود جائز ہو؛ وہ قرضوں کی غیر اصلی قیمت پر فروخت یا محض حقوق کی فروخت — جیسے قرارداد 63 ⁦(7/1)⁩ سے ممنوع آپشن کی فروختیں — یا التزام پر معاوضہ — جیسے قرارداد 12 ⁦(2/12)⁩ سے ممنوع ضمانت پر اجر — پر نہ انجام پائیں؛ مقاصدِ شریعت اور معاہدوں کے انجام ملحوظ ہوں؛ منتج، مضارب یا وکیل کی جانب سے غفلت یا تقصیر کے بغیر سرمایے یا متوقع منافع کی ضمانت نہ بنیں؛ خطرہ خود معاوضے کا موضوع نہ ہو؛ اور مقصد مال کی حفاظت ہو نہ کہ قیمتوں کے فرق پر جوا ⁦(مضاربہ)⁩۔ اس نے اسلامی مالیاتی اداروں کے ساتھ ان کے اوزار کی جانچ کے لیے ندواتوں اور قائم مقاموں سے ان ضوابط کی پابندی کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018), tras revisar las recomendaciones de su seminario académico sobre cobertura en transacciones financieras celebrado en Dubái (26-27 de abril de 2016) con el Departamento de Asuntos Islámicos y Actividades Benéficas. Definió la cobertura como cobertura, protección y salvaguarda; en el ámbito financiero, como procedimientos organizados para gestionar riesgos neutralizándolos, limitándolos o transfiriéndolos a otra parte; y en el sentido técnico, como protección contra riesgos y mitigación de sus efectos, sin limitarse a las operaciones de mercado que se basan principalmente en la usura y el riesgo pagado, es decir, derivados como futuros, opciones y swaps diferidos, algunos de los cuales la Academia ya había declarado inadmisibles. Definió el riesgo como la posibilidad de pérdida de dinero, pérdida o beneficio no alcanzado o inferior al esperado, y la protección como el uso de los medios disponibles para protegerse contra pérdidas, disminuciones o daños, un concepto más amplio que la mera garantía de capital. Dictaminó que la cobertura, en su sentido general, concuerda con el objetivo de la sharia de preservar el patrimonio, y que la decisión sobre las aplicaciones depende del cumplimiento por parte de las estructuras de los controles legales establecidos, principalmente: no deben contener riba ni servir como instrumento para la misma, ni contener gharar excesivo; la estructura debe ser lícita en sí misma; no deben conducir a la venta de deudas a un valor distinto del nominal ni a la venta de derechos separados, como las ventas de opciones prohibidas por la resolución 63 (7/1), ni a obligaciones pagadas como la comisión sobre garantía prohibida por la resolución 12 (2/12); deben tenerse en cuenta los objetivos de la sharia y los resultados de los contratos; no deben equivaler a garantizar el capital o las ganancias esperadas por el administrador, mudarib o agente, salvo mala conducta o negligencia; el riesgo en sí mismo no puede ser objeto de una transacción; y el objetivo debe ser la preservación del patrimonio, no la especulación sobre diferencias de precios. Recomendó la realización de seminarios con instituciones financieras islámicas para poner a prueba sus instrumentos conforme a estos controles e instó a quienes las administran a cumplirlos."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018), après examen des recommandations de son séminaire scientifique sur la couverture dans les transactions financières, tenu à Dubaï (26-27 avril 2016) en collaboration avec le Département des affaires islamiques et des activités caritatives. Elle définit la couverture comme l'action de se prémunir contre les risques, de se protéger et de se prémunir; en finance, comme l'ensemble des procédures organisées de gestion des risques par leur neutralisation, leur limitation ou leur transfert à un tiers; et, techniquement, comme la protection contre les risques et l'atténuation de leurs effets – sans se limiter aux opérations de marché reposant principalement sur le riba et le risque payé, notamment les produits dérivés tels que les contrats à terme, les options et les swaps différés, dont certains ont déjà été déclarés inadmissibles par l'Académie. Elle définit le risque comme la possibilité de perte d'argent, la survenance d'une perte ou un manque à gagner ou un profit inférieur aux prévisions, et la protection comme l'utilisation des moyens disponibles pour se prémunir contre les pertes, les diminutions ou les dommages – une définition plus large que la simple garantie de capital. La Cour a statué que la couverture, au sens large, est conforme à l'objectif de la charia de préservation du patrimoine et que l'examen des demandes d'autorisation dépend du respect, par les structures, des contrôles juridiques qu'elle a définis, à savoir: l'absence de riba (usure) et de toute utilisation à cette fin, ainsi que de gharar (intérêt excessif); la licéité de la structure; l'interdiction de céder des créances à une valeur autre que nominale, de céder des droits détachés (tels que les ventes d'options interdites par la résolution 63 (7/1)) ou des obligations payées (telles que les honoraires de garantie interdits par la résolution 12 (2/12)); la prise en compte des objectifs de la charia et des résultats des contrats; l'absence de garantie du capital ou des profits escomptés par le gérant, le mudarib ou l'agent (sauf faute ou négligence); l'interdiction de faire l'objet d'un échange en raison du risque lui-même; et l'objectif de la couverture doit être la préservation du patrimoine et non la spéculation sur les écarts de prix. La Cour a recommandé l'organisation de séminaires à destination des institutions financières islamiques afin d'évaluer leurs instruments au regard de ces contrôles et a exhorté leurs responsables à s'y conformer."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Safar 1440 H, 28 Ekim – 1 Kasım 2018) toplu kararı, Dubai'deki bilimsel seminerinin (26–27 Nisan 2016) İslami İşler ve Hayır Faaliyetleri Departmanı ile iş birliği içinde yaptığı 'Finansal İşlemlerde Korunma' konusundaki önerileri gözden geçirmiştir. Grup, dilsel olarak korunmayı kapsam, kaçınma ve koruma olarak tanımlamıştır; finansal olarak ise nötralize etme, sınırlama veya başka bir tarafa devretme yoluyla organize risk yönetimi prosedürlerini ifade etmektedir; Şeriat terimleriyle, genellikle tefecilik ve vadeli işlemlerden türevler (örneğin vadeli işlemler, opsiyonlar ve ertelenmiş swaplar gibi risk netleştirme esaslarına dayanan, bazılarını daha önce yasadışı ilan etmiş) finansal piyasa işlemleriyle sınırlamayan risk koruması ve azaltımını ifade etmektedir; risk, kayıp veya kâr kaybı olasılığı ve kayıp, eksiklik ve zararı önlemek için mevcut yöntemlerle koruma olarak tanımlanır ve bu, sermaye garantisinden daha geniş bir sınırdır. Tedbir unsurunun genel anlamıyla Şeriat'ın parayı koruma hedefleriyle uyumlu olduğu ve başvuruların kararının, kurduğu Şeriat düzenlemelerine uyan formüllere bağlı olduğu kararlaştırıldı; bunların en önemlisi: formüllerin tefecilik içermemesi, bunun için bir bahane oluşturmaması; formülün kendisinin meşru olduğu; borçların nominal değerinin ötesinde satışına ve 63 (7/1) sayılı Kararla yasaklanan opsiyon satışı gibi soyut hakların satışına yol açmadığı; 12/12 (2/12) Kararı ile yasaklanan garantiler üzerindeki ücretler gibi yükümlülüklerin pazarlığına yol açmadığı; Şeriatın amaçları ve sözleşme sonuçlarının gözetilmesi; yönetici, spekülatör veya temsilciden beklenen sermaye veya kârı garanti etmemesi; riskin kendisinin pazarlığa tabi olmadığı; ve amacın parayı korumak olması gerektiği, fiyat farkları üzerinde spekülasyon yapmak değil. İslami finans kurumlarıyla seminerler düzenlenmesini ve araçlarının incelenmesini önerdi ve sorumluları düzenlemelere uymaya çağırdı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Safar 1440 H, 28 Oktober – 1 November 2018), setelah meninjau rekomendasi seminar ilmiahnya 'Hedging in Financial Transactions' di Dubai (26–27 April 2016) bekerja sama dengan Departemen Urusan Islam dan Kegiatan Amal. Kelompok ini secara linguistik mendefinisikan lindung nilai sebagai cakupan, penghindaran, dan perlindungan; secara finansial, merujuk pada prosedur manajemen risiko terorganisir dengan menetralkan, membatasi, atau mentransfernya ke pihak lain; dan dalam istilah Syariah, merujuk pada perlindungan dan mitigasi risiko tanpa membatasinya pada operasi pasar keuangan, sering kali didasarkan pada riba dan netting risiko seperti derivatif dari futures, opsi, dan swap tertunda, beberapa di antaranya sebelumnya telah dinyatakan ilegal oleh kelompok; dan risiko didefinisikan sebagai kemungkinan kehilangan atau kehilangan keuntungan, serta perlindungan menggunakan cara yang tersedia untuk mencegah kerugian, kekurangan, dan kerusakan, yang lebih luas daripada jaminan modal. Diputuskan bahwa tindakan kehati-hatian dalam arti umum sejalan dengan tujuan Syariah dalam melindungi uang, dan bahwa putusan atas permohonan bergantung pada formula yang mematuhi peraturan Syariah yang telah ditetapkan, yang paling penting adalah: bahwa rumus-rumus tersebut tidak melibatkan riba atau menjadi dalih untuk itu, juga tidak memiliki ketidakpastian yang jelas; bahwa formula itu sendiri sah; bahwa formula itu sendiri tidak menyebabkan penjualan utang melebihi nilai nominalnya, maupun penjualan hak abstrak seperti penjualan opsi yang dilarang oleh Keputusan 63 (7/1); maupun untuk menawar kewajiban seperti upah atas jaminan yang dilarang oleh Keputusan 12 (2/12); bahwa tujuan Syariah dan hasil kontrak dipatuhi; bahwa mereka tidak menjamin modal atau keuntungan yang diharapkan dari manajer, spekulan, atau agen jika tidak terjadi pelanggaran atau kelalaian; bahwa risiko itu sendiri tidak dapat ditawar-menawar; dan bahwa tujuannya adalah untuk menjaga uang, bukan berspekulasi pada perbedaan harga. Ia merekomendasikan untuk mengadakan seminar dengan lembaga keuangan Islam guna memeriksa instrumen mereka dan mendesak pihak yang bertanggung jawab untuk mematuhi peraturan tersebut."
