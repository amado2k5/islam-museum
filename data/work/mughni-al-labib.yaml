label:
  ar: "مغني اللبيب عن كتب الأعاريب"
  en: "Mughni al-Labib an Kutub al-A'arib (Ibn Hisham al-Ansari)"
  ur: "مغنی اللبیب عن کتب الاعاریب ابن ہشام"
  fr: "Mughni al-Labib an Kutub al-A'arib (Ibn Hisham al-Ansari)"
  es: "Mughni al-Labib an Kutub al-A'arib (Ibn Hisham al-Ansari)"
summary:
  ar: "كتاب مغني اللبيب عن كتب الأعاريب لابن هشام الأنصاري، يذكر مؤلفه في مقدمته أنه أنشأ كتاباً في الإعراب بمكة سنة ٧٤٩هـ ثم أعاد العمل سنة ٧٥٦هـ وضمّ هذا التصنيف {cite:mughni-labib-mubarak-1985 p.12}، وأنه ينحصر في ثمانية أبواب أولها تفسير المفردات وهي الحروف وما تضمن معناها {cite:mughni-labib-mubarak-1985 p.13-14}، وأن كتب الإعراب تطول لكثرة التكرار وإيراد ما لا يتعلق بالإعراب وإعراب الواضحات {cite:mughni-labib-mubarak-1985 p.14-16}."
  en: "Ibn Hisham al-Ansari's Mughni al-Labib an Kutub al-A'arib, in whose preface the author says he composed a book on i'rab at Mecca in 749 AH and took up the work again in 756 AH, producing this one {cite:mughni-labib-mubarak-1985 p.12}; it falls into eight chapters, the first on explaining the single words, that is the particles and the nouns that carry their meaning {cite:mughni-labib-mubarak-1985 p.13-14}, and he says books of i'rab run long from repetition, from bringing in what does not concern i'rab and from parsing the obvious {cite:mughni-labib-mubarak-1985 p.14-16}."
  ur: "ابن ہشام انصاری کی مغنی اللبیب عن کتب الاعاریب، جس کے مقدمے میں مصنف کہتے ہیں کہ انھوں نے 749 ھ میں مکہ میں اعراب پر ایک کتاب لکھی اور 756 ھ میں کام دوبارہ شروع کر کے یہ تصنیف تیار کی {cite:mughni-labib-mubarak-1985 p.12}؛ یہ آٹھ ابواب میں ہے جن میں پہلا مفردات کی تفسیر ہے، یعنی حروف اور وہ اسماء جو ان کے معنی کو شامل ہیں {cite:mughni-labib-mubarak-1985 p.13-14}، اور وہ کہتے ہیں کہ اعراب کی کتابیں تکرار، اعراب سے غیر متعلق باتوں کے ذکر اور واضحات کے اعراب کی وجہ سے طویل ہو جاتی ہیں {cite:mughni-labib-mubarak-1985 p.14-16}۔"
  fr: "Mughni al-Labib an Kutub al-A'arib d'Ibn Hisham al-Ansari, dans la préface duquel l'auteur dit avoir composé un livre sur l'i'rab à La Mecque en 749 de l'Hégire puis repris le travail en 756, produisant celui-ci {cite:mughni-labib-mubarak-1985 p.12} ; il se divise en huit chapitres, le premier sur l'explication des mots simples, c'est-à-dire les particules et les noms qui portent leur sens {cite:mughni-labib-mubarak-1985 p.13-14}, et il dit que les livres d'i'rab s'allongent par la répétition, par l'apport de ce qui ne relève pas de l'i'rab et par l'analyse de l'évident {cite:mughni-labib-mubarak-1985 p.14-16}."
  es: "Mughni al-Labib an Kutub al-A'arib de Ibn Hisham al-Ansari, en cuyo prólogo el autor dice haber compuesto un libro sobre el i'rab en La Meca en el 749 de la hégira y retomado la obra en el 756, produciendo este {cite:mughni-labib-mubarak-1985 p.12}; se divide en ocho capítulos, el primero sobre la explicación de las palabras simples, es decir las partículas y los nombres que llevan su sentido {cite:mughni-labib-mubarak-1985 p.13-14}, y dice que los libros de i'rab se alargan por la repetición, por traer lo que no concierne al i'rab y por analizar lo evidente {cite:mughni-labib-mubarak-1985 p.14-16}."
