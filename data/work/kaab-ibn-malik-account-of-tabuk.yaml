label: { ar: "حديث كعب بن مالك في تخلفه عن تبوك", en: "Ka'b ibn Malik's account of staying behind at Tabuk", es: "El relato de Ka'b ibn Malik sobre su estancia en Tabuk", fr: "Récit de Ka'b ibn Malik sur son séjour à Tabuk", ur: "کعب بن مالک کا تبوک میں پیچھے رہنے کا بیان" }
summary:
  ar: "رواية طويلة نقلها ابن إسحاق عن الزهري بإسناده إلى كعب بن مالك في تخلفه عن غزوة تبوك وما تلاه من مقاطعة الثلاثة وقبول توبتهم."
  en: "A long account Ibn Ishaq transmits from al-Zuhri by his chain to Ka'b ibn Malik, on his staying behind from the Tabuk campaign and what followed: the boycott of the three and the acceptance of their repentance."
  es: "Ibn Ishaq transmite un extenso relato de al-Zuhri a través de su cadena de transmisión a Ka'b ibn Malik, sobre su permanencia en la campaña de Tabuk y lo que sucedió después: el boicot de los tres y la aceptación de su arrepentimiento."
  fr: "Un long récit qu'Ibn Ishaq transmet d'al-Zuhri par sa chaîne à Ka'b ibn Malik, sur son refus de participer à la campagne de Tabuk et sur ce qui s'ensuivit: le boycott des trois et l'acceptation de leur repentir."
  ur: "تبوک مہم سے پیچھے رہنے اور اس کے بعد: تینوں کا بائیکاٹ اور ان کی توبہ کی قبولیت کے بارے میں ابن اسحاق نے الزہری سے کعب بن مالک تک ایک طویل بیان نقل کیا ہے۔"
