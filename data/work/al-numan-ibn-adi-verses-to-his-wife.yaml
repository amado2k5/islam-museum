label: { ar: "أبيات النعمان بن عدي من ميسان", en: "Verses attributed to al-Numan ibn Adi at Maysan" }
summary:
  ar: "أبيات منسوبة إلى النعمان بن عدي وهو على ميسان بلغت عمر بن الخطاب فعزله بسببها؛ وفي حاشية المحققين أنها كُتبت إلى امرأته. تختلف رواية آخرها بين الكتاب ومعجم البلدان. لا ينقل المتحف نص الأبيات."
  en: Verses attributed to al-Nu'man ibn Adi while he governed Maysan that reached Umar ibn al-Khattab and caused his dismissal; the editors' marginal note says they were written to his wife. The transmission of their ending differs between the book and the Mu'jam al-Buldan. The museum does not reproduce the verses.
