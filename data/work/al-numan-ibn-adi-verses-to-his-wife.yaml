id: work/al-numan-ibn-adi-verses-to-his-wife
class: work
kind: poem
label: { ar: "أبيات النعمان بن عدي من ميسان", en: "Verses attributed to al-Numan ibn Adi at Maysan", es: "Versos atribuidos a al-Numan ibn Adi en Maysan", fr: "Versets attribués à al-Numan ibn Adi à Maysan", ur: "میسان میں نعمان بن عدی سے منسوب آیات", tr: "Masan'dan Al-Nu'man ibn Adi'nin Dizeleri", id: "Ayat-ayat Al-Nu'man ibn Adi dari Maysan" }
summary:
  ar: "أبيات منسوبة إلى النعمان بن عدي وهو على ميسان بلغت عمر بن الخطاب فعزله بسببها؛ وفي حاشية المحققين أنها كُتبت إلى امرأته. تختلف رواية آخرها بين الكتاب ومعجم البلدان. لا ينقل المتحف نص الأبيات."
  en: Verses attributed to al-Nu'man ibn Adi while he governed Maysan that reached Umar ibn al-Khattab and caused his dismissal; the editors' marginal note says they were written to his wife. The transmission of their ending differs between the book and the Mu'jam al-Buldan. The museum does not reproduce the verses.
  es: "Versos atribuidos a al-Nu'man ibn Adi durante su gobierno en Maysan que llegaron a manos de Umar ibn al-Khattab y provocaron su destitución; la nota marginal de los editores indica que fueron escritos a su esposa. La versión de su final difiere entre el libro y el Mu'jam al-Buldan. El museo no reproduce los versos."
  fr: "Des vers attribués à al-Nu'man ibn Adi, écrits durant son gouvernement de Maysan, parvinrent à Umar ibn al-Khattab et entraînèrent sa destitution; une note marginale des éditeurs précise qu'ils étaient adressés à son épouse. La transmission de leur fin diffère entre le livre et le Mu'jam al-Buldan. Le musée ne reproduit pas ces vers."
  ur: "نعمان بن عدی سے منسوب آیات جب اس نے میسان پر حکومت کی جو عمر بن الخطاب تک پہنچی اور اس کی برطرفی کا سبب بنی۔ ایڈیٹرز کا معمولی نوٹ کہتا ہے کہ وہ ان کی بیوی کو لکھا گیا تھا۔ ان کے اختتام کی ترسیل کتاب اور معجم البلدان کے درمیان مختلف ہے۔ میوزیم آیات کو دوبارہ پیش نہیں کرتا ہے۔"
  tr: "Maysan'da bulunan el-Nu'man bin Adi'ye atfedilen ayetler, Ömer bin el-Hattab'a ulaştı; o da bu dizeler nedeniyle onu görevden aldı; ve alimlerin dipnotlarında bunlar eşine yazılmıştır. Sonuncusunun anlatımı kitap ile ülkeler sözlüğü arasında farklılık gösterir. Müze, bu ayetlerin metnini aktarmamaktadır."
  id: "Ayat-ayat yang dikaitkan dengan al-Nu'man ibn 'Adi, yang berada di Maysan, sampai kepada Umar ibn al-Khattab, yang memecatnya karena itu; dan dalam catatan kaki para ulama, ayat-ayat tersebut ditulis kepada istrinya. Narasi ayat terakhir berbeda antara buku dan kamus negara. Museum tidak meneruskan teks ayat-ayat tersebut."
