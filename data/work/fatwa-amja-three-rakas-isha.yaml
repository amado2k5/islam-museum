id: work/fatwa-amja-three-rakas-isha
class: work
kind: fatwa
label: { ar: "صلّى العشاء ثلاثًا ناسيًا", en: "He prayed isha as three rak'as by mistake", ur: "عشاء تین رکعت پڑھ لی — بھول سے", es: "Rezó Isha como tres rak'as por error.", fr: "Il a prié l'isha en trois rak'as par erreur", tr: "Isha'ya üç unutkan dua et", id: "Doalah Isha tiga doa yang lupa" }
summary:
  ar: "سأل سائل جمع بين المغرب والعشاء بعد عودته من المستشفى فصلى العشاء ثلاث ركعات بخطأ أو نسيان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77976 بتاريخ 25 فبراير 2009)⁩ أنه إن كان قد صلى العشاء ثلاثًا بيقين أو غلبة ظن فتلزمه الركعة الرابعة إن تذكر عن قريب ثم سجود السهو وإلا لزمته إعادة الصلاة من البداية، ولا يلزم حكم الخطاب في حق المكلف إلا إذا بلغه لقوله تعالى وأوحي إلي هذا القرآن لأنذركم به ومن بلغ، ولا إثم على الناسي أو المخطئ لكن نفي الإثم لا يعفيه من تصحيح العبادة والإتيان بها على الوجه المشروع."
  en: "A man who combined maghrib and isha after hospital accidentally prayed isha as three rak'as. Dr. Salah al-Sawi (fatwa no. 77976, 25 February 2009) answered that if he prayed it three by certainty or strong likelihood, a fourth rak'a is due if he remembers soon, then the prostration of forgetfulness — otherwise he repeats the prayer from the start; the binding ruling reaches the bound person only when it reaches him — 'this Quran was revealed to me to warn you and whomever it reaches' — and the forgetful or mistaken bears no sin, yet the absence of sin does not free him from correcting the act and performing it in the lawful form."
  ur: "ایک شخص نے غلطی سے عشاء تین رکعت پڑھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77976، 25 فروری 2009)⁩ کے مطابق قریب یاد آئے تو چوتھی رکعت اور سجدہ سہو؛ ورنہ نماز دہرائے — بھولنے والے پر گناہ نہیں مگر عبادت درست کرنا لازم ہے۔"
  es: "Un hombre que combinó maghrib e isha después de estar en el hospital rezó isha accidentalmente como tres rak'as. El Dr. Salah al-Sawi (fatwa n.° 77976, 25 de febrero de 2009) respondió que si la rezó tres veces con certeza o con alta probabilidad, debe realizar una cuarta rak'a si se acuerda pronto, y luego la postración por olvido; de lo contrario, debe repetir la oración desde el principio; la norma vinculante solo llega a la persona obligada cuando le llega: «Este Corán me fue revelado para advertiros a vosotros y a quienquiera que llegue»; y el olvidadizo o equivocado no tiene pecado, pero la ausencia de pecado no lo exime de corregir el acto y realizarlo de la forma lícita."
  fr: "Un homme, après avoir enchaîné les prières du maghrib et de l'isha à l'hôpital, a accidentellement accompli trois rak'as de l'isha. Le Dr Salah al-Sawi (fatwa n° 77976, 25 février 2009) a répondu que s'il en avait accompli trois avec certitude ou forte probabilité, une quatrième rak'a est due s'il s'en souvient rapidement, puis il doit effectuer la prosternation de l'oubli. Sinon, il doit recommencer la prière depuis le début. La règle obligatoire ne s'applique qu'à celui qui y est soumis – « Ce Coran m'a été révélé pour vous avertir, vous et tous ceux à qui il parvient » – et celui qui a oublié ou commis une erreur ne commet pas de péché, mais l'absence de péché ne le dispense pas de corriger son acte et de l'accomplir correctement."
  tr: "Bir soru soran, hastaneden döndükten sonra Mağrib ve İşa namazını birleştiren ve yanlışlıkla ya da unutkanlıkla üç rekat namaz kılan bir kişiye sordu. Dr. Salah Al-Sawy (25 Şubat 2009 tarihli 77976 No. fetva) şöyle yanıt verdi: Eğer üç kez kesin veya önyargılı olarak İsha namazını kaçırırsa, yakından hatırlarsa dördüncü rekatı kılmak zorundadır; aksi takdirde namazı baştan tekrarlamak zorundadır. Namaz hükmetmenin hükmü, hesap veren kişi için geçerlidir, ancak o namaza ulaşırsa geçerlidir; Allah'ın dediği gibi: 'Bu Kur'an bana sizi ve ona ulaşanları uyarmak için indirilmiştir.' Unutkan ya da yanlışlı üzerinde günah yoktur, ancak günahı reddetmek, onu ibadeti düzeltmek ve öngörülen şekilde kılmaktan muaf tutmaz."
  id: "Seorang penanya menanyakan kepada seseorang yang menggabungkan shalat Maghrib dan Isha setelah kembali dari rumah sakit dan berdoa tiga rak'ah Isha karena kesalahan atau lupa. Dr. Salah Al-Sawy menjawab (Fatwa No. 77976 tanggal 25 Februari 2009) bahwa jika ia shalat Isha tiga kali dengan kepastian atau prasangka, ia harus shalat rak'ah keempat jika ia mengingatnya dengan seksama, maka ia harus sujud dalam pelupaan; jika tidak, ia harus mengulangi doa dari awal. Putusan pidato berlaku untuk orang yang bertanggung jawab kecuali jika ia mencapainya, seperti yang Allah Kuasai firman: 'Dan Al-Qur'an ini diwahyukan kepadaku untuk memperingatkan kamu dan mereka yang mencapainya.' Tidak ada dosa bagi yang lupa atau yang salah, tetapi menyangkal dosa tidak membebaskannya dari mengoreksi ibadah dan melakukannya dengan cara yang ditentukan."
