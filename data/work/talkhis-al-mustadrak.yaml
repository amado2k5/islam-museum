summary:
  ar: "مختصر الذهبي ⁦(ت 748هـ)⁩ لمستدرك الحاكم، تعقّب فيه أحكام الحاكم على الأحاديث ونبّه على تساهله في التصحيح؛ طُبع في ذيل المستدرك بحيدرآباد، وتضمّنت تعقباته طبعات لاحقة {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}. ويرى مقبل الوادعي أنه لا يغني عن الأصل لأن الذهبي يحذف بعض الإسناد {cite:mustadrak-haramayn-1997-v1 p. 37}."
  en: "Al-Dhahabi's (d. 748 AH) abridgement of al-Hakim's Mustadrak, commenting on al-Hakim's verdicts and pointing out his laxity in authentication; printed beneath the Mustadrak at Hyderabad, with its comments carried into later editions {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}. Muqbil al-Wadi'i holds that it cannot replace the original, because al-Dhahabi drops part of the chain {cite:mustadrak-haramayn-1997-v1 p. 37}."
  ur: "حاکم کی المستدرک کا ذہبی ⁦(وفات 748ھ)⁩ کا اختصار، جس میں انہوں نے احادیث پر حاکم کے احکام کا تعقب کیا اور تصحیح میں ان کے تساہل پر تنبیہ کی؛ حیدرآباد میں المستدرک کے نیچے چھپا اور اس کے تعقبات بعد کے ایڈیشنوں میں شامل ہوئے {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}۔ مقبل وادعی کے نزدیک یہ اصل کا بدل نہیں کیونکہ ذہبی سند کا کچھ حصہ حذف کرتے ہیں {cite:mustadrak-haramayn-1997-v1 p. 37}۔"
