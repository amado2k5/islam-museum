summary:
  ar: "مختصر الذهبي ⁦(ت 748هـ)⁩ لمستدرك الحاكم، تعقّب فيه أحكام الحاكم على الأحاديث ونبّه على تساهله في التصحيح؛ طُبع في ذيل المستدرك بحيدرآباد، وتضمّنت تعقباته طبعات لاحقة {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}. ويرى مقبل الوادعي أنه لا يغني عن الأصل لأن الذهبي يحذف بعض الإسناد {cite:mustadrak-haramayn-1997-v1 p. 37}."
  en: "Al-Dhahabi's (d. 748 AH) abridgement of al-Hakim's Mustadrak, commenting on al-Hakim's verdicts and pointing out his laxity in authentication; printed beneath the Mustadrak at Hyderabad, with its comments carried into later editions {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}. Muqbil al-Wadi'i holds that it cannot replace the original, because al-Dhahabi drops part of the chain {cite:mustadrak-haramayn-1997-v1 p. 37}."
  ur: "حاکم کی المستدرک کا ذہبی ⁦(وفات 748ھ)⁩ کا اختصار، جس میں انہوں نے احادیث پر حاکم کے احکام کا تعقب کیا اور تصحیح میں ان کے تساہل پر تنبیہ کی؛ حیدرآباد میں المستدرک کے نیچے چھپا اور اس کے تعقبات بعد کے ایڈیشنوں میں شامل ہوئے {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}۔ مقبل وادعی کے نزدیک یہ اصل کا بدل نہیں کیونکہ ذہبی سند کا کچھ حصہ حذف کرتے ہیں {cite:mustadrak-haramayn-1997-v1 p. 37}۔"
  es: "El compendio de Mustadrak de al-Hakim realizado por Al-Dhahabi (m. 748 AH), en el que comenta los veredictos de al-Hakim y señala su laxitud en la autenticación, se imprimió debajo del Mustadrak en Hyderabad, y sus comentarios se incorporaron a ediciones posteriores {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}. Muqbil al-Wadi'i sostiene que no puede reemplazar al original, porque al-Dhahabi omite parte de la cadena {cite:mustadrak-haramayn-1997-v1 p. 37}."
  fr: "L'abrégé du Mustadrak d'al-Hakim par al-Dhahabi (mort en 748 AH), commentant les verdicts d'al-Hakim et soulignant son laxisme en matière d'authentification; imprimé en marge du Mustadrak à Hyderabad, avec ses commentaires repris dans les éditions ultérieures {cite:mustadrak-nizamiyya-1341-v3 p. 2} {cite:mustadrak-haramayn-1997-v1 p. 1, 38}. Muqbil al-Wadi'i soutient qu'il ne peut remplacer l'original, car al-Dhahabi omet une partie de la chaîne de transmission {cite:mustadrak-haramayn-1997-v1 p. 37}."
  tr: "Mukhtasar al-Dhahabi (ö. 748 H) adlı eserinde Mustadrak al-Hakim tarafından yazılmıştır; burada al-Hakim'in hadisler hakkındaki kararlarına yorum yapmış ve doğrulamadaki hoşgörüsüne dikkat çekmiştir; bu eser, Haydarabad'daki al-Mustadrak'ın dipnotunda basılmıştır ve açıklamaları daha sonraki baskıları içermiştir {cite:mustadrak-nizamiyya-1341-v3 s. 2} {cite:mustadrak-haramayn-1997-v1 s. 1, 38}. Muqbil al-Wadi'i, orijinalin orijinalin yerine geçmediğine inanır çünkü al-Dhahabi bazı zincirleri atlamaktadır {cite:mustadrak-haramayn-1997-v1, s. 37}."
  id: "Mukhtasar al-Dhahabi (wafat 748 H) oleh Mustadrak al-Hakim, di mana ia mengomentari putusan al-Hakim tentang hadits dan menunjukkan kelonggarannya dalam verifikasi; karya tersebut dicetak dalam catatan kaki al-Mustadrak di Hyderabad, dan anotasinya mencakup edisi-edisi berikutnya {cite:mustadrak-nizamiyya-1341-v3 hlm. 2} {cite:mustadrak-haramayn-1997-v1 hlm. 1, 38}. Muqbil al-Wadi'i percaya bahwa naskah asli tidak menggantikan yang asli karena al-Dhahabi menghilangkan beberapa rantai {cite:mustadrak-haramayn-1997-v1, hlm. 37}."
