label: { ar: "حكم الاستعانة على قيادة السيارات والمركبات بتعاطي المخدرات", en: "Taking drugs to help with driving", ur: "گاڑی چلانے میں نشہ آور ادویات کا استعمال" }
summary:
  ar: "سائل سأل عن تعاطي المخدرات للاستعانة على قيادة المركبات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22045)⁩ أنه يجب شرعًا اجتناب المخدرات سواء كان الإنسان يقود مركبة أو لا ومن تعاطى منها شيئًا أثناء القيادة فهو أشد إثمًا لتعريضه نفسه وغيره للخطر، على ما فصّل الجواب."
  en: "A questioner asked about taking drugs to help with driving. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22045) answered that drugs must be avoided whether one drives or not, and whoever takes them while driving is more sinful still for endangering himself and others, as the answer details."
  ur: "ایک سائل نے گاڑی چلانے میں مدد کے لیے نشہ آور ادویات لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22045)⁩ نے جواب دیا کہ شرعاً نشہ آور چیزوں سے اجتناب واجب ہے خواہ شخص گاڑی چلا رہا ہو یا نہیں؛ ڈرائیونگ کے دوران لینے والا زیادہ گنہگار ہے کیونکہ وہ اپنی اور دوسروں کی جان خطرے میں ڈالتا ہے، جیسا کہ جواب میں تفصیل ہے۔"
