label: { ar: "أبيات تأبط شرا «إذا المرء لم يحتل وقد جد جده»", en: "Ta'abbata Sharran's verses 'If a man uses no cunning when the time is earnest'", es: "Versos de Ta'abbata Sharran: \"Si un hombre no usa astucia cuando el momento es crucial\".", fr: "Versets de Ta'abbata Sharran: « Si un homme ne recourt à aucune ruse lorsque le moment est venu »", ur: "طباطہ شران کی آیات 'اگر کوئی آدمی وقت کے ساتھ ساتھ چالاکیوں سے کام نہ لے'", tr: "Kötülüğü aktaran dizeler: \"Bir adam işgal etmedi ve büyükbabasını bulduysa\"", id: "Ayat-ayat yang menyampaikan kejahatan: \"Jika seseorang belum menempati dan telah menemukan kakeknya\"" }
summary:
  ar: "أبيات في ديوان الحماسة من الطويل على روي الراء، تقدّمها الطبعة بقولها «وقال تأبط شرا» {{cite:hamasa-abu-tammam-ed-1916 p.17}}."
  en: "Verses in the Diwan al-Hamasa in the tawil metre on the rhyme ra, introduced in the edition with \"and Ta'abbata Sharran said\" {{cite:hamasa-abu-tammam-ed-1916 p.17}}."
  es: "Versos en el Diwan al-Hamasa en métrica tawil sobre la rima ra, introducidos en la edición con \"y Ta'abbata Sharran dijo\" {{cita:hamasa-abu-tammam-ed-1916 p.17}}."
  fr: "Versets du Diwan al-Hamasa au mètre tawil sur la rime ra, introduits dans l'édition avec \"et Ta'abbata Sharran a dit\" {{cite:hamasa-abu-tammam-ed-1916 p.17}}."
  ur: "دیوان الحمسہ میں آیات تاویل میٹر آن دی رائم را، ایڈیشن میں متعارف کرائی گئی \"اور طباطہ شران نے کہا\""
  tr: "Al-Tawil'den Al-Hamasah Diwanı'ndan Ra'nın anlatımına dair ayetler, öncesinde \"Ve o kötü bir adam olduğunu söyledi\" ifadesiyle birlikte {{cite:hamasa-abu-tammam-ed-1916 s.17}}."
  id: "Ayat-ayat dari Diwan Al-Hamasah dari Al-Tawil tentang narasi Ra', didahului oleh edisi dengan frasa \"Dan dia berkata dia orang jahat\" {{cite:hamasa-abu-tammam-ed-1916 hlm.17}}."
