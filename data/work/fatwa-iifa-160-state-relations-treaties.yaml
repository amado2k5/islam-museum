label: { ar: "قرار مجمع الفقه الإسلامي الدولي 160 (17/9) بشأن علاقات الدولة الإسلامية بغيرها وبالمواثيق الدولية", en: "IIFA resolution 160 (17/9) on the Islamic state's relations with other states and with international covenants", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 160 (17/9): اسلامی ریاست کے دوسری ریاستوں اور بین الاقوامی معاہدوں سے تعلقات", es: "Resolución 160 (17/9) de la IIFA sobre las relaciones del Estado islámico con otros Estados y con los convenios internacionales.", fr: "Résolution 160 (17/9) de l'IIFA sur les relations de l'État islamique avec les autres États et avec les conventions internationales", tr: "Uluslararası İslam Fiqh Akademisi Kararı 160 (17/9) IŞİD'in diğerleriyle ilişkileri ve uluslararası tüzüklere ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 160 (17/9) mengenai hubungan Negara Islam dengan pihak lain dan piagam internasional" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩. قرر في نصه: أن علاقة الدول الإسلامية بغيرها تقوم على السلام ونبذ الحروب والاحترام المتبادل والتعاون بما يحقق المصالح المشتركة للإنسانية في إطار الأحكام الشرعية؛ وأن الدولة الإسلامية لا تعادي دولة لمجرد الخلاف في الدين وإنما تعادي من يبتدرها بعدوان أو يسيء إلى رموزها ومقدساتها، لأن الحرب في الإسلام وسيلة أخيرة للدفاع عن النفس ورد العدوان؛ وضرورة التعاون والتكامل بين الدول الإسلامية ⁦(السوق المشتركة، المناطق الاقتصادية الحرة، اتفاقيات التعاون)⁩؛ ولا مانع شرعًا من إبرام الاتفاقيات الدولية التي لا تتعارض مع مبادئ الإسلام وأحكامه ولا تضر بمصالح الأمة. وتابع ضوابط الانضمام للمواثيق الدولية ومراجعتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006). In its own text: relations between Islamic and other states rest on peace, rejection of war, mutual respect and cooperation for humanity's shared interests within the legal rulings; the Islamic state does not oppose another merely over religious difference, only one that initiates aggression or injures its symbols and sanctities, war in Islam being a last resort for self-defence and repelling aggression; cooperation and integration among Islamic states is necessary (common market, free economic zones, cooperation agreements); and there is no legal bar to concluding international accords not conflicting with Islam's principles and rulings nor harming the umma's interests — with further controls on joining and reviewing international covenants."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں۔ اپنے متن میں اس نے فیصلہ دیا: اسلامی اور دیگر ریاستوں کے تعلقات شرعی احکام کے دائرے میں امن، جنگ کی نفی، باہمی احترام اور انسانیت کے مشترک مفادات کے لیے تعاون پر قائم ہیں؛ اسلامی ریاست محض دینی اختلاف پر کسی ریاست سے عداوت نہیں رکھتی، صرف اس سے جو اغازِ عدوان کرے یا اس کی علامات اور مقدسات کو تکلیف پہنچائے، کیونکہ اسلام میں جنگ آخری ذریعہ ہے — دفاع اور عدوان کی روک کے لیے؛ اسلامی ممالک کے درمیان تعاون و تکمیل ضروری ⁦(مشترک بازار، آزاد معاشی زون، معاہدے)⁩؛ اور ان بین الاقوامی معاہدوں پر کوئی شرعی مانع نہیں جو اسلام کے اصولوں اور احکام سے نہ ٹکرائیں اور امت کے مفاد کو نقصان نہ دیں — بین الاقوامی معاہدوں میں شمولیت اور ان کے جائزے کے مزید ضوابط کے ساتھ۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24-28 de junio de 2006). En su propio texto: las relaciones entre los estados islámicos y otros estados se basan en la paz, el rechazo a la guerra, el respeto mutuo y la cooperación para los intereses comunes de la humanidad dentro de los límites legales; el estado islámico no se opone a otro simplemente por diferencias religiosas, sino solo a aquel que inicia una agresión o daña sus símbolos y lugares sagrados, siendo la guerra en el Islam un último recurso para la autodefensa y la repelencia de la agresión; la cooperación e integración entre los estados islámicos son necesarias (mercado común, zonas económicas libres, acuerdos de cooperación); y no existe ningún impedimento legal para concluir acuerdos internacionales que no entren en conflicto con los principios y preceptos del Islam ni perjudiquen los intereses de la umma, con controles adicionales para la adhesión y revisión de pactos internacionales."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006). Dans son texte: les relations entre États islamiques et autres États reposent sur la paix, le rejet de la guerre, le respect mutuel et la coopération pour les intérêts communs de l'humanité, dans le respect des règles juridiques; l'État islamique ne s'oppose pas à un autre État pour de simples différences religieuses, mais seulement à celui qui initie une agression ou porte atteinte à ses symboles et à ses lieux saints, la guerre étant en Islam un dernier recours pour la légitime défense et la riposte à une agression; la coopération et l'intégration entre États islamiques sont nécessaires (marché commun, zones économiques franches, accords de coopération); et rien ne s'oppose juridiquement à la conclusion d'accords internationaux qui ne contreviennent pas aux principes et aux règles de l'Islam et ne portent pas atteinte aux intérêts de la umma – des contrôles supplémentaires étant prévus pour l'adhésion et la révision des conventions internationales."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on yedinci oturumunda Amman'da (28 Cumedül-Avvel – 2 Cumedül-Ahirah 1427 H, 24–28 Haziran 2006) toplu kararı alınmıştır. Metninde kararlaştırılmıştır: İslam ülkelerinin diğer ülkelerle ilişkileri barış, savaşların reddi, karşılıklı saygı ve Şeriat hükümleri çerçevesinde insanlığın ortak çıkarlarını gerçekleştirecek şekilde iş birliğine dayanır; ve İslam devleti sadece dini anlaşmazlık nedeniyle değil, saldırı başlatanlara veya sembollerine ve kutsal değerlerine hakaret edenlere karşı çıkar; çünkü İslam'da savaş meşru müdafaa ve saldırganlığı püskürtmek için son çaredir; İslam ülkeleri arasında işbirliği ve entegrasyonun gerekliliği (ortak pazar, serbest ekonomik bölgeler, işbirliği anlaşmaları); ve İslam'ın ilke ve hükümleriyle çelişmeyen veya Ümmet'in çıkarlarına zarar vermeyen uluslararası anlaşmaların yapılmasına dini bir itiraz yoktur. Uluslararası tüzüklere katılım ve gözden geçirilme düzenlemelerini takip etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ketujuh belas di Amman (28 Jumada al-Awwal – 2 Jumada al-Akhirah 1427 H, 24–28 Juni 2006 M). Dalam teksnya diputuskan: bahwa hubungan negara-negara Islam dengan negara lain didasarkan pada perdamaian, penolakan perang, saling menghormati, dan kerja sama dengan cara yang mencapai kepentingan bersama umat manusia dalam kerangka putusan Syariah; dan bahwa negara Islam tidak menentang negara hanya karena perbedaan agama tetapi menentang mereka yang memulai agresi atau menghina simbol dan nilai-nilai sucinya, karena perang dalam Islam adalah upaya terakhir untuk membela diri dan menangkis agresi; perlunya kerja sama dan integrasi antar negara Islam (pasar bersama, zona ekonomi bebas, perjanjian kerja sama); dan tidak ada keberatan agama terhadap penandatanganan perjanjian internasional yang tidak bertentangan dengan prinsip dan aturan Islam atau merugikan kepentingan Ummah. Ia menindaklanjuti peraturan untuk bergabung dan meninjau piagam internasional."
