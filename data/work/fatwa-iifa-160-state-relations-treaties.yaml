label: { ar: "قرار مجمع الفقه الإسلامي الدولي 160 (17/9) بشأن علاقات الدولة الإسلامية بغيرها وبالمواثيق الدولية", en: "IIFA resolution 160 (17/9) on the Islamic state's relations with other states and with international covenants", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 160 (17/9): اسلامی ریاست کے دوسری ریاستوں اور بین الاقوامی معاہدوں سے تعلقات", es: "Resolución 160 (17/9) de la IIFA sobre las relaciones del Estado islámico con otros Estados y con los convenios internacionales." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩. قرر في نصه: أن علاقة الدول الإسلامية بغيرها تقوم على السلام ونبذ الحروب والاحترام المتبادل والتعاون بما يحقق المصالح المشتركة للإنسانية في إطار الأحكام الشرعية؛ وأن الدولة الإسلامية لا تعادي دولة لمجرد الخلاف في الدين وإنما تعادي من يبتدرها بعدوان أو يسيء إلى رموزها ومقدساتها، لأن الحرب في الإسلام وسيلة أخيرة للدفاع عن النفس ورد العدوان؛ وضرورة التعاون والتكامل بين الدول الإسلامية ⁦(السوق المشتركة، المناطق الاقتصادية الحرة، اتفاقيات التعاون)⁩؛ ولا مانع شرعًا من إبرام الاتفاقيات الدولية التي لا تتعارض مع مبادئ الإسلام وأحكامه ولا تضر بمصالح الأمة. وتابع ضوابط الانضمام للمواثيق الدولية ومراجعتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006). In its own text: relations between Islamic and other states rest on peace, rejection of war, mutual respect and cooperation for humanity's shared interests within the legal rulings; the Islamic state does not oppose another merely over religious difference, only one that initiates aggression or injures its symbols and sanctities, war in Islam being a last resort for self-defence and repelling aggression; cooperation and integration among Islamic states is necessary (common market, free economic zones, cooperation agreements); and there is no legal bar to concluding international accords not conflicting with Islam's principles and rulings nor harming the umma's interests — with further controls on joining and reviewing international covenants."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں۔ اپنے متن میں اس نے فیصلہ دیا: اسلامی اور دیگر ریاستوں کے تعلقات شرعی احکام کے دائرے میں امن، جنگ کی نفی، باہمی احترام اور انسانیت کے مشترک مفادات کے لیے تعاون پر قائم ہیں؛ اسلامی ریاست محض دینی اختلاف پر کسی ریاست سے عداوت نہیں رکھتی، صرف اس سے جو اغازِ عدوان کرے یا اس کی علامات اور مقدسات کو تکلیف پہنچائے، کیونکہ اسلام میں جنگ آخری ذریعہ ہے — دفاع اور عدوان کی روک کے لیے؛ اسلامی ممالک کے درمیان تعاون و تکمیل ضروری ⁦(مشترک بازار، آزاد معاشی زون، معاہدے)⁩؛ اور ان بین الاقوامی معاہدوں پر کوئی شرعی مانع نہیں جو اسلام کے اصولوں اور احکام سے نہ ٹکرائیں اور امت کے مفاد کو نقصان نہ دیں — بین الاقوامی معاہدوں میں شمولیت اور ان کے جائزے کے مزید ضوابط کے ساتھ۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24-28 de junio de 2006). En su propio texto: las relaciones entre los estados islámicos y otros estados se basan en la paz, el rechazo a la guerra, el respeto mutuo y la cooperación para los intereses comunes de la humanidad dentro de los límites legales; el estado islámico no se opone a otro simplemente por diferencias religiosas, sino solo a aquel que inicia una agresión o daña sus símbolos y lugares sagrados, siendo la guerra en el Islam un último recurso para la autodefensa y la repelencia de la agresión; la cooperación e integración entre los estados islámicos son necesarias (mercado común, zonas económicas libres, acuerdos de cooperación); y no existe ningún impedimento legal para concluir acuerdos internacionales que no entren en conflicto con los principios y preceptos del Islam ni perjudiquen los intereses de la umma, con controles adicionales para la adhesión y revisión de pactos internacionales."
