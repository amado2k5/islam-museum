summary:
  ar: "موقع إسلامي سعودي بالعربية والإنجليزية يتولاه الشيخ سلمان العودة، الذي كان مديرًا لنسخته العربية؛ أقدم لقطة له في أرشيف الإنترنت مؤرخة في 11 أبريل 2001، وأقدم لقطة معنونة في مارس 2002 بعنوان «موقع عن الإسلام والمسلمين»."
  en: "A Saudi Islamic website in Arabic and English run by Shaykh Salman al-Ouda, who was a director of its Arabic edition; its earliest archived capture is of 11 April 2001, and its earliest titled capture, of March 2002, calls it 'a web site about islam and muslims'."
  ur: "عربی اور انگریزی میں سعودی اسلامی ویب سائٹ جس کے ذمہ دار شیخ سلمان العودہ ہیں، جو اس کے عربی ایڈیشن کے ڈائریکٹر تھے؛ سب سے پرانی آرکائیو تصویر 11 اپریل 2001 کی ہے، اور عنوان والی پہلی، مارچ 2002، اسے «اسلام اور مسلمانوں کے بارے میں ایک ویب سائٹ» کہتی ہے۔"
