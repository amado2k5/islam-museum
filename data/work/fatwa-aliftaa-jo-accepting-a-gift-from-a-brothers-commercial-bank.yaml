id: work/fatwa-aliftaa-jo-accepting-a-gift-from-a-brothers-commercial-bank
class: work
kind: fatwa
label: { ar: "قبول هدية من بنك تجاري يعمل فيه الأخ", en: "Accepting a gift a brother received from his commercial bank", ur: "بھائی کے کمرشل بینک کا تحفہ قبول کرنا" }
summary:
  ar: "سؤال عن قبول هدية من بنك تجاري يعمل فيه الأخ، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في قبول هذه الهدية لأن عينها لا تتعلق بها حرمة، والإثم لا ينتقل إلى المهدى إليه. أجابت الدائرة بأنه لا حرج في قبول هذه الهدايا، لأن عين الهدية لا تتعلق بها حرمة بخلاف المال المسروق، فالإثم لا يتعدى إلى المهدى إليه، واستشهدت بـ[[passage/quran-6-164|سورة الأنعام 6:164]]. وذكرت أن النبي أكل من طعام اليهود وبايعهم واشترى منهم مع أن أموالهم مختلطة بالربا، وأن مال البنوك الربوية مما يختلط فيه الحلال والحرام. ونقلت عن ابن حجر الهيتمي في تحفة المحتاج (9/389) أنه لا تحرم معاملة من أكثر ماله حرام ولا الأكل منه، كما صححه النووي في المجموع."
  en: "A question about accepting a gift a brother received from his commercial bank, in which Jordan's General Iftaa Department answered that there is no objection to accepting the gift, because the gift itself carries no prohibition and any sin does not pass to the recipient. The Department answered that there is no objection to accepting such gifts, because the gift itself carries no prohibition, unlike stolen property, so any sin does not extend to the recipient, citing [[passage/quran-6-164|Surat al-An'am 6:164]]. It noted that the Prophet ate the food of Jews and traded and bought from them, although their wealth was mixed with riba, and that the wealth of interest-based banks is of the kind in which lawful and unlawful are mixed. It quoted Ibn Hajar al-Haytami in Tuhfat al-Muhtaj (9/389) that dealing with someone most of whose wealth is unlawful, or eating from it, is not forbidden, as al-Nawawi affirmed in al-Majmu."
  ur: "بھائی کے کمرشل بینک کا تحفہ قبول کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس تحفے کو قبول کرنے میں حرج نہیں کیونکہ تحفے کی ذات میں حرمت نہیں، اور گناہ تحفہ لینے والے کی طرف منتقل نہیں ہوتا۔ ڈیپارٹمنٹ نے جواب دیا کہ ایسے تحفے قبول کرنے میں حرج نہیں، کیونکہ چوری کے مال کے برخلاف تحفے کی ذات میں حرمت نہیں، اس لیے گناہ تحفہ لینے والے تک نہیں پہنچتا، اور [[passage/quran-6-164|سورۃ الانعام 6:164]] کا حوالہ دیا۔ اس نے بتایا کہ نبی نے یہودیوں کا کھانا کھایا اور ان سے لین دین اور خریداری کی، حالانکہ ان کے مال میں سود ملا ہوا تھا، اور سودی بینکوں کا مال ایسا ہے جس میں حلال اور حرام ملے ہوتے ہیں۔ اس نے تحفۃ المحتاج (9/389) میں ابن حجر ہیتمی سے نقل کیا کہ جس کا زیادہ مال حرام ہو اس سے لین دین یا اس کا کھانا حرام نہیں، جیسا کہ نووی نے المجموع میں صحیح قرار دیا۔"
