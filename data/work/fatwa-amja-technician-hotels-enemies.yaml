label: { ar: "عمل التكييف في الفنادق ولأعداء المسلمين", en: "Air-conditioning work in hotels and for Islam's enemies", ur: "ہوٹلوں اور دشمنان اسلام کے لیے ائیر کنڈیشننگ کا کام" }
summary:
  ar: "سأل سائل عن جواز عمل الرجل في صيانة وتركيب التكييف في الفنادق ولأعداء المسلمين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78778 بتاريخ 7 مايو 2009)⁩ أن الفنادق دار نزل وإيواء في الأصل وما يشوبها من مفاسد ليس من وظيفتها الأصلية والأصل في إيواء المسافرين بأجر أو بغير أجر أنه مباح، وأما العمل لأعداء المسلمين ففيه تفصيل: فإن كان مع المحاربين المتلبسين بحرب فعلية تمايزت فيها الصفوف فلا يجوز، وإن كان مع المعاهدين الذين تربط دولهم بديار الإسلام اتفاقيات سلام أو علاقات دبلوماسية فلا حرج فيه، ويتجنب العمل فيما يسخط الله مع المسلمين وغيرهم."
  en: "A man asked whether he may install and service air-conditioning in hotels and for enemies of the Muslims. Dr. Salah al-Sawi (fatwa no. 78778, 7 May 2009) answered that hotels are lodging-houses by nature — the corruption marring them is not their function — and housing travellers, paid or not, is lawful; as for working for the Muslims' enemies there is detail: with actual combatants in a real war where ranks are drawn it is not permissible, but with covenant-holders whose states have peace agreements or diplomatic ties with Muslim lands it is unobjectionable, avoiding work that angers God whether with Muslims or others."
  ur: "ایک شخص نے ہوٹلوں اور دشمنان اسلام کے لیے ائیر کنڈیشننگ کا کام پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78778، 7 مئی 2009)⁩ کے مطابق اصل کام مباح ہے؛ جنگجویان کے لیے کام جائز نہیں مگر معاہد ممالک کے لیے جائز ہے۔"
