summary:
  ar: "كتاب القاضي عياض بن موسى اليحصبي السبتي (ت 544هـ) في قدر النبي وحقوقه على أمته، رتّبه في أربعة أقسام: تعظيم الله لقدره قولاً وفعلاً وفيه شمائله ومعجزاته، ثم ما يجب على الأنام من الإيمان به وطاعته واتباعه ومحبته وتوقيره والصلاة عليه وزيارة قبره، ثم ما يستحيل في حقه وما يجوز عليه من الأعراض البشرية وهو عنده «سرّ الكتاب»، ثم أحكام من تنقّصه أو سبّه؛ قال ابن العماد إنه لم يُسبق إلى مثله."
  en: "Qadi Iyad ibn Musa al-Yahsubi of Ceuta's (d. 544 AH) book on the Prophet's standing and his rights over his community, arranged in four parts: God's honouring of him in word and deed (with his qualities and miracles); what people owe him — faith, obedience, following, love, reverence, invoking blessings on him and visiting his grave; what is impossible for him and which human states may befall him, which the author calls 'the heart of the book'; and the legal rulings on one who disparages or reviles him. Ibn al-Imad says nothing like it had been written before."
