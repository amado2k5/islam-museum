summary:
  ar: "كتاب القاضي عياض بن موسى اليحصبي السبتي ⁦(ت 544هـ)⁩ في قدر النبي وحقوقه على أمته، رتّبه في أربعة أقسام: تعظيم الله لقدره قولاً وفعلاً وفيه شمائله ومعجزاته، ثم ما يجب على الأنام من الإيمان به وطاعته واتباعه ومحبته وتوقيره والصلاة عليه وزيارة قبره، ثم ما يستحيل في حقه وما يجوز عليه من الأعراض البشرية وهو عنده «سرّ الكتاب»، ثم أحكام من تنقّصه أو سبّه؛ قال ابن العماد إنه لم يُسبق إلى مثله."
  en: "Qadi Iyad ibn Musa al-Yahsubi of Ceuta's (d. 544 AH) book on the Prophet's standing and his rights over his community, arranged in four parts: God's honouring of him in word and deed (with his qualities and miracles); what people owe him — faith, obedience, following, love, reverence, invoking blessings on him and visiting his grave; what is impossible for him and which human states may befall him, which the author calls 'the heart of the book'; and the legal rulings on one who disparages or reviles him. Ibn al-Imad says nothing like it had been written before."
  es: "El libro de Qadi Iyad ibn Musa al-Yahsubi de Ceuta (m. 544 AH) sobre la posición del Profeta y sus derechos sobre su comunidad, está dividido en cuatro partes: el honor que Dios le rinde en palabra y obra (con sus cualidades y milagros); lo que la gente le debe: fe, obediencia, seguimiento, amor, reverencia, invocar bendiciones sobre él y visitar su tumba; lo que le es imposible y los estados humanos que pueden sobrevenirle, que el autor denomina «el corazón del libro»; y las normas legales para quien lo menosprecia o injuria. Ibn al-Imad afirma que no se había escrito nada parecido antes."
  fr: "L'ouvrage du cadi Iyad ibn Musa al-Yahsubi de Ceuta (mort en 544 AH) sur le statut du Prophète et ses droits sur sa communauté est structuré en quatre parties: l'honneur que Dieu lui a rendu en paroles et en actes (à travers ses qualités et ses miracles); les devoirs des hommes envers lui – foi, obéissance, fidélité, amour, respect, invocation de la bénédiction divine et visites à sa tombe; ce qui lui était impossible et les épreuves qu'il pouvait traverser, que l'auteur considère comme le cœur de l'ouvrage; et les sanctions légales infligées à celui qui le dénigre ou l'injurie. Ibn al-Imad affirme qu'un tel ouvrage n'avait jamais été écrit auparavant."
  ur: "سیوٹا ⁦(متوفی 544ھ)⁩ کے قادی ایاد بن موسیٰ یحسوبی کی کتاب رسول اللہ کے مقام اور ان کی امت پر ان کے حقوق کے بارے میں چار حصوں میں ترتیب دی گئی ہے: خدا کی طرف سے قول و فعل میں ⁦(ان کی خوبیوں اور معجزات کے ساتھ)⁩ ان کی تعظیم؛ لوگ اس کے مقروض ہیں - ایمان، اطاعت، پیروی، محبت، تعظیم، اس پر درود بھیجنا اور اس کی قبر کی زیارت؛ اس کے لیے کیا ناممکن ہے اور اس پر کون سی انسانی حالتیں آ سکتی ہیں، جسے مصنف 'کتاب کا دل' کہتا ہے۔ اور اس کے بارے میں قانونی احکام جو اس کی تذلیل کرتا ہے یا اسے برا بھلا کہتا ہے۔ ابن عماد کہتے ہیں کہ اس سے پہلے ایسا کچھ نہیں لکھا گیا تھا۔"
