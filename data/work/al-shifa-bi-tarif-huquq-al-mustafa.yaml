structure: "مقدمة المؤلف (ص8–17 من طبعة دار الكتب العلمية، ترقيم PDF)؛ القسم الأول في تعظيم الله لقدره (ص18–381): الباب الأول ثناء الله عليه (عشرة فصول)، الثاني تكميل محاسنه خَلقاً وخُلقاً (سبعة وعشرون فصلاً)، الثالث ما ورد في عظيم قدره عند ربه (اثنا عشر فصلاً)، الرابع المعجزات (ومنه إعجاز القرآن ص265)؛ القسم الثاني ما يجب على الأنام من حقوقه (ص385–477): الإيمان والطاعة والاتباع، المحبة، التعظيم، الصلاة عليه وزيارة قبره؛ القسم الثالث ما يستحيل في حقه وما يجوز (ص478–593): العصمة، ثم أحواله الدنيوية؛ القسم الرابع أحكام من تنقصه أو سبه (ص594–697) في ثلاثة أبواب، آخرها في ساب الله والأنبياء والملائكة والآل والصحب."
