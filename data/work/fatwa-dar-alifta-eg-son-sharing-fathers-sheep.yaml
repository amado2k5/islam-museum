id: work/fatwa-dar-alifta-eg-son-sharing-fathers-sheep
class: work
kind: fatwa
label: { ar: "حكم اشتراك الولد مع والده في الأضحية بشاة واحدة", en: "A son sharing one sheep with his father for udhiyya", ur: "بیٹے کا باپ کے ساتھ ایک بھیڑ میں قربانی کی شرکت", es: "Un hijo comparte una oveja con su padre para udhiyya", fr: "Un fils partageant un mouton avec son père pour l'udhiyya" }
summary:
  ar: "سائل يرغب في الاشتراك مع والده في الأضحية بشاة واحدة على أن يدفع كل منهما نصف ثمنها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21919)⁩ ببيان حكم هذا الاشتراك على ما فصّل الجواب من أحكام الشياه والبقر والإبل في الأضحية."
  en: "A man wishes to share one sheep with his father for the udhiyya, each paying half its price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21919) answered by setting out the ruling on this sharing within the rules for sheep, cattle and camels in sacrifice, as the answer details."
  ur: "ایک شخص اپنے والد کے ساتھ ایک بھیڑ میں قربانی کرنا چاہتا ہے کہ دونوں نصف نصف قیمت ادا کریں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21919)⁩ نے جواب میں قربانی کے بکری، گائے اور اونٹ کے احکام کی روشنی میں اس شرکت کا حکم بیان کیا۔"
  es: "Un hombre desea compartir una oveja con su padre para el sacrificio ritual (udhiyya), pagando cada uno la mitad de su precio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21919) respondió estableciendo la norma sobre este reparto dentro de las reglas para el sacrificio de ovejas, ganado vacuno y camellos, como se detalla en la respuesta."
  fr: "Un homme souhaite partager un mouton avec son père pour le sacrifice (udhiyya), chacun payant la moitié de son prix. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21919) a rendu sa décision en exposant la règle relative à ce partage, conformément aux règles applicables aux moutons, aux bovins et aux chameaux sacrificiels, comme le précise la réponse."
