label: { ar: "الزواج من أهل الكتاب", en: "Marrying women of the People of the Book — conditions", ur: "اہل کتاب سے نکاح — شرائط", es: "Casarse con mujeres del Pueblo del Libro — condiciones" }
summary:
  ar: "سأل سائل عن حكم الزواج من أهل الكتاب وعند من يكتب عقد النكاح عند مسلم أم عند أحد من أهل الكتاب. أجاب د. إبراهيم الدرملي ⁦(فتوى رقم 21830 بتاريخ 27 نوفمبر 2005)⁩ أن الله أباح الزواج من اليهودية والنصرانية بشرط أن تكون محصنة أي عفيفة عن الزنا وأن تكون الولاية للمسلم عليها، قال تعالى اليوم أحل لكم الطيبات وطعام الذين أوتوا الكتاب حل لكم وطعامكم حل لهم والمحصنات من المؤمنات والمحصنات من الذين أوتوا الكتاب من قبلكم إذا آتيتموهن أجورهن محصنين غير مسافحين، ويكتب العقد عند المسلم لأن العقد عقد إسلامي على ما فصّل."
  en: "A questioner asked the ruling on marrying women of the People of the Book and with whom the marriage contract is written — a Muslim or one of them. Dr. Ibrahim al-Darmali (fatwa no. 21830, 27 November 2005) answered that God permits marriage to a Jewish or Christian woman provided she is chaste — protected from fornication — and the guardianship is the Muslim's over her, per 'today the good things are lawful to you, their food lawful to you and yours to them, and the chaste of the believing women and the chaste of those given the Book before you, when you give them their wages, chaste, not fornicating'; and the contract is written with the Muslim side since the contract is an Islamic one — as the answer details."
  ur: "ایک سائل نے اہل کتاب سے نکاح اور عقد لکھنے والے پوچھا۔ ڈاکٹر ابراہیم الدرملي ⁦(فتویٰ 21830، 27 نومبر 2005)⁩ کے مطابق پاکباز عورت سے نکاح جائز بشرط ولا مسلم کی ہو؛ عقد مسلمان کی طرف لکھا جاتا ہے۔"
  es: "Un consultante preguntó sobre el dictamen relativo al matrimonio con mujeres de la Gente del Libro y con quién se redacta el contrato matrimonial: un musulmán o uno de ellos. El Dr. Ibrahim al-Darmali (fatwa n.º 21830, 27 de noviembre de 2005) respondió que Dios permite el matrimonio con una mujer judía o cristiana siempre que sea casta —protegida de la fornicación— y la tutela sobre ella recaiga en el musulmán, según «hoy os son lícitas las cosas buenas, su comida es lícita para vosotros y la vuestra para ellas, y la castidad de las mujeres creyentes y la castidad de aquellas a quienes se les dio el Libro antes que a vosotros, cuando les paguéis su salario, castas, sin fornicar»; y el contrato se redacta con la parte musulmana, ya que el contrato es islámico, como se detalla en la respuesta."
