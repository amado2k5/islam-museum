label: { ar: "قرار مجمع الفقه الإسلامي الدولي 259 (4/26) بشأن دفع الزيادة في القرض من طرف ثالث وحكم الأجر على خطاب الضمان والاعتماد المستندي", en: "IIFA resolution 259 (4/26) on a third party paying the increase on a loan, and the ruling on a fee for a letter of guarantee and documentary credit", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 259 (4/26): تیسرے فریق کی جانب سے قرض میں اضافے کی ادائیگی، اور خطاب ضمان اور دستاویزی کریڈٹ پر اجرت کا حکم" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩ في موضوعين: دفع الزيادة في القرض من طرف ثالث، وحكم الأجر على خطاب الضمان والاعتماد المستندي. نظر المجمع في قراره السابق رقم 12 ⁦(12/2)⁩ بشأن خطاب الضمان واطلع على البحوث المقدمة، وقرر تأجيل البت في الموضوعين لمزيد من البحث والدراسة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025) on two questions: a third party paying the increase on a loan, and the ruling on charging a fee for a letter of guarantee and documentary credit. After considering its earlier resolution 12 (12/2) on letters of guarantee and reviewing the submitted research, the Academy decided to defer a ruling on both matters for further research and study."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں، دو موضوعات پر: تیسرے فریق کی جانب سے قرض میں اضافے کی ادائیگی، اور خطاب ضمان و دستاویزی کریڈٹ پر اجرت لینے کا حکم۔ اکیڈمی نے خطاب ضمان کے بارے میں اپنی سابقہ قرارداد 12 ⁦(12/2)⁩ پر غور اور پیش کردہ تحقیقات کا جائزہ لینے کے بعد دونوں موضوعات پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرنے کا فیصلہ کیا۔"
