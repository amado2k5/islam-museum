id: work/fatwa-iifa-259-loan-increase-third-party-letter-of-guarantee
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 259 (4/26) بشأن دفع الزيادة في القرض من طرف ثالث وحكم الأجر على خطاب الضمان والاعتماد المستندي", en: "IIFA resolution 259 (4/26) on a third party paying the increase on a loan, and the ruling on a fee for a letter of guarantee and documentary credit", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 259 (4/26): تیسرے فریق کی جانب سے قرض میں اضافے کی ادائیگی، اور خطاب ضمان اور دستاویزی کریڈٹ پر اجرت کا حکم", es: "Resolución 259 (4/26) de la IIFA sobre el pago del incremento de un préstamo por un tercero y la resolución sobre la comisión por una carta de garantía y un crédito documentario.", fr: "Résolution IIFA 259 (4/26) relative à la prise en charge par un tiers de l'augmentation d'un prêt, et décision relative aux frais d'une lettre de garantie et d'un crédit documentaire", tr: "Uluslararası İslami Fiqh Akademisi Kararı 259 (4/26), kredi artışının üçüncü bir taraftan ödenmesi ve teminat mektubu ile belge akreditilerinde ücretlerin belirlenmesine ilişkin", id: "Keputusan International Islamic Fiqh Academy 259 (4/26) mengenai pembayaran kenaikan pinjaman dari pihak ketiga dan keputusan upah berdasarkan surat jaminan dan kredit dokumen" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩ في موضوعين: دفع الزيادة في القرض من طرف ثالث، وحكم الأجر على خطاب الضمان والاعتماد المستندي. نظر المجمع في قراره السابق رقم 12 ⁦(12/2)⁩ بشأن خطاب الضمان واطلع على البحوث المقدمة، وقرر تأجيل البت في الموضوعين لمزيد من البحث والدراسة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025) on two questions: a third party paying the increase on a loan, and the ruling on charging a fee for a letter of guarantee and documentary credit. After considering its earlier resolution 12 (12/2) on letters of guarantee and reviewing the submitted research, the Academy decided to defer a ruling on both matters for further research and study."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں، دو موضوعات پر: تیسرے فریق کی جانب سے قرض میں اضافے کی ادائیگی، اور خطاب ضمان و دستاویزی کریڈٹ پر اجرت لینے کا حکم۔ اکیڈمی نے خطاب ضمان کے بارے میں اپنی سابقہ قرارداد 12 ⁦(12/2)⁩ پر غور اور پیش کردہ تحقیقات کا جائزہ لینے کے بعد دونوں موضوعات پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرنے کا فیصلہ کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 26.ª sesión en Doha (6-10 de Dhu al-Qa'da de 1446, 4-8 de mayo de 2025) sobre dos cuestiones: el pago por parte de un tercero del incremento de un préstamo y la normativa sobre el cobro de una comisión por una carta de garantía y un crédito documentario. Tras examinar su resolución anterior 12 (12/2) sobre cartas de garantía y revisar la investigación presentada, la Academia decidió aplazar la decisión sobre ambos asuntos para realizar más estudios e investigaciones."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 26e session à Doha (6-10 Dhu al-Qa'da 1446, soit 4-8 mai 2025) portant sur deux questions: la prise en charge par un tiers de l'augmentation d'un prêt et la question de la facturation de frais pour une lettre de garantie et un crédit documentaire. Après avoir examiné sa résolution antérieure n° 12 (12/2) relative aux lettres de garantie et étudié les recherches soumises, l'Académie a décidé de reporter sa décision sur ces deux points afin de permettre des recherches et des études complémentaires."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki yirmi altıncı oturumunda (6–10 Dhu al-Qi'dah 1446H, 4–8 Mayıs 2025) iki konuda toplu kararı aldı: kredi artışının üçüncü bir taraftan ödenmesi ve garanti mektubu ile belge akrediti'nin ücret kararı. Akademi, önceki 12 (12/2) sayılı teminat mektubu kararını gözden geçirdi ve sunulan araştırmaları inceledi; her iki konuda da kararın daha ileri araştırma ve çalışma için ertelenmesine karar verdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-26 di Doha (6–10 Dhu al-Qi'dah 1446H, 4–8 Mei 2025) mengenai dua topik: pembayaran kenaikan pinjaman dari pihak ketiga, dan keputusan upah berdasarkan surat jaminan dan kredit dokumenter. Akademi meninjau keputusan sebelumnya No. 12 (12/2) terkait surat jaminan dan meninjau penelitian yang diajukan, serta memutuskan untuk menunda keputusan kedua topik tersebut untuk penelitian dan studi lebih lanjut."
