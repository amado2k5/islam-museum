id: work/fatwa-dar-alifta-eg-delayed-marriage-as-trial
class: work
kind: fatwa
label: { ar: "مدى اعتبار تأخر الزواج لمن يرغب فيه ابتلاء من الله", en: "Is delayed marriage for one who seeks it a trial from God?", ur: "کیا شادی میں دیر اللہ کی آزمائش ہے؟", es: "¿Acaso retrasar el matrimonio para quien lo busca es una prueba de Dios?", fr: "Le mariage tardif, pour celui qui le désire, est-il une épreuve envoyée par Dieu ?", tr: "Evliliği ertelemenin, isteyenler için Tanrı'nın bir sınavı olarak görülmesinin derecesi", id: "Sejauh mana menunda pernikahan dianggap sebagai ujian dari Tuhan bagi mereka yang menginginkannya" }
summary:
  ar: "سائل سأل عن مدى اعتبار تأخر الزواج لمن يرغب فيه ابتلاء من الله. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20905)⁩ أن الزواج سنة النبي التي رغب فيها ونهى عن الإعراض عنها وتأخر الزواج قد يكون ابتلاء على ما فصّل الجواب."
  en: "A questioner asked whether delayed marriage for one who desires it is a trial from God. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20905) answered that marriage is the Prophet's commended sunna from which he forbade turning away, and delay may be a trial — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا شادی چاہنے والے کے لیے شادی کا دیر ہونا اللہ کی آزمائش ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20905)⁩ نے جواب دیا کہ نکاح نبی کی سنت ہے جس سے روگردانی سے منع کیا گیا اور دیر آزمائش ہو سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si el retraso en el matrimonio para quien lo desea constituye una prueba divina. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20905) respondió que el matrimonio es una sunna recomendada por el Profeta, de la cual prohibió apartarse, y que la demora puede ser una prueba, como se detalla en la respuesta."
  fr: "Une personne a demandé si le report d'un mariage, pour celui qui le désire, constituait une épreuve divine. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20905) a répondu que le mariage est une sunna recommandée par le Prophète, à laquelle il est interdit de s'écarter, et que le report peut être une épreuve, comme le précise la réponse."
  tr: "Bir soru soran kişi, gecikmeli evliliğin istenenler için Allah'tan bir sınav olarak kabul edilip edilmediği sorulmuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20905), evliliğin Peygamber'in bir Sünneti olduğunu, kendisinin istediği ve ondan vazgeçmeyi yasakladığını, gecikmiş evliliğin ise bir sınav olabileceğini yanıtlamıştır; bu yanıtta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya bertanya sejauh mana pernikahan yang tertunda dianggap sebagai ujian dari Tuhan bagi mereka yang menginginkannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20905) menjawab bahwa pernikahan adalah Sunnah Nabi yang diinginkan dan dilarang untuk ditinggalkan, dan pernikahan yang tertunda bisa menjadi ujian, seperti yang dijelaskan dalam jawaban."
