label: { ar: "مدى اعتبار تأخر الزواج لمن يرغب فيه ابتلاء من الله", en: "Is delayed marriage for one who seeks it a trial from God?", ur: "کیا شادی میں دیر اللہ کی آزمائش ہے؟" }
summary:
  ar: "سائل سأل عن مدى اعتبار تأخر الزواج لمن يرغب فيه ابتلاء من الله. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20905)⁩ أن الزواج سنة النبي التي رغب فيها ونهى عن الإعراض عنها وتأخر الزواج قد يكون ابتلاء على ما فصّل الجواب."
  en: "A questioner asked whether delayed marriage for one who desires it is a trial from God. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20905) answered that marriage is the Prophet's commended sunna from which he forbade turning away, and delay may be a trial — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا شادی چاہنے والے کے لیے شادی کا دیر ہونا اللہ کی آزمائش ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20905)⁩ نے جواب دیا کہ نکاح نبی کی سنت ہے جس سے روگردانی سے منع کیا گیا اور دیر آزمائش ہو سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
