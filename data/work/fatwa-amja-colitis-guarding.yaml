id: work/fatwa-amja-colitis-guarding
class: work
kind: fatwa
label: { ar: "مرض القولون والتحفظ", en: "Colitis and guarding against discharge", ur: "قولون کا مرض اور احتیاط" }
summary:
  ar: "سأل مريض مصاب بالقولون وحالته متقلبة عما يظهر من بروز الفضلات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80245 بتاريخ 15 أكتوبر 2009)⁩ أنه ينبغي له أن يتحفظ لأن هذا البروز لشيء من الفضلات مظنة ظاهرة وذريعة قريبة لتلويث الملابس والأصل في المسلم أن يتقي الله ما استطاع وسأل الله أن يمسح عليه بيمينه الشافية وأن يجمع له بين الأجر والعافية على ما فصّل الجواب."
  en: "A colitis patient of fluctuating state asked about the protruding of waste-matter. Dr. Salah al-Sawi (fatwa no. 80245, 15 October 2009) answered that he should guard himself, such protrusion being an evident likelihood and a near avenue to soiling the clothes, a Muslim's rule being to fear God as far as he can; he asked God to wipe him with His healing right hand and join reward and health for him — as the answer details."
  ur: "قولون کے مریض کو فضلات کا بروز ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80245، 15 اکتوبر 2009)⁩ کے مطابق تحفظ کرے اور شفا کی دعا — احتیاط پہلی بات ہے۔"
