id: work/fatwa-amja-colitis-guarding
class: work
kind: fatwa
label: { ar: "مرض القولون والتحفظ", en: "Colitis and guarding against discharge", ur: "قولون کا مرض اور احتیاط", es: "Colitis y protección contra la secreción", fr: "Colite et prévention des écoulements", tr: "Kolon hastalığı ve tutulma", id: "Penyakit usus besar dan retensi" }
summary:
  ar: "سأل مريض مصاب بالقولون وحالته متقلبة عما يظهر من بروز الفضلات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80245 بتاريخ 15 أكتوبر 2009)⁩ أنه ينبغي له أن يتحفظ لأن هذا البروز لشيء من الفضلات مظنة ظاهرة وذريعة قريبة لتلويث الملابس والأصل في المسلم أن يتقي الله ما استطاع وسأل الله أن يمسح عليه بيمينه الشافية وأن يجمع له بين الأجر والعافية على ما فصّل الجواب."
  en: "A colitis patient of fluctuating state asked about the protruding of waste-matter. Dr. Salah al-Sawi (fatwa no. 80245, 15 October 2009) answered that he should guard himself, such protrusion being an evident likelihood and a near avenue to soiling the clothes, a Muslim's rule being to fear God as far as he can; he asked God to wipe him with His healing right hand and join reward and health for him — as the answer details."
  ur: "قولون کے مریض کو فضلات کا بروز ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80245، 15 اکتوبر 2009)⁩ کے مطابق تحفظ کرے اور شفا کی دعا — احتیاط پہلی بات ہے۔"
  es: "Un paciente con colitis fluctuante preguntó sobre la protrusión de heces. El Dr. Salah al-Sawi (fatwa n.° 80245, 15 de octubre de 2009) respondió que debía tener cuidado, ya que dicha protrusión era muy probable y una vía directa para ensuciar la ropa; la regla de un musulmán es temer a Dios en la medida de lo posible. El paciente pidió a Dios que lo limpiara con su mano derecha sanadora y le concediera recompensa y salud, como se detalla en la respuesta."
  fr: "Un patient souffrant de colite ulcéreuse, dont les symptômes fluctuaient, s'est interrogé sur les remontées de matières fécales. Le Dr Salah al-Sawi (fatwa n° 80245, 15 octobre 2009) lui a répondu qu'il devait se protéger, car de telles remontées étaient fréquentes et risquaient de souiller ses vêtements. Il a rappelé que le musulman se doit de craindre Dieu autant que possible et a imploré Dieu de le guérir et de lui accorder récompense et santé, comme le précise la réponse."
  tr: "Kolon hastalığı olan ve durumu değişken olan bir hastaya dışkı görünümü soruldu. Dr. Salah Al-Sawy (15 Ekim 2009 tarihli Fetva No. 80245) dikkatli olması gerektiğini, çünkü bazı dışkıların dışarı çıkmasının açık bir varsayım ve kıyafetleri kirletmek için yakın bir bahane olduğunu söyledi. Bir Müslümanın ilkesi, Allah'tan mümkün olduğunca korkmaktır ve Allah'tan sağ eliyle şifa sıvısını silmesini ve cevabında açıklandığı gibi onun için ödül ve iyilik duygusunu birleştirmesini istedi."
  id: "Seorang pasien dengan penyakit usus besar yang kondisinya berubah-ubah ditanya tentang kemunculan feses. Dr. Salah Al-Sawy menjawab (Fatwa No. 80245 tanggal 15 Oktober 2009) bahwa ia harus berhati-hati karena menonjolnya beberapa kotoran ini adalah prasangka yang jelas dan alasan yang cukup untuk mencemari pakaian. Prinsip dalam seorang Muslim adalah takut kepada Allah sebanyak mungkin dan memohon kepada Allah untuk mengusap cairan penyembuhan itu dengan tangan kanannya serta menggabungkan ganjaran dan kesejahteraan untuknya, seperti yang dijelaskan dalam jawaban."
