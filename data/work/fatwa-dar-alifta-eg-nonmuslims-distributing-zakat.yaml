label: { ar: "حكم عمل غير المسلمين في توزيع الزكاة", en: "Non-Muslims working in zakat distribution", ur: "غیر مسلموں کا زکات کی تقسیم میں کام کرنا", es: "Personas no musulmanas trabajando en la distribución del zakat." }
summary:
  ar: "سائل سأل عن عمل غير المسلمين في المؤسسات والجمعيات القائمة على توزيع الزكاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21893)⁩ أنه يجوز عملهم في تلك المؤسسات للإطلاق الوارد في النص الشرعي على ما فصّل الجواب."
  en: "A questioner asked about non-Muslims working in the bodies and associations that distribute zakat. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21893) answered that their working in those institutions is permitted, on the unrestricted wording of the legal text — as the answer details."
  ur: "ایک سائل نے غیر مسلموں کے زکات تقسیم کرنے والے اداروں میں کام کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21893)⁩ نے جواب دیا کہ شرعی نص کی اطلاقیت کی بنا پر ان اداروں میں ان کا کام جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la posibilidad de que personas no musulmanas trabajen en los organismos y asociaciones que distribuyen el zakat. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21893) respondió que su trabajo en dichas instituciones está permitido, según la redacción literal del texto legal, tal como se detalla en la respuesta."
