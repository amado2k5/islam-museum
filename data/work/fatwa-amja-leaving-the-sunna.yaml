id: work/fatwa-amja-leaving-the-sunna
class: work
kind: fatwa
label: { ar: "من السنة ترك السنة", en: "Of the sunna is leaving the sunna — the maxim", ur: "سنت ترک کرنا بھی سنت ہے؟" }
summary:
  ar: "سأل سائل عن قاعدة «من السنة ترك السنة» وصحتها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86827 بتاريخ 7 مايو 2012)⁩ أن هذا القول من التعبيرات المجملة قد يكون صوابًا وقد يكون خطأ بحسب مقصود قائله، فقد يترك المستحب إذا كان في فعله فساد راجح على مصلحته كما ترك بناء الكعبة على قواعد إبراهيم مراعاة لحدثان عهد قريش بالإسلام، واستحب أحمد وغيره أن يدع الإمام ما هو عنده أفضل تألفًا للمأمومين، أما مجرد ترك السنة إذا خالفت مألوف الناس فلا يصح على ما فصّل."
  en: "A questioner asked about the maxim "of the sunna is leaving the sunna" and its soundness. Dr. Salah al-Sawi (fatwa no. 86827, 7 May 2012) answered that the saying is an ambiguous expression, right or wrong by the speaker's intent: a recommended act may be left when doing it carries outweighing corruption — as rebuilding the Ka'ba on Abraham's foundations was left in regard for the Quraysh's recent Islam — and Ahmad and others recommended an imam leave what he deems best to conciliate those he leads; but merely leaving the sunna because it breaks people's habit is invalid, as detailed."
  ur: "ایک سائل نے قاعدہ «سنت چھوڑنا بھی سنت ہے» کی صحت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86827، 7 مئی 2012)⁩ کے مطابق یہ کہاوت اجمالی ہے؛ مستحب اس وقت چھوڑا جا سکتا ہے جب اس کے کرنے میں فساد غالب ہو؛ محض لوگوں کے معمول کے خلاف ہونے پر سنت چھوڑنا درست نہیں۔"
