id: work/fatwa-dar-alifta-eg-how-to-talbiya
class: work
kind: fatwa
label: { ar: "كيفية التلبية ووقتها وفضلها", en: "The talbiya: how, when and its merit", ur: "تلبیہ: کیسے، کب اور اس کا فضل", es: "La talbiya: cómo, cuándo y su mérito", fr: "La talbiya: comment, quand et son mérite", tr: "Dua, zamanı ve erdemi nasıl yerine getirilir", id: "Bagaimana Memenuhi Doa, Waktunya, dan Kebajikannya" }
summary:
  ar: "سائل سأل عن كيفية التلبية ووقتها وفضلها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23922)⁩ أن التلبية عبادة قولية يجهر بها المحرم، وذكر الجواب صيغتها وأوقاتها وفضلها وما يقال قبلها وبعدها على وجه التفصيل."
  en: "A questioner asked about the talbiya — how, when, and its merit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23922) answered that the talbiya is a spoken act of worship that the pilgrim raises aloud; the answer gives its wording, its occasions and its merit, and what is said before and after it, in detail."
  ur: "ایک سائل نے تلبیہ کے بارے میں پوچھا — کیسے، کب اور اس کا فضل۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23922)⁩ نے جواب دیا کہ تلبیہ ایک قولی عبادت ہے جسے محرم بلند آواز سے کہتا ہے؛ جواب میں اس کے الفاظ، اس کے اوقات اور فضل، اور اس سے پہلے اور بعد میں کیا کہا جائے، تفصیل سے بیان ہوا۔"
  es: "Un visitante preguntó acerca de la talbiya: cómo, cuándo y cuál es su mérito. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23922) respondió que la talbiya es un acto de adoración hablado que el peregrino eleva en voz alta; la respuesta detalla su formulación, sus ocasiones y su mérito, así como lo que se dice antes y después de ella."
  fr: "Un pèlerin a posé une question sur la talbiya: comment, quand et quel est son mérite. La Dar al-Ifta d’Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23922) a répondu que la talbiya est une invocation verbale que le pèlerin prononce à haute voix; la réponse détaille sa formulation, les occasions où elle est récitée, son mérite, ainsi que ce qui est dit avant et après."
  tr: "Bir soru soran kişi Talbiye'nin şekli, zamanlaması ve erdemi hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 23922), Talbiye'nin ihramda okuduğu, Talbiye'nin sözlü bir ibadet eylemi olduğunu ve cevabın biçimini, zamanlamalarını, erdemlerini ve öncesi ve sonrası söylenenleri ayrıntılı olarak belirttiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang cara, waktu, dan kebajikan Talbiyah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 23922) menjawab bahwa Talbiyah adalah tindakan ibadah verbal yang dibacakan oleh orang dalam ihram, dan jawabannya merinci bentuk, waktu, kebajikan, serta apa yang diucapkan sebelum dan sesudahnya."
