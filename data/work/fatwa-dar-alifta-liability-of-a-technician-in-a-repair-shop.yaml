id: work/fatwa-dar-alifta-liability-of-a-technician-in-a-repair-shop
class: work
kind: fatwa
label: { ar: "حكم ضمان الفني الذي يعمل في محل صيانة", en: "The liability of a technician working in a repair shop", ur: "مرمت کی دکان میں کام کرنے والے ٹیکنیشن کے ضمان کا حکم" }
summary:
  ar: "سؤال عن صاحب محل لتصليح أجهزة الكمبيوتر طلب من فني يعمل عنده إصلاح جهاز أحد العملاء فتلفت أثناء الإصلاح لوحة التحكم الداخلية وبعض القطع، وسأل عمن يتحمل الخسائر، أجابت فيه دار الإفتاء المصرية بأن الفني في علاقته بصاحب المحل أجير خاص لأنه يختص بالعمل عنده في وقت الدوام، وحكمه أنه لا يضمن ما تلف بين يديه إلا بالتعدي أو التفريط، فإن تعدى المتعارف عليه من الفنيات المستقرة أو فرّط ولم يحتط ضمن ما تلف لصاحب المحل، وإلا فلا ضمان عليه، والقول بحصول التعدي أو التفريط يُرجع فيه إلى أهل الخبرة. كيّفت الدار المعاملة بأنها إجارة بين ثلاثة أطراف: العميل المستأجر، وصاحب المحل الأجير المشترك الذي يعمل لجماعة من الناس ويضمن بالعقد ما تلف من أجهزة العملاء بفعله أو بفعل عماله، والفني الأجير الخاص الذي لا يضمن إلا بالتعدي أو التفريط، ونقلت نصوص الكاساني وابن مازه والمدونة والدردير والرملي وابن قدامة والبهوتي على عدم تضمين الأجير الخاص بلا تعدٍّ، ونصوص ابن شاس والمرداوي والبعلي على أن ما تلف في يد الأجير الخاص عند الأجير المشترك يضمنه المشترك لربه، وعللت الفرق بأن الأجير المشترك يضمن بالعقد لا بالإتلاف، كما نصت عليه مجلة الأحكام العدلية."
  en: "A question from the owner of a computer repair shop who asked a technician working for him to repair a customer's device; during the repair the internal control board and some other parts were damaged, causing large losses, and he asked who bears them. Dar al-Ifta al-Misriyya answered that the technician, in his relationship with the shop owner, is a private hireling, since he works exclusively for him during working hours, and his rule is that he is not liable for what is damaged in his hands except through transgression or negligence: if he departed from the established practices of the trade or was careless and took no precautions, he is liable to the shop owner for what was damaged, otherwise he bears no liability, and whether transgression or negligence occurred is referred to people of expertise. Dar al-Ifta characterised the transaction as a hire among three parties: the customer who hires, the shop owner who is a common hireling working for the public and liable by contract for customers' devices damaged by his own act or that of his workers, and the technician who is a private hireling liable only for transgression or negligence; it quoted al-Kasani, Ibn Maza, al-Mudawwana, al-Dardir, al-Ramli, Ibn Qudama and al-Buhuti on the private hireling's non-liability without transgression, and Ibn Shas, al-Mardawi and al-Ba'li on the common hireling's liability to the owner for what is damaged in the hands of his private hireling, explaining the difference by the fact that the common hireling is liable by the contract, not by the act of damage, as the Ottoman Majalla also states."
  ur: "کمپیوٹر مرمت کی دکان کے مالک کا سوال جس نے اپنے پاس کام کرنے والے ٹیکنیشن کو ایک گاہک کا آلہ ٹھیک کرنے کو کہا؛ مرمت کے دوران اندرونی کنٹرول بورڈ اور کچھ دیگر پرزے خراب ہو گئے جس سے بڑا نقصان ہوا، اور اس نے پوچھا کہ یہ نقصان کون اٹھائے گا۔ دار الافتاء مصر نے جواب دیا کہ ٹیکنیشن دکان کے مالک کے ساتھ اپنے تعلق میں اجیرِ خاص ہے کیونکہ وہ کام کے اوقات میں صرف اس کے لیے کام کرتا ہے، اور اس کا حکم یہ ہے کہ وہ اپنے ہاتھ میں خراب ہونے والی چیز کا ضامن نہیں سوائے زیادتی یا غفلت کی صورت میں: اگر اس نے پیشے کے مستقر طریقوں سے تجاوز کیا یا غفلت کی اور احتیاط نہ کی تو وہ دکان کے مالک کے لیے خراب شدہ چیز کا ضامن ہے، ورنہ اس پر کوئی ضمان نہیں، اور زیادتی یا غفلت کے واقع ہونے کا فیصلہ اہلِ خبرہ کی طرف رجوع سے ہوتا ہے۔ دار الافتاء نے معاملے کو تین فریقوں کے درمیان اجارہ قرار دیا: گاہک جو اجرت پر لیتا ہے، دکان کا مالک جو اجیرِ مشترک ہے، عام لوگوں کے لیے کام کرتا ہے اور اپنے یا اپنے کارکنوں کے فعل سے خراب ہونے والے گاہکوں کے آلات کا عقد کی بنا پر ضامن ہے، اور ٹیکنیشن جو اجیرِ خاص ہے اور صرف زیادتی یا غفلت پر ضامن ہے؛ اس نے کاسانی، ابن مازہ، المدونہ، دردیر، رملی، ابن قدامہ اور بہوتی کی عبارتیں اجیرِ خاص کے بلا زیادتی ضامن نہ ہونے پر، اور ابن شاس، مرداوی اور بعلی کی عبارتیں اس پر نقل کیں کہ اجیرِ مشترک کے پاس اجیرِ خاص کے ہاتھ میں خراب ہونے والی چیز کا مالک کے لیے ضامن اجیرِ مشترک ہے، اور فرق کی وجہ یہ بتائی کہ اجیرِ مشترک عقد سے ضامن ہے نہ کہ اتلاف سے، جیسا کہ مجلۃ الاحکام العدلیہ میں بھی ہے۔"
