summary:
  ar: "كتاب في الكيمياء والأسرار ينسب إلى محمد بن زكريا الرازي ⁦(ت 313هـ/925م)⁩، ترد فيه إشارات إلى تقطير النفط إلى سائل صافٍ صالح للإضاءة وإلى مصابيح النافذة؛ ويعتمد هذا السجل على روايات ثانوية من تاريخ النفط لبيان محتواه."
  en: "A book on chemistry and secrets ascribed to Muhammad ibn Zakariya al-Razi (d. 313 AH/925 CE), containing material on distilling petroleum and on petroleum lamps; the record relies on secondary oil-history accounts of its contents."
  ur: "کیمیا اور اسرار کی کتاب جو محمد بن زکریا رازی ⁦(وفات 313ھ/925ء)⁩ سے منسوب ہے، جس میں تیل کے کشید کرنے اور تیل کے چراغوں کا ذکر ہے؛ اس کا مواد ثانوی تیل کی تاریخ کے بیان سے لیا گیا ہے۔"
  es: "Un libro sobre química y secretos atribuido a Muhammad ibn Zakariya al-Razi (m. 313 AH/925 CE), que contiene material sobre la destilación del petróleo y sobre lámparas de petróleo; el registro se basa en relatos secundarios de la historia del petróleo sobre su contenido."
  fr: "Un livre sur la chimie et les secrets attribué à Muhammad ibn Zakariya al-Razi (mort en 313 AH/925 CE), contenant des informations sur la distillation du pétrole et sur les lampes à pétrole; le document s'appuie sur des récits secondaires d'histoire du pétrole concernant son contenu."
  tr: "Muhammed bin Zekeriye el-Razi'ye (ö. 313 Hicri / 925 M.S.) atfedilen kimya ve gizemler üzerine bir kitap; burada yağın aydınlatmaya ve pencere lambalarına uygun berrak bir sıvıya damıtılmasına atıfta bulunulur; bu kayıt, içeriğini netleştirmek için petrol tarihinden ikincil kaynaklara dayanır."
  id: "Sebuah buku tentang kimia dan misteri yang dikaitkan dengan Muhammad ibn Zakariya al-Razi (wafat 313 H / 925 M), di mana disebutkan tentang menyuling minyak menjadi cairan bening yang cocok untuk penerangan dan lampu jendela; catatan ini mengandalkan catatan sekunder dari sejarah minyak untuk memperjelas isinya."
