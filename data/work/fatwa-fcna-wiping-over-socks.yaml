label: { ar: "المسح على الجوارب", en: "Wiping Over Socks", ur: "جرابوں پر مسح", es: "Limpiarse los calcetines", fr: "Essuyer les chaussettes" }
summary:
  ar: "ورقة للشيخ مصطفى عمر في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت نوفمبر 2021)⁩ تشرح حكم المسح على الجوارب في الوضوء وتبين خطأ ظن أن نصوص القرآن والحديث واضحة لكل قارئ دون تأهيل على ما فصّلته الورقة."
  en: "A paper by Shaykh Mustafa Umar on the Fiqh Council of North America site (published November 2021) explaining the ruling on wiping over socks in wudu, and correcting the misconception that Qur'an and hadith texts are plain to any literate reader — as the paper details."
  ur: "شیخ مصطفیٰ عمر کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ وضو میں جرابوں پر مسح کے حکم اور نصوص کی فهم کے اہل ہونے کے بارے میں — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del jeque Mustafa Umar publicado en el sitio web del Consejo de Fiqh de Norteamérica (en noviembre de 2021) explica la norma sobre frotar los calcetines durante la ablución y corrige la idea errónea de que los textos del Corán y los hadices son comprensibles para cualquier lector letrado, tal como se detalla en el artículo."
  fr: "Un article du cheikh Mustafa Umar sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publié en novembre 2021) explique la règle concernant le fait de s'essuyer les chaussettes lors des ablutions et corrige l'idée fausse selon laquelle les textes du Coran et des hadiths sont clairs pour tout lecteur instruit, comme le détaille l'article."
