label: { ar: "صلوات ماضية على توقيت خاطئ", en: "Past prayers on a mistaken timetable — valid for the effort made", ur: "غلط وقت پر گزری نمازیں — کوشش پر درست" }
summary:
  ar: "سأل مسلمون في مدينة إدمنتون بألبرتا الكندية عن مسألة تتعلق بمواقيت الصلاة السابقة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87506 بتاريخ 28 سبتمبر 2012)⁩ أن ما كان صلاة ماضية استفرغوا في تحديد مواقيتها الوسع وبذلوا في ذلك الجهد فهي صلاة صحيحة بإذن الله سواء وافقت التوقيت الصحيح في الواقع أم لا على ما فصّل الجواب."
  en: "Muslims in Edmonton, Alberta asked about prayers already performed on locally calculated times. AMJA's fatwa committee (fatwa no. 87506, 28 September 2012) answered that past prayers whose times they exhausted their means to fix and strove over are sound God willing, whether they matched the real time or not — as the answer details."
  ur: "مقامی اوقات پر پڑھی نمازیں؟ لجنة الفتوى ⁦(فتویٰ 87506، 28 ستمبر 2012)⁩ کے مطابق پوری کوشش کی ہو تو درست — وقت ملے یا نہ ملے۔"
