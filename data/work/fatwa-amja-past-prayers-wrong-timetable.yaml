label: { ar: "صلوات ماضية على توقيت خاطئ", en: "Past prayers on a mistaken timetable — valid for the effort made", ur: "غلط وقت پر گزری نمازیں — کوشش پر درست", es: "Oraciones pasadas en un horario erróneo: válidas por el esfuerzo realizado.", fr: "Prières passées selon un calendrier erroné — valables pour l'effort fourni", tr: "Dualar yanlış zamanda geçti", id: "Doa yang diucapkan pada waktu yang salah" }
summary:
  ar: "سأل مسلمون في مدينة إدمنتون بألبرتا الكندية عن مسألة تتعلق بمواقيت الصلاة السابقة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87506 بتاريخ 28 سبتمبر 2012)⁩ أن ما كان صلاة ماضية استفرغوا في تحديد مواقيتها الوسع وبذلوا في ذلك الجهد فهي صلاة صحيحة بإذن الله سواء وافقت التوقيت الصحيح في الواقع أم لا على ما فصّل الجواب."
  en: "Muslims in Edmonton, Alberta asked about prayers already performed on locally calculated times. AMJA's fatwa committee (fatwa no. 87506, 28 September 2012) answered that past prayers whose times they exhausted their means to fix and strove over are sound God willing, whether they matched the real time or not — as the answer details."
  ur: "مقامی اوقات پر پڑھی نمازیں؟ لجنة الفتوى ⁦(فتویٰ 87506، 28 ستمبر 2012)⁩ کے مطابق پوری کوشش کی ہو تو درست — وقت ملے یا نہ ملے۔"
  es: "Los musulmanes de Edmonton, Alberta, preguntaron sobre las oraciones ya realizadas en horarios calculados localmente. El comité de fatuas de AMJA (fatua n.° 87506, 28 de septiembre de 2012) respondió que las oraciones pasadas, cuyos horarios se esforzaron al máximo por fijar, son válidas si Dios quiere, independientemente de si coincidieron o no con la hora real, como se detalla en la respuesta."
  fr: "Des musulmans d'Edmonton, en Alberta, ont posé une question concernant les prières déjà accomplies à des heures calculées localement. Le comité des fatwas de l'AMJA (fatwa n° 87506, 28 septembre 2012) a répondu que les prières passées, dont ils avaient épuisé tous les moyens pour déterminer les heures et s'y être efforcés, sont valides, si Dieu le veut, qu'elles correspondent ou non à l'heure réelle — comme le précise la réponse."
  tr: "Kanada'nın Alberta eyaletindeki Edmonton'daki Müslümanlar, önceki namaz vakitleriyle ilgili bir konuyu sordular. Amerikan Şeriat Hukukçuları Konseyi Fetva Komitesi (28 Eylül 2012 tarihli Fetva No. 87506), önceki namazın zamanlamasını belirlemek için çalıştıkları ve çaba gösterdikleri her neyse, bunun geçerli bir namaz olduğunu, gerçek zamanlamayla eşleşip örtüşmemesine bakmaksızın yanıtında belirtti."
  id: "Muslim di Edmonton, Alberta, Kanada, menanyakan tentang isu yang berkaitan dengan waktu salat sebelumnya. Komite Fatwa Dewan Syariah Amerika (Fatwa No. 87506 tanggal 28 September 2012) menanggapi bahwa apapun doa masa lalu yang mereka habiskan dan berusaha keras menentukan waktunya, itu adalah doa yang sah, jika Tuhan menghendaki, baik sesuai dengan waktu sebenarnya maupun tidak, seperti yang dijelaskan dalam jawaban."
