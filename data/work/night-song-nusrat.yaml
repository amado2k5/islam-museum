summary:
  ar: "ألبوم مشترك لنصرت فتح علي خان ومايكل بروك، سُجّل في استوديوهات ريل وورلد سنة 1995 وصدر في 20 فبراير 1996، وهو آخر ألبوم له عن الشركة في حياته؛ يجمع صوت القوالي بإنتاج بروك المحيطي وبموسيقيين سنغاليين، وبلغ المرتبة الرابعة في قائمة بيلبورد للموسيقى العالمية، ورُشّح لجائزة غرامي لأفضل ألبوم موسيقى عالمية سنة 1997."
  en: "A joint album of Nusrat Fateh Ali Khan and Michael Brook, recorded at Real World Studios in 1995 and released on 20 February 1996, his last album on the label in his lifetime; it joins qawwali vocals to Brook's ambient production and Senegalese musicians, reached number 4 on Billboard's world albums chart and was nominated for the 1997 Grammy for Best World Music Album."
  ur: "نصرت فتح علی خان اور مائیکل بروک کا مشترکہ البم، جو 1995 میں ریئل ورلڈ اسٹوڈیوز میں ریکارڈ ہوا اور 20 فروری 1996 کو جاری ہوا؛ یہ بل بورڈ کے عالمی البمز میں چوتھے نمبر تک پہنچا اور 1997 کے گریمی کے لیے نامزد ہوا۔"
