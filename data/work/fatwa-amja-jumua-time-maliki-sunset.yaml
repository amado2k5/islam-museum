label: { ar: "آخر وقت الجمعة عند المالكية", en: "A late Jumu'a for schoolchildren — the Maliki sunset boundary", ur: "بچوں کی دیر کا جمعہ — مالکی غروب", es: "Un Jumu'a tardío para los escolares: el límite de la puesta de sol de Maliki" }
summary:
  ar: "سأل سائل أنهم يقيمون حاليًا صلاة جمعة للأولاد الصغار في وقت متأخر. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87510 بتاريخ 29 سبتمبر 2012)⁩ أن للمالكية مذهبًا في آخر وقت الجمعة وهو أنه يمتد إلى غروب الشمس ناقلة من المدونة نصه على ما فصّل الجواب من خلاف الأئمة في ابتداء الوقت وانتهائه."
  en: "A questioner said they currently hold a Jumu'a for young children at a late hour. AMJA's fatwa committee (fatwa no. 87510, 29 September 2012) answered that the Malikis hold a doctrine on Jumu'a's last time — that it extends to sunset — quoting the Mudawwana's text, as the answer details the imams' difference over the time's beginning and end."
  ur: "دیر کا جمعہ؟ لجنة الفتوى ⁦(فتویٰ 87510، 29 ستمبر 2012)⁩ کے مطابق مالکیوں میں آخری وقت غروب آفتاب — مدونہ کا نص منقول۔"
  es: "Un interlocutor preguntó si actualmente celebran la oración del viernes (Jumu'a) para niños pequeños a altas horas de la noche. El comité de fatwas de AMJA (fatwa n.º 87510, 29 de septiembre de 2012) respondió que los malikíes sostienen una doctrina sobre la última hora de la oración del viernes (Jumu'a), que se extiende hasta la puesta del sol, citando el texto del Mudawwana, ya que la respuesta detalla la diferencia de opinión entre los imanes sobre el inicio y el final de dicha hora."
