  ar: "شرح ابن حجر العسقلاني على صحيح البخاري، من أوسع شروحه: يجمع فيه شرح الألفاظ والأسانيد وفقه الأحاديث وأقوال العلماء."
  en: "Ibn Hajar al-Asqalani's commentary on Sahih al-Bukhari, among the fullest such commentaries, covering vocabulary, chains, the jurisprudence of each hadith and the views of scholars."
  es: "El comentario de Ibn Hajar al-Asqalani sobre Sahih al-Bukhari, uno de los comentarios más completos de este tipo, abarca el vocabulario, las cadenas de transmisión, la jurisprudencia de cada hadiz y las opiniones de los eruditos."
  fr: "Le commentaire d'Ibn Hajar al-Asqalani sur le Sahih al-Bukhari est l'un des commentaires les plus complets de ce type, couvrant le vocabulaire, les chaînes de transmission, la jurisprudence de chaque hadith et les opinions des savants."
