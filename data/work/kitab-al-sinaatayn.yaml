  ar: "كتاب الصناعتين، كتاب في البلاغة لمؤلفه أبو هلال العسكري، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نشط نحو 395هـ / 1005م {cite:wikipedia-ar-abu-hilal-al-askari}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book 23787 {cite:shamela-ws-book-23787}. لم يقرأ المتحف الكتاب."
  en: "Kitab al-Sinaatayn, a book on rhetoric (balagha) by Abu Hilal al-Askari; its date in a research summary supplied to the museum is active c. 395 AH / 1005 CE {cite:wikipedia-ar-abu-hilal-al-askari}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book 23787 {cite:shamela-ws-book-23787}. The museum has not read the book."
  ur: "كتاب الصناعتين، بلاغت پر ایک کتاب، مصنف أبو هلال العسكري؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: سرگرم تقریباً 395ھ / 1005ء {cite:wikipedia-ar-abu-hilal-al-askari}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book 23787 {cite:shamela-ws-book-23787}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Kitab al-Sinaatayn, livre sur la rhétorique (balagha) de Abu Hilal al-Askari ; sa date dans une synthèse de recherche remise au musée : actif vers 395 H / 1005 {cite:wikipedia-ar-abu-hilal-al-askari}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book 23787 {cite:shamela-ws-book-23787}. Le musée n'a pas lu le livre."
  es: "Kitab al-Sinaatayn, libro sobre retórica (balagha) de Abu Hilal al-Askari; su fecha en un resumen de investigación entregado al museo: activo hacia 395 H. / 1005 {cite:wikipedia-ar-abu-hilal-al-askari}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book 23787 {cite:shamela-ws-book-23787}. El museo no ha leído el libro."
