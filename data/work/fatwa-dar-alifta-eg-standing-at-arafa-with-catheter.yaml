id: work/fatwa-dar-alifta-eg-standing-at-arafa-with-catheter
class: work
kind: fatwa
label: { ar: "حكم الوقوف بعرفة للمريض حامل قسطرة البول", en: "Standing at Arafat for a patient carrying a urinary catheter", ur: "پیشاب کے تھیلے والے مریض کا عرفہ میں وقوف", es: "De pie en Arafat para un paciente con un catéter urinario.", fr: "En attente à Arafat pour un patient porteur d'une sonde urinaire" }
summary:
  ar: "سائل سأل عن وقوف مريض بعرفة وهو حامل لقسطرة بولية يخرج فيها البول مستمرًّا ويجتمع في كيسها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20770)⁩ ببيان حكم وقوفه على وجهه."
  en: "A questioner asked about standing at Arafat for a patient carrying a urinary catheter through which urine flows continually into its bag. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20770) answered by setting out the ruling on his standing."
  ur: "ایک سائل نے اس مریض کا عرفہ میں وقوف کا حکم پوچھا جو پیشاب کا تھیلا لگائے ہو اور جس میں مسلسل پیشاب خارج ہوتا رہتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20770)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre la posibilidad de que un paciente con un catéter urinario, a través del cual la orina fluye continuamente hacia una bolsa, pudiera permanecer en Arafat. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20770) respondió exponiendo la normativa al respecto."
  fr: "Un internaute a demandé si un patient porteur d'une sonde urinaire, dont l'urine s'écoule en continu dans une poche, pouvait se tenir debout à Arafat. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20770) a répondu en énonçant la règle à ce sujet."
