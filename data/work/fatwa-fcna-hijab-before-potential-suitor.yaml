label: { ar: "هل تخلع المرأة حجابها أمام الخاطب المحتمل؟", en: "Can a woman take her hijab off in front of a potential suitor?", ur: "کیا عورت ممکنہ خواستگار کے سامنے حجاب اتار سکتی ہے؟", es: "¿Puede una mujer quitarse el hiyab delante de un posible pretendiente?", fr: "Une femme peut-elle retirer son hijab devant un prétendant potentiel ?" }
summary:
  ar: "سؤال عما إذا كانت المرأة تكشف شعرها أمام الخاطب المحتمل. أجاب الدكتور ياسر قاضي في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر 23 يناير 2024)⁩ أن جمهور العلماء من الشافعية والمالكية والحنفية على أن المرأة لا تكشف شعرها أمام الخاطب على ما فصّل الجواب من الخلاف."
  en: "A question about whether a woman may uncover her hair before a potential suitor. Dr. Yasir Qadhi answered on the Fiqh Council of North America site (published 23 January 2024) that the majority — Shafi'i, Maliki and Hanafi — hold she should not, with the disagreement set out in the answer."
  ur: "کیا عورت ممکنہ خواستگار کے سامنے بال کھول سکتی ہے؟ ڈاکٹر یاسر قاضی نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ 23 جنوری 2024)⁩ جواب دیا کہ اکثریت — شافعی مالکی حنفی — کے نزدیک نہیں کھول سکتی، اختلاف جواب میں ہے۔"
  es: "Una pregunta sobre si una mujer puede descubrirse el cabello ante un posible pretendiente. El Dr. Yasir Qadhi respondió en el sitio web del Consejo de Fiqh de Norteamérica (publicado el 23 de enero de 2024) que la mayoría —Shafi'i, Maliki y Hanafi— sostiene que no debería, y la discrepancia se expone en la respuesta."
  fr: "La question de savoir si une femme peut découvrir ses cheveux devant un prétendant potentiel a été posée. Le Dr Yasir Qadhi a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication du 23 janvier 2024) que la majorité — les écoles chaféite, malikite et hanafite — estiment qu'elle ne le devrait pas, en exposant les divergences dans sa réponse."
