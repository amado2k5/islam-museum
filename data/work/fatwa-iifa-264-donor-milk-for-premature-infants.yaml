id: work/fatwa-iifa-264-donor-milk-for-premature-infants
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 264 (9/26) بشأن إرضاع الأطفال الخدج من متبرعات معلومات ومجهولات", en: "IIFA resolution 264 (9/26) on feeding premature infants with milk from known and unknown donors", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 264 (9/26): قبل از وقت پیدا ہونے والے بچوں کو معلوم و نامعلوم عطیہ دہندگان کا دودھ پلانا" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في إرضاع الأطفال الخدج بألبان متبرعات، يوازن بين حاجة الطفل وحفظ أحكام المحرمية. أكد المجمع قراره رقم 6 (6/2) بشأن بنوك الحليب، وعرّف الرضاعة بأنها وصول لبن امرأة إلى جوف طفل في سنتيه الأوليين، بالمص من الثدي أو بصبه في الفم أو الأنف. وعرّف الطفل الخديج بأنه من وُلد قبل أن يبلغ الحمل سبعة وثلاثين أسبوعًا، وقرر أن إرضاع الطفل واجب على ذويه ويتأكد في حق الخديج لحاجته، فتجب العناية بالوسائل المشروعة لإرضاعه. وأجاز للمتبرعات اشتراط عدم نشر معلومات عنهن مع وجوب الوفاء بذلك، وأوجب على الشركات التي تصنع أدوية من ألبان متبرعات للخدج أن تمكّن ذويهم من معرفة المتبرعات حفظًا للمحرمية، ودعا الجهات المعنية إلى سن تشريعات منظمة للتبرع وأوصى السلطات الصحية بتشجيع مبادرات الاسترضاع."
  en: "A collective resolution of the International Islamic Fiqh Academy on feeding premature infants with donated breast milk, weighing the infant's need against the rules of milk kinship. The Academy reaffirmed its resolution 6 (6/2) on milk banks, and defined suckling as a woman's milk reaching the stomach of a child in its first two years, whether from the breast or poured into the mouth or nose. It defined a premature infant as one born before the thirty-seventh week of pregnancy, and resolved that feeding a child is a duty on its family that is stronger still for a premature child because of its need, so the lawful means of feeding it must be attended to. It allowed donors to stipulate that no information about them be published, a condition that must be honoured; required companies making medicines from donor milk for premature infants to let the infants' families know who the donors are, to preserve the rules of kinship; called on the authorities to regulate milk donation; and recommended that health authorities encourage wet-nursing initiatives."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جو قبل از وقت پیدا ہونے والے بچوں کو عطیہ کردہ ماں کے دودھ سے متعلق ہے اور بچے کی ضرورت اور رضاعی محرمیت کے احکام میں توازن رکھتی ہے۔ اکیڈمی نے دودھ بینکوں سے متعلق اپنی قرارداد 6 (6/2) کی توثیق کی، اور رضاعت کی تعریف یہ کی کہ عورت کا دودھ دو سال تک کے بچے کے پیٹ میں پہنچے، خواہ پستان سے چوس کر یا منہ یا ناک میں ڈال کر۔ اس نے قبل از وقت بچے کی تعریف ایسے بچے سے کی جو حمل کے سینتیسویں ہفتے سے پہلے پیدا ہو، اور طے کیا کہ بچے کو دودھ پلانا اس کے گھر والوں پر واجب ہے اور ایسے بچے کے حق میں ضرورت کی وجہ سے اور زیادہ مؤکد ہے، اس لیے دودھ پلانے کے جائز ذرائع کا اہتمام ضروری ہے۔ اس نے عطیہ دہندگان کو یہ شرط رکھنے کی اجازت دی کہ ان کی معلومات شائع نہ ہوں اور اس کی پابندی لازم کی؛ عطیہ کردہ دودھ سے دوائیں بنانے والی کمپنیوں پر لازم کیا کہ بچوں کے گھر والوں کو عطیہ دہندگان کی پہچان کا موقع دیں تاکہ محرمیت محفوظ رہے؛ متعلقہ اداروں سے عطیے کے ضابطہ جاتی قوانین بنانے کو کہا؛ اور صحت کے حکام کو رضاعت کے اقدامات کی حوصلہ افزائی کی سفارش کی۔"
