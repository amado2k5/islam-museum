id: work/fatwa-dar-alifta-eg-zulm-in-yunus-dua
class: work
kind: fatwa
label: { ar: "معنى الظلم في دعاء سيدنا يونس", en: "The meaning of 'wrongdoing' in the supplication of Yunus", ur: "یونس کی دعا میں 'ظلم' کا معنی", es: "El significado de \"mala acción\" en la súplica de Yunus", fr: "La signification du terme « méfait » dans la supplication de Yunus", tr: "Ustamız Yunus'un duasında adaletsizliğin anlamı", id: "Makna ketidakadilan dalam doa guru kita Yunus" }
summary:
  ar: "سائل سأل عن معنى الظلم الوارد في دعاء سيدنا يونس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21661)⁩ أن معنى الظلم في دعائه محمول على معان تليق بمقام النبوة العظيم وبيّن الجواب تلك المعاني على وجهه."
  en: "A questioner asked the meaning of 'wrongdoing' in the supplication of the prophet Yunus. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21661) answered that the word is carried upon meanings befitting the great station of prophethood, which the answer sets out."
  ur: "ایک سائل نے نبی یونس کی دعا میں 'ظلم' کے معنی پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21661)⁩ نے جواب دیا کہ اس لفظ کے وہ معانی لیے جاتے ہیں جو نبوت کے عظیم مقام کے شایاں ہیں — جواب میں وہ معانی بیان ہوئے۔"
  es: "Un consultante preguntó por el significado de \"mala acción\" en la súplica del profeta Yunus. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21661) respondió que la palabra conlleva significados propios de la elevada posición de la profecía, tal como se expone en la respuesta."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21661) sur la signification du terme « méfait » dans l'invocation du prophète Jonas. Il a été répondu que ce mot revêtait des significations conformes à la haute fonction prophétique, telles qu'exposées dans la réponse."
  tr: "Bir soru soran kişi, efendimiz Yunus'un duasında bahsedilen adaletsizliğin anlamı hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21661), duasında adaletsizliğin anlamının peygamberliğin büyük statüsüne uygun anlamlarla yorumlandığını ve cevabın bu anlamları yüzeyde netleştirdiğini söyledi."
  id: "Seorang penanya bertanya tentang makna ketidakadilan yang disebutkan dalam doa guru kita Yunus. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21661) menjawab bahwa makna ketidakadilan dalam doanya ditafsirkan dengan makna yang sesuai dengan status besar kenabian, dan jawaban itu menjelaskan makna tersebut secara langsung."
