summary:
  ar: "نخبة الفكر في مصطلح أهل الأثر لابن حجر العسقلاني ⁦(ت. 852هـ)⁩ نثرية جمعت قواعد علم الحديث في قليل من الأوراق؛ شرحها المؤلف بنفسه «نزهة النظر» وهي متن المتوسطين في المصطلح {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Nukhbat al-Fikar in the terminology of the hadith folk by Ibn Hajar al-Asqalani (d. 852 AH) — a few pages of prose gathering the rules of hadith science; the author commented it himself in 'Nuzhat al-Nazar', the intermediate mustalah text {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Nukhbat al-Fikar en la terminología popular de los hadices por Ibn Hajar al-Asqalani (m. 852 d. H.): unas pocas páginas de prosa que recopilan las reglas de la ciencia del hadiz; el autor lo comentó él mismo en 'Nuzhat al-Nazar', el texto intermedio de mustalah {citar:al-mutun-al-ilmiyya-azhar} {citar:al-aalam}."
  fr: "Nukhbat al-Fikar dans la terminologie du folklore des hadiths par Ibn Hajar al-Asqalani (mort en 852 AH) — quelques pages de prose rassemblant les règles de la science des hadiths; l'auteur l'a commenté lui-même dans 'Nuzhat al-Nazar', le texte intermédiaire de la mustalah {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "ابن حجر العسقلانی ⁦(متوفی 852ھ)⁩ کی حدیث کی اصطلاح میں نخبۃ الفکر - علم حدیث کے قواعد کو جمع کرنے والے نثر کے چند صفحات؛ مصنف نے خود اس کا تبصرہ 'نزہت النظر' میں کیا ہے، جو کہ درمیانی مصلح متن {حوالہ: المتون العلمیہ ازہر} {حوالہ: العالم} ہے۔"
  tr: "Nukhbat al-Fikr fi Mustal Ahl al-Athar, İbn Hajar al-Asqalani (ö. 852 H) tarafından yazılmış, hadis biliminin kurallarını birkaç sayfada derleyen bir düzyazı eserdir; yazar kendisi bunu \"Nuzhat al-Nazar\" olarak açıklamıştır; bu, ara alimlerin {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam} terminolojisindeki metnidir."
  id: "Nukhbat al-Fikr fi Mustal Ahl al-Athar oleh Ibn Hajar al-Asqalani (wafat 852 H) adalah sebuah karya prosa yang merumuskan aturan ilmu hadits dalam beberapa halaman; penulis sendiri menjelaskannya sebagai \"Nuzhat al-Nazar,\" yang merupakan teks para ulama perantara dalam terminologi {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
