label: { ar: "قرار مجمع الفقه الإسلامي الدولي 252 (25/14) بشأن دور آليات التمويل الاجتماعي الإسلامي في دعم العمل الإنساني في مناطق الصراعات والنزاعات والكوارث ودور النهوض بثقافة التطوع لتعزيز العمل الإسلامي المشترك", en: "IIFA resolution 252 (25/14) on the role of Islamic social finance instruments in supporting humanitarian work in regions of conflict, strife and disaster, and on advancing a culture of volunteering", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 252 (25/14): تنازعوں، جھگڑوں اور آفات کے علاقوں میں انسانی کارروائی کی حمایت میں اسلامی سماجی مالیات کے اوزاروں کا کردار اور رضاکارانہ ثقافت کی تعمیر", es: "Resolución 252 (25/14) de la IIFA sobre el papel de los instrumentos de financiación social islámica en el apoyo a la labor humanitaria en regiones de conflicto, disturbios y desastres, y sobre el fomento de una cultura de voluntariado.", fr: "résolution 252 (25/14) de l'IIFA sur le rôle des instruments de finance sociale islamique dans le soutien à l'action humanitaire dans les régions de conflit, de troubles et de catastrophes, et sur la promotion d'une culture du bénévolat", tr: "Uluslararası İslami Fiqh Akademisi Kararı 252 (25/14), çatışma, çatışma ve afet bölgelerinde insani çalışmaları desteklemede İslami sosyal finansman mekanizmalarının rolü ve ortak İslami eylemi teşvik etmek için gönüllülük kültürünün teşvik edilmesi rolü hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 252 (25/14) tentang peran mekanisme pembiayaan sosial Islam dalam mendukung pekerjaan kemanusiaan di daerah konflik, konflik, dan bencana, serta peran mempromosikan budaya sukarelawan untuk mempromosikan aksi Islam bersama" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، بعد اطلاعه على قراره 165 ⁦(18/3)⁩ في تفعيل دور الزكاة في مكافحة الفقر. عرّف المجمع التمويل الاجتماعي الإسلامي بأنه تقديم المال لأغراض اجتماعية وفق أحكام الشريعة بما يسهم في التمكين الاقتصادي وتنمية المجتمع وعمارة الكون، وأدواته منها إلزامية كالزكاة وغير إلزامية كالقرض والعارية وصدقة التطوع والوقف. وقرر جواز استخدامها في دعم العمل الإنساني لإغاثة المنكوبين من الكوارث والمتضررين عند الأوبئة والنازحين خلال النزاعات. وأوصى بإدراج ثقافة العمل التطوعي في المناهج الدراسية بالمدارس والجامعات، ودعوة العلماء والمفكرين والدعاة إلى حث المجتمع على الأعمال التطوعية المنظمة، وإبراز أهمية العمل الاجتماعي الإنساني في شتى المجالات الخادمة للإنسانية وبخاصة أوقات الأزمات والكوارث وازدياد اللاجئين والنازحين دون نظر لفوارق الدين أو العرق."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), after considering its resolution 165 (18/3) on activating the role of zakat against poverty. It defined Islamic social finance as providing money for social purposes under the rulings and principles of the sharia in a way that furthers economic empowerment, community development and the cultivation of the world; its instruments include obligatory ones such as zakat and voluntary ones such as the loan, the gratuitous lending (aariyya), voluntary charity and the waqf. It ruled that these instruments may be used to support humanitarian work — relieving victims of disasters, those harmed in epidemics and the displaced during conflicts. It recommended including a culture of volunteering in school and university curricula, calling on scholars, thinkers and preachers to urge organised voluntary work of every kind, and highlighting humanitarian social work in all fields serving humanity, especially in times of crisis, disaster and growing numbers of refugees and displaced persons, without regard to differences of religion or race."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی قرارداد 165 ⁦(18/3)⁩ ⁦(فقر کے خلاف زکوٰۃ کے کردار کی فعالیت)⁩ پر غور کے بعد۔ اکیڈمی نے اسلامی سماجی مالیات کی تعریف شریعت کے احکام و اصولوں کے مطابق سماجی مقاصد کے لیے مال فراہم کرنے کے طور پر کی تاکہ اقتصادی خودمختاری، سماجی ترقی اور عمارتِ کائنات میں مدد ملے؛ اس کے اوزار میں لازمی جیسے زکوٰۃ اور رضاکارانہ جیسے قرض، عاریت، تطوعی صدقہ اور وقف شامل ہیں۔ اس نے فیصلہ دیا کہ ان اوزاروں سے انسانی کارروائی کی حمایت کی جا سکتی ہے — آفات کے متاثرین، اوبا میں تکلیف اٹھانے والوں اور تنازعوں میں بے گھر افراد کی اغاثہ۔ سفارشات میں اسکولوں و جامعات کے نصاب میں رضاکارانہ ثقافت کی شمولیت، علماء، مفکرین اور داعیوں سے منظم رضاکارانہ کاموں کی ترغیب، اور انسانیت کی خدمت کے ہر شعبے میں — بالخصوص بحرانوں، آفات اور بڑھتے مہاجرین و بے گھر افراد کے زمانے میں — سماجی انسانی کام کی اہمیت کو اجاگر کرنے کی دعوت، مذہب یا نسل کے فرق کے بغیر، شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Yeda (29 de Rajab – 3 de Sha'ban de 1444, 20-23 de febrero de 2023), tras considerar su resolución 165 (18/3) sobre la activación del papel del zakat en la lucha contra la pobreza. Definió las finanzas sociales islámicas como la provisión de dinero para fines sociales bajo las normas y principios de la sharia, de manera que se promueva el empoderamiento económico, el desarrollo comunitario y el cultivo del mundo; sus instrumentos incluyen los obligatorios, como el zakat, y los voluntarios, como el préstamo, el préstamo gratuito (aariyya), la caridad voluntaria y el waqf. Dictaminó que estos instrumentos pueden utilizarse para apoyar la labor humanitaria: socorrer a las víctimas de desastres, a los afectados por epidemias y a los desplazados durante conflictos. Recomendó incluir una cultura de voluntariado en los planes de estudio escolares y universitarios, hacer un llamamiento a académicos, pensadores y predicadores para que impulsen el trabajo voluntario organizado de todo tipo, y destacar la labor social humanitaria en todos los ámbitos al servicio de la humanidad, especialmente en tiempos de crisis, desastres y ante el creciente número de refugiados y personas desplazadas, sin distinción de religión o raza."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, soit du 20 au 23 février 2023), après examen de sa résolution 165 (18/3) relative à l'activation du rôle de la zakat dans la lutte contre la pauvreté, définit la finance sociale islamique comme l'octroi de fonds à des fins sociales, conformément aux règles et principes de la charia, de manière à favoriser l'autonomisation économique, le développement communautaire et la prospérité mondiale. Ses instruments comprennent des contributions obligatoires telles que la zakat et des contributions volontaires telles que le prêt, le prêt gratuit (aariyya), la charité volontaire et le waqf. L'Académie a statué que ces instruments peuvent être utilisés pour soutenir l'action humanitaire – en secourant les victimes de catastrophes, les personnes touchées par des épidémies et les personnes déplacées lors de conflits. Il recommandait d'intégrer une culture du bénévolat dans les programmes scolaires et universitaires, appelant les universitaires, les penseurs et les prédicateurs à encourager le bénévolat organisé sous toutes ses formes et à mettre en lumière le travail social humanitaire dans tous les domaines au service de l'humanité, en particulier en temps de crise, de catastrophe et face à l'augmentation du nombre de réfugiés et de personnes déplacées, sans distinction de religion ou de race."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Cidde'deki yirmi beşinci oturumunda (29 Recep – 3 Şa'ban 1444 H, 20–23 Şubat 2023) toplu kararı, yoksullukla mücadelede zekatın rolünün etkinleştirilmesine ilişkin 165 (18/3) sayılı kararının gözden geçirilmesinden sonra. Akademi, İslami sosyal finansı, ekonomik güçlenmeye, toplumsal gelişime ve evrenin inşasına katkıda bulunan Şeriat hükümlerine uygun sosyal amaçlar için para sağlamak olarak tanımlamıştır. Araçları arasında zorunlu olan rekatlar ve zorunlu olmayan krediler, krediler, gönüllü hayır kurumları ve vakıflar yer almaktadır. Bu kaynakların afet mağdurları, salgınlardan etkilenenler ve çatışmalar sırasında yerinden edilmiş kişilere yardım etmek için insani yardım desteği için kullanılabileceğine karar vermiştir. Gönüllü çalışma kültürünün okul ve üniversite müfredatına dahil edilmesini, akademisyenleri, düşünürleri ve vaizleri davet ederek toplumun organize gönüllü çalışmalarına katılmasını ve özellikle krizler, felaketler ve mülteci ile yerinden edilmiş kişilerin artan dönemlerinde insanlığa hizmet eden çeşitli alanlarda insani sosyal hizmetin önemini vurgulamasını önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023), setelah meninjau keputusan 165 (18/3) tentang mengaktifkan peran zakat dalam memerangi kemiskinan. Akademi mendefinisikan keuangan sosial Islam sebagai penyediaan dana untuk tujuan sosial sesuai dengan aturan Syariah yang berkontribusi pada pemberdayaan ekonomi, pengembangan komunitas, dan pembangunan alam semesta. Instrumen yang diwajibkan meliputi zakat dan non-wajib seperti pinjaman, pinjaman, amal sukarela, dan wakaf. Akademi memutuskan bahwa penggunaannya dapat digunakan untuk mendukung pekerjaan kemanusiaan dalam membantu korban bencana, mereka yang terdampak epidemi, dan orang-orang yang mengungsi selama konflik. Ia merekomendasikan untuk mengintegrasikan budaya kerja sukarela ke dalam kurikulum sekolah dan universitas, mengundang para cendekiawan, pemikir, dan pengkhotbah untuk mendorong masyarakat terlibat dalam kerja sukarela terorganisir, serta menyoroti pentingnya pekerjaan sosial kemanusiaan di berbagai bidang yang melayani umat manusia, terutama di masa krisis, bencana, serta peningkatan jumlah pengungsi dan pengungsi tanpa memandang agama atau etnis."
