id: work/fatwa-iifa-252-islamic-social-finance-humanitarian
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 252 (25/14) بشأن دور آليات التمويل الاجتماعي الإسلامي في دعم العمل الإنساني في مناطق الصراعات والنزاعات والكوارث ودور النهوض بثقافة التطوع لتعزيز العمل الإسلامي المشترك", en: "IIFA resolution 252 (25/14) on the role of Islamic social finance instruments in supporting humanitarian work in regions of conflict, strife and disaster, and on advancing a culture of volunteering", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 252 (25/14): تنازعوں، جھگڑوں اور آفات کے علاقوں میں انسانی کارروائی کی حمایت میں اسلامی سماجی مالیات کے اوزاروں کا کردار اور رضاکارانہ ثقافت کی تعمیر", es: "Resolución 252 (25/14) de la IIFA sobre el papel de los instrumentos de financiación social islámica en el apoyo a la labor humanitaria en regiones de conflicto, disturbios y desastres, y sobre el fomento de una cultura de voluntariado." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، بعد اطلاعه على قراره 165 ⁦(18/3)⁩ في تفعيل دور الزكاة في مكافحة الفقر. عرّف المجمع التمويل الاجتماعي الإسلامي بأنه تقديم المال لأغراض اجتماعية وفق أحكام الشريعة بما يسهم في التمكين الاقتصادي وتنمية المجتمع وعمارة الكون، وأدواته منها إلزامية كالزكاة وغير إلزامية كالقرض والعارية وصدقة التطوع والوقف. وقرر جواز استخدامها في دعم العمل الإنساني لإغاثة المنكوبين من الكوارث والمتضررين عند الأوبئة والنازحين خلال النزاعات. وأوصى بإدراج ثقافة العمل التطوعي في المناهج الدراسية بالمدارس والجامعات، ودعوة العلماء والمفكرين والدعاة إلى حث المجتمع على الأعمال التطوعية المنظمة، وإبراز أهمية العمل الاجتماعي الإنساني في شتى المجالات الخادمة للإنسانية وبخاصة أوقات الأزمات والكوارث وازدياد اللاجئين والنازحين دون نظر لفوارق الدين أو العرق."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), after considering its resolution 165 (18/3) on activating the role of zakat against poverty. It defined Islamic social finance as providing money for social purposes under the rulings and principles of the sharia in a way that furthers economic empowerment, community development and the cultivation of the world; its instruments include obligatory ones such as zakat and voluntary ones such as the loan, the gratuitous lending (aariyya), voluntary charity and the waqf. It ruled that these instruments may be used to support humanitarian work — relieving victims of disasters, those harmed in epidemics and the displaced during conflicts. It recommended including a culture of volunteering in school and university curricula, calling on scholars, thinkers and preachers to urge organised voluntary work of every kind, and highlighting humanitarian social work in all fields serving humanity, especially in times of crisis, disaster and growing numbers of refugees and displaced persons, without regard to differences of religion or race."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی قرارداد 165 ⁦(18/3)⁩ ⁦(فقر کے خلاف زکوٰۃ کے کردار کی فعالیت)⁩ پر غور کے بعد۔ اکیڈمی نے اسلامی سماجی مالیات کی تعریف شریعت کے احکام و اصولوں کے مطابق سماجی مقاصد کے لیے مال فراہم کرنے کے طور پر کی تاکہ اقتصادی خودمختاری، سماجی ترقی اور عمارتِ کائنات میں مدد ملے؛ اس کے اوزار میں لازمی جیسے زکوٰۃ اور رضاکارانہ جیسے قرض، عاریت، تطوعی صدقہ اور وقف شامل ہیں۔ اس نے فیصلہ دیا کہ ان اوزاروں سے انسانی کارروائی کی حمایت کی جا سکتی ہے — آفات کے متاثرین، اوبا میں تکلیف اٹھانے والوں اور تنازعوں میں بے گھر افراد کی اغاثہ۔ سفارشات میں اسکولوں و جامعات کے نصاب میں رضاکارانہ ثقافت کی شمولیت، علماء، مفکرین اور داعیوں سے منظم رضاکارانہ کاموں کی ترغیب، اور انسانیت کی خدمت کے ہر شعبے میں — بالخصوص بحرانوں، آفات اور بڑھتے مہاجرین و بے گھر افراد کے زمانے میں — سماجی انسانی کام کی اہمیت کو اجاگر کرنے کی دعوت، مذہب یا نسل کے فرق کے بغیر، شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Yeda (29 de Rajab – 3 de Sha'ban de 1444, 20-23 de febrero de 2023), tras considerar su resolución 165 (18/3) sobre la activación del papel del zakat en la lucha contra la pobreza. Definió las finanzas sociales islámicas como la provisión de dinero para fines sociales bajo las normas y principios de la sharia, de manera que se promueva el empoderamiento económico, el desarrollo comunitario y el cultivo del mundo; sus instrumentos incluyen los obligatorios, como el zakat, y los voluntarios, como el préstamo, el préstamo gratuito (aariyya), la caridad voluntaria y el waqf. Dictaminó que estos instrumentos pueden utilizarse para apoyar la labor humanitaria: socorrer a las víctimas de desastres, a los afectados por epidemias y a los desplazados durante conflictos. Recomendó incluir una cultura de voluntariado en los planes de estudio escolares y universitarios, hacer un llamamiento a académicos, pensadores y predicadores para que impulsen el trabajo voluntario organizado de todo tipo, y destacar la labor social humanitaria en todos los ámbitos al servicio de la humanidad, especialmente en tiempos de crisis, desastres y ante el creciente número de refugiados y personas desplazadas, sin distinción de religión o raza."
