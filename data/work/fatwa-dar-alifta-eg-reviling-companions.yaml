id: work/fatwa-dar-alifta-eg-reviling-companions
class: work
kind: fatwa
label: { ar: "بيان حرمة سبّ الصحابة", en: "The prohibition of reviling the Companions", ur: "صحابہ کی برا بھلا کہنے کی حرمت", es: "La prohibición de insultar a los Compañeros" }
summary:
  ar: "سائل سأل عن حكم سبّ الصحابة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22038)⁩ أن توقير الصحابة وتعظيم شأنهم وصيانة حرمتهم فريضة شرعية دلت عليها نصوص الوحي، وأن التطاول عليهم محرم على ما فصّل الجواب."
  en: "A questioner asked about the ruling on reviling the Companions. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22038) answered that honouring the Companions, magnifying their standing and preserving their sanctity is a sharia obligation shown by the revealed texts, and maligning them is forbidden — as the answer details."
  ur: "ایک سائل نے صحابہ کو برا کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22038)⁩ نے جواب دیا کہ صحابہ کا احترام، ان کے مرتبے کی تعظیم اور ان کی حرمت کی حفاظت شرعی فرض ہے جس پر وحی کے متون دلالت کرتے ہیں اور ان پر تطاول حرام ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la norma relativa a la difamación de los Compañeros. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22038) respondió que honrar a los Compañeros, enaltecer su prestigio y preservar su santidad es una obligación de la sharia, tal como lo demuestran los textos revelados, y difamarlos está prohibido, como se detalla en la respuesta."
