id: work/fatwa-amja-nafs-whispers-creed
class: work
kind: fatwa
label: { ar: "وسوسة النفس الأمارة في العقيدة", en: "The evil-prompting soul's whispers in creed", ur: "نفس امارہ کے وسوسے عقیدے میں", es: "Los susurros del alma que incita al mal en el credo", fr: "Les murmures de l'âme qui incite au mal en matière de croyance" }
summary:
  ar: "سأل سائل هل النفس الأمارة بالسوء توسوس بالأمور الخاصة بالعقيدة كما يوسوس الشيطان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76697 بتاريخ 25 أكتوبر 2008)⁩ أن النفس الأمارة بالسوء قد توسوس بكل ما يضر الإنسان ويسوءه ويحزنه سواء في العمليات أو في الاعتقادات، وأيا كان الأمر فمثل هذه الوساوس من الشيطان ليحزن الذين آمنوا ويبغض إليهم عبادتهم لربهم، فعليها أن تطرح هذه الوساوس وتستعيذ بالله منها ولا تلقي لها بالًا وتحصن نفسها بالذكر الكثير وقراءة القرآن والدعاء بالأسحار وكثرة صيام النافلة مع تجنب الوحدة ورفقاء السوء."
  en: "A questioner asked whether the evil-prompting soul whispers in creed-matters as the devil does. Dr. Salah al-Sawi (fatwa no. 76697, 25 October 2008) answered that the soul may whisper whatever harms, grieves and saddens a person — in actions or beliefs alike; such whispers the devil aims to grieve the believers and sour their worship of their Lord, so she should cast them off, seek God's refuge from them, give them no heed, and fortify herself with much remembrance, Qur'an-reading, pre-dawn prayer, frequent voluntary fasting, avoiding solitude and bad company."
  ur: "ایک سائل نے پوچھا کہ نفس امارہ بھی عقیدے میں وسوسے ڈالتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76697، 25 اکتوبر 2008)⁩ کے مطابق ہاں — ان کو نظرانداز کرے، پناہ مانگے اور ذکر قرآن و نفل روزوں سے خود کو مضبوط کرے۔"
  es: "Un consultante preguntó si el alma que incita al mal susurra sobre asuntos religiosos como lo hace el diablo. El Dr. Salah al-Sawi (fatwa n.° 76697, 25 de octubre de 2008) respondió que el alma puede susurrar todo aquello que perjudica, aflige y entristece a una persona, ya sea en sus acciones o en sus creencias; el diablo busca afligir a los creyentes con tales susurros y amargar su adoración a su Señor, por lo que ella debe rechazarlos, buscar refugio en Dios, no prestarles atención y fortalecerse con mucho recuerdo, lectura del Corán, oración antes del amanecer, ayuno voluntario frecuente, evitando la soledad y las malas compañías."
  fr: "Une personne a demandé si l'âme malfaisante pouvait murmurer des pensées négatives sur les questions de croyance, à l'instar du diable. Le Dr Salah al-Sawi (fatwa n° 76697, 25 octobre 2008) a répondu que l'âme peut murmurer tout ce qui nuit, afflige et attriste une personne, que ce soit dans ses actions ou ses croyances. Le diable cherche à semer la douleur chez les croyants et à détourner leur adoration de leur Seigneur. Il est donc conseillé à la personne de rejeter ces pensées, de se réfugier auprès de Dieu, de ne pas y prêter attention et de se fortifier par de fréquentes invocations, la lecture du Coran, la prière à l'aube, le jeûne volontaire régulier, en évitant la solitude et les mauvaises fréquentations."
