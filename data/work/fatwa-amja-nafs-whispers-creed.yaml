id: work/fatwa-amja-nafs-whispers-creed
class: work
kind: fatwa
label: { ar: "وسوسة النفس الأمارة في العقيدة", en: "The evil-prompting soul's whispers in creed", ur: "نفس امارہ کے وسوسے عقیدے میں" }
summary:
  ar: "سأل سائل هل النفس الأمارة بالسوء توسوس بالأمور الخاصة بالعقيدة كما يوسوس الشيطان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76697 بتاريخ 25 أكتوبر 2008)⁩ أن النفس الأمارة بالسوء قد توسوس بكل ما يضر الإنسان ويسوءه ويحزنه سواء في العمليات أو في الاعتقادات، وأيا كان الأمر فمثل هذه الوساوس من الشيطان ليحزن الذين آمنوا ويبغض إليهم عبادتهم لربهم، فعليها أن تطرح هذه الوساوس وتستعيذ بالله منها ولا تلقي لها بالًا وتحصن نفسها بالذكر الكثير وقراءة القرآن والدعاء بالأسحار وكثرة صيام النافلة مع تجنب الوحدة ورفقاء السوء."
  en: "A questioner asked whether the evil-prompting soul whispers in creed-matters as the devil does. Dr. Salah al-Sawi (fatwa no. 76697, 25 October 2008) answered that the soul may whisper whatever harms, grieves and saddens a person — in actions or beliefs alike; such whispers the devil aims to grieve the believers and sour their worship of their Lord, so she should cast them off, seek God's refuge from them, give them no heed, and fortify herself with much remembrance, Qur'an-reading, pre-dawn prayer, frequent voluntary fasting, avoiding solitude and bad company."
  ur: "ایک سائل نے پوچھا کہ نفس امارہ بھی عقیدے میں وسوسے ڈالتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76697، 25 اکتوبر 2008)⁩ کے مطابق ہاں — ان کو نظرانداز کرے، پناہ مانگے اور ذکر قرآن و نفل روزوں سے خود کو مضبوط کرے۔"
