id: work/fatwa-aliftaa-jo-lecturers-working-days
class: work
kind: fatwa
label: { ar: "التزام عضو هيئة التدريس بتعليمات الدوام", en: "A university lecturer's duty to follow working-hours instructions", ur: "یونیورسٹی کے استاد پر حاضری کی ہدایات کی پابندی" }
summary:
  ar: "سؤال عن اعتراض عضو هيئة تدريس على إلزامه بالدوام أربعة أيام في الأسبوع، أجابت فيه دائرة الإفتاء العام الأردنية بوجوب التزامه بالتعليمات الإدارية الصادرة عمن يملك صلاحيتها. أجابت الدائرة بأن على المتعاقدين في عقود المعاوضات الوفاء بشروطها، مستشهدة بحديث أن المسلمين على شروطهم، إلا شرطًا يخالف الشريعة صراحة بأن يحل حرامًا أو يحرم حلالًا. وقالت إن أنصبة الهيئة التدريسية من الساعات والأيام تخضع للأنظمة التي يطبقها المسؤولون المفوضون، فما دام المسؤول يتصرف ضمن صلاحياته ولمصلحة العملية التعليمية وجب الالتزام بقراراته التنظيمية. وأضافت أن من يرى نفسه متضررًا يحتكم إلى الجهات المختصة بعيدًا عن التمرد والمناكفات التي يغلب ضررها نفعها، وخلصت إلى وجوب التزام المدرس بالتعليمات ما دامت منسجمة مع القوانين والأنظمة."
  en: "A question on a lecturer objecting to being required on campus four days a week, in which Jordan's General Iftaa Department answered that he must follow administrative instructions issued by those with authority to issue them. The Department answered that parties to contracts of exchange must honour their terms, citing the hadith that Muslims are bound by their conditions, unless a condition plainly contradicts the sharia by permitting the forbidden or forbidding the permitted. It said teaching loads, in hours and days, are governed by regulations applied by officials with delegated authority, so as long as an official acts within his powers and in the interest of teaching, his organisational decisions must be followed. It added that anyone who feels wronged should take the matter to the competent bodies rather than resort to defiance or quarrelling, whose harm outweighs any benefit, and concluded that the lecturer must follow the instructions so long as they accord with the laws and regulations."
  ur: "ایک استاد کے ہفتے میں چار دن حاضری کی پابندی پر اعتراض کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسے بااختیار حکام کی جاری کردہ انتظامی ہدایات کی پابندی کرنی ہوگی۔ ڈیپارٹمنٹ نے جواب دیا کہ معاوضے کے عقود کے فریقین پر ان کی شرائط پوری کرنا لازم ہے، اور اس حدیث سے استدلال کیا کہ مسلمان اپنی شرطوں کے پابند ہیں، سوائے اس شرط کے جو صراحتاً شریعت کے خلاف ہو کہ حرام کو حلال یا حلال کو حرام کرے۔ اس نے کہا کہ تدریسی بوجھ، گھنٹوں اور دنوں کے لحاظ سے، ان ضوابط کے تابع ہے جنہیں بااختیار حکام نافذ کرتے ہیں، لہٰذا جب تک ذمہ دار اپنے اختیارات کے اندر اور تعلیمی مصلحت کے لیے عمل کرے، اس کے انتظامی فیصلوں کی پابندی لازم ہے۔ اس نے مزید کہا کہ جو خود کو متاثر سمجھے وہ متعلقہ اداروں سے رجوع کرے، نافرمانی یا جھگڑے سے بچے جن کا نقصان نفع سے زیادہ ہے، اور نتیجہ نکالا کہ استاد پر ہدایات کی پابندی لازم ہے جب تک وہ قوانین اور ضوابط کے مطابق ہوں۔"
