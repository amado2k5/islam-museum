id: work/fatwa-amja-entering-bathroom-wudu
class: work
kind: fatwa
label: { ar: "دخول الحمام والوضوء", en: "Entering the bathroom does not break the wudu", ur: "باتھروم جانا — وضو نہیں ٹوٹتا", es: "Entrar al baño no rompe el wudu." }
summary:
  ar: "سألت امرأة أنها دخلت المرحاض وهي متوضئة لكن ليس في نيتها قضاء الحاجة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79072 بتاريخ 2 يونيو 2009)⁩ أنه لا ينتقض الوضوء بمجرد دخول الحمام لتغيير قارورة ونحوه وإنما ينتقض بالحدث وهو البول أو الغائط أو الريح ونحوه على ما فصّل الجواب."
  en: "A woman entered the bathroom while in wudu, not intending to relieve herself — to change a bottle or the like. Dr. Salah al-Sawi (fatwa no. 79072, 2 June 2009) answered that the wudu is not broken by merely entering the bathroom; it is broken by the hadath — urine, stool, wind and the like — as the answer details."
  ur: "باتھروم جانے سے وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79072، 2 جون 2009)⁩ کے مطابق محض داخلے سے نہیں ٹوٹتا — حدث سے ٹوٹتا ہے۔"
  es: "Una mujer entró al baño estando en estado de wudu, sin intención de orinar, cambiar un biberón o algo similar. El Dr. Salah al-Sawi (fatwa n.º 79072, 2 de junio de 2009) respondió que el wudu no se rompe simplemente por entrar al baño; se rompe por la presencia de hadath (orina, heces, gases, etc.), como se detalla en la respuesta."
