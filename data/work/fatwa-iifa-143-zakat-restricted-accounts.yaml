label: { ar: "قرار مجمع الفقه الإسلامي الدولي 143 (16/1) بشأن زكاة الحسابات المقيدة وشركات التأمين الإسلامية والتأمينات النقدية ومكافآت نهاية الخدمة", en: "IIFA resolution 143 (16/1) on zakat on restricted accounts, Islamic insurance companies, cash deposits and end-of-service gratuities", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 143 (16/1): مقید اکاؤنٹس، اسلامی انشورنس کمپنیوں، نقد ضمانتوں اور اختتامِ ملازمت گریجویٹی پر زکٰوۃ", es: "Resolución 143 (16/1) de la IIFA sobre el zakat en cuentas restringidas, compañías de seguros islámicas, depósitos en efectivo y gratificaciones por fin de servicio.", fr: "Résolution 143 (16/1) de l'IIFA sur la zakat sur les comptes restreints, les compagnies d'assurance islamiques, les dépôts en espèces et les indemnités de fin de service", tr: "Kısıtlı Hesaplar, İslami Sigorta Şirketleri, Nakit Sigorta ve Hizmet Sonu İmkanları Üzerine Zekat ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 143 (16/1)", id: "Keputusan Akademi Fiqh Islam Internasional 143 (16/1) mengenai Zakat pada Rekening Terbatas, Perusahaan Asuransi Islam, Asuransi Tunai, dan Bonus Akhir Layanan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. قرر في زكاة الحسابات الاستثمارية: تجب الزكاة في أرصدتها وأرباحها على أصحابها متى تحققت شروط الزكاة سواء كانت طويلة أم قصيرة الأجل ولو لم يقع السحب منها بتقييد من جهة الاستثمار أو من صاحب الحساب؛ وتجب في مبالغ الحسابات الجارية ولا أثر لكون الأموال مرصدة لحاجة مالكها أو لمشاريع استثمارية ما لم تكن لسداد ديون. وفي الحسابات المحتجزة لتوثيق التعامل ⁦(كهامش الجدية)⁩ وتأمينات شركات التأمين الإسلامية والتأمينات النقدية ومكافآت نهاية الخدمة: فصّل حكم الزكاة في كل منها بحسب ملكيتها وإمكان التصرف فيها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). On investment accounts: zakat is due on their balances and profits upon their owners whenever the conditions of zakat are met, whether long- or short-term and even where withdrawal is restricted by the investment body or the account holder; zakat is due on current-account balances, earmarking for the owner's needs or investment projects having no effect unless they serve to pay debts. On accounts held as transaction security (such as earnest margin), Islamic-insurance-company premiums, cash deposits and end-of-service gratuities, it detailed the zakat position of each according to ownership and disposability."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ سرمایہ کاری اکاؤنٹس پر: ان کے بیلنس اور منافع پر مالکان پر زکٰوۃ واجب جب شرائط پوری ہوں، خواہ طویل یا قلیل المدت ہوں اور خواہ انویسٹمنٹ باڈی یا مالک کی طرف سے نکالنے پر پابندی ہو؛ کرنٹ اکاؤنٹ بیلنس پر بھی زکٰوۃ واجب اور مالک کی ضرورت یا منصوبوں کے لیے رقم مخصوص کرنا اثر نہیں رکھتا سوائے قرض کی ادائیگی کے۔ لین دین کی ضمانت کے لیے رکے اکاؤنٹس ⁦(جیسے ارنسٹ مارجن)⁩، اسلامی انشورنس کمپنیوں کے پریمیم، نقد ضمانتیں اور اختتامِ ملازمت گریجویٹی — ہر ایک پر ملکیت اور تصرف کے اعتبار سے زکٰوۃ کا تفصیلی حکم۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión en Dubái (30 Safar – 5 Rabi al-Awwal 1426, 9–14 de abril de 2005). Sobre las cuentas de inversión: el zakat se debe sobre sus saldos y ganancias a sus propietarios siempre que se cumplan las condiciones del zakat, ya sea a largo o corto plazo e incluso cuando el retiro esté restringido por la entidad inversora o el titular de la cuenta; el zakat se debe sobre los saldos de las cuentas corrientes, las asignaciones para las necesidades del propietario o los proyectos de inversión que no tienen efecto a menos que sirvan para pagar deudas. Sobre las cuentas mantenidas como garantía de transacciones (como margen de garantía), primas de compañías de seguros islámicas, depósitos en efectivo y gratificaciones por fin de servicio, detalló la posición del zakat de cada una según la propiedad y la disponibilidad."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 16e session à Dubaï (30 Safar – 5 Rabi al-Awwal 1426, 9-14 avril 2005). Concernant les comptes d'investissement: la zakat est due sur leurs soldes et les profits de leurs titulaires dès lors que les conditions d'application de la zakat sont remplies, que ce soit pour des placements à court ou à long terme, et même lorsque les retraits sont restreints par l'organisme d'investissement ou le titulaire du compte; la zakat est due sur les soldes des comptes courants, qu'ils soient destinés aux besoins du titulaire ou à des projets d'investissement sans effet s'ils ne servent pas au remboursement de dettes. Concernant les comptes détenus en garantie de transactions (tels que les dépôts de garantie), les primes d'assurance islamique, les dépôts en espèces et les indemnités de fin de service, la résolution détaille le régime de la zakat applicable à chacun d'eux en fonction de leur propriété et de leur disponibilité."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (30 Sefer – 5 Rabi'al-Awwal 1426 H, 9–14 Nisan 2005) toplu kararı. Yatırım hesaplarındaki zekatla ilgili karar: Zekat, zekat, zekat koşulları uzun veya kısa vadeli sağlandığında, yatırım tarafı veya hesap sahibi tarafından kısıtlanmamış olsa bile, bakiyeleri ve kârları üzerinden ödenmelidir; cari hesap tutarları üzerinden geçerlidir; çünkü fonlar sahiplerinin ihtiyaçları veya yatırım projeleri için tahsis edilir, borç ödemesi için değilse. İşlemlerin belgelenmesi için tutulan hesaplarda (örneğin ciddiyet marjları), İslami sigorta şirketi sigortası, nakit sigorta ve hizmet sonu bonusları: zekatın kararı, mülkiyet ve elden çıkarma olasılığına göre ayrılır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi keenam belas di Dubai (30 Safar – 5 Rabi' al-Awwal 1426 AH, 9–14 April 2005). Keputusan mengenai zakat atas akun investasi: Zakat jatuh tempo atas saldo dan keuntungan dari pemegangnya kapan pun syarat zakat terpenuhi, baik jangka panjang maupun pendek, meskipun penarikan tidak dibatasi oleh pihak investasi atau pemegang rekening; zakat jatuh tempo atas jumlah rekening berjalan tanpa efek karena dana dialokasikan untuk kebutuhan pemilik atau proyek investasi kecuali untuk pelunasan utang. Dalam rekening yang disimpan untuk dokumentasi transaksi (seperti margin keseriusan), asuransi perusahaan asuransi Islam, asuransi kas, dan bonus akhir layanan: putusan zakat dipisahkan berdasarkan kepemilikan dan kemungkinan pelepasan zakat tersebut."
