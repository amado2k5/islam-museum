id: work/fatwa-amja-faith-criteria-takfir
class: work
kind: fatwa
label: { ar: "ضوابط الإيمان والتكفير", en: "The criteria of faith and takfir", ur: "ایمان اور تکفیر کے ضوابط", es: "Los criterios de fe y takfir" }
summary:
  ar: "سأل سائل أن من قال أو فعل شركًا أو كفرًا لا يكفر إلا بضوابط فهل للإيمان ضوابط أيضًا إن قال إنسان كلمة الإيمان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77697 بتاريخ 4 فبراير 2009)⁩ أن الأصل في كل من انتسب إلى الإسلام ولم يتلبس بناقض جلي من نواقضه أنه مسلم ولا يزول عنه هذا الحكم إلا بيقين تتحقق معه شروط التكفير وتنتفي موانعه، وقد قال النبي لأسامة بن زيد منكرًا عليه قتل رجل بعد أن قال كلمة التوحيد متعللًا بأنه قالها تعوذًا من السيف هلا شققت عن قلبه، فكل من انتسب إلى الإسلام فهو مسلم فإن تلبس بناقض نظر في تحقق شروط التكفير وانتفاء موانعه."
  en: "A questioner asked: since one who says or does shirk is not declared a disbeliever except under takfir's criteria — does faith too have criteria, if someone says the word of faith? Dr. Salah al-Sawi (fatwa no. 77697, 4 February 2009) answered that the default for anyone ascribing to Islam who has not clearly engaged a nullifier is that he is a Muslim, the ruling leaving him only with certainty meeting takfir's conditions and clearing its barriers; the Prophet rebuked Usama ibn Zayd for killing a man after he uttered the testimony, alleging he said it sheltering from the sword — 'did you split open his heart?'; whoever ascribes to Islam is a Muslim, and if he engages a nullifier, the meeting of takfir's conditions and absence of barriers is examined. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ جیسے تکفیر کے ضوابط ہیں کیا ایمان کے بھی ہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77697، 4 فروری 2009)⁩ کے مطابق اسلام سے منسوب ہر شخص مسلمان ہے جب تک کوئی صریح ناقض ثابت نہ ہو — اسامہ کی روایت اس کی اصل ہے۔"
  es: "Un consultante preguntó: dado que quien dice o practica shirk no es declarado incrédulo excepto bajo los criterios de takfir, ¿la fe también tiene criterios si alguien pronuncia la palabra de fe? El Dr. Salah al-Sawi (fatwa n.° 77697, 4 de febrero de 2009) respondió que, por defecto, para cualquiera que se adhiera al Islam y no haya incurrido claramente en un anulador, es musulmán, y la norma le deja con la certeza de cumplir las condiciones de takfir y superar sus barreras; el Profeta reprendió a Usama ibn Zayd por matar a un hombre después de que pronunciara el testimonio, alegando que lo dijo protegiéndose de la espada: \"¿Acaso le abriste el corazón?\". Quien se adhiera al Islam es musulmán, y si incurre en un anulador, se examina el cumplimiento de las condiciones de takfir y la ausencia de barreras. Registrado como respuesta de AMJA."
