summary:
  ar: "«النحو الوافي» كتاب في علم النحو العربي نسبه ملخص بحثي قُدّم إلى المتحف إلى عباس حسن، وذكر تاريخه هكذا: وفاة المؤلف 1979م / 1399هـ {cite:wikipedia-al-nahw-al-wafi-ar}. وعدّه الملخص بين ستين كتاباً هي الأكثر استشهاداً بها في علوم العربية الخمسة."
  en: "al-Nahw al-Wafi is a work of Arabic grammar that a research summary supplied to the museum ascribes to Abbas Hasan, giving its date as: author died 1979 CE / 1399 AH {cite:wikipedia-al-nahw-al-wafi-ar}. The summary counts it among sixty of the most-cited works in the five Arabic sciences."
  ur: "«النحو الوافی» عربی نحو کی کتاب ہے جسے عجائب گھر کو دیا گیا ایک تحقیقی خلاصہ عباس حسن سے منسوب کرتا ہے اور اس کی تاریخ یوں دیتا ہے: مصنف کی وفات 1979 ء / 1399 ھ {cite:wikipedia-al-nahw-al-wafi-ar}۔ خلاصہ اسے عربی کے پانچ علوم کی ساٹھ سب سے زیادہ حوالہ دی جانے والی کتابوں میں شمار کرتا ہے۔"
  fr: "al-Nahw al-Wafi est un ouvrage de grammaire arabe qu'un résumé de recherche remis au musée attribue à Abbas Hasan, en donnant sa date ainsi : mort de l'auteur 1979 ap. J.-C. / 1399 de l'Hégire {cite:wikipedia-al-nahw-al-wafi-ar}. Le résumé le compte parmi soixante des ouvrages les plus cités dans les cinq sciences de l'arabe."
  es: "al-Nahw al-Wafi es una obra de gramática árabe que un resumen de investigación entregado al museo atribuye a Abbas Hasan, y cuya fecha da así: muerte del autor 1979 d. C. / 1399 de la hégira {cite:wikipedia-al-nahw-al-wafi-ar}. El resumen la cuenta entre sesenta de las obras más citadas en las cinco ciencias del árabe."
  tr: "\"Al-Nahw Al-Wafi\", Abbas Hassan tarafından müzeye sunulan bir araştırma özetine atfedilen Arapça dilbilgisi üzerine yazılmış bir kitaptır ve tarihi şu şekilde belirtilmiştir: Yazarın ölümü 1979 AD / 1399 Hicri {atıf:wikipedia-al-nahw-al-wafi-ar}. Özeti, beş Arap bilimi arasında en çok atıf alan altmış kitap arasında saymaktadır."
  id: "\"Al-Nahw Al-Wafi\" adalah sebuah buku tata bahasa Arab yang dikaitkan dengan ringkasan penelitian yang diserahkan ke museum oleh Abbas Hassan, dan tanggalnya disebutkan sebagai berikut: Kematian penulis 1979 M / 1399 AH {cite:wikipedia-al-nahw-al-wafi-ar}. Ia menghitung ringkasan tersebut di antara enam puluh buku yang paling banyak dikutip di antara lima ilmu Arab."
