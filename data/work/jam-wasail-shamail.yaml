summary:
  ar: "شرح لملا علي القاري على «الشمائل المحمدية» للترمذي، يتناول كل باب بذكر الحديث وشرح ألفاظه ومعانيه. وقد حقّقت منه لؤلؤة القويفلي في رسالتها الجزء الممتد من باب خضاب رسول الله إلى باب اتكائه، وقدّمت له بدراسة عن المؤلف والمخطوط."
  en: "Mulla Ali al-Qari's commentary on al-Tirmidhi's al-Shama'il al-Muhammadiyya. It explains each chapter's hadith and its words and meanings. Lu'lu'a al-Qwayfili's thesis edits the stretch from the chapter on the dyeing of the Prophet's hair to the chapter on his reclining, with a study of the author and the manuscript."
  es: "Comentario de Mulla Ali al-Qari sobre la obra Al-Shama'il al-Muhammadiyya de al-Tirmidhi. Explica el hadiz de cada capítulo, así como sus palabras y significados. La tesis de Lu'lu'a al-Qwayfili edita el tramo comprendido entre el capítulo sobre el teñido del cabello del Profeta y el capítulo sobre su reclinación, incluyendo un estudio del autor y del manuscrito."
  fr: "Le commentaire de Mulla Ali al-Qari sur le traité al-Shama'il al-Muhammadiyya d'al-Tirmidhi explique les hadiths de chaque chapitre, ainsi que leur signification. La thèse de Lu'lu'a al-Qwayfili propose une édition du passage allant du chapitre sur la teinture des cheveux du Prophète à celui sur sa position couchée, accompagnée d'une étude de l'auteur et du manuscrit."
