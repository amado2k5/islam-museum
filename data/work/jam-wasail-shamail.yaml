summary:
  ar: "شرح لملا علي القاري على «الشمائل المحمدية» للترمذي، يتناول كل باب بذكر الحديث وشرح ألفاظه ومعانيه. وقد حقّقت منه لؤلؤة القويفلي في رسالتها الجزء الممتد من باب خضاب رسول الله إلى باب اتكائه، وقدّمت له بدراسة عن المؤلف والمخطوط."
  en: "Mulla Ali al-Qari's commentary on al-Tirmidhi's al-Shama'il al-Muhammadiyya. It explains each chapter's hadith and its words and meanings. Lu'lu'a al-Qwayfili's thesis edits the stretch from the chapter on the dyeing of the Prophet's hair to the chapter on his reclining, with a study of the author and the manuscript."
