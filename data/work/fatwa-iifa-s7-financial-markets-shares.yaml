label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن الأسواق المالية ⁦(الأسهم)⁩", en: "IIFA resolution on financial markets — shares", ur: "اکیڈمی کی قرارداد: مالیاتی بازار — حصص", es: "Resolución de la IIFA sobre los mercados financieros — acciones", fr: "Résolution de l'IIFA sur les marchés financiers — actions", tr: "Uluslararası İslami Fiqh Akademisi'nin finansal piyasalar (hisseler) ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai pasar keuangan (saham)" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: الأصل في المعاملات الحل فتأسيس شركة مساهمة ذات أغراض وأنشطة مشروعة جائز، ولا خلاف في حرمة الإسهام في شركات غرضها الأساسي محرم كالتعامل بالربا أو إنتاج المحرمات أو المتاجرة بها، والأصل حرمة الإسهام في شركات تتعامل أحيانًا بالمحرمات مع بيان الضوابط على ما فصّل القرار."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on financial markets — the shares section: transactions are lawful in principle, so founding a joint-stock company with lawful aims and activities is permissible; shareholding in companies whose basic purpose is prohibited — riba dealing or producing or trading in the forbidden — is agreed to be haram; and shareholding in companies occasionally dealing in prohibited matters is prohibited in principle, with the controls set out."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ حصص پر: جائز مقاصد والی کمپنی میں حصہ لینا جائز؛ بنیادی مقصد حرام ہو تو شرکت حرام؛ کبھی کبھار حرام معاملات والی کمپنیوں کے لیے ضوابط بیان ہوئے۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre mercados financieros — sección de acciones: las transacciones son lícitas en principio, por lo que fundar una sociedad anónima con fines y actividades lícitas es permisible; se considera haram la tenencia de acciones en empresas cuyo propósito básico está prohibido —riba, que consiste en negociar, producir o comerciar con lo prohibido—; y la tenencia de acciones en empresas que ocasionalmente realizan transacciones en asuntos prohibidos está prohibida en principio, con los controles establecidos."
  fr: "Résolution de la septième session de l'IIFA (La Mecque, mai 1992) sur les marchés financiers — section sur les actions: les transactions sont licites en principe, de sorte que la création d'une société par actions ayant des objectifs et des activités licites est permise; la détention d'actions dans des sociétés dont l'objet principal est interdit — opérations riba, production ou commerce de produits interdits — est considérée comme haram; et la détention d'actions dans des sociétés traitant occasionnellement de matières interdites est interdite en principe, sous réserve des contrôles établis."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yedinci oturum kararı (Mekke, Mayıs 1992): İşlemlerdeki temerrüt izinlidir, çünkü meşru amaçlar ve faaliyetlere sahip anonim şirket kurulması izinlidir. Tefecilik, yasak mallar üretmek veya ticareti gibi birincil amacı yasak olan şirketlere katılmanın yasaklanması konusunda herhangi bir tartışma yoktur. Temerrüt, kararda belirtilen düzenlemelerle bazen yasaklanmış eylemlerle ilgilenen şirketlere katılmanın yasaklanmasıdır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketujuhnya (Mekah, Mei 1992): Kegagalan transaksi diperbolehkan, karena mendirikan perusahaan saham bersama dengan tujuan dan aktivitas yang sah diperbolehkan. Tidak ada perselisihan mengenai larangan berpartisipasi dalam perusahaan yang tujuan utamanya dilarang, seperti memperdagangkan riba, memproduksi barang terlarang, atau memperdagangkannya. Pelanggaran adalah larangan berpartisipasi dalam perusahaan yang kadang-kadang menangani tindakan terlarang, sesuai dengan peraturan yang ditentukan dalam keputusan."
