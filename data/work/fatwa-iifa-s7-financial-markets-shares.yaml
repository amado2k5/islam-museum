summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩: الأصل في المعاملات الحل فتأسيس شركة مساهمة ذات أغراض وأنشطة مشروعة جائز، ولا خلاف في حرمة الإسهام في شركات غرضها الأساسي محرم كالتعامل بالربا أو إنتاج المحرمات أو المتاجرة بها، والأصل حرمة الإسهام في شركات تتعامل أحيانًا بالمحرمات مع بيان الضوابط على ما فصّل القرار."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on financial markets — the shares section: transactions are lawful in principle, so founding a joint-stock company with lawful aims and activities is permissible; shareholding in companies whose basic purpose is prohibited — riba dealing or producing or trading in the forbidden — is agreed to be haram; and shareholding in companies occasionally dealing in prohibited matters is prohibited in principle, with the controls set out."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ حصص پر: جائز مقاصد والی کمپنی میں حصہ لینا جائز؛ بنیادی مقصد حرام ہو تو شرکت حرام؛ کبھی کبھار حرام معاملات والی کمپنیوں کے لیے ضوابط بیان ہوئے۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre mercados financieros — sección de acciones: las transacciones son lícitas en principio, por lo que fundar una sociedad anónima con fines y actividades lícitas es permisible; se considera haram la tenencia de acciones en empresas cuyo propósito básico está prohibido —riba, que consiste en negociar, producir o comerciar con lo prohibido—; y la tenencia de acciones en empresas que ocasionalmente realizan transacciones en asuntos prohibidos está prohibida en principio, con los controles establecidos."
