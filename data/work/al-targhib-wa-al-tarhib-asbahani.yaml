label: { ar: "الترغيب والترهيب لأبي القاسم الأصبهاني", en: "al-Targhib wa-l-Tarhib (Abu al-Qasim al-Asbahani)", ur: "الترغیب والترہیب ⁦(ابو القاسم اصبہانی)⁩", es: "al-Targhib wa-l-Tarhib (Abu al-Qasim al-Asbahani)", fr: "al-Targhib wa-l-Tarhib (Abu al-Qasim al-Asbahani)", tr: "Abu al-Kasim al-Isfahani'nin cesaretlendirmesi ve uyarısı", id: "Dorongan dan peringatan oleh Abu al-Qasim al-Isfahani" }
summary:
  ar: "كتاب أبي القاسم إسماعيل بن محمد بن الفضل التيمي الطلحي الأصبهاني الملقب بقوام السنة ⁦(457–535هـ)⁩ في الترغيب والترهيب؛ ذكر المنذري أنه استوعب في كتابه جميع ما فيه مما لم يكن في الكتب الأخرى التي اعتمدها، وهو قليل، وأعرض عما فيه من الأحاديث المتحققة الوضع {cite:targhib-tarhib-qayyima j.1 p. 7-8}."
  en: "The book of encouragement and warning by Abu al-Qasim Isma'il b. Muhammad b. al-Fadl al-Taymi al-Talhi al-Asbahani, called Qiwam al-Sunna (457–535 AH); al-Mundhiri says he took into his own book everything in it that was not in his other sources — which is little — and left out the hadiths in it shown to be fabricated {cite:targhib-tarhib-qayyima j.1 p. 7-8}."
  ur: "ابو القاسم اسماعیل بن محمد بن الفضل تیمی طلحی اصبہانی، ملقب بہ قوام السنہ ⁦(457–535ھ)⁩ کی ترغیب و ترہیب پر کتاب؛ منذری کہتے ہیں کہ انہوں نے اس کی وہ سب روایات اپنی کتاب میں لے لیں جو ان کے دوسرے مآخذ میں نہیں تھیں — اور وہ کم ہیں — اور اس کی ثابت شدہ موضوع احادیث چھوڑ دیں {cite:targhib-tarhib-qayyima j.1 p. 7-8}۔"
  es: "El libro de aliento y advertencia de Abu al-Qasim Isma'il b. Muhammad b. al-Fadl al-Taymi al-Talhi al-Asbahani, llamado Qiwam al-Sunna (457–535 AH); al-Mundhiri dice que tomó en su propio libro todo lo que no estaba en sus otras fuentes —que es poco— y omitió los hadices que se demostró que eran fabricados {cite:targhib-tarhib-qayyima j.1 p. 7-8}."
  fr: "Le livre d'encouragement et d'avertissement d'Abu al-Qasim Isma'il b. Muhammad b. al-Fadl al-Taymi al-Talhi al-Asbahani, appelé Qiwam al-Sunna (457–535 AH); al-Mundhiri dit qu'il a pris dans son propre livre tout ce qui n'était pas dans ses autres sources — ce qui est peu — et a omis les hadiths qui s'y trouvaient et qui ont été démontrés comme étant fabriqués {cite:targhib-tarhib-qayyima j.1 p. 7-8}."
  tr: "Ebu el-Kasım İsmail bin Muhammed bin Fadl el-Teymi el-Talhi el-İsfahani'nin (457–535 H) kitabı, cesaret ve uyarı üzerine yazılmıştır; el-Mundhiri, diğer kitaplarda bulunmayan ve az sayıda bulunan her şeyi kitabında yer aldığını ve gerçek hadisleri aştığını belirtmiştir {cite:targhib-tarhib-qayyima j.1, s. 7-8}."
  id: "Kitab Abu al-Qasim Ismail ibn Muhammad ibn al-Fadl al-Taymi al-Talhi al-Isfahani, yang dikenal sebagai Quwam al-Sunnah (457–535 H), atas dorongan dan peringatan; al-Mundhiri menyebutkan bahwa ia memasukkan dalam bukunya segala sesuatu yang tidak ditemukan dalam kitab-kitab lain yang ia andalkan, yang jumlahnya sedikit, dan ia melampaui hadits otentik {sitasi:targhib-tarhib-qayyima j.1, hlm. 7-8}."
