label: { ar: "الترغيب والترهيب لأبي القاسم الأصبهاني", en: "al-Targhib wa-l-Tarhib (Abu al-Qasim al-Asbahani)", ur: "الترغیب والترہیب (ابو القاسم اصبہانی)" }
summary:
  ar: "كتاب أبي القاسم إسماعيل بن محمد بن الفضل التيمي الطلحي الأصبهاني الملقب بقوام السنة ⁦(457–535هـ)⁩ في الترغيب والترهيب؛ ذكر المنذري أنه استوعب في كتابه جميع ما فيه مما لم يكن في الكتب الأخرى التي اعتمدها، وهو قليل، وأعرض عما فيه من الأحاديث المتحققة الوضع {cite:targhib-tarhib-qayyima j.1 p. 7-8}."
  en: "The book of encouragement and warning by Abu al-Qasim Isma'il b. Muhammad b. al-Fadl al-Taymi al-Talhi al-Asbahani, called Qiwam al-Sunna (457–535 AH); al-Mundhiri says he took into his own book everything in it that was not in his other sources — which is little — and left out the hadiths in it shown to be fabricated {cite:targhib-tarhib-qayyima j.1 p. 7-8}."
  ur: "ابو القاسم اسماعیل بن محمد بن الفضل تیمی طلحی اصبہانی، ملقب بہ قوام السنہ (457–535ھ) کی ترغیب و ترہیب پر کتاب؛ منذری کہتے ہیں کہ انہوں نے اس کی وہ سب روایات اپنی کتاب میں لے لیں جو ان کے دوسرے مآخذ میں نہیں تھیں — اور وہ کم ہیں — اور اس کی ثابت شدہ موضوع احادیث چھوڑ دیں {cite:targhib-tarhib-qayyima j.1 p. 7-8}۔"
