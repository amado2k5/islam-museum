id: work/fatwa-dar-alifta-eg-hand-on-verse-while-reading
class: work
kind: fatwa
label: { ar: "حكم وضع اليد على الآية عند قراءة القرآن من المصحف", en: "Resting the hand on the verse while reading the mushaf", ur: "مصحف سے تلاوت میں آیت پر ہاتھ رکھنا", es: "Apoyar la mano sobre el versículo mientras se lee el mushaf", fr: "Poser la main sur le verset pendant la lecture du mushaf", tr: "Mushaf'tan Kur'an okunurken elin ayete koyulmasına ilişkin kural", id: "Aturan tentang meletakkan tangan di atas ayat saat membaca Al-Qur'an dari Mushaf" }
summary:
  ar: "سائل سأل عن إمرار اليد على الآيات عند قراءة القرآن الكريم من المصحف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21555)⁩ أن إمرار اليد على الآيات للاستعانة على ضبط القراءة وتيسير الحفظ أمر جائز على ما فصّل الجواب."
  en: "A questioner asked about passing the hand over the verses while reading the Quran from the mushaf. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21555) answered that doing so to aid accurate reading and ease memorisation is permissible — as the answer details."
  ur: "ایک سائل نے مصحف سے تلاوت کے وقت آیات پر ہاتھ پھیرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21555)⁩ نے جواب دیا کہ صحیح قراءت اور حفظ میں آسانی کے لیے ایسا کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de pasar la mano sobre los versículos al leer el Corán desde el mushaf. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21555) respondió que hacerlo para facilitar la lectura precisa y la memorización es permisible, como se detalla en la respuesta."
  fr: "Un lecteur a demandé s'il était permis de passer la main sur les versets lors de la lecture du Coran à partir du mushaf. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21555) a répondu que ce geste, visant à faciliter une lecture précise et la mémorisation, était autorisé, comme le détaille la réponse."
  tr: "Bir soru soran kişi, Kur'an'ı Muşaf'tan okurken elin ayetlerin üzerinde gezdirilmesini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21555), cevabında ayrıntılı olarak belirtildiği gibi, ayetlerin üzerinden el geçirmenin izin verildiğini belirtti."
  id: "Seorang penanya menanyakan tentang cara mengusap ayat-ayat dengan tangan saat membaca Al-Qur'an dari Mushaf. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21555) menjawab bahwa mengusap ayat-ayat dengan tangan untuk membantu mengendalikan pembacaan dan memudahkan hafalan diperbolehkan, sebagaimana dijelaskan dalam jawaban."
