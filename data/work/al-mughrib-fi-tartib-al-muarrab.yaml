label: { ar: "المغرب في ترتيب المعرب", en: "al-Mughrib fi Tartib al-Mu'rib", es: "al-Mughrib fi Tartib al-Mu'rib", fr: "al-Mughrib fi Tartib al-Mu'rib", ur: "المغرب فی ترتیب المعرب" }
summary:
  ar: "المغرب في ترتيب المعرب للمطرزي، شرح الألفاظ والتعابير الغريبة في كتب الفقه الحنفي، وهو مراجعة لكتابه الأكبر «المعرب في لغات الفقه» مع ترتيب واختصار وزيادات. رُتّبت كلماته هجائياً بحسب أول حرفين من الجذر كما في أساس البلاغة، ومراعاةً لآخر الحرف في الجذور التي تزيد على ثلاثة، مع إحالات لا يسهل دائماً تتبعها."
  en: "al-Mutarrizi's al-Mughrib fi tartib al-mu'rib, an explanation of the rare words and expressions found in Hanafi legal books, made by revising, arranging, abridging and adding to his larger al-Mu'rib fi lughat al-fiqh. Words are ordered alphabetically by the first two letters of the root, as in al-Zamakhshari's Asas, and also by the last letter for roots of more than three letters, with cross-references that are not always easy to follow."
  es: "El al-Mughrib fi tartib al-mu'rib de al-Mutarrizi, una explicación de las palabras y expresiones raras de los libros de derecho hanafí, hecha revisando, ordenando, abreviando y ampliando su obra mayor al-Mu'rib fi lughat al-fiqh. Las palabras se ordenan alfabéticamente por las dos primeras letras de la raíz, como en el Asas de al-Zamajshari, y también por la última letra en las raíces de más de tres, con remisiones no siempre fáciles de seguir."
  fr: "Le al-Mughrib fi tartib al-mu'rib d'al-Mutarrizi, explication des mots et expressions rares des livres de droit hanafite, réalisée en révisant, ordonnant, abrégeant et complétant son grand al-Mu'rib fi lughat al-fiqh. Les mots sont classés alphabétiquement d'après les deux premières lettres de la racine, comme dans l'Asas d'al-Zamakhshari, et aussi d'après la dernière lettre pour les racines de plus de trois, avec des renvois pas toujours faciles à suivre."
  ur: "مطرزی کی المغرب فی ترتیب المعرب، حنفی فقہی کتابوں کے غریب الفاظ اور تعبیرات کی شرح، جو انہوں نے اپنی بڑی کتاب المعرب فی لغات الفقہ پر نظرِ ثانی، ترتیب، اختصار اور اضافوں سے بنائی۔ الفاظ زمخشری کی اساس کی طرح مادے کے پہلے دو حروف کے لحاظ سے تہجی ترتیب میں ہیں، اور تین سے زیادہ حروف کے مادوں میں آخری حرف کا بھی لحاظ ہے، حوالوں کے ساتھ جنہیں تلاش کرنا ہمیشہ آسان نہیں۔"
