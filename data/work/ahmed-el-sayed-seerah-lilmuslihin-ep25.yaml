class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 25: أذى المنافقين"
  en: "The Prophetic Biography for Reformers, episode 25: The harm done by the hypocrites"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 25: منافقین کی ایذا رسانی"
  fr: "La biographie prophétique pour les réformateurs, épisode 25 : Le tort causé par les hypocrites"
  es: "La biografía profética para los reformadores, episodio 25: El daño causado por los hipócritas"
summary:
  ar: "يستعرض المحاضر أحداث السنتين الخامسة والسادسة بعد الهجرة: تحريم الخمر وتشريع الحجاب وبقية تشريعات السنوات المدنية الأولى وتصاعد كيد المنافقين. ويروي الخلاف الذي وقع في طريق غزوة بني المصطلق وكلام عبد الله بن أبي وخبر زيد بن أرقم وسورة المنافقين، ويربط حادثة الإفك على عائشة بالرحلة نفسها، ثم يبدأ قصة الحديبية بعبرة الألف والأربعمئة."
  en: "The lecturer surveys the events of the fifth and sixth years after the Hijra: the prohibition of wine, the legislation of the hijab and the other laws of the early Medinan years, and the growing plotting of the hypocrites. He tells the dispute on the road of the Banu al-Mustaliq expedition, Abdullah ibn Ubayy's words, Zayd ibn Arqam's report and sura al-Munafiqun, links the slander against Aisha to the same journey, and begins the Hudaybiyya story with the lesson of the fourteen hundred."
  ur: "مقرر ہجرت کے بعد پانچویں اور چھٹے سال کے واقعات کا جائزہ لیتے ہیں: شراب کی حرمت، حجاب کی تشریع اور ابتدائی مدنی برسوں کے دیگر احکام، اور منافقین کی بڑھتی ہوئی سازشیں۔ وہ غزوہ بنی المصطلق کے راستے میں ہونے والا جھگڑا، عبداللہ بن ابی کی بات، زید بن ارقم کی اطلاع اور سورہ المنافقون بیان کرتے ہیں، عائشہ پر تہمت کے واقعے کو اسی سفر سے جوڑتے ہیں، اور چودہ سو کے سبق کے ساتھ حدیبیہ کی کہانی شروع کرتے ہیں۔"
  fr: "Le conférencier passe en revue les événements des cinquième et sixième années après l'Hégire : l'interdiction du vin, la législation du voile et des autres lois des premières années de Médine, et les intrigues croissantes des hypocrites. Il raconte la dispute survenue sur la route de l'expédition des Banu al-Mustaliq, les propos d'Abdullah ibn Ubayy, le rapport de Zayd ibn Arqam et la sourate al-Munafiqun, relie la calomnie contre Aïcha au même voyage, puis commence l'histoire de Hudaybiyya avec la leçon des quatorze cents."
  es: "El conferenciante repasa los acontecimientos del quinto y el sexto año después de la Hégira: la prohibición del vino, la legislación del velo y de otras normas de los primeros años de Medina, y las intrigas crecientes de los hipócritas. Cuenta la disputa en el camino de la expedición de los Banu al-Mustaliq, las palabras de Abdullah ibn Ubayy, el relato de Zayd ibn Arqam y la sura al-Munafiqun, vincula la calumnia contra Aisha con el mismo viaje y comienza la historia de Hudaybiyya con la lección de los mil cuatrocientos."
