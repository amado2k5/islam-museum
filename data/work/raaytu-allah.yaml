label: { ar: "رأيت الله", en: "Ra'aytu Allah", ur: "رأیت اللہ" }
summary:
  ar: "كتاب لمصطفى محمود (دار المعارف، 1976) يبدأ بمقالة في «رؤية العقل والبصيرة» يرى فيها أن الله يُرى بآثاره وحكمته وأن لأهل القرب رؤية بالقلب لا بالعين، ثم ينقل ويشرح نصوصاً من «المواقف والمخاطبات» للنفري، ويختم بتعقيب في مذهبه في المعرفة الإلهية {cite:mm-raaytu-allah-maarif-1976 p. 19} {cite:mm-raaytu-allah-maarif-1976 p. 20} {cite:mm-raaytu-allah-maarif-1976 p. 162}."
  en: "A book by Mostafa Mahmoud (Dar al-Ma'arif, 1976) that opens with an essay on 'seeing with the mind and inner sight', holding that God is seen through His traces and wisdom and that those brought near have a seeing of the heart, not of the eye; it then quotes and explains passages of al-Niffari's al-Mawaqif wa-l-Mukhatabat and closes with an essay on his doctrine of divine knowledge {cite:mm-raaytu-allah-maarif-1976 p. 19} {cite:mm-raaytu-allah-maarif-1976 p. 20} {cite:mm-raaytu-allah-maarif-1976 p. 162}."
  ur: "مصطفیٰ محمود کی کتاب (دار المعارف، 1976) جو «عقل اور بصیرت سے دیکھنے» کے مضمون سے شروع ہوتی ہے، جس میں وہ کہتے ہیں کہ اللہ اپنے آثار اور حکمت سے دیکھا جاتا ہے اور اہلِ قرب کے لیے آنکھ کی نہیں دل کی رؤیت ہے؛ پھر نفری کی «المواقف والمخاطبات» کے نصوص نقل کر کے ان کی شرح کرتی ہے اور ان کے نظریۂ معرفتِ الٰہی پر تعقیب کے ساتھ ختم ہوتی ہے {cite:mm-raaytu-allah-maarif-1976 p. 19} {cite:mm-raaytu-allah-maarif-1976 p. 20} {cite:mm-raaytu-allah-maarif-1976 p. 162}۔"
