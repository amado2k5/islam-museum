id: work/fatwa-dar-alifta-eg-exchanging-zakat-al-fitr
class: work
kind: fatwa
label: { ar: "حكم تبادل زكاة الفطر", en: "Exchanging zakat al-fitr among its recipients", ur: "مستحقوں کے درمیان زکات فطر کا تبادلہ", es: "Intercambio de zakat al-fitr entre sus beneficiarios", fr: "L'échange de la zakat al-fitr entre ses bénéficiaires", tr: "Zekat el-Fitr Değişimi Kararı", id: "Putusan tentang Pertukaran Zakat al-Fitr" }
summary:
  ar: "سائل سأل عن تبادل الإعطاء والأخذ في زكاة الفطر بين المستحقين لها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22530)⁩ أنه لا مانع شرعًا من تبادل الإعطاء والأخذ في زكاة الفطر بين مستحقيها بشرط تحقق وصف مصارف الزكاة في المعطي والآخذ على ما فصّل الجواب."
  en: "A questioner asked about mutual giving and taking of zakat al-fitr among its eligible recipients. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22530) answered that nothing bars exchanging gifts of zakat al-fitr among those entitled to it, provided the description of the zakat channels is fulfilled in both giver and receiver, as the answer details."
  ur: "ایک سائل نے زکات فطر کے مستحقوں کے آپس میں دینے اور لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22530)⁩ نے جواب دیا کہ مستحقوں کے آپس میں زکات فطر کا تبادلہ شرعاً جائز ہے بشرطیکہ دینے والے اور لینے والے دونوں میں زکات کے مصارف کی صفت موجود ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de dar y recibir zakat al-fitr entre sus beneficiarios elegibles. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22530) respondió que nada impide el intercambio de regalos de zakat al-fitr entre quienes tienen derecho a él, siempre que se cumplan los requisitos de los canales de zakat tanto para el donante como para el receptor, tal como se detalla en la respuesta."
  fr: "Une question portait sur le partage de la zakat al-fitr entre les bénéficiaires. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22530) a répondu que rien n'interdit l'échange de dons de zakat al-fitr entre les personnes y ayant droit, à condition que les conditions relatives aux canaux de la zakat soient remplies tant pour le donateur que pour le bénéficiaire, comme le précise la réponse."
  tr: "Bir soru soran kişi, hak sahipleri arasında zekat al-fitr verme ve alma değişimi hakkında bilgi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22530), hak sahipleri arasında zekât alıp vermeye, cevabda ayrıntılı olarak belirtildiği gibi, zekât harcamalarının tanımı sağlandığı sürece, hak sahipleri arasında zekât verme ve alma konusunda dini bir itiraz olmadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang pertukaran pemberian dan penerimaan Zakat al-Fitr di antara mereka yang berhak. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22530) menjawab bahwa tidak ada keberatan agama untuk menukar pemberian dan menerima Zakat al-Fitr di antara mereka yang berhak, asalkan deskripsi pengeluaran zakat antara pemberi dan penerima dipenuhi, sebagaimana dijelaskan dalam jawaban."
