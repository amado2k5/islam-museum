summary:
  ar: "متن تاج الدين السبكي المختصر المشهور في أصول الفقه؛ ذكره ابن حجر في مقدمة تصانيفه في الأصول، وعليه شرح جلال الدين المحلي المعروف {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Taj al-Din al-Subki's celebrated compendium on the principles of jurisprudence (usul al-fiqh); Ibn Hajar lists it first among his works on usul, and it carries Jalal al-Din al-Mahalli's well-known commentary {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "تاج الدین سبکی کا اصول فقہ کا مشہور مختصر متن؛ ابن حجر نے اسے ان کی اصولی تصانیف میں سب سے پہلے ذکر کیا، اور اس پر جلال الدین محلی کی معروف شرح ہے {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
  es: "El célebre compendio de Taj al-Din al-Subki sobre los principios de la jurisprudencia (usul al-fiqh); Ibn Hajar lo enumera en primer lugar entre sus obras sobre usul, y contiene el conocido comentario de Jalal al-Din al-Mahalli {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  fr: "Le célèbre recueil de Taj al-Din al-Subki sur les principes de la jurisprudence (usul al-fiqh); Ibn Hajar le cite en premier parmi ses ouvrages sur l'usul, et il contient le commentaire bien connu de Jalal al-Din al-Mahalli {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  tr: "Taceddin el-Subki'nin metni, kısaltılmış el-meşhur fi Usul al-Fiqh; İbn Hajar tarafından ilkeler üzerine eserlerinin girişinde bahsedilmiştir ve bu metin ünlü Celaleddin el-Mahalli'nin yorumudur {atıf:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 cilt 9, s. 745}."
  id: "Teks Taj al-Din al-Subki, ringkasan al-mashhoor fi Usul al-Fiqh; disebutkan oleh Ibn Hajar dalam pengantar karya-karyanya tentang prinsip, dan di dalamnya adalah komentar dari Jalal al-Din al-Mahalli yang terkenal {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9, hlm. 745}."
