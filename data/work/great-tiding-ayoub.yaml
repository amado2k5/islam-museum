summary:
  ar: "ترجمة إنجليزية مشروحة لجزء عمّ ومعه الفاتحة، وضعها الأستاذ اللبناني الأمريكي محمود أيوب بتكليف من جمعية الدعوة الإسلامية في طرابلس، التي نشرتها سنة 1983، ثم أعاد نشرها على نفقته في آيوا سنة 1997 بعنوان «الخبر المهيب»؛ ثنائية اللغة، مع مقدمة عامة ومقدمات للسور وحواشٍ، بإنجليزية حديثة، وتستند إلى التفاسير القديمة وتعرض تعدد أقوالها دون جزم."
  en: "An annotated English translation of Juz' Amma, with al-Fatiha, by the Lebanese-American professor Mahmoud Ayoub, commissioned and published in 1983 by the Islamic Call Society of Tripoli and self-published again in Iowa in 1997 as The Awesome News; bilingual, with a general introduction, sura introductions and notes, in modern English, it rests on the classical commentaries and sets out their range of opinions without claiming certainty."
  ur: "جزء عم اور سورۂ فاتحہ کا انگریزی مشروح ترجمہ، از لبنانی امریکی پروفیسر محمود ایوب، جسے طرابلس کی اسلامک کال سوسائٹی نے تجویز کیا اور 1983 میں شائع کیا، پھر 1997 میں آئیووا میں «دی آسم نیوز» کے نام سے اپنے خرچ پر دوبارہ شائع ہوا؛ دو لسانی، عمومی تعارف، سورتوں کے تعارف اور حواشی کے ساتھ، جدید انگریزی میں، قدیم تفاسیر پر مبنی، اور ان کے اقوال کی کثرت بغیر قطعیت کے پیش کرتا ہے۔"
