label: { ar: "حكم صكوك الأضاحي وتوزيع لحم الأضاحي المختلط على المضحين", en: "Udhiyya vouchers and distributing mixed meat to sacrificers", ur: "قربانی کے واؤچر اور ملا ہوا گوشت تقسیم کرنا" }
summary:
  ar: "سائل سأل عن صكوك الأضاحي وتوزيع لحم الأضاحي المختلط على المضحين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21934)⁩ أن صكوك الأضاحي توكيل في شرائها وذبحها وتوزيع لحومها وهو أمر جائز شرعًا وبيّن الجواب حكم تخصيص وزن معين من اللحم المختلط لكل مضحٍّ على وجهه."
  en: "A questioner asked about udhiyya vouchers and distributing the mixed meat of many sacrifices to the sacrificers. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21934) answered that the vouchers are an agency for purchase, slaughter and distribution — lawful in the sharia; the answer sets out the ruling on allotting each sacrificer a fixed weight from the pooled meat."
  ur: "ایک سائل نے قربانی کے واؤچروں اور قربانی کرنے والوں میں ملا ہوا گوشت تقسیم کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21934)⁩ نے جواب دیا کہ یہ واؤچر خرید، ذبح اور تقسیم کی وکالت ہیں اور جائز ہیں؛ ہر قربانی کرنے والے کو مشترکہ گوشت سے مقررہ وزن دینے کا حکم جواب میں بیان ہوا۔"
