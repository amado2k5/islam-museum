label: { ar: "مواصفات الفرقة الناجية ⁦(سؤال سجين عن اختيار جماعة من الجماعات الإسلامية داخل السجن)⁩", en: "The marks of the saved sect ⁦(a prisoner asking how a new Muslim should choose among prison groups)⁩", ur: "نجات پانے والے گروہ کی علامات ⁦(ایک قیدی کا سوال: نومسلم قیدخانے کے مختلف گروہوں میں سے کس کا انتخاب کرے)⁩" }
summary:
  ar: "سائل داخل السجن سأل عن المواصفات التي يختار على أساسها حديث العهد بالإسلام قيادة وجماعة من بين المجموعات المختلفة الموجودة ⁦(سنة وأمة إسلام وجماعات أخرى)⁩. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21821 بتاريخ 14 أكتوبر 2012)⁩ أن الأصل في المسلم الاستقامة على الكتاب والسنة وصحبة الأقرب إليهما أفرادًا وجماعات بقدر قربهم منهما، وأن على حديث العهد أن يجمع همته أولًا على طلب العلم الشرعي الصحيح من مظانه وأهله حتى يمسك بالمعيار الذي تُقاس به الأفراد والتجمعات، وألا يشغل نفسه أول الطلب بتتبع فروع الخلافات فإن في ذلك إضاعة الأعمار وتشتيت السالك."
  en: "A prisoner asked by what marks a new Muslim should choose a leadership and community among the various groups present in prison (Sunni, Nation of Islam, Muslim societies and others). The Assembly of Muslim Jurists of America (fatwa no. 21821, 14 October 2012) answered that the norm for a Muslim is uprightness on the Book and the Sunna and keeping company with the persons and groups closest to them, in the measure of their closeness; that a newcomer should first devote himself to seeking sound religious knowledge from its sources and people until he holds the criterion by which persons and gatherings are weighed; and that he should not spend the beginning of his quest chasing the branches of their disputes, which wastes lifetimes and scatters the seeker."
  ur: "ایک قیدی نے پوچھا کہ نومسلم قیدخانے میں موجود مختلف گروہوں ⁦(سنی، نیشن آف اسلام اور دیگر)⁩ میں سے قیادت اور جماعت کس معیار سے چنے۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21821، 14 اکتوبر 2012)⁩ نے جواب دیا کہ مسلمان کا اصول کتاب و سنت پر استقامت اور ان افراد و جماعتوں کی صحبت ہے جو ان کے قریب تر ہوں، اسی قرب کے تناسب سے؛ نومسلم کو پہلے صحیح دینی علم اس کے مستند ذرائع اور اہل سے طلب کرنا چاہیے تا کہ وہ معیار حاصل کرے جس سے افراد اور تجمعات تولے جائیں؛ اور ابتداء میں ان کے اختلافات کی شاخوں میں نہ پڑے، کیونکہ اس سے زندگیاں ضائع اور طالب مشتت ہوتا ہے۔"
