label: { ar: "مواصفات الفرقة الناجية ⁦(سؤال سجين عن اختيار جماعة من الجماعات الإسلامية داخل السجن)⁩", en: "The marks of the saved sect ⁦(a prisoner asking how a new Muslim should choose among prison groups)⁩", ur: "نجات پانے والے گروہ کی علامات ⁦(ایک قیدی کا سوال: نومسلم قیدخانے کے مختلف گروہوں میں سے کس کا انتخاب کرے)⁩", es: "Las marcas de la secta salvada (un prisionero pregunta cómo debe elegir un nuevo musulmán entre los grupos de presos)", fr: "Les marques de la secte sauvée (un prisonnier demandant comment un nouveau musulman devrait choisir parmi les groupes de prisonniers)", tr: "Hayatta Kalan Grubun Özellikleri (Mahkumun Hapishane İçinde İslami Grup Seçimi Hakkında Sorusu)", id: "Karakteristik Kelompok Penyintas (Pertanyaan Narapidana tentang Memilih Kelompok Islam di dalam Penjara)" }
summary:
  ar: "سائل داخل السجن سأل عن المواصفات التي يختار على أساسها حديث العهد بالإسلام قيادة وجماعة من بين المجموعات المختلفة الموجودة ⁦(سنة وأمة إسلام وجماعات أخرى)⁩. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21821 بتاريخ 14 أكتوبر 2012)⁩ أن الأصل في المسلم الاستقامة على الكتاب والسنة وصحبة الأقرب إليهما أفرادًا وجماعات بقدر قربهم منهما، وأن على حديث العهد أن يجمع همته أولًا على طلب العلم الشرعي الصحيح من مظانه وأهله حتى يمسك بالمعيار الذي تُقاس به الأفراد والتجمعات، وألا يشغل نفسه أول الطلب بتتبع فروع الخلافات فإن في ذلك إضاعة الأعمار وتشتيت السالك."
  en: "A prisoner asked by what marks a new Muslim should choose a leadership and community among the various groups present in prison (Sunni, Nation of Islam, Muslim societies and others). The Assembly of Muslim Jurists of America (fatwa no. 21821, 14 October 2012) answered that the norm for a Muslim is uprightness on the Book and the Sunna and keeping company with the persons and groups closest to them, in the measure of their closeness; that a newcomer should first devote himself to seeking sound religious knowledge from its sources and people until he holds the criterion by which persons and gatherings are weighed; and that he should not spend the beginning of his quest chasing the branches of their disputes, which wastes lifetimes and scatters the seeker."
  ur: "ایک قیدی نے پوچھا کہ نومسلم قیدخانے میں موجود مختلف گروہوں ⁦(سنی، نیشن آف اسلام اور دیگر)⁩ میں سے قیادت اور جماعت کس معیار سے چنے۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21821، 14 اکتوبر 2012)⁩ نے جواب دیا کہ مسلمان کا اصول کتاب و سنت پر استقامت اور ان افراد و جماعتوں کی صحبت ہے جو ان کے قریب تر ہوں، اسی قرب کے تناسب سے؛ نومسلم کو پہلے صحیح دینی علم اس کے مستند ذرائع اور اہل سے طلب کرنا چاہیے تا کہ وہ معیار حاصل کرے جس سے افراد اور تجمعات تولے جائیں؛ اور ابتداء میں ان کے اختلافات کی شاخوں میں نہ پڑے، کیونکہ اس سے زندگیاں ضائع اور طالب مشتت ہوتا ہے۔"
  es: "Un preso preguntó qué características debe tener un nuevo musulmán para elegir un liderazgo y una comunidad entre los diversos grupos presentes en la prisión (suníes, Nación del Islam, sociedades musulmanas y otros). La Asamblea de Juristas Musulmanes de América (fatwa n.º 21821, 14 de octubre de 2012) respondió que la norma para un musulmán es la rectitud en el Corán y la Sunna, y mantenerse en compañía de las personas y grupos más cercanos a él, en la medida de su cercanía; que un recién llegado debe dedicarse primero a buscar un conocimiento religioso sólido en sus fuentes y entre sus personas hasta que domine el criterio con el que se juzga a las personas y a las reuniones; y que no debe pasar el comienzo de su búsqueda persiguiendo las ramificaciones de sus disputas, lo cual desperdicia vidas y dispersa al buscador."
  fr: "Un détenu a été interrogé sur les critères permettant à un nouveau musulman de choisir un guide et une communauté parmi les différents groupes présents en prison (sunnites, Nation of Islam, associations musulmanes, etc.). L'Assemblée des juristes musulmans d'Amérique (fatwa n° 21821, 14 octobre 2012) a répondu que la norme pour un musulman est la droiture dans l'étude du Coran et de la Sunna, ainsi que la fréquentation des personnes et des groupes qui lui sont les plus proches, selon la mesure de cette proximité; qu'un nouveau converti doit d'abord se consacrer à la recherche d'une connaissance religieuse solide auprès des sources et des personnes concernées, jusqu'à acquérir le discernement nécessaire pour évaluer les personnes et les groupes; et qu'il ne doit pas, au début de sa quête, s'enliser dans les querelles intestines, ce qui est une perte de temps et égare le chercheur."
  tr: "Hapishane içindeki bir soru soran, yeni müslüman bir Müslümanın mevcut çeşitli gruplar (Sünnet, Ümmet İslam ve diğerleri) arasında lider veya grup olarak seçilme kriterlerini sordu. Amerikan Şeriat Hukukçuları Akademisi (14 Ekim 2012 tarihli Fetva No. 21821), bir Müslümanın temel ilkesinin Kur'an ve Sünnet'i korumak ve en yakınları, bireyler ve gruplar, yakınlıkları ölçüldüğü ölçüde desteklemek olduğunu yanıtladı. Yeni gelen, bireylerin ve grupların ölçülme standardına uymak için önce kaynaklarından ve ailesinden doğru dini bilgiyi arama kararlılığını toplamalıdır. Kendini tartışma dallarını takip etmekle meşgul olmamalı, çünkü bu hayat boşa gider ve yolcuyu dikkatini dağıtır."
  id: "Seorang penanya di dalam penjara menanyakan kriteria di mana seorang Muslim yang baru masuk Islam dipilih sebagai pemimpin atau kelompok di antara berbagai kelompok yang ada (Sunnah, Ummah Islam, dan lainnya). American Academy of Sharia Jurists (Fatwa No. 21821 tanggal 14 Oktober 2012) menanggapi bahwa prinsip dasar dalam seorang Muslim adalah menjunjung tinggi Al-Qur'an dan Sunnah serta mendampingi mereka yang paling dekat, individu dan kelompok, sejauh kedekatan mereka. Pendatang baru harus terlebih dahulu mengumpulkan tekadnya untuk mencari pengetahuan agama yang benar dari sumber dan keluarganya agar ia mematuhi standar yang digunakan untuk mengukur individu dan kelompok. Ia tidak boleh terlalu sibuk dengan menekuni cabang perselisihan, karena hal itu akan membuang nyawa dan mengalihkan perhatian pelancong."
