id: work/fatwa-amja-foot-disease-khuff
class: work
kind: fatwa
label: { ar: "مرض الرجلين والمسح", en: "A foot ailment caused by water — khuff wiping is the way", ur: "پاؤں کی بیماری — خف مسح", es: "Una dolencia en los pies causada por el agua: limpiarse con khuff es la solución.", fr: "Une affection du pied causée par l'eau — le khuff s'essuie est la solution" }
summary:
  ar: "سأل سائل أن برجليه مرضًا سببه الماء فلا يستطيع غسلهما يوميًا عدة مرات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78210 بتاريخ 14 مارس 2009)⁩ أنه يجوز المسح على الخفين أو الجوربين إذا لبسهما على طهارة وقد وقت للمقيم يوم وليلة وللمسافر ثلاثة أيام بلياليهن ويبدأ حساب المدة من المسحة الأولى على ما فصّل الجواب."
  en: "A questioner had a foot ailment whose cause is water, so he cannot wash them daily several times. Dr. Salah al-Sawi (fatwa no. 78210, 14 March 2009) answered that wiping over khuffs or socks is lawful where they were put on in purity — timed at a day and a night for the resident and three days with their nights for the traveller, the term counted from the first wiping — as the answer details."
  ur: "پانی سے پاؤں خراب ہوتے ہیں؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78210، 14 مارچ 2009)⁩ کے مطابق طہارت پر پہنے خف پر مسح کرے — مقیم ایک دن، مسافر تین۔"
  es: "Un consultante padecía una afección en los pies causada por el agua, por lo que no podía lavárselos varias veces al día. El Dr. Salah al-Sawi (fatwa n.º 78210, 14 de marzo de 2009) respondió que limpiar los calcetines o calcetines es lícito si se han puesto en estado de pureza —durante un día y una noche para el residente y tres días con sus noches para el viajero, contando el plazo desde la primera limpieza— como se detalla en la respuesta."
  fr: "Un homme, souffrant d'une affection du pied d'origine hydrique, ne pouvait se laver les pieds plusieurs fois par jour. Le Dr Salah al-Sawi (fatwa n° 78210, 14 mars 2009) a répondu que le passage des essuyages sur les khuffs ou les chaussettes était licite s'ils avaient été enfilés en état de pureté rituelle – pendant une journée et une nuit pour le résident et trois jours et trois nuits pour le voyageur, ce délai étant compté à partir du premier passage – comme le précise la réponse."
