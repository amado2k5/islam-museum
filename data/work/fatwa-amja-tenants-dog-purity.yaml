id: work/fatwa-amja-tenants-dog-purity
class: work
kind: fatwa
label: { ar: "نجاسة الكلب وطهارته", en: "A tenant's dog — the three madhhabs on its purity", ur: "کتے کی نجاست — تین مذاہب" }
summary:
  ar: "سأل سائل أن مستأجر بيته لديه كلب فهل كل ما مسه يغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85513 بتاريخ 17 سبتمبر 2011)⁩ أن أهل العلم تنازعوا في نجاسة الكلب وطهارته على ثلاثة مذاهب أوردها شيخ الإسلام ابن تيمية فقال: أحدها أنه طاهر حتى ريقه وهذا مذهب مالك، والثاني نجس حتى شعره وهذا مذهب الشافعي وإحدى الروايتين عن أحمد، والثالث طاهر ما عدا ريقه على ما فصّل الجواب من ذكر المذاهب وما يترتب عليها من غسل الإناء الذي ولغ فيه الكلب."
  en: "A questioner's tenant kept a dog — must everything it touches be washed? Dr. Salah al-Sawi (fatwa no. 85513, 17 September 2011) answered that the scholars dispute the dog's impurity and purity on three madhhabs, which Ibn Taymiyya marshalled: first, pure even to its saliva — Malik's madhhab; second, impure even to its hair — Shafi'i's madhhab and one narration from Ahmad; third, pure except its saliva. The answer details the schools and the washing of a vessel a dog has lapped from that follows on them."
  ur: "کرائے دار کا کتا — کیا سب دھونا ہوگا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85513، 17 ستمبر 2011)⁩ کے مطابق ابن تيميہ کے تین مذاہب: مالكی پاک، شافعی نجس، تیسرا لعاب کے سوا پاک۔"
