id: work/fatwa-amja-tenants-dog-purity
class: work
kind: fatwa
label: { ar: "نجاسة الكلب وطهارته", en: "A tenant's dog — the three madhhabs on its purity", ur: "کتے کی نجاست — تین مذاہب", es: "El perro de un inquilino: las tres escuelas jurídicas sobre su pureza.", fr: "Le chien du locataire — les trois écoles de pensée (madhhabs) sur sa pureté", tr: "Köpeğin kirliliği ve saflığı", id: "Ketidakmurnian dan kemurnian anjing" }
summary:
  ar: "سأل سائل أن مستأجر بيته لديه كلب فهل كل ما مسه يغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85513 بتاريخ 17 سبتمبر 2011)⁩ أن أهل العلم تنازعوا في نجاسة الكلب وطهارته على ثلاثة مذاهب أوردها شيخ الإسلام ابن تيمية فقال: أحدها أنه طاهر حتى ريقه وهذا مذهب مالك، والثاني نجس حتى شعره وهذا مذهب الشافعي وإحدى الروايتين عن أحمد، والثالث طاهر ما عدا ريقه على ما فصّل الجواب من ذكر المذاهب وما يترتب عليها من غسل الإناء الذي ولغ فيه الكلب."
  en: "A questioner's tenant kept a dog — must everything it touches be washed? Dr. Salah al-Sawi (fatwa no. 85513, 17 September 2011) answered that the scholars dispute the dog's impurity and purity on three madhhabs, which Ibn Taymiyya marshalled: first, pure even to its saliva — Malik's madhhab; second, impure even to its hair — Shafi'i's madhhab and one narration from Ahmad; third, pure except its saliva. The answer details the schools and the washing of a vessel a dog has lapped from that follows on them."
  ur: "کرائے دار کا کتا — کیا سب دھونا ہوگا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85513، 17 ستمبر 2011)⁩ کے مطابق ابن تيميہ کے تین مذاہب: مالكی پاک، شافعی نجس، تیسرا لعاب کے سوا پاک۔"
  es: "El inquilino de un consultante tenía un perro; ¿debe lavarse todo lo que toque? El Dr. Salah al-Sawi (fatwa n.° 85513, 17 de septiembre de 2011) respondió que los eruditos discrepan sobre la impureza y pureza del perro según tres escuelas jurídicas (madhhabs), recopiladas por Ibn Taymiyya: primero, puro hasta su saliva (madhhab de Malik); segundo, impuro hasta su pelo (madhhab de Shafi'i y una narración de Ahmad); tercero, puro excepto su saliva. La respuesta detalla las escuelas y el lavado del recipiente del que haya bebido el perro, según se desprende de ellas."
  fr: "Le locataire d'un individu ayant posé la question possédait un chien; fallait-il laver tout ce que celui-ci touchait ? Le Dr Salah al-Sawi (fatwa n° 85513, 17 septembre 2011) a répondu que les savants divergent quant à la pureté et l'impureté du chien, selon trois écoles de pensée (madhhabs), rassemblées par Ibn Taymiyya: premièrement, le chien est pur jusqu'à sa salive (madhhab de Malik); deuxièmement, il est impur jusqu'à ses poils (madhhab de Shafi'i et une narration d'Ahmad); troisièmement, il est pur à l'exception de sa salive. La réponse détaille les écoles de pensée et la procédure de lavage des récipients que le chien a léchés."
  tr: "Bir soruya kiracının köpeği olup olmadığı; dokunduğu her şeyi yıkar mı? soruldu. Dr. Salah Al-Sawi (17 Eylül 2011 tarihli Fetva No. 85513) alimlerin köpeklerin saflığı ve saflığı konusunda üç düşünce okuluna göre tartıştığını yanıtladı; Şeyh al-İslam İbn Teymiye'nin aktardığına göre, şöyle demiştir: Birincisi, tükürüğüne kadar saf olmasıdır, bu Malik'in görüşüdür; ikincisi tüylerine kadar kirli olmasıdır, bu Şafii görüşüdür; ve Ahmad'dan iki rivayetten biri; üçüncüsü ise tükürüğü hariç saftır, okulların yanıtında ve köpeğin sulu kar yağdırdığı kabı yıkamanın sonuçlarında detaylandırılmıştır."
  id: "Seorang penanya ditanya apakah penyewa memiliki anjing; apakah ia mencuci segala sesuatu yang disentuhnya? Dr. Salah Al-Sawi menjawab (Fatwa No. 85513 tanggal 17 September 2011) bahwa para ulama memperdebatkan kemurnian dan kemurnian anjing menurut tiga aliran pemikiran, seperti yang dilaporkan oleh Syekh al-Islam Ibn Taymiyyah, yang berkata: Yang pertama adalah bahwa anjing itu murni hingga air liurnya, yang merupakan pandangan Malik; yang kedua tidak murni hingga ke bulunya, yang merupakan pandangan Syaf'i; dan salah satu dari dua narasi dari Ahmad; dan yang ketiga murni kecuali air liurnya, seperti yang dijelaskan dalam jawaban dari sekolah dan konsekuensi mencuci wadah tempat anjing hujan es."
