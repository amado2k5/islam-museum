label: { ar: "مدارك التنزيل وحقائق التأويل ⁦(تفسير النسفي)⁩", en: "Madarik al-Tanzil wa-Haqa'iq al-Ta'wil (Tafsir al-Nasafi)", ur: "مدارک التنزیل وحقائق التاویل ⁦(تفسیر نسفی)⁩" }
authors: [person/hafiz-al-din-al-nasafi]
