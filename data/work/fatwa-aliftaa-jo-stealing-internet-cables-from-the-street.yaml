id: work/fatwa-aliftaa-jo-stealing-internet-cables-from-the-street
class: work
kind: fatwa
label: { ar: "حكم أخذ كوابل الإنترنت من الشارع", en: "Taking internet and telephone cables from the street", ur: "گلی سے انٹرنیٹ اور ٹیلی فون کے کیبل اٹھا لینے کا حکم" }
summary:
  ar: "سؤال عن حكم سرقة كوابل الإنترنت والاتصال من الشارع وهل يُعد وضعها في الشارع حرزًا لها، أجابت فيه دائرة الإفتاء العام الأردنية بأن السرقة من كبائر الذنوب توعد الله مرتكبها بالعقوبة في الدنيا والعذاب في الآخرة بآيتي المائدة والنساء، وهي موجبة للحد إذا استوفى شروطه وموجبة للإثم الذي لا يسقط وإن سقط الحد، ولا تصح التوبة إلا بإعادة المسروق أو ضمان قيمته، وعرّفت السرقة بتعريف زكريا الأنصاري في أسنى المطالب بأنها أخذ المال خفية من حرز مثله بشروط، وبيّنت أن الأخذ من الحرز شرط لثبوت الحد، وأن الحرز يختلف باختلاف العرف والأموال وأحوال الناس والأوقات، ناقلة عن الخطيب الشربيني في الإقناع أن المحكَّم في الحرز العرف وأن الغزالي ضبطه بما لا يُعد صاحبه مضيعًا له، مع أمثلة حرز الآنية والثياب والحلي والنقد ومتاع النائم. وقررت أن حرز كوابل الإنترنت والاتصال يكون برفعها على الأعمدة أو دفنها في مساراتها المخصصة، فمن أخذها فهو سارق لأنه أخذها من حرز مثلها."
  en: "A question about the ruling on stealing internet and telephone cables from the street, and whether placing them in the street counts as safe custody (hirz); Jordan's General Iftaa Department answered that theft is a major sin for which God threatens punishment in this world and torment in the next, by the verses of al-Ma'ida and al-Nisa, that it entails the fixed penalty when its conditions are met and entails sin that does not lapse even if the penalty does, and that repentance is valid only by returning what was stolen or guaranteeing its value. It defined theft with Zakariyya al-Ansari in Asna al-Matalib as taking property secretly from the custody appropriate to it, subject to conditions, explained that taking from custody is a condition for the penalty, and that custody varies with custom, the kind of property, the state of people and the times, quoting al-Khatib al-Shirbini in al-Iqna that custom decides what counts as custody and that al-Ghazali defined it as what does not make the owner count as negligent, with examples of the custody of vessels, clothes, jewellery, cash and the goods of a sleeper. It ruled that the custody of internet and telephone cables consists in raising them on poles or burying them in their designated routes, so whoever takes them is a thief, having taken them from the custody appropriate to them."
  ur: "گلی سے انٹرنیٹ اور ٹیلی فون کے کیبل چوری کرنے کے حکم اور یہ کہ کیا انہیں گلی میں رکھنا ان کا حرز ⁦(محفوظ جگہ)⁩ شمار ہوتا ہے، کے بارے میں سوال؛ اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ چوری کبیرہ گناہوں میں سے ہے جس کے مرتکب کو اللہ نے سورہ مائدہ اور نساء کی آیات میں دنیا میں سزا اور آخرت میں عذاب کی وعید دی، شرائط پوری ہونے پر یہ حد کو واجب کرتی ہے اور ایسے گناہ کو جو حد کے ساقط ہونے پر بھی ساقط نہیں ہوتا، اور توبہ صرف چوری شدہ چیز واپس کرنے یا اس کی قیمت کی ضمانت سے درست ہوتی ہے۔ اس نے چوری کی تعریف زکریا انصاری کی اسنی المطالب سے کی کہ یہ مال کو چھپ کر اس جیسے حرز سے شرائط کے ساتھ لینا ہے، واضح کیا کہ حرز سے لینا حد کے ثبوت کی شرط ہے، اور حرز عرف، مال کی قسم، لوگوں کے حالات اور اوقات کے فرق سے مختلف ہوتا ہے، خطیب شربینی کی الاقناع سے نقل کرتے ہوئے کہ حرز میں فیصلہ عرف کا ہے اور غزالی نے اس کی حد یہ مقرر کی کہ جس سے مالک ضیاع کرنے والا نہ شمار ہو، برتنوں، کپڑوں، زیور، نقد اور سونے والے کے سامان کے حرز کی مثالوں کے ساتھ۔ اس نے فیصلہ کیا کہ انٹرنیٹ اور ٹیلی فون کے کیبلوں کا حرز انہیں کھمبوں پر چڑھانا یا ان کے مخصوص راستوں میں دفن کرنا ہے، لہٰذا جو انہیں اٹھائے وہ چور ہے، کیونکہ اس نے انہیں ان جیسے حرز سے لیا۔"
