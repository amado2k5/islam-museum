id: work/fatwa-aliftaa-jo-stealing-internet-cables-from-the-street
class: work
kind: fatwa
label: { ar: "حكم أخذ كوابل الإنترنت من الشارع", en: "Taking internet and telephone cables from the street", ur: "گلی سے انٹرنیٹ اور ٹیلی فون کے کیبل اٹھا لینے کا حکم", es: "Tomar los cables de internet y teléfono de la calle", fr: "Retirer les câbles internet et téléphoniques de la rue", tr: "Sokaktan internet kablolarının alınmasına ilişkin karar", id: "Putusan tentang pengambilan kabel internet dari jalan" }
summary:
  ar: "سؤال عن حكم سرقة كوابل الإنترنت والاتصال من الشارع وهل يُعد وضعها في الشارع حرزًا لها، أجابت فيه دائرة الإفتاء العام الأردنية بأن السرقة من كبائر الذنوب توعد الله مرتكبها بالعقوبة في الدنيا والعذاب في الآخرة بآيتي المائدة والنساء، وهي موجبة للحد إذا استوفى شروطه وموجبة للإثم الذي لا يسقط وإن سقط الحد، ولا تصح التوبة إلا بإعادة المسروق أو ضمان قيمته، وعرّفت السرقة بتعريف زكريا الأنصاري في أسنى المطالب بأنها أخذ المال خفية من حرز مثله بشروط، وبيّنت أن الأخذ من الحرز شرط لثبوت الحد، وأن الحرز يختلف باختلاف العرف والأموال وأحوال الناس والأوقات، ناقلة عن الخطيب الشربيني في الإقناع أن المحكَّم في الحرز العرف وأن الغزالي ضبطه بما لا يُعد صاحبه مضيعًا له، مع أمثلة حرز الآنية والثياب والحلي والنقد ومتاع النائم. وقررت أن حرز كوابل الإنترنت والاتصال يكون برفعها على الأعمدة أو دفنها في مساراتها المخصصة، فمن أخذها فهو سارق لأنه أخذها من حرز مثلها."
  en: "A question about the ruling on stealing internet and telephone cables from the street, and whether placing them in the street counts as safe custody (hirz); Jordan's General Iftaa Department answered that theft is a major sin for which God threatens punishment in this world and torment in the next, by the verses of al-Ma'ida and al-Nisa, that it entails the fixed penalty when its conditions are met and entails sin that does not lapse even if the penalty does, and that repentance is valid only by returning what was stolen or guaranteeing its value. It defined theft with Zakariyya al-Ansari in Asna al-Matalib as taking property secretly from the custody appropriate to it, subject to conditions, explained that taking from custody is a condition for the penalty, and that custody varies with custom, the kind of property, the state of people and the times, quoting al-Khatib al-Shirbini in al-Iqna that custom decides what counts as custody and that al-Ghazali defined it as what does not make the owner count as negligent, with examples of the custody of vessels, clothes, jewellery, cash and the goods of a sleeper. It ruled that the custody of internet and telephone cables consists in raising them on poles or burying them in their designated routes, so whoever takes them is a thief, having taken them from the custody appropriate to them."
  ur: "گلی سے انٹرنیٹ اور ٹیلی فون کے کیبل چوری کرنے کے حکم اور یہ کہ کیا انہیں گلی میں رکھنا ان کا حرز ⁦(محفوظ جگہ)⁩ شمار ہوتا ہے، کے بارے میں سوال؛ اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ چوری کبیرہ گناہوں میں سے ہے جس کے مرتکب کو اللہ نے سورہ مائدہ اور نساء کی آیات میں دنیا میں سزا اور آخرت میں عذاب کی وعید دی، شرائط پوری ہونے پر یہ حد کو واجب کرتی ہے اور ایسے گناہ کو جو حد کے ساقط ہونے پر بھی ساقط نہیں ہوتا، اور توبہ صرف چوری شدہ چیز واپس کرنے یا اس کی قیمت کی ضمانت سے درست ہوتی ہے۔ اس نے چوری کی تعریف زکریا انصاری کی اسنی المطالب سے کی کہ یہ مال کو چھپ کر اس جیسے حرز سے شرائط کے ساتھ لینا ہے، واضح کیا کہ حرز سے لینا حد کے ثبوت کی شرط ہے، اور حرز عرف، مال کی قسم، لوگوں کے حالات اور اوقات کے فرق سے مختلف ہوتا ہے، خطیب شربینی کی الاقناع سے نقل کرتے ہوئے کہ حرز میں فیصلہ عرف کا ہے اور غزالی نے اس کی حد یہ مقرر کی کہ جس سے مالک ضیاع کرنے والا نہ شمار ہو، برتنوں، کپڑوں، زیور، نقد اور سونے والے کے سامان کے حرز کی مثالوں کے ساتھ۔ اس نے فیصلہ کیا کہ انٹرنیٹ اور ٹیلی فون کے کیبلوں کا حرز انہیں کھمبوں پر چڑھانا یا ان کے مخصوص راستوں میں دفن کرنا ہے، لہٰذا جو انہیں اٹھائے وہ چور ہے، کیونکہ اس نے انہیں ان جیسے حرز سے لیا۔"
  es: "Una pregunta sobre la norma relativa al robo de cables de internet y teléfono de la calle, y si colocarlos en la calle cuenta como custodia segura (hirz); el Departamento General de Iftaa de Jordania respondió que el robo es un pecado grave por el cual Dios amenaza con castigo en este mundo y tormento en el próximo, según los versículos de al-Ma'ida y al-Nisa, que conlleva la pena fija cuando se cumplen sus condiciones y conlleva un pecado que no se extingue incluso si la pena se extingue, y que el arrepentimiento es válido solo devolviendo lo robado o garantizando su valor. Definió el hurto con Zakariyya al-Ansari en Asna al-Matalib como tomar propiedad secretamente de la custodia apropiada, sujeto a condiciones, explicó que tomar de la custodia es una condición para el castigo, y que la custodia varía según la costumbre, el tipo de propiedad, el estado de las personas y los tiempos, citando a al-Khatib al-Shirbini en al-Iqna que la costumbre decide qué cuenta como custodia y que al-Ghazali la definió como aquello que no hace que el propietario sea considerado negligente, con ejemplos de la custodia de embarcaciones, ropa, joyas, dinero en efectivo y los bienes de un durmiente. Dictaminó que la custodia de cables de internet y teléfono consiste en elevarlos en postes o enterrarlos en sus rutas designadas, por lo que quien los toma es un ladrón, habiéndolos tomado de la custodia apropiada."
  fr: "Une question portait sur la décision concernant le vol de câbles internet et téléphoniques dans la rue, et sur la question de savoir si le fait de les déposer dans la rue compte comme une garde en lieu sûr (hirz); le Département général de la Iftaa de Jordanie a répondu que le vol est un péché majeur pour lequel Dieu menace de punition dans ce monde et de tourments dans l'autre, selon les versets d'al-Ma'ida et d'al-Nisa, qu'il entraîne la peine fixe lorsque ses conditions sont remplies et qu'il s'agit d'un péché qui ne s'éteint pas même si la peine est effacée, et que le repentir n'est valable que par la restitution de ce qui a été volé ou la garantie de sa valeur. L'ouvrage Asna al-Matalib, s'appuyant sur Zakariyya al-Ansari, définit le vol comme le fait de s'emparer secrètement d'un bien soustrait à sa garde légitime, sous réserve de certaines conditions. Il explique que le soustraction est une condition de la peine encourue et que la notion de garde varie selon les coutumes, la nature du bien, la situation sociale et l'époque. Citant al-Khatib al-Shirbini dans al-Iqna, il affirme que la coutume détermine ce qui constitue une garde et qu'al-Ghazali la définit comme ce qui n'entraîne pas la négligence du propriétaire, citant en exemple la garde des récipients, des vêtements, des bijoux, de l'argent liquide et des biens d'un dormeur. L'ouvrage statue que la garde des câbles internet et téléphoniques consiste à les installer sur des poteaux ou à les enterrer selon leur tracé prévu. Par conséquent, quiconque s'en empare est coupable de vol, les ayant soustraits à leur garde légitime."
  tr: "Sokaktan internet ve iletişim kablolarının çalınmasına ilişkin kararın ve bunların sokağa konmasının bir güvenlik biçimi olarak kabul edilip edilmediğine dair bir soru. Ürdün Genel Fetva Dairesi, hırsızlığın en büyük günahlardan biri olduğunu ve Allah'ın failini bu dünyada ceza, ahirette ise En-Nisa ayetleriyle tehdit ettiğini yanıtladı. Şartları yerine getirilirse hadd cezasına tabidir ve hudud kaldırılsa bile geçersiz sayılan bir günah vardır. Tövbe ancak çalınan eşyanın iadesi veya değerinin garanti altına alınması yoluyla geçerlidir. Hırsızlık, Zakerya Al-Ansari tarafından Asna Al-Matalib'de gizlice para almak olarak tanımlanır Benzer bir koruma ve koşullar ile birlikte, hazrazdan alınmanın cezanın belirlenmesi için bir koşul olduğunu, hazazların gelenek, zenginlik, halk koşulları ve zamana göre değiştiğini açıkladı. Al-Iqna'da Al-Khatib Al-Sharbini'nin alıntısında, hazrazın belirleyici faktörünün gelenek olduğunu ve Al-Gazali'nin onu sahibinin israf olarak görmediği şekilde düzenlediğini, örneğin kaplar, giysiler, takılar, paralar ve uyuyan kişinin eşyalarının ele geçirilmesi gibi örneklerle aktardı. İnternet ve iletişim kablolarını güvence altına almak, onları direklere asmak ya da belirlenen yollarına gömmek olarak kabul edildi; kim alırsa hırsız sayılırsa benzer bir tuzaktan almıştır."
  id: "Sebuah pertanyaan tentang aturan pencurian kabel internet dan komunikasi dari jalan dan apakah meletakkannya di jalan dianggap sebagai bentuk keamanan. Departemen Fatwa Jenderal Yordania menjawab bahwa pencurian adalah salah satu dosa besar, dan Allah mengancam pelakunya dengan hukuman di dunia ini dan penyiksaan di akhirat dengan ayat-ayat Al-Ma'idah dan An-Nisa. Pencurian dikenakan hukuman hadd jika syaratnya terpenuhi, dan dikenakan dosa yang tidak akan berakhir meskipun hudud dicabut. Pertobatan hanya berlaku dengan mengembalikan barang yang dicuri atau menjamin nilainya. Pencurian didefinisikan oleh Zakaria Al-Ansari dalam Asna Al-Matalib sebagai pengambilan uang secara diam-diam dari Perlindungan serupa dengan syarat-syarat, dan menjelaskan bahwa mengambil dari hazarz adalah syarat untuk menetapkan hukuman, dan bahwa hazarz bervariasi sesuai adat, kekayaan, kondisi masyarakat, dan waktu. Ia mengutip Al-Khatib Al-Sharbini dalam Al-Iqna' bahwa faktor penentu dalam hazarz adalah adat, dan bahwa Al-Ghazali menetapkannya sedemikian rupa sehingga pemiliknya tidak menganggapnya sebagai pemborosan, dengan contoh penyitaan wadah, pakaian, perhiasan, koin, dan barang-barang orang yang tertidur. Diputuskan bahwa mengamankan kabel internet dan komunikasi adalah dengan mengangkatnya di tiang atau menguburnya di jalur yang ditentukan; siapa pun yang mengambilnya adalah pencuri karena mereka mengambilnya dari jebakan serupa."
