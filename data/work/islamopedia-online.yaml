summary:
  ar: "موقع أكاديمي بالإنجليزية أُسس سنة 2007 بمنحة من مؤسسة كارنيغي ضمن برنامج «الإسلام في الغرب» بجامعة هارفارد، بإدارة الباحثة جوسلين سيزاري، يقدّم قاعدة بيانات عن أبرز الشخصيات الدينية في العالم الإسلامي ومواقفها وترجمات لأخبار وآراء دينية من العربية والأردية والفارسية؛ جمع 44 ألف مدخل من أكثر من مئة موقع، وهو اليوم غير نشط."
  en: "An English-language academic website founded in 2007 with a Carnegie grant within the Islam in the West Program at Harvard, directed by the scholar Jocelyne Cesari, offering a database of leading religious figures of the Muslim world and their positions and translations of news and religious opinions from Arabic, Urdu and Persian; it aggregated 44,000 entries from more than a hundred websites, and is now inactive."
  ur: "انگریزی کی تعلیمی ویب سائٹ جو 2007 میں کارنیگی کی گرانٹ سے ہارورڈ کے «اسلام اِن دی ویسٹ» پروگرام میں قائم ہوئی، نگران جوسلین سیزاری؛ عالمِ اسلام کی نمایاں دینی شخصیات اور ان کے موقف کا ڈیٹا بیس اور عربی، اردو اور فارسی سے خبروں اور دینی آرا کے تراجم؛ سو سے زیادہ ویب سائٹوں سے 44 ہزار اندراجات؛ اب غیر فعال۔"
