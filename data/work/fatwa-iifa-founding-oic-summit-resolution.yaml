summary:
  ar: "قرار مؤتمر القمة الإسلامي الثالث ⁦(مكة المكرمة، 1981م)⁩ بشأن إنشاء مجمع الفقه الإسلامي الدولي وهو الوثيقة التأسيسية التي قامت عليها الأكاديمية بوصفها هيئة فقهية جماعية تابعة لمنظمة المؤتمر الإسلامي على ما نصّ عليه القرار في موقع الأكاديمية."
  en: "The Third Islamic Summit resolution (Mecca, 1981) establishing the International Islamic Fiqh Academy — the founding instrument under which the Academy exists as a collective fiqh body within the Organisation of the Islamic Conference — as the resolution states on the Academy's site."
  ur: "تیسری اسلامی سربراہی کانفرنس ⁦(مکہ، 1981ء)⁩ کی قرارداد جس کے تحت بین الاقوامی اسلامی فقہ اکیڈمی بطور اجتماعی فقہی ادارہ تنظیم المؤتمر الاسلامی کے تحت قائم ہوئی — جیسا کہ اکیڈمی کی ویب سائٹ پر قرارداد میں ہے۔"
  es: "La resolución de la Tercera Cumbre Islámica (La Meca, 1981) que establece la Academia Internacional de Fiqh Islámico —el instrumento fundacional bajo el cual la Academia existe como un organismo colectivo de fiqh dentro de la Organización de la Conferencia Islámica— como se indica en la resolución en el sitio web de la Academia."
