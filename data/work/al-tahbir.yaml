summary:
  ar: "معجم السمعاني في تراجم علماء عصره رجالاً ونساءً، يزيد على ألف ومائتي ترجمة، لمن لقيه في طلبه بمرو ونيسابور وأصبهان وغيرها أو راسله أو أجازه؛ نسخه المستوفى في السنة التي سبقت وفاته، وفي التاريخ ثلاثمائة طاقة {cite:encyclopaedia-of-islam-2 vol. 8 p. 1025} {cite:tarikh-islam-dhahabi p. 122}."
  en: "Al-Sam'ani's dictionary of contemporary scholars, men and women — more than 1,200 biographies of those he met on his talab at Marw, Nishapur, Isfahan and beyond, or corresponded with, or who granted him ijaza; he produced the clean copy in the year before his death; 300 folios per the Tarikh {cite:encyclopaedia-of-islam-2 vol. 8 p. 1025} {cite:tarikh-islam-dhahabi p. 122}."
