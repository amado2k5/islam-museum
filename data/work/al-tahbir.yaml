label: { ar: "التحبير في المعجم الكبير", en: "al-Tahbir fi al-Mujam al-Kabir", es: "al-Tahbir fi al-Mujam al-Kabir", fr: "al-Tahbir fi al-Mujam al-Kabir", ur: "التحبیر فی المعجم الکبیر", tr: "Büyük Sözlükte Mürekkepleme", id: "Tinta dalam Kamus Besar" }
summary:
  ar: "معجم السمعاني في تراجم علماء عصره رجالاً ونساءً، يزيد على ألف ومائتي ترجمة، لمن لقيه في طلبه بمرو ونيسابور وأصبهان وغيرها أو راسله أو أجازه؛ نسخه المستوفى في السنة التي سبقت وفاته، وفي التاريخ ثلاثمائة طاقة {cite:encyclopaedia-of-islam-2 vol. 8 p. 1025} {cite:tarikh-islam-dhahabi p. 122}."
  en: "Al-Sam'ani's dictionary of contemporary scholars, men and women — more than 1,200 biographies of those he met on his talab at Marw, Nishapur, Isfahan and beyond, or corresponded with, or who granted him ijaza; he produced the clean copy in the year before his death; 300 folios per the Tarikh {cite:encyclopaedia-of-islam-2 vol. 8 p. 1025} {cite:tarikh-islam-dhahabi p. 122}."
  es: "El diccionario de Al-Sam'ani de eruditos contemporáneos, hombres y mujeres, contiene más de 1200 biografías de aquellos con quienes se encontró en su talab en Marw, Nishapur, Isfahan y más allá, o con quienes se carteó, o que le otorgaron ijaza; produjo la copia limpia el año anterior a su muerte; 300 folios según el Tarikh {cite:encyclopaedia-of-islam-2 vol. 8 p. 1025} {cite:tarikh-islam-dhahabi p. 122}."
  fr: "Le dictionnaire d'Al-Sam'ani des érudits contemporains, hommes et femmes — plus de 1 200 biographies de ceux qu'il a rencontrés lors de son talab à Marw, Nishapur, Ispahan et au-delà, ou avec qui il a correspondu, ou qui lui ont accordé une ijaza; il a produit la copie propre l'année précédant sa mort; 300 folios selon le Tarikh {cite:encyclopaedia-of-islam-2 vol. 8 p. 1025} {cite:tarikh-islam-dhahabi p. 122}."
  ur: "السمانی کی معاصر علماء، مردوں اور عورتوں کی لغت - 1,200 سے زیادہ ان لوگوں کی سوانح عمری جن سے وہ مرو، نیشاپور، اصفہان اور اس سے آگے اپنے تالب پر ملے، یا ان سے خط و کتابت کی، یا جنہوں نے انہیں اعجاز عطا کیا۔ اس نے اپنی موت سے ایک سال پہلے کلین کاپی تیار کی تھی۔ 300 فولیو فی تاریخ {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 8ص 1025} {حوالہ: تاریخ اسلام ذہبی ص۔ 122}۔"
  tr: "El-Sam'ani Zamanının Bilim İnsanları Erkek ve Kadınlar Biyografileri Sözlüğü, Marw, Nişapur, İsfahan ve başka yerlerde karşılaştığı ya da kendisine yazıştığı ya da izin verdiği kişilerin bin iki yüzü aşkın çevirisini içerir; ölümünden bir yıl önce kopyalamıştır ve tarih üç yüz cilttir {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 1025} {cite:Tarikh-Islam-dhahabi, s. 122}."
  id: "Kamus Al-Sam'ani tentang Biografi Para Ulama Zamannya, Pria dan Wanita, memuat lebih dari seribu dua ratus terjemahan dari mereka yang ditemuinya di Marw, Nishapur, Isfahan, dan tempat lain, atau yang berkorespondensi atau memberinya izin; ia menyalinnya setahun sebelum kematiannya, dan dalam sejarahnya terdapat tiga ratus jilid {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 1025} {cite:Tarikh-Islam-dhahabi, hlm. 122}."
