summary:
  ar: "شرح بدر الدين العيني على «الهداية» للمرغيناني في عشر مجلدات، يتوسع فيه جداً في تخريج أحاديث الأحكام وبيان مذاهب علماء الأمصار، كما تصفه الترجمة المطبوعة مع عمدة القاري {cite:umdat-qari-ilmiyya-2001-v1 p. 17}."
  en: "Badr al-Din al-'Ayni's commentary on al-Marghinani's al-Hidaya in ten volumes, very full in documenting the hadiths of rulings and setting out the schools of the scholars of the great cities, as the biography printed with 'Umdat al-Qari describes it {cite:umdat-qari-ilmiyya-2001-v1 p. 17}."
  ur: "بدر الدین عینی کی مرغینانی کی «الہدایہ» پر دس جلدوں میں شرح، جس میں احکام کی احادیث کی تخریج اور شہروں کے علماء کے مذاہب کا بہت تفصیلی بیان ہے، جیسا کہ عمدۃ القاری کے ساتھ چھپا ترجمہ اسے بیان کرتا ہے {cite:umdat-qari-ilmiyya-2001-v1 p. 17}۔"
  es: "Comentario de Badr al-Din al-'Ayni sobre al-Hidaya de al-Marghinani en diez volúmenes, muy completo en la documentación de los hadices de las sentencias y en la exposición de las escuelas de los eruditos de las grandes ciudades, como lo describe la biografía impresa con 'Umdat al-Qari {cita:umdat-qari-ilmiyya-2001-v1 p. 17}."
  fr: "Le commentaire de Badr al-Din al-'Ayni sur al-Hidaya d'al-Marghinani en dix volumes, très complet en documentant les hadiths des décisions et en présentant les écoles des savants des grandes villes, comme le décrit la biographie imprimée avec 'Umdat al-Qari {cite:umdat-qari-ilmiyya-2001-v1 p. 17}."
  tr: "Badr al-Din al-Ayni'nin 'Al-Hidayah' üzerine on ciltlik tefsiri, hükümlerin hadislerini kapsamlı şekilde analiz eder ve bölge alimlerinin mezhebini açıklar; bu, Umdat al-Qari ile basılı biyografisinde açıklanmıştır {cite:umdat-qari-ilmiyya-2001-v1, s. 17}."
  id: "Komentar Badr al-Din al-Ayni atas 'Al-Hidayah' oleh Al-Marghinani dalam sepuluh jilid, di mana ia menganalisis secara mendalam hadits tentang keputusan-putusan dan memperjelas aliran para ulama di wilayah tersebut, sebagaimana dijelaskan dalam biografi cetak bersama Umdat al-Qari {cite:umdat-qari-ilmiyya-2001-v1, hlm. 17}."
