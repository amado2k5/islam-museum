summary:
  ar: "شرح بدر الدين العيني على «الهداية» للمرغيناني في عشر مجلدات، يتوسع فيه جداً في تخريج أحاديث الأحكام وبيان مذاهب علماء الأمصار، كما تصفه الترجمة المطبوعة مع عمدة القاري {cite:umdat-qari-ilmiyya-2001-v1 p. 17}."
  en: "Badr al-Din al-'Ayni's commentary on al-Marghinani's al-Hidaya in ten volumes, very full in documenting the hadiths of rulings and setting out the schools of the scholars of the great cities, as the biography printed with 'Umdat al-Qari describes it {cite:umdat-qari-ilmiyya-2001-v1 p. 17}."
  ur: "بدر الدین عینی کی مرغینانی کی «الہدایہ» پر دس جلدوں میں شرح، جس میں احکام کی احادیث کی تخریج اور شہروں کے علماء کے مذاہب کا بہت تفصیلی بیان ہے، جیسا کہ عمدۃ القاری کے ساتھ چھپا ترجمہ اسے بیان کرتا ہے {cite:umdat-qari-ilmiyya-2001-v1 p. 17}۔"
