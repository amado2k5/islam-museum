label:
  ar: "مبادرة النصوص الإسلامية المفتوحة (OpenITI)"
  en: "Open Islamicate Texts Initiative (OpenITI)"
  ur: "اوپن اسلامیکیٹ ٹیکسٹس انیشی ایٹو (OpenITI)"
summary:
  ar: "مبادرة أكاديمية متعددة المؤسسات منذ 2016، يقودها باحثون في جامعة الآغا خان بلندن ومعهد روشن بجامعة ميريلاند وجامعة هامبورغ، لبناء البنية الرقمية لدراسة الثقافات الإسلامية: التعرف الآلي على الحروف العربية المطبوعة والمخطوطة بمحرك Kraken المفتوح، ومعايير لترميز النصوص، ومدونة مفتوحة للنصوص العربية والفارسية والتركية العثمانية والأردية."
  en: "A multi-institutional academic initiative since 2016, led by researchers at the Aga Khan University in London, the Roshan Institute at the University of Maryland and Universität Hamburg, building digital infrastructure for Islamicate studies: optical and handwritten text recognition for Arabic script on the open Kraken engine, text-encoding standards, and an open corpus of Arabic, Persian, Ottoman Turkish and Urdu texts."
  ur: "2016 سے کئی اداروں کی علمی مبادرت، جس کی قیادت لندن میں آغا خان یونیورسٹی، یونیورسٹی آف میری لینڈ کے روشن انسٹی ٹیوٹ اور ہیمبرگ یونیورسٹی کے محققین کرتے ہیں؛ اسلامی ثقافتوں کے مطالعے کا ڈیجیٹل ڈھانچہ: کھلے Kraken انجن پر عربی رسم الخط کی چھپی اور ہاتھ کی تحریر کی شناخت، ترمیزِ متن کے معیارات، اور عربی، فارسی، عثمانی ترکی اور اردو متون کا کھلا مجموعہ۔"
