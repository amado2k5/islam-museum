label: { ar: "قرار مجمع الفقه الإسلامي الدولي 176 (19/2) بشأن حرية التعبير عن الرأي: ضوابطها وأحكامها", en: "IIFA resolution 176 (19/2) on freedom of expression: its controls and rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 176 (19/2): اظہارِ رائے کی آزادی — اس کے ضوابط اور احکام", es: "Resolución 176 (19/2) de la IIFA sobre la libertad de expresión: sus controles y resoluciones", fr: "Résolution 176 (19/2) de l'IIFA sur la liberté d'expression: ses contrôles et ses décisions" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. عرّف حرية التعبير بأنها تمتع الإنسان بكامل إرادته في الجهر بما يراه صوابًا ومحققًا للنفع له وللمجتمع في الشؤون الخاصة والقضايا العامة، وقرر أنها حق مصون في الإسلام في إطار ضوابط شرعية، من أهمها في نص القرار: عدم الإساءة للغير بما يمس حياته أو عرضه أو سمعته أو مكانته كالانتقاص والازدراء والسخرية ونشر ذلك بأي وسيلة؛ الموضوعية ولزوم الصدق والنزاهة والتجرد عن الهوى؛ الالتزام بالمسؤولية والمحافظة على مصالح المجتمع وقيمه؛ مشروعية وسيلة التعبير إذ لا تبرر الغاية المشروعة وسيلة غير مشروعة؛ وضوابط أخرى في أدب الاختلاف وحدود النصح والإنكار بين الأمر بالمعروف وحرمة التجسس والتشهير."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It defined freedom of expression as a person's enjoying full will to declare openly what he holds right and beneficial for himself and society, in private affairs and public issues, and resolved that it is a protected right in Islam within legal controls — chief among them, in the resolution's own text: no injury to another touching his life, honour, reputation or standing, such as belittling, contempt and mockery, published by any means; objectivity with truthfulness, integrity and freedom from bias; responsibility and preservation of society's interests and values; and lawfulness of the means of expression, a legitimate end not justifying an illegitimate means — alongside further controls on the etiquette of disagreement and the bounds between enjoining right and the prohibitions of spying and defamation."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے اظہارِ رائے کی آزادی کی تعریف کی: انسان کا پوری مرضی سے وہ بات کھل کر کہنا جو وہ اپنے اور معاشرے کے لیے صحیح اور مفید سمجھتا ہے، خواہ نجی معاملات ہوں یا عوامی مسائل؛ اور قرار دیا کہ یہ اسلام میں شرعی ضوابط کے دائرے میں ایک محفوظ حق ہے — متن کے مطابق اہم ضوابط یہ ہیں: کسی کی جان، عزت، ساکھ یا منصب کو نقصان نہ پہنچانا، جیسے تنقیص، تحقیر اور مذاق اور اسے کسی بھی وسیلے سے پھیلانا؛ صداقت، دیانت اور جانب داری سے تجرد کے ساتھ موضوعیت؛ ذمہ داری کا التزام اور معاشرے کے مفادات و اقدار کی حفاظت؛ اور اظہار کے ذریعے کی شرعیت — مشروع غرض غیر مشروع ذریعے کو جائز نہیں بناتی — اس کے علاوہ اختلاف کے آداب اور نیکی کے حکم اور جاسوسی و بدنامی کی حرمت کے درمیان حدود کے مزید ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009). Definió la libertad de expresión como el pleno derecho de una persona a declarar abiertamente lo que considera correcto y beneficioso para sí misma y para la sociedad, tanto en asuntos privados como públicos, y resolvió que es un derecho protegido en el Islam dentro de controles legales, entre los que destacan, en el propio texto de la resolución: no causar daño a otra persona que afecte su vida, honor, reputación o posición, como menospreciar, despreciar y burlarse, publicado por cualquier medio; objetividad con veracidad, integridad y ausencia de prejuicios; responsabilidad y preservación de los intereses y valores de la sociedad; y legalidad de los medios de expresión, un fin legítimo que no justifique un medio ilegítimo, junto con controles adicionales sobre la etiqueta del desacuerdo y los límites entre la imposición del derecho y las prohibiciones de espionaje y difamación."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 19e session à Sharjah (1er-5 Jumada al-Ula 1430, 26-30 avril 2009) définit la liberté d'expression comme le droit de chacun de déclarer ouvertement ce qu'il juge juste et bénéfique pour lui-même et pour la société, tant dans sa vie privée que dans l'actualité publique. Elle affirme qu'il s'agit d'un droit protégé en Islam, dans le respect des règles légales. Parmi celles-ci, les principales, énoncées dans le texte même de la résolution, sont les suivantes: l'interdiction de porter atteinte à la vie, à l'honneur, à la réputation ou à la position d'autrui, notamment par le dénigrement, le mépris et la moquerie, quel que soit le moyen de diffusion; l'objectivité, la sincérité, l'intégrité et l'impartialité; la responsabilité et la préservation des intérêts et des valeurs de la société; et la licéité des moyens d'expression, une fin légitime ne justifiant pas des moyens illégitimes. S'y ajoutent des règles encadrant les désaccords et les limites entre l'injonction du droit et les interdictions d'espionnage et de diffamation."
