label: { ar: "كتاب الرسول ليحنة بن رؤبة وأهل أيلة", en: "The Prophet's letter of safe-conduct to Yuhanna ibn Ru'ba and the people of Ayla" }
summary:
  ar: "كتاب أمان كتبه النبي ليحنة بن رؤبة وأهل أيلة، سفنهم وسيارتهم في البر والبحر، ومن كان معهم من أهل الشام واليمن والبحر؛ يجعل لهم ذمة الله وذمة محمد، وينص على أن من أحدث منهم حدثاً لا يحول ماله دون نفسه، وأنه لا يحل أن يُمنعوا ماء يردونه ولا طريقاً يريدونه من بر أو بحر."
  en: A letter of safe-conduct the Prophet wrote for Yuhanna ibn Ru'ba and the people of Ayla, their ships and their caravans on land and sea, and whoever was with them of the people of al-Sham, Yemen and the sea; it places them under the protection of God and of Muhammad, stipulates that the property of whoever among them commits a wrong shall not shield him personally, and that they may not be barred from water they come to or a road they wish on land or sea.
