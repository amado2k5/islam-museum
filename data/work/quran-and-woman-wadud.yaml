summary:
  ar: "دراسة بالإنجليزية لأمينة ودود في قراءة آيات القرآن المتعلقة بالمرأة من منظور نسائي، صدرت عن دار فجر بكتي مع مطبعة جامعة أكسفورد في كوالالمبور سنة 1992."
  en: "An English study by Amina Wadud of a reading of the Qur'anic verses on women from a woman's perspective, published by Fajar Bakti with Oxford University Press, Kuala Lumpur in 1992."
  ur: "امینہ ودود کا انگریزی مطالعہ جو عورت کے نقطۂ نظر سے عورتوں سے متعلق قرآنی آیات کی قراءت پر ہے؛ فجر بکتی اور آکسفورڈ یونیورسٹی پریس، کوالالمپور سے 1992ء میں شائع ہوا۔"
  es: "Un estudio en inglés de Amina Wadud sobre la lectura de los versículos coránicos acerca de la mujer desde la perspectiva femenina, publicado por Fajar Bakti con Oxford University Press, Kuala Lumpur en 1992."
  fr: "Une étude en anglais d'Amina Wadud sur une lecture des versets coraniques sur les femmes du point de vue d'une femme, publiée par Fajar Bakti avec Oxford University Press, Kuala Lumpur en 1992."
  tr: "Amina Wadood'un feminist bir bakış açısından kadınlarla ilgili Kur'an ayetlerinin okunması üzerine İngilizce bir çalışma, 1992'de Fajr Bakti Yayıncılık tarafından Kuala Lumpur'daki Oxford Üniversitesi Yayınları ile iş birliği içinde yayımlanmıştır."
  id: "Sebuah studi berbahasa Inggris oleh Amina Wadood tentang pembacaan ayat-ayat Al-Qur'an yang berkaitan dengan perempuan dari perspektif feminis, diterbitkan oleh Fajr Bakti Publishing House bekerja sama dengan Oxford University Press di Kuala Lumpur pada tahun 1992."
