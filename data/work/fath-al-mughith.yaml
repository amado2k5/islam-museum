  ar: "شرح السخاوي على ألفية العراقي في علوم الحديث، وصفه ابن العماد بأنه لا يُعلم أجمع منه ولا أكثر تحقيقاً لمن تدبره {cite:shadharat-dhahab p. 432}."
  en: "Al-Sakhawi's commentary on al-Iraqi's Alfiyya on the sciences of hadith; Ibn al-Imad says no more comprehensive or more exacting treatment is known to the careful reader {cite:shadharat-dhahab p. 432}."
  ur: "سخاوی کی عراقی کی الفیہِ حدیث پر شرح؛ ابن عماد کہتا ہے کہ غور کرنے والے کے لیے اس سے زیادہ جامع اور محتاط شرح معلوم نہیں {cite:shadharat-dhahab p. 432}۔"
  es: "Comentario de Al-Sakhawi sobre la obra Al-Iraqi, Alfiyya, sobre las ciencias del hadiz; Ibn al-Imad afirma que el lector atento no conoce un tratamiento más completo ni más riguroso {cite:shadharat-dhahab p. 432}."
  fr: "Le commentaire d'Al-Sakhawi sur l'Alfiyya d'al-Iraqi sur les sciences du hadith; Ibn al-Imad dit qu'aucun traitement plus complet ou plus rigoureux n'est connu du lecteur attentif {cite:shadharat-dhahab p. 432}."
