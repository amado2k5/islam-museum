id: work/fatwa-amja-no-two-witrs-one-night
class: work
kind: fatwa
label: { ar: "لا وتران في ليلة", en: "Witr prayed early, then tahajjud — no two witrs in a night", ur: "ایک رات میں دو وتر نہیں", es: "Se rezó el Witr temprano, luego el Tahajjud; no se rezó dos Witrs en una noche.", fr: "Prière de Witr tôt le matin, puis tahajjud — pas deux prières de Witr dans la même nuit" }
summary:
  ar: "سأل سائل أن معظم الإخوة والأخوات في مسجدهم يقومون معهم التراويح ثم يوترون مع الإمام أول الليل ثم يقيمون التهجد آخره. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87276 بتاريخ 11 أغسطس 2012)⁩ أنه لا حرج في هذه الصورة مع التأكيد أنه لا وتران في ليلة وأن من أوتر أول الليل لا يكرر الوتر آخره وإن حضر التهجد آخر الليل وأراد أن يشهد الوتر مع الإمام فليبطله على ما فصّل الجواب."
  en: "A questioner described most brothers and sisters at their mosque praying tarawih, doing witr with the imam early, then holding tahajjud at night's end. AMJA's fatwa committee (fatwa no. 87276, 11 August 2012) answered that there is no harm in this form — stressing there are no two witrs in one night: who prayed witr early does not repeat it late, and one attending tahajjud who wishes to stand witr with the imam voids his earlier one — as the answer details."
  ur: "پہلے وتر پھر تہجد؟ لجنة الفتوى ⁦(فتویٰ 87276، 11 اگست 2012)⁩ کے مطابق جائز — ایک رات میں دو وتر نہیں۔"
  es: "Un consultante describió que la mayoría de los hermanos y hermanas en su mezquita rezaban el tarawih, hacían el witr con el imán temprano y luego realizaban el tahajjud al final de la noche. El comité de fatwas de AMJA (fatwa n.° 87276, 11 de agosto de 2012) respondió que no hay ningún problema en esta forma, haciendo hincapié en que no se realizan dos witrs en una misma noche: quien rezó el witr temprano no lo repite tarde, y quien asiste al tahajjud y desea hacer el witr con el imán anula el que realizó anteriormente, como se detalla en la respuesta."
  fr: "Un internaute a décrit comment la plupart des fidèles de sa mosquée accomplissent la prière de tarawih, la prière de witr avec l'imam tôt le matin, puis la prière de tahajjud en fin de nuit. Le comité de fatwas de l'AMJA (fatwa n° 87276, 11 août 2012) a répondu qu'il n'y a aucun mal à cette pratique, soulignant qu'il n'y a pas deux prières de witr dans la même nuit: celui qui a prié le witr tôt le matin ne le répète pas tard le soir, et celui qui participe à la prière de tahajjud et souhaite prier le witr avec l'imam annule sa prière de witr précédente, comme le précise la réponse."
