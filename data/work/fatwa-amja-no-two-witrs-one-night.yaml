id: work/fatwa-amja-no-two-witrs-one-night
class: work
kind: fatwa
label: { ar: "لا وتران في ليلة", en: "Witr prayed early, then tahajjud — no two witrs in a night", ur: "ایک رات میں دو وتر نہیں" }
summary:
  ar: "سأل سائل أن معظم الإخوة والأخوات في مسجدهم يقومون معهم التراويح ثم يوترون مع الإمام أول الليل ثم يقيمون التهجد آخره. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87276 بتاريخ 11 أغسطس 2012)⁩ أنه لا حرج في هذه الصورة مع التأكيد أنه لا وتران في ليلة وأن من أوتر أول الليل لا يكرر الوتر آخره وإن حضر التهجد آخر الليل وأراد أن يشهد الوتر مع الإمام فليبطله على ما فصّل الجواب."
  en: "A questioner described most brothers and sisters at their mosque praying tarawih, doing witr with the imam early, then holding tahajjud at night's end. AMJA's fatwa committee (fatwa no. 87276, 11 August 2012) answered that there is no harm in this form — stressing there are no two witrs in one night: who prayed witr early does not repeat it late, and one attending tahajjud who wishes to stand witr with the imam voids his earlier one — as the answer details."
  ur: "پہلے وتر پھر تہجد؟ لجنة الفتوى ⁦(فتویٰ 87276، 11 اگست 2012)⁩ کے مطابق جائز — ایک رات میں دو وتر نہیں۔"
