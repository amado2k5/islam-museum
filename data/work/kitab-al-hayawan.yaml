label: { ar: "كتاب الحيوان", en: "Kitab al-Hayawan (The Book of Animals)", ur: "کتاب الحیوان" }
summary:
  ar: "كتاب أبي عثمان عمرو بن بحر الجاحظ في الحيوان، في سبعة مصاحف ⁦(أجزاء)⁩، يمضي فيه من أصناف الحيوان إلى القرآن والحديث والشعر والأمثال والكلام والطبيعيات، ويفتتحه بالرد على من عاب كتبه؛ ويقول محققه محمد باسل عيون السود إن عنوانه يوهم أنه مقصور على الحيوان وهو يتضمن علوماً أكبر من العنوان {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}."
  en: "Abu 'Uthman 'Amr ibn Bahr al-Jahiz's book on animals, in seven parts (masahif), which moves from the kinds of animals to the Qur'an, hadith, poetry, proverbs, theology and natural philosophy, and opens with a reply to a critic of his books; its editor Muhammad Basil 'Uyun al-Sud says the title suggests it is confined to animals while it holds far more {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}."
  ur: "ابو عثمان عمرو بن بحر جاحظ کی حیوانات پر کتاب، سات مصاحف (اجزاء) میں، جو حیوانات کی اقسام سے قرآن، حدیث، شعر، امثال، کلام اور طبیعیات تک جاتی ہے اور اپنی کتابوں پر عیب لگانے والے کے جواب سے شروع ہوتی ہے؛ اس کے محقق محمد باسل عیون السود کہتے ہیں کہ عنوان سے لگتا ہے کہ یہ صرف حیوان تک محدود ہے، حالانکہ اس میں عنوان سے کہیں زیادہ علوم ہیں {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}۔"
