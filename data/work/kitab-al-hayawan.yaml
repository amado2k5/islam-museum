label: { ar: "كتاب الحيوان", en: "Kitab al-Hayawan (The Book of Animals)", ur: "کتاب الحیوان", es: "Kitab al-Hayawan (El Libro de los Animales)", fr: "Kitab al-Hayawan (Le Livre des Animaux)", tr: "Hayvan Kitabı", id: "Buku Hewan" }
summary:
  ar: "كتاب أبي عثمان عمرو بن بحر الجاحظ في الحيوان، في سبعة مصاحف ⁦(أجزاء)⁩، يمضي فيه من أصناف الحيوان إلى القرآن والحديث والشعر والأمثال والكلام والطبيعيات، ويفتتحه بالرد على من عاب كتبه؛ ويقول محققه محمد باسل عيون السود إن عنوانه يوهم أنه مقصور على الحيوان وهو يتضمن علوماً أكبر من العنوان {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}."
  en: "Abu 'Uthman 'Amr ibn Bahr al-Jahiz's book on animals, in seven parts (masahif), which moves from the kinds of animals to the Qur'an, hadith, poetry, proverbs, theology and natural philosophy, and opens with a reply to a critic of his books; its editor Muhammad Basil 'Uyun al-Sud says the title suggests it is confined to animals while it holds far more {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}."
  ur: "ابو عثمان عمرو بن بحر جاحظ کی حیوانات پر کتاب، سات مصاحف ⁦(اجزاء)⁩ میں، جو حیوانات کی اقسام سے قرآن، حدیث، شعر، امثال، کلام اور طبیعیات تک جاتی ہے اور اپنی کتابوں پر عیب لگانے والے کے جواب سے شروع ہوتی ہے؛ اس کے محقق محمد باسل عیون السود کہتے ہیں کہ عنوان سے لگتا ہے کہ یہ صرف حیوان تک محدود ہے، حالانکہ اس میں عنوان سے کہیں زیادہ علوم ہیں {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}۔"
  es: "El libro de Abu 'Uthman 'Amr ibn Bahr al-Jahiz sobre los animales, en siete partes (masahif), que va desde los tipos de animales hasta el Corán, hadices, poesía, proverbios, teología y filosofía natural, y comienza con una respuesta a un crítico de sus libros; su editor Muhammad Basil 'Uyun al-Sud dice que el título sugiere que se limita a los animales cuando en realidad abarca mucho más {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}."
  fr: "Le livre d'Abu 'Uthman 'Amr ibn Bahr al-Jahiz sur les animaux, en sept parties (masahif), qui passe des espèces animales au Coran, aux hadiths, à la poésie, aux proverbes, à la théologie et à la philosophie naturelle, et s'ouvre sur une réponse à un critique de ses livres; son éditeur Muhammad Basil 'Uyun al-Sud dit que le titre suggère qu'il se limite aux animaux alors qu'il contient beaucoup plus {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 p. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 p. 155}."
  tr: "Ebu Osman Amr ibn Bahr al-Jahiz'in hayvanlar üzerine yazdığı yedi ciltlik hayvan türlerinden Kur'an, hadis, şiir, atasözleri, teoloji ve doğa bilimlerine geçer ve kitaplarını eleştirenleri çürüterek açar. Editörü Muhammad Basil 'Uyoon al-Suwad, başlığının hayvanlarla sınırlı olduğu izlenimini verdiğini ve başlıktan daha büyük bilimleri içerdiğini belirtir {cite:hayawan-jahiz-ilmiyya-2003-v1 s. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 s. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 s. 155}."
  id: "Buku Abu Uthman Amr ibn Bahr al-Jahiz tentang hewan, dalam tujuh Al-Qur'an (jilid), ia beralih dari spesies hewan ke Al-Qur'an, hadis, puisi, perisal, teologi, dan ilmu alam, lalu membukanya dengan membantah mereka yang mengkritik bukunya. Editornya Muhammad Basil 'Uyoon al-Suwad mengatakan judulnya memberi kesan bahwa buku ini terbatas pada hewan dan mencakup ilmu yang lebih besar dari judul {cite:hayawan-jahiz-ilmiyya-2003-v1 hlm. 4} {cite:hayawan-jahiz-ilmiyya-2003-v1 hlm. 7} {cite:hayawan-jahiz-ilmiyya-2003-v4 hlm. 155}."
