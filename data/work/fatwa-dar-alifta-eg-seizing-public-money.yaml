id: work/fatwa-dar-alifta-eg-seizing-public-money
class: work
kind: fatwa
label: { ar: "حكم الاستيلاء على المال العام", en: "Seizing public money", ur: "سرکاری مال پر قبضہ", es: "Confiscarse dinero público", fr: "Saisie de fonds publics" }
summary:
  ar: "سائل سأل عن الاستيلاء على المال العام بالتحايل على القوانين والقرارات المنظمة بالإدلاء ببيانات خاطئة للحصول على المساعدات المالية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21587)⁩ أن ذلك حرام على ما فصّل الجواب."
  en: "A questioner asked about seizing public money — circumventing the regulating laws and decisions by giving false statements to obtain financial aid. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21587) answered that this is forbidden, as the answer details."
  ur: "ایک سائل نے سرکاری مال پر قبضے کا حکم پوچھا یعنی قوانین سے چکر کھا کر غلط بیانات سے مالی امداد حاصل کرنا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21587)⁩ نے جواب دیا کہ یہ حرام ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la apropiación indebida de fondos públicos, es decir, eludir las leyes y decisiones regulatorias mediante declaraciones falsas para obtener ayuda financiera. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21587) respondió que esto está prohibido, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le détournement de fonds publics – c'est-à-dire le contournement des lois et décisions en vigueur par de fausses déclarations afin d'obtenir une aide financière. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21587) a répondu que cela est interdit, comme indiqué dans sa réponse."
