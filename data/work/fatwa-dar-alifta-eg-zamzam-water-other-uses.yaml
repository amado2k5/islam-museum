summary:
  ar: "سائل سأل عن استعمال ماء زمزم في غير الشرب كالوضوء والاغتسال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22013)⁩ أن استعماله في شيء ليس فيه امتهان للماء جائز شرعًا ولا حرج فيه على ما فصّل الجواب."
  en: "A questioner asked about using Zamzam water for other than drinking, such as wudu and washing. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22013) answered that using it where the water is not demeaned is lawful and unobjectionable, as the answer details."
  ur: "ایک سائل نے آبِ زمزم کا پینے کے سوا استعمال جیسے وضو اور غسل کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22013)⁩ نے جواب دیا کہ جہاں پانی کی بے ادبی نہ ہو اس کا استعمال جائز اور بلا حرج ہے، جیسا کہ جواب میں تفصیل ہے۔"
