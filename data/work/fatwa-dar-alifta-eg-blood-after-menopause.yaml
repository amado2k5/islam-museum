label: { ar: "حكم الدم النازل على المرأة بعد انقطاع الحيض عنها", en: "Blood seen by a woman after her menses have ceased", ur: "حیض بند ہونے کے بعد عورت کو آنے والے خون کا حکم" }
summary:
  ar: "سائلة تجاوزت السادسة والخمسين نزل عليها دم بعد عام من انقطاع الحيض واستمر خمسة أيام فسألت عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21869)⁩ ببيان حكم هذا الدم وما يترتب عليه من الصلاة والصيام على وجهه."
  en: "A woman over fifty-six had bleeding a year after her menses ceased, lasting five days, and asked its ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21869) answered by setting out the ruling on this blood and what follows for prayer and fasting."
  ur: "چپن سال سے بڑی عورت کو حیض بند ہوئے ایک سال بعد خون آیا جو پانچ دن رہا؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21869)⁩ نے جواب میں اس خون کا حکم اور نماز و روزے پر اس کے اثرات بیان کیے۔"
