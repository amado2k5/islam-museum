id: work/fatwa-dar-alifta-eg-blood-after-menopause
class: work
kind: fatwa
label: { ar: "حكم الدم النازل على المرأة بعد انقطاع الحيض عنها", en: "Blood seen by a woman after her menses have ceased", ur: "حیض بند ہونے کے بعد عورت کو آنے والے خون کا حکم", es: "Sangre que ve una mujer después de que haya cesado su menstruación.", fr: "Du sang aperçu par une femme après la fin de ses règles", tr: "Bir kadının adet dönemi durduktan sonra üzerine düşen kan hakkındaki karar", id: "Aturan tentang darah yang jatuh pada wanita setelah menstruasinya berhenti" }
summary:
  ar: "سائلة تجاوزت السادسة والخمسين نزل عليها دم بعد عام من انقطاع الحيض واستمر خمسة أيام فسألت عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21869)⁩ ببيان حكم هذا الدم وما يترتب عليه من الصلاة والصيام على وجهه."
  en: "A woman over fifty-six had bleeding a year after her menses ceased, lasting five days, and asked its ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21869) answered by setting out the ruling on this blood and what follows for prayer and fasting."
  ur: "چپن سال سے بڑی عورت کو حیض بند ہوئے ایک سال بعد خون آیا جو پانچ دن رہا؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21869)⁩ نے جواب میں اس خون کا حکم اور نماز و روزے پر اس کے اثرات بیان کیے۔"
  es: "Una mujer mayor de cincuenta y seis años presentó sangrado un año después de que cesara su menstruación, el cual duró cinco días, y solicitó una resolución al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21869) respondió estableciendo la norma sobre este sangrado y las recomendaciones posteriores en cuanto a la oración y el ayuno."
  fr: "Une femme de plus de cinquante-six ans a présenté des saignements, un an après la fin de ses règles, durant cinq jours, et a demandé conseil à ce sujet. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21869) a répondu en énonçant la règle concernant ces saignements et les obligations qui en découlent en matière de prière et de jeûne."
  tr: "Elli altı yaşından büyük bir kadın, beş gün süren bir adet döneminden sonra kanama yaşadı ve kararını sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21869), bu kan üzerindeki hükmü ve namaz ile oruç tutmanın sonuçlarını netleştirdi."
  id: "Seorang wanita berusia lebih dari lima puluh enam tahun mengalami pendarahan setelah setahun menstruasi selama lima hari, sehingga ia menanyakan tentang keputusannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21869) menanggapi dengan memperjelas keputusan tentang darah ini dan konsekuensi dari salat dan puasa di wajahnya."
