kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 15: سيرة رسول الله 15 | كيف استحق أبو بكر مكانته في الإسلام؟"
  en: "The Biography of the Messenger of God 2026, episode 15: How did Abu Bakr earn his place in Islam?"
  ur: "سیرتِ رسول اللہ 2026، قسط 15: ابوبکر نے اسلام میں اپنا مقام کیسے حاصل کیا؟"
  fr: "La biographie du Messager de Dieu 2026, épisode 15 : Comment Abu Bakr a-t-il mérité sa place dans l'Islam ?"
  es: "La biografía del Mensajero de Dios 2026, episodio 15: ¿Cómo se ganó Abu Bakr su lugar en el islam?"
summary:
  ar: "يفتتح المتحدث بترجمة الأرقم بن أبي الأرقم، صاحب الدار التي خدمت الجماعة المسلمة الأولى، من كتاب سليمان العودة عن البدريين. ثم يقرأ قصيدة أبي طالب الطويلة في الحماية من سيرة ابن إسحاق مع تعليقات السهيلي اللغوية، وينتقل إلى الدعوة العلنية وما لقيه النبي من أذى في الأسواق وأثناء الصلاة، ويختم بدور أبي بكر في عتق المعذَّبين وببني تيم."
  en: "The speaker opens with a biography of al-Arqam ibn Abi al-Arqam, whose house served the early community, drawn from Sulayman al-Awda's book on the Badr veterans. He then reads Abu Talib's long poem of protection from Ibn Ishaq's Sira with al-Suhayli's linguistic commentary, turns to the open call and the abuse the Prophet met in the markets and at prayer, and closes with Abu Bakr's role in freeing the tortured and with the clan of Banu Taym."
  ur: "مقرر سلیمان العودہ کی بدریوں پر لکھی گئی کتاب سے ارقم بن ابی الارقم کی سوانح سے آغاز کرتے ہیں، جن کا گھر ابتدائی مسلم جماعت کے کام آیا۔ پھر وہ ابن اسحاق کی سیرت سے ابو طالب کا حفاظت کے بارے میں طویل قصیدہ سہیلی کی لغوی شرح کے ساتھ پڑھتے ہیں، کھلی دعوت اور بازاروں اور نماز کے دوران نبی کو پہنچنے والی اذیت کی طرف آتے ہیں، اور آخر میں اذیت زدہ لوگوں کو آزاد کرانے میں ابوبکر کے کردار اور بنو تیم پر بات ختم کرتے ہیں۔"
  fr: "Le conférencier ouvre par la biographie d'al-Arqam ibn Abi al-Arqam, dont la maison servit la première communauté, tirée du livre de Sulayman al-Awda sur les vétérans de Badr. Il lit ensuite le long poème de protection d'Abu Talib dans la Sira d'Ibn Ishaq, avec le commentaire linguistique d'al-Suhayli, passe à l'appel public et aux mauvais traitements subis par le Prophète sur les marchés et pendant la prière, et conclut sur le rôle d'Abu Bakr dans la libération des suppliciés et sur le clan des Banu Taym."
  es: "El conferenciante abre con la biografía de al-Arqam ibn Abi al-Arqam, cuya casa sirvió a la primera comunidad, tomada del libro de Sulayman al-Awda sobre los veteranos de Badr. Luego lee el largo poema de protección de Abu Talib de la Sira de Ibn Ishaq, con el comentario lingüístico de al-Suhayli, pasa a la llamada pública y a los maltratos que el Profeta sufrió en los mercados y durante la oración, y termina con el papel de Abu Bakr en la liberación de los torturados y con el clan de los Banu Taym."
