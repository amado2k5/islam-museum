label: { ar: "المنح القدسية على الحكم العطائية", en: "Al-Minah al-Qudsiyya 'ala al-Hikam al-'Ata'iyya", ur: "المنح القدسیہ علی الحکم العطائیہ" }
summary:
  ar: "شرح عبد الله بن حجازي الشرقاوي الخلوتي (ت 1227هـ) على حكم ابن عطاء الله، يصفه في أوله بأنه «تقييدات لطيفة» على الحكم التي يغلب عليها خطاب المريدين، وأتمه يوم السبت 13 شوال 1204هـ؛ ويقول هيكل إنه يكاد يكون تلخيصاً لشرح ابن عباد الرندي {cite:minah-qudsiyya-sharqawi-ilmiyya p. 2} {cite:minah-qudsiyya-sharqawi-ilmiyya p. 176} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}."
  en: "The commentary of 'Abd Allah ibn Hijazi al-Sharqawi al-Khalwati (d. 1227 AH) on the Hikam of Ibn 'Ata' Allah, which he calls at its start 'subtle annotations' on maxims mostly addressed to disciples, completed on Saturday 13 Shawwal 1204 AH; Haykal says it is almost a summary of Ibn 'Abbad al-Rundi's commentary {cite:minah-qudsiyya-sharqawi-ilmiyya p. 2} {cite:minah-qudsiyya-sharqawi-ilmiyya p. 176} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}."
  ur: "عبد اللہ بن حجازی شرقاوی خلوتی (م 1227ھ) کی ابن عطاء اللہ کے حکم پر شرح، جسے وہ آغاز میں ان حکم پر «لطیف تقییدات» کہتے ہیں جن میں زیادہ تر مریدوں سے خطاب ہے، اور جو ہفتہ 13 شوال 1204ھ کو مکمل ہوئی؛ ہیکل کہتے ہیں کہ یہ تقریباً ابن عباد رندی کی شرح کا خلاصہ ہے {cite:minah-qudsiyya-sharqawi-ilmiyya p. 2} {cite:minah-qudsiyya-sharqawi-ilmiyya p. 176} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}۔"
