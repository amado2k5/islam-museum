id: work/fatwa-amja-guide-dogs-blind-muslims
class: work
kind: fatwa
label: { ar: "كلاب إرشاد المكفوفين", en: "Guide dogs for blind Muslims — a dispensation of need", ur: "نابینا مسلمانوں کے لیے رہنما کتے" }
summary:
  ar: "طلبت مؤسسة الإسلام باللمس فتوى لمجتمع المسلمين المكفوفين عن اقتناء كلاب الإرشاد. أجابت اللجنة الدائمة للإفتاء بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87778 بتاريخ 14 يناير 2025)⁩ أنه يرخص للضرير في اقتناء كلب يقوده في الطريق أو يساعده في بعض أموره الحياتية لأنها حاجة تقاس على الحالات التي رخص فيها النبي في اقتناء الكلاب وهي كلب الصيد والزرع والماشية، وقد ذهب أكثر الفقهاء إلى أن إباحة اقتناء الكلب ليست محصورة في الحالات الثلاث وإنما يقاس عليها ما كانت الحاجة فيه إلى اقتنائه كحاجة الأعمى إلى كلبه على ما فصّل."
  en: "Islam By Touch petitioned for a fatwa for the blind Muslim community on keeping guide dogs. AMJA's Permanent Fatwa Committee (no. 87778, 14 January 2025) answered that a blind person is given leave to keep a dog to lead him in the road or assist him in some of his life-matters, this being a need measured by analogy on the cases in which the Prophet licensed keeping dogs — the hunting, crop and livestock dog; most jurists hold the permission is not confined to those three but extends by analogy to whatever keeping is a genuine need, such as the blind man's need of his dog — as the answer details."
  ur: "اسلام بائی ٹچ نے نابینا مسلمانوں کے لیے رہنما کتے رکھنے کا فتویٰ مانگا۔ مجمع کی کمیٹی ⁦(فتویٰ 87778، 14 جنوری 2025)⁩ کے مطابق نابینا کو رہنما کتے کی اجازت ہے — اکثر فقہاء اجازت کو صید کھیت مویشی سے آگے حاجت پر قیاس کرتے ہیں۔"
