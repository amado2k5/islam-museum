id: work/fatwa-amja-guide-dogs-blind-muslims
class: work
kind: fatwa
label: { ar: "كلاب إرشاد المكفوفين", en: "Guide dogs for blind Muslims — a dispensation of need", ur: "نابینا مسلمانوں کے لیے رہنما کتے", es: "Perros guía para musulmanes ciegos: una dispensa de la necesidad", fr: "Chiens guides pour les musulmans aveugles — une solution à un besoin", tr: "Kör rehberlik köpekleri", id: "Anjing pemandu tunanetra" }
summary:
  ar: "طلبت مؤسسة الإسلام باللمس فتوى لمجتمع المسلمين المكفوفين عن اقتناء كلاب الإرشاد. أجابت اللجنة الدائمة للإفتاء بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87778 بتاريخ 14 يناير 2025)⁩ أنه يرخص للضرير في اقتناء كلب يقوده في الطريق أو يساعده في بعض أموره الحياتية لأنها حاجة تقاس على الحالات التي رخص فيها النبي في اقتناء الكلاب وهي كلب الصيد والزرع والماشية، وقد ذهب أكثر الفقهاء إلى أن إباحة اقتناء الكلب ليست محصورة في الحالات الثلاث وإنما يقاس عليها ما كانت الحاجة فيه إلى اقتنائه كحاجة الأعمى إلى كلبه على ما فصّل."
  en: "Islam By Touch petitioned for a fatwa for the blind Muslim community on keeping guide dogs. AMJA's Permanent Fatwa Committee (no. 87778, 14 January 2025) answered that a blind person is given leave to keep a dog to lead him in the road or assist him in some of his life-matters, this being a need measured by analogy on the cases in which the Prophet licensed keeping dogs — the hunting, crop and livestock dog; most jurists hold the permission is not confined to those three but extends by analogy to whatever keeping is a genuine need, such as the blind man's need of his dog — as the answer details."
  ur: "اسلام بائی ٹچ نے نابینا مسلمانوں کے لیے رہنما کتے رکھنے کا فتویٰ مانگا۔ مجمع کی کمیٹی ⁦(فتویٰ 87778، 14 جنوری 2025)⁩ کے مطابق نابینا کو رہنما کتے کی اجازت ہے — اکثر فقہاء اجازت کو صید کھیت مویشی سے آگے حاجت پر قیاس کرتے ہیں۔"
  es: "Islam By Touch solicitó una fatwa para la comunidad musulmana ciega sobre la tenencia de perros guía. El Comité Permanente de Fatwas de AMJA (n.º 87778, 14 de enero de 2025) respondió que una persona ciega tiene permiso para tener un perro que la guíe en el camino o la asista en algunos asuntos de su vida, ya que esta necesidad se mide por analogía con los casos en los que el Profeta autorizó la tenencia de perros: el perro de caza, el perro de cultivo y el perro de ganado; la mayoría de los juristas sostienen que el permiso no se limita a esos tres, sino que se extiende por analogía a cualquier tenencia que sea una necesidad genuina, como la necesidad del ciego de su perro, como se detalla en la respuesta."
  fr: "L'organisation Islam By Touch a sollicité une fatwa pour la communauté musulmane aveugle concernant la possession de chiens guides. Le Comité permanent des fatwas de l'AMJA (n° 87778, 14 janvier 2025) a répondu qu'une personne aveugle est autorisée à posséder un chien pour la guider ou l'assister dans certains aspects de sa vie quotidienne. Ce besoin est justifié par analogie avec les cas où le Prophète a autorisé la possession de chiens – chiens de chasse, chiens agricoles et chiens de troupeau. La plupart des juristes estiment que cette permission ne se limite pas à ces trois catégories, mais s'étend par analogie à toute possession répondant à un besoin réel, tel que le besoin d'un chien pour une personne aveugle, comme le précise la réponse."
  tr: "Islam by Touch Vakfı, kör Müslüman topluluğu için rehberlik köpeklerinin edinilmesiyle ilgili bir fetva talep etmiştir. Amerikan Şeriat Hukukçuları Konseyi'ndeki Fetva Daimi Komitesi (14 Ocak 2025 tarihli 87778 sayılı Fetva) yanıt vermiştir; çünkü bu, Peygamber'in köpek edinmesine izin verdiği durumlar karşılaştırıldığında, yani av köpekleri, çiftçilik ve hayvancılık için bir zorunluluktur. Çoğu hukukçu, köpek sahibi olmanın izinliliğinin sadece üç durumla sınırlı olmadığını, köpeğine duyulan ihtiyaç ile ölçüldüğünü savunur; örneğin köpeği için kör bir kişinin olması gibi, ayrıntılı olarak belirtildiği gibi."
  id: "Islam by Touch Foundation meminta fatwa untuk komunitas Muslim tunanetra terkait pengadaan anjing penuntun. Komite Tetap untuk Fatwa di American Council of Sharia Jurists menanggapi (Fatwa No. 87778 tanggal 14 Januari 2025) bahwa orang tunanetra diperbolehkan memiliki anjing untuk dipandu di jalan atau membantu dalam beberapa urusan sehari-hari mereka, karena ini merupakan kebutuhan yang diukur berdasarkan kasus di mana Nabi mengizinkan memperoleh anjing, yaitu anjing pemburu, pertanian, dan ternak. Sebagian besar ahli hukum berpendapat bahwa kelayakan memiliki anjing tidak terbatas pada ketiga kasus tersebut tetapi diukur berdasarkan kebutuhannya, seperti kebutuhan akan orang buta untuk anjingnya, seperti yang dijelaskan."
