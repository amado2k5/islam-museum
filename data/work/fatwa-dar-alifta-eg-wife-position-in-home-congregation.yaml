id: work/fatwa-dar-alifta-eg-wife-position-in-home-congregation
class: work
kind: fatwa
label: { ar: "مكان وقوف المرأة في صلاة الجماعة مع زوجها", en: "Where the wife stands in congregational prayer with her husband", ur: "شوہر کے ساتھ جماعت میں بیوی کی کھڑے ہونے کی جگہ", es: "Donde la esposa se sitúa en la oración congregacional con su esposo.", fr: "Où l'épouse se tient en prière collective avec son mari", tr: "Bir kadının kocasıyla birlikte cemaat duasında durduğu yer", id: "Tempat di mana seorang wanita berdiri dalam doa jemaat bersama suaminya" }
summary:
  ar: "سائل سأل عن مكان وقوف المرأة في صلاة الجماعة مع زوجها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21678)⁩ أنها إذا أرادت أن تصلي مع زوجها جماعة في البيت فإنها تقف خلفه في صف مستقل متى أمكن ذلك على ما فصّل الجواب."
  en: "A questioner asked where the wife stands in congregational prayer with her husband. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21678) answered that when she wishes to pray with her husband in congregation at home she stands behind him in a separate row whenever possible — as the answer details."
  ur: "ایک سائل نے شوہر کے ساتھ جماعت کی نماز میں بیوی کی جگہ پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21678)⁩ نے جواب دیا کہ جب وہ گھر میں شوہر کے ساتھ جماعت کرے تو ممکن ہو تو اس کے پیچھے الگ صف میں کھڑی ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó dónde se sitúa la esposa en la oración congregacional junto a su marido. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21678) respondió que, cuando desea rezar con su marido en congregación en casa, se sitúa detrás de él en una fila aparte siempre que sea posible, tal como se detalla en la respuesta."
  fr: "Une personne a demandé quelle est la place de l'épouse lors de la prière en congrégation avec son mari. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21678) a répondu que, lorsqu'elle souhaite prier avec son mari en congrégation à la maison, elle se place derrière lui, dans une rangée séparée, dans la mesure du possible – comme le précise la réponse."
  tr: "Bir soru soran kişi, bir kadının kocasıyla birlikte cemaat namazında durduğu yer hakkında soru sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21678), evde kocasıyla birlikte cemaat namazı etmek isterse, mümkün olduğunca onun arkasında ayrı sıralarda durduğunu yanıtladı; bu cevapta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang tempat seorang wanita berdiri dalam shalat berjamaah bersama suaminya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21678) menjawab bahwa jika dia ingin berdoa bersama suaminya di rumah, dia berdiri di belakangnya dalam baris terpisah kapan pun memungkinkan, seperti yang dijelaskan dalam jawabannya."
