label:
  ar: "الوسطية (برنامج حواري)"
  en: "Al-Wasatiyya (panel programme)"
  ur: "الوسطیہ (مذاکراتی پروگرام)"
summary:
  ar: "برنامج حواري مرئي يقدّمه طارق السويدان، يطرح في كل حلقة قضية يعيشها العرب والمسلمون ويختلف فيها الناس، فيستطلع رأي جمهور من طلبة الجامعات بأجهزة تصويت، ثم يسمع ضيوفاً من الخبراء والعلماء بآراء متباينة، سعياً إلى «الوسطية» بين الآراء. يضم أرشيف Assabile منه أربعين حلقة، من الإسلاموفوبيا والديمقراطية والعلمانية والتكفير إلى المرأة والفضائيات والبنوك الإسلامية."
  en: "A televised panel programme presented by Tareq al-Suwaidan. Each episode takes an issue that Arabs and Muslims live with and disagree on, polls a studio audience of university students with voting devices, then hears guests, experts and scholars, holding different views, aiming at 'the middle way' (al-wasatiyya) between them. The Assabile archive holds forty episodes, from Islamophobia, democracy, secularism and takfir to women, satellite channels and Islamic banks."
  ur: "طارق السویدان کا پیش کردہ ایک ٹیلی وژن مذاکراتی پروگرام۔ ہر قسط میں کوئی ایسا مسئلہ لیا جاتا ہے جس سے عرب اور مسلمان دوچار ہیں اور جس پر لوگوں میں اختلاف ہے؛ اسٹوڈیو میں موجود جامعات کے طلبہ سے ووٹنگ آلات کے ذریعے رائے لی جاتی ہے، پھر مختلف آراء رکھنے والے ماہرین اور علما مہمانوں کو سنا جاتا ہے، تاکہ آراء کے درمیان «وسطیت» تک پہنچا جائے۔ Assabile آرکائیو میں اس کی چالیس قسطیں ہیں، اسلاموفوبیا، جمہوریت، سیکولرازم اور تکفیر سے لے کر عورت، سیٹلائٹ چینلوں اور اسلامی بینکوں تک۔"
