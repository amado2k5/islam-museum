summary:
  ar: "موقع إسلامي على الإنترنت بالعربية والإنجليزية أُطلق في 24 يونيو 1997، كان يوسف القرضاوي من مؤسسيه، وتملكه جمعية البلاغ الثقافية في الدوحة بينما عمل فريقه التحريري في القاهرة؛ اشتهر بقسم «اسأل العالِم»، ونشر بين 2000 و2003 نحو 306 آلاف مادة، وفي مارس 2010 دخل أزمة حين قررت إدارته في قطر نقل العمل إلى الدوحة فاعتصم موظفوه في القاهرة."
  en: "An Islamic website in Arabic and English launched on 24 June 1997, with Yusuf al-Qaradawi among its founders, owned by the Al-Balagh Cultural Society in Doha while its editorial team worked in Cairo; known for its 'Ask the Scholar' section, it published some 306,000 items from 2000 to 2003, and in March 2010 fell into crisis when its Qatari management decided to move the work to Doha and its Cairo staff staged a sit-in."
  ur: "عربی اور انگریزی کی اسلامی ویب سائٹ جو 24 جون 1997 کو شروع ہوئی؛ یوسف القرضاوی اس کے بانیوں میں تھے، مالک دوحہ کی البلاغ ثقافتی سوسائٹی اور ادارتی ٹیم قاہرہ میں؛ «عالم سے پوچھیں» سیکشن سے مشہور، 2000 تا 2003 تقریباً 3 لاکھ 6 ہزار اشیا شائع کیں؛ مارچ 2010 میں قطری انتظامیہ نے کام دوحہ منتقل کرنے کا فیصلہ کیا تو قاہرہ کے عملے نے دھرنا دیا۔"
