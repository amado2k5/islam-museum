label: { ar: "فصل الخطاب في سيرة أمير المؤمنين عمر بن الخطاب", en: "Fasl al-Khitab fi Sirat Amir al-Mu'minin Umar ibn al-Khattab", ur: "فصل الخطاب فی سیرۃ امیر المؤمنین عمر بن الخطاب" }
summary:
  ar: "دراسة معاصرة لعلي محمد الصلابي في شخصية عمر بن الخطاب وعصره، الجزء الثاني من سلسلته «تاريخ الخلفاء الراشدين»؛ فرغ منها في 13 رمضان 1422هـ/28 نوفمبر 2001م، وتتبع عمر من مولده إلى استشهاده في سبعة فصول: حياته بمكة، وتربيته القرآنية والنبوية، واستخلافه وقواعد حكمه وحياته في المجتمع، والمؤسستين المالية والقضائية، وفقهه مع الولاة، وفتوح العراق والمشرق، وفتوح الشام ومصر وليبيا."
  en: "A contemporary study by Ali Muhammad al-Sallabi of the person and times of Umar ibn al-Khattab, volume two of his History of the Rightly Guided Caliphs; finished on 13 Ramadan 1422 / 28 November 2001, it follows Umar from birth to martyrdom in seven chapters: his life in Mecca; his Qur'anic and prophetic formation; his nomination, the rules of his government and his life in society; the financial and judicial institutions; his dealings with governors; the conquests of Iraq and the East; and the conquests of Syria, Egypt and Libya."
  es: "Un estudio contemporáneo de Ali Muhammad al-Sallabi sobre la persona y la época de Umar ibn al-Khattab, volumen dos de su Historia de los Califas Bien Guiados; terminado el 13 de Ramadán de 1422 / 28 de noviembre de 2001, sigue a Umar desde su nacimiento hasta su martirio en siete capítulos: su vida en La Meca; su formación coránica y profética; su nombramiento, las reglas de su gobierno y su vida en la sociedad; las instituciones financieras y judiciales; sus tratos con los gobernadores; las conquistas de Irak y Oriente; y las conquistas de Siria, Egipto y Libia."
  fr: "Une étude contemporaine d'Ali Muhammad al-Sallabi sur la personne et l'époque d'Umar ibn al-Khattab, deuxième volume de son Histoire des califes bien guidés; achevé le 13 Ramadan 1422 / 28 novembre 2001, il suit Umar de sa naissance à son martyre en sept chapitres: sa vie à La Mecque; sa formation coranique et prophétique; sa nomination, les règles de son gouvernement et sa vie dans la société; les institutions financières et judiciaires; ses relations avec les gouverneurs; les conquêtes de l'Irak et de l'Orient; et les conquêtes de la Syrie, de l'Égypte et de la Libye."
  ur: "عمر بن الخطاب کی شخصیت اور زمانے کے بارے میں علی محمد السلبی کا ایک عصری مطالعہ، ان کی ہسٹری آف دی رائٹلی گائیڈڈ خلفاء کی جلد دوم؛ 13 رمضان 1422/28 نومبر 2001 کو ختم ہوا، یہ عمر کی پیدائش سے شہادت تک سات ابواب میں ہے: مکہ میں ان کی زندگی۔ اس کی قرآنی اور پیغمبرانہ تشکیل؛ اس کی نامزدگی، اس کی حکومت کے قوانین اور معاشرے میں اس کی زندگی؛ مالیاتی اور عدالتی ادارے؛ گورنروں کے ساتھ اس کے معاملات؛ عراق اور مشرق کی فتوحات؛ اور شام، مصر اور لیبیا کی فتوحات۔"
