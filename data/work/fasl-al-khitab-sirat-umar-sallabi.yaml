structure: "المقدمة (ص9–16 من نسخة PDF)؛ الفصل الأول: عمر بمكة (ص17–)؛ الفصل الثاني: التربية القرآنية والنبوية لعمر (ص35–)؛ الفصل الثالث: استخلاف الصديق للفاروق وقواعد نظام حكمه وحياته في المجتمع (ص89–)؛ الفصل الرابع: المؤسسة المالية والقضائية وتطويرها (ص273–)؛ الفصل الخامس: فقه عمر في التعامل مع الولاة (ص343–)؛ الفصل السادس: فتوحات العراق والمشرق (ص407–)؛ الفصل السابع: فتوحات الشام ومصر وليبيا، وفي آخره الأيام الأخيرة ومقتل عمر وقصة الشورى (ص515–، ص589–603)؛ الفهرس (ص643–)."
