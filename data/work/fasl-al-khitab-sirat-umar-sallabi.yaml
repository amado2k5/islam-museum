label: { ar: "فصل الخطاب في سيرة أمير المؤمنين عمر بن الخطاب", en: "Fasl al-Khitab fi Sirat Amir al-Mu'minin Umar ibn al-Khattab", ur: "فصل الخطاب فی سیرۃ امیر المؤمنین عمر بن الخطاب" }
summary:
  ar: "دراسة معاصرة لعلي محمد الصلابي في شخصية عمر بن الخطاب وعصره، الجزء الثاني من سلسلته «تاريخ الخلفاء الراشدين»؛ فرغ منها في 13 رمضان 1422هـ/28 نوفمبر 2001م، وتتبع عمر من مولده إلى استشهاده في سبعة فصول: حياته بمكة، وتربيته القرآنية والنبوية، واستخلافه وقواعد حكمه وحياته في المجتمع، والمؤسستين المالية والقضائية، وفقهه مع الولاة، وفتوح العراق والمشرق، وفتوح الشام ومصر وليبيا."
  en: "A contemporary study by Ali Muhammad al-Sallabi of the person and times of Umar ibn al-Khattab, volume two of his History of the Rightly Guided Caliphs; finished on 13 Ramadan 1422 / 28 November 2001, it follows Umar from birth to martyrdom in seven chapters: his life in Mecca; his Qur'anic and prophetic formation; his nomination, the rules of his government and his life in society; the financial and judicial institutions; his dealings with governors; the conquests of Iraq and the East; and the conquests of Syria, Egypt and Libya."
