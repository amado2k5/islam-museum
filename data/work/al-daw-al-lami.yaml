summary:
  ar: "معجم تراجم ألفه الحافظ السخاوي لأهل القرن التاسع الهجري في عدة مجلدات ذكر فيه لنفسه ترجمة على عادة المحدثين {cite:shadharat-dhahab p. 432}."
  en: "Al-Sakhawi's multi-volume biographical dictionary of the ninth Hijri century, in which — after the hadith masters' custom — he included his own entry {cite:shadharat-dhahab p. 432}."
  es: "El diccionario biográfico en varios volúmenes de Al-Sakhawi del siglo IX de la Hégira, en el que —siguiendo la costumbre de los maestros de hadices— incluyó su propia entrada {cite:shadharat-dhahab p. 432}."
  fr: "Le dictionnaire biographique en plusieurs volumes d'Al-Sakhawi du neuvième siècle de l'Hégire, dans lequel — selon la coutume des maîtres du hadith — il a inclus sa propre entrée {cite:shadharat-dhahab p. 432}."
  ur: "ال سخاوی کی نویں ہجری صدی کی کثیر حجم کی سوانحی لغت، جس میں محدثین کی روایت کے بعد، اس نے اپنا اندراج بھی شامل کیا۔ 432}۔"
  tr: "Al-Hafiz Al-Sakhawi tarafından Ahl al-Thala' al-Thala' al-Hijri için birkaç cilt halinde yazılmış biyografi sözlüğü, hadis âlimlerinin geleneğine göre kendisinin biyografisinden bahsetmiştir {atıf:shadharat-dhahab, s. 432}."
  id: "Sebuah kamus biografi yang ditulis oleh Al-Hafiz Al-Sakhawi untuk Ahl al-Thala' al-Thala' al-Hijri dalam beberapa jilid, di mana ia menyebutkan biografi dirinya sesuai kebiasaan para ulama hadis {cite:shadharat-dhahab, hlm. 432}."
