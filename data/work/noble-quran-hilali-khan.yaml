issue:
  ar: "هل تضيف ترجمة الهلالي وخان إلى النص بين الأقواس تفسيرًا يحمل على غير المسلمين أو يضيّق المعنى، أم أنها تتبع المفسرين المعتمدين؟"
  en: "Do the Hilali–Khan translation's bracketed additions read a narrow or hostile interpretation into the text, or do they follow the established commentators?"
  ur: "کیا ہلالی و خان کے ترجمے میں قوسین کے اضافے متن میں تنگ یا مخاصمانہ تعبیر داخل کرتے ہیں، یا معتبر مفسرین کی پیروی کرتے ہیں؟"
perspectives:
  - tradition: sunni
    standing: main
    stance:
      ar: "أهل السنة ⁦(فتح الباري مات جاهايا)⁩: الترجمة لا تدعو إلى العداء وتتبع المفسرين"
      en: "Sunni (Fathul Bari Mat Jahaya): the translation does not promote hostility and follows the commentators"
      ur: "سني ⁦(اہلِ سنت)⁩ — فتح الباری مات جاہایا: ترجمہ دشمنی نہیں سکھاتا اور مفسرین کی پیروی کرتا ہے"
    summary:
      ar: "قال الداعية الماليزي فتح الباري مات جاهايا سنة 2014، ردًا على أحمد فاروق موسى، إن تفسيرات الترجمة لا تبيح ظلم غير المسلمين، وإن إشاراتها إلى اليهود والنصارى للتمييز بين العقائد، وإنها مبنية على الطبري والقرطبي وابن كثير، وإن الترجمة التفسيرية هي ما عليه أكثر العلماء."
      en: "In 2014 the Malaysian preacher Fathul Bari Mat Jahaya, answering Ahmad Farouk Musa, said its interpretations do not sanction the oppression of non-Muslims, that its references to Jews and Christians distinguish between beliefs, that they rest on al-Tabari, al-Qurtubi and Ibn Kathir, and that interpretive translation is what most scholars practise."
      ur: "2014 میں ملائیشیائی داعی فتح الباری مات جاہایا نے احمد فاروق موسیٰ کے جواب میں کہا کہ ترجمے کی تفسیریں غیر مسلموں پر ظلم کی اجازت نہیں دیتیں، یہود و نصاریٰ کے ذکر کا مقصد عقائد میں فرق بتانا ہے، یہ طبری، قرطبی اور ابن کثیر پر مبنی ہیں، اور اکثر علما تفسیری ترجمہ ہی کرتے ہیں۔"
    sources: [source/malaysian-insider-fathul-bari-hilali-khan]
  - tradition: sunni
    standing: main
    stance:
      ar: "أهل السنة ⁦(خالد أبو الفضل)⁩: الإضافات بين الأقواس تفرض قولًا ضيقًا على النص وتنسبه إلى المفسرين"
      en: "Sunni (Khaled Abou El Fadl): the bracketed additions force a narrow view on the text and attribute it to the commentators"
      ur: "سني ⁦(اہلِ سنت)⁩ — خالد ابو الفضل: قوسین کے اضافے متن پر ایک تنگ رائے مسلط کرتے اور اسے مفسرین سے منسوب کرتے ہیں"
    summary:
      ar: "يرى أستاذ الشريعة خالد أبو الفضل أن الإضافات بين الأقواس تُظهر رأيًا واحدًا، في آيات لباس المرأة وآية القوامة مثلًا، كأنه معنى النص نفسه، وأن الحديث المترجم في الحاشية مترجم على غير وجهه، وأن الطبري والقرطبي وابن كثير يروون أقوالًا متعددة لا تؤيد ما نُسب إليهم."
      en: "The Islamic law professor Khaled Abou El Fadl argues that the bracketed additions present a single view, in the verses on women's dress and on husbands and wives for example, as if it were the text's own meaning, that the hadith quoted in a note is mistranslated, and that al-Tabari, al-Qurtubi and Ibn Kathir report a range of views that do not support what is attributed to them."
      ur: "اسلامی قانون کے پروفیسر خالد ابو الفضل کے نزدیک قوسین کے اضافے، مثلاً عورت کے لباس اور میاں بیوی کی آیات میں، ایک رائے کو متن کا اپنا معنی بنا کر پیش کرتے ہیں، حاشیے میں حدیث کا ترجمہ درست نہیں، اور طبری، قرطبی اور ابن کثیر متعدد اقوال نقل کرتے ہیں جو ان سے منسوب رائے کی تائید نہیں کرتے۔"
    sources: [source/abou-el-fadl-corrupting-gods-book]
  - tradition: academic
    standing: secondary
    stance:
      ar: "قراءة أكاديمية: ترجمة واسعة الأثر في التفسير السلفي، تغيّرت كثيرًا بين طبعاتها"
      en: "Academic reading: a widely influential translation for Salafi exegesis, much changed between its editions"
      ur: "علمی مطالعہ: سلفی تفسیر میں وسیع اثر رکھنے والا ترجمہ جو اپنی اشاعتوں میں بہت بدلا"
    summary:
      ar: "يرى ميخايلو ياكوبوفيتش أن الترجمة أدّت دورًا مهمًا في صعود التفسير السلفي عند القرّاء غير العرب وفي إدخال التفسير التقليدي إلى الترجمة، وأن الطبعات اللاحقة زادت الشروح بين الأقواس، وأنها لقيت نقدًا متزايدًا من علماء مسلمين."
      en: "Mykhaylo Yakubovych sees it as playing an important part in the rise of Salafi exegesis among non-Arab readers and in bringing traditional tafsir into translation, notes that later editions added much bracketed explanation, and records growing criticism from Muslim scholars."
      ur: "میخائیلو یاکوبووچ کے نزدیک اس ترجمے نے غیر عرب قارئین میں سلفی تفسیر کے فروغ اور روایتی تفسیر کو ترجمے میں لانے میں اہم کردار ادا کیا، بعد کی اشاعتوں میں قوسین کی تشریحات بڑھیں، اور مسلم علما کی تنقید بڑھتی گئی۔"
    sources: [source/gloqur-hilali-khan-part-2]
