label: { ar: "ترجمة معاني القرآن الكريم إلى اللغة الإنجليزية ⁦(الهلالي وخان)⁩", en: "Interpretation of the Meanings of the Noble Qur'an in the English Language (Hilali–Khan)", ur: "ترجمہ معانی القرآن الکریم انگریزی میں ⁦(ہلالی و خان)⁩" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن أعدّها محمد تقي الدين الهلالي ومحمد محسن خان وأتمّاها في المدينة سنة 1972، وصدرت أول مرة في شيكاغو سنة 1977 عن دار كازي بعنوان يصفها بأنها مختصر لتفسير ابن كثير مع إضافات من الطبري والبخاري، ثم في أنقرة 1978 بخطاب من الجامعة الإسلامية بالمدينة، وراجعتها دار السلام في 1994، وطبعها مجمع الملك فهد في 1997؛ طُبعت أكثر من عشرين مرة، وتمتاز بالإنجليزية المعاصرة وبالشروح بين الأقواس، ولها أثر واسع ونقد كثير."
  en: "An English rendering of the meanings of the Qur'an by Muhammad Taqi al-Din al-Hilali and Muhammad Muhsin Khan, completed in Medina in 1972 and first published in Chicago in 1977 by Kazi under a title presenting it as a summary of Ibn Kathir's tafsir supplemented by al-Tabari and al-Bukhari; it was reissued in Ankara in 1978 with a letter from the Islamic University of Medina, revised by Darussalam in 1994 and printed by the King Fahd Complex in 1997; published more than twenty times, it is written in contemporary English with commentary in brackets, and has been both widely used and much criticised."
  ur: "قرآن کے معانی کا انگریزی ترجمہ از محمد تقی الدین ہلالی و محمد محسن خان، جو 1972 میں مدینہ میں مکمل ہوا اور 1977 میں شکاگو سے کازی نے پہلی بار ایسے عنوان سے شائع کیا جو اسے تفسیر ابن کثیر کا خلاصہ مع طبری و بخاری کے اضافوں کے طور پر پیش کرتا تھا؛ 1978 میں انقرہ سے جامعہ اسلامیہ مدینہ کے خط کے ساتھ، 1994 میں دار السلام کی نظرِ ثانی سے اور 1997 میں شاہ فہد کمپلیکس سے چھپا؛ بیس سے زیادہ بار شائع ہوا، معاصر انگریزی اور قوسین میں تشریحات اس کی پہچان ہیں، اور اسے وسیع قبولیت بھی ملی اور بہت تنقید بھی۔"
