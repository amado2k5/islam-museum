editions:
  - "Explanatory English Translation of the Meanings of the Holy Qur'an: A Summarized Version of Ibn Kathir, Supplemented by At-Tabari with Comments from Sahih al-Bukhari. Chicago: Kazi Publications, 1977 (first edition, with the Arabic text)"
  - "Second edition, Ankara: Hilal Yayinlari, 1978, with a letter of the Islamic University of Medina and an introduction by F. Abdur Rahim, M. Amin al-Misri and Mohieddin H. Azmi"
  - "Third edition, 1985, almost the same content as the first two"
  - "Interpretation of the Meanings of the Noble Qur'an in the English Language. Riyadh: Darussalam, 1994, completely revised, in a one-volume and a nine-volume edition"
  - "The Noble Qur'an. Medina: King Fahd Complex for the Printing of the Holy Qur'an, 1997, largely based on the Darussalam edition and prepared by F. Abdul Rahim; the widely reproduced standard text"
