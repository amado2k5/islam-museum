summary:
  ar: "معهد تعليمي إسلامي على الإنترنت أسسه العالم الباكستاني الكندي فراز رباني، يقدّم دورات وخدمة أسئلة وأجوبة وخلوات علمية، وعُرف مدةً باسم «سيكرز هب غلوبال» ثم عاد إلى اسمه سنة 2019؛ أقدم لقطة لموقعه في أرشيف الإنترنت في مايو 2010."
  en: "An online Islamic educational institute founded by the Pakistani-Canadian scholar Faraz Rabbani, offering courses, a question-and-answer service and occasional retreats; known for a time as SeekersHub Global, it returned to its name in 2019; its site's earliest archived capture is of May 2010."
  ur: "آن لائن اسلامی تعلیمی ادارہ جسے پاکستانی نژاد کینیڈین عالم فراز ربانی نے قائم کیا؛ کورس، سوال و جواب کی خدمت اور کبھی کبھار علمی اجتماعات؛ کچھ عرصہ «سیکرز ہب گلوبل» کہلایا اور 2019 میں پرانے نام پر لوٹا؛ سب سے پرانی آرکائیو تصویر مئی 2010 کی۔"
