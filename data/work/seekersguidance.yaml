summary:
  ar: "معهد تعليمي إسلامي على الإنترنت أسسه العالم الباكستاني الكندي فراز رباني، يقدّم دورات وخدمة أسئلة وأجوبة وخلوات علمية، وعُرف مدةً باسم «سيكرز هب غلوبال» ثم عاد إلى اسمه سنة 2019؛ أقدم لقطة لموقعه في أرشيف الإنترنت في مايو 2010."
  en: "An online Islamic educational institute founded by the Pakistani-Canadian scholar Faraz Rabbani, offering courses, a question-and-answer service and occasional retreats; known for a time as SeekersHub Global, it returned to its name in 2019; its site's earliest archived capture is of May 2010."
  ur: "آن لائن اسلامی تعلیمی ادارہ جسے پاکستانی نژاد کینیڈین عالم فراز ربانی نے قائم کیا؛ کورس، سوال و جواب کی خدمت اور کبھی کبھار علمی اجتماعات؛ کچھ عرصہ «سیکرز ہب گلوبل» کہلایا اور 2019 میں پرانے نام پر لوٹا؛ سب سے پرانی آرکائیو تصویر مئی 2010 کی۔"
  es: "Un instituto educativo islámico en línea fundado por el erudito pakistaní-canadiense Faraz Rabbani, que ofrece cursos, un servicio de preguntas y respuestas y retiros ocasionales; conocido durante un tiempo como SeekersHub Global, recuperó su nombre en 2019; la captura de pantalla más antigua archivada de su sitio web data de mayo de 2010."
  fr: "Un institut d'enseignement islamique en ligne fondé par l'érudit pakistano-canadien Faraz Rabbani, proposant des cours, un service de questions-réponses et des retraites occasionnelles; connu pendant un certain temps sous le nom de SeekersHub Global, il a repris son nom en 2019; la plus ancienne capture d'écran archivée de son site date de mai 2010."
  tr: "Pakistan-Kanadalı akademisyen Faraz Rabbani tarafından kurulan, kurslar, soru-cevap hizmetleri ve bilimsel inzivalar sunan çevrimiçi bir İslami eğitim enstitüsü. Bir süre 'Seekers Hub Global' olarak bilindikten sonra 2019'da adını geri aldı; sitesinin en erken anlık görüntüsü Mayıs 2010'da Internet Archive'da bulunuyordu."
  id: "Sebuah institusi pendidikan Islam daring yang didirikan oleh cendekiawan Pakistan-Kanada Faraz Rabbani, menawarkan kursus, layanan tanya jawab, dan retret ilmiah. Situs ini sempat dikenal sebagai 'Seekers Hub Global' sebelum kembali menggunakan namanya pada tahun 2019; potret paling awal dari situsnya ada di Internet Archive pada Mei 2010."
