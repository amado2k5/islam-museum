label: { ar: "قرار مجمع الفقه الإسلامي الدولي 145 (16/3) بشأن العاقلة وتطبيقاتها المعاصرة في تحمل الدية", en: "IIFA resolution 145 (16/3) on the aqila and its contemporary applications in bearing blood-money", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 145 (16/3): عاقلہ اور دیت اٹھانے میں اس کے عصری اطلاقات", es: "Resolución 145 (16/3) de la IIFA sobre la aqila y sus aplicaciones contemporáneas en el pago de indemnizaciones por derramamiento de sangre." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. عرّف العاقلة بأنها الجهة التي تتحمل دفع الدية عن الجاني في غير القتل العمد دون حق رجوع عليه، وهي العصبة في أصل تشريعها وأهل ديوانه ممن بينهم النصرة والتضامن. وقرر أنها لا تتحمل ما وجب عمدًا أو صلحًا أو اعترافًا. وفي التطبيقات المعاصرة: عند غياب العشيرة أو العصبة يجوز أن ينوب عنها عند الحاجة — بناءً على أن أساسها التناصر والتضامن — التأمين الإسلامي ⁦(التعاوني أو التكافلي)⁩ الذي ينص نظامه على تحمل الديات بين المستأمنين؛ والنقابات والاتحادات التي يتضمن نظامها ذلك؛ وصناديق التضامن والتكافل المنشأة لهذا الغرض؛ مع بيان ضوابط قيامها مقام العاقلة التقليدية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). It defined the aqila as the body bearing payment of blood-money for the offender in other than intentional killing, without right of recourse against him — in origin the 'asaba and the members of his diwan bound by solidarity. It ruled the aqila does not bear what is due by intent, settlement or confession. On contemporary applications: where no clan or 'asaba exists, the following may stand in its place on need, since its basis is mutual support — Islamic (cooperative/takaful) insurance whose rules cover blood-money among the insured; syndicates and unions whose systems provide for it; and solidarity funds established for the purpose — with controls for their standing in the traditional aqila's place."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ اس نے عاقلہ کی تعریف کی: وہ جہت جو غیر عمد قتل میں قاتل کی طرف سے دیت ادا کرے بغیر اس پر رجوع کے — اصل تشریع میں عصبہ اور دیوان کے وہ لوگ جن میں نصرت اور یکجہتی ہو۔ فیصلہ: عمد، صلح یا اعتراف سے واجب دیت عاقلہ نہیں اٹھاتا۔ عصری اطلاقات: قبیلہ یا عصبہ نہ ہو تو اس کی جگہ یہ ادارے لے سکتے ہیں کیونکہ اس کی بنیاد باہمی تعاون ہے — وہ اسلامی ⁦(تعاونی/تکافلی)⁩ انشورنس جس کے نظام میں مؤمنین کے درمیان دیت شامل ہو؛ وہ یونینیں اور اتحاد جن کے نظام میں یہ بات ہو؛ اور اس مقصد کے لیے بنائے گئے یکجہتی فنڈز — روایتی عاقلہ کے قائم مقام ہونے کے ضوابط کے ساتھ۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión en Dubái (30 Safar – 5 Rabi al-Awwal 1426, 9–14 de abril de 2005). Definió la aqila como el organismo que asume el pago de la indemnización por homicidio en casos que no sean homicidio intencional, sin derecho de recurso contra él; en su origen, la 'asaba y los miembros de su diwan unidos por la solidaridad. Dictaminó que la aqila no asume lo que corresponde por intención, acuerdo o confesión. En aplicaciones contemporáneas: cuando no existe un clan o 'asaba, lo siguiente puede sustituirla en caso de necesidad, dado que se basa en el apoyo mutuo: seguros islámicos (cooperativos/takaful) cuyas normas cubren la indemnización por homicidio entre los asegurados; sindicatos y uniones cuyos sistemas lo prevén; y fondos de solidaridad establecidos para tal fin, con controles para su posición en el lugar de la aqila tradicional."
