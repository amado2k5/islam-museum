id: work/fatwa-aliftaa-jo-wudu-with-constant-incontinence
class: work
kind: fatwa
label: { ar: "وضوء دائم الحدث كصاحب سلس البول والمستحاضة", en: "Wudu for someone in a constant state of impurity, such as urinary incontinence or irregular bleeding", ur: "دائمی حدث والے کا وضو، جیسے سلس البول یا استحاضہ", es: "El Wudu es para alguien que se encuentra en un estado constante de impureza, como incontinencia urinaria o sangrado irregular.", fr: "Les ablutions (wudu) sont nécessaires pour une personne en état d'impureté constant, comme l'incontinence urinaire ou des saignements irréguliers.", tr: "İdrar kaçırma ve ishida olan bir kişi olarak kirlerin sürekli temizlenmesi", id: "Rutinitas membersihkan kotoran pada orang dengan inkontinensia urin dan ishida" }
summary:
  ar: "سؤال عن كيفية وضوء من ابتلي بالحدث الدائم كسلس البول والمستحاضة، أجابت فيه دائرة الإفتاء العام الأردنية بأن عليه ثلاثة أمور: ألا يتوضأ إلا بعد دخول الوقت، وأن يتنظف ثم يتوضأ فورًا، وأن يوالي ويصلي مباشرة، وأن عليه وضوءًا لكل فرض. أجابت الدائرة بأن دائم الحدث يجب عليه ثلاثة أمور: أولها ألا يتوضأ إلا بعد دخول وقت الصلاة. وثانيها أن يغير الكيس أو الحفاضة التي وضعها للتقليل من نزول البول أو الدم بعد دخول الوقت، وأن يغسل فرجه منهما، ثم يتوضأ فورًا. وثالثها أن يوالي بين أعضاء الوضوء ثم يصلي مباشرة دون تأخير، إلا إن أراد أن يصلي مع الجماعة. وأضافت أنه لا يجوز لدائم الحدث أن يجمع بين فرضين بوضوء واحد، بل يجب عليه الوضوء لكل فرض ولو كان قضاء."
  en: "A question about how someone afflicted with a constant state of minor impurity, such as urinary incontinence or a woman with irregular bleeding, should perform wudu, in which Jordan's General Iftaa Department answered that three things are required: performing wudu only after the prayer time begins, cleaning and then performing wudu at once, and washing without interruption and praying straight away, with a fresh wudu for every obligatory prayer. The Department answered that such a person must do three things; the first is to perform wudu only after the time of the prayer has begun. The second is, after the time begins, to change the bag or pad used to limit the flow of urine or blood, wash the private parts of it, and then perform wudu at once. The third is to wash the limbs of wudu one after another without interruption and then pray straight away without delay, unless waiting in order to pray with the congregation. It added that such a person may not combine two obligatory prayers with one wudu, but must perform wudu for each obligatory prayer, even one being made up."
  ur: "دائمی حدث میں مبتلا شخص، جیسے سلس البول والے یا مستحاضہ، کے وضو کے طریقے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس پر تین باتیں لازم ہیں: نماز کا وقت داخل ہونے کے بعد ہی وضو کرے، صفائی کر کے فوراً وضو کرے، اور لگاتار اعضا دھو کر فوراً نماز پڑھے، اور ہر فرض کے لیے نیا وضو کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ ایسے شخص پر تین باتیں واجب ہیں؛ پہلی یہ کہ نماز کا وقت داخل ہونے کے بعد ہی وضو کرے۔ دوسری یہ کہ وقت داخل ہونے کے بعد پیشاب یا خون کم کرنے کے لیے لگایا گیا تھیلا یا پیڈ بدلے، شرمگاہ کو اس سے دھوئے، پھر فوراً وضو کرے۔ تیسری یہ کہ وضو کے اعضا لگاتار دھوئے اور پھر بلا تاخیر فوراً نماز پڑھے، سوائے اس کے کہ جماعت کے ساتھ نماز کے لیے انتظار کرے۔ اس نے مزید کہا کہ ایسا شخص ایک وضو سے دو فرض جمع نہیں کر سکتا، بلکہ ہر فرض کے لیے، چاہے قضا ہو، وضو واجب ہے۔"
  es: "Una pregunta sobre cómo debe realizar el wudu una persona que padece un estado constante de impureza menor, como incontinencia urinaria o sangrado irregular en mujeres, el Departamento General de Iftaa de Jordania respondió que se requieren tres cosas: realizar el wudu solo después de que comience el tiempo de oración, limpiarse y luego realizar el wudu inmediatamente, y lavarse sin interrupción y orar inmediatamente, con un nuevo wudu para cada oración obligatoria. El Departamento respondió que dicha persona debe hacer tres cosas; la primera es realizar el wudu solo después de que haya comenzado el tiempo de oración. La segunda es, después de que comience el tiempo, cambiar la bolsa o compresa utilizada para limitar el flujo de orina o sangre, lavar las partes íntimas y luego realizar el wudu inmediatamente. La tercera es lavar las extremidades del wudu una tras otra sin interrupción y luego orar inmediatamente sin demora, a menos que esté esperando para orar con la congregación. Añadió que dicha persona no puede combinar dos oraciones obligatorias con un solo wudu, sino que debe realizar el wudu para cada oración obligatoria, incluso si se recupera una."
  fr: "Une question portait sur la manière dont une personne souffrant d'impureté mineure persistante, comme l'incontinence urinaire ou des saignements irréguliers chez une femme, doit accomplir ses ablutions (wudu). Le Département général de la Fatima de Jordanie a répondu que trois conditions sont requises: effectuer les ablutions seulement après le début de l'heure de la prière, se purifier puis les refaire immédiatement, et se laver sans interruption avant de prier aussitôt, en effectuant des ablutions neuves pour chaque prière obligatoire. Le Département a précisé que cette personne doit suivre ces trois étapes: premièrement, effectuer les ablutions seulement après le début de l'heure de la prière; deuxièmement, après le début de l'heure, changer la poche ou la protection utilisée pour contenir l'urine ou le sang, se laver les parties intimes, puis refaire les ablutions immédiatement; troisièmement, laver les membres l'un après l'autre sans interruption, puis prier immédiatement, sauf si l'on attend pour prier avec la congrégation. Il a été ajouté qu'une telle personne ne peut pas combiner deux prières obligatoires avec un seul wudu, mais doit effectuer le wudu pour chaque prière obligatoire, même si l'une d'entre elles est rattrapée."
  tr: "İdrar kaçırma ve istihada gibi sürekli kirlilikten muzdarip biri için abdest alma nasıl yapılır sorusunda, Ürdün Genel Fetva Dairesi, abdestörün ancak zaman başladıktan sonra temizlenmesi, ardından hemen temizlenmesi ve zaman başladıktan hemen sonra abdest yapılması gerektiğini, ayrıca her zorunlu namaz için abdest yapılması gerektiğini söyledi. Daire, sürekli kirli bir kişinin üç sebep için abdest alması gerektiğini söyledi: birincisi, namaz vakti başlayana kadar abdest olmaması gerektiğidir. Daire, sürekli kirli bir kişinin abdest alevini üç sebep için yapması gerektiğini yanıtladı: birincisi, namaz vakti başlayana kadar abdest yapılmamalıdır. Daire, sürekli kirli bir kişinin abdest almayı üç sebep için yapması gerektiğini söyledi. Daire, sürekli kirli bir kişinin abdest alması gerektiğini yanıtladı: birincisi, namaz vakti başlayana kadar abdest yapmamalıdır. Daire, sürekli kirli bir kişinin abdest alevini üç sebep için yapması gerektiğini yanıtladı: birincisi, namaz vakti başlamadan önce abdest yapılmamalıdır. Daire, sürekli kirli bir kişinin abdest alevini üç sebep için yapması gerektiğini yanıtladı. İkincisi, zaman başladıktan sonra idrar veya kanı azaltmak için koyduğu torba veya bezi değiştirmeli, her ikisinden de özel bölgelerini yıkamalı ve ardından hemen abdest almalıdır. Üçüncüsü, cemaatle birlikte namaz kılmak istemediği sürece, abdest kolları arasında dönüşümlü olarak durmalı ve gecikmeden doğrudan namaz kılmalıdır. Ayrıca, sürekli kirli bir kişinin iki fard namazını tek bir abdestle birleştirmesinin izin verilmediği; aksine, her zorunlu namaz için, hatta kaçırılan bir namaz olsa bile, abdest yapılması gerektiği belirtildi."
  id: "Pertanyaan tentang cara melakukan wudhu bagi seseorang yang mengalami ketidakmurnian terus-menerus seperti inkontinensia saluran kemih dan istihadah, Departemen Fatwa Jenderal Yordania menjawab bahwa ia harus melakukan wudhu hanya setelah waktu dimulai, membersihkan diri dan segera melakukan wudhu, dan segera melakukan wudhu setelah waktu dimulai, dan bahwa ia harus melakukan wudhu untuk setiap doa wajib. Departemen menjawab bahwa seseorang dengan ketidakmurnian terus-menerus harus melakukan wudhu untuk tiga hal: pertama, ia tidak boleh melakukan wudhu sampai waktu doa selesai dimulai. Kedua, ia harus mengganti kantong atau popok yang dipasang untuk mengurangi urin atau darah setelah waktu dimulai, mencuci bagian pribadi dari keduanya, lalu segera melakukan wudhu. Yang ketiga adalah ia harus bergantian antara anggota tubuh yang sedang berwudhu dan berdoa langsung tanpa penundaan, kecuali ia ingin berdoa bersama jemaat. Ia menambahkan bahwa tidak diperbolehkan bagi seseorang dengan ketidakmurnian yang terus-menerus untuk menggabungkan dua doa fard dengan satu wudhu; sebaliknya, ia harus melakukan wudhu untuk setiap doa wajib, meskipun doa tersebut terlewat."
