id: work/fatwa-aliftaa-jo-wudu-with-constant-incontinence
class: work
kind: fatwa
label: { ar: "وضوء دائم الحدث كصاحب سلس البول والمستحاضة", en: "Wudu for someone in a constant state of impurity, such as urinary incontinence or irregular bleeding", ur: "دائمی حدث والے کا وضو، جیسے سلس البول یا استحاضہ" }
summary:
  ar: "سؤال عن كيفية وضوء من ابتلي بالحدث الدائم كسلس البول والمستحاضة، أجابت فيه دائرة الإفتاء العام الأردنية بأن عليه ثلاثة أمور: ألا يتوضأ إلا بعد دخول الوقت، وأن يتنظف ثم يتوضأ فورًا، وأن يوالي ويصلي مباشرة، وأن عليه وضوءًا لكل فرض. أجابت الدائرة بأن دائم الحدث يجب عليه ثلاثة أمور: أولها ألا يتوضأ إلا بعد دخول وقت الصلاة. وثانيها أن يغير الكيس أو الحفاضة التي وضعها للتقليل من نزول البول أو الدم بعد دخول الوقت، وأن يغسل فرجه منهما، ثم يتوضأ فورًا. وثالثها أن يوالي بين أعضاء الوضوء ثم يصلي مباشرة دون تأخير، إلا إن أراد أن يصلي مع الجماعة. وأضافت أنه لا يجوز لدائم الحدث أن يجمع بين فرضين بوضوء واحد، بل يجب عليه الوضوء لكل فرض ولو كان قضاء."
  en: "A question about how someone afflicted with a constant state of minor impurity, such as urinary incontinence or a woman with irregular bleeding, should perform wudu, in which Jordan's General Iftaa Department answered that three things are required: performing wudu only after the prayer time begins, cleaning and then performing wudu at once, and washing without interruption and praying straight away, with a fresh wudu for every obligatory prayer. The Department answered that such a person must do three things; the first is to perform wudu only after the time of the prayer has begun. The second is, after the time begins, to change the bag or pad used to limit the flow of urine or blood, wash the private parts of it, and then perform wudu at once. The third is to wash the limbs of wudu one after another without interruption and then pray straight away without delay, unless waiting in order to pray with the congregation. It added that such a person may not combine two obligatory prayers with one wudu, but must perform wudu for each obligatory prayer, even one being made up."
  ur: "دائمی حدث میں مبتلا شخص، جیسے سلس البول والے یا مستحاضہ، کے وضو کے طریقے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس پر تین باتیں لازم ہیں: نماز کا وقت داخل ہونے کے بعد ہی وضو کرے، صفائی کر کے فوراً وضو کرے، اور لگاتار اعضا دھو کر فوراً نماز پڑھے، اور ہر فرض کے لیے نیا وضو کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ ایسے شخص پر تین باتیں واجب ہیں؛ پہلی یہ کہ نماز کا وقت داخل ہونے کے بعد ہی وضو کرے۔ دوسری یہ کہ وقت داخل ہونے کے بعد پیشاب یا خون کم کرنے کے لیے لگایا گیا تھیلا یا پیڈ بدلے، شرمگاہ کو اس سے دھوئے، پھر فوراً وضو کرے۔ تیسری یہ کہ وضو کے اعضا لگاتار دھوئے اور پھر بلا تاخیر فوراً نماز پڑھے، سوائے اس کے کہ جماعت کے ساتھ نماز کے لیے انتظار کرے۔ اس نے مزید کہا کہ ایسا شخص ایک وضو سے دو فرض جمع نہیں کر سکتا، بلکہ ہر فرض کے لیے، چاہے قضا ہو، وضو واجب ہے۔"
