id: work/fatwa-dar-alifta-eg-severe-crowding-permitting-deputy-stoning
class: work
kind: fatwa
label: { ar: "حكم اعتبار الزحام الشديد سببًا للتوكيل في رمي الجمرات", en: "Is severe crowding a ground for deputising the stoning?", ur: "کیا شدید بھیڑ رمی کی وکالت کا جواز ہے؟" }
summary:
  ar: "سائل سأل عن اعتبار الزحام الشديد سببًا للتوكيل في رمي الجمرات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20816)⁩ أن جمهور الفقهاء على أن الازدحام الذي لا يحتمل عادة ويرتب مشقة خارجة عن المعتاد يعد عذرًا مرخصًا للتوكيل على ما فصّل الجواب."
  en: "A questioner asked whether severe crowding is a ground for deputising the stoning. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20816) answered that the majority of jurists hold crowding normally unbearable and entailing extraordinary hardship counts as an excusing ground for delegation — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا جمرات پر شدید بھیڑ رمی کی وکالت کا جواز بنتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20816)⁩ نے جواب دیا کہ اکثر فقہاء کے نزدیک ناقابل برداشت بھیڑ مشقت خارج عن معتاد ہونے پر وکالت کی رخصت ہے — جیسا کہ جواب میں تفصیل ہے۔"
