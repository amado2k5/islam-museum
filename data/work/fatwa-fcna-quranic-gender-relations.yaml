label: { ar: "المفاهيم القرآنية في العلاقات بين الجنسين", en: "The Quranic Concepts on Gender Relations", ur: "قرآنی تصورات: مرد و زن کے باہمی تعلقات", es: "Los conceptos coránicos sobre las relaciones de género", fr: "Les concepts coraniques sur les relations entre les sexes", tr: "Cinsiyet İlişkilerinde Kur'an Kavramları", id: "Konsep Al-Qur'an dalam Hubungan Gender" }
summary:
  ar: "ورقة للدكتورة زينب علواني في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت نوفمبر 2021)⁩ تبين أن جوهر الرؤية الإسلامية قائم على التوحيد وأن العلاقات بين الجنسين تنبع من العلاقة بين الاستسلام لله وتكامل الأدوار على ما فصّلته الورقة."
  en: "A paper by Dr. Zainab Alwani on the Fiqh Council of North America site (published November 2021) setting out that the Islamic paradigm rests on tawhid and that gender relations flow from the link between submission to God and complementary roles — as the paper details."
  ur: "ڈاکٹر زینب علوانی کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ توحید کی بنیاد پر مرد و زن کے تعلقات کے قرآنی تصورات پر — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo de la Dra. Zainab Alwani publicado en el sitio web del Consejo de Fiqh de Norteamérica (en noviembre de 2021) expone que el paradigma islámico se basa en el tawhid y que las relaciones de género se derivan del vínculo entre la sumisión a Dios y los roles complementarios, tal como se detalla en el artículo."
  fr: "Un article du Dr Zainab Alwani sur le site du Conseil Fiqh d'Amérique du Nord (publié en novembre 2021) expose que le paradigme islamique repose sur le tawhid et que les relations de genre découlent du lien entre la soumission à Dieu et les rôles complémentaires — comme le détaille l'article."
  tr: "Dr. Zeynep Alwani'nin Kuzey Amerika Fiqh Konseyi web sitesinde yayımlanan (Kasım 2021'de yayımlanan) makalesi, İslami vizyonun özünün tek tanrıcılığa dayandığını ve cinsiyet ilişkilerinin Tanrı'ya teslimiyet ile rollerin entegrasyonu arasındaki ilişkiden kaynaklandığını göstermektedir; makalede detaylandırılmıştır."
  id: "Sebuah makalah oleh Dr. Zainab Alwani di situs web Fiqh Council of North America (diterbitkan November 2021) menunjukkan bahwa inti dari visi Islam didasarkan pada monoteisme dan bahwa hubungan gender berasal dari hubungan antara penyerahan kepada Tuhan dan integrasi peran, seperti yang dijelaskan dalam makalah tersebut."
