id: work/fatwa-dar-alifta-eg-hajj-savings-circle
class: work
kind: fatwa
label: { ar: "حكم عمل جمعية مالية لتدبير نفقة الحج", en: "Running a money circle to save for Hajj costs", ur: "حج کے اخراجات کے لیے پیسوں کی کمیٹی", es: "Organizar un círculo de ahorro para cubrir los gastos del Hajj", fr: "Organiser un système d'épargne pour financer le Hajj", tr: "Hac giderlerini yönetmek için bir finans kuruluşu kurulmasına ilişkin karar", id: "Putusan tentang pembentukan asosiasi keuangan untuk mengelola pengeluaran Haji" }
summary:
  ar: "سائل سأل عن عمل جمعية مالية بينه وبين زملائه لتدبير نفقة الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21996)⁩ أنه لا يكلف الرجل بالاجتهاد في تدبير نفقة الحج شرعًا ومع ذلك إن اجتهد بجمعية مالية فلا حرج على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about running a money circle with colleagues to raise Hajj costs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21996) answered that a man is not obliged to strive to gather Hajj expenses; still, if he does so through a savings circle there is no harm — under the controls the answer details."
  ur: "ایک سائل نے ساتھیوں کے ساتھ حج کے اخراجات کے لیے پیسوں کی کمیٹی بنانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21996)⁩ نے جواب دیا کہ شرعاً انسان پر حج کے اخراجات جمع کرنے کی تکلف لازم نہیں؛ اگر وہ کمیٹی کے ذریعے کرے تو کوئی حرج نہیں — جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Un participante preguntó sobre la posibilidad de organizar un círculo de ahorro con colegas para recaudar fondos para el Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21996) respondió que una persona no está obligada a esforzarse por reunir los gastos del Hajj; sin embargo, si lo hace a través de un círculo de ahorro, no hay inconveniente, bajo las condiciones que se detallan en la respuesta."
  fr: "Un internaute a posé une question concernant la mise en place d'un système d'épargne collective avec des collègues pour financer le pèlerinage à La Mecque. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21996) a répondu qu'il n'est pas obligatoire de collecter des fonds pour le pèlerinage; toutefois, le faire par le biais d'un système d'épargne collective ne présente aucun inconvénient, sous réserve des conditions précisées dans la réponse."
  tr: "Bir soru soran kişi, kendisi ve meslektaşları arasında Hac giderlerini yönetmek için bir mali birlik kurulması hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21996), bir kişinin İslam hukukuna göre hac giderlerini yönetirken ictihad yapmak zorunda olmadığını; ancak mali dernek kurmaya çalışırsa ayrıntılı düzenlemelerde zarar olmadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang pembentukan asosiasi keuangan antara dirinya dan rekan-rekannya untuk mengelola pengeluaran Haji. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21996) menjawab bahwa seorang pria tidak diwajibkan menjalankan ijtihad dalam mengelola pengeluaran Haji sesuai hukum Islam; namun, jika ia berusaha membentuk asosiasi keuangan, tidak ada kerugian dalam peraturan rinci."
