id: work/fatwa-amja-dua-changing-decree
class: work
kind: fatwa
label: { ar: "الدعاء بتغيير المصير من الشقاء إلى السعادة", en: "Supplicating to change one's fate from misery to felicity", ur: "شقاوت سے سعادت کی طرف تقدیر بدلنے کی دعا", es: "Suplicar para cambiar el destino de la miseria a la felicidad." }
summary:
  ar: "سأل سائل عن ما رواه الطبري عن جمع من الصحابة والتابعين أنهم كانوا يدعون الله بتغيير المصير وإخراجهم من الشقاء إن كتب عليهم إلى السعادة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86498 بتاريخ 29 فبراير 2012)⁩ أن كل ما ذُكر من القدر فقد سبق علم الله به وكتابته في اللوح ونفذت مشيئته فيه وهو الخالق لكل شيء، إلا أن من الأقدار ما يكون محققًا ومنها ما يكون معلقًا، ومن الأمثلة على المعلق ما يُعَلَّق من المقادير على الدعاء أو الصدقة وصلة الرحم التي تعمر الديار وتطيل الأعمار، وقد علم الله كل شيء وكتبه محققه ومعلقه والمعلق عليه."
  en: "A questioner cited al-Tabari's tafsir that Companions and Successors used to ask God to change their fate — bringing them from written misery to felicity. Dr. Salah al-Sawi (fatwa no. 86498, 29 February 2012) answered that everything of decree is foreknown, forewritten in the Tablet and willed, God being the Creator of all; but some decrees are determined and some suspended, and among the suspended are those hanging on supplication, charity and keeping kinship — which adorn houses and lengthen lives — God having known and written the determined, the suspended and what they hang on."
  ur: "ایک سائل نے طبری کی اس روایت پوچھی کہ صحابہ و تابعین شقاوت سے سعادت کی تبدیلی کی دعا کرتے تھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86498، 29 فروری 2012)⁩ کے مطابق بعض اقدار معلق ہوتی ہیں اور دعا، صدقہ اور صلہ رحم سے جڑی ہوتی ہیں۔"
  es: "Un interlocutor citó la interpretación de al-Tabari según la cual los Compañeros y los Sucesores solían pedirle a Dios que cambiara su destino, llevándolos de la miseria escrita a la felicidad. El Dr. Salah al-Sawi (fatwa n.º 86498, 29 de febrero de 2012) respondió que todo decreto es conocido de antemano, preescrito en la Tabla y querido, siendo Dios el Creador de todo; pero algunos decretos son determinados y otros están en suspenso, y entre los que están en suspenso se encuentran aquellos que dependen de la súplica, la caridad y el mantenimiento de los lazos familiares, que embellecen las casas y prolongan la vida; Dios conocía y había escrito lo determinado, lo en suspenso y aquello de lo que dependen."
