label: { ar: "الفائق في غريب الحديث", en: "al-Fa'iq fi Gharib al-Hadith", es: "al-Fa'iq fi Gharib al-Hadith", fr: "al-Fa'iq fi Gharib al-Hadith", ur: "الفائق فی غریب الحدیث" }
summary:
  ar: "الفائق في غريب الحديث للزمخشري، معجم لألفاظ الحديث الغريبة أو المتعددة المعاني، مرتب هجائياً بحسب أول حرفين من الكلمة، ويُشرح فيه كل غريب الحديث عند أول غريب يرد فيه ولا يُعاد في موضعه الهجائي، وفي هذا صعوبة في الاستعمال. وقد وضع الهروي في «الغريبين» نظاماً أحسن بإيراد كل كلمة في موضعها الهجائي."
  en: "al-Zamakhshari's al-Fa'iq fi gharib al-hadith, a dictionary of difficult or ambiguous words in the hadith, alphabetical by the first two letters of the word. All the rare words of a hadith are explained at the place of the first of them and are not listed again in their own alphabetical place, which makes the book harder to use; al-Harawi's al-Gharibayn later gave each word its own place, a better system."
  es: "El al-Fa'iq fi gharib al-hadith de al-Zamajshari, un diccionario de palabras difíciles o ambiguas del hadiz, alfabético según las dos primeras letras de la palabra. Todas las palabras raras de un hadiz se explican donde aparece la primera y no se repiten en su lugar alfabético, lo que hace el libro más difícil de usar; el al-Gharibayn de al-Harawi dio después a cada palabra su propio lugar, un sistema mejor."
  fr: "Le al-Fa'iq fi gharib al-hadith d'al-Zamakhshari, dictionnaire de mots difficiles ou ambigus du hadith, alphabétique d'après les deux premières lettres du mot. Tous les mots rares d'un hadith sont expliqués à la place du premier d'entre eux et ne sont pas redonnés à leur place alphabétique, ce qui rend le livre plus difficile à consulter ; l'al-Gharibayn d'al-Harawi donna ensuite à chaque mot sa propre place, système meilleur."
  ur: "زمخشری کی الفائق فی غریب الحدیث، حدیث کے مشکل یا کئی معانی والے الفاظ کی لغت، لفظ کے پہلے دو حروف کے لحاظ سے حروفِ تہجی پر مرتب۔ ایک حدیث کے تمام غریب الفاظ پہلے لفظ کی جگہ شرح ہو جاتے ہیں اور اپنی تہجی جگہ پر دوبارہ نہیں آتے، جس سے کتاب سے فائدہ اٹھانا مشکل ہوتا ہے؛ ہروی کی الغریبین نے ہر لفظ کو اس کی اپنی جگہ دے کر بہتر نظام دیا۔"
