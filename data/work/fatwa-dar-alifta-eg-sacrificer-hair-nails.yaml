label: { ar: "حكم أخذ المضحي من شعره وظفره من أول ذي الحجة", en: "The sacrificer cutting hair and nails from the first of Dhu'l-Hijja", ur: "قربانی کرنے والا ذوالحجہ کی اول سے بال اور ناخن کاٹے" }
summary:
  ar: "سائل سأل عن أخذ من يريد الأضحية من شعره وظفره من أول ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21915)⁩ أنه يسن لمن يريد التضحية ألا يأخذ شيئًا من شعره ولا ظفره حتى يضحي فإن نسي فأخذ فلا شيء عليه على ما فصّل الجواب."
  en: "A questioner asked about one intending the udhiyya cutting his hair or nails from the first of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21915) answered that it is commended for the sacrificer not to take anything of hair or nail until he sacrifices; if he forgetfully does, nothing is on him — as the answer details."
  ur: "ایک سائل نے قربانی کرنے والے کے ذوالحجہ کی اول سے بال یا ناخن کاٹنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21915)⁩ نے جواب دیا کہ قربانی تک بال اور ناخن نہ کاٹنا مستحب ہے؛ بھول کر کاٹ لے تو اس پر کچھ نہیں — جیسا کہ جواب میں تفصیل ہے۔"
