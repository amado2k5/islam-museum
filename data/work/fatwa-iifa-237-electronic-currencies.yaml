label: { ar: "قرار مجمع الفقه الإسلامي الدولي 237 (24/8) بشأن العملات الإلكترونية", en: "IIFA resolution 237 (24/8) on electronic currencies", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 237 (24/8): الیکٹرانک کرنسیاں", es: "Resolución 237 (24/8) de la IIFA sobre monedas electrónicas", fr: "Résolution 237 (24/8) de l'IIFA sur les monnaies électroniques" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩، بعد اطلاعه على توصيات الندوة العلمية للعملات الإلكترونية بجدة ⁦(10–11 محرم 1441هـ، 9–10 سبتمبر 2019م)⁩. قرر المجمع أن مصطلح العملات الإلكترونية عام يشمل بطاقات الائتمان والبطاقات مسبقة الدفع والشيكات الإلكترونية، فاستُعمل مصطلح العملات الرقمية المرمزة ⁦(المشفرة)⁩ ومن أشهرها البيتكوين والإثيريوم والريبل: أرقام مشفرة لا كيان مادي لها تتداول بين الأطراف دون وسيط بنظام الند للند، وتصنف إلى عملات ⁦(كالبيتكوين)⁩ وبدائل عملات ⁦(كاللايتكوين والبيتكوين كاش)⁩ وقسائم قابلة للاستبدال والتداول، وأبرز سمات النوع الأول اللامركزية، وأغلبها يستند إلى تقنية سلسلة الكتل. ويتم التعامل بها عبر منصات إلكترونية وسماسرة برسوم ومحافظ إلكترونية لكل متعامل، ومن أبرز سماته إمكان التعامل بأسماء مستعارة. ولزمت بعض الدول كماليزيا التراخيص لإنشاء المنصات وإبراز هوية المتعاملين. ورغم انتشارها فإن دراسات تشير إلى مخاطر تكتنفها وأبرزها التقلبات السعرية. وقرر المجمع أن قضايا مؤثرة في الحكم لا تزال محل نظر منها ماهية العملة المشفرة أسلعة هي أم منفعة أم أصل مالي استثماري أم أصل رقمي، وهل هي متقومة ومتمولة شرعًا، وأوصى بمزيد من البحث والدراسة لما يكتنفها من مخاطر عظيمة وعدم استقرار."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019), after reviewing the recommendations of its scholarly seminar on electronic currencies in Jeddah (10–11 Muharram 1441, 9–10 September 2019). It held that 'electronic currencies' is a broad term covering credit cards, prepaid cards and e-cheques, so it adopted the term tokenised (cryptographic) digital currencies — the best-known being Bitcoin, Ethereum and Ripple: encrypted figures with no material existence, traded between parties peer-to-peer without an intermediary, classified into coins (such as Bitcoin), altcoins (such as Litecoin and Bitcoin Cash) and tokens exchangeable and tradable for goods and cryptocurrencies, the first type marked above all by decentralisation and most resting on blockchain. Dealing occurs through electronic platforms and brokers, for fees, each dealer keeping an electronic wallet, with the notable possibility of pseudonymous dealing; some states such as Malaysia required platform licences and verified user identity. Despite their spread, studies point to serious risks, above all price volatility. It held that decisive questions for the ruling remain under review — the very nature of the cryptocurrency, whether it is a commodity, a utility, an investment financial asset or a digital asset, and whether it is property valued and owned in the sharia — and recommended further research and study given the great risks and instability surrounding them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں، جدہ میں منعقدہ اس کی علمی ندوات ⁦(الیکٹرانک کرنسیاں، 10–11 محرم 1441ھ، 9–10 ستمبر 2019ء)⁩ کی سفارشات کے جائزے کے بعد۔ اس نے قرار دیا کہ ⁦«الیکٹرانک کرنسیاں»⁩ ایک عام اصطلاح ہے جس میں کریڈٹ کارڈ، پری پیڈ کارڈ اور برقی چیک آتے ہیں، اس لیے مرموز ⁦(کرپٹوگرافک)⁩ ڈیجیٹل کرنسیوں کی اصطلاح اپنائی — مشہور ترین بٹ کوائن، ایتھریم اور رپل: کوئی مادی وجود نہ رکھنے والے مرموز ہندسے جو ند بہ ند کے اصول پر بغیر کسی واسطہ کے تبادل ہوتے ہیں، اور تین اقسام میں تقسیم ہیں: سِکے ⁦(مثل بٹ کوائن)⁩، متبادل سِکے ⁦(مثل لائٹ کوائن، بٹ کوائن کیش)⁩ اور اشیا و کرپٹو کرنسیوں کے بدلے دینے کے قابل ٹوکن؛ پہلی قسم کی نمایاں خصوصیت عدمِ مرکزیت ہے اور اکثر بلاک چین پر مبنی ہیں۔ معاملہ برقی پلیٹ فارمز اور بروکروں سے فیس کے عوض ہوتا ہے اور ہر فریق کا برقی بٹوہ ہوتا ہے، قلمی ناموں سے معاملہ ممکن ہے؛ کچھ ممالک مثل ملائیشیا نے پلیٹ فارمز کے لیے لائسنس اور صارفین کی شناخت لازم کی۔ ان کے پھیلاؤ کے باوجود مطالعات بڑے خطرات کی طرف اشارہ کرتے ہیں، بالخصوص قیمتوں کا اتار چڑھاؤ۔ اس نے قرار دیا کہ فیصلے پر اثر ڈالنے والے سوالات ابھی زیرِ نظر ہیں — کرپٹو کرنسی کی حقیقت: وہ سلعہ ہے، منفعت، سرمایہ کاری کا مالی اثاثہ یا برقی اثاثہ؟ اور کیا وہ شرعاً مالِ متقوم و متمول ہے؟ — اور بڑے خطرات اور عدم استقرار کی وجہ سے مزید تحقیق و مطالعے کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 24.ª sesión en Dubái (7-9 Rabi' I 1441, 4-6 de noviembre de 2019), tras revisar las recomendaciones de su seminario académico sobre monedas electrónicas en Yeda (10-11 Muharram 1441, 9-10 de septiembre de 2019). Sostuvo que \"monedas electrónicas\" es un término amplio que abarca tarjetas de crédito, tarjetas prepago y cheques electrónicos, por lo que adoptó el término monedas digitales tokenizadas (criptográficas), siendo las más conocidas Bitcoin, Ethereum y Ripple: cifras encriptadas sin existencia material, intercambiadas entre pares sin intermediario, clasificadas en monedas (como Bitcoin), altcoins (como Litecoin y Bitcoin Cash) y tokens canjeables por bienes y criptomonedas, el primer tipo caracterizado sobre todo por la descentralización y basado principalmente en blockchain. Las transacciones se realizan a través de plataformas electrónicas e intermediarios, con el pago de comisiones, y cada operador posee una billetera electrónica, con la notable posibilidad de operar con seudónimos. Algunos estados, como Malasia, exigen licencias para las plataformas y la verificación de la identidad de los usuarios. A pesar de su difusión, diversos estudios señalan riesgos importantes, sobre todo la volatilidad de los precios. El tribunal sostuvo que las cuestiones decisivas para la resolución siguen en revisión: la naturaleza misma de la criptomoneda, si se trata de una materia prima, un bien de utilidad, un activo financiero de inversión o un activo digital, y si se trata de una propiedad valorada y poseída según la sharia. Asimismo, recomendó realizar más investigaciones y estudios dados los grandes riesgos e inestabilidad que las rodean."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019), après examen des recommandations de son séminaire scientifique sur les monnaies électroniques à Djeddah (10-11 Muharram 1441, 9-10 septembre 2019), a statué que l'expression « monnaies électroniques » est trop large et englobe les cartes de crédit, les cartes prépayées et les chèques électroniques. L'Académie a donc adopté le terme de monnaies numériques tokenisées (cryptographiques), dont les plus connues sont Bitcoin, Ethereum et Ripple: des nombres chiffrés sans existence matérielle, échangés directement entre particuliers sans intermédiaire, classés en cryptomonnaies (comme Bitcoin), altcoins (comme Litecoin et Bitcoin Cash) et tokens échangeables contre des biens et des cryptomonnaies. La première catégorie se caractérise avant tout par sa décentralisation et repose majoritairement sur la technologie blockchain. Les transactions s'effectuent via des plateformes électroniques et des courtiers, moyennant des frais. Chaque opérateur détient un portefeuille électronique, avec la possibilité notable de transactions pseudonymes. Certains États, comme la Malaisie, exigent des licences de plateforme et une vérification de l'identité des utilisateurs. Malgré leur expansion, des études soulignent des risques importants, notamment la volatilité des prix. La Cour a estimé que des questions cruciales pour la décision restent à examiner: la nature même de la cryptomonnaie (marchandise, utilité, actif financier d'investissement ou actif numérique) et sa valeur en tant que bien régi par la charia. Elle a recommandé des recherches et des études complémentaires compte tenu des risques et de l'instabilité importants qui les entourent."
