label: { ar: "فتنة فرقة الأحباش في إثيوبيا", en: "The Ahbash group's strife among Ethiopia's Muslims", ur: "ایتھوپیا میں احباش فرقے کا فتنہ", es: "El conflicto del grupo Ahbash entre los musulmanes de Etiopía", fr: "Les conflits du groupe Ahbash parmi les musulmans d'Éthiopie", tr: "Etiyopya'daki Habeşistan fraksiyonunun isyanı", id: "Pemberontakan faksi Abyssinia di Ethiopia" }
summary:
  ar: "سأل سائل عن فرقة الأحباش اللبنانية التي أثارت فتنة بين مسلمي إثيوبيا وتفرق جمعهم بدعم رسمي عنده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85691 بتاريخ 18 أكتوبر 2011)⁩ أنهم سبق بيان حكمهم وأنهم بدعية المذهب في اعتقادهم ومنهجهم وضلال في كثير من مسائل العقائد والعمل عنده، ونقل جواب اللجنة الدائمة بالسعودية في عبد الله الهرري الحبشي بأنه من رؤوس البدعة والضلال وأن الواجب الحذر والتحذير من هذه الفرقة وأفكارها على ما ورد. سُجّل منسوبًا إلى المجمع واللجنة التي نقل عنها."
  en: "A questioner asked about the Lebanese Ahbash group stirring strife among Ethiopia's Muslims and dividing their ranks, in his account with official support. Dr. Salah al-Sawi (fatwa no. 85691, 18 October 2011) answered that their ruling had been set out — their method being innovation in creed and approach and misguided in many creed and practice matters, in AMJA's view — and quoted the Saudi Permanent Committee's answer on Abdullah al-Harari al-Habashi calling him a head of innovation and misguidance and holding it a duty to warn against the group, as quoted. Recorded as AMJA's answer citing the committee."
  ur: "ایک سائل نے ایتھوپیا کے مسلمانوں میں احباش فرقے کے فتنے کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85691، 18 اکتوبر 2011)⁩ نے اپنے مؤقف کے ساتھ سعودی دائمی کمیٹی کا منقول جواب بھی بیان کیا — منقول جواب کا خلاصہ۔"
  es: "Un interlocutor preguntó acerca del grupo libanés Ahbash, que, según su relato con apoyo oficial, estaba sembrando la discordia entre los musulmanes de Etiopía y dividiendo sus filas. El Dr. Salah al-Sawi (fatwa n.° 85691, 18 de octubre de 2011) respondió que su dictamen ya estaba establecido: su método era innovador en cuanto a credo y enfoque, y erróneo en muchos aspectos de credo y práctica, según la opinión de AMJA. Citó la respuesta del Comité Permanente Saudí sobre Abdullah al-Harari al-Habashi, a quien calificó de líder de la innovación y el extravío, y consideró que era un deber advertir sobre el grupo. Registrado como la respuesta de AMJA citando al comité."
  fr: "Un interlocuteur a interrogé Salah al-Sawi au sujet du groupe libanais Ahbash, accusé de semer la discorde parmi les musulmans d'Éthiopie et de diviser leurs rangs, en s'appuyant sur un témoignage officiel. Le Dr Salah al-Sawi (fatwa n° 85691, 18 octobre 2011) a répondu que leur décision avait été rendue: leur méthode, de l'avis de l'AMJA, relève de l'innovation dans la croyance et l'approche, et est erronée sur de nombreux points de la croyance et de la pratique. Il a cité la réponse du Comité permanent saoudien concernant Abdullah al-Harari al-Habashi, le qualifiant de chef de file de l'innovation et de l'égarement, et estimant qu'il était du devoir de mettre en garde contre ce groupe. Cette réponse a été consignée dans le registre de l'AMJA, citant le Comité."
  tr: "Bir soru soran kişi, Etiyopyalı Müslümanlar arasında çatışma çıkaran ve resmi desteğiyle onları dağıtan Lübnan Habeşistan mezhebi hakkında soru soruldu. Dr. Salah Al-Sawy (18 Ekim 2011 tarihli 85691 sayılı fetva) kararlarının zaten netleştiğini ve inançları ile metodolojilerinde tarikatın yenilikçileri olduklarını, birçok inanç ve uygulama konusundaki yanlış yönlendirmeleri olduğunu belirtti. Abdullah Al-Harari Al-Habashi ile ilgili Suudi Arabistan Daimi Komitesi'nin yanıtını aktararak, onun yenilik ve yanlış yönlendirme liderlerinden biri olduğunu ve bu mezhep ile fikirlerine karşı dikkatli olmanın ve uyarıda bulunmanın zorunlu olduğunu belirtti. Bunu Akademi ve alıntı yaptığı komiteyle bağlantılı olarak kaydetti."
  id: "Seorang penanya ditanya tentang sekte Abyssinia Lebanon yang memicu perselisihan di antara Muslim Ethiopia dan membubarkan mereka dengan dukungan resmi darinya. Dr. Salah Al-Sawy menjawab (Fatwa No. 85691 tanggal 18 Oktober 2011) bahwa keputusan mereka sudah diperjelas dan bahwa mereka adalah inovator sekte dalam keyakinan, metodologi, dan kesalahan dalam banyak hal kepercayaan dan praktik. Ia mengutip tanggapan Komite Tetap di Arab Saudi terkait Abdullah Al-Harari Al-Habashi, menyatakan bahwa ia termasuk pemimpin inovasi dan kesalahan, dan wajib berhati-hati serta memperingatkan terhadap sekte ini dan ide-idenya, seperti yang dilaporkan. Ia mencatatnya sebagai afiliasi dengan Akademi dan komite yang ia kutip."
