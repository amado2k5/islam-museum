id: work/fatwa-amja-ahbash-ethiopia
class: work
kind: fatwa
label: { ar: "فتنة فرقة الأحباش في إثيوبيا", en: "The Ahbash group's strife among Ethiopia's Muslims", ur: "ایتھوپیا میں احباش فرقے کا فتنہ", es: "El conflicto del grupo Ahbash entre los musulmanes de Etiopía" }
summary:
  ar: "سأل سائل عن فرقة الأحباش اللبنانية التي أثارت فتنة بين مسلمي إثيوبيا وتفرق جمعهم بدعم رسمي عنده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85691 بتاريخ 18 أكتوبر 2011)⁩ أنهم سبق بيان حكمهم وأنهم بدعية المذهب في اعتقادهم ومنهجهم وضلال في كثير من مسائل العقائد والعمل عنده، ونقل جواب اللجنة الدائمة بالسعودية في عبد الله الهرري الحبشي بأنه من رؤوس البدعة والضلال وأن الواجب الحذر والتحذير من هذه الفرقة وأفكارها على ما ورد. سُجّل منسوبًا إلى المجمع واللجنة التي نقل عنها."
  en: "A questioner asked about the Lebanese Ahbash group stirring strife among Ethiopia's Muslims and dividing their ranks, in his account with official support. Dr. Salah al-Sawi (fatwa no. 85691, 18 October 2011) answered that their ruling had been set out — their method being innovation in creed and approach and misguided in many creed and practice matters, in AMJA's view — and quoted the Saudi Permanent Committee's answer on Abdullah al-Harari al-Habashi calling him a head of innovation and misguidance and holding it a duty to warn against the group, as quoted. Recorded as AMJA's answer citing the committee."
  ur: "ایک سائل نے ایتھوپیا کے مسلمانوں میں احباش فرقے کے فتنے کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85691، 18 اکتوبر 2011)⁩ نے اپنے مؤقف کے ساتھ سعودی دائمی کمیٹی کا منقول جواب بھی بیان کیا — منقول جواب کا خلاصہ۔"
  es: "Un interlocutor preguntó acerca del grupo libanés Ahbash, que, según su relato con apoyo oficial, estaba sembrando la discordia entre los musulmanes de Etiopía y dividiendo sus filas. El Dr. Salah al-Sawi (fatwa n.° 85691, 18 de octubre de 2011) respondió que su dictamen ya estaba establecido: su método era innovador en cuanto a credo y enfoque, y erróneo en muchos aspectos de credo y práctica, según la opinión de AMJA. Citó la respuesta del Comité Permanente Saudí sobre Abdullah al-Harari al-Habashi, a quien calificó de líder de la innovación y el extravío, y consideró que era un deber advertir sobre el grupo. Registrado como la respuesta de AMJA citando al comité."
