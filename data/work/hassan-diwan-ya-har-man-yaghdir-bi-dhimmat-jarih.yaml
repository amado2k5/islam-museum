label: { ar: "قصيدة حسان «يا حار من يغدر بذمة جاره»", en: "Hassan's satire of al-Harith ibn Awf 'O Harith, whoever betrays his neighbour's protection'", es: "La sátira de Hassan sobre al-Harith ibn Awf: «¡Oh Harith, quien traiciona la protección de su prójimo!»", fr: "Satire de Hassan sur al-Harith ibn Awf: « Ô Harith, quiconque trahit la protection de son voisin »", ur: "حارث بن عوف کا حسن کا طنز 'اے حارث جو اپنے پڑوسی کی حفاظت میں خیانت کرے'", tr: "Hassan'ın şiiri \"Ey Komşusunun Güvenini Satan Putperest\"", id: "Puisi Hassan \"Wahai Kafir, Yang Mengkhianati Kepercayaan Tetangganya\"" }
summary:
  ar: "أبيات لحسان بن ثابت من الكامل على روي الراء، يهجو بها الحارث بن عوف المري، وقد قتل قومه رجلا من الأنصار بعثه رسول الله إليهم {{cite:sharh-diwan-hassan-barquqi-1929 p.210-211}}."
  en: "Verses by Hassan ibn Thabit in the kamil metre on the rhyme ra', satirising al-Harith ibn Awf al-Murri, whose people killed an Ansari sent to them by the Messenger {{cite:sharh-diwan-hassan-barquqi-1929 p.210-211}}."
  es: "Versos de Hassan ibn Thabit en metro kamil sobre la rima ra', satirizando a al-Harith ibn Awf al-Murri, cuyo pueblo mató a un Ansari enviado por el Mensajero {{cite:sharh-diwan-hassan-barquqi-1929 p.210-211}}."
  fr: "Vers de Hassan ibn Thabit en mètre kamil sur la rime ra', satirisant al-Harith ibn Awf al-Murri, dont le peuple a tué un Ansari envoyé par le Messager {{cite:sharh-diwan-hassan-barquqi-1929 p.210-211}}."
  ur: "حارث بن عوف المری پر طنز کرتے ہوئے حس بن ثابت کی آیات کامل میٹر میں، جن کے لوگوں نے ایک انصاری کو قتل کر دیا جو رسول کی طرف سے ان کے پاس بھیجا گیا تھا۔"
  tr: "Hassan ibn Thabit'in Al-Kamil'den r' riyâhi üzerine yazdığı dizeler; burada Al-Harith ibn Awf al-Marri'yi hicvediyor ve halkının Allah'ın Elçisi'nin onlara gönderdiği Ansar'dan bir adamı öldürdüğünü hicvediyor {{cite:sharh-diwan-hassan-barquqi-1929 s.210-211}}."
  id: "Ayat-ayat oleh Hassan ibn Thabit dari Al-Kamil tentang riwayat r', di mana ia menyindir Al-Harith ibn Awf al-Marri, dan bahwa umatnya membunuh seorang pria dari Ansar yang dikirim oleh Rasul Allah kepada mereka {{cite:sharh-diwan-hassan-barquqi-1929 hlm.210-211}}."
