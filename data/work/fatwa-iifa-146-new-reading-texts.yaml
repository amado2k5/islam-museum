label: { ar: "قرار مجمع الفقه الإسلامي الدولي 146 (16/4) بشأن القراءة الجديدة للقرآن وللنصوص الدينية", en: "IIFA resolution 146 (16/4) on the 'new reading' of the Qur'an and religious texts", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 146 (16/4): قرآن اور مذہبی نصوص کی 'نئی قراءت'", es: "Resolución 146 (16/4) de la IIFA sobre la \"nueva lectura\" del Corán y los textos religiosos.", fr: "Résolution 146 (16/4) de l'IIFA sur la « nouvelle lecture » du Coran et des textes religieux", tr: "Uluslararası İslami Fıkıh Akademisi Kararı 146 (16/4) Kur'an'ın ve dini metinlerin yeni okunmasına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 146 (16/4) mengenai pembacaan baru Al-Qur'an dan teks-teks agama" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. قرر في نصه أن ما يسمى بالقراءة الجديدة للنصوص الدينية إذا أدت لتحريف معاني النصوص ولو بالاستناد إلى أقوال شاذة بحيث تخرجها عن المجمع عليه وتتناقض مع «الحقائق الشرعية» تعد بدعة منكرة وخطرًا جسيمًا على المجتمعات الإسلامية وثقافتها وقيمها، ملاحظًا أن بعض حملة هذا الاتجاه وقعوا فيه جهلًا بالمعايير الضابطة للتفسير أو هوسًا بالتجديد غير المنضبط. وحذّر من تبني بعض الجهات الأكاديمية لهذه القراءات ونشرها وتشجيع الرسائل الجامعية عليها واستضافة رموزها، ودعا إلى الالتزام بمعايير التفسير المقررة والضوابط الشرعية في تناول النصوص. سُجّل موقف المجمع بحياد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). In its own text, it held that the so-called 'new reading' of religious texts, where it distorts their meanings — even relying on anomalous opinions — so as to take them outside the consensus and contradict what it calls 'the legal facts', is a reprehensible innovation and a grave danger to Muslim societies, their culture and values; noting that some proponents fell into it through ignorance of the governing criteria of tafsir or an unrestrained appetite for novelty. It warned against academic institutions adopting such readings, publishing them, encouraging graduate theses on them and hosting their figures, and called for adherence to the established criteria of interpretation and the legal controls in handling the texts. The Academy's position is recorded neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ اپنے متن میں اس نے کہا کہ مذہبی نصوص کی نام نہاد 'نئی قراءت' اگر ان کے معانی بگاڑ دے — خواہ شاذ اقوال کے سہارے — تاکہ وہ اجماع سے باہر ہو کر اس کے بقول 'شرعی حقائق' سے متصادم ہوں، تو وہ مذموم بدعت اور مسلم معاشروں، ان کی ثقافت اور اقدار کے لیے سنگین خطرہ ہے؛ اور بعض حاملین اس میں تفسیر کے معیارات کی بے خبری یا غیر مقید تجدد کے شوق سے پڑے۔ اس نے تعلیمی اداروں کی طرف سے ایسی قراءتوں کو اپنانے، شائع کرنے، تحقیقی مقالوں کی ترغیب اور ان کے لوگوں کی میزبانی سے خبردار کیا اور نصوص سے معاملے میں تفسیر کے معیارات اور شرعی ضوابط کی پابندی کا مطالبہ کیا۔ اکیڈمی کا موقف غیر جانبدارانہ انداز میں درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 16.ª sesión celebrada en Dubái (30 de Safar – 5 de Rabi al-Awwal de 1426, del 9 al 14 de abril de 2005). En su propio texto, sostuvo que la denominada «nueva interpretación» de los textos religiosos, que distorsiona su significado —incluso recurriendo a opiniones anómalas— para apartarlos del consenso y contradecir lo que denomina «los hechos jurídicos», constituye una innovación reprobable y un grave peligro para las sociedades musulmanas, su cultura y sus valores. Asimismo, señaló que algunos defensores la adoptaron por desconocimiento de los criterios de tafsir o por un afán desmedido por la novedad. Advirtió contra la adopción, publicación, fomento de tesis de posgrado sobre dichas interpretaciones y la acogida de sus figuras por parte de las instituciones académicas, e instó a la adhesión a los criterios de interpretación establecidos y a los controles legales en el manejo de los textos. La posición de la Academia se registra de forma neutral."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 16e session à Dubaï (30 Safar – 5 Rabi al-Awwal 1426, 9-14 avril 2005). Dans son texte, l'Académie affirme que la prétendue « nouvelle lecture » des textes religieux, qui en dénature le sens – allant jusqu'à s'appuyer sur des opinions aberrantes – afin de les écarter du consensus et de contredire ce qu'elle appelle les « faits juridiques », constitue une innovation répréhensible et un grave danger pour les sociétés musulmanes, leur culture et leurs valeurs. Elle note que certains de ses partisans y ont succombé par ignorance des critères régissant le tafsir ou par un goût immodéré pour la nouveauté. L'Académie met en garde contre l'adoption, la publication, la promotion de thèses de doctorat portant sur de telles lectures et l'accueil de leurs auteurs par les institutions académiques. Elle appelle au respect des critères d'interprétation établis et des contrôles juridiques en matière de textes. La position de l'Académie est consignée de manière neutre."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (30 Sefer – 5 Rabi'al-Awwal 1426 H, 9–14 Nisan 2005) toplu kararı olarak kabul edildi. Metinde, dini metinlerin yeni bir yorumu olarak adlandırılan şeyin, uzlaşıdan sapan ve 'dini gerçeklere' aykırı sapkınlıklar bile olsa metinlerin anlamlarının çarpıtılmasına yol açması durumunda, kınanacak bir yenilik ve İslam toplumları, kültürleri ve değerleri için ciddi bir tehlike olduğu kararlaştırıldı. Bu eğilimin bazı savunucularının yorumun rehber standartlarını bilmiyor veya kontrolsüz yeniliğe takıntılı olduklarını belirtti. Bazı akademik kurumların bu okumaları benimsemesi ve yayımlaması konusunda uyarıda bulundu, üniversite tezlerini teşvik etti ve sembollerini barındırdı; ayrıca metinlerin işlenmesinde yerleşik yorum standartlarına ve Şeriat düzenlemelerine uyulması çağrısında bulundu. Akademinin tutumu tarafsız olarak kaydedildi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi keenam belas di Dubai (30 Safar – 5 Rabi al-Awwal 1426 H, 9–14 April 2005 M). Dalam teksnya diputuskan bahwa apa yang disebut pembacaan baru terhadap teks-teks agama, jika menyebabkan distorsi makna teks, bahkan berdasarkan pernyataan menyimpang yang menyimpang dari konsensus dan bertentangan dengan 'fakta agama,' dianggap sebagai inovasi tercela dan bahaya besar bagi masyarakat Islam, budaya, dan nilai-nilai mereka. Studi mencatat bahwa beberapa pendukung tren ini jatuh ke dalam ketidaktahuan terhadap standar penafsiran atau terobsesi dengan inovasi yang tidak terkendali. Studi ini memperingatkan terhadap adopsi dan publikasi bacaan ini oleh beberapa badan akademik, mendorong tesis universitas tentangnya, dan menampung simbol-simbolnya, serta menyerukan kepatuhan terhadap standar interpretasi dan peraturan Syariah yang telah ditetapkan dalam penanganan teks. Posisi Akademi dicatat secara netral."
