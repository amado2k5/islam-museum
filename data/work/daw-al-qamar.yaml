label: { ar: "ضوء القمر", en: "Ḍawʾ al-qamar (On the Light of the Moon)", ur: "ضوء القمر", es: "Ḍawʾ al-qamar (A la luz de la luna)", fr: "Ḍawʾ al-qamar (À la lumière de la lune)", tr: "ay ışığı", id: "cahaya bulan" }
summary:
  ar: "مقالة عربية لابن الهيثم البصري المصري في ضوء القمر؛ تسجلها ISMI تحت العنوان «ضوء القمر» وألقابه «مقالة في ضوء القمر»، من تأليفه المبكر (matn)، ألّفها قبل 7 آب 1031م، وبقيت منها ثلاثة شهود مخطوطة: حلب و لندن وسانت بطرسبورغ {cite:ismi-daw-al-qamar}."
  en: "An Arabic treatise by Ibn al-Haytham al-Basri al-Misri on the light of the Moon; ISMI catalogs it as Ḍawʾ al-qamar with the aliases 'Maqālaẗ li-Ibn al-Ḥasan fī al-ḍawʾ al-qamar' and 'Maqālah fī al-ḍawʾ al-qamar', an early first-order composition composed before 7 August 1031, surviving in three manuscript witnesses at Aleppo, London and St Petersburg {cite:ismi-daw-al-qamar}."
  ur: "ابن الہیثم البصری المصري کی چاند کی روشنی پر عربی رسالہ؛ ISMI اسے «ضوء القمر» کے عنوان سے، عرف «مقالہ فی ضوء القمر» کے ساتھ درج کرتی ہے، ابتدائی درجہ کی تصنیف جو 7 اگست 1031ء سے پہلے مرتب ہوئی، اور حلب، لندن اور سینٹ پیٹرزبرگ میں تین مخطوطہ گواہوں میں باقی ہے {cite:ismi-daw-al-qamar}۔"
  es: "Un tratado árabe de Ibn al-Haytham al-Basri al-Misri sobre la luz de la Luna; ISMI lo cataloga como Ḍawʾ al-qamar con los alias 'Maqālaẗ li-Ibn al-Ḥasan fī al-ḍawʾ al-qamar' y 'Maqālah fī al-ḍawʾ al-qamar', una composición temprana de primer orden compuesta antes del 7 de agosto de 1031, que se conserva en tres manuscritos en Alepo, Londres y San Petersburgo {cite:ismi-daw-al-qamar}."
  fr: "Un traité arabe d'Ibn al-Haytham al-Basri al-Misri sur la lumière de la Lune; ISMI le catalogue sous le nom de Ḍawʾ al-qamar avec les alias 'Maqālaẗ li-Ibn al-Ḥasan fī al-ḍawʾ al-qamar' et 'Maqālah fī al-ḍawʾ al-qamar', une composition ancienne de premier ordre composée avant le 7 août 1031, survivant dans trois témoins manuscrits à Alep, Londres et Saint-Pétersbourg {cite:ismi-daw-al-qamar}."
  tr: "İbn el-Heytham el-Basri el-Masri tarafından Ay Işığı üzerine Arapça bir makale; ISMI tarafından 'Ay Işığı' başlığı altında kaydedilmiş ve başlıkları 'Ay Işığında Deneme' başlıklarıyla kaydedilmiştir, kendisi tarafından erken dönemde (matn) yazılmış, 7 Ağustos 1031'den önce yazılmış ve üç el yazması tanığı kalmıştır: Halep, Londra ve Saint Petersburg {cite:ismi-daw-al-qamar}."
  id: "Sebuah artikel Arab oleh Ibn al-Haytham al-Basri al-Masri tentang Cahaya Bulan; direkam oleh ISMI dengan judul 'Cahaya Bulan' dan judulnya 'Esai di Cahaya Bulan,' yang ditulis olehnya pada awal (matn), disusun sebelum 7 Agustus 1031 M, dan dari mana tiga naskah saksi masih ada: Aleppo, London, dan Saint Petersburg {cite:ismi-daw-al-qamar}."
