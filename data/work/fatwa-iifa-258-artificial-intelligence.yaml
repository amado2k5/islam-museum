label: { ar: "قرار مجمع الفقه الإسلامي الدولي 258 (3/26) بشأن الذكاء الاصطناعي: أحكامه وضوابطه وأخلاقياته", en: "IIFA resolution 258 (3/26) on artificial intelligence: its rulings, controls and ethics", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 258 (3/26): مصنوعی ذہانت کے احکام، ضوابط اور اخلاقیات", es: "Resolución 258 (3/26) de la IIFA sobre inteligencia artificial: sus resoluciones, controles y ética.", fr: "Résolution 258 (3/26) de l'IIFA sur l'intelligence artificielle: ses décisions, ses contrôles et son éthique", tr: "Uluslararası İslami Fiqh Akademisi Kararı 258 (3/26) Yapay Zeka: Hükümleri, Kontrolleri ve Etiği", id: "Resolusi International Islamic Fiqh Academy 258 (26/3) tentang Kecerdasan Buatan: Ketentuan, Kontrol, dan Etika" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩. عرّف المجمع الذكاء الاصطناعي بأنه تقنية حديثة تقوم على برامج وآلات تحاكي الذكاء البشري تحقق مصالح ولا تخلو من مفاسد، وقرر أن الأصل في إنشائه واستخداماته الإباحة بضوابط: أن يكون القصد من الإنشاء والاستعمال والتمويل والمآل مشروعًا، وأن يحقق جلب المصلحة ودرء المفسدة، وألا يسيء إلى المعتقدات والأديان والرموز الدينية، وأن يحمي المعلومات ويصون الحريات والحقوق العامة والخاصة، وألا يهدد الأمن الفردي والمجتمعي والوطني، والالتزام بالأمانة والتوثيق والشفافية عند الاستعمال. وأوصى بدراسة حكم منحه شخصية اعتبارية وبعقد ندوات متخصصة عنه، مشيرًا إلى قراراته السابقة 43 ⁦(5/5)⁩ و230 ⁦(1/24)⁩ و243 ⁦(5/25)⁩ وإلى ميثاق الرياض للذكاء الاصطناعي الصادر عن الإيسيسكو ⁦(2025)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025). It defined artificial intelligence as a modern technology of programs and machines that simulate human intelligence, bringing many benefits but not free of harms, and ruled that its creation and use are in principle permissible under six controls: lawful intent in creation, use, financing and outcome; achieving benefit and warding off harm; no offence to beliefs, religions or religious symbols; protecting information and public and private freedoms and rights; no threat to individual, societal or national security; and honesty, documentation and transparency in use. It recommended studying the ruling on granting AI legal personhood and holding specialised seminars, citing its earlier resolutions 43 (5/5), 230 (1/24) and 243 (5/25) and ICESCO's Riyadh Charter for AI in the Islamic World (2025)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں۔ اکیڈمی نے مصنوعی ذہانت کی تعریف ایک جدید ٹیکنالوجی کے طور پر کی جو پروگراموں اور مشینوں پر مشتمل انسانی ذہانت کی نقل کرتی ہے، جس کے بہت سے فوائد ہیں مگر مفاسد سے خالی نہیں، اور فیصلہ کیا کہ اس کی تخلیق اور استعمال اصولاً مباح ہے چھ ضوابط کے ساتھ: تخلیق، استعمال، مالی معاونت اور انجام میں جائز قصد؛ مصلحت کی فراہمی اور مفسدت کا دفع؛ عقائد، مذاہب اور مذہبی علامتوں کی توہین سے اجتناب؛ معلومات کا تحفظ اور عوامی و نجی آزادیوں و حقوق کی حفاظت؛ انفرادی، سماجی اور قومی سلامتی کو خطرہ نہ ہونا؛ اور استعمال میں امانت، توثیق اور شفافیت۔ اکیڈمی نے مصنوعی ذہانت کو اعتباری شخصیت دینے کے حکم کے مطالعے اور مخصوص سیمینارز کی سفارش کی، اپنی سابقہ قراردادیں 43 ⁦(5/5)⁩، 230 ⁦(1/24)⁩ اور 243 ⁦(5/25)⁩ اور آئیسیسکو کا ریاض چارٹر برائے مصنوعی ذہانت ⁦(2025)⁩ کا حوالہ دیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 26.ª sesión en Doha (6-10 de Dhu al-Qa'da de 1446, 4-8 de mayo de 2025). Definió la inteligencia artificial como una tecnología moderna de programas y máquinas que simulan la inteligencia humana, aportando numerosos beneficios pero no exenta de riesgos, y dictaminó que su creación y uso son, en principio, permisibles bajo seis controles: intención lícita en la creación, el uso, la financiación y el resultado; obtención de beneficios y prevención de daños; ausencia de ofensas a creencias, religiones o símbolos religiosos; protección de la información y de las libertades y derechos públicos y privados; ausencia de amenaza a la seguridad individual, social o nacional; y honestidad, documentación y transparencia en su uso. Recomendó estudiar la resolución sobre la concesión de personalidad jurídica a la IA y celebrar seminarios especializados, citando sus resoluciones anteriores 43 (5/5), 230 (1/24) y 243 (5/25) y la Carta de Riad para la IA en el Mundo Islámico (2025) de la ICESCO."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 26e session à Doha (6-10 Dhu al-Qa'da 1446, soit 4-8 mai 2025) définit l'intelligence artificielle comme une technologie moderne composée de programmes et de machines simulant l'intelligence humaine. Si cette technologie présente de nombreux avantages, elle n'est pas exempte de risques. L'Académie statue que sa création et son utilisation sont, en principe, licites sous réserve de six conditions: l'intention licite lors de la création, de l'utilisation, du financement et des résultats; la recherche du bénéfice et la prévention du préjudice; l'absence d'atteinte aux croyances, aux religions ou aux symboles religieux; la protection des informations et des libertés et droits publics et privés; l'absence de menace pour la sécurité individuelle, sociétale ou nationale; et l'honnêteté, la documentation et la transparence dans son utilisation. L'Académie recommande d'étudier la question de la personnalité juridique de l'IA et d'organiser des séminaires spécialisés, en se référant à ses résolutions antérieures 43 (5/5), 230 (1/24) et 243 (5/25) ainsi qu'à la Charte de Riyad de l'ICESCO pour l'IA dans le monde islamique (2025)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki 26. oturumunda (6–10 Dhu al-Qi'dah 1446H, 4–8 Mayıs 2025) toplu kararı. Akademi, yapay zekayı, çıkar elde eden ve zararsız insan zekasını taklit eden programlar ve makineler temelli modern bir teknoloji olarak tanımlamıştır. Yaratım ve kullanımının asıl amacının belirli koşullar altında izin verilebilirlik olduğuna karar vermiştir: yaratım, kullanım, finansman amacının meşru olması; fayda sağlaması ve zararı önlemesi; inançlara, dinlere ve dini sembollere zarar vermemesi; bilgiyi koruması, kamu ve özel özgürlükleri ve hakları koruması; bireysel, toplumsal veya ulusal güvenliği tehdit etmemesi; ve kullanıldığında güvenilirlik, dokümantasyon ve şeffaflığa bağlı kalması. Kendisine tüzel kişilik veren kararın incelenmesini ve bu konuda özel seminerler düzenlenmesini önerdi; önceki kararları 43 (5/5), 230 (1/24) ve 243 (5/25) ile ICESCO tarafından yayımlanan Riyad Yapay Zeka Şartı'na (2025) atıfta bulundu."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-26 di Doha (6–10 Dhu al-Qi'dah 1446H, 4–8 Mei 2025). Akademi mendefinisikan kecerdasan buatan sebagai teknologi modern yang berbasis pada program dan mesin yang meniru kecerdasan manusia yang mencapai kepentingan dan bebas dari bahaya. Akademi memutuskan bahwa tujuan asli penciptaan dan penggunaannya adalah diperbolehkan dalam kondisi tertentu: bahwa tujuan penciptaan, penggunaan, pembiayaan, dan pada akhirnya sah; bahwa kecerdasan tersebut mencapai manfaat dan mencegah kerugian; bahwa kecerdasan tersebut tidak merugikan kepercayaan, agama, dan simbol agama; bahwa kecerdasan buatan melindungi informasi, melindungi kebebasan dan hak publik maupun pribadi; bahwa kecerdasan ini tidak mengancam keamanan individu, komunitas, atau nasional; dan bahwa ia mematuhi kepercayaan, dokumentasi, dan transparansi saat digunakan. Ia merekomendasikan untuk mempelajari putusan yang memberinya kepribadian hukum dan mengadakan seminar khusus tentang hal tersebut, merujuk pada resolusi sebelumnya 43 (5/5), 230 (1/24), dan 243 (5/25), serta Piagam Riyadh untuk Kecerdasan Buatan yang dikeluarkan oleh ICESCO (2025)."
