summary:
  ar: "ديوان الأدب لإسحاق بن إبراهيم الفارابي، خال الجوهري ومعلمه، ومن أهم المعاجم العربية. رُتّبت مواده على نظام الأبواب والفصول بحسب نوع الفعل وأوزان الأسماء. وما قيل من أنه ذهب إلى اليمن وألفه هناك غير صحيح، إذ اختلط الأمر بشخص يمني أكمل نسخة منه عن أبي العلاء المعري. ويعدّه بعلبكي أول معجم مبوَّب يستغرق أبنية الأسماء والأفعال معاً."
  en: "Ishaq ibn Ibrahim al-Farabi's Diwan al-adab, one of the most important Arabic dictionaries, by the uncle and teacher of al-Jawhari. Its entries are ordered by chapters (bab) and sections (fasl) according to the type of verb and the pattern of the noun. The report that he went to Yemen and wrote it there is not correct: it arose from confusion with a Yemeni who completed a copy of it from Abu l-Ala al-Ma'arri. Baalbaki calls it the first chaptered dictionary to cover both noun and verb patterns."
  es: "El Diwan al-adab de Ishaq ibn Ibrahim al-Farabi, uno de los diccionarios árabes más importantes, obra del tío y maestro de al-Jawhari. Sus entradas se ordenan por capítulos (bab) y secciones (fasl) según el tipo de verbo y el patrón del nombre. El relato de que fue a Yemen y lo escribió allí no es correcto: nació de la confusión con un yemení que completó una copia de él a partir de Abu l-Ala al-Ma'arri. Baalbaki lo llama el primer diccionario por capítulos que abarca tanto los patrones nominales como los verbales."
  fr: "Le Diwan al-adab d'Ishaq ibn Ibrahim al-Farabi, l'un des dictionnaires arabes les plus importants, œuvre de l'oncle et maître d'al-Jawhari. Ses entrées sont classées par chapitres (bab) et sections (fasl) selon le type de verbe et le schème du nom. Le récit selon lequel il serait allé au Yémen et l'y aurait écrit est inexact : il vient de la confusion avec un Yéménite qui compléta une copie de l'ouvrage d'après Abu l-Ala al-Ma'arri. Baalbaki le tient pour le premier dictionnaire par chapitres à couvrir à la fois les schèmes nominaux et verbaux."
  ur: "اسحاق بن ابراہیم الفارابی کی دیوان الادب، عربی کی اہم ترین لغات میں سے ایک، جوہری کے ماموں اور استاد کی تصنیف۔ اس کے مداخل افعال کی قسم اور اسماء کے اوزان کے لحاظ سے ابواب اور فصول کے نظام پر مرتب ہیں۔ یہ خبر کہ وہ یمن گئے اور وہاں اسے لکھا درست نہیں: یہ ایک یمنی شخص سے خلط کا نتیجہ ہے جس نے ابو العلاء معری سے اس کا ایک نسخہ مکمل کیا تھا۔ بعلبکی اسے پہلی ایسی ابواب وار لغت کہتے ہیں جو اسماء اور افعال دونوں کے اوزان کا احاطہ کرتی ہے۔"
  tr: "Diwan al-Adab, el-Cevhari'nin amcası ve öğretmeni olan İshaq ibn İbrahim el-Farabi'nin ve en önemli Arapça sözlüklerinden biridir. Materyalleri, fiil türüne ve isim kalıplarına göre bölümler ve bölümler şeklinde düzenlenmiştir. Yemen'e gidip orada yazdığı söylenenler yanlıştır, çünkü konu, eserin Ebu el-Ala' el-Ma'arri'den bir kopyasını tamamlayan bir Yemenli ile karıştırılmıştır. Baalbaki, hem isimleri hem fiilleri içeren ilk derlenmiş sözlük olarak kabul eder."
  id: "Diwan al-Adab oleh Ishaq ibn Ibrahim al-Farabi, paman dan guru al-Jawhari, serta salah satu kamus Arab terpenting. Materi-materinya diatur menurut sistem bab dan bab sesuai jenis kata kerja dan pola kata benda. Apa yang dikatakan bahwa ia pergi ke Yaman dan menyusunnya di sana salah, karena masalah tersebut disalahartikan dengan orang Yaman yang menyelesaikan salinan kamus dari Abu al-Ala' al-Ma'arri. Baalbaki menganggapnya sebagai kamus pertama yang dikompilasi yang mencakup kata benda dan kata kerja."
