id: work/fatwa-aliftaa-jo-kidney-dialysis-while-fasting
class: work
kind: fatwa
label: { ar: "غسيل الكلى للصائم في رمضان", en: "Kidney dialysis while fasting in Ramadan", ur: "رمضان میں روزے دار کا ڈائیلاسز", es: "Diálisis renal durante el ayuno en Ramadán", fr: "Dialyse rénale pendant le jeûne du Ramadan", tr: "Ramazan ayında oruç tutan kişi için diyaliz", id: "Dialisis untuk orang yang berpuasa selama Ramadan" }
summary:
  ar: "سؤال عن غسيل الكلى للصائم في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يفطر، وعلى المريض القضاء، فإن لم يستطع أخرج الفدية. أجابت الدائرة بأن غسيل الكلى يفطر، لأن سائل الغسيل سائل مغذٍّ كما هو معلوم عند أهل الطب، ولأنه يؤدي إلى دخول أجسام إلى الجوف. وقالت إن على المريض أن يقضي ذلك اليوم بعد رمضان، فإن لم يستطع أخرج فدية، وهي إطعام مسكين عن كل يوم أفطره."
  en: "A question about kidney dialysis while fasting in Ramadan, in which Jordan's General Iftaa Department answered that it breaks the fast, that the patient must make the day up, and that if he cannot, he pays the fidya. The Department answered that kidney dialysis breaks the fast, because, as physicians know, the dialysis fluid is nourishing, and because it causes substances to enter the body's interior. It said that the patient must make that day up after Ramadan, and if he cannot, he pays the fidya, feeding one poor person for each day not fasted."
  ur: "رمضان میں روزے دار کا ڈائیلاسز کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ روزہ توڑ دیتا ہے، مریض کو قضا کرنی ہے، اور اگر نہ کر سکے تو فدیہ دے۔ ڈیپارٹمنٹ نے جواب دیا کہ ڈائیلاسز روزہ توڑ دیتا ہے، کیونکہ طبی ماہرین کے نزدیک ڈائیلاسز کا سیال غذائیت رکھتا ہے، اور اس سے اجسام جوف میں داخل ہوتے ہیں۔ اس نے کہا کہ مریض رمضان کے بعد اس دن کی قضا کرے، اور اگر نہ کر سکے تو فدیہ دے، یعنی ہر چھوڑے ہوئے دن کے بدلے ایک مسکین کو کھانا کھلائے۔"
  es: "Una pregunta sobre la diálisis renal durante el ayuno de Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que rompe el ayuno, que el paciente debe recuperar el día y que, si no puede, debe pagar la fidya. El Departamento explicó que la diálisis renal rompe el ayuno porque, como saben los médicos, el líquido de diálisis es nutritivo y porque permite que ciertas sustancias entren en el organismo. Añadió que el paciente debe recuperar ese día después de Ramadán y, si no puede, debe pagar la fidya, que consiste en alimentar a una persona pobre por cada día de ayuno no realizado."
  fr: "Une question concernant la dialyse rénale pendant le jeûne du Ramadan a été posée au Département général de la Iftaa en Jordanie. Ce dernier a répondu que la dialyse rompt le jeûne, que le patient doit rattraper la journée et que, dans l'impossibilité, il doit s'acquitter de la fidya. Le Département a expliqué que la dialyse rénale rompt le jeûne car, comme le savent les médecins, le liquide de dialyse est nutritif et permet à des substances de pénétrer dans l'organisme. Il a précisé que le patient doit rattraper cette journée après le Ramadan et que, dans l'impossibilité, il doit s'acquitter de la fidya, qui permet de nourrir une personne pauvre pour chaque jour de jeûne non respecté."
  tr: "Ramazan ayında oruç tutan bir kişi için diyaliz hakkında bir soru, Ürdün Genel Fetva Dairesi, orucunu bozması gerektiğini, hastanın orucu telafi etmesi gerektiğini; bunu yapamazsa fidya ödemesi gerektiğini söyledi. Bölüm, diyalizin orucu bozduğunu, diyaliz sıvısının tıp uzmanları arasında bilinen besleyici bir sıvı olması ve bedenlerin boşluğa girmesine yol açması nedeniyle olduğunu söyledi. Hastanın Ramazan'dan sonraki günü telafi etmesi gerektiği; eğer yapamazsa, bir fidya ödemesi gerektiğini, yani fakir bir kişinin orucunu bozduğu her gün için beslemesi gerektiğini belirtti."
  id: "Pertanyaan tentang dialisis untuk orang yang berpuasa selama Ramadan, di mana Departemen Fatwa Umum Yordania menjawab bahwa dia harus berbuka puasa, dan pasien harus menebus puasa; jika tidak mampu, dia harus membayar fidya. Departemen menjawab bahwa dialisis memutus puasa karena cairan dialisis adalah cairan yang memikar, seperti yang diketahui oleh para ahli medis, dan karena menyebabkan tubuh masuk ke rongga. Dikatakan bahwa pasien harus menebus keberadaan hari setelah Ramadan; jika tidak mampu, dia harus membayar fidya, yaitu memberi makan orang miskin untuk setiap hari dia berbuka puasa."
