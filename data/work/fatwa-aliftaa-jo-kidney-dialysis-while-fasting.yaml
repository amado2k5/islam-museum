id: work/fatwa-aliftaa-jo-kidney-dialysis-while-fasting
class: work
kind: fatwa
label: { ar: "غسيل الكلى للصائم في رمضان", en: "Kidney dialysis while fasting in Ramadan", ur: "رمضان میں روزے دار کا ڈائیلاسز" }
summary:
  ar: "سؤال عن غسيل الكلى للصائم في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يفطر، وعلى المريض القضاء، فإن لم يستطع أخرج الفدية. أجابت الدائرة بأن غسيل الكلى يفطر، لأن سائل الغسيل سائل مغذٍّ كما هو معلوم عند أهل الطب، ولأنه يؤدي إلى دخول أجسام إلى الجوف. وقالت إن على المريض أن يقضي ذلك اليوم بعد رمضان، فإن لم يستطع أخرج فدية، وهي إطعام مسكين عن كل يوم أفطره."
  en: "A question about kidney dialysis while fasting in Ramadan, in which Jordan's General Iftaa Department answered that it breaks the fast, that the patient must make the day up, and that if he cannot, he pays the fidya. The Department answered that kidney dialysis breaks the fast, because, as physicians know, the dialysis fluid is nourishing, and because it causes substances to enter the body's interior. It said that the patient must make that day up after Ramadan, and if he cannot, he pays the fidya, feeding one poor person for each day not fasted."
  ur: "رمضان میں روزے دار کا ڈائیلاسز کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ روزہ توڑ دیتا ہے، مریض کو قضا کرنی ہے، اور اگر نہ کر سکے تو فدیہ دے۔ ڈیپارٹمنٹ نے جواب دیا کہ ڈائیلاسز روزہ توڑ دیتا ہے، کیونکہ طبی ماہرین کے نزدیک ڈائیلاسز کا سیال غذائیت رکھتا ہے، اور اس سے اجسام جوف میں داخل ہوتے ہیں۔ اس نے کہا کہ مریض رمضان کے بعد اس دن کی قضا کرے، اور اگر نہ کر سکے تو فدیہ دے، یعنی ہر چھوڑے ہوئے دن کے بدلے ایک مسکین کو کھانا کھلائے۔"
