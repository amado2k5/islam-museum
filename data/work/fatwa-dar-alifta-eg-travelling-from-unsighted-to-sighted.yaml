id: work/fatwa-dar-alifta-eg-travelling-from-unsighted-to-sighted
class: work
kind: fatwa
label: { ar: "الواجب على من سافر من بلد لم تثبت فيه رؤية هلال رمضان إلى بلد ثبتت فيه", en: "The duty of one travelling from a land where the crescent was not confirmed to one where it was", ur: "اس مسافر کا فرض جو غیر تصدیق شدہ ملک سے تصدیق شدہ ملک جائے", es: "El deber de quien viaja desde una tierra donde la media luna no estaba confirmada a una donde sí lo estaba.", fr: "Le devoir de celui qui voyage d'un pays où le croissant n'était pas confirmé vers un pays où il l'était.", tr: "Ramazan hilalinin görüldüğü kanıtlanmamış bir ülkeden kesinleşmiş bir ülkeye seyahat edenler için zorunludur", id: "Ini wajib bagi mereka yang bepergian dari negara di mana penampakan bulan sabit Ramadan belum terbukti ke negara yang sudah dikonfirmasi" }
summary:
  ar: "سائل سأل عن من سافر من مصر حيث لم تثبت رؤية الهلال إلى السعودية حيث ثبتت رؤيته لأداء العمرة بعد فجر الأربعاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22532)⁩ ببيان ما يجب عليه في صومه وإفطاره تبعًا لكل بلد كما فصّل الجواب."
  en: "A questioner asked about one travelling from Egypt — where the crescent had not been confirmed — to Saudi Arabia, where it had, to perform umrah, after dawn on the Wednesday. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22532) answered by setting out what is required of him in fasting and breaking fast according to each country, as the answer details."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو مصر سے — جہاں چند کی تصدیق نہ ہوئی — سعودی عرب گیا جہاں تصدیق ہو چکی تھی، عمرہ کے لیے، بدھ کی فجر کے بعد۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22532)⁩ نے جواب میں یہ بیان کیا کہ ہر ملک کے اعتبار سے اس کے روزے اور افطار پر کیا لازم ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre una persona que viajaba desde Egipto —donde la luna creciente aún no se había confirmado— a Arabia Saudita, donde sí se había confirmado, para realizar la umrah después del amanecer del miércoles. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22532) respondió detallando los requisitos para ayunar y romper el ayuno según cada país, como se especifica en la respuesta."
  fr: "Un internaute a posé une question concernant un voyageur se rendant d'Égypte — où le croissant de lune n'avait pas été confirmé — en Arabie saoudite, où il l'avait été, pour accomplir la umra après l'aube du mercredi. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22532) a répondu en détaillant les obligations du voyageur concernant le jeûne et la rupture du jeûne dans chaque pays."
  tr: "Bir soru soran kişi, hilal Ay'ın Suudi Arabistan'a görülmemesi nedeniyle Mısır'dan gelenler hakkında soru sordu; çünkü Çarşamba şafağından sonra Umre yaparken görüldüğü doğrulandı. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22532), her ülkeye göre oruç ve orucu bozmak için gerekenleri açıklamakla yanıt verdi; bu açıklama cevabında ayrıntılı olarak belirtildi."
  id: "Seorang penanya menanyakan tentang mereka yang datang dari Mesir, karena bulan sabit tidak terlihat di Arab Saudi, karena dikonfirmasi bahwa bulan itu terlihat melakukan Umrah setelah fajar Rabu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22532) menjawab dengan menjelaskan apa saja yang diperlukan untuk puasa dan berbuka puasa sesuai dengan masing-masing negara, sebagaimana dijelaskan dalam jawaban."
