summary:
  ar: "دراسة بالإنجليزية لليلى أحمد في عودة الحجاب في القرن العشرين من مصر إلى أمريكا، ونالت عنها جائزة غراوماير في الدين سنة 2013، صدرت عن مطبعة جامعة ييل سنة 2011."
  en: "An English study by Leila Ahmed of the return of the veil in the twentieth century from Egypt to America, which won her the 2013 Grawemeyer Award in Religion, published by Yale University Press in 2011."
  ur: "لیلیٰ احمد کا انگریزی مطالعہ جو بیسویں صدی میں مصر سے امریکا تک حجاب کی واپسی، جس پر انہیں 2013ء کا گراوِمیئر ایوارڈ برائے مذہب ملا پر ہے؛ ییل یونیورسٹی پریس سے 2011ء میں شائع ہوا۔"
  es: "Un estudio en inglés de Leila Ahmed sobre el retorno del velo en el siglo XX desde Egipto a Estados Unidos, que le valió el Premio Grawemeyer de Religión en 2013, publicado por Yale University Press en 2011."
  fr: "Une étude en anglais de Leila Ahmed sur le retour du voile au XXe siècle d'Égypte en Amérique, qui lui a valu le prix Grawemeyer 2013 en religion, publiée par Yale University Press en 2011."
  tr: "Layla Ahmed'in 20. yüzyılda Mısır'dan Amerika'ya perçenin geri dönüşü üzerine İngilizce bir çalışması; bu çalışmayla 2013'te Yale University Press tarafından yayımlanan Graumeyer Din Ödülü'nü kazandı."
  id: "Sebuah studi bahasa Inggris oleh Layla Ahmed tentang kembalinya kerudung pada abad kedua puluh dari Mesir ke Amerika, yang membuatnya memenangkan Graumeyer Prize in Religion pada tahun 2013, diterbitkan oleh Yale University Press pada tahun 2011."
