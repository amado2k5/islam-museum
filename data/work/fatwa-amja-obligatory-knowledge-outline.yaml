label: { ar: "ما لا يسع المسلم جهله", en: "What a Muslim may not be ignorant of — research guidance", ur: "ہر مسلمان پر لازم علم — تحقیقی رہنمائی", es: "Lo que un musulmán no puede ignorar: orientación para la investigación", fr: "Ce qu'un musulman ne doit pas ignorer: les conseils de recherche", tr: "Bir Müslümanın cehaletle ne yapabileceği", id: "Apa yang tidak bisa dilakukan seorang Muslim untuk tidak tahu apa-apa" }
summary:
  ar: "سأل سائل عن إعداد بحث علمي يحدد ما لا يسع المسلم جهله في أبواب العلم الشرعي من فقه وعقيدة وفكر ومعاملات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 527 بتاريخ 5 فبراير 2005)⁩ بالإذن له ولا حرج سائلًا الله لهما التوفيق وناصحًا بالرجوع إلى المختصرات من كتب الفقه التي جمعها ثقات أهل العلم فيستخلص زبدتها لتكون مادة لموضوعه ثم يرتب الأمر وفق منهجية يرتضيها، ويحسن أن يكون له في ذلك مشرف شرعي يسدده ويعينه إن كان حديث عهد بالكتابة فإن الدلالة على العلم نصف العلم."
  en: "A questioner needed to prepare a study fixing what a Muslim may not be ignorant of across the sharia-sciences' chapters — fiqh, creed, thought and dealings. Dr. Salah al-Sawi (fatwa no. 527, 5 February 2005) gave him leave, asking God's guidance for both, and counselled going back to the compendia of fiqh gathered by trustworthy scholars, extracting their cream as his material, then ordering it on a method he approves; best he have a sharia supervisor to guide and help him if new to writing — pointing out knowledge is half of knowledge."
  ur: "ایک سائل نے ہر مسلمان کے لیے لازم علم کی تحقیق میں رہنمائی چاہی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 527، 5 فروری 2005)⁩ کے مطابق مستند مختصر فقہی کتابوں سے مادہ اخذ کرے اور شرعی نگران رکھے۔"
  es: "Un consultante necesitaba preparar un estudio que abarcara los aspectos que un musulmán no debería ignorar en las distintas ramas de las ciencias islámicas: fiqh, credo, pensamiento y relaciones. El Dr. Salah al-Sawi (fatwa n.º 527, 5 de febrero de 2005) le dio permiso, pidiendo la guía de Dios para ambos, y le aconsejó que consultara los compendios de fiqh recopilados por eruditos de confianza, extrayendo lo esencial como material para su estudio y organizándolo según un método que él aprobara; lo mejor sería que contara con un supervisor de la sharia que lo guiara y ayudara si era nuevo en la escritura, señalando que el conocimiento es la mitad del conocimiento."
  fr: "Un chercheur souhaitait réaliser une étude recensant les connaissances qu'un musulman ne saurait ignorer dans les différents chapitres des sciences islamiques (fiqh), à savoir le droit islamique (fiqh), la croyance, la pensée et les relations avec les musulmans. Le Dr Salah al-Sawi (fatwa n° 527, 5 février 2005) lui en donna l'autorisation, implorant la guidance divine. Il lui conseilla de se référer aux recueils de fiqh compilés par des savants reconnus, d'en extraire les idées les plus pertinentes et de les organiser selon une méthode qu'il jugerait appropriée. Il lui recommanda également de se faire accompagner d'un superviseur en droit islamique s'il était novice en la matière, soulignant que la connaissance préalable représente la moitié du savoir."
  tr: "Bir soru soran, bir Müslümanın İslami bilgi alanlarında – fıkıh, inanç, düşünce ve işlemler dahil olmak üzere – nelerden habersiz olamayacağını belirleyen bilimsel bir araştırma makalesi hazırlamayı sordu. Dr. Salah Al-Sawy (5 Şubat 2005 tarihli 527 No. Fetva) izin aldı ve zarar vermeden yanıt verdi; Allah'tan başarı dilemesini istedi ve güvenilir alimler tarafından derlenen fıkıh kitaplarının özetlerine başvurarak özetlerini çıkarmalarını tavsiye etti, sonra konuyu kabul ettiği bir metodolojiye göre düzenlemelerini tavsiye etti. Yazmaya yeni başladıysa, bilgiyi belirtmek bilginin yarısı olduğundan, ona rehberlik edecek ve yardımcı olacak bir hukuk danışmanının olması tavsiye edilir."
  id: "Seorang penanya menanyakan tentang persiapan makalah penelitian ilmiah yang mengidentifikasi apa yang tidak boleh diabaikan oleh seorang Muslim dalam bidang ilmu Islam, termasuk yurisprudensi, kepercayaan, pemikiran, dan transaksi. Dr. Salah Al-Sawy menjawab (Fatwa No. 527 tanggal 5 Februari 2005) dengan izin dan tanpa masalah, memohon kepada Allah agar mereka berhasil dan menyarankan mereka untuk merujuk pada ringkasan dari buku firisprudensi yang disusun oleh ulama terpercaya untuk mengekstrak esensinya sebagai bahan bagi subjek tersebut, lalu mengatur masalah tersebut sesuai metodologi yang diterimanya. Disarankan memiliki pengawas hukum yang membimbing dan membantunya jika dia baru dalam dunia penulisan, karena menunjukkan bahwa pengetahuan adalah setengah dari pengetahuan."
