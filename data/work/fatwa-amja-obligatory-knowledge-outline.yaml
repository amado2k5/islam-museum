label: { ar: "ما لا يسع المسلم جهله", en: "What a Muslim may not be ignorant of — research guidance", ur: "ہر مسلمان پر لازم علم — تحقیقی رہنمائی" }
summary:
  ar: "سأل سائل عن إعداد بحث علمي يحدد ما لا يسع المسلم جهله في أبواب العلم الشرعي من فقه وعقيدة وفكر ومعاملات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 527 بتاريخ 5 فبراير 2005)⁩ بالإذن له ولا حرج سائلًا الله لهما التوفيق وناصحًا بالرجوع إلى المختصرات من كتب الفقه التي جمعها ثقات أهل العلم فيستخلص زبدتها لتكون مادة لموضوعه ثم يرتب الأمر وفق منهجية يرتضيها، ويحسن أن يكون له في ذلك مشرف شرعي يسدده ويعينه إن كان حديث عهد بالكتابة فإن الدلالة على العلم نصف العلم."
  en: "A questioner needed to prepare a study fixing what a Muslim may not be ignorant of across the sharia-sciences' chapters — fiqh, creed, thought and dealings. Dr. Salah al-Sawi (fatwa no. 527, 5 February 2005) gave him leave, asking God's guidance for both, and counselled going back to the compendia of fiqh gathered by trustworthy scholars, extracting their cream as his material, then ordering it on a method he approves; best he have a sharia supervisor to guide and help him if new to writing — pointing out knowledge is half of knowledge."
  ur: "ایک سائل نے ہر مسلمان کے لیے لازم علم کی تحقیق میں رہنمائی چاہی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 527، 5 فروری 2005)⁩ کے مطابق مستند مختصر فقہی کتابوں سے مادہ اخذ کرے اور شرعی نگران رکھے۔"
