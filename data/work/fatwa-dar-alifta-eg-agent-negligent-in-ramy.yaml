id: work/fatwa-dar-alifta-eg-agent-negligent-in-ramy
class: work
kind: fatwa
label: { ar: "حكم تقصير الوكيل في نيابته في رمي الجمار", en: "An agent falling short in stoning the jamarat on another's behalf", ur: "وکیل کا رمی جمار میں دوسرے کی طرف سے کوتاہی", es: "Un agente que no logró apedrear la jamarat en nombre de otro.", fr: "Un agent qui échoue à lapider la jamarat au nom d'un autre", tr: "Jamarat'ı taşlamadaki temsilcinin ihmali üzerine karar", id: "Putusan tentang kelalaian agen dalam perwakilannya dalam melempari Jamarat dengan batu" }
summary:
  ar: "سائل رمى الجمار دفعة واحدة عن جاره بعد إنابته له فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21933)⁩ أن رميه مجزئ صحيح ولا يلزمه فدية لكون النيابة جائزة على ما فصّل الجواب."
  en: "A man stoned the jamarat in one throw on behalf of his neighbour after the neighbour deputised him, and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21933) answered that his stoning is valid and sufficient — no expiation is due since deputation is lawful — as the answer details."
  ur: "ایک شخص نے اپنے پڑوسی کی طرف سے — اس کے وکیل بننے کے بعد — سنگ باری ایک ہی بار میں کر دی اور حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21933)⁩ نے جواب دیا کہ اس کی رمی صحیح اور کافی ہے اور فدیہ واجب نہیں کیونکہ نیابت جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre apedreó la jamarat de un solo lanzamiento en nombre de su vecino, después de que este lo designara como suplente, y solicitó la opinión del tribunal. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21933) respondió que el apedreamiento era válido y suficiente, ya que no se requería expiación alguna, dado que la designación como suplente era lícita, como se detalla en la respuesta."
  fr: "Un homme a lapidé la jamarat d'un seul jet au nom de son voisin, après que celui-ci l'eut mandaté, et a demandé l'avis juridique. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21933) a répondu que la lapidation était valide et suffisante — aucune expiation n'est due puisque la délégation est licite — comme le précise la réponse."
  tr: "Göreve getirildikten sonra komşusundan bir kerede cemarat atan ve kararını soran bir kişi. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21933), cemaratta atmanın geçerli ve geçerlilik olduğunu, fidya ödemek zorunda olmadığını çünkü kovuşturmanın izin verildiğini yanıtladı."
  id: "Seorang penanya yang langsung melempar jamarat dari tetangganya setelah diangkat ke jabatannya dan menanyakan tentang keputusannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21933) menjawab bahwa melempar jamarat itu sah dan sah, dan ia tidak diwajibkan membayar fidya karena penuntutan diperbolehkan, seperti yang dijelaskan dalam jawaban."
