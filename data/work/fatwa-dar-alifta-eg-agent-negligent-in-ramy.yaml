label: { ar: "حكم تقصير الوكيل في نيابته في رمي الجمار", en: "An agent falling short in stoning the jamarat on another's behalf", ur: "وکیل کا رمی جمار میں دوسرے کی طرف سے کوتاہی" }
summary:
  ar: "سائل رمى الجمار دفعة واحدة عن جاره بعد إنابته له فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21933)⁩ أن رميه مجزئ صحيح ولا يلزمه فدية لكون النيابة جائزة على ما فصّل الجواب."
  en: "A man stoned the jamarat in one throw on behalf of his neighbour after the neighbour deputised him, and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21933) answered that his stoning is valid and sufficient — no expiation is due since deputation is lawful — as the answer details."
  ur: "ایک شخص نے اپنے پڑوسی کی طرف سے — اس کے وکیل بننے کے بعد — سنگ باری ایک ہی بار میں کر دی اور حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21933)⁩ نے جواب دیا کہ اس کی رمی صحیح اور کافی ہے اور فدیہ واجب نہیں کیونکہ نیابت جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
