label: { ar: "قصيدة حسان «سائل قريشا وأحلافها»", en: "Hassan's poem 'Ask Quraysh and its allies'", es: "El poema de Hassan, 'Preguntad a Quraysh y sus aliados'.", fr: "Le poème de Hassan « Demandez aux Quraysh et à leurs alliés »", ur: "حسن کی نظم 'قریش اور اس کے اتحادیوں سے پوچھو'", tr: "Hassan'ın \"Qureyş'in Denizcisi ve Müttefikleri\" şiiri", id: "Puisi Hassan \"Pelaut Quraysh dan Sekutunya\"" }
summary:
  ar: "أبيات لحسان بن ثابت من المتقارب على روي الباء، قالها لبني عوف بن عوف ينفي بها نسبهم إلى قريش {{cite:sharh-diwan-hassan-barquqi-1929 p.62-63}}."
  en: "Verses by Hassan ibn Thabit in the mutaqarib metre on the rhyme ba', addressed to Banu Awf ibn Awf and denying their descent from Quraysh {{cite:sharh-diwan-hassan-barquqi-1929 p.62-63}}."
  es: "Versos de Hassan ibn Thabit en metro mutaqarib sobre la rima ba', dirigidos a Banu Awf ibn Awf y negando su descendencia de Quraysh {{cite:sharh-diwan-hassan-barquqi-1929 p.62-63}}."
  fr: "Vers de Hassan ibn Thabit en mètre mutaqarib sur la rime ba', adressés à Banu Awf ibn Awf et niant leur descendance de Quraysh {{cite:sharh-diwan-hassan-barquqi-1929 p.62-63}}."
  ur: "متقریب میٹر میں حسن بن ثابت کی آیات بعث میں بنو عوف ابن عوف کو مخاطب کرکے قریش سے ان کے نزول کا انکار کرتی ہیں"
  tr: "Hasan ibn Tabit'in anlatıcılarından Ba' mektubunun anlatıcılarından alınan şiirler; bu mektubu Banu Awf ibn Awf'a söylediği ve onların Kurayş'a ait olduğunu reddeden dizeler {{cite:sharh-diwan-hassan-barquqi-1929 s.62-63}}."
  id: "Ayat-ayat oleh Hassan ibn Thabit dari para narator surat Ba', yang ia ucapkan kepada Banu Awf ibn Awf, menyangkal garis keturunan mereka kepada Quraisy {{cite:sharh-diwan-hassan-barquqi-1929 hlm.62-63}}."
