id: work/fatwa-dar-alifta-eg-ghusl-after-ivf
class: work
kind: fatwa
label: { ar: "حكم الغسل للمرأة بعد التلقيح الصناعي", en: "Is ghusl required of the wife after IVF?", ur: "مصنوعی تلقیح کے بعد عورت پر غسل", es: "¿Es necesario que la esposa realice el ghusl después de la FIV?", fr: "L'épouse doit-elle effectuer le ghusl après une FIV ?", tr: "Tüp bebek sonrası kadınlar için ghusl kararı", id: "Putusan tentang ghusl untuk wanita setelah IVF" }
summary:
  ar: "سائل سأل عن وجوب الغسل على الزوجة بعد إجراء عملية التلقيح الصناعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21502)⁩ أنه لا يجب عليها الاغتسال لأن موجب الغسل إما الإيلاج والتقاء الختانين أو الإنزال وكلاهما غير موجود على ما فصّل الجواب."
  en: "A questioner asked whether ghusl is obligatory on the wife after in-vitro fertilisation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21502) answered that it is not, since what obliges the bath is penetration or ejaculation and neither occurred — as the answer details."
  ur: "ایک سائل نے مصنوعی تلقیح کے بعد عورت پر غسل کے واجب ہونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21502)⁩ نے جواب دیا کہ واجب نہیں کیونکہ غسل کا موجب کوئی نہیں پایا گیا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó si el ghusl es obligatorio para la esposa después de la fertilización in vitro. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21502) respondió que no lo es, ya que lo que obliga al baño es la penetración o la eyaculación, y ninguna de las dos ocurrió, como se detalla en la respuesta."
  fr: "Une personne a demandé si le ghusl était obligatoire pour l'épouse après une fécondation in vitro. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21502) a répondu par la négative, car ce qui rend le bain rituel obligatoire est la pénétration ou l'éjaculation, or aucune de ces deux choses ne s'est produite, comme le précise la réponse."
  tr: "Bir soru soran kişi, yapay döllenmeden sonra eş için gusl zorunluluğu hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21502), gusl yapmak zorunda olmadığını, çünkü ghusl için zorunluluğun ya penetrasyon ve iki kadın sünnetinin buluşması ya da boşalma olduğunu, bunların cevabında ayrıntılı olarak yer almadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang kewajiban ghusl bagi seorang istri setelah menjalani inseminasi buatan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21502) menjawab bahwa dia tidak wajib melakukan ghusl karena kewajiban ghusl adalah penetrasi dan pertemuan dua sunat atau ejakulasi wanita, yang keduanya tidak dijelaskan secara rinci dalam jawaban."
