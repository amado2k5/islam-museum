label: { ar: "قرار مجمع الفقه الإسلامي الدولي 184 (19/10) بشأن الإذن في العمليات الطبية المستعجلة", en: "IIFA resolution 184 (19/10) on consent for emergency medical procedures", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 184 (19/10): ہنگامی طبی کارروائیوں کے لیے اجازت", es: "Resolución 184 (19/10) de la IIFA sobre el consentimiento para procedimientos médicos de emergencia.", fr: "Résolution 184 (19/10) de l'IIFA relative au consentement aux interventions médicales d'urgence" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩، استكمالًا لقراريه السابقين 67 ⁦(7/5)⁩ بشأن أحكام التداوي و172 ⁦(18/10)⁩ بشأن التدابير الطبية في الحالات الإسعافية. عرّف الحالات المستعجلة بما يستدعي تدخلًا علاجيًا أو جراحيًا دون تأخير إنقاذًا لحياة المريض أو منعًا لتلف عضو ⁦(كالولادة القيصرية الضرورية، والتهاب الزائدة، وغسيل الكلى ونقل الدم)⁩. وقرر: إن كان المريض كامل الأهلية تام الوعي وقرر الأطباء استعجال حالته وضرورة التدخل فإذنه لعلاجه واجب يأثم بتركه، وللطبيب إجراء التدخل اللازم إنقاذًا لحياته استنادًا لأحكام الضرورة؛ وإن كان ناقص الأهلية ورفض وليه الإذن في المستعجل فلا يعتد برفضه وينتقل حق الإذن إلى ولي الأمر أو من ينيبه من الجهات المختصة. وتناول النص الأحوال التي يصح فيها التدخل دون إذن ابتداءً حفاظًا على الحياة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009), completing its earlier resolutions 67 (7/5) on the rules of medical treatment and 172 (18/10) on necessary measures in emergency medicine. It defined emergencies as cases requiring immediate therapeutic or surgical intervention to save life or prevent organ damage (emergency caesarean delivery, acute appendicitis, dialysis and blood transfusion and the like). It ruled: if the patient is of full capacity and sound mind and the physicians judge his condition urgent and intervention necessary, giving his consent is obligatory and withholding it sinful, and the physician may perform the needed intervention to save his life under the rules of necessity; if the patient lacks capacity and his guardian refuses consent in an emergency, the refusal is disregarded and the right of consent passes to the public authority or its designated body — and the text addressed the cases where intervention may proceed without prior consent to preserve life."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں، جو اس کی سابقہ قراردادوں 67 ⁦(7/5)⁩ برائے احکامِ تداوی اور 172 ⁦(18/10)⁩ برائے طبِ طوارئ کے ضروری انتظامات کا تکملہ ہے۔ اس نے ہنگامی حالات کی تعریف کی: وہ صورتیں جن میں زندگی بچانے یا کسی عضو کے ضائع ہونے سے بچانے کے لیے بلا تاخیر علاج یا سرجری درکار ہو ⁦(ضروری سیزیرین، شدید اپنڈکس، ڈائیلاسس اور خون کی منتقلی وغیرہ)⁩۔ فیصلے: اگر مریض کامل اہلیت اور باخود ہو اور معالجین حالت کو ہنگامی اور مداخلت کو ضروری قرار دیں تو اجازت دینا اس پر واجب اور ترک گناہ ہے، اور معالج ضرورت کے احکام کی بنا پر جان بچانے کے لیے مداخلت کر سکتا ہے؛ اگر مریض ناقص اہلیت ہو اور اس کا ولی ہنگامی حالت میں اجازت نہ دے تو اس کی انکار معتبر نہیں اور اجازت کا حق ولایتِ امر یا اس کے مقرر کردہ ادارے کو منتقل ہوتا ہے — متن نے ان صورتوں کا بھی ذکر کیا جن میں جان بچانے کے لیے ابتدائی اجازت کے بغیر مداخلت جائز ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula 1430, 26-30 de abril de 2009), completando sus resoluciones anteriores 67 (7/5) sobre las reglas del tratamiento médico y 172 (18/10) sobre las medidas necesarias en medicina de emergencia. Definió las emergencias como casos que requieren intervención terapéutica o quirúrgica inmediata para salvar la vida o prevenir daños en los órganos (parto por cesárea de emergencia, apendicitis aguda, diálisis y transfusión de sangre y similares). Dictaminó: si el paciente tiene plena capacidad y mente sana y los médicos juzgan que su condición es urgente y la intervención necesaria, dar su consentimiento es obligatorio y retenerlo es pecaminoso, y el médico puede realizar la intervención necesaria para salvar su vida bajo las reglas de necesidad; Si el paciente carece de capacidad y su tutor se niega a dar su consentimiento en caso de emergencia, la negativa se ignora y el derecho de consentimiento pasa a la autoridad pública o al organismo designado por esta; asimismo, el texto aborda los casos en los que la intervención puede llevarse a cabo sin consentimiento previo para preservar la vida."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009), complétant ses résolutions antérieures 67 (7/5) sur les règles du traitement médical et 172 (18/10) sur les mesures nécessaires en médecine d'urgence. Elle définit les urgences comme des cas nécessitant une intervention thérapeutique ou chirurgicale immédiate pour sauver une vie ou prévenir des lésions organiques (césarienne d'urgence, appendicite aiguë, dialyse, transfusion sanguine, etc.). Elle statue que si le patient est sain d'esprit et capable de discernement, et si les médecins jugent son état urgent et une intervention nécessaire, son consentement est obligatoire et son refus constitue un péché; le médecin peut alors procéder à l'intervention nécessaire pour lui sauver la vie, conformément aux règles de nécessité. Si le patient est incapable de consentir et que son tuteur refuse de donner son consentement en cas d'urgence, ce refus est ignoré et le droit de consentir est transféré à l'autorité publique ou à son organisme désigné — et le texte aborde les cas où une intervention peut être effectuée sans consentement préalable pour préserver la vie."
