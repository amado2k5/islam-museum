id: work/fatwa-dar-alifta-zakat-on-end-of-service-gratuity
class: work
kind: fatwa
label: { ar: "كيفية إخراج الزكاة في مكافأة نهاية الخدمة", en: "Paying zakat on an end-of-service gratuity", ur: "ملازمت کے اختتامی انعام پر زکوٰۃ کی ادائیگی", es: "Pagar el zakat sobre la propina al final del servicio.", fr: "Payer la zakat sur le pourboire de fin de service" }
summary:
  ar: "سؤال عن زكاة مكافأة نهاية الخدمة، أجابت فيه دار الإفتاء المصرية بأنها لا تجب إلا بعد قبضها، ثم يُستقبل بها حول جديد أو تُضم إلى مال مدخر قائم الحول. أجابت الدار بأن مكافأة نهاية الخدمة لا تتعلق بها الزكاة إلا بعد قبضها، لعدم تمام الملك قبل ذلك. وقالت إن من ليس له مال مدخر آخر يستقبل بها حولًا جديدًا من تاريخ القبض، ومن له مال مدخر بدأ حوله يضمها إليه ويزكي الجميع في آخر الحول بربع العشر متى استوفت شروط الوجوب. وعرّفت المكافأة بأنها مبلغ يستحقه العامل وفق عقد العمل أو اللوائح تقديرًا لسنوات عمله، وأشارت إلى المادة 172 من قانون العمل المصري رقم 14 لسنة 2025."
  en: "A question on zakat on an end-of-service gratuity, in which Egypt's Dar al-Ifta answered that zakat is due only after it is received, after which it either starts a new zakat year or joins savings that already have a running year. Dar al-Ifta answered that zakat does not attach to the gratuity until it is received, because ownership is not complete before then. It said that someone with no other savings starts a new zakat year from the date of receipt, while someone whose savings already have a running year adds the gratuity to them and pays on the whole at the end of that year, at one fortieth (2.5%), once the conditions are met. It defined the gratuity as a sum the worker earns under his contract or the regulations in recognition of his years of service, referring to article 172 of Egypt's Labour Law no. 14 of 2025."
  ur: "ملازمت کے اختتامی انعام پر زکوٰۃ کے بارے میں سوال، جس میں مصر کے دار الافتاء نے کہا کہ زکوٰۃ وصولی کے بعد ہی واجب ہوتی ہے، پھر یا تو اس سے نیا سال شروع ہوتا ہے یا وہ پہلے سے جاری سال والی بچت میں شامل ہو جاتی ہے۔ دار الافتاء نے جواب دیا کہ اختتامی انعام پر زکوٰۃ وصولی کے بعد ہی متعلق ہوتی ہے، کیونکہ اس سے پہلے ملکیت مکمل نہیں ہوتی۔ اس نے کہا کہ جس کے پاس کوئی اور بچت نہ ہو وہ وصولی کی تاریخ سے نیا سال شروع کرے، اور جس کی بچت کا سال پہلے سے چل رہا ہو وہ اسے اس میں ملا کر سال کے آخر میں سب پر چالیسواں حصہ ⁦(2.5٪)⁩ ادا کرے، بشرطیکہ وجوب کی شرائط پوری ہوں۔ اس نے انعام کی تعریف ایسی رقم سے کی جو کارکن کو معاہدے یا ضوابط کے مطابق اس کی خدمت کے سالوں کے اعتراف میں ملتی ہے، اور مصر کے لیبر قانون نمبر 14 بابت 2025 کی دفعہ 172 کا حوالہ دیا۔"
  es: "Una pregunta sobre el zakat en relación con la gratificación por fin de servicio, a la que Dar al-Ifta de Egipto respondió que el zakat se debe pagar solo después de recibirlo, momento en el que se inicia un nuevo año de zakat o se suma a los ahorros que ya tienen un año en curso. Dar al-Ifta explicó que el zakat no se aplica a la gratificación hasta que se recibe, ya que la propiedad no es completa antes de ese momento. Indicó que quien no tiene otros ahorros inicia un nuevo año de zakat desde la fecha de recepción, mientras que quien tiene ahorros que ya tienen un año en curso suma la gratificación a estos y paga el total al final de ese año, a razón de una cuadragésima parte (2,5%), una vez que se cumplen las condiciones. Definió la gratificación como la suma que el trabajador percibe según su contrato o la normativa vigente en reconocimiento de sus años de servicio, haciendo referencia al artículo 172 de la Ley Laboral egipcia n.º 14 de 2025."
  fr: "Une question relative à la zakat sur une prime de fin de service a été posée à Dar al-Ifta, l'autorité égyptienne compétente. Dar al-Ifta a répondu que la zakat n'est due qu'après réception de la prime, après quoi soit une nouvelle année de zakat commence, soit elle est ajoutée à une épargne déjà en cours. Dar al-Ifta a précisé que la zakat ne s'applique pas à la prime tant qu'elle n'est pas perçue, car la propriété n'est pas pleinement acquise avant ce moment. L'autorité a indiqué qu'une personne sans autre épargne commence une nouvelle année de zakat à compter de la date de réception, tandis qu'une personne dont l'épargne est déjà en cours y ajoute la prime et paie la totalité de la zakat à la fin de cette année, à hauteur d'un quarantième (2,5 %), une fois les conditions remplies. Dar al-Ifta a défini la prime comme une somme que le travailleur perçoit en vertu de son contrat ou de la réglementation, en reconnaissance de ses années de service, en se référant à l'article 172 de la loi égyptienne n° 14 de 2025 relative au travail."
