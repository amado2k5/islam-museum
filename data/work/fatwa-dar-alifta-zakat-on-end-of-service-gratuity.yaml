id: work/fatwa-dar-alifta-zakat-on-end-of-service-gratuity
class: work
kind: fatwa
label: { ar: "كيفية إخراج الزكاة في مكافأة نهاية الخدمة", en: "Paying zakat on an end-of-service gratuity", ur: "ملازمت کے اختتامی انعام پر زکوٰۃ کی ادائیگی" }
summary:
  ar: "سؤال عن زكاة مكافأة نهاية الخدمة، أجابت فيه دار الإفتاء المصرية بأنها لا تجب إلا بعد قبضها، ثم يُستقبل بها حول جديد أو تُضم إلى مال مدخر قائم الحول. أجابت الدار بأن مكافأة نهاية الخدمة لا تتعلق بها الزكاة إلا بعد قبضها، لعدم تمام الملك قبل ذلك. وقالت إن من ليس له مال مدخر آخر يستقبل بها حولًا جديدًا من تاريخ القبض، ومن له مال مدخر بدأ حوله يضمها إليه ويزكي الجميع في آخر الحول بربع العشر متى استوفت شروط الوجوب. وعرّفت المكافأة بأنها مبلغ يستحقه العامل وفق عقد العمل أو اللوائح تقديرًا لسنوات عمله، وأشارت إلى المادة 172 من قانون العمل المصري رقم 14 لسنة 2025."
  en: "A question on zakat on an end-of-service gratuity, in which Egypt's Dar al-Ifta answered that zakat is due only after it is received, after which it either starts a new zakat year or joins savings that already have a running year. Dar al-Ifta answered that zakat does not attach to the gratuity until it is received, because ownership is not complete before then. It said that someone with no other savings starts a new zakat year from the date of receipt, while someone whose savings already have a running year adds the gratuity to them and pays on the whole at the end of that year, at one fortieth (2.5%), once the conditions are met. It defined the gratuity as a sum the worker earns under his contract or the regulations in recognition of his years of service, referring to article 172 of Egypt's Labour Law no. 14 of 2025."
  ur: "ملازمت کے اختتامی انعام پر زکوٰۃ کے بارے میں سوال، جس میں مصر کے دار الافتاء نے کہا کہ زکوٰۃ وصولی کے بعد ہی واجب ہوتی ہے، پھر یا تو اس سے نیا سال شروع ہوتا ہے یا وہ پہلے سے جاری سال والی بچت میں شامل ہو جاتی ہے۔ دار الافتاء نے جواب دیا کہ اختتامی انعام پر زکوٰۃ وصولی کے بعد ہی متعلق ہوتی ہے، کیونکہ اس سے پہلے ملکیت مکمل نہیں ہوتی۔ اس نے کہا کہ جس کے پاس کوئی اور بچت نہ ہو وہ وصولی کی تاریخ سے نیا سال شروع کرے، اور جس کی بچت کا سال پہلے سے چل رہا ہو وہ اسے اس میں ملا کر سال کے آخر میں سب پر چالیسواں حصہ (2.5٪) ادا کرے، بشرطیکہ وجوب کی شرائط پوری ہوں۔ اس نے انعام کی تعریف ایسی رقم سے کی جو کارکن کو معاہدے یا ضوابط کے مطابق اس کی خدمت کے سالوں کے اعتراف میں ملتی ہے، اور مصر کے لیبر قانون نمبر 14 بابت 2025 کی دفعہ 172 کا حوالہ دیا۔"
