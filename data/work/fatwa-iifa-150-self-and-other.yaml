label: { ar: "قرار مجمع الفقه الإسلامي الدولي 150 (16/8) بشأن نحن والآخر", en: "IIFA resolution 150 (16/8) on 'us and the other'", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 150 (16/8): ہم اور دوسرے" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩، من النوع التوصياتي. قرر: اتخاذ الوسائل المحققة لوحدة الصف بين المسلمين دولًا وشعوبًا بما يتيح الحديث عن أمة واحدة عبر تصفية الخلافات وتفعيل التعاون الاقتصادي والثقافي والعلمي والسياسي وتنفيذ قرارات منظمة المؤتمر الإسلامي؛ وضرورة التنسيق بين الدول والمنظمات الإسلامية في تكوين رسالة إعلامية واضحة عن الإسلام أساسًا للحوار مع الآخر مع إعداد أجيال من الإعلاميين المسلمين يجيدون التعبير عنها بلغات حية لمواجهة الحملات الإعلامية؛ وأن يقوم ذلك على قواعد من الحوار البنّاء والتعارف والتعاون على الخير مع مراعاة ثوابت الأمة في نصه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005), of the recommendatory kind. It resolved: taking the means to unify the ranks of Muslims, states and peoples, so that one umma may be spoken of — through settling differences and activating economic, cultural, scientific and political cooperation and implementing OIC resolutions; coordinating Muslim states and organisations to form a clear media message about Islam as a basis for dialogue with the other, preparing generations of Muslim media professionals fluent in living languages to face media campaigns; and building this on rules of constructive dialogue, mutual knowledge and cooperation for good, while keeping the community's fixed principles, in its text."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں، سفارشی نوعیت کی۔ فیصلے: مسلمانوں کی صف بندی کے لیے وہ ذرائع اختیار کرنا جو ممالک و عوام میں وحدت لائیں تاکہ ایک امت کی بات ہو سکے — اختلافات کے خاتمے، معاشی، ثقافتی، علمی اور سیاسی تعاون کی فعالیت اور او آئی سی قراردادوں پر عمل کے ذریعے؛ اسلامی ممالک اور تنظیموں میں ربط کر کے اسلام کا واضح ابلاغی پیغام بنانا جو دوسروں سے مکالمے کی بنیاد ہو، ساتھ ہی مسلم میڈیا پیشہ ور افراد کی نئی نسل تیار کرنا جو زندہ زبانوں میں اس کا اظہار کریں؛ اور یہ سب تعمیری مکالمے، باہمی شناسائی اور نیکی میں تعاون کے اصولوں پر ہو، متن کے مطابق امت کے ثوابت کی رعایت کے ساتھ۔"
