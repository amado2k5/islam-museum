label:
  ar: "مسند الدارمي ⁦(سنن الدارمي)⁩"
  en: "Musnad al-Darimi (Sunan al-Darimi)"
  ur: "مسند الدارمی (سنن الدارمی)"
summary:
  ar: "كتاب أبي محمد عبد الله بن عبد الرحمن الدارمي السمرقندي ⁦(181–255هـ)⁩، مرتب على الأبواب ويفتتح بدلائل النبوة، عُرف قديماً بـ«المسند» واشتهر حديثاً بـ«سنن الدارمي»، وأطلق عليه بعضهم «الصحيح» وخالفهم آخرون لما فيه من المرسل والمنقطع والضعيف؛ وفيه خمسة عشر حديثاً ثلاثياً، وتعليقات فقهية للمؤلف تُظهر اجتهاده {cite:musnad-darimi-tasil-2015 p. 32} {cite:musnad-darimi-tasil-2015 p. 37} {cite:musnad-darimi-tasil-2015 p. 48-52}."
  en: "The book of Abu Muhammad 'Abd Allah b. 'Abd al-Rahman al-Darimi of Samarqand (181–255 AH), arranged by topic and opening with the proofs of prophethood, known of old as 'al-Musnad' and in modern times as 'Sunan al-Darimi'; some called it 'al-Sahih' while others objected, given its mursal, broken and weak reports; it contains fifteen three-link (thulathi) hadiths and the author's own legal comments, which show his independent reasoning {cite:musnad-darimi-tasil-2015 p. 32} {cite:musnad-darimi-tasil-2015 p. 37} {cite:musnad-darimi-tasil-2015 p. 48-52}."
  ur: "سمرقند کے ابو محمد عبد اللہ بن عبد الرحمٰن دارمی (181–255ھ) کی کتاب، ابواب پر مرتب اور دلائلِ نبوت سے شروع ہونے والی، جو قدیم زمانے میں «المسند» اور جدید دور میں «سنن الدارمی» کے نام سے معروف ہے؛ بعض نے اسے «الصحیح» کہا اور دوسروں نے اس میں مرسل، منقطع اور ضعیف روایات کی وجہ سے اختلاف کیا؛ اس میں پندرہ ثلاثی احادیث اور مصنف کی فقہی تعلیقات ہیں جو ان کے اجتہاد کو ظاہر کرتی ہیں {cite:musnad-darimi-tasil-2015 p. 32} {cite:musnad-darimi-tasil-2015 p. 37} {cite:musnad-darimi-tasil-2015 p. 48-52}۔"
