issue:
  ar: "هل يصح أن يسمى كتاب الدارمي «الصحيح»؟"
  en: "May al-Darimi's book be called 'the Sahih'?"
  ur: "کیا دارمی کی کتاب کو «الصحیح» کہنا درست ہے؟"
perspectives:
  - tradition: sunni
    id: mughaltay
    stance: { ar: "يُطلق عليه «الصحيح»", en: "It may be called 'the Sahih'", ur: "اسے «الصحیح» کہا جا سکتا ہے" }
    summary:
      ar: "مغلطاي: أطلق عليه اسم الصحيح جماعة من الحفاظ آخرهم ابن دقيق العيد، وسماه به أيضاً ابن القيم والبلقيني، ووقع في نسخة كوبريلي «المسند الصحيح الجامع»."
      en: "Mughaltay: a number of hadith masters called it 'the Sahih', the last being Ibn Daqiq al-'Id; Ibn al-Qayyim and al-Bulqini also used the name, and the Köprülü manuscript titles it 'al-Musnad al-Sahih al-Jami''."
      ur: "مغلطائی: کئی حفاظ نے اسے «الصحیح» کہا، آخری ابن دقیق العید؛ ابن القیم اور بلقینی نے بھی یہ نام استعمال کیا، اور نسخۂ کوپریلی میں «المسند الصحیح الجامع» ہے۔"
    sources: [source/musnad-darimi-tasil-2015]
  - tradition: sunni
    id: iraqi-ibn-hajar
    stance: { ar: "لا يُسمى صحيحاً لما فيه من الضعيف والمنقطع", en: "It cannot be called sound, given its weak and broken reports", ur: "اس میں ضعیف اور منقطع روایات کی وجہ سے اسے صحیح نہیں کہا جا سکتا" }
    summary:
      ar: "العراقي: لا يخفى ما فيه من الضعيف لحال رواته أو لإرساله؛ وابن حجر: لم يُر ذلك في كلام من يُعتمد عليه، والنسخة التي ظنها مغلطاي بخط المنذري ورقتها الأولى بخط ابن أبي الحصني، ولو أطلقه معتمد لخالفه الواقع."
      en: "Al-'Iraqi: its weak reports, from their narrators or from mursal transmission, are plain; Ibn Hajar: no reliable scholar is found to have said so — the copy Mughaltay took to be in al-Mundhiri's hand has a first leaf written by Ibn Abi al-Husni — and had a reliable scholar said it, the contents would contradict him."
      ur: "عراقی: اس میں راویوں کے حال یا ارسال کی وجہ سے ضعیف ظاہر ہے؛ ابن حجر: کسی معتمد کے کلام میں یہ نہیں ملا — جس نسخے کو مغلطائی نے منذری کا خط سمجھا اس کا پہلا ورق ابن ابی الحصنی کے خط میں ہے — اور اگر کوئی معتمد یہ کہتا تو کتاب کا مواد اس کے خلاف ہوتا۔"
    sources: [source/musnad-darimi-tasil-2015]
