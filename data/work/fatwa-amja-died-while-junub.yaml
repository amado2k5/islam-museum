id: work/fatwa-amja-died-while-junub
class: work
kind: fatwa
label: { ar: "موت الجنب", en: "One who dies in janaba — the common washing suffices", ur: "جنب شخص کی وفات — عام غسل کافی", es: "Quien muere en janaba, basta con el lavado común.", fr: "Celui qui meurt en janaba — les ablutions ordinaires suffisent" }
summary:
  ar: "سأل سائل هل إذا مات الإنسان جنبًا يكفيه غسل التكفين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80552 بتاريخ 1 ديسمبر 2009)⁩ أن من مات وهو جنب يكتفى في تطهيره بالغسل العام الذي شرع لعموم الموتى وسأل الله الرحمة لجميع موتى المسلمين."
  en: "A questioner asked whether one who dies in janaba needs more than the shrouding-wash. Dr. Salah al-Sawi (fatwa no. 80552, 1 December 2009) answered that one who dies in janaba is purified by the general washing legislated for all the dead — asking God's mercy for all deceased Muslims."
  ur: "جنب حالت میں فوت ہونے والے کو الگ غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80552، 1 دسمبر 2009)⁩ کے مطابق عمومی غسل میت کافی ہے۔"
  es: "Un interlocutor preguntó si quien muere en estado de janaba necesita algo más que el lavado ritual. El Dr. Salah al-Sawi (fatwa n.º 80552, 1 de diciembre de 2009) respondió que quien muere en estado de janaba se purifica mediante el lavado general prescrito para todos los difuntos, pidiendo la misericordia de Dios para todos los musulmanes fallecidos."
  fr: "Un internaute a demandé si celui qui meurt en état de janaba avait besoin de plus que la toilette mortuaire. Le Dr Salah al-Sawi (fatwa n° 80552, 1er décembre 2009) a répondu que celui qui meurt en état de janaba est purifié par la toilette rituelle prescrite pour tous les défunts, implorant la miséricorde divine pour tous les musulmans décédés."
