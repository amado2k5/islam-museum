label: { ar: "حكم عمل الولائم وبيان بعض أنواعها", en: "The ruling on feasts and some of their kinds", ur: "ولیموں کا حکم اور ان کی بعض اقسام", es: "La normativa sobre fiestas y algunos de sus tipos." }
summary:
  ar: "سائل سأل عن عمل الولائم وبيان أنواعها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22121)⁩ أن لفظ الوليمة مشتق من الولم وهو الاجتماع وتستعمل في العرس مطلقة عن أي قيد وفي غيره بقيد، وبيّن الجواب أحكامها وأنواعها على وجهه."
  en: "A questioner asked about holding feasts and their kinds. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22121) answered that 'walima' derives from al-walm, 'gathering', and is used absolutely for the wedding feast and qualified for other occasions; the answer sets out its rulings and kinds."
  ur: "ایک سائل نے ولیمے کرنے کے حکم اور ان کی اقسام پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22121)⁩ نے جواب دیا کہ 'ولیمہ' 'ولم' یعنی اجتماع سے نکلا ہے اور بلا قید عروسی کے لیے اور قید کے ساتھ دیگر مواقع پر استعمال ہوتا ہے؛ جواب میں اس کے احکام اور اقسام بیان ہوئیں۔"
  es: "Un consultante preguntó sobre la celebración de banquetes y sus diferentes tipos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22121) respondió que «walima» deriva de al-walm, «reunión», y se utiliza exclusivamente para el banquete nupcial, aunque también se puede aplicar a otras ocasiones. La respuesta detalla sus normas y tipos."
