id: work/fatwa-dar-alifta-eg-late-buyer-pays-elevator-share
class: work
kind: fatwa
label: { ar: "حكم دفع المشترك المتأخر في الأسانسير أكثر من المتقدم", en: "Charging a later subscriber more than an earlier one for the lift", ur: "لفٹ کی تنصیب میں بعد میں شامل ہونے والے سے زیادہ لینا", es: "Cobrarle más a un suscriptor posterior que a uno anterior por el uso del ascensor", fr: "Facturer un abonné arrivé plus tard plus cher qu'un abonné arrivé plus tôt pour l'ascenseur" }
summary:
  ar: "سائل سأل عن اتفاق مشتركي وحدة عقارية على مبلغ محدد خاص بالخدمات ثم إلزام مشترك متأخر في تركيب الأسانسير بأكثر مما دفع المتقدم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21589)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about a property unit's buyers having agreed a set amount for services, then charging a later subscriber to the lift more than the earlier one paid. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21589) answered by setting out the ruling."
  ur: "ایک سائل نے پوچھا کہ جائداد کے خریداروں نے خدمات کی ایک مقررہ رقم طے کی، پھر لفٹ میں بعد میں شامل ہونے والے سے پہلے والے سے زیادہ لیا جائے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21589)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre el caso de los compradores de una vivienda, quienes acordaron un precio fijo por los servicios y luego cobraron a un nuevo usuario del ascensor más de lo que había pagado el anterior. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21589) respondió exponiendo la normativa."
  fr: "Un internaute a posé une question concernant le cas où les acheteurs d'un appartement, ayant convenu d'un montant fixe pour des services, facturent ensuite à un nouvel utilisateur de l'ascenseur un prix supérieur à celui payé par le précédent. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21589) a répondu en énonçant la règle."
