label: { ar: "مجمع الأمثال", en: "Majma' al-Amthal", es: "Majma' al-Amthal", fr: "Majma' al-Amthal", ur: "مجمع الامثال" }
summary:
  ar: "مجمع الأمثال للميداني، أفضل ما كُتب في الأمثال العربية وأشمله بحسب موسوعة الإسلام التركية، وفيه أكثر من ستة آلاف مثل مرتبة هجائياً مع بيان أصل المثل واستعماله وما فيه من صعوبات لغوية. ويضم البابان التاسع والعشرون والثلاثون أيام العرب وأحاديث متفرقة وحكم الخلفاء الأربعة وغيرهم. ويُروى أن الزمخشري حسده عليه."
  en: "al-Maydani's Majma' al-amthal, the best and most comprehensive study of Arabic proverbs according to the TDV İslâm Ansiklopedisi, with more than six thousand proverbs in alphabetical order and information on each one's origin, use and linguistic difficulties. Chapters 29 and 30 hold the days of the Arabs, various hadith and sayings of the four caliphs and other figures. It is reported that al-Zamakhshari envied him for it."
  es: "El Majma' al-amthal de al-Maydani, el mejor y más completo estudio de los proverbios árabes según la TDV İslâm Ansiklopedisi, con más de seis mil proverbios en orden alfabético e información sobre el origen, el uso y las dificultades lingüísticas de cada uno. Los capítulos 29 y 30 recogen los días de los árabes, diversos hadices y dichos de los cuatro califas y otras figuras. Se cuenta que al-Zamajshari le tuvo envidia por ello."
  fr: "Le Majma' al-amthal d'al-Maydani, la meilleure et la plus complète étude des proverbes arabes selon la TDV İslâm Ansiklopedisi, avec plus de six mille proverbes en ordre alphabétique et des informations sur l'origine, l'emploi et les difficultés linguistiques de chacun. Les chapitres 29 et 30 contiennent les jours des Arabes, divers hadiths et des paroles des quatre califes et d'autres personnages. On rapporte qu'al-Zamakhshari l'en jalousa."
  ur: "میدانی کی مجمع الامثال، TDV İslâm Ansiklopedisi کے مطابق عربی ضرب الامثال پر بہترین اور جامع ترین کتاب، جس میں چھ ہزار سے زیادہ امثال تہجی ترتیب میں اور ہر مثل کی اصل، استعمال اور لغوی مشکلات کی معلومات ہیں۔ ابواب 29 اور 30 میں ایام العرب، متفرق احادیث اور خلفائے اربعہ اور دیگر شخصیات کے اقوال ہیں۔ روایت ہے کہ زمخشری نے اس پر ان سے حسد کیا۔"
