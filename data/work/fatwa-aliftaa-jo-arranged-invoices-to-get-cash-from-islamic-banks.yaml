id: work/fatwa-aliftaa-jo-arranged-invoices-to-get-cash-from-islamic-banks
class: work
kind: fatwa
label: { ar: "فواتير متفق عليها للحصول على نقد من البنوك الإسلامية", en: "Arranged invoices to obtain cash from Islamic banks", ur: "اسلامی بینکوں سے نقد کے لیے طے شدہ رسیدیں" }
summary:
  ar: "سؤال عن فواتير متفق عليها للحصول على نقد من البنوك الإسلامية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز التحايل والاتفاق مع البائع على فواتير للحصول على السيولة من البنوك الإسلامية لأن ذلك يقرب البيع من صورة المعاملة الربوية. أجابت الدائرة بأن الظاهر من المعاملة أن القصد منها الحصول على النقد بالتحايل، وأنه لا يجوز التحايل والاتفاق مع الأطراف للحصول على السيولة لأن هذه الحيل تقرب البيع من صورة المعاملة الربوية. واستدلت بحديث أخرجه ابن بطة في إبطال الحيل (ص47) وحسنه كثير من العلماء، معناه النهي عن استحلال المحرمات بأدنى الحيل، وأحالت إلى فتواها السابقة رقم 516 في حرمة التحايل على البنوك الإسلامية."
  en: "A question about arranged invoices to obtain cash from Islamic banks, in which Jordan's General Iftaa Department answered that using stratagems and arranging invoices with a seller to obtain cash from Islamic banks is not permitted, because it brings the sale close to an interest-based transaction. The Department answered that the apparent purpose of the transaction is to obtain cash through a stratagem, and that using stratagems and colluding with other parties to obtain liquidity is not permitted, because such devices bring the sale close to the form of an interest-based transaction. It cited a hadith reported by Ibn Batta in Ibtal al-Hiyal (p. 47), graded hasan by many scholars, whose meaning is a warning against making God's prohibitions lawful through the slightest stratagems, and referred to its earlier fatwa no. 516 on the prohibition of stratagems against Islamic banks."
  ur: "اسلامی بینکوں سے نقد کے لیے طے شدہ رسیدیں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسلامی بینکوں سے نقد حاصل کرنے کے لیے بیچنے والے سے مل کر رسیدیں بنوانا اور حیلہ کرنا جائز نہیں، کیونکہ یہ بیع کو سودی معاملے کی صورت کے قریب کر دیتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ معاملے سے بظاہر مقصد حیلے کے ذریعے نقد حاصل کرنا ہے، اور لیکویڈیٹی کے لیے حیلہ کرنا اور فریقین سے ساز باز کرنا جائز نہیں، کیونکہ ایسے حیلے بیع کو سودی معاملے کی صورت کے قریب کر دیتے ہیں۔ اس نے ابن بطہ کی ابطال الحیل (ص 47) میں مروی حدیث سے استدلال کیا، جسے بہت سے علما نے حسن قرار دیا، جس کا مفہوم معمولی حیلوں سے اللہ کی حرام کردہ چیزوں کو حلال کرنے سے ممانعت ہے، اور اسلامی بینکوں سے حیلے کی حرمت پر اپنے سابقہ فتویٰ نمبر 516 کا حوالہ دیا۔"
