label: { ar: "فواتير متفق عليها للحصول على نقد من البنوك الإسلامية", en: "Arranged invoices to obtain cash from Islamic banks", ur: "اسلامی بینکوں سے نقد کے لیے طے شدہ رسیدیں", es: "Gestioné las facturas para obtener efectivo de bancos islámicos.", fr: "Factures falsifiées pour obtenir des liquidités auprès de banques islamiques", tr: "İslami bankalardan nakit almak için üzerinde anlaşılmış faturalar", id: "Faktur yang disepakati untuk memperoleh uang tunai dari bank Islam" }
summary:
  ar: "سؤال عن فواتير متفق عليها للحصول على نقد من البنوك الإسلامية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز التحايل والاتفاق مع البائع على فواتير للحصول على السيولة من البنوك الإسلامية لأن ذلك يقرب البيع من صورة المعاملة الربوية. أجابت الدائرة بأن الظاهر من المعاملة أن القصد منها الحصول على النقد بالتحايل، وأنه لا يجوز التحايل والاتفاق مع الأطراف للحصول على السيولة لأن هذه الحيل تقرب البيع من صورة المعاملة الربوية. واستدلت بحديث أخرجه ابن بطة في إبطال الحيل ⁦(ص47)⁩ وحسنه كثير من العلماء، معناه النهي عن استحلال المحرمات بأدنى الحيل، وأحالت إلى فتواها السابقة رقم 516 في حرمة التحايل على البنوك الإسلامية."
  en: "A question about arranged invoices to obtain cash from Islamic banks, in which Jordan's General Iftaa Department answered that using stratagems and arranging invoices with a seller to obtain cash from Islamic banks is not permitted, because it brings the sale close to an interest-based transaction. The Department answered that the apparent purpose of the transaction is to obtain cash through a stratagem, and that using stratagems and colluding with other parties to obtain liquidity is not permitted, because such devices bring the sale close to the form of an interest-based transaction. It cited a hadith reported by Ibn Batta in Ibtal al-Hiyal (p. 47), graded hasan by many scholars, whose meaning is a warning against making God's prohibitions lawful through the slightest stratagems, and referred to its earlier fatwa no. 516 on the prohibition of stratagems against Islamic banks."
  ur: "اسلامی بینکوں سے نقد کے لیے طے شدہ رسیدیں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسلامی بینکوں سے نقد حاصل کرنے کے لیے بیچنے والے سے مل کر رسیدیں بنوانا اور حیلہ کرنا جائز نہیں، کیونکہ یہ بیع کو سودی معاملے کی صورت کے قریب کر دیتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ معاملے سے بظاہر مقصد حیلے کے ذریعے نقد حاصل کرنا ہے، اور لیکویڈیٹی کے لیے حیلہ کرنا اور فریقین سے ساز باز کرنا جائز نہیں، کیونکہ ایسے حیلے بیع کو سودی معاملے کی صورت کے قریب کر دیتے ہیں۔ اس نے ابن بطہ کی ابطال الحیل ⁦(ص 47)⁩ میں مروی حدیث سے استدلال کیا، جسے بہت سے علما نے حسن قرار دیا، جس کا مفہوم معمولی حیلوں سے اللہ کی حرام کردہ چیزوں کو حلال کرنے سے ممانعت ہے، اور اسلامی بینکوں سے حیلے کی حرمت پر اپنے سابقہ فتویٰ نمبر 516 کا حوالہ دیا۔"
  es: "Una pregunta sobre facturas manipuladas para obtener efectivo de bancos islámicos, a la que el Departamento General de Iftaa de Jordania respondió que el uso de estratagemas y la manipulación de facturas con un vendedor para obtener efectivo de bancos islámicos no está permitido, ya que convierte la venta en una transacción con intereses. El Departamento respondió que el propósito aparente de la transacción es obtener efectivo mediante una estratagema, y que el uso de estratagemas y la confabulación con terceros para obtener liquidez no están permitidos, porque tales mecanismos hacen que la venta se asemeje a una transacción con intereses. Citó un hadiz narrado por Ibn Batta en Ibtal al-Hiyal (p. 47), clasificado como hasan por muchos eruditos, cuyo significado es una advertencia contra la legitimidad de las prohibiciones de Dios mediante las más mínimas estratagemas, y se refirió a su fatwa anterior n.° 516 sobre la prohibición de estratagemas contra los bancos islámicos."
  fr: "Une question relative aux factures truquées utilisées pour obtenir des liquidités auprès de banques islamiques a été posée. Le Département général de la Fatwa de Jordanie a répondu que le recours à des stratagèmes et à des factures truquées avec un vendeur pour obtenir des liquidités auprès de banques islamiques est interdit, car cela rapproche la vente d'une transaction à intérêt. Le Département a expliqué que l'objectif apparent de la transaction est d'obtenir des liquidités par le biais d'un stratagème, et que l'utilisation de stratagèmes et la collusion avec d'autres parties pour obtenir des liquidités sont interdites, car de tels procédés rapprochent la vente d'une transaction à intérêt. Il a cité un hadith rapporté par Ibn Batta dans Ibtal al-Hiyal (p. 47), considéré comme hasan par de nombreux savants, dont le sens est une mise en garde contre le fait de rendre licites les interdictions de Dieu par les stratagèmes les plus insignifiants, et a fait référence à sa fatwa antérieure n° 516 sur l'interdiction des stratagèmes à l'encontre des banques islamiques."
  tr: "İslami bankalardan nakit elde etmek için üzerinde anlaşılan faturalarla ilgili bir soruya yanıt verdi; Ürdün Genel Fetva Dairesi, İslami bankalardan likidite elde etmek için satıcıyla fatura konusunda aldatmanın veya anlaşmanın izin verilmediğini, çünkü bunun satışı tefeci işlem biçimine yaklaştırdığını söyledi. Bakanlık, işlemin görünürdeki anlamının hile yoluyla nakit elde etmek olduğunu ve taraflarla likidite elde etmek için aldatmanın veya anlaşmanın mümkün olmadığını çünkü bu tür aldatmaların satışı tefeci işlem biçimine yaklaştırdığını belirtti. İbn Batta'nın hilelerin iptali ile ilgili bir hadise atıfta bulundu (s. 47), birçok alim tarafından iyi olarak değerlendirilmiş, en ufak hilelerle yasaklanmış eylemlere izin verilmesinin yasak olduğu anlamına gelmektedir; bu, önceki fetva numarası 516'ya atıfta bulunmuştur."
  id: "Sebuah pertanyaan tentang faktur yang disepakati untuk memperoleh uang tunai dari bank Islam, di mana Departemen Fatwa Umum Yordania menjawab bahwa tidak diperbolehkan menipu atau menyetujui penjual dalam faktur untuk memperoleh likuiditas dari bank Islam karena hal itu mendekatkan penjualan ke bentuk transaksi riba. Departemen menjawab bahwa makna nyata dari transaksi tersebut adalah memperoleh uang tunai dengan tipu daya, dan tidak diperbolehkan menipu atau menyetujui para pihak untuk memperoleh likuiditas karena penipuan tersebut mendekatkan penjualan ke bentuk transaksi riba. Departemen mengutip sebuah hadits yang diceritakan oleh Ibn Batta mengenai pembatalan trik (hal. 47), yang dinilai baik oleh banyak ulamawan, artinya dilarang mengizinkan tindakan terlarang dengan trik sekecil apa pun, merujuk pada fatwa sebelumnya nomor 516 tentang larangan penipuan terhadap bank Islam."
