id: work/fatwa-amja-married-for-four-things
class: work
kind: fatwa
label: { ar: "تنكح المرأة لأربع", en: "A woman is married for four things — the hadith explained", ur: "عورت سے چار باتوں کی بنا پر نکاح — حدیث کی شرح" }
summary:
  ar: "سأل مقبل على الزواج عن تفسير حديث تنكح المرأة لأربع تفسيرًا مفصلًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78315 بتاريخ 22 مارس 2009)⁩ أن الحديث رواه البخاري ومسلم وأصحاب السنن ومعناه في الجملة أن عادة الناس جرت على الرغبة في المرأة واختيارها للنكاح لإحدى خصال: الجمال والمال والحسب والدين، وإن اللائق بذوي المروءات وأرباب الديانات أن يكون الدين مطمح نظرهم، فلذلك حث النبي على الظفر بذات الدين وأكد على ذلك أبلغ تأكيد بقوله فاظفر بذات الدين تربت يداك وهي كلمة في الأصل لصقت يداك بالتراب من شدة الفقر لكن العرب استعملتها لمعان أخرى كالمعاتبة والإنكار وتعظيم الأمر والحث على الطلب على ما فصّل."
  en: "A man about to marry asked for a detailed explanation of 'a woman is married for four things'. Dr. Salah al-Sawi (fatwa no. 78315, 22 March 2009) answered that the hadith is in Bukhari, Muslim and the Sunan: people's custom runs to seeking a woman in marriage for one of four traits — beauty, wealth, lineage and religion — and what befits people of honour and religion is that religion be the aim of their regard; so the Prophet urged winning the religious one and stressed it most emphatically in 'win her of religion, may your hands be dusty' — originally 'your hands stick to dust' from poverty, but the Arabs use it for reproach, emphasis and urging, as detailed."
  ur: "ایک سائل نے «عورت سے چار باتوں پر نکاح ہوتا ہے» حدیث کی شرح چاہی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78315، 22 مارچ 2009)⁩ کے مطابق عادت جمال مال حسن نسب اور دین کی طرف ہوتی ہے مگر دین والی کو چننے کا حکم دیا گیا ہے۔"
