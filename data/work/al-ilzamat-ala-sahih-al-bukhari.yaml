summary:
  ar: "كتاب الدارقطني ⁦(ت 385هـ)⁩ الذي «ألزم» فيه البخاري ومسلماً إخراج أحاديث تركاها مع أن أسانيدها من جنس أسانيد صحيحيهما، وذكر صحابة رُويت أحاديثهم من وجوه صحاح ولم يخرجا لهم شيئاً؛ ويرى النووي أن هذا الإلزام ليس بلازم لأنهما لم يلتزما استيعاب الصحيح {cite:sharh-nawawi-misriyya-1347-v1 p. 24}."
  en: "Al-Daraqutni's (d. 385 AH) book 'obliging' al-Bukhari and Muslim to include hadiths they left out although their chains were of the same kind as those in their Sahihs, and listing Companions whose reports came by sound routes yet from whom they included nothing; al-Nawawi holds the obligation not binding, since they never undertook to include all sound hadith {cite:sharh-nawawi-misriyya-1347-v1 p. 24}."
  ur: "دارقطنی (وفات 385ھ) کی کتاب جس میں انہوں نے بخاری اور مسلم پر «لازم» کیا کہ وہ ایسی احادیث شامل کرتے جو انہوں نے چھوڑ دیں حالانکہ ان کی اسانید صحیحین جیسی تھیں، اور ایسے صحابہ ذکر کیے جن کی احادیث صحیح طرق سے آئیں مگر انہوں نے ان سے کچھ نہ لیا؛ نووی کے نزدیک یہ الزام لازم نہیں کیونکہ دونوں نے تمام صحیح کو جمع کرنے کا التزام نہیں کیا {cite:sharh-nawawi-misriyya-1347-v1 p. 24}۔"
