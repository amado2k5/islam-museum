summary:
  ar: "كتاب الدارقطني ⁦(ت 385هـ)⁩ الذي «ألزم» فيه البخاري ومسلماً إخراج أحاديث تركاها مع أن أسانيدها من جنس أسانيد صحيحيهما، وذكر صحابة رُويت أحاديثهم من وجوه صحاح ولم يخرجا لهم شيئاً؛ ويرى النووي أن هذا الإلزام ليس بلازم لأنهما لم يلتزما استيعاب الصحيح {cite:sharh-nawawi-misriyya-1347-v1 p. 24}."
  en: "Al-Daraqutni's (d. 385 AH) book 'obliging' al-Bukhari and Muslim to include hadiths they left out although their chains were of the same kind as those in their Sahihs, and listing Companions whose reports came by sound routes yet from whom they included nothing; al-Nawawi holds the obligation not binding, since they never undertook to include all sound hadith {cite:sharh-nawawi-misriyya-1347-v1 p. 24}."
  ur: "دارقطنی ⁦(وفات 385ھ)⁩ کی کتاب جس میں انہوں نے بخاری اور مسلم پر «لازم» کیا کہ وہ ایسی احادیث شامل کرتے جو انہوں نے چھوڑ دیں حالانکہ ان کی اسانید صحیحین جیسی تھیں، اور ایسے صحابہ ذکر کیے جن کی احادیث صحیح طرق سے آئیں مگر انہوں نے ان سے کچھ نہ لیا؛ نووی کے نزدیک یہ الزام لازم نہیں کیونکہ دونوں نے تمام صحیح کو جمع کرنے کا التزام نہیں کیا {cite:sharh-nawawi-misriyya-1347-v1 p. 24}۔"
  es: "El libro de Al-Daraqutni (m. 385 AH) \"obliga\" a Al-Bujari y Muslim a incluir hadices que omitieron, aunque sus cadenas eran del mismo tipo que las de sus Sahihs, y enumera a los Compañeros cuyos informes llegaron por rutas sólidas pero de los que no incluyeron nada; Al-Nawawi sostiene que la obligación no es vinculante, ya que nunca se comprometieron a incluir todos los hadices sólidos {cite:sharh-nawawi-misriyya-1347-v1 p. 24}."
  fr: "Le livre d'Al-Daraqutni (mort en 385 AH) « oblige » al-Bukhari et Muslim à inclure des hadiths qu'ils avaient omis, bien que leurs chaînes de transmission fussent du même type que celles de leurs Sahihs, et énumère des Compagnons dont les rapports provenaient de voies fiables, mais dont ils n'ont rien inclus; al-Nawawi considère cette obligation comme non contraignante, puisqu'ils n'ont jamais entrepris d'inclure tous les hadiths authentiques {cite:sharh-nawawi-misriyya-1347-v1 p. 24}."
  tr: "El-Darakutni'nin kitabında (ö. 385 Hicri), el-Buhari ve Müslümanları, zincirleri Sahih koleksiyonlarındaki zincirlerle aynı türden olmasına rağmen, atladıkları hadisleri hazırlamaya \"zorunlu\" etti ve hadisi gerçek zincirlerden rivayet edilen ancak onlardan hiçbir şey rivayet edilmemiş olan sahabelerden bahsetti; ve El-Nevavi, bu yükümlülüğün gerekli olmadığını, çünkü onların Sahih'in anlayışına uymadığını düşünüyor {atıf:şerh-nawavi-misriyya-1347-v1, s. 24}."
  id: "Kitab Al-Daraqutni (wafat 385 H), di mana ia \"mewajibkan\" al-Bukhari dan Muslim untuk menghasilkan hadis yang mereka abaikan, meskipun rantai mereka sama dengan koleksi Sahih mereka, dan menyebutkan sahabat-sahabat yang hadits mereka diceritakan dari rantai otentik tetapi tidak ada yang diceritakan dari mereka; dan Al-Nawawi percaya kewajiban ini tidak diperlukan karena mereka tidak sesuai dengan pemahaman Sahih {cite:sharh-nawawi-misriyya-1347-v1, hlm. 24}."
