label: { ar: "البرهان في علوم القرآن", en: "Al-Burhan fi Ulum al-Qur'an (al-Zarkashi)", ur: "البرہان فی علوم القرآن ⁦(زرکشی)⁩", es: "Al-Burhan fi Ulum al-Qur'an (al-Zarkashi)", fr: "Al-Burhan fi Ulum al-Coran (al-Zarkashi)", tr: "Al-Burhan fi Ulum al-Qur'an.", id: "Al-Burhan fi Ulum al-Qur'an." }
summary:
  ar: "كتاب بدر الدين الزركشي ⁦(745–794هـ)⁩ في علوم القرآن، في سبعة وأربعين نوعًا من سبب النزول إلى معرفة الأدوات؛ قصد به أن يسد ما فات المتقدمين من وضع كتاب جامع لأنواع علوم القرآن كما وُضع ذلك في علوم الحديث، ليكون مفتاحًا للمفسر. وقف عليه السيوطي فبنى عليه «الإتقان»."
  en: "Badr al-Din al-Zarkashi's (745–794 AH) book on the Qur'anic sciences, in forty-seven types from the occasions of revelation to the particles; he meant it to fill what earlier scholars had missed — a book gathering the types of Qur'anic sciences, as had been done for hadith — as a key for the exegete. Al-Suyuti came upon it and built his al-Itqan on it."
  ur: "بدر الدین زرکشی ⁦(745–794ھ)⁩ کی علومِ قرآن پر کتاب، سینتالیس انواع میں، سببِ نزول سے حروف و ادوات کی معرفت تک؛ اس کا مقصد وہ کمی پوری کرنا تھا جو متقدمین سے رہ گئی تھی — علومِ قرآن کی انواع پر جامع کتاب، جیسی علومِ حدیث پر لکھی گئی — تاکہ یہ مفسر کے لیے کلید ہو۔ سیوطی کو یہ ملی تو انہوں نے «الاتقان» کی بنیاد اس پر رکھی۔"
  es: "El libro de Badr al-Din al-Zarkashi (745-794 AH) sobre las ciencias coránicas, dividido en cuarenta y siete tipos, desde las ocasiones de la revelación hasta las partículas, pretendía suplir la carencia de los eruditos anteriores: una obra que recopilara los tipos de las ciencias coránicas, como se había hecho con los hadices, sirviendo así como clave para el exegeta. Al-Suyuti lo encontró y basó su obra, al-Itqan, en él."
  fr: "L'ouvrage de Badr al-Din al-Zarkashi (745-794 AH) sur les sciences coraniques, classé en quarante-sept catégories depuis les moments de révélation jusqu'aux particules, visait à combler une lacune des savants précédents: un recueil des catégories de sciences coraniques, à l'instar de ce qui existait pour les hadiths, servant de clé à l'exégète. Al-Suyuti s'en inspira pour construire son ouvrage al-Itqan."
  tr: "Bedreddin el-Zerkaşi'nin (745–794 H) Kur'an illeri üzerine kitabı, araçların bilgisine vahiy için kırk yedi tür sebep içerir; önceki alimlerin eksik olanı telafi etmek için, hadis illerinde yaptığı gibi Kur'an illerinin türleri üzerine kapsamlı bir kitap yazmayı amaçlamıştır; böylece tercüman için bir anahtar görevi görmüştür. El-Suyuti bu kitaba uğramış ve buna dayanarak 'el-İtqan' adını vermiştir."
  id: "Kitab Badr al-Din al-Zarkashi (745–794 H) tentang ilmu Al-Qur'an, dalam empat puluh tujuh jenis alasan wahyu terhadap pengetahuan alat; bertujuan untuk mengisi apa yang terlewatkan oleh para ulama sebelumnya dengan menulis buku komprehensif tentang jenis-jenis ilmu Al-Qur'an, seperti yang ia lakukan dalam ilmu hadis, sebagai kunci bagi penafsir. Al-Suyuti singgah di sana dan mendasarkan pada itu 'al-Itqan'."
