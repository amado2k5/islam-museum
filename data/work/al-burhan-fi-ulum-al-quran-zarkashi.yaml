label: { ar: "البرهان في علوم القرآن", en: "Al-Burhan fi Ulum al-Qur'an (al-Zarkashi)", ur: "البرہان فی علوم القرآن (زرکشی)" }
summary:
  ar: "كتاب بدر الدين الزركشي (745–794هـ) في علوم القرآن، في سبعة وأربعين نوعًا من سبب النزول إلى معرفة الأدوات؛ قصد به أن يسد ما فات المتقدمين من وضع كتاب جامع لأنواع علوم القرآن كما وُضع ذلك في علوم الحديث، ليكون مفتاحًا للمفسر. وقف عليه السيوطي فبنى عليه «الإتقان»."
  en: "Badr al-Din al-Zarkashi's (745–794 AH) book on the Qur'anic sciences, in forty-seven types from the occasions of revelation to the particles; he meant it to fill what earlier scholars had missed — a book gathering the types of Qur'anic sciences, as had been done for hadith — as a key for the exegete. Al-Suyuti came upon it and built his al-Itqan on it."
  ur: "بدر الدین زرکشی (745–794ھ) کی علومِ قرآن پر کتاب، سینتالیس انواع میں، سببِ نزول سے حروف و ادوات کی معرفت تک؛ اس کا مقصد وہ کمی پوری کرنا تھا جو متقدمین سے رہ گئی تھی — علومِ قرآن کی انواع پر جامع کتاب، جیسی علومِ حدیث پر لکھی گئی — تاکہ یہ مفسر کے لیے کلید ہو۔ سیوطی کو یہ ملی تو انہوں نے «الاتقان» کی بنیاد اس پر رکھی۔"
