label: { ar: "نخب الأفكار في تنقيح مباني الأخبار في شرح شرح معاني الآثار", en: "Nukhab al-Afkar fi Tanqih Mabani al-Akhbar", ur: "نخب الافکار فی تنقیح مبانی الاخبار", es: "Nujab al-Afkar y Tanqih Mabani al-Akhbar", fr: "Noukhab al-Afkar et Tanqih Mabani al-Akhbar", tr: "Geleneklerin Anlamlarını Açıklamada Haber Yapılarının Geliştirilmesinde Dikkate Değer Fikirler", id: "Gagasan Penting dalam Menyempurnakan Struktur Berita dalam Menjelaskan Makna Tradisi" }
summary:
  ar: "شرح بدر الدين العيني على «شرح معاني الآثار» للطحاوي في عشر مجلدات، تصفه الترجمة المطبوعة مع عمدة القاري بأنه أوسع ما ألف في أحاديث الأحكام؛ ويذكر العيني في مقدمة العمدة أنه اخترع شرحاً لمعاني الآثار بعد عودته إلى الديار المصرية {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}."
  en: "Badr al-Din al-'Ayni's ten-volume commentary on al-Tahawi's Sharh Ma'ani al-Athar, which the biography printed with 'Umdat al-Qari calls the widest work written on the hadiths of rulings; al-'Ayni says in the preface to the 'Umda that he composed a commentary on Ma'ani al-Athar after returning to Egypt {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}."
  ur: "بدر الدین عینی کی طحاوی کی «شرح معانی الآثار» پر دس جلدوں میں شرح، جسے عمدۃ القاری کے ساتھ چھپا ترجمہ احکام کی احادیث پر لکھی جانے والی سب سے وسیع کتاب کہتا ہے؛ عینی عمدہ کے مقدمے میں کہتے ہیں کہ مصر واپسی کے بعد انہوں نے معانی الآثار کی شرح لکھی {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}۔"
  es: "el comentario en diez volúmenes de Badr al-Din al-'Ayni sobre Sharh Ma'ani al-Athar de al-Tahawi, que la biografía impresa con 'Umdat al-Qari llama la obra más amplia escrita sobre los hadices de las sentencias; al-'Ayni dice en el prefacio de la 'Umda que compuso un comentario sobre Ma'ani al-Athar después de su regreso a Egipto {citar:umdat-qari-ilmiyya-2001-v1 p. 16} {citar:umdat-qari-ilmiyya-2001-v1 p. 20}."
  fr: "le commentaire en dix volumes de Badr al-Din al-'Ayni sur Sharh Ma'ani al-Athar d'al-Tahawi, que la biographie imprimée avec 'Umdat al-Qari appelle l'ouvrage le plus vaste écrit sur les hadiths des décisions; al-'Ayni dit dans la préface de la 'Umda qu'il a composé un commentaire sur Ma'ani al-Athar après son retour en Egypte {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}."
  tr: "Badr al-Din al-Ayni'nin el-Tahavi'nin 'Şerh Ma'ani el-Athar' adlı eserine on ciltlik yorumu, Umdat al-Qari ile birlikte basılı biyografide hükümlerin hadisleri üzerine en kapsamlı çalışma olarak tanımlanır; el-Eyni, 'el-Umda'nın girişinde, Mısır'a döndükten sonra el-Athar'ın anlamlarının bir açıklamasını icat ettiğini belirtir {cite:umdat-qari-ilmiyya-2001-v1 s. 16} {cite:umdat-qari-ilmiyya-2001-v1 s. 20}."
  id: "Komentar Badr al-Din al-Ayni atas 'Sharh Ma'ani al-Athar' karya al-Tawawi dalam sepuluh jilid, yang biografi cetak bersama Umdat al-Qari menggambarkan sebagai karya paling komprehensif tentang hadits keputusan; al-'Ayni menyebutkan dalam pengantar 'al-Umda' bahwa ia menciptakan penjelasan makna al-Athar setelah kembali ke Mesir {cite:umdat-qari-ilmiyya-2001-v1 hlm. 16} {cite:umdat-qari-ilmiyya-2001-v1 hlm. 20}."
