label: { ar: "نخب الأفكار في تنقيح مباني الأخبار في شرح شرح معاني الآثار", en: "Nukhab al-Afkar fi Tanqih Mabani al-Akhbar", ur: "نخب الافکار فی تنقیح مبانی الاخبار" }
summary:
  ar: "شرح بدر الدين العيني على «شرح معاني الآثار» للطحاوي في عشر مجلدات، تصفه الترجمة المطبوعة مع عمدة القاري بأنه أوسع ما ألف في أحاديث الأحكام؛ ويذكر العيني في مقدمة العمدة أنه اخترع شرحاً لمعاني الآثار بعد عودته إلى الديار المصرية {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}."
  en: "Badr al-Din al-'Ayni's ten-volume commentary on al-Tahawi's Sharh Ma'ani al-Athar, which the biography printed with 'Umdat al-Qari calls the widest work written on the hadiths of rulings; al-'Ayni says in the preface to the 'Umda that he composed a commentary on Ma'ani al-Athar after returning to Egypt {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}."
  ur: "بدر الدین عینی کی طحاوی کی «شرح معانی الآثار» پر دس جلدوں میں شرح، جسے عمدۃ القاری کے ساتھ چھپا ترجمہ احکام کی احادیث پر لکھی جانے والی سب سے وسیع کتاب کہتا ہے؛ عینی عمدہ کے مقدمے میں کہتے ہیں کہ مصر واپسی کے بعد انہوں نے معانی الآثار کی شرح لکھی {cite:umdat-qari-ilmiyya-2001-v1 p. 16} {cite:umdat-qari-ilmiyya-2001-v1 p. 20}۔"
