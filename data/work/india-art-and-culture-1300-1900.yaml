summary:
  ar: "فهرس معرض «الهند!» الذي أقامه متحف المتروبوليتان للفنون في نيويورك سنة 1985، ألّفه ستيوارت كاري ولش، وفيه باب طويل عن فنون البلاطات المسلمة في الهند من السلطنة إلى المغول وسلاطين الدكن {cite:welch-india-art-and-culture-1985 p. 118}."
  en: "The catalogue of the INDIA! exhibition held by the Metropolitan Museum of Art in New York in 1985, written by Stuart Cary Welch, with a long part on the arts of India's Muslim courts from the Sultanate to the Mughals and the Deccani sultans {cite:welch-india-art-and-culture-1985 p. 118}."
  es: "El catálogo de la exposición INDIA! celebrada por el Museo Metropolitano de Arte de Nueva York en 1985, escrito por Stuart Cary Welch, con una larga sección sobre las artes de las cortes musulmanas de la India, desde el Sultanato hasta los mogoles y los sultanes del Decán {cite:welch-india-art-and-culture-1985 p. 118}."
  fr: "Le catalogue de l'exposition INDIA! organisée par le Metropolitan Museum of Art de New York en 1985, rédigé par Stuart Cary Welch, avec une longue partie consacrée aux arts des cours musulmanes de l'Inde, du Sultanat aux Moghols et aux sultans du Deccan {cite:welch-india-art-and-culture-1985 p. 118}."
  ur: "ہندوستان کا کیٹلاگ! نیو یارک میں میٹروپولیٹن میوزیم آف آرٹ کی طرف سے 1985 میں منعقد ہونے والی نمائش، جس میں سٹورٹ کیری ویلچ نے لکھا تھا، جس میں سلطنت سے لے کر مغلوں اور دکنی سلاطین تک ہندوستان کے مسلم درباروں کے فنون لطیفہ پر ایک طویل حصہ رکھا گیا تھا۔ 118}۔"
  tr: "1985'te New York'taki Metropolitan Sanat Müzesi tarafından düzenlenen \"India!\" sergisinin kataloğu, Stuart Carey Welch tarafından yazılmıştır ve Hindistan'daki Müslüman sarayların sanatlarını Sultanlık'tan Babürlere ve Dekkan sultanlarına kadar uzun bir bölüm içerir {cite:Welch-india-art-and-culture-1985, s. 118}."
  id: "Katalog pameran \"India!\" yang diselenggarakan oleh Metropolitan Museum of Art di New York pada tahun 1985, ditulis oleh Stuart Carey Welch, dan mencakup bab panjang tentang seni istana Muslim di India dari Kesultanan hingga Mughal dan sultan Deccan {cite:Welch-india-art-and-culture-1985, hlm. 118}."
