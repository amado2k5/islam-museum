summary:
  ar: "الكافي في علم الدين لمحمد بن يعقوب الكليني، من أجمع كتب الشيعة الحديثية؛ يحتوي ستة عشر ألف حديث قسمها إلى صحيح وحسن وقوي وضعيف كما فعل أهل السنة، في ثلاثة أجزاء: الأول في الأصول والثاني والثالث في الفروع، واتفق في جمعه عشرون عاماً {cite:duha-islam p. 850, 891}."
  en: "al-Kulayni's al-Kafi — the great Shi'i hadith corpus: sixteen thousand reports sorted sound/fair/weak over three parts {cite:duha-islam p. 850, 891}."
  es: "Al-Kafi de al-Kulayni: el gran corpus de hadices chiítas: dieciséis mil informes clasificados como sólidos/aceptables/débiles en tres partes {cita:duha-islam pág. 850, 891}."
  fr: "al-Kafi d'al-Kulayni — le grand corpus de hadiths chiites: seize mille rapports triés en trois parties solides/passables/faibles {cite: duha-islam p. 850, 891}."
  ur: "الکلینی کی الکافی - عظیم شیعہ حدیث کا مجموعہ: سولہ ہزار رپورٹوں کو تین حصوں میں صحیح/منصفانہ/ضعیف ترتیب دیا گیا ہے۔ 850، 891}۔"
  tr: "Muhammed bin Ya'qub el-Kulayni'nin El-Kafi fi 'İlm-Din, Şii Hadislerinin en kapsamlı kitaplarından biridir; Ehl-sünnet gibi özgül, iyi, güçlü ve zayıf olarak üç bölüme ayrılmış on altı bin hadis içerir: ilki temel konulara, ikincisi ve üçüncüsü dallara yöneliktir ve derlenmesi yirmi yıl sürmüştür {atıf:Duha-İslam, s. 850, 891}."
  id: "Al-Kafi fi 'Ilm al-Din oleh Muhammad ibn Ya'qub al-Kulayni, salah satu kitab paling komprehensif dalam Hadis Syiah; buku ini berisi enam belas ribu hadits, dibagi menjadi otentik, baik, kuat, dan lemah seperti Ahl al-Sunnah, dalam tiga bagian: yang pertama tentang dasar-dasar, yang kedua, dan yang ketiga tentang cabang-cabang, dan butuh waktu dua puluh tahun untuk menyusun {cite:Duha-Islam, hlm. 850, 891}."
