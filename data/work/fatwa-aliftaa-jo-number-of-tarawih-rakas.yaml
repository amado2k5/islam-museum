id: work/fatwa-aliftaa-jo-number-of-tarawih-rakas
class: work
kind: fatwa
label: { ar: "عدد ركعات صلاة التراويح", en: "The number of rak'as in tarawih", ur: "تراویح کی رکعات کی تعداد" }
summary:
  ar: "سؤال عن عدد ركعات صلاة التراويح، أجابت فيه دائرة الإفتاء العام الأردنية بأن أكملها عشرون ركعة سوى الشفع والوتر، ويحصل أصلها بأي عدد زوجي ولو ركعتين. أجابت الدائرة بأن أكمل صلاة التراويح عشرون ركعة سوى الشفع والوتر، وقالت إن هذا ما عليه جماهير العلماء سلفًا وخلفًا، وهو المعمول به في بلاد الحرمين. وقالت إن أصل التراويح يحصل بأي عدد زوجي ولو كان ركعتين بنية قيام رمضان."
  en: "A question about the number of rak'as in tarawih, in which Jordan's General Iftaa Department answered that its most complete form is twenty rak'as besides the shaf' and witr, and that its basic form is achieved with any even number, even two. The Department answered that the most complete form of tarawih is twenty rak'as besides the shaf' and witr, saying that this is the position of the great majority of scholars, early and later, and is the practice in the lands of the two Holy Mosques. It said that the basic sunna of tarawih is achieved with any even number of rak'as, even two, prayed with the intention of standing in prayer in Ramadan."
  ur: "تراویح کی رکعات کی تعداد کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس کی کامل صورت شفع اور وتر کے علاوہ بیس رکعات ہے، اور اس کی اصل کسی بھی جفت تعداد سے، حتیٰ کہ دو رکعات سے، حاصل ہو جاتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ تراویح کی کامل صورت شفع اور وتر کے علاوہ بیس رکعات ہے، اور کہا کہ یہی سلف و خلف کے جمہور علما کا موقف ہے اور حرمین شریفین کے علاقے میں اسی پر عمل ہے۔ اس نے کہا کہ تراویح کی اصل قیامِ رمضان کی نیت سے کسی بھی جفت تعداد، حتیٰ کہ دو رکعات، سے حاصل ہو جاتی ہے۔"
