id: work/fatwa-aliftaa-jo-number-of-tarawih-rakas
class: work
kind: fatwa
label: { ar: "عدد ركعات صلاة التراويح", en: "The number of rak'as in tarawih", ur: "تراویح کی رکعات کی تعداد", es: "El número de rak'as en tarawih", fr: "Le nombre de rak'as dans les prières de tarawih", tr: "Teravih namazının rak'ahlarının sayısı", id: "Jumlah rak'ah dalam shalat Taraweeh" }
summary:
  ar: "سؤال عن عدد ركعات صلاة التراويح، أجابت فيه دائرة الإفتاء العام الأردنية بأن أكملها عشرون ركعة سوى الشفع والوتر، ويحصل أصلها بأي عدد زوجي ولو ركعتين. أجابت الدائرة بأن أكمل صلاة التراويح عشرون ركعة سوى الشفع والوتر، وقالت إن هذا ما عليه جماهير العلماء سلفًا وخلفًا، وهو المعمول به في بلاد الحرمين. وقالت إن أصل التراويح يحصل بأي عدد زوجي ولو كان ركعتين بنية قيام رمضان."
  en: "A question about the number of rak'as in tarawih, in which Jordan's General Iftaa Department answered that its most complete form is twenty rak'as besides the shaf' and witr, and that its basic form is achieved with any even number, even two. The Department answered that the most complete form of tarawih is twenty rak'as besides the shaf' and witr, saying that this is the position of the great majority of scholars, early and later, and is the practice in the lands of the two Holy Mosques. It said that the basic sunna of tarawih is achieved with any even number of rak'as, even two, prayed with the intention of standing in prayer in Ramadan."
  ur: "تراویح کی رکعات کی تعداد کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس کی کامل صورت شفع اور وتر کے علاوہ بیس رکعات ہے، اور اس کی اصل کسی بھی جفت تعداد سے، حتیٰ کہ دو رکعات سے، حاصل ہو جاتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ تراویح کی کامل صورت شفع اور وتر کے علاوہ بیس رکعات ہے، اور کہا کہ یہی سلف و خلف کے جمہور علما کا موقف ہے اور حرمین شریفین کے علاقے میں اسی پر عمل ہے۔ اس نے کہا کہ تراویح کی اصل قیامِ رمضان کی نیت سے کسی بھی جفت تعداد، حتیٰ کہ دو رکعات، سے حاصل ہو جاتی ہے۔"
  es: "Una pregunta sobre el número de rak'as en el tarawih, a la que el Departamento General de Iftaa de Jordania respondió que su forma más completa es de veinte rak'as además del shaf' y el witr, y que su forma básica se logra con cualquier número par, incluso dos. El Departamento respondió que la forma más completa del tarawih es de veinte rak'as además del shaf' y el witr, diciendo que esta es la posición de la gran mayoría de los eruditos, antiguos y modernos, y es la práctica en las tierras de las dos Mezquitas Sagradas. Dijo que la sunna básica del tarawih se logra con cualquier número par de rak'as, incluso dos, rezadas con la intención de permanecer de pie en oración durante el Ramadán."
  fr: "Une question concernant le nombre de rak'as dans la prière de Tarawih a été posée. Le Département général de la Iftaa de Jordanie a répondu que sa forme la plus complète est de vingt rak'as, outre le shaf' et le witr, et que sa forme de base est accomplie avec n'importe quel nombre pair, même deux. Le Département a précisé que la forme la plus complète de Tarawih est de vingt rak'as, outre le shaf' et le witr, car il s'agit de l'avis de la grande majorité des savants, anciens et modernes, et de la pratique en vigueur sur les terres des deux Saintes Mosquées. Il a ajouté que la sunna de base de Tarawih est accomplie avec n'importe quel nombre pair de rak'as, même deux, priées avec l'intention de se tenir debout en prière pendant le Ramadan."
  tr: "Teravih namazının rekâ sayısı hakkında bir soruya gelince, Ürdün Genel Fetva Dairesi, namazın Şaf ve Vitr hariç yirmi rekah olarak tamamlanması gerektiğini ve orijinal halinin iki rekat olsa bile çift sayı olduğunu belirtti. Daire, teravih namazının tamamlanmasının Şaf ve Vitr hariç yirmi rekah olduğunu ve bunun hem erken hem de sonraki çoğu alimin uygulaması olduğunu, İki Kutsal Cami diyarında yapıldığını belirtti. Orijinal teravih namazının, Ramazan niyetiyle iki rekat bile olsa çift sayıda kılkıldığını belirtti."
  id: "Mengenai jumlah rak'ah shalat Taraweeh, Departemen Fatwa Umum Yordania menjawab bahwa harus diselesaikan sebagai dua puluh rak'ah kecuali Shaf' dan Witr, dan bentuk aslinya adalah angka genap, meskipun dua rak'ah. Departemen menjawab bahwa menyelesaikan shalat Taraweeh adalah dua puluh rak'ah kecuali Shaf' dan Witr, dan mengatakan bahwa ini adalah praktik mayoritas ulama, baik yang lebih awal maupun yang kemudian, dan dipraktikkan di tanah Dua Masjid Suci. Dikatakan bahwa shalat Taraweeh asli dilakukan dalam jumlah genap, meskipun itu dua rak'ah dengan niat melaksanakan Ramadan."
