label: { ar: "قرار مجمع الفقه الإسلامي الدولي 148 (16/6) بشأن الكفالة التجارية", en: "IIFA resolution 148 (16/6) on commercial sponsorship ⁦(kafala tijariyya)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 148 (16/6): تجارتی کفالت", es: "Resolución IIFA 148 (16/6) sobre patrocinio comercial (kafala tijariyya)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. فرّق بين الكفالة شرعًا ⁦(ضم ذمة الكفيل إلى ذمة المدين في المطالبة بدين أو عين أو نفس)⁩ وبين الكفالة التجارية ⁦(اتفاق يمكّن غير المواطن من استخدام ترخيص مزاولة المهن أو إقامة المشروعات)⁩. وعدّد صورها منها: موافقة المواطن صاحب الترخيص على استخدام غير المواطن له في نشاط خاص بتمويل كامل منه دون إسهام مالي أو التزام عملي للمواطن حيث يظهر بمظهر مالك المشروع؛ ومشاركة المواطن لغير المواطن فيما تسمح به القوانين مع تقاسم الأرباح. ثم بيّن حكم كل صورة وضوابطها وما يمنع من التحايل والتستر التجاري."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). It distinguished sharia suretyship (joining the guarantor's liability to the debtor's in a claim over debt, asset or person) from commercial kafala (an arrangement letting a non-citizen use a licence to practise trades or set up enterprises). Its forms include: the licensed citizen consenting to a non-citizen using the licence for his own fully financed activity, the citizen contributing neither capital nor work yet appearing as the business owner; and the citizen partnering with the non-citizen where laws permit, sharing profits. It then ruled on each form, its controls, and what is prohibited as evasion and commercial concealment."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ اس نے شرعی کفالت ⁦(کفیل کی ذمہ داری مدین سے ملانا — دین، عین یا نفس کے مطالبے میں)⁩ اور تجارتی کفالت ⁦(غیر شہری کو پیشوں یا منصوبوں کے لائسنس استعمال کرنے دینے والا معاہدہ)⁩ میں فرق کیا۔ صورتیں: لائسنس یافتہ شہری کی اجازت کہ غیر شہری اس لائسنس کو اپنی سرگرمی کے لیے پوری سرمایہ کاری کے ساتھ استعمال کرے، شہری نہ مالیات میں شریک ہو نہ عملی طور پر پابند مگر مالک کے روپ میں ظاہر ہو؛ اور قوانین کی اجازت کے مطابق شہری اور غیر شہری کی شراکت مع منافع کی تقسیم۔ پھر ہر صورت کا حکم، ضوابط اور ریائت/تجارتی پردہ پوشی کی ممنوعیت۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión celebrada en Dubái (30 de Safar – 5 de Rabi al-Awwal de 1426, del 9 al 14 de abril de 2005). Esta resolución distinguió la fianza islámica (que vincula la responsabilidad del garante con la del deudor en una reclamación sobre una deuda, un bien o una persona) de la kafala comercial (un acuerdo que permite a un extranjero utilizar una licencia para ejercer una actividad comercial o establecer una empresa). Sus modalidades incluyen: el ciudadano con licencia que consiente que un extranjero utilice la licencia para su propia actividad, financiada íntegramente, sin aportar capital ni trabajo, pero figurando como propietario del negocio; y la asociación del ciudadano con el extranjero, donde la ley lo permite, compartiendo los beneficios. Posteriormente, la resolución se pronunció sobre cada modalidad, sus controles y lo que se considera evasión y ocultación comercial prohibida."
