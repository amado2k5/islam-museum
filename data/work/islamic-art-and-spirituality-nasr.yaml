summary:
  ar: "كتاب بالإنجليزية لسيد حسين نصر عن صلة الفن الإسلامي بالروحانية، صدر عن مطبعة جامعة ولاية نيويورك في ألباني سنة 1987."
  en: "An English book by Seyyed Hossein Nasr on the relation of Islamic art to spirituality, published by State University of New York Press, Albany in 1987."
  ur: "سید حسین نصر کی انگریزی کتاب جو اسلامی فن اور روحانیت کے تعلق پر ہے؛ اسٹیٹ یونیورسٹی آف نیویارک پریس، البانی سے 1987ء میں شائع ہوئی۔"
  fr: "Islamic Art and Spirituality est un livre de Seyyed Hossein Nasr, publié par State University of New York Press en 1987. Selon la présentation de l'éditeur, Nasr montre aux lecteurs occidentaux et musulmans que chaque forme d'art de la tradition islamique repose sur une science de la nature attachée non à l'apparence extérieure des choses, mais à leur réalité intérieure."
  es: "Islamic Art and Spirituality es un libro de Seyyed Hossein Nasr, publicado por State University of New York Press en 1987. Según la presentación del editor, Nasr muestra a lectores occidentales y musulmanes que cada forma artística de la tradición islámica se basa en una ciencia de la naturaleza que no atiende a la apariencia exterior de las cosas, sino a su realidad interior."
  tr: "Islamic Art and Spirituality, Seyyid Hüseyin Nasr'ın 1987'de State University of New York Press tarafından yayımlanan kitabıdır. Yayıncının tanıtımına göre Nasr, Batılı ve Müslüman okurlara İslam geleneğindeki her sanat türünün, eşyanın dış görünüşüyle değil iç hakikatiyle ilgilenen bir tabiat ilmine dayandığını gösterir."
  id: "Islamic Art and Spirituality adalah buku karya Seyyed Hossein Nasr terbitan State University of New York Press tahun 1987. Menurut deskripsi penerbit, Nasr menunjukkan kepada pembaca Barat dan Muslim bahwa setiap bentuk seni dalam tradisi Islam bertumpu pada ilmu tentang alam yang tidak memperhatikan rupa lahiriah benda, melainkan hakikat batinnya."
