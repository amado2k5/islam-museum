id: work/fatwa-amja-quran-distortion-claim
class: work
kind: fatwa
label: { ar: "دعوى تحريف القرآن", en: "The claim that the Quran was distorted", ur: "قرآن کی تحریف کا دعویٰ", es: "La afirmación de que el Corán fue distorsionado" }
summary:
  ar: "سأل سائل عن رأي أمجد في الأحاديث التي يُزعم أنها تقول بتحريف القرآن وعن حكم العالم الذي يقول إن القرآن يحرف هل يحسب كافرًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82168 بتاريخ 13 أغسطس 2010)⁩ أن القرآن الكريم تكفل الله بحفظه لقوله إنا نحن نزلنا الذكر وإنا له لحافظون واتفقت الأمة قاطبة على حفظه وعصمته وأنه الموجود بين دفتي المصحف الذي يتناقله المسلمون ويترتلونه في المشارق والمغارب، فمن زعم أنه محرف وهو غير مغلوب على عقله فقد خلع ربقة الإسلام من عنقه."
  en: "A questioner asked AMJA's view of reports alleged to affirm the Quran's distortion, and the status of a scholar who says the Quran is distorted — whether he counts as a disbeliever. Dr. Salah al-Sawi (fatwa no. 82168, 13 August 2010) answered that God undertook the Quran's preservation — 'We sent down the Reminder and We are its guardians' — and the whole ummah agrees on its preservation and immunity, that it is what lies between the covers of the mushaf which Muslims pass down and recite east and west; whoever claims it is distorted while of sound mind has cast off the noose of Islam from his neck. Recorded as AMJA's answer."
  ur: "ایک سائل نے قرآن کی تحریف کے دعوے اور اس کے قائل کے حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82168، 13 اگست 2010)⁩ کے مطابق امت قرآن کے تحفظ پر متفق ہے؛ جو عاقل شخص تحریف کا دعویٰ کرے وہ اسلام کی رسی چھوڑ دیتا ہے۔"
  es: "Un interlocutor preguntó a AMJA su opinión sobre los informes que supuestamente afirman la distorsión del Corán, y sobre la condición de un erudito que afirma que el Corán está distorsionado: si se le considera un incrédulo. El Dr. Salah al-Sawi (fatwa n.º 82168, 13 de agosto de 2010) respondió que Dios se encargó de la preservación del Corán —«Nosotros enviamos el Recordatorio y Nosotros somos sus guardianes»— y que toda la ummah está de acuerdo en su preservación e inviolabilidad, que es lo que yace entre las tapas del mushaf que los musulmanes transmiten y recitan en Oriente y Occidente; quien afirma que está distorsionado estando en su sano juicio se ha liberado del yugo del Islam. (Respuesta registrada de AMJA)."
