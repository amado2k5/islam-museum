label: { ar: "أبيات عتاب العباس بن مرداس في قسمة الجعرانة", en: "Abbas ibn Mirdas's verses of reproach on the Ji'rana division", es: "Los versos de reproche de Abbas ibn Mirdas sobre la división Ji'rana", fr: "Versets de reproche d'Abbas ibn Mirdas sur la division Ji'rana", ur: "عباس بن مرداس کی جرعانہ تقسیم پر ملامت والی آیات" }
summary:
  ar: "أبيات العباس بن مرداس السلمي التي عاتب فيها النبي حين نقص عطاؤه عن مائة بعير وفُضّل عليه الأقرع وعيينة؛ مطلعها: «أتجعلُ نهبي ونهبَ العُبيدِ بين عيينةَ والأقرعِ»، فأتم له النبي المائة حتى رضي."
  en: "The verses of gentle reproach composed by Abbas ibn Mirdas when granted fewer camels than Uyayna and al-Aqra', upon which the Prophet ordered his share completed to a full hundred until he was satisfied."
  es: "Los versos de suave reproche compuestos por Abbas ibn Mirdas cuando se le concedieron menos camellos que a Uyayna y al-Aqra', ante lo cual el Profeta ordenó que se completara su parte hasta llegar a los cien hasta quedar satisfecho."
  fr: "Les versets de douce réprimande composés par Abbas ibn Mirdas lorsqu'il reçut moins de chameaux qu'Uyayna et al-Aqra', sur quoi le Prophète ordonna que sa part soit complétée jusqu'à cent jusqu'à ce qu'il soit satisfait."
  ur: "نرم ملامت والی آیات جو عباس بن مرداس نے تصنیف کی ہیں جب عیینہ اور اقراء سے کم اونٹ دیے گئے تھے، جس پر رسول اللہ نے حکم دیا کہ اس کا حصہ پورے سو کر دیا جائے یہاں تک کہ وہ مطمئن ہو جائیں۔"
