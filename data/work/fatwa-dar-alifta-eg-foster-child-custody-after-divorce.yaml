id: work/fatwa-dar-alifta-eg-foster-child-custody-after-divorce
class: work
kind: fatwa
label: { ar: "حضانة الطفل المكفول بعد طلاق الزوجين وحق الطرف الآخر في رؤيته", en: "Custody of a fostered child after the couple's divorce and the other's right of contact", ur: "طلاق کے بعد کفیل بچے کی حضانت اور دوسرے فریق کا ملنے کا حق", es: "Custodia de un menor acogido tras el divorcio de la pareja y el derecho de visita del otro cónyuge.", fr: "Garde d'un enfant placé en famille d'accueil après le divorce du couple et droit de visite de l'autre partie", tr: "Çiftin boşanmasından sonra sponsor edilen çocuğun velayeti ve diğer tarafın onu görme hakkı", id: "Hak asuh anak yang disponsori setelah perceraian pasangan dan hak pihak lain untuk bertemu dengannya" }
summary:
  ar: "سائل سأل عن حضانة الطفل المكفول بعد طلاق الكافلين وحق الطرف الآخر في رؤيته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21850)⁩ أن الولاية على الطفل المكفول بعد طلاق الكافلين ثابتة لولي الأمر المتمثل في اللجنة العليا للأسر البديلة على ما فصّل الجواب."
  en: "A questioner asked about custody of a fostered child after the fostering couple divorces and the other party's right of contact. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21850) answered that guardianship of the fostered child after the fosterers' divorce rests with the legal guardian represented by the Supreme Committee for Alternative Families, as the answer details."
  ur: "ایک سائل نے کفیل جوڑے کی طلاق کے بعد کفیل بچے کی حضانت اور دوسرے فریق کے ملنے کے حق کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21850)⁩ نے جواب دیا کہ طلاق کے بعد کفیل بچے کی ولایت متبادل خاندانوں کی اعلیٰ کمیٹی کو ہوتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la custodia de un niño acogido tras el divorcio de la pareja que lo acogía y el derecho de contacto de la otra parte. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21850) respondió que la tutela del niño acogido tras el divorcio de los padres de acogida recae en el tutor legal representado por el Comité Supremo para las Familias Alternativas, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la garde d'un enfant placé en famille d'accueil après le divorce des parents d'accueil et le droit de visite de l'autre parent. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21850) a répondu que la tutelle de l'enfant après le divorce des parents d'accueil incombe au tuteur légal, représenté par le Comité suprême pour les familles d'accueil alternatives, comme le précise la réponse."
  tr: "Bir soru soran, sponsorların boşanmasından sonra sponsorlu çocuğun velayeti ve diğer tarafın onu görme hakkı hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21850), sponsorların boşanmasından sonra sponsorlu çocuğun velayetinin, Alternatif Aileler Yüksek Komitesi tarafından temsil edilen vasiye bağlı olduğunu yanıtladı; bu cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang hak asuh anak yang disponsori setelah perceraian para sponsor dan hak pihak lain untuk bertemu dengannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21850) menjawab bahwa hak asuh atas anak yang disponsori setelah perceraian para sponsor ditetapkan kepada wali, yang diwakili oleh Komite Tertinggi untuk Keluarga Alternatif, sebagaimana dijelaskan dalam jawaban."
