id: work/fatwa-dar-alifta-eg-foster-child-custody-after-divorce
class: work
kind: fatwa
label: { ar: "حضانة الطفل المكفول بعد طلاق الزوجين وحق الطرف الآخر في رؤيته", en: "Custody of a fostered child after the couple's divorce and the other's right of contact", ur: "طلاق کے بعد کفیل بچے کی حضانت اور دوسرے فریق کا ملنے کا حق" }
summary:
  ar: "سائل سأل عن حضانة الطفل المكفول بعد طلاق الكافلين وحق الطرف الآخر في رؤيته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21850)⁩ أن الولاية على الطفل المكفول بعد طلاق الكافلين ثابتة لولي الأمر المتمثل في اللجنة العليا للأسر البديلة على ما فصّل الجواب."
  en: "A questioner asked about custody of a fostered child after the fostering couple divorces and the other party's right of contact. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21850) answered that guardianship of the fostered child after the fosterers' divorce rests with the legal guardian represented by the Supreme Committee for Alternative Families, as the answer details."
  ur: "ایک سائل نے کفیل جوڑے کی طلاق کے بعد کفیل بچے کی حضانت اور دوسرے فریق کے ملنے کے حق کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21850)⁩ نے جواب دیا کہ طلاق کے بعد کفیل بچے کی ولایت متبادل خاندانوں کی اعلیٰ کمیٹی کو ہوتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
