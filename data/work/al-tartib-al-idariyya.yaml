  ar: "كتاب «التراتيب الإدارية»، كما يقدّمه طارق السويدان: أقدم مرجع مطبوع في الإدارة عند المسلمين، من القرن السابع الهجري، وفيه توصيف وظيفي لمناصب الدولة من القاضي إلى قائد الجيش."
  en: "Al-Tartib al-Idariyya, as presented by Tareq al-Suwaidan: the oldest printed Muslim reference on administration, from the seventh Hijri century, containing job descriptions for state posts from the judge to the army commander."
  ur: "«الترتیب الاداریۃ»، جیسا کہ طارق السویدان پیش کرتے ہیں: مسلمانوں کے پاس انتظامیہ کی قدیم ترین مطبوعہ مرجع کتاب، ساتویں ہجری صدی کی، جس میں قاضی سے لے کر سپہ سالار تک عہدوں کی ملازمت کی تفصیلات لکھی گئی ہیں۔"
