id: work/ahmed-el-sayed-seerah-2026-ep31
class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 31: لماذا تأخر رجوع بعض الصحابة من الحبشة إلى زمن خيبر؟"
  en: "The Biography of the Messenger of God 2026, episode 31: Why did some Companions return from Abyssinia only around the time of Khaybar?"
  ur: "سیرتِ رسول اللہ 2026، قسط 31: حبشہ سے بعض صحابہ کی واپسی خیبر کے زمانے تک کیوں مؤخر ہوئی؟"
  fr: "La biographie du Messager de Dieu 2026, épisode 31 : Pourquoi le retour de certains Compagnons d'Abyssinie fut-il retardé jusqu'à l'époque de Khaybar ?"
  es: "La biografía del Mensajero de Dios 2026, episodio 31: ¿Por qué el regreso de algunos Compañeros de Abisinia se retrasó hasta la época de Khaybar?"
summary:
  ar: "يضع المحاضر السنوات بين السابعة والعاشرة من البعثة في مقابل ما ملأ به ابن إسحاق ومن جاء بعده هذه السنوات من أحداث، ثم يقرأ قائمة ابن إسحاق بالصحابة الذين عادوا من الحبشة إلى مكة. ويرى أن الباقين مكثوا إلى ما بعد الحديبية بقرار النبي أو بموافقته، ويروي قصص جوار عثمان بن مظعون وأبي سلمة وأبي بكر، ويدافع عن مكانة ابن إسحاق راويًا للحديث في مقابل الواقدي."
  en: "The lecturer places the years between the seventh and tenth of the mission against how Ibn Ishaq and later authors filled them with events, then reads Ibn Ishaq's list of Companions who came back from Abyssinia to Mecca. He argues that the rest stayed until after Hudaybiyya by the Prophet's decision or approval, tells the stories of the neighbour-protection (jiwar) of Uthman ibn Maz'un, Abu Salama and Abu Bakr, and defends Ibn Ishaq's standing as a hadith narrator against al-Waqidi's."
  ur: "مقرر بعثت کے ساتویں اور دسویں سال کے درمیان کے برسوں کو اس کے مقابل رکھتے ہیں کہ ابن اسحاق اور بعد کے مصنفین نے انہیں کن واقعات سے بھرا، پھر ابن اسحاق کی ان صحابہ کی فہرست پڑھتے ہیں جو حبشہ سے مکہ لوٹے۔ وہ دلیل دیتے ہیں کہ باقی لوگ حدیبیہ کے بعد تک نبی کے فیصلے یا اجازت سے وہیں رہے، عثمان بن مظعون، ابو سلمہ اور ابو بکر کے جوار کے قصے بیان کرتے ہیں، اور بطور محدث راوی ابن اسحاق کے مقام کا واقدی کے مقابل دفاع کرتے ہیں۔"
  fr: "Le conférencier met les années comprises entre la septième et la dixième de la mission en regard des événements dont Ibn Ishaq et les auteurs postérieurs les ont remplies, puis lit la liste d'Ibn Ishaq des Compagnons revenus d'Abyssinie à La Mecque. Il soutient que les autres restèrent jusqu'après Hudaybiyya par décision ou approbation du Prophète, raconte l'histoire de la protection (jiwar) d'Uthman ibn Maz'un, d'Abu Salama et d'Abu Bakr, et défend le rang d'Ibn Ishaq comme narrateur de hadiths face à celui d'al-Waqidi."
  es: "El conferenciante sitúa los años entre el séptimo y el décimo de la misión frente a los acontecimientos con que Ibn Ishaq y autores posteriores los llenaron, y luego lee la lista de Ibn Ishaq de los Compañeros que volvieron de Abisinia a La Meca. Sostiene que los demás se quedaron hasta después de Hudaybiyya por decisión o aprobación del Profeta, cuenta las historias de la protección (jiwar) de Uthman ibn Maz'un, Abu Salama y Abu Bakr, y defiende la posición de Ibn Ishaq como transmisor de hadices frente a la de al-Waqidi."
