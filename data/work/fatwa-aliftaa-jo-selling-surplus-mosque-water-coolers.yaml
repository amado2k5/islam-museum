label: { ar: "بيع برادات المياه الزائدة في المسجد", en: "Selling surplus water coolers in a mosque", ur: "مسجد کے زائد واٹر کولر بیچنا", es: "Venta de enfriadores de agua sobrantes en una mezquita", fr: "Vente de fontaines à eau excédentaires dans une mosquée", tr: "Camide fazla su soğutucularının satışı", id: "Penjualan pendingin air berlebih di masjid" }
summary:
  ar: "سؤال عن بيع برادات مياه زائدة غير منتفع بها في مسجد وشراء شيء آخر بثمنها، أجابت فيه دائرة الإفتاء العام الأردنية بالتفريق بين ما وُقف بعينه فلا يباع إلا إذا تعطل، وما وُهب للمسجد أو اشتراه الناظر دون وقف فيجوز بيعه عند الحاجة. أجابت الدائرة بأن الأصل أن الوقف لا يباع ولا يوهب ولا يورث، واستندت إلى خبر وقف عمر بن الخطاب أرضه بخيبر المتفق عليه. وقالت إن أدوات الوقف كالسجاد وبرادات المياه يُفرق فيها بين ما وُقف بعينه، فلا يباع إلا إذا تعطل وتعذر الانتفاع به فيباع ويشترى بثمنه مثله أو ينقل إلى مسجد آخر يحتاجه، وما وُهب للمسجد دون وقف أو اشتراه ناظر الوقف ولم يوقفه، فيجوز بيعه عند الحاجة. ونقلت قول النووي في روضة الطالبين بوجهين في بيع حصر المسجد إذا بليت أصحهما جواز البيع لئلا تضيع، وقوله إن ما اشتراه الناظر للمسجد أو وهبه له واهب يجوز بيعه عند الحاجة بلا خلاف لأنه ملك، كما نقلت كلامًا للبكري الدمياطي في نقل حصر المسجد. وخلصت إلى هذا التفريق في حكم البرادات بحسب كونها موقوفة أو مملوكة للمسجد."
  en: "A question about selling a mosque's unused surplus water coolers and buying something else with the price, in which Jordan's General Iftaa Department distinguished items endowed in themselves, which are sold only if they break down, from items donated to the mosque or bought by its administrator without being endowed, which may be sold when needed. The Department answered that an endowment in principle may not be sold, given away or inherited, citing the agreed-upon report of Umar ibn al-Khattab endowing his land at Khaybar. It said that endowment furnishings such as carpets and water coolers fall into two kinds: items endowed in themselves may not be sold unless they break down and can no longer be used, in which case they are sold and replaced with the like, or moved to another mosque that needs them; items donated to the mosque without endowment, or bought by the endowment's administrator without endowing them, may be sold when needed. It quoted al-Nawawi in Rawdat al-Talibin giving two views on selling worn-out mosque mats, the sounder being that they are sold so they are not wasted, and his statement that what the administrator bought for the mosque or a donor gave it may be sold when needed without disagreement, since it is owned property; it also quoted al-Bakri al-Dimyati on moving mosque mats. It concluded with this distinction for the coolers, depending on whether they are endowed or owned by the mosque."
  ur: "مسجد کے غیر مستعمل زائد واٹر کولر بیچ کر اس کی قیمت سے کچھ اور خریدنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے فرق کیا کہ جو چیز بعینہ وقف ہو وہ صرف خراب ہونے پر بیچی جا سکتی ہے، اور جو مسجد کو ہبہ کی گئی یا متولی نے بغیر وقف کیے خریدی وہ ضرورت کے وقت بیچی جا سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ وقف نہ بیچا جا سکتا ہے، نہ ہبہ کیا جا سکتا ہے، نہ وراثت میں جاتا ہے، اور خیبر میں عمر بن الخطاب کے اپنی زمین وقف کرنے کی متفق علیہ روایت کا حوالہ دیا۔ اس نے کہا کہ قالین اور واٹر کولر جیسی وقف کی اشیا دو قسم کی ہیں: جو بعینہ وقف ہوں وہ نہیں بیچی جا سکتیں جب تک خراب ہو کر ناقابل استعمال نہ ہو جائیں، اس صورت میں بیچ کر ان کی جگہ ویسی ہی چیز خریدی جائے یا ضرورت مند دوسری مسجد میں منتقل کی جائیں؛ اور جو مسجد کو وقف کے بغیر ہبہ کی گئیں یا متولی نے خرید کر وقف نہیں کیں، وہ ضرورت کے وقت بیچی جا سکتی ہیں۔ اس نے روضۃ الطالبین میں نووی کا قول نقل کیا کہ مسجد کی پرانی چٹائیوں کی فروخت میں دو اقوال ہیں جن میں زیادہ صحیح یہ ہے کہ انہیں ضائع ہونے سے بچانے کے لیے بیچ دیا جائے، اور یہ کہ جو متولی نے مسجد کے لیے خریدا یا کسی نے ہبہ کیا وہ ملکیت ہونے کی وجہ سے ضرورت کے وقت بلا اختلاف بیچا جا سکتا ہے؛ اس نے مسجد کی چٹائیاں منتقل کرنے کے بارے میں بکری دمیاطی کا کلام بھی نقل کیا۔ اس نے کولروں کے حکم میں یہی فرق بیان کیا کہ وہ وقف ہیں یا مسجد کی ملکیت۔"
  es: "Una pregunta sobre la venta de los enfriadores de agua sobrantes de una mezquita y la compra de otros artículos con el precio, en la que el Departamento General de Iftaa de Jordania distinguió entre los artículos dotados en sí mismos, que se venden solo si se averían, y los artículos donados a la mezquita o comprados por su administrador sin estar dotados, que pueden venderse cuando sea necesario. El Departamento respondió que, en principio, un legado no puede venderse, donarse ni heredarse, citando el informe acordado de Umar ibn al-Khattab sobre la donación de su terreno en Khaybar. Dijo que los muebles de legado, como alfombras y enfriadores de agua, se dividen en dos tipos: los artículos dotados en sí mismos no pueden venderse a menos que se averíen y ya no se puedan usar, en cuyo caso se venden y se reemplazan por otros similares, o se trasladan a otra mezquita que los necesite; los artículos donados a la mezquita sin legado, o comprados por el administrador del legado sin dotarlos, pueden venderse cuando sea necesario. Citaba a al-Nawawi en Rawdat al-Talibin, donde exponía dos posturas sobre la venta de alfombras de mezquita desgastadas: la más sensata, que se venden para evitar su desperdicio, y la que afirmaba que lo que el administrador compró para la mezquita o un donante le donó puede venderse cuando sea necesario sin desacuerdo, puesto que es propiedad de la misma. También citaba a al-Bakri al-Dimyati sobre el traslado de las alfombras de mezquita. Concluía con esta distinción para los enfriadores, según fueran donados o propiedad de la mezquita."
  fr: "Une question portait sur la vente des fontaines à eau excédentaires et inutilisées d'une mosquée, et l'utilisation du produit de la vente pour d'autres biens. Le Département général de la Iftaa de Jordanie a établi une distinction entre les biens faisant l'objet d'une dotation, qui ne peuvent être vendus qu'en cas de panne, et les biens donnés à la mosquée ou acquis par son administrateur sans dotation, qui peuvent être vendus en cas de besoin. Le Département a répondu qu'en principe, une dotation ne peut être ni vendue, ni donnée, ni transmise par héritage, citant le hadith reconnu d'Umar ibn al-Khattab faisant don de ses terres à Khaybar. Il a précisé que le mobilier de dotation, tel que les tapis et les fontaines à eau, se divise en deux catégories: les biens faisant l'objet d'une dotation ne peuvent être vendus que s'ils deviennent inutilisables, auquel cas ils sont vendus et remplacés par des biens similaires, ou transférés à une autre mosquée qui en a besoin; les biens donnés à la mosquée sans dotation, ou acquis par l'administrateur de la dotation sans dotation, peuvent être vendus en cas de besoin. L'article cite al-Nawawi dans Rawdat al-Talibin, qui présente deux avis concernant la vente des tapis de mosquée usés: l'avis le plus judicieux étant qu'ils sont vendus pour éviter le gaspillage; l'autre avis stipule que ce que l'administrateur a acheté pour la mosquée ou qu'un donateur a offert peut être vendu sans objection en cas de besoin, puisqu'il s'agit d'un bien appartenant à la mosquée. L'article cite également al-Bakri al-Dimyati au sujet du déplacement des tapis de mosquée. Il conclut en établissant une distinction pour les rafraîchisseurs, selon qu'ils soient un don de la mosquée ou qu'ils lui appartiennent."
  tr: "Camide kullanılmayan fazla su soğutucularının satılıp başka bir şeyin fiyatına alınması hakkında bir soruya Ürdün Genel Fetva Dairesi yanıtlamış, özellikle vakıf edilen, yani işlevsiz kalmadıkça satılmayan vakıf ile camiye hediye edilen veya vakıf olmadan süpervizör tarafından satın alınan şeyler gerektiğinde satılabilmektedir. Daire, vakıfların satılmadığı, bağışlanmadığı veya miras alınmadığı varsayılan durumun olduğunu ve bunun Ömer bin El-Hattab'ın Haybar'daki arazisini bağışladığına dair üzerinde anlaşılmış rapora dayanarak yanıt verdiğini belirtti. Halı ve su sebilleri gibi vakıf araçlarının özel olarak vakıf edilenleri ayırdığını, bu yüzden sadece engelliyse ve kullanılamıyorsa satıldığını, böylece aynı fiyata satıldığını veya ihtiyacı olan başka bir camiye devredildiğini belirtti. Vakıf olmadan camiye bağışlanan veya vakıf etmeyen vakıf denetçisi tarafından satın alınan her şeyin ihtiyaç duyulduğunda satılmasına izin verildiğini belirtti. Rawdat al-Talibin'de Al-Nawawi'nin cami çevresinin yerine getirilirse satılmasıyla ilgili iki şekilde alıntı yaptım; en doğru olanı kaybetmemek için satışın izin verilebilir olması ve cami gözetmenin, bir bağışçı tarafından satın alınan veya hediye edilen şeyin ihtiyaç halinde mülk olduğu için ihtiyaçsız satılabileceği ifadesidir. Ayrıca Caminin çevresinin devriyle ilgili olarak Al-Bakri Al-Dimyati'den alıntı yaptım. Buzdolaplarının camiye ait olup olmadıklarına göre bu ayrımla bitirdim."
  id: "Pertanyaan tentang menjual pendingin air surplus yang tidak digunakan di masjid dan membeli sesuatu dengan harga tersebut, dijawab oleh Departemen Fatwa Umum Yordania dengan membedakan antara apa yang secara khusus diwakani, sehingga tidak dijual kecuali dalam kondisi cacat, dan apa yang diberikan kepada masjid atau dibeli oleh pengawas tanpa dana abadi dapat dijual jika diperlukan. Departemen menjawab bahwa defaultnya adalah wakaf tidak dijual, dihadiahkan, atau diwariskan, dan berdasarkan laporan yang disepakati tentang pemberian tanah Umar ibn Al-Khattab di Khaybar. Dokumen tersebut menyatakan bahwa alat wakaf seperti karpet dan dispenser air membedakan apa yang secara khusus diwakani, sehingga hanya dijual jika dibebani dan tidak dapat digunakan, sehingga dijual dan dibeli dengan harga yang sama atau dipindahkan ke masjid lain yang membutuhkannya. Apa pun yang disumbangkan ke masjid tanpa dana abadi atau dibeli oleh pengawas wakaf yang tidak memberikan wakaf, diperbolehkan dijual jika diperlukan. Saya mengutip pandangan Al-Nawawi dalam Rawdat al-Talibin, dalam dua cara mengenai penjualan pagar masjid jika dipenuhi; yang paling benar adalah diperbolehkannya menjual agar tidak hilang, dan pernyataannya bahwa apa yang dibeli atau diberikan oleh pengawas masjid kepadanya oleh donor dapat dijual jika diperlukan tanpa perselisihan karena itu adalah properti. Saya juga mengutip kata-kata dari Al-Bakri Al-Dimyati mengenai pemindahan pagar masjid. Saya mengakhiri dengan perbedaan ini mengenai aturan kulkas berdasarkan apakah mereka dianugerahi atau dimiliki oleh masjid."
