id: work/fatwa-aliftaa-jo-selling-surplus-mosque-water-coolers
class: work
kind: fatwa
label: { ar: "بيع برادات المياه الزائدة في المسجد", en: "Selling surplus water coolers in a mosque", ur: "مسجد کے زائد واٹر کولر بیچنا" }
summary:
  ar: "سؤال عن بيع برادات مياه زائدة غير منتفع بها في مسجد وشراء شيء آخر بثمنها، أجابت فيه دائرة الإفتاء العام الأردنية بالتفريق بين ما وُقف بعينه فلا يباع إلا إذا تعطل، وما وُهب للمسجد أو اشتراه الناظر دون وقف فيجوز بيعه عند الحاجة. أجابت الدائرة بأن الأصل أن الوقف لا يباع ولا يوهب ولا يورث، واستندت إلى خبر وقف عمر بن الخطاب أرضه بخيبر المتفق عليه. وقالت إن أدوات الوقف كالسجاد وبرادات المياه يُفرق فيها بين ما وُقف بعينه، فلا يباع إلا إذا تعطل وتعذر الانتفاع به فيباع ويشترى بثمنه مثله أو ينقل إلى مسجد آخر يحتاجه، وما وُهب للمسجد دون وقف أو اشتراه ناظر الوقف ولم يوقفه، فيجوز بيعه عند الحاجة. ونقلت قول النووي في روضة الطالبين بوجهين في بيع حصر المسجد إذا بليت أصحهما جواز البيع لئلا تضيع، وقوله إن ما اشتراه الناظر للمسجد أو وهبه له واهب يجوز بيعه عند الحاجة بلا خلاف لأنه ملك، كما نقلت كلامًا للبكري الدمياطي في نقل حصر المسجد. وخلصت إلى هذا التفريق في حكم البرادات بحسب كونها موقوفة أو مملوكة للمسجد."
  en: "A question about selling a mosque's unused surplus water coolers and buying something else with the price, in which Jordan's General Iftaa Department distinguished items endowed in themselves, which are sold only if they break down, from items donated to the mosque or bought by its administrator without being endowed, which may be sold when needed. The Department answered that an endowment in principle may not be sold, given away or inherited, citing the agreed-upon report of Umar ibn al-Khattab endowing his land at Khaybar. It said that endowment furnishings such as carpets and water coolers fall into two kinds: items endowed in themselves may not be sold unless they break down and can no longer be used, in which case they are sold and replaced with the like, or moved to another mosque that needs them; items donated to the mosque without endowment, or bought by the endowment's administrator without endowing them, may be sold when needed. It quoted al-Nawawi in Rawdat al-Talibin giving two views on selling worn-out mosque mats, the sounder being that they are sold so they are not wasted, and his statement that what the administrator bought for the mosque or a donor gave it may be sold when needed without disagreement, since it is owned property; it also quoted al-Bakri al-Dimyati on moving mosque mats. It concluded with this distinction for the coolers, depending on whether they are endowed or owned by the mosque."
  ur: "مسجد کے غیر مستعمل زائد واٹر کولر بیچ کر اس کی قیمت سے کچھ اور خریدنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے فرق کیا کہ جو چیز بعینہ وقف ہو وہ صرف خراب ہونے پر بیچی جا سکتی ہے، اور جو مسجد کو ہبہ کی گئی یا متولی نے بغیر وقف کیے خریدی وہ ضرورت کے وقت بیچی جا سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ وقف نہ بیچا جا سکتا ہے، نہ ہبہ کیا جا سکتا ہے، نہ وراثت میں جاتا ہے، اور خیبر میں عمر بن الخطاب کے اپنی زمین وقف کرنے کی متفق علیہ روایت کا حوالہ دیا۔ اس نے کہا کہ قالین اور واٹر کولر جیسی وقف کی اشیا دو قسم کی ہیں: جو بعینہ وقف ہوں وہ نہیں بیچی جا سکتیں جب تک خراب ہو کر ناقابل استعمال نہ ہو جائیں، اس صورت میں بیچ کر ان کی جگہ ویسی ہی چیز خریدی جائے یا ضرورت مند دوسری مسجد میں منتقل کی جائیں؛ اور جو مسجد کو وقف کے بغیر ہبہ کی گئیں یا متولی نے خرید کر وقف نہیں کیں، وہ ضرورت کے وقت بیچی جا سکتی ہیں۔ اس نے روضۃ الطالبین میں نووی کا قول نقل کیا کہ مسجد کی پرانی چٹائیوں کی فروخت میں دو اقوال ہیں جن میں زیادہ صحیح یہ ہے کہ انہیں ضائع ہونے سے بچانے کے لیے بیچ دیا جائے، اور یہ کہ جو متولی نے مسجد کے لیے خریدا یا کسی نے ہبہ کیا وہ ملکیت ہونے کی وجہ سے ضرورت کے وقت بلا اختلاف بیچا جا سکتا ہے؛ اس نے مسجد کی چٹائیاں منتقل کرنے کے بارے میں بکری دمیاطی کا کلام بھی نقل کیا۔ اس نے کولروں کے حکم میں یہی فرق بیان کیا کہ وہ وقف ہیں یا مسجد کی ملکیت۔"
