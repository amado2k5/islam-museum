summary:
  ar: "الإعلام بالحروب الواقعة في صدر الإسلام لأبي الحجاج يوسف البياسي، جمعه للأمير أبي زكريا يحيى بن عبد الواحد الحفصي صاحب إفريقية، في مجلدين؛ ابتدأ فيه بمقتل عمر بن الخطاب وختمه بخروج الوليد بن طريف الشاري على هارون الرشيد ببلاد الجزيرة الفراتية، ورآه ابن خلكان وطالعه فوجد كلامه كلام عارف بهذا الفن، وبقيت منه قطعة محفوظة بدار الكتب المصرية {cite:wafayat-ayan p. 238}."
  en: "al-I'lam bil-Hurub al-Waqi'a fi Sadr al-Islam — al-Bayyasi's two-volume war history for the Hafsid amir Abu Zakariya Yahya, running from 'Umar's murder to al-Walid ibn Tarif's Jaziran revolt; Ibn Khallikan read it and judged it a craftsman's work {cite:wafayat-ayan p. 238}."
