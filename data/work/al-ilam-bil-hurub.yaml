label: { ar: "الإعلام بالحروب الواقعة في صدر الإسلام", en: "al-I'lam bil-Hurub al-Waqi'a fi Sadr al-Islam", ur: "العلم بل الحرب الواقعہ صدر الاسلام میں", tr: "Erken İslam'da gerçekleşen savaşlar hakkında medya", id: "Media tentang perang yang terjadi pada masa Islam awal" }
summary:
  ar: "الإعلام بالحروب الواقعة في صدر الإسلام لأبي الحجاج يوسف البياسي، جمعه للأمير أبي زكريا يحيى بن عبد الواحد الحفصي صاحب إفريقية، في مجلدين؛ ابتدأ فيه بمقتل عمر بن الخطاب وختمه بخروج الوليد بن طريف الشاري على هارون الرشيد ببلاد الجزيرة الفراتية، ورآه ابن خلكان وطالعه فوجد كلامه كلام عارف بهذا الفن، وبقيت منه قطعة محفوظة بدار الكتب المصرية {cite:wafayat-ayan p. 238}."
  en: "al-I'lam bil-Hurub al-Waqi'a fi Sadr al-Islam — al-Bayyasi's two-volume war history for the Hafsid amir Abu Zakariya Yahya, running from 'Umar's murder to al-Walid ibn Tarif's Jaziran revolt; Ibn Khallikan read it and judged it a craftsman's work {cite:wafayat-ayan p. 238}."
  es: "al-I'lam bil-Hurub al-Waqi'a fi Sadr al-Islam: la historia de guerra en dos volúmenes de al-Bayyasi para el emir hafsí Abu Zakariya Yahya, que va desde el asesinato de 'Umar hasta la revuelta de Jaziran de al-Walid ibn Tarif; Ibn Khallikan lo leyó y lo consideró obra de un artesano {cita:wafayat-ayan p. 238}."
  fr: "al-I'lam bil-Hurub al-Waqi'a fi Sadr al-Islam — l'histoire de guerre en deux volumes d'al-Bayyasi pour l'émir hafside Abu Zakariya Yahya, allant du meurtre d'Umar à la révolte de Jaziran d'al-Walid ibn Tarif; Ibn Khallikan l'a lu et l'a jugé comme un travail d'artisan {cite: wafayat-ayan p. 238}."
  ur: "الاعلام بل الحرب الواقعۃ فی صدر الاسلام - البیاسی کی دو جلدوں پر مشتمل جنگ کی تاریخ حفصید امیر ابو زکریا یحییٰ کے لیے، عمر کے قتل سے ولید بن طریف کی جزیران بغاوت تک؛ ابن خلیقان نے اسے پڑھا اور اسے ایک کاریگر کا کام قرار دیا۔ 238}۔"
  tr: "Ebu el-Hacı Yusuf el-Bayasi tarafından yazılmış El-I'lam bil Harub el-Vaqi'a fi Sadr el-İslam, İfrikiye'nin yazarı Prens Ebu Zekeriye Yahya bin Abd al-Wahid al-Hafsi tarafından iki cilt halinde derlenmiştir; Ömer bin el-Hattab'ın öldürülmesiyle başlamış ve Fırat yarımadası topraklarında Harun el-Reşid'e karşı al-Velid bin Tarif el-Şeri'nin ayaklanmasıyla sona ermiştir. İbn Hallikan bunu görmüş, incelemiş ve sözlerinin bu sanatın bir alimine ait olduğunu tespit etmiştir. Bunun bir parçası Mısır Ulusal Kütüphanesi'nde korunmaktadır {kaynak: wafayat-ayan, s. 238}."
  id: "Al-I'lam bil al-Harub al-Waqi'a fi Sadr al-Islam oleh Abu al-Hajjaj Yusuf al-Bayasi, disusun oleh Pangeran Abu Zakariya Yahya ibn Abd al-Wahid al-Hafsi, penulis Ifriqiya, dalam dua jilid; buku ini dimulai dengan pembunuhan Umar ibn al-Khattab dan diakhiri dengan pemberontakan al-Walid ibn Tarif al-Shari melawan Harun al-Rashid di tanah semenanjung Efrat. Ibn Khallikan melihat dan meninjaunya serta menemukan kata-katanya adalah milik seorang cendekiawan seni ini. Sebuah fragmen dari karya tersebut masih disimpan di Perpustakaan Nasional Mesir {cite:wafayat-ayan, hlm. 238}."
