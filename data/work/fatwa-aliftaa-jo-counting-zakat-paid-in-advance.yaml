id: work/fatwa-aliftaa-jo-counting-zakat-paid-in-advance
class: work
kind: fatwa
label: { ar: "احتساب الزكاة المعجلة عند تمام الحول", en: "Counting zakat paid in advance when the year is complete", ur: "سال پورا ہونے پر پیشگی ادا کی گئی زکات کا شمار", es: "Conteo del zakat pagado por adelantado cuando finaliza el año.", fr: "Le décompte de la zakat versée d'avance est effectué à la fin de l'année.", tr: "Yıl sonunda hızlandırılan zekat hesaplaması", id: "Perhitungan Zakat dipercepat pada akhir tahun" }
summary:
  ar: "سؤال عما إذا كان المال المعجل زكاةً يُحسب مع المال عند تمام الحول، أجابت فيه دائرة الإفتاء العام الأردنية بجواز تعجيل الزكاة بعد بلوغ النصاب، وبأن المعجل كالباقي في ملك المزكي فيكمل به النصاب ويُحسب له ما قدمه. أجابت الدائرة بأنه يجوز تعجيل الزكاة قبل حلول الحول وبعد بلوغ المال النصاب، خاصة إذا كان فيه مراعاة لمصلحة الفقراء، واستندت إلى حديث علي الذي رواه أبو داود في ترخيص النبي للعباس في تعجيل صدقته. ونقلت قول شمس الدين الرملي في نهاية المحتاج بجواز التعجيل في المال الحولي بعد انعقاد حوله ووجود النصاب، وبأن شرط إجزائه بقاء المالك أهلًا للوجوب والمال باقيًا إلى آخر الحول، وكون القابض مستحقًا عند آخره. وقالت إن المخرج المعجل قبل تمام الحول كالباقي على ملك المزكي، فإذا نقص المال عن النصاب عند تمام الحول وكان يبلغه بضم المعجل وجب ضمه إليه، ونقلت قول النووي في المجموع إن المعجل مضموم إلى ما عند الدافع في إتمام النصاب وفي الإجزاء. وخلصت إلى أن المال المعجل يُعامل كالباقي على ملك المزكي، فيكمل به النصاب ويُحسب له ما قدم."
  en: "A question about whether wealth already paid as advance zakat is counted with the rest of the wealth when the zakat year is complete, in which Jordan's General Iftaa Department answered that zakat may be paid early once the minimum is reached, and that the advance payment is treated as still in the payer's ownership, so it completes the minimum and is credited to him. The Department answered that zakat may be paid early, before the year is complete and after the wealth reaches the minimum, especially when doing so serves the interest of the poor, relying on the report of Ali, reported by Abu Dawud, that the Prophet allowed al-Abbas to pay his zakat early. It quoted Shams al-Din al-Ramli in Nihayat al-Muhtaj that advance payment is permitted for wealth subject to a yearly cycle once its year has begun and the minimum exists, and that it counts only if the owner remains liable and the wealth remains until the end of the year, and the recipient is still eligible at that point. It said that what is paid early before the year is complete is treated as if it were still in the payer's ownership, so if the wealth falls below the minimum at year end but would reach it with the advance amount added, the two must be combined, quoting al-Nawawi in al-Majmu that the advance payment is combined with what the payer holds both in completing the minimum and in counting as zakat. It concluded that the advance payment is treated as still owned by the payer, so it completes the minimum and what he paid is credited to him."
  ur: "اس سوال کے بارے میں کہ کیا پیشگی زکات کے طور پر دیا گیا مال سال پورا ہونے پر باقی مال کے ساتھ شمار ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نصاب پورا ہونے کے بعد زکات پیشگی دی جا سکتی ہے، اور پیشگی ادائیگی ایسے سمجھی جاتی ہے گویا وہ ادا کرنے والے کی ملکیت میں باقی ہے، لہٰذا اس سے نصاب پورا ہوتا ہے اور وہ اس کے حساب میں شمار ہوتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سال پورا ہونے سے پہلے اور مال کے نصاب کو پہنچنے کے بعد زکات پیشگی ادا کی جا سکتی ہے، خاص طور پر جب اس میں فقرا کا مفاد ہو؛ اس نے علی کی اس روایت پر انحصار کیا جسے ابو داود نے روایت کیا کہ نبی نے عباس کو اپنی زکات پیشگی دینے کی اجازت دی۔ اس نے نہایۃ المحتاج میں شمس الدین رملی کا قول نقل کیا کہ سالانہ مال میں سال شروع ہونے اور نصاب موجود ہونے کے بعد پیشگی ادائیگی جائز ہے، اور یہ اسی صورت میں معتبر ہے کہ مالک آخر سال تک وجوب کا اہل رہے، مال بھی باقی رہے، اور لینے والا اس وقت مستحق ہو۔ اس نے کہا کہ سال پورا ہونے سے پہلے پیشگی دیا گیا مال ایسے ہے گویا ادا کرنے والے کی ملکیت میں باقی ہے، لہٰذا اگر سال کے آخر میں مال نصاب سے کم ہو مگر پیشگی رقم ملانے سے نصاب پورا ہو جائے تو دونوں کو ملانا واجب ہے؛ اس نے المجموع میں نووی کا قول نقل کیا کہ پیشگی ادائیگی نصاب پورا کرنے اور زکات میں شمار ہونے دونوں میں ادا کرنے والے کے مال کے ساتھ ملائی جاتی ہے۔ اس نے نتیجہ نکالا کہ پیشگی ادا کیا گیا مال ادا کرنے والے کی ملکیت میں باقی سمجھا جاتا ہے، اس سے نصاب پورا ہوتا ہے اور جو اس نے دیا وہ اس کے حساب میں شمار ہوتا ہے۔"
  es: "Una pregunta sobre si la riqueza ya pagada como zakat anticipado se cuenta con el resto de la riqueza cuando se completa el año del zakat, a lo que el Departamento General de Iftaa de Jordania respondió que el zakat puede pagarse anticipadamente una vez alcanzado el mínimo, y que el pago anticipado se considera todavía propiedad del pagador, por lo que completa el mínimo y se le acredita. El Departamento respondió que el zakat puede pagarse anticipadamente, antes de que termine el año y después de que la riqueza alcance el mínimo, especialmente cuando hacerlo sirve al interés de los pobres, basándose en el relato de Ali, transmitido por Abu Dawud, de que el Profeta permitió a al-Abbas pagar su zakat anticipadamente. Citó a Shams al-Din al-Ramli en Nihayat al-Muhtaj que el pago anticipado está permitido para la riqueza sujeta a un ciclo anual una vez que ha comenzado su año y existe el mínimo, y que cuenta solo si el propietario sigue siendo responsable y la riqueza permanece hasta el final del año, y el receptor todavía es elegible en ese momento. Se indicó que lo pagado antes de que finalice el año se considera propiedad del pagador; por lo tanto, si el patrimonio cae por debajo del mínimo al final del año, pero lo alcanzaría con el monto del anticipo, ambos deben combinarse. Citando a al-Nawawi en al-Majmu, se afirma que el pago anticipado se combina con lo que el pagador posee tanto para completar el mínimo como para el cálculo del zakat. Se concluyó que el pago anticipado se considera propiedad del pagador, por lo que completa el mínimo y lo que pagó le es acreditado."
  fr: "Concernant la question de savoir si les biens déjà versés à titre d'acompte sur la zakat sont pris en compte avec le reste du patrimoine à la fin de l'année de zakat, le Département général de la jurisprudence jordanienne (Iftaa) a répondu que la zakat peut être versée de manière anticipée dès que le seuil minimal est atteint. Le versement anticipé est alors considéré comme restant la propriété du payeur, complétant ainsi le seuil minimal et lui étant crédité. Le Département a précisé que la zakat peut être versée de manière anticipée, avant la fin de l'année et après que le patrimoine a atteint le seuil minimal, notamment lorsque cela sert les intérêts des pauvres. Il s'appuie sur un hadith rapporté par Abou Dawoud, selon lequel le Prophète a autorisé al-Abbas à verser sa zakat de manière anticipée. Le Département cite également Shams al-Din al-Ramli dans son ouvrage Nihayat al-Muhtaj, qui stipule que le versement anticipé est permis pour les biens soumis à un cycle annuel une fois que l'année a commencé et que le seuil minimal est atteint. Ce versement anticipé n'est pris en compte que si le propriétaire demeure redevable de la zakat, que le patrimoine reste en sa possession jusqu'à la fin de l'année et que le bénéficiaire remplit toujours les conditions requises à ce moment-là. Il est précisé que les sommes versées en avance, avant la fin de l'année, sont considérées comme appartenant toujours au payeur. Ainsi, si le patrimoine du payeur tombe en dessous du seuil minimal en fin d'année, mais l'atteindrait une fois l'acompte versé, les deux montants doivent être cumulés. Al-Nawawi, cité dans al-Majmu, explique que l'acompte est ajouté au patrimoine du payeur, à la fois pour atteindre le seuil minimal et pour le calcul de la zakat. En conclusion, l'acompte est considéré comme appartenant toujours au payeur; il permet donc d'atteindre le seuil minimal et le montant versé lui est crédité."
  tr: "Hızlandırılmış servetin zekat olarak kabul edilip yıl sonunda elde edilen servetle hesaplanıp hesaplanmadığına dair bir soruya gelince, Ürdün Genel Fetva Dairesi, nisaba ulaştıktan sonra zekatın hızlandırılmasının mümkün olduğunu ve hızlandırılan miktarın zekat ödeyenin elindeki diğerleriyle aynı olduğunu belirtti; bu nedenle nisab tamamlanmış ve katkı edilenlerin de öyle sayılır. Daire, ay yılından önce ve servet nisaba ulaştıktan sonra zekatın hızlandırılmasının caiz olduğunu, özellikle yoksulların çıkarları dikkate alındığında izin verdiğini yanıtladı. Şöyle dayanıyordu ki, bu da Ebu Davud'un Peygamber'in Abbas'ın yardımını hızlandırması için izin verdiği Ali hadisindedir. Nihayat al-Muhtaj'da Şemseddin el-Ramli'nin yıl tamamlandıktan ve nisabın varlığından sonra yıllık servetin hızlandırılmasının caiz olduğuna dair ifadesinden alıntı yapar ve ödemenin şartının sahibinin yükümlülüğe uygun kalması, servetin yıl sonuna kadar kalması ve tahsildarın yıl sonunda hak sahibi olması olduğu belirtilir. Yıl bitmeden önce hızlandırılmış çıkışın, zekat mülkiyetinin geri kalanına benzer olduğu belirtildi; eğer para yıl sonunda nisaba ulaşmazsa ve yıl sonunda nisab ona damma ile ulaşırsa, buna eklenmelidir. Al-Majmu'da Al-Nawawi'nin ifadesini aktardım; hızlandırılmış kalem, maksadın nisabı tamamlamak ve tazminattaki paraya eklenir. Hızlandırılmış paranın zekat toplayıcısının malındaki kalan para gibi kabul edildiği, böylece nisabın tamamlandığı ve ona daha önce kendisine aktarılan paranın olduğu sonucuna varıldı."
  id: "Pertanyaan tentang apakah kekayaan yang dipercepat dianggap sebagai zakat dan dihitung dengan kekayaan pada akhir tahun, Departemen Fatwa Umum Yordania menjawab bahwa diperbolehkan mempercepat zakat setelah mencapai nisab, dan jumlah yang dipercepat sama seperti sisanya yang dimiliki pembayar zakat, sehingga nisab diselesaikan dan apa yang disumbangkan dihitung sebagai demikian. Departemen menjawab bahwa diperbolehkan mempercepat zakat sebelum tahun lunar dan setelah kekayaan mencapai nisab, terutama jika mempertimbangkan kepentingan orang miskin. edisi tentang hadits Ali yang diceritakan oleh Abu Dawood tentang izin Nabi bagi Abbas untuk mempercepat amalnya. Edisi tersebut mengutip pernyataan Shams al-Din al-Ramli dalam Nihayat al-Muhtaj mengenai diperbolehkannya mempercepat kekayaan tahunan setelah tahun selesai dan keberadaan nisab, serta syarat penyalurannya adalah pemilik tetap memenuhi syarat untuk kewajiban dan kekayaan tetap ada hingga akhir tahun, dan pemungut berhak pada akhir tahun. Dinyatakan bahwa percepatan keluar sebelum tahun selesai adalah seperti sisa kepemilikan zakat; jika uang tersebut kurang dari nisab pada akhir tahun dan dia mendapatkannya dengan damma pada yang dipercepat, maka harus ditambahkan ke dalamnya. Saya mengutip pernyataan Al-Nawawi dalam Al-Majmu' bahwa barang yang dipercepat ditambahkan ke apa yang dimiliki pembayar dalam menyelesaikan nisab dan dalam kompensasi. Kesimpulan itu bahwa uang yang dipercepat diperlakukan seperti sisa dalam properti pengumpul zakat, sehingga nisab diselesaikan dan apa yang sebelumnya telah dikreditkan kepadanya."
