id: work/fatwa-aliftaa-jo-counting-zakat-paid-in-advance
class: work
kind: fatwa
label: { ar: "احتساب الزكاة المعجلة عند تمام الحول", en: "Counting zakat paid in advance when the year is complete", ur: "سال پورا ہونے پر پیشگی ادا کی گئی زکات کا شمار" }
summary:
  ar: "سؤال عما إذا كان المال المعجل زكاةً يُحسب مع المال عند تمام الحول، أجابت فيه دائرة الإفتاء العام الأردنية بجواز تعجيل الزكاة بعد بلوغ النصاب، وبأن المعجل كالباقي في ملك المزكي فيكمل به النصاب ويُحسب له ما قدمه. أجابت الدائرة بأنه يجوز تعجيل الزكاة قبل حلول الحول وبعد بلوغ المال النصاب، خاصة إذا كان فيه مراعاة لمصلحة الفقراء، واستندت إلى حديث علي الذي رواه أبو داود في ترخيص النبي للعباس في تعجيل صدقته. ونقلت قول شمس الدين الرملي في نهاية المحتاج بجواز التعجيل في المال الحولي بعد انعقاد حوله ووجود النصاب، وبأن شرط إجزائه بقاء المالك أهلًا للوجوب والمال باقيًا إلى آخر الحول، وكون القابض مستحقًا عند آخره. وقالت إن المخرج المعجل قبل تمام الحول كالباقي على ملك المزكي، فإذا نقص المال عن النصاب عند تمام الحول وكان يبلغه بضم المعجل وجب ضمه إليه، ونقلت قول النووي في المجموع إن المعجل مضموم إلى ما عند الدافع في إتمام النصاب وفي الإجزاء. وخلصت إلى أن المال المعجل يُعامل كالباقي على ملك المزكي، فيكمل به النصاب ويُحسب له ما قدم."
  en: "A question about whether wealth already paid as advance zakat is counted with the rest of the wealth when the zakat year is complete, in which Jordan's General Iftaa Department answered that zakat may be paid early once the minimum is reached, and that the advance payment is treated as still in the payer's ownership, so it completes the minimum and is credited to him. The Department answered that zakat may be paid early, before the year is complete and after the wealth reaches the minimum, especially when doing so serves the interest of the poor, relying on the report of Ali, reported by Abu Dawud, that the Prophet allowed al-Abbas to pay his zakat early. It quoted Shams al-Din al-Ramli in Nihayat al-Muhtaj that advance payment is permitted for wealth subject to a yearly cycle once its year has begun and the minimum exists, and that it counts only if the owner remains liable and the wealth remains until the end of the year, and the recipient is still eligible at that point. It said that what is paid early before the year is complete is treated as if it were still in the payer's ownership, so if the wealth falls below the minimum at year end but would reach it with the advance amount added, the two must be combined, quoting al-Nawawi in al-Majmu that the advance payment is combined with what the payer holds both in completing the minimum and in counting as zakat. It concluded that the advance payment is treated as still owned by the payer, so it completes the minimum and what he paid is credited to him."
  ur: "اس سوال کے بارے میں کہ کیا پیشگی زکات کے طور پر دیا گیا مال سال پورا ہونے پر باقی مال کے ساتھ شمار ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نصاب پورا ہونے کے بعد زکات پیشگی دی جا سکتی ہے، اور پیشگی ادائیگی ایسے سمجھی جاتی ہے گویا وہ ادا کرنے والے کی ملکیت میں باقی ہے، لہٰذا اس سے نصاب پورا ہوتا ہے اور وہ اس کے حساب میں شمار ہوتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سال پورا ہونے سے پہلے اور مال کے نصاب کو پہنچنے کے بعد زکات پیشگی ادا کی جا سکتی ہے، خاص طور پر جب اس میں فقرا کا مفاد ہو؛ اس نے علی کی اس روایت پر انحصار کیا جسے ابو داود نے روایت کیا کہ نبی نے عباس کو اپنی زکات پیشگی دینے کی اجازت دی۔ اس نے نہایۃ المحتاج میں شمس الدین رملی کا قول نقل کیا کہ سالانہ مال میں سال شروع ہونے اور نصاب موجود ہونے کے بعد پیشگی ادائیگی جائز ہے، اور یہ اسی صورت میں معتبر ہے کہ مالک آخر سال تک وجوب کا اہل رہے، مال بھی باقی رہے، اور لینے والا اس وقت مستحق ہو۔ اس نے کہا کہ سال پورا ہونے سے پہلے پیشگی دیا گیا مال ایسے ہے گویا ادا کرنے والے کی ملکیت میں باقی ہے، لہٰذا اگر سال کے آخر میں مال نصاب سے کم ہو مگر پیشگی رقم ملانے سے نصاب پورا ہو جائے تو دونوں کو ملانا واجب ہے؛ اس نے المجموع میں نووی کا قول نقل کیا کہ پیشگی ادائیگی نصاب پورا کرنے اور زکات میں شمار ہونے دونوں میں ادا کرنے والے کے مال کے ساتھ ملائی جاتی ہے۔ اس نے نتیجہ نکالا کہ پیشگی ادا کیا گیا مال ادا کرنے والے کی ملکیت میں باقی سمجھا جاتا ہے، اس سے نصاب پورا ہوتا ہے اور جو اس نے دیا وہ اس کے حساب میں شمار ہوتا ہے۔"
