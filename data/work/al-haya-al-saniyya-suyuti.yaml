id: work/al-haya-al-saniyya-suyuti
class: work
kind: treatise
label: { ar: "الهيئة السنية في الهيئة السنية", en: "al-Hay'a al-saniyya fi al-hay'a al-sunniyya (The Radiant Cosmography)", ur: "الہیئۃ السنیہ فی الہیئۃ السنیہ" }
summary:
  ar: "رسالة جمع فيها جلال الدين السيوطي ⁦(849–911هـ)⁩ ما ورد في الآثار عن العرش والكرسي واللوح والقلم والسماوات والأرضين والشمس والقمر والنجوم والليل والنهار والمياه والرياح والسحاب والرعد والبرق والمجرة وقوس قزح والزلازل والجبال والبحار والنيل، في ثلاثة عشر بابًا، وانتشرت انتشارًا واسعًا {cite:heinen-islamic-cosmology p. 19} {cite:heinen-islamic-cosmology p. 139}."
  en: "A treatise in which Jalal al-Din al-Suyuti (849–911 AH) collected traditional reports on the Throne and Footstool, the Tablet and Pen, the heavens and earths, sun, moon and stars, night and day, waters and winds, clouds and rain, thunder and lightning, the Milky Way and rainbow, earthquakes, mountains, seas and the Nile, in thirteen chapters; it circulated very widely {cite:heinen-islamic-cosmology p. 19} {cite:heinen-islamic-cosmology p. 139}."
  ur: "جلال الدین سیوطی (849–911ھ) کا رسالہ جس میں عرش و کرسی، لوح و قلم، آسمان و زمین، سورج چاند ستارے، رات دن، پانی و ہوا، بادل و بارش، رعد و برق، کہکشاں و قوس قزح، زلزلے، پہاڑ، سمندر اور نیل کے بارے میں آثار تیرہ ابواب میں جمع ہیں؛ بہت وسیع پیمانے پر پھیلا {cite:heinen-islamic-cosmology p. 139}."
