issue:
  ar: "ما منزلة «الهيئة السنية» من تاريخ العلم عند المسلمين؟"
  en: "What place does al-Suyuti's tradition-based cosmology hold in the history of science among Muslims?"
perspectives:
  - tradition: sunni
    id: suyuti
    standing: main
    stance: { ar: "هيئة مأخوذة من الآثار للاعتبار", en: "A cosmography drawn from the traditions, for reflection" }
    summary:
      ar: "يقول السيوطي في مقدمته إنه جمع الكتاب من الآثار وبناه على الأخبار المأثورة، ليفرح به أولو الألباب ويعتبر أولو الأبصار؛ ويذكر عن نفسه، كما ينقل هاينن، أنه نشأ على حب السنة والحديث وبغض البدع وعلوم الأوائل كالفلسفة والمنطق."
      en: "Al-Suyuti says in his preface that he compiled the book from the traditions and based it on the transmitted reports so that the intelligent might rejoice and those with eyes take heed; he says of himself, as Heinen quotes, that he grew up loving the Sunna and hadith and hating innovation and the sciences of the ancients such as philosophy and logic."
    holders: [person/al-suyuti]
    sources: [source/heinen-islamic-cosmology]
  - tradition: academic
    id: heinen
    standing: secondary
    stance: { ar: "عرض شائع رافق ركود العلوم ولم يكن سببه", en: "A popular statement that accompanied the stagnation of the sciences rather than causing it" }
    summary:
      ar: "يرى أنطون هاينن أن الكتاب أعاد آراء المسلمين الأوائل في الكون في زمن أفكار فلكية جديدة، وأنه ربما صرف بعض الطلاب عن العلوم، لكنه يرى من الخطأ جعل السيوطي رمزًا لرفض لاهوتي للعلوم، لأن الركود أصاب اللاهوت والعلم معًا وكان الكتاب تعبيرًا عن اتجاهات عصره؛ ويلاحظ أن السيوطي ميّز بين الفلسفة والمنطق اللذين ذمهما وبين الهيئة والميقات اللذين لم يذمهما."
      en: "Anton Heinen holds that the book reinstated early Muslim cosmological views at a time of new astronomical ideas and may have discouraged some students from the sciences, but that it would be wrong to make al-Suyuti the figurehead of a theological rejection of science, since stagnation affected theology and science alike and the book expressed the tendencies of its period; he notes that al-Suyuti distinguished philosophy and logic, which he condemned, from astronomy and timekeeping, which he did not."
    sources: [source/heinen-islamic-cosmology]
