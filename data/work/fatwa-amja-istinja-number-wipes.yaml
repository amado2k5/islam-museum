id: work/fatwa-amja-istinja-number-wipes
class: work
kind: fatwa
label: { ar: "عدد الاستنجاء", en: "A set number for istinja — the three-wipe rule", ur: "استنجاء کی تعداد — تین مسح", es: "Un número fijo para istinja: la regla de los tres lavados", fr: "Un nombre fixe pour istinja — la règle des trois essuyages", tr: "Istinja' sayısı (Ritüel sonrası temizlik", id: "Jumlah Istinja' (Pembersihan setelah Ritual" }
summary:
  ar: "سأل سائل هل للاستنجاء عدد معين كالاستجمار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82017 بتاريخ 2 أغسطس 2010)⁩ أن العدد إنما يشترط في الأحجار فقط وهو ثلاث مسحات فإن لم يحصل الإنقاء بها زاد عليها حتى يحصل الإنقاء، ومن أهل العلم كالحنفية والمالكية من اعتبر أن العبرة بالإنقاء فإن حصل بما دون الثلاث أجزأه ويصبح ما زاد عن الإنقاء ندبًا على ما فصّل الجواب."
  en: "A questioner asked whether istinja has a set number like istijmar. Dr. Salah al-Sawi (fatwa no. 82017, 2 August 2010) answered that the number is required only of the stones — three wipes, and if they do not achieve cleansing he adds until cleansing is had; some scholars, as the Hanafis and Malikis, hold the measure is cleansing itself — if achieved short of three it suffices, and what exceeds the cleansing is recommended — as the answer details."
  ur: "استنجاء کی مقدار؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82017، 2 اگست 2010)⁩ کے مطابق تعداد صرف پتھروں کے لیے تین ہے؛ حنفی مالکی تنقیر کو کافی مانتے ہیں۔"
  es: "Un consultante preguntó si el istinja tiene un número fijo como el istijmar. El Dr. Salah al-Sawi (fatwa n.° 82017, 2 de agosto de 2010) respondió que el número requerido es solo de las piedras: tres pasadas, y si no se logra la purificación, se añaden más hasta conseguirla; algunos eruditos, como los hanafíes y los malikíes, sostienen que la medida es la purificación misma: si se logra con menos de tres pasadas, es suficiente, y lo que exceda la purificación es recomendable, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'istinja, comme l'istijmar, nécessitait un nombre précis de passages. Le Dr Salah al-Sawi (fatwa n° 82017, 2 août 2010) a répondu que ce nombre ne concernait que le nombre de passages sur les pierres – trois, et si la purification n'était pas complète, il fallait en ajouter jusqu'à obtention d'une purification complète. Certains savants, comme les Hanafites et les Malikites, considèrent que la purification elle-même est la mesure: si elle est obtenue en moins de trois passages, cela suffit, et tout passage supplémentaire est recommandé, comme le précise la réponse."
  tr: "Bir soru soran kişi, temizlik (ististijmar) için özel bir sayı olup olmadığını sordu. Dr. Salah Al-Sawy (2 Ağustos 2010 tarihli Fetva No. 82017) bu sayının sadece taşlar için gerekli olduğunu, yani üç silme olduğunu yanıtladı. Arınma sağlanmazsa, saflık sağlanana kadar buna ekler. Hanafiler ve Maliki gibi alimler, saflığın anahtarının, üçten az bulunursa yeterli olması ve arınmanın ötesinin tavsiye haline gelmesi olduğunu savunur; bu da cevapta detaylandırılmıştır."
  id: "Seorang penanya bertanya apakah ada angka khusus untuk istinjar (ististijmar) untuk pembersihan (ististijmar). Dr. Salah Al-Sawy menjawab (Fatwa No. 82017 tanggal 2 Agustus 2010) bahwa angka tersebut hanya diperlukan untuk batu, yaitu tiga tipu. Jika pemurnian tidak tercapai, ia menambahkannya hingga kemurnian tercapai. Para ulama seperti Hanafi dan Malikus berpendapat bahwa kunci kemurnian adalah jika ditemukan kurang dari tiga, itu sudah cukup, dan apa yang melebihi pemurnian menjadi rekomendasi, seperti yang dijelaskan dalam jawaban."
