id: work/fatwa-amja-istinja-number-wipes
class: work
kind: fatwa
label: { ar: "عدد الاستنجاء", en: "A set number for istinja — the three-wipe rule", ur: "استنجاء کی تعداد — تین مسح" }
summary:
  ar: "سأل سائل هل للاستنجاء عدد معين كالاستجمار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82017 بتاريخ 2 أغسطس 2010)⁩ أن العدد إنما يشترط في الأحجار فقط وهو ثلاث مسحات فإن لم يحصل الإنقاء بها زاد عليها حتى يحصل الإنقاء، ومن أهل العلم كالحنفية والمالكية من اعتبر أن العبرة بالإنقاء فإن حصل بما دون الثلاث أجزأه ويصبح ما زاد عن الإنقاء ندبًا على ما فصّل الجواب."
  en: "A questioner asked whether istinja has a set number like istijmar. Dr. Salah al-Sawi (fatwa no. 82017, 2 August 2010) answered that the number is required only of the stones — three wipes, and if they do not achieve cleansing he adds until cleansing is had; some scholars, as the Hanafis and Malikis, hold the measure is cleansing itself — if achieved short of three it suffices, and what exceeds the cleansing is recommended — as the answer details."
  ur: "استنجاء کی مقدار؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82017، 2 اگست 2010)⁩ کے مطابق تعداد صرف پتھروں کے لیے تین ہے؛ حنفی مالکی تنقیر کو کافی مانتے ہیں۔"
