id: work/fatwa-aliftaa-jo-following-an-imam-through-television
class: work
kind: fatwa
label: { ar: "الاقتداء بالإمام عبر التلفاز", en: "Following an imam through television", ur: "ٹیلی ویژن کے ذریعے امام کی اقتدا", es: "Siguiendo a un imán a través de la televisión", fr: "Suivre un imam à la télévision", tr: "Televizyonda İmam'ı takip etmek", id: "Mengikuti Imam di televisi" }
summary:
  ar: "سؤال عن الاقتداء بالإمام عبر التلفاز، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يصح لأن من شروط الاقتداء اجتماع الإمام والمأموم في مكان واحد، ويصح إن كان معه في المسجد نفسه. أجابت الدائرة بأن من شروط صحة الاقتداء أن يكون الإمام والمأموم في مكان واحد. وقالت إنه لذلك لا تصح صلاة من يقتدي بإمام تنقل صلاته بالتلفاز من مكان بعيد، أما إن كان معه في المسجد نفسه فتصح."
  en: "A question about following an imam through television, in which Jordan's General Iftaa Department answered that it is not valid, because following an imam requires the imam and follower to be in one place, though it is valid if he is in the same mosque. The Department answered that one of the conditions for validly following an imam is that the imam and the follower be in one place. It said that the prayer of someone following an imam whose prayer is broadcast on television from a distant place is therefore not valid, but it is valid if he is with the imam in the same mosque."
  ur: "ٹیلی ویژن کے ذریعے امام کی اقتدا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ درست نہیں کیونکہ اقتدا کے لیے امام اور مقتدی کا ایک جگہ ہونا شرط ہے، البتہ اگر وہ اسی مسجد میں ہو تو درست ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اقتدا کے درست ہونے کی شرائط میں سے ہے کہ امام اور مقتدی ایک جگہ ہوں۔ اس نے کہا کہ اس لیے دور جگہ سے ٹیلی ویژن پر نشر ہونے والی نماز کے امام کی اقتدا کرنے والے کی نماز درست نہیں، البتہ اگر وہ امام کے ساتھ اسی مسجد میں ہو تو درست ہے۔"
  es: "Ante una pregunta sobre seguir a un imán por televisión, el Departamento General de Iftaa de Jordania respondió que no es válido, ya que seguir a un imán requiere que tanto el imán como el seguidor se encuentren en el mismo lugar, aunque sí es válido si están en la misma mezquita. El Departamento explicó que una de las condiciones para seguir válidamente a un imán es que ambos estén presentes. Añadió que la oración de alguien que sigue a un imán cuya oración se transmite por televisión desde un lugar distante no es válida, pero sí lo es si se encuentra con el imán en la misma mezquita."
  fr: "Une question concernant le fait de suivre un imam à la télévision a été posée. Le Département général de la Iftaa en Jordanie a répondu que cela n'est pas valable, car suivre un imam requiert que l'imam et le fidèle se trouvent au même endroit. Toutefois, la prière est valable si le fidèle se trouve dans la même mosquée. Le Département a expliqué que l'une des conditions de validité est justement que l'imam et le fidèle soient présents au même endroit. Par conséquent, la prière d'une personne suivant un imam dont la prière est retransmise à la télévision depuis un lieu éloigné n'est pas valable, contrairement à celle d'une personne se trouvant avec l'imam dans la même mosquée."
  tr: "Televizyon yoluyla imamı takip etmekle ilgili bir soruya Ürdün Genel Fetva Dairesi, taklit için koşullardan birinin imam ile takipçinin aynı yerde buluşması olduğunu ve aynı camide birlikte olmaları durumunda geçerli olduğunu yanıtladı. Daire, taklitin geçerliliği için koşullardan birinin imam ile takipçinin aynı yerde olması olduğunu belirtti. Bu nedenle, bir imamı takip eden birinin namazının uzak bir yerden televizyonda yayınlanması halinde geçerli olmadığını, ancak aynı camide onunla birlikte olması geçerli olduğunu belirtti."
  id: "Sebuah pertanyaan tentang mengikuti imam melalui televisi, di mana Departemen Fatwa Umum Yordania menjawab bahwa itu tidak berlaku karena salah satu syarat peniruan adalah imam dan pengikutnya bertemu di tempat yang sama, dan itu berlaku jika mereka bersamanya di masjid yang sama. Departemen menjawab bahwa salah satu syarat keabsahan penirungan adalah imam dan pengikut berada di tempat yang sama. Mereka mengatakan bahwa oleh karena itu, shalat seseorang yang mengikuti imam tidak sah jika shalatnya disiarkan di televisi dari tempat jauh, tetapi jika dia bersama imam di masjid yang sama, itu sah."
