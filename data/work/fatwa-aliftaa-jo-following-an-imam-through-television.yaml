id: work/fatwa-aliftaa-jo-following-an-imam-through-television
class: work
kind: fatwa
label: { ar: "الاقتداء بالإمام عبر التلفاز", en: "Following an imam through television", ur: "ٹیلی ویژن کے ذریعے امام کی اقتدا" }
summary:
  ar: "سؤال عن الاقتداء بالإمام عبر التلفاز، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يصح لأن من شروط الاقتداء اجتماع الإمام والمأموم في مكان واحد، ويصح إن كان معه في المسجد نفسه. أجابت الدائرة بأن من شروط صحة الاقتداء أن يكون الإمام والمأموم في مكان واحد. وقالت إنه لذلك لا تصح صلاة من يقتدي بإمام تنقل صلاته بالتلفاز من مكان بعيد، أما إن كان معه في المسجد نفسه فتصح."
  en: "A question about following an imam through television, in which Jordan's General Iftaa Department answered that it is not valid, because following an imam requires the imam and follower to be in one place, though it is valid if he is in the same mosque. The Department answered that one of the conditions for validly following an imam is that the imam and the follower be in one place. It said that the prayer of someone following an imam whose prayer is broadcast on television from a distant place is therefore not valid, but it is valid if he is with the imam in the same mosque."
  ur: "ٹیلی ویژن کے ذریعے امام کی اقتدا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ درست نہیں کیونکہ اقتدا کے لیے امام اور مقتدی کا ایک جگہ ہونا شرط ہے، البتہ اگر وہ اسی مسجد میں ہو تو درست ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اقتدا کے درست ہونے کی شرائط میں سے ہے کہ امام اور مقتدی ایک جگہ ہوں۔ اس نے کہا کہ اس لیے دور جگہ سے ٹیلی ویژن پر نشر ہونے والی نماز کے امام کی اقتدا کرنے والے کی نماز درست نہیں، البتہ اگر وہ امام کے ساتھ اسی مسجد میں ہو تو درست ہے۔"
