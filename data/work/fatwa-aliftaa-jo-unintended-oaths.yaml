id: work/fatwa-aliftaa-jo-unintended-oaths
class: work
kind: fatwa
label: { ar: "يمين اللغو", en: "Unintended oaths (yamin al-laghw)", ur: "لغو قسم" }
summary:
  ar: "سؤال عن يمين اللغو، أجابت فيه دائرة الإفتاء العام الأردنية بأن من حلف بالله غير قاصد اليمين ولم يعزم على عقدها فلا شيء عليه، مع النهي عن الإكثار من الحلف. أجابت الدائرة بأن من حلف بالله غير قاصد اليمين ولم يعزم على عقدها فلا شيء عليه، واستشهدت بـ[[passage/quran-2-225|سورة البقرة 2:225]]. وقالت إن على المسلم ألا يكثر من الحلف كي لا يعتاده لسانه، واستشهدت بـ[[passage/quran-2-224|سورة البقرة 2:224]]."
  en: "A question about unintended oaths (yamin al-laghw), in which Jordan's General Iftaa Department answered that whoever swears by God without intending an oath or resolving to bind himself owes nothing, while one should not swear often. The Department answered that whoever swears by God without intending an oath and without resolving to bind himself to it owes nothing, citing [[passage/quran-2-225|Surat al-Baqara 2:225]]. It said a Muslim should not swear often, so that his tongue does not become used to it, citing [[passage/quran-2-224|Surat al-Baqara 2:224]]."
  ur: "لغو قسم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو قسم کے ارادے اور پختہ عزم کے بغیر اللہ کی قسم کھائے اس پر کچھ نہیں، البتہ کثرت سے قسم نہ کھائی جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو اللہ کی قسم کھائے مگر قسم کا ارادہ نہ ہو اور اسے پختہ کرنے کا عزم نہ ہو، اس پر کچھ نہیں، اور [[passage/quran-2-225|سورۃ البقرہ 2:225]] کا حوالہ دیا۔ اس نے کہا کہ مسلمان کثرت سے قسمیں نہ کھائے تاکہ اس کی زبان اس کی عادی نہ ہو جائے، اور [[passage/quran-2-224|سورۃ البقرہ 2:224]] کا حوالہ دیا۔"
