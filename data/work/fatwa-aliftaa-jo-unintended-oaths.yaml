id: work/fatwa-aliftaa-jo-unintended-oaths
class: work
kind: fatwa
label: { ar: "يمين اللغو", en: "Unintended oaths (yamin al-laghw)", ur: "لغو قسم", es: "Juramentos involuntarios (yamin al-laghw)", fr: "Serments involontaires (yamin al-laghw)", tr: "Dilin sağ kısmı", id: "Kanan lidah" }
summary:
  ar: "سؤال عن يمين اللغو، أجابت فيه دائرة الإفتاء العام الأردنية بأن من حلف بالله غير قاصد اليمين ولم يعزم على عقدها فلا شيء عليه، مع النهي عن الإكثار من الحلف. أجابت الدائرة بأن من حلف بالله غير قاصد اليمين ولم يعزم على عقدها فلا شيء عليه، واستشهدت بـ[[passage/quran-2-225|سورة البقرة 2:225]]. وقالت إن على المسلم ألا يكثر من الحلف كي لا يعتاده لسانه، واستشهدت بـ[[passage/quran-2-224|سورة البقرة 2:224]]."
  en: "A question about unintended oaths (yamin al-laghw), in which Jordan's General Iftaa Department answered that whoever swears by God without intending an oath or resolving to bind himself owes nothing, while one should not swear often. The Department answered that whoever swears by God without intending an oath and without resolving to bind himself to it owes nothing, citing [[passage/quran-2-225|Surat al-Baqara 2:225]]. It said a Muslim should not swear often, so that his tongue does not become used to it, citing [[passage/quran-2-224|Surat al-Baqara 2:224]]."
  ur: "لغو قسم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو قسم کے ارادے اور پختہ عزم کے بغیر اللہ کی قسم کھائے اس پر کچھ نہیں، البتہ کثرت سے قسم نہ کھائی جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو اللہ کی قسم کھائے مگر قسم کا ارادہ نہ ہو اور اسے پختہ کرنے کا عزم نہ ہو، اس پر کچھ نہیں، اور [[passage/quran-2-225|سورۃ البقرہ 2:225]] کا حوالہ دیا۔ اس نے کہا کہ مسلمان کثرت سے قسمیں نہ کھائے تاکہ اس کی زبان اس کی عادی نہ ہو جائے، اور [[passage/quran-2-224|سورۃ البقرہ 2:224]] کا حوالہ دیا۔"
  es: "Una pregunta sobre juramentos involuntarios (yamin al-laghw), en la que el Departamento General de Iftaa de Jordania respondió que quien jura por Dios sin intención de jurar ni de comprometerse a ello no debe nada, y que no se debe jurar con frecuencia. El Departamento respondió que quien jura por Dios sin intención de jurar y sin comprometerse a ello no debe nada, citando [[passage/quran-2-225|Surat al-Baqara 2:225]]. Dijo que un musulmán no debe jurar con frecuencia, para que su lengua no se acostumbre a ello, citando [[passage/quran-2-224|Surat al-Baqara 2:224]]."
  fr: "Une question relative aux serments involontaires (yamin al-laghw) a été posée par le Département général de la Ifta en Jordanie. Ce dernier a répondu que quiconque jure par Dieu sans intention de prêter serment ni résolution de s'y engager n'est redevable d'aucun engagement, et qu'il est déconseillé de jurer fréquemment. Le Département a précisé que quiconque jure par Dieu sans intention de prêter serment ni résolution de s'y engager n'est redevable d'aucun engagement, citant le verset 225 de la sourate Al-Baqara (2:225). Il a également été indiqué qu'un musulman ne doit pas jurer fréquemment afin de ne pas s'y habituer, citant le verset 224 de la sourate Al-Baqara (2:224)."
  tr: "Yürdün Genel Fetva Dairesi, Allah'a yemin eden ve yemin etmek istemeden yemin eden kişinin üzerinde hiçbir şey yoktur diye yanıt verdiği ve aşırı yemin etmeyi yasakladığı bir soruya cevap vermiştir. Daire, Allah'a yemin eden ve yemin etmeyi düşünmeden yemin eden kişinin üzerinde hiçbir şey olmadığını belirtti ve [[pasaj/kuran-2-225|Bakara Suresi 2:225]]'yi aktardı. Bir Müslümanın, dilini alışmamak için aşırı yemin etmemesi gerektiği belirtildi ve [[pasaj/kuran-2-224|Bakara Suresi 2:224]] alıntılandı."
  id: "Sebuah pertanyaan tentang sumpah penolakan palsu, di mana Departemen Fatwa Umum Yordania menjawab bahwa siapa pun yang bersumpah kepada Allah tanpa bermaksud mengucapkan sumpah dan tidak berniat mengucapkannya, tidak ada beban, sementara melarang sumpah berlebihan. Departemen menjawab bahwa siapa pun yang bersumpah kepada Allah tanpa bermaksud mengucapkan sumpah dan tidak berniat mengucapkannya, tidak ada beban, dengan mengutip [[ayat/al-quran-2-225|Surah Al-Baqarah 2:225]]. Dikatakan bahwa seorang Muslim tidak boleh bersumpah berlebihan agar tidak terbiasa dengan lidahnya, dengan mengutip [[ayat/al-quran-2-224|Surah Al-Baqarah 2:224]]."
