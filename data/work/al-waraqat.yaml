summary:
  ar: "الورقات في أصول الفقه لإمام الحرمين الجويني ⁦(ت. 478هـ)⁩ نثرية قصيرة جمعت أبواب أصول الفقه في ورقتين: الأقسام والأمر والنهي والعام والخاص والمجمل والمبين والظاهر والمؤول والأفعال والمقصود والناسخ والمنسوخ والإجماع والخبر والقياس والاجتهاد والتقليد وترتيب الدلائل والإفتاء والاستفتاء؛ أول متون الأصول درساً {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Al-Waraqat in usul al-fiqh by Imam al-Haramayn al-Juwayni (d. 478 AH) — a two-page primer gathering the headings of legal theory: divisions, command and prohibition, the general and the specific, the ambiguous and the clarified, abrogation, consensus, reports, analogy, ijtihad, taqlid, the ordering of the proofs and fatwa; the first usul text in the curriculum {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Al-Waraqat in usul al-fiqh del Imam al-Haramayn al-Juwayni (m. 478 AH): una cartilla de dos páginas que reúne los encabezamientos de la teoría jurídica: divisiones, mandato y prohibición, lo general y lo específico, lo ambiguo y lo clarificado y fatwa; el primer texto usul del plan de estudios {cita:al-mutun-al-ilmiyya-azhar} {cita:al-aalam}."
  fr: "Al-Waraqat in usul al-fiqh de l'Imam al-Haramayn al-Juwayni (mort en 478 AH) — une introduction de deux pages rassemblant les titres de la théorie juridique: divisions, commandement et interdiction, le général et le spécifique, l'ambigu et le clarifié et la fatwa; le premier texte usul du programme {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "الوراقات اصول الفقہ از امام الحرمین الجوینی ⁦(متوفی 478ھ)⁩ - ایک دو صفحات پر مشتمل پرائمر جس میں قانونی نظریہ کے عنوانات جمع کیے گئے ہیں: تقسیم، حکم اور ممانعت، عام و خاص، مبہم اور واضح اور فتویٰ؛ نصاب میں پہلا اصول متن {حوالہ: المتون العلمیہ ازہر} {حوالہ: العالم}۔"
