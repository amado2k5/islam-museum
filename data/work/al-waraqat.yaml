  ar: "الورقات في أصول الفقه لإمام الحرمين الجويني ⁦(ت. 478هـ)⁩ نثرية قصيرة جمعت أبواب أصول الفقه في ورقتين: الأقسام والأمر والنهي والعام والخاص والمجمل والمبين والظاهر والمؤول والأفعال والمقصود والناسخ والمنسوخ والإجماع والخبر والقياس والاجتهاد والتقليد وترتيب الدلائل والإفتاء والاستفتاء؛ أول متون الأصول درساً {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
