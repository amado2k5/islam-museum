id: work/fatwa-aliftaa-jo-reclaiming-a-debt-forgiven-to-a-deceased-uncle
class: work
kind: fatwa
label: { ar: "الرجوع في دين أبرأ منه الدائن عمه المتوفى", en: "Reclaiming a debt forgiven to a deceased uncle", ur: "فوت شدہ چچا کو معاف کیا ہوا قرض واپس مانگنا" }
summary:
  ar: "سؤال عن الرجوع في دين أبرأ منه الدائن عمه المتوفى، أجابت فيه دائرة الإفتاء العام الأردنية بأن الدائن إذا أبرأ مدينه بأي لفظ يدل على ذلك، وتحققت شروط الإبراء، فليس له الرجوع والمطالبة بالدين بعد ذلك، لأن الساقط لا يعود. أجابت الدائرة بأن الدائن إذا أبرأ مدينه بأي لفظ يدل على ذلك، سواء بالمسامحة أو بالإبراء، فلا يحق له أن يرجع ويطالب بالدين الذي أسقطه. وقالت إنه يشترط لصحة الإبراء أن يعلم المبرئ مقدار الدين مفصلًا، وأن يكون مكلفًا من أهل التبرع، وألا يكون هازلًا ولا مكرهًا، فإن اجتمعت هذه الشروط صح الإبراء. واستندت إلى القاعدة الفقهية «الساقط لا يعود»، ونقلت عن درر الحكام في شرح مجلة الأحكام (1/54) أن من أسقط حقًا يجوز له إسقاطه سقط ولا يعود، فلو أسقط دينًا عن مدينه ثم ندم لم يجز له مطالبته لأن ذمته برئت. وخلصت إلى أنه إن كان الأمر كما ذكر في السؤال، فلا يحق للدائن أن يرجع في الديون التي أسقطها عن عمه."
  en: "A question about reclaiming a debt forgiven to a deceased uncle, in which Jordan's General Iftaa Department answered that once a creditor releases his debtor from a debt by any wording that conveys it, and the conditions of release are met, he may not later go back and claim the debt, since what has been dropped does not return. The Department answered that if a creditor releases his debtor from a debt by any wording that conveys this, whether forgiving it or releasing it, he has no right to go back and claim the debt he has dropped. It said that a valid release requires the person releasing to know the amount of the debt in detail, to be legally responsible and competent to make gifts, and not to be joking or acting under coercion; if these conditions are met, the release is valid. It relied on the legal maxim that what has been dropped does not return, quoting Durar al-Hukkam fi Sharh Majallat al-Ahkam (1/54) that whoever drops a right he is entitled to drop loses it for good, so if someone forgives a debt and later regrets it, he may not claim it from the debtor, whose liability has been discharged. It concluded that if the matter is as described in the question, the creditor has no right to go back on the debts he forgave his uncle."
  ur: "فوت شدہ چچا کو معاف کیا ہوا قرض واپس مانگنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر قرض خواہ کسی بھی ایسے لفظ سے جو اس پر دلالت کرے مقروض کو بری کر دے اور ابرا کی شرائط پوری ہوں تو بعد میں قرض کا مطالبہ نہیں کر سکتا، کیونکہ ساقط شدہ چیز واپس نہیں آتی۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر قرض خواہ کسی بھی ایسے لفظ سے مقروض کو بری کر دے جو اس پر دلالت کرے، چاہے معافی کے لفظ سے یا ابرا کے، تو اسے ساقط کیے ہوئے قرض کا دوبارہ مطالبہ کرنے کا حق نہیں۔ اس نے کہا کہ ابرا کے درست ہونے کے لیے شرط ہے کہ بری کرنے والا قرض کی مقدار تفصیل سے جانتا ہو، مکلف اور تبرع کا اہل ہو، اور مذاق یا جبر کی حالت میں نہ ہو؛ یہ شرائط جمع ہوں تو ابرا درست ہے۔ اس نے فقہی قاعدہ \"ساقط شدہ واپس نہیں آتا\" پر اعتماد کیا، اور درر الحکام فی شرح مجلۃ الاحکام (1/54) سے نقل کیا کہ جو شخص ایسا حق ساقط کرے جسے ساقط کرنا اس کے لیے جائز ہو تو وہ ساقط ہو جاتا ہے اور واپس نہیں آتا، لہٰذا اگر کوئی قرض معاف کر کے پچھتائے تو مقروض سے مطالبہ نہیں کر سکتا کیونکہ اس کا ذمہ بری ہو چکا۔ اس نے نتیجہ نکالا کہ اگر معاملہ سوال میں بیان کے مطابق ہے تو قرض خواہ کو اپنے چچا سے ساقط کیے ہوئے قرضوں سے رجوع کا حق نہیں۔"
