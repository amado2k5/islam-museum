label: { ar: "تحديد مسافة قصر الصلاة للمسافر بالكيلومتر", en: "The traveller's prayer-shortening distance in kilometres", ur: "مسافر کے لیے نماز قصر کا فاصلہ کلومیٹر میں" }
summary:
  ar: "سائل سأل عن مسافة قصر الصلاة للمسافر مقيسة بالكيلومتر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22385)⁩ أن مسافة السفر التي يشرع معها الأخذ برخصة قصر الصلاة الرباعية المكتوبة هي ثمانية وأربعون ميلًا بتقدير الفقهاء أي ما يعادل ثمانين كيلومترًا تقريبًا على ما فصّل الجواب."
  en: "A questioner asked the distance at which a traveller may shorten prayers, in kilometres. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22385) answered that the journey distance permitting the licence to shorten the four-unit obligatory prayers is forty-eight miles by the jurists' reckoning — about eighty kilometres — as the answer details."
  ur: "ایک سائل نے مسافر کے لیے نماز قصر کا فاصلہ کلومیٹر میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22385)⁩ نے جواب دیا کہ فقہاء کے حساب سے چار رکعت فرض نمازوں میں قصر کی رخصت کا فاصلہ اڑتالیس میل ہے — تقریباً اسی کلومیٹر — جیسا کہ جواب میں تفصیل ہے۔"
