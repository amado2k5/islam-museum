structure: "Author's introduction on legal theory (channels of rulings: word, act, tacit approval; kinds of wording; the five rulings; the six causes of disagreement); then 68 numbered kutub in the Bayt al-Afkar edition, from Kitab al-Tahara min al-Hadath (p. 21) through worship (zakat p. 282, hajj p. 364, jihad p. 425), oaths, sacrifice, hunting (p. 502), aqiqa (p. 512), marriage (p. 528), divorce (p. 588), sales (p. 651) and the other contracts, inheritance (p. 870), manumission, crimes (p. 926), hudud and hiraba (p. 987), to Kitab al-Aqdiya (p. 993), ending with a closing note on the rulings judges do not enforce (p. 1008)."
