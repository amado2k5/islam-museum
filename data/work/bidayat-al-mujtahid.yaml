summary:
  ar: "كتاب في الفقه المقارن للقاضي أبي الوليد محمد بن أحمد بن رشد الحفيد ⁦(520-595هـ)⁩، قال في مقدمته إنه أثبت فيه لنفسه على جهة التذكرة مسائل الأحكام المتفق عليها والمختلف فيها بأدلتها ونكت الخلاف فيها، مما يجري مجرى الأصول لما يرد على المجتهد من المسكوت عنه؛ وقدّم له بمقدمة أصولية في طرق تلقي الأحكام وأصنافها وأسباب الاختلاف الستة. يمضي من كتاب الطهارة إلى كتاب الأقضية، ويذكر في كل مسألة أقوال الصحابة والتابعين وفقهاء الأمصار، مالكاً أولاً ثم أبا حنيفة والشافعي وأحمد والظاهرية وغيرهم، ثم سبب الخلاف، وكثيراً ما يرجّح {cite:bidaya-bakri-bayt-al-afkar p. 6} {cite:bidaya-bakri-bayt-al-afkar p. 17} {cite:bidaya-bakri-bayt-al-afkar p. 1008}."
  en: "A work of comparative law by the judge Abu al-Walid Muhammad ibn Ahmad ibn Rushd al-Hafid (520-595 AH). In its preface he says he set down for himself, as an aide-memoire, the legal questions agreed and disputed, with their evidence and the crux of each disagreement, so far as they serve as principles for the questions the law leaves unaddressed; he opens with a legal-theory introduction on the channels through which rulings are received, the kinds of ruling and the six causes of disagreement. It runs from Purity to Judgeships, giving for each question the views of the Companions, Successors and the jurists of the great cities - Malik first, then Abu Hanifa, al-Shafi'i, Ahmad, the Zahiris and others - then the cause of the disagreement, often with his own preference."
  ur: "قاضی ابو الولید محمد بن احمد بن رشد الحفید ⁦(520-595ھ)⁩ کی تقابلی فقہ کی کتاب۔ مقدمے میں وہ کہتے ہیں کہ انہوں نے اسے اپنے لیے یادداشت کے طور پر لکھا: متفق علیہ اور مختلف فیہ احکام کے مسائل، ان کے دلائل اور اختلاف کے نکات کے ساتھ، اس حد تک کہ وہ ان مسائل کے لیے اصول کا کام دیں جن پر شریعت خاموش ہے؛ اور اسے اصولی مقدمے سے شروع کیا جس میں احکام کے حاصل ہونے کے طریقے، احکام کی اقسام اور اختلاف کے چھ اسباب ہیں۔ یہ کتاب الطہارۃ سے کتاب الاقضیہ تک جاتی ہے، اور ہر مسئلے میں صحابہ، تابعین اور فقہائے امصار کے اقوال — پہلے مالک، پھر ابو حنیفہ، شافعی، احمد، ظاہریہ وغیرہ — اور پھر سببِ اختلاف بیان کرتی ہے، اکثر اپنی ترجیح کے ساتھ۔"
