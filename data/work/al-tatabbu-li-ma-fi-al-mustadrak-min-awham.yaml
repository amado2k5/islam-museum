authors: [person/muqbil-ibn-hadi-al-wadii]
genre: [hadith]
summary:
  ar: "تعليقات أبي عبد الرحمن مقبل بن هادي الوادعي على مستدرك الحاكم، تتبع فيها أوهام الحاكم التي سكت عليها الذهبي، وسماها «التتبع لما في المستدرك من أوهام»؛ جمعها من «فيض القدير» ومن بحوثه وبحوث إخوانه وكتب الألباني، وطُبعت في ذيل طبعة دار الحرمين ⁦(القاهرة 1997)⁩ مع مقدمة مؤرخة 4 ربيع الأول 1414هـ {cite:mustadrak-haramayn-1997-v1 p. 1, 5-6, 38}."
  en: "Abu 'Abd al-Rahman Muqbil ibn Hadi al-Wadi'i's notes on al-Hakim's Mustadrak, tracing the errors al-Hakim made on which al-Dhahabi was silent, titled by him al-Tatabbu' li-ma fi al-Mustadrak min awham; gathered from Fayd al-Qadir, his own and his colleagues' research and the books of al-Albani, and printed beneath the text in the Dar al-Haramayn edition (Cairo 1997) with an introduction dated 4 Rabi' I 1414 AH {cite:mustadrak-haramayn-1997-v1 p. 1, 5-6, 38}."
  ur: "مقبل بن ہادی وادعی کے المستدرک پر حواشی، جن میں انہوں نے حاکم کے وہ اوہام جمع کیے جن پر ذہبی خاموش رہے، اور اس کا نام «التتبع لما فی المستدرک من اوہام» رکھا؛ یہ «فیض القدیر»، اپنی اور اپنے رفقا کی تحقیقات اور البانی کی کتابوں سے جمع کیے گئے اور دار الحرمین ایڈیشن ⁦(قاہرہ 1997)⁩ میں متن کے نیچے 4 ربیع الاول 1414ھ کے مقدمے کے ساتھ چھپے {cite:mustadrak-haramayn-1997-v1 p. 1, 5-6, 38}۔"
