label: { ar: "قرار مجمع الفقه الإسلامي الدولي 215 (22/11) بشأن استكمال بحث قضايا التأمين التعاوني ودراستها", en: "IIFA resolution 215 (22/11) on completing the study of cooperative insurance issues", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 215 (22/11): تعاونی بیمہ کے مسائل کے مطالعے کی تکمیل", es: "Resolución 215 (22/11) de la IIFA sobre la finalización del estudio de las cuestiones relativas a los seguros cooperativos.", fr: "Résolution 215 (22/11) de l'IIFA relative à l'achèvement de l'étude des questions d'assurance coopérative", tr: "Uluslararası İslami Fiqh Akademisi Kararı 215 (22/11) kooperatif sigorta konularının tamamlanması ve incelenmesine ilişkin", id: "Keputusan International Islamic Fiqh Academy 215 (22/11) mengenai penyelesaian dan studi isu asuransi koperasi" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩ تنفيذًا لقراره 200 ⁦(21/6)⁩ بشأن الأحكام والضوابط الشرعية لأسس التأمين التعاوني، بعد ندوة عُقدت بجدة ناقشت تأصيل الشروط الشرعية والقانونية لعمل الشخصية الاعتبارية لحساب حملة الوثائق، والعلاقات التعاقدية المنظمة لعقد التأمين التعاوني ⁦(تكييف علاقة حملة الوثائق بالصندوق لبدء الالتزام بالتبرع تجنبًا لشبهة العودة في الهبة عند توزيع الفائض، وتكييف العلاقة بين المساهمين وحملة الوثائق عند عجز حساب الاشتراك — القرض الحسن)⁩، والفائض التأميني، والأساس الوقفي للتأمين الإسلامي، والتجارب الدولية ومدى التزامها بقرار المجمع. وقرر في الفائض التأميني الاكتفاء بالمادتين الرابعة والسادسة من قراره 200 ⁦(21/6)⁩ ورأى أن جعل العوض نسبة من الفائض أو جعل نسبة منه حافزًا للجهة المديرة لا يلجأ إليه لما يثير من مشكلات فقهية أو تطبيقية. وفي الأساس الوقفي — استنادًا للمادة السادسة عشرة من القرار المذكور في جواز تكوين وقف نقدي خيري — جوّز إنشاء صناديق وقفية تكافلية تغطي بعض الأخطار من ريع الأموال الموقوفة فيها وتقبل الأقساط والتبرعات ولا مانع من الإنفاق من أرباح الوقف والأقساط والتبرعات لتغطية الأخطار على أن تنظم الجهات المشرفة على الأوقاف بالتنسيق مع المعنيين بصناعة التأمين التعاوني هذا النشاط وفق المصلحة والعدالة؛ وجوز اقتطاع جزء من الفائض التأميني ليكون وقفًا نقديًا يدعم ملاءة الصندوق؛ وجوز لشركات التأمين الإسلامية إنشاء صندوق وقفي بمساهمات نقدية من الفوائض يستخدم ريعه في عجز أو تعثر الشركات المشاركة — على أن الوقف وسيلة مساعدة لا بديل عن صيغ قرار المجمع. ولاحظ أن معظم التجارب الدولية تتوافق مع قراره 200 ⁦(21/6)⁩ في كثير من ممارساتها مع مخالفات: غياب هيئات الرقابة الشرعية الداخلية في بعض شركات التكافل؛ إلزام الشركة المديرة بالقرض الحسن أو التزامها مسبقًا لمخالفته المادة التاسعة؛ عدم الإفصاح عن آليات التأمين للمشتركين عند التعاقد؛ تقاسم الفائض بين الشركة والمشتركين؛ وتنازل حامل الوثيقة عن ربح المضاربة إذا قل عن مبلغ معين. وأوصى بنشر قراريه 200 ⁦(21/6)⁩ وهذه الدورة اللذين يشكلان مرجعية شاملة وترجمتهما وتوزيعهما على الشركات العاملة وهيئاتها الشرعية؛ وتوصية الهيئات التشريعية في الدول العربية والإسلامية بتضمينهما تشريعاتها والإحالة على المجمع مرجعًا شرعيًا معتمدًا؛ وتضمين التشريعات منح وعاء التأمين ⁦(صندوق حملة الوثائق)⁩ شخصية حكمية تضم جميع المشتركين مع النص على من يمثلها دون تضارب مصالح؛ وإصدار معايير لحوكمة مؤسسات وشركات التأمين الإسلامية تحقق مقاصد القرارين وتحفظ حقوق الأطراف وتدرأ تضارب المصالح."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015), implementing its resolution 200 (21/6) on the legal rulings and controls of cooperative insurance, after a Jeddah seminar on: the legal and sharia basis of the juridical person acting for policyholders; the contractual relations of the cooperative-insurance contract (the policyholder–fund relation defining when the donation obligation begins, avoiding the suspicion of revocation of gift at surplus distribution; the shareholders–policyholders relation when the subscription account is short — qard hasan); the insurance surplus; the waqf basis of Islamic insurance; and international experiences and their conformity with the Academy's resolution. On the surplus it contented itself with articles four and six of resolution 200 (21/6), holding that making the managing party's compensation a share of surplus or a bonus from it is not resorted to, for the juristic or practical problems it raises. On the waqf basis — resting on article sixteen permitting a charitable cash waqf — it permitted establishing takaful waqf funds covering some risks from the yield of monies endowed to them, accepting premiums and donations, spending from the waqf's profits, premiums and donations to cover these risks, with waqf supervisory bodies organising this with takaful-industry parties per interest and justice; allowed cutting part of the insurance surplus to be a cash waqf supporting the fund's solvency; and allowed Islamic insurance companies to create a waqf fund from surplus cash contributions whose yield covers deficit or default of participating companies — waqf being an aid, not a substitute for the resolution's forms. It noted most international experiences conform with resolution 200 (21/6) in many practices, with violations: absence of internal sharia-supervisory boards in some takaful companies; obliging the managing company to qard hasan or its prior commitment, contrary to article nine; not disclosing the insurance mechanisms to subscribers at contracting; sharing the surplus between company and subscribers; and the policyholder waiving mudaraba profit if below a set amount. It recommended publishing and translating resolutions 200 (21/6) and this one as a comprehensive reference for takaful companies and their sharia boards; that legislative bodies in Arab and Islamic states incorporate them citing the Academy as an accredited legal reference; that legislation grant the insurance pool (policyholders' fund) a juridical personality comprising all subscribers with its representation free of conflicts of interest; and issuing governance standards for Islamic insurance institutions realising the resolutions' objectives, preserving parties' rights and warding off conflicts of interest."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں — اپنی قرارداد 200 ⁦(21/6)⁩ کے نفاذ میں جو تعاونی بیمہ کے بنیادی اصولوں کے شرعی احکام و ضوابط پر ہے — جدہ میں منعقدہ سیمینار کے بعد جس میں بحث ہوئی: پالیسی ہولڈرز کے لیے کام کرنے والی حکمی شخصی کی شرعی و قانونی اساس؛ تعاونی بیمے کے عقد کے تعاقدی تعلقات ⁦(پالیسی ہولڈر اور فنڈ کا تعلق جس سے عطیے کی ذمہ داری کا آغاز ہوتا ہے — فاضل کی تقسیم پر عطیہ واپس لینے کے شبہ سے بچنے کے لیے؛ اور سبسکرپشن اکاؤنٹ کی کمی کی صورت میں حصہ داروں اور پالیسی ہولڈرز کا تعلق — قرضِ حسن)⁩؛ بیمہ فاضل؛ اسلامی بیمہ کی وقف اساس؛ اور بین الاقوامی تجربات اور ان کی اکیڈمی کی قرارداد سے مطابقت۔ فاضل کے معاملے میں اکیڈمی نے قرارداد 200 ⁦(21/6)⁩ کی دفعہ چار اور چھ پر اکتفا کیا اور فیصلہ دیا کہ منتظم فریق کے معاوضے کو فاضل کا حصہ یا انعام بنانا درست نہیں شرعی یا عملی مسائل کی وجہ سے۔ وقف اساس پر — دفعہ سولہ کی بنا پر جو خیراتی نقد وقف کی اجازت دیتی ہے — اس نے تکافلی وقف فنڈز قائم کرنے کی اجازت دی جو وقف شدہ رقم کی آمدنی سے بعض خطرات کی کوریج کریں، قسطیں اور عطیات قبول کریں اور وقف کے منافع، قسطوں اور عطیات سے خطرات کی کوریج میں خرچ کریں، اور متعلقہ ممالک کے وقف نگران ادارے تکافل صنعت کے فریقوں کے ساتھ مفاد اور عدل کے مطابق اس سرگرمی کو منظم کریں؛ بیمہ فاضل کا کچھ حصہ نقد وقف بنا کر فنڈ کی ادائیگی کی صلاحیت بڑھانا جائز؛ اور اسلامی بیمہ کمپنیاں فواضل کی نقد شرکت سے وقف فنڈ بنا سکتی ہیں جس کی آمدنی شریک کمپنیوں کے عجز یا تعثر میں استعمال ہو — وقف معاون ذریعہ ہے، قرارداد کی صورتوں کا بدل نہیں۔ اکیڈمی نے نوٹ کیا کہ اکثر بین الاقوامی تجربات قرارداد 200 ⁦(21/6)⁩ کے مطابق ہیں مگر خلاف ورزیاں بھی: بعض تکافل کمپنیوں میں اندرونی شرعی نگرانی بورڈ کا فقدان؛ منتظم کمپنی پر قرضِ حسن لازم کرنا یا اس کا پیشگی التزام جو دفعہ نو کی مخالفت ہے؛ معاہدے کے وقت صارفین کو بیمہ کے طریق کار سے آگاہ نہ کرنا؛ فاضل کو کمپنی اور صارفین میں تقسیم کرنا؛ اور پالیسی ہولڈر کا مقررہ رقم سے کم ہونے پر مضاربہ کا منافع معاف کر دینا۔ سفارشات: قرارداد 200 ⁦(21/6)⁩ اور اس قرارداد کو جامع مرجع کے طور پر شائع، ترجمہ اور عامل کمپنیوں اور ان کے شرعی بورڈز میں تقسیم کرنا؛ عرب و اسلامی ممالک کے مقنن اداروں سے انہیں اپنے قوانین میں شامل کرنے اور اکیڈمی کو مستند شرعی مرجع ماننے کی تلقین؛ قوانین میں بیمہ پول ⁦(پالیسی ہولڈرز کا فنڈ)⁩ کو تمام صارفین پر مشتمل حکمی شخصی دینا اور اس کے نمائندے کے تعین تضادِ مفاد کے بغیر؛ اور اسلامی بیمہ اداروں کے لیے حکمرانی کے معیارات جاری کرنا جو دونوں قراردادوں کے مقاصد پورے کریں، فریقوں کے حقوق محفوظ رکھیں اور تضادِ مفاد روکیں۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015), que implementa su resolución 200 (21/6) sobre las normas jurídicas y los controles de los seguros cooperativos, después de un seminario en Jeddah sobre: la base jurídica y sharia de la persona jurídica que actúa en nombre de los asegurados; las relaciones contractuales del contrato de seguro cooperativo (la relación asegurado-fondo que define cuándo comienza la obligación de donación, evitando la sospecha de revocación de la donación en la distribución del excedente; la relación accionistas-asegurados cuando la cuenta de suscripción es insuficiente — qard hasan); el excedente del seguro; la base waqf del seguro islámico; y las experiencias internacionales y su conformidad con la resolución de la Academia. En cuanto al excedente, se limitó a los artículos cuatro y seis de la resolución 200 (21/6), sosteniendo que no se recurre a hacer que la compensación de la parte administradora sea una participación en el excedente o una bonificación del mismo, debido a los problemas jurídicos o prácticos que plantea. Sobre la base del waqf —apoyándose en el artículo dieciséis que permite un waqf de efectivo caritativo— permitió establecer fondos waqf takaful que cubrieran algunos riesgos del rendimiento de los fondos dotados a ellos, aceptar primas y donaciones, gastar de las ganancias, primas y donaciones del waqf para cubrir estos riesgos, con los órganos supervisores del waqf organizando esto con las partes de la industria takaful por interés y justicia; permitió recortar parte del superávit del seguro para que fuera un waqf de efectivo que respaldara la solvencia del fondo; y permitió a las compañías de seguros islámicas crear un fondo waqf a partir de contribuciones de efectivo excedentes cuyo rendimiento cubra el déficit o el incumplimiento de las compañías participantes —el waqf es una ayuda, no un sustituto de las formas de la resolución. Señaló que la mayoría de las experiencias internacionales se ajustan a la resolución 200 (21/6) en muchas prácticas, con violaciones: ausencia de juntas internas de supervisión de la sharia en algunas compañías takaful; obligar a la compañía administradora a qard hasan o su compromiso previo, contrario al artículo nueve; no revelar los mecanismos de seguro a los suscriptores al momento de la contratación; compartir el excedente entre la compañía y los suscriptores; y que el titular de la póliza renuncie a las ganancias de mudaraba si están por debajo de una cantidad establecida. Recomendó publicar y traducir las resoluciones 200 (21/6) y esta como una referencia integral para las compañías takaful y sus juntas sharia; que los órganos legislativos en los estados árabes e islámicos las incorporen citando a la Academia como referencia legal acreditada; que la legislación otorgue al fondo de seguros (fondo de los asegurados) una personalidad jurídica que comprenda a todos los suscriptores con su representación libre de conflictos de interés; y emitir normas de gobernanza para las instituciones de seguros islámicas que logren los objetivos de las resoluciones, preserven los derechos de las partes y eviten los conflictos de interés."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015), mettant en œuvre sa résolution 200 (21/6) relative aux règles juridiques et aux contrôles de l'assurance coopérative, suite à un séminaire à Djeddah portant sur: le fondement juridique et islamique de la personne morale agissant pour le compte des assurés; les relations contractuelles du contrat d'assurance coopérative (la relation assuré-fonds définissant le début de l'obligation de don, afin d'éviter tout soupçon de révocation du don lors de la distribution des excédents; la relation actionnaires-assurés en cas d'insuffisance de fonds – qard hasan); l'excédent d'assurance; le fondement waqf de l'assurance islamique; et les expériences internationales et leur conformité avec la résolution de l'Académie. Concernant l'excédent, l'Académie s'est contentée des articles quatre et six de la résolution 200 (21/6), estimant que la rémunération du gestionnaire sous forme de part d'excédent ou de prime n'était pas envisagée en raison des problèmes juridiques et pratiques que cela soulève. Sur la base du waqf – s'appuyant sur l'article seize autorisant un waqf charitable en espèces – la résolution a permis la création de fonds waqf takaful couvrant certains risques grâce aux revenus des sommes qui leur sont léguées, acceptant primes et dons, et utilisant les bénéfices, primes et dons du waqf pour couvrir ces risques. Des organes de surveillance du waqf coordonnent ces opérations avec les acteurs du secteur du takaful, dans un souci d'intérêt général et de justice. La résolution a également autorisé le prélèvement d'une partie de l'excédent d'assurance pour constituer un waqf en espèces garantissant la solvabilité du fonds. Enfin, elle a permis aux compagnies d'assurance islamiques de créer un fonds waqf à partir des contributions en espèces excédentaires, dont les revenus couvrent les déficits ou les défauts de paiement des compagnies participantes. Le waqf constitue une aide, et non un substitut, aux modalités prévues par la résolution. La résolution a constaté que la plupart des pratiques internationales sont conformes à la résolution 200 (21/6), avec toutefois quelques violations: absence de comités de surveillance internes conformes à la charia dans certaines compagnies de takaful; obligation pour la société de gestion de respecter le qard hasan ou son engagement antérieur, contrairement à l'article neuf; non-divulgation des mécanismes d'assurance aux souscripteurs lors de la souscription. Le partage des excédents entre la compagnie et les souscripteurs, ainsi que la renonciation par le preneur d'assurance au profit de la mudaraba si celui-ci est inférieur à un certain montant, ont été préconisés. Il a été recommandé de publier et de traduire les résolutions 200 (21/6) et la présente résolution comme référence exhaustive pour les compagnies de takaful et leurs conseils de la charia; que les organes législatifs des États arabes et islamiques les intègrent en citant l'Académie comme référence juridique accréditée; que la législation confère au fonds d'assurance (fonds des souscripteurs) la personnalité juridique, englobant tous les souscripteurs et leur représentation exempte de conflits d'intérêts; et que des normes de gouvernance soient établies pour les institutions d'assurance islamiques afin de réaliser les objectifs des résolutions, de préserver les droits des parties et de prévenir les conflits d'intérêts."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt Devleti'ndeki yirmi ikinci oturumunda (2–5 Jumada al-Akhirah 1436H, 22–25 Mart 2015) kolektif kararı, 200 (21/6) sayılı Kararını uygulayan kolektif kararı, Cidde'de düzenlenen ve poliçe sahipleri adına tüzel kişilerin faaliyet göstermesi için yasal ve hukuki koşulların, kooperatif sigorta sözleşmesini düzenleyen sözleşme ilişkilerinin (poliçe sahipleri ile fon arasındaki ilişkinin, fazlanın dağıtımında tekrar şüphesini önlemek için bağış zorunluluğunu başlatacak şekilde uyarlanması ve abonelik hesabı iş göremezliği durumunda hissedarlar ile poliçe sahipleri arasındaki ilişkinin uyarlanması) — Qard al-Hasan (faizsiz kredi), sigorta fazlası, İslami sigorta bağış temeli, uluslararası deneyimler ve Konsey kararına bağlılıkları ele alınmıştır. Sigorta fazlası ile ilgili olarak, yalnızca 200 (21/6) sayılı kararının 4 ve 6. maddelerine dayanmaya karar verdi ve tazminatın fazla miktarının bir yüzdesi veya bir yüzdesi olarak yönetici kuruluş için teşvik olarak kabul edilmesinin içtihat veya pratik nedenlerle başvurulmaması gerektiği kanaatinde bulundu. Vakıf temelinde—yukarıda belirtilen kararın On Altıncı Maddesi uyarınca, hayır amaçlı nakit vakfı kurulmasına izin vererek—vakıf fonları gelirlerinden belirli riskleri karşılayan, taksitli ve bağışlar kabul eden takaful vakıf fonları kurulmasına izin verilir ve vakıfın kârları, taksitleri ve bağışlarından riskleri karşılamak için harcama yapılmasına itiraz yoktur; ancak vakıfların denetleyici birimleri, kooperatif sigorta sektörüyle ilgili olanlarla koordineli olarak bu faaliyeti çıkar ve adalete göre organize etmeleri; sigorta fazlasının bir kısmının fonun ödeme gücünü desteklemek için nakit bağış olarak düşülmesine izin verilir; ve İslami sigorta şirketleri, fazlalıklardan nakit katkılarla bir vakıf fonu kurabilir; bu gelir katılımcı şirketlerin açık veya temerrüde kullanılması koşuluyla—ancak vakıfın yardım aracı olması koşuluyla, Havuz kararının formüllerine alternatif değil. Uluslararası deneyimlerin çoğunun, ihlallerle ilgili birçok uygulamada 200 (21/6) sayılı Kararla uyumlu olduğunu belirtti: bazı takaful şirketlerde iç Şeriat denetim organlarının olmaması; yönetici şirketin faizsiz kredi veya Dokuzuncu Maddeyi ihlal eden önceki taahhütler sağlama yükümlülüğü; sözleşme sırasında sigorta mekanizmalarını abonelere açıklamama; fazlanın şirket ile aboneler arasında paylaşılması; ve poliçe sahiplerinin spekülasyondan kâr belirli bir miktarın altına düşmesi durumunda feragat etmesi. 200 (21/6) sayılı kararlarının ve bu oturumun yayımlanmasını tavsiye etti; bunlar kapsamlı bir referans teşkil ederek, işletme şirketleri ve şeriat organlarına tercüme edilip dağıtılmasını; Arap ve İslam ülkelerindeki yasama organlarının kendi yasalarını dahil etmelerini ve Meclis'e onaylanmış bir Şeriat referansı olarak başvurmalarını; sigorta fonuna (poliçe sahipleri fonuna) çıkar çatışması olmadan açık temsilciye sahip tüm katılımcıları kapsayan bir yargı varlığı tanıyan mevzuatın dahil edilmesini; ve iki kararın amaçlarına ulaşan, tarafların haklarını koruyan ve çıkar çatışmalarını önleyen İslami sigorta kurumları ve şirketleri için yönetim standartlarının çıkarılmasını tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436H, 22–25 Maret 2015) yang melaksanakan Keputusan 200 (21/6) mengenai ketentuan Syariah dan pengendalian dasar asuransi koperasi, setelah seminar di Jeddah yang membahas penetapan kondisi hukum dan hukum untuk operasional entitas hukum atas nama pemegang polis, hubungan kontraktual yang mengatur kontrak asuransi koperasi (menyesuaikan hubungan antara pemegang polis dan dana untuk memulai kewajiban berdonasi agar tidak dicurigai berulang saat mendistribusikan surplus, dan menyesuaikan hubungan antara pemegang saham dan pemegang polis jika terjadi ketidakmampuan akun langganan — Qard al-Hasan (pinjaman tanpa bunga), surplus asuransi, dasar abadi asuransi Islam, pengalaman internasional, dan komitmen mereka terhadap keputusan Dewan. Komisi memutuskan mengenai surplus asuransi untuk hanya mengandalkan Pasal 4 dan 6 dari keputusan 200 (21/6) dan menganggap bahwa menjadikan kompensasi sebagai persentase dari surplus atau persentase dari surplus tersebut sebagai insentif bagi entitas pengelola tidak boleh digunakan karena masalah yurisdiksi atau praktis. Berdasarkan dana abadi—berdasarkan Pasal Enam Belas keputusan yang disebutkan di atas yang mengizinkan pembentukan dana abadi amal—diperbolehkan untuk mendirikan dana abadi takaful yang menanggung risiko tertentu dari hasil dana abadi, menerima cicilan dan donasi, dan tidak ada keberatan untuk pengeluaran dari keuntungan, cicilan, dan donasi dana abadi untuk menutupi risiko, asalkan entitas pengawas dana abadi, bekerja sama dengan pihak terkait industri asuransi koperasi, mengatur kegiatan ini sesuai dengan kepentingan dan keadilan; diperbolehkan untuk mengurangi sebagian surplus asuransi sebagai dana abadi tunai untuk mendukung solvabilitas dana; dan perusahaan asuransi Islam dapat mendirikan dana abadi dengan kontribusi tunai dari surplus, hasilnya akan digunakan untuk defisit atau gagal bayar perusahaan peserta—asalkan dana abadi tersebut merupakan sarana bantuan, bukan alternatif dari formula keputusan Pool. Ia mencatat bahwa sebagian besar pengalaman internasional sejalan dengan Resolusi 200 (21/6) dalam banyak praktik mengenai pelanggaran: tidak adanya badan pengawas Syariah internal di beberapa perusahaan takaful; kewajiban perusahaan pengelola untuk memberikan pinjaman tanpa bunga atau komitmen sebelumnya atas pelanggaran Pasal Sembilan; kegagalan mengungkapkan mekanisme asuransi kepada pelanggan saat kontrak; pembagian surplus antara perusahaan dan pelanggan; dan pemegang polis melepaskan keuntungan dari spekulasi jika turun di bawah jumlah tertentu. Dewan merekomendasikan publikasi resolusi-resolusi 200 (21/6) dan sesi ini, yang merupakan referensi komprehensif, menerjemahkan dan mendistribusikannya kepada perusahaan operasional dan badan Syariah mereka; merekomendasikan agar badan legislatif di negara-negara Arab dan Islam memasukkan legislasi mereka dan merujuk Majelis sebagai referensi Syariah yang disetujui; termasuk legislasi yang memberikan dana asuransi (dana pemegang polis) entitas yudisial yang mencakup semua peserta dengan perwakilan yang jelas tanpa konflik kepentingan; serta menerbitkan standar tata kelola untuk lembaga asuransi Islam dan perusahaan yang mencapai tujuan kedua resolusi, menjaga hak-hak pihak, dan mencegah konflik kepentingan."
