label: { ar: "معلقة طرفة بن العبد «لخولة أطلال ببرقة ثهمد»", en: "The Mu'allaqa of Tarafa ibn al-Abd, 'Khawla has traces at Burqat Thahmad'", es: "El Mu'allaqa de Tarafa ibn al-Abd, 'Khawla tiene huellas en Burqat Thahmad'", fr: "La Mu'allaqa de Tarafa ibn al-Abd, 'Khawla a des traces à Burqat Thahmad'", ur: "طائفہ ابن العبد کے مقلقہ، 'خولہ کے پاس برقات تہمد کے آثار ہیں'", tr: "Tarafa ibn al-Abd'in Mu'allakası: 'Khawla için, Cyrenaica Thahmad'daki harabeler'", id: "Mu'allaqa Tarafa ibn al-Abd: 'Untuk Khawla, reruntuhan di Cyrenaica Thahmad'" }
summary:
  ar: "إحدى المعلقات السبع، من الطويل على روي الدال، مطلعها «لخولة أطلال ببرقة ثهمد تلوح كباقي الوشم في ظاهر اليد»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.46}}."
  en: "One of the seven Mu'allaqat, in the tawil metre on the rhyme dal, opening \"Khawla has traces at Burqat Thahmad, shimmering like the remnants of tattoo on the back of the hand\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.46}}."
  es: "Uno de los siete Mu'allaqat, en el metro tawil sobre la rima dal, comienza con \"Khawla tiene huellas en Burqat Thahmad, brillando como los restos de un tatuaje en el dorso de la mano\", como en el comentario de al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.46}}."
  fr: "L'un des sept Mu'allaqat, dans le mètre tawil sur la rime dal, commençant par « Khawla a des traces à Burqat Thahmad, scintillant comme les restes d'un tatouage sur le dos de la main », comme dans le commentaire d'al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.46}}."
  ur: "سات معلقات میں سے ایک، شاعری کی دال پر تاویل میٹر میں، \"خولہ کے برقط تھمد پر نشانات ہیں، جو ہاتھ کی پشت پر ٹیٹو کی باقیات کی طرح چمک رہے ہیں\"، جیسا کہ الزوزانی کی تفسیر میں ہے {{حوالہ:شرح مُلَلَقَاتِ صَبْحَانَ الصَّلٰوۃُ وَالْحَمْدُ لِلَّهِ}"
  tr: "Yedi Mu'allaqat'tan biri, 'd' harfinin uzun harfindeki olup, 'Khawla için, elin arkasındaki dövmenin geri kalanı gibi parıldayan Kirenaika'daki harabelerdir, Al-Zawzani'nin yorumunda {{cite:sharh-muallaqat-sab-zawzani-1921 s.46}} ile açıklanmıştır."
  id: "Salah satu dari tujuh Mu'allaqat, dari huruf 'd' yang panjang, dimulai dengan 'Untuk Khawla, reruntuhan di Cyrenaica yang berkilauan seperti tato lain di punggung tangan,' seperti dijelaskan dalam komentar Al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 hlm.46}}."
