summary:
  ar: "إحدى المعلقات السبع، من الطويل على روي الدال، مطلعها «لخولة أطلال ببرقة ثهمد تلوح كباقي الوشم في ظاهر اليد»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.46}}."
  en: "One of the seven Mu'allaqat, in the tawil metre on the rhyme dal, opening \"Khawla has traces at Burqat Thahmad, shimmering like the remnants of tattoo on the back of the hand\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.46}}."
