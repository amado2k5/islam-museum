id: work/fatwa-aliftaa-jo-selling-mystery-boxes
class: work
kind: fatwa
label: { ar: "بيع الصناديق العشوائية", en: "Selling mystery boxes", ur: "سرپرائز باکس بیچنا" }
summary:
  ar: "سؤال عن بيع الصناديق العشوائية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الصندوق إن كان هو المبيع وما فيه جائزة صح البيع، وإن كانت محتوياته غير المرئية هي المبيع فالبيع باطل للغرر، فلا يجوز بيع الصناديق العشوائية الموصوفة ولا شراؤها. أجابت الدائرة بأن البيع له أركان وشروط، منها معرفة المبيع معرفة نافية للجهالة، فإذا كان المبيع غير معلوم لعدم رؤيته لم يصح البيع، ونقلت عن ابن النقيب في عمدة السالك (ص150) أنه لا يصح بيع غير المعين ولا العين الغائبة، وعن نهاية الزين (ص226) أنه لا يصح بيع ما لم يره أحد العاقدين وإن كان حاضرًا في مجلس العقد. وقالت إن للصورة حالتين: إن كان الصندوق هو المبيع المقصود والأشياء التي بداخله تمنح للمشتري جائزة صح البيع لمعلومية المبيع والثمن؛ وإن كانت الأشياء التي في الصناديق هي المبيع المقصود فهي غير مشاهدة وغير معلومة، وهذا من الغرر المحرم. واستدلت بحديث رواه مسلم عن أبي هريرة في النهي عن بيع الحصاة وبيع الغرر، ونقلت عن زكريا الأنصاري في أسنى المطالب (2/11) أن الغرر ما تردد بين أمرين أغلبهما أخوفهما، وقيل ما انطوت عنا عاقبته، وقالت إن الغرر هنا أن ما في الصناديق وقيمته مجهولان فقد يكون أعلى من الثمن أو أقل. وخلصت إلى أنه لا يجوز بيع هذه الصناديق العشوائية ولا شراؤها لعدم توافر شروط صحة البيع ولوجود الغرر المحرم."
  en: "A question about selling mystery boxes, in which Jordan's General Iftaa Department answered that if the box itself is the item sold and its contents are a prize, the sale is valid, but if its unseen contents are what is being sold, the sale is void for excessive uncertainty (gharar), so the mystery boxes described may be neither sold nor bought. The Department answered that a sale has pillars and conditions, among them that the item sold be known well enough to remove uncertainty; if it is unknown because it has not been seen, the sale is invalid. It quoted Ibn al-Naqib in Umdat al-Salik (p. 150) that one may not sell an unspecified item or an item absent from view, and Nihayat al-Zayn (p. 226) that a sale is invalid if one party has not seen the item, even if it is present at the place of contract. It said the case has two forms: if the box is the intended item of sale and the things inside are given to the buyer as a prize, the sale is valid because the item and price are known; but if the things inside the boxes are the intended item of sale, they are unseen and unknown, which is forbidden gharar. It cited a hadith narrated by Muslim from Abu Hurayra prohibiting the pebble sale and sales involving gharar, and quoted Zakariyya al-Ansari in Asna al-Matalib (2/11) that gharar is what wavers between two opposite outcomes, the more likely being the more feared, or what has a hidden outcome; here the contents of the boxes and their value are unknown, and may be worth more or less than the price. It concluded that these mystery boxes may be neither sold nor bought, since the conditions of a valid sale are not met and forbidden gharar is present."
  ur: "سرپرائز باکس بیچنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر خود ڈبہ بیچی جانے والی چیز ہو اور اس کے اندر کی اشیا انعام ہوں تو بیع درست ہے، لیکن اگر اس کے اندر کی نادیدہ اشیا بیچی جا رہی ہوں تو غرر کی وجہ سے بیع باطل ہے، اس لیے بیان کردہ سرپرائز باکس نہ بیچے جا سکتے ہیں نہ خریدے۔ ڈیپارٹمنٹ نے جواب دیا کہ بیع کے ارکان اور شرائط ہیں، جن میں یہ بھی ہے کہ بیچی جانے والی چیز اس طرح معلوم ہو کہ لاعلمی دور ہو جائے؛ اگر وہ نہ دیکھنے کی وجہ سے نامعلوم ہو تو بیع درست نہیں۔ اس نے عمدۃ السالک (ص 150) میں ابن النقیب سے نقل کیا کہ غیر متعین یا نظر سے غائب چیز کی بیع درست نہیں، اور نہایۃ الزین (ص 226) سے کہ اگر عاقدین میں سے کسی نے چیز نہ دیکھی ہو تو بیع درست نہیں چاہے وہ مجلسِ عقد میں موجود ہو۔ اس نے کہا کہ اس صورت کی دو حالتیں ہیں: اگر ڈبہ ہی مقصود بیع ہو اور اندر کی اشیا خریدار کو انعام کے طور پر دی جائیں تو بیع درست ہے کیونکہ چیز اور قیمت معلوم ہیں؛ لیکن اگر ڈبوں کے اندر کی اشیا مقصود بیع ہوں تو وہ نادیدہ اور نامعلوم ہیں، جو حرام غرر ہے۔ اس نے مسلم کی ابو ہریرہ سے روایت کردہ حدیث سے استدلال کیا جس میں کنکری کی بیع اور غرر کی بیع سے منع کیا گیا، اور اسنی المطالب (2/11) میں زکریا انصاری سے نقل کیا کہ غرر وہ ہے جو دو متضاد نتیجوں کے درمیان مترددہو اور زیادہ امکان والا زیادہ خوفناک ہو، یا جس کا انجام پوشیدہ ہو؛ یہاں ڈبوں کے اندر کی چیزیں اور ان کی قیمت نامعلوم ہیں، جو قیمت سے زیادہ یا کم ہو سکتی ہیں۔ اس نے نتیجہ نکالا کہ یہ سرپرائز باکس نہ بیچے جا سکتے ہیں نہ خریدے، کیونکہ درست بیع کی شرائط پوری نہیں اور حرام غرر موجود ہے۔"
