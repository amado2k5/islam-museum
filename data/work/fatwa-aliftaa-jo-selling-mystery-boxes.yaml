id: work/fatwa-aliftaa-jo-selling-mystery-boxes
class: work
kind: fatwa
label: { ar: "بيع الصناديق العشوائية", en: "Selling mystery boxes", ur: "سرپرائز باکس بیچنا", es: "Venta de cajas misteriosas", fr: "Vente de boîtes mystères", tr: "Rastgele kutuların satışı", id: "Penjualan kotak acak" }
summary:
  ar: "سؤال عن بيع الصناديق العشوائية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الصندوق إن كان هو المبيع وما فيه جائزة صح البيع، وإن كانت محتوياته غير المرئية هي المبيع فالبيع باطل للغرر، فلا يجوز بيع الصناديق العشوائية الموصوفة ولا شراؤها. أجابت الدائرة بأن البيع له أركان وشروط، منها معرفة المبيع معرفة نافية للجهالة، فإذا كان المبيع غير معلوم لعدم رؤيته لم يصح البيع، ونقلت عن ابن النقيب في عمدة السالك ⁦(ص150)⁩ أنه لا يصح بيع غير المعين ولا العين الغائبة، وعن نهاية الزين ⁦(ص226)⁩ أنه لا يصح بيع ما لم يره أحد العاقدين وإن كان حاضرًا في مجلس العقد. وقالت إن للصورة حالتين: إن كان الصندوق هو المبيع المقصود والأشياء التي بداخله تمنح للمشتري جائزة صح البيع لمعلومية المبيع والثمن؛ وإن كانت الأشياء التي في الصناديق هي المبيع المقصود فهي غير مشاهدة وغير معلومة، وهذا من الغرر المحرم. واستدلت بحديث رواه مسلم عن أبي هريرة في النهي عن بيع الحصاة وبيع الغرر، ونقلت عن زكريا الأنصاري في أسنى المطالب (2/11) أن الغرر ما تردد بين أمرين أغلبهما أخوفهما، وقيل ما انطوت عنا عاقبته، وقالت إن الغرر هنا أن ما في الصناديق وقيمته مجهولان فقد يكون أعلى من الثمن أو أقل. وخلصت إلى أنه لا يجوز بيع هذه الصناديق العشوائية ولا شراؤها لعدم توافر شروط صحة البيع ولوجود الغرر المحرم."
  en: "A question about selling mystery boxes, in which Jordan's General Iftaa Department answered that if the box itself is the item sold and its contents are a prize, the sale is valid, but if its unseen contents are what is being sold, the sale is void for excessive uncertainty (gharar), so the mystery boxes described may be neither sold nor bought. The Department answered that a sale has pillars and conditions, among them that the item sold be known well enough to remove uncertainty; if it is unknown because it has not been seen, the sale is invalid. It quoted Ibn al-Naqib in Umdat al-Salik (p. 150) that one may not sell an unspecified item or an item absent from view, and Nihayat al-Zayn (p. 226) that a sale is invalid if one party has not seen the item, even if it is present at the place of contract. It said the case has two forms: if the box is the intended item of sale and the things inside are given to the buyer as a prize, the sale is valid because the item and price are known; but if the things inside the boxes are the intended item of sale, they are unseen and unknown, which is forbidden gharar. It cited a hadith narrated by Muslim from Abu Hurayra prohibiting the pebble sale and sales involving gharar, and quoted Zakariyya al-Ansari in Asna al-Matalib (2/11) that gharar is what wavers between two opposite outcomes, the more likely being the more feared, or what has a hidden outcome; here the contents of the boxes and their value are unknown, and may be worth more or less than the price. It concluded that these mystery boxes may be neither sold nor bought, since the conditions of a valid sale are not met and forbidden gharar is present."
  ur: "سرپرائز باکس بیچنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر خود ڈبہ بیچی جانے والی چیز ہو اور اس کے اندر کی اشیا انعام ہوں تو بیع درست ہے، لیکن اگر اس کے اندر کی نادیدہ اشیا بیچی جا رہی ہوں تو غرر کی وجہ سے بیع باطل ہے، اس لیے بیان کردہ سرپرائز باکس نہ بیچے جا سکتے ہیں نہ خریدے۔ ڈیپارٹمنٹ نے جواب دیا کہ بیع کے ارکان اور شرائط ہیں، جن میں یہ بھی ہے کہ بیچی جانے والی چیز اس طرح معلوم ہو کہ لاعلمی دور ہو جائے؛ اگر وہ نہ دیکھنے کی وجہ سے نامعلوم ہو تو بیع درست نہیں۔ اس نے عمدۃ السالک ⁦(ص 150)⁩ میں ابن النقیب سے نقل کیا کہ غیر متعین یا نظر سے غائب چیز کی بیع درست نہیں، اور نہایۃ الزین ⁦(ص 226)⁩ سے کہ اگر عاقدین میں سے کسی نے چیز نہ دیکھی ہو تو بیع درست نہیں چاہے وہ مجلسِ عقد میں موجود ہو۔ اس نے کہا کہ اس صورت کی دو حالتیں ہیں: اگر ڈبہ ہی مقصود بیع ہو اور اندر کی اشیا خریدار کو انعام کے طور پر دی جائیں تو بیع درست ہے کیونکہ چیز اور قیمت معلوم ہیں؛ لیکن اگر ڈبوں کے اندر کی اشیا مقصود بیع ہوں تو وہ نادیدہ اور نامعلوم ہیں، جو حرام غرر ہے۔ اس نے مسلم کی ابو ہریرہ سے روایت کردہ حدیث سے استدلال کیا جس میں کنکری کی بیع اور غرر کی بیع سے منع کیا گیا، اور اسنی المطالب (2/11) میں زکریا انصاری سے نقل کیا کہ غرر وہ ہے جو دو متضاد نتیجوں کے درمیان مترددہو اور زیادہ امکان والا زیادہ خوفناک ہو، یا جس کا انجام پوشیدہ ہو؛ یہاں ڈبوں کے اندر کی چیزیں اور ان کی قیمت نامعلوم ہیں، جو قیمت سے زیادہ یا کم ہو سکتی ہیں۔ اس نے نتیجہ نکالا کہ یہ سرپرائز باکس نہ بیچے جا سکتے ہیں نہ خریدے، کیونکہ درست بیع کی شرائط پوری نہیں اور حرام غرر موجود ہے۔"
  es: "Una pregunta sobre la venta de cajas misteriosas, en la que el Departamento General de Iftaa de Jordania respondió que si la caja en sí es el artículo vendido y su contenido es un premio, la venta es válida, pero si lo que se vende es su contenido invisible, la venta es nula por excesiva incertidumbre (gharar), por lo que las cajas misteriosas descritas no pueden ni venderse ni comprarse. El Departamento respondió que una venta tiene pilares y condiciones, entre ellos que el artículo vendido sea suficientemente conocido para eliminar la incertidumbre; si es desconocido porque no se ha visto, la venta es inválida. Citó a Ibn al-Naqib en Umdat al-Salik (p. 150) que no se puede vender un artículo no especificado o un artículo que no está a la vista, y a Nihayat al-Zayn (p. 226) que una venta es inválida si una de las partes no ha visto el artículo, incluso si está presente en el lugar del contrato. Se indicó que el caso presenta dos formas: si la caja es el artículo de venta previsto y su contenido se entrega al comprador como premio, la venta es válida porque se conocen el artículo y el precio; pero si el artículo de venta es el objeto en sí, este es desconocido e invisible, lo cual constituye gharar prohibido. Se citó un hadiz narrado por Muslim de Abu Hurayra que prohíbe la venta de guijarros y las ventas que implican gharar, y se citó a Zakariyya al-Ansari en Asna al-Matalib (2/11) que afirma que gharar es aquello que oscila entre dos resultados opuestos, siendo el más probable el más temido, o aquello que tiene un resultado oculto; en este caso, el contenido de las cajas y su valor son desconocidos, y pueden valer más o menos que el precio. Se concluyó que estas cajas misteriosas no pueden venderse ni comprarse, ya que no se cumplen las condiciones de una venta válida y existe gharar prohibido."
  fr: "Concernant la vente de boîtes mystères, le Département général de la jurisprudence jordanienne (Iftaa) a répondu que si la boîte elle-même constitue l'objet de la vente et que son contenu représente un prix, la vente est valable. En revanche, si le contenu, resté invisible, est vendu, la vente est nulle pour cause d'incertitude excessive (gharar). Par conséquent, les boîtes mystères décrites ne peuvent être ni vendues ni achetées. Le Département a expliqué qu'une vente repose sur des piliers et des conditions, parmi lesquels la connaissance suffisante de l'objet vendu pour lever toute incertitude; si l'objet est inconnu car non vu, la vente est invalide. Il a cité Ibn al-Naqib dans Umdat al-Salik (p. 150) selon lequel il est interdit de vendre un objet non spécifié ou absent de la vue, et Nihayat al-Zayn (p. 226) selon lequel une vente est invalide si l'une des parties n'a pas vu l'objet, même s'il est présent sur le lieu de la conclusion du contrat. Il est précisé que le cas présente deux possibilités: si la boîte constitue l’objet de la vente et que son contenu est offert à l’acheteur en guise de récompense, la vente est valide car l’objet et son prix sont connus; en revanche, si le contenu des boîtes est l’objet de la vente, il est invisible et inconnu, ce qui constitue un gharar interdit. Un hadith rapporté par Muslim d’après Abu Hurayra, interdisant la vente de cailloux et les ventes impliquant un gharar, est cité, ainsi qu’un commentaire de Zakariyya al-Ansari dans Asna al-Matalib (2/11) expliquant que le gharar désigne ce qui hésite entre deux issues opposées, la plus probable étant la plus redoutée, ou ce qui recèle une issue cachée; or, en l’espèce, le contenu des boîtes et sa valeur sont inconnus et peuvent être supérieurs ou inférieurs au prix. Il est conclu que ces boîtes mystérieuses ne peuvent être ni vendues ni achetées, car les conditions d’une vente valide ne sont pas réunies et un gharar interdit est présent."
  tr: "Rastgele kutuların satışıyla ilgili bir soru, Ürdün Genel Fetva Dairesi, kutu satılan ürün ise ve izin verilebilirse satışın geçerli olduğunu; içeriği satılan ürüne görünmezse belirsizlik nedeniyle satışın geçersiz olduğunu yanıtladı. Bu nedenle, tanımlanan rastgele kutuların satılması veya alınması caiz değildir. Departman, satışın unsurları ve koşulları olduğunu, bunlar arasında cehaleti önlemek için satılan ürünün bilinmesi de dahil olduğunu yanıtladı. Satılan ürün görünürlük eksikliği nedeniyle bilinmiyorsa, satış geçerli değildir. Umdat Al-Salik'te (s. 150) İbn Al-Naqib'in belirtilen ürün veya eksik ürün dışında bir şeyin satılmasının geçerli olmadığını aktardı. Nihayat Al-Zain'den (s. 226) ise, sözleşme oturumunda bulunsa bile, taraflardan birinin görmediği bir şeyi satmak geçerli değildir. Davada iki durum olduğunu söyledi: kutu amaçlanan eşya ise ve içindeki ürünler bilinen ürün ve fiyat nedeniyle alıcıya geçerli bir satış hakkı veriliyorsa; ve kutulardaki ürünler satış için niyetlenen eşyaysa, görünmez ve bilinmiyorlar, bu da yasak belirsizlik olarak kabul edilir. Ebu Hureyre'den Müslüman'ın anlattığı, çakıl ve belirsizlik satışını yasaklayan bir hadisi aktardı ve Zakeriye el-Ensari'nin Asna al-Matalib'de (2/11) belirsizliğin iki konu arasında yaygın olarak tartışılan konu olduğunu ve çoğu daha korkutucu olduğunu aktardı. Bazıları sonuçların ima edildiğini söyler, o ise burada belirsizliğin kutuların içinde ne olduğu ve değerlerinin bilinmemesi, fiyattan yüksek veya düşük olabileceği anlamına geldiğini belirtti. Geçerli satış koşullarının olmaması ve yasak belirsizliğin varlığı nedeniyle bu rastgele kutuların satılmasının veya alınmasının izin verilmediğini sonucuna vardı."
  id: "Sebuah pertanyaan tentang penjualan kotak acak, di mana Departemen Fatwa Umum Yordania menjawab bahwa jika kotak tersebut adalah barang yang dijual dan mengandung izin, maka penjualan itu sah; jika isinya tidak terlihat oleh barang yang dijual, maka penjualan tersebut tidak sah karena ketidakpastian. Oleh karena itu, tidak diperbolehkan menjual atau membeli kotak acak yang dijelaskan. Departemen menjawab bahwa penjualan memiliki elemen dan syarat, termasuk mengetahui barang yang terjual untuk mencegah ketidaktahuan. Jika barang yang dijual tidak diketahui karena kurangnya visibilitas, maka penjualan tersebut tidak sah. Departemen mengutip Ibn Al-Naqib dalam Umdat Al-Salik (hal. 150) bahwa menjual barang selain barang yang ditentukan atau barang yang tidak ada tidak sah. Dari Nihayat Al-Zain (hal. 226), tidak sah menjual barang yang tidak dilihat oleh salah satu pihak yang berkontrak, meskipun barang tersebut hadir dalam sesi kontrak. Dia mengatakan bahwa ada dua kasus dalam kasus ini: jika kotak adalah barang yang dimaksudkan dan barang di dalamnya diberikan kepada pembeli penjualan yang sah karena barang dan harga yang diketahui; dan jika barang dalam kotak adalah barang yang dimaksudkan untuk dijual, maka barang tersebut tidak terlihat dan tidak diketahui, yang dianggap sebagai ketidakpastian terlarang. Dia mengutip hadits yang diceritakan oleh Muslim dari Abu Huraira yang melarang penjualan kerikil dan penjualan ketidakpastian, serta mengutip Zakariya al-Ansari dalam Asna al-Matalib (2/11) bahwa ketidakpastian adalah yang sering dibahas antara dua hal, yang sebagian besar lebih menakutkan. Beberapa mengatakan konsekuensinya tersirat, dan dia mengatakan ketidakpastian di sini adalah apa yang ada di dalam kotak dan nilainya tidak diketahui, yang bisa lebih tinggi atau lebih rendah dari harga. Dia menyimpulkan bahwa tidak diperbolehkan menjual atau membeli kotak-kotak acak ini karena tidak adanya syarat yang sah untuk dijual dan adanya ketidakpastian terlarang."
