id: work/fatwa-dar-alifta-eg-shaving-newborn-girls-hair
class: work
kind: fatwa
label: { ar: "حكم حلق شعر المولودة الأنثى", en: "Shaving a newborn girl's hair", ur: "نومولود لڑکی کے بال مڑوانا", es: "Afeitar el cabello de una niña recién nacida" }
summary:
  ar: "سائل سأل عن حلق شعر المولودة الأنثى يوم سابعها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21598)⁩ أن حلق شعر المولود يوم سابعه والتصدق بزنته ذهبًا أو فضة أو قيمة أحدهما لمن قدر عليه أمر مستحب ولا فرق في ذلك بين الذكر والأنثى على ما فصّل الجواب."
  en: "A questioner asked about shaving a newborn girl's hair on her seventh day. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21598) answered that shaving the newborn's hair on the seventh day and giving its weight in gold, silver or value as charity is recommended for whoever can — with no difference between boy and girl — as the answer details."
  ur: "ایک سائل نے نومولود لڑکی کے ساتویں دن بال مڑوانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21598)⁩ نے جواب دیا کہ بچے کے بال ساتویں دن مڑوانا اور ان کے وزن کے برابر سونا چاندی یا مالیت صدقہ کرنا مستحب ہے اور لڑکا لڑکی میں فرق نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de rapar el cabello de una recién nacida al séptimo día de nacida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21598) respondió que rapar el cabello de la recién nacida al séptimo día y donar su peso en oro, plata o cualquier otro valor como caridad es recomendable para quien pueda hacerlo, sin distinción entre niño y niña, como se detalla en la respuesta."
