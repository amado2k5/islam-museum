id: work/fatwa-aliftaa-jo-duplicate-books-in-a-mosque-library
class: work
kind: fatwa
label: { ar: "إخراج الكتب المكررة من مكتبة المسجد", en: "Removing duplicate books from a mosque library", ur: "مسجد کی لائبریری سے مکرر کتابیں نکالنا" }
summary:
  ar: "سؤال عن إخراج النسخ المكررة الزائدة من مكتبة مسجد لصالح مكتبات أخرى، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحكم يختلف بحسب طريقة وصول الكتاب إلى المكتبة، وأن القرار يرجع إلى وزارة الأوقاف. أجابت الدائرة بأن ما وُقف على مسجد معين الأصل بقاؤه فيه، ولا يجوز نقله أو بيعه إلا لمسوغ شرعي، فإن بلي أو جيء بمثله وثبت تعذر الانتفاع به في المسجد جاز نقله إلى مسجد آخر تحقيقًا لغرض الوقف، ونقلت عن النووي في روضة الطالبين وعن إعانة الطالبين. وما اشتُري من التبرعات ولم يقفه الناظر، أو أهداه المؤلفون دون تصريح بالوقف، فيجوز بيعه والتصرف فيه للحاجة وصرفه في مصالح المكتبة، لأنه ملك للمسجد كما نقلت عن النووي. وما وضعه شخص في المسجد لانتفاع المصلين دون نية وقف أو إهداء فهو عارية يبقى على ملك صاحبه. وخلصت إلى أن القرار في هذه المسائل يرجع إلى وزارة الأوقاف والشؤون والمقدسات الإسلامية بوصفها متولية الوقف بموجب قانون الأوقاف رقم 32 لسنة 2001."
  en: "A question on moving surplus duplicate copies from a mosque library to other libraries, in which Jordan's General Iftaa Department answered that the ruling depends on how each book reached the library, and that the decision rests with the Ministry of Awqaf. The Department answered that what is endowed to a specific mosque should in principle stay there and may not be moved or sold without a lawful reason; if it wears out, or a replacement has been brought and it cannot be used in the mosque, it may be moved to another mosque to fulfil the endowment's purpose, quoting al-Nawawi's Rawdat al-Talibin and I'anat al-Talibin. What was bought from donations and not endowed by the administrator, or given by authors without stating it is an endowment, may be sold or disposed of when needed, with the proceeds spent on the library, since it is the mosque's property, as it quoted from al-Nawawi. Something a person placed in the mosque for worshippers' use without intending an endowment or gift is a loan that remains its owner's property. It concluded that the decision in these matters rests with the Ministry of Awqaf, Islamic Affairs and Holy Places as the endowments' administrator under Awqaf Law no. 32 of 2001."
  ur: "مسجد کی لائبریری سے زائد مکرر نسخے دوسری لائبریریوں کو منتقل کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حکم اس پر منحصر ہے کہ کتاب لائبریری تک کیسے پہنچی، اور فیصلہ وزارتِ اوقاف کا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو چیز کسی خاص مسجد پر وقف ہو اصلاً وہیں رہے اور شرعی وجہ کے بغیر منتقل یا فروخت نہ ہو؛ اگر وہ بوسیدہ ہو جائے، یا اس کا متبادل آ جائے اور مسجد میں اس سے فائدہ ممکن نہ رہے، تو وقف کا مقصد پورا کرنے کے لیے اسے دوسری مسجد منتقل کیا جا سکتا ہے؛ اس نے نووی کی روضۃ الطالبین اور اعانۃ الطالبین سے نقل کیا۔ جو عطیات سے خریدا گیا اور ناظر نے وقف نہیں کیا، یا مصنفین نے وقف کی صراحت کے بغیر دیا، اسے ضرورت کے وقت بیچا جا سکتا ہے اور رقم لائبریری کے مصالح پر خرچ ہو، کیونکہ وہ مسجد کی ملکیت ہے، جیسا کہ اس نے نووی سے نقل کیا۔ جو کسی نے نمازیوں کے فائدے کے لیے وقف یا تحفے کی نیت کے بغیر مسجد میں رکھا وہ عاریت ہے اور اپنے مالک کی ملکیت میں رہتا ہے۔ اس نے نتیجہ نکالا کہ ان مسائل میں فیصلہ 2001 کے اوقاف قانون نمبر 32 کے تحت وقف کی متولی وزارتِ اوقاف و شؤون و مقدساتِ اسلامیہ کا ہے۔"
