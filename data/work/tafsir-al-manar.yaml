summary:
  ar: "تفسير للقرآن الكريم لمحمد رشيد رضا، بناه على دروس شيخه محمد عبده، وكان يُنشر فصولاً في مجلة المنار من سنة 1318هـ. يقصد إلى هداية القرآن ومعالجة أحوال المسلمين في زمنه، ولم يتمّه مؤلفه، فبلغ به الآية 52 من سورة يوسف بحسب ما يذكره المحقق في تقديم الطبعة."
  en: "Tafsir of the Qur'an by Muhammad Rashid Rida, built on the lessons of his teacher Muhammad Abduh and printed in installments in al-Manar from 1318 AH. It aims at the guidance the Qur'an gives and at the needs of Muslims in its author's time. The author did not finish it; the editor says it reaches Q. 12:52."
  es: "Tafsir del Corán, de Muhammad Rashid Rida, basado en las enseñanzas de su maestro Muhammad Abduh e impreso por entregas en al-Manar desde el año 1318 de la Hégira. Su objetivo es brindar la guía que ofrece el Corán y atender las necesidades de los musulmanes en la época de su autor. El autor no lo terminó; el editor afirma que llega hasta el versículo 12:52 del Corán."
  fr: "Explication du Coran par Muhammad Rashid Rida, basée sur les enseignements de son maître Muhammad Abduh et publiée par épisodes dans al-Manar à partir de 1318 AH. Elle vise à exposer les enseignements du Coran et à répondre aux besoins des musulmans de l'époque de son auteur. Ce dernier ne l'a pas achevé; l'éditeur indique qu'il atteint la sourate 12, verset 52."
