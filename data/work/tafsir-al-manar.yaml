summary:
  ar: "تفسير للقرآن الكريم لمحمد رشيد رضا، بناه على دروس شيخه محمد عبده، وكان يُنشر فصولاً في مجلة المنار من سنة 1318هـ. يقصد إلى هداية القرآن ومعالجة أحوال المسلمين في زمنه، ولم يتمّه مؤلفه، فبلغ به الآية 52 من سورة يوسف بحسب ما يذكره المحقق في تقديم الطبعة."
  en: "Tafsir of the Qur'an by Muhammad Rashid Rida, built on the lessons of his teacher Muhammad Abduh and printed in installments in al-Manar from 1318 AH. It aims at the guidance the Qur'an gives and at the needs of Muslims in its author's time. The author did not finish it; the editor says it reaches Q. 12:52."
