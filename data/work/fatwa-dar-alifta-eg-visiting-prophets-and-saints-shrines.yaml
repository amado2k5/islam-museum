id: work/fatwa-dar-alifta-eg-visiting-prophets-and-saints-shrines
class: work
kind: fatwa
label: { ar: "حكم زيارة مقامات الأنبياء والأولياء والصالحين وآل البيت", en: "Visiting the shrines of prophets, saints, the righteous and the Prophet's family", ur: "انبیاء، اولیاء، صالحین اور اہل بیت کے مقامات کی زیارت", es: "Visitar los santuarios de profetas, santos, justos y la familia del Profeta.", fr: "Visiter les sanctuaires des prophètes, des saints, des justes et de la famille du Prophète" }
summary:
  ar: "سائل سأل عن زيارة مقامات الأنبياء والأولياء والصالحين وآل البيت. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22102)⁩ أن زيارة مقام النبي وروضته من أفضل القربات وزيارة الأضرحة ومقامات الصالحين وآل البيت من الأمور المشروعة بضوابطها على ما فصّل الجواب."
  en: "A questioner asked about visiting the shrines of prophets, saints, the righteous and the Prophet's family. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22102) answered that visiting the Prophet's resting place and his Rawda is among the best devotions, and visiting the shrines of the righteous and the Prophet's household is lawful within its controls — as the answer details."
  ur: "ایک سائل نے انبیاء، اولیاء، صالحین اور اہل بیت کے مقامات کی زیارت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22102)⁩ نے جواب دیا کہ نبی کے روضے کی زیارت بہترین قربتوں میں ہے اور صالحین اور اہل بیت کے مقامات کی زیارت اپنے ضوابط کے ساتھ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de visitar los santuarios de profetas, santos, justos y la familia del Profeta. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22102) respondió que visitar el lugar de descanso del Profeta y su Rawda se encuentra entre las mejores devociones, y que visitar los santuarios de los justos y la familia del Profeta es lícito dentro de sus competencias, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la visite des mausolées des prophètes, des saints, des pieux et de la famille du Prophète. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22102) a répondu que la visite du lieu de repos du Prophète et de sa Rawda compte parmi les meilleures dévotions, et que la visite des mausolées des pieux et de la famille du Prophète est licite, dans le respect de ses préceptes – comme le précise la réponse."
