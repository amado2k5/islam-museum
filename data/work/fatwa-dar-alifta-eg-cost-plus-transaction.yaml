summary:
  ar: "سائل سأل عن التعامل بنظام الكوست بلس وفق الصورة الواردة في السؤال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21497)⁩ أن التعامل به جائز ولا حرج فيه شرعًا مع وجوب مراعاة الأمانة في أداء العمل على ما فصّل الجواب."
  en: "A questioner asked about dealing under the cost-plus system in the form described. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21497) answered that dealing under it is permissible without blame, provided trustworthiness is observed in performing the work — as the answer details."
  ur: "ایک سائل نے بیان کردہ صورت میں کاسٹ پلس نظام کے تحت معاملے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21497)⁩ نے جواب دیا کہ یہ جائز ہے بشرطیکہ کام میں امانت رکھی جائے — جیسا کہ جواب میں تفصیل ہے۔"
