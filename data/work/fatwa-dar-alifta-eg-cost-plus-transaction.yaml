id: work/fatwa-dar-alifta-eg-cost-plus-transaction
class: work
kind: fatwa
label: { ar: "التعامل بصورة من صور ما يعرف بنظام الكوست بلس", en: "Dealing under a form of the cost-plus system", ur: "کاسٹ پلس نظام کی ایک صورت میں معاملہ", es: "Operar bajo una forma del sistema de costo más margen", fr: "Traiter selon une forme de système de prix de revient majoré", tr: "Maliyet Artı sistemi olarak bilinen bir tür sistemle başa çıkmak", id: "Menangani bentuk dari apa yang dikenal sebagai sistem Cost Plus" }
summary:
  ar: "سائل سأل عن التعامل بنظام الكوست بلس وفق الصورة الواردة في السؤال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21497)⁩ أن التعامل به جائز ولا حرج فيه شرعًا مع وجوب مراعاة الأمانة في أداء العمل على ما فصّل الجواب."
  en: "A questioner asked about dealing under the cost-plus system in the form described. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21497) answered that dealing under it is permissible without blame, provided trustworthiness is observed in performing the work — as the answer details."
  ur: "ایک سائل نے بیان کردہ صورت میں کاسٹ پلس نظام کے تحت معاملے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21497)⁩ نے جواب دیا کہ یہ جائز ہے بشرطیکہ کام میں امانت رکھی جائے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de operar bajo el sistema de costo más margen de beneficio en la forma descrita. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21497) respondió que operar bajo este sistema es permisible sin culpa, siempre que se observe honestidad en la ejecución del trabajo, tal como se detalla en la respuesta."
  fr: "Un interlocuteur a posé une question concernant les transactions effectuées selon le système de rémunération au prix coûtant majoré, tel que décrit. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21497) a répondu que ces transactions sont permises sans reproche, à condition que la fiabilité soit de mise dans l'exécution du travail – comme le précise la réponse."
  tr: "Bir soru soran kişi, soruda gösterildiği gibi Maliyet Artı sistemiyle ilgili bir işlem hakkında bilgi aldı. Mısır Dar el-İftası (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21497), bununla ilgilenmenin iciz olduğunu ve İslam hukukuna göre zararı olmadığını, işin yürütülmesinde güvenilirliğe uyulması gerektiğini, yanıtta ayrıntılı olarak belirtildiği gibi, yanıtında belirtildiği gibi, bunu söyledi."
  id: "Seorang penanya menanyakan tentang penanganan sistem Cost Plus seperti yang ditunjukkan dalam pertanyaan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21497) menjawab bahwa menangani sistem ini diperbolehkan dan tidak ada kerugian menurut hukum Islam, dengan kewajiban untuk menjaga kepercayaan dalam melakukan pekerjaan, sebagaimana dijelaskan dalam jawaban."
