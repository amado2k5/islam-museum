label: { ar: "حكم ترك طواف الوداع للمرأة الحامل", en: "May the pregnant woman omit the farewell tawaf?", ur: "حاملہ عورت کا طوافِ وداع چھوڑنا" }
summary:
  ar: "سائل سأل عن ترك المرأة الحامل طواف الوداع على النحو الوارد في السؤال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20994)⁩ أنه لا يلزمها بتركه طواف الوداع شيء وحجها صحيح ما دامت قد أتت بأركانه على ما فصّل الجواب."
  en: "A questioner asked about a pregnant woman omitting the farewell tawaf as described. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20994) answered that nothing is due from her for omitting it and her Hajj is valid since she performed its pillars — as the answer details."
  ur: "ایک سائل نے حاملہ عورت کے طوافِ وداع چھوڑنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20994)⁩ نے جواب دیا کہ چھوڑنے پر اس پر کچھ واجب نہیں اور اس کا حج صحیح ہے کیونکہ اس نے ارکان ادا کیے — جیسا کہ جواب میں تفصیل ہے۔"
