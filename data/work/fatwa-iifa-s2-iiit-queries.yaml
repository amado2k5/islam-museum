summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن استفسارات المعهد العالمي للفكر الإسلامي بواشنطن: تكليف الأمانة العامة بإحالة الأسئلة على من تراه من الأعضاء أو الخبراء لإعداد إجابات معللة مستندة على الأدلة الشرعية وأقوال فقهاء المسلمين ورفعها إلى الدورة الثالثة."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on the queries of the International Institute of Islamic Thought in Washington: the secretariat was tasked with referring the questions to members or experts to prepare reasoned answers grounded in sharia evidence and the earlier jurists' opinions, to be laid before the third session."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩: واشنگٹن کے معہد کے سوالات ماہرین کو بھیج کر دلیلوں پر مبنی جوابات تیار کروا کر تیسری مجلس میں پیش کرنے کا حکم۔"
  es: "Resolución del segundo período de sesiones de la IIFA (Kuwait, diciembre de 1985) sobre las preguntas del Instituto Internacional de Pensamiento Islámico en Washington: se encomendó a la secretaría la tarea de remitir las preguntas a los miembros o expertos para que prepararan respuestas razonadas basadas en pruebas de la sharia y en las opiniones de juristas anteriores, que se presentarían antes del tercer período de sesiones."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985) sur les questions de l'Institut international de la pensée islamique à Washington: le secrétariat a été chargé de soumettre les questions aux membres ou aux experts afin de préparer des réponses raisonnées fondées sur des preuves de la charia et sur les opinions des juristes antérieurs, à présenter à la troisième session."
