id: work/fatwa-amja-jinn-possession-real
class: work
kind: fatwa
label: { ar: "إثبات دخول الجني في بدن الإنسان", en: "Affirming that the jinni enters the human body", ur: "جن کا انسانی جسم میں داخل ہونا ثابت ہے", es: "Afirmar que el genio entra en el cuerpo humano", fr: "Affirmant que le djinn pénètre dans le corps humain" }
summary:
  ar: "سأل سائل عن حديث إن الرقى والتمائم والتولة شرك وعن أمر يتصل بذلك. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81305 بتاريخ 14 أبريل 2010)⁩ أنه لم يتبين له مقصود السائل على وجه التحديد فإن كان يريد نفي المس كما يقول بعض من مسه طائف من الاعتزال إنه ليس من الممكنات ولا المعقولات فقد أخطأ، فإن دخول الجني في بدن الإنسان ثابت باتفاق أئمة أهل السنة والجماعة، ومن أدلته قوله تعالى الذين يأكلون الربا لا يقومون إلا كما يقوم الذي يتخبطه الشيطان من المس، وقوله إن الشيطان يجري من ابن آدم مجرى الدم وقد استدل به الأكابر من العلماء على إمكان دخول الجان جسد الإنسان كالقرطبي وابن تيمية وغيرهما."
  en: "A questioner cited the hadith that incantations, amulets and love-charms are shirk, touching on the question of spirit possession. Dr. Salah al-Sawi (fatwa no. 81305, 14 April 2010) answered that the questioner's intent was unclear — but if he means to deny possession, as some touched by the Mu'tazila hold that it is neither possible nor conceivable, he is wrong: a jinni entering a human body is established by the agreement of the imams of the sunna and the community; among the proofs are 'those who consume usury rise only as one the devil drives mad by touch', and the sound report that the devil runs in the son of Adam like blood, which the great scholars — al-Qurtubi, Ibn Taymiyya and others — used for the possibility of the jinn's entering the human body. Recorded as AMJA's answer."
  ur: "ایک سائل نے جن کے انسان کے جسم میں داخل ہونے پر سوال اٹھایا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81305، 14 اپریل 2010)⁩ کے مطابق اہل سنت ائمہ کے اتفاق سے یہ ثابت ہے — آیت و حدیث کی رو سے جن کے داخل ہونے کا امکان مسلم ہے۔"
  es: "Un consultante citó el hadiz que afirma que los encantamientos, amuletos y talismanes de amor son shirk (idolatría), abordando la cuestión de la posesión espiritual. El Dr. Salah al-Sawi (fatwa n.° 81305, 14 de abril de 2010) respondió que la intención del consultante no estaba clara; pero si pretendía negar la posesión, como sostienen algunos influenciados por los Mu'tazila, que consideran que no es posible ni concebible, se equivocaba: la entrada de un genio en un cuerpo humano está establecida por el consenso de los imanes de la sunna y la comunidad; entre las pruebas se encuentran «quienes consumen usura solo resucitan como aquellos a quienes el diablo enloquece con el tacto», y el relato fidedigno de que el diablo corre en el hijo de Adán como la sangre, que los grandes eruditos —al-Qurtubi, Ibn Taymiyya y otros— utilizaron para la posibilidad de que los genios entraran en el cuerpo humano. Registrado como respuesta de AMJA."
  fr: "Un interrogateur a cité le hadith selon lequel les incantations, les amulettes et les charmes d'amour constituent du shirk, abordant ainsi la question de la possession spirituelle. Le Dr Salah al-Sawi (fatwa n° 81305, 14 avril 2010) a répondu que l'intention de l'interrogateur était ambiguë. Toutefois, s'il entendait nier la possession, comme le soutiennent certains Mu'tazilites qui la jugent impossible et inconcevable, il se trompait: l'entrée d'un djinn dans un corps humain est un fait établi par les imams de la Sunna et la communauté. Parmi les preuves, on trouve l'adage selon lequel « ceux qui pratiquent l'usure deviennent fous par simple contact avec le diable », ainsi que le récit authentique selon lequel le diable coule dans le corps du fils d'Adam comme le sang, récit que les grands savants – al-Qurtubi, Ibn Taymiyya et d'autres – ont utilisé pour évoquer la possibilité de l'entrée d'un djinn dans le corps humain. Cette réponse a été consignée dans la fatwa de l'AMJA."
