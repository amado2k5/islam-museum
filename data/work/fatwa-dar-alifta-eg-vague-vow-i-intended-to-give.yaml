id: work/fatwa-dar-alifta-eg-vague-vow-i-intended-to-give
class: work
kind: fatwa
label: { ar: "مدى لزوم النذر بقول الشخص نويت إخراج شيء لله", en: "Does saying 'I intended to give something for God' bind as a vow?", ur: "کیا 'اللہ کے لیے کچھ دینے کی نیت کی' کہنا نذر بن جاتا ہے؟", es: "¿Decir \"Tenía la intención de dar algo a Dios\" constituye un voto vinculante?" }
summary:
  ar: "سائل قال نويت إخراج شيء لله فسأل عن مدى لزوم النذر بذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21704)⁩ أنه إن كانت نية المتلفظ بكلمة إخراج شيء لله النذر فإنه يلزمه الوفاء به ويجب عليه إخراج ما نواه على ما فصّل الجواب."
  en: "A man said 'I intended to give something for God' and asked whether it binds him as a vow. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21704) answered that if the speaker's intention was a vow he must fulfil it and pay out what he intended — as the answer details."
  ur: "ایک شخص نے کہا 'اللہ کے لیے کچھ نکالنے کی نیت کی' اور پوچھا کہ کیا یہ نذر بن گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21704)⁩ نے جواب دیا کہ اگر کہنے والے کی نیت نذر کی تھی تو اسے پورا کرنا ہوگا اور جو نوا تھا نکالنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre dijo: «Tenía la intención de dar algo a Dios» y preguntó si eso lo obligaba como voto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21704) respondió que si la intención del hablante era un voto, debe cumplirlo y entregar lo que se propuso, tal como se detalla en la respuesta."
