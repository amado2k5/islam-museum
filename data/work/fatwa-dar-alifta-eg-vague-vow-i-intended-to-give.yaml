id: work/fatwa-dar-alifta-eg-vague-vow-i-intended-to-give
class: work
kind: fatwa
label: { ar: "مدى لزوم النذر بقول الشخص نويت إخراج شيء لله", en: "Does saying 'I intended to give something for God' bind as a vow?", ur: "کیا 'اللہ کے لیے کچھ دینے کی نیت کی' کہنا نذر بن جاتا ہے؟", es: "¿Decir \"Tenía la intención de dar algo a Dios\" constituye un voto vinculante?", fr: "L'affirmation « J'avais l'intention de donner quelque chose à Dieu » a-t-elle valeur de vœu ?", tr: "Tanrı için bir şey getirmeyi amaçladığımı söyleyen kişinin yemin gerekliliğinin boyutu", id: "Sejauh mana pentingnya sumpah itu oleh orang yang mengatakan saya bermaksud membawa sesuatu untuk Tuhan" }
summary:
  ar: "سائل قال نويت إخراج شيء لله فسأل عن مدى لزوم النذر بذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21704)⁩ أنه إن كانت نية المتلفظ بكلمة إخراج شيء لله النذر فإنه يلزمه الوفاء به ويجب عليه إخراج ما نواه على ما فصّل الجواب."
  en: "A man said 'I intended to give something for God' and asked whether it binds him as a vow. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21704) answered that if the speaker's intention was a vow he must fulfil it and pay out what he intended — as the answer details."
  ur: "ایک شخص نے کہا 'اللہ کے لیے کچھ نکالنے کی نیت کی' اور پوچھا کہ کیا یہ نذر بن گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21704)⁩ نے جواب دیا کہ اگر کہنے والے کی نیت نذر کی تھی تو اسے پورا کرنا ہوگا اور جو نوا تھا نکالنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre dijo: «Tenía la intención de dar algo a Dios» y preguntó si eso lo obligaba como voto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21704) respondió que si la intención del hablante era un voto, debe cumplirlo y entregar lo que se propuso, tal como se detalla en la respuesta."
  fr: "Un homme a déclaré: « J'avais l'intention de faire un don à Dieu », et a demandé si cela l'engageait comme un vœu. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21704) a répondu que si l'intention de l'orateur était un vœu, il devait l'accomplir et verser la somme prévue, comme le précise la réponse."
  tr: "Bir soru soran kişi şöyle dedi: Ben Allah için bir şey vermek istedim, bu yüzden yemin yükümlülüğünü sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21704), sözü söyleyen kişinin niyeti Tanrı için yemin etmekse, bunu yerine getirmesi ve niyetini yerine getirmesi gerektiğini yanıtladı."
  id: "Seorang penanya berkata: Saya berniat memberikan sesuatu untuk Tuhan, jadi ia bertanya tentang kewajiban sumpah untuk melakukannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21704) menjawab bahwa jika niat orang yang mengucapkan firman itu adalah untuk membuat sumpah kepada Tuhan, maka ia harus menepatinya dan memenuhi niatnya seperti yang dijelaskan dalam jawaban."
