label: { ar: "المقتبس في أخبار بلد الأندلس", en: "Al-Muqtabis fi Akhbar Balad al-Andalus (Ibn Hayyan)", ur: "المقتبس فی اخبار بلد الاندلس ⁦(ابن حیان)⁩" }
summary:
  ar: "كتاب أبي مروان ابن حيان القرطبي ⁦(377–469هـ)⁩ في تاريخ الأندلس منذ الفتح إلى زمن المؤلف، في عشرة أجزاء، ضاع أكثرها؛ وسمّاه ابن حزم «كتاب التاريخ الكبير» ووصفه بأنه «من أجلّ كتاب أُلّف في هذا المعنى»؛ ومن قطعه الباقية جزء عن عهد الأمير عبد الله، وجزء ناقص عن عبد الرحمن الثاني والأمير محمد، وقطعة عن خمس سنوات من أيام الحكم المستنصر ⁦(360–364هـ)⁩ {cite:al-muqtabis-ibn-hayyan-hajji-dar-al-thaqafa p. 12-15}."
  en: "The history of al-Andalus from the conquest to the author's own time by Abu Marwan Ibn Hayyan al-Qurtubi (377–469 AH), in ten parts, most of them lost. Ibn Hazm called it 'the Great History' and 'among the finest books written on the subject'. Surviving sections include one on the reign of the amir 'Abd Allah, an incomplete one on 'Abd al-Rahman II and the amir Muhammad, and one on five years of the reign of al-Hakam al-Mustansir (360–364 AH) {cite:al-muqtabis-ibn-hayyan-hajji-dar-al-thaqafa p. 12-15}."
  ur: "ابو مروان ابن حیان قرطبی ⁦(377–469ھ)⁩ کی کتاب، جو فتح سے مصنف کے زمانے تک اندلس کی تاریخ پر دس اجزاء میں ہے، جن میں سے اکثر ضائع ہو گئے۔ ابن حزم نے اسے «کتاب التاریخ الکبیر» کہا اور «اس موضوع پر لکھی گئی بہترین کتابوں میں سے» قرار دیا۔ اس کے باقی حصوں میں امیر عبد اللہ کے عہد پر ایک جزء، عبد الرحمن ثانی اور امیر محمد پر ایک ناقص جزء، اور حکم المستنصر کے عہد کے پانچ سالوں ⁦(360–364ھ)⁩ پر ایک قطعہ شامل ہیں {cite:al-muqtabis-ibn-hayyan-hajji-dar-al-thaqafa p. 12-15}۔"
