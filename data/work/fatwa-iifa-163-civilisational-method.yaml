label: { ar: "قرار مجمع الفقه الإسلامي الدولي 163 (18/1) بشأن معالم العودة إلى المنهج الحضاري في الإسلام", en: "IIFA resolution 163 (18/1) on the outlines of a return to the civilisational method in Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 163 (18/1): اسلام میں تہذیبی منہج کی طرف واپسی کی نشانیاں", es: "Resolución 163 (18/1) de la IIFA sobre los esbozos de un retorno al método civilizatorio en el Islam.", fr: "Résolution 163 (18/1) de l'IIFA sur les grandes lignes d'un retour à la méthode civilisationnelle en islam", tr: "Uluslararası İslami Fiqh Akademisi Kararı 163 (18/1) İslam'da medeniyet yaklaşımına dönüşün özelliklerine ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 163 (18/1) mengenai ciri-ciri kembali ke pendekatan peradaban dalam Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثامنة عشرة ببوتراجايا ⁦(24–29 جمادى الآخرة 1428هـ، 9–14 يوليو 2007م)⁩، من نوع القرارات التوجيهية. استحضر ما عدّه سبق الإسلام إلى تأسيس «الدولة الرشيدة» ووثيقة المدينة وإعلان حقوق الإنسان في خطبة الوداع، وقرر أن اتباع المنهج الحضاري الإسلامي يتيح للمسلمين استعادة دورهم وتقديم رسالتهم الإنسانية، وأن علاج التخلف يكون بالعودة الصادقة للدين وتمثل قيمه، وتناول في بنوده معالم ذلك المنهج في النواحي العقدية والتربوية والاجتماعية والاقتصادية والسياسية والإعلامية، مع توصيات للدول والمؤسسات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 18th session in Putrajaya (24–29 Jumada al-Akhira 1428, 9–14 July 2007), of the programmatic rather than technical-fiqh kind. Citing what it calls Islam's precedence in founding the 'rightly guided state', the Medina document and the Farewell Sermon's declaration of human rights, it resolved that following the Islamic civilisational method lets Muslims recover their role and offer their human message, and that the remedy for the community's backwardness is a sincere return to religion and its values — with clauses outlining that method in creedal, educational, social, economic, political and media terms, and recommendations to states and institutions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، پوتراجایا میں اٹھارویں مجلس ⁦(24–29 جمادی الآخرہ 1428ھ، 9–14 جولائی 2007ء)⁩ میں، پروگرامی نوعیت کی۔ اس نے اسلام کی طرف سے 'راشدہ ریاست' کے قیام، میثاقِ مدینہ اور خطبۂ حجۃ الوداع میں انسانی حقوق کے اعلان کو پیش کرتے ہوئے فیصلہ دیا کہ اسلامی تہذیبی منہج کی پیروی مسلمانوں کو اپنا کردار واپس دلاتی ہے اور امت کی پسماندگی کا علاج دین اور اس کی اقدار کی خالص واپسی میں ہے — اس کے بعد عقیدہ، تربیت، معاشرت، معیشت، سیاست اور ذرائع ابلاغ کے شعبوں میں اس منہج کی نشانیاں اور ریاستوں و اداروں کے لیے سفارشات۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 18.ª sesión en Putrajaya (24-29 de Jumada al-Akhira de 1428, 9-14 de julio de 2007), de carácter programático más que técnico. Citando lo que denomina el precedente del Islam en la fundación del \"estado bien guiado\", el documento de Medina y la declaración de derechos humanos del Sermón de Despedida, resolvió que seguir el método civilizatorio islámico permite a los musulmanes recuperar su papel y ofrecer su mensaje humanitario, y que el remedio para el atraso de la comunidad es un retorno sincero a la religión y sus valores, con cláusulas que describen ese método en términos doctrinales, educativos, sociales, económicos, políticos y mediáticos, y recomendaciones a los estados e instituciones."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 18e session à Putrajaya (24-29 Jumada al-Akhira 1428, soit 9-14 juillet 2007), de nature programmatique plutôt que technique (fiqh). Citant ce qu'elle appelle la prééminence de l'islam dans la fondation de « l'État bien guidé », le document de Médine et la déclaration des droits de l'homme du Sermon d'adieu, elle a décrété que le suivi de la méthode civilisationnelle islamique permet aux musulmans de retrouver leur rôle et de diffuser leur message humaniste, et que le remède au retard de la communauté est un retour sincère à la religion et à ses valeurs – assorti de clauses précisant cette méthode sur les plans doctrinal, éducatif, social, économique, politique et médiatique, et de recommandations aux États et aux institutions."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Putrajaya'daki on sekizinci oturumunda (24–29 Jumada al-Akhirah 1428 H, 9–14 Temmuz 2007) ortak kararı, rehber karar alma türünde. İslam'ın İslam'dan önce gördüğü 'Bilge Devlet'i, Medine Şartı'nı ve Veda Vaazında insan hakları bildirgesini hatırlattı ve İslami medeniyet yaklaşımını takip etmenin Müslümanların rollerini yeniden kazanmalarını ve insani görevlerini sunmalarını sağladığını, geri kalmışlığın çaresinin ise dine ve onun değerlerine samimi dönüşte olduğunu belirtti. Makalelerinde bu yaklaşımın doktrinsel, eğitimsel, sosyal, ekonomik, siyasi ve medya yönlerindeki özelliklerini ele aldı ve devletler ile kurumlar için önerilerde bulundu."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedelapan belas di Putrajaya (24–29 Jumada al-Akhirah 1428 H, 9–14 Juli 2007), bersifat pengambilan keputusan yang membimbing. Ia mengingatkan apa yang dianggap Islam mendahului Islam dalam mendirikan 'Negara Bijaksana,' Piagam Madinah, dan deklarasi hak asasi manusia dalam Khotbah Perpisahan, serta memutuskan bahwa mengikuti pendekatan peradaban Islam memungkinkan Muslim untuk mendapatkan kembali peran mereka dan menyampaikan misi kemanusiaan mereka, dan bahwa solusi untuk keterbelakangan terletak pada kembalinya agama dan nilai-nilainya yang tulus. Dalam artikelnya, ia membahas ciri-ciri pendekatan ini dalam aspek doktrinal, pendidikan, sosial, ekonomi, politik, dan media, dengan rekomendasi untuk negara dan institusi."
