id: work/fatwa-amja-praying-behind-innovator
class: work
kind: fatwa
label: { ar: "الصلاة خلف إمام مبتدع في الغرب", en: "Praying behind an innovating imam in Europe", ur: "مبتدع امام کے پیچھے نماز — مغرب میں" }
summary:
  ar: "سأل سائل مقيم في بلد أوروبي انتقل إلى جوار مسجد يؤدي فيه الصلوات الخمس ويؤمه إمامان تخرجا من مؤسسات معروفة بمناهج معينة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21853 بتاريخ 29 يناير 2007)⁩ أن كل من صحت صلاته لنفسه صحت صلاته لغيره وتصح صلاة المسلم لنفسه ما لم يتلبس بناقض جلي من نواقض الإسلام يخرجه من الملة بلا نزاع، وترك الصلاة خلف المبتدعة أو الفسقة من جنس الاحتساب عليهم والتحذير من فتنتهم وليس بسبب بطلان الصلاة في ذاتها، والسلف لم يكفروا أعيان الجهمية وإن قالوا عن بعض عقائدهم أنها من الكفر أو الشرك، فإذا أمكن ترك الصلاة خلف المبتدعة بغير مفسدة راجحة فينبغي ذلك صيانة للسنة وزجرًا للمبتدع وللعامة."
  en: "A Muslim resident of a European country who moved next to a mosque prayed its five prayers behind two imams trained in particular schools. Dr. Salah al-Sawi (fatwa no. 21853, 29 January 2007) answered that whoever's prayer is valid for himself is valid for others, and a Muslim's prayer stands unless he clearly engages a nullifier of Islam expelling him beyond dispute; leaving prayer behind innovators or sinners is of the order of disciplining them and warning against their sedition, not because the prayer itself is void — the forebears did not declare individual Jahmites disbelievers though they called some of their tenets disbelief or shirk; so if prayer behind innovators can be left without a greater corruption, it should be — guarding the sunna and deterring the innovator and the commonalty. Recorded as AMJA's answer."
  ur: "ایک سائل نے یورپ میں مبتدع امام کے پیچھے نماز پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21853، 29 جنوری 2007)⁩ کے مطابق نماز باطل نہیں مگر اگر بغیر بڑی مفسدت کے ممکن ہو تو مبتدع کے پیچھے نہ پڑھے۔"
