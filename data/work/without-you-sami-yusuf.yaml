summary:
  ar: "ألبوم نسبته تسجيلات أوايكننغ إلى سامي يوسف بوصفه ألبومه الثالث وأصدرته في 17 يناير 2009 بإحدى عشرة أغنية؛ قال سامي يوسف إنه صدر دون علمه وموافقته، وإنه تجميع لتسجيلات تجريبية، ودعا إلى مقاطعته، وقالت الشركة إنه ألبوم كامل وإن عقده معها لخمسة ألبومات؛ انتهى النزاع بفسخ العقد."
  en: "An album that Awakening Records issued as Sami Yusuf's third on 17 January 2009, with eleven songs; Sami Yusuf said it came out without his knowledge or consent, called it a compilation of demos and urged fans to boycott it, while the label said it was a complete album and that he was signed to it for five albums; the dispute ended with the contract voided."
  ur: "وہ البم جسے اویکننگ ریکارڈز نے 17 جنوری 2009 کو گیارہ گیتوں کے ساتھ سامی یوسف کا تیسرا البم کہہ کر جاری کیا؛ سامی یوسف نے کہا کہ یہ ان کی اجازت کے بغیر آیا اور ابتدائی ریکارڈنگز کا مجموعہ ہے، اور بائیکاٹ کی اپیل کی، جبکہ کمپنی نے اسے مکمل البم کہا؛ تنازع معاہدہ ختم ہونے پر منتج ہوا۔"
