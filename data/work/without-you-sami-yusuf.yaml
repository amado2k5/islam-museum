label: { ar: "بدونك", en: "Without You (Sami Yusuf album)", ur: "وِدآؤٹ یو ⁦(سامی یوسف)⁩", es: "Sin ti (álbum de Sami Yusuf)", fr: "Sans toi (album de Sami Yusuf)", tr: "Sensiz", id: "Tanpamu" }
summary:
  ar: "ألبوم نسبته تسجيلات أوايكننغ إلى سامي يوسف بوصفه ألبومه الثالث وأصدرته في 17 يناير 2009 بإحدى عشرة أغنية؛ قال سامي يوسف إنه صدر دون علمه وموافقته، وإنه تجميع لتسجيلات تجريبية، ودعا إلى مقاطعته، وقالت الشركة إنه ألبوم كامل وإن عقده معها لخمسة ألبومات؛ انتهى النزاع بفسخ العقد."
  en: "An album that Awakening Records issued as Sami Yusuf's third on 17 January 2009, with eleven songs; Sami Yusuf said it came out without his knowledge or consent, called it a compilation of demos and urged fans to boycott it, while the label said it was a complete album and that he was signed to it for five albums; the dispute ended with the contract voided."
  ur: "وہ البم جسے اویکننگ ریکارڈز نے 17 جنوری 2009 کو گیارہ گیتوں کے ساتھ سامی یوسف کا تیسرا البم کہہ کر جاری کیا؛ سامی یوسف نے کہا کہ یہ ان کی اجازت کے بغیر آیا اور ابتدائی ریکارڈنگز کا مجموعہ ہے، اور بائیکاٹ کی اپیل کی، جبکہ کمپنی نے اسے مکمل البم کہا؛ تنازع معاہدہ ختم ہونے پر منتج ہوا۔"
  es: "El 17 de enero de 2009, Awakening Records lanzó un álbum con once canciones, el tercero de Sami Yusuf. Según Sami Yusuf, el álbum se publicó sin su conocimiento ni consentimiento, lo calificó de recopilación de demos e instó a sus fans a boicotearlo, mientras que el sello discográfico afirmó que se trataba de un álbum completo y que él tenía un contrato para cinco álbumes. La disputa terminó con la anulación del contrato."
  fr: "Un album que Awakening Records a sorti le 17 janvier 2009 comme le troisième album de Sami Yusuf, avec onze chansons; Sami Yusuf a déclaré qu'il était sorti sans son consentement ni même à son insu, l'a qualifié de compilation de démos et a exhorté ses fans à le boycotter, tandis que le label a affirmé qu'il s'agissait d'un album complet et qu'il avait signé avec eux pour cinq albums; le différend s'est terminé par l'annulation du contrat."
  tr: "Awakening Recordings tarafından Sami Youssef'e atfedilen ve 17 Ocak 2009'da yayımlanan ve on bir şarkıdan oluşan bir albüm; Sami Youssef, albümün onun bilgisi veya rızası olmadan yayımlandığını, deneysel kayıtlardan oluşan bir derleme olduğunu ve boykot çağrısında bulunduğunu söyledi. Şirket, bunun tam bir albüm olduğunu ve sözleşmesinin beş albümlük olduğunu söyledi; anlaşmazlık sözleşmenin feshiyle sona erdi."
  id: "Album yang oleh Awakening Recordings dikaitkan dengan Sami Youssef sebagai album ketiganya, dirilis pada 17 Januari 2009, dengan sebelas lagu; Sami Youssef mengatakan album itu dirilis tanpa sepengetahuan atau persetujuannya, bahwa itu adalah kompilasi rekaman eksperimental, dan menyerukan boikot. Perusahaan mengatakan itu adalah album penuh dan kontraknya dengan mereka adalah lima album; perselisihan berakhir dengan pemutusan kontrak."
