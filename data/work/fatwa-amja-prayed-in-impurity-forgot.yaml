id: work/fatwa-amja-prayed-in-impurity-forgot
class: work
kind: fatwa
label: { ar: "الصلاة في النجاسة ناسيًا", en: "Prayed in impurity, forgetting — the prayer stands", ur: "بھول کر نجس کپڑوں میں نماز — صحیح", es: "Oró en impureza, olvidando — la oración permanece", fr: "Priée dans l'impureté, oubliant — la prière demeure", tr: "Kirli dua etmek, unutmak", id: "Berdoa dalam ketidakmurnian lupa" }
summary:
  ar: "سأل سائل عن حكم من صلى وفي ثوبه نجاسة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79623 بتاريخ 11 أغسطس 2009)⁩ أن إزالة النجاسة عن محمول المصلي وبدنه واجب مع الذكر والقدرة فإذا صلى بنجاسة ناسيًا أو عاجزًا عن تبديل ثيابه فصلاته صحيحة ولا تلزمه إعادة شيء منها والحمد لله على توسعته على ما فصّل الجواب."
  en: "A questioner asked about one who prayed with impurity in his garment. Dr. Salah al-Sawi (fatwa no. 79623, 11 August 2009) answered that removing impurity from the praying person's garment and body is obligatory where remembered and possible; one who prayed in impurity having forgotten, or unable to change his clothes — his prayer is valid and nothing of it is repeated, praise God for His widening — as the answer details."
  ur: "نجس کپڑے میں بھول کر نماز؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79623، 11 اگست 2009)⁩ کے مطابق بھول یا عجز میں نماز صحیح — اعادہ نہیں۔"
  es: "Un consultante preguntó sobre quien reza con impureza en su vestimenta. El Dr. Salah al-Sawi (fatwa n.° 79623, 11 de agosto de 2009) respondió que es obligatorio eliminar la impureza de la vestimenta y el cuerpo del orante cuando se recuerda y es posible; quien reza con impureza y olvida o no puede cambiarse la ropa, su oración es válida y no se repite nada de ella, alabado sea Dios por Su misericordia, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant une personne ayant prié avec des vêtements impurs. Le Dr Salah al-Sawi (fatwa n° 79623, 11 août 2009) a répondu que la purification des vêtements et du corps du priant est obligatoire lorsqu'il s'en souvient et que cela est possible; si quelqu'un a prié en état d'impureté, ayant oublié ou étant dans l'impossibilité de changer ses vêtements, sa prière est valide et n'est pas répétée, louange à Dieu pour Son abondance ! – comme le précise la réponse."
  tr: "Bir soru soran, giysi kirliyken namaz kılan kişinin hakkındaki hükmü soruldu. Dr. Salah Al-Sawy (11 Ağustos 2009 tarihli 79623 No. Fetva) ibadet edenin eşyalarından ve bedeninden kirliliği çıkarmanın anma ve yetenekle zorunlu olduğunu yanıtladı. Eğer biri unutkanlıkla veya kıyafetini değiştiremediği için kirli namazsa, namazı geçerlidir ve hiçbir şeyi tekrarlamak zorunda değildir. Cevabında açıklandığı gibi, Allah'a hamdolsun."
  id: "Seorang penanya ditanya tentang aturan terhadap seseorang yang berdoa saat pakaiannya tidak suci. Dr. Salah Al-Sawy menjawab (Fatwa No. 79623 tanggal 11 Agustus 2009) bahwa menghilangkan kotoran dari barang-barang dan tubuh penyembah adalah kewajiban dengan ingatan dan kemampuan. Jika seseorang berdoa dengan najis karena lupa atau tidak mampu mengganti pakaian, doanya sah dan dia tidak wajib mengulanginya. Segala puji bagi Allah atas perluasannya, seperti yang dijelaskan dalam jawabannya."
