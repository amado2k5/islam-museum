id: work/fatwa-amja-prayed-in-impurity-forgot
class: work
kind: fatwa
label: { ar: "الصلاة في النجاسة ناسيًا", en: "Prayed in impurity, forgetting — the prayer stands", ur: "بھول کر نجس کپڑوں میں نماز — صحیح" }
summary:
  ar: "سأل سائل عن حكم من صلى وفي ثوبه نجاسة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79623 بتاريخ 11 أغسطس 2009)⁩ أن إزالة النجاسة عن محمول المصلي وبدنه واجب مع الذكر والقدرة فإذا صلى بنجاسة ناسيًا أو عاجزًا عن تبديل ثيابه فصلاته صحيحة ولا تلزمه إعادة شيء منها والحمد لله على توسعته على ما فصّل الجواب."
  en: "A questioner asked about one who prayed with impurity in his garment. Dr. Salah al-Sawi (fatwa no. 79623, 11 August 2009) answered that removing impurity from the praying person's garment and body is obligatory where remembered and possible; one who prayed in impurity having forgotten, or unable to change his clothes — his prayer is valid and nothing of it is repeated, praise God for His widening — as the answer details."
  ur: "نجس کپڑے میں بھول کر نماز؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79623، 11 اگست 2009)⁩ کے مطابق بھول یا عجز میں نماز صحیح — اعادہ نہیں۔"
