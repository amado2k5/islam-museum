  id: "Buku al-Mas'udi 'Al-Wasat, Antara Berita Masa Ini dan Muruj al-Dhahab,' merujuk kepadanya pada awal garis keturunan dari Ibrahim hingga Nizar ibn Ma'ad, dan dalam laporan para peramal seperti laporan Samwa'al ibn 'Adiya, Khazin al-Kahin, dan lainnya {sitasi: muruj-al-dhahab hlm. 430, 500}."
