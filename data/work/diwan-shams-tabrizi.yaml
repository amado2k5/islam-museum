summary:
  ar: "بطاقة أولية لديوان شمس تبريزي، مجموعة غزليات جلال الدين الرومي التي سماها على اسم شمس الدين التبريزي؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Diwan-e Shams-e Tabrizi, Rumi's collection of ghazals named for his master Shams al-Din of Tabriz; its sources are not yet checked on the page."
  es: "Boceto de ficha para el Diwan-e Shams-e Tabrizi, la colección de gazales de Rumi que lleva el nombre de su maestro Shams al-Din de Tabriz; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche provisoire du Diwan-e Shams-e Tabrizi, recueil de ghazals de Rumi nommé d'après son maître Shams al-Din de Tabriz; ses sources ne sont pas encore vérifiées sur la page."
  ur: "دیوان شمس تبریزی کے لیے ڈرافٹ کارڈ، رومی کی غزلوں کا مجموعہ جو تبریز کے اپنے استاد شمس الدین کے نام رکھا گیا ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Şemseddin el-Tebrizi Diwanı için ön kart, Celaleddin el-Tebrizi'nin aşk şiirleri koleksiyonu ve Şemseddin el-Tebrizi adını taşıyor; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk Diwan Shams Tabrizi, kumpulan puisi cinta Jalal al-Din al-Rumi yang dinamai menurut Shams al-Din al-Tabrizi; sumber-sumbernya di halaman belum ditinjau."
