summary:
  ar: "سائل سأل عن مصافحة الناس بعضهم بعضًا وقول كلمة ⁦(حرمًا)⁩ بعد الصلاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22091)⁩ أن ذلك جائز شرعًا لما فيه من معاني الألفة والمودة بين المسلمين، على ما فصّل الجواب."
  en: "A questioner asked about people shaking hands and saying the word 'harama' after prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22091) answered that this is lawful — it carries meanings of affection and friendship among Muslims, as the answer details."
  ur: "ایک سائل نے نماز کے بعد لوگوں کے باہمی مصافحہ اور 'حرماں' کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22091)⁩ نے جواب دیا کہ یہ جائز ہے کیونکہ اس میں مسلمانوں کے مابین الفت اور محبت کے معانی ہیں، جیسا کہ جواب میں تفصیل ہے۔"
