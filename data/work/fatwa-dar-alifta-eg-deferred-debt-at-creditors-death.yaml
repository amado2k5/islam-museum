id: work/fatwa-dar-alifta-eg-deferred-debt-at-creditors-death
class: work
kind: fatwa
label: { ar: "حكم سداد الدين المؤجل عند وفاة الدائن وقبل حلول الأجل", en: "Is a deferred debt due when the creditor dies before its term?", ur: "قرض دہندہ کی وفات پر مدت سے پہلے مؤجل قرض کی ادائیگی", es: "¿Una deuda diferida vence cuando el acreedor fallece antes de su vencimiento?", fr: "Une dette différée est-elle exigible lorsque le créancier décède avant son échéance ?", tr: "Alacaklının ölümünde ve vade tarihinden önce ertelenmiş borcun ödenmesine karar verilmesi", id: "Putusan tentang pelunasan utang yang ditunda saat kreditur meninggal dan sebelum tanggal jatuh tempo" }
summary:
  ar: "سائل سأل عن سداد الدين المؤجل عند وفاة الدائن قبل حلول الأجل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21650)⁩ أن الواجب على المدين أن يسدد الدين المؤجل عند حلول أجل استحقاقه لا عند موت الدائن فليس لورثة الدائن مطالبته بسداده قبل الأجل على ما فصّل الجواب."
  en: "A questioner asked about paying a deferred debt when the creditor dies before its term. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21650) answered that the debtor must pay when the term falls due — not at the creditor's death — so the heirs cannot demand early payment, as the answer details."
  ur: "ایک سائل نے پوچھا کہ قرض دہندہ کی وفات پر مدت سے پہلے مؤجل قرض ادا کرنا ہوگا یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21650)⁩ نے جواب دیا کہ مقروض پر قرض اس کی مدت پوری ہونے پر واجب ہے نہ کہ فوت پر؛ ورثاء پہلے مطالبہ نہیں کر سکتے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el pago de una deuda aplazada cuando el acreedor fallece antes de su vencimiento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21650) respondió que el deudor debe pagar cuando vence el plazo, no al fallecer el acreedor, por lo que los herederos no pueden exigir el pago anticipado, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le paiement d'une dette différée lorsque le créancier décède avant son échéance. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21650) a répondu que le débiteur doit payer à l'échéance, et non au décès du créancier. Par conséquent, les héritiers ne peuvent exiger un paiement anticipé, comme le précise la réponse."
  tr: "Bir soru soran, alacaklının vadesinden önce vefat etmesi halinde ertelenmiş borcun ödenmesi hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21650), borçlunun ertelenmiş borcu vade tarihinde ödemekle yükümlü olduğunu, alacaklının ölümünde değil, verdiğini yanıtladı. Alacaklının mirasçıları, cevapta ayrıntılı olarak belirtildiği gibi, vade tarihinden önce ödeme talep etme hakkına sahip değildir."
  id: "Seorang penanya menanyakan tentang pelunasan utang yang ditunda setelah kreditur meninggal sebelum tanggal jatuh tempo. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21650) menjawab bahwa debitur berkewajiban membayar utang yang ditunda pada tanggal jatuh tempo, bukan pada kematian kreditur. Ahli waris kreditur tidak berhak menuntut pembayaran sebelum tanggal jatuh tempo, seperti yang dijelaskan dalam jawaban."
