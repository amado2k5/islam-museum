summary:
  ar: "مقال للدكتور جمال بدوي ⁦(25 فبراير 2012)⁩ في موقع المجلس الفقهي لأمريكا الشمالية يجيب عن سؤال مؤلف القرآن مبينًا أن المسلمين يعتقدونه كلام الله وأن الآراء الغالبة بين الكتاب الغربيين خلاف ذلك على ما فصّله المقال."
  en: "An article by Dr. Jamal Badawi (25 February 2012) on the Fiqh Council of North America site answering who authored the Qur'an: Muslims hold it to be the word of God, while the predominant views among Western writers differ — as the article details."
  ur: "ڈاکٹر جمال بدوي کا مضمون ⁦(25 فروری 2012)⁩ فقہ کونسل کی ویب سائٹ پر قرآن کی تالیف کے سوال کا جواب — مسلمان اسے کلام اللہ مانتے ہیں جبکہ مغربی مصنفین کی غالب آراء مختلف ہیں — جیسا کہ مضمون میں تفصیل ہے۔"
  es: "Un artículo del Dr. Jamal Badawi (25 de febrero de 2012) en el sitio web del Consejo de Fiqh de América del Norte responde a la pregunta de quién es el autor del Corán: los musulmanes lo consideran la palabra de Dios, mientras que las opiniones predominantes entre los escritores occidentales difieren, como se detalla en el artículo."
  fr: "Un article du Dr Jamal Badawi (25 février 2012) sur le site du Conseil Fiqh d'Amérique du Nord répond à la question de savoir qui a écrit le Coran: les musulmans le considèrent comme la parole de Dieu, tandis que les opinions prédominantes parmi les auteurs occidentaux diffèrent — comme le détaille l'article."
