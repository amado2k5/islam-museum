id: work/fatwa-aliftaa-jo-someone-who-dies-owing-fasts
class: work
kind: fatwa
label: { ar: "من مات وعليه صيام", en: "Someone who dies owing fasts", ur: "جو روزے باقی ہوتے ہوئے فوت ہو جائے" }
summary:
  ar: "سؤال عن من مات وعليه صيام، أجابت فيه دائرة الإفتاء العام الأردنية بأن من مات قبل التمكن من القضاء لا شيء عليه، ومن مات بعد التمكن يُخرج عنه من تركته مدّ طعام عن كل يوم، ويجوز لوليه أن يصوم عنه. أجابت الدائرة بأن من مات قبل تمكنه من القضاء، كمن استمر عذره حتى مات، فلا قضاء ولا فدية ولا إثم عليه. وقالت إن من مات بعد التمكن وجب تدارك ما فاته، بأن يخرج من تركته عن كل يوم مدّ طعام، واستندت إلى حديث رواه الترمذي في الإطعام عن الميت. وأضافت أنه يجوز لوليه أن يصوم عنه، استنادًا إلى حديث رواه البخاري ومسلم، وفي رواية تقييده بالمشيئة، فخلصت إلى أن الإطعام عنه جائز والصيام عنه جائز."
  en: "A question about someone who dies owing fasts, in which Jordan's General Iftaa Department answered that someone who died before being able to make up the days owes nothing, while for someone who died after being able, one mudd of food per day is paid from his estate, and his heir may fast on his behalf. The Department answered that someone who died before being able to make up the fasts, such as a person whose excuse continued until death, owes no make-up, no fidya, and bears no sin. It said that if he died after being able to make them up, what he missed must be remedied by paying one mudd of food from his estate for each day, relying on a hadith reported by al-Tirmidhi about feeding on behalf of the dead. It added that his heir may fast on his behalf, relying on a hadith reported by al-Bukhari and Muslim, with another version adding 'if he wishes', and concluded that both feeding and fasting on his behalf are permitted."
  ur: "جو روزے باقی ہوتے ہوئے فوت ہو جائے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جو قضا کی قدرت سے پہلے فوت ہو اس پر کچھ نہیں، اور جو قدرت کے بعد فوت ہو اس کے ترکے سے ہر دن کے بدلے ایک مُد غلہ دیا جائے، اور اس کا ولی اس کی طرف سے روزہ رکھ سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو قضا کی قدرت سے پہلے فوت ہو جائے، جیسے وہ شخص جس کا عذر موت تک باقی رہا، اس پر نہ قضا ہے نہ فدیہ اور نہ گناہ۔ اس نے کہا کہ اگر وہ قدرت کے بعد فوت ہو تو چھوٹے ہوئے روزوں کی تلافی واجب ہے، یعنی اس کے ترکے سے ہر دن کے بدلے ایک مُد غلہ دیا جائے، اور میت کی طرف سے کھانا کھلانے کے بارے میں ترمذی کی روایت کردہ ایک حدیث پر انحصار کیا۔ اس نے مزید کہا کہ اس کا ولی اس کی طرف سے روزہ رکھ سکتا ہے، بخاری اور مسلم کی روایت کردہ ایک حدیث کی بنا پر، جس کی ایک روایت میں 'اگر وہ چاہے' کا اضافہ ہے، اور نتیجہ نکالا کہ اس کی طرف سے کھانا کھلانا بھی جائز ہے اور روزہ رکھنا بھی۔"
