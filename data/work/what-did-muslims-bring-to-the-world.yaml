id: work/what-did-muslims-bring-to-the-world
class: work
kind: lecture-series
label:
  ar: "ماذا قدم المسلمون للعالم ⁦(برنامج تلفزيوني)⁩"
  en: "What Did Muslims Bring to the World (television programme)"
  ur: "ماذا قدم المسلمون للعالم: مسلمانوں نے دنیا کو کیا دیا ⁦(ٹیلی وژن پروگرام)⁩"
  es: "¿Qué aportaron los musulmanes al mundo? (programa de televisión)"
  fr: "Qu'ont apporté les musulmans au monde ? (émission télévisée)"
  tr: "Müslümanların Dünyaya Sundukları (TV Programı)"
  id: "Apa yang Telah Ditawarkan Muslim kepada Dunia (Program TV)"
summary:
  ar: "برنامج تلفزيوني ضيفه الدائم راغب السرجاني، يحفظ أرشيف أسابيل منه خمس عشرة حلقة مصوّرة، يجيب فيها عن أسئلة المذيع في ما قدّمته الحضارة الإسلامية للعالم: تعريف الحضارة بأبعادها الثلاثة، وحال العالم والجزيرة العربية قبل الإسلام، والقرآن والسنة رافدين للحضارة، وإسهام غير العرب، ومجتمع المدينة وتوازنه، وحقوق الإنسان والأقليات والحيوان، وأخلاق الحروب."
  en: "A television programme whose regular guest is Ragheb El-Sergani, of which the Assabile archive keeps fifteen video episodes. In them he answers the host's questions on what Islamic civilization gave the world: civilization defined by three relationships, the world and Arabia before Islam, the Qur'an and Sunna as the springs of civilization, the contribution of non-Arabs, the society of Medina and its balance, the rights of human beings, minorities and animals, and the ethics of war."
  ur: "ایک ٹیلی وژن پروگرام جس کے مستقل مہمان راغب السرجانی ہیں، اور جس کی پندرہ ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں۔ ان میں وہ میزبان کے سوالات کا جواب دیتے ہیں کہ اسلامی تہذیب نے دنیا کو کیا دیا: تین تعلقات پر مبنی تہذیب کی تعریف، اسلام سے پہلے دنیا اور جزیرۂ عرب، قرآن و سنت تہذیب کے سرچشمے، غیر عربوں کا حصہ، مدینہ کا معاشرہ اور اس کا توازن، انسانوں، اقلیتوں اور جانوروں کے حقوق، اور جنگ کے اخلاق۔"
  es: "Un programa de televisión cuyo invitado habitual es Ragheb El-Sergani, del que el archivo de Assabile conserva quince episodios en vídeo. En ellos, responde a las preguntas del presentador sobre la contribución de la civilización islámica al mundo: una civilización definida por tres relaciones, el mundo y Arabia antes del Islam, el Corán y la Sunna como fuentes de la civilización, la contribución de los no árabes, la sociedad de Medina y su equilibrio, los derechos de los seres humanos, las minorías y los animales, y la ética de la guerra."
  fr: "Une émission de télévision dont l'invité régulier est Ragheb El-Sergani, dont les archives d'Assabile conservent quinze épisodes vidéo. Dans ces émissions, il répond aux questions de l'animateur sur l'héritage de la civilisation islamique: une civilisation définie par trois relations, le monde et l'Arabie avant l'islam, le Coran et la Sunna comme sources de civilisation, la contribution des non-Arabes, la société de Médine et son équilibre, les droits des êtres humains, des minorités et des animaux, et l'éthique de la guerre."
  tr: "Düzenli konuk Ragheb Al-Sarjani'nin yer aldığı bir televizyon programı; Isabel'in on beş çekilmiş bölümden arşivini koruyor; burada sunucunun İslam uygarlığının dünyaya sundukları konusundaki sorularını yanıtlıyor: medeniyetin üç boyutunda tanımlanması, İslam öncesi dünya ve Arap Yarımadası'nın durumu, uygarlık kaynakları olarak Kur'an ve Sünnet, Arap olmayanların katkısı, şehrin toplumu ve dengesi, insan hakları, azınlıklar ve hayvanlar ile savaşın etiği konusundaki soruları yanıtlıyor."
  id: "Sebuah program televisi yang menampilkan tamu tetap Ragheb Al-Sarjani, yang melestarikan arsip Isabel dari lima belas episode yang direkam, di mana ia menjawab pertanyaan pembawa acara tentang apa yang telah disajikan peradaban Islam kepada dunia: mendefinisikan peradaban dalam tiga dimensinya, kondisi dunia dan Semenanjung Arab sebelum Islam, Al-Qur'an dan Sunnah sebagai sumber peradaban, kontribusi non-Arab, masyarakat dan keseimbangan kota, hak asasi manusia, minoritas, dan hewan, serta etika perang."
