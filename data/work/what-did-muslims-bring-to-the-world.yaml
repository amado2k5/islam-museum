label:
  ar: "ماذا قدم المسلمون للعالم (برنامج تلفزيوني)"
  en: "What Did Muslims Bring to the World (television programme)"
  ur: "ماذا قدم المسلمون للعالم: مسلمانوں نے دنیا کو کیا دیا (ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني ضيفه الدائم راغب السرجاني، يحفظ أرشيف أسابيل منه خمس عشرة حلقة مصوّرة، يجيب فيها عن أسئلة المذيع في ما قدّمته الحضارة الإسلامية للعالم: تعريف الحضارة بأبعادها الثلاثة، وحال العالم والجزيرة العربية قبل الإسلام، والقرآن والسنة رافدين للحضارة، وإسهام غير العرب، ومجتمع المدينة وتوازنه، وحقوق الإنسان والأقليات والحيوان، وأخلاق الحروب."
  en: "A television programme whose regular guest is Ragheb El-Sergani, of which the Assabile archive keeps fifteen video episodes. In them he answers the host's questions on what Islamic civilization gave the world: civilization defined by three relationships, the world and Arabia before Islam, the Qur'an and Sunna as the springs of civilization, the contribution of non-Arabs, the society of Medina and its balance, the rights of human beings, minorities and animals, and the ethics of war."
  ur: "ایک ٹیلی وژن پروگرام جس کے مستقل مہمان راغب السرجانی ہیں، اور جس کی پندرہ ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں۔ ان میں وہ میزبان کے سوالات کا جواب دیتے ہیں کہ اسلامی تہذیب نے دنیا کو کیا دیا: تین تعلقات پر مبنی تہذیب کی تعریف، اسلام سے پہلے دنیا اور جزیرۂ عرب، قرآن و سنت تہذیب کے سرچشمے، غیر عربوں کا حصہ، مدینہ کا معاشرہ اور اس کا توازن، انسانوں، اقلیتوں اور جانوروں کے حقوق، اور جنگ کے اخلاق۔"
