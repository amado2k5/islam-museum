summary:
  ar: "الخطبة التي رواها عنه المؤرخون حين دعا قومه في مكة: حمد الله وأثنى عليه ثم دعاهم إلى شهادة أن لا إله إلا الله."
  en: "The address the historians record from his public call to Quraysh in Mecca: praise of God, then the call to testify that there is no god but God."
  ur: "مکہ میں قریش کو علانیہ دعوت کے موقع کی منقولہ خطبہ: حمد و ثنا کے بعد توحید کی دعوت۔"
