id: work/fatwa-amja-leaving-jumua-on-eid-day
class: work
kind: fatwa
label: { ar: "ترك الجمعة لمن صلى العيد", en: "Leaving Jumu'a for one who prayed Eid — a dispensation, not a resolve", ur: "عید والے کا جمعہ چھوڑنا — رخصت" }
summary:
  ar: "سأل سائل عن قول بعض المشايخ إن من صلى العيد يوم الجمعة سقطت عنه الجمعة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87629 بتاريخ 22 أكتوبر 2012)⁩ أن ترك الجمعة لمن صلى العيد رخصة من الرخص وليس عزمة من العزمات حتى لا يشق عليه المجيء إلى المسجد مرتين وقد يكون ممن يشدون الرحال إلى المسجد الجامع على ما فصّل الجواب."
  en: "A questioner asked about a shaykh's saying that one who prayed Eid on a Friday has Jumu'a lifted from him. AMJA's fatwa committee (fatwa no. 87629, 22 October 2012) answered that leaving Jumu'a for the Eid-goer is a dispensation among dispensations, not a resolve among resolves — so he is not burdened with coming to the mosque twice, though he may be among those who set out to the congregational mosque — as the answer details."
  ur: "عید والے دن جمعہ؟ لجنة الفتوى ⁦(فتویٰ 87629، 22 اکتوبر 2012)⁩ کے مطابق چھوڑنا رخصت ہے نہ کہ عزیمت۔"
