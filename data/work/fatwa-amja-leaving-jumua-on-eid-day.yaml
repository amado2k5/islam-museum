id: work/fatwa-amja-leaving-jumua-on-eid-day
class: work
kind: fatwa
label: { ar: "ترك الجمعة لمن صلى العيد", en: "Leaving Jumu'a for one who prayed Eid — a dispensation, not a resolve", ur: "عید والے کا جمعہ چھوڑنا — رخصت", es: "Dejar la oración del viernes para quien rezó el Eid: una dispensa, no una decisión.", fr: "Laisser la prière du vendredi à celui qui a prié l'Aïd — une dispense, pas une résolution" }
summary:
  ar: "سأل سائل عن قول بعض المشايخ إن من صلى العيد يوم الجمعة سقطت عنه الجمعة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87629 بتاريخ 22 أكتوبر 2012)⁩ أن ترك الجمعة لمن صلى العيد رخصة من الرخص وليس عزمة من العزمات حتى لا يشق عليه المجيء إلى المسجد مرتين وقد يكون ممن يشدون الرحال إلى المسجد الجامع على ما فصّل الجواب."
  en: "A questioner asked about a shaykh's saying that one who prayed Eid on a Friday has Jumu'a lifted from him. AMJA's fatwa committee (fatwa no. 87629, 22 October 2012) answered that leaving Jumu'a for the Eid-goer is a dispensation among dispensations, not a resolve among resolves — so he is not burdened with coming to the mosque twice, though he may be among those who set out to the congregational mosque — as the answer details."
  ur: "عید والے دن جمعہ؟ لجنة الفتوى ⁦(فتویٰ 87629، 22 اکتوبر 2012)⁩ کے مطابق چھوڑنا رخصت ہے نہ کہ عزیمت۔"
  es: "Un consultante preguntó sobre las declaraciones de un jeque que afirmaban que a quien reza el Eid un viernes se le exime de la oración del viernes (Jumu'a). El comité de fatwas de AMJA (fatwa n.° 87629, 22 de octubre de 2012) respondió que eximir a quien asiste al Eid de la oración del viernes es una dispensa entre dispensas, no una resolución entre resoluciones; por lo tanto, no se le obliga a ir a la mezquita dos veces, aunque pueda estar entre quienes acuden a la mezquita congregacional, como se detalla en la respuesta."
  fr: "Un internaute a interrogé le comité de fatwas de l'AMJA (fatwa n° 87629, 22 octobre 2012) sur un avis de cheikh selon lequel celui qui prie l'Aïd un vendredi est dispensé de la prière du vendredi (Jumu'a). Ce comité a répondu que cette dispense est une exception parmi les exceptions, et non une règle absolue; par conséquent, le fidèle n'est pas tenu de se rendre deux fois à la mosquée, même s'il fait partie de ceux qui s'y rendent déjà, comme le précise la réponse."
