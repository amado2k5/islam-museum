id: work/fatwa-aliftaa-jo-requiring-a-mudarib-to-guarantee-capital
class: work
kind: fatwa
label: { ar: "اشتراط ضمان رأس المال على العامل في المضاربة", en: "Requiring the working partner to guarantee capital in a mudaraba", ur: "مضاربت میں عامل پر سرمائے کی ضمانت کی شرط" }
summary:
  ar: "سؤال عن اشتراط صاحب المال على العامل ضمان رأس المال عند الخسارة، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك لا يجوز في المضاربة، وأن صاحب المال يخسر ماله والعامل جهده، ولا يضمن العامل إلا إذا تعدى أو قصر. أجابت الدائرة بأن المضاربة عقد يدفع فيه رب المال مالًا لشخص أو شركة ليتجر به، ويكون الربح بينهما بنسبة شائعة متفق عليها. وذكرت لصحتها ضوابط: ألا يكون رأس المال مضمونًا على المضارب بل يخضع للربح والخسارة، وأن يكون حاضرًا مسلمًا لا دينًا، وأن يكون الربح حصصًا شائعة من الربح المحقق لا مبلغًا مقطوعًا ولا نسبة من رأس المال، وأن يكون الربح متحققًا فعلًا، وأن يكون الاستثمار في عمل مباح لا في الفوركس أو التسويق الشبكي والهرمي أو نظام بونزي. وقالت إن الأصل عند الخسارة أن صاحب المال يخسر ماله والعامل يخسر جهده ووقته، ولا يتحمل العامل خسارة رأس المال إلا إذا تعدى أو قصر، ويرجع تقدير ذلك إلى أهل الخبرة، ونقلت قول النووي في روضة الطالبين إن تصرف العامل مقيد بالمصلحة كتصرف الوكيل. واستشهدت بالمادة 628 من القانون المدني الأردني في أن رب المال يتحمل الخسارة وحده ولا يُعتبر شرط مخالف، وخلصت إلى أنه إذا ثبت شرعًا تعدي العامل أو تقصيره وجب عليه ضمان الخسارة بقدر ذلك."
  en: "A question about a capital owner requiring the working partner to guarantee the capital against loss, in which Jordan's General Iftaa Department answered that this is not permitted in a mudaraba: the owner loses his money and the worker his effort, and the worker is liable only if he transgresses or is negligent. The Department answered that a mudaraba is a contract in which the capital owner hands money to a person or company to trade with, the profit being shared between them in an agreed proportion of the whole. It listed conditions for its validity: the capital may not be guaranteed by the working partner but is exposed to profit and loss; it must be present and handed over, not a debt; profits must be shares of the profit actually made, not a fixed sum or a percentage of the capital; profit must be genuinely realised; and the investment must be in permitted business, not forex, network or pyramid marketing, or a Ponzi scheme. It said that in a loss the owner loses his money and the worker loses his effort and time, and the worker bears no capital loss unless he transgresses or is negligent, which experts assess; it cited al-Nawawi in Rawdat al-Talibin that the worker's dealings are bound by the owner's interest, like an agent's. It cited article 628 of the Jordanian Civil Code, under which the capital owner alone bears the loss and any contrary condition is disregarded, and concluded that if the worker's transgression or negligence is established by a sound procedure, he must make good the loss to that extent."
  ur: "سرمایہ دار کے عامل پر نقصان کی صورت میں سرمائے کی ضمانت کی شرط لگانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مضاربت میں یہ جائز نہیں: سرمایہ دار اپنا مال کھوتا ہے اور عامل اپنی محنت، اور عامل صرف زیادتی یا کوتاہی کی صورت میں ضامن ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مضاربت ایسا معاہدہ ہے جس میں سرمایہ دار کسی شخص یا کمپنی کو تجارت کے لیے مال دیتا ہے، اور منافع دونوں کے درمیان طے شدہ مشترکہ تناسب سے ہوتا ہے۔ اس نے اس کی صحت کی شرائط بیان کیں: سرمایہ عامل کی ضمانت میں نہ ہو بلکہ نفع و نقصان کے تابع ہو؛ وہ موجود اور حوالے کیا گیا ہو، قرض نہ ہو؛ منافع حاصل شدہ منافع کے مشترکہ حصے ہوں، طے شدہ رقم یا سرمائے کا فیصد نہ ہوں؛ منافع حقیقت میں حاصل ہو؛ اور سرمایہ کاری جائز کام میں ہو، فاریکس، نیٹ ورک یا اہرامی مارکیٹنگ یا پونزی اسکیم میں نہیں۔ اس نے کہا کہ نقصان کی صورت میں سرمایہ دار اپنا مال کھوتا ہے اور عامل اپنی محنت اور وقت، اور عامل سرمائے کا نقصان نہیں اٹھاتا سوائے زیادتی یا کوتاہی کے، جس کا اندازہ ماہرین کرتے ہیں؛ اس نے روضۃ الطالبین میں نووی کا قول نقل کیا کہ عامل کا تصرف وکیل کی طرح مصلحت سے مقید ہے۔ اس نے اردنی سول کوڈ کی دفعہ 628 کا حوالہ دیا جس کے مطابق نقصان صرف سرمایہ دار اٹھاتا ہے اور اس کے خلاف کوئی شرط معتبر نہیں، اور نتیجہ نکالا کہ اگر شرعی طریقے سے عامل کی زیادتی یا کوتاہی ثابت ہو جائے تو اس پر اسی قدر نقصان کی ضمانت لازم ہے۔"
