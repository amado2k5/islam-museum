id: work/fatwa-aliftaa-jo-requiring-a-mudarib-to-guarantee-capital
class: work
kind: fatwa
label: { ar: "اشتراط ضمان رأس المال على العامل في المضاربة", en: "Requiring the working partner to guarantee capital in a mudaraba", ur: "مضاربت میں عامل پر سرمائے کی ضمانت کی شرط", es: "Exigir al socio trabajador que garantice el capital en una mudaraba", fr: "Exiger que le partenaire actif garantisse le capital dans une mudaraba", tr: "Spekülasyonda Çalışan Üzerinde Sermaye Garantisi Talep Etmek", id: "Mewajibkan jaminan modal kepada pekerja dalam spekulasi" }
summary:
  ar: "سؤال عن اشتراط صاحب المال على العامل ضمان رأس المال عند الخسارة، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك لا يجوز في المضاربة، وأن صاحب المال يخسر ماله والعامل جهده، ولا يضمن العامل إلا إذا تعدى أو قصر. أجابت الدائرة بأن المضاربة عقد يدفع فيه رب المال مالًا لشخص أو شركة ليتجر به، ويكون الربح بينهما بنسبة شائعة متفق عليها. وذكرت لصحتها ضوابط: ألا يكون رأس المال مضمونًا على المضارب بل يخضع للربح والخسارة، وأن يكون حاضرًا مسلمًا لا دينًا، وأن يكون الربح حصصًا شائعة من الربح المحقق لا مبلغًا مقطوعًا ولا نسبة من رأس المال، وأن يكون الربح متحققًا فعلًا، وأن يكون الاستثمار في عمل مباح لا في الفوركس أو التسويق الشبكي والهرمي أو نظام بونزي. وقالت إن الأصل عند الخسارة أن صاحب المال يخسر ماله والعامل يخسر جهده ووقته، ولا يتحمل العامل خسارة رأس المال إلا إذا تعدى أو قصر، ويرجع تقدير ذلك إلى أهل الخبرة، ونقلت قول النووي في روضة الطالبين إن تصرف العامل مقيد بالمصلحة كتصرف الوكيل. واستشهدت بالمادة 628 من القانون المدني الأردني في أن رب المال يتحمل الخسارة وحده ولا يُعتبر شرط مخالف، وخلصت إلى أنه إذا ثبت شرعًا تعدي العامل أو تقصيره وجب عليه ضمان الخسارة بقدر ذلك."
  en: "A question about a capital owner requiring the working partner to guarantee the capital against loss, in which Jordan's General Iftaa Department answered that this is not permitted in a mudaraba: the owner loses his money and the worker his effort, and the worker is liable only if he transgresses or is negligent. The Department answered that a mudaraba is a contract in which the capital owner hands money to a person or company to trade with, the profit being shared between them in an agreed proportion of the whole. It listed conditions for its validity: the capital may not be guaranteed by the working partner but is exposed to profit and loss; it must be present and handed over, not a debt; profits must be shares of the profit actually made, not a fixed sum or a percentage of the capital; profit must be genuinely realised; and the investment must be in permitted business, not forex, network or pyramid marketing, or a Ponzi scheme. It said that in a loss the owner loses his money and the worker loses his effort and time, and the worker bears no capital loss unless he transgresses or is negligent, which experts assess; it cited al-Nawawi in Rawdat al-Talibin that the worker's dealings are bound by the owner's interest, like an agent's. It cited article 628 of the Jordanian Civil Code, under which the capital owner alone bears the loss and any contrary condition is disregarded, and concluded that if the worker's transgression or negligence is established by a sound procedure, he must make good the loss to that extent."
  ur: "سرمایہ دار کے عامل پر نقصان کی صورت میں سرمائے کی ضمانت کی شرط لگانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مضاربت میں یہ جائز نہیں: سرمایہ دار اپنا مال کھوتا ہے اور عامل اپنی محنت، اور عامل صرف زیادتی یا کوتاہی کی صورت میں ضامن ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مضاربت ایسا معاہدہ ہے جس میں سرمایہ دار کسی شخص یا کمپنی کو تجارت کے لیے مال دیتا ہے، اور منافع دونوں کے درمیان طے شدہ مشترکہ تناسب سے ہوتا ہے۔ اس نے اس کی صحت کی شرائط بیان کیں: سرمایہ عامل کی ضمانت میں نہ ہو بلکہ نفع و نقصان کے تابع ہو؛ وہ موجود اور حوالے کیا گیا ہو، قرض نہ ہو؛ منافع حاصل شدہ منافع کے مشترکہ حصے ہوں، طے شدہ رقم یا سرمائے کا فیصد نہ ہوں؛ منافع حقیقت میں حاصل ہو؛ اور سرمایہ کاری جائز کام میں ہو، فاریکس، نیٹ ورک یا اہرامی مارکیٹنگ یا پونزی اسکیم میں نہیں۔ اس نے کہا کہ نقصان کی صورت میں سرمایہ دار اپنا مال کھوتا ہے اور عامل اپنی محنت اور وقت، اور عامل سرمائے کا نقصان نہیں اٹھاتا سوائے زیادتی یا کوتاہی کے، جس کا اندازہ ماہرین کرتے ہیں؛ اس نے روضۃ الطالبین میں نووی کا قول نقل کیا کہ عامل کا تصرف وکیل کی طرح مصلحت سے مقید ہے۔ اس نے اردنی سول کوڈ کی دفعہ 628 کا حوالہ دیا جس کے مطابق نقصان صرف سرمایہ دار اٹھاتا ہے اور اس کے خلاف کوئی شرط معتبر نہیں، اور نتیجہ نکالا کہ اگر شرعی طریقے سے عامل کی زیادتی یا کوتاہی ثابت ہو جائے تو اس پر اسی قدر نقصان کی ضمانت لازم ہے۔"
  es: "Una pregunta sobre si el propietario del capital debía exigir al socio trabajador que garantizara el capital contra pérdidas, a lo que el Departamento General de Iftaa de Jordania respondió que esto no está permitido en un mudaraba: el propietario pierde su dinero y el trabajador su esfuerzo, y el trabajador solo es responsable si transgrede o actúa con negligencia. El Departamento explicó que un mudaraba es un contrato en el que el propietario del capital entrega dinero a una persona o empresa para que realice transacciones comerciales, repartiéndose las ganancias entre ellos en una proporción acordada del total. Enumeró las condiciones para su validez: el capital no puede estar garantizado por el socio trabajador, sino que está expuesto a ganancias y pérdidas; debe estar presente y entregado, no ser una deuda; las ganancias deben ser participaciones de las ganancias realmente obtenidas, no una suma fija ni un porcentaje del capital; las ganancias deben ser genuinamente realizadas; y la inversión debe realizarse en un negocio permitido, no en divisas, redes de mercadeo piramidal ni esquemas Ponzi. Se afirmó que, en caso de pérdida, el propietario pierde su dinero y el trabajador su esfuerzo y tiempo, y que el trabajador no sufre pérdida de capital a menos que cometa una transgresión o sea negligente, lo cual es evaluado por expertos; se citó a al-Nawawi en Rawdat al-Talibin, quien afirmó que las transacciones del trabajador están sujetas al interés del propietario, como las de un agente. Se citó el artículo 628 del Código Civil jordano, según el cual el propietario del capital es el único responsable de la pérdida y cualquier condición contraria queda sin efecto, y se concluyó que, si la transgresión o negligencia del trabajador se establece mediante un procedimiento sólido, este debe resarcir la pérdida en esa medida."
  fr: "Une question portait sur l'exigence, par un propriétaire de capital, que le partenaire actif garantisse le capital contre toute perte. Le Département général de l'Iftaa de Jordanie a répondu que cela n'est pas autorisé dans le cadre d'une mudaraba: le propriétaire perd son argent et le partenaire actif son travail. La responsabilité du partenaire actif n'est engagée qu'en cas de faute ou de négligence de sa part. Le Département a expliqué qu'une mudaraba est un contrat par lequel le propriétaire de capital confie des fonds à une personne ou une société pour réaliser des transactions commerciales, les bénéfices étant partagés entre eux selon une proportion convenue. Il a énuméré les conditions de validité: le capital ne peut être garanti par le partenaire actif, mais est exposé aux risques de perte et de profit; il doit être disponible et remis, et non constituer une dette; les bénéfices doivent représenter une part des bénéfices réellement réalisés, et non une somme fixe ou un pourcentage du capital; les bénéfices doivent être réellement réalisés; et l'investissement doit concerner une activité autorisée, à l'exclusion du forex, du marketing de réseau, du marketing pyramidal ou d'un système de Ponzi. Le Département a précisé qu'en cas de perte, le propriétaire perd son argent et le partenaire actif son travail et son temps, et que le partenaire actif ne subit aucune perte de capital, sauf en cas de faute ou de négligence de sa part, ce qui est évalué par des experts. L'arrêt cite al-Nawawi dans Rawdat al-Talibin, selon lequel les agissements du travailleur sont liés par les intérêts du propriétaire, à l'instar d'un mandataire. Il cite également l'article 628 du Code civil jordanien, qui stipule que seul le propriétaire du capital supporte la perte et que toute condition contraire est ignorée. En conclusion, si la faute ou la négligence du travailleur est établie par une procédure régulière, il doit réparer le préjudice à concurrence de ce préjudice."
  tr: "Paranın sahibinin işçinin sermayesini zarar durumunda garanti etme zorunluluğu hakkında soruya gelince, Ürdün Genel Fetva Dairesi bunun spekülasyonda izin verilmediğini, paranın sahibinin işçi zorlanırken parasını kaybettiğini ve işçinin ancak değeri aşması veya eksik kalması durumunda sorumlu olduğunu yanıtladı. Daire, Mudarabah'ın, sermaye sahibinin bir kişi veya şirkete ticaret yapması için para ödediği ve aralarındaki kârın ortak bir oranda gerçekleştiği bir sözleşme olduğunu belirtti. Geçerlilik kriterleri belirtildi: sermaye spekülatör tarafından garanti edilmemeli, kâr ve zarara tabi olmalı, mevcut ve Müslüman olmalı, borç olmamalı, kâr gerçekleşen kârın ortak payı olmalı, sermayenin sabit bir miktarı veya yüzdesi değil, kâr fiilen gerçekleşmeli ve yatırımın izin verilen bir işletmeye yapılması gerekir; dör, ağ veya piramit pazarlaması ya da Ponzi sistemine değil. Zararın temerrütünün mülk sahibinin parasını kaybetmesi ve işçinin çaba ve zamanını kaybetmesi olduğunu, işçinin sermaye kaybını ancak aştığı veya eksik kaldığı sürece üstleneceğini, bunun uzmanlara ait olduğunu belirtti. Rawdat al-Talibin'de Al-Nawawi'nin ifadesini alıntıladı; işçinin davranışının bir temsilcinin davranışı gibi menfaatle sınırlandırıldığını belirtti. Ürdün Medeni Kanunu'nun 628. maddesine atıfta bulunarak, mülk sahibinin tek başına zararı üstlendiğini ve bunun aksi bir koşul olarak görülmediğini belirtti. Sonuç olarak, işçinin izinsiz girişi veya ihmali yasal olarak kanıtlanırsa, bu ölçüde zarardan sorumlu tutulması gerektiğini belirtti."
  id: "Pertanyaan mengenai persyaratan pemilik uang untuk menjamin modal pekerja jika terjadi kerugian, Departemen Fatwa Umum Yordania menjawab bahwa hal ini tidak diperbolehkan dalam spekulasi, bahwa pemilik uang kehilangan uangnya sementara pekerja sedang digunakan, dan pekerja hanya bertanggung jawab jika ia melebihi atau kurang. Departemen menjawab bahwa Mudarabah adalah kontrak di mana pemilik modal membayar uang kepada seseorang atau perusahaan untuk diperdagangkan, dan keuntungan di antara mereka berada pada tingkat yang disepakati bersama. Departemen tersebut menyatakan kriteria keabsahannya: modal tidak boleh dijamin oleh spekulan tetapi tunduk pada laba rugi, harus ada dan Muslim, bukan utang, keuntungan harus merupakan bagian biasa dari keuntungan yang direalisasi, bukan jumlah tetap atau persentase modal, keuntungan harus benar-benar direalisasikan, dan investasi harus dilakukan dalam bisnis yang diizinkan, bukan dalam perdagangan forex, jaringan, atau piramida, atau sistem Ponzi. Dinyatakan bahwa kegagalan kerugian adalah pemilik properti kehilangan uangnya dan pekerja kehilangan tenaga serta waktunya, dan pekerja tidak menanggung kerugian modal kecuali melebihi atau kurang, dan penilaian ini terserah para ahli. Dia mengutip pernyataan Al-Nawawi dalam Rawdat al-Talibin, yang menyatakan bahwa perilaku pekerja dibatasi oleh kepentingan seperti agen. Dia mengutip Pasal 628 Kitab Undang-Undang Hukum Perdata Yordania yang menyatakan bahwa pemilik properti sendiri yang menanggung kerugian dan tidak dianggap sebagai syarat yang bertentangan. Dia menyimpulkan bahwa jika secara hukum terbukti bahwa pelanggaran atau kelalaian pekerja terbukti, maka dia harus bertanggung jawab atas kerugian tersebut sampai tingkat tersebut."
