summary:
  ar: "أول ألبوم يجمع القوالي بالموسيقى الغربية بين المغني الباكستاني نصرت فتح علي خان وعازف الغيتار والمنتج الكندي مايكل بروك، باقتراح من بيتر غابرييل، صدر عن ريل وورلد في 12 نوفمبر 1990؛ دخل ريمكس فرقة ماسيف أتاك لأغنيته الرئيسة القائمة البريطانية، فكانت أول أغنية بالأردية فيها، وتقول الشركة إنه باع أكثر من ستمئة ألف نسخة خارج شبه القارة."
  en: "The first qawwali fusion album of the Pakistani singer Nusrat Fateh Ali Khan with the Canadian guitarist and producer Michael Brook, at Peter Gabriel's suggestion, released by Real World on 12 November 1990; Massive Attack's remix of the title song became the first Urdu song to reach the British charts, and the label claims sales of over 600,000 copies outside the Indian subcontinent."
  ur: "پاکستانی گلوکار نصرت فتح علی خان اور کینیڈین گٹارسٹ مائیکل بروک کا پیٹر گیبریل کی تجویز پر پہلا قوالی فیوژن البم، 12 نومبر 1990 کو ریئل ورلڈ سے جاری ہوا؛ ماسیو اٹیک کا ریمکس برطانوی چارٹ میں پہنچنے والا پہلا اردو گیت بنا۔"
