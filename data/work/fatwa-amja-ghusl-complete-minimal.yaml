label: { ar: "الغسل الكامل والمجزئ", en: "The janaba washing — its complete and adequate forms", ur: "غسل جنابت — مکمل اور کافی صورت", es: "El lavado janaba: sus formas completas y adecuadas.", fr: "Le lavage janaba — ses formes complètes et adéquates" }
summary:
  ar: "سأل سائل عن صفة الغسل من الجنابة فإنه يتوضأ أولًا ثم يستحم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76855 بتاريخ 14 نوفمبر 2008)⁩ أن الغسل نوعان كامل ومجزئ فالكامل أن يبدأ بالتسمية ثم يغسل يديه ثلاثًا ثم يغسل ما أصابه الأذى ثم يتوضأ وضوءه للصلاة ثم يحثي على رأسه ثلاث حثيات يروي بها أصول شعره ثم يفيض الماء على جسده والمجزئ تعميم البدن بالماء مع النية على ما فصّل الجواب."
  en: "A questioner described doing wudu first then showering for janaba. Dr. Salah al-Sawi (fatwa no. 76855, 14 November 2008) answered that the washing is of two kinds — complete and adequate: the complete begins with naming God, washing the hands thrice, washing what the impurity touched, doing the prayer-wudu, then scooping three scoops over the head wetting the hair's roots, then pouring water over the body; the adequate is covering the body with water together with intention — as the answer details."
  ur: "جنابت کا مکمل غسل؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76855، 14 نومبر 2008)⁩ کے مطابق دو صورتیں — مکمل وضو کے ساتھ، اور کافی صرف نیت سے جسم بہانا۔"
  es: "Un consultante describió realizar primero el wudu y luego ducharse para obtener el janaba. El Dr. Salah al-Sawi (fatwa n.° 76855, 14 de noviembre de 2008) respondió que el lavado es de dos tipos: completo y adecuado. El completo comienza nombrando a Dios, lavándose las manos tres veces, lavando lo que la impureza tocó, realizando la oración-wudu, luego pasando tres cucharadas de agua por la cabeza humedeciendo las raíces del cabello y, finalmente, vertiendo agua sobre el cuerpo; el adecuado consiste en cubrir el cuerpo con agua junto con la intención, como se detalla en la respuesta."
  fr: "Un internaute a décrit comment effectuer les ablutions (wudu) puis prendre une douche pour purifier son corps (janaba). Le Dr Salah al-Sawi (fatwa n° 76855, 14 novembre 2008) a répondu que le lavage est de deux types: complet et adéquat. Le lavage complet commence par invoquer Dieu, se laver les mains trois fois, laver ce qui a été en contact avec l’impureté, accomplir les ablutions (wudu), puis verser trois louches d’eau sur la tête en mouillant les racines des cheveux, puis se rincer le corps. Le lavage adéquat consiste à se couvrir le corps d’eau avec une intention précise, comme le détaille la réponse."
