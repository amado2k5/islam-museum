summary:
  ar: "سؤال عن ترقية الجنازة ورفع الصوت فيها وعن المجالس التي يُسخر فيها من القرآن والملائكة والصلاة، وجواب علماء الأزهر بأنها بدع وأن السخرية بالشعائر تُخرج فاعلها من الدين."
  en: "A question on acclaiming the dead and raising voices at funerals, and on gatherings that mock the Qur'an, angels and prayer; the Al-Azhar answer calls them innovations and holds that such mockery takes its doer out of religion."
  ur: "سوال: میت کی ترقیہ اور جنازے میں آواز بلند کرنے کے بارے میں، اور ان مجالس کے بارے میں جن میں قرآن، فرشتوں اور نماز کا مذاق اڑایا جائے؛ علمائے ازہر کے جواب میں ان سب کو بدعات کہا گیا اور شعائر کا مذاق اڑانے والے کو دین سے خارج ہونے والا کہا گیا۔"
  es: "Ante una pregunta sobre aclamar a los muertos y alzar la voz en los funerales, y sobre reuniones que se burlan del Corán, los ángeles y la oración, la respuesta de Al-Azhar las califica de innovaciones y sostiene que tal burla aparta a quien la practica de la religión."
  fr: "Une question porte sur les acclamations adressées aux morts et les élévations de voix lors des funérailles, ainsi que sur les rassemblements qui se moquent du Coran, des anges et de la prière; la réponse d'Al-Azhar les qualifie d'innovations et soutient que de telles moqueries éloignent celui qui les commet de la religion."
  tr: "Cenazelerin teşvik edilmesi ve seslerini yükseltmek, Kur'an, melekler ve duaların alay konusu olduğu toplantılar hakkında bir soru ve Ezher âlimlerinin bunların yenilik olduğu ve alaycı ritüellerin faillerini dinden kovduğu yanıtı."
  id: "Pertanyaan tentang mempromosikan pemakaman dan mengangkat suara mereka selama pemakaman, serta tentang pertemuan di mana Al-Qur'an, malaikat, dan doa diejek, serta jawaban para ulama Al-Azhar bahwa ini adalah inovasi dan ritual ejekan mengusir pelakunya dari agama."
