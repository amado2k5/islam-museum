label: { ar: "قرار مجمع الفقه الإسلامي الدولي 147 (16/5) بشأن السلع الدولية وضوابط التعامل فيها", en: "IIFA resolution 147 (16/5) on international commodities and the controls for dealing in them", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 147 (16/5): بین الاقوامی اجناس اور ان میں لین دین کے ضوابط", es: "Resolución 147 (16/5) de la IIFA sobre productos básicos internacionales y los controles para su negociación.", fr: "Résolution 147 (16/5) de l'IIFA sur les matières premières internationales et les contrôles des transactions sur ces matières premières", tr: "Uluslararası İslami Fiqh Akademisi Kararı 147 (16/5) uluslararası mallar ve bunların ticaretine ilişkin düzenlemeler hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 147 (16/5) mengenai barang internasional dan peraturan untuk perdagangan barang tersebut" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩، مؤكدًا لقراره 63 ⁦(7/1)⁩ بشأن الأسواق المالية الذي ضبط التعامل بالسلع الدولية في الأسواق المنظمة بأربع طرق: عقد يتضمن حق تسلم المبيع وتسلم الثمن حالًا مع وجود السلع أو إيصالات ممثلة لها في ملك البائع ⁦(جائز بشروط البيع)⁩؛ أو مع إمكانهما بضمان هيئة السوق ⁦(جائز بشروط البيع)⁩؛ أو على سلعة موصوفة في الذمة آجلة يدفع الثمن عند التسليم ⁦(سلم مشروع بشروطه)⁩؛ أو مجرد مراهنة على فروق الأسعار دون قبض حقيقي ⁦(ممنوع)⁩. ثم استكمل ضوابط التعامل المعاصر فيها وحكم ما يجري في البورصات من صور التداول."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005), reaffirming its resolution 63 (7/1) on financial markets, which had set four ways of dealing in international commodities on organised markets: a contract including the right to take the goods and pay the price immediately, the goods or their warrants being in the seller's ownership (permissible under sale conditions); the same made possible by the market authority's guarantee (permissible under sale conditions); a contract over a described deferred-delivery commodity in obligation with price paid on delivery (lawful salam under its conditions); and mere price-difference dealings without real possession (prohibited). It then completed the controls for contemporary dealing and the status of the trading forms practised on exchanges."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں، اپنی قرارداد 63 ⁦(7/1)⁩ برائے مالی بازاروں کی تائید کرتے ہوئے جس نے منظم بازاروں میں بین الاقوامی اجناس کے لین دین کے چار طریقے متعین کیے تھے: فوری قبضہ اور قیمت کے ادا کرنے کا حق والا عقد جب اجناس یا ان کی رسیدیں فروخت کنندہ کے ملک میں ہوں ⁦(شرائطِ بیع سے جائز)⁩؛ وہی بازار اتھارٹی کی ضمانت سے ممکن ہو تو بھی جائز؛ مؤجل سپردگی والی بیان شدہ جنس ذمہ میں جس کی قیمت سپردگی پر ادا ہو ⁦(شرائط کے ساتھ جائز سلام)⁩؛ اور محض قیمت کے فرق پر سٹہ بغیر حقیقی قبضے ⁦(ممنوع)⁩۔ پھر عصری لین دین کے ضوابط اور اسٹک ایکسچینج میں جاری تجارتی صورتوں کا حکم مکمل کیا۔"
  es: "Una resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión en Dubái (30 Safar – 5 Rabi al-Awwal 1426, 9–14 de abril de 2005), reafirmando su resolución 63 (7/1) sobre mercados financieros, que había establecido cuatro formas de negociar con productos básicos internacionales en mercados organizados: un contrato que incluye el derecho a tomar los bienes y pagar el precio inmediatamente, estando los bienes o sus garantías en propiedad del vendedor (permitido según las condiciones de venta); lo mismo posibilitado por la garantía de la autoridad del mercado (permitido según las condiciones de venta); un contrato sobre un producto descrito de entrega diferida con obligación de pago del precio contra entrega (salam lícito según sus condiciones); y meras transacciones de diferencia de precio sin posesión real (prohibidas). Luego completó los controles para las transacciones contemporáneas y el estatus de las formas de negociación practicadas en las bolsas."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 16e session à Dubaï (30 Safar – 5 Rabi al-Awwal 1426, soit du 9 au 14 avril 2005), a réaffirmé sa résolution 63 (7/1) relative aux marchés financiers. Cette résolution définissait quatre modes de transaction sur les marchés internationaux de matières premières organisés: un contrat incluant le droit de prendre possession des marchandises et d'en payer immédiatement le prix, les marchandises ou leurs warrants étant la propriété du vendeur (autorisation sous certaines conditions de vente); une transaction rendue possible par la garantie de l'autorité de marché (autorisation sous certaines conditions de vente); un contrat portant sur une marchandise à livraison différée, avec obligation de paiement du prix à la livraison (contrat licite sous certaines conditions); et une simple transaction sur différence de prix sans prise de possession effective (interdiction). L'Académie a ensuite précisé les modalités de contrôle des transactions contemporaines et le statut des formes de négociation pratiquées en bourse."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (30 Safar – 5 Rabi'al-Awwal 1426 H, 9–14 Nisan 2005) toplu kararı, finansal piyasalara ilişkin 63 (7/1) sayılı Kararını onaylayan ve uluslararası malların düzenlenmiş piyasalarda ele geçirilmesini dört yöntemle düzenleyen karar: satılan ürünü teslim alma ve fiyatı hemen alma hakkını içeren bir sözleşme (satış koşullarına göre izin verilen); veya her ikisinin de piyasa otoritesi tarafından garanti altına alınması (satış koşulları uyarınca izin verilen); ya da teslimatta ödenmesi gereken ertelenmiş yükümlülükler olarak tanımlanan mallar üzerinde (teslimat koşulları gereği meşrudur); ya da sadece fiyat farklarına bahis yapılarak gerçek bir teslim alınmamış (yasak). Daha sonra çağdaş ticaret düzenlemelerini tamamladı ve borsalardaki ticaret biçimlerini yönetti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi keenam belas di Dubai (30 Safar – 5 Rabi' al-Awwal 1426 AH, 9–14 April 2005), yang menegaskan Keputusan 63 (7/1) mengenai pasar keuangan, yang mengatur transaksi barang internasional di pasar yang diatur melalui empat metode: kontrak yang mencakup hak untuk menerima barang yang terjual dan menerima harga segera ketika barang atau penerimaan yang mewakili barang tersebut berada dalam kepemilikan penjual (diizinkan berdasarkan ketentuan penjualan); atau dengan kemungkinan keduanya dijamin oleh otoritas pasar (diizinkan berdasarkan ketentuan penjualan); atau pada barang yang disebut sebagai kewajiban tertunda yang harus dibayar saat pengiriman (pengiriman sah menurut ketentuannya); atau sekadar bertaruh pada perbedaan harga tanpa penerimaan nyata (dilarang). Ia kemudian menyelesaikan peraturan untuk perdagangan kontemporer dan mengatur bentuk-bentuk perdagangan di bursa."
