id: work/fatwa-dar-alifta-eg-medicine-at-suhoor
class: work
kind: fatwa
label: { ar: "حكم تناول دواء في سحور رمضان لتقوية الصائم", en: "Taking medicine at suhoor to strengthen the fasting person", ur: "رمضان میں سحری پر روزہ دار کی طاقت کے لیے دوا لینا", es: "Tomar medicamentos en el suhoor para fortalecer a la persona que ayuna", fr: "Prendre des médicaments au suhoor pour fortifier la personne qui jeûne", tr: "Ramazan suhurunda oruç tutan kişiyi güçlendirmek için ilaç alma hükmü", id: "Aturan tentang minum obat pada suhoor Ramadan untuk memperkuat orang yang berpuasa" }
summary:
  ar: "سائل سأل عن تناول دواء في سحور رمضان لتقوية الصائم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22488)⁩ أنه يجوز للصائم تناول بعض الأدوية والعقاقير المباحة شرعًا في وقت السحور أو قبله أو بعده أو بدلًا عنه ما دام ذلك يوافيه في الصوم على ما فصّل الجواب."
  en: "A questioner asked about taking medicine at Ramadan suhoor to strengthen the fasting person. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22488) answered that a fasting person may take lawful medicines and drugs at suhoor time, before it, after it or in place of it, so long as they help him in the fast — as the answer details."
  ur: "ایک سائل نے رمضان میں سحری پر روزہ دار کی طاقت کے لیے دوا لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22488)⁩ نے جواب دیا کہ روزہ دار جائز ادویات سحری کے وقت، اس سے پہلے، بعد میں یا اس کے بدلے میں لے سکتا ہے بشرطیکہ وہ اس کی روزے میں معاونت کریں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de tomar medicamentos durante el suhoor de Ramadán para fortalecer al ayunante. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22488) respondió que una persona que ayuna puede tomar medicamentos lícitos durante el suhoor, antes, después o en lugar del mismo, siempre y cuando le ayuden en el ayuno, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la prise de médicaments pendant le suhoor du Ramadan pour fortifier le jeûne. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22488) a répondu qu'une personne jeûnant peut prendre des médicaments licites au suhoor, avant, après ou à la place de celui-ci, pourvu qu'ils l'aident à jeûner – comme le précise la réponse."
  tr: "Bir soru soran kişi, Ramazan suhurunda oruç tutan kişiyi güçlendirmek için ilaç almayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22488), bir kişinin oruç süresince, öncesinde, sonra veya yerine sihur sırasında bazı ilaç ve ilaçları almasının caiz olduğunu yanıtladı; bu sürece bu orucu tamamladığı sürece, cevapta belirtildiği gibi."
  id: "Seorang penanya menanyakan tentang mengonsumsi obat selama suhor Ramadan untuk menguatkan orang yang berpuasa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22488) menjawab bahwa diperbolehkan bagi orang yang berpuasa untuk mengonsumsi beberapa obat dan obat yang diperbolehkan menurut hukum Islam selama suhoor, sebelum, sesudah, atau sebagai penggantinya, selama puasa tersebut memenuhi puasa, sebagaimana dijelaskan dalam jawaban."
