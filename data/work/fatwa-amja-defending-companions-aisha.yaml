label: { ar: "منزلة الصحابة وأم المؤمنين عائشة", en: "The standing of the Companions and of Aisha", ur: "صحابہ اور ام المومنین عائشہ کا مقام", es: "La posición de los Compañeros y de Aisha", fr: "La position des Compagnons et d'Aïcha", tr: "Sahabelerin ve İnananların Annesi Aisha'nın statüsü", id: "Status Para Sahabat dan Ibu Para Mukmin Aisha" }
summary:
  ar: "سأل سائل مستغربًا عن مسائل تقلب صفحات الماضي في الصحابة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23570 بتاريخ 24 أغسطس 2008)⁩ أن الذي يدين الله به أن قلوب أصحاب محمد أطهر قلوب العباد وأن قرنهم خير القرون وأن مسبتهم والوقوع فيهم علامة لا تخطئ على النفاق وعلى سخط الديان، ويقطع بأن أبا بكر الصديق خير هذه الأمة بعد نبيها وأن عمر الفاروق خير الصحابة بعد أبي بكر وأن أم المؤمنين عائشة طاهرة مطهرة وأنها زوجة نبينا في الدنيا والآخرة وأنه ما كان الله ليغش نبيه فيها وأن من سبها بما برأها الله منه فهو مردود عليه قوله."
  en: "A questioner uneasily raised the old questions turned over against the Companions. Dr. Salah al-Sawi (fatwa no. 23570, 24 August 2008) answered that what he holds as religion is that the hearts of Muhammad's companions are the purest of servants' hearts and their age the best of ages; reviling and attacking them is an unerring mark of hypocrisy and of the Judge's displeasure; he holds with certainty that Abu Bakr is the best of this ummah after its prophet, Umar the best of the Companions after Abu Bakr, and that the Mother of the Believers Aisha is pure and purified, his wife in this world and the next — God would not deceive His prophet in her — and whoever insults her in what God cleared her of has his saying thrown back at him. Recorded as AMJA's answer."
  ur: "ایک سائل نے صحابہ سے متعلق پرانے اختلافات پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23570، 24 اگست 2008)⁩ کے مطابق صحابہ کے دل پاک ترین ہیں، ابوبکر امت کے بہترین اور عائشہ طاہرہ ہیں — ان پر طعن نفاق کی علامت ہے۔"
  es: "Un interlocutor planteó con inquietud las antiguas preguntas formuladas contra los Compañeros. El Dr. Salah al-Sawi (fatwa n.º 23570, 24 de agosto de 2008) respondió que su religión sostiene que los corazones de los compañeros de Mahoma son los más puros entre los siervos y su edad la mejor de las épocas; insultarlos y atacarlos es una señal inequívoca de hipocresía y del disgusto del Juez; afirma con certeza que Abu Bakr es el mejor de esta ummah después de su profeta, Umar el mejor de los Compañeros después de Abu Bakr, y que la Madre de los Creyentes, Aisha, es pura y purificada, su esposa en este mundo y en el más allá —Dios no engañaría a su profeta con ella— y quien la insulte por aquello de lo que Dios la exoneró, verá sus palabras revertidas. Registrado como respuesta de AMJA."
  fr: "Un interrogateur souleva avec gêne les anciennes questions retournées contre les Compagnons. Le Dr Salah al-Sawi (fatwa n° 23570, 24 août 2008) répondit que, selon sa religion, les cœurs des Compagnons de Muhammad sont les plus purs qui soient et leur époque la meilleure; les injurier et les attaquer est une marque infaillible d’hypocrisie et du mécontentement du Juge; il affirme avec certitude qu’Abou Bakr est le meilleur de cette communauté après son Prophète, Omar le meilleur des Compagnons après Abou Bakr, et que la Mère des Croyants, Aïcha, est pure et purifiée, son épouse dans ce monde et dans l’autre – Dieu n’aurait pas trompé Son Prophète en elle – et quiconque l’insulte sur ce dont Dieu l’a innocentée verra ses paroles se retourner contre lui. Ceci est rapporté comme la réponse d’AMJA."
  tr: "Bir soru sorana şaşkınlıkla Sahabelerle ilgili geçmişin sayfalarını çeviren konular hakkında sordu. Dr. Salah Al-Sawy (24 Ağustos 2008 tarihli Fetva No. 23570) Tanrı'nın kınadığı, Muhammed'in sahabelerinin kalplerinin kulları arasında en saf kalpler olduğu, onların neslinin yüzyılların en iyisi olduğu, lanetin ve onlara düşmenin ikiyüzlülük ve dinin gazabına yol açmayan bir işaret olduğunu belirtti. Ebu Bekir Siddik'in bu ulusun Peygamberinden sonra en iyisi olduğunu, Ömer el-Faruk'un Ebu Bekir'den sonra en iyi sahabe olduğunu, İnananların Annesi'nin saf ve saf bir Aişe olduğunu, Peygamberimizin bu dünyada ve ahirette eşi olduğunu, Allah'ın Peygamberini asla aldatmayacağını ve Allah onu kendisinden akladığı için onu aşağılayan herkesin reddedildiğini onaylar."
  id: "Ia bertanya kepada seorang penanya dengan terkejut tentang isu-isu yang membalik halaman masa lalu terkait para sahabat. Dr. Salah Al-Sawy menjawab (Fatwa No. 23570 tanggal 24 Agustus 2008) bahwa yang Allah kecam adalah bahwa hati para sahabat Muhammad adalah hati yang paling murni di antara para hamba-Nya, bahwa generasi mereka adalah yang terbaik dari berabad-abad, bahwa mengutuk dan jatuh ke dalamnya adalah tanda yang tidak bersalah pada kemunafikan dan murka agama. Ia menegaskan bahwa Abu Bakr Al-Siddiq adalah yang terbaik di bangsa ini setelah Nabinya, bahwa Umar Al-Farooq adalah sahabat terbaik setelah Abu Bakr, bahwa Ibu para mukmin adalah Aisha yang murni dan suci, bahwa dia adalah istri Nabi kita di dunia dan akhirat, bahwa Allah tidak akan pernah menipu Nabi-Nya tentang dirinya, dan bahwa siapa pun yang menghina dia karena Tuhan telah membersihkan dirinya akan ditolak."
