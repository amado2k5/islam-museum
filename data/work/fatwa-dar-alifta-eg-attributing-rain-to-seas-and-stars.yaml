id: work/fatwa-dar-alifta-eg-attributing-rain-to-seas-and-stars
class: work
kind: fatwa
label: { ar: "حكم إسناد سبب نزول المطر إلى كثرة البحار والأنواء", en: "Attributing rainfall to seas and the anwa' stars", ur: "بارش کو بحروں اور انواء ستاروں سے منسوب کرنے کا حکم", es: "Atribuir las precipitaciones a los mares y a las estrellas anwa'." }
summary:
  ar: "سائل سأل عن إسناد سبب نزول المطر إلى كثرة البحار والأنواء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22281)⁩ أن من أسند وجود المطر إلى كثرة البحار أو وجود النوء بقوتها وطبعها ونسب الفعل إلى ذات تلك الأشياء فذلك اعتقاد مذموم، وبيّن الجواب الحد الفاصل بين الأخذ بالأسباب الظاهرة والاعتقاد فيها."
  en: "A questioner asked about attributing rainfall to the abundance of seas and the anwa' (rain-bringing star settings). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22281) answered that whoever attributes the existence of rain to the abundance of seas or the efficacy of the anwa' in themselves, ascribing the act to those things, holds a blameworthy belief; the answer marks the line between acknowledging outward causes and believing in them."
  ur: "ایک سائل نے بارش کا سبب بحروں کی کثرت اور انواء ستاروں سے منسوب کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22281)⁩ نے جواب دیا کہ جو بارش کا وجود بحروں کی کثرت یا انواء کی اپنی قوت اور طبیعت سے منسوب کرے اور فعل انھی چیزوں کی ذات سے نسبت دے وہ مذموم عقیدہ رکھتا ہے؛ جواب میں ظاہری اسباب کو ماننے اور ان پر اعتقاد کے درمیان حد بیان ہوئی۔"
  es: "Un consultante preguntó sobre la atribución de las precipitaciones a la abundancia de los mares y a la influencia de las estrellas (anwa'). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22281) respondió que quien atribuye la existencia de la lluvia a la abundancia de los mares o a la eficacia de las estrellas, atribuyendo el acto a dichas cosas, sostiene una creencia censurable; la respuesta marca la línea divisoria entre reconocer las causas externas y creer en ellas."
