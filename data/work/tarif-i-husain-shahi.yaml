summary:
  ar: "تاريخ فارسي لعهد حسين نظام شاه الأول صاحب أحمدنگر، كتبه آفتابي، بلا خاتمة، فيه اثنتا عشرة صورة يرجح زبروفسكي أنها رسمت سنة 1565م، ست منها تظهر فيها الملكة خونزه همايون {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}."
  en: "A Persian history of the reign of Husain Nizam Shah I of Ahmadnagar by Aftabi, unfinished and without colophon, with twelve illustrations Zebrowski dates to 1565, six of them showing Queen Khanzada Humayun {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}."
  ur: "احمد نگر کے حسین نظام شاہ اول کے دور کی فارسی تاریخ، آفتابی کی لکھی، نامکمل اور بغیر ترقیمے کے، بارہ تصاویر کے ساتھ جنہیں زیبروسکی 1565ء کا مانتے ہیں؛ چھ میں ملکہ خونزہ ہمایوں ہیں {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}۔"
  es: "Una historia persa del reinado de Husain Nizam Shah I de Ahmadnagar por Aftabi, inacabada y sin colofón, con doce ilustraciones que Zebrowski fecha en 1565, seis de ellas mostrando a la reina Khanzada Humayun {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}."
  fr: "Une histoire persane du règne de Husain Nizam Shah I d'Ahmadnagar par Aftabi, inachevée et sans colophon, avec douze illustrations que Zebrowski date de 1565, dont six montrent la reine Khanzada Humayun {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}."
  tr: "Aftabi tarafından yazılan Ahmadnagar Sahib'i Hüseyin Nizam Şah I'in Saltanatı Farsça Tarihi, bir sonuç belirtmemiş olup, Zebrowski'nin 1565 yılında yapıldığına inandığı on iki portre içerir; bunlardan altısı Kraliçe Khonzeh Humayun'u tasvir eder {cite:Zebrowski-deccani-painting-1983 s. 16} {cite:Zebrowski-deccani-painting-1983 s. 17}."
  id: "A Persian History of the Reign of Husayn Nizam Shah I, Sahib of Ahmadnagar, yang ditulis oleh Aftabi, tanpa kesimpulan, berisi dua belas potret yang diyakini Zebrowski dilukis pada tahun 1565 M, enam di antaranya menggambarkan Ratu Khonzeh Humayun {cite:Zebrowski-deccani-painting-1983 hlm. 16} {cite:Zebrowski-deccani-painting-1983 hlm. 17}."
