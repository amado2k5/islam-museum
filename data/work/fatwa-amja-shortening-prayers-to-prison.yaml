id: work/fatwa-amja-shortening-prayers-to-prison
class: work
kind: fatwa
label: { ar: "قصر الصلاة في السفر إلى السجن", en: "Shortening prayers traveling to and from the prison", ur: "قیدخانے کا سفر — قصر نماز", es: "Reducción de la duración de las oraciones durante los trayectos de ida y vuelta a la prisión." }
summary:
  ar: "سأل سائل عن السفر إلى السجن ذهابًا وإيابًا هل يجوز قصر الصلاة وما هي المسافة المحددة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21994 بتاريخ 14 أكتوبر 2012)⁩ أنه إذا كانت المسافة إلى السجن مما يعد في العرف سفرًا كان له أن يأخذ برخص السفر من القصر والجمع والفطر ونحوها أما إذا كانت قريبة بحيث لا تعد سفرًا فلا تسري عليه أحكام المسافر على ما فصّل الجواب."
  en: "A questioner asked whether he may shorten prayers traveling to and from the prison, and what the travel distance is. AMJA's fatwa committee (fatwa no. 21994, 14 October 2012) answered that if the distance counts as travel in custom he may take the travel concessions — shortening, joining, breaking the fast and the like; if it is near enough not to count as travel, the traveler's rulings do not apply — as the answer details."
  ur: "قیدخانے کا سفر قصر کے لیے؟ لجنة الفتوى ⁦(فتویٰ 21994، 14 اکتوبر 2012)⁩ کے مطابق عرف میں سفر شمار ہو تو رخصتیں جائز۔"
  es: "Un consultante preguntó si podía acortar las oraciones al viajar hacia y desde la prisión, y cuál era la distancia del viaje. El comité de fatuas de AMJA (fatua n.° 21994, 14 de octubre de 2012) respondió que si la distancia se considera viaje según la costumbre, puede acogerse a las concesiones de viaje —acortar, unirse a la oración, romper el ayuno, etc.—; si la distancia es lo suficientemente corta como para no considerarse viaje, las normas para viajeros no se aplican, como se detalla en la respuesta."
