summary:
  ar: "شذا العرف في فن الصرف، كتاب في الصرف والتصريف لمؤلفه أحمد الحملاوي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 1351هـ / 1932م {cite:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book ID 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}. لم يقرأ المتحف الكتاب."
  en: "Shadha al-Arf fi Fann al-Sarf, a book on morphology (sarf and tasrif) by Ahmad al-Hamalawi; its date in a research summary supplied to the museum is d. 1351 AH / 1932 CE {cite:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book ID 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}. The museum has not read the book."
  ur: "شذا العرف في فن الصرف، صرف و تصریف پر ایک کتاب، مصنف أحمد الحملاوي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 1351ھ / 1932ء {cite:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book ID 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Shadha al-Arf fi Fann al-Sarf, livre sur la morphologie (sarf et tasrif) de Ahmad al-Hamalawi ; sa date dans une synthèse de recherche remise au musée : m. 1351 H / 1932 {cite:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book ID 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}. Le musée n'a pas lu le livre."
  es: "Shadha al-Arf fi Fann al-Sarf, libro sobre morfología (sarf y tasrif) de Ahmad al-Hamalawi; su fecha en un resumen de investigación entregado al museo: m. 1351 H. / 1932 {cite:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book ID 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}. El museo no ha leído el libro."
  tr: "Shatha al-'Arf fi al-Sarf, yazarı Ahmad al-Hamlawi tarafından morfoloji ve morfoloji üzerine bir kitap ve müzeye sunulan bir araştırma özetine göre tarihi: ö. 1351 Hicri / 1932 M.S. {kaynak:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Evet, ve Kapsamlı Kütüphane'deki kitap: Kitap ID 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}. Müze kitabı okumadı."
  id: "Shatha al-'Arf fi al-Sarf, sebuah buku tentang morfologi dan morfologi karya penulisnya Ahmad al-Hamlawi, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 1351 AH / 1932 M {cite:wikipedia-ar-shadha-al-arf-fi-fann-al-sarf}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku di Perpustakaan Komprehensif: ID Buku 11243 / 765 {cite:shamela-org-pdf-shadha-al-arf-fi-fann-al-sarf}. Museum tidak membaca buku tersebut."
