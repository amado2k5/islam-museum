summary:
  ar: "«السنن الكبرى» لأحمد بن شعيب النسائي (ت 303هـ): الكتاب الأوسع لأحاديث النسائي، وفيه الأبواب الفقهية وأحاديثها وما يتصل بها من علل وأسانيد، وهو غير «السنن الصغرى» (المجتبى). يُروى في الجزء الثاني منه كتاب قيام الليل وتطوع النهار، وكتاب الاستسقاء، وكتاب كسوف الشمس والقمر، وكتاب قصر الصلاة في السفر، وكتاب الجمعة، وكتاب صلاة العيدين. {cite:sunan-al-kubra-nasai-arna-vol2 p. 111}"
  en: "Ahmad ibn Shu'ayb al-Nasa'i's (d. 303 AH) larger collection, distinct from the Sunan al-Sughra (al-Mujtaba). Its second volume covers night and voluntary prayer, rain prayer, eclipse prayer, shortening the prayer on a journey, Friday, and the two festivals. {cite:sunan-al-kubra-nasai-arna-vol2 p. 111}"
