label: { ar: "السنن الكبرى للنسائي", en: "Sunan al-Kubra of al-Nasa'i", es: "Sunan al-Kubra de al-Nasa'i", fr: "Sunan al-Kubra d'al-Nasa'i", ur: "سنن الکبری النسائی", tr: "al-Sunan al-Kubra el-Nasa'i tarafından", id: "Al-Sunan al-Kubra oleh al-Nasa'i" }
summary:
  ar: "«السنن الكبرى» لأحمد بن شعيب النسائي ⁦(ت 303هـ)⁩: الكتاب الأوسع لأحاديث النسائي، وفيه الأبواب الفقهية وأحاديثها وما يتصل بها من علل وأسانيد، وهو غير «السنن الصغرى» ⁦(المجتبى)⁩. يُروى في الجزء الثاني منه كتاب قيام الليل وتطوع النهار، وكتاب الاستسقاء، وكتاب كسوف الشمس والقمر، وكتاب قصر الصلاة في السفر، وكتاب الجمعة، وكتاب صلاة العيدين. {cite:sunan-al-kubra-nasai-arna-vol2 p. 111}"
  en: "Ahmad ibn Shu'ayb al-Nasa'i's (d. 303 AH) larger collection, distinct from the Sunan al-Sughra (al-Mujtaba). Its second volume covers night and voluntary prayer, rain prayer, eclipse prayer, shortening the prayer on a journey, Friday, and the two festivals. {cite:sunan-al-kubra-nasai-arna-vol2 p. 111}"
  es: "La colección más extensa de Ahmad ibn Shu'ayb al-Nasa'i (fallecido en el año 303 de la Hégira), distinta del Sunan al-Sughra (al-Mujtaba), abarca en su segundo volumen la oración nocturna y voluntaria, la oración en caso de lluvia, la oración en caso de eclipse, la reducción de la oración durante un viaje, la oración del viernes y las dos festividades. {cite:sunan-al-kubra-nasai-arna-vol2 p. 111}"
  fr: "Le recueil plus complet d'Ahmad ibn Shu'ayb al-Nasa'i (mort en 303 AH), distinct du Sunan al-Sughra (al-Mujtaba), comprend un second volume traitant des prières nocturnes et surérogatoires, des prières pour la pluie, des prières lors d'une éclipse, de la réduction de la prière en voyage, de la prière du vendredi et des deux fêtes. {cite:sunan-al-kubra-nasai-arna-vol2 p. 111}"
  ur: "احمد بن شعیب النسائی ⁦(متوفی 303ھ)⁩ کا بڑا مجموعہ، سنن الصغرا ⁦(المجتبیٰ)⁩ سے ممتاز۔ اس کی دوسری جلد میں رات اور نفلی نماز، بارش کی نماز، گرہن کی نماز، سفر میں نماز کا قصر، جمعہ اور دو تہواروں کا احاطہ کیا گیا ہے۔ {حوالہ: سنن الکبری نسائی ارنا جلد 2 ص۔ 111}"
  tr: "Ahmed bin Şuayb El-Nasa'i'nin (ö. 303 Hicri) \"El-Sünen El-Kubra\"sı: En-Nasa'i'nin hadislerinin en kapsamlı kitabı, fıkhih ayetleri, hadisleri ve ilgili kusurlar ile aktarım zincirlerini içerir. \"El-Sünan Sübre\"den (El-Müjtaba) farklıdır. İkinci cildinde Gece Namazları ve Gönüllü Gündüz Duaları Kitabı, Yağmur Arama Kitabı, Güneş ve Ay Tutulmaları Kitabı, Seyahat Sırasında Kısaltma Namazları Kitabı, Cuma Kitabı ve Bayram Namazları Kitabı anlatılır. {Cite:Sunan-al-Kubra-Nasai-Arna-cilt 2 s. 111}"
  id: "\"Al-Sunan Al-Kubra\" oleh Ahmad ibn Shu'ayb Al-Nasa'i (wafat 303 H): Kitab paling komprehensif dari hadits an-Nasa'i, berisi bab-bab yurisprudensi, haditsnya, serta cacat dan rantai transmisi terkait. Buku ini berbeda dari \"Al-Sunan Al-Sughra\" (Al-Mujtaba). Dalam jilid keduanya, Kitab Doa Malam dan Doa Siang Sukarela, Kitab Mencari Hujan, Kitab Gerhana Matahari dan Bulan, Kitab Doa Pemendek selama Perjalanan, Kitab Jumat, dan Kitab Doa Idul Fitri diceritakan. {cite:sunan-al-kubra-nasai-arna-vol2 hlm. 111}"
