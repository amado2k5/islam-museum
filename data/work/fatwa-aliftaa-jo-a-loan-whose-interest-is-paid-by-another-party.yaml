id: work/fatwa-aliftaa-jo-a-loan-whose-interest-is-paid-by-another-party
class: work
kind: fatwa
label: { ar: "قرض بفائدة تدفعها جهة أخرى", en: "A loan whose interest is paid by another party", ur: "ایسا قرض جس کا سود کوئی دوسرا ادارہ ادا کرے" }
summary:
  ar: "سؤال عن قرض بفائدة تدفعها جهة أخرى، أجابت فيه دائرة الإفتاء العام الأردنية بأن كل قرض يوفى بزيادة مشروطة قرض ربوي سواء دفع الزيادة المقترض أو غيره، فلا يجوز التوقيع على قرض بفائدة ولو تحملتها مؤسسة أخرى لأن العقد باطل. أجابت الدائرة بأن كل قرض يتم الوفاء به مع زيادة مشروطة يعد قرضًا ربويًا، سواء كانت الزيادة يدفعها المقترض أو غيره، لاتفاق الفقهاء على القاعدة المشهورة «كل قرض جر نفعًا فهو ربا». وقالت إنه لا يوجد مسوغ شرعي يجيز للمسلم التوقيع على عقد قرض بفائدة يدفعها غيره، لأن عقد القرض الربوي باطل، واستشهدت بـ[[passage/quran-2-278|سورة البقرة 2:278]] و[[passage/quran-2-279|2:279]]. وخلصت إلى أنه لا يجوز أخذ قرض ربوي ولو كانت الفائدة تدفعها جهة أخرى، لأن عقد القرض الذي اشترطت فيه الفائدة باطل شرعًا."
  en: "A question about a loan whose interest is paid by another party, in which Jordan's General Iftaa Department answered that any loan repaid with a stipulated increase is an interest-bearing loan whether the borrower or someone else pays the increase, so one may not sign an interest-bearing loan even if another institution bears the interest, since the contract is void. The Department answered that any loan repaid with a stipulated increase counts as an interest-bearing loan, whether the increase is paid by the borrower or someone else, since jurists agree on the well-known maxim that every loan that brings a benefit is riba. It said there is no Shari'a justification for a Muslim to sign an interest-bearing loan contract whose interest someone else pays, because an interest-bearing loan contract is void, citing [[passage/quran-2-278|Surat al-Baqara 2:278]] and [[passage/quran-2-279|2:279]]. It concluded that taking an interest-bearing loan is not permitted even if another body pays the interest, because a loan contract that stipulates interest is void in the Shari'a."
  ur: "ایسا قرض جس کا سود کوئی دوسرا ادارہ ادا کرے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ہر وہ قرض جو شرط کردہ اضافے کے ساتھ ادا ہو سودی قرض ہے، چاہے اضافہ قرض لینے والا دے یا کوئی اور، اس لیے سودی قرض پر دستخط جائز نہیں چاہے سود کوئی دوسرا ادارہ برداشت کرے، کیونکہ عقد باطل ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ ہر وہ قرض جو شرط کردہ اضافے کے ساتھ ادا کیا جائے سودی قرض ہے، چاہے اضافہ قرض لینے والا دے یا کوئی اور، کیونکہ فقہا مشہور قاعدے پر متفق ہیں کہ ہر وہ قرض جو نفع کھینچے سود ہے۔ اس نے کہا کہ مسلمان کے لیے ایسے سودی قرض کے عقد پر دستخط کرنے کا کوئی شرعی جواز نہیں جس کا سود کوئی اور ادا کرے، کیونکہ سودی قرض کا عقد باطل ہے، اور [[passage/quran-2-278|سورۃ البقرہ 2:278]] اور [[passage/quran-2-279|2:279]] کا حوالہ دیا۔ اس نے نتیجہ نکالا کہ سودی قرض لینا جائز نہیں چاہے سود کوئی دوسرا ادارہ ادا کرے، کیونکہ جس قرض کے عقد میں سود کی شرط ہو وہ شرعاً باطل ہے۔"
