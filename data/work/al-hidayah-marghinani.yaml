label:
  ar: "الهداية شرح بداية المبتدي"
  en: "al-Hidaya Sharh Bidayat al-Mubtadi"
  ur: "الہدایہ شرح بدایۃ المبتدی"
summary:
  ar: "شرح برهان الدين علي بن أبي بكر المرغيناني ⁦(511-593هـ)⁩ على متنه «بداية المبتدي»، الذي جمع فيه بين مختصر القدوري والجامع الصغير لمحمد بن الحسن مع زيادات. ألّفه بعد أن شرح البداية شرحاً كبيراً سماه «كفاية المنتهي» ثم رأى فيه إطناباً، فكتب الهداية جامعاً بين عيون الرواية ومتون الدراية، يذكر لكل قول دليله. صار من أشهر كتب الحنفية وأكثرها تدريساً، وجمع محققه سائد بكداش أكثر من مائة وعشرين عملاً قام عليه من شروح وحواشٍ ومختصرات وتخريجات. {cite:hidaya-bakdash-v1 p.7} {cite:hidaya-bakdash-v1 p.8} {cite:hidaya-bakdash-v1 p.101}"
  en: "The commentary of Burhan al-Din Ali ibn Abi Bakr al-Marghinani (511-593 AH) on his own base text Bidayat al-Mubtadi, in which he had combined al-Quduri's Mukhtasar with Muhammad ibn al-Hasan's al-Jami' al-Saghir, with additions. He wrote it after a large commentary on the Bidaya, Kifayat al-Muntahi, which he judged too long; al-Hidaya joins 'the best of the transmitted rulings and the core of understanding', giving evidence for each view. It became one of the best-known and most taught Hanafi books; its editor Sa'id Bakdash counts more than 120 works built on it, commentaries, glosses, abridgements and hadith studies."
  ur: "برہان الدین علی بن ابی بکر مرغینانی ⁦(511-593ھ)⁩ کی اپنے متن «بدایۃ المبتدی» کی شرح، جس میں انہوں نے قدوری کی مختصر اور محمد بن الحسن کی الجامع الصغیر کو زیادات کے ساتھ جمع کیا تھا۔ انہوں نے یہ اس کے بعد لکھی کہ بدایہ کی ایک بڑی شرح «کفایۃ المنتہی» لکھی اور اس میں طوالت دیکھی؛ ہدایہ میں روایت کے عمدہ مسائل اور درایت کے اصول جمع ہیں اور ہر قول کی دلیل مذکور ہے۔ یہ حنفیہ کی مشہور ترین اور سب سے زیادہ پڑھائی جانے والی کتابوں میں سے بنی؛ اس کے محقق سائد بکداش اس پر لکھے گئے ایک سو بیس سے زیادہ کام شمار کرتے ہیں: شروح، حواشی، مختصرات اور تخریجات۔"
