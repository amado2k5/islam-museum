summary:
  ar: "شرح برهان الدين علي بن أبي بكر المرغيناني ⁦(511-593هـ)⁩ على متنه «بداية المبتدي»، الذي جمع فيه بين مختصر القدوري والجامع الصغير لمحمد بن الحسن مع زيادات. ألّفه بعد أن شرح البداية شرحاً كبيراً سماه «كفاية المنتهي» ثم رأى فيه إطناباً، فكتب الهداية جامعاً بين عيون الرواية ومتون الدراية، يذكر لكل قول دليله. صار من أشهر كتب الحنفية وأكثرها تدريساً، وجمع محققه سائد بكداش أكثر من مائة وعشرين عملاً قام عليه من شروح وحواشٍ ومختصرات وتخريجات. {cite:hidaya-bakdash-v1 p.7} {cite:hidaya-bakdash-v1 p.8} {cite:hidaya-bakdash-v1 p.101}"
  en: "The commentary of Burhan al-Din Ali ibn Abi Bakr al-Marghinani (511-593 AH) on his own base text Bidayat al-Mubtadi, in which he had combined al-Quduri's Mukhtasar with Muhammad ibn al-Hasan's al-Jami' al-Saghir, with additions. He wrote it after a large commentary on the Bidaya, Kifayat al-Muntahi, which he judged too long; al-Hidaya joins 'the best of the transmitted rulings and the core of understanding', giving evidence for each view. It became one of the best-known and most taught Hanafi books; its editor Sa'id Bakdash counts more than 120 works built on it, commentaries, glosses, abridgements and hadith studies."
  ur: "برہان الدین علی بن ابی بکر مرغینانی ⁦(511-593ھ)⁩ کی اپنے متن «بدایۃ المبتدی» کی شرح، جس میں انہوں نے قدوری کی مختصر اور محمد بن الحسن کی الجامع الصغیر کو زیادات کے ساتھ جمع کیا تھا۔ انہوں نے یہ اس کے بعد لکھی کہ بدایہ کی ایک بڑی شرح «کفایۃ المنتہی» لکھی اور اس میں طوالت دیکھی؛ ہدایہ میں روایت کے عمدہ مسائل اور درایت کے اصول جمع ہیں اور ہر قول کی دلیل مذکور ہے۔ یہ حنفیہ کی مشہور ترین اور سب سے زیادہ پڑھائی جانے والی کتابوں میں سے بنی؛ اس کے محقق سائد بکداش اس پر لکھے گئے ایک سو بیس سے زیادہ کام شمار کرتے ہیں: شروح، حواشی، مختصرات اور تخریجات۔"
  es: "El comentario de Burhan al-Din Ali ibn Abi Bakr al-Marghinani (511-593 AH) sobre su texto base, Bidayat al-Mubtadi, en el que combinó el Mukhtasar de al-Quduri con al-Jami' al-Saghir de Muhammad ibn al-Hasan, con algunas adiciones. Lo escribió después de un extenso comentario sobre la Bidaya, Kifayat al-Muntahi, que consideró demasiado largo; al-Hidaya reúne «lo mejor de las normas transmitidas y el núcleo de la comprensión», aportando pruebas para cada postura. Se convirtió en uno de los libros hanafíes más conocidos y estudiados; su editor, Sa'id Bakdash, contabiliza más de 120 obras basadas en él, entre comentarios, glosas, resúmenes y estudios de hadices."
  fr: "Le commentaire de Burhan al-Din Ali ibn Abi Bakr al-Marghinani (511-593 AH) sur son propre texte de base, la Bidayat al-Mubtadi, dans lequel il avait combiné le Mukhtasar d'al-Quduri avec l'al-Jami' al-Saghir de Muhammad ibn al-Hasan, en y ajoutant des éléments, est une référence. Il l'écrivit après un volumineux commentaire de la Bidaya, le Kifayat al-Muntahi, qu'il jugeait trop long. al-Hidaya rassemble « les meilleures décisions transmises et l'essentiel de la compréhension », en fournissant des arguments pour chaque avis. Cet ouvrage devint l'un des plus connus et des plus étudiés de l'école hanafite; son éditeur, Sa'id Bakdash, recense plus de 120 ouvrages qui s'en inspirent: commentaires, gloses, abrégés et études de hadiths."
  tr: "Burhan al-Din Ali ibn Ebi Bekir el-Marghinani'nin (511-593 H) 'Bidayat al-Mubtadi' adlı metnine açıklaması, el-Kuduri'nin kısaltmasını ve Muhammed bin el-Hasan'ın küçük koleksiyonunu eklemelerle birleştirdi. Eseri, 'Kifayat el-Muntaha' adlı büyük bir tefsirle el-Bidaya'yı açıkladıktan sonra yazdı, ardından kapsamlı buldu ve 'El-Hidayah'ı yazdı; 'uyun rivayeti'ni bilgi metinleriyle birleştirerek kendi kanıtlarını belirtti. En ünlü ve en yaygın öğretilen Hanefi kitaplarından biri oldu ve editörü Seyid Bakdaş, üzerine dayandığı yüz yirmiden fazla eser derledi; bunlar arasında yorumlar, açıklamalar, kısaltmalar ve açıklamalar da vardı. {atıf:hidaya-bakdaş-v1 s.7} {atıf:hidaya-bakdaş-v1 s.8} {kaynak:hidaya-bakdaş-v1 s.101}"
  id: "Penjelasan Burhan al-Din Ali ibn Abi Bakr al-Marghinani (511-593 H) tentang teksnya 'Bidayat al-Mubtadi,' di mana ia menggabungkan ringkasan al-Quduri dan kumpulan kecil oleh Muhammad ibn al-Hasan dengan tambahan. Ia menulisnya setelah menjelaskan al-Bidaya dalam komentar besar berjudul 'Kifayat al-Muntaha,' kemudian menemukan bahwa karya itu sangat luas, sehingga ia menulis 'Al-Hidayah,' menggabungkan 'narasi uyoon' dengan teks-teks pengetahuan, menyebutkan buktinya sendiri. Buku ini menjadi salah satu buku Hanafi yang paling terkenal dan banyak diajarkan, dan editornya Sa'id Bakdash mengumpulkan lebih dari seratus dua puluh karya yang menjadi dasar karyanya, termasuk komentar, anotasi, ringkasan, dan anotasi. {cite:hidaya-bakdash-v1 hlm.7} {cite:hidaya-bakdash-v1 hlm.8} {cite:hidaya-bakdash-v1 hlm.101}"
