summary:
  ar: "نقد الشعر، كتاب في البلاغة لمؤلفه قدامة بن جعفر، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت نحو 932–948م {cite:wikipedia-en-qudama-ibn-jafar}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: #28181 (Shamela index) {cite:mr-mas-shamela-adab-wbalagha-books}. لم يقرأ المتحف الكتاب."
  en: "Naqd al-Shir, a book on rhetoric (balagha) by Qudama ibn Ja'far; its date in a research summary supplied to the museum is d. c. 932–948 CE {cite:wikipedia-en-qudama-ibn-jafar}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: #28181 (Shamela index) {cite:mr-mas-shamela-adab-wbalagha-books}. The museum has not read the book."
  ur: "نقد الشعر، بلاغت پر ایک کتاب، مصنف قدامة بن جعفر؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات تقریباً 932–948ء {cite:wikipedia-en-qudama-ibn-jafar}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: #28181 (Shamela index) {cite:mr-mas-shamela-adab-wbalagha-books}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Naqd al-Shir, livre sur la rhétorique (balagha) de Qudama ibn Ja'far ; sa date dans une synthèse de recherche remise au musée : m. vers 932–948 {cite:wikipedia-en-qudama-ibn-jafar}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : #28181 (Shamela index) {cite:mr-mas-shamela-adab-wbalagha-books}. Le musée n'a pas lu le livre."
  es: "Naqd al-Shir, libro sobre retórica (balagha) de Qudama ibn Ja'far; su fecha en un resumen de investigación entregado al museo: m. hacia 932–948 {cite:wikipedia-en-qudama-ibn-jafar}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: #28181 (Shamela index) {cite:mr-mas-shamela-adab-wbalagha-books}. El museo no ha leído el libro."
  tr: "Şiir Eleştirisi, yazarı Qudama ibn Ja'far'ın retorik üzerine bir kitabı ve müzeye sunulan bir araştırma özetine göre tarihi: yaklaşık 932–948 MS {atıf:wikipedia-en-qudama-ibn-jafar}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Evet, ve Kapsamlı Kütüphane'deki kitap: #28181 (Shamela dizini) {atıf:mr-mas-shamela-adab-wbalagha-books}. Müze kitabı okumadı."
  id: "Poetry Criticism, sebuah buku tentang retorika karya penulisnya Qudama ibn Ja'far, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: sekitar 932–948 M {cite:wikipedia-en-qudama-ibn-jafar}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku di Perpustakaan Komprehensif: #28181 (indeks Shamela) {cite:mr-mas-shamela-adab-wbalagha-books}. Museum tidak membaca buku tersebut."
