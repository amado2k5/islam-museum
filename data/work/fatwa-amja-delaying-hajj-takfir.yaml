id: work/fatwa-amja-delaying-hajj-takfir
class: work
kind: fatwa
label: { ar: "تأخير الحج مع الاستطاعة والتكفير", en: "Delaying hajj while able, and takfir", ur: "استطاعت کے باوجود حج میں تاخیر اور تکفیر", es: "Retrasar el Hajj cuando se puede, y el takfir.", fr: "Retarder le hajj tant qu'on le peut, et takfir", tr: "Yetenek ve Tekfirle Hacı Geciktirmek", id: "Menunda Haji dengan Kemampuan dan Takfir" }
summary:
  ar: "سأل سائل هل يكفر من سوف في أداء فريضة الحج مع القدرة والاستطاعة كما قال خطيب الجمعة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82871 بتاريخ 15 أكتوبر 2010)⁩ أن أهل العلم اختلفوا هل يجب الحج على الفور أم على التراخي ولهما قولان مشهوران أصحهما وجوبه على الفور لمن قدر ببدنه وماله، لكن هذا لا يعني تكفير المسوف أو التسوية بينه وبين المنكر وهذا ما لم يقرأه إلا في الاستفتاء، ولعل الخطيب استغرقه الحماس فأفلتت منه هذه العبارات على غير قصد، ونصح السائل أن يستفصل من صاحب القول بهدوء وألا يثير فتنة وأن يشتغل بما ينفعه."
  en: "A questioner asked whether one who postpones the hajj though able is a disbeliever, as the Friday preacher said. Dr. Salah al-Sawi (fatwa no. 82871, 15 October 2010) answered that scholars differ on whether hajj is due at once or may be deferred — two well-known opinions, the sounder being immediacy for whoever is able in body and wealth — yet that does not mean declaring the postponer a disbeliever or equating him with the denier, something he had only read in this very question; perhaps the preacher's zeal carried him away, and the questioner should quietly ask the speaker for clarification without stirring clamour, and busy himself with what benefits him. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ استطاعت کے باوجود حج ملتوی کرنے والا کافر ہوتا ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82871، 15 اکتوبر 2010)⁩ کے مطابق فوری وجوب قول اصح ہے مگر تاخیر کرنے والے کی تکفیر نہیں ہوتی۔"
  es: "Un interlocutor preguntó si quien pospone el Hajj, aun pudiendo realizarlo, es un incrédulo, como afirmó el predicador del viernes. El Dr. Salah al-Sawi (fatwa n.° 82871, 15 de octubre de 2010) respondió que los eruditos discrepan sobre si el Hajj debe realizarse de inmediato o puede aplazarse —dos opiniones bien conocidas, siendo la más sólida la inmediatez para quien tenga la capacidad física y económica—, pero que esto no implica declarar incrédulo al que lo pospone ni equipararlo con el negador, algo que solo había leído en esta misma pregunta; quizás el celo del predicador lo llevó a la interpretación, y el interlocutor debería pedirle una aclaración con calma, sin generar controversia, y ocuparse de lo que le conviene. Registrada como respuesta de AMJA."
  fr: "Un internaute a demandé si celui qui reporte le hajj, bien qu'en ayant les moyens, est un mécréant, comme l'avait affirmé le prédicateur du vendredi. Le Dr Salah al-Sawi (fatwa n° 82871, 15 octobre 2010) a répondu que les savants divergent quant à l'obligation d'accomplir le hajj immédiatement ou à la possibilité de le reporter – deux opinions bien connues, la plus solide préconisant l'immédiateté pour quiconque en a les capacités physiques et matérielles – mais que cela ne signifie pas pour autant déclarer celui qui reporte le hajj mécréant ou l'assimiler au négateur, chose qu'il avait seulement lue dans cette question même; peut-être l'enthousiasme du prédicateur l'avait-il emporté, et l'internaute devrait calmement demander des éclaircissements à l'orateur sans susciter de polémique, et se consacrer à ce qui lui est profitable. Réponse consignée par AMJA."
  tr: "Bir soru soran, Cuma vaizinin dediği gibi Hac görevini yerine getirmede sadakatsiz olan birinin yetenek ve yetenekle olup olmadığını sordu. Dr. Salah Al-Sawy (15 Ekim 2010 tarihli Fetva No. 82871) alimlerin Hacın hemen zorunlu mu yoksa gevşek mi olduğu konusunda farklı görüşler olduğunu yanıtladı. İki iyi bilinen görüşleri vardır; en doğrusu, bedenini ve servetini feda etmeye istekli olan kişinin hemen zorunlu olduğudur. Ancak bu, hacı hemen yapmakla yükümlü olanı ilan etmek veya onu sadece dini sorgulamada okuduğu kötülükle eşitlemek anlamına gelmez. Belki vaiz istemeden kaybettiği coşkuyla bunalmıştır. Soru sorana, konuşmacıdan sakin bir şekilde açıklama istemesini, anlaşmazlık çıkarmamasını ve kendisine fayda sağlayacak şeylerle ilgilenmesini tavsiye etmiştir."
  id: "Seorang penanya bertanya apakah seseorang yang tidak setia dalam melaksanakan kewajiban Haji memiliki kemampuan dan kemampuan seperti yang dikatakan penceramah Jumat. Dr. Salah Al-Sawy menjawab (Fatwa No. 82871 tanggal 15 Oktober 2010) bahwa para ulama berbeda pendapat apakah Haji itu wajib segera atau kelalaian. Mereka memiliki dua pendapat yang sudah dikenal, yang paling benar adalah bahwa Haji wajib segera bagi seseorang yang bersedia mengorbankan tubuh dan hartanya. Namun, ini tidak berarti menyatakan orang yang wajib melakukan Haji segera atau menyamakan dia dengan kejahatan, yang hanya ia baca dalam penyelidikan agama. Mungkin penceramah itu diliputi oleh antusiasme yang tanpa sengaja hilang darinya. Ia menyarankan penanya untuk dengan tenang mencari klarifikasi dari pembicara, tidak menimbulkan perselisihan, dan melakukan apa yang menguntungkannya."
