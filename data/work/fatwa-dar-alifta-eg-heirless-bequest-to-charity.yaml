label: { ar: "حكم وصية من لا وارث له بجميع ماله لجهة خيرية", en: "The bequest of one with no heir of his entire estate to a charity", ur: "بے وارث شخص کی پوری جائداد خیرات کو وصیت", es: "La donación de la totalidad de su patrimonio a una organización benéfica por parte de una persona sin herederos." }
summary:
  ar: "سائل سأل عن وصية من لا وارث له بجميع ماله لجهة خيرية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21634)⁩ أنه يجوز للإنسان المكلف الذي ليس له وارث أن يوصي بجميع تركته حال حياته ويكون تصرفه صحيحًا شرعًا على ما فصّل الجواب."
  en: "A questioner asked about a person with no heir bequeathing his entire estate to a charity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21634) answered that a responsible person without an heir may bequeath his whole estate in life and the disposition is valid in the sharia — as the answer details."
  ur: "ایک سائل نے بے وارث شخص کی پوری جائداد خیراتی ادارے کو وصیت کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21634)⁩ نے جواب دیا کہ جس کا وارث نہ ہو وہ زندگی میں پوری جائداد کی وصیت کر سکتا ہے اور یہ تصرف شرعاً صحیح ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que una persona sin herederos legue la totalidad de su patrimonio a una organización benéfica. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21634) respondió que una persona responsable sin herederos puede legar la totalidad de su patrimonio en vida y que dicha disposición es válida según la sharia, tal como se detalla en la respuesta."
