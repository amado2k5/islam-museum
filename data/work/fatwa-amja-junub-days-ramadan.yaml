id: work/fatwa-amja-junub-days-ramadan
class: work
kind: fatwa
label: { ar: "جنابة في رمضان", en: "Days in janaba in Ramadan — the prayer was the loss", ur: "رمضان میں جنابت — نماز کا نقصان" }
summary:
  ar: "سأل شاب أنه كان على جنابة في ليلة من ليالي رمضان وبقي أيامًا دون اغتسال وسأل عن صيامه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80012 بتاريخ 19 سبتمبر 2009)⁩ أنه عجب لسؤاله لأنه يسأل عن مدى إفساد الجنابة لصيامه ولا يسأل عن إفسادها للصلاة وأنه لا يرى كيف مرت عليه أيام دون اغتسال وماذا كان يفعل في صلاته، فالجنابة لا تفسد الصوم لكنها تمنع صحة الصلاة حتى يغتسل والواجب عليه التوبة وقضاء ما فاته من صلوات على ما فصّل الجواب."
  en: "A young man had been in janaba on a Ramadan night and stayed days unwashed, asking about his fast. Dr. Salah al-Sawi (fatwa no. 80012, 19 September 2009) marvelled at the question — he asks how janaba spoils his fast yet not how it spoils his prayer; how did days pass him unwashed and what was he doing in his prayers? Janaba does not corrupt the fast but bars the prayer's validity until he washes; he owes repentance and the make-up of the missed prayers — as the answer details."
  ur: "رمضان میں دنوں جنب رہا — روزہ کا کیا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80012، 19 ستمبر 2009)⁩ کے مطابق روزہ باقی مگر نمازیں باطل — توبہ اور قضا واجب۔"
