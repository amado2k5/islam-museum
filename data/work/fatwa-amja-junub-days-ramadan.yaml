id: work/fatwa-amja-junub-days-ramadan
class: work
kind: fatwa
label: { ar: "جنابة في رمضان", en: "Days in janaba in Ramadan — the prayer was the loss", ur: "رمضان میں جنابت — نماز کا نقصان", es: "Días en janaba en Ramadán: la oración fue la pérdida", fr: "Les jours passés en janaba pendant le Ramadan — la prière était une perte", tr: "Ramazan ayında Canabah", id: "Janabah di Ramadan" }
summary:
  ar: "سأل شاب أنه كان على جنابة في ليلة من ليالي رمضان وبقي أيامًا دون اغتسال وسأل عن صيامه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80012 بتاريخ 19 سبتمبر 2009)⁩ أنه عجب لسؤاله لأنه يسأل عن مدى إفساد الجنابة لصيامه ولا يسأل عن إفسادها للصلاة وأنه لا يرى كيف مرت عليه أيام دون اغتسال وماذا كان يفعل في صلاته، فالجنابة لا تفسد الصوم لكنها تمنع صحة الصلاة حتى يغتسل والواجب عليه التوبة وقضاء ما فاته من صلوات على ما فصّل الجواب."
  en: "A young man had been in janaba on a Ramadan night and stayed days unwashed, asking about his fast. Dr. Salah al-Sawi (fatwa no. 80012, 19 September 2009) marvelled at the question — he asks how janaba spoils his fast yet not how it spoils his prayer; how did days pass him unwashed and what was he doing in his prayers? Janaba does not corrupt the fast but bars the prayer's validity until he washes; he owes repentance and the make-up of the missed prayers — as the answer details."
  ur: "رمضان میں دنوں جنب رہا — روزہ کا کیا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80012، 19 ستمبر 2009)⁩ کے مطابق روزہ باقی مگر نمازیں باطل — توبہ اور قضا واجب۔"
  es: "Un joven había estado en estado de impureza ritual (janaba) durante una noche de Ramadán y pasó días sin lavarse, preguntando sobre su ayuno. El Dr. Salah al-Sawi (fatwa n.° 80012, 19 de septiembre de 2009) se maravilló ante la pregunta: preguntaba cómo la impureza ritual invalidaba su ayuno, pero no cómo invalidaba su oración; cómo había pasado días sin lavarse y qué hacía durante sus oraciones. La impureza ritual no corrompe el ayuno, pero impide que la oración sea válida hasta que se lave; debe arrepentirse y recuperar las oraciones perdidas, como se detalla en la respuesta."
  fr: "Un jeune homme, ayant passé une nuit d'impureté majeure (janaba) pendant le Ramadan et étant resté plusieurs jours sans se laver, s'interrogea sur la validité de son jeûne. Le Dr Salah al-Sawi (fatwa n° 80012, 19 septembre 2009) s'étonna de cette question: comment l'impureté majeure pouvait-elle invalider le jeûne sans pour autant invalider la prière ? Comment avait-il pu passer des jours sans se laver et comment pouvait-il prier ? L'impureté majeure n'invalide pas le jeûne, mais elle rend la prière insoutenable jusqu'à ce que le jeune homme se soit purifié. Il doit se repentir et rattraper les prières manquées, comme le précise la réponse."
  tr: "Genç bir adam, Ramazan gecelerinden birinde büyük bir kirlilik halinde olup olmadığını ve günlerce hüsl yapmadığını sordu ve oruç hakkında bilgi aldı. Dr. Salah Al-Sawy (19 Eylül 2009 tarihli Fetva No. 80012) sorusuna şaşırdığını çünkü cenaba'nın orucunu ne ölçüde geçersiz kıldığını sorduğunu söyledi, ancak namazın geçersiz kılındığını sormadı. Günlerin nasıl gusl olmadan geçtiğini ya da namazında ne yaptığını görmedi. Janabah orucu geçersiz kılmaz, ancak gusl kılana kadar namazın geçerliliğini engeller. Cevapta açıklandığı gibi, tövbe etmeli ve kaçırılan namazları telafi etmelidir."
  id: "Seorang pemuda bertanya apakah ia berada dalam kondisi kotoran berat pada salah satu malam Ramadan dan telah tinggal berhari-hari tanpa ghusl, dan ia bertanya tentang puasanya. Dr. Salah Al-Sawy menjawab (Fatwa No. 80012 tanggal 19 September 2009) bahwa ia terkejut dengan pertanyaannya karena ia bertanya sejauh mana janaba membatalkan puasanya, tetapi ia tidak menanyakan tentang pembatalan doa janaba. Ia tidak melihat bagaimana hari-hari berlalu tanpa ghusl atau apa yang ia lakukan dalam doanya. Janabah tidak membatalkan puasa, tetapi mencegah keabsahan doa sampai ia melakukan ghusl. Ia harus bertobat dan menebus doa yang terlewat, seperti yang dijelaskan dalam jawaban."
