id: work/fatwa-dar-alifta-running-an-internet-cafe-with-video-games
class: work
kind: fatwa
label: { ar: "حكم عمل سايبر يحتوي على ألعاب ترفيهية", en: "Running an internet café with video games", ur: "تفریحی گیمز والا انٹرنیٹ کیفے ⁦(سائبر)⁩ چلانے کا حکم" }
summary:
  ar: "سؤال من شخص ينوي المشاركة مع صديقه في افتتاح سايبر ترفيهي يقدم ألعابًا إلكترونية وإنترنت غير محدود وطباعة وفاكس، وقد قيل له إنه حرام لأنه من اللهو الذي يلهي عن الصلاة، أجابت فيه دار الإفتاء المصرية بأن المشروع إن خلا من المحاذير الشرعية كالألعاب والمواقع التي تشتمل على عورات أو تدعو للرذيلة، والتزم أصحابه بعدم الإعانة على إلهاء رواده عن واجباتهم كالصلاة، فهو جائز والربح منه حلال، أما إذا اشتمل على محرمات كالتساهل في المحتوى الإباحي أو تسبب في إضاعة الواجبات فيصير حرامًا والمشاركة فيه تعاون على الإثم، والعبرة بالمحتوى والغاية. بيّنت الدار سماحة الشريعة وموازنتها بين حاجات الروح والجسد بآية القصص وحديث حنظلة ساعة وساعة، وأن الأصل في اللهو والترويح الإباحة ما لم يقترن بمحظور، بآية يوسف وحديث لعب الحبش بحرابهم وقول عمر علّموا غلمانكم العوم، ونقلت عن ابن القاص جواز ملاعب الصبيان إذا لم تكن من الملاهي المنهية، وأن خدمات الطباعة والفاكس مباحة في أصلها والإشكال في الألعاب والإنترنت المفتوح. ثم عدّدت ثمانية ضوابط لإباحة الترويح: ألا يصير إدمانًا ضارًا، وألا يضيّع حقوق الله، وألا يشتمل على ميسر، وألا يقترن بسلوك محرم كتصوير العورات، وألا يتضمن طقوسًا تخالف العقيدة، وألا يؤدي إلى النزاع والعنف، وألا يكون من ألعاب التجسس الممنوعة، وألا يضيّع حقوق العباد، وقالت إن توفير المحرمات تمكين من المنكر ومشاركة في الإثم."
  en: "A question from a person intending to open, with a friend, an entertainment internet café offering video games, unrestricted internet, printing and fax, who had been told it is forbidden as idle play that distracts from prayer; Dar al-Ifta al-Misriyya answered that if the project is free of what sharia bars, such as games and websites that expose nakedness or invite vice, and the owners undertake not to help distract their customers from religious duties such as prayer, it is permissible and its profit lawful; but if it includes forbidden things, such as laxity over pornographic content or forbidden games, or causes customers to neglect their duties, it becomes forbidden and partnership in it is cooperation in sin, the test being content and purpose. Dar al-Ifta set out the tolerance of sharia and its balance between the needs of soul and body from the verse of al-Qasas and the hadith of Hanzala, 'an hour and an hour', held that play and recreation are permissible in principle unless joined to something forbidden, citing the verse of Yusuf, the hadith of the Abyssinians playing with their spears and Umar's saying 'teach your boys to swim', and Ibn al-Qass on the permissibility of children's games that are not among the forbidden pastimes, and noted that printing and fax services are permissible in themselves while the difficulty lies in the games and open internet. It then listed eight conditions for permissible recreation: that it not become a harmful addiction, not cause the neglect of God's rights, not involve gambling, not be joined to forbidden conduct such as depicting nakedness, not contain rituals contrary to Muslim belief, not lead to quarrel and violence, not be among the espionage games that are banned, and not cause the neglect of people's rights; and it said that providing forbidden material enables wrongdoing and shares in the sin."
  ur: "ایک شخص کا سوال جو اپنے دوست کے ساتھ تفریحی انٹرنیٹ کیفے کھولنا چاہتا ہے جس میں الیکٹرانک گیمز، لامحدود انٹرنیٹ، پرنٹنگ اور فیکس ہوں، اور جسے بتایا گیا کہ یہ حرام ہے کیونکہ یہ ایسا لہو ہے جو نماز سے غافل کرتا ہے؛ دار الافتاء مصر نے جواب دیا کہ اگر منصوبہ شرعی محذورات سے خالی ہو، جیسے ایسی گیمز اور ویب سائٹیں جو عورتوں پر مشتمل ہوں یا برائی کی دعوت دیں، اور مالک گاہکوں کو نماز جیسے دینی فرائض سے غافل کرنے میں مدد نہ کرنے کا التزام کریں، تو یہ جائز ہے اور اس کا منافع حلال؛ لیکن اگر اس میں حرام چیزیں شامل ہوں، جیسے فحش مواد یا حرام گیمز میں نرمی، یا یہ گاہکوں کے فرائض ضائع کرنے کا سبب بنے، تو حرام ہو جاتا ہے اور اس میں شراکت گناہ میں تعاون ہے، اور اعتبار مواد اور مقصد کا ہے۔ دار الافتاء نے شریعت کی وسعت اور روح اور جسم کی ضرورتوں میں اس کے توازن کو سورہ قصص کی آیت اور حنظلہ کی حدیث 'ایک گھڑی اور ایک گھڑی' سے بیان کیا، کہا کہ لہو اور تفریح میں اصل اباحت ہے جب تک کسی محذور کے ساتھ نہ جڑے، سورہ یوسف کی آیت، حبشیوں کے نیزوں سے کھیلنے کی حدیث اور عمر کے قول 'اپنے لڑکوں کو تیرنا سکھاؤ' سے استدلال کرتے ہوئے، اور ابن القاص سے بچوں کے ایسے کھیلوں کا جواز نقل کیا جو ممنوع لہویات میں سے نہ ہوں، اور ذکر کیا کہ پرنٹنگ اور فیکس کی خدمات اصلاً مباح ہیں اور مشکل گیمز اور کھلے انٹرنیٹ میں ہے۔ پھر اس نے جائز تفریح کی آٹھ شرطیں شمار کیں: وہ نقصان دہ لت نہ بن جائے، اللہ کے حقوق ضائع نہ کرے، جوئے پر مشتمل نہ ہو، حرام رویے جیسے عورتوں کی تصویر کشی سے نہ جڑے، مسلمانوں کے عقیدے کے خلاف رسوم پر مشتمل نہ ہو، جھگڑے اور تشدد تک نہ لے جائے، ممنوعہ جاسوسی گیمز میں سے نہ ہو، اور بندوں کے حقوق ضائع نہ کرے؛ اور کہا کہ حرام مواد فراہم کرنا منکر کو ممکن بنانا اور گناہ میں شرکت ہے۔"
