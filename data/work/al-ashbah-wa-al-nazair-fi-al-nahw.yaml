summary:
  ar: "«الأشباه والنظائر في النحو» كتاب في علم النحو العربي نسبه ملخص بحثي قُدّم إلى المتحف إلى جلال الدين السيوطي، وذكر تاريخه هكذا: وفاة المؤلف 1505م / 911هـ {cite:wikipedia-al-ashbah-wa-al-nazair-fi-al-nahw-ar}. وعدّه الملخص بين ستين كتاباً هي الأكثر استشهاداً بها في علوم العربية الخمسة."
  en: "al-Ashbah wa-l-Naza'ir fi al-Nahw is a work of Arabic grammar that a research summary supplied to the museum ascribes to Jalal al-Din al-Suyuti, giving its date as: author died 1505 CE / 911 AH {cite:wikipedia-al-ashbah-wa-al-nazair-fi-al-nahw-ar}. The summary counts it among sixty of the most-cited works in the five Arabic sciences."
  ur: "«الاشباہ و النظائر فی النحو» عربی نحو کی کتاب ہے جسے عجائب گھر کو دیا گیا ایک تحقیقی خلاصہ جلال الدين السيوطي سے منسوب کرتا ہے اور اس کی تاریخ یوں دیتا ہے: مصنف کی وفات 1505 ء / 911 ھ {cite:wikipedia-al-ashbah-wa-al-nazair-fi-al-nahw-ar}۔ خلاصہ اسے عربی کے پانچ علوم کی ساٹھ سب سے زیادہ حوالہ دی جانے والی کتابوں میں شمار کرتا ہے۔"
  fr: "al-Ashbah wa-l-Naza'ir fi al-Nahw est un ouvrage de grammaire arabe qu'un résumé de recherche remis au musée attribue à Jalal al-Din al-Suyuti, en donnant sa date ainsi : mort de l'auteur 1505 ap. J.-C. / 911 de l'Hégire {cite:wikipedia-al-ashbah-wa-al-nazair-fi-al-nahw-ar}. Le résumé le compte parmi soixante des ouvrages les plus cités dans les cinq sciences de l'arabe."
  es: "al-Ashbah wa-l-Naza'ir fi al-Nahw es una obra de gramática árabe que un resumen de investigación entregado al museo atribuye a Jalal al-Din al-Suyuti, y cuya fecha da así: muerte del autor 1505 d. C. / 911 de la hégira {cite:wikipedia-al-ashbah-wa-al-nazair-fi-al-nahw-ar}. El resumen la cuenta entre sesenta de las obras más citadas en las cinco ciencias del árabe."
