id: work/fatwa-dar-alifta-eg-murabaha-and-two-sales-in-one
class: work
kind: fatwa
label: { ar: "مدى دخول عقد المرابحة في النهي عن بيعتين في بيعة", en: "Does the murabaha contract fall under the bar on two sales in one?", ur: "کیا مرابحہ کا عقد 'ایک بیع میں دو بیع' کی ممانعت میں داخل ہے؟", es: "¿El contrato de murabaha se incluye dentro de la restricción de dos ventas en una?", fr: "Le contrat murabaha est-il concerné par l'interdiction de deux ventes en une ?", tr: "Murabaha sözleşmesinin bir satışta iki satışın yasaklanmasına ne ölçüde uygulandığı", id: "Sejauh mana kontrak Murabaha berlaku untuk larangan dua penjualan dalam satu penjualan" }
summary:
  ar: "سائل سأل عن شراء سيارة بالتقسيط بثمن إجمالي محدد ومدة سداد معلومة متفق عليهما في مجلس العقد، وهل يدخل ذلك في النهي عن بيعتين في بيعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22593)⁩ أن ذلك معاملة جائزة لا تدخل في بيعتين في بيعة المنهي عنها على ما فصّل الجواب."
  en: "A questioner asked about buying a car in installments at a fixed total price for a known term agreed in full at the contract session, and whether it falls under the prohibition on two sales in one. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22593) answered that this is a permissible transaction that does not enter the forbidden 'two sales in one sale', as the answer details."
  ur: "ایک سائل نے اقساط پر گاڑی خریدنے کے بارے میں پوچھا جس میں مجموعی قیمت اور مدتِ ادائیگی عقد کے مجلس میں طے ہو، اور کیا یہ 'ایک بیع میں دو بیع' کی ممانعت میں داخل ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22593)⁩ نے جواب دیا کہ یہ جائز معاملہ ہے اور ممنوع 'دو بیع ایک بیع میں' میں داخل نہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la compra de un automóvil a plazos a un precio total fijo y por un plazo determinado, acordado íntegramente en la sesión de firma del contrato, y si esta práctica está sujeta a la prohibición de realizar dos ventas en una. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22593) respondió que se trata de una transacción permisible que no entra dentro de la prohibición de realizar dos ventas en una, tal como se detalla en la respuesta."
  fr: "Un interlocuteur a demandé si l'achat d'une voiture à crédit, à un prix total fixe et pour une durée connue et convenue lors de la signature du contrat, relevait de l'interdiction de la double vente. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22593) a répondu que cette transaction était licite et ne relevait pas de l'interdiction de la double vente, comme le précise la réponse."
  tr: "Bir soru soran, sözleşme kurulunda kararlaştırılan sabit toplam fiyat ve sabit ödeme süresiyle taksitli araç satın alınmasını ve bunun bir satışta iki satışın yasaklanıp kapsamına girmediğini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22593), bunun yasaklı bir satışta iki satışa dönüşmeyen bir işlem olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang pembelian mobil secara cicilan dengan harga total tetap dan periode pembayaran tetap, keduanya disepakati dalam dewan kontrak, dan apakah hal ini termasuk dalam larangan dua penjualan dalam satu penjualan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22593) menjawab bahwa ini adalah transaksi yang diperbolehkan dan tidak termasuk dalam dua penjualan dalam penjualan terlarang, seperti yang dijelaskan dalam jawaban."
