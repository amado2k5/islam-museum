id: work/fatwa-dar-alifta-eg-murabaha-and-two-sales-in-one
class: work
kind: fatwa
label: { ar: "مدى دخول عقد المرابحة في النهي عن بيعتين في بيعة", en: "Does the murabaha contract fall under the bar on two sales in one?", ur: "کیا مرابحہ کا عقد 'ایک بیع میں دو بیع' کی ممانعت میں داخل ہے؟" }
summary:
  ar: "سائل سأل عن شراء سيارة بالتقسيط بثمن إجمالي محدد ومدة سداد معلومة متفق عليهما في مجلس العقد، وهل يدخل ذلك في النهي عن بيعتين في بيعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22593)⁩ أن ذلك معاملة جائزة لا تدخل في بيعتين في بيعة المنهي عنها على ما فصّل الجواب."
  en: "A questioner asked about buying a car in installments at a fixed total price for a known term agreed in full at the contract session, and whether it falls under the prohibition on two sales in one. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22593) answered that this is a permissible transaction that does not enter the forbidden 'two sales in one sale', as the answer details."
  ur: "ایک سائل نے اقساط پر گاڑی خریدنے کے بارے میں پوچھا جس میں مجموعی قیمت اور مدتِ ادائیگی عقد کے مجلس میں طے ہو، اور کیا یہ 'ایک بیع میں دو بیع' کی ممانعت میں داخل ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22593)⁩ نے جواب دیا کہ یہ جائز معاملہ ہے اور ممنوع 'دو بیع ایک بیع میں' میں داخل نہیں، جیسا کہ جواب میں تفصیل ہے۔"
