label: { ar: "كتاب النبي إلى ملوك حمير", en: "The Prophet's letter to the kings of Himyar" }
summary:
  ar: "كتاب بعث به النبي إلى الحارث بن عبد كلال ونعيم بن عبد كلال والنعمان قيل ذي رعين ومعافر وهمدان جواباً على كتابهم بإسلامهم: يذكر لقاء رسولهم بالمدينة منقلبه من أرض الروم، ويبيّن ما على المسلمين من الصلاة والزكاة وخمس المغانم وسهم النبي وصفيه، وفرائض الصدقة في الزرع والإبل والبقر والغنم، وأن من أسلم من يهودي أو نصراني فهو من المؤمنين، ومن بقي على دينه لا يُرد عنها وعليه الجزية ديناراً وافياً على كل حالم أو عوضه ثياباً. ثم خطاب لزرعة ذي يزن بالوصية برسله وأن أميرهم معاذ بن جبل، وأن الصدقة لا تحل لمحمد ولا لأهل بيته."
  en: "A letter the Prophet sent to al-Harith ibn Abd Kulal, Nu'aym ibn Abd Kulal and al-Nu'man, qayl of Dhu Ru'ayn, Ma'afir and Hamdan, in answer to their letter announcing their Islam: it records meeting their envoy at Medina on his return from the land of the Romans, sets out the Muslims' duties of prayer, zakat, the fifth of booty with the Prophet's share and safi, the sadaqa rates on crops, camels, cattle and sheep, and rules that a Jew or Christian who converts is a believer while one who keeps his faith is not turned from it and owes a jizya of one full dinar per adult or its value in cloth. A second part addresses Zur'a Dhu Yazan, commending the envoys under Mu'adh ibn Jabal and stating that sadaqa is unlawful for Muhammad and his household."
