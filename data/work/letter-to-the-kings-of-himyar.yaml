id: work/letter-to-the-kings-of-himyar
class: work
kind: charter
label: { ar: "كتاب النبي إلى ملوك حمير", en: "The Prophet's letter to the kings of Himyar", es: "La carta del Profeta a los reyes de Himyar", fr: "Lettre du Prophète aux rois d'Himyar", ur: "ہمیار کے بادشاہوں کے نام پیغمبر کا خط" }
summary:
  ar: "كتاب بعث به النبي إلى الحارث بن عبد كلال ونعيم بن عبد كلال والنعمان قيل ذي رعين ومعافر وهمدان جواباً على كتابهم بإسلامهم: يذكر لقاء رسولهم بالمدينة منقلبه من أرض الروم، ويبيّن ما على المسلمين من الصلاة والزكاة وخمس المغانم وسهم النبي وصفيه، وفرائض الصدقة في الزرع والإبل والبقر والغنم، وأن من أسلم من يهودي أو نصراني فهو من المؤمنين، ومن بقي على دينه لا يُرد عنها وعليه الجزية ديناراً وافياً على كل حالم أو عوضه ثياباً. ثم خطاب لزرعة ذي يزن بالوصية برسله وأن أميرهم معاذ بن جبل، وأن الصدقة لا تحل لمحمد ولا لأهل بيته."
  en: "A letter the Prophet sent to al-Harith ibn Abd Kulal, Nu'aym ibn Abd Kulal and al-Nu'man, qayl of Dhu Ru'ayn, Ma'afir and Hamdan, in answer to their letter announcing their Islam: it records meeting their envoy at Medina on his return from the land of the Romans, sets out the Muslims' duties of prayer, zakat, the fifth of booty with the Prophet's share and safi, the sadaqa rates on crops, camels, cattle and sheep, and rules that a Jew or Christian who converts is a believer while one who keeps his faith is not turned from it and owes a jizya of one full dinar per adult or its value in cloth. A second part addresses Zur'a Dhu Yazan, commending the envoys under Mu'adh ibn Jabal and stating that sadaqa is unlawful for Muhammad and his household."
  es: "Una carta que el Profeta envió a al-Harith ibn Abd Kulal, Nu'aym ibn Abd Kulal y al-Nu'man, qayl de Dhu Ru'ayn, Ma'afir y Hamdan, en respuesta a su carta anunciando su conversión al Islam: registra el encuentro con su enviado en Medina a su regreso de la tierra de los romanos, establece los deberes de los musulmanes de la oración, el zakat, la quinta parte del botín con la parte del Profeta y el safi, las tasas de sadaqa sobre las cosechas, los camellos, el ganado y las ovejas, y dictamina que un judío o cristiano que se convierte es un creyente, mientras que quien mantiene su fe no se aparta de ella y debe una jizya de un dinar completo por adulto o su valor en tela. Una segunda parte se dirige a Zur'a Dhu Yazan, elogiando a los enviados bajo el mando de Mu'adh ibn Jabal y declarando que la sadaqa es ilícita para Muhammad y su familia."
  fr: "Lettre adressée par le Prophète à al-Harith ibn Abd Kulal, Nu'aym ibn Abd Kulal et al-Nu'man, qayl de Dhu Ru'ayn, Ma'afir et Hamdan, en réponse à leur lettre annonçant leur conversion à l'islam: elle relate sa rencontre avec leur envoyé à Médine à son retour du pays des Romains, expose les devoirs des musulmans concernant la prière, la zakat, le cinquième du butin avec la part du Prophète et le safi, les taux de la sadaqa sur les récoltes, les chameaux, les bovins et les moutons, et stipule qu'un Juif ou un Chrétien qui se convertit est considéré comme croyant, tandis que celui qui conserve sa foi n'est pas considéré comme apostat et doit s'acquitter de la jizya, soit un dinar entier par adulte ou son équivalent en tissu. Une seconde partie traite de la sourate Dhu Yazan, louant les envoyés de Mu'adh ibn Jabal et précisant que la sadaqa est illicite pour Muhammad et sa famille."
  ur: "رسول اللہ نے حارث بن عبد کلال، نعیم بن عبد کلال اور النعمان، قیل ذو روعین، معافر اور ہمدان کو بھیجا، ان کے خط کے جواب میں ان کے اسلام کا اعلان: اس میں رومیوں کی سرزمین سے واپسی پر مدینہ میں ان کے ایلچی سے ملاقات کا ذکر ہے، مسلمانوں کی نماز، زکوٰۃ، فقہ کے ساتھ نماز کی ادائیگی کا ذکر ہے۔ نبی کا حصہ اور صافی، فصلوں، اونٹوں، گائے اور بکریوں پر صدقہ کی شرح، اور یہ قاعدہ ہے کہ جو یہودی یا عیسائی مذہب اختیار کرتا ہے وہ مؤمن ہے اور جو اپنا ایمان رکھتا ہے وہ اس سے باز نہیں آتا اور اس پر ایک پورا دینار فی بالغ یا اس کی قیمت کپڑے میں واجب الادا ہے۔ دوسرا حصہ ثریا ذو یزان سے خطاب کرتا ہے، جس میں معاذ بن جبل کے ماتحت سفیروں کی تعریف کی گئی ہے اور کہا گیا ہے کہ صدقہ محمد اور ان کے گھر والوں کے لیے حرام ہے۔"
