id: work/fatwa-iifa-265-cultivated-meat
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 265 (10/26) بشأن اللحوم المستزرعة", en: "IIFA resolution 265 (10/26) on cultivated meat", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 265 (10/26): لیبارٹری میں تیار کردہ گوشت" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي أجاز استهلاك اللحوم المستزرعة وتسويقها بستة ضوابط. أكد المجمع قراره رقم 198 (4/21) في الاستحالة والاستهلاك والمواد المضافة في الغذاء والدواء، وقراره رقم 94 (2/10) في الاستنساخ البشري. وعرّف اللحوم المستزرعة بأنها غذاء يُصنع من خلايا تؤخذ في الغالب من حيوان حي ثم تُنمّى في مختبر أسابيع بإضافة عناصر غذائية كالسكر والفيتامينات والأملاح، وتسمى أيضًا اللحوم المنتجة مخبريًا أو النظيفة. وأجاز استهلاكها وتسويقها بشروط: أن تؤخذ الخلايا من حيوان مباح الأكل حي أو مذكى ذكاة شرعية، وألا تُنمّى في وسط محرم كالدم المسفوح ولا يضاف إليها محرم كجلاتين الخنزير، وأن يجري الاستزراع كله تحت إشراف جهة مختصة موثوقة، وأن يكون المنتج صالحًا للأكل غير مضر، وأن تكون رافدًا إلى جانب اللحم الحيواني لا بديلًا عنه، وأن تفصح الشركات للمستهلكين عن المعلومات اللازمة وتتحقق الجهات الإشرافية من التزامها."
  en: "A collective resolution of the International Islamic Fiqh Academy permitting the consumption and marketing of cultivated meat under six conditions. The Academy reaffirmed its resolution 198 (4/21) on transformation, dilution and additives in food and medicine, and its resolution 94 (2/10) on human cloning. It defined cultivated meat as food made from cells usually taken from a living animal and grown in a laboratory over weeks with nutrients such as glucose, vitamins and salts, also called lab-grown or clean meat. It permitted consuming and marketing it on conditions: the cells come from an animal lawful to eat, either alive or ritually slaughtered; they are not grown in a forbidden medium such as spilled blood, and nothing forbidden such as pork gelatine is added; the whole process runs under a trusted specialist authority; the final product is fit to eat and harmless; it supplements animal meat rather than replacing it; and companies disclose the necessary information to consumers, with supervisory bodies checking compliance."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جس نے چھ شرائط کے ساتھ لیبارٹری میں تیار کردہ گوشت کھانے اور بیچنے کی اجازت دی۔ اکیڈمی نے غذا اور دوا میں استحالہ، استہلاک اور اضافی مواد سے متعلق اپنی قرارداد 198 (4/21) اور انسانی کلوننگ سے متعلق قرارداد 94 (2/10) کی توثیق کی۔ اس نے ایسے گوشت کی تعریف یہ کی کہ یہ غذا عموماً زندہ جانور سے لیے گئے خلیوں سے بنتی ہے جنہیں لیبارٹری میں گلوکوز، وٹامن اور نمکیات جیسے غذائی اجزا ڈال کر ہفتوں تک بڑھایا جاتا ہے، اور اسے لیبارٹری کا یا صاف گوشت بھی کہا جاتا ہے۔ اس نے شرائط کے ساتھ اسے کھانے اور بیچنے کی اجازت دی: خلیے حلال جانور سے لیے جائیں جو زندہ ہو یا شرعی طریقے سے ذبح کیا گیا ہو؛ انہیں بہتے خون جیسے حرام ماحول میں نہ بڑھایا جائے اور خنزیر کی جیلاٹین جیسی کوئی حرام چیز نہ ملائی جائے؛ پورا عمل کسی معتبر ماہر ادارے کی نگرانی میں ہو؛ حتمی پیداوار کھانے کے قابل اور بے ضرر ہو؛ یہ جانور کے گوشت کا متبادل نہیں بلکہ اس کے ساتھ اضافہ ہو؛ اور کمپنیاں صارفین کو ضروری معلومات بتائیں اور نگران ادارے اس کی پابندی جانچیں۔"
