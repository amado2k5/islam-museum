label: { ar: "قرار مجمع الفقه الإسلامي الدولي 116 (12/10) بشأن ترجمة القرآن الكريم", en: "IIFA resolution 116 (12/10) on translating the Qur'an", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 116 (12/10): قرآنِ کریم کا ترجمہ", es: "Resolución 116 (12/10) de la IIFA sobre la traducción del Corán", fr: "Résolution 116 (12/10) de l'IIFA sur la traduction du Coran", tr: "Uluslararası İslami Fiqh Akademisi Kararı 116 (12/10) Kutsal Kuran'ın çevirisiyle ilgili", id: "Resolusi Akademi Fiqh Islam Internasional 116 (12/10) mengenai terjemahan Al-Qur'an" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد اطلاعه على ورقة عمل بشأن ترجمة معاني القرآن الكريم محالة من الأمانة العامة لمؤتمر وزراء الأوقاف والشؤون الإسلامية ومعدة من مجمع الملك فهد لطباعة المصحف الشريف، وتتضمن المعايير والشروط الخاصة والإجراءات لترجمة معاني القرآن. بعد دراسة مستفيضة ومناقشات بمشاركة الأعضاء والخبراء والفقهاء، قرر إقرار جميع بنود ورقة العمل المقدمة بشأن ترجمة معاني القرآن الكريم، وأوصى بإنشاء هيئة تُعنى بتفسير القرآن الكريم وعلومه ترتبط بمجمع الملك فهد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after reviewing a working paper on translating the meanings of the Qur'an — referred by the secretariat of the Conference of Ministers of Awqaf and Islamic Affairs and prepared by the King Fahd Complex for the Printing of the Holy Qur'an — containing the standards, special conditions and procedures for such translation. After extensive study and discussion with members, experts and jurists, it approved all clauses of the working paper and recommended establishing a body devoted to Qur'anic exegesis and sciences attached to the King Fahd Complex."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، قرآن کے معانی کے ترجمے پر ورکنگ پیپر کے مطالعے کے بعد — جو وزرائے اوقاف و امورِ دینیہ کانفرنس کے سیکرٹریٹ نے بھیجا اور شاہ فہد مصحف پرنٹنگ کمپلیکس نے تیار کیا — جس میں ایسے ترجمے کے معیارات، خصوصی شرائط اور طریقہ کار تھے۔ تفصیلی مطالعے اور ارکان، ماہرین و فقہاء کی مباحث کے بعد اس نے ورکنگ پیپر کی تمام دفعات منظور کیں اور شاہ فہد کمپلیکس سے ملحق تفسیر و علومِ قرآن کے لیے ایک ادارہ قائم کرنے کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica, en su 12.ª sesión celebrada en Riad (25 de Jumada II – 1 de Rajab de 1421, del 23 al 28 de septiembre de 2000), tras examinar un documento de trabajo sobre la traducción de los significados del Corán —remitido por la secretaría de la Conferencia de Ministros de Asuntos Islámicos y de Awqaf y elaborado por el Complejo Rey Fahd para la Impresión del Sagrado Corán— que contenía las normas, condiciones especiales y procedimientos para dicha traducción. Tras un exhaustivo estudio y debate con miembros, expertos y juristas, la resolución aprobó todas las cláusulas del documento de trabajo y recomendó la creación de un organismo dedicado a la exégesis coránica y las ciencias, adscrito al Complejo Rey Fahd."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), après examen d'un document de travail sur la traduction des significations du Coran – présenté par le secrétariat de la Conférence des ministres des Awqaf et des Affaires islamiques et préparé par le Complexe du roi Fahd pour l'impression du Saint Coran – énonçant les normes, conditions particulières et procédures applicables à cette traduction. Après une étude approfondie et des discussions avec ses membres, des experts et des juristes, l'Académie a approuvé toutes les clauses du document et recommandé la création d'un organisme consacré à l'exégèse et aux sciences coraniques, rattaché au Complexe du roi Fahd."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin on ikinci oturumunda (25 Cumada'l-Ahhirah – 1 Rajab 1421 H, 23–28 Eylül 2000) toplu kararı, Awqaf ve İslam İşleri Bakanlar Konferansı Genel Sekreterliği tarafından sunulan ve Kur'an-ı Kerim'in Baskısı için Kral Fahd Kompleksi tarafından hazırlanan Kur'an-ın anlamlarının çevirisi üzerine çalışma belgesinin incelenmesi sonucunda, Kur'an'ın anlamlarının tercüme standartları, özel koşulları ve prosedürleri yer almaktadır. Üyeler, uzmanlar ve hukukçuların katılımıyla kapsamlı çalışma ve tartışmaların ardından, sunulan çalışma belgesinin tüm maddelerinin onaylanmasına karar verildi ve Kur'an-ı Kerim ile onun bilimlerinin yorumlanmasıyla ilgilenen ve Kral Fahd Akademisi'ne bağlı bir kurumun kurulması tavsiye edildi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000 M), setelah meninjau makalah kerja tentang terjemahan makna Al-Qur'an yang diajukan oleh Sekretariat Jenderal Konferensi Menteri Awqaf dan Urusan Islam dan disiapkan oleh Kompleks Raja Fahd untuk Pencetakan Al-Qur'an, yang mencakup standar, kondisi khusus, dan prosedur penerjemahan makna Al-Qur'an. Setelah studi dan diskusi mendalam dengan partisipasi anggota, ahli, dan ahli hukum, diputuskan untuk menyetujui semua item makalah kerja yang diajukan tentang terjemahan makna Al-Qur'an, dan merekomendasikan pembentukan badan yang berfokus pada penafsiran Al-Qur'an dan ilmu-ilmunya yang berafiliasi dengan Akademi Raja Fahd."
