label: { ar: "قرار مجمع الفقه الإسلامي الدولي 116 (12/10) بشأن ترجمة القرآن الكريم", en: "IIFA resolution 116 (12/10) on translating the Qur'an", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 116 (12/10): قرآنِ کریم کا ترجمہ" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد اطلاعه على ورقة عمل بشأن ترجمة معاني القرآن الكريم محالة من الأمانة العامة لمؤتمر وزراء الأوقاف والشؤون الإسلامية ومعدة من مجمع الملك فهد لطباعة المصحف الشريف، وتتضمن المعايير والشروط الخاصة والإجراءات لترجمة معاني القرآن. بعد دراسة مستفيضة ومناقشات بمشاركة الأعضاء والخبراء والفقهاء، قرر إقرار جميع بنود ورقة العمل المقدمة بشأن ترجمة معاني القرآن الكريم، وأوصى بإنشاء هيئة تُعنى بتفسير القرآن الكريم وعلومه ترتبط بمجمع الملك فهد."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after reviewing a working paper on translating the meanings of the Qur'an — referred by the secretariat of the Conference of Ministers of Awqaf and Islamic Affairs and prepared by the King Fahd Complex for the Printing of the Holy Qur'an — containing the standards, special conditions and procedures for such translation. After extensive study and discussion with members, experts and jurists, it approved all clauses of the working paper and recommended establishing a body devoted to Qur'anic exegesis and sciences attached to the King Fahd Complex."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، قرآن کے معانی کے ترجمے پر ورکنگ پیپر کے مطالعے کے بعد — جو وزرائے اوقاف و امورِ دینیہ کانفرنس کے سیکرٹریٹ نے بھیجا اور شاہ فہد مصحف پرنٹنگ کمپلیکس نے تیار کیا — جس میں ایسے ترجمے کے معیارات، خصوصی شرائط اور طریقہ کار تھے۔ تفصیلی مطالعے اور ارکان، ماہرین و فقہاء کی مباحث کے بعد اس نے ورکنگ پیپر کی تمام دفعات منظور کیں اور شاہ فہد کمپلیکس سے ملحق تفسیر و علومِ قرآن کے لیے ایک ادارہ قائم کرنے کی سفارش کی۔"
