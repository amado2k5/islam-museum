id: work/fatwa-amja-darura-versus-mashaqqa
class: work
kind: fatwa
label: { ar: "الضرورة والمشقة", en: "Necessity and hardship — al-Suyuti's two kinds of mashaqqa", ur: "ضرورت اور مشقت — سیوطی کی تقسیم", es: "Necesidad y adversidad: los dos tipos de mashaqqa de al-Suyuti", fr: "Nécessité et épreuve — les deux types de mashaqqa d'al-Suyuti", tr: "Zorunluluk ve zorluklar", id: "Kebutuhan dan kesulitan" }
summary:
  ar: "سأل سائل هل مسمى الضرورة بمعنى المشقة وما ضوابط المشقة تقريبًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 619 بتاريخ 23 مايو 2005)⁩ أن من القواعد الفقهية أن المشقة تجلب التيسير وأن الأمر إذا ضاق اتسع، وقد ضبط السيوطي المشقة التي تجلب التيسير فقال المشاق على قسمين: مشقة لا تنفك عنها العبادة غالبًا كمشقة البرد في الوضوء والغسل ومشقة الصوم في شدة الحر وطول النهار ومشقة السفر التي لا انفكاك للحج والجهاد عنها ومشقة ألم الحدود فلا أثر لهذه في إسقاط العبادات في كل الأوقات، وأما المشقة التي تعرض في بعض الأوقات فهي محل نظر لأن الشرع راعى فيها أحوال المكلفين على ما فصّل."
  en: "A questioner asked whether 'necessity' means hardship, and what roughly delimits hardship since it cannot be pinned except approximately by the sharia's rules. Dr. Salah al-Sawi (fatwa no. 619, 23 May 2005) answered that among the fiqh maxims are 'hardship brings ease' and 'when a matter narrows it widens'; al-Suyuti delimited the hardship that brings ease into two kinds: a hardship worship is rarely free of — cold in wudu and washing, fasting in fierce heat and long days, travel inseparable from hajj and jihad, the pain of penalties — which never drops the duties at any time; and a hardship occurring only sometimes, which is subject to consideration since the law regards people's states — as the answer details."
  ur: "ایک سائل نے ضرورت اور مشقت کے ضوابط پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 619، 23 مئی 2005)⁩ کے مطابق سیوطی کی تقسیم — لازم مشقت عبادت نہیں گیراتی؛ عارضی مشقت رعایت کا محل ہے۔"
  es: "Un interlocutor preguntó si \"necesidad\" significa dificultad, y qué delimita aproximadamente la dificultad, ya que no puede definirse con precisión salvo de forma aproximada mediante las normas de la sharia. El Dr. Salah al-Sawi (fatwa n.º 619, 23 de mayo de 2005) respondió que entre las máximas del fiqh se encuentran \"la dificultad trae facilidad\" y \"cuando un asunto se estrecha, se amplía\"; al-Suyuti dividió la dificultad que trae facilidad en dos tipos: una dificultad de la que rara vez se libra el culto —el frío en el wudu y el lavado, el ayuno en un calor intenso y días largos, los viajes inseparables del hajj y la yihad, el dolor de las penas— que nunca exime de los deberes en ningún momento; y una dificultad que ocurre solo a veces, que está sujeta a consideración ya que la ley tiene en cuenta los estados de las personas, como se detalla en la respuesta."
  fr: "Un internaute a demandé si la « nécessité » impliquait une épreuve, et comment la définir approximativement, puisqu'elle ne peut être déterminée qu'approximativement par les règles de la charia. Le Dr Salah al-Sawi (fatwa n° 619, 23 mai 2005) a répondu que parmi les maximes de fiqh figurent « l'épreuve apporte la facilité » et « ce qui rétrécit s'élargit ». Al-Suyuti a distingué deux types d'épreuves qui apportent la facilité: les épreuves inhérentes au culte – le froid lors des ablutions, le jeûne sous une chaleur intense et pendant de longues journées, les voyages indissociables du hajj et du jihad, la souffrance des sanctions – qui n'exemptent jamais des obligations; et les épreuves ponctuelles, qui doivent être prises en compte car la loi tient compte de la situation de chacun, comme le précise la réponse."
  tr: "Bir soruya kavuşan kişiye şöyle soruldu: 'Zorunluluk' terimi zorluk mu anlamına geliyor ve zorluk için yaklaşık kurallar nelerdir? Dr. Salah Al-Sawi (23 Mayıs 2005 tarihli Fetva No. 619) fıkıh ilkelerinden birinin zorlukların kolaylık getirdiğini, konu daraldığında genişlediğini yanıtladı. Al-Suyuti, kolaylık getiren zorlukları iki türe ayırarak tanımladı: ibadet ayırmayan zorluk, örneğin soğukta yıkanma ve banyo sırasında yaşanan zorluk, yoğun sıcakta oruç ve uzun günlerde zorluk, Hac ve cihadın asla ayrılmadığı seyahat zorlukları ve her zaman ibadet işlemlerinden vazgeçmeyi etkilemeyen hudud acısının sıkıntısı. Belirli zamanlarda yaşanan zorluklar ise dikkate alınması gereken bir konudur çünkü Şeriat, hesap verebilir kişilerin koşullarını ayrıntılı olarak dikkate alır."
  id: "Seorang penanya ditanya: Apakah istilah 'kebutuhan' berarti kesulitan, dan apa saja aturan kasar untuk kesulitan? Dr. Salah Al-Sawi menjawab (Fatwa No. 619 tanggal 23 Mei 2005) bahwa salah satu prinsip yurisprudensi adalah bahwa kesulitan membawa kemudahan, dan jika masalah menjadi sempit, maka akan meluas. Al-Suyuti mendefinisikan kesulitan yang membawa ketenangan, menyatakan bahwa kesulitan dibagi menjadi dua jenis: kesulitan yang tidak memisahkan ibadah, seperti kesulitan karena kedinginan saat wudhu dan mandi, kesulitan berpuasa di panas yang sangat tinggi dan hari-hari panjang, kesulitan perjalanan yang tidak pernah memisahkan Haji dan jihad, serta kesulitan akibat penderitaan hudud, yang tidak berpengaruh dalam mengorbankan ibadah setiap saat. Adapun kesulitan yang terjadi pada waktu-waktu tertentu, ini menjadi pertimbangan karena Syariah mempertimbangkan kondisi orang yang bertanggung jawab, sebagaimana dijelaskan."
