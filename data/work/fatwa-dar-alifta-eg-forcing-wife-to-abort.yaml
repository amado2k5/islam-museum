label: { ar: "حكم إجبار الزوجة على الإجهاض", en: "Forcing a wife to abort", ur: "بیوی پر اسقاطِ حمل کی جبر" }
summary:
  ar: "سائل سأل عن إجبار الزوجة على إسقاط الجنين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21864)⁩ أنه لا يجوز إجبارها على إسقاطه ولو لم تنفخ فيه الروح ما دام ليس هناك عذر يقتضي إنزاله على ما فصّل الجواب."
  en: "A questioner asked about forcing a wife to abort the foetus. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21864) answered that she may not be forced into aborting it — even before ensoulment — so long as no excuse requires its termination, as the answer details."
  ur: "ایک سائل نے بیوی پر اسقاطِ حمل کی جبر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21864)⁩ نے جواب دیا کہ اسے اسقاط پر مجبور نہیں کیا جا سکتا — خواہ روح پھونکی گئی ہو یا نہ ہو — جب تک کوئی ایسا عذر نہ ہو جو اس کے گرانے کا تقاضا کرے، جیسا کہ جواب میں تفصیل ہے۔"
