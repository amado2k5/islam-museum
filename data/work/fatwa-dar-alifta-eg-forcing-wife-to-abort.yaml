id: work/fatwa-dar-alifta-eg-forcing-wife-to-abort
class: work
kind: fatwa
label: { ar: "حكم إجبار الزوجة على الإجهاض", en: "Forcing a wife to abort", ur: "بیوی پر اسقاطِ حمل کی جبر", es: "Obligar a una esposa a abortar", fr: "Forcer une femme à avorter" }
summary:
  ar: "سائل سأل عن إجبار الزوجة على إسقاط الجنين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21864)⁩ أنه لا يجوز إجبارها على إسقاطه ولو لم تنفخ فيه الروح ما دام ليس هناك عذر يقتضي إنزاله على ما فصّل الجواب."
  en: "A questioner asked about forcing a wife to abort the foetus. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21864) answered that she may not be forced into aborting it — even before ensoulment — so long as no excuse requires its termination, as the answer details."
  ur: "ایک سائل نے بیوی پر اسقاطِ حمل کی جبر کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21864)⁩ نے جواب دیا کہ اسے اسقاط پر مجبور نہیں کیا جا سکتا — خواہ روح پھونکی گئی ہو یا نہ ہو — جب تک کوئی ایسا عذر نہ ہو جو اس کے گرانے کا تقاضا کرے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de obligar a una esposa a abortar. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21864) respondió que no se la puede obligar a abortar, ni siquiera antes de que el feto reciba el alma, siempre y cuando no exista una razón justificada para su interrupción, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le droit de contraindre une femme à avorter. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21864) a répondu qu'elle ne peut être contrainte à un avortement, même avant l'animation du fœtus, tant qu'aucun motif ne justifie son interruption, comme le précise la réponse."
