label: { ar: "التفسير الميسر", en: "al-Tafsir al-Muyassar", ur: "التفسیر المیسر", es: "al-Tafsir al-Muyassar", fr: "al-Tafsir al-Muyassar", tr: "Basitleştirilmiş Yorumlama", id: "Interpretasi yang Disederhanakan" }
summary:
  ar: "تفسير مختصر للقرآن كله بالعربية، أعدته نخبة من أساتذة التفسير لمجمع الملك فهد لطباعة المصحف الشريف بالمدينة المنورة ليكون أساسًا لترجمات معاني القرآن التي يصدرها المجمع، على مذهب السلف في الاعتقاد، مع تقديم ما صح من التفسير بالمأثور، وبعبارة سهلة تتسع لها حاشية مصحف المدينة النبوية؛ وروجعت طبعته الثانية ⁦(1430هـ)⁩ بعد ملحوظات وردت على الأولى."
  en: "A concise Arabic commentary on the whole Qur'an, prepared by a group of tafsir professors for the King Fahd Complex for the Printing of the Holy Qur'an in Medina as the basis for the Complex's translations of the meanings of the Qur'an; it follows the creed of the early generations, puts sound transmitted exegesis first, and uses plain wording sized to fit the margin of the Medina Mushaf. Its second edition (1430 AH) was revised in light of comments on the first."
  ur: "پورے قرآن کی عربی میں ایک مختصر تفسیر، جسے مجمع الملک فہد لطباعۃ المصحف الشریف مدینہ منورہ کے لیے تفسیر کے اساتذہ کی ایک جماعت نے تیار کیا تاکہ یہ مجمع کے قرآنی معانی کے تراجم کی بنیاد ہو؛ یہ اعتقاد میں سلف کے مسلک پر ہے، صحیح تفسیر بالماثور کو مقدم رکھتی ہے، اور آسان عبارت میں ہے جو مصحفِ مدینہ کے حاشیے میں سما سکے۔ اس کا دوسرا ایڈیشن ⁦(1430ھ)⁩ پہلے ایڈیشن پر آنے والی آرا کی روشنی میں نظرثانی شدہ ہے۔"
  es: "Un conciso comentario en árabe sobre todo el Corán, preparado por un grupo de profesores de tafsir para el Complejo Rey Fahd para la Impresión del Sagrado Corán en Medina, como base para las traducciones del Complejo sobre los significados del Corán. Sigue la doctrina de las primeras generaciones, prioriza la exégesis transmitida de forma fiable y utiliza un lenguaje sencillo adaptado al margen del Mushaf de Medina. Su segunda edición (1430 AH) fue revisada a la luz de los comentarios sobre la primera."
  fr: "Ce commentaire arabe concis de l'intégralité du Coran, préparé par un groupe de professeurs d'exégèse coranique (tafsir) pour le Complexe du roi Fahd chargé de l'impression du Saint Coran à Médine, sert de base aux traductions coraniques réalisées par le Complexe. Fidèle à la doctrine des premières générations, il privilégie l'exégèse transmise de génération en génération et emploie un langage simple, adapté à la marge du Mushaf de Médine. Sa seconde édition (1430 AH) a été révisée à la lumière des commentaires reçus sur la première."
  tr: "Kur'an'ın tamamının Arapça özlü bir yorumu, Medine'de Kur'an'ın Basımı için Kral Fahd Kompleksi için seçkin bir grup tefsir profesörü tarafından hazırlanmış, Akademi tarafından yayımlanan Kur'an anlamlarının çevirilerinin temelini oluşturacak ve Selef inanç doktrinini takip eden, aktarılan tercümede özgün olanı sunan ve Medine Muşaf'ın kenarında kullanılabilecek basit bir dilde sunulmuştur; ikinci baskısı (1430 H) ilk baskı üzerine bazı notlar alındıktan sonra gözden geçirilmiştir."
  id: "Interpretasi ringkas seluruh Al-Qur'an dalam bahasa Arab, disiapkan oleh sekelompok profesor eksposisi terpilih untuk Kompleks King Fahd untuk Pencetakan Al-Qur'an di Madinah, sebagai dasar terjemahan makna Al-Qur'an yang dikeluarkan oleh Akademi, mengikuti doktrin kredo Salaf, menyajikan apa yang otentik dalam interpretasi transmisi, dan dalam bahasa sederhana yang dapat digunakan di pinggiran Madinah Mushaf; edisi keduanya (1430 H) ditinjau setelah beberapa catatan pada edisi pertama."
