label: { ar: "التفسير الميسر", en: "al-Tafsir al-Muyassar", ur: "التفسیر المیسر" }
summary:
  ar: "تفسير مختصر للقرآن كله بالعربية، أعدته نخبة من أساتذة التفسير لمجمع الملك فهد لطباعة المصحف الشريف بالمدينة المنورة ليكون أساسًا لترجمات معاني القرآن التي يصدرها المجمع، على مذهب السلف في الاعتقاد، مع تقديم ما صح من التفسير بالمأثور، وبعبارة سهلة تتسع لها حاشية مصحف المدينة النبوية؛ وروجعت طبعته الثانية (1430هـ) بعد ملحوظات وردت على الأولى."
  en: "A concise Arabic commentary on the whole Qur'an, prepared by a group of tafsir professors for the King Fahd Complex for the Printing of the Holy Qur'an in Medina as the basis for the Complex's translations of the meanings of the Qur'an; it follows the creed of the early generations, puts sound transmitted exegesis first, and uses plain wording sized to fit the margin of the Medina Mushaf. Its second edition (1430 AH) was revised in light of comments on the first."
  ur: "پورے قرآن کی عربی میں ایک مختصر تفسیر، جسے مجمع الملک فہد لطباعۃ المصحف الشریف مدینہ منورہ کے لیے تفسیر کے اساتذہ کی ایک جماعت نے تیار کیا تاکہ یہ مجمع کے قرآنی معانی کے تراجم کی بنیاد ہو؛ یہ اعتقاد میں سلف کے مسلک پر ہے، صحیح تفسیر بالماثور کو مقدم رکھتی ہے، اور آسان عبارت میں ہے جو مصحفِ مدینہ کے حاشیے میں سما سکے۔ اس کا دوسرا ایڈیشن (1430ھ) پہلے ایڈیشن پر آنے والی آرا کی روشنی میں نظرثانی شدہ ہے۔"
