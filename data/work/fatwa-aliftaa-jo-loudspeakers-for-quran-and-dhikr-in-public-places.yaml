id: work/fatwa-aliftaa-jo-loudspeakers-for-quran-and-dhikr-in-public-places
class: work
kind: fatwa
label: { ar: "مكبرات الصوت لقراءة القرآن والذكر في الأماكن العامة", en: "Loudspeakers for Qur'an and dhikr in public places", ur: "عوامی مقامات پر قرآن اور ذکر کے لیے لاؤڈ اسپیکر" }
summary:
  ar: "سؤال عن مكبرات الصوت لقراءة القرآن والذكر في الأماكن العامة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجهر بالذكر عبر مكبرات الصوت جائز في الأماكن الصاخبة بطبيعتها كالأسواق بصوت يناسب المكان ولا يؤذي، وأنه لا يجوز في الأماكن السكنية المزدحمة كل صوت جهوري ينافي سكينتها، لأن الإزعاج والأذى منهي عنهما. أجابت الدائرة بأن الإسلام حث على ذكر الله ورتب عليه أجرًا عظيمًا، واستشهدت بـ[[passage/quran-33-35|سورة الأحزاب 33:35]] وبحديث رواه الترمذي معناه أن ذكر الله خير الأعمال وأزكاها، وبذم الغفلة في [[passage/quran-21-1|سورة الأنبياء 21:1]]، وبالحث على الذكر مطلقًا في [[passage/quran-4-103|سورة النساء 4:103]]. وقالت إن الجهر بالذكر، من الشخص نفسه أو بآلات التسجيل، منهي عنه إن سبب إزعاجًا أو أذى صوتيًا للناس، واستدلت بحديث في موطأ الإمام مالك معناه أن المصلي يناجي ربه فلا يجهر بعضكم على بعض بالقرآن، ونقلت عن مرعاة المفاتيح (3/167) أن النهي يشمل من في الصلاة وخارجها من مصل أو نائم أو قارئ لأن ذلك يؤذي. وقالت إن الأماكن التي من طبيعتها الضجيج كالأسواق وبعض المتنزهات الأصل فيها جواز الجهر بالذكر ولا ينبغي منعه، واستشهدت بأثر رواه البخاري أن ابن عمر وأبا هريرة كانا يخرجان إلى السوق في أيام العشر يكبران فيكبر الناس بتكبيرهما، وبقول ابن عباس في حديث متفق عليه إن رفع الصوت بالذكر عند الانصراف من المكتوبة كان في عهد النبي، واشترطت أن يكون الصوت مناسبًا للمكان لا يمنع الناس من التواصل، ولا عبرة بادعاء الإزعاج ممن لا يرغب في سماع الذكر. وأما الأماكن السكنية المزدحمة التي فيها معاش الناس ونومهم وسكينتهم، فالأصل عند الدائرة عدم جواز كل صوت جهوري ينافي الهدوء فيها، ذكرًا كان أو قراءة أو غيرهما، لأن فيها النائم والمريض والمصلي، والشرع أمر بالرأفة بالناس."
  en: "A question about loudspeakers for Qur'an and dhikr in public places, in which Jordan's General Iftaa Department answered that broadcasting dhikr over loudspeakers is permitted in places that are noisy by nature, such as markets, at a volume suited to the place that harms no one, while in crowded residential areas any loud sound that disrupts their calm is not permitted, since disturbance and harm are prohibited. The Department answered that Islam encourages remembrance of God and attaches great reward to it, citing [[passage/quran-33-35|Surat al-Ahzab 33:35]], a hadith narrated by al-Tirmidhi whose meaning is that remembrance of God is the best and purest of deeds, the censure of heedlessness in [[passage/quran-21-1|Surat al-Anbiya' 21:1]], and the unrestricted encouragement of dhikr in [[passage/quran-4-103|Surat al-Nisa' 4:103]]. It said that dhikr aloud, whether by the person himself or through recording devices, is prohibited if it causes disturbance or noise harm to people, citing a hadith in the Muwatta of Malik whose meaning is that one who prays is in private converse with his Lord, so none should recite the Qur'an aloud over another, and quoting Mir'at al-Mafatih (3/167) that the prohibition covers those inside and outside prayer, whether praying, sleeping or reciting, because it causes harm. It said that in places noisy by nature, such as markets and some parks, dhikr aloud is permitted in principle and should not be prevented, citing a report narrated by al-Bukhari that Ibn Umar and Abu Hurayra went out to the market in the first ten days of Dhu al-Hijja saying takbir and the people said it with them, and Ibn Abbas's statement, in a hadith agreed upon by al-Bukhari and Muslim, that raising the voice in dhikr after the obligatory prayer was practised in the Prophet's time. The condition is that the volume suits the place and does not stop people communicating; a claim of disturbance from someone who simply does not wish to hear dhikr is not taken into account. As for crowded residential areas where people live, sleep and rest, the Department held that in principle any loud sound that disrupts their calm is not permitted, whether dhikr, recitation or anything else, since they contain the sleeping, the sick and those praying, and the Shari'a commands kindness to people."
  ur: "عوامی مقامات پر قرآن اور ذکر کے لیے لاؤڈ اسپیکر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ لاؤڈ اسپیکر پر بلند آواز سے ذکر ان جگہوں میں جائز ہے جو فطرتاً شور والی ہوں، جیسے بازار، ایسی آواز میں جو جگہ کے مناسب ہو اور کسی کو تکلیف نہ دے، جبکہ گنجان رہائشی علاقوں میں ہر وہ بلند آواز جائز نہیں جو ان کے سکون کو خراب کرے، کیونکہ پریشان کرنا اور تکلیف دینا ممنوع ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے اللہ کے ذکر پر ابھارا اور اس پر بڑا اجر رکھا، اور [[passage/quran-33-35|سورۃ الاحزاب 33:35]]، ترمذی کی روایت کردہ حدیث جس کا مفہوم ہے کہ اللہ کا ذکر بہترین اور پاکیزہ ترین عمل ہے، [[passage/quran-21-1|سورۃ الانبیاء 21:1]] میں غفلت کی مذمت، اور [[passage/quran-4-103|سورۃ النساء 4:103]] میں ذکر کی مطلق ترغیب کا حوالہ دیا۔ اس نے کہا کہ بلند آواز سے ذکر، خود یا ریکارڈنگ کے آلات سے، اگر لوگوں کو پریشانی یا صوتی تکلیف دے تو ممنوع ہے، اور مؤطا امام مالک کی حدیث سے استدلال کیا جس کا مفہوم ہے کہ نمازی اپنے رب سے سرگوشی کرتا ہے، اس لیے کوئی دوسرے پر بلند آواز سے قرآن نہ پڑھے، اور مرعاۃ المفاتیح (3/167) سے نقل کیا کہ یہ ممانعت نماز کے اندر اور باہر، نمازی، سونے والے یا تلاوت کرنے والے سب کو شامل ہے، کیونکہ اس سے تکلیف ہوتی ہے۔ اس نے کہا کہ جو جگہیں فطرتاً شور والی ہیں، جیسے بازار اور بعض پارک، ان میں بلند آواز سے ذکر اصلاً جائز ہے اور اسے روکنا نہیں چاہیے، اور بخاری کی روایت کردہ اثر کا حوالہ دیا کہ ابن عمر اور ابو ہریرہ ذوالحجہ کے پہلے دس دنوں میں بازار جا کر تکبیر کہتے اور لوگ ان کے ساتھ تکبیر کہتے، اور متفق علیہ حدیث میں ابن عباس کا قول کہ فرض نماز کے بعد بلند آواز سے ذکر نبی کے زمانے میں ہوتا تھا۔ شرط یہ ہے کہ آواز جگہ کے مناسب ہو اور لوگوں کی باہمی گفتگو میں رکاوٹ نہ بنے؛ اور جو محض ذکر سننا نہ چاہے اس کے پریشانی کے دعوے کا اعتبار نہیں۔ رہے گنجان رہائشی علاقے جہاں لوگ رہتے، سوتے اور آرام کرتے ہیں، تو ڈیپارٹمنٹ کے نزدیک اصلاً ہر وہ بلند آواز جائز نہیں جو ان کے سکون کے منافی ہو، چاہے ذکر ہو، تلاوت ہو یا کچھ اور، کیونکہ ان میں سونے والے، بیمار اور نمازی ہوتے ہیں، اور شریعت نے لوگوں پر نرمی کا حکم دیا ہے۔"
