id: work/fatwa-aliftaa-jo-loudspeakers-for-quran-and-dhikr-in-public-places
class: work
kind: fatwa
label: { ar: "مكبرات الصوت لقراءة القرآن والذكر في الأماكن العامة", en: "Loudspeakers for Qur'an and dhikr in public places", ur: "عوامی مقامات پر قرآن اور ذکر کے لیے لاؤڈ اسپیکر", es: "Altavoces para el Corán y el dhikr en lugares públicos", fr: "Haut-parleurs pour la récitation du Coran et le dhikr dans les lieux publics", tr: "Kamusal Alanlarda Kur'an ve Anma Okumaları İçin Hoparlörler", id: "Pengeras suara untuk Al-Qur'an dan Pembacaan Peringatan di Tempat Umum" }
summary:
  ar: "سؤال عن مكبرات الصوت لقراءة القرآن والذكر في الأماكن العامة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجهر بالذكر عبر مكبرات الصوت جائز في الأماكن الصاخبة بطبيعتها كالأسواق بصوت يناسب المكان ولا يؤذي، وأنه لا يجوز في الأماكن السكنية المزدحمة كل صوت جهوري ينافي سكينتها، لأن الإزعاج والأذى منهي عنهما. أجابت الدائرة بأن الإسلام حث على ذكر الله ورتب عليه أجرًا عظيمًا، واستشهدت بـ[[passage/quran-33-35|سورة الأحزاب 33:35]] وبحديث رواه الترمذي معناه أن ذكر الله خير الأعمال وأزكاها، وبذم الغفلة في [[passage/quran-21-1|سورة الأنبياء 21:1]]، وبالحث على الذكر مطلقًا في [[passage/quran-4-103|سورة النساء 4:103]]. وقالت إن الجهر بالذكر، من الشخص نفسه أو بآلات التسجيل، منهي عنه إن سبب إزعاجًا أو أذى صوتيًا للناس، واستدلت بحديث في موطأ الإمام مالك معناه أن المصلي يناجي ربه فلا يجهر بعضكم على بعض بالقرآن، ونقلت عن مرعاة المفاتيح (3/167) أن النهي يشمل من في الصلاة وخارجها من مصل أو نائم أو قارئ لأن ذلك يؤذي. وقالت إن الأماكن التي من طبيعتها الضجيج كالأسواق وبعض المتنزهات الأصل فيها جواز الجهر بالذكر ولا ينبغي منعه، واستشهدت بأثر رواه البخاري أن ابن عمر وأبا هريرة كانا يخرجان إلى السوق في أيام العشر يكبران فيكبر الناس بتكبيرهما، وبقول ابن عباس في حديث متفق عليه إن رفع الصوت بالذكر عند الانصراف من المكتوبة كان في عهد النبي، واشترطت أن يكون الصوت مناسبًا للمكان لا يمنع الناس من التواصل، ولا عبرة بادعاء الإزعاج ممن لا يرغب في سماع الذكر. وأما الأماكن السكنية المزدحمة التي فيها معاش الناس ونومهم وسكينتهم، فالأصل عند الدائرة عدم جواز كل صوت جهوري ينافي الهدوء فيها، ذكرًا كان أو قراءة أو غيرهما، لأن فيها النائم والمريض والمصلي، والشرع أمر بالرأفة بالناس."
  en: "A question about loudspeakers for Qur'an and dhikr in public places, in which Jordan's General Iftaa Department answered that broadcasting dhikr over loudspeakers is permitted in places that are noisy by nature, such as markets, at a volume suited to the place that harms no one, while in crowded residential areas any loud sound that disrupts their calm is not permitted, since disturbance and harm are prohibited. The Department answered that Islam encourages remembrance of God and attaches great reward to it, citing [[passage/quran-33-35|Surat al-Ahzab 33:35]], a hadith narrated by al-Tirmidhi whose meaning is that remembrance of God is the best and purest of deeds, the censure of heedlessness in [[passage/quran-21-1|Surat al-Anbiya' 21:1]], and the unrestricted encouragement of dhikr in [[passage/quran-4-103|Surat al-Nisa' 4:103]]. It said that dhikr aloud, whether by the person himself or through recording devices, is prohibited if it causes disturbance or noise harm to people, citing a hadith in the Muwatta of Malik whose meaning is that one who prays is in private converse with his Lord, so none should recite the Qur'an aloud over another, and quoting Mir'at al-Mafatih (3/167) that the prohibition covers those inside and outside prayer, whether praying, sleeping or reciting, because it causes harm. It said that in places noisy by nature, such as markets and some parks, dhikr aloud is permitted in principle and should not be prevented, citing a report narrated by al-Bukhari that Ibn Umar and Abu Hurayra went out to the market in the first ten days of Dhu al-Hijja saying takbir and the people said it with them, and Ibn Abbas's statement, in a hadith agreed upon by al-Bukhari and Muslim, that raising the voice in dhikr after the obligatory prayer was practised in the Prophet's time. The condition is that the volume suits the place and does not stop people communicating; a claim of disturbance from someone who simply does not wish to hear dhikr is not taken into account. As for crowded residential areas where people live, sleep and rest, the Department held that in principle any loud sound that disrupts their calm is not permitted, whether dhikr, recitation or anything else, since they contain the sleeping, the sick and those praying, and the Shari'a commands kindness to people."
  ur: "عوامی مقامات پر قرآن اور ذکر کے لیے لاؤڈ اسپیکر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ لاؤڈ اسپیکر پر بلند آواز سے ذکر ان جگہوں میں جائز ہے جو فطرتاً شور والی ہوں، جیسے بازار، ایسی آواز میں جو جگہ کے مناسب ہو اور کسی کو تکلیف نہ دے، جبکہ گنجان رہائشی علاقوں میں ہر وہ بلند آواز جائز نہیں جو ان کے سکون کو خراب کرے، کیونکہ پریشان کرنا اور تکلیف دینا ممنوع ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے اللہ کے ذکر پر ابھارا اور اس پر بڑا اجر رکھا، اور [[passage/quran-33-35|سورۃ الاحزاب 33:35]]، ترمذی کی روایت کردہ حدیث جس کا مفہوم ہے کہ اللہ کا ذکر بہترین اور پاکیزہ ترین عمل ہے، [[passage/quran-21-1|سورۃ الانبیاء 21:1]] میں غفلت کی مذمت، اور [[passage/quran-4-103|سورۃ النساء 4:103]] میں ذکر کی مطلق ترغیب کا حوالہ دیا۔ اس نے کہا کہ بلند آواز سے ذکر، خود یا ریکارڈنگ کے آلات سے، اگر لوگوں کو پریشانی یا صوتی تکلیف دے تو ممنوع ہے، اور مؤطا امام مالک کی حدیث سے استدلال کیا جس کا مفہوم ہے کہ نمازی اپنے رب سے سرگوشی کرتا ہے، اس لیے کوئی دوسرے پر بلند آواز سے قرآن نہ پڑھے، اور مرعاۃ المفاتیح (3/167) سے نقل کیا کہ یہ ممانعت نماز کے اندر اور باہر، نمازی، سونے والے یا تلاوت کرنے والے سب کو شامل ہے، کیونکہ اس سے تکلیف ہوتی ہے۔ اس نے کہا کہ جو جگہیں فطرتاً شور والی ہیں، جیسے بازار اور بعض پارک، ان میں بلند آواز سے ذکر اصلاً جائز ہے اور اسے روکنا نہیں چاہیے، اور بخاری کی روایت کردہ اثر کا حوالہ دیا کہ ابن عمر اور ابو ہریرہ ذوالحجہ کے پہلے دس دنوں میں بازار جا کر تکبیر کہتے اور لوگ ان کے ساتھ تکبیر کہتے، اور متفق علیہ حدیث میں ابن عباس کا قول کہ فرض نماز کے بعد بلند آواز سے ذکر نبی کے زمانے میں ہوتا تھا۔ شرط یہ ہے کہ آواز جگہ کے مناسب ہو اور لوگوں کی باہمی گفتگو میں رکاوٹ نہ بنے؛ اور جو محض ذکر سننا نہ چاہے اس کے پریشانی کے دعوے کا اعتبار نہیں۔ رہے گنجان رہائشی علاقے جہاں لوگ رہتے، سوتے اور آرام کرتے ہیں، تو ڈیپارٹمنٹ کے نزدیک اصلاً ہر وہ بلند آواز جائز نہیں جو ان کے سکون کے منافی ہو، چاہے ذکر ہو، تلاوت ہو یا کچھ اور، کیونکہ ان میں سونے والے، بیمار اور نمازی ہوتے ہیں، اور شریعت نے لوگوں پر نرمی کا حکم دیا ہے۔"
  es: "Ante una pregunta sobre el uso de altavoces para la recitación del Corán y el dhikr en lugares públicos, el Departamento General de Iftaa de Jordania respondió que la difusión del dhikr a través de altavoces está permitida en lugares ruidosos por naturaleza, como los mercados, a un volumen adecuado para el lugar que no perjudique a nadie, mientras que en zonas residenciales concurridas no está permitido ningún sonido fuerte que perturbe su tranquilidad, ya que las molestias y los daños están prohibidos. El Departamento respondió que el Islam fomenta el recuerdo de Dios y le otorga una gran recompensa, citando [[passage/quran-33-35|Surat al-Ahzab 33:35]], un hadiz narrado por al-Tirmidhi cuyo significado es que el recuerdo de Dios es la mejor y más pura de las obras, la censura de la negligencia en [[passage/quran-21-1|Surat al-Anbiya' 21:1]], y el estímulo sin restricciones del dhikr en [[passage/quran-4-103|Surat al-Nisa' 4:103]]. Dijo que el dhikr en voz alta, ya sea por la persona misma o a través de dispositivos de grabación, está prohibido si causa molestias o daño por ruido a las personas, citando un hadiz en el Muwatta de Malik cuyo significado es que quien reza está en conversación privada con su Señor, por lo que nadie debe recitar el Corán en voz alta sobre otro, y citando Mir'at al-Mafatih (3/167) que la prohibición abarca a quienes están dentro y fuera de la oración, ya sea rezando, durmiendo o recitando, porque causa daño. Se indicó que en lugares ruidosos por naturaleza, como mercados y algunos parques, el dhikr en voz alta está permitido en principio y no debe impedirse, citando un relato narrado por al-Bujari según el cual Ibn Umar y Abu Hurayra salieron al mercado durante los primeros diez días de Dhu al-Hijja diciendo takbir y la gente lo repitió con ellos, y la declaración de Ibn Abbas, en un hadiz consensuado por al-Bujari y Muslim, de que elevar la voz en dhikr después de la oración obligatoria era una práctica común en tiempos del Profeta. La condición es que el volumen sea apropiado para el lugar y no impida la comunicación entre las personas; no se toma en cuenta la alegación de molestia de alguien que simplemente no desea escuchar el dhikr. En cuanto a las zonas residenciales densamente pobladas donde la gente vive, duerme y descansa, el Departamento sostuvo que, en principio, cualquier ruido fuerte que perturbe su tranquilidad no está permitido, ya sea dhikr, recitación o cualquier otra cosa, puesto que en ellas se encuentran personas durmiendo, enfermas y rezando, y la Sharia ordena la bondad hacia las personas."
  fr: "Une question concernant la diffusion du Coran et du dhikr par haut-parleurs dans les lieux publics a été posée au Département général de la Iftaa de Jordanie, qui a répondu que la diffusion du dhikr par haut-parleurs est autorisée dans les lieux naturellement bruyants, tels que les marchés, à un volume adapté au lieu et ne nuisant à personne, tandis que dans les zones résidentielles densément peuplées, tout bruit fort susceptible de perturber leur tranquillité est interdit, car les troubles et les nuisances sont prohibés. Le Département a répondu que l'Islam encourage le souvenir de Dieu et lui attache une grande récompense, citant [[passage/quran-33-35|Sourate al-Ahzab 33:35]], un hadith rapporté par al-Tirmidhi dont le sens est que le souvenir de Dieu est le meilleur et le plus pur des actes, la censure de l'insouciance dans [[passage/quran-21-1|Sourate al-Anbiya' 21:1]], et l'encouragement sans restriction du dhikr dans [[passage/quran-4-103|Sourate al-Nisa' 4:103]]. Il est dit que le dhikr à voix haute, que ce soit par la personne elle-même ou par le biais d'appareils d'enregistrement, est interdit s'il cause des troubles ou du bruit nuisibles aux personnes, citant un hadith dans le Muwatta de Malik dont le sens est que celui qui prie est en conversation privée avec son Seigneur, donc personne ne devrait réciter le Coran à voix haute par-dessus un autre, et citant Mir'at al-Mafatih (3/167) que l'interdiction couvre ceux qui sont à l'intérieur et à l'extérieur de la prière, qu'ils prient, dorment ou récitent, car cela cause du tort. Il a été précisé que dans les lieux naturellement bruyants, tels que les marchés et certains parcs, le dhikr à voix haute est en principe permis et ne doit pas être interdit. Le document cite un hadith rapporté par al-Bukhari selon lequel Ibn Umar et Abu Hurayra se rendirent au marché durant les dix premiers jours de Dhu al-Hijja, prononçant le takbir, et les gens le répétèrent avec eux. Il cite également la déclaration d'Ibn Abbas, rapportée dans un hadith authentifié par al-Bukhari et Muslim, selon laquelle élever la voix pour le dhikr après la prière obligatoire était une pratique courante du temps du Prophète. La condition est que le volume sonore soit adapté au lieu et ne gêne pas la communication; la plainte d'une personne se plaignant d'une nuisance sonore et ne souhaitant simplement pas entendre le dhikr n'est pas prise en compte. Quant aux zones résidentielles densément peuplées où les gens vivent, dorment et se reposent, le Département a statué qu'en principe, tout bruit fort perturbant leur tranquillité est interdit, qu'il s'agisse de dhikr, de récitation ou autre, car ces lieux abritent des personnes dormant, malades et en prière, et la Shari'a prescrit la bienveillance envers autrui."
  tr: "Ürdün Genel Fetva Dairesi'nin cevap verdiği ve halka açık yerlerde Kur'an okunması ve zikr için hoparlörler hakkında bir soru, Ürdün Genel Fetva Dairesi, gürültülü yerlerde, örneğin pazarlarda, mekâna uygun ve zarar vermeyen, gürültülü yerlerde ise huzuruna aykırı herhangi bir yüksek sesin izin verilmediğini, çünkü rahatsızlık ve zararın yasak olduğunu belirtmiştir. Daire, İslam'ın Allah'ın anmasını teşvik ettiğini ve buna büyük bir ödül verdiğini belirterek [[pasaj/kuran-33-35|Ahzab Suresi 33:]:35]] ve el-Tirmizi tarafından rivayet edilen bir hadis, Allah'ı anmanın en iyi ve en saf iş olduğunu ve [[pasaj/kuran-21-1|Enbiya Suresi 21:1]'nde dikkatsizliği kınamak ve [[pasaj/kuran-4-103|An-Nisa Suresi 4:103]'nde genel olarak hatırlatmayı teşvik etmek anlamına gelir. Kişinin kendisi ya da kayıt cihazları tarafından yüksek sesle anmanın insanlara gürültü veya gürültü çıkarıyorsa yasak olduğu belirtilmiştir. İmam Malik'in Muwatta'sındaki bir hadis, ibadet edenin Rab'bini dua ettiğini ifade eder, bu yüzden bazılarınız Kur'an'ı birbirinize yüksek sesle okumamalıdır. Ayrıca Mar'a'at al-Mafatih'ten (3/167) alıntı yaparak, yasak namaz kılanlara ve namaz dışında olanlara, ister namaz kılan, ister uyurken, ister okunurken, zarar verdiği için geçerlidir. Doğası gereği gürültülü yerlerde, örneğin pazarlar ve bazı parklarda, orijinal kuralın yüksek sesle anmanın izin verildiği ve yasaklanmaması gerektiği olduğunu söyledi. El-Buhari'nin anlattığı bir habere atıfta bulundu; İbn Ömer ve Ebu Hureyre'nin on gün boyunca tekibe (tekbir tekbir) çıktıklarını ve insanların tekiri (tekbir tekbir) söyleyerek tekibi söylediklerini söylediler. İbn Abbas'a göre, karşılıklı olarak kabul edilen bir hadiste, çıkarken sesi zikrle yükseltmek yazılı bir metin Peygamber'in zamanında olup, sesin mekâna uygun olması ve insanların iletişimini engellememesi şart koşulmuştur; zikr duymak istemeyenlere rahatsızlık iddiası da geçerli değildir. İnsanların yaşadığı, uyuduğu, uyuduğu ve huzur bulduğu kalabalık yerleşim yerlerinde varsayılan kural, huzura aykırı yüksek sesin izin verilmediğidir; ister zikr olsun, ister zikr olsun, çünkü bu sesler uyuyan, hasta ve namaz kılan kişileri içerir. Şeriat, insanlara merhamet gösterilmesini emreder."
  id: "Pertanyaan tentang pengeras suara untuk pembacaan Al-Qur'an dan dzikir di tempat umum, di mana Departemen Fatwa Umum Yordania menjawab bahwa membaca dziarah dengan lantang melalui pengeras suara diperbolehkan secara alami di tempat bising, seperti pasar, dengan suara yang sesuai dan tidak menimbulkan bahaya, dan di daerah perumahan yang ramai, suara keras yang bertentangan dengan ketenangannya tidak diperbolehkan, karena gangguan dan bahaya dilarang. Departemen menjawab bahwa Islam mendorong peringatan kepada Allah dan memberikan ganjaran besar, mengutip [[ayat/al-quran-33-35|Surah Al-Ahzab 33:35]] dan hadis yang diceritakan oleh al-Tirmidhi yang berarti menyebut Allah adalah perbuatan terbaik dan paling murni, serta mengutuk kelalaian dalam [[ayat/al-quran-21-1|Surah Al-Anbiya 21:1], serta mendorong pengingat secara umum dalam [[ayat/al-quran-4-103|Surah An-Nisa 4:103]]. Dinyatakan bahwa peringatan yang keras, baik oleh orang itu sendiri maupun dengan alat perekam, dilarang jika menyebabkan kebisingan atau kebisingan pada orang. Ia mengutip hadits dalam Muwatta Imam Malik yang berarti bahwa penyembah memohon kepada Tuhannya, jadi beberapa dari kalian tidak boleh mengucapkan Al-Qur'an dengan lantang satu sama lain. Juga dikutip dari Mar'a'at al-Mafatih (3/167) bahwa larangan ini berlaku bagi mereka yang sedang shalat dan di luar shalat, baik yang sedang berdoa, tidur, atau mengucapkan, karena hal itu menimbulkan bahaya. Dia mengatakan bahwa tempat-tempat yang secara inheren bising, seperti pasar dan beberapa taman, aturan awalnya adalah bahwa peringatan yang keras diperbolehkan dan tidak boleh dilarang. Dia mengutip sebuah laporan yang diceritakan oleh al-Bukhari bahwa Ibn Umar dan Abu Huraira biasa pergi ke pasar selama sepuluh hari takbir (takbir takbir), dan orang akan mengucapkan takbir dengan mengucapkan takbir mereka (takbir takbir). Menurut Ibn Abbas dalam hadits yang disepakati bersama, meninggikan suara dengan dziarah saat meninggalkan teks tertulis terjadi pada masa Nabi, dan ditetapkan bahwa suara tersebut sesuai dengan tempat tersebut dan tidak menghalangi orang berkomunikasi, juga tidak sah untuk mengklaim gangguan bagi mereka yang tidak ingin mendengar dhikir. Adapun tempat tinggal yang ramai tempat orang tinggal, tidur, tidur, dan damai, aturan standar adalah bahwa suara keras yang bertentangan dengan ketenangan tidak diperbolehkan, baik dhikr, pembacaan, atau lainnya, karena di dalamnya terdapat orang yang tidur, sakit, dan shalat. Syariah memerintahkan belas kasih kepada orang-orang."
