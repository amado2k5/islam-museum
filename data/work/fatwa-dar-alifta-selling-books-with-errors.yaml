id: work/fatwa-dar-alifta-selling-books-with-errors
class: work
kind: fatwa
label: { ar: "حكم بيع كتب تتضمن أخطاء علمية ومخالفات شرعية", en: "Selling books that contain factual errors and religious violations", ur: "علمی غلطیوں اور شرعی خلاف ورزیوں والی کتابیں بیچنا" }
summary:
  ar: "سؤال عن بيع كتب قيل إن فيها مخالفات شرعية، فصّلت فيه دار الإفتاء المصرية بحسب الغرض من البيع والمشتري. أجابت الدار بأن بيع الكتب العلمية جائز إذا كانت مملوكة لصاحبها واحتوت على ما يُنتفع به. وقالت إن ما قطعت اللجان العلمية المختصة بأن فيه مخالفات ومغالطات ولم تأذن بنشره يجوز بيعه للعلماء والمختصين وطلبة العلم للوقوف عليه والرد عليه، أو بغرض فرمه وإعادة تدويره. وأما بيعه لغيرهم بغرض تداوله والانتفاع بما فيه فرأته حرامًا لما فيه من الإعانة على الباطل، مستندة إلى أن للوسائل أحكام المقاصد."
  en: "A question on selling books said to contain religious violations, which Egypt's Dar al-Ifta answered according to the purpose of the sale and the buyer. Dar al-Ifta answered that selling scholarly books is permitted when the seller owns them and they contain something of benefit. It said books that the competent scholarly committees have found to contain violations and errors, and have not licensed for publication, may be sold to scholars, specialists and students for study and refutation, or for pulping and recycling. Selling them to others for circulation and use of their contents it held to be forbidden, as helping falsehood, on the rule that means take the ruling of their ends."
  ur: "ایسی کتابیں بیچنے کے بارے میں سوال جن میں شرعی خلاف ورزیاں بتائی گئیں، جس کا جواب مصر کے دار الافتاء نے بیع کے مقصد اور خریدار کے لحاظ سے تفصیل سے دیا۔ دار الافتاء نے جواب دیا کہ علمی کتابوں کی بیع جائز ہے جب وہ بیچنے والے کی ملکیت ہوں اور ان میں فائدے کی چیز ہو۔ اس نے کہا کہ جن کتابوں میں متعلقہ علمی کمیٹیوں نے خلاف ورزیاں اور غلطیاں طے کی ہوں اور اشاعت کی اجازت نہ دی ہو، انہیں علما، ماہرین اور طلبہ کو مطالعے اور رد کے لیے، یا ری سائیکلنگ کے لیے بیچنا جائز ہے۔ اور دوسروں کو ان کے مواد کے پھیلاؤ اور استعمال کے لیے بیچنا اس کے نزدیک حرام ہے کیونکہ یہ باطل میں مدد ہے، اس اصول پر کہ وسائل کا حکم مقاصد والا ہے۔"
