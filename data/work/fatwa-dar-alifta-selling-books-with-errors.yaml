id: work/fatwa-dar-alifta-selling-books-with-errors
class: work
kind: fatwa
label: { ar: "حكم بيع كتب تتضمن أخطاء علمية ومخالفات شرعية", en: "Selling books that contain factual errors and religious violations", ur: "علمی غلطیوں اور شرعی خلاف ورزیوں والی کتابیں بیچنا", es: "Vender libros que contienen errores de hecho y violaciones religiosas.", fr: "Vendre des livres contenant des erreurs factuelles et des violations religieuses", tr: "Bilimsel hatalar ve dini ihlaller içeren kitapların satışına ilişkin karar", id: "Putusan tentang penjualan buku yang mengandung kesalahan ilmiah dan pelanggaran agama" }
summary:
  ar: "سؤال عن بيع كتب قيل إن فيها مخالفات شرعية، فصّلت فيه دار الإفتاء المصرية بحسب الغرض من البيع والمشتري. أجابت الدار بأن بيع الكتب العلمية جائز إذا كانت مملوكة لصاحبها واحتوت على ما يُنتفع به. وقالت إن ما قطعت اللجان العلمية المختصة بأن فيه مخالفات ومغالطات ولم تأذن بنشره يجوز بيعه للعلماء والمختصين وطلبة العلم للوقوف عليه والرد عليه، أو بغرض فرمه وإعادة تدويره. وأما بيعه لغيرهم بغرض تداوله والانتفاع بما فيه فرأته حرامًا لما فيه من الإعانة على الباطل، مستندة إلى أن للوسائل أحكام المقاصد."
  en: "A question on selling books said to contain religious violations, which Egypt's Dar al-Ifta answered according to the purpose of the sale and the buyer. Dar al-Ifta answered that selling scholarly books is permitted when the seller owns them and they contain something of benefit. It said books that the competent scholarly committees have found to contain violations and errors, and have not licensed for publication, may be sold to scholars, specialists and students for study and refutation, or for pulping and recycling. Selling them to others for circulation and use of their contents it held to be forbidden, as helping falsehood, on the rule that means take the ruling of their ends."
  ur: "ایسی کتابیں بیچنے کے بارے میں سوال جن میں شرعی خلاف ورزیاں بتائی گئیں، جس کا جواب مصر کے دار الافتاء نے بیع کے مقصد اور خریدار کے لحاظ سے تفصیل سے دیا۔ دار الافتاء نے جواب دیا کہ علمی کتابوں کی بیع جائز ہے جب وہ بیچنے والے کی ملکیت ہوں اور ان میں فائدے کی چیز ہو۔ اس نے کہا کہ جن کتابوں میں متعلقہ علمی کمیٹیوں نے خلاف ورزیاں اور غلطیاں طے کی ہوں اور اشاعت کی اجازت نہ دی ہو، انہیں علما، ماہرین اور طلبہ کو مطالعے اور رد کے لیے، یا ری سائیکلنگ کے لیے بیچنا جائز ہے۔ اور دوسروں کو ان کے مواد کے پھیلاؤ اور استعمال کے لیے بیچنا اس کے نزدیک حرام ہے کیونکہ یہ باطل میں مدد ہے، اس اصول پر کہ وسائل کا حکم مقاصد والا ہے۔"
  es: "Ante una pregunta sobre la venta de libros que supuestamente contienen violaciones religiosas, el Dar al-Ifta de Egipto respondió según el propósito de la venta y el comprador. El Dar al-Ifta indicó que la venta de libros académicos está permitida cuando el vendedor es el propietario y estos contienen algo beneficioso. Asimismo, señaló que los libros que los comités académicos competentes han considerado que contienen violaciones y errores, y que no han sido autorizados para su publicación, pueden venderse a académicos, especialistas y estudiantes para su estudio y refutación, o para su reciclaje. Sin embargo, consideró prohibida su venta a terceros para su circulación y el uso de su contenido, por considerarla una forma de fomentar la falsedad, según el principio de que los fines determinan los medios."
  fr: "La Cour suprême égyptienne Dar al-Ifta a répondu à une question concernant la vente d'ouvrages prétendument contraires aux préceptes religieux, en fonction de la finalité de la vente et de l'acheteur. Dar al-Ifta a statué que la vente de livres savants est autorisée lorsque le vendeur en est propriétaire et qu'ils présentent un intérêt. Elle a précisé que les livres jugés contraires et erronés par les comités savants compétents, et dont la publication a été refusée, peuvent être vendus aux érudits, spécialistes et étudiants à des fins d'étude et de réfutation, ou pour être détruits et recyclés. La vente de ces livres à des tiers pour diffusion et utilisation de leur contenu est interdite, car elle cautionne la propagation du mensonge, selon le principe que les personnes concernées doivent respecter leurs propres objectifs."
  tr: "Kitap satışıyla ilgili bir soru Dini ihlaller olduğu söylendi ve Mısır Dar al-Ifta, satış amacına ve alıcıya göre bunu ayrıntılı olarak açıkladı. Ev, bilimsel kitapların sahibi tarafından sahiplenildiği ve faydalı materyaller içerdiği durumlarda satılmasının izin verildiğini belirtti. Uzman bilimsel komitelerin tespit ettiği ihlal ve safsata bulunanların yayımlanmasına izin vermediği ve inceleme ve yanıt verme amacıyla alimlere, uzmanlara ve bilgi öğrencilerine satılabileceğini belirtti. İçindekilerden faydalanmak ve dolaştırmak amacıyla başkalarına satılması konusunda, araçların amaçları olduğu gerçeği nedeniyle yalan söylemeye yardımcı olduğu için yasak olduğunu belirtti."
  id: "Pertanyaan tentang penjualan buku Dikatakan bahwa ada pelanggaran agama, dan Dar al-Ifta Mesir merincinya sesuai dengan tujuan penjualan dan pembeli. Rumah menjawab bahwa menjual buku ilmiah diperbolehkan jika dimiliki oleh pemiliknya dan mengandung bahan yang bermanfaat. Dinyatakan bahwa apa yang ditentukan oleh komite ilmiah khusus mengandung pelanggaran dan kesalahan dan tidak mengizinkan publikasinya dapat dijual kepada sarjana, ahli, dan pelajar pengetahuan untuk pemeriksaan dan tanggapan, atau untuk tujuan membongkar dan mendaur ulang. Adapun untuk menjualnya kepada orang lain untuk beredar dan memanfaatkan isinya, mereka menganggapnya dilarang karena kebohongannya yang didukung oleh cara yang ditentukan oleh tujuan."
