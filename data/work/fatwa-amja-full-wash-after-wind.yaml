id: work/fatwa-amja-full-wash-after-wind
class: work
kind: fatwa
label: { ar: "تعميم البدن بعد الحدث", en: "Covering the body with water after wind — it suffices", ur: "حدث کے بعد جسم پر پانی — کافی" }
summary:
  ar: "سأل سائل كيف يتصرف إذا أراد الاستحمام وخرج منه ريح أثناءه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77694 بتاريخ 4 فبراير 2009)⁩ أنه إذا عمم جسده كله بالماء بعد خروج الريح أجزأه ذلك عن الوضوء لأن هذا التعميم سيشمل فيما يشمل أعضاء الوضوء فإن أراد إعادة الوضوء على سبيل الاحتياط فلا حرج على ما فصّل الجواب."
  en: "A questioner asked how to act when wind escapes him mid-bath. Dr. Salah al-Sawi (fatwa no. 77694, 4 February 2009) answered that covering his whole body with water after the wind's exit suffices him for wudu, the covering including the wudu-limbs among all it includes; if he wishes to redo wudu out of caution there is no harm — as the answer details."
  ur: "غسل میں ریح نکلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77694، 4 فروری 2009)⁩ کے مطابق جسم پر پانی بہنا وضو کا کافی ہے؛ احتیاطاً وضو جائز۔"
