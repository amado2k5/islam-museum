id: work/fatwa-amja-full-wash-after-wind
class: work
kind: fatwa
label: { ar: "تعميم البدن بعد الحدث", en: "Covering the body with water after wind — it suffices", ur: "حدث کے بعد جسم پر پانی — کافی", es: "Cubrir el cuerpo con agua después del viento es suficiente.", fr: "Se couvrir le corps d'eau après avoir eu des gaz — cela suffit.", tr: "Etkinlikten Sonra Vücut İyileşmesi", id: "Penyembuhan Tubuh Setelah Kejadian" }
summary:
  ar: "سأل سائل كيف يتصرف إذا أراد الاستحمام وخرج منه ريح أثناءه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77694 بتاريخ 4 فبراير 2009)⁩ أنه إذا عمم جسده كله بالماء بعد خروج الريح أجزأه ذلك عن الوضوء لأن هذا التعميم سيشمل فيما يشمل أعضاء الوضوء فإن أراد إعادة الوضوء على سبيل الاحتياط فلا حرج على ما فصّل الجواب."
  en: "A questioner asked how to act when wind escapes him mid-bath. Dr. Salah al-Sawi (fatwa no. 77694, 4 February 2009) answered that covering his whole body with water after the wind's exit suffices him for wudu, the covering including the wudu-limbs among all it includes; if he wishes to redo wudu out of caution there is no harm — as the answer details."
  ur: "غسل میں ریح نکلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77694، 4 فروری 2009)⁩ کے مطابق جسم پر پانی بہنا وضو کا کافی ہے؛ احتیاطاً وضو جائز۔"
  es: "Un consultante preguntó cómo actuar cuando se le escapa un gas durante el baño. El Dr. Salah al-Sawi (fatwa n.º 77694, 4 de febrero de 2009) respondió que cubrirse todo el cuerpo con agua después de que salga el gas es suficiente para realizar la ablución (wudu), incluyendo las extremidades que se utilizan para la ablución; si desea repetir la ablución por precaución, no hay ningún problema, como se detalla en la respuesta."
  fr: "Un homme a demandé comment agir en cas d'émission de gaz pendant son bain. Le Dr Salah al-Sawi (fatwa n° 77694, 4 février 2009) a répondu que se couvrir entièrement d'eau après l'émission du gaz suffit pour les ablutions, y compris les membres. S'il souhaite refaire ses ablutions par précaution, cela ne pose aucun problème, comme le précise la réponse."
  tr: "Bir soru soran kişiye banyo yapmak isterse nasıl davranması gerektiği soruldu ve bu sırada rüzgar esiyordu. Dr. Salah Al-Sawy (4 Şubat 2009 tarihli 77694 Fetva) rüzgar çekildikten sonra tüm vücudunu suya batırırsa, bunun abdest alma için yeterli olduğunu, çünkü bu genelleme abdest alma kısımlarını da kapsayacağını söyledi. Eğer önlem olarak abdest almayı tekrarlamak istiyorsa, açıklamada açıklananların zararı yoktur."
  id: "Seorang penanya ditanya bagaimana harus bertindak jika ingin mandi dan angin keluar selama mandi. Dr. Salah Al-Sawy menjawab (Fatwa No. 77694 tanggal 4 Februari 2009) bahwa jika dia merendam seluruh tubuhnya ke dalam air setelah angin pergi, itu sudah cukup untuk mandi karena generalisasi ini akan mencakup bagian-bagian dari mandi. Jika dia ingin mengulang wudhu sebagai tindakan pencegahan, tidak ada salahnya apa yang dijelaskan dalam penjelasan tersebut."
