id: work/fatwa-dar-alifta-eg-quran-in-prayer-without-tongue
class: work
kind: fatwa
label: { ar: "حكم قراءة القرآن في الصلاة بالقلب دون تحريك اللسان", en: "Reciting the Qur'an in prayer in the heart without moving the tongue", ur: "نماز میں زبان ہلائے بغیر دل میں قرآن پڑھنے کا حکم" }
summary:
  ar: "سائل سأل: ما حكم الصلاة بجريان القرآن الكريم على القلب وإمراره على الذهن دون تحريك اللسان؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24455)⁩ أن قراءة القرآن في الصلاة للإمام والمنفرد ركن لا تصح الصلاة بدونها، ولا تتحقق بمجرد جريانها على القلب أو إمرارها على الذهن بل لا بد من تحريك اللسان بها."
  en: "A questioner asked the ruling on praying with the Qur'an merely passing through the heart and mind without moving the tongue. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24455) answered that reciting the Qur'an in prayer is, for imam and solitary worshipper alike, a pillar without which the prayer is invalid; it is not achieved by the verses running through the heart or mind — the tongue must move with them."
  ur: "ایک سائل نے نماز میں دل و ذہن پر قرآن گزارنے بغیر زبان ہلائے کے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24455)⁩ نے جواب دیا کہ نماز میں قرآن کی تلاوت امام اور منفرد دونوں کے لیے ایک رکن ہے جس کے بغیر نماز نہیں ہوتی؛ آیات کا دل یا ذہن سے گزرنا کافی نہیں — زبان کا ان کے ساتھ ہلنا ضروری ہے۔"
