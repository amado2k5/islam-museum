id: work/fatwa-dar-alifta-eg-quran-in-prayer-without-tongue
class: work
kind: fatwa
label: { ar: "حكم قراءة القرآن في الصلاة بالقلب دون تحريك اللسان", en: "Reciting the Qur'an in prayer in the heart without moving the tongue", ur: "نماز میں زبان ہلائے بغیر دل میں قرآن پڑھنے کا حکم", es: "Recitar el Corán en la oración en el corazón sin mover la lengua.", fr: "Réciter le Coran en prière, dans le cœur, sans bouger la langue", tr: "Kur'an'ın kalple dil oynatmadan okunmasına ilişkin karar", id: "Aturan tentang membaca Al-Qur'an dalam doa dengan hati tanpa menggerakkan lidah" }
summary:
  ar: "سائل سأل: ما حكم الصلاة بجريان القرآن الكريم على القلب وإمراره على الذهن دون تحريك اللسان؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24455)⁩ أن قراءة القرآن في الصلاة للإمام والمنفرد ركن لا تصح الصلاة بدونها، ولا تتحقق بمجرد جريانها على القلب أو إمرارها على الذهن بل لا بد من تحريك اللسان بها."
  en: "A questioner asked the ruling on praying with the Qur'an merely passing through the heart and mind without moving the tongue. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24455) answered that reciting the Qur'an in prayer is, for imam and solitary worshipper alike, a pillar without which the prayer is invalid; it is not achieved by the verses running through the heart or mind — the tongue must move with them."
  ur: "ایک سائل نے نماز میں دل و ذہن پر قرآن گزارنے بغیر زبان ہلائے کے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24455)⁩ نے جواب دیا کہ نماز میں قرآن کی تلاوت امام اور منفرد دونوں کے لیے ایک رکن ہے جس کے بغیر نماز نہیں ہوتی؛ آیات کا دل یا ذہن سے گزرنا کافی نہیں — زبان کا ان کے ساتھ ہلنا ضروری ہے۔"
  es: "Un consultante preguntó sobre la norma relativa a la oración con el Corán simplemente recitando en el corazón y la mente sin mover la lengua. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 24455) respondió que recitar el Corán en la oración es, tanto para el imán como para el devoto solitario, un pilar sin el cual la oración es inválida; no se logra con los versículos recitados en el corazón o la mente, sino que la lengua debe moverse al mismo tiempo."
  fr: "Un fidèle a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24455) sur la validité de la prière, en se contentant de réciter le Coran mentalement et spirituellement sans bouger la langue. Il a été répondu que la récitation du Coran pendant la prière est, pour l'imam comme pour le fidèle solitaire, un pilier sans lequel la prière est invalide; elle ne se limite pas à la simple mémorisation des versets – la langue doit les accompagner."
  tr: "Bir soru soran kişi: Kur'an'ın kalpten akıp zihnin üzerinden geçip dili hareket ettirmeden geçmesi için namaz hakkındaki kural nedir? Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 24455), Kur'an'ı imam için veya tek başına namazken okumanın bir temel olduğunu ve namazın geçerli olmadığını, sadece kalbin üzerine ya da zihnin üzerinden geçirerek elde edilmediğini; bunun yerine dilin onunla birlikte hareket ettirilmesi gerektiğini yanıtladı."
  id: "Seorang penanya bertanya: Apa aturan tentang shalat dengan Al-Qur'an mengalir di atas hati dan melalukannya di atas pikiran tanpa menggerakkan lidah? Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 24455) menjawab bahwa membaca Al-Qur'an dalam doa untuk imam atau hanya untuk imam adalah sebuah tiang yang tanpa itu doa tidak sah, dan tidak tercapai hanya dengan menggerakkannya di atas hati atau di atas pikiran; sebaliknya, lidah harus digerakkan bersamanya."
