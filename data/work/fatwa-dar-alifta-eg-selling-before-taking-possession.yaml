id: work/fatwa-dar-alifta-eg-selling-before-taking-possession
class: work
kind: fatwa
label: { ar: "حكم بيع السلع قبل تملكها وقبضها", en: "Selling goods before owning and taking possession of them", ur: "ملکیت اور قبضے سے پہلے اشیاء بیچنے کا حکم", es: "Vender bienes antes de poseerlos y tomar posesión de ellos.", fr: "Vendre des biens avant d'en être propriétaire et d'en avoir pris possession" }
summary:
  ar: "سائل سأل عن بيع السلع قبل تملكها وقبضها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22458)⁩ أن المعاملة المسؤول عنها من قبيل عقد السلم الجائز شرعًا وليست من بيع السلع قبل تملكها المنهي عنه إذا تم الاتفاق على المواصفات والأجل كما فصّل الجواب."
  en: "A questioner asked about selling goods before owning and taking possession of them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22458) answered that the transaction asked about is of the kind of the lawful salam contract — not the forbidden selling of goods before ownership — where specification and term have been agreed, as the answer details."
  ur: "ایک سائل نے ملکیت اور قبضے سے پہلے اشیاء بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22458)⁩ نے جواب دیا کہ پوچھا گیا معاملہ جائز سلف کے عقد کی قسم ہے نہ کہ ممنوع 'ملکیت سے پہلے بیچنے' کی — جب وضع اور مدت پر اتفاق ہو جائے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la venta de bienes antes de poseerlos y tomar posesión de ellos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22458) respondió que la transacción en cuestión es del tipo de contrato salam lícito —no la venta prohibida de bienes antes de la propiedad— donde se han acordado las especificaciones y el plazo, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la vente de biens avant leur acquisition et leur prise de possession. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22458) a répondu que la transaction en question relève du contrat salam licite – et non de la vente de biens avant leur acquisition, interdite – lorsque les spécifications et les conditions ont été convenues, comme le précise la réponse."
