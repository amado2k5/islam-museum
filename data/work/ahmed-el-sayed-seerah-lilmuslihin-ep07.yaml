id: work/ahmed-el-sayed-seerah-lilmuslihin-ep07
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 7: الدعوة الجهرية"
  en: "The Prophetic Biography for Reformers, episode 7: The public call"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 7: اعلانیہ دعوت"
  fr: "La biographie prophétique pour les réformateurs, épisode 7 : L'appel public"
  es: "La biografía profética para los reformadores, episodio 7: La llamada pública"
summary:
  ar: "يتناول المجلس السابع من سلسلة السيرة النبوية للمصلحين الانتقال من الدعوة السرية إلى الجهرية. يروي المتحدث النداء على الصفا وموقف أبي لهب والتعذيب المبكر للمستضعفين من المسلمين وقصة ضماد، ثم مجلس قريش في وصف النبي وضغطها على أبي طالب. ويستخلص درسين: مسؤولية تبليغ الدين، ومركزية الصبر."
  en: "The seventh session of the series on the Prophetic biography for reformers treats the move from the secret to the public call. The speaker recounts the proclamation on al-Safa, Abu Lahab's reaction, the early torture of vulnerable converts, the story of Dhimad, the Qurayshi council on how to label the Prophet and their pressure on Abu Talib. He draws two lessons: the duty of conveying the religion and the centrality of patience."
  ur: "اصلاح پسندوں کے لیے سیرتِ نبوی کے سلسلے کی ساتویں نشست خفیہ دعوت سے اعلانیہ دعوت کی طرف منتقلی کو بیان کرتی ہے۔ مقرر صفا پر اعلان، ابو لہب کے ردعمل، کمزور نو مسلموں پر ابتدائی اذیت، ضماد کے قصے، نبی کو کیا نام دیا جائے اس بارے میں قریش کی مجلس اور ابو طالب پر ان کے دباؤ کو بیان کرتا ہے۔ وہ دو سبق نکالتا ہے: دین کو پہنچانے کی ذمہ داری اور صبر کی مرکزیت۔"
  fr: "La septième séance de la série sur la biographie prophétique pour les réformateurs traite du passage de l'appel secret à l'appel public. Le conférencier raconte l'appel sur al-Safa, la réaction d'Abu Lahab, la torture précoce des convertis vulnérables, l'histoire de Dhimad, le conseil des Quraysh sur la façon de qualifier le Prophète et leur pression sur Abu Talib. Il en tire deux leçons : le devoir de transmettre la religion et la centralité de la patience."
  es: "La séptima sesión de la serie sobre la biografía profética para reformadores trata del paso de la llamada secreta a la pública. El conferenciante relata el anuncio en al-Safa, la reacción de Abu Lahab, la tortura temprana de los conversos vulnerables, la historia de Dhimad, el consejo de los Quraysh sobre cómo calificar al Profeta y su presión sobre Abu Talib. Extrae dos lecciones: el deber de transmitir la religión y la centralidad de la paciencia."
