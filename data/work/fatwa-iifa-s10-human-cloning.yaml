summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: تحريم الاستنساخ البشري بالطريقتين المذكورتين وبأي طريقة أخرى تؤدي إلى التكاثر البشري، وإذا حصل تجاوز للحكم فإن آثار تلك الحالات تعرض لبيان أحكامها، وتحريم كل الحالات التي يقحم فيها طرف ثالث على العلاقة الزوجية رحمًا أو غير ذلك على ما فصّل."
  en: "IIFA's tenth-session resolution (July 1997) on human cloning: it prohibits human cloning by the two methods described and by any other method leading to human reproduction; where the prohibition is breached the consequences are presented for their rulings; and it prohibits every case introducing a third party — a womb or otherwise — into the marital relation, as detailed."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩: انسانی کلوننگ ہر طریقے سے حرام؛ ازدواجی تعلق میں تیسرے فریق کا دخول بھی حرام۔"
  es: "Resolución de la décima sesión de la IIFA (julio de 1997) sobre la clonación humana: prohíbe la clonación humana mediante los dos métodos descritos y mediante cualquier otro método que conduzca a la reproducción humana; en caso de incumplimiento de la prohibición, se presentan las consecuencias de sus resoluciones; y prohíbe cualquier caso que introduzca a un tercero —un útero o cualquier otra cosa— en la relación matrimonial, tal como se detalla."
