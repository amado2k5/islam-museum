class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 6: السابقون الأولون في الإسلام"
  en: "The Prophetic Biography for Reformers, episode 6: The earliest converts to Islam"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 6: اسلام میں سبقت لے جانے والے اولین مسلمان"
  fr: "La biographie prophétique pour les réformateurs, épisode 6 : Les premiers convertis à l'islam"
  es: "La biografía profética para los reformadores, episodio 6: Los primeros conversos al islam"
summary:
  ar: "يتناول المجلس السادس من سلسلة السيرة النبوية للمصلحين السابقين الأولين إلى الإسلام بوصفهم نواة المدرسة النبوية. يرى المتحدث أن دور الصحابة في مكة كان الصبر وحفظ الدين، وأنهم حملوا في المدينة مهام كثيرة في القيادة والتعليم، وأن للسابقين منها نصيبا كبيرا. ثم يعرض خشية النبي من انفتاح الدنيا بالمال، ويختم بالأساس الذي يفسر في رأيه سرعة الفتوحات."
  en: "The sixth session of the series on the Prophetic biography for reformers examines the earliest Muslims as the core of the Prophet's school. The speaker argues that the Companions' role in Mecca was endurance and preserving the faith, while in Medina they carried many leadership and teaching tasks, and that the early converts held a large share of them. He then discusses the Prophet's concern about the opening of worldly wealth and closes with the foundation that, in his view, explains the rapid conquests."
  ur: "اصلاح پسندوں کے لیے سیرتِ نبوی کے سلسلے کی چھٹی نشست اولین مسلمانوں کو نبوی مدرسے کا مرکز مان کر پرکھتی ہے۔ مقرر کی رائے ہے کہ مکہ میں صحابہ کا کردار صبر اور دین کی حفاظت تھا، جبکہ مدینہ میں انہوں نے قیادت اور تعلیم کی بہت سی ذمہ داریاں اٹھائیں اور ان میں اولین مسلمانوں کا حصہ بڑا تھا۔ پھر وہ دنیا کی دولت کھلنے پر نبی کے خدشے کا ذکر کرتا ہے اور اس بنیاد پر بات ختم کرتا ہے جو اس کے نزدیک فتوحات کی تیزی کی وضاحت کرتی ہے۔"
  fr: "La sixième séance de la série sur la biographie prophétique pour les réformateurs étudie les tout premiers musulmans comme noyau de l'école du Prophète. Le conférencier soutient que le rôle des Compagnons à La Mecque était l'endurance et la préservation de la foi, tandis qu'à Médine ils ont porté de nombreuses tâches de commandement et d'enseignement, dont les premiers convertis ont assumé une grande part. Il aborde ensuite la crainte du Prophète devant l'ouverture des richesses du monde et conclut sur le fondement qui, selon lui, explique la rapidité des conquêtes."
  es: "La sexta sesión de la serie sobre la biografía profética para reformadores examina a los primeros musulmanes como núcleo de la escuela del Profeta. El conferenciante sostiene que el papel de los Compañeros en La Meca fue la paciencia y la preservación de la fe, mientras que en Medina asumieron muchas tareas de mando y enseñanza, de las que los primeros conversos llevaron una gran parte. Después trata el temor del Profeta ante la apertura de las riquezas del mundo y cierra con el fundamento que, en su opinión, explica la rapidez de las conquistas."
