class: work
kind: book
label:
  ar: "ضعيف الجامع الصغير وزيادته ⁦(الفتح الكبير)⁩"
  en: "Da'if al-Jami' al-Saghir wa-Ziyadatuh (al-Fath al-Kabir)"
  ur: "ضعیف الجامع الصغیر وزیادتہ (الفتح الکبیر)"
summary:
  ar: "القسم الثاني من تحقيق الألباني لكتاب «الفتح الكبير»: يضم ما لا يحتج به عنده من الضعيف والضعيف جداً والموضوع، وهو قسيم «صحيح الجامع الصغير وزيادته»؛ بلغت أحاديثه بصورة مبدئية 6479 حديثاً منها 1075 من الزيادة، كما يذكر الناشر زهير الشاويش {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  en: "The second part of al-Albani's grading of al-Fath al-Kabir: it holds what he judges not usable as proof — weak, very weak and fabricated — and is the companion of Sahih al-Jami' al-Saghir wa-Ziyadatuh; the publisher Zuhayr al-Shawish gives a provisional count of 6,479 hadiths, 1,075 of them from the Ziyada {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  ur: "البانی کی «الفتح الکبیر» کی تحقیق کا دوسرا حصہ: اس میں وہ احادیث ہیں جو ان کے نزدیک قابلِ حجت نہیں — ضعیف، بہت ضعیف اور موضوع — اور یہ «صحیح الجامع الصغیر وزیادتہ» کا ساتھی ہے؛ ناشر زہیر شاویش کے مطابق ابتدائی شمار میں اس کی احادیث 6479 ہیں، جن میں 1075 زیادہ سے ہیں {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}۔"
