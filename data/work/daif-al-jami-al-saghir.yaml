id: work/daif-al-jami-al-saghir
class: work
kind: book
label:
  ar: "ضعيف الجامع الصغير وزيادته ⁦(الفتح الكبير)⁩"
  en: "Da'if al-Jami' al-Saghir wa-Ziyadatuh (al-Fath al-Kabir)"
  ur: "ضعیف الجامع الصغیر وزیادتہ ⁦(الفتح الکبیر)⁩"
  tr: "Zayıf Al-Jami' Al-Saghir ve eklenmesi (Al-Fath Al-Kabir)"
  id: "Al-Jami' Al-Saghir yang lemah dan penambahannya (Al-Fath Al-Kabir)"
summary:
  ar: "القسم الثاني من تحقيق الألباني لكتاب «الفتح الكبير»: يضم ما لا يحتج به عنده من الضعيف والضعيف جداً والموضوع، وهو قسيم «صحيح الجامع الصغير وزيادته»؛ بلغت أحاديثه بصورة مبدئية 6479 حديثاً منها 1075 من الزيادة، كما يذكر الناشر زهير الشاويش {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  en: "The second part of al-Albani's grading of al-Fath al-Kabir: it holds what he judges not usable as proof — weak, very weak and fabricated — and is the companion of Sahih al-Jami' al-Saghir wa-Ziyadatuh; the publisher Zuhayr al-Shawish gives a provisional count of 6,479 hadiths, 1,075 of them from the Ziyada {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  ur: "البانی کی «الفتح الکبیر» کی تحقیق کا دوسرا حصہ: اس میں وہ احادیث ہیں جو ان کے نزدیک قابلِ حجت نہیں — ضعیف، بہت ضعیف اور موضوع — اور یہ «صحیح الجامع الصغیر وزیادتہ» کا ساتھی ہے؛ ناشر زہیر شاویش کے مطابق ابتدائی شمار میں اس کی احادیث 6479 ہیں، جن میں 1075 زیادہ سے ہیں {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}۔"
  es: "La segunda parte de la clasificación de al-Albani de al-Fath al-Kabir: sostiene lo que él juzga no utilizable como prueba —débil, muy débil y fabricado— y es el compañero de Sahih al-Jami' al-Saghir wa-Ziyadatuh; el editor Zuhayr al-Shawish da un recuento provisional de 6.479 hadices, 1.075 de ellos de la Ziyada {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  fr: "La seconde partie de l'évaluation d'al-Fath al-Kabir par al-Albani: elle contient ce qu'il juge inutilisable comme preuve — faible, très faible et fabriquée — et est le compagnon de Sahih al-Jami' al-Saghir wa-Ziyadatuh; l'éditeur Zuhayr al-Shawish donne un décompte provisoire de 6 479 hadiths, dont 1 075 proviennent de la Ziyada {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 32}."
  tr: "Al-Albani'nin \"El-Feth el-Kabir\" kitabının doğrulamasının ikinci bölümü: zayıf, çok zayıf ve uydurma rivayetlerle ilgili kendisinin desteklemediği noktaları içerir. Bu bölüm \"Sahih al-Jami' al-Saghir ve eklemeleri\"nin bölümüdür. Hadisleri başlangıçta 6.479 hadise ulaşmış, bunların 1.075'i eklenmiştir; bu durum yayınevi Zuhair Al-Shawish tarafından belirtilmiştir {cite:sahih-jami-saghir-maktab-islami-1988, s. 5} {cite:sahih-jami-saghir-maktab-islami-1988, s. 32}."
  id: "Bagian kedua dari verifikasi Al-Albani atas kitab \"Al-Fath al-Kabir\": mencakup apa yang tidak didukung olehnya terkait narasi yang lemah, sangat lemah, dan dibuat-buat. Ini adalah bagian dari \"Sahih al-Jami' al-Saghir dan tambahannya.\" Hadis-haditnya awalnya mencapai 6.479 hadits, termasuk 1.075 tambahan, seperti yang disebutkan oleh penerbit Zuhair Al-Shawish {cite:sahih-jami-saghir-maktab-islami-1988, hlm. 5} {cite:sahih-jami-saghir-maktab-islami-1988, hlm. 32}."
