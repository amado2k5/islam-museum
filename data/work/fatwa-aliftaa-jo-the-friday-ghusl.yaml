id: work/fatwa-aliftaa-jo-the-friday-ghusl
class: work
kind: fatwa
label: { ar: "حكم غسل يوم الجمعة", en: "The ruling on the Friday ghusl", ur: "جمعے کے دن غسل کا حکم" }
summary:
  ar: "سؤال عن حكم غسل يوم الجمعة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه سنة مؤكدة مندوبة لكل من يريد حضور صلاة الجمعة، وبأن الجنب إذا نوى رفع الجنابة وغسل الجمعة معًا حصلا له. أجابت الدائرة بأن غسل الجمعة سنة مؤكدة، واستشهدت بحديث رواه أبو داود والترمذي وحسّنه، في أن من توضأ يوم الجمعة فقد أحسن، ومن اغتسل فالغسل أفضل. وقالت إنه مندوب لكل من يريد حضور صلاة الجمعة ولو لم يكن من أهلها، كالمرأة والصبي. وأضافت أن من كان جنبًا ونوى باغتساله رفع الجنابة وغسل الجمعة معًا حصل له الغسلان، وإن نوى أحدهما حصل ما نواه فقط."
  en: "A question about the ruling on the Friday ghusl, in which Jordan's General Iftaa Department answered that it is an emphasised sunna recommended for everyone who intends to attend the Friday prayer, and that someone in major impurity who intends both lifting that impurity and the Friday ghusl gains both. The Department answered that the Friday ghusl is an emphasised sunna, citing a hadith reported by Abu Dawud and al-Tirmidhi, who graded it good (hasan), that whoever performs wudu on Friday does well, and whoever performs ghusl, the ghusl is better. It said that it is recommended for everyone who intends to attend the Friday prayer, even someone not obliged to attend, such as a woman or a boy. It added that someone in a state of major impurity who intends by one bath both to lift the impurity and to perform the Friday ghusl gains both, while intending only one of them gains only that one."
  ur: "جمعے کے دن غسل کے حکم کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ سنت مؤکدہ ہے جو جمعے کی نماز میں حاضری کا ارادہ رکھنے والے ہر شخص کے لیے مستحب ہے، اور جنبی اگر جنابت دور کرنے اور جمعے کے غسل دونوں کی نیت کرے تو دونوں حاصل ہو جاتے ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ جمعے کا غسل سنت مؤکدہ ہے، اور ابو داود اور ترمذی کی روایت کردہ حدیث کا حوالہ دیا، جسے ترمذی نے حسن کہا، کہ جس نے جمعے کو وضو کیا اس نے اچھا کیا، اور جس نے غسل کیا تو غسل افضل ہے۔ اس نے کہا کہ یہ ہر اس شخص کے لیے مستحب ہے جو جمعے کی نماز میں حاضر ہونا چاہے، چاہے اس پر جمعہ لازم نہ ہو، جیسے عورت اور لڑکا۔ اس نے مزید کہا کہ جو جنبی ایک غسل سے جنابت دور کرنے اور جمعے کے غسل دونوں کی نیت کرے اسے دونوں حاصل ہو جاتے ہیں، اور اگر ایک کی نیت کرے تو صرف وہی حاصل ہوتا ہے۔"
