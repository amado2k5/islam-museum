id: work/fatwa-dar-alifta-eg-two-use-goods-sale-criterion
class: work
kind: fatwa
label: { ar: "ضابط جواز بيع ما له استعمالان وعلاقته بقاعدة ما يؤدي إلى الحرام", en: "The criterion for selling things with two uses and the 'means to the forbidden' rule", ur: "دو استعمال والی چیز کی بیع کا ضابط اور 'مفضی بہ حرام' کا قاعدہ", es: "El criterio para vender objetos con dos usos y la regla de los \"medios para lo prohibido\".", fr: "Le critère de vente des objets à double usage et la règle des « moyens d'accéder à l'interdit »", tr: "İki Kullanım Alanı Olan Şeyi Satmanın İzinliliği Kuralı ve Yasaklığa Götüren Kural ile İlişkisi", id: "Aturan tentang kelayakan menjual sesuatu yang memiliki dua kegunaan dan hubungannya dengan aturan tentang apa yang mengarah pada larangan" }
summary:
  ar: "سائل سمع أن ما له استعمالان يجوز بيعه فسأل عن ضابط ذلك وعلاقته بقاعدة ما يؤدي إلى الحرام فهو حرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21698)⁩ أن القول صحيح يتفق مع ما ذهب إليه المحققون من الفقهاء وبيّن الجواب الضابط على وجهه."
  en: "A questioner heard that whatever has two uses may be sold and asked the criterion and its relation to the rule that whatever leads to the forbidden is forbidden. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21698) answered that the saying is sound, agreeing with what the verifying jurists held, and the answer sets out the criterion."
  ur: "ایک سائل نے سنا کہ جس چیز کے دو استعمال ہوں اسے بیچنا جائز ہے؛ اس نے ضابط اور اس کا تعلق قاعدہ 'جو حرام کی طرف لے جائے وہ حرام ہے' سے پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21698)⁩ نے جواب دیا کہ یہ قول درست ہے اور محقق فقہا کے مذہب سے میل کھاتا ہے؛ ضابط جواب میں بیان ہوا۔"
  es: "Un consultante escuchó que todo lo que tiene dos usos puede venderse y preguntó cuál era el criterio y su relación con la regla de que todo lo que conduce a lo prohibido está prohibido. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21698) respondió que el dicho es válido, coincidiendo con lo que sostenían los juristas verificadores, y la respuesta expone el criterio."
  fr: "Un interrogateur, ayant entendu dire que tout ce qui a deux usages peut être vendu, demanda quel était le critère et son lien avec la règle selon laquelle tout ce qui conduit à l'interdit est interdit. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21698) répondit que cette parole était valide, conformément à l'avis des juristes qui l'ont vérifiée, et la réponse énonce le critère."
  tr: "Bir soru soran kişi, iki kullanıma sahip bir şeyin satılmasının izin verildiğini duydu ve bu konudaki kararı ve yasak eylemlere yol açanın yasak olduğu kuralıyla ilişkisini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21698), görüşün doğru ve hukukçular arasındaki doğrulayıcıların vardığı sonuçlarla tutarlı olduğunu, doğru cevabın ise doğru olduğunu yanıtladı."
  id: "Seorang penanya mendengar bahwa sesuatu dengan dua kegunaan diperbolehkan dijual, jadi ia bertanya tentang putusan tersebut dan hubungannya dengan aturan bahwa apa yang menyebabkan tindakan terlarang adalah hal yang dilarang. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21698) menjawab bahwa pendapat tersebut benar dan konsisten dengan apa yang telah dicapai para verifikator di antara para ahli hukum dan jawaban yang benar adalah benar."
