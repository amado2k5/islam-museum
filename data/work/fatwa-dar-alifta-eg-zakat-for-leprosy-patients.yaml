id: work/fatwa-dar-alifta-eg-zakat-for-leprosy-patients
class: work
kind: fatwa
label: { ar: "حكم الصرف من أموال الزكاة والصدقات على مرضى الجذام", en: "Spending zakat and charity on leprosy patients", ur: "زکات اور صدقات کوڑھ کے مریضوں پر خرچ کرنا", es: "Gastar el zakat y la caridad en pacientes con lepra", fr: "Dépenser la zakat et la charité pour les patients atteints de la lèpre" }
summary:
  ar: "سائل سأل عن الصرف من أموال الزكاة والصدقات على مرضى الجذام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21948)⁩ أنه يجوز الصرف منها في علاج الفقراء والمساكين من مرضى الجذام بطريق تمليك المال لهم لينفقوه على علاجهم على ما فصّل الجواب."
  en: "A questioner asked about spending zakat and charity funds on leprosy patients. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21948) answered that spending them on treating poor and needy leprosy patients is permitted — by way of giving them ownership of the money to spend on their treatment, as the answer details."
  ur: "ایک سائل نے زکات اور صدقات سے کوڑھ کے مریضوں پر خرچ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21948)⁩ نے جواب دیا کہ فقیر اور مسکین کوڑھ کے مریضوں کے علاج پر خرچ جائز ہے — مال ان کی ملکیت میں دے کر وہ اپنے علاج پر صرف کریں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el uso del zakat y los fondos de caridad para pacientes con lepra. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21948) respondió que está permitido destinarlos al tratamiento de pacientes pobres y necesitados con lepra, siempre y cuando se les otorgue la propiedad del dinero para que lo gasten en su tratamiento, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'utilisation de la zakat et des fonds de charité pour les malades de la lèpre. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21948) a répondu que leur utilisation pour soigner les malades pauvres et nécessiteux de la lèpre est permise, à condition de leur en céder la propriété afin qu'ils puissent les utiliser pour leurs soins, comme le précise la réponse."
