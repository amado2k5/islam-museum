summary:
  ar: "سائل سأل عن الصرف من أموال الزكاة والصدقات على مرضى الجذام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21948)⁩ أنه يجوز الصرف منها في علاج الفقراء والمساكين من مرضى الجذام بطريق تمليك المال لهم لينفقوه على علاجهم على ما فصّل الجواب."
  en: "A questioner asked about spending zakat and charity funds on leprosy patients. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21948) answered that spending them on treating poor and needy leprosy patients is permitted — by way of giving them ownership of the money to spend on their treatment, as the answer details."
  ur: "ایک سائل نے زکات اور صدقات سے کوڑھ کے مریضوں پر خرچ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21948)⁩ نے جواب دیا کہ فقیر اور مسکین کوڑھ کے مریضوں کے علاج پر خرچ جائز ہے — مال ان کی ملکیت میں دے کر وہ اپنے علاج پر صرف کریں، جیسا کہ جواب میں تفصیل ہے۔"
