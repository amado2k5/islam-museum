summary:
  ar: "سائل سأل عن استقبال مؤسسات العمل الخيري صكوك الأضاحي وتوزيعها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21874)⁩ أن صك الأضحية عبارة عن توكيل بالشراء والذبح وهو أمر جائز شرعًا إذ يجوز للمضحي أن يشتري ويذبح بنفسه أو يوكل غيره على ما فصّل الجواب."
  en: "A questioner asked about charity organisations receiving udhiyya vouchers and distributing them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21874) answered that the udhiyya voucher is a proxy for purchase and slaughter — lawful in the sharia — since the sacrificer may buy and slaughter himself or deputise another, as the answer details."
  ur: "ایک سائل نے خیراتی اداروں کے قربانی کے واؤچر لینے اور تقسیم کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21874)⁩ نے جواب دیا کہ قربانی کا واؤچر خرید اور ذبح کی وکالت ہے اور جائز ہے کیونکہ قربانی کرنے والا خود بھی خرید و ذبح کر سکتا ہے اور کسی کو وکیل بھی بنا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
