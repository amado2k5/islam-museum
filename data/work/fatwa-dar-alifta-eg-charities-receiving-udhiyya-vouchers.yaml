label: { ar: "حكم استقبال مؤسسات العمل الخيري صكوك الأضاحي وتوزيعها", en: "Charity bodies receiving udhiyya vouchers and distributing them", ur: "خیراتی اداروں کا قربانی کے واؤچر وصول کر کے تقسیم کرنا", es: "Organizaciones benéficas que reciben vales udhiyya y los distribuyen.", fr: "Les organismes caritatifs reçoivent et distribuent les bons udhiyya" }
summary:
  ar: "سائل سأل عن استقبال مؤسسات العمل الخيري صكوك الأضاحي وتوزيعها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21874)⁩ أن صك الأضحية عبارة عن توكيل بالشراء والذبح وهو أمر جائز شرعًا إذ يجوز للمضحي أن يشتري ويذبح بنفسه أو يوكل غيره على ما فصّل الجواب."
  en: "A questioner asked about charity organisations receiving udhiyya vouchers and distributing them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21874) answered that the udhiyya voucher is a proxy for purchase and slaughter — lawful in the sharia — since the sacrificer may buy and slaughter himself or deputise another, as the answer details."
  ur: "ایک سائل نے خیراتی اداروں کے قربانی کے واؤچر لینے اور تقسیم کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21874)⁩ نے جواب دیا کہ قربانی کا واؤچر خرید اور ذبح کی وکالت ہے اور جائز ہے کیونکہ قربانی کرنے والا خود بھی خرید و ذبح کر سکتا ہے اور کسی کو وکیل بھی بنا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un participante preguntó sobre las organizaciones benéficas que reciben y distribuyen vales de udhiyya. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21874) respondió que el vale de udhiyya es un instrumento para la compra y el sacrificio —lícito según la sharia—, ya que quien realiza el sacrificio puede comprarlo y sacrificarlo él mismo o delegar en otra persona, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la réception et la distribution de bons d'udhiyya par les organisations caritatives. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21874) a répondu que le bon d'udhiyya sert de substitut pour l'achat et l'abattage – licites selon la charia – puisque le sacrificateur peut acheter et abattre lui-même ou déléguer cette tâche, comme le précise la réponse."
