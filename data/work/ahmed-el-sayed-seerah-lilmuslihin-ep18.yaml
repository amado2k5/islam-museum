class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 18: غزوة بدر"
  en: "The Prophetic Biography for Reformers, episode 18: The Battle of Badr"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 18: غزوۂ بدر"
  fr: "La biographie prophétique pour les réformateurs, épisode 18 : La bataille de Badr"
  es: "La biografía profética para los reformadores, episodio 18: La batalla de Badr"
summary:
  ar: "الجلسة الثانية عن غزوة بدر. يتتبع المحاضر المسير من المدينة، ثم اكتشاف خروج قريش بكامل قوتها، ومشاورة الأنصار، وليلة ما قبل المعركة، والمبارزات والقتال ومصير زعماء قريش، ويختم ببيان منزلة من شهدوا بدرا."
  en: "The second session on the Battle of Badr. The speaker follows the march from Medina, the discovery that Quraysh had come out in force, the consultation with the Ansar, the night before the battle, the duels, the fighting and the fate of the Quraysh leaders, and closes with the standing of those who fought at Badr."
  ur: "غزوۂ بدر پر دوسری نشست۔ مقرر مدینہ سے روانگی، قریش کے پوری قوت سے نکلنے کی اطلاع، انصار سے مشورے، معرکے سے پہلی رات، انفرادی مقابلوں، لڑائی اور قریش کے سرداروں کے انجام کا ذکر کرتے ہیں، اور اہلِ بدر کے مقام پر بات ختم کرتے ہیں۔"
  fr: "Deuxième séance consacrée à la bataille de Badr. Le conférencier suit la marche depuis Médine, la découverte que Quraysh était sortie en force, la consultation des Ansar, la nuit précédant la bataille, les duels, les combats et le sort des chefs de Quraysh, puis conclut sur le rang de ceux qui ont combattu à Badr."
  es: "Segunda sesión sobre la batalla de Badr. El conferenciante sigue la marcha desde Medina, el descubrimiento de que Quraysh había salido con todas sus fuerzas, la consulta a los Ansar, la noche previa a la batalla, los duelos, los combates y la suerte de los jefes de Quraysh, y concluye con la posición de quienes combatieron en Badr."
