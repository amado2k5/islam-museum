id: work/fatwa-dar-alifta-eg-postmortem-organ-donation
class: work
kind: fatwa
label: { ar: "حكم التبرع بالأعضاء بعد الوفاة", en: "Donating organs after death", ur: "وفات کے بعد اعضا کا عطیہ", es: "Donación de órganos después de la muerte", fr: "Le don d'organes après la mort", tr: "Ölüm sonrası organ bağışı ile ilgili karar", id: "Putusan tentang donasi organ setelah kematian" }
summary:
  ar: "سائل سأل عن التبرع بالأعضاء بعد الوفاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21826)⁩ أن الفتوى استقرت في الديار المصرية على جواز نقل الأعضاء من الميت إلى الحي بالمحددات الشرعية والضوابط التي بيّنها الجواب."
  en: "A questioner asked about donating organs after death. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21826) answered that the settled fatwa in Egypt permits transferring organs from the dead to the living under the legal specifications and controls the answer sets out."
  ur: "ایک سائل نے وفات کے بعد اعضا عطیہ کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21826)⁩ نے جواب دیا کہ مصر میں فتویٰ یہی ہے کہ مُردے سے زندہ کو اعضا منتقل کرنا شرعی ضوابط کے ساتھ جائز ہے — جیسا کہ جواب میں بیان ہوا۔"
  es: "Una persona preguntó sobre la donación de órganos después de la muerte. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21826) respondió que la fatwa vigente en Egipto permite la transferencia de órganos de personas fallecidas a personas vivas, de acuerdo con las especificaciones legales y los controles que se establecen en la respuesta."
  fr: "Un internaute a posé une question sur le don d'organes post-mortem. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21826) a répondu que la fatwa en vigueur en Égypte autorise le transfert d'organes du défunt au vivant, sous réserve des conditions et des modalités légales énoncées dans la réponse."
  tr: "Bir soru soran kişi, ölümden sonra organ bağışı hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21826), fetvanın, Mısır'da organların ölen kişiden yaşayanlara aktarılmasının yasal belirleyiciler ve düzenlemelere göre kabul edilip edilmediği üzerine belirlendiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang donasi organ setelah kematian. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21826) menjawab bahwa fatwa ditetapkan di Mesir berdasarkan izin pemindahan organ dari almarhum ke orang hidup sesuai dengan penentu hukum dan peraturan yang diuraikan dalam jawaban."
