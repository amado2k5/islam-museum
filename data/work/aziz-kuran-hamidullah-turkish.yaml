summary:
  ar: "ترجمة تركية لمعاني القرآن نُقلت عن الترجمة الفرنسية «القرآن المقدس» لمحمد حميد الله في طبعتها التي راجعها بنفسه سنة 1973، أعدّها اللاهوتي عبد العزيز خطيب ومترجم الأدب الفرنسي محمود قانق، ونشرتها دار بيان في إسطنبول أول مرة سنة 2003 وأعيد طبعها حتى 2022؛ وتلاحظ جوانا بينك أنها، مع إعلان مترجميها اتباع منهج حميد الله، كثيرًا ما تعدل عن اختياراته إلى المصطلح التركي الشائع."
  en: "A Turkish rendering of the meanings of the Qur'an translated from Muhammad Hamidullah's French Le Saint Coran in the 1973 edition he revised himself, by the theologian Abdülaziz Hatip and the translator of French literature Mahmut Kanık, first published by Bayan Yayınları in Istanbul in 2003 and reprinted up to 2022; Johanna Pink observes that, though its translators declare they follow Hamidullah's method, it often abandons his choices for the commonplace Turkish term."
  ur: "قرآن کے معانی کا ترکی ترجمہ جو محمد حمید اللہ کے فرانسیسی «لو سینٹ کوران» کی اس اشاعت سے کیا گیا جس پر انھوں نے 1973 میں خود نظرِ ثانی کی تھی؛ مترجمین الٰہیات کے عالم عبد العزیز خطیب اور فرانسیسی ادب کے مترجم محمود قانق ہیں؛ پہلی بار 2003 میں استنبول میں بیان یاینلاری نے شائع کیا اور 2022 تک دوبارہ چھپا؛ یوہانا پنک کے مطابق مترجمین حمید اللہ کے طریقے کی پیروی کا اعلان کرنے کے باوجود اکثر ان کے انتخاب سے ہٹ کر عام ترکی اصطلاح اختیار کرتے ہیں۔"
