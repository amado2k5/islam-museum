summary:
  ar: "كتاب كليلة ودمنة من كتب الهند في الخرافات والأسمار وهو سبعة عشر بابا وقيل ثلاثة عشر بابا نقله إلى العربية وشرحه عبد الله بن المقفع وغيره، وقد اختلف في أمره فقيل عملته الهند وقيل عملته ملوك الأشغانية ونحلته الهند وقيل عملته الفرس ونحلته الهند وقال قوم إن الذي عمله برزويه الحكيم، ونقله إلى الشعر أبان بن عبد الحميد الرقاشي وعلي بن داود كاتب زبيدة وإسحاق بن المعتضم والذي خرج بعضه، ورأى ابن النديم في نسخة زيادة بابين وعملت شعراء العجم هذا الكتاب شعرا ونقل إلى اللغة الفارسية بالعربية، وله جوامع وانتزاعات عملها ابن المقفع وسهل بن هارون وسهل صاحب بيت الحكمة والمرد الأسود الذي استدعاه المتوكل من فارس {cite:fihrist-ibn-al-nadim p. 423-424}."
  en: "Kalila wa-Dimna — the Fihrist's account of its disputed Indian-Persian origin and its verse renderings by Aban, Ali ibn Dawud and Ishaq ibn al-Mu'tadim {cite:fihrist-ibn-al-nadim}"
