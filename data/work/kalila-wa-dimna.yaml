label: { ar: "كليلة ودمنة", en: "Kalila wa-Dimna", es: "Kalila wa-Dimna", fr: "Kalila wa-Dimna", ur: "کلیلہ ودمنہ", tr: "Kalila wa Dimna", id: "Kalila wa Dimna" }
summary:
  ar: "كتاب كليلة ودمنة من كتب الهند في الخرافات والأسمار وهو سبعة عشر بابا وقيل ثلاثة عشر بابا نقله إلى العربية وشرحه عبد الله بن المقفع وغيره، وقد اختلف في أمره فقيل عملته الهند وقيل عملته ملوك الأشغانية ونحلته الهند وقيل عملته الفرس ونحلته الهند وقال قوم إن الذي عمله برزويه الحكيم، ونقله إلى الشعر أبان بن عبد الحميد الرقاشي وعلي بن داود كاتب زبيدة وإسحاق بن المعتضم والذي خرج بعضه، ورأى ابن النديم في نسخة زيادة بابين وعملت شعراء العجم هذا الكتاب شعرا ونقل إلى اللغة الفارسية بالعربية، وله جوامع وانتزاعات عملها ابن المقفع وسهل بن هارون وسهل صاحب بيت الحكمة والمرد الأسود الذي استدعاه المتوكل من فارس {cite:fihrist-ibn-al-nadim p. 423-424}."
  en: "Kalila wa-Dimna — the Fihrist's account of its disputed Indian-Persian origin and its verse renderings by Aban, Ali ibn Dawud and Ishaq ibn al-Mu'tadim {cite:fihrist-ibn-al-nadim}"
  es: "Kalila wa-Dimna — el relato del Fihrist sobre su controvertido origen indio-persa y sus versiones en verso de Aban, Ali ibn Dawud e Ishaq ibn al-Mu'tadim {cite:fihrist-ibn-al-nadim}"
  fr: "Kalila wa-Dimna — le récit du Fihrist sur son origine indo-persane contestée et ses traductions en vers par Aban, Ali ibn Dawud et Ishaq ibn al-Mu'tadim {cite:fihrist-ibn-al-nadim}"
  ur: "کلیلہ و دمنہ - فہرسٹ کا اس کی متنازعہ ہند-فارسی اصلیت کا بیان اور ابان، علی ابن داؤد اور اسحاق ابن المتدیم کے ذریعہ اس کی آیات کا ترجمہ"
  tr: "Kalila wa Dimna adlı kitap, Hint'in mitler ve mitler üzerine kitaplarından biridir. On yedi bölümden oluşur ve bazıları on üç bölüm olduğunu söyler. Arapçaya çevrilmiş ve Abdullah ibn al-Muqaffa ve diğerleri tarafından açıklanmıştır. Yazarlığı konusunda anlaşmazlıklar vardır: Aşghaniye kralları tarafından yapıldığı, Persler tarafından da adlandırıldığı, Persler tarafından adlandırıldığı ve soyunun Hindistan tarafından da söylendiği söylenir. Bazıları, onu yazanın Barzawiyyah al-Hakim tarafından yapıldığını ve şiire çevrildiğini Aban ibn Abd al-Haper olarak belirtir Orta el-Rakaşı, Zubeyde'nin kâtipi Ali bin Davud ve bazıları alıntılanmış İshaq ibn al-Mu'ta'adim de vardır. İbn el-Nadim bu kitabı iki bölüm halinde gördü ve Arap olmayan şairler tarafından uyarlandı, Farsçaya Arapçaya çevrildi. Kitap, İbn el-Muqaffa', Sahl ibn Harun, Beyt al-Hikmah'ın yazarı Sahl ve el-Mütevakkil'in Pers'ten çağırdığı el-Merd el-Esved'in derlemeleri ve alıntılarını içerir {alıntı:Fihrist-ibn-al-Nadim s. 423-424}."
  id: "Buku Kalila wa Dimna adalah salah satu buku India tentang mitos dan mitos. Buku ini terdiri dari tujuh belas bab, dan beberapa mengatakan tiga belas bab. Buku ini diterjemahkan ke dalam bahasa Arab dan dijelaskan oleh Abdullah ibn al-Muqaffa' dan lainnya. Ada perbedaan pendapat mengenai penulisannya: dikatakan dibuat oleh raja-raja Ashghaniyya, dan juga disebut oleh orang Persia, dan juga dikatakan oleh orang Persia serta garis keturunannya oleh India. Beberapa mengatakan bahwa penulis karya ini dibuat oleh Barzawiyyah al-Hakim dan diterjemahkan ke dalam puisi adalah Aban ibn Abd al-Hamid al-Raqashi, Ali ibn Dawud, juru tulis Zubaydah, dan Ishaq ibn al-Mu'ta'adim, beberapa di antaranya dikutip. Ibn al-Nadim membaca buku ini dalam dua bab dan diadaptasi oleh penyair non-Arab, serta diterjemahkan ke dalam bahasa Persia ke dalam bahasa Arab. Buku ini berisi kumpulan dan kutipan oleh Ibn al-Muqaffa', Sahl ibn Harun, Sahl, penulis Bayt al-Hikmah, dan al-Mard al-Aswad, yang dipanggil al-Mutawakkil dari Persia {cite:Fihrist-ibn-al-Nadim hlm. 423-424}."
