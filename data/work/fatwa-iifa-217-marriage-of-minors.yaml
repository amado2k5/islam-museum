id: work/fatwa-iifa-217-marriage-of-minors
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 217 (23/1) بشأن زواج الصغيرات بين حق الولي ومصلحة الفتاة ومدى سلطة ولي الأمر في منعه أو تقييده من المنظور الشرعي", en: "IIFA resolution 217 (23/1) on the marriage of minor girls between the guardian's right and the girl's interest and the extent of the ruler's authority to prohibit or restrict it from the sharia perspective", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 217 (23/1): نابالغ لڑکیوں کی شادی — ولی کے حق اور لڑکی کے مفاد کے درمیان اور ولیِ امر کی ممنوع یا محدود کرنے کی اختیار کی حد، شرعی تناظر میں", es: "Resolución 217 (23/1) de la IIFA sobre el matrimonio de niñas menores de edad: entre el derecho del tutor y el interés de la niña y el alcance de la autoridad del gobernante para prohibirlo o restringirlo desde la perspectiva de la sharia.", fr: "Résolution 217 (23/1) de l'IIFA relative au mariage des mineures: entre le droit du tuteur et l'intérêt de la fille, et l'étendue du pouvoir du souverain d'interdire ou de restreindre ce mariage selon la charia.", tr: "Uluslararası İslami Fiqh Akademisi Kararı 217 (23/1), genç kızların vasi hakları ile kızın menfaati arasındaki evliliği ve vasinin bunu dini açıdan engelleme veya kısıtlama yetkisi hakkında", id: "Keputusan Akademi Fiqh Islam Internasional 217 (23/1) mengenai pernikahan anak perempuan muda antara hak wali dan kepentingan anak perempuan, serta kewenangan wali untuk mencegah atau membatasinya dari perspektif agama" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩. قرر المجمع أن الصغيرة هي من لم تبلغ الحلم والمعول عليه في تحديد سن الزواج هو البلوغ لانضباطه كما قرر الفقهاء؛ وأن شريعة الإسلام لم تحدد سنًا لإبرام عقد الزواج أما سن الدخول بالزوجة فمن الأمور التي تتحدد بحسب أحوال الزمان والمكان وصلاحية طرفي العقد للزواج وتكوين الأسرة؛ وأن للأب بما يحمله من شفقة ورحمة تجاه ابنته وبما يجب عليه من رعاية المصلحة الحق في تزويج ابنته بعد أخذ إذن القاضي، وإذا ثبت أن في التزويج ضررًا لها منع الأب من تزويجها، أما غير الأب فلا يجوز له تزويج الصغيرة؛ وأن تحديد سن تزويج الصغيرات يكون بإذن القاضي ويوكل أمره إلى ولي الأمر في كل دولة بحسب ظروف الزمان والمكان والسن بما يحقق المصلحة للجميع؛ وأنه يجب مراعاة مصلحة الفتاة عند التزويج؛ وأن ولاية الأب أو غيره من الأولياء على الفتاة مقيدة بتحقيق مصلحتها؛ وأن إذن الفتاة عند تزويجها لازم ولا يجوز تزويجها بغير إذنها ورضاها عملًا بحديث مسلم في حق الثيب والبكر، وإذا حدث تزويجها بغير رضاها كان لها الحق في طلب الفسخ؛ وأن لكل بلد الحق في تحديد السن المناسبة للزواج حسب ما يراه محققًا لمصلحة الفتاة والأسرة والمجتمع وله الحق في تقرير عقوبة مناسبة لمن يزوج الفتاة الصغيرة بغير إذن القاضي؛ وأنه يتعين وضع ضوابط صحية لتزويج الصغيرات ولا يجوز تزويج الفتاة بدونها ويكون تقدير هذه الضوابط من الأطباء الثقات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018). It ruled that the minor is the girl who has not reached puberty, the marriage age being determined by puberty as the jurists ruled for its regularity; that the sharia of Islam fixed no age for concluding the marriage contract, while the age of consummation belongs to the matters determined by the conditions of time and place and the suitability of both parties to marriage and founding a family; that the father, for the compassion and mercy he bears toward his daughter and the duty of caring for her interest, has the right to marry her off after taking the judge's permission, and if marrying her off is proven harmful the father is barred from it, while no one but the father may marry off the minor; that setting the age for marrying minors is by the judge's permission, its determination entrusted to the ruler in each state according to the circumstances of time, place and age in a way achieving the common interest; that the girl's interest must be observed in marrying her off; that the guardianship of the father or other guardians over the girl is conditioned on realising her interest; that the girl's permission in her marriage is binding and she may not be married without her permission and consent, acting on the Muslim hadith on the previously-married and the virgin, and if she is married without her consent she has the right to seek annulment; that each country has the right to set the suitable marriage age as it deems realising the interest of the girl, the family and society, and the right to set a suitable penalty for one who marries off a minor without the judge's permission; and that health controls must be laid down for marrying minors, without which a girl may not be married, their assessment belonging to trustworthy physicians."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا کہ صغیرہ وہ لڑکی ہے جو بلوغت کو نہیں پہنچی، اور شادی کی عمر کا تعین بلوغت سے ہوتا ہے جیسا کہ فقہاء نے اس کی منضبط ہونے کی وجہ سے مقرر کیا؛ شریعتِ اسلام نے نکاح کے عقد کی کوئی عمر مقرر نہیں کی، جبکہ دخول کی عمر ان معاملات میں ہے جو زمان و مکان کے حالات اور دونوں فریقوں کی نکاح و خاندان سازی کی صلاحیت سے طے ہوتے ہیں؛ باپ کو — اپنی بیٹی کے لیے شفقت و رحمت اور مفاد کی رعایت کے فرض کی بنا پر — قاضی کی اجازت لینے کے بعد اپنی بیٹی کی شادی کرنے کا حق ہے، اور اگر اس کی شادی میں اسے نقصان ثابت ہو جائے تو باپ کو اس سے روک دیا جائے، جبکہ باپ کے سوا کسی اور کو صغیرہ کی شادی کا اختیار نہیں؛ صغیرہ کی شادی کی عمر کا تعین قاضی کی اجازت سے ہوتا ہے اور ہر ملک کے ولیِ امر کو اس کا فیصلہ زمان و مکان اور عمر کے حالات کے مطابق سب کے مفاد کے لیے سونپا گیا؛ لڑکی کی شادی میں اس کا مفاد ملحوظ رکھنا لازم ہے؛ باپ یا دیگر اولیاء کی ولایت لڑکی کے مفاد کی تحقق سے مشروط ہے؛ لڑکی کی اجازت اس کی شادی میں لازم ہے اور اس کے بغیر اس کی شادی جائز نہیں — مسلم کی اس حدیث کے مطابق جو ثیبہ اور دوشیزہ کے حق میں ہے — اور اگر اس کے بغیر شادی ہو جائے تو اسے فسخ کا حق ہے؛ ہر ملک کو یہ حق ہے کہ وہ شادی کی مناسب عمر مقرر کرے جسے وہ لڑکی، خاندان اور معاشرے کے مفاد میں سمجھے، اور قاضی کی اجازت کے بغیر صغیرہ کی شادی کرنے والے کے لیے مناسب سزا مقرر کر سکتا ہے؛ اور صغیرہ کی شادی کے لیے صحت کے ضوابط رکھنا ضروری ہے جن کے بغیر لڑکی کی شادی نہیں ہو سکتی، اور ان ضوابط کا اندازہ قابلِ اعتماد معالجوں کا ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018). Dictaminó que la menor es la niña que no ha alcanzado la pubertad, y que la edad para contraer matrimonio se determina por la pubertad, como dictaminaron los juristas para su regularidad; que la sharia del Islam no fija una edad para concluir el contrato matrimonial, mientras que la edad de consumación pertenece a los asuntos determinados por las condiciones de tiempo y lugar y la idoneidad de ambas partes para el matrimonio y la fundación de una familia; que el padre, por la compasión y misericordia que tiene hacia su hija y el deber de velar por sus intereses, tiene derecho a casarla después de obtener el permiso del juez, y si se demuestra que casarla es perjudicial, el padre está impedido de hacerlo, mientras que nadie más que el padre puede casar a la menor; que fijar la edad para contraer matrimonio con menores se hace con el permiso del juez, y su determinación se confía al gobernante de cada estado según las circunstancias de tiempo, lugar y edad, de manera que se logre el interés común; que se debe observar el interés de la niña al casarla; que la tutela del padre u otros tutores sobre la niña está condicionada a la realización de su interés; que el permiso de la niña en su matrimonio es vinculante y no puede casarse sin su permiso y consentimiento, actuando de acuerdo con el hadiz musulmán sobre la persona previamente casada y la virgen, y si se casa sin su consentimiento tiene derecho a solicitar la anulación; que cada país tiene derecho a fijar la edad adecuada para el matrimonio según lo considere que realiza el interés de la niña, la familia y la sociedad, y el derecho a establecer una pena adecuada para quien case a una menor sin el permiso del juez; y que se deben establecer controles de salud para casar a menores, sin los cuales una niña no puede casarse, y su evaluación corresponde a médicos de confianza."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018). Il a été statué que la mineure est la fille n'ayant pas atteint la puberté, l'âge du mariage étant déterminé par la puberté, conformément à la jurisprudence; que la charia islamique ne fixe aucun âge pour la conclusion du contrat de mariage, l'âge de la consommation du mariage étant déterminé par les circonstances de temps et de lieu, ainsi que par l'aptitude des deux parties au mariage et à la fondation d'une famille; que le père, par compassion et miséricorde envers sa fille et par devoir de veiller à ses intérêts, a le droit de la marier après avoir obtenu l'autorisation du juge, et que si le mariage est jugé préjudiciable, le père en est interdit, seul le père pouvant marier la mineure. L'âge légal du mariage pour les mineures est fixé par l'autorisation d'un juge, sa détermination étant confiée au souverain de chaque État en fonction des circonstances de temps, de lieu et d'âge, de manière à servir l'intérêt général. L'intérêt de la jeune fille doit être respecté lors de son mariage. La tutelle du père ou d'autres tuteurs est subordonnée à la prise en compte de cet intérêt. Le consentement de la jeune fille à son mariage est contraignant et elle ne peut être mariée sans son autorisation, conformément aux hadiths musulmans relatifs aux femmes déjà mariées et aux vierges. Si elle est mariée sans son consentement, elle a le droit de demander l'annulation du mariage. Chaque pays a le droit de fixer l'âge légal du mariage tel qu'il l'estime nécessaire pour servir l'intérêt de la jeune fille, de sa famille et de la société, et le droit de prévoir une sanction appropriée pour quiconque marie une mineure sans autorisation judiciaire. Des contrôles sanitaires doivent être mis en place pour le mariage des mineures, sans lesquels une jeune fille ne peut être mariée, leur évaluation relevant de médecins compétents."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Sefer 1440 H, 28 Ekim – 1 Kasım 2018) toplu kararı. Akademi, reşit olmayan kızın ergenliğe ulaşmamış olduğunu ve evlilik yaşının, hukukçular tarafından belirlenen disiplin nedeniyle ergenlik olarak kabul edildiğini; İslam hukukunun evlilik sözleşmesinin yapılması için bir yaş belirtmediğini, eşle evlenme yaşının ise zaman ve mekân koşullarına, evlilik sözleşmesinin her iki tarafının geçerliliğine ve aile kurulmasına göre belirlendiğini; babanın ise kızına gösterdiği şefkat ve merhametle ve en iyi çıkarları doğrultusunda, hakimin iznini aldıktan sonra kızını evlendirme hakkına sahip olduğunu belirtmiştir. Eğer şu kanıtlanırsa ki Evlilik, babanın onu evlendirmesini engelleyerek ona zarar verir. Baba olmayanlar için ise, reşit olmayan bir çocuğun evlendirilmesi kabul edilemez; genç kızların evlilik yaşı, her ülkenin hükümdarına zaman, yer ve yaş koşullarına göre hükümdara devredilen yargıcın izniyle belirlenir; kızın evlenirken en iyi yararı dikkate alınmalıdır; babanın veya diğer vasilerin velayeti kızın en iyi çıkarını sağlamakla sınırlıdır; ve kızın evlilik izni gereklidir ve Müslüman hadisine göre onun izni ve rızası olmadan evlendirilmesi kabul edilemez. Evli ve ilk doğan kadının hakkı ve evlilik onun rızası olmadan gerçekleşirse, iptal talebinde bulunma hakkına sahiptir; her ülke, kız, aile ve toplum için en uygun evlilik yaşını belirleme hakkına sahiptir ve genç bir kızı hakimin izni olmadan evlendiren herkese uygun cezalar uygulama hakkına sahiptir; genç kızların evlendirilmesi için sağlık düzenlemeleri oluşturulmalı ve kız kızları olmadan evlendirilmek mümkün değildir; bu kuralların değerlendirilmesi güvenilir doktorlar tarafından yapılır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Safar 1440 H, 28 Oktober – 1 November 2018). Akademi telah memutuskan bahwa gadis di bawah umur adalah yang belum mencapai masa pubertas, dan usia pernikahan dianggap sebagai masa pubertas karena disiplinnya, sebagaimana ditetapkan oleh para ahli hukum; dan bahwa hukum Islam tidak menetapkan usia untuk menandatangani kontrak pernikahan, sementara usia penyempurnaan dengan istri ditentukan berdasarkan keadaan waktu dan tempat, keabsahan kedua pihak dalam kontrak pernikahan, dan pembentukan keluarga; dan bahwa ayah, dengan belas kasih dan belas kasihan yang ia miliki kepada putrinya serta dengan perhatian yang harus ia ambil demi kepentingan terbaik, berhak menikahkan putrinya setelah memperoleh izin dari hakim. Jika terbukti bahwa dalam Pernikahan merugikan dia karena mencegah ayah menikahkannya. Adapun yang bukan ayah, tidak diperbolehkan menikahkan anak di bawah umur; usia pernikahan untuk gadis muda ditentukan dengan izin hakim, yang mendelegasikan urusan kepada penguasa di setiap negara sesuai dengan waktu, tempat, dan usia, dengan cara yang melayani kepentingan semua; kepentingan terbaik gadis harus dipertimbangkan saat menikah; perwalian ayah atau wali lain atas gadis dibatasi hanya untuk mencapai kepentingan terbaiknya; dan izin gadis dalam pernikahan diperlukan dan tidak diperbolehkan menikahkannya tanpa izin dan persetujuannya, menurut hadis Muslim Hak wanita yang menikah dan anak sulung, dan jika pernikahan terjadi tanpa persetujuannya, ia berhak meminta pembatalan pernikahan; setiap negara berhak menentukan usia yang sesuai untuk menikah sesuai dengan keinginan perempuan, keluarga, dan masyarakat, serta hak untuk menjatuhkan sanksi yang sesuai bagi siapa pun yang menikahkan gadis muda tanpa izin hakim; peraturan kesehatan harus ditetapkan untuk menikahkan gadis muda, dan tidak diperbolehkan menikahi gadis tanpa peraturan tersebut, dan penilaian aturan ini dilakukan oleh dokter terpercaya."
