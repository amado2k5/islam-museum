label: { ar: "مدى صحة صوم من نام أغلب النهار في رمضان", en: "The fast of one who sleeps most of the day in Ramadan", ur: "رمضان میں دن کا زیادہ حصہ سونے والے کا روزہ", es: "El ayuno de quien duerme la mayor parte del día en Ramadán.", fr: "Le jeûne de celui qui dort la majeure partie de la journée pendant le Ramadan", tr: "Ramazan ayında günün çoğunu uyuyan biri için oruç tutmak ne kadar geçerlidir", id: "Seberapa valid puasa bagi seseorang yang tidur hampir sepanjang hari di Ramadan" }
summary:
  ar: "سائل يعمل ليلًا وينام أغلب النهار في رمضان فسأل عن صحة صومه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21789)⁩ أنه إن اقتضت طبيعة عمل الصائم أن يعمل ليلًا وينام أغلب النهار فلا تأثير لذلك في صحة صومه شرعًا ما دام قد نوى الصيام على ما فصّل الجواب."
  en: "A man works nights and sleeps most of the day in Ramadan and asked about his fast's validity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21789) answered that if the nature of his work requires night work and daytime sleep, that does not affect his fast's validity so long as he formed the intention — as the answer details."
  ur: "ایک شخص رات کو کام کرتا اور رمضان میں دن کا زیادہ حصہ سوتا ہے؛ اس نے روزے کی صحت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21789)⁩ نے جواب دیا کہ اگر کام کی نوعیت یہی تقاضا کرے تو دن کا سونا روزے کی صحت پر اثر نہیں ڈالتا بشرطیکہ اس نے نیت کی ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre que trabaja de noche y duerme la mayor parte del día durante el Ramadán preguntó sobre la validez de su ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21789) respondió que si la naturaleza de su trabajo requiere trabajar de noche y dormir de día, eso no afecta la validez de su ayuno siempre y cuando haya tenido la intención de hacerlo, como se detalla en la respuesta."
  fr: "Un homme, travaillant de nuit et dormant la majeure partie de la journée pendant le Ramadan, s'est interrogé sur la validité de son jeûne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21789) a répondu que si la nature de son travail exige de travailler de nuit et de dormir le jour, cela n'affecte pas la validité de son jeûne, pourvu qu'il ait formé l'intention de jeûner – comme le précise la réponse."
  tr: "Ramazan ayında gece çalışan ve günün çoğunu uyuyan bir soru soran kişi, orucunun geçerliliğini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21789), oruç tutan kişinin işinin doğası gereği gece çalışıp günün çoğunu uyumasını gerektiriyorsa, bunun İslam hukukuna göre orucunun geçerliliğini etkilemediğini, yeter ki oruç tutmayı planladığı sürece, cevapta ayrıntılı olarak belirtildiği gibi, bu durum gerçekleşti."
  id: "Seorang penanya yang bekerja di malam hari dan tidur hampir sepanjang hari selama Ramadan menanyakan tentang keabsahan puasanya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21789) menjawab bahwa jika sifat pekerjaan orang yang berpuasa mengharuskannya bekerja di malam hari dan tidur hampir sepanjang hari, hal ini tidak mempengaruhi keabsahan puasanya menurut hukum Islam, selama ia berniat berpuasa, seperti yang dijelaskan dalam jawabannya."
