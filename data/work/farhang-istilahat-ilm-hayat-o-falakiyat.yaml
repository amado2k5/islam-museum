summary:
  ar: "معجم إنجليزي–أردو لمصطلحات الفلك أصدرته أنجمن ترقي أردو باكستان في كراتشي، يقابل المصطلح الإنجليزي بلفظ أردو أو عربي ويشرحه، وينبه على الأصول العربية لأسماء النجوم {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 60}."
  en: "English–Urdu glossary of astronomical terms issued by the Anjuman Taraqqi-e Urdu Pakistan in Karachi, giving Urdu or Arabic equivalents with explanations and noting the Arabic origins of star names {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 60}."
  ur: "انجمن ترقیِ اردو پاکستان کراچی کی جاری کردہ فلکیاتی اصطلاحات کی انگریزی–اردو فرہنگ، جو انگریزی اصطلاح کے مقابل اردو یا عربی لفظ اور وضاحت دیتی ہے اور ستاروں کے ناموں کی عربی اصل کی نشاندہی کرتی ہے {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 60}۔"
  es: "Glosario inglés-urdu de términos astronómicos publicado por la Anjuman Taraqqi-e Urdu Pakistan en Karachi, que proporciona equivalentes en urdu o árabe con explicaciones y señala los orígenes árabes de los nombres de las estrellas {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 60}."
  fr: "Glossaire anglais-ourdou des termes astronomiques publié par l'Anjuman Taraqqi-e Urdu Pakistan à Karachi, donnant les équivalents ourdous ou arabes avec des explications et notant les origines arabes des noms d'étoiles {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 p. 60}."
  tr: "Anjuman Urdu Taraqqi Pakistan tarafından Karaçi'de yayımlanan ve İngilizce terimle Urduca veya Arapça terimle eşleşen bir astronomik terimler sözlüğü, bunu açıklar ve yıldız isimlerinin Arapça kökenlerini belirtir {cite:anjuman-farhang-istilahat-ilm-hayat-1949 s. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 s. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 s. 60}."
  id: "Sebuah kamus istilah astronomi Inggris-Urdu yang diterbitkan oleh Anjuman Urdu Taraqqi Pakistan di Karachi, yang sesuai dengan istilah bahasa Inggris dalam istilah Urdu atau Arab, menjelaskannya, dan menunjukkan asal-usul nama bintang dalam bahasa Arab {cite:anjuman-farhang-istilahat-ilm-hayat-1949 hlm. 1} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 hlm. 3} {cite:anjuman-farhang-istilahat-ilm-hayat-1949 hlm. 60}."
