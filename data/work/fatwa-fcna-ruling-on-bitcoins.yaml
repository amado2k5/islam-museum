summary:
  ar: "سؤال عن جواز شراء البيتكوين وبيعه وما يترتب على تلك المعاملات من أحكام. أجاب موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر أكتوبر 2021)⁩ ببيان ما هي البيتكوين كنوع من العملات الرقمية المشفرة وحكمها على ما فصّل الجواب."
  en: "A question about whether buying and selling bitcoin is permissible and which rulings apply to such transactions. The Fiqh Council of North America site (published October 2021) answered by setting out what bitcoin is as a type of cryptocurrency and its ruling — as the answer details."
  ur: "بٹ کوائن کی خرید و فروخت کے جواز اور اس پر لگنے والے احکام کا سوال۔ فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ نے ⁦(شائع شدہ اکتوبر 2021)⁩ جواب دیا جس میں بٹ کوائن کی تعریف اور حکم بیان ہے۔"
  es: "Una pregunta sobre si la compraventa de bitcoins es permisible y qué normas se aplican a dichas transacciones. El sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado en octubre de 2021) respondió detallando qué es el bitcoin como criptomoneda y su normativa, tal como se especifica en la respuesta."
