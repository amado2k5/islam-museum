label:
  ar: "عيش اللحظة ⁦(برنامج تلفزيوني رمضاني)⁩"
  en: "Ish al-Lahza: Live the Moment (Ramadan television programme)"
  ur: "عیش اللحظہ: لمحہ جیو (رمضانی ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني رمضاني لمصطفى حسني، تجعله ويكيبيديا العربية في رمضان 2014، يحفظ منه أرشيف أسابيل تسعًا وعشرين حلقة مصوّرة من خمس وعشرين دقيقة إلى ثلاثين تقريبًا: في كل حلقة «لحظة» من لحظات الحياة الكبرى ⁦(التغيير، والجرح، والقلق، والشوق إلى المعصية، والحب، والأنس بالله، والندم، والفراق، والفرح، والمرض، واليأس، والغضب، والقهر، والحزن، والخوف، والحيرة، والغيرة وغيرها)⁩، يعرّفها ويضرب لها أمثلة من القرآن والسيرة وأخبار السلف وقصص الناس، ويسأل لماذا كتبها الله، ويرسم مساراتها، ويربطها باسم من أسماء الله الحسنى، ثم يختم بالحلقة التاسعة والعشرين عن لحظة الفوز في الآخرة."
  en: "A Ramadan television programme by Mustafa Hosny, dated by the Arabic Wikipedia to Ramadan 2014, of which the Assabile archive keeps twenty-nine video episodes of about twenty-five to thirty minutes: each takes one of life's great 'moments' (change, hurt, anxiety, longing for sin, love, intimacy with God, regret, bereavement, joy, illness, despair, anger, oppression, sorrow, fear, perplexity, jealousy and others), defines it, gives examples from the Qur'an, the life of the Prophet, the early generations and people's stories, asks why God decreed it, maps the paths it can take and ties it to one of the names of God, before a twenty-ninth episode on the moment of triumph in the hereafter."
  ur: "مصطفیٰ حسنی کا رمضانی ٹیلی وژن پروگرام، جسے عربی ویکیپیڈیا رمضان 2014 کا بتاتا ہے، جس کی تقریباً پچیس سے تیس منٹ کی انتیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں: ہر قسط زندگی کے کسی بڑے «لمحے» کو لیتی ہے (تبدیلی، زخم، اضطراب، گناہ کی خواہش، محبت، اللہ سے انس، ندامت، جدائی، خوشی، بیماری، مایوسی، غصہ، ظلم، غم، خوف، تذبذب، غیرت وغیرہ)، اس کی تعریف کرتی ہے، قرآن، سیرت، سلف اور لوگوں کے واقعات سے مثالیں دیتی ہے، پوچھتی ہے کہ اللہ نے اسے کیوں لکھا، اس کے راستے بتاتی ہے اور اسے اللہ کے کسی نام سے جوڑتی ہے؛ آخری انتیسویں قسط آخرت میں کامیابی کے لمحے پر ہے۔"
