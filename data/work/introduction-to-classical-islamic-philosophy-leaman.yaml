  es: "Una introducción en inglés a la filosofía islámica, de Oliver Leaman, publicada por Cambridge University Press en 1985 con el título de An Introduction to Medieval Islamic Philosophy y reeditada por la misma editorial en 2001 con su título actual."
  fr: "Une introduction en anglais à la philosophie islamique par Oliver Leaman, publiée par Cambridge University Press en 1985 sous le titre An Introduction to Medieval Islamic Philosophy et rééditée par la même maison d'édition en 2001 sous son titre actuel."
  tr: "Oliver Lyman tarafından yazılmış İngilizce İslam felsefesine giriş, Cambridge University Press tarafından 1985'te \"Orta Çağ'da İslam Felsefesine Giriş\" başlığıyla yayımlanmış, ardından 2001'de mevcut adıyla yeniden yayımlanmıştır."
  id: "Pengantar bahasa Inggris tentang filsafat Islam oleh Oliver Lyman, diterbitkan oleh Cambridge University Press pada tahun 1985 dengan judul \"Introduction to Islamic Philosophy in the Middle Ages,\" kemudian diterbitkan ulang pada tahun 2001 dengan judul saat ini."
