summary:
  ar: "مدخل بالإنجليزية إلى الفلسفة الإسلامية لأوليفر ليمان، صدر عن مطبعة جامعة كامبريدج سنة 1985 بعنوان «مدخل إلى الفلسفة الإسلامية في العصور الوسطى»، ثم أعادت المطبعة إصداره سنة 2001 بعنوانه الحالي."
