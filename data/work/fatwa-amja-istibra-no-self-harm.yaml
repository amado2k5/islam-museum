id: work/fatwa-amja-istibra-no-self-harm
class: work
kind: fatwa
label: { ar: "الاستبراء من البول", en: "Istibra without torment — the customary measure", ur: "استبراء — معتدل حد تک", es: "Istibra sin tormento: la medida habitual", fr: "Istibra sans tourment — la mesure habituelle", tr: "idrar yapma", id: "buang air kecil" }
summary:
  ar: "سأل سائل أنه بعد التبول يستنجي بالورق حتى يجد الماء ويعصر حتى يجد ألمًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81726 بتاريخ 22 يونيو 2010)⁩ أنه لا يلزمه العصر إلى أن يجد ألمًا في قضيبه فإن الله لم يتعبده بتعذيب نفسه فما جعل عليكم في الدين من حرج، بل يكون الاستبراء بالمعروف بالقدر الذي يحصل به التنزه من البول ولا يسبب هذا الألم المذكور، والورقة إن وضعها تنفع على ما فصّل الجواب."
  en: "A questioner after urinating cleansed with paper till he found water, squeezing until he felt pain. Dr. Salah al-Sawi (fatwa no. 81726, 22 June 2010) answered that he need not squeeze till pain — God did not bind him to torment himself: 'He has placed no hardship on you in the religion'; istibra is done by the customary measure that clears urine, not the described pain, and the paper he places serves — as the answer details."
  ur: "استبراء میں درد تک نچوڑنا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81726، 22 جون 2010)⁩ کے مطابق معمول کی حد کافی ہے — دین میں حرج نہیں۔"
  es: "Un consultante, tras orinar, se limpió con papel hasta encontrar agua, apretando hasta sentir dolor. El Dr. Salah al-Sawi (fatwa n.º 81726, 22 de junio de 2010) respondió que no era necesario apretar hasta sentir dolor, pues Dios no le había obligado a atormentarse: «No te ha impuesto ninguna dificultad en la religión»; la istibra se realiza con la medida habitual que limpia la orina, no con el dolor descrito, y el papel que coloca sirve para eso, como se detalla en la respuesta."
  fr: "Un homme, après avoir uriné, s'est essuyé avec du papier jusqu'à trouver de l'eau, puis a pressé jusqu'à ressentir une douleur. Le Dr Salah al-Sawi (fatwa n° 81726, 22 juin 2010) a répondu qu'il n'était pas nécessaire de presser jusqu'à la douleur: Dieu ne l'a pas contraint à se tourmenter ainsi: « Il ne vous a imposé aucune difficulté dans la religion ». L'istibra se fait selon la méthode habituelle qui permet d'éliminer l'urine, et non en provoquant la douleur décrite, et le papier utilisé sert uniquement à cela, comme le précise la réponse."
  tr: "Bir soru soran kişi, idrar yaptıktan sonra su bulana kadar kağıtla durulamayı, ağrı verene kadar sıkmayı istedi. Dr. Salah Al-Sawy (22 Haziran 2010 tarihli 81726 sayılı fetva) cevabını verdi: Penisinde acı bulana kadar sıkması gerekmediğini, çünkü Allah kendisine işkence ederek ibadet etmemiştir, dinde size zorluk getirmemiştir. Bunun yerine, iyilikle arınma (istibriya) aramak, idrara çıkmanın zevkiyle sınırlıdır ve bahsedilen acıya neden olmaz. Kağıt yerleştirilirse, cevabda açıklandığı gibi etkilidir."
  id: "Seorang penanya bertanya bahwa setelah buang air kecil, seseorang harus membilas dengan kertas sampai menemukan air, dan memeras sampai merasakan sakit. Dr. Salah Al-Sawy menjawab (Fatwa No. 81726 tanggal 22 Juni 2010) bahwa dia tidak diwajibkan memeras sampai merasakan sakit di penisnya, karena Allah tidak menyembahnya dengan menyiksa diri-Nya, sehingga Dia tidak memberlakukan kesulitan apa pun kepada Anda dalam agama. Sebaliknya, mencari pembersihan (istibriya) dengan kebaikan terbatas pada kesenangan buang air kecil, dan tidak menyebabkan rasa sakit yang disebutkan. Jika kertas diletakkan, maka efektif, seperti yang dijelaskan dalam jawaban."
