id: work/fatwa-aliftaa-jo-are-school-exams-an-excuse-to-break-the-fast
class: work
kind: fatwa
label: { ar: "هل الامتحانات عذر يبيح الإفطار في رمضان؟", en: "Are exams an excuse to break the fast in Ramadan?", ur: "کیا امتحانات رمضان میں روزہ چھوڑنے کا عذر ہیں؟", es: "¿Son los exámenes una excusa para romper el ayuno en Ramadán?", fr: "Les examens sont-ils une excuse pour rompre le jeûne du Ramadan ?" }
summary:
  ar: "سؤال عن كون الامتحانات المدرسية عذرًا يبيح الإفطار في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن الامتحانات المدرسية والجامعية ليست عذرًا يبيح الإفطار. أجابت الدائرة بأن الامتحانات المدرسية والجامعية لا تعد عذرًا يبيح الإفطار، لأن معظم الطلاب يقدمون الامتحان صائمين من غير مشقة خارجة عن المعتاد. وقالت إن الصيام لا يتعارض مع الاستعداد للامتحان، وإن المسلم يستعين بالطاعة على مهام الدنيا والآخرة."
  en: "A question about whether school exams are an excuse to break the fast in Ramadan, in which Jordan's General Iftaa Department answered that school and university exams are not an excuse that permits breaking the fast. The Department answered that school and university exams do not count as an excuse permitting one to break the fast, because most students sit their exams while fasting without hardship beyond the ordinary. It said that fasting does not conflict with preparing for exams, and that a Muslim draws on acts of obedience for help with the tasks of this world and the next."
  ur: "اس بارے میں سوال کہ کیا اسکول کے امتحانات رمضان میں روزہ چھوڑنے کا عذر ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسکول اور یونیورسٹی کے امتحانات روزہ چھوڑنے کا عذر نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسکول اور یونیورسٹی کے امتحانات روزہ چھوڑنے کا عذر شمار نہیں ہوتے، کیونکہ زیادہ تر طلبہ معمول سے زیادہ مشقت کے بغیر روزے کی حالت میں امتحان دیتے ہیں۔ اس نے کہا کہ روزہ امتحان کی تیاری سے متصادم نہیں، اور مسلمان دنیا اور آخرت کے کاموں میں عبادت سے مدد لیتا ہے۔"
  es: "Ante la pregunta de si los exámenes escolares justifican la ruptura del ayuno durante el Ramadán, el Departamento General de Iftaa de Jordania respondió que los exámenes escolares y universitarios no son una excusa válida para romper el ayuno. El Departamento explicó que los exámenes escolares y universitarios no constituyen una excusa para romper el ayuno, ya que la mayoría de los estudiantes los presentan mientras ayunan sin mayores dificultades. Añadió que el ayuno no entra en conflicto con la preparación para los exámenes y que el musulmán recurre a los actos de obediencia para afrontar las tareas de este mundo y del más allá."
  fr: "À la question de savoir si les examens scolaires constituent une excuse pour rompre le jeûne du Ramadan, le Département général de la Iftaa en Jordanie a répondu que les examens scolaires et universitaires ne sont pas un motif valable pour rompre le jeûne. Le Département a expliqué que les examens scolaires et universitaires ne constituent pas une excuse valable pour rompre le jeûne, car la plupart des étudiants passent leurs examens pendant le jeûne sans difficulté particulière. Il a ajouté que le jeûne n'est pas incompatible avec la préparation aux examens et qu'un musulman s'appuie sur ses actes d'obéissance pour accomplir ses tâches dans ce monde et dans l'au-delà."
