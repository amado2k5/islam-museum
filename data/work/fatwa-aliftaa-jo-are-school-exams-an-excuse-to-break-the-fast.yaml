id: work/fatwa-aliftaa-jo-are-school-exams-an-excuse-to-break-the-fast
class: work
kind: fatwa
label: { ar: "هل الامتحانات عذر يبيح الإفطار في رمضان؟", en: "Are exams an excuse to break the fast in Ramadan?", ur: "کیا امتحانات رمضان میں روزہ چھوڑنے کا عذر ہیں؟" }
summary:
  ar: "سؤال عن كون الامتحانات المدرسية عذرًا يبيح الإفطار في رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأن الامتحانات المدرسية والجامعية ليست عذرًا يبيح الإفطار. أجابت الدائرة بأن الامتحانات المدرسية والجامعية لا تعد عذرًا يبيح الإفطار، لأن معظم الطلاب يقدمون الامتحان صائمين من غير مشقة خارجة عن المعتاد. وقالت إن الصيام لا يتعارض مع الاستعداد للامتحان، وإن المسلم يستعين بالطاعة على مهام الدنيا والآخرة."
  en: "A question about whether school exams are an excuse to break the fast in Ramadan, in which Jordan's General Iftaa Department answered that school and university exams are not an excuse that permits breaking the fast. The Department answered that school and university exams do not count as an excuse permitting one to break the fast, because most students sit their exams while fasting without hardship beyond the ordinary. It said that fasting does not conflict with preparing for exams, and that a Muslim draws on acts of obedience for help with the tasks of this world and the next."
  ur: "اس بارے میں سوال کہ کیا اسکول کے امتحانات رمضان میں روزہ چھوڑنے کا عذر ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اسکول اور یونیورسٹی کے امتحانات روزہ چھوڑنے کا عذر نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسکول اور یونیورسٹی کے امتحانات روزہ چھوڑنے کا عذر شمار نہیں ہوتے، کیونکہ زیادہ تر طلبہ معمول سے زیادہ مشقت کے بغیر روزے کی حالت میں امتحان دیتے ہیں۔ اس نے کہا کہ روزہ امتحان کی تیاری سے متصادم نہیں، اور مسلمان دنیا اور آخرت کے کاموں میں عبادت سے مدد لیتا ہے۔"
