label: { ar: "شرح المقالات الأربع لبطليموس", en: "Commentary on Ptolemy's Four Books (Tetrabiblos)", ur: "شرح المقالات الاربع لبطلیموس", es: "Comentario sobre los Cuatro Libros de Ptolomeo (Tetrabiblos)", fr: "Commentaire sur les Quatre Livres de Ptolémée (Tetrabiblos)", tr: "Ptolemaios'un Dört İncelemesi'nin Açıklaması", id: "Penjelasan Empat Risalah Ptolemaios" }
summary:
  ar: "شرح لـ[[person/al-battani|البتاني]] على كتاب بطليموس في أحكام النجوم، كانت منه نسخة في الإسكوريال وصفها الغزيري ثم فقدت، ويرى نالينو أن مخطوطة برلين المنسوبة إليه ليست له {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
  en: "A commentary by [[person/al-battani|al-Battani]] on Ptolemy's astrological Tetrabiblos; a copy once in the Escorial, described by Casiri, is lost, and Nallino holds the Berlin manuscript ascribed to him is not his {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
  ur: "بطلیموس کی نجومی کتاب المقالات الاربع پر [[person/al-battani|البتانی]] کی شرح؛ اسکوریال کا ایک نسخہ جسے غزیری نے بیان کیا، گم ہو گیا، اور نالینو کے نزدیک برلن کا مخطوطہ جو ان سے منسوب ہے، ان کا نہیں {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
  es: "Un comentario de [[persona/al-battani|al-Battani]] sobre el Tetrabiblos astrológico de Ptolomeo; una copia que estuvo en el Escorial, descrita por Casiri, se ha perdido, y Nallino sostiene que el manuscrito de Berlín que se le atribuye no es suyo {citar:nallino-albatenii-opus-astronomicum p. 29} {citar:nallino-albatenii-opus-astronomicum p. 32}."
  fr: "Un commentaire de [[person/al-battani|al-Battani]] sur le Tetrabiblos astrologique de Ptolémée; une copie autrefois dans l'Escurial, décrite par Casiri, est perdue, et Nallino détient le manuscrit berlinois qui lui est attribué n'est pas le sien {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
  tr: "[[kişi/al-battani|al-Battani]] tarafından Ptolemaios'un Yıldızların Kuralları üzerine yazılmış bir yorum; bu kitabın bir kopyası al-Ghaziri tarafından tanımlanan Escorial'de bulunmuştur ancak sonra kaybolmuştur. Nalino, kendisine atfedilen Berlin el yazmasının kendisine ait olmadığını düşünür. {cite:nallino-albatenii-opus-astronomicum s. 29} {cite:nallino-albatenii-opus-astronomicum s. 32}."
  id: "Komentar oleh [[person/al-battani|al-Battani]] atas buku Ptolemy tentang Aturan Bintang, yang salinannya ada di Escorial yang dijelaskan oleh al-Ghaziri namun kemudian hilang. Nalino percaya bahwa manuskrip Berlin yang dikaitkan dengannya bukanlah miliknya. {cite:nallino-albatenii-opus-astronomicum hlm. 29} {cite:nallino-albatenii-opus-astronomicum hlm. 32}."
