summary:
  ar: "شرح لـ[[person/al-battani|البتاني]] على كتاب بطليموس في أحكام النجوم، كانت منه نسخة في الإسكوريال وصفها الغزيري ثم فقدت، ويرى نالينو أن مخطوطة برلين المنسوبة إليه ليست له {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
  en: "A commentary by [[person/al-battani|al-Battani]] on Ptolemy's astrological Tetrabiblos; a copy once in the Escorial, described by Casiri, is lost, and Nallino holds the Berlin manuscript ascribed to him is not his {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
  ur: "بطلیموس کی نجومی کتاب المقالات الاربع پر [[person/al-battani|البتانی]] کی شرح؛ اسکوریال کا ایک نسخہ جسے غزیری نے بیان کیا، گم ہو گیا، اور نالینو کے نزدیک برلن کا مخطوطہ جو ان سے منسوب ہے، ان کا نہیں {cite:nallino-albatenii-opus-astronomicum p. 29} {cite:nallino-albatenii-opus-astronomicum p. 32}."
