label: { ar: "إرشادات المجلس الفقهي بشأن الحضانة والكفالة", en: "FCNA Guidelines on Fostering and Guardianship", ur: "فقہ کونسل کی بچوں کی کفالت و سرپرستی کی ہدایات", es: "Directrices de la FCNA sobre acogimiento familiar y tutela", fr: "Directives de la FCNA sur le placement familial et la tutelle", tr: "Hukuk Konseyi Rehberleri Velayet ve Sponsorluk ile İLİŞKİLDİRİLİKTE", id: "Pedoman Dewan Yurisprudensi Mengenai Hak Asuh dan Sponsor" }
summary:
  ar: "وثيقة مشتركة بين المجلس الفقهي لأمريكا الشمالية ومجمع فقهاء الشريعة بأمريكا ⁦(إعداد زينب علواني)⁩ عن الموقف الإسلامي من كفالة الأيتام والأطفال المهملين وإرشادات الحضانة والكفالة في السياق الأمريكي على ما فصّلته الوثيقة."
  en: "A joint document of the Fiqh Council of North America and the Assembly of Muslim Jurists of America (prepared by Zainab Alwani) on the Islamic position regarding the care of orphans and abandoned children, with fostering and guardianship guidelines for the American context — as the document details."
  ur: "فقہ کونسل آف نارتھ امریکہ اور اسمبلی آف مسلم جورسٹس کی مشترکہ دستاویز ⁦(تیاری: زینب علوانی)⁩ یتیموں اور بے سہارا بچوں کی کفالت پر اسلامی موقف اور امریکی تناظر میں ہدایات — جیسا کہ دستاویز میں تفصیل ہے۔"
  es: "Documento conjunto del Consejo de Jurisprudencia Islámica de Norteamérica y la Asamblea de Juristas Musulmanes de América (preparado por Zainab Alwani) sobre la postura islámica respecto al cuidado de huérfanos y niños abandonados, con directrices sobre acogimiento familiar y tutela para el contexto estadounidense, tal como se detalla en el documento."
  fr: "Un document conjoint du Conseil de jurisprudence islamique d'Amérique du Nord et de l'Assemblée des juristes musulmans d'Amérique (préparé par Zainab Alwani) sur la position islamique concernant la prise en charge des orphelins et des enfants abandonnés, avec des directives en matière de placement et de tutelle pour le contexte américain — comme le détaille le document."
  tr: "Kuzey Amerika Fıkıh Konseyi ile Amerika Şeriat Hukukçuları Akademisi arasında (Zainab Alwani tarafından hazırlanmış) ortak bir belge, belgede detaylandırıldığı üzere, yetim ve ihmal edilen çocukların desteklenmesi konusundaki İslami tutum ile Amerikan bağlamında velayet ve sponsorluk yönergeleri yer almaktadır."
  id: "Dokumen bersama antara Dewan Yurisprudensi Amerika Utara dan Akademi Ahli Hukum Syariah di Amerika (disiapkan oleh Zainab Alwani) mengenai sikap Islam dalam mensponsori anak yatim piatu dan anak yang diabaikan, serta pedoman hak asuh dan sponsor dalam konteks Amerika, sebagaimana dijelaskan dalam dokumen tersebut."
