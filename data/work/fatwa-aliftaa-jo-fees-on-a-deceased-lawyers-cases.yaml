id: work/fatwa-aliftaa-jo-fees-on-a-deceased-lawyers-cases
class: work
kind: fatwa
label: { ar: "أتعاب قضايا المحامي المتوفى", en: "Fees on a deceased lawyer's cases", ur: "فوت شدہ وکیل کے مقدمات کی فیس" }
summary:
  ar: "سؤال عن محامٍ توفي وقد نُقلت بعض قضاياه بإذن أصحابها إلى محامية بوكالة واتفاق جديدين، أجابت فيه دائرة الإفتاء العام الأردنية بأن المحامي المتوفى يستحق من الأتعاب بقدر ما أنجز من عمل يقدره أهل الخبرة، وما بقي يكون للمحامية بناء على الوكالة الجديدة. أجابت الدائرة بأن أتعاب المحامين من باب الأجرة على الوكالة، وأن جمهور الفقهاء يرون أن الأجير إذا انفسخت الإجارة يستحق بقدر عمله، ونقلت قول الشيرازي في المهذب إن المسمى يقسم عند الفسخ على ما استوفي وما بقي، ويُرجع في التقويم إلى أهل الخبرة. وقالت إن العقد ينفسخ بموت أحد طرفيه إذا لم يتمه الوارث، فيستحق العامل من الأجر المتفق عليه بالنسبة التي يقدرها أهل الخبرة لمقدار عمله، فإن لم يعمل شيئًا لم يستحق شيئًا، وإن أنجز النصف استحق النصف، ونقلت قول الخطيب الشربيني في مغني المحتاج، ومعه نقله عن الماوردي، في استحقاق القسط بعد الموت. وخلصت إلى أن تقدير أتعاب المحامي يُرجع فيه إلى ما يقدره أهل الخبرة في مهنة المحاماة لمقدار ما أنجزه قبل وفاته، وأن الوكالة تنفسخ بالوفاة، وما تبقى من الأتعاب يكون من حق المحامية بناء على الوكالة الجديدة."
  en: "A question about a lawyer who died after some of his cases were transferred, with the clients' permission, to a female lawyer under a new power of attorney and agreement, in which Jordan's General Iftaa Department answered that the deceased lawyer is entitled to the share of fees matching the work he completed, as estimated by experts, and the rest belongs to the new lawyer under the new agency. The Department answered that lawyers' fees are a wage for agency, and that the majority of jurists hold that a hired worker whose contract is dissolved is entitled in proportion to his work, quoting al-Shirazi in al-Muhadhdhab that on dissolution the agreed price is divided between what was performed and what remains, with valuation referred to experts. It said the contract is dissolved by the death of either party if the heir does not complete it, so the worker is entitled to the share of the agreed fee that experts estimate for the work he did: nothing if he did nothing, half if he completed half, and so on; it quoted al-Khatib al-Shirbini in Mughni al-Muhtaj, including his report from al-Mawardi, on entitlement to the proportionate share after death. It concluded that the lawyer's fees are assessed by what experts in the legal profession estimate for the work he completed before his death, that the agency ended with his death, and that the remaining fees belong to the new lawyer under the new agency."
  ur: "ایک وکیل کے بارے میں سوال جو فوت ہو گیا اور اس کے بعض مقدمات موکلوں کی اجازت سے نئی وکالت اور نئے معاہدے کے تحت ایک خاتون وکیل کو منتقل ہوئے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فوت شدہ وکیل اپنے مکمل کیے گئے کام کے بقدر فیس کا حق دار ہے جس کا اندازہ ماہرین کریں، اور باقی نئی وکالت کی بنا پر نئی وکیل کا حق ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ وکیلوں کی فیس وکالت پر اجرت ہے، اور جمہور فقہا کے نزدیک جس اجیر کا معاہدہ فسخ ہو جائے وہ اپنے کام کے تناسب سے حق دار ہے؛ اس نے المہذب میں شیرازی کا قول نقل کیا کہ فسخ پر طے شدہ اجرت انجام شدہ اور باقی کام پر تقسیم ہوگی، اور قیمت کا اندازہ ماہرین سے لیا جائے گا۔ اس نے کہا کہ اگر وارث کام پورا نہ کرے تو کسی ایک فریق کی موت سے معاہدہ فسخ ہو جاتا ہے، چنانچہ کارکن طے شدہ اجرت میں سے اتنے کا حق دار ہے جتنا ماہرین اس کے کام کا اندازہ لگائیں: کچھ نہ کیا تو کچھ نہیں، آدھا کیا تو آدھا، وغیرہ؛ اس نے موت کے بعد متناسب حصے کے استحقاق پر مغنی المحتاج میں خطیب شربینی کا قول، اور اس میں ماوردی سے ان کی نقل، پیش کی۔ اس نے نتیجہ نکالا کہ وکیل کی فیس کا تعین وکالت کے پیشے کے ماہرین کے اس اندازے سے ہوگا جو وہ اس کے وفات سے پہلے کیے گئے کام کا لگائیں، وفات سے وکالت ختم ہو گئی، اور باقی فیس نئی وکالت کی بنا پر نئی وکیل کا حق ہے۔"
