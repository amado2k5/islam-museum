label: { ar: "هجاء حسان لقبيلة مذحج «بنى اللؤم بيتا على مذحج»", en: "Hassan's satire of the tribe of Madhhij", es: "La sátira de Hassan sobre la tribu de Madhhij", fr: "Satire de Hassan sur la tribu de Madhhij", ur: "قبیلہ مدحج کا حسن کا طنز" }
summary:
  ar: "أبيات هجاء لحسان بن ثابت من المتقارب على روي الباء، كما في شرح البرقوقي الذي يذكر بحرها في رأسها {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. الهجاء هنا وصف أدبي من الديوان ولا يتبنى المتحف حكمه."
  en: "Satirical verses by Hassan ibn Thabit in the mutaqarib metre on the rhyme الباء, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. The satire is reported as a literary text; the museum does not adopt its judgement."
  es: "Versos satíricos de Hassan ibn Thabit en metro mutaqarib sobre la rima الباء, como en el comentario de al-Barquqi, que indica el metro en su encabezado {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. La sátira se considera un texto literario; el museo no comparte esta valoración."
  fr: "Vers satiriques de Hassan ibn Thabit en mètre mutaqarib sur la rime الباء, comme dans le commentaire d'al-Barquqi, qui mentionne le mètre dans son introduction {{cite:sharh-diwan-hassan-barquqi-1929 p.55}}. La satire est considérée comme un texte littéraire; le musée ne partage pas cette opinion."
  ur: "نظم الباء پر متقریب میٹر میں حسن بن ثابت کی طنزیہ آیات، جیسا کہ البرکی کی تفسیر میں، جس کے عنوان {{شرح دیوان-حسن برقوی-1929 صفحہ 55}} میں میٹر کو بیان کیا گیا ہے۔ طنز کو ایک ادبی متن کے طور پر رپورٹ کیا جاتا ہے۔ میوزیم اپنے فیصلے کو نہیں اپناتا ہے۔"
