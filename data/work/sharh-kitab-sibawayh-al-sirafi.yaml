label: { ar: "شرح كتاب سيبويه للسيرافي", en: "Sirafi's commentary on Sibawayh's Kitab", es: "El comentario de Sirafi sobre el Kitab de Sibawayh", fr: "Commentaire de Sirafi sur le Kitab de Sibawayh", ur: "سیرابی کی تفسیر سباویہ کی کتاب پر", tr: "Sirafi tarafından Sibawayh'in kitabının açıklaması", id: "Penjelasan tentang buku Sibawayh oleh Sirafi" }
summary:
  ar: "شرح أبي سعيد السيرافي على كتاب سيبويه، وهو مخطوط ومطبوع بحسب ما يذكره محقق طبعة زين. يرجع إليه المحقق في توضيح المواضع المشكلة من الكتاب ويقتبس منه نصوصاً مع الإشارة إلى مواضعها، وقد تنبّه السيرافي إلى ظاهرة التكرار وتجزئة البحث الواحد في الكتاب. {cite:bakka-kitab-sibawayh-2015 p.7} {cite:bakka-kitab-sibawayh-2015 p.11}"
  en: "Abu Sa'id al-Sirafi's commentary on Sibawayh's Kitab. The Zein edition's editor draws on manuscript and printed copies of it to clarify the difficult passages of the Kitab, and notes that al-Sirafi already observed the Kitab's repetitions and split treatments. {cite:bakka-kitab-sibawayh-2015 p.7} {cite:bakka-kitab-sibawayh-2015 p.11}"
  es: "Comentario de Abu Sa'id al-Sirafi sobre el Kitab de Sibawayh. El editor de la edición de Zein se basa en manuscritos y copias impresas para aclarar los pasajes difíciles del Kitab, y señala que al-Sirafi ya había observado las repeticiones y los tratamientos divididos del Kitab. {cite:bakka-kitab-sibawayh-2015 p.7} {cite:bakka-kitab-sibawayh-2015 p.11}"
  fr: "Commentaire d'Abu Sa'id al-Sirafi sur le Kitab de Sibawayh. L'éditeur de l'édition Zein s'appuie sur des manuscrits et des exemplaires imprimés pour éclaircir les passages difficiles du Kitab et note qu'al-Sirafi avait déjà relevé les répétitions et les divergences de traitement dans l'ouvrage. {cite:bakka-kitab-sibawayh-2015 p.7} {cite:bakka-kitab-sibawayh-2015 p.11}"
  ur: "ابو سعید الصرافی کی تفسیر سباویہ کی کتاب۔ زین ایڈیشن کے ایڈیٹر نے کتاب کے مشکل اقتباسات کو واضح کرنے کے لیے مخطوطہ اور اس کی مطبوعہ کاپیاں تیار کیں، اور نوٹ کیا کہ السرافی نے پہلے ہی کتاب کی تکرار اور تقسیم علاج کا مشاہدہ کیا ہے۔ {حوالہ: بکا-کتاب سیباویہ-2015 صفحہ 7}"
  tr: "Ebu Sa'id el-Sirafi'nin Sibawayh'in kitabı üzerine yaptığı yorum, bu bir el yazmasıdır ve Zain baskısının editörüne göre basılıdır. Editör, kitabın sorunlu kısımlarını açıklamak için bu yoruma başvurur ve metinleri yerlerine atıfta bulunur. El-Sirafi, kitaptaki tek bir çalışmanın tekrarlanması ve parçalanması olgusunun farkındaydı. {cite:bakka-kitab-sibawayh-2015 s.7} {cite:bakka-kitab-sibawayh-2015 s.11}"
  id: "Komentar Abu Sa'id al-Sirafi atas buku Sibawayh, yang merupakan naskah dan dicetak menurut editor edisi Zain. Editor merujuk pada naskah tersebut untuk memperjelas bagian-bagian bermasalah dari buku tersebut dan mengutip teks-teks darinya beserta referensi lokasi mereka. Al-Sirafi menyadari fenomena pengulangan dan fragmentasi dari satu studi dalam buku tersebut. {cite:bakka-kitab-sibawayh-2015 hlm.7} {cite:bakka-kitab-sibawayh-2015 hlm.11}"
