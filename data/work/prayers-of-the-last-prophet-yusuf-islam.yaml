label: { ar: "أدعية النبي الخاتم ⁦(Prayers of the Last Prophet)⁩", en: "Prayers of the Last Prophet", ur: "پریئرز آف دی لاسٹ پرافٹ" }
summary:
  ar: "ألبوم منطوق ليوسف إسلام، تتمة لـ«حياة النبي الخاتم»، يجمع أدعية النبي مرتبة على أوقات اليوم والليل: أدعية النوم وقيام الليل، والفجر، والنهار من الاستخارة والسفر وعيادة المريض ودخول المسجد، والمساء من دخول البيت والطعام والدعاء للوالدين والأولاد، ويختم بالصلاة على النبي؛ تؤرخه المقالة بـ14 سبتمبر 1999 وويكي بيانات بـ2003."
  en: "A spoken-word album by Yusuf Islam, the follow-up to The Life of the Last Prophet, gathering the supplications used by the Prophet in the order of the day and night: prayers for sleep and the night vigil, for dawn, for the day (istikhara, travel, visiting the sick, entering the mosque) and for the evening (entering the home, eating, parents and children), ending with blessings on the Prophet; the article dates it 14 September 1999 and Wikidata 2003."
  ur: "یوسف اسلام کا بولا ہوا البم، «دی لائف آف دی لاسٹ پرافٹ» کا تتمہ، جس میں نبی کی دعائیں دن اور رات کے اوقات کی ترتیب سے ہیں: سونے اور قیام اللیل، فجر، دن میں استخارہ، سفر، عیادت اور مسجد میں داخلہ، اور شام میں گھر، کھانا، والدین اور اولاد کی دعائیں۔"
