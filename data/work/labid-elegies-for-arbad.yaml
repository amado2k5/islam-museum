label: { ar: "مراثي لبيد بن ربيعة في أخيه أربد", en: "Labid ibn Rabi'a's elegies for his brother Arbad" }
summary:
  ar: "ست مقطوعات يوردها ابن إسحاق للبيد يبكي فيها أخاه لأمه أربد بن قيس بعد موته بالصاعقة: دالية «ما إن تعدّي المنون من أحد»، وميمية «ألا ذهب المحافظ والمحامي» يودّعه فيها بكنيته أبي حريز، ورجز «انع الكريم للكريم أربدا»، ومقطوعة «لن تفنيا خيرات أربد»، ورائية «يذكرني بأربد كل خصم»، وبيتان في من فقدهم من قومه. أثبت ابن هشام أن بعض أبياتها عن أبي عبيدة وعن غير ابن إسحاق."
  en: "Six pieces Ibn Ishaq gives as Labid's laments for his maternal brother Arbad ibn Qays after his death by lightning: a dal-rhymed poem, a mim-rhymed poem bidding him farewell by his kunya Abu Hurayz, a rajaz, a short piece on his virtues, a ra'-rhymed poem, and two verses on the kinsmen he had lost. Ibn Hisham marks certain verses as from Abu Ubayda or from other than Ibn Ishaq."
