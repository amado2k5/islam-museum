summary:
  ar: "متن تعليمي في مصطلح الحديث لمحمود الطحان، أستاذ الحديث بكلية الشريعة في جامعة الكويت. صدرت طبعته الأولى سنة 1397هـ/1977م كما يذكر المؤلف في مقدمة الطبعة السابعة ⁦(1405هـ/1985م)⁩، وأُعيد طبعه مراراً."
  en: "A teaching text on hadith terminology by Mahmud al-Tahhan, professor of hadith at the Faculty of Sharia, Kuwait University. Its first edition appeared in 1397/1977, as the author states in his preface to the seventh edition (1405/1985); it has been reprinted many times."
  ur: "محمود الطحان کی اصطلاحاتِ حدیث پر درسی کتاب، جو جامعہ کویت کی کلیۂ شریعہ میں حدیث کے استاد تھے۔ اس کا پہلا ایڈیشن 1397ھ/1977ء میں شائع ہوا، جیسا کہ مصنف نے ساتویں ایڈیشن ⁦(1405ھ/1985ء)⁩ کے مقدمے میں لکھا ہے؛ یہ بارہا چھپی ہے۔"
  es: "Texto didáctico sobre terminología hadiz de Mahmud al-Tahhan, profesor de hadices en la Facultad de Sharia de la Universidad de Kuwait. Su primera edición apareció en 1397/1977, como indica el autor en el prefacio de la séptima edición (1405/1985); ha sido reimpreso en numerosas ocasiones."
  fr: "Un ouvrage pédagogique sur la terminologie du hadith, rédigé par Mahmud al-Tahhan, professeur de hadith à la Faculté de Charia de l'Université du Koweït. Sa première édition est parue en 1397/1977, comme l'indique l'auteur dans sa préface à la septième édition (1405/1985); il a été réimprimé à de nombreuses reprises."
  tr: "Kuveyt Üniversitesi Şeriat Fakültesi'nde Hadisler Profesörü olan Mahmud Al-Tahan tarafından hadis terminolojisi üzerine eğitici bir metin. İlk baskısı, yazarın yedinci baskının girişinde (1405 Hicri / 1985 M.S.) belirttiği gibi, 1397 Hicri / 1977 yılında yayımlanmış olup, birçok kez yeniden basılmıştır."
  id: "Teks edukasi tentang terminologi hadis oleh Mahmoud Al-Tahan, Profesor Hadis di College of Sharia di Universitas Kuwait. Edisi pertamanya diterbitkan pada tahun 1397 H / 1977 M, seperti yang disebutkan oleh penulis dalam pengantar edisi ketujuh (1405 H / 1985 M), dan telah dicetak ulang beberapa kali."
