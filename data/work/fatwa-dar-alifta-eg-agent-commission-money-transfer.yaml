id: work/fatwa-dar-alifta-eg-agent-commission-money-transfer
class: work
kind: fatwa
label: { ar: "حكم أخذ العمولة على نقل الأموال", en: "Taking commission for transferring money", ur: "رقم پہنچانے پر کمیشن لینے کا حکم" }
summary:
  ar: "سائل سأل عن تقاضي الوكيل عمولة مالية قدرها 1% من قيمة المبلغ المرسل إليه والمطلوب إيصاله لأسرة مستحقة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22384)⁩ أنه لا مانع شرعًا من تقاضيه عمولة عن نقل الأموال على ما فصّل الجواب من ضوابط الوكالة بالأجرة."
  en: "A questioner asked about an agent charging a one-percent commission on a sum sent to him to deliver to an entitled family. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22384) answered that nothing in the sharia bars his taking a commission for transferring the money, under the rules of paid agency that the answer details."
  ur: "ایک سائل نے پوچھا کہ کوئی وکیل مستحق خاندان تک پہنچانے کے لیے بھیجی گئی رقم پر ایک فیصد کمیشن لے سکتا ہے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22384)⁩ نے جواب دیا کہ رقم پہنچانے پر کمیشن لینے میں شرعاً کوئی مانع نہیں، جواب کے بیان کردہ اجیرِ وکالت کے ضوابط کے مطابق۔"
