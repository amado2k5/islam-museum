label: { ar: "قرار مجمع الفقه الإسلامي الدولي 2 بشأن تقرير شعبة الدراسات والبحوث وأولوياتها", en: "IIFA resolution 2 on the studies division's report and research priorities", ur: "اکیڈمی کی قرارداد 2: تحقیق شعبے کی رپورٹ اور تحقیقی ترجیحات", es: "Resolución 2 de la IIFA sobre el informe de la división de estudios y las prioridades de investigación." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي ⁦(الدورة الأولى، مكة المكرمة، 26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. استعرض تقرير شعبة الدراسات والبحوث وقرر رصد التقنينات الشرعية الإسلامية ومشروعات تدوين أحكام الشريعة في أي بلد إسلامي وجمعها بغية تقنين الشريعة وتدوينها في مواد يسهل الرجوع إليها، وحدد أولويات البحث في: نظم تدريس الفقه ومناهجه، والاجتهاد في المجتمع الإسلامي المعاصر، والنظم القضائية والعدلية في الإسلام، والشركات التجارية الحديثة واهتماماتها."
  en: "A resolution of the International Islamic Fiqh Academy (first session, Mecca, 26–29 Safar 1405, 19–22 November 1984). Reviewing the studies and research division's report, it resolved to track Islamic sharia codifications and projects recording sharia rulings in any Muslim country, aiming to codify the sharia in accessible articles, and fixed research priorities: systems and curricula of fiqh teaching, ijtihad in the contemporary Muslim community, judicial and justice systems in Islam, and modern commercial companies and their concerns."
  ur: "اکیڈمی کی قرارداد ⁦(پہلی مجلس، مکہ، 26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩۔ اس نے شریعت کی مدون ترتیبوں کی رصد اور اسے مبسوط مواد میں مدون کرنے کا فیصلہ کیا اور تحقیقی ترجیحات مقرر کیں: فقہ کی تدریس اور نصاب، معاصر مسلم معاشرے میں اجتہاد، اسلام میں قضائی نظام، اور جدید تجارتی کمپنیاں۔"
  es: "Resolución de la Academia Internacional de Fiqh Islámico (primera sesión, La Meca, 26-29 de Safar de 1405, 19-22 de noviembre de 1984). Tras revisar el informe de la división de estudios e investigación, se decidió realizar un seguimiento de las codificaciones de la sharia islámica y de los proyectos que registran las normas de la sharia en cualquier país musulmán, con el objetivo de codificar la sharia en artículos accesibles, y se establecieron las siguientes prioridades de investigación: sistemas y planes de estudio de la enseñanza del fiqh, ijtihad en la comunidad musulmana contemporánea, sistemas judiciales y de justicia en el Islam, y empresas comerciales modernas y sus preocupaciones."
