label: { ar: "قرار مجمع الفقه الإسلامي الدولي 2 بشأن تقرير شعبة الدراسات والبحوث وأولوياتها", en: "IIFA resolution 2 on the studies division's report and research priorities", ur: "اکیڈمی کی قرارداد 2: تحقیق شعبے کی رپورٹ اور تحقیقی ترجیحات", es: "Resolución 2 de la IIFA sobre el informe de la división de estudios y las prioridades de investigación.", fr: "Résolution 2 de l'IIFA sur le rapport de la division des études et les priorités de recherche", tr: "Uluslararası İslami Fiqh Akademisi'nin Çalışmalar ve Araştırma Bölümü raporu ve öncelikleri hakkında kararı 2", id: "Keputusan Akademi Fiqh Islam Internasional 2 mengenai laporan Divisi Studi dan Riset serta prioritasnya" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي ⁦(الدورة الأولى، مكة المكرمة، 26–29 صفر 1405هـ، 19–22 نوفمبر 1984م)⁩. استعرض تقرير شعبة الدراسات والبحوث وقرر رصد التقنينات الشرعية الإسلامية ومشروعات تدوين أحكام الشريعة في أي بلد إسلامي وجمعها بغية تقنين الشريعة وتدوينها في مواد يسهل الرجوع إليها، وحدد أولويات البحث في: نظم تدريس الفقه ومناهجه، والاجتهاد في المجتمع الإسلامي المعاصر، والنظم القضائية والعدلية في الإسلام، والشركات التجارية الحديثة واهتماماتها."
  en: "A resolution of the International Islamic Fiqh Academy (first session, Mecca, 26–29 Safar 1405, 19–22 November 1984). Reviewing the studies and research division's report, it resolved to track Islamic sharia codifications and projects recording sharia rulings in any Muslim country, aiming to codify the sharia in accessible articles, and fixed research priorities: systems and curricula of fiqh teaching, ijtihad in the contemporary Muslim community, judicial and justice systems in Islam, and modern commercial companies and their concerns."
  ur: "اکیڈمی کی قرارداد ⁦(پہلی مجلس، مکہ، 26–29 صفر 1405ھ، 19–22 نومبر 1984ء)⁩۔ اس نے شریعت کی مدون ترتیبوں کی رصد اور اسے مبسوط مواد میں مدون کرنے کا فیصلہ کیا اور تحقیقی ترجیحات مقرر کیں: فقہ کی تدریس اور نصاب، معاصر مسلم معاشرے میں اجتہاد، اسلام میں قضائی نظام، اور جدید تجارتی کمپنیاں۔"
  es: "Resolución de la Academia Internacional de Fiqh Islámico (primera sesión, La Meca, 26-29 de Safar de 1405, 19-22 de noviembre de 1984). Tras revisar el informe de la división de estudios e investigación, se decidió realizar un seguimiento de las codificaciones de la sharia islámica y de los proyectos que registran las normas de la sharia en cualquier país musulmán, con el objetivo de codificar la sharia en artículos accesibles, y se establecieron las siguientes prioridades de investigación: sistemas y planes de estudio de la enseñanza del fiqh, ijtihad en la comunidad musulmana contemporánea, sistemas judiciales y de justicia en el Islam, y empresas comerciales modernas y sus preocupaciones."
  fr: "Résolution de l'Académie internationale de jurisprudence islamique (première session, La Mecque, 26-29 Safar 1405, 19-22 novembre 1984). Après avoir examiné le rapport de la division des études et de la recherche, elle a décidé de suivre les codifications de la charia islamique et les projets recensant les décisions de la charia dans tous les pays musulmans, dans le but de codifier la charia dans des articles accessibles, et a fixé les priorités de recherche suivantes: systèmes et programmes d'enseignement du fiqh, ijtihad dans la communauté musulmane contemporaine, systèmes judiciaires et de justice en islam, et entreprises commerciales modernes et leurs préoccupations."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kararı (Birinci Oturum, Mekke, 26–29 Sefer 1405 H, 19–22 Kasım 1984). Araştırma ve Çalışmalar Bölümü raporu, herhangi bir İslam ülkesinde Şeriat hükümlerinin kodifikasyonu ve projelerini gözden geçirip izlemeye karar vermiş, bunları kolayca erişilebilir materyallerde kodlamak ve belgelemek amacıyla toplamış ve araştırma önceliklerini belirlemiştir: fıkıh öğretim sistemleri ve metodolojileri, çağdaş İslam toplumunda ijtihad, İslam'da yargı ve yargı sistemleri ve modern ticari şirketler ile bunların çıkarları."
  id: "Keputusan Akademi Fiqh Islam Internasional (Sesi Pertama, Mekah, 26–29 Safar 1405 H, 19–22 November 1984 M). Laporan Divisi Studi dan Penelitian meninjau dan memutuskan untuk memantau kodifikasi hukum Islam dan proyek untuk mengkodifikasi putusan Syariah di negara Islam mana pun, mengumpulkannya untuk tujuan mengkodifikasi dan mendokumentasikan Syariah dalam materi yang mudah diakses, serta mengidentifikasi prioritas penelitian dalam: sistem dan metodologi pengajaran hukum, ijtihad dalam masyarakat Islam kontemporer, sistem peradilan dan peradilan dalam Islam, serta perusahaan komersial modern dan kepentingannya."
