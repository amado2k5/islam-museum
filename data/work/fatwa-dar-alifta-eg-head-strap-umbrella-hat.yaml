label: { ar: "حكم لبس قبعة المظلة الشمسية المثبتة على الرأس للمحرم", en: "The pilgrim wearing a head-mounted umbrella hat", ur: "محرم کا سر پر بندھی ہوئی چھتری والی ٹوپی پہننا", es: "El peregrino con un sombrero paraguas sujeto a la cabeza", fr: "Le pèlerin portant un chapeau-parapluie sur la tête", tr: "Mahram için kafasına takılan güneş gölgesi şapkası takma kuralı", id: "Aturan tentang pemakaian topi pelindung matahari yang dipasang di kepala untuk mahram" }
summary:
  ar: "سائل سأل عن لبس المحرم قبعة المظلة الشمسية المثبتة على الرأس بشريط مطاط. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21878)⁩ أنه يجوز للمحرم استعمالها إذا لم يتيسر له غيرها على ما فصّل الجواب."
  en: "A questioner asked about a pilgrim in ihram wearing a sun-umbrella hat fixed to the head with an elastic band. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21878) answered that the pilgrim may use it if nothing else is available to him — as the answer details."
  ur: "ایک سائل نے محرم کے سر پر ربڑ کی پٹی سے بندھی ہوئی دھوپ کی چھتری والی ٹوپی پہننے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21878)⁩ نے جواب دیا کہ اگر دوسرا کوئی ذریعہ میسر نہ ہو تو محرم اسے استعمال کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un peregrino en estado de ihram que llevaba un sombrero tipo sombrilla sujeto a la cabeza con una banda elástica. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21878) respondió que el peregrino puede usarlo si no dispone de otra cosa, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant un pèlerin en état d'ihram portant un chapeau-parapluie fixé sur la tête par un élastique. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21878) a répondu que le pèlerin pouvait l'utiliser en dernier recours, comme le précise la réponse."
  tr: "Bir soru soran kişi, mahramın başına lastik bantla bağlanmış güneş şemsiyesi şapkası taktığını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21878), cevapta ayrıntılı olarak belirtildiği gibi, bir mahramın başka bir şey bulamıyorsa şapkayı kullanmasının caiz olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang mahram yang mengenakan topi payung matahari yang dipasang di kepala dengan karet gelang. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21878) menjawab bahwa boleh digunakan oleh mahram jika ia tidak menemukan hal lain, seperti yang dijelaskan dalam jawabannya."
