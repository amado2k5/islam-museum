label: { ar: "حكم عمل البشعة", en: "The ruling on the bish'a ordeal", ur: "بشعہ کے عمل کا حکم", es: "El veredicto sobre la prueba del bish'a", fr: "Le jugement sur l'épreuve de la bish'a", tr: "Çirkin eylemler işleme hakkındaki karar", id: "Putusan tentang melakukan tindakan buruk" }
summary:
  ar: "سائل سأل عن «البشعة» وهي عادة تُستخدم في إثبات التهم أو معرفة فاعلها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22615)⁩ أن التعامل بالبشعة في إثبات التهم أو معرفة فاعلها حرام شرعًا؛ فهي ضرب من ضروب الكهانة والعرافة وليست وسيلة مشروعة لإثبات الحقائق."
  en: "A questioner asked about 'al-bish'a', a customary practice used to establish charges or identify their doer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22615) answered that employing the bish'a to prove accusations or find the culprit is forbidden in the sharia: it is a kind of soothsaying and divination, not a legitimate means of establishing facts."
  ur: "ایک سائل نے 'بشعہ' کے بارے میں پوچھا — ایک روایتی عمل جو الزام ثابت کرنے یا فاعل جاننے کے لیے استعمال ہوتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22615)⁩ نے جواب دیا کہ الزامات ثابت کرنے یا فاعل معلوم کرنے کے لیے بشعہ استعمال کرنا شریعت میں حرام ہے: یہ جھوٹ پھوٹ اور گیان شاستر کی ایک قسم ہے، حقائق ثابت کرنے کا کوئی جائز ذریعہ نہیں۔"
  es: "Un interlocutor preguntó sobre la práctica de la \"al-bish'a\", una costumbre utilizada para fundamentar acusaciones o identificar a sus autores. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22615) respondió que el uso de la bish'a para probar acusaciones o encontrar al culpable está prohibido por la sharia: se trata de una forma de adivinación, no de un medio legítimo para establecer los hechos."
  fr: "Un internaute a posé une question sur « al-bish'a », une pratique coutumière utilisée pour établir des accusations ou identifier leur auteur. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22615) a répondu que le recours à la bish'a pour prouver des accusations ou trouver le coupable est interdit par la charia: il s'agit d'une forme de divination, et non d'un moyen légitime d'établir les faits."
  tr: "Bir soru soran kişi, suçlamaları kanıtlamak veya failin kimliğini belirlemek için kullanılan bir gelenek olan 'çirkinlik' hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22615), suçlamaları kanıtlamak veya failin tanımlanmasında çirkinlikle uğraşmanın dini olarak yasak olduğunu; bunun bir fal ve fal biçimi olduğunu ve gerçekleri kanıtlamak için meşru bir araç olmadığını yanıtladı."
  id: "Seorang penanya menanyakan tentang 'keburukan,' yang merupakan kebiasaan yang digunakan untuk membuktikan tuduhan atau mengidentifikasi pelaku. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22615) menjawab bahwa menangani keburukan dalam membuktikan tuduhan atau mengidentifikasi pelaku adalah hal yang dilarang secara agama; ini adalah bentuk ramalan dan ramalan dan bukan cara yang sah untuk membuktikan fakta."
