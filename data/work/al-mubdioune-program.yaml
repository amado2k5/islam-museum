summary:
  ar: "برنامج «المبدعون» لطارق السويدان: سير شخصيات عظيمة من الحضارة الإسلامية تُعرض لا للتسلية بل لرسم القدوة وتغيير القناعات — وتُحلَّل على منهجيته «رباعيات صناعة المبدعين»؛ فكّر في تسميته «أسرار العظماء»."
  en: "Tareq al-Suwaidan's programme 'Al-Mubdi'un': the lives of great figures of Islamic civilisation presented not for entertainment but to set exemplars and change convictions — analysed on his 'quartets of making creatives' methodology; he thought of naming it 'Secrets of the Greats'."
  ur: "طارق السویدان کا پروگرام «المبدعون»: اسلامی تہذیب کی عظیم شخصیات کی سیریں جو تفریح کے لیے نہیں بلکہ اسوہ قائم کرنے اور قناعتیں بدلنے کے لیے پیش کی جاتی ہیں — اور ان کی «مبدعین کی تیاری کے چوکون» ترکیب پر تجزیہ ہوتا ہے؛ اس نے اسے «عظیموں کے راز» رکھنے کا سوچا تھا۔"
