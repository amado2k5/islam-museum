id: work/fatwa-amja-taking-us-citizenship
class: work
kind: fatwa
label: { ar: "الحصول على الجنسية الأمريكية", en: "Taking American citizenship", ur: "امریکی شہریت لینا", es: "Obtener la ciudadanía estadounidense", fr: "Acquérir la citoyenneté américaine", tr: "Amerikan vatandaşlığı alma", id: "Memperoleh kewarganegaraan Amerika" }
summary:
  ar: "سأل سائل عن جواز أخذ الجنسية الأمريكية لتسهيل دخوله أمريكا مجددًا وإن مكث في بلده الأم مدة طويلة تفوق ما تسمح به الإقامة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87413 بتاريخ 7 سبتمبر 2012)⁩ أنه لا حرج في الحصول على هذه الجنسية للأغراض المذكورة ما بقي المتجنس حفيظًا على ولائه لملته وأمته."
  en: "A questioner asked whether he may take American citizenship to ease re-entry to America even while staying long periods in his home country beyond what residency permits. Dr. Salah al-Sawi (fatwa no. 87413, 7 September 2012) answered that there is no harm in obtaining this citizenship for the mentioned purposes, provided the naturalised person keeps his loyalty to his creed and his ummah intact."
  ur: "ایک سائل نے سہولت سفر کے لیے امریکی شہریت لینے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87413، 7 ستمبر 2012)⁩ کے مطابق حرج نہیں بشرط اپنی ملت اور امت سے ولایت محفوظ رکھے۔"
  es: "Un consultante preguntó si podía obtener la ciudadanía estadounidense para facilitar su reingreso a Estados Unidos, incluso después de permanecer largos períodos en su país de origen más allá del tiempo de residencia permitido. El Dr. Salah al-Sawi (fatwa n.° 87413, 7 de septiembre de 2012) respondió que no hay inconveniente en obtener dicha ciudadanía para los fines mencionados, siempre y cuando la persona naturalizada mantenga intacta su lealtad a su credo y a su comunidad (ummah)."
  fr: "Un homme a demandé s'il pouvait acquérir la citoyenneté américaine pour faciliter son retour aux États-Unis, même en séjournant de longues périodes dans son pays d'origine au-delà de la durée autorisée par son permis de résidence. Le Dr Salah al-Sawi (fatwa n° 87413, 7 septembre 2012) a répondu qu'il n'y avait aucun inconvénient à obtenir cette citoyenneté aux fins mentionnées, à condition que la personne naturalisée conserve sa loyauté envers sa religion et sa communauté."
  tr: "Bir soru soran, ikamet izninden daha uzun süre kalsa bile, ABD'ye yeniden girişi kolaylaştırmak için Amerikan vatandaşlığı almanın izinliliği soruldu. Dr. Salah Al-Sawy (7 Eylül 2012 tarihli Fetva No. 87413) vatandaşlık alan kişinin dinine ve ulusuna sadık kaldığı sürece belirtilen amaçlar için bu vatandaşlığı almanın zararı olmadığını yanıtladı."
  id: "Seorang penanya ditanya tentang kelayakan memperoleh kewarganegaraan Amerika untuk memudahkan masuk kembali ke AS, meskipun ia tinggal di negara asalnya lebih lama dari izin tinggal. Dr. Salah Al-Sawy menjawab (Fatwa No. 87413 tanggal 7 September 2012) bahwa tidak ada salahnya memperoleh kewarganegaraan ini untuk tujuan tersebut selama orang yang dinaturalisasi tetap setia pada agama dan bangsanya."
