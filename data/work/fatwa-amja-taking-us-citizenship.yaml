id: work/fatwa-amja-taking-us-citizenship
class: work
kind: fatwa
label: { ar: "الحصول على الجنسية الأمريكية", en: "Taking American citizenship", ur: "امریکی شہریت لینا" }
summary:
  ar: "سأل سائل عن جواز أخذ الجنسية الأمريكية لتسهيل دخوله أمريكا مجددًا وإن مكث في بلده الأم مدة طويلة تفوق ما تسمح به الإقامة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87413 بتاريخ 7 سبتمبر 2012)⁩ أنه لا حرج في الحصول على هذه الجنسية للأغراض المذكورة ما بقي المتجنس حفيظًا على ولائه لملته وأمته."
  en: "A questioner asked whether he may take American citizenship to ease re-entry to America even while staying long periods in his home country beyond what residency permits. Dr. Salah al-Sawi (fatwa no. 87413, 7 September 2012) answered that there is no harm in obtaining this citizenship for the mentioned purposes, provided the naturalised person keeps his loyalty to his creed and his ummah intact."
  ur: "ایک سائل نے سہولت سفر کے لیے امریکی شہریت لینے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87413، 7 ستمبر 2012)⁩ کے مطابق حرج نہیں بشرط اپنی ملت اور امت سے ولایت محفوظ رکھے۔"
