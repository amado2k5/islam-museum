label: { ar: "قرار مجمع الفقه الإسلامي الدولي 152 (17/1) بشأن الإسلام والأمة الواحدة والمذاهب العقدية والفقهية", en: "IIFA resolution 152 (17/1) on Islam, the one umma and the creedal and juristic schools", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 152 (17/1): اسلام، وحدتِ امت اور عقیدہ و فقہ کے مذاہب", es: "Resolución 152 (17/1) de la IIFA sobre el Islam, la única umma y las escuelas doctrinales y jurídicas.", fr: "Résolution 152 (17/1) de l'IIFA sur l'islam, l'une des communautés (umma) et les écoles de foi et de droit" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، بعد استعراض قرارات المؤتمر الإسلامي الدولي ⁦(1425هـ/2005م)⁩ الذي دعا لتبني مبادئ «رسالة عمّان». قرر أن البحوث تتفق على القواعد الأساسية العامة للإسلام، وأن المذاهب العقدية والفقهية والتربوية اجتهادات لعلماء الإسلام قصد تيسير العمل به وتتجه كلها إلى بناء وحدة الأمة وإثرائها فكرًا، وأنها تتلاقى مع مضامين رسالة عمّان في بيان حقيقة الإسلام ودوره في المجتمع المعاصر، مع إشادة القرار بجهود من أطلقها ومن تبناها. وهو قرار وحدة-صف ذو طابع توصياتي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), after reviewing the International Islamic Conference resolutions (1425/2005) that called for adopting the principles of the Amman Message. It resolved that the submitted research agrees on the general foundational rules of Islam; that the creedal, juristic and educational schools are ijtihads of Islam's scholars meant to facilitate practising it, all tending toward building the umma's unity and enriching its thought; and that they converge with the content of the Amman Message in explaining Islam's reality and role in contemporary society — with the resolution commending those who launched and adopted it. A unity-of-ranks resolution of recommendatory character."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، بین الاقوامی اسلامی کانفرنس ⁦(1425ھ/2005ء)⁩ کی قراردادوں کے جائزے کے بعد جس نے 'پیغامِ عمان' کے اصولوں کو اپنانے کی دعوت دی۔ فیصلہ: پیش کردہ تحقیقات اسلام کے بنیادی عمومی اصولوں پر متفق ہیں؛ عقیدہ، فقہ اور تربیت کے مذاہب علمائے اسلام کے اجتہادات ہیں جو اس پر عمل آسان بنانے کے لیے ہیں اور سب امت کی وحدت اور فکری افزائش کی طرف متوجہ ہیں؛ اور یہ پیغامِ عمان کے مضامین سے ہم آہنگ ہیں جو اسلام کی حقیقت اور عصری معاشرے میں اس کے کردار کی وضاحت کرتے ہیں — قرارداد نے اس کے بانیان اور اختیار کرنے والوں کی کوششوں کی تحسین کی۔ یہ وحدتِ صف کی سفارشی قرارداد ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24-28 de junio de 2006), tras revisar las resoluciones de la Conferencia Islámica Internacional (1425/2005) que abogaban por la adopción de los principios del Mensaje de Amán. Se resolvió que la investigación presentada coincide en las normas fundamentales generales del Islam; que las escuelas doctrinales, jurídicas y educativas son ijtihads de los eruditos islámicos destinadas a facilitar su práctica, todas ellas orientadas a fortalecer la unidad de la umma y enriquecer su pensamiento; y que convergen con el contenido del Mensaje de Amán al explicar la realidad y el papel del Islam en la sociedad contemporánea, elogiando la resolución a quienes lo impulsaron y adoptaron. Resolución de carácter recomendatorio, con unidad de rango."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24-28 juin 2006), après examen des résolutions de la Conférence islamique internationale (1425/2005) appelant à l'adoption des principes du Message d'Amman. L'Académie a constaté que les recherches soumises s'accordent sur les fondements généraux de l'islam; que les écoles de doctrine, de droit et d'éducation constituent des ijtihads (exégèses) des savants musulmans visant à faciliter sa pratique, toutes contribuant à l'unité de la umma et à l'enrichissement de sa pensée; et qu'elles convergent avec le contenu du Message d'Amman pour expliquer la réalité et le rôle de l'islam dans la société contemporaine. La résolution félicite également ceux qui l'ont initié et adopté. Il s'agit d'une résolution unanime, à caractère recommandé."
