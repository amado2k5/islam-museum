id: work/fatwa-amja-kalimat-tawhid-and-nullifiers
class: work
kind: fatwa
label: { ar: "كلمة التوحيد ومبطلات الصلاة", en: "The word of tawhid and prayer's nullifiers", ur: "کلمہ توحید اور نماز کے مبطلات", es: "La palabra del tawhid y los anuladores de la oración", fr: "La parole du tawhid et les annulateurs de prière", tr: "Tek Tanrıcılığın Sözü ve Duanın Geçersizleştiricileri", id: "Firman Monoteisme dan Para Pembatalan Doa" }
summary:
  ar: "سأل سائل ما كلمة التوحيد وهل الشهادة لمحمد بالرسالة داخلة فيها ولماذا تذكر المذاهب الأربعة عشرات المبطلات بينما يذكر المعاصرون القليل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78105 بتاريخ 6 مارس 2009)⁩ أن كلمة التوحيد تطلق على الشهادة لله بالوحدانية ولمحمد بالرسالة، وتوسع كتب الفقه في مبطلات الصلاة أمر طبيعي لأنها أفردت الفقه بالتأليف بخلاف كتاب ما لا يسع المسلم جهله الذي تضمن جملًا عامة في العقائد والفقه والأخلاق ينتفع بها العامة وأشباههم، ومن أراد التوسع فأمامه كتب الفقه والمراجع، وكما يسلم على أخيه عند اللقاء فينبغي أن يسلم عليه عند الانصراف، ويعلم كتاب ما لا يسع المسلم جهله حسب طاقته."
  en: "A questioner asked what the word of tawhid is, whether the testimony to Muhammad's messengersip enters it, and why the four madhhabs list scores of prayer-nullifiers while contemporaries mention few. Dr. Salah al-Sawi (fatwa no. 78105, 6 March 2009) answered that the word of tawhid covers the testimony of God's oneness and of Muhammad's messengership; fiqh books' expansiveness on prayer's nullifiers is natural — they authored exclusively in fiqh, unlike What a Muslim Cannot Ignore, a general digest of creed, fiqh and manners for the layperson, while whoever wants breadth has the fiqh books and references; as one greets his brother on meeting, he should greet him on parting; and he should learn What a Muslim Cannot Ignore within his capacity."
  ur: "ایک سائل نے کلمہ توحید اور نماز کے مبطلات کی تعداد پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78105، 6 مارچ 2009)⁩ کے مطابق کلمہ توحید دونوں شہادتوں پر مشتمل ہے؛ فقہی کتب تفصیل بیان کرتی ہیں مگر مختصر متون عام مسلمان کے لیے کافی ہیں۔"
  es: "Un interlocutor preguntó qué es la palabra tawhid, si el testimonio de la misión de Mahoma está incluido en ella y por qué las cuatro madhhabs enumeran decenas de anulaciones de la oración, mientras que los contemporáneos mencionan pocas. El Dr. Salah al-Sawi (fatwa n.º 78105, 6 de marzo de 2009) respondió que la palabra tawhid abarca el testimonio de la unicidad de Dios y de la misión de Mahoma; la amplitud de los libros de fiqh sobre las anulaciones de la oración es natural, ya que fueron escritos exclusivamente en fiqh, a diferencia de Lo que un musulmán no puede ignorar, un compendio general de credo, fiqh y costumbres para el laico, mientras que quien desee amplitud tiene los libros y referencias de fiqh; así como uno saluda a su hermano al encontrarse, debe saludarlo al despedirse; y debe aprender Lo que un musulmán no puede ignorar dentro de sus posibilidades."
  fr: "Un internaute a demandé ce qu'est le concept de tawhid, si le témoignage de la prophétie de Muhammad en fait partie, et pourquoi les quatre écoles juridiques (madhhabs) recensent de nombreux motifs invalidant la prière, tandis que les contemporains en mentionnent peu. Le Dr Salah al-Sawi (fatwa n° 78105, 6 mars 2009) a répondu que le tawhid englobe le témoignage de l'unicité de Dieu et de la prophétie de Muhammad; que l'abondance des ouvrages de fiqh concernant les motifs invalidant la prière est naturelle – ils sont exclusivement rédigés en fiqh, contrairement à « Ce qu'un musulman ne peut ignorer », un recueil général de croyance, de fiqh et de bonnes manières destiné au profane, tandis que celui qui souhaite approfondir le sujet dispose des ouvrages et références de fiqh; de même qu'on salue son frère en le rencontrant, on doit le saluer en se séparant; et chacun doit apprendre « Ce qu'un musulman ne peut ignorer » dans la mesure de ses capacités."
  tr: "Bir soru soran kişi, 'tek tanrıcılık' kelimesinin ne olduğunu, mesajda Muhammed'e yapılan tanıklığın içerip içermediğini ve neden dört okulun onlarca geçersiz kılıcıdan bahsederken çağdaş alimlerin sadece birkaçını andığını sordu. Dr. Salah Al-Sawy (6 Mart 2009 tarihli 78105 No. Fetva) 'tek tanrıcılık' kelimesinin Tanrı'ya birlik olarak tanıklığı ve Muhammed'e bir mesaj olarak atıfta bulunduğunu söyledi. Hukukun geçersiz kılınmasına ilişkin kitapların genişlemesi doğaldır çünkü bunlar hukuku yazarlığa adanır; 'Bir Müslümanın Cehaletini Karşılayamaz Şey' kitabının aksine, 'Bir Müslüman Cehaletini Karşılayamaz' adlı kitapta genel cümleler bulunur ve bu cümleler genel kamu ve benzerlerine fayda sağlar. Genişletmek isteyen kişinin önünde fıkıh ve kaynak kitapları vardır. Nasıl ki kardeşini buluşurken selamlarsa, ayrılırken de selamlamalı ve Müslümanların kapasitesine göre cehalet edemeyeceği Kitab'ı öğretmelidir."
  id: "Seorang penanya bertanya apa itu kata 'monoteisme', dan apakah kesaksian kepada Muhammad dalam pesan itu termasuk di dalamnya, dan mengapa keempat aliran tersebut menyebut puluhan nullifier sementara para sarjana kontemporer hanya menyebutkan beberapa. Dr. Salah Al-Sawy menjawab (Fatwa No. 78105 tanggal 6 Maret 2009) bahwa kata 'monoteisme' merujuk pada kesaksian kepada Allah sebagai kesatuan dan Muhammad sebagai pesan. Perluasan buku fiqih tentang invalidasi doa adalah hal yang wajar karena mendedikasikan yurisprudensi pada kepenulisan, berbeda dengan buku 'What a Muslim Cannot Afford His Ignorance,' yang berisi kalimat umum tentang kepercayaan, firisprudensi, dan etika yang bermanfaat bagi masyarakat umum dan sejenisnya. Siapa pun yang ingin memperluas memiliki buku fiksi dan referensi di depannya. Sama seperti ia menyapa saudaranya saat bertemu, ia harus menyapanya saat berangkat, dan ia harus mengajarkan Kitab Apa yang tidak dapat diabaikan oleh seorang Muslim sesuai kemampuannya."
