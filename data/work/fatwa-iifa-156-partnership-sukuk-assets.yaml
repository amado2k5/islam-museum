label: { ar: "قرار مجمع الفقه الإسلامي الدولي 156 (17/5) بشأن استكمال النظر في صكوك المشاركة: مكونات موجوداتها", en: "IIFA resolution 156 (17/5) completing the review of partnership sukuk: the composition of their assets", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 156 (17/5): شراکت کے صکوک کا جائزہ مکمل کرنا — ان کے اثاثوں کی ترکیب", es: "Resolución 156 (17/5) de la IIFA que completa la revisión de los sukuk de sociedades: composición de sus activos.", fr: "Résolution 156 (17/5) de l'IIFA portant achèvement de l'examen des sukuk de partenariat: la composition de leurs actifs", tr: "Uluslararası İslami Fiqh Akademisi Kararı 156 (17/5) katılım araçlarının değerlendirilmesinin tamamlanmasına ilişkin olarak: varlıklarının bileşenleri", id: "Resolusi Akademi Fiqh Islam Internasional 156 (17/5) tentang penyelesaian pertimbangan instrumen partisipasi: komponen aset mereka" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السابعة عشرة بعمّان ⁦(28 جمادى الأولى – 2 جمادى الآخرة 1427هـ، 24–28 يونيو 2006م)⁩، إلحاقًا بقراراته السابقة 30 ⁦(4/5)⁩ بشأن سندات المقارضة و60 ⁦(6/11)⁩ بمنع سندات الدين و137 ⁦(15/3)⁩ بشأن صكوك الإجارة، وبعد الإحاطة بفتاوى الندوات والملتقيات والمعايير الشرعية للهيئة المحاسبية للمؤسسات المالية الإسلامية. عالج الموضوع المؤجل من قرار سندات المقارضة: حكم تداول الصكوك حين تكون موجوداتها مختلطة بين أعيان ومنافع ونقود وديون، وهو ما استكملته لاحقًا قرارات الغلبة والتبعية ⁦(196 ثم 214 و226)⁩. وضبط ضوابط إصدار صكوك المشاركة وتداولها بحسب غلبة المكونات."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 17th session in Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, 24–28 June 2006), appended to its earlier resolutions 30 (4/5) on muqarada bonds, 60 (6/11) prohibiting debt securities and 137 (15/3) on ijara sukuk, and after reviewing fatwas of symposia and the AAOIFI sharia standards. It treated the question left open by the muqarada resolution: the rule for trading sukuk whose underlying assets are mixed between tangibles, usufructs, cash and debts — the line later completed by the predominance/subordination resolutions (196, then 214 and 226) — regulating issuance and trading of partnership sukuk according to which components predominate."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، عمان میں سترہویں مجلس ⁦(28 جمادی الاولیٰ – 2 جمادی الآخرہ 1427ھ، 24–28 جون 2006ء)⁩ میں، اپنی سابقہ قراردادوں 30 ⁦(4/5)⁩ برائے مقارضہ بانڈز، 60 ⁦(6/11)⁩ برائے قرضے کی سندات کی ممانعت اور 137 ⁦(15/3)⁩ برائے اجارہ صکوک کی ضمیمہ، اور اسلامی مالی اداروں کی اکاؤنٹنگ باڈی کے شرعی معیارات اور سیمیناروں کے فتاویٰ کے جائزے کے بعد۔ اس نے مقارضہ والی قرارداد کے کھلے سوال کا حل پیش کیا: ایسے صکوک کی تجارت کا حکم جن کے بنیادی اثاثے اعیان، منافع، نقد اور دین کی مخلوط ہوں — وہی لکیر جسے بعد میں غلبہ و تبعیت کی قراردادوں ⁦(196 پھر 214 اور 226)⁩ نے مکمل کیا — اور اجزا کی غلبت کے حساب سے شراکت کے صکوک کے اجرا و تجارت کے ضوابط رکھے۔"
  es: "Una resolución colectiva de la Academia Internacional de Juqh Islámico en su 17.ª sesión en Amán (28 de Jumada al-Ula – 2 de Jumada al-Akhira de 1427, 24–28 de junio de 2006), adjunta a sus resoluciones anteriores 30 (4/5) sobre bonos muqarada, 60 (6/11) que prohíbe los títulos de deuda y 137 (15/3) sobre sukuk ijara, y después de revisar las fatwas de los simposios y las normas sharia de la AAOIFI. Abordó la cuestión que quedó abierta por la resolución muqarada: la regla para negociar sukuk cuyos activos subyacentes son mixtos entre tangibles, usufructos, efectivo y deudas —la línea que luego completaron las resoluciones de predominio/subordinación (196, luego 214 y 226)— regulando la emisión y negociación de sukuk de sociedad según qué componentes predominan."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (AAOIFI), adoptée lors de sa 17e session à Amman (28 Jumada al-Ula – 2 Jumada al-Akhira 1427, soit du 24 au 28 juin 2006), s'ajoute à ses résolutions antérieures n° 30 (4/5) sur les obligations muqarada, n° 60 (6/11) interdisant les titres de créance et n° 137 (15/3) sur les sukuk ijara, et fait suite à l'examen des fatwas des symposiums et des normes de la charia de l'AAOIFI. Elle traite de la question laissée en suspens par la résolution sur les muqarada: la règle applicable aux échanges de sukuk dont les actifs sous-jacents sont composés de biens corporels, d'usufruits, de liquidités et de créances – question complétée ultérieurement par les résolutions sur la prédominance/subordination (n° 196, puis n° 214 et n° 226) – régissant l'émission et la négociation de sukuk de partenariat selon la prédominance de certains composants."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Amman'daki on yedinci oturumunda (28 Cümedâle-Avvel – 2 Cumedül-Ahirah 1427 H, 24–28 Haziran 2006) toplu kararı, önceki 30 (4/5) kredi tahvilleri hakkında, 60 (6/11) borçlanma tahvillerini yasaklayan ve 137 (15/3) sayılı kararları doğrultusunda, seminerler, forumlar ve İslami Finans Kurumları Muhasebe Kurumu'nun Şeriat standartları dikkate alınarak alınmıştır. Kredi tahvilleri kararının ertelenmiş konusu: varlıkları varlıklar, faydalar, para ve borçlar arasında karıştığında sukukların dolaşımına ilişkin karar, daha sonra hakimiyet ve itaatlilik kararlarıyla (196, 214 ve 226) desteklendi. Bileşenlerin baskınlığına göre katılım sukuklarının ihraç ve dolaşıma girmesine ilişkin düzenlemelerin düzenlenmesi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ketujuh belas di Amman (28 Jumada al-Awwal – 2 Jumada al-Akhirah 1427 H, 24–28 Juni 2006), menyusul keputusan sebelumnya 30 (4/5) mengenai obligasi pinjaman, 60 (6/11) melarang obligasi utang, dan 137 (15/3) mengenai sukuk Ijarah, serta setelah mencatat fatwa seminar, forum, dan standar Syariah Organisasi Akuntansi Lembaga Keuangan Islam. Topik penundaan dalam keputusan obligasi pinjaman dibahas: putusan tentang peredaran sukuk ketika asetnya tercampur antara aset, manfaat, uang, dan utang, yang kemudian dilengkapi dengan keputusan dominasi dan subordinasi (196, 214, dan 226). Regulasi peraturan penerbitan dan pengedaran partisipasi sukuk sesuai dengan dominasi komponen."
