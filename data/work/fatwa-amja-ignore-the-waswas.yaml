id: work/fatwa-amja-ignore-the-waswas
class: work
kind: fatwa
label: { ar: "تجاهل الوسواس", en: "A heavily waswasa-afflicted woman — treat the whispering as nothing", ur: "وسواسے کا علاج — نظر انداز" }
summary:
  ar: "سألت امرأة موسوسة جدًا عن حكم حالتها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21958 بتاريخ 5 نوفمبر 2007)⁩ أن تتجاهل هذا الوسواس وتعتبره كأن لم يكن ولا تلتفت إليه واعلم أنه من الشيطان ليحزن الذين آمنوا وليس بضارهم شيئًا إلا بإذن الله على ما فصّل الجواب."
  en: "A woman very heavily afflicted with waswasa asked the ruling on her state. Dr. Salah al-Sawi (fatwa no. 21958, 5 November 2007) answered that she should disregard this whispering and count it as though it were not, paying it no heed, and know it is of Satan to grieve the believers — it will not harm them at all save by God's leave — as the answer details."
  ur: "شدید وسوسہ؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21958، 5 نومبر 2007)⁩ کے مطابق وسواسے کو کچھ نہ سمجھے — شیطان کا کام ہے، بے ضرر۔"
