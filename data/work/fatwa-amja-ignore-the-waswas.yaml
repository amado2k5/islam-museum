id: work/fatwa-amja-ignore-the-waswas
class: work
kind: fatwa
label: { ar: "تجاهل الوسواس", en: "A heavily waswasa-afflicted woman — treat the whispering as nothing", ur: "وسواسے کا علاج — نظر انداز", es: "Una mujer muy afectada por waswasa: no tomes los susurros como nada.", fr: "Une femme fortement atteinte de waswasa — ne tenez pas compte des chuchotements." }
summary:
  ar: "سألت امرأة موسوسة جدًا عن حكم حالتها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21958 بتاريخ 5 نوفمبر 2007)⁩ أن تتجاهل هذا الوسواس وتعتبره كأن لم يكن ولا تلتفت إليه واعلم أنه من الشيطان ليحزن الذين آمنوا وليس بضارهم شيئًا إلا بإذن الله على ما فصّل الجواب."
  en: "A woman very heavily afflicted with waswasa asked the ruling on her state. Dr. Salah al-Sawi (fatwa no. 21958, 5 November 2007) answered that she should disregard this whispering and count it as though it were not, paying it no heed, and know it is of Satan to grieve the believers — it will not harm them at all save by God's leave — as the answer details."
  ur: "شدید وسوسہ؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21958، 5 نومبر 2007)⁩ کے مطابق وسواسے کو کچھ نہ سمجھے — شیطان کا کام ہے، بے ضرر۔"
  es: "Una mujer muy afectada por la intuición (waswasa) solicitó la opinión sobre su situación. El Dr. Salah al-Sawi (fatwa n.º 21958, 5 de noviembre de 2007) respondió que debía ignorar esos susurros y tratarlos como si no existieran, sin prestarles atención, y saber que es obra de Satanás afligir a los creyentes; no les causará ningún daño salvo con el permiso de Dios, como se detalla en la respuesta."
  fr: "Une femme souffrant fortement de waswasa a demandé l'avis du Dr Salah al-Sawi (fatwa n° 21958, 5 novembre 2007) sur son état. Il lui a répondu qu'elle devait ignorer ces murmures et les considérer comme infondés, sans y prêter attention, et savoir qu'ils proviennent de Satan et visent à affliger les croyants; ils ne leur nuiront en rien, sauf par la permission de Dieu, comme le précise la réponse."
