label: { ar: "قصيدة حسان «كنا ملوك الناس قبل محمد»", en: "Hassan ibn Thabit's poem 'We were the kings of men before Muhammad'" }
summary:
  ar: "قصيدة لحسان بن ثابت على روي اللام في فخر الأنصار: كانوا ملوك الناس قبل محمد ثم أكرمهم الله بنصر دينه؛ تمدح كرمهم وعدلهم وتختم بسعد بن معاذ وحنظلة غسيل الملائكة. أثبت ابن هشام أن قوله «وألبسناه اسماً» عن غير ابن إسحاق، ونقل المحققون روايات الديوان."
  en: "A lam-rhymed poem by Hassan ibn Thabit in praise of the Ansar: kings of men before Muhammad, then honoured by God through the victory of his religion; it praises their generosity and justice and closes with Sa'd ibn Mu'adh and Hanzala washed by the angels. Ibn Hisham marks one phrase as from other than Ibn Ishaq; the editors record the diwan's variant readings."
