label: { ar: "هل القرض الربوي الذي أعلنته الحكومة الأمريكية بموجب قانون كيرز جائز شرعًا؟", en: "Is the interest-bearing CARES Act loan permissible?", ur: "کیا کیئرز ایکٹ کا سودی قرض شرعاً جائز ہے؟", es: "¿Es admisible el préstamo con intereses de la Ley CARES?", fr: "Le prêt CARES Act portant intérêt est-il autorisé ?", tr: "ABD hükümeti tarafından Kearns Yasası kapsamında beyan edilen tefeci kredi yasal olarak kabul edilebilir midir?", id: "Apakah pinjaman riba yang dinyatakan oleh pemerintah AS berdasarkan Undang-Undang Kearns secara hukum diperbolehkan?" }
summary:
  ar: "سؤال عن جواز القرض الربوي الذي أعلنته الحكومة الأمريكية بموجب قانون كيرز ⁦(26 مارس 2020)⁩ لدعم التعافي من آثار كوفيد-19. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(أبريل 2020)⁩ ببيان حكمه على ما فصّل الجواب."
  en: "A question about whether the interest-bearing loan announced by the US government under the CARES Act (26 March 2020) is permissible for businesses recovering from COVID-19. The Fiqh Council of North America (April 2020) answered with its ruling — as the answer details."
  ur: "امریکی حکومت کے کیئرز ایکٹ ⁦(26 مارچ 2020)⁩ کے سودی قرض کے جواز کا سوال۔ فقہ کونسل آف نارتھ امریکہ ⁦(اپریل 2020)⁩ نے اپنا حکم بیان کیا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Se planteó una pregunta sobre si el préstamo con intereses anunciado por el gobierno estadounidense en virtud de la Ley CARES (26 de marzo de 2020) es admisible para las empresas que se recuperan de la COVID-19. El Consejo de Jurisprudencia Islámica de Norteamérica (abril de 2020) respondió con su dictamen, tal como se detalla en la respuesta."
  fr: "La question portait sur la légalité du prêt à intérêt annoncé par le gouvernement américain dans le cadre de la loi CARES (26 mars 2020) pour les entreprises se remettant de la COVID-19. Le Conseil de jurisprudence islamique d'Amérique du Nord (avril 2020) a répondu par sa décision, comme le détaille la réponse."
  tr: "ABD hükümeti tarafından CAIRZ Yasası (26 Mart 2020) kapsamında COVID-19 etkilerinden iyileşmeyi desteklemek için ilan edilen tefeci kredinin izinliliği hakkında bir soru. Kuzey Amerika Hukuk Danışmanlığı Konseyi (Nisan 2020), ayrıntılı yanıt vererek kararını açıkladı."
  id: "Sebuah pertanyaan tentang diperbolehkannya pinjaman riba yang diumumkan oleh pemerintah AS berdasarkan Undang-Undang CAIRZ (26 Maret 2020) untuk mendukung pemulihan dari efek COVID-19. Dewan Yurisprudensi Amerika Utara (April 2020) menanggapi dengan menyatakan putusan mereka mengenai jawaban rinci tersebut."
