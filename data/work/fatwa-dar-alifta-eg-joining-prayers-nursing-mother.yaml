label: { ar: "حكم الجمع بين الصلوات للمرضع", en: "Joining prayers for a nursing mother", ur: "دودھ پلانے والی ماں کے لیے نمازوں میں جمع", es: "Uniendo nuestras oraciones por una madre lactante.", fr: "Je me joins aux prières pour une mère allaitante.", tr: "Emziren kadınlar için duaların birleştirilmesine ilişkin karar", id: "Putusan tentang doa gabungan untuk wanita menyusui" }
summary:
  ar: "سائلة مرضع سألت عن الجمع بين الصلوات لانشغالها بالرضاعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21841)⁩ أن الأصل أن تؤدى الصلوات المفروضة في أوقاتها المحددة فإذا كانت هناك أعذار تبيح تأخير الصلاة عن أول وقتها فلها حكمها على ما فصّل الجواب."
  en: "A nursing mother asked about joining prayers because she is occupied with breastfeeding. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21841) answered that the default is that obligatory prayers be performed at their fixed times; if excuses permit delaying a prayer past the start of its time they carry their ruling, as the answer details."
  ur: "دودھ پلانے والی ماں نے بچے کے مصروف رکھنے کی وجہ سے نمازوں میں جمع کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21841)⁩ نے جواب دیا کہ اصول یہ ہے کہ فرض نمازیں اپنے مقررہ اوقات میں ادا ہوں؛ اگر کوئی عذر نماز کو وقت کے آغاز سے مؤخر کرنے کی اجازت دے تو اس کا حکم الگ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una madre lactante preguntó sobre la posibilidad de unirse a las oraciones porque estaba ocupada amamantando. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21841) respondió que, por defecto, las oraciones obligatorias deben realizarse en sus horas fijas; si existen excusas que permitan retrasar una oración más allá de su hora, se aplicará la norma correspondiente, como se detalla en la respuesta."
  fr: "Une mère allaitante a demandé s'il était possible de participer aux prières collectives car elle était occupée à allaiter. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21841) a répondu que, par défaut, les prières obligatoires doivent être accomplies à leurs heures fixes; si des excuses permettent de retarder une prière après son heure, elles sont soumises à la règle, comme le précise la réponse."
  tr: "Emziren bir kadın, emzirmeye olan bağlılığı nedeniyle namazların birleştirilmesini sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21841), varsayılan kuralın zorunlu namazların belirlenen saatlerde kılılması gerektiğine yanıt verdi. Eğer namazın orijinal zamanından sonra ertelenmesine izin veren bahaneler varsa, karar cevabın açıkladığı şeye dayanır."
  id: "Seorang wanita menyusui bertanya tentang menggabungkan shalat karena keterlibatannya dengan menyusui. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21841) menjawab bahwa aturan default adalah shalat wajib harus dilakukan pada waktu yang ditentukan. Jika ada alasan yang memungkinkan menunda shalat melebihi waktu aslinya, keputusannya didasarkan pada penjelasan jawaban."
