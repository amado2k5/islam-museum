label: { ar: "من صور الإجارة المنتهية بالتمليك", en: "Forms of the lease ending in ownership", ur: "تملیک پر ختم ہونے والے اجارے کی صورتیں" }
summary:
  ar: "سائل سأل عن معاملة أسميت إجارة منتهية بالتمليك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21651)⁩ أن المعاملة المسئول عنها من قبيل البيع بالتقسيط لا الإجارة إذ العبرة بالمقاصد والمعاني لا الألفاظ والمباني على ما فصّل الجواب."
  en: "A questioner asked about an arrangement called a lease ending in ownership. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21651) answered that the arrangement asked about is in kind an instalment sale, not a lease — the consideration is purposes and meanings, not wordings and structures — as the answer details."
  ur: "ایک سائل نے ایسے معاملے کا حکم پوچھا جسے 'تملیک پر ختم ہونے والا اجارہ' کہا گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21651)⁩ نے جواب دیا کہ یہ دراصل اقساط کی بیع ہے نہ کہ اجارہ کیونکہ اعتبار مقاصد اور معانی کا ہے نہ کہ الفاظ کا — جیسا کہ جواب میں تفصیل ہے۔"
