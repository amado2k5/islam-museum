id: work/fatwa-dar-alifta-eg-lease-ending-in-ownership
class: work
kind: fatwa
label: { ar: "من صور الإجارة المنتهية بالتمليك", en: "Forms of the lease ending in ownership", ur: "تملیک پر ختم ہونے والے اجارے کی صورتیں", es: "Formas de arrendamiento que terminan en propiedad", fr: "Formes de bail aboutissant à l'acquisition", tr: "Mülkiyetle sona eren kira biçimleri", id: "Bentuk sewa yang berakhir dengan kepemilikan" }
summary:
  ar: "سائل سأل عن معاملة أسميت إجارة منتهية بالتمليك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21651)⁩ أن المعاملة المسئول عنها من قبيل البيع بالتقسيط لا الإجارة إذ العبرة بالمقاصد والمعاني لا الألفاظ والمباني على ما فصّل الجواب."
  en: "A questioner asked about an arrangement called a lease ending in ownership. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21651) answered that the arrangement asked about is in kind an instalment sale, not a lease — the consideration is purposes and meanings, not wordings and structures — as the answer details."
  ur: "ایک سائل نے ایسے معاملے کا حکم پوچھا جسے 'تملیک پر ختم ہونے والا اجارہ' کہا گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21651)⁩ نے جواب دیا کہ یہ دراصل اقساط کی بیع ہے نہ کہ اجارہ کیونکہ اعتبار مقاصد اور معانی کا ہے نہ کہ الفاظ کا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre un acuerdo denominado arrendamiento que culmina en la propiedad. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21651) respondió que el acuerdo en cuestión es, en especie, una venta a plazos, no un arrendamiento; la contraprestación reside en los propósitos y significados, no en la redacción ni en la estructura, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant un contrat de location avec transfert de propriété. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21651) a répondu que le contrat en question s'apparente davantage à une vente à tempérament qu'à une location; l'important réside dans les finalités et le sens du contrat, et non dans sa formulation, comme le précise la réponse."
  tr: "Bir soru soran kişi, mülkiyetle sona eren kira işlemi hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21651), sorumlu olan işlemin taksitli satış olduğunu, kira değil, çünkü odak noktasının kelimeler ve yapılar değil, hedefler ve anlamlar üzerinde olduğunu, cevabında açıklandığı gibi yanıtladı."
  id: "Seorang penanya menanyakan tentang transaksi yang disebut sewa yang berakhir dengan kepemilikan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21651) menjawab bahwa transaksi yang menjadi tanggung jawab adalah penjualan cicilan, bukan sewa, karena fokusnya pada tujuan dan makna, bukan kata-kata dan struktur, seperti yang dijelaskan dalam jawaban."
