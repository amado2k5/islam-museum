summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: تجوز الزيادة في الثمن المؤجل عن الثمن الحال ويجوز ذكر ثمن المبيع نقدًا وثمنه بالأقساط لمدد معلومة ولا يصح البيع إلا إذا جزم العاقدان بالنقد أو التأجيل فإن وقع مع التردد دون اتفاق جازم على ثمن واحد فهو غير جائز، وبيّن الأحكام على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on instalment sale: a higher deferred price than the cash price is permitted, and naming a cash price and instalment prices over known periods is allowed, but the sale is only valid if the parties settle definitively on cash or deferral — a sale concluded hesitating without one agreed price is impermissible — as it details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ اقساط کی بیع پر: مؤجل قیمت میں اضافہ جائز مگر معاہدہ نقد یا ادہار پر قطعی ہونا چاہیے؛ التواء میں بیع باطل۔"
  es: "Resolución de la sexta sesión de la IIFA (Jeddah, marzo de 1990) sobre la venta a plazos: se permite un precio aplazado superior al precio al contado, y se permite fijar un precio al contado y precios a plazos durante períodos conocidos, pero la venta solo es válida si las partes se ponen de acuerdo definitivamente sobre el pago al contado o el aplazamiento; una venta concluida con dudas y sin un precio acordado es inadmisible, como se detalla en la resolución."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur la vente à tempérament: un prix différé supérieur au prix au comptant est autorisé, et la désignation d'un prix au comptant et de prix échelonnés sur des périodes connues est permise, mais la vente n'est valable que si les parties s'entendent définitivement sur le paiement au comptant ou à terme — une vente conclue dans l'hésitation, sans prix convenu, est inadmissible — comme elle le précise."
