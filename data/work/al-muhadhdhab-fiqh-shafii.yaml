label: { ar: "المهذب في فقه الإمام الشافعي", en: "Al-Muhadhdhab fi Fiqh al-Imam al-Shafi'i" }
summary:
  ar: "موسوعة أبي إسحاق الشيرازي الفقهية التي كتبها بين ٤٥٥ و٤٦٩هـ، وصارت مع «التنبيه» من خمسة كتب مرجعية في المذهب الشافعي وعليها جهاز شرحي واسع منه «المجموع شرح المهذب» للنووي {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  en: "Abu Ishaq al-Shirazi's great fiqh compendium, written between 455/1063 and 469/1077; with al-Tanbih it became one of the five reference works of the Shafi'i school and drew a vast critical apparatus, including al-Nawawi's al-Majmu' sharh al-Muhadhdhab {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  ur: "ابو اسحاق شیرازی کا بڑا فقہی ذخیرہ جو 455-469ھ کے درمیان لکھا گیا؛ «التنبیہ» کے ساتھ شافعی مذہب کی پانچ مرجع کتب میں شمار ہوتا ہے اور اس پر وسیع شرحی ادبیات لکھی گئیں جن میں نووی کا «المجموع شرح المھذب» بھی ہے {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}۔"
