label: { ar: "حكم ترديد الأذان بعد انتهاء المؤذن منه", en: "Repeating the adhan after the muezzin finishes", ur: "مؤذن کے ختم کرنے کے بعد اذان دہرانا" }
summary:
  ar: "سائل سأل عن ترديد الأذان بعد انتهاء المؤذن منه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21656)⁩ أن الأصل متابعة المؤذن في ترديد الأذان أثناء الأذان طلبًا للأجر والثواب ويجوز لمن فاته ترديده حال الانتهاء على ما فصّل الجواب."
  en: "A questioner asked about repeating the adhan after the muezzin has finished it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21656) answered that the default is following the muezzin during the call seeking its reward; one who missed it may repeat it afterwards, as the answer details."
  ur: "ایک سائل نے مؤذن کے اذان ختم کرنے کے بعد اسے دہرانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21656)⁩ نے جواب دیا کہ اصول یہ ہے کہ اذان کے دوران مؤذن کے پیچھے دہرایا جائے؛ رہ جانے والا بعد میں دہرا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
