id: work/fatwa-dar-alifta-eg-repeating-adhan-after-it-ends
class: work
kind: fatwa
label: { ar: "حكم ترديد الأذان بعد انتهاء المؤذن منه", en: "Repeating the adhan after the muezzin finishes", ur: "مؤذن کے ختم کرنے کے بعد اذان دہرانا", es: "Repetir el adhan después de que el muecín termine.", fr: "Répéter l'adhan après que le muezzin ait fini", tr: "Müezzin ezan işlemi bitirdikten sonra ezan tekrar edilmesine ilişkin karar", id: "Putusan tentang pengulangan panggilan salat setelah muezzin selesai" }
summary:
  ar: "سائل سأل عن ترديد الأذان بعد انتهاء المؤذن منه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21656)⁩ أن الأصل متابعة المؤذن في ترديد الأذان أثناء الأذان طلبًا للأجر والثواب ويجوز لمن فاته ترديده حال الانتهاء على ما فصّل الجواب."
  en: "A questioner asked about repeating the adhan after the muezzin has finished it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21656) answered that the default is following the muezzin during the call seeking its reward; one who missed it may repeat it afterwards, as the answer details."
  ur: "ایک سائل نے مؤذن کے اذان ختم کرنے کے بعد اسے دہرانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21656)⁩ نے جواب دیا کہ اصول یہ ہے کہ اذان کے دوران مؤذن کے پیچھے دہرایا جائے؛ رہ جانے والا بعد میں دہرا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de repetir el adhan después de que el muecín lo haya terminado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21656) respondió que lo habitual es seguir al muecín durante la llamada para obtener su recompensa; quien se la haya perdido puede repetirla después, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la possibilité de répéter l'adhan après que le muezzin l'ait terminé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21656) a répondu que la pratique courante consiste à suivre l'appel du muezzin pendant toute la durée de celui-ci, en vue d'obtenir sa récompense; celui qui l'a manqué peut le répéter ultérieurement, comme le précise la réponse."
  tr: "Bir soru soran kişi, müezzin ezan bittikten sonra ezanın tekrarlanmasını sormuştur. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 21656), ezan sırasında müezzinin tarafından ezanın tekrarlanarak ödül ve merak arayışının kabul edilmesi olduğunu ve cevapta detaylandırıldığı üzere, ezanı kaçıranların cevabı bittikten sonra ezanı tekrarlamasının caiz olduğunu belirtmiştir."
  id: "Seorang penanya menanyakan tentang pengulangan ajakan salat setelah muezin selesai. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21656) menjawab bahwa default adalah mengikuti muezzin dalam mengulangi adhan selama panggilan salat untuk mencari ganjaran dan jasa, dan diperbolehkan bagi mereka yang melewatkannya untuk mengulanginya setelah selesai, seperti yang dijelaskan dalam jawabannya."
