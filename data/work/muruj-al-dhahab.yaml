summary:
  ar: "كتاب المسعودي الجامع في التاريخ والأدب والجغرافيا، بدأ فيه بأخبار الأمم والأعاجم والأرض وما فيها ثم أخبار الإسلام والخلفاء إلى عصره، وجمع فيه من رحلاته وأخبار الأمصار والملل ما جعله أشهر مصنفاته {cite:muruj-al-dhahab}. وختم المؤلف الكتاب بجامع التاريخ الثاني من الهجرة إلى جمادى الأولى سنة ست وثلاثين وثلثمائة وهو وقت فراغه منه، معتمداً في التاريخ على كتب الزيجات لا أصحاب الأخبار والسير، قال ومعولنا فيما ذكرنا على ما وجدنا في كتب الزيجات إذ كان أهل هذه الصناعة يراعون هذه الأوقات ويحصلون علمها على التحديد، والذي نقلناه من زيج أبي عبد الله محمد بن جابر البتاني وغيره من الزيجات، وجعل لكل خليفة مدته بالسنين والأشهر والأيام من أبي بكر إلى المطيع لله {cite:muruj-al-dhahab p. 731-736}، وأفرد في جامع تاريخه الثاني سجل من حج بالناس سنة بسنة من أول الإسلام إلى عصره، وقال في آخر أمراء حج بني أمية سنة إحدى وثلاثين ومائة هذا آخر ما حج بنو أمية {cite:muruj-al-dhahab p. 741-747}، وختمه المؤلف بقوله قد ذكرنا فيما سلف من هذا الكتاب أنواعاً من الأخبار وفنوناً من العلم من أخبار الأنبياء والملوك وسيرها والأمم وأخبارها وأخبار الأرض والبحار وما فيها من العجائب والآثار ولم نترك نوعاً من العلوم ولا فناً من الأخبار إلا أوردناه مفصلاً أو مجملاً أو أشرنا إليه، وتوعد من حرف شيئاً من معناه أو نسبه إلى غيره أو أسقط منه ذكره بغضب الله وسرعة نقمته، واعتذر عما عرض من سهو أو تصحيف بالأسفار المتواترة والحركة المتصلة تارة مشرقين وتارة مغربين، وقال لو كان لا يؤلف كتاباً إلا من حوى جميع العلوم إذن ما ألف أحد كتاباً {cite:muruj-al-dhahab p. 750-751}"
  en: "al-Mas'udi's great compendium of history, letters and geography — opening with the nations, the non-Arabs and the earth's wonders, then the Islamic realm and its caliphs to his own day; his most celebrated work {cite:muruj-al-dhahab}."
  es: "El gran compendio de historia, literatura y geografía de al-Mas'udi, que comienza con las naciones, los no árabes y las maravillas de la tierra, luego el reino islámico y sus califas hasta su propia época; su obra más célebre {cite:muruj-al-dhahab}."
  fr: "Le grand recueil d'histoire, de lettres et de géographie d'al-Mas'udi — s'ouvrant sur les nations, les non-Arabes et les merveilles de la terre, puis le royaume islamique et ses califes jusqu'à son époque; son œuvre la plus célèbre {cite:muruj-al-dhahab}."
  ur: "المسعودی کا تاریخ، خطوط اور جغرافیہ کا عظیم مجموعہ — اقوام عالم، غیر عربوں اور زمینی عجائبات، پھر اسلامی مملکت اور اس کے خلفاء سے اپنے دور تک؛ ان کا سب سے مشہور کام {حوالہ: مروج الذہاب}۔"
  tr: "El-Mes'udi'nin tarih, edebiyat ve coğrafya üzerine kapsamlı kitabı; burada uluslar, Arap olmayan kabileler, toprak ve onu oluşturan haberlerle başladı, ardından İslam ve halifeler üzerine kendi dönemine kadar olan haberler üzerine ve seyahatlerini, bölgesel haberleri ve mezhepleri toplayarak en ünlü eseri {atıf:muruj-al-dhahab} yer aldı. Yazar, kitabı 336 Hile yılında, yani o dönemde tamamladığı tarih tarihindeki evlilik kitaplarına dayanarak, tarihteki evlilik kitaplarına dayanarak, 336 Hicri yılında, Cumedül-Avval'a kadar olan ikinci kapsamlı tarihle bitirdi. Dedi ki, bizim bahsettiklerimize dayanmamız, evlilik kitaplarında da bulduğumuz şeydir; çünkü bu zanaattaki uzmanlar bu dönemin farkındaydı ve bilgileri tam olarak edindiler; biz bu bilgileri Ebu Abdullah Muhammed bin Cabir-el-Battaninin evliliğinden ve diğer evliliklerden aktardık ve her halifeye yıl, ay ve gün cinsinden görev süresini Ebu Bekir'den verdik Allah'a itaatkâr olanlara {atıf:Muruj-al-Dhahab s. 731-736} ve ikinci tarihsel koleksiyonunda İslam'ın başlangıcından kendi dönemine kadar her yıl Hac yapanların kaydını adadı; ayrıca Emevi hacının son yöneticileri olan yüz otuz birinci yılda, bu Emeviyelerin son Hac gerçekleştirdiği zamandır {atı:Muruj-al-Dhahab s. 741-747} dedi. Yazar şöyle sözlerle bitirdi: Bu kitabın önceki bölümlerinde peygamberler, krallar, onların yolculukları, ulusları ve haberleri, yeryüzü ve denizler ve içlerinde bulunanlarla ilgili çeşitli haber ve bilgilerden bahsettik. Mucizeler ve Gelenekler ve biz haberin herhangi bir bilgisini ya da sanatını genel olarak ayrıntılı olarak listelemeden ya da işaret etmeden bırakmadık. Anlamını çarpıtan, başka birine atfeden ya da bahsetmeyen herkesi Tanrı'nın gazabı ve hızlı cezasıyla tehdit etti. Mutawatir kitaplarında ve sürekli akımlarda—bazen Doğu, bazen Batı—herhangi bir hata veya çarpıtma için özür diledi ve şöyle dedi: Eğer tüm bilimleri içeren bir kitap derlenmiş olsaydı, kimse bir kitap yazamazdı {atıf:muruj-al-dhahab s. 750-751}"
  id: "Buku komprehensif Al-Mas'udi tentang sejarah, sastra, dan geografi, di mana ia memulai dengan berita tentang bangsa, suku non-Arab, tanah, dan apa yang terbentuknya, kemudian tentang Islam dan khalifah hingga zamannya, serta mengumpulkan perjalanan, berita regional, dan sekte-sektenya, menjadikannya karya paling terkenalnya {cite:muruj-al-dhahab}. Penulis mengakhiri buku ini dengan sejarah komprehensif kedua dari Hijrah hingga Jumada al-Awwal pada tahun 336 H, yang merupakan waktu ia menyelesaikannya, dengan mengandalkan buku-buku pernikahan dalam sejarah, bukan pada penulis laporan dan biografi. Ia berkata, dan ketergantungan kita pada apa yang telah kita sebutkan adalah apa yang kita temukan dalam buku pernikahan, karena para ahli dalam bidang ini sangat memahami masa-masa tersebut dan memperoleh pengetahuan mereka secara tepat, yang telah kita sampaikan dari pernikahan Abu Abdullah Muhammad ibn Jabir al-Battani dan pernikahan lainnya, serta memberikan setiap khalifah masa jabatannya dalam tahun, bulan, dan hari sejak Abu Bakr kepada yang taat kepada Allah {cite:muruj-al-dhahab hlm. 731-736}, dan ia mendedikasikan dalam koleksi sejarah keduanya catatan tentang mereka yang melaksanakan ibadah haji tahun demi tahun sejak awal Islam hingga zamannya, dan berkata tentang penguasa terakhir ziarah Umayyah pada tahun seratus tiga puluh satu, ini adalah terakhir kalinya Umayyah melaksanakan Haji {cite:muruj-al-dhahab hlm. 741-747}. Penulis menyimpulkan dengan mengatakan: Kami telah menyebutkan dalam bagian-bagian sebelumnya dari buku ini berbagai jenis berita dan pengetahuan yang berkaitan dengan para nabi, raja, perjalanan mereka, bangsa-bangsa dan laporan mereka, serta berita tentang bumi dan laut serta apa yang ada di dalamnya. Keajaiban dan Tradisi, dan kami tidak meninggalkan pengetahuan atau seni berita tanpa mencantumkannya secara rinci, secara umum, atau menunjukkannya. Dia mengancam siapa pun yang memutarbalikkan maknanya, mengaitkannya dengan orang lain, atau menghilangkan penyebutannya dengan murka dan hukuman cepat dari Tuhan. Dia meminta maaf atas kesalahan atau distorsi dalam buku mutawatir dan gerakan berkelanjutan—kadang Timur dan kadang Barat—dan berkata: Jika hanya satu yang menyusun buku yang memuat semua ilmu, maka tidak ada yang akan menulis buku {cite:muruj-al-dhahab hlm. 750-751}"
