summary:
  ar: "كتاب المسعودي الجامع في التاريخ والأدب والجغرافيا، بدأ فيه بأخبار الأمم والأعاجم والأرض وما فيها ثم أخبار الإسلام والخلفاء إلى عصره، وجمع فيه من رحلاته وأخبار الأمصار والملل ما جعله أشهر مصنفاته {cite:muruj-al-dhahab}.، وختم المؤلف الكتاب بجامع التاريخ الثاني من الهجرة إلى جمادى الأولى سنة ست وثلاثين وثلثمائة وهو وقت فراغه منه، معتمداً في التاريخ على كتب الزيجات لا أصحاب الأخبار والسير، قال ومعولنا فيما ذكرنا على ما وجدنا في كتب الزيجات إذ كان أهل هذه الصناعة يراعون هذه الأوقات ويحصلون علمها على التحديد، والذي نقلناه من زيج أبي عبد الله محمد بن جابر البتاني وغيره من الزيجات، وجعل لكل خليفة مدته بالسنين والأشهر والأيام من أبي بكر إلى المطيع لله {cite:muruj-al-dhahab p. 731-736}، وأفرد في جامع تاريخه الثاني سجل من حج بالناس سنة بسنة من أول الإسلام إلى عصره، وقال في آخر أمراء حج بني أمية سنة إحدى وثلاثين ومائة هذا آخر ما حج بنو أمية {cite:muruj-al-dhahab p. 741-747}، وختمه المؤلف بقوله قد ذكرنا فيما سلف من هذا الكتاب أنواعاً من الأخبار وفنوناً من العلم من أخبار الأنبياء والملوك وسيرها والأمم وأخبارها وأخبار الأرض والبحار وما فيها من العجائب والآثار ولم نترك نوعاً من العلوم ولا فناً من الأخبار إلا أوردناه مفصلاً أو مجملاً أو أشرنا إليه، وتوعد من حرف شيئاً من معناه أو نسبه إلى غيره أو أسقط منه ذكره بغضب الله وسرعة نقمته، واعتذر عما عرض من سهو أو تصحيف بالأسفار المتواترة والحركة المتصلة تارة مشرقين وتارة مغربين، وقال لو كان لا يؤلف كتاباً إلا من حوى جميع العلوم إذن ما ألف أحد كتاباً {cite:muruj-al-dhahab p. 750-751}"
  en: "al-Mas'udi's great compendium of history, letters and geography — opening with the nations, the non-Arabs and the earth's wonders, then the Islamic realm and its caliphs to his own day; his most celebrated work {cite:muruj-al-dhahab}."
