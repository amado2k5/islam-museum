id: work/fatwa-aliftaa-jo-fasted-twenty-eight-days-then-moved-to-a-country-celebrating-eid
class: work
kind: fatwa
label: { ar: "من صام ثمانية وعشرين يومًا ثم انتقل إلى بلد عيّد أهله", en: "Fasting twenty-eight days, then moving to a country celebrating Eid", ur: "اٹھائیس روزے رکھ کر ایسے ملک جانا جہاں عید ہو رہی ہو" }
summary:
  ar: "سؤال عن من صام ثمانية وعشرين يومًا ثم انتقل إلى بلد عيّد أهله، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يعيّد معهم، فإن كان مجموع ما صامه تسعة وعشرين فلا شيء عليه، وإن كان ثمانية وعشرين قضى يومًا. أجابت الدائرة بأن من صام في بلده ثم انتقل إلى بلد عيّد أهله فإنه يعيّد معهم. وقالت إن مجموع ما صامه إن كان تسعة وعشرين فلا شيء عليه، وإن كان ثمانية وعشرين وجب عليه قضاء يوم، لأن الشهر لا يكون ثمانية وعشرين يومًا."
  en: "A question about fasting twenty-eight days, then moving to a country celebrating Eid, in which Jordan's General Iftaa Department answered that he celebrates Eid with them, owing nothing if he fasted twenty-nine days in all and one make-up day if he fasted twenty-eight. The Department answered that someone who fasted in his country and then moved to a country whose people were celebrating Eid celebrates it with them. It said that if the total he fasted was twenty-nine days he owes nothing, but if it was twenty-eight he must make up one day, because a month is never twenty-eight days."
  ur: "اٹھائیس روزے رکھ کر ایسے ملک جانا جہاں عید ہو رہی ہو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ ان کے ساتھ عید منائے؛ اگر کل روزے انتیس ہوں تو اس پر کچھ نہیں، اور اٹھائیس ہوں تو ایک دن کی قضا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ جس نے اپنے ملک میں روزے رکھے پھر ایسے ملک گیا جہاں عید ہو رہی تھی، وہ ان کے ساتھ عید منائے۔ اس نے کہا کہ اگر اس کے کل روزے انتیس ہوں تو اس پر کچھ نہیں، اور اگر اٹھائیس ہوں تو ایک دن کی قضا واجب ہے، کیونکہ مہینہ اٹھائیس دن کا نہیں ہوتا۔"
