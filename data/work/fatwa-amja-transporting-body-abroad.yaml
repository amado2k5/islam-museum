id: work/fatwa-amja-transporting-body-abroad
class: work
kind: fatwa
label: { ar: "نقل جنازة الميت إلى بلده", en: "Transporting a body home from America", ur: "لاشہ کو وطن منتقل کرنا", es: "Traslado de un cuerpo a casa desde Estados Unidos", fr: "Rapatriement d'un corps depuis l'Amérique", tr: "Ölen kişinin cenazesinin ülkesine taşınması", id: "Mengangkut pemakaman almarhum ke negaranya" }
summary:
  ar: "سأل سائل عن حكم نقل جنازة ميت من أمريكا إلى بلد إسلامي وإرسال الجثمان يتطلب إخراج الدم ووضع مادة حافظة وهل يكون واجبًا إن أوصى به الميت. أجاب د. حاتم الحاج ⁦(فتوى رقم 1356 بتاريخ 26 فبراير 2006)⁩ أنه لا يجب نقل الموتى إلى بلادهم إن ماتوا خارجها بل ولا يستحب سيما مع ما ذكر من تصرف بالجثة، ويرى إنفاذ وصية الميت ما لم توقع الورثة أو المسلمين في حرج أو مشقة."
  en: "A questioner asked about transporting a deceased's body from America to a Muslim country — shipping requires draining the blood and embalming — and whether it is obligatory if the deceased willed it. Dr. Hatim al-Hajj (fatwa no. 1356, 26 February 2006) answered that carrying the dead home is not required when they die abroad, nor even recommended, especially with the treatment of the body described; but he holds the deceased's wish should be carried out so long as it does not put the heirs or Muslims into hardship or difficulty."
  ur: "ایک سائل نے لاشہ وطن بھیجنے کا حکم پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 1356، 26 فروری 2006)⁩ کے مطابق نقل واجب یا مستحب نہیں — مگر وصیت ہو تو مشقت نہ ہو ادا کی جائے۔"
  es: "Un consultante preguntó acerca del traslado del cuerpo de una persona fallecida desde Estados Unidos a un país musulmán —el envío requiere drenar la sangre y embalsamar el cuerpo— y si es obligatorio si el difunto así lo deseaba. El Dr. Hatim al-Hajj (fatwa n.° 1356, 26 de febrero de 2006) respondió que no es obligatorio, ni siquiera recomendable, trasladar a los difuntos a su país de origen cuando fallecen en el extranjero, especialmente con el tratamiento del cuerpo descrito; pero sostiene que debe cumplirse el deseo del difunto siempre que no cause dificultades ni perjuicios a los herederos o a los musulmanes."
  fr: "Une personne a posé une question concernant le transport du corps d'une personne décédée des États-Unis vers un pays musulman – ce transport nécessitant la saignée et l'embaumement – et a demandé si ce transport était obligatoire si le défunt l'avait souhaité. Le Dr Hatim al-Hajj (fatwa n° 1356, 26 février 2006) a répondu que le rapatriement du corps n'est ni obligatoire ni même recommandé lorsqu'il survient à l'étranger, notamment compte tenu du traitement décrit; il estime cependant que la volonté du défunt doit être respectée tant que cela n'entraîne pas de difficultés pour les héritiers ou les musulmans."
  tr: "Bir soru soran kişiye, ölen kişinin cenazesinin Amerika'dan İslam ülkesine nakledilmesi ve cesedin kan çekimi ile koruyucu kullanımı gerektirmesi ve eğer cenaze bırakırsa zorunlu olup olmadığı hakkında sorular soruldu. Dr. Hatim Al-Hajj (26 Şubat 2006 tarihli 1356 sayılı Fetva) cevabında bulundu; ölen kişi ülke dışında ölürse ülkelerine nakledilmesinin zorunlu olmadığını ve özellikle cesedin ele alınması göz önüne alındığında önerilmediğini belirtti. Ölen kişinin vasiyetinin, varisler veya Müslümanlar zorluk veya zorluk yaratmadıkça uygulanması gerektiğine inanıyor."
  id: "Seorang penanya ditanya tentang keputusan pemindahan pemakaman almarhum dari Amerika ke negara Islam dan pengiriman jenazah memerlukan pengambilan darah serta penggunaan pengawet, serta apakah itu wajib jika almarhum mewariskannya. Dr. Hatim Al-Hajj menjawab (Fatwa No. 1356 tertanggal 26 Februari 2006) bahwa tidak wajib memindahkan almarhum ke negaranya jika meninggal di luar negara tersebut, dan tidak disarankan, terutama mengingat penanganan jenayat. Ia percaya wasiat almarhum harus ditegakkan kecuali ahli waris atau Muslim menyebabkan kesulitan atau kesulitan."
