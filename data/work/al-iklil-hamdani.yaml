label: { ar: "الإكليل في أنساب حمير وأيام ملوكها", en: "al-Iklil fi Ansab Himyar wa-Ayyam Mulukiha", ur: "الاقلیل و انساب حمیار و ایام ملوکھا", tr: "Eşeklerin soyağacındaki çelenk ve krallarının günleri", id: "Karangan bunga dalam silsilah keledai dan hari-hari rajanya" }
summary:
  ar: "لأبي محمد الحسن بن أحمد بن يعقوب الهمداني اليمني؛ كتاب كبير عظيم الفائدة يتم في عشر مجلدات ويشتمل على عشرة فنون، وفي أثنائه جمل من حساب القرانات وأوقاتها ونبذ من علم الطبيعة وأصول أحكام النجوم وآراء الأوائل في القدم والأدوار وتناسل الناس ومقادير أعمارهم {cite:kashf-zunun-furqan p. 556}."
  en: "Al-Hamdani's Iklil — the ten-volume crown of Himyarite genealogy and regnal lore, interleaved with conjunction-reckoning, natural philosophy and the ancients' views on world ages {cite:kashf-zunun-furqan p. 556}."
  es: "El Iklil de Al-Hamdani: la obra cumbre de diez volúmenes sobre la genealogía himyarita y la tradición monárquica, intercalada con cálculos de conjunción, filosofía natural y las visiones de los antiguos sobre las edades del mundo {cite:kashf-zunun-furqan p. 556}."
  fr: "L'Iklil d'Al-Hamdani — la couronne en dix volumes de la généalogie himyarite et des connaissances royales, entremêlée de calculs conjonctionnels, de philosophie naturelle et des points de vue des anciens sur les âges du monde {cite:kashf-zunun-furqan p. 556}."
  ur: "الحمدانی کا اقلیل - ہمیاری نسب اور رجائیت کا دس جلدوں پر مشتمل تاج، جو مجموعۂ حساب، فطری فلسفہ، اور عالمی زمانوں کے بارے میں قدیموں کے نظریات کے ساتھ جڑا ہوا ہے۔ 556}۔"
  tr: "Ebu Muhammed el-Hasan ibn Ahmed ibn Ya'qub al-Hamdani el-Yamani tarafından; on cildi kapsayan ve on disiplini kapsayan büyük, son derece faydalı bir kitap. Kur'an'ın ve zamanlarının hesaplanması, doğa bilimlerinden bir kesit, yıldızların hüküm verme ilkeleri, erken alimlerin çağlar, üreme ve yaşlarının ölçümleri hakkındaki görüşleri içerir {atıf:kashf-zunun-furqan, s. 556}."
  id: "Oleh Abu Muhammad al-Hasan ibn Ahmad ibn Ya'qub al-Hamdani al-Yamani; sebuah buku besar yang sangat bermanfaat yang terdiri dari sepuluh jilid dan berisi sepuluh disiplin. Buku ini berisi kalimat-kalimat tentang perhitungan Al-Qur'an dan zamannya, cuplikan ilmu alam, prinsip-prinsip aturan bintang, pendapat para ulama awal tentang zaman, reproduksi, dan pengukuran usia mereka {cite:kashf-zunun-furqan, hlm. 556}."
