label: { ar: "قرار مجمع الفقه الإسلامي الدولي 126 (13/8) بشأن حقوق الإنسان في الإسلام", en: "IIFA resolution 126 (13/8) on human rights in Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 126 (13/8): اسلام میں انسانی حقوق", es: "Resolución 126 (13/8) de la IIFA sobre los derechos humanos en el Islam", fr: "Résolution 126 (13/8) de l'IIFA sur les droits de l'homme en islam", tr: "Uluslararası İslam Fiqh Akademisi Kararı 126 (13/8) İslam'da İnsan Hakları Hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 126 (13/8) tentang Hak Asasi Manusia dalam Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩. يستند إلى أن الكرامة الإنسانية — وهي في رؤيته أساس الحقوق والواجبات — وهبها الله للإنسان، وأن على الإنسان حقوقًا لربه ولنفسه ولأبناء جنسه ولمكونات بيئته، وأن نظرة شمولية محايدة للتشريع الإسلامي تجزم بصلاحيته للمجتمع البشري وانسجامه مع الفطرة. وعرّف حقوق الإنسان في الإسلام بأنها المزايا الناشئة عن التكريم الإلهي الذي وهبه الله للإنسان وألزم الجميع باحترامها طبقًا للضوابط والشروط الشرعية، مؤكدًا إجماع الأمة على صلاحية الشريعة لكل زمان ومكان وحق الشعوب في خصائصها الثقافية. ثم ساق بيان حقوق الإنسان في الإسلام مفصلًا ⁦(الحق في الحياة والكرامة والحرية والمساواة والعدل وما يتبعها)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001). It grounds human dignity — in its view the basis of rights and duties — as God's gift to the human being, who owes rights to his Lord, himself, his kind and his environment, and holds that a comprehensive, neutral look at Islamic legislation proves it fit for human society and consonant with nature. It defined human rights in Islam as the benefits arising from the divine honouring granted to the human being, binding on all to respect under the law's controls and conditions; affirming the umma's consensus on the sharia's validity for every time and place and peoples' right to their cultural distinctives. It then issued a detailed charter of human rights in Islam — life, dignity, freedom, equality, justice and what follows from them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں۔ بنیاد: انسانی وقار — اس کے نزدیک حقوق و فرائض کی اساس — اللہ کی عطا کردہ ہے، اور انسان کے ذمے اپنے رب، اپنی ذات، اپنی جنس اور اپنے ماحول کے حقوق ہیں؛ اسلامی تشریع پر غیر جانبدارانہ جامع نظر اس کے نزدیک اس کے انسانی معاشرے کے لیے صلاحیت اور فطرت سے ہم آہنگی کی گواہی دیتی ہے۔ اس نے اسلام میں انسانی حقوق کی تعریف کی: وہ فوائد جو الٰہی تکریم سے نکلتے ہیں اور شرعی ضوابط و شرائط کے تحت سب پر ان کا احترام لازم ہے؛ امت کے اجماع کی تصدیق کہ شریعت ہر زمان و مکان کے لیے صالح ہے اور اقوام کے ثقافتی امتیاز کا حق۔ پھر اس نے اسلام میں انسانی حقوق کا تفصیلی منشور پیش کیا — زندگی، وقار، آزادی، مساوات، عدل اور ان کے تابع۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 13.ª sesión celebrada en Kuwait (del 7 al 12 de Shawwal de 1422, del 22 al 27 de diciembre de 2001). Esta resolución fundamenta la dignidad humana —a su juicio, la base de los derechos y deberes— como un don divino para el ser humano, quien tiene derechos para con su Señor, consigo mismo, con su especie y con su entorno. Sostiene que una revisión exhaustiva y neutral de la legislación islámica demuestra su idoneidad para la sociedad humana y su consonancia con la naturaleza. Definió los derechos humanos en el Islam como los beneficios derivados del honor divino otorgado al ser humano, que todos deben respetar bajo los controles y condiciones de la ley; afirmando el consenso de la umma sobre la validez de la sharia para todo tiempo y lugar, y el derecho de los pueblos a sus identidades culturales. Posteriormente, emitió una carta detallada de los derechos humanos en el Islam: vida, dignidad, libertad, igualdad, justicia y sus consecuencias."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 13e session au Koweït (7-12 Shawwal 1422, 22-27 décembre 2001). Elle fonde la dignité humaine – qu'elle considère comme le fondement des droits et des devoirs – sur le fait que l'être humain est un don de Dieu. Ce dernier a des droits envers son Seigneur, envers lui-même, envers ses semblables et envers son environnement. L'Académie affirme qu'une analyse globale et objective de la législation islamique démontre son adéquation à la société humaine et sa conformité à la nature. Elle définit les droits de l'homme en islam comme les bienfaits découlant de la considération divine accordée à l'être humain, droits que chacun est tenu de respecter dans le cadre légal. Elle réaffirme le consensus de la communauté musulmane (umma) sur la validité de la charia en tout temps et en tout lieu, ainsi que le droit des peuples à leurs spécificités culturelles. Elle publie ensuite une charte détaillée des droits de l'homme en islam: la vie, la dignité, la liberté, l'égalité, la justice et leurs conséquences."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin on üçüncü oturumunda Kuveyt'teki toplu kararı (7–12 Şevval 1422H, 22–27 Aralık 2001). Bu karar, insan onurunun—onun görüşüne göre hak ve görevlerin temeli olan—Allah'ın insana verdiği ve insanların Rablerine, kendilerine, türlerine ve çevrelerinin bileşenlerine hakları olduğu, kapsamlı ve tarafsız bir İslami yasa anlayışının insan toplumuna uygunluğunu ve doğuştan gelen doğayla uyumunu teyit ettiğine dayanır. İslam'da insan haklarını, Tanrı'nın insana bahşettiği ilahi onurdan doğan erdemler olarak tanımlamış, herkesin Şeriat kuralları ve koşullarına göre saygı göstermesini zorunlu kılmış, ulusun her zaman ve yerde Şeriat'ın geçerliliği ve halkların kültürel özelliklerine sahip hakları konusunda uzlaşmasını teyit etmiştir. Daha sonra İslam'da insan hakları (yaşam, onur, özgürlük, eşitlik, adalet ve bunlarla ilgili konular) hakkında ayrıntılı bir açıklama sundu."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ketiga belas di Kuwait (7–12 Shawwal 1422H, 22–27 Desember 2001). Keputusan ini didasarkan pada fakta bahwa martabat manusia—yang menurutnya adalah dasar hak dan kewajiban—dianugerahkan oleh Allah kepada manusia, dan bahwa manusia memiliki hak kepada Tuhannya, kepada diri mereka sendiri, kepada bangsanya, dan kepada komponen lingkungan mereka, serta bahwa pandangan yang komprehensif dan netral tentang legislasi Islam menegaskan kesesuaiannya bagi masyarakat manusia dan harmoninya dengan sifat bawaan. Ia mendefinisikan hak asasi manusia dalam Islam sebagai kebajikan yang muncul dari kehormatan ilahi yang diberikan Allah kepada manusia, mewajibkan setiap orang untuk menghormatinya sesuai dengan aturan dan ketentuan Syariah, menegaskan konsensus bangsa tentang keabsahan Syariah untuk semua waktu dan tempat serta hak bangsa atas karakteristik budaya mereka. Ia kemudian menyampaikan pernyataan rinci tentang hak asasi manusia dalam Islam (hak atas hidup, martabat, kebebasan, kesetaraan, keadilan, dan hal-hal terkait)."
