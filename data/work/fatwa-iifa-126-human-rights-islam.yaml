label: { ar: "قرار مجمع الفقه الإسلامي الدولي 126 (13/8) بشأن حقوق الإنسان في الإسلام", en: "IIFA resolution 126 (13/8) on human rights in Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 126 (13/8): اسلام میں انسانی حقوق" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩. يستند إلى أن الكرامة الإنسانية — وهي في رؤيته أساس الحقوق والواجبات — وهبها الله للإنسان، وأن على الإنسان حقوقًا لربه ولنفسه ولأبناء جنسه ولمكونات بيئته، وأن نظرة شمولية محايدة للتشريع الإسلامي تجزم بصلاحيته للمجتمع البشري وانسجامه مع الفطرة. وعرّف حقوق الإنسان في الإسلام بأنها المزايا الناشئة عن التكريم الإلهي الذي وهبه الله للإنسان وألزم الجميع باحترامها طبقًا للضوابط والشروط الشرعية، مؤكدًا إجماع الأمة على صلاحية الشريعة لكل زمان ومكان وحق الشعوب في خصائصها الثقافية. ثم ساق بيان حقوق الإنسان في الإسلام مفصلًا ⁦(الحق في الحياة والكرامة والحرية والمساواة والعدل وما يتبعها)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001). It grounds human dignity — in its view the basis of rights and duties — as God's gift to the human being, who owes rights to his Lord, himself, his kind and his environment, and holds that a comprehensive, neutral look at Islamic legislation proves it fit for human society and consonant with nature. It defined human rights in Islam as the benefits arising from the divine honouring granted to the human being, binding on all to respect under the law's controls and conditions; affirming the umma's consensus on the sharia's validity for every time and place and peoples' right to their cultural distinctives. It then issued a detailed charter of human rights in Islam — life, dignity, freedom, equality, justice and what follows from them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں۔ بنیاد: انسانی وقار — اس کے نزدیک حقوق و فرائض کی اساس — اللہ کی عطا کردہ ہے، اور انسان کے ذمے اپنے رب، اپنی ذات، اپنی جنس اور اپنے ماحول کے حقوق ہیں؛ اسلامی تشریع پر غیر جانبدارانہ جامع نظر اس کے نزدیک اس کے انسانی معاشرے کے لیے صلاحیت اور فطرت سے ہم آہنگی کی گواہی دیتی ہے۔ اس نے اسلام میں انسانی حقوق کی تعریف کی: وہ فوائد جو الٰہی تکریم سے نکلتے ہیں اور شرعی ضوابط و شرائط کے تحت سب پر ان کا احترام لازم ہے؛ امت کے اجماع کی تصدیق کہ شریعت ہر زمان و مکان کے لیے صالح ہے اور اقوام کے ثقافتی امتیاز کا حق۔ پھر اس نے اسلام میں انسانی حقوق کا تفصیلی منشور پیش کیا — زندگی، وقار، آزادی، مساوات، عدل اور ان کے تابع۔"
