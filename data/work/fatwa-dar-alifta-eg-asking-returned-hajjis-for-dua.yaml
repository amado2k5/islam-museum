id: work/fatwa-dar-alifta-eg-asking-returned-hajjis-for-dua
class: work
kind: fatwa
label: { ar: "حكم طلب دعاء العائدين من الحج وتركهم صلاة الجماعة في المسجد", en: "Seeking the returning pilgrims' supplication — and their missing congregational prayer", ur: "حج سے لوٹنے والوں سے دعا مانگنا اور ان کا جماعت چھوڑنا", es: "Buscando la súplica de los peregrinos que regresan, y su oración congregacional ausente.", fr: "À la recherche des supplications des pèlerins de retour — et de leur prière collective manquante" }
summary:
  ar: "سائل سأل عن زيارة العائدين من أداء فريضة الحج والتماس الدعاء منهم والتبرك به وعن تركهم صلاة الجماعة في المسجد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20835)⁩ أن زيارة العائدين والتماس دعائهم والتبرك به أمر مستحب على ألا ينشغل القادمون عن صلاة الجماعة في المسجد على ما فصّل الجواب."
  en: "A questioner asked about visiting those returned from the Hajj, seeking their supplication and blessing — and their leaving the congregational mosque prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20835) answered that visiting them and seeking their prayers is recommended, provided the arrivals are not distracted from congregational prayer — as the answer details."
  ur: "ایک سائل نے حج سے لوٹنے والوں کی زیارت اور ان سے دعا لینے اور تبرک پانے کا حکم پوچھا اور ان کے مسجد کی جماعت چھوڑنے کا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20835)⁩ نے جواب دیا کہ زیارت اور دعا مانگنا مستحب ہے بشرطیکہ آنے والے جماعت سے غافل نہ ہوں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de visitar a quienes regresan del Hajj, pedirles su intercesión y bendición, y sobre su posible salida de la oración congregacional en la mezquita. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20835) respondió que se recomienda visitarlos y pedirles sus oraciones, siempre y cuando no se distraigan de la oración congregacional, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était conseillé de rendre visite aux pèlerins de retour du Hajj, de solliciter leurs prières et leur bénédiction, et de prendre en compte leur absence pendant la prière collective à la mosquée. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20835) a répondu que ces visites et la sollicitation de leurs prières étaient recommandées, à condition que leur présence ne perturbe pas la prière collective, comme le précise la réponse."
