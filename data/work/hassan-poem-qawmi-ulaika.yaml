summary:
  ar: "قصيدة على روي الميم لحسان بن ثابت تروي تاريخ الأنصار: ملوكاً في أرضهم، ثم نزولهم يثرب وفتحهم حصون اليهود في النخيل، ثم استقبالهم النبي وقتالهم عنه؛ أنشد ابن هشام بعض أبياتها عن أبي زيد الأنصاري بروايات مغايرة، وتنتهي عندها في طبعة 1936 أجزاء السيرة الثمانية عشر الأولى."
  en: "A mim-rhymed poem by Hassan ibn Thabit telling the Ansar's story: kings in their own land, their settlement at Yathrib and the conquest of the Jewish forts among the palms, then their welcome of the Prophet and their fighting for him; Ibn Hisham gives variant readings from Abu Zayd al-Ansari, and the 1936 editors mark here the end of the sira's eighteenth traditional part."
