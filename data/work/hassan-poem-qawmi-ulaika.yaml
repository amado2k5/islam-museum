label: { ar: "قصيدة حسان «قومي أولئك إن تسألي كرام»", en: "Hassan ibn Thabit's poem 'Those are my people, if you ask, noble'", es: "El poema de Hassan ibn Thabit, 'Esa es mi gente, si me lo preguntas, noble'.", fr: "Le poème d'Hassan ibn Thabit « Ce sont les miens, si vous le demandez, nobles »", ur: "حسان بن ثابت کی نظم 'وہ میرے لوگ ہیں اگر پوچھو تو شریف'", tr: "Hassan'ın şiiri \"Ayağa kalk, onur istersen onlar bunlardır\"", id: "Puisi Hassan \"Bangkitlah, itulah yang kamu minta martabat\"" }
summary:
  ar: "قصيدة على روي الميم لحسان بن ثابت تروي تاريخ الأنصار: ملوكاً في أرضهم، ثم نزولهم يثرب وفتحهم حصون اليهود في النخيل، ثم استقبالهم النبي وقتالهم عنه؛ أنشد ابن هشام بعض أبياتها عن أبي زيد الأنصاري بروايات مغايرة، وتنتهي عندها في طبعة 1936 أجزاء السيرة الثمانية عشر الأولى."
  en: "A mim-rhymed poem by Hassan ibn Thabit telling the Ansar's story: kings in their own land, their settlement at Yathrib and the conquest of the Jewish forts among the palms, then their welcome of the Prophet and their fighting for him; Ibn Hisham gives variant readings from Abu Zayd al-Ansari, and the 1936 editors mark here the end of the sira's eighteenth traditional part."
  es: "Un poema con rima mímica de Hassan ibn Thabit que narra la historia de los Ansar: reyes en su propia tierra, su asentamiento en Yathrib y la conquista de los fuertes judíos entre las palmeras, luego su bienvenida al Profeta y su lucha por él; Ibn Hisham ofrece variantes textuales de Abu Zayd al-Ansari, y los editores de 1936 marcan aquí el final de la decimoctava parte tradicional de la sira."
  fr: "Un poème en rimes mim de Hassan ibn Thabit racontant l'histoire des Ansar: les rois sur leur propre terre, leur installation à Yathrib et la conquête des forts juifs parmi les palmiers, puis leur accueil du Prophète et leur combat pour lui; Ibn Hisham donne des lectures variantes d'Abu Zayd al-Ansari, et les éditeurs de 1936 marquent ici la fin de la dix-huitième partie traditionnelle de la sira."
  ur: "حسن بن ثابت کی ایک نظم جس میں انصار کی کہانی بیان کی گئی ہے: بادشاہ اپنی سرزمین میں، یثرب میں ان کی آباد کاری اور ہتھیلیوں کے درمیان یہودی قلعوں کی فتح، پھر پیغمبر کا استقبال اور اس کے لیے ان کی لڑائی؛ ابن ہشام نے ابو زید الانصاری سے مختلف ریڈنگز دی ہیں، اور 1936 کے ایڈیٹرز نے یہاں سیرت کے اٹھارویں روایتی حصے کے اختتام کو نشان زد کیا ہے۔"
  tr: "Hasan ibn Tebit'in Meem tarafından anlattığı bir şiir; Ensar'ın tarihini anlatır: topraklarındaki krallar, sonra Yatrib'e gelişleri ve palmiye ağaçlarındaki Yahudi kalelerinin fethedilmesi, ardından Peygamber'in onun adına kabul edilmesi ve savaşı; İbn Hişam, Ebu Zayd el-Ansari'den bazı ayetleri farklı anlatımlarla okudu ve biyografinin ilk on sekiz bölümü 1936 baskısıyla sona erdi."
  id: "Sebuah puisi yang diceritakan oleh Meem oleh Hassan ibn Thabit yang menceritakan sejarah Ansar: raja-raja di tanah mereka, kemudian kedatangan mereka di Yathrib dan penaklukan benteng-benteng Yahudi di pohon palem, kemudian penerimaan dan pertempuran Nabi atas namanya; Ibn Hisham membacakan beberapa ayat dari Abu Zayd al-Ansari dengan berbagai riwayat, dan delapan belas bagian pertama biografi diakhiri dengan edisi tahun 1936."
