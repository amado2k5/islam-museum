summary:
  ar: "كتاب بالإنجليزية لديميتري غوتاس عن حركة الترجمة من اليونانية إلى العربية في بغداد والمجتمع العباسي المبكر، صدر عن دار روتليدج سنة 1998، وتُرجم إلى العربية سنة 2003 وإلى الفرنسية سنة 2005."
  en: "An English book by Dimitri Gutas on the Graeco-Arabic translation movement in Baghdad and early ʿAbbāsid society, published by Routledge in 1998; translated into Arabic in 2003 and French in 2005."
  ur: "دیمتری گوتاس کی انگریزی کتاب جو بغداد میں یونانی سے عربی ترجمے کی تحریک اور ابتدائی عباسی معاشرے پر ہے؛ روٹلج سے 1998ء میں شائع ہوئی، 2003ء میں عربی اور 2005ء میں فرانسیسی میں ترجمہ ہوئی۔"
  fr: "Greek Thought, Arabic Culture de Dimitri Gutas étudie le mouvement de traduction gréco-arabe à Bagdad et la société abbasside primitive, du IIe au IVe siècle de l'hégire (VIIIe–Xe siècle). Selon la présentation de l'éditeur, du milieu du VIIIe au Xe siècle, presque tous les livres grecs profanes non littéraires et non historiques, sur l'astrologie, l'alchimie, la physique, la botanique ou la médecine, furent traduits en arabe."
  es: "Greek Thought, Arabic Culture, de Dimitri Gutas, estudia el movimiento de traducción grecoárabe en Bagdad y la primera sociedad abasí, de los siglos II al IV de la hégira (VIII al X d. C.). Según la presentación de la editorial, entre mediados del siglo VIII y el siglo X se tradujeron al árabe casi todos los libros griegos seculares no literarios ni históricos, sobre astrología, alquimia, física, botánica o medicina."
  tr: "Greek Thought, Arabic Culture, Dimitri Gutas'ın hicrî II.–IV. (milâdî VIII.–X.) yüzyıllarda Bağdat'taki Yunancadan Arapçaya tercüme hareketini ve erken Abbâsî toplumunu inceleyen kitabıdır. Yayıncının tanıtımına göre milâdî VIII. yüzyılın ortasından X. yüzyıla kadar astroloji, simya, fizik, botanik ve tıp gibi konulardaki edebî ve tarihî olmayan dünyevî Yunanca kitapların neredeyse tamamı Arapçaya çevrildi."
  id: "Greek Thought, Arabic Culture karya Dimitri Gutas mengkaji gerakan penerjemahan Yunani-Arab di Bagdad dan masyarakat Abbasiyah awal, dari abad kedua hingga keempat Hijriah (abad kedelapan hingga kesepuluh Masehi). Menurut deskripsi penerbit, sejak pertengahan abad kedelapan hingga abad kesepuluh Masehi hampir semua buku Yunani sekuler non-sastra dan non-sejarah, tentang astrologi, alkimia, fisika, botani, dan kedokteran, diterjemahkan ke dalam bahasa Arab."
