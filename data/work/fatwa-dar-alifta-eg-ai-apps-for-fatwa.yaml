label: { ar: "حكم استخدام تطبيقات الذكاء الاصطناعي في الاستفتاء", en: "Using AI applications to ask for a fatwa", ur: "فتویٰ پوچھنے کے لیے اے آئی ایپلی کیشنز کا استعمال", es: "Utilizar aplicaciones de IA para solicitar una fatwa", fr: "Utilisation d'applications d'IA pour demander une fatwa", tr: "Anketlerde Yapay Zeka Uygulamalarının Kullanımı Hakkında Karar", id: "Putusan tentang Penggunaan Aplikasi Kecerdasan Buatan dalam Survei" }
summary:
  ar: "سائل سأل عن الاعتماد على تطبيقات الذكاء الاصطناعي في الحصول على الفتوى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22158)⁩ أنه لا يجوز شرعًا الاعتماد عليها في الفتوى على الرغم من التقدم التقني فيها، وبيّن الجواب وجه ذلك من ضرورة المفتي المؤهل وما يتطلبه إصدار الفتوى."
  en: "A questioner asked about relying on AI applications for obtaining a fatwa. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22158) answered that it is impermissible to rely on them for a fatwa despite their technical advance; the answer sets out why — the need for a qualified mufti and what issuing a fatwa requires."
  ur: "ایک سائل نے فتویٰ حاصل کرنے کے لیے اے آئی ایپلی کیشنز پر انحصار کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22158)⁩ نے جواب دیا کہ ان کی تکنیکی ترقی کے باوجود فتویٰ کے لیے ان پر انحصار شرعاً جائز نہیں؛ جواب میں وجہ بیان ہوئی — اہل مفتی کی ضرورت اور فتویٰ دینے کے تقاضے۔"
  es: "Un interlocutor preguntó sobre la conveniencia de utilizar aplicaciones de inteligencia artificial para obtener una fatwa. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22158) respondió que no es permisible recurrir a ellas para obtener una fatwa, a pesar de sus avances técnicos. La respuesta explica los motivos: la necesidad de un muftí cualificado y los requisitos para emitir una fatwa."
  fr: "Un internaute a posé une question concernant l'utilisation d'applications d'intelligence artificielle pour obtenir une fatwa. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22158) a répondu qu'il est inadmissible de s'y fier malgré leurs avancées technologiques; la réponse explique pourquoi: la nécessité d'un mufti qualifié et les exigences liées à l'émission d'une fatwa."
  tr: "Bir soru soran kişi, fetva elde etmek için yapay zeka uygulamalarına güvenilip güvenilmediğini sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22158), teknolojik gelişmelere rağmen İslam hukukuna göre fetvalar için fetvalara güvenilmesinin mümkün olmadığını yanıtladı. Cevap, bunun nedenini nitelikli bir müftünün gerekliliği ve fetva vermek için gereklilik olduğunu açıkladı."
  id: "Seorang penanya bertanya tentang mengandalkan aplikasi kecerdasan buatan untuk memperoleh fatwa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22158) menjawab bahwa tidak diperbolehkan mengandalkan fatwa tersebut sesuai hukum Islam meskipun ada kemajuan teknologi. Jawaban tersebut menjelaskan alasan utamanya adalah perlunya mufti yang berkualifikasi dan apa yang diperlukan untuk mengeluarkan fatwa."
