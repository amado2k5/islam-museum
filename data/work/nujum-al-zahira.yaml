summary:
  ar: "تاريخ ملوك مصر والقاهرة لابن تغري بردي؛ من أمهات تواريخ الدولة الإسلامية ويكثر فيه ذكر كتب الخلفاء والملوك إلى ولاتهم وعمالهم وسلاطينهم."
  en: "Ibn Taghribirdi's history of the kings of Egypt and Cairo; a mother-source of Islamic dynastic history dense with caliphal and royal letters to governors and sultans."
  es: "La Historia de los Reyes de Egipto y El Cairo de Ibn Taghribirdi; una fuente fundamental de la historia dinástica islámica, repleta de cartas califales y reales dirigidas a gobernadores y sultanes."
  fr: "L'Histoire des rois d'Égypte et du Caire d'Ibn Taghribirdi; une source mère de l'histoire dynastique islamique, riche en lettres califes et royales adressées aux gouverneurs et aux sultans."
  ur: "ابن طغری بردی مصر اور قاہرہ کے بادشاہوں کی تاریخ؛ اسلامی خاندانی تاریخ کا ایک مادری ماخذ جو خلیفہ اور گورنروں اور سلطانوں کے نام شاہی خطوط کے ساتھ گھنی ہے۔"
  tr: "İbn Taghribirdi'nin Mısır ve Kahire Krallarının Tarihi, İslam devletinin temel tarihlerinden biridir ve halifelerin ve kralların kitaplarından valilerine, memurlarına ve sultanlarına sıkça anılır."
  id: "Sejarah Raja-raja Mesir dan Kairo oleh Ibn Taghribirdi adalah salah satu sejarah dasar negara Islam, yang sering menyebutkan kitab-kitab khalifah dan raja kepada gubernur, pejabat, dan sultan mereka."
