label: { ar: "بيان الفرق بين التحلل الأصغر والتحلل الأكبر", en: "The difference between the lesser and the greater release", ur: "تحلل اصغر اور اکبر میں فرق", es: "La diferencia entre la liberación menor y la mayor", fr: "La différence entre la libération mineure et la libération majeure", tr: "Mikro bozunma ile makrobozunma arasındaki farkın açıklaması", id: "Penjelasan perbedaan antara mikrodegradasi dan makrodegradasi" }
summary:
  ar: "سائل سأل عن الفرق بين التحلل الأصغر والتحلل الأكبر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20694)⁩ ببيان المراد بالتحلل من الإحرام ومحظوراته والفرق بين التحللين على وجهه."
  en: "A questioner asked about the difference between the lesser and the greater release from ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20694) answered by setting out what release means, the prohibitions it lifts, and the difference between the two."
  ur: "ایک سائل نے تحلل اصغر اور اکبر کے فرق پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20694)⁩ نے جواب میں تحلل کا مطلب اس کے محظورات اور دونوں کے فرق بیان کیا۔"
  es: "Un consultante preguntó sobre la diferencia entre la liberación menor y la mayor del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20694) respondió explicando qué significa la liberación, las prohibiciones que levanta y la diferencia entre ambas."
  fr: "Un internaute a posé une question sur la différence entre la levée mineure et la levée majeure de l'ihram. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20694) a répondu en expliquant ce que signifie la levée de l'ihram, les interdictions qu'elle lève et la différence entre les deux."
  tr: "Bir soru soran kişi, küçük ve büyük tahlul (büyük tahlul) arasındaki farkı sormuştur. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20694), ihram ve yasaklarının ne anlama geldiğini, ayrıca anlam bakımından izin verilen iki tahlulu arasındaki farkı açıklayarak yanıt vermiştir."
  id: "Seorang penanya menanyakan perbedaan antara tahlul minor dan major (tahlul major). Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20694) menjawab dengan menjelaskan apa yang dimaksud dengan ihram dan larangannya, serta perbedaan antara keduanya yang diperbolehkan sesuai maknanya."
