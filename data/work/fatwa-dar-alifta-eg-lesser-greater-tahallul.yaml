label: { ar: "بيان الفرق بين التحلل الأصغر والتحلل الأكبر", en: "The difference between the lesser and the greater release", ur: "تحلل اصغر اور اکبر میں فرق", es: "La diferencia entre la liberación menor y la mayor" }
summary:
  ar: "سائل سأل عن الفرق بين التحلل الأصغر والتحلل الأكبر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20694)⁩ ببيان المراد بالتحلل من الإحرام ومحظوراته والفرق بين التحللين على وجهه."
  en: "A questioner asked about the difference between the lesser and the greater release from ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20694) answered by setting out what release means, the prohibitions it lifts, and the difference between the two."
  ur: "ایک سائل نے تحلل اصغر اور اکبر کے فرق پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20694)⁩ نے جواب میں تحلل کا مطلب اس کے محظورات اور دونوں کے فرق بیان کیا۔"
  es: "Un consultante preguntó sobre la diferencia entre la liberación menor y la mayor del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20694) respondió explicando qué significa la liberación, las prohibiciones que levanta y la diferencia entre ambas."
