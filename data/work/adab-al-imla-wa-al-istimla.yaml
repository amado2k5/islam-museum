summary:
  ar: "آداب الإملاء والاستملاء للحافظ عبد الكريم بن محمد السمعاني ⁦(ت 562هـ)⁩، في قواعد الإملاء وآداب السماع والقراءة على الشيوخ؛ يذكره حاجي خليفة بعنوان «أدب الإملاء» {cite:kashf-zunun-furqan p. 284}."
  en: "Adab al-Imla' wa-al-Istimla' by the hafiz 'Abd al-Karim b. Muhammad al-Sam'ani (d. 562 AH) — rules of dictation and the etiquette of samā'; Hajji Khalifa lists it as 'Adab al-Imla'' {cite:kashf-zunun-furqan p. 284}."
  es: "Adab al-Imla' wa-al-Istimla' por Hafiz 'Abd al-Karim b. Muhammad al-Sam'ani (m. 562 AH) — reglas de dictado y etiqueta del samā'; Hajji Khalifa lo enumera como 'Adab al-Imla' {cita: kashf-zunun-furqan p. 284}."
  fr: "Adab al-Imla' wa-al-Istimla' de Hafiz 'Abd al-Karim b. Muhammad al-Sam'ani (mort en 562 AH) — règles de dictée et étiquette du samā'; Hajji Khalifa le répertorie comme « Adab al-Imla » {cite: kashf-zunun-furqan p. 284}."
  ur: "آداب الاملا' و الاستملا' از حافظ عبد الکریم بن۔ محمد السمانی ⁦(متوفی 562 ہجری)⁩ - حکم کے احکام اور سماع کے آداب؛ حاجی خلیفہ نے اسے 'ادب الاملا' کے طور پر درج کیا ہے۔ 284}۔"
  tr: "Hafız Abdul Kerim bin Muhammed el-Sam'ani (ö. 562 H) tarafından Dikte ve Okuma Kuralları ile Yaşlıların Dinleme ve Okuma Etiketi hakkında; Hacı Halife tarafından \"Dikte Etiketi\" başlığıyla bahsedilmiştir {atıf:kashf-zunun-furqan, s. 284}."
  id: "Etiket Dikte dan Pembacaan oleh Hafiz Abdul Karim ibn Muhammad al-Sam'ani (wafat 562 H), tentang Aturan Dikte dan Etiket Mendengarkan serta Pembacaan Para Tetua; disebutkan oleh Haji Khalifa dengan judul \"Etiket Dikte\" {sitasi:kashf-zunun-furqan, hlm. 284}."
