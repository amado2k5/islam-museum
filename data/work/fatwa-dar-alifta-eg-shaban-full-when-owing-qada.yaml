label: { ar: "حكم صوم شهر شعبان كاملًا لامرأة عليها قضاء رمضان كاملًا", en: "Fasting all of Sha'ban for a woman who owes a whole Ramadan", ur: "ایسے عورت کے لیے پورا شعبان روزہ جس پر پورا رمضان قضاء ہو" }
summary:
  ar: "سائلة سألت عن صوم شعبان كاملًا وعليها قضاء رمضان كاملًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22471)⁩ أن قضاء رمضان واجب على التراخي مقيدًا عند الجمهور بألا يدخل رمضان آخر، وعند الحنفية يسع إلى نهاية العمر؛ وبيّن الجواب حكم التطوع في شعبان لمن عليها قضاء."
  en: "A woman asked about fasting all of Sha'ban while owing a whole Ramadan of make-up fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22471) answered that making up Ramadan is obligatory with leeway — on the majority's view bounded by the arrival of the next Ramadan, while the Hanafis allow it until life's end; the answer sets out the ruling on voluntary fasting in Sha'ban for one who owes make-up."
  ur: "ایک خاتون نے پوچھا کہ جس پر پورے رمضان کی قضاء ہو کیا وہ پورا شعبان روزہ رکھ سکتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22471)⁩ نے جواب دیا کہ رمضان کی قضاء واجب ہے مگر مہلت کے ساتھ — جمهور کے نزدیک اگلے رمضان آنے تک کی میعاد ہے جب کہ حنفیوں میں عمر کے آخر تک وسع ہے؛ جواب میں قضاء رکھنے والی کے لیے شعبان کے نفل روزوں کا حکم بھی بیان ہوا۔"
