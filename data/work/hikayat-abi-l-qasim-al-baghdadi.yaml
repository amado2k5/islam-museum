  en: "Hikayat Abi l-Qasim al-Baghdadi"
  ur: "حکایت ابو القاسم البغدادی"
summary:
  ar: "حكاية أبي القاسم البغدادي لمحمد بن أحمد أبي المطهر الأزدي، تصور طفيليًا بغداديًا يقضي يومًا كاملًا في وليمة، فيتكلم بالوعظ، ويقارن بين بغداد وأصفهان، ثم يسكر ويقع في الفحش، ثم يعود إلى التدين؛ وتعدّها الموسوعة من أدب القرن الخامس الهجري. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  en: "The Hikaya Abi l-Qasim al-Baghdadi of Muhammad b. Ahmad Abu l-Mutahhar al-Azdi, a Baghdad type of parasite who spends a day at a banquet, preaches piously, compares Baghdad with Isfahan, drinks, turns vulgar and then plays the believer again. The encyclopaedia dates it to the first half of the fifth/eleventh century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  ur: "محمد بن احمد ابو المطہر الازدی کی حکایت ابو القاسم البغدادی، جو بغداد کے ایک طفیلی کی تصویر ہے، جو ایک دعوت میں پورا دن گزارتا ہے، وعظ کرتا ہے، بغداد اور اصفہان کا موازنہ کرتا ہے، شراب پی کر فحش ہو جاتا ہے، اور پھر دیندار بن جاتا ہے؛ موسوعہ اسے پانچویں/گیارہویں صدی کی نصف اول کی تصنیف بتاتی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
