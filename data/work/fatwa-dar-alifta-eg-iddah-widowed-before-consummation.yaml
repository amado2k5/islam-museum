summary:
  ar: "سائل سأل عن عدة المرأة التي مات عنها زوجها قبل الدخول بها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21508)⁩ أن الواجب عليها أن تعتد أربعة أشهر وعشرة أيام بالتاريخ الهجري على ما فصّل الجواب."
  en: "A questioner asked about the iddah of a woman whose husband died before consummation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21508) answered that she must observe four months and ten days by the Hijri calendar — as the answer details."
  ur: "ایک سائل نے اس عورت کی عدت پوچھی جس کا شوہر دخل سے پہلے فوت ہو گیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21508)⁩ نے جواب دیا کہ اس پر ہجری حساب سے چار ماہ دس دن کی عدت واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
