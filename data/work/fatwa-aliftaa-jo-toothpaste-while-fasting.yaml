id: work/fatwa-aliftaa-jo-toothpaste-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال معجون الأسنان في نهار رمضان", en: "Using toothpaste during the day in Ramadan", ur: "رمضان کے دن میں ٹوتھ پیسٹ کا استعمال", es: "Usar pasta de dientes durante el día en Ramadán", fr: "Utiliser du dentifrice pendant la journée durant le Ramadan", tr: "Ramazan'da gündüz diş macunu kullanımı", id: "Menggunakan pasta gigi di siang hari di Ramadan" }
summary:
  ar: "سؤال عن استعمال معجون الأسنان في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يفطر إذا تأكد الصائم أنه لم يصل إلى جوفه شيء منه، لكنه مكروه، والأفضل استعماله قبل الإمساك أو بعد الإفطار. أجابت الدائرة بأن استعمال معجون الأسنان في نهار رمضان لا يفطر إذا تأكد الصائم أنه لم يصل إلى الجوف شيء منه، لكنه مكروه. وقالت إن الأفضل أن يستعمله الصائم قبل الإمساك أو بعد الإفطار حتى لا يعرض صيامه للخطر."
  en: "A question about using toothpaste during the day in Ramadan, in which Jordan's General Iftaa Department answered that it does not break the fast if the person is sure none of it reached the interior, but that it is disliked, and is better used before the fast begins or after it ends. The Department answered that using toothpaste during the day in Ramadan does not break the fast if the person is sure none of it reached the interior, but that it is disliked. It said it is better for the fasting person to use it before the start of the fast or after breaking it, so as not to put the fast at risk."
  ur: "رمضان کے دن میں ٹوتھ پیسٹ کے استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر یقین ہو کہ اس کا کچھ حصہ جوف تک نہیں پہنچا تو روزہ نہیں ٹوٹتا، لیکن یہ مکروہ ہے، اور بہتر ہے کہ سحری کے اختتام سے پہلے یا افطار کے بعد استعمال کیا جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان کے دن میں ٹوتھ پیسٹ کا استعمال روزہ نہیں توڑتا اگر یقین ہو کہ اس کا کچھ بھی جوف تک نہیں پہنچا، لیکن یہ مکروہ ہے۔ اس نے کہا کہ بہتر ہے کہ روزے دار اسے روزہ شروع ہونے سے پہلے یا افطار کے بعد استعمال کرے تاکہ روزے کو خطرے میں نہ ڈالے۔"
  es: "Una pregunta sobre el uso de pasta de dientes durante el día en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que no rompe el ayuno si la persona está segura de que no entró en contacto con el interior del cuerpo, pero que no es recomendable y es mejor usarla antes de que comience el ayuno o después de que termine. El Departamento respondió que usar pasta de dientes durante el día en Ramadán no rompe el ayuno si la persona está segura de que no entró en contacto con el interior del cuerpo, pero que no es recomendable. Dijo que es mejor que la persona que ayuna la use antes de que comience el ayuno o después de romperlo, para no poner en riesgo el ayuno."
  fr: "Une question concernant l'utilisation du dentifrice pendant la journée durant le Ramadan a été posée. Le Département général de la Iftaa en Jordanie a répondu que cela ne rompt pas le jeûne si la personne est certaine qu'aucune trace de dentifrice n'a pénétré dans son estomac, mais que cela est déconseillé. Il est préférable de l'utiliser avant le début du jeûne ou après sa rupture, afin de ne pas le compromettre."
  tr: "Ramazan gündüzü diş macunu kullanımıyla ilgili bir soru, Ürdün Genel Fetva Dairesi, oruç tutan kişinin midesine hiçbir şey ulaşmadığından emin ise orucu bozmadığını, ancak sevilmediğini ve kabızlıktan önce veya oruç bittikten sonra kullanılmasının tercih edildiğini yanıtladı. Daire, Ramazan gündüzü diş macunu kullanmanın, oruç tutan kişinin mideye hiçbir şey ulaşmadığından emin ise orucu bozmadığını, ancak bunun hoşlanmadığını belirtti. Oruç tutan kişinin iftardan önce veya sonra kullanmasının orucunu tehlikeye atmamak için kullanmasının daha iyi olduğunu belirtti."
  id: "Sebuah pertanyaan tentang penggunaan pasta gigi pada siang hari Ramadan, di mana Departemen Fatwa Umum Yordania menjawab bahwa puasa tidak memutus jika orang yang berpuasa yakin tidak ada yang sampai ke perut, tetapi tidak disukai, dan lebih baik digunakan sebelum sembelit atau setelah puasa. Departemen menjawab bahwa menggunakan pasta gigi pada siang hari Ramadan tidak memutus puasa jika orang yang berpuasa yakin tidak ada yang sampai ke perut, tetapi tidak disukai. Dikatakan bahwa lebih baik bagi orang yang puasa menggunakannya sebelum atau sesudah iftar agar tidak membahayakan puasa mereka."
