id: work/fatwa-aliftaa-jo-toothpaste-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال معجون الأسنان في نهار رمضان", en: "Using toothpaste during the day in Ramadan", ur: "رمضان کے دن میں ٹوتھ پیسٹ کا استعمال" }
summary:
  ar: "سؤال عن استعمال معجون الأسنان في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يفطر إذا تأكد الصائم أنه لم يصل إلى جوفه شيء منه، لكنه مكروه، والأفضل استعماله قبل الإمساك أو بعد الإفطار. أجابت الدائرة بأن استعمال معجون الأسنان في نهار رمضان لا يفطر إذا تأكد الصائم أنه لم يصل إلى الجوف شيء منه، لكنه مكروه. وقالت إن الأفضل أن يستعمله الصائم قبل الإمساك أو بعد الإفطار حتى لا يعرض صيامه للخطر."
  en: "A question about using toothpaste during the day in Ramadan, in which Jordan's General Iftaa Department answered that it does not break the fast if the person is sure none of it reached the interior, but that it is disliked, and is better used before the fast begins or after it ends. The Department answered that using toothpaste during the day in Ramadan does not break the fast if the person is sure none of it reached the interior, but that it is disliked. It said it is better for the fasting person to use it before the start of the fast or after breaking it, so as not to put the fast at risk."
  ur: "رمضان کے دن میں ٹوتھ پیسٹ کے استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر یقین ہو کہ اس کا کچھ حصہ جوف تک نہیں پہنچا تو روزہ نہیں ٹوٹتا، لیکن یہ مکروہ ہے، اور بہتر ہے کہ سحری کے اختتام سے پہلے یا افطار کے بعد استعمال کیا جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان کے دن میں ٹوتھ پیسٹ کا استعمال روزہ نہیں توڑتا اگر یقین ہو کہ اس کا کچھ بھی جوف تک نہیں پہنچا، لیکن یہ مکروہ ہے۔ اس نے کہا کہ بہتر ہے کہ روزے دار اسے روزہ شروع ہونے سے پہلے یا افطار کے بعد استعمال کرے تاکہ روزے کو خطرے میں نہ ڈالے۔"
