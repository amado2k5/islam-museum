summary:
  ar: "كتاب أبي عثمان عمرو بن بحر الجاحظ في البيان والبلاغة والخطابة، جعله مؤلفه ثلاثة أجزاء، يعرّف فيه البيان ويعدّ أصناف الدلالات الخمسة، ويروي الخطب والوصايا والرسائل وكلام النساك والأعراب والقصاص، ويرد في «كتاب العصا» على مطاعن الشعوبية في خطباء العرب؛ أهداه إلى القاضي أحمد بن أبي دؤاد، ويرى محققه عبد السلام هارون أنه لم يظهر إلا بعد سنة 233هـ {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}."
  en: "Abu 'Uthman 'Amr ibn Bahr al-Jahiz's book on eloquence, rhetoric and oratory, which its author divided into three parts; it defines bayan and counts five kinds of signification, relates sermons, testaments, letters and the sayings of ascetics, Bedouin and preachers, and in 'The Book of the Staff' answers the Shu'ubiyya's attacks on Arab orators. He dedicated it to the judge Ahmad ibn Abi Du'ad, and its editor 'Abd al-Salam Harun holds that it appeared only after 233 AH {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}."
  ur: "ابو عثمان عمرو بن بحر جاحظ کی بیان، بلاغت اور خطابت پر کتاب، جسے مصنف نے تین اجزاء میں تقسیم کیا؛ اس میں بیان کی تعریف اور دلالت کی پانچ اقسام، خطبے، وصیتیں، رسائل، اور زاہدوں، اعراب اور قصہ گو واعظوں کا کلام ہے، اور «کتاب العصا» میں عرب خطیبوں پر شعوبیہ کے اعتراضات کا جواب ہے؛ انہوں نے اسے قاضی احمد بن ابی دؤاد کے نام معنون کیا، اور اس کے محقق عبد السلام ہارون کے نزدیک یہ 233ھ کے بعد ہی منظر عام پر آئی {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}۔"
  es: "El libro de Abu 'Uthman 'Amr ibn Bahr al-Jahiz sobre elocuencia, retórica y oratoria, que su autor dividió en tres partes; define bayan y cuenta cinco tipos de significación, relata sermones, testamentos, cartas y dichos de ascetas, beduinos y predicadores, y en 'El Libro del Bastón' responde a los ataques de Shu'ubiyya contra los oradores árabes. Lo dedicó al juez Ahmad ibn Abi Du'ad, y su editor 'Abd al-Salam Harun sostiene que apareció solo después del 233 AH {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {citar:bayan-tabyin-harun-khanji-1998 p. 103} {citar:bayan-tabyin-harun-khanji-1998 p. 810}."
  fr: "L'ouvrage d'Abu 'Uthman 'Amr ibn Bahr al-Jahiz sur l'éloquence, la rhétorique et l'art oratoire, divisé en trois parties, définit le bayan et recense cinq types de signification. Il relate des sermons, des testaments, des lettres et des hadiths d'ascètes, de Bédouins et de prédicateurs, et, dans « Le Livre du Bâton », répond aux attaques des Shu'ubiyya contre les orateurs arabes. Il le dédia au juge Ahmad ibn Abi Du'ad, et son éditeur, 'Abd al-Salam Harun, affirme qu'il ne parut qu'après 233 AH. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}."
  tr: "Ebu Osman Emr bin Bahr el-Cahiz'in hitabet, hitabet ve hitabet üzerine kitabı. Yazarı kitabı üç bölüme ayırmış, retoriği tanımlamış ve beş tür anlamı sıralamıştır. Vaazları, öğütleri, mektupları, münzevilerin konuşmalarını, Benun ve Kısa'ları anlatır. \"Kitab al-'Asa\" adlı kitabında, Şuubilerin Arap vaizlerine yönelik eleştirilerini çürüttür; eserini Hakim Ahmed bin Ebi Du'ad'a ithaf etmiştir. Editörü Abd al-Salam Harun, kitabın 233 Hicri yılından sonra ortaya çıktığını düşünür {alıntı: Bayan-tabyin-harun-khanji-1998 s. 9} {cite:bayan-tabyin-harun-khanji-1998 s. 16} {cite:bayan-tabyin-harun-khanji-1998 s. 17} {cite:bayan-tabyin-harun-khanji-1998 s. 103} {cite:bayan-tabyin-harun-khanji-1998 s. 810}."
  id: "Kitab Abu Uthman Amr ibn Bahr al-Jahiz tentang kefasihan, retorika, dan orasi. Penulisnya membaginya menjadi tiga bagian, di mana ia mendefinisikan retorika dan menyebutkan lima jenis makna. Ia menceritakan khotbah, nasihat, surat, pidato para pertapa, Benoun, dan Qisa. Dalam buku \"Kitab al-'Asa,\" ia membantah kritik Shu'ubi terhadap para pengkhotbah Arab; ia mendedikasikannya kepada Hakim Ahmad ibn Abi Du'ad. Editornya, Abd al-Salam Harun, percaya bahwa kitab ini baru muncul setelah tahun 233 H {cite: bayan-tabyin-harun-khanji-1998 hlm. 9} {cite:bayan-tabyin-harun-khanji-1998 hlm. 16} {cite:bayan-tabyin-harun-khanji-1998 hlm. 17} {cite:bayan-tabyin-harun-khanji-1998 hlm. 103} {cite:bayan-tabyin-harun-khanji-1998 hlm. 810}."
