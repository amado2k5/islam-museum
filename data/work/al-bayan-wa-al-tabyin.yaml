label: { ar: "البيان والتبيين", en: "al-Bayan wa-l-Tabyin (Eloquence and Exposition)", ur: "البیان والتبیین" }
summary:
  ar: "كتاب أبي عثمان عمرو بن بحر الجاحظ في البيان والبلاغة والخطابة، جعله مؤلفه ثلاثة أجزاء، يعرّف فيه البيان ويعدّ أصناف الدلالات الخمسة، ويروي الخطب والوصايا والرسائل وكلام النساك والأعراب والقصاص، ويرد في «كتاب العصا» على مطاعن الشعوبية في خطباء العرب؛ أهداه إلى القاضي أحمد بن أبي دؤاد، ويرى محققه عبد السلام هارون أنه لم يظهر إلا بعد سنة 233هـ {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}."
  en: "Abu 'Uthman 'Amr ibn Bahr al-Jahiz's book on eloquence, rhetoric and oratory, which its author divided into three parts; it defines bayan and counts five kinds of signification, relates sermons, testaments, letters and the sayings of ascetics, Bedouin and preachers, and in 'The Book of the Staff' answers the Shu'ubiyya's attacks on Arab orators. He dedicated it to the judge Ahmad ibn Abi Du'ad, and its editor 'Abd al-Salam Harun holds that it appeared only after 233 AH {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}."
  ur: "ابو عثمان عمرو بن بحر جاحظ کی بیان، بلاغت اور خطابت پر کتاب، جسے مصنف نے تین اجزاء میں تقسیم کیا؛ اس میں بیان کی تعریف اور دلالت کی پانچ اقسام، خطبے، وصیتیں، رسائل، اور زاہدوں، اعراب اور قصہ گو واعظوں کا کلام ہے، اور «کتاب العصا» میں عرب خطیبوں پر شعوبیہ کے اعتراضات کا جواب ہے؛ انہوں نے اسے قاضی احمد بن ابی دؤاد کے نام معنون کیا، اور اس کے محقق عبد السلام ہارون کے نزدیک یہ 233ھ کے بعد ہی منظر عام پر آئی {cite:bayan-tabyin-harun-khanji-1998 p. 9} {cite:bayan-tabyin-harun-khanji-1998 p. 16} {cite:bayan-tabyin-harun-khanji-1998 p. 17} {cite:bayan-tabyin-harun-khanji-1998 p. 103} {cite:bayan-tabyin-harun-khanji-1998 p. 810}۔"
