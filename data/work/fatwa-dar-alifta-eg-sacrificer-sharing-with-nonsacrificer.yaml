label: { ar: "حكم اشتراك المضحي مع غير المضحي في ذبيحة واحدة", en: "A sacrificer sharing one animal with a non-sacrificer", ur: "قربانی کرنے والے کا غیر قربانی والے کے ساتھ ایک جانور میں شرکت", es: "Un sacrificador que comparte un animal con alguien que no realiza sacrificios." }
summary:
  ar: "سائل سأل عن اشتراك المضحي مع غير المضحي في ذبيحة واحدة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21929)⁩ أنه يجوز اشتراكهما سواء كان شريكه مريد قربة كالعقيقة والنذور أو غير قربة كمريد اللحم على ما فصّل الجواب."
  en: "A questioner asked about a sacrificer sharing one animal with a non-sacrificer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21929) answered that sharing is permitted — whether the partner intends a devotion like aqiqa or vows, or merely wants the meat — as the answer details."
  ur: "ایک سائل نے قربانی کرنے والے اور نہ کرنے والے کے ایک جانور میں شرکت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21929)⁩ نے جواب دیا کہ شرکت جائز ہے — خواہ شریک قربت چاہتا ہو جیسے عقیقہ یا نذر یا محض گوشت — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que un sacrificador compartiera un animal con alguien que no realiza sacrificios. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21929) respondió que compartir está permitido, ya sea que la persona tenga la intención de realizar una devoción como la aqiqa o votos, o simplemente desee la carne, como se detalla en la respuesta."
