id: work/fatwa-amja-nonmuslim-mother-funeral
class: work
kind: fatwa
label: { ar: "تشييع الأم غير المسلمة", en: "Attending a non-Muslim mother's funeral", ur: "غیر مسلم ماں کی میت میں شرکت", es: "Asistir al funeral de una madre no musulmana", fr: "Assister aux funérailles d'une mère non musulmane", tr: "Gayrimüslim bir annenin cenazesi", id: "Pemakaman Ibu Non-Muslim" }
summary:
  ar: "سأل مهتد جديد ماتت أمه نصرانية هل يجوز له المشاركة في تشييع جثمانها وقد يدخلون موتاهم الكنيسة ثم يدفنونهم في المقبرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80757 بتاريخ 4 يناير 2010)⁩ أنه لا حرج في تشييع جنازة غير المسلم إذا وجد مقتضٍ لذلك من قرابة أو نحوه على أن يعتزل ما يكون في تشييعها من مناسك شركية، والأصل أن النبي أمر علي بن أبي طالب أن يواري أباه وقد مات على غير الإسلام."
  en: "A recent convert whose Christian mother died asked whether he may join her funeral, which passes through the church before burial. Dr. Salah al-Sawi (fatwa no. 80757, 4 January 2010) answered that attending a non-Muslim's funeral is unobjectionable where a ground like kinship calls for it, so long as he keeps clear of the idolatrous rites within it — the precedent being that the Prophet ordered Ali ibn Abi Talib to bury his father though he died outside Islam."
  ur: "ایک نو مسلم نے پوچھا کہ اپنی غیر مسلم ماں کی تدفین میں شرکت کر سکتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80757، 4 جنوری 2010)⁩ کے مطابق قرابت کی بنیاد پر شرکت جائز ہے مگر شرکیہ مناسک سے دور رہے — علی کو اپنے باپ کی تدفین کا حکم اس کی اصل ہے۔"
  es: "Un converso reciente, cuya madre cristiana había fallecido, preguntó si podía asistir a su funeral, que pasa por la iglesia antes del entierro. El Dr. Salah al-Sawi (fatwa n.º 80757, 4 de enero de 2010) respondió que asistir al funeral de un no musulmán no presenta inconveniente alguno cuando existe un motivo como el parentesco, siempre y cuando se mantenga al margen de los ritos idolátricos que se realizan en él; el precedente es que el Profeta ordenó a Ali ibn Abi Talib que enterrara a su padre, aunque este falleció fuera del Islam."
  fr: "Un homme récemment converti, dont la mère chrétienne est décédée, a demandé s'il pouvait assister à ses funérailles, qui passent par l'église avant l'inhumation. Le Dr Salah al-Sawi (fatwa n° 80757, 4 janvier 2010) a répondu qu'assister aux funérailles d'un non-musulman n'est pas problématique lorsqu'un motif tel que les liens familiaux le justifie, à condition de s'abstenir de tout rite idolâtre – le précédent étant que le Prophète a ordonné à Ali ibn Abi Talib d'enterrer son père bien que celui-ci soit décédé hors de l'islam."
  tr: "Yeni bir müslüman annesinin Hristiyan bir kadın olarak ölüp ölmediğini, cenaze alayına katılmanın izin olup olmadığını ve ölülerinin kiliseye getirilip mezarlığa gömülemeyeceğini sordu. Dr. Salah Al-Sawy (4 Ocak 2010 tarihli 80757 sayılı fetva) cevabını verdi; eğer akrabalık veya benzeri nedenlerle gerekiyorsa, cenaze çoktanrılı ritüellerden arındırıldıysa gayrimüslim cenaze düzenlemekte bir sakınca yoktur. Asıl ilke, Peygamber'in Ali ibn Ebi Talib'e, İslam dışında ölen babasını saklamasını emrettiği yönündedir."
  id: "Seorang mualaf baru bertanya apakah ibunya meninggal sebagai wanita Kristen dan apakah diperbolehkan ikut serta dalam prosesi pemakamannya, dan jenazah mereka dapat dibawa ke gereja dan dimakamkan di pemakaman. Dr. Salah Al-Sawy menjawab (Fatwa No. 80757 tanggal 4 Januari 2010) bahwa tidak ada salahnya mengadakan pemakaman non-Muslim jika diperlukan karena hubungan keluarga atau sejenisnya, asalkan pemakaman bebas dari ritual politeistik. Prinsip aslinya adalah bahwa Nabi memerintahkan Ali ibn Abi Talib untuk menyembunyikan ayahnya yang meninggal di luar Islam."
