id: work/fatwa-amja-nonmuslim-mother-funeral
class: work
kind: fatwa
label: { ar: "تشييع الأم غير المسلمة", en: "Attending a non-Muslim mother's funeral", ur: "غیر مسلم ماں کی میت میں شرکت" }
summary:
  ar: "سأل مهتد جديد ماتت أمه نصرانية هل يجوز له المشاركة في تشييع جثمانها وقد يدخلون موتاهم الكنيسة ثم يدفنونهم في المقبرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80757 بتاريخ 4 يناير 2010)⁩ أنه لا حرج في تشييع جنازة غير المسلم إذا وجد مقتضٍ لذلك من قرابة أو نحوه على أن يعتزل ما يكون في تشييعها من مناسك شركية، والأصل أن النبي أمر علي بن أبي طالب أن يواري أباه وقد مات على غير الإسلام."
  en: "A recent convert whose Christian mother died asked whether he may join her funeral, which passes through the church before burial. Dr. Salah al-Sawi (fatwa no. 80757, 4 January 2010) answered that attending a non-Muslim's funeral is unobjectionable where a ground like kinship calls for it, so long as he keeps clear of the idolatrous rites within it — the precedent being that the Prophet ordered Ali ibn Abi Talib to bury his father though he died outside Islam."
  ur: "ایک نو مسلم نے پوچھا کہ اپنی غیر مسلم ماں کی تدفین میں شرکت کر سکتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80757، 4 جنوری 2010)⁩ کے مطابق قرابت کی بنیاد پر شرکت جائز ہے مگر شرکیہ مناسک سے دور رہے — علی کو اپنے باپ کی تدفین کا حکم اس کی اصل ہے۔"
