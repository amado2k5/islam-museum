id: work/fatwa-amja-cursing-dead-kafir
class: work
kind: fatwa
label: { ar: "لعن من مات على الكفر", en: "Cursing one who died a disbeliever", ur: "کفر پر مرنے والے کو لعنت" }
summary:
  ar: "سأل سائل هل يجوز لعن من مات كافرًا والشهادة بأنه من أهل النار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81528 بتاريخ 22 مايو 2010)⁩ أن النصوص دلت على أن من مات على الكفر فهو من أهل النار كقوله ولا الذين يموتون وهم كفار أولئك أعتدنا لهم عذابًا أليمًا، ولكنه حكم عام يجب الإيمان به على عمومه ولا يوجب لعن المعين ولا الشهادة على المعين بأنه في النار إلا من وردت فيه بعينه أدلة بذلك، ويشبه هذا الشهادة لكل من مات مؤمنًا بالجنة إلا من دل الدليل على دخوله بعينه."
  en: "A questioner asked whether one who died a disbeliever may be cursed and testified to be among the people of the Fire. Dr. Salah al-Sawi (fatwa no. 81528, 22 May 2010) answered that the texts show whoever dies in disbelief is among the people of the Fire — 'nor those who die as disbelievers; for them We prepared a painful punishment' — but that is a general ruling to be believed in generally; it does not license cursing an individual nor testifying that a specific person is in the Fire, except one for whom evidence came naming him, just as believing that whoever dies faithful enters Paradise does not license testifying that for an individual unless proof names him. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ کفر پر مرنے والے کو لعنت اور جہنمی کہا جا سکتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81528، 22 مئی 2010)⁩ کے مطابق عمومی حکم یہی ہے کہ کافر جہنمی ہے مگر کسی معین شخص کو لعنت یا جہنمی کہنا جائز نہیں مگر جس کا ثبوت آیا ہو۔"
