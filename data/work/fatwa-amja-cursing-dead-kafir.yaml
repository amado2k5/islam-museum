id: work/fatwa-amja-cursing-dead-kafir
class: work
kind: fatwa
label: { ar: "لعن من مات على الكفر", en: "Cursing one who died a disbeliever", ur: "کفر پر مرنے والے کو لعنت", es: "Maldecir a alguien que murió siendo incrédulo.", fr: "Maudire celui qui est mort incrédule" }
summary:
  ar: "سأل سائل هل يجوز لعن من مات كافرًا والشهادة بأنه من أهل النار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81528 بتاريخ 22 مايو 2010)⁩ أن النصوص دلت على أن من مات على الكفر فهو من أهل النار كقوله ولا الذين يموتون وهم كفار أولئك أعتدنا لهم عذابًا أليمًا، ولكنه حكم عام يجب الإيمان به على عمومه ولا يوجب لعن المعين ولا الشهادة على المعين بأنه في النار إلا من وردت فيه بعينه أدلة بذلك، ويشبه هذا الشهادة لكل من مات مؤمنًا بالجنة إلا من دل الدليل على دخوله بعينه."
  en: "A questioner asked whether one who died a disbeliever may be cursed and testified to be among the people of the Fire. Dr. Salah al-Sawi (fatwa no. 81528, 22 May 2010) answered that the texts show whoever dies in disbelief is among the people of the Fire — 'nor those who die as disbelievers; for them We prepared a painful punishment' — but that is a general ruling to be believed in generally; it does not license cursing an individual nor testifying that a specific person is in the Fire, except one for whom evidence came naming him, just as believing that whoever dies faithful enters Paradise does not license testifying that for an individual unless proof names him. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ کفر پر مرنے والے کو لعنت اور جہنمی کہا جا سکتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81528، 22 مئی 2010)⁩ کے مطابق عمومی حکم یہی ہے کہ کافر جہنمی ہے مگر کسی معین شخص کو لعنت یا جہنمی کہنا جائز نہیں مگر جس کا ثبوت آیا ہو۔"
  es: "Un consultante preguntó si se puede maldecir a quien muere siendo incrédulo y testificar que estará entre la gente del Infierno. El Dr. Salah al-Sawi (fatwa n.° 81528, 22 de mayo de 2010) respondió que los textos muestran que quien muere siendo incrédulo está entre la gente del Infierno —«ni quienes mueren como incrédulos; para ellos hemos preparado un castigo doloroso»—, pero que se trata de una norma general que debe aceptarse en general; no autoriza a maldecir a un individuo ni a testificar que una persona específica está en el Infierno, salvo para quien haya pruebas que lo identifiquen, del mismo modo que creer que quien muere siendo fiel entra en el Paraíso no autoriza a testificarlo para un individuo a menos que haya pruebas que lo identifiquen. Registrado como respuesta de AMJA."
  fr: "Un internaute a demandé si une personne décédée en mécréance pouvait être maudite et si son sort en Enfer pouvait être attesté. Le Dr Salah al-Sawi (fatwa n° 81528, 22 mai 2010) a répondu que les textes indiquent que quiconque meurt en mécréance est parmi les gens de l'Enfer – « ni ceux qui meurent en mécréants; pour eux, Nous avons préparé un châtiment douloureux » – mais qu'il s'agit d'une décision générale à prendre en compte de manière générale; elle n'autorise ni à maudire un individu ni à témoigner qu'une personne spécifique est en Enfer, sauf si des preuves la nomment explicitement, de même que la croyance que quiconque meurt croyant entre au Paradis n'autorise pas à témoigner en sa faveur, sauf si des preuves la nomment. Cette réponse a été consignée dans la note AMJA."
