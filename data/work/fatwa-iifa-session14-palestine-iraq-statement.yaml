label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 14)⁩ إلى الأمة الإسلامية بشأن فلسطين والعراق ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(14th session)⁩ to the Muslim umma on Palestine and Iraq ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(چودہویں مجلس)⁩ امتِ مسلمہ کے نام: فلسطین اور عراق ⁦(بیان، قرارداد نہیں)⁩", es: "Declaración de la IIFA (14.ª sesión) a la comunidad musulmana sobre Palestina e Irak (declaración, no resolución).", fr: "Déclaration de l'IIFA (14e session) à la umma musulmane sur la Palestine et l'Irak (déclaration, et non une résolution)" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(11–16 يناير 2003م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. يستعرض البيان بلسان المجمع الأوضاع في الأقطار العربية والإسلامية وفي طليعتها فلسطين والعراق عشية الحرب على العراق: يصف ما تراه الاحتلال الإسرائيلي ممارسات ضد الفلسطينيين ⁦(قتل واعتقالات وهدم بيوت وتجريف أراضٍ وحصار وحماية القدس والمسجد الأقصى)⁩، ويعلن موقفه تجاه الشعب الفلسطيني والعراقي ويدعو الأمة إلى الموقف الموحد، ويخاطب الحكام والشعوب. سُجّل بوصفه بيان المجمع، ملخصًا بحياد دون إعادة إنتاج مفرداته الخطابية."
  en: "A statement issued by the International Islamic Fiqh Academy at its 14th session in Doha (11–16 January 2003), published among the session materials though not a numbered resolution. In the Academy's own voice it surveys conditions in Arab and Muslim lands, foremost Palestine and Iraq on the eve of the Iraq war: it describes what it sees as Israeli occupation practices against Palestinians — killing, arrests, house demolitions, land clearing, sieges, and Jerusalem and Al-Aqsa — declares its stance toward the Palestinian and Iraqi peoples, calls the umma to a unified position, and addresses rulers and peoples. Recorded as the Academy's own statement, summarised neutrally without reproducing its rhetorical vocabulary."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، دوحہ میں چودہویں مجلس ⁦(11–16 جنوری 2003ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ اکیڈمی کی اپنی زبانی میں یہ عرب اور اسلامی ممالک کے حالات — اولاً فلسطین اور عراق، عراق جنگ سے عین قبل — بیان کرتا ہے: اس کے نزدیک فلسطینیوں پر قبضہ اسرائیل کے اعمال — قتل، گرفتاریاں، گھر گرانا، زمین کی تباہی، محاصرے اور قدس و مسجد اقصیٰ — بیان کرتا ہے، فلسطینی اور عراقی عوام سے اپنا مؤقف ظاہر کرتا ہے، امت کو متحد مؤقف کی دعوت دیتا ہے اور حکمرانوں و عوام کو خطاب کرتا ہے۔ یہاں اکیڈمی کے اپنے بیان کا غیر جانبدارانہ خلاصہ درج ہے، اس کے بیانیاتی الفاظ دہرائے بغیر۔"
  es: "Declaración emitida por la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (11-16 de enero de 2003), publicada entre los materiales de la sesión, aunque no como resolución numerada. En palabras de la propia Academia, se analiza la situación en los países árabes y musulmanes, principalmente Palestina e Irak, en vísperas de la guerra de Irak. Se describen las prácticas de ocupación israelíes contra los palestinos —asesinatos, detenciones, demoliciones de viviendas, desmonte de tierras, asedios a Jerusalén y Al-Aqsa—, se declara la postura de la Academia respecto a los pueblos palestino e iraquí, se hace un llamamiento a la umma a una posición unificada y se dirige a gobernantes y pueblos. Esta declaración se recoge como la declaración oficial de la Academia, resumida de forma neutral sin reproducir su vocabulario retórico."
  fr: "Déclaration de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 14e session à Doha (11-16 janvier 2003), publiée dans les documents de la session sans toutefois constituer une résolution numérotée. L'Académie y dresse un bilan de la situation dans les pays arabes et musulmans, notamment en Palestine et en Irak à la veille de la guerre d'Irak: elle y décrit ce qu'elle considère comme des pratiques d'occupation israéliennes à l'encontre des Palestiniens – meurtres, arrestations, démolitions de maisons, défrichement, sièges, et notamment à Jérusalem et à Al-Aqsa –, affirme sa position envers les peuples palestinien et irakien, appelle la communauté musulmane à l'unité et s'adresse aux dirigeants et aux peuples. Ce texte est reproduit ici comme la déclaration officielle de l'Académie, résumée de manière neutre sans en reprendre le vocabulaire rhétorique."
