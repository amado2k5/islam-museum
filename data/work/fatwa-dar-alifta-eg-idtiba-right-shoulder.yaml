summary:
  ar: "سائل سأل عن كشف الكتف الأيمن أثناء الإحرام ⁦(الاضطباع)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21912)⁩ أن الاضطباع من سنن الطواف التي يختص بها الرجال وبيّن الجواب مواضعه ووقته على وجهه."
  en: "A questioner asked about uncovering the right shoulder during ihram (idtiba'). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21912) answered that idtiba' is among the sunnas of tawaf specific to men; the answer sets out where and when it applies."
  ur: "ایک سائل نے احرام میں دایاں کندھا کھولنے ⁦(اضطباع)⁩ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21912)⁩ نے جواب دیا کہ اضطباع طواف کی ان سنتوں میں ہے جو مردوں کے لیے مخصوص ہے؛ جواب میں اس کے مواقع اور وقت کی تفصیل بیان ہوئی۔"
