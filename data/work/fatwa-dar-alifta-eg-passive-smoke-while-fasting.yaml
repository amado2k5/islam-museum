id: work/fatwa-dar-alifta-eg-passive-smoke-while-fasting
class: work
kind: fatwa
label: { ar: "حكم صوم من تعرض لدخان السجائر من غير قصد", en: "The fast of one unintentionally exposed to cigarette smoke", ur: "غیر ارادی طور پر سگریٹ کے دھوئیں سے متاثر ہونے والے کا روزہ", es: "El ayuno de una persona expuesta involuntariamente al humo del cigarrillo.", fr: "Le jeûne d'une personne exposée involontairement à la fumée de cigarette", tr: "Sigara dumanına istemeden maruz kalan birinin oruç tutma kararı", id: "Aturan tentang puasa bagi seseorang yang secara tidak sengaja terpapar asap rokok" }
summary:
  ar: "سائل سأل عن صوم من تعرض لدخان السجائر من غير قصد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21802)⁩ أن التدخين بكافة أنواعه وصوره يعد من المفطرات غير أن الصائم الذي يتعرض أثناء تنفسه الطبيعي لهذا الدخان له حكمه الذي بيّنه الجواب."
  en: "A questioner asked about the fast of one unintentionally exposed to cigarette smoke. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21802) answered that smoking in all its kinds is among the things that break the fast — but the ruling differs for a faster who encounters this smoke in ordinary breathing, as the answer sets out."
  ur: "ایک سائل نے اس شخص کے روزے کا حکم پوچھا جو بلا قصد سگریٹ کے دھوئیں کے سامنے آ جائے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21802)⁩ نے جواب دیا کہ تمام قسم کی سگریٹ نوشی مفطرات میں ہے، مگر عام سانس لیتے ہوئے دھوئیں کا سامنا کرنے والے روزہ دار کا حکم الگ ہے — جیسا کہ جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre el ayuno de una persona expuesta involuntariamente al humo del cigarrillo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21802) respondió que fumar en todas sus formas es una de las cosas que rompen el ayuno, pero la norma difiere para quien ayuna y entra en contacto con este humo al respirar normalmente, como se explica en la respuesta."
  fr: "Un internaute a posé une question concernant la validité du jeûne pour une personne exposée involontairement à la fumée de cigarette. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21802) a répondu que fumer sous toutes ses formes fait partie des actes rompant le jeûne, mais que la règle diffère pour celui qui jeûne en étant exposé à cette fumée en respirant normalement, comme le précise la réponse."
  tr: "Bir soru soran, istemeden sigara dumanına maruz kalan birinin orucu hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21802), her türlü sigara içmenin oruç bozmak olarak kabul edildiğini, ancak doğal nefes sırasında bu dumana maruz kalan oruç kişinin cevabında açıklandığı gibi hükmettiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang puasa seseorang yang secara tidak sengaja terpapar asap rokok. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21802) menjawab bahwa merokok dalam segala bentuk dianggap sebagai berpuasa, tetapi orang yang berpuasa dan terpapar asap ini selama pernapasan alami memiliki keputusan seperti yang dijelaskan dalam jawaban."
