id: work/fatwa-dar-alifta-eg-passive-smoke-while-fasting
class: work
kind: fatwa
label: { ar: "حكم صوم من تعرض لدخان السجائر من غير قصد", en: "The fast of one unintentionally exposed to cigarette smoke", ur: "غیر ارادی طور پر سگریٹ کے دھوئیں سے متاثر ہونے والے کا روزہ" }
summary:
  ar: "سائل سأل عن صوم من تعرض لدخان السجائر من غير قصد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21802)⁩ أن التدخين بكافة أنواعه وصوره يعد من المفطرات غير أن الصائم الذي يتعرض أثناء تنفسه الطبيعي لهذا الدخان له حكمه الذي بيّنه الجواب."
  en: "A questioner asked about the fast of one unintentionally exposed to cigarette smoke. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21802) answered that smoking in all its kinds is among the things that break the fast — but the ruling differs for a faster who encounters this smoke in ordinary breathing, as the answer sets out."
  ur: "ایک سائل نے اس شخص کے روزے کا حکم پوچھا جو بلا قصد سگریٹ کے دھوئیں کے سامنے آ جائے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21802)⁩ نے جواب دیا کہ تمام قسم کی سگریٹ نوشی مفطرات میں ہے، مگر عام سانس لیتے ہوئے دھوئیں کا سامنا کرنے والے روزہ دار کا حکم الگ ہے — جیسا کہ جواب میں بیان ہوا۔"
