label: { ar: "معلقة الحارث بن حلزة «آذنتنا ببينها أسماء»", en: "The Mu'allaqa of al-Harith ibn Hilliza, 'Asma' announced her parting to us'", es: "La Mu'allaqa de al-Harith ibn Hilliza, 'Asma', nos anunció su partida'", fr: "La Mu'allaqa d'al-Harith ibn Hilliza, 'Asma' nous a annoncé sa séparation'", ur: "حارث بن ہلزہ کی معلقہ اسماء نے ہم سے علیحدگی کا اعلان کیا", tr: "El-Haris bin Halza'nın Mu'allaka (Peygamberin Nahşi) eseri", id: "Mu'allaqa (Seruan Nabi) karya Al-Harith ibn Halza" }
summary:
  ar: "إحدى المعلقات السبع، من الخفيف على روي الهمزة، مطلعها «آذنتنا ببينها أسماء رب ثاو يمل منه الثواء»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  en: "One of the seven Mu'allaqat, in the khafif metre on the rhyme hamza, opening \"Asma' announced her parting to us; many a dweller is wearied by his stay\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  es: "Uno de los siete Mu'allaqat, en metro khafif sobre la rima hamza, comienza con \"Asma' anunció su partida para nosotros; muchos moradores se cansan de su estancia\", como en el comentario de al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  fr: "L'un des sept Mu'allaqat, en mètre khafif sur la rime hamza, commençant par « Asma' nous annonça son départ; beaucoup d'habitants sont las de leur séjour », comme dans le commentaire d'al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  ur: "سات معلقات میں سے ایک، شاعری حمزہ پر خفیف میٹر میں، \"اسماء\" نے ہم سے علیحدگی کا اعلان کیا؛ بہت سے باشندے اس کے قیام سے تھک چکے ہیں، جیسا کہ الزوزانی کی تفسیر {{حوالہ:شرح الملقات سب زوزانی-1921} ص1} میں ہے۔"
  tr: "Yedi Mu'allakat'tan biri, ışıktan hamzanın anlatımına kadar, başlangıcı \"Onlara Thawzani'nin Rabbi'nin isimlerini çağırdım, Thawwa'nın sıktığı isimler,\" Al-Zawzani'nin yorumunda {{cite:sharh-muallaqat-sab-zawzani-1921 s.163}} olarak açıklanmıştır."
  id: "Salah satu dari tujuh Mu'allaqat, dari cahaya hingga narasi hamza, awalnya adalah \"Aku telah memanggil kepada mereka nama-nama Tuhan Thawzani, yang membuat Thawwa bosan,\" sebagaimana dijelaskan dalam komentar Al-Zawzani {{cite:sharh-muallaqat-sab-zawzani-1921 hlm.163}}."
