summary:
  ar: "إحدى المعلقات السبع، من الخفيف على روي الهمزة، مطلعها «آذنتنا ببينها أسماء رب ثاو يمل منه الثواء»، كما في شرح الزوزني {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  en: "One of the seven Mu'allaqat, in the khafif metre on the rhyme hamza, opening \"Asma' announced her parting to us; many a dweller is wearied by his stay\", as in al-Zawzani's commentary {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
