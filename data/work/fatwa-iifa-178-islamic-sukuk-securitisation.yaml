label: { ar: "قرار مجمع الفقه الإسلامي الدولي 178 (19/4) بشأن الصكوك الإسلامية ⁦(التوريق)⁩ وتطبيقاتها المعاصرة وتداولها", en: "IIFA resolution 178 (19/4) on Islamic sukuk ⁦(securitisation)⁩: contemporary applications and trading", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 178 (19/4): اسلامی صکوک ⁦(سیکورٹائزیشن)⁩ — عصری اطلاقات اور تجارت", es: "Resolución 178 (19/4) de la IIFA sobre sukuk islámicos (titulización): aplicaciones y negociación contemporáneas", fr: "Résolution 178 (19/4) de l'IIFA sur les sukuk islamiques (titrisation): applications et échanges contemporains", tr: "Uluslararası İslami Fiqh Akademisi Kararı 178 (19/4) İslami Sukuk (Güvenlik Sistemi), Güncel Uygulamaları ve Dolaşımı hakkında", id: "Resolusi Akademi Fiqh Islam Internasional 178 (19/4) mengenai Sukuk Islam (Sekuritisasi), Aplikasi Kontemporernya, dan Peredaran" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. ميّز بين التوريق التقليدي — تحويل الديون إلى سندات تمثل دينًا بفائدة لا يجوز إصدارها ولا تداولها — وبين التصكيك الإسلامي: إصدار وثائق متساوية القيمة تمثل حصصًا شائعة في ملكية موجودات ⁦(أعيان أو منافع أو حقوق أو خليط منها مع النقود والديون)⁩ قائمة أو ستنشأ من حصيلة الاكتتاب، تصدر بعقد شرعي وتأخذ أحكامه. وعدّد خصائص الصك: حصة شائعة في ملكية حقيقية؛ صدوره على عقد شرعي؛ انتفاء ضمان المدير ⁦(مضاربًا أو وكيلًا أو شريكًا)⁩؛ اشتراك الصكوك في الربح والخسارة بقدر الحصة ومنع النسبة المحددة مسبقًا أو المبلغ المقطوع؛ تحمل مخاطر الاستثمار كاملة؛ وتحمل أعباء الملكية من صيانة وتأمين وهبوط قيمة. وقرر: لا يجوز أن يتعهد مدير الصكوك بإقراض حملتها أو التبرع عند نقص الربح الفعلي عن المتوقع ⁦(وله بعد ظهور النتيجة أن يتبرع بالفرق أو يقرضه، وما صار عرفًا كالتعهد)⁩؛ المدير أمين لا يضمن إلا بالتعدي أو التقصير؛ لا يجوز إطفاء الصكوك بقيمتها الاسمية بل بسعر السوق أو بما يتفق عليه؛ وتداولها خاضع لضوابط قرار المجمع 30 ⁦(4/5)⁩ ⁦(صرف إن كانت نقودًا، أحكام الدين إن انقلبت ديونًا، وجواز التداول بالسعر المتراضى إن غلبت الأعيان والمنافع على الخليط)⁩؛ ولا يجوز اتخاذ الجواز ذريعة لتصكيك الديون. وذكر تطبيقات معاصرة ⁦(السياسة النقدية، تمويل البنوك الإسلامية واستثمار فائضها، إعمار الأوقاف، المشروعات الحكومية، الخصخصة المؤقتة)⁩ وأوصى بالأطر القانونية المنظمة للتصكيك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It distinguished conventional securitisation — converting debts into interest-bearing bonds, whose issue and trading it held impermissible — from Islamic securitisation (taskik): issuing equal-value certificates representing undivided shares in the ownership of assets (tangible assets, usufructs, rights, or a mixture including cash and debts), existing or to be created from subscription proceeds, issued under a lawful contract whose rules govern them. It enumerated the sukuk's properties: a genuine undivided ownership share; issue on a lawful contract; no guarantee by the manager (mudarib, wakil or partner); shared profit and loss in proportion to the holding with no pre-fixed percentage or lump sum; full investment risk; and bearing the ownership burdens of maintenance, insurance and depreciation. It ruled: the sukuk manager may not undertake to lend to holders or make up shortfalls of actual against expected profit (though after results emerge he may donate the difference or lend, and what becomes customary counts as an undertaking); the manager is a trustee liable only for breach or negligence; redemption may not be at nominal value but at market or agreed value; tradability follows the controls of resolution 30 (4/5) (sarf rules while the components are cash, debt rules once they become receivables, negotiated-price trading only when tangibles and usufructs predominate); and permissibility may not be used as a device to securities debts. It listed contemporary applications (monetary policy, funding Islamic banks and investing their surplus liquidity, waqf development, government projects, temporary privatisation) and recommended proper legal frameworks for securitisation."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے روایتی سیکورٹائزیشن — قرضوں کو سودی بانڈز میں بدلنا، جن کا اجرا اور کاروبار ناجائز قرار دیا — اور اسلامی تصکیک میں فرق کیا: یکساں قیمت کی دستاویزات کا اجرا جو موجودات ⁦(اعیان، منافع، حقوق یا ان کے نقد و دین کے ساتھ مخلوط)⁩ کی ملکیت میں شائع حصوں کی نمائندگی کرتی ہیں، موجود یا سبسکرپشن کی آمدنی سے بنائی جانے والی، شرعی عقد کے تحت جاری ہو کر اسی کے احکام لیتی ہیں۔ صک کی خصوصیات گنوائیں: حقیقی ملکیت کا شائع حصہ؛ شرعی عقد پر اجرا؛ مدیر ⁦(مضارب، وکیل یا شریک)⁩ کی ضمانت کا عدم؛ حصے کے تناسب سے منفع و نقصان میں شرکت اور پیشگی مقررہ فیصد یا مقطوع رقم کی ممانعت؛ سرمایہ کاری کا مکمل خطرہ؛ اور مینٹیننس، انشورنس اور قدر میں کمی جیسے مالیانہ بوجھ کی اداگی۔ فیصلے: صکوک کا مدیر حاملین کو قرض دینے یا متوقع منفع کے مکمل نہ ہونے پر عطیہ دینے کا عہد نہیں کر سکتا ⁦(نتائج آنے کے بعد فرق عطیہ یا قرض دے سکتا ہے، اور جو عرف بن جائے وہ عہد کے مترادف ہے)⁩؛ مدیر امین ہے، صرف تجاوز یا کوتاہی پر ذمہ دار؛ صکوک کی تشفی اسمی قیمت پر نہیں بلکہ بازار یا متفقہ قیمت پر ہوگی؛ قابلِ تداولیت قرارداد 30 ⁦(4/5)⁩ کے ضوابط کی تابع ⁦(نقد ہو تو صرف کے احکام، دین بن جائے تو دین کے، اور اعیان و منافع کے غالب ہونے پر متفقہ قیمت پر تجارت جائز)⁩؛ اور جواز کو قرضوں کے تصکیک کا بہانہ نہیں بنایا جا سکتا۔ عصری اطلاقات ⁦(مانیٹری پالیسی، اسلامی بینکوں کی مالی معاونت اور فائض لیکویڈیٹی کی سرمایہ کاری، اوقاف کی تعمیر، سرکاری منصوبے، عارضی نجکاری)⁩ اور مناسب قانونی ڈھانچے کی سفارش۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009). Distinguió la titulización convencional —conversión de deudas en bonos con intereses, cuya emisión y negociación consideraba inadmisibles— de la titulización islámica (taskik): emisión de certificados de igual valor que representan participaciones indivisas en la propiedad de activos (activos tangibles, usufructos, derechos o una combinación que incluye efectivo y deudas), existentes o por crear a partir de los ingresos de la suscripción, emitidos bajo un contrato legal cuyas normas los rigen. Enumeró las propiedades del sukuk: una participación genuina e indivisa en la propiedad; emisión bajo un contrato legal; ausencia de garantía por parte del administrador (mudarib, wakil o socio); participación en las ganancias y pérdidas en proporción a la participación, sin porcentaje preestablecido ni suma global; riesgo de inversión total; y asunción de las cargas de propiedad de mantenimiento, seguro y depreciación. El dictaminó: el administrador de sukuk no puede comprometerse a prestar a los tenedores ni a cubrir los déficits entre las ganancias reales y las esperadas (aunque, una vez que se conozcan los resultados, puede donar la diferencia o prestarla, y lo que se convierte en costumbre cuenta como un compromiso); el administrador es un fideicomisario responsable únicamente por incumplimiento o negligencia; el reembolso no puede ser al valor nominal, sino al valor de mercado o acordado; la negociabilidad sigue los controles de la resolución 30 (4/5) (las reglas de sarf mientras los componentes son efectivo, las reglas de deuda una vez que se convierten en cuentas por cobrar, la negociación a precio negociado solo cuando predominan los activos tangibles y los usufructos); y la permisibilidad no puede utilizarse como mecanismo para garantizar deudas. Enumeró aplicaciones contemporáneas (política monetaria, financiación de bancos islámicos e inversión de su liquidez excedente, desarrollo de waqf, proyectos gubernamentales, privatización temporal) y recomendó marcos legales adecuados para la titulización."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009). Cette résolution distingue la titrisation conventionnelle – conversion de dettes en obligations portant intérêt, dont l'émission et la négociation sont jugées illicites – de la titrisation islamique (taskik): émission de certificats de valeur égale représentant des parts indivises de propriété d'actifs (biens corporels, usufruits, droits ou une combinaison de liquidités et de créances), existants ou à créer grâce au produit de la souscription, émis en vertu d'un contrat licite dont les règles régissent les actifs. Elle énumère les caractéristiques du sukuk: une véritable part de propriété indivise; une émission fondée sur un contrat licite; l'absence de garantie de la part du gestionnaire (mudarib, wakil ou associé); le partage des profits et des pertes au prorata de la participation, sans pourcentage ni montant forfaitaire prédéfinis; la prise en charge intégrale du risque d'investissement; et la prise en charge des charges liées à la propriété, notamment l'entretien, l'assurance et l'amortissement. La décision stipule que le gestionnaire de sukuk ne peut s'engager à prêter aux porteurs ni à combler l'écart entre le profit réel et le profit attendu (bien qu'il puisse, une fois les résultats connus, faire don de la différence ou prêter, et que les pratiques devenues courantes constituent un engagement); le gestionnaire est un fiduciaire responsable uniquement en cas de manquement ou de négligence; le remboursement ne peut se faire à la valeur nominale, mais à la valeur de marché ou à une valeur convenue; la négociabilité est soumise aux contrôles de la résolution 30 (4/5) (la règle du SARF s'applique lorsque les composantes sont en espèces, celle de la dette une fois qu'elles deviennent des créances, et la négociation à prix négocié uniquement lorsque les actifs corporels et les usufruits prédominent); et la permissibilité ne peut être utilisée comme un artifice pour la titrisation de dettes. Elle a énuméré les applications contemporaines (politique monétaire, financement des banques islamiques et investissement de leurs liquidités excédentaires, développement du waqf, projets gouvernementaux, privatisation temporaire) et a recommandé des cadres juridiques appropriés pour la titrisation."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dokuzuncu oturumunda (1–5 Jumada al-Awwal 1430 H, 26–30 Nisan 2009) toplu kararı yapılmıştır. Geleneksel menkul kıymetleştirme—borçların, ihraç edilemeyen veya işlem görülemeyen faiz getiri tahvillere dönüştürülmesi—ile İslami enstrümantasyon: varlık (gerçek şeyler, faydalar, haklar veya para ve borçların karışımı) sahipliğinde ortak hisseleri temsil eden, yasal sözleşmeyle çıkarılan ve hükümlerine tabi olan ortak hisseleri temsil eden belgeler çıkarılması arasında bir ayrım yapılmıştır. Sukuk özelliklerinin sayısı: gerçek mülkiyette ortak pay; meşru bir sözleşme kapsamında verilen; yönetici garantisinin olmaması (spekülatör, temsilci veya ortak); sukukların paya orantılı olarak kar ve zarar paylaşımı ve önceden belirlenmiş yüzde veya toplu tutarın kesilmesi; tam yatırım riskleri; bakım, sigorta ve amortisman gibi mülkiyet yüklerinin üstlenmesi. Karar verildi: Sukuk yöneticisi, gerçek kâr beklenenden az olduğunda kampanyasına kredi vermeyi veya bağış yapmayı taahhüt edemez (sonuç ortaya çıktıktan sonra farkı bağışlayabilir veya ödünç verebilir ve alışılmışa dönüşen rehin gibi şeyleri verebilir); yönetici güvenilirdir ve sadece ihmal veya ihmal durumunda garanti verir; sukuk nominal değeri üzerinden değil, piyasa fiyatı veya üzerinde anlaşılan fiyatla iade edilebilir; ve dolaşımı, Meclis'in 30 (4/5) sayılı kararının düzenlemelerine tabidir (nakit ödeme, borç borca dönüşürse borç kararları ve varlıklar ile faydalar karışımdan fazlaysa üzerinde anlaşılan fiyattan işlem yapmanın izinliliği); ve bunun borç tasfiyesi için bahane olarak kullanılması kabul edilemez. Güncel uygulamalardan bahsetti (para politikası, İslami bankaların finansmanı ve fazlalarının yatırımı, vakıfların yeniden inşası, devlet projeleri, geçici özelleştirme) ve darphane üretimini düzenleyen yasal çerçeveler önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430 H, 26–30 April 2009). Dibuat perbedaan antara sekuritisasi tradisional—mengubah utang menjadi obligasi yang mewakili utang berbunga yang tidak boleh diterbitkan atau diperdagangkan—dan instrumen Islam: penerbitan dokumen dengan nilai yang sama yang mewakili saham biasa dalam kepemilikan aset (barang nyata, manfaat, hak, atau campuran uang dan utang) yang ada atau berasal dari hasil langganan, yang diterbitkan melalui kontrak hukum, dan tunduk pada keputusannya. Jumlah karakteristik sukuk: saham bersama dalam kepemilikan riil; diterbitkan berdasarkan kontrak yang sah; tidak adanya jaminan manajer (spekulan, agen, atau mitra); sukuk berbagi laba rugi yang proporsional dengan saham dan menahan persentase atau jumlah sekaligus yang telah ditentukan; risiko investasi penuh; menanggung beban kepemilikan seperti pemeliharaan, asuransi, dan depresiasi. Diputuskan: Manajer sukuk tidak boleh berkomitmen untuk meminjamkan kampanye atau menyumbang jika keuntungan sebenarnya kurang dari yang diharapkan (setelah hasil muncul, ia dapat menyumbangkan atau meminjamkan selisih, dan apa yang telah menjadi kebiasaan seperti gadai); manajer dapat dipercaya dan hanya menjamin jika terjadi kelalaian atau kelalaian; sukuk tidak boleh ditebus pada nilai nominalnya tetapi pada harga pasar atau sesuai dengan kesepakatan; dan peredaran sukuk tunduk pada peraturan keputusan Majelis 30 (4/5) (pencairan uang tunai, putusan utang jika berubah menjadi utang, dan diperbolehkannya diperdagangkan pada harga yang disepakati jika aset dan manfaat lebih besar daripada campuran); dan tidak diperbolehkan menggunakan hal ini sebagai dalih penyelesaian utang. Ia menyebutkan aplikasi kontemporer (kebijakan moneter, pembiayaan bank Islam dan investasi surplusnya, rekonstruksi dana abadi, proyek pemerintah, privatisasi sementara) dan merekomendasikan kerangka hukum yang mengatur pencetakan duit."
