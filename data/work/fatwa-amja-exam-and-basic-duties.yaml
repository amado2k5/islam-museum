label: { ar: "الامتحان وطلب العلم الواجب", en: "A fateful exam and the duty to learn", ur: "امتحان اور واجب علم کی طلب", es: "Un examen fatídico y el deber de aprender." }
summary:
  ar: "سأل سائل عن طالب أمامه امتحان مهم لمستقبله ولا يجد وقتًا لطلب العلم الواجب، وعن معنى لفظ الجلالة ومحل النية في الوضوء ومعنى صفات العلم والحكمة والقدرة والسمع والبصر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78677 بتاريخ 28 أبريل 2009)⁩ أن الواجب عليه إذا نزلت به نازلة أن يرفعها إلى من يثق في دينه وعلمه من أهل العلم ويعمل بفتواه ولا يلزمه تتبع إمام بعينه وتقليده في كل اختياراته، ومعنى لفظ الجلالة الله أنه الذي تألهه القلوب محبة ورجاء وخوفًا ورغبة ويستحق أن يفرد وحده بالعبادة، والنية مقارنة لأعمال الوضوء فإذا توجه إليه استصحب النية بأن يحضر في ذهنه أنه يريد الوضوء لا مجرد التنظف، ومعنى العلم والحكمة والقدرة والسمع والبصر في أسمائه واضح لكنها على نحو يليق بجلاله وكبريائه فتثبت الصفات بلا تمثيل."
  en: "A student facing a decisive exam asked whether he must still learn obligatory knowledge, and asked the meaning of God's name, where intention sits in wudu, and the senses of knowledge, wisdom, power, hearing and sight among God's names. Dr. Salah al-Sawi (fatwa no. 78677, 28 April 2009) answered that when an issue befalls him he should refer it to a scholar he trusts in religion and learning and act on his fatwa — he need not follow one imam in all his choices; 'Allah' is the One hearts worship in love, hope, fear and desire who alone deserves worship; intention accompanies wudu's acts — entering upon it aware he intends wudu, not mere cleaning; and the meanings of knowledge, wisdom, power, hearing and sight are clear yet affirmed in a manner befitting His majesty, without likening."
  ur: "ایک طالب نے امتحان کے باعث واجب علم، نیت اور اسمائے الٰہی کے معانی پوچھے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78677، 28 اپریل 2009)⁩ کے مطابق نازلہ کسی معتمد عالم سے پوچھے؛ نیت وضو کے عمل کے ساتھ ہوتی ہے؛ صفات بلا تشبیہ ثابت ہیں۔"
  es: "Un estudiante que se enfrentaba a un examen decisivo preguntó si aún debía aprender conocimientos obligatorios y preguntó sobre el significado del nombre de Dios, dónde se ubica la intención en el wudu y los sentidos de conocimiento, sabiduría, poder, oído y vista entre los nombres de Dios. El Dr. Salah al-Sawi (fatwa n.° 78677, 28 de abril de 2009) respondió que cuando le sobreviene un problema debe consultarlo con un erudito en el que confíe en religión y conocimiento y actuar según su fatwa; no necesita seguir a un solo imán en todas sus decisiones; 'Allah' es Aquel a quien los corazones adoran con amor, esperanza, temor y deseo, quien es el único digno de adoración; la intención acompaña los actos del wudu: al realizarlo, se sabe que se pretende el wudu, no la mera limpieza; y los significados de conocimiento, sabiduría, poder, oído y vista son claros, pero se afirman de una manera apropiada para Su majestad, sin comparaciones."
