id: work/fatwa-aliftaa-jo-buying-the-sacrifice-in-instalments
class: work
kind: fatwa
label: { ar: "شراء الأضحية بالتقسيط", en: "Buying the sacrifice in instalments", ur: "قربانی کا جانور قسطوں پر خریدنا", es: "Comprar el sacrificio a plazos", fr: "Acheter le sacrifice en plusieurs fois", tr: "Kurbanlık hayvanı taksitlerle satın almak", id: "Membeli hewan pengorbanan secara cicilan" }
summary:
  ar: "سؤال عن شراء الأضحية بالتقسيط، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز شراء الأضحية بالتقسيط والاستدانة لها، ولا يستحب ذلك للفقراء، وتقدم نفقة العيال الواجبة عليه. أجابت الدائرة بأنه يجوز شراء الأضحية بالتقسيط واستدانة ثمنها، لكن لا يستحب ذلك للفقراء لأنهم غير مطالبين بالأضحية، وأشارت إلى مبدأ أن الله لا يكلف نفسًا إلا وسعها كما في [[passage/quran-2-286|سورة البقرة 2:286]]. وقالت إن ذلك إن أدى إلى تقصيره في نفقة عياله فينبغي تقديم النفقة الواجبة على الاستدانة لشراء الأضحية، واستدلت بحديث رواه مسلم معناه أن حبس القوت عمن يعولهم المرء كاف في الإثم. وذكرت أن الأضحية تصح ممن عليه دين، والأولى سداد الدين خاصة إذا كان حالًّا."
  en: "A question about buying the sacrifice in instalments, in which Jordan's General Iftaa Department answered that buying the sacrifice in instalments or borrowing for it is permitted, but not recommended for the poor, and that the obligatory maintenance of dependants comes first. The Department answered that buying the sacrifice in instalments and borrowing its price is permitted, but it is not recommended for the poor because they are not required to offer it, referring to the principle that God burdens no soul beyond its capacity, as in [[passage/quran-2-286|Surat al-Baqara 2:286]]. It said that if this would lead someone to fall short in maintaining his dependants, the obligatory maintenance should take precedence over borrowing for the sacrifice, citing a hadith narrated by Muslim whose meaning is that withholding sustenance from those in one's charge is sin enough. It noted that a sacrifice is valid from someone who is in debt, though paying the debt is preferable, especially if it is already due."
  ur: "قربانی کا جانور قسطوں پر خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قربانی قسطوں پر خریدنا یا اس کے لیے قرض لینا جائز ہے، لیکن فقرا کے لیے مستحب نہیں، اور اہل و عیال کا واجب نفقہ مقدم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی قسطوں پر خریدنا اور اس کی قیمت قرض لینا جائز ہے، لیکن فقرا کے لیے یہ مستحب نہیں کیونکہ ان سے قربانی کا مطالبہ نہیں، اور اس اصول کی طرف اشارہ کیا کہ اللہ کسی جان کو اس کی وسعت سے زیادہ مکلف نہیں کرتا، جیسا کہ [[passage/quran-2-286|سورۃ البقرہ 2:286]] میں ہے۔ اس نے کہا کہ اگر اس سے اہل و عیال کے نفقے میں کوتاہی ہو تو قربانی کے لیے قرض لینے پر واجب نفقے کو مقدم کرنا چاہیے، اور مسلم کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ آدمی کے گناہ کے لیے اتنا کافی ہے کہ وہ اپنے زیرِ کفالت لوگوں کا رزق روک لے۔ اس نے بتایا کہ مقروض کی قربانی درست ہے، البتہ قرض ادا کرنا اولیٰ ہے، خاص طور پر جب وہ واجب الادا ہو۔"
  es: "Una pregunta sobre la compra del sacrificio a plazos, a la que el Departamento General de Iftaa de Jordania respondió que comprar el sacrificio a plazos o pedir prestado para ello está permitido, pero no es recomendable para los pobres, y que el sustento obligatorio de los dependientes tiene prioridad. El Departamento respondió que comprar el sacrificio a plazos y pedir prestado su precio está permitido, pero no es recomendable para los pobres porque no están obligados a ofrecerlo, haciendo referencia al principio de que Dios no impone a ninguna alma una carga mayor de la que puede soportar, como en [[passage/quran-2-286|Surat al-Baqara 2:286]]. Dijo que si esto llevara a alguien a no poder mantener a sus dependientes, el sustento obligatorio debe tener prioridad sobre pedir prestado para el sacrificio, citando un hadiz narrado por Muslim cuyo significado es que retener el sustento a quienes están a cargo de uno es pecado suficiente. Señaló que un sacrificio es válido para alguien que está endeudado, aunque pagar la deuda es preferible, especialmente si ya venció."
  fr: "Concernant l'achat du sacrifice en plusieurs fois, le Département général de la Iftaa de Jordanie a répondu que l'achat en plusieurs fois ou le recours à un emprunt sont permis, mais déconseillés aux plus démunis, car l'entretien obligatoire des personnes à charge prime. Le Département a précisé que l'achat en plusieurs fois et l'emprunt sont permis, mais déconseillés aux pauvres, car ils ne sont pas tenus d'offrir le sacrifice. Il s'appuie sur le principe selon lequel Dieu n'impose à aucune âme une charge supérieure à ses capacités (Coran 2:286). Le Département a ajouté que si cela risque d'empêcher une personne de subvenir aux besoins de ses proches, l'entretien obligatoire doit primer sur l'emprunt, citant un hadith rapporté par Muslim selon lequel le simple fait de refuser de nourrir ceux qui sont sous sa responsabilité constitue un péché. Le Département a également indiqué qu'un sacrifice est valable même pour une personne endettée, bien que le remboursement de la dette soit préférable, surtout si elle est déjà échue."
  tr: "Kurbanın taksitli satın alınmasıyla ilgili bir soru, Ürdün Genel Fetva Dairesi, kurbanın taksitler için satın alınmasının ve borç alınmasının caiz olduğunu, fakirler için önerilmediğini ve bakmakla yükümlü olanların zorunlu bakımının sağlandığını yanıtladı. Daire, kurbanın taksitlerle satın alınmasının ve fiyatının ödünç alınmasının caiz olduğunu, ancak yoksullar için önerilmediğini, çünkü kurban ödemelerinin zorunlu olmadığını belirtti. Tanrı'nın bir ruhu kapasitesinin ötesinde yük altına almadığı ilkesine işaret etti, örneğin [[pasaj/kuran-kuran-2-286|Bakkara Suresi 2:\" 286]]. Eğer bu, bakmakla yükümlü olduklarının bakımını ihmal etmeye yol açıyorsa, zorunlu nafaka kurbanı satın almak için borç alındığında verilmesi gerektiğini belirtti. Müslümanların anlattığı bir hadis, onlara bağımlı olanlardan geçimin günah için yeterli olduğunu belirtti. Kurbanın, borçlu olanlar için geçerli olduğunu ve özellikle borç iyi durumdaysa borcun ödenmesinin tercih edildiğini belirtti."
  id: "Sebuah pertanyaan tentang pembelian kurban secara cicilan, di mana Departemen Fatwa Umum Yordania menjawab bahwa membeli kurban secara cicilan dan meminjam dari korban, dan tidak dianjurkan untuk orang miskin, serta kebutuhan wajib bagi yang bergantung disediakan untuk mereka. Departemen menjawab bahwa diperbolehkan membeli kurban secara cicilan dan meminjam harganya, tetapi tidak dianjurkan untuk orang miskin karena mereka tidak diwajibkan membayar kurban. Departemen tersebut menekankan prinsip bahwa Tuhan tidak membebani jiwa melebihi kapasitasnya, seperti dalam [[ayat/al-quran-286|Surah Al-Baqarah 2:286]]. Dikatakan bahwa jika hal ini menyebabkan pengabaian pemeliharaan tanggungan, maka tunjangan wajib harus diberikan saat meminjam untuk membeli kurban. Mereka mengutip hadits yang diceritakan oleh Muslim yang bermaksud bahwa menahan penghidupan bagi mereka yang bergantung pada mereka sudah cukup untuk dosa. Dikatakan bahwa kurban berlaku bagi mereka yang berutang, dan lebih baik membayar utang, terutama jika dalam kondisi baik."
