id: work/fatwa-aliftaa-jo-buying-the-sacrifice-in-instalments
class: work
kind: fatwa
label: { ar: "شراء الأضحية بالتقسيط", en: "Buying the sacrifice in instalments", ur: "قربانی کا جانور قسطوں پر خریدنا" }
summary:
  ar: "سؤال عن شراء الأضحية بالتقسيط، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز شراء الأضحية بالتقسيط والاستدانة لها، ولا يستحب ذلك للفقراء، وتقدم نفقة العيال الواجبة عليه. أجابت الدائرة بأنه يجوز شراء الأضحية بالتقسيط واستدانة ثمنها، لكن لا يستحب ذلك للفقراء لأنهم غير مطالبين بالأضحية، وأشارت إلى مبدأ أن الله لا يكلف نفسًا إلا وسعها كما في [[passage/quran-2-286|سورة البقرة 2:286]]. وقالت إن ذلك إن أدى إلى تقصيره في نفقة عياله فينبغي تقديم النفقة الواجبة على الاستدانة لشراء الأضحية، واستدلت بحديث رواه مسلم معناه أن حبس القوت عمن يعولهم المرء كاف في الإثم. وذكرت أن الأضحية تصح ممن عليه دين، والأولى سداد الدين خاصة إذا كان حالًّا."
  en: "A question about buying the sacrifice in instalments, in which Jordan's General Iftaa Department answered that buying the sacrifice in instalments or borrowing for it is permitted, but not recommended for the poor, and that the obligatory maintenance of dependants comes first. The Department answered that buying the sacrifice in instalments and borrowing its price is permitted, but it is not recommended for the poor because they are not required to offer it, referring to the principle that God burdens no soul beyond its capacity, as in [[passage/quran-2-286|Surat al-Baqara 2:286]]. It said that if this would lead someone to fall short in maintaining his dependants, the obligatory maintenance should take precedence over borrowing for the sacrifice, citing a hadith narrated by Muslim whose meaning is that withholding sustenance from those in one's charge is sin enough. It noted that a sacrifice is valid from someone who is in debt, though paying the debt is preferable, especially if it is already due."
  ur: "قربانی کا جانور قسطوں پر خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قربانی قسطوں پر خریدنا یا اس کے لیے قرض لینا جائز ہے، لیکن فقرا کے لیے مستحب نہیں، اور اہل و عیال کا واجب نفقہ مقدم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی قسطوں پر خریدنا اور اس کی قیمت قرض لینا جائز ہے، لیکن فقرا کے لیے یہ مستحب نہیں کیونکہ ان سے قربانی کا مطالبہ نہیں، اور اس اصول کی طرف اشارہ کیا کہ اللہ کسی جان کو اس کی وسعت سے زیادہ مکلف نہیں کرتا، جیسا کہ [[passage/quran-2-286|سورۃ البقرہ 2:286]] میں ہے۔ اس نے کہا کہ اگر اس سے اہل و عیال کے نفقے میں کوتاہی ہو تو قربانی کے لیے قرض لینے پر واجب نفقے کو مقدم کرنا چاہیے، اور مسلم کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ آدمی کے گناہ کے لیے اتنا کافی ہے کہ وہ اپنے زیرِ کفالت لوگوں کا رزق روک لے۔ اس نے بتایا کہ مقروض کی قربانی درست ہے، البتہ قرض ادا کرنا اولیٰ ہے، خاص طور پر جب وہ واجب الادا ہو۔"
