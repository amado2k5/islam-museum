id: work/fatwa-aliftaa-jo-lending-company-shares
class: work
kind: fatwa
label: { ar: "اقتراض أسهم الشركات", en: "Borrowing company shares", ur: "کمپنیوں کے حصص قرض لینا" }
summary:
  ar: "سؤال عن اقتراض أسهم شركات وردها لاحقًا مقابل شيك يبقى ضمانًا، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز إقراض الأسهم لتقلب قيمتها وتعذر رد مثلها. أجابت الدائرة بأن القرض دفع مال لمن ينتفع به ليرد مثله، وأنه مباح للمقترض مندوب للمقرض. وقالت إن الأسهم حصص شائعة في ملكية الشركات المساهمة تتغير قيمتها بتغير موجودات الشركة وأنشطتها، فيتعذر رد مثلها، وقد يكون الفرق بين قيمتها عند القرض وعند الرد كبيرًا فيقع الغبن الفاحش. ونقلت عن المعيار الشرعي رقم 24 من المعايير الشرعية للمؤسسات المالية الإسلامية أن مستند عدم جواز إقراض الأسهم أنها عند الرد ليست مثلًا لها عند القرض بسبب التغير المستمر في موجودات الشركة. وخلصت إلى أنه لا يجوز إقراض أسهم الشركات لتقلب قيمها الكبير."
  en: "A question about borrowing company shares and returning them later against a cheque held as security, in which Jordan's General Iftaa Department answered that shares may not be lent, because their value fluctuates and like-for-like return is impossible. The Department answered that a loan is handing over property to someone who benefits from it so that he returns its like, and that it is permitted for the borrower and recommended for the lender. It said shares are undivided portions of ownership in joint-stock companies whose value changes with the company's assets and activities, so their like cannot be returned; the gap between their value when lent and when returned may be large, causing gross unfairness. It cited Sharia Standard No. 24 of the Shari'ah Standards for Islamic Financial Institutions, which bases the prohibition on lending shares on the fact that, given the constant change in a company's assets, shares at the time of return are not the like of what they were when lent. It concluded that company shares may not be lent, given the large fluctuation in their value."
  ur: "کمپنیوں کے حصص قرض لے کر بعد میں واپس کرنے اور ضمانت کے طور پر چیک دینے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ حصص قرض دینا جائز نہیں، کیونکہ ان کی قیمت بدلتی رہتی ہے اور ان کا مثل واپس کرنا ممکن نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض کسی کو مال دینا ہے تاکہ وہ اس سے فائدہ اٹھا کر اس کا مثل واپس کرے، اور یہ قرض لینے والے کے لیے مباح اور قرض دینے والے کے لیے مستحب ہے۔ اس نے کہا کہ حصص مشترکہ اسٹاک کمپنیوں کی ملکیت میں غیر منقسم حصے ہیں جن کی قیمت کمپنی کے اثاثوں اور سرگرمیوں کے ساتھ بدلتی ہے، اس لیے ان کا مثل واپس نہیں ہو سکتا؛ قرض اور واپسی کے وقت کی قیمت میں بڑا فرق ہو سکتا ہے جس سے شدید نقصان ہوتا ہے۔ اس نے اسلامی مالیاتی اداروں کے شرعی معیارات کے معیار نمبر 24 سے نقل کیا کہ حصص قرض دینے کی ممانعت کی بنیاد یہ ہے کہ کمپنی کے اثاثوں میں مسلسل تبدیلی کی وجہ سے واپسی کے وقت حصص قرض کے وقت والے حصص کا مثل نہیں رہتے۔ اس نے نتیجہ نکالا کہ کمپنیوں کے حصص کی قیمت میں بڑے اتار چڑھاؤ کی وجہ سے انہیں قرض دینا جائز نہیں۔"
