label: { ar: "حكم اختراق الهاكر لحسابات المعتدين على الناس", en: "A hacker breaking into the accounts of those who wrong people", ur: "لوگوں پر ظلم کرنے والوں کے اکاؤنٹس ہیک کرنے کا حکم" }
summary:
  ar: "سائل سأل عن قيام هاكر باختراق حسابات أشخاص بحجة أنهم معتدون على الناس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22220)⁩ أن ذلك حرام شرعًا ولا يحل فعله بطلب من أحد، على ما فصّل الجواب من حرمة التعدي على أموال الناس وخصوصياتهم."
  en: "A questioner asked about a hacker breaking into people's accounts on the plea that they are wrongdoers against others. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22220) answered that this is forbidden in the sharia and may not be done even at another's request — the answer details the sanctity of people's property and privacy."
  ur: "ایک سائل نے پوچھا کہ کوئی ہیکر لوگوں پر ظلم کرنے والوں کے اکاؤنٹس ہیک کرے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22220)⁩ نے جواب دیا کہ یہ شرعاً حرام ہے اور کسی کے کہنے پر بھی جائز نہیں — جواب میں لوگوں کے مال اور نجیت کی حرمت کی تفصیل بیان ہوئی۔"
