label: { ar: "حكم سداد ورثة الكفيل الدين المؤجل على الميت بالكفالة", en: "Must the guarantor's heirs pay a guaranteed deferred debt on his death?", ur: "کفیل کے ورثاء پر مؤجل قرض کی ادائیگی" }
summary:
  ar: "سائل سأل عن سداد ورثة الكفيل الدين المؤجل المكفول به بمجرد موت الكفيل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21559)⁩ أن كفالة الدين لا تنقضي بموت الكفيل بل ينتقل التزامه بأداء الدين المكفول إلى تركته وتنتقل مطالبة الدائن إلى ورثته في حدود التركة على ما فصّل الجواب."
  en: "A questioner asked whether the guarantor's heirs must pay the guaranteed deferred debt upon his death. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21559) answered that a debt guarantee does not lapse at the guarantor's death: the obligation passes to his estate and the creditor's claim to the heirs within its limits — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا کفیل کی وفات پر اس کے ورثاء کو کفالت شدہ مؤجل قرض ادا کرنا ہوگا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21559)⁩ نے جواب دیا کہ کفالت وفات سے ختم نہیں ہوتی بلکہ ذمہ داری ترکہ کو منتقل ہوتی ہے اور قرض خواہ کا مطالبہ ورثاء پر ترکہ کی حد تک ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
