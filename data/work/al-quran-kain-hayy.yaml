label: { ar: "القرآن كائن حي", en: "al-Qur'an Ka'in Hayy", ur: "القرآن کائن حی", es: "al-Qur'an Ka'in Hayy", fr: "al-Qur'an Ka'in Hayy", tr: "Kur'an yaşayan bir varlıktır", id: "Al-Qur'an adalah makhluk hidup" }
summary:
  ar: "كتاب مقالات لمصطفى محمود يرى في مقالته الأولى أن للقرآن «معماراً» أو «ترابطاً حياً» بين الكلمة والكلمة يشبه الكائن الحي، فالكلمة فيه كالخلية تتكرر ولا تتكرر، وتنتقل من الإجمال إلى التفصيل؛ ويتناول في فصول أخرى النفس والروح، ولماذا خلقنا الله، وأسلوب خطبة الجمعة، والعلوم الذرية والطب والإسلام، والجبر والاختيار {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}."
  en: "A book of essays by Mostafa Mahmoud whose first essay holds that the Qur'an has an 'architecture' or 'living connection' between word and word like a living organism: each word is like a cell that repeats yet never repeats, moving from the general to the detailed; other chapters treat the self and the spirit, why God created us, the style of the Friday sermon, atomic science, medicine and Islam, and freedom and determinism {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}."
  ur: "مصطفیٰ محمود کے مضامین کی کتاب، جس کے پہلے مضمون میں وہ کہتے ہیں کہ قرآن میں لفظ اور لفظ کے درمیان ایک «معمار» یا «زندہ ربط» ہے جو جاندار جیسا ہے: ہر لفظ خلیے کی طرح دہرایا جاتا ہے مگر کبھی دہرایا نہیں جاتا، اور اجمال سے تفصیل کی طرف جاتا ہے؛ دوسرے ابواب نفس اور روح، اللہ نے ہمیں کیوں پیدا کیا، خطبۂ جمعہ کا اسلوب، ایٹمی علوم، طب اور اسلام، اور جبر و اختیار پر ہیں {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}۔"
  es: "Un libro de ensayos de Mostafa Mahmoud cuyo primer ensayo sostiene que el Corán tiene una \"arquitectura\" o \"conexión viva\" entre palabra y palabra como un organismo vivo: cada palabra es como una célula que se repite pero nunca se repite, pasando de lo general a lo detallado; otros capítulos tratan sobre el yo y el espíritu, por qué Dios nos creó, el estilo del sermón del viernes, la ciencia atómica, la medicina y el Islam, y la libertad y el determinismo {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}."
  fr: "Un recueil d'essais de Mostafa Mahmoud dont le premier essai soutient que le Coran possède une « architecture » ou une « connexion vivante » entre les mots, à l'image d'un organisme vivant: chaque mot est comme une cellule qui se répète sans jamais se répéter à l'identique, passant du général au détaillé; d'autres chapitres traitent du soi et de l'esprit, des raisons pour lesquelles Dieu nous a créés, du style du sermon du vendredi, de la science atomique, de la médecine et de l'islam, ainsi que de la liberté et du déterminisme {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}."
  tr: "Mustafa Mahmoud'un 'Maqalat' adlı kitabı, ilk denemesinde Kur'an'ın kelime ile kelime arasında yaşayan bir varlık gibi bir 'mimari' veya 'canlı bağlantı' olduğunu görür. İçindeki kelime bir hücre gibidir; tekrarlayan ve tekrarlamayan, genelden ayrıntıya doğru ilerler; diğer bölümlerde ruh ve ruha, Tanrı'nın bizi neden yarattığına, Cuma vaazının tarzına, atom bilimlerine, tıpta, İslam'a, kadere ve özgür iradeye değinir {cite:mm-kuran-kain-hayy-maarif-1993 s. 4} {cite:mm-quran-kain-hayy-maarif-1993 s. 135}}"
  id: "Buku 'Maqalat' karya Mustafa Mahmoud melihat dalam esai pertamanya bahwa Al-Qur'an memiliki 'arsitektur' atau 'hubungan hidup' antara kata dan kata, mirip dengan makhluk hidup. Kata di dalamnya seperti sel, berulang dan tidak berulang, bergerak dari umum ke detail; dalam bab-bab lain, ia membahas jiwa dan roh, mengapa Allah menciptakan kita, gaya khotbah Jumat, ilmu atom, kedokteran, Islam, takdir, dan kehendak bebas {cite:mm-quran-kain-hayy-maarif-1993 hlm. 4} {cite:mm-quran-kain-hayy-maarif-1993 hlm. 135}."
