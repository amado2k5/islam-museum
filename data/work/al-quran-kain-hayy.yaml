summary:
  ar: "كتاب مقالات لمصطفى محمود يرى في مقالته الأولى أن للقرآن «معماراً» أو «ترابطاً حياً» بين الكلمة والكلمة يشبه الكائن الحي، فالكلمة فيه كالخلية تتكرر ولا تتكرر، وتنتقل من الإجمال إلى التفصيل؛ ويتناول في فصول أخرى النفس والروح، ولماذا خلقنا الله، وأسلوب خطبة الجمعة، والعلوم الذرية والطب والإسلام، والجبر والاختيار {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}."
  en: "A book of essays by Mostafa Mahmoud whose first essay holds that the Qur'an has an 'architecture' or 'living connection' between word and word like a living organism: each word is like a cell that repeats yet never repeats, moving from the general to the detailed; other chapters treat the self and the spirit, why God created us, the style of the Friday sermon, atomic science, medicine and Islam, and freedom and determinism {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}."
  ur: "مصطفیٰ محمود کے مضامین کی کتاب، جس کے پہلے مضمون میں وہ کہتے ہیں کہ قرآن میں لفظ اور لفظ کے درمیان ایک «معمار» یا «زندہ ربط» ہے جو جاندار جیسا ہے: ہر لفظ خلیے کی طرح دہرایا جاتا ہے مگر کبھی دہرایا نہیں جاتا، اور اجمال سے تفصیل کی طرف جاتا ہے؛ دوسرے ابواب نفس اور روح، اللہ نے ہمیں کیوں پیدا کیا، خطبۂ جمعہ کا اسلوب، ایٹمی علوم، طب اور اسلام، اور جبر و اختیار پر ہیں {cite:mm-quran-kain-hayy-maarif-1993 p. 4} {cite:mm-quran-kain-hayy-maarif-1993 p. 135}۔"
