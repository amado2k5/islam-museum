id: work/fatwa-aliftaa-jo-lending-gold-and-repaying-in-gold
class: work
kind: fatwa
label: { ar: "إقراض الذهب واشتراط أجرة الصياغة عند الوفاء", en: "Lending gold and requiring the workmanship fee on repayment", ur: "سونا قرض دینا اور واپسی پر بنوائی کی اجرت کی شرط", es: "Prestar oro y exigir el pago de la tarifa de mano de obra al devolverlo.", fr: "Prêter de l'or et exiger des frais de main-d'œuvre au remboursement" }
summary:
  ar: "سؤال عمن يقرض أخته قطعة ذهب لتبيعها، على أن تردها قطعة بالوزن نفسه تتحمل هي أجرة صياغتها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الواجب رد مثل الذهب وزنًا وصفة، وأن اشتراط أجرة الصياغة لا يجوز لأنه ربا. أجابت الدائرة بأن الأصل في وفاء قرض الذهب أن يُرد ذهبًا بمقداره ووزنه وصفته، مستشهدة بحديث الذهب بالذهب وزنًا بوزن، وأن الزيادة إن كانت مشروطة فهي ربا، وإن كانت بلا شرط فهي من حسن القضاء. وقالت إن اشتراط المقرض أن يتحمل المقترض أجرة الصياغة لا يجوز، لأن الذهب من الأموال الربوية التي تجب فيها المماثلة عند مبادلته بجنسه، والعبرة بتساوي وزن الذهب الصافي لا بالجودة ولا بالصياغة. واستشهدت بقول تقي الدين السبكي في تكملة المجموع إن الشرع أسقط اعتبار الجودة، وبقول الشافعي في الأم إنه لا خير في مصارفة الصائغ الفضة بالحلي مع إعطائه أجرته لأنه تفاضل. وأضافت أنه لا يضر رد قطعة جديدة بدل قديمة بشرط التماثل وزنًا وصفة."
  en: "A question from someone lending her sister a piece of gold to sell, to be repaid with a piece of the same weight whose workmanship fee the sister bears, in which Jordan's General Iftaa Department answered that the like of the gold must be returned in weight and kind, and that requiring the workmanship fee is not allowed because it is riba. The Department answered that a gold loan is in principle repaid in gold of the same amount, weight and kind, citing the hadith requiring gold for gold weight for weight, and that an increase is riba if stipulated, but good repayment if given without stipulation. It said the lender may not require the borrower to bear the workmanship fee, because gold is one of the riba-bearing goods that must be exchanged like for like against its own kind, and what counts is equal weight of pure gold, not quality or workmanship. It cited Taqi al-Din al-Subki's completion of al-Majmu' that the sharia disregards quality, and al-Shafi'i's al-Umm that it is wrong to exchange silver with a smith for wrought silver jewellery while also paying his fee, since that is an unequal exchange. It added that returning a new piece for an old one does no harm, provided weight and kind are equal."
  ur: "ایک خاتون کا سوال جو اپنی بہن کو بیچنے کے لیے سونے کا ٹکڑا قرض دینا چاہتی ہے، اس شرط پر کہ وہ اسی وزن کا ٹکڑا لوٹائے جس کی بنوائی کی اجرت بہن دے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونے کا مثل وزن اور صفت میں لوٹانا لازم ہے، اور بنوائی کی اجرت کی شرط سود ہونے کی وجہ سے جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ سونے کا قرض اصولاً اسی مقدار، وزن اور صفت کے سونے سے ادا ہوتا ہے، اور سونے کے بدلے سونا برابر وزن والی حدیث سے استدلال کیا، اور کہا کہ اضافہ اگر شرط ہو تو سود ہے، اور بغیر شرط ہو تو اچھی ادائیگی ہے۔ اس نے کہا کہ قرض دینے والا قرض لینے والے پر بنوائی کی اجرت کی شرط نہیں لگا سکتا، کیونکہ سونا ان سودی اموال میں سے ہے جن کا اپنی جنس سے تبادلہ برابری کے ساتھ لازم ہے، اور اعتبار خالص سونے کے برابر وزن کا ہے، معیار یا بنوائی کا نہیں۔ اس نے تقی الدین السبکی کی تکملۃ المجموع سے استدلال کیا کہ شریعت نے معیار کا اعتبار ساقط کیا ہے، اور شافعی کی الام سے کہ سنار سے چاندی کے بدلے بنی ہوئی چاندی کے زیور لینا اور ساتھ اجرت دینا درست نہیں کیونکہ یہ کمی بیشی ہے۔ اس نے مزید کہا کہ پرانے ٹکڑے کے بدلے نیا ٹکڑا لوٹانے میں حرج نہیں بشرطیکہ وزن اور صفت برابر ہوں۔"
  es: "Una persona que prestaba oro a su hermana para venderlo, con la condición de devolverlo con otra pieza del mismo peso cuyo coste de mano de obra correría a cargo de la hermana, consultó con el Departamento General de Iftaa de Jordania, que dictaminó que el oro debe devolverse en peso y especie, y que exigir el pago de dicho coste no está permitido por ser usura (riba). El Departamento explicó que un préstamo de oro se devuelve, en principio, con oro de la misma cantidad, peso y especie, citando el hadiz que exige oro por oro, peso por peso, y que un incremento es usura si está estipulado, pero un buen reembolso si se da sin estipulación. Añadió que el prestamista no puede exigir al prestatario que pague el coste de mano de obra, ya que el oro es uno de los bienes que generan usura y debe intercambiarse por otro igual, y lo que cuenta es el peso equivalente de oro puro, no la calidad ni la mano de obra. Citaba la obra de Taqi al-Din al-Subki, al-Majmu', que afirma que la sharia no tiene en cuenta la calidad, y la de al-Shafi'i, al-Umm, que sostiene que es incorrecto intercambiar plata con un orfebre por joyas de plata labrada, pagándole además sus honorarios, puesto que se trata de un intercambio desigual. Añadía que devolver una pieza nueva por una antigua no supone ningún problema, siempre que el peso y el tipo sean iguales."
  fr: "Une question a été posée par une personne qui prêtait à sa sœur un morceau d'or destiné à être vendu, et qui devait être remboursée par un morceau de même poids dont les frais de fabrication seraient à la charge de la sœur. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que l'or devait être restitué à l'identique en poids et en nature, et que l'exigence de frais de fabrication était interdite car elle constituait un abus de droit (riba). Le Département a expliqué qu'un prêt d'or se rembourse en principe en or de même quantité, poids et nature, citant un hadith exigeant un remboursement d'or au poids. Il a ajouté qu'une augmentation de prix est considérée comme un abus de droit (riba) si elle est stipulée, mais qu'un remboursement est légitime si elle est effectuée sans stipulation. Le Département a précisé que le prêteur ne pouvait exiger de l'emprunteur le paiement des frais de fabrication, car l'or fait partie des biens soumis à l'abus de droit (riba) qui doivent être échangés à l'identique contre un bien de même nature. Seul le poids égal d'or pur compte, et non sa qualité ou le travail effectué. L'ouvrage cite l'achèvement d'al-Majmu' par Taqi al-Din al-Subki, selon lequel la charia ne tient pas compte de la qualité, et al-Umm d'al-Shafi'i, qui interdit d'échanger de l'argent avec un forgeron contre des bijoux en argent travaillé tout en payant sa rémunération, car il s'agit d'un échange inégal. Il ajoute que le retour d'une pièce neuve en échange d'une ancienne n'est pas préjudiciable, à condition que le poids et la nature soient identiques."
