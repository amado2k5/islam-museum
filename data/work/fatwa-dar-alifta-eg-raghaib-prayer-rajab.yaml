id: work/fatwa-dar-alifta-eg-raghaib-prayer-rajab
class: work
kind: fatwa
label: { ar: "حكم صلاة الرغائب في شهر رجب", en: "The Ragha'ib prayer in Rajab", ur: "رجب میں نمازِ رغائب کا حکم", es: "La oración Ragha'ib en Rajab", fr: "La prière Ragha'ib en Rajab", tr: "Rajab ayında Salat al-Raghaib üzerine verilen hüküm", id: "Putusan tentang Salat al-Raghaib pada bulan Rajab" }
summary:
  ar: "سائل سأل عن صلاة الرغائب في أول ليلة جمعة من رجب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22375)⁩ أنه لم يثبت بحديث صحيح عن رسول الله صلاة مخصوصة في تلك الليلة، وبيّن الجواب ما يتبع من حكم فعلها على هذا الأصل."
  en: "A questioner asked about the Ragha'ib prayer on the first Friday night of Rajab. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22375) answered that no sound hadith establishes a specific prayer on that night, and the answer sets out what follows for the ruling on performing it on that basis."
  ur: "ایک سائل نے رجب کی پہلی جمعہ کی رات نمازِ رغائب کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22375)⁩ نے جواب دیا کہ اس رات کوئی خاص نماز صحیح حدیث سے ثابت نہیں، اور جواب میں اس بنا پر اسے پڑھنے کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre la oración de Ragha'ib en la primera noche del viernes de Rajab. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22375) respondió que ningún hadiz auténtico establece una oración específica para esa noche, y la respuesta expone lo que sigue para la norma sobre realizarla sobre esa base."
  fr: "Un internaute a posé une question concernant la prière de Ragha'ib du premier vendredi soir de Rajab. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22375) a répondu qu'aucun hadith authentique n'établit de prière spécifique pour cette nuit-là, et expose ci-après la décision relative à son accomplissement."
  tr: "Bir soru soran kişi, Cuma gecesinin ilk gecesi Raghaib namazının namazını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22375), Allah'ın Resulef'inden o gece özel bir namaz olduğuna dair gerçek bir hadis olmadığını ve cevabın bu ilkeye göre namaz kılınacağına dair hükmünü netleştirdiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang shalat Raghaib pada malam pertama Jumat di Rajab. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22375) menjawab bahwa tidak ada hadits otentik dari Rasulullah bahwa ada shalat khusus pada malam itu, dan jawabannya menjelaskan aturan pelaksanaan sesuai prinsip ini."
