id: work/fatwa-amja-what-is-bida
class: work
kind: fatwa
label: { ar: "ما هي البدعة الضلالة", en: "What is the misguided innovation", ur: "گمراہ کن بدعت کیا ہے", es: "¿Cuál es la innovación mal encaminada?", fr: "Quelle est l'innovation malavisée ?", tr: "Yanlış yönlendirilmiş sapkınlık nedir?", id: "Apa itu bid'ah yang salah arah?" }
summary:
  ar: "سأل سائل يكثر سماع كلمة بدعة من المشايخ وطلاب العلم فيحرج عن شرح البدعة الضلالة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78452 بتاريخ 3 أبريل 2009)⁩ أن البدعة كل ما أحدث في الدين ولم يكن منه مما يراد به التعبد لله، أو هي كما قال الشاطبي طريقة مخترعة في الدين تضاهي الشرعية يقصد بالسلوك عليها المبالغة في التعبد لله، وكل ما كان من هذا القبيل مذموم لقوله وكل محدثة بدعة وكل بدعة ضلالة، ومن أجمل الكتب وأنفعها في هذا المقام كتاب الاعتصام للشاطبي."
  en: "A questioner who keeps hearing 'innovation' from the shaykhs and students asked for an explanation of the misguided innovation. Dr. Salah al-Sawi (fatwa no. 78452, 3 April 2009) answered that bida is whatever is newly made in the religion, not of it, intended as worship of God — or as al-Shatibi defined it, a contrived religious way resembling the lawful, the following of which aims at exaggeration in worshipping God; whatever is of this kind is blameworthy per 'every novelty is innovation, every innovation misguidance', and among the finest and most useful books on the matter is al-Shatibi's al-I'tisam."
  ur: "ایک سائل نے بدعت ضلالت کی تعریف پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78452، 3 اپریل 2009)⁩ کے مطابق بدعت وہ نئی چیز ہے جو دین میں عبادت کے طور پر ایجاد ہو — شاطبی کی اعتصام اس میں بہترین کتاب ہے۔"
  es: "Un consultante que oye hablar constantemente de \"innovación\" por parte de los jeques y estudiantes solicitó una explicación sobre esta innovación errónea. El Dr. Salah al-Sawi (fatwa n.º 78452, 3 de abril de 2009) respondió que la bid'ah (innovación religiosa) es todo aquello que se introduce en la religión, que no forma parte de ella, y que pretende ser un culto a Dios; o, como lo definió al-Shatibi, una práctica religiosa artificial que se asemeja a la lícita, cuyo seguimiento busca la exageración en la adoración a Dios. Todo lo que sea de este tipo es censurable, pues \"toda novedad es innovación, toda innovación es extravío\", y entre los mejores y más útiles libros sobre el tema se encuentra al-I'tisam de al-Shatibi."
  fr: "Un internaute, entendant constamment parler d’« innovation » par les cheikhs et les étudiants, a demandé une explication de cette innovation erronée. Le Dr Salah al-Sawi (fatwa n° 78452, 3 avril 2009) a répondu que la bida désigne tout ce qui est introduit de manière nouvelle dans la religion, qui n’en fait pas partie et qui est destiné à l’adoration de Dieu – ou, selon la définition d’al-Shatibi, une pratique religieuse artificielle ressemblant à la licite, dont le but est d’exagérer dans l’adoration de Dieu; tout ce qui est de cette nature est blâmable, car « toute nouveauté est innovation, toute innovation est égarement », et parmi les ouvrages les plus pertinents et les plus utiles sur le sujet figure al-I'tisam d’al-Shatibi."
  tr: "'bid'ah' kelimesini sık sık şeyhlerden ve bilgi öğrencilerinden duyan ve yanlış yönlendirilmiş yeniliği açıklamaktan utanan bir sorgulayıcıdır. Dr. Salah Al-Sawi (3 Nisan 2009 tarihli 78452 No. Fetva) yeniliğin, Allah'a ibadet etmek amacıyla yapılmayan, dini her şeyin tanıtılması olduğunu veya Al-Shatibi'nin dediği gibi, meşruiyetle yarışan bir din yöntemi olduğunu ve bunu takip ederek Allah'a ibadet etmeyi abartmayı amaçladığını yanıtladı. Tüm bu şeyler onun sözleri yüzünden suçludur, her yenilik bir yeniliktir ve her yenilik yanıltmadır. Bu konuda en güzel ve faydalı kitaplardan biri Al-Shatibi'nin Al-I'tisam adlı eseridir."
  id: "Seorang penanya yang sering mendengar kata 'bid'ah' dari para sheikh dan pelajar ilmu pengetahuan dan merasa malu menjelaskan inovasi yang keliru ini. Dr. Salah Al-Sawi menjawab (Fatwa No. 78452 tanggal 3 April 2009) bahwa inovasi adalah segala sesuatu yang diperkenalkan dalam agama yang tidak dimaksudkan untuk menyembah Allah, atau seperti yang dikatakan Al-Shatibi, itu adalah metode yang diciptakan dalam agama yang menyaingi legitimasi, dan dengan mengikutinya, ia dimaksudkan untuk melebih-lebihkan penyembahan kepada Allah. Semua hal seperti itu patut dipersalahkan karena kata-katanya, dan setiap inovasi adalah inovasi, dan setiap inovasi adalah kekeliruan. Salah satu kitab yang paling indah dan bermanfaat dalam hal ini adalah Al-I'tisam karya Al-Shatibi."
