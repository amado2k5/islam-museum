id: work/fatwa-amja-what-is-bida
class: work
kind: fatwa
label: { ar: "ما هي البدعة الضلالة", en: "What is the misguided innovation", ur: "گمراہ کن بدعت کیا ہے", es: "¿Cuál es la innovación mal encaminada?" }
summary:
  ar: "سأل سائل يكثر سماع كلمة بدعة من المشايخ وطلاب العلم فيحرج عن شرح البدعة الضلالة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78452 بتاريخ 3 أبريل 2009)⁩ أن البدعة كل ما أحدث في الدين ولم يكن منه مما يراد به التعبد لله، أو هي كما قال الشاطبي طريقة مخترعة في الدين تضاهي الشرعية يقصد بالسلوك عليها المبالغة في التعبد لله، وكل ما كان من هذا القبيل مذموم لقوله وكل محدثة بدعة وكل بدعة ضلالة، ومن أجمل الكتب وأنفعها في هذا المقام كتاب الاعتصام للشاطبي."
  en: "A questioner who keeps hearing 'innovation' from the shaykhs and students asked for an explanation of the misguided innovation. Dr. Salah al-Sawi (fatwa no. 78452, 3 April 2009) answered that bida is whatever is newly made in the religion, not of it, intended as worship of God — or as al-Shatibi defined it, a contrived religious way resembling the lawful, the following of which aims at exaggeration in worshipping God; whatever is of this kind is blameworthy per 'every novelty is innovation, every innovation misguidance', and among the finest and most useful books on the matter is al-Shatibi's al-I'tisam."
  ur: "ایک سائل نے بدعت ضلالت کی تعریف پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78452، 3 اپریل 2009)⁩ کے مطابق بدعت وہ نئی چیز ہے جو دین میں عبادت کے طور پر ایجاد ہو — شاطبی کی اعتصام اس میں بہترین کتاب ہے۔"
  es: "Un consultante que oye hablar constantemente de \"innovación\" por parte de los jeques y estudiantes solicitó una explicación sobre esta innovación errónea. El Dr. Salah al-Sawi (fatwa n.º 78452, 3 de abril de 2009) respondió que la bid'ah (innovación religiosa) es todo aquello que se introduce en la religión, que no forma parte de ella, y que pretende ser un culto a Dios; o, como lo definió al-Shatibi, una práctica religiosa artificial que se asemeja a la lícita, cuyo seguimiento busca la exageración en la adoración a Dios. Todo lo que sea de este tipo es censurable, pues \"toda novedad es innovación, toda innovación es extravío\", y entre los mejores y más útiles libros sobre el tema se encuentra al-I'tisam de al-Shatibi."
