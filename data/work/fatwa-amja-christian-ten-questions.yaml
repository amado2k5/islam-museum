label: { ar: "أسئلة نصراني عن الإسلام", en: "A Christian's ten questions on Islam", ur: "مسیحی کے دس سوالات", es: "Diez preguntas de un cristiano sobre el Islam" }
summary:
  ar: "سأل رجل نصراني قرأ بعض مقالات الموقع عن عشرة استفسارات منها موضوع الجنة في الإسلام وتحريف الإنجيل. أجاب د. وليد بسيوني ⁦(فتوى رقم 21842 بتاريخ 20 يوليو 2006)⁩ أنه بعد بعثة محمد لا يحصل المؤمن إيمانه ويصح توحيده إلا بالإيمان بنبوته إذا سمع به وبلغته دعوته، والإسلام يطلق على كل مؤمن من الأمم السابقة كما يطلق إطلاقًا خاصًا على أتباع محمد، وأما تحريف الإنجيل فهو أظهر من أن يستدل عليه فإن كتبة الأناجيل أنفسهم لا يعرفون ولا يعلم من ترجم الإنجيل ولا من رواه بأسانيد متصلة فضلًا عن التناقض الموجود بينها والذي أقر به علماء النصارى أنفسهم."
  en: "A Christian reader of the site's articles put ten questions, including paradise in Islam and the corruption of the Gospel. Dr. Walid Basyouni (fatwa no. 21842, 20 July 2006) answered among them that after Muhammad's mission no believer's faith stands nor his tawhid is sound except by believing in his prophethood once he hears of him and his call reaches him — 'Islam' naming every believer of the earlier nations and, specially, Muhammad's followers; and the Gospel's corruption is plainer than needing proof: the Gospel writers themselves are unknown, no one knows who translated or transmitted them by connected chains, let alone the contradictions among them admitted by Christian scholars themselves. Recorded as AMJA's answer."
  ur: "ایک مسیحی نے اسلام پر دس سوالات کیے۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21842، 20 جولائی 2006)⁩ کے مطابق محمد کی نبوت کا ایمان ہر امت کے مومن پر لازم ہے؛ انجیل کے ناقلین اور سلسلہ نقل مجہول ہیں — اہل کتاب کے علماء بھی تناقض مانتے ہیں۔"
  es: "Un lector cristiano de los artículos del sitio formuló diez preguntas, entre ellas sobre el paraíso en el Islam y la corrupción del Evangelio. El Dr. Walid Basyouni (fatwa n.° 21842, 20 de julio de 2006) respondió que, tras la misión de Mahoma, la fe de ningún creyente se mantiene firme ni su tawhid es válido si no cree en su profecía una vez que oye hablar de él y recibe su llamado; el término «Islam» se refiere a todos los creyentes de las naciones anteriores y, especialmente, a los seguidores de Mahoma. Además, la corrupción del Evangelio es evidente: se desconoce quiénes son los evangelistas, quiénes los tradujeron o transmitieron mediante cadenas de transmisión, y mucho menos las contradicciones entre ellos, admitidas incluso por los propios eruditos cristianos. Esta respuesta fue registrada por AMJA."
