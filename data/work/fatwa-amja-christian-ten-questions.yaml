label: { ar: "أسئلة نصراني عن الإسلام", en: "A Christian's ten questions on Islam", ur: "مسیحی کے دس سوالات", es: "Diez preguntas de un cristiano sobre el Islam", fr: "Dix questions d'un chrétien sur l'islam", tr: "İslam hakkında Hristiyan soruları", id: "Pertanyaan Kristen tentang Islam" }
summary:
  ar: "سأل رجل نصراني قرأ بعض مقالات الموقع عن عشرة استفسارات منها موضوع الجنة في الإسلام وتحريف الإنجيل. أجاب د. وليد بسيوني ⁦(فتوى رقم 21842 بتاريخ 20 يوليو 2006)⁩ أنه بعد بعثة محمد لا يحصل المؤمن إيمانه ويصح توحيده إلا بالإيمان بنبوته إذا سمع به وبلغته دعوته، والإسلام يطلق على كل مؤمن من الأمم السابقة كما يطلق إطلاقًا خاصًا على أتباع محمد، وأما تحريف الإنجيل فهو أظهر من أن يستدل عليه فإن كتبة الأناجيل أنفسهم لا يعرفون ولا يعلم من ترجم الإنجيل ولا من رواه بأسانيد متصلة فضلًا عن التناقض الموجود بينها والذي أقر به علماء النصارى أنفسهم."
  en: "A Christian reader of the site's articles put ten questions, including paradise in Islam and the corruption of the Gospel. Dr. Walid Basyouni (fatwa no. 21842, 20 July 2006) answered among them that after Muhammad's mission no believer's faith stands nor his tawhid is sound except by believing in his prophethood once he hears of him and his call reaches him — 'Islam' naming every believer of the earlier nations and, specially, Muhammad's followers; and the Gospel's corruption is plainer than needing proof: the Gospel writers themselves are unknown, no one knows who translated or transmitted them by connected chains, let alone the contradictions among them admitted by Christian scholars themselves. Recorded as AMJA's answer."
  ur: "ایک مسیحی نے اسلام پر دس سوالات کیے۔ ڈاکٹر وليد بسيوني ⁦(فتویٰ 21842، 20 جولائی 2006)⁩ کے مطابق محمد کی نبوت کا ایمان ہر امت کے مومن پر لازم ہے؛ انجیل کے ناقلین اور سلسلہ نقل مجہول ہیں — اہل کتاب کے علماء بھی تناقض مانتے ہیں۔"
  es: "Un lector cristiano de los artículos del sitio formuló diez preguntas, entre ellas sobre el paraíso en el Islam y la corrupción del Evangelio. El Dr. Walid Basyouni (fatwa n.° 21842, 20 de julio de 2006) respondió que, tras la misión de Mahoma, la fe de ningún creyente se mantiene firme ni su tawhid es válido si no cree en su profecía una vez que oye hablar de él y recibe su llamado; el término «Islam» se refiere a todos los creyentes de las naciones anteriores y, especialmente, a los seguidores de Mahoma. Además, la corrupción del Evangelio es evidente: se desconoce quiénes son los evangelistas, quiénes los tradujeron o transmitieron mediante cadenas de transmisión, y mucho menos las contradicciones entre ellos, admitidas incluso por los propios eruditos cristianos. Esta respuesta fue registrada por AMJA."
  fr: "Un lecteur chrétien des articles du site a posé dix questions, dont celle du paradis en islam et de la corruption de l'Évangile. Le Dr Walid Basyouni (fatwa n° 21842, 20 juillet 2006) a notamment répondu qu'après la mission de Mahomet, la foi d'un croyant ne subsiste pas et son tawhid n'est authentique que s'il croit en sa prophétie dès qu'il entend parler de lui et que son appel lui parvient – le terme « islam » désignant ici tous les croyants des nations antérieures et, en particulier, les disciples de Mahomet; quant à la corruption de l'Évangile, elle est plus que manifeste: les auteurs des Évangiles eux-mêmes sont inconnus, nul ne sait qui les a traduits ni comment ils ont été transmis, sans parler des contradictions qu'ils contiennent, reconnues par les érudits chrétiens eux-mêmes. Cette réponse est consignée dans la fatwa de l'AMJA."
  tr: "Sitede bazı makaleleri okuyan bir Hristiyan adam, İslam'daki cennet ve İncil'in çarpıtılması gibi on soru sordu. Dr. Walid Basyouni (20 Temmuz 2006 tarihli 21842 No. Fetva) Muhammed'in görevinden sonra inancına ulaşamayacağını ve ancak peygamberliğe olan inanç yoluyla tek tanrıcılığı için geçerli olduğunu ve bunu duyup çağrısını ilettiğini söyledi. İslam, önceki uluslardan gelen her mümine ve ayrıca Muhammed'in takipçilerine özel bir şekilde uygulanır. İncil'in çarpıtılması ise kanıt olarak kullanılamayacak kadar açıktır; çünkü İncil'in yazarları İncil'i kimin çevirdiğini ya da bağlantılı aktarım zincirleriyle kimin anlattığını bilmezler; ayrıca Hristiyan alimlerin de kabul ettiği çelişkiler vardır."
  id: "Seorang pria Kristen yang membaca beberapa artikel di situs tersebut mengajukan sepuluh pertanyaan, termasuk topik surga dalam Islam dan distorsi Injil. Dr. Walid Basyouni menjawab (Fatwa No. 21842 tanggal 20 Juli 2006) bahwa setelah misi Muhammad, orang beriman tidak mencapai imannya dan hanya sah untuk monoteisme melalui iman pada kenabiannya jika ia mendengarnya dan menyampaikan panggilannya. Islam berlaku untuk setiap orang beriman dari bangsa sebelumnya dan juga bagi para pengikut Muhammad dengan cara yang khusus. Adapun distorsi Injil, hal itu terlalu jelas untuk dijadikan bukti, karena para penulis Injil sendiri tidak tahu siapa yang menerjemahkan Injil maupun siapa yang menceritakannya dengan rantai transmisi yang terkait, selain kontradiksi di antara mereka yang diakui oleh para ulama Kristen sendiri."
