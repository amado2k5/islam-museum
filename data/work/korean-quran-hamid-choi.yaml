summary:
  ar: "ترجمة كورية لمعاني القرآن وضعها حامد يونغ كيل تشوي، الأستاذ في جامعة ميونغجي ورئيس اتحاد مسلمي كوريا، بدأها في أوائل الثمانينيات معتمدًا على ترجمة عبد الله يوسف علي الإنجليزية وعلى «صفوة التفاسير» للصابوني، وصدرت طبعتها الأولى سنة 1988 بتمويل من شركة إماراتية، ثم طبعها مجمع الملك فهد سنة 1997 في طبعة ثنائية اللغة مع النص العربي؛ وهي اليوم المدخل الرئيس إلى القرآن بالكورية."
  en: "A Korean rendering of the meanings of the Qur'an by Hamid Young Kil Choi, professor at Myongji University and chairman of the Korea Muslim Federation, begun in the early 1980s on the basis of Abdullah Yusuf Ali's English and al-Sabuni's Safwat al-Tafasir; its first edition came out in 1988 with funding from a UAE company, and the King Fahd Complex printed it in 1997 in a bilingual edition with the Arabic text; it is today the main point of access to the Qur'an in Korean."
  ur: "قرآن کے معانی کا کوریائی ترجمہ از حامد یونگ کِل چوئی، میونگجی یونیورسٹی کے پروفیسر اور کوریا مسلم فیڈریشن کے صدر، جو انھوں نے 1980 کی دہائی کے اوائل میں عبد اللہ یوسف علی کے انگریزی ترجمے اور صابونی کی «صفوۃ التفاسیر» کی بنیاد پر شروع کیا؛ پہلی اشاعت 1988 میں ایک اماراتی کمپنی کی مالی معاونت سے آئی، اور 1997 میں شاہ فہد کمپلیکس نے عربی متن کے ساتھ دو لسانی اشاعت چھاپی؛ آج یہ کوریائی میں قرآن تک رسائی کا بنیادی ذریعہ ہے۔"
