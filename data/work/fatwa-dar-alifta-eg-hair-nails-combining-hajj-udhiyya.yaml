id: work/fatwa-dar-alifta-eg-hair-nails-combining-hajj-udhiyya
class: work
kind: fatwa
label: { ar: "حكم الإمساك عن الأخذ من الشعر والأظفار لمن يجمع بين الحج والأضحية", en: "Refraining from cutting hair and nails for one combining Hajj and udhiyya", ur: "حج اور قربانی دونوں کرنے والے کا بال ناخن نہ کاتنا", es: "Abstenerse de cortarse el cabello y las uñas para quien combine el Hajj y el Udhiyya.", fr: "S'abstenir de se couper les cheveux et les ongles pour celui qui combine le Hajj et l'udhiyya", tr: "Hac ve fedakarlığı birleştiren birinin saç ve tırnak almamasına ilişkin karar", id: "Aturan tentang pantang mengambil rambut dan kuku untuk seseorang yang menggabungkan Haji dan pengorbanan" }
summary:
  ar: "سائل سأل عن الإمساك عن الأخذ من الشعر والأظفار لمن يجمع بين الحج والأضحية وأراد التنظف استعدادًا للإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20767)⁩ أنه يجوز للرجل المذكور أن يتنظف بحلق شعره وقص أظفاره استعدادًا للإحرام ولا إثم عليه في ذلك على ما فصّل الجواب."
  en: "A questioner asked about refraining from cutting hair and nails for one combining Hajj and udhiyya who wished to groom before ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20767) answered that the man may shave and clip his nails preparing for ihram, without sin — as the answer details."
  ur: "ایک سائل نے حج اور قربانی دونوں کرنے والے کے بال ناخن نہ کاٹنے اور احرام سے پہلے صفائی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20767)⁩ نے جواب دیا کہ احرام کی تیاری میں بال مڑوانا اور ناخن کاٹنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de no cortarse el cabello ni las uñas para una persona que combina el Hajj y la Udhiyya y que desea arreglarse antes del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20767) respondió que el hombre puede afeitarse y cortarse las uñas preparándose para el ihram, sin pecar, como se detalla en la respuesta."
  fr: "Un homme a posé une question concernant l'obligation de se couper les cheveux et les ongles pour accomplir le Hajj et l'Udhiyya et souhaiter se préparer avant l'ihram. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20767) a répondu que cet homme pouvait se raser et se couper les ongles en vue de l'ihram, sans commettre de péché, comme le précise la réponse."
  tr: "Bir soru soran, hac ve fedakarlığı birleştiren ve İhram hazırlığı için kendini arındırmak isteyen birinin saç ve tırnak almamasını sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 20767), bahsi geçen kişinin İhram hazırlığında saçını tıraş edip tırnaklarını keserek kendini temizleyebileceğini ve bu konuda kendisine günah olmadığını yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang pantang mengambil rambut dan kuku bagi seseorang yang menggabungkan Haji dan pengorbanan serta ingin membersihkan diri sebagai persiapan untuk Ihram. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20767) menjawab bahwa orang tersebut dapat membersihkan diri dengan mencukur rambut dan memotong kuku sebagai persiapan untuk Ihram, dan tidak ada dosa atas dirinya dalam hal ini, seperti yang dijelaskan dalam jawaban."
