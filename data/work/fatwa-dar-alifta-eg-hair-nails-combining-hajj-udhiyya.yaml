label: { ar: "حكم الإمساك عن الأخذ من الشعر والأظفار لمن يجمع بين الحج والأضحية", en: "Refraining from cutting hair and nails for one combining Hajj and udhiyya", ur: "حج اور قربانی دونوں کرنے والے کا بال ناخن نہ کاتنا", es: "Abstenerse de cortarse el cabello y las uñas para quien combine el Hajj y el Udhiyya." }
summary:
  ar: "سائل سأل عن الإمساك عن الأخذ من الشعر والأظفار لمن يجمع بين الحج والأضحية وأراد التنظف استعدادًا للإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20767)⁩ أنه يجوز للرجل المذكور أن يتنظف بحلق شعره وقص أظفاره استعدادًا للإحرام ولا إثم عليه في ذلك على ما فصّل الجواب."
  en: "A questioner asked about refraining from cutting hair and nails for one combining Hajj and udhiyya who wished to groom before ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20767) answered that the man may shave and clip his nails preparing for ihram, without sin — as the answer details."
  ur: "ایک سائل نے حج اور قربانی دونوں کرنے والے کے بال ناخن نہ کاٹنے اور احرام سے پہلے صفائی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20767)⁩ نے جواب دیا کہ احرام کی تیاری میں بال مڑوانا اور ناخن کاٹنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de no cortarse el cabello ni las uñas para una persona que combina el Hajj y la Udhiyya y que desea arreglarse antes del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20767) respondió que el hombre puede afeitarse y cortarse las uñas preparándose para el ihram, sin pecar, como se detalla en la respuesta."
