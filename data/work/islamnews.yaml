summary:
  ar: "بوابة أخبار إسلامية روسية تغطي حياة المسلمين في روسيا وخارجها، أنشأتها سنة 2002 رابطة «سوبرانيه» للجمعيات الثقافية والتعليمية؛ أطلقت سنة 2009 مع WebMoney نظام دفع للمسلمين باسم «الأموال الحلال»، ويعدّها باحث من كبرى وسائل الإعلام الإسلامية في روسيا، ويتهمها آخرون بنشر آراء متشددة."
  en: "A Russian Muslim news portal covering the life of Muslims in Russia and abroad, created in 2002 by the Sobranie association of cultural and educational societies; in 2009 it launched with WebMoney a payment system for Muslims called 'Halal Money'; one scholar counts it among the leading Muslim media in Russia, while others accuse it of spreading radical views."
  ur: "روسی مسلم خبروں کا پورٹل جو روس اور بیرونِ روس مسلمانوں کی زندگی کی خبریں دیتا ہے؛ 2002 میں ثقافتی و تعلیمی انجمنوں کی رابطہ تنظیم «سوبرانیے» نے بنایا؛ 2009 میں WebMoney کے ساتھ مسلمانوں کے لیے «حلال پیسہ» ادائیگی نظام شروع کیا؛ ایک محقق اسے روس کے نمایاں مسلم ذرائع ابلاغ میں گنتا ہے، جبکہ دوسرے اس پر شدت پسند آرا پھیلانے کا الزام لگاتے ہیں۔"
