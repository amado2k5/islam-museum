label: { ar: "قصيدة السموأل «إذا المرء لم يدنس من اللؤم عرضه»", en: "Al-Samaw'al's poem 'If a man's honour is not soiled by baseness'", es: "El poema de Al-Sawaw'al: \"Si el honor de un hombre no se ve mancillado por la bajeza\".", fr: "Le poème d'Al-Samaw'al « Si l'honneur d'un homme n'est pas souillé par la bassesse »", ur: "السماوئل کی نظم 'اگر انسان کی عزت بے بنیاد نہ ہو'", tr: "Samuel'in şiiri: \"Bir adam onurunu kötülükten kirletmezse\"", id: "Puisi Samuel: \"Jika seseorang tidak mencemari kehormatannya dari kejahatan\"" }
summary:
  ar: "قصيدة في ديوان الحماسة من الطويل على روي اللام، مطلعها «إذا المرء لم يدنس من اللؤم عرضه فكل رداء يرتديه جميل»، وتنسبها الطبعة إلى السموأل بن عادياء {{cite:hamasa-abu-tammam-ed-1916 p.26}}."
  en: "A poem of the Hamasa in the tawil metre on the rhyme lam, opening \"If a man's honour is not soiled by baseness, every cloak he wears is fair\", which the edition ascribes to al-Samaw'al ibn Adiya {{cite:hamasa-abu-tammam-ed-1916 p.26}}."
  es: "Un poema de la Hamasa en metro tawil con rima lam, que comienza con \"Si el honor de un hombre no está manchado por la bajeza, toda capa que vista es hermosa\", que la edición atribuye a al-Samaw'al ibn Adiya {{cite:hamasa-abu-tammam-ed-1916 p.26}}."
  fr: "Un poème du Hamasa en mètre tawil sur la rime lam, commençant par « Si l'honneur d'un homme n'est pas souillé par la bassesse, chaque manteau qu'il porte est beau », que l'édition attribue à al-Samaw'al ibn Adiya {{cite:hamasa-abu-tammam-ed-1916 p.26}}."
  ur: "حماسہ کی نظم لام پر تاویل میٹر میں، \"اگر انسان کی عزت بے بنیاد نہ ہو تو ہر وہ چادر جو اس نے پہنی ہے، منصفانہ ہے\" کا آغاز کیا ہے، جس کا ایڈیشن السماوئل ابن عدیہ سے منسوب ہے۔"
  tr: "Al-Tawil'in Diwan al-Hamasa'da lamın anlatımı üzerine yazdığı bir şiir, \"Bir adam onurunu alçaklıktan kirletmezse, giydiği her giysi güzeldir\" ile başlar ve baskı bunu Samawal ibn 'Adiya'ya atfeder {{cite:hamasa-abu-tammam-ed-1916 s.26}}."
  id: "Sebuah puisi dalam Diwan al-Hamasa karya Al-Tawil tentang narasi lam, dimulai dengan \"Jika seseorang tidak mencemarkan kehormatannya dari kejahatan, setiap pakaian yang dikenakannya indah,\" dan edisi tersebut mengaitkannya dengan Samawal ibn 'Adiya {{cite:hamasa-abu-tammam-ed-1916 hlm.26}}."
