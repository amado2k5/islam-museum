  ar: "قصيدة في ديوان الحماسة من الطويل على روي اللام، مطلعها «إذا المرء لم يدنس من اللؤم عرضه فكل رداء يرتديه جميل»، وتنسبها الطبعة إلى السموأل بن عادياء {{cite:hamasa-abu-tammam-ed-1916 p.26}}."
