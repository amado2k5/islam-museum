label: { ar: "حكم استخدام الأدوية الطبية لتأخير الحيض في الحج", en: "Using medicine to delay menstruation during Hajj", ur: "حج میں حیض مؤخر کرنے کے لیے ادویات کا استعمال", es: "Uso de medicamentos para retrasar la menstruación durante el Hajj", fr: "Utiliser des médicaments pour retarder les menstruations pendant le Hajj" }
summary:
  ar: "سائل سأل عن استخدام المرأة الأدوية الطبية لتأخير الحيض في الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23960)⁩ أن تناول المرأة بعض الأدوية لتأخير نزول الحيض لتتمكن من أداء جميع مناسك الحج أمر جائز شرعًا ما لم يكن به ضرر عليها في الحال أو المآل، على أن يكون ذلك باستشارة الطبيب."
  en: "A questioner asked about a woman using medicine to delay menstruation during Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23960) answered that taking medication to postpone her period so she can complete all the rites of Hajj is lawful in the sharia provided it does her no harm now or later, and is done on medical advice."
  ur: "ایک سائل نے عورت کے حج میں حیض مؤخر کرنے کے لیے ادویات لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23960)⁩ نے جواب دیا کہ حج کے تمام مناسک ادا کرنے کے لیے ایسا دوا لینا شرعاً جائز ہے بشرطیکہ اس سے فی الحال یا بالمآل نقصان نہ ہو اور یہ ڈاکٹر کے مشورے سے ہو۔"
  es: "Una persona preguntó sobre una mujer que usa medicamentos para retrasar la menstruación durante el Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23960) respondió que tomar medicamentos para posponer la menstruación y así poder completar todos los ritos del Hajj es lícito según la sharia, siempre que no le cause ningún daño ahora ni después, y que se haga bajo consejo médico."
  fr: "Une personne a posé une question concernant une femme prenant des médicaments pour retarder ses menstruations pendant le Hajj. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23960) a répondu que la prise de médicaments pour retarder ses règles afin de pouvoir accomplir tous les rites du Hajj est licite selon la charia, à condition qu'elle ne lui cause aucun préjudice, ni maintenant ni plus tard, et qu'elle soit effectuée sur avis médical."
