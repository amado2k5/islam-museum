id: work/fatwa-dar-alifta-eg-overnight-at-mina-sick
class: work
kind: fatwa
label: { ar: "حكم ترك المبيت بمنى للمريض ومن لديه عذر", en: "Leaving the overnight stay at Mina for the sick and the excused", ur: "مریض اور معذور کے لیے منیٰ میں ٹھہرنے کا ترک", es: "Dejando la estancia nocturna en Mina para los enfermos y los excusados.", fr: "Laisser le séjour à Mina aux malades et aux personnes dispensées", tr: "Gece kalmasına ilişkin karar, hastalar ve mazereti olanlar için Mina'da kalır", id: "Aturan tentang meninggalkan Mina untuk orang sakit dan mereka yang punya alasan" }
summary:
  ar: "سائل سأل عن ترك المبيت بمنى لمريض أو لمن لديه عذر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23969)⁩ أن الأصل هو المبيت بمنى ليالي التشريق الثلاث لمن قدر عليه واستطاعه، فإن تعذر على الحاج المبيت لمرض أو كبر سن جاز له تركه على ما فصّل الجواب من الضابط."
  en: "A questioner asked about leaving the overnight stay at Mina for one who is sick or has an excuse. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23969) answered that the norm is spending the three nights of tashriq at Mina for whoever is able; where overnighting at Mina is impossible for a pilgrim through illness or old age — as in the case asked — he may leave it, under the condition the answer details."
  ur: "ایک سائل نے مریض یا معذور کے لیے منیٰ میں رات گزارنے کے ترک کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23969)⁩ نے جواب دیا کہ اصول یہ ہے کہ جو ہوسکے وہ ایامِ تشریق کی تین راتیں منیٰ میں گزارے؛ جہاں بیماری یا بڑھاپے سے حاجی کے لیے ٹھہرنا ممکن نہ ہو — جیسا کہ سوال کی صورت میں ہے — وہ اسے چھوڑ سکتا ہے، جواب کے بیان کردہ ضابطے کے ساتھ۔"
  es: "Un consultante preguntó sobre la posibilidad de omitir la pernoctación en Mina para quien esté enfermo o tenga una excusa válida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23969) respondió que la norma es pasar las tres noches de tashriq en Mina para quien pueda; si le resulta imposible pernoctar en Mina por enfermedad o edad avanzada —como en el caso planteado—, puede omitirla, bajo las condiciones que se detallan en la respuesta."
  fr: "Un pèlerin a demandé s'il était possible de s'abstenir de passer la nuit à Mina en cas de maladie ou d'excuse. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23969) a répondu que la norme est de passer les trois nuits de tashriq à Mina pour quiconque en a les moyens; si un pèlerin ne peut y passer la nuit pour cause de maladie ou d'âge avancé – comme dans le cas posé –, il peut s'en dispenser, sous réserve des conditions précisées dans la réponse."
  tr: "Bir soru soran, hasta bir kişi veya mazereti olan biri için Mina'da gece kalmayı sormuştur. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 23969), Taşreeq'in üç gecesi için Mina'da kalmanın varsayılan olduğunu, yetenekli ve yetenekli olanlar için yanıtlamıştır. Hacı hastalık veya yaşlılık nedeniyle geceleyemezse, yönetici makamın belirttiği şekilde geceyi bırakabilir."
  id: "Seorang penanya menanyakan tentang meninggalkan menginap di Mina untuk orang sakit atau seseorang yang memiliki alasan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 23969) menjawab bahwa default-nya adalah menginap di Mina selama tiga malam Tashreeq bagi yang mampu dan mampu. Jika peziarah tidak dapat menginap karena sakit atau usia tua, ia boleh meninggalkannya sesuai dengan ketentuan otoritas yang berkuasa."
