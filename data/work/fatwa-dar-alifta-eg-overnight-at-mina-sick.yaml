id: work/fatwa-dar-alifta-eg-overnight-at-mina-sick
class: work
kind: fatwa
label: { ar: "حكم ترك المبيت بمنى للمريض ومن لديه عذر", en: "Leaving the overnight stay at Mina for the sick and the excused", ur: "مریض اور معذور کے لیے منیٰ میں ٹھہرنے کا ترک" }
summary:
  ar: "سائل سأل عن ترك المبيت بمنى لمريض أو لمن لديه عذر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23969)⁩ أن الأصل هو المبيت بمنى ليالي التشريق الثلاث لمن قدر عليه واستطاعه، فإن تعذر على الحاج المبيت لمرض أو كبر سن جاز له تركه على ما فصّل الجواب من الضابط."
  en: "A questioner asked about leaving the overnight stay at Mina for one who is sick or has an excuse. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23969) answered that the norm is spending the three nights of tashriq at Mina for whoever is able; where overnighting at Mina is impossible for a pilgrim through illness or old age — as in the case asked — he may leave it, under the condition the answer details."
  ur: "ایک سائل نے مریض یا معذور کے لیے منیٰ میں رات گزارنے کے ترک کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23969)⁩ نے جواب دیا کہ اصول یہ ہے کہ جو ہوسکے وہ ایامِ تشریق کی تین راتیں منیٰ میں گزارے؛ جہاں بیماری یا بڑھاپے سے حاجی کے لیے ٹھہرنا ممکن نہ ہو — جیسا کہ سوال کی صورت میں ہے — وہ اسے چھوڑ سکتا ہے، جواب کے بیان کردہ ضابطے کے ساتھ۔"
