summary:
  ar: "رسالة لعبد العزيز الوفائي في آلة «دائرة المعدل» التي ابتكرها، وهي آلة متعددة الاستعمال تقيس الزاوية الساعية للأجرام وتحمل قاعدتها خطوط القبلة لأماكن مختلفة {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25}."
  en: "Treatise by Abd al-Aziz al-Wafa'i on the da'irat al-mu'addil, the multi-purpose instrument he invented, which measures the hour-angle of celestial bodies and whose base carries qibla lines for various places {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25}."
  ur: "عبد العزیز الوفائی کا رسالہ ان کے ایجاد کردہ آلے «دائرۃ المعدل» پر، جو کثیر المقاصد آلہ ہے، اجرامِ فلکی کا ساعتی زاویہ ناپتا ہے اور جس کی بنیاد پر مختلف مقامات کے قبلہ کے خطوط ہیں {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25}۔"
  es: "Tratado de Abd al-Aziz al-Wafa'i sobre el da'irat al-mu'addil, el instrumento multiusos que inventó, que mide el ángulo horario de los cuerpos celestes y cuya base lleva líneas de qibla para varios lugares {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25}."
  fr: "Traité d'Abd al-Aziz al-Wafa'i sur le da'irat al-mu'addil, l'instrument polyvalent qu'il a inventé, qui mesure l'angle horaire des corps célestes et dont la base porte les lignes de qibla pour divers lieux {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25}."
