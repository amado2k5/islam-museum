  ur: "عبد العزیز الوفائی کا رسالہ ان کے ایجاد کردہ آلے «دائرۃ المعدل» پر، جو کثیر المقاصد آلہ ہے، اجرامِ فلکی کا ساعتی زاویہ ناپتا ہے اور جس کی بنیاد پر مختلف مقامات کے قبلہ کے خطوط ہیں {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25}۔"
