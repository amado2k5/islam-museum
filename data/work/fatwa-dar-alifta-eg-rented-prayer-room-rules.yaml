id: work/fatwa-dar-alifta-eg-rented-prayer-room-rules
class: work
kind: fatwa
label: { ar: "حكم إطلاق أحكام المسجد على محل مستأجر اتخذ كمصلى", en: "Do mosque rulings apply to a rented prayer room?", ur: "کیا کرائے کی جائے گئے نماز گاہ پر مسجد کے احکام لاگو ہوتے ہیں؟", es: "¿Se aplican las normas de la mezquita a una sala de oración alquilada?" }
summary:
  ar: "سائل سأل عن إجراء أحكام المسجد على محل مستأجر اتخذ مصلى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21882)⁩ أن كل مكان اتخذه الناس للصلاة فيه وليس وقفًا لله تعالى على المسجدية كالزوايا والمصليات لا تجري عليه الأحكام الخاصة بالمساجد على ما فصّل الجواب."
  en: "A questioner asked whether mosque rulings apply to a rented place adopted as a prayer room. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21882) answered that any place people adopt for prayer that is not endowed to God as a mosque — like zawaya and musallas — does not take the rulings specific to mosques, as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا کرائے پر لی گئی جگہ جو نماز گاہ بنائی گئی ہو پر مسجد کے احکام جاری ہوں گے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21882)⁩ نے جواب دیا کہ ہر وہ جگہ جو لوگ نماز کے لیے بنائیں مگر اللہ کے لیے مسجد کے طور پر وقف نہ ہو — جیسے زاویے اور نماز گاہیں — اس پر مسجد کے خاص احکام جاری نہیں ہوتے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si las normas sobre mezquitas se aplican a un lugar alquilado que se utiliza como sala de oración. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21882) respondió que cualquier lugar que la gente utilice para rezar y que no esté consagrado a Dios como mezquita —como zawaya y musallas— no está sujeto a las normas específicas para mezquitas, como se detalla en la respuesta."
