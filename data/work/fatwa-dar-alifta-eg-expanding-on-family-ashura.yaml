id: work/fatwa-dar-alifta-eg-expanding-on-family-ashura
class: work
kind: fatwa
label: { ar: "حكم التوسعة على الأهل يوم عاشوراء", en: "Expanding provision on one's family on 'Ashura", ur: "عاشورہ کے دن اہل و عیال پر وسعت", es: "Ampliar la provisión para la familia en 'Ashura'", fr: "Augmenter les provisions pour sa famille à l'occasion d'Achoura" }
summary:
  ar: "سائل سأل عن التوسعة على الأهل يوم عاشوراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21973)⁩ أن التوسعة على الأهل يوم عاشوراء سنة ثابتة شرعًا مروية محفوظة على ما فصّل الجواب."
  en: "A questioner asked about expanding provision on one's family on the day of 'Ashura. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21973) answered that expanding on the family on 'Ashura is an established sunna in the sharia, transmitted and preserved — as the answer details."
  ur: "ایک سائل نے عاشورہ کے دن اہل و عیال پر وسعت کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21973)⁩ نے جواب دیا کہ عاشورہ کے دن اہل خانہ پر وسعت کرنا ثابت اور محفوظ سنت ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de ampliar la provisión para la familia en el día de Ashura. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21973) respondió que ampliar la provisión para la familia en Ashura es una sunna establecida en la sharia, transmitida y preservada, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible d'augmenter les ressources allouées à sa famille le jour d'Achoura. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21973) a répondu que cette pratique est une sunna établie dans la charia, transmise et préservée, comme le détaille la réponse."
