label: { ar: "حكم إنشاء مدارس داخل المساجد", en: "Establishing schools inside mosques", ur: "مساجد کے اندر اسکول بنانا", es: "Establecer escuelas dentro de las mezquitas" }
summary:
  ar: "سائل سأل عن إنشاء مدارس داخل المساجد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20932)⁩ أن إنشاء مدارس داخل المساجد أمر يرجع إلى الجهات المختصة حسبما تراه محققًا للمصلحة مع مراعاة عدم خروج المسجد عن وظيفته الشرعية على ما فصّل الجواب."
  en: "A questioner asked about establishing schools inside mosques. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20932) answered that the matter belongs to the competent authorities as they see benefit realised, provided the mosque is not diverted from its legal function — as the answer details."
  ur: "ایک سائل نے مساجد کے اندر اسکول بنانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20932)⁩ نے جواب دیا کہ یہ فیصلہ متعلقہ حکام کا ہے مصلحت کے مطابق بشرطیکہ مسجد اپنے شرعی کردار سے نہ ہٹے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la posibilidad de establecer escuelas dentro de las mezquitas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20932) respondió que el asunto corresponde a las autoridades competentes, ya que ellas consideran que se obtiene un beneficio, siempre y cuando la mezquita no se desvíe de su función legal, tal como se detalla en la respuesta."
