summary:
  ar: "كتاب مريم د. اختيار ⁦(متحف المتروبوليتان، 2018)⁩ يعرّف بأنواع الخط الإسلامي الكبرى وسياقات استعمالها الدينية والدنيوية من خلال قطع من مجموعة المتحف، في ثلاثة فصول: نشأة الخط العربي وتطوره، وفن المصحف، والزخرفة والتجريد {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 2} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 5}."
  en: "Maryam D. Ekhtiar's book (The Met, 2018) introducing the major Islamic script types and their sacred and secular contexts through works in the Museum's collection, in three chapters: the origins and development of the Arabic script, the art of the Qur'an, and ornament and abstraction {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 2} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 5}."
  ur: "مریم ڈی اختیار کی کتاب ⁦(میٹ، 2018)⁩ جو میوزیم کے ذخیرے کی اشیا کے ذریعے اسلامی خطوط کی بڑی اقسام اور ان کے دینی و دنیوی سیاق کا تعارف کراتی ہے، تین ابواب میں: عربی خط کی ابتدا و ارتقا، مصحف کا فن، اور تزئین و تجرید {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 2} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 5}۔"
