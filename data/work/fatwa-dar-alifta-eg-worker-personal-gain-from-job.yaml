id: work/fatwa-dar-alifta-eg-worker-personal-gain-from-job
class: work
kind: fatwa
label: { ar: "تكسب العامل بصورة شخصية من وظيفته", en: "A worker earning personally from his job", ur: "ملازم کا نوکری سے ذاتی کمائی", es: "Un trabajador que obtiene ingresos personales de su trabajo", fr: "Un travailleur qui tire un revenu personnel de son emploi", tr: "İşçi işinden şahsen kazanır", id: "Pekerja tersebut menghasilkan pendapatan pribadi dari pekerjaannya" }
summary:
  ar: "سائل سأل عن أخذ الموظف مالًا معروضًا عليه بصورة شخصية ممن يقدم لهم الخدمات داخل إطار وظيفته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22004)⁩ أن ذلك محرم شرعًا باعتباره من أكل أموال الناس بالباطل على ما فصّل الجواب."
  en: "A questioner asked about an employee personally taking money offered by those he serves within his job. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22004) answered that this is forbidden — it counts as consuming people's wealth wrongfully, as the answer details."
  ur: "ایک سائل نے ملازم کے ذاتی طور پر ان لوگوں سے رقم لینے کا حکم پوچھا جنہیں وہ اپنی نوکری کے دائرے میں خدمت دیتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22004)⁩ نے جواب دیا کہ یہ حرام ہے کیونکہ یہ لوگوں کا مال ناحق کھانا ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que un empleado se apropiara personalmente del dinero ofrecido por sus empleados en el ejercicio de sus funciones. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22004) respondió que esto está prohibido, ya que se considera un abuso de la riqueza ajena, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le fait qu'un employé puisse accepter personnellement l'argent offert par ses clients dans le cadre de son travail. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22004) a répondu que cela est interdit; cela constitue un détournement de biens publics, comme le précise la réponse."
  tr: "Bir soru soran kişi, çalışanın işi kapsamında hizmet verenlerden şahsen kendisine teklif edilen parayı aldığını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22004), bunun insanların servetini yasadışı şekilde tüketmek olarak kabul edildiği için dini olarak yasak olduğunu yanıtladı; bu yanıtta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang karyawan yang menerima uang yang ditawarkan kepadanya secara pribadi dari mereka yang memberikan layanan dalam lingkup pekerjaannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22004) menjawab bahwa hal ini secara agama dilarang karena dianggap mengonsumsi kekayaan orang secara ilegal, seperti yang dijelaskan dalam jawaban."
