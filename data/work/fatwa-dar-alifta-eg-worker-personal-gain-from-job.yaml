id: work/fatwa-dar-alifta-eg-worker-personal-gain-from-job
class: work
kind: fatwa
label: { ar: "تكسب العامل بصورة شخصية من وظيفته", en: "A worker earning personally from his job", ur: "ملازم کا نوکری سے ذاتی کمائی" }
summary:
  ar: "سائل سأل عن أخذ الموظف مالًا معروضًا عليه بصورة شخصية ممن يقدم لهم الخدمات داخل إطار وظيفته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22004)⁩ أن ذلك محرم شرعًا باعتباره من أكل أموال الناس بالباطل على ما فصّل الجواب."
  en: "A questioner asked about an employee personally taking money offered by those he serves within his job. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22004) answered that this is forbidden — it counts as consuming people's wealth wrongfully, as the answer details."
  ur: "ایک سائل نے ملازم کے ذاتی طور پر ان لوگوں سے رقم لینے کا حکم پوچھا جنہیں وہ اپنی نوکری کے دائرے میں خدمت دیتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22004)⁩ نے جواب دیا کہ یہ حرام ہے کیونکہ یہ لوگوں کا مال ناحق کھانا ہے، جیسا کہ جواب میں تفصیل ہے۔"
