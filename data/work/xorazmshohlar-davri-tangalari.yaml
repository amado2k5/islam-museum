summary:
  ar: "دراسة لشاهرخ ميرزا إسماعيلوف ⁦(بخارى 2025)⁩ في نقود الأفريغيين والمأمونيين وشاه ملك والأنوشتكينيين في خوارزم من القرن الثامن إلى الغزو المغولي، بنى فيها ألبومًا لـ237 طرازًا من النقود {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 3} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 7}."
