summary:
  ar: "دراسة لشاهرخ ميرزا إسماعيلوف ⁦(بخارى 2025)⁩ في نقود الأفريغيين والمأمونيين وشاه ملك والأنوشتكينيين في خوارزم من القرن الثامن إلى الغزو المغولي، بنى فيها ألبومًا لـ237 طرازًا من النقود {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 3} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 7}."
  en: "Shohruxmirzo Ismoilov's study (Bukhara 2025) of the coins of the Afrighids, Ma'munids, Shah Malik and the Anushtegins in Khwarazm from the eighth century to the Mongol invasion, built on an album of 237 coin types {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 3} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 7}."
  ur: "شاہرخ میرزا اسماعیلوف کی کتاب ⁦(بخارا 2025)⁩ جو آٹھویں صدی سے منگول حملے تک خوارزم میں آفریغیوں، مامونیوں، شاہ ملک اور انوشتگینیوں کے سکوں کا مطالعہ ہے اور 237 اقسام کے سکوں کے البم پر قائم ہے {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 3} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 7}۔"
  es: "Estudio de Shohruxmirzo Ismoilov (Bukhara 2025) de las monedas de los afrighids, ma'munids, Shah Malik y los Anushtegins en Khwarazm desde el siglo VIII hasta la invasión mongola. 3} {citar: ismoilov-xorazmshohlar-inglés-2025 p. 7}."
  fr: "Étude de Shohruxmirzo Ismoilov (Boukhara 2025) sur les monnaies des Afrighids, des Ma'munides, du Shah Malik et des Anushtegins du Khwarazm du VIIIe siècle jusqu'à l'invasion mongole. 3} {cite: ismoilov-xorazmshohlar-english-2025 p. 7}."
  tr: "Shahrukh Mirza Ismailov tarafından (Buhara 2025) tarafından Afrikalılar, Ma'munidler, Şah Malik ve Anuştakinilerin 8. yüzyıldan Moğol istilasına kadar olan Havrizm'deki paraları üzerine yaptığı bir çalışma, 237 madeni para türünden oluşan bir albüm derlemiştir {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 3} {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 7}."
  id: "Sebuah studi oleh Shahrukh Mirza Ismailov (Bukhara 2025) tentang koin orang Afrika, Ma'munid, Shah Malik, dan Anushtakini di Khwarezm dari abad ke-8 hingga invasi Mongol, di mana ia menyusun album berisi 237 jenis koin {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 3} {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 7}."
