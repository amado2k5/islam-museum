summary:
  ar: "خطبة أبي بكر حين قُبض النبي، وفيها قوله المشهور «من كان يعبد محمداً فإن محمداً قد مات، ومن كان يعبد الله فإن الله حي لا يموت»، ثم تلاوته الآية."
  en: "Abu Bakr's sermon on the day the Prophet died, containing his famous words: whoever worshipped Muhammad — Muhammad is dead; whoever worshipped God — God lives and dies not."
  ur: "نبی کی وفات کے دن ابو بکر کا مشہور خطبہ: جو محمد کی عبادت کرتا تھا تو محمد وفات پا گیا، اور جو اللہ کی عبادت کرتا ہے تو اللہ زندہ ہے۔"
