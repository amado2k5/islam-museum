id: work/fatwa-aliftaa-jo-using-an-inhaler-in-ihram
class: work
kind: fatwa
label: { ar: "استخدام جهاز الاستنشاق للمحرم", en: "Using an inhaler while in ihram", ur: "احرام کی حالت میں انہیلر کا استعمال" }
summary:
  ar: "سؤال عن استخدام جهاز الاستنشاق للمحرم، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز للمحرم استعمال التبخيرة والبخاخ وجهاز الاستنشاق المحتوية على مواد عطرية للعلاج، ولا فدية عليه. أجابت الدائرة بأنه يجوز للمحرم استعمال التبخيرة والبخاخ وجهاز الاستنشاق المحتوية على مواد عطرية للعلاج، لأن المقصود التداوي لا التطيب، ولا تلزمه بذلك الفدية. ونقلت من حاشية البجيرمي على الخطيب (2/455) أن ما يقصد به الأكل أو التداوي لا يحرم على المحرم ولا فدية فيه وإن كانت له رائحة طيبة."
  en: "A question about using an inhaler while in ihram, in which Jordan's General Iftaa Department answered that a person in ihram may use steam, sprays and inhalers containing aromatic substances for treatment, and owes no fidya. The Department answered that a person in ihram may use steam treatments, sprays and inhalers containing aromatic substances for treatment, because the aim is treatment rather than perfuming, and he owes no fidya for it. It quoted Hashiyat al-Bujayrimi ala al-Khatib (2/455) that what is meant for eating or treatment is not forbidden to a person in ihram and carries no fidya, even if it has a pleasant scent."
  ur: "احرام کی حالت میں انہیلر کا استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ محرم علاج کے لیے خوشبودار مواد والی بھاپ، اسپرے اور انہیلر استعمال کر سکتا ہے، اور اس پر فدیہ نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ محرم علاج کے لیے خوشبودار مواد والی بھاپ، اسپرے اور انہیلر استعمال کر سکتا ہے، کیونکہ مقصد علاج ہے خوشبو لگانا نہیں، اور اس پر اس کا فدیہ لازم نہیں۔ اس نے حاشیۃ البجیرمی علی الخطیب (2/455) سے نقل کیا کہ جو چیز کھانے یا علاج کے لیے ہو وہ محرم پر حرام نہیں اور اس میں فدیہ نہیں، چاہے اس میں اچھی خوشبو ہو۔"
