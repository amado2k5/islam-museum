id: work/fatwa-aliftaa-jo-using-an-inhaler-in-ihram
class: work
kind: fatwa
label: { ar: "استخدام جهاز الاستنشاق للمحرم", en: "Using an inhaler while in ihram", ur: "احرام کی حالت میں انہیلر کا استعمال", es: "Uso de un inhalador durante el estado de ihram", fr: "Utilisation d'un inhalateur pendant l'ihram", tr: "Mahram için inhaler kullanımı", id: "Menggunakan inhaler untuk mahram" }
summary:
  ar: "سؤال عن استخدام جهاز الاستنشاق للمحرم، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز للمحرم استعمال التبخيرة والبخاخ وجهاز الاستنشاق المحتوية على مواد عطرية للعلاج، ولا فدية عليه. أجابت الدائرة بأنه يجوز للمحرم استعمال التبخيرة والبخاخ وجهاز الاستنشاق المحتوية على مواد عطرية للعلاج، لأن المقصود التداوي لا التطيب، ولا تلزمه بذلك الفدية. ونقلت من حاشية البجيرمي على الخطيب (2/455) أن ما يقصد به الأكل أو التداوي لا يحرم على المحرم ولا فدية فيه وإن كانت له رائحة طيبة."
  en: "A question about using an inhaler while in ihram, in which Jordan's General Iftaa Department answered that a person in ihram may use steam, sprays and inhalers containing aromatic substances for treatment, and owes no fidya. The Department answered that a person in ihram may use steam treatments, sprays and inhalers containing aromatic substances for treatment, because the aim is treatment rather than perfuming, and he owes no fidya for it. It quoted Hashiyat al-Bujayrimi ala al-Khatib (2/455) that what is meant for eating or treatment is not forbidden to a person in ihram and carries no fidya, even if it has a pleasant scent."
  ur: "احرام کی حالت میں انہیلر کا استعمال کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ محرم علاج کے لیے خوشبودار مواد والی بھاپ، اسپرے اور انہیلر استعمال کر سکتا ہے، اور اس پر فدیہ نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ محرم علاج کے لیے خوشبودار مواد والی بھاپ، اسپرے اور انہیلر استعمال کر سکتا ہے، کیونکہ مقصد علاج ہے خوشبو لگانا نہیں، اور اس پر اس کا فدیہ لازم نہیں۔ اس نے حاشیۃ البجیرمی علی الخطیب (2/455) سے نقل کیا کہ جو چیز کھانے یا علاج کے لیے ہو وہ محرم پر حرام نہیں اور اس میں فدیہ نہیں، چاہے اس میں اچھی خوشبو ہو۔"
  es: "Una pregunta sobre el uso de un inhalador durante el estado de ihram, a la que el Departamento General de Iftaa de Jordania respondió que una persona en ihram puede usar vapor, aerosoles e inhaladores que contengan sustancias aromáticas para el tratamiento, y no debe fidya. El Departamento respondió que una persona en ihram puede usar tratamientos de vapor, aerosoles e inhaladores que contengan sustancias aromáticas para el tratamiento, porque el objetivo es el tratamiento y no la perfumación, y no debe fidya por ello. Citó Hashiyat al-Bujayrimi ala al-Khatib (2/455) que dice que lo que está destinado a la alimentación o al tratamiento no está prohibido para una persona en ihram y no conlleva fidya, incluso si tiene un aroma agradable."
  fr: "Une question relative à l'utilisation d'un inhalateur pendant l'ihram a été posée. Le Département général de la Iftaa de Jordanie a répondu qu'une personne en état d'ihram peut utiliser des inhalations de vapeur, des sprays et des inhalateurs contenant des substances aromatiques à des fins thérapeutiques, sans être redevable de fidya. Le Département a précisé qu'une personne en état d'ihram peut recourir à ces traitements, car le but est le soin et non le parfum, et qu'elle n'est donc pas redevable de fidya. Il a cité Hashiyat al-Bujayrimi ala al-Khatib (2/455) selon lequel ce qui est destiné à l'alimentation ou à un traitement n'est pas interdit à la personne en état d'ihram et n'entraîne aucune fidya, même si cela a un parfum agréable."
  tr: "Mahram için inhaler cihazı kullanımıyla ilgili bir soru, Ürdün Genel Fetva Dairesi, bir mahramın aromatik maddeler içeren tütsü cihazı, püskürtü ve inhaler kullanmasının caiz olduğunu ve bunun için herhangi bir tazminat olmadığını yanıtladı. Daire, mahramın tedavi için aromatik maddeler içeren tütsü inhaler, spreyler ve inhalerler kullanmasının izin olduğunu, çünkü amaçlanan amacın parfüm değil, tedavi olduğunu ve bunun için fidya ödemek zorunda olmadığını yanıtladı. Al-Bujayrami'nin Al-Khatib (2/455) üzerindeki kenar notlarından alıntı yapıldı; yemek veya tedavi olarak tasarlanan şeyin ihram için yasak olmadığı ve hoş bir kokusu olsa bile fidya bulunmadığı belirtildi."
  id: "Sebuah pertanyaan tentang penggunaan alat inhaler untuk mahram, di mana Departemen Fatwa Umum Yordania menjawab bahwa mahram diperbolehkan menggunakan alat dupa, semprotan, dan inhaler yang mengandung zat aromatik untuk pengobatan, dan tidak ada kompensasi untuk itu. Departemen menjawab bahwa diperbolehkan bagi seorang mahram menggunakan inhaler, semprotan, dan inhaler yang mengandung zat aromatik dupa untuk pengobatan, karena tujuan yang dimaksudkan adalah pengobatan, bukan parfum, dan ia tidak diwajibkan membayar fidya untuk itu. Dikutip dari catatan pinggir Al-Bujayrami tentang Al-Khatib (2/455) bahwa apa yang dimaksudkan sebagai makanan atau pengobatan tidak dilarang bagi ihram, juga tidak ada fidya untuknya, meskipun baunya menyenangkan."
