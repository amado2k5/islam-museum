id: work/fatwa-dar-alifta-eg-tailor-liability-fabric
class: work
kind: fatwa
label: { ar: "حكم ضمان ما تلف من القماش في يد الخياط", en: "The tailor's liability for fabric damaged in his hands", ur: "درزی کے ہاتھ تباہ ہونے والے کپڑے کا ضمان", es: "La responsabilidad del sastre por los daños sufridos en la tela mientras esté en sus manos.", fr: "La responsabilité du tailleur pour les tissus endommagés entre ses mains" }
summary:
  ar: "سائل: رجل يعمل خياطًا أعطاه شخص قطعة قماش قيمة ليفصلها له ثوبًا بمواصفات معينة، فما حكم ضمان ما تلف من القماش في يده؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24407)⁩ أن ما تلف في يد الخياط من القماش عند قصه وأخذ القياسات وما ترتب عليه من عدم صلاحيته للتفصيل مضمون عليه شرعًا، وأن الأصل في ضمانه أن يكون بمثل مواصفات ما أفسده."
  en: "A questioner said a tailor was given a valuable piece of cloth to cut into a garment to an agreed specification, and asked the ruling on his liability for fabric ruined in his hands. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24407) answered that cloth damaged in the tailor's hands while cutting and measuring — and its consequent unfitness for tailoring — is legally on his guarantee, and that the measure of his liability is in principle the equivalent of what he spoiled."
  ur: "ایک سائل نے کہا کہ ایک درزی کو قیمتی کپڑا دیا گیا کہ اسے طے شدہ وضع سے کپڑا بنائے، اور اس کے ہاتھ تباہ ہونے والے کپڑے کے ضمان کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24407)⁩ نے جواب دیا کہ کٹائی اور ناپ کے دوران درزی کے ہاتھ تباہ ہوا کپڑا — اور اس کا سلائی کے ناقابل ہو جانا — شرعاً اس کے ضمان میں ہے، اور اصولاً ضمان اسی مثل کے کپڑے سے ہے جیسا اس نے برباد کیا۔"
  es: "Un consultante afirmó que a un sastre se le había entregado una valiosa pieza de tela para confeccionar una prenda según las especificaciones acordadas, y preguntó sobre la responsabilidad del sastre por la tela dañada en sus manos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24407) respondió que la tela dañada en las manos del sastre durante el corte y la medición —y su consiguiente falta de aptitud para la confección— está legalmente cubierta por su garantía, y que la medida de su responsabilidad es, en principio, equivalente al valor de la tela dañada."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24407) sur la responsabilité du tailleur en cas de détérioration du tissu lors de la coupe et de la prise de mesures. Il a statué que le tissu endommagé pendant la coupe et la prise de mesures, et donc impropre à la confection, est couvert par sa garantie, et que sa responsabilité est en principe proportionnelle à la valeur du tissu endommagé."
