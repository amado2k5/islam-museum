label: { ar: "غيث المواهب العلية بشرح الحكم العطائية", en: "Ghayth al-Mawahib al-'Aliyya (Ibn 'Abbad's commentary on the Hikam)", ur: "غیث المواہب العلیہ بشرح الحکم العطائیہ" }
summary:
  ar: "شرح ابن عباد النفزي الرندي ⁦(ت 792هـ)⁩ على حكم ابن عطاء الله السكندري، يقول محمد عبد المقصود هيكل إنه أول من شرحها وعليه اعتمد أكثر الشراح بعده، ومنهم الشرقاوي الذي يكاد شرحه «المنح القدسية» يكون تلخيصاً له، وإن به وبسائر مصنفاته انتشرت آراء الشاذلية في المغرب والأندلس {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 31} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 35} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}."
  en: "Ibn 'Abbad al-Nafzi al-Rundi's (d. 792 AH) commentary on the Hikam of Ibn 'Ata' Allah al-Iskandari; Muhammad 'Abd al-Maqsud Haykal says he was the first to comment on them and most later commentators relied on him, among them al-Sharqawi, whose al-Minah al-Qudsiyya is almost a summary of it, and that through it and his other works the views of the Shadhiliyya spread in the Maghrib and al-Andalus {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 31} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 35} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}."
  ur: "ابن عباد نفزی رندی (م 792ھ) کی ابن عطاء اللہ سکندری کے حکم پر شرح؛ محمد عبد المقصود ہیکل کہتے ہیں کہ وہ ان کے پہلے شارح تھے اور بعد کے اکثر شارحین نے ان پر انحصار کیا، جن میں شرقاوی ہیں جن کی «المنح القدسیہ» تقریباً اس کا خلاصہ ہے، اور اس اور ان کی دوسری تصانیف کے ذریعے مغرب اور اندلس میں شاذلیہ کی آرا پھیلیں {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 31} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 35} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}۔"
