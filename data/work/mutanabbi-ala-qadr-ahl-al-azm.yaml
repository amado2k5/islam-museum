label: { ar: "قصيدة المتنبي «على قدر أهل العزم تأتي العزائم»", en: "Al-Mutanabbi's ode 'To the measure of the resolute come resolutions'", es: "La oda de Al-Mutanabbi: \"A la medida de los resueltos llegan las resoluciones\".", fr: "L'ode d'Al-Mutanabbi « À la mesure des résolus naissent les résolutions »", ur: "المتنبی کا قول 'قرارداد کے پیمانے پر آتے ہیں'", tr: "Al-Mutanabbi'nin şiiri: 'Kararlılık, kararlı halkın ölçüsüne göre gelir'", id: "Puisi Al-Mutanabbi: 'Tekad datang sesuai dengan ukuran orang yang bertekad'" }
summary:
  ar: "قصيدة من الطويل على روي الميم يمدح بها المتنبي سيف الدولة ويذكر بناءه ثغر الحدث؛ يؤرّخها الديوان بسنة 343هـ ⁦(954م)⁩ {{cite:diwan-mutanabbi-dar-beirut-1983 p.385}}."
  en: "An ode in the tawil metre on the rhyme mim praising Sayf al-Dawla and recalling his rebuilding of the frontier fortress of al-Hadath; the edition dates it to 343 AH (954 CE) {{cite:diwan-mutanabbi-dar-beirut-1983 p.385}}."
  es: "Una oda en metro tawil sobre la rima mim que alaba a Sayf al-Dawla y recuerda su reconstrucción de la fortaleza fronteriza de al-Hadath; la edición la fecha en 343 AH (954 d. C.) {{cite:diwan-mutanabbi-dar-beirut-1983 p.385}}."
  fr: "Une ode en mètre tawil sur la rime mim louant Sayf al-Dawla et rappelant sa reconstruction de la forteresse frontalière d'al-Hadath; l'édition la date de 343 AH (954 CE) {{cite:diwan-mutanabbi-dar-beirut-1983 p.385}}."
  ur: "سیف الدولہ کی تعریف کرتے ہوئے اور الحدث کے سرحدی قلعے کی دوبارہ تعمیر کو یاد کرتے ہوئے نظم میم پر تاویل میٹر میں ایک نظم؛ ایڈیشن کی تاریخ 343 ہجری ⁦(954 عیسوی)⁩ {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 385}} ہے۔"
  tr: "Mutanabbi mektubu üzerine uzun bir şiir, Sayf al-Dawla'yı över ve onun yapımını olayın bir dönüm noktası olarak anar; Diwan ise bunu 343 Hicri (954 M.S.) yılına tarihlendirir {{cite:diwan-mutanabbi-dar-beirut-1983 s.385}}."
  id: "Sebuah puisi panjang tentang meme surat Mutanabbi yang memuji Sayf al-Dawla dan menyebutkan pembangunannya sebagai terobosan peristiwa tersebut; Diwan memperkirakannya pada tahun 343 H (954 M) {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.385}}."
