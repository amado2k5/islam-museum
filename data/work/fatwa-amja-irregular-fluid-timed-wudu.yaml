id: work/fatwa-amja-irregular-fluid-timed-wudu
class: work
kind: fatwa
label: { ar: "سائل غير منضبط", en: "An unregulated fluid — wudu at each prayer-time", ur: "غیر منظم رطوبت — ہر وقت پر وضو", es: "Un fluido no regulado: el wudu en cada momento de oración.", fr: "Un liquide non réglementé — les ablutions (wudu) à chaque heure de prière" }
summary:
  ar: "سأل سائل أربعة أسئلة منها نزول سائل لا ينضبط. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78086 بتاريخ 5 مارس 2009)⁩ أنه إذا لم ينضبط وقت معين لنزول هذا السائل وانقطاعه فيلزمه الوضوء لوقت كل صلاة ولا يضره ما نزل منه بعد ذلك إلى أن يأتي وقت الصلاة الأخرى فيجدد وضوءه بعد الاستنجاء على ما فصّل الجواب."
  en: "A questioner asked four questions, among them an unregulated descending fluid. Dr. Salah al-Sawi (fatwa no. 78086, 5 March 2009) answered that where no set time is fixed for the fluid's descending and ceasing, he owes wudu for each prayer's time; what descends after that does him no harm until the next prayer's time comes, when he renews wudu after istinja — as the answer details."
  ur: "غیر منظم رطوبت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78086، 5 مارچ 2009)⁩ کے مطابق ہر نماز کے وقت وضو کرے — بعد کا نزول بے ضرر۔"
  es: "Un consultante formuló cuatro preguntas, entre ellas una sobre un fluido descendente no regulado. El Dr. Salah al-Sawi (fatwa n.º 78086, 5 de marzo de 2009) respondió que, cuando no hay un tiempo fijo para el descenso y cese del fluido, debe realizar la ablución (wudu) durante el tiempo de cada oración; lo que desciende después no le causa daño hasta que llega el tiempo de la siguiente oración, cuando renueva la ablución después del istinja, como se detalla en la respuesta."
  fr: "Un fidèle a posé quatre questions, dont une concernant la descente incontrôlée d'un liquide. Le Dr Salah al-Sawi (fatwa n° 78086, 5 mars 2009) a répondu que lorsqu'aucun délai n'est fixé pour la descente et l'arrêt de la descente de ce liquide, le fidèle doit faire ses ablutions (wudu) pour chaque prière; ce qui descend ensuite ne lui cause aucun dommage jusqu'à la prière suivante, où il renouvelle ses ablutions après l'istinja, comme le précise la réponse."
