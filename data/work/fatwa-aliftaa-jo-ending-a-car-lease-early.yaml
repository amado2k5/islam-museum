id: work/fatwa-aliftaa-jo-ending-a-car-lease-early
class: work
kind: fatwa
label: { ar: "فسخ عقد تأجير سيارة قبل انتهاء مدته", en: "Ending a car lease early", ur: "کار لیز کی مدت سے پہلے فسخ" }
summary:
  ar: "سؤال عن فسخ عقد تأجير سيارة قبل انتهاء مدته، أجابت فيه دائرة الإفتاء العام الأردنية بأن الإجارة عقد لازم لا يفسخه أحد الطرفين وحده؛ فإن رضي المؤجر بالفسخ استحق الأجرة المسماة عن المدة المنتفع بها، وليس له الرجوع إلى أجرة المثل، وله أن يلزم المستأجر بإكمال المدة. أجابت الدائرة بأن الأصل أن عقد الإجارة لازم لا ينفسخ بإرادة أحد الطرفين، فإذا اتفقا على فسخه قبل انتهاء مدته جاز واستقرت الأجرة عما مضى من الانتفاع، لأن الأجرة لا تستقر إلا بالانتفاع، ونقلت عن النووي في منهاج الطالبين (ص163) أن المكتري إذا قبض الدابة أو الدار وأمسكها حتى مضت المدة استقرت الأجرة. وقالت إن الأجرة المسماة إذا كانت موزعة على الشهور، كأن يتفقا على ثلاث سنوات بمبلغ كل شهر، استقرت المسماة عن الماضي ولم ينظر إلى أجرة المثل، ونقلت ذلك عن حواشي الشرواني على تحفة المحتاج (6/187) عملًا بما وقع عليه العقد. وخلصت إلى أنه ليس للمستأجر فسخ الإجارة إلا برضا المؤجر، فإذا رضي استحق الأجرة المسماة عن المدة المنتفع بها عملًا بالاتفاق، وليس له الرجوع إلى أجرة المثل لأن الفسخ تم بالتراضي، وله بدلًا من ذلك أن يلزم المستأجر باستكمال مدة العقد."
  en: "A question about ending a car lease early, in which Jordan's General Iftaa Department answered that a lease is a binding contract that neither party can end alone; if the lessor agrees to end it, he is owed the agreed rent for the period used and may not revert to the market rent, or he may instead hold the lessee to the full term. The Department answered that in principle a lease is binding and is not ended at the will of one party; if both agree to end it before its term, that is permitted and rent becomes settled for the period already used, since rent is settled only through use. It quoted al-Nawawi in Minhaj al-Talibin (p. 163) that when a hirer takes possession of an animal or house and keeps it until the term passes, the rent becomes settled. It said that where the agreed rent is apportioned by month, as when the parties agree on three years at a set amount per month, the agreed rent is settled for the past period without regard to the market rent, citing al-Shirwani's glosses on Tuhfat al-Muhtaj (6/187), following the terms on which the contract was made. It concluded that the lessee may end the lease only with the lessor's consent; if the lessor consents, he is owed the agreed rent for the period of use, as agreed, and may not revert to the market rent because the contract was ended by mutual consent; alternatively he may hold the lessee to the full term of the contract."
  ur: "کار لیز کی مدت سے پہلے فسخ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اجارہ لازم عقد ہے جسے کوئی ایک فریق اکیلے ختم نہیں کر سکتا؛ اگر کرایہ پر دینے والا فسخ پر راضی ہو تو استعمال شدہ مدت کا طے شدہ کرایہ لے گا اور بازاری کرایے کی طرف رجوع نہیں کر سکتا، یا وہ کرایہ دار کو پوری مدت کا پابند رکھ سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اصلاً اجارہ لازم ہے اور ایک فریق کے ارادے سے ختم نہیں ہوتا؛ اگر دونوں مدت ختم ہونے سے پہلے فسخ پر متفق ہوں تو جائز ہے اور گزری ہوئی استعمال کی مدت کا کرایہ پختہ ہو جاتا ہے، کیونکہ کرایہ صرف استعمال سے پختہ ہوتا ہے۔ اس نے منہاج الطالبین (ص 163) میں نووی سے نقل کیا کہ جب کرایہ دار جانور یا گھر پر قبضہ کر کے مدت گزرنے تک رکھے تو کرایہ پختہ ہو جاتا ہے۔ اس نے کہا کہ جب طے شدہ کرایہ مہینوں پر تقسیم ہو، جیسے تین سال کے لیے ہر مہینے ایک مقررہ رقم، تو گزری مدت کا طے شدہ کرایہ پختہ ہو جاتا ہے اور بازاری کرایہ نہیں دیکھا جاتا، اور عقد کی شرائط پر عمل کرتے ہوئے یہ بات تحفۃ المحتاج پر شروانی کے حواشی (6/187) سے نقل کی۔ اس نے نتیجہ نکالا کہ کرایہ دار مالک کی رضا کے بغیر اجارہ ختم نہیں کر سکتا؛ اگر مالک راضی ہو تو معاہدے کے مطابق استعمال شدہ مدت کا طے شدہ کرایہ لے گا، اور بازاری کرایے کی طرف رجوع نہیں کر سکتا کیونکہ فسخ باہمی رضامندی سے ہوا؛ یا اس کے بجائے وہ کرایہ دار کو معاہدے کی پوری مدت کا پابند رکھ سکتا ہے۔"
