id: work/fatwa-aliftaa-jo-prize-coupons-inside-products
class: work
kind: fatwa
label: { ar: "المسابقات التسويقية بقسائم داخل المنتجات", en: "Marketing contests with prize coupons inside products", ur: "مصنوعات کے اندر انعامی کوپن والے تشہیری مقابلے", es: "Concursos de marketing con cupones de premio dentro de los productos.", fr: "Concours marketing avec coupons de prix inclus dans les produits" }
summary:
  ar: "سؤال عن شركة أغذية تضع قسائم جوائز داخل بعض منتجاتها، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذه الجوائز هدايا جائزة بثلاثة ضوابط. أجابت الدائرة بأن الجوائز التي تقدمها المؤسسات لمن يشتري منها تشجيعًا على الشراء تُكيّف على أنها هدايا، وهي جائزة بضوابط. أولها أن يقصد المشتري السلعة لذاتها لا الدخول في المسابقة فقط، وثانيها ألا يُزاد ثمن السلعة على سعر السوق، لأن الزيادة تكون مقابل الاشتراك في السحب فتصير قمارًا، ونقلت قرار مجلس الإفتاء الأردني رقم 47 بهذا المعنى. وثالثها ألا يكون في الهدايا غش أو خداع للمستهلكين، كترويج بضائع فاسدة أو رفع الأسعار مقابلها، ونقلت قرار مجمع الفقه الإسلامي رقم 127 (1/14) بأنه لا مانع من استفادة مقدمي الجوائز من ترويج سلعهم بالمسابقات المشروعة إذا لم تكن الجوائز من أموال المتسابقين ولم يكن في الترويج غش."
  en: "A question on a food company putting prize coupons inside some of its products, in which Jordan's General Iftaa Department answered that such prizes are gifts and are permitted under three conditions. The Department answered that prizes companies give buyers to encourage purchases are classed as gifts and are permitted under conditions. First, the buyer must want the product itself, not merely entry into the contest; second, the product's price must not be raised above the market price, since the increase would then be payment to enter the draw and so gambling, quoting decision no. 47 of Jordan's Iftaa Council to that effect. Third, the prizes must involve no cheating or deception of consumers, such as pushing spoiled goods or raising prices in return; it quoted resolution 127 (1/14) of the International Islamic Fiqh Academy that sponsors may benefit from promoting their goods through lawful contests, provided the prizes are not funded by the contestants and the promotion involves no deceit."
  ur: "ایک غذائی کمپنی کے اپنی کچھ مصنوعات کے اندر انعامی کوپن رکھنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایسے انعامات ہدیے ہیں اور تین شرطوں کے ساتھ جائز ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ کمپنیاں خریداری کی ترغیب کے لیے خریداروں کو جو انعامات دیتی ہیں وہ ہدیے شمار ہوتے ہیں اور شرائط کے ساتھ جائز ہیں۔ پہلی یہ کہ خریدار چیز کو خود اس کی ضرورت کے لیے خریدے، محض مقابلے میں شرکت کے لیے نہیں؛ دوسری یہ کہ چیز کی قیمت بازار سے زیادہ نہ کی جائے، کیونکہ اضافہ قرعہ اندازی میں شرکت کا معاوضہ بن کر جوا ہو جائے گا، اور اس مفہوم میں اردن کی افتاء کونسل کا فیصلہ نمبر 47 نقل کیا۔ تیسری یہ کہ انعامات میں صارفین کے ساتھ دھوکا یا فریب نہ ہو، جیسے خراب مال کی ترویج یا ان کے بدلے قیمتیں بڑھانا؛ اور بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 127 (1/14) نقل کی کہ انعام دینے والے جائز مقابلوں کے ذریعے اپنی مصنوعات کی تشہیر سے فائدہ اٹھا سکتے ہیں بشرطیکہ انعامات مقابلہ کرنے والوں کے مال سے نہ ہوں اور تشہیر میں دھوکا نہ ہو۔"
  es: "Una pregunta sobre una empresa de alimentos que coloca cupones de premio dentro de algunos de sus productos, a la que el Departamento General de Iftaa de Jordania respondió que tales premios son obsequios y están permitidos bajo tres condiciones. El Departamento respondió que los premios que las empresas otorgan a los compradores para incentivar las compras se clasifican como obsequios y están permitidos bajo ciertas condiciones. Primero, el comprador debe desear el producto en sí, no solo participar en el concurso; segundo, el precio del producto no debe ser superior al precio de mercado, ya que el aumento constituiría un pago para participar en el sorteo y, por lo tanto, una forma de juego, citando la decisión n.° 47 del Consejo de Iftaa de Jordania al respecto. Tercero, los premios no deben implicar ningún engaño o fraude a los consumidores, como la promoción de productos en mal estado o el aumento de precios a cambio; citó la resolución 127 (1/14) de la Academia Internacional de Fiqh Islámico que establece que los patrocinadores pueden beneficiarse de la promoción de sus productos a través de concursos lícitos, siempre que los premios no sean financiados por los participantes y la promoción no implique ningún engaño."
  fr: "Une question portait sur l'insertion de coupons-cadeaux dans certains produits d'une entreprise alimentaire. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que ces prix sont des cadeaux autorisés sous trois conditions. Le Département a précisé que les prix offerts par les entreprises pour encourager les achats sont considérés comme des cadeaux et sont autorisés sous certaines conditions. Premièrement, l'acheteur doit désirer le produit lui-même et non simplement participer au concours. Deuxièmement, le prix du produit ne doit pas être supérieur à son prix du marché, car une telle augmentation constituerait un paiement pour participer au tirage au sort et donc un jeu de hasard, conformément à la décision n° 47 du Conseil de la jurisprudence islamique de Jordanie. Troisièmement, les prix ne doivent impliquer aucune tromperie ni fraude envers les consommateurs, comme la vente de produits avariés ou l'augmentation des prix en contrepartie. Le Département a cité la résolution 127 (1/14) de l'Académie internationale de jurisprudence islamique (Fiqh) selon laquelle les sponsors peuvent tirer profit de la promotion de leurs produits par le biais de concours licites, à condition que les prix ne soient pas financés par les participants et que la promotion ne comporte aucune tromperie."
