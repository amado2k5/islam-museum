summary:
  ar: "كتاب للمسعودي وصفه بالمشهور المستوعب، أحال عليه في باب القيافة والحكم بها وضدها وما ذهبت إليه كل فرقة من الناس ممن سلف وخلف {cite:muruj-al-dhahab p. 481-482}."
  en: "al-Mas'udi's 'Seven Heads on encompassing the governance of the world and its secrets' — called by him famous and comprehensive, cited for the full debate on qiyafa and its rule {cite:muruj-al-dhahab p. 481-482}."
  es: "Las 'Siete Cabezas sobre la gobernanza del mundo y sus secretos' de al-Mas'udi —llamadas por él famosas y exhaustivas— citadas para el debate completo sobre la qiyafa y su regla {cite:muruj-al-dhahab p. 481-482}."
  fr: "Les « Sept Têtes » d'al-Mas'udi sur l'englobement de la gouvernance du monde et de ses secrets — qu'il qualifie de célèbre et exhaustive, citées pour le débat complet sur la qiyafa et sa règle {cite:muruj-al-dhahab p. 481-482}."
  ur: "المسعودی کا 'سات سر جو دنیا کی حکمرانی اور اس کے رازوں پر محیط ہے' - جسے ان کے ذریعہ مشہور اور جامع کہا جاتا ہے، قیافہ اور اس کے اصول پر مکمل بحث کے لیے حوالہ دیا گیا ہے۔ 481-482}۔"
  tr: "El-Mes'udi'nin iyi bilinen ve kapsamlı olarak tanımladığı bir kitap, Kıyafe, hüküm süreci ve zıttı ile seleflerinden ve haleflerinden gelen her bir grup halkın ulaştığı bölümde kendisine atıfta bulunuyor {cite:muruj-al-dhahab s. 481-482}."
  id: "Sebuah buku karya Al-Mas'udi yang ia gambarkan sebagai terkenal dan komprehensif, merujuk kepadanya dalam bab tentang Qiyafah, keputusannya, dan kebalikannya, serta apa yang telah dicapai oleh setiap kelompok dari pendahulu dan penerus {cite:muruj-al-dhahab hlm. 481-482}."
