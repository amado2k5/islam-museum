summary:
  ar: "فقه السيرة لمحمد الغزالي ⁦(ت 1416هـ/1996م)⁩؛ كتاب فقهي يتتبع أحكام السيرة النبوية استنباطاً من هديها، ومن مصادر فقه السيرة الحديثة. النسخة المقروءة مسح على رف الحصاد."
  en: "Muhammad al-Ghazali's Fiqh al-Sira (d. 1416/1996), a modern work deriving the rulings of the prophetic sira from its guidance; among the standard modern fiqh al-sira manuals. The copy read is a scan on the harvest shelf."
  es: "Fiqh al-Sira de Muhammad al-Ghazali (fallecido en 1416/1996), una obra moderna que deriva las normas de la sira profética a partir de su guía; se encuentra entre los manuales modernos de fiqh al-sira de referencia. La copia consultada es un escaneo de la estantería de la colección."
  fr: "Le Fiqh al-Sira de Muhammad al-Ghazali (mort en 1416/1996), ouvrage moderne qui tire les règles de la Sira prophétique de ses enseignements, figure parmi les manuels modernes de fiqh al-Sira de référence. L'exemplaire consulté est une numérisation sur l'étagère de la moisson."
  ur: "محمد الغزالی کی فقہ السیرۃ ⁦(متوفی 1416/1996)⁩، ایک جدید تصنیف جو سیرت نبوی کے احکام کو اس کی رہنمائی سے اخذ کرتی ہے۔ معیاری جدید فقہ السیرہ کتابچے میں سے ہے۔ پڑھی گئی کاپی فصل کے شیلف پر ایک اسکین ہے۔"
  tr: "Muhammed el-Gazali'nin (ö. 1416 Hicri / 1996 M.S.) fıkıh'ı; Peygamberlik biyografisinin hükümlerini rehberliğinden ve biyografinin modern fıkhı kaynaklarından türeten bir fıkıh kitabıdır. Okunabilir versiyonu, hasat rafı üzerine bir incelemedir."
  id: "Fiqh al-Sirah oleh Muhammad al-Ghazali (wafat 1416 H / 1996 M); sebuah buku yurisprudensi yang menelusuri putusan biografi Nabi untuk didapatkan dari pengajarannya, dan dari sumber yurisprudensi modern biografi tersebut. Versi yang dapat dibaca adalah survei tentang rak panen."
