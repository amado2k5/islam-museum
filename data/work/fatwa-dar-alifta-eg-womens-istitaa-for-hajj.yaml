id: work/fatwa-dar-alifta-eg-womens-istitaa-for-hajj
class: work
kind: fatwa
label: { ar: "بيان شروط الاستطاعة في الحج بالنسبة للنساء", en: "The conditions of capability for Hajj as regards women", ur: "عورتوں کے لیے حج میں استطاعت کی شرائط", es: "Condiciones de aptitud para el Hajj en lo que respecta a las mujeres", fr: "Les conditions d'aptitude au Hajj en ce qui concerne les femmes" }
summary:
  ar: "سائلة سألت عن شروط الاستطاعة في الحج بالنسبة للنساء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21858)⁩ أن الاستطاعة شرط لوجوب الحج فلا يجب على غير المستطيع وبيّن الجواب شروط الاستطاعة في حق المرأة المكلفة بأداء الفريضة على وجهه."
  en: "A woman asked about the conditions of capability for Hajj as regards women. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21858) answered that capability is a condition for Hajj being obligatory — it is not due from one who lacks it — and the answer sets out the conditions of capability for the woman bound to perform the duty."
  ur: "ایک عورت نے عورتوں کے لیے حج کی استطاعت کی شرائط پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21858)⁩ نے جواب دیا کہ استطاعت حج کے واجب ہونے کی شرط ہے اور غیر مستطع پر حج واجب نہیں؛ جواب میں عورت کے لیے استطاعت کی شرائط بیان ہوئیں۔"
  es: "Una mujer preguntó sobre los requisitos de aptitud para realizar el Hajj en el caso de las mujeres. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21858) respondió que la aptitud es una condición para que el Hajj sea obligatorio —no se debe a quien carece de ella— y la respuesta establece los requisitos de aptitud para la mujer obligada a cumplir con este deber."
  fr: "Une femme a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21858) sur les conditions d'aptitude au Hajj pour les femmes. Il a été répondu que l'aptitude est une condition nécessaire au caractère obligatoire du Hajj – celui-ci n'est pas dû à celui qui en est dépourvu – et la réponse précise les conditions d'aptitude requises pour la femme tenue d'accomplir ce devoir."
