label: { ar: "بيان شروط الاستطاعة في الحج بالنسبة للنساء", en: "The conditions of capability for Hajj as regards women", ur: "عورتوں کے لیے حج میں استطاعت کی شرائط" }
summary:
  ar: "سائلة سألت عن شروط الاستطاعة في الحج بالنسبة للنساء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21858)⁩ أن الاستطاعة شرط لوجوب الحج فلا يجب على غير المستطيع وبيّن الجواب شروط الاستطاعة في حق المرأة المكلفة بأداء الفريضة على وجهه."
  en: "A woman asked about the conditions of capability for Hajj as regards women. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21858) answered that capability is a condition for Hajj being obligatory — it is not due from one who lacks it — and the answer sets out the conditions of capability for the woman bound to perform the duty."
  ur: "ایک عورت نے عورتوں کے لیے حج کی استطاعت کی شرائط پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21858)⁩ نے جواب دیا کہ استطاعت حج کے واجب ہونے کی شرط ہے اور غیر مستطع پر حج واجب نہیں؛ جواب میں عورت کے لیے استطاعت کی شرائط بیان ہوئیں۔"
