label: { ar: "رعاية ذوي الاحتياجات الخاصة", en: "Caring for children with severe disabilities — seeking help", ur: "معذور بچوں کی دیکھ بھال — مدد مانگنا", es: "Cuidado de niños con discapacidades graves: búsqueda de ayuda", fr: "Prendre soin d'enfants gravement handicapés — demander de l'aide" }
summary:
  ar: "سأل سائل رزقه الله بولد وبنت منذ عشرين عامًا شديدي العوق من ذوي الاحتياجات الخاصة واستمر برعايتهما حتى الآن لكنه يحتاج عونًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3636 بتاريخ 9 نوفمبر 2007)⁩ أنه إذا ضاقت صدور المحسنين من المسلمين بحمل مرضاهم وذوي الاحتياجات الخاصة منهم جاز أن يطلب العون ممن يشاء على ألا يكون ذلك على حساب دينه ومبادئه وألا يكون ذريعة إلى الفتنة في الدين، وسأل الله أن يجعل له من ضيقه فرجًا ومن كربه مخرجًا ومن عسره يسرًا وأوصاه بالإكثار من قول لا إله إلا أنت سبحانك إني كنت من الظالمين ومن الصلاة على رسول الله يكفى همه ويغفر ذنبه بإذن الله."
  en: "A father caring for twenty years for a severely disabled son and daughter asked about seeking help. Dr. Salah al-Sawi (fatwa no. 3636, 9 November 2007) answered that when the good hearts of Muslims grow too narrow to carry their sick and special-needs, he may seek help from whom he wills — provided it is not at his religion's and principles' expense nor a passage to temptation in religion; he prayed God make for him relief from his tightness, a way from his distress and ease from his hardship, and counselled abundance of 'no god but You; glory to You; I was among the wrongdoers' and of blessings on the Messenger — that his care be lifted and his sin forgiven."
  ur: "ایک سائل نے معذور بچوں کی دیکھ بھال میں مدد پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3636، 9 نومبر 2007)⁩ کے مطابق مدد مانگنا جائز ہے بشرط دین اور اصولوں کی قیمت پر نہ ہو — اور لا الٰہ الا انت سبحانک کی کثرت کی تلقین کی۔"
  es: "Un padre que durante veinte años cuidó de un hijo y una hija con discapacidad grave preguntó sobre la posibilidad de buscar ayuda. El Dr. Salah al-Sawi (fatwa n.º 3636, 9 de noviembre de 2007) respondió que cuando los corazones bondadosos de los musulmanes se vuelven demasiado estrechos para soportar a sus enfermos y necesidades especiales, pueden buscar ayuda de quien deseen, siempre que no sea a expensas de su religión y principios ni un paso hacia la tentación religiosa. Rogó a Dios que le aliviara de su opresión, le diera una salida a su angustia y alivio a sus dificultades, y le aconsejó que repitiera con frecuencia \"no hay más dios que Tú; gloria a Ti; yo estuve entre los injustos\" y bendiciones sobre el Mensajero, para que se aliviara su preocupación y se le perdonara su pecado."
  fr: "Un père, s'occupant depuis vingt ans d'un fils et d'une fille gravement handicapés, a demandé conseil sur la possibilité de solliciter de l'aide. Le Dr Salah al-Sawi (fatwa n° 3636, 9 novembre 2007) a répondu que lorsque le cœur d'un musulman est trop lourd pour supporter la maladie et les besoins spécifiques de son proche, il peut demander de l'aide à qui il veut, pourvu que cela ne se fasse pas au détriment de sa religion et de ses principes, ni ne constitue une tentation. Il a prié Dieu de le soulager de son fardeau, de le délivrer de sa détresse et de lui accorder un répit dans ses difficultés. Il lui a conseillé de multiplier les invocations « Il n'y a de dieu que Toi; gloire à Toi ! J'étais parmi les injustes ! » et les bénédictions sur le Messager, afin que son fardeau soit allégé et son péché pardonné."
