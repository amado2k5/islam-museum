label: { ar: "تاريخ الإسلام ووفيات المشاهير والأعلام", en: "Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam", ur: "تاریخ الاسلام و وفیات المشاہیر والاعلام", fr: "Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam", es: "Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam", tr: "İslam'ın Tarihi ve Ünlülerin ve Önemli Kişilerin Ölümleri", id: "Sejarah Islam dan Kematian Selebriti serta Tokoh Terkenal" }
summary:
  ar: "تاريخ عام لشمس الدين الذهبي ⁦(ت 748هـ)⁩ يبدأ بالسيرة والمغازي ثم عهد الخلفاء الراشدين، ويمضي على السنين ثم العقود بعد ذلك، ويختم كل مدة بوفيات المشاهير والأعلام؛ وللكتاب ذيل يصل إلى سنة 750هـ. وفيه من أخبار الوفيات والتعزية والرثاء ما لا يُحصى."
  en: "A general history by Shams al-Din al-Dhahabi (d. 748 AH) that opens with the seerah and the campaigns, then the age of the Rightly-Guided Caliphs, and goes on by year and then by decade, closing each span with the deaths of the famous and the notable; a dhayl carries it to 750 AH. It holds a great deal on deaths, condolences and elegies."
  ur: "شمس الدین الذہبی ⁦(متوفی 748ھ)⁩ کی عام تاریخ جو سیرت اور مغازی سے شروع ہو کر خلفائے راشدین کے عہد پھر سالوں اور بعد میں دہائیوں کے حساب سے چلتی ہے اور ہر مدت کا اختتام مشہور لوگوں کی وفیات پر کرتی ہے؛ اس کا ذیل 750ھ تک جاتا ہے۔ وفات، تعزیت اور مرثیوں کی بے شمار خبریں اس میں ہیں۔"
  fr: "Une histoire générale de Shams al-Din al-Dhahabi (m. 748 H) qui s'ouvre sur la sîra et les expéditions, puis l'époque des califes bien guidés, et se poursuit par années puis par décennies, chaque période se concluant par le décès des personnages célèbres et notables ; un dhayl la mène jusqu'en 750 H. Elle contient une foule de récits sur les décès, les condoléances et les élégies."
  es: "Una historia general de Shams al-Din al-Dhahabi (m. 748 H) que se abre con la sira y las campañas, luego la época de los califas bien guiados, y sigue por años y después por décadas, cerrando cada período con las muertes de los famosos y notables; un dhayl la lleva hasta el 750 H. Contiene gran cantidad de relatos sobre muertes, condolencias y elegías."
  tr: "Şemseddin el-Dhahabi'nin (ö. 748 H) genel tarihi, biyografi ve seferlerle başlar, ardından Doğru Rehberli Halifeler dönemini anlatır, ardından yılları ve ardından sonraki on yılları kapsar; her dönemi ünlü şahsiyetlerin ve önemli şahsiyetlerin ölümleriyle sonlandırır; kitabın 750 Hicri yılına kadar uzanan bir ek vardır. Sayısız ölüm, taziye ve ağıtlar hakkında anlatımlar içerir."
  id: "Sejarah umum Shams al-Din al-Dhahabi (wafat 748 H) dimulai dengan biografi dan kampanye, kemudian era Khalifah yang Dibimbing dengan Benar, kemudian mencakup tahun-tahun dan dekade berikutnya, mengakhiri setiap periode dengan kematian tokoh terkenal dan tokoh penting; buku ini memiliki lampiran yang mencapai tahun 750 H. Buku ini memuat banyak catatan kematian, ucapan belasungkawa, dan elegi."
