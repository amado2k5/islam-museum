label:
  ar: "سيرة رسول الله 2026، الحلقة 26: الحصار الاقتصادي والأمني للنبي وبني هاشم والمطلب"
  en: "The Biography of the Messenger of God 2026, episode 26: The Economic and Security Siege of the Prophet and Banu Hashim and al-Muttalib"
  ur: "سیرتِ رسول اللہ 2026، قسط 26: نبی اور بنو ہاشم و بنو مطلب کا معاشی اور سیکیورٹی محاصرہ"
  fr: "La biographie du Messager de Dieu 2026, épisode 26 : Le siège économique et sécuritaire du Prophète et des Banu Hachim et al-Muttalib"
  es: "La biografía del Mensajero de Dios 2026, episodio 26: El asedio económico y de seguridad contra el Profeta y los Banu Hashim y al-Muttalib"
summary:
  ar: "يقدم المحاضر ترجمة لعامر بن فهيرة، ثم يفتتح الحديث عن مقاطعة قريش لبني هاشم وبني المطلب اتباعا لرواية ابن إسحاق في تهذيب ابن هشام. ويناقش تأريخها وترتيب الأحداث الذي يضعه ابن إسحاق في هذه السنوات، وسبعة دروس يستخلصها، ويبدأ بقائمة ابن إسحاق لخصوم قريش الذين نزلت فيهم آيات قرآنية."
  en: "The lecturer gives a biographical entry on Amir ibn Fuhayra, then opens the account of the Quraysh boycott of Banu Hashim and Banu al-Muttalib following Ibn Ishaq's narration in Ibn Hisham's recension. He discusses its dating, the order of events Ibn Ishaq places in these years, seven lessons he draws, and begins Ibn Ishaq's list of Qurayshi opponents about whom Qur'anic passages were revealed."
  ur: "مقرر عامر بن فہیرہ کا سوانحی تعارف دیتے ہیں، پھر ابن ہشام کی تہذیب میں ابن اسحاق کی روایت کی پیروی کرتے ہوئے قریش کے بنو ہاشم اور بنو مطلب کے مقاطعے کا بیان شروع کرتے ہیں۔ وہ اس کی تاریخ، ان سالوں میں ابن اسحاق کے رکھے ہوئے واقعات کی ترتیب، اپنے اخذ کردہ سات اسباق پر بات کرتے ہیں، اور قریش کے ان مخالفین کی ابن اسحاق کی فہرست شروع کرتے ہیں جن کے بارے میں قرآنی آیات نازل ہوئیں۔"
  fr: "Le conférencier donne une notice biographique sur Amir ibn Fuhayra, puis ouvre le récit du boycott des Banu Hachim et des Banu al-Muttalib par Quraych, d'après le récit d'Ibn Ishaq dans la recension d'Ibn Hicham. Il discute sa datation, l'ordre des événements qu'Ibn Ishaq place dans ces années, sept leçons qu'il en tire, et commence la liste d'Ibn Ishaq des opposants de Quraych au sujet desquels des passages coraniques furent révélés."
  es: "El conferenciante ofrece una entrada biográfica sobre Amir ibn Fuhayra, y luego abre el relato del boicot de Quraysh a los Banu Hashim y los Banu al-Muttalib siguiendo la narración de Ibn Ishaq en la recensión de Ibn Hisham. Discute su datación, el orden de los acontecimientos que Ibn Ishaq sitúa en estos años, siete lecciones que extrae, y comienza la lista de Ibn Ishaq de opositores de Quraysh sobre quienes se revelaron pasajes coránicos."
