label:
  ar: "ويتفكرون (سلسلة دروس)"
  en: "Wa Yatafakkarun: 'And They Reflect' (lesson series)"
  ur: "ویتفکرون: «اور وہ غور کرتے ہیں» (دروس کا سلسلہ)"
summary:
  ar: "سلسلة من تسع وعشرين حلقة مرئية لزغلول النجار في أرشيف أسابيل، يعرض فيها أوجه الإعجاز في القرآن وضوابط الإعجاز العلمي عنده، ثم يقرأ آيات خلق الكون ونهايته والسماء والأرض والجبال والحديد والماء في ضوء ما يراه من حقائق العلم، وكل ذلك قوله هو."
  en: "A series of twenty-nine video episodes by Zaghloul El-Naggar on the Assabile archive, in which he sets out the aspects of the Qur'an's inimitability and his rules for its 'scientific miracle', then reads the verses on the creation and end of the universe, the heavens, the earth, mountains, iron and water in the light of what he takes to be scientific fact; all of it is his own account."
  ur: "اسابیل آرکائیو میں زغلول النجار کی انتیس ویڈیو اقساط کا سلسلہ، جس میں وہ قرآن کے اعجاز کے پہلو اور سائنسی اعجاز کے اپنے ضوابط بیان کرتے ہیں، پھر کائنات کی تخلیق و انجام، آسمان، زمین، پہاڑ، لوہا اور پانی سے متعلق آیات کو اس کی روشنی میں پڑھتے ہیں جسے وہ سائنسی حقیقت سمجھتے ہیں؛ یہ سب ان کا اپنا بیان ہے۔"
