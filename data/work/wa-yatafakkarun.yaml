issue:
  ar: "هل تُقرأ الآيات الكونية في القرآن بالحقائق العلمية الحديثة، وهل يصح أن يُسمّى ذلك إعجازًا، وبأي ضوابط؟"
  en: "Should the Qur'an's cosmic verses be read through modern scientific findings, may that be called a miracle, and under what rules?"
  ur: "کیا قرآن کی کونی آیات کو جدید سائنسی حقائق کی روشنی میں پڑھا جائے، کیا اسے اعجاز کہنا درست ہے، اور کن ضوابط کے ساتھ؟"
