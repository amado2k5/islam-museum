id: work/fatwa-aliftaa-jo-gold-nisab-with-mixed-karats
class: work
kind: fatwa
label: { ar: "حساب نصاب الذهب متعدد العيارات", en: "Calculating the gold nisab when the gold is of mixed karats", ur: "مختلف عیار کے سونے میں نصاب کا حساب" }
summary:
  ar: "سؤال عن حساب نصاب الذهب متعدد العيارات، أجابت فيه دائرة الإفتاء العام الأردنية بأن النصاب 85 غرامًا من عيار 24 أو 97 من عيار 21 أو 113 من عيار 18، وعند تعدد العيارات تجمع قيم الذهب نقدًا بسعر الشراء يوم الوجوب. أجابت الدائرة بأن الزكاة تجب في النقود والذهب المعد للادخار أو التجارة إذا بلغ المجموع النصاب وحال عليه حول قمري، وأن النصاب 85 غرامًا من الذهب عيار 24، ويساوي 97 غرامًا من عيار 21 و113 غرامًا من عيار 18. وقالت إنه عند تعدد العيارات يحسب المزكي قيمة ما يملكه من الذهب نقدًا، وتضاف القيم بعضها إلى بعض في حساب النصاب، ثم يزكي القيمة نقدًا إن بلغ المجموع النصاب، والمعتمد حسابها بسعر الشراء، أي ما يدفعه التاجر لمالك الذهب، يوم وجوب الزكاة."
  en: "A question about calculating the gold nisab when the gold is of mixed karats, in which Jordan's General Iftaa Department answered that the nisab is 85 grams of 24-karat gold, 97 of 21-karat or 113 of 18-karat, and that with mixed karats the cash values are added at the buying price on the day zakat falls due. The Department answered that zakat is due on money and on gold kept as savings or for trade when the total reaches the nisab and a lunar year has passed over it, and that the nisab is 85 grams of 24-karat gold, equal to 97 grams of 21-karat and 113 grams of 18-karat. It said that with several karats, the owner calculates the cash value of the gold he owns, adds the values together to determine the nisab, and pays zakat on the value in cash if the total reaches it, the relied-upon price being the buying price, meaning what a dealer pays the owner for the gold, on the day zakat falls due."
  ur: "مختلف عیار کے سونے میں نصاب کا حساب کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نصاب 24 عیار کا 85 گرام، 21 عیار کا 97 گرام یا 18 عیار کا 113 گرام سونا ہے، اور مختلف عیار ہوں تو زکوٰۃ کے دن کی خرید قیمت پر نقد قیمتیں جمع کی جائیں۔ ڈیپارٹمنٹ نے جواب دیا کہ نقدی اور بچت یا تجارت کے لیے رکھے گئے سونے پر زکوٰۃ اس وقت واجب ہے جب مجموعہ نصاب کو پہنچے اور اس پر قمری سال گزر جائے، اور نصاب 24 عیار سونے کا 85 گرام ہے، جو 21 عیار کے 97 گرام اور 18 عیار کے 113 گرام کے برابر ہے۔ اس نے کہا کہ مختلف عیار ہوں تو زکوٰۃ دینے والا اپنے سونے کی نقد قیمت نکالے، نصاب کے حساب میں قیمتیں جمع کرے، اور مجموعہ نصاب کو پہنچے تو قیمت پر نقد زکوٰۃ دے، اور معتبر قیمت زکوٰۃ واجب ہونے کے دن کی خرید قیمت ہے، یعنی جو تاجر سونے کے مالک کو ادا کرتا ہے۔"
