  es: "Jawahir al-Balagha, libro sobre retórica (balagha) de Ahmad al-Hashimi; su fecha en un resumen de investigación entregado al museo: m. 1943 {cite:wikipedia-ar-ahmad-al-hashimi}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: #9256 (Shamela.org PDF) {cite:shamela-org-pdf-jawahir-al-balagha}. El museo no ha leído el libro."
