label: { ar: "قصيدة حسان «وغبنا فلم نشهد ببطحاء مكة»", en: "Hassan's poem 'We were absent and did not witness the plain of Mecca'", es: "El poema de Hassan: \"Estuvimos ausentes y no vimos la llanura de La Meca\".", fr: "Le poème d'Hassan « Nous étions absents et n'avons pas vu la plaine de La Mecque »", ur: "حسن کی نظم 'ہم غائب تھے میدانِ مکہ کا مشاہدہ نہ کیا'", tr: "Hassan'ın \"Mekke Bata'sını kaybettik ve tanık olmadık\" şiiri", id: "Puisi Hassan \"Kami kalah dan tidak menyaksikan Batha Mekah\"" }
summary:
  ar: "قصيدة لحسان بن ثابت من الطويل على روي الباء، مطلعها كما في شرح البرقوقي {{cite:sharh-diwan-hassan-barquqi-1929 p.41}}؛ وتذكر الطبعة بحرها في رأسها."
  en: "A poem by Hassan ibn Thabit in the tawil metre on the rhyme الباء, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.41}}."
  es: "Un poema de Hassan ibn Thabit en el metro tawil sobre la rima الباء, como en el comentario de al-Barquqi, que indica el metro en su encabezado {{cite:sharh-diwan-hassan-barquqi-1929 p.41}}."
  fr: "Un poème de Hassan ibn Thabit en mètre tawil sur la rime الباء, comme dans le commentaire d'al-Barquqi, qui indique le mètre dans son titre {{cite:sharh-diwan-hassan-barquqi-1929 p.41}}."
  ur: "حسن بن ثابت کی نظم الباء پر تاویل میٹر میں، جیسا کہ البرکی کی تفسیر میں ہے، جس کے عنوان {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 41}} میں میٹر بیان کیا گیا ہے۔"
  tr: "Hassan ibn Thabit'in Al-Tawil'den Ba' harfi üzerine yazdığı bir şiirdir; başlangıcı, al-Barquqi üzerine yazılmış yorumdaki gibidir {{cite:sharh-diwan-hassan-barquqi-1929 s.41}}; baskının en üstünde ölçüsü belirtilir."
  id: "Sebuah puisi oleh Hassan ibn Thabit dari Al-Tawil tentang huruf Ba', pembukaannya seperti dalam komentar tentang al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 hlm.41}}; edisi ini menyebutkan meternya di bagian atas."
