id: work/fatwa-dar-alifta-eg-subletting-rented-flat
class: work
kind: fatwa
label: { ar: "حكم تأجير العين المستأجرة لشخص آخر غير مالكها", en: "May a tenant sublet the rented property to someone else?", ur: "کیا کرایہ دار کرائے کی جگہ کسی اور کو دے سکتا ہے؟" }
summary:
  ar: "سائل قال: استأجر رجل شقة سكنية فهل يجوز له أن يؤجرها لشخص آخر غير مالكها؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24394)⁩ ببيان ضوابط إجارة المستأجر للعين المستأجرة لغيره من حيث ملاءمة العقد وشرط الإذن أو العرف."
  en: "A questioner said a man rented a residential flat; may he then let it to someone other than its owner? Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24394) answered by setting out the controls on a tenant's subletting the rented property — in terms of the contract's terms and the requirement of permission or custom."
  ur: "ایک سائل نے کہا کہ ایک شخص نے رہائشی فلیٹ کرائے پر لیا؛ کیا وہ اسے مالک کے علاوہ کسی اور کو کرائے پر دے سکتا ہے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24394)⁩ نے جواب میں کرایہ دار کے زیراجارہ دینے کے ضوابط بیان کیے — عقد کی شرائط اور اجازت یا عرف کی شرط کے اعتبار سے۔"
