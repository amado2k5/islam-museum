id: work/fatwa-dar-alifta-eg-travelling-between-sighting-regions
class: work
kind: fatwa
label: { ar: "الواجب على من سافر من بلد ثبتت فيه رؤية هلال رمضان إلى بلد لم تثبت فيه", en: "The duty of one travelling from a land where the Ramadan crescent was confirmed to one where it was not", ur: "اس مسافر کا فرض جو رمضان کے چند کی تصدیق شدہ ملک سے غیر تصدیق شدہ ملک جائے", es: "El deber de quien viaja desde una tierra donde se confirmaba la luna creciente de Ramadán a una donde no se confirmaba", fr: "Le devoir de celui qui voyage d'un pays où le croissant du Ramadan a été confirmé vers un pays où il ne l'a pas été", tr: "Ramazan hilalinin görüldüğü doğrulanmış bir ülkeden doğrulanmamış bir ülkeye seyahat edenler için zorunludur", id: "Ini wajib bagi mereka yang telah bepergian dari negara di mana penampakan bulan sabit Ramadan telah dikonfirmasi ke negara yang belum dikonfirmasi" }
summary:
  ar: "سائل سأل عن من سافر من السعودية إلى مصر بعد فجر الأربعاء الموافق الأول من رمضان بعد ثبوت الهلال في السعودية دون مصر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22534)⁩ ببيان ما يجب عليه في صومه وإفطاره تبعًا لكل بلد كما فصّل الجواب."
  en: "A questioner asked about one travelling from Saudi Arabia to Egypt after dawn on the Wednesday falling on the first of Ramadan, the crescent having been confirmed in Saudi but not Egypt. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22534) answered by setting out what is required of him in fasting and breaking fast according to each country, as the answer details."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو سعودی عرب سے مصر جا رہا ہے بدھ کی فجر کے بعد، پہلی رمضان کو، جب چند کی تصدیق سعودی میں ہوئی اور مصر میں نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22534)⁩ نے جواب میں یہ بیان کیا کہ ہر ملک کے اعتبار سے اس کے روزے اور افطار پر کیا لازم ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un viajero preguntó sobre una persona que viajaba de Arabia Saudita a Egipto después del amanecer del miércoles, primer día de Ramadán, ya que la luna creciente había sido confirmada en Arabia Saudita pero no en Egipto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22534) respondió detallando los requisitos para el ayuno y la ruptura del ayuno según cada país, tal como se especifica en la respuesta."
  fr: "Une personne a posé une question concernant un voyageur se rendant d'Arabie saoudite en Égypte après l'aube du mercredi qui marque le premier jour du Ramadan, le croissant de lune ayant été confirmé en Arabie saoudite mais pas en Égypte. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22534) a répondu en détaillant les obligations du voyageur concernant le jeûne et la rupture du jeûne dans chaque pays."
  tr: "Bir soru soran, Ramazan'ın ilk günü Çarşamba günü şafaktan sonra Suudi Arabistan'dan Mısır'a seyahat edenleri sordu; hilal Suudi Arabistan'da doğrulandıktan sonra Mısır'da değil. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22534), her ülkeye göre oruç ve orucu bozmak için gerekenleri açıklamakla yanıt verdi; bu soru cevabında ayrıntılı olarak belirtildi."
  id: "Seorang penanya menanyakan tentang mereka yang melakukan perjalanan dari Arab Saudi ke Mesir setelah fajar pada hari Rabu, tanggal satu Ramadan, setelah bulan sabit dikonfirmasi di Arab Saudi dan bukan di Mesir. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22534) menjawab dengan menjelaskan apa yang diperlukan untuk puasa dan berbuka puasa menurut masing-masing negara, sebagaimana dijelaskan dalam jawaban."
