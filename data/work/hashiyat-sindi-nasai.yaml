label: { ar: "حاشية السندي على سنن النسائي", en: "al-Sindi's gloss on the Sunan of al-Nasa'i", es: "La interpretación de al-Sindi sobre el Sunan de al-Nasa'i", fr: "Le commentaire d'al-Sindi sur les Sunan d'al-Nasa'i", ur: "النسائی کی سنن پر السندی کی تالیف", tr: "El-Sindi'nin Sunan al-Nasa'i üzerine kenar notları", id: "Catatan pinggir Al-Sindi tentang Sunan al-Nasa'i" }
summary:
  ar: "تعليق لطيف لأبي الحسن السندي على «سنن النسائي»، يشرح ألفاظ السنن وإيضاح الغريب والإعراب، ويبيّن شرط النسائي في تخريج الأحاديث. والمسح المحفوظ منه ضعيف، فالوصف هنا محدود بما قُرئ يقيناً."
  en: "al-Sindi's gloss on al-Nasa'i's Sunan. It explains the wording, the rare words and the grammar, and states al-Nasa'i's conditions for including reports. The surviving scan is poor, so this description is limited to what can be read with certainty."
  es: "Glosa de al-Sindi sobre el Sunan de al-Nasa'i. Explica la redacción, las palabras poco comunes y la gramática, y expone las condiciones de al-Nasa'i para la inclusión de dichos relatos. El escaneo que se conserva es deficiente, por lo que esta descripción se limita a lo que se puede leer con certeza."
  fr: "Commentaire d'al-Sindi sur les Sunan d'al-Nasa'i. Il explique la formulation, les termes rares et la grammaire, et énonce les conditions d'al-Nasa'i pour l'inclusion des hadiths. La numérisation qui nous est parvenue étant de mauvaise qualité, cette description se limite à ce qui est lisible avec certitude."
  ur: "النسائی کی سنن پر السندی کی تالیف۔ یہ الفاظ، نایاب الفاظ اور گرامر کی وضاحت کرتا ہے، اور رپورٹوں کو شامل کرنے کے لیے النساعی کی شرائط بیان کرتا ہے۔ بچ جانے والا اسکین ناقص ہے، اس لیے یہ تفصیل اس تک محدود ہے جسے یقین کے ساتھ پڑھا جا سکتا ہے۔"
  tr: "Ebu el-Hasan el-Sindi'nin 'Sunan al-Nasa'i' üzerine nazik bir tefsiri; Sünan'ın ifadesini açıklıyor, nadir ve dilbilgisel terimleri netleştiriyor ve el-Nasa'i'nin hadisleri doğrulama şartını netleştiriyor. Korunan sürüntü zayıftır, bu yüzden burada tanım kesin olarak okunanlarla sınırlıdır."
  id: "Komentar lembut oleh Abu al-Hasan al-Sindi tentang 'Sunan al-Nasa'i,' yang menjelaskan kata-kata Sunan, memperjelas istilah langka dan tata bahasa, serta memperjelas kondisi al-Nasa'i untuk mengautentikasi hadits. Swab yang diawetkan dari sana lemah, sehingga deskripsi di sini terbatas pada apa yang telah dibaca dengan pasti."
