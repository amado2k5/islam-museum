summary:
  ar: "تعليق لطيف لأبي الحسن السندي على «سنن النسائي»، يشرح ألفاظ السنن وإيضاح الغريب والإعراب، ويبيّن شرط النسائي في تخريج الأحاديث. والمسح المحفوظ منه ضعيف، فالوصف هنا محدود بما قُرئ يقيناً."
  en: "al-Sindi's gloss on al-Nasa'i's Sunan. It explains the wording, the rare words and the grammar, and states al-Nasa'i's conditions for including reports. The surviving scan is poor, so this description is limited to what can be read with certainty."
  es: "Glosa de al-Sindi sobre el Sunan de al-Nasa'i. Explica la redacción, las palabras poco comunes y la gramática, y expone las condiciones de al-Nasa'i para la inclusión de dichos relatos. El escaneo que se conserva es deficiente, por lo que esta descripción se limita a lo que se puede leer con certeza."
