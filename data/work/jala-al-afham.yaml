structure: "مقدمة المؤلف (ص3–4 من النسخة)؛ الباب الأول في الأحاديث الواردة في الصلاة على النبي (ص4–139)؛ الباب الثاني في معنى الصلاة على النبي وعلى آله، وتفسير الآل، ووجه التشبيه بالصلاة على إبراهيم، وختمها بالحميد المجيد، ومعنى السلام والرحمة والبركة واللهم، في عشرة فصول (ص140–379)؛ الباب الثالث في مواطن الصلاة عليه، أولها آخر التشهد (ص380–520)؛ الباب الرابع في الفوائد والثمرات الحاصلة بالصلاة عليه (ص521–536)؛ الباب الخامس في الصلاة على غير النبي (ص537–)؛ الفهارس (إلى ص730)."
