label: { ar: "جلاء الأفهام في فضل الصلاة والسلام على محمد خير الأنام", en: "Jala' al-Afham fi Fadl al-Salat wa-l-Salam ala Muhammad Khayr al-Anam", ur: "جلاء الافہام فی فضل الصلاۃ والسلام علی محمد خیر الانام" }
summary:
  ar: "كتاب لابن قيم الجوزية (ت 751هـ) في الصلاة والسلام على النبي، في خمسة أبواب: الأحاديث الواردة فيها مع بيان صحيحها وحسنها ومعلولها، ثم معنى الصلاة والآل ووجه تشبيهها بالصلاة على إبراهيم، ثم مواطن الصلاة عليه، ثم فوائدها وثمراتها، ثم الصلاة على غير النبي؛ ويصفه مؤلفه بأنه «كتاب فرد في معناه»."
  en: "A book by Ibn Qayyim al-Jawziyya (d. 751 AH) on invoking blessings and peace upon the Prophet, in five chapters: the hadiths on the subject with their grading as sound, good or defective; the meaning of the prayer of blessing and of 'the family', and why it is likened to the blessing on Abraham; the occasions for invoking blessings on him; its benefits and fruits; and invoking blessings on others than the Prophet. The author calls it 'a book unique in its subject'."
