label: { ar: "جلاء الأفهام في فضل الصلاة والسلام على محمد خير الأنام", en: "Jala' al-Afham fi Fadl al-Salat wa-l-Salam ala Muhammad Khayr al-Anam", ur: "جلاء الافہام فی فضل الصلاۃ والسلام علی محمد خیر الانام", tr: "Dua ve barış erdemindeki anlayışın berraklığı, insanlığın en iyisi Muhammed'in üzerine olsun.", id: "Kejelasan pemahaman tentang kebajikan shalat dan damai menjadi milik Muhammad, yang terbaik dari umat manusia" }
summary:
  ar: "كتاب لابن قيم الجوزية ⁦(ت 751هـ)⁩ في الصلاة والسلام على النبي، في خمسة أبواب: الأحاديث الواردة فيها مع بيان صحيحها وحسنها ومعلولها، ثم معنى الصلاة والآل ووجه تشبيهها بالصلاة على إبراهيم، ثم مواطن الصلاة عليه، ثم فوائدها وثمراتها، ثم الصلاة على غير النبي؛ ويصفه مؤلفه بأنه «كتاب فرد في معناه»."
  en: "A book by Ibn Qayyim al-Jawziyya (d. 751 AH) on invoking blessings and peace upon the Prophet, in five chapters: the hadiths on the subject with their grading as sound, good or defective; the meaning of the prayer of blessing and of 'the family', and why it is likened to the blessing on Abraham; the occasions for invoking blessings on him; its benefits and fruits; and invoking blessings on others than the Prophet. The author calls it 'a book unique in its subject'."
  es: "Un libro de Ibn Qayyim al-Jawziyya (fallecido en el año 751 de la Hégira) sobre la invocación de bendiciones y paz sobre el Profeta, dividido en cinco capítulos: los hadices sobre el tema, clasificados como auténticos, buenos o defectuosos; el significado de la oración de bendición y de «la familia», y por qué se la compara con la bendición sobre Abraham; las ocasiones para invocar bendiciones sobre él; sus beneficios y frutos; y la invocación de bendiciones sobre otros que no sean el Profeta. El autor lo denomina «un libro único en su temática»."
  fr: "Un ouvrage d'Ibn Qayyim al-Jawziyya (mort en 751 AH) sur l'invocation des bénédictions et de la paix sur le Prophète, en cinq chapitres: les hadiths relatifs à ce sujet, classés comme authentiques, bons ou imparfaits; la signification de la prière de bénédiction et de la prière pour la famille, et pourquoi elle est comparée à la bénédiction sur Abraham; les occasions de l'invoquer; ses bienfaits et ses fruits; et l'invocation des bénédictions sur d'autres que le Prophète. L'auteur le qualifie d'« ouvrage unique en son genre »."
  ur: "ابن قیم الجوزیہ ⁦(متوفی 751ھ)⁩ کی ایک کتاب جو نبی پر درود و سلام بھیجنے کے بارے میں ہے، پانچ ابواب میں: اس موضوع پر احادیث صحیح، اچھی یا عیب دار کی درجہ بندی کے ساتھ؛ برکت اور 'خاندان' کی دعا کا مطلب، اور اسے ابراہیم پر برکت سے کیوں تشبیہ دی گئی ہے؛ اس پر درود بھیجنے کے مواقع؛ اس کے فوائد اور پھل؛ اور نبی کے علاوہ دوسروں پر درود بھیجنا۔ مصنف نے اسے 'موضوع میں منفرد کتاب' کہا ہے۔"
  tr: "İbn Kayyim al-Jawziyyah'ın (ö. 751 Hicri) Peygamber'e bereket ve selam gönderme üzerine beş bölümden oluşan kitabı: içinde yer alan hadisler, onların gerçek doğruluğunu, iyiliğini ve etkilerini açıklar; sonra dua ve ailenin anlamı ve bunun İbrahim'e bereket göndermekle karşılaştırılmasının nedeni; sonra ona bereket gönderme zamanları; sonra faydaları ve meyveleri; ardından Peygamber dışındaki birine bereket göndermek; yazarı onu \"anlamı bakımından eşsiz bir kitap\" olarak tanımlar."
  id: "Sebuah kitab oleh Ibn Qayyim al-Jawziyyah (wafat 751 H) tentang mengirimkan berkat dan damai kepada Nabi, dalam lima bab: hadis yang terkandung di dalamnya, menjelaskan keaslian, kebaikan, dan dampaknya; kemudian makna doa dan keluarga serta alasan perbandingannya dengan mengirimkan berkat kepada Abraham; kemudian saat-saat mengirimkan berkat kepadanya; kemudian manfaat dan buahnya; kemudian mengirimkan berkat kepada seseorang selain Nabi; penulisnya menggambarkannya sebagai \"sebuah kitab yang unik dalam maknanya.\""
