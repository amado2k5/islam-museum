id: work/fatwa-amja-tajweed-in-prayer
class: work
kind: fatwa
label: { ar: "التجويد في الصلاة", en: "Must recitation in prayer be tajweed — to one's ability", ur: "نماز میں تجوید — استطاعت کے مطابق", es: "¿Debe la recitación en la oración ser tajweed, según la capacidad de cada uno?" }
summary:
  ar: "سأل سائل هل عليه أن يقرأ بالتجويد في الصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78680 بتاريخ 28 أبريل 2009)⁩ أن عليه أن يقرأ القرآن بالتجويد في صلاته وخارجها على قدر استطاعته على ما فصّل الجواب."
  en: "A questioner asked whether he must recite with tajweed in the prayer. Dr. Salah al-Sawi (fatwa no. 78680, 28 April 2009) answered that yes — one is to recite the Qur'an with tajweed in and outside the prayers, to the best of one's ability."
  ur: "نماز میں تجوید واجب؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78680، 28 اپریل 2009)⁩ کے مطابق استطاعت کے مطابق تجوید کے ساتھ قراءت کرے۔"
  es: "Un consultante preguntó si debía recitar con tajwid en la oración. El Dr. Salah al-Sawi (fatwa n.° 78680, 28 de abril de 2009) respondió que sí: uno debe recitar el Corán con tajwid dentro y fuera de las oraciones, en la medida de sus posibilidades."
