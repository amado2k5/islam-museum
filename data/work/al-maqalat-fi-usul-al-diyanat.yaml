summary:
  ar: "كتاب للمسعودي أتى فيه على سائر أقوال المعتزلة وغيرهم من فرق الأمة من الخوارج والمرجئة والرافضة والزيدية والحشوية وغيرهم في أصولهم وفروعهم وأقاويلهم، كما ذكره في مروج الذهب {cite:muruj-al-dhahab p. 210}."
  en: "al-Mas'udi's lost work on the doctrines of the nations — the Mu'tazila's five principles and the sayings of the Kharijites, Murji'a, Rafida, Zaydiyya and the Hashwiyya, cited in Muruj al-Dhahab {cite:muruj-al-dhahab p. 210}."
  es: "El trabajo perdido de al-Mas'udi sobre las doctrinas de las naciones: los cinco principios de Mu'tazila y los dichos de los Kharijites, Murji'a, Rafida, Zaydiyya y Hashwiyya, citado en Muruj al-Dhahab {citar:muruj-al-dhahab p. 210}."
  fr: "l'ouvrage perdu d'al-Mas'udi sur les doctrines des nations — les cinq principes du Mu'tazila et les paroles des Kharijites, Murji'a, Rafida, Zaydiyya et Hashwiyya, cités dans Muruj al-Dhahab {cite:muruj-al-dhahab p. 210}."
  ur: "اقوام کے عقائد پر المسعودی کا گمشدہ کام - معتزلہ کے پانچ اصول اور خوارج، مرجع، رفیدہ، زیدیہ اور ہاشویہ کے اقوال، مروج الذہب میں نقل کیے گئے ہیں۔ 210}۔"
  tr: "Al-Mas'udi'nin bir kitabı, Mu'taziller ve ümmetin diğer mezheplerinin, Hariciler, Murji'ah, Rafidah, Zaydiler, Haşviyye ve diğerlerinin ilkeleri, kolları ve görüşleri hakkında, Muruj al-Dhahab {cite:muruj-al-dhahab, s. 210}'da belirtildiği gibi, tüm görüşlerini sundu."
  id: "Sebuah buku oleh Al-Mas'udi di mana ia memaparkan semua pendapat Mu'tazilit dan sekte-sekte lain dalam Ummah, termasuk Kharijit, Murji'ah, Rafidah, Zaydi, Hashwiyya, dan lainnya, mengenai prinsip, cabang, dan pendapat mereka, sebagaimana disebutkan dalam Muruj al-Dhahab {cite:muruj-al-dhahab, hlm. 210}."
