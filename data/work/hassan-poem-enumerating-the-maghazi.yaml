summary:
  ar: "قصيدة على روي اللام تعدّد مشاهد الأنصار مع النبي من بدر إلى تبوك؛ أوردها ابن إسحاق خاتمةً لباب براءة، وذكر ابن هشام أنها تُروى أيضاً لعبد الرحمن بن حسان وأن بيتها الأخير عن غير ابن إسحاق."
  en: "A lam-rhymed poem listing the Ansar's battles beside the Prophet from Badr to Tabuk; Ibn Ishaq places it at the close of the Bara'a chapter, and Ibn Hisham notes it is also attributed to Hassan's son Abd al-Rahman and that its last verse comes from a source other than Ibn Ishaq."
