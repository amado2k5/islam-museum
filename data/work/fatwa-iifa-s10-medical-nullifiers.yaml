summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: عدّد ما لا يعتبر من المفطرات ومنه قطرة العين والأذن وغسولها وقطرة الأنف وبخاخه إذا اجتنب ابتلاع ما نفذ إلى الحلق، والأقراص العلاجية تحت اللسان للذبحة الصدرية بذات الشرط، وما يدخل المهبل من تحاميل، ثم بيّن ما يفطر به على ما فصّل القرار."
  en: "IIFA's tenth-session resolution (July 1997) on medical fasting-nullifiers: it lists what does not break the fast — eye drops, ear drops and wash, nasal drops and spray when what reaches the throat is not swallowed, under-tongue tablets for angina on the same condition, and vaginal suppositories — then sets out what does nullify, as detailed."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩: آنکھ، کان اور ناک کی قطرے، ذیلی زبان گولیاں اور پیچھے کی تحامیل روزہ نہیں توڑتیں بشرط نگلنے سے گریز؛ توڑنے والی چیزیں بیان ہوئیں۔"
