id: work/fatwa-iifa-s10-medical-nullifiers
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن المفطرات في مجال التداوي", en: "IIFA resolution on fasting nullifiers in the medical field", ur: "اکیڈمی کی قرارداد: طبی میدان میں روزہ توڑنے والی چیزیں", es: "Resolución de la IIFA sobre los anuladores del ayuno en el ámbito médico.", fr: "Résolution de l'IIFA sur les annulateurs de jeûne dans le domaine médical" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته العاشرة ⁦(يوليو 1997م)⁩: عدّد ما لا يعتبر من المفطرات ومنه قطرة العين والأذن وغسولها وقطرة الأنف وبخاخه إذا اجتنب ابتلاع ما نفذ إلى الحلق، والأقراص العلاجية تحت اللسان للذبحة الصدرية بذات الشرط، وما يدخل المهبل من تحاميل، ثم بيّن ما يفطر به على ما فصّل القرار."
  en: "IIFA's tenth-session resolution (July 1997) on medical fasting-nullifiers: it lists what does not break the fast — eye drops, ear drops and wash, nasal drops and spray when what reaches the throat is not swallowed, under-tongue tablets for angina on the same condition, and vaginal suppositories — then sets out what does nullify, as detailed."
  ur: "اکیڈمی کی دسویں مجلس کی قرارداد ⁦(جولائی 1997ء)⁩: آنکھ، کان اور ناک کی قطرے، ذیلی زبان گولیاں اور پیچھے کی تحامیل روزہ نہیں توڑتیں بشرط نگلنے سے گریز؛ توڑنے والی چیزیں بیان ہوئیں۔"
  es: "La resolución de la décima sesión de la IIFA (julio de 1997) sobre los medicamentos que anulan el ayuno: enumera lo que no rompe el ayuno (gotas para los ojos, gotas y lavados para los oídos, gotas y aerosoles nasales cuando lo que llega a la garganta no se traga, comprimidos sublinguales para la angina en la misma condición y supositorios vaginales) y luego detalla lo que sí lo anula."
  fr: "Résolution de la dixième session de l'IIFA (juillet 1997) sur les médicaments annulant le jeûne: elle énumère ce qui ne rompt pas le jeûne — gouttes pour les yeux, gouttes et lavages pour les oreilles, gouttes et sprays nasaux lorsque ce qui atteint la gorge n'est pas avalé, comprimés sous-langues pour l'angine de poitrine dans la même condition, et suppositoires vaginaux — puis expose ce qui annule le jeûne, comme détaillé."
