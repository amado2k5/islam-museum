id: work/fatwa-amja-regretting-major-choice
class: work
kind: fatwa
label: { ar: "الرضا بما قسم الله في اختيار التخصص", en: "Contentment with God's share in choosing a major", ur: "شعبے کے انتخاب پر اللہ کی تقسیم سے رضا", es: "Contentamiento con la participación de Dios en la elección de una carrera principal", fr: "Contentement quant au rôle de Dieu dans le choix d'une majeure", tr: "Tanrı'nın uzmanlık seçerken böldüğü şeyle memnun olmak", id: "Kepuasan dengan apa yang telah dibagi Tuhan dalam memilih spesialisasi" }
summary:
  ar: "سألت طالبة هندسة معمارية اختارت قسمها برغبتها ثم ندمت بعد أن لاحظت صعوبته عن حالها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79118 بتاريخ 7 يونيو 2009)⁩ أنه لا يقع شيء في هذا الوجود إلا بقدر الله، وإذا كانت قد قامت بما يجب عليها من الاستخارة والاستشارة فينبغي أن ترضى بما قسم الله لها ولعل الذي تكرهه يجعل الله فيه خيرًا كثيرًا لقوله وعسى أن تكرهوا شيئًا ويجعل الله فيه خيرًا كثيرًا."
  en: "A second-year architecture student who chose her department by preference — though her grades admitted her to dentistry — and then regretted it asked for guidance. Dr. Salah al-Sawi (fatwa no. 79118, 7 June 2009) answered that nothing in existence befalls except by God's decree; having done her duty of istikhara and consultation, she should be content with God's share for her — perhaps the thing she dislikes holds much good, per 'it may be you hate a thing and God makes much good in it'."
  ur: "ایک طالبہ نے اپنے شعبے کے انتخاب پر پچھتاوے کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79118، 7 جون 2009)⁩ کے مطابق استخارہ و مشورہ کے بعد اللہ کی تقسیم پر راضی رہے — ہو سکتا ہے ناپسندیدہ چیز میں خیر ہو۔"
  es: "Una estudiante de segundo año de arquitectura que eligió su carrera por preferencia —aunque sus calificaciones le permitían ingresar a odontología— y luego se arrepintió, solicitó orientación. El Dr. Salah al-Sawi (fatwa n.° 79118, 7 de junio de 2009) respondió que nada en la existencia sucede sino por decreto divino; habiendo cumplido con su deber de istikhara y consulta, debería estar contenta con lo que Dios le ha deparado; tal vez aquello que le disgusta encierra mucho bien, pues «puede que odies algo y Dios haga mucho bien en ello»."
  fr: "Une étudiante en deuxième année d'architecture, qui avait choisi cette filière par préférence – bien que ses notes lui aient permis d'intégrer le domaine dentaire – et qui le regrettait par la suite, a demandé conseil. Le Dr Salah al-Sawi (fatwa n° 79118, 7 juin 2009) lui a répondu que rien n'arrive en dehors de la volonté divine; ayant accompli son devoir de prière et de consultation, elle devait se contenter de ce que Dieu lui réservait – peut-être que ce qu'elle déteste recèle de nombreux bienfaits, car « il se peut que tu détestes une chose et que Dieu en tire beaucoup de bien »."
  tr: "Bir mimarlık mühendisliği öğrencisine sordum, bölümünü isteğine göre seçti ama bunun kendisi için ne kadar zor olduğunu fark edince pişman oldu. Dr. Salah Al-Sawy (7 Haziran 2009 tarihli 79118 No. Fetva) bu varoluşta sadece Allah'ın buyruğu dışında hiçbir şey olduğunu ve eğer zorunlu istikhara ve danışmanlığını yerine getirdiyse, Tanrı'nın onun için verdiği şeyle yetinmesi gerektiğini söyledi. Belki de hoşlanmadığı şey onun için çok iyi olur, dediği gibi. Belki bir şeyi sevmezsin ve Tanrı bundan çok iyilik sağlar."
  id: "Saya bertanya kepada seorang mahasiswa teknik arsitektur yang memilih jurusannya sesuai keinginannya tetapi menyesalinya setelah menyadari betapa sulitnya hal itu baginya. Dr. Salah Al-Sawy menjawab (Fatwa No. 79118 tanggal 7 Juni 2009) bahwa tidak ada yang terjadi dalam keberadaan ini kecuali atas perintah Tuhan, dan jika dia telah memenuhi istikhara dan konsultasi yang wajib, dia harus puas dengan apa yang telah ditetapkan Tuhan untuknya. Mungkin apa yang tidak dia sukai akan sangat baik untuknya, seperti yang dia katakan. Mungkin kamu tidak menyukai sesuatu dan Tuhan akan melakukan banyak kebaikan darinya."
