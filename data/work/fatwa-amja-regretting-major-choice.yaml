id: work/fatwa-amja-regretting-major-choice
class: work
kind: fatwa
label: { ar: "الرضا بما قسم الله في اختيار التخصص", en: "Contentment with God's share in choosing a major", ur: "شعبے کے انتخاب پر اللہ کی تقسیم سے رضا" }
summary:
  ar: "سألت طالبة هندسة معمارية اختارت قسمها برغبتها ثم ندمت بعد أن لاحظت صعوبته عن حالها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79118 بتاريخ 7 يونيو 2009)⁩ أنه لا يقع شيء في هذا الوجود إلا بقدر الله، وإذا كانت قد قامت بما يجب عليها من الاستخارة والاستشارة فينبغي أن ترضى بما قسم الله لها ولعل الذي تكرهه يجعل الله فيه خيرًا كثيرًا لقوله وعسى أن تكرهوا شيئًا ويجعل الله فيه خيرًا كثيرًا."
  en: "A second-year architecture student who chose her department by preference — though her grades admitted her to dentistry — and then regretted it asked for guidance. Dr. Salah al-Sawi (fatwa no. 79118, 7 June 2009) answered that nothing in existence befalls except by God's decree; having done her duty of istikhara and consultation, she should be content with God's share for her — perhaps the thing she dislikes holds much good, per 'it may be you hate a thing and God makes much good in it'."
  ur: "ایک طالبہ نے اپنے شعبے کے انتخاب پر پچھتاوے کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79118، 7 جون 2009)⁩ کے مطابق استخارہ و مشورہ کے بعد اللہ کی تقسیم پر راضی رہے — ہو سکتا ہے ناپسندیدہ چیز میں خیر ہو۔"
