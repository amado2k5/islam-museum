  ar: "مفتاح العلوم، كتاب في البلاغة لمؤلفه أبو يعقوب يوسف السكاكي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 626هـ / 1229م {cite:wikipedia-en-miftah-al-ulum}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book 26581 {cite:shamela-ws-book-26581}. لم يقرأ المتحف الكتاب."
  en: "Miftah al-Ulum, a book on rhetoric (balagha) by Abu Ya'qub Yusuf al-Sakkaki; its date in a research summary supplied to the museum is d. 626 AH / 1229 CE {cite:wikipedia-en-miftah-al-ulum}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book 26581 {cite:shamela-ws-book-26581}. The museum has not read the book."
  ur: "مفتاح العلوم، بلاغت پر ایک کتاب، مصنف أبو يعقوب يوسف السكاكي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 626ھ / 1229ء {cite:wikipedia-en-miftah-al-ulum}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book 26581 {cite:shamela-ws-book-26581}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Miftah al-Ulum, livre sur la rhétorique (balagha) de Abu Ya'qub Yusuf al-Sakkaki ; sa date dans une synthèse de recherche remise au musée : m. 626 H / 1229 {cite:wikipedia-en-miftah-al-ulum}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book 26581 {cite:shamela-ws-book-26581}. Le musée n'a pas lu le livre."
  es: "Miftah al-Ulum, libro sobre retórica (balagha) de Abu Ya'qub Yusuf al-Sakkaki; su fecha en un resumen de investigación entregado al museo: m. 626 H. / 1229 {cite:wikipedia-en-miftah-al-ulum}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book 26581 {cite:shamela-ws-book-26581}. El museo no ha leído el libro."
