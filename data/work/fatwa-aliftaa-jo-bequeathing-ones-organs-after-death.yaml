id: work/fatwa-aliftaa-jo-bequeathing-ones-organs-after-death
class: work
kind: fatwa
label: { ar: "الوصية بالتبرع بالأعضاء بعد الوفاة", en: "Bequeathing one's organs after death", ur: "موت کے بعد اعضا کے عطیے کی وصیت", es: "Donar los órganos después de la muerte", fr: "Léguer ses organes après la mort", tr: "Ölüm Sonrası Organ Bağışı Vasiyeti", id: "Wasiat untuk Donasi Organ Setelah Kematian" }
summary:
  ar: "سؤال من مبادرة للتوعية بالتبرع بالأعضاء عن وصية الإنسان بالتبرع بأعضائه بعد وفاته، أجابت فيه دائرة الإفتاء العام الأردنية بأن التبرع بالأعضاء بعد الوفاة لدفع الضرر عن الآخرين تبيحه الشريعة، وعدّته من التعاون على البر. أجابت الدائرة بأن الله أمر بالتعاون على البر والتقوى، ونقلت عن الماوردي في أدب الدنيا والدين أن الجمع بين التقوى والبر يجمع رضا الله ورضا الناس. وقالت إن تبرع الإنسان عند وفاته بعضو من أعضائه ليدفع ضررًا عن غيره أمر تبيحه الشريعة، ويندرج تحت القاعدتين المتفق عليهما: الضرورات تبيح المحظورات، والضرورة تقدر بقدرها. واستشهدت بأحاديث في تفريج الكرب عن الناس، وقالت إن حاجة المريض إلى العضو أو الأعمى إلى البصر أشد من حاجة الفقير إلى المال، وإن من أوصى بالتبرع خدمة للمرضى المحتاجين ختم حياته بعمل جليل. وذكرت أن الدائرة أصدرت فتاوى سابقة بجواز التبرع بالأعضاء، منها فتوى في التبرع بقرنية العين، وأشادت بنجاح الأطباء في الأردن في زراعة القرنيات والجلد وغيرها."
  en: "A question from an organ-donation awareness initiative about a person bequeathing all his organs for donation after death, in which Jordan's General Iftaa Department answered that donating organs after death to relieve harm to others is permitted by the sharia, counting it as cooperation in righteousness. The Department answered that God commanded cooperation in righteousness and piety, quoting al-Mawardi's Adab al-Dunya wa-l-Din that joining piety with righteousness brings together God's pleasure and people's. It said that a person's donating one of his organs at death to relieve harm to another is permitted by the sharia, falling under two agreed maxims: necessity makes the prohibited permissible, and necessity is measured by its extent. It cited hadiths on relieving people's distress, said that a patient's need for an organ, or a blind person's need for sight, is greater than a poor person's need for money, and said that whoever bequeaths a donation to serve needy patients ends his life with a noble deed. It noted that the Department had earlier issued fatwas permitting organ donation, including one on donating the cornea, and praised Jordanian doctors' success in transplanting corneas, skin and other organs."
  ur: "اعضا کے عطیے کی آگاہی کے ایک اقدام کا سوال کہ انسان موت کے بعد اپنے تمام اعضا کے عطیے کی وصیت کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دوسروں سے نقصان دور کرنے کے لیے موت کے بعد اعضا کا عطیہ شریعت میں جائز ہے، اور اسے نیکی میں تعاون قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ اللہ نے نیکی اور تقویٰ میں تعاون کا حکم دیا ہے، اور ماوردی کی ادب الدنیا والدین سے نقل کیا کہ تقویٰ اور نیکی کو جمع کرنا اللہ اور لوگوں دونوں کی رضا کو جمع کرتا ہے۔ اس نے کہا کہ انسان کا اپنی موت کے وقت کسی کا نقصان دور کرنے کے لیے اپنا کوئی عضو عطیہ کرنا شریعت میں جائز ہے، اور یہ دو متفقہ قواعد کے تحت آتا ہے: ضرورتیں ممنوع چیزوں کو مباح کر دیتی ہیں، اور ضرورت بقدرِ ضرورت ہوتی ہے۔ اس نے لوگوں کی تکلیف دور کرنے کے بارے میں احادیث سے استدلال کیا، اور کہا کہ مریض کو عضو کی یا نابینا کو بینائی کی ضرورت فقیر کو مال کی ضرورت سے زیادہ ہے، اور جو ضرورت مند مریضوں کی خدمت کے لیے عطیے کی وصیت کرے وہ اپنی زندگی ایک عظیم عمل پر ختم کرتا ہے۔ اس نے بتایا کہ ڈیپارٹمنٹ پہلے بھی اعضا کے عطیے کے جواز پر فتاویٰ جاری کر چکا ہے، جن میں آنکھ کے قرنیہ کے عطیے کا فتویٰ بھی ہے، اور اردن کے ڈاکٹروں کی قرنیہ، جلد اور دیگر اعضا کی پیوند کاری میں کامیابی کی تعریف کی۔"
  es: "Una pregunta de una iniciativa de concienciación sobre la donación de órganos acerca de una persona que lega todos sus órganos para donación después de su muerte, a la que el Departamento General de Iftaa de Jordania respondió que la donación de órganos después de la muerte para aliviar el daño a otros está permitida por la sharia, considerándola cooperación en la rectitud. El Departamento respondió que Dios ordenó la cooperación en la rectitud y la piedad, citando el Adab al-Dunya wa-l-Din de al-Mawardi, que dice que unir la piedad con la rectitud reúne la complacencia de Dios y la de los hombres. Dijo que la donación de uno de los órganos de una persona al morir para aliviar el daño a otra está permitida por la sharia, enmarcada en dos máximas consensuadas: la necesidad hace permisible lo prohibido, y la necesidad se mide por su magnitud. Citó hadices sobre el alivio del sufrimiento ajeno, afirmó que la necesidad de un órgano para un paciente, o la de una persona ciega para recuperar la vista, es mayor que la necesidad de dinero para un pobre, y señaló que quien lega una donación para ayudar a pacientes necesitados culmina su vida con una noble acción. Asimismo, indicó que el Departamento había emitido previamente fatuas que permitían la donación de órganos, incluyendo una sobre la donación de córneas, y elogió el éxito de los médicos jordanos en el trasplante de córneas, piel y otros órganos."
  fr: "Une question posée dans le cadre d'une initiative de sensibilisation au don d'organes concernait le legs de tous les organes d'une personne décédée. Le Département général de la Iftaa de Jordanie a répondu que le don d'organes après la mort, afin de soulager la souffrance d'autrui, est autorisé par la charia, car il s'agit d'une forme de coopération à la piété. Le Département a expliqué que Dieu a ordonné la coopération dans la piété et la droiture, citant l'ouvrage d'al-Mawardi, Adab al-Dunya wa-l-Din, selon lequel l'union de la piété et de la droiture rapproche l'agrément de Dieu et celui des hommes. Il a précisé que le don d'un organe après le décès, pour soulager la souffrance d'autrui, est autorisé par la charia, car il repose sur deux principes reconnus: la nécessité rend l'interdit licite, et la nécessité s'apprécie selon son degré. Le communiqué citait des hadiths sur le soulagement de la détresse humaine, affirmant que le besoin d'un organe pour un patient, ou le besoin de la vue pour une personne aveugle, primait sur le besoin d'argent pour une personne pauvre, et que quiconque lègue un bien pour venir en aide aux malades nécessiteux accomplit un acte noble. Il rappelait que le Département avait précédemment émis des fatwas autorisant le don d'organes, notamment le don de cornée, et saluait le succès des médecins jordaniens dans les transplantations de cornées, de peau et d'autres organes."
  tr: "Organ bağışı farkındalığı için bir girişimden bir kişinin ölümden sonra organ bağışını yapma isteği hakkında bir soru; Ürdün Genel Fetva Dairesi, başkalarına zarar vermemek için ölümden sonra organ bağışının Şeriat tarafından izin verildiğini ve bunu doğruluk işbirliği olarak değerlendirdiğini belirtti. Daire, Tanrı'nın doğruluk ve takvada işbirliğini emrettiğini ve Al-Mawardi'nin Adab al-Dunya wa al-Din adlı eserinde dindarlık ile doğruluğun birleşmenin Allah'a ve insanlara zevk getirdiğini aktardığını belirtti. Ölüm anında organ bağışının, başkalarından zarar görmemek için Şeriat tarafından izin verildiğini ve üzerinde anlaşılan iki ilkeye göre olduğunu belirtti: zorunluluk yasaklara izin verir, zorunluluk ise kapsamına göre belirlenir. İnsanların sıkıntılarını hafifletmeye yönelik hadislere atıfta bulunarak, hastanın organ ihtiyacının, görme engellilerin yoksullara olan ihtiyacından daha fazla olduğunu ve ihtiyaç sahibi hastalara bağış bırakanların hayatını asil bir eylemle sonlandırdığını belirtti. Bakanlığın daha önce organ bağışına izin veren fetvalar verdiğini, kornea bağışı fetvası da dahil olmak üzere, belirtti ve Ürdün'deki doktorların kornea ve deri nakillerindeki başarısını övdü."
  id: "Sebuah pertanyaan dari inisiatif kesadaran donor organ tentang kehendak seseorang untuk mendonorkan organ setelah kematian, di mana Departemen Fatwa Umum Yordania menanggapi bahwa donor organ setelah kematian untuk mencegah bahaya kepada orang lain diizinkan oleh Syariah, dan menganggapnya sebagai kerja sama dalam kebenaran. Departemen tersebut menjawab bahwa Tuhan memerintahkan kerja sama dalam kebenaran dan kesalehan, dan mengutip Al-Mawardi dalam Adab al-Dunya wa al-Din bahwa menggabungkan kesalehan dan kebenaran membawa kesenangan Tuhan dan manusia. Departemen tersebut menyatakan bahwa mendonorkan organ pada saat kematian untuk menghindari bahaya dari orang lain diizinkan oleh Syariah, dan termasuk dalam dua prinsip yang disepakati: kebutuhan memungkinkan larangan, dan kebutuhan ditentukan sesuai dengan cakupannya. Ia mengutip hadits tentang meringankan penderitaan masyarakat, mengatakan bahwa kebutuhan pasien akan organ atau tunanetra untuk penglihatan lebih besar daripada kebutuhan uang bagi orang miskin, dan bahwa siapa pun yang mewariskan donasi untuk melayani pasien yang membutuhkan mengakhiri hidupnya dengan perbuatan mulia. Hadits-hadits tersebut menyebutkan bahwa departemen sebelumnya telah mengeluarkan fatwa yang mengizinkan donasi organ, termasuk fatwa tentang donasi kornea, dan memuji keberhasilan dokter di Yordania dalam transplantasi kornea dan kulit, antara lain."
