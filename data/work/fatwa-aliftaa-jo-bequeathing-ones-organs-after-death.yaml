id: work/fatwa-aliftaa-jo-bequeathing-ones-organs-after-death
class: work
kind: fatwa
label: { ar: "الوصية بالتبرع بالأعضاء بعد الوفاة", en: "Bequeathing one's organs after death", ur: "موت کے بعد اعضا کے عطیے کی وصیت" }
summary:
  ar: "سؤال من مبادرة للتوعية بالتبرع بالأعضاء عن وصية الإنسان بالتبرع بأعضائه بعد وفاته، أجابت فيه دائرة الإفتاء العام الأردنية بأن التبرع بالأعضاء بعد الوفاة لدفع الضرر عن الآخرين تبيحه الشريعة، وعدّته من التعاون على البر. أجابت الدائرة بأن الله أمر بالتعاون على البر والتقوى، ونقلت عن الماوردي في أدب الدنيا والدين أن الجمع بين التقوى والبر يجمع رضا الله ورضا الناس. وقالت إن تبرع الإنسان عند وفاته بعضو من أعضائه ليدفع ضررًا عن غيره أمر تبيحه الشريعة، ويندرج تحت القاعدتين المتفق عليهما: الضرورات تبيح المحظورات، والضرورة تقدر بقدرها. واستشهدت بأحاديث في تفريج الكرب عن الناس، وقالت إن حاجة المريض إلى العضو أو الأعمى إلى البصر أشد من حاجة الفقير إلى المال، وإن من أوصى بالتبرع خدمة للمرضى المحتاجين ختم حياته بعمل جليل. وذكرت أن الدائرة أصدرت فتاوى سابقة بجواز التبرع بالأعضاء، منها فتوى في التبرع بقرنية العين، وأشادت بنجاح الأطباء في الأردن في زراعة القرنيات والجلد وغيرها."
  en: "A question from an organ-donation awareness initiative about a person bequeathing all his organs for donation after death, in which Jordan's General Iftaa Department answered that donating organs after death to relieve harm to others is permitted by the sharia, counting it as cooperation in righteousness. The Department answered that God commanded cooperation in righteousness and piety, quoting al-Mawardi's Adab al-Dunya wa-l-Din that joining piety with righteousness brings together God's pleasure and people's. It said that a person's donating one of his organs at death to relieve harm to another is permitted by the sharia, falling under two agreed maxims: necessity makes the prohibited permissible, and necessity is measured by its extent. It cited hadiths on relieving people's distress, said that a patient's need for an organ, or a blind person's need for sight, is greater than a poor person's need for money, and said that whoever bequeaths a donation to serve needy patients ends his life with a noble deed. It noted that the Department had earlier issued fatwas permitting organ donation, including one on donating the cornea, and praised Jordanian doctors' success in transplanting corneas, skin and other organs."
  ur: "اعضا کے عطیے کی آگاہی کے ایک اقدام کا سوال کہ انسان موت کے بعد اپنے تمام اعضا کے عطیے کی وصیت کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دوسروں سے نقصان دور کرنے کے لیے موت کے بعد اعضا کا عطیہ شریعت میں جائز ہے، اور اسے نیکی میں تعاون قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ اللہ نے نیکی اور تقویٰ میں تعاون کا حکم دیا ہے، اور ماوردی کی ادب الدنیا والدین سے نقل کیا کہ تقویٰ اور نیکی کو جمع کرنا اللہ اور لوگوں دونوں کی رضا کو جمع کرتا ہے۔ اس نے کہا کہ انسان کا اپنی موت کے وقت کسی کا نقصان دور کرنے کے لیے اپنا کوئی عضو عطیہ کرنا شریعت میں جائز ہے، اور یہ دو متفقہ قواعد کے تحت آتا ہے: ضرورتیں ممنوع چیزوں کو مباح کر دیتی ہیں، اور ضرورت بقدرِ ضرورت ہوتی ہے۔ اس نے لوگوں کی تکلیف دور کرنے کے بارے میں احادیث سے استدلال کیا، اور کہا کہ مریض کو عضو کی یا نابینا کو بینائی کی ضرورت فقیر کو مال کی ضرورت سے زیادہ ہے، اور جو ضرورت مند مریضوں کی خدمت کے لیے عطیے کی وصیت کرے وہ اپنی زندگی ایک عظیم عمل پر ختم کرتا ہے۔ اس نے بتایا کہ ڈیپارٹمنٹ پہلے بھی اعضا کے عطیے کے جواز پر فتاویٰ جاری کر چکا ہے، جن میں آنکھ کے قرنیہ کے عطیے کا فتویٰ بھی ہے، اور اردن کے ڈاکٹروں کی قرنیہ، جلد اور دیگر اعضا کی پیوند کاری میں کامیابی کی تعریف کی۔"
