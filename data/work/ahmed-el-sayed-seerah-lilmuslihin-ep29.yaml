id: work/ahmed-el-sayed-seerah-lilmuslihin-ep29
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 29: عودة مهاجري الحبشة"
  en: "The Prophetic Biography for Reformers, episode 29: The return of the Abyssinia emigrants"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 29: حبشہ کے مہاجرین کی واپسی"
  fr: "La biographie prophétique pour les réformateurs, épisode 29 : Le retour des émigrés d'Abyssinie"
  es: "La biografía profética para los reformadores, episodio 29: El regreso de los emigrados de Abisinia"
summary:
  ar: "يختم الكلام على خيبر بعودة مهاجري الحبشة بقيادة جعفر وجماعة الأشعريين، ودروس الغلام مدعم والأمانة في الأموال العامة، والرجوع إلى المدينة. ثم يتناول أسماء بنت عميس وعمر، وزيجات النبي في السنة السابعة، ورسائله إلى الملوك والخاتم الذي اتخذه، والسرايا الصغيرة قبل عمرة القضاء."
  en: "He completes the Khaybar chapter with the return of the Abyssinia emigrants under Jafar and the Ashari group, the lessons of the slave Mid'am and of honesty with public funds, and the return to Medina. He then covers Asma bint Umays and Umar, the Prophet's marriages of the seventh year, his letters to the kings and the seal he adopted, and the small expeditions before the Fulfilled Umrah."
  ur: "وہ خیبر کے باب کو حبشہ کے مہاجرین کی واپسی کے ساتھ مکمل کرتے ہیں، جن کی قیادت جعفر کر رہے تھے اور جن کے ساتھ اشعری جماعت بھی تھی۔ پھر غلام مدعم کے سبق اور عوامی مال میں امانت کا ذکر کرتے ہیں اور مدینہ واپسی بیان کرتے ہیں۔ اس کے بعد اسماء بنت عمیس اور عمر، ساتویں سال میں نبی کے نکاح، بادشاہوں کو آپ کے خطوط اور آپ کی اپنائی ہوئی مہر، اور عمرۃ القضاء سے پہلے کی چھوٹی مہمات کا ذکر کرتے ہیں۔"
  fr: "Il achève le chapitre de Khaybar avec le retour des émigrés d'Abyssinie sous la conduite de Jafar et du groupe des Ashari, les leçons du serviteur Mid'am et de l'honnêteté dans les fonds publics, puis le retour à Médine. Il traite ensuite d'Asma bint Umays et d'Umar, des mariages du Prophète en la septième année, de ses lettres aux rois et du sceau qu'il adopta, ainsi que des petites expéditions précédant la Umra de l'accomplissement."
  es: "Concluye el capítulo de Jaybar con el regreso de los emigrados de Abisinia bajo Jafar y el grupo de los Ashari, las lecciones del siervo Mid'am y de la honradez con los fondos públicos, y el regreso a Medina. Después trata de Asma bint Umays y Umar, de los matrimonios del Profeta en el séptimo año, de sus cartas a los reyes y del sello que adoptó, y de las pequeñas expediciones previas a la Umra de cumplimiento."
