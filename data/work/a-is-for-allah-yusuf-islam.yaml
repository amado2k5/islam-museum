kind: album
label: { ar: "A Is for Allah ⁦(الألف لله)⁩", en: "A Is for Allah", ur: "اے از فار اللہ", es: "A es para Alá", fr: "A comme Allah", tr: "A Allah içindir", id: "A adalah untuk Allah" }
summary:
  ar: "ألبوم مزدوج للأطفال المسلمين صنعه يوسف إسلام، صدر في 11 يوليو 2000 عن دار «جبل النور» التابعة له، ليعلّم الحروف العربية الثمانية والعشرين حرفا حرفا؛ كتب أغنيته الرئيسة سنة 1980 عند ولادة ابنته الأولى حسنة، وشارك فيه المنشد الجنوب أفريقي زين بيكا، وصدر معه كتاب مصوّر للحروف."
  en: "A double album for Muslim children made by Yusuf Islam and released on 11 July 2000 on his own Mountain of Light imprint, teaching the twenty-eight letters of the Arabic alphabet one by one; he wrote its title song in 1980 at the birth of his first child, Hasanah, the South African singer Zain Bhikha sings on most tracks, and it came with an illustrated alphabet book."
  ur: "مسلمان بچوں کے لیے یوسف اسلام کا دوہرا البم، جو 11 جولائی 2000 کو ان کے اپنے ادارے «ماؤنٹین آف لائٹ» سے جاری ہوا اور عربی کے اٹھائیس حروف ایک ایک کر کے سکھاتا ہے؛ عنوانی گیت انہوں نے 1980 میں اپنی پہلی بیٹی حسنہ کی پیدائش پر لکھا، اور جنوبی افریقہ کے زین بھیکا اکثر ٹریکس میں شریک ہیں۔"
  es: "Un álbum doble para niños musulmanes, creado por Yusuf Islam y publicado el 11 de julio de 2000 bajo su propio sello discográfico, Mountain of Light, que enseña las veintiocho letras del alfabeto árabe una por una; compuso la canción principal en 1980, con motivo del nacimiento de su primera hija, Hasanah; la cantante sudafricana Zain Bhikha participa en la mayoría de los temas; y el álbum venía acompañado de un libro ilustrado del alfabeto."
  fr: "Un double album pour enfants musulmans, réalisé par Yusuf Islam et sorti le 11 juillet 2000 sur son propre label Mountain of Light, enseignant les vingt-huit lettres de l'alphabet arabe une par une; il a écrit sa chanson titre en 1980 à la naissance de son premier enfant, Hasanah, le chanteur sud-africain Zain Bhikha chante sur la plupart des morceaux, et il était accompagné d'un livre d'alphabet illustré."
  tr: "Youssef Islam tarafından 11 Temmuz 2000'de bağlı yayınevi 'Jabal Al-Noor' tarafından yayımlanan Müslüman çocuklar için çift albüm, yirmi sekiz Arapça harfini harf harf öğretti; ana şarkısını 1980'de ilk kızı Hasna'nın doğumunda Güney Afrikalı vokalist Zain Beka'nın yer aldığı şarkıyı yazdı ve onunla birlikte mektuplar için bir resimli kitap yayımlandı."
  id: "Album ganda untuk anak-anak Muslim yang dibuat oleh Youssef Islam, dirilis pada 11 Juli 2000 oleh penerbit afiliasinya 'Jabal Al-Noor,' ia mengajarkan dua puluh delapan huruf Arab huruf demi huruf; ia menulis lagu utamanya pada tahun 1980 saat kelahiran putri pertamanya Hasna, menampilkan vokalis Afrika Selatan Zain Beka, dan sebuah buku gambar untuk sastra diterbitkan bersamanya."
