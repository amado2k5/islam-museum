label: { ar: "A Is for Allah ⁦(الألف لله)⁩", en: "A Is for Allah", ur: "اے از فار اللہ" }
summary:
  ar: "ألبوم مزدوج للأطفال المسلمين صنعه يوسف إسلام، صدر في 11 يوليو 2000 عن دار «جبل النور» التابعة له، ليعلّم الحروف العربية الثمانية والعشرين حرفا حرفا؛ كتب أغنيته الرئيسة سنة 1980 عند ولادة ابنته الأولى حسنة، وشارك فيه المنشد الجنوب أفريقي زين بيكا، وصدر معه كتاب مصوّر للحروف."
  en: "A double album for Muslim children made by Yusuf Islam and released on 11 July 2000 on his own Mountain of Light imprint, teaching the twenty-eight letters of the Arabic alphabet one by one; he wrote its title song in 1980 at the birth of his first child, Hasanah, the South African singer Zain Bhikha sings on most tracks, and it came with an illustrated alphabet book."
  ur: "مسلمان بچوں کے لیے یوسف اسلام کا دوہرا البم، جو 11 جولائی 2000 کو ان کے اپنے ادارے «ماؤنٹین آف لائٹ» سے جاری ہوا اور عربی کے اٹھائیس حروف ایک ایک کر کے سکھاتا ہے؛ عنوانی گیت انہوں نے 1980 میں اپنی پہلی بیٹی حسنہ کی پیدائش پر لکھا، اور جنوبی افریقہ کے زین بھیکا اکثر ٹریکس میں شریک ہیں۔"
