id: work/fatwa-amja-acting-on-wrong-fatwa
class: work
kind: fatwa
label: { ar: "العمل بفتوى ثبت خطؤها", en: "Acting on a fatwa later shown to be wrong", ur: "غلط فتویٰ پر عمل", es: "Actuar en base a una fatua que posteriormente se demostró que era errónea", fr: "Agir sur la base d'une fatwa qui s'est avérée par la suite erronée", tr: "Yanlış olduğu kanıtlanmış bir fetvaya göre hareket etmek", id: "Bertindak atas fatwa terbukti salah" }
summary:
  ar: "سأل سائل أنه سأل جهة رسمية للإفتاء فأفتته وعمل بجوابها هل يحاسبه الله إن كانت الإجابة خاطئة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84032 بتاريخ 18 مارس 2011)⁩ أنه إن تجرد لطلب الحق وتمحض لاتباع الشرع وسأل من يثق في دينه وعلمه فأفتاه فاتبعه فلا حرج عليه وهو معذور أخطأ المفتي أم أصاب لأن ذلك مبلغه من العلم، وعليه اتباع ما تبين له بعد ذلك من الحق فيما يستقبل وتدارك ما يمكن تداركه، وما فات ولم يمكن تداركه فهو عفو إن شاء الله."
  en: "A questioner asked whether God would hold him accountable if an official fatwa body's answer he acted on turned out wrong. Dr. Salah al-Sawi (fatwa no. 84032, 18 March 2011) answered that if he sincerely sought the truth, asked one whose religion and knowledge he trusted and followed the answer, there is no blame and he is excused whether the mufti erred or hit right — that being his reach of knowledge; he must then follow what later proves right and repair what can be repaired, and what is past and irreparable is pardoned, God willing."
  ur: "ایک سائل نے پوچھا کہ اگر سرکاری فتویٰ پر عمل کیا اور وہ غلط نکلی تو کیا وہ جوابدہ ہو گا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84032، 18 مارچ 2011)⁩ کے مطابق خلوص سے پوچھ کر عمل کرنے والا معذور ہے؛ بعد میں صحیح سامنے آئے تو اسی پر عمل کرے۔"
  es: "Un interlocutor preguntó si Dios le pediría cuentas si la respuesta de un organismo oficial de fatuas que él siguió resultaba ser errónea. El Dr. Salah al-Sawi (fatua n.º 84032, 18 de marzo de 2011) respondió que si buscó sinceramente la verdad, consultó a alguien en cuya religión y conocimiento confiaba y siguió la respuesta, no hay culpa y queda eximido de responsabilidad, ya sea que el muftí se equivocara o acertara, dado su alcance de conocimiento; entonces debe seguir lo que posteriormente se demuestre correcto y corregir lo que se pueda corregir, y lo que es pasado e irreparable queda perdonado, si Dios quiere."
  fr: "Un internaute a demandé si Dieu lui demanderait des comptes si la fatwa officielle sur laquelle il se fonderait s'avérait erronée. Le Dr Salah al-Sawi (fatwa n° 84032, 18 mars 2011) a répondu que s'il recherchait sincèrement la vérité, consultait une personne dont il respectait la religion et le savoir, et suivait sa réponse, il n'y a pas de reproche à lui faire et il est excusé, que le mufti se soit trompé ou ait vu juste – cela relevant de sa compétence. Il doit alors suivre ce qui s'avère juste par la suite et réparer ce qui peut l'être; quant au passé, ce qui est irréparable est pardonné, si Dieu le veut."
  tr: "Bir soru soran kişi, fetva vermek için resmi bir yetkiliye başvurup sormadığını sordu, o da bir fetva çıkardı ve cevabına göre hareket etti: Cevap yanlış olursa Allah onu sorumlu tutacak mı? Dr. Salah Al-Sawy (18 Mart 2011 tarihli 84032 sayılı fetva) şöyle yanıt verdi: Eğer biri gerçeği aramaya ve Şeriat'a adanmışsa, dinine ve bilgisine güvenen birine sorarsa, fetva verip onu takip ederse, onda suç yoktur ve müftü hata yapsa da düzeltilse de affedilir, çünkü bilgi düzeyi budur. Sonradan kendisine anlaşılan doğruyu takip etmelidir; alınan ve düzeltilebilecek gerçekler. Gözden kaçan ve düzeltilemeyen şeyler, İnşallah affedilir."
  id: "Seorang penanya bertanya apakah ia telah meminta otoritas resmi untuk mengeluarkan fatwa, dan ia mengeluarkan fatwa dan bertindak berdasarkan jawabannya: Apakah Allah akan menuntut pertanggungjawaban jika jawabannya salah? Dr. Salah Al-Sawy menjawab (Fatwa No. 84032 tanggal 18 Maret 2011) bahwa jika seseorang berdedikasi mencari kebenaran dan mengabdikan diri untuk mengikuti Syariah, dan ia meminta seseorang yang percaya pada agama dan pengetahuannya, lalu mengeluarkan fatwa dan mengikutinya, maka tidak ada kesalahan pada dirinya dan ia dimaafkan, baik mufti itu salah atau mengoreksi karena itulah tingkat pengetahuannya. Ia harus mengikuti apa yang kemudian menjadi jelas baginya tentang kebenaran dalam apa yang diterima dan apa yang dapat diperbaiki. Apa yang terlewat dan tidak dapat diperbaiki diampuni, insya Allah."
