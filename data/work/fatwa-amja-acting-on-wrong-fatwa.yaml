id: work/fatwa-amja-acting-on-wrong-fatwa
class: work
kind: fatwa
label: { ar: "العمل بفتوى ثبت خطؤها", en: "Acting on a fatwa later shown to be wrong", ur: "غلط فتویٰ پر عمل", es: "Actuar en base a una fatua que posteriormente se demostró que era errónea" }
summary:
  ar: "سأل سائل أنه سأل جهة رسمية للإفتاء فأفتته وعمل بجوابها هل يحاسبه الله إن كانت الإجابة خاطئة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84032 بتاريخ 18 مارس 2011)⁩ أنه إن تجرد لطلب الحق وتمحض لاتباع الشرع وسأل من يثق في دينه وعلمه فأفتاه فاتبعه فلا حرج عليه وهو معذور أخطأ المفتي أم أصاب لأن ذلك مبلغه من العلم، وعليه اتباع ما تبين له بعد ذلك من الحق فيما يستقبل وتدارك ما يمكن تداركه، وما فات ولم يمكن تداركه فهو عفو إن شاء الله."
  en: "A questioner asked whether God would hold him accountable if an official fatwa body's answer he acted on turned out wrong. Dr. Salah al-Sawi (fatwa no. 84032, 18 March 2011) answered that if he sincerely sought the truth, asked one whose religion and knowledge he trusted and followed the answer, there is no blame and he is excused whether the mufti erred or hit right — that being his reach of knowledge; he must then follow what later proves right and repair what can be repaired, and what is past and irreparable is pardoned, God willing."
  ur: "ایک سائل نے پوچھا کہ اگر سرکاری فتویٰ پر عمل کیا اور وہ غلط نکلی تو کیا وہ جوابدہ ہو گا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84032، 18 مارچ 2011)⁩ کے مطابق خلوص سے پوچھ کر عمل کرنے والا معذور ہے؛ بعد میں صحیح سامنے آئے تو اسی پر عمل کرے۔"
  es: "Un interlocutor preguntó si Dios le pediría cuentas si la respuesta de un organismo oficial de fatuas que él siguió resultaba ser errónea. El Dr. Salah al-Sawi (fatua n.º 84032, 18 de marzo de 2011) respondió que si buscó sinceramente la verdad, consultó a alguien en cuya religión y conocimiento confiaba y siguió la respuesta, no hay culpa y queda eximido de responsabilidad, ya sea que el muftí se equivocara o acertara, dado su alcance de conocimiento; entonces debe seguir lo que posteriormente se demuestre correcto y corregir lo que se pueda corregir, y lo que es pasado e irreparable queda perdonado, si Dios quiere."
