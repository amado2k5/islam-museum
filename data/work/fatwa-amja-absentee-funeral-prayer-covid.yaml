label: { ar: "صلاة الغائب في النازلة", en: "Daily absentee funeral prayers for COVID's dead — the ruling", ur: "غائبانہ نمازِ جنازہ — کورونا" }
summary:
  ar: "سأل سائل عن جواز تكوين مجموعات تتواصى على صلاة الغائب كل يوم على من يموت في جائحة كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87746 بتاريخ 4 أبريل 2020)⁩ أن الصلاة على الغائب سواء في هذه النازلة أم في غيرها إنما تشرع في حق من لم يصل عليه اتفاقًا كما تشرع في أظهر أقوال أهل العلم في حق من لهم شأن على ما فصّل الجواب."
  en: "A questioner asked about forming groups that commend a daily absentee funeral prayer for those dying in the COVID pandemic. AMJA's fatwa committee (fatwa no. 87746, 4 April 2020) answered that the absentee prayer — in this crisis or otherwise — is legislated only for one not prayed over by agreement, and in the most evident of the scholars' sayings for those of standing — as the answer details."
  ur: "روز غائبانہ جنازہ؟ لجنة الفتوى ⁦(فتویٰ 87746، 4 اپریل 2020)⁩ کے مطابق صرف اسی پر جس پر جنازہ نہ پڑھا گیا ہو یا صاحبِ شان ہو۔"
