label: { ar: "صلاة الغائب في النازلة", en: "Daily absentee funeral prayers for COVID's dead — the ruling", ur: "غائبانہ نمازِ جنازہ — کورونا", es: "Oraciones fúnebres diarias en ausencia por los fallecidos por COVID: la decisión", fr: "Prières quotidiennes pour les défunts décédés de la COVID-19 — la décision", tr: "Felaket durumunda yok edilen dua", id: "Doa yang tidak hadir dalam kasus bencana" }
summary:
  ar: "سأل سائل عن جواز تكوين مجموعات تتواصى على صلاة الغائب كل يوم على من يموت في جائحة كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87746 بتاريخ 4 أبريل 2020)⁩ أن الصلاة على الغائب سواء في هذه النازلة أم في غيرها إنما تشرع في حق من لم يصل عليه اتفاقًا كما تشرع في أظهر أقوال أهل العلم في حق من لهم شأن على ما فصّل الجواب."
  en: "A questioner asked about forming groups that commend a daily absentee funeral prayer for those dying in the COVID pandemic. AMJA's fatwa committee (fatwa no. 87746, 4 April 2020) answered that the absentee prayer — in this crisis or otherwise — is legislated only for one not prayed over by agreement, and in the most evident of the scholars' sayings for those of standing — as the answer details."
  ur: "روز غائبانہ جنازہ؟ لجنة الفتوى ⁦(فتویٰ 87746، 4 اپریل 2020)⁩ کے مطابق صرف اسی پر جس پر جنازہ نہ پڑھا گیا ہو یا صاحبِ شان ہو۔"
  es: "Un interlocutor preguntó sobre la formación de grupos que recomiendan una oración fúnebre diaria en ausencia por los fallecidos durante la pandemia de COVID-19. El comité de fatuas de AMJA (fatua n.º 87746, 4 de abril de 2020) respondió que la oración en ausencia —en esta crisis o en cualquier otra— está legislada únicamente para aquellos por quienes no se ha orado de común acuerdo, y, según los dichos más evidentes de los eruditos, para aquellos que gozan de prestigio, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la formation de groupes recommandant une prière funéraire quotidienne pour les personnes décédées pendant la pandémie de COVID-19. Le comité des fatwas de l'AMJA (fatwa n° 87746, 4 avril 2020) a répondu que la prière pour les personnes décédées à distance – en cette période de crise ou non – n'est prescrite que pour les personnes n'ayant pas fait l'objet d'une prière funéraire consensuelle, et, selon l'avis le plus clair des savants, pour les personnes de haut rang – comme le précise la réponse."
  tr: "Bir soru soran, koronavirüs pandemisi sırasında hayatını kaybeden biri için her gün gıyabında şahsen namaz kılmayı öneren gruplar oluşturmanın izinliliğini sordu. Amerika Şeriat Hukukçuları Akademisi Fetva Komitesi (4 Nisan 2020 tarihli Fetva No. 87746), bu durumda ya da başka bir durumda olsun, yokluğunda biri için dua etmenin, sadece kendisi hakkında uzlaşmaya varılamayanlar için yasalaştırıldığını, tıpkı bu yasanın cevapta ayrıntılı olarak belirtildiği gibi, statü sahibi kişilerle ilgili en açık alim görüşlerine göre yasalaştırıldığını yanıtladı."
  id: "Seorang penanya menanyakan tentang diperbolehkannya membentuk kelompok yang merekomendasikan doa secara langsung secara in absentia setiap hari untuk seseorang yang meninggal selama pandemi virus corona. Komite Fatwa di Academy of Sharia Jurists in America (Fatwa No. 87746 tanggal 4 April 2020) menanggapi bahwa berdoa untuk seseorang secara in absentia, baik dalam kasus ini maupun kasus lain, hanya diatur oleh undang-undang bagi mereka yang tidak mencapai kesepakatan tentang dirinya, sama seperti undang-undang ini diatur berdasarkan pendapat paling jelas para sarjana tentang mereka yang memiliki status, seperti yang dijelaskan dalam jawaban."
