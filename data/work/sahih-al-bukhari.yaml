summary:
  ar: "الجامع المسند الصحيح المختصر من أمور رسول الله وسننه وأيامه لمحمد بن إسماعيل البخاري الجعفي {cite:sahih-al-bukhari-bugha p.1}. تصفه دائرة المعارف الإسلامية بأنه أشهر مؤلفاته، ويضم 97 كتابًا و3450 بابًا وفيه 7397 خبرًا بأسانيد كاملة، أو 2762 دون المكرر، مرتبة بحسب الموضوعات وفي الغالب على أبواب الفقه. صار مع صحيح مسلم في صدر مجاميع الحديث السني، ويعدّه أكثر أهل السنة أهمّ كتاب بعد القرآن، وللعيني وابن حجر والقسطلاني شروح عليه."
  en: "The Jami' al-Musnad al-Sahih of Muhammad ibn Isma'il al-Bukhari al-Ju'fi {cite:sahih-al-bukhari-bugha p.1}. The Encyclopaedia of Islam calls it his most famous work: 97 books and 3,450 chapters holding 7,397 reports with full chains, or 2,762 without repetitions, arranged by subject and in the main by the divisions of jurisprudence. It came to stand with Muslim's Sahih at the head of Sunni hadith collections, most Sunnis rank it the most important book after the Qur'an, and al-Ayni, Ibn Hajar and al-Qastallani wrote commentaries on it."
  ur: "الجامع المسند الصحیح المختصر من امور رسول اللہ وسننہ وایامہ محمد بن اسماعیل بخاری الجعفی کی کتاب ہے {cite:sahih-al-bukhari-bugha p.1}۔ اسلامی انسائیکلوپیڈیا اسے ان کی سب سے مشہور تصنیف کہتا ہے: 97 کتابیں اور 3450 ابواب جن میں مکمل اسناد کے ساتھ 7397 روایات ہیں، یا تکرار کے بغیر 2762، جو موضوع کے لحاظ سے اور زیادہ تر فقہ کے ابواب پر ترتیب دی گئی ہیں۔ یہ مسلم کی صحیح کے ساتھ سنی مجموعوں میں سرِ فہرست ٹھہری، بیشتر اہلِ سنت اسے قرآن کے بعد سب سے اہم کتاب مانتے ہیں، اور عینی، ابن حجر اور قسطلانی نے اس کی شروح لکھیں۔"
