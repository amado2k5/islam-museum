label: { ar: "صحيح البخاري", en: "Sahih al-Bukhari" }
summary:
  ar: "الجامع المسند الصحيح المختصر من أمور رسول الله وسننه وأيامه لمحمد بن إسماعيل البخاري (ت 256هـ): أول كتاب صُنّف في الحديث الصحيح المجرد، وأشهر كتب الحديث المرتبة على الأبواب الفقهية؛ انتقى فيه مصنفه الأحاديث من مئات الآلاف التي جمعها في أسفاره في ست عشرة سنة، وجعل تراجم أبوابه نفسها دروساً في الفقه والاستنباط، واشترط ثبوت اللقاء بين الرواة لا مجرد إمكانه خلافاً لمسلم {cite:sahih-al-bukhari p. 9}."
  en: "The Jami' al-Musnad al-Sahih of Muhammad ibn Isma'il al-Bukhari (d. 256 AH): the best-known chapter-arranged hadith collection, distilled from the hundreds of thousands of reports its author gathered on his journeys, with the chapter headings themselves taught as lessons in jurisprudence."
