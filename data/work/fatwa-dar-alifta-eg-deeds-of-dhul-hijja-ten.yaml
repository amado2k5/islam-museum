label: { ar: "الأعمال المستحبة في عشر ذي الحجة", en: "The recommended deeds of the ten days of Dhu'l-Hijja", ur: "عشرہ ذوالحجہ کے مستحب اعمال", es: "Las obras recomendadas para los diez días de Dhu'l-Hijja", fr: "Les actes recommandés pour les dix jours de Dhu al-Hijja" }
summary:
  ar: "سائل سأل عن الأعمال المستحبة في عشر ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23929)⁩ أن العشر الأول من ذي الحجة من أعظم الأيام عند الله، وأن العمل الصالح فيها أفضل من غيرها، فهي فرصة حق على باغي الخير اغتنامها، وعدّد الجواب مستحباتها من صدقة وصيام وذكر وقراءة قرآن وأضحية ونحوها."
  en: "A questioner asked about the recommended deeds of the first ten days of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23929) answered that the first ten of Dhu'l-Hijja are among the greatest days with God, and righteous work in them is better than elsewhere — an opportunity it is right for the seeker of good to seize; the answer enumerates their recommendations: charity, fasting, dhikr, Qur'an recitation, the udhiyya and more."
  ur: "ایک سائل نے ذوالحجہ کے پہلے دس دنوں کے مستحب اعمال پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23929)⁩ نے جواب دیا کہ ذوالحجہ کے پہلے دس دن اللہ کے نزدیک عظیم ترین دنوں میں ہیں اور ان میں نیک عمل دوسرے دنوں سے افضل ہے — یہ ایسا موقع ہے جسے خیر چاہنے والے کو غنیمت جاننا حق ہے؛ جواب میں ان کے مستحبات گنوائے گئے: صدقہ، روزہ، ذکر، تلاوتِ قرآن، قربانی وغیرہ۔"
  es: "Un consultante preguntó acerca de las buenas acciones recomendadas para los primeros diez días de Dhu'l-Hijja. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23929) respondió que los primeros diez días de Dhu'l-Hijja se encuentran entre los días más importantes ante Dios, y que las buenas obras realizadas en ellos son mejores que en cualquier otro lugar; una oportunidad que el buscador del bien debe aprovechar. La respuesta enumera las recomendaciones: caridad, ayuno, dhikr, recitación del Corán, la udhiyya y más."
  fr: "Un internaute a posé une question concernant les actes recommandés pour les dix premiers jours de Dhu al-Hijja. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23929) a répondu que les dix premiers jours de Dhu al-Hijja comptent parmi les plus importants auprès de Dieu et que les bonnes œuvres accomplies durant cette période sont plus méritoires qu'à tout autre moment – une occasion que tout chercheur de bien doit saisir. La réponse énumère les actes recommandés: l'aumône, le jeûne, le dhikr, la récitation du Coran, l'udhiyya et d'autres encore."
