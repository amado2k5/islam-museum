id: work/fatwa-amja-eye-discharge-wudu
class: work
kind: fatwa
label: { ar: "الغمص والوضوء", en: "Eye-matter on the face — not a barrier unless massed", ur: "آنکھ کا مادہ — وضو کی روک نہیں", es: "La materia ocular en la cara no constituye una barrera a menos que se acumule.", fr: "Matière oculaire sur le visage — pas une barrière à moins d'être massive", tr: "Daldırma ve Abdestaj", id: "Rendaman dan Ablusi" }
summary:
  ar: "سأل سائل ثلاثة أسئلة منها مس الوجه بعد الوضوء فوجد غمصًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77973 بتاريخ 25 فبراير 2009)⁩ أن جوابه يتوقف على المقصود من الغمص فإن قصد به ما يكون في العين من القذى فهذا ليس بحائل ولا يمنع وجوده صحة الوضوء أما إذا تجمع منه شيء وتكاثف بحيث يعتبر حائلًا يمنع وصول الماء فإنه تتعين إزالته على ما فصّل الجواب."
  en: "A questioner asked three questions, one of them finding eye-matter on touching his face after wudu. Dr. Salah al-Sawi (fatwa no. 77973, 25 February 2009) answered that it turns on what is meant by eye-matter: if the specks in the eye are meant, they are no barrier and their presence does not spoil the wudu; if it has massed and thickened into a barrier keeping water away, its removal is required — as the answer details."
  ur: "آنکھ کا مادہ اور وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77973، 25 فروری 2009)⁩ کے مطابق معمولی رموس روک نہیں؛ جما ہو تو ہٹانا ہوگا۔"
  es: "Un consultante formuló tres preguntas, una de ellas sobre la presencia de secreciones oculares al tocarse la cara después del wudu. El Dr. Salah al-Sawi (fatwa n.º 77973, 25 de febrero de 2009) respondió que depende de lo que se entienda por secreciones oculares: si se refiere a las motas en el ojo, no constituyen una barrera y su presencia no invalida el wudu; si se han acumulado y espesado formando una barrera que impide el paso del agua, es necesario eliminarlas, como se detalla en la respuesta."
  fr: "Un internaute a posé trois questions, dont une concernant la présence de sécrétions oculaires après les ablutions. Le Dr Salah al-Sawi (fatwa n° 77973, 25 février 2009) a répondu que cela dépend de la définition de « sécrétions oculaires »: s’il s’agit de simples particules dans l’œil, elles ne constituent pas un obstacle et leur présence n’invalide pas les ablutions; en revanche, si elles se sont accumulées et épaissies, formant une barrière empêchant l’eau de pénétrer, il est nécessaire de les retirer, comme le précise la réponse."
  tr: "Bir soru soran kişi üç soru sordu; bunlar arasında abdest sonrası yüze dokunmak da vardı ve bunun bir 'ghum' (gülümseme) olduğunu buldu. Dr. Salah Al-Sawy (25 Şubat 2009 tarihli 77973 No. Fetva) cevabının 'ghumb' (daldırma) anlamına bağlı olduğunu ve eğer tükürüğün gözünde olanı kastettiğinde bunun bir engel olmadığını ve abdestin geçerliliğini engellemediğini söyledi. Ancak, bir şey suyun suya ulaşmasını engelleyecek kadar birikip kalınlaşırsa, cevabda açıklandığı gibi kaldırılmalıdır."
  id: "Seorang penanya mengajukan tiga pertanyaan, termasuk menyentuh wajah setelah wudhu, dan ia menemukan bahwa itu adalah 'ghum' (senyuman). Dr. Salah Al-Sawy menjawab (Fatwa No. 77973 tanggal 25 Februari 2009) bahwa jawabannya bergantung pada makna 'ghumb' (celupan), dan jika ia bermaksud apa yang ada di mata air liur, itu bukan penghalang dan tidak menghalangi validitas wudhu. Namun, jika sesuatu menumpuk dan menebal hingga menjadi penghalang yang mencegah air mencapai air, maka harus dihilangkan, seperti yang dijelaskan dalam jawaban."
