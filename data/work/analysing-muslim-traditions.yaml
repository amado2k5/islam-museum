summary:
  ar: "مجموعة دراسات بالإنجليزية لهارالد موتسكي مع نيكوليت بوخوف فان دير فورت وشون أنتوني في تأريخ الأحاديث الفقهية والتفسيرية وأخبار المغازي، صدرت عن دار بريل سنة 2010 في 502 صفحة ضمن سلسلة التاريخ والحضارة الإسلامية."
  en: "English studies by Harald Motzki with Nicolet Boekhoff-van der Voort and Sean W. Anthony on dating legal, exegetical and maghazi hadith, published by Brill in 2010 (502 pages) in the Islamic History and Civilization series."
  ur: "ہیرالڈ موتسکی کے نکولیٹ بوخوف فان ڈیر فورٹ اور شان انتھونی کے ساتھ انگریزی مطالعات، جو فقہی، تفسیری اور مغازی احادیث کی تاریخ گذاری پر ہیں؛ برل سے 2010ء میں 502 صفحات میں اسلامک ہسٹری اینڈ سولائزیشن سلسلے میں شائع ہوئے۔"
  es: "Estudios ingleses de Harald Motzki con Nicolet Boekhoff-van der Voort y Sean W. Anthony sobre la datación de hadices legales, exegéticos y maghazi, publicados por Brill en 2010 (502 páginas) en la serie Historia y Civilización Islámica."
  fr: "Études anglaises de Harald Motzki avec Nicolet Boekhoff-van der Voort et Sean W. Anthony sur la datation des hadiths juridiques, exégétiques et maghazi, publiées par Brill en 2010 (502 pages) dans la série Histoire et civilisation islamiques."
  tr: "Harald Motsky'nin Nicolette Bokhov van der Voort ve Sean Anthony ile birlikte İngilizce olarak incelendiği, fihil ve tefsirsel hadislerin tarihi ile Maghazi raporları üzerine çalışmalardan oluşan bir derleme, Brill tarafından 2010 yılında İslam Tarihi ve Medeniyeti serisinin bir parçası olarak 502 sayfa halinde yayımlanmıştır."
  id: "Kumpulan studi dalam bahasa Inggris oleh Harald Motsky bersama Nicolette Bokhov van der Voort dan Sean Anthony tentang sejarah hadits dan eksegetis serta laporan Maghazi, diterbitkan oleh Brill pada tahun 2010 dalam 502 halaman sebagai bagian dari seri Sejarah dan Peradaban Islam."
