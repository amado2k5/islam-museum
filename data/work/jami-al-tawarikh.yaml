summary:
  ar: "جامع التواريخ كتاب تاريخي فارسي ضخم ألّفه الوزير الطبيب رشيد الدين فضل الله الهمذاني في عهد الإلخانيين، وهو بحسب دائرة المعارف الإسلامية أهم مصدر تاريخي منفرد للإمبراطورية المغولية كلها لا لدولة الإلخانيين وحدها. كلّفه به غازان خان، وطُلب إلى المؤلف في عهد أولجايتو أن يوسعه إلى تاريخ الشعوب جميعاً التي اتصل بها المغول، فعدّه بويل أول مؤرخ عالمي. وتنبّه الموسوعة على أن مؤلفه موظف فارسي له منظوره، فهو ليس محايداً {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
  en: "Jami al-Tawarikh is a large Persian-language history by the physician-vizier Rashid al-Din Fadl Allah of Hamadan, written under the Ilkhans. The Encyclopaedia of Islam calls it the most important single historical source for the Mongol Empire as a whole, not only for the Ilkhans' realm. Ghazan Khan commissioned it, and under Oljeytu the author was asked to widen it into a history of all the peoples the Mongols had met, which led J. A. Boyle to call him the first world-historian. The article warns that its author wrote as a Persian official with a point of view, so the work is not impartial {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
  ur: "جامع التواریخ فارسی زبان کی ایک ضخیم تاریخ ہے جو طبیب و وزیر رشید الدین فضل اللہ ہمدانی نے ایل خانی دور میں لکھی۔ دائرۃ المعارف الاسلامیہ کے مطابق یہ پوری منگول سلطنت کے لیے، صرف ایل خانوں کی سلطنت کے لیے نہیں، سب سے اہم واحد تاریخی ماخذ ہے۔ غازان خان نے اسے لکھوایا، اور اولجایتو کے عہد میں مصنف سے کہا گیا کہ اسے ان تمام اقوام کی تاریخ تک پھیلا دے جن سے منگولوں کا واسطہ پڑا، اسی لیے بوائل نے انہیں پہلا عالمی مؤرخ کہا۔ مضمون خبردار کرتا ہے کہ مصنف ایک ایرانی اہلکار کے نقطۂ نظر سے لکھ رہا تھا، اس لیے کتاب غیر جانبدار نہیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
  es: "Jami al-Tawarikh es una extensa historia en persa escrita por el médico y visir Rashid al-Din Fadl Allah de Hamadán, durante el reinado de los Ilkhanes. La Enciclopedia del Islam la considera la fuente histórica más importante para el Imperio mongol en su conjunto, no solo para el reino de los Ilkhanes. Ghazan Khan la encargó, y bajo el mandato de Oljeytu se le pidió al autor que la ampliara para incluir la historia de todos los pueblos con los que los mongoles se habían encontrado, lo que llevó a J.A. Boyle a denominarlo el primer historiador universal. El artículo advierte que su autor escribió como funcionario persa con una perspectiva particular, por lo que la obra no es imparcial {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
  fr: "Le Jami al-Tawarikh est une vaste histoire en langue persane, écrite par le médecin-vizir Rashid al-Din Fadl Allah de Hamadan, sous le règne des Ilkhanides. L'Encyclopédie de l'Islam la considère comme la source historique la plus importante pour l'ensemble de l'Empire mongol, et non seulement pour le domaine ilkhanide. Commandée par Ghazan Khan, elle fut étendue, sous Oljeytu, à l'auteur afin d'y inclure l'histoire de tous les peuples rencontrés par les Mongols, ce qui amena J.A. Boyle à le qualifier de premier historien mondial. L'article souligne toutefois que l'auteur, en tant que fonctionnaire persan, adopte un point de vue particulier, ce qui nuit à l'impartialité de l'ouvrage (voir: Encyclopédie de l'Islam, vol. 8, p. 483)."
  tr: "Cami'l-Tawarikh, İlhanlık döneminde vezir ve hekim Raşiddin Fadlallah el-Hamadhani tarafından yazılmış geniş bir tarihi Fars kitabıdır. İslam Ansiklopedisi'ne göre, sadece İlhanlık devleti için değil, tüm Moğol İmparatorluğu için en önemli tek tarihsel kaynaktır. Gazan Han bu kitabı sipariş etmiş ve Oljeitu döneminde Moğollarla bağlantılı tüm halkların tarihine genişletmesini istemiştir; bu nedenle Boyle onu ilk dünya tarihçisi olarak kabul etmiştir. Ansiklopedi, yazarının tarafsız olmadığı için kendi bakış açısına sahip bir Pers yetkili olduğunu belirtir {cite:encyclopaedia-of-Islam-2 cilt 8, s. 483}."
  id: "Jami' al-Tawarikh adalah buku sejarah Persia yang luas yang ditulis oleh wazir dan dokter Rashid al-Din Fadlallah al-Hamadhani pada era Ilkhanate. Menurut Ensiklopedia Islam, ini adalah sumber sejarah tunggal terpenting untuk seluruh Kekaisaran Mongol, bukan hanya negara Ilkhanate. Ghazan Khan memesan buku ini dan meminta penulis selama masa pemerintahan Oljeitu untuk memperluasnya ke sejarah semua bangsa yang terkait dengan Mongol, sehingga Boyle menganggapnya sebagai sejarawan dunia pertama. Ensiklopedia mencatat bahwa penulisnya adalah pejabat Persia dengan perspektifnya sendiri, karena ia tidak netral {cite:encyclopaedia-of-Islam-2 vol. 8, hlm. 483}."
