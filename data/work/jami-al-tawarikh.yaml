summary:
  ar: "جامع التواريخ كتاب تاريخي فارسي ضخم ألّفه الوزير الطبيب رشيد الدين فضل الله الهمذاني في عهد الإلخانيين، وهو بحسب دائرة المعارف الإسلامية أهم مصدر تاريخي منفرد للإمبراطورية المغولية كلها لا لدولة الإلخانيين وحدها. كلّفه به غازان خان، وطُلب إلى المؤلف في عهد أولجايتو أن يوسعه إلى تاريخ الشعوب جميعاً التي اتصل بها المغول، فعدّه بويل أول مؤرخ عالمي. وتنبّه الموسوعة على أن مؤلفه موظف فارسي له منظوره، فهو ليس محايداً {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
  en: "Jami al-Tawarikh is a large Persian-language history by the physician-vizier Rashid al-Din Fadl Allah of Hamadan, written under the Ilkhans. The Encyclopaedia of Islam calls it the most important single historical source for the Mongol Empire as a whole, not only for the Ilkhans' realm. Ghazan Khan commissioned it, and under Oljeytu the author was asked to widen it into a history of all the peoples the Mongols had met, which led J. A. Boyle to call him the first world-historian. The article warns that its author wrote as a Persian official with a point of view, so the work is not impartial {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
  ur: "جامع التواریخ فارسی زبان کی ایک ضخیم تاریخ ہے جو طبیب و وزیر رشید الدین فضل اللہ ہمدانی نے ایل خانی دور میں لکھی۔ دائرۃ المعارف الاسلامیہ کے مطابق یہ پوری منگول سلطنت کے لیے، صرف ایل خانوں کی سلطنت کے لیے نہیں، سب سے اہم واحد تاریخی ماخذ ہے۔ غازان خان نے اسے لکھوایا، اور اولجایتو کے عہد میں مصنف سے کہا گیا کہ اسے ان تمام اقوام کی تاریخ تک پھیلا دے جن سے منگولوں کا واسطہ پڑا، اسی لیے بوائل نے انہیں پہلا عالمی مؤرخ کہا۔ مضمون خبردار کرتا ہے کہ مصنف ایک ایرانی اہلکار کے نقطۂ نظر سے لکھ رہا تھا، اس لیے کتاب غیر جانبدار نہیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 483}."
