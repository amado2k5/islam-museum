label:
  ar: "فتح القدير الجامع بين فني الرواية والدراية من علم التفسير"
  en: "Fath al-Qadir (al-Shawkani's commentary on the Qur'an)"
  ur: "فتح القدیر (شوکانی کی تفسیر)"
summary:
  ar: "تفسير كامل للقرآن لمحمد بن علي الشوكاني (ت 1250هـ)، قصد فيه الجمع بين طريقة أهل الرواية الذين اقتصروا على المأثور وطريقة أهل الدراية الذين اعتمدوا على اللغة والعلوم الآلية، مع الترجيح بين الأقوال وبيان المعنى العربي والإعرابي والبياني؛ واستمد كثيرًا من آثاره من «الدر المنثور» للسيوطي. وأصله المخطوط بعنوان «مطلع البدرين ومجمع البحرين»."
  en: "A complete commentary on the Qur'an by Muhammad ibn Ali al-Shawkani (d. 1250 AH), designed to unite the method of the transmitters, who confined themselves to reports, with that of the reasoners, who relied on the Arabic language and the instrumental sciences, while weighing conflicting interpretations and explaining the lexical, grammatical and rhetorical meaning; many of its reports are drawn from al-Suyuti's al-Durr al-Manthur. Its manuscript original is titled Matla' al-Badrayn wa-Majma' al-Bahrayn."
  ur: "محمد بن علی شوکانی (م 1250ھ) کی قرآن کی مکمل تفسیر، جس میں انہوں نے اہلِ روایت — جو ماثور پر اکتفا کرتے تھے — اور اہلِ درایت — جو لغت اور آلی علوم پر اعتماد کرتے تھے — کے طریقوں کو جمع کرنے کا ارادہ کیا، اقوال میں ترجیح دی اور لغوی، اعرابی اور بیانی معنی واضح کیا؛ اس کی بہت سی روایات سیوطی کی «الدر المنثور» سے ماخوذ ہیں۔ اس کا مخطوطہ اصل «مطلع البدرین و مجمع البحرین» کے عنوان سے ہے۔"
