label:
  ar: "فتح القدير الجامع بين فني الرواية والدراية من علم التفسير"
  en: "Fath al-Qadir (al-Shawkani's commentary on the Qur'an)"
  ur: "فتح القدیر ⁦(شوکانی کی تفسیر)⁩"
  es: "Fath al-Qadir (el comentario de al-Shawkani sobre el Corán)"
  fr: "Fath al-Qadir (commentaire d'al-Shawkani sur le Coran)"
  tr: "Güçlülerin Fethetilmesi Tefsir Bilimi Bilgisi ile Anlatım Sanatını Birleştirir"
  id: "Penaklukan Yang Kuat Menggabungkan Seni Narasi dan Pengetahuan Ilmu Tafsir"
summary:
  ar: "تفسير كامل للقرآن لمحمد بن علي الشوكاني ⁦(ت 1250هـ)⁩، قصد فيه الجمع بين طريقة أهل الرواية الذين اقتصروا على المأثور وطريقة أهل الدراية الذين اعتمدوا على اللغة والعلوم الآلية، مع الترجيح بين الأقوال وبيان المعنى العربي والإعرابي والبياني؛ واستمد كثيرًا من آثاره من «الدر المنثور» للسيوطي. وأصله المخطوط بعنوان «مطلع البدرين ومجمع البحرين»."
  en: "A complete commentary on the Qur'an by Muhammad ibn Ali al-Shawkani (d. 1250 AH), designed to unite the method of the transmitters, who confined themselves to reports, with that of the reasoners, who relied on the Arabic language and the instrumental sciences, while weighing conflicting interpretations and explaining the lexical, grammatical and rhetorical meaning; many of its reports are drawn from al-Suyuti's al-Durr al-Manthur. Its manuscript original is titled Matla' al-Badrayn wa-Majma' al-Bahrayn."
  ur: "محمد بن علی شوکانی ⁦(م 1250ھ)⁩ کی قرآن کی مکمل تفسیر، جس میں انہوں نے اہلِ روایت — جو ماثور پر اکتفا کرتے تھے — اور اہلِ درایت — جو لغت اور آلی علوم پر اعتماد کرتے تھے — کے طریقوں کو جمع کرنے کا ارادہ کیا، اقوال میں ترجیح دی اور لغوی، اعرابی اور بیانی معنی واضح کیا؛ اس کی بہت سی روایات سیوطی کی «الدر المنثور» سے ماخوذ ہیں۔ اس کا مخطوطہ اصل «مطلع البدرین و مجمع البحرین» کے عنوان سے ہے۔"
  es: "Comentario completo del Corán de Muhammad ibn Ali al-Shawkani (fallecido en 1250 AH), concebido para combinar el método de los transmisores, que se limitaban a los relatos, con el de los razonadores, que se basaban en la lengua árabe y las ciencias instrumentales, sopesando las interpretaciones contradictorias y explicando el significado léxico, gramatical y retórico. Muchos de sus relatos provienen de al-Durr al-Manthur de al-Suyuti. Su manuscrito original se titula Matla' al-Badrayn wa-Majma' al-Bahrayn."
  fr: "Ce commentaire complet du Coran, attribué à Muhammad ibn Ali al-Shawkani (mort en 1250 AH), vise à concilier la méthode des transmetteurs, qui se limitaient aux hadiths, avec celle des exégètes, qui s'appuyaient sur la langue arabe et les sciences instrumentales, tout en examinant les interprétations divergentes et en expliquant le sens lexical, grammatical et rhétorique. Nombre de ses hadiths sont tirés de l'ouvrage d'al-Suyuti, al-Durr al-Manthur. Son manuscrit original est intitulé Matla' al-Badrayn wa-Majma' al-Bahrayn."
  tr: "Muhammed bin Ali el-Şevkani'nin (ö. 1250 Hicri Yıl) Kur'an'ın tam bir yorumu; burada rivayetçilerin sadece aktarılan raporlarla sınırlı kalan yöntemini, dil ve enstrüman bilimlerine dayanan bilginlerin yöntemini birleştirmeye çalıştı; Arapça, dilbilgisi ve retorik anlamları ise ifadeleri ve açıklamaları tercih ederken; eserlerinin büyük bir kısmını El-Suyuti'nin \"El-Dürr el-Manthur\"undan almıştır. Orijinal el yazması \"Matla' al-Badrain wa Majma' al-Bahreyn\" başlığını taşır."
  id: "Interpretasi lengkap Al-Qur'an oleh Muhammad ibn Ali al-Shawkani (wafat 1250 H), di mana ia berusaha menggabungkan metode para narator, yang membatasi diri pada laporan yang disampaikan, dan metode para ilmuwan yang mengandalkan bahasa dan ilmu instrumen, sambil lebih memilih pernyataan dan memperjelas makna Arab, tata bahasa, dan retorika; ia mengambil banyak karyanya dari \"Al-Durr al-Manthur\" karya Al-Suyuti. Naskah aslinya berjudul \"Matla' al-Badrain wa Majma' al-Bahrain.\""
