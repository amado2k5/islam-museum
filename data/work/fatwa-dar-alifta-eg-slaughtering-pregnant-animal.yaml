id: work/fatwa-dar-alifta-eg-slaughtering-pregnant-animal
class: work
kind: fatwa
label: { ar: "حكم ذبح الأضحية الحامل", en: "Slaughtering a pregnant animal as udhiyya", ur: "حامل جانور کی قربانی ذبح کا حکم" }
summary:
  ar: "سائل سأل عن ذبح الأضحية الحامل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23959)⁩ أنه لا يجوز شرعًا الإقدام على ذبح البهائم إذا علم أنها حوامل سواء في الأضحية أو غيرها؛ لأن الحمل ينقص لحمها ويتسبب في هزالها وضعفها، فيقع إتلاف على ما فصّل الجواب."
  en: "A questioner asked about slaughtering a pregnant animal as udhiyya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23959) answered that it is not lawful to proceed to slaughter animals known to be pregnant, whether for udhiyya or otherwise, because pregnancy diminishes the flesh and brings on weakness and emaciation, so slaughter works destruction — as the answer details."
  ur: "ایک سائل نے قربانی کے لیے حامل جانور ذبح کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23959)⁩ نے جواب دیا کہ حامل جانوروں کو ذبح کرنے پر شرعاً اقدام جائز نہیں، خواہ قربانی کے لیے ہو یا غیر کے لیے، کیونکہ حمل گوشت کم اور جانور کو کمزور و لاغر کر دیتا ہے، اس لیے ذبح تلف ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
