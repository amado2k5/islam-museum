id: work/fatwa-dar-alifta-eg-slaughtering-pregnant-animal
class: work
kind: fatwa
label: { ar: "حكم ذبح الأضحية الحامل", en: "Slaughtering a pregnant animal as udhiyya", ur: "حامل جانور کی قربانی ذبح کا حکم", es: "Sacrificar un animal preñado como udhiyya", fr: "Abattage d'un animal enceinte (udhiyya)", tr: "Hamile bir kurbanın katliamına ilişkin karar", id: "Putusan tentang penyembelihan korban yang sedang hamil" }
summary:
  ar: "سائل سأل عن ذبح الأضحية الحامل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23959)⁩ أنه لا يجوز شرعًا الإقدام على ذبح البهائم إذا علم أنها حوامل سواء في الأضحية أو غيرها؛ لأن الحمل ينقص لحمها ويتسبب في هزالها وضعفها، فيقع إتلاف على ما فصّل الجواب."
  en: "A questioner asked about slaughtering a pregnant animal as udhiyya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23959) answered that it is not lawful to proceed to slaughter animals known to be pregnant, whether for udhiyya or otherwise, because pregnancy diminishes the flesh and brings on weakness and emaciation, so slaughter works destruction — as the answer details."
  ur: "ایک سائل نے قربانی کے لیے حامل جانور ذبح کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23959)⁩ نے جواب دیا کہ حامل جانوروں کو ذبح کرنے پر شرعاً اقدام جائز نہیں، خواہ قربانی کے لیے ہو یا غیر کے لیے، کیونکہ حمل گوشت کم اور جانور کو کمزور و لاغر کر دیتا ہے، اس لیے ذبح تلف ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el sacrificio de un animal preñado como parte del ritual udhiyya. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23959) respondió que no es lícito sacrificar animales preñados, ya sea para udhiyya o por cualquier otro motivo, porque el embarazo disminuye la carne y provoca debilidad y emaciación, por lo que el sacrificio constituye una destrucción, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'abattage rituel (udhiyya) d'une femelle gestante. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23959) a répondu qu'il n'est pas licite d'abattre une femelle gestante, que ce soit pour l'udhiyya ou pour toute autre raison, car la gestation diminue la masse corporelle et entraîne faiblesse et amaigrissement; l'abattage est donc destructeur, comme le précise la réponse."
  tr: "Bir soru soran hamile bir kurbanın kesilmesi hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 23959), hamile oldukları biliniyorsa, ister kurban için ister başka bir şekilde, hayvanların kesiminin dini olarak kabul edilmediğini; çünkü hamileliğin etlerini azaltır, zayıflamasına ve zayıflamasına neden olur, böylece yıkıma yol açar, bu da cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya bertanya tentang penyembelihan korban yang sedang hamil. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 23959) menjawab bahwa secara agama tidak diperbolehkan menyembelih hewan jika diketahui mereka hamil, baik untuk pengorbanan maupun lainnya; karena kehamilan mengurangi daging mereka dan menyebabkan kelemahan dan kelemahan mereka, sehingga menyebabkan kehancuran, seperti yang dijelaskan dalam jawaban."
