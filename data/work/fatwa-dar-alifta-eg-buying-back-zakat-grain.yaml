id: work/fatwa-dar-alifta-eg-buying-back-zakat-grain
class: work
kind: fatwa
label: { ar: "حكم شراء الزكاة بعد تسليمها للفقير", en: "Buying back zakat after delivering it to the poor", ur: "فقیر کو زکات دینے کے بعد اسے واپس خریدنا", es: "Recomprar el zakat después de entregarlo a los pobres.", fr: "Racheter la zakat après l'avoir distribuée aux pauvres", tr: "Yoksullara teslim edildikten sonra zekat satın alınmasına ilişkin karar", id: "Aturan pembelian zakat setelah menyerahkannya kepada orang miskin" }
summary:
  ar: "سائل أعطى الزكاة حبوبًا لفقير فسأل عن شرائها منه بعد التسليم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21830)⁩ أنه يجوز لمن أعطيت له الزكاة حبوبًا أن يبيعها لمن أعطاها إذا كان البيع بثمن المثل أو أعلى على ما فصّل الجواب."
  en: "A man gave grain as zakat to a poor man and asked about buying it back from him after delivery. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21830) answered that the recipient may sell the zakat grain back to the giver if the sale is at the market price or above — as the answer details."
  ur: "ایک شخص نے فقیر کو زکات کے طور پر اناج دیا اور پوچھا کہ دینے کے بعد اسے واپس خرید سکتا ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21830)⁩ نے جواب دیا کہ مستحق اناج کو دینے والے کو بیچ سکتا ہے بشرطیکہ فروخت مساوی قیمت یا اس سے زیادہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre entregó grano como zakat a un hombre pobre y le preguntó si podía recomprárselo después de la entrega. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21830) respondió que el receptor puede vender el grano del zakat al donante si la venta se realiza al precio de mercado o superior, como se detalla en la respuesta."
  fr: "Un homme a donné du grain en guise de zakat à un pauvre et s'est renseigné sur la possibilité de le lui racheter après la livraison. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21830) a répondu que le bénéficiaire pouvait revendre le grain donné en guise de zakat si le prix de vente était égal ou supérieur au prix du marché, comme le précise la réponse."
  tr: "Bir soru soran kişi, fakir bir kişiye zekat tahılları verdi ve teslimattan sonra ondan satın alıp almadığını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21830), cevabda açıklandığı gibi, zekat verilen kişinin taneleri veren kişiye satmasının uygun olduğunu yanıtladı."
  id: "Seorang penanya memberikan biji-bijian zakat kepada orang miskin dan menanyakan tentang pembeliannya setelah dikirimkan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21830) menjawab bahwa diperbolehkan bagi seseorang yang menerima zakat untuk menjualnya kepada pemberinya jika harga penjualan setara atau lebih tinggi, seperti yang dijelaskan dalam jawaban."
