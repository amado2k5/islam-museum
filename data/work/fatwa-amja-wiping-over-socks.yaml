id: work/fatwa-amja-wiping-over-socks
class: work
kind: fatwa
label: { ar: "المسح على الجوربين", en: "Wiping over socks — conditions and the report of al-Mughira", ur: "جرابوں پر مسح — شرائط", es: "Limpieza sobre calcetines: condiciones y el informe de al-Mughira" }
summary:
  ar: "سأل سائل عن شروط المسح على الجوربين وصفة الجورب الذي يصح المسح عليه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79887 بتاريخ 6 سبتمبر 2009)⁩ أن المسح على الجوربين مشروع ومن أدلته حديث المغيرة بن شعبة أن رسول الله توضأ ومسح على الجوربين والنعلين رواه أحمد وأهل السنن، ويشترط لبسهما على طهارة وأن يستوعبا محل الفرض من القدمين على ما فصّل الجواب من الشروط والمدة."
  en: "A questioner asked the conditions for wiping over socks and what sort of sock serves. Dr. Salah al-Sawi (fatwa no. 79887, 6 September 2009) answered that wiping over socks is legislated — among its proofs al-Mughira ibn Shu'ba's report that the Messenger of God did wudu and wiped over socks and sandals, narrated by Ahmad and the Sunan-men; conditions include putting them on in purity and their covering the obligatory place of the feet — the answer detailing the conditions and term."
  ur: "جرابوں پر مسح کی شرائط؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79887، 6 ستمبر 2009)⁩ کے مطابق مشروع ہے — طہارت پر پہننا اور قدم کا محل ڈھانپنا شرط ہے۔"
  es: "Un consultante preguntó sobre las condiciones para limpiarse los calcetines y qué tipo de calcetín sirve. El Dr. Salah al-Sawi (fatwa n.° 79887, 6 de septiembre de 2009) respondió que limpiarse los calcetines está prescrito; entre sus pruebas se encuentra el relato de al-Mughira ibn Shu'ba de que el Mensajero de Dios hizo la ablución y se limpió los calcetines y las sandalias, narrado por Ahmad y los sunaníes; las condiciones incluyen ponérselos en estado de pureza y que cubran la parte obligatoria de los pies; la respuesta detalla las condiciones y el plazo."
