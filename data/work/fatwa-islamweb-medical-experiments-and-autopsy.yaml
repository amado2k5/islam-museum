id: work/fatwa-islamweb-medical-experiments-and-autopsy
class: work
kind: fatwa
label: { ar: "حكم إجراء التجارب الطبية على الإنسان", en: "Medical experiments on human beings", ur: "انسانوں پر طبی تجربات کا حکم" }
summary:
  ar: "سؤال عن جواز التجارب الطبية على الإنسان وحدودها. تناول جواب مركز الفتوى في إسلام ويب تشريح جثة الميت، فقرر أن حرمة المسلم باقية بعد موته وأن الواجب تكريمه بالغسل والتكفين والصلاة والدفن، وأن التشريح لا يجوز إلا لمصلحة معتبرة أو ضرورة وبقدرها دون توسع، وذكر نظائر من كلام الفقهاء الأقدمين، منها قول الحنفية والشافعية ومن وافقهم بجواز شق بطن الميتة لإخراج جنين تُرجى حياته."
  en: "A question on whether medical experiments on human beings are permitted and what their limits are. The IslamWeb fatwa centre's answer addressed the dissection of the dead: the sanctity of a Muslim remains after death, and he is owed washing, shrouding, the funeral prayer and burial; dissection is permitted only for a recognised benefit or a necessity, and only to that extent; it cited parallels from the early jurists, among them the Hanafi and Shafi'i view, with others, that a dead woman's abdomen may be opened to deliver a foetus whose life is hoped for."
  ur: "یہ سوال کہ کیا انسانوں پر طبی تجربات جائز ہیں اور ان کی حدود کیا ہیں۔ اسلام ویب کے مرکزِ فتویٰ کے جواب میں میت کی چیر پھاڑ (پوسٹ مارٹم) پر بات کی گئی: مسلمان کی حرمت موت کے بعد بھی باقی رہتی ہے اور اس کا حق غسل، کفن، نمازِ جنازہ اور تدفین ہے؛ چیر پھاڑ صرف معتبر مصلحت یا ضرورت کے لیے اور اسی کے بقدر جائز ہے؛ اور قدیم فقہاء سے نظائر ذکر کیے، جن میں حنفیہ، شافعیہ اور ان کے موافقین کا یہ قول ہے کہ مردہ عورت کا پیٹ چاک کر کے ایسا بچہ نکالا جا سکتا ہے جس کے زندہ ہونے کی امید ہو۔"
