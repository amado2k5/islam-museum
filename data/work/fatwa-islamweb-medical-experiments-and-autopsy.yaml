id: work/fatwa-islamweb-medical-experiments-and-autopsy
class: work
kind: fatwa
label: { ar: "حكم إجراء التجارب الطبية على الإنسان", en: "Medical experiments on human beings", ur: "انسانوں پر طبی تجربات کا حکم", es: "Experimentos médicos en seres humanos", fr: "expériences médicales sur des êtres humains", tr: "İnsanlar Üzerinde Tıbbi Deneyler Yapma Kararı", id: "Putusan tentang Melakukan Eksperimen Medis pada Manusia" }
summary:
  ar: "سؤال عن جواز التجارب الطبية على الإنسان وحدودها. تناول جواب مركز الفتوى في إسلام ويب تشريح جثة الميت، فقرر أن حرمة المسلم باقية بعد موته وأن الواجب تكريمه بالغسل والتكفين والصلاة والدفن، وأن التشريح لا يجوز إلا لمصلحة معتبرة أو ضرورة وبقدرها دون توسع، وذكر نظائر من كلام الفقهاء الأقدمين، منها قول الحنفية والشافعية ومن وافقهم بجواز شق بطن الميتة لإخراج جنين تُرجى حياته."
  en: "A question on whether medical experiments on human beings are permitted and what their limits are. The IslamWeb fatwa centre's answer addressed the dissection of the dead: the sanctity of a Muslim remains after death, and he is owed washing, shrouding, the funeral prayer and burial; dissection is permitted only for a recognised benefit or a necessity, and only to that extent; it cited parallels from the early jurists, among them the Hanafi and Shafi'i view, with others, that a dead woman's abdomen may be opened to deliver a foetus whose life is hoped for."
  ur: "یہ سوال کہ کیا انسانوں پر طبی تجربات جائز ہیں اور ان کی حدود کیا ہیں۔ اسلام ویب کے مرکزِ فتویٰ کے جواب میں میت کی چیر پھاڑ ⁦(پوسٹ مارٹم)⁩ پر بات کی گئی: مسلمان کی حرمت موت کے بعد بھی باقی رہتی ہے اور اس کا حق غسل، کفن، نمازِ جنازہ اور تدفین ہے؛ چیر پھاڑ صرف معتبر مصلحت یا ضرورت کے لیے اور اسی کے بقدر جائز ہے؛ اور قدیم فقہاء سے نظائر ذکر کیے، جن میں حنفیہ، شافعیہ اور ان کے موافقین کا یہ قول ہے کہ مردہ عورت کا پیٹ چاک کر کے ایسا بچہ نکالا جا سکتا ہے جس کے زندہ ہونے کی امید ہو۔"
  es: "Una pregunta sobre si los experimentos médicos en seres humanos están permitidos y cuáles son sus límites. La respuesta del centro de fatuas de IslamWeb abordó la disección de los muertos: la santidad de un musulmán permanece después de la muerte, y se le debe lavar, amortajar, realizar la oración fúnebre y entierro; la disección está permitida solo para un beneficio reconocido o una necesidad, y solo en esa medida; citó paralelismos de los primeros juristas, entre ellos la visión Hanafi y Shafi'i, junto con otros, que sostienen que se puede abrir el abdomen de una mujer muerta para extraer un feto cuya vida se espera."
  fr: "Une question portait sur la permission et les limites des expérimentations médicales sur l'être humain. La réponse du centre de fatwas IslamWeb abordait la dissection des défunts: le caractère sacré du musulman demeure après sa mort, et il a droit aux ablutions, à l'enveloppement dans un linceul, à la prière funéraire et à l'inhumation; la dissection n'est permise que pour un bénéfice reconnu ou en cas de nécessité, et dans la seule mesure où elle l'est; le centre citait des parallèles avec les avis des premiers juristes, notamment les écoles hanafite et chaféite, parmi d'autres, selon lesquels l'abdomen d'une femme décédée peut être ouvert pour extraire un fœtus dont on espère la survie."
  tr: "İnsanlar üzerinde tıbbi deneylerin izinliliği ve sınırları hakkında bir soru. Islamweb'deki Fetva Merkezi'nin cevabı, ölen kişinin bedeninin otopsisine değindi; bir Müslümanın kutsallığının ölümünden sonra da kaldığını, yıkanma, kefenleme, namaz ve gömülme ile onurlandırılmasının zorunlu olduğunu, otopsinin ise yalnızca geçerli bir fayda veya zorunluluk için ve bu kapsamda ayrıntı verilmeden yapılabileceğini belirtti. Benzer ifadelerden, Hanefiler, Şafiiler ve bunlara katılanların da dahil olmak üzere önceki hukukçulardan, cesedin karnının bölünerek yaşam boyu umut edilen fetüsü çıkarmasına izin veren ifadelerinden bahsetti."
  id: "Sebuah pertanyaan tentang diperbolehkannya eksperimen medis pada manusia dan batasannya. Jawaban dari Fatwa Center di Islamweb membahas autopsi jenazah almarhum, menyatakan bahwa kesucian seorang Muslim tetap ada setelah kematiannya dan bahwa wajib menghormatinya dengan cara mencuci, menutupi, berdoa, dan mengubur, dan bahwa autopsi hanya diperbolehkan untuk manfaat atau kebutuhan yang sah dan sejauh itu tanpa penjelasan lebih lanjut. Ia menyebutkan pernyataan serupa dari para ahli hukum sebelumnya, termasuk Hanafi, Syha'i, dan mereka yang setuju dengan pernyataan tersebut yang mengizinkan pembelahan perut mayat untuk mengangkat janin yang diharapkan seumur hidup."
