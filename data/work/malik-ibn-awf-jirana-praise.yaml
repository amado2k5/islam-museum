class: work
kind: poem
label: { ar: "قصيدة مالك بن عوف في مدح النبي بالجعرانة", en: "Malik ibn Awf's eulogy of the Prophet at al-Ji'rana", es: "Elogio del Profeta por Malik ibn Awf en al-Ji'rana", fr: "Éloge du Prophète par Malik ibn Awf à al-Ji'rana", ur: "مالک بن عوف کا الجیرانہ میں نبی کی تعظیم", tr: "Malik ibn Auf'un Peygamber'i öven şiiri ve Ja'rana", id: "Puisi Malik ibn Auf dalam pujian kepada Nabi dengan Ja'rana" }
summary:
  ar: "الأبيات التي قالها مالك بن عوف النصري حين جاء النبي مسلماً بالجعرانة فرد عليه أهله وماله وأعطاه مئة من الإبل؛ مطلعها: «ما إن رأيتُ ولا سمعتُ بمثله / في الناسِ كلِّهمُ بمثلِ محمدِ»."
  en: "The verses recited by Malik ibn Awf al-Nasri upon coming to the Prophet in submission at al-Ji'rana, after having his family and wealth restored and receiving one hundred camels."
  es: "Los versículos recitados por Malik ibn Awf al-Nasri al presentarse ante el Profeta en señal de sumisión en al-Ji'rana, después de que su familia y sus bienes fueran restaurados y de recibir cien camellos."
  fr: "Les versets récités par Malik ibn Awf al-Nasri lorsqu'il se présenta au Prophète en signe de soumission à al-Ji'rana, après avoir retrouvé sa famille et ses biens et reçu cent chameaux."
  ur: "وہ آیات جو مالک بن عوف الناصری نے اپنے اہل و عیال اور مال کو بحال کرنے اور سو اونٹ حاصل کرنے کے بعد رسول اللہ کے پاس الجیرانہ میں حاضر ہونے پر پڑھی تھیں۔"
  tr: "Peygamber Müslüman olarak Ca'ranah'a geldiğinde Malik bin Awf al-Nasri tarafından okunan ayetler, ailesi ve serveti ona geri döndü ve ona yüz deve verdi; başlangıcı şöyledir: \"Böyle bir şey gördüğün ya da duyduğun anda / tüm insanlar arasında, Muhammed'in sureti ortaya çıkar.\""
  id: "Ayat-ayat yang dibacakan oleh Malik ibn Awf al-Nasri ketika Nabi datang sebagai Muslim di Al-Ja'ranah, keluarganya dan kekayaannya kembali kepadanya dan memberinya seratus unta; permulaannya adalah: \"Begitu kamu melihat atau mendengar sesuatu yang serupa / di antara semua orang, rupa Muhammad hadir.\""
