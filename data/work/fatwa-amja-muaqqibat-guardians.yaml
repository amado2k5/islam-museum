id: work/fatwa-amja-muaqqibat-guardians
class: work
kind: fatwa
label: { ar: "المعقبات من بين يديه ومن خلفه", en: "The successive guardians before and behind", ur: "آگے پیچھے سے نگرانی کرنے والے فرشتے", es: "Los sucesivos guardianes, antes y después" }
summary:
  ar: "سأل سائل عن قول ابن عباس في المعقبات التي يحفظون بها العبد من أمر الله وعن سبيل الحفظ مع كون الأمر قد كتب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86511 بتاريخ 2 مارس 2012)⁩ أن المعنى بسلاسة أن الله قدّر في الكون أسبابًا وجعل لكل شيء سببًا، فجعل من أسباب الحفظ المعقبات كما جعل من أسباب النصر يوم بدر الملائكة ولو شاء لنصرهم بنفسه بلا أسباب، وكما أمر مريم أن تهز بجذع النخلة وقد كان قادرًا على إيصال رزقه إليها بلا أسباب."
  en: "A questioner asked about Ibn Abbas's reading of the 'successive guardians' who keep a servant by God's command, and how guarding works when the matter is already written. Dr. Salah al-Sawi (fatwa no. 86511, 2 March 2012) answered that the meaning, plainly, is that God decreed causes in the universe and made a cause for everything: He made the guardians a cause of preservation, as He made the angels a cause of victory at Badr though He could have granted victory Himself without causes — and as He told Maryam to shake the palm trunk though He could have sent His provision without any cause."
  ur: "ایک سائل نے ابن عباس کی اس روایت پوچھی کہ آگے پیچھے سے فرشتے بندے کی حفاظت کرتے ہیں جب کہ تقدیر لکھی جا چکی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86511، 2 مارچ 2012)⁩ کے مطابق اللہ نے ہر شے کا سبب بنایا — حفاظت کے اسباب میں فرشتے ہیں جیسے بدر میں فتح کا سبب فرشتے تھے۔"
  es: "Un interlocutor preguntó acerca de la interpretación de Ibn Abbas sobre los \"guardianes sucesivos\" que custodian a un siervo por mandato divino, y cómo funciona la custodia cuando el asunto ya está escrito. El Dr. Salah al-Sawi (fatwa n.° 86511, 2 de marzo de 2012) respondió que el significado, claramente, es que Dios decretó causas en el universo y creó una causa para todo: hizo de los guardianes una causa de preservación, así como hizo de los ángeles una causa de victoria en Badr, aunque podría haber concedido la victoria Él mismo sin causas, y como le dijo a María que sacudiera el tronco de la palma, aunque podría haber enviado su provisión sin ninguna causa."
