id: work/fatwa-amja-homosexuality-ruling
class: work
kind: fatwa
label: { ar: "حكم الشذوذ الجنسي", en: "The ruling on homosexuality", ur: "شذوذ جنسی کا حکم", es: "El fallo sobre la homosexualidad" }
summary:
  ar: "سأل سائل عن حكم الإسلام في الشذوذ الجنسي بين الرجال أو بين النساء. أجابت اللجنة الدائمة للإفتاء بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21822 بتاريخ 14 أكتوبر 2012)⁩ أن الأصل في العلاقة الجنسية المشروعة أنها بين الرجل وزوجه يشرع لهما فيها كل صور الاستمتاع إلا الإتيان من الدبر فإنه لا يشرع، وأنه يجب تعليم ذلك لكل من يريد الإسلام فيلتزمه، فإن ضعف مستقبلًا وسقط في مخالفة فباب التوبة مفتوح، ومن أصر فأمره إلى الله."
  en: "A questioner asked about Islam's ruling on homosexuality between men or between women. AMJA's permanent fatwa committee (fatwa no. 21822, 14 October 2012) answered that the lawful sexual relation in principle is between a man and his wife, to whom all forms of intimacy are lawful except anal intercourse; that this must be taught to whoever wants Islam and he must commit to it; that whoever later weakens and falls into a violation has the door of repentance open; and that whoever persists, his affair is left to God. Recorded as AMJA's answer."
  ur: "ایک سائل نے مردوں یا عورتوں میں ہم جنس پرستی کا شرعی حکم پوچھا۔ ایم جے اے کی دائمی فتویٰ کمیٹی ⁦(فتویٰ 21822، 14 اکتوبر 2012)⁩ نے جواب دیا کہ جائز جنسی تعلق اصل میں میاں بیوی کے درمیان ہے؛ مسلمان بننے والے کو اس پر بات سکھانا اور التزام کرنا لازم ہے؛ جو بعد میں لغزش کرے اس کے لیے توبہ کا دروازہ کھلا ہے — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un consultante preguntó sobre la norma islámica respecto a la homosexualidad entre hombres o entre mujeres. El comité permanente de fatuas de AMJA (fatua n.º 21822, 14 de octubre de 2012) respondió que, en principio, la relación sexual lícita es entre un hombre y su esposa, para quienes son lícitas todas las formas de intimidad excepto el coito anal; que esto debe enseñarse a quien desee convertirse al islam y debe comprometerse con ello; que quien posteriormente flaquee y caiga en una transgresión tiene la puerta del arrepentimiento abierta; y que quien persista, su asunto queda en manos de Dios. Esta fue la respuesta registrada de AMJA."
