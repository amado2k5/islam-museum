id: work/fatwa-amja-safa-marwa-yattufu
class: work
kind: fatwa
label: { ar: "الصفا والمروة ويطوف", en: "Al-Baqara 158 — the word yattuf explained", ur: "صفا مروہ — یطوف کی لغوی شرح", es: "Al-Baqara 158 — Explicación de la palabra yattuf", fr: "Al-Baqara 158 — l'explication du mot yattuf", tr: "Safa, Merve ve Tavif", id: "Safa, Marwah, dan Tawaf" }
summary:
  ar: "سأل سائل عن آية إن الصفا والمروة من شعائر الله فلم يفهم منها المقصود في لفظ يطوف. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 21849 بتاريخ 12 نوفمبر 2006)⁩ أن السؤال يتعلق بالجانب اللغوي علم الصرف لأن أصل كلمة يطوف هو يتطوف فأدغمت التاء في الطاء فصارت طاء مشددة والعرب تلجأ عادة إلى هذا طلبًا للتخفيف والقرآن نزل بلسان عربي مبين وهو معجز في فصاحته وبلاغته فلا يعقل أن يستخدم لغة ركيكة أو مهجورة، وأما الطواف الشرعي فهو الطواف نفسه الذي يقوم به المسلمون من سعي بين الصفا والمروة."
  en: "A questioner stumbled on 'al-Safa and al-Marwa are among God's rites — whoever performs hajj or umra, no blame on him that he circles them (yattawwafa bihima)'. Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 21849, 12 November 2006) answered that the point is morphological: the root of yattawwafa is yatatawwafa, its ta merged into the ta' yielding a doubled ta' — the Arabs commonly doing this for lightness, and the Qur'an, revealed in clear Arabic and inimitable in its eloquence, could not use a rough or discarded speech; as for the sharia tawaf, it is the very circuit the Muslims make between al-Safa and al-Marwa."
  ur: "ایک سائل نے صفا مروہ آیت میں «یطوف» کا مطلب پوچھا۔ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 21849، 12 نومبر 2006)⁩ کے مطابق یہ تتطوف کی ادغام شدہ صورت ہے — عرب تخفیف کے لیے ایسا کرتی ہے؛ شرعی طواف وہی سعی ہے۔"
  es: "Un consultante preguntó: «Al-Safa y Al-Marwa son ritos divinos; quien realiza el Hajj o la Umrah no tiene culpa alguna por rodearlos (yattawwafa bihima)». El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.º 21849, 12 de noviembre de 2006) respondió que la cuestión es morfológica: la raíz de yattawwafa es yatatawwafa, donde la ta se fusiona con la ta', dando como resultado una ta' duplicada. Los árabes suelen hacer esto para mayor claridad, y el Corán, revelado en un árabe claro e inimitable en su elocuencia, no podía usar un lenguaje tosco o descartado; en cuanto al tawaf de la sharia, es el circuito que los musulmanes hacen entre Al-Safa y Al-Marwa."
  fr: "Un lecteur a buté sur le passage suivant: « al-Safa et al-Marwa font partie des rites divins; quiconque accomplit le hajj ou la umra, nul ne peut lui être reproché d'en faire le tour (yattawwafa bihima) ». Le Dr Muhammad Mawfiq al-Ghalayini (fatwa n° 21849, 12 novembre 2006) a répondu que la différence est morphologique: la racine de yattawwafa est yatatawwafa, son ta fusionnant avec le ta' pour former un ta' doublé. Les Arabes ont souvent recours à cette convention par souci de concision, et le Coran, révélé en arabe clair et d'une éloquence inimitable, ne saurait employer un langage familier ou négligé. Quant au tawaf rituel (shari'a tawaf), il s'agit précisément du circuit que les musulmans effectuent entre al-Safa et al-Marwa."
  tr: "Bir soruya Safa ve Merve'nin Allah'ın sembolleri arasında olduğu bir ayet hakkında soru soruldu, ancak Tevif kelimesinin anlamını anlamadı. Dr. Muhammed Muwafaq Al-Ghalayini (12 Kasım 2006 tarihli Fetva No. 21849), sorunun morfolojinin dilsel yönüyle ilgili olduğunu, çünkü Tevif kelimesinin kökeninin 'tevaf' olduğunu ve bu nedenle ta'nın ta'ya karıştığını ve vurgulu bir taa olduğunu söyledi. Araplar genellikle aydınlatma için buna başvurur. Kur'an, açık bir Arapça dilinde indirilmiştir; bu dil, hitabet ve hitabet açısından mucizevidir, bu yüzden zayıf veya terk edilmiş bir dil kullanmak mantıklı değildir. Meşru Tevaf ise, Safe'den Merve arasında Sâi'den gelen Müslümanların aynı Tevaf'a aykırıdır."
  id: "Seorang penanya ditanya tentang ayat yang menyatakan bahwa Safa dan Marwah adalah simbol Allah, tetapi ia tidak memahami arti kata Tawaf. Dr. Muhammad Muwafaq Al-Ghalayini (Fatwa No. 21849 tanggal 12 November 2006) menjawab bahwa pertanyaan tersebut berkaitan dengan aspek linguistik morfologi, karena asal kata Tawaf adalah 'tawaf', sehingga ta' digabungkan ke dalam ta', menjadikannya 'ta' yang ditekankan. Orang Arab biasanya menggunakan cara ini untuk menerangi keadaan. Al-Qur'an diwahyukan dalam bahasa Arab yang jelas, yang ajaib dalam kefasihan dan retorikanya, sehingga tidak masuk akal menggunakan bahasa yang lemah atau ditinggalkan. Adapun Tawaf yang sah, itu adalah Tawaf yang sama yang dilakukan oleh Muslim dari Sa'i antara Safa dan Marwah."
