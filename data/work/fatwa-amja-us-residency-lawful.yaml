id: work/fatwa-amja-us-residency-lawful
class: work
kind: fatwa
label: { ar: "الإقامة في الولايات المتحدة", en: "Residing in the United States", ur: "امریکہ میں قیام", es: "Residiendo en los Estados Unidos", fr: "Résidant aux États-Unis", tr: "Amerika Birleşik Devletleri'nde ikamet", id: "Tempat tinggal di Amerika Serikat" }
summary:
  ar: "سأل سائل عن حكم طلب حق الإقامة في الولايات المتحدة وقد سمع آراء متضاربة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81087 بتاريخ 4 مارس 2010)⁩ أن الأصل أن يقيم المسلم بين أظهر المسلمين لكن لا حرج في الإقامة خارج ديار الإسلام لتحصيل مقصود مشروع كتجارة أو طلب علم نافع لا يوجد نظيره في بلاد المسلمين أو للتوسعة في الرزق أو نحو ذلك من المقاصد الصالحة، شريطة أن يكون قادرًا على إظهار دينه وآمنًا من الفتنة فيه، وللمجمع قرار مستقل حول حكم الإقامة خارج ديار الإسلام على موقعه فيه تفصيل دقيق."
  en: "A questioner asked the ruling on seeking residency in the United States, having heard conflicting opinions. Dr. Salah al-Sawi (fatwa no. 81087, 4 March 2010) answered that the default is for the Muslim to live among Muslims, but residing outside Muslim lands is unobjectionable for a lawful purpose — trade, seeking beneficial knowledge with no equal in Muslim lands, broadening provision, or like good ends — provided one can show one's religion and is safe from trial in it; the Assembly has a standalone resolution on residing outside Muslim lands, on its site, with detailed treatment."
  ur: "ایک سائل نے امریکہ میں رہائش حاصل کرنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81087، 4 مارچ 2010)⁩ کے مطابق جائز مقصد ⁦(تجارت علم روزی)⁩ کے لیے قیام حرج نہیں بشرط دین ظاہر کر سکے اور فتنے سے محفوظ ہو۔"
  es: "Un consultante preguntó sobre la normativa relativa a la solicitud de residencia en Estados Unidos, tras haber escuchado opiniones contradictorias. El Dr. Salah al-Sawi (fatwa n.º 81087, 4 de marzo de 2010) respondió que, por defecto, el musulmán debe vivir entre musulmanes, pero residir fuera de tierras musulmanas no presenta inconveniente alguno para un propósito lícito —comercio, búsqueda de conocimiento beneficioso sin igual en tierras musulmanas, ampliación de la provisión o fines similares— siempre que se pueda demostrar la propia religión y se esté a salvo de ser juzgado en ella; la Asamblea tiene una resolución independiente sobre la residencia fuera de tierras musulmanas, en su sitio web, con un tratamiento detallado."
  fr: "Un internaute a interrogé le Dr Salah al-Sawi sur la question de la résidence aux États-Unis, suite à des avis divergents. Il a répondu que, par défaut, le musulman doit vivre parmi les musulmans, mais que résider hors des terres musulmanes n'est pas répréhensible pour un motif licite – commerce, recherche d'un savoir précieux sans équivalent en terre musulmane, amélioration de l'accès aux ressources, ou autres fins louables – à condition de pouvoir prouver sa religion et d'être à l'abri de toute poursuite judiciaire à ce sujet. L'Assemblée nationale populaire a publié une résolution spécifique sur la résidence hors des terres musulmanes, disponible sur son site web, qui en donne une analyse détaillée."
  tr: "Bir soruya Amerika Birleşik Devletleri'nde ikamet başvurusu kararı hakkında soru soruldu ve çelişkili görüşler dinlendi. Dr. Salah Al-Sawy (4 Mart 2010 tarihli Fetva No. 81087) yanıtladı; varsayılan olarak bir Müslümanın en önde gelen Müslümanlar arasında yaşaması gerektiğini, ancak ticaret, Müslüman ülkelerde eşi benzeri olmayan faydalı bilgi aramak veya geçim kaynaklarını genişletmek gibi meşru bir amaç için İslam toprakları dışında yaşamanın zararı olmadığını belirtti; tabii ki dinini yayımlayıp isyana karşı güvende olabiliyorsa. Meclis, İslam toprakları dışında ikamet hakkındaki kararla ilgili bağımsız bir karar hakkında ayrıntılı web sitesinde yer almaktadır."
  id: "Seorang penanya ditanya tentang putusan permohonan tinggal di Amerika Serikat dan mendengar pendapat yang bertentangan. Dr. Salah Al-Sawy menjawab (Fatwa No. 81087 tanggal 4 Maret 2010) bahwa defaultnya adalah seorang Muslim harus tinggal di antara Muslim paling terkemuka, tetapi tidak ada salahnya tinggal di luar tanah Islam untuk mencapai tujuan yang sah seperti perdagangan, mencari pengetahuan bermanfaat yang tak tertandingi di negara-negara Muslim, atau untuk memperluas mata pencaharian atau tujuan benar serupa, asalkan dia mampu memanifestasikan agamanya dan aman dari hasutan di sana. Majelis memiliki putusan independen atas putusan tinggal di luar tanah Islam di situs web rinci mereka."
