id: work/fatwa-amja-us-residency-lawful
class: work
kind: fatwa
label: { ar: "الإقامة في الولايات المتحدة", en: "Residing in the United States", ur: "امریکہ میں قیام" }
summary:
  ar: "سأل سائل عن حكم طلب حق الإقامة في الولايات المتحدة وقد سمع آراء متضاربة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81087 بتاريخ 4 مارس 2010)⁩ أن الأصل أن يقيم المسلم بين أظهر المسلمين لكن لا حرج في الإقامة خارج ديار الإسلام لتحصيل مقصود مشروع كتجارة أو طلب علم نافع لا يوجد نظيره في بلاد المسلمين أو للتوسعة في الرزق أو نحو ذلك من المقاصد الصالحة، شريطة أن يكون قادرًا على إظهار دينه وآمنًا من الفتنة فيه، وللمجمع قرار مستقل حول حكم الإقامة خارج ديار الإسلام على موقعه فيه تفصيل دقيق."
  en: "A questioner asked the ruling on seeking residency in the United States, having heard conflicting opinions. Dr. Salah al-Sawi (fatwa no. 81087, 4 March 2010) answered that the default is for the Muslim to live among Muslims, but residing outside Muslim lands is unobjectionable for a lawful purpose — trade, seeking beneficial knowledge with no equal in Muslim lands, broadening provision, or like good ends — provided one can show one's religion and is safe from trial in it; the Assembly has a standalone resolution on residing outside Muslim lands, on its site, with detailed treatment."
  ur: "ایک سائل نے امریکہ میں رہائش حاصل کرنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81087، 4 مارچ 2010)⁩ کے مطابق جائز مقصد ⁦(تجارت علم روزی)⁩ کے لیے قیام حرج نہیں بشرط دین ظاہر کر سکے اور فتنے سے محفوظ ہو۔"
