summary:
  ar: "الرحبية في علم الفرائض نظم أبي بكر الرحبي عبد الرحمن بن محمد الشافعي ⁦(ت. بعد 571هـ)⁩ في نحو مائتين وخمسة عشر بيتاً على بحر البسيط؛ أشهر متون الفرائض وعليها كثرة الشروح {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Al-Rahbiyya in the science of inheritance shares by Abu Bakr al-Rahbi (d. after 571 AH) — about two hundred and fifteen basit lines; the most famous of the fara'id mutun and one of the most commented {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Al-Rahbiyya en la ciencia de las participaciones hereditarias por Abu Bakr al-Rahbi (m. después del 571 AH) — unas doscientas quince líneas basit; el más famoso de los fara'id mutun y uno de los más comentados {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  fr: "Al-Rahbiyya dans la science des parts d'héritage par Abu Bakr al-Rahbi (d. après 571 AH) — environ deux cent quinze lignes de basit; le plus célèbre des fara'id mutun et l'un des plus commentés {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "ابوبکر الرحبی ⁦(متوفی 571ھ کے بعد)⁩ کی وراثت کے سائنس میں الرحبیہ - تقریباً دو سو پندرہ باسط لائنیں؛ فرائد متون میں سب سے مشہور اور سب سے زیادہ تبصرہ کیا جانے والا {حوالہ: المتون العلمیہ ازہر} {حوالہ: العالم}۔"
  tr: "El-Rahbiyyah fi 'İlm el-Fera'id: Ebu Bekir el-Rahbi, 'Abdülrahman ibn Muhammed el-Şafi'i (ö. 571 Hicri sonrası) şiirini Basit ölçüsünde yaklaşık iki yüz on beş dizede yazmıştır; miras kanunlarının en ünlü metinleri çoktur ve çok sayıda yoruma sahiptir {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  id: "Al-Rahbiyyah fi 'Ilm al-Fara'id: Abu Bakr al-Rahbi menulis puisi 'Abd al-Rahman ibn Muhammad al-Shafi'i (wafat setelah 571 H) dalam sekitar dua ratus lima belas bait dalam meter Basit; teks hukum warisan yang paling terkenal sangat banyak dan memiliki banyak komentar {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
