summary:
  ar: "تاريخ للصين وخطاي نشره أندريه مولر باسم عبد الله البيضاوي، والخشاب يرفض هذه النسبة {cite:jami-al-tawarikh-khashshab-1960 p. 135}. يرى أن القطعة الصينية منه تطابق ما في جامع التواريخ لرشيد الدين، وأن المؤرخ الذي كتبها بعد رشيد الدين بسنة واحدة كان يعرف الكتاب وحده صحيحا في تاريخ الصين {cite:jami-al-tawarikh-khashshab-1960 p. 136}. وتاريخ تحريره يقرأه المرجع على السنة 717 هـ، مع اختلاف في موضع «قبل» و«بعد» موت رشيد الدين بين صفحتين {cite:jami-al-tawarikh-khashshab-1960 p. 152}{cite:jami-al-tawarikh-khashshab-1960 p. 136}."
  en: "A history of China and Khitai published by Andre Muller under the name of al-Baydawi, an ascription the editor rejects {cite:jami-al-tawarikh-khashshab-1960 p. 135}. The editor argues that its Chinese passage matches Rashid al-Din's Jami' al-Tawarikh, and that its writer, who wrote a year after Rashid al-Din, knew his work as the only reliable account of Chinese history {cite:jami-al-tawarikh-khashshab-1960 p. 136}. The OCR reads its date as 717 AH; the page that gives the date says one year before Rashid al-Din's death, while another OCR line says after {cite:jami-al-tawarikh-khashshab-1960 p. 152}{cite:jami-al-tawarikh-khashshab-1960 p. 136}, so the date and its direction need checking."
  es: "Historia de China y Jitai publicada por Andre Muller con el nombre de al-Baydawi, atribución que el editor rechaza {cite:jami-al-tawarikh-khashshab-1960 p. 135}. El editor sostiene que su parte china coincide con el Jami' al-Tawarikh de Rashid al-Din, y que su autor, que escribió un año después de Rashid al-Din, conocía esa obra como el único relato fiable de la historia china {cite:jami-al-tawarikh-khashshab-1960 p. 136}. El OCR lee la fecha como 717 de la Hégira; la página que la da dice «un año antes» de la muerte de Rashid al-Din, y otra línea dice «después» {cite:jami-al-tawarikh-khashshab-1960 p. 152}{cite:jami-al-tawarikh-khashshab-1960 p. 136}, por lo que la fecha y su sentido deben verificarse."
  fr: "Histoire de la Chine et du Khitaï publiée par Andre Muller sous le nom d'al-Baydawi, attribution que l'éditeur rejette {cite:jami-al-tawarikh-khashshab-1960 p. 135}. L'éditeur soutient que son passage chinois correspond au Jami' al-Tawarikh de Rashid al-Din, et que son auteur, qui écrivit un an après Rashid al-Din, connaissait cet ouvrage comme le seul récit fiable de l'histoire chinoise {cite:jami-al-tawarikh-khashshab-1960 p. 136}. L'OCR lit la date 717 de l'Hégire ; la page qui la donne dit « un an avant » la mort de Rashid al-Din, une autre ligne dit « après » {cite:jami-al-tawarikh-khashshab-1960 p. 152}{cite:jami-al-tawarikh-khashshab-1960 p. 136}, la date et son sens doivent donc être vérifiés."
  ur: "تاریخ چین اور خطائی کا ایک متن، جسے آندرے مولر نے البیضاوی کے نام سے شائع کیا، اور مرتب اس انتساب کو رد کرتا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 135}۔ مرتب کے مطابق اس کا چینی حصہ رشید الدین کی جامع التواریخ سے مطابقت رکھتا ہے، اور اس کا مصنف، جس نے رشید الدین کے ایک سال بعد لکھا، اس کتاب کو چینی تاریخ کا واحد معتبر بیان جانتا تھا {cite:jami-al-tawarikh-khashshab-1960 p. 136}۔ OCR میں تاریخ 717ھ پڑھی گئی ہے؛ جس صفحے پر تاریخ ہے وہ رشید الدین کی وفات سے ایک سال پہلے کہتا ہے، جبکہ ایک اور سطر میں «بعد» لکھا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 152}{cite:jami-al-tawarikh-khashshab-1960 p. 136}، اس لیے تاریخ اور اس کے رخ کی تصدیق ضروری ہے۔"
  tr: "André Müller tarafından Abdullah al-Baydavi adıyla yayımlanan Çin Tarihi ve Hatalarım adlı eser, el-Khashab bu atıfı reddeder {atıf: Jami-al-Tawarikh-khashshab-1960, s. 135}. Çin parçasının Rashid al-Din'in Jami'al-Tawarikh eserindekilerle örtüştüğüne ve Rashid al-Din'den bir yıl sonra yazan tarihçinin, kitabın yalnızca bu kitabın doğru olduğunu bildiğine inanır; Çin Tarihi {cite:jami-al-tawarikh-khashshab-1960, s. 136}. Derlenme tarihi, 717 Hicri yılına atıfta okunur; iki sayfa arasında 'Reddin'in ölümünden önce' ve 'sonra' ifadelerinin yerleşiminde farklılık vardır {cite:jami-al-tawarikh-khashshab-1960 s. 152} {cite:jami-al-tawarikh-khashshab-1960 s. 136}."
  id: "Sejarah Tiongkok dan Kesalahan Saya diterbitkan oleh André Müller sebagai Abdullah al-Baydawi, dan al-Khashab menolak atribusi ini {cite:jami-al-tawarikh-khashshab-1960 hlm. 135}. Ia percaya bahwa fragmen Tionghoa dari buku itu sesuai dengan apa yang ada dalam Jami' al-Tawarikh karya Rashid al-Din, dan sejarawan yang menulisnya satu tahun setelah Rashid al-Din mengetahui bahwa buku itu saja sudah benar dalam Sejarah Tiongkok {cite:jami-al-tawarikh-khashshab-1960 hlm. 136}. Tanggal kompilasinya dibaca dengan referensi tahun 717 H, dengan perbedaan penempatan 'sebelum' dan 'sesudah' kematian Rashid al-Din antara dua halaman {cite:jami-al-tawarikh-khashshab-1960 hlm. 152} {cite:jami-al-tawarikh-khashshab-1960 hlm. 136}."
