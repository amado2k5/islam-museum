summary:
  ar: "أعلن المجلس الفقهي لأمريكا الشمالية ⁦(فبراير 2024)⁩ عن بداية شهري رمضان وشوال 1445هـ معتمدًا الحساب الفلكي كطريقة شرعية مقبولة وفق معايير المجلس الأوروبي للإفتاء والبحوث كما نصّ الإعلان."
  en: "The Fiqh Council of North America's announcement (February 2024) of the start of Ramadan and Shawwal 1445, adopting astronomical calculation as an accepted sharia method under the European Council of Fatwa and Research criteria, as the announcement states."
  ur: "فقہ کونسل آف نارتھ امریکہ کا اعلان ⁦(فروری 2024)⁩ رمضان اور شوال 1445ھ کے آغاز کا جس میں فلکی حساب کو معیارات یورپی کونسل کے مطابق معتبر شرعی طریقہ مانا گیا۔"
  es: "El anuncio del Consejo Fiqh de América del Norte (febrero de 2024) del inicio del Ramadán y Shawwal 1445, adoptando el cálculo astronómico como un método sharia aceptado bajo los criterios del Consejo Europeo de Fatwa e Investigación, afirma:"
  fr: "L'annonce du Conseil Fiqh d'Amérique du Nord (février 2024) du début du Ramadan et de Shawwal 1445, adoptant le calcul astronomique comme méthode de charia acceptée selon les critères du Conseil européen de la fatwa et de la recherche, indique."
  tr: "Kuzey Amerika Fiqh Konseyi (Şubat 2024), duyuruda belirtildiği üzere, Avrupa Fetva ve Araştırma Konseyi standartlarına göre kabul edilen İslami yöntem olarak astronomik hesaplamayı kabul eden İslami yöntemler olarak kabul ederek 1445 Hicri Ramazan ve Şhavval aylarının başlangıcını duyurdu."
  id: "Dewan Fiqh Amerika Utara (Februari 2024) mengumumkan awal bulan-bulan Ramadan dan Shawwal 1445 H, mengadopsi perhitungan astronomi sebagai metode Islam yang diterima sesuai standar Dewan Fatwa dan Penelitian Eropa, sebagaimana dinyatakan dalam pengumuman."
