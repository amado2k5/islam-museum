id: work/fatwa-amja-litany-for-named-saints
class: work
kind: fatwa
label: { ar: "الدعاء للأولياء بأعيانهم", en: "A litany praying for named saints — a Moroccan wird reviewed", ur: "نام لے کر اولیاء کے لیے دعا", es: "Una letanía de oraciones por santos nombrados: una palabra marroquí reseñada", fr: "Une litanie priant pour des saints nommés — un wird marocain analysé" }
summary:
  ar: "سأل سائل عن ورد جماعة العدل والإحسان المغربية المتضمن الدعاء للأولياء والصالحين بأسمائهم كالجنيد والفضيل بن عياض وبشر الحافي وعبد القادر الجيلاني وغيرهم. أجاب د. وليد بن إدريس المنيسي ⁦(فتوى رقم 2085 بتاريخ 10 نوفمبر 2006)⁩ أن هؤلاء المذكورين منهم أولياء صالحون ومنهم ضالون مضلون ومنهم من لا يعرف حالهم على وجه صحيح ولذا لا يرى استعمال هذا الدعاء خاصة أن النبي لم يكن من هديه المواظبة في أوراد يومية على الدعاء لأولياء أو صالحين بأعيانهم وخير الهدي هديه، ويكفي الدعاء العام المأثور بالاستغفار للمؤمنين والمؤمنات والدعاء بربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ولا تجعل في قلوبنا غلا للذين آمنوا."
  en: "A questioner cited the litany of Morocco's al-Adl wal-Ihsan movement praying by name for the saints — al-Junayd, al-Fudayl ibn Iyad, Bishr al-Hafi, Abd al-Qadir al-Jilani and others. Dr. Walid ibn Idris al-Munaysi (fatwa no. 2085, 10 November 2006) answered that among those named are righteous saints, straying misleaders, and some whose state is not truly known; he therefore disapproves of using this prayer — all the more since it was not the Prophet's way to keep daily litanies praying for saints or righteous men by name, and the best guidance is his guidance; the transmitted general prayer suffices: seeking forgiveness for believing men and women, and 'our Lord, forgive us and our brothers who preceded us in faith, and place not in our hearts any rancour toward the believers'."
  ur: "ایک سائل نے مغربی تحریک کے ورد میں اولیاء کے نام سے دعا پوچھی۔ ڈاکٹر ولید المنيسي ⁦(فتویٰ 2085، 10 نومبر 2006)⁩ کے مطابق نام والوں میں نیک اور گمراہ دونوں ہیں اور نبی کا طریقہ نام لے کر ورد نہ تھا — عمومی دعا کافی ہے۔"
  es: "Un interlocutor citó la letanía del movimiento marroquí al-Adl wal-Ihsan, que reza por nombre a los santos: al-Junayd, al-Fudayl ibn Iyad, Bishr al-Hafi, Abd al-Qadir al-Jilani y otros. El Dr. Walid ibn Idris al-Munaysi (fatwa n.º 2085, 10 de noviembre de 2006) respondió que entre los mencionados hay santos justos, descarriados y algunos cuyo estado no se conoce con certeza; por lo tanto, desaprueba el uso de esta oración, sobre todo porque no era costumbre del Profeta realizar letanías diarias rezando por los santos o los hombres justos por nombre, y la mejor guía es la suya; la oración general transmitida es suficiente: pedir perdón por los creyentes y las creyentes, y «Señor nuestro, perdónanos a nosotros y a nuestros hermanos que nos precedieron en la fe, y no pongas en nuestros corazones ningún rencor hacia los creyentes»."
  fr: "Un interrogateur a cité la litanie du mouvement marocain al-Adl wal-Ihsan, qui prie nommément pour les saints – al-Junayd, al-Fudayl ibn Iyad, Bishr al-Hafi, Abd al-Qadir al-Jilani et d'autres. Le Dr Walid ibn Idris al-Munaysi (fatwa n° 2085, 10 novembre 2006) a répondu que parmi les personnes citées figurent des saints pieux, des égarés et d'autres dont le sort est inconnu. Il désapprouve donc l'usage de cette prière, d'autant plus que le Prophète n'avait pas pour coutume de réciter quotidiennement des litanies pour les saints ou les hommes pieux, et que la meilleure guidance est la sienne. La prière générale transmise suffit: implorer le pardon pour les croyants et les croyantes, et dire: « Seigneur, pardonne-nous ainsi qu'à nos frères qui nous ont précédés dans la foi, et ne place pas dans nos cœurs de rancune envers les croyants. »"
