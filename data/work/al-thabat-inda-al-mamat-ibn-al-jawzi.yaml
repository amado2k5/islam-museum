summary:
  ar: «الثبات عند الممات» من مصنفات ابن الجوزي كما يثبت الذهبي في ثبت مؤلفاته {cite:siyar-alam-nubala scan vol. 1 p. 2194}، ويورده في «تاريخ الإسلام» بين «نسيم الرياض» و«الوفا بفضائل المصطفى» {cite:tarikh-islam-dhahabi vol. 45 p. 290}. ويدل عنوانه على أنه في الثبات عند الموت. ولم يوجد في الكتب المقروءة وصف لمحتواه أو ترتيبه.
  en: Al-Thabat 'inda al-Mamat is among the works of Ibn al-Jawzi as al-Dhahabi lists them {cite:siyar-alam-nubala scan vol. 1 p. 2194}, and in Tarikh al-Islam it stands between Nasim al-Riyad and al-Wafa bi-Fada'il al-Mustafa {cite:tarikh-islam-dhahabi vol. 45 p. 290}. Its title indicates that it concerns steadfastness at death. No description of its contents or arrangement was found in the books read.
  ur: «الثبات عند الممات» ابن الجوزی کی تصانیف میں سے ہے، جیسا کہ ذہبی ان کی فہرست میں درج کرتے ہیں {cite:siyar-alam-nubala scan vol. 1 p. 2194}، اور «تاریخ الاسلام» میں یہ «نسیم الریاض» اور «الوفا بفضائل المصطفیٰ» کے درمیان آتی ہے {cite:tarikh-islam-dhahabi vol. 45 p. 290}۔ اس کا عنوان بتاتا ہے کہ یہ موت کے وقت ثابت قدمی کے بارے میں ہے۔ پڑھی گئی کتابوں میں اس کے مضامین یا ترتیب کا بیان نہیں ملا۔
  es: "Al-Thabat 'inda al-Mamat figura entre las obras de Ibn al-Jawzi, según la lista de al-Dhahabi {cite:siyar-alam-nubala scan vol. 1 p. 2194}, y en Tarikh al-Islam se sitúa entre Nasim al-Riyad y al-Wafa bi-Fada'il al-Mustafa {cite:tarikh-islam-dhahabi vol. 45 p. 290}. Su título indica que trata sobre la firmeza ante la muerte. No se encontró ninguna descripción de su contenido ni de su estructura en los libros consultados."
