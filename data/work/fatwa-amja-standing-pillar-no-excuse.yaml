id: work/fatwa-amja-standing-pillar-no-excuse
class: work
kind: fatwa
label: { ar: "القيام ركن لا يسقط إلا بالعجز", en: "Leaving the standing in prayer for work or the market — not allowed", ur: "نماز میں قیام — صرف عجز پر گرے" }
summary:
  ar: "سأل سائل هل يجوز له ترك القيام في الصلاة حال عمله أو وجوده في السوق. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86333 بتاريخ 16 يناير 2012)⁩ أن القيام في صلاة الفريضة من أركان الصلاة لا يسقط إلا عند العجز لقوله تعالى وقوموا لله قانتين وحديث صل قائمًا فإن لم تستطع فقاعدًا على ما فصّل الجواب."
  en: "A questioner asked whether he may leave standing in the prayer while working or in the market. AMJA's fatwa committee (fatwa no. 86333, 16 January 2012) answered that standing in the obligatory prayer is a pillar, lapsing only at inability — 'stand to God in devotion' and 'pray standing; if you cannot, then seated' — as the answer details."
  ur: "کام یا بازار میں قیام چھوڑنا؟ لجنة الفتوى ⁦(فتویٰ 86333، 16 جنوری 2012)⁩ کے مطابق قیام رکن — عجز پر ہی گرے۔"
