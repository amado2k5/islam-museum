id: work/ahmed-el-sayed-seerah-2026-ep10
class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 10: سيرة رسول الله 10 | المهاجرات الأول والسابقات إلى الإسلام"
  en: "The Biography of the Messenger of God 2026, episode 10: The first women emigrants and the women who came early to Islam"
  ur: "سیرتِ رسول اللہ 2026، قسط 10: پہلی مہاجر خواتین اور اسلام قبول کرنے میں سبقت کرنے والی خواتین"
  fr: "La biographie du Messager de Dieu 2026, épisode 10 : Les premières émigrées et les femmes venues tôt à l'islam"
  es: "La biografía del Mensajero de Dios 2026, episodio 10: Las primeras emigradas y las mujeres que llegaron temprano al islam"
summary:
  ar: "تنتقل الحلقة العاشرة من أوائل المسلمين من الرجال إلى النساء المسلمات الأوليات في مكة، اللواتي بايعن وهاجرن إلى الحبشة أو إلى المدينة. يتتبع المحاضر تراجم ابن سعد لنساء مشهورات وأخريات قليلات الذكر، مبيّنًا أقاربهن وزيجاتهن وما لقين من أذى، ويؤكد كم كان ثمن الإسلام المبكر باهظًا، ولا سيما على بنات زعماء قريش."
  en: "The tenth session turns from the early male converts to the early Muslim women of Mecca who pledged allegiance and migrated to Abyssinia or Medina. The lecturer follows the biographical entries of Ibn Sa'd for both well-known and little-known women, noting their kin, marriages and ordeals, and stresses how costly early conversion was, especially for daughters of Qurayshi leaders."
  ur: "دسویں نشست ابتدائی مرد مسلمانوں سے مکہ کی ابتدائی مسلمان خواتین کی طرف آتی ہے، جنہوں نے بیعت کی اور حبشہ یا مدینہ ہجرت کی۔ مقرر مشہور اور کم معروف دونوں طرح کی خواتین کے بارے میں ابن سعد کے سوانحی اندراجات کی پیروی کرتا ہے، ان کے رشتہ داروں، شادیوں اور آزمائشوں کا ذکر کرتا ہے، اور اس پر زور دیتا ہے کہ ابتدائی اسلام لانا کتنا مہنگا تھا، خاص طور پر قریشی سرداروں کی بیٹیوں کے لیے۔"
  fr: "La dixième séance passe des premiers convertis masculins aux premières musulmanes de La Mecque, qui prêtèrent serment et émigrèrent en Abyssinie ou à Médine. Le conférencier suit les notices biographiques d'Ibn Sa'd sur des femmes connues et peu connues, notant leurs proches, leurs mariages et leurs épreuves, et souligne combien la conversion précoce coûtait cher, surtout aux filles des chefs de Quraysh."
  es: "La décima sesión pasa de los primeros conversos varones a las primeras mujeres musulmanas de La Meca, que prestaron juramento y emigraron a Abisinia o a Medina. El conferenciante sigue las entradas biográficas de Ibn Sa'd sobre mujeres conocidas y poco conocidas, señalando sus parientes, matrimonios y pruebas, y subraya lo costosa que fue la conversión temprana, sobre todo para las hijas de los jefes de Quraysh."
