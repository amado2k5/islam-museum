id: work/fatwa-amja-aqiqa-hair-custom
class: work
kind: fatwa
label: { ar: "عادة شعر العقيقة", en: "The aqiqa hair custom", ur: "عقیقے کے بالوں کی رسم", es: "La costumbre del cabello aqiqa", fr: "La coiffure aqiqa" }
summary:
  ar: "سأل سائل عن عادة بعض المسلمين في العقيقة جمع شعر الصبي بعد حلقه في ورقة يدخلونه في الكفن إذا مات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86468 بتاريخ 22 فبراير 2012)⁩ أنهم لا يعرفون دليلًا على ما ذُكر وأن مبلغ علمهم أنها من البدع المحدثة التي ينبغي إماتتها."
  en: "A questioner asked about some Muslims' aqiqa custom of collecting the boy's shaved hair in a paper placed in the shroud when he dies. Dr. Salah al-Sawi (fatwa no. 86468, 22 February 2012) answered that they know of no evidence for it and that, as far as their knowledge goes, it is among the newly invented practices that should be done away with. Recorded as AMJA's answer."
  ur: "ایک سائل نے عقیقے پر بچے کے مڑوانے والے بال کفن میں رکھنے کی رسم پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86468، 22 فروری 2012)⁩ نے جواب دیا کہ اس کی کوئی دلیل نہیں اور یہ نئی ایجادات میں سے ہے — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un interlocutor preguntó sobre la costumbre musulmana de recoger el cabello rapado del niño en un papel que se coloca en la mortaja tras su muerte. El Dr. Salah al-Sawi (fatwa n.º 86468, 22 de febrero de 2012) respondió que no conocen ninguna evidencia al respecto y que, según su conocimiento, se trata de una práctica de reciente invención que debería eliminarse. Esta respuesta fue registrada por AMJA."
  fr: "Un internaute a interrogé Salah al-Sawi (fatwa n° 86468 du 22 février 2012) sur la coutume musulmane de recueillir les cheveux rasés du garçon dans un papier placé dans son linceul après son décès. Il a répondu qu'aucune preuve n'était établie à ce sujet et que, d'après leurs connaissances, cette pratique faisait partie des coutumes récentes qu'il convenait d'abandonner. Cette réponse a été consignée dans la note AMJA."
