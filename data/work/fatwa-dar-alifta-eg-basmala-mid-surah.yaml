label: { ar: "حكم البسملة لمن بدأ القراءة من وسط السورة", en: "The basmala for one who begins reading mid-surah", ur: "سورہ کے وسط سے تلاوت شروع کرنے والے کے لیے بسم اللہ", es: "La basmala para quien comienza a leer la mitad de la sura", fr: "La basmala pour celui qui commence à lire au milieu d'une sourate", tr: "Surenin ortasından okumaya başlayan kişi için Basmala üzerindeki hüküm", id: "Keputusan tentang Basmala bagi mereka yang mulai membaca dari tengah Surah" }
summary:
  ar: "سائل سأل عن البسملة لمن بدأ القراءة من وسط السورة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21854)⁩ أنه يجوز لمن بدأ القراءة من وسط السورة أو أي موضع غير أولها خارج الصلاة قراءة البسملة أو عدم قراءتها على ما فصّل الجواب."
  en: "A questioner asked about the basmala for one who begins reading mid-surah. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21854) answered that one who starts reading from the middle of a surah — or anywhere but its start — outside prayer may read the basmala or leave it, as the answer details."
  ur: "ایک سائل نے سورہ کے وسط سے تلاوت شروع کرنے والے کے لیے بسم اللہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21854)⁩ نے جواب دیا کہ نماز سے باہر سورہ کے وسط یا شروع کے علاوہ کسی جگہ سے تلاوت شروع کرنے والا بسم اللہ پڑھے یا نہ پڑھے دونوں جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la basmala para quien comienza a leer a mitad de una sura. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21854) respondió que quien comienza a leer desde la mitad de una sura —o desde cualquier otro punto que no sea su inicio— fuera de la oración puede recitar la basmala o no, como se detalla en la respuesta."
  fr: "Un lecteur a posé une question concernant la basmala pour celui qui commence à lire une sourate au milieu. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21854) a répondu que celui qui commence à lire une sourate au milieu – ou n'importe où ailleurs qu'à son début – en dehors de la prière peut réciter la basmala ou non, comme le précise la réponse."
  tr: "Bir soru soran, surenin ortasından okumaya başlayanlara Basmala hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21854), surenin ortasından veya namazın dışında başka bir yerden okumaya başlayan birinin Basmela'yı okumasının ya da okumamasının caiz olduğunu söyledi; bu cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang Basmala bagi mereka yang mulai membaca dari tengah surah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21854) menjawab bahwa diperbolehkan bagi seseorang yang mulai membaca dari tengah surah atau tempat lain selain awalnya di luar shalat untuk mengucapkan Basmala atau tidak mengucapkannya, seperti yang dijelaskan dalam jawabannya."
