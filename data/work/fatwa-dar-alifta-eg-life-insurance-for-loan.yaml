label: { ar: "حكم اشتراط التأمين على الحياة لضمان القرض", en: "Requiring life insurance to secure a loan", ur: "قرض کی ضمانت کے لیے لائف انشورنس کی شرط" }
summary:
  ar: "سائل سأل عن اشتراط شركة التمويل التأمين على الحياة لضمان القرض بدون فوائد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22072)⁩ أن اشتراط التأمين على الحياة لضمان حصول الشركة على حقها جائز شرعًا ولا حرج فيه على ما فصّل الجواب."
  en: "A questioner asked about a finance company requiring life insurance to secure an interest-free loan. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22072) answered that requiring life insurance to guarantee the company's right is lawful and unobjectionable, as the answer details."
  ur: "ایک سائل نے بلا سود قرض کی ضمانت کے لیے فنانس کمپنی کی طرف سے لائف انشورنس کی شرط کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22072)⁩ نے جواب دیا کہ کمپنی کے حق کی ضمانت کے لیے لائف انشورنس کی شرط شرعاً جائز اور بلا حرج ہے، جیسا کہ جواب میں تفصیل ہے۔"
