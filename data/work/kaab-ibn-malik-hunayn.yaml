label: { ar: "قصيدة كعب بن مالك في يوم حنين ومسير الطائف", en: "Ka'b ibn Malik's ode on Hunayn and the march to Ta'if", es: "La oda de Ka'b ibn Malik a Hunayn y la marcha a Ta'if.", fr: "L'ode de Ka'b ibn Malik sur Hunayn et la marche vers Ta'if", ur: "کعب بن مالک کا حنین اور طائف کی طرف کوچ کرنا", tr: "Ka'b ibn Malik'in Özlem Günü ve Taif Yolculuğu Şiiri", id: "Puisi Ka'b ibn Malik tentang Hari Kerinduan dan Perjalanan Taif" }
summary:
  ar: "قصيدة كعب بن مالك الأنصاري في يوم حنين ومسير الجيش لحصار الطائف، يصف فيها نصر الله لنبيه ودحر الشرك ودك حصون الطائف. مطلعها: «وقائلةٍ ألا تَبكِي أخاها»."
  en: "The ode by Ka'b ibn Malik al-Ansari commemorating the victory at Hunayn and the army's advance to besiege the fortress of Ta'if."
  es: "La oda de Ka'b ibn Malik al-Ansari que conmemora la victoria en Hunayn y el avance del ejército para sitiar la fortaleza de Ta'if."
  fr: "L'ode de Ka'b ibn Malik al-Ansari commémorant la victoire de Hunayn et l'avancée de l'armée pour assiéger la forteresse de Ta'if."
  ur: "حنین کی فتح اور طائف کے قلعے کا محاصرہ کرنے کے لیے فوج کی پیش قدمی کی یاد میں کعب بن مالک الانصاری کا کلام۔"
  tr: "Ka'b ibn Malik al-Ansari'nin Hunayn günü ve ordunun Taif'i kuşatma yürüyüşü üzerine yazdığı bir şiir; burada Peygamberi'nin zaferini, çoktanrıcılığın yenilgisini ve Taif kalelerinin yıkılmasını anlatır. Başlangıcı şöyledir: \"Ve şöyle der: 'Kardeşi için ağlama.'\""
  id: "Sebuah puisi oleh Ka'b ibn Malik al-Ansari pada hari Hunayn dan perjalanan pasukan untuk mengepung Taif, di mana ia menggambarkan kemenangan Tuhan untuk Nabi-Nya, kekalahan politeisme, dan penghancuran benteng-benteng Taif. Pembukaannya adalah: \"Dan berkata, 'Jangan menangisi saudaranya.'\""
