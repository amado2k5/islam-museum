label: { ar: "محمد: محاولة لفهم السيرة النبوية", en: "Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya", ur: "محمد: محاولۃ لفہم السیرۃ النبویہ", es: "Mahoma: Muhawala li-Fahm al-Sira al-Nabawiyya", fr: "Mahomet: Muhawala li-Fahm al-Sira al-Nabawiyya", tr: "Muhammed: Peygamberlik Biyografisini Anlamaya Yönelik Bir Çaba", id: "Muhammad: Upaya untuk Memahami Biografi Nabi" }
summary:
  ar: "كتاب مصطفى محمود في السيرة النبوية، يرد فيه على «لون جديد من كتب السيرة» يجرد النبي من الغيب ويصوره مصلحاً اجتماعياً، ويقرر أن جوهر النبوة «الصلة المبهمة بالله وبغيبه» وأن النبي يختلف عن الولي والمصلح الاجتماعي {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}."
  en: "Mostafa Mahmoud's book on the Prophet's life, answering 'a new kind of sira book' that strips the Prophet of the unseen and portrays him as a social reformer, and arguing that the essence of prophethood is 'the mysterious link with God and His unseen', so that a prophet differs from a saint and a social reformer {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}."
  ur: "سیرتِ نبوی پر مصطفیٰ محمود کی کتاب، جو سیرت کی ان «نئی قسم کی کتابوں» کا جواب دیتی ہے جو نبی کو غیب سے خالی کر کے سماجی مصلح بنا کر پیش کرتی ہیں، اور طے کرتی ہے کہ نبوت کا جوہر «اللہ اور اس کے غیب سے مبہم ربط» ہے، اس لیے نبی ولی اور سماجی مصلح سے مختلف ہے {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}۔"
  es: "El libro de Mostafa Mahmoud sobre la vida del Profeta, que responde a \"un nuevo tipo de libro de sira\" que despoja al Profeta de lo invisible y lo retrata como un reformador social, y argumenta que la esencia de la profecía es \"el vínculo misterioso con Dios y lo invisible\", de modo que un profeta difiere de un santo y un reformador social {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}."
  fr: "Le livre de Mostafa Mahmoud sur la vie du Prophète, répondant à « un nouveau type de livre de sira » qui dépouille le Prophète de l'invisible et le dépeint comme un réformateur social, et arguant que l'essence de la prophétie est « le lien mystérieux avec Dieu et Son invisible », de sorte qu'un prophète diffère d'un saint et d'un réformateur social {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}."
  tr: "Mustafa Mahmoud'un Peygamber biyografisi üzerine kitabı, Peygamber'i görünmeyenin elinden alan ve onu toplumsal reformcu olarak tasvir eden \"biyografi kitaplarından yeni bir tarz\"a yanıt vererek, peygamberliğin özünün \"Tanrı ve O'nun görünmeyeniyle belirsiz bağlantı\" olduğunu ve Peygamber'in aziz ve sosyal reformcuyla farklı olduğunu belirtir {cite:mm-muhammad-maarif-ed5 s. 10} {cite:mm-muhammad-maarif-ed5 s. 13}."
  id: "Buku Mustafa Mahmoud tentang biografi Nabi, di mana ia menanggapi \"gaya baru dari kitab-kitab biografi\" yang menghilangkan yang tak terlihat dari Nabi dan menggambarkannya sebagai reformis sosial, menegaskan bahwa esensi kenabian adalah \"hubungan ambigu dengan Allah dan Yang tak terlihat,\" dan bahwa Nabi berbeda dari wali dan reformis sosial {cite:mm-muhammad-maarif-ed5 hlm. 10} {cite:mm-muhammad-maarif-ed5 hlm. 13}."
