label: { ar: "محمد: محاولة لفهم السيرة النبوية", en: "Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya", ur: "محمد: محاولۃ لفہم السیرۃ النبویہ" }
summary:
  ar: "كتاب مصطفى محمود في السيرة النبوية، يرد فيه على «لون جديد من كتب السيرة» يجرد النبي من الغيب ويصوره مصلحاً اجتماعياً، ويقرر أن جوهر النبوة «الصلة المبهمة بالله وبغيبه» وأن النبي يختلف عن الولي والمصلح الاجتماعي {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}."
  en: "Mostafa Mahmoud's book on the Prophet's life, answering 'a new kind of sira book' that strips the Prophet of the unseen and portrays him as a social reformer, and arguing that the essence of prophethood is 'the mysterious link with God and His unseen', so that a prophet differs from a saint and a social reformer {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}."
  ur: "سیرتِ نبوی پر مصطفیٰ محمود کی کتاب، جو سیرت کی ان «نئی قسم کی کتابوں» کا جواب دیتی ہے جو نبی کو غیب سے خالی کر کے سماجی مصلح بنا کر پیش کرتی ہیں، اور طے کرتی ہے کہ نبوت کا جوہر «اللہ اور اس کے غیب سے مبہم ربط» ہے، اس لیے نبی ولی اور سماجی مصلح سے مختلف ہے {cite:mm-muhammad-maarif-ed5 p. 10} {cite:mm-muhammad-maarif-ed5 p. 11} {cite:mm-muhammad-maarif-ed5 p. 13}۔"
