  id: "Sebuah karya referensi dalam bahasa Inggris oleh orientalis Belanda G. H. A. Jünbühl mencakup terjemahan bahasa Inggris dari hadits buku-buku yang ditulis beserta rantai transmisinya, diterbitkan oleh Brill pada tahun 2007 dalam 804 halaman."
