summary:
  ar: "عمل مرجعي بالإنجليزية للمستشرق الهولندي غ. هـ. أ. يوينبول يضم ترجمات إنجليزية لأحاديث الكتب المعتمدة مع أسانيدها، صدر عن دار بريل سنة 2007 في 804 صفحات."
  en: "An English reference work by the Dutch orientalist G. H. A. Juynboll giving English translations of canonical hadiths with their chains of transmission, published by Brill in 2007 (804 pages)."
