id: work/fatwa-aliftaa-jo-buying-an-animal-priced-by-the-weight-of-its-meat
class: work
kind: fatwa
label: { ar: "شراء الذبيحة بسعر الكيلو من لحمها بعد الذبح", en: "Buying an animal priced by the weight of its meat after slaughter", ur: "ذبح کے بعد گوشت کے وزن کے حساب سے جانور خریدنا" }
summary:
  ar: "سؤال عن شراء الذبيحة بسعر الكيلو من لحمها بعد الذبح، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز بيع الأنعام بسعر كل كيلو من لحمها بعد الذبح لأن اللحم غير مشاهد فيقع الغرر، ويمكن الوعد بالشراء ثم البيع عند الوزن، وأما الأضحية فلا بد من تملكها حية قبل ذبحها. أجابت الدائرة بأنه لا يجوز بيع الأنعام بهذه الطريقة، كل كيلوغرام من لحمها بعد الذبح بكذا، لأن اللحم قبل الذبح غير مشاهد، فيؤدي إلى الجهالة والغرر، وهما من مفسدات البيوع. وقالت إنه يمكن أن يعد المشتري بشراء لحم الذبيحة بعد ذبحها بسعر محدد للكيلو، ويتم البيع عند وزن اللحم حين يعلم مقدار المبيع والثمن، ولا مانع من ذلك، ونقلت عن الخطيب الشربيني في مغني المحتاج (2/355) صحة بيع الصبرة المجهولة الصيعان كل صاع بكذا لأن المبيع مشاهد والثمن معلوم بالتفصيل. وقالت إن الأضحية والعقيقة والدم المنذور لا بد من تمام ملكها قبل ذبحها، فلا يصح أن تذبح على ملك اللحام، بل تشترى حية ثم تذبح بنية الأضحية ونحوها."
  en: "A question about buying an animal priced by the weight of its meat after slaughter, in which Jordan's General Iftaa Department answered that livestock may not be sold at a price per kilogram of meat after slaughter because the meat is unseen and gharar results, that a promise to buy followed by a sale at weighing is possible, and that a sacrificial animal must be owned alive before slaughter. The Department answered that livestock may not be sold this way, at so much per kilogram of meat after slaughter, because the meat is not seen before slaughter, which leads to uncertainty and gharar, both of which invalidate sales. It said the buyer may instead promise to buy the meat after slaughter at a set price per kilogram, with the sale concluded when the meat is weighed and both quantity and price are known, which is permissible, quoting al-Khatib al-Shirbini in Mughni al-Muhtaj (2/355) that a heap of unknown measure may be sold at so much per measure because the goods are seen and the price is known in detail. It said that a sacrifice, an aqiqa or a vowed offering must be fully owned before it is slaughtered, so it may not be slaughtered while still the butcher's property; it is bought alive and then slaughtered with the intention of sacrifice or the like."
  ur: "ذبح کے بعد گوشت کے وزن کے حساب سے جانور خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ذبح کے بعد گوشت کے فی کلو کے حساب سے مویشی بیچنا جائز نہیں کیونکہ گوشت نظر نہیں آتا اور غرر ہوتا ہے، خریدنے کا وعدہ اور وزن پر بیع ممکن ہے، اور قربانی کا جانور ذبح سے پہلے زندہ حالت میں ملکیت میں ہونا ضروری ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مویشیوں کو اس طرح بیچنا جائز نہیں کہ ذبح کے بعد ہر کلو گوشت اتنے کا ہو، کیونکہ ذبح سے پہلے گوشت نظر نہیں آتا، جس سے جہالت اور غرر پیدا ہوتا ہے، اور یہ دونوں بیع کو فاسد کرتے ہیں۔ اس نے کہا کہ اس کے بجائے خریدار ذبح کے بعد مقررہ فی کلو قیمت پر گوشت خریدنے کا وعدہ کر سکتا ہے، اور بیع گوشت تولتے وقت مکمل ہو جب مقدار اور قیمت معلوم ہوں، اس میں کوئی رکاوٹ نہیں، اور مغنی المحتاج (2/355) میں خطیب شربینی سے نقل کیا کہ نامعلوم پیمانوں والا ڈھیر فی پیمانہ قیمت پر بیچنا درست ہے کیونکہ مال سامنے ہے اور قیمت تفصیلاً معلوم ہے۔ اس نے کہا کہ قربانی، عقیقہ اور نذر کا جانور ذبح سے پہلے مکمل طور پر ملکیت میں ہونا ضروری ہے، لہٰذا قصاب کی ملکیت میں ذبح درست نہیں؛ اسے زندہ خریدا جائے پھر قربانی وغیرہ کی نیت سے ذبح کیا جائے۔"
