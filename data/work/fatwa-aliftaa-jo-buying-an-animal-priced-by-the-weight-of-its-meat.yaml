id: work/fatwa-aliftaa-jo-buying-an-animal-priced-by-the-weight-of-its-meat
class: work
kind: fatwa
label: { ar: "شراء الذبيحة بسعر الكيلو من لحمها بعد الذبح", en: "Buying an animal priced by the weight of its meat after slaughter", ur: "ذبح کے بعد گوشت کے وزن کے حساب سے جانور خریدنا", es: "Comprar un animal cuyo precio se basa en el peso de su carne después del sacrificio.", fr: "L'achat d'un animal dont le prix est déterminé par le poids de sa viande après abattage.", tr: "Kesim sonrası etin kilo başına fiyatından leşin satın alınması", id: "Membeli bangkai dengan harga per kilo dagingnya setelah disembelih" }
summary:
  ar: "سؤال عن شراء الذبيحة بسعر الكيلو من لحمها بعد الذبح، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز بيع الأنعام بسعر كل كيلو من لحمها بعد الذبح لأن اللحم غير مشاهد فيقع الغرر، ويمكن الوعد بالشراء ثم البيع عند الوزن، وأما الأضحية فلا بد من تملكها حية قبل ذبحها. أجابت الدائرة بأنه لا يجوز بيع الأنعام بهذه الطريقة، كل كيلوغرام من لحمها بعد الذبح بكذا، لأن اللحم قبل الذبح غير مشاهد، فيؤدي إلى الجهالة والغرر، وهما من مفسدات البيوع. وقالت إنه يمكن أن يعد المشتري بشراء لحم الذبيحة بعد ذبحها بسعر محدد للكيلو، ويتم البيع عند وزن اللحم حين يعلم مقدار المبيع والثمن، ولا مانع من ذلك، ونقلت عن الخطيب الشربيني في مغني المحتاج (2/355) صحة بيع الصبرة المجهولة الصيعان كل صاع بكذا لأن المبيع مشاهد والثمن معلوم بالتفصيل. وقالت إن الأضحية والعقيقة والدم المنذور لا بد من تمام ملكها قبل ذبحها، فلا يصح أن تذبح على ملك اللحام، بل تشترى حية ثم تذبح بنية الأضحية ونحوها."
  en: "A question about buying an animal priced by the weight of its meat after slaughter, in which Jordan's General Iftaa Department answered that livestock may not be sold at a price per kilogram of meat after slaughter because the meat is unseen and gharar results, that a promise to buy followed by a sale at weighing is possible, and that a sacrificial animal must be owned alive before slaughter. The Department answered that livestock may not be sold this way, at so much per kilogram of meat after slaughter, because the meat is not seen before slaughter, which leads to uncertainty and gharar, both of which invalidate sales. It said the buyer may instead promise to buy the meat after slaughter at a set price per kilogram, with the sale concluded when the meat is weighed and both quantity and price are known, which is permissible, quoting al-Khatib al-Shirbini in Mughni al-Muhtaj (2/355) that a heap of unknown measure may be sold at so much per measure because the goods are seen and the price is known in detail. It said that a sacrifice, an aqiqa or a vowed offering must be fully owned before it is slaughtered, so it may not be slaughtered while still the butcher's property; it is bought alive and then slaughtered with the intention of sacrifice or the like."
  ur: "ذبح کے بعد گوشت کے وزن کے حساب سے جانور خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ذبح کے بعد گوشت کے فی کلو کے حساب سے مویشی بیچنا جائز نہیں کیونکہ گوشت نظر نہیں آتا اور غرر ہوتا ہے، خریدنے کا وعدہ اور وزن پر بیع ممکن ہے، اور قربانی کا جانور ذبح سے پہلے زندہ حالت میں ملکیت میں ہونا ضروری ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مویشیوں کو اس طرح بیچنا جائز نہیں کہ ذبح کے بعد ہر کلو گوشت اتنے کا ہو، کیونکہ ذبح سے پہلے گوشت نظر نہیں آتا، جس سے جہالت اور غرر پیدا ہوتا ہے، اور یہ دونوں بیع کو فاسد کرتے ہیں۔ اس نے کہا کہ اس کے بجائے خریدار ذبح کے بعد مقررہ فی کلو قیمت پر گوشت خریدنے کا وعدہ کر سکتا ہے، اور بیع گوشت تولتے وقت مکمل ہو جب مقدار اور قیمت معلوم ہوں، اس میں کوئی رکاوٹ نہیں، اور مغنی المحتاج (2/355) میں خطیب شربینی سے نقل کیا کہ نامعلوم پیمانوں والا ڈھیر فی پیمانہ قیمت پر بیچنا درست ہے کیونکہ مال سامنے ہے اور قیمت تفصیلاً معلوم ہے۔ اس نے کہا کہ قربانی، عقیقہ اور نذر کا جانور ذبح سے پہلے مکمل طور پر ملکیت میں ہونا ضروری ہے، لہٰذا قصاب کی ملکیت میں ذبح درست نہیں؛ اسے زندہ خریدا جائے پھر قربانی وغیرہ کی نیت سے ذبح کیا جائے۔"
  es: "Una pregunta sobre la compra de un animal cuyo precio se basa en el peso de su carne después del sacrificio, en la que el Departamento General de Iftaa de Jordania respondió que el ganado no puede venderse a un precio por kilogramo de carne después del sacrificio porque la carne no se ve y se produce gharar, que es posible una promesa de compra seguida de una venta al pesar, y que un animal de sacrificio debe ser propiedad de la persona viva antes del sacrificio. El Departamento respondió que el ganado no puede venderse de esta manera, a tal cantidad por kilogramo de carne después del sacrificio, porque la carne no se ve antes del sacrificio, lo que lleva a la incertidumbre y gharar, ambos invalidando las ventas. Dijo que el comprador puede en cambio prometer comprar la carne después del sacrificio a un precio fijo por kilogramo, y que la venta se concluye cuando la carne se pesa y se conocen tanto la cantidad como el precio, lo cual es permisible, citando a al-Khatib al-Shirbini en Mughni al-Muhtaj (2/355) que un montón de medida desconocida puede venderse a tal cantidad por medida porque los bienes se ven y el precio se conoce en detalle. Decía que un sacrificio, un aqiqa o una ofrenda prometida debe ser propiedad total del animal antes de ser sacrificado, por lo que no puede ser sacrificado mientras aún sea propiedad del carnicero; se compra vivo y luego se sacrifica con la intención de realizar un sacrificio o algo similar."
  fr: "Concernant l'achat d'un animal dont le prix est calculé au poids de sa viande après abattage, le Département général de la Iftaa de Jordanie a répondu que la vente de bétail au prix du kilogramme de viande après abattage est interdite car la viande n'est pas visible et cela engendre le gharar (illicite). Le Département a précisé qu'une promesse d'achat suivie d'une vente au poids est possible et que l'animal sacrificiel doit être possédé vivant avant l'abattage. Il a également indiqué que la vente de bétail au prix du kilogramme de viande après abattage est interdite car la viande n'est pas visible avant l'abattage, ce qui crée une incertitude et un gharar, deux éléments invalidant la vente. Le Département a ajouté que l'acheteur peut en revanche promettre d'acheter la viande après abattage à un prix fixe au kilogramme, la vente étant conclue lorsque la viande est pesée et que la quantité et le prix sont connus. Cette pratique est permise, selon al-Khatib al-Shirbini dans Mughni al-Muhtaj (2/355), qui affirme qu'un tas de quantité inconnue peut être vendu à un prix déterminé à la mesure car la marchandise est visible et le prix est connu précisément. Il est dit qu'un sacrifice, une aqiqa ou une offrande vœu doit être pleinement possédé avant d'être abattu, de sorte qu'il ne peut être abattu tant qu'il est encore la propriété du boucher; il est acheté vivant puis abattu dans l'intention du sacrifice ou autre."
  tr: "Hayvanın kesim sonrası bir kilo etinin fiyatına satın alınması sorusuna ilişkin bir soru, Ürdün Genel Fetva Dairesi, kesim sonrası hayvanların her kilogram fiyatından satılmasının izin verilmediğini, çünkü etin görünmediğini ve bu nedenle belirsizlik yarattığını yanıtladı. Tartım sırasında satın alma ve satma sözü verilmesi mümkündür. Kurban ise kesimden önce yılan olarak sahiplenilmelidir. Departman, bu şekilde hayvan satılmasının izin verilmediğini; kesimden sonraki her kilogram etin böyle kabul edildiğini, çünkü kesim öncesi etin görünmemesi nedeniyle cehalet ve belirsizliğe yol açtığını ve satışların bozulmasının nedenlerinden olduğunu yanıtladı. Alıcının, kesilen hayvanın etini kestikten sonra kilo başına sabit bir fiyatla satın alacağına söz verebileceğini, satışın miktar ve fiyat bilindiğinde etin ağırlığına göre yapıldığını, buna itiraz olmadığını söyledi. Mughni Al-Muhtaj (2/355) adlı eserinde Al-Khatib Al-Sharbini'nin bilinmeyen sabranın satılmasının doğruluğunun şu veya şu için 'Sa' olduğunu, çünkü satılan ürünün görüldüğünü ve fiyatının ayrıntılı olarak bilindiğini aktardı. Kurban, akikah ve yemin edilen kanın kesimden önce tamamen sahiplenilmesi gerektiğini, bu yüzden kasabın mülkiyetinde kesilmesinin izin verilmediğini; bunun yerine canlı satın alınıp kurban veya benzeri eşyalar amacıyla kesildiğini belirtti."
  id: "Sebuah pertanyaan tentang pembelian hewan dengan harga satu kilo dagingnya setelah disembelih, di mana Departemen Fatwa Umum Yordania menjawab bahwa tidak diperbolehkan menjual ternak dengan harga setiap kilogram daging setelah disembelih karena daging tidak terlihat, sehingga menimbulkan ketidakpastian. Dapat dijanjikan untuk membeli dan kemudian menjual pada saat penimbangan. Adapun pengorbanan, hewan harus dimiliki sebagai ular sebelum disembelih. Departemen menjawab bahwa tidak diperbolehkan menjual ternak dengan cara ini; setiap kilogram daging setelah disembelih dianggap demikian, karena daging sebelum pemotongan tidak terlihat, sehingga menimbulkan ketidaktahuan dan ketidakpastian, yang menjadi salah satu pengganggu penjualan. Dia mengatakan bahwa pembeli dapat berjanji membeli daging hewan yang disembelih setelah disembelih dengan harga tetap per kilo, dan penjualan dilakukan berdasarkan berat daging ketika jumlah dan harga sudah diketahui, dan tidak ada keberatan terhadap hal itu. Dia mengutip Al-Khatib Al-Sharbini dalam Mughni Al-Muhtaj (2/355) yang mengatakan bahwa keaslian penjualan sabra yang tidak diketahui adalah 'Sa' untuk barang tertentu karena barang yang dijual terlihat dan harga diketahui secara rinci. Dia mengatakan bahwa korban, aqiqah, dan darah yang diikrarkan harus dimiliki sepenuhnya sebelum disembelih, sehingga tidak diperbolehkan menyembelihnya atas kepemilikan tukang daging; sebaliknya, mereka dibeli hidup-hidup dan kemudian disembelih dengan tujuan korban atau barang serupa."
