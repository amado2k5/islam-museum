id: work/fatwa-dar-alifta-tailors-liability-for-damaged-cloth
class: work
kind: fatwa
label: { ar: "حكم ضمان ما تلف من القماش في يد الخياط", en: "A tailor's liability for cloth spoiled in his hands", ur: "درزی کے ہاتھ میں خراب ہونے والے کپڑے کے ضمان کا حکم" }
summary:
  ar: "سؤال عن خياط أخذ قطعة قماش قيّمة ليفصلها ثوبًا بمواصفات معينة فأخطأ في قياسات الباترون عند القص فتلف القماش ولم يعد يصلح للثوب المطلوب، أجابت فيه دار الإفتاء المصرية بأن ما تلف في يد الخياط عند قصه وأخذ القياسات مضمون عليه شرعًا، وأن الأصل في ضمانه أن يكون بمثل مواصفات ما أفسده من القماش، فإن لم يستطع التحصل على المثل فبقيمته يوم التلف. بيّنت الدار أن استئجار الإنسان على عمل معلوم جائز بلا خلاف، وفرّقت بين الأجير الخاص الذي يعمل لواحد مدة معلومة والأجير المشترك الذي يتقبل الأعمال من الناس كالصباغ والقصار والخياط، ونقلت تعريفهما عن السمرقندي في تحفة الفقهاء ومجلة الأحكام العدلية، وقررت أن جمهور الفقهاء من المذاهب الأربعة يضمّنون الأجير المشترك ما تلف بجناية يده، لأن في ذلك مصلحة الصناع وأرباب السلع وفي تركه ذريعة إلى إتلاف أموال الناس، مستدلة بما روي أن علي بن أبي طالب كان يضمّن القصّار والصوّاغ ويقول لا يُصلح الناس إلا ذلك، وناقلة عن السغدي وابن شاس والقاضي عبد الوهاب والخطيب الشربيني والبهوتي. ثم بيّنت أن الأصل في الضمان أن يُضمن المثلي بمثله والقيمي بقيمته ولا يُنتقل إلى القيمة إلا عند تعذر المثل، كما قال العز بن عبد السلام، وأن القيمة تُعتبر يوم التلف كما قال ابن نجيم وابن حجر الهيتمي."
  en: "A question about a tailor who took a valuable piece of cloth to cut it into a garment of agreed specifications, made an error in the pattern measurements while cutting, and spoiled the cloth so that it was no longer fit for the garment; Dar al-Ifta al-Misriyya answered that what is spoiled in a tailor's hands while cutting and measuring is his liability in sharia, and that the rule is to compensate with cloth of the same specifications as the one he ruined, or, if a like cannot be obtained, with its value on the day of the damage. Dar al-Ifta explained that hiring a person for a known task is permissible without disagreement, distinguished the private hireling who works for one employer for a fixed period from the common hireling who takes work from the public, such as dyers, fullers and tailors, quoting the definitions of al-Samarqandi in Tuhfat al-Fuqaha and of the Ottoman Majalla, and ruled that the majority of jurists in the four schools hold the common hireling liable for what is spoiled by the work of his hands, because this serves the interests of both craftsmen and owners of goods, while leaving him unliable would open the way to the loss of people's property; it cited the report that Ali ibn Abi Talib used to hold fullers and goldsmiths liable, saying that nothing else would set people right, and quoted al-Sughdi, Ibn Shas, Qadi Abd al-Wahhab, al-Khatib al-Shirbini and al-Buhuti. It then explained that the rule in compensation is that fungibles are compensated with their like and non-fungibles with their value, moving to value only when a like cannot be had, as al-Izz ibn Abd al-Salam says, and that the value is reckoned on the day of the damage, as Ibn Nujaym and Ibn Hajar al-Haytami say."
  ur: "ایک درزی کے بارے میں سوال جس نے ایک قیمتی کپڑا مقررہ تفصیلات کے لباس کے لیے کاٹنے کو لیا، کاٹتے وقت پیٹرن کی پیمائش میں غلطی کی، اور کپڑا اس طرح خراب ہوا کہ مطلوبہ لباس کے قابل نہ رہا؛ دار الافتاء مصر نے جواب دیا کہ درزی کے ہاتھ میں کاٹنے اور پیمائش کے وقت جو خراب ہو وہ شرعاً اس پر ضامن ہے، اور ضمان کا اصول یہ ہے کہ وہ خراب کیے گئے کپڑے جیسی تفصیلات کا کپڑا دے، اور اگر مثل نہ مل سکے تو خرابی کے دن کی قیمت۔ دار الافتاء نے بیان کیا کہ کسی انسان کو معلوم کام پر اجرت پر لینا بلا اختلاف جائز ہے، اجیرِ خاص جو ایک شخص کے لیے معلوم مدت تک کام کرے اور اجیرِ مشترک جو عام لوگوں سے کام لے، جیسے رنگریز، دھوبی اور درزی، میں فرق کیا، سمرقندی کی تحفۃ الفقہاء اور مجلۃ الاحکام العدلیہ سے دونوں کی تعریف نقل کی، اور فیصلہ کیا کہ چاروں مذاہب کے جمہور فقہا اجیرِ مشترک کو اس کے ہاتھ کے کام سے خراب ہونے والی چیز کا ضامن قرار دیتے ہیں، کیونکہ اس میں کاریگروں اور مالِ تجارت کے مالکوں دونوں کی مصلحت ہے اور اسے چھوڑنے میں لوگوں کے اموال کے ضیاع کا راستہ کھلتا ہے؛ اس نے اس روایت سے استدلال کیا کہ علی بن ابی طالب دھوبیوں اور سناروں کو ضامن قرار دیتے اور کہتے کہ لوگوں کی اصلاح اسی سے ہوتی ہے، اور سغدی، ابن شاس، قاضی عبد الوہاب، خطیب شربینی اور بہوتی سے نقل کیا۔ پھر اس نے بیان کیا کہ ضمان کا اصول یہ ہے کہ مثلی کا ضمان مثل سے اور قیمی کا قیمت سے ہے، اور قیمت کی طرف صرف مثل کے ناممکن ہونے پر جایا جاتا ہے، جیسا کہ عز بن عبد السلام نے کہا، اور قیمت خرابی کے دن کی معتبر ہے، جیسا کہ ابن نجیم اور ابن حجر ہیتمی نے کہا۔"
