id: work/fatwa-amja-istighatha-tawassul
class: work
kind: fatwa
label: { ar: "الاستغاثة بالنبي والتوسل به", en: "Seeking aid through the Prophet and tawassul", ur: "نبی سے استغاثہ اور توسل", es: "Buscar ayuda a través del Profeta y el tawassul", fr: "Demander de l'aide par l'intermédiaire du Prophète et du tawassul" }
summary:
  ar: "سأل سائل عما ورد في سبل الهدى في باب من توسل به. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87059 بتاريخ 4 يوليو 2012)⁩ أن التوسل بالنبي من القضايا الخلافية التي لا ينكر فيها على المخالف وقد نقل الخلاف قدامى ومعاصرون، مميّزًا بين التوسل وهو سؤال الله بجاه النبي أو الصالحين وبين الاستغاثة بالمخلوق، ناقلًا تفصيل محمد بن عبد الوهاب بينهما على ما ورد في النص."
  en: "A questioner cited al-Salihi's Subul al-Huda on those who sought tawassul through him. Dr. Salah al-Sawi (fatwa no. 87059, 4 July 2012) answered that tawassul through the Prophet is among the disputed questions where the dissenter is not censured — the dispute transmitted by early and late scholars — distinguishing tawassul (asking God by the Prophet's or the righteous' standing) from istighatha (seeking aid from a creature), quoting Muhammad ibn Abd al-Wahhab's distinction as the text records. Recorded as AMJA's answer."
  ur: "ایک سائل نے سبل الہدیٰ سے توسل کے باب کا حوالہ دیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87059، 4 جولائی 2012)⁩ نے جواب دیا کہ توسل اختلافی مسئلہ ہے جس میں مخالف پر انکار نہیں؛ توسل اور استغاثہ میں فرق بیان کیا — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un interlocutor citó el Subul al-Huda de al-Salihi sobre quienes buscaban el tawassul a través de él. El Dr. Salah al-Sawi (fatwa n.° 87059, 4 de julio de 2012) respondió que el tawassul a través del Profeta se encuentra entre las cuestiones controvertidas en las que el disidente no es censurado —una controversia transmitida por eruditos antiguos y modernos—, distinguiendo el tawassul (pedir a Dios por la posición del Profeta o de los justos) del istighatha (buscar ayuda de una criatura), citando la distinción de Muhammad ibn Abd al-Wahhab como consta en el texto. Registrado como respuesta de AMJA."
  fr: "Un interlocuteur a cité le Subul al-Huda d'al-Salihi concernant ceux qui sollicitaient le tawassul par son intermédiaire. Le Dr Salah al-Sawi (fatwa n° 87059, 4 juillet 2012) a répondu que le tawassul par l'intermédiaire du Prophète figure parmi les questions controversées où le dissident n'est pas blâmé – une controverse transmise par les savants anciens et modernes – en distinguant le tawassul (demander à Dieu par l'intermédiaire du Prophète ou des pieux) de l'istighatha (solliciter l'aide d'une créature), citant la distinction de Muhammad ibn Abd al-Wahhab telle qu'elle est rapportée dans le texte. Réponse enregistrée par AMJA."
