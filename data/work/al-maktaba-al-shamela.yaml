summary:
  ar: "برنامج حاسوبي مجاني وموقع لتصفح الكتب الإسلامية والتراثية العربية والبحث فيها، صدر إصداره الأول في 1 أبريل 2005، ويضم نحو ثمانية آلاف كتاب محوّلة إلى نصوص يُبحث فيها ويُنسخ منها، مع ربط النصوص بصور الكتب؛ رعاه منذ 1433هـ المكتب التعاوني للدعوة بحي الروضة في الرياض، وصدر على الويب والهواتف ثم على ماك ولينكس سنة 1447هـ."
  en: "A free computer program and website for browsing and searching Islamic and classical Arabic books, first released on 1 April 2005, holding some eight thousand books turned into searchable, copyable text, with links from the text to scans of the books; sponsored from 1433 AH by the cooperative da'wa office of al-Rawda in Riyadh, it came to the web and phones and then, in 1447 AH, to macOS and Linux."
  ur: "اسلامی اور عربی ورثے کی کتابوں کی تلاش اور مطالعے کا مفت کمپیوٹر پروگرام اور ویب سائٹ؛ پہلا اجرا 1 اپریل 2005 کو، تقریباً آٹھ ہزار کتابیں قابلِ تلاش متن میں، متن سے کتابوں کی تصویروں تک ربط؛ 1433ھ سے ریاض کے حی الروضہ کا تعاونی دعوہ دفتر سرپرست، ویب اور فون کے بعد 1447ھ میں میک اور لینکس پر۔"
