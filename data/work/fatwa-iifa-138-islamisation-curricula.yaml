label: { ar: "قرار مجمع الفقه الإسلامي الدولي 138 (15/4) بشأن إسلامية مناهج التعليم ⁦(توصية)⁩", en: "IIFA resolution 138 (15/4) on the Islamisation of educational curricula ⁦(recommendation)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 138 (15/4): نصابِ تعلیم کی اسلامی بنانا ⁦(سفارش)⁩", es: "Resolución 138 (15/4) de la IIFA sobre la islamización de los planes de estudio (recomendación)" }
summary:
  ar: "توصية صادرة عن مجلس مجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. أوصى بأن تركز عملية أسلمة المناهج على صياغة التعليم والتربية بأهدافها ومحتواها وأساليبها وطرائق التقويم في إطار التصور الإسلامي الكلي للإنسان والكون والحياة، بهدف إعداد إنسان صالح ملتزم بقيم دينه قادر على مهمة الاستخلاف وعمارة الأرض؛ وأن تهدف العملية التعليمية إلى غرس القيم الإسلامية في الناشئة وتمكينهم من تمثلها؛ وصياغة المقررات في إطار التصور الإسلامي مع إبراز الرؤية الإسلامية ⁦(عقيدة وشريعة ومنهاج حياة)⁩ في مشمولات المحتوى؛ واستشراف المنهجية الإسلامية في طرائق التعليم. وهو نص توصية لا قرار حكم."
  en: "A recommendation issued by the council of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It recommended that Islamising curricula mean framing education and upbringing — goals, content, methods and assessment — within the comprehensive Islamic conception of man, cosmos and life, to form a good person committed to his religion's values and able to carry the task of stewardship and developing the earth; that the educational process implant Islamic values in the young and enable them to internalise them; that subjects be formulated within the Islamic conception with the Islamic vision (creed, sharia, way of life) brought out in the content; and that Islamic methodology guide teaching methods. A recommendation, not a ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کے مجلس کی سفارش، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ سفارش: نصاب کی اسلامیت کا مطلب ہو کہ تعلیم و تربیت — مقاصد، مواد، اساليب اور جائزہ — اسلام کے جامع تصورِ انسان، کائنات اور زندگی کے دائرے میں تیار ہو تاکہ نیک، اپنے دین کی اقدار کا پابند اور خلافت و عمرانِ ارض کے قابل انسان تیار ہو؛ تعلیمی عمل نئی نسل میں اسلامی اقدار رچائے اور انہیں اپنانے کے قابل بنائے؛ مضامین اسلامی تصور میں ترتیب ہوں اور مواد میں اسلامی نکتۂ نظر ⁦(عقیدہ، شریعت، منہاجِ زندگی)⁩ نمایاں ہو؛ اور تدریس کے طریقوں میں اسلامی منہجیات رہنما ہو۔ یہ سفارش ہے، حکم نہیں۔"
  es: "Recomendación emitida por el consejo de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004). Recomendó que la islamización de los currículos implica enmarcar la educación y la formación —objetivos, contenidos, métodos y evaluación— dentro de la concepción islámica integral del hombre, el cosmos y la vida, para formar una persona íntegra, comprometida con los valores de su religión y capaz de asumir la responsabilidad de administrar y desarrollar la Tierra; que el proceso educativo inculque valores islámicos en los jóvenes y les permita interiorizarlos; que las materias se formulen dentro de la concepción islámica, con la visión islámica (credo, sharia, modo de vida) reflejada en el contenido; y que la metodología islámica guíe los métodos de enseñanza. Recomendación, no dictamen."
