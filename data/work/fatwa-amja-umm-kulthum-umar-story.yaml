label: { ar: "قصة خطبة عمر لأم كلثوم بنت أبي بكر", en: "The story of Umar's proposal to Umm Kulthum bint Abi Bakr", ur: "عمر کا ام کلثوم بنت ابی بکر سے نکاح کی درخواست کی روایت", es: "La historia de la propuesta de matrimonio de Umar a Umm Kulthum bint Abi Bakr", fr: "L'histoire de la demande en mariage d'Umar à Umm Kulthum bint Abi Bakr", tr: "Omar'ın Abi Bakr'ın kızı um Kulthum ile nişan hikayesi.", id: "Kisah pertunangan Omar dengan um Kulthum, putri Abi Bakr." }
summary:
  ar: "سأل سائل عن صحة قصة خطبة عمر بن الخطاب لأم كلثوم بنت أبي بكر كما وردت في رواية. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87037 بتاريخ 29 يونيو 2012)⁩ أن القصة لا تصح لصغر أم كلثوم، فقد ولدت بعد وفاة أبيها وكانت في بطن أمها يوم تولى عمر الخلافة لقول ابن عبد البر في ترجمة حبيبة بنت خارجة وقول أهل النسب، وخلافة عمر عشر سنين فكانت صغيرة فيها إلا إن كان في آخرها على ما فصّل الجواب."
  en: "A questioner asked about the soundness of the story that Umar ibn al-Khattab proposed to Umm Kulthum bint Abi Bakr as one report has it. Dr. Salah al-Sawi (fatwa no. 87037, 29 June 2012) answered that the story is unsound because of her young age — she was born after her father's death and was still in her mother's womb when Umar took the caliphate, per Ibn Abd al-Barr's entry on Habiba bint Kharija and the genealogists; Umar's caliphate lasted ten years and she was a child throughout unless it were at its very end, as detailed. Recorded as AMJA's answer."
  ur: "ایک سائل نے عمر بن خطاب کے ام کلثوم بنت ابی بکر سے نکاح کی درخواست کی روایت کی صحت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87037، 29 جون 2012)⁩ کے مطابق روایت صحیح نہیں کیونکہ وہ اس وقت بچی تھی — ابن عبد البر اور اہل نسب کے قول کے حوالے سے۔"
  es: "Un consultante preguntó sobre la veracidad de la historia que afirma que Umar ibn al-Khattab le propuso matrimonio a Umm Kulthum bint Abi Bakr, según un informe. El Dr. Salah al-Sawi (fatwa n.° 87037, 29 de junio de 2012) respondió que la historia carece de fundamento debido a su corta edad: nació después de la muerte de su padre y aún estaba en el vientre de su madre cuando Umar ascendió al califato, según la entrada de Ibn Abd al-Barr sobre Habiba bint Kharija y los genealogistas; el califato de Umar duró diez años y ella fue una niña durante todo ese tiempo, salvo en sus últimos momentos, como se detalla. Registrada como respuesta de AMJA."
  fr: "Un internaute a interrogé Salah al-Sawi sur la véracité du récit selon lequel Umar ibn al-Khattab aurait demandé la main d'Umm Kulthum bint Abi Bakr. Le Dr Salah al-Sawi (fatwa n° 87037, 29 juin 2012) a répondu que ce récit est invraisemblable en raison du jeune âge d'Umm Kulthum bint Abi Bakr: née après la mort de son père, elle était encore dans le ventre de sa mère lorsqu'Umar accéda au califat, comme l'indique l'article d'Ibn Abd al-Barr sur Habiba bint Kharija et les généalogistes. Le califat d'Umar dura dix ans et Umm Kulthum bint Abi Bakr demeura une enfant durant toute cette période, sauf à la toute fin, comme précisé. Cette réponse est consignée dans la fatwa d'AMJA."
  tr: "Bir rivayette aktarıldığı üzere, Umar ibn al-Khattab'ın Um Kulthum bint Abi Bakr ile nişanlanmasının gerçekliği hakkında soru soruldu. Dr. Salah Al-Sawi, (29 Haziran 2012 tarihli 87037 Fetvası) hikâyenin doğruluğunun Um Kulthum'un gençliği nedeniyle gerçek olmadığını söyledi. İbn Abd al-Barr'ın Habiba bint Kharica biyografisine ve soy halkının görüşüne göre, babasının ölümünden sonra doğdu ve Ömer halifeliği üstlendiğinde annesinin rahmindeydi. Ömer'in halifeliği on yıl sürdü ve gençti, ancak sonunda açıklandı, cevapta açıklandığı gibi."
  id: "Seorang penanya ditanya tentang keaslian kisah pertunangan Umar ibn al-Khattab dengan um Kulthum bint Abi Bakr, sebagaimana dilaporkan dalam sebuah narator. Dr. Salah Al-Sawi menjawab (Fatwa No. 87037 tanggal 29 Juni 2012) bahwa kisah tersebut tidak otentik karena masa muda um Kulthum. Dia lahir setelah kematian ayahnya dan berada dalam rahim ibunya ketika Umar naik tahta kekhalifahan, menurut biografi Ibn Abd al-Barr tentang Habiba bint Kharija dan pendapat orang-orang yang bergaris keturunan. Kekhalifahan Umar berusia sepuluh tahun dan masih muda, kecuali pada akhirnya, seperti yang dijelaskan dalam jawaban."
