label: { ar: "إنشاء مصنع لإنتاج الفحم", en: "Setting up a charcoal factory", ur: "کوئلہ بنانے کا کارخانہ قائم کرنا", es: "Montar una fábrica de carbón vegetal", fr: "Mise en place d'une usine de charbon de bois", tr: "Kömür üretim tesisi kurulması", id: "Pendirian pabrik produksi batu bara" }
summary:
  ar: "سؤال عن إنشاء مصنع لإنتاج أنواع الفحم مع أن الفحم يستخدم لأمور متعددة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في صنع الفحم وبيعه إذا أمكن استعماله استعمالًا مشروعًا، وأن ما خُصص للاستعمال المحرم وحده تحرم صناعته وبيعه. أجابت الدائرة بأنه لا حرج في العمل في صناعة الفحم وتسويقه، لأنه من السلع الطاهرة المنتفع بها، وطبيعته محايدة، فقد يستخدم في المباح كطهو الطعام والتدفئة وإيقاد البخور، وقد يستخدم في المحرم كإشعال الأرجيلة أو طهو طعام محرم، والإثم على من يستعمله استعمالًا محرمًا. وقالت إنه لو تعين نوع من الفحم للاستعمال المحرم فقط ولم يمكن استخدامه في غيره حرم صنعه وبيعه. وخلصت إلى أنه لا حرج في صنع الفحم وبيعه إذا أمكن استعماله استعمالًا مشروعًا كالطهو والتدفئة، وأما ما خُصص للاستعمال المحرم ولم يمكن استعماله في غيره فتحرم صناعته وبيعه."
  en: "A question about setting up a factory to produce charcoal, given that charcoal has many uses, in which Jordan's General Iftaa Department answered that making and selling charcoal is unobjectionable when it can be put to a lawful use, while a type made only for a forbidden use may not be made or sold. The Department answered that there is no objection to working in the making and marketing of charcoal, because it is a pure, useful commodity of neutral nature: it may be used for permitted purposes such as cooking, heating and burning incense, or for forbidden ones such as lighting a water pipe or cooking forbidden food, and the sin lies with whoever uses it in a forbidden way. It said that if a type of charcoal were exclusively for a forbidden use and could not be used otherwise, making and selling it would be forbidden. It concluded that making and selling charcoal is unobjectionable when it can be used lawfully, as for cooking and heating, but that a type assigned only to a forbidden use, with no other possible use, may not be made or sold."
  ur: "کوئلہ بنانے کا کارخانہ قائم کرنے کے بارے میں سوال، جبکہ کوئلہ کئی کاموں میں استعمال ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کوئلہ بنانے اور بیچنے میں حرج نہیں جب اس کا جائز استعمال ممکن ہو، اور جو قسم صرف حرام استعمال کے لیے ہو اس کا بنانا اور بیچنا حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ کوئلہ بنانے اور اس کی مارکیٹنگ کے کام میں حرج نہیں، کیونکہ یہ پاک اور مفید سامان ہے جس کی فطرت غیر جانبدار ہے: یہ کھانا پکانے، گرمائش اور بخور جلانے جیسے جائز کاموں میں بھی استعمال ہوتا ہے اور حقہ جلانے یا حرام کھانا پکانے جیسے حرام کاموں میں بھی، اور گناہ اس پر ہے جو اسے حرام طریقے سے استعمال کرے۔ اس نے کہا کہ اگر کوئلے کی کوئی قسم صرف حرام استعمال کے لیے متعین ہو اور اس کے سوا استعمال ممکن نہ ہو تو اس کا بنانا اور بیچنا حرام ہوگا۔ اس نے نتیجہ نکالا کہ جب کوئلے کا جائز استعمال، جیسے کھانا پکانا اور گرمائش، ممکن ہو تو اسے بنانے اور بیچنے میں حرج نہیں، لیکن جو قسم صرف حرام استعمال کے لیے مخصوص ہو اور اس کا کوئی اور استعمال ممکن نہ ہو اس کا بنانا اور بیچنا حرام ہے۔"
  es: "Ante una pregunta sobre la instalación de una fábrica de carbón vegetal, dado que este tiene múltiples usos, el Departamento General de Iftaa de Jordania respondió que la fabricación y venta de carbón vegetal es lícita cuando puede destinarse a un uso legítimo, mientras que un tipo destinado exclusivamente a un uso prohibido no puede fabricarse ni venderse. El Departamento afirmó que no existe inconveniente alguno en la fabricación y comercialización de carbón vegetal, ya que se trata de un producto puro, útil y de naturaleza neutral: puede utilizarse para fines permitidos, como cocinar, calentar y quemar incienso, o para fines prohibidos, como encender una pipa de agua o cocinar alimentos prohibidos, y el pecado recae sobre quien lo utilice de forma ilícita. Indicó que si un tipo de carbón vegetal se destinara exclusivamente a un uso prohibido y no pudiera utilizarse de otra manera, su fabricación y venta estarían prohibidas. Concluyó que la fabricación y venta de carbón vegetal es lícita cuando puede utilizarse legalmente, como para cocinar y calentar, pero que un tipo destinado únicamente a un uso prohibido, sin ningún otro uso posible, no puede fabricarse ni venderse."
  fr: "Concernant la création d'une usine de production de charbon de bois, compte tenu de ses nombreux usages, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que la fabrication et la vente de charbon de bois sont autorisées lorsqu'il peut être utilisé à des fins licites. En revanche, la fabrication et la vente d'un type de charbon de bois destiné exclusivement à un usage interdit sont prohibées. Le Département a précisé qu'il n'y a pas d'objection à la production et à la commercialisation de charbon de bois, car il s'agit d'un produit pur et utile, de nature neutre: il peut être utilisé à des fins permises, comme la cuisson, le chauffage et la combustion d'encens, ou à des fins illicites, comme l'allumage d'une pipe à eau ou la cuisson d'aliments interdits. Le péché réside dans celui qui l'utilise de manière illicite. Le Département a ajouté que si un type de charbon de bois est exclusivement destiné à un usage illicite et ne peut être utilisé autrement, sa fabrication et sa vente seraient interdites. En conclusion, la fabrication et la vente de charbon de bois sont autorisées lorsqu'il peut être utilisé licitement, notamment pour la cuisson et le chauffage, mais qu'un type de charbon de bois destiné exclusivement à un usage illicite, sans autre utilisation possible, ne peut être ni fabriqué ni vendu."
  tr: "Kömür çeşitli amaçlarla kullanılsa bile çeşitli türde odun kömürü üretmek için bir fabrika kurulmasıyla ilgili bir soruya Ürdün Genel Fetva Dairesi, kömür yasalarına uygun kullanılabiliyorsa kömür yapımının ve satmanın zarar vermediğini, yasak kullanım için belirlenen ürünlerin ise üretilip satılmasının yasak olduğunu yanıtladı. Departman, odun kömürünün saf, faydalı bir mal olduğu ve doğası tarafsız olduğu için üretim ve pazarlanmada zarar olmadığını yanıtladı. Kömür yemek pişirme, ısıtma ve tütsü yakma gibi izin verilen amaçlarda veya nargile yakmak veya yasak yemek pişirmek gibi yasak yerlerde kullanılabilir ve günah yasaklı olarak kullananların üzerindedir. Eğer bir tür odun kömürü sadece yasak kullanım için ayrılmışsa ve başka yerde kullanılamazsa, üretimi ve satışı yasak olarak kabul edilir. Yasak kullanım için belirlenmiş ancak başka yerlerde kullanılamayan kömür üretimi ve satışının zararı olmadığı sonucuna varıldı. Yasak kullanım için belirlenmiş ancak başka yerde kullanılamayan ürünler ise üretimi ve satışı yasaktır."
  id: "Mengenai pendirian pabrik untuk memproduksi berbagai jenis arang meskipun batu bara digunakan untuk berbagai tujuan, Departemen Fatwa Umum Yordania menjawab bahwa tidak ada salahnya membuat dan menjual arang jika dapat digunakan secara sah, dan bahwa apa yang ditetapkan untuk penggunaan terlarang saja dilarang untuk diproduksi dan dijual. Departemen menjawab bahwa tidak ada salahnya bekerja dalam pembuatan dan pemasaran arang karena merupakan komoditas murni yang bermanfaat dan sifatnya netral. Arang dapat digunakan untuk tujuan yang diperbolehkan seperti memasak makanan, pemanasan, dan menyalakan dupa, atau di tempat terlarang seperti menyalakan shisha atau memasak makanan terlarang, dan dosa itu pada mereka yang menggunakannya secara terlarang. Dinyatakan bahwa jika suatu jenis arang hanya ditetapkan untuk penggunaan terlarang dan tidak dapat digunakan di tempat lain, maka pembuatan dan penjualannya dilarang. Pengadilan menyimpulkan bahwa tidak ada bahaya dalam membuat dan menjual arang jika dapat digunakan secara sah seperti untuk memasak dan memanaskan. Adapun apa yang ditetapkan untuk penggunaan terlarang tetapi tidak dapat digunakan di tempat lain, pembuatan dan penjualannya dilarang."
