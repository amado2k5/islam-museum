id: work/fatwa-aliftaa-jo-making-and-selling-charcoal
class: work
kind: fatwa
label: { ar: "إنشاء مصنع لإنتاج الفحم", en: "Setting up a charcoal factory", ur: "کوئلہ بنانے کا کارخانہ قائم کرنا" }
summary:
  ar: "سؤال عن إنشاء مصنع لإنتاج أنواع الفحم مع أن الفحم يستخدم لأمور متعددة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في صنع الفحم وبيعه إذا أمكن استعماله استعمالًا مشروعًا، وأن ما خُصص للاستعمال المحرم وحده تحرم صناعته وبيعه. أجابت الدائرة بأنه لا حرج في العمل في صناعة الفحم وتسويقه، لأنه من السلع الطاهرة المنتفع بها، وطبيعته محايدة، فقد يستخدم في المباح كطهو الطعام والتدفئة وإيقاد البخور، وقد يستخدم في المحرم كإشعال الأرجيلة أو طهو طعام محرم، والإثم على من يستعمله استعمالًا محرمًا. وقالت إنه لو تعين نوع من الفحم للاستعمال المحرم فقط ولم يمكن استخدامه في غيره حرم صنعه وبيعه. وخلصت إلى أنه لا حرج في صنع الفحم وبيعه إذا أمكن استعماله استعمالًا مشروعًا كالطهو والتدفئة، وأما ما خُصص للاستعمال المحرم ولم يمكن استعماله في غيره فتحرم صناعته وبيعه."
  en: "A question about setting up a factory to produce charcoal, given that charcoal has many uses, in which Jordan's General Iftaa Department answered that making and selling charcoal is unobjectionable when it can be put to a lawful use, while a type made only for a forbidden use may not be made or sold. The Department answered that there is no objection to working in the making and marketing of charcoal, because it is a pure, useful commodity of neutral nature: it may be used for permitted purposes such as cooking, heating and burning incense, or for forbidden ones such as lighting a water pipe or cooking forbidden food, and the sin lies with whoever uses it in a forbidden way. It said that if a type of charcoal were exclusively for a forbidden use and could not be used otherwise, making and selling it would be forbidden. It concluded that making and selling charcoal is unobjectionable when it can be used lawfully, as for cooking and heating, but that a type assigned only to a forbidden use, with no other possible use, may not be made or sold."
  ur: "کوئلہ بنانے کا کارخانہ قائم کرنے کے بارے میں سوال، جبکہ کوئلہ کئی کاموں میں استعمال ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کوئلہ بنانے اور بیچنے میں حرج نہیں جب اس کا جائز استعمال ممکن ہو، اور جو قسم صرف حرام استعمال کے لیے ہو اس کا بنانا اور بیچنا حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ کوئلہ بنانے اور اس کی مارکیٹنگ کے کام میں حرج نہیں، کیونکہ یہ پاک اور مفید سامان ہے جس کی فطرت غیر جانبدار ہے: یہ کھانا پکانے، گرمائش اور بخور جلانے جیسے جائز کاموں میں بھی استعمال ہوتا ہے اور حقہ جلانے یا حرام کھانا پکانے جیسے حرام کاموں میں بھی، اور گناہ اس پر ہے جو اسے حرام طریقے سے استعمال کرے۔ اس نے کہا کہ اگر کوئلے کی کوئی قسم صرف حرام استعمال کے لیے متعین ہو اور اس کے سوا استعمال ممکن نہ ہو تو اس کا بنانا اور بیچنا حرام ہوگا۔ اس نے نتیجہ نکالا کہ جب کوئلے کا جائز استعمال، جیسے کھانا پکانا اور گرمائش، ممکن ہو تو اسے بنانے اور بیچنے میں حرج نہیں، لیکن جو قسم صرف حرام استعمال کے لیے مخصوص ہو اور اس کا کوئی اور استعمال ممکن نہ ہو اس کا بنانا اور بیچنا حرام ہے۔"
