label:
  ar: "سيرة رسول الله 2026، الحلقة 29: الدروس المستفادة من نزول سورة \"عبس\""
  en: "The Biography of the Messenger of God 2026, episode 29: Lessons drawn from the revelation of Sura Abasa"
  ur: "سیرتِ رسول اللہ 2026، قسط 29: سورۃ عبس کے نزول سے حاصل ہونے والے اسباق"
  fr: "La biographie du Messager de Dieu 2026, épisode 29 : Les leçons tirées de la révélation de la sourate Abasa"
  es: "La biografía del Mensajero de Dios 2026, episodio 29: Lecciones extraídas de la revelación de la sura Abasa"
summary:
  ar: "يستهل المحاضر حديثه بترجمة الصحابي السابق عبد الله بن جحش من كتاب البدريين، متناولًا سرية نخلة ومقتله في أحد. ثم يتناول مطلع سورة عبس وسبب نزولها، وهو لقاء النبي بالأعمى عبد الله بن أم مكتوم، ويستخلص دروسًا في الموازين الإلهية، والمصدر الإلهي للقرآن، وتكريم الله ونبيه للمؤمنين المتواضعين."
  en: "The lecturer opens with a biography of the early Companion Abdullah ibn Jahsh, from the book on the Badr veterans, covering the expedition to Nakhla and his death at Uhud. He then takes the opening of Surat Abasa and its occasion, the Prophet's encounter with the blind Abdallah ibn Umm Maktum, and draws lessons on divine criteria, the Qur'an's divine origin, and the honour God and the Prophet gave to humble believers."
  ur: "مقرر ابتدائی صحابی عبداللہ بن جحش کے ترجمے سے آغاز کرتے ہیں جو اہلِ بدر کی کتاب سے ہے، اور اس میں سریۂ نخلہ اور احد میں ان کی شہادت کا ذکر ہے۔ پھر وہ سورۃ عبس کے آغاز اور اس کے سببِ نزول کو لیتے ہیں، یعنی نبی کریم کی نابینا عبداللہ بن ام مکتوم سے ملاقات، اور الٰہی معیاروں، قرآن کے الٰہی ماخذ اور اللہ اور نبی کریم کی طرف سے عاجز مومنوں کی تکریم پر اسباق اخذ کرتے ہیں۔"
  fr: "Le conférencier ouvre avec la biographie du compagnon de la première heure Abdallah ibn Jahsh, tirée du livre sur les vétérans de Badr, qui couvre l'expédition de Nakhla et sa mort à Uhud. Il aborde ensuite le début de la sourate Abasa et son occasion, la rencontre du Prophète avec l'aveugle Abdallah ibn Umm Maktum, et en tire des leçons sur les critères divins, l'origine divine du Coran et l'honneur que Dieu et le Prophète ont accordé aux croyants humbles."
  es: "El conferenciante abre con la biografía del compañero temprano Abdallah ibn Jahsh, tomada del libro sobre los veteranos de Badr, que abarca la expedición de Najla y su muerte en Uhud. Luego trata el comienzo de la sura Abasa y su ocasión, el encuentro del Profeta con el ciego Abdallah ibn Umm Maktum, y extrae lecciones sobre los criterios divinos, el origen divino del Corán y el honor que Dios y el Profeta dieron a los creyentes humildes."
