id: work/fatwa-amja-kaffara-order-choice
class: work
kind: fatwa
label: { ar: "خصال كفارة اليمين", en: "Oath expiation — the order of its kinds", ur: "کفارہ قسم — صورتوں کی ترتیب", es: "Expiación del juramento: el orden de sus tipos." }
summary:
  ar: "سأل سائل عن قول إمام أن في كفارة اليمين خيارًا بين الصيام والإطعام وغيرهما. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77194 بتاريخ 21 ديسمبر 2008)⁩ أن خصال الكفارة على التخيير بالنسبة للعتق أو إطعام عشرة مساكين أو كسوتهم، أما الصوم فلا يكون إلا عند العجز عن ذلك، وآية الكفارة واضحة الدلالة على ذلك في سورة المائدة حيث قال لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان فكفارته إطعام عشرة مساكين من أوسط ما تطعمون أهليكم أو كسوتهم أو تحرير رقبة فمن لم يجد فصيام ثلاثة أيام."
  en: "A questioner heard an imam say the oath expiation offers a choice between fasting and feeding among others. Dr. Salah al-Sawi (fatwa no. 77194, 21 December 2008) answered that the choice lies among freeing a slave, feeding ten poor, or clothing them; fasting stands only for inability in those — the expiation verse of al-Ma'ida being clear: 'God does not take you for the careless talk in your oaths, but for what you bound as oaths; its expiation is feeding ten poor of your households' average food, or clothing them, or freeing a slave; whoever finds none, fasting three days'."
  ur: "ایک سائل نے کفارہ قسم میں اختیار پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77194، 21 دسمبر 2008)⁩ کے مطابق تین صورتوں میں اختیار ہے — غلام آزادی، دس مسکین کو کھانا یا کپڑا؛ روزہ صرف عجز کی صورت میں ہے۔"
  es: "Un interlocutor escuchó a un imán decir que la expiación del juramento ofrece la opción de ayunar o alimentar a los pobres, entre otras cosas. El Dr. Salah al-Sawi (fatwa n.º 77194, 21 de diciembre de 2008) respondió que la elección reside entre liberar a un esclavo, alimentar a diez pobres o vestirlos; el ayuno solo representa la imposibilidad de hacerlo, pues el versículo de expiación de al-Ma'ida es claro: «Dios no os castiga por la indiferencia en vuestros juramentos, sino por lo que jurasteis; su expiación consiste en alimentar a diez pobres con el alimento promedio de vuestras familias, o vestirlos, o liberar a un esclavo; quien no encuentre nada, ayunará tres días»."
