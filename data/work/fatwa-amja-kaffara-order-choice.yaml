label: { ar: "خصال كفارة اليمين", en: "Oath expiation — the order of its kinds", ur: "کفارہ قسم — صورتوں کی ترتیب", es: "Expiación del juramento: el orden de sus tipos.", fr: "Expiation du serment — l'ordre de ses sortes", tr: "Yeminin Affının Nitelikleri", id: "Kualitas Ekspitasi Sumpah" }
summary:
  ar: "سأل سائل عن قول إمام أن في كفارة اليمين خيارًا بين الصيام والإطعام وغيرهما. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77194 بتاريخ 21 ديسمبر 2008)⁩ أن خصال الكفارة على التخيير بالنسبة للعتق أو إطعام عشرة مساكين أو كسوتهم، أما الصوم فلا يكون إلا عند العجز عن ذلك، وآية الكفارة واضحة الدلالة على ذلك في سورة المائدة حيث قال لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان فكفارته إطعام عشرة مساكين من أوسط ما تطعمون أهليكم أو كسوتهم أو تحرير رقبة فمن لم يجد فصيام ثلاثة أيام."
  en: "A questioner heard an imam say the oath expiation offers a choice between fasting and feeding among others. Dr. Salah al-Sawi (fatwa no. 77194, 21 December 2008) answered that the choice lies among freeing a slave, feeding ten poor, or clothing them; fasting stands only for inability in those — the expiation verse of al-Ma'ida being clear: 'God does not take you for the careless talk in your oaths, but for what you bound as oaths; its expiation is feeding ten poor of your households' average food, or clothing them, or freeing a slave; whoever finds none, fasting three days'."
  ur: "ایک سائل نے کفارہ قسم میں اختیار پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77194، 21 دسمبر 2008)⁩ کے مطابق تین صورتوں میں اختیار ہے — غلام آزادی، دس مسکین کو کھانا یا کپڑا؛ روزہ صرف عجز کی صورت میں ہے۔"
  es: "Un interlocutor escuchó a un imán decir que la expiación del juramento ofrece la opción de ayunar o alimentar a los pobres, entre otras cosas. El Dr. Salah al-Sawi (fatwa n.º 77194, 21 de diciembre de 2008) respondió que la elección reside entre liberar a un esclavo, alimentar a diez pobres o vestirlos; el ayuno solo representa la imposibilidad de hacerlo, pues el versículo de expiación de al-Ma'ida es claro: «Dios no os castiga por la indiferencia en vuestros juramentos, sino por lo que jurasteis; su expiación consiste en alimentar a diez pobres con el alimento promedio de vuestras familias, o vestirlos, o liberar a un esclavo; quien no encuentre nada, ayunará tres días»."
  fr: "Un auditeur a entendu un imam affirmer que l'expiation d'un serment offre le choix entre le jeûne et l'offrande de nourriture, entre autres. Le Dr Salah al-Sawi (fatwa n° 77194, 21 décembre 2008) a répondu que le choix se porte sur l'affranchissement d'un esclave, la nourriture de dix pauvres ou leur habillement; le jeûne ne s'applique qu'en cas d'impossibilité – le verset d'expiation d'al-Ma'ida étant clair: « Dieu ne vous tient pas rigueur des paroles irréfléchies prononcées lors de vos serments, mais de ce que vous avez juré. L'expiation consiste à nourrir dix pauvres avec la nourriture moyenne de votre famille, ou à les vêtir, ou à affranchir un esclave; celui qui ne trouve personne, qu'il jeûne trois jours. »"
  tr: "Bir imamın, yemin için kefaretin oruç, beslenme ve diğerleri arasında seçim yapmayı gerektirdiği sözü hakkında soru soruldu. Dr. Salah Al-Sawy (21 Aralık 2008 tarihli 77194 sayılı fetva) kefaret niteliklerinin kendini özgürleştirmek ya da on fakir kişiyi beslemek ya da giydirmek seçimi olduğunu yanıtladı. Oruç ancak bunu yapamayınca gerçekleşir. Kefaret ayeti bunu açıkça Medye Suresi'nde gösterir; burada şöyle demiştir: 'Allah yeminlerinizde boşa olmaktan sizi sorumlu tutmaz, ancak yeminlerinizden sorumlu tutar. Onun kefareti, ailenize verdiğiniz ortalama miktardan on fakir insanı beslemek, giydirmek ya da bir köleyi serbest bırakmaktır. Birini bulamazsa, üç gün oruç tutar.'"
  id: "Seorang penanya ditanya tentang pernyataan seorang Imam bahwa penebusan atas sumpah melibatkan pilihan antara berpuasa, memberi makan, dan lainnya. Dr. Salah Al-Sawy menjawab (Fatwa No. 77194 tanggal 21 Desember 2008) bahwa kualitas penebusan adalah pilihan membebaskan diri atau memberi makan atau memberi pakaian kepada sepuluh orang miskin. Sedangkan puasa, itu hanya terjadi ketika seseorang tidak mampu melakukannya. Ayat penebusan dengan jelas menunjukkan hal ini dalam Surah Al-Ma'idah, di mana ia berkata: 'Allah tidak menuntut pertanggungjawaban atas kesia-siaan dalam sumpahmu, tetapi Dia menuntut pertanggungjawaban atas apa yang telah kamu sumpahkan. Penebusan-Nya adalah memberi makan sepuluh orang miskin dari rata-rata apa yang kamu beri makan keluargamu, atau pakaikan pakaian, atau membebaskan seorang budak. Siapa yang tidak menemukannya, maka berpuasa selama tiga hari.'"
