id: work/fatwa-aliftaa-jo-fasting-fidya-paid-to-a-poor-granddaughter
class: work
kind: fatwa
label: { ar: "دفع فدية الإفطار لابنة الابن الفقيرة", en: "Paying fasting compensation (fidya) to a poor granddaughter", ur: "روزے کا فدیہ غریب پوتی کو دینا", es: "Pagar la compensación por ayuno (fidya) a una nieta pobre", fr: "Versement d'une compensation pour le jeûne (fidya) à une petite-fille pauvre", tr: "Zavallı oğlun kızı için fidye ödemek", id: "Membayar tebusan untuk putri anak miskin" }
summary:
  ar: "سؤال عن دفع فدية الإفطار لابنة الابن الفقيرة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إن كانت فقيرة غير مكفية بنفقة من تجب عليهم نفقتها. أجابت الدائرة بأنه يجوز للمرأة أن تدفع فدية إفطارها عن شهر رمضان لابنة ابنها. واشترطت لذلك أن تكون البنت فقيرة، وألا تكون مكفية بنفقة من تجب عليهم نفقتها."
  en: "A question about paying fasting compensation (fidya) to a poor granddaughter, in which Jordan's General Iftaa Department answered that it is permitted if she is poor and not already provided for by those obliged to maintain her. The Department answered that a woman may pay her fidya for the Ramadan fasts she did not keep to her son's daughter. It set as conditions that the girl be poor and not already provided for by those who are obliged to maintain her."
  ur: "روزے کا فدیہ غریب پوتی کو دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے اگر وہ غریب ہو اور جن پر اس کا نفقہ واجب ہے ان کے نفقے سے اس کی کفایت نہ ہوتی ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ عورت رمضان کے چھوڑے ہوئے روزوں کا فدیہ اپنے بیٹے کی بیٹی کو دے سکتی ہے۔ اس نے شرط یہ رکھی کہ لڑکی غریب ہو اور جن پر اس کا نفقہ واجب ہے ان کے نفقے سے اس کی کفایت نہ ہوتی ہو۔"
  es: "Una pregunta sobre el pago de la compensación por el ayuno (fidya) a una nieta pobre, a la que el Departamento General de Iftaa de Jordania respondió que está permitido si es pobre y no está ya cubierta por quienes tienen la obligación de mantenerla. El Departamento explicó que una mujer puede pagar la fidya por los ayunos de Ramadán que no realizó a la hija de su hijo. Estableció como condiciones que la niña sea pobre y no esté ya cubierta por quienes tienen la obligación de mantenerla."
  fr: "Concernant le versement d'une compensation pour le jeûne (fidya) à une petite-fille pauvre, le Département général de la Iftaa en Jordanie a répondu que cela est permis si elle est indigente et n'est pas déjà prise en charge par ses tuteurs légaux. Le Département a précisé qu'une femme peut verser à la fille de son fils la fidya correspondant aux jours de jeûne du Ramadan qu'elle n'a pas respectés. Les conditions requises sont que la jeune fille soit pauvre et ne soit pas déjà prise en charge par ses tuteurs légaux."
  tr: "Fakir bir oğlun kızı için oruç bozmak için fidya ödenmesiyle ilgili bir soru, Ürdün Genel Fetva Dairesi, fakir olması durumunda bunun caiz olduğunu ve kendisine bakmakla yükümlü olanların geçimini sağlayacak kadar olmadığını yanıtladı. Daire, bir kadının oğlunun kızına Ramazan ayı için iftar fidyasını ödemesinin caiz olduğunu belirtti. Kızın fakir olması ve kendisine bakmakla yükümlü olanların geçimini karşılamaya yetmeyeceğini belirtti."
  id: "Sebuah pertanyaan tentang membayar fidya untuk berbuka puasa bagi putri putra miskin, di mana Departemen Fatwa Umum Yordania menjawab bahwa diperbolehkan jika dia miskin dan tidak cukup untuk memenuhi kebutuhan mereka yang wajib menafkahinya. Departemen menjawab bahwa diperbolehkan bagi seorang wanita untuk membayar iftar fidya selama bulan Ramadan kepada putri putranya. Departemen tersebut menetapkan bahwa putri tersebut harus miskin dan tidak cukup untuk membayar nafkah bagi mereka yang wajib menafkahinya."
