id: work/fatwa-aliftaa-jo-fasting-fidya-paid-to-a-poor-granddaughter
class: work
kind: fatwa
label: { ar: "دفع فدية الإفطار لابنة الابن الفقيرة", en: "Paying fasting compensation (fidya) to a poor granddaughter", ur: "روزے کا فدیہ غریب پوتی کو دینا" }
summary:
  ar: "سؤال عن دفع فدية الإفطار لابنة الابن الفقيرة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز إن كانت فقيرة غير مكفية بنفقة من تجب عليهم نفقتها. أجابت الدائرة بأنه يجوز للمرأة أن تدفع فدية إفطارها عن شهر رمضان لابنة ابنها. واشترطت لذلك أن تكون البنت فقيرة، وألا تكون مكفية بنفقة من تجب عليهم نفقتها."
  en: "A question about paying fasting compensation (fidya) to a poor granddaughter, in which Jordan's General Iftaa Department answered that it is permitted if she is poor and not already provided for by those obliged to maintain her. The Department answered that a woman may pay her fidya for the Ramadan fasts she did not keep to her son's daughter. It set as conditions that the girl be poor and not already provided for by those who are obliged to maintain her."
  ur: "روزے کا فدیہ غریب پوتی کو دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے اگر وہ غریب ہو اور جن پر اس کا نفقہ واجب ہے ان کے نفقے سے اس کی کفایت نہ ہوتی ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ عورت رمضان کے چھوڑے ہوئے روزوں کا فدیہ اپنے بیٹے کی بیٹی کو دے سکتی ہے۔ اس نے شرط یہ رکھی کہ لڑکی غریب ہو اور جن پر اس کا نفقہ واجب ہے ان کے نفقے سے اس کی کفایت نہ ہوتی ہو۔"
