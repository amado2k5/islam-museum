summary:
  ar: "مختصر لكتاب «الصواعق المرسلة» لابن القيم، صنعه شمس الدين محمد بن الموصلي ⁦(ت 774هـ)⁩، وهو أقدم مختصرَي الكتاب وأشهرهما، وتعظم أهميته لأنه حفظ اختصار الجزء المفقود من الأصل؛ وقد طبع مراراً، منها طبعة الحسن بن عبد الرحمن العلوي في أربعة مجلدات ⁦(أضواء السلف، الرياض، 1425هـ/2004م)⁩."
  en: "An abridgement of Ibn al-Qayyim's al-Sawa'iq al-Mursala by Shams al-Din Muhammad Ibn al-Mawsili (d. 774 AH), the older and better known of the book's two abridgements, important because it preserves an abridgement of the part of the original now lost; it has been printed several times, among them by al-Hasan ibn Abd al-Rahman al-Alawi in four volumes (Adwa' al-Salaf, Riyadh, 1425 AH / 2004)."
