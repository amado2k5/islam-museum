summary:
  ar: "مختصر لكتاب «الصواعق المرسلة» لابن القيم، صنعه شمس الدين محمد بن الموصلي ⁦(ت 774هـ)⁩، وهو أقدم مختصرَي الكتاب وأشهرهما، وتعظم أهميته لأنه حفظ اختصار الجزء المفقود من الأصل؛ وقد طبع مراراً، منها طبعة الحسن بن عبد الرحمن العلوي في أربعة مجلدات ⁦(أضواء السلف، الرياض، 1425هـ/2004م)⁩."
  en: "An abridgement of Ibn al-Qayyim's al-Sawa'iq al-Mursala by Shams al-Din Muhammad Ibn al-Mawsili (d. 774 AH), the older and better known of the book's two abridgements, important because it preserves an abridgement of the part of the original now lost; it has been printed several times, among them by al-Hasan ibn Abd al-Rahman al-Alawi in four volumes (Adwa' al-Salaf, Riyadh, 1425 AH / 2004)."
  es: "Shams al-Din Muhammad Ibn al-Mawsili (fallecido en 774 AH), autor de al-Sawa'iq al-Mursala de Ibn al-Qayyim, es el más antiguo y conocido de los dos abreviamientos del libro, importante porque conserva una parte del original que se ha perdido; ha sido impreso varias veces, entre ellas por al-Hasan ibn Abd al-Rahman al-Alawi en cuatro volúmenes (Adwa' al-Salaf, Riad, 1425 AH / 2004)."
  fr: "Un abrégé de l'ouvrage d'Ibn al-Qayyim, al-Sawa'iq al-Mursala, par Shams al-Din Muhammad Ibn al-Mawsili (mort en 774 AH), le plus ancien et le plus connu des deux abrégés du livre, important car il conserve un abrégé de la partie de l'original aujourd'hui perdue; il a été imprimé à plusieurs reprises, notamment par al-Hasan ibn Abd al-Rahman al-Alawi en quatre volumes (Adwa' al-Salaf, Riyad, 1425 AH / 2004)."
  ur: "شمس الدین محمد ابن الموسیلی ⁦(متوفی 774ھ)⁩ کی ابن القیم کی السوائق المرسلا کا ایک اختصار، جو کتاب کے دو اختصار میں سے پرانا اور زیادہ جانا جاتا ہے، اس لیے اہم ہے کہ اس میں اصل کے اب گم شدہ حصے کا ایک اختصار محفوظ ہے۔ اسے کئی بار طبع کیا گیا ہے، ان میں سے الحسن بن عبدالرحمٰن العلوی نے چار جلدوں میں ⁦(عدوی الصلف، ریاض، 1425ھ / 2004)⁩۔"
  tr: "İbn el-Kayyim'in \"El-Saveiğ el-Mursala\" adlı kitabının kısaltması, Şemseddin Muhammed bin Mevsili (ö. 774 H.) tarafından derlenmiştir. Kitabın en eski ve en ünlü kısaltmasıdır ve önemi büyüktür çünkü orijinalin eksik kısmının kısaltmasını korumuştur; birçok kez basılmıştır; bunlar arasında el-Hasan ibn Abdurrahman el-Alavi'nin dört ciltlik baskısı da vardır (Adwa'al-Salaf, Riyad, 1425 Hicri / 2004 M.S."
  id: "Ringkasan dari buku \"Al-Sawa'iq al-Mursala\" oleh Ibn al-Qayyim, disusun oleh Shams al-Din Muhammad ibn al-Mawsili (wafat 774 H). Ini adalah ringkasan tertua dan paling terkenal dari kitab ini, dan pentingnya besar karena mempertahankan ringkasan bagian asli yang hilang; telah dicetak beberapa kali, termasuk edisi oleh al-Hasan ibn Abd al-Rahman al-Alawi dalam empat jilid (Adwa' al-Salaf, Riyadh, 1425 AH / 2004 M)."
