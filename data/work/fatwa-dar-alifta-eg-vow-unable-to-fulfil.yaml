label: { ar: "كفارة النذر لمن عجز عن الوفاء به", en: "The expiation of a vow for one unable to fulfil it", ur: "نذر پوری نہ کر سکنے والے کے لیے کفارہ", es: "La expiación de un voto para quien no puede cumplirlo." }
summary:
  ar: "سائل سأل عن كفارة النذر لمن عجز عن الوفاء به. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22536)⁩ أن الواجب على المسلم الوفاء بالنذر كما هو ما دام مستطيعًا، فإن لم يستطع لعجز مرجو الزوال فلا تلزمه كفارة في الحال، وبيّن الجواب متى تجب الكفارة وما هي."
  en: "A questioner asked about the expiation of a vow for one unable to fulfil it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22536) answered that a Muslim must fulfil the vow as it stands so long as he is able; if he cannot for a disability expected to lift, no expiation is due for the present — and the answer sets out when expiation becomes obligatory and what it is."
  ur: "ایک سائل نے اس شخص کے لیے نذر کے کفارے کے بارے میں پوچھا جو اسے پوری نہیں کر سکتا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22536)⁩ نے جواب دیا کہ مسلمان پر نذر ویسے ہی پوری کرنا واجب ہے جب تک اسے ہوسکے؛ اگر ایسی عاجزی ہو جس کے ختم ہونے کی امید ہو تو فی الحال کفارہ لازم نہیں — جواب میں یہ بیان ہوا کہ کفارہ کب واجب ہوتا ہے اور کیا ہے۔"
  es: "Un consultante preguntó sobre la expiación de un voto para quien no puede cumplirlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22536) respondió que un musulmán debe cumplir el voto tal como está formulado mientras pueda; si no puede hacerlo debido a una discapacidad que se espera que desaparezca, no se requiere expiación por el momento. La respuesta también detalla cuándo se vuelve obligatoria la expiación y en qué consiste."
