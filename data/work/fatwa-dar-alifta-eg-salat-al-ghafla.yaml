summary:
  ar: "سائل سأل عن صلاة الغفلة وكيفيتها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21970)⁩ أنها من صلوات النوافل المستحبة شرعًا ووقتها بين صلاتي المغرب والعشاء وسميت بذلك لأن الناس يغفلون عنها، على ما فصّل الجواب من صفتها."
  en: "A questioner asked about the 'prayer of heedlessness' (salat al-ghafla) and its manner. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21970) answered that it is among the recommended voluntary prayers, timed between sunset and evening prayers, named so because people neglect it — with its description as the answer details."
  ur: "ایک سائل نے نمازِ غفلہ اور اس کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21970)⁩ نے جواب دیا کہ یہ مستحب نوافل میں ہے اور اس کا وقت مغرب اور عشاء کے درمیان ہے؛ اس کا نام اس لیے پڑا کہ لوگ اس سے غافل رہتے ہیں — جواب میں اس کی صفت بیان ہوئی۔"
  es: "Un interlocutor preguntó sobre la \"oración de la negligencia\" (salat al-ghafla) y su forma de realizarla. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21970) respondió que se encuentra entre las oraciones voluntarias recomendadas, que se realizan entre la puesta del sol y la oración vespertina, y que recibe ese nombre porque la gente la descuida; su descripción se detalla en la respuesta."
