id: work/fatwa-amja-qunut-for-epidemics
class: work
kind: fatwa
label: { ar: "القنوت للأوبئة", en: "Is qunut legislated for epidemics — the schools weighed", ur: "وبا پر قنوت — مذاہب", es: "¿Está legislado el uso de qunut para las epidemias? — las escuelas sopesaron" }
summary:
  ar: "سأل سائل عن جواز القنوت للأوبئة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87737 بتاريخ 25 مارس 2020)⁩ أن أكثر الفقهاء على مشروعية القنوت للنوازل لدفع الأذى ورفع البلاء وذهب الحنفية والشافعية وبعض الحنابلة إلى أن الطاعون مما يقنت له على ما فصّل الجواب من مواضع القنوت وكيفيته."
  en: "A questioner asked whether qunut is lawful for epidemics. AMJA's fatwa committee (fatwa no. 87737, 25 March 2020) answered that most jurists hold the qunut of calamities legislated to repel harm and lift affliction, and the Hanafis, Shafi'is and some Hanbalis hold plague among what qunut is made for — the answer detailing its places and manner."
  ur: "وبا پر قنوت؟ لجنة الفتوى ⁦(فتویٰ 87737، 25 مارچ 2020)⁩ کے مطابق اکثر فقہا نوازل قنوت کو مشروع مانتے ہیں؛ حنفی شافعی بعض حنابلی طاعون پر قنوت مانتے ہیں۔"
  es: "Un consultante preguntó si el qunut es lícito para las epidemias. El comité de fatwas de AMJA (fatwa n.° 87737, 25 de marzo de 2020) respondió que la mayoría de los juristas consideran que el qunut de las calamidades fue legislado para repeler el daño y aliviar la aflicción, y los hanafíes, shafi'ís y algunos hanbalíes incluyen la peste entre los usos para los que se utiliza el qunut; la respuesta detalla sus lugares y modo de aplicación."
