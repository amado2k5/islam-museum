summary:
  ar: "سائل سأل عن صيغة ⁦(الحمد لله حتى يبلغ الحمد منتهاه)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20852)⁩ أن هذه الصيغة جائزة شرعًا فهي صيغة يراد بها المبالغة في حمد الله على ما فصّل الجواب."
  en: "A questioner asked about the formula 'Praise be to God until praise reaches its utmost.' Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20852) answered that the formula is lawful — intended to magnify God's praise — as the answer details."
  ur: "ایک سائل نے ⁦(الحمد لله حتی یبلغ الحمد منتہاہ)⁩ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20852)⁩ نے جواب دیا کہ یہ صیغہ جائز ہے جس سے اللہ کی حمد میں مبالغہ مراد ہے — جیسا کہ جواب میں تفصیل ہے۔"
