id: work/fatwa-amja-intrusive-thoughts-atheism
class: work
kind: fatwa
label: { ar: "أفكار قهرية توحي بالكفر", en: "Intrusive thoughts whispering disbelief", ur: "کفر کے قہری خیالات" }
summary:
  ar: "سأل سائل عن أفكار تأتي برأسه لا يستطيع دفعها تشعره بأنه ملحد وتؤدي إلى قناعة عقلية بأن الإنسان مسيّر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86920 بتاريخ 29 مايو 2012)⁩ أنه قد أجاب على نفسه إجمالًا بأن الله لا يظلم الناس شيئًا وهي حقيقة أعظم من كل الوساوس تضافر عليها العقل والنقل والفطرة، وأن الله لا يحاسب الناس بمقتضى سابق علمه بل بما ظهر من أعمالهم وقد زودهم بأدوات التكليف وأرسل الرسل مبشرين ومنذرين ولا يعذب إلا بعد قيام الحجة، وألا يبتئس من توارد الخواطر فقد كان مثلها يمر على بعض الصحابة."
  en: "A questioner described intrusive thoughts he cannot repel, making him feel he is an unbeliever and driving toward a conviction that man is compelled. Dr. Salah al-Sawi (fatwa no. 86920, 29 May 2012) answered that he had already given himself the gist: God wrongs people in nothing — a truth above every whisper, attested by reason, revelation and nature; God does not judge by His prior knowledge but by deeds that come forth, having given His servants the instruments of responsibility and sent messengers with tidings and warnings; none is punished before the proof stands; and he should not despair at such passing thoughts, for their like passed over some Companions too."
  ur: "ایک سائل نے کفر کے وہ خیالات بیان کیے جو اسے دفع نہیں ہو سکتے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86920، 29 مئی 2012)⁩ کے مطابق اللہ کسی پر ظلم نہیں کرتا اور اعمال سے ہی حساب ہوتا ہے؛ ایسے خیالات بعض صحابہ پر بھی آتے تھے — فکر نہ کرے۔"
