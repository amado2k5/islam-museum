id: work/fatwa-amja-intrusive-thoughts-atheism
class: work
kind: fatwa
label: { ar: "أفكار قهرية توحي بالكفر", en: "Intrusive thoughts whispering disbelief", ur: "کفر کے قہری خیالات", es: "Pensamientos intrusivos que susurran incredulidad", fr: "Des pensées intrusives murmurent l'incrédulité", tr: "İnançsızlığı çağrıştıran zorlayıcı düşünceler", id: "Pikiran kompulsif yang menunjukkan ketidakpercayaan" }
summary:
  ar: "سأل سائل عن أفكار تأتي برأسه لا يستطيع دفعها تشعره بأنه ملحد وتؤدي إلى قناعة عقلية بأن الإنسان مسيّر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86920 بتاريخ 29 مايو 2012)⁩ أنه قد أجاب على نفسه إجمالًا بأن الله لا يظلم الناس شيئًا وهي حقيقة أعظم من كل الوساوس تضافر عليها العقل والنقل والفطرة، وأن الله لا يحاسب الناس بمقتضى سابق علمه بل بما ظهر من أعمالهم وقد زودهم بأدوات التكليف وأرسل الرسل مبشرين ومنذرين ولا يعذب إلا بعد قيام الحجة، وألا يبتئس من توارد الخواطر فقد كان مثلها يمر على بعض الصحابة."
  en: "A questioner described intrusive thoughts he cannot repel, making him feel he is an unbeliever and driving toward a conviction that man is compelled. Dr. Salah al-Sawi (fatwa no. 86920, 29 May 2012) answered that he had already given himself the gist: God wrongs people in nothing — a truth above every whisper, attested by reason, revelation and nature; God does not judge by His prior knowledge but by deeds that come forth, having given His servants the instruments of responsibility and sent messengers with tidings and warnings; none is punished before the proof stands; and he should not despair at such passing thoughts, for their like passed over some Companions too."
  ur: "ایک سائل نے کفر کے وہ خیالات بیان کیے جو اسے دفع نہیں ہو سکتے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86920، 29 مئی 2012)⁩ کے مطابق اللہ کسی پر ظلم نہیں کرتا اور اعمال سے ہی حساب ہوتا ہے؛ ایسے خیالات بعض صحابہ پر بھی آتے تھے — فکر نہ کرے۔"
  es: "Un consultante describió pensamientos intrusivos que no podía repeler, lo que le hacía sentir que era un incrédulo y lo convencía de que el hombre está obligado a creer. El Dr. Salah al-Sawi (fatwa n.° 86920, 29 de mayo de 2012) respondió que ya había comprendido la esencia: Dios no perjudica a las personas en nada, una verdad que trasciende todo susurro, atestiguada por la razón, la revelación y la naturaleza; Dios no juzga por su conocimiento previo, sino por los hechos que se manifiestan, habiendo dado a sus siervos los instrumentos de responsabilidad y enviado mensajeros con noticias y advertencias; nadie es castigado antes de que se demuestre; y no debe desesperarse ante tales pensamientos pasajeros, pues otros Compañeros también los tuvieron."
  fr: "Un homme, en quête de réponses, a décrit des pensées intrusives qu'il ne parvient pas à repousser, le faisant se sentir incroyant et le poussant vers la conviction que l'homme est contraint. Le Dr Salah al-Sawi (fatwa n° 86920, 29 mai 2012) a répondu qu'il en avait déjà saisi l'essentiel: Dieu ne fait de tort à personne – une vérité qui surpasse toute rumeur, attestée par la raison, la révélation et la nature; Dieu ne juge pas selon Sa science préalable, mais selon les actes accomplis, ayant donné à Ses serviteurs les moyens d'agir et envoyé des messagers porteurs de nouvelles et d'avertissements; nul n'est puni avant que la preuve ne soit établie; et il ne faut pas désespérer de telles pensées passagères, car des pensées semblables ont également traversé l'esprit de certains Compagnons."
  tr: "Aklına gelen ve onları itemediği düşünceler hakkında bir soru soran kişiye sormuştur; bu da kendini ateist gibi hissetmesine ve kişinin doğru yolda olduğuna dair mantıklı bir inanca yol açmasına yol açmıştır. Dr. Salah Al-Sawy (29 Mayıs 2012 tarihli Fetva No. 86920) genellikle kendisinin de Tanrı'nın insanlara asla kötülük etmediğini, bunun akıl, gelenek ve doğuştan gelen doğanın birleşimiyle birleşen tüm şüphelerden daha büyük bir gerçek olduğunu yanıtladığını yanıtladı. İnsanları önceki bilgisine göre değil, yaptıklarına göre hesap verir; onlara sorumluluk araçlarını sağlamış, haberci ve uyarıcı olarak elçi göndermiş ve ancak kanıt ortaya konduktan sonra cezalandırılır. Düşünce alışverişinden umutsuzluğa kapılmamalıdır, çünkü benzer düşünceler bazı Sahabeler aracılığıyla geçmiştir."
  id: "Ia menanyakan kepada penanya tentang pikiran yang muncul di benaknya dan ia tidak bisa menolaknya, membuatnya merasa seperti seorang ateis dan membawa pada keyakinan rasional bahwa seseorang berada di jalan yang benar. Dr. Salah Al-Sawy menjawab (Fatwa No. 86920 tanggal 29 Mei 2012) bahwa ia umumnya telah menjawab sendiri bahwa Tuhan sama sekali tidak menyakiti orang, yang merupakan kebenaran yang lebih besar daripada semua keraguan yang digabungkan oleh akal, tradisi, dan sifat bawaan. Ia tidak menuntut pertanggungjawaban orang berdasarkan pengetahuan sebelumnya, melainkan berdasarkan apa yang telah mereka lakukan, dengan menyediakan alat tanggung jawab, mengirim utusan sebagai pembawa kabar baik dan peringatan, dan tidak dihukum kecuali setelah bukti dibuktikan. Ia tidak boleh putus asa atas pertukaran pemikiran, karena pikiran serupa telah melewati beberapa Sahabat."
