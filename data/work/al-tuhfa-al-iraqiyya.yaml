structure: "Opening on the works of the heart and the three degrees of people (pp. 5–9); the meeting of reward and punishment in one person against the Wa'idiyya (pp. 7–9); innovation, truthfulness and sincerity (pp. 9–17); inner works as the root of religion (pp. 16–18); reliance (tawakkul) and the error of calling it a station of the common people (pp. 18–27); the cosmic and religious senses of words, will and decree (pp. 27–29); the three kinds of people who have marvels (pp. 29–32); worship and seeking help (pp. 32–37); contentment, patience and praise (pp. 37–47); love of God and His Messenger, sincerity and the two kinds of tawhid (pp. 48–61); fear and hope (pp. 61–64); love and the Jahmiyya's denial of it (pp. 64–75); the lawful and innovated audition (sama') (pp. 75–81); love entails following the Messenger (p. 81ff.)."
