summary:
  ar: "رسالة لابن تيمية (ت 728هـ) في أعمال القلوب التي تسمى المقامات والأحوال، كالمحبة والتوكل والإخلاص والشكر والصبر والخوف والرجاء والرضا، يقرر فيها أنها واجبة على جميع الخلق وأن الناس فيها ظالم لنفسه ومقتصد وسابق بالخيرات؛ وهي أول المجلد العاشر من مجموع الفتاوى (ص 5–90)."
  en: "A treatise by Ibn Taymiyya (d. 728 AH) on the works of the heart that are called 'stations and states' – love, reliance, sincerity, gratitude, patience, fear, hope and contentment – holding that they are obligatory on all people and that people stand in them as those who wrong themselves, those who keep the middle way and those who race ahead in good deeds; it opens volume 10 of Majmu' al-Fatawa (pp. 5–90)."
