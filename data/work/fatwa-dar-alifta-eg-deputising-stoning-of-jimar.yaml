id: work/fatwa-dar-alifta-eg-deputising-stoning-of-jimar
class: work
kind: fatwa
label: { ar: "حكم التوكيل في رمي الجمرات في الحج", en: "Deputising another for the stoning at the jamarat", ur: "جمرات کی رمی کے لیے وکالت" }
summary:
  ar: "سائل سأل عن التوكيل في رمي الجمار. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20820)⁩ أن التوكيل في رمي الجمار بالنسبة لكبار السن والمرضى والنساء جائز شرعًا ودليله أنه تجوز الاستنابة في الحج على ما فصّل الجواب."
  en: "A questioner asked about deputising another for the stoning at the jamarat. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20820) answered that deputising for the stoning is lawful for the elderly, the sick and women, since delegation in Hajj itself is permitted — as the answer details."
  ur: "ایک سائل نے جمرات کی رمی کے لیے وکالت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20820)⁩ نے جواب دیا کہ بزرگوں مریضوں اور عورتوں کے لیے وکالت جائز ہے کیونکہ حج میں استنابت جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
