id: work/fatwa-dar-alifta-eg-employee-trading-company-goods
class: work
kind: fatwa
label: { ar: "حكم الأخذ من أموال الشركة واستثمارها دون علم أصحابها", en: "Taking company money and investing it without the owners' knowledge", ur: "مالکان کی اجازت کے بغیر کمپنی کا مال لے کر سرمایہ کاری", es: "Tomar dinero de la empresa e invertirlo sin el conocimiento de los propietarios.", fr: "Prendre l'argent de l'entreprise et l'investir à l'insu des propriétaires." }
summary:
  ar: "موظف تربح من بيع سلع ومستلزمات مملوكة للشركة دون إذن أصحابها فسأل عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21686)⁩ أنه لا يجوز التربح من بيع السلع المملوكة للشركة دون إذن أصحابها فالموظف وكيل عن الشركة ولا يجوز له التصرف في مالها بما يخالف وكالته على ما فصّل الجواب."
  en: "An employee profited by selling goods and supplies belonging to the company without its owners' permission and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21686) answered that profiting from selling company-owned goods without the owners' consent is not permitted — the employee is the company's agent and may not dispose of its property against his mandate — as the answer details."
  ur: "ایک ملازم نے مالکان کی اجازت کے بغیر کمپنی کا سامان بیچ کر منافع کمایا اور حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21686)⁩ نے جواب دیا کہ مالکان کی اجازت کے بغیر ایسا جائز نہیں کیونکہ ملازم کمپنی کا وکیل ہے اور وکالت کے خلاف تصرف نہیں کر سکتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un empleado obtuvo beneficios vendiendo bienes y suministros pertenecientes a la empresa sin el permiso de sus propietarios y solicitó una resolución judicial. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21686) respondió que obtener beneficios de la venta de bienes propiedad de la empresa sin el consentimiento de los propietarios no está permitido, ya que el empleado es agente de la empresa y no puede disponer de sus bienes en contra de su mandato, como se detalla en la respuesta."
  fr: "Un employé a tiré profit de la vente de biens et de fournitures appartenant à l'entreprise sans l'autorisation de ses propriétaires et a demandé un avis juridique. La Cour suprême égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21686) a répondu que tirer profit de la vente de biens appartenant à l'entreprise sans le consentement des propriétaires n'est pas autorisé – l'employé étant un mandataire de l'entreprise, il ne peut disposer de ses biens à l'encontre de son mandat – comme le précise la réponse."
