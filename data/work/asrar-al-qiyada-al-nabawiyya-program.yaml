id: work/asrar-al-qiyada-al-nabawiyya-program
class: work
kind: lecture-series
label:
  ar: "أسرار القيادة النبوية ⁦(برنامج تلفزيوني)⁩"
  en: "Asrar al-Qiyada al-Nabawiyya, Secrets of Prophetic Leadership (television programme)"
  ur: "أسرار القيادة النبوية: نبوی قیادت کے راز ⁦(ٹیلی وژن پروگرام)⁩"
summary:
  ar: "برنامج تلفزيوني لطارق السويدان على قناة الرسالة في ثلاثين حلقة، يحفظها أرشيف أسابيل كلها، يعرض فيه علم القيادة الحديث على هيئة نماذج صاغها بنفسه، ثم يستشهد لكل نموذج بمواقف من السيرة النبوية: فهم القيادة، والقائد السيئ وأنواع الأتباع، واستكشاف القادة، والتربية القيادية، وأدوار القائد الثمانية والتدريب عليها، والقيادة التخصصية، والبيئة المحفزة للقيادة."
  en: "A thirty-episode television programme by Tareq al-Suwaidan on al-Risala channel, all thirty kept in the Assabile archive, in which he sets out modern leadership science as a series of models of his own design and illustrates each model from the Prophet's life: understanding leadership, the bad leader and the kinds of followers, discovering leaders, leadership upbringing, the leader's eight roles and training in them, specialised leadership, and the environment that fosters leaders."
  ur: "طارق السویدان کا قناۃ الرسالہ پر تیس اقساط کا ٹیلی وژن پروگرام، جس کی تمام تیس اقساط اسابیل آرکائیو میں محفوظ ہیں؛ اس میں وہ جدید علمِ قیادت کو اپنے وضع کردہ نمونوں ⁦(ماڈلز)⁩ کی صورت میں پیش کرتے ہیں اور ہر نمونے پر سیرتِ نبوی کے واقعات سے شواہد لاتے ہیں: قیادت کا فہم، برا قائد اور پیروکاروں کی اقسام، قائدین کی دریافت، قیادتی تربیت، قائد کے آٹھ کردار اور ان کی تربیت، تخصصی قیادت، اور قیادت کو پروان چڑھانے والا ماحول۔"
