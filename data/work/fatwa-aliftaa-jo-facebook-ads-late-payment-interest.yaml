id: work/fatwa-aliftaa-jo-facebook-ads-late-payment-interest
class: work
kind: fatwa
label: { ar: "حكم الإعلانات الممولة على فيسبوك مع شرط غرامة التأخير", en: "Paid Facebook ads with a late-payment charge", ur: "تاخیر کے جرمانے کی شرط کے ساتھ فیس بک کے سپانسرڈ اشتہارات" }
summary:
  ar: "سؤال عن الترويج بالإعلانات الممولة على فيسبوك مع وجود غرامة على تأخير الدفع، أجابت فيه دائرة الإفتاء العام الأردنية بجوازها بطريقة الدفع المسبق فقط، دون الفوترة التلقائية. ذكرت الدائرة أنها بحثت أنواع الإعلانات على فيسبوك فوجدت إعلانات مجانية وممولة، وأن للممولة طريقتين: الفوترة التلقائية والأموال مسبقة الدفع. ووجدت في شروط الإعلانات الممولة ذاتية الخدمة بندًا ينص على أن المبالغ المتأخرة تستحق فائدة قدرها 1 بالمئة شهريًا أو الحد الأقصى المسموح قانونًا أيهما أقل، مع تحمل نفقات التحصيل. وقالت إن الأصل تحريم اشتراط غرامة على تأخير سداد الدين لأنه من الربا، ونقلت قرار مجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بأن الشرط الجزائي يجوز في العقود المالية إلا ما كان الالتزام الأصلي فيه دينًا. وخلصت إلى جواز الإعلانات الممولة بطريقة الدفع المسبق لخلوها من الشرط الربوي، وعدم جواز طريقة الفوترة التلقائية لاشتمالها عليه."
  en: "A question on promoting through paid Facebook ads when late payment carries a charge, in which Jordan's General Iftaa Department answered that they are permitted only through prepayment, not automatic billing. The Department said it had studied Facebook's ad types and found free and paid ads, with paid ads offering two methods: automatic billing and prepaid funds. It found in the terms for self-service paid ads a clause stating that overdue amounts accrue interest of 1% a month or the maximum allowed by law, whichever is lower, plus the costs of collection. It said that stipulating a penalty for late repayment of a debt is in principle forbidden as riba, and quoted the International Islamic Fiqh Academy's twelfth session that a penalty clause is allowed in financial contracts except where the original obligation is a debt. It concluded that paid ads are permitted through prepayment, which is free of the interest condition, and not through automatic billing, which contains it."
  ur: "تاخیر سے ادائیگی پر جرمانے کی موجودگی میں فیس بک کے سپانسرڈ اشتہارات کے ذریعے تشہیر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ صرف پیشگی ادائیگی کے طریقے سے جائز ہیں، خودکار بلنگ سے نہیں۔ ڈیپارٹمنٹ نے کہا کہ اس نے فیس بک کے اشتہارات کی اقسام کا جائزہ لیا تو مفت اور سپانسرڈ اشتہارات پائے، اور سپانسرڈ کے دو طریقے ہیں: خودکار بلنگ اور پیشگی ادا شدہ رقم۔ اس نے سیلف سروس سپانسرڈ اشتہارات کی شرائط میں ایک شق پائی کہ واجب الادا متاخر رقم پر ماہانہ 1 فیصد یا قانوناً زیادہ سے زیادہ جائز شرح، جو بھی کم ہو، سود لگے گا، اور وصولی کے اخراجات بھی۔ اس نے کہا کہ قرض کی ادائیگی میں تاخیر پر جرمانے کی شرط اصولاً سود ہونے کی وجہ سے حرام ہے، اور بین الاقوامی اسلامی فقہ اکیڈمی کے بارہویں اجلاس کی قرارداد نقل کی کہ مالی عقود میں تعزیری شرط جائز ہے سوائے ان کے جن میں اصل ذمہ داری قرض ہو۔ اس نے نتیجہ نکالا کہ سپانسرڈ اشتہارات پیشگی ادائیگی کے طریقے سے جائز ہیں جو سودی شرط سے خالی ہے، اور خودکار بلنگ سے جائز نہیں جس میں یہ شرط ہے۔"
