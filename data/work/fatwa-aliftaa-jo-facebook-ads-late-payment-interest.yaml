id: work/fatwa-aliftaa-jo-facebook-ads-late-payment-interest
class: work
kind: fatwa
label: { ar: "حكم الإعلانات الممولة على فيسبوك مع شرط غرامة التأخير", en: "Paid Facebook ads with a late-payment charge", ur: "تاخیر کے جرمانے کی شرط کے ساتھ فیس بک کے سپانسرڈ اشتہارات", es: "Anuncios pagados en Facebook con recargo por pago tardío.", fr: "Publicités Facebook payantes avec frais de retard", tr: "Geç Ceza Maddesi Olan Facebook Sponsorlu Reklamlar Kuralı", id: "Aturan tentang Iklan yang Disponsori Facebook dengan Klausul Penalti Terlambat" }
summary:
  ar: "سؤال عن الترويج بالإعلانات الممولة على فيسبوك مع وجود غرامة على تأخير الدفع، أجابت فيه دائرة الإفتاء العام الأردنية بجوازها بطريقة الدفع المسبق فقط، دون الفوترة التلقائية. ذكرت الدائرة أنها بحثت أنواع الإعلانات على فيسبوك فوجدت إعلانات مجانية وممولة، وأن للممولة طريقتين: الفوترة التلقائية والأموال مسبقة الدفع. ووجدت في شروط الإعلانات الممولة ذاتية الخدمة بندًا ينص على أن المبالغ المتأخرة تستحق فائدة قدرها 1 بالمئة شهريًا أو الحد الأقصى المسموح قانونًا أيهما أقل، مع تحمل نفقات التحصيل. وقالت إن الأصل تحريم اشتراط غرامة على تأخير سداد الدين لأنه من الربا، ونقلت قرار مجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بأن الشرط الجزائي يجوز في العقود المالية إلا ما كان الالتزام الأصلي فيه دينًا. وخلصت إلى جواز الإعلانات الممولة بطريقة الدفع المسبق لخلوها من الشرط الربوي، وعدم جواز طريقة الفوترة التلقائية لاشتمالها عليه."
  en: "A question on promoting through paid Facebook ads when late payment carries a charge, in which Jordan's General Iftaa Department answered that they are permitted only through prepayment, not automatic billing. The Department said it had studied Facebook's ad types and found free and paid ads, with paid ads offering two methods: automatic billing and prepaid funds. It found in the terms for self-service paid ads a clause stating that overdue amounts accrue interest of 1% a month or the maximum allowed by law, whichever is lower, plus the costs of collection. It said that stipulating a penalty for late repayment of a debt is in principle forbidden as riba, and quoted the International Islamic Fiqh Academy's twelfth session that a penalty clause is allowed in financial contracts except where the original obligation is a debt. It concluded that paid ads are permitted through prepayment, which is free of the interest condition, and not through automatic billing, which contains it."
  ur: "تاخیر سے ادائیگی پر جرمانے کی موجودگی میں فیس بک کے سپانسرڈ اشتہارات کے ذریعے تشہیر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ صرف پیشگی ادائیگی کے طریقے سے جائز ہیں، خودکار بلنگ سے نہیں۔ ڈیپارٹمنٹ نے کہا کہ اس نے فیس بک کے اشتہارات کی اقسام کا جائزہ لیا تو مفت اور سپانسرڈ اشتہارات پائے، اور سپانسرڈ کے دو طریقے ہیں: خودکار بلنگ اور پیشگی ادا شدہ رقم۔ اس نے سیلف سروس سپانسرڈ اشتہارات کی شرائط میں ایک شق پائی کہ واجب الادا متاخر رقم پر ماہانہ 1 فیصد یا قانوناً زیادہ سے زیادہ جائز شرح، جو بھی کم ہو، سود لگے گا، اور وصولی کے اخراجات بھی۔ اس نے کہا کہ قرض کی ادائیگی میں تاخیر پر جرمانے کی شرط اصولاً سود ہونے کی وجہ سے حرام ہے، اور بین الاقوامی اسلامی فقہ اکیڈمی کے بارہویں اجلاس کی قرارداد نقل کی کہ مالی عقود میں تعزیری شرط جائز ہے سوائے ان کے جن میں اصل ذمہ داری قرض ہو۔ اس نے نتیجہ نکالا کہ سپانسرڈ اشتہارات پیشگی ادائیگی کے طریقے سے جائز ہیں جو سودی شرط سے خالی ہے، اور خودکار بلنگ سے جائز نہیں جس میں یہ شرط ہے۔"
  es: "Ante una pregunta sobre la promoción mediante anuncios pagados en Facebook con recargo por pago tardío, el Departamento General de Iftaa de Jordania respondió que solo están permitidos mediante prepago, no mediante facturación automática. El Departamento indicó que había estudiado los tipos de anuncios de Facebook y encontrado anuncios gratuitos y de pago, ofreciendo los de pago dos métodos: facturación automática y fondos prepago. En los términos y condiciones de los anuncios pagados de autoservicio, encontró una cláusula que establece que los importes vencidos generan intereses del 1% mensual o el máximo permitido por la ley, el que sea menor, más los gastos de cobro. Afirmó que estipular una penalización por el pago tardío de una deuda está prohibido en principio por considerarse riba (usura), y citó la duodécima sesión de la Academia Internacional de Fiqh Islámico, que establece que una cláusula penal está permitida en los contratos financieros, excepto cuando la obligación original es una deuda. Concluyó que los anuncios pagados están permitidos mediante prepago, que no incluye la condición de interés, y no mediante facturación automática, que sí la incluye."
  fr: "Interrogé sur la promotion via des publicités Facebook payantes en cas de frais de retard de paiement, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que ces publicités ne sont autorisées qu'avec paiement anticipé, et non par facturation automatique. Le Département a indiqué avoir étudié les différents types de publicités Facebook et constaté la présence de publicités gratuites et payantes, ces dernières proposant deux options: la facturation automatique et le paiement anticipé. Il a relevé dans les conditions générales des publicités payantes en libre-service une clause stipulant que les montants impayés portent intérêt à hauteur de 1 % par mois, ou au taux maximal autorisé par la loi si celui-ci est inférieur, majoré des frais de recouvrement. Le Département a précisé que toute pénalité pour retard de paiement est, par principe, interdite car considérée comme du riba (usure), et a cité la douzième session de l'Académie internationale de jurisprudence islamique (Iftaa) selon laquelle une clause pénale est autorisée dans les contrats financiers, sauf lorsque l'obligation initiale constitue une dette. En conclusion, les publicités payantes sont autorisées avec paiement anticipé, exempt de pénalités, mais non avec facturation automatique, qui en inclut."
  tr: "Facebook'ta sponsorlu reklamların gecikme cezası ile tanıtımıyla ilgili bir soru, Ürdün Genel Fetva Dairesi tarafından yalnızca ön ödemeli yöntemlerle, otomatik faturalama olmadan izin verilmesiyle yanıtlandı. Bakanlık, Facebook'ta reklam türlerini araştırdığını ve ücretsiz ile fonlu reklamlar bulduğunu, finansörün iki yöntemi olduğunu belirtti: otomatik faturalandırma ve ön ödemeli fonlama. Kendi kendini finanse eden reklamlar şartlarında, gecikmiş tutarların aylık yüzde 1 veya yasal olarak izin verilen azami faiz (hangisi azsa) tahsilat masraflarıyla birlikte hak kazanabileceğini belirten bir madde bulundu. Varsayılan yasağın gecikmiş borç ödemesi için ceza uygulanması olduğu belirtildi çünkü bu tefecilik sayılır ve Uluslararası İslami Fiqh Akademisi'nin on ikinci oturumunda yaptığı kararı, ceza maddesinin orijinal yükümlülük borç olmadıkça finansal sözleşmelerde izin verilebileceğine dair kararını aktardı. Davak, ön ödemeli yöntemle finanse edilen reklamların tefecilik koşulunun bulunmaması nedeniyle izin verildiği, otomatik faturalandırmanın ise dahil edilmesi nedeniyle izin verilmediği sonucuna vardı."
  id: "Pertanyaan tentang mempromosikan iklan bersponsor di Facebook dengan denda keterlambatan pembayaran dijawab oleh Departemen Fatwa Umum Yordania dengan hanya mengizinkannya melalui metode prabayar, tanpa penagihan otomatis. Departemen menyatakan bahwa mereka meneliti jenis iklan di Facebook dan menemukan iklan gratis dan didanai, serta bahwa pemberi dana memiliki dua metode: penagihan otomatis dan pendanaan prabayar. Mereka menemukan dalam ketentuan iklan yang didanai sendiri sebuah klausul yang menyatakan bahwa jumlah tertunggak berhak atas bunga 1 persen per bulan atau maksimum yang diizinkan secara hukum, mana yang lebih kecil, dengan biaya penagihan yang harus ditanggung. Departemen menyatakan bahwa larangan default adalah mengenakan denda atas keterlambatan pelunasan utang karena itu riba, dan mengutip keputusan Akademi Fiqh Islam Internasional pada sesi kedua belasnya bahwa klausul penalti diperbolehkan dalam kontrak keuangan kecuali kewajiban awal adalah utang. Laporan menyimpulkan bahwa iklan yang didanai dengan metode prabayar diperbolehkan karena tidak adanya syarat riba, dan penagihan otomatis tidak diperbolehkan karena dimasukkannya."
