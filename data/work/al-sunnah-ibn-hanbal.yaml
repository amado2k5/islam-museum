summary:
  ar: "كتاب في الاعتقاد بالإسناد لأبي عبد الرحمن عبد الله ابن الإمام أحمد بن حنبل (213–290هـ)، ويسمى أيضاً «الرد على الجهمية»؛ يجمع أقوال أبيه وغيره من أئمة الحديث وآثار الصحابة والتابعين في القرآن والجهمية واللفظية والواقفة، والإيمان والرد على المرجئة، والقدر، والصفات، والخلافة والتفضيل، وعذاب القبر، والخوارج، وفيه باب في أبي حنيفة حذفته بعض نسخه."
  en: "A book of creed with chains of transmission by Abu Abd al-Rahman Abd Allah, son of Imam Ahmad ibn Hanbal (213–290 AH), also called al-Radd 'ala al-Jahmiyya. It gathers the sayings of his father and other hadith imams and reports from the Companions and Followers on the Qur'an and the Jahmiyya, the Lafziyya and the Waqifa, faith and the answer to the Murji'a, destiny, the attributes, the caliphate and the ranking of the Companions, the punishment of the grave and the Kharijites, and includes a chapter on Abu Hanifa that some copies omit."
