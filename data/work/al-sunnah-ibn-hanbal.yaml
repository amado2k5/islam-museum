structure: "Sections as headed in the edition (PDF pages): what the scholars said about the Jahmiyya, declaring them unbelievers and praying behind them (from p. 25); the scholars on the Qur'an (pp. ~59–90); those who say 'my utterance of the Qur'an is created' (pp. 92–95); what he memorised about Jahm and Bishr al-Marisi (pp. 98–99); Ahmad's view of the Waqifa (pp. 117–118); what he memorised from his father and other shaykhs about Abu Hanifa (from p. 120); the attributes and the vision of God; faith and the answer to the Murji'a (from p. 303); what the scholars said about Amr ibn Ubayd and destiny (from p. 453); the imams, the caliphate and the ranking among them (from p. 637); the punishment and trial of the grave (from p. 665); the Kharijites; indexes (to p. 813)."
