summary:
  ar: "الترجمة اللاتينية الباقية لزيج البتاني، صنعها أفلاطون التيفولي في برشلونة في النصف الأول من القرن الثاني عشر، وطبعت في نورنبرغ سنة 1537م مع حواشي ريجيومونتانوس، وعرفت بعناوين «في حركة النجوم» و«في علم النجوم» و«في أعداد النجوم» {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
  en: "The surviving Latin translation of al-Battani's Zij, made by Plato of Tivoli at Barcelona in the first half of the twelfth century and printed at Nuremberg in 1537 with Regiomontanus' notes; known under the titles De motu stellarum, De scientia stellarum and De numeris stellarum {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
  ur: "البتانی کی زیج کا باقی رہنے والا لاطینی ترجمہ، جو افلاطون تیفولی نے بارہویں صدی کے نصفِ اول میں برشلونہ میں کیا اور 1537ء میں ریجیومونٹانس کے حواشی کے ساتھ نیورمبرگ میں چھپا {cite:nallino-albatenii-opus-astronomicum p. 59}."
