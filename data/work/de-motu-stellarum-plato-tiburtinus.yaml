label: { ar: "ترجمة أفلاطون التيفولي اللاتينية لزيج البتاني ⁦(في حركة النجوم)⁩", en: "De motu stellarum: Plato of Tivoli's Latin translation of al-Battani's Zij", ur: "البتانی کی زیج کا افلاطون تیفولی کا لاطینی ترجمہ ⁦(حرکتِ نجوم میں)⁩", es: "De motu stellarum: traducción latina de Platón de Tivoli del Zij de al-Battani", fr: "De motu stellarum: traduction latine de Platon de Tivoli du Zij d'al-Battani" }
summary:
  ar: "الترجمة اللاتينية الباقية لزيج البتاني، صنعها أفلاطون التيفولي في برشلونة في النصف الأول من القرن الثاني عشر، وطبعت في نورنبرغ سنة 1537م مع حواشي ريجيومونتانوس، وعرفت بعناوين «في حركة النجوم» و«في علم النجوم» و«في أعداد النجوم» {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
  en: "The surviving Latin translation of al-Battani's Zij, made by Plato of Tivoli at Barcelona in the first half of the twelfth century and printed at Nuremberg in 1537 with Regiomontanus' notes; known under the titles De motu stellarum, De scientia stellarum and De numeris stellarum {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
  ur: "البتانی کی زیج کا باقی رہنے والا لاطینی ترجمہ، جو افلاطون تیفولی نے بارہویں صدی کے نصفِ اول میں برشلونہ میں کیا اور 1537ء میں ریجیومونٹانس کے حواشی کے ساتھ نیورمبرگ میں چھپا {cite:nallino-albatenii-opus-astronomicum p. 59}."
  es: "La traducción latina que se conserva del Zij de al-Battani, realizada por Platón de Tívoli en Barcelona en la primera mitad del siglo XII e impresa en Nuremberg en 1537 con las notas de Regiomontano; conocido bajo los títulos De motu stellarum, De scientia stellarum y De numeris stellarum {cita:nallino-albatenii-opus-astronomicum p. 40} {citar:nallino-albatenii-opus-astronomicum p. 59} {citar: nallino-albatenii-opus-astronomicum p. 65}."
  fr: "La traduction latine survivante du Zij d'al-Battani, réalisée par Platon de Tivoli à Barcelone dans la première moitié du XIIe siècle et imprimée à Nuremberg en 1537 avec les notes de Regiomontanus; connu sous les titres De motu stellarum, De scientia stellarum et De numeris stellarum {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
