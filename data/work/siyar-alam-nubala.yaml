summary:
  ar: "معجم تراجم كبير لشمس الدين الذهبي ⁦(ت 748هـ)⁩ يرتب الأعلام على الطبقات من الصحابة فمن بعدهم إلى عصر المؤلف، ويذكر في الترجمة النسب والشيوخ والتلاميذ والأخبار والوفاة. وهو من أوسع مصادر وفيات الصحابة والتابعين وما قيل فيهم من الرثاء والتعزية."
  en: "A large biographical dictionary by Shams al-Din al-Dhahabi (d. 748 AH) that arranges notable figures by generation, from the Companions through the Successors and after, down to the author's own time; each entry gives lineage, teachers, students, reports and the death. It is among the fullest sources for how the Companions and Successors died and what was said over them in elegy and condolence."
  ur: "شمس الدین الذہبی ⁦(متوفی 748ھ)⁩ کی بڑی سوانحی لغت جو اکابر کو طبقات کے مطابق صحابہ سے تابعین اور بعد کے لوگوں تک مصنف کے زمانے تک ترتیب دیتی ہے؛ ہر ترجمے میں نسب، اساتذہ، تلامذہ، اخبار اور وفات ہے۔ صحابہ و تابعین کی وفات اور ان پر کہے گئے مرثیوں اور تعزیتوں کے سب سے وسیع مآخذ میں سے ہے۔"
  fr: "Un grand dictionnaire biographique de Shams al-Din al-Dhahabi (m. 748 H) qui classe les personnages par générations, des Compagnons aux Successeurs et au-delà, jusqu'à l'époque de l'auteur ; chaque notice donne la généalogie, les maîtres, les élèves, des récits et le décès. C'est l'une des sources les plus riches sur la mort des Compagnons et des Successeurs et sur ce qui fut dit d'eux en élégie et en condoléances."
  es: "Un gran diccionario biográfico de Shams al-Din al-Dhahabi (m. 748 H) que ordena a las figuras notables por generaciones, desde los Compañeros y los Sucesores hasta la época del autor; cada entrada da el linaje, los maestros, los discípulos, relatos y la muerte. Es una de las fuentes más completas sobre cómo murieron los Compañeros y los Sucesores y lo que se dijo de ellos en elegías y condolencias."
  tr: "Şemseddin el-Dhahabi (ö. 748 H) tarafından hazırlanan büyük bir biyografik sözlük, Sahabeler arasında kendi nesillerinden yazarın dönemine kadar olan önemli kişileri rütbelerine göre düzenler. Biyografi, soy, şeyhler, öğrenciler, raporlar ve ölümlerden bahseder. Sahabelerin ve Takipçilerin ölümleri ile onlar hakkında söylenenler, ağıtlar ve taziyeler hakkında en kapsamlı kaynaklardan biridir."
  id: "Sebuah kamus biografi besar oleh Shams al-Din al-Dhahabi (wafat 748 H) yang mengatur tokoh-tokoh penting berdasarkan pangkat di antara para Sahabat dari generasi mereka hingga era penulis. Biografi ini menyebutkan garis keturunan, para sheikh, pelajar, laporan, dan kematian. Ini adalah salah satu sumber paling komprehensif tentang kematian para Sahabat dan Pengikut, serta apa yang telah dikatakan tentang mereka dalam bentuk elegi dan ucapan belasungkawa."
