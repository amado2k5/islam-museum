label: { ar: "قرار مجمع الفقه الإسلامي الدولي 245 (25/7) بشأن رؤية شرعية لمعالجة ظاهرة اللقطاء والمواليد مجهولي النسب في الشريعة الإسلامية", en: "IIFA resolution 245 (25/7) on a sharia approach to the phenomenon of foundlings and newborns of unknown lineage in Islamic law", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 245 (25/7): شریعتِ اسلامی میں لقيط بچوں اور نامعلوم نسب کے نوزائیدہ بچوں کے مسئلے کا شرعی علاج", es: "Resolución 245 (25/7) de la IIFA sobre un enfoque de la sharia respecto al fenómeno de los niños expósitos y los recién nacidos de linaje desconocido en la ley islámica.", fr: "Résolution 245 (25/7) de l'IIFA sur une approche islamique du phénomène des enfants trouvés et des nouveau-nés d'origine inconnue en droit islamique" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. عرّف المجمع اللقيط بأنه كل طفل لا يعرف له أبوان نُبذ أو ضلّ، ومجهول النسب بمن جُهل أبواه لسبب كحرب أو زلزال، أو من كانت له أم معروفة وأب مجهول، ويشمل من كان له أب غير شرعي. وقرر أن رعاية اللقيط ومجهول النسب فرض كفاية ومسؤولية الدولة عند عدم وجود كافل، وتشمل الحضانة والنفقة والتعليم والصحة والحفظ مما يهدد حياتهما ومتطلبات المعيشة الكريمة؛ وأن مجهول النسب يُلحق بمن ادعاه ما لم يكذبه الحس أو العقل، وبمن ثبتت ولادته له بطريق معتبر شرعًا، ويُلزم من ثبتت أبوته بالإنفاق والرعاية؛ وأن يُعطى اسمًا ولقبًا حسنًا ويُمنح جنسية البلد الذي وُجد فيه؛ وأن له جميع الحقوق الدينية والمدنية الثابتة لغيره ولا يجوز تعييره ويعزر من فعل؛ ولا يجوز تسليمه لجهات غير إسلامية أو أشخاص غير مأمونين. وأوصى بسن قوانين لرعايتهما، وأن ترضع زوجة الملتقط أو من تنتشر الحرمة من رضاعها اللقيط ليشعر بأهل يأوي إليهم، وتشجيع الأفراد والهيئات على الكفالة وإنشاء مراكز الرعاية وبخاصة في دول الكوارث والحروب."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). It defined the foundling as any child of unknown parents who is cast off or lost, and the one of unknown lineage as one whose parents are unknown through war, earthquake or the like, or who has a known mother and unknown father — including one with an illegitimate father. It ruled that caring for the foundling and the child of unknown lineage is a communal obligation and the state's responsibility when there is no guardian, covering custody, maintenance, education, health and a dignified life; that the child is attached to whoever claims him unless reason or sense disproves it, or to one proven to be his parent by a sharia-recognised means, who is then bound to support him; that he be given a good name and surname and the nationality of the country where he was found; that he holds all the religious and civil rights of others and may not be taunted, the offender being disciplined; and that he may not be handed to non-Islamic bodies or untrustworthy persons. It recommended protective legislation, that the finder have his wife or a woman whose nursing creates the bond of unmarriageability nurse the foundling so he feels he has family, and encouraging individuals and charities to sponsor and build care centres, especially in disaster- and war-stricken countries."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے لقيط کی تعریف ایسے بچے کے طور پر کی جس کے والدین معلوم نہ ہوں اور جسے پھینکا گیا ہو یا وہ کھو گیا ہو، اور نامعلوم نسب کی تعریف ایسے شخص کے طور پر کی جس کے والدین جنگ، زلزلے وغیرہ سے نامعلوم ہوں، یا ماں معلوم اور باپ نامعلوم ہو — ناجائز باپ والا بھی اسی میں شامل ہے۔ اس نے فیصلہ کیا کہ لقيط اور نامعلوم نسب کی دیکھ بھال فرضِ کفایہ ہے اور کفیل نہ ہو تو ریاست کی ذمہ داری، جس میں حضانت، نفقہ، تعلیم، صحت اور باوقار زندگی شامل ہیں؛ نامعلوم نسب اس شخص سے منسوب ہوگا جو اسے اپنا کہے بشرطیکہ عقل یا حس اس کی تردید نہ کرے، یا جس کی والدیت شرعی طریقے سے ثابت ہو، پھر اس پر نفقہ و کفالت لازم ہے؛ بچے کو اچھا نام اور لقب اور اس ملک کی شہریت دی جائے جہاں وہ ملا؛ اسے دوسروں کے تمام دینی و شہری حقوق حاصل ہیں، اسے طعنہ دینا جائز نہیں اور کرنے والا تعزیر پائے گا؛ اور اسے غیر اسلامی اداروں یا غیر معتبر افراد کے حوالے نہیں کیا جا سکتا۔ سفارشات میں تحفظ کے قوانین، لقيط کو اٹھانے والے کی بیوی یا رضاعی حرمت پیدا کرنے والی کا دودھ پلانا تاکہ بچے کو گھر کا احساس ہو، اور خاص طور پر آفات و جنگ زدہ ممالک میں کفالت اور رعایتی مراکز کی ترغیب شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023). Definió al expósito como cualquier niño de padres desconocidos que es abandonado o perdido, y al de linaje desconocido como aquel cuyos padres son desconocidos debido a la guerra, terremoto o similares, o que tiene una madre conocida y un padre desconocido, incluyendo uno con un padre ilegítimo. Dictaminó que el cuidado del expósito y del niño de linaje desconocido es una obligación comunitaria y responsabilidad del Estado cuando no hay tutor, abarcando la custodia, el sustento, la educación, la salud y una vida digna; que el niño está vinculado a quien lo reclame a menos que la razón o el sentido lo desmientan, o a quien se haya probado que es su padre por medios reconocidos por la sharia, quien entonces está obligado a mantenerlo; que se le dé un buen nombre y apellido y la nacionalidad del país donde fue encontrado; que goza de todos los derechos religiosos y civiles de los demás y no puede ser objeto de burlas, siendo el infractor sancionado; y que no puede ser entregado a entidades no islámicas ni a personas poco fiables. Se recomendó legislación protectora, que quien encuentre al niño expósito haga que su esposa o una mujer cuya crianza cree el vínculo de no matrimonio lo cuide para que sienta que tiene una familia, y alentar a particulares y organizaciones benéficas a patrocinar y construir centros de atención, especialmente en países asolados por desastres y guerras."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023). Elle définit l'enfant trouvé comme tout enfant de parents inconnus abandonné ou perdu, et l'enfant de lignée inconnue comme un enfant dont les parents sont inconnus suite à une guerre, un tremblement de terre ou autre, ou qui a une mère connue et un père inconnu – y compris un enfant né d'un père illégitime. Elle statue que la prise en charge de l'enfant trouvé et de l'enfant de lignée inconnue est une obligation communautaire et une responsabilité de l'État en l'absence de tuteur, couvrant la garde, l'entretien, l'éducation, la santé et une vie digne; que l'enfant est rattaché à celui qui le réclame, sauf preuve du contraire, ou à celui dont la filiation est établie par un moyen reconnu par la charia, qui est alors tenu de subvenir à ses besoins; qu'il reçoive un nom et un prénom convenables ainsi que la nationalité du pays où il a été trouvé. Il est stipulé que l'enfant trouvé possède tous les droits religieux et civils des autres et ne peut être raillé, l'auteur de l'insulte étant sanctionné; et qu'il ne peut être confié à des organismes non islamiques ni à des personnes de confiance. Il est recommandé de légiférer en matière de protection, que la personne qui trouve l'enfant le fasse élever par son épouse ou une femme dont l'allaitement crée un lien de non-mariage, afin qu'il se sente intégré à une famille, et d'encourager les particuliers et les organisations caritatives à parrainer et à construire des centres d'accueil, notamment dans les pays touchés par des catastrophes ou des conflits armés."
