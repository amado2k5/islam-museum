id: work/fatwa-dar-alifta-eg-raising-hands-janaza-takbirs
class: work
kind: fatwa
label: { ar: "حكم رفع اليدين في تكبيرات صلاة الجنازة", en: "Raising the hands in the funeral prayer's takbirs", ur: "نمازِ جنازہ کی تکبیروں میں ہاتھ اٹھانا", es: "Alzar las manos en los takbirs de la oración fúnebre", fr: "Lever les mains lors des takbirs de la prière funéraire", tr: "Cenaze namazının tekbirleri sırasında el kaldırma kararı", id: "Putusan tentang mengangkat tangan saat takbir doa pemakaman" }
summary:
  ar: "سائل سأل عن رفع اليدين في تكبيرات صلاة الجنازة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21677)⁩ أنه يستحب شرعًا رفع اليدين عند التكبيرة الأولى وأما سائر التكبيرات بعد الأولى فمختلف في استحبابه وبيّن الجواب الخلاف على وجهه."
  en: "A questioner asked about raising the hands in the funeral prayer's takbirs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21677) answered that raising the hands at the first takbir is commended; for the later takbirs the recommendation is debated, as the answer sets out."
  ur: "ایک سائل نے نمازِ جنازہ کی تکبیروں میں ہاتھ اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21677)⁩ نے جواب دیا کہ پہلی تکبیر پر ہاتھ اٹھانا مستحب ہے؛ بعد کی تکبیروں پر اختلاف ہے جو جواب میں بیان ہوا۔"
  es: "Un interlocutor preguntó sobre la importancia de levantar las manos durante los takbirs de la oración fúnebre. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21677) respondió que levantar las manos en el primer takbir es recomendable; para los takbirs posteriores, la recomendación es objeto de debate, como se indica en la respuesta."
  fr: "Une question a été posée concernant le fait de lever les mains lors des takbirs de la prière funéraire. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21677) a répondu que lever les mains au premier takbir est recommandé; pour les takbirs suivants, la question est débattue, comme l'indique la réponse."
  tr: "Bir soru soran kişi, cenaze namazının tekbirlerinde ellerin kaldırılmasını sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21677), ellerin kaldırılmasının ilk tekbirde dini olarak tavsiye edildiğini, ancak ilk tekbirden sonraki diğer tekbirlerin tavsiyelerinde farklı olduğunu ve cevap konusunda anlaşmazlık olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang mengangkat tangan dalam takbir dalam shalat pemakaman. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21677) menjawab bahwa mengangkat tangan secara agama dianjurkan pada takbir pertama, sementara takbir lain setelah takbir pertama berbeda pendapat dan ada perbedaan pendapat mengenai jawabannya."
