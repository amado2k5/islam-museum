label: { ar: "حكم رفع اليدين في تكبيرات صلاة الجنازة", en: "Raising the hands in the funeral prayer's takbirs", ur: "نمازِ جنازہ کی تکبیروں میں ہاتھ اٹھانا" }
summary:
  ar: "سائل سأل عن رفع اليدين في تكبيرات صلاة الجنازة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21677)⁩ أنه يستحب شرعًا رفع اليدين عند التكبيرة الأولى وأما سائر التكبيرات بعد الأولى فمختلف في استحبابه وبيّن الجواب الخلاف على وجهه."
  en: "A questioner asked about raising the hands in the funeral prayer's takbirs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21677) answered that raising the hands at the first takbir is commended; for the later takbirs the recommendation is debated, as the answer sets out."
  ur: "ایک سائل نے نمازِ جنازہ کی تکبیروں میں ہاتھ اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21677)⁩ نے جواب دیا کہ پہلی تکبیر پر ہاتھ اٹھانا مستحب ہے؛ بعد کی تکبیروں پر اختلاف ہے جو جواب میں بیان ہوا۔"
