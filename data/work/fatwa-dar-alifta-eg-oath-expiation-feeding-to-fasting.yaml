label: { ar: "حكم الانتقال في كفارة اليمين من الإطعام عند العجز إلى الصيام", en: "Moving from feeding to fasting in oath expiation on inability", ur: "کفارۂ یمین میں کھانا کھلانے سے روزے کی طرف منتقلی", es: "Pasar de la alimentación al ayuno en la expiación del juramento por incapacidad" }
summary:
  ar: "سائل سأل عن الانتقال في كفارة اليمين من الإطعام إلى الصيام عند العجز. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22165)⁩ أن من حنث في يمينه وجبت عليه الكفارة وهو مخير فيها بين إطعام عشرة مساكين أو كسوتهم أو تحرير رقبة، فإن عجز صام، وبيّن الجواب ترتيب الخيارات وضوابطها."
  en: "A questioner asked about moving from feeding to fasting in oath expiation when unable. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22165) answered that whoever breaks his oath owes the expiation and chooses among feeding ten poor persons, clothing them, or freeing a slave; if unable, he fasts — the answer sets out the order of the options and their controls."
  ur: "ایک سائل نے کفارۂ یمین میں عاجز ہونے پر کھانا کھلانے سے روزے کی طرف جانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22165)⁩ نے جواب دیا کہ قسم توڑنے والے پر کفارہ واجب ہے اور وہ دس مساکین کو کھانا کھلانے، انہیں کپڑا پہنانے یا غلام آزاد کرنے میں مخیر ہے؛ عاجز ہو تو روزہ رکھے — جواب میں اختیارات کی ترتیب اور ضوابط بیان ہوئے۔"
  es: "Un consultante preguntó sobre la posibilidad de pasar de alimentar a las personas a ayunar como expiación del juramento cuando no es posible hacerlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22165) respondió que quien rompe su juramento debe expiar su culpa y elegir entre alimentar a diez personas pobres, vestirlas o liberar a un esclavo; si no puede hacerlo, ayuna. La respuesta establece el orden de las opciones y sus condiciones."
