id: work/fatwa-amja-shower-ghusl-suffices
class: work
kind: fatwa
label: { ar: "الاغتسال تحت الدش", en: "Standing under the shower with intent — ghusl complete", ur: "شاور کے نیچے غسل — مکمل", es: "De pie bajo la ducha con intención: ghusl completado", fr: "Se tenir sous la douche avec concentration — ghusl terminé", tr: "Duş alma", id: "Mandi" }
summary:
  ar: "سأل سائل عن الاغتسال من الجنابة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21936 بتاريخ 2 أكتوبر 2005)⁩ أن المغتسل إذا وقف تحت الدش بنية الاغتسال من الجنابة وعمّ الماء جميع جسده بأي كيفية فإن هذا يجزئ ويكفي وتحصل به الطهارة الشرعية على ما فصّل الجواب."
  en: "A questioner asked about bathing from janaba. Dr. Salah al-Sawi (fatwa no. 21936, 2 October 2005) answered that a bather standing under the shower intending the ghusl from janaba, the water covering his whole body in any manner, finds it suffices — the legal purity is attained by it — as the answer details."
  ur: "شاور کا غسل کافی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21936، 2 اکتوبر 2005)⁩ کے مطابق نیت اور پورے بدن پر پانی سے طہارت حاصل۔"
  es: "Un consultante preguntó sobre el baño desde la janaba. El Dr. Salah al-Sawi (fatwa n.° 21936, 2 de octubre de 2005) respondió que un bañista que se encuentra bajo la ducha con la intención de realizar el ghusl desde la janaba, con el agua cubriendo todo su cuerpo de cualquier manera, considera que esto es suficiente; así se alcanza la pureza legal, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le bain rituel après avoir été en état d'impureté majeure (janaba). Le Dr Salah al-Sawi (fatwa n° 21936, 2 octobre 2005) a répondu que le baigneur se tenant sous la douche, dans l'intention d'effectuer le ghusl après avoir été en état d'impureté majeure (janaba), l'eau recouvrant tout son corps de quelque manière que ce soit, trouve cela suffisant — la pureté légale est ainsi atteinte — comme le précise la réponse."
  tr: "Bir soruya büyük kirlilikten kaynaklanan gusl hakkında soru soruldu. Dr. Salah Al-Sawy (2 Ekim 2005 tarihli 21936 No. Fetva) çamaşır makinesinin duşun altında durup janaba'dan ghusl yapmak amacıyla durması durumunda ve vücudunun her yerine su herhangi bir şekilde yayılıyorsa, bunun yeterli olduğunu ve cevabında ayrıntılı olarak belirtildiği gibi dini saflığı sağladığını söyledi."
  id: "Seorang penanya ditanya tentang ghusl akibat kotoran besar. Dr. Salah Al-Sawy menjawab (Fatwa No. 21936 tanggal 2 Oktober 2005) bahwa jika mesin cuci berdiri di bawah pancuran dengan niat melakukan ghusl dari janaba dan air menyebar ke seluruh tubuhnya dengan cara apapun, itu sudah cukup dan mencapai kesucian agama, seperti yang dijelaskan dalam jawaban."
