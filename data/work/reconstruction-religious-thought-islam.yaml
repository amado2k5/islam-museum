label: { ar: "تجديد الفكر الديني في الإسلام", en: "The Reconstruction of Religious Thought in Islam", es: "La reconstrucción del pensamiento religioso en el Islam", fr: "La reconstruction de la pensée religieuse en islam", ur: "اسلام میں مذہبی فکر کی تشکیل نو", tr: "İslam'da Dini Düşüncenin Yenilenmesi", id: "Pembaruan Pemikiran Agama dalam Islam" }
summary:
  ar: "كتاب لمحمد إقبال من مقدمة وسبع محاضرات يحاول فيه إعادة بناء الفلسفة الدينية الإسلامية بالنظر إلى تراثها الفلسفي وإلى تطورات المعرفة الحديثة؛ تبحث المحاضرة الأولى في المعرفة والتجربة الدينية وتعرض معيارين لاختبار دعاوى تلك التجربة."
  en: "A book by Muhammad Iqbal in a preface and seven lectures, in which he tries to reconstruct Muslim religious philosophy in the light of its philosophical tradition and of modern knowledge. Lecture I asks how knowledge and religious experience relate and proposes two tests for the claims that experience makes."
  es: "Un libro de Muhammad Iqbal que incluye un prefacio y siete conferencias, en las que intenta reconstruir la filosofía religiosa musulmana a la luz de su tradición filosófica y del conocimiento moderno. La primera conferencia se pregunta cómo se relacionan el conocimiento y la experiencia religiosa, y propone dos pruebas para las afirmaciones que hace la experiencia."
  fr: "Un ouvrage de Muhammad Iqbal, précédé d'une préface et composé de sept conférences, dans lequel il s'efforce de reconstruire la philosophie religieuse musulmane à la lumière de sa tradition philosophique et des connaissances modernes. La première conférence interroge le lien entre connaissance et expérience religieuse et propose deux critères pour évaluer la validité des affirmations de l'expérience."
  ur: "ایک دیباچہ اور سات لیکچرز میں محمد اقبال کی ایک کتاب، جس میں وہ مسلمانوں کے مذہبی فلسفے کو اس کی فلسفیانہ روایت اور جدید علم کی روشنی میں از سر نو تشکیل دینے کی کوشش کرتے ہیں۔ لیکچر میں پوچھتا ہے کہ علم اور مذہبی تجربہ کا تعلق کس طرح ہے اور تجربہ ان دعووں کے لیے دو ٹیسٹ تجویز کرتا ہے۔"
  tr: "Muhammed İkbal'in bir kitabı, İslam dini felsefesini felsefi mirası ve modern bilginin gelişimleri ışığında yeniden inşa etmeye çalıştığı bir giriş ve yedi dersten oluşmaktadır; ilk ders dini bilgi ve deneyimi inceler ve bu deneyimin iddialarını test etmek için iki kriter sunar."
  id: "Sebuah buku karya Muhammad Iqbal yang terdiri dari pengantar dan tujuh kuliah di mana ia berusaha merekonstruksi filsafat agama Islam berdasarkan warisan filsafatnya dan perkembangan pengetahuan modern; kuliah pertama mengkaji pengetahuan dan pengalaman agama serta menyajikan dua kriteria untuk menguji klaim pengalaman tersebut."
