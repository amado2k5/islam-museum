summary:
  ar: "كتاب لمحمد إقبال من مقدمة وسبع محاضرات يحاول فيه إعادة بناء الفلسفة الدينية الإسلامية بالنظر إلى تراثها الفلسفي وإلى تطورات المعرفة الحديثة؛ تبحث المحاضرة الأولى في المعرفة والتجربة الدينية وتعرض معيارين لاختبار دعاوى تلك التجربة."
  en: "A book by Muhammad Iqbal in a preface and seven lectures, in which he tries to reconstruct Muslim religious philosophy in the light of its philosophical tradition and of modern knowledge. Lecture I asks how knowledge and religious experience relate and proposes two tests for the claims that experience makes."
