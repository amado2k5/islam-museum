structure: "Preface, then seven lectures (I: knowledge and religious experience; II: the philosophical test of the revelations of religious experience; III: the conception of God and the meaning of prayer; IV: the human ego, its freedom and immortality; V: the spirit of Muslim culture; VI: the principle of movement in the structure of Islam; VII: is religion possible?), followed by notes, references and a bibliography. The lectures were delivered at Madras, Hyderabad and Aligarh at the request of the Madras Muslim Association. This record covers the preface and Lecture I (pp. 3 to 19); the edition is not verified."
