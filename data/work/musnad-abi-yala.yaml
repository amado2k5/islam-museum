summary:
  ar: "مسند أبي يعلى أحمد بن علي بن المثنى الموصلي ⁦(ت 307هـ)⁩، مرتب على مسانيد الصحابة، أثنى عليه ابن عدي وأبو إسحاق بن حمزة، ورواه عنه أبو عمرو بن حمدان الحيري ⁦(المسند الصغير)⁩ وأبو بكر بن المقرئ؛ عدّه النووي من المسانيد التي لا تلتحق بالكتب الخمسة في الاحتجاج، وجرّد الهيثمي زوائده في «المقصد العلي» {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}."
  en: "The Musnad of Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Mawsili (d. 307 AH), arranged by Companion; Ibn 'Adi and Abu Ishaq ibn Hamza praised it, and it was transmitted from him by Abu 'Amr ibn Hamdan al-Hiri (the 'Small Musnad') and Abu Bakr ibn al-Muqri'; al-Nawawi counted it among the musnads that do not rank with the five books as proof, and al-Haythami extracted its additional material in al-Maqsad al-'Ali {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}."
  ur: "ابو یعلیٰ احمد بن علی بن المثنیٰ موصلی ⁦(وفات 307ھ)⁩ کی مسند، جو صحابہ کی مسانید پر مرتب ہے؛ ابن عدی اور ابو اسحاق بن حمزہ نے اس کی تعریف کی، اور ان سے ابو عمرو بن حمدان حیری ⁦(المسند الصغیر)⁩ اور ابو بکر بن المقری نے اسے روایت کیا؛ نووی نے اسے ان مسانید میں شمار کیا جو استدلال میں پانچ کتابوں کے ہم پلہ نہیں، اور ہیثمی نے اس کے زوائد «المقصد العلی» میں جمع کیے {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}۔"
  es: "El Musnad de Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Mawsili (m. 307 AH), organizado por Companion; Ibn 'Adi y Abu Ishaq ibn Hamza lo elogiaron, y fue transmitido de él por Abu 'Amr ibn Hamdan al-Hiri (el 'Pequeño Musnad') y Abu Bakr ibn al-Muqri'; al-Nawawi lo contó entre los musnads que no se ubican entre los cinco libros como prueba, y al-Haythami extrajo su material adicional en al-Maqsad al-'Ali {cita:musnad-abu-yala-marifa-2005 p. 9-16} {citar:musnad-abu-yala-tasil-v5 p. 1}."
  fr: "Le Musnad d'Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Mawsili (mort en 307 AH), organisé par Companion; Ibn 'Adi et Abu Ishaq ibn Hamza l'ont loué, et il a été transmis de lui par Abu 'Amr ibn Hamdan al-Hiri (le « Petit Musnad ») et Abu Bakr ibn al-Muqri'; al-Nawawi l'a compté parmi les mousnads qui ne figurent pas parmi les cinq livres comme preuve, et al-Haythami a extrait son matériel supplémentaire dans al-Maqsad al-'Ali {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}."
  tr: "Musnad Ebu Ya'la Ahmed bin Ali ibn al-Muthanna al-Mawsili (ö. 307 Hicri), Sahabelerin Musnadlarına göre derlenmiş, İbn 'Adi ve Ebu İshaq ibn Hamza tarafından övülmüş ve Ebu Amr bin Hamdan el-Hayri (küçük Musnad) ile Ebu Bekir ibn el-Muqri' tarafından ondan anlatılmıştır; el-Nevavi, bunu kanıtlama üzerine beş kitapta yer almayan Musnadlar arasında saymıştır. El-Haythami eklemelerini 'Al-Maqsid al-Ali' {cite:musnad-abu-yala-marifa-2005 s. 9-16} {cite:musnad-abu-yala-tasil-v5 s. 1} içinde derlemiştir."
  id: "Musnad Abu Ya'la Ahmad ibn Ali ibn al-Muthanna al-Mawsili (wafat 307 H), disusun menurut Musnad Para Sahabat, dipuji oleh Ibn 'Adi dan Abu Ishaq ibn Hamza, dan diceritakan darinya oleh Abu Amr ibn Hamdan al-Hayri (Musnad kecil) dan Abu Bakr ibn al-Muqri'; al-Nawawi menganggapnya sebagai salah satu Musnad yang tidak termasuk dalam lima buku tentang proofing. Al-Haythami menyusun tambahannya dalam 'Al-Maqsid al-Ali' {cite:musnad-abu-yala-marifa-2005 hlm. 9-16} {cite:musnad-abu-yala-tasil-v5 hlm. 1}."
