authors: [person/abu-yala-al-mawsili]
genre: [hadith]
summary:
  ar: "مسند أبي يعلى أحمد بن علي بن المثنى الموصلي ⁦(ت 307هـ)⁩، مرتب على مسانيد الصحابة، أثنى عليه ابن عدي وأبو إسحاق بن حمزة، ورواه عنه أبو عمرو بن حمدان الحيري ⁦(المسند الصغير)⁩ وأبو بكر بن المقرئ؛ عدّه النووي من المسانيد التي لا تلتحق بالكتب الخمسة في الاحتجاج، وجرّد الهيثمي زوائده في «المقصد العلي» {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}."
  en: "The Musnad of Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Mawsili (d. 307 AH), arranged by Companion; Ibn 'Adi and Abu Ishaq ibn Hamza praised it, and it was transmitted from him by Abu 'Amr ibn Hamdan al-Hiri (the 'Small Musnad') and Abu Bakr ibn al-Muqri'; al-Nawawi counted it among the musnads that do not rank with the five books as proof, and al-Haythami extracted its additional material in al-Maqsad al-'Ali {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}."
  ur: "ابو یعلیٰ احمد بن علی بن المثنیٰ موصلی ⁦(وفات 307ھ)⁩ کی مسند، جو صحابہ کی مسانید پر مرتب ہے؛ ابن عدی اور ابو اسحاق بن حمزہ نے اس کی تعریف کی، اور ان سے ابو عمرو بن حمدان حیری ⁦(المسند الصغیر)⁩ اور ابو بکر بن المقری نے اسے روایت کیا؛ نووی نے اسے ان مسانید میں شمار کیا جو استدلال میں پانچ کتابوں کے ہم پلہ نہیں، اور ہیثمی نے اس کے زوائد «المقصد العلی» میں جمع کیے {cite:musnad-abu-yala-marifa-2005 p. 9-16} {cite:musnad-abu-yala-tasil-v5 p. 1}۔"
