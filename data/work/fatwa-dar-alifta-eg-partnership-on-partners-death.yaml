id: work/fatwa-dar-alifta-eg-partnership-on-partners-death
class: work
kind: fatwa
label: { ar: "حكم الشركة عند موت أحد الشريكين", en: "The partnership when one partner dies", ur: "ایک شریک کی وفات پر شرکت کا حکم", es: "La sociedad cuando fallece uno de los socios", fr: "Le partenariat lorsqu'un associé décède", tr: "Ortaklardan birinin ölümü üzerine şirket hakkında verilen karar", id: "Putusan atas perusahaan atas kematian salah satu mitra" }
summary:
  ar: "سائل سأل عن حكم الشركة عند موت أحد الشريكين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21714)⁩ أن موت أحد الشريكين يعد سببًا من أسباب انقضاء الشركة ولا يمنع من استمرارها إذا حصل الاتفاق والتراضي بين الطرفين على ما فصّل الجواب."
  en: "A questioner asked about the partnership when one partner dies. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21714) answered that a partner's death is among the causes of the partnership's dissolution — though its continuation is not barred if the parties agree and consent — as the answer details."
  ur: "ایک سائل نے ایک شریک کی وفات پر شرکت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21714)⁩ نے جواب دیا کہ شریک کی وفات شرکت کے ختم ہونے کی وجوہ میں ہے مگر فریقین کے اتفاق سے وہ جاری رہ سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la situación de la sociedad cuando fallece uno de los socios. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21714) respondió que el fallecimiento de un socio es una de las causas de disolución de la sociedad, aunque su continuación no se ve impedida si las partes están de acuerdo y dan su consentimiento, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la dissolution d'une société en cas de décès d'un associé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21714) a répondu que le décès d'un associé figure parmi les causes de dissolution de la société, mais que sa poursuite n'est pas interdite si les parties y consentent, comme le précise la réponse."
  tr: "Bir soru soran kişi, ortaklardan birinin ölümü üzerine şirket hakkında verilen karar hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21714), ortaklardan birinin ölümünün şirketin feshedilmesinin nedenlerinden biri olarak kabul edildiğini ve taraflar arasında yanıtta detaylandırılanlar üzerinde anlaşma ve karşılıklı anlaşma sağlanırsa şirketin devamını engellemediğini yanıtladı."
  id: "Seorang penanya menanyakan tentang putusan perusahaan atas kematian salah satu mitra. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21714) menjawab bahwa kematian salah satu mitra dianggap sebagai salah satu penyebab pembubaran perusahaan dan tidak menghalangi kelanjutannya jika ada kesepakatan dan kesepakatan bersama antara para pihak mengenai rincian jawaban."
