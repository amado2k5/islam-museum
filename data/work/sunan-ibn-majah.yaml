summary:
  ar: "سنن ابن ماجه محمد بن يزيد القزويني (ت 273هـ): سادس الكتب الستة عند جمهور المتأخرين، تميز بأحاديث الزهد والفتن وبباب لم يرد في الصحيحين، وطبعته المشهورة طبعة محمد فؤاد عبد الباقي (القاهرة 1952–1953م)."
  en: "The Sunan of Ibn Majah Muhammad ibn Yazid al-Qazwini (d. 273 AH): counted sixth of the six books by later scholars, noted for its renunciation and tribulation material and for reports absent from the two Sahihs; the standard print is Muhammad Fu'ad Abd al-Baqi's (Cairo, 1952–1953)."
