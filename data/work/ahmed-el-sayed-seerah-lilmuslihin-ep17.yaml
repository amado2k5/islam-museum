kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 17: السرايا والاستعداد لغزوة بدر"
  en: "The Prophetic Biography for Reformers, episode 17: The Expeditions and the Preparation for the Battle of Badr"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 17: سرایا اور غزوہ بدر کی تیاری"
  fr: "La biographie prophétique pour les réformateurs, épisode 17 : Les expéditions et la préparation de la bataille de Badr"
  es: "La biografía profética para los reformadores, episodio 17: Las expediciones y la preparación de la batalla de Badr"
summary:
  ar: "يتناول المحاضر أحداث السنتين الأوليين في المدينة: وفاة أسعد بن زرارة، وزواج النبي بعائشة ووقائع من منزلتها في حياته، وأولى السرايا التي أُرسلت إلى قريش ومنها سرية عبد الله بن جحش إلى نخلة والآية التي نزلت بعدها. ثم يعدّد أولى الغزوات التي قادها النبي بنفسه، ويعرض الخروج إلى بدر واستشارة النبي للأنصار، ويختم بقصة سعد بن معاذ وأمية بن خلف."
  en: "The lecturer covers events of the first two years in Medina: the death of As'ad ibn Zurara, the Prophet's marriage to Aisha and anecdotes of her place in his life, and the first expeditions sent against Quraysh, including the Nakhla patrol of Abdullah ibn Jahsh and the revelation that followed it. He then lists the first raids led by the Prophet himself, outlines the departure for Badr and the Prophet's consultation of the Helpers, and ends with the story of Sa'd ibn Mu'adh and Umayya ibn Khalaf."
  ur: "مقرر مدینہ کے ابتدائی دو سالوں کے واقعات بیان کرتے ہیں: اسعد بن زرارہ کی وفات، نبی کا حضرت عائشہ سے نکاح اور آپ کی زندگی میں ان کے مقام کے واقعات، اور قریش کی طرف بھیجے گئے پہلے سرایا، جن میں عبداللہ بن جحش کا نخلہ کا سریہ اور اس کے بعد اترنے والی آیت شامل ہیں۔ پھر وہ ان پہلی غزوات کی فہرست دیتے ہیں جن میں نبی خود شریک ہوئے، بدر کی طرف روانگی اور انصار سے نبی کے مشورے کا ذکر کرتے ہیں، اور سعد بن معاذ اور امیہ بن خلف کے قصے پر ختم کرتے ہیں۔"
  fr: "Le conférencier traite des événements des deux premières années à Médine : la mort d'As'ad ibn Zurara, le mariage du Prophète avec Aïcha et des anecdotes sur sa place dans sa vie, puis les premières expéditions envoyées contre Quraych, dont la patrouille de Abdallah ibn Jahsh à Nakhla et le verset révélé ensuite. Il énumère ensuite les premiers raids menés par le Prophète en personne, expose le départ pour Badr et la consultation des Ansar par le Prophète, et termine par le récit de Sa'd ibn Mu'adh et d'Umayya ibn Khalaf."
  es: "El conferenciante trata los acontecimientos de los dos primeros años en Medina: la muerte de As'ad ibn Zurara, el matrimonio del Profeta con Aisha y anécdotas sobre su lugar en su vida, y las primeras expediciones enviadas contra los Quraysh, entre ellas la patrulla de Abdallah ibn Jahsh a Nakhla y el versículo revelado después. A continuación enumera las primeras incursiones dirigidas por el propio Profeta, expone la salida hacia Badr y la consulta del Profeta a los Ansar, y termina con la historia de Sa'd ibn Mu'adh y Umayya ibn Khalaf."
