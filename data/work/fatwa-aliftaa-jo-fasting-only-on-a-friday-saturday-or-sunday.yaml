id: work/fatwa-aliftaa-jo-fasting-only-on-a-friday-saturday-or-sunday
class: work
kind: fatwa
label: { ar: "إفراد الجمعة أو السبت أو الأحد بالصوم", en: "Fasting a Friday, Saturday or Sunday on its own", ur: "جمعہ، ہفتہ یا اتوار کا اکیلا روزہ", es: "Ayunar un viernes, sábado o domingo por sí solo", fr: "Jeûner un vendredi, un samedi ou un dimanche en soi", tr: "Cuma, Cumartesi veya Pazar oruç", id: "Puasa pada hari Jumat, Sabtu, atau Minggu" }
summary:
  ar: "سؤال عن إفراد الجمعة أو السبت أو الأحد بالصوم، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يكره في النفل المطلق إفراد أحد هذه الأيام بالصوم، ولا كراهة إن ضُم إليه يوم قبله أو بعده أو وافق يومًا يسن صيامه. أجابت الدائرة بأنه يكره في صيام النافلة المطلقة إفراد يوم الجمعة، وإفراد يوم السبت، وإفراد يوم الأحد بالصيام. وقالت إنه لا بأس إن صام مع الجمعة يومًا قبلها أو بعدها، وكذا السبت والأحد، ولا كراهة إن صام الجمعة والسبت والأحد معًا. وأضافت أنه إذا وافق أحد هذه الأيام يومًا يسن صيامه، كيوم عرفة أو عاشوراء، فلا كراهة في إفراد صومه."
  en: "A question about fasting a Friday, Saturday or Sunday on its own, in which Jordan's General Iftaa Department answered that for an unrestricted voluntary fast it is disliked to single out any of these days, and that there is no dislike if a day before or after is added or the day coincides with a day it is sunna to fast. The Department answered that for an unrestricted voluntary fast it is disliked to single out a Friday, a Saturday or a Sunday for fasting. It said there is no harm if one fasts a day before or after the Friday, and likewise with Saturday and Sunday, and no dislike in fasting Friday, Saturday and Sunday together. It added that if one of these days coincides with a day it is sunna to fast, such as the day of Arafa or Ashura, there is no dislike in fasting it on its own."
  ur: "جمعہ، ہفتہ یا اتوار کا اکیلا روزہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مطلق نفلی روزے میں ان میں سے کسی دن کو اکیلا روزے کے لیے خاص کرنا مکروہ ہے، اور اگر ساتھ پہلے یا بعد کا دن ملا لیا جائے یا وہ کسی مسنون روزے کے دن سے آ ملے تو کراہت نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مطلق نفلی روزے میں جمعہ، ہفتہ یا اتوار کو اکیلا روزے کے لیے خاص کرنا مکروہ ہے۔ اس نے کہا کہ اگر جمعہ کے ساتھ ایک دن پہلے یا بعد کا روزہ رکھا جائے تو حرج نہیں، ہفتہ اور اتوار کا بھی یہی حکم ہے، اور جمعہ، ہفتہ اور اتوار تینوں اکٹھے رکھنے میں کراہت نہیں۔ اس نے مزید کہا کہ اگر ان میں سے کوئی دن کسی ایسے دن سے آ ملے جس کا روزہ مسنون ہے، جیسے یوم عرفہ یا عاشورا، تو اکیلا روزہ رکھنے میں کراہت نہیں۔"
  es: "Una pregunta sobre ayunar un viernes, sábado o domingo por sí solos, en la que el Departamento General de Iftaa de Jordania respondió que para un ayuno voluntario sin restricciones no es recomendable ayunar solo uno de estos días, y que no hay inconveniente si se agrega un día antes o después, o si el día coincide con un día en el que es sunna ayunar. El Departamento respondió que para un ayuno voluntario sin restricciones no es recomendable ayunar solo un viernes, un sábado o un domingo. Dijo que no hay problema si uno ayuna un día antes o después del viernes, y lo mismo con el sábado y el domingo, y no hay inconveniente en ayunar el viernes, el sábado y el domingo juntos. Agregó que si uno de estos días coincide con un día en el que es sunna ayunar, como el día de Arafa o Ashura, no hay inconveniente en ayunar solo ese día."
  fr: "Concernant la question du jeûne isolé du vendredi, du samedi ou du dimanche, le Département général de la Iftaa de Jordanie a répondu que, pour un jeûne volontaire sans restriction, il est déconseillé de jeûner uniquement l'un de ces jours. Il n'y a cependant aucune réticence à jeûner un jour avant ou après le vendredi, ni le samedi ou le dimanche, et encore moins à jeûner ces trois jours ensemble. Le Département a précisé qu'il n'y a aucun inconvénient à jeûner un jour avant ou après le vendredi, ni le samedi ou le dimanche, et qu'il n'y a aucune réticence à jeûner le vendredi, le samedi et le dimanche ensemble. Il a ajouté que si l'un de ces jours coïncide avec un jour de jeûne sunna, comme le jour d'Arafat ou d'Achoura, il n'y a aucune réticence à jeûner ce jour-là seul."
  tr: "Cuma, Cumartesi veya Pazar oruç ile ilgili ayrı bir soruya Ürdün Genel Fetva Dairesi yanıtladı; mutlak gönüllü namazın bu günlerden birinde oruç tutmasının hoş karşılanmadığını, bir gün önce mi yoksa sonra mı eklenip eklenmediğine ya da Sünnet orucuyla çakışıp çakışmadığına dair bir hoşnutsuzluk yoktur. Daire, Cuma, Cumartesi ve Pazar günlerini oruç tutmak için mutlak gönüllü oruç yapmanın hoş karşılanmadığını belirtti. Cuma ile bir gün öncesi veya sonra, ayrıca Cumartesi ve Pazar oruç tutmanın zararı olmadığını, ayrıca Cuma, Cumartesi ve Pazar günlerini birlikte oruç tutmanın da hoşnutsuzluk olmadığını belirtti. Ayrıca, bu günlerden biri Sünnet olan bir güne denk geliyorsa, örneğin Arafah veya Aşura Günü, ayrı ayrı oruç tutmakta bir hoşnutsuzluk olmadığını belirtti."
  id: "Pertanyaan tentang puasa Jumat, Sabtu, atau Minggu secara terpisah dijawab oleh Departemen Fatwa Umum Yordania bahwa tidak disukai untuk berpuasa sukarela mutlak pada salah satu hari tersebut, dan tidak ada ketidaksukaan jika hari sebelumnya atau sesudah ditambahkan atau bertepatan dengan hari puasa Sunnah. Departemen menjawab bahwa tidak disukai untuk memisahkan puasa Jumat, Sabtu, dan Minggu untuk puasa secara sukarela. Departemen tersebut mengatakan tidak ada salahnya jika puasa pada hari Jumat sehari sebelumnya atau sesudahnya, serta Sabtu dan Minggu, juga tidak ada ketidaksukaan jika puasa Jumat, Sabtu, dan Minggu bersama. Departemen menambahkan bahwa jika salah satu hari ini bertepatan dengan hari yang puasanya adalah Sunnah, seperti Hari Arafah atau Ashura, tidak ada ketidaksukaan untuk berpuasa secara terpisah."
