id: work/fatwa-aliftaa-jo-fasting-only-on-a-friday-saturday-or-sunday
class: work
kind: fatwa
label: { ar: "إفراد الجمعة أو السبت أو الأحد بالصوم", en: "Fasting a Friday, Saturday or Sunday on its own", ur: "جمعہ، ہفتہ یا اتوار کا اکیلا روزہ" }
summary:
  ar: "سؤال عن إفراد الجمعة أو السبت أو الأحد بالصوم، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يكره في النفل المطلق إفراد أحد هذه الأيام بالصوم، ولا كراهة إن ضُم إليه يوم قبله أو بعده أو وافق يومًا يسن صيامه. أجابت الدائرة بأنه يكره في صيام النافلة المطلقة إفراد يوم الجمعة، وإفراد يوم السبت، وإفراد يوم الأحد بالصيام. وقالت إنه لا بأس إن صام مع الجمعة يومًا قبلها أو بعدها، وكذا السبت والأحد، ولا كراهة إن صام الجمعة والسبت والأحد معًا. وأضافت أنه إذا وافق أحد هذه الأيام يومًا يسن صيامه، كيوم عرفة أو عاشوراء، فلا كراهة في إفراد صومه."
  en: "A question about fasting a Friday, Saturday or Sunday on its own, in which Jordan's General Iftaa Department answered that for an unrestricted voluntary fast it is disliked to single out any of these days, and that there is no dislike if a day before or after is added or the day coincides with a day it is sunna to fast. The Department answered that for an unrestricted voluntary fast it is disliked to single out a Friday, a Saturday or a Sunday for fasting. It said there is no harm if one fasts a day before or after the Friday, and likewise with Saturday and Sunday, and no dislike in fasting Friday, Saturday and Sunday together. It added that if one of these days coincides with a day it is sunna to fast, such as the day of Arafa or Ashura, there is no dislike in fasting it on its own."
  ur: "جمعہ، ہفتہ یا اتوار کا اکیلا روزہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مطلق نفلی روزے میں ان میں سے کسی دن کو اکیلا روزے کے لیے خاص کرنا مکروہ ہے، اور اگر ساتھ پہلے یا بعد کا دن ملا لیا جائے یا وہ کسی مسنون روزے کے دن سے آ ملے تو کراہت نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مطلق نفلی روزے میں جمعہ، ہفتہ یا اتوار کو اکیلا روزے کے لیے خاص کرنا مکروہ ہے۔ اس نے کہا کہ اگر جمعہ کے ساتھ ایک دن پہلے یا بعد کا روزہ رکھا جائے تو حرج نہیں، ہفتہ اور اتوار کا بھی یہی حکم ہے، اور جمعہ، ہفتہ اور اتوار تینوں اکٹھے رکھنے میں کراہت نہیں۔ اس نے مزید کہا کہ اگر ان میں سے کوئی دن کسی ایسے دن سے آ ملے جس کا روزہ مسنون ہے، جیسے یوم عرفہ یا عاشورا، تو اکیلا روزہ رکھنے میں کراہت نہیں۔"
