id: work/fatwa-aliftaa-jo-taking-zakat-while-holding-an-emergency-fund
class: work
kind: fatwa
label: { ar: "أخذ الزكاة مع امتلاك مال مدخر للطوارئ", en: "Taking zakat while holding an emergency fund", ur: "ہنگامی فنڈ رکھتے ہوئے زکوٰۃ لینا" }
summary:
  ar: "سؤال من شركاء في بقالة ادخروا مالًا للطوارئ ورواتبهم لا تكفيهم، أجابت فيه دائرة الإفتاء العام الأردنية بأن الزكاة تجب في المال المدخر إذا بلغ النصاب وحال عليه الحول، ولا يجوز للمزكي أن يأخذ من زكاة ماله لنفسه. أجابت الدائرة بأن من ملك نصابًا وحال عليه الحول وجب عليه إخراج الزكاة لمستحقيها، بصرف النظر عن سبب ادخار المال، وأن الله حدد مصارفها في القرآن. وقالت إنه يشترط ألا يخرجها المزكي لنفسه، لأن ذلك لا يعد إخراجًا ولا تمليكًا، فلا يكون مزكيًا ومستحقًا في وقت واحد، ولا يعطيها لمن تلزمه نفقته باسم الفقر والمسكنة، ونقلت ذلك عن الخطيب الشربيني في الإقناع. وخلصت إلى أنه لا يجوز للمزكي أن يأخذ لنفسه من زكاة ماله، ولا أن يعطيها لمن تلزمه نفقتهم كالوالدين والزوجة والأولاد الصغار باسم الفقر، وهو يملك من المال المدخر ما يستطيع أن ينفق منه."
  en: "A question from partners in a grocery who saved an emergency fund while their salaries fall short, in which Jordan's General Iftaa Department answered that zakat is due on saved money that reaches the threshold and completes a year, and that the payer may not take his own zakat for himself. The Department answered that whoever owns the threshold amount for a full year must pay zakat to those entitled to it, whatever the reason for saving the money, and that God set out its recipients in the Qur'an. It said the payer may not pay it to himself, since that is neither paying nor transferring ownership, so he cannot be payer and recipient at once; nor may he give it, as relief for poverty, to those he must maintain; it quoted al-Khatib al-Shirbini's al-Iqna' on this. It concluded that the payer may not take his own zakat for himself, nor give it as poverty relief to dependants such as parents, wife and young children, while he holds savings he can spend from."
  ur: "کریانے کی دکان کے شراکت داروں کا سوال جنہوں نے ہنگامی فنڈ جمع کیا اور ان کی تنخواہیں ناکافی ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جمع شدہ مال نصاب کو پہنچ کر سال گزرنے پر اس میں زکوٰۃ واجب ہے، اور زکوٰۃ دینے والا اپنی زکوٰۃ خود نہیں لے سکتا۔ ڈیپارٹمنٹ نے جواب دیا کہ جو نصاب کا مالک ہو اور اس پر سال گزر جائے اس پر مستحقین کو زکوٰۃ دینا واجب ہے، مال جمع کرنے کی وجہ کچھ بھی ہو، اور اللہ نے قرآن میں اس کے مصارف متعین کیے ہیں۔ اس نے کہا کہ زکوٰۃ دینے والا اسے اپنے لیے نہیں نکال سکتا، کیونکہ یہ نہ نکالنا ہے نہ مالک بنانا، لہٰذا وہ ایک ہی وقت میں دینے والا اور مستحق نہیں ہو سکتا؛ نہ وہ فقر کے نام پر اسے ان لوگوں کو دے سکتا ہے جن کا نفقہ اس پر لازم ہے؛ اس نے اس بارے میں خطیب شربینی کی الاقناع سے نقل کیا۔ اس نے نتیجہ نکالا کہ زکوٰۃ دینے والا اپنی زکوٰۃ سے اپنے لیے نہیں لے سکتا، نہ اسے فقر کے نام پر والدین، بیوی اور چھوٹے بچوں جیسے زیرِ کفالت افراد کو دے سکتا ہے، جبکہ اس کے پاس جمع شدہ مال ہو جس سے وہ خرچ کر سکے۔"
