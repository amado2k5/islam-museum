label: { ar: "أبيات قيس بن زهير «شفيت النفس من حمل بن بدر»", en: "Qays ibn Zuhayr's verses 'I healed my soul from Hamal ibn Badr'", es: "Versos de Qays ibn Zuhayr: \"Sané mi alma de Hamal ibn Badr\".", fr: "Vers de Qays ibn Zuhayr: « J'ai guéri mon âme de Hamal ibn Badr »", ur: "قیس بن زہیر کی آیات 'میں نے اپنی روح کو حمال بن بدر سے شفا دی'", tr: "Kays ibn Zuhayr'ın ayetleri: 'Ruhu Bedr'in yükünden iyileştirdim'", id: "Ayat-ayat Qais ibn Zuhayr: 'Aku menyembuhkan jiwa dari beban Badr'" }
summary:
  ar: "بيتان في ديوان الحماسة من الوافر على روي النون، لقيس بن زهير العبسي في قتله حمل بن بدر يوم جفر الهباءة {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  en: "Two verses in the Diwan al-Hamasa in the wafir metre on the rhyme nun, by Qays ibn Zuhayr al-Absi on killing Hamal ibn Badr on the day of Jafr al-Haba'a {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  es: "Dos versos en el Diwan al-Hamasa en metro wafir sobre la rima nun, de Qays ibn Zuhayr al-Absi sobre el asesinato de Hamal ibn Badr el día de Jafr al-Haba'a {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  fr: "Deux versets du Diwan al-Hamasa en mètre wafir sur la rime nun, par Qays ibn Zuhayr al-Absi sur le meurtre de Hamal ibn Badr le jour de Jafr al-Haba'a {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  ur: "دو آیات دیوان الحمسہ میں وفیر میٹر میں شاعری نون پر، قیس بن زہیر العبسی کی طرف سے حمال بن بدر کو جعفر الحباء کے دن قتل کرنے پر {{حوالہ: حماسہ ابو تمام ایڈ-1916 صفحہ 57}}۔"
  tr: "Qays ibn Zuhayr al-Absi'nin Jafr al-Haba'ah gününde Hamal ibn Badr'ı öldürmesiyle ilgili Al-Wafir 'ala Rawi al-Nun'dan Al-Hamasa Diwanı'nda iki ayet {{cite:hamasa-abu-tammam-ed-1916 s.57}}."
  id: "Dua ayat dalam Diwan Al-Hamasa dari Al-Wafir 'ala Rawi al-Nun, oleh Qays ibn Zuhayr al-Absi dalam pembunuhan Hamal ibn Badr pada hari Jafr al-Haba'ah {{cite:hamasa-abu-tammam-ed-1916 hlm.57}}."
