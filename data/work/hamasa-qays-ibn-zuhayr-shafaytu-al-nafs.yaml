  ar: "بيتان في ديوان الحماسة من الوافر على روي النون، لقيس بن زهير العبسي في قتله حمل بن بدر يوم جفر الهباءة {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  en: "Two verses in the Diwan al-Hamasa in the wafir metre on the rhyme nun, by Qays ibn Zuhayr al-Absi on killing Hamal ibn Badr on the day of Jafr al-Haba'a {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  es: "Dos versos en el Diwan al-Hamasa en metro wafir sobre la rima nun, de Qays ibn Zuhayr al-Absi sobre el asesinato de Hamal ibn Badr el día de Jafr al-Haba'a {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  fr: "Deux versets du Diwan al-Hamasa en mètre wafir sur la rime nun, par Qays ibn Zuhayr al-Absi sur le meurtre de Hamal ibn Badr le jour de Jafr al-Haba'a {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
