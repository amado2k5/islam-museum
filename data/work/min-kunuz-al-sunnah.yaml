summary:
  ar: "سلسلة لعمر عبد الكافي يقف فيها عند أحاديث من السنة النبوية ويشرح معانيها ويستخلص منها دروسًا، وفق تسجيلات أسبابيل."
  en: "A series by Omar Abdelkafy that pauses at hadiths from the Prophetic Sunna, explains their meanings and draws lessons from them, as recorded in the Assabile archive."
  ur: "عمر عبد الکافی کی سلسلہ وار گفتگو جس میں وہ سنتِ نبوی کی احادیث پر رکتے ہیں، ان کے معنی بیان کرتے ہیں اور ان سے سبق نکالتے ہیں، اسابیل کے ذخیرے کے مطابق۔"
