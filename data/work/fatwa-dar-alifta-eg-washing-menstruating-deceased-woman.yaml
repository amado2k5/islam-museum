id: work/fatwa-dar-alifta-eg-washing-menstruating-deceased-woman
class: work
kind: fatwa
label: { ar: "كيفية تغسيل المرأة إذا ماتت وهي حائض", en: "How to wash a woman who died while menstruating", ur: "حائضہ کی وفات پر اس کا غسل", es: "Cómo lavar a una mujer que murió durante la menstruación.", fr: "Comment laver le corps d'une femme décédée pendant ses menstruations" }
summary:
  ar: "سائل سأل عن كيفية تغسيل المرأة إذا ماتت وهي حائض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21561)⁩ أنها إذا ماتت وهي حائض فإنها كغيرها من أموات المسلمين تغسل غسلًا واحدًا هو غسل الموت على ما فصّل الجواب."
  en: "A questioner asked how to wash a woman who died while menstruating. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21561) answered that she is washed like other Muslim dead — a single washing, the washing of death — as the answer details."
  ur: "ایک سائل نے حائضہ کی وفات پر اس کے غسل کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21561)⁩ نے جواب دیا کہ وہ دوسرے مسلمان میتوں کی طرح ایک ہی غسل دی جاتی ہے جو غسلِ موت ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó cómo lavar a una mujer que murió durante la menstruación. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21561) respondió que se la lava como a cualquier otro musulmán fallecido: un solo lavado, el lavado de la muerte, como se detalla en la respuesta."
  fr: "Une personne a demandé comment laver le corps d'une femme décédée pendant ses menstruations. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21561) a répondu qu'elle est lavée comme les autres défunts musulmans: une seule toilette, la toilette mortuaire, comme le précise la réponse."
