kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 19: تبعات غزوة بدر"
  en: "The Prophetic Biography for Reformers, episode 19: The consequences of the Battle of Badr"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 19: غزوۂ بدر کے نتائج"
  fr: "La biographie prophétique pour les réformateurs, épisode 19 : Les conséquences de la bataille de Badr"
  es: "La biografía profética para los reformadores, episodio 19: Las consecuencias de la batalla de Badr"
summary:
  ar: "يختم في هذا المجلس حديثه عن غزوة بدر بإضافة مشاهد كان قد تركها، ثم ينتقل إلى تبعاتها: الاستشارة في شأن الأسرى، والاختلاف في الغنائم، والصدمة في المدينة ومكة، والنفاق المعلن، ورغبة الثأر التي أفضت إلى سرية الرجيع وإلى غزوة أحد، ومكانة البدريين. ثم يتناول أحداث السنة الثانية، وقصة ناقتي علي وحمزة، والتدرج في تحريم الخمر، ونوعي الفرقان بين الحق والباطل."
  en: "He closes his treatment of the Battle of Badr by adding scenes he had left out and then turns to its consequences: the council on the captives, the quarrel over the spoils, the shock in Medina and Mecca, the open hypocrisy, the thirst for revenge that led to the incident of al-Raji and to Uhud, and the status of the Badr veterans. He then covers events of the second year, the story of Ali's two she-camels and Hamza, the gradual prohibition of wine, and the two kinds of criterion between truth and falsehood."
  ur: "وہ غزوۂ بدر پر اپنی گفتگو کو ان مناظر کے اضافے کے ساتھ مکمل کرتے ہیں جو انہوں نے چھوڑ دیے تھے، پھر اس کے نتائج کی طرف آتے ہیں: قیدیوں کے بارے میں مشورہ، مال غنیمت پر اختلاف، مدینہ اور مکہ میں صدمہ، کھلا نفاق، انتقام کی وہ خواہش جو سریۂ رجیع اور احد تک پہنچی، اور اہل بدر کا مقام۔ پھر وہ دوسرے سال کے واقعات، علی کی دو اونٹنیوں اور حمزہ کا قصہ، شراب کی حرمت میں تدریج، اور حق و باطل کے درمیان فرقان کی دو قسمیں بیان کرتے ہیں."
  fr: "Il achève son exposé sur la bataille de Badr en ajoutant des scènes qu'il avait omises, puis il passe à ses conséquences : la consultation sur les prisonniers, la querelle sur le butin, le choc à Médine et à La Mecque, l'hypocrisie affichée, la soif de vengeance qui mena à l'épisode d'al-Raji et à Uhud, et le rang des vétérans de Badr. Il traite ensuite des événements de la deuxième année, de l'histoire des deux chamelles d'Ali et de Hamza, de l'interdiction progressive du vin et des deux sortes de critère entre le vrai et le faux."
  es: "Cierra su tratamiento de la batalla de Badr añadiendo escenas que había omitido y luego pasa a sus consecuencias: la consulta sobre los cautivos, la disputa por el botín, la conmoción en Medina y La Meca, la hipocresía declarada, el afán de venganza que condujo al episodio de al-Raji y a Uhud, y el rango de los veteranos de Badr. Después trata los sucesos del segundo año, la historia de las dos camellas de Ali y Hamza, la prohibición gradual del vino y las dos clases de criterio entre la verdad y la falsedad."
