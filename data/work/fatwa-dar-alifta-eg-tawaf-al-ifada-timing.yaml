class: work
kind: fatwa
label: { ar: "وقت طواف الإفاضة في الحج", en: "The time of tawaf al-ifada in Hajj", ur: "حج میں طوافِ افاضہ کا وقت", es: "El momento del tawaf al-ifada en el Hajj", fr: "Le temps du tawaf al-ifada au Hajj", tr: "Hac sırasında Tevaf el-İfade zamanı", id: "Waktu untuk Tawaf al-Ifadah selama Haji" }
summary:
  ar: "سائل قام بطواف الإفاضة في اليوم الثاني من أيام التشريق فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21931)⁩ أن طوافه صحيح شرعًا ومجزئ ولا شيء عليه فطواف الإفاضة ركن من أركان الحج ووقته موسع على ما فصّل الجواب."
  en: "A man performed tawaf al-ifada on the second of the tashriq days and asked its ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21931) answered that his tawaf is valid and sufficient — nothing is on him — for tawaf al-ifada is a pillar of Hajj and its time is broad, as the answer details."
  ur: "ایک شخص نے تشریک کے دوسرے دن طوافِ افاضہ کیا اور اس کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21931)⁩ نے جواب دیا کہ اس کا طواف صحیح اور کافی ہے اور اس پر کچھ نہیں کیونکہ طوافِ افاضہ حج کا رکن ہے اور اس کا وقت وسیع ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre realizó el tawaf al-ifada el segundo de los días de tashriq y preguntó sobre su dictamen. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21931) respondió que su tawaf es válido y suficiente —no hay nada que reprocharle—, ya que el tawaf al-ifada es un pilar del Hajj y su duración es amplia, como se detalla en la respuesta."
  fr: "Un homme a accompli le tawaf al-ifada le deuxième jour de Tashriq et a demandé la validité de sa fatwa. Le Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21931) a répondu que son tawaf était valide et suffisant – aucune faute ne lui est reprochée – car le tawaf al-ifada est un pilier du Hajj et sa période d'accomplissement est flexible, comme le précise la réponse."
  tr: "Bir soru soran kişi Taşrik'in ikinci gününde Tevaf el-İfade okudu ve hükmü hakkında sorular soruldu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21931), Tevafının İslam hukukuna göre geçerli, yeterli olduğunu ve üzerinde hiçbir şey olmadığını yanıtladı; bu nedenle Tevaf İfade Hacın bir direği ve süresinin uzatıldığı cevabında ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya melaksanakan Tawaf al-Ifadah pada hari kedua Tashreeq dan ditanya tentang keputusannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21931) menjawab bahwa Tawafnya sah menurut hukum Islam, cukup, dan tidak ada apa pun di dalamnya, sehingga Tawaf al-Ifadah adalah tiang Haji dan waktunya diperpanjang, seperti yang dijelaskan dalam jawabannya."
