label: { ar: "الاعتبار في بيان الناسخ والمنسوخ من الآثار", en: "Kitab al-I'tibar fi bayan al-nasikh wal-mansukh min al-athar", ur: "کتاب الاعتبار فی بیان الناسخ والمنسخ من الاطہر", tr: "İptal Eden ve İptal Edilen Raporların Açıklığa Kavuşturulmasında Dikkate Alınması", id: "Pertimbangan dalam Klarifikasi Laporan yang Membatalkan dan Yang Dibatalkan" }
summary:
  ar: "«كتاب الاعتبار في بيان الناسخ والمنسوخ من الآثار» لأبي بكر محمد بن موسى الحازمي الهمذاني ⁦(ت 584هـ)⁩: كتاب في معرفة ما نسخ من الأحاديث والآثار وما بقي محكماً، يبدأ مقدمته بتعظيم هذا العلم وبيان صعوبته، ويستشهد بأقوال الصحابة والتابعين وفقهاء الأمصار في أهميته. {cite:itibar-hazimi-1359 p. 5}"
  en: "Abu Bakr Muhammad ibn Musa al-Hazimi al-Hamadhani's (d. 584 AH) book on which hadith and reports were abrogated and which remain in force. Its opening presents the subject as difficult and important and gathers statements from Companions, Successors and jurists about it. {cite:itibar-hazimi-1359 p. 5}"
  es: "El libro de Abu Bakr Muhammad ibn Musa al-Hazimi al-Hamadhani (fallecido en el año 584 de la Hégira) sobre el cual se abrogaron hadices e informes que aún permanecen vigentes. Su introducción presenta el tema como complejo e importante, y recopila declaraciones de Compañeros, Sucesores y juristas al respecto. {cite:itibar-hazimi-1359 p. 5}"
  fr: "L'ouvrage d'Abu Bakr Muhammad ibn Musa al-Hazimi al-Hamadhani (mort en 584 AH) sur lequel des hadiths et des récits ont été abrogés, mais qui restent en vigueur, présente le sujet comme complexe et important dès son introduction et rassemble des déclarations de Compagnons, de Successeurs et de juristes à ce sujet. {cite:itibar-hazimi-1359 p. 5}"
  ur: "ابوبکر محمد بن موسیٰ الہیثمی الحمدانی ⁦(متوفی 584ھ)⁩ کی وہ کتاب جس پر احادیث اور روایتیں منسوخ ہوگئیں اور جو ابھی تک موجود ہیں۔ اس کا آغاز اس موضوع کو مشکل اور اہم کے طور پر پیش کرتا ہے اور اس کے بارے میں صحابہ، جانشینوں اور فقہاء کے بیانات جمع کرتا ہے۔ {حوالہ: اعتبار حاظمی-1359 ص۔ 5}"
  tr: "\"Kitab al-I'tibar fi Bayan al-Nasikh wa al-Amukh min al-Athar\" Ebu Bekir Muhammed bin Musa el-Hazmi el-Hamadhani tarafından (ö. 584 H.): Hangi hadislerin ve göredeklerin kaldırıldığını ve hangilerinin kesin kaldığını bilmeye dair bir kitap. Girişi, bu bilimi yüceltmek ve zorluklarını açıklamakla başlar; bölgelerin Sahabeleri, Takipçileri ve hukukçularının önemine dair sözlerini aktarır. {atıf:itibar-hazimi-1359 s. 5}"
  id: "\"Kitab al-I'tibar fi Bayan al-Nasikh wa al-Amukh min al-Athar\" oleh Abu Bakr Muhammad ibn Musa al-Hazmi al-Hamadhani (wafat 584 H): Sebuah buku tentang mengetahui hadis dan tradisi mana yang dibatalkan dan apa yang tetap definitif. Pengantarnya dimulai dengan memuliakan ilmu ini dan menjelaskan kesulitannya, mengutip perkataan Para Sahabat, Pengikut, dan ahli hukum wilayah mengenai pentingnya. {cite:itibar-hazimi-1359 hlm. 5}"
