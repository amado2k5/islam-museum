summary:
  ar: "«كتاب الاعتبار في بيان الناسخ والمنسوخ من الآثار» لأبي بكر محمد بن موسى الحازمي الهمذاني (ت 584هـ): كتاب في معرفة ما نسخ من الأحاديث والآثار وما بقي محكماً، يبدأ مقدمته بتعظيم هذا العلم وبيان صعوبته، ويستشهد بأقوال الصحابة والتابعين وفقهاء الأمصار في أهميته. {cite:itibar-hazimi-1359 p. 5}"
  en: "Abu Bakr Muhammad ibn Musa al-Hazimi al-Hamadhani's (d. 584 AH) book on which hadith and reports were abrogated and which remain in force. Its opening presents the subject as difficult and important and gathers statements from Companions, Successors and jurists about it. {cite:itibar-hazimi-1359 p. 5}"
