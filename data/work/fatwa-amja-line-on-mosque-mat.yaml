id: work/fatwa-amja-line-on-mosque-mat
class: work
kind: fatwa
label: { ar: "خط على حصير المسجد", en: "Drawing a line on the mosque mat for the row's alignment", ur: "مسجد کی چٹائی پر صف کی لکیر", es: "Trazar una línea en la alfombra de la mezquita para la alineación de la fila." }
summary:
  ar: "سأل سائل عن حكم عمل خط على حصير المسجد بقصد انتظام الصف نظرًا لانحراف القبلة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21986 بتاريخ 14 أكتوبر 2012)⁩ ناقلة عن اللجنة الدائمة للبحوث العلمية والإفتاء أنه لا بأس بذلك وإن صلوا في مثل ذلك بلا خط فلا بأس لأن الميل اليسير لا يضر على ما فصّل الجواب."
  en: "A questioner asked the ruling on drawing a line on the mosque mat to align the row where the qibla is slanted. AMJA's fatwa committee (fatwa no. 21986, 14 October 2012) relayed the Permanent Committee's answer: there is no harm in it, and if they pray there without a line there is no harm either, since a slight tilt does not hurt — as the answer states."
  ur: "چٹائی پر صف کی لکیر؟ لجنة الفتوى ⁦(فتویٰ 21986، 14 اکتوبر 2012)⁩ نے اللجنة الدائمة کا جواب نقل کیا: دونوں صورتیں جائز۔"
  es: "Un consultante preguntó sobre la conveniencia de trazar una línea en la alfombra de la mezquita para alinear la fila donde la qibla está inclinada. El comité de fatuas de AMJA (fatua n.° 21986, 14 de octubre de 2012) transmitió la respuesta del Comité Permanente: no hay ningún inconveniente, y si rezan allí sin una línea tampoco hay inconveniente, ya que una ligera inclinación no causa daño, como se indica en la respuesta."
