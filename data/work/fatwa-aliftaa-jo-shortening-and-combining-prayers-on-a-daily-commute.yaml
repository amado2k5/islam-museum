id: work/fatwa-aliftaa-jo-shortening-and-combining-prayers-on-a-daily-commute
class: work
kind: fatwa
label: { ar: "الجمع والقصر مع تكرر السفر يوميًا", en: "Shortening and combining prayers when travelling daily", ur: "روزانہ سفر میں قصر اور جمع" }
summary:
  ar: "سؤال عن الجمع والقصر مع تكرر السفر يوميًا، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز القصر والجمع في السفر المباح لمسافة 81 كم فأكثر بعد مجاوزة العمران، ولو تكرر السفر يوميًا. أجابت الدائرة بأنه يجوز للمسافر أن يترخص بالقصر والجمع لمسافة 81 كم فأكثر، بشرط أن يكون سفره مباحًا، وأن يبدأ بعد الشروع في السفر ومجاوزة عمران مدينته أو الحدود الإدارية لمنطقته. وقالت إن المسافة بين مكان العمل ومكان الإقامة إن بلغت مسافة الرخصة جاز الجمع والقصر عند مفارقة العمران ولو كان السفر متكررًا يوميًا. ونقلت عن الخطيب الشربيني في مغني المحتاج (1/529) جواز جمع التقديم والتأخير في السفر الطويل المباح، وأن جمع التأخير ثابت في الصحيحين من حديث أنس بن مالك وعبد الله بن عمر، وأن جمع التقديم صححه ابن حبان والبيهقي من حديث معاذ بن جبل وحسّنه الترمذي."
  en: "A question about shortening and combining prayers when travelling daily, in which Jordan's General Iftaa Department answered that shortening and combining are permitted on permissible travel of 81 km or more once the built-up area is left, even if the journey is repeated daily. The Department answered that a traveller may shorten and combine prayers for a distance of 81 km or more, provided the journey is permissible and he begins only after setting out and leaving the built-up area of his town or the administrative boundary of his area. It said that if the distance between workplace and residence reaches the distance for the concession, shortening and combining are permitted on leaving the built-up area, even if the journey is repeated daily. It quoted al-Khatib al-Shirbini in Mughni al-Muhtaj (1/529) that advancing and delaying combinations are permitted on long permissible journeys, that delayed combining is established in the two Sahihs from the hadith of Anas ibn Malik and Abdullah ibn Umar, and that advanced combining was graded authentic by Ibn Hibban and al-Bayhaqi from the hadith of Mu'adh ibn Jabal and graded hasan by al-Tirmidhi."
  ur: "روزانہ سفر میں قصر اور جمع کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ 81 کلومیٹر یا زیادہ کے جائز سفر میں آبادی سے نکلنے کے بعد قصر اور جمع جائز ہے، چاہے سفر روزانہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ مسافر 81 کلومیٹر یا زیادہ کی مسافت پر قصر اور جمع کی رخصت لے سکتا ہے، بشرطیکہ سفر جائز ہو اور وہ سفر شروع کر کے اپنے شہر کی آبادی یا اپنے علاقے کی انتظامی حدود سے نکلنے کے بعد آغاز کرے۔ اس نے کہا کہ اگر کام کی جگہ اور رہائش کے درمیان فاصلہ رخصت کی مسافت تک پہنچے تو آبادی سے نکلتے ہی قصر اور جمع جائز ہے، چاہے سفر روزانہ ہو۔ اس نے مغنی المحتاج (1/529) میں خطیب شربینی سے نقل کیا کہ طویل جائز سفر میں جمعِ تقدیم اور جمعِ تاخیر جائز ہے، جمعِ تاخیر صحیحین میں انس بن مالک اور عبداللہ بن عمر کی حدیث سے ثابت ہے، اور جمعِ تقدیم کو ابن حبان اور بیہقی نے معاذ بن جبل کی حدیث سے صحیح اور ترمذی نے حسن کہا۔"
