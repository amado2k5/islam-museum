id: work/fatwa-aliftaa-jo-shortening-and-combining-prayers-on-a-daily-commute
class: work
kind: fatwa
label: { ar: "الجمع والقصر مع تكرر السفر يوميًا", en: "Shortening and combining prayers when travelling daily", ur: "روزانہ سفر میں قصر اور جمع", es: "Acortar y combinar oraciones al viajar diariamente", fr: "Raccourcir et combiner les prières lors des déplacements quotidiens" }
summary:
  ar: "سؤال عن الجمع والقصر مع تكرر السفر يوميًا، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز القصر والجمع في السفر المباح لمسافة 81 كم فأكثر بعد مجاوزة العمران، ولو تكرر السفر يوميًا. أجابت الدائرة بأنه يجوز للمسافر أن يترخص بالقصر والجمع لمسافة 81 كم فأكثر، بشرط أن يكون سفره مباحًا، وأن يبدأ بعد الشروع في السفر ومجاوزة عمران مدينته أو الحدود الإدارية لمنطقته. وقالت إن المسافة بين مكان العمل ومكان الإقامة إن بلغت مسافة الرخصة جاز الجمع والقصر عند مفارقة العمران ولو كان السفر متكررًا يوميًا. ونقلت عن الخطيب الشربيني في مغني المحتاج (1/529) جواز جمع التقديم والتأخير في السفر الطويل المباح، وأن جمع التأخير ثابت في الصحيحين من حديث أنس بن مالك وعبد الله بن عمر، وأن جمع التقديم صححه ابن حبان والبيهقي من حديث معاذ بن جبل وحسّنه الترمذي."
  en: "A question about shortening and combining prayers when travelling daily, in which Jordan's General Iftaa Department answered that shortening and combining are permitted on permissible travel of 81 km or more once the built-up area is left, even if the journey is repeated daily. The Department answered that a traveller may shorten and combine prayers for a distance of 81 km or more, provided the journey is permissible and he begins only after setting out and leaving the built-up area of his town or the administrative boundary of his area. It said that if the distance between workplace and residence reaches the distance for the concession, shortening and combining are permitted on leaving the built-up area, even if the journey is repeated daily. It quoted al-Khatib al-Shirbini in Mughni al-Muhtaj (1/529) that advancing and delaying combinations are permitted on long permissible journeys, that delayed combining is established in the two Sahihs from the hadith of Anas ibn Malik and Abdullah ibn Umar, and that advanced combining was graded authentic by Ibn Hibban and al-Bayhaqi from the hadith of Mu'adh ibn Jabal and graded hasan by al-Tirmidhi."
  ur: "روزانہ سفر میں قصر اور جمع کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ 81 کلومیٹر یا زیادہ کے جائز سفر میں آبادی سے نکلنے کے بعد قصر اور جمع جائز ہے، چاہے سفر روزانہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ مسافر 81 کلومیٹر یا زیادہ کی مسافت پر قصر اور جمع کی رخصت لے سکتا ہے، بشرطیکہ سفر جائز ہو اور وہ سفر شروع کر کے اپنے شہر کی آبادی یا اپنے علاقے کی انتظامی حدود سے نکلنے کے بعد آغاز کرے۔ اس نے کہا کہ اگر کام کی جگہ اور رہائش کے درمیان فاصلہ رخصت کی مسافت تک پہنچے تو آبادی سے نکلتے ہی قصر اور جمع جائز ہے، چاہے سفر روزانہ ہو۔ اس نے مغنی المحتاج (1/529) میں خطیب شربینی سے نقل کیا کہ طویل جائز سفر میں جمعِ تقدیم اور جمعِ تاخیر جائز ہے، جمعِ تاخیر صحیحین میں انس بن مالک اور عبداللہ بن عمر کی حدیث سے ثابت ہے، اور جمعِ تقدیم کو ابن حبان اور بیہقی نے معاذ بن جبل کی حدیث سے صحیح اور ترمذی نے حسن کہا۔"
  es: "Una pregunta sobre acortar y combinar oraciones al viajar diariamente, a la que el Departamento General de Iftaa de Jordania respondió que acortar y combinar oraciones está permitido para viajes lícitos de 81 km o más una vez que se abandona el área urbanizada, incluso si el viaje se repite diariamente. El Departamento respondió que un viajero puede acortar y combinar oraciones para una distancia de 81 km o más, siempre que el viaje sea lícito y comience solo después de salir del área urbanizada de su ciudad o del límite administrativo de su área. Dijo que si la distancia entre el lugar de trabajo y la residencia alcanza la distancia para la concesión, acortar y combinar oraciones está permitido al salir del área urbanizada, incluso si el viaje se repite diariamente. Citaba a al-Khatib al-Shirbini en Mughni al-Muhtaj (1/529) que las combinaciones de avance y retraso están permitidas en viajes largos permitidos, que la combinación retrasada está establecida en los dos Sahihs a partir del hadiz de Anas ibn Malik y Abdullah ibn Umar, y que la combinación de avance fue calificada como auténtica por Ibn Hibban y al-Bayhaqi a partir del hadiz de Mu'adh ibn Jabal y calificada como hasan por al-Tirmidhi."
  fr: "Une question relative à la possibilité de raccourcir et de regrouper les prières lors de déplacements quotidiens a été posée au Département général de la Iftaa de Jordanie. Ce dernier a répondu que le raccourcissement et le regroupement sont autorisés pour les déplacements licites de 81 km ou plus, une fois sorti de la zone urbanisée, même si le trajet est répété quotidiennement. Le Département a précisé qu'un voyageur peut raccourcir et regrouper ses prières sur une distance de 81 km ou plus, à condition que le déplacement soit licite et qu'il ne commence à le faire qu'après avoir quitté la zone urbanisée de sa ville ou les limites administratives de sa zone. Il a également indiqué que si la distance entre le lieu de travail et le domicile atteint le seuil d'autorisation, le raccourcissement et le regroupement sont permis dès la sortie de la zone urbanisée, même si le trajet est répété quotidiennement. Il cite al-Khatib al-Shirbini dans Mughni al-Muhtaj (1/529) selon lequel les combinaisons avancées et retardées sont autorisées sur les longs voyages autorisés, que la combinaison retardée est établie dans les deux Sahihs à partir du hadith d'Anas ibn Malik et d'Abdullah ibn Umar, et que la combinaison avancée a été jugée authentique par Ibn Hibban et al-Bayhaqi à partir du hadith de Mu'adh ibn Jabal et jugée hasan par al-Tirmidhi."
