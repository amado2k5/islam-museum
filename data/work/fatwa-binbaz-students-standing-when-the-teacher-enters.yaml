id: work/fatwa-binbaz-students-standing-when-the-teacher-enters
class: work
kind: fatwa
label: { ar: "حكم قيام الطلاب للمدرس عند دخوله", en: "Students standing up when the teacher enters", ur: "استاد کے داخل ہونے پر طلبہ کے کھڑے ہونے کا حکم" }
summary:
  ar: "سؤال من مدرس في المرحلة المتوسطة يقوم له التلاميذ عند دخوله الفصل تقديرًا من دون أن يأمرهم وهو يكره ذلك، أجاب فيه ابن باز بأن القيام للداخل تعظيمًا مما جاءت السنة بالنهي عنه، فقد كان الصحابة لا يقومون للنبي لما يعلمون من كراهيته لذلك، وقال النبي من أحب أن يتمثل له الرجال قيامًا فليتبوأ مقعده من النار، فالواجب على الطلبة ألا يقوموا بل يلزموا أماكنهم ويسلموا عليه، وأقل أحوال هذا القيام الكراهة الشديدة، ولا يجوز للأستاذ أن يحب ذلك أو يأمر به، وعليه أن يعظهم وينهاهم بصدق فإذا عرفوا منه الصدق جلسوا، وعلى وزارة المعارف والرئاسة العامة للتعليم التنبيه على ذلك في المدارس للبنين والبنات. وفرّق بين هذا القيام وبين القيام للمواجهة والمصافحة أو ليُجلس الداخل في مكانه أو ليمشي معه، فهذا لا بأس به، واستدل بقيام طلحة بن عبيد الله إلى كعب بن مالك حين تاب الله عليه بحضرة النبي، وبقول النبي للأنصار قوموا إلى سيدكم حين أقبل سعد بن معاذ، وبقيام فاطمة إلى أبيها وقيامه إليها، وردّ على من قال إن القيام تنبيه للطلاب بأنه شبهة شيطانية إذ يتنبهون بسلامه، وعلى من يغضب مسؤول لعدم القيام له بأن يُبيَّن له أن ذلك لا يجوز وأن الرسول كرهه."
  en: "A question from a middle-school teacher whose pupils stand up for him out of respect when he enters the classroom without his asking them to, which he dislikes; Ibn Baz answered that standing up for a person who enters, by way of honouring him, is something the Sunna forbids: the Companions did not stand for the Prophet because they knew he disliked it, and the Prophet said that whoever likes people to stand up for him should take his seat in the Fire; so the pupils must not stand but keep their places and greet him, this kind of standing being at the least strongly disliked, and the teacher may neither like it nor order it, but must admonish and forbid them sincerely, for when they see he means it they will sit; the Ministry of Education and the General Presidency for Education should instruct schools accordingly, for boys and girls alike. He distinguished this from rising to meet and shake hands with the person, to seat him in one's place or to walk him out, which is unobjectionable, citing Talha ibn Ubaydallah rising to Ka'b ibn Malik when God accepted his repentance in the Prophet's presence, the Prophet's words to the Ansar 'stand up for your chief' when Sa'd ibn Mu'adh arrived, and Fatima rising to her father and he to her. He answered those who call the standing a way of alerting pupils that this is a satanic pretext, since his greeting alerts them, and advised one whose superior is angered by not being stood for to explain to him that it is not allowed and that the Messenger disliked it."
  ur: "ایک مڈل اسکول استاد کا سوال جس کے شاگرد اس کے کلاس میں داخل ہونے پر بغیر اس کے کہنے کے احتراماً کھڑے ہو جاتے ہیں، جو اسے ناپسند ہے؛ ابن باز نے جواب دیا کہ داخل ہونے والے کے لیے تعظیماً کھڑا ہونا ان چیزوں میں سے ہے جن سے سنت میں منع آیا ہے: صحابہ نبی کے لیے کھڑے نہیں ہوتے تھے کیونکہ وہ جانتے تھے کہ انہیں یہ ناپسند ہے، اور نبی نے فرمایا کہ جو چاہے کہ لوگ اس کے لیے کھڑے ہوں وہ اپنا ٹھکانا جہنم میں بنا لے؛ لہٰذا طلبہ پر لازم ہے کہ کھڑے نہ ہوں بلکہ اپنی جگہ رہیں اور اسے سلام کریں، اس کھڑے ہونے کا کم سے کم درجہ سخت کراہت ہے، اور استاد کے لیے جائز نہیں کہ اسے پسند کرے یا اس کا حکم دے، بلکہ اسے صدق سے انہیں نصیحت اور منع کرنا چاہیے، کیونکہ جب وہ دیکھیں گے کہ وہ سچا ہے تو بیٹھ جائیں گے؛ وزارتِ تعلیم اور تعلیم کی جنرل پریزیڈنسی کو لڑکوں اور لڑکیوں کے اسکولوں میں اس کی ہدایت کرنی چاہیے۔ انہوں نے اس میں اور آنے والے سے ملنے اور مصافحہ کرنے، اسے اپنی جگہ بٹھانے یا اس کے ساتھ چلنے کے لیے کھڑے ہونے میں فرق کیا، جو بلا مضائقہ ہے، طلحہ بن عبید اللہ کے کعب بن مالک کی طرف کھڑے ہونے سے جب اللہ نے نبی کی موجودگی میں ان کی توبہ قبول کی، نبی کے انصار سے فرمان 'اپنے سردار کے لیے کھڑے ہو جاؤ' سے جب سعد بن معاذ آئے، اور فاطمہ کے اپنے والد کے لیے اور ان کے فاطمہ کے لیے کھڑے ہونے سے استدلال کرتے ہوئے۔ جو کہتے ہیں کہ کھڑا ہونا طلبہ کو متوجہ کرنے کے لیے ہے انہیں جواب دیا کہ یہ شیطانی بہانہ ہے کیونکہ اس کا سلام انہیں متوجہ کرتا ہے، اور جس کا افسر کھڑے نہ ہونے پر ناراض ہو اسے مشورہ دیا کہ اسے سمجھائے کہ یہ جائز نہیں اور رسول نے اسے ناپسند کیا۔"
