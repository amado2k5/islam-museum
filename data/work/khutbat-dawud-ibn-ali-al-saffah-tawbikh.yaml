label: { ar: "خطبة داود بن علي توبيخاً للسفاح", en: "Dawud ibn Ali's rebuke of al-Saffah", ur: "داود بن علی کی سفاح کو سرزنش", es: "La reprimenda de Dawud ibn Ali a al-Saffah", fr: "La réprimande de Dawud ibn Ali à al-Saffah", tr: "Davud bin Ali'nin kasabı azarlamak için yaptığı vaaz", id: "Khotbah Dawood bin Ali sebagai teguran kepada tukang daging" }
summary:
  ar: "خطبة داود بن علي وقد ارتج على السفاح في أول خلافته، إذ قام داود فتكلم بعد أن صمت الخليفة، ثم نزل. تُروى بروايات متعددة في كتب الأدب والتاريخ."
  en: "Dawud ibn Ali's speech when al-Saffah froze on the pulpit early in his caliphate: Dawud rose, spoke in his place, then stepped down. Several literary and historical accounts transmit it."
  ur: "سفاح کی خلافت کے ابتدائی دنوں میں جب سفاح منبر پر خاموش ہو گئے تو داود بن علی اٹھے، بات کی اور اتر گئے۔ ادب اور تاریخ کی کئی کتابوں میں یہ روایت ہے۔"
  es: "El discurso de Dawud ibn Ali cuando al-Saffah se quedó paralizado en el púlpito al comienzo de su califato: Dawud se levantó, habló en su lugar y luego bajó. Diversos relatos literarios e históricos lo transmiten."
  fr: "Discours de Dawud ibn Ali lorsque al-Saffah resta figé en chaire au début de son califat: Dawud se leva, parla à sa place, puis redescendit. Plusieurs récits littéraires et historiques le rapportent."
  tr: "Davud bin Ali'nin Vaazı Halifeliğinin başında el-Safah tarafından saldırıya uğradı; Halife sessizleştikten sonra Davud ayağa kalkıp konuştu, ardından aşağı indi. Bu vaaz, çeşitli edebiyat ve tarihsel kaynaklarda anlatılır."
  id: "Khotbah Dawood ibn Ali He diserang oleh al-Saffah di awal khalifahnya, karena Dawood berdiri dan berbicara setelah khalifah diam, lalu turun. Khotbah ini diceritakan dalam berbagai catatan dalam sastra dan sejarah."
