summary:
  ar: "خطبة داود بن علي وقد ارتج على السفاح في أول خلافته، إذ قام داود فتكلم بعد أن صمت الخليفة، ثم نزل. تُروى بروايات متعددة في كتب الأدب والتاريخ."
  en: "Dawud ibn Ali's speech when al-Saffah froze on the pulpit early in his caliphate: Dawud rose, spoke in his place, then stepped down. Several literary and historical accounts transmit it."
  ur: "سفاح کی خلافت کے ابتدائی دنوں میں جب سفاح منبر پر خاموش ہو گئے تو داود بن علی اٹھے، بات کی اور اتر گئے۔ ادب اور تاریخ کی کئی کتابوں میں یہ روایت ہے۔"
