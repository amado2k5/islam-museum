id: work/fatwa-amja-khidr-alive-or-dead
class: work
kind: fatwa
label: { ar: "حياة الخضر", en: "Al-Khidr — alive or departed", ur: "خضر — زندہ ہیں یا گزر گئے", es: "Al-Khidr — vivo o fallecido" }
summary:
  ar: "سأل سائل عن القول الراجح في حياة الخضر وموته. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76981 بتاريخ 30 نوفمبر 2008)⁩ أن الأحاديث التي يذكر فيها الخضر وحياته كلها كذب ولا يصح في حياته حديث واحد عن النبي، وغاية ما يتمسك به من ذهب إلى حياته حكايات منقولة يخبر الرجل بها أنه رأى الخضر، وكثير من هؤلاء يغتر بقول مدعٍ أنا الخضر ومعلوم أنه لا يجوز تصديق قائل ذلك بلا برهان من الله، فالصحيح أن الخضر قد لقي ربه وقد صرحت الأدلة بذلك من القرآن والسنة."
  en: "A questioner asked the preponderant view on al-Khidr's life or death. Dr. Salah al-Sawi (fatwa no. 76981, 30 November 2008) answered that every hadith mentioning al-Khidr's continued life is a lie — not one sound hadith stands for it from the Prophet; all the pro-life side can cling to are tales of men saying they saw al-Khidr — is there a sign by which a seer would know him? — and many are duped by a claimant saying 'I am al-Khidr', though such a claim may not be believed without God's proof. The sound view is that al-Khidr has met his Lord, the Qur'an and Sunna declaring it plainly."
  ur: "ایک سائل نے خضر کی حیات کا راجح قول پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76981، 30 نومبر 2008)⁩ کے مطابق ان کی زندگی کی کوئی صحیح حدیث نہیں — صرف لوک کہانیاں ہیں؛ صحیح یہ ہے کہ وہ اپنے رب سے جا ملے۔"
  es: "Un interlocutor preguntó cuál era la opinión predominante sobre la vida o muerte de al-Khidr. El Dr. Salah al-Sawi (fatwa n.º 76981, 30 de noviembre de 2008) respondió que todo hadiz que mencione la vida continua de al-Khidr es una mentira; no existe un solo hadiz auténtico del Profeta que lo confirme. A lo único que puede aferrarse el bando provida son relatos de hombres que afirman haber visto a al-Khidr —¿acaso existe alguna señal que permita a un vidente reconocerlo?— y muchos son engañados por un supuesto que dice «Yo soy al-Khidr», aunque tal afirmación no puede creerse sin la prueba divina. La opinión correcta es que al-Khidr se ha encontrado con su Señor, como lo declaran claramente el Corán y la Sunna."
