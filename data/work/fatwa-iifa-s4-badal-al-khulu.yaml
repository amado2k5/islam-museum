label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن بدل الخلو", en: "IIFA resolution on key money (badal al-khulu)", ur: "اکیڈمی کی قرارداد: بدل خلو ⁦(کی منی)⁩", es: "Resolución de la IIFA sobre el dinero de la clave (badal al-khulu)", fr: "Résolution de l'IIFA sur les fonds clés (badal al-khulu)" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩ بشأن بدل الخلو: قسّم صور الاتفاق عليه إلى أربع — اتفاق المالك مع المستأجر عند بدء العقد، أو في أثنائه أو بعد انتهائه، أو اتفاق المستأجر مع مستأجر جديد، أو اتفاقهما معًا — وبيّن أحكام كل صورة على ما فصّل."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on key money (badal al-khulu): it divides the agreements into four cases — owner and tenant at the contract's start, during it or after it ends, tenant with a new tenant, and the two together — and sets out each case's ruling as detailed."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩ بدل خلو پر: معاہدے کی چار صورتیں بیان کر کے ہر ایک کا حکم الگ دیا۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre el pago de la fianza (badal al-khulu): divide los acuerdos en cuatro casos: propietario e inquilino al inicio del contrato, durante el mismo o después de su finalización, inquilino con un nuevo inquilino y ambos juntos, y establece la resolución de cada caso con todo detalle."
  fr: "La résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur le droit d'entrée (badal al-khulu): elle divise les accords en quatre cas — propriétaire et locataire au début du contrat, pendant celui-ci ou après sa fin, locataire avec un nouveau locataire et les deux ensemble — et expose la décision de chaque cas en détail."
