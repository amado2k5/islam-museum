id: work/fatwa-dar-alifta-eg-spreading-false-news
class: work
kind: fatwa
label: { ar: "حرمة تعمد نشر الأخبار الكاذبة والمعلومات المضللة", en: "The prohibition on deliberately spreading false news and misleading information", ur: "جان بوجھ کر جھوٹی خبریں اور گمراہ کن معلومات پھیلانے کی حرمت" }
summary:
  ar: "سائل سأل عن حكم تعمد نشر الأخبار الكاذبة والمعلومات غير الصحيحة بقصد تضليل الناس أو التأثير في قراراتهم لتحقيق مصالح شخصية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24453)⁩ أن تعمّد نشر الأخبار الكاذبة والمعلومات المضللة بقصد خداع الناس أو التأثير في قراراتهم وتحقيق مصالح شخصية فعل محرم شرعًا؛ لما فيه من الكذب والغش والتدليس وما قد يترتب عليه من مفاسد."
  en: "A questioner asked about deliberately spreading false news and untrue information to mislead people or sway their decisions for personal gain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24453) answered that knowingly spreading false news and misleading information — to deceive people, influence their decisions or secure private benefit — is a prohibited act in the sharia, for the lying, deception and distortion it involves and the harm that follows from it."
  ur: "ایک سائل نے پوچھا کہ لوگوں کو گمراہ کرنے یا اپنے مفاد کے لیے ان کے فیصلے متاثر کرنے کی نیت سے جان بوجھ کر جھوٹی خبریں اور غلط معلومات پھیلانے کا کیا حکم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24453)⁩ نے جواب دیا کہ دانستہ طور پر جھوٹی خبریں اور گمراہ کن معلومات پھیلانا — لوگوں کو دھوکہ دینے، ان کے فیصلوں پر اثر ڈالنے یا ذاتی فائدہ حاصل کرنے کے لیے — شریعت میں حرام ہے، اس میں جھوٹ، فریب اور تحریف کی وجہ سے اور اس سے ہونے والے مفاسد کی بنا پر۔"
