id: work/fatwa-dar-alifta-eg-spreading-false-news
class: work
kind: fatwa
label: { ar: "حرمة تعمد نشر الأخبار الكاذبة والمعلومات المضللة", en: "The prohibition on deliberately spreading false news and misleading information", ur: "جان بوجھ کر جھوٹی خبریں اور گمراہ کن معلومات پھیلانے کی حرمت", es: "La prohibición de difundir deliberadamente noticias falsas e información engañosa.", fr: "L'interdiction de diffuser délibérément de fausses nouvelles et des informations trompeuses", tr: "Kasıtlı olarak yanlış haber ve yanıltıcı bilgi yaymak yasaktır", id: "Dilarang menyebarkan berita palsu dan informasi menyesatkan dengan sengaja" }
summary:
  ar: "سائل سأل عن حكم تعمد نشر الأخبار الكاذبة والمعلومات غير الصحيحة بقصد تضليل الناس أو التأثير في قراراتهم لتحقيق مصالح شخصية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24453)⁩ أن تعمّد نشر الأخبار الكاذبة والمعلومات المضللة بقصد خداع الناس أو التأثير في قراراتهم وتحقيق مصالح شخصية فعل محرم شرعًا؛ لما فيه من الكذب والغش والتدليس وما قد يترتب عليه من مفاسد."
  en: "A questioner asked about deliberately spreading false news and untrue information to mislead people or sway their decisions for personal gain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24453) answered that knowingly spreading false news and misleading information — to deceive people, influence their decisions or secure private benefit — is a prohibited act in the sharia, for the lying, deception and distortion it involves and the harm that follows from it."
  ur: "ایک سائل نے پوچھا کہ لوگوں کو گمراہ کرنے یا اپنے مفاد کے لیے ان کے فیصلے متاثر کرنے کی نیت سے جان بوجھ کر جھوٹی خبریں اور غلط معلومات پھیلانے کا کیا حکم ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24453)⁩ نے جواب دیا کہ دانستہ طور پر جھوٹی خبریں اور گمراہ کن معلومات پھیلانا — لوگوں کو دھوکہ دینے، ان کے فیصلوں پر اثر ڈالنے یا ذاتی فائدہ حاصل کرنے کے لیے — شریعت میں حرام ہے، اس میں جھوٹ، فریب اور تحریف کی وجہ سے اور اس سے ہونے والے مفاسد کی بنا پر۔"
  es: "Un interlocutor preguntó sobre la difusión deliberada de noticias falsas e información engañosa para confundir a la gente o influir en sus decisiones con fines de lucro personal. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 24453) respondió que difundir a sabiendas noticias falsas e información engañosa —para confundir a la gente, influir en sus decisiones u obtener un beneficio privado— es un acto prohibido por la sharia, debido a la mentira, el engaño y la distorsión que implica, así como al daño que de ello se deriva."
  fr: "Une personne a posé une question concernant la diffusion délibérée de fausses nouvelles et d'informations mensongères dans le but d'induire les gens en erreur ou d'influencer leurs décisions à des fins personnelles. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24453) a répondu que diffuser sciemment de fausses nouvelles et des informations trompeuses – pour tromper les gens, influencer leurs décisions ou obtenir un avantage personnel – est un acte interdit par la charia, en raison du mensonge, de la tromperie et de la distorsion qu'il implique et du préjudice qui en découle."
  tr: "Bir soru soran, insanları yanıltmak veya kişisel çıkarlarını sağlamak için kararlarını etkilemek amacıyla kasıtlı olarak yanlış haber ve yanlış bilgi yayımlama kararı hakkında sorular sordu. Mısır Dar Al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 24453), insanları aldatmak veya kararlarını etkilemek ve kişisel çıkarları sağlamak amacıyla kasıtlı olarak yanlış haber ve yanıltıcı bilgi yayımlamanın, yalan, dolandırıcılık, aldatmaca ve bunun ortaya çıkabileceği potansiyel zararlar nedeniyle dini olarak yasak bir eylem olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang putusan yang membatalkan dengan sengaja mempublikasikan berita palsu dan informasi yang salah dengan tujuan menyesatkan orang atau memengaruhi keputusan mereka demi kepentingan pribadi. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 24453) menjawab bahwa secara sengaja menerbitkan berita palsu dan informasi menyesatkan dengan tujuan menipu atau mempengaruhi keputusan orang dan mencapai kepentingan pribadi adalah tindakan yang dilarang secara agama, karena kebohongan, penipuan, dan penipuan serta potensi bahaya yang mungkin timbul darinya."
