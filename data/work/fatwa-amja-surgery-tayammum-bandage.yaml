id: work/fatwa-amja-surgery-tayammum-bandage
class: work
kind: fatwa
label: { ar: "التيمم بعد العملية", en: "After surgery, unable to wash — tayammum or bandage-wiping", ur: "آپریشن کے بعد — تیمم یا پٹی مسح" }
summary:
  ar: "سأل سائل أنه أجرى عملية جراحية لا يستطيع الاغتسال وكان يتوضأ فقط. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81595 بتاريخ 2 يونيو 2010)⁩ أنه كان يلزمه التيمم إذا عجز بالكلية عن استخدام الماء أو أن يغتسل ثم يعصب على جرحه بشيء ثم يمسح عليه إن كان قادرًا على ذلك فإن الله شرع التيمم لفاقد الماء والعاجز عن استعماله لقوله تعالى فإن لم تجدوا ماء فتيمموا على ما فصّل الجواب."
  en: "A questioner had surgery and, unable to wash, was doing wudu only. Dr. Salah al-Sawi (fatwa no. 81595, 2 June 2010) answered that he owed tayammum where wholly unable to use water — or to wash, bandage the wound with something and wipe over it if able — God having legislated tayammum for one lacking water or unable to use it, per 'if you find no water, tayammum' — as the answer details."
  ur: "آپریشن کے بعد غسل نہ ہو سکا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81595، 2 جون 2010)⁩ کے مطابق تیمم یا زخم پر پٹی باندھ کر مسح درست ہے۔"
