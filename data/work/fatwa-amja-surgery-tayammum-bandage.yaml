id: work/fatwa-amja-surgery-tayammum-bandage
class: work
kind: fatwa
label: { ar: "التيمم بعد العملية", en: "After surgery, unable to wash — tayammum or bandage-wiping", ur: "آپریشن کے بعد — تیمم یا پٹی مسح", es: "Después de la cirugía, no se puede lavar: tayammum o limpieza del vendaje.", fr: "Après l'opération, incapacité à se laver — tayammum ou essuyage du bandage", tr: "Operasyondan sonra Tayammum", id: "Tayammum setelah operasi" }
summary:
  ar: "سأل سائل أنه أجرى عملية جراحية لا يستطيع الاغتسال وكان يتوضأ فقط. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81595 بتاريخ 2 يونيو 2010)⁩ أنه كان يلزمه التيمم إذا عجز بالكلية عن استخدام الماء أو أن يغتسل ثم يعصب على جرحه بشيء ثم يمسح عليه إن كان قادرًا على ذلك فإن الله شرع التيمم لفاقد الماء والعاجز عن استعماله لقوله تعالى فإن لم تجدوا ماء فتيمموا على ما فصّل الجواب."
  en: "A questioner had surgery and, unable to wash, was doing wudu only. Dr. Salah al-Sawi (fatwa no. 81595, 2 June 2010) answered that he owed tayammum where wholly unable to use water — or to wash, bandage the wound with something and wipe over it if able — God having legislated tayammum for one lacking water or unable to use it, per 'if you find no water, tayammum' — as the answer details."
  ur: "آپریشن کے بعد غسل نہ ہو سکا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81595، 2 جون 2010)⁩ کے مطابق تیمم یا زخم پر پٹی باندھ کر مسح درست ہے۔"
  es: "Un consultante se había sometido a una cirugía y, al no poder lavarse, solo realizaba el wudu. El Dr. Salah al-Sawi (fatwa n.° 81595, 2 de junio de 2010) respondió que debía realizar el tayammum cuando era totalmente incapaz de usar agua, o de lavarse, vendar la herida con algo y limpiarla si era posible, ya que Dios había legislado el tayammum para quien carecía de agua o no podía usarla, según la frase \"si no encuentras agua, realiza el tayammum\", como se detalla en la respuesta."
  fr: "Un homme ayant subi une intervention chirurgicale et ne pouvant se laver, effectuait uniquement ses ablutions (wudu). Le Dr Salah al-Sawi (fatwa n° 81595, 2 juin 2010) a répondu qu'il devait procéder au tayammum lorsqu'il était totalement incapable d'utiliser de l'eau – ou de se laver, de bander la plaie et de l'essuyer si possible – car Dieu a prescrit le tayammum pour celui qui manque d'eau ou ne peut l'utiliser, conformément au principe « si tu ne trouves pas d'eau, fais le tayammum », comme le précise la réponse."
  tr: "Bir soruya oturan biri, kendisine ameliyat olduğu ve ghusl yapamadığı, sadece abdest olduğu soruldu. Dr. Salah Al-Sawy (2 Haziran 2010 tarihli 81595 sayılı fetva) su kullanamıyorsa teyammum yapması gerektiğini veya güsl yapamıyorsa yarasını bir şeyle sarıp silmesi gerektiğini yanıtladı. Allah, suyu olmayan ve kullanamayanlara teyammum buyurdu; Allah'ın dediği gibi: 'Su bulamazsan, cevabda açıklandığı gibi teyammum yap.'"
  id: "Seorang penanya ditanya bahwa ia menjalani operasi dan tidak dapat melakukan ghusl serta hanya melakukan wudhu. Dr. Salah Al-Sawy menjawab (Fatwa No. 81595 tanggal 2 Juni 2010) bahwa ia diwajibkan melakukan tayammum jika benar-benar tidak bisa menggunakan air, atau melakukan ghusl, lalu membalut lukanya dengan sesuatu dan membersihkannya jika mampu. Allah mewajibkan tayammum bagi mereka yang kekurangan air dan tidak dapat menggunakannya, seperti yang dikatakan Allah Yang Maha Kuasa: 'Jika tidak menemukan air, maka lakukan tayammum seperti yang dijelaskan dalam jawaban.'"
