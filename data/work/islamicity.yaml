summary:
  ar: "موقع إسلامي أمريكي بالإنجليزية أُطلق في فبراير 1995 كما يقول، يقدّم نفسه نظرة غير طائفية شاملة إلى الإسلام، وتشغّله مؤسسة غير ربحية؛ أقدم لقطة له في أرشيف الإنترنت في مايو 1999 بعنوان «IslamiCity in Cyberspace» بأبواب للتجارة والمجتمع والتعليم والوقف والمؤتمرات."
  en: "An American English-language Islamic website launched, it says, in February 1995, presenting itself as a non-sectarian, comprehensive view of Islam and operated by a non-profit; its earliest archived capture, of May 1999, is titled 'IslamiCity in Cyberspace', with sections for commerce, community, education, endowment and conferences."
  ur: "امریکی انگریزی اسلامی ویب سائٹ جو اپنے بقول فروری 1995 میں شروع ہوئی، خود کو اسلام کا غیر فرقہ وارانہ جامع نقطۂ نظر کہتی ہے اور ایک غیر منافع بخش ادارہ اسے چلاتا ہے؛ سب سے پرانی آرکائیو تصویر مئی 1999 کی، «IslamiCity in Cyberspace» کے عنوان سے۔"
