id: work/fatwa-dar-alifta-eg-siwak-from-trees-of-mina
class: work
kind: fatwa
label: { ar: "حكم الأخذ من أشجار منى للتسوك", en: "Taking siwak sticks from the trees of Mina", ur: "منیٰ کے درختوں سے مسواک کے لیے چھپنا", es: "Tomando palitos de siwak de los árboles de Mina", fr: "Prendre des bâtonnets de siwak sur les arbres de Mina", tr: "Mina'nın ağaçlarından alışveriş için alma kuralı", id: "Aturan tentang mengambil dari pohon Mina untuk berbelanja" }
summary:
  ar: "سائل سأل عن الأخذ من أشجار منى للتسوك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20755)⁩ أن الأحوط ألا يقترب المحرم أو غيره من أخذ السواك من شجر الحرم أو التعدي على شجر الحرم النابت بنفسه على ما فصّل الجواب."
  en: "A questioner asked about taking siwak sticks from the trees of Mina. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20755) answered that the safer course is for pilgrim and non-pilgrim alike not to take siwak from the haram's trees nor harm what grows there of itself — as the answer details."
  ur: "ایک سائل نے منیٰ کے درختوں سے مسواک لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20755)⁩ نے جواب دیا کہ احتیاط یہ ہے کہ محرم ہو یا نہ ہو حرم کے درختوں سے مسواک نہ لے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de tomar varitas de siwak de los árboles de Mina. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20755) respondió que lo más seguro es que tanto peregrinos como no peregrinos no tomen siwak de los árboles del haram ni dañen lo que crece allí, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la consommation de siwak sur les arbres de Mina. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20755) a répondu que, par mesure de précaution, il est préférable pour les pèlerins comme pour les non-pèlerins de ne pas consommer de siwak sur les arbres du Haram ni d'endommager la végétation qui y pousse naturellement, comme le précise la réponse."
  tr: "Bir soru soran kişi, Mina ağaçlarından tadım için almayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20755), cevabında açıklandığı gibi, hacının veya başkalarının Haram ağaçlarından misvak almalarına veya kendi kendine yetişen Haram ağacını ihlal etmelerine yaklaşmamanın daha dikkatli olduğunu söyledi."
  id: "Seorang penanya bertanya tentang pengambilan dari pohon Mina untuk dicicipi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20755) menjawab bahwa lebih berhati-hati untuk tidak mendekati peziarah atau orang lain yang mengambil miswak dari pohon Haram atau melanggar pohon Haram yang tumbuh sendiri, seperti yang dijelaskan dalam jawaban."
