id: work/fatwa-aliftaa-jo-buying-a-game-account-in-instalments
class: work
kind: fatwa
label: { ar: "شراء حساب لعبة إلكترونية بالتقسيط", en: "Buying an online game account in instalments", ur: "آن لائن گیم اکاؤنٹ قسطوں پر خریدنا" }
summary:
  ar: "سؤال عن شراء حساب لعبة إلكترونية بالتقسيط، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع الألعاب الإلكترونية تابع لحكم اللعبة نفسها، فإن كانت حلالًا جاز للصديق شراؤها وتملكها ثم بيعها بالتقسيط بربح. أجابت الدائرة بأن بيع الألعاب الإلكترونية حكمه تابع لحكم اللعبة نفسها، فإن كانت حلالًا كان بيعها حلالًا، وإن اشتملت على مخالفات شرعية تمنع من لعبها لم يصح بيعها، وأحالت إلى ضوابط الألعاب الإلكترونية في فتواها رقم 3369. وقالت إن اللعبة إن كانت حلالًا جاز للشخص أن يشتريها، ثم بعد أن يتملكها يبيعها بالأقساط بثمن يزيد على ما اشتراها به، وذكرت أن الدائرة أجازت المرابحة مع مراعاة شروطها الشرعية، وأحالت إلى فتواها رقم 2861."
  en: "A question about buying an online game account in instalments, in which Jordan's General Iftaa Department answered that the sale of an online game follows the ruling on the game itself, and that if it is permissible the friend may buy and own it and then sell it on in instalments at a profit. The Department answered that the ruling on selling online games follows the ruling on the game itself: if the game is permissible its sale is permissible, and if it contains violations of the Sharia that make playing it impermissible its sale is not valid, referring to its guidelines on online games in fatwa no. 3369. It said that if the game is permissible, the friend may buy it and, once he owns it, sell it in instalments at a price higher than he paid, noting that the Department permits murabaha provided its conditions are observed and referring to its fatwa no. 2861."
  ur: "آن لائن گیم اکاؤنٹ قسطوں پر خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ آن لائن گیم کی فروخت کا حکم خود گیم کے حکم کے تابع ہے، اور اگر وہ جائز ہو تو دوست اسے خرید کر مالک بننے کے بعد قسطوں پر منافع کے ساتھ بیچ سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ آن لائن گیمز کی فروخت کا حکم خود گیم کے حکم کے تابع ہے: اگر گیم جائز ہو تو اس کی فروخت جائز ہے، اور اگر اس میں ایسی شرعی خلاف ورزیاں ہوں جو اسے کھیلنا ناجائز بنا دیں تو اس کی فروخت درست نہیں، اور آن لائن گیمز کے ضوابط کے لیے اپنے فتویٰ نمبر 3369 کا حوالہ دیا۔ اس نے کہا کہ اگر گیم جائز ہو تو دوست اسے خرید سکتا ہے اور مالک بننے کے بعد خرید سے زیادہ قیمت پر قسطوں میں بیچ سکتا ہے، اور بتایا کہ ڈیپارٹمنٹ شرعی شرائط کی پابندی کے ساتھ مرابحہ کو جائز قرار دیتا ہے، اور اپنے فتویٰ نمبر 2861 کا حوالہ دیا۔"
