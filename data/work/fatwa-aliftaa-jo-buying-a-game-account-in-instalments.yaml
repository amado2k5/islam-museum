id: work/fatwa-aliftaa-jo-buying-a-game-account-in-instalments
class: work
kind: fatwa
label: { ar: "شراء حساب لعبة إلكترونية بالتقسيط", en: "Buying an online game account in instalments", ur: "آن لائن گیم اکاؤنٹ قسطوں پر خریدنا", es: "Comprar una cuenta de juego en línea a plazos", fr: "Achat d'un compte de jeu en ligne en plusieurs fois", tr: "Elektronik oyun hesabını taksitlerle satın alın", id: "Beli akun game elektronik secara cicilan" }
summary:
  ar: "سؤال عن شراء حساب لعبة إلكترونية بالتقسيط، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع الألعاب الإلكترونية تابع لحكم اللعبة نفسها، فإن كانت حلالًا جاز للصديق شراؤها وتملكها ثم بيعها بالتقسيط بربح. أجابت الدائرة بأن بيع الألعاب الإلكترونية حكمه تابع لحكم اللعبة نفسها، فإن كانت حلالًا كان بيعها حلالًا، وإن اشتملت على مخالفات شرعية تمنع من لعبها لم يصح بيعها، وأحالت إلى ضوابط الألعاب الإلكترونية في فتواها رقم 3369. وقالت إن اللعبة إن كانت حلالًا جاز للشخص أن يشتريها، ثم بعد أن يتملكها يبيعها بالأقساط بثمن يزيد على ما اشتراها به، وذكرت أن الدائرة أجازت المرابحة مع مراعاة شروطها الشرعية، وأحالت إلى فتواها رقم 2861."
  en: "A question about buying an online game account in instalments, in which Jordan's General Iftaa Department answered that the sale of an online game follows the ruling on the game itself, and that if it is permissible the friend may buy and own it and then sell it on in instalments at a profit. The Department answered that the ruling on selling online games follows the ruling on the game itself: if the game is permissible its sale is permissible, and if it contains violations of the Sharia that make playing it impermissible its sale is not valid, referring to its guidelines on online games in fatwa no. 3369. It said that if the game is permissible, the friend may buy it and, once he owns it, sell it in instalments at a price higher than he paid, noting that the Department permits murabaha provided its conditions are observed and referring to its fatwa no. 2861."
  ur: "آن لائن گیم اکاؤنٹ قسطوں پر خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ آن لائن گیم کی فروخت کا حکم خود گیم کے حکم کے تابع ہے، اور اگر وہ جائز ہو تو دوست اسے خرید کر مالک بننے کے بعد قسطوں پر منافع کے ساتھ بیچ سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ آن لائن گیمز کی فروخت کا حکم خود گیم کے حکم کے تابع ہے: اگر گیم جائز ہو تو اس کی فروخت جائز ہے، اور اگر اس میں ایسی شرعی خلاف ورزیاں ہوں جو اسے کھیلنا ناجائز بنا دیں تو اس کی فروخت درست نہیں، اور آن لائن گیمز کے ضوابط کے لیے اپنے فتویٰ نمبر 3369 کا حوالہ دیا۔ اس نے کہا کہ اگر گیم جائز ہو تو دوست اسے خرید سکتا ہے اور مالک بننے کے بعد خرید سے زیادہ قیمت پر قسطوں میں بیچ سکتا ہے، اور بتایا کہ ڈیپارٹمنٹ شرعی شرائط کی پابندی کے ساتھ مرابحہ کو جائز قرار دیتا ہے، اور اپنے فتویٰ نمبر 2861 کا حوالہ دیا۔"
  es: "Una pregunta sobre la compra de una cuenta de juego en línea a plazos, en la que el Departamento General de Iftaa de Jordania respondió que la venta de un juego en línea se rige por la normativa del propio juego, y que si es permisible, el amigo puede comprarlo y poseerlo para luego venderlo a plazos con una ganancia. El Departamento respondió que la normativa sobre la venta de juegos en línea sigue la normativa del propio juego: si el juego es permisible, su venta es permisible, y si contiene violaciones de la Sharia que hacen que jugarlo sea ilícito, su venta no es válida, remitiéndose a sus directrices sobre juegos en línea en la fatwa n.º 3369. Dijo que si el juego es permisible, el amigo puede comprarlo y, una vez que lo posea, venderlo a plazos a un precio superior al que pagó, señalando que el Departamento permite la murabaha siempre que se cumplan sus condiciones y remitiéndose a su fatwa n.º 2861."
  fr: "Concernant l'achat d'un compte de jeu en ligne en plusieurs fois, le Département général de la Fatwa jordanien a répondu que la vente d'un jeu en ligne est soumise à la réglementation relative au jeu lui-même. Si le jeu est licite, l'acheteur peut l'acquérir, en devenir propriétaire, puis le revendre en plusieurs fois avec profit. Le Département a précisé que la vente de jeux en ligne est régie par la réglementation relative au jeu lui-même: si le jeu est licite, sa vente l'est également; s'il contient des infractions à la charia rendant son utilisation illicite, sa vente est invalide. Cette réponse se réfère à ses directives sur les jeux en ligne, énoncées dans la fatwa n° 3369. Le Département a indiqué que si le jeu est licite, l'acheteur peut l'acquérir et, une fois propriétaire, le revendre en plusieurs fois à un prix supérieur à son prix d'achat initial. Il a également souligné que le Département autorise la murabaha sous réserve du respect de ses conditions, conformément à sa fatwa n° 2861."
  tr: "Ürdün Genel Fetva Dairesi'nin elektronik oyun hesabı taksitle satın almaya ilişkin bir soruya cevap verdiği bir soruda; elektronik oyun satışının oyunun kendisine ilişkin karara tabi olduğunu; eğer oyun helalse, arkadaşın oyunu satın alıp sahip olup, ardından taksitlerle kâr ederek satmasının izinli olduğunu yanıtladı. Daire, elektronik oyun satışının oyunun kendisine tabi olduğunu; eğer helal ise satışın helal olduğunu, dini ihlaller içeriyorsa oyunu oynamanın geçerli olmadığını yanıtladı. Fetva numarası 3369'da elektronik oyun düzenlemelerine atıfta bulundu. Oyun helal ise bir kişinin satın alabileceğini, sahip olduktan sonra satın alındığından daha yüksek bir fiyata taksitler halinde satabileceğini belirtti. Bakanlığın Murabaha ile Şeriat şartlarına uyarak izin verdiğini ve fetva No 2861'e atıfta bulunduğunu belirtti."
  id: "Sebuah pertanyaan tentang pembelian akun permainan elektronik secara cicilan, di mana Departemen Fatwa Umum Yordania menjawab bahwa menjual permainan elektronik tunduk pada aturan atas permainan itu sendiri; jika itu halal, teman tersebut diperbolehkan membeli dan memilikinya, lalu menjualnya secara cicilan untuk mendapatkan keuntungan. Departemen menjawab bahwa menjual permainan elektronik tunduk pada aturan permainan itu sendiri; jika halal, maka menjualnya adalah halal, dan jika melibatkan pelanggaran agama yang mencegah dimainkan, maka tidak sah untuk menjualnya. Departemen tersebut merujuk pada peraturan permainan elektronik dalam fatwa nomor 3369. Departemen menyatakan bahwa jika permainan itu halal, seseorang dapat membelinya, lalu setelah memilikinya, menjualnya secara cicilan dengan harga lebih tinggi dari harga yang dibeli. Departemen menyatakan bahwa departemen mengizinkan Murabaha dengan mematuhi ketentuan Syariahnya dan merujuk pada fatwa No. 2861."
