label:
  ar: "سلسلة الأحاديث الصحيحة وشيء من فقهها وفوائدها"
  en: "Silsilat al-Ahadith al-Sahiha wa-Shay' min Fiqhiha wa-Fawa'idiha"
  ur: "سلسلۃ الاحادیث الصحیحۃ وشیء من فقہہا وفوائدہا"
summary:
  ar: "سلسلة حديثية لمحمد ناصر الدين الألباني (ت 1420هـ) بدأت مقالاتٍ في مجلة التمدن الإسلامي إلى جانب سلسلته في الأحاديث الضعيفة، يخرّج فيها أحاديث يراها صحيحة أو حسنة، ويتكلم على أسانيدها وطرقها ورواتها على طريقة المحدثين، مع شيء من الفقه والفوائد، دون ترتيب على الأبواب؛ وفي مقدمة طبعتها الجديدة (1413هـ) يرد على ناقدين لأحكامه ويقرر أن الضعيف يتقوى بكثرة الطرق ما لم يشتد ضعفه، وأن رجوعه عن بعض أحكامه ليس تناقضاً {cite:silsila-sahiha-maarif-v1 p. 2-4} {cite:silsila-sahiha-maarif-v1 p. 29-30}."
  en: "A hadith series by Muhammad Nasir al-Din al-Albani (d. 1420 AH), begun as articles in the journal al-Tamaddun al-Islami alongside his series on weak hadiths, in which he documents hadiths he judges sound or good, discussing their chains, routes and narrators in the manner of the hadith scholars, with some fiqh and incidental points, in no chapter order; in the preface to its new edition (1413 AH) he answers critics of his gradings, holding that a weak hadith is strengthened by many routes unless the weakness is severe, and that revising some of his judgements is not self-contradiction {cite:silsila-sahiha-maarif-v1 p. 2-4} {cite:silsila-sahiha-maarif-v1 p. 29-30}."
  ur: "محمد ناصر الدین البانی (وفات 1420ھ) کا حدیثی سلسلہ جو ان کے ضعیف احادیث کے سلسلے کے ساتھ رسالہ التمدن الاسلامی میں مضامین کی صورت میں شروع ہوا؛ اس میں وہ ان احادیث کی تخریج کرتے ہیں جنہیں وہ صحیح یا حسن سمجھتے ہیں، محدثین کے طریقے پر ان کی اسانید، طرق اور راویوں پر کلام کرتے ہیں، کچھ فقہ اور فوائد کے ساتھ، ابواب کی ترتیب کے بغیر؛ نئے ایڈیشن (1413ھ) کے مقدمے میں وہ اپنے احکام کے ناقدین کو جواب دیتے ہیں اور قرار دیتے ہیں کہ ضعیف حدیث کثرتِ طرق سے قوی ہو جاتی ہے جب تک ضعف شدید نہ ہو، اور یہ کہ بعض احکام سے رجوع تناقض نہیں {cite:silsila-sahiha-maarif-v1 p. 2-4} {cite:silsila-sahiha-maarif-v1 p. 29-30}۔"
