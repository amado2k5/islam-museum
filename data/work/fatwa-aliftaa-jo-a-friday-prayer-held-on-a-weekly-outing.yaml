id: work/fatwa-aliftaa-jo-a-friday-prayer-held-on-a-weekly-outing
class: work
kind: fatwa
label: { ar: "صلاة جمعة في رحلة أسبوعية", en: "A Friday prayer held on a weekly outing", ur: "ہفتہ وار سیر میں ادا کی گئی جمعہ کی نماز" }
summary:
  ar: "سؤال عن صلاة جمعة في رحلة أسبوعية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الجمعة لا تصح بالصورة المذكورة لتخلف شروطها من الخطبتين والأربعين من أهل الوجوب وخطة الأبنية، فيجب على المتنزهين إعادتها ظهرًا وإعادة العصر المجموعة معها. أجابت الدائرة بأن للجمعة شروطًا لصحتها، منها أن تصلى جماعة في وقت الظهر، وأن تسبقها خطبتان مستوفيتان لأركانهما، وأن تقام في خطة أبنية مجتمعة، وأن تكون بأربعين ممن تجب عليهم، ونقلت ذلك من عمدة السالك لابن النقيب (ص82). وقالت إن الصورة المذكورة لا تصح بها الجمعة لتخلف أكثر من شرط: فقد سبقتها خطبة وعظية واحدة، والمسافر قبل الفجر سفرًا طويلًا ليس من أهل وجوبها فلا يعتد بحضوره، ولم تقم في خطة أبنية. وخلصت إلى أنه يجب عليهم صلاتها ظهرًا، وهم بالخيار بين قصرها ركعتين وإتمامها أربعًا، ولا تصح صلاتهم ركعتين بنية الجمعة ولا جمع العصر معها، لأن صحة الجمع متوقفة على صحة الصلاة الأولى، فيجب عليهم إعادة الظهر والعصر."
  en: "A question about a Friday prayer held on a weekly outing, in which Jordan's General Iftaa Department answered that the Friday prayer is invalid in the form described because its conditions—two sermons, forty people obliged to attend, and a built-up settlement—are missing, so the group must repeat it as zuhr and repeat the asr combined with it. The Department answered that the Friday prayer has conditions of validity, including being prayed in congregation in the time of zuhr, being preceded by two sermons each fulfilling its pillars, being held within a built-up settlement, and being attended by forty of those on whom it is obligatory, citing Umdat al-Salik by Ibn al-Naqib (p. 82). It said the prayer described is not a valid Friday prayer because several conditions are missing: it was preceded by a single admonitory talk; a person who sets out on a long journey before dawn is not among those obliged to attend, so his presence does not count; and it was not held in a built-up settlement. It concluded that they must pray zuhr instead, choosing between shortening it to two rak'as or praying four; their two rak'as with the intention of Friday prayer are invalid, as is the asr combined with it, since a valid combination depends on the first prayer being valid, so they must repeat both zuhr and asr."
  ur: "ہفتہ وار سیر میں ادا کی گئی جمعہ کی نماز کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بیان کردہ صورت میں جمعہ درست نہیں کیونکہ اس کی شرائط، یعنی دو خطبے، وجوب والے چالیس افراد اور آبادی، موجود نہیں؛ لہٰذا سیر کرنے والے ظہر اور اس کے ساتھ جمع کی گئی عصر دوبارہ پڑھیں۔ ڈیپارٹمنٹ نے جواب دیا کہ جمعہ کے درست ہونے کی شرائط ہیں، جن میں یہ ہیں کہ ظہر کے وقت جماعت سے پڑھا جائے، اس سے پہلے دو خطبے ہوں جن میں سے ہر ایک کے ارکان پورے ہوں، آبادی کی حدود میں قائم ہو، اور ان چالیس افراد کے ساتھ ہو جن پر جمعہ واجب ہے، اور یہ ابن النقیب کی عمدۃ السالک (ص 82) سے نقل کیا۔ اس نے کہا کہ بیان کردہ صورت میں جمعہ درست نہیں کیونکہ ایک سے زیادہ شرائط مفقود ہیں: اس سے پہلے ایک وعظی خطبہ تھا؛ فجر سے پہلے لمبے سفر پر نکلنے والا جمعہ کے وجوب والوں میں سے نہیں، اس لیے اس کی حاضری شمار نہیں؛ اور یہ آبادی میں قائم نہیں ہوا۔ اس نے نتیجہ نکالا کہ ان پر ظہر پڑھنا واجب ہے، اور انہیں دو رکعت قصر یا چار رکعت مکمل پڑھنے کا اختیار ہے؛ جمعہ کی نیت سے ان کی دو رکعتیں درست نہیں، نہ ہی اس کے ساتھ عصر کا جمع، کیونکہ جمع کا درست ہونا پہلی نماز کے درست ہونے پر موقوف ہے، لہٰذا ظہر اور عصر دونوں دوبارہ پڑھنی ہوں گی۔"
