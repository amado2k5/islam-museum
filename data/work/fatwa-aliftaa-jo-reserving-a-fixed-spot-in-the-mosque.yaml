id: work/fatwa-aliftaa-jo-reserving-a-fixed-spot-in-the-mosque
class: work
kind: fatwa
label: { ar: "من يلازم مكانًا في المسجد ويغضب إذا صلى فيه غيره", en: "Someone who keeps a fixed spot in the mosque and is angered when others pray there", ur: "مسجد میں مخصوص جگہ پر اصرار اور دوسرے کے وہاں نماز پڑھنے پر ناراضی", es: "Alguien que mantiene un lugar fijo en la mezquita y se enfada cuando otros rezan allí.", fr: "Une personne qui occupe une place fixe dans la mosquée et qui s'irrite lorsque d'autres y prient.", tr: "Camide bir yerde kalan ve orada başka biri namaz kılınca sinirlenen kişi.", id: "Siapa pun yang tinggal di suatu tempat di masjid dan marah jika orang lain salat di sana." }
summary:
  ar: "سؤال عن من يلازم مكانًا في المسجد ويغضب إذا صلى فيه غيره، أجابت فيه دائرة الإفتاء العام الأردنية بأن اتخاذ مكان ثابت في المسجد مكروه، وأن من سبق إلى مكان فهو أحق به. أجابت الدائرة بأن النبي نهى أن يتخذ الرجل لنفسه مكانًا ثابتًا في المسجد يلازمه كما يلازم البعير مبركه، وأن العلماء عدّوا ذلك من المكروهات. وقالت إن الواجب نصح هذا الرجل بأن من سبق إلى مكان في المسجد فهو أحق به."
  en: "A question about someone who keeps a fixed spot in the mosque and is angered when others pray there, in which Jordan's General Iftaa Department answered that keeping a fixed spot in the mosque is disliked, and that whoever reaches a place first has the better right to it. The Department answered that the Prophet forbade a man to take a fixed spot in the mosque for himself, keeping to it as a camel keeps to its resting place, and that scholars counted this among disliked acts. It said the man should be advised that whoever reaches a place in the mosque first has the better right to it."
  ur: "مسجد میں مخصوص جگہ پر اصرار اور دوسرے کے وہاں نماز پڑھنے پر ناراضی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مسجد میں مستقل جگہ مخصوص کرنا مکروہ ہے، اور جو پہلے کسی جگہ پہنچے وہی اس کا زیادہ حق دار ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ نبی نے منع فرمایا کہ آدمی مسجد میں اپنے لیے ایک مستقل جگہ بنا لے اور اس سے ایسے چمٹا رہے جیسے اونٹ اپنے بیٹھنے کی جگہ سے، اور علما نے اسے مکروہات میں شمار کیا۔ اس نے کہا کہ اس شخص کو نصیحت کی جائے کہ مسجد میں جو پہلے کسی جگہ پہنچے وہی اس کا زیادہ حق دار ہے۔"
  es: "Una pregunta sobre una persona que reserva un lugar fijo en la mezquita y se enoja cuando otros rezan allí, fue respondida por el Departamento General de Iftaa de Jordania, que afirma que reservar un lugar fijo en la mezquita es desaconsejable y que quien llega primero tiene mejor derecho a ocuparlo. El Departamento explicó que el Profeta prohibió a un hombre ocupar un lugar fijo en la mezquita, aferrándose a él como un camello a su lugar de descanso, y que los eruditos consideran esto un acto reprobable. Añadió que se le debe aconsejar a la persona que quien llega primero a un lugar en la mezquita tiene mejor derecho a ocuparlo."
  fr: "Une question a été posée concernant une personne qui occupe une place fixe dans la mosquée et s'irrite lorsque d'autres y prient. Le Département général de la Iftaa de Jordanie a répondu que cette pratique est déconseillée et que celui qui arrive le premier a un droit plus important à la place. Le Département a expliqué que le Prophète a interdit à quiconque de s'approprier une place fixe dans la mosquée, comme un chameau s'accroche à son lieu de repos, et que les savants considèrent cela comme un acte répréhensible. Il a été conseillé à cette personne de rappeler que celui qui arrive le premier à la mosquée a un droit plus important à la place."
  tr: "Camide bir yerde kalıp orada başka biri namaz kılınca sinirlenen birine dair bir soruya ise, Ürdün Genel Fetva Dairesi, camide sabit bir yer tutmanın hoşlanmadığını ve önde olan kişinin daha fazla hak sahibi olduğunu belirtti. Daire, Peygamber'in bir adamın camide kalacağı sabit bir yeri devenin bereketi alacağı için yasakladığını ve alimlerin bunu sevmediğini belirtti. Bu kişiye, daha önce camide bir yeri ziyaret eden kişinin bunu daha hak ettiğini bildirmek zorunlu olduğunu belirtti."
  id: "Sebuah pertanyaan tentang seseorang yang tinggal di suatu tempat di masjid dan marah jika orang lain salat di sana, Departemen Fatwa Jenderal Yordania menjawab bahwa mengambil tempat tetap di masjid tidak disukai, dan siapa pun yang berada di atas tempat itu lebih berhak mendapatkannya. Departemen menjawab bahwa Nabi melarang seorang pria mengambil tempat tetap di masjid yang akan dia tinggali karena unta akan mendapat restu tersebut, dan para ulama menganggap hal itu tidak disukai. Departemen tersebut menyatakan bahwa wajib untuk memberitahu pria ini bahwa siapa pun yang pernah mengunjungi suatu tempat di masjid lebih pantas mendapatkannya."
