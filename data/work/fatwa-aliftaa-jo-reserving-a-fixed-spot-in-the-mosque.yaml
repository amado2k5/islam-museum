id: work/fatwa-aliftaa-jo-reserving-a-fixed-spot-in-the-mosque
class: work
kind: fatwa
label: { ar: "من يلازم مكانًا في المسجد ويغضب إذا صلى فيه غيره", en: "Someone who keeps a fixed spot in the mosque and is angered when others pray there", ur: "مسجد میں مخصوص جگہ پر اصرار اور دوسرے کے وہاں نماز پڑھنے پر ناراضی" }
summary:
  ar: "سؤال عن من يلازم مكانًا في المسجد ويغضب إذا صلى فيه غيره، أجابت فيه دائرة الإفتاء العام الأردنية بأن اتخاذ مكان ثابت في المسجد مكروه، وأن من سبق إلى مكان فهو أحق به. أجابت الدائرة بأن النبي نهى أن يتخذ الرجل لنفسه مكانًا ثابتًا في المسجد يلازمه كما يلازم البعير مبركه، وأن العلماء عدّوا ذلك من المكروهات. وقالت إن الواجب نصح هذا الرجل بأن من سبق إلى مكان في المسجد فهو أحق به."
  en: "A question about someone who keeps a fixed spot in the mosque and is angered when others pray there, in which Jordan's General Iftaa Department answered that keeping a fixed spot in the mosque is disliked, and that whoever reaches a place first has the better right to it. The Department answered that the Prophet forbade a man to take a fixed spot in the mosque for himself, keeping to it as a camel keeps to its resting place, and that scholars counted this among disliked acts. It said the man should be advised that whoever reaches a place in the mosque first has the better right to it."
  ur: "مسجد میں مخصوص جگہ پر اصرار اور دوسرے کے وہاں نماز پڑھنے پر ناراضی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مسجد میں مستقل جگہ مخصوص کرنا مکروہ ہے، اور جو پہلے کسی جگہ پہنچے وہی اس کا زیادہ حق دار ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ نبی نے منع فرمایا کہ آدمی مسجد میں اپنے لیے ایک مستقل جگہ بنا لے اور اس سے ایسے چمٹا رہے جیسے اونٹ اپنے بیٹھنے کی جگہ سے، اور علما نے اسے مکروہات میں شمار کیا۔ اس نے کہا کہ اس شخص کو نصیحت کی جائے کہ مسجد میں جو پہلے کسی جگہ پہنچے وہی اس کا زیادہ حق دار ہے۔"
