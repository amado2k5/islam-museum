id: work/fatwa-aliftaa-jo-reclaimed-wastewater-in-mosques
class: work
kind: fatwa
label: { ar: "استعمال المياه المستصلحة في المساجد", en: "Using reclaimed wastewater in mosques", ur: "مساجد میں دوبارہ قابلِ استعمال بنائے گئے پانی کا استعمال" }
summary:
  ar: "سؤال عن استعمال المياه المستصلحة من مياه الصرف المنزلي في المساجد للتنظيف والوضوء، أجابت فيه دائرة الإفتاء العام الأردنية بأن المعالجة الكيميائية والفصل الفيزيائي لا يكفيان للحكم بطهارتها، فلا يجوز الوضوء بها، ويجب اجتناب تنظيف المساجد بها. أجابت الدائرة بأن مياه الصرف الصحي متنجسة ولو كثرت لتغير صفاتها، فلا يصح التطهر بها، وتطهر المياه المتنجسة بالمكاثرة حتى يعود المجموع ماءً على صفته الأصلية خاليًا من أثر النجاسة لونًا وطعمًا ورائحة، ونقلت ذلك عن النووي في منهاج الطالبين. وقالت إن التنقية بالمعالجة الكيميائية والفصل الفيزيائي لا تكفي للحكم بالطهارة لأن الماء لم يتخلص من النجاسة حقيقة، واستشهدت بأن المواصفة القياسية الأردنية للمياه المنزلية المستصلحة رقم 893/2021 لا تجيز استعمالها في جميع الأغراض. وخلصت إلى أنه لا يجوز استعمالها في الوضوء أو تنظيف البدن أو الثياب، ويجب اجتناب تنظيف المساجد بها احترامًا لها، لأنها مكان الصلاة الذي تشترط فيه الطهارة."
  en: "A question about using water reclaimed from household wastewater in mosques for cleaning and ablution, in which Jordan's General Iftaa Department answered that chemical treatment and physical separation are not enough to deem it pure, so ablution with it is not valid and mosques should not be cleaned with it. The Department answered that sewage water is impure, however large its quantity, because its qualities have changed, so purification with it is not valid; impure water becomes pure by adding a large quantity of water until the whole returns to its original state, free of the impurity's colour, taste and smell, as it quoted from al-Nawawi's Minhaj al-Talibin. It said purification by chemical treatment and physical separation is not enough to deem the water pure, since it has not truly shed the impurity, noting that Jordanian standard no. 893/2021 for reclaimed household wastewater does not allow its use for every purpose. It concluded that the water may not be used for ablution or for cleaning the body or clothes, and that cleaning mosques with it should be avoided out of respect for them, since they are places of prayer where purity is required."
  ur: "گھریلو گندے پانی سے دوبارہ قابلِ استعمال بنائے گئے پانی کو مساجد میں صفائی اور وضو کے لیے استعمال کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کیمیائی عمل اور طبعی علیحدگی اسے پاک قرار دینے کے لیے کافی نہیں، لہٰذا اس سے وضو درست نہیں اور مساجد کی صفائی میں اس سے بچنا لازم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سیوریج کا پانی اپنی صفات بدل جانے کی وجہ سے ناپاک ہے خواہ کتنا ہی زیادہ ہو، اس لیے اس سے طہارت درست نہیں؛ ناپاک پانی زیادہ پانی ملانے سے پاک ہوتا ہے یہاں تک کہ مجموعہ اپنی اصل حالت پر لوٹ آئے اور نجاست کے رنگ، ذائقے اور بو سے خالی ہو، جیسا کہ اس نے نووی کی منہاج الطالبین سے نقل کیا۔ اس نے کہا کہ کیمیائی عمل اور طبعی علیحدگی سے صفائی پانی کو پاک قرار دینے کے لیے کافی نہیں کیونکہ اس سے حقیقتاً نجاست دور نہیں ہوئی، اور بتایا کہ گھریلو گندے پانی کی دوبارہ قابلِ استعمال صورت کے لیے اردنی معیار نمبر 893/2021 اسے ہر مقصد کے لیے استعمال کی اجازت نہیں دیتا۔ اس نے نتیجہ نکالا کہ اسے وضو یا بدن اور کپڑوں کی صفائی میں استعمال نہیں کیا جا سکتا، اور مساجد کے احترام میں ان کی صفائی میں اس سے بچنا لازم ہے، کیونکہ وہ نماز کی جگہ ہیں جہاں طہارت شرط ہے۔"
