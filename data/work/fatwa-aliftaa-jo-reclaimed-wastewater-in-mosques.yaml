label: { ar: "استعمال المياه المستصلحة في المساجد", en: "Using reclaimed wastewater in mosques", ur: "مساجد میں دوبارہ قابلِ استعمال بنائے گئے پانی کا استعمال", es: "Uso de aguas residuales tratadas en mezquitas", fr: "Utilisation des eaux usées recyclées dans les mosquées", tr: "Camilerde Geri Kazanılmış Suyun Kullanımı", id: "Penggunaan Air Daur Ulang di Masjid" }
summary:
  ar: "سؤال عن استعمال المياه المستصلحة من مياه الصرف المنزلي في المساجد للتنظيف والوضوء، أجابت فيه دائرة الإفتاء العام الأردنية بأن المعالجة الكيميائية والفصل الفيزيائي لا يكفيان للحكم بطهارتها، فلا يجوز الوضوء بها، ويجب اجتناب تنظيف المساجد بها. أجابت الدائرة بأن مياه الصرف الصحي متنجسة ولو كثرت لتغير صفاتها، فلا يصح التطهر بها، وتطهر المياه المتنجسة بالمكاثرة حتى يعود المجموع ماءً على صفته الأصلية خاليًا من أثر النجاسة لونًا وطعمًا ورائحة، ونقلت ذلك عن النووي في منهاج الطالبين. وقالت إن التنقية بالمعالجة الكيميائية والفصل الفيزيائي لا تكفي للحكم بالطهارة لأن الماء لم يتخلص من النجاسة حقيقة، واستشهدت بأن المواصفة القياسية الأردنية للمياه المنزلية المستصلحة رقم 893/2021 لا تجيز استعمالها في جميع الأغراض. وخلصت إلى أنه لا يجوز استعمالها في الوضوء أو تنظيف البدن أو الثياب، ويجب اجتناب تنظيف المساجد بها احترامًا لها، لأنها مكان الصلاة الذي تشترط فيه الطهارة."
  en: "A question about using water reclaimed from household wastewater in mosques for cleaning and ablution, in which Jordan's General Iftaa Department answered that chemical treatment and physical separation are not enough to deem it pure, so ablution with it is not valid and mosques should not be cleaned with it. The Department answered that sewage water is impure, however large its quantity, because its qualities have changed, so purification with it is not valid; impure water becomes pure by adding a large quantity of water until the whole returns to its original state, free of the impurity's colour, taste and smell, as it quoted from al-Nawawi's Minhaj al-Talibin. It said purification by chemical treatment and physical separation is not enough to deem the water pure, since it has not truly shed the impurity, noting that Jordanian standard no. 893/2021 for reclaimed household wastewater does not allow its use for every purpose. It concluded that the water may not be used for ablution or for cleaning the body or clothes, and that cleaning mosques with it should be avoided out of respect for them, since they are places of prayer where purity is required."
  ur: "گھریلو گندے پانی سے دوبارہ قابلِ استعمال بنائے گئے پانی کو مساجد میں صفائی اور وضو کے لیے استعمال کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کیمیائی عمل اور طبعی علیحدگی اسے پاک قرار دینے کے لیے کافی نہیں، لہٰذا اس سے وضو درست نہیں اور مساجد کی صفائی میں اس سے بچنا لازم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سیوریج کا پانی اپنی صفات بدل جانے کی وجہ سے ناپاک ہے خواہ کتنا ہی زیادہ ہو، اس لیے اس سے طہارت درست نہیں؛ ناپاک پانی زیادہ پانی ملانے سے پاک ہوتا ہے یہاں تک کہ مجموعہ اپنی اصل حالت پر لوٹ آئے اور نجاست کے رنگ، ذائقے اور بو سے خالی ہو، جیسا کہ اس نے نووی کی منہاج الطالبین سے نقل کیا۔ اس نے کہا کہ کیمیائی عمل اور طبعی علیحدگی سے صفائی پانی کو پاک قرار دینے کے لیے کافی نہیں کیونکہ اس سے حقیقتاً نجاست دور نہیں ہوئی، اور بتایا کہ گھریلو گندے پانی کی دوبارہ قابلِ استعمال صورت کے لیے اردنی معیار نمبر 893/2021 اسے ہر مقصد کے لیے استعمال کی اجازت نہیں دیتا۔ اس نے نتیجہ نکالا کہ اسے وضو یا بدن اور کپڑوں کی صفائی میں استعمال نہیں کیا جا سکتا، اور مساجد کے احترام میں ان کی صفائی میں اس سے بچنا لازم ہے، کیونکہ وہ نماز کی جگہ ہیں جہاں طہارت شرط ہے۔"
  es: "Una pregunta sobre el uso de agua recuperada de aguas residuales domésticas en mezquitas para limpieza y abluciones, a la que el Departamento General de Iftaa de Jordania respondió que el tratamiento químico y la separación física no son suficientes para considerarla pura, por lo que la ablución con ella no es válida y las mezquitas no deben limpiarse con ella. El Departamento respondió que el agua residual es impura, por mucha cantidad que haya, porque sus cualidades han cambiado, por lo que la purificación con ella no es válida; el agua impura se purifica añadiendo una gran cantidad de agua hasta que todo vuelva a su estado original, libre del color, sabor y olor de la impureza, como citó de Minhaj al-Talibin de al-Nawawi. Dijo que la purificación mediante tratamiento químico y separación física no es suficiente para considerar el agua pura, ya que no se ha desprendido completamente de la impureza, señalando que la norma jordana n.º 893/2021 para aguas residuales domésticas recuperadas no permite su uso para cualquier propósito. Se concluyó que el agua no debe utilizarse para la ablución ni para la limpieza del cuerpo o la ropa, y que debe evitarse limpiar las mezquitas con ella por respeto a ellas, ya que son lugares de oración donde se requiere pureza."
  fr: "Concernant l'utilisation d'eau recyclée issue des eaux usées domestiques dans les mosquées pour le nettoyage et les ablutions, le Département général de la Iftaa de Jordanie a répondu que le traitement chimique et la séparation physique ne suffisent pas à la purifier. Par conséquent, les ablutions avec cette eau ne sont pas valides et les mosquées ne doivent pas être nettoyées avec. Le Département a expliqué que les eaux usées sont impures, quelle que soit leur quantité, car leurs propriétés ont été altérées. Ainsi, la purification avec cette eau n'est pas valable. L'eau impure devient pure en y ajoutant une grande quantité d'eau jusqu'à ce qu'elle retrouve son état initial, exempte de couleur, de goût et d'odeur, comme l'indique le Minhaj al-Talibin d'al-Nawawi. Le Département a précisé que la purification par traitement chimique et séparation physique ne suffit pas à purifier l'eau, car elle n'élimine pas véritablement les impuretés. Il a également souligné que la norme jordanienne n° 893/2021 relative aux eaux usées domestiques recyclées n'autorise pas leur utilisation pour tous les usages. Il a été conclu que cette eau ne pouvait être utilisée pour les ablutions ni pour le nettoyage du corps ou des vêtements, et que son utilisation pour nettoyer les mosquées devait être évitée par respect pour ces lieux de prière où la pureté est requise."
  tr: "Evsel atık suyun camilerde temizlik ve abdest kullanımı hakkında soruya gelince, Ürdün Genel Fetva Dairesi, kimyasal arıtma ve fiziksel ayrımın temiz olduğunu değerlendirmek için yeterli olmadığını, bu nedenle abdest almanın izin verilmediğini ve cami temizliğinden kaçınılması gerektiğini yanıtladı. Departman, kanalizasyon suyunun, bol olsa bile, özelliklerindeki değişiklikler nedeniyle saf olmadığını, bu nedenle arıtmanın geçerli olmadığını yanıtladı. Saf olmayan su, toplam su renk, tat ve koku kirlerinin etkisinden arındırılana kadar çoğaltma yoluyla arıtılır. Minhaj Al-Taliban'da Al-Nawawi'nin alıntısını yaptı. Kimyasal arıtma ve fiziksel ayrımla arıtmanın suyun saf olduğuna karar vermek için yeterli olmadığını, çünkü suyun gerçekten kirleri tamamen ortadan kaldırmadığını belirtti. Ürdün Geri Kazanılmış Evsel Suyu Standart Spesifikasyonu No. 893/2021'in tüm amaçlar için kullanılmasına izin vermediğini belirtti. Rapor, bu yerlerin abdest alma veya beden ya da kıyafet temizliği için kullanılmasının yasak olduğu ve camilerden saygı gereği uzak durulması gerektiği sonucuna varıldı; çünkü bu yerler temizlik gerektiren ibadet yerleridir."
  id: "Mengenai penggunaan air yang diambil dari air limbah rumah tangga di masjid untuk pembersihan dan wudhu, Departemen Fatwa Umum Yordania menanggapi bahwa perlakuan kimia dan pemisahan fisik tidak cukup untuk menilai air tersebut murni, sehingga wudhu tidak diperbolehkan, dan pembersihan masjid dengan air tersebut harus dihindari. Departemen menjawab bahwa air limbah tidak murni, meskipun melimpah, karena perubahan sifatnya, sehingga pemurnian tidak sah. Air yang tidak murni dimurnikan dengan perkalian hingga total air kembali ke kondisi aslinya, bebas dari efek kotoran dalam warna, rasa, dan bau. Mereka mengutip Al-Nawawi dalam Minhaj Al-Talibin. Mereka menyatakan bahwa pemurnian dengan perlakuan kimia dan pemisahan fisik tidak cukup untuk menyatakan air tersebut murni karena air tersebut belum benar-benar menghilangkan kotoran. Mereka mengutip bahwa Spesifikasi Standar Yordania untuk Air Rumah Tangga Yang Direklamasi No. 893/2021 tidak mengizinkan penggunaannya untuk semua tujuan. Sidang tersebut menyimpulkan bahwa tidak diperbolehkan digunakan untuk wudhu atau membersihkan tubuh atau pakaian, dan masjid harus dihindari demi menghormati masjid tersebut, karena masjid adalah tempat salat yang membutuhkan kesucian."
