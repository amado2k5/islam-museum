label: { ar: "كتاب علم الهيئة على اعتقاد أهل السنة والجماعة دون الفلاسفة ⁦(الهيئة الإسلامية)⁩", en: "Kitab ilm al-hay'a ala i'tiqad ahl al-sunna wa-l-jama'a dun al-falasifa (al-Hay'a al-islamiyya)", ur: "کتاب علم الہیئۃ علی اعتقاد اہل السنۃ والجماعۃ دون الفلاسفہ" }
summary:
  ar: "رسالة لإبراهيم القرماني الآمدي ⁦(ت 1000هـ)⁩ في الهيئة على عقيدة أهل السنة دون الفلاسفة، انتشرت بعناوين متقاربة كثيرة وترجمات تركية، ومادتها مأخوذة من الهيئة السنية للسيوطي {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 18} {cite:heinen-islamic-cosmology p. 19}."
  en: "Treatise by Ibrahim al-Qaramani al-Amidi (d. 1000 AH) on astronomy according to the tenets of the Sunnis rather than the philosophers, circulating under many similar titles and in Turkish versions, its material taken from al-Suyuti's al-Hay'a al-saniyya {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 18} {cite:heinen-islamic-cosmology p. 19}."
  ur: "ابراہیم قرمانی آمدی (م 1000ھ) کا رسالہ جو فلاسفہ کے بجائے اہلِ سنت کے عقیدے پر ہیئت میں ہے؛ بہت سے ملتے جلتے عنوانات اور ترکی تراجم میں پھیلا، اور اس کا مواد سیوطی کی الہیئۃ السنیہ سے ہے {cite:heinen-islamic-cosmology p. 19}."
