id: work/fatwa-aliftaa-jo-nail-polish-and-wudu
class: work
kind: fatwa
label: { ar: "الوضوء والغسل مع طلاء الأظافر", en: "Wudu and ghusl with nail polish", ur: "ناخن پالش کے ساتھ وضو اور غسل" }
summary:
  ar: "سؤال عن امرأة توضأت أو اغتسلت وعلى أظافرها طلاء، أجابت فيه دائرة الإفتاء العام الأردنية بوجوب إزالة الطلاء قبل الوضوء أو الغسل لأنه حائل يمنع وصول الماء. أجابت الدائرة بأنه يجب إزالة طلاء الأظافر قبل الوضوء أو الغسل حتى يتحقق وصول الماء إلى ما تحته، لأنه يعد حائلًا يمنع وصول الماء. واستشهدت بحديث رواه علي في الوعيد لمن ترك موضع شعرة من جنابة لم يصبها الماء."
  en: "A question about a woman who performed wudu or ghusl while wearing nail polish, in which Jordan's General Iftaa Department answered that the polish must be removed beforehand because it is a barrier that keeps water out. The Department answered that nail polish must be removed before wudu or ghusl so that water is sure to reach what lies beneath it, because it counts as a barrier that prevents water from reaching the nail. It cited a hadith narrated by Ali warning anyone who, in the ghusl for major impurity, leaves even the spot of one hair untouched by water."
  ur: "ایک خاتون کے بارے میں سوال جس نے ناخنوں پر پالش کے ساتھ وضو یا غسل کیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وضو یا غسل سے پہلے پالش اتارنا واجب ہے کیونکہ یہ پانی پہنچنے سے روکنے والی رکاوٹ ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ وضو یا غسل سے پہلے ناخن پالش اتارنا واجب ہے تاکہ یقینی ہو کہ پانی اس کے نیچے تک پہنچے، کیونکہ یہ پانی پہنچنے سے روکنے والی رکاوٹ شمار ہوتی ہے۔ اس نے علی کی روایت کردہ اس حدیث کا حوالہ دیا جس میں جنابت کے غسل میں ایک بال کی جگہ بھی پانی کے بغیر چھوڑ دینے پر وعید ہے۔"
