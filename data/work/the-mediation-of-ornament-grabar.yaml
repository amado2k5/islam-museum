summary:
  ar: "كتاب بالإنجليزية لأوليغ غرابار عن الزخرفة في الفن الإسلامي، وأصلها محاضرات ميلون في الفنون الجميلة لسنة 1989، صدر عن مطبعة جامعة برينستون سنة 1992."
  en: "An English book by Oleg Grabar on ornament in Islamic art, based on his 1989 A. W. Mellon Lectures in the Fine Arts, published by Princeton University Press in 1992."
  ur: "اولیگ گرابار کی انگریزی کتاب جو اسلامی فن میں آرائش پر ہے اور 1989ء کے میلن لیکچرز پر مبنی ہے؛ پرنسٹن یونیورسٹی پریس سے 1992ء میں شائع ہوئی۔"
  fr: "The Mediation of Ornament est un livre d'Oleg Grabar issu de ses A. W. Mellon Lectures in the Fine Arts de 1989, publié par Princeton University Press en 1992 dans la Bollingen Series. Selon le résumé de la jaquette, Grabar définit les ornements comme des agents qui ne sont pas logiquement nécessaires à la perception d'un message visuel, mais sans lesquels la compréhension serait plus difficile ; ils attirent souvent le regard vers l'œuvre en accroissant le plaisir de la regarder."
  es: "The Mediation of Ornament es un libro de Oleg Grabar basado en sus A. W. Mellon Lectures in the Fine Arts de 1989, publicado por Princeton University Press en 1992 en la Bollingen Series. Según el resumen de la sobrecubierta, Grabar define los ornamentos como agentes que no son lógicamente necesarios para percibir un mensaje visual, pero sin los cuales la comprensión sería más difícil; a menudo atraen al espectador hacia la obra al aumentar el placer de mirarla."
  tr: "The Mediation of Ornament, Oleg Grabar'ın 1989 A. W. Mellon Güzel Sanatlar Konferansları'na dayanan, 1992'de Princeton University Press tarafından Bollingen dizisinde yayımlanan kitabıdır. Kapak özetine göre Grabar süslemeyi, görsel bir mesajın algılanması için mantıken gerekli olmayan ama yokluğunda anlamanın zorlaşacağı unsurlar olarak tanımlar; bunlar çoğu zaman bakma zevkini artırarak izleyiciyi esere çeker."
  id: "The Mediation of Ornament adalah buku Oleg Grabar yang bertolak dari A. W. Mellon Lectures in the Fine Arts tahun 1989, terbitan Princeton University Press tahun 1992 dalam Bollingen Series. Menurut ringkasan sampul, Grabar mendefinisikan ornamen sebagai unsur yang secara logis tidak diperlukan untuk menangkap pesan visual, tetapi tanpanya pemahaman menjadi lebih sulit; ornamen sering menarik penikmat ke dalam karya dengan menambah kenikmatan memandang."
