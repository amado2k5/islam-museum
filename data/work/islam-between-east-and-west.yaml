summary:
  ar: "كتاب لعلي عزت بيغوفيتش يقدّم فيه الإسلام طريقاً ثالثاً بين المادية والدين المجرد، صدر أول مرة عن دار أمريكان ترست سنة 1984، ثم في طبعة ثانية سنة 1989 وثالثة سنة 1993."
  en: "A book by Alija Izetbegović presenting Islam as a third way between materialism and pure religion, first published by American Trust Publications in 1984, with a second edition in 1989 and a third in 1993."
  ur: "علی عزت بیگووچ کی کتاب جو اسلام کو مادیت اور خالص مذہب کے درمیان تیسری راہ کے طور پر پیش کرتی ہے؛ امریکن ٹرسٹ پبلیکیشنز سے پہلی بار 1984ء میں، پھر 1989ء میں دوسرے اور 1993ء میں تیسرے ایڈیشن میں شائع ہوئی۔"
  es: "Un libro de Alija Izetbegović que presenta el Islam como una tercera vía entre el materialismo y la religión pura, publicado por primera vez por American Trust Publications en 1984, con una segunda edición en 1989 y una tercera en 1993."
  fr: "Un livre d'Alija Izetbegović présentant l'islam comme une troisième voie entre le matérialisme et la religion pure, publié pour la première fois par American Trust Publications en 1984, avec une deuxième édition en 1989 et une troisième en 1993."
  tr: "Ali Izetbegović'in İslam'ın materyalizm ile saf din arasında üçüncü bir yolu sunduğu kitabı, ilk olarak 1984'te American Trust tarafından, ardından 1989'da ikinci baskısı ve 1993'te üçüncü baskısı olarak yayımlandı."
  id: "Sebuah buku karya Ali Izetbegović di mana Islam menyajikan jalan ketiga antara materialisme dan agama murni, pertama kali diterbitkan oleh American Trust pada tahun 1984, kemudian edisi kedua pada tahun 1989, dan edisi ketiga pada tahun 1993."
