summary:
  ar: "تحرير ألفاظ التنبيه للنووي، كتبه لشرح الألفاظ النادرة والمصطلحات الفقهية في «التنبيه» لأبي إسحاق الشيرازي، وتُشرح الكلمات فيه بترتيب ورودها في الكتاب. له دراسة اسمها «الإيضاح» لحمزة بن أحمد الحسيني، وحقّقه عبد الغني الدقر ونُشر بدمشق ١٤٠٨هـ/١٩٨٨م."
  en: "al-Nawawi's Tahrir alfaz al-Tanbih, written to explain the rare words and legal terms in Abu Ishaq al-Shirazi's al-Tanbih, taking the words in the order in which they occur in that book. Hamza ibn Ahmad al-Husayni wrote a study of it, al-Idah, and Abd al-Ghani al-Daqr edited it (Damascus 1408/1988)."
  es: "El Tahrir alfaz al-Tanbih de al-Nawawi, escrito para explicar las palabras raras y los términos jurídicos del al-Tanbih de Abu Ishaq al-Shirazi, tomando las palabras en el orden en que aparecen en ese libro. Hamza ibn Ahmad al-Husayni escribió un estudio, al-Idah, y Abd al-Ghani al-Daqr lo editó (Damasco 1408/1988)."
  fr: "Le Tahrir alfaz al-Tanbih d'al-Nawawi, écrit pour expliquer les mots rares et les termes juridiques de l'al-Tanbih d'Abu Ishaq al-Shirazi, en prenant les mots dans l'ordre où ils apparaissent dans ce livre. Hamza ibn Ahmad al-Husayni en fit une étude, al-Idah, et Abd al-Ghani al-Daqr l'a édité (Damas 1408/1988)."
  ur: "نووی کی تحریر الفاظ التنبیہ، جو ابو اسحاق شیرازی کی التنبیہ کے نادر الفاظ اور فقہی اصطلاحات کی شرح کے لیے لکھی گئی، الفاظ اسی ترتیب سے جس میں وہ اس کتاب میں آتے ہیں۔ حمزہ بن احمد حسینی نے اس پر الایضاح کے نام سے مطالعہ لکھا اور عبدالغنی الدقر نے اسے دمشق 1408ھ/1988ء میں شائع کیا۔"
  tr: "El-Nevavi'nin Tahrir Alfaz el-Tanbih'i, Ebu İshaq el-Şirazi'nin 'El-Tanbih' adlı eserinde nadir kelimeleri ve fıkıh terimlerini açıklayan kitapları ve içindeki kelimeler kitapta yer aldıkları sırayla açıklanmıştır. Hamza bin Ahmed el-Hüseyni'nin 'El-İdhah' adlı çalışması vardır; bu çalışma Abd al-Ghani al-Daqr tarafından düzenlenmiş ve 1408 Hicri / 1988 yılında Şam'da yayımlanmıştır."
  id: "Tahrir Alfaz al-Tanbih oleh al-Nawawi, bukunya menjelaskan kata-kata langka dan istilah yurisprudensi dalam 'Al-Tanbih' oleh Abu Ishaq al-Shirazi, dan kata-kata di dalamnya dijelaskan sesuai urutan kemunculannya dalam buku. Ia memiliki studi berjudul 'Al-Idhah' oleh Hamza ibn Ahmad al-Husayni, disunting oleh Abd al-Ghani al-Daqr dan diterbitkan di Damaskus pada tahun 1408 H / 1988 M."
