id: work/fatwa-aliftaa-jo-must-the-itikaf-mosque-hold-friday-prayer
class: work
kind: fatwa
label: { ar: "اشتراط إقامة الجمعة في مسجد الاعتكاف", en: "Whether the mosque for i'tikaf must hold Friday prayer", ur: "کیا اعتکاف کی مسجد میں جمعہ ہونا شرط ہے؟" }
summary:
  ar: "سؤال عن اشتراط إقامة الجمعة في مسجد الاعتكاف، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يشترط، إلا لمن نذر اعتكافًا متتابعًا تتخلله جمعة. أجابت الدائرة بأنه لا يشترط في المسجد الذي يعتكف فيه أن تقام فيه الجمعة. واستثنت من نذر اعتكافًا متتابعًا تتخلله جمعة، فيشترط أن يكون اعتكافه في مسجد تقام فيه الجمعة، حتى لا يقطع تتابعه بالخروج لصلاتها."
  en: "A question about whether the mosque for i'tikaf must hold Friday prayer, in which Jordan's General Iftaa Department answered that it is not a condition, except for someone who has vowed a continuous i'tikaf that spans a Friday. The Department answered that it is not a condition for the mosque of i'tikaf to be one where Friday prayer is held. It made an exception for someone who has vowed a continuous i'tikaf that spans a Friday: his i'tikaf must be in a mosque where Friday prayer is held, so that he does not break its continuity by leaving to attend the Friday prayer."
  ur: "کیا اعتکاف کی مسجد میں جمعہ ہونا شرط ہے؟ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط نہیں، سوائے اس کے جس نے ایسے مسلسل اعتکاف کی نذر مانی ہو جس کے درمیان جمعہ آتا ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ اعتکاف کی مسجد میں جمعہ کا ہونا شرط نہیں۔ اس نے اس شخص کو مستثنیٰ کیا جس نے ایسے مسلسل اعتکاف کی نذر مانی ہو جس کے درمیان جمعہ آتا ہو؛ اس کا اعتکاف ایسی مسجد میں ہونا ضروری ہے جہاں جمعہ ہوتا ہو، تاکہ جمعہ کے لیے نکلنے سے تسلسل نہ ٹوٹے۔"
