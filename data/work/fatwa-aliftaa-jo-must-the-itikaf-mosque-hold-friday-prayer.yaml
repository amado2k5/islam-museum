id: work/fatwa-aliftaa-jo-must-the-itikaf-mosque-hold-friday-prayer
class: work
kind: fatwa
label: { ar: "اشتراط إقامة الجمعة في مسجد الاعتكاف", en: "Whether the mosque for i'tikaf must hold Friday prayer", ur: "کیا اعتکاف کی مسجد میں جمعہ ہونا شرط ہے؟", es: "Si la mezquita para el i'tikaf debe celebrar la oración del viernes", fr: "La mosquée pour l'itikaf doit-elle organiser la prière du vendredi ?", tr: "İ'tikaf camisinde cuma namazı yapılması zorunluluğu", id: "Persyaratan untuk mengadakan salat Jumat di masjid I'tikaf" }
summary:
  ar: "سؤال عن اشتراط إقامة الجمعة في مسجد الاعتكاف، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يشترط، إلا لمن نذر اعتكافًا متتابعًا تتخلله جمعة. أجابت الدائرة بأنه لا يشترط في المسجد الذي يعتكف فيه أن تقام فيه الجمعة. واستثنت من نذر اعتكافًا متتابعًا تتخلله جمعة، فيشترط أن يكون اعتكافه في مسجد تقام فيه الجمعة، حتى لا يقطع تتابعه بالخروج لصلاتها."
  en: "A question about whether the mosque for i'tikaf must hold Friday prayer, in which Jordan's General Iftaa Department answered that it is not a condition, except for someone who has vowed a continuous i'tikaf that spans a Friday. The Department answered that it is not a condition for the mosque of i'tikaf to be one where Friday prayer is held. It made an exception for someone who has vowed a continuous i'tikaf that spans a Friday: his i'tikaf must be in a mosque where Friday prayer is held, so that he does not break its continuity by leaving to attend the Friday prayer."
  ur: "کیا اعتکاف کی مسجد میں جمعہ ہونا شرط ہے؟ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ شرط نہیں، سوائے اس کے جس نے ایسے مسلسل اعتکاف کی نذر مانی ہو جس کے درمیان جمعہ آتا ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ اعتکاف کی مسجد میں جمعہ کا ہونا شرط نہیں۔ اس نے اس شخص کو مستثنیٰ کیا جس نے ایسے مسلسل اعتکاف کی نذر مانی ہو جس کے درمیان جمعہ آتا ہو؛ اس کا اعتکاف ایسی مسجد میں ہونا ضروری ہے جہاں جمعہ ہوتا ہو، تاکہ جمعہ کے لیے نکلنے سے تسلسل نہ ٹوٹے۔"
  es: "Ante una pregunta sobre si la mezquita para el i'tikaf debe albergar la oración del viernes, el Departamento General de Iftaa de Jordania respondió que no es un requisito, excepto para quien haya hecho un voto de i'tikaf continuo que abarque un viernes. El Departamento aclaró que no es condición que la mezquita del i'tikaf sea una donde se celebre la oración del viernes. Sin embargo, hizo una excepción para quien haya hecho un voto de i'tikaf continuo que abarque un viernes: su i'tikaf debe realizarse en una mezquita donde se celebre la oración del viernes, para que no interrumpa su continuidad al ausentarse para asistir a dicha oración."
  fr: "Concernant la question de savoir si la mosquée où se déroule l'i'tikaf doit accueillir la prière du vendredi, le Département général de la Iftaa en Jordanie a répondu que ce n'est pas une condition, sauf pour une personne ayant fait vœu d'i'tikaf continu incluant un vendredi. Le Département a précisé que l'i'tikaf ne doit pas nécessairement se dérouler dans une mosquée où est célébrée la prière du vendredi. Une exception est toutefois prévue pour cette personne: son i'tikaf doit se dérouler dans une mosquée où est célébrée la prière du vendredi, afin de ne pas interrompre sa retraite en s'y rendant."
  tr: "İ'tikaf camisinde cuma namazının yapılması gerekliliğiyle ilgili bir soruya ise, Ürdün Genel Fetva Dairesi, bunun yalnızca ardışık I'tikaf yemin edenlerin ve Cuma namazlarının arasında yer alması gerektiğini söyledi. Daire, Cuma namazının i'tikaf yapıldığı camide kılınmasının zorunlu olmadığını belirtti. Ardışık I'tikaf yemin edenleri muaf tuttu; böylece Imtikafları Cuma namazı yapılan bir camide yapılır ve ardışık I'tikaf namazını kılmak için dışarı çıkarak kesintiye uğramaz."
  id: "Sebuah pertanyaan mengenai persyaratan untuk mengadakan salat Jumat di masjid I'tikaf, Departemen Fatwa Umum Yordania menjawab bahwa itu hanya diperlukan bagi mereka yang berkaul I'tikaf berturut-turut yang diselingi dengan salat Jumat. Departemen menjawab bahwa tidak diwajibkan untuk mengadakan salat Jumat di masjid tempat seseorang menjalankan I'tikaf. Mereka yang berikrar I'tikaf berturut-turut dikecualikan dengan salat Jumat, sehingga I'tikaf mereka diadakan di masjid tempat salat Jumat dilakukan, sehingga I'tikaf berturut-turut tidak terganggu oleh keluar untuk melaksanakan salat tersebut."
