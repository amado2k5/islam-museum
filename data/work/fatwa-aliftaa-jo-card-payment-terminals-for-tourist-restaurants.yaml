id: work/fatwa-aliftaa-jo-card-payment-terminals-for-tourist-restaurants
class: work
kind: fatwa
label: { ar: "تركيب أجهزة الدفع بالبطاقات للمطاعم السياحية", en: "Card payment terminals for tourist restaurants", ur: "سیاحتی ریستورانوں کے لیے کارڈ پیمنٹ مشینیں", es: "Terminales de pago con tarjeta para restaurantes turísticos", fr: "Terminaux de paiement par carte pour les restaurants touristiques" }
summary:
  ar: "سؤال عن تركيب أجهزة الدفع بالبطاقات للمطاعم السياحية، أجابت فيه دائرة الإفتاء العام الأردنية بأن حكم تركيب أجهزة نقاط البيع يتبع مجال عمل المؤسسة؛ فيجوز لما غالب عمله مباح ومنه المطاعم السياحية والفنادق، ويحرم لما غالب عمله بيع المحرمات، ويتبع المختلط الغالب مع أفضلية التورع. أجابت الدائرة بأن حكم تركيب أجهزة الدفع الإلكتروني يرتبط بمجال عمل المؤسسة؛ فإن كان مباحًا كان تركيب الأجهزة فيها مباحًا، وإن كان غالب عمل المتجر بيع المحرمات كالخمر والخنزير أو الملاهي الليلية حرم ذلك لما فيه من الإعانة على الحرام، واستشهدت بـ[[passage/quran-5-2|سورة المائدة 5:2]]. وقالت إن عمل المؤسسة إن كان مختلطًا فالحكم للغالب من الحلال أو الحرام، والأفضل في هذه الحالة عدم تركيب الأجهزة اتقاء للشبهات. وخلصت إلى أن تركيب الأجهزة للمطاعم السياحية والفنادق جائز لأن غالب عملها مباح، وأن الحرام الطارئ في بعض ما يقدم فيها يتحمل وزره القائمون عليها."
  en: "A question about card payment terminals for tourist restaurants, in which Jordan's General Iftaa Department answered that installing point-of-sale terminals follows the business's field of work: it is permitted for businesses whose work is mostly lawful, including tourist restaurants and hotels, forbidden for those whose work is mostly selling forbidden things, and a mixed business follows what predominates, though refraining is better. The Department answered that the ruling on installing electronic payment terminals depends on the business's field: if it is lawful, installing terminals there is lawful; if the shop's work is mostly selling forbidden things such as alcohol and pork, or nightclubs, it is forbidden because it aids what is forbidden, citing [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It said that if the business's work is mixed, the ruling follows whichever of lawful or unlawful predominates, and in that case it is better not to install the terminals, to avoid doubtful matters. It concluded that installing terminals in tourist restaurants and hotels is permitted because most of their work is lawful, and the burden of any incidental forbidden item they serve rests on those who run them."
  ur: "سیاحتی ریستورانوں کے لیے کارڈ پیمنٹ مشینیں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پوائنٹ آف سیل مشینیں لگانے کا حکم ادارے کے کاروبار کے تابع ہے: جس کا زیادہ کام حلال ہو، جیسے سیاحتی ریستوران اور ہوٹل، اس کے لیے جائز ہے، جس کا زیادہ کام حرام اشیا کی فروخت ہو اس کے لیے حرام، اور مخلوط میں غالب کا اعتبار ہے، اگرچہ احتیاط بہتر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ الیکٹرانک ادائیگی کی مشینیں لگانے کا حکم ادارے کے کاروبار سے جڑا ہے: اگر وہ جائز ہو تو وہاں مشینیں لگانا جائز ہے؛ اور اگر دکان کا زیادہ کام حرام اشیا جیسے شراب اور خنزیر یا نائٹ کلب ہو تو یہ حرام ہے کیونکہ اس میں حرام پر مدد ہے، اور [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے کہا کہ اگر ادارے کا کام مخلوط ہو تو حلال یا حرام میں سے جو غالب ہو اسی کا حکم ہے، اور اس صورت میں شبہات سے بچنے کے لیے مشینیں نہ لگانا بہتر ہے۔ اس نے نتیجہ نکالا کہ سیاحتی ریستورانوں اور ہوٹلوں میں مشینیں لگانا جائز ہے کیونکہ ان کا زیادہ کام جائز ہے، اور ان میں پیش کی جانے والی کسی عارضی حرام چیز کا بوجھ انہیں چلانے والوں پر ہے۔"
  es: "Una pregunta sobre terminales de pago con tarjeta para restaurantes turísticos, a la que el Departamento General de Iftaa de Jordania respondió que la instalación de terminales de punto de venta depende del tipo de negocio: está permitida para negocios cuya actividad sea mayoritariamente lícita, como restaurantes y hoteles turísticos; prohibida para aquellos cuya actividad principal sea la venta de productos prohibidos; y en el caso de negocios mixtos, se aplica la actividad predominante, aunque es preferible abstenerse. El Departamento explicó que la normativa sobre la instalación de terminales de pago electrónico depende del tipo de negocio: si es lícito, la instalación de terminales es lícita; si el negocio consiste principalmente en la venta de productos prohibidos, como alcohol y carne de cerdo, o en clubes nocturnos, está prohibida porque fomenta lo ilícito, citando [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. Añadió que si la actividad del negocio es mixta, la normativa se aplica según la actividad lícita o ilícita que predomine, y en ese caso es preferible no instalar los terminales para evitar dudas. Se concluyó que la instalación de terminales en restaurantes y hoteles turísticos está permitida porque la mayor parte de su actividad es legal, y la responsabilidad por cualquier artículo prohibido que sirvan incidentalmente recae sobre quienes los administran."
  fr: "Concernant la question des terminaux de paiement par carte dans les restaurants touristiques, le Département général de la Iftaa en Jordanie a répondu que l'installation de ces terminaux dépend du secteur d'activité de l'établissement: elle est autorisée pour les entreprises dont l'activité est majoritairement licite, comme les restaurants et hôtels touristiques, et interdite pour celles qui vendent principalement des produits illicites. Pour les entreprises mixtes, la règle s'applique selon l'activité prédominante, même s'il est préférable de s'abstenir. Le Département a précisé que la décision relative à l'installation de terminaux de paiement électronique dépend du secteur d'activité: si l'activité est licite, l'installation est permise; si l'établissement vend principalement des produits illicites tels que l'alcool et le porc, ou s'il s'agit de boîtes de nuit, l'installation est interdite car elle contribue à l'illicite (voir le verset 2 de la sourate 5 du Coran). Il a ajouté que pour les entreprises mixtes, la règle s'applique selon l'activité licite ou illicite prédominante, et qu'il est alors préférable de ne pas installer de terminaux afin d'éviter tout problème. Elle a conclu que l'installation de terminaux dans les restaurants et hôtels touristiques est autorisée car la majeure partie de leur activité est légale, et que la responsabilité de tout article interdit accessoire qu'ils servent incombe à ceux qui les exploitent."
