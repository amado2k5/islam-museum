id: work/fatwa-aliftaa-jo-card-payment-terminals-for-tourist-restaurants
class: work
kind: fatwa
label: { ar: "تركيب أجهزة الدفع بالبطاقات للمطاعم السياحية", en: "Card payment terminals for tourist restaurants", ur: "سیاحتی ریستورانوں کے لیے کارڈ پیمنٹ مشینیں" }
summary:
  ar: "سؤال عن تركيب أجهزة الدفع بالبطاقات للمطاعم السياحية، أجابت فيه دائرة الإفتاء العام الأردنية بأن حكم تركيب أجهزة نقاط البيع يتبع مجال عمل المؤسسة؛ فيجوز لما غالب عمله مباح ومنه المطاعم السياحية والفنادق، ويحرم لما غالب عمله بيع المحرمات، ويتبع المختلط الغالب مع أفضلية التورع. أجابت الدائرة بأن حكم تركيب أجهزة الدفع الإلكتروني يرتبط بمجال عمل المؤسسة؛ فإن كان مباحًا كان تركيب الأجهزة فيها مباحًا، وإن كان غالب عمل المتجر بيع المحرمات كالخمر والخنزير أو الملاهي الليلية حرم ذلك لما فيه من الإعانة على الحرام، واستشهدت بـ[[passage/quran-5-2|سورة المائدة 5:2]]. وقالت إن عمل المؤسسة إن كان مختلطًا فالحكم للغالب من الحلال أو الحرام، والأفضل في هذه الحالة عدم تركيب الأجهزة اتقاء للشبهات. وخلصت إلى أن تركيب الأجهزة للمطاعم السياحية والفنادق جائز لأن غالب عملها مباح، وأن الحرام الطارئ في بعض ما يقدم فيها يتحمل وزره القائمون عليها."
  en: "A question about card payment terminals for tourist restaurants, in which Jordan's General Iftaa Department answered that installing point-of-sale terminals follows the business's field of work: it is permitted for businesses whose work is mostly lawful, including tourist restaurants and hotels, forbidden for those whose work is mostly selling forbidden things, and a mixed business follows what predominates, though refraining is better. The Department answered that the ruling on installing electronic payment terminals depends on the business's field: if it is lawful, installing terminals there is lawful; if the shop's work is mostly selling forbidden things such as alcohol and pork, or nightclubs, it is forbidden because it aids what is forbidden, citing [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It said that if the business's work is mixed, the ruling follows whichever of lawful or unlawful predominates, and in that case it is better not to install the terminals, to avoid doubtful matters. It concluded that installing terminals in tourist restaurants and hotels is permitted because most of their work is lawful, and the burden of any incidental forbidden item they serve rests on those who run them."
  ur: "سیاحتی ریستورانوں کے لیے کارڈ پیمنٹ مشینیں کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ پوائنٹ آف سیل مشینیں لگانے کا حکم ادارے کے کاروبار کے تابع ہے: جس کا زیادہ کام حلال ہو، جیسے سیاحتی ریستوران اور ہوٹل، اس کے لیے جائز ہے، جس کا زیادہ کام حرام اشیا کی فروخت ہو اس کے لیے حرام، اور مخلوط میں غالب کا اعتبار ہے، اگرچہ احتیاط بہتر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ الیکٹرانک ادائیگی کی مشینیں لگانے کا حکم ادارے کے کاروبار سے جڑا ہے: اگر وہ جائز ہو تو وہاں مشینیں لگانا جائز ہے؛ اور اگر دکان کا زیادہ کام حرام اشیا جیسے شراب اور خنزیر یا نائٹ کلب ہو تو یہ حرام ہے کیونکہ اس میں حرام پر مدد ہے، اور [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے کہا کہ اگر ادارے کا کام مخلوط ہو تو حلال یا حرام میں سے جو غالب ہو اسی کا حکم ہے، اور اس صورت میں شبہات سے بچنے کے لیے مشینیں نہ لگانا بہتر ہے۔ اس نے نتیجہ نکالا کہ سیاحتی ریستورانوں اور ہوٹلوں میں مشینیں لگانا جائز ہے کیونکہ ان کا زیادہ کام جائز ہے، اور ان میں پیش کی جانے والی کسی عارضی حرام چیز کا بوجھ انہیں چلانے والوں پر ہے۔"
