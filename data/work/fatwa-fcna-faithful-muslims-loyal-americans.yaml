summary:
  ar: "قرار للمجلس الفقهي لأمريكا الشمالية للدكتور مظمل صديقي اعتُمد في اجتماع الهيئة العامة بفرجينيا ⁦(24-25 سبتمبر 2011)⁩ بشأن الجمع بين الإيمان بالإسلام والولاء للوطن الأمريكي على ما نصّ عليه القرار."
  en: "A resolution of the Fiqh Council of North America by Dr. Muzammil Siddiqi, adopted at the general-body meeting in Virginia (24–25 September 2011), on being faithful Muslims and loyal Americans together — as the resolution states."
  ur: "فقہ کونسل آف نارتھ امریکہ کی قرارداد ڈاکٹر مظمل صدیقی کی ⁦(جنرل باڈی اجلاس ورجینیا، 24–25 ستمبر 2011)⁩ مسلمان ہونے اور امریکی وفاداری کے جمع پر — جیسا کہ قرارداد میں ہے۔"
  es: "Una resolución del Consejo de Jurisprudencia Islámica de Norteamérica, firmada por el Dr. Muzammil Siddiqi y adoptada en la asamblea general celebrada en Virginia (24-25 de septiembre de 2011), sobre la importancia de ser musulmanes fieles y estadounidenses leales al mismo tiempo, tal como se indica en la resolución."
  fr: "Une résolution du Conseil Fiqh d'Amérique du Nord, présentée par le Dr Muzammil Siddiqi et adoptée lors de l'assemblée générale en Virginie (24-25 septembre 2011), sur le fait d'être à la fois des musulmans fidèles et des Américains loyaux — comme le stipule la résolution."
  tr: "Kuzey Amerika Hukuk Konseyi'nin kararı, Virginia'da (24-25 Eylül 2011) Virginia'da yapılan Genel Kurul toplantısında kabul edilen, kararda belirtildiği şekilde İslam'a inanç ile Amerikan vatanına bağlılığın birleşimini konu almaktadır."
  id: "Keputusan Dewan Yurisprudensi Amerika Utara oleh Dr. Muzammil Siddiqi yang diadopsi pada pertemuan Majelis Umum di Virginia (24-25 September 2011) mengenai kombinasi iman pada Islam dan kesetiaan kepada tanah air Amerika sebagaimana diatur dalam resolusi."
