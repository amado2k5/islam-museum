id: work/fatwa-amja-marriage-misery-qadar
class: work
kind: fatwa
label: { ar: "شقاء الزواج والسعادة من القضاء والقدر", en: "A miserable or happy marriage and divine decree", ur: "تعاس یا خوشی بخش شادی اور تقدیر", es: "Un matrimonio miserable o feliz y un decreto divino" }
summary:
  ar: "سأل سائل هل سعادة الزواج أو تعاسته من القضاء والقدر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82370 بتاريخ 28 أغسطس 2010)⁩ أن كل شيء خلقه الله بقدر فشقاوة الأشقياء وسعادة السعداء وقعت بقدره وجرى بها القلم في الكتاب الأول، وأمر المؤمن كله خير إن أصابته سراء شكر وإن أصابته ضراء صبر، لكن القدر لا يحتج به على تسويغ التقصير في اتخاذ الأسباب، فإن قصرت المرأة في الأسباب المشروعة لاختيار شريك حياتها فلم تختر على أساس الدين والخلق أو استبدت برأيها ولم ترجع إلى أوليائها فلا تلوم إلا نفسها ولا تعتب على القدر، والقدر يتعزى به ولا يحتج به على تضييع الأسباب."
  en: "A questioner asked whether a marriage's misery or happiness belongs to destiny. Dr. Salah al-Sawi (fatwa no. 82370, 28 August 2010) answered that everything God created is by decree — the wretchedness of the wretched and the felicity of the happy befell by His decree and the Pen ran in the first Book; the believer's affair is all good, gratitude in ease and patience in hardship; yet decree is no excuse for neglecting means — if the woman neglected the lawful means of choosing a partner, not choosing on the basis of religion and character or stubbornly refusing her guardians and counsellors, she should blame only herself and not reproach decree; decree is consolation, not a plea for squandering means."
  ur: "ایک سائل نے پوچھا کہ شادی کی بےچینی یا خوشی تقدیر سے ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82370، 28 اگست 2010)⁩ کے مطابق سب کچھ قدر سے ہے مگر قدر اسباب چھوڑنے کی دلیل نہیں — مناسب انتخاب میں کوتاہی کرنے والی کو خود کو ملامت کرنا چاہیے۔"
  es: "Un consultante preguntó si la felicidad o la desgracia de un matrimonio pertenecen al destino. El Dr. Salah al-Sawi (fatwa n.° 82370, 28 de agosto de 2010) respondió que todo lo que Dios creó es por decreto: la desgracia de los desdichados y la felicidad de los felices ocurrieron por Su decreto, y la Pluma corrió en el primer Libro; el asunto del creyente es todo bien, gratitud en la facilidad y paciencia en la adversidad; sin embargo, el decreto no es excusa para descuidar los medios: si la mujer descuidó los medios lícitos para elegir pareja, no eligiendo en base a la religión y el carácter, o rechazando obstinadamente a sus tutores y consejeros, debe culparse solo a sí misma y no reprochar al decreto; el decreto es consuelo, no una excusa para malgastar los recursos."
