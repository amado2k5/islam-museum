id: work/jami-al-bayan-altafsir-web
class: work
kind: tafsir-volume
label:
  ar: "جامع البيان للطبري، نص موقع التفسير ⁦(الآيات 14:28 إلى 114:6)⁩"
  en: "Jami' al-Bayan, the altafsir.com web text (verses 14:28 to 114:6)"
  ur: "جامع البیان، altafsir.com کا ویب متن ⁦(آیات 14:28 تا 114:6)⁩"
  es: "Jami' al-Bayan, el texto web de altafsir.com (versículos 14:28 a 114:6)"
  fr: "Jami' al-Bayan, le texte web d'altafsir.com (versets 14:28 à 114:6)"
  tr: "Cami' al-Bayan, altafsir.com web metni (14:28-114:6 ayetleri)"
  id: "Jami' al-Bayan, teks web altafsir.com (ayat 14:28 hingga 114:6)"
summary:
  ar: "نص تفسير الطبري كما يعرضه موقع altafsir.com، وهو ما صنعت منه سجلات المتحف ملخصات للآيات 14:28 إلى 114:6. هذه نسخة ويب: كل سجل يستشهد بعنوانه على الموقع ولم يُتحقق منه على صفحة مطبوعة، على خلاف أجزاء طبعة شاكر الستة عشر التي تغطي 1:1 إلى 14:27 وقد قُرئت من مسح مصور للمطبوع."
  en: "Al-Tabari's commentary as served by altafsir.com, from which the museum's records summarise verses 14:28 to 114:6. This is a web copy: each record cites its altafsir.com address and is not checked against a printed page, unlike the sixteen Shakir-edition volumes, which cover 1:1 to 14:27 and were read from a scan of the printed book."
  ur: "altafsir.com پر پیش کی گئی طبری کی تفسیر، جس سے میوزیم کے ریکارڈ آیات 14:28 تا 114:6 کا خلاصہ بناتے ہیں۔ یہ ویب نسخہ ہے: ہر ریکارڈ اپنے altafsir.com پتہ کا حوالہ دیتا ہے اور کسی مطبوعہ صفحے سے جانچا نہیں گیا، اس کے برعکس شاکر طبعہ کی سولہ جلدیں جو 1:1 تا 14:27 کا احاطہ کرتی ہیں اور مطبوعہ کتاب کے اسکین سے پڑھی گئیں۔"
  es: "El comentario de al-Tabari tal como lo ofrece altafsir.com, del que los registros del museo resumen los versículos 14:28 a 114:6. Es una copia web: cada registro cita su dirección de altafsir.com y no se ha cotejado con una página impresa, a diferencia de los dieciséis volúmenes de la edición Shakir, que cubren 1:1 a 14:27 y se leyeron de un escaneo del libro impreso."
  fr: "Le commentaire d'al-Tabari tel que proposé par altafsir.com, dont les registres du musée résument les versets 14:28 à 114:6. Il s'agit d'une copie web : chaque registre cite son adresse altafsir.com et n'a pas été vérifié sur une page imprimée, contrairement aux seize volumes de l'édition Shakir, qui couvrent 1:1 à 14:27 et ont été lus d'après un scan du livre imprimé."
  tr: "altafsir.com'un sunduğu Taberi tefsiri; müze kayıtları bu kaynaktan 14:28-114:6 ayetlerini özetlemektedir. Bu bir web kopyasıdır: her kayıt altafsir.com adresini gösterir ve basılı sayfayla karşılaştırılmamıştır; 1:1-14:27'yi kapsayan ve basılı kitabın taramasından okunan on altı Shakir baskısı ciltten farklıdır."
  id: "Tafsir al-Tabari sebagaimana disajikan altafsir.com, yang darinya catatan museum meringkas ayat 14:28 hingga 114:6. Ini salinan web: setiap catatan mengutip alamat altafsir.com-nya dan belum diverifikasi pada halaman cetak, tidak seperti enam belas jilid edisi Shakir yang mencakup 1:1 hingga 14:27 dan dibaca dari pemindaian buku cetak."
