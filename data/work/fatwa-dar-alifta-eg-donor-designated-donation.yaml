id: work/fatwa-dar-alifta-eg-donor-designated-donation
class: work
kind: fatwa
label: { ar: "حكم التصرف في التبرع على خلاف ما حدده المتبرع دون إذن منه", en: "Spending a donation against the donor's designation without permission", ur: "عطیہ دینے والے کی تعیین کے خلاف عطیہ خرچ کرنا", es: "Gastar una donación en contra de la designación del donante sin permiso.", fr: "Dépenser un don à l'encontre des souhaits du donateur sans autorisation" }
summary:
  ar: "سائل تبرع بالإسمنت لمسجد فسأل عن جواز التصرف فيه على خلاف ما حدد دون إذنه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21863)⁩ أنه ما دام المتبرع قد حدد تبرعه به دون غيره فلا يجوز للقائمين على المسجد مخالفة ذلك ولا التصرف في الإسمنت على خلافه على ما فصّل الجواب."
  en: "A donor gave cement to a mosque and asked whether it may be used contrary to his designation without his permission. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21863) answered that as long as the donor designated his donation for it alone, the mosque's custodians may not depart from that nor use the cement otherwise — as the answer details."
  ur: "ایک شخص نے مسجد کے لیے سیمنٹ کا عطیہ دیا اور پوچھا کہ کیا اس کی تعیین کے خلاف بغیر اجازت استعمال ہو سکتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21863)⁩ نے جواب دیا کہ جب عطیہ دہندہ نے عطیہ اسی کے لیے مقرر کیا ہو تو مسجد کے منتظمین اس سے روگردانی نہیں کر سکتے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un donante entregó cemento a una mezquita y preguntó si este podía utilizarse de forma contraria a lo estipulado sin su autorización. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21863) respondió que, siempre y cuando el donante destinara su donación exclusivamente a ese fin, los responsables de la mezquita no podían apartarse de dicha designación ni utilizar el cemento para otros fines, tal como se detalla en la respuesta."
  fr: "Un donateur a offert du ciment à une mosquée et a demandé si celui-ci pouvait être utilisé à d'autres fins que celles prévues sans son autorisation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21863) a répondu que, tant que le donateur avait expressément affecté son don à cet usage, les responsables de la mosquée ne pouvaient ni s'en écarter ni utiliser le ciment autrement, comme le précise la réponse."
