id: work/fatwa-aliftaa-jo-breaking-the-fast-for-hard-physical-work
class: work
kind: fatwa
label: { ar: "الفطر لمن يعمل عملًا شاقًا", en: "Breaking the fast for people in hard physical work", ur: "سخت جسمانی مشقت والوں کا روزہ چھوڑنا" }
summary:
  ar: "سؤال عن الفطر لمن يعمل عملًا شاقًا كالخباز وعامل الخرسانة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز له الفطر ابتداءً، بل ينوي الصوم ويشرع فيه، فإن بلغ حدًّا يشق معه الصوم أفطر وقضى. أجابت الدائرة بأنه لا يجوز لمن يعمل عملًا شاقًا أن يفطر ابتداءً، وعليه أن ينوي الصوم من الليل ويشرع فيه. وقالت إنه إن وصل بعد ذلك إلى حد يشق معه الصوم أفطر، وقضى في وقت آخر."
  en: "A question about breaking the fast for people in hard physical work, such as bakers and concrete workers, in which Jordan's General Iftaa Department answered that they may not start the day without fasting, but must intend the fast and begin it, breaking it only if fasting becomes a real hardship and making the day up later. The Department answered that someone doing hard work may not break the fast from the outset; he must intend the fast from the night before and begin it. It said that if he later reaches a point where fasting becomes a hardship, he breaks the fast and makes the day up at another time."
  ur: "سخت جسمانی کام کرنے والوں، جیسے نان بائی اور کنکریٹ کے مزدور، کے روزہ چھوڑنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ شروع ہی سے روزہ نہیں چھوڑ سکتے، بلکہ نیت کر کے روزہ شروع کریں، اور اگر واقعی مشقت ہو جائے تو چھوڑ دیں اور بعد میں قضا کریں۔ ڈیپارٹمنٹ نے جواب دیا کہ سخت کام کرنے والا شروع ہی سے روزہ نہیں چھوڑ سکتا؛ اسے رات سے روزے کی نیت کر کے روزہ شروع کرنا ہے۔ اس نے کہا کہ اگر بعد میں وہ ایسی حد تک پہنچ جائے کہ روزہ مشقت بن جائے تو روزہ چھوڑ دے اور کسی اور وقت قضا کرے۔"
