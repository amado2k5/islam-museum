id: work/fatwa-aliftaa-jo-breaking-the-fast-for-hard-physical-work
class: work
kind: fatwa
label: { ar: "الفطر لمن يعمل عملًا شاقًا", en: "Breaking the fast for people in hard physical work", ur: "سخت جسمانی مشقت والوں کا روزہ چھوڑنا", es: "Romper el ayuno para las personas que realizan trabajos físicos duros.", fr: "Rompre le jeûne pour les personnes effectuant un travail physique pénible", tr: "Sıkı çalışanlar için mantarlar", id: "Jamur untuk mereka yang bekerja keras" }
summary:
  ar: "سؤال عن الفطر لمن يعمل عملًا شاقًا كالخباز وعامل الخرسانة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز له الفطر ابتداءً، بل ينوي الصوم ويشرع فيه، فإن بلغ حدًّا يشق معه الصوم أفطر وقضى. أجابت الدائرة بأنه لا يجوز لمن يعمل عملًا شاقًا أن يفطر ابتداءً، وعليه أن ينوي الصوم من الليل ويشرع فيه. وقالت إنه إن وصل بعد ذلك إلى حد يشق معه الصوم أفطر، وقضى في وقت آخر."
  en: "A question about breaking the fast for people in hard physical work, such as bakers and concrete workers, in which Jordan's General Iftaa Department answered that they may not start the day without fasting, but must intend the fast and begin it, breaking it only if fasting becomes a real hardship and making the day up later. The Department answered that someone doing hard work may not break the fast from the outset; he must intend the fast from the night before and begin it. It said that if he later reaches a point where fasting becomes a hardship, he breaks the fast and makes the day up at another time."
  ur: "سخت جسمانی کام کرنے والوں، جیسے نان بائی اور کنکریٹ کے مزدور، کے روزہ چھوڑنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ وہ شروع ہی سے روزہ نہیں چھوڑ سکتے، بلکہ نیت کر کے روزہ شروع کریں، اور اگر واقعی مشقت ہو جائے تو چھوڑ دیں اور بعد میں قضا کریں۔ ڈیپارٹمنٹ نے جواب دیا کہ سخت کام کرنے والا شروع ہی سے روزہ نہیں چھوڑ سکتا؛ اسے رات سے روزے کی نیت کر کے روزہ شروع کرنا ہے۔ اس نے کہا کہ اگر بعد میں وہ ایسی حد تک پہنچ جائے کہ روزہ مشقت بن جائے تو روزہ چھوڑ دے اور کسی اور وقت قضا کرے۔"
  es: "Una pregunta sobre la ruptura del ayuno para personas que realizan trabajos físicos duros, como panaderos y obreros de la construcción, fue respondida por el Departamento General de Iftar de Jordania, que indicó que no pueden comenzar el día sin ayunar, sino que deben tener la intención de hacerlo y comenzarlo, rompiéndolo solo si el ayuno se convierte en una verdadera dificultad y recuperando el día más tarde. El Departamento explicó que quien realiza un trabajo duro no puede romper el ayuno desde el principio; debe tener la intención de hacerlo desde la noche anterior y comenzarlo. Añadió que si posteriormente llega a un punto en que el ayuno se convierte en una dificultad, puede romper el ayuno y recuperar el día en otro momento."
  fr: "Concernant la rupture du jeûne pour les personnes exerçant un travail physique pénible, comme les boulangers et les ouvriers du béton, le Département général de la Iftaa en Jordanie a répondu qu'elles ne peuvent commencer la journée sans jeûner, mais doivent avoir l'intention de jeûner et commencer leur jeûne. Elles ne peuvent l'interrompre que si le jeûne devient une véritable épreuve et rattraper le jeûne plus tard. Le Département a précisé qu'une personne effectuant un travail pénible ne peut rompre le jeûne dès le début de la journée; elle doit avoir l'intention de jeûner la veille au soir et commencer son jeûne. Il a ajouté que si, par la suite, le jeûne devient une épreuve, elle peut l'interrompre et rattraper le jeûne ultérieurement."
  tr: "Fırıncı veya beton işçisi gibi ağır iş yapan biri için oruç açma sorusuna Ürdün Genel Fetva Dairesi, başlangıçta orucu bozmasının izin verilmediğini; bunun yerine oruç tutmayı planladığını ve oruç tutmaya başladığını yanıtladı. Oruç tutmayı zorlaştıran bir sınıra ulaşırsa, orucunu bozar ve telafi eder. Daire, ağır iş yapan birinin ilk başta orucunu bozmasının izin verilmediğini, gece orucu tutup oruca başlamayı planlaması gerektiğini yanıtladı. Eğer orucu zorlaştıran bir sınıra ulaşırsa, orucunu bozup başka bir zamanda telafi ettiğini belirtti."
  id: "Sebuah pertanyaan tentang memecah puasa bagi seseorang yang bekerja keras seperti seorang pembuat roti atau pekerja beton, Departemen Fatwa Umum Yordania menjawab bahwa tidak diperbolehkan baginya untuk berbuka puasa pada awalnya; sebaliknya, dia berniat berpuasa dan memulainya. Jika dia mencapai batas yang membuat puasa sulit, dia memecah puasanya dan menebusnya. Departemen menjawab bahwa tidak diperbolehkan bagi seseorang yang bekerja keras untuk memecah puasa pada awalnya, dan dia harus berniat berpuasa sejak malam dan memulainya. Dikatakan bahwa jika dia kemudian mencapai batas yang membuat puasa sulit, dia memecah puasanya dan menebusnya di waktu lain."
