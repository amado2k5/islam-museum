id: work/fatwa-amja-nationalism-and-patriotism
class: work
kind: fatwa
label: { ar: "الوطنية والقومية", en: "Patriotism and nationalism", ur: "وطن پرستی اور قوم پرستی", es: "Patriotismo y nacionalismo", fr: "Patriotisme et nationalisme" }
summary:
  ar: "أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21817 بتاريخ 14 أكتوبر 2012)⁩ أن تعبيري الوطنية والقومية من التعبيرات المجملة: فإن قصد بهما الحنين الفطري الذي يشعر به المسلم تجاه وطنه أو قومه فلا حرج فيه ولا تثريب على أهله بشرط ألا يحمله على فعل محرم أو ترك واجب؛ وأما إن قصد به مناصرة القوم على ظلمهم وباطلهم فهذه حمية الجاهلية ودعوى الجاهلية التي ورد الوعيد فيها."
  en: "The Assembly of Muslim Jurists of America (fatwa no. 21817, 14 October 2012) answered that 'patriotism' and 'nationalism' are ambiguous terms: if they mean the natural longing a Muslim feels for his homeland or people, there is no harm in it and no blame on those who have it — provided it does not carry him into doing what is forbidden or abandoning a duty; but if it means supporting one's people in their injustice and falsehood, that is the partisanship and call of jahiliyya against which the texts warn."
  ur: "ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 21817، 14 اکتوبر 2012)⁩ نے جواب دیا کہ 'وطن پرستی' اور 'قوم پرستی' مبهم اصطلاحات ہیں: اگر ان سے مسلمان کے دل کی اپنے وطن یا قوم کے لیے فطری محبت مراد ہو تو اس میں کوئی حرج اور ملامت نہیں — بشرطیکہ یہ اسے کسی حرام کام یا ترکِ واجب پر نہ ابھارے؛ اور اگر ان سے ظلم اور باطل پر اپنی قوم کی حمایت مراد ہو تو یہ جاہلیت کی حمیت اور دعوائے جاہلیت ہے جس کے خلاف نصوص میں وعید آئی ہے۔"
  es: "La Asamblea de Juristas Musulmanes de América (fatwa n.º 21817, 14 de octubre de 2012) respondió que \"patriotismo\" y \"nacionalismo\" son términos ambiguos: si significan el anhelo natural que un musulmán siente por su patria o su pueblo, no hay nada de malo en ello ni culpa alguna para quienes lo tienen, siempre que no lo lleve a hacer lo prohibido o a abandonar un deber; pero si significa apoyar al propio pueblo en su injusticia y falsedad, eso es el partidismo y el llamado de la jahiliyya contra el que advierten los textos."
  fr: "L'Assemblée des juristes musulmans d'Amérique (fatwa n° 21817, 14 octobre 2012) a répondu que les termes « patriotisme » et « nationalisme » sont ambigus: s'ils désignent le désir naturel qu'un musulman éprouve pour sa patrie ou son peuple, il n'y a rien de mal à cela et personne ne peut blâmer ceux qui le ressentent — à condition que cela ne les conduise pas à faire ce qui est interdit ou à abandonner un devoir; mais si cela signifie soutenir son peuple dans son injustice et son mensonge, c'est le parti pris et l'appel à la jahiliyya contre lesquels les textes mettent en garde."
