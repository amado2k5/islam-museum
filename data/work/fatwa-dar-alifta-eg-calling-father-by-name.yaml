id: work/fatwa-dar-alifta-eg-calling-father-by-name
class: work
kind: fatwa
label: { ar: "حكم مناداة الإنسان لوالده باسمه مجردًا", en: "Calling one's father by his bare name", ur: "والد کو عریان نام سے پکارنا", es: "Llamar a uno mismo por su nombre" }
summary:
  ar: "سائل سأل عن مناداة الإنسان أحد والديه باسمه مجردًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21607)⁩ أن مناداته باسمه مجردًا حرام إذا كان الوالد يكره ذلك أو يتأذى منه وهو من العقوق ويكون مباحًا فيما عداه على ما فصّل الجواب."
  en: "A questioner asked about calling one's parent by the bare name. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21607) answered that it is forbidden when the parent dislikes it or is hurt by it — it counts as undutifulness — and is permissible otherwise, as the answer details."
  ur: "ایک سائل نے والدین میں سے کسی کو عریان نام سے پکارنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21607)⁩ نے جواب دیا کہ اگر والد اسے ناپسند کرے یا تکلیف پہنچے تو یہ حرام اور نافرمانی ہے؛ بصورت دیگر مباح ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la conveniencia de llamar a los padres por su nombre. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21607) respondió que está prohibido cuando al padre o madre le disgusta o le ofende —se considera una falta de deber— y que está permitido en los demás casos, como se detalla en la respuesta."
