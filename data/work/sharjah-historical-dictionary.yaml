summary:
  ar: "المعجم التاريخي للغة العربية مشروع لغوي كبير تحت إشراف مجمع اللغة العربية بالشارقة، تقدّمه كلمة سلطان بن محمد القاسمي، الرئيس التنفيذي للمشروع، مؤرخة ١٥ ذي الحجة ١٤٤٢هـ، ٢٥ يوليو ٢٠٢١م. يوثّق تاريخ الألفاظ العربية ودلالاتها عبر خمسة عصور، من نقوش ما قبل الإسلام إلى الاستعمال الحديث، مرتباً على الجذور ومعزَّزاً بالشواهد من مصادرها الأصلية. وتعرض صفحة إحصائيات موقعه في ٢٠ نوفمبر ٢٠٢٦م ١٢٠٠٩ جذور و٧٨٢٥٩ كلمة و٤١٠٠٦٢ شاهداً تاريخياً، منها ٢٧٨٦٣ قبل الإسلام و٨٠٣١٤ إسلامياً و١٩٣٩٩٩ عباسياً و٥٣١٣٦ للدول والإمارات و٥٣٧٣٠ حديثاً، أما صفحته الرئيسية فتعرض أرقاماً أصغر. حقوقه محفوظة لمجمع اللغة العربية بالشارقة، فيوصف هنا ويُشار إليه ولا يُنسخ منه شيء."
  en: "The Historical Dictionary of the Arabic Language is a large language project under the supervision of the Arabic Language Academy in Sharjah, introduced by Dr Sultan bin Muhammad al-Qasimi, executive president of the project, in a preface dated 15 Dhu al-Hijja 1442 / 25 July 2021. It documents the history of Arabic words and meanings across five eras, from pre-Islamic inscriptions to modern use, arranged by roots with evidence from original sources. On 20 November 2026 its statistics page showed 12,009 roots, 78,259 words and 410,062 historical attestations (27,863 pre-Islamic, 80,314 Islamic, 193,999 Abbasid, 53,136 for states and emirates, 53,730 modern), while its home page showed smaller figures. Its rights are reserved by the Academy, so it is described and linked here and nothing is copied."
  es: "El Diccionario Histórico de la Lengua Árabe es un gran proyecto lingüístico bajo la supervisión de la Academia de la Lengua Árabe de Sharjah, presentado por el Dr. Sultan bin Muhammad al-Qasimi, presidente ejecutivo del proyecto, en un prefacio fechado el 15 de Dhu al-Hijja de 1442 / 25 de julio de 2021. Documenta la historia de las palabras y significados árabes a lo largo de cinco épocas, desde las inscripciones preislámicas hasta el uso moderno, ordenado por raíces y con pruebas de las fuentes originales. El 20 de noviembre de 2026 su página de estadísticas mostraba 12 009 raíces, 78 259 palabras y 410 062 atestaciones históricas (27 863 preislámicas, 80 314 islámicas, 193 999 abasíes, 53 136 de estados y emiratos, 53 730 modernas), mientras que su página principal mostraba cifras menores. Sus derechos están reservados por la Academia, por lo que aquí se describe y se enlaza y no se copia nada."
  fr: "Le Dictionnaire historique de la langue arabe est un grand projet linguistique placé sous la supervision de l'Académie de langue arabe de Sharjah, présenté par le Dr Sultan bin Muhammad al-Qasimi, président exécutif du projet, dans une préface datée du 15 Dhu al-Hijja 1442 / 25 juillet 2021. Il documente l'histoire des mots et des sens arabes à travers cinq époques, des inscriptions préislamiques à l'usage moderne, classé par racines avec des preuves tirées des sources originales. Le 20 novembre 2026 sa page de statistiques montrait 12 009 racines, 78 259 mots et 410 062 attestations historiques (27 863 préislamiques, 80 314 islamiques, 193 999 abbassides, 53 136 pour les États et émirats, 53 730 modernes), tandis que sa page d'accueil montrait des chiffres plus faibles. Ses droits sont réservés par l'Académie ; il est donc décrit et signalé ici, et rien n'en est copié."
  ur: "تاریخی معجمِ عربی زبان شارجہ کی مجمع اللغۃ العربیہ کی نگرانی میں ایک بڑا لسانی منصوبہ ہے، جس کا تعارف منصوبے کے چیف ایگزیکٹو ڈاکٹر سلطان بن محمد القاسمی نے 15 ذوالحجہ 1442ھ / 25 جولائی 2021ء کے دیباچے میں کیا۔ یہ عربی الفاظ اور معانی کی تاریخ پانچ ادوار میں، قبل از اسلام کے کتبوں سے جدید استعمال تک، مادوں پر مرتب اور اصل مآخذ کے شواہد کے ساتھ قلم بند کرتی ہے۔ 20 نومبر 2026ء کو اس کے صفحۂ شماریات میں 12,009 مادے، 78,259 الفاظ اور 410,062 تاریخی شواہد تھے ⁦(27,863 قبل از اسلام، 80,314 اسلامی، 193,999 عباسی، 53,136 ریاستوں اور امارات کے، 53,730 جدید)⁩ جبکہ اس کے صفحۂ اول پر چھوٹے اعداد تھے۔ اس کے حقوق مجمع کے پاس محفوظ ہیں، اس لیے یہاں اس کا بیان اور حوالہ ہے، اس سے کچھ نقل نہیں کیا گیا۔"
