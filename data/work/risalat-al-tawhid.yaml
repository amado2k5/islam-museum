summary:
  ar: "كتاب في علم التوحيد ألّفه الشيخ محمد عبده، وقدّم له محمد عمارة في طبعة دار الشروق. يعرض الكتاب الإلهيات والنبوة والقرآن والعقائد كما تبلورت في الشريعة، ويعدّه المقدّم من أهم نصوص عبده {cite:abduh-risalat-tawhid-imara-1994 p.7} {cite:abduh-risalat-tawhid-imara-1994 p.10}."
  en: "A treatise on the science of Tawhid by Muhammad Abduh, with an introduction by Muhammad Imara in the Dar al-Shuruq edition. It covers God and His attributes, humanity, prophecy and the Qur'an, and the editor counts it among Abduh's most important texts {cite:abduh-risalat-tawhid-imara-1994 p.7} {cite:abduh-risalat-tawhid-imara-1994 p.10}."
  es: "Tratado sobre la ciencia del Tawhid, de Muhammad Abduh, con introducción de Muhammad Imara, en la edición Dar al-Shuruq. Abarca temas como Dios y sus atributos, la humanidad, la profecía y el Corán, y el editor lo considera uno de los textos más importantes de Abduh."
  fr: "Traité sur la science du Tawhid par Muhammad Abduh, avec une introduction de Muhammad Imara (Édition Dar al-Shuruq). Cet ouvrage traite de Dieu et de Ses attributs, de l'humanité, de la prophétie et du Coran; l'éditeur le considère comme l'un des textes les plus importants d'Abduh."
  ur: "محمد عبدہ کا توحید کی سائنس پر ایک مقالہ، دار الشروق ایڈیشن میں محمد امارہ کے تعارف کے ساتھ۔ اس میں خدا اور اس کی صفات، انسانیت، نبوت اور قرآن کا احاطہ کیا گیا ہے، اور مدیر نے اسے عبدہ کی اہم ترین تحریروں میں شمار کیا ہے {حوالہ: عبدہ رسالت توحید امارا-1994 صفحہ 7}"
