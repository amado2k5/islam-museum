summary:
  ar: "كتاب في علم التوحيد ألّفه الشيخ محمد عبده، وقدّم له محمد عمارة في طبعة دار الشروق. يعرض الكتاب الإلهيات والنبوة والقرآن والعقائد كما تبلورت في الشريعة، ويعدّه المقدّم من أهم نصوص عبده {cite:abduh-risalat-tawhid-imara-1994 p.7} {cite:abduh-risalat-tawhid-imara-1994 p.10}."
  en: "A treatise on the science of Tawhid by Muhammad Abduh, with an introduction by Muhammad Imara in the Dar al-Shuruq edition. It covers God and His attributes, humanity, prophecy and the Qur'an, and the editor counts it among Abduh's most important texts {cite:abduh-risalat-tawhid-imara-1994 p.7} {cite:abduh-risalat-tawhid-imara-1994 p.10}."
