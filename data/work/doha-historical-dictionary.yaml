summary:
  ar: "معجم الدوحة التاريخي للغة العربية معجم إلكتروني على الشبكة يوثّق تاريخ استعمالات الألفاظ العربية ودلالاتها بحسب وصف موقعه. ويرأس مجلسه العلمي رمزي بعلبكي بحسب ما يذكره تعريف كاتب «أرابيكا». وشروط موقعه: لا يجوز إعادة نشر مواده أو نسخها أو تعديلها إلا لأغراض شخصية غير تجارية، ويُمنع إنشاء أعمال مشتقة منها بلا إذن خطي، ويُمنع استعمال بياناته في مشروعات تجارية أو في تدريب نماذج ذكاء اصطناعي بلا إذن؛ ولذلك يوصف هنا ويُشار إليه ولا يُنسخ منه شيء."
  en: "The Doha Historical Dictionary of Arabic is an online dictionary that, in the words of its own site, documents the history of the uses and meanings of Arabic words. Ramzi Baalbaki heads its Scientific Council, according to his author note on Arabica. Its terms of use allow reuse only for personal non-commercial purposes, forbid derivative works without prior written permission, and forbid using its data in commercial projects or to train AI models without permission; it is therefore described and linked here, and nothing is copied from it."
  es: "El Diccionario Histórico de Doha de la Lengua Árabe es un diccionario en línea que, según su propio sitio, documenta la historia de los usos y significados de las palabras árabes. Ramzi Baalbaki preside su Consejo Científico, según su nota de autor en Arabica. Sus condiciones de uso permiten la reutilización solo con fines personales no comerciales, prohíben las obras derivadas sin permiso escrito previo y prohíben usar sus datos en proyectos comerciales o para entrenar modelos de IA sin permiso; por eso se describe y se enlaza aquí, y no se copia nada de él."
  fr: "Le Dictionnaire historique de Doha de la langue arabe est un dictionnaire en ligne qui, selon son propre site, documente l'histoire des emplois et des sens des mots arabes. Ramzi Baalbaki préside son Conseil scientifique, d'après sa notice d'auteur sur Arabica. Ses conditions d'utilisation n'autorisent la réutilisation qu'à des fins personnelles non commerciales, interdisent les œuvres dérivées sans autorisation écrite préalable et interdisent d'utiliser ses données dans des projets commerciaux ou pour entraîner des modèles d'IA sans autorisation ; il est donc décrit et signalé ici, et rien n'en est copié."
  ur: "دوحہ تاریخی معجمِ عربی زبان ایک آن لائن لغت ہے جو، اپنی سائٹ کے الفاظ میں، عربی الفاظ کے استعمالات اور معانی کی تاریخ قلم بند کرتی ہے۔ «اربیکا» پر ان کے تعارف کے مطابق رمزی بعلبکی اس کی علمی کونسل کے سربراہ ہیں۔ اس کی شرائطِ استعمال صرف ذاتی غیر تجارتی مقاصد کے لیے دوبارہ استعمال کی اجازت دیتی ہیں، تحریری اجازت کے بغیر ماخوذ کام منع کرتی ہیں، اور تجارتی منصوبوں یا اے آئی ماڈلز کی تربیت میں اس کے ڈیٹا کا استعمال بلا اجازت منع کرتی ہیں؛ اس لیے یہاں اس کا بیان اور حوالہ ہے، اس سے کچھ نقل نہیں کیا گیا۔"
