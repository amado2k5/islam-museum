label: { ar: "حكم أكل الحاج من الهدي الواجب عليه", en: "A pilgrim eating of the hady obligatory on him", ur: "حاجی کا اپنی واجب ہدی کا گوشت کھانا", es: "Un peregrino comiendo el hady obligatorio para él" }
summary:
  ar: "سائل سأل عن أكل الحاج من الهدي الواجب عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21896)⁩ أنه يجوز للحاج أن يأكل من هدي التمتع والقران وأما بقية الدماء التي وجبت عليه لارتكاب محظور أو ترك واجب فله حكم آخر بيّنه الجواب."
  en: "A questioner asked about a pilgrim eating of the hady obligatory on him. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21896) answered that a pilgrim may eat of the tamattu' and qiran hady; the other blood-offerings owed for committing a prohibition or omitting a duty have a different ruling the answer sets out."
  ur: "ایک سائل نے حاجی کے اپنی واجب ہدی کا گوشت کھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21896)⁩ نے جواب دیا کہ حاجی تمتع اور قِران کی ہدی کھا سکتا ہے؛ مگر وہ خون جو محظور کے ارتکاب یا واجب کے ترک پر واجب ہوا اس کا حکم الگ ہے جسے جواب نے بیان کیا۔"
  es: "Un peregrino preguntó sobre la obligación de comer el hady que le corresponde a un peregrino. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21896) respondió que un peregrino puede comer el tamattu' y el qiran hady; las demás ofrendas de sangre que se deben por cometer una prohibición u omitir un deber tienen una norma diferente, según se indica en la respuesta."
