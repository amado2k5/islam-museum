id: work/fatwa-fcna-female-circumcision
class: work
kind: fatwa
label: { ar: "ما حكم ختان الإناث؟", en: "What is the ruling on female circumcision?", ur: "خواتین کی ختنہ کا حکم کیا ہے؟", es: "¿Cuál es la normativa sobre la mutilación genital femenina?", fr: "Quelle est la position juridique concernant l'excision féminine ?", tr: "Kadın sünnetiyle ilgili karar nedir?", id: "Apa aturan tentang sunat perempuan?" }
summary:
  ar: "سؤال عما إذا كان ختان الإناث جائزًا. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر يونيو 2022)⁩ أن جميع أشكال ختان الإناث غير جائزة إذ لا يوجد أساس قاطع في القرآن والسنة يوجب أو يستحب ذلك على ما فصّل الجواب."
  en: "A question about whether female circumcision is permissible. The Fiqh Council of North America (published June 2022) answered that all its various forms are not permissible, there being no definitive basis in the Qur'an and sunna requiring or recommending it — as the answer details."
  ur: "کیا خواتین کا ختنہ جائز ہے؟ فقہ کونسل آف نارتھ امریکہ ⁦(شائع شدہ جون 2022)⁩ نے جواب دیا کہ اس کی تمام صورتیں جائز نہیں کیونکہ قرآن و سنت میں اس کی قطعی بنیاد نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una pregunta sobre si la mutilación genital femenina es permisible. El Consejo de Jurisprudencia Islámica de Norteamérica (publicado en junio de 2022) respondió que ninguna de sus diversas formas es permisible, ya que no existe una base definitiva en el Corán y la Sunna que la exija o recomiende, como se detalla en la respuesta."
  fr: "Une question portait sur la licéité de l'excision. Le Conseil de jurisprudence islamique d'Amérique du Nord (publication de juin 2022) a répondu que toutes ses formes sont interdites, aucun fondement définitif du Coran et de la Sunna ne l'exige ou ne la recommande, comme le précise la réponse."
  tr: "Kadın sünnetinin izin verilip verilmediğine dair bir soru. Kuzey Amerika Fıkıh Konseyi (Haziran 2022'de yayımlandı), tüm kadın sünnetinin izin verilmediğini, çünkü Kur'an ve Sünnet'te bunu zorunlu kılan veya tavsiye eden kesin bir dayanak olmadığını yanıtladı; bu da cevapta detaylandırılmıştır."
  id: "Sebuah pertanyaan tentang apakah sunat perempuan diperbolehkan. Dewan Yurisprudensi Amerika Utara (diterbitkan Juni 2022) menanggapi bahwa semua bentuk sunat perempuan tidak diperbolehkan, karena tidak ada dasar konklusif dalam Al-Quran dan Sunnah yang mewajibkan atau merekomendasikan, seperti yang dijelaskan dalam jawaban."
