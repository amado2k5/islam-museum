label: { ar: "مسلم جديد أثار الشبهات في جالية صغيرة", en: "A new Muslim raising doubts in a small community", ur: "چھوٹی کمیونٹی میں نئے مسلم کے شکوک", es: "Un nuevo musulmán siembra dudas en una pequeña comunidad.", fr: "Un nouveau musulman sème le doute dans une petite communauté", tr: "Yeni bir Müslüman küçük bir toplulukta şüphe uyandırdı", id: "Seorang Muslim baru menimbulkan kecurigaan di komunitas kecil" }
summary:
  ar: "سأل أفراد جالية صغيرة في المكسيك فتحوا مسجدًا هو الوحيد في ولايتهم عن مسلم جديد عندهم أثار شبهات في الدين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83681 بتاريخ 3 فبراير 2011)⁩ أن إطلاق القول بأنه لا توجد حقائق ثابتة يعرفها الناس وأن العلم ليس إلا لله إطلاق خاطئ، فهم يوقنون أن محمدًا حق والقرآن حق والإسلام حق وأن الصحابة سادات أولياء الله في الأمة بعد نبيها وأفضلهم أبو بكر وعمر وعثمان وعلي، ولعل مما يعذر به صاحبهم أنه حديث إسلام محدود القراءة فالأولى احتضانه بصدر رحب وخلق دمث وصبر جميل وجدال بالحسنى على ما فصّل."
  en: "A small community in Mexico — their mosque the state's only one — asked about a recent Muslim among them who kept raising doubts about the religion. Dr. Salah al-Sawi (fatwa no. 83681, 3 February 2011) answered that saying flatly there are no fixed truths people know and knowledge is God's alone is wrong: they hold for certain that Muhammad is true, the Quran true, Islam true, and the Companions the masters of God's friends in this ummah, the best being Abu Bakr, Umar, Uthman and Ali; the man's excuse may be that he is a new Muslim of little reading, so they should embrace him with a broad chest, gentle manners, beautiful patience and goodly debate, as detailed. Recorded as AMJA's answer."
  ur: "میکسیکو کی چھوٹی مسلم کمیونٹی نے ایک نئے مسلم کے شکوک کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83681، 3 فروری 2011)⁩ کے مطابق حقائق ثابت ہیں اور نئے مسلم کو محبت، حلم اور اچھے مباحثے سے احاطہ کرنا چاہیے۔"
  es: "Una pequeña comunidad en México —cuya mezquita es la única del estado— preguntó sobre un musulmán recién convertido que no dejaba de expresar dudas sobre la religión. El Dr. Salah al-Sawi (fatwa n.° 83681, 3 de febrero de 2011) respondió que afirmar rotundamente que no existen verdades absolutas y que el conocimiento pertenece solo a Dios es erróneo: sostienen con certeza que Mahoma es verdadero, el Corán es verdadero, el Islam es verdadero y los Compañeros son los maestros de los amigos de Dios en esta ummah, siendo los mejores Abu Bakr, Umar, Uthman y Ali; la excusa del hombre podría ser que es un musulmán nuevo con poca lectura, por lo que deberían acogerlo con calidez, amabilidad, paciencia y un debate constructivo, como se detalla. Registrado como respuesta de AMJA."
  fr: "Une petite communauté du Mexique – leur mosquée étant la seule de l'État – s'est interrogée au sujet d'un nouveau converti qui exprimait sans cesse des doutes sur l'islam. Le Dr Salah al-Sawi (fatwa n° 83681, 3 février 2011) a répondu qu'affirmer catégoriquement qu'il n'existe aucune vérité établie et que la connaissance appartient à Dieu seul est une erreur: ils tiennent pour acquis que Muhammad est véridique, le Coran véridique, l'islam véridique, et les Compagnons les maîtres des amis de Dieu au sein de cette umma, les plus illustres étant Abou Bakr, Omar, Othman et Ali; cet homme pourrait se justifier par son statut de nouveau converti peu instruit, aussi devraient-ils l'accueillir avec bienveillance, douceur, patience et un dialogue constructif, comme détaillé précédemment. (Réponse consignée par AMJA.)"
  tr: "Meksika'da küçük bir cemaatin üyeleri, eyaletlerinde tek cami açan, dinlerine şüpheyle yaklaşan yeni bir Müslüman hakkında sorular sordular. Dr. Salah Al-Sawy (3 Şubat 2011 tarihli 83681 sayılı fetva) insanların bildiği kesin bir gerçeklik olmadığı ve bilginin sadece Allah'a ait olduğu iddiasının yanlış bir ifade olduğunu söyledi. Muhammed'in doğru olduğunu, Kur'an'ın doğru olduğunu ve İslam'ın doğru olduğunu, sahabelerin Peygamber'den sonra ülkedeki Allah'ın dostlarının efendileri olduğunu düşünüyorlar; en iyileri Ebu Bekir, Ömer, Osman ve Ali'dir. Belki de yazarlarını mazur gösteren şey, bunun sınırlı bir İslami hadis olmasıdır; bu yüzden açık kalp, nazik bir tavır, güzel bir sabırla kucaklamak ve detaylandırılanları nazikçe savunmak daha iyidir."
  id: "Anggota komunitas kecil di Meksiko yang membuka masjid, satu-satunya masjid di negara bagian mereka, menanyakan tentang seorang Muslim baru yang menimbulkan keraguan terhadap agamanya. Dr. Salah Al-Sawy menjawab (Fatwa No. 83681 tanggal 3 Februari 2011) bahwa klaim mutlak bahwa tidak ada fakta yang mapan yang diketahui oleh manusia dan bahwa pengetahuan hanya milik Allah adalah pernyataan yang keliru. Mereka yakin bahwa Muhammad itu benar, Al-Qur'an itu benar, dan Islam itu benar, dan bahwa para Sahabat adalah penguasa sahabat Allah di negara setelah Nabi, yang terbaik di antaranya adalah Abu Bakr, Umar, Uthman, dan Ali. Mungkin alasan bagi penulisnya adalah karena ini adalah hadits Islam yang terbatas, sehingga lebih baik menerimanya dengan hati terbuka, sikap yang baik, kesabaran yang indah, dan berdebat dengan baik seperti yang dijelaskan secara rinci."
