label: { ar: "مورد الظمآن في رسم القرآن", en: "Mawrid al-Zam'an fi Rasm al-Qur'an (al-Kharraz)", ur: "مورد الظمآن فی رسم القرآن ⁦(الخراز)⁩" }
summary:
  ar: "منظومة في رسم القرآن لمحمد بن محمد الأموي الشريشي المشهور بالخراز، يذكرها ثبت مصادر طبعة «الإتقان» المحققة، وتحيل إليها حواشيها في مواضع حذف الألف وإثباتها بين المغاربة والمشارقة، ولها شروح منها «دليل الحيران» و«تنبيه الخلان» {cite:itqan-suyuti p. 3031} {cite:itqan-suyuti p. 2202} {cite:itqan-suyuti p. 2977}."
  en: "A poem on the spelling of the Qur'an by Muhammad ibn Muhammad al-Umawi al-Sharishi, known as al-Kharraz. The bibliography of the edited Itqan lists it, and the notes refer to it for places where the alif is kept or dropped between the Maghribis and the Mashriqis; it has commentaries including Dalil al-Hayran and Tanbih al-Khillan {cite:itqan-suyuti p. 3031} {cite:itqan-suyuti p. 2202} {cite:itqan-suyuti p. 2977}."
  ur: "قرآن کے رسم پر محمد بن محمد اموی شریشی المعروف خراز کی منظومہ؛ «الاتقان» کے محقق ایڈیشن کی فہرستِ مآخذ میں درج ہے اور اس کے حواشی الف کے حذف و اثبات میں مغاربہ اور مشارقہ کے اختلاف کے مقامات پر اس کا حوالہ دیتے ہیں؛ اس کی شروح میں «دلیل الحیران» اور «تنبیہ الخلان» ہیں {cite:itqan-suyuti p. 3031} {cite:itqan-suyuti p. 2202} {cite:itqan-suyuti p. 2977}۔"
  es: "Un poema sobre la ortografía del Corán de Muhammad ibn Muhammad al-Umawi al-Sharishi, conocido como al-Kharraz. La bibliografía del Itqan editado lo incluye, y las notas se refieren a él para los lugares donde se mantiene o se omite la alif entre los magrebíes y los mashriqis; tiene comentarios, incluidos Dalil al-Hayran y Tanbih al-Khillan {cite:itqan-suyuti p. 3031} {cite:itqan-suyuti p. 2202} {cite:itqan-suyuti p. 2977}."
  fr: "Un poème sur l'orthographe du Coran, attribué à Muhammad ibn Muhammad al-Umawi al-Sharishi, dit al-Kharraz. Il figure dans la bibliographie de l'édition Itqan et les notes y font référence pour les passages où l'alif est conservé ou omis entre les versions maghrébine et mashriqite. Il a fait l'objet de commentaires, notamment dans Dalil al-Hayran et Tanbih al-Khillan (voir Itqan-Suyuti, p. 3031, p. 2202 et p. 2977)."
