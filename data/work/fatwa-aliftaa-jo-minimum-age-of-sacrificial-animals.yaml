id: work/fatwa-aliftaa-jo-minimum-age-of-sacrificial-animals
class: work
kind: fatwa
label: { ar: "سن العقيقة والأضحية", en: "The minimum age of animals for aqiqa and udhiya", ur: "عقیقہ اور قربانی کے جانور کی کم از کم عمر" }
summary:
  ar: "سؤال عن سن العقيقة والأضحية، أجابت فيه دائرة الإفتاء العام الأردنية بأن أقل السن في الإبل خمس سنين، وفي البقر والمعز سنتان، وفي الضأن سنة، ويجوز الضأن فوق ستة أشهر إن كان كبيرًا سمينًا. أجابت الدائرة بأن أقل سن الأضحية والعقيقة في الإبل خمس سنين مع الدخول في السادسة، وفي البقر والمعز سنتان مع الدخول في الثالثة، وفي الضأن سنة مع الدخول في الثانية. وقالت إنه يجوز في الضأن أن يكون أكثر من ستة أشهر بشرط أن يكون كبير الحجم سمينًا."
  en: "A question about the minimum age of animals for aqiqa and udhiya, in which Jordan's General Iftaa Department answered that the minimum is five years for camels, two for cattle and goats and one for sheep, and that a sheep over six months may be used if large and fat. The Department answered that the minimum age for udhiya and aqiqa is five full years, entering the sixth, for camels; two years, entering the third, for cattle and goats; and one year, entering the second, for sheep. It said a sheep may be over six months old provided it is large and fat."
  ur: "عقیقہ اور قربانی کے جانور کی کم از کم عمر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کم از کم عمر اونٹ میں پانچ سال، گائے اور بکری میں دو سال، اور بھیڑ میں ایک سال ہے، اور چھ ماہ سے زیادہ کی بھیڑ بڑی اور موٹی ہو تو جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی اور عقیقہ کی کم از کم عمر اونٹ میں پانچ سال پورے ہو کر چھٹے میں داخل ہونا، گائے اور بکری میں دو سال پورے ہو کر تیسرے میں داخل ہونا، اور بھیڑ میں ایک سال پورا ہو کر دوسرے میں داخل ہونا ہے۔ اس نے کہا کہ بھیڑ چھ ماہ سے زیادہ کی بھی ہو سکتی ہے بشرطیکہ بڑے جسم والی اور موٹی ہو۔"
