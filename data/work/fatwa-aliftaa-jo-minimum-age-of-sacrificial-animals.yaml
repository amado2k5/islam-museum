id: work/fatwa-aliftaa-jo-minimum-age-of-sacrificial-animals
class: work
kind: fatwa
label: { ar: "سن العقيقة والأضحية", en: "The minimum age of animals for aqiqa and udhiya", ur: "عقیقہ اور قربانی کے جانور کی کم از کم عمر", es: "La edad mínima de los animales para aqiqa y udhiya", fr: "L'âge minimum des animaux pour l'aqiqa et l'udhiya" }
summary:
  ar: "سؤال عن سن العقيقة والأضحية، أجابت فيه دائرة الإفتاء العام الأردنية بأن أقل السن في الإبل خمس سنين، وفي البقر والمعز سنتان، وفي الضأن سنة، ويجوز الضأن فوق ستة أشهر إن كان كبيرًا سمينًا. أجابت الدائرة بأن أقل سن الأضحية والعقيقة في الإبل خمس سنين مع الدخول في السادسة، وفي البقر والمعز سنتان مع الدخول في الثالثة، وفي الضأن سنة مع الدخول في الثانية. وقالت إنه يجوز في الضأن أن يكون أكثر من ستة أشهر بشرط أن يكون كبير الحجم سمينًا."
  en: "A question about the minimum age of animals for aqiqa and udhiya, in which Jordan's General Iftaa Department answered that the minimum is five years for camels, two for cattle and goats and one for sheep, and that a sheep over six months may be used if large and fat. The Department answered that the minimum age for udhiya and aqiqa is five full years, entering the sixth, for camels; two years, entering the third, for cattle and goats; and one year, entering the second, for sheep. It said a sheep may be over six months old provided it is large and fat."
  ur: "عقیقہ اور قربانی کے جانور کی کم از کم عمر کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کم از کم عمر اونٹ میں پانچ سال، گائے اور بکری میں دو سال، اور بھیڑ میں ایک سال ہے، اور چھ ماہ سے زیادہ کی بھیڑ بڑی اور موٹی ہو تو جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی اور عقیقہ کی کم از کم عمر اونٹ میں پانچ سال پورے ہو کر چھٹے میں داخل ہونا، گائے اور بکری میں دو سال پورے ہو کر تیسرے میں داخل ہونا، اور بھیڑ میں ایک سال پورا ہو کر دوسرے میں داخل ہونا ہے۔ اس نے کہا کہ بھیڑ چھ ماہ سے زیادہ کی بھی ہو سکتی ہے بشرطیکہ بڑے جسم والی اور موٹی ہو۔"
  es: "Una pregunta sobre la edad mínima de los animales para aqiqa y udhiya, a la que el Departamento General de Iftaa de Jordania respondió que la edad mínima es de cinco años para los camellos, dos para el ganado vacuno y las cabras, y uno para las ovejas, y que se puede utilizar una oveja mayor de seis meses si es grande y gorda. El Departamento respondió que la edad mínima para udhiya y aqiqa es de cinco años completos, entrando en el sexto, para los camellos; dos años, entrando en el tercero, para el ganado vacuno y las cabras; y un año, entrando en el segundo, para las ovejas. Dijo que una oveja puede tener más de seis meses siempre que sea grande y gorda."
  fr: "Concernant l'âge minimum requis pour les sacrifices rituels (aqiqa et udhiya), le Département général de la Iftaa en Jordanie a répondu que cet âge est de cinq ans pour les chameaux, deux ans pour les bovins et les chèvres, et un an pour les moutons. Il a précisé qu'un mouton de plus de six mois peut être utilisé s'il est grand et bien gras. Le Département a également indiqué que l'âge minimum pour les sacrifices rituels est de cinq ans (six ans inclus) pour les chameaux; de deux ans (trois ans inclus) pour les bovins et les chèvres; et d'un an (deux ans inclus) pour les moutons. Il a ajouté qu'un mouton de plus de six mois peut être utilisé s'il est grand et bien gras."
