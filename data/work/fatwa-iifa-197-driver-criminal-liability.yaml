label: { ar: "قرار مجمع الفقه الإسلامي الدولي 197 (21/3) بشأن المسؤولية الجنائية لقائدي المركبات بسبب السرعة وعدم المبالاة", en: "IIFA resolution 197 (21/3) on the criminal liability of vehicle drivers for speeding and recklessness", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 197 (21/3): تیز رفتاری اور بے پرواہی پر گاڑی چلانے والوں کی فوجداری ذمہ داری", es: "Resolución 197 (21/3) de la IIFA sobre la responsabilidad penal de los conductores de vehículos por exceso de velocidad y conducción temeraria.", fr: "Résolution 197 (21/3) de l'IIFA sur la responsabilité pénale des conducteurs de véhicules pour excès de vitesse et conduite imprudente" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩ استشعارًا لأهمية العناية بالموضوع مع تفاقم حوادث المركبات وآثارها السيئة على الأفراد والمجتمعات. قرر المجمع: أولًا تأكيد قراره 71 ⁦(8/2)⁩ الصادر في دورته الثامنة ببندر سيري باجوان ⁦(1–7 محرم 1414هـ، 21–27 يونيو 1993م)⁩ بشأن حوادث السير. ثانيًا يجب الالتزام بأنظمة المرور التي قصد بها المصلحة العامة. ثالثًا يحرم أن يتصرف قائد المركبة تصرفًا يفضي غالبًا إلى الإضرار بنفسه أو بغيره ويضمن ما ترتب على تصرفه من أضرار ومن ذلك: قطع الإشارة الحمراء؛ والسرعة الزائدة المفرطة؛ والاستعراض بالسيارة ⁦(التفحيط)⁩ والمطاردات غير المشروعة؛ والإهمال في صيانة أو قيادة المركبة إهمالًا ينشأ بسببه الضرر. فإذا ترتب على هذه التصرفات جناية على النفس أو ما دونها فيتحمل المسؤولية الجنائية عمدًا أو شبه عمد أو خطأ بحسب الحالة، ولولي الأمر تعزيره بما يراه من عقوبة مناسبة. وأوصى الجهات ذات العلاقة في الدول الإسلامية ببث الوعي بأهمية الالتزام بقواعد السير والآثار السيئة المترتبة على مخالفتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013), alert to the matter's importance amid worsening vehicle accidents and their ill effects on individuals and communities. It ruled: first, reaffirming its resolution 71 (8/2) from the eighth session in Bandar Seri Begawan (1–7 Muharram 1414, 21–27 June 1993) on traffic accidents. Second, traffic regulations intended for the public interest must be observed. Third, it is forbidden for a driver to act in a way likely to harm himself or others, and he is liable for the harm resulting from his act — including: running a red light; excessive speeding; stunt driving (tafhit) and unlawful chases; and negligence in maintaining or driving the vehicle from which harm arises. If these acts result in an offence against life or limb he bears criminal liability as intentional, quasi-intentional or accidental according to the case, and the ruler may apply the deterrent punishment he deems suitable. It recommended that the relevant bodies in Islamic states spread awareness of the importance of observing traffic rules and the ill effects of breaching them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں — گاڑیوں کے بڑھتے حادثات اور ان کے افراد و معاشروں پر برے اثرات کے پیش نظر موضوع کی اہمیت محسوس کرتے ہوئے۔ اکیڈمی نے فیصلہ کیا: پہلا، بندر سری بگاوان میں اپنی آٹھویں مجلس ⁦(1–7 محرم 1414ھ، 21–27 جون 1993ء)⁩ کی قرارداد 71 ⁦(8/2)⁩ برائے ٹریفک حادثات کی تائید۔ دوسرا، ٹریفک کے وہ قوانین لازماً مانے جائیں جن کا مقصد عوامی مفاد ہے۔ تیسرا، گاڑی چلانے والے کے لیے ایسا عمل حرام ہے جو عموماً خود اسے یا دوسروں کو نقصان پہنچائے، اور وہ اپنے عمل سے ہونے والے نقصان کا ذمہ دار ہے — جس میں شامل: ریڈ لائٹ توڑنا؛ حد سے زیادہ تیز رفتاری؛ گاڑی سے کرتب دکھانا ⁦(تفحیط)⁩ اور غیر قانونی پیچھا؛ اور گاڑی کی دیکھ بھال یا چلانے میں ایسی لاپرواہی جس سے نقصان پیدا ہو۔ اگر ان اعمال سے جان یا اعضاء پر جرم ہو تو وہ عمد، شبهِ عمد یا خطا کے مطابق فوجداری ذمہ داری اٹھائے، اور ولیِ امر اسے مناسب سزا دے سکتا ہے۔ اکیڈمی نے اسلامی ممالک کے متعلقہ اداروں سے ٹریفک قوانین کی پابندی کی اہمیت اور ان کی خلاف ورزی کے برے نتائج کی آگہی پھیلانے کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013), alertando sobre la importancia del asunto en medio del empeoramiento de los accidentes de tráfico y sus efectos negativos en las personas y las comunidades. Dictaminó: primero, reafirmar su resolución 71 (8/2) de la octava sesión en Bandar Seri Begawan (1-7 de Muharram de 1414, 21-27 de junio de 1993) sobre accidentes de tráfico. Segundo, deben observarse las normas de tráfico destinadas al interés público. Tercero, está prohibido que un conductor actúe de manera que pueda perjudicarse a sí mismo o a otros, y es responsable del daño resultante de su acto, incluyendo: pasarse un semáforo en rojo; exceso de velocidad; conducción temeraria (tafhit) y persecuciones ilegales; y negligencia en el mantenimiento o la conducción del vehículo del que se origina el daño. Si estos actos resultan en un delito contra la vida o la integridad física, el infractor incurrirá en responsabilidad penal, ya sea intencional, cuasi intencional o accidental, según el caso, y el gobernante podrá aplicar la pena disuasoria que considere apropiada. Se recomendó que los organismos pertinentes en los estados islámicos difundieran la importancia de respetar las normas de tránsito y las consecuencias negativas de su incumplimiento."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 21e session à Riyad (15-19 Muharram 1435, soit 18-22 novembre 2013), a souligné l'importance de la question face à l'aggravation des accidents de la route et à leurs conséquences néfastes pour les individus et les collectivités. Elle a statué: premièrement, réaffirmant sa résolution 71 (8/2) de la huitième session à Bandar Seri Begawan (1-7 Muharram 1414, soit 21-27 juin 1993) relative aux accidents de la circulation; deuxièmement, le code de la route, conçu dans l'intérêt public, doit être respecté; troisièmement, il est interdit à tout conducteur d'adopter un comportement susceptible de se nuire à lui-même ou à autrui, et il est responsable du dommage résultant de ses actes – notamment: le franchissement d'un feu rouge; l'excès de vitesse; la conduite dangereuse (tafhit) et les poursuites illégales; et la négligence dans l'entretien ou la conduite du véhicule à l'origine du dommage. Si ces actes entraînent une atteinte à la vie ou à l'intégrité physique, l'auteur est pénalement responsable, que l'acte soit intentionnel, quasi intentionnel ou accidentel selon les circonstances, et le souverain peut appliquer la peine dissuasive qu'il juge appropriée. Il est recommandé aux instances compétentes des États islamiques de sensibiliser la population à l'importance du respect du code de la route et aux conséquences néfastes de son infraction."
