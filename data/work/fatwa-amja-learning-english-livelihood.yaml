label: { ar: "تعلم الإنجليزية والكمبيوتر وحديث النية", en: "Learning English and computing, and the hadith on intention", ur: "انگریزی و کمپیوٹر سیکھنا اور نیت کی حدیث", es: "Aprender inglés e informática, y el hadiz sobre la intención", fr: "L'apprentissage de l'anglais et de l'informatique, et le hadith sur l'intention", tr: "İngilizce, bilgisayar öğrenin ve iyi niyetli olun", id: "Belajar bahasa Inggris, komputer, dan punya niat baik" }
summary:
  ar: "سأل سائل عن جواز تعلم اللغة الإنجليزية والكمبيوتر وعن مقصود حديث من تعلم علمًا مما يبتغى به وجه الله لا يتعلمه إلا ليصيب به عرضًا من الدنيا لم يجد عرف الجنة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81134 بتاريخ 11 مارس 2010)⁩ أنه لا حرج في تعلم مهنة يقوم بها أمور معاشه وقد انعقد على هذا إجماع المسلمين، ولا تعارض مع الحديث الذي يتناول علوم الشريعة البحتة وفي الباب قوله من ابتغى العلم ليباهي به العلماء أو يماري به السفهاء أو يصرف وجوه الناس إليه فالنار، وأن من تعلم مهنة ليصون بها وجهه عن مذلة السؤال ويطعم أهله ويصل رحمه فهذا عمل صالح يبتغى به وجه الله فليحسن النية."
  en: "A questioner asked whether learning English and computing is lawful, and what is meant by the hadith that whoever learns knowledge meant to be sought for God's face only to gain some worldly offer will not smell Paradise's scent. Dr. Salah al-Sawi (fatwa no. 81134, 11 March 2010) answered that learning a trade to run one's living is unobjectionable — the Muslims' consensus — and does not contradict the hadith, which concerns purely sharia sciences, as in 'whoever seeks knowledge to vie with scholars, dispute with fools, or draw people's faces to himself — the Fire'; one who learns a trade to spare himself begging's humiliation, feed his family and keep kinship does a good deed intended for God's face — let him make his intention good."
  ur: "ایک سائل نے پوچھا کہ انگریزی و کمپیوٹر سیکھنا اس حدیث میں آتا ہے جو علم کو دنیا کے لیے سیکھنے سے منع کرتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81134، 11 مارچ 2010)⁩ کے مطابق روزی کا پیشہ سیکھنا جائز ہے؛ حدیث علوم شریعت میں ریائیت کے بارے میں ہے اور معاش کے لیے پیشہ سیکھنا نیک عمل ہے۔"
  es: "Un consultante preguntó si aprender inglés e informática es lícito, y qué significa el hadiz que dice que quien aprende conocimiento con la intención de agradar a Dios solo para obtener algún beneficio mundano no percibirá el aroma del Paraíso. El Dr. Salah al-Sawi (fatwa n.° 81134, 11 de marzo de 2010) respondió que aprender un oficio para ganarse la vida es aceptable —el consenso de los musulmanes— y no contradice el hadiz, que se refiere exclusivamente a las ciencias de la sharia, como en «quien busca conocimiento para competir con los eruditos, discutir con los necios o atraer la atención de la gente hacia sí mismo, el Fuego». Quien aprende un oficio para evitar la humillación de la mendicidad, alimentar a su familia y mantener los lazos familiares realiza una buena obra destinada a agradar a Dios; que su intención sea buena."
  fr: "Un internaute a demandé si l'apprentissage de l'anglais et de l'informatique était licite, et ce que signifiait le hadith selon lequel quiconque acquiert un savoir destiné à plaire à Dieu dans le seul but d'obtenir un avantage terrestre ne sentira pas le parfum du Paradis. Le Dr Salah al-Sawi (fatwa n° 81134, 11 mars 2010) a répondu qu'apprendre un métier pour subvenir à ses besoins est licite – c'est le consensus des musulmans – et ne contredit pas le hadith, qui concerne exclusivement les sciences islamiques, comme dans l'affirmation suivante: « Quiconque recherche le savoir pour rivaliser avec les savants, disputer avec les ignorants ou attirer l'attention des gens sur lui, ira en Feu ». Celui qui apprend un métier pour s'épargner l'humiliation de la mendicité, nourrir sa famille et maintenir ses liens familiaux accomplit une bonne action destinée à plaire à Dieu; qu'il agisse avec de bonnes intentions."
  tr: "Bir soruya İngilizce ve bilgisayar öğrenmenin caizliği ve hadisin anlamı hakkında sorular soruldu: 'Allah uğruna bilgi öğrenen, sadece cennet bilgisini bulamazsa dünyevi bir fırsat elde etmek için öğrenir.' Dr. Salah Al-Sawy (11 Mart 2010 tarihli 81134 sayılı fetva) geçimini destekleyen bir mesleği öğrenmenin zararı olmadığını ve Müslümanlar arasında bu konuda bir uzlaşının olduğunu yanıtladı. Bu, saf İslami ilimlerle ilgili hadislerle çelişmez; örneğin, bilgiyi alimlere övünmek, aptallara aldanmak ya da dikkatini ona çekmek için arayan kişinin cehennem ateşinde olacağı söylenir. Sorgulamadan yüzünü korumak, ailesini beslemek ve aile bağlarını sürdürmek için meslek öğrenen kişi, Allah'ın razılığını aradığı doğru bir iştir, iyi niyetli olsun."
  id: "Seorang penanya ditanya tentang kelayakan belajar bahasa Inggris dan komputer, serta tentang makna hadits tersebut: 'Siapa pun belajar ilmu demi Allah, ia hanya mempelajarinya untuk mendapatkan kesempatan duniawi yang tidak ia temukan ilmu Surga.' Dr. Salah Al-Sawy menjawab (Fatwa No. 81134 tanggal 11 Maret 2010) bahwa tidak ada salahnya mempelajari profesi yang menopang mata pencaharian, dan ada kesepakatan di kalangan Muslim tentang hal ini. Hal ini tidak bertentangan dengan hadits yang membahas ilmu Islam murni, termasuk pernyataannya bahwa siapa pun yang mencari ilmu untuk membanggakan diri kepada ulama, tertipu oleh orang bodoh, atau mengalihkan perhatian orang ke sana, akan berada di Neraka. Siapa pun yang belajar profesi untuk melindungi wajahnya dari penghinaan pertanyaan, memberi makan keluarga, dan menjaga hubungan keluarga, ini adalah perbuatan benar yang memaksa Allah, biarlah ia memiliki niat baik."
