class: work
kind: fatwa
label: { ar: "حكم إعطاء أحد المشتركين في الجمعية مبلغًا للتنازل عن دوره", en: "Paying a member to give up his turn in a rotating fund", ur: "کمیٹی میں باری چھوڑنے کے عوض رقم دینا" }
summary:
  ar: "سائل سأل عن إعطاء أحد المشتركين في الجمعية مبلغًا من المال للتنازل عن دوره. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21832)⁩ أنه يحرم شرعًا أخذ العوض عن مبادلة الأدوار في تلك الجمعيات فإن أمكن المشترك المتقدم التنازل عن دوره بغير مقابل فهو أحسن على ما فصّل الجواب."
  en: "A questioner asked about paying a member of a rotating savings association a sum to give up his turn. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21832) answered that taking compensation for swapping turns in such associations is forbidden; if the earlier member can give up his turn without compensation that is better — as the answer details."
  ur: "ایک سائل نے گھومتی بچت کمیٹی کے رکن کو اپنی باری چھوڑنے کے بدلے رقم دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21832)⁩ نے جواب دیا کہ ایسی کمیٹیوں میں باری کے تبادلے پر عوض لینا حرام ہے؛ اگر پہلے رکن بغیر عوض اپنی باری چھوڑ دے تو بہتر ہے — جیسا کہ جواب میں تفصیل ہے۔"
