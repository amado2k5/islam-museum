label:
  ar: "اختلاف علي وعبد الله بن مسعود"
  en: "Ikhtilaf Ali wa Abd Allah ibn Mas'ud (The Disagreement of Ali and Ibn Mas'ud)"
  ur: "اختلاف علی و عبد اللہ بن مسعود"
summary:
  ar: "كتاب من كتب الأم للشافعي، يرويه الربيع بن سليمان عن الشافعي، يسوق فيه آثاراً بأسانيده عن علي بن أبي طالب وعبد الله بن مسعود في الطهارة والصلاة والزكاة والحج والنكاح والطلاق والأقضية والفرائض والحدود، ويعقّب على كثير منها بأن مخاطَبيه لا يقولون بها. {cite:kitab-al-umm-wafa-v8 p.391} {cite:kitab-al-umm-wafa-v8 p.392}"
  en: "A book of al-Shafi'i's al-Umm, transmitted by al-Rabi' ibn Sulayman, in which al-Shafi'i gives reports with his chains from Ali ibn Abi Talib and Abd Allah ibn Mas'ud on purity, prayer, zakat, pilgrimage, marriage, divorce, judgements, inheritance and hadd penalties, often adding that the people he addresses do not hold by them."
  ur: "امام شافعی کی الام کی ایک کتاب، جسے ربیع بن سلیمان ان سے روایت کرتے ہیں؛ اس میں وہ اپنی سندوں سے علی بن ابی طالب اور عبد اللہ بن مسعود کے آثار طہارت، نماز، زکوٰۃ، حج، نکاح، طلاق، اقضیہ، فرائض اور حدود میں نقل کرتے ہیں، اور اکثر کے بعد کہتے ہیں کہ جن سے وہ خطاب کر رہے ہیں وہ ان پر عمل نہیں کرتے۔"
