id: work/ikhtilaf-ali-wa-ibn-masud
class: work
kind: book
label:
  ar: "اختلاف علي وعبد الله بن مسعود"
  en: "Ikhtilaf Ali wa Abd Allah ibn Mas'ud (The Disagreement of Ali and Ibn Mas'ud)"
  ur: "اختلاف علی و عبد اللہ بن مسعود"
  es: "Ikhtilaf Ali wa Abd Allah ibn Mas'ud (El desacuerdo entre Ali e Ibn Mas'ud)"
  fr: "Ikhtilaf Ali wa Abd Allah ibn Mas'ud (Le désaccord d'Ali et Ibn Mas'ud)"
  tr: "Ali ile Abdullah bin Masoud arasındaki anlaşmazlık"
  id: "Perselisihan antara Ali dan Abdullah bin Masoud"
summary:
  ar: "كتاب من كتب الأم للشافعي، يرويه الربيع بن سليمان عن الشافعي، يسوق فيه آثاراً بأسانيده عن علي بن أبي طالب وعبد الله بن مسعود في الطهارة والصلاة والزكاة والحج والنكاح والطلاق والأقضية والفرائض والحدود، ويعقّب على كثير منها بأن مخاطَبيه لا يقولون بها. {cite:kitab-al-umm-wafa-v8 p.391} {cite:kitab-al-umm-wafa-v8 p.392}"
  en: "A book of al-Shafi'i's al-Umm, transmitted by al-Rabi' ibn Sulayman, in which al-Shafi'i gives reports with his chains from Ali ibn Abi Talib and Abd Allah ibn Mas'ud on purity, prayer, zakat, pilgrimage, marriage, divorce, judgements, inheritance and hadd penalties, often adding that the people he addresses do not hold by them."
  ur: "امام شافعی کی الام کی ایک کتاب، جسے ربیع بن سلیمان ان سے روایت کرتے ہیں؛ اس میں وہ اپنی سندوں سے علی بن ابی طالب اور عبد اللہ بن مسعود کے آثار طہارت، نماز، زکوٰۃ، حج، نکاح، طلاق، اقضیہ، فرائض اور حدود میں نقل کرتے ہیں، اور اکثر کے بعد کہتے ہیں کہ جن سے وہ خطاب کر رہے ہیں وہ ان پر عمل نہیں کرتے۔"
  es: "Un libro de al-Shafi'i, al-Umm, transmitido por al-Rabi' ibn Sulayman, en el que al-Shafi'i da relatos con sus cadenas de Ali ibn Abi Talib y Abd Allah ibn Mas'ud sobre pureza, oración, zakat, peregrinación, matrimonio, divorcio, juicios, herencia y penas hadd, añadiendo a menudo que las personas a las que se dirige no se rigen por ellos."
  fr: "Un livre d'al-Shafi'i, al-Umm, transmis par al-Rabi' ibn Sulayman, dans lequel al-Shafi'i rapporte, avec ses chaînes de transmission d'Ali ibn Abi Talib et d'Abd Allah ibn Mas'ud, des informations sur la pureté, la prière, la zakat, le pèlerinage, le mariage, le divorce, les jugements, l'héritage et les peines hadd, ajoutant souvent que les personnes auxquelles il s'adresse ne les suivent pas."
  tr: "Al-Shafi'i'nin Anne Kitaplarından bir kitabı, Al-Rabi' ibn Sulayman tarafından Al-Shafi'i'den anlatılan; burada Ali ibn Ebi Talib ve Abdullah ibn Mas'ud'dan arınma, namaz, zekat, hac, evlilik, boşanma, yargı kararları ve hukuki cezalarla ilgili aktarım zincirleriyle raporlar sunar ve bunların çoğuna hitap edenlerin bunları söylemediğini belirtir. {cite:kitab-al-um-wafa-v8 s.391} {cite:kitab-al-um-wafa-v8 s.392}"
  id: "Sebuah buku dari Kitab Ibu oleh Al-Shafi'i, yang diceritakan oleh Al-Rabi' ibn Sulayman dari Al-Shafi'i, di mana ia menyajikan laporan beserta rantai transmisi dari Ali ibn Abi Talib dan Abdullah ibn Mas'ud mengenai penyucian, doa, zakat, ziarah, pernikahan, perceraian, putusan pengadilan, dan hukuman hukum, dan ia mengomentari banyak di antaranya, mengatakan bahwa para penamanya tidak mengatakannya. {cite:kitab-al-um-wafa-v8 hlm.391} {cite:kitab-al-um-wafa-v8 hlm.392}"
