id: work/fatwa-aliftaa-jo-compensation-for-a-doctors-mistake
class: work
kind: fatwa
label: { ar: "تعويض المريض عن خطأ الطبيب", en: "Compensating a patient for a doctor's mistake", ur: "ڈاکٹر کی غلطی پر مریض کو معاوضہ", es: "Compensar a un paciente por un error médico", fr: "Indemniser un patient pour une erreur médicale", tr: "Hastanın doktor hatasının tazminatı", id: "Mengkompensasi pasien atas kesalahan dokter" }
summary:
  ar: "سؤال عن تعويض المريض عن خطأ الطبيب، أجابت فيه دائرة الإفتاء العام الأردنية بأن الطبيب يضمن ما سببه تقصيره أو جهله من ضرر، ولا ضمان عليه إن بذل العناية الكاملة وحصلت مضاعفات لا يمكن تلافيها. أجابت الدائرة بأن الأصل أن كل خطأ صدر عن الطبيب وسبب ضررًا لغيره بتقصير أو عدم دراية يلزمه ضمانه وتعويض المتضرر، وذكرت قاعدة أن المباشر ضامن، ونقلت عن ابن قدامة في المغني أن الطبيب الحاذق إذا جنت يده، كأن يتجاوز موضع القطع أو يقطع في غير محله، ضمن. وقالت إن الطبيب إذا قام باللازم على الوجه الأكمل واتخذ أسباب العناية والحيطة، ثم حصلت مضاعفات لا يمكن تلافيها بحسب المختصين، فلا ضمان عليه، ونقلت عن النووي في روضة الطالبين أن الحجام والختان والبيطار لا ضمان عليهم إذا لم يفرطوا. ونقلت عن الخطابي في معالم السنن أنه لا يعلم خلافًا في أن المعالج إذا تعدى فتلف المريض ضمن، وأن من تعاطى علمًا أو عملًا لا يعرفه متعد يضمن الدية دون القصاص، وخلصت إلى أنه إن ثبت تقصير الطبيب أو تعديه فلا بد من تعويض المريض أو طلب مسامحته."
  en: "A question about compensating a patient for a doctor's mistake, in which Jordan's General Iftaa Department answered that a doctor is liable for harm caused by his negligence or ignorance, and not liable if he took full care and unavoidable complications occurred. The Department answered that, in principle, any mistake by a doctor that harms another through negligence or lack of knowledge makes him liable to compensate the person harmed, citing the maxim that the direct agent is liable, and quoting Ibn Qudama in al-Mughni that a skilled doctor whose hand errs, such as cutting beyond or outside the proper place, is liable. It said that if the doctor did what was required in the fullest way and took every precaution, and complications then occurred that specialists consider unavoidable, he is not liable, quoting al-Nawawi in Rawdat al-Talibin that a cupper, a circumciser and a veterinarian are not liable if they were not negligent. It quoted al-Khattabi in Ma'alim al-Sunan that he knew of no disagreement that a practitioner who transgresses and causes a patient's death is liable, and that one who practises a science or craft he does not know is a transgressor who owes blood money but not retaliation, and it concluded that if the doctor's negligence or transgression is established, he must compensate the patient or seek his forgiveness."
  ur: "ڈاکٹر کی غلطی پر مریض کو معاوضہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ڈاکٹر اپنی کوتاہی یا لاعلمی سے ہونے والے نقصان کا ضامن ہے، اور اگر اس نے پوری احتیاط کی اور ناگزیر پیچیدگیاں پیش آئیں تو ضامن نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ ڈاکٹر کی ہر وہ غلطی جو کوتاہی یا لاعلمی سے دوسرے کو نقصان پہنچائے، اس پر ضمان اور متاثرہ کو معاوضہ لازم کرتی ہے، اور قاعدہ ذکر کیا کہ براہِ راست کرنے والا ضامن ہے، اور المغنی میں ابن قدامہ کا قول نقل کیا کہ ماہر ڈاکٹر کا ہاتھ چوک جائے، جیسے کاٹنے کی جگہ سے آگے بڑھ جائے یا غلط جگہ کاٹ دے، تو وہ ضامن ہے۔ اس نے کہا کہ اگر ڈاکٹر نے لازمی کام مکمل طور پر کیا اور ہر احتیاط برتی، پھر ایسی پیچیدگیاں پیش آئیں جو ماہرین کے مطابق ناگزیر تھیں، تو وہ ضامن نہیں، اور روضۃ الطالبین میں نووی کا قول نقل کیا کہ حجام، ختنہ کرنے والا اور جانوروں کا معالج کوتاہی نہ کریں تو ضامن نہیں۔ اس نے معالم السنن میں خطابی کا قول نقل کیا کہ معالج زیادتی کرے اور مریض ہلاک ہو جائے تو اس کے ضامن ہونے میں انہیں کوئی اختلاف معلوم نہیں، اور جو ایسا علم یا کام کرے جسے وہ نہیں جانتا وہ زیادتی کرنے والا ہے جس پر دیت ہے قصاص نہیں، اور نتیجہ نکالا کہ اگر ڈاکٹر کی کوتاہی یا زیادتی ثابت ہو تو مریض کو معاوضہ دینا یا اس سے معافی مانگنا ضروری ہے۔"
  es: "Una pregunta sobre la indemnización a un paciente por un error médico, en la que el Departamento General de Iftaa de Jordania respondió que un médico es responsable por el daño causado por su negligencia o ignorancia, y no responsable si tomó todas las precauciones y ocurrieron complicaciones inevitables. El Departamento respondió que, en principio, cualquier error de un médico que perjudique a otra persona por negligencia o falta de conocimiento lo hace responsable de indemnizar a la persona perjudicada, citando el principio de que el agente directo es responsable, y citando a Ibn Qudama en al-Mughni que dice que un médico hábil cuya mano se equivoca, como cortar más allá o fuera del lugar correcto, es responsable. Dijo que si el médico hizo lo requerido de la manera más completa y tomó todas las precauciones, y luego ocurrieron complicaciones que los especialistas consideran inevitables, no es responsable, citando a al-Nawawi en Rawdat al-Talibin que un cuper, un circuncidador y un veterinario no son responsables si no fueron negligentes. Citaba a al-Khattabi en Ma'alim al-Sunan, quien afirmaba no conocer ninguna discrepancia en cuanto a que un médico que transgrede y causa la muerte de un paciente es responsable, y que quien practica una ciencia u oficio que desconoce es un transgresor que debe una indemnización por la pérdida de sangre, pero no una represalia. Concluía, por lo tanto, que si se comprueba la negligencia o transgresión del médico, este debe compensar al paciente o pedirle perdón."
  fr: "Concernant la question de l'indemnisation d'un patient suite à une erreur médicale, le Département général de la Iftaa jordanien a statué qu'un médecin est responsable du préjudice causé par sa négligence ou son ignorance, sauf s'il a fait preuve de toute la diligence requise et que des complications inévitables sont survenues. Le Département a précisé qu'en principe, toute erreur médicale causant un préjudice à autrui par négligence ou ignorance engage sa responsabilité, invoquant le principe de la responsabilité du préposé et citant Ibn Qudama dans al-Mughni, selon lequel un médecin compétent commet une erreur de main, par exemple en incisant au-delà ou à un endroit inapproprié, est responsable. Il a ajouté que si le médecin a accompli son acte avec diligence et a pris toutes les précautions nécessaires, et que des complications jugées inévitables par les spécialistes sont survenues, sa responsabilité n'est pas engagée. Le Département a alors cité al-Nawawi dans Rawdat al-Talibin, selon lequel un chirurgien pratiquant les ventouses, un circonciseur et un vétérinaire ne sont pas responsables s'ils n'ont pas commis de négligence. Il est cité par al-Khattabi dans Ma'alim al-Sunan, qui affirme ne connaître aucun désaccord sur le fait qu'un praticien qui commet une faute et cause la mort d'un patient est responsable, et que celui qui pratique une science ou un métier qu'il ne maîtrise pas est un transgresseur qui doit payer le prix du sang mais pas de représailles, et il est conclu que si la négligence ou la faute du médecin est établie, il doit indemniser le patient ou demander son pardon."
  tr: "Hastanın doktorun hatasının tazminatı konusundaki soruya ise, Ürdün Genel Fetva Dairesi, doktorun ihmali veya cehaletinden kaynaklanan zarardan sorumlu olduğunu, tam özen gösterilirse ve önlenemeyen komplikasyonlar ortaya çıkarsa sorumluluk bulunmadığını yanıtladı. Mahkeme, doktorun ihmal veya cehalet yoluyla başkalarına zarar verdiği herhangi bir hatanın sorumlu tutulduğunu ve mağduru tazmin ettiğini belirtti. Kural olarak doğrudan kişinin sorumlu olduğunu belirtti. İbn Qudamah'tan alıntı yaptı Al-Mughni davasında, yetenekli bir doktor kesik noktasına ulaşırsa, örneğin kesme noktasını aşarsa veya yanlış yaparsa sorumludur. Doktor gerekli görevleri doğru yapar, özen ve önlemler alırsa ve uzmanlara göre önlenemeyen komplikasyonlar ortaya çıkarsa, kendisine karşı sorumluluk yoktur. Ayrıca Al-Nawawi'nin Rawdat al-Talibin'de alıntı yaptığı, berber, sünnetçi ve nalbantın ihmal etmezlerse sorumlu tutulmadığını belirtti. Ma'alim al-Sunan'da Al-Hattabi'nin alıntı yaptığı, şifacı ihlal ederse ve hastaya zarar gelirse sorumlu olduğu ve kendisine yabancı bilgi veya iş yapan kişinin kan parası ile cezalandırılması gerektiği konusunda tartışma yoktur. Doktorun ihmali veya aşırılıkları kanıtlanırsa, hastanın tazminatı veya affedilmesi gerektiği sonucuna varıldı."
  id: "Pertanyaan tentang kompensasi pasien atas kesalahan dokter, Departemen Fatwa Umum Yordania menjawab bahwa dokter bertanggung jawab atas kerusakan akibat kelalaian atau ketidaktahuannya, dan tidak ada tanggung jawab jika kehati-hatian penuh diberikan dan komplikasi yang tidak dapat dihindari. Pengadilan menjawab bahwa kesalahan yang dilakukan dokter yang menyebabkan kerugian pada orang lain karena kelalaian atau ketidaktahuan bertanggung jawab dan memberikan kompensasi kepada pihak yang terluka. Pengadilan menyatakan sebagai aturan bahwa orang langsung bertanggung jawab. Pengadilan mengutip Ibn Qudamah dalam Al-Mughni bahwa jika dokter terampil mencapai titik luka, misalnya jika melebihi titik potong atau membuatnya tidak tepat, maka ia bertanggung jawab. Pengadilan menyatakan bahwa jika dokter melakukan tugas yang diperlukan dengan benar dan mengambil perhatian serta tindakan pencegahan, lalu muncul komplikasi yang menurut para ahli tidak dapat dihindari, maka tidak ada tanggung jawab atas dirinya. Pengadilan juga mengutip Al-Nawawi dalam Rawdat al-Talibin bahwa tukang cukur, sunat, dan tukang besi tidak bertanggung jawab jika mereka tidak mengabaikannya. Surat itu mengutip Al-Khattabi dalam Ma'alim al-Sunan bahwa tidak ada perselisihan bahwa jika penyembuh melanggar dan pasien dirugikan, ia bertanggung jawab, dan siapa pun yang melakukan pengetahuan atau pekerjaan yang tidak diketahuinya akan dikenakan uang darah tanpa pembalasan. Kesimpulan tersebut menyimpulkan bahwa jika kelalaian atau kelebihan dokter terbukti, maka pasien harus diberi kompensasi atau diampuni diminta."
