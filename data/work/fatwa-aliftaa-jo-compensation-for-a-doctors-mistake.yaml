id: work/fatwa-aliftaa-jo-compensation-for-a-doctors-mistake
class: work
kind: fatwa
label: { ar: "تعويض المريض عن خطأ الطبيب", en: "Compensating a patient for a doctor's mistake", ur: "ڈاکٹر کی غلطی پر مریض کو معاوضہ" }
summary:
  ar: "سؤال عن تعويض المريض عن خطأ الطبيب، أجابت فيه دائرة الإفتاء العام الأردنية بأن الطبيب يضمن ما سببه تقصيره أو جهله من ضرر، ولا ضمان عليه إن بذل العناية الكاملة وحصلت مضاعفات لا يمكن تلافيها. أجابت الدائرة بأن الأصل أن كل خطأ صدر عن الطبيب وسبب ضررًا لغيره بتقصير أو عدم دراية يلزمه ضمانه وتعويض المتضرر، وذكرت قاعدة أن المباشر ضامن، ونقلت عن ابن قدامة في المغني أن الطبيب الحاذق إذا جنت يده، كأن يتجاوز موضع القطع أو يقطع في غير محله، ضمن. وقالت إن الطبيب إذا قام باللازم على الوجه الأكمل واتخذ أسباب العناية والحيطة، ثم حصلت مضاعفات لا يمكن تلافيها بحسب المختصين، فلا ضمان عليه، ونقلت عن النووي في روضة الطالبين أن الحجام والختان والبيطار لا ضمان عليهم إذا لم يفرطوا. ونقلت عن الخطابي في معالم السنن أنه لا يعلم خلافًا في أن المعالج إذا تعدى فتلف المريض ضمن، وأن من تعاطى علمًا أو عملًا لا يعرفه متعد يضمن الدية دون القصاص، وخلصت إلى أنه إن ثبت تقصير الطبيب أو تعديه فلا بد من تعويض المريض أو طلب مسامحته."
  en: "A question about compensating a patient for a doctor's mistake, in which Jordan's General Iftaa Department answered that a doctor is liable for harm caused by his negligence or ignorance, and not liable if he took full care and unavoidable complications occurred. The Department answered that, in principle, any mistake by a doctor that harms another through negligence or lack of knowledge makes him liable to compensate the person harmed, citing the maxim that the direct agent is liable, and quoting Ibn Qudama in al-Mughni that a skilled doctor whose hand errs, such as cutting beyond or outside the proper place, is liable. It said that if the doctor did what was required in the fullest way and took every precaution, and complications then occurred that specialists consider unavoidable, he is not liable, quoting al-Nawawi in Rawdat al-Talibin that a cupper, a circumciser and a veterinarian are not liable if they were not negligent. It quoted al-Khattabi in Ma'alim al-Sunan that he knew of no disagreement that a practitioner who transgresses and causes a patient's death is liable, and that one who practises a science or craft he does not know is a transgressor who owes blood money but not retaliation, and it concluded that if the doctor's negligence or transgression is established, he must compensate the patient or seek his forgiveness."
  ur: "ڈاکٹر کی غلطی پر مریض کو معاوضہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ڈاکٹر اپنی کوتاہی یا لاعلمی سے ہونے والے نقصان کا ضامن ہے، اور اگر اس نے پوری احتیاط کی اور ناگزیر پیچیدگیاں پیش آئیں تو ضامن نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ ڈاکٹر کی ہر وہ غلطی جو کوتاہی یا لاعلمی سے دوسرے کو نقصان پہنچائے، اس پر ضمان اور متاثرہ کو معاوضہ لازم کرتی ہے، اور قاعدہ ذکر کیا کہ براہِ راست کرنے والا ضامن ہے، اور المغنی میں ابن قدامہ کا قول نقل کیا کہ ماہر ڈاکٹر کا ہاتھ چوک جائے، جیسے کاٹنے کی جگہ سے آگے بڑھ جائے یا غلط جگہ کاٹ دے، تو وہ ضامن ہے۔ اس نے کہا کہ اگر ڈاکٹر نے لازمی کام مکمل طور پر کیا اور ہر احتیاط برتی، پھر ایسی پیچیدگیاں پیش آئیں جو ماہرین کے مطابق ناگزیر تھیں، تو وہ ضامن نہیں، اور روضۃ الطالبین میں نووی کا قول نقل کیا کہ حجام، ختنہ کرنے والا اور جانوروں کا معالج کوتاہی نہ کریں تو ضامن نہیں۔ اس نے معالم السنن میں خطابی کا قول نقل کیا کہ معالج زیادتی کرے اور مریض ہلاک ہو جائے تو اس کے ضامن ہونے میں انہیں کوئی اختلاف معلوم نہیں، اور جو ایسا علم یا کام کرے جسے وہ نہیں جانتا وہ زیادتی کرنے والا ہے جس پر دیت ہے قصاص نہیں، اور نتیجہ نکالا کہ اگر ڈاکٹر کی کوتاہی یا زیادتی ثابت ہو تو مریض کو معاوضہ دینا یا اس سے معافی مانگنا ضروری ہے۔"
