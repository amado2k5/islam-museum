id: work/fatwa-aliftaa-jo-buying-a-food-ration-card-at-a-discount
class: work
kind: fatwa
label: { ar: "شراء البطاقة التموينية بأقل من قيمتها", en: "Buying a food ration card at a discount", ur: "راشن کارڈ اس کی قیمت سے کم پر خریدنا" }
summary:
  ar: "سؤال عن شراء البطاقة التموينية بأقل من قيمتها، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع البطاقة التموينية قبل تملك المواد التي تمثلها لا يجوز لما فيه من جهالة فاحشة ولأنه يستغل حاجة الفقراء، فإذا استوفى صاحبها المواد وتملكها جاز له بيعها بأي سعر. أجابت الدائرة بأن بيع البطاقة التموينية يشتمل على جهالة فاحشة لأن المبيع غير معلوم النوع والمقدار، والجهالة مفسدة لعقد البيع، واستدلت بحديث رواه مسلم عن أبي هريرة في النهي عن بيع الحصاة وبيع الغرر. وقالت إن البطاقة تخصصها الجهة التي تصرفها لمساعدة ذوي الحاجة ودعم سلع تموينية ضرورية، وبيعها يستغل حاجات الفقراء ويحول دون المقصود منها ويقلب المعونة ربحًا لغير المحتاجين. وقالت إن مما يقوي المنع ما رواه مالك في الموطأ من أن صكوك طعام خرجت للناس في زمن مروان بن الحكم فتبايعوها قبل أن يستوفوها، فأنكر ذلك زيد بن ثابت ورجل من الصحابة على مروان، فبعث مروان الحرس ينتزعونها ويردونها إلى أهلها. وخلصت إلى أن بيع البطاقات التموينية قبل تملك المواد العينية لا يجوز، أما إذا استوفى صاحب البطاقة حقه وتملك المواد التي تمثلها الكوبونات جاز له بيعها بأي سعر شاء."
  en: "A question about buying a food ration card at a discount, in which Jordan's General Iftaa Department answered that selling a ration card before taking possession of the goods it represents is not permitted, because of the gross uncertainty involved and because it exploits the needs of the poor; once the holder has received and owns the goods, he may sell them at any price. The Department answered that selling a ration card involves gross uncertainty, since the type and quantity of what is sold are unknown, and uncertainty invalidates a sale, citing a hadith narrated by Muslim from Abu Hurayra prohibiting the pebble sale and sales involving excessive uncertainty (gharar). It said that the card is allocated by the body that issues it to help those in need and to subsidise essential foodstuffs; selling it exploits the needs of the poor, defeats the purpose of issuing the cards and turns aid into profit for those not in need. It said the prohibition is strengthened by a report narrated by Malik in al-Muwatta that food vouchers were issued to people in the time of Marwan ibn al-Hakam and they traded them before receiving the food; Zayd ibn Thabit and another Companion objected to Marwan, who sent guards to take the vouchers back from people and return them to their owners. It concluded that selling ration cards before owning the actual goods is not permitted, but once the cardholder has received his entitlement and owns the goods the coupons represent, he may sell them at whatever price he wishes."
  ur: "راشن کارڈ اس کی قیمت سے کم پر خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ راشن کارڈ کو ان اشیا پر قبضے سے پہلے بیچنا جن کی وہ نمائندگی کرتا ہے جائز نہیں، کیونکہ اس میں سخت لاعلمی ہے اور یہ غریبوں کی ضرورت کا استحصال ہے؛ جب کارڈ رکھنے والا اشیا وصول کر کے ان کا مالک بن جائے تو جس قیمت پر چاہے بیچ سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ راشن کارڈ کی بیع میں سخت لاعلمی ہے کیونکہ بیچی جانے والی چیز کی قسم اور مقدار معلوم نہیں، اور لاعلمی بیع کو فاسد کر دیتی ہے، اور مسلم کی ابو ہریرہ سے روایت کردہ حدیث سے استدلال کیا جس میں کنکری کی بیع اور غرر کی بیع سے منع کیا گیا۔ اس نے کہا کہ کارڈ جاری کرنے والا ادارہ اسے ضرورت مندوں کی مدد اور ضروری غذائی اشیا پر سبسڈی کے لیے مختص کرتا ہے؛ اسے بیچنا غریبوں کی ضرورتوں کا استحصال ہے، کارڈ جاری کرنے کا مقصد فوت کرتا ہے اور امداد کو غیر مستحقین کے منافع میں بدل دیتا ہے۔ اس نے کہا کہ ممانعت کو اس روایت سے تقویت ملتی ہے جو امام مالک نے مؤطا میں بیان کی کہ مروان بن حکم کے زمانے میں لوگوں کو کھانے کی رسیدیں ملیں تو انہوں نے کھانا وصول کرنے سے پہلے ان کی خرید و فروخت کی؛ زید بن ثابت اور ایک دوسرے صحابی نے مروان پر اعتراض کیا، تو مروان نے پہرے دار بھیجے جنہوں نے رسیدیں لوگوں سے واپس لے کر ان کے اصل حقداروں کو لوٹائیں۔ اس نے نتیجہ نکالا کہ اصل اشیا کی ملکیت سے پہلے راشن کارڈ بیچنا جائز نہیں، لیکن جب کارڈ رکھنے والا اپنا حق وصول کر لے اور کوپنوں کی نمائندگی کرنے والی اشیا کا مالک بن جائے تو جس قیمت پر چاہے بیچ سکتا ہے۔"
