id: work/fatwa-amja-delaying-fajr-abroad
class: work
kind: fatwa
label: { ar: "تأخير الفجر للمغتربين", en: "Delaying Fajr without real excuse — the emigrants' circumstances weighed", ur: "مغتربوں کا فجر مؤخر — عذر کی حد", es: "Retrasar el Fajr sin una excusa real: las circunstancias de los emigrantes fueron un factor determinante." }
summary:
  ar: "سأل سائل أنهم يؤخرون صلاة الفجر بدون سبب معين. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86088 بتاريخ 7 ديسمبر 2011)⁩ أن أفضل الأعمال الصلاة لوقتها كما خبر بذلك المعصوم ولكن إذا اقتضت ظروف المغتربين خارج ديار الإسلام تأخير الصلاة عن أول الوقت ليتمكنوا من أدائها جماعة فلا حرج على ما فصّل الجواب من الضوابط."
  en: "A questioner said they delay the Fajr prayer for no definite reason. AMJA's fatwa committee (fatwa no. 86088, 7 December 2011) answered that the best of works is the prayer at its time, as the infallible reported; but where emigrants' circumstances outside the lands of Islam require delaying it past the time's start so they can pray it in congregation, there is no harm — the answer detailing the bounds."
  ur: "فجر مؤخر؟ لجنة الفتوى ⁦(فتویٰ 86088، 7 دسمبر 2011)⁩ کے مطابق پہل وقت افضل؛ مغتربوں کی جماعت کے لیے تاخیر جائز۔"
  es: "Un interlocutor afirmó que retrasan la oración del Fajr sin motivo aparente. El comité de fatuas de AMJA (fatua n.º 86088, 7 de diciembre de 2011) respondió que la mejor de las obras es la oración en su debido momento, como lo informó el Infalible; pero cuando las circunstancias de los emigrantes fuera de las tierras del Islam requieren retrasarla más allá de su hora habitual para que puedan rezarla en congregación, no hay inconveniente, según la respuesta que detalla los límites."
