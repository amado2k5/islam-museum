label:
  ar: "التمهيد لما في الموطأ من المعاني والأسانيد"
  en: "al-Tamhid li-ma fi al-Muwatta' min al-Ma'ani wa-al-Asanid"
  ur: "التمہید لما فی الموطأ من المعانی والاسانید"
summary:
  ar: "كتاب ابن عبد البر القرطبي ⁦(ت 463هـ)⁩ في أحاديث «الموطأ» برواية يحيى بن يحيى الليثي: جمع فيه كل ما في الموطأ من حديث النبي مسنده ومنقطعه ومرسله، ورتّبه على أسماء شيوخ مالك على حروف المعجم، ووصل المرسل والمقطوع من غير طريق مالك، وشرح المعاني والأحكام وأقوال الفقهاء، فصار من أمهات الفقه المقارن؛ قال فيه ابن حزم إنه لا يعلم في الكلام على فقه الحديث مثله، وقضى مؤلفه في تنقيحه أكثر من ثلاثين سنة وترك منه إبرازتين {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {cite:tamhid-furqan-2017-v1 p. 41} {cite:wafayat-ayan p. 67}."
  en: "Ibn 'Abd al-Barr of Cordoba's (d. 463 AH) book on the hadiths of the Muwatta' in the recension of Yahya b. Yahya al-Laythi: it gathers every report from the Prophet in the Muwatta' — connected, broken and mursal — arranges them under Malik's teachers in alphabetical order, supplies connected chains from outside Malik's route, and expounds meanings, rulings and the jurists' views, so that it became a classic of comparative fiqh; Ibn Hazm said he knew nothing like it on the fiqh of hadith, and its author spent over thirty years revising it, leaving two recensions {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {cite:tamhid-furqan-2017-v1 p. 41} {cite:wafayat-ayan p. 67}."
  ur: "ابن عبد البر قرطبی ⁦(وفات 463ھ)⁩ کی کتاب جو یحییٰ بن یحییٰ لیثی کی روایتِ «موطأ» کی احادیث پر ہے: اس میں موطأ کی ہر نبوی روایت — مسند، منقطع اور مرسل — جمع کی گئی، امام مالک کے شیوخ کے ناموں پر حروفِ تہجی کی ترتیب سے مرتب کی گئی، مالک کے طریق کے باہر سے مرسل و مقطوع کو متصل سندوں سے جوڑا گیا، اور معانی، احکام اور فقہاء کے اقوال بیان کیے گئے، یوں یہ تقابلی فقہ کی بنیادی کتابوں میں شمار ہوئی؛ ابن حزم نے کہا کہ فقہ الحدیث پر وہ اس جیسی کوئی کتاب نہیں جانتے، اور مصنف نے تیس سال سے زیادہ اس کی تنقیح میں لگائے اور اس کے دو ابرازے ⁦(نسخے)⁩ چھوڑے {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {cite:tamhid-furqan-2017-v1 p. 41} {cite:wafayat-ayan p. 67}."
