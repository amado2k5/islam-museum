structure: "مقدمة المؤلف في خبر الواحد والمرسل والمسند والمنقطع والتدليس وشروط قبول الرواة (ط. الفرقان ج1 ص 191–257)، ثم أبواب شيوخ مالك على حروف المعجم بدءاً بباب الألف (إبراهيم بن عقبة، إسماعيل بن أبي حكيم، إسحاق بن عبد الله بن أبي طلحة، أيوب السختياني، أيوب بن حبيب…) (ج1 ص 258 وما بعدها)، وتحت كل شيخ ترجمته ثم أحاديثه مرقّمة («حديث أول…» مع بيان المسند والمرسل)، وتختم الأبواب بيحيى ويونس ويعقوب ثم الكنى ثم البلاغات (الطبعة المغربية، تصدير الجزء الأول، ص 5 من المسح)."
