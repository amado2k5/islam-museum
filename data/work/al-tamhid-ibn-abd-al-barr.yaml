label:
  ar: "التمهيد لما في الموطأ من المعاني والأسانيد"
  en: "al-Tamhid li-ma fi al-Muwatta' min al-Ma'ani wa-al-Asanid"
  ur: "التمہید لما فی الموطأ من المعانی والاسانید"
  tr: "Al-Muwatta'da Aktarım Anlamları ve Zincirlerine Giriş"
  id: "Pengantar Makna dan Rantai Transmisi di Al-Muwatta"
summary:
  ar: "كتاب ابن عبد البر القرطبي ⁦(ت 463هـ)⁩ في أحاديث «الموطأ» برواية يحيى بن يحيى الليثي: جمع فيه كل ما في الموطأ من حديث النبي مسنده ومنقطعه ومرسله، ورتّبه على أسماء شيوخ مالك على حروف المعجم، ووصل المرسل والمقطوع من غير طريق مالك، وشرح المعاني والأحكام وأقوال الفقهاء، فصار من أمهات الفقه المقارن؛ قال فيه ابن حزم إنه لا يعلم في الكلام على فقه الحديث مثله، وقضى مؤلفه في تنقيحه أكثر من ثلاثين سنة وترك منه إبرازتين {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {cite:tamhid-furqan-2017-v1 p. 41} {cite:wafayat-ayan p. 67}."
  en: "Ibn 'Abd al-Barr of Cordoba's (d. 463 AH) book on the hadiths of the Muwatta' in the recension of Yahya b. Yahya al-Laythi: it gathers every report from the Prophet in the Muwatta' — connected, broken and mursal — arranges them under Malik's teachers in alphabetical order, supplies connected chains from outside Malik's route, and expounds meanings, rulings and the jurists' views, so that it became a classic of comparative fiqh; Ibn Hazm said he knew nothing like it on the fiqh of hadith, and its author spent over thirty years revising it, leaving two recensions {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {cite:tamhid-furqan-2017-v1 p. 41} {cite:wafayat-ayan p. 67}."
  ur: "ابن عبد البر قرطبی ⁦(وفات 463ھ)⁩ کی کتاب جو یحییٰ بن یحییٰ لیثی کی روایتِ «موطأ» کی احادیث پر ہے: اس میں موطأ کی ہر نبوی روایت — مسند، منقطع اور مرسل — جمع کی گئی، امام مالک کے شیوخ کے ناموں پر حروفِ تہجی کی ترتیب سے مرتب کی گئی، مالک کے طریق کے باہر سے مرسل و مقطوع کو متصل سندوں سے جوڑا گیا، اور معانی، احکام اور فقہاء کے اقوال بیان کیے گئے، یوں یہ تقابلی فقہ کی بنیادی کتابوں میں شمار ہوئی؛ ابن حزم نے کہا کہ فقہ الحدیث پر وہ اس جیسی کوئی کتاب نہیں جانتے، اور مصنف نے تیس سال سے زیادہ اس کی تنقیح میں لگائے اور اس کے دو ابرازے ⁦(نسخے)⁩ چھوڑے {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {cite:tamhid-furqan-2017-v1 p. 41} {cite:wafayat-ayan p. 67}."
  es: "El libro de Ibn 'Abd al-Barr de Córdoba (m. 463 AH) sobre los hadices del Muwatta' en la recensión de Yahya b. Yahya al-Laythi: reúne todos los informes del Profeta en el Muwatta' —conectados, rotos y mursal— los organiza bajo los maestros de Malik en orden alfabético, proporciona cadenas conectadas de fuera de la ruta de Malik y expone significados, dictámenes y puntos de vista de los juristas, de modo que se convirtió en un clásico del fiqh comparativo; Ibn Hazm dijo que no conocía nada parecido sobre el fiqh del hadiz, y su autor pasó más de treinta años revisándolo, dejando dos recensiones {cite:tamhid-furqan-2017-v1 p. 199-200} {cite:tamhid-furqan-2017-v1 p. 16} {citar:tamhid-furqan-2017-v1 p. 41} {citar:wafayat-ayan p. 67}."
  fr: "L'ouvrage d'Ibn 'Abd al-Barr de Cordoue (mort en 463 AH) sur les hadiths du Muwatta', selon la recension de Yahya b. Yahya al-Laythi, rassemble tous les hadiths du Prophète rapportés dans le Muwatta' – qu'ils soient transmis de génération en génération, discontinus ou mursal –, les classe par ordre alphabétique selon les maîtres de Malik, fournit des chaînes de transmission continues provenant de sources extérieures à la voie de Malik et expose les significations, les règles et les avis des juristes. Devenu un classique du fiqh comparé, cet ouvrage est considéré comme une référence. Ibn Hazm affirmait n'avoir rien connu de comparable en matière de fiqh du hadith. Son auteur consacra plus de trente ans à sa révision, aboutissant à deux recensions. 41} {cite: wafayat-ayan p. 67}."
  tr: "İbn Abdülbarr el-Kurtubi'nin (ö. 463 H) kitabı, Yahya ibn Yahya al-Laythi'nin rivayetine göre \"Muwatta\"nın hadisleri üzerine şöyle bir kitapta: Orada Peygamber'in hadislerinden Muwatta'daki her şeyi toplar; zinciri, bağlantısı kopuk zinciri, kesik zinciri, mursalı, vericisi, duvarı ve majtusu Malik'in yolu olmadan birbirine bağlanmıştır ve hukukçuların anlamlarını, hükümlerini ve görüşlerini açıklayarak karşılaştırmalı fıkıhın temel alimlerinden biri olmuştur. İbn Hazm, hadis fıhhihi alanında benzer bir âlim kimsenin bilmediğini, yazarının otuz yıldan fazla bir süre boyunca hadis bilgisini geliştirip dışladığını söylemiştir İki öne çıkan {cite:tamhid-furqan-2017-v1 s. 199-200} {cite:tamhid-furqan-2017-v1 s. 16} {cite:tamhid-furqan-2017-v1 s. 41} {cite:wafayat-ayan s. 67}."
  id: "Kitab Ibn Abd al-Barr al-Qurtubi (wafat 463 H) tentang hadis \"Muwatta\" menurut riwayat Yahya ibn Yahya al-Laythi: Di dalamnya, ia mengumpulkan segala sesuatu dalam Muwatta' dari hadis Nabi, rantainya, rantai yang terputus, rantai yang terpotong, serta mursalnya, pemancarnya, serta mursal dan majtu' yang dihubungkan tanpa cara Malik, dan ia menjelaskan makna, keputusan, dan pendapat para ahli hukum, sehingga menjadi salah satu ulama dasar dalam fiksi komparatif. Ibn Hazm mengatakan bahwa tidak ada seorang pun yang mengetahui ulama serupa dalam bidang fiqhis hadis, dan penulisnya menghabiskan lebih dari tiga puluh tahun untuk menyempurnakannya dan meninggalkannya Dua sorotan {cite:tamhid-furqan-2017-v1 hlm. 199-200} {cite:tamhid-furqan-2017-v1 hlm. 16} {cite:tamhid-furqan-2017-v1 hlm. 41} {cite:wafayat-ayan hlm. 67}."
