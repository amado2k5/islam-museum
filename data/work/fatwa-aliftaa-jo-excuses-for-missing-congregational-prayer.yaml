id: work/fatwa-aliftaa-jo-excuses-for-missing-congregational-prayer
class: work
kind: fatwa
label: { ar: "الأعذار المرخصة لترك صلاة الجماعة في المسجد", en: "Excuses that permit missing congregational prayer in the mosque", ur: "مسجد میں جماعت چھوڑنے کی اجازت دینے والے اعذار" }
summary:
  ar: "سؤال عن الأعذار المرخصة لترك صلاة الجماعة في المسجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن ترك الجماعة يرخص فيه لأعذار عامة كالمطر الشاق والريح الشديدة ليلًا والوحل والحر والبرد الشديدين، ولأعذار خاصة كالمرض والجوع والخوف. أجابت الدائرة بأنه يرخص في ترك صلاة الجماعة في المسجد لأعذار عامة، مثل المطر الذي يشق معه الخروج، والريح الشديدة بالليل، والوحل الشديد الذي لا يؤمن معه التلوث، والريح الحارة، والحر والبرد الشديدين. وذكرت أعذارًا خاصة، مثل المرض الذي يشق معه المشي كمشقة المشي في المطر، وشدة النعاس، والجوع والعطش الظاهرين، ومدافعة البول أو الغائط أو الريح، وخوف الإنسان على نفسه أو عضو منه أو منفعة عضو أو ماله أو عرضه، وغير ذلك من الأعذار."
  en: "A question about excuses that permit missing congregational prayer in the mosque, in which Jordan's General Iftaa Department answered that missing congregation is permitted for general excuses such as hardship-causing rain, strong wind at night, mud, and severe heat or cold, and for personal excuses such as illness, hunger and fear. The Department answered that missing congregational prayer in the mosque is permitted for general excuses, such as rain that makes going out a hardship, strong wind at night, deep mud that would soil one, hot wind, and severe heat or cold. It listed personal excuses, such as illness that makes walking as hard as walking in rain, severe drowsiness, evident hunger and thirst, needing to relieve oneself or pass wind, and fear for one's life, a limb or its use, one's property or one's honour, among other excuses."
  ur: "مسجد میں جماعت چھوڑنے کی اجازت دینے والے اعذار کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جماعت چھوڑنے کی اجازت عمومی اعذار، جیسے مشقت والی بارش، رات کی تیز ہوا، کیچڑ اور شدید گرمی یا سردی، اور ذاتی اعذار، جیسے بیماری، بھوک اور خوف، کی وجہ سے ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد میں جماعت چھوڑنے کی اجازت عمومی اعذار کی وجہ سے ہے، جیسے ایسی بارش جس میں نکلنا مشقت ہو، رات کی تیز ہوا، ایسا گہرا کیچڑ جس سے آلودگی کا اندیشہ ہو، گرم ہوا، اور شدید گرمی یا سردی۔ اس نے ذاتی اعذار بھی ذکر کیے، جیسے ایسی بیماری جس میں چلنا بارش میں چلنے جیسا مشکل ہو، شدید اونگھ، ظاہری بھوک اور پیاس، پیشاب، پاخانہ یا ریح کا زور، اور اپنی جان، کسی عضو یا اس کی منفعت، مال یا عزت پر خوف، وغیرہ۔"
