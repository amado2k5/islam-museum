id: work/fatwa-amja-excuse-holders-pray-any
class: work
kind: fatwa
label: { ar: "أصحاب الأعذار يصلون به", en: "Excuse-holders — wudu at the time, then any prayers", ur: "عذر والے — وقت پر وضو پھر ہر نماز", es: "Los que tienen excusas: wudu en ese momento, luego cualquier oración.", fr: "Pour ceux qui sont dispensés d'abstinence, il faut faire les ablutions à ce moment-là, puis prier." }
summary:
  ar: "سأل سائل عن أصحاب الأعذار كسلس البول هل يستنجون ويتوضئون في آخر الوقت. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21935 بتاريخ 19 يوليو 2006)⁩ أن أصحاب الأعذار المتعلقة بالطهارة كسلس البول والريح ونحوه يتوضئون لوقت كل صلاة فإذا دخل وقت الصلاة توضئوا لها وصلوا بهذا الوضوء ما شاء الله لهم أن يصلوا إلى أن يخرج الوقت على ما فصّل الجواب."
  en: "A questioner asked whether excuse-holders like the urine-incontinent do istinja and wudu at the time's end. Dr. Salah al-Sawi (fatwa no. 21935, 19 July 2006) answered that holders of purity-excuses — incontinence of urine, wind and the like — do wudu for each prayer's time: when the time enters they do wudu for it, then by that wudu pray whatever God wills them to pray until the time exits — as the answer details."
  ur: "عذر والے کب وضو کریں؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21935، 19 جولائی 2006)⁩ کے مطابق وقت داخل ہوتے ہی وضو کر کے اس وقت کی ہر نماز پڑھیں۔"
  es: "Un consultante preguntó si quienes tienen excusas como la incontinencia urinaria realizan el istinja y el wudu al final del tiempo de oración. El Dr. Salah al-Sawi (fatwa n.° 21935, 19 de julio de 2006) respondió que quienes tienen excusas de pureza —incontinencia urinaria, flatulencia, etc.— realizan el wudu para cada tiempo de oración: cuando llega el momento, realizan el wudu y luego, con ese wudu, rezan lo que Dios les indique hasta que termine el tiempo, como se detalla en la respuesta."
  fr: "Un internaute a demandé si les personnes souffrant d'incontinence urinaire ou fécale devaient effectuer l'istinja et les ablutions (wudu) à la fin de l'heure de prière. Le Dr Salah al-Sawi (fatwa n° 21935, 19 juillet 2006) a répondu que celles qui souffrent d'incontinence (urine, flatulences, etc.) doivent faire leurs ablutions avant chaque prière: dès que l'heure arrive, elles font leurs ablutions, puis, avec ces ablutions, elles récitent la prière prescrite par Dieu jusqu'à la fin de l'heure, comme le précise la réponse."
