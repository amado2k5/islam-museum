label:
  ar: "موسوعة وقف الديانة التركي الإسلامية (TDV İslâm Ansiklopedisi)"
  en: "TDV İslâm Ansiklopedisi"
  ur: "ٹی ڈی وی اسلام انسائیکلوپیڈیا (TDV İslâm Ansiklopedisi)"
summary:
  ar: "موسوعة تركية في العلوم الإسلامية وثقافة الإسلام وحضارته وأعلامه وكتبه، أصدرها مركز البحوث الإسلامية التابع لوقف الديانة التركي في 44 مجلدًا بين 1988 و2013 ومجلدين ملحقين سنة 2016، بنحو 16,900 مادة كتبها أكثر من ألفي كاتب؛ محتواها كله متاح على موقعها للبحث والنسخ والتنزيل، ونالت الجائزة الكبرى للثقافة والفنون من رئاسة الجمهورية التركية سنة 2014."
  en: "A Turkish encyclopedia of the Islamic sciences and of Islamic culture, civilisation, figures and books, published by the Centre for Islamic Studies of the Türkiye Diyanet Foundation in 44 volumes from 1988 to 2013 and two supplementary volumes in 2016, with some 16,900 entries by more than two thousand authors; all of it can be searched, copied and downloaded on its website, and it received the Turkish Presidential Grand Prize for Culture and Arts in 2014."
  ur: "اسلامی علوم اور اسلامی ثقافت، تہذیب، شخصیات اور کتب کا ترکی انسائیکلوپیڈیا، ترکی وقفِ دیانت کے مرکزِ تحقیقاتِ اسلامی نے 1988 سے 2013 تک 44 جلدوں اور 2016 میں دو ضمیمہ جلدوں میں شائع کیا، دو ہزار سے زیادہ مصنفین کے تقریباً 16,900 مقالات؛ سب اس کی ویب سائٹ پر تلاش، نقل اور ڈاؤن لوڈ کے لیے دستیاب؛ 2014 میں ترک صدارتی ثقافت و فنون کا بڑا انعام۔"
