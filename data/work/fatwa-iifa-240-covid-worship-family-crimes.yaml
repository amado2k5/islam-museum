label: { ar: "قرار مجمع الفقه الإسلامي الدولي 240 (25/2) بشأن أثر جائحة كورونا على أحكام العبادات والأسرة والجنايات", en: "IIFA resolution 240 (25/2) on the effect of the COVID-19 pandemic on the rulings on worship, the family and offences", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 240 (25/2): کورونا وبا کے عبادات، خاندان اور جنايات کے احکام پر اثرات", es: "Resolución 240 (25/2) de la IIFA sobre el efecto de la pandemia de COVID-19 en las resoluciones sobre culto, familia y delitos.", fr: "Résolution 240 (25/2) de l'IIFA sur l'effet de la pandémie de COVID-19 sur les décisions relatives au culte, à la famille et aux infractions" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. عرّف المجمع الجائحة بأنها الوباء المنتشر على نطاق واسع، وقرر أن كوفيد-19 جائحة تطبق عليها أحكام الجوائح والأوبئة في الفقه الإسلامي. ومن أحكامها: لولي الأمر اتخاذ ما يمنع انتشارها كتعليق الجمع والجماعات والحج والعمرة ومنع التجوال وإغلاق المدارس؛ وجواز الصرف من الزكاة في شراء اللقاحات والأدوية والأجهزة الطبية للفقراء والمساكين والمؤلفة قلوبهم وتمويلها من الصدقات والهبات والأوقاف؛ وجواز تعجيل الزكاة عند قيام الداعي ودفعها لمن عجز عن نفقات العلاج ولفاقدي أعمالهم بسبب الجائحة؛ ووجوب غسل المتوفى بكورونا وتكفينه وتشييعه والصلاة عليه ودفنه مع الإجراءات الاحترازية، والتيمم عند تعذر الغسل، وحرمة حرق الجثة؛ وأن تشييعه والصلاة عليه بحسب الاستطاعة بما لا يضر الأصحاء؛ وأن تعمد نشر الفيروس على الأصحاء جناية يعاقب فاعلها. واستند إلى توصيات ندوتين عقدتهما الأمانة عامي 1441هـ و1442هـ، وأشاد بفتاوى الهيئات والمجالس الشرعية في الدول الأعضاء."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). It defined a pandemic as an epidemic spreading over wide adjoining areas affecting many people, and ruled that COVID-19 is a pandemic to which the fiqh rulings on epidemics apply. Among its rulings: the ruler may take measures preventing its spread — suspending Friday and congregational prayers, Hajj and Umrah, curfews and school closures; zakat funds may be spent on vaccines, medicines and medical devices for the poor, the needy and those whose hearts are to be reconciled, and funded through charity, gifts and awqaf; zakat may be paid early when needed and given to those unable to afford treatment and to workers who lost their jobs; the deceased must be washed, shrouded, carried, prayed over and buried with health precautions, tayammum replacing washing if impossible, and cremation is forbidden; the funeral and prayer are according to ability without harm to the healthy; and deliberately spreading the virus on the healthy is an offence punishable accordingly. It drew on two General Secretariat seminars of 1441 and 1442 and commended the fatwas of member states' sharia bodies."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے وبا کی تعریف وسیع علاقوں میں پھیلنے والی بیماری کے طور پر کی اور فیصلہ کیا کہ کوفڈ-19 وبا ہے جس پر فقہِ اسلامی میں اوبہ و امراض کے احکام لاگو ہوتے ہیں۔ احکام میں: والیِ امر کے لیے پھیلاؤ روکنے کے اقدامات — جمعہ و جماعتوں، حج و عمرہ کی معطلی، گشت کی ممانعت، اسکولوں کی بندش؛ زکوٰۃ سے غریبوں، مساکین اور مؤلفۂ قلوب کے لیے ویکسین، ادویات اور طبی آلات کی خرید اور صدقات، ہبات اور اوقاف سے مالی معاونت؛ ضرورت پر زکوٰۃ کی جلد ادائیگی اور علاج کے ناداروں اور بے روزگاروں کو دینا؛ متوفی کا غسل، کفن، تشیید، نمازِ جنازہ اور دفن احتیاطی تدابیر کے ساتھ، غسل نہ ہو سکے تو تیمم، اور جلانا حرام؛ تشیید و نماز استطاعت کے مطابق بغیر صحتمندوں کو نقصان کے؛ اور دانستہ وائرس پھیلانا جرم ہے جس کا فاعل سزا پائے گا۔ اکیڈمی نے جنرل سیکرٹریٹ کے 1441ھ اور 1442ھ کے دو سیمینارز کی سفارشات کی بنیاد لی اور رکن ممالک کے شرعی اداروں کے فتاوى کی ستائش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Fiqh Islámico en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023). Definió una pandemia como una epidemia que se propaga por amplias áreas adyacentes que afectan a muchas personas, y dictaminó que la COVID-19 es una pandemia a la que se aplican las normas del fiqh sobre epidemias. Entre sus resoluciones: el gobernante puede tomar medidas para prevenir su propagación, suspendiendo las oraciones del viernes y las congregaciones, el Hajj y la Umrah, los toques de queda y el cierre de escuelas; los fondos del zakat pueden gastarse en vacunas, medicamentos y dispositivos médicos para los pobres, los necesitados y aquellos cuyos corazones deben reconciliarse, y financiados a través de la caridad, los regalos y el awqaf; el zakat puede pagarse por adelantado cuando sea necesario y entregarse a aquellos que no pueden costear el tratamiento y a los trabajadores que perdieron sus empleos; el difunto debe ser lavado, amortajado, llevado, rezado y enterrado con precauciones sanitarias, el tayammum reemplazando el lavado si es imposible, y la cremación está prohibida; El funeral y la oración se realizan según las posibilidades de cada uno, sin perjudicar a los sanos; y propagar deliberadamente el virus entre personas sanas constituye un delito punible en consecuencia. Se basó en dos seminarios de la Secretaría General de 1441 y 1442 y elogió las fatuas de los órganos de la sharia de los Estados miembros."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023). Elle définit une pandémie comme une épidémie se propageant sur de vastes zones contiguës et affectant un grand nombre de personnes, et statue que la COVID-19 est une pandémie à laquelle s'appliquent les règles de jurisprudence islamique (fiqh) relatives aux épidémies. Parmi ses décisions: le souverain peut prendre des mesures pour prévenir sa propagation – suspension des prières du vendredi et des prières en congrégation, du Hajj et de la Omra, couvre-feux et fermeture des écoles; les fonds de la zakat peuvent être utilisés pour l'achat de vaccins, de médicaments et de dispositifs médicaux destinés aux pauvres, aux nécessiteux et à ceux dont les cœurs doivent être réconciliés, et financés par des dons, des aumônes et des waqfs; la zakat peut être versée par anticipation en cas de besoin et distribuée aux personnes n'ayant pas les moyens de se faire soigner et aux travailleurs ayant perdu leur emploi; le défunt doit être lavé, enveloppé dans un linceul, transporté, faire l'objet d'une prière et enterré en respectant les précautions sanitaires, le tayammum remplaçant la toilette mortuaire si celle-ci est impossible, et la crémation est interdite. Les funérailles et la prière se déroulent selon les capacités de chacun, sans nuire aux personnes saines; la propagation délibérée du virus parmi les personnes saines constitue une infraction punissable en conséquence. Ce document s’appuie sur deux séminaires du Secrétariat général de 1441 et 1442 et approuve les fatwas des instances de la charia des États membres."
