id: work/fatwa-amja-touching-member-disputed
class: work
kind: fatwa
label: { ar: "مس الذكر في المذهب", en: "Touching the member — a madhhab dispute, per Ibn Qudama", ur: "عضو کا چھونا — اختلافی مسئلہ", es: "Tocar al miembro: una disputa madhab, según Ibn Qudama", fr: "Toucher le membre – un conflit de madhhab, selon Ibn Qudama" }
summary:
  ar: "سأل سائل عن مس الذكر هل ينقض الوضوء وذكر أقوال الصحابة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21957 بتاريخ 5 نوفمبر 2007)⁩ أن انتقاض الوضوء بمس الذكر من مسائل الخلاف بين أهل العلم وقد ذكر هذا الخلاف كثير من الفقهاء ناقلًا منهم كلام ابن قدامة في المغني حيث ذكر الأقوال وروايات أحمد على ما فصّل الجواب."
  en: "A questioner asked whether touching the member breaks wudu, citing Companions' positions. Dr. Salah al-Sawi (fatwa no. 21957, 5 November 2007) answered that the wudu's breaking on touching the member is among the scholars' disputed questions — many jurists have set out the difference; he transmits Ibn Qudama's words in al-Mughni, where the positions and Ahmad's narrations are given — as the answer details."
  ur: "عضو چھونے سے وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21957، 5 نومبر 2007)⁩ کے مطابق اختلافی مسئلہ ہے — ابن قدامہ کے اقوال نقل ہوئے۔"
  es: "Un interlocutor preguntó si tocar el miembro invalida la ablución (wudu), citando las posturas de los Compañeros. El Dr. Salah al-Sawi (fatwa n.º 21957, 5 de noviembre de 2007) respondió que la invalidez de la ablución al tocar el miembro es una de las cuestiones controvertidas entre los eruditos; muchos juristas han expuesto la diferencia. Él transmite las palabras de Ibn Qudama en al-Mughni, donde se exponen las posturas y las narraciones de Ahmad, como se detalla en la respuesta."
  fr: "Un internaute a demandé si le fait de toucher le pénis annulait les ablutions (wudu), en citant l'avis des Compagnons. Le Dr Salah al-Sawi (fatwa n° 21957, 5 novembre 2007) a répondu que la question de l'annulation des ablutions par le simple fait de toucher le pénis figurait parmi les points controversés des savants – de nombreux juristes ayant exposé les divergences –, et il rapporte les propos d'Ibn Qudama dans al-Mughni, où sont exposés les différents avis et les hadiths rapportés par Ahmad, comme il le précise dans sa réponse."
