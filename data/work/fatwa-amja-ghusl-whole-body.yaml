id: work/fatwa-amja-ghusl-whole-body
class: work
kind: fatwa
label: { ar: "غسل الجنابة تعميمًا", en: "The janaba washing — water over the whole body", ur: "غسل جنابت — پورے جسم پر پانی" }
summary:
  ar: "سأل سائل هل يجب في الجنابة غسل الجسم كاملًا من الرأس إلى القدمين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79811 بتاريخ 29 أغسطس 2009)⁩ أن الغسل المجزئ في الجنابة هو تعميم الجسد كله بالماء وليس مجرد غسل المنطقة بالماء والصابون كما ذكر وإن أراد الغسل الكامل فليبدأ بالاستنجاء ثم يتوضأ وضوءه للصلاة ثم يفيض الماء على رأسه ثلاثًا ثم على جسده على ما فصّل الجواب."
  en: "A questioner asked whether janaba requires washing the whole body head to foot. Dr. Salah al-Sawi (fatwa no. 79811, 29 August 2009) answered that the adequate janaba-washing is covering the entire body with water — not merely washing the area with water and soap as he described; for the complete washing he begins with istinja, does his prayer-wudu, pours water on his head thrice, then over his body — as the answer details."
  ur: "جنابت میں پورا جسم دھونا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79811، 29 اگست 2009)⁩ کے مطابق کامل غسل میں سارے جسم پر پانی بہانا ضروری ہے۔"
