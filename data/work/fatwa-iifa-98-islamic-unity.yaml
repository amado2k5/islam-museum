label: { ar: "قرار مجمع الفقه الإسلامي الدولي 98 (11/1) بشأن الوحدة الإسلامية", en: "IIFA resolution 98 (11/1) on Islamic unity", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 98 (11/1): اسلامی وحدت" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. اعتبر الموضوع من أهم ما تحتاج الأمة إلى بحثه نظريًا وعمليًا، والعمل على توحيدها فكريًا وتشريعيًا وسياسيًا وشدها إلى عقيدة التوحيد من أهم أهداف المجمع. قرر أن الوحدة الإسلامية واجب أمر الله به وجعله وصفًا لازمًا للأمة، مستشهدًا بآيات الاعتصام بحبل الله ووحدة الأمة وبنصوص السنة ⁦(كحديث تكافؤ دماء المسلمين)⁩ وأعمالها، ثم ساق وسائل تحقيق الوحدة وضوابطها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It regarded the subject as among the most important the umma needs studied, and unifying it intellectually, legislatively and politically and binding it to pure monotheism among the Academy's chief aims. It ruled that Islamic unity is a duty God commanded and made an essential attribute of the umma, citing the verses on holding fast to God's rope and the umma's oneness and the sunna's texts (such as the hadith that Muslims' blood is equal) and practice, then set out the means to achieve unity and its controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ اس نے موضوع کو امت کے لیے تحقیق کا اہم ترین میدان قرار دیا اور اس کی فکری، تشریعی اور سیاسی وحدت اور خالص توحید سے اس کا باندھنا اکیڈمی کے اہم مقاصد میں شمار کیا۔ فیصلہ: اسلامی وحدت اللہ کا حکم اور امت کی لازم صفت ہے — اللہ کی رسی کو مضبوطی سے تھامنے اور امت کے یکجا ہونے کی آیات اور سنت کی نصوص ⁦(جیسے مسلمانوں کے خون کے برابر ہونے کی حدیث)⁩ اور عمل کی استناد پر۔ پھر وحدت حاصل کرنے کے ذرائع اور ضوابط۔"
