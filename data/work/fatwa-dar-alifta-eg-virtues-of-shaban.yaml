id: work/fatwa-dar-alifta-eg-virtues-of-shaban
class: work
kind: fatwa
label: { ar: "فضائل شهر شعبان", en: "The virtues of the month of Sha'ban", ur: "مہینۂ شعبان کے فضائل", es: "Las virtudes del mes de Sha'ban", fr: "Les vertus du mois de Sha'ban" }
summary:
  ar: "سائل سأل عن فضائل شهر شعبان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22464)⁩ أن شعبان من الأشهر المباركة التي قد يغفل عن فضلها بعض الناس، وأن الله اختصه بمزيد فضل وتشريف، وذكر الجواب ما ورد فيه من الفضائل على وجه التفصيل."
  en: "A questioner asked about the virtues of Sha'ban. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22464) answered that Sha'ban is among the blessed months whose merit some people neglect, and that God singled it out for added favour and honour; the answer sets out what has been reported of its virtues in detail."
  ur: "ایک سائل نے شعبان کے فضائل پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22464)⁩ نے جواب دیا کہ شعبان مبارک مہینوں میں ہے جس کے فضل سے بعض لوگ غافل ہیں، اور اللہ نے اسے مزید فضل اور عزت سے مخصوص کیا؛ جواب میں اس کے فضائل کی تفصیل بیان ہوئی۔"
  es: "Un consultante preguntó acerca de las virtudes de Sha'ban. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22464) respondió que Sha'ban se encuentra entre los meses benditos cuyos méritos algunas personas descuidan, y que Dios lo destacó para otorgarle mayor favor y honor; la respuesta detalla lo que se ha informado sobre sus virtudes."
  fr: "Un internaute a posé une question sur les vertus du mois de Sha'ban. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22464) a répondu que Sha'ban compte parmi les mois bénis dont certains négligent le mérite, et que Dieu l'a particulièrement favorisé et honoré; la réponse expose en détail les vertus qui lui sont attribuées."
