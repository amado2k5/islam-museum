summary:
  ar: "كتاب ابن الأثير الجزري في أسماء الصحابة؛ وصفه صاحب التجريد بأنه نفيس مستقصى لأسماء الصحابة الذين ذكروا في الكتب الأربعة المصنفة في معرفة الصحابة — كتاب ابن منده وكتاب أبي نعيم وكتاب أبي موسى الأصبهانيين وهو ذيل كتاب ابن منده وكتاب ابن عبد البر — مع زيادة المؤلف عليهم، وجعل علامة ⁦(د)⁩ لابن منده و⁦(ع)⁩ لأبي نعيم و⁦(ب)⁩ لابن عبد البر و⁦(س)⁩ لأبي موسى {cite:kashf-zunun-furqan p. 398}."
  en: "Ibn al-Athir al-Jazari's compendium of Companion names — 'a precious and exhaustive work' drawing on the four earlier books of Companions (Ibn Manda, Abu Nu'aym, Abu Musa's continuation, and Ibn Abd al-Barr), marking each entry with a siglum for its source {cite:kashf-zunun-furqan p. 398}."
  es: "El compendio de nombres de Compañeros de Ibn al-Athir al-Jazari — 'una obra preciosa y exhaustiva' que se basa en los cuatro libros anteriores de Compañeros (Ibn Manda, Abu Nu'aym, la continuación de Abu Musa e Ibn Abd al-Barr), marcando cada entrada con un siglum para su fuente {cite:kashf-zunun-furqan p. 398}."
  fr: "Le recueil des noms des Compagnons d'Ibn al-Athir al-Jazari — « une œuvre précieuse et exhaustive » s'appuyant sur les quatre livres antérieurs des Compagnons (Ibn Manda, Abu Nu'aym, la continuation d'Abu Musa et Ibn Abd al-Barr), marquant chaque entrée d'un sigle pour sa source {cite:kashf-zunun-furqan p. 398}."
  ur: "ابن اثیر الجزری کا صحابہ کے ناموں کا مجموعہ - 'ایک قیمتی اور مکمل کام' صحابہ کی چار سابقہ کتابوں ⁦(ابن مندہ، ابو نعیم، ابو موسیٰ کا تسلسل، اور ابن عبد البر)⁩ پر نقش ہے، ہر اندراج کو اس کے صیغہ کے لیے نشان زد کرتے ہوئے: pc. 398}۔"
  tr: "İbn el-Athir el-Cezeri'nin Sahabelerin isimleri üzerine kitabı; soyutlamanın yazarı, bu kitabı Sahabelerin bilgisi üzerine derlenen dört kitapta — İbn Manda kitabı, Ebu Nu'eym kitabı ve İbn Manda ile İbn Abdübülbarr kitabına ek olan Ebu Musa el-İsfahaniyin kitabı — ve yazarın ekleriyle birlikte Sahabelerin isimlerinin değerli ve kapsamlı bir derlemesi olarak tanımlamıştır ve (D) İbn Manda için, (A) Ebu Nu'eym, (B) İbn Abdülbarr ve (S) Ebu Musa için işaretler koymuştur {atıf:kaşf-zunun-furqan, s. 398}."
  id: "Kitab Ibn al-Athir al-Jazari tentang nama-nama Para Sahabat; penulis abstraksi menggambarkannya sebagai kumpulan nama Sahabat yang berharga dan komprehensif yang disebutkan dalam empat buku kompilasi tentang pengetahuan Para Sahabat — kitab Ibn Manda, kitab Abu Nu'aym, dan kitab Abu Musa al-Isfahaniyyin, yang merupakan suplemen untuk kitab Ibn Manda dan kitab Ibn Abd al-Barr — dengan tambahan penulis, dan ia menempatkan tanda (D) untuk Ibn Manda, (A) untuk Abu Nu'aym, (B) untuk Ibn Abd al-Barr, dan (S) untuk Abu Musa {cite:kashf-zunun-furqan, hlm. 398}."
