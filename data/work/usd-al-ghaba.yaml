summary:
  ar: "كتاب ابن الأثير الجزري في أسماء الصحابة؛ وصفه صاحب التجريد بأنه نفيس مستقصى لأسماء الصحابة الذين ذكروا في الكتب الأربعة المصنفة في معرفة الصحابة — كتاب ابن منده وكتاب أبي نعيم وكتاب أبي موسى الأصبهانيين وهو ذيل كتاب ابن منده وكتاب ابن عبد البر — مع زيادة المؤلف عليهم، وجعل علامة (د) لابن منده و(ع) لأبي نعيم و(ب) لابن عبد البر و(س) لأبي موسى {cite:kashf-zunun-furqan p. 398}."
  en: "Ibn al-Athir al-Jazari's compendium of Companion names — 'a precious and exhaustive work' drawing on the four earlier books of Companions (Ibn Manda, Abu Nu'aym, Abu Musa's continuation, and Ibn Abd al-Barr), marking each entry with a siglum for its source {cite:kashf-zunun-furqan p. 398}."
