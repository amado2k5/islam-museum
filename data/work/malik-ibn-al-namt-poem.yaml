label: { ar: "قصيدة مالك بن النمط «ذكرت رسول الله في فحمة الدجى»", en: "Malik ibn al-Namat's poem 'I remembered the Messenger of God in the blackness of night'", es: "El poema de Malik ibn al-Namat, 'Recordé al Mensajero de Dios en la oscuridad de la noche'.", fr: "Le poème de Malik ibn al-Namat « Je me suis souvenu du Messager de Dieu dans l'obscurité de la nuit »" }
summary:
  ar: "قصيدة على روي الدال قالها مالك بن النمط الهمداني بعد كتاب النبي لهمدان: يذكر رسول الله في فحمة الدجى وهو بأعلى رحرحان وصلدد والإبل تسير بركبانها في طريق بيّن، ويحلف برب الراقصات إلى منى أن رسول الله فيهم مصدَّق، رسول أتى من عند ذي العرش مهتدٍ، ما حملت ناقة فوق رحلها أشد على أعدائه من محمد ولا أعطى إذا جاءه طالب العرف. ومعها رجزان قيلا عند القدوم."
  en: "A dal-rhymed poem Malik ibn al-Namat al-Hamdani composed after the Prophet's letter to Hamdan: he remembered the Messenger of God in the blackness of night at the heights of Rahrahan and Saldad as the camels carried their riders along a clear road, and swore by the Lord of the camels pacing to Mina that the Messenger of God among them was believed, a messenger come guided from the Lord of the Throne; no camel ever bore on its saddle one harder on his enemies than Muhammad nor more generous when a seeker of favour came. Two rajaz chants said on arrival go with it."
  es: "Un poema con rima dal que Malik ibn al-Namat al-Hamdani compuso después de la carta del Profeta a Hamdan: recordó al Mensajero de Dios en la oscuridad de la noche en las alturas de Rahrahan y Saldad mientras los camellos llevaban a sus jinetes por un camino despejado, y juró por el Señor de los camellos que caminaban hacia Mina que el Mensajero de Dios entre ellos era creído, un mensajero venido guiado por el Señor del Trono; ningún camello jamás cargó sobre su silla a uno más duro con sus enemigos que Muhammad ni más generoso cuando llegó un buscador de favor. Dos cánticos rajaz que se dijeron al llegar, ve con él."
  fr: "Un poème en rimes dal, composé par Malik ibn al-Namat al-Hamdani après la lettre du Prophète à Hamdan: il se souvenait du Messager de Dieu dans l’obscurité de la nuit, sur les hauteurs de Rahrahan et de Saldad, tandis que les chameaux transportaient leurs cavaliers sur une route dégagée. Il jura par le Seigneur des chameaux, en route vers Mina, que le Messager de Dieu parmi eux était digne de foi, un messager venu guidé par le Seigneur du Trône; aucun chameau n’a jamais porté sur sa selle un homme plus cruel envers ses ennemis que Muhammad, ni plus généreux envers celui qui recherchait sa faveur. Deux chants rajaz, récités à l’arrivée, l’accompagnent."
