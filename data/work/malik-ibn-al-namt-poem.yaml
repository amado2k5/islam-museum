label: { ar: "قصيدة مالك بن النمط «ذكرت رسول الله في فحمة الدجى»", en: "Malik ibn al-Namat's poem 'I remembered the Messenger of God in the blackness of night'" }
summary:
  ar: "قصيدة على روي الدال قالها مالك بن النمط الهمداني بعد كتاب النبي لهمدان: يذكر رسول الله في فحمة الدجى وهو بأعلى رحرحان وصلدد والإبل تسير بركبانها في طريق بيّن، ويحلف برب الراقصات إلى منى أن رسول الله فيهم مصدَّق، رسول أتى من عند ذي العرش مهتدٍ، ما حملت ناقة فوق رحلها أشد على أعدائه من محمد ولا أعطى إذا جاءه طالب العرف. ومعها رجزان قيلا عند القدوم."
  en: "A dal-rhymed poem Malik ibn al-Namat al-Hamdani composed after the Prophet's letter to Hamdan: he remembered the Messenger of God in the blackness of night at the heights of Rahrahan and Saldad as the camels carried their riders along a clear road, and swore by the Lord of the camels pacing to Mina that the Messenger of God among them was believed, a messenger come guided from the Lord of the Throne; no camel ever bore on its saddle one harder on his enemies than Muhammad nor more generous when a seeker of favour came. Two rajaz chants said on arrival go with it."
