label: { ar: "قصيدة مالك بن النمط «ذكرت رسول الله في فحمة الدجى»", en: "Malik ibn al-Namat's poem 'I remembered the Messenger of God in the blackness of night'", es: "El poema de Malik ibn al-Namat, 'Recordé al Mensajero de Dios en la oscuridad de la noche'.", fr: "Le poème de Malik ibn al-Namat « Je me suis souvenu du Messager de Dieu dans l'obscurité de la nuit »", ur: "مالک بن النمعت کی نظم 'میں نے رات کی تاریکی میں رسول اللہ کو یاد کیا'", tr: "Malik ibn al-Ninawab'ın şiiri: 'Karanlık kömürde Allah'ın Elçisi'ni hatırladım'", id: "Puisi Malik ibn al-Ninawab: 'Aku mengingat Rasul Allah dalam arang kegelapan'" }
summary:
  ar: "قصيدة على روي الدال قالها مالك بن النمط الهمداني بعد كتاب النبي لهمدان: يذكر رسول الله في فحمة الدجى وهو بأعلى رحرحان وصلدد والإبل تسير بركبانها في طريق بيّن، ويحلف برب الراقصات إلى منى أن رسول الله فيهم مصدَّق، رسول أتى من عند ذي العرش مهتدٍ، ما حملت ناقة فوق رحلها أشد على أعدائه من محمد ولا أعطى إذا جاءه طالب العرف. ومعها رجزان قيلا عند القدوم."
  en: "A dal-rhymed poem Malik ibn al-Namat al-Hamdani composed after the Prophet's letter to Hamdan: he remembered the Messenger of God in the blackness of night at the heights of Rahrahan and Saldad as the camels carried their riders along a clear road, and swore by the Lord of the camels pacing to Mina that the Messenger of God among them was believed, a messenger come guided from the Lord of the Throne; no camel ever bore on its saddle one harder on his enemies than Muhammad nor more generous when a seeker of favour came. Two rajaz chants said on arrival go with it."
  es: "Un poema con rima dal que Malik ibn al-Namat al-Hamdani compuso después de la carta del Profeta a Hamdan: recordó al Mensajero de Dios en la oscuridad de la noche en las alturas de Rahrahan y Saldad mientras los camellos llevaban a sus jinetes por un camino despejado, y juró por el Señor de los camellos que caminaban hacia Mina que el Mensajero de Dios entre ellos era creído, un mensajero venido guiado por el Señor del Trono; ningún camello jamás cargó sobre su silla a uno más duro con sus enemigos que Muhammad ni más generoso cuando llegó un buscador de favor. Dos cánticos rajaz que se dijeron al llegar, ve con él."
  fr: "Un poème en rimes dal, composé par Malik ibn al-Namat al-Hamdani après la lettre du Prophète à Hamdan: il se souvenait du Messager de Dieu dans l’obscurité de la nuit, sur les hauteurs de Rahrahan et de Saldad, tandis que les chameaux transportaient leurs cavaliers sur une route dégagée. Il jura par le Seigneur des chameaux, en route vers Mina, que le Messager de Dieu parmi eux était digne de foi, un messager venu guidé par le Seigneur du Trône; aucun chameau n’a jamais porté sur sa selle un homme plus cruel envers ses ennemis que Muhammad, ni plus généreux envers celui qui recherchait sa faveur. Deux chants rajaz, récités à l’arrivée, l’accompagnent."
  ur: "مالک بن النمعت ہمدانی نے ہمدان کے نام رسول اللہ کے خط کے بعد لکھی ایک دال والی نظم: انہوں نے رات کی تاریکی میں رہحان اور سلاد کی بلندیوں پر رسول اللہ کو یاد کیا جب اونٹ اپنے سواروں کو ایک صاف راستے پر لے جا رہے تھے، اور اونٹوں کے رب کی قسم کھا کر منیٰ کی طرف روانہ ہوئے کہ ان کے درمیان رب کے رسول پر ایمان لایا گیا تھا۔ تخت؛ اپنے دشمنوں پر محمد سے زیادہ سخت کوئی اونٹ اپنی زین پر نہیں چڑھا اور نہ ہی اس سے زیادہ سخی جب کوئی احسان مانگنے والا آئے۔ دو رجز نے کہا کہ آتے ہی اس کے ساتھ چلو۔"
  tr: "Peygamber'in Hamdan'a yazdığı mektuptan sonra Malik bin al-Ninag al-Hamdani tarafından okunan 'dal' rivayetine göre bir şiir: Allah'ın Elçisi, Rahhan ve Saddad'ın en tepesindeyken karanlık kömürde anılır, develer açık bir yolda binerler ve dansçıların Rab'ı adına Mina'ya yemin eder ki, Allah'ın Elçisi aralarında Taht Efbi'nden gelen bir elçidir, bu elçi Muhammed'den daha güçlü bir dişi deve taşımamıştır, bir adet arayan geldiğinde de vermemiştir. Ve yanında varışta denilen bir 'Rajzan' vardı."
  id: "Sebuah puisi menurut riwayat 'dal' yang dibacakan oleh Malik ibn al-Ninagh al-Hamdani setelah surat Nabi kepada Hamdan: Rasulullah disebutkan dalam arang kegelapan saat ia berada di puncak Rahrhan dan Saddad, dan unta-unta menunggang kuda mereka di jalan yang jelas, dan ia bersumpah demi Tuhan para penari kepada Mina bahwa Rasulullah menegaskan di antara mereka, seorang utusan yang datang dari Tuhan Takhta yang dipandu, yang tidak membawa unta betina di atas tunggangannya lebih kuat dari musuh-musuhnya daripada Muhammad, dan tidak memberikan ketika pencari adat datang kepadanya. Dan bersamanya ada seorang 'Rajzan' seperti yang dikatakan saat tiba."
