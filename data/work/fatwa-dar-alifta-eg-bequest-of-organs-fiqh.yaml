label: { ar: "تكييف الوصية بالأعضاء فقهًا", en: "The juristic characterisation of bequeathing one's organs", ur: "اعضا کی وصیت کی فقہی تکییف", es: "La caracterización jurídica de la donación de órganos", fr: "La qualification juridique du legs d'organes", tr: "Vasiyetin Üyelere Uyarlanması İçtihatta", id: "Menyesuaikan Wasiat kepada Anggota dalam Yurisprudensi" }
summary:
  ar: "سائل سأل عن تكييف الوصية بالأعضاء فقهًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21647)⁩ أن التبرع بالأعضاء جائز شرعًا إذا روعيت ضوابطه الشرعية ومحدداته القانونية التي تقوم على تحقق موت المنقول منه على ما فصّل الجواب."
  en: "A questioner asked how the jurists characterise bequeathing one's organs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21647) answered that donating organs is lawful when its legal controls and specifications are observed — resting on the confirmed death of the donor — as the answer details."
  ur: "ایک سائل نے اعضا کی وصیت کی فقہی حیثیت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21647)⁩ نے جواب دیا کہ اعضا کا عطیہ شرعی ضوابط کی رعایت کے ساتھ جائز ہے جن میں عطیہ دہندہ کی وفات کی تصدیق شامل ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó cómo caracterizan los juristas la donación de órganos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21647) respondió que la donación de órganos es lícita cuando se cumplen sus normas y especificaciones legales, siempre que se confirme el fallecimiento del donante, como se detalla en la respuesta."
  fr: "Un internaute a demandé comment les juristes qualifient le don d'organes. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21647) a répondu que le don d'organes est licite lorsque les conditions et les modalités légales sont respectées, notamment le décès confirmé du donneur, comme le précise la réponse."
  tr: "Bir soru soran kişi, organlarla ilgili vasiyetnamenin sınıflandırılmasının fıkıhatı hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21647), organ bağışının, İslam hukukuna göre dini kontroller ve nakledilen kişinin ölümüne dayalı yasal belirleyicilerin gözetilmesi koşuluyla izin verilebilir olduğunu yanıtladı; bu durum yanıtta detaylandırıldı."
  id: "Seorang penanya menanyakan tentang yurisprudensi dalam mengklasifikasikan surat wasiat terkait organ. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21647) menjawab bahwa donasi organ diperbolehkan menurut hukum Islam asalkan kontrol agama dan penentu hukumnya berdasarkan kematian orang yang dipindahkan dipatuhi, sebagaimana dijelaskan dalam jawaban."
