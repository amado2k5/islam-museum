id: work/fatwa-amja-small-trace-under-nail
class: work
kind: fatwa
label: { ar: "اليسير معفو عنه", en: "A small dark trace under the nail — the little is pardoned", ur: "ناخن تلے ذرا سا نشان — معاف", es: "Una pequeña mancha oscura bajo la uña: lo poco se perdona.", fr: "Une petite trace sombre sous l'ongle — on pardonne ce petit détail." }
summary:
  ar: "سأل سائل أنه يجد نقطة أو منطقة صغيرة داكنة تحت أحد أظافره أو بعضها نتيجة حكة لجلده. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21959 بتاريخ 17 ديسمبر 2007)⁩ ألا يلتفت إلى ذلك فإن اليسير معفو عنه في الشريعة على ما فصّل الجواب."
  en: "A questioner finds a small dark spot under one or some nails from scratching his skin. Dr. Salah al-Sawi (fatwa no. 21959, 17 December 2007) answered that he pays it no heed — the little is pardoned in the sharia — as the answer details."
  ur: "ناخن تلے چھوٹا نشان؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21959، 17 دسمبر 2007)⁩ کے مطابق تھوڑی سی چیز معاف ہے — التفات نہ کرے۔"
  es: "Un consultante encuentra una pequeña mancha oscura debajo de una o varias uñas debido a que se rasca la piel. El Dr. Salah al-Sawi (fatwa n.° 21959, 17 de diciembre de 2007) respondió que no le presta atención, ya que la sharia perdona las pequeñas faltas, como se detalla en la respuesta."
  fr: "Un homme remarque une petite tache sombre sous un ou plusieurs ongles, suite à un grattage. Le Dr Salah al-Sawi (fatwa n° 21959, 17 décembre 2007) répond qu'il n'y prête pas attention: ce qui est peu toléré par la charia, comme le précise la réponse."
