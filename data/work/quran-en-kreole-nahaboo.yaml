label: { ar: "القرآن بالكريولية الموريشيوسية مع النص العربي ⁦(حسين ناهابو)⁩", en: "Quran en kreole ek tex arab (Houssein Nahaboo)", ur: "قرآن ماریشیائی کریول میں مع عربی متن ⁦(حسین ناہابو)⁩" }
summary:
  ar: "ترجمة لمعاني القرآن إلى الكريولية الموريشيوسية، لغة الحياة اليومية في موريشيوس، وضعها طبيب الأسنان حسين ناهابو في خمس سنوات، ونشرتها حركة الطلاب الإسلامية وحركة النساء الإسلامية في بور لويس على أجزاء ابتداءً من سنة 1983، مع النص العربي في عمودين؛ كتبها بكريولية متأثرة بالإملاء الفرنسي لتكون في متناول القرّاء، ولا حواشي فيها، ثم أتبعها بترجمتين إنجليزية وفرنسية."
  en: "A rendering of the meanings of the Qur'an into Mauritian Creole, the everyday language of Mauritius, by the dentist Houssein Nahaboo, the work of five years, published in instalments from 1983 by the Islamic Students Movement and the Islamic Women's Movement in Port Louis, with the Arabic text in two columns; written in a Creole using French spelling to make it accessible to readers and without notes, it was followed by his English and French translations."
  ur: "ماریشس کی روزمرہ زبان ماریشیائی کریول میں قرآن کے معانی کا ترجمہ، از دندان ساز حسین ناہابو، پانچ سال کی محنت، جو 1983 سے پورٹ لوئس میں اسلامک اسٹوڈنٹس موومنٹ اور اسلامک ویمنز موومنٹ نے قسطوں میں شائع کیا، دو کالموں میں عربی متن کے ساتھ؛ فرانسیسی املا والی کریول میں تاکہ قارئین کے لیے آسان ہو، بغیر حواشی کے؛ اس کے بعد انگریزی اور فرانسیسی تراجم آئے۔"
