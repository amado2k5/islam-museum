label: { ar: "القرآن بالكريولية الموريشيوسية مع النص العربي ⁦(حسين ناهابو)⁩", en: "Quran en kreole ek tex arab (Houssein Nahaboo)", ur: "قرآن ماریشیائی کریول میں مع عربی متن ⁦(حسین ناہابو)⁩", es: "Corán en kreole ek tex arab (Houssein Nahaboo)", fr: "Coran en créole ek tex arabe (Houssein Nahaboo)", tr: "Kur'an, Arapça Metinli Mauritius Kreolcası (Hussein Nahabu)", id: "Al-Qur'an dalam Kreol Mauritius dengan Teks Arab (Hussein Nahabu)" }
summary:
  ar: "ترجمة لمعاني القرآن إلى الكريولية الموريشيوسية، لغة الحياة اليومية في موريشيوس، وضعها طبيب الأسنان حسين ناهابو في خمس سنوات، ونشرتها حركة الطلاب الإسلامية وحركة النساء الإسلامية في بور لويس على أجزاء ابتداءً من سنة 1983، مع النص العربي في عمودين؛ كتبها بكريولية متأثرة بالإملاء الفرنسي لتكون في متناول القرّاء، ولا حواشي فيها، ثم أتبعها بترجمتين إنجليزية وفرنسية."
  en: "A rendering of the meanings of the Qur'an into Mauritian Creole, the everyday language of Mauritius, by the dentist Houssein Nahaboo, the work of five years, published in instalments from 1983 by the Islamic Students Movement and the Islamic Women's Movement in Port Louis, with the Arabic text in two columns; written in a Creole using French spelling to make it accessible to readers and without notes, it was followed by his English and French translations."
  ur: "ماریشس کی روزمرہ زبان ماریشیائی کریول میں قرآن کے معانی کا ترجمہ، از دندان ساز حسین ناہابو، پانچ سال کی محنت، جو 1983 سے پورٹ لوئس میں اسلامک اسٹوڈنٹس موومنٹ اور اسلامک ویمنز موومنٹ نے قسطوں میں شائع کیا، دو کالموں میں عربی متن کے ساتھ؛ فرانسیسی املا والی کریول میں تاکہ قارئین کے لیے آسان ہو، بغیر حواشی کے؛ اس کے بعد انگریزی اور فرانسیسی تراجم آئے۔"
  es: "Una traducción de los significados del Corán al criollo mauriciano, la lengua cotidiana de Mauricio, realizada por el dentista Houssein Nahaboo, un trabajo de cinco años, publicado por entregas a partir de 1983 por el Movimiento de Estudiantes Islámicos y el Movimiento de Mujeres Islámicas en Port Louis, con el texto árabe en dos columnas; escrito en un criollo que utiliza la ortografía francesa para hacerlo accesible a los lectores y sin notas, fue seguido por sus traducciones al inglés y al francés."
  fr: "Une traduction des significations du Coran en créole mauricien, la langue quotidienne de l'île Maurice, par le dentiste Houssein Nahaboo, œuvre de cinq ans, publiée par épisodes à partir de 1983 par le Mouvement des étudiants islamiques et le Mouvement des femmes islamiques à Port-Louis, avec le texte arabe en deux colonnes; écrit en créole avec une orthographe française pour le rendre accessible aux lecteurs et sans notes, il était suivi de ses traductions anglaise et française."
  tr: "Kur'an'ın anlamlarının Mauritius'taki günlük yaşamın dili olan Moritis Kreol'üne çevirisi, diş hekimi Hussein Nahabo tarafından beş yıl boyunca hazırlandı. 1983'ten itibaren Port Louis'teki İslami Öğrenciler Hareketi ve İslami Kadın Hareketi tarafından bölümler halinde yayımlandı; Arapça metin iki sütun halinde; okuyucuların erişimi için Fransızca yazımının etkisiyle Kreol dilinde yazıldı, dipnot olmadan, ardından iki İngilizce ve Fransızca çeviri yapıldı."
  id: "Terjemahan makna Al-Qur'an ke dalam bahasa Kreol Mauritius, bahasa kehidupan sehari-hari di Mauritius, disiapkan oleh dokter gigi Hussein Nahabo selama lima tahun. Terjemahan ini diterbitkan sebagian oleh Gerakan Mahasiswa Islam dan Gerakan Perempuan Islam di Port Louis mulai tahun 1983, dengan teks Arab dalam dua kolom; ditulis dalam bahasa Kreol yang dipengaruhi ejaan Prancis agar dapat diakses pembaca, tanpa catatan kaki, diikuti oleh dua terjemahan bahasa Inggris dan Prancis."
