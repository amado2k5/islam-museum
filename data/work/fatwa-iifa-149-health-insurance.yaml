label: { ar: "قرار مجمع الفقه الإسلامي الدولي 149 (16/7) بشأن التأمين الصحي", en: "IIFA resolution 149 (16/7) on health insurance", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 149 (16/7): صحت کی انشورنس", es: "Resolución 149 (16/7) de la IIFA sobre seguros de salud", fr: "Résolution 149 (16/7) de l'IIFA sur l'assurance maladie", tr: "Uluslararası İslami Fiqh Akademisi Sağlık Sigortası ile ilgili 149 (16/7) sayılı Kararı", id: "Resolusi Akademi Fiqh Islam Internasional 149 (16/7) mengenai asuransi kesehatan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. عرّف عقد التأمين الصحي بأنه اتفاق يلتزم به شخص أو مؤسسة بدفع مبلغ محدد أو أقساط لجهة تلتزم بتغطية العلاج أو تكاليفه لمدة معينة، وأسلوبه إما مباشر مع مؤسسة علاجية أو عن طريق شركة تأمين وسيطة. وقرر: إن كان مباشرًا مع المؤسسة العلاجية فهو جائز بالضوابط التي تجعل الغرر يسيرًا مغتفرًا مع توافر الحاجة المنزلة منزلة الضرورة لتعلقه بحفظ النفس والعقل والنسل من الضروريات، ومنها ضبط نطاق التغطية ومدة العقد والأقساط. وتناول حكم التأمين عبر الشركات الوسيطة والتكافلي الصحي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). It defined the health-insurance contract as an agreement by which a person or institution pays a set sum or instalments to a body undertaking to cover treatment or its costs for a fixed period, either directly with a treatment institution or through an intermediary insurance company. It ruled: direct contracts with the treatment institution are permissible under controls making the gharar slight and excusable, given the need amounting to necessity since the matter touches preserving life, reason and progeny among the necessities — the controls including delimiting coverage, term and premiums. It then dealt with insurance through intermediary companies and cooperative health insurance."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ اس نے صحت کی انشورنس کے عقد کی تعریف کی: ایسا معاہدہ جس میں شخص یا ادارہ کسی جہت کو مقررہ رقم یا اقساط دے اور وہ جہت طے شدہ مدت میں علاج یا اس کی لاگت کا احاطہ کرے — یا تو علاج کرنے والے ادارے سے براہ راست یا ثالثی انشورنس کمپنی کے ذریعے۔ فیصلہ: علاج والے ادارے سے براہ راست عقد جائز ہے ان ضوابط کے ساتھ جو غرر کو معمولی اور قابلِ اغماض بنائیں، کیونکہ ضرورت جان، عقل اور نسل کی حفاظت کی ضروریات سے جڑی ہے — ضوابط میں کوریج کی حد بندی، عقد کی مدت اور پریمیم شامل ہیں۔ پھر ثالثی کمپنیوں اور تعاونی صحت کی انشورنس کا حکم۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión en Dubái (30 Safar – 5 Rabi al-Awwal 1426, 9–14 de abril de 2005). Definió el contrato de seguro médico como un acuerdo por el cual una persona o institución paga una suma fija o cuotas a una entidad que se compromete a cubrir el tratamiento o sus costos durante un período determinado, ya sea directamente con la institución de tratamiento o a través de una compañía de seguros intermediaria. Dictaminó: los contratos directos con la institución de tratamiento son permisibles bajo controles que hacen que el gharar sea leve y excusable, dada la necesidad que equivale a una necesidad, ya que el asunto afecta la preservación de la vida, la razón y la descendencia entre las necesidades; los controles incluyen la delimitación de la cobertura, el plazo y las primas. Luego abordó los seguros a través de compañías intermediarias y los seguros médicos cooperativos."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 16e session à Dubaï (30 Safar – 5 Rabi al-Awwal 1426, soit du 9 au 14 avril 2005) définit le contrat d'assurance maladie comme un accord par lequel une personne ou une institution verse une somme fixe ou des mensualités à un organisme s'engageant à couvrir les soins ou leurs frais pendant une période déterminée, soit directement auprès d'un établissement de soins, soit par l'intermédiaire d'une compagnie d'assurance. L'Académie statue que les contrats directs avec l'établissement de soins sont autorisés sous réserve de contrôles minimisant le gharar (délit de non-conformité) et le rendant excusable, compte tenu du caractère essentiel du besoin, la préservation de la vie, de la raison et de la descendance étant des nécessités. Ces contrôles portent notamment sur la limitation de la couverture, la durée et les primes. L'Académie aborde ensuite l'assurance par l'intermédiaire de compagnies d'assurance et l'assurance maladie coopérative."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (30 Safar – 5 Rabi'al-Awwal 1426 H, 9–14 Nisan 2005) toplu kararı olarak tanımlanmıştır. Sağlık sigortası sözleşmesi, bir kişi veya kurumun, tedavi veya masraflarını belirli bir süre boyunca karşılamayı taahhüt eden bir kuruluşa belirli bir tutar veya taksitler ödemeyi taahhüt ettiği ve yönteminin doğrudan bir tıbbi kurumla ya da aracı bir sigorta şirketi aracılığıyla olduğu bir anlaşmadır. Karar verildi: Eğer doğrudan bir tıbbi kurumla ise, hayat, zihin ve çocukların korunması için gerekli şartlar karşılanması koşuluyla belirsizliği kolay ve affedilebilir kılan düzenlemeler kapsamında, sözleşmenin kapsamı, sözleşme süresi ve taksitler dahil olmak üzere belirlenen zorunluluk sağlanması şartıyla kabul edilebilir. Sigorta kararı aracı şirketler ve sağlık takafulları aracılığıyla ele alındı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi keenam belas di Dubai (30 Safar – 5 Rabi' al-Awwal 1426 AH, 9–14 April 2005). Kontrak asuransi kesehatan didefinisikan sebagai perjanjian di mana seseorang atau institusi berkomitmen untuk membayar sejumlah atau cicilan tertentu kepada entitas yang berkomitmen menanggung perawatan atau biayanya selama periode tertentu, dan metodenya baik langsung dengan institusi medis atau melalui perusahaan asuransi perantara. Diputuskan: Jika kontrak tersebut langsung dengan institusi medis, maka diperbolehkan berdasarkan peraturan yang memudahkan dan memaafkan ketidakpastian, asalkan kebutuhan yang ditetapkan sebagai kebutuhan terpenuhi, terkait dengan menjaga kehidupan, pikiran, dan keturunan di antara kebutuhan, termasuk penentuan cakupan cakupan, durasi kontrak, dan cicilan. Perjanjian ini membahas putusan tentang asuransi melalui perusahaan perantara dan takaful kesehatan."
