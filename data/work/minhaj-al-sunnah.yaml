structure: "The author's preface (reason for writing, the duty not to conceal knowledge, a general account of the Imamiyya), then al-Hilli's introduction and his six chapters quoted section by section with a reply to each: (1) the Imami and Sunni positions on the imamate, with a long digression on predestination, the eternity of the world and the philosophers; (2) that the Imami school must be followed, with the virtues of Ali; (3) the proofs of Ali's imamate in four methods: rational, from the Qur'an, from the Sunna and from his states; (4) the ways of proving the imamate of the Twelve; (5) that those who preceded Ali were not imams; (6) refuting the arguments for Abu Bakr's imamate."
