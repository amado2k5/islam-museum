summary:
  ar: "كتاب كبير لتقي الدين ابن تيمية (ت 728هـ) في الرد على «منهاج الكرامة في معرفة الإمامة» لابن المطهر الحلي، كتبه بعد أن أحضر إليه جماعة من أهل السنة كتاب الحلي المصنف للملك خدابنده؛ يتتبع فصول الحلي الستة في الإمامة ويرد عليها من جهة النقل والعقل، ويستطرد إلى القدر وحدوث العالم ونقد الفلاسفة والمتكلمين."
  en: "A large book by Taqi al-Din Ibn Taymiyya (d. 728 AH) answering Ibn al-Mutahhar al-Hilli's Minhaj al-Karama fi Ma'rifat al-Imama, written after a group of Sunnis brought him al-Hilli's book, composed for the king Khudabanda; it follows al-Hilli's six chapters on the imamate and replies to them on transmitted and rational grounds, with long digressions on predestination, the origination of the world and the philosophers and theologians."
