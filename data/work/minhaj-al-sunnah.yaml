summary:
  ar: "كتاب كبير لتقي الدين ابن تيمية ⁦(ت 728هـ)⁩ في الرد على «منهاج الكرامة في معرفة الإمامة» لابن المطهر الحلي، كتبه بعد أن أحضر إليه جماعة من أهل السنة كتاب الحلي المصنف للملك خدابنده؛ يتتبع فصول الحلي الستة في الإمامة ويرد عليها من جهة النقل والعقل، ويستطرد إلى القدر وحدوث العالم ونقد الفلاسفة والمتكلمين."
  en: "A large book by Taqi al-Din Ibn Taymiyya (d. 728 AH) answering Ibn al-Mutahhar al-Hilli's Minhaj al-Karama fi Ma'rifat al-Imama, written after a group of Sunnis brought him al-Hilli's book, composed for the king Khudabanda; it follows al-Hilli's six chapters on the imamate and replies to them on transmitted and rational grounds, with long digressions on predestination, the origination of the world and the philosophers and theologians."
  es: "Un extenso libro de Taqi al-Din Ibn Taymiyya (fallecido en el año 728 de la Hégira) que responde al Minhaj al-Karama fi Ma'rifat al-Imama de Ibn al-Mutahhar al-Hilli, escrito después de que un grupo de sunitas le trajera el libro de al-Hilli, compuesto para el rey Khudabanda; sigue los seis capítulos de al-Hilli sobre el imamato y los responde con fundamentos transmitidos y racionales, con largas digresiones sobre la predestinación, el origen del mundo y los filósofos y teólogos."
  fr: "Un ouvrage important de Taqi al-Din Ibn Taymiyya (mort en 728 AH) répondant au Minhaj al-Karama fi Ma'rifat al-Imama d'Ibn al-Mutahhar al-Hilli, écrit après qu'un groupe de sunnites lui eut apporté le livre d'al-Hilli, composé pour le roi Khudabanda; il suit les six chapitres d'al-Hilli sur l'imamat et y répond sur des bases transmises et rationnelles, avec de longues digressions sur la prédestination, l'origine du monde et les philosophes et théologiens."
  ur: "تقی الدین ابن تیمیہ ⁦(متوفی 728ھ)⁩ کی ایک بڑی کتاب ابن المطہر ہلی کی منہاج الکرامہ فی معرفۃ الامامہ کا جواب دیتے ہوئے، جسے سنیوں کے ایک گروہ کے ان کے پاس الحلی کی کتاب لانے کے بعد لکھی گئی، جو بادشاہ خدابندہ کے لیے لکھی گئی تھی۔ یہ امامت کے بارے میں الحلی کے چھ ابواب کی پیروی کرتا ہے اور ان کے جوابات منتقلی اور عقلی بنیادوں پر دیتا ہے، جس میں تقدیر، دنیا کی ابتدا اور فلسفیوں اور ماہرین الہیات پر طویل اختلاف ہے۔"
  tr: "Taqi al-Din İbn Teymiye'nin (ö. 728 Hicri) 'Minhaj al-Karamah fi Ma'rifat al-Imamah' adlı eserini çürüten önemli bir kitabı, bir grup Sünni tarafından kendisine 'Kral Khudabanda tarafından yazılan Al-Hilli' kitabını ortaya koymuştur; bu kitap, el-Hilli'nin İmamat üzerine altı bölümünü izler ve bunları aktarım ve akıl açısından çürütür, kader, dünyanın kökeni üzerine detaylı bir şekilde ele alır ve filozoflar ile teologları eleştirir."
  id: "Sebuah buku besar oleh Taqi al-Din Ibn Taymiyyah (wafat 728 H) yang membantah 'Minhaj al-Karamah fi Ma'rifat al-Imamah' oleh Ibn al-Mutahhar al-Hilli, ditulis setelah sekelompok Sunni membawakan kepadanya buku 'Al-Hilli, yang ditulis oleh Raja Khudabanda'; buku ini menelusuri enam bab al-Hilli tentang Imamate dan menolaknya dari perspektif transmisi dan akal, menguraikan tentang takdir, asal-usul dunia, serta mengkritik filsuf dan teolog."
