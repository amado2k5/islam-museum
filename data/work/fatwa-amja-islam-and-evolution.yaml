id: work/fatwa-amja-islam-and-evolution
class: work
kind: fatwa
label: { ar: "الإسلام ونظرية التطور", en: "Islam and the theory of evolution", ur: "اسلام اور نظریہ ارتقا", es: "El islam y la teoría de la evolución" }
summary:
  ar: "سأل سائل هل الإسلام هو الحق وما رأيه في نظرية التطور. أجاب د. صلاح الصاوي ⁦(فتوى رقم 87496 بتاريخ 27 سبتمبر 2012)⁩ أن الإسلام هو الحق المبين بشهادة النصوص، وأن نظرية التطور عنده لغو من القول أبطلته المجامع العلمية الغربية نفسها عنده، ونبّه إلى خلق الله الخلق في أطوار كما ورد. سُجّل منسوبًا إلى المجمع."
  en: "A questioner asked whether Islam is the truth and what it says of the theory of evolution. Dr. Salah al-Sawi (fatwa no. 87496, 27 September 2012) answered that Islam is the clear truth by the texts' testimony, and that evolution is in his view empty talk refuted by the western academies themselves, pointing to God's creating creation in stages as stated. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ کیا اسلام حق ہے اور نظریہ ارتقا کے بارے میں اس کا مؤقف کیا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 87496، 27 ستمبر 2012)⁩ نے جواب دیا کہ اسلام نصوص کی شہادت سے حق ہے اور ارتقا کا نظریہ ان کے نزدیک باطل ہے — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un interlocutor preguntó si el islam es la verdad y qué dice sobre la teoría de la evolución. El Dr. Salah al-Sawi (fatwa n.º 87496, 27 de septiembre de 2012) respondió que el islam es la verdad innegable, según el testimonio de los textos, y que la evolución, en su opinión, es una mera palabrería refutada por las propias academias occidentales, señalando que Dios creó la creación por etapas, tal como se afirma. Esta respuesta fue registrada por AMJA."
