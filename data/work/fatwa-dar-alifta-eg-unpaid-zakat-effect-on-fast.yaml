id: work/fatwa-dar-alifta-eg-unpaid-zakat-effect-on-fast
class: work
kind: fatwa
label: { ar: "مدى تأثير عدم إخراج زكاة المال على الصيام", en: "Does withholding zakat affect the fast?", ur: "کیا زکات نہ ادا کرنے کا روزے پر اثر ہے؟", es: "¿Afecta la retención del zakat al ayuno?", fr: "Le fait de ne pas verser la zakat a-t-il une incidence sur le jeûne ?" }
summary:
  ar: "سائل سأل عن تأثير عدم إخراج زكاة المال على صحة الصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21775)⁩ أن صيام من يؤخر إخراج الزكاة عن وقتها دون عذر أو من لا يلتزم بإخراجها أصلًا صحيح شرعًا فكل عبادة من العبادات قائمة بذاتها على ما فصّل الجواب."
  en: "A questioner asked whether failing to pay zakat on wealth affects the validity of the fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21775) answered that the fast of one who delays zakat past its time without excuse — or never pays it — is valid in the sharia, each act of worship standing on its own, as the answer details."
  ur: "ایک سائل نے پوچھا کہ مال کی زکات نہ ادا کرنے کا روزے کی صحت پر کیا اثر ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21775)⁩ نے جواب دیا کہ جو شخص بلا عذر زکات میں تاخیر کرے یا اصل میں ادا نہ کرے اس کا روزہ درست ہے کیونکہ ہر عبادت اپنی جگہ قائم ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si el no pagar el zakat sobre la riqueza afecta la validez del ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21775) respondió que el ayuno de quien retrasa el zakat más allá de su plazo sin justificación —o nunca lo paga— es válido según la sharia, y cada acto de adoración se sostiene por sí mismo, como se detalla en la respuesta."
  fr: "Un internaute a demandé si le défaut de paiement de la zakat sur les biens affectait la validité du jeûne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21775) a répondu que le jeûne de celui qui tarde à s'acquitter de la zakat sans excuse valable — ou qui ne la paie jamais — est valide selon la charia, chaque acte d'adoration étant considéré individuellement, comme le précise la réponse."
