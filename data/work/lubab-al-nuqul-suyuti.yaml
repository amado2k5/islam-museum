summary:
  ar: "كتاب جلال الدين السيوطي ⁦(ت 911هـ)⁩ في أسباب نزول آيات القرآن، رتّبه على السور مستخرجاً من كتب التفسير والحديث، ويعتنى بالسند والتخريج ويذكر موقفه من صحة الروايات."
  en: "Jalal al-Din al-Suyuti's (d. 911 AH) book on the occasions of revelation of Qur'anic verses, arranged sura by sura and extracted from the books of tafsir and hadith, with attention to chains, sourcing and his own assessment of each report's soundness."
  es: "Libro de Jalal al-Din al-Suyuti (m. 911 AH) sobre las ocasiones de revelación de los versículos coránicos, ordenado sura por sura y extraído de los libros de tafsir y hadiz, con atención a las cadenas de transmisión y a su propia valoración de cada relato."
  fr: "L'ouvrage de Jalal al-Din al-Suyuti (mort en 911 AH) sur les circonstances de révélation des versets coraniques, ordonné sourate par sourate et extrait des livres de tafsir et de hadith, avec soin pour les chaînes de transmission et son propre jugement sur la solidité de chaque rapport."
  ur: "جلال الدین سیوطی ⁦(متوفی 911ھ)⁩ کی قرآنی آیات کے اسبابِ نزول کی کتاب، سورہ بہ سورہ مرتب کی گئی اور تفسیر اور حدیث کی کتابوں سے اخذ کردہ، اسناد، تخریج اور ہر روایت کی صحت پر ان کی اپنی رائے کے ساتھ۔"
  tr: "Celaleddin es-Suyuti'nin (ö. 911 H) Kur'an ayetlerinin nüzul sebepleri hakkındaki kitabı; sure sure düzenlenmiş, tefsir ve hadis kitaplarından derlenmiştir; isnadlara, tahriçlere ve her rivayetin sıhhati hakkındaki kendi değerlendirmesine önem verir."
  id: "Kitab Jalaluddin as-Suyuti (w. 911 H) tentang sebab turunnya ayat-ayat Al-Qur'an, disusun surah demi surah dan diambil dari kitab-kitab tafsir dan hadis, dengan perhatian pada sanad, takhrij, dan penilaiannya sendiri atas kesahihan setiap riwayat."
