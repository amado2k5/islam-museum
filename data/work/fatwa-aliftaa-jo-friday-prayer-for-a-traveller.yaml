id: work/fatwa-aliftaa-jo-friday-prayer-for-a-traveller
class: work
kind: fatwa
label: { ar: "صلاة الجمعة للمسافر", en: "Friday prayer for a traveller", ur: "مسافر کے لیے نمازِ جمعہ" }
summary:
  ar: "سؤال عن صلاة الجمعة للمسافر، أجابت فيه دائرة الإفتاء العام الأردنية بأنها لا تجب على المسافر إن غادر محل إقامته قبل الفجر ولم ينو إقامة أربعة أيام فأكثر، فإن شرع في السفر بعد أذان الفجر وجبت عليه. أجابت الدائرة بأن صلاة الجمعة لا تجب على المسافر، طويلًا كان سفره أو قصيرًا، بشرط أن يغادر محل إقامته قبل دخول وقت الفجر في مذهب الشافعية، وألا ينوي الإقامة في المكان الذي سافر إليه أربعة أيام فأكثر غير يومي الدخول والخروج. وقالت إنه إن شرع في السفر بعد أذان الفجر وجب عليه أداء الجمعة في بلده أو في أي بلد تقام فيه، ونقلت ذلك من كتاب بشرى الكريم (1/383) من كتب الشافعية، وبينت أن السفر القصير ما دون 81 كم، وأن الترخص يبدأ بمفارقة عمران البلد."
  en: "A question about friday prayer for a traveller, in which Jordan's General Iftaa Department answered that it is not obligatory on a traveller who leaves home before dawn and does not intend to stay four days or more, but becomes obligatory if he sets out after the dawn call to prayer. The Department answered that Friday prayer is not obligatory on a traveller, whether the journey is long or short, provided that in the Shafi'i school he leaves his place of residence before dawn and does not intend to stay at his destination four days or more, excluding the days of arrival and departure. It said that if he sets out after the dawn call to prayer, he must attend Friday prayer in his town or in any town where it is held, quoting this from Bushra al-Karim (1/383), a Shafi'i work, and explained that a short journey is one under 81 km and that the concession begins on leaving the town's built-up area."
  ur: "مسافر کے لیے نمازِ جمعہ کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ اس مسافر پر واجب نہیں جو فجر سے پہلے گھر سے نکلے اور چار یا زیادہ دن ٹھہرنے کی نیت نہ کرے، لیکن فجر کی اذان کے بعد سفر شروع کرے تو واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ نمازِ جمعہ مسافر پر واجب نہیں، سفر طویل ہو یا مختصر، بشرطیکہ شافعی مذہب کے مطابق وہ فجر کا وقت داخل ہونے سے پہلے اپنی رہائش سے نکلے، اور منزل پر آنے اور جانے کے دنوں کے علاوہ چار یا زیادہ دن ٹھہرنے کی نیت نہ کرے۔ اس نے کہا کہ اگر وہ فجر کی اذان کے بعد سفر شروع کرے تو اس پر اپنے شہر میں یا جہاں جمعہ ہوتا ہو وہاں جمعہ ادا کرنا واجب ہے، اور یہ شافعی کتاب بشریٰ الکریم (1/383) سے نقل کیا، اور واضح کیا کہ مختصر سفر 81 کلومیٹر سے کم ہے اور رخصت شہر کی آبادی سے نکلنے پر شروع ہوتی ہے۔"
