id: work/fatwa-dar-alifta-what-to-do-when-the-creditor-cannot-be-found
class: work
kind: fatwa
label: { ar: "ما يجب فعله عند العجز عن الوصول لصاحب الدين", en: "What a debtor must do when the creditor cannot be found", ur: "قرض خواہ تک پہنچنا ممکن نہ ہو تو مقروض کیا کرے" }
summary:
  ar: "سؤال من رجل اقترض مبلغًا من شخص منذ مدة وحاول كثيرًا الوصول إليه لتسديده ولم يستطع، أجابت فيه دار الإفتاء المصرية بأن الدين واجب الأداء ولا تبرأ ذمة المدين إلا برده إلى صاحبه أو بإبرائه منه، فعليه بذل وسعه في البحث عن الدائن مستعينًا بوسائل العصر من أقسام الشرطة والسجلات المدنية وصفحات التواصل، فإن تعذر الوصول إليه انتقل الحق إلى ورثته الشرعيين، فإن تعذر الوصول إليهم صُرف المال إلى بنك ناصر الاجتماعي القائم في مصر مقام بيت المال الذي تؤول إليه الأموال التي لا يُهتدى إلى مستحقيها، فإن تعذر ذلك جاز التصدق بقيمة الدين على الفقراء بنية أن يكون ثوابه لصاحب الحق. استدلت الدار بحديث نفس المؤمن معلقة بدينه وشرح ابن الأثير له، وبحديث إن خياركم أحسنكم قضاءً، ونقلت عن ابن نجيم وابن عابدين والبهوتي وقانون المواريث 77 لسنة 1943 والسنهوري أن مال من لا وارث له لبيت المال وأنه ليس وارثًا بل جهة ومصلحة، وعن مصنف ابن أبي شيبة قول إبراهيم النخعي بالتصدق عن الدائن المجهول وتخييره إن جاء، وفعل ابن مسعود في ثمن جارية غاب صاحبها، وشرح ابن حجر له، وعن الحصكفي والنووي والرحيباني وجوب التصدق بما جُهل أربابه، واختارت للفتوى دفع الدين إلى ولي الأمر المتمثل في بيت المال أو ما يقوم مقامه لاتساقه مع الواقع المؤسسي المعاصر."
  en: "A question from a man who borrowed a sum of money some time ago, tried repeatedly to reach the lender to repay it and could not; Dar al-Ifta al-Misriyya answered that a debt must be paid and the debtor's liability is cleared only by returning it to its owner or by his releasing it, so he must do his utmost to find the creditor, using the means of the age such as police stations, civil registers and public social-media pages; if he cannot be reached, the right passes to his lawful heirs; if they too cannot be reached, the money is paid to Nasser Social Bank, which in Egypt stands in the place of the public treasury to which property with no identifiable owner reverts; and if that too is impossible, he may give the amount of the debt in charity to the poor with the intention that its reward go to the owner of the right. Dar al-Ifta cited the hadith that a believer's soul is held by his debt, with Ibn al-Athir's explanation, and the hadith that the best of you are those who repay best; quoted Ibn Nujaym, Ibn Abidin, al-Buhuti, the Inheritance Law 77 of 1943 and al-Sanhuri that the property of one with no heir goes to the treasury, which is not an heir but a public body and interest; quoted from Ibn Abi Shayba's Musannaf Ibrahim al-Nakhai's view that one gives charity on behalf of an untraceable creditor and offers him the choice if he appears, and Ibn Masud's act with the price of a slave girl whose seller vanished, with Ibn Hajar's comment; and quoted al-Haskafi, al-Nawawi and al-Ruhaybani on the duty to give in charity what belongs to unknown owners. It chose for its fatwa the view of the majority that the debt is handed to the ruling authority represented by the treasury or what stands in its place, as consistent with the institutional reality of the modern state."
  ur: "ایک شخص کا سوال جس نے کچھ عرصہ پہلے کسی سے رقم قرض لی، ادائیگی کے لیے بار بار اس تک پہنچنے کی کوشش کی مگر نہ پہنچ سکا؛ دار الافتاء مصر نے جواب دیا کہ قرض کی ادائیگی واجب ہے اور مقروض کی ذمہ داری صرف مالک کو واپس کرنے یا اس کے معاف کرنے سے ختم ہوتی ہے، لہٰذا وہ قرض خواہ کی تلاش میں پوری کوشش کرے، زمانے کے ذرائع جیسے پولیس اسٹیشن، سول رجسٹر اور عوامی سوشل میڈیا صفحات کی مدد لیتے ہوئے؛ اگر اس تک پہنچنا ممکن نہ ہو تو حق اس کے شرعی ورثا کو منتقل ہو جاتا ہے؛ اگر ان تک بھی پہنچنا ممکن نہ ہو تو رقم ناصر سوشل بینک کو دی جائے جو مصر میں بیت المال کے قائم مقام ہے جس کی طرف وہ اموال لوٹتے ہیں جن کے مستحق کا پتہ نہ چلے؛ اور اگر یہ بھی ممکن نہ ہو تو قرض کی مالیت فقرا پر اس نیت سے صدقہ کی جا سکتی ہے کہ اس کا ثواب حق دار کو ملے۔ دار الافتاء نے اس حدیث سے استدلال کیا کہ مومن کی جان اپنے قرض سے لٹکی رہتی ہے، ابن اثیر کی تشریح کے ساتھ، اور اس حدیث سے کہ تم میں بہترین وہ ہیں جو بہتر ادا کریں؛ ابن نجیم، ابن عابدین، بہوتی، 1943 کے وراثت کے قانون 77 اور سنہوری سے نقل کیا کہ جس کا کوئی وارث نہ ہو اس کا مال بیت المال کا ہے جو وارث نہیں بلکہ ایک ادارہ اور مصلحت ہے؛ ابن ابی شیبہ کی مصنف سے ابراہیم نخعی کا قول کہ گمشدہ قرض خواہ کی طرف سے صدقہ کیا جائے اور وہ آ جائے تو اسے اختیار دیا جائے، اور ابن مسعود کا ایک لونڈی کی قیمت کے بارے میں عمل جس کا بیچنے والا غائب ہو گیا، ابن حجر کی تشریح کے ساتھ؛ اور حصکفی، نووی اور رحیبانی سے نامعلوم مالکوں کے مال کو صدقہ کرنے کا وجوب۔ فتوے کے لیے اس نے جمہور کا یہ قول اختیار کیا کہ قرض ولی الامر کو دیا جائے جس کی نمائندگی بیت المال یا اس کا قائم مقام کرتا ہے، کیونکہ یہ جدید ریاست کی ادارہ جاتی حقیقت سے ہم آہنگ ہے۔"
