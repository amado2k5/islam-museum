id: work/fatwa-dar-alifta-what-to-do-when-the-creditor-cannot-be-found
class: work
kind: fatwa
label: { ar: "ما يجب فعله عند العجز عن الوصول لصاحب الدين", en: "What a debtor must do when the creditor cannot be found", ur: "قرض خواہ تک پہنچنا ممکن نہ ہو تو مقروض کیا کرے", es: "Qué debe hacer un deudor cuando no se puede encontrar al acreedor.", fr: "Que doit faire un débiteur lorsque le créancier est introuvable ?", tr: "Borçluya ulaşamadığında ne yapılmalı", id: "Apa yang harus dilakukan jika tidak dapat menghubungi debitur" }
summary:
  ar: "سؤال من رجل اقترض مبلغًا من شخص منذ مدة وحاول كثيرًا الوصول إليه لتسديده ولم يستطع، أجابت فيه دار الإفتاء المصرية بأن الدين واجب الأداء ولا تبرأ ذمة المدين إلا برده إلى صاحبه أو بإبرائه منه، فعليه بذل وسعه في البحث عن الدائن مستعينًا بوسائل العصر من أقسام الشرطة والسجلات المدنية وصفحات التواصل، فإن تعذر الوصول إليه انتقل الحق إلى ورثته الشرعيين، فإن تعذر الوصول إليهم صُرف المال إلى بنك ناصر الاجتماعي القائم في مصر مقام بيت المال الذي تؤول إليه الأموال التي لا يُهتدى إلى مستحقيها، فإن تعذر ذلك جاز التصدق بقيمة الدين على الفقراء بنية أن يكون ثوابه لصاحب الحق. استدلت الدار بحديث نفس المؤمن معلقة بدينه وشرح ابن الأثير له، وبحديث إن خياركم أحسنكم قضاءً، ونقلت عن ابن نجيم وابن عابدين والبهوتي وقانون المواريث 77 لسنة 1943 والسنهوري أن مال من لا وارث له لبيت المال وأنه ليس وارثًا بل جهة ومصلحة، وعن مصنف ابن أبي شيبة قول إبراهيم النخعي بالتصدق عن الدائن المجهول وتخييره إن جاء، وفعل ابن مسعود في ثمن جارية غاب صاحبها، وشرح ابن حجر له، وعن الحصكفي والنووي والرحيباني وجوب التصدق بما جُهل أربابه، واختارت للفتوى دفع الدين إلى ولي الأمر المتمثل في بيت المال أو ما يقوم مقامه لاتساقه مع الواقع المؤسسي المعاصر."
  en: "A question from a man who borrowed a sum of money some time ago, tried repeatedly to reach the lender to repay it and could not; Dar al-Ifta al-Misriyya answered that a debt must be paid and the debtor's liability is cleared only by returning it to its owner or by his releasing it, so he must do his utmost to find the creditor, using the means of the age such as police stations, civil registers and public social-media pages; if he cannot be reached, the right passes to his lawful heirs; if they too cannot be reached, the money is paid to Nasser Social Bank, which in Egypt stands in the place of the public treasury to which property with no identifiable owner reverts; and if that too is impossible, he may give the amount of the debt in charity to the poor with the intention that its reward go to the owner of the right. Dar al-Ifta cited the hadith that a believer's soul is held by his debt, with Ibn al-Athir's explanation, and the hadith that the best of you are those who repay best; quoted Ibn Nujaym, Ibn Abidin, al-Buhuti, the Inheritance Law 77 of 1943 and al-Sanhuri that the property of one with no heir goes to the treasury, which is not an heir but a public body and interest; quoted from Ibn Abi Shayba's Musannaf Ibrahim al-Nakhai's view that one gives charity on behalf of an untraceable creditor and offers him the choice if he appears, and Ibn Masud's act with the price of a slave girl whose seller vanished, with Ibn Hajar's comment; and quoted al-Haskafi, al-Nawawi and al-Ruhaybani on the duty to give in charity what belongs to unknown owners. It chose for its fatwa the view of the majority that the debt is handed to the ruling authority represented by the treasury or what stands in its place, as consistent with the institutional reality of the modern state."
  ur: "ایک شخص کا سوال جس نے کچھ عرصہ پہلے کسی سے رقم قرض لی، ادائیگی کے لیے بار بار اس تک پہنچنے کی کوشش کی مگر نہ پہنچ سکا؛ دار الافتاء مصر نے جواب دیا کہ قرض کی ادائیگی واجب ہے اور مقروض کی ذمہ داری صرف مالک کو واپس کرنے یا اس کے معاف کرنے سے ختم ہوتی ہے، لہٰذا وہ قرض خواہ کی تلاش میں پوری کوشش کرے، زمانے کے ذرائع جیسے پولیس اسٹیشن، سول رجسٹر اور عوامی سوشل میڈیا صفحات کی مدد لیتے ہوئے؛ اگر اس تک پہنچنا ممکن نہ ہو تو حق اس کے شرعی ورثا کو منتقل ہو جاتا ہے؛ اگر ان تک بھی پہنچنا ممکن نہ ہو تو رقم ناصر سوشل بینک کو دی جائے جو مصر میں بیت المال کے قائم مقام ہے جس کی طرف وہ اموال لوٹتے ہیں جن کے مستحق کا پتہ نہ چلے؛ اور اگر یہ بھی ممکن نہ ہو تو قرض کی مالیت فقرا پر اس نیت سے صدقہ کی جا سکتی ہے کہ اس کا ثواب حق دار کو ملے۔ دار الافتاء نے اس حدیث سے استدلال کیا کہ مومن کی جان اپنے قرض سے لٹکی رہتی ہے، ابن اثیر کی تشریح کے ساتھ، اور اس حدیث سے کہ تم میں بہترین وہ ہیں جو بہتر ادا کریں؛ ابن نجیم، ابن عابدین، بہوتی، 1943 کے وراثت کے قانون 77 اور سنہوری سے نقل کیا کہ جس کا کوئی وارث نہ ہو اس کا مال بیت المال کا ہے جو وارث نہیں بلکہ ایک ادارہ اور مصلحت ہے؛ ابن ابی شیبہ کی مصنف سے ابراہیم نخعی کا قول کہ گمشدہ قرض خواہ کی طرف سے صدقہ کیا جائے اور وہ آ جائے تو اسے اختیار دیا جائے، اور ابن مسعود کا ایک لونڈی کی قیمت کے بارے میں عمل جس کا بیچنے والا غائب ہو گیا، ابن حجر کی تشریح کے ساتھ؛ اور حصکفی، نووی اور رحیبانی سے نامعلوم مالکوں کے مال کو صدقہ کرنے کا وجوب۔ فتوے کے لیے اس نے جمہور کا یہ قول اختیار کیا کہ قرض ولی الامر کو دیا جائے جس کی نمائندگی بیت المال یا اس کا قائم مقام کرتا ہے، کیونکہ یہ جدید ریاست کی ادارہ جاتی حقیقت سے ہم آہنگ ہے۔"
  es: "Un hombre que había pedido prestada una suma de dinero hacía algún tiempo, intentó repetidamente contactar al prestamista para devolverla sin éxito; Dar al-Ifta al-Misriyya respondió que una deuda debe pagarse y la responsabilidad del deudor se salda solo devolviéndola a su dueño o liberándola de ella, por lo que debe hacer todo lo posible por encontrar al acreedor, utilizando los medios de la época, como las comisarías de policía, los registros civiles y las páginas públicas de redes sociales; si no se le puede contactar, el derecho pasa a sus herederos legítimos; si tampoco se les puede contactar, el dinero se paga al Banco Social Nasser, que en Egipto ocupa el lugar del tesoro público al que revierten los bienes sin dueño identificable; y si eso también es imposible, puede dar el monto de la deuda en caridad a los pobres con la intención de que su recompensa vaya al dueño del derecho. Dar al-Ifta citó el hadiz de que el alma de un creyente está sujeta a su deuda, con la explicación de Ibn al-Athir, y el hadiz de que los mejores de vosotros son los que mejor pagan; citó a Ibn Nujaym, Ibn Abidin, al-Buhuti, la Ley de Sucesiones 77 de 1943 y al-Sanhuri que la propiedad de uno sin heredero va al tesoro, que no es un heredero sino un organismo e interés público; citó de Musannaf de Ibn Abi Shayba la opinión de Ibrahim al-Nakhai de que uno da caridad en nombre de un acreedor ilocalizable y le ofrece la opción si aparece, y el acto de Ibn Masud con el precio de una esclava cuyo vendedor desapareció, con el comentario de Ibn Hajar; y citó a al-Haskafi, al-Nawawi y al-Ruhaybani sobre el deber de dar en caridad lo que pertenece a dueños desconocidos. Para su fatua, optó por la opinión de la mayoría de que la deuda se entrega a la autoridad gobernante representada por el tesoro público o lo que lo sustituya, por considerarla coherente con la realidad institucional del Estado moderno."
  fr: "Un homme qui avait emprunté une somme d'argent il y a quelque temps et qui, malgré ses efforts répétés pour contacter son prêteur afin de la rembourser, n'y était pas parvenu, a posé la question suivante à Dar al-Ifta al-Misriyya. Il lui a répondu qu'une dette doit être payée et que la responsabilité du débiteur n'est effacée que par la restitution de la somme à son propriétaire ou par sa libération. Il doit donc tout mettre en œuvre pour retrouver le créancier, en utilisant les moyens actuels tels que les commissariats de police, les registres d'état civil et les réseaux sociaux. S'il est injoignable, le droit revient à ses héritiers légitimes. Si ces derniers sont également injoignables, la somme est versée à la Banque sociale Nasser, qui en Égypte tient lieu de trésor public et à laquelle reviennent les biens sans propriétaire identifiable. Enfin, si cela s'avère impossible, il peut donner le montant de la dette en aumône aux pauvres, en espérant que la récompense aille au titulaire du droit. Dar al-Ifta a cité le hadith selon lequel l'âme d'un croyant est liée à sa dette, avec l'explication d'Ibn al-Athir, et le hadith selon lequel les meilleurs d'entre vous sont ceux qui remboursent le mieux; a cité Ibn Nujaym, Ibn Abidin, al-Buhuti, la loi successorale n° 77 de 1943 et al-Sanhuri selon lesquels les biens d'une personne sans héritier reviennent au trésor public, qui n'est pas un héritier mais un organisme public; a cité l'avis d'Ibn Abi Shayba dans le Musannaf d'Ibrahim al-Nakhai selon lequel on fait l'aumône au nom d'un créancier introuvable et on lui offre le choix s'il se manifeste, et l'acte d'Ibn Masud concernant le prix d'une esclave dont le vendeur a disparu, avec le commentaire d'Ibn Hajar; et a cité al-Haskafi, al-Nawawi et al-Ruhaybani sur le devoir de donner en aumône ce qui appartient à des propriétaires inconnus. Elle a retenu pour sa fatwa l'avis majoritaire selon lequel la dette est remise à l'autorité dirigeante représentée par le trésor public ou ce qui la remplace, conformément à la réalité institutionnelle de l'État moderne."
  tr: "Bir süre önce birinden borç alan ve onu geri ödemek için ulaşmaya çalışan ama başaramamış bir adamdan gelen bir soru. Mısır Dar al-Ifta, borcun zorunlu olduğunu ve borçlunun ancak sahibine iade edilmesiyle veya tasfiye edilmesiyle serbest bırakıldığını söyledi. Bu nedenle, polis departmanları, kayıtlar ve sosyal medya sayfaları gibi modern yollarla alacaklıyı aramak için elinden geleni yapmalıdır. Bu mümkün değilse, hak meşru mirasçılarına geçer. Onlara ulaşmak mümkün değilse, para Mısır'da kamu hazinesi olarak faaliyet gösteren Nasser Sosyal Bankası'na aktarılır ve hak ettiği alıcıya ulaşmayan fonlar oraya aktarılır. Bu mümkün değilse, borcun hak sahibi tarafından verileceği amacıyla yoksullara yapılan sadaka yardımı kabul edilir. Dar, müminin ruhunun hadisini, borcunu ve İbn al-Athir'in açıklamasını aktararak, 'Aranızda en iyiler en iyidir yargı sahibidir' diye atıfta bulundu. İbn Najim, İbn Abidin, El-Bahuti, 1943 tarihli Miras Kanunu 77 ve El-Sanhuri'den, varisi olmayan birinin servetinin kamu hazinesine ait olduğunu, varis değil, çıkar ve çıkar meselesi olduğunu aktardı. Ayrıca yazar İbn Ebi Şeybe'nin sözlerini aktardı İbrahim el-Nakha'i tarafından, bilinmeyen alacaklı adına sadaka vermesi ve gelirse ona seçim hakkı verilmesi, İbn Mes'ud'un sahibi olmayan bir köle kızın fiyatıyla ilgili eylemi, İbn Hajar'ın bunu açıklaması ve El-Haskafi, El-Nevavi ve El-Ruhaibani'nin sahiplerinin bilmediği şeylere sadaka verme yükümlülüğü hakkında. Kurum, fetvanın, kamu hazinesi veya onun yerine geçen borç tarafından temsil edilen hükümdara ödemesini seçti ve böylece borç güncel kurumsal gerçeklikle tutarlılığını sağladı."
  id: "Sebuah pertanyaan dari seorang pria yang pernah meminjam sejumlah uang dari seseorang beberapa waktu lalu dan berusaha keras untuk menghubunginya agar bisa melunasinya tetapi tidak berhasil. Dar al-Ifta Mesir menjawab bahwa utang itu wajib dan debitur hanya dibebaskan dengan mengembalikannya kepada pemiliknya atau membebaskannya. Oleh karena itu, dia harus berusaha sekuat tenaga untuk mencari kreditur menggunakan cara modern seperti departemen kepolisian, catatan sipil, dan halaman media sosial. Jika itu tidak memungkinkan, hak tersebut beralih ke ahli waris sahnya. Jika tidak memungkinkan, uang tersebut dipindahkan ke Bank Sosial Nasser, yang beroperasi di Mesir sebagai tempat kas negara, ke mana dana yang tidak sampai kepada penerima yang sah dipindahkan. Jika hal ini tidak memungkinkan, diperbolehkan memberikan amal atas utang tersebut kepada orang miskin dengan niat agar imbalannya akan diberikan kepada pemilik yang sah. Dar mengutip hadits tentang jiwa orang beriman, mengomentari hutangnya dan penjelasan Ibn al-Athir, serta hadis 'Yang terbaik di antara kalian adalah yang terbaik dalam penilaian.' Hadits mengutip dari Ibn Najim, Ibn Abidin, Al-Bahuti, dan Hukum Warisan 77 tahun 1943, serta Al-Sanhuri, bahwa kekayaan seseorang tanpa ahli waris adalah milik kas negara dan bukan ahli waris, melainkan masalah kepentingan dan kepentingan. Ia juga mengutip penulis Ibn Abi Shayi bah seperti yang dikatakan Ibrahim al-Nakha'i tentang memberi amal atas nama kreditur yang tidak dikenal dan memberinya pilihan jika ia datang, tindakan Ibn Mas'ud mengenai harga seorang gadis budak perempuan yang pemiliknya tidak ada, penjelasan Ibn Hajar tentang hal ini, dan dari Al-Haskafi, Al-Nawawi, dan Al-Ruhaibani, mengenai kewajiban memberikan amal kepada apa yang tidak diketahui pemiliknya. Institusi memilih fatwa untuk membayar hutang kepada penguasa, yang diwakili oleh kas umum atau penggantinya, untuk memastikan konsistensi dengan realitas kelembagaan kontemporer."
