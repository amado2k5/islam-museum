summary:
  ar: "«كيف تتلذذ بالصلاة» سلسلة محاضرات مسجّلة بالفيديو لمشاري الخراز، وهي في أرشيف Assabile في ثلاثين حلقة بحسب سجل الحصاد. تغطي هذه المادة الحلقات الاثنتي عشرة الأولى من النص الآلي للتسجيلات. ما يرد فيها قول المتحدث وينسب إليه، والأحكام الفقهية فيها قليلة، وما يعرضه منها يُعرض رأيا له. ما يحتاج إلى مصدر أو يُقرأ من نص آلي غير واضح مُعلَّم كذلك."
  en: "\"How to Savour Prayer\" (Kayfa tatalaththadhu bi-al-salat) is a video lecture series by Mishari al-Kharraz, held in the Assabile archive as thirty episodes according to the harvest register. This entry covers the first twelve episodes, from their machine transcripts. The speaker's points are his own and are attributed to him; he gives few legal rulings, and where he states one it is recorded as his view. Anything needing a source, or read from an unclear transcript line, is marked."
  ur: "مشاری الخراز کا ویڈیو میں ریکارڈ شدہ لیکچر سلسلہ «نماز سے لذت کیسے اٹھائیں» (Kayfa tatalaththadhu bi-al-salat) ہے، جو Assabile آرکائیو میں ہارویسٹ رجسٹر کے مطابق تیس اقساط پر مشتمل ہے۔ یہ اندراج پہلی بارہ اقساط کے مشین ٹرانسکرپٹ پر مبنی ہے۔ مقرر کے نکات ان کے اپنے ہیں اور انہی سے منسوب ہیں؛ فقہی احکام کم ہیں، اور جو وہ بیان کرتے ہیں وہ ان کی رائے کے طور پر درج ہے۔ جس بات کو ماخذ کی ضرورت ہے، یا جو غیر واضح سطر سے پڑھی گئی ہے، وہ نشان زد ہے۔"
  fr: "« Comment savourer la prière » (Kayfa tatalaththadhu bi-al-salat) est une série de conférences filmées de Mishari al-Kharraz, conservée dans les archives d'Assabile sous la forme de trente épisodes selon le registre de moisson. Cette notice couvre les douze premiers épisodes, d'après leurs transcriptions automatiques. Les propos de l'orateur lui sont propres et lui sont attribués ; il énonce peu de jugements juridiques, et lorsqu'il en énonce un, il est consigné comme son avis. Ce qui demande une source, ou qui est lu dans une ligne peu claire de la transcription, est signalé."
  es: "«Cómo disfrutar de la oración» (Kayfa tatalaththadhu bi-al-salat) es una serie de charlas filmadas de Mishari al-Kharraz, conservada en el archivo de Assabile como treinta episodios según el registro de cosecha. Esta entrada abarca los doce primeros episodios, a partir de sus transcripciones automáticas. Las opiniones del orador son suyas y se le atribuyen; enuncia pocos juicios jurídicos, y cuando enuncia uno se registra como su opinión. Lo que necesita una fuente, o se lee de una línea poco clara de la transcripción, está marcado."
