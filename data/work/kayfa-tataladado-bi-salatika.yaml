summary:
  ar: "سلسلة محاضرات مسجّلة بالفيديو لمشاري الخراز بعنوان «كيف تتلذذ بالصلاة»، وهي في أرشيف Assabile في ثلاثين حلقة بحسب سجل الحصاد. تغطي هذه المادة الحلقات التسع الأولى من النص الآلي للتسجيلات. ما يرد فيها قول المتحدث وينسب إليه، والأحكام الفقهية فيها قليلة، وما يعرضه منها يُعرض رأيا له. ما يحتاج إلى مصدر أو يُقرأ من نص آلي غير واضح مُعلَّم كذلك."
  en: "A video lecture series by Mishari al-Kharraz titled \"How to Savour Prayer\", held in the Assabile archive as thirty episodes according to the harvest register. This entry covers the first nine episodes, from their machine transcripts. The speaker's points are his own and are attributed to him; he gives few legal rulings, and where he states one it is recorded as his view. Anything needing a source, or read from an unclear transcript line, is marked."
  ur: "مشاری الخراز کا ویڈیو میں ریکارڈ شدہ لیکچر سلسلہ «نماز سے لذت کیسے اٹھائیں»، جو Assabile آرکائیو میں ہارویسٹ رجسٹر کے مطابق تیس اقساط پر مشتمل ہے۔ یہ اندراج پہلی نو اقساط کے مشین ٹرانسکرپٹ پر مبنی ہے۔ جو کچھ اس میں ہے وہ مقرر کا کلام ہے اور اسی سے منسوب ہے؛ فقہی احکام کم ہیں، اور جو وہ بیان کرتا ہے وہ اس کی رائے کے طور پر درج ہے۔ جس بات کو ماخذ کی ضرورت ہے یا جو غیر واضح سطر سے پڑھی گئی ہے، وہ نشان زد ہے۔"
  fr: "Une série de conférences vidéo de Mishari al-Kharraz, intitulée « Comment savourer la prière », conservée dans les archives d'Assabile en trente épisodes selon le registre de collecte. Cette notice couvre les neuf premiers épisodes, à partir de leurs transcriptions automatiques. Les propos sont ceux du conférencier et lui sont attribués ; les décisions juridiques sont rares, et lorsqu'il en énonce une, elle est notée comme son avis. Ce qui demande une source, ou se lit dans une ligne peu claire, est signalé."
  es: "Serie de charlas en vídeo de Mishari al-Kharraz, titulada «Cómo disfrutar de la oración», conservada en el archivo de Assabile con treinta episodios según el registro de recolección. Esta entrada cubre los nueve primeros episodios, a partir de sus transcripciones automáticas. Las palabras son del orador y se le atribuyen; los dictámenes jurídicos son escasos, y cuando enuncia uno se recoge como su opinión. Lo que necesita fuente, o se lee en una línea poco clara, está marcado."
