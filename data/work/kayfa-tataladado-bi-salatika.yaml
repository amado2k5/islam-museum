label:
  ar: "كيف تتلذذ بالصلاة ⁦(سلسلة محاضرات)⁩"
  en: "How to Savour Prayer (lecture series)"
  ur: "نماز سے لذت کیسے اٹھائیں ⁦(لیکچر سلسلہ)⁩"
  fr: "Comment savourer la prière (série de conférences)"
  es: "Cómo disfrutar de la oración (serie de charlas)"
summary:
  ar: "سلسلة محاضرات مسجّلة بالفيديو لمشاري الخراز بعنوان «كيف تتلذذ بالصلاة»، وهي في أرشيف Assabile في ثلاثين حلقة بحسب سجل الحصاد. تتناول هذه المادة الحلقات الست الأولى من النص الآلي للتسجيلات، وفيها يتدرّج المتحدث في مراتب الصلاة: حضور القلب، ثم الفهم، ثم الرجاء، ثم الهيبة، ثم المحبة وجمال الله وحسن تعامله ونعمه، ثم الأمن والحياء من الله. كل ما يرد هنا هو قول المتحدث وينسب إليه، ولا يرد فيها حكم فقهي يُقدَّم بصوت المتحف."
  en: "A video lecture series by Mishari al-Kharraz titled \"How to Savour Prayer\", held in the Assabile archive as thirty episodes according to the harvest register. This entry covers the first six episodes, from their machine transcripts. In them the speaker moves through degrees of prayer: presence of heart, understanding, hope and awe; then love, God's beauty, His good treatment and His favours; then security and shame before God. Everything here is the speaker's own speech and is attributed to him, and the episodes give no legal ruling in the museum's voice."
  ur: "مشاری الخراز کا ویڈیو میں ریکارڈ شدہ لیکچر سلسلہ «نماز سے لذت کیسے اٹھائیں»، جو Assabile آرکائیو میں ہارویسٹ رجسٹر کے مطابق تیس اقساط پر مشتمل ہے۔ یہ اندراج پہلی چھ اقساط پر مبنی ہے، جو مشین ٹرانسکرپٹ سے لی گئی ہیں۔ ان میں مقرر حضورِ قلب، فہم، امید اور ہیبت کے مراتب، پھر محبت، اللہ کے حسن، اس کے اچھے سلوک اور نعمتوں، اور پھر امن اور اللہ سے حیا کے مراتب بیان کرتا ہے۔ یہاں جو کچھ ہے وہ مقرر کا اپنا کلام ہے اور اسی سے منسوب ہے، اور ان اقساط میں میوزیم کی زبان میں کوئی فقہی حکم نہیں دیا گیا۔"
  fr: "Une série de conférences vidéo de Mishari al-Kharraz, intitulée « Comment savourer la prière », conservée dans les archives d'Assabile en trente épisodes selon le registre de collecte. Cette notice couvre les six premiers épisodes, à partir de leurs transcriptions automatiques. Le conférencier y parcourt les degrés de la prière : la présence du cœur, la compréhension, l'espérance et la crainte révérencielle ; puis l'amour, la beauté de Dieu, Sa bonne conduite et Ses bienfaits ; puis la sécurité et la pudeur devant Dieu. Tout ce qui figure ici est sa parole, qui lui est attribuée, et ces épisodes ne contiennent aucune décision juridique présentée avec la voix du musée."
  es: "Serie de charlas en vídeo de Mishari al-Kharraz, titulada «Cómo disfrutar de la oración», conservada en el archivo de Assabile con treinta episodios según el registro de recolección. Esta entrada cubre los seis primeros episodios, a partir de sus transcripciones automáticas. En ellos el orador recorre los grados de la oración: la presencia del corazón, la comprensión, la esperanza y el temor reverencial; después el amor, la belleza de Dios, Su buen trato y Sus favores; y después la seguridad y la vergüenza ante Dios. Todo lo que aparece aquí es palabra del orador y se le atribuye a él, y estos episodios no contienen ningún dictamen jurídico presentado con la voz del museo."
