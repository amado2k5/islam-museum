id: work/fatwa-aliftaa-jo-entry-fees-for-a-car-auction
class: work
kind: fatwa
label: { ar: "رسوم الدخول إلى مزاد السيارات", en: "Entry fees for a car auction", ur: "گاڑیوں کی نیلامی میں داخلے کی فیس" }
summary:
  ar: "سؤال عن شراء سيارة من مزاد يشترط تأمينًا مستردًا ورسمًا عند استرداده ورسومًا تأخذها الشركة المنظمة، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع المزاد جائز بضوابطه، وأن رسوم الدخول تجوز بقدر التكلفة الفعلية، وأن أجرة الشركة الوسيطة جائزة. أجابت الدائرة بأن الفقهاء أجازوا بيع المزاد بشرط اجتناب النجش، وهو أن يزيد في الثمن من لا يريد الشراء ليوقع غيره، واجتناب التدليس، وهو الخديعة التي توقع الشخص في غلط يدفعه إلى التعاقد. وقالت إنه لا بأس بفرض رسم على الدخول إلى المزاد إذا اقتصر على قدر التكلفة الفعلية لأنه من المصاريف الإدارية، ونقلت قرار مجمع الفقه الإسلامي الدولي رقم 73 بجواز رسم الدخول بما لا يزيد على القيمة الفعلية لدفتر الشروط. وقالت إن الرسوم التي يأخذها البائع زيادة على التكلفة الفعلية من أكل أموال الناس بالباطل، وإن ما تأخذه الشركات الوسيطة المنظمة للمزاد من التكلفة الفعلية، فلا حرج فيه بوصفه أجرة للوسيط. وخلصت إلى أنه إذا كانت رسوم المزاد تأخذها الشركة الوسيطة لا البائع جاز ذلك، بشرط اجتناب النجش والتدليس."
  en: "A question about buying a car at an auction that requires a refundable deposit, a fee on its refund and charges taken by the organising company, in which Jordan's General Iftaa Department answered that auction sales are permitted within their limits, that entry fees are allowed up to the actual cost, and that the broker company's charge is permitted. The Department answered that jurists permit auction sales provided they avoid najash, bidding up the price by someone with no intention to buy in order to trap others, and tadlis, deception that leads a person into a mistake that prompts him to contract. It said there is no objection to an entry fee limited to the actual cost, since it is an administrative expense, citing decision No. 73 of the International Islamic Fiqh Academy permitting an entry fee no higher than the actual value of the conditions booklet. It said fees the seller takes beyond the actual cost amount to consuming people's wealth unjustly, while what the broker companies organising the auction charge is part of the actual cost and is unobjectionable as a broker's fee. It concluded that if the auction fees are taken by the broker company rather than the seller, this is permitted, provided najash and tadlis are avoided."
  ur: "گاڑی کی ایسی نیلامی سے خریداری کے بارے میں سوال جس میں قابل واپسی زر ضمانت، اس کی واپسی پر فیس اور منتظم کمپنی کی فیس شرط ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نیلامی کی بیع اپنی حدود کے ساتھ جائز ہے، داخلہ فیس اصل لاگت کی حد تک جائز ہے، اور ثالث کمپنی کی فیس جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہا نے نیلامی کی بیع کو جائز رکھا ہے بشرطیکہ نجش سے بچا جائے، یعنی خریدنے کا ارادہ نہ رکھنے والا دوسروں کو پھنسانے کے لیے بولی بڑھائے، اور تدلیس سے، یعنی ایسا دھوکا جو انسان کو غلطی میں ڈال کر معاہدے پر آمادہ کرے۔ اس نے کہا کہ نیلامی میں داخلہ فیس میں حرج نہیں اگر وہ اصل لاگت تک محدود ہو، کیونکہ یہ انتظامی خرچ ہے؛ اس نے بین الاقوامی اسلامی فقہ اکیڈمی کے فیصلہ نمبر 73 کا حوالہ دیا جس میں شرائط نامے کی اصل قیمت سے زیادہ نہ ہونے والی داخلہ فیس کو جائز کہا گیا ہے۔ اس نے کہا کہ بیچنے والا اصل لاگت سے زیادہ جو فیس لے وہ لوگوں کا مال ناحق کھانا ہے، جبکہ نیلامی منظم کرنے والی ثالث کمپنیوں کی فیس اصل لاگت کا حصہ ہے اور ثالث کی اجرت کے طور پر اس میں حرج نہیں۔ اس نے نتیجہ نکالا کہ اگر نیلامی کی فیس بیچنے والے کی بجائے ثالث کمپنی لے تو یہ جائز ہے، بشرطیکہ نجش اور تدلیس سے بچا جائے۔"
