label:
  ar: "سلسلة قصة وعبر ⁦(برنامج)⁩"
  en: "Qissa wa 'Ibar (lecture series)"
  ur: "قصہ و عبر ⁦(لیکچر سلسلہ)⁩"
  es: "Qissa wa 'Ibar (ciclo de conferencias)"
  fr: "Qissa wa 'Ibar (série de conférences)"
  tr: "Hikaye ve Dersler Serisi (Program)"
  id: "Seri Cerita dan Pelajaran (Program)"
summary:
  ar: "سلسلة دروس لعمر عبد الكافي يقدّمها خلال الشهر الكريم، تعرض كل حلقة فيها قصة من القرآن الكريم أو من الحديث الصحيح ثم تستخلص منها العبر. الحلقة الأولى تمهّد لمنهجه في عرض القصص القرآنية بوصفها عبرة لا سيرة أشخاص وأسماء وأماكن."
  en: "A lesson series by Omar Abdelkafy, given during the blessed month he calls the month of mercy. Each episode takes one story from the Qur'an or from a sound hadith, tells it, and then draws the lessons from it. The first episode sets out his method: the Qur'anic story is told for its lesson, not for the names, places or dates of its people."
  ur: "عمر عبد الکافی کا درسی سلسلہ، جو اس بابرکت مہینے میں پیش کیا جاتا ہے جسے وہ رحمت کا مہینہ کہتے ہیں۔ ہر قسط میں قرآن یا صحیح حدیث سے ایک واقعہ بیان کیا جاتا ہے اور پھر اس سے نصیحتیں اخذ کی جاتی ہیں۔ پہلی قسط میں ان کا طریقہ بیان ہوتا ہے: قرآنی قصہ عبرت کے لیے ہے، اس کے کرداروں کے ناموں، جگہوں یا تاریخوں کے لیے نہیں۔"
  es: "Una serie de lecciones de Omar Abdelkafy, impartidas durante el bendito mes que él llama el mes de la misericordia. Cada episodio toma una historia del Corán o de un hadiz auténtico, la narra y luego extrae las enseñanzas de ella. El primer episodio expone su método: la historia coránica se cuenta por su enseñanza, no por los nombres, lugares o fechas de sus personajes."
  fr: "Une série de leçons d'Omar Abdelkafy, diffusée durant le mois béni qu'il nomme le mois de la miséricorde. Chaque épisode s'appuie sur un récit du Coran ou d'un hadith authentique, le relate, puis en tire des enseignements. Le premier épisode expose sa méthode: le récit coranique est raconté pour sa leçon, et non pour les noms, les lieux ou les dates des personnages."
  tr: "Omer Abdelkafi'nin kutsal ay boyunca sunduğu bir dizi ders var; her bölümde Kur'an'dan bir hikaye veya özgün hadis sunuluyor ve bu hikayelerden dersler çıkarılıyor. İlk bölüm, Kur'an hikâyelerini bireylerin, isimlerin veya yerlerin biyografisi olarak değil, bir ders olarak sunma yaklaşımının yolunu açıyor."
  id: "Serangkaian pelajaran oleh Omar Abdelkafi disajikan selama bulan suci, setiap episode menyajikan kisah dari Al-Qur'an atau hadis otentik, dari mana pelajaran diambil dari sana. Episode pertama membuka jalan bagi pendekatannya dalam menyajikan kisah-kisah Al-Qur'an sebagai pelajaran, bukan sebagai biografi individu, nama, atau tempat."
