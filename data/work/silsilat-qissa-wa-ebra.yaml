label:
  ar: "سلسلة قصة وعبر (برنامج)"
  en: "Qissa wa 'Ibar (lecture series)"
  ur: "قصہ و عبر (لیکچر سلسلہ)"
summary:
  ar: "سلسلة دروس لعمر عبد الكافي يقدّمها خلال الشهر الكريم، تعرض كل حلقة فيها قصة من القرآن الكريم أو من الحديث الصحيح ثم تستخلص منها العبر. الحلقة الأولى تمهّد لمنهجه في عرض القصص القرآنية بوصفها عبرة لا سيرة أشخاص وأسماء وأماكن."
  en: "A lesson series by Omar Abdelkafy, given during the blessed month he calls the month of mercy. Each episode takes one story from the Qur'an or from a sound hadith, tells it, and then draws the lessons from it. The first episode sets out his method: the Qur'anic story is told for its lesson, not for the names, places or dates of its people."
  ur: "عمر عبد الکافی کا درسی سلسلہ، جو اس بابرکت مہینے میں پیش کیا جاتا ہے جسے وہ رحمت کا مہینہ کہتے ہیں۔ ہر قسط میں قرآن یا صحیح حدیث سے ایک واقعہ بیان کیا جاتا ہے اور پھر اس سے نصیحتیں اخذ کی جاتی ہیں۔ پہلی قسط میں ان کا طریقہ بیان ہوتا ہے: قرآنی قصہ عبرت کے لیے ہے، اس کے کرداروں کے ناموں، جگہوں یا تاریخوں کے لیے نہیں۔"
