label: { ar: "قرار مجمع الفقه الإسلامي الدولي 120 (13/2) بشأن زكاة الزراعة", en: "IIFA resolution 120 (13/2) on zakat on agriculture", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 120 (13/2): زراعت کی زکوٰۃ", es: "Resolución 120 (13/2) de la IIFA sobre el zakat en la agricultura.", fr: "Résolution 120 (13/2) de l'IIFA sur la zakat agricole", tr: "Tarım Zekatı ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 120 (13/2)", id: "Resolusi Akademi Fiqh Islam Internasional 120 (13/2) mengenai Zakat Pertanian" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩. قرر: لا تُحسم من وعاء الزكاة نفقات السقي لأنها معتبرة في مقدار الواجب؛ ولا تُحسم نفقات إصلاح الأرض وشق القنوات ونقل التربة؛ ونفقات شراء البذور والسماد والمبيدات وما يتعلق بموسم الزرع إذا أنفقها المزكي من ماله لا تُحسم، أما إذا استدان لها لعدم توافر مال فتُحسم — مستندًا إلى آثار عن بعض الصحابة منهم ابن عمر وابن عباس من أن المزارع يخرج ما استدان على ثمرته ثم يزكي ما بقي؛ ثم تناول ما يُحسم من مقدار الزكاة الواجبة وضوابطه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001). It ruled: irrigation costs are not deducted from the zakat base since they are already weighed in the amount due; land-reclamation, canal-digging and earth-moving costs are not deducted; the costs of seed, fertiliser and pest control tied to the crop season are not deducted when the payer spends them from his own money, but are deducted when he must borrow for want of funds — on the basis of reports from Companions including Ibn Umar and Ibn Abbas that the farmer pays what he borrowed on the yield then gives zakat on what remains; it then treated what may be deducted from the obligatory amount and its controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں۔ فیصلے: آبپاشی کے اخراجات زکوٰۃ کے حساب سے منہا نہیں کیے جائیں گے کیونکہ وہ واجب مقدار میں پہلے ہی لحاظ میں ہیں؛ زمین کی اصلاح، نہریں کھودنا اور مٹی کی نقل کے اخراجات منہا نہیں؛ بیج، کھاد اور کیڑے مار ادویات کے اخراجات موسم سے متعلق ہوں تو اگر زکوٰۃ دینے والا اپنے مال سے ادا کرے تو منہا نہیں، اور اگر ندارد پر قرض لینا پڑے تو منہا ہوں گے — صحابہ میں سے ابن عمر اور ابن عباس سے منقول اثر کی اساس پر کہ کسان پیداوار میں سے قرض ادا کر کے باقی پر زکوٰۃ نکالتا ہے؛ پھر واجب مقدار میں سے کٹوتی اور اس کے ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 13.ª sesión en Kuwait (7-12 de Shawwal de 1422, 22-27 de diciembre de 2001). Dictaminó: los costos de riego no se deducen de la base del zakat, ya que ya están incluidos en el monto adeudado; los costos de recuperación de tierras, excavación de canales y movimiento de tierras no se deducen; los costos de semillas, fertilizantes y control de plagas vinculados a la temporada de cultivo no se deducen cuando el pagador los gasta con su propio dinero, pero sí se deducen cuando debe pedir prestado por falta de fondos, basándose en informes de Compañeros como Ibn Umar e Ibn Abbas que indican que el agricultor paga lo que pidió prestado sobre la cosecha y luego da el zakat sobre lo que queda; luego trató lo que se puede deducir del monto obligatorio y sus controles."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 13e session au Koweït (7-12 Shawwal 1422, 22-27 décembre 2001) a statué que les frais d'irrigation ne sont pas déductibles de l'assiette de la zakat, car ils sont déjà inclus dans le montant dû; les coûts de bonification des terres, de creusement de canaux et de terrassement ne sont pas déductibles; les coûts des semences, des engrais et de la lutte antiparasitaire liés à la saison des récoltes ne sont pas déductibles lorsque le payeur les dépense sur ses propres fonds, mais le sont lorsqu'il doit emprunter faute de fonds – sur la base de récits de Compagnons, notamment Ibn Umar et Ibn Abbas, selon lesquels l'agriculteur rembourse son emprunt sur la récolte puis verse la zakat sur le solde; l'Académie a ensuite examiné les éléments déductibles du montant obligatoire et ses modalités de contrôle."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on üçüncü oturumunda (7–12 Şevval 1422H, 22–27 Aralık 2001) toplu kararı alınmıştır. Karar: Sulama masrafları zekat konteynerinden düşülmez çünkü bunlar yükümlülüğün bir parçası olarak kabul edilir; toprak onarımı, kanal kazma, toprak taşıma, tohum, gübre, pestisit ve ekim sezonuyla ilgili giderler ise zekat ödeyen kendi parasından düşülmez. Ancak, maddi yetersizlik nedeniyle borç alırsa, İbn Ömer ve İbn Abbas gibi bazı arkadaşların anlatımlarına dayanarak, çiftçinin meyvesinden ödünç aldığı miktarı ödediği ve kalanını zekatı verdiği; ardından zorunlu zekat miktarından ve düzenlemelerinden düşülen kısmı aldığı anlatımlarına dayanarak düşülür."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi ketiga belas di Kuwait (7–12 Syawal 1422H, 22–27 Desember 2001). Diputuskan: Biaya irigasi tidak dipotong dari wadah zakat karena dianggap sebagai bagian dari kewajiban; biaya perbaikan lahan, penggalian kanal, pengangkutan tanah, pembelian benih, pupuk, pestisida, dan terkait musim tanam jika pembayar zakat membelanjakannya dari uangnya sendiri tidak dikurangkan. Namun, jika dia meminjam uang karena kekurangan dana, dia dikurangi—berdasarkan cerita dari beberapa sahabat, termasuk Ibn Umar dan Ibn Abbas, bahwa petani membayar apa yang dipinjam dari buahnya dan kemudian zakat; kemudian dia mengambil apa yang dikurangkan dari jumlah zakat wajib dan peraturannya."
