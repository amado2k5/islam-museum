id: work/fatwa-iifa-120-zakat-agriculture
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 120 (13/2) بشأن زكاة الزراعة", en: "IIFA resolution 120 (13/2) on zakat on agriculture", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 120 (13/2): زراعت کی زکوٰۃ" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩. قرر: لا تُحسم من وعاء الزكاة نفقات السقي لأنها معتبرة في مقدار الواجب؛ ولا تُحسم نفقات إصلاح الأرض وشق القنوات ونقل التربة؛ ونفقات شراء البذور والسماد والمبيدات وما يتعلق بموسم الزرع إذا أنفقها المزكي من ماله لا تُحسم، أما إذا استدان لها لعدم توافر مال فتُحسم — مستندًا إلى آثار عن بعض الصحابة منهم ابن عمر وابن عباس من أن المزارع يخرج ما استدان على ثمرته ثم يزكي ما بقي؛ ثم تناول ما يُحسم من مقدار الزكاة الواجبة وضوابطه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001). It ruled: irrigation costs are not deducted from the zakat base since they are already weighed in the amount due; land-reclamation, canal-digging and earth-moving costs are not deducted; the costs of seed, fertiliser and pest control tied to the crop season are not deducted when the payer spends them from his own money, but are deducted when he must borrow for want of funds — on the basis of reports from Companions including Ibn Umar and Ibn Abbas that the farmer pays what he borrowed on the yield then gives zakat on what remains; it then treated what may be deducted from the obligatory amount and its controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں۔ فیصلے: آبپاشی کے اخراجات زکوٰۃ کے حساب سے منہا نہیں کیے جائیں گے کیونکہ وہ واجب مقدار میں پہلے ہی لحاظ میں ہیں؛ زمین کی اصلاح، نہریں کھودنا اور مٹی کی نقل کے اخراجات منہا نہیں؛ بیج، کھاد اور کیڑے مار ادویات کے اخراجات موسم سے متعلق ہوں تو اگر زکوٰۃ دینے والا اپنے مال سے ادا کرے تو منہا نہیں، اور اگر ندارد پر قرض لینا پڑے تو منہا ہوں گے — صحابہ میں سے ابن عمر اور ابن عباس سے منقول اثر کی اساس پر کہ کسان پیداوار میں سے قرض ادا کر کے باقی پر زکوٰۃ نکالتا ہے؛ پھر واجب مقدار میں سے کٹوتی اور اس کے ضوابط۔"
