label: { ar: "الاستثمار الحلال في الأسهم: المعايير الشرعية مشروحة", en: "Halal Stock Investing: Shariah Standards Explained", ur: "حلال اسٹاک سرمایہ کاری: شرعی معیارات", es: "Inversión en acciones halal: Explicación de las normas de la Sharia", fr: "Investir en actions halal: Explication des normes de la charia", tr: "Hisse Senetlerine Helal Yatırım: Şeriat Standartları Açıklanıyor", id: "Investasi Halal di Saham: Penjelasan Standar Syariah" }
summary:
  ar: "ورقة للشيخ عمر خان نشرها موقع المجلس الفقهي لأمريكا الشمالية ⁦(يناير 2024)⁩ تشرح معايير الشريعة للاستثمار في الأسهم من نشأة الشركات المساهمة إلى ضوابط التنقية على ما فصّلته الورقة."
  en: "A paper by Shaykh Umer Khan published on the Fiqh Council of North America site (January 2024) explaining the sharia standards for halal stock investing — from the rise of joint-stock companies to the purification rules — as the paper details."
  ur: "شیخ عمر خان کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(جنوری 2024)⁩ حلال اسٹاک سرمایہ کاری کے شرعی معیارات پر — کمپنیوں کے آغاز سے پاکی کے اصولوں تک — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del jeque Umer Khan, publicado en el sitio web del Consejo de Fiqh de Norteamérica (enero de 2024), explica las normas de la sharia para la inversión en acciones halal, desde el surgimiento de las sociedades anónimas hasta las reglas de purificación, como se detalla en el artículo."
  fr: "Un article du cheikh Umer Khan publié sur le site du Conseil Fiqh d'Amérique du Nord (janvier 2024) explique les normes de la charia pour l'investissement en actions halal — de l'essor des sociétés par actions aux règles de purification — comme le détaille l'article."
  tr: "Şeyh Ömer Khan'ın Kuzey Amerika Fiqh Konseyi web sitesinde yayımlanan (Ocak 2024) makalesi, anonim şirketlerin kurulmasından tasfiye kontrollerine kadar olan şeriat yatırımı standartlarını açıklamakta, makalede ayrıntılı olarak açıklanmaktadır."
  id: "Sebuah makalah oleh Sheikh Omar Khan yang diterbitkan di situs web North American Fiqh Council (Januari 2024) menjelaskan standar Syariah untuk investasi saham, mulai dari pendirian perusahaan saham gabungan hingga kontrol likuidasi, sebagaimana dijelaskan dalam makalah tersebut."
