id: work/fatwa-aliftaa-jo-haemorrhoid-bleeding-after-wudu
class: work
kind: fatwa
label: { ar: "خروج دم الباسور بعد الوضوء", en: "Haemorrhoid bleeding after wudu", ur: "وضو کے بعد بواسیر کا خون نکلنا" }
summary:
  ar: "سؤال عن خروج دم الباسور بعد الفراغ من الوضوء، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا ينقض الوضوء إن خرج من خارج الدبر، وينقضه إن خرج من داخله، وأن من استمر نزوله يأخذ حكم سلس البول. أجابت الدائرة بأن الدم إن كان يخرج من خارج الدبر بسبب بروز الباسور فلا ينقض الوضوء، لأن الدم الخارج من البدن من غير السبيلين لا ينقضه. وقالت إنه إن خرج من الدبر بأن كان الباسور داخله فهو ناقض للوضوء، فيجب الاستنجاء منه وغسل موضع النجاسة وإعادة الوضوء. وأضافت أن الدم إن كان ينزل باستمرار بحيث لا يبقى زمن يسع الطهارة والصلاة دون نزوله أخذ حكم سلس البول، فيتنظف منه بعد دخول وقت كل صلاة ويتوضأ بعده مباشرة ويصلي الفرض مباشرة، ولا شيء عليه إن نزل منه شيء بعد ذلك، وله أن يصلي ما شاء من النوافل، فإن أراد فرضًا آخر وجب عليه التنظف والوضوء."
  en: "A question about haemorrhoid bleeding after finishing wudu, in which Jordan's General Iftaa Department answered that it does not break wudu if it comes from outside the anus, does break it if it comes from inside, and that continuous bleeding takes the ruling of urinary incontinence. The Department answered that if the blood comes from outside the anus, because the haemorrhoid protrudes, it does not break wudu, since blood leaving the body from anywhere other than the two passages does not break it. It said that if the blood comes out of the anus, the haemorrhoid being inside, it breaks wudu, so one must cleanse it, wash the place of the impurity and repeat wudu. It added that if the blood flows continuously, so that there is no interval long enough for purification and prayer without it, it takes the ruling of urinary incontinence: one cleans it after the time of each prayer begins, performs wudu straight after and prays the obligatory prayer at once; nothing more is required if some then comes out, and one may pray as many voluntary prayers as one wishes, but another obligatory prayer requires cleaning and wudu again."
  ur: "وضو سے فارغ ہونے کے بعد بواسیر کا خون نکلنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر خون مقعد کے باہر سے نکلے تو وضو نہیں ٹوٹتا، اگر اندر سے نکلے تو ٹوٹ جاتا ہے، اور جس کا خون مسلسل نکلتا ہو اس پر سلس البول کا حکم ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر خون بواسیر کے باہر نکل آنے کی وجہ سے مقعد کے باہر سے نکلے تو وضو نہیں ٹوٹتا، کیونکہ دونوں راستوں کے علاوہ جسم سے نکلنے والا خون وضو نہیں توڑتا۔ اس نے کہا کہ اگر خون مقعد سے نکلے، یعنی بواسیر اندر ہو، تو یہ وضو توڑ دیتا ہے، لہٰذا اس سے استنجا، نجاست کی جگہ دھونا اور وضو دہرانا واجب ہے۔ اس نے مزید کہا کہ اگر خون مسلسل نکلتا ہو اور اتنا وقفہ نہ ملے جس میں طہارت اور نماز ہو سکے تو اس پر سلس البول کا حکم ہے: ہر نماز کا وقت داخل ہونے کے بعد صفائی کرے، اس کے فوراً بعد وضو کرے اور فوراً فرض پڑھے؛ اس کے بعد کچھ نکلے تو کچھ لازم نہیں، اور جتنے نفل چاہے پڑھ سکتا ہے، لیکن دوسرا فرض پڑھنے کے لیے دوبارہ صفائی اور وضو واجب ہے۔"
