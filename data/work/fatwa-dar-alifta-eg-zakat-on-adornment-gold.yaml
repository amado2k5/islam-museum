id: work/fatwa-dar-alifta-eg-zakat-on-adornment-gold
class: work
kind: fatwa
label: { ar: "حكم زكاة الذهب الذي تتخذه المرأة للزينة", en: "Zakat on the gold a woman keeps for adornment", ur: "عورت کے زیور کے سونے پر زکات کا حکم" }
summary:
  ar: "سائل سأل عن زكاة الذهب الذي تتخذه المرأة للزينة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22484)⁩ أنه لا زكاة على المرأة في الذهب الذي تملكه بقصد استعماله في التزين به والتحلي وإن كانت ستبيع منه شيئًا عند الحاجة على ما فصّل الجواب."
  en: "A questioner asked about zakat on the gold a woman keeps for adornment. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22484) answered that no zakat is due from a woman on gold she owns intending to wear it as ornament, even where she might sell some of it at need — as the answer details."
  ur: "ایک سائل نے عورت کے زیور کے لیے رکھے ہوئے سونے پر زکات کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22484)⁩ نے جواب دیا کہ عورت پر اس سونے کی زکات نہیں جو وہ زیور پہننے کی نیت سے رکھتی ہے، خواہ ضرورت پڑنے پر اس میں سے کچھ بیچ دے — جیسا کہ جواب میں تفصیل ہے۔"
