id: work/fatwa-dar-alifta-eg-slaughtering-pregnant-animal-unaware
class: work
kind: fatwa
label: { ar: "حكم الأضحية بالبهيمة التي في بطنها حمل دون علم قبل الذبح", en: "Udhiyya with an animal carrying young, unknown before slaughter", ur: "بچہ دار جانور کی قربانی جس کا علم ذبح سے پہلے نہ تھا", es: "Udhiyya con un animal que lleva crías, desconocido antes del sacrificio.", fr: "Udhiyya avec un animal portant un petit, inconnu avant l'abattage", tr: "Hamileliği bilinmeyen bir hayvanın kurban edilmesine ilişkin karar", id: "Putusan tentang pengorbanan hewan yang mengandung tanpa pengetahuan sebelum disembelih" }
summary:
  ar: "سائل سأل عن ذبح بهيمة حامل دون العلم بحملها قبل ذبحها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20825)⁩ أن ذبح البهيمة الحامل دون العلم بحملها قبل ذبحها لا يقدح في إجزائها عن الأضحية وللمسلم أن يأكل من ولدها على ما فصّل الجواب."
  en: "A questioner asked about slaughtering an animal carrying young without knowing of the pregnancy before slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20825) answered that it does not impair the udhiyya's sufficiency, and the Muslim may eat of the unborn young — as the answer details."
  ur: "ایک سائل نے بچہ دار جانور ذبح کرنے کا حکم پوچھا جس کی حمل کا علم ذبح سے پہلے نہ تھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20825)⁩ نے جواب دیا کہ یہ قربانی کے کافی ہونے کو متاثر نہیں کرتا اور مسلمان اس کے بچے کا گوشت کھا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de sacrificar un animal preñado sin conocer el embarazo antes del sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20825) respondió que esto no afecta la suficiencia de la udhiyya, y que el musulmán puede comer de la cría nonata, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'abattage d'un animal gestant sans connaissance préalable de la gestation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20825) a répondu que cela ne compromet pas la suffisance de l'udhiyya et que le musulman peut consommer la viande du fœtus, comme le précise la réponse."
  tr: "Bir soru soran, hamile bir hayvanın hamile olduğunu bilmeden kesim yapılması hakkında soru sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 20825), hamile bir hayvanın kesimden önce hamile olduğunu bilmeden kesilmesinin kurbanın parçalarını geçersiz kılmadığını ve bir Müslümanın yavrularından yemek yiyebileceğini yanıtladı; bu yanıtta detaylandırılmıştır."
  id: "Seorang penanya bertanya tentang penyembelihan hewan hamil tanpa mengetahui bahwa hewan itu hamil sebelum disembelih. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20825) menjawab bahwa menyembelih hewan hamil tanpa mengetahui bahwa hewan itu hamil sebelum disembelih tidak menghilangkan bagiannya dari korban, dan seorang Muslim dapat memakan dari keturunannya, seperti yang dijelaskan dalam jawaban."
