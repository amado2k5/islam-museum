id: work/fatwa-amja-fitra-acts-wudu-barrier
class: work
kind: fatwa
label: { ar: "سنن الفطرة والوضوء", en: "The fitra's ways — removing barriers before wudu", ur: "فطرت کے سنن — وضو سے پہلے حائل ہٹانا" }
summary:
  ar: "سأل سائل أنه إذا تحرى الحق في مسألة فتبين له أنه أخطأ فهل يعيد. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78638 بتاريخ 23 أبريل 2009)⁩ أن على المسلم الالتزام بسنن الفطرة التي منها قص الأظافر وإزالة أي حائل على أعضاء الوضوء أو الاغتسال فإن كان ما مضى قد حال دون وصول الماء فعليه إعادة ما بطل وإلا فلا إعادة على ما فصّل الجواب."
  en: "A questioner asked whether erring after seeking the truth on a matter obliges repeating. Dr. Salah al-Sawi (fatwa no. 78638, 23 April 2009) answered that a Muslim keeps to the fitra's ways — trimming the nails and removing any barrier on the wudu or washing limbs; if what passed had barred water's reaching, he repeats what was void, else no repetition — as the answer details."
  ur: "وضو میں حائل رہ گیا ہو تو اعادہ؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78638، 23 اپریل 2009)⁩ کے مطابق فطری سنن رعایت کریں؛ حائل ثابت ہو تو باطل وضو دہرائے۔"
