id: work/fatwa-dar-alifta-eg-ration-card-misuse
class: work
kind: fatwa
label: { ar: "حكم التصرف في كارت التموين", en: "Misusing the ration card", ur: "راشن کارڈ میں تصرف کا حکم" }
summary:
  ar: "سائل سأل عن التصرف في كارت التموين على خلاف المخصص له. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21828)⁩ أن التصرف في كارت التموين واستخدامه مقيد بما حددته الجهات المختصة وعلى القدر الذي حددته وأي مخالفة لذلك لها حكمها على ما فصّل الجواب."
  en: "A questioner asked about disposing of a ration card contrary to its allocation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21828) answered that use of the ration card is bound by what the competent authorities have set and to the extent they set; any departure carries its ruling, as the answer details."
  ur: "ایک سائل نے راشن کارڈ کو اس کے مقررہ استعمال کے خلاف استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21828)⁩ نے جواب دیا کہ کارڈ کا استعمال متعلقہ حکام کی مقرر کردہ حدود میں ہے اور اس کی خلاف ورزی کا اپنا حکم ہے — جیسا کہ جواب میں تفصیل ہے۔"
