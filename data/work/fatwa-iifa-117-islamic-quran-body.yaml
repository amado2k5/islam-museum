id: work/fatwa-iifa-117-islamic-quran-body
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 117 (12/11) بشأن إنشاء هيئة إسلامية للقرآن الكريم", en: "IIFA resolution 117 (12/11) on establishing an Islamic body for the Qur'an", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 117 (12/11): قرآنِ کریم کے لیے اسلامی ادارے کا قیام", es: "Resolución 117 (12/11) de la IIFA sobre el establecimiento de un organismo islámico para el Corán.", fr: "Résolution 117 (12/11) de l'IIFA sur la création d'un organisme islamique pour le Coran" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد دراسته بنود ومحتويات ورقة عمل بشأن إنشاء هيئة إسلامية عالمية للقرآن الكريم مقدمة من وزارة الأوقاف والشؤون الإسلامية بدولة قطر. قرر التنسيق بين وزارة الأوقاف بدولة قطر ووزارة الأوقاف بالسعودية ومجمع الملك فهد لطباعة المصحف الشريف بالمدينة المنورة في هذا الشأن. قرار تنظيمي لا حكم فقهي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after studying the clauses and contents of a working paper on establishing an international Islamic body for the Qur'an, submitted by Qatar's Ministry of Awqaf and Islamic Affairs. It resolved to coordinate between Qatar's awqaf ministry, Saudi Arabia's awqaf ministry and the King Fahd Complex for the Printing of the Holy Qur'an in Medina on the matter. An organisational resolution, not a juristic ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، قطر کی وزارت اوقاف و امورِ دینیہ کی پیش کردہ قرآنِ کریم کے لیے عالمی اسلامی ادارے کے قیام پر ورکنگ پیپر کی دفعات کے مطالعے کے بعد۔ فیصلہ: قطر کی وزارت اوقاف، سعودی وزارت اوقاف اور مدینہ کے شاہ فہد مصحف پرنٹنگ کمپلیکس کے مابین اس معاملے میں رابطہ قائم ہو۔ یہ تنظیمی فیصلہ ہے، فقہی حکم نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica, adoptada en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, del 23 al 28 de septiembre de 2000), tras estudiar las cláusulas y el contenido de un documento de trabajo sobre el establecimiento de un organismo islámico internacional para el Corán, presentado por el Ministerio de Asuntos Islámicos y de la Fundación Awqaf de Qatar. Se resolvió coordinar las acciones entre el Ministerio de Asuntos Awqaf de Qatar, el Ministerio de Asuntos Awqaf de Arabia Saudita y el Complejo Rey Fahd para la Impresión del Sagrado Corán en Medina sobre este asunto. Se trata de una resolución organizativa, no de una resolución jurídica."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), après examen des clauses et du contenu d'un document de travail relatif à la création d'un organisme islamique international pour le Coran, présenté par le ministère qatari des Awqaf et des Affaires islamiques. Elle a décidé de coordonner les actions entre le ministère qatari des Awqaf, le ministère saoudien des Awqaf et le Complexe du roi Fahd pour l'impression du Saint Coran à Médine sur cette question. Il s'agit d'une résolution d'organisation, et non d'une décision juridique."
