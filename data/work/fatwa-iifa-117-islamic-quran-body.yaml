label: { ar: "قرار مجمع الفقه الإسلامي الدولي 117 (12/11) بشأن إنشاء هيئة إسلامية للقرآن الكريم", en: "IIFA resolution 117 (12/11) on establishing an Islamic body for the Qur'an", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 117 (12/11): قرآنِ کریم کے لیے اسلامی ادارے کا قیام" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بعد دراسته بنود ومحتويات ورقة عمل بشأن إنشاء هيئة إسلامية عالمية للقرآن الكريم مقدمة من وزارة الأوقاف والشؤون الإسلامية بدولة قطر. قرر التنسيق بين وزارة الأوقاف بدولة قطر ووزارة الأوقاف بالسعودية ومجمع الملك فهد لطباعة المصحف الشريف بالمدينة المنورة في هذا الشأن. قرار تنظيمي لا حكم فقهي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), after studying the clauses and contents of a working paper on establishing an international Islamic body for the Qur'an, submitted by Qatar's Ministry of Awqaf and Islamic Affairs. It resolved to coordinate between Qatar's awqaf ministry, Saudi Arabia's awqaf ministry and the King Fahd Complex for the Printing of the Holy Qur'an in Medina on the matter. An organisational resolution, not a juristic ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، قطر کی وزارت اوقاف و امورِ دینیہ کی پیش کردہ قرآنِ کریم کے لیے عالمی اسلامی ادارے کے قیام پر ورکنگ پیپر کی دفعات کے مطالعے کے بعد۔ فیصلہ: قطر کی وزارت اوقاف، سعودی وزارت اوقاف اور مدینہ کے شاہ فہد مصحف پرنٹنگ کمپلیکس کے مابین اس معاملے میں رابطہ قائم ہو۔ یہ تنظیمی فیصلہ ہے، فقہی حکم نہیں۔"
