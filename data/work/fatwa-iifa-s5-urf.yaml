summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: العرف ما اعتاده الناس وساروا عليه من قول أو فعل أو ترك وقد يكون معتبرًا شرعًا أو غير معتبر، فإن كان خاصًّا اعتبر عند أهله وإن كان عامًّا اعتبر في حق الجميع، والمعتبر شرعًا ما استجمع شروطه التي فصّلها القرار."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on custom (urf): custom is what people habitually do or leave in word and deed, and may be sharia-recognised or not; a particular custom binds its people, a general one binds all, and the sharia-recognised custom is whatever meets the conditions the resolution sets out."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩ عرف پر: خاص عرف اپنے اہل پر اور عام عرف سب پر معتبر ہے؛ شرعی اعتبار کی شرائط بیان ہوئیں۔"
