label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن العرف", en: "IIFA resolution on custom (urf)", ur: "اکیڈمی کی قرارداد: عرف", es: "Resolución de la IIFA sobre aduanas (urf)", fr: "Résolution IIFA sur personnalisé (urf)", tr: "Uluslararası İslami Fiqh Akademisi'nin gelenekle ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai adat istiadat" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: العرف ما اعتاده الناس وساروا عليه من قول أو فعل أو ترك وقد يكون معتبرًا شرعًا أو غير معتبر، فإن كان خاصًّا اعتبر عند أهله وإن كان عامًّا اعتبر في حق الجميع، والمعتبر شرعًا ما استجمع شروطه التي فصّلها القرار."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on custom (urf): custom is what people habitually do or leave in word and deed, and may be sharia-recognised or not; a particular custom binds its people, a general one binds all, and the sharia-recognised custom is whatever meets the conditions the resolution sets out."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩ عرف پر: خاص عرف اپنے اہل پر اور عام عرف سب پر معتبر ہے؛ شرعی اعتبار کی شرائط بیان ہوئیں۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre la costumbre (urf): la costumbre es lo que la gente habitualmente hace o deja de hacer de palabra y de hecho, y puede estar reconocida por la sharia o no; una costumbre particular vincula a su gente, una general vincula a todos, y la costumbre reconocida por la sharia es la que cumple las condiciones que establece la resolución."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988) sur la coutume (urf): la coutume est ce que les gens font ou laissent habituellement en paroles et en actes, et peut être reconnue ou non par la charia; une coutume particulière lie son peuple, une coutume générale lie tout le monde, et la coutume reconnue par la charia est celle qui répond aux conditions énoncées par la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin beşinci oturumunda (Kuveyt, Aralık 1988) kararı: Gelenek, insanların konuşma, eylem veya eksiklik açısından alıştığı ve takip ettiği şeydir. Dini olarak kabul edilebilir ya da kabul edilmez. Eğer özelse, hak ettiği kişiler tarafından kabul edilir; genel ise herkes için geçerlidir. Dini olarak kabul edilen, kararda belirtilen koşulları karşılayan şeydir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kelimanya (Kuwait, Desember 1988): Adat adalah apa yang telah menjadi kebiasaan dan diikuti oleh orang dalam hal ucapan, tindakan, atau kelalaian. Adat dapat dianggap secara religius atau tidak. Jika bersifat pribadi, dianggap oleh orang-orang yang berhak; jika bersifat umum, berlaku untuk semua orang. Yang dianggap secara religius adalah apa yang memenuhi syarat yang ditetapkan dalam keputusan."
