label: { en: "Amr ibn Salim's plea", ar: "استغاثة عمرو بن سالم" }
summary:
  en: "The verses Amr ibn Salim al-Khuza'i recited before the Prophet in the Medina mosque after the al-Watir attack, invoking the pact of the fathers for Banu Ka'b. Ibn Ishaq calls it part of what stirred the conquest of Mecca. Opening: «يا رب إني ناشد محمدًا حلف أبينا وأبيه الأتلدا»."
  ar: "الأبيات التي وقف بها عمرو بن سالم الخزاعي على النبي في مسجد المدينة بعد اعتداء الوتير، يناشده حلف الآباء لبني كعب؛ قال ابن إسحاق إنها «مما هاج فتح مكة». مطلعها: «يا رب إني ناشد محمدًا حلف أبينا وأبيه الأتلدا»."
