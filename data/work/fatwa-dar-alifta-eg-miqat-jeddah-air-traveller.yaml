id: work/fatwa-dar-alifta-eg-miqat-jeddah-air-traveller
class: work
kind: fatwa
label: { ar: "بيان ميقات الإحرام لمن يسافر لمدينة جدة جوًّا", en: "The ihram miqat for one flying to Jeddah", ur: "جہاز سے جدہ جانے والے کے لیے احرام کا میقات", es: "El ihram miqat para quien viaja a Jeddah", fr: "L'ihram miqat pour une personne se rendant à Djeddah" }
summary:
  ar: "سائل سأل عن ميقات من يسافر إلى جدة جوًّا قاصدًا النسك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23944)⁩ أن الأصل أن مريد النسك يحرم من ميقات بلده، فإذا جاوزه إلى ميقات آخر صار الثاني ميقاتًا له ويجوز له أن يحرم منه، ولا يجوز له تأخير الإحرام إلى ما بعده على ما فصّل الجواب في أحوال المسافر جوًّا."
  en: "A questioner asked the miqat for one flying to Jeddah intending the rites. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23944) answered that in principle one intending the rites assumes ihram from his own country's miqat; if he passes it to a further miqat, that becomes his miqat from which he may assume ihram — and he may not delay ihram beyond it, as the answer details for the air traveller's cases."
  ur: "ایک سائل نے جدہ طیارے سے مناسک کی نیت سے جانے والے کا میقات پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23944)⁩ نے جواب دیا کہ اصولاً مناسک کا مرید اپنے ملک کے میقات سے احرام باندھتا ہے؛ اگر وہ اسے عبور کر کے کسی آگے کے میقات تک جائے تو وہی دوسرا میقات اس کا ہو جاتا ہے جس سے وہ احرام باندھ سکتا ہے — اور اس سے آگے احرام مؤخر نہیں کر سکتا، جیسا کہ جواب میں ہوائی مسافر کی صورتوں کے لیے تفصیل ہے۔"
  es: "Un consultante consultó sobre el miqat para una persona que viajaba a Yeda con la intención de realizar los ritos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23944) respondió que, en principio, quien realiza los ritos asume el ihram desde el miqat de su propio país; si lo traslada a otro miqat, este se convierte en su miqat desde el cual puede asumir el ihram, y no puede demorar el ihram más allá de este, como se detalla en la respuesta para los casos de viajeros aéreos."
  fr: "Une personne a posé la question du miqat pour un voyageur se rendant à Djeddah et souhaitant accomplir les rites. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23944) a répondu qu'en principe, celui qui souhaite accomplir les rites revêt l'ihram au miqat de son propre pays; s'il se rend ensuite à un autre miqat, ce dernier devient son miqat de référence pour l'ihram – et il ne peut le retarder au-delà, comme le précise la réponse pour le cas du voyageur aérien."
