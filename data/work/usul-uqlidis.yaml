label: { ar: "أصول أقليدس" }
summary:
  ar: "كتاب أقليدس في أصول الهندسة والحساب؛ حكي في شرح الأشكال لقاضي زاده الرومي أن بعض ملوك اليونان التمس من رجل بصور مبرز في الهندسة يقال له أقليدس تهذيب الكتاب وترتيبه فاشتهر باسمه، وفي رسالة الكندي في أغراض أقليدس أنه ألفه رجل يقال له أبلونيوس النجار فرسمه خمسة عشر قولًا فأمر أقليدس بإصلاحه ففسر ثلاث عشرة مقالة ووجد أسقلاوس تلميذه المقالتين الرابعة عشرة والخامسة عشرة؛ ونقله من اليونانية إلى العربية جماعة منهم حجاج بن يوسف الكوفي نقلين أحدهما الهاروني والثاني المأموني وعليه يعول، وحنين بن إسحاق، وثابت بن قرة الحراني، وأبو عثمان الدمشقي نقل منه مقالات؛ ومن شروحه شكوك ابن الهيثم وتفسير أبي جعفر الخازن للعاشرة وتحرير نصير الدين الطوسي {cite:kashf-zunun-furqan p. 549-552}."
  en: "Euclid's Elements in Arabic reception: al-Hajjaj ibn Yusuf's two translations (the Haruni and the Ma'muni, on which reliance is placed), Hunayn ibn Ishaq's version, Thabit ibn Qurra's revision, Ibn al-Haytham's doubts and Nasir al-Din al-Tusi's Tahrir {cite:kashf-zunun-furqan p. 549-552}."
