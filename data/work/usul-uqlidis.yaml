label: { ar: "أصول أقليدس", en: "Usul Uqlidis (Euclid's Elements)", es: "Usul Uqlidis (Los elementos de Euclides)", fr: "Usul Uqlidis (Les Éléments d'Euclide)", ur: "اصول عقلید ⁦(اقلیدس کے عناصر)⁩", tr: "Öklid'in Kökenleri", id: "Asal-usul Euclid" }
summary:
  ar: "كتاب أقليدس في أصول الهندسة والحساب؛ حكي في شرح الأشكال لقاضي زاده الرومي أن بعض ملوك اليونان التمس من رجل بصور مبرز في الهندسة يقال له أقليدس تهذيب الكتاب وترتيبه فاشتهر باسمه، وفي رسالة الكندي في أغراض أقليدس أنه ألفه رجل يقال له أبلونيوس النجار فرسمه خمسة عشر قولًا فأمر أقليدس بإصلاحه ففسر ثلاث عشرة مقالة ووجد أسقلاوس تلميذه المقالتين الرابعة عشرة والخامسة عشرة؛ ونقله من اليونانية إلى العربية جماعة منهم حجاج بن يوسف الكوفي نقلين أحدهما الهاروني والثاني المأموني وعليه يعول، وحنين بن إسحاق، وثابت بن قرة الحراني، وأبو عثمان الدمشقي نقل منه مقالات؛ ومن شروحه شكوك ابن الهيثم وتفسير أبي جعفر الخازن للعاشرة وتحرير نصير الدين الطوسي {cite:kashf-zunun-furqan p. 549-552}."
  en: "Euclid's Elements in Arabic reception: al-Hajjaj ibn Yusuf's two translations (the Haruni and the Ma'muni, on which reliance is placed), Hunayn ibn Ishaq's version, Thabit ibn Qurra's revision, Ibn al-Haytham's doubts and Nasir al-Din al-Tusi's Tahrir {cite:kashf-zunun-furqan p. 549-552}."
  es: "Los Elementos de Euclides en la recepción árabe: las dos traducciones de al-Hajjaj ibn Yusuf (el Haruni y el Ma'muni, en las que se confía), la versión de Hunayn ibn Ishaq, la revisión de Thabit ibn Qurra, las dudas de Ibn al-Haytham y el Tahrir de Nasir al-Din al-Tusi {citar:kashf-zunun-furqan p. 549-552}."
  fr: "Les éléments d'Euclide dans la réception arabe: les deux traductions d'al-Hajjaj ibn Yusuf (le Haruni et le Ma'muni, sur lesquels on s'appuie), la version de Hunayn ibn Ishaq, la révision de Thabit ibn Qurra, les doutes d'Ibn al-Haytham et le Tahrir de Nasir al-Din al-Tusi {cite:kashf-zunun-furqan p. 549-552}."
  ur: "عربی استقبال میں یوکلڈ کے عناصر: الحجاج ابن یوسف کے دو تراجم ⁦( ہارونی اور مامونی جس پر انحصار کیا جاتا ہے)⁩، حنین بن اسحاق کا نسخہ، ثابت ابن قرہ کا نظرثانی، ابن الہیثم کا شبہات اور ناصر الدین الطیر الطیر۔ {حوالہ: کشف الذنون فرقان ص۔ 549-552}۔"
  tr: "Öklid'in Geometri ve Aritmetik İlkeleri üzerine kitabı; Kadi Zada el-Rumi'nin şekillerin açıklamasında, bazı Yunan krallarının kitabı geliştirmesi ve düzenlemesi için belirgin geometrik figürlere sahip bir adam olan Öklid adında bir adamı istedikleri anlatılır; bu kitap onun adıyla ünlenmiştir. El-Kindi'nin Öklid'in amaçları üzerine yazdığı mektupta, Marangoz Apollonius adlı bir adam tarafından yazılmış, on beş ayet çizmiştir. Öklid bunların düzeltilmesini emretmiş ve on üç denemeyi yorumlamıştır. Askleus öğrencisine on dördüncü ve on beşinci denemeleri bulmuştur; Hacı ibn Yusuf el-Kufi de dahil olmak üzere bir grup tarafından Yunancadan Arapçaya çevirmiştir. Ya'awil'in kopyaladığı iki verici, biri el-Haruni diğeri el-Me'muni, Hunayn ibn İshaq, Tebit bin Kurrah el-Harrani ve Ebu Osman el-Dimashqi ondan makaleler iletmiştir; tefsirleri arasında İbn el-Heytham'ın şüpheleri, Ebu Ca'fer el-Khazin'in tafsir-el-Aşira ve Tahrir Nasir al-Din al-Tusi {atıf:kaşf-zunun-furqan, s. 549-552} bulunmaktadır."
  id: "Buku Euclid tentang Prinsip Geometri dan Aritmatika; diceritakan dalam penjelasan bentuk-bentuk oleh Qadi Zada al-Rumi bahwa beberapa raja Yunani meminta seorang pria dengan figur geometris terkenal bernama Euclid untuk menyempurnakan dan mengatur buku tersebut, yang kemudian menjadi terkenal dengan namanya. Dalam surat Al-Kindi tentang tujuan Euclid, surat itu ditulis oleh seorang pria bernama Apollonius si Tukang Kayu, yang menggambar lima belas bait. Euclid memerintahkan agar esai tersebut diperbaiki, dan ia menafsirkan tiga belas esai. Ascleus menemukan muridnya esai keempat belas dan kelima belas; ia menerjemahkannya dari bahasa Yunani ke bahasa Arab oleh kelompok yang termasuk Hajjaj ibn Yusuf al-Kufi. Dua pemancar, satu al-Haruni dan satu al-Ma'muni yang menjadi penyalinan Ya'awil, Hunayn ibn Ishaq, Thabit ibn Qurrah al-Harrani, dan Abu Uthman al-Dimashqi mengirimkan artikel darinya; di antara komentarnya adalah keraguan Ibn al-Haytham, tafsir al-'Ashira karya Abu Ja'far al-Khazin, dan Tahrir Nasir al-Din al-Tusi {cite:kashf-zunun-furqan, hlm. 549-552}."
