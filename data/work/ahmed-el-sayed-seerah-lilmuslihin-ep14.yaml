id: work/ahmed-el-sayed-seerah-lilmuslihin-ep14
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 14: فضل الأنصار"
  en: "The Prophetic Biography for Reformers, episode 14: The Merit of the Ansar"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 14: انصار کی فضیلت"
  fr: "La biographie prophétique pour les réformateurs, épisode 14 : Le mérite des Ansar"
  es: "La biografía profética para los reformadores, episodio 14: El mérito de los Ansar"
summary:
  ar: "يتوقف المجلس الرابع عشر من سلسلة السيرة النبوية للمصلحين قبل الهجرة ليتحدث عن الأنصار جماعةً وأفرادا: وصية النبي الأخيرة بهم من فوق المنبر، وهويتهم في المدينة، وثباتهم في أحد، وسير سعد بن معاذ وأسيد بن حضير وثابت بن قيس وأبي طلحة وعبادة بن الصامت وأم حرام وحرام بن ملحان ومعاذ بن جبل. ويختم باستخلاص أن المعنى الذي نالوا لأجله الفضل، وهو نصرة الدين ورسوله، ما زال مفتوحا أمام المؤمنين من بعدهم."
  en: "The fourteenth session of the series on the Prophetic biography for reformers pauses before the migration to speak about the Ansar as a group and through individual figures: the Prophet's last sermon on them, their identity in Medina, their steadfastness at Uhud, and the lives of Sa'd ibn Mu'adh, Usayd ibn Hudayr, Thabit ibn Qays, Abu Talha, Ubada ibn al-Samit, Umm Haram, Haram ibn Milhan and Mu'adh ibn Jabal. He closes with the lesson that the meaning behind their merit, supporting the religion and its messenger, remains open to later believers."
  ur: "سیرت نبوی برائے مصلحین کی چودھویں نشست ہجرت سے پہلے رک کر انصار کا ذکر کرتی ہے، ایک جماعت کے طور پر بھی اور افراد کے حوالے سے بھی: منبر سے نبی کی آخری وصیت، مدینہ میں ان کی شناخت، احد میں ان کی ثابت قدمی، اور سعد بن معاذ، اسید بن حضیر، ثابت بن قیس، ابو طلحہ، عبادہ بن صامت، ام حرام، حرام بن ملحان اور معاذ بن جبل کی زندگیاں۔ اختتام اس سبق پر ہوتا ہے کہ جس معنی کی بنا پر انصار کو فضیلت ملی، یعنی دین اور اس کے رسول کی نصرت، وہ بعد کے مومنوں کے لیے اب بھی کھلا ہے۔"
  fr: "La quatorzième séance de la série sur la biographie prophétique pour les réformateurs s'arrête avant l'hégire pour parler des Ansar, en tant que groupe et à travers des figures individuelles : le dernier sermon du Prophète à leur sujet, leur identité à Médine, leur fermeté à Uhud, et les vies de Sa'd ibn Mu'adh, Usayd ibn Hudayr, Thabit ibn Qays, Abu Talha, Ubada ibn al-Samit, Umm Haram, Haram ibn Milhan et Mu'adh ibn Jabal. Il conclut que le sens pour lequel ils ont reçu ce mérite, soutenir la religion et son messager, reste ouvert aux croyants venus après eux."
  es: "La decimocuarta sesión de la serie sobre la biografía profética para reformadores se detiene antes de la hégira para hablar de los Ansar como grupo y a través de figuras individuales: el último sermón del Profeta sobre ellos, su identidad en Medina, su firmeza en Uhud y las vidas de Sa'd ibn Mu'adh, Usayd ibn Hudayr, Thabit ibn Qays, Abu Talha, Ubada ibn al-Samit, Umm Haram, Haram ibn Milhan y Mu'adh ibn Jabal. Concluye que el sentido por el cual recibieron ese mérito, apoyar la religión y a su mensajero, sigue abierto a los creyentes posteriores."
