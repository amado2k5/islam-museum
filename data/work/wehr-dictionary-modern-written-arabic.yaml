summary:
  ar: "معجم هانز فير، «معجم عربي ألماني للغة المكتوبة المعاصرة»، أهم مؤلفات المستشرق الألماني هانز فير ⁦(ولد في لايبتسك ١٩٠٩م)⁩، صدر في لايبتسك أعوام ١٩٥٢ و١٩٥٦ و١٩٥٨ ثم موسّعاً في فيسبادن ١٩٥٩ و١٩٦٨، وترجمه مع جون ميلتون كوان إلى الإنجليزية في إثاكا ١٩٦١م، وصدرت طبعة إنجليزية موسعة سنة ١٩٧٩م. المعجم محفوظ الحقوق ويوصف هنا ويُشار إليه فقط."
  en: "Hans Wehr's Arabic-German dictionary of modern written Arabic, the main work of the German Arabist (born at Leipzig in 1909). It appeared at Leipzig in 1952, 1956 and 1958, expanded at Wiesbaden in 1959 and 1968, and was translated into English with John Milton Cowan as A Dictionary of Modern Written Arabic (Ithaca 1961), with an expanded English edition in 1979. It remains in copyright; it is described and linked here, not hosted."
  es: "El diccionario árabe-alemán del árabe escrito moderno de Hans Wehr, obra principal del arabista alemán (nacido en Leipzig en 1909). Apareció en Leipzig en 1952, 1956 y 1958, ampliado en Wiesbaden en 1959 y 1968, y fue traducido al inglés con John Milton Cowan como A Dictionary of Modern Written Arabic (Ithaca 1961), con una edición inglesa ampliada en 1979. Sigue protegido por derechos de autor; aquí se describe y se enlaza, no se aloja."
  fr: "Le dictionnaire arabe-allemand de l'arabe écrit moderne de Hans Wehr, œuvre principale de l'arabisant allemand (né à Leipzig en 1909). Il parut à Leipzig en 1952, 1956 et 1958, augmenté à Wiesbaden en 1959 et 1968, et fut traduit en anglais avec John Milton Cowan sous le titre A Dictionary of Modern Written Arabic (Ithaca 1961), avec une édition anglaise augmentée en 1979. Il reste sous droit d'auteur ; il est décrit et signalé ici, non hébergé."
  ur: "ہانز ویر کی جدید تحریری عربی کی عربی–جرمن لغت، جرمن ماہرِ عربی ⁦(پیدائش لائپزگ 1909ء)⁩ کا اہم ترین کام۔ یہ لائپزگ میں 1952، 1956 اور 1958ء میں چھپی، وسبادن میں 1959 اور 1968ء میں وسیع ہوئی، اور جان ملٹن کوان کے ساتھ انگریزی میں A Dictionary of Modern Written Arabic کے نام سے ترجمہ ہوئی ⁦(اتھاکا 1961ء)⁩، وسیع انگریزی ایڈیشن 1979ء میں آیا۔ یہ کاپی رائٹ میں ہے؛ یہاں اس کا بیان اور حوالہ ہے، میزبانی نہیں۔"
