id: work/fatwa-aliftaa-jo-paying-olive-zakat-from-old-oil
class: work
kind: fatwa
label: { ar: "إخراج زكاة الزيتون من الزيت القديم", en: "Paying olive zakat from old oil", ur: "زیتون کی زکات پرانے تیل سے ادا کرنا" }
summary:
  ar: "سؤال عن إخراج زكاة الزيتون من زيت قديم بدل زيت المحصول الجديد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأكمل الإخراج من المحصول نفسه، وأن الزيت القديم يجزئ بشرط أن يماثل الجديد في الجودة، ونقلت اختلاف الشافعية والحنفية في المسألة. أجابت الدائرة بأن زكاة الزيتون تجب في قول عند الشافعية وهو مذهب الحنفية، فيُخرج العشر مما سُقي بلا كلفة ونصف العشر مما سُقي بكلفة، وأن نصابه خمسة أوسق تساوي نحو 611 كيلوغرامًا. وقالت إن الأصل أن يخرج المزكي من عين المحصول، لأن الزكاة تتعلق بالمال تعلق شركة، ونقلت ذلك عن الخطيب الشربيني في مغني المحتاج. ونقلت عن الشافعية جواز الإخراج من غير عين المال رفقًا بالمزكي بشرط مراعاة التماثل في الجودة، التي يحددها أهل الاختصاص بنسبة الحموضة في الزيت، ونقلت عن العمراني في البيان أن القدم ليس عيبًا عندهم. ونقلت عن الحنفية جواز إخراج القيمة، وعن ابن مازة في المحيط البرهاني أن أبا حنيفة وأبا يوسف لا يعتبران الجودة إذا أخرج من الجنس نفسه وتساوى القدر، وأن محمد بن الحسن يوجب دفع فرق القيمة. وخلصت إلى أن الإخراج من عين المحصول أكمل وأبرأ للذمة، لأن الإخراج من محصول سابق قد يكون فيه شبهة احتيال على الفقير بإعطائه زيتًا أقل قيمة، وأن من أخرج من الزيت القديم أجزأه إذا كان مماثلًا للجديد في الجودة."
  en: "A question about paying olive zakat from old oil instead of oil from the new harvest, in which Jordan's General Iftaa Department answered that paying from the harvest itself is best, that old oil counts if it matches the new in quality, and reported the differing Shafi'i and Hanafi views on the matter. The Department answered that zakat on olives is due according to one Shafi'i view and the Hanafi school: a tenth of what is rain-fed and a twentieth of what is irrigated at cost, with a minimum (nisab) of five awsuq, about 611 kilograms. It said the payer should in principle give from the harvest itself, because zakat attaches to the property as a form of partnership, citing al-Khatib al-Shirbini's Mughni al-Muhtaj. It reported the Shafi'i view that zakat may be paid from outside the property itself, as a concession to the payer, provided the quality matches, quality being judged by specialists through the oil's acidity, and quoted al-Imrani's al-Bayan that age alone is not a defect for them. It reported the Hanafi view that value may be paid instead, and quoted Ibn Maza's al-Muhit al-Burhani that Abu Hanifa and Abu Yusuf disregard quality when the payer gives the same kind in an equal amount, while Muhammad ibn al-Hasan requires the difference in value to be paid. It concluded that paying from the harvest itself is best and most certain to discharge the duty, since paying from an earlier harvest may carry a hint of cheating the poor by giving them oil of lower value, and that old oil counts if it matches the new in quality."
  ur: "نئی فصل کے تیل کی بجائے پرانے تیل سے زیتون کی زکات ادا کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فصل ہی سے ادا کرنا بہتر ہے، پرانا تیل معیار میں نئے کے برابر ہو تو کافی ہے، اور اس مسئلے میں شافعیہ اور حنفیہ کا اختلاف نقل کیا۔ ڈیپارٹمنٹ نے جواب دیا کہ زیتون پر زکات شافعیہ کے ایک قول اور حنفیہ کے مذہب کے مطابق واجب ہے: بارانی پر دسواں حصہ اور خرچ سے سیراب پر بیسواں حصہ، اور اس کا نصاب پانچ وسق یعنی تقریباً 611 کلوگرام ہے۔ اس نے کہا کہ اصلاً زکات فصل ہی سے دی جائے، کیونکہ زکات مال سے شراکت کی طرح متعلق ہوتی ہے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا۔ اس نے شافعیہ کا قول نقل کیا کہ زکات دینے والے کی سہولت کے لیے اصل مال کے علاوہ سے بھی ادا ہو سکتی ہے بشرطیکہ معیار برابر ہو، جس کا تعین ماہرین تیل کی تیزابیت سے کرتے ہیں، اور عمرانی کی البیان سے نقل کیا کہ ان کے نزدیک صرف پرانا ہونا عیب نہیں۔ اس نے حنفیہ کا قول نقل کیا کہ قیمت بھی ادا کی جا سکتی ہے، اور ابن مازہ کی المحیط البرہانی سے کہ ابو حنیفہ اور ابو یوسف کے نزدیک اسی جنس سے برابر مقدار دی جائے تو معیار کا اعتبار نہیں، جبکہ محمد بن الحسن قیمت کا فرق ادا کرنا لازم قرار دیتے ہیں۔ اس نے نتیجہ نکالا کہ فصل ہی سے ادا کرنا زیادہ کامل اور ذمہ داری سے بری ہونے کا یقینی طریقہ ہے، کیونکہ پچھلی فصل سے ادا کرنے میں فقیر کو کم قیمت تیل دے کر دھوکے کا شائبہ ہو سکتا ہے، اور پرانا تیل اگر معیار میں نئے کے برابر ہو تو کافی ہے۔"
