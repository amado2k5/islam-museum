id: work/fatwa-aliftaa-jo-paying-olive-zakat-from-old-oil
class: work
kind: fatwa
label: { ar: "إخراج زكاة الزيتون من الزيت القديم", en: "Paying olive zakat from old oil", ur: "زیتون کی زکات پرانے تیل سے ادا کرنا", es: "Pagar el zakat de oliva con aceite viejo", fr: "Payer la zakat sur les olives provenant de l'huile usagée", tr: "Eski yağdan zeytinlere zekat", id: "Zakat pada zaitun dari minyak tua" }
summary:
  ar: "سؤال عن إخراج زكاة الزيتون من زيت قديم بدل زيت المحصول الجديد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأكمل الإخراج من المحصول نفسه، وأن الزيت القديم يجزئ بشرط أن يماثل الجديد في الجودة، ونقلت اختلاف الشافعية والحنفية في المسألة. أجابت الدائرة بأن زكاة الزيتون تجب في قول عند الشافعية وهو مذهب الحنفية، فيُخرج العشر مما سُقي بلا كلفة ونصف العشر مما سُقي بكلفة، وأن نصابه خمسة أوسق تساوي نحو 611 كيلوغرامًا. وقالت إن الأصل أن يخرج المزكي من عين المحصول، لأن الزكاة تتعلق بالمال تعلق شركة، ونقلت ذلك عن الخطيب الشربيني في مغني المحتاج. ونقلت عن الشافعية جواز الإخراج من غير عين المال رفقًا بالمزكي بشرط مراعاة التماثل في الجودة، التي يحددها أهل الاختصاص بنسبة الحموضة في الزيت، ونقلت عن العمراني في البيان أن القدم ليس عيبًا عندهم. ونقلت عن الحنفية جواز إخراج القيمة، وعن ابن مازة في المحيط البرهاني أن أبا حنيفة وأبا يوسف لا يعتبران الجودة إذا أخرج من الجنس نفسه وتساوى القدر، وأن محمد بن الحسن يوجب دفع فرق القيمة. وخلصت إلى أن الإخراج من عين المحصول أكمل وأبرأ للذمة، لأن الإخراج من محصول سابق قد يكون فيه شبهة احتيال على الفقير بإعطائه زيتًا أقل قيمة، وأن من أخرج من الزيت القديم أجزأه إذا كان مماثلًا للجديد في الجودة."
  en: "A question about paying olive zakat from old oil instead of oil from the new harvest, in which Jordan's General Iftaa Department answered that paying from the harvest itself is best, that old oil counts if it matches the new in quality, and reported the differing Shafi'i and Hanafi views on the matter. The Department answered that zakat on olives is due according to one Shafi'i view and the Hanafi school: a tenth of what is rain-fed and a twentieth of what is irrigated at cost, with a minimum (nisab) of five awsuq, about 611 kilograms. It said the payer should in principle give from the harvest itself, because zakat attaches to the property as a form of partnership, citing al-Khatib al-Shirbini's Mughni al-Muhtaj. It reported the Shafi'i view that zakat may be paid from outside the property itself, as a concession to the payer, provided the quality matches, quality being judged by specialists through the oil's acidity, and quoted al-Imrani's al-Bayan that age alone is not a defect for them. It reported the Hanafi view that value may be paid instead, and quoted Ibn Maza's al-Muhit al-Burhani that Abu Hanifa and Abu Yusuf disregard quality when the payer gives the same kind in an equal amount, while Muhammad ibn al-Hasan requires the difference in value to be paid. It concluded that paying from the harvest itself is best and most certain to discharge the duty, since paying from an earlier harvest may carry a hint of cheating the poor by giving them oil of lower value, and that old oil counts if it matches the new in quality."
  ur: "نئی فصل کے تیل کی بجائے پرانے تیل سے زیتون کی زکات ادا کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فصل ہی سے ادا کرنا بہتر ہے، پرانا تیل معیار میں نئے کے برابر ہو تو کافی ہے، اور اس مسئلے میں شافعیہ اور حنفیہ کا اختلاف نقل کیا۔ ڈیپارٹمنٹ نے جواب دیا کہ زیتون پر زکات شافعیہ کے ایک قول اور حنفیہ کے مذہب کے مطابق واجب ہے: بارانی پر دسواں حصہ اور خرچ سے سیراب پر بیسواں حصہ، اور اس کا نصاب پانچ وسق یعنی تقریباً 611 کلوگرام ہے۔ اس نے کہا کہ اصلاً زکات فصل ہی سے دی جائے، کیونکہ زکات مال سے شراکت کی طرح متعلق ہوتی ہے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا۔ اس نے شافعیہ کا قول نقل کیا کہ زکات دینے والے کی سہولت کے لیے اصل مال کے علاوہ سے بھی ادا ہو سکتی ہے بشرطیکہ معیار برابر ہو، جس کا تعین ماہرین تیل کی تیزابیت سے کرتے ہیں، اور عمرانی کی البیان سے نقل کیا کہ ان کے نزدیک صرف پرانا ہونا عیب نہیں۔ اس نے حنفیہ کا قول نقل کیا کہ قیمت بھی ادا کی جا سکتی ہے، اور ابن مازہ کی المحیط البرہانی سے کہ ابو حنیفہ اور ابو یوسف کے نزدیک اسی جنس سے برابر مقدار دی جائے تو معیار کا اعتبار نہیں، جبکہ محمد بن الحسن قیمت کا فرق ادا کرنا لازم قرار دیتے ہیں۔ اس نے نتیجہ نکالا کہ فصل ہی سے ادا کرنا زیادہ کامل اور ذمہ داری سے بری ہونے کا یقینی طریقہ ہے، کیونکہ پچھلی فصل سے ادا کرنے میں فقیر کو کم قیمت تیل دے کر دھوکے کا شائبہ ہو سکتا ہے، اور پرانا تیل اگر معیار میں نئے کے برابر ہو تو کافی ہے۔"
  es: "Una pregunta sobre el pago del zakat de aceitunas con aceite viejo en lugar de aceite de la nueva cosecha, a la que el Departamento General de Iftaa de Jordania respondió que pagar con la cosecha misma es lo mejor, que el aceite viejo cuenta si iguala la calidad del nuevo, e informó sobre las diferentes opiniones shafi'íes y hanafíes al respecto. El Departamento respondió que el zakat sobre las aceitunas se debe según una opinión shafi'í y la escuela hanafí: una décima parte de lo que se cultiva con agua de secano y una vigésima parte de lo que se cultiva con agua de regadío al costo, con un mínimo (nisab) de cinco awsuq, aproximadamente 611 kilogramos. Dijo que el pagador debería, en principio, entregar con la cosecha misma, porque el zakat se vincula a la propiedad como una forma de sociedad, citando el Mughni al-Muhtaj de al-Khatib al-Shirbini. Se informó sobre la opinión shafi'í de que el zakat puede pagarse fuera de la propiedad misma, como una concesión al pagador, siempre que la calidad coincida, siendo la calidad juzgada por especialistas a través de la acidez del aceite, y se citó al-Bayan de al-Imrani, quien afirmó que la antigüedad por sí sola no es un defecto para ellos. Se informó sobre la opinión hanafí de que puede pagarse el valor en su lugar, y se citó al-Muhit al-Burhani de Ibn Maza, quien afirmó que Abu Hanifa y Abu Yusuf no tienen en cuenta la calidad cuando el pagador entrega el mismo tipo en igual cantidad, mientras que Muhammad ibn al-Hasan exige que se pague la diferencia de valor. Se concluyó que pagar con la cosecha misma es la mejor y más segura manera de cumplir con el deber, ya que pagar con una cosecha anterior puede implicar un engaño a los pobres al darles aceite de menor valor, y que el aceite viejo cuenta si coincide con el nuevo en calidad."
  fr: "Une question relative au paiement de la zakat sur les olives, calculée sur l'huile de la récolte précédente plutôt que sur celle de la nouvelle, a été posée. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que le paiement sur la récolte elle-même est préférable, que l'huile de la récolte précédente est admissible si sa qualité est équivalente à celle de la nouvelle, et a exposé les divergences entre les écoles shafi'ite et hanafite sur ce sujet. Le Département a précisé que la zakat sur les olives est due, selon l'école shafi'ite et l'école hanafite, à hauteur d'un dixième de la production pluviale et d'un vingtième de la production irriguée, au prix coûtant, avec un minimum (nisab) de cinq awsuq, soit environ 611 kilogrammes. Il a ajouté que le débiteur doit en principe payer sur la récolte elle-même, car la zakat est attachée à la propriété en tant que forme de participation, citant l'ouvrage « Mughni al-Muhtaj » d'al-Khatib al-Shirbini. L'article rapporte l'avis shafi'ite selon lequel la zakat peut être payée sur une partie de la propriété elle-même, à titre de faveur au payeur, pourvu que la qualité soit identique. Cette qualité est jugée par des spécialistes selon l'acidité de l'huile. Il cite également l'ouvrage al-Bayan d'al-Imrani, qui affirme que l'âge seul ne constitue pas un défaut. L'article rapporte aussi l'avis hanafite selon lequel la valeur peut être payée, et cite al-Muhit al-Burhani d'Ibn Maza, qui indique qu'Abu Hanifa et Abu Yusuf ne tiennent pas compte de la qualité lorsque le payeur donne la même huile en quantité égale, tandis que Muhammad ibn al-Hasan exige le paiement de la différence de valeur. Il conclut que le paiement sur la récolte elle-même est la meilleure solution et la plus sûre pour s'acquitter de cette obligation, car payer sur une récolte antérieure pourrait laisser penser à une escroquerie envers les pauvres, en leur donnant une huile de moindre valeur. L'huile ancienne est prise en compte si sa qualité est identique à celle de l'huile nouvelle."
  tr: "Zeytinlerin yeni üründen değil de eski yağdan zekatı ödemesi sorusuna gelince, Ürdün Genel Fetva Dairesi en kapsamlı olanın aynı üründen ödeme yapmak olduğunu ve eski yağın yeni yağın kalitesine uygun olduğu sürece yeterli olduğunu söyledi. Daire, bu konuda Şafiiler ile Hanafi arasındaki farkı bildirdi. Daire, zeytin üzerindeki zekatın Şafii görüşüne göre zorunlu olduğunu ve bunun Hanefi okulu olduğunu yanıtladı. Sulanan şeyin onda biri ücretsiz, sulananın onda biri ise maliyeti karşılığında ödeniyor ve nisabı beş vask, yani yaklaşık 611 kilogram değerinde. Varsayılan olarak zekatın gerçek üründen ödendiğini, çünkü zekatın parayla ilgili olduğunu ve bir şirkete bağlı olduğunu söyledi. Bunu Mughni Al-Muhtaj'daki Al-Khatib Al-Sharbini'den alıntıladım. Şafi'ler, yağın asitlik oranı uzmanları tarafından belirlenen kalite benzerliği gözlemlendiği sürece, gerçek mülkiyet olmadan yağdan çıkarmanın avantajlı bir tercih olarak kabul edilebilirliğini alıntıladılar. Al-'Umrani'nin yaşın onlara göre bir kusur olmadığını belirtti. Hanafi'lerden, değerin ödenmesinin caizini ve İbn Mazzah'ın Al-Muheet al-Burhani'den, Ebu Hanife ve Ebu Yusuf'un aynı türden ve miktar olarak eşit çıkarıldığında kaliteyi kabul etmediğini, Muhammed ibn el-Hasan'ın ise değer farkını ödemeyi zorunlu kıldığını belirttiler. Gerçek üründen çıkarmanın daha eksiksiz olduğunu ve sorumluluğu ortadan kaldırdığını, çünkü önceki bir üründen çıkarmanın fakirlere daha düşük değerde yağ vererek dolandırıcılık şüphesi yaratabileceğini ve eski yağdan çıkaranın yeni yağla benzer kalitede olması halinde yeterli olduğunu belirttiler."
  id: "Sebuah pertanyaan tentang membayar zakat atas zaitun dari minyak lama daripada tanaman baru, Departemen Fatwa Jenderal Yordania menjawab bahwa yang paling lengkap adalah membayar dari tanaman yang sama, dan minyak lama sudah cukup asalkan sesuai dengan kualitas minyak baru. Departemen melaporkan perbedaan antara Shafi'i dan Hanafi dalam hal ini. Departemen menjawab bahwa zakat zaitun wajib menurut pandangan Shafi'i, yaitu aliran Hanafi. Sepersepuluh dari apa yang diairi dibayar tanpa biaya, dan setengah persepuluh dari yang diairi dengan biaya, dan nisabnya adalah lima wasq, yang setara dengan sekitar 611 kilogram. Dikatakan bahwa kegagalan adalah zakat dibayarkan dari hasil panen sebenarnya, karena zakat terkait dengan uang dan terikat pada perusahaan. Saya mengutip ini dari Al-Khatib Al-Sharbini dalam Mughni Al-Muhtaj. Mereka mengutip dari Shafi'is tentang diperbolehkannya mengekstrak dari minyak tanpa properti sebenarnya sebagai favorit yang menguntungkan, asalkan ada kemiripan kualitas, sebagaimana ditentukan oleh para ahli rasio keasaman minyak. Mereka mengutip Al-'Umrani dalam pernyataannya bahwa usia bukanlah cacat menurut mereka. Mereka mengutip dari Hanafi tentang kelayakan membayar nilai, dan dari Ibn Mazzah dalam Al-Muheet al-Burhani, bahwa Abu Hanifa dan Abu Yusuf tidak menganggap kualitas jika diekstraksi dari spesies yang sama dan jumlahnya sama, dan bahwa Muhammad ibn al-Hasan harus membayar selisih nilai. Mereka menyimpulkan bahwa mengekstrak dari tanaman sebenarnya lebih lengkap dan membersihkan kewajiban, karena mengekstrak dari tanaman sebelumnya dapat menimbulkan kecurigaan penipuan terhadap orang miskin dengan memberikan minyak bernilai lebih rendah, dan bahwa siapa pun yang mengekstrak dari minyak lama cukup jika kualitasnya mirip dengan minyak baru."
