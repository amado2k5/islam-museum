id: work/fatwa-dar-alifta-eg-cash-purchase-invoice-company-pays
class: work
kind: fatwa
label: { ar: "حكم الشراء نقدًا بفاتورة والرجوع على شركة لأخذ الثمن بالتقسيط", en: "Buying cash on an invoice then claiming the price in instalments from a company", ur: "نقد خریداری کے بعد کمپنی سے قسطوں میں قیمت لینا", es: "Comprar al contado mediante factura y luego reclamar el precio a plazos a una empresa.", fr: "Achat au comptant sur facture puis recouvrement du prix en plusieurs versements auprès d'une entreprise", tr: "Fatura ile nakit satın alma ve fiyatı taksitlerle tahsil etmek için bir şirketle görüşme kararı", id: "Putusan tentang pembelian tunai dengan faktur dan konsultasi dengan perusahaan untuk menagih harga secara cicilan" }
summary:
  ar: "سائل سأل عن الشراء نقدًا بفاتورة ثم الرجوع على شركة لأخذ الثمن بالتقسيط. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20933)⁩ أن المعاملة المسؤول عنها صورة من صور التمويل الاستهلاكي وهي جائزة شرعًا ولا حرمة فيها بشرط القدرة على السداد على ما فصّل الجواب."
  en: "A questioner asked about buying cash against an invoice then claiming the price in instalments from a company. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20933) answered that the transaction is a form of consumer financing, lawful provided ability to repay — as the answer details."
  ur: "ایک سائل نے نقد خریداری کے بعد کمپنی سے قسطوں میں قیمت لینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20933)⁩ نے جواب دیا کہ یہ استهلاكی مالیات کی ایک صورت ہے اور ادائیگی کی استطاعت کے ساتھ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de comprar al contado contra factura y luego reclamar el pago a plazos a una empresa. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20933) respondió que la transacción es una forma de financiación al consumo, lícita siempre que exista capacidad de pago, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'achat au comptant sur facture, suivi du remboursement du prix par versements échelonnés auprès d'une entreprise. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20933) a répondu que cette transaction constitue une forme de financement à la consommation, licite sous réserve de la capacité de remboursement, comme le précise la réponse."
  tr: "Bir soru soran, nakit olarak fatura ile satın almayı ve ardından bir şirketle fiyatı taksitlerle toplamak için danışmayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20933), bu işlemin bir tüketici finansmanı biçimi olduğunu, İslam hukukuna göre izin verildiğini ve ödeme yapılabilmesi koşuluyla yasak olmadığını yanıtladı; bu cevapta detaylandırılmıştır."
  id: "Seorang penanya bertanya tentang membeli secara tunai dengan faktur lalu berkonsultasi dengan perusahaan untuk menagih harga secara cicilan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20933) menjawab bahwa transaksi yang merupakan bentuk pembiayaan konsumen dan diperbolehkan menurut hukum Islam serta tidak dilarang asalkan seseorang mampu membayar, seperti yang dijelaskan dalam jawaban."
