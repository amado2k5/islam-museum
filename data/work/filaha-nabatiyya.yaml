summary:
  ar: "الفلاحة الكبير والصغير لابن وحشية الكلداني أبي بكر أحمد بن علي بن المختار الكسبداني الصوفي من أهل قسين، ومن كتبه في السحر والطلسمات كتاب طرد الشياطين المعرف بالأسرار وكتاب السحر الكبير وكتاب السحر الصغير وكتاب دوار على مذهب النبط وهو تسع مقالات وكتاب مذاهب الكلدانيين في الأصنام وكتاب الإشارة في السحر وكتاب أسرار الكواكب وكتاب حاطوني أنعي الكسداني في النوع الثاني من الطلسمات نقله ابن وحشية وكتاب الحياة والموت في علاج الأمراض وكتاب الأصنام وكتاب القرابين وكتاب الطبيعة وكتاب الأسماء وكتاب مفاوضاته مع أبي جعفر الأموي وسلامة بن سليمان الإخميمي في الصنعة والسحر، ويروي هذه الكتب عنه صاحبه أبو طالب أحمد بن الحسين بن علي بن أحمد بن محمد بن عبد الملك الزيات {cite:fihrist-ibn-al-nadim p. 433}."
  en: "The Nabataean Agriculture — Ibn Wahshiyya's corpus of magic, talismans and Chaldean lore {cite:fihrist-ibn-al-nadim}"
