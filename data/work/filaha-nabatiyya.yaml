label: { ar: "الفلاحة النبطية", en: "The Nabataean Agriculture", es: "La agricultura nabatea", fr: "L'agriculture nabatéenne", ur: "نباتین زراعت", tr: "Nabatean Tarımı", id: "Pertanian Nabatean" }
summary:
  ar: "الفلاحة الكبير والصغير لابن وحشية الكلداني أبي بكر أحمد بن علي بن المختار الكسبداني الصوفي من أهل قسين، ومن كتبه في السحر والطلسمات كتاب طرد الشياطين المعرف بالأسرار وكتاب السحر الكبير وكتاب السحر الصغير وكتاب دوار على مذهب النبط وهو تسع مقالات وكتاب مذاهب الكلدانيين في الأصنام وكتاب الإشارة في السحر وكتاب أسرار الكواكب وكتاب حاطوني أنعي الكسداني في النوع الثاني من الطلسمات نقله ابن وحشية وكتاب الحياة والموت في علاج الأمراض وكتاب الأصنام وكتاب القرابين وكتاب الطبيعة وكتاب الأسماء وكتاب مفاوضاته مع أبي جعفر الأموي وسلامة بن سليمان الإخميمي في الصنعة والسحر، ويروي هذه الكتب عنه صاحبه أبو طالب أحمد بن الحسين بن علي بن أحمد بن محمد بن عبد الملك الزيات {cite:fihrist-ibn-al-nadim p. 433}."
  en: "The Nabataean Agriculture — Ibn Wahshiyya's corpus of magic, talismans and Chaldean lore {cite:fihrist-ibn-al-nadim}"
  es: "La agricultura nabatea: el corpus de magia, talismanes y saberes caldeos de Ibn Wahshiyya {cite:fihrist-ibn-al-nadim}"
  fr: "L'agriculture nabatéenne — Le corpus de magie, de talismans et de savoir chaldéen d'Ibn Wahshiyya {cite:fihrist-ibn-al-nadim}"
  ur: "نباطین زراعت - ابن وحشیہ کا جادو، طلسم اور کلدین کے علم کا مجموعہ۔"
  tr: "Kasin halkından bir Sufi olan İbn Vahşiyya el-Kildani, Ebu Bekir Ahmed ibn Ali ibn el-Mukhtar el-Kasbadani'nin Büyük ve Küçük Tarım adlı eseri. Büyü ve tılsımlar üzerine kitapları arasında 'Şeytanların Şeytan Kovması, Asrar olarak bilinir', 'Büyük Büyü', 'Küçük Büyü', 'Nabati Okuluna Göre Yuvarlak' (dokuz makale), 'Keldani Putlar Üzerine Öğretiler,' 'El-İşar fi el-Asrar', 'Asrar el-Kawakib', İkinci Tür Tılsımlar üzerine 'Hatuni Ana'i el-Kasdani' (İbn Vahşiya tarafından alıntılanmıştır), 'Hastalıkların Tedavisinde Yaşam ve Ölüm', 'Putlar Kitabı' ve kitap yer alır El-Qurabin, Kitab el-Tebiyyah, Kitab el-Esma ve Ebu Ca'fer el-Emeyyad ile Salama ibn Süleyman el-Akhmimi ile zanaat ve sihir üzerine müzakereler kitabı. Bu kitaplar, yazarı Ebu Talib Ahmed ibn el-Hüseyin ibn Ali ibn Ahmed ibn Muhammed ibn Abd al-Malik al-Zayyat tarafından kendisinden aktarılmıştır {atıf:Fihrist-ibn-al-Nadim s. 433}."
  id: "Pertanian Besar dan Kecil oleh Ibn Wahshiyya al-Kildani, Abu Bakr Ahmad ibn Ali ibn al-Mukhtar al-Kasbadani, seorang Sufi dari masyarakat Qasin. Di antara bukunya tentang sihir dan jimat adalah buku 'Pengusiran Iblis, yang dikenal sebagai Asrar,' 'Sihir Agung,' 'Sihir Kecil,' 'Bulat Menurut Aliran Nabatean (sembilan artikel,' 'Doktrin Kaldea tentang Berhala,' 'Al-Isha'ar fi al-Asrar,' 'Asrar al-Kawakib,' 'Hatuni Ana'i al-Kasdani' tentang Jenis Kedua Talisman (dikutip oleh Ibn Wahshiya), 'Hidup dan Mati dalam Pengobatan Penyakit,' 'Kitab Berhala,' dan Buku Al-Qurabin, Kitab al-Ta'biyyah, Kitab al-Asma', dan buku negosiasinya dengan Abu Ja'far al-Umayyad dan Salama ibn Sulayman al-Akhmimi dalam kerajinan dan sihir. Buku-buku ini diceritakan darinya oleh penulisnya Abu Talib Ahmad ibn al-Husayn ibn Ali ibn Ahmad ibn Muhammad ibn Abd al-Malik al-Zayyat {cite:fihrist-ibn-al-nadim hlm. 433}."
