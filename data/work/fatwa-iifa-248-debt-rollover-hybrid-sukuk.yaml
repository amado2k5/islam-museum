label: { ar: "قرار مجمع الفقه الإسلامي الدولي 248 (25/10) بشأن أحكام تطبيقات معاصرة لقلب الدين والصكوك المركبة والهجينة", en: "IIFA resolution 248 (25/10) on the rulings on contemporary applications of debt rollover and compound and hybrid sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 248 (25/10): قرض کے گھماؤ اور مرکب و ہائبرڈ صکوک کے عصری اطلاقات کے احکام", es: "Resolución 248 (25/10) de la IIFA sobre las resoluciones relativas a las aplicaciones contemporáneas de la refinanciación de deuda y los sukuk compuestos e híbridos.", fr: "Résolution 248 (25/10) de l'IIFA relative aux décisions concernant les applications contemporaines du renouvellement de dette et des sukuks composés et hybrides" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. عرّف المجمع قلب الدين بأنه تحويل الدين الثابت في الذمة إلى دين أكثر منه مقابل الزيادة في الأجل، وهو من فسخ الدين بالدين، وأكد قراريه 101 ⁦(11/4)⁩ في بيع الدين وسندات القرض و158 ⁦(17/7)⁩ في فسخ الدين بالدين، وقرر أن كل صورة من صور قلب الدين تفضي إلى زيادة الدين على المدين مقابل الزيادة في الأجل أو تكون ذريعة إليه من فسخ الدين بالدين الممنوع شرعًا، وأن سلطة المتعاقدين في تعديل العقود مقيدة شرعًا بعدم الإفضاء إلى ما يخالف الأحكام الشرعية وعدم مخالفة ما انعقد الإجماع على تحريمه وهو ربا الديون، سواء نشأت الزيادة عن مرابحة أم استصناع أم سلم أم غيرها. وأما الصكوك الهجينة والمركبة فأجل البت فيها لمزيد من البحث والدراسة. وأوصى بالرجوع إلى قراره 218 ⁦(23/2)⁩ في أحكام الإعسار والإفلاس، ودعوة المؤسسات المالية الإسلامية لمساعدة المدينين المتعثرين بخطط تمويل تمكنهم من النهوض، والتزام الهيئات الشرعية بقرارات المجمع في بيع الدين وفسخه وقلبه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). It defined debt rollover as converting an established debt into a larger one in exchange for an extension of term — a form of settling debt with debt — reaffirmed its resolutions 101 (11/4) on the sale of debt and loan bonds and 158 (17/7) on settling debt with debt, and ruled that every form of rollover that increases the debtor's debt in exchange for extended term, or serves as a device to that end, is the prohibited settling of debt with debt; and that the contracting parties' power to amend contracts is bound by the sharia so that no increase on an established debt accompanies a longer term — whether arising from murabaha, istisna', salam or otherwise — and nothing violates what consensus has forbidden, namely riba on debts. On hybrid and compound sukuk it deferred a ruling for further research. It recommended recourse to its resolution 218 (23/2) on insolvency and bankruptcy, called on Islamic financial institutions to help defaulting debtors with financing plans that let them recover and repay, and called on sharia boards to abide by its resolutions on the sale, settlement and rollover of debt."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے قرض کے گھماؤ کی تعریف ذمہ میں ثابت قرض کو مدت میں اضافے کے بدل بڑے قرض میں بدلنے کے طور پر کی — قرض کے بدل قرض کی فسخ — اور اپنی قراردادیں 101 ⁦(11/4)⁩ ⁦(قرض اور قرضے کے بانڈز کی فروخت)⁩ اور 158 ⁦(17/7)⁩ ⁦(قرض کے بدل قرض کی فسخ)⁩ کی تائید کی، اور فیصلہ کیا کہ قرض کے گھماؤ کی ہر صورت جو مقروض کے قرض کو مدت میں اضافے کے بدل بڑھائے یا اس کا ذریعہ ہو، ممنوع فسخِ قرض بہ قرض ہے؛ اور متعاقدین کی معاہدے میں ترمیم کا اختیار شرعاً اس سے بندھا ہے کہ ثابت قرض میں مدت کے اضافے کے ساتھ اضافہ نہ ہو — مرابحہ، استصناع، سلم یا غیرہ سے پیدا ہوا ہو — اور اس چیز کی خلاف ورزی نہ ہو جس پر تحریم کا اجماع ہے یعنی قرضوں کا ربا۔ ہائبرڈ اور مرکب صکوک پر فیصلہ مزید تحقیق کے لیے مؤخر کیا۔ سفارشات میں قرارداد 218 ⁦(23/2)⁩ ⁦(اعسار و دیوالیہ)⁩ کی طرف رجوع، اسلامی مالیاتی اداروں سے نادار مقروضوں کو بحالی کے ممکن کن مالی منصوبے دینے کی دعوت، اور شرعی بورڈز سے اکیڈمی کی قراردادوں کی پابندی شامل ہے۔"
  es: "Una resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023). Definió la renovación de deuda como la conversión de una deuda establecida en una mayor a cambio de una extensión del plazo —una forma de liquidar deuda con deuda— reafirmó sus resoluciones 101 (11/4) sobre la venta de bonos de deuda y préstamos y 158 (17/7) sobre la liquidación de deuda con deuda, y dictaminó que toda forma de renovación que aumente la deuda del deudor a cambio de un plazo extendido, o que sirva como mecanismo para ese fin, es la liquidación prohibida de deuda con deuda; y que el poder de las partes contratantes para enmendar los contratos está sujeto a la sharia de manera que ningún aumento en una deuda establecida acompañe a un plazo más largo —ya sea que surja de murabaha, istisna', salam o de otra manera— y nada viola lo que el consenso ha prohibido, a saber, riba sobre las deudas. Respecto a los sukuk híbridos y compuestos, aplazó su decisión para realizar un análisis más profundo. Recomendó recurrir a su resolución 218 (23/2) sobre insolvencia y quiebra, instó a las instituciones financieras islámicas a ayudar a los deudores morosos con planes de financiación que les permitan recuperarse y pagar sus deudas, y exhortó a los consejos de la sharia a acatar sus resoluciones sobre la venta, la liquidación y la renovación de la deuda."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, soit du 20 au 23 février 2023) définit le renouvellement de dette comme la conversion d'une dette existante en une dette plus importante en échange d'une prolongation de son échéance – une forme de règlement de dette par dette. Cette résolution réaffirme ses résolutions 101 (11/4) relative à la vente de titres de créance et d'obligations et 158 (17/7) relative au règlement de dette par dette. L'Académie statue que toute forme de renouvellement qui augmente la dette du débiteur en échange d'une prolongation de son échéance, ou qui sert de procédé à cette fin, constitue un règlement de dette par dette interdit. Elle précise également que le pouvoir des parties contractantes de modifier les contrats est encadré par la charia, de sorte qu'aucune augmentation d'une dette existante n'accompagne une prolongation de son échéance – qu'elle résulte d'une murabaha, d'une istisna', d'un salam ou autre – et que rien ne contrevient à l'interdiction consensuelle du riba (usure). Concernant les sukuk hybrides et composés, la Cour a reporté sa décision afin d'approfondir l'étude de la question. Elle a recommandé de se référer à sa résolution 218 (23/2) relative à l'insolvabilité et à la faillite, a invité les institutions financières islamiques à accompagner les débiteurs défaillants en leur proposant des plans de financement leur permettant de se redresser et de rembourser leurs dettes, et a exhorté les conseils de la charia à respecter ses résolutions sur la vente, le règlement et le refinancement de la dette."
