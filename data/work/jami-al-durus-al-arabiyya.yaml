summary:
  ar: "«جامع الدروس العربية» كتاب في علم النحو العربي نسبه ملخص بحثي قُدّم إلى المتحف إلى مصطفى الغلاييني، وذكر تاريخه هكذا: وفاة المؤلف 1944م / 1364هـ {cite:wikipedia-jami-al-durus-al-arabiyya-ar}. وعدّه الملخص بين ستين كتاباً هي الأكثر استشهاداً بها في علوم العربية الخمسة."
  en: "Jami' al-Durus al-Arabiyya is a work of Arabic grammar that a research summary supplied to the museum ascribes to Mustafa al-Ghalayini, giving its date as: author died 1944 CE / 1364 AH {cite:wikipedia-jami-al-durus-al-arabiyya-ar}. The summary counts it among sixty of the most-cited works in the five Arabic sciences."
  ur: "«جامع الدروس العربیہ» عربی نحو کی کتاب ہے جسے عجائب گھر کو دیا گیا ایک تحقیقی خلاصہ مصطفى الغلاييني سے منسوب کرتا ہے اور اس کی تاریخ یوں دیتا ہے: مصنف کی وفات 1944 ء / 1364 ھ {cite:wikipedia-jami-al-durus-al-arabiyya-ar}۔ خلاصہ اسے عربی کے پانچ علوم کی ساٹھ سب سے زیادہ حوالہ دی جانے والی کتابوں میں شمار کرتا ہے۔"
  fr: "Jami' al-Durus al-Arabiyya est un ouvrage de grammaire arabe qu'un résumé de recherche remis au musée attribue à Mustafa al-Ghalayini, en donnant sa date ainsi : mort de l'auteur 1944 ap. J.-C. / 1364 de l'Hégire {cite:wikipedia-jami-al-durus-al-arabiyya-ar}. Le résumé le compte parmi soixante des ouvrages les plus cités dans les cinq sciences de l'arabe."
  es: "Jami' al-Durus al-Arabiyya es una obra de gramática árabe que un resumen de investigación entregado al museo atribuye a Mustafa al-Ghalayini, y cuya fecha da así: muerte del autor 1944 d. C. / 1364 de la hégira {cite:wikipedia-jami-al-durus-al-arabiyya-ar}. El resumen la cuenta entre sesenta de las obras más citadas en las cinco ciencias del árabe."
  tr: "\"Jami' al-Durus al-Arabiya\", Mustafa al-Ghalayini'ye müzeye sunulan bir araştırma özetine atfedilen Arapça dilbilgisi üzerine yazılmış bir kitaptır ve tarihi şu şekilde belirtilmiştir: Yazarın ölümü 1944 MS / 1364 Hicri'dir {cite:wikipedia-jami-al-durus-al-arabiyya-ar}. Özeti, beş Arap bilimi arasında en çok atıf alan altmış kitap arasında değerlendirmektedir."
  id: "\"Jami' al-Durus al-Arabiya\" adalah sebuah buku tata bahasa Arab yang dikaitkan dengan ringkasan penelitian yang diserahkan ke museum kepada Mustafa al-Ghalayini, dan tanggalnya disebutkan sebagai berikut: Kematian penulis adalah tahun 1944 M / 1364 H {cite:wikipedia-jami-al-durus-al-arabiyya-ar}. Ia menganggap ringkasan dari enam puluh buku ini adalah yang paling banyak dikutip di antara lima ilmu Arab."
