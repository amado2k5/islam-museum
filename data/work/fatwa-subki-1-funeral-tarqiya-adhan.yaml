label: { ar: "فتوى في الترقية ورفع الصوت بالجنازة والأذان", en: "Fatwa on acclaiming, raising the voice at funerals and the adhan", ur: "ترقیہ، جنازے میں بلند آواز اور اذان پر فتویٰ", es: "Fatwa sobre aclamar, elevar la voz en funerales y el adhan", fr: "Fatwa sur les acclamations, l'élévation de la voix lors des funérailles et l'adhan", tr: "Cenazelerde terfi ve sesin yükseltilmesiyle ilgili fetva ve ezan", id: "Fatwa tentang promosi dan meninggikan suara saat pemakaman serta seruan untuk shalat" }
summary:
  ar: "سؤال عن الترقية بين يدي الخطيب، ورفع الصوت بالقرآن أو البردة عند الجنازة، والأذان الثاني داخل المسجد: أسنة أم بدعة؟ جواب علماء الأزهر بأنها كلها بدع، وأن على القادرين منعها، وأنه لا يصح أن يُقدَّم فعل البدعة على السنة."
  en: "A question on acclaiming before the preacher, raising the voice with the Qur'an or the Burda at funerals, and the adhan inside the mosque: sunna or innovation? The Al-Azhar answer calls them all innovations, says those able should prevent them, and holds that no one may prefer innovation to the sunna."
  ur: "سوال: خطیب کے سامنے ترقیہ، جنازے پر قرآن یا بردہ بلند آواز سے پڑھنا، اور مسجد کے اندر اذان ثانی: سنت ہیں یا بدعت؟ جواب: ازہر کے علماء کے نزدیک یہ سب بدعت ہیں، قادر لوگوں پر ان کا روکنا لازم ہے، اور بدعت کو سنت پر مقدم نہیں کیا جا سکتا۔"
  es: "Una pregunta sobre aclamar ante el predicador, elevar la voz con el Corán o la Burda en los funerales y el adhan dentro de la mezquita: ¿sunna o innovación? La respuesta de Al-Azhar las considera innovaciones, dice que quienes puedan deben impedirlas y sostiene que nadie debe preferir la innovación a la sunna."
  fr: "Une question concerne les acclamations devant le prédicateur, l'élévation de la voix lors des funérailles avec le Coran ou la Burda, et l'adhan à l'intérieur de la mosquée: relèvent-elles de la sunna ou de l'innovation ? La réponse d'Al-Azhar les qualifie toutes d'innovations, affirme que ceux qui en ont les moyens doivent les éviter et soutient que nul ne peut préférer l'innovation à la sunna."
  tr: "Vaiz önünde terfi ile ilgili bir soru, cenazede Kur'an'la ya da örtüyle sesi yükseltmek ve cami içinde ikinci ezan mı: Sünnet mi yenilik mi? Ezher âlimlerinin cevabı, bunların hepsinin yenilik olduğu, yetenekli olanların bunları engellemesi gerektiği ve bir yeniliği Sünnet'in önüne koymanın caiz olmadığıdır."
  id: "Pertanyaan tentang promosi di hadapan pengkhotbah, mengangkat suara dengan Al-Qur'an atau kerudung di pemakaman, dan panggilan salat kedua di dalam masjid: Sunnah atau inovasi? Jawaban para ulama Al-Azhar adalah bahwa semua ini adalah inovasi, dan mereka yang mampu harus mencegahnya, dan tidak diperbolehkan memprioritaskan inovasi dibandingkan Sunnah."
