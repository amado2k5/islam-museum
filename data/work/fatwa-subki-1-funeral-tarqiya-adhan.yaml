id: work/fatwa-subki-1-funeral-tarqiya-adhan
class: work
kind: fatwa
label: { ar: "فتوى في الترقية ورفع الصوت بالجنازة والأذان", en: "Fatwa on acclaiming, raising the voice at funerals and the adhan" }
summary:
  ar: "سؤال عن الترقية بين يدي الخطيب، ورفع الصوت بالقرآن أو البردة عند الجنازة، والأذان الثاني داخل المسجد: أسنة أم بدعة؟ جواب علماء الأزهر بأنها كلها بدع، وأن على القادرين منعها، وأنه لا يصح أن يُقدَّم فعل البدعة على السنة."
  en: "A question on acclaiming before the preacher, raising the voice with the Qur'an or the Burda at funerals, and the adhan inside the mosque: sunna or innovation? The Al-Azhar answer calls them all innovations, says those able should prevent them, and holds that no one may prefer innovation to the sunna."
  ur: "سوال: خطیب کے سامنے ترقیہ، جنازے پر قرآن یا بردہ بلند آواز سے پڑھنا، اور مسجد کے اندر اذان ثانی: سنت ہیں یا بدعت؟ جواب: ازہر کے علماء کے نزدیک یہ سب بدعت ہیں، قادر لوگوں پر ان کا روکنا لازم ہے، اور بدعت کو سنت پر مقدم نہیں کیا جا سکتا۔"
