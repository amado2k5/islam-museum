id: work/fatwa-amja-names-of-god-sihr-cure
class: work
kind: fatwa
label: { ar: "العلاج بأسماء الله الحسنى لسحر الربط", en: "Treating binding magic with God's beautiful names", ur: "ربط کے سحر کا علاج اسمائے حسنی سے", es: "Tratando la magia de atadura con los hermosos nombres de Dios", fr: "Traiter la magie de liaison avec les beaux noms de Dieu" }
summary:
  ar: "سأل سائل عن طريقة لعلاج سحر الربط بكتابة أسماء الله الحسنى على هيئة معينة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81529 بتاريخ 22 مايو 2010)⁩ أنه لا يعرف دليلًا يدل على صحة ما ذكر أو نفعه ولعل المعول في مثله على التجربة ما دام لا يتضمن شركًا، فلا بأس بالرقى ما لم تكن شركًا وما دام لا يتضمن استهانة بالمصحف أو بشيء من الذكر."
  en: "A questioner described a method for treating 'binding' magic by writing certain of God's beautiful names in a set pattern. Dr. Salah al-Sawi (fatwa no. 81529, 22 May 2010) answered that he knows no proof establishing its soundness or benefit — such things rest on experience, provided they involve no shirk: incantation is unobjectionable so long as it is not shirk and involves no disrespect to the mushaf or any part of the remembrance. Recorded as AMJA's answer."
  ur: "ایک سائل نے ربط کے سحر کے لیے اسمائے حسنی لکھنے کے طریقے کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81529، 22 مئی 2010)⁩ کے مطابق اس کی صحت کا دلیل نہیں جانتا؛ تجربے کی بنیاد پر بشرط شرک اور مصحف کی بے ادبی نہ ہو رقی جائز ہے۔"
  es: "Un consultante describió un método para tratar la magia de atadura mediante la escritura de ciertos nombres divinos siguiendo un patrón determinado. El Dr. Salah al-Sawi (fatwa n.º 81529, 22 de mayo de 2010) respondió que no conoce ninguna prueba que establezca su validez o beneficio; tales cosas se basan en la experiencia, siempre que no impliquen shirk (idolatría). El encantamiento es aceptable siempre que no sea shirk y no implique falta de respeto al Corán ni a ninguna parte del recuerdo de Dios. Registrada como respuesta de AMJA."
  fr: "Un internaute a décrit une méthode pour contrer la magie noire en écrivant certains des plus beaux noms de Dieu selon un schéma précis. Le Dr Salah al-Sawi (fatwa n° 81529, 22 mai 2010) a répondu qu'il n'avait connaissance d'aucune preuve établissant la validité ou le bienfait de cette méthode; de telles choses reposent sur l'expérience, pourvu qu'elles n'impliquent aucune forme d'associationnisme (shirk). L'incantation est licite tant qu'elle n'est pas une forme d'associationnisme et qu'elle ne manque pas de respect au Coran (mushaf) ni à aucune partie du recueillement. Cette réponse a été consignée dans la fatwa de l'AMJA."
