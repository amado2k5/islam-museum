summary:
  ar: "بيان للمجلس الفقهي لأمريكا الشمالية ⁦(يونيو 2020)⁩ عن إعادة فتح المساجد بحذر وانتباه بعد تخفيف قيود كوفيد-19 وتصاعد الإصابات في مدن وولايات مختلفة على ما نصّ عليه البيان من التوصيات."
  en: "A Fiqh Council of North America statement (June 2020) on reopening the masajid with care and caution after COVID-19 restrictions were relaxed and cases spiked in various cities and states — with the recommendations the statement sets out."
  ur: "فقہ کونسل آف نارتھ امریکہ کا بیان ⁦(جون 2020)⁩ کووڈ پابندیوں میں نرمی کے بعد مساجد کو احتیاط سے کھولنے پر — سفارشات بیان میں ہیں۔"
  es: "Declaración del Consejo de Fiqh de Norteamérica (junio de 2020) sobre la reapertura de las mezquitas con cuidado y precaución tras la relajación de las restricciones por la COVID-19 y el aumento repentino de casos en varias ciudades y estados, con las recomendaciones que se exponen en la declaración."
  fr: "Déclaration du Conseil Fiqh d'Amérique du Nord (juin 2020) sur la réouverture des mosquées avec prudence et circonspection après l'assouplissement des restrictions liées à la COVID-19 et la flambée des cas dans diverses villes et États — avec les recommandations formulées dans la déclaration."
  tr: "Kuzey Amerika Fıkıh Konseyi'nin (Haziran 2020) COVID-19 kısıtlamalarının gevşetilmesi ve çeşitli şehir ve eyaletlerde enfeksiyonların artmasının ardından camilerin temkinli ve dikkatli yeniden açılmasına ilişkin açıklaması, tavsiye bildirisinde belirtildiği üzere."
  id: "Pernyataan dari Dewan Yurisprudensi Amerika Utara (Juni 2020) mengenai pembukaan kembali masjid secara hati-hati dan penuh perhatian setelah pelonggaran pembatasan COVID-19 dan peningkatan infeksi di berbagai kota dan negara bagian, sebagaimana diatur dalam pernyataan rekomendasi."
