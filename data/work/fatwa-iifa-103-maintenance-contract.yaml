label: { ar: "قرار مجمع الفقه الإسلامي الدولي 103 (11/6) بشأن عقد الصيانة", en: "IIFA resolution 103 (11/6) on the maintenance contract", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 103 (11/6): عقدِ صیانت", es: "Resolución 103 (11/6) de la IIFA sobre el contrato de mantenimiento", fr: "Résolution 103 (11/6) de l'IIFA relative au contrat de maintenance", tr: "Uluslararası İslami Fiqh Akademisi Kararı 103 (11/6) bakım sözleşmesine ilişkin", id: "Keputusan Akademi Fiqh Islam Internasional 103 (11/6) mengenai kontrak pemeliharaan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. قرر أن عقد الصيانة عقد مستحدث مستقل تنطبق عليه الأحكام العامة للعقود، ويختلف تكييفه وحكمه باختلاف صوره، وهو في حقيقته عقد معاوضة يلتزم فيه طرف بفحص وإصلاح ما تحتاجه آلة أو شيء آخر من إصلاحات دورية أو طارئة لمدة معلومة في مقابل عوض معلوم، وقد يلتزم الصائن بالعمل وحده أو بالعمل والمواد. وعدّ صوره: فالعقد غير المقترن بعقد آخر الذي يلتزم فيه الصائن العمل فقط أو مع مواد يسيرة لا يحسب لها العاقدان يكيف إجارة على عمل وهو جائز بشرط معلومية العمل والأجر؛ ثم ساق بقية الصور وأحكامها وضوابطها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It ruled that the maintenance contract is a novel, independent contract governed by the general rules of contracts, its characterisation and ruling differing with its forms; in essence it is an exchange contract in which one party undertakes to inspect and repair a machine or other thing, periodically or as emergencies arise, for a known period against a known consideration — the maintainer undertaking either work alone or work and materials. It listed its forms: a stand-alone contract where the maintainer provides work only, or work plus trivial materials the parties do not reckon, is classified as hire-of-work ijara and is lawful provided the work and wage are known; it then gave the remaining forms and their rulings and controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ فیصلہ: عقدِ صیانت ایک نیا، آزاد عقد ہے جس پر عمومی قواعدِ عقود لاغو ہوتے ہیں اور اس کا تخفیظ و حکم اس کی صورتوں کے اختلاف سے بدلتا ہے؛ حقیقت میں یہ معاوضہ عقد ہے جس میں ایک فریق کسی مشین یا چیز کی وقفی یا اضطراری مروت اور مرمت کا عہد معلوم مدت کے لیے معلوم بدلے پر کرتا ہے — صائن کبھی صرف کام، کبھی کام اور مادہ دونوں کا۔ صورتیں: الگ عقد جس میں صائن صرف کام یا معمولی مادے کے ساتھ کام دے وہ اجارہ برائے کام کی شمار میں ہے اور جائز بشرط کام اور اجرت معلوم ہوں؛ پھر باقی صورتیں اور ان کے احکام و ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 11.ª sesión en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998). Dictaminó que el contrato de mantenimiento es un contrato novedoso e independiente, regido por las normas generales de los contratos, cuya caracterización y resolución difieren según su forma; en esencia, es un contrato de intercambio en el que una parte se compromete a inspeccionar y reparar una máquina u otro objeto, periódicamente o en caso de emergencia, durante un período determinado a cambio de una contraprestación conocida; el encargado del mantenimiento realiza el trabajo, ya sea solo el trabajo o el trabajo y los materiales. Enumeró sus formas: un contrato independiente en el que el encargado del mantenimiento proporciona solo el trabajo, o el trabajo más materiales de poca importancia que las partes no tienen en cuenta, se clasifica como ijara (contrato de mano de obra) y es lícito siempre que se conozcan el trabajo y el salario; a continuación, presentó las demás formas, sus resoluciones y controles."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 11e session à Manama (25-30 Rajab 1419, 14-19 novembre 1998) a statué que le contrat de maintenance est un contrat nouveau et indépendant, régi par les règles générales des contrats. Sa nature et son traitement varient selon sa forme. Il s'agit essentiellement d'un contrat d'échange par lequel une partie s'engage à inspecter et réparer une machine ou autre bien, périodiquement ou en cas d'urgence, pour une durée déterminée et moyennant une contrepartie connue. Le prestataire de maintenance peut effectuer soit uniquement la prestation, soit la prestation et les matériaux. La résolution énumère ses différentes formes: un contrat autonome où le prestataire fournit uniquement la prestation, ou la prestation et des matériaux de faible valeur non précisée par les parties, est classé comme contrat de travail à façon (ijara) et est licite à condition que la nature du travail et la rémunération soient connues. Elle expose ensuite les autres formes de contrat, leurs règles et leurs modalités de contrôle."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Manama'daki on birinci oturumunda (25–30 Rechab 1419 H, 14–19 Kasım 1998) toplu kararı. Bakım sözleşmesinin, sözleşmelerin genel hükümlerine tabi bağımsız yeni bir sözleşme olduğu ve sınıflandırması ile yönetiminin biçimine bağlı olarak değiştiği kararlaştırılmıştır. Özünde, bir tarafın belirli bir süre boyunca periyodik veya acil onarımlar için gereken bir makine veya diğer eşyayı denetleyip onarmayı taahhüt ettiği takas sözleşmesidir; karşılığında bilinen bir tazminat karşılığında bir tazminat verilir. Sigortacı, işi tek başına veya iş ve malzemelerle yapmak zorunda olabilir. Formları: Başka bir sözleşme eşlik etmeyen, sadece veya müteahhitler tarafından sayılmayan küçük malzemelerle çalışmayı taahhüt ettiği bir sözleşme, iş kiralama olarak uyarlanır ve iş ile ücretler bilindiği sürece kabul edilir; ardından diğer formlar, kararları ve düzenlemeler sunulur."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesebelasnya di Manama (25–30 Rajab 1419 H, 14–19 November 1998 M). Diputuskan bahwa kontrak pemeliharaan adalah kontrak baru independen yang tunduk pada ketentuan umum kontrak, dan klasifikasi serta keputusannya berbeda-beda tergantung bentuknya. Pada dasarnya, ini adalah kontrak barter di mana salah satu pihak berkomitmen untuk memeriksa dan memperbaiki mesin atau barang lain yang diperlukan untuk perbaikan berkala atau darurat selama periode tertentu dengan imbalan kompensasi yang diketahui. Penjamin dapat diwajibkan melakukan pekerjaan sendiri atau dengan pekerjaan dan bahan. Bentuknya: Kontrak yang tidak disertai kontrak lain di mana penjamin berkomitmen untuk bekerja hanya atau dengan bahan kecil yang tidak dihitung oleh kontraktor diadaptasi sebagai sewa pekerjaan dan diperbolehkan asalkan pekerjaan dan upah diketahui; kemudian formulir, putusan, dan peraturan lainnya disampaikan."
