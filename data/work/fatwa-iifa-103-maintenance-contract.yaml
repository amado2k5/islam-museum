label: { ar: "قرار مجمع الفقه الإسلامي الدولي 103 (11/6) بشأن عقد الصيانة", en: "IIFA resolution 103 (11/6) on the maintenance contract", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 103 (11/6): عقدِ صیانت" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. قرر أن عقد الصيانة عقد مستحدث مستقل تنطبق عليه الأحكام العامة للعقود، ويختلف تكييفه وحكمه باختلاف صوره، وهو في حقيقته عقد معاوضة يلتزم فيه طرف بفحص وإصلاح ما تحتاجه آلة أو شيء آخر من إصلاحات دورية أو طارئة لمدة معلومة في مقابل عوض معلوم، وقد يلتزم الصائن بالعمل وحده أو بالعمل والمواد. وعدّ صوره: فالعقد غير المقترن بعقد آخر الذي يلتزم فيه الصائن العمل فقط أو مع مواد يسيرة لا يحسب لها العاقدان يكيف إجارة على عمل وهو جائز بشرط معلومية العمل والأجر؛ ثم ساق بقية الصور وأحكامها وضوابطها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It ruled that the maintenance contract is a novel, independent contract governed by the general rules of contracts, its characterisation and ruling differing with its forms; in essence it is an exchange contract in which one party undertakes to inspect and repair a machine or other thing, periodically or as emergencies arise, for a known period against a known consideration — the maintainer undertaking either work alone or work and materials. It listed its forms: a stand-alone contract where the maintainer provides work only, or work plus trivial materials the parties do not reckon, is classified as hire-of-work ijara and is lawful provided the work and wage are known; it then gave the remaining forms and their rulings and controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ فیصلہ: عقدِ صیانت ایک نیا، آزاد عقد ہے جس پر عمومی قواعدِ عقود لاغو ہوتے ہیں اور اس کا تخفیظ و حکم اس کی صورتوں کے اختلاف سے بدلتا ہے؛ حقیقت میں یہ معاوضہ عقد ہے جس میں ایک فریق کسی مشین یا چیز کی وقفی یا اضطراری مروت اور مرمت کا عہد معلوم مدت کے لیے معلوم بدلے پر کرتا ہے — صائن کبھی صرف کام، کبھی کام اور مادہ دونوں کا۔ صورتیں: الگ عقد جس میں صائن صرف کام یا معمولی مادے کے ساتھ کام دے وہ اجارہ برائے کام کی شمار میں ہے اور جائز بشرط کام اور اجرت معلوم ہوں؛ پھر باقی صورتیں اور ان کے احکام و ضوابط۔"
