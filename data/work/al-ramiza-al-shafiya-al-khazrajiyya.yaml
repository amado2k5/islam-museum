summary:
  ar: "الرامزة الشافية / الخزرجية، كتاب في العروض والقوافي لمؤلفه ضياء الدين الخزرجي، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 626 أو 627هـ {cite:qnl-al-ramiza-al-shafiya-al-khazrajiyya}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا يوجد في shamela.ws مطابقة، بحسب الملف، مع ذكر تحويل بصيغة bok على موقع Shamela.org {cite:shamela-org-pdf-al-ramiza-al-shafiya-al-khazrajiyya}. لم يقرأ المتحف الكتاب."
  en: "al-Ramiza al-Shafiya (al-Khazrajiyya), a book on prosody (arud and qawafi) by Diya al-Din al-Khazraji; its date in a research summary supplied to the museum is d. 626 or 627 AH {cite:qnl-al-ramiza-al-shafiya-al-khazrajiyya}. The summary's answer on its presence in the Shamela library: No match on shamela.ws, according to the file, which mentions a bok conversion on Shamela.org {cite:shamela-org-pdf-al-ramiza-al-shafiya-al-khazrajiyya}. The museum has not read the book."
  ur: "الرامزة الشافية / الخزرجية، عروض و قوافی پر ایک کتاب، مصنف ضياء الدين الخزرجي؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 626 یا 627ھ {cite:qnl-al-ramiza-al-shafiya-al-khazrajiyya}۔ شاملہ میں موجودگی پر خلاصے کا جواب: فائل کے مطابق shamela.ws پر کوئی مطابق اندراج نہیں، اور Shamela.org پر bok تبدیلی کا ذکر ہے {cite:shamela-org-pdf-al-ramiza-al-shafiya-al-khazrajiyya}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Ramiza al-Shafiya (al-Khazrajiyya), livre sur la prosodie (arud et qawafi) de Diya al-Din al-Khazraji ; sa date dans une synthèse de recherche remise au musée : m. 626 ou 627 H {cite:qnl-al-ramiza-al-shafiya-al-khazrajiyya}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Aucune correspondance sur shamela.ws selon le fichier, qui mentionne une conversion bok sur Shamela.org {cite:shamela-org-pdf-al-ramiza-al-shafiya-al-khazrajiyya}. Le musée n'a pas lu le livre."
  es: "al-Ramiza al-Shafiya (al-Khazrajiyya), libro sobre prosodia (arud y qawafi) de Diya al-Din al-Khazraji; su fecha en un resumen de investigación entregado al museo: m. 626 o 627 H. {cite:qnl-al-ramiza-al-shafiya-al-khazrajiyya}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sin coincidencia en shamela.ws según el archivo, que menciona una conversión bok en Shamela.org {cite:shamela-org-pdf-al-ramiza-al-shafiya-al-khazrajiyya}. El museo no ha leído el libro."
