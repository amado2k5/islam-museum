summary:
  ar: "كتاب عبد الرحمن بن خلدون في فضل علم التاريخ وتحقيق مذاهبه والإطلاع على ما يعرض للمؤرخين من المغالط، في طبيعة العمران في الخليقة والعصبية والدولة والخلافة والملك والصنائع والعلوم {cite:muqaddima-ibn-khaldun pdf6}. وفي خاتمته اعتذر عما قد يكون عرض من خروج عن الغرض وقال إن من يأتي بعده ممن يؤيده الله بفكر صحيح يغوص من مسائله على أكثر مما كتب فليس على مستنبط الفن إحصاء مسائله وإنما عليه تعيين موضع العلم وتنويع فصوله والمتأخرون يلحقون المسائل من بعده شيئاً فشيئاً إلى أن يكمل، وأخبر أنه أتم الجزء الأول المشتمل على المقدمة بالوضع والتأليف قبل التنقيح والتهذيب في مدة خمسة أشهر آخرها منتصف عام تسعة وسبعين وسبعمائة ثم نقحه وهذبه وألحق به من تواريخ العرب والبربر ما اخترته في الكتاب الملقب بالعبر {cite:muqaddima-ibn-khaldun p. 652}"
  en: "Ibn Khaldun's prolegomenon on the nature of civilisation, asabiyya, dynasties, crafts and sciences {cite:muqaddima-ibn-khaldun pdf6}."
  es: "Prolegómeno de Ibn Khaldun sobre la naturaleza de la civilización, asabiyya, dinastías, oficios y ciencias {cita:muqaddima-ibn-khaldun pdf6}."
  fr: "Prolégomène d'Ibn Khaldun sur la nature de la civilisation, l'asabiyya, les dynasties, l'artisanat et les sciences {cite:muqaddima-ibn-khaldun pdf6}."
  ur: "تہذیب، اصابیہ، خاندان، دستکاری اور علوم کی نوعیت پر ابن خلدون کا بیانیہ {حوالہ: مقدّمہ ابن خلدون pdf6}۔"
  tr: "Abdulrahman bin Haldun'un tarih biliminin erdemi üzerine kitabı, doktrinlerinin doğrulanması ve kentsel gelişimin doğası, kabile işleri, devlet, halifelik, krallık, zanaat ve bilimler hakkında tarihçilere sunulan yanlış anlamaların incelenmesi {cite:muqaddima-ibn-khaldun pdf6}. Sonuç olarak, amaçtan sapma için özür diledi ve kendisinden sonra gelenlerin, Tanrı'nın desteğiyle, yazılanların ötesinde meselelerine daha derinlemesine daldıklarını söyledi. Sanatın çıkarıcısı onun sorunlarını saymak değil, bilginin yerini belirlemek ve bölümlerini çeşitlendirmektir. Daha sonraki bilginler konuları yavaş yavaş takip ederek tamamlayana kadar devam eder. Birinci cildi, giriş ve revizyon ve iyileştirme öncesi kompozisyon ve kompozisyonu içeren ilk cildi beş ayda tamamladığını, sonuncusunu 1779 ortasında tamamladığını, ardından gözden geçirip iyileştirdiğini ve Araplar ile Berberilerin tarihlerinden Al-Abr adlı kitapta seçtiğim şeyleri dahil ettiğini bildirdi {atıf: muqaddima-ibn-khaldun, s. 652}"
  id: "Buku Abdul Rahman ibn Khaldun tentang kebajikan ilmu sejarah, verifikasi doktrinnya, dan pemeriksaan kesalahpahaman yang disampaikan kepada para sejarawan mengenai sifat pembangunan perkotaan dalam penciptaan, urusan suku, negara, kekhalifahan, kerajaan, kerajinan, dan ilmu pengetahuan {cite:muqaddima-ibn-khaldun pdf6}. Sebagai kesimpulan, ia meminta maaf atas penyimpangan dari tujuan dan mengatakan bahwa mereka yang datang setelahnya, didukung oleh Tuhan, akan menyelami lebih dalam masalahnya melebihi apa yang tertulis. Bukan pengendus seni untuk merinci isu-isu tersebut, melainkan menentukan tempat pengetahuan dan memperluas bab-babnya. Para sarjana berikutnya secara bertahap menindaklanjuti isu-isu tersebut hingga ia menyelesaikannya. Ia memberitahu bahwa ia menyelesaikan jilid pertama, yang mencakup pengantar, dengan komposisi dan komposisi sebelum revisi dan penyempurnaan, dalam lima bulan, yang terakhir pada pertengahan 1779, lalu direvisi dan disempurnakan, dan memasukkan dari sejarah Arab dan Berber apa yang saya pilih dalam buku yang dikenal sebagai Al-Abr {cite:muqaddima-ibn-khaldun, hlm. 652}"
