summary:
  ar: "كتاب عبد الرحمن بن خلدون في فضل علم التاريخ وتحقيق مذاهبه والإطلاع على ما يعرض للمؤرخين من المغالط، في طبيعة العمران في الخليقة والعصبية والدولة والخلافة والملك والصنائع والعلوم {cite:muqaddima-ibn-khaldun pdf6}. وفي خاتمته اعتذر عما قد يكون عرض من خروج عن الغرض وقال إن من يأتي بعده ممن يؤيده الله بفكر صحيح يغوص من مسائله على أكثر مما كتب فليس على مستنبط الفن إحصاء مسائله وإنما عليه تعيين موضع العلم وتنويع فصوله والمتأخرون يلحقون المسائل من بعده شيئاً فشيئاً إلى أن يكمل، وأخبر أنه أتم الجزء الأول المشتمل على المقدمة بالوضع والتأليف قبل التنقيح والتهذيب في مدة خمسة أشهر آخرها منتصف عام تسعة وسبعين وسبعمائة ثم نقحه وهذبه وألحق به من تواريخ العرب والبربر ما اخترته في الكتاب الملقب بالعبر {cite:muqaddima-ibn-khaldun p. 652}"
  en: "Ibn Khaldun's prolegomenon on the nature of civilisation, asabiyya, dynasties, crafts and sciences {cite:muqaddima-ibn-khaldun pdf6}."
