label: { ar: "قصيدة حسان لبني سليم «زادت همومي فماء العين منحدر»", en: "Hassan's poem to Banu Sulaym 'My sorrows grew'", es: "El poema de Hassan a Banu Sulaym: \"Mis penas crecieron\".", fr: "Le poème d'Hassan à Banu Sulaym « Mes chagrins grandissaient »", ur: "بنو سلیم کے لیے حسن کی نظم 'میرے دکھ بڑھے'" }
summary:
  ar: "أبيات لحسان بن ثابت من البسيط على روي الراء، قالها لبني سليم حين قدمهم رسول الله يوم فتح مكة وكانوا ألفا {{cite:sharh-diwan-hassan-barquqi-1929 p.198-199}}."
  en: "Verses by Hassan ibn Thabit in the basit metre on the rhyme ra', said to Banu Sulaym when the Messenger put them forward on the day of the conquest of Mecca, a thousand strong {{cite:sharh-diwan-hassan-barquqi-1929 p.198-199}}."
  es: "Versos de Hassan ibn Thabit en metro basit con rima ra', dicho a Banu Sulaym cuando el Mensajero los presentó el día de la conquista de La Meca, mil fuertes {{cite:sharh-diwan-hassan-barquqi-1929 p.198-199}}."
  fr: "Versets de Hassan ibn Thabit en mètre basit sur la rime ra', dits aux Banu Sulaym lorsque le Messager les a présentés le jour de la conquête de La Mecque, un millier d'hommes {{cite:sharh-diwan-hassan-barquqi-1929 p.198-199}}."
  ur: "حسان بن ثابت کی آیات باسط میٹر رع میں، بنو سلیم سے کہی گئیں جب رسول اللہ نے فتح مکہ کے دن انہیں ایک ہزار مضبوط {{حوالہ:شرح دیوان حسن برقوی-1929 ص198-199}} آگے بڑھایا۔"
