summary:
  ar: "سائل سأل عن طهارة وصلاة مريض أجرى عملية الكولوستومي واضطر إلى تركيب كيس لحمل الفضلات ولا يمكنه التحكم في عملية الإخراج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20837)⁩ ببيان حكم طهارته وصلاته على وجهها."
  en: "A questioner asked about purity and prayer for a patient who had colostomy surgery and must wear a waste bag he cannot control. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20837) answered by setting out the rulings on his purity and prayer."
  ur: "ایک سائل نے کولوسٹومی مریض کی طہارت اور نماز کا حکم پوچھا جسے فضلہ کا تھیلا لگانا پڑا ہو اور وہ اخراج پر قابو نہیں رکھتا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20837)⁩ نے جواب میں طہارت اور نماز کے احکام بیان کیے۔"
