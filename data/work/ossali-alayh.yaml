kind: lecture-series
label:
  ar: "أصلّي عليه ⁦(برنامج تلفزيوني)⁩"
  en: "Osalli Alayh: I Invoke Blessings on Him (television programme)"
  ur: "اُصلّی علیہ: میں ان پر درود بھیجتا ہوں ⁦(ٹیلی وژن پروگرام)⁩"
  es: "Osalli Alayh: Le invoco bendiciones (programa de televisión)"
  fr: "Osalli Alayh: Je lui invoque des bénédictions (programme télévisé)"
  tr: "Ben onun üzerine dua ediyorum (TV programı)"
  id: "Saya berdoa untuk itu (program TV)"
summary:
  ar: "برنامج تلفزيوني قصير لأحمد عبد السلام عن الصلاة على النبي ومحبته واتباعه، يحفظ منه أرشيف أسابيل اثنتين وعشرين حلقة مصوّرة من تسع دقائق إلى اثنتي عشرة دقيقة، يتكلم فيها المتحدث وحده بين نشيد قصير في الافتتاح والختام، ويسمّي حلقاته أيضًا «هذا هو رسول الله»: واجبات الشهادة بالرسالة الخمسة، ومعنى الصلاة والسلام والبركة على النبي وفضلها، وحب الله للنبي وحب النبي لربه في صلاته وقيامه، وحب الصحابة والبهائم والجمادات له، ثم وصايا نبوية في الاستعاذة والعافية والعلم والرشد."
  en: "A short television programme by Ahmed Abdussalam on invoking blessings on the Prophet, loving him and following him, of which the Assabile archive keeps twenty-two video episodes of nine to twelve minutes, the speaker alone between a short sung refrain at the opening and close; he also calls the episodes 'This is the Messenger of God': the five duties of the testimony to his messengerhood, the meaning and merit of invoking blessing, peace and grace on the Prophet, God's love for the Prophet and the Prophet's love for his Lord in prayer and night vigil, the love the Companions, a camel, trees, a palm trunk and a mountain had for him, then prophetic counsels on seeking refuge, well-being, knowledge and right guidance."
  ur: "احمد عبد السلام کا نبی پر درود، ان کی محبت اور اتباع پر ایک مختصر ٹیلی وژن پروگرام، جس کی نو سے بارہ منٹ کی بائیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں، مقرر اکیلے، شروع اور آخر میں ایک مختصر ترانے کے درمیان؛ وہ اقساط کو «یہ ہیں اللہ کے رسول» بھی کہتے ہیں: رسالت کی گواہی کے پانچ تقاضے، نبی پر صلاۃ، سلام اور برکت کا مطلب اور فضیلت، اللہ کی نبی سے محبت اور نماز و قیامِ لیل میں نبی کی اپنے رب سے محبت، صحابہ، ایک اونٹ، درختوں، کھجور کے تنے اور ایک پہاڑ کی ان سے محبت، پھر پناہ مانگنے، عافیت، علم اور رشد کے بارے میں نبوی نصیحتیں۔"
  es: "Un breve programa de televisión de Ahmed Abdussalam sobre cómo invocar bendiciones sobre el Profeta, amarlo y seguirlo, del cual el archivo Assabile conserva veintidós episodios de vídeo de nueve a doce minutos, con el orador solo entre un breve estribillo cantado al principio y al final; también titula los episodios \"Este es el Mensajero de Dios\": los cinco deberes del testimonio de su condición de mensajero, el significado y el mérito de invocar bendiciones, paz y gracia sobre el Profeta, el amor de Dios por el Profeta y el amor del Profeta por su Señor en la oración y la vigilia nocturna, el amor que los Compañeros, un camello, los árboles, un tronco de palma y una montaña le tenían, y luego consejos proféticos sobre cómo buscar refugio, bienestar, conocimiento y guía correcta."
  fr: "Un court programme télévisé d'Ahmed Abdussalam sur l'invocation des bénédictions sur le Prophète, l'amour qu'on lui porte et le fait de le suivre. Les archives d'Assabile conservent vingt-deux épisodes vidéo de neuf à douze minutes, où l'orateur est seul entre un court refrain chanté au début et à la fin. Il intitule également ces épisodes « Voici le Messager de Dieu ». Le programme aborde les cinq devoirs liés au témoignage de sa prophétie, la signification et le mérite d'invoquer la bénédiction, la paix et la grâce sur le Prophète, l'amour de Dieu pour le Prophète et l'amour du Prophète pour son Seigneur dans la prière et la veille nocturne, l'amour que les Compagnons, un chameau, des arbres, un tronc de palmier et une montagne lui portaient, puis des conseils prophétiques sur la recherche de refuge, le bien-être, la connaissance et la bonne voie."
  tr: "Ahmed Abdelsalam'ın Peygamber'e, sevgisine nimet gönderme ve onu takip etme üzerine kısa bir televizyon programı, İsabel'in arşivini korur ve dokuz dakikadan on iki dakikaya kadar değişen yirmi iki kayıtlı bölüm içerir; burada konuşmacı açılış ve kapanış kıtalarında kısa bir ilahi söyler ve bölümlerine \"Bu Allah'ın Elçisidir\" olarak adlandırılır: beş harfle tanıklık etme görevleri, duaların anlamı, Peygamber'e ve onların erdemi üzerindeki bereketler, Allah'ın Peygamber'e olan sevgisi, Peygamber'in dualarında ve dualarında Rabbine olan sevgisi, sahabeler, hayvanlar ve cansız nesnelere olan sevgisi, ardından sığınak, iyilik, bilgi ve rehberlik konusunda peygamberlik tavsiyeleri gelir."
  id: "Sebuah program televisi singkat oleh Ahmed Abdelsalam tentang mengirimkan berkat kepada Nabi, kasihnya, dan mengikutinya, menyimpan arsip Isabel dan berisi dua puluh dua episode yang tercatat berdurasi antara sembilan menit hingga dua belas menit masing-masing, di mana hanya pembicara yang berbicara dalam himne singkat pada bait pembuka dan penutup, dan juga menamai episode-episodenya \"Inilah Rasulullah\": tugas memberikan kesaksian dalam lima huruf, makna doa, damai, dan berkat kepada Nabi dan kebajikan mereka, kasih Allah kepada Nabi, kasih Nabi kepada Tuhan dalam doa dan doanya, kasih kepada para sahabat, hewan, dan benda-benda mati untuknya, diikuti dengan nasihat nubuat tentang mencari perlindungan, kesejahteraan, pengetahuan, dan bimbingan."
