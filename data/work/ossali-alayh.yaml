label:
  ar: "أصلّي عليه ⁦(برنامج تلفزيوني)⁩"
  en: "Osalli Alayh: I Invoke Blessings on Him (television programme)"
  ur: "اُصلّی علیہ: میں ان پر درود بھیجتا ہوں (ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني قصير لأحمد عبد السلام عن الصلاة على النبي ومحبته واتباعه، يحفظ منه أرشيف أسابيل اثنتين وعشرين حلقة مصوّرة من تسع دقائق إلى اثنتي عشرة دقيقة، يتكلم فيها المتحدث وحده بين نشيد قصير في الافتتاح والختام، ويسمّي حلقاته أيضًا «هذا هو رسول الله»: واجبات الشهادة بالرسالة الخمسة، ومعنى الصلاة والسلام والبركة على النبي وفضلها، وحب الله للنبي وحب النبي لربه في صلاته وقيامه، وحب الصحابة والبهائم والجمادات له، ثم وصايا نبوية في الاستعاذة والعافية والعلم والرشد."
  en: "A short television programme by Ahmed Abdussalam on invoking blessings on the Prophet, loving him and following him, of which the Assabile archive keeps twenty-two video episodes of nine to twelve minutes, the speaker alone between a short sung refrain at the opening and close; he also calls the episodes 'This is the Messenger of God': the five duties of the testimony to his messengerhood, the meaning and merit of invoking blessing, peace and grace on the Prophet, God's love for the Prophet and the Prophet's love for his Lord in prayer and night vigil, the love the Companions, a camel, trees, a palm trunk and a mountain had for him, then prophetic counsels on seeking refuge, well-being, knowledge and right guidance."
  ur: "احمد عبد السلام کا نبی پر درود، ان کی محبت اور اتباع پر ایک مختصر ٹیلی وژن پروگرام، جس کی نو سے بارہ منٹ کی بائیس ویڈیو اقساط اسابیل آرکائیو میں محفوظ ہیں، مقرر اکیلے، شروع اور آخر میں ایک مختصر ترانے کے درمیان؛ وہ اقساط کو «یہ ہیں اللہ کے رسول» بھی کہتے ہیں: رسالت کی گواہی کے پانچ تقاضے، نبی پر صلاۃ، سلام اور برکت کا مطلب اور فضیلت، اللہ کی نبی سے محبت اور نماز و قیامِ لیل میں نبی کی اپنے رب سے محبت، صحابہ، ایک اونٹ، درختوں، کھجور کے تنے اور ایک پہاڑ کی ان سے محبت، پھر پناہ مانگنے، عافیت، علم اور رشد کے بارے میں نبوی نصیحتیں۔"
