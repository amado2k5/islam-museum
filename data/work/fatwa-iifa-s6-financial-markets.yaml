summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩ بعد استعراض ما في الشريعة من الحث على الكسب الحلال واستثمار المال على أسس الاستثمار الإسلامي القائم على المشاركة في الأعباء وتحمل المخاطر: بيّن أحكام ما يجري في الأسواق المالية من تداول الأموال وأنشطتها على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on financial markets: after reviewing the sharia's encouragement of lawful gain and investment on Islamic principles of sharing burdens and bearing risk, it sets out the rulings of what financial markets trade in funds and of their activities, as detailed."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ مالیاتی بازاروں پر: اسلامی سرمایہ کاری کے اصولوں کی روشنی میں بازاروں کی سرگرمیوں کے احکام بیان ہوئے۔"
  es: "Resolución de la sexta sesión de la IIFA (Jeddah, marzo de 1990) sobre los mercados financieros: tras revisar el fomento de la sharia de las ganancias lícitas y la inversión según los principios islámicos de compartir cargas y asumir riesgos, establece las normas sobre qué fondos negocian los mercados financieros y sobre sus actividades, tal como se detalla."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les marchés financiers: après avoir examiné l'encouragement par la charia du gain licite et de l'investissement sur les principes islamiques de partage des charges et de prise en charge des risques, elle énonce les règles relatives aux fonds négociés sur les marchés financiers et à leurs activités, telles que détaillées."
