id: work/fatwa-dar-alifta-eg-iftar-at-airport-sun-visible
class: work
kind: fatwa
label: { ar: "حكم الإفطار بالمطار عند الغروب ثم رؤية الشمس في الطائرة", en: "Breaking fast at the airport at sunset then seeing the sun from the plane", ur: "ایئرپورٹ پر غروبِ آفتاب کے وقت افطار پھر جہاز سے سورج نظر آنا", es: "Desayunar en el aeropuerto al atardecer y luego ver el sol desde el avión.", fr: "Rupture du jeûne à l'aéroport au coucher du soleil, puis contemplation du soleil depuis l'avion" }
summary:
  ar: "سائل أفطر بالمطار عند غروب الشمس ثم رأى الشمس في الجو من الطائرة فسأل عن صومه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21768)⁩ أن صيام من أفطر بعد غروب الشمس صحيح ولا يجب عليه الإمساك لرؤية الشمس في الطائرة بعد ذلك على ما فصّل الجواب من علة ذلك."
  en: "A man broke his fast at the airport at sunset, then saw the sun from the plane, and asked about his fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21768) answered that the fast of one who broke it after the sun's setting is valid — he need not abstain anew for seeing the sun from the plane — as the answer explains."
  ur: "ایک شخص نے ایئرپورٹ پر سورج غروب ہونے پر افطار کیا پھر جہاز سے سورج نظر آیا؛ اس نے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21768)⁩ نے جواب دیا کہ غروب کے بعد افطار کرنے والے کا روزہ درست ہے اور جہاز سے سورج دیکھنے پر دوبارہ روکنا لازم نہیں — جیسا کہ جواب میں وجہ بیان ہوئی۔"
  es: "Un hombre rompió su ayuno en el aeropuerto al atardecer, luego vio el sol desde el avión y preguntó sobre la validez de su ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21768) respondió que el ayuno de quien lo rompió después de la puesta del sol es válido; no necesita abstenerse nuevamente por ver el sol desde el avión, como se explica en la respuesta."
  fr: "Un homme a rompu son jeûne à l'aéroport au coucher du soleil, puis, ayant aperçu le soleil depuis l'avion, il s'est renseigné sur la validité de son jeûne. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21768) a répondu que le jeûne rompu après le coucher du soleil est valide; il n'est donc pas tenu de jeûner à nouveau après avoir vu le soleil depuis l'avion, comme l'explique la réponse."
