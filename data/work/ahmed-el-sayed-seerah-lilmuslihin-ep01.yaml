class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 1: مقدمة"
  en: "The Prophetic Biography for Reformers, episode 1: Introduction"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 1: تمہید"
  fr: "La biographie prophétique pour les réformateurs, épisode 1 : Introduction"
  es: "La biografía profética para los reformadores, episodio 1: Introducción"
summary:
  ar: "المحاضرة الافتتاحية من سلسلة السيرة النبوية للمصلحين. يبين المتحدث لماذا تعد دراسة سيرة النبي شكرا للنعمة وواجبا، ولماذا يجب أن يقرأ هديه قراءة شاملة تجمع بين السنة وكتب السيرة، وما الثمار الثلاث التي يريدها من السلسلة وهي الهداية والفقه في الدين وزيادة الإيمان برسالة النبي. ويصف كذلك كيف سيقرأ السيرة بوصفها مدرسة أدارها النبي وكان الصحابة طلابها."
  en: "The opening lecture of the series on the Prophet's biography for reformers. The speaker explains why the study of the Prophet's life is an act of gratitude and a duty, why his guidance must be read as a whole drawing on both the Sunna and the biographical books, and which three fruits he wants from the series: guidance, understanding of the religion, and firmer faith in the Prophet's mission. He also describes how he will read the biography through the school the Prophet ran and the Companions who were its students."
  ur: "یہ سیرت نبوی برائے مصلحین سلسلے کا افتتاحی لیکچر ہے۔ مقرر بتاتے ہیں کہ نبی کی سیرت کا مطالعہ نعمت پر شکر بھی ہے اور فرض بھی، ان کی ہدایت کو سنت اور سیرت کی کتابوں کو جوڑ کر مکمل طور پر پڑھنا کیوں ضروری ہے، اور وہ اس سلسلے سے کون سے تین ثمرات چاہتے ہیں: ہدایت، دین کی سمجھ، اور نبی کی رسالت پر پختہ ایمان۔ وہ یہ بھی بتاتے ہیں کہ سیرت کو اس مدرسے کے طور پر پڑھا جائے گا جسے نبی چلاتے تھے اور جس کے طالب علم صحابہ تھے۔"
  fr: "Conférence d'ouverture de la série sur la biographie du Prophète pour les réformateurs. Le conférencier explique pourquoi l'étude de la vie du Prophète est à la fois un acte de gratitude et un devoir, pourquoi sa guidance doit être lue dans son ensemble en réunissant la Sunna et les livres de biographie, et quels trois fruits il attend de la série : la guidance, la compréhension de la religion et une foi plus ferme en la mission du Prophète. Il décrit aussi comment il lira la biographie comme l'école que dirigeait le Prophète et dont les Compagnons étaient les élèves."
  es: "Conferencia inaugural de la serie sobre la biografía del Profeta para reformistas. El conferenciante explica por qué estudiar la vida del Profeta es un acto de gratitud y un deber, por qué su guía debe leerse en conjunto, reuniendo la Sunna y los libros de biografía, y qué tres frutos espera de la serie: la guía, la comprensión de la religión y una fe más firme en la misión del Profeta. También describe cómo leerá la biografía como la escuela que dirigía el Profeta y de la que los Compañeros eran los alumnos."
