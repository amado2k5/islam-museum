id: work/fatwa-aliftaa-jo-wholesale-gold-sold-on-credit
class: work
kind: fatwa
label: { ar: "بيع الذهب بالجملة بالدين", en: "Wholesale gold sold on credit", ur: "تھوک سونا ادھار پر بیچنا", es: "Oro al por mayor vendido a crédito", fr: "or en gros vendu à crédit" }
summary:
  ar: "سؤال عن بيع الذهب بالجملة بالدين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم بيع الذهب بالتقسيط أو بثمن مؤجل ولا بد من التقابض والتماثل في الوزن عند المبادلة، والمخرج عقدان نقديان منفصلان أو أجرة صياغة. أجابت الدائرة بأنه يحرم بيع الذهب أو الفضة بالتقسيط أو بثمن مؤجل، بل لا بد من التقابض وإلا كان من الربا، واستدلت بحديث رواه مسلم في الأصناف الستة، معناه أن الذهب بالذهب والفضة بالفضة وسائرها تباع مثلًا بمثل يدًا بيد، وأن الزيادة ربا يستوي فيه الآخذ والمعطي. وقالت إنه لا بد من تساوي وزن الذهب عند مبادلة الجديد بالمستعمل، وإلا وقع في الربا. وذكرت أن المخرج أن يشتري التاجر الذهب المستعمل بالمال ثم يبيع الذهب الجديد بالمال، مع دفع الثمن في مجلس العقد في كلا العقدين، أو أن يأخذ الذهب المستعمل لإعادة صياغته أو إصلاحه ثم يأخذ أجرة الصياغة أو التصليح."
  en: "A question about wholesale gold sold on credit, in which Jordan's General Iftaa Department answered that selling gold in instalments or for a deferred price is forbidden, that hand-to-hand exchange and equal weight are required, and that the way out is two separate cash contracts or a crafting fee. The Department answered that selling gold or silver in instalments or for a deferred price is forbidden and immediate mutual taking possession is required, otherwise it is riba, citing a hadith narrated by Muslim on the six commodities, whose meaning is that gold for gold, silver for silver and the rest are exchanged like for like and hand to hand, and that any increase is riba in which taker and giver are equal. It said that when new gold is exchanged for used gold, the weights must be equal, otherwise it falls into riba. It said the way out is for the trader to buy the used gold for money and then sell the new gold for money, with the price paid in the contract session in both contracts, or to take the used gold to re-craft or repair it and then charge a fee for the crafting or repair."
  ur: "تھوک سونا ادھار پر بیچنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونا قسطوں یا ادھار قیمت پر بیچنا حرام ہے، ہاتھوں ہاتھ قبضہ اور تبادلے میں برابر وزن لازم ہے، اور حل دو الگ نقد عقد یا ڈھلائی کی اجرت ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سونا یا چاندی قسطوں یا ادھار قیمت پر بیچنا حرام ہے، بلکہ فوری باہمی قبضہ ضروری ہے ورنہ یہ سود ہے، اور چھ اشیا کے بارے میں مسلم کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ سونا سونے کے بدلے، چاندی چاندی کے بدلے اور باقی اشیا برابر برابر اور ہاتھوں ہاتھ ہوں، اور زیادتی سود ہے جس میں لینے والا اور دینے والا برابر ہیں۔ اس نے کہا کہ نئے سونے کا پرانے سونے سے تبادلہ ہو تو وزن برابر ہونا ضروری ہے ورنہ سود ہوگا۔ اس نے کہا کہ حل یہ ہے کہ تاجر پرانا سونا رقم کے بدلے خریدے پھر نیا سونا رقم کے بدلے بیچے، اور دونوں عقدوں میں قیمت مجلسِ عقد میں ادا ہو، یا پرانا سونا دوبارہ ڈھالنے یا مرمت کے لیے لے اور پھر ڈھلائی یا مرمت کی اجرت لے۔"
  es: "Una pregunta sobre la venta de oro al por mayor a crédito, en la que el Departamento General de Iftaa de Jordania respondió que la venta de oro a plazos o a precio diferido está prohibida, que se requiere el intercambio en mano y el mismo peso, y que la solución son dos contratos en efectivo separados o una tarifa de elaboración. El Departamento respondió que la venta de oro o plata a plazos o a precio diferido está prohibida y se requiere la toma de posesión mutua inmediata, de lo contrario es riba, citando un hadiz narrado por Muslim sobre las seis mercancías, cuyo significado es que el oro por oro, la plata por plata y el resto se intercambian como iguales y en mano, y que cualquier aumento es riba en el que el que recibe y el que da son iguales. Dijo que cuando se intercambia oro nuevo por oro usado, los pesos deben ser iguales, de lo contrario cae en riba. Se indicó que la solución consiste en que el comerciante compre el oro usado a cambio de dinero y luego venda el oro nuevo a cambio de dinero, pagando el precio en la sesión contractual en ambos contratos, o bien que utilice el oro usado para volver a fabricarlo o repararlo y luego cobre una tarifa por la fabricación o reparación."
  fr: "Une question concernant la vente d'or en gros à crédit a été posée au Département général de la jurisprudence jordanienne (Iftaa). Ce dernier a statué que la vente d'or à crédit ou par versements différés est interdite, qu'un échange direct et un poids égal sont requis, et que la seule solution est la conclusion de deux contrats au comptant distincts ou le versement de frais de fabrication. Le Département a précisé que la vente d'or ou d'argent à crédit ou par versements différés est interdite et qu'une prise de possession immédiate et réciproque est obligatoire, faute de quoi il s'agit d'usure (riba). Il s'appuie sur un hadith rapporté par Muslim concernant les six marchandises, selon lequel l'or contre l'or, l'argent contre l'argent, et les autres métaux précieux, doivent être échangés à valeur égale et de main à main. Toute augmentation de prix constitue de l'usure (riba) lorsque le vendeur et l'acheteur sont égaux. Le Département a également indiqué que lors de l'échange d'or neuf contre de l'or usagé, les poids doivent être égaux, sous peine de constituer de l'usure (riba). Il a été indiqué que la solution consiste pour le commerçant à acheter l'or usagé contre de l'argent, puis à revendre le nouvel or contre de l'argent, le prix payé lors de la séance de contrat étant le même pour les deux contrats, ou à récupérer l'or usagé pour le retravailler ou le réparer, puis à facturer des frais pour la fabrication ou la réparation."
