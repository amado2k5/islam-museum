id: work/fatwa-aliftaa-jo-wholesale-gold-sold-on-credit
class: work
kind: fatwa
label: { ar: "بيع الذهب بالجملة بالدين", en: "Wholesale gold sold on credit", ur: "تھوک سونا ادھار پر بیچنا" }
summary:
  ar: "سؤال عن بيع الذهب بالجملة بالدين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يحرم بيع الذهب بالتقسيط أو بثمن مؤجل ولا بد من التقابض والتماثل في الوزن عند المبادلة، والمخرج عقدان نقديان منفصلان أو أجرة صياغة. أجابت الدائرة بأنه يحرم بيع الذهب أو الفضة بالتقسيط أو بثمن مؤجل، بل لا بد من التقابض وإلا كان من الربا، واستدلت بحديث رواه مسلم في الأصناف الستة، معناه أن الذهب بالذهب والفضة بالفضة وسائرها تباع مثلًا بمثل يدًا بيد، وأن الزيادة ربا يستوي فيه الآخذ والمعطي. وقالت إنه لا بد من تساوي وزن الذهب عند مبادلة الجديد بالمستعمل، وإلا وقع في الربا. وذكرت أن المخرج أن يشتري التاجر الذهب المستعمل بالمال ثم يبيع الذهب الجديد بالمال، مع دفع الثمن في مجلس العقد في كلا العقدين، أو أن يأخذ الذهب المستعمل لإعادة صياغته أو إصلاحه ثم يأخذ أجرة الصياغة أو التصليح."
  en: "A question about wholesale gold sold on credit, in which Jordan's General Iftaa Department answered that selling gold in instalments or for a deferred price is forbidden, that hand-to-hand exchange and equal weight are required, and that the way out is two separate cash contracts or a crafting fee. The Department answered that selling gold or silver in instalments or for a deferred price is forbidden and immediate mutual taking possession is required, otherwise it is riba, citing a hadith narrated by Muslim on the six commodities, whose meaning is that gold for gold, silver for silver and the rest are exchanged like for like and hand to hand, and that any increase is riba in which taker and giver are equal. It said that when new gold is exchanged for used gold, the weights must be equal, otherwise it falls into riba. It said the way out is for the trader to buy the used gold for money and then sell the new gold for money, with the price paid in the contract session in both contracts, or to take the used gold to re-craft or repair it and then charge a fee for the crafting or repair."
  ur: "تھوک سونا ادھار پر بیچنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سونا قسطوں یا ادھار قیمت پر بیچنا حرام ہے، ہاتھوں ہاتھ قبضہ اور تبادلے میں برابر وزن لازم ہے، اور حل دو الگ نقد عقد یا ڈھلائی کی اجرت ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سونا یا چاندی قسطوں یا ادھار قیمت پر بیچنا حرام ہے، بلکہ فوری باہمی قبضہ ضروری ہے ورنہ یہ سود ہے، اور چھ اشیا کے بارے میں مسلم کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ سونا سونے کے بدلے، چاندی چاندی کے بدلے اور باقی اشیا برابر برابر اور ہاتھوں ہاتھ ہوں، اور زیادتی سود ہے جس میں لینے والا اور دینے والا برابر ہیں۔ اس نے کہا کہ نئے سونے کا پرانے سونے سے تبادلہ ہو تو وزن برابر ہونا ضروری ہے ورنہ سود ہوگا۔ اس نے کہا کہ حل یہ ہے کہ تاجر پرانا سونا رقم کے بدلے خریدے پھر نیا سونا رقم کے بدلے بیچے، اور دونوں عقدوں میں قیمت مجلسِ عقد میں ادا ہو، یا پرانا سونا دوبارہ ڈھالنے یا مرمت کے لیے لے اور پھر ڈھلائی یا مرمت کی اجرت لے۔"
