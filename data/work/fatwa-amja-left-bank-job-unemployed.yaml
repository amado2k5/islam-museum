id: work/fatwa-amja-left-bank-job-unemployed
class: work
kind: fatwa
label: { ar: "ترك العمل في البنك والبطالة", en: "Leaving a bank job, then unemployment", ur: "بینک کی نوکری چھوڑنا اور بےروزگاری", es: "Dejar un trabajo en un banco y luego quedarse en el desempleo.", fr: "Après avoir quitté mon emploi dans une banque, je me suis retrouvé au chômage." }
summary:
  ar: "سأل رجل ترك العمل في البنك خوفًا من الله فبقي عاطلًا أكثر من سنة وقد كان يعتقد أن الله سيعوضه خيرًا منه لقوله من ترك شيئًا لله عوضه الله خيرًا منه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81748 بتاريخ 25 يونيو 2010)⁩ بنصحه بالمزيد من الصبر وحسن الظن بالله والضراعة والاستكانة والدعاء، وأن يعلم أن الله ما حبس عنه ذلك إلا ليعوضه بما هو أفضل منه، وأبشره بفرج قريب وذكره بحديث عجب ربك من قنوط عباده وقرب فرجه."
  en: "A man who left his bank job out of fear of God and had been unemployed over a year — though he had believed God would grant him better, per 'whoever leaves something for God, God compensates him with better' — asked about it. Dr. Salah al-Sawi (fatwa no. 81748, 25 June 2010) advised more patience, good opinion of God, earnest humble supplication; to know that God withheld it only to compensate him with better, and gave him tidings of near relief, reminding him of the hadith that your Lord marvels at His servants' despair while relief is near — He looks at you lowly and despairing and keeps smiling, knowing your relief is close."
  ur: "ایک شخص نے اللہ کے خوف سے بینک کی نوکری چھوڑی اور سال بھر سے بےروزگار ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81748، 25 جون 2010)⁩ کے مطابق صبر، اللہ سے حسن ظن اور دعا کرے — اللہ نے صرف اس لیے روکا کہ بہتر عوض دے؛ فرج قریب کی بشارت دی۔"
  es: "Un hombre que había dejado su trabajo en el banco por temor a Dios y llevaba más de un año desempleado —aunque creía que Dios le concedería algo mejor, según el dicho «quien deja algo por Dios, Dios le recompensa con algo mejor»— preguntó al respecto. El Dr. Salah al-Sawi (fatwa n.º 81748, 25 de junio de 2010) le aconsejó tener más paciencia, tener una buena opinión de Dios y hacer súplicas sinceras y humildes; que supiera que Dios solo lo había retenido para compensarlo con algo mejor, y le dio buenas noticias de un alivio próximo, recordándole el hadiz que dice que tu Señor se maravilla de la desesperación de Sus siervos cuando el alivio está cerca: Él te mira humilde y desesperado y sigue sonriendo, sabiendo que tu alivio está cerca."
  fr: "Un homme, qui avait quitté son emploi à la banque par crainte de Dieu et était au chômage depuis plus d'un an – bien qu'il ait cru que Dieu lui accorderait mieux, conformément au principe « Quiconque s'en remet à Dieu, Dieu le récompense par mieux » – interrogea le Dr Salah al-Sawi (fatwa n° 81748, 25 juin 2010) à ce sujet. Il lui conseilla de faire preuve de patience, de garder une bonne opinion de Dieu et de le supplier humblement et sincèrement; de savoir que Dieu avait retenu sa demande uniquement pour mieux le récompenser, et lui annonça un soulagement imminent, lui rappelant le hadith selon lequel ton Seigneur s'étonne du désespoir de Ses serviteurs alors que le soulagement est proche – Il te regarde humblement et désespérément, et continue de sourire, sachant que ton soulagement est proche."
