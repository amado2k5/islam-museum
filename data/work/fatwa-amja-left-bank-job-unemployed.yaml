id: work/fatwa-amja-left-bank-job-unemployed
class: work
kind: fatwa
label: { ar: "ترك العمل في البنك والبطالة", en: "Leaving a bank job, then unemployment", ur: "بینک کی نوکری چھوڑنا اور بےروزگاری" }
summary:
  ar: "سأل رجل ترك العمل في البنك خوفًا من الله فبقي عاطلًا أكثر من سنة وقد كان يعتقد أن الله سيعوضه خيرًا منه لقوله من ترك شيئًا لله عوضه الله خيرًا منه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81748 بتاريخ 25 يونيو 2010)⁩ بنصحه بالمزيد من الصبر وحسن الظن بالله والضراعة والاستكانة والدعاء، وأن يعلم أن الله ما حبس عنه ذلك إلا ليعوضه بما هو أفضل منه، وأبشره بفرج قريب وذكره بحديث عجب ربك من قنوط عباده وقرب فرجه."
  en: "A man who left his bank job out of fear of God and had been unemployed over a year — though he had believed God would grant him better, per 'whoever leaves something for God, God compensates him with better' — asked about it. Dr. Salah al-Sawi (fatwa no. 81748, 25 June 2010) advised more patience, good opinion of God, earnest humble supplication; to know that God withheld it only to compensate him with better, and gave him tidings of near relief, reminding him of the hadith that your Lord marvels at His servants' despair while relief is near — He looks at you lowly and despairing and keeps smiling, knowing your relief is close."
  ur: "ایک شخص نے اللہ کے خوف سے بینک کی نوکری چھوڑی اور سال بھر سے بےروزگار ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81748، 25 جون 2010)⁩ کے مطابق صبر، اللہ سے حسن ظن اور دعا کرے — اللہ نے صرف اس لیے روکا کہ بہتر عوض دے؛ فرج قریب کی بشارت دی۔"
