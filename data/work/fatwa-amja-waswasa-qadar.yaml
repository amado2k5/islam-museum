id: work/fatwa-amja-waswasa-qadar
class: work
kind: fatwa
label: { ar: "الوسوسة في باب القضاء والقدر", en: "Obsessive doubt over divine decree", ur: "تقدیر کے باب میں وسوسہ", es: "Duda obsesiva sobre el decreto divino", fr: "Doute obsessionnel à l'égard du décret divin", tr: "Kararname ve Kader Bölümü'ndeki fısıltılar", id: "Bisikan dalam Bab Dekrit dan Predestinasi" }
summary:
  ar: "سأل مريض بالوسوسة في باب القضاء والقدر هل يجوز له ترك استحضار الإيمان بالقضاء والقدر عند الإقبال على المشاريع لأنه يورثه ضعفًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86499 بتاريخ 29 فبراير 2012)⁩ أن الإيمان بالقدر ركن من أركان الإيمان وأن الاستسلام لسوء القراءة هو الخطأ، فكل شيء خلقه الله بقدر والقدر يدفع بالقدر — قدر المرض بقدر التداوي وقدر الجوع بقدر الطعام — وأن الإيمان بالقدر لا يعني التفريط في الأسباب بل إحسان اتخاذها في مقام الأسباب والتبرؤ من الحول والقوة في مقام التوكل على ما فصّل."
  en: "A sufferer of obsessive doubts over divine decree asked whether he may stop holding faith in qadar before projects since it weakens him. Dr. Salah al-Sawi (fatwa no. 86499, 29 February 2012) answered that faith in decree is a pillar of iman and that yielding to misreading is the error: everything was created by decree and decree is repelled by decree — illness by treatment, hunger by food; faith in decree never means neglecting means — one takes them well in the station of means and disowns power and might in the station of reliance, as detailed."
  ur: "تقدیر کے وسوسے میں مبتلا سائل نے پوچھا کہ کیا وہ تدبیر سے پہلے قدر کا احساس چھوڑ دے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86499، 29 فروری 2012)⁩ کے مطابق قدر پر ایمان ایمان کا رکن ہے؛ قدر قدر سے دفعی ہوتا ہے — بیماری علاج سے؛ اسباب اختیار کرنا ترک نہیں ہوتا۔"
  es: "Un hombre que sufría de dudas obsesivas sobre el decreto divino preguntó si podía dejar de creer en el qadar antes de los proyectos, ya que esto lo debilitaba. El Dr. Salah al-Sawi (fatwa n.° 86499, 29 de febrero de 2012) respondió que la fe en el decreto es un pilar del iman y que ceder a la mala interpretación es el error: todo fue creado por decreto y el decreto es repelido por decreto: la enfermedad por el tratamiento, el hambre por el alimento; la fe en el decreto nunca significa descuidar los medios: uno los toma bien en la estación de los medios y renuncia al poder y la fuerza en la estación de la confianza, como se detalla."
  fr: "Un homme en proie à des doutes obsessionnels quant au décret divin a demandé s'il pouvait renoncer à croire au qadar avant d'entreprendre des projets, car cela l'affaiblissait. Le Dr Salah al-Sawi (fatwa n° 86499, 29 février 2012) a répondu que la foi en le décret est un pilier de la foi et que céder à une mauvaise interprétation est une erreur: tout a été créé par décret et le décret est repoussé par le décret – la maladie par le traitement, la faim par la nourriture; la foi en le décret ne signifie jamais négliger les moyens – on les accepte pleinement en tant que moyens et on renonce au pouvoir et à la force en tant que confiance, comme expliqué en détail."
  tr: "Takıntılı düşüncelerden muzdarip bir kişiye, kader ve kader bölümünde, projeleri üstlenirken ilahi emre ve kaderin güvenini bırakmanın izinli olup olmadığı soruldu çünkü bu zayıflık yaratır. Dr. Salah Al-Sawy (29 Şubat 2012 tarihli Fetva No. 86499) kaderin inancının bir temel direği olduğunu ve kötü okumaya teslim olmanın bir hata olduğunu yanıtladı. Tanrı tarafından yaratılan her şey kaderdir ve kader kader tarafından uzaklaştırılır — hastalığın boyutu tedaviye göre, açlığın boyutu, yiyeceğin miktarı — ve kadere inanmak, nedenleri ihmal etmek değil, onları nedenler bağlamında iyi kullanmak ve Tanrı'ya güvenme bağlamında güç ve kuvveti reddetmek anlamına gelir, açıklandığı gibi."
  id: "Seseorang yang menderita pikiran obsesif ditanya dalam bab takdir dan predestinasi apakah boleh meninggalkan iman pada dekret dan predestinasi ilahi saat melakukan proyek karena hal itu menyebabkan kelemahan. Dr. Salah Al-Sawy menjawab (Fatwa No. 86499 tanggal 29 Februari 2012) bahwa iman pada predestinasi adalah pilar iman dan menyerah pada bacaan yang buruk adalah sebuah kesalahan. Segala sesuatu yang diciptakan oleh Tuhan adalah predestinasi, dan takdir ditolak oleh takdir — sejauh mana penyakit menurut obat, tingkat kelaparan dan tingkat makanan — dan kepercayaan pada predestinasi bukan berarti mengabaikan sebab tetapi melakukan kebaikan dengan menggunakannya dalam konteks sebab dan menolak kekuatan serta kekuatan dalam konteks ketergantungan pada Tuhan, seperti yang telah dijelaskan."
