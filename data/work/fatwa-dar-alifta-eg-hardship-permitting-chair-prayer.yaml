label: { ar: "ضابط المشقة المرخصة للصلاة على الكرسي في الفريضة", en: "The degree of hardship permitting praying on a chair in the obligatory prayer", ur: "فرض نماز میں کرسی پر پڑھنے کی اجازت دینے والی مشقت" }
summary:
  ar: "سائل سأل عن ضابط المشقة التي يباح الترخص بها في ترك القيام في صلاة الفريضة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20955)⁩ أن المشقة المرخصة هي المشقة الزائدة عن المعتاد بحيث يترتب عليها زيادة في المرض أو تأخر البرء على ما فصّل الجواب."
  en: "A questioner asked the criterion of hardship permitting the dispensation of sitting for the obligatory prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20955) answered that it is hardship beyond the ordinary such that it would increase illness or delay recovery — as the answer details."
  ur: "ایک سائل نے فرض نماز میں کھڑے نہ ہونے کی رخصت دینے والی مشقت کا ضابط پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20955)⁩ نے جواب دیا کہ وہ مشقت معمول سے زائد ہو جس سے بیماری بڑھے یا شفا دیر ہو — جیسا کہ جواب میں تفصیل ہے۔"
