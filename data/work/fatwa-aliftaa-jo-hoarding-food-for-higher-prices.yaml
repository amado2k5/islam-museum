id: work/fatwa-aliftaa-jo-hoarding-food-for-higher-prices
class: work
kind: fatwa
label: { ar: "حبس السلع الغذائية انتظارًا لارتفاع أسعارها", en: "Withholding food to wait for higher prices", ur: "قیمتیں بڑھنے کے انتظار میں خوراک روکنا" }
summary:
  ar: "سؤال من تاجر مواد غذائية عن تجار يحبسون السلع لعلمهم بارتفاع أسعارها قريبًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن الاحتكار حرام، وأنه أشد حرمة في أقوات الناس. أجابت الدائرة بأن الشريعة حرمت الاحتكار لما فيه من الإضرار بالناس، وعرفته بإمساك ما اشتُري وقت الغلاء لبيعه بأكثر عند اشتداد الحاجة. وقالت إنه يجري في جميع السلع التي يحتاجها الناس إذا أضر حبسها بهم، وهو مذهب المالكية وقول أبي يوسف من الحنفية، ونقلت عن ابن رشد الجد في البيان والتحصيل وعن الكاساني في بدائع الصنائع. وقالت إنه في الأقوات أشد حرمة، ونقلت عن زكريا الأنصاري في أسنى المطالب تحريمه للتضييق على الناس، وعن ابن حجر الهيتمي في الزواجر عده من الكبائر، وأن الغزالي ألحق بالقوت ما يعين عليه كاللحم والفواكه. وخلصت إلى أنه يحرم على التجار حبس المواد الغذائية الأساسية وغيرها من السلع بعد شرائها وقت الغلاء ليبيعوها بسعر أعلى عند اشتداد الحاجة إليها."
  en: "A question from a food trader about merchants who withhold goods because they know prices will soon rise, in which Jordan's General Iftaa Department answered that hoarding is forbidden, and more gravely so for staple foods. The Department answered that the sharia forbids hoarding because it harms people, defining it as holding what was bought at a time of high prices to sell it dearer when need is acute. It said hoarding covers all goods people need if withholding them harms people, the Maliki view and that of Abu Yusuf among the Hanafis, quoting Ibn Rushd al-Jadd's al-Bayan wa-l-Tahsil and al-Kasani's Bada'i al-Sana'i. It said hoarding staple foods is more gravely forbidden, quoting Zakariyya al-Ansari's Asna al-Matalib that it is forbidden because it straitens people, Ibn Hajar al-Haytami's al-Zawajir counting it among the major sins, and his report that al-Ghazali extended staples to what supports them, such as meat and fruit. It concluded that merchants may not withhold basic foodstuffs or other goods bought at a time of high prices in order to sell them dearer when need for them is acute."
  ur: "خوراک کے ایک تاجر کا سوال ان تاجروں کے بارے میں جو قیمتیں جلد بڑھنے کے علم کی وجہ سے سامان روک لیتے ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ذخیرہ اندوزی حرام ہے، اور بنیادی خوراک میں زیادہ سخت حرام ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ شریعت نے ذخیرہ اندوزی کو لوگوں کو نقصان پہنچانے کی وجہ سے حرام کیا ہے، اور اس کی تعریف کی کہ مہنگائی کے وقت خریدی گئی چیز کو شدید ضرورت کے وقت مہنگا بیچنے کے لیے روکنا۔ اس نے کہا کہ یہ ہر اس چیز میں ہے جس کی لوگوں کو ضرورت ہو اگر اسے روکنا ان کے لیے نقصان دہ ہو، اور یہ مالکیہ کا مذہب اور حنفیہ میں ابو یوسف کا قول ہے؛ اس نے ابن رشد الجد کی البیان والتحصیل اور کاسانی کی بدائع الصنائع سے نقل کیا۔ اس نے کہا کہ بنیادی خوراک میں یہ زیادہ سخت حرام ہے، اور زکریا الانصاری کی اسنی المطالب سے نقل کیا کہ لوگوں پر تنگی کی وجہ سے حرام ہے، اور ابن حجر الہیتمی کی الزواجر سے کہ یہ کبیرہ گناہ ہے، اور یہ کہ غزالی نے خوراک کے ساتھ گوشت اور پھل جیسی معاون اشیا کو شامل کیا۔ اس نے نتیجہ نکالا کہ تاجروں کے لیے مہنگائی کے وقت خریدی گئی بنیادی خوراک اور دیگر اشیا کو شدید ضرورت کے وقت مہنگا بیچنے کے لیے روکنا حرام ہے۔"
