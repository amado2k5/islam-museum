id: work/fatwa-dar-alifta-eg-all-profit-to-mudarib
class: work
kind: fatwa
label: { ar: "حكم اشتراط جميع الربح للعامل المضارب", en: "Stipulating all the profit for the working mudarib", ur: "تمام منافع مضارب کو دینے کی شرط", es: "Estipulando que todas las ganancias corresponden al mudarib trabajador.", fr: "Stipulant tous les bénéfices pour le mudarib de travail", tr: "Spekülatör işçinin tüm kârını talep etme kararı", id: "Putusan tentang persyaratan semua keuntungan untuk pekerja spekulan" }
summary:
  ar: "رجل أعطى غيره مالًا ليتجر فيه مضاربة على أن يكون جميع الربح للمضارب فسأل عن الحكم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21717)⁩ أن ما قام به من إعطاء المال مضاربة أمر جائز شرعًا وبيّن الجواب حكم اشتراط جميع الربح للعامل على وجهه."
  en: "A man gave another money to trade with as mudaraba on condition that all the profit go to the working partner, and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21717) answered that the mudaraba arrangement itself is lawful; the answer sets out the ruling on stipulating all the profit for the worker."
  ur: "ایک شخص نے دوسرے کو مضاربہ کے لیے مال دیا اس شرط پر کہ سارا منافع کارکن کا ہو؛ اس نے حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21717)⁩ نے جواب دیا کہ مضاربہ بذات خود جائز ہے اور تمام منافع کارکن کو دینے کی شرط کا حکم جواب میں بیان ہوا۔"
  es: "Un hombre entregó dinero a otro para comerciar como mudaraba, con la condición de que todas las ganancias fueran para el socio trabajador, y solicitó la opinión al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21717) respondió que el acuerdo de mudaraba en sí mismo es lícito; la respuesta establece la norma sobre la estipulación de que todas las ganancias sean para el trabajador."
  fr: "Un homme confia de l'argent à un tiers pour réaliser un commerce en mudaraba, à condition que l'intégralité des bénéfices revienne à l'associé actif. Il demanda alors la décision de la Cour suprême égyptienne (Dar al-Ifta, Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21717) confirma la licéité de l'accord de mudaraba en lui-même et précisa la règle relative à la stipulation de l'intégralité des bénéfices pour l'associé actif."
  tr: "Bir adam, tüm kârın spekülatörlere ait olması amacıyla spekülasyon ticareti yapmak için başka birine para verdi, bu yüzden hüküm hakkında bilgi aldı. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21717), parayı spekülasyon olarak vermesinin İslam hukukuna göre izin verildiğini ve işçinin tüm kârının doğru biçimde alınmasını zorunlu kılan hükmü netleştirdi."
  id: "Seorang pria memberikan uang kepada orang lain untuk diperdagangkan sebagai spekulasi, dengan maksud agar semua keuntungan menjadi milik para spekulan, sehingga ia menanyakan tentang keputusan tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21717) menjawab bahwa apa yang ia lakukan dengan memberikan uang itu sebagai spekulasi diperbolehkan menurut hukum Islam, dan jawaban tersebut memperjelas putusan tentang persyaratan semua keuntungan bagi pekerja dalam bentuk yang semestinya."
