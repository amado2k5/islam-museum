summary:
  ar: "كتاب جغرافي وضعه الإدريسي للملك روجر الثاني في صقلية، يصف الأقاليم السبعة وبلدانها وطرقها وبحارها وأهلها وصناعاتها وتجاراتها، ومعه خريطة للعالم منقوشة في لوح من فضة. وقد أتمه في شوال سنة 548هـ بحسب ما يذكره المؤلف في مقدمته."
  en: "A twelfth-century geography written by al-Idrisi for Roger II of Sicily. It describes the seven climates, their cities, roads, seas, peoples, crafts and trade, and comes with a world map engraved on a silver disc. The author says he finished it in Shawwal 548 AH."
  es: "Geografía del siglo XII escrita por al-Idrisi para Roger II de Sicilia. Describe los siete climas, sus ciudades, caminos, mares, pueblos, artesanías y comercio, e incluye un mapamundi grabado en un disco de plata. El autor afirma haberla terminado en Shawwal del año 548 de la Hégira."
  fr: "Une géographie du XIIe siècle, écrite par al-Idrisi pour Roger II de Sicile. Elle décrit les sept climats, leurs villes, leurs routes, leurs mers, leurs peuples, leurs artisanats et leur commerce, et est accompagnée d'une carte du monde gravée sur un disque d'argent. L'auteur indique l'avoir achevée en Shawwal 548 AH."
