summary:
  ar: "كتاب جغرافي وضعه الإدريسي للملك روجر الثاني في صقلية، يصف الأقاليم السبعة وبلدانها وطرقها وبحارها وأهلها وصناعاتها وتجاراتها، ومعه خريطة للعالم منقوشة في لوح من فضة. وقد أتمه في شوال سنة 548هـ بحسب ما يذكره المؤلف في مقدمته."
  en: "A twelfth-century geography written by al-Idrisi for Roger II of Sicily. It describes the seven climates, their cities, roads, seas, peoples, crafts and trade, and comes with a world map engraved on a silver disc. The author says he finished it in Shawwal 548 AH."
