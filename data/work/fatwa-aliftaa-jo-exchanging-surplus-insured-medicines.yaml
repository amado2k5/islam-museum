id: work/fatwa-aliftaa-jo-exchanging-surplus-insured-medicines
class: work
kind: fatwa
label: { ar: "استبدال الأدوية الزائدة المصروفة بالتأمين الصحي", en: "Exchanging surplus medicines dispensed under health insurance", ur: "صحت بیمہ پر ملنے والی زائد دواؤں کا تبادلہ" }
summary:
  ar: "سؤال من موظف يزيد معه دواء صُرف بالتأمين الصحي، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل التزام تعليمات صرف الدواء وعدم تغيير الوصفة، فإن صُرف الدواء قانونيًا لمرض حقيقي دون تحايل جاز التصرف فيه بعد قبضه بيعًا وهبة واستبدالًا. أجابت الدائرة بأن التأمين الصحي عقد بين المنتفع وإدارة التأمين تقدم به الرعاية الصحية له ولمن حددهم العقد، ويجب الالتزام بالتعليمات التي تنظم صرف الأدوية. وقالت إن الأصل أن يُصرف الدواء للمستفيد وحده وفق وصفة الطبيب، ولا يجوز له تغيير الوصفة وإن لم يحتج إلى الدواء. وخلصت إلى أنه إذا صُرف العلاج قانونيًا ووفق وصف الطبيب المعالج دون تحايل، وكان المرض يتطلبه فعلًا، فلا حرج في التصرف فيه بعد قبضه بيعًا وهبة واستبدالًا، لأن ملكيته تؤول إلى المستفيد بعد صرفه بما يوافق شروط عقد التأمين."
  en: "A question from an employee left with surplus medicine dispensed under health insurance, in which Jordan's General Iftaa Department answered that the rules for dispensing medicine must be kept and the prescription not altered, but that if medicine was dispensed lawfully for a real illness without deception, it may be sold, given away or exchanged once received. The Department answered that health insurance is a contract between the beneficiary and the insurer, through which care is provided to him and to those named in the contract, and that the rules regulating the dispensing of medicines must be kept. It said the principle is that medicine is dispensed only to the beneficiary according to the doctor's prescription, and he may not alter the prescription even if he does not need the medicine. It concluded that if the treatment was dispensed lawfully and as the treating doctor prescribed, without deception, and the illness genuinely required it, there is no objection to disposing of it once received, by sale, gift or exchange, since ownership passes to the beneficiary once it is dispensed in line with the insurance contract's terms."
  ur: "ایک ملازم کا سوال جس کے پاس صحت بیمہ پر ملی ہوئی دوا بچ جاتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دوا جاری کرنے کی ہدایات کی پابندی اور نسخہ نہ بدلنا اصل ہے، لیکن اگر دوا قانونی طور پر حقیقی بیماری کے لیے بغیر حیلے کے جاری ہوئی ہو تو قبضے کے بعد اسے بیچنا، ہبہ کرنا یا بدلنا جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ صحت بیمہ مستفید اور بیمہ انتظامیہ کے درمیان ایک معاہدہ ہے جس کے ذریعے اسے اور معاہدے میں مذکور افراد کو علاج کی سہولت ملتی ہے، اور دواؤں کی فراہمی کی ہدایات کی پابندی لازم ہے۔ اس نے کہا کہ اصل یہ ہے کہ دوا صرف مستفید کو ڈاکٹر کے نسخے کے مطابق دی جائے، اور وہ نسخہ نہیں بدل سکتا اگرچہ اسے دوا کی ضرورت نہ ہو۔ اس نے نتیجہ نکالا کہ اگر علاج قانونی طور پر اور معالج کے نسخے کے مطابق بغیر حیلے کے جاری ہوا، اور بیماری کو واقعی اس کی ضرورت تھی، تو قبضے کے بعد اسے بیچنے، ہبہ کرنے یا بدلنے میں حرج نہیں، کیونکہ بیمہ معاہدے کی شرائط کے مطابق جاری ہونے کے بعد اس کی ملکیت مستفید کی ہو جاتی ہے۔"
