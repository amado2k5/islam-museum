id: work/fatwa-aliftaa-jo-exchanging-surplus-insured-medicines
class: work
kind: fatwa
label: { ar: "استبدال الأدوية الزائدة المصروفة بالتأمين الصحي", en: "Exchanging surplus medicines dispensed under health insurance", ur: "صحت بیمہ پر ملنے والی زائد دواؤں کا تبادلہ", es: "Intercambio de medicamentos sobrantes dispensados bajo el seguro médico.", fr: "Échange de médicaments excédentaires délivrés dans le cadre de l'assurance maladie", tr: "Sağlık sigortası ile verilen fazla ilaçların yerine geçilmesi", id: "Penggantian obat berlebih yang dihapus dengan asuransi kesehatan" }
summary:
  ar: "سؤال من موظف يزيد معه دواء صُرف بالتأمين الصحي، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل التزام تعليمات صرف الدواء وعدم تغيير الوصفة، فإن صُرف الدواء قانونيًا لمرض حقيقي دون تحايل جاز التصرف فيه بعد قبضه بيعًا وهبة واستبدالًا. أجابت الدائرة بأن التأمين الصحي عقد بين المنتفع وإدارة التأمين تقدم به الرعاية الصحية له ولمن حددهم العقد، ويجب الالتزام بالتعليمات التي تنظم صرف الأدوية. وقالت إن الأصل أن يُصرف الدواء للمستفيد وحده وفق وصفة الطبيب، ولا يجوز له تغيير الوصفة وإن لم يحتج إلى الدواء. وخلصت إلى أنه إذا صُرف العلاج قانونيًا ووفق وصف الطبيب المعالج دون تحايل، وكان المرض يتطلبه فعلًا، فلا حرج في التصرف فيه بعد قبضه بيعًا وهبة واستبدالًا، لأن ملكيته تؤول إلى المستفيد بعد صرفه بما يوافق شروط عقد التأمين."
  en: "A question from an employee left with surplus medicine dispensed under health insurance, in which Jordan's General Iftaa Department answered that the rules for dispensing medicine must be kept and the prescription not altered, but that if medicine was dispensed lawfully for a real illness without deception, it may be sold, given away or exchanged once received. The Department answered that health insurance is a contract between the beneficiary and the insurer, through which care is provided to him and to those named in the contract, and that the rules regulating the dispensing of medicines must be kept. It said the principle is that medicine is dispensed only to the beneficiary according to the doctor's prescription, and he may not alter the prescription even if he does not need the medicine. It concluded that if the treatment was dispensed lawfully and as the treating doctor prescribed, without deception, and the illness genuinely required it, there is no objection to disposing of it once received, by sale, gift or exchange, since ownership passes to the beneficiary once it is dispensed in line with the insurance contract's terms."
  ur: "ایک ملازم کا سوال جس کے پاس صحت بیمہ پر ملی ہوئی دوا بچ جاتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دوا جاری کرنے کی ہدایات کی پابندی اور نسخہ نہ بدلنا اصل ہے، لیکن اگر دوا قانونی طور پر حقیقی بیماری کے لیے بغیر حیلے کے جاری ہوئی ہو تو قبضے کے بعد اسے بیچنا، ہبہ کرنا یا بدلنا جائز ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ صحت بیمہ مستفید اور بیمہ انتظامیہ کے درمیان ایک معاہدہ ہے جس کے ذریعے اسے اور معاہدے میں مذکور افراد کو علاج کی سہولت ملتی ہے، اور دواؤں کی فراہمی کی ہدایات کی پابندی لازم ہے۔ اس نے کہا کہ اصل یہ ہے کہ دوا صرف مستفید کو ڈاکٹر کے نسخے کے مطابق دی جائے، اور وہ نسخہ نہیں بدل سکتا اگرچہ اسے دوا کی ضرورت نہ ہو۔ اس نے نتیجہ نکالا کہ اگر علاج قانونی طور پر اور معالج کے نسخے کے مطابق بغیر حیلے کے جاری ہوا، اور بیماری کو واقعی اس کی ضرورت تھی، تو قبضے کے بعد اسے بیچنے، ہبہ کرنے یا بدلنے میں حرج نہیں، کیونکہ بیمہ معاہدے کی شرائط کے مطابق جاری ہونے کے بعد اس کی ملکیت مستفید کی ہو جاتی ہے۔"
  es: "Un empleado preguntó sobre medicamentos sobrantes dispensados bajo el seguro médico, a lo que el Departamento General de Iftaa de Jordania respondió que deben respetarse las normas para la dispensación de medicamentos y que la receta no debe alterarse, pero que si el medicamento se dispensó legalmente para una enfermedad real sin engaño, puede venderse, regalarse o intercambiarse una vez recibido. El Departamento respondió que el seguro médico es un contrato entre el beneficiario y la aseguradora, mediante el cual se le brinda atención médica a él y a las personas nombradas en el contrato, y que deben respetarse las normas que regulan la dispensación de medicamentos. Añadió que el principio es que el medicamento se dispensa únicamente al beneficiario según la receta del médico, y que este no puede alterar la receta, incluso si no necesita el medicamento. Se concluyó que si el tratamiento se administraba legalmente y según la prescripción del médico tratante, sin engaño, y la enfermedad realmente lo requería, no hay objeción a disponer de él una vez recibido, ya sea mediante venta, donación o intercambio, puesto que la propiedad pasa al beneficiario una vez que se administra de acuerdo con los términos del contrato de seguro."
  fr: "Un employé a posé une question concernant des médicaments excédentaires délivrés dans le cadre de son assurance maladie. Le Département général de la Cour suprême de Jordanie (Iftaa) a répondu que les règles de délivrance des médicaments doivent être respectées et que l'ordonnance ne doit pas être modifiée. Toutefois, si les médicaments ont été délivrés légalement pour une maladie réelle, sans tromperie, ils peuvent être vendus, donnés ou échangés dès leur réception. Le Département a expliqué que l'assurance maladie est un contrat entre le bénéficiaire et l'assureur, par lequel des soins sont fournis au bénéficiaire et aux personnes nommées dans le contrat, et que les règles régissant la délivrance des médicaments doivent être respectées. Il a précisé que le principe est que les médicaments ne sont délivrés au bénéficiaire que sur prescription médicale, et que ce dernier ne peut modifier l'ordonnance, même s'il n'a pas besoin des médicaments. Il a conclu que si le traitement a été dispensé légalement et conformément à la prescription du médecin traitant, sans tromperie, et que la maladie le nécessitait réellement, il n'y a aucune objection à ce que les médicaments soient vendus, donnés ou échangés après leur réception, puisque la propriété est transférée au bénéficiaire dès leur délivrance conformément aux termes du contrat d'assurance."
  tr: "Sağlık sigortası kapsamında ilaç dozunu artıran bir çalışanın sorusunda, Ürdün Genel Fetva Dairesi, ilacın verilme talimatlarına uymak ve reçeteyi değiştirmemek gerektiğini yanıtladı. İlaç gerçek bir hastalık için yasal olarak dolandırıcı olmadan veriliyorsa, satış, hediye veya değişim şeklinde alındıktan sonra imha edilebilir. Bakanlık, sağlık sigortasının, yararlanıcı ile sağlık hizmeti sağlayıcısı tarafından sağlanan sigorta idaresi arasında yapılan bir sözleşme olduğunu ve sözleşmede belirtilen kişiler olduğunu ve ilaç dağıtımını düzenleyen talimatlara uyulması gerektiğini belirtti. Orijinal kuralın, ilacın sadece doktorun reçetesine göre yararlanıcıya verilmesi gerektiği ve ilaca ihtiyacı olmasa bile reçeteyi değiştiremeyeceği belirtildi. Tedavi, tedavi yasal olarak ve tedavi eden doktorun reçetesine uygun olarak aldatıcı olmadan verilmişse ve hastalık gerçekten bunu gerektiriyorsa, tedavinin satış, hediye veya takas yoluyla alındıktan sonra sahipliğin sigorta sözleşmesi şartlarına uygun olarak lehtara geçtiğini belirtmiştir."
  id: "Pertanyaan dari seorang karyawan yang meningkatkan dosis obat yang diberikan di bawah asuransi kesehatan, di mana Departemen Fatwa Umum Yordania menjawab bahwa default adalah mematuhi instruksi pemberian obat dan tidak mengubah resep. Jika pemberian obat secara legal untuk penyakit nyata tanpa penipuan, obat tersebut dapat dibuang setelah menerima sebagai penjualan, hadiah, atau pertukaran. Departemen menjawab bahwa asuransi kesehatan adalah kontrak antara penerima manfaat dan administrasi asuransi yang disediakan oleh penyedia layanan kesehatan dan yang tercantum dalam kontrak, dan instruksi pemberian obat harus dipatuhi. Dinyatakan bahwa aturan awal adalah obat hanya boleh diberikan kepada penerima manfaat sesuai dengan resep dokter, dan mereka tidak diperbolehkan mengubah resep meskipun tidak memerlukan obat tersebut. Kesimpulan tersebut menyimpulkan bahwa jika pengobatan diberikan secara legal dan sesuai dengan resep dokter yang merawat tanpa penipuan, dan penyakit memang mewajibkannya, tidak ada salahnya membuangnya setelah menerima melalui penjualan, hadiah, atau pertukaran, karena kepemilikan berpindah ke penerima manfaat setelah pembayaran sesuai dengan ketentuan kontrak asuransi."
