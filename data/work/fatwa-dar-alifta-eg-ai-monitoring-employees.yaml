id: work/fatwa-dar-alifta-eg-ai-monitoring-employees
class: work
kind: fatwa
label: { ar: "حكم استخدام الذكاء الاصطناعي في مراقبة الموظفين", en: "Using AI to monitor employees", ur: "ملازمین کی نگرانی میں اے آئی کا استعمال", es: "Utilizar la IA para supervisar a los empleados.", fr: "Utiliser l'IA pour surveiller les employés", tr: "Çalışan İzlemede Yapay Zekâ Kullanımına İlişkin Karar", id: "Putusan tentang Penggunaan Kecerdasan Buatan dalam Pemantauan Karyawan" }
summary:
  ar: "سائل سأل عن استخدام تقنيات الذكاء الاصطناعي في بيئة العمل لمراقبة الموظفين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22119)⁩ أن استخدامها لمتابعة إنجاز المهام وضبط أوقات الدوام وحماية البيانات جائز شرعًا ما لم يشتمل على تتبع خصوصيات العاملين أو التجسس عليهم، على ما فصّل الجواب."
  en: "A questioner asked about using AI technologies in the workplace to monitor employees. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22119) answered that using them to track task completion, regulate work hours and protect data is lawful — unless it extends to surveilling workers' privacy or spying on them, as the answer details."
  ur: "ایک سائل نے ملازمین کی نگرانی کے لیے کام کی جگہ اے آئی کے استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22119)⁩ نے جواب دیا کہ کاموں کی تکمیل، اوقاتِ کار اور ڈیٹا کی حفاظت کے لیے اس کا استعمال جائز ہے — جب تک ملازمین کی نجیت پر نگرانی یا جاسوسی نہ ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre el uso de tecnologías de IA en el lugar de trabajo para monitorear a los empleados. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22119) respondió que su uso para controlar la finalización de tareas, regular las horas de trabajo y proteger datos es legal, a menos que implique la vigilancia de la privacidad de los trabajadores o el espionaje, como se detalla en la respuesta."
  fr: "Une question a été posée concernant l'utilisation des technologies d'IA sur le lieu de travail pour surveiller les employés. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22119) a répondu que leur utilisation pour suivre l'exécution des tâches, réguler les horaires de travail et protéger les données est légale, sauf si elle s'étend à la surveillance de la vie privée des travailleurs ou à leur espionnage, comme le précise la réponse."
  tr: "Bir soru soran kişi, çalışanları izlemek için yapay zeka teknolojilerinin işyerinde kullanımını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22119), bu teknolojinin görev tamamlanmasını izlemek, çalışma saatlerini düzenlemek ve verileri korumak için İslam hukukuna göre izin verildiğini, ancak çalışanların gizliliğini takip etmek veya onları gözetlemek içermedikçe izinli olduğunu yanıtladı; bu cevapta detaylandırıldı."
  id: "Seorang penanya menanyakan tentang penggunaan teknologi kecerdasan buatan di tempat kerja untuk memantau karyawan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22119) menjawab bahwa penggunaannya untuk memantau penyelesaian tugas, mengatur jam kerja, dan melindungi data diperbolehkan menurut hukum Islam kecuali melibatkan pelacakan privasi karyawan atau mata-mata terhadap mereka, seperti yang dijelaskan dalam jawaban."
