label: { ar: "حكم استخدام الذكاء الاصطناعي في مراقبة الموظفين", en: "Using AI to monitor employees", ur: "ملازمین کی نگرانی میں اے آئی کا استعمال" }
summary:
  ar: "سائل سأل عن استخدام تقنيات الذكاء الاصطناعي في بيئة العمل لمراقبة الموظفين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22119)⁩ أن استخدامها لمتابعة إنجاز المهام وضبط أوقات الدوام وحماية البيانات جائز شرعًا ما لم يشتمل على تتبع خصوصيات العاملين أو التجسس عليهم، على ما فصّل الجواب."
  en: "A questioner asked about using AI technologies in the workplace to monitor employees. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22119) answered that using them to track task completion, regulate work hours and protect data is lawful — unless it extends to surveilling workers' privacy or spying on them, as the answer details."
  ur: "ایک سائل نے ملازمین کی نگرانی کے لیے کام کی جگہ اے آئی کے استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22119)⁩ نے جواب دیا کہ کاموں کی تکمیل، اوقاتِ کار اور ڈیٹا کی حفاظت کے لیے اس کا استعمال جائز ہے — جب تک ملازمین کی نجیت پر نگرانی یا جاسوسی نہ ہو، جیسا کہ جواب میں تفصیل ہے۔"
