id: work/fatwa-dar-alifta-eg-gaza-displacement-steadfastness
class: work
kind: fatwa
label: { ar: "الرأي الشرعي في تهجير أهل غزة من أرضهم", en: "The sharia view on displacing the people of Gaza from their land", ur: "غزہ کے باشندوں کو ان کی زمین سے بے دخل کرنے پر شرعی رائے", es: "La postura de la sharia sobre el desplazamiento de la población de Gaza de su tierra.", fr: "Le point de vue de la charia sur le déplacement des habitants de Gaza de leurs terres", tr: "Gazze halkının topraklarından sürülmesine ilişkin dini görüş", id: "Pendapat agama tentang pengusiran rakyat Gaza dari tanah mereka" }
summary:
  ar: "سائل سأل عن حكم تهجير أهل غزة من أرضهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22019)⁩ أن ثبات أهل فلسطين — خاصة سكان قطاع غزة والضفة — على حقهم وبقاؤهم على أرضهم صامدين صابرين واجب شرعي وضرورة حياتية بحسب تعبير الجواب، وبيّن ما يترتب على التهجير من أحكام."
  en: "A questioner asked the ruling on displacing the people of Gaza from their land. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22019) answered that the Palestinians' steadfastness on their right — especially the residents of the Gaza Strip and the West Bank — and their remaining on their land patient and firm is, in the answer's terms, a sharia duty and a vital necessity; the answer sets out the rulings that follow from displacement."
  ur: "ایک سائل نے غزہ کے باشندوں کو ان کی زمین سے بے دخل کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22019)⁩ نے جواب دیا کہ فلسطینیوں کا — خصوصاً غزہ کی پٹی اور مغربی کنارے کے باشندوں کا — اپنے حق پر ثابت قدم رہنا اور اپنی زمین پر صابر و ثابت رہنا جواب کے الفاظ میں شرعی واجب اور زندہ رہنے کی ضرورت ہے؛ جواب میں بے دخلی کے شرعی نتائج بھی بیان ہوئے۔"
  es: "Un interlocutor preguntó sobre la normativa relativa al desplazamiento de los habitantes de Gaza de sus tierras. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22019) respondió que la firmeza de los palestinos en su derecho —especialmente los residentes de la Franja de Gaza y Cisjordania— y su permanencia paciente y firme en sus tierras es, en términos de la respuesta, un deber islámico y una necesidad vital; la respuesta expone las normas que se derivan del desplazamiento."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22019) sur la question du déplacement forcé des habitants de Gaza. Il a été répondu que la fermeté des Palestiniens dans l'exercice de leurs droits – en particulier celle des habitants de la bande de Gaza et de Cisjordanie – et leur maintien patient et déterminé sur leurs terres constituent, selon la fatwa, un devoir islamique et une nécessité vitale. La fatwa expose les règles découlant de ce déplacement."
  tr: "Bir soru soran kişi, Gazze halkının topraklarından çıkarılmasına ilişkin kararı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22019), Filistin halkının — özellikle Gazze Şeridi ve Batı Şeria sakinlerinin — haklarına olan kararlılığının, topraklarındaki kararlılıklarının dini bir görev ve hayati bir gereklilik olduğunu, cevabın ve yerinden edilme kararlarının sonucunda belirtildiği gibi, yanıtladı."
  id: "Seorang penanya menanyakan tentang putusan pengusiran rakyat Gaza dari tanah mereka. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22019) menjawab bahwa keteguhan rakyat Palestina — terutama penduduk Jalur Gaza dan Tepi Barat — terhadap hak mereka serta keteguhan dan keteguhan mereka di tanah mereka adalah kewajiban agama dan kebutuhan vital, menurut jawaban, dan putusan yang timbul dari pengungsian."
