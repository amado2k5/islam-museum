structure: "As seen in the last volume of the Dar Ibn al-Jawzi edition: the end of the long discussion of following authority, arguing that following the Companions is obligatory and that a Companion's opinion is a proof; then about seventy 'benefits concerning the fatwa' (kinds of question, the mufti's conduct, the four kinds of mufti, who may give fatwas, whether a layperson must follow one school, what to do when muftis disagree); then the Prophet's fatwas on creed, purity, prayer, the dead, zakat, fasting, hajj, the merits of suras and deeds, earnings, sales, pledges and debts, marriage, suckling, divorce, khul', zihar and li'an, and more."
