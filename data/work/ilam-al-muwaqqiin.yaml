summary:
  ar: "كتاب في أصول الفتوى والاجتهاد والتقليد لشمس الدين محمد بن أبي بكر ابن قيم الجوزية الحنبلي الدمشقي ⁦(ت 751هـ)⁩، يختمه بفوائد تتعلق بالفتوى في آداب المفتي والمستفتي وأحكامهما، ثم بجملة من فتاوى النبي مرتبة على الأبواب."
  en: "A book on the foundations of the fatwa, independent reasoning and following authority by Shams al-Din Muhammad ibn Abi Bakr Ibn Qayyim al-Jawziyya, the Hanbali of Damascus (d. 751 AH), which closes with 'benefits concerning the fatwa' on the conduct and rules of the mufti and the one who asks, and then a collection of the Prophet's own fatwas arranged by subject."
