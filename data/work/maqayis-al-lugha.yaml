summary:
  ar: "معجم مقاييس اللغة لابن فارس، أراد فيه إثبات نظريتين: أن للجذور الثلاثية معاني أصلية هي المقاييس تتفرع منها الكلمات، وأن أكثر الجذور الزائدة على ثلاثة أحرف كلمات منحوتة من عدة كلمات. وهو يذكر في مقدمته أن مصدريه الرئيسين كتاب العين وجمهرة ابن دريد، ويسميهما الكتابين، وينسب فكرة المعاني الأصلية إلى الخليل."
  en: "Ibn Faris's Mu'jam Maqayis al-Lugha, in which he sets out to prove two theories: that triliteral roots carry basic meanings, the maqayis, from which the derived words spring, and that roots of more than three letters are mostly words blended from several words. His preface names Kitab al-Ayn and Ibn Durayd's Jamhara as his chief sources, which he calls the two Kitabs, and credits the idea of basic meanings to al-Khalil."
  es: "El Mu'jam Maqayis al-Lugha de Ibn Faris, en el que se propone demostrar dos teorías: que las raíces trilíteras tienen significados básicos, los maqayis, de los que brotan las palabras derivadas, y que las raíces de más de tres letras son en su mayoría palabras fundidas a partir de varias palabras. Su prólogo nombra como fuentes principales el Kitab al-Ayn y la Jamhara de Ibn Durayd, a los que llama los dos Kitabs, y atribuye a al-Jalil la idea de los significados básicos."
  fr: "Le Mu'jam Maqayis al-Lugha d'Ibn Faris, où il entreprend de démontrer deux théories : que les racines triconsonantiques portent des sens de base, les maqayis, dont naissent les mots dérivés, et que les racines de plus de trois lettres sont pour la plupart des mots fondus à partir de plusieurs mots. Sa préface cite comme sources principales le Kitab al-Ayn et la Jamhara d'Ibn Durayd, qu'il appelle les deux Kitabs, et attribue à al-Khalil l'idée des sens de base."
  ur: "ابن فارس کی معجم مقاییس اللغۃ، جس میں وہ دو نظریے ثابت کرنا چاہتے ہیں: کہ تین حرفی مادوں میں بنیادی معانی ہیں، یعنی مقاییس، جن سے مشتق الفاظ نکلتے ہیں، اور کہ تین سے زیادہ حروف کے مادے زیادہ تر کئی الفاظ کو ملا کر بنائے گئے الفاظ ہیں۔ ان کا مقدمہ کتاب العین اور ابن درید کی جمہرہ کو، جنہیں وہ الکتابین کہتے ہیں، بنیادی مآخذ بتاتا ہے اور بنیادی معانی کا خیال خلیل سے منسوب کرتا ہے۔"
