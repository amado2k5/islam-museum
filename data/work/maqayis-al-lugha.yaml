summary:
  ar: "معجم مقاييس اللغة لابن فارس، أراد فيه إثبات نظريتين: أن للجذور الثلاثية معاني أصلية هي المقاييس تتفرع منها الكلمات، وأن أكثر الجذور الزائدة على ثلاثة أحرف كلمات منحوتة من عدة كلمات. وهو يذكر في مقدمته أن مصدريه الرئيسين كتاب العين وجمهرة ابن دريد، ويسميهما الكتابين، وينسب فكرة المعاني الأصلية إلى الخليل. وتذكر «أرابيكا» أنه لا يُعرف له تاريخ تأليف منصوص وأن الدارسين اختلفوا في تقدمه أو تأخره عن «مجمل اللغة». وينفرد المقاييس عند بعلبكي بطريقة ترتيب الجذور: ألفبائية، لكنه يبدأ في كل حرف بالحروف التي تليه في الترتيب المعهود ثم يعود."
  en: "Ibn Faris's Mu'jam Maqayis al-Lugha, in which he sets out to prove two theories: that triliteral roots carry basic meanings, the maqayis, from which the derived words spring, and that roots of more than three letters are mostly words blended from several words. His preface names Kitab al-Ayn and Ibn Durayd's Jamhara as his chief sources, which he calls the two Kitabs, and credits the idea of basic meanings to al-Khalil. Arabica states that no composition date is given and that scholars disagree on whether it came before or after Mujmal al-Lugha. Baalbaki adds that Maqayis is alone in its way of ordering roots: alphabetical, but within each letter it begins with the letters that come after it in the usual order and then returns."
  es: "El Mu'jam Maqayis al-Lugha de Ibn Faris, en el que se propone demostrar dos teorías: que las raíces trilíteras tienen significados básicos, los maqayis, de los que brotan las palabras derivadas, y que las raíces de más de tres letras son en su mayoría palabras fundidas a partir de varias palabras. Su prólogo nombra como fuentes principales el Kitab al-Ayn y la Jamhara de Ibn Durayd, a los que llama los dos Kitabs, y atribuye a al-Jalil la idea de los significados básicos. Arabica indica que no se da fecha de composición y que los estudiosos discrepan sobre si es anterior o posterior al Mujmal al-Lugha. Baalbaki añade que el Maqayis es único en su manera de ordenar las raíces: alfabética, pero dentro de cada letra empieza por las letras que la siguen en el orden habitual y luego vuelve."
  fr: "Le Mu'jam Maqayis al-Lugha d'Ibn Faris, où il entreprend de démontrer deux théories : que les racines triconsonantiques portent des sens de base, les maqayis, dont naissent les mots dérivés, et que les racines de plus de trois lettres sont pour la plupart des mots fondus à partir de plusieurs mots. Sa préface cite comme sources principales le Kitab al-Ayn et la Jamhara d'Ibn Durayd, qu'il appelle les deux Kitabs, et attribue à al-Khalil l'idée des sens de base. Arabica indique qu'aucune date de composition n'est donnée et que les chercheurs divergent sur son antériorité ou sa postériorité par rapport au Mujmal al-Lugha. Baalbaki ajoute que le Maqayis est seul dans sa manière d'ordonner les racines : alphabétique, mais dans chaque lettre il commence par les lettres qui la suivent dans l'ordre habituel puis revient."
  ur: "ابن فارس کی معجم مقاییس اللغۃ، جس میں وہ دو نظریے ثابت کرنا چاہتے ہیں: کہ تین حرفی مادوں میں بنیادی معانی ہیں، یعنی مقاییس، جن سے مشتق الفاظ نکلتے ہیں، اور کہ تین سے زیادہ حروف کے مادے زیادہ تر کئی الفاظ کو ملا کر بنائے گئے الفاظ ہیں۔ ان کا مقدمہ کتاب العین اور ابن درید کی جمہرہ کو، جنہیں وہ الکتابین کہتے ہیں، بنیادی مآخذ بتاتا ہے اور بنیادی معانی کا خیال خلیل سے منسوب کرتا ہے۔ «اربیکا» بتاتی ہے کہ اس کی تالیف کی کوئی تاریخ منصوص نہیں اور محققین میں اختلاف ہے کہ یہ مجمل اللغۃ سے پہلے ہے یا بعد۔ بعلبکی کہتے ہیں کہ مقاییس مادوں کی ترتیب میں منفرد ہے: تہجی ترتیب مگر ہر حرف میں وہ پہلے ان حروف سے شروع کرتی ہے جو معمول کی ترتیب میں اس کے بعد آتے ہیں، پھر واپس آتی ہے۔"
  tr: "İbn Faris'in Dil Ölçüleri Sözlüğü iki teoriyi kanıtlamayı amaçlamıştır: üçharfsel köklerin orijinal anlamları olduğu, yani kelimelerin dallandığı ölçekler olduğu ve üç harfi aşan köklerin çoğunun birden fazla kelimeden oluşan kelimeler olduğu. Girişinde, iki ana kaynağın Kitab al-'Ayn ve İbn Duraid'in Jamharat olduğunu belirtir; bu iki kitabı da adlandırır ve orijinal anlamlar fikrini Hebron'a atfeder. 'Arabica', yazılışının kesin bir tarihinin bilinmediğini ve akademisyenlerin 'Evrensel Dil' ile önceki veya sonraki biçiminde farklı görüşlerde bulunduğunu belirtir. Al-Maqayis, kökleri düzenleme yönteminde Baalbaki'ye özgüdür: alfabetik, ancak her harfle başlar ve ardından gelen harfler sırayla devam eder ve sonra geri döner."
  id: "Kamus Ukuran Bahasa karya Ibn Faris bertujuan membuktikan dua teori: bahwa akar triliteral memiliki makna asli, yaitu skala dari mana kata-kata bercabang, dan bahwa sebagian besar akar yang melebihi tiga huruf adalah kata yang terdiri dari beberapa kata. Ia menyebutkan dalam pengantarnya bahwa dua sumber utamanya adalah Kitab al-'Ayn dan Jamharat karya Ibn Duraid, yang ia sebut kedua buku tersebut, dan mengaitkan gagasan makna asli kepada Hebron. 'Arabica' mencatat bahwa tidak ada tanggal eksplisit tentang penusunannya yang diketahui, dan para ahli berbeda dalam bentuk sebelumnya atau setelahnya dibandingkan dengan 'Bahasa Universal.' Al-Maqayis unik bagi Baalbaki dalam metode pengaturan akar: alfabetis, tetapi ia memulai dengan setiap huruf dengan huruf yang mengikutinya dalam urutan biasa lalu kembali."
