id: work/fatwa-dar-alifta-eg-pregnant-woman-bleeding-fasting
class: work
kind: fatwa
label: { ar: "حكم صوم الحامل إذا رأت الدم", en: "The fast of a pregnant woman who sees blood", ur: "حاملہ عورت کو خون دکھائی دینے پر روزہ", es: "El ayuno de una mujer embarazada que ve sangre", fr: "Le jeûne d'une femme enceinte qui voit du sang", tr: "Hamile bir kadının kan gördüğünde oruç tutma kararı", id: "Aturan tentang puasa wanita hamil jika dia melihat darah" }
summary:
  ar: "سائلة حامل رأت الدم فسألت عن صومها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21764)⁩ أن الدم النازل على المرأة الحامل لا يعد حيضًا وإنما هو دم فساد تجري عليه أحكامه على ما فصّل الجواب."
  en: "A pregnant woman saw blood and asked about her fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21764) answered that blood descending on a pregnant woman is not counted as menses — it is an irregular blood carrying its own rulings — as the answer details."
  ur: "حاملہ عورت کو خون دکھائی دیا؛ اس نے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21764)⁩ نے جواب دیا کہ حاملہ کو آنے والا خون حیض شمار نہیں ہوتا بلکہ یہ دمِ فساد ہے جس کے اپنے احکام ہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer embarazada vio sangre y preguntó sobre su ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21764) respondió que la sangre que desciende sobre una mujer embarazada no se considera menstruación, sino una sangre irregular con sus propias normas, como se detalla en la respuesta."
  fr: "Une femme enceinte a constaté la présence de sang et a posé la question concernant son jeûne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21764) a répondu que les saignements survenant chez une femme enceinte ne sont pas considérés comme des menstruations; il s’agit de saignements irréguliers soumis à des règles spécifiques, comme le précise la réponse."
  tr: "Hamile bir kadın kanı görünce oruç tutmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21764), hamile bir kadına düşen kanın adet değil, geçerli olmayan kan olarak kabul edildiğini ve bu kanın kararları cevabında ayrıntılı olarak belirtildiği gibi geçerli olduğunu söyledi."
  id: "Seorang wanita hamil menanyakan tentang puasanya ketika melihat darah tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21764) menjawab bahwa darah yang jatuh pada wanita hamil tidak dianggap menstruasi, melainkan darah tidak sah yang keputusannya berlaku sebagaimana dijelaskan dalam jawaban."
