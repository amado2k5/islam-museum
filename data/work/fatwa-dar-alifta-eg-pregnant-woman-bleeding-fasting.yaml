label: { ar: "حكم صوم الحامل إذا رأت الدم", en: "The fast of a pregnant woman who sees blood", ur: "حاملہ عورت کو خون دکھائی دینے پر روزہ" }
summary:
  ar: "سائلة حامل رأت الدم فسألت عن صومها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21764)⁩ أن الدم النازل على المرأة الحامل لا يعد حيضًا وإنما هو دم فساد تجري عليه أحكامه على ما فصّل الجواب."
  en: "A pregnant woman saw blood and asked about her fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21764) answered that blood descending on a pregnant woman is not counted as menses — it is an irregular blood carrying its own rulings — as the answer details."
  ur: "حاملہ عورت کو خون دکھائی دیا؛ اس نے روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21764)⁩ نے جواب دیا کہ حاملہ کو آنے والا خون حیض شمار نہیں ہوتا بلکہ یہ دمِ فساد ہے جس کے اپنے احکام ہیں — جیسا کہ جواب میں تفصیل ہے۔"
