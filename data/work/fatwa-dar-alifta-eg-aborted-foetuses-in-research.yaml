id: work/fatwa-dar-alifta-eg-aborted-foetuses-in-research
class: work
kind: fatwa
label: { ar: "حكم الانتفاع بالأجنَّة المجهضة في التجارب العلمية والعلاجية", en: "Using miscarried foetuses in scientific and therapeutic experiments", ur: "اسقاط شدہ جنینوں کا علمی اور علاج میں استعمال", es: "Utilización de fetos abortados en experimentos científicos y terapéuticos.", fr: "Utilisation des fœtus issus de fausses couches dans les expériences scientifiques et thérapeutiques", tr: "Bilimsel ve Terapötik Denemelerde Kürtaj Edilen Fetüslerden Fayda Sağlama Kararı", id: "Putusan tentang Manfaat dari Janin yang Digugurkan dalam Uji Coba Ilmiah dan Terapeutik" }
summary:
  ar: "سائل سأل عن الانتفاع بالأجنة المجهضة في التجارب العلمية والعلاج وزراعة الأعضاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20860)⁩ أن الانتفاع بالأجنة المجهضة في التجارب العلمية والعلاج وزراعة الأعضاء جائز إذا روعيت جملة من الضوابط على ما فصّل الجواب."
  en: "A questioner asked about using miscarried foetuses in scientific experiments, treatment and organ transplantation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20860) answered that it is permissible when a set of controls is observed — which the answer sets out."
  ur: "ایک سائل نے اسقاط شدہ جنینوں کو علمی تجربات، علاج اور اعضا کی پیوندکاری میں استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20860)⁩ نے جواب دیا کہ بعض ضوابط کی رعایت کے ساتھ یہ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre el uso de fetos abortados en experimentos científicos, tratamientos y trasplantes de órganos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20860) respondió que es permisible cuando se observan ciertos controles, los cuales se detallan en la respuesta."
  fr: "Une personne a posé une question concernant l'utilisation de fœtus issus de fausses couches à des fins scientifiques, thérapeutiques et de transplantation d'organes. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20860) a répondu que cela est permis sous réserve du respect de certaines conditions, lesquelles sont détaillées dans la réponse."
  tr: "Bir soru soran kişi, kürtajlı embriyolardan bilimsel denemeler, tedavi ve organ naklinden fayda sağlanması hakkında sorular sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20860), bilimsel denemeler, tedavi ve organ naklinde kürtaj edilen embriyolardan yararlanmanın, yanıtta ayrıntılı olarak belirtilen bir dizi düzenlemeye uyulması halinde izin verilebileceğini yanıtlamıştır."
  id: "Seorang penanya menanyakan tentang manfaat dari embrio yang diaborsi dalam uji coba ilmiah, pengobatan, dan transplantasi organ. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20860) menjawab bahwa mendapatkan manfaat dari embrio yang digugurkan dalam uji coba ilmiah, pengobatan, dan transplantasi organ diperbolehkan jika seperangkat peraturan dipatuhi seperti yang dijelaskan dalam jawaban."
