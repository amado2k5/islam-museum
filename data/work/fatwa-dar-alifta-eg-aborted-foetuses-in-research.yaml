summary:
  ar: "سائل سأل عن الانتفاع بالأجنة المجهضة في التجارب العلمية والعلاج وزراعة الأعضاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20860)⁩ أن الانتفاع بالأجنة المجهضة في التجارب العلمية والعلاج وزراعة الأعضاء جائز إذا روعيت جملة من الضوابط على ما فصّل الجواب."
  en: "A questioner asked about using miscarried foetuses in scientific experiments, treatment and organ transplantation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20860) answered that it is permissible when a set of controls is observed — which the answer sets out."
  ur: "ایک سائل نے اسقاط شدہ جنینوں کو علمی تجربات، علاج اور اعضا کی پیوندکاری میں استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20860)⁩ نے جواب دیا کہ بعض ضوابط کی رعایت کے ساتھ یہ جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
