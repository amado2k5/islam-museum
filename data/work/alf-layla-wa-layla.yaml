label: { ar: "ألف ليلة وليلة ⁦(هزار أفسانه)⁩", en: "A Thousand and One Nights (Hazar Afsana)", es: "Las mil y una noches (Hazar Afsana)", fr: "Les Mille et Une Nuits (Hazar Afsana)", ur: "ایک ہزار اور ایک راتیں ⁦(ہزار افسانہ)⁩", tr: "Bin Bir Gece (Efsanelerinin Hazarı)", id: "Seribu Satu Malam (Hazar dari Legendanya)" }
summary:
  ar: "قال المسعودي سنة اثنتين وثلاثين وثلاثمائة إن كتب الأخبار الموضوعة المنقولة من الفارسية مثل كتاب هزار أفسانه وتفسيره من الفارسية إلى العربية ألف خرافة والخرافة بالفارسية يقال لها أفسانه، والناس يسمون هذا الكتاب ألف ليلة وليلة وهو خبر الملك والوزير وابنته وجاريتهما وهما شيرزاد ودينازاد، ومثل كتاب فرزة وسيماس وما فيه من أخبار ملوك الهند والوزراء ومثل كتاب السندباد — أقدم ذكر باق للكتاب ولشهرزاد ودينازاد في التواريخ {cite:muruj-al-dhahab p. 550}. وفي الفهرست أن أبا عبد الله محمد بن عبدوس الجهشياري صاحب كتاب الوزراء ابتدأ تأليف كتاب اختار فيه ألف سمر من أسمار العرب والعجم والروم كل جزء قائم بذاته وأحضر المسامرين فأخذ عنهم أحسن ما يعرفون فاجتمع له من ذلك أربعمائة ليلة وثمانون ليلة كل ليلة سمر تام يحتوي على خمسين ورقة ثم عاجلته المنية قبل استيفاء ألف سمر ورأى ابن النديم من ذلك عدة أجزاء بخط أبي الطيب أخي الشافعي {cite:fihrist-ibn-al-nadim p. 423}"
  en: "The earliest surviving attestation of the Nights: al-Mas'udi in 332 names Hazar Afsana ('a thousand tales' — afsana being Persian for khurafa), 'which the people call Alf Layla wa-Layla, the tale of the king, the vizier, his daughter and her maid, Shirzad and Dinazad', alongside Farza wa Simas and the Sindbad {cite:muruj-al-dhahab p. 550}."
  es: "La atestación más antigua que se conserva de Las mil y una noches: al-Mas'udi en 332 nombra Hazar Afsana ('mil cuentos' — afsana es persa para khurafa), 'que la gente llama Alf Layla wa-Layla, el cuento del rey, el visir, su hija y su criada, Shirzad y Dinazad', junto con Farza wa Simas y el Sindbad {cite:muruj-al-dhahab p. 550}."
  fr: "La plus ancienne attestation connue des Nuits: al-Mas'udi en 332 mentionne Hazar Afsana (« mille contes » — afsana étant le mot persan pour khurafa), « que le peuple appelle Alf Layla wa-Layla, le conte du roi, du vizir, de sa fille et de sa servante, Shirzad et Dinazad », aux côtés de Farza wa Simas et du Sindbad {cite: muruj-al-dhahab p. 550}."
  ur: "راتوں کی سب سے قدیم زندہ بچ جانے والی تصدیق: المسعودی نے 332 میں ہزار افسانہ ⁦('ہزار افسانہ' - افسانہ خرافہ کے لیے فارسی ہے)⁩، 'جسے لوگ الف لیلیٰ و لیلیٰ کہتے ہیں، بادشاہ، وزیر، اس کی بیٹی اور اس کی بیٹی سمزہ اور اس کی مدعیہ کے ساتھ' اور سندباد {حوالہ دیں: مروج الذہب ص۔ 550}۔"
  tr: "El-Mes'udi, 332 Hicri yılında, Farsçadan aktarılan raporları uydurduğunu söylemiştir; örneğin 'Hazar Afsanah ve Farsçadan Arapçaya yorumu, Alf Farafa' kitabı ve Farsça'da 'Efsane' 'Afsaneh' olarak adlandırılır. Bu kitaba 'Bin Bir Gece Masalları' diyorlar; bu kitap kral, papaz, kızı ve cariyeleri Şirzad ve Dinazad'ın anlatımıdır. 'Farzah, Samas, Hindistan'ın kral ve bakanlarının hikayeleri' ile 'Sinbad' kitabı — kitabın ve Şehrazat ile Dinazad'ın tarihlerde kalan en eski adı—{atı:Muruj-al-Dhahab, s. 550}. El-Fihrist'te, Bakanlar Kitabı'nın yazarı Ebu Abdullah Muhammed bin Abdus al-Jahshiyari'nin, Araplar, Persler ve Romalıların Samarlarından bin Samar seçtiği bir kitap yazmaya başladığı ve her biri kendi başına duran, Musammarin'i getirdiği ve bildikleri en iyisini aldığı belirtilir. Bundan, her gece elli sayfalık tam bir Samar içeren dört yüz seksen gece toplar. Sonra bin Samar'ı tamamlamadan önce ölüm onu vurdu. İbn el-Nadim, bunun birkaç bölümünü el-Şafii'nin kardeşi Ebu el-Tayyib'in el yazısında gördü {atıf:Fihrist-ibn-al-Nadim s. 423}"
  id: "Al-Mas'udi mengatakan pada tahun 332 H bahwa laporan palsu yang disampaikan dari bahasa Persia, seperti buku 'Hazar Afsanah dan penafsirannya dari bahasa Persia ke Arab, Alf Farafa', dan dalam bahasa Persia 'Legenda' disebut 'Afsaneh'. Orang-orang menyebut buku ini 'Seribu Satu Malam,' yang merupakan kisah tentang raja, menteri, putrinya, dan selir mereka, Shirzad dan Dinazad. Buku 'Farzah, Samas, dan kisah raja dan menteri India' serta buku 'Sinbad' — penyebutan tertua yang masih ada tentang kitab ini serta Scheherazade dan Dinazad dalam sejarah {cite:muruj-al-dhahab, hlm. 550}. Dalam Al-Fihrist, disebutkan bahwa Abu Abdullah Muhammad ibn Abdus al-Jahshiyari, penulis Kitab Menteri, mulai menulis sebuah buku di mana ia memilih seribu Samar dari Samar orang Arab, Persia, dan Romawi, masing-masing berdiri sendiri, lalu membawa Musammarin dan mengambil dari mereka yang terbaik yang mereka ketahui. Dari situ, ia mengumpulkan empat ratus delapan puluh malam, setiap malam berisi satu Samar lengkap berisi lima puluh halaman. Kemudian kematian menimpanya sebelum menyelesaikan seribu Samar. Ibn al-Nadim melihat beberapa bagian dari ini dalam tulisan tangan Abu al-Tayyib, saudaraku al-Shafi'i {cite:fihrist-ibn-al-nadim hlm. 423}"
