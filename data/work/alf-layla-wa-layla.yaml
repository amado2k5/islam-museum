label: { ar: "ألف ليلة وليلة (هزار أفسانه)", en: "A Thousand and One Nights (Hazar Afsana)" }
summary:
  ar: "قال المسعودي سنة اثنتين وثلاثين وثلاثمائة إن كتب الأخبار الموضوعة المنقولة من الفارسية مثل كتاب هزار أفسانه وتفسيره من الفارسية إلى العربية ألف خرافة والخرافة بالفارسية يقال لها أفسانه، والناس يسمون هذا الكتاب ألف ليلة وليلة وهو خبر الملك والوزير وابنته وجاريتهما وهما شيرزاد ودينازاد، ومثل كتاب فرزة وسيماس وما فيه من أخبار ملوك الهند والوزراء ومثل كتاب السندباد — أقدم ذكر باق للكتاب ولشهرزاد ودينازاد في التواريخ {cite:muruj-al-dhahab p. 550}. وفي الفهرست أن أبا عبد الله محمد بن عبدوس الجهشياري صاحب كتاب الوزراء ابتدأ تأليف كتاب اختار فيه ألف سمر من أسمار العرب والعجم والروم كل جزء قائم بذاته وأحضر المسامرين فأخذ عنهم أحسن ما يعرفون فاجتمع له من ذلك أربعمائة ليلة وثمانون ليلة كل ليلة سمر تام يحتوي على خمسين ورقة ثم عاجلته المنية قبل استيفاء ألف سمر ورأى ابن النديم من ذلك عدة أجزاء بخط أبي الطيب أخي الشافعي {cite:fihrist-ibn-al-nadim p. 423}"
  en: "The earliest surviving attestation of the Nights: al-Mas'udi in 332 names Hazar Afsana ('a thousand tales' — afsana being Persian for khurafa), 'which the people call Alf Layla wa-Layla, the tale of the king, the vizier, his daughter and her maid, Shirzad and Dinazad', alongside Farza wa Simas and the Sindbad {cite:muruj-al-dhahab p. 550}."
