label: { ar: "أخبار قضاة مصر", en: "Akhbar Qudat Misr", es: "Akhbar Qudat Misr", fr: "Akhbar Qudat Misr", ur: "اخبار قدات مصر", tr: "Mısır Yargıçları Haberleri", id: "Berita Hakim Mesir" }
summary:
  ar: "لأبي عمر محمد بن يوسف الكندي، أول من جمعهم إلى سنة ٢٤٦هـ؛ ثم ذيّل أبو محمد حسن بن إبراهيم المعروف بابن زولاق المصري المتوفى سنة ٣٨٧هـ بدأ بذكر القاضي بكار وختم بمحمد بن النعمان في رجب سنة ٣٨٦هـ، ثم ذيل الحافظ ابن حجر بمجلد كبير سماه رفع الإصر عن قضاة مصر {cite:kashf-zunun-furqan p. 253}."
  en: "Al-Kindi's Akhbar Qudat Misr — the first collection of Egypt's judges to AH 246, continued by Ibn Zulaq to Rajab 386 and crowned by Ibn Hajar's Raf' al-Isr {cite:kashf-zunun-furqan p. 253}."
  es: "Akhbar Qudat Misr de Al-Kindi: la primera colección de jueces de Egipto hasta el año 246 d.H., continuada por Ibn Zulaq hasta Rajab 386 y coronada por Raf' al-Isr de Ibn Hajar {cita:kashf-zunun-furqan p. 253}."
  fr: "Akhbar Qudat Misr d'Al-Kindi — la première collection de juges égyptiens jusqu'en 246 AH, continuée par Ibn Zulaq jusqu'à Rajab 386 et couronnée par Raf' al-Isr d'Ibn Hajar {cite:kashf-zunun-furqan p. 253}."
  ur: "الکندی کا اخبار قدت مصر - مصر کے قاضیوں کا پہلا مجموعہ ہجری 246 تک، ابن ذوالق نے رجب 386 تک جاری رکھا اور ابن حجر کے رف العسر نے تاج پہنایا۔ 253}۔"
  tr: "Ebu Ömer Muhammed ibn Yusuf el-Kindi tarafından, 246 Hicri yılına kadar ilk derleyen kişi; ardından 387 Hicri yılında ölen Ebu Muhammed Hasan ibn İbrahim tarafından eklendi; İbrahim 387 Hicri yılında öldü, Hakim Bakkar'ın anmasıyla başlayıp Muhammed ibn el-Nu'man ile Recep 386 Hicri'de sona erdi. Daha sonra hafız İbn Hacer'e 'Raf' al-Isr 'an Qudat Misr adlı büyük bir cilt eklendi {atıf:kashf-zunun-furqan, s. 253}."
  id: "oleh Abu Umar Muhammad ibn Yusuf al-Kindi, yang pertama menyusunnya hingga tahun 246 H; kemudian ditambahkan oleh Abu Muhammad Hasan ibn Ibrahim, yang dikenal sebagai Ibn Zulaq al-Masri, yang meninggal pada tahun 387 H, dimulai dengan penyebutan Hakim Bakkar dan berakhir dengan Muhammad ibn al-Nu'man dalam Rajab 386 H. Kemudian hafiz Ibn Hajar ditambahkan dengan sebuah buku besar berjudul 'Raf' al-Isr 'an Qudat Misr {cite:kashf-zunun-furqan, hlm. 253}."
