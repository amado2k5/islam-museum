label: { ar: "الاحتلام وضيق الوقت", en: "Waking in ihtilam with the time short — tayammum", ur: "احتلام اور وقت تنگ — تیمم", es: "Despertar en ihtilam con el tiempo corto — tayammum", fr: "Réveil en ihtilam avec le temps court — tayammum", tr: "Gece Rüyaları ve Zaman Eksikliği", id: "Mimpi Malam dan Kekurangan Waktu" }
summary:
  ar: "سأل سائل أنه استيقظ فوجد نفسه محتلمًا والوقت قد ضاق. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76708 بتاريخ 26 أكتوبر 2008)⁩ أن التيمم يشرع لفقد الماء حقيقة أو حكمًا ففقده حقيقة عدم وجوده وفقده حكمًا عدم القدرة على استعماله وإن كان موجودًا ومن أمثلة ذلك ما جاء في سؤاله من خشية خروج الوقت على ما فصّل الجواب."
  en: "A questioner woke finding himself in ihtilam with the time short. Dr. Salah al-Sawi (fatwa no. 76708, 26 October 2008) answered that tayammum is legislated for water's being lacking in fact or in law: lacking in fact is its absence, lacking in law is being unable to use it though present — among its examples is what his question brought: fear of the time's running out — as the answer details."
  ur: "احتلام اور وقت کم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76708، 26 اکتوبر 2008)⁩ کے مطابق پانی کا حکمی فقد بھی تیمم کا موجب ہے — نماز پڑھے۔"
  es: "Un consultante despertó encontrándose en estado de ihtilam con poco tiempo. El Dr. Salah al-Sawi (fatwa n.° 76708, 26 de octubre de 2008) respondió que el tayammum se legisla para la falta de agua, ya sea de hecho o de derecho: falta de hecho es su ausencia, falta de derecho es la incapacidad de usarla aunque esté presente; entre sus ejemplos se encuentra lo que planteó su pregunta: el temor a que se agote el tiempo, como se detalla en la respuesta."
  fr: "Un homme, se réveillant en état d'ihtilam (pénurie d'eau), constata que le temps lui était compté. Le Dr Salah al-Sawi (fatwa n° 76708, 26 octobre 2008) répondit que le tayammum (pénurie d'eau) est prescrit en cas de manque d'eau, qu'il soit de fait ou de droit: le manque de fait correspond à l'absence d'eau, tandis que le manque de droit désigne l'impossibilité de l'utiliser malgré sa présence. Parmi les exemples cités figure celui évoqué par sa question: la crainte de manquer de temps, comme le précise la réponse."
  tr: "Bir soru soran kişiye, zaman kısıtlı olduğu için uyanıp küçümseme halinde olup olmadığını sormuştur. Dr. Salah Al-Sawy (26 Ekim 2008 tarihli 76708 No. Fetva) teymam'in suyun fiili veya hüküm verdiği kaybı nedeniyle reçete edildiğini, yani suyun yokluğundan kaynaklandığını ve kaybının mevcut olsa bile kullanılamaması anlamına geldiğini belirtmiştir. Bunun bir örneği, cevapta açıklandığı gibi zamanın geçebileceği korkusudur."
  id: "Seorang penanya ditanya apakah ia terbangun dan mendapati dirinya dalam keadaan penghinaan saat waktu mepet. Dr. Salah Al-Sawy menjawab (Fatwa No. 76708 tanggal 26 Oktober 2008) bahwa tayammum diresepkan karena kehilangan air yang sebenarnya atau yang ditetapkan, jadi kehilangan tayammum disebabkan oleh ketiadaannya, dan kehilangannya berarti ketidakmampuan menggunakannya meskipun sudah ada. Contohnya adalah ketakutan bahwa waktu mungkin berlalu seperti yang dijelaskan dalam jawaban."
