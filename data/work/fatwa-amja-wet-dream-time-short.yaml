id: work/fatwa-amja-wet-dream-time-short
class: work
kind: fatwa
label: { ar: "الاحتلام وضيق الوقت", en: "Waking in ihtilam with the time short — tayammum", ur: "احتلام اور وقت تنگ — تیمم" }
summary:
  ar: "سأل سائل أنه استيقظ فوجد نفسه محتلمًا والوقت قد ضاق. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76708 بتاريخ 26 أكتوبر 2008)⁩ أن التيمم يشرع لفقد الماء حقيقة أو حكمًا ففقده حقيقة عدم وجوده وفقده حكمًا عدم القدرة على استعماله وإن كان موجودًا ومن أمثلة ذلك ما جاء في سؤاله من خشية خروج الوقت على ما فصّل الجواب."
  en: "A questioner woke finding himself in ihtilam with the time short. Dr. Salah al-Sawi (fatwa no. 76708, 26 October 2008) answered that tayammum is legislated for water's being lacking in fact or in law: lacking in fact is its absence, lacking in law is being unable to use it though present — among its examples is what his question brought: fear of the time's running out — as the answer details."
  ur: "احتلام اور وقت کم؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76708، 26 اکتوبر 2008)⁩ کے مطابق پانی کا حکمی فقد بھی تیمم کا موجب ہے — نماز پڑھے۔"
