label: { ar: "نخبة الفكر في مصطلح أهل الأثر", en: "Nukhbat al-Fikar fi Mustalah Ahl al-Athar", ur: "نخبۃ الفکر فی مصطلح اہل الاثر" }
summary:
  ar: "متن مختصر لابن حجر العسقلاني ⁦(773–852هـ)⁩ في مصطلح الحديث، لخّص فيه المهم من كتب الاصطلاح «في أوراق لطيفة» بطلب بعض إخوانه، «على ترتيب ابتكرته وسبيل انتهجته»، ثم شرحه هو نفسه في «نزهة النظر»؛ ويقوم ترتيبه على تقسيم الخبر بحسب عدد طرقه ثم بحسب القبول والرد {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  en: "A short treatise by Ibn Hajar al-'Asqalani (773–852 AH) on hadith terminology, in which he summed up what mattered in the books on the subject 'in a few slender leaves' at a friend's request, 'in an order I devised and on a path I took', and which he then explained himself in Nuzhat al-Nazar; its arrangement divides reports by the number of their chains and then by acceptance and rejection {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  ur: "ابن حجر عسقلانی ⁦(773–852ھ)⁩ کا مصطلح الحدیث میں مختصر متن، جس میں انہوں نے ایک دوست کی درخواست پر اصطلاح کی کتابوں کا اہم حصہ «چند لطیف اوراق میں» سمیٹا، «ایک ایسی ترتیب پر جو میں نے ایجاد کی اور ایک راستے پر جو میں نے اختیار کیا»، پھر خود ہی «نزہۃ النظر» میں اس کی شرح کی؛ اس کی ترتیب خبر کو طرق کی تعداد اور پھر قبول و رد کے اعتبار سے تقسیم کرتی ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}۔"
