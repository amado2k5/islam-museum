label: { ar: "نخبة الفكر في مصطلح أهل الأثر", en: "Nukhbat al-Fikar fi Mustalah Ahl al-Athar", ur: "نخبۃ الفکر فی مصطلح اہل الاثر", tr: "Düşüncenin Elitleri, Trace Halkının Terminolojisiyle", id: "Elit Pemikiran dalam Terminologi Orang-Orang Jejak" }
summary:
  ar: "متن مختصر لابن حجر العسقلاني ⁦(773–852هـ)⁩ في مصطلح الحديث، لخّص فيه المهم من كتب الاصطلاح «في أوراق لطيفة» بطلب بعض إخوانه، «على ترتيب ابتكرته وسبيل انتهجته»، ثم شرحه هو نفسه في «نزهة النظر»؛ ويقوم ترتيبه على تقسيم الخبر بحسب عدد طرقه ثم بحسب القبول والرد {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  en: "A short treatise by Ibn Hajar al-'Asqalani (773–852 AH) on hadith terminology, in which he summed up what mattered in the books on the subject 'in a few slender leaves' at a friend's request, 'in an order I devised and on a path I took', and which he then explained himself in Nuzhat al-Nazar; its arrangement divides reports by the number of their chains and then by acceptance and rejection {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  ur: "ابن حجر عسقلانی ⁦(773–852ھ)⁩ کا مصطلح الحدیث میں مختصر متن، جس میں انہوں نے ایک دوست کی درخواست پر اصطلاح کی کتابوں کا اہم حصہ «چند لطیف اوراق میں» سمیٹا، «ایک ایسی ترتیب پر جو میں نے ایجاد کی اور ایک راستے پر جو میں نے اختیار کیا»، پھر خود ہی «نزہۃ النظر» میں اس کی شرح کی؛ اس کی ترتیب خبر کو طرق کی تعداد اور پھر قبول و رد کے اعتبار سے تقسیم کرتی ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}۔"
  es: "Un breve tratado de Ibn Hajar al-'Asqalani (773–852 AH) sobre terminología de hadices, en el que resumió lo importante en los libros sobre el tema \"en unas pocas hojas delgadas\" a petición de un amigo, \"en un orden que ideé y por un camino que tomé\", y que luego explicó él mismo en Nuzhat al-Nazar; su organización divide los informes por el número de sus cadenas y luego por aceptación y rechazo {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  fr: "Un court traité d'Ibn Hajar al-'Asqalani (773-852 AH) sur la terminologie des hadiths, dans lequel il résume ce qui importe dans les livres sur le sujet « en quelques feuilles minces » à la demande d'un ami, « dans un ordre que j'ai conçu et sur un chemin que j'ai suivi », et qu'il explique ensuite lui-même dans Nuzhat al-Nazar; son arrangement divise les rapports selon le nombre de leurs chaînes de transmission, puis selon leur acceptation et leur rejet {cite:nuzhat-al-nazar-itr-bushra-2011 p. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 p. 36}."
  tr: "İbn Hajar al-Asqalani'nin (773–852 H) hadis terminolojisi üzerine kısaltılmış bir metni, bazı kardeşlerinin isteği üzerine önemli terminoloji kitabını \"Güzel Kağıtlarda\" özetlemiş, \"benim icat ettiğim ve yolu takip ettiğim sırayla\" ve ardından kendisi \"Nuzhat al-Nazar\"da açıklamıştır; onun düzeni, raporun zincir sayısına göre bölünmesi, ardından kabul ve çürütmeye göre yapılmasına dayanmaktadır {cite:nuzhat-al-nazar-itr-bushra-2011 s. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 s. 36}."
  id: "Teks ringkas oleh Ibn Hajar al-Asqalani (773–852 H) tentang terminologi hadit, di mana ia merangkum buku terminologi penting \"dalam Fine Papers\" atas permintaan beberapa saudaranya, \"dalam urutan yang saya ciptakan dan ikuti jalan,\" lalu menjelaskannya sendiri dalam \"Nuzhat al-Nazar\"; urutannya didasarkan pada pembagian laporan berdasarkan jumlah rantainya, lalu menurut penerimaan dan bantahan {cite:nuzhat-al-nazar-itr-bushra-2011 hlm. 18} {cite:nuzhat-al-nazar-itr-bushra-2011 hlm. 36}."
