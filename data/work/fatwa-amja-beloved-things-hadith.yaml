id: work/fatwa-amja-beloved-things-hadith
class: work
kind: fatwa
label: { ar: "حبب إلي من الدنيا النساء والطيب", en: "What was truly made beloved — Ahmad's hadith", ur: "دنیا سے پیاری چیزیں — مسند احمد کی حدیث", es: "Lo que verdaderamente fue hecho amado — Hadiz de Ahmad", fr: "Ce qui fut véritablement rendu cher — le hadith d'Ahmad" }
summary:
  ar: "سأل سائل عن حديث طويل وصله عبر البريد الإلكتروني أن النبي حبب إليه من الدنيا ثلاث. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77608 بتاريخ 28 يناير 2009)⁩ أن الحديث الطويل المذكور ليس بصحيح وإنما الصحيح عنه قوله حبب إليَّ من الدنيا النساء والطيب وجعلت قرة عيني في الصلاة رواه أحمد والنسائي، وليس فيه ثلاث لأنه ذكر اثنتين النساء والطيب وأما الثالثة وهي الصلاة فهي قرة عينه وليست من أمر الدنيا بل من أمر الدين."
  en: "A questioner forwarded by email a long hadith claiming the Prophet had three worldly things made dear to him. Dr. Salah al-Sawi (fatwa no. 77608, 28 January 2009) answered that the long hadith is not sound; what is sound is 'women and perfume were made dear to me from this world, and the coolness of my eyes was placed in prayer' — narrated by Ahmad and al-Nasa'i — and it does not say three, for he named two, women and perfume, while the third, prayer, is his eye's delight and belongs to the religion, not to this world."
  ur: "ایک سائل نے «مجھے دنیا سے تین چیزیں پیاری کیں» کی روایت کی صحت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77608، 28 جنوری 2009)⁩ کے مطابق صحیح روایت احمد و نسائی کی ہے — دو دنیاوی چیزیں ہیں اور نماز دین کی ہے۔"
  es: "Un remitente envió por correo electrónico un hadiz extenso que afirmaba que el Profeta tenía tres cosas mundanas que le eran queridas. El Dr. Salah al-Sawi (fatwa n.° 77608, 28 de enero de 2009) respondió que el hadiz extenso no es auténtico; lo que sí es auténtico es «las mujeres y el perfume me fueron queridos de este mundo, y la frescura de mis ojos se encontraba en la oración» —narrado por Ahmad y al-Nasa'i— y no dice tres, pues él mencionó dos, las mujeres y el perfume, mientras que la tercera, la oración, es el deleite de sus ojos y pertenece a la religión, no a este mundo."
  fr: "Un internaute a transmis par courriel un long hadith affirmant que le Prophète avait trois choses terrestres qui lui étaient chères. Le Dr Salah al-Sawi (fatwa n° 77608, 28 janvier 2009) a répondu que ce long hadith est apocryphe; le hadith authentique est: « Les femmes et le parfum m’étaient chers de ce monde, et la fraîcheur de mes yeux résidait dans la prière » – rapporté par Ahmad et An-Nasa’i – et il n’est pas question de trois choses, car il en a cité deux, les femmes et le parfum, tandis que la troisième, la prière, est un plaisir pour ses yeux et appartient à la religion, non à ce monde."
