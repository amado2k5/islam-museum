summary:
  ar: "ترجمة روسية لمعاني القرآن صدر جزؤها الأول سنة 2022 بوصف «طبعة تجريبية»، من الفاتحة إلى الآية 93 من سورة التوبة، ثم طبعة ثانية سنة 2023 تضم سورة التوبة كاملة؛ أعدّها فريق برئاسة الداعية أصلان أرخيستوف، المعروف بأبي إسلام الشركسي، مع خمسة محررين مساعدين أربعة منهم نساء، ونشرها «معهد ريحان» الإلكتروني، مع النص العربي ودون مقدمة ولا حواشٍ."
  en: "A Russian rendering of the meanings of the Qur'an whose first part appeared in 2022 as an 'experimental edition', from al-Fatiha to verse 93 of al-Tawba, with a second edition in 2023 including the whole of al-Tawba; prepared by a team led by the preacher Aslan Arkhestov, known as Abu Islam al-Sharkasi, with five assistant editors, four of them women, and published by the online Rayhan Institute, with the Arabic text and without introduction or notes."
  ur: "قرآن کے معانی کا روسی ترجمہ جس کا پہلا حصہ 2022 میں «تجرباتی اشاعت» کے طور پر فاتحہ سے سورۂ توبہ کی آیت 93 تک آیا، اور 2023 میں دوسری اشاعت پوری سورۂ توبہ کے ساتھ؛ اسے داعی اصلان ارخیستوف، المعروف ابو اسلام الشرکسی، کی سربراہی میں پانچ معاون مدیران کی ٹیم نے تیار کیا جن میں چار خواتین ہیں، اور آن لائن «ریحان انسٹی ٹیوٹ» نے عربی متن کے ساتھ، بغیر مقدمے اور حواشی کے، شائع کیا۔"
