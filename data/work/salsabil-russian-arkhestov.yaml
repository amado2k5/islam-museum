label: { ar: "سلسبيل: ترجمة معاني القرآن العظيم إلى الروسية ⁦(أصلان أرخيستوف وفريقه)⁩", en: "Salsabil: A Translation of the Meanings of the Great Qur'an (Aslan Arkhestov et al.)", ur: "سلسبیل: قرآنِ عظیم کے معانی کا روسی ترجمہ ⁦(اصلان ارخیستوف اور ٹیم)⁩", es: "Salsabil: Una traducción de los significados del Gran Corán (Aslan Arkhestov et al.)", fr: "Salsabil: Une traduction des significations du Grand Coran (Aslan Arkhestov et al.)", tr: "Salsabeel: Büyük Kur'an'ın Anlamlarının Rusçaya Çevirisi (Aslan Arkhistov ve ekibi)", id: "Salsabeel: Terjemahan Makna Al-Qur'an Agung ke dalam bahasa Rusia (Aslan Arkhistov dan timnya)" }
summary:
  ar: "ترجمة روسية لمعاني القرآن صدر جزؤها الأول سنة 2022 بوصف «طبعة تجريبية»، من الفاتحة إلى الآية 93 من سورة التوبة، ثم طبعة ثانية سنة 2023 تضم سورة التوبة كاملة؛ أعدّها فريق برئاسة الداعية أصلان أرخيستوف، المعروف بأبي إسلام الشركسي، مع خمسة محررين مساعدين أربعة منهم نساء، ونشرها «معهد ريحان» الإلكتروني، مع النص العربي ودون مقدمة ولا حواشٍ."
  en: "A Russian rendering of the meanings of the Qur'an whose first part appeared in 2022 as an 'experimental edition', from al-Fatiha to verse 93 of al-Tawba, with a second edition in 2023 including the whole of al-Tawba; prepared by a team led by the preacher Aslan Arkhestov, known as Abu Islam al-Sharkasi, with five assistant editors, four of them women, and published by the online Rayhan Institute, with the Arabic text and without introduction or notes."
  ur: "قرآن کے معانی کا روسی ترجمہ جس کا پہلا حصہ 2022 میں «تجرباتی اشاعت» کے طور پر فاتحہ سے سورۂ توبہ کی آیت 93 تک آیا، اور 2023 میں دوسری اشاعت پوری سورۂ توبہ کے ساتھ؛ اسے داعی اصلان ارخیستوف، المعروف ابو اسلام الشرکسی، کی سربراہی میں پانچ معاون مدیران کی ٹیم نے تیار کیا جن میں چار خواتین ہیں، اور آن لائن «ریحان انسٹی ٹیوٹ» نے عربی متن کے ساتھ، بغیر مقدمے اور حواشی کے، شائع کیا۔"
  es: "Una traducción rusa de los significados del Corán, cuya primera parte apareció en 2022 como una \"edición experimental\", desde al-Fatiha hasta el versículo 93 de al-Tawba, con una segunda edición en 2023 que incluye todo al-Tawba; preparada por un equipo liderado por el predicador Aslan Arkhestov, conocido como Abu Islam al-Sharkasi, con cinco editores asistentes, cuatro de ellos mujeres, y publicada por el Instituto Rayhan en línea, con el texto en árabe y sin introducción ni notas."
  fr: "Une traduction russe des significations du Coran dont la première partie est apparue en 2022 en tant qu'« édition expérimentale », de la Fatiha au verset 93 de la sourate At-Tawba, avec une seconde édition en 2023 incluant l'intégralité de la sourate At-Tawba; préparée par une équipe dirigée par le prédicateur Aslan Arkhestov, connu sous le nom d'Abu Islam al-Sharkasi, avec cinq assistants éditeurs, dont quatre femmes, et publiée par l'Institut Rayhan en ligne, avec le texte arabe et sans introduction ni notes."
  tr: "Kur'an'ın anlamlarının Rusça çevirisi olan ilk bölümü, 2022'de \"deneysel baskı\" olarak yayımlandı; El-Fetiha'dan Nevbe Suresi'nin 93. ayetine kadar, ardından 2023'te tüm Tevbe Suresi'ni içeren ikinci baskı olarak yayımlandı; vaiz Aslan Arkhistov (Ebu İslam El-Şarkasi olarak bilinir) liderliğindeki bir ekip tarafından hazırlandı, beş yardımcı editör vardı, bunların dördü kadındı. Eser, Rayhan Elektronik Enstitüsü tarafından Arapça metinle, giriş veya dipnot olmadan yayımlandı."
  id: "Terjemahan Rusia dari makna Al-Qur'an, bagian pertamanya diterbitkan pada tahun 2022 sebagai \"edisi eksperimental,\" dari Al-Fatiha untuk ayat 93 Surah At-Tawbah, kemudian edisi kedua pada tahun 2023 yang memuat seluruh Surah At-Tawbah; disiapkan oleh tim yang dipimpin oleh pengkhotbah Aslan Arkhistov, yang dikenal sebagai Abu Islam Al-Sharkasi, dengan lima asisten editor, empat di antaranya adalah perempuan. Edisi ini diterbitkan oleh Rayhan Electronic Institute, dengan teks Arab dan tanpa pengantar atau catatan kaki."
