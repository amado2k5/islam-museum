id: work/fatwa-amja-sea-water-wudu
class: work
kind: fatwa
label: { ar: "الوضوء بماء البحر", en: "Wudu with sea water — in Ramadan and outside it", ur: "سمندری پانی سے وضو" }
summary:
  ar: "سأل سائل هل يجوز الوضوء بماء البحر في نهار رمضان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85328 بتاريخ 24 أغسطس 2011)⁩ أنه يجوز الوضوء بماء البحر في رمضان وفي غير رمضان فقد سئل النبي عن ذلك فقال هو الطهور ماؤه الحل ميتته، وعن أبي هريرة قال سأل رجل رسول الله فقال يا رسول الله إنا نركب البحر ونحمل معنا القليل من الماء فإن توضأنا به عطشنا أفنتوضأ من ماء البحر فقال هو الطهور ماؤه الحل ميتته على ما فصّل."
  en: "A questioner asked whether wudu with sea water is lawful by a Ramadan day. Dr. Salah al-Sawi (fatwa no. 85328, 24 August 2011) answered that wudu with sea water is lawful in Ramadan and outside it — the Prophet was asked and said 'its water is the purifier, its dead lawful'; Abu Hurayra reports the man who said 'Messenger of God, we ride the sea carrying little water — if we make wudu with it we thirst; shall we do wudu from the sea?' and he answered 'its water is the purifier, its dead lawful' — as detailed."
  ur: "ایک سائل نے سمندری پانی سے وضو پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85328، 24 اگست 2011)⁩ کے مطابق جائز ہے — نبی نے فرمایا اس کا پانی پاک کرنے والا ہے۔"
