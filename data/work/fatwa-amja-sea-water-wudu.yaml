id: work/fatwa-amja-sea-water-wudu
class: work
kind: fatwa
label: { ar: "الوضوء بماء البحر", en: "Wudu with sea water — in Ramadan and outside it", ur: "سمندری پانی سے وضو", es: "Wudu con agua de mar —en Ramadán y fuera de él—", fr: "Ablutions à l'eau de mer — pendant et en dehors du Ramadan", tr: "Deniz suyu ile abdest alma", id: "Mandi dengan air laut" }
summary:
  ar: "سأل سائل هل يجوز الوضوء بماء البحر في نهار رمضان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85328 بتاريخ 24 أغسطس 2011)⁩ أنه يجوز الوضوء بماء البحر في رمضان وفي غير رمضان فقد سئل النبي عن ذلك فقال هو الطهور ماؤه الحل ميتته، وعن أبي هريرة قال سأل رجل رسول الله فقال يا رسول الله إنا نركب البحر ونحمل معنا القليل من الماء فإن توضأنا به عطشنا أفنتوضأ من ماء البحر فقال هو الطهور ماؤه الحل ميتته على ما فصّل."
  en: "A questioner asked whether wudu with sea water is lawful by a Ramadan day. Dr. Salah al-Sawi (fatwa no. 85328, 24 August 2011) answered that wudu with sea water is lawful in Ramadan and outside it — the Prophet was asked and said 'its water is the purifier, its dead lawful'; Abu Hurayra reports the man who said 'Messenger of God, we ride the sea carrying little water — if we make wudu with it we thirst; shall we do wudu from the sea?' and he answered 'its water is the purifier, its dead lawful' — as detailed."
  ur: "ایک سائل نے سمندری پانی سے وضو پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85328، 24 اگست 2011)⁩ کے مطابق جائز ہے — نبی نے فرمایا اس کا پانی پاک کرنے والا ہے۔"
  es: "Un consultante preguntó si el wudu con agua de mar es lícito en un día de Ramadán. El Dr. Salah al-Sawi (fatwa n.º 85328, 24 de agosto de 2011) respondió que el wudu con agua de mar es lícito en Ramadán y fuera de él. Se le preguntó al Profeta y él dijo: \"Su agua es purificadora, su muerte es lícita\". Abu Hurayra relata que un hombre dijo: \"Mensajero de Dios, navegamos por el mar llevando poca agua; si hacemos el wudu con ella, tenemos sed. ¿Debemos hacer el wudu con agua del mar?\", y él respondió: \"Su agua es purificadora, su muerte es lícita\", como se detalla."
  fr: "Une personne a demandé si les ablutions avec de l'eau de mer étaient licites pendant le Ramadan. Le Dr Salah al-Sawi (fatwa n° 85328, 24 août 2011) a répondu que les ablutions avec de l'eau de mer étaient licites pendant et en dehors du Ramadan. Le Prophète a été interrogé à ce sujet et a dit: « Son eau est purificatrice, elle est licite même après avoir été souillée. » Abou Hourayra rapporte qu'un homme a dit: « Ô Messager de Dieu, nous naviguons sur la mer avec peu d'eau. Si nous faisons nos ablutions avec cette eau, nous avons soif; devons-nous faire nos ablutions avec l'eau de mer ? » Et il a répondu: « Son eau est purificatrice, elle est licite même après avoir été souillée. »"
  tr: "Bir soruya Ramazan ayında gündüz deniz suyu ile abdest almanın izin olup olmadığı soruldu. Dr. Salah Al-Sawy (24 Ağustos 2011 tarihli Fetva No. 85328) Ramazan ayında ve Ramazan dışında deniz suyu ile abdest almanın caiz olduğunu yanıtladı. Peygamber'e bu konuda soruldu ve şöyle dedi: Bu saf sudur ve suyu helaldir. Ebu Huraira, bir adamın Allah'ın Elçi'ne sorduğunu ve onun şöyle dediğini aktarır; o da şöyle demiştir: Ey Allah'ın Elçisi, biraz su taşıyarak denizde yolculuk yaparız, eğer onunla abdest alırsak ve susarsak, deniz suyundan abdest alma yapmalı mıyız? Dedi ki: Bu saf sudur, saf suyu ölüdür, hükmün belirttiği gibi."
  id: "Seorang penanya ditanya apakah diperbolehkan melakukan wudhu dengan air laut pada siang hari di bulan Ramadan. Dr. Salah Al-Sawy menjawab (Fatwa No. 85328 tanggal 24 Agustus 2011) bahwa diperbolehkan melakukan wudhu dengan air laut selama Ramadan dan di luar Ramadan. Nabi ditanya tentang hal ini dan berkata: Itu air murni, dan airnya halal. Abu Huraira melaporkan bahwa seorang pria bertanya kepada Rasulullah, yang berkata: Wahai Rasulullah, kami menunggang laut membawa sedikit air, dan jika kami melakukan wudhu dengan air itu dan merasa haus, apakah kami harus melakukan wudhu dari air laut? Beliau berkata: Itu air murni, air murninya mati, seperti yang dijelaskan dalam putusan."
