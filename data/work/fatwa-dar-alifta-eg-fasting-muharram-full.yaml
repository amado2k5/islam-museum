summary:
  ar: "سائل سأل عن فضل شهر المحرم وحكم صيامه كاملًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21977)⁩ أن شهر المحرم من الأشهر التي ميزها الله وفضلها على كثير من شهور السنة فهو من الأشهر الحرم، وبيّن الجواب حكم صيامه على وجهه."
  en: "A questioner asked about the merit of Muharram and the ruling on fasting it in full. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21977) answered that Muharram is among the months God distinguished and favoured over most of the year — it is one of the sacred months; the answer sets out the ruling on fasting it."
  ur: "ایک سائل نے محرم کے فضل اور پورا مہینہ روزے رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21977)⁩ نے جواب دیا کہ محرم ان مہینوں میں ہے جنہیں اللہ نے سال کے زیادہ تر مہینوں پر فضیلت دی — یہ حرم والے مہینوں میں ہے؛ جواب میں اس کے روزے کا حکم بیان ہوا۔"
