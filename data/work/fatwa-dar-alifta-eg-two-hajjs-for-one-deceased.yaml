id: work/fatwa-dar-alifta-eg-two-hajjs-for-one-deceased
class: work
kind: fatwa
label: { ar: "حكم أداء فريضة الحج عن ميت واحد في عام واحد من شخصين", en: "Two people performing Hajj for one deceased in a single year", ur: "ایک سال میں ایک میت کے لیے دو اشخاص کا حج کرنا", es: "Dos personas realizando el Hajj por un difunto en un solo año." }
summary:
  ar: "سائل سأل عن أداء الحج عن ميت واحد من شخصين في عام واحد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23257)⁩ أنه لا مانع شرعًا من أداء حجتين عن ميت واحد من شخصين مختلفين في عام واحد، وتقع إحداهما عن حجة الإسلام والأخرى تطوعًا على ما فصّل الجواب."
  en: "A questioner asked about two different people performing Hajj on behalf of one deceased in a single year. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23257) answered that nothing in the sharia bars two Hajjs for one deceased by two different persons in one year: one counts as the obligatory Hajj of Islam and the other as supererogatory, as the answer details."
  ur: "ایک سائل نے ایک میت کے لیے ایک ہی سال میں دو مختلف اشخاص کے حج کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23257)⁩ نے جواب دیا کہ ایک میت کے لیے دو لوگوں کے ایک سال میں دو حج کرنے میں شرعاً کوئی مانع نہیں: ایک حجۃ الاسلام شمار ہوگا اور دوسرا تطوع، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de que dos personas diferentes realizaran el Hajj en nombre de un difunto en un mismo año. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 23257) respondió que nada en la sharia prohíbe que dos personas diferentes realicen el Hajj por un mismo difunto en un año: uno se considera el Hajj obligatorio del Islam y el otro, el supererogatorio, como se detalla en la respuesta."
