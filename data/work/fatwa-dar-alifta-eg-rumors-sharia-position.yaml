id: work/fatwa-dar-alifta-eg-rumors-sharia-position
class: work
kind: fatwa
label: { ar: "الموقف الشرعي من الشائعات والأكاذيب وسبل التصدي لها", en: "The sharia position on rumours and lies and how to counter them", ur: "افواہوں اور جھوٹ کے خلاف شرعی موقف اور ان سے نمٹنے کے طریقے", es: "La postura de la sharia sobre los rumores y las mentiras y cómo contrarrestarlos.", fr: "La position de la charia sur les rumeurs et les mensonges et comment les contrer" }
summary:
  ar: "سائل قال: تنتشر شائعات وأكاذيب يحاول مروجوها بث الفتنة بين الناس لإثارة البلبلة والذعر في نفوس المواطنين، فكيف التصدي لها؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24451)⁩ أن ترويج الشائعات والأكاذيب بين الناس ونقل الأخبار غير الموثوقة دون تثبت أمر محرم شرعًا؛ لما فيه من إشاعة الباطل وتضليل الناس وإثارة الفتن والبلبلة في المجتمع."
  en: "A questioner said that rumours and lies are being spread whose promoters seek to sow discord and alarm among citizens, and asked how to counter them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24451) answered that propagating rumours and falsehoods among people and passing on unverified news without checking is prohibited in the sharia, for the falsehood it spreads, the misleading of people, and the discord and turmoil it stirs in society."
  ur: "ایک سائل نے کہا کہ ایسی افواہیں اور جھوٹ پھیل رہے ہیں جن کے پھیلانے والے شہریوں میں فتنہ اور خوف بکھیرنا چاہتے ہیں — ان سے کیسے نمٹا جائے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24451)⁩ نے جواب دیا کہ لوگوں میں افواہ اور جھوٹ پھیلانا اور بغیر تصدیق غیر معتبر خبریں نقل کرنا شریعت میں حرام ہے، اس باطل کے پھیلاؤ، لوگوں کی گمراہی اور معاشرے میں فتنہ و بلبلی کی وجہ سے۔"
  es: "Un interlocutor afirmó que se están difundiendo rumores y mentiras cuyos promotores buscan sembrar discordia y alarma entre los ciudadanos, y preguntó cómo contrarrestarlos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24451) respondió que propagar rumores y falsedades entre la gente y transmitir noticias no verificadas sin comprobarlas está prohibido por la sharia, debido a la falsedad que difunde, el engaño a la gente y la discordia y agitación que genera en la sociedad."
  fr: "Un internaute a déclaré que des rumeurs et des mensonges se répandent, leurs instigateurs cherchant à semer la discorde et l'inquiétude parmi les citoyens, et a demandé comment les contrer. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24451) a répondu que la propagation de rumeurs et de contre-vérités, ainsi que la transmission d'informations non vérifiées, sont interdites par la charia, en raison du mensonge qu'elles véhiculent, de l'égarement qu'elles induisent en erreur et des troubles qu'elles engendrent au sein de la société."
