label: { ar: "العمل والإيمان عند المرجئة وأهل السنة", en: "Deeds within faith — the Murji'a and the Sunnis", ur: "عمل اور ایمان — مرجئہ اور اہل سنت", es: "Actos dentro de la fe: los Murji'a y los Suníes", fr: "Les actes accomplis dans la foi — les Murji'a et les Sunnis" }
summary:
  ar: "سأل سائل مهتم بفكر الشيخ عن مسألة فصل المرجئة العمل عن الإيمان. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21858 بتاريخ 10 يوليو 2007)⁩ أن صفوة القول في هذه القضية أن الأعمال شرط كمال للإيمان إلا ما دل الدليل منها على أنه شرط صحة وهذا لا يتنافي مع قولنا إن الإيمان قول وعمل لأن المرجئة أخرجوا الأعمال جميعًا من مسمى الإيمان والخوارج أدخلوها جميعًا في أصل الإيمان وأهل السنة بينهما قالوا إن الإيمان قول وعمل ولكن من الأعمال ما يدخل في أصل الإيمان ومنها ما يدخل في كماله الواجب ومنها ما يدخل في كماله المستحب والأدلة الشرعية هي التي تميز هذا من ذاك."
  en: "A questioner interested in the shaykh's thought asked about the Murji'a's separating deeds from faith. Dr. Salah al-Sawi (fatwa no. 21858, 10 July 2007) answered that the essence is: deeds are a condition of faith's completeness, except what the proof shows to be a condition of its validity — and this does not contradict saying faith is word and deed, for the Murji'a excluded all deeds from the name of faith and the Khawarij drew all into faith's root while the Sunnis stand between: faith is word and deed, but some deeds enter faith's root, some its obligatory completeness, some its recommended completeness — the revealed proofs distinguish each."
  ur: "ایک سائل نے مرجئہ کے عمل و ایمان کے فرق پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21858، 10 جولائی 2007)⁩ کے مطابق اہل سنت وسط ہیں — ایمان قول و عمل ہے مگر اعمال میں سے بعض اصل ایمان، بعض واجب کمال اور بعض مستحب کمال میں آتے ہیں۔"
  es: "Un consultante interesado en el pensamiento del jeque preguntó acerca de la separación que hacen los Murji'a entre obras y fe. El Dr. Salah al-Sawi (fatwa n.° 21858, 10 de julio de 2007) respondió que la esencia es: las obras son una condición para la plenitud de la fe, excepto lo que la prueba demuestra que es una condición para su validez; y esto no contradice decir que la fe es palabra y obra, pues los Murji'a excluyeron todas las obras del nombre de fe y los Khawarij las incorporaron todas a la raíz de la fe, mientras que los Sunitas se sitúan en un punto intermedio: la fe es palabra y obra, pero algunas obras entran en la raíz de la fe, algunas en su plenitud obligatoria, otras en su plenitud recomendada; las pruebas reveladas distinguen cada una."
  fr: "Un interrogateur, s'intéressant à la pensée du cheikh, a posé une question sur la distinction opérée par les Murji'a entre les actes et la foi. Le Dr Salah al-Sawi (fatwa n° 21858, 10 juillet 2007) a répondu que l'essentiel est le suivant: les actes sont une condition de la plénitude de la foi, sauf ceux que la preuve démontre être une condition de sa validité. Ceci n'est pas contradictoire avec l'affirmation selon laquelle la foi est parole et acte, car les Murji'a excluaient tous les actes du champ de la foi, tandis que les Kharijites les intégraient tous à la racine de la foi. Les Sunnites, quant à eux, adoptent une position intermédiaire: la foi est parole et acte, mais certains actes participent à la racine de la foi, d'autres à sa plénitude obligatoire, d'autres encore à sa plénitude recommandée; les preuves révélées permettent de les distinguer."
