label: { ar: "استئجار كنيسة للجمعة مع قرب المسجد", en: "Renting a church for Friday prayer when a mosque is near", ur: "مسجد کے قریب ہوتے ہوئے چرچ کرایہ پر لینا", es: "Alquilar una iglesia para la oración del viernes cuando hay una mezquita cerca.", fr: "Louer une église pour la prière du vendredi alors qu'une mosquée se trouve à proximité", tr: "Caminin yakınında cuma namazı için kilise kiralama", id: "Menyewa gereja untuk salat Jumat dekat masjid" }
summary:
  ar: "سأل مقيم في دولة غربية عن استئجار كنيسة لأداء الجمع والجماعات وعن إبراز لفظ الجلالة على أحد صلبانها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78505 بتاريخ 9 أبريل 2009)⁩ أنه إذا كان المسجد قريبًا ولا توجد حاجة ظاهرة لاستئجار الكنيسة فلا ينبغي استئجارها حفاظًا على وحدة المسلمين واجتماع كلمتهم وصيانة لأموالهم، وإن وجدت حاجة ماسة ظاهرة لتمكين من لا يستطيع بلوغ المساجد القريبة من أداء شعائر دينه فلا حرج، وإن كان ذلك فلا يرى وجهًا لإبراز لفظ الجلالة على أحد صلبان الكنيسة مع بقاء الصلبان مشرعة ظاهرة فهذا خلط لا ينبغي الوقوع فيه، وتقدير هذه الحاجة يرجع إلى أهل الحل والعقد منهم فيأتمروا بينهم بمعروف."
  en: "Muslims in a Western country asked about renting a church for Friday and congregational prayers, and about displaying God's name over one of its crosses. Dr. Salah al-Sawi (fatwa no. 78505, 9 April 2009) answered that if a mosque is near and no apparent need requires the rental, it should not be rented — preserving the Muslims' unity of word and guarding their funds; if a pressing need exists to let those unable to reach the near mosques perform their rites, there is no harm; and even then he sees no point in displaying God's name on one cross while the rest stand visible — a mixing not to fall into; judging the need and its degree returns to the community's decision-makers, who should consult one another in good."
  ur: "ایک سائل نے چرچ کرایہ پر لے کر جمعہ ادا کرنے اور اس پر اللہ کا نام لگانے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78505، 9 اپریل 2009)⁩ کے مطابق قریب مسجد ہو تو کرایہ نہیں؛ سخت ضرورت پر جائز؛ مگر صلیب پر اللہ کا نام لگانا خلط ہے۔"
  es: "Musulmanes de un país occidental preguntaron sobre el alquiler de una iglesia para las oraciones del viernes y las oraciones en congregación, y sobre la posibilidad de exhibir el nombre de Dios sobre una de sus cruces. El Dr. Salah al-Sawi (fatwa n.º 78505, 9 de abril de 2009) respondió que si hay una mezquita cerca y no existe una necesidad aparente que justifique el alquiler, no debería alquilarse, preservando así la unidad de palabra de los musulmanes y protegiendo sus recursos; si existe una necesidad imperiosa de que quienes no pueden llegar a las mezquitas cercanas realicen sus ritos, no hay inconveniente; e incluso en ese caso, no ve sentido en exhibir el nombre de Dios en una cruz mientras las demás permanecen visibles, una mezcla que no se debe cometer; juzgar la necesidad y su grado corresponde a los líderes de la comunidad, quienes deben consultarse entre sí para el bien común."
  fr: "Des musulmans d'un pays occidental ont interrogé Salah al-Sawi (fatwa n° 78505, 9 avril 2009) sur la possibilité de louer une église pour la prière du vendredi et les prières en congrégation, et d'y afficher le nom de Dieu au-dessus d'une croix. Il a répondu que si une mosquée est proche et qu'aucun besoin apparent ne justifie sa location, il ne faut pas la louer – préservant ainsi l'unité de parole des musulmans et la gestion de leurs finances. S'il existe un besoin urgent de permettre à ceux qui ne peuvent se rendre dans les mosquées les plus proches d'accomplir leurs rites, cela ne pose aucun problème. Même dans ce cas, il ne voit aucun intérêt à afficher le nom de Dieu sur une croix alors que les autres restent visibles – un écueil à éviter. L'appréciation du besoin et de son importance revient aux responsables de la communauté, qui doivent se consulter."
  tr: "Batı ülkesinde bir sakin, Cuma ve cemaat toplantıları yapmak ve ilahi adın haçlarından birinde sergilenmesi hakkında sorular soruldu. Dr. Salah Al-Sawy (9 Nisan 2009 tarihli 78505 sayılı fetva) cami yakındaysa ve kiliseyi kiralamaya açıkça ihtiyaç yoksa, Müslüman birliğini korumak, inançlarını birleştirmek ve servetlerini korumak için kiralanmaması gerektiğini yanıtladı. Yakındaki camilere ulaşamayanların dini ritüellerini gerçekleştirebilmeleri için acil ve açık bir ihtiyaç varsa, zarar yoktur. Eğer durum buysa, kilisenin haçlarından birinde Tanrı'nın adının görünür ve belirgin kaldığı sürece asılması için bir neden yoktur. Bu karışıklık yanlış anlaşılmamalıdır. Bu ihtiyacın değerlendirilmesi, yasal ve sözleşmeli olanlara aittir, bu yüzden aralarında iyi bir şekilde anlaşmaları gerekir."
  id: "Seorang penduduk di negara Barat ditanya tentang menyewa gereja untuk mengadakan pertemuan Jumat dan jemaat serta tentang memamerkan nama Tuhan pada salah satu salibnya. Dr. Salah Al-Sawy menjawab (Fatwa No. 78505 tanggal 9 April 2009) bahwa jika masjid itu dekat dan tidak ada kebutuhan nyata untuk menyewakan gereja, maka masjid tersebut tidak boleh disewakan untuk menjaga persatuan Muslim, menyatukan iman mereka, dan melindungi kekayaan mereka. Jika ada kebutuhan mendesak untuk memungkinkan mereka yang tidak dapat mencapai masjid terdekat untuk melaksanakan ritual keagamaan mereka, maka tidak ada salahnya. Jika itu terjadi, tidak ada alasan untuk menampilkan nama Tuhan di salah satu salib gereja selama salib tersebut tetap terlihat dan menonjol. Kebingungan ini tidak boleh disalahartikan. Penilaian kebutuhan ini dilakukan oleh mereka yang sah dan berkontrak di antara mereka, sehingga mereka harus sepakat di antara mereka dengan baik."
