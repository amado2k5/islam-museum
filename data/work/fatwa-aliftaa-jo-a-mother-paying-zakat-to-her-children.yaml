id: work/fatwa-aliftaa-jo-a-mother-paying-zakat-to-her-children
class: work
kind: fatwa
label: { ar: "دفع الأم زكاة مالها لأولادها", en: "A mother paying her zakat to her children", ur: "ماں کا اپنی زکوٰۃ اپنی اولاد کو دینا" }
summary:
  ar: "سؤال عن دفع الأم زكاة مالها لأولادها، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز للأم أن تعطي أولادها من الزكاة إن كانوا فقراء مستحقين وغير مكفيين بنفقة غيرهم. أجابت الدائرة بأنه يجوز للأم أن تعطي أولادها من الزكاة إن كانوا ممن يستحقونها، كأن كانوا فقراء لا مال لهم وغير مكفيين بنفقة غيرهم عليهم. واستدلت بحديث رواه البخاري في شأن زينب زوج عبد الله بن مسعود، معناه أن زوجها وولدها أحق من تصدقت عليهم. ونقلت عن الماوردي في الحاوي الكبير (8/537) جواز دفع الزوجة زكاتها إلى زوجها، مستدلًا بعموم آية مصارف الزكاة [[passage/quran-9-60|سورة التوبة 9:60]] وبحديث أبي هريرة في شأن زينب."
  en: "A question about a mother paying her zakat to her children, in which Jordan's General Iftaa Department answered that a mother may give her zakat to her children if they are poor and eligible and not already adequately maintained by others. The Department answered that a mother may give zakat to her children if they are eligible for it, for example if they are poor, have no wealth and are not adequately maintained by someone else. It cited a hadith narrated by al-Bukhari about Zaynab, the wife of Abdullah ibn Mas'ud, whose meaning is that her husband and her child were the most deserving of her charity. It quoted al-Mawardi in al-Hawi al-Kabir (8/537) that a wife may pay her zakat to her husband, arguing from the general wording of the verse on the recipients of zakat, [[passage/quran-9-60|Surat al-Tawba 9:60]], and from the hadith of Abu Hurayra about Zaynab."
  ur: "ماں کا اپنی زکوٰۃ اپنی اولاد کو دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ماں اپنی اولاد کو زکوٰۃ دے سکتی ہے اگر وہ فقیر اور مستحق ہوں اور کسی اور کے نفقے سے کفایت نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ ماں اپنی اولاد کو زکوٰۃ دے سکتی ہے اگر وہ اس کے مستحق ہوں، مثلاً فقیر ہوں، ان کے پاس مال نہ ہو اور کسی اور کا نفقہ ان کے لیے کافی نہ ہو۔ اس نے عبداللہ بن مسعود کی اہلیہ زینب کے بارے میں بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ ان کا شوہر اور ان کی اولاد ان کے صدقے کے سب سے زیادہ حق دار ہیں۔ اس نے الحاوی الکبیر (8/537) میں ماوردی سے نقل کیا کہ بیوی اپنی زکوٰۃ اپنے شوہر کو دے سکتی ہے، اور انہوں نے زکوٰۃ کے مصارف والی آیت [[passage/quran-9-60|سورۃ التوبہ 9:60]] کے عموم اور زینب کے بارے میں ابو ہریرہ کی حدیث سے استدلال کیا۔"
