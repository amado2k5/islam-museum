id: work/fatwa-aliftaa-jo-a-mother-paying-zakat-to-her-children
class: work
kind: fatwa
label: { ar: "دفع الأم زكاة مالها لأولادها", en: "A mother paying her zakat to her children", ur: "ماں کا اپنی زکوٰۃ اپنی اولاد کو دینا", es: "Una madre pagando su zakat a sus hijos", fr: "Une mère verse sa zakat à ses enfants", tr: "Anne çocuklarına zekatını verdi", id: "Ibu membayar zakat kepada anak-anaknya" }
summary:
  ar: "سؤال عن دفع الأم زكاة مالها لأولادها، أجابت فيه دائرة الإفتاء العام الأردنية بأنه يجوز للأم أن تعطي أولادها من الزكاة إن كانوا فقراء مستحقين وغير مكفيين بنفقة غيرهم. أجابت الدائرة بأنه يجوز للأم أن تعطي أولادها من الزكاة إن كانوا ممن يستحقونها، كأن كانوا فقراء لا مال لهم وغير مكفيين بنفقة غيرهم عليهم. واستدلت بحديث رواه البخاري في شأن زينب زوج عبد الله بن مسعود، معناه أن زوجها وولدها أحق من تصدقت عليهم. ونقلت عن الماوردي في الحاوي الكبير (8/537) جواز دفع الزوجة زكاتها إلى زوجها، مستدلًا بعموم آية مصارف الزكاة [[passage/quran-9-60|سورة التوبة 9:60]] وبحديث أبي هريرة في شأن زينب."
  en: "A question about a mother paying her zakat to her children, in which Jordan's General Iftaa Department answered that a mother may give her zakat to her children if they are poor and eligible and not already adequately maintained by others. The Department answered that a mother may give zakat to her children if they are eligible for it, for example if they are poor, have no wealth and are not adequately maintained by someone else. It cited a hadith narrated by al-Bukhari about Zaynab, the wife of Abdullah ibn Mas'ud, whose meaning is that her husband and her child were the most deserving of her charity. It quoted al-Mawardi in al-Hawi al-Kabir (8/537) that a wife may pay her zakat to her husband, arguing from the general wording of the verse on the recipients of zakat, [[passage/quran-9-60|Surat al-Tawba 9:60]], and from the hadith of Abu Hurayra about Zaynab."
  ur: "ماں کا اپنی زکوٰۃ اپنی اولاد کو دینا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ماں اپنی اولاد کو زکوٰۃ دے سکتی ہے اگر وہ فقیر اور مستحق ہوں اور کسی اور کے نفقے سے کفایت نہ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ ماں اپنی اولاد کو زکوٰۃ دے سکتی ہے اگر وہ اس کے مستحق ہوں، مثلاً فقیر ہوں، ان کے پاس مال نہ ہو اور کسی اور کا نفقہ ان کے لیے کافی نہ ہو۔ اس نے عبداللہ بن مسعود کی اہلیہ زینب کے بارے میں بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ ان کا شوہر اور ان کی اولاد ان کے صدقے کے سب سے زیادہ حق دار ہیں۔ اس نے الحاوی الکبیر (8/537) میں ماوردی سے نقل کیا کہ بیوی اپنی زکوٰۃ اپنے شوہر کو دے سکتی ہے، اور انہوں نے زکوٰۃ کے مصارف والی آیت [[passage/quran-9-60|سورۃ التوبہ 9:60]] کے عموم اور زینب کے بارے میں ابو ہریرہ کی حدیث سے استدلال کیا۔"
  es: "Una pregunta sobre una madre que paga su zakat a sus hijos, en la que el Departamento General de Iftaa de Jordania respondió que una madre puede dar su zakat a sus hijos si son pobres y elegibles y no están ya adecuadamente mantenidos por otros. El Departamento respondió que una madre puede dar zakat a sus hijos si son elegibles para ello, por ejemplo, si son pobres, no tienen riquezas y no están adecuadamente mantenidos por alguien más. Citó un hadiz narrado por al-Bujari sobre Zaynab, la esposa de Abdullah ibn Mas'ud, cuyo significado es que su esposo y su hijo eran los más merecedores de su caridad. Citó a al-Mawardi en al-Hawi al-Kabir (8/537) que una esposa puede pagar su zakat a su esposo, argumentando a partir de la redacción general del versículo sobre los receptores del zakat, [[passage/quran-9-60|Surat al-Tawba 9:60]], y del hadiz de Abu Hurayra sobre Zaynab."
  fr: "Une question concernant le versement de la zakat par une mère à ses enfants a été posée par le Département général de la jurisprudence jordanienne (Iftaa). Ce dernier a précisé qu'une mère peut verser sa zakat à ses enfants s'ils sont pauvres, éligibles et ne bénéficient pas déjà d'une prise en charge suffisante par autrui. Le Département a cité un hadith rapporté par al-Bukhari au sujet de Zaynab, épouse d'Abdullah ibn Mas'ud, signifiant que son mari et son enfant étaient les plus dignes de son aumône. Il cite al-Mawardi dans al-Hawi al-Kabir (8/537) selon lequel une femme peut payer sa zakat à son mari, en se basant sur la formulation générale du verset sur les bénéficiaires de la zakat, [[passage/quran-9-60|Surat al-Tawba 9:60]], et sur le hadith d'Abu Hurayra à propos de Zaynab."
  tr: "Ürdün Genel Fetva Dairesi, çocuklarının fakir, hak ettiği ve başkalarını geçindirecek kadar yetmeyenlerse, bir annenin çocuklarına zekat verebileceğini yanıtladığı bir soruya cevap verdi. Daire, çocuklarının hak edenlerden biri olan bir annenin zekat vermesinin caiz olduğunu, sanki fakir, serveti olmayan ve başkalarını geçindirecek kadar yetmiyormuş gibi kabul ettiğini yanıtladı. El-Buhari'nin Abdullah bin Mes'ud'un eşi Zeynev hakkında anlattığı bir hadise atıfta bulundu; bu da onun kocası ve çocuklarının, sadakat verdiği kişiler arasında en çok hak edenlerdir. Al-Hawi-al-Kabir (8/537) adlı eserinde, bir kadının kocasına zekat vermesinin caiz olduğunu ve zekat harcamaları ayetinin genel anlamını aktardı [[pasaj/kuran-9-60|Tat-Tevbe Suresi 9:]:60]] ve Ebu Hureyre'nin Zeynep ile ilgili hadisleri."
  id: "Sebuah pertanyaan tentang seorang ibu membayar zakat atas kekayaannya kepada anak-anaknya, di mana Departemen Fatwa Umum Yordania menjawab bahwa seorang ibu boleh memberikan zakat kepada anak-anaknya jika mereka miskin dan layak serta tidak cukup untuk menghidupi orang lain. Departemen tersebut menjawab bahwa seorang ibu diperbolehkan memberikan zakat kepada anak-anaknya jika mereka termasuk di antara mereka yang pantas, seolah-olah mereka miskin, tidak memiliki kekayaan, dan tidak cukup untuk menghidupi orang lain. Dinas tersebut mengutip sebuah hadits yang diceritakan oleh al-Bukhari mengenai Zainab, suami Abdullah ibn Mas'ud, yang berarti bahwa suami dan anak-anaknya adalah yang paling layak bagi mereka yang telah ia beri sedekah. Dinas tersebut mengutip Al-Mawardi dalam Al-Hawi al-Kabir (8/537) mengenai izin seorang istri memberikan zakat kepada suaminya, dengan mengutip makna umum ayat tentang pengeluaran zakat [[ayat/al-Qur'an-9-60|Surah At-Tawbah 9:60]] dan hadis Abu Huraira mengenai Zainab."
