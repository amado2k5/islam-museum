id: work/fatwa-aliftaa-jo-insurance-compensation-after-a-road-accident
class: work
kind: fatwa
label: { ar: "أخذ التعويض من شركة التأمين عن إصابات حادث سير", en: "Taking insurance compensation for road-accident injuries", ur: "ٹریفک حادثے کی چوٹوں پر بیمہ کمپنی سے معاوضہ لینا" }
summary:
  ar: "سؤال من مصاب في حادث سير عن أخذ تعويض من شركة التأمين، أجابت فيه دائرة الإفتاء العام الأردنية بأن التعويض عن الضرر مشروع، فلا حرج في أخذه إذا كان عن ضرر حقيقي ولم يكن فيه تحايل أو كذب. أجابت الدائرة بأن التعويض عن الضرر المادي مشروع في الفقه، وأن الفقهاء فصلوا أسبابه الموجبة، واستدلت بتقرير القرآن مبدأ الدية في القتل الخطأ، ونقلت عن الماوردي في الحاوي الكبير أن من أتلف شيئًا ضمنه. وقالت إن التعويض يقع على المباشر للضرر أو المتسبب فيه لأن موجبه الفعل، ونقلت عن الرملي في نهاية المحتاج أن من أتلف مال غيره أو تعدى باستعماله لزمه البدل والأجرة. وخلصت إلى أنه لا حرج في أخذ التعويض من شركات التأمين إذا كان بسبب ضرر حقيقي وقع نتيجة الحادث، ولم يكن في المسألة تحايل أو كذب."
  en: "A question from someone injured in a road accident about taking compensation from the insurance company, in which Jordan's General Iftaa Department answered that compensation for harm is lawful, so there is no objection to taking it for real harm, without deception or lying. The Department answered that compensation for material harm is lawful in fiqh and that jurists have set out the grounds that require it; it pointed to the Qur'an's establishing blood money for accidental killing, and quoted al-Mawardi's al-Hawi al-Kabir that whoever destroys something is liable for it. It said compensation falls on whoever directly caused the harm or brought it about, since the act is what creates liability, quoting al-Ramli's Nihayat al-Muhtaj that whoever destroys another's property or misuses it owes its replacement and the hire. It concluded that there is no objection to taking compensation from insurance companies when it is for real harm caused by the accident, with no deception or lying involved."
  ur: "ٹریفک حادثے میں زخمی ہونے والے کا بیمہ کمپنی سے معاوضہ لینے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نقصان کا معاوضہ جائز ہے، لہٰذا حقیقی نقصان پر بغیر حیلے یا جھوٹ کے اسے لینے میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مادی نقصان کا معاوضہ فقہ میں جائز ہے اور فقہا نے اس کے موجب اسباب تفصیل سے بیان کیے ہیں؛ اس نے قتلِ خطا میں دیت کے قرآنی اصول سے استدلال کیا، اور ماوردی کی الحاوی الکبیر سے نقل کیا کہ جو کسی چیز کو تلف کرے وہ اس کا ضامن ہے۔ اس نے کہا کہ معاوضہ براہِ راست نقصان کرنے والے یا اس کا سبب بننے والے پر ہے کیونکہ موجب فعل ہے، اور رملی کی نہایۃ المحتاج سے نقل کیا کہ جو دوسرے کا مال تلف کرے یا اس کے استعمال میں زیادتی کرے اس پر بدل اور اجرت لازم ہے۔ اس نے نتیجہ نکالا کہ بیمہ کمپنیوں سے معاوضہ لینے میں حرج نہیں جب وہ حادثے سے ہونے والے حقیقی نقصان کی وجہ سے ہو اور اس میں کوئی حیلہ یا جھوٹ نہ ہو۔"
