id: work/fatwa-aliftaa-jo-animal-feed-made-from-earthworms
class: work
kind: fatwa
label: { ar: "تصنيع أعلاف الحيوانات من ديدان الأرض", en: "Making animal feed from earthworms", ur: "کیچووں سے جانوروں کا چارہ بنانا" }
summary:
  ar: "سؤال عن تصنيع أعلاف للحيوانات باستزراع ديدان الأرض وتكاثرها، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في إطعام الدواجن والحيوانات الديدان والحشرات بشرط ثبوت عدم ضررها بالإنسان وفق قول أهل الخبرة، وعرضت خلاف الجمهور والشافعية في الميتة منها. أجابت الدائرة بأنه لا حرج باتفاق الفقهاء في إطعام الطيور والحيوانات الديدان والحشرات الحية لأنها طاهرة، ونقلت قول ابن قاسم الغزي في فتح القريب إن الحيوان كله طاهر إلا الكلب والخنزير وما تولد منهما، وإن ذلك يصدق على الدود المتولد من النجاسة. وقالت إن إطعامها الديدان والحشرات الميتة لا حرج فيه عند جمهور الفقهاء، ونقلت قول ابن قدامة في المغني إن ما ليس له دم سائل كالديدان لا يتنجس بالموت، وذكرت أن الشافعية يكرهون ذلك. وقالت إن حكم إدخال الديدان في الأعلاف يتوقف على كميتها، فإن كانت الأعلاف كلها أو أكثرها من الدود كُره ذلك لنجاستها، ونقلت قول ابن حجر الهيتمي في تحفة المحتاج بكراهة إطعام الحيوان المأكول نجاسة، وإن كانت قليلة تغلب عليها المكونات الطاهرة فلا حرج. وخلصت إلى أنه لا حرج في إطعام الدواجن والحيوانات الديدان والحشرات بشرط ثبوت عدم ضررها بالإنسان وفق قول أهل الخبرة، فإن ثبت ضررها صارت محرمة."
  en: "A question about making animal feed by farming and breeding earthworms, in which Jordan's General Iftaa Department answered that feeding poultry and animals worms and insects is unobjectionable provided experts confirm it does not harm people, and set out the difference between the majority and the Shafi'is over dead ones. The Department answered that jurists agree there is no objection to feeding birds and animals live worms and insects, since they are pure, quoting Ibn Qasim al-Ghazzi in Fath al-Qarib that every animal is pure except the dog, the pig and what is born of them, which includes worms born from impurity. It said that feeding them dead worms and insects is unobjectionable according to the majority of jurists, quoting Ibn Qudama in al-Mughni that creatures without flowing blood, such as worms, do not become impure by death, and noted that the Shafi'is consider it disliked. It said that adding worms to feed depends on the amount: if the feed is entirely or mostly made of worms it is disliked because of their impurity, quoting Ibn Hajar al-Haytami in Tuhfat al-Muhtaj that feeding an edible animal something impure is disliked; if the amount is small and the pure ingredients predominate, there is no objection. It concluded that feeding poultry and animals worms and insects is unobjectionable provided experts confirm it does not harm people; if harm is established, it becomes forbidden."
  ur: "کیچوے پال کر اور ان کی افزائش کر کے جانوروں کا چارہ بنانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مرغیوں اور جانوروں کو کیڑے اور حشرات کھلانے میں حرج نہیں بشرطیکہ ماہرین کے مطابق انسان کو نقصان نہ ہو، اور مردہ کیڑوں کے بارے میں جمہور اور شوافع کا اختلاف بیان کیا۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہا کا اتفاق ہے کہ پرندوں اور جانوروں کو زندہ کیڑے اور حشرات کھلانے میں حرج نہیں کیونکہ وہ پاک ہیں؛ اس نے فتح القریب میں ابن قاسم غزی کا قول نقل کیا کہ کتے، خنزیر اور ان سے پیدا ہونے والے کے سوا ہر جانور پاک ہے، اور اس میں نجاست سے پیدا ہونے والے کیڑے بھی شامل ہیں۔ اس نے کہا کہ جمہور فقہا کے نزدیک انہیں مردہ کیڑے اور حشرات کھلانے میں حرج نہیں، اور المغنی میں ابن قدامہ کا قول نقل کیا کہ جن جانداروں میں بہتا خون نہ ہو، جیسے کیڑے، وہ موت سے نجس نہیں ہوتے، اور ذکر کیا کہ شوافع اسے مکروہ سمجھتے ہیں۔ اس نے کہا کہ چارے میں کیڑے شامل کرنے کا حکم مقدار پر ہے: اگر چارہ پورا یا زیادہ تر کیڑوں سے بنا ہو تو ان کی نجاست کی وجہ سے مکروہ ہے، اور تحفۃ المحتاج میں ابن حجر ہیتمی کا قول نقل کیا کہ کھائے جانے والے جانور کو نجس چیز کھلانا مکروہ ہے؛ اگر مقدار کم ہو اور پاک اجزا غالب ہوں تو حرج نہیں۔ اس نے نتیجہ نکالا کہ مرغیوں اور جانوروں کو کیڑے اور حشرات کھلانے میں حرج نہیں بشرطیکہ ماہرین کے مطابق ثابت ہو کہ انسان کو نقصان نہیں؛ اگر نقصان ثابت ہو جائے تو یہ حرام ہو جاتا ہے۔"
