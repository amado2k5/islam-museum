id: work/fatwa-aliftaa-jo-jordan-lotto
class: work
kind: fatwa
label: { ar: "حكم لوتو الأردن", en: "Jordan Lotto", ur: "اردن لوٹو کا حکم" }
summary:
  ar: "سؤال عن لوتو الأردن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه صورة جديدة من اليانصيب الخيري، وأنه من القمار المحرم. أجابت الدائرة بأن اللوتو في حقيقته قالب جديد من قوالب ما يسمى اليانصيب الخيري، وأن فكرته تهدف إلى إحياء اليانصيب الخيري الأردني. وأحالت إلى فتواها رقم 1303 التي خلصت إلى أن اليانصيب الخيري حرام لأنه يقوم على القمار وهو جزء من الميسر، وأن إنفاق ريعه في الأعمال الخيرية ودعم الفقراء لا يجعله حلالًا لأن الغاية لا تبرر الوسيلة. وقالت إن مشتري الورقة يشتريها بقصد الربح ثم يكون رابحًا أو خاسرًا، وخلصت إلى أن اللوتو صورة من صور القمار، إذ يدفع الشخص مالًا ويدور بين الغنم والغرم، وهو محرم شرعًا."
  en: "A question about Jordan Lotto, in which Jordan's General Iftaa Department answered that it is a new form of the charity lottery and is forbidden gambling. The Department answered that the Lotto is in reality a new format of the so-called charity lottery, and that the idea behind it is to revive the Jordanian charity lottery. It referred to its fatwa no. 1303, which concluded that the charity lottery is forbidden because it rests on gambling and is part of maysir, and that spending its proceeds on charity and the poor does not make it lawful, since the end does not justify the means. It said a ticket buyer buys it hoping for gain and ends up either winning or losing, and concluded that the Lotto is a form of gambling, since a person pays money and is left between gain and loss, which is forbidden in the sharia."
  ur: "اردن لوٹو کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ خیراتی لاٹری کی ایک نئی شکل ہے اور حرام جوا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ لوٹو حقیقت میں نام نہاد خیراتی لاٹری کا ایک نیا قالب ہے، اور اس کا مقصد اردنی خیراتی لاٹری کو دوبارہ زندہ کرنا ہے۔ اس نے اپنے فتویٰ نمبر 1303 کا حوالہ دیا جس کا خلاصہ یہ تھا کہ خیراتی لاٹری حرام ہے کیونکہ وہ جوئے پر قائم اور میسر کا حصہ ہے، اور اس کی آمدنی خیراتی کاموں اور فقرا کی مدد پر خرچ کرنا اسے حلال نہیں بناتا کیونکہ مقصد ذریعے کو جائز نہیں بناتا۔ اس نے کہا کہ ٹکٹ خریدنے والا نفع کی نیت سے خریدتا ہے اور پھر جیتتا یا ہارتا ہے، اور نتیجہ نکالا کہ لوٹو جوئے کی ایک صورت ہے، کیونکہ آدمی مال دیتا ہے اور نفع و نقصان کے درمیان رہتا ہے، اور یہ شرعاً حرام ہے۔"
