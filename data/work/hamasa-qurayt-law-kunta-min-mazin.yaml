label: { ar: "قصيدة قريط بن أنيف «لو كنت من مازن لم تستبح إبلي»", en: "Qurayt ibn Unayf's poem 'Had you been of Mazin'" }
summary:
  ar: "أول قصائد ديوان الحماسة، من البسيط على روي النون، مطلعها «لو كنت من مازن لم تستبح إبلي بنو اللقيطة من ذهل بن شيبانا»؛ تنقل الطبعة أن الحماسة تنسبها إلى «بعض شعراء بالعنبر» ويسمّيه التبريزي قريط بن أنيف {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  en: "The first poem of the Diwan al-Hamasa, in the basit metre on the rhyme nun, opening \"Had you been of Mazin, Banu al-Laqita of Dhuhl ibn Shayban would not have taken my camels\"; the edition notes that the Hamasa ascribes it to \"some poet of al-Anbar\", whom al-Tibrizi names Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
