label: { ar: "قصيدة قريط بن أنيف «لو كنت من مازن لم تستبح إبلي»", en: "Qurayt ibn Unayf's poem 'Had you been of Mazin'", es: "El poema de Qurayt ibn Unayf 'Si hubieras sido de Mazin'", fr: "Le poème de Qurayt ibn Unayf « Si tu avais été de Mazin »", ur: "قریط بن عنیف کی نظم 'تم مزین کے ہوتے'", tr: "Qurait bin Anif'in şiiri: 'Eğer Mazen Olsaydım, Devem Övülmezdi'", id: "Puisi Qurait bin Anif: 'Jika Aku Mazen, Unta-Ku Tidak Akan Dipuji'" }
summary:
  ar: "أول قصائد ديوان الحماسة، من البسيط على روي النون، مطلعها «لو كنت من مازن لم تستبح إبلي بنو اللقيطة من ذهل بن شيبانا»؛ تنقل الطبعة أن الحماسة تنسبها إلى «بعض شعراء بالعنبر» ويسمّيه التبريزي قريط بن أنيف {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  en: "The first poem of the Diwan al-Hamasa, in the basit metre on the rhyme nun, opening \"Had you been of Mazin, Banu al-Laqita of Dhuhl ibn Shayban would not have taken my camels\"; the edition notes that the Hamasa ascribes it to \"some poet of al-Anbar\", whom al-Tibrizi names Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  es: "El primer poema del Diwan al-Hamasa, en metro basit sobre rima nun, comienza con \"Si hubieras sido de Mazin, Banu al-Laqita de Dhuhl ibn Shayban no habría tomado mis camellos\"; la edición señala que la Hamasa lo atribuye a \"algún poeta de al-Anbar\", a quien al-Tibrizi nombra Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  fr: "Le premier poème du Diwan al-Hamasa, en mètre basit sur la rime nun, s'ouvre sur « Si tu avais été de Mazin, les Banu al-Laqita de Dhuhl ibn Shayban n'auraient pas pris mes chameaux »; l'édition note que le Hamasa l'attribue à « un poète d'al-Anbar », qu'al-Tibrizi nomme Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  ur: "دیوان الحمسہ کی پہلی نظم، نظم نون کے باسط میٹر میں، جس کا آغاز \"تم مزین کے ہوتے تو ذہل ابن شیبان کا بنو لقیطہ میرے اونٹ نہ لے جاتا\"؛ ایڈیشن نوٹ کرتا ہے کہ حماسہ نے اسے \"الانبار کے کچھ شاعر\" سے منسوب کیا ہے، جسے تبریزی نے قریت ابن عنیف کا نام دیا ہے"
  tr: "Diwan al-Hamasa'nın ilk şiirleri, basitçe 'Rahibe' harfinden başlar ve 'Eğer Mazen'den olsaydım, Banu al-Laqaita'nın develeri ibn Şeybana'nın göz kamaştırmasıyla övülmezdi.' Baskı, al-Hamasa'nın bunu 'kehribardaki bazı şairlere' atfettiğini ve el-Tabrizi'nin buna Qurayt ibn Anif dediğini bildirir {{cite:hamasa-abu-tammam-ed-1916 s.6}}."
  id: "Puisi-puisi pertama Diwan al-Hamasa, dari huruf sederhana 'Biarawati,' dimulai dengan 'Jika aku dari Mazen, unta-unta Banu al-Laqaita tidak akan dipuji oleh pesona ibn Shaybana.' Edisi tersebut melaporkan bahwa al-Hamasa mengaitkannya dengan 'beberapa penyair dalam amber,' dan al-Tabrizi menyebutnya Qurayt ibn Anif {{cite:hamasa-abu-tammam-ed-1916 hlm.6}}."
