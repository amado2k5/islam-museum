label: { ar: "قرار مجمع الفقه الإسلامي الدولي 102 (11/5) بشأن الاتجار في العملات", en: "IIFA resolution 102 (11/5) on currency trading", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 102 (11/5): کرنسیوں کی تجارت", es: "Resolución 102 (11/5) de la IIFA sobre el comercio de divisas." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. أكد قراراته السابقة: 21 ⁦(3/9)⁩ بشأن النقود الورقية وتغير قيمة العملة، و63 ⁦(7/1)⁩ بشأن الأسواق المالية فقرة التعامل بالعملات، و53 ⁦(6/4)⁩ بشأن القبض فقرة القبض الحكمي. وقرر أنه لا يجوز شرعًا البيع الآجل للعملات ولا المواعدة على الصرف فيها، استنادًا — بلسانه — إلى الكتاب والسنة وإجماع الأمة، وأن الربا والاتجار في العملات والصرف دون التزام بأحكام الشريعة من أهم أسباب الأزمات والتقلبات الاقتصادية. وأوصى بوجوب الرقابة الشرعية على الأسواق المالية وإلزامها بما ينظم أعمالها وفق أحكام الشريعة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It reaffirmed its earlier resolutions 21 (3/9) on paper money and currency-value change, 63 (7/1) on financial markets' currency-trading clause, and 53 (6/4) on possession's deemed-possession clause. It ruled that forward sale of currencies is unlawful, as is promising a future exchange, citing in its text scripture, sunna and the umma's consensus; and that riba and currency and exchange trading without sharia compliance are among the chief causes of economic crises and volatility. It recommended obligatory sharia supervision of financial markets and binding them to rules ordering their work by the law."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ اس نے اپنی سابقہ قراردادوں کی تاکید کی: 21 ⁦(3/9)⁩ برائے کاغذی کرنسی اور قدر کی تبدیلی، 63 ⁦(7/1)⁩ برائے مالی بازاروں میں کرنسی کی تجارت، اور 53 ⁦(6/4)⁩ برائے قبضہ کی دفعہِ قبضہ حُکمی۔ فیصلہ: کرنسیوں کی آجڑ ⁦(فارورڈ)⁩ فروخت شرعاً ناجائز ہے اور مبادلے کا مستقبل کا وعدہ بھی، اس کے بقول کتاب، سنت اور اجماعِ امت کی اساس پر؛ اور ربا اور شریعت کے پابند بغیر کرنسی اور صرافہ تجارت معاشی بحرانوں اور اتار چڑھاؤ کے اہم اسباب میں ہے۔ سفارش: مالی بازاروں پر شرعی نگرانی لازم ہو اور ان کا کام شریعت کے احکام پر چلے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 11.ª sesión en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998). Reafirmó sus resoluciones anteriores 21 (3/9) sobre papel moneda y fluctuaciones del valor de la moneda, 63 (7/1) sobre la cláusula de negociación de divisas en los mercados financieros y 53 (6/4) sobre la cláusula de posesión presunta. Dictaminó que la venta a plazo de divisas es ilícita, al igual que prometer un intercambio futuro, citando en su texto las escrituras, la sunna y el consenso de la umma; y que la usura y la negociación de divisas sin el cumplimiento de la sharia se encuentran entre las principales causas de crisis económicas y volatilidad. Recomendó la supervisión obligatoria de la sharia sobre los mercados financieros y su vinculación a normas que regulen su funcionamiento por ley."
