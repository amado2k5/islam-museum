label: { ar: "قرار مجمع الفقه الإسلامي الدولي 102 (11/5) بشأن الاتجار في العملات", en: "IIFA resolution 102 (11/5) on currency trading", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 102 (11/5): کرنسیوں کی تجارت", es: "Resolución 102 (11/5) de la IIFA sobre el comercio de divisas.", fr: "Résolution 102 (11/5) de l'IIFA sur le négoce de devises", tr: "Uluslararası İslami Fiqh Akademisi Döviz Ticareti ile ilgili 102 (11/5) sayılı Kararı", id: "Resolusi Akademi Fiqh Islam Internasional 102 (5/11) mengenai perdagangan mata uang" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. أكد قراراته السابقة: 21 ⁦(3/9)⁩ بشأن النقود الورقية وتغير قيمة العملة، و63 ⁦(7/1)⁩ بشأن الأسواق المالية فقرة التعامل بالعملات، و53 ⁦(6/4)⁩ بشأن القبض فقرة القبض الحكمي. وقرر أنه لا يجوز شرعًا البيع الآجل للعملات ولا المواعدة على الصرف فيها، استنادًا — بلسانه — إلى الكتاب والسنة وإجماع الأمة، وأن الربا والاتجار في العملات والصرف دون التزام بأحكام الشريعة من أهم أسباب الأزمات والتقلبات الاقتصادية. وأوصى بوجوب الرقابة الشرعية على الأسواق المالية وإلزامها بما ينظم أعمالها وفق أحكام الشريعة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). It reaffirmed its earlier resolutions 21 (3/9) on paper money and currency-value change, 63 (7/1) on financial markets' currency-trading clause, and 53 (6/4) on possession's deemed-possession clause. It ruled that forward sale of currencies is unlawful, as is promising a future exchange, citing in its text scripture, sunna and the umma's consensus; and that riba and currency and exchange trading without sharia compliance are among the chief causes of economic crises and volatility. It recommended obligatory sharia supervision of financial markets and binding them to rules ordering their work by the law."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ اس نے اپنی سابقہ قراردادوں کی تاکید کی: 21 ⁦(3/9)⁩ برائے کاغذی کرنسی اور قدر کی تبدیلی، 63 ⁦(7/1)⁩ برائے مالی بازاروں میں کرنسی کی تجارت، اور 53 ⁦(6/4)⁩ برائے قبضہ کی دفعہِ قبضہ حُکمی۔ فیصلہ: کرنسیوں کی آجڑ ⁦(فارورڈ)⁩ فروخت شرعاً ناجائز ہے اور مبادلے کا مستقبل کا وعدہ بھی، اس کے بقول کتاب، سنت اور اجماعِ امت کی اساس پر؛ اور ربا اور شریعت کے پابند بغیر کرنسی اور صرافہ تجارت معاشی بحرانوں اور اتار چڑھاؤ کے اہم اسباب میں ہے۔ سفارش: مالی بازاروں پر شرعی نگرانی لازم ہو اور ان کا کام شریعت کے احکام پر چلے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 11.ª sesión en Manama (25-30 de Rajab de 1419, 14-19 de noviembre de 1998). Reafirmó sus resoluciones anteriores 21 (3/9) sobre papel moneda y fluctuaciones del valor de la moneda, 63 (7/1) sobre la cláusula de negociación de divisas en los mercados financieros y 53 (6/4) sobre la cláusula de posesión presunta. Dictaminó que la venta a plazo de divisas es ilícita, al igual que prometer un intercambio futuro, citando en su texto las escrituras, la sunna y el consenso de la umma; y que la usura y la negociación de divisas sin el cumplimiento de la sharia se encuentran entre las principales causas de crisis económicas y volatilidad. Recomendó la supervisión obligatoria de la sharia sobre los mercados financieros y su vinculación a normas que regulen su funcionamiento por ley."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 11e session à Manama (25-30 Rajab 1419, 14-19 novembre 1998). Elle a réaffirmé ses résolutions antérieures: la résolution 21 (3/9) relative à la monnaie fiduciaire et à la fluctuation des taux de change, la résolution 63 (7/1) relative aux opérations de change sur les marchés financiers et la résolution 53 (6/4) relative à la notion de possession présumée. Elle a statué que la vente à terme de devises est illicite, de même que la promesse d'un échange futur, en se fondant sur les Écritures, la Sunna et le consensus de la communauté musulmane (umma). Elle a également affirmé que l'usure (riba) et les opérations de change non conformes à la charia figurent parmi les principales causes des crises économiques et de la volatilité. Elle a recommandé une supervision obligatoire des marchés financiers selon la charia et leur assujettissement à des règles régissant leur fonctionnement par la loi."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin Manama'daki on birinci oturumunda (25–30 Recep 1419 H, 14–19 Kasım 1998) toplu kararı alındı. Önceki kararlarını onayladı: kağıt para ve para birimi değeri değişiklikleriyle ilgili 21 (3/9), finansal piyasalarla ilgili 63 (7/1) ve yasal alım (karar) ile ilgili 53 (6/4). Kur'an, Sünnet ve Ümmet uzlaşısı temelinde, para birimlerinin vadeli satışının veya değişim müzakerelerinin dini olarak kabul edilmediğine ve tefecilik, döviz ticareti ve şeriat hükümlerine uyulmadan değişimin krizlerin ve ekonomik dalgalanmaların başlıca nedenleri arasında olduğuna karar verildi. Finansal piyasaların Şeriat denetiminin gerekliliğini ve operasyonlarını Şeriat hükümlerine göre düzenlemelerini zorunlu kılmasını önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesebelasnya di Manama (25–30 Rajab 1419 H, 14–19 November 1998). Keputusan sebelumnya dikonfirmasi: 21 (3/9) mengenai uang kertas dan perubahan nilai mata uang, 63 (7/1) mengenai pasar keuangan (transaksi mata uang), dan 53 (6/4) mengenai penerimaan hukum (putusan). Diputuskan bahwa tidak diperbolehkan secara religius menjual mata uang di masa depan atau merundingkan penukarannya, berdasarkan — menurut kata-katanya sendiri — pada Al-Qur'an, Sunnah, dan konsensus Ummah, dan bahwa riba, perdagangan mata uang, dan pertukaran tanpa mematuhi aturan Syariah adalah salah satu penyebab utama krisis dan fluktuasi ekonomi. Ia merekomendasikan perlunya pengawasan Syariah terhadap pasar keuangan dan mewajibkan mereka untuk mengatur operasi mereka sesuai ketentuan Syariah."
