label:
  ar: "أعداء الإسلام (سلسلة دروس)"
  en: "A'da' al-Islam (lecture series)"
  ur: "اعداء الاسلام (درسی سلسلہ)"
summary:
  ar: "سلسلة من أربع حلقات لعمر عبد الكافي في أرشيف أسابيل، عنوانها «أعداء الإسلام»، يتحدث فيها عمّن يعدّهم أعداءً للإسلام من داخل صفوف المسلمين، ويستطرد إلى النفاق والحدود والحجاب والعلم وغيرها. والعنوان والأحكام فيها للمتكلم."
  en: "A four-episode series by Omar Abdelkafy on the Assabile archive, titled 'Enemies of Islam', in which he speaks of those he regards as enemies of Islam from within the ranks of Muslims, with digressions on hypocrisy, the hadd penalties, the hijab, knowledge and more. The title and the judgements are the speaker's."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا چار اقساط کا سلسلہ، جس کا عنوان «اعداء الاسلام» ہے؛ اس میں وہ ان لوگوں کی بات کرتے ہیں جنہیں وہ مسلمانوں کی صفوں کے اندر سے اسلام کا دشمن سمجھتے ہیں، اور نفاق، حدود، حجاب، علم وغیرہ پر بھی گفتگو کرتے ہیں۔ عنوان اور احکام متکلم کے ہیں۔"
