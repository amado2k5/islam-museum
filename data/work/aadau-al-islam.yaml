summary:
  ar: "سلسلة من أربع حلقات لعمر عبد الكافي في أرشيف أسابيل، عنوانها «أعداء الإسلام»، يتحدث فيها عمّن يعدّهم أعداءً للإسلام من داخل صفوف المسلمين، ويستطرد إلى النفاق والحدود والحجاب والعلم وغيرها. والعنوان والأحكام فيها للمتكلم."
  en: "A four-episode series by Omar Abdelkafy on the Assabile archive, titled 'Enemies of Islam', in which he speaks of those he regards as enemies of Islam from within the ranks of Muslims, with digressions on hypocrisy, the hadd penalties, the hijab, knowledge and more. The title and the judgements are the speaker's."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا چار اقساط کا سلسلہ، جس کا عنوان «اعداء الاسلام» ہے؛ اس میں وہ ان لوگوں کی بات کرتے ہیں جنہیں وہ مسلمانوں کی صفوں کے اندر سے اسلام کا دشمن سمجھتے ہیں، اور نفاق، حدود، حجاب، علم وغیرہ پر بھی گفتگو کرتے ہیں۔ عنوان اور احکام متکلم کے ہیں۔"
  es: "Serie de cuatro episodios de Omar Abdelkafy en el archivo de Assabile, titulada «Enemigos del Islam», en la que habla de aquellos a quienes considera enemigos del Islam dentro de las filas musulmanas, con digresiones sobre la hipocresía, las penas hadd, el hiyab, el conocimiento y otros temas. El título y los juicios son del propio autor."
  fr: "Une série en quatre épisodes d'Omar Abdelkafy, disponible sur les archives d'Assabile et intitulée « Ennemis de l'Islam », dans laquelle il dénonce ceux qu'il considère comme des ennemis de l'Islam au sein même de la communauté musulmane, avec des digressions sur l'hypocrisie, la peine du hadd, le hijab, le savoir et d'autres sujets. Le titre et les jugements sont de son propre fait."
  tr: "Asabel arşivinde Omar Abdelkafi'nin \"İslam'ın Düşmanları\" başlıklı dört bölümlük serisi, Müslümanlar arasından İslam'ın düşmanı olarak gördüğü kişileri tartışır ve ikiyüzlülük, hudud, başörtüsü, bilgi ve daha fazlasını kapsar. Başlık ve kararlar konuşmacı içindir."
  id: "Serangkaian empat episode oleh Omar Abdelkafi di arsip Asabel, berjudul \"Musuh Islam,\" di mana ia membahas mereka yang ia anggap musuh Islam dari dalam kalangan Muslim, dan meluas ke kemunafikan, hudud, hijab, pengetahuan, dan lainnya. Judul dan putusan ini untuk pembicara."
