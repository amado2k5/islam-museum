label: { ar: "قرار مجمع الفقه الإسلامي الدولي 151 (16/9) بشأن رعاية الأقليات المسلمة", en: "IIFA resolution 151 (16/9) on the care of Muslim minorities", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 151 (16/9): مسلم اقلیتوں کی دیکھ بھال", es: "Resolución 151 (16/9) de la IIFA sobre la atención a las minorías musulmanas", fr: "Résolution 151 (16/9) de l'IIFA relative à la prise en charge des minorités musulmanes", tr: "Müslüman azınlıkların bakımına ilişkin Uluslararası İslami Fiqh Akademisi Kararı 151 (16/9)", id: "Resolusi Akademi Fiqh Islam Internasional 151 (16/9) mengenai perawatan minoritas Muslim" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. قرر: استبعاد تسمية الوجود خارج العالم الإسلامي بـ«الأقليات» أو «الجاليات» لأنها مصطلحات قانونية لا تعبر عن حقيقة الوجود الإسلامي المتصف بالشمولية والأصالة والاستقرار والتعايش، والتسميات المناسبة مثل «المسلمون في الغرب» أو «المسلمون خارج العالم الإسلامي»؛ واتخاذ الوسائل للحفاظ على الوجود الإسلامي والدفاع عن خصوصياته الدينية والحضارية والثقافية؛ وأن مقتضيات المواطنة في الغرب لا تتنافى مع المحافظة على الهوية الإسلامية والالتزام بالقيم. وأوصى بإنشاء مركز علمي بحثي يعنى بأوضاع المسلمين خارج العالم الإسلامي وبسياسات دمج تحفظ الهوية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). It resolved: abandoning the labels 'minorities' and 'expatriate communities' for Muslim presence outside the Muslim world, as legal terms that do not express its reality of rootedness, stability and coexistence — proper terms being 'Muslims in the West' or 'Muslims outside the Muslim world'; taking the means to preserve that presence and defend its religious, civilisational and cultural distinctiveness; and holding that the requirements of Western citizenship do not conflict with preserving Islamic identity and values. It recommended establishing a research centre devoted to Muslims outside the Muslim world and integration policies that safeguard identity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ فیصلے: غیر اسلامی دنیا میں مسلم موجودگی کے لیے 'اقلیتیں' یا 'جالیاں' کے بجائے 'مغرب کے مسلمان' یا 'اسلامی دنیا سے باہر کے مسلمان' جیسے نام استعمال کیے جائیں کیونکہ پہلے اصطلاحات قانونی ہیں اور اس موجودگی کی اصالت، استقرار اور بقائے باہمی کی حقیقت بیان نہیں کرتیں؛ اس موجودگی کے بقا اور اس کی مذہبی، تہذیبی و ثقافتی مخصوصیت کے دفاع کے ذرائع اختیار کیے جائیں؛ اور مغربی شہریت کے تقاضے اسلامی شناخت اور اقدار کی حفاظت سے متصادم نہیں۔ سفارش: غیر اسلامی دنیا کے مسلمانوں کے حالات کے لیے ایک تحقیقی مرکز کا قیام اور شناخت محفوظ رکھنے والی انضمامی پالیسیاں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión celebrada en Dubái (30 de Safar – 5 de Rabi al-Awwal de 1426, del 9 al 14 de abril de 2005). En ella se resolvió: abandonar las denominaciones de «minorías» y «comunidades de expatriados» para referirse a la presencia musulmana fuera del mundo musulmán, por considerarlas términos jurídicos que no reflejan su arraigo, estabilidad y coexistencia —siendo los términos más apropiados «musulmanes en Occidente» o «musulmanes fuera del mundo musulmán»—; adoptar las medidas necesarias para preservar dicha presencia y defender su singularidad religiosa, civilizatoria y cultural; y sostener que las exigencias de la ciudadanía occidental no entran en conflicto con la preservación de la identidad y los valores islámicos. Se recomendó la creación de un centro de investigación dedicado a los musulmanes fuera del mundo musulmán y la implementación de políticas de integración que salvaguarden su identidad."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 16e session à Dubaï (30 Safar – 5 Rabi al-Awwal 1426, soit du 9 au 14 avril 2005). Il a été décidé: d'abandonner les termes « minorités » et « communautés expatriées » pour désigner la présence musulmane hors du monde musulman, car ces termes juridiques ne rendent pas compte de sa réalité d'enracinement, de stabilité et de coexistence – les termes appropriés étant « musulmans en Occident » ou « musulmans hors du monde musulman »; de prendre les mesures nécessaires pour préserver cette présence et défendre sa spécificité religieuse, civilisationnelle et culturelle; et de considérer que les exigences de la citoyenneté occidentale ne sont pas incompatibles avec la préservation de l'identité et des valeurs islamiques. L'Académie a recommandé la création d'un centre de recherche consacré aux musulmans hors du monde musulman et l'élaboration de politiques d'intégration qui préservent leur identité."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (30 Safar – 5 Rabi'al-Awwal 1426 H, 9–14 Nisan 2005) toplu kararı. Kararlaştırıldı: İslam dünyası dışındaki 'azınlıklar' veya 'topluluklar' terimlerinin dışlanması; çünkü bunlar kapsayıcılık, özgünlük, istikrar ve bir arada yaşama ile karakterize edilen İslami bir varoluşun gerçekliğini yansıtmayan hukuki terimler ve 'Batı'daki Müslümanlar' veya 'İslam dünyası dışındaki Müslümanlar' gibi uygun isimler; İslami varoluşu korumak ve dini, medeniyetsel ve kültürel özelliklerini savunmak için önlemler alınması; Batı'daki vatandaşlık gerekliliklerinin İslami kimliğin korunması ve değerlere bağlılıkla çelişmemesi tavsiye edildi. İslam dünyası dışındaki Müslümanların koşulları ve kimliği koruyan politikalarla ilgilenen bir bilimsel araştırma merkezi kurulmasını tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi keenam belas di Dubai (30 Safar – 5 Rabi al-Awwal 1426 H, 9–14 April 2005 M). Diputuskan: Untuk mengecualikan istilah 'minoritas' atau 'komunitas' di luar dunia Islam karena istilah tersebut tidak mencerminkan realitas eksistensi Islam yang ditandai dengan inklusivitas, keaslian, stabilitas, dan koeksistensi, serta nama yang sesuai seperti 'Muslim di Barat' atau 'Muslim di luar dunia Islam'; dan mengambil langkah-langkah untuk melestarikan eksistensi Islam dan mempertahankan keunikan agama, peradaban, dan budayanya; dan bahwa persyaratan kewarganegaraan di Barat tidak bertentangan dengan pelestarian identitas Islam dan kepatuhan pada nilai-nilai. Laporan ini merekomendasikan pembentukan pusat penelitian ilmiah yang memperhatikan kondisi Muslim di luar dunia Islam dan kebijakan yang menjaga identitas."
