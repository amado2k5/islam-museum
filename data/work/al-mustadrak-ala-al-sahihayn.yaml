genre: [hadith]
summary:
  ar: "كتاب الحاكم النيسابوري (ت 405هـ) جمع فيه بأسانيده أحاديث رأى أن الشيخين البخاري ومسلماً احتجا بمثل رواتها ولم يخرجاها، وأملى خطبته يوم الاثنين السابع من المحرم سنة 373هـ ردّاً على من زعم أن الصحيح لا يبلغ عشرة آلاف حديث {cite:mustadrak-haramayn-1997-v1 p. 39-40}؛ رتّبه على الكتب، ومنها كتاب الهجرة والمغازي والسرايا ومعرفة الصحابة {cite:mustadrak-ilmiyya-ata-v3 p. 3}. وأخذ عليه أهل الحديث تساهله في التصحيح، فقدّر الذهبي أن ما على شرطهما أو شرط أحدهما نحو الثلث، وأن فيه نحو مائة حديث يحكم ببطلانها، ثم اختصره في «تلخيص المستدرك» {cite:mustadrak-haramayn-1997-v1 p. 9}."
  en: "Al-Hakim al-Naysaburi's (d. 405 AH) collection, with his own chains, of hadiths whose narrators he held to be of the kind al-Bukhari and Muslim relied on but which they had not included; he dictated its preface on Monday 7 Muharram 373 AH in answer to those who claimed that sound hadith did not reach ten thousand {cite:mustadrak-haramayn-1997-v1 p. 39-40}. It is arranged in books, among them the Hijra, the Campaigns and Expeditions and the Knowledge of the Companions {cite:mustadrak-ilmiyya-ata-v3 p. 3}. Hadith scholars faulted its laxity: al-Dhahabi estimated that about a third meets the two masters' conditions or one of them and that some hundred hadiths are false, and he abridged it in his Talkhis al-Mustadrak {cite:mustadrak-haramayn-1997-v1 p. 9}."
  ur: "حاکم نیشاپوری (وفات 405ھ) کی کتاب جس میں انہوں نے اپنی اسانید سے وہ احادیث جمع کیں جن کے راویوں جیسے راویوں سے ان کے نزدیک بخاری اور مسلم نے حجت پکڑی مگر انہیں درج نہیں کیا؛ انہوں نے اس کا خطبہ پیر 7 محرم 373ھ کو املا کرایا، ان لوگوں کے جواب میں جو کہتے تھے کہ صحیح حدیث دس ہزار تک نہیں پہنچتی {cite:mustadrak-haramayn-1997-v1 p. 39-40}۔ یہ کتابوں پر مرتب ہے، جن میں کتاب الہجرۃ، المغازی والسرایا اور معرفۃ الصحابہ ہیں {cite:mustadrak-ilmiyya-ata-v3 p. 3}۔ محدثین نے تصحیح میں اس کے تساہل پر گرفت کی: ذہبی کے اندازے میں تقریباً ایک تہائی شیخین یا ان میں سے ایک کی شرط پر ہے اور تقریباً سو احادیث باطل ہیں، اور انہوں نے اسے «تلخیص المستدرک» میں مختصر کیا {cite:mustadrak-haramayn-1997-v1 p. 9}۔"
