label: { ar: "المستدرك على الصحيحين", en: "al-Mustadrak 'ala al-Sahihayn", ur: "المستدرک علی الصحیحین" }
summary:
  ar: "كتاب الحاكم النيسابوري جمع فيه أحاديث زعم أنها صحاح على شرط الشيخين أو أحدهما مما لم يخرجاه، فأنكر عليه أصحاب الحديث في بعضه؛ وصفه الذهبي بأنه أشهر تفرداته مع «تاريخ النيسابوريين» و«المدخل إلى علم الصحيح»، ونقد فيه أشياء، وطبع بحيدرآباد ١٣٣٤-١٣٤٢هـ {cite:tarikh-islam-dhahabi pp. 127-128} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 90-91} {cite:wafayat-ayan}."
  en: "Al-Hakim al-Nisaburi's collection of hadiths he held to be sound on the criteria of al-Bukhari and Muslim or one of them yet not included in their Sahihs; the hadith scholars objected to some of its inclusions and al-Dhahabi noted errors in it, yet it remains his most famous work alongside Tarikh al-Naysaburiyyin and al-Madkhal; printed at Haydarabad 1334-42 {cite:tarikh-islam-dhahabi pp. 127-128} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 90-91} {cite:wafayat-ayan}."
  ur: "حاکم نیشاپوری کی وہ کتاب جس میں انہوں نے وہ احادیث جمع کیں جنہیں ان کے نزدیک صحیحین یا ان میں سے ایک کی شرط پر صحیح تھا مگر دونوں نے نہیں نکالی؛ محدثین نے بعض پر اعتراض کیا اور ذہبی نے اس میں خطائیں بیان کیں، مگر یہ ان کی مشہور ترین تصانیف میں ہے؛ حیدرآباد سے 1334-42ھ میں مطبوع {cite:tarikh-islam-dhahabi pp. 127-128} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 90-91} {cite:wafayat-ayan}۔"
