summary:
  ar: "كتاب في مناقب أصحاب النبي جمعه الإمام أحمد بن حنبل ⁦(ت 241هـ)⁩، ورواه عنه ابنه عبد الله وزاد فيه عن شيوخه، ثم زاد فيه أبو بكر القطيعي ⁦(ت 368هـ)⁩؛ يبدأ بالنهي عن سب الصحابة ثم يسوق فضائل أبي بكر وعمر وعثمان وعلي وبقية العشرة وأهل البيت والأنصار وطائفة من الصحابة والقبائل، في 1962 رواية مرقمة في طبعة وصي الله عباس، ويقوم على نسخة خطية فريدة في مكتبة جامع يني بإسطنبول."
  en: "A book of the merits of the Prophet's Companions compiled by Ahmad ibn Hanbal (d. 241 AH), transmitted by his son Abd Allah with additions from his own teachers and further additions by Abu Bakr al-Qati'i (d. 368 AH). It opens with the prohibition of reviling the Companions, then gives the merits of Abu Bakr, Umar, Uthman, Ali, the rest of the Ten, the Prophet's household, the Ansar and many other Companions and tribes — 1,962 numbered narrations in Wasi Allah Abbas's edition, which rests on a unique manuscript in the Yeni Cami library, Istanbul."
  es: "Un libro sobre los méritos de los Compañeros del Profeta, compilado por Ahmad ibn Hanbal (fallecido en el año 241 de la Hégira), transmitido por su hijo Abd Allah con aportaciones de sus maestros y nuevas adiciones de Abu Bakr al-Qati'i (fallecido en el año 368 de la Hégira). Comienza con la prohibición de insultar a los Compañeros, y luego enumera los méritos de Abu Bakr, Umar, Uthman, Ali, el resto de los Diez, la familia del Profeta, los Ansar y muchos otros Compañeros y tribus: 1962 narraciones numeradas en la edición de Wasi Allah Abbas, que se basa en un manuscrito único en la biblioteca de Yeni Cami, Estambul."
  fr: "Un livre recensant les mérites des Compagnons du Prophète, compilé par Ahmad ibn Hanbal (mort en 241 AH), transmis par son fils Abd Allah et enrichi de contributions de ses propres maîtres et d'Abu Bakr al-Qati'i (mort en 368 AH). Il s'ouvre sur l'interdiction d'injurier les Compagnons, puis énumère les mérites d'Abu Bakr, d'Umar, d'Uthman, d'Ali, des autres membres du Groupe des Dix, de la famille du Prophète, des Ansar et de nombreux autres Compagnons et tribus – 1 962 récits numérotés dans l'édition de Wasi Allah Abbas, fondée sur un manuscrit unique conservé à la bibliothèque Yeni Cami d'Istanbul."
  ur: "اصحابِ رسول کی فضیلت کی ایک کتاب جو احمد بن حنبل ⁦(متوفی 241ھ)⁩ نے مرتب کی ہے، جسے ان کے بیٹے عبد اللہ نے اپنے اساتذہ کے اضافے کے ساتھ اور ابوبکر القطیٰ ⁦(متوفی 368ھ)⁩ کے مزید اضافے کے ساتھ منتقل کیا ہے۔ اس کا آغاز صحابہ کو گالی دینے کی ممانعت سے ہوتا ہے، پھر ابوبکر، عمر، عثمان، علی، بقیہ عشرہ، آلِ رسول، انصار اور بہت سے دوسرے صحابہ و قبائل کی فضیلت بیان کرتا ہے - وصی اللہ عباس کے ایڈیشن میں 1,962 عدد روایات، جو کہ ایک منفرد منقول کتاب لِیَنْبُوْلُمَیْنَۃ میں موجود ہیں۔"
  tr: "İmam Ahmed bin Hanbal (ö. 241 H) tarafından derlenen Peygamber'in sahabelerinin erdemleri üzerine bir kitap, oğlu Abdullah tarafından kendisinden rivayet edilmiştir ve öğretmenlerinden eklenmiş bir kitaptır. Sonra Ebu Bekir el-Kutai'i (ö. 368 Hicri) buna katkıda bulunmuştur; önce sahabelere lanetlemeyi yasaklamış, ardından Ebu Bekir, Ömer, Osman Usman, Ali, diğer Onlar, Ehl-el-Beyt, Ensar ve bir grup Sahabe ile aşiretlerin erdemlerini sunmuştur. 1962'de Wasiullah Abbas'ın baskısında bir rivayet numaralandırılmış ve İstanbul'daki Yeni Camii kütüphanesindeki benzersiz bir el yazmasına dayanmaktadır."
  id: "Sebuah buku tentang kebajikan para sahabat Nabi, disusun oleh Imam Ahmad ibn Hanbal (wafat 241 H), yang diceritakan darinya oleh putranya Abdullah, yang menambahkan dari para gurunya. Kemudian Abu Bakr al-Qutai'i (wafat 368 H) menambahkannya; ia memulai dengan melarang mengutuk para Sahabat, kemudian mempersembahkan kebajikan Abu Bakr, Umar, Uthman, Ali, Sepuluh, Ahl al-Bayt, Ansar, dan sekelompok Sahabat serta suku. Pada tahun 1962, sebuah riwayat dimasukkan dalam edisi Wasiullah Abbas, dan didasarkan pada manuskrip unik di perpustakaan Masjid Yeni di Istanbul."
