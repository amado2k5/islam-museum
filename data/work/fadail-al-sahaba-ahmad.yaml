label: { ar: "فضائل الصحابة", en: "Fada'il al-Sahaba" }
summary:
  ar: "كتاب في مناقب أصحاب النبي جمعه الإمام أحمد بن حنبل (ت 241هـ)، ورواه عنه ابنه عبد الله وزاد فيه عن شيوخه، ثم زاد فيه أبو بكر القطيعي (ت 368هـ)؛ يبدأ بالنهي عن سب الصحابة ثم يسوق فضائل أبي بكر وعمر وعثمان وعلي وبقية العشرة وأهل البيت والأنصار وطائفة من الصحابة والقبائل، في 1962 رواية مرقمة في طبعة وصي الله عباس، ويقوم على نسخة خطية فريدة في مكتبة جامع يني بإسطنبول."
  en: "A book of the merits of the Prophet's Companions compiled by Ahmad ibn Hanbal (d. 241 AH), transmitted by his son Abd Allah with additions from his own teachers and further additions by Abu Bakr al-Qati'i (d. 368 AH). It opens with the prohibition of reviling the Companions, then gives the merits of Abu Bakr, Umar, Uthman, Ali, the rest of the Ten, the Prophet's household, the Ansar and many other Companions and tribes — 1,962 numbered narrations in Wasi Allah Abbas's edition, which rests on a unique manuscript in the Yeni Cami library, Istanbul."
