structure: "مقدمة المحقق في أربعة فصول (تعريف الصحابي وعدالتهم ص11–19؛ المؤلفات في الصحابة ص21–24؛ ترجمة أحمد ومؤلفاته ص25–32؛ وصف النسخة ونسبتها وعمل المحقق ص33–47)، ثم المتن: النهي عن سب الصحابة (ص55–76)، فضائل أبي بكر (76)، قول علي «خير هذه الأمة بعد نبيها أبو بكر وعمر» (90)، حديث الخلة (117)، «مروا أبا بكر فليصل بالناس» (129–274)، أول من أسلم (274)، فضائل عمر (299) وإسلامه (339)، باب خير هذه الأمة بعد نبيها (367)، زيادات القطيعي في عمر وأبي بكر (409)، فضائل عثمان (547)، أخبار علي ونسبه واسم أمه وفضائله (648–908)، عبد الرحمن بن عوف (908)، الزبير (914)، أبو عبيدة (922)، طلحة (928)، سعد بن أبي وقاص (935)، فاطمة (944)، الحسن والحسين (960)، الأنصار (993)، خالد بن الوليد (1024)، سعد بن معاذ (1029)، حارثة بن النعمان (1041)، صهيب (1043)، العرب، أسامة بن زيد (1052)، ابن مسعود (1056)، ابن عباس (1066)، خديجة وغيرها (1069)، عمار (1082)، أهل اليمن (1088)، عائشة (1097)، غفار وأسلم (1114)، جعفر (1125)، جرير بن عبد الله (1127)، ابن عمر (1130)، قوم من أهل الشام (1133)، أصحاب النبي (1148)، عمرو بن العاص (1152)، معاوية (1155)، العباس (1159)، عبد الله بن عباس (1203–1256)؛ ثم السماعات (1257–1261) والفهارس (1265–1383)."
