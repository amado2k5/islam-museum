label: { ar: "حكم الإكثار من الصوم في شهر شعبان", en: "Increasing fasting in the month of Sha'ban", ur: "شعبان میں کثرت سے روزے رکھنے کا حکم" }
summary:
  ar: "سائل سأل عن حكم الإكثار من الصوم في شعبان. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22462)⁩ أن شهر شعبان من الشهور التي اختصها الله بمزيد عناية وشرفها بعلو المنزلة وسمو المكانة، وأنه يستحب الإكثار فيه من الصوم استعدادًا لرمضان على ما فصّل الجواب."
  en: "A questioner asked the ruling on increasing fasting in Sha'ban. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22462) answered that Sha'ban is among the months God singled out for special care and honoured with lofty rank, and that it is recommended to fast abundantly in it as preparation for Ramadan — as the answer details."
  ur: "ایک سائل نے شعبان میں کثرت سے روزے رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22462)⁩ نے جواب دیا کہ شعبان ان مہینوں میں ہے جنہیں اللہ نے خاص توجہ دی اور بلند مرتبے سے سرفراز کیا، اور اس میں رمضان کی تیاری کے طور پر کثرت سے روزے رکھنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
