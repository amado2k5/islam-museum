label: { ar: "قصيدة المتنبي «بم التعلل لا أهل ولا وطن»", en: "Al-Mutanabbi's ode 'With what can I console myself, with no family and no homeland?'", es: "La oda de Al-Mutanabbi: \"¿Con qué puedo consolarme, sin familia ni patria?\"", fr: "L'ode d'Al-Mutanabbi: « Avec quoi puis-je me consoler, sans famille ni patrie ? »", ur: "المتنبی کا شعر 'میں اپنے آپ کو کس چیز سے تسلی دے سکتا ہوں، جس میں نہ کوئی خاندان ہے اور نہ ہی کوئی وطن؟'" }
summary:
  ar: "قصيدة من البسيط على روي النون؛ يقدّم لها الديوان بأنه اتصل بالمتنبي أن قوماً نعوه في مجلس سيف الدولة بحلب فقال هذه القصيدة، ولم ينشدها كافوراً {{cite:diwan-mutanabbi-dar-beirut-1983 p.471}}."
  en: "An ode in the basit metre on the rhyme nun; the edition introduces it with the report that it reached the poet that some people had announced his death in Sayf al-Dawla's assembly at Aleppo, and that he did not recite it to Kafur {{cite:diwan-mutanabbi-dar-beirut-1983 p.471}}."
  es: "Una oda en metro basit sobre la rima nun; la edición la introduce con el informe de que llegó a oídos del poeta que algunas personas habían anunciado su muerte en la asamblea de Sayf al-Dawla en Alepo, y que no se la recitó a Kafur {{cite:diwan-mutanabbi-dar-beirut-1983 p.471}}."
  fr: "Une ode en mètre basit sur la rime nun; l'édition l'introduit avec le rapport selon lequel il est parvenu au poète que certaines personnes avaient annoncé sa mort dans l'assemblée de Sayf al-Dawla à Alep, et qu'il ne l'a pas récitée à Kafur {{cite:diwan-mutanabbi-dar-beirut-1983 p.471}}."
  ur: "شاعری نون پر باسط میٹر میں ایک اوڈ؛ ایڈیشن میں اس کا تعارف اس رپورٹ کے ساتھ کیا گیا ہے کہ شاعر تک یہ بات پہنچی کہ حلب میں سیف الدولہ کی مجلس میں کچھ لوگوں نے اس کی موت کا اعلان کیا تھا اور اس نے اسے کافور کو نہیں سنایا تھا۔"
