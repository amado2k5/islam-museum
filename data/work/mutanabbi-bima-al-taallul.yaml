label: { ar: "قصيدة المتنبي «بم التعلل لا أهل ولا وطن»", en: "Al-Mutanabbi's ode 'With what can I console myself, with no family and no homeland?'" }
summary:
  ar: "قصيدة من البسيط على روي النون؛ يقدّم لها الديوان بأنه اتصل بالمتنبي أن قوماً نعوه في مجلس سيف الدولة بحلب فقال هذه القصيدة، ولم ينشدها كافوراً {{cite:diwan-mutanabbi-dar-beirut-1983 p.471}}."
  en: "An ode in the basit metre on the rhyme nun; the edition introduces it with the report that it reached the poet that some people had announced his death in Sayf al-Dawla's assembly at Aleppo, and that he did not recite it to Kafur {{cite:diwan-mutanabbi-dar-beirut-1983 p.471}}."
