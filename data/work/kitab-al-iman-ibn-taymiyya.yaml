summary:
  ar: "كتاب لابن تيمية (ت 728هـ) في حقيقة الإيمان والإسلام، يعرف بكتاب الإيمان الكبير، وهو أول المجلد السابع من مجموع الفتاوى؛ يقدم فيه دلالة الكتاب والسنة على مسمى الإيمان، ويرى أن الإيمان المطلق يستلزم الأعمال وأنه يزيد وينقص، ويرد على المرجئة والجهمية ومن نصر قول جهم في الإيمان، ويفصّل الأقوال في الاستثناء في الإيمان."
  en: "A book by Ibn Taymiyya (d. 728 AH) on the reality of faith (iman) and submission (islam), known as Kitab al-Iman al-Kabir and opening volume 7 of Majmu' al-Fatawa. It sets out what the Qur'an and Sunna show the term 'faith' to cover, holds that unqualified faith entails deeds and that faith increases and decreases, answers the Murji'a, the Jahmiyya and those who championed Jahm's view of faith, and details the views on the 'exception' in faith."
