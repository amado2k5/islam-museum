structure: "Opening on faith and islam and the method of starting from the texts (scan p. 11); sections on disputed hadiths, on the terms 'righteous', 'martyr' and 'truthful', 'righteousness' and 'corruption', 'wickedness' and 'unbelief', and 'wronging oneself' when used alone or together; that al-Ash'ari championed Jahm's view of faith; that unqualified faith entails deeds; what faith means when joined with islam or with good deeds; conjunction implying difference; faith as righteousness (birr); the Murji'a's claim that faith in the heart is assent only; how the increase of faith is known; islam without iman in the Qur'an; Muhammad ibn Nasr's arguments; the hadith of Jibril on islam, iman and ihsan; the disputes over the names 'believer' and 'faith'; and the views on the exception in faith (contents, scan pp. 423–429). Kitab al-Iman al-Awsat follows in the same volume (contents p. 429ff.)."
