summary:
  ar: "كتاب لابن تيمية ⁦(ت 728هـ)⁩ في حقيقة الإيمان والإسلام، يعرف بكتاب الإيمان الكبير، وهو أول المجلد السابع من مجموع الفتاوى؛ يقدم فيه دلالة الكتاب والسنة على مسمى الإيمان، ويرى أن الإيمان المطلق يستلزم الأعمال وأنه يزيد وينقص، ويرد على المرجئة والجهمية ومن نصر قول جهم في الإيمان، ويفصّل الأقوال في الاستثناء في الإيمان."
  en: "A book by Ibn Taymiyya (d. 728 AH) on the reality of faith (iman) and submission (islam), known as Kitab al-Iman al-Kabir and opening volume 7 of Majmu' al-Fatawa. It sets out what the Qur'an and Sunna show the term 'faith' to cover, holds that unqualified faith entails deeds and that faith increases and decreases, answers the Murji'a, the Jahmiyya and those who championed Jahm's view of faith, and details the views on the 'exception' in faith."
  es: "Un libro de Ibn Taymiyya (fallecido en 728 AH) sobre la realidad de la fe (iman) y la sumisión (islam), conocido como Kitab al-Iman al-Kabir y primer volumen 7 de Majmu' al-Fatawa. En él se expone lo que el Corán y la Sunna muestran que abarca el término \"fe\", se sostiene que la fe incondicional implica obras y que la fe aumenta y disminuye, se responde a los Murji'a, los Jahmiyya y a quienes defendieron la visión de Jahm sobre la fe, y se detallan las opiniones sobre la \"excepción\" en la fe."
  fr: "Un ouvrage d'Ibn Taymiyya (mort en 728 AH) sur la réalité de la foi (iman) et de la soumission (islam), connu sous le nom de Kitab al-Iman al-Kabir et constituant le premier volume 7 de Majmu' al-Fatawa. Il expose la définition du terme « foi » selon le Coran et la Sunna, affirme que la foi absolue implique des actes et que la foi peut croître et décroître, réfute les arguments des Murji'a, des Jahmiyya et des partisans de la conception jahmiyya de la foi, et détaille les points de vue relatifs à l'« exception » en matière de foi."
  ur: "ایمان ⁦(ایمان)⁩ اور تسلیم ⁦(اسلام)⁩ کی حقیقت پر ابن تیمیہ ⁦(متوفی 728ھ)⁩ کی ایک کتاب، جسے کتاب الایمان الکبیر کہا جاتا ہے اور مجمع الفتاوی کی ابتدائی جلد 7۔ یہ اس بات کا تعین کرتا ہے کہ قرآن و سنت نے 'ایمان' کی اصطلاح کا احاطہ کیا ہے، یہ کہتا ہے کہ غیر مستثنیٰ ایمان اعمال کو شامل کرتا ہے اور یہ ایمان بڑھتا اور گھٹتا ہے، مرجع، جہمیہ اور ان لوگوں کا جواب دیتا ہے جنہوں نے عقیدے کے بارے میں جہم کے نظریے کی حمایت کی، اور ایمان میں 'استثنیٰ' کے بارے میں خیالات کی تفصیلات بیان کیں۔"
