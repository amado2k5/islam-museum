label: { ar: "تهنئة اللاعبين غير المسلمين والولاء والبراء", en: "Congratulating non-Muslim players and loyalty-and-disavowal", ur: "غیر مسلم کھلاڑیوں کی مبارکباد اور ولایت و براءت" }
summary:
  ar: "سأل سائل هل تهنئة لاعبي كرة القدم المسلمين زملاءهم الأجانب الكفار عند تسجيل الهدف ونحوها تخدش الولاء والبراء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84561 بتاريخ 29 مايو 2011)⁩ أنه لا حرج في تهنئة غير المسلم بنعمة تجددت له وهذا من جملة البر والقسط الذي أمرنا به في التعامل مع المسالمين لأهل الإسلام من غير المسلمين لقوله تعالى لا ينهاكم الله عن الذين لم يقاتلوكم في الدين أن تبروهم وتقسطوا إليهم."
  en: "A questioner asked whether Muslim footballers congratulating their non-Muslim teammates on a goal and the like mars loyalty and disavowal. Dr. Salah al-Sawi (fatwa no. 84561, 29 May 2011) answered that congratulating a non-Muslim on a renewed blessing is unobjectionable — it belongs to the kindness and equity commanded toward peaceable non-Muslims, per the verse that God does not forbid you from those who neither fought you in religion nor expelled you from your homes, that you show them kindness and deal justly."
  ur: "ایک سائل نے پوچھا کہ غیر مسلم ساتھی کھلاڑیوں کو گول پر مبارکباد ولایت و براءت کو نقصان پہنچاتی ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84561، 29 مئی 2011)⁩ کے مطابق نعمت پر مبارکباد جائز ہے — یہ مسالموں سے بر و قسط میں داخل ہے۔"
