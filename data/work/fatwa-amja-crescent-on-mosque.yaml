id: work/fatwa-amja-crescent-on-mosque
class: work
kind: fatwa
label: { ar: "تعليق الهلال على المساجد", en: "Hanging the crescent on mosques", ur: "مسجدوں پر ہلال لگانا", es: "Colgar la media luna en las mezquitas", fr: "Accrocher le croissant sur les mosquées", tr: "Hilalin camiler üzerine yorumu", id: "Komentar bulan sabit tentang masjid" }
summary:
  ar: "سأل سائل عن حكم تعليق الهلال على بعض المساجد. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79136 بتاريخ 9 يونيو 2009)⁩ أن الأصل في العبادات التوقيف، وتعليق الهلال على بعض المساجد من أمور العادات وليس من أمور العبادات، والأمر في باب العادات واسع لأن الأصل فيها الحل حتى يأتي ما يدل على المنع."
  en: "A questioner asked about hanging the crescent on some mosques. Dr. Salah al-Sawi (fatwa no. 79136, 9 June 2009) answered that the default in worship-acts is restriction to the text, while hanging the crescent on mosques is among customary matters not worship — and the custom-chapter is wide, its default being permission until a proof of prohibition comes."
  ur: "ایک سائل نے مسجدوں پر ہلال لٹکانے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79136، 9 جون 2009)⁩ کے مطابق یہ عبادات نہیں بلکہ عادات میں سے ہے اور عادات میں اصل اباحت ہے۔"
  es: "Un consultante preguntó sobre la práctica de colgar la media luna en algunas mezquitas. El Dr. Salah al-Sawi (fatwa n.° 79136, 9 de junio de 2009) respondió que, por defecto, en los actos de culto se aplica la restricción al texto sagrado, mientras que colgar la media luna en las mezquitas es una práctica consuetudinaria que no constituye culto. Además, el capítulo sobre costumbres es amplio, y por defecto se permite hasta que se presente una prueba de prohibición."
  fr: "Un internaute a posé une question concernant l'affichage du croissant de lune sur certaines mosquées. Le Dr Salah al-Sawi (fatwa n° 79136, 9 juin 2009) a répondu que, par défaut, les actes de culte sont régis par le texte sacré, tandis que l'affichage du croissant de lune sur les mosquées relève des coutumes et non du culte. Or, la notion de coutume est large, et par défaut, elle est permise jusqu'à preuve du contraire."
  tr: "Bir soru soran kişi, bazı camilerde hilal halali hakkındaki kararı sordu. Dr. Salah Al-Sawy (9 Haziran 2009 tarihli 79136 sayılı fetva) ibadet işlemlerinde varsayılan olarak askıya almak (durdurmak) olduğunu ve hilal asmanın bazı camilere bir adet meselesi olduğunu, ibadet eylemi değil olduğunu yanıtladı. Gelenekler bölümündeki konu geniştir çünkü varsayılan olarak bir şey yasak gösterene kadar kabul edilebilirliktir."
  id: "Seorang penanya menanyakan tentang aturan halal bulan sabit di beberapa masjid. Dr. Salah Al-Sawy menjawab (Fatwa No. 79136 tanggal 9 Juni 2009) bahwa default dalam ibadah adalah menangguhkan (berhenti), dan menggantung bulan sabit di beberapa masjid adalah urusan adat, bukan tindakan ibadah. Masalah dalam bab adat istiadat ini luas karena standar adalah diperbolehkan sampai ada yang menunjukkan larangan."
