label: { ar: "سجل عثماني (سجلّي عثماني)", en: "Sicill-i Osmani" }
summary:
  ar: "معجم تراجم عثماني بالتركية العثمانية لمحمد ثريا بك (1845–1909م)، عنوانه الكامل «سجل عثماني أو تذكرة مشاهير عثمانية»، طُبع في المطبعة العامرة بإسطنبول في أربعة مجلدات مجموعها 2420 صفحة بين 1308هـ ونحو 1316هـ، ويضم نحو 17000 ترجمة لرجال الدولة العثمانية من أهل القصر والعلمية والقلمية والملكية والسيفية، ثم الشعراء والخطاطين وشيوخ الطرق. أعادت نشره بالحروف اللاتينية مؤسسة التاريخ (Tarih Vakfı Yurt Yayınları) سنة 1996 بإعداد نوري أكبايار ونقل سيد علي قهرمان {cite:sicill-i-osmani vol. 1 PDF p. 1-9}."
  en: "An Ottoman Turkish biographical register by Mehmed Süreyya Bey (1845–1909), in full Sicill-i Osmani yahut Tezkire-i Meşahir-i Osmaniye, printed at the Matbaa-i Amire in Istanbul in four volumes totalling 2,420 pages between 1308 AH and about 1316 AH, with some 17,000 biographies, chiefly of the palace, the learned, scribal, civil and military establishments, then poets, calligraphers and Sufi shaykhs. The Tarih Vakfı Yurt Yayınları republished it in Latin script in 1996, prepared by Nuri Akbayar and transcribed by Seyit Ali Kahraman."
