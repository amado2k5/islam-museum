id: work/fatwa-amja-eid-prayer-at-home-covid
class: work
kind: fatwa
label: { ar: "صلاة العيد في البيت", en: "Performing the Eid prayer at home during the COVID crisis", ur: "گھر میں عید نماز — کورونا", es: "Realizar la oración del Eid en casa durante la crisis de la COVID.", fr: "Accomplir la prière de l'Aïd à la maison pendant la crise du COVID" }
summary:
  ar: "سأل سائل عن حكم أداء صلاة العيد في البيت خلال أزمة كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87758 بتاريخ 16 مايو 2020)⁩ أن صلاة العيد من شعائر الإسلام الظاهرة وقد تراوحت أقوال أهل العلم في حكمها بين الواجب الكفائي والعيني والسنة المؤكدة ولما كان الميسور لا يسقط بالمعسور بيّن الجواب أحكام أدائها في البيوت في هذه النازلة."
  en: "A questioner asked the ruling on performing the Eid prayer at home during the COVID crisis. AMJA's fatwa committee (fatwa no. 87758, 16 May 2020) answered that the Eid prayer is among Islam's outward rites, scholars' sayings ranging between collective duty, individual duty and emphatic sunna; since the feasible does not lapse with the infeasible, the answer sets out the rulings for performing it in homes under the crisis."
  ur: "گھر میں عید؟ لجنة الفتوى ⁦(فتویٰ 87758، 16 مئی 2020)⁩ کے مطابق عید ظاہری شعار؛ معسور سے ميسور نہیں گرتا — گھریلو ادا کے احکام بیان ہوئے۔"
  es: "Un consultante preguntó sobre la conveniencia de realizar la oración del Eid en casa durante la crisis de la COVID-19. El comité de fatwas de AMJA (fatwa n.° 87758, 16 de mayo de 2020) respondió que la oración del Eid se encuentra entre los ritos externos del Islam, según las opiniones de los eruditos, que abarcan desde el deber colectivo hasta el deber individual y la sunna enfática. Dado que lo factible no contradice lo inviable, la respuesta establece las normas para realizarla en los hogares durante la crisis."
  fr: "Une personne a demandé la décision concernant l'accomplissement de la prière de l'Aïd à domicile pendant la crise de la COVID-19. Le comité des fatwas de l'AMJA (fatwa n° 87758, 16 mai 2020) a répondu que la prière de l'Aïd fait partie des rites extérieurs de l'islam, et que les avis des savants se répartissent entre devoir collectif, devoir individuel et sunna. Comme le faisable n'exclut pas l'impossible, la réponse expose les règles relatives à son accomplissement à domicile pendant cette crise."
