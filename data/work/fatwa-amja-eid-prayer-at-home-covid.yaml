id: work/fatwa-amja-eid-prayer-at-home-covid
class: work
kind: fatwa
label: { ar: "صلاة العيد في البيت", en: "Performing the Eid prayer at home during the COVID crisis", ur: "گھر میں عید نماز — کورونا" }
summary:
  ar: "سأل سائل عن حكم أداء صلاة العيد في البيت خلال أزمة كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87758 بتاريخ 16 مايو 2020)⁩ أن صلاة العيد من شعائر الإسلام الظاهرة وقد تراوحت أقوال أهل العلم في حكمها بين الواجب الكفائي والعيني والسنة المؤكدة ولما كان الميسور لا يسقط بالمعسور بيّن الجواب أحكام أدائها في البيوت في هذه النازلة."
  en: "A questioner asked the ruling on performing the Eid prayer at home during the COVID crisis. AMJA's fatwa committee (fatwa no. 87758, 16 May 2020) answered that the Eid prayer is among Islam's outward rites, scholars' sayings ranging between collective duty, individual duty and emphatic sunna; since the feasible does not lapse with the infeasible, the answer sets out the rulings for performing it in homes under the crisis."
  ur: "گھر میں عید؟ لجنة الفتوى ⁦(فتویٰ 87758، 16 مئی 2020)⁩ کے مطابق عید ظاہری شعار؛ معسور سے ميسور نہیں گرتا — گھریلو ادا کے احکام بیان ہوئے۔"
