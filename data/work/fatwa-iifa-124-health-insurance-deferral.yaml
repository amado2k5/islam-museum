id: work/fatwa-iifa-124-health-insurance-deferral
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 124 (13/6) بشأن التأمين الصحي واستخدام البطاقات الصحية ⁦(مؤجل)⁩", en: "IIFA resolution 124 (13/6) on health insurance and the use of health cards ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 124 (13/6): صحت کی بیمہ اور صحت کارڈز کا استعمال ⁦(مؤجل)⁩" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩، بعد اطلاعه على الأبحاث المقدمة بخصوص التأمين الصحي واستخدام البطاقات الصحية والمناقشات بمشاركة الأعضاء والخبراء وعدد من الفقهاء. قرر تأجيل النظر في الموضوع لإصدار قراره الخاص إلى دورة قادمة لمزيد من الدراسة والبحث، وبخاصة ضبط الصيغ والشروط. سُجّل بوصفه تأجيلًا لا حكمًا نهائيًا؛ وقد استُوفي الموضوع لاحقًا بقرار 149 ⁦(16/7)⁩ في دورة دبي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001), after reviewing the research on health insurance and the use of health cards and discussions with members, experts and a number of jurists. It deferred deciding the topic to a later session for further study and research, especially fixing the contractual forms and conditions. Recorded as a deferral, not a final ruling; the subject was later settled in resolution 149 (16/7) at the Dubai session."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں، صحت کی بیمہ اور صحت کارڈز پر پیش شدہ تحقیق اور ارکان، ماہرین اور فقہاء کی مباحث کے بعد۔ اس نے موضوع کے فیصلے کو مزید تحقیق — خصوصاً صیغوں اور شرائط کی وضاحت — کے لیے آئندہ مجلس تک مؤجل کیا۔ یہ مؤجل ہے، حتمی حکم نہیں؛ یہ موضوع بعد میں دبئی مجلس میں قرارداد 149 ⁦(16/7)⁩ سے طے ہوا۔"
