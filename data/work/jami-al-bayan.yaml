label: { ar: "جامع البيان عن تأويل آي القرآن", en: "Jami' al-Bayan (Tafsir al-Tabari)", ur: "جامع البیان عن تاویل آی القرآن (تفسیرِ طبری)" }
summary:
  ar: "تفسير أبي جعفر محمد بن جرير الطبري ⁦(224–310هـ)⁩ للقرآن آية آية بالروايات المسندة عن الصحابة والتابعين، مع مباحث اللغة والنحو والفقه والقراءات؛ أخذ فيه من تفاسير مجاهد والضحاك وعطية العوفي وعطاء وقتادة والربيع بن أنس وغيرهم بأسانيد ثابتة، ومن كتب الفراء والأخفش وابن قتيبة، ووقف عند اختلاف القراء في 854 موضعًا، ونقل عنه القرطبي وابن كثير والشوكاني ومكي وابن زنجلة والنحاس."
  en: "The Qur'an commentary of Abu Ja'far Muhammad ibn Jarir al-Tabari (224–310 AH), verse by verse, built on reports with chains from the Companions and Successors, with discussions of language, grammar, law and the readings; it draws on the commentaries of Mujahid, al-Dahhak, Atiyya al-Awfi, Ata, Qatada, al-Rabi' ibn Anas and others through fixed chains, and on the books of al-Farra, al-Akhfash and Ibn Qutayba; it stops at the readers' disagreements in 854 places, and al-Qurtubi, Ibn Kathir, al-Shawkani, Makki, Ibn Zanjala and al-Nahhas quote it."
  ur: "ابو جعفر محمد بن جریر طبری (224–310ھ) کی قرآن کی آیت بہ آیت تفسیر، صحابہ و تابعین سے سند کے ساتھ مروی روایات پر قائم، لغت، نحو، فقہ اور قراءات کی بحثوں کے ساتھ؛ اس میں مجاہد، ضحاک، عطیہ عوفی، عطاء، قتادہ، ربیع بن انس وغیرہ کی تفسیروں سے متعین سندوں کے ذریعے، اور فراء، اخفش اور ابن قتیبہ کی کتابوں سے لیا گیا ہے؛ یہ 854 مقامات پر قراء کے اختلاف پر رکتی ہے، اور قرطبی، ابن کثیر، شوکانی، مکی، ابن زنجلہ اور نحاس اس سے نقل کرتے ہیں۔"
