structure: "An introduction (on the language in which the Qur'an was revealed, the seven ahruf, the names of the Qur'an and the merit of tafsir), then the commentary verse by verse from al-Fatiha to al-Nas; for each passage the variant interpretations with their chains, the readings and their grounds in language and grammar, and al-Tabari's own preference."
