summary:
  ar: "سائل سأل عن المال الذي يصرف للمتبرع بالدم على سبيل الهدية أو المكافأة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20858)⁩ أنه لا حرج شرعًا في إعطاء مبلغ أو نحوه على سبيل المكافأة أو الهبة للمتبرع بالدم ما دام ذلك بغير اشتراط على ما فصّل الجواب."
  en: "A questioner asked about money given to a blood donor by way of gift or reward. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20858) answered there is no legal objection to giving a sum or the like to the donor as reward or gift, so long as it was not stipulated beforehand — as the answer details."
  ur: "ایک سائل نے خون دینے والے کو ہدیہ یا انعام کے طور پر رقم دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20858)⁩ نے جواب دیا کہ پہلے سے شرط نہ ہو تو دینا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
