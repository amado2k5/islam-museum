summary:
  ar: "تفسير القرآن العظيم لإسماعيل بن عمر بن كثير الدمشقي، من أشهر التفاسير المبنية على المأثور: يفسر الآيات بالآيات وبالأحاديث وبأقوال الصحابة والتابعين."
  en: "Ibn Kathir's Qur'an commentary, one of the best-known commentaries built on transmitted reports, explaining verses by other verses, by hadith and by the sayings of the Companions and their Successors."
  es: "El comentario del Corán de Ibn Kathir, uno de los comentarios más conocidos, se basa en relatos transmitidos, explicando versículos a partir de otros versículos, de hadices y de dichos de los Compañeros y sus sucesores."
  fr: "Le commentaire du Coran d'Ibn Kathir, l'un des commentaires les plus connus, s'appuie sur des récits transmis, expliquant les versets par d'autres versets, par des hadiths et par les paroles des Compagnons et de leurs successeurs."
  ur: "ابن کثیر کی قرآن کی تفسیر، نقل شدہ رپورٹوں پر بنائی گئی سب سے مشہور تفسیروں میں سے ایک، دوسری آیات، احادیث اور صحابہ کرام اور ان کے جانشینوں کے اقوال سے آیات کی وضاحت کرتی ہے۔"
  tr: "İsmail bin Ömer bin Kethir el-Dimashqi'nin Büyük Kur'an Yorumu, aktarılan geleneklere dayanan en ünlü tefsirlerden biridir: ayetleri ayetle, hadisle ve sahabelerin ve takipçilerin sözlerini yorumlar."
  id: "Penafsiran Agung Al-Qur'an oleh Ismail ibn Umar ibn Kathir al-Dimashqi adalah salah satu tafsir paling terkenal yang didasarkan pada tradisi yang diwariskan: ia menafsirkan ayat demi ayat, hadits, dan perkataan Para Sahabat serta Pengikut."
