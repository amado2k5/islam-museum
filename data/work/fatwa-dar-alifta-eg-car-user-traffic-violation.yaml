id: work/fatwa-dar-alifta-eg-car-user-traffic-violation
class: work
kind: fatwa
label: { ar: "حكم ضمان مستخدم السيارة المخالفة المرورية التي ارتكبها", en: "A car user's liability for his own traffic violations", ur: "گاڑی استعمال کرنے والے کی اپنی ٹریفک خلاف ورزیوں کا ضمان", es: "Responsabilidad del conductor por sus propias infracciones de tráfico.", fr: "Responsabilité d'un automobiliste pour ses propres infractions au code de la route", tr: "Aracın kullanıcısının işlediği trafik ihlali için garanti altına alınması kararı", id: "Putusan tentang jaminan kepada pengguna kendaraan atas pelanggaran lalu lintas yang mereka lakukan" }
summary:
  ar: "سائل سلّم سيارته لشخص معين بغرض محدد فارتكب هذا الشخص مخالفات مرورية بها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22602)⁩ أن تسليم السيارة لشخص لغرض محدد لا يمنحه الحق في استخدامها فيما يخالف الغرض المصرح به، وأن الاستخدام غير المصرح يجعله ضامنًا لما ترتب عليه من مخالفات وأضرار على ما فصّل الجواب."
  en: "A questioner handed his car to a specific person for a specified purpose, and that person committed traffic violations with it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22602) answered that handing over a car for a specific purpose does not entitle its user to employ it contrary to the permitted purpose, and that unauthorised use makes him liable for the violations and harms arising from it — as the answer details."
  ur: "ایک سائل نے اپنی گاڑی کسی شخص کو مخصوص مقصد کے لیے دی اور اس شخص نے اس سے ٹریفک خلاف ورزیاں کیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22602)⁩ نے جواب دیا کہ مخصوص مقصد کے لیے گاڑی دینا استعمال کرنے والے کو اس کی اجازت یافتہ مقصد کے خلاف استعمال کا حق نہیں دیتا، اور غیر مجاز استعمال اسے اس سے پیدا ہونے والی خلاف ورزیوں اور نقصانات کا ضامن بنا دیتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante entregó su automóvil a una persona específica para un propósito determinado, y dicha persona cometió infracciones de tránsito con él. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22602) respondió que entregar un automóvil para un propósito específico no autoriza a su usuario a utilizarlo de manera contraria al propósito permitido, y que el uso no autorizado lo hace responsable de las infracciones y los daños derivados del mismo, como se detalla en la respuesta."
  fr: "Un homme a confié sa voiture à une personne pour un usage précis, et cette personne a commis des infractions au code de la route avec le véhicule. La Cour suprême égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22602) a répondu que le fait de confier une voiture à une personne pour un usage spécifique n'autorise pas son utilisateur à l'utiliser à des fins autres que celles prévues, et que toute utilisation non autorisée engage sa responsabilité pour les infractions et les dommages qui en résultent – comme le précise la réponse."
  tr: "Aracını belirli bir amaç için belirli bir kişiye teslim eden ve o kişi aracıyla trafik ihlalleri yapan kişi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22602), aracı belirli bir amaçla bir kişiye teslim etmenin, beyan edilen amaca aykırı kullanma hakkı vermediğini ve yetkisiz kullanımın, ortaya çıkan ihlaller ve zararlardan sorumlu kıldığını belirtmiştir; bu da cevabında detaylandırılmıştır."
  id: "Seseorang yang menyerahkan mobilnya kepada orang tertentu untuk tujuan tertentu, dan orang tersebut melakukan pelanggaran lalu lintas bersama mobil tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22602) menjawab bahwa menyerahkan mobil kepada seseorang untuk tujuan tertentu tidak memberinya hak untuk menggunakannya bertentangan dengan tujuan yang dinyatakan, dan bahwa penggunaan tanpa izin membuatnya bertanggung jawab atas pelanggaran dan kerusakan yang ditimbulkan, sebagaimana dijelaskan dalam jawaban."
