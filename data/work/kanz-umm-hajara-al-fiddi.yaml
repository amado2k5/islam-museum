summary:
  ar: "دراسة لمحمد أبو الفرج العش، المحافظ الرئيسي للمتحف الوطني بدمشق (1972)، لكنز من 409 دراهم ساسانية وعربية ساسانية وأموية وعباسية وُجد شمالي الحسكة، فيه قطع نادرة وفريدة {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}."
  en: "Study by Muhammad Abu al-Faraj al-Ush, chief curator of the National Museum of Damascus (1972), of a hoard of 409 Sasanian, Arab-Sasanian, Umayyad and Abbasid dirhams found north of al-Hasaka, with rare and unique pieces {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}."
  ur: "دمشق کے قومی عجائب گھر کے چیف کیوریٹر محمد ابو الفرج العش کی تحقیق ⁦(1972ء)⁩ جو الحسکہ کے شمال میں ملے 409 ساسانی، عرب ساسانی، اموی اور عباسی درہموں کے خزانے پر ہے، جس میں نایاب اور یکتا سکے ہیں {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}۔"
