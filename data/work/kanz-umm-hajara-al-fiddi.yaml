summary:
  ar: "دراسة لمحمد أبو الفرج العش، المحافظ الرئيسي للمتحف الوطني بدمشق (1972)، لكنز من 409 دراهم ساسانية وعربية ساسانية وأموية وعباسية وُجد شمالي الحسكة، فيه قطع نادرة وفريدة {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}."
  en: "Study by Muhammad Abu al-Faraj al-Ush, chief curator of the National Museum of Damascus (1972), of a hoard of 409 Sasanian, Arab-Sasanian, Umayyad and Abbasid dirhams found north of al-Hasaka, with rare and unique pieces {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}."
  ur: "دمشق کے قومی عجائب گھر کے چیف کیوریٹر محمد ابو الفرج العش کی تحقیق ⁦(1972ء)⁩ جو الحسکہ کے شمال میں ملے 409 ساسانی، عرب ساسانی، اموی اور عباسی درہموں کے خزانے پر ہے، جس میں نایاب اور یکتا سکے ہیں {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}۔"
  es: "Estudio realizado por Muhammad Abu al-Faraj al-Ush, conservador jefe del Museo Nacional de Damasco (1972), de un tesoro de 409 dirhams sasánidas, árabe-sasánidas, omeyas y abasíes encontrados al norte de al-Hasaka, con piezas raras y únicas {citar:ush-kanz-umm-hajara-1972 p. 1} {citar:ush-kanz-umm-hajara-1972 p. 5}."
  fr: "Étude par Muhammad Abu al-Faraj al-Ush, conservateur en chef du Musée national de Damas (1972), d'un trésor de 409 dirhams sassanides, arabo-sassanides, omeyyades et abbassides trouvés au nord d'al-Hasaka, avec des pièces rares et uniques {cite:ush-kanz-umm-hajara-1972 p. 1} {cite:ush-kanz-umm-hajara-1972 p. 5}."
  tr: "Şam Ulusal Müzesi'nin baş küratörü Muhammed Ebu el-Faraj el-Eş tarafından (1972) yapılan bir çalışma, Hasakah'ın kuzeyinde bulunan 409 Sasani, Arap, Emevi ve Abbasi dirhemi hazinesi üzerine nadir ve benzersiz parçalar içerir {cite:ush-kanz-um-hajara-1972 s. 1} {cite:ush-kanz-um-hajara-1972 s. 5}."
  id: "Sebuah studi oleh Muhammad Abu al-Faraj al-Ash, kepala kurator Museum Nasional di Damaskus (1972), tentang harta karun sebanyak 409 dirham Sassania, Arab, Umayyah, dan Abbasiyah yang ditemukan di utara Hasakah, berisi benda langka dan unik {cite:ush-kanz-um-hajara-1972 hlm. 1} {cite:ush-kanz-um-hajara-1972 hlm. 5}."
