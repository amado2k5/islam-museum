id: work/fatwa-aliftaa-jo-a-grandmothers-gift-and-a-grandchild-born-later
class: work
kind: fatwa
label: { ar: "هبة الجدة لأحفادها ودخول من وُلد بعدها", en: "A grandmother's gift to her grandchildren and a grandchild born later", ur: "دادی کا پوتوں کو ہبہ اور بعد میں پیدا ہونے والا پوتا" }
summary:
  ar: "سؤال عن جدة وهبت أرضًا لأولاد أولادها ثم توفيت، ثم وُلد لابنها مولود، أجابت فيه دائرة الإفتاء العام الأردنية بأن الهبة تشمل الأحفاد الموجودين وقت الهبة فقط، فإذا لزمت وسُجلت بأسمائهم لم يدخل فيها من وُلد بعد ذلك. أجابت الدائرة بأن الهبة تمليك مال في حال الحياة بلا عوض، وأن هبة الجدة أرضًا لأولاد أولادها تشمل في الأصل جميع الأحفاد الموجودين وقت الهبة فقط، ولا تشمل من لم يولد بعد. ونقلت قول سليمان الجمل في حاشيته على شرح المنهج إن الهبة للحمل ممتنعة لأنه لا يمكن تمليكه ولا تملك الولي له، وقول شيخي زاده الحنفي في مجمع الأنهر إن الهبة للحمل لا تصح لأن من شرطها القبول ولا يتصور ذلك من الجنين. وخلصت إلى أنه إذا تمت الهبة وسُجلت الأرض بأسماء الأحفاد الموجودين لزمت، فتكون الأرض لمن سُجلت بأسمائهم، ولا يدخل معهم من لم يولد قبل لزوم الهبة."
  en: "A question about a grandmother who gave land to her sons' children and then died, after which one of her sons had a child, in which Jordan's General Iftaa Department answered that the gift covers only the grandchildren who existed when it was made, so once it became binding and was registered in their names, a later-born grandchild is not included. The Department answered that a gift is the transfer of property during life without return, and that a grandmother's gift of land to her grandchildren in principle covers only the grandchildren alive at the time of the gift, not those not yet born. It quoted Sulayman al-Jamal in his gloss on Sharh al-Manhaj that a gift to an unborn child is impossible, since it can neither own nor have a guardian take ownership for it, and the Hanafi Shaykhi Zadah in Majma al-Anhur that a gift to an unborn child is invalid because acceptance is a condition and cannot come from a foetus. It concluded that once the gift was completed and the land registered in the names of the existing grandchildren, it became binding: the land belongs to those in whose names it is registered, and anyone not born before the gift became binding is not included."
  ur: "ایک دادی کے بارے میں سوال جس نے اپنے بیٹوں کی اولاد کو زمین ہبہ کی اور پھر فوت ہو گئی، اس کے بعد اس کے ایک بیٹے کے ہاں بچہ پیدا ہوا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ہبہ صرف ان پوتوں کو شامل ہے جو ہبہ کے وقت موجود تھے، لہٰذا جب وہ لازم ہو کر ان کے ناموں پر رجسٹر ہو گیا تو بعد میں پیدا ہونے والا شامل نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ ہبہ زندگی میں بغیر عوض مال کا مالک بنانا ہے، اور دادی کا اپنے پوتوں کو زمین ہبہ کرنا اصل میں صرف ان پوتوں کو شامل ہے جو ہبہ کے وقت موجود تھے، ان کو نہیں جو ابھی پیدا نہیں ہوئے۔ اس نے شرح المنہج پر حاشیے میں سلیمان الجمل کا قول نقل کیا کہ حمل کو ہبہ ممتنع ہے کیونکہ نہ اسے مالک بنایا جا سکتا ہے نہ ولی اس کی طرف سے قبضہ کر سکتا ہے، اور مجمع الانہر میں حنفی عالم شیخی زادہ کا قول کہ حمل کو ہبہ درست نہیں کیونکہ قبول شرط ہے اور جنین سے قبول متصور نہیں۔ اس نے نتیجہ نکالا کہ جب ہبہ مکمل ہو کر زمین موجود پوتوں کے ناموں پر رجسٹر ہو گئی تو ہبہ لازم ہو گیا: زمین انہی کی ہے جن کے ناموں پر رجسٹر ہے، اور جو ہبہ کے لازم ہونے سے پہلے پیدا نہیں ہوا وہ ان کے ساتھ شامل نہیں۔"
