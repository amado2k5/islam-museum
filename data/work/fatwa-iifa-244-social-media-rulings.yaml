label: { ar: "قرار مجمع الفقه الإسلامي الدولي 244 (25/6) بشأن أحكام وسائل التواصل الاجتماعي وضوابطها ونشر المعلومات والأخبار وتناقلها عبرها بغرض الإنكار أو الإشاعة أو الإساءة", en: "IIFA resolution 244 (25/6) on the rulings and controls of social media and the publishing and sharing of information and news through them for denial, rumour or offence", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 244 (25/6): سوشل میڈیا کے احکام و ضوابط اور اس کے ذریعے انکار، اشاعت یا اہانت کے لیے معلومات و خبروں کی نشرو اشاع", es: "Resolución 244 (25/6) de la IIFA sobre las normas y controles de las redes sociales y la publicación y difusión de información y noticias a través de ellas con fines de negación, rumor u ofensa.", fr: "Résolution 244 (25/6) de l'IIFA relative aux règles et aux contrôles des médias sociaux et à la publication et au partage d'informations et d'actualités par leur intermédiaire à des fins de démenti, de rumeur ou d'infraction", tr: "Uluslararası İslami Fıkıh Akademisi Kararı 244 (25/6), sosyal medyanın hükümleri ve kontrolleri ile inkar, söylenti veya kötüye kullanım amacıyla bilgi ve haberlerin yayımlanması ve iletilmesine ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 244 (25/6) mengenai ketentuan dan pengendalian media sosial serta publikasi dan transmisi informasi serta berita untuk tujuan penyangkalan, rumor, atau penyalahgunaan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، استنادًا إلى قراره السابق 52 ⁦(6/3)⁩ في حكم إجراء العقود بآلات الاتصال الحديثة. عرّف المجمع وسائل التواصل الاجتماعي بأنها منظومة شبكات إلكترونية تتيح للمشترك إنشاء موقع خاص وربطه بأعضاء آخرين، والإعلام الاجتماعي بأنه المحتوى الشخصي المتناقل عبرها مع حرية الرسالة للمرسل والتجاوب للمستقبل، ومنها تويتر وواتساب وفيسبوك وسناب شات وما قد يستجد. وقرر تحريم نقل المنكرات وبثها ونشرها وتسجيلها عبرها، وتحريم نشر الأخبار الكاذبة والشائعات وكل ما يضر بالمجتمع في أمنه واستقراره وسلامة دينه وعقيدته وأخلاقه؛ وأن إنكار المنكر عبرها مقيد بشروط العلماء للإنكار: تحقق المصلحة به، وألا يفضي إلى منكر أعظم، وألا يكون فيه افتئات على ولي الأمر. وأوصى بتضمين المناهج الضوابط الشرعية لاستخدامها، والابتعاد عنها أثناء قيادة المركبات وأثناء العبادات كالطواف والسعي لما فيه من إشغال عن العبادة ومدعاة للعجب والرياء."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), building on its earlier resolution 52 (6/3) on contracts concluded by modern communication devices. It defined social media as a system of electronic networks letting a subscriber create a site and link with other members, and social-media content as personal media content passed among parties with freedom of message for the sender and of response for the receiver — naming Twitter, WhatsApp, Facebook and Snapchat, and whatever may arise later. It ruled it forbidden to relay, broadcast, publish and record objectionable content through them, and to publish false news, rumours and whatever harms society's security, stability, religion, creed and morals; and that denouncing wrong through them is bound by the scholars' conditions for denunciation: the benefit must be realised by it, it must not lead to a greater wrong, and it must not usurp the authority of the ruler. It recommended that curricula include the sharia controls for their use, and keeping away from them while driving and during acts of worship such as tawaf and sa'i, for the distraction they cause and the conceit and ostentation they may invite."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی سابقہ قرارداد 52 ⁦(6/3)⁩ ⁦(جدید مواصلاتی آلات سے معاہدے)⁩ کی بنیاد پر۔ اکیڈمی نے سوشل میڈیا کی تعریف الیکٹرانک نیٹ ورکس کے مجموعے کے طور پر کی جو رکنیت والے کو اپنا موقع بنا کر دیگر ارکان سے جوڑنے دیتا ہے، اور سوشل میڈیا مواد کی تعریف ذاتی نوعیت کے مواد کے طور پر جو متعدد فریقوں کے درمیان منتقل ہوتا ہے اور مرسل کو پیغام اور وصول کنندہ کو جواب کی آزادی ہوتی ہے — ٹوئٹر، واٹس ایپ، فیس بک اور سنیپ چیٹ اور جو کچھ آگے آئے، اس میں شامل ہیں۔ اس نے ان کے ذریعے منکرات کی نقل، نشریات، اشاعت اور ریکارڈنگ کو حرام قرار دیا، اور جھوٹی خبروں، افواہوں اور ہر اس چیز کی اشاعت کو جو معاشرے کی سلامتی، استحکام، دین، عقیدہ اور اخلاق کو نقصان پہنچائے؛ اور ان کے ذریعے انکارِ منکر کو علماء کی شرائط سے بندھا قرار دیا: انکار سے مصلحت حاصل ہو، وہ بڑے منکر کا باعث نہ بنے، اور اس میں والیِ امر کے اختیار پر تجاوز نہ ہو۔ سفارشات میں نصاب میں ان کے استعمال کے شرعی ضوابط کی شمولیت، اور گاڑی چلاتے اور عبادات ⁦(طواف و سعی)⁩ کے دوران ان سے اجتناب — اشتغال اور عجب و ریا کے سبب — شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023), basada en su resolución anterior 52 (6/3) sobre contratos celebrados mediante dispositivos de comunicación modernos. Definió las redes sociales como un sistema de redes electrónicas que permite a un suscriptor crear un sitio y conectarse con otros miembros, y el contenido de las redes sociales como contenido multimedia personal transmitido entre partes con libertad de mensaje para el remitente y de respuesta para el receptor, nombrando a Twitter, WhatsApp, Facebook y Snapchat, y cualquier otra que pueda surgir posteriormente. Dictaminó que está prohibido retransmitir, difundir, publicar y grabar contenido objetable a través de ellas, así como publicar noticias falsas, rumores y todo aquello que perjudique la seguridad, la estabilidad, la religión, el credo y la moral de la sociedad; y que la denuncia de injusticias a través de ellas está sujeta a las condiciones de denuncia establecidas por los eruditos: debe obtenerse un beneficio, no debe conducir a una injusticia mayor y no debe usurpar la autoridad del gobernante. Recomendó que los planes de estudio incluyeran los controles de la sharia para su uso, y que se evitara su presencia al conducir y durante actos de culto como el tawaf y el sa'i, debido a la distracción que provocan y la vanidad y ostentación que pueden invitar."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, soit du 20 au 23 février 2023), s'appuyant sur sa résolution antérieure n° 52 (6/3) relative aux contrats conclus par le biais des moyens de communication modernes, définit les médias sociaux comme un système de réseaux électroniques permettant à un utilisateur de créer un espace et de se connecter à d'autres membres. Elle définit le contenu des médias sociaux comme un contenu personnel échangé entre des parties, l'expéditeur ayant la liberté de message et le destinataire la liberté de réponse. L'Académie cite notamment Twitter, WhatsApp, Facebook et Snapchat, ainsi que toute autre plateforme qui pourrait apparaître ultérieurement. Elle interdit de relayer, diffuser, publier et enregistrer, par leur intermédiaire, tout contenu répréhensible, ainsi que la diffusion de fausses informations, de rumeurs et de tout ce qui porte atteinte à la sécurité, à la stabilité, à la religion, aux croyances et à la morale de la société. Elle stipule que la dénonciation d'actes répréhensibles par le biais de ces plateformes est soumise aux conditions établies par les savants: elle doit être bénéfique, ne pas engendrer un préjudice plus grave et ne pas usurper l'autorité du souverain. Il est recommandé que les programmes scolaires incluent les contrôles de la charia concernant leur utilisation, et qu'il faille s'en tenir éloigné en conduisant et pendant les actes de culte tels que le tawaf et le sa'i, en raison de la distraction qu'ils provoquent et de la vanité et de l'ostentation qu'ils peuvent susciter."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Cidde'deki yirmi beşinci oturumunda (29 Recep – 3 Şa'ban 1444 H, 20–23 Şubat 2023) toplu kararı, modern iletişim cihazlarının kullanımıyla sözleşme yapılmasına ilişkin önceki 52 (6/3) sayılı karara dayanarak. Akademi, sosyal medyayı abonelerin özel bir web sitesi oluşturup diğer üyelerle ilişkilendirmesine olanak tanıyan elektronik bir ağ sistemi, sosyal medyayı ise göndericiye mesaj özgürlüğü ve alıcıya yanıt verebilirlik ile iletilen kişisel içerik olarak tanımlamıştır; Twitter, WhatsApp, Facebook, Snapchat ve diğer yeni platformlar dahil. Bu eylemler aracılığıyla ahlaksız eylemlerin yayılmasını, yayınını, yayımlanmasını ve kaydedilmesini, yanlış haber, dedikodu ve toplumun güvenliğini, istikrarını, dinini, inancını ve ahlakını zedeleyen her şeyin yayılmasını yasaklamaya karar verdi; ve bu yolla suçu reddetmek, alimlerin inkâr koşullarıyla sınırlıdır: bunun faydasına hizmet eder, daha büyük yanlışlara yol açmaz, daha büyük bir yanlışa yol açmaz ve hükümdara karşı dini kararlar doğurmaz. Müfredatlara dini kuralların kullanılmasını ve araç kullanırken ve Tawaf ile Sa'i gibi ibadet sırasında bu yönergelerden kaçınılmasını önerdi; çünkü bunlar ibadete dikkat dağıtıyor, hayranlık ve gösteriş yaratıyordu."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023), berdasarkan keputusan sebelumnya 52 (6/3) mengenai putusan pelaksanaan kontrak menggunakan perangkat komunikasi modern. Akademi mendefinisikan media sosial sebagai sistem jaringan elektronik yang memungkinkan pelanggan membuat situs web pribadi dan menghubungkannya dengan anggota lain, dan media sosial sebagai konten pribadi yang dikirimkan melalui situs tersebut dengan kebebasan mengirim pesan kepada pengirim dan responsif terhadap penerima, termasuk Twitter, WhatsApp, Facebook, Snapchat, dan platform baru lainnya. Mahkamah memutuskan untuk melarang penyiaran, penyiaran, penerbitan, dan pencatatan tindakan tidak bermoral melalui mereka, serta melarang penyebaran berita palsu, rumor, dan apa pun yang merusak keamanan, stabilitas, agama, kepercayaan, dan moral masyarakat; dan bahwa menyangkal kesalahan melalui pedoman dibatasi oleh syarat penyangkalan para cendekiawan: hal itu menguntungkan pedoman tersebut, tidak menyebabkan kesalahan yang lebih besar, tidak menyebabkan kesalahan yang lebih besar, dan tidak menyebabkan keputusan agama terhadap penguasa. Laporan ini merekomendasikan agar pedoman agama dimasukkan dalam kurikulum, dan menghindarinya saat mengemudi kendaraan dan selama ibadah seperti Tawaf dan Sa'i, karena pedoman tersebut mengalihkan perhatian dari ibadah dan menimbulkan rasa heran serta kemegahan."
