summary:
  ar: "«لمعات التنقيح في شرح مشكاة المصابيح» لعبد الحق الدهلوي ⁦(ت 1052هـ)⁩: شرح على «مشكاة المصابيح» للخطيب التبريزي، يتناول أبوابه بالشرح، ويعرض فيها مسائل من المعجزات وآيات الكتاب. {cite:lamaat-tanqih-dar-al-nawader-vol9 p. 1}"
  en: "Abd al-Haq al-Dihlawi's (d. 1052 AH) commentary on Mishkat al-masabih of al-Khatib al-Tibrizi. It works through the Mishkat's chapters and includes sections on miracles and on Qur'anic verses. {cite:lamaat-tanqih-dar-al-nawader-vol9 p. 1}"
  es: "Comentario de Abd al-Haq al-Dihlawi (m. 1052 AH) sobre Mishkat al-masabih de al-Khatib al-Tibrizi. Trabaja a través de los capítulos del Mishkat e incluye secciones sobre milagros y versos coránicos. {citar:lamaat-tanqih-dar-al-nawader-vol9 p. 1}"
  fr: "Commentaire d'Abd al-Haq al-Dihlawi (mort en 1052 AH) sur Mishkat al-masabih d'al-Khatib al-Tibrizi. Il fonctionne à travers les chapitres du Mishkat et comprend des sections sur les miracles et sur les versets coraniques. { citer: lamaat-tanqih-dar-al-nawader-vol9 p. 1}"
  ur: "عبد الحق دہلوی کی ⁦(متوفی 1052ھ)⁩ الخطیب التبریزی کی مشکوٰۃ المصابیح کی تفسیر۔ یہ مشکات کے ابواب کے ذریعے کام کرتا ہے اور اس میں معجزات اور قرآنی آیات کے حصے شامل ہیں۔ {حوالہ: لمعات تنقیح دار النوادر جلد 9 ص۔ 1}"
  tr: "\"Lamat al-Tanqih fi Sharh Mishkat al-Masabih\" Abd al-Haqq al-Dihlawi tarafından (ö. 1052 H.): Al-Khatib al-Tabrizi'nin \"Mishkat al-Masabih\" üzerine bir yorum, bölümlerini açıklar ve mucizeler ile Kitap'tan ayetleri sunar. {cite:lamaat-tanqih-dar-al-nawader-cilt 9 s. 1}"
  id: "\"Lamat al-Tanqih fi Sharh Mishkat al-Masabih\" oleh Abd al-Haqq al-Dihlawi (wafat 1052 H): Komentar atas \"Mishkat al-Masabih\" oleh al-Khatib al-Tabrizi, yang menjelaskan bab-babnya dan menyajikan isu-isu mukjizat serta ayat-ayat dari Kitab. {sitasi: lamaat-tanqih-dar-al-nawader-vol9 hlm. 1}"
