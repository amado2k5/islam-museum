label: { ar: "قراءة القرآن على ماء زمزم للتداوي", en: "Reading the Quran over Zamzam water for healing", ur: "شفا کے لیے زمزم پر قرآن پڑھنا", es: "Leer el Corán sobre agua de Zamzam para la sanación", fr: "La lecture du Coran au-dessus de l'eau de Zamzam pour la guérison" }
summary:
  ar: "سأل سائل هل يجوز قراءة القرآن على ماء زمزم للتداوي. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85936 بتاريخ 17 نوفمبر 2011)⁩ أن فيه دواءين مباركين ثبت في كليهما أنه شفاء، مستشهدًا بقوله تعالى إن في القرآن شفاء ورحمة للمؤمنين وبأحاديث ماء زمزم لما شرب له وكونه شفاء سقم، ونقل عن ابن القيم في مدارج السالكين أنه كان يقرأ الفاتحة على قدح من ماء زمزم فيشربه فيجد به من النفع ما لم يعهده في الدواء."
  en: "A questioner asked whether the Quran may be read over Zamzam water for healing. Dr. Salah al-Sawi (fatwa no. 85936, 17 November 2011) answered that it joins two blessed remedies, each attested as healing — citing the verse that the Quran is healing and mercy for believers, the hadiths that Zamzam water is for whatever it is drunk for and is a cure for illness, and Ibn al-Qayyim's report in Madarij al-Salikin that he would recite al-Fatiha over a cup of Zamzam and find in it benefit he had not known in medicine. Recorded as AMJA's answer."
  ur: "ایک سائل نے شفا کے لیے زمزم پر قرآن پڑھنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85936، 17 نومبر 2011)⁩ کے مطابق یہ دو بابرکت شفاؤں کا اجتماع ہے — قرآن کی شفا ہونے کی آیت اور زمزم کی شفا دینے والی احادیث کے حوالے سے — ایم جے اے کے جواب کا خلاصہ۔"
  es: "Un consultante preguntó si se puede recitar el Corán sobre agua de Zamzam para la curación. El Dr. Salah al-Sawi (fatwa n.° 85936, 17 de noviembre de 2011) respondió que combina dos remedios benditos, ambos atestiguados como curativos, citando el versículo que dice que el Corán es curación y misericordia para los creyentes, los hadices que afirman que el agua de Zamzam sirve para cualquier propósito para el que se beba y es una cura para las enfermedades, y el relato de Ibn al-Qayyim en Madarij al-Salikin, donde recitaba al-Fatiha sobre una taza de Zamzam y encontraba en ella un beneficio que no había conocido en la medicina. Registrada como respuesta de AMJA."
  fr: "Une personne a demandé si la récitation du Coran sur l'eau de Zamzam pouvait avoir des vertus curatives. Le Dr Salah al-Sawi (fatwa n° 85936, 17 novembre 2011) a répondu que cela associait deux remèdes bénis, chacun attesté pour ses propriétés curatives: le verset selon lequel le Coran est guérison et miséricorde pour les croyants; les hadiths attestant que l'eau de Zamzam est bénéfique pour tout besoin et qu'elle guérit les maladies; et le récit d'Ibn al-Qayyim dans Madarij al-Salikin, selon lequel il récitait la Fatiha sur une coupe de Zamzam et y trouvait un bienfait qu'il ignorait en médecine. Cette réponse a été consignée dans l'AMJA."
