label: { ar: "قرار مجمع الفقه الإسلامي الدولي 183 (19/9) بشأن مرض السكري والصوم", en: "IIFA resolution 183 (19/9) on diabetes and fasting", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 183 (19/9): ذیابیطس اور روزہ", es: "Resolución 183 (19/9) de la IIFA sobre diabetes y ayuno" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩، مبني على وثيقة تعاون مع المنظمة الإسلامية للعلوم الطبية التي كلفها المجمع دراسة الموضوع فعقدت ندوتين ⁦(1429هـ و2008م)⁩. عرّف السكري طبيًا وعدّد أنواعه ⁦(الأول المعتمد على الإنسولين، والثاني غير المعتمد عليه، وسكري الحمل، وأنواع ثانوية لأمراض البنكرياس واختلالات هرمونية وأدوية)⁩، ثم صنّف المرضى طبيًا أربع فئات حسب احتمالات المضاعفات الخطيرة: فئة الاحتمالات الكبيرة جدًا ⁦(هبوط سكر شديد قبل رمضان، تكرار الهبوط والارتفاع، فقدان الإحساس بالهبوط، صعوبة الضبط، مضاعفات كالحماض السكري)⁩ ثم الفئات الأقل خطورة تباعًا. وبناءً على هذا التصنيف بيّن موقف الصيام من كل فئة: من يجب عليه طبيًا وشرعًا الإفطار لخطورة الصوم عليه، ومن يستحب له الإفطار، ومن يمكنه الصوم بضوابط غذائية وعلاجية ومراقبة طبية. ولفت إلى ضرورة تقييم الحالة طبيًا قبل رمضان وتثقيف المريض."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009), built on its cooperation agreement with the Islamic Organisation for Medical Sciences, which it had commissioned to study the subject (two seminars, 1429 and 2008). It defined diabetes medically and listed its types (insulin-dependent type 1, non-insulin-dependent type 2, gestational diabetes, and secondary types from pancreatic disease, hormonal disorders and drugs), then classified patients medically into four categories by likelihood of serious complications — the highest-risk group (severe hypoglycaemia in the three months before Ramadan, recurrent swings, hypoglycaemia unawareness, long-standing poor control, complications such as diabetic ketoacidosis) down to the lower-risk groups. On that classification it set out the position of fasting for each: those for whom breaking the fast is medically and legally required given fasting's danger; those for whom it is recommended; and those who may fast under dietary, therapeutic and medical-monitoring controls — with pre-Ramadan assessment and patient education."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں، جو اسلامی آرگنائزیشن فار میڈیکل سائنسز کے ساتھ معاہدۂ تعاون پر مبنی ہے جسے اکیڈمی نے موضوع کا مطالعہ سونپا اور جس نے دو سیمینار کیں ⁦(1429ھ اور 2008ء)⁩۔ اس نے ذیابیطس کی طبی تعریف اور اقسام گنوائیں ⁦(انسولین پر منحصر قسم اول، غیر منحصر قسم دوم، حمل کی ذیابیطس، اور لبلبے کے امراض، ہارمونی اختلالات اور ادویات سے پیدا ہونے والی ثانوی اقسام)⁩، پھر مریضوں کو سنگین پیچیدگیوں کے امکان کے اعتبار سے طبی طور پر چار درجوں میں بانٹا — سب سے زیادہ خطرے والا گروہ ⁦(رمضان سے پہلے تین ماہ میں شدید ہائپوگلیسیمیا، بار بار اتار چڑھاؤ، ہائپوگلیسیمیا کا احساس نہ ہونا، طویل غیر قابو سکر، ذیابیٹک کیٹوایسڈوسس جیسی پیچیدگیاں)⁩ سے لے کر کم خطرے والے درجے۔ اس درجہ بندی کی بنیاد پر ہر گروہ کے لیے روزے کی شرعی حیثیت بیان کی: جن پر طبی اور شرعی اعتبار سے روزہ خطرناک ہو ان کے لیے افطار واجب؛ جن کے لیے مستحب ہے؛ اور جنہیں غذائی، علاجی اور طبی نگرانی کی شرائط کے ساتھ روزہ رکھ سکتے ہیں — رمضان سے قبل تشخیص اور مریض کی تعلیم پر زور کے ساتھ۔"
  es: "Una resolución colectiva de la Academia Internacional de Juqh Islámico en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009), basada en su acuerdo de cooperación con la Organización Islámica para las Ciencias Médicas, a la que había encargado un estudio sobre el tema (dos seminarios, 1429 y 2008). Definió la diabetes desde el punto de vista médico y enumeró sus tipos (tipo 1 insulinodependiente, tipo 2 no insulinodependiente, diabetes gestacional y tipos secundarios por enfermedad pancreática, trastornos hormonales y medicamentos), y luego clasificó a los pacientes médicamente en cuatro categorías según la probabilidad de complicaciones graves: el grupo de mayor riesgo (hipoglucemia grave en los tres meses anteriores al Ramadán, fluctuaciones recurrentes, falta de conocimiento de la hipoglucemia, control deficiente prolongado, complicaciones como la cetoacidosis diabética) hasta los grupos de menor riesgo. En esa clasificación se establecía la postura sobre el ayuno para cada caso: aquellos para quienes romper el ayuno es un requisito médico y legal dado el peligro que conlleva; aquellos para quienes se recomienda; y aquellos que pueden ayunar bajo controles dietéticos, terapéuticos y de seguimiento médico, con evaluación previa al Ramadán y educación del paciente."
