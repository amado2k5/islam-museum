id: work/fatwa-amja-repeating-istikhara
class: work
kind: fatwa
label: { ar: "تكرار الاستخارة", en: "Repeating the istikhara after a good dream — dua may be repeated", ur: "استخارہ دہرانا — دعا تکرار جائز" }
summary:
  ar: "سأل سائل عن جواز تكرار الاستخارة مرات كثيرة بعد أن يرى رؤية تشرح صدره. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86391 بتاريخ 25 يناير 2012)⁩ أن الاستخارة دعاء وتكرار الدعاء مشروع سواء رأى رؤيا أم لم ير ولا يلزم للإقدام على العمل أن يرى رؤيا حسنة في أعقاب الاستخارة بل يستخير ويمضي على ما فصّل الجواب."
  en: "A questioner asked whether the istikhara may be repeated many times after seeing a heart-easing dream. AMJA's fatwa committee (fatwa no. 86391, 25 January 2012) answered that istikhara is a supplication and repeating supplication is legislated, dream seen or not; advancing on the work does not require a good dream after it — one seeks the choice and proceeds — as the answer details."
  ur: "استخارہ دہرانا؟ لجنة الفتوى ⁦(فتویٰ 86391، 25 جنوری 2012)⁩ کے مطابق دعا کی تکرار جائز — خواب شرط نہیں۔"
