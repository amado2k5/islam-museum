summary:
  ar: "كتاب رزين بن معاوية العبدري السرقسطي (ت 535هـ) الذي جمع فيه أحاديث الكتب الستة: الموطأ والبخاري ومسلم وأبي داود والترمذي والنسائي؛ يصفه ابن الأثير بأنه أكبر كتب الجمع وأعمّها، وينتقد عليه أنه وضع أحاديث في غير أبوابها الأولى بها، وكرر كثيراً وترك أكثر، وأدخل فقه مالك وتراجم أبواب البخاري، ورتّب على أبواب البخاري؛ فبنى ابن الأثير جامع الأصول على تهذيبه والرجوع إلى الأصول {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}."
  en: "The book of Razin b. Mu'awiya al-'Abdari of Zaragoza (d. 535 AH) combining the hadiths of six books — the Muwatta', al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi and al-Nasa'i; Ibn al-Athir calls it the largest and most comprehensive of such compilations, but faults it for placing hadiths in the wrong chapters, much repetition and more omission, including Malik's fiqh and al-Bukhari's chapter headings, and following al-Bukhari's chapters; Ibn al-Athir built Jami' al-Usul on reworking it and returning to the source-books {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}."
  ur: "رزین بن معاویہ عبدری سرقسطی (وفات 535ھ) کی کتاب جس میں چھ کتابوں — موطأ، بخاری، مسلم، ابو داود، ترمذی اور نسائی — کی احادیث جمع کی گئیں؛ ابن الاثیر اسے ایسے مجموعوں میں سب سے بڑا اور جامع کہتے ہیں، مگر اس پر تنقید کرتے ہیں کہ احادیث غیر موزوں ابواب میں رکھی گئیں، تکرار بہت اور ترک اس سے زیادہ ہے، مالک کی فقہ اور بخاری کے تراجمِ ابواب شامل کیے گئے، اور ترتیب بخاری کے ابواب پر رکھی گئی؛ ابن الاثیر نے جامع الاصول اسی کی تہذیب اور اصول کی طرف رجوع پر قائم کی {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}۔"
