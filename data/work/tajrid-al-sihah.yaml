summary:
  ar: "كتاب رزين بن معاوية العبدري السرقسطي ⁦(ت 535هـ)⁩ الذي جمع فيه أحاديث الكتب الستة: الموطأ والبخاري ومسلم وأبي داود والترمذي والنسائي؛ يصفه ابن الأثير بأنه أكبر كتب الجمع وأعمّها، وينتقد عليه أنه وضع أحاديث في غير أبوابها الأولى بها، وكرر كثيراً وترك أكثر، وأدخل فقه مالك وتراجم أبواب البخاري، ورتّب على أبواب البخاري؛ فبنى ابن الأثير جامع الأصول على تهذيبه والرجوع إلى الأصول {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}."
  en: "The book of Razin b. Mu'awiya al-'Abdari of Zaragoza (d. 535 AH) combining the hadiths of six books — the Muwatta', al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi and al-Nasa'i; Ibn al-Athir calls it the largest and most comprehensive of such compilations, but faults it for placing hadiths in the wrong chapters, much repetition and more omission, including Malik's fiqh and al-Bukhari's chapter headings, and following al-Bukhari's chapters; Ibn al-Athir built Jami' al-Usul on reworking it and returning to the source-books {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}."
  ur: "رزین بن معاویہ عبدری سرقسطی ⁦(وفات 535ھ)⁩ کی کتاب جس میں چھ کتابوں — موطأ، بخاری، مسلم، ابو داود، ترمذی اور نسائی — کی احادیث جمع کی گئیں؛ ابن الاثیر اسے ایسے مجموعوں میں سب سے بڑا اور جامع کہتے ہیں، مگر اس پر تنقید کرتے ہیں کہ احادیث غیر موزوں ابواب میں رکھی گئیں، تکرار بہت اور ترک اس سے زیادہ ہے، مالک کی فقہ اور بخاری کے تراجمِ ابواب شامل کیے گئے، اور ترتیب بخاری کے ابواب پر رکھی گئی؛ ابن الاثیر نے جامع الاصول اسی کی تہذیب اور اصول کی طرف رجوع پر قائم کی {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}۔"
  es: "El libro de Razin b. Mu'awiya al-'Abdari de Zaragoza (m. 535 AH) que combina los hadices de seis libros: el Muwatta', al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi y al-Nasa'i; Ibn al-Athir lo llama la compilación más grande y completa de este tipo, pero lo critica por colocar hadices en capítulos equivocados, mucha repetición y más omisión, incluyendo el fiqh de Malik y los encabezados de capítulo de al-Bukhari, y siguiendo los capítulos de al-Bukhari; Ibn al-Athir construyó Jami' al-Usul reelaborándolo y volviendo a los libros fuente {cite:jami-al-usul-arnaut-2016 p. 57-58} {cite:jami-al-usul-arnaut-2016 p. 61}."
  fr: "Le livre de Razin b. Mu'awiya al-'Abdari de Saragosse (mort en 535 AH) rassemble les hadiths de six recueils: le Muwatta', al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi et al-Nasa'i. Ibn al-Athir le considère comme le plus vaste et le plus complet de ces recueils, mais lui reproche de placer les hadiths dans les mauvais chapitres, de contenir de nombreuses répétitions et omissions, notamment concernant le fiqh de Malik et les titres de chapitres d'al-Bukhari, et de suivre la structure des chapitres de ce dernier. Ibn al-Athir a fondé son Jami' al-Usul sur ce recueil remanié et sur un retour aux sources originales."
  tr: "Razin ibn Muaviye el-Abdari el-Sarkati (ö. 535 H) adlı kitabında, altı kitabın hadislerini derler: El-Muvatta, El-Buhari, Müslüman, Ebu Davud, El-Tirmidi ve El-Nasa'i, İbn el-Athir, kitabı en büyük ve en kapsamlı kitap koleksiyonu olarak tanımlar. Hadisleri orijinal bölümleri dışında bölümlere dahil etmek, birçoğunu tekrar etmek ve daha fazlasını çıkarmak, Malik'in fıkhı ve Buhari'nin bölümlerinin biyografilerini tanıtmak ve bunları Buhari'nin bölümlerine göre düzenlemekle eleştirir. İbn el-Athir, prensipler koleksiyonunu inceliği ve ilkelere atıfta bulunarak oluşturdu {atıf: jami-al-usul-arnaut-2016, s. 57-58} {cite:jami-al-usul-arnaut-2016, s. 61}."
  id: "Buku Razin ibn Mu'awiyah al-Abdari al-Sarqasti (wafat 535 H), di mana ia mengumpulkan hadis dari enam kitab: Al-Muwatta', Al-Bukhari, Muslim, Abu Dawood, Al-Tirmidhi, dan Al-Nasa'i, Ibn al-Athir menggambarkannya sebagai koleksi kitab terbesar dan paling komprehensif. Ia mengkritiknya karena memasukkan hadis dalam bab lain selain bab aslinya, mengulang banyak dan meninggalkan lebih banyak, memperkenalkan yurisprudensi Malik dan biografi bab-bab al-Bukhari, serta mengaturnya sesuai dengan bab-bab al-Bukhari. Ibn al-Athir membangun kumpulan prinsip berdasarkan penyempurnaan dan referensi pada prinsip-prinsip {cite:jami-al-usul-arnaut-2016, hlm. 57-58} {cite:jami-al-usul-arnaut-2016, hlm. 61}."
