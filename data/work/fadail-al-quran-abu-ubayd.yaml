class: work
kind: book
label: { ar: "فضائل القرآن ومعالمه وآدابه لأبي عبيد", en: "Fada'il al-Qur'an wa-Ma'alimuh wa-Adabuh (Abu 'Ubayd)", ur: "فضائل القرآن و معالمہ و آدابہ ⁦(ابو عبید)⁩" }
summary:
  ar: "كتاب أبي عبيد القاسم بن سلام في فضائل القرآن وآدابه، وفيه أبواب في كتابة المصاحف: تزيينها وعِظَم حجمها وكراهة صغره، ونقطها وما فيه من الرخصة والكراهة، وتعشيرها وفواتح السور ورؤوس الآي؛ ويخرّج منه السيوطي في «الإتقان» أخبارًا في ذلك {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246}."
  en: "Abu Ubayd al-Qasim ibn Sallam's book on the merits and etiquette of the Qur'an. It has chapters on the writing of mushafs: adorning them, their large size and the dislike of a small one, dotting them and what is allowed and disliked in it, and dividing them into tens with the openings of suras and the heads of verses; al-Suyuti draws reports on these from it in the Itqan {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246}."
  ur: "ابو عبید قاسم بن سلام کی قرآن کے فضائل اور آداب پر کتاب۔ اس میں مصاحف کی کتابت کے ابواب ہیں: ان کی آرائش، بڑے حجم کا استحباب اور چھوٹے کی کراہت، ان پر نقطے لگانا اور اس میں رخصت اور کراہت، اور ان کی تعشیر اور سورتوں کے فواتح اور آیات کے سروں کا بیان؛ سیوطی «الاتقان» میں ان کے بارے میں اخبار اسی سے لاتے ہیں {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246}۔"
  es: "El libro de Abu Ubayd al-Qasim ibn Sallam sobre los méritos y la etiqueta del Corán. Contiene capítulos sobre la escritura de los mushafs: su adorno, su gran tamaño y la aversión a los pequeños, la puntuación y lo que está permitido y lo que está prohibido en ella, y su división en decenas con las aperturas de las suras y los encabezados de los versículos; al-Suyuti extrae informes sobre estos temas de él en el Itqan {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243} {cite:itqan-suyuti p. 2246}."
  fr: "L'ouvrage d'Abu Ubayd al-Qasim ibn Sallam sur les mérites et l'étiquette du Coran comporte des chapitres consacrés à la rédaction des mushafs: leur ornementation, leur taille importante et la répugnance à les réduire, leur ponctuation et ce qui est permis et déconseillé, ainsi que leur division en dizaines avec les débuts des sourates et les têtes des versets. Al-Suyuti cite des récits à ce sujet dans l'Itqan (voir: Itqan-Suyuti, p. 2240, p. 2243, p. 2246)."
