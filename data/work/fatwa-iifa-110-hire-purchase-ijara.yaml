label: { ar: "قرار مجمع الفقه الإسلامي الدولي 110 (12/4) بشأن الإيجار المنتهي بالتمليك وصكوك التأجير", en: "IIFA resolution 110 (12/4) on hire-purchase ⁦(ijara ending in ownership)⁩ and ijara sukuk", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 110 (12/4): ملکیت پر ختم ہونے والا اجارہ ⁦(اجارہ مونتیہ بالتملیک)⁩ اور اجارہ صکوک", es: "Resolución 110 (12/4) de la IIFA sobre compra a plazos (ijara que termina en propiedad) y sukuk ijara", fr: "Résolution 110 (12/4) de l'IIFA sur la location-vente (ijara aboutissant à la propriété) et les sukuk ijara", tr: "Uluslararası İslami Fiqh Akademisi Kararı 110 (12/4) mülkiyet ve kira senetleriyle sona eren kira sözleşmelerine ilişkin", id: "Keputusan Akademi Fiqh Islam Internasional 110 (4/12) mengenai sewa yang berakhir dengan kepemilikan dan akta sewa" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩. ضبط الصور الجائزة والممنوعة للإيجار المنتهي بالتمليك: ضابط المنع أن يرد عقدان مختلفان في وقت واحد على عين واحدة في زمن واحد؛ وضابط الجواز وجود عقدين منفصلين مستقلين زمانًا بحيث يكون إبرام البيع بعد الإجارة أو وجود وعد بالتمليك في نهاية المدة ⁦(والخيار يوازي الوعد)⁩، وأن تكون الإجارة فعلية لا ساترة للبيع، وأن يكون ضمان العين على المالك لا المستأجر، وأن يكون التأمين عليها — إن وجد — تعاونيًا إسلاميًا يتحمله المالك، وتطبيق أحكام الإجارة طوال المدة وأحكام البيع عند التملك، والصيانة غير التشغيلية على المؤجر. وعدّ صورًا ممنوعة ⁦(منها انقلاب الإجارة بيعًا تلقائيًا دون عقد جديد، والبيع المعلق على سداد الأجرة، والبيع بخيار الشرط مؤجلًا لأجل طويل)⁩، وتناول صكوك التأجير."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000). It fixed the line between lawful and unlawful forms of ijara ending in ownership: the prohibition marker is two different contracts concluded at the same time on the same asset in the same period; permissibility requires two separate, independent contracts — the sale concluded after the ijara, or a promise of ownership at term's end (an option counting like a promise) — the ijara being real and not a veil for a sale; risk of the asset resting on the owner not the lessee; any insurance on it being cooperative-Islamic and borne by the owner; ijara rules applying throughout the term and sale rules on transfer; and non-operating maintenance on the lessor. It listed prohibited forms — a lease converting automatically into a sale without a new contract, a sale suspended on full rental payment, a long-deferred sale with a condition-option for the lessor — and addressed ijara sukuk."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں۔ اس نے ملکیت پر ختم ہونے والے اجارہ کی جائز و ناجائز صورتوں کا ضابطہ باندھا: منع کا ضابطہ — ایک ہی وقت میں ایک ہی عین پر دو مختلف عقد؛ جواز کا ضابطہ — دو الگ آزاد عقد — بیع اجارے کے بعد یا مدت کے آخر میں ملکیت کا وعدہ ⁦(اختیار وعدے کے برابر)⁩، اجارہ حقیقی ہو نہ کہ بیع کا پردہ؛ عین کا خطرہ مالک پر ہو مستاجر پر نہیں؛ بیمہ ہو تو تعاونی اسلامی ہو اور مالک اٹھائے؛ پورے مدت اجارہ کے احکام اور تملیک پر بیع کے احکام؛ اور غیر تشغیلی دیکھ بھال موجر پر۔ ممنوع صورتیں گنوائیں — نئے عقد کے بغیر اجارے کا خودکار طور پر بیع میں بدلنا، پوری اجرت کی ادائیگی پر معلق بیع، طویل مؤجل بیع مع خیارِ شرط — اور اجارہ صکوک پر کلام کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000). Estableció la línea divisoria entre las formas lícitas e ilícitas de ijara que culminan en la propiedad: la prohibición se basa en dos contratos diferentes celebrados simultáneamente sobre el mismo bien en el mismo período; la permisibilidad requiere dos contratos separados e independientes: la venta celebrada después de la ijara, o una promesa de propiedad al final del plazo (una opción que cuenta como una promesa); la ijara debe ser real y no un velo para una venta; el riesgo del bien recae sobre el propietario y no sobre el arrendatario; cualquier seguro sobre el mismo debe ser cooperativo-islámico y asumido por el propietario; las reglas de la ijara se aplican durante todo el plazo y las reglas de venta en la transferencia; y el mantenimiento no operativo corre a cargo del arrendador. En ella se enumeraban las formas prohibidas: un contrato de arrendamiento que se convierte automáticamente en una venta sin un nuevo contrato, una venta suspendida tras el pago íntegro del alquiler, una venta aplazada durante mucho tiempo con una opción condicionada para el arrendador, y se abordaba el tema de los sukuk ijara."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000) a établi la distinction entre les formes licites et illicites d'ijara aboutissant à un transfert de propriété: l'interdiction est constituée par la conclusion simultanée de deux contrats différents portant sur le même bien et pour la même durée; la licéité requiert deux contrats distincts et indépendants – la vente conclue après l'ijara, ou une promesse de propriété à l'échéance (une option ayant valeur de promesse) – l'ijara devant être effective et non un simple prétexte à une vente; le risque lié au bien incombant au propriétaire et non au locataire; toute assurance souscrite sur le bien devant être conforme aux principes de la coopération islamique et à la charge du propriétaire; les règles de l'ijara s'appliquant pendant toute la durée du bail et les règles de la vente lors du transfert; et les frais d'entretien non opérationnels étant à la charge du bailleur. Elle énumérait les formes interdites — un bail se convertissant automatiquement en vente sans nouveau contrat, une vente suspendue en cas de paiement intégral du loyer, une vente longtemps différée avec une option conditionnelle pour le bailleur — et abordait la question des sukuk ijara."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Riyad'daki on ikinci oturumunda (25 Cumedül-Ahirah – 1 Recep 1421 H, 23–28 Eylül 2000) toplu kararı. Mülkiyetle sona eren izin verilen ve yasak kira biçimlerinin belirlenmesi: Kural, aynı mülk için aynı anda iki farklı sözleşmenin sunulmasını yasaklar; koşul, iki ayrı sözleşmenin zamanında bağımsız olmasıdır; böylece satış kira sözleşmesinden sonra yapılır veya vade sonunda mülkiyet sözü verilir (opsiyon vaatle eşdeğerdir), kira sözleşmesi satış garantisi değil, fiili olmalı, mülkün garantisi kiracıya değil sahibine aittir ve sigorta varsa İslami kooperatif olarak mülk sahibine ait olmalıdır, kira hükümleri süre boyunca uygulanır, mülkiyet üzerindeki satış kuralları ve işletme dışı bakım kiracıya aittir. Yasaklanan formları (yeni sözleşme olmadan otomatik kira dönüşümü, kira ödemesine bağlı satış ve uzun vadeli ertelenmiş koşullu opsiyonlu satış dahil) listeledi ve kira sözleşmelerine hitap etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000 M). Menentukan bentuk sewa yang diperbolehkan dan dilarang yang berakhir dengan kepemilikan: Aturan ini melarang dua kontrak berbeda disajikan secara bersamaan untuk properti yang sama pada waktu yang sama; syaratnya adalah dua kontrak terpisah bersifat independen dalam waktu sehingga penjualan dilakukan setelah sewa atau ada janji kepemilikan di akhir masa (opsi setara dengan janji), sewa harus aktual bukan jaminan penjualan, jaminan properti harus pada pemilik, bukan penyewa itu sendiri, dan asuransi — jika ada — harus koperasi Islam yang ditanggung oleh pemilik, ketentuan sewa harus diterapkan sepanjang periode sewa, aturan penjualan saat kepemilikan, dan pemeliharaan non-operasional menjadi tanggung jawab penyewa. Ia mencantumkan formulir yang dilarang (termasuk konversi otomatis sewa tanpa kontrak baru, penjualan yang bergantung pada pembayaran sewa, dan penjualan dengan opsi bersyarat ditunda untuk jangka panjang), serta membahas akta sewa."
