summary:
  ar: "سائل سأل عن فضل زيارة المريض وآدابها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21633)⁩ أن زيارة المريض لها فضل عظيم يكفي أنها سبب من أسباب دخول الجنة وبيّن الجواب أهم الآداب التي تجب مراعاتها عند الزيارة على وجهه."
  en: "A questioner asked the merit of visiting the sick and its manners. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21633) answered that visiting the sick has great merit — it suffices that it is a cause of entering Paradise — and the answer sets out the chief manners to observe at the visit."
  ur: "ایک سائل نے مریض کی عیادت کا فضل اور آداب پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21633)⁩ نے جواب دیا کہ عیادت کا فضل عظیم ہے یہی کافی ہے کہ یہ جنت میں داخلے کا سبب ہے — جواب میں عیادت کے اہم آداب بیان ہوئے۔"
