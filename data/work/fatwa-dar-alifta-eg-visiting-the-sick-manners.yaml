id: work/fatwa-dar-alifta-eg-visiting-the-sick-manners
class: work
kind: fatwa
label: { ar: "فضل زيارة المريض وبيان ما يلزمها من الآداب", en: "The merit of visiting the sick and its required manners", ur: "علیم کی عیادت کا فضل اور اس کے آداب", es: "El valor de visitar a los enfermos y las normas de cortesía que ello conlleva.", fr: "L'intérêt de rendre visite aux malades et les bonnes manières qui s'y rattachent", tr: "Hastayı ziyaret etmenin ve gerekli görgü kurallarını açıklamanın erdemi", id: "Keutamaan mengunjungi pasien dan menjelaskan etiket yang diperlukan" }
summary:
  ar: "سائل سأل عن فضل زيارة المريض وآدابها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21633)⁩ أن زيارة المريض لها فضل عظيم يكفي أنها سبب من أسباب دخول الجنة وبيّن الجواب أهم الآداب التي تجب مراعاتها عند الزيارة على وجهه."
  en: "A questioner asked the merit of visiting the sick and its manners. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21633) answered that visiting the sick has great merit — it suffices that it is a cause of entering Paradise — and the answer sets out the chief manners to observe at the visit."
  ur: "ایک سائل نے مریض کی عیادت کا فضل اور آداب پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21633)⁩ نے جواب دیا کہ عیادت کا فضل عظیم ہے یہی کافی ہے کہ یہ جنت میں داخلے کا سبب ہے — جواب میں عیادت کے اہم آداب بیان ہوئے۔"
  es: "Un consultante preguntó sobre el mérito de visitar a los enfermos y las normas de cortesía al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21633) respondió que visitar a los enfermos tiene un gran mérito —basta con que sea una causa de entrada al Paraíso— y la respuesta expone las principales normas de cortesía que se deben observar durante la visita."
  fr: "Un internaute a interrogé Dar al-Ifta d'Égypte sur le mérite de rendre visite aux malades et sur les bonnes manières à adopter. Le grand mufti Dr Nazir Muhammad Ayyad (fatwa n° 21633) a répondu que visiter les malades est une pratique très méritoire – elle constitue à elle seule une voie d'accès au Paradis – et la réponse expose les principales règles de bienséance à observer lors de cette visite."
  tr: "Bir soru soran kişi hastaları ziyaret etmenin erdemi ve görgü kuralları hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21633), hastayı ziyaret etmenin büyük bir erdem olduğunu, bunun Cennet'e girme nedenlerinden biri olduğunu söyledi. Cevap, hastayı ziyaret ederken uyulması gereken en önemli görgü kurallarını netleştirdi."
  id: "Seorang penanya bertanya tentang kebajikan dan etiket dalam mengunjungi orang sakit. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21633) menjawab bahwa mengunjungi orang sakit memiliki kebajikan besar, sehingga menjadi salah satu alasan masuk Surga. Jawaban tersebut menjelaskan etiket terpenting yang harus dipatuhi saat mengunjungi pasien."
