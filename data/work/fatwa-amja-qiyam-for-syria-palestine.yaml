id: work/fatwa-amja-qiyam-for-syria-palestine
class: work
kind: fatwa
label: { ar: "قيام الليل للنصرة", en: "Dedicating congregational night prayer to supplicate for Syria and Palestine", ur: "شام و فلسطین کے لیے قیام اللیل", es: "Dedicar la oración nocturna congregacional a suplicar por Siria y Palestina.", fr: "Dédiée à la prière collective du soir pour implorer la Syrie et la Palestine", tr: "Destek için gece duaları", id: "Doa malam untuk dukungan" }
summary:
  ar: "سأل سائل عن جواز تخصيص صلاة قيام الليل جماعة لنصرة سوريا وفلسطين والربيع العربي والدعاء لهم مع الإمام. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86575 بتاريخ 15 مارس 2012)⁩ أن نصرة المسلم واجبة ونصحت باجتماعات لنصرة الإخوة في سوريا بمختلف أنواع النصرة منها التعريف بقضيتهم والدعاء لهم وجمع التبرعات لمواساتهم ودعمهم ومنها التقرب إلى الله بقيام جزء من الليل على ما فصّل الجواب من ضوابط الدعاء الجماعي فيها."
  en: "A questioner asked whether congregational night prayer may be dedicated to aiding Syria, Palestine and the Arab Spring, supplicating for them with the imam. AMJA's fatwa committee (fatwa no. 86575, 15 March 2012) answered that aiding the Muslim is a duty, advising gatherings to support their brothers in Syria by every kind of aid — publicizing their cause, supplication, collecting donations to console and back them, and drawing near to God by standing part of the night — as the answer details the bounds of collective supplication in it."
  ur: "شام و فلسطین کے لیے قیام؟ لجنة الفتوى ⁦(فتویٰ 86575، 15 مارچ 2012)⁩ کے مطابق نصرت واجب — دعا، عطیہ، قیام اللیل کے ضوابط بیان ہوئے۔"
  es: "Un participante preguntó si la oración nocturna en congregación podía dedicarse a ayudar a Siria, Palestina y la Primavera Árabe, suplicando por ellos junto con el imán. El comité de fatuas de AMJA (fatua n.º 86575, 15 de marzo de 2012) respondió que ayudar a los musulmanes es un deber, aconsejando a las congregaciones que apoyen a sus hermanos en Siria con todo tipo de ayuda: dar a conocer su causa, suplicar, recaudar donaciones para consolarlos y respaldarlos, y acercarse a Dios permaneciendo de pie durante parte de la noche, tal como se detalla en la respuesta sobre los límites de la súplica colectiva."
  fr: "Un participant a demandé si les prières nocturnes en congrégation pouvaient être consacrées à l'aide à la Syrie, à la Palestine et au Printemps arabe, en invoquant Dieu avec l'imam. Le comité des fatwas de l'AMJA (fatwa n° 86575, 15 mars 2012) a répondu qu'aider le musulman est un devoir, conseillant aux fidèles de soutenir leurs frères en Syrie par toutes sortes d'aides: faire connaître leur cause, prier pour eux, collecter des dons pour les consoler et les soutenir, et se rapprocher de Dieu en veillant une partie de la nuit. La réponse précise d'ailleurs les modalités de la prière collective."
  tr: "Bir soru soran kişiye, cemaatte gece namazının Suriye, Filistin ve Arap Baharı'nı desteklemek için adanmasının ve imamla birlikte onlar için dua edilmesinin caizedilip edilmediği soruldu. Amerikan Şeriat Hukukçuları Akademisi Fetva Komitesi (15 Mart 2012 tarihli Fetva No. 86575), Müslümanları desteklemenin zorunlu olduğunu yanıtladı ve Suriye'deki kardeşlere çeşitli destek biçimlerinde destek olmak için toplantılar yapılmasını tavsiye etti; davalarını tanıtmak, onlar için dua etmek, onları teselli etmek ve desteklemek için bağış toplamak ve gecenin bir kısmını dua ederek Tanrı'ya yaklaşmak gibi, bu süreçte toplu dua kurallarına dair ayrıntılı olarak belirtildiği gibi."
  id: "Seorang penanya ditanya tentang diperbolehkannya mendedikasikan shalat malam dalam jamaah untuk mendukung Suriah, Palestina, dan Musim Semi Arab, serta mendoakan mereka bersama imam. Komite Fatwa di American Academy of Sharia Jurists (Fatwa No. 86575 tanggal 15 Maret 2012) menanggapi bahwa mendukung Muslim adalah kewajiban dan menyarankan mengadakan pertemuan untuk mendukung saudara di Suriah dalam berbagai bentuk dukungan, termasuk memperkenalkan tujuan mereka, berdoa untuk mereka, mengumpulkan donasi untuk menghibur dan mendukung mereka, serta mendekatkan diri kepada Tuhan dengan berdoa sebagian malam, sebagaimana dijelaskan mengenai aturan doa kolektif selama malam itu."
