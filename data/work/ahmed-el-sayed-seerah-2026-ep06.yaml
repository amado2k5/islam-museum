id: work/ahmed-el-sayed-seerah-2026-ep06
class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 6: سيرة رسول الله 06 | تثبيت خديجة للنبي"
  en: "The Biography of the Messenger of God 2026, episode 6: Khadija Steadies the Prophet"
  ur: "سیرتِ رسول اللہ 2026، قسط 6: خدیجہ کا نبی کو ثابت قدم رکھنا"
  fr: "La biographie du Messager de Dieu 2026, épisode 6 : Khadija raffermit le Prophète"
  es: "La biografía del Mensajero de Dios 2026, episodio 6: Jadiya serena al Profeta"
summary:
  ar: "يتابع المجلس السادس رواية الوحي الأول في غار حراء، فيقرأ رواية عائشة في صحيح البخاري مع تعليق ابن حجر وابن كثير والسهيلي. ويعالج معنى مجيء جبريل وشدة اللقاء الأول وأقوال العلماء في خوف النبي وجواب خديجة بمواقفها الثلاثة، ويختم بورقة بن نوفل."
  en: "The sixth session continues the account of the first revelation in the cave of Hira, reading the report of Aisha in Sahih al-Bukhari with commentary from Ibn Hajar, Ibn Kathir and al-Suhayli. It treats the meaning of Jibril's coming, the severity of the first encounter, the scholars' views on the Prophet's fear, and Khadija's three-part response, ending with Waraqa ibn Nawfal."
  ur: "چھٹی نشست غارِ حرا میں پہلی وحی کے بیان کو جاری رکھتی ہے اور صحیح بخاری میں عائشہ کی روایت کو ابن حجر، ابن کثیر اور سہیلی کی شرح کے ساتھ پڑھتی ہے۔ اس میں جبریل کے آنے کے معنی، پہلی ملاقات کی شدت، نبی کے خوف کے بارے میں علماء کی آراء اور خدیجہ کے تین پہلوؤں والے جواب پر بات کی گئی ہے، اور ورقہ بن نوفل پر ختم ہوتی ہے۔"
  fr: "La sixième séance poursuit le récit de la première révélation dans la grotte de Hira, en lisant le récit d'Aïcha dans le Sahih d'al-Bukhari avec les commentaires d'Ibn Hajar, d'Ibn Kathir et d'al-Suhayli. Elle traite du sens de la venue de Jibril, de la rudesse de la première rencontre, des avis des savants sur la peur du Prophète et de la triple réponse de Khadija, et s'achève sur Waraqa ibn Nawfal."
  es: "La sexta sesión continúa el relato de la primera revelación en la cueva de Hira, leyendo el informe de Aisha en el Sahih de al-Bujari con comentarios de Ibn Hayar, Ibn Kazir y al-Suhayli. Trata el significado de la venida de Yibril, la severidad del primer encuentro, las opiniones de los eruditos sobre el temor del Profeta y la triple respuesta de Jadiya, y termina con Waraqa ibn Nawfal."
