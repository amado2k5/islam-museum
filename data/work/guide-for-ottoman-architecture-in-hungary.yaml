summary:
  ar: "دليل سياحي ثنائي اللغة ⁦(تركي وإنجليزي)⁩ لمحمد أمين يلماز، نشرته رئاسة الأتراك في الخارج في أنقرة سنة 2024 في عام الثقافة التركي المجري، يرتب الآثار العثمانية الباقية في المجر بحسب المدن في جولات يومية {cite:yilmaz-ottoman-architecture-hungary-2024 p. 4} {cite:yilmaz-ottoman-architecture-hungary-2024 p. 7}."
  en: "A bilingual (Turkish-English) guidebook by Mehmet Emin Yılmaz, published by YTB in Ankara in 2024 for the Turkish-Hungarian Year of Culture, arranging the surviving Ottoman monuments of Hungary town by town in day routes {cite:yilmaz-ottoman-architecture-hungary-2024 p. 4} {cite:yilmaz-ottoman-architecture-hungary-2024 p. 7}."
  es: "Una guía bilingüe (turco-inglés) de Mehmet Emin Yılmaz, publicada por YTB en Ankara en 2024 para el Año Turco-Húngaro de la Cultura, que organiza los monumentos otomanos supervivientes de Hungría ciudad por ciudad en rutas de un día {cite:yilmaz-ottoman-architecture-hungary-2024 p. 4} {cite:yilmaz-ottoman-architecture-hungary-2024 p. 7}."
  fr: "Un guide bilingue (turc-anglais) de Mehmet Emin Yılmaz, publié par YTB à Ankara en 2024 pour l'Année de la culture turco-hongroise, organisant les monuments ottomans survivants de Hongrie ville par ville dans des itinéraires d'une journée {cite:yilmaz-ottoman-architecture-hungary-2024 p. 4} {cite:yilmaz-ottoman-architecture-hungary-2024 p. 7}."
  ur: "مہمت ایمن یلماز کی ایک دو لسانی ⁦(ترکی-انگریزی)⁩ گائیڈ بک، جو YTB نے 2024 میں انقرہ میں ترک ہنگری کے سال ثقافت کے لیے شائع کی تھی، جس میں ہنگری کے قصبے کی باقی ماندہ عثمانی یادگاروں کو دن کے راستوں میں ترتیب دیا گیا تھا۔ 4} {حوالہ: یلماز-عثمانی-آرکیٹیکچر-ہنگری-2024 ص۔ 7}۔"
  tr: "Mehmet Emin Yılmaz tarafından hazırlanan, 2024 yılında Ankara'da Türk-Macaristan Kültür Yılı kapsamında Türkler Yurtdışında Türkler Başkanlığı tarafından yayımlanan, Macaristan'daki kalan Osmanlı kalıntılarını şehirlere göre günlük turlarda düzenleyen iki dilli bir turist rehberi {cite:yilmaz-ottoman-architecture-hungary-2024 s. 4} {cite:yilmaz-ottoman-architecture-hungary-2024 s. 7}."
  id: "Panduan wisata dwibahasa (Turki dan Inggris) oleh Mehmet Emin Yilmaz, diterbitkan oleh Kepresidenan Turks Abroad di Ankara pada tahun 2024 selama Tahun Kebudayaan Turki-Hungaria, mengatur sisa reruntuhan Ottoman di Hungaria berdasarkan kota dalam tur harian {cite:yilmaz-ottoman-architecture-hungary-2024 hlm. 4} {cite:yilmaz-ottoman-architecture-hungary-2024 hlm. 7}."
