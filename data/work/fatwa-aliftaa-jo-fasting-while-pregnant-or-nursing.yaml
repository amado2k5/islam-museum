id: work/fatwa-aliftaa-jo-fasting-while-pregnant-or-nursing
class: work
kind: fatwa
label: { ar: "صيام الحامل والمرضع", en: "Fasting while pregnant or nursing", ur: "حاملہ اور دودھ پلانے والی کا روزہ" }
summary:
  ar: "سؤال عن صيام الحامل والمرضع، أجابت فيه دائرة الإفتاء العام الأردنية بأن الصيام واجب عليهما، فإن خافتا على أنفسهما أفطرتا وقضتا فقط، وإن كان الفطر خوفًا على الولد وحده وجبت الفدية مع القضاء. أجابت الدائرة بأن الصيام يجب على الحامل والمرضع، لكن إن خافتا على أنفسهما، أو على أنفسهما مع الولد، ضررًا لا يُحتمل عادة أفطرتا وعليهما القضاء فقط. وقالت إن الفطر إن كان خوفًا على الجنين أو الطفل وحده وجبت الفدية مع القضاء، لأن هذا الإفطار انتفع به الطفل وحده. وبينت أن الفدية إطعام مسكين عن كل يوم أفطرته."
  en: "A question about fasting while pregnant or nursing, in which Jordan's General Iftaa Department answered that fasting is obligatory for both, that if they fear for themselves they break the fast and only make it up, and that if they break it out of fear for the child alone they owe the fidya as well as making it up. The Department answered that fasting is obligatory for a pregnant or nursing woman, but if she fears harm that cannot normally be borne, to herself or to herself and the child, she breaks the fast and owes only making it up. It said that if she breaks the fast out of fear for the foetus or baby alone, she owes the fidya in addition to making it up, because only the child benefited from breaking the fast. It explained that the fidya is feeding one poor person for each day not fasted."
  ur: "حاملہ اور دودھ پلانے والی کے روزے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ان پر روزہ واجب ہے؛ اگر اپنی جان کا خوف ہو تو روزہ چھوڑیں اور صرف قضا کریں، اور اگر صرف بچے کے خوف سے چھوڑیں تو قضا کے ساتھ فدیہ بھی واجب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ حاملہ اور دودھ پلانے والی پر روزہ واجب ہے، لیکن اگر انہیں اپنے لیے، یا اپنے اور بچے دونوں کے لیے، ایسے نقصان کا خوف ہو جو عام طور پر برداشت نہ ہو، تو روزہ چھوڑ دیں اور ان پر صرف قضا ہے۔ اس نے کہا کہ اگر روزہ صرف جنین یا بچے کے خوف سے چھوڑا جائے تو قضا کے ساتھ فدیہ بھی واجب ہے، کیونکہ اس افطار کا فائدہ صرف بچے کو ہوا۔ اس نے وضاحت کی کہ فدیہ ہر چھوڑے ہوئے دن کے بدلے ایک مسکین کو کھانا کھلانا ہے۔"
