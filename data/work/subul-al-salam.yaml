label:
  ar: "سبل السلام الموصلة إلى بلوغ المرام"
  en: "Subul al-Salam al-Musila ila Bulugh al-Maram"
  ur: "سبل السلام الموصلۃ الی بلوغ المرام"
summary:
  ar: "شرح محمد بن إسماعيل الأمير الصنعاني ⁦(1099–1182هـ)⁩ على «بلوغ المرام» لابن حجر، اختصره من «البدر التمام» للقاضي الحسين بن محمد المغربي مقتصراً على حل الألفاظ وبيان المعاني ومعرضاً عن ذكر الخلاف إلا ما يرتبط به الدليل، مع زيادات كثيرة؛ ويعدّه محققه محمد صبحي حلاق من خير الشروح المتوسطة لأحاديث الأحكام {cite:subul-salam-hallaq-ibn-al-jawzi-v1 p. 15-16}."
  en: "Muhammad b. Isma'il al-Amir al-San'ani's (1099–1182 AH) commentary on Ibn Hajar's Bulugh al-Maram, abridged from al-Badr al-Tamam by the judge al-Husayn b. Muhammad al-Maghribi, keeping to explaining the words and meanings and leaving aside juristic disagreement except where the evidence requires it, with many additions; its editor Muhammad Subhi Hallaq counts it among the best middle-length commentaries on legal hadiths {cite:subul-salam-hallaq-ibn-al-jawzi-v1 p. 15-16}."
  ur: "محمد بن اسماعیل الامیر صنعانی ⁦(1099–1182ھ)⁩ کی ابن حجر کی «بلوغ المرام» پر شرح، جو قاضی حسین بن محمد مغربی کی «البدر التمام» کا اختصار ہے، الفاظ کے حل اور معانی کے بیان تک محدود، فقہی اختلاف سے گریز کرتے ہوئے سوائے اس کے جس سے دلیل جڑی ہو، اور بہت سے اضافوں کے ساتھ؛ اس کے محقق محمد صبحی حلاق اسے احادیثِ احکام کی بہترین متوسط شروح میں شمار کرتے ہیں {cite:subul-salam-hallaq-ibn-al-jawzi-v1 p. 15-16}۔"
