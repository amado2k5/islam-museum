structure: "A preamble on the attributes and the way of the early generations, then sections on God's speech and the Qur'an, the believers' vision of God, decree and fate, iman, belief in all the Prophet reported (the Isra and Miraj, signs of the Hour, the grave, resurrection, the pool, the bridge, intercession), the finality of Muhammad, the order of the caliphs, the ten promised Paradise, takfir, obedience to rulers, love of the Companions and avoiding innovators."
