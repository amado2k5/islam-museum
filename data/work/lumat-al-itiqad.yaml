summary:
  ar: "رسالة موجزة في عقيدة أهل السنة على مذهب السلف ألّفها موفق الدين ابن قدامة المقدسي الحنبلي، تبدأ بصفات الله وكلامه ورؤيته وتنتهي بالإيمان بما أخبر به النبي وأمر الصحابة والخلافة وهجران أهل البدع."
  en: "A short statement of the creed of Ahl al-Sunna on the way of the early generations by the Hanbali Muwaffaq al-Din Ibn Qudama al-Maqdisi, running from God's attributes, speech and vision to belief in what the Prophet reported, the Companions, the caliphate and avoiding innovators."
  es: "Breve exposición del credo de Ahl al-Sunna sobre el camino de las primeras generaciones, por Hanbali Muwaffaq al-Din Ibn Qudama al-Maqdisi."
  fr: "Un bref exposé du credo d'Ahl al-Sunna sur la voie des premières générations par Hanbali Muwaffaq al-Din Ibn Qudama al-Maqdisi."
  ur: "حنبلی موفق الدین ابن قدامہ المقدسی کی طرف سے ابتدائی نسلوں کے طریقہ پر اہل السنۃ کے عقیدہ کا مختصر بیان، خدا کی صفات، کلام اور بصیرت سے نبی، صحابہ کرام، خلافت اور بدعتیوں سے اجتناب پر یقین کی طرف چلنا۔"
