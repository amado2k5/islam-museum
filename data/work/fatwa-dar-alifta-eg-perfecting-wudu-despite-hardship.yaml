label: { ar: "حكم إسباغ الوضوء على المكاره", en: "Perfecting wudu despite hardships", ur: "مشکلات کے باوجود وضو مکمل کرنا" }
summary:
  ar: "سائل سأل عن معنى إسباغ الوضوء على المكاره. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21963)⁩ أن إسباغ الوضوء يكون بإكماله وإتمامه وإعطاء كل عضو حقه ويتحقق بالماء البارد والدافئ سواء وأن إسباغه على المكاره من الأعمال التي بها تكفير السيئات ورفع الدرجات على ما فصّل الجواب."
  en: "A questioner asked the meaning of 'perfecting wudu despite hardships'. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21963) answered that perfecting wudu means completing it fully, giving each limb its due, with cold and warm water alike; perfecting it despite hardships is among the deeds that expiate sins and raise ranks — as the answer details."
  ur: "ایک سائل نے 'مشکلات کے باوجود وضو مکمل کرنے' کا مطلب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21963)⁩ نے جواب دیا کہ وضو کا اِسباغ اس کا مکمل اور پورا کرنا اور ہر عضو کا حق ادا کرنا ہے، ٹھنڈے اور گرم پانی دونوں سے؛ مشقت میں مکمل وضو ان اعمال میں ہے جن سے گناہ مٹتے اور درجے بلند ہوتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
