id: work/fatwa-dar-alifta-eg-perfecting-wudu-despite-hardship
class: work
kind: fatwa
label: { ar: "حكم إسباغ الوضوء على المكاره", en: "Perfecting wudu despite hardships", ur: "مشکلات کے باوجود وضو مکمل کرنا", es: "Perfeccionar el wudu a pesar de las dificultades", fr: "Parfaire ses ablutions malgré les difficultés", tr: "Zorluk noktasına kadar abdest uygulanmasına ilişkin karar", id: "Putusan tentang penerapan wudhu hingga titik kesulitan" }
summary:
  ar: "سائل سأل عن معنى إسباغ الوضوء على المكاره. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21963)⁩ أن إسباغ الوضوء يكون بإكماله وإتمامه وإعطاء كل عضو حقه ويتحقق بالماء البارد والدافئ سواء وأن إسباغه على المكاره من الأعمال التي بها تكفير السيئات ورفع الدرجات على ما فصّل الجواب."
  en: "A questioner asked the meaning of 'perfecting wudu despite hardships'. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21963) answered that perfecting wudu means completing it fully, giving each limb its due, with cold and warm water alike; perfecting it despite hardships is among the deeds that expiate sins and raise ranks — as the answer details."
  ur: "ایک سائل نے 'مشکلات کے باوجود وضو مکمل کرنے' کا مطلب پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21963)⁩ نے جواب دیا کہ وضو کا اِسباغ اس کا مکمل اور پورا کرنا اور ہر عضو کا حق ادا کرنا ہے، ٹھنڈے اور گرم پانی دونوں سے؛ مشقت میں مکمل وضو ان اعمال میں ہے جن سے گناہ مٹتے اور درجے بلند ہوتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó por el significado de \"perfeccionar el wudu a pesar de las dificultades\". El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21963) respondió que perfeccionar el wudu significa completarlo íntegramente, dando a cada miembro lo que le corresponde, tanto con agua fría como con agua caliente; perfeccionarlo a pesar de las dificultades es uno de los actos que expían los pecados y elevan el rango, como se detalla en la respuesta."
  fr: "Un internaute a demandé la signification de l'expression « accomplir ses ablutions malgré les difficultés ». La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21963) a répondu que les ablutions parfaites consistent à les accomplir intégralement, en lavant chaque membre avec soin, aussi bien à l'eau froide qu'à l'eau chaude; les accomplir malgré les difficultés compte parmi les actes qui expient les péchés et élèvent le rang spirituel, comme le précise la réponse."
  tr: "Bir soru soran kişi, zor koşullara abdest almanın ne demek olduğunu sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21963), abdest almanın tamamlanıp tamamlanarak yapıldığını, her uzvu hak ettiğini vererek yapıldığını, bunun hem soğuk hem de sıcak suyla yapıldığını, sevilmeyenlere uygulanmasının günahları kefaret eden ve rütbeleri yükselten eylemlerden biri olduğunu cevapta açıklamıştır."
  id: "Seorang penanya bertanya tentang makna memperpanjang wudhu ke dalam keadaan sulit. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21963) menjawab bahwa melakukan wudhu dilakukan dengan menyelesaikan dan menyelesaikannya serta memberikan setiap anggota tubuh yang layak, dan dilakukan dengan air dingin dan hangat, dan penerapannya pada yang tidak disukai termasuk tindakan yang menebus dosa dan meningkatkan pangkat, seperti yang dijelaskan dalam jawaban."
