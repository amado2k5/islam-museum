summary:
  ar: "كتاب لمصطفى محمود ⁦(كتاب اليوم، 1994)⁩ يصف الإسلام بأنه في «خندق»: الإرهاب يحاصره من جهة والعلمانية تضربه من أخرى وأطماع الغرب تهدده، ويرى أن الدين في حقيقته «الحب القديم» وأن الأوامر والنواهي تفاصيله، ويختم بقراءة لوعود قرآنية بنصر قادم يصفها بأنها «قراءة تاريخية» يرجو أن تكون صحيحة {cite:mm-islam-fi-khandaq-akhbar-1994 p. 9} {cite:mm-islam-fi-khandaq-akhbar-1994 p. 153} {cite:mm-islam-fi-khandaq-akhbar-1994 p. 164}."
  en: "A book by Mostafa Mahmoud (Kitab al-Yawm, 1994) that describes Islam as in a 'trench', besieged by terrorism on one side, struck by secularism on another and threatened by Western ambitions; it holds that religion is at heart 'the old love', commands and prohibitions being its details, and ends with a reading of Qur'anic promises of a coming victory that he calls 'a historical reading' he hopes is right {cite:mm-islam-fi-khandaq-akhbar-1994 p. 9} {cite:mm-islam-fi-khandaq-akhbar-1994 p. 153} {cite:mm-islam-fi-khandaq-akhbar-1994 p. 164}."
  ur: "مصطفیٰ محمود کی کتاب ⁦(کتاب الیوم، 1994)⁩ جو اسلام کو ایک «خندق» میں بیان کرتی ہے: ایک طرف دہشت گردی اسے گھیرے ہوئے، دوسری طرف سیکولرزم اس پر ضرب لگاتا ہے اور مغرب کے عزائم اسے خطرے میں ڈالتے ہیں؛ وہ کہتے ہیں کہ دین اصل میں «قدیم محبت» ہے اور اوامر و نواہی اس کی تفصیل، اور آخر میں آنے والی فتح کے قرآنی وعدوں کی ایک قراءت پیش کرتے ہیں جسے وہ «تاریخی قراءت» کہتے ہیں اور امید کرتے ہیں کہ درست ہو {cite:mm-islam-fi-khandaq-akhbar-1994 p. 9} {cite:mm-islam-fi-khandaq-akhbar-1994 p. 153} {cite:mm-islam-fi-khandaq-akhbar-1994 p. 164}۔"
