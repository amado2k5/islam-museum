label: { ar: "قرار مجمع الفقه الإسلامي الدولي 128 (14/2) بشأن حقوق الإنسان والعنف الدولي", en: "IIFA resolution 128 (14/2) on human rights and international violence", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 128 (14/2): انسانی حقوق اور بین الاقوامی تشدد", es: "Resolución 128 (14/2) de la IIFA sobre derechos humanos y violencia internacional.", fr: "Résolution 128 (14/2) de l'IIFA sur les droits de l'homme et la violence internationale", tr: "Uluslararası İslami Fiqh Akademisi İnsan Hakları ve Uluslararası Şiddet Hakkında 128 (14/2) sayılı Kararı", id: "Resolusi Akademi Fiqh Islam Internasional 128 (14/2) tentang Hak Asasi Manusia dan Kekerasan Internasional" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. نص على أن الإسلام يكرم الإنسان من حيث هو إنسان ويعنى بتقرير حقوقه ورعاية حرماته، وأن الفقه الإسلامي أول فقه في العالم يقدم تشريعًا داخليًا ودوليًا للعلاقات البشرية في السلم والحرب. عرّف الإرهاب بلسانه بأنه العدوان أو التخويف أو التهديد ماديًا أو معنويًا الصادر من الدول أو الجماعات أو الأفراد على الإنسان دينًا أو نفسًا أو عرضًا أو عقلًا أو مالًا بغير حق، ومن صور الإفساد في الأرض، وأكد من وجهة نظر المجمع أن الجهاد والاستشهاد لنشر العقيدة والدفاع عنها وعن حرمة الأوطان ليس إرهابًا بل دفاع عن حقوق أساسية في رؤية القرار، مشيرًا إلى حق الشعوب الواقعة تحت الاحتلال في السعي لحريتها. سُجّل بوصفه نص المجمع ذاته."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It stated that Islam honours the human being as such and affirms his rights and sanctities, and that Islamic fiqh was the first law to provide internal and international legislation for human relations in peace and war. In its own wording it defined terrorism as aggression, intimidation or threat, physical or moral, issuing from states, groups or individuals against a person's religion, life, honour, mind or property without right, and a form of corruption on earth; and the Academy affirmed its position that jihad and martyrdom to spread the creed and defend it and the homeland's sanctity is not terrorism but defence of fundamental rights in the resolution's view, referring to occupied peoples' right to seek freedom. Recorded as the Academy's own text."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ نص: اسلام انسان کو بحیثیت انسان عزت دیتا ہے اور اس کے حقوق و حرمات مقرر کرتا ہے، اور اسلامی فقہ پہلی فقہ ہے جس نے امن و جنگ میں انسانی تعلقات کے لیے داخلی و بین الاقوامی تشریع پیش کی۔ اس کی اپنی تعریف میں دہشت گردی وہ جارحیت، دہشت یا دھمکی ہے — مادی یا معنوی — جو ریاستوں، گروہوں یا افراد سے کسی کے دین، جان، عزت، عقل یا مال پر ناحق ہو اور زمین میں فساد کی صورت ہے؛ اور اکیڈمی کے مؤقف کے مطابق عقیدے کے نشر اور دفاع اور وطن کی حرمت کے لیے جہاد و شہادت دہشت گردی نہیں بلکہ بنیادی حقوق کا دفاع ہے، مقبوضہ اقوام کے آزادی کے حق کے ساتھ۔ یہاں اکیڈمی کے اپنے متن کا امانت دارانہ تلخیص درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (8-13 de Dhu al-Qa'da de 1423, 11-16 de enero de 2003). En ella se afirma que el Islam honra al ser humano como tal y afirma sus derechos y santidades, y que la jurisprudencia islámica fue la primera ley en proporcionar legislación interna e internacional para las relaciones humanas en tiempos de paz y de guerra. En su propia redacción, define el terrorismo como agresión, intimidación o amenaza, física o moral, proveniente de estados, grupos o individuos contra la religión, la vida, el honor, la mente o la propiedad de una persona sin derecho alguno, y una forma de corrupción en la tierra; y la Academia afirma su posición de que la yihad y el martirio para difundir el credo y defenderlo, así como la santidad de la patria, no constituyen terrorismo, sino defensa de los derechos fundamentales, en referencia al derecho de los pueblos ocupados a buscar la libertad. Registrada como texto propio de la Academia."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003). Elle affirmait que l'islam honore l'être humain en tant que tel et reconnaît ses droits et son caractère sacré, et que la jurisprudence islamique (fiqh) fut la première loi à établir une législation interne et internationale régissant les relations humaines en temps de paix comme en temps de guerre. Elle définissait le terrorisme comme une agression, une intimidation ou une menace, physique ou morale, émanant d'États, de groupes ou d'individus, visant sans fondement la religion, la vie, l'honneur, la conscience ou les biens d'une personne, et comme une forme de corruption sur terre. L'Académie réaffirmait que le jihad et le martyre, pratiqués pour propager la foi et défendre la patrie, ne constituent pas du terrorisme mais la défense des droits fondamentaux, notamment le droit des peuples occupés à rechercher la liberté. Ce texte est conservé par l'Académie."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki on dördüncü oturumunda (8–13 Zhu-al-Qi'de 1423 H, 11–16 Ocak 2003) toplu kararı. İslam'ın insanları insan olarak onurlandırdığını, haklarını tesis etmek ve kutsallıklarını korumakla ilgilendiğini, ayrıca İslami fıkıhın barış ve savaşta insan ilişkileri için iç ve uluslararası mevzuat sağlayan dünyadaki ilk hukuk olduğunu belirtmektedir. Terörizm, diliyle devletler, gruplar veya bireyler tarafından din, yaşam, onur, akıl veya mülk açısından haksız bir kişiye yönelik saldırı, yıldırma veya fiziksel ya da ahlaki tehditler olarak tanımlanmış ve yeryüzünde bir yolsuzluk biçimi olarak tanımlanmıştır. Meclis bakış açısından, inancı yaymak, savunmak ve vatanların kutsallığını savunmak için cihad ve şehitliğin terörizm değil, karar alma sürecini görme temel haklarının savunulması olduğunu ve işgal altındaki halkların özgürlüklerini arama hakkına işaret ettiğini teyit etmiştir. Bu, Akademi'nin metni olarak kaydedilmiştir."
  id: "Resolusi kolektif Akademi Fiqh Islam Internasional dalam sesi keempat belas di Doha (8–13 Dhu al-Qi'dah 1423 H, 11–16 Januari 2003 M). Dinyatakan bahwa Islam menghormati manusia sebagai manusia dan peduli pada penetapan hak serta pelestarian kesucian mereka, serta bahwa yurisprudensi Islam adalah yurisprudensi pertama di dunia yang menyediakan undang-undang domestik dan internasional untuk hubungan manusia dalam perdamaian dan perang. Terorisme didefinisikan dengan bahasanya sebagai agresi, intimidasi, atau ancaman fisik atau moral yang dikeluarkan oleh negara, kelompok, atau individu terhadap seseorang tanpa hak, baik dalam agama, kehidupan, kehormatan, akal, maupun properti, serta sebagai bentuk korupsi di bumi. Dari sudut pandang Majelis, Majelis menegaskan bahwa jihad dan kemartiran untuk menyebarkan iman, membelanya, dan mempertahankan kesucian tanah air bukanlah terorisme melainkan pembelaan hak-hak fundamental untuk melihat pengambilan keputusan, menunjuk pada hak bangsa-bangsa yang diduduki untuk mencari kebebasan mereka. Ini tercatat sebagai teks Akademi itu sendiri."
