summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: لا يجوز صرف أموال الزكاة لدعم وقفية صندوق التضامن الإسلامي لأن في ذلك حبسًا للزكاة عن مصارفها الشرعية، وللصندوق أن يكون وكيلًا عن الأشخاص والهيئات في صرف الزكاة في وجوهها بشروط الوكالة المقررة على ما فصّل القرار."
  en: "IIFA's fourth-session resolution 27 (2/4) (Jeddah, February 1988): zakat funds may not be spent to support the Islamic Solidarity Fund's endowment, as that would withhold zakat from its sharia-fixed channels; the Fund may act as agent for persons and bodies in disbursing zakat under the stated conditions of agency."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد 27 (2/4) ⁦(جدہ، فروری 1988ء)⁩: فنڈ کی وقفیت کو زکوٰۃ دینا جائز نہیں؛ تاہم فنڈ مقررہ شرائط پر زکوٰۃ تقسیم کا وکیل بن سکتا ہے۔"
