id: work/fatwa-iifa-s4-zakat-solidarity-fund
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 27 (2/4) بشأن صرف الزكاة لصالح صندوق التضامن الإسلامي", en: "IIFA resolution 27 (2/4) on paying zakat to the Islamic Solidarity Fund", ur: "اکیڈمی کی قرارداد 27 (2/4): اسلامی یکجہتی فنڈ کو زکوٰۃ", es: "Resolución 27 (2/4) de la IIFA sobre el pago del zakat al Fondo de Solidaridad Islámica.", fr: "Résolution 27 (2/4) de l'IIFA relative au versement de la zakat au Fonds de solidarité islamique" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: لا يجوز صرف أموال الزكاة لدعم وقفية صندوق التضامن الإسلامي لأن في ذلك حبسًا للزكاة عن مصارفها الشرعية، وللصندوق أن يكون وكيلًا عن الأشخاص والهيئات في صرف الزكاة في وجوهها بشروط الوكالة المقررة على ما فصّل القرار."
  en: "IIFA's fourth-session resolution 27 (2/4) (Jeddah, February 1988): zakat funds may not be spent to support the Islamic Solidarity Fund's endowment, as that would withhold zakat from its sharia-fixed channels; the Fund may act as agent for persons and bodies in disbursing zakat under the stated conditions of agency."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد 27 (2/4) ⁦(جدہ، فروری 1988ء)⁩: فنڈ کی وقفیت کو زکوٰۃ دینا جائز نہیں؛ تاہم فنڈ مقررہ شرائط پر زکوٰۃ تقسیم کا وکیل بن سکتا ہے۔"
  es: "Resolución 27 (2/4) de la cuarta sesión de la IIFA (Yeda, febrero de 1988): los fondos del zakat no pueden utilizarse para apoyar la dotación del Fondo de Solidaridad Islámica, ya que eso impediría que el zakat se canalice a través de sus vías establecidas por la sharia; el Fondo puede actuar como agente de personas y entidades en el desembolso del zakat bajo las condiciones de agencia establecidas."
  fr: "Résolution 27 (2/4) de la quatrième session de l'IIFA (Djeddah, février 1988): les fonds de la zakat ne peuvent pas être dépensés pour soutenir la dotation du Fonds de solidarité islamique, car cela priverait la zakat de ses canaux fixés par la charia; le Fonds peut agir comme agent pour des personnes et des organismes dans la distribution de la zakat dans les conditions d'agence énoncées."
