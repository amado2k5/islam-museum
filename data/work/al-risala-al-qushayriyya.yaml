summary:
  ar: "رسالة كتبها أبو القاسم عبد الكريم بن هوازن القشيري ⁦(ت 465هـ)⁩ «إلى جماعة الصوفية ببلدان الإسلام» سنة 437هـ، يشكو فيها فترة الطريقة في زمانه، ويبدأ ببيان اعتقاد شيوخ الطائفة في مسائل الأصول، ثم يترجم لثلاثة وثمانين من مشايخهم، ويفسر ألفاظهم، ويعقد أبواباً للمقامات والأحوال من التوبة إلى المحبة والسماع والكرامات، ويختم بوصية للمريدين {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}."
  en: "An epistle written by Abu al-Qasim 'Abd al-Karim ibn Hawazin al-Qushayri (d. 465 AH) 'to the community of Sufis in the lands of Islam' in 437 AH, lamenting the decline of the path in his time; it opens with the creed of the shaykhs on the principles of religion, gives notices of eighty-three of their masters, explains their terms, devotes chapters to the stations and states from repentance to love, audition and miracles, and ends with counsel to disciples {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}."
  ur: "ابو القاسم عبد الکریم بن ہوازن قشیری ⁦(م 465ھ)⁩ کا رسالہ جو انہوں نے 437ھ میں «بلادِ اسلام کے صوفیہ کی جماعت کے نام» لکھا، جس میں اپنے زمانے میں طریق کی کمزوری کا شکوہ ہے؛ یہ مشائخ کے اصولی عقیدے سے شروع ہو کر ان کے تراسی مشائخ کے تراجم، ان کی اصطلاحات کی تشریح، توبہ سے محبت، سماع اور کرامات تک مقامات و احوال کے ابواب، اور مریدوں کو وصیت پر ختم ہوتا ہے {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}۔"
