label: { ar: "الرسالة القشيرية", en: "Al-Risala al-Qushayriyya (The Epistle of al-Qushayri)", ur: "الرسالۃ القشیریہ", es: "Al-Risala al-Qushayriyya (La Epístola de al-Qushayri)", fr: "Al-Risala al-Qushayriyya (L'épître d'al-Qushayri)", tr: "Qushayri Mektubu", id: "Surat Qushayri" }
summary:
  ar: "رسالة كتبها أبو القاسم عبد الكريم بن هوازن القشيري ⁦(ت 465هـ)⁩ «إلى جماعة الصوفية ببلدان الإسلام» سنة 437هـ، يشكو فيها فترة الطريقة في زمانه، ويبدأ ببيان اعتقاد شيوخ الطائفة في مسائل الأصول، ثم يترجم لثلاثة وثمانين من مشايخهم، ويفسر ألفاظهم، ويعقد أبواباً للمقامات والأحوال من التوبة إلى المحبة والسماع والكرامات، ويختم بوصية للمريدين {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}."
  en: "An epistle written by Abu al-Qasim 'Abd al-Karim ibn Hawazin al-Qushayri (d. 465 AH) 'to the community of Sufis in the lands of Islam' in 437 AH, lamenting the decline of the path in his time; it opens with the creed of the shaykhs on the principles of religion, gives notices of eighty-three of their masters, explains their terms, devotes chapters to the stations and states from repentance to love, audition and miracles, and ends with counsel to disciples {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}."
  ur: "ابو القاسم عبد الکریم بن ہوازن قشیری ⁦(م 465ھ)⁩ کا رسالہ جو انہوں نے 437ھ میں «بلادِ اسلام کے صوفیہ کی جماعت کے نام» لکھا، جس میں اپنے زمانے میں طریق کی کمزوری کا شکوہ ہے؛ یہ مشائخ کے اصولی عقیدے سے شروع ہو کر ان کے تراسی مشائخ کے تراجم، ان کی اصطلاحات کی تشریح، توبہ سے محبت، سماع اور کرامات تک مقامات و احوال کے ابواب، اور مریدوں کو وصیت پر ختم ہوتا ہے {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}۔"
  es: "Una epístola escrita por Abu al-Qasim 'Abd al-Karim ibn Hawazin al-Qushayri (m. 465 AH) 'a la comunidad de sufíes en las tierras del Islam' en 437 AH, lamentando el declive del camino en su tiempo; comienza con el credo de los shaykhs sobre los principios de la religión, da avisos de ochenta y tres de sus maestros, explica sus términos, dedica capítulos a las estaciones y estados desde el arrepentimiento hasta el amor, la audición y los milagros, y termina con consejos a los discípulos {cite:risala-qushayriyya-minhaj-2017 p. 40} {cite:risala-qushayriyya-minhaj-2017 p. 80} {cite:risala-qushayriyya-minhaj-2017 p. 84} {cite:risala-qushayriyya-minhaj-2017 p. 771}."
  fr: "Épître écrite par Abu al-Qasim 'Abd al-Karim ibn Hawazin al-Qushayri (mort en 465 AH) « à la communauté des soufis des terres d'Islam » en 437 AH, déplorant le déclin de la voie soufie à son époque; elle s'ouvre sur le credo des cheikhs concernant les principes de la religion, présente quatre-vingt-trois de leurs maîtres, explique leurs termes, consacre des chapitres aux étapes et états de la vie, du repentir à l'amour, en passant par l'audition et les miracles, et se termine par des conseils aux disciples. 771}."
  tr: "Ebu el-Kasım Abdülkerim bin Hawazin el-Kuşayri'nin (ö. 465 Hicri) 437 Hicri yılında \"İslam topraklarındaki Sufi Grubuna\" yazdığı mektupta, kendi zamanındaki manevi yol döneminden şikayet ederek, mezhebin şeyhlerinin ilkelerdeki inançlarını açıklamakla başlar, ardından seksen üç öğretmenlerini çevirir, sözlerini ve tövbeden sevgiye, işitmeye ve mucizelere kadar durum ve durum bölümlerini açıklar ve öğrencilere bir vasiyetle sona erer {cite:risala-qushayriyya-minhaj-2017 s. 40} {cite:risala-qushayriyya-minhaj-2017 s. 771}}"
  id: "Surat yang ditulis oleh Abu al-Qasim Abd al-Karim ibn Hawazin al-Qushayri (wafat 465 H) \"kepada Kelompok Sufi di Tanah Islam\" pada tahun 437 H, di mana ia mengeluhkan masa jalan spiritual pada zamannya, dimulai dengan menjelaskan keyakinan para sheikh sekte dalam hal prinsip, kemudian menerjemahkan delapan puluh tiga guru mereka, menjelaskan kata-kata mereka, dan bab tentang tahapan dan kondisi dari pertobatan hingga cinta, pendengaran, dan mukjizat, serta mengakhiri dengan wasiat kepada para murid {cite:risala-qushayriyya-minhaj-2017 hlm. 40} {cite:risala-qushayriyya-minhaj-2017 hlm. 771}."
