label:
  ar: "أصداف اللؤلؤ"
  en: "Asdaf al-Lu'lu': Shells of Pearl"
  ur: "اصداف اللؤلؤ: موتیوں کی سیپیاں"
summary:
  ar: "برنامج رمضاني مصوّر من ثلاثين حلقة في بيت أبي إسحاق الحويني: كل حلقة جولة في مكتبته بين رفوف الحديث والفقه والأصول والتاريخ والتفسير، ثم لقاء يروي فيه سيرته العلمية من خلال الكتب، من قراءته الأدبية في صباه وأول كتاب اشتراه، إلى شيوخه والألباني وكشك، ومحنه، وخطابته، ثم مؤلفاته ومشاريعه، ويُختم برثاء صاحبه شكري. لا يُنطق العنوان في الحلقات ولا يُذكر اسم المحاور."
  en: "A filmed Ramadan programme of thirty episodes in Abu Ishaq al-Heweny's home: each episode tours his library, along the shelves of hadith, fiqh, legal theory, history and tafsir, then an interview in which he tells his scholarly life through books, from his boyhood literary reading and the first book he bought to his teachers, al-Albani and Kishk, his trials and his preaching, then his works and projects, closing with a tribute to his companion Shukri. The title is never spoken and the interviewer is not named."
  ur: "ابو اسحاق حوینی کے گھر میں تیس اقساط کا ایک رمضانی ویڈیو پروگرام: ہر قسط ان کی لائبریری میں حدیث، فقہ، اصول، تاریخ اور تفسیر کی الماریوں کی سیر ہے، پھر ایک انٹرویو جس میں وہ کتابوں کے حوالے سے اپنی علمی زندگی سناتے ہیں، لڑکپن کے ادبی مطالعے اور پہلی خریدی گئی کتاب سے لے کر اپنے اساتذہ، البانی اور کشک، اپنی آزمائشوں اور خطابت تک، پھر اپنی تصانیف اور منصوبے، اور آخر میں اپنے رفیق شکری کو خراجِ عقیدت۔ اقساط میں عنوان نہیں بولا جاتا اور میزبان کا نام نہیں آتا۔"
