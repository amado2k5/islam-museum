label: { ar: "قرار مجمع الفقه الإسلامي الدولي 247 (25/9) بشأن ضوابط إعمال مقاصد الشريعة في توجيه المعاملات المالية المعاصرة بما يتوافق مع أحكام الشريعة الإسلامية", en: "IIFA resolution 247 (25/9) on the controls for applying the objectives of the sharia in directing contemporary financial transactions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 247 (25/9): عصری مالی معاملات کی رہنمائی میں مقاصدِ شریعت کے اطلاق کے ضوابط", es: "Resolución 247 (25/9) de la IIFA sobre los controles para la aplicación de los objetivos de la sharia en la dirección de las transacciones financieras contemporáneas.", fr: "Résolution 247 (25/9) de l'IIFA relative aux contrôles d'application des objectifs de la charia dans la direction des opérations financières contemporaines", tr: "Uluslararası İslami Fiqh Akademisi Kararı 247 (25/9), İslami Şeriat hükümlerine uygun olarak çağdaş finansal işlemlerin yönlendirilmesinde Şeriatın amaçlarının uygulanmasına yönelik kontrollerle ilgili", id: "Resolusi Akademi Fiqh Islam Internasional 247 (25/9) mengenai pengawasan penerapan tujuan Syariah dalam mengarahkan transaksi keuangan kontemporer sesuai dengan ketentuan Syariah Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، مؤكدًا قراره 167 ⁦(5/18)⁩ في المقاصد الشرعية ودورها في استنباط الأحكام. عرّف المجمع مقاصد الشريعة في المعاملات المالية بأنها المعاني والغايات التي تهدف الشريعة إلى تحقيقها منها كالعدل في المعاملة وتداول المال ورواجه ووضوحه وحفظه وتنميته. وقرر أن على المجالس والهيئات الشرعية استحضارها وضوابطها وتنزيلها على الوقائع والنوازل، ومن أهم الضوابط: ألا تخالف ما هو أقوى منها من الأدلة الشرعية؛ ومراعاة أنواعها ومراتبها أصالة وتبعية وكلية وجزئية وقطعية وظنية فلا يقدم الظني على القطعي ولا الجزئي على الكلي ولا التبعي على الأصلي؛ ومراعاة المقاصد الكلية الخمسة عند إعمال مقاصد المعاملات؛ والتمييز بين المقاصد والوسائل فلا تعود الوسيلة على المقصد بالنقض ولا يترك المقصد الثابت لمنع وسيلة؛ وتجوز الاستفادة منها في صياغة العقود الحديثة وتفسيرها وحل منازعاتها عند الجوائح والطوارئ في ضوء مقصد العدل والرواج والوضوح والثبات؛ والتحقق بها من واقعية المعاملات المعاصرة وعدم صوريتها؛ ومراعاة مآلاتها. وأوصى بمزيد اهتمام الجامعات والمراكز بالمقاصد دراسة وتدريسًا وتوجيه الباحثين لإتقان علوم الاقتصاد والمالية المعاصرة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), reaffirming its resolution 167 (5/18) on the sharia objectives and their role in deriving rulings. It defined the objectives of the sharia in financial transactions as the meanings and ends the sharia seeks through them — justice in dealings, the circulation, flow, transparency, preservation and growth of wealth. It ruled that sharia councils and bodies should keep them in view with their controls when applying them to cases and new events, the chief controls being: they may not contradict stronger recognised evidences; their kinds and ranks must be observed — primary versus subordinate, universal versus particular, certain versus probabilistic — the probabilistic never preferred to the certain, the particular to the universal, the subordinate to the primary; the five universal objectives must be kept in view when applying transaction objectives; objectives must be distinguished from means, so a means does not overturn its end nor is an established end abandoned to block a means; they may inform drafting, interpreting and settling disputes of modern contracts under pandemics and emergencies in light of justice, flow, transparency and stability; they serve to verify the substance of contemporary transactions against mere form; and their outcomes must be weighed. It recommended that universities give more attention to the objectives in study and teaching and direct specialists to master contemporary economics and finance."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی قرارداد 167 ⁦(5/18)⁩ ⁦(مقاصدِ شریعت اور احکام کے استنباط میں ان کا کردار)⁩ کی تائید کرتے ہوئے۔ اکیڈمی نے مالی معاملات میں مقاصدِ شریعت کی تعریف ان معانی اور غایات کے طور پر کی جنہیں شریعت ان معاملات سے حاصل کرنا چاہتی ہے — معاملے میں عدل، مال کی گردش و رواج، اس کی شفافیت، حفاظت اور نشوونما۔ اس نے فیصلہ کیا کہ شرعی مجالس اور اداروں کو وقائع و نوازل پر ان کے اطلاق میں ان کے ضوابط کی رعایت کرنی چاہیے، جن میں اہم یہ ہیں: وہ مضبوط تر شرعی دلائل کی مخالفت نہ کریں؛ ان کی اقسام اور مرتبے — اصلی بمقابلہ فرعی، کلی بمقابلہ جزئی، قطعی بمقابلہ ظنی — کی رعایت ہو، ظنی کو قطعی، جزئی کو کلی، فرعی کو اصلی پر نہ بڑھایا جائے؛ معاملات کے مقاصد کے اطلاق میں پانچ کلی مقاصد کی رعایت ہو؛ مقاصد اور وسائل میں فرق ہو، وسیلہ اپنے مقصد کو نقض نہ کرے اور ثابت مقصد کسی وسیلے کی روک کے سبب نہ چھوڑا جائے؛ ان سے جدید معاہدوں کی صیاغت، تعبیر اور وباؤں و اچانک حالات میں تنازعات کا حل عدل، رواج، شفافیت اور ثبات کے مقصد کی روشنی میں ممکن ہے؛ ان سے عصری معاملات کی حقیقت کی تصدیق صوری ظاہر کے خلاف ہو؛ اور ان کے انجام کی رعایت ہو۔ سفارشات میں جامعات و مراکز کی جانب سے مقاصد کی تدریس و تحقیق پر مزید توجہ اور ماہرین کی راہنمائی برائے عصری معیشت و مالیات شامل ہے۔"
  es: "Una resolución colectiva de la Academia Internacional de Fiqh Islámico en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023), reafirmando su resolución 167 (5/18) sobre los objetivos de la sharia y su papel en la derivación de resoluciones. Definió los objetivos de la sharia en las transacciones financieras como los significados y fines que la sharia busca a través de ellas: justicia en las transacciones, circulación, flujo, transparencia, preservación y crecimiento de la riqueza. Dictaminó que los consejos y organismos de la sharia deben tenerlos en cuenta con sus controles cuando los aplican a casos y nuevos eventos, siendo los controles principales: no pueden contradecir pruebas reconocidas más sólidas; sus tipos y rangos deben observarse: primario versus subordinado, universal versus particular, cierto versus probabilístico: el probabilístico nunca se prefiere al cierto, el particular al universal, el subordinado al primario; los cinco objetivos universales deben tenerse en cuenta cuando se aplican los objetivos de transacción; Es necesario distinguir los objetivos de los medios, de modo que un medio no anule su fin ni se abandone un fin establecido para impedir un medio; pueden orientar la redacción, interpretación y resolución de controversias en contratos modernos durante pandemias y emergencias, teniendo en cuenta la justicia, la fluidez, la transparencia y la estabilidad; sirven para verificar la sustancia de las transacciones contemporáneas frente a la mera forma; y sus resultados deben sopesarse. Se recomendó que las universidades prestaran mayor atención a los objetivos en el estudio y la docencia, y que orientaran a los especialistas hacia el dominio de la economía y las finanzas contemporáneas."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, soit du 20 au 23 février 2023) réaffirme sa résolution 167 (5/18) relative aux objectifs de la charia et à leur rôle dans l'élaboration des décisions juridiques. Elle définit les objectifs de la charia en matière de transactions financières comme les significations et les fins qu'elle poursuit à travers elles: la justice dans les transactions, la circulation, le flux, la transparence, la préservation et la croissance des richesses. Elle stipule que les conseils et instances de la charia doivent en tenir compte lors de leur application à des cas et événements nouveaux, les principaux critères étant les suivants: les objectifs ne doivent pas contredire des preuves reconnues plus solides; leur nature et leur hiérarchie doivent être respectées – principal versus subordonné, universel versus particulier, certain versus probabiliste – le probabiliste ne devant jamais être préféré au certain, le particulier à l'universel, ni le subordonné au principal; les cinq objectifs universels doivent être pris en compte lors de l'application des objectifs transactionnels. Il convient de distinguer les objectifs des moyens, afin qu'un moyen ne compromette pas sa fin et qu'une fin établie ne soit pas abandonnée au profit d'un moyen. Les objectifs peuvent éclairer la rédaction, l'interprétation et le règlement des litiges contractuels modernes en période de pandémie et d'urgence, dans une perspective de justice, de fluidité, de transparence et de stabilité. Ils permettent de vérifier la validité du fond des transactions contemporaines par rapport à leur simple forme, et leurs conséquences doivent être évaluées. Il est recommandé aux universités d'accorder une plus grande importance aux objectifs dans leurs études et leur enseignement et d'inciter les spécialistes à maîtriser l'économie et la finance contemporaines."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Cidde'deki yirmi beşinci oturumunda (29 Rajab – 3 Şa'ban 1444 H, 20–23 Şubat 2023) toplu kararı, Şeriatın amaçları ve hükümlerin çıkarılmasındaki rolü hakkındaki 167 (5/18) sayılı kararını teyit etmiştir. Akademi, Şeriat'ın finansal işlemlerdeki hedeflerini, işlemlerde adalet, servetin dolaşımı, akışı, açıklığı, korunması ve gelişimi gibi Şeriatın ulaşmayı amaçladığı anlamlar ve hedefler olarak tanımlamıştır. Dini konseylerin ve organların gerçekleri ve hukuki konuları hatırlayıp yönetmeliklerini uygulaması gerektiğine karar verdi. En önemli kriterler arasında: daha güçlü hukuki kanıtlarla çelişmemek; türlerini ve düzeylerini—orijinal, ikincil, genel, özel, kesin ve spekülatif—gözlemlemek, böylece varsayım, kesin ve genel olanlar üzerinde değil; işlemlerin hedefleri uygulanırken beş genel hedefe uyulmalı; amaçlar ile araçlar arasındaki ayrım, böylece araçların amaçlanan amacın önüne geçmemesi ve belirlenmiş amaç bir aracı engellememesi; adalet, popülerlik, açıklık ve istikrar hedefi ışığında acil durumlar ve acil durumlar sırasında anlaşmazlıkların hazırlanması, yorumlanması ve çözümünde bunlardan yararlanılması; çağdaş işlemlerin gerçekçiliğini doğrulamak ve resmi olmamak; ve sonuçlarını dikkate almak. Üniversitelerin ve merkezlerin, araştırmacıları çağdaş ekonomi ve finans bilimlerinde ustalaşmaya yönlendirirken hedeflere daha fazla önem vermelerini tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023), menegaskan resolusi 167 (18/5) tentang tujuan Syariah dan perannya dalam merumuskan keputusan. Akademi mendefinisikan tujuan Syariah dalam transaksi keuangan sebagai makna dan tujuan yang ingin dicapai Syariah, seperti keadilan dalam transaksi, sirkulasi kekayaan, aliran, kejelasan, pelestarian, dan pengembangan. Ia memutuskan bahwa dewan dan badan agama harus mengingat dan menerapkan peraturan mereka pada fakta dan isu hukum. Di antara kriteria terpenting adalah: tidak bertentangan dengan bukti hukum yang lebih kuat; mengamati jenis dan tingkatnya—asli, subordinat, umum, khusus, definitif, dan spekulatif—sehingga dugaan tidak diutamakan daripada definitif, parsial atas umum, maupun bergantung atas asli; lima tujuan umum harus dipatuhi saat menerapkan tujuan transaksi; membedakan antara tujuan dan sarana, sehingga sarana tidak mengalahkan tujuan yang dimaksudkan, dan tujuan yang telah ditetapkan tidak dibiarkan untuk mencegah sarana; diperbolehkan memanfaatkan cara tersebut dalam merumuskan, menafsirkan, dan menyelesaikan sengketa selama keadaan darurat dan darurat dengan tujuan keadilan, popularitas, kejelasan, dan stabilitas; memverifikasi realisme transaksi kontemporer dan tidak formal; serta mempertimbangkan hasilnya. Ia merekomendasikan agar universitas dan pusat lebih memperhatikan tujuan dalam mempelajari, mengajar, dan membimbing peneliti untuk menguasai ilmu ekonomi dan keuangan kontemporer."
