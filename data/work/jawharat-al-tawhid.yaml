summary:
  ar: "جوهرة التوحيد لإبراهيم اللقاني المالكي ⁦(ت. 1041هـ)⁩ منظومة في مائة وأربعة وأربعين بيتاً على بحر الرجز جمعت أصول الاعتقاد في الإلهيات والنبوات والسمعيات؛ متن العقيدة المدرسي عند الأزهرية {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Jawharat al-Tawhid by Ibrahim al-Laqani al-Maliki (d. 1041 AH) — a didactic poem of a hundred and forty-four rajaz lines gathering the foundations of belief in the divine, the prophetic and the reports; the Azhari school's aqida text {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Jawharat al-Tawhid de Ibrahim al-Laqani al-Maliki (m. 1041 d. H.): un poema didáctico de ciento cuarenta y cuatro líneas rajaz que reúne los fundamentos de la creencia en lo divino, lo profético y los informes; texto aqida de la escuela Azhari {cita:al-mutun-al-ilmiyya-azhar} {cita:al-aalam}."
  fr: "Jawharat al-Tawhid d'Ibrahim al-Laqani al-Maliki (mort en 1041 AH) — un poème didactique de cent quarante-quatre vers rajaz rassemblant les fondements de la croyance au divin, au prophétique et aux rapports; le texte aqida de l'école Azhari {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "جواہرات التوحید از ابراہیم اللاقانی المالکی ⁦(متوفی 1041ھ)⁩ - ایک سو چالیس رجز سطروں کی ایک نثری نظم جو الہی، پیغمبری اور رپورٹوں پر یقین کی بنیادوں کو جمع کرتی ہے۔ ازہری مکتبہ کا عقیدہ متن {حوالہ: الموتن العلمیہ ازہر} {حوالہ: العالم}۔"
  tr: "İbrahim el-Laqani el-Maliki'nin (ö. 1041 Hicri) Tek Tanrıcılığın Mücevheri, rajaz ölçüsünde yüz kırk dört dizeden oluşan bir şiirdir; ilahiyete, kehanete ve işitsel inancın temellerini derler; Azhari okulunun metin inancını {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam} (cite:al-aalam} içerir."
  id: "Permata Monoteisme karya Ibrahim al-Laqani al-Maliki (wafat 1041 H) adalah sebuah puisi yang terdiri dari seratus empat puluh empat bait dalam meter rajaz, mengumpulkan dasar-dasar kepercayaan pada ketuhanan, nubuat, dan pendengaran; kredo tekstual mazhab Azhari {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
