id: work/fatwa-aliftaa-jo-forex-trading-with-leverage
class: work
kind: fatwa
label: { ar: "التداول بالفوركس والرافعة المالية", en: "Forex trading and leverage", ur: "فاریکس ٹریڈنگ اور لیوریج" }
summary:
  ar: "سؤال عن التداول بالفوركس مع قول بعض الشركات إن الرافعة المالية ليست قرضًا ولا عمولات تبييت فيها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الرافعة المالية قرض جر نفعًا للمقرض، فلا يجوز التعامل بأي معاملة تتضمنها. أجابت الدائرة بأن التكييف الفقهي للرافعة المالية أنها قرض من الوسيط للمتداول، فإن كان بفائدة فهو ربا، وإن كان بلا فائدة فهو ربا أيضًا لأن الوسيط يستفيد العمولة المتفق عليها على كل عملية، ولأنه جمع بين سلف وبيع. وقالت إن للرافعة أثرًا حقيقيًا، إذ تضاعف رأس مال المتداول وأرباحه ومخاطره، ويجني الوسيط بها عمولات أكثر مما لو تاجر المتداول برأس ماله وحده، فليست مبالغ وهمية. وخلصت إلى أنه لا يجوز التعامل بأي معاملة تتضمن نظام الرافعة المالية لكونها قرضًا ربويًا، وأن ذلك كافٍ في الحكم بحرمة المعاملة المسؤول عنها."
  en: "A question on forex trading where some companies say leverage is not a loan and charge no swap fees, in which Jordan's General Iftaa Department answered that leverage is a loan that brings a benefit to the lender, so any transaction involving it is not allowed. The Department answered that leverage is, in fiqh terms, a loan from the broker to the trader; with interest it is clearly riba, and without interest it is still riba, because the broker gains the agreed commission on every transaction and because it combines a loan with a sale. It said leverage has a real effect: it multiplies the trader's capital, profits and risk, and earns the broker more commission than if the trader used only his own capital, so it is not a notional sum. It concluded that no transaction involving leverage is allowed, since it is an interest-bearing loan, and that this alone suffices to rule the transaction asked about forbidden."
  ur: "فاریکس ٹریڈنگ کے بارے میں سوال جس میں بعض کمپنیاں کہتی ہیں کہ لیوریج قرض نہیں اور سواپ فیس نہیں لی جاتی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ لیوریج ایسا قرض ہے جو قرض دینے والے کو فائدہ پہنچاتا ہے، لہٰذا اس پر مشتمل کوئی معاملہ جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہی طور پر لیوریج بروکر کی طرف سے ٹریڈر کو قرض ہے؛ سود کے ساتھ ہو تو واضح سود ہے، اور سود کے بغیر بھی سود ہے، کیونکہ بروکر ہر لین دین پر طے شدہ کمیشن کماتا ہے اور اس میں قرض اور بیع جمع ہوتے ہیں۔ اس نے کہا کہ لیوریج کا حقیقی اثر ہے: یہ ٹریڈر کا سرمایہ، منافع اور خطرہ کئی گنا کرتا ہے، اور بروکر کو اس سے زیادہ کمیشن ملتا ہے بنسبت اس کے کہ ٹریڈر صرف اپنے سرمائے سے تجارت کرے، اس لیے یہ فرضی رقم نہیں۔ اس نے نتیجہ نکالا کہ لیوریج پر مشتمل کوئی معاملہ جائز نہیں کیونکہ یہ سودی قرض ہے، اور پوچھے گئے معاملے کی حرمت کے لیے یہی کافی ہے۔"
