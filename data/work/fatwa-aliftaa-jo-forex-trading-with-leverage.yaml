id: work/fatwa-aliftaa-jo-forex-trading-with-leverage
class: work
kind: fatwa
label: { ar: "التداول بالفوركس والرافعة المالية", en: "Forex trading and leverage", ur: "فاریکس ٹریڈنگ اور لیوریج", es: "Operaciones de divisas y apalancamiento", fr: "Trading Forex et effet de levier", tr: "Forex ve kaldıraçlı ticaret", id: "Trading forex dan leverage" }
summary:
  ar: "سؤال عن التداول بالفوركس مع قول بعض الشركات إن الرافعة المالية ليست قرضًا ولا عمولات تبييت فيها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الرافعة المالية قرض جر نفعًا للمقرض، فلا يجوز التعامل بأي معاملة تتضمنها. أجابت الدائرة بأن التكييف الفقهي للرافعة المالية أنها قرض من الوسيط للمتداول، فإن كان بفائدة فهو ربا، وإن كان بلا فائدة فهو ربا أيضًا لأن الوسيط يستفيد العمولة المتفق عليها على كل عملية، ولأنه جمع بين سلف وبيع. وقالت إن للرافعة أثرًا حقيقيًا، إذ تضاعف رأس مال المتداول وأرباحه ومخاطره، ويجني الوسيط بها عمولات أكثر مما لو تاجر المتداول برأس ماله وحده، فليست مبالغ وهمية. وخلصت إلى أنه لا يجوز التعامل بأي معاملة تتضمن نظام الرافعة المالية لكونها قرضًا ربويًا، وأن ذلك كافٍ في الحكم بحرمة المعاملة المسؤول عنها."
  en: "A question on forex trading where some companies say leverage is not a loan and charge no swap fees, in which Jordan's General Iftaa Department answered that leverage is a loan that brings a benefit to the lender, so any transaction involving it is not allowed. The Department answered that leverage is, in fiqh terms, a loan from the broker to the trader; with interest it is clearly riba, and without interest it is still riba, because the broker gains the agreed commission on every transaction and because it combines a loan with a sale. It said leverage has a real effect: it multiplies the trader's capital, profits and risk, and earns the broker more commission than if the trader used only his own capital, so it is not a notional sum. It concluded that no transaction involving leverage is allowed, since it is an interest-bearing loan, and that this alone suffices to rule the transaction asked about forbidden."
  ur: "فاریکس ٹریڈنگ کے بارے میں سوال جس میں بعض کمپنیاں کہتی ہیں کہ لیوریج قرض نہیں اور سواپ فیس نہیں لی جاتی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ لیوریج ایسا قرض ہے جو قرض دینے والے کو فائدہ پہنچاتا ہے، لہٰذا اس پر مشتمل کوئی معاملہ جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ فقہی طور پر لیوریج بروکر کی طرف سے ٹریڈر کو قرض ہے؛ سود کے ساتھ ہو تو واضح سود ہے، اور سود کے بغیر بھی سود ہے، کیونکہ بروکر ہر لین دین پر طے شدہ کمیشن کماتا ہے اور اس میں قرض اور بیع جمع ہوتے ہیں۔ اس نے کہا کہ لیوریج کا حقیقی اثر ہے: یہ ٹریڈر کا سرمایہ، منافع اور خطرہ کئی گنا کرتا ہے، اور بروکر کو اس سے زیادہ کمیشن ملتا ہے بنسبت اس کے کہ ٹریڈر صرف اپنے سرمائے سے تجارت کرے، اس لیے یہ فرضی رقم نہیں۔ اس نے نتیجہ نکالا کہ لیوریج پر مشتمل کوئی معاملہ جائز نہیں کیونکہ یہ سودی قرض ہے، اور پوچھے گئے معاملے کی حرمت کے لیے یہی کافی ہے۔"
  es: "Una pregunta sobre el trading de divisas, donde algunas empresas afirman que el apalancamiento no es un préstamo y no cobran comisiones por swap, fue respondida por el Departamento General de Iftaa de Jordania, que el apalancamiento es un préstamo que beneficia al prestamista, por lo que cualquier transacción que lo involucre está prohibida. El Departamento explicó que, en términos de fiqh (jurisprudencia islámica), el apalancamiento es un préstamo del bróker al operador; con intereses, constituye claramente riba (usura), y sin intereses también, ya que el bróker obtiene la comisión acordada en cada transacción y porque combina un préstamo con una venta. Afirmó que el apalancamiento tiene un efecto real: multiplica el capital, las ganancias y el riesgo del operador, y genera al bróker una mayor comisión que si el operador utilizara únicamente su propio capital, por lo que no se trata de una suma teórica. Concluyó que ninguna transacción que involucre apalancamiento está permitida, dado que se trata de un préstamo con intereses, y que esto por sí solo basta para declarar prohibida la transacción en cuestión."
  fr: "Une question relative au trading forex, où certaines sociétés affirment que l'effet de levier n'est pas un prêt et ne facturent pas de frais de swap, a été posée. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que l'effet de levier est un prêt qui procure un avantage au prêteur, et que par conséquent, toute transaction y ayant recours est interdite. Le Département a expliqué que, selon les termes du fiqh (jurisprudence islamique), l'effet de levier est un prêt du courtier au trader; avec intérêts, il s'agit clairement d'usure (riba), et sans intérêts, il s'agit toujours d'usure (riba), car le courtier perçoit la commission convenue sur chaque transaction et parce qu'il combine un prêt avec une vente. Il a précisé que l'effet de levier a un effet réel: il multiplie le capital, les profits et le risque du trader, et rapporte au courtier une commission plus importante que si le trader utilisait uniquement ses propres fonds. Il ne s'agit donc pas d'une somme notionnelle. Le Département a conclu qu'aucune transaction impliquant un effet de levier n'est autorisée, puisqu'il s'agit d'un prêt portant intérêt, et que cela suffit à lui seul pour déclarer la transaction en question interdite."
  tr: "Forex ticareti hakkında bir soru Bazı şirketler kaldıraçın ne kredi ne de gecelik komisyon olduğunu belirtirken, Ürdün Genel Fetva Dairesi kaldıraç borcunun kredi verene fayda sağlayan bir kredi olduğunu ve bu nedenle bu işlemle ilgili herhangi bir işlemle ilgilenilmesine izin verilemeyeceğini belirtti. Bakanlık, kaldıraç anlayışının yasal sınıflandırmasının aracı kurumdan tüccara verilen bir kredi olduğu; faiz borçluysa tefecilik, faizsiz ise tefecilik olduğunu, çünkü aracı kurumun her işlemde üzerinde anlaşılan komisyondan faydalandığını ve avans ile satışları birleştirdiğini belirtti. Kaldıraç gerçek bir etkiye sahip olduğunu, çünkü yatırımcının sermayesi, kârı ve risklerinin arttığını ve aracı kurumun bundan sadece sermayesiyle işlem yapmasından daha fazla komisyon kazandığını belirtti; bunların kurgusal tutarlar olmadığını. Kaldıraç sistemiyle ilgili herhangi bir işlemin tefeci kredi olduğu için kabul edilmediğine ve bunun sorumlu işlemin yasaklanmasına karar vermek için yeterli olduğuna karar verdi."
  id: "Pertanyaan tentang perdagangan forex Dengan beberapa perusahaan menyatakan bahwa leverage bukanlah pinjaman maupun komisi semalam, Departemen Fatwa Umum Yordania menjawab bahwa leverage adalah pinjaman yang menguntungkan pemberi pinjaman, sehingga tidak diperbolehkan menangani transaksi apa pun yang melibatkan itu. Departemen menjawab bahwa klasifikasi yurisprudensi leverage adalah bahwa itu adalah pinjaman dari broker kepada trader; jika berbunga, itu adalah riba, dan jika tanpa bunga, itu juga riba, karena broker mendapat manfaat dari komisi yang disepakati pada setiap transaksi dan karena menggabungkan uang muka dan penjualan. Departemen tersebut menyatakan bahwa leverage memiliki efek nyata, karena modal, keuntungan, dan risiko trader berlipat ganda, dan broker memperoleh komisi lebih banyak daripada jika trader hanya berdagang dengan modalnya; ini bukan jumlah fiktif. Mereka menyimpulkan bahwa tidak diperbolehkan menangani transaksi yang melibatkan sistem leverage karena itu adalah pinjaman riba, dan hal ini cukup untuk memutuskan larangan transaksi yang bertanggung jawab."
