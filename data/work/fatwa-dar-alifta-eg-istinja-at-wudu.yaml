id: work/fatwa-dar-alifta-eg-istinja-at-wudu
class: work
kind: fatwa
label: { ar: "حكم الاستنجاء عند الوضوء", en: "Whether istinja belongs to wudu", ur: "وضو کے وقت استنجا کا حکم", es: "Si istinja pertenece a wudu", fr: "L'istinja fait-il partie des ablutions ?" }
summary:
  ar: "سائل سأل عن حكم الاستنجاء عند الوضوء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20751)⁩ أن الاستنجاء طهارة مستقلة يجب عند وجود سببه وهو خروج النجاسة من أحد السبيلين ولا يعد من سنن الوضوء على ما فصّل الجواب."
  en: "A questioner asked about istinja at wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20751) answered that istinja is an independent purification — obligatory when its cause exists, namely impurity exiting either passage — and is not among the sunnas of wudu, as the answer details."
  ur: "ایک سائل نے وضو کے وقت استنجا کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20751)⁩ نے جواب دیا کہ استنجا مستقل طہارت ہے جس کا سبب ہو تو واجب ہے اور یہ وضو کی سنتوں میں شمار نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la istinja en el wudu. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20751) respondió que la istinja es una purificación independiente —obligatoria cuando existe su causa, a saber, la impureza que sale por cualquiera de los dos conductos— y no se encuentra entre las sunnas del wudu, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'istinja lors des ablutions. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20751) a répondu que l'istinja est une purification indépendante — obligatoire lorsque sa cause existe, à savoir une impureté sortant de l'un ou l'autre passage — et ne fait pas partie des sunnas des ablutions, comme le précise la réponse."
