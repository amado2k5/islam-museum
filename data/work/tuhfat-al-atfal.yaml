summary:
  ar: "نظم في التجويد لسليمان الجمزوري ⁦(ت. نحو 1316هـ)⁩ في نحو إحدى وستين بيتاً على بحر الرجز، يجمع أصول النون الساكنة والتنوين والميم الساكنة والمدود وما يلزم المبتدئ من التلاوة؛ أوسع متون التجويد انتشاراً في حلق التحفيظ {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "A tajwid didactic poem by Sulayman al-Jamzuri (d. ca. 1316 AH) — some sixty-one rajaz lines gathering the rules of the still nun and tanwin, the still mim and the kinds of madd, the beginner's first tajwid text and the most widely memorised of the tajwid mutun {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Un poema didáctico de tajwid de Sulayman al-Jamzuri (m. ca. 1316 AH) — unas sesenta y una líneas rajaz que reúnen las reglas del nun quieto y el tanwin, el mim quieto y los tipos de madd, el primer texto de tajwid para principiantes y el más memorizado de los tajwid mutun {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  fr: "Un poème didactique sur le tajwid de Sulayman al-Jamzuri (mort vers 1316 AH) — quelque soixante et un vers rajaz rassemblant les règles du nun et du tanwin immobiles, du mim immobile et des types de madd, le premier texte de tajwid du débutant et le plus largement mémorisé du tajwid mutun {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "سلیمان الجمزوری ⁦(متوفی 1316ھ)⁩ کی ایک تجوید نثری نظم - تقریباً اکسٹھ رجز سطریں جن میں ساکن نون اور تنوین، ساکن میم اور مد کی قسمیں شامل ہیں، مبتدی کا پہلا تجوید متن اور تجوید مثنویوں کا سب سے زیادہ حفظ کیا گیا ہے۔ {حوالہ: المتون العلمیہ اظہر} {حوالہ: العالم}۔"
  tr: "Süleyman el-Cemzuri (yaklaşık 1316 H yılında öldü) tarafından yazılan, racaz ölçüsünde yaklaşık altmış bir dizede yazılmış bir Tacweed şiiri; sessiz rahibe, tanween, sessiz meem ve genişletilmiş ünlülerin ilkelerini birleştirir ve ezbere başlayanlar için gerekenleri içerir; ezberleme çevrelerinde en yaygın tacweed metinlerinden biridir {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  id: "Sebuah puisi Tajweed karya Suleiman al-Jamzouri (wafat sekitar 1316 H) dalam sekitar enam puluh satu bait dalam meter rajaz, menggabungkan prinsip biarawati diam, tanween, meem diam, dan vokal panjang, serta apa yang dibutuhkan bagi pemula dalam pembacaan; ini adalah teks tajweed yang paling luas tersebar luas di lingkaran hafalan {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
