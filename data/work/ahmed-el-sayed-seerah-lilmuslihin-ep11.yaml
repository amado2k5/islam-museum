id: work/ahmed-el-sayed-seerah-lilmuslihin-ep11
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 11: وفاة أبي طالب"
  en: "The Prophetic Biography for Reformers, episode 11: The Death of Abu Talib"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 11: ابو طالب کی وفات"
  fr: "La biographie prophétique pour les réformateurs, épisode 11 : La mort d'Abu Talib"
  es: "La biografía profética para los reformadores, episodio 11: La muerte de Abu Talib"
summary:
  ar: "يعود المجلس الحادي عشر من سلسلة السيرة النبوية للمصلحين إلى مكة: تآمر قريش على قتل النبي، وانحياز أبي طالب مع بني هاشم إلى الشعب، والحصار الاجتماعي والاقتصادي الذي دام ثلاث سنوات ثم نقض العهد، ثم وفاة أبي طالب وخديجة في عام الحزن. ويشرح المتحدث سهم ذوي القربى في خيبر، ويروي مشهد وفاة أبي طالب، ويستخلص دروسا عن حق الله والشفاعة وصحبة السوء، ثم يقف عند مكانة خديجة."
  en: "The eleventh session of the series on the Prophetic biography for reformers returns to Mecca: Quraysh's plot to kill the Prophet, Abu Talib's withdrawal with Banu Hashim to the quarter, the three-year social and economic siege and its cancellation, then the deaths of Abu Talib and Khadija in the Year of Sorrow. The speaker explains the Khaybar share for kin, recounts Abu Talib's deathbed and draws lessons on God's right, intercession and bad company, then dwells on Khadija's standing."
  ur: "اصلاح کرنے والوں کے لیے سیرت نبوی کے سلسلے کی گیارہویں نشست پھر مکہ لوٹتی ہے: قریش کی نبی کو قتل کرنے کی سازش، ابو طالب کا بنو ہاشم کے ساتھ گھاٹی میں چلے جانا، تین سال تک جاری رہنے والا سماجی اور معاشی محاصرہ اور پھر معاہدے کا توڑا جانا، اور اس کے بعد غم کے سال میں ابو طالب اور خدیجہ کی وفات۔ مقرر خیبر میں قرابت داروں کے حصے کی وضاحت کرتے ہیں، ابو طالب کی وفات کا منظر بیان کرتے ہیں، اللہ کے حق، شفاعت اور بری صحبت سے متعلق اسباق نکالتے ہیں، اور پھر خدیجہ کے مقام پر ٹھہرتے ہیں۔"
  fr: "La onzième séance de la série sur la biographie prophétique pour les réformateurs revient à La Mecque : le complot des Qurayshites pour tuer le Prophète, le repli d'Abu Talib avec les Banu Hashim dans le quartier, le siège social et économique de trois ans puis l'annulation du pacte, enfin les morts d'Abu Talib et de Khadija pendant l'année de la tristesse. Le conférencier explique la part des proches à Khaybar, raconte les derniers moments d'Abu Talib et en tire des leçons sur le droit de Dieu, l'intercession et les mauvaises fréquentations, puis s'attarde sur la place de Khadija."
  es: "La undécima sesión de la serie sobre la biografía profética para los reformadores vuelve a La Meca: el complot de los Quraysh para matar al Profeta, el repliegue de Abu Talib con los Banu Hashim al barrio, el asedio social y económico de tres años y la anulación del pacto, y después las muertes de Abu Talib y de Jadiya en el año de la tristeza. El conferenciante explica la parte de los parientes en Jaybar, relata los últimos momentos de Abu Talib, extrae lecciones sobre el derecho de Dios, la intercesión y las malas compañías, y se detiene en la posición de Jadiya."
