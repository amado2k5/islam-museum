label: { ar: "مصير من مات ولم يسمع بالإسلام", en: "The fate of one who died without hearing of Islam", ur: "بے خبر مرنے والے کا انجام", es: "El destino de quien murió sin haber oído hablar del Islam.", fr: "Le destin de celui qui est mort sans avoir entendu parler de l'islam", tr: "İslam'ı duymayanların kaderi", id: "Nasib mereka yang meninggal dan tidak mendengar tentang Islam" }
summary:
  ar: "سأل سائل عن من مات على غير الإسلام ولم يسمع عنه شيئًا أو لم يسمع إلا ما هو كذب وافتراء على الدين هل يدخل الجنة أم النار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80434 بتاريخ 10 نوفمبر 2009)⁩ أن من مات ولم يسمع عن الإسلام شيئًا أو لم يسمع عنه إلا سماعًا مشوهًا من قبل حصومه فإن شأنه شأن أهل الفترات ويمتحن في عرصات يوم القيامة فيوقد الله لهم نارًا ويأمرهم بدخولها فمن أطاعه جعلها عليه بردًا وسلامًا ومن عصاه أدخله النار فالله أعلم بما كانوا عاملين، وفي الباب جملة من الأحاديث تفيد هذا المعنى أوردها الحافظ ابن كثير في تفسير قوله وما كنا معذبين حتى نبعث رسولًا وقال فيها إن منها ما هو صحيح كما نص غير واحد من أئمة العلم."
  en: "A questioner asked about one who died a non-Muslim never having heard of Islam, or only lies and forgeries against it — paradise or fire? Dr. Salah al-Sawi (fatwa no. 80434, 10 November 2009) answered that such a one's case is that of the people of the interval: he will be tested on the plain of Judgment Day — God kindles a fire for them and commands them to enter; whoever obeys finds it cool and safe, whoever disobeys enters the Fire — God best knowing what they used to do. The chapter holds a group of hadiths to this meaning, which al-Hafiz Ibn Kathir cited at 'We never punished until We sent a messenger', judging some of them sound as other scholars stated. Recorded as AMJA's answer."
  ur: "ایک سائل نے اسلام کے بارے میں بے خبر مرنے والے کا انجام پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80434، 10 نومبر 2009)⁩ کے مطابق وہ اہل فترت کا حکم رکھتا ہے — قیامت کے میدان میں آزمایا جائے گا، ابن کثیر کی مروی روایات کے مطابق۔"
  es: "Un consultante preguntó sobre quien murió sin ser musulmán, sin haber oído hablar jamás del Islam, o solo haber creído mentiras y falsedades en su contra: ¿paraíso o fuego? El Dr. Salah al-Sawi (fatwa n.º 80434, 10 de noviembre de 2009) respondió que tal caso es el de la gente del intervalo: será probado en la llanura del Día del Juicio. Dios enciende un fuego para ellos y les ordena entrar; quien obedece lo encuentra fresco y seguro, quien desobedece entra en el Fuego, pues Dios es quien mejor conoce sus acciones. El capítulo contiene un grupo de hadices con este significado, que al-Hafiz Ibn Kathir citó en «Nunca castigamos hasta que enviamos un mensajero», considerando algunos de ellos válidos, como afirmaron otros eruditos. Registrado como respuesta de AMJA."
  fr: "Un internaute a posé la question suivante: qu’adviendra-t-il d’une personne décédée non musulmane, n’ayant jamais entendu parler de l’islam, ou n’ayant propagé que mensonges et contrefaçons à son sujet ? Le Dr Salah al-Sawi (fatwa n° 80434, 10 novembre 2009) a répondu que son sort est comparable à celui des gens de l’entre-deux: il sera mis à l’épreuve dans la plaine du Jour du Jugement. Dieu allumera un feu pour lui et lui ordonnera d’y entrer; celui qui obéira y trouvera fraîcheur et sécurité, celui qui désobéira entrera en Feu. Dieu est le plus savant quant à leurs actions. Ce chapitre contient un ensemble de hadiths allant dans ce sens, cités par al-Hafiz Ibn Kathir lorsqu’il affirme: « Nous n’avons jamais châtié avant d’avoir envoyé un messager », jugeant certains d’entre eux authentiques, comme l’ont également indiqué d’autres savants. Cette réponse est consignée dans la note AMJA."
  tr: "Bir soru soran kişi, İslam dışında ölen ve kendisi hakkında hiçbir şey duymamış ya da sadece dine karşı yalan ve iftira duymamış biri hakkında soruldu—cennete mi yoksa cehenneme mi girecek. Dr. Salah Al-Sawy (10 Kasım 2009 tarihli Fetva No. 80434) şöyle yanıtladı: İslam hakkında hiçbir şey duymadan ya da hasadından önce çarpıtılmış dinlerle ölenin statüsünün farklı çağlardaki insanlarla aynı olduğunu belirtti. Kıyamet günü ovalarında sınanacak, Allah onlar için bir ateş yakacak ve içine girmelerini emreder. Kim ona itaat ederse, ona serinlik ve huzur verir. Kendisine itaatsizlik edene onu ateşe kabul eder. Allah onların ne yaptıklarını en iyi bilir. Bu bölümde, bu anlamı aktaran birçok hadis vardır; bunlar Al-Hafız İbn Kathir'in 'Biz bir elçi gönderene kadar cezalandırılmadık' ifadesinin yorumunda aktarılmıştır., ve bazılarının birden fazla akademik akademisyenin belirttiği gibi özgün olduğunu söyledi."
  id: "Seorang penanya ditanya tentang seseorang yang meninggal di luar Islam dan tidak pernah mendengar apa pun tentangnya, atau hanya mendengar kebohongan dan fitnah terhadap agama—apakah ia akan masuk Surga atau Neraka. Dr. Salah Al-Sawy menjawab (Fatwa No. 80434 tanggal 10 November 2009) bahwa siapa pun yang meninggal tanpa mendengar apa pun tentang Islam atau hanya mendengarnya dengan pendengaran yang terdistorsi sebelum panennya, statusnya seperti orang-orang dari berbagai zaman. Ia akan diuji di dataran Hari Penghakiman, dan Allah akan menyalakan api bagi mereka dan memerintahkan mereka untuk masuk ke dalamnya. Siapa pun yang taat kepada-Nya, Dia akan mendatangkan ketenangan dan kedamaian untuknya. Siapa pun yang membangkang, Dia akan membiarkannya masuk ke dalam Api. Allah paling tahu apa yang dulu mereka lakukan. Dalam bab ini, terdapat sejumlah hadits yang menyampaikan makna ini, yang dikutip oleh Al-Hafiz Ibn Kathir dalam penafsirannya atas frasa 'Dan Kami tidak dihukum sampai Kami mengirim utusan,' dan dia mengatakan bahwa beberapa di antaranya adalah asli, seperti yang dinyatakan oleh lebih dari satu ulama."
