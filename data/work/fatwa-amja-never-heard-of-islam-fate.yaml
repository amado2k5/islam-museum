label: { ar: "مصير من مات ولم يسمع بالإسلام", en: "The fate of one who died without hearing of Islam", ur: "بے خبر مرنے والے کا انجام", es: "El destino de quien murió sin haber oído hablar del Islam." }
summary:
  ar: "سأل سائل عن من مات على غير الإسلام ولم يسمع عنه شيئًا أو لم يسمع إلا ما هو كذب وافتراء على الدين هل يدخل الجنة أم النار. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80434 بتاريخ 10 نوفمبر 2009)⁩ أن من مات ولم يسمع عن الإسلام شيئًا أو لم يسمع عنه إلا سماعًا مشوهًا من قبل حصومه فإن شأنه شأن أهل الفترات ويمتحن في عرصات يوم القيامة فيوقد الله لهم نارًا ويأمرهم بدخولها فمن أطاعه جعلها عليه بردًا وسلامًا ومن عصاه أدخله النار فالله أعلم بما كانوا عاملين، وفي الباب جملة من الأحاديث تفيد هذا المعنى أوردها الحافظ ابن كثير في تفسير قوله وما كنا معذبين حتى نبعث رسولًا وقال فيها إن منها ما هو صحيح كما نص غير واحد من أئمة العلم."
  en: "A questioner asked about one who died a non-Muslim never having heard of Islam, or only lies and forgeries against it — paradise or fire? Dr. Salah al-Sawi (fatwa no. 80434, 10 November 2009) answered that such a one's case is that of the people of the interval: he will be tested on the plain of Judgment Day — God kindles a fire for them and commands them to enter; whoever obeys finds it cool and safe, whoever disobeys enters the Fire — God best knowing what they used to do. The chapter holds a group of hadiths to this meaning, which al-Hafiz Ibn Kathir cited at 'We never punished until We sent a messenger', judging some of them sound as other scholars stated. Recorded as AMJA's answer."
  ur: "ایک سائل نے اسلام کے بارے میں بے خبر مرنے والے کا انجام پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80434، 10 نومبر 2009)⁩ کے مطابق وہ اہل فترت کا حکم رکھتا ہے — قیامت کے میدان میں آزمایا جائے گا، ابن کثیر کی مروی روایات کے مطابق۔"
  es: "Un consultante preguntó sobre quien murió sin ser musulmán, sin haber oído hablar jamás del Islam, o solo haber creído mentiras y falsedades en su contra: ¿paraíso o fuego? El Dr. Salah al-Sawi (fatwa n.º 80434, 10 de noviembre de 2009) respondió que tal caso es el de la gente del intervalo: será probado en la llanura del Día del Juicio. Dios enciende un fuego para ellos y les ordena entrar; quien obedece lo encuentra fresco y seguro, quien desobedece entra en el Fuego, pues Dios es quien mejor conoce sus acciones. El capítulo contiene un grupo de hadices con este significado, que al-Hafiz Ibn Kathir citó en «Nunca castigamos hasta que enviamos un mensajero», considerando algunos de ellos válidos, como afirmaron otros eruditos. Registrado como respuesta de AMJA."
