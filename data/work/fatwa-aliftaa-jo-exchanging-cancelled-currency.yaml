id: work/fatwa-aliftaa-jo-exchanging-cancelled-currency
class: work
kind: fatwa
label: { ar: "مبادلة العملة النقدية الملغاة", en: "Exchanging a cancelled currency", ur: "منسوخ شدہ کرنسی کا تبادلہ" }
summary:
  ar: "سؤال عما إذا كانت العملة الملغاة تأخذ أحكام العملة السارية في التقابض والتساوي، أجابت فيه دائرة الإفتاء العام الأردنية بأن العملة إذا أُلغيت زالت عنها صفة الثمنية وصارت سلعة، فيجوز بيعها بالعملة الرائجة مع التفاضل. أجابت الدائرة بأن العملات الورقية من غير الذهب والفضة لا تُعد أثمانًا بذواتها، بل لأنها تمثل قوة شرائية إلزامية، فتجري عليها أحكام الذهب والفضة في الربا والزكاة وغيرهما ما دامت رائجة، فإذا انقطع التعامل بها زالت عنها صفة الثمنية وصارت سلعة من السلع. ونقلت قول إمام الحرمين الجويني في نهاية المطلب إن الفلوس إذا كسدت ونهى السلطان عن التعامل بها انقلبت عروضًا بلا خلاف. وقالت إن العملة الملغاة يكون شأنها شأن السلع التي لا تجري فيها أحكام الصرف، فيجوز بيعها بالعملة الرائجة مع التفاضل وبما يتفق عليه المتبايعان. وخلصت إلى أن العملة الملغاة سلعة وعرض كسائر العروض، فلا تجري عليها أحكام الربا والزكاة والصرف."
  en: "A question about whether a cancelled currency takes the rules of a current one regarding immediate exchange and equality, in which Jordan's General Iftaa Department answered that once a currency is cancelled it loses its status as money and becomes a commodity, so it may be sold for current currency at an unequal rate. The Department answered that paper currencies not made of gold or silver are not money in themselves but because they represent compulsory purchasing power, so the rules of gold and silver on usury, zakat and the like apply to them while they are in circulation; once dealing in them stops, they lose their status as money and become an ordinary commodity. It quoted Imam al-Haramayn al-Juwayni in Nihayat al-Matlab that when copper coins fall out of use and the ruler's crier forbids dealing in them, they turn into goods without disagreement. It said a cancelled currency is then like any goods to which the rules of currency exchange do not apply, so it may be sold for current currency at an unequal rate, on whatever the two parties agree. It concluded that a cancelled currency is a commodity like any other goods, to which the rules of usury, zakat and currency exchange do not apply."
  ur: "اس سوال کے بارے میں کہ کیا منسوخ شدہ کرنسی پر فوری قبضے اور برابری میں رائج کرنسی کے احکام لاگو ہوتے ہیں، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کرنسی منسوخ ہونے پر اس کی ثمنیت ختم ہو جاتی ہے اور وہ سامان بن جاتی ہے، لہٰذا اسے رائج کرنسی کے بدلے کمی بیشی کے ساتھ بیچا جا سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سونے چاندی کے علاوہ کاغذی کرنسیاں بذات خود ثمن نہیں بلکہ اس لیے ثمن ہیں کہ وہ لازمی قوت خرید کی نمائندگی کرتی ہیں، لہٰذا جب تک رائج ہوں ان پر سود، زکات وغیرہ میں سونے چاندی کے احکام لاگو ہوتے ہیں؛ جب ان سے لین دین ختم ہو جائے تو ان کی ثمنیت ختم ہو جاتی ہے اور وہ عام سامان بن جاتی ہیں۔ اس نے نہایۃ المطلب میں امام الحرمین الجوینی کا قول نقل کیا کہ جب تانبے کے سکے چلن سے نکل جائیں اور حاکم کا منادی ان سے لین دین سے منع کر دے تو وہ بلا اختلاف سامان بن جاتے ہیں۔ اس نے کہا کہ منسوخ کرنسی پھر ایسے سامان کی طرح ہے جس پر صرف کے احکام لاگو نہیں ہوتے، لہٰذا اسے رائج کرنسی کے بدلے کمی بیشی کے ساتھ، فریقین کے اتفاق کے مطابق، بیچا جا سکتا ہے۔ اس نے نتیجہ نکالا کہ منسوخ کرنسی دوسرے سامان کی طرح ایک جنس ہے، جس پر سود، زکات اور صرف کے احکام لاگو نہیں ہوتے۔"
