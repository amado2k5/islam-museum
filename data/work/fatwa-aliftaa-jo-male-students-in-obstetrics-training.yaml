id: work/fatwa-aliftaa-jo-male-students-in-obstetrics-training
class: work
kind: fatwa
label: { ar: "ضوابط دراسة طب النساء والتوليد والعمل فيه", en: "Rules for studying and practising obstetrics and gynaecology", ur: "زچگی اور امراضِ نسواں کی تعلیم اور پیشے کے ضوابط", es: "Normas para el estudio y la práctica de la obstetricia y la ginecología.", fr: "Règles pour étudier et pratiquer l'obstétrique et la gynécologie", tr: "Kadın doğum ve kadın hastalıkları alanında eğitim ve çalışma düzenlemeleri", id: "Peraturan untuk studi dan pekerjaan di bidang obstetri dan ginekologi" }
summary:
  ar: "سؤال من طالب طب عن حضور الدروس العملية في طب النساء والتوليد وتخصص الرجال فيه وإجبار المريضات على الكشف أمام الطلاب، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل أن تعالج المرأة المرأة، وأن الحاجة تقدر بقدرها، ولا يجوز إجبار المريضة. أجابت الدائرة بأن الشرع ندب إلى التداوي وتعلم الطب، وأن الفقهاء عدّوا التخصص فيه من فروض الكفاية غير المقصورة على جنس، لكن الأصل أن تعالج المرأة المرأة والرجل الرجل، فإن دعت حاجة قُدّرت بقدرها. وقالت إن مثل ذلك في التعليم، فينبغي أن تعلّم المرأة المرأة والرجل الرجل، ويجب العمل على توفير مختصين من الجنسين، وإذا لم يتوفر مختص من الجنس نفسه فلا حرج في علاج الرجل المرأة أو العكس للحاجة مع مراعاة الضوابط، ونقلت عن حاشية البجيرمي. وفي التعليم يُقدَّم ما يحقق الغاية بالوسائل التعليمية دون كشف العورات، فإن لم يمكن فيكون التطبيق بين طلاب من الجنس نفسه في حدود الحاجة. وقالت إن إجبار المريضة على أن يعالجها طبيب أو طالب متدرب مخالف لتعليمات حماية خصوصية المريض، وغير جائز شرعًا مع توافر الطبيبة أو المتدربة."
  en: "A question from a medical student on attending practical obstetrics and gynaecology classes, men specialising in the field, and patients being pressed to be examined before students, in which Jordan's General Iftaa Department answered that women should in principle treat women, need is met only as far as it goes, and a patient may not be compelled. The Department answered that the sharia encourages seeking treatment and learning medicine, which jurists count as a communal obligation not limited to one sex, but that in principle women treat women and men treat men, and any need is met only as far as it requires. It said the same applies to teaching: women should teach women and men teach men, and providing specialists of both sexes must be pursued; where no specialist of the same sex is available, a man may treat a woman or the reverse out of need, observing the rules, citing al-Bujayrimi's gloss. In teaching, teaching aids that achieve the aim without exposing private parts come first; if that is not possible, practice should be among students of the same sex, within the limits of need. It said that compelling a patient to be treated by a male doctor or trainee breaches the rules protecting patient privacy, and is not permitted in sharia when a female doctor or trainee is available."
  ur: "ایک میڈیکل طالب علم کا سوال جو زچگی اور امراضِ نسواں کی عملی کلاسوں میں شرکت، مردوں کے اس شعبے میں تخصص، اور مریضاؤں کو طلبہ کے سامنے معائنے پر مجبور کرنے کے بارے میں تھا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصل یہ ہے کہ عورت عورت کا علاج کرے، ضرورت کو اس کی حد تک رکھا جائے، اور مریضہ کو مجبور نہیں کیا جا سکتا۔ ڈیپارٹمنٹ نے جواب دیا کہ شریعت علاج اور طب سیکھنے کی ترغیب دیتی ہے، جسے فقہاء فرضِ کفایہ شمار کرتے ہیں اور وہ کسی ایک جنس تک محدود نہیں، لیکن اصل یہ ہے کہ عورت عورت کا اور مرد مرد کا علاج کرے، اور ضرورت کو اس کی حد تک رکھا جائے۔ اس نے کہا کہ یہی حکم تعلیم کا ہے: عورت عورت کو اور مرد مرد کو سکھائے، اور دونوں جنسوں کے ماہرین مہیا کرنے کی کوشش لازم ہے؛ جہاں ہم جنس ماہر میسر نہ ہو وہاں ضرورت کی بنا پر مرد عورت کا یا عورت مرد کا علاج ضوابط کی پابندی کے ساتھ کر سکتے ہیں، اور بجیرمی کے حاشیے سے نقل کیا۔ تعلیم میں پہلے ایسے تعلیمی ذرائع اختیار کیے جائیں جو ستر کھولے بغیر مقصد پورا کریں؛ اگر یہ ممکن نہ ہو تو عملی مشق ہم جنس طلبہ کے درمیان ضرورت کی حد تک ہو۔ اس نے کہا کہ مریضہ کو مرد ڈاکٹر یا زیرِ تربیت طالب علم سے علاج پر مجبور کرنا مریض کی رازداری کے تحفظ کے ضوابط کے خلاف ہے، اور خاتون ڈاکٹر یا تربیت پانے والی میسر ہو تو شرعاً جائز نہیں۔"
  es: "Una estudiante de medicina preguntó sobre la asistencia a clases prácticas de obstetricia y ginecología, la especialización masculina en este campo y la presión ejercida sobre las pacientes para ser examinadas por estudiantes. El Departamento General de Iftaa de Jordania respondió que, en principio, las mujeres deben atender a mujeres, que la necesidad se satisface solo en la medida necesaria y que no se puede obligar a una paciente. El Departamento explicó que la sharia fomenta la búsqueda de tratamiento y el aprendizaje de la medicina, lo cual los juristas consideran una obligación comunitaria no limitada a un solo sexo, pero que, en principio, las mujeres atienden a mujeres y los hombres a hombres, y que cualquier necesidad se satisface solo en la medida necesaria. Añadió que lo mismo se aplica a la enseñanza: las mujeres deben enseñar a mujeres y los hombres a hombres, y se debe procurar contar con especialistas de ambos sexos; cuando no haya un especialista del mismo sexo disponible, un hombre puede atender a una mujer o viceversa por necesidad, respetando las normas, según la interpretación de al-Bujayrimi. En la enseñanza, se priorizan los materiales didácticos que logren el objetivo sin exponer las partes íntimas; si esto no es posible, la práctica debe realizarse entre estudiantes del mismo sexo, dentro de los límites de la necesidad. El comunicado afirma que obligar a un paciente a ser tratado por un médico o residente varón infringe las normas que protegen la privacidad del paciente y no está permitido en la sharia cuando hay disponible una médica o residente mujer."
  fr: "Une question posée par un étudiant en médecine concernait sa participation aux cours pratiques d'obstétrique et de gynécologie, la spécialisation masculine dans ce domaine et les pressions exercées sur les patientes pour qu'elles soient examinées devant les étudiants. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que, par principe, les femmes devraient soigner les femmes, que les besoins ne sont satisfaits que dans la mesure où ils le nécessitent et qu'une patiente ne peut être contrainte. Le Département a précisé que la charia encourage le recours aux soins et l'apprentissage de la médecine, ce que les juristes considèrent comme une obligation collective non limitée à un seul sexe. Toutefois, il a ajouté que, par principe, les femmes soignent les femmes et les hommes les hommes, et que tout besoin n'est satisfait que dans la mesure où il l'exige. Il a indiqué que le même principe s'applique à l'enseignement: les femmes devraient enseigner aux femmes et les hommes aux hommes, et il est essentiel de veiller à ce que des spécialistes des deux sexes soient présents. En l'absence de spécialiste du même sexe, un homme peut soigner une femme et inversement par nécessité, en respectant les règles, citant la glose d'al-Bujayrimi. Pour l'enseignement, les supports pédagogiques permettant d'atteindre l'objectif sans exposer les parties intimes sont privilégiés; si cela s'avère impossible, la pratique doit se faire entre étudiants du même sexe, dans la limite des besoins. Il a été indiqué que contraindre un patient à être soigné par un médecin ou un interne de sexe masculin enfreint les règles protégeant la vie privée du patient et n'est pas autorisé en charia lorsqu'une médecin ou une interne de sexe féminin est disponible."
  tr: "Bir tıp öğrencisinin kadın doğum ve jinekoloji uygulamalı derslerine katılma, erkeklere uzmanlaşma ve kadın hastaların öğrenciler önünde muayene yaptırılması hakkında soru sorulduğunda, Ürdün Genel Fetva Dairesi, kadınların kadınlara tedavi edilmesi gerektiği, ihtiyaçların kendi ölçülerine göre değerlendirilmesi gerektiği ve kadın hastayı zorlamanın izin verilmediği şeklinde yanıt verdi. Bakanlık, İslam hukukunun tedavi ve tıp eğitimini önerdiğini, hukukçuların uzmanlaşmayı cinsiyetle sınırlı olmayan toplu yükümlülükler arasında değerlendirdiğini yanıtladı. Ancak varsayılan durum, kadınların kadınları, erkeklerin erkekleri tedavi etmesidir; gerekirse sınırlarına kadar sınırlandırılmalıdır. Aynı şey eğitim için de geçerlidir: kadınlar erkeklere kadınları ve erkekleri eğitmeli ve her iki cinsiyetten uzmanlar sağlanmalıdır. Aynı cinsiyetten uzmanlar mevcut değilse, erkeklere ve kadınlara tedavi etmekte veya tam tersi gerekli düzenlemelerin sağlanmasında zarar yoktur. Bucairami'nin kenar notlarından alıntılanmıştır. Eğitimde, hedefe ulaşan şey, özel bölgeleri açığa çıkarmadan eğitim yoluyla sağlanır; bu mümkün değilse, başvuru yalnızca gerektiğinde aynı cinsiyetten öğrenciler arasında yapılmalıdır. Hastanın doktor veya stajyer öğrenci tarafından tedavi edilmesinin hasta gizliliğini koruma talimatlarına aykırı olduğunu ve doktor ya da stajyer bulunduğunda İslam hukukuna göre izin verilmediğini söyledi."
  id: "Pertanyaan dari seorang mahasiswa kedokteran tentang mengikuti kursus praktik obstetri dan ginekologi, spesialisasi pria, dan memaksa pasien perempuan menjalani pemeriksaan di depan mahasiswa, Departemen Fatwa Umum Yordania menjawab bahwa defaultnya adalah perempuan harus merawat perempuan, dan kebutuhan harus dihargai sesuai ukurannya, dan tidak diperbolehkan memaksa pasien perempuan. Departemen menjawab bahwa hukum Islam merekomendasikan pengobatan dan pendidikan medis, dan para ahli hukum telah mempertimbangkan spesialisasi sebagai kewajiban kolektif yang tidak terbatas pada gender. Namun, defaultnya adalah perempuan merawat perempuan dan laki-laki merawat laki-laki; jika perlu, mereka harus dibatasi hingga batasnya. Hal yang sama berlaku untuk pendidikan: perempuan harus mengajar perempuan dan laki-laki kepada laki-laki, dan spesialis dari kedua gender harus disediakan. Jika spesialis dengan jenis kelamin yang sama tidak tersedia, tidak ada salahnya merawat laki-laki dan perempuan atau, sebaliknya, menyediakan regulasi yang diperlukan. Pernyataan itu dikutip dari catatan pinggir Al-Bujairami. Dalam pendidikan, apa yang mencapai tujuan diberikan melalui cara pendidikan tanpa mengungkapkan bagian pribadi; jika tidak memungkinkan, aplikasi harus hanya dilakukan di antara siswa dengan jenis kelamin yang sama sesuai kebutuhan. Dia mengatakan bahwa memaksa pasien dirawat oleh dokter atau siswa magang bertentangan dengan instruksi perlindungan privasi pasien dan tidak diperbolehkan menurut hukum Islam ketika dokter atau peserta pelatihan hadir."
