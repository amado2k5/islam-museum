id: work/fatwa-aliftaa-jo-male-students-in-obstetrics-training
class: work
kind: fatwa
label: { ar: "ضوابط دراسة طب النساء والتوليد والعمل فيه", en: "Rules for studying and practising obstetrics and gynaecology", ur: "زچگی اور امراضِ نسواں کی تعلیم اور پیشے کے ضوابط" }
summary:
  ar: "سؤال من طالب طب عن حضور الدروس العملية في طب النساء والتوليد وتخصص الرجال فيه وإجبار المريضات على الكشف أمام الطلاب، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل أن تعالج المرأة المرأة، وأن الحاجة تقدر بقدرها، ولا يجوز إجبار المريضة. أجابت الدائرة بأن الشرع ندب إلى التداوي وتعلم الطب، وأن الفقهاء عدّوا التخصص فيه من فروض الكفاية غير المقصورة على جنس، لكن الأصل أن تعالج المرأة المرأة والرجل الرجل، فإن دعت حاجة قُدّرت بقدرها. وقالت إن مثل ذلك في التعليم، فينبغي أن تعلّم المرأة المرأة والرجل الرجل، ويجب العمل على توفير مختصين من الجنسين، وإذا لم يتوفر مختص من الجنس نفسه فلا حرج في علاج الرجل المرأة أو العكس للحاجة مع مراعاة الضوابط، ونقلت عن حاشية البجيرمي. وفي التعليم يُقدَّم ما يحقق الغاية بالوسائل التعليمية دون كشف العورات، فإن لم يمكن فيكون التطبيق بين طلاب من الجنس نفسه في حدود الحاجة. وقالت إن إجبار المريضة على أن يعالجها طبيب أو طالب متدرب مخالف لتعليمات حماية خصوصية المريض، وغير جائز شرعًا مع توافر الطبيبة أو المتدربة."
  en: "A question from a medical student on attending practical obstetrics and gynaecology classes, men specialising in the field, and patients being pressed to be examined before students, in which Jordan's General Iftaa Department answered that women should in principle treat women, need is met only as far as it goes, and a patient may not be compelled. The Department answered that the sharia encourages seeking treatment and learning medicine, which jurists count as a communal obligation not limited to one sex, but that in principle women treat women and men treat men, and any need is met only as far as it requires. It said the same applies to teaching: women should teach women and men teach men, and providing specialists of both sexes must be pursued; where no specialist of the same sex is available, a man may treat a woman or the reverse out of need, observing the rules, citing al-Bujayrimi's gloss. In teaching, teaching aids that achieve the aim without exposing private parts come first; if that is not possible, practice should be among students of the same sex, within the limits of need. It said that compelling a patient to be treated by a male doctor or trainee breaches the rules protecting patient privacy, and is not permitted in sharia when a female doctor or trainee is available."
  ur: "ایک میڈیکل طالب علم کا سوال جو زچگی اور امراضِ نسواں کی عملی کلاسوں میں شرکت، مردوں کے اس شعبے میں تخصص، اور مریضاؤں کو طلبہ کے سامنے معائنے پر مجبور کرنے کے بارے میں تھا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصل یہ ہے کہ عورت عورت کا علاج کرے، ضرورت کو اس کی حد تک رکھا جائے، اور مریضہ کو مجبور نہیں کیا جا سکتا۔ ڈیپارٹمنٹ نے جواب دیا کہ شریعت علاج اور طب سیکھنے کی ترغیب دیتی ہے، جسے فقہاء فرضِ کفایہ شمار کرتے ہیں اور وہ کسی ایک جنس تک محدود نہیں، لیکن اصل یہ ہے کہ عورت عورت کا اور مرد مرد کا علاج کرے، اور ضرورت کو اس کی حد تک رکھا جائے۔ اس نے کہا کہ یہی حکم تعلیم کا ہے: عورت عورت کو اور مرد مرد کو سکھائے، اور دونوں جنسوں کے ماہرین مہیا کرنے کی کوشش لازم ہے؛ جہاں ہم جنس ماہر میسر نہ ہو وہاں ضرورت کی بنا پر مرد عورت کا یا عورت مرد کا علاج ضوابط کی پابندی کے ساتھ کر سکتے ہیں، اور بجیرمی کے حاشیے سے نقل کیا۔ تعلیم میں پہلے ایسے تعلیمی ذرائع اختیار کیے جائیں جو ستر کھولے بغیر مقصد پورا کریں؛ اگر یہ ممکن نہ ہو تو عملی مشق ہم جنس طلبہ کے درمیان ضرورت کی حد تک ہو۔ اس نے کہا کہ مریضہ کو مرد ڈاکٹر یا زیرِ تربیت طالب علم سے علاج پر مجبور کرنا مریض کی رازداری کے تحفظ کے ضوابط کے خلاف ہے، اور خاتون ڈاکٹر یا تربیت پانے والی میسر ہو تو شرعاً جائز نہیں۔"
