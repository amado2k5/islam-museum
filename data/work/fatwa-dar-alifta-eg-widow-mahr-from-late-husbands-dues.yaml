id: work/fatwa-dar-alifta-eg-widow-mahr-from-late-husbands-dues
class: work
kind: fatwa
label: { ar: "حكم صرف مؤخر صداق الزوجة من مستحقات زوجها المتوفى قبل توزيعه", en: "Paying the wife's deferred mahr from her late husband's dues before distribution", ur: "شوہر کی واجب الادا رقم سے بیوہ کا مہر ادا کرنا قبل تقسیم", es: "Pagar la dote diferida de la esposa con cargo a las deudas de su difunto esposo antes de su distribución.", fr: "Paiement de la dot différée de l'épouse sur les droits de son défunt mari avant la distribution", tr: "Eşin ertelenmiş çeyizinin, vefat eden kocasının aidatlarından dağıtımdan önce ödenmesine karar", id: "Putusan tentang pencairan mas kawin istri yang ditunda dari iuran suami yang telah meninggal sebelum pembagian" }
summary:
  ar: "سائلة سألت عن صرف مؤخر صداقها من مستحقات زوجها المتوفى قبل توزيعها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21737)⁩ أن تلك المستحقات إذا كانت من حقوق الزوج التي ثبتت له حال حياته وتأخر صرفها حتى توفي فهي تركة عنه وبيّن الجواب حكم مؤخر الصداق منها على وجهه."
  en: "A widow asked about taking her deferred mahr from her late husband's outstanding dues before their distribution. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21737) answered that such dues, if they were his established rights in life whose payment was delayed until his death, are his estate; the answer sets out where the deferred mahr falls within that."
  ur: "ایک بیوہ نے پوچھا کہ فوت شدہ شوہر کی بقایا واجبات سے اپنا مؤخر مہر تقسیم سے پہلے لے سکتی ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21737)⁩ نے جواب دیا کہ ایسی رقم جو زندگی میں اس کا حق تھی اور فوت تک ادا نہ ہوئی اس کی ترکہ ہے؛ مؤخر مہر کا حکم جواب میں بیان ہوا۔"
  es: "Una viuda preguntó sobre la posibilidad de cobrar la dote diferida de las deudas pendientes de su difunto esposo antes de su distribución. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21737) respondió que dichas deudas, si constituían sus derechos establecidos en vida cuyo pago se retrasó hasta su muerte, forman parte de su patrimonio; la respuesta especifica dónde se incluye la dote diferida dentro de dicho patrimonio."
  fr: "Une veuve a demandé si elle pouvait percevoir la dot différée (mahr) due par son défunt mari avant sa distribution. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21737) a répondu que ces sommes, si elles constituaient des droits acquis de son vivant et dont le paiement a été différé jusqu'à son décès, font partie de sa succession; la réponse précise dans quelle mesure la dot différée s'inscrit dans ce cadre."
  tr: "Bir soru soran, vefat eden kocasının haklarından ertelenmiş çeyizin dağıtımdan önce ödenmesini sordu. Mısırlı Dar Al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21737), bu hakların kocanın yaşamı boyunca kurulan hakları arasında yer alması ve ödemelerinin ölümüne kadar geciktirildiği takdirde, bunların kendisinden miras olduğunu yanıtladı. Cevap, ertelenmiş çeyizin kendi iradeleriyle verilen karara dayandığıdır."
  id: "Seorang penanya menanyakan tentang pembayaran mas kawin yang ditunda dari hak suami yang telah meninggal sebelum pembagian tersebut. Dar Al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21737) menjawab bahwa jika hak-hak ini termasuk dalam hak suami yang telah ditetapkan selama hidupnya dan pembayarannya tertunda hingga kematiannya, maka itu adalah warisan darinya. Jawabannya adalah bahwa mas kawin yang ditunda didasarkan pada keputusan atas kehendak sendiri."
