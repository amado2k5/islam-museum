id: work/fatwa-dar-alifta-eg-widow-mahr-from-late-husbands-dues
class: work
kind: fatwa
label: { ar: "حكم صرف مؤخر صداق الزوجة من مستحقات زوجها المتوفى قبل توزيعه", en: "Paying the wife's deferred mahr from her late husband's dues before distribution", ur: "شوہر کی واجب الادا رقم سے بیوہ کا مہر ادا کرنا قبل تقسیم" }
summary:
  ar: "سائلة سألت عن صرف مؤخر صداقها من مستحقات زوجها المتوفى قبل توزيعها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21737)⁩ أن تلك المستحقات إذا كانت من حقوق الزوج التي ثبتت له حال حياته وتأخر صرفها حتى توفي فهي تركة عنه وبيّن الجواب حكم مؤخر الصداق منها على وجهه."
  en: "A widow asked about taking her deferred mahr from her late husband's outstanding dues before their distribution. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21737) answered that such dues, if they were his established rights in life whose payment was delayed until his death, are his estate; the answer sets out where the deferred mahr falls within that."
  ur: "ایک بیوہ نے پوچھا کہ فوت شدہ شوہر کی بقایا واجبات سے اپنا مؤخر مہر تقسیم سے پہلے لے سکتی ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21737)⁩ نے جواب دیا کہ ایسی رقم جو زندگی میں اس کا حق تھی اور فوت تک ادا نہ ہوئی اس کی ترکہ ہے؛ مؤخر مہر کا حکم جواب میں بیان ہوا۔"
