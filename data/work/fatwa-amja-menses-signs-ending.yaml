id: work/fatwa-amja-menses-signs-ending
class: work
kind: fatwa
label: { ar: "علامة الطهر", en: "The sign of purity — dryness or the white discharge", ur: "طہر کی علامت — خشکی یا سفید رطوبت", es: "El signo de pureza: sequedad o flujo blanco.", fr: "Le signe de pureté — la sécheresse ou les sécrétions blanches", tr: "Arınma işareti", id: "Tanda penyucian" }
summary:
  ar: "سألت فتاة عن علامة انتهاء الدورة عندها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81731 بتاريخ 23 يونيو 2010)⁩ أن الطهر يكون بأحد أمرين الجفاف أو رؤية القصة البيضاء، والصفرة أو الكدرة في زمن الحيض استمرار للحيض أما الصفرة والكدرة في غير زمن الحيض فليست بشيء، وبناء على هذه القواعد فإن كانت تميز أيام الدورة وقد استقرت عندها على سبعة أيام مثلًا فإذا رأت الطهر بأحد علامتيه اغتسلت وصلت على ما فصّل."
  en: "A girl asked the sign of her period's end. Dr. Salah al-Sawi (fatwa no. 81731, 23 June 2010) answered that purity is known by one of two things — dryness or seeing the white discharge; yellow or murk in the days of menses is the menses continuing, while yellow or murk outside the menses-days is nothing; on these rules, if she knows her period's days settled at seven, say, then on seeing purity by one of its signs she washes and prays — as detailed."
  ur: "حیض کے ختم کی علامت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81731، 23 جون 2010)⁩ کے مطابق دو نشانیاں ہیں — خشکی یا سفید رطوبت؛ پیلا کدرا عادت کے دنوں میں حیض ہے۔"
  es: "Una joven preguntó cuál era la señal del fin de su menstruación. El Dr. Salah al-Sawi (fatwa n.º 81731, 23 de junio de 2010) respondió que la pureza se conoce por una de dos cosas: sequedad o ver el flujo blanco; si es amarillo u turbio durante los días de la menstruación, significa que la menstruación continúa, mientras que si es amarillo u turbio fuera de los días de la menstruación, no significa nada. Según estas reglas, si sabe que sus días de menstruación son siete, por ejemplo, entonces al ver la pureza por una de sus señales, se lava y reza, como se detalla."
  fr: "Une jeune fille demanda comment reconnaître la fin de ses règles. Le Dr Salah al-Sawi (fatwa n° 81731, 23 juin 2010) répondit que la pureté se reconnaît à deux signes: l’absence de sécrétions ou l’apparition de pertes blanches. Des pertes jaunes ou troubles pendant les menstruations indiquent que les règles se poursuivent, tandis que des pertes jaunes ou troubles en dehors des menstruations ne signifient rien. Selon ces règles, si elle sait que ses règles durent sept jours, par exemple, alors dès qu’elle constate la fin de ses règles par l’un de ses signes, elle se lave et prie, comme indiqué."
  tr: "Bir kıza regl bitiş belirtisi hakkında sordum. Dr. Salah Al-Sawy (23 Haziran 2010 tarihli Fetva No. 81731) arınmanın iki şeyden biriyle olduğunu yanıtladı: kuruluk veya beyaz saç görmek, ya da adet sırasında sararma veya bulanıklık adet döneminin devamı olarak görülmek, oysa adet dışında sararma ve bulanıklık geçerli değildir. Bu kurallara göre, adet günleri ayrılmış ve yedi gün boyunca stabil hale gelmişse, örneğin bir işaretinde saflık görürse, ghusl yapar ve belirtilen süreye ulaşmıştır."
  id: "Saya bertanya kepada seorang gadis tentang tanda-tanda akhir menstruasinya. Dr. Salah Al-Sawy menjawab (Fatwa No. 81731 tanggal 23 Juni 2010) bahwa pemurnian dilakukan dengan salah satu dari dua hal: kekeringan atau melihat rambut putih, atau menguning-kuning atau keruh saat menstruasi sebagai kelanjutan menstruasi, sedangkan kekuningan dan keruh di luar menstruasi tidak valid. Berdasarkan aturan ini, jika hari menstruasi dibedakan dan telah stabil selama tujuh hari, misalnya, jika dia melihat kemurnian pada salah satu tandanya, dia melakukan ghusl dan telah mencapai periode yang ditentukan."
