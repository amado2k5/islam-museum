id: work/fatwa-amja-menses-signs-ending
class: work
kind: fatwa
label: { ar: "علامة الطهر", en: "The sign of purity — dryness or the white discharge", ur: "طہر کی علامت — خشکی یا سفید رطوبت" }
summary:
  ar: "سألت فتاة عن علامة انتهاء الدورة عندها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81731 بتاريخ 23 يونيو 2010)⁩ أن الطهر يكون بأحد أمرين الجفاف أو رؤية القصة البيضاء، والصفرة أو الكدرة في زمن الحيض استمرار للحيض أما الصفرة والكدرة في غير زمن الحيض فليست بشيء، وبناء على هذه القواعد فإن كانت تميز أيام الدورة وقد استقرت عندها على سبعة أيام مثلًا فإذا رأت الطهر بأحد علامتيه اغتسلت وصلت على ما فصّل."
  en: "A girl asked the sign of her period's end. Dr. Salah al-Sawi (fatwa no. 81731, 23 June 2010) answered that purity is known by one of two things — dryness or seeing the white discharge; yellow or murk in the days of menses is the menses continuing, while yellow or murk outside the menses-days is nothing; on these rules, if she knows her period's days settled at seven, say, then on seeing purity by one of its signs she washes and prays — as detailed."
  ur: "حیض کے ختم کی علامت؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81731، 23 جون 2010)⁩ کے مطابق دو نشانیاں ہیں — خشکی یا سفید رطوبت؛ پیلا کدرا عادت کے دنوں میں حیض ہے۔"
