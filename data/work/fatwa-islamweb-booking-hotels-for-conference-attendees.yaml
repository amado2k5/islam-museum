id: work/fatwa-islamweb-booking-hotels-for-conference-attendees
class: work
kind: fatwa
label: { ar: "حكم العمل في حجز غرف في الفنادق للمشاركين في المؤتمرات المتنوعة", en: "Working in booking hotel rooms for attendees of various conferences", ur: "مختلف کانفرنسوں کے شرکا کے لیے ہوٹل کے کمرے بک کرنے کے کام کا حکم", es: "Gestionar la reserva de habitaciones de hotel para los asistentes a diversas conferencias.", fr: "Je m'occupe de la réservation des chambres d'hôtel pour les participants à diverses conférences." }
summary:
  ar: "سؤال من موظف تنفيذي في شركة مهمته البحث عن المؤتمرات في دول مختلفة وعن أسعار فنادق أقل للحاضرين ثم رفع المعلومات إلى رئيسه، وبعض هذه المؤتمرات قد يتعلق بأمور محرمة كمؤتمرات شركات الخمور وعروض الأزياء، وبعض الفنادق فيها كازينوهات وبارات مع أنه لا يحجز إلا الغرف، أجاب فيه مركز الفتوى بإسلام ويب بأن العمل في البحث عن أسعار الفنادق وحجز الغرف لمن يحضر المؤتمرات مباح لأنه توسط ودلالة على منفعة مباحة هي إجارة المساكن والراتب عليه حلال، لكن إذا عُلم أو غلب على الظن أن موضوع المؤتمر محرم كان حجز الفنادق لرواده تسهيلًا وإعانة على الحرام المنهي عنه في آية المائدة، أما المؤتمرات المباحة أو التي لا يُعلم موضوعها فلا حرج في الحجز لروادها ولا يلزم التفتيش عنها، ولا يمنع من ذلك وجود منكرات في الفنادق لأن العقد على منفعة السكن. وقرر أن له الاستمرار في العمل مع تجنب الإعانة على المؤتمرات المحرمة، فإن أمره مديره بالحجز لمؤتمر يعلم حرمته اعتذر لأنه لا طاعة لمخلوق في معصية الخالق، وأن راتبه لا يُحكم بحرمته ما دامت غالبية عمله مباحة، والأحوط أن يتصدق بنسبة من راتبه تعادل الوقت الذي قضاه في الحجز لمؤتمرات محرمة سابقة إبراءً للذمة."
  en: "A question from an executive employee whose job is to research conferences held in various countries and find cheaper hotel rates for attendees, passing the information up to his superior; some conferences may concern forbidden matters such as alcohol-industry conferences or fashion shows, and some hotels have casinos or bars, though he books only rooms. The fatwa centre of IslamWeb answered that researching hotel prices and booking rooms for conference attendees is permissible work, being intermediation and guidance to a permissible benefit, the renting of lodgings, so the salary earned is lawful; but where it is known or strongly suspected that a conference's subject is forbidden, booking hotels for its attendees is facilitation of and assistance in the forbidden, prohibited in the verse of al-Ma'ida; for conferences whose subject is permissible or unknown there is no blame in booking for their attendees and no duty to investigate, nor is this barred by the presence of wrongdoing in those hotels, since the contract concerns the benefit of lodging. It ruled that he may continue in the work while avoiding assistance to forbidden conferences, and if his manager orders him to book for a conference he knows or strongly suspects to be forbidden he should decline, since no created being is obeyed in disobedience to the Creator; his salary is not judged forbidden so long as most of his work is permissible, and as a precaution he should give in charity a share of his salary matching the time he spent booking for forbidden conferences in the past, to clear his conscience."
  ur: "ایک کمپنی کے انتظامی ملازم کا سوال جس کا کام مختلف ملکوں میں ہونے والی کانفرنسوں کی تلاش اور شرکا کے لیے کم قیمت ہوٹل تلاش کر کے معلومات اپنے افسر کو بھیجنا ہے؛ بعض کانفرنسیں حرام امور سے متعلق ہو سکتی ہیں جیسے شراب کمپنیوں کی کانفرنسیں یا فیشن شو، اور بعض ہوٹلوں میں کسینو یا بار ہیں، گو وہ صرف کمرے بک کرتا ہے۔ اسلام ویب کے فتویٰ مرکز نے جواب دیا کہ ہوٹلوں کی قیمتیں تلاش کرنا اور کانفرنس کے شرکا کے لیے کمرے بک کرنا مباح کام ہے، کیونکہ یہ مباح منفعت یعنی رہائش کے کرائے پر دلالت اور واسطہ ہے، لہٰذا اس کی تنخواہ حلال ہے؛ لیکن جہاں معلوم ہو یا غالب گمان ہو کہ کانفرنس کا موضوع حرام ہے، وہاں اس کے شرکا کے لیے ہوٹل بک کرنا حرام میں سہولت اور تعاون ہے جس سے سورہ مائدہ کی آیت میں منع کیا گیا؛ جن کانفرنسوں کا موضوع مباح ہو یا معلوم نہ ہو ان کے شرکا کے لیے بکنگ میں کوئی حرج نہیں اور تحقیق لازم نہیں، اور ان ہوٹلوں میں منکرات کا ہونا بھی رکاوٹ نہیں کیونکہ عقد رہائش کی منفعت پر ہے۔ اس نے فیصلہ کیا کہ وہ حرام کانفرنسوں میں تعاون سے بچتے ہوئے کام جاری رکھ سکتا ہے، اور اگر منیجر اسے ایسی کانفرنس کی بکنگ کا حکم دے جس کی حرمت اسے معلوم یا غالب گمان ہو تو وہ معذرت کرے کیونکہ خالق کی نافرمانی میں کسی مخلوق کی اطاعت نہیں؛ اس کی تنخواہ حرام نہیں قرار دی جائے گی جب تک اس کا زیادہ تر کام مباح ہو، اور احتیاط یہ ہے کہ وہ تنخواہ کا اتنا حصہ صدقہ کرے جو ماضی میں حرام کانفرنسوں کی بکنگ پر گزرے وقت کے برابر ہو تاکہ ذمہ بری ہو۔"
  es: "Una pregunta de un ejecutivo cuyo trabajo consiste en investigar conferencias celebradas en varios países y encontrar tarifas de hotel más económicas para los asistentes, transmitiendo la información a su superior; algunas conferencias pueden tratar temas prohibidos, como conferencias de la industria del alcohol o desfiles de moda, y algunos hoteles tienen casinos o bares, aunque él solo reserva habitaciones. El centro de fatwas de IslamWeb respondió que investigar precios de hoteles y reservar habitaciones para los asistentes a conferencias es un trabajo permisible, ya que constituye intermediación y orientación para un beneficio permisible, el alquiler de alojamiento, por lo que el salario percibido es lícito; pero cuando se sabe o se sospecha firmemente que el tema de una conferencia es prohibido, reservar hoteles para sus asistentes es facilitar y ayudar en lo prohibido, prohibido en el versículo de al-Ma'ida; para conferencias cuyo tema es permisible o desconocido, no hay culpa en reservar para sus asistentes ni obligación de investigar, ni esto está prohibido por la presencia de irregularidades en esos hoteles, ya que el contrato se refiere al beneficio del alojamiento. El tribunal dictaminó que puede continuar con su trabajo siempre que evite asistir a conferencias prohibidas, y que si su jefe le ordena reservar plaza para una conferencia que sabe o sospecha firmemente que está prohibida, debe negarse, puesto que ningún ser creado es obedecido en desobediencia al Creador; su salario no se considera prohibido siempre que la mayor parte de su trabajo sea permisible, y como precaución debe donar a la caridad una parte de su salario equivalente al tiempo que dedicó a reservar plazas para conferencias prohibidas en el pasado, para tranquilizar su conciencia."
  fr: "Un cadre chargé de rechercher des conférences internationales et de trouver des hôtels à prix avantageux pour les participants, puis de transmettre ces informations à sa hiérarchie, a posé une question: certaines conférences peuvent porter sur des sujets illicites, comme des congrès de l’industrie de l’alcool ou des défilés de mode, et certains hôtels disposent de casinos ou de bars, bien qu’il ne réserve que des chambres. Le centre de fatwas d’IslamWeb a répondu que la recherche de prix d’hôtels et la réservation de chambres pour les participants à une conférence constituent une activité licite, car il s’agit d’une médiation et d’une orientation vers un avantage licite, la location d’un logement. Le salaire perçu est donc licite. Cependant, lorsqu’il est avéré ou fortement soupçonné que le sujet d’une conférence est illicite, la réservation d’hôtels pour ses participants constitue une facilitation et une aide à l’acte illicite, prohibé par le verset d’al-Ma’ida. Pour les conférences dont le sujet est licite ou inconnu, il n’y a pas lieu de blâmer la réservation d’hôtels pour les participants ni d’obligation de vérification, et la présence d’actes répréhensibles dans ces hôtels n’y fait pas obstacle, puisque le contrat porte sur le bénéfice de l’hébergement. Il a été statué qu'il pouvait continuer à travailler tout en évitant de participer à des conférences interdites, et que si son supérieur lui ordonnait de s'inscrire à une conférence qu'il savait ou soupçonnait fortement d'être interdite, il devait refuser, car aucun être créé ne doit être obéi en désobéissant au Créateur; son salaire n'est pas jugé interdit tant que la majeure partie de son travail est permise, et par précaution, il devrait donner à une œuvre de charité une partie de son salaire correspondant au temps qu'il a passé par le passé à s'inscrire à des conférences interdites, afin de se purifier la conscience."
