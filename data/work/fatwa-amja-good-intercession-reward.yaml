id: work/fatwa-amja-good-intercession-reward
class: work
kind: fatwa
label: { ar: "الشفاعة الحسنة في طلبات الدنيا", en: "Good intercession in worldly petitions", ur: "دنیاوی درخواستوں میں اچھی سفارش", es: "Buena intercesión en las peticiones mundanas", fr: "Bonne intercession dans les requêtes mondaines", tr: "Bu dünyanın isteklerine iyi bir aracılık", id: "Perantaraan yang baik dalam permintaan dunia ini" }
summary:
  ar: "سأل سائل عن بحث في أحكام الشفاعة ذكر أمثلة للشفاعة الحسنة كالتزكية للانتساب للجامعات أو لدعم الجهات الخيرية أو للوظائف. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86533 بتاريخ 6 مارس 2012)⁩ أنه لم يتسن لهم الاطلاع على البحث لكن ما ذكره من الأمثلة له توجيه صحيح فقد تشترط بعض الجامعات الإسلامية أو الجهات الخيرية أو الوظائف العامة خطاب تزكية ليتأكد صاحب الولاية أنه يتخذ القرار الصحيح ويستثمر في المكان الصحيح ومثله لا حرج فيه، ومن أدى فيه الشفاعة على وجهها نرجو أن يكون مأجورًا لقوله تعالى من يشفع شفاعة حسنة يكن له نصيب منها ولقوله اشفعوا تؤجروا."
  en: "A questioner cited a study on intercession's rulings listing examples of good intercession today — recommendations for university admission, charitable funding or public posts. Dr. Salah al-Sawi (fatwa no. 86533, 6 March 2012) answered they had not read the study, but the examples have a sound interpretation: some Islamic universities, charities and public offices require letters of recommendation so the authority makes the right decision and invests in the right place — nothing objectionable in that, and whoever intercedes properly we hope is rewarded, per 'whoever intercedes a good intercession has a share of it' and 'intercede and you will be rewarded'. Recorded as AMJA's answer."
  ur: "ایک سائل نے جامعات و خیریہ اداروں میں سفارش کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86533، 6 مارچ 2012)⁩ کے مطابق مناسب تزکیہ خط میں حرج نہیں اور اچھی سفارش پر اجر ہے۔"
  es: "Un interlocutor citó un estudio sobre las normas de la intercesión que enumeraba ejemplos de buena intercesión en la actualidad: recomendaciones para la admisión universitaria, la financiación de obras benéficas o cargos públicos. El Dr. Salah al-Sawi (fatwa n.º 86533, 6 de marzo de 2012) respondió que no había leído el estudio, pero que los ejemplos tenían una interpretación válida: algunas universidades islámicas, organizaciones benéficas y oficinas públicas requieren cartas de recomendación para que la autoridad tome la decisión correcta e invierta en el lugar adecuado; no hay nada objetable en ello, y esperamos que quien interceda correctamente sea recompensado, según «quien intercede con rectitud tiene parte de ella» e «intercede y serás recompensado». Registrada como respuesta de AMJA."
  fr: "Un interlocuteur a cité une étude sur les règles d'intercession, donnant des exemples d'intercession valable aujourd'hui: recommandations pour l'admission à l'université, le financement d'œuvres caritatives ou l'obtention de postes publics. Le Dr Salah al-Sawi (fatwa n° 86533, 6 mars 2012) a répondu qu'ils n'avaient pas lu l'étude, mais que les exemples étaient pertinents: certaines universités islamiques, organisations caritatives et administrations publiques exigent des lettres de recommandation afin que les autorités prennent la bonne décision et investissent au bon endroit; il n'y a rien à redire à cela, et nous espérons que celui qui intercède convenablement sera récompensé, conformément aux préceptes « quiconque intercède bien en a part » et « intercédez et vous serez récompensés ». Cette réponse a été consignée dans l'AMJA."
  tr: "Bir soru soran kişiye şeaat kararları üzerine yapılan bir çalışma soruldu. Üniversitelere katılarak arınma, hayır kurumlarını desteklemek veya işler gibi iyi duafiyet örneklerini verdi. Dr. Salah Al-Sawy (Fetva No. 86533, 6 Mart 2012 tarihli), araştırmayı gözden geçiremediklerini, ancak bahsettiği örneklerin doğru rehberlik olduğunu yanıtladı. Bazı İslami üniversiteler, hayır kurumları veya kamu kurumları, vasi doğru kararı verdiğinden ve doğru yere yatırım yaptığından emin olmak için tavsiye mektubu ister. Bunda zarar yoktur. Aracılığı doğru yapan kişinin ödüllendirilmesi beklenir, Allah'ın Müsvafif Dileği'nin dediği gibi: İyi bir dualıkla aracılık eden kişi payını alır ve O'nun sözünde şöyle olur: Aracılık et, ödüllendirilirsin."
  id: "Seorang penanya ditanya tentang studi tentang aturan perantaraan. Ia menyebutkan contoh perantaraan yang baik, seperti pemurnian untuk masuk universitas, mendukung organisasi amal, atau pekerjaan. Dr. Salah Al-Sawy (Fatwa No. 86533 tanggal 6 Maret 2012) menjawab bahwa mereka tidak dapat meninjau penelitian, tetapi contoh yang ia sebutkan adalah panduan yang benar. Beberapa universitas Islam, organisasi amal, atau kantor publik memerlukan surat rekomendasi untuk memastikan wali mengambil keputusan yang tepat dan berinvestasi di tempat yang tepat. Tidak ada salahnya dengan itu. Siapa pun yang melaksanakan perantaraan dengan benar diharapkan akan dihargai, seperti yang Allah katakan: Siapa pun yang bersyaat dengan perantaraan yang baik akan mendapat bagiannya, dan dalam perkataan-Nya: Perantar, kamu akan diberi ganjaran."
