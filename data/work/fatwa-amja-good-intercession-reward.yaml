id: work/fatwa-amja-good-intercession-reward
class: work
kind: fatwa
label: { ar: "الشفاعة الحسنة في طلبات الدنيا", en: "Good intercession in worldly petitions", ur: "دنیاوی درخواستوں میں اچھی سفارش" }
summary:
  ar: "سأل سائل عن بحث في أحكام الشفاعة ذكر أمثلة للشفاعة الحسنة كالتزكية للانتساب للجامعات أو لدعم الجهات الخيرية أو للوظائف. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86533 بتاريخ 6 مارس 2012)⁩ أنه لم يتسن لهم الاطلاع على البحث لكن ما ذكره من الأمثلة له توجيه صحيح فقد تشترط بعض الجامعات الإسلامية أو الجهات الخيرية أو الوظائف العامة خطاب تزكية ليتأكد صاحب الولاية أنه يتخذ القرار الصحيح ويستثمر في المكان الصحيح ومثله لا حرج فيه، ومن أدى فيه الشفاعة على وجهها نرجو أن يكون مأجورًا لقوله تعالى من يشفع شفاعة حسنة يكن له نصيب منها ولقوله اشفعوا تؤجروا."
  en: "A questioner cited a study on intercession's rulings listing examples of good intercession today — recommendations for university admission, charitable funding or public posts. Dr. Salah al-Sawi (fatwa no. 86533, 6 March 2012) answered they had not read the study, but the examples have a sound interpretation: some Islamic universities, charities and public offices require letters of recommendation so the authority makes the right decision and invests in the right place — nothing objectionable in that, and whoever intercedes properly we hope is rewarded, per 'whoever intercedes a good intercession has a share of it' and 'intercede and you will be rewarded'. Recorded as AMJA's answer."
  ur: "ایک سائل نے جامعات و خیریہ اداروں میں سفارش کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86533، 6 مارچ 2012)⁩ کے مطابق مناسب تزکیہ خط میں حرج نہیں اور اچھی سفارش پر اجر ہے۔"
