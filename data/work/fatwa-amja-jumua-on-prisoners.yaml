id: work/fatwa-amja-jumua-on-prisoners
class: work
kind: fatwa
label: { ar: "الجمعة على المسجون", en: "Is Jumu'a obligatory on the prisoner — the two abodes weighed", ur: "قیدی پر جمعہ — دو داروں کا مسئلہ", es: "¿Es obligatorio el Jumu'a para el prisionero? — las dos moradas pesaban", fr: "La prière du vendredi (Jumu'a) est-elle obligatoire pour le prisonnier ? – Les deux lieux de résidence ont été pesés" }
summary:
  ar: "سأل سائل هل صلاة الجمعة فرض على الشخص المسجون. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21990 بتاريخ 14 أكتوبر 2012)⁩ أن صلاة الجمعة فرض عين على كل مسلم مكلف ذكر مستوطن سواء كان في دار الحرب أم في دار الإسلام فليس في الشريعة دليل صحيح يدل على اختصاص وجوبها بدار الإسلام على ما فصّل الجواب من حال المسجون."
  en: "A questioner asked whether Jumu'a is obligatory on a prisoner. AMJA's fatwa committee (fatwa no. 21990, 14 October 2012) answered that the Friday prayer is an individual duty on every legally bound adult male resident, in dar al-harb or dar al-Islam alike — no sound proof in the shari'a restricts its obligation to dar al-Islam — the answer detailing the prisoner's case."
  ur: "قیدی پر جمعہ فرض؟ لجنة الفتوى ⁦(فتویٰ 21990، 14 اکتوبر 2012)⁩ کے مطابق ہر مقیم مکلف مرد پر فرض عین — دار الحرب و دار الاسلام یکساں۔"
  es: "Un interlocutor preguntó si la oración del viernes (Jumu'a) es obligatoria para un preso. El comité de fatwas de AMJA (fatwa n.º 21990, 14 de octubre de 2012) respondió que la oración del viernes es un deber individual para todo varón adulto legalmente obligado, residente tanto en dar al-harb como en dar al-Islam; no existe ninguna prueba sólida en la sharia que restrinja su obligación a dar al-Islam. La respuesta detallaba el caso del preso."
  fr: "Un internaute a demandé si la prière du vendredi (Jumu'a) était obligatoire pour un prisonnier. Le comité des fatwas de l'AMJA (fatwa n° 21990, 14 octobre 2012) a répondu que la prière du vendredi est un devoir individuel pour tout homme adulte résidant en Inde, que ce soit dans le dar al-harb ou le dar al-Islam – aucun fondement juridique solide de la charia ne limitant cette obligation au dar al-Islam – la réponse détaillant le cas du prisonnier."
