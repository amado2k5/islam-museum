summary:
  ar: "طبعة منقّحة تنقيحًا واسعًا من ترجمة محمد مارمادوك بكثال الإنجليزية للقرآن (1930)، أصدرتها جمعية حسن القول في القاهرة وتوزعها مجانًا، ووجدتها جوانا بينك في مايو 2023 في جامع ابن طولون؛ أبدل محررها خالد محمد فهمي بالألفاظ العتيقة ألفاظًا حديثة، وعدّل اختيارات بكثال في كل آية تقريبًا طلبًا لموافقة العقيدة، معتمدًا على تفاسير وترجمات منها ترجمات يوسف علي والهلالي وخان وصحيح إنترناشونال وعبد الحليم وخطاب."
  en: "An extensively revised edition of Muhammad Marmaduke Pickthall's English translation of the Qur'an (1930), issued by the Best Speech Society of Cairo and distributed free, which Johanna Pink found at the Mosque of Ibn Tulun in May 2023; its editor Khaled Mohammad Fahmy replaced archaic wording with modern English and changed Pickthall's choices in almost every verse for doctrinal accuracy, drawing on commentaries and translations including those of Yusuf Ali, Hilali–Khan, Saheeh International, Abdel Haleem and Khattab."
  ur: "محمد مارمادیوک پکتھال کے انگریزی ترجمۂ قرآن (1930) کی وسیع نظرِ ثانی شدہ اشاعت جو قاہرہ کی جمعیت حسن القول نے جاری کی اور مفت تقسیم کرتی ہے، اور جو یوہانا پنک کو مئی 2023 میں جامع ابن طولون میں ملی؛ اس کے مدیر خالد محمد فہمی نے قدیم الفاظ کی جگہ جدید انگریزی رکھی اور عقیدے کی صحت کے لیے تقریباً ہر آیت میں پکتھال کے انتخاب بدلے، یوسف علی، ہلالی و خان، صحیح انٹرنیشنل، عبد الحلیم اور خطاب وغیرہ کے تراجم اور تفاسیر کی مدد سے۔"
