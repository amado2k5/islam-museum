label: { ar: "معنى القرآن المجيد لبكثال في طبعة جمعية حسن القول المنقّحة", en: "The Meaning of the Glorious Qur'an (Pickthall), Best Speech Society revised edition", ur: "پکتھال کا «دی میننگ آف دی گلوریس قرآن»، جمعیت حسن القول کی نظرِ ثانی شدہ اشاعت", es: "El significado del glorioso Corán (Pickthall), edición revisada de la Best Speech Society", fr: "La signification du glorieux Coran (Pickthall), édition révisée de la Best Speech Society", tr: "Hassan Al-Qawl Derneği'nin gözden geçirilmiş baskısında Bekthal'ın Görkemli Kur'an'ının anlamı", id: "Makna Al-Qur'an Gemilang Bekthal dalam edisi revisi Asosiasi Hassan Al-Qawl" }
summary:
  ar: "طبعة منقّحة تنقيحًا واسعًا من ترجمة محمد مارمادوك بكثال الإنجليزية للقرآن (1930)، أصدرتها جمعية حسن القول في القاهرة وتوزعها مجانًا، ووجدتها جوانا بينك في مايو 2023 في جامع ابن طولون؛ أبدل محررها خالد محمد فهمي بالألفاظ العتيقة ألفاظًا حديثة، وعدّل اختيارات بكثال في كل آية تقريبًا طلبًا لموافقة العقيدة، معتمدًا على تفاسير وترجمات منها ترجمات يوسف علي والهلالي وخان وصحيح إنترناشونال وعبد الحليم وخطاب."
  en: "An extensively revised edition of Muhammad Marmaduke Pickthall's English translation of the Qur'an (1930), issued by the Best Speech Society of Cairo and distributed free, which Johanna Pink found at the Mosque of Ibn Tulun in May 2023; its editor Khaled Mohammad Fahmy replaced archaic wording with modern English and changed Pickthall's choices in almost every verse for doctrinal accuracy, drawing on commentaries and translations including those of Yusuf Ali, Hilali–Khan, Saheeh International, Abdel Haleem and Khattab."
  ur: "محمد مارمادیوک پکتھال کے انگریزی ترجمۂ قرآن (1930) کی وسیع نظرِ ثانی شدہ اشاعت جو قاہرہ کی جمعیت حسن القول نے جاری کی اور مفت تقسیم کرتی ہے، اور جو یوہانا پنک کو مئی 2023 میں جامع ابن طولون میں ملی؛ اس کے مدیر خالد محمد فہمی نے قدیم الفاظ کی جگہ جدید انگریزی رکھی اور عقیدے کی صحت کے لیے تقریباً ہر آیت میں پکتھال کے انتخاب بدلے، یوسف علی، ہلالی و خان، صحیح انٹرنیشنل، عبد الحلیم اور خطاب وغیرہ کے تراجم اور تفاسیر کی مدد سے۔"
  es: "Una edición ampliamente revisada de la traducción al inglés del Corán de Muhammad Marmaduke Pickthall (1930), publicada por la Best Speech Society de El Cairo y distribuida gratuitamente, que Johanna Pink encontró en la Mezquita de Ibn Tulun en mayo de 2023; su editor, Khaled Mohammad Fahmy, reemplazó la redacción arcaica con inglés moderno y modificó las elecciones de Pickthall en casi todos los versículos para lograr precisión doctrinal, basándose en comentarios y traducciones, incluidas las de Yusuf Ali, Hilali-Khan, Saheeh International, Abdel Haleem y Khattab."
  fr: "Une édition largement révisée de la traduction anglaise du Coran par Muhammad Marmaduke Pickthall (1930), publiée par la Best Speech Society du Caire et distribuée gratuitement, que Johanna Pink a trouvée à la mosquée d'Ibn Tulun en mai 2023; son éditeur, Khaled Mohammad Fahmy, a remplacé les formulations archaïques par un anglais moderne et a modifié les choix de Pickthall dans presque chaque verset pour une exactitude doctrinale, en s'appuyant sur des commentaires et des traductions, notamment ceux de Yusuf Ali, Hilali-Khan, Saheeh International, Abdel Haleem et Khattab."
  tr: "Muhammed Marmaduk Bethal'in Kur'an'ın İngilizce çevirisinin (1930) geniş çapta gözden geçirilmiş bir baskısı, Kahire'deki Hassan Al-Qawl Derneği tarafından yayımlandı ve ücretsiz dağıtıldı. Joanna Pink, Mayıs 2023'te İbn Tulun Camii'nde buldu; editörü Halid Mohamed Fahmy, eski kelimeleri modern kelimelerle değiştirdi ve neredeyse her ayette Bekthal'ın seçimlerini düzenleyerek inanç onayını aradı; Yusuf Ali, Al-Hilali, Khan, Sahih International, Abdel Halim ve Khattab'ın yorumları ve çevirilerine dayandı."
  id: "Edisi yang telah direvisi secara luas dari terjemahan bahasa Inggris Al-Qur'an oleh Muhammad Marmaduk Bethal (1930), diterbitkan oleh Asosiasi Hassan Al-Qawl di Kairo dan didistribusikan secara gratis. Joanna Pink menemukannya pada Mei 2023 di Masjid Ibn Tusun; editornya Khaled Mohamed Fahmy mengganti kata-kata lama dengan kata-kata modern, dan mengedit pilihan Bekthal di hampir setiap ayat untuk mencari persetujuan atas kredo, mengandalkan komentar dan terjemahan termasuk Yusuf Ali, Al-Hilali, Khan, Sahih International, Abdel Halim, dan Khattab."
