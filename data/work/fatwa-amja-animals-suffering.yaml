id: work/fatwa-amja-animals-suffering
class: work
kind: fatwa
label: { ar: "مصائب الحيوانات غير المكلفة", en: "Calamities befalling unaccountable animals", ur: "غیر مکلف جانوروں پر مصائب", es: "Calamidades que azotan a animales inexplicables", fr: "Des calamités frappent des animaux inexplicables", tr: "Ucuz hayvan talihsizlikleri", id: "Kesialan hewan yang murah" }
summary:
  ar: "سأل سائل عن شبهة يثيرها ملاحدة أن الحيوانات غير المكلفة تقع عليها المصائب ولا تعوض في الآخرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86371 بتاريخ 22 يناير 2012)⁩ أن أفعال الله لا تنفك عن حكمته ومنها ما ندركه وما لا ندركه، وأن البهائم وإن لم يكن عليها تكليف فإنه يوم القيامة يقاد للشاة الجماء من الشاة القرناء كما ثبت في السنة، فلا يمتنع أن يكون بعض ما يصيبها في الدنيا — بالإضافة لكونه عقوبة أو ابتلاء لأصحابها — عقوبة دنيوية لها، وأن الظلم الذي حرمه الله على نفسه هو وضع الشيء في غير موضعه ومنع ذي الحق حقه."
  en: "A questioner raised the atheists' doubt that unaccountable animals suffer calamities with no afterlife compensation. Dr. Salah al-Sawi (fatwa no. 86371, 22 January 2012) answered that God's acts are never without wisdom — some grasped, some not; though beasts bear no obligation, on the Last Day retaliation is exacted for the hornless ewe from the horned one as the sunna records, so it is possible that part of what befalls them in this world — besides being a punishment or trial for their owners — is a worldly penalty for them too; and the injustice God forbade Himself is placing a thing out of place and withholding a due."
  ur: "ایک سائل نے ملحدین کے شبہ کا ذکر کیا کہ غیر مکلف جانوروں پر مصائب آتی ہیں اور آخرت میں تلافی نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86371، 22 جنوری 2012)⁩ کے مطابق اللہ کے افعال حکمت سے خالی نہیں؛ قیامت میں جانوروں کا بھی قصاص ہوتا ہے حدیث کے مطابق۔"
  es: "Un interlocutor planteó la duda de los ateos sobre si los animales, sin que nadie los responsabilice, sufren calamidades sin compensación en el más allá. El Dr. Salah al-Sawi (fatwa n.º 86371, 22 de enero de 2012) respondió que los actos de Dios nunca carecen de sabiduría: algunos se comprenden, otros no; aunque los animales no tienen ninguna obligación, en el Último Día se exige una retribución a la oveja sin cuernos por parte de la que tiene cuernos, como registra la sunna, por lo que es posible que parte de lo que les sucede en este mundo —además de ser un castigo o una prueba para sus dueños— sea también una pena terrenal para ellos; y la injusticia que Dios mismo se prohibió es colocar algo fuera de lugar y retener lo que le corresponde."
  fr: "Un internaute a soulevé le doute des athées quant à la possibilité que des animaux, sans défense, subissent des calamités sans compensation dans l'au-delà. Le Dr Salah al-Sawi (fatwa n° 86371, 22 janvier 2012) a répondu que les actes de Dieu ne sont jamais dénués de sagesse – certains sont compris, d'autres non; bien que les bêtes n'aient aucune obligation, au Jour du Jugement dernier, la brebis sans cornes subira le châtiment de la brebis cornue, comme le rapporte la Sunna. Il est donc possible qu'une partie de ce qui leur arrive en ce monde – outre le fait d'être une punition ou une épreuve pour leurs propriétaires – soit également une sanction terrestre pour elles; et l'injustice que Dieu a Lui-même interdite consiste à déplacer une chose et à retenir ce qui nous est dû."
  tr: "Bir ateistin, sorumluluk sahibi olmayan hayvanların felaketler taşıdığı ve ahirette tazminat almadığı şüphesi hakkında soru soruldu. Dr. Salah Al-Sawy (22 Ocak 2012 tarihli Fetva No. 86371) Tanrı'nın eylemlerinin O'nun hikmetinden ayrılmaz olduğunu, bizim algıladığımızı ve görmediklerimizi de kapsayan bir şekilde yanıtladı. Hayvanlar zorunlu olmasalar bile, Kıyamet Günü'nde Sünnet'te belirtildiği gibi boynuzlu koyunların koyunlarına götürülürler. Bu nedenle, bu dünyada başlarına gelenlerin bazıları—sahipleri için ceza veya sınav olmasının yanı sıra—onlar için dünyevi cezalar da olması muhtemeldir. Allah'ın kendine yasakladığı adaletsizlik, bir şeyi yanlış yerine koymak ve gerçek sahibinin hakkını elinden almaktır."
  id: "Seorang penanya ditanya tentang kecurigaan yang diangkat oleh seorang ateis bahwa hewan tanpa tanggung jawab menanggung bencana dan tidak diberi kompensasi di akhirat. Dr. Salah Al-Sawy menjawab (Fatwa No. 86371 tanggal 22 Januari 2012) bahwa tindakan Allah tidak terpisahkan dari kebijaksanaan-Nya, termasuk apa yang kita pahami dan apa yang tidak. Bahkan jika hewan tidak wajib, pada Hari Penghakiman mereka akan dibawa kepada domba domba bertanduk, sebagaimana diatur dalam Sunnah. Oleh karena itu, tidak mustahil beberapa hal yang menimpa mereka di dunia ini—selain menjadi hukuman atau ujian bagi pemiliknya—akan menjadi hukuman duniawi bagi mereka. Ketidakadilan yang Tuhan larang terhadap diri-Nya adalah menempatkan sesuatu di tempat yang salah dan menolak hak pemilik yang sah."
