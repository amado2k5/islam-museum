id: work/fatwa-amja-animals-suffering
class: work
kind: fatwa
label: { ar: "مصائب الحيوانات غير المكلفة", en: "Calamities befalling unaccountable animals", ur: "غیر مکلف جانوروں پر مصائب" }
summary:
  ar: "سأل سائل عن شبهة يثيرها ملاحدة أن الحيوانات غير المكلفة تقع عليها المصائب ولا تعوض في الآخرة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86371 بتاريخ 22 يناير 2012)⁩ أن أفعال الله لا تنفك عن حكمته ومنها ما ندركه وما لا ندركه، وأن البهائم وإن لم يكن عليها تكليف فإنه يوم القيامة يقاد للشاة الجماء من الشاة القرناء كما ثبت في السنة، فلا يمتنع أن يكون بعض ما يصيبها في الدنيا — بالإضافة لكونه عقوبة أو ابتلاء لأصحابها — عقوبة دنيوية لها، وأن الظلم الذي حرمه الله على نفسه هو وضع الشيء في غير موضعه ومنع ذي الحق حقه."
  en: "A questioner raised the atheists' doubt that unaccountable animals suffer calamities with no afterlife compensation. Dr. Salah al-Sawi (fatwa no. 86371, 22 January 2012) answered that God's acts are never without wisdom — some grasped, some not; though beasts bear no obligation, on the Last Day retaliation is exacted for the hornless ewe from the horned one as the sunna records, so it is possible that part of what befalls them in this world — besides being a punishment or trial for their owners — is a worldly penalty for them too; and the injustice God forbade Himself is placing a thing out of place and withholding a due."
  ur: "ایک سائل نے ملحدین کے شبہ کا ذکر کیا کہ غیر مکلف جانوروں پر مصائب آتی ہیں اور آخرت میں تلافی نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86371، 22 جنوری 2012)⁩ کے مطابق اللہ کے افعال حکمت سے خالی نہیں؛ قیامت میں جانوروں کا بھی قصاص ہوتا ہے حدیث کے مطابق۔"
