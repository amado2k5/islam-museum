label: { ar: "قرار مجمع الفقه الإسلامي الدولي 2 (2/2) بشأن زكاة العقارات والأراضي المأجورة غير الزراعية", en: "IIFA resolution 2 (2/2) on zakat of rented non-agricultural property", ur: "اکیڈمی کی قرارداد 2 (2/2): کرایہ دی گئی غیر زرعی جائیداد کی زکوٰۃ", es: "Resolución 2 (2/2) de la IIFA sobre el zakat de los bienes no agrícolas arrendados.", fr: "Résolution 2 (2/2) de l'IIFA relative à la zakat des biens non agricoles loués", tr: "Tarım Dışı Kiralık Gayrimenkul ve Araziler Zekatı ile İlgili Uluslararası İslami Fiqh Akademisi Kararı 2 (2/2)", id: "Keputusan Akademi Fiqh Islam Internasional 2 (2/2) mengenai Zakat atas Properti dan Tanah Non-Pertanian yang Disewakan" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩: لا تجب الزكاة في أصول العقارات والأراضي المأجورة غير الزراعية وتجب في الغلة ربعَ العشر بعد دوران الحول مع توافر شروط الزكاة وانتفاء الموانع."
  en: "IIFA's second-session resolution (Kuwait, December 1985): no zakat on the capital of rented non-agricultural real estate and land; zakat falls on the yield at a quarter-tenth after a full year, provided zakat's conditions hold and impediments are absent."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩: کرایہ دی گئی جائیداد کے اصل پر زکوٰۃ نہیں؛ آمدن پر ربع العشر سال گزرنے پر ہے بشرط شرائط۔"
  es: "Resolución de la IIFA de su segunda sesión (Kuwait, diciembre de 1985): no se aplica zakat al capital de bienes inmuebles y terrenos no agrícolas arrendados; el zakat se aplica sobre el rendimiento en una proporción de un cuarto de la décima parte después de un año completo, siempre que se cumplan las condiciones del zakat y no existan impedimentos."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985): pas de zakat sur le capital des biens immobiliers et des terres non agricoles loués; la zakat est due sur le rendement à hauteur d'un quart de dixième après une année complète, à condition que les conditions de la zakat soient remplies et qu'aucun obstacle ne s'y oppose."
  tr: "Uluslararası İslami Fiqh Akademisi'nin ikinci oturumunda (Kuveyt, Aralık 1985) kararı: Zekat, gayrimenkul ve tarım dışı kiralık arazilerin ilkeleri için zorunlu değildir ve verim üzerinde, ay yılı geçtikten sonra zekat koşulları sağlandığı ve engel kaldırılmadığı sürece onda birinin dörtte biri ödenmelidir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keduanya (Kuwait, Desember 1985): Zakat tidak wajib bagi prinsip properti dan tanah sewa non-pertanian, dan untuk hasil panen, seperempat dari sepersepuluh harus jatuh tempo setelah tahun lunar berlalu, asalkan syarat zakat terpenuhi dan tidak ada hambatan yang dihilangkan."
