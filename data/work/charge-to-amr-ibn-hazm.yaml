label: { ar: "عهد النبي إلى عمرو بن حزم حين بعثه إلى اليمن", en: "The Prophet's written charge to Amr ibn Hazm on sending him to Yemen", es: "El mandato escrito del Profeta a Amr ibn Hazm al enviarlo a Yemen.", fr: "Instructions écrites du Prophète à Amr ibn Hazm concernant son envoi au Yémen", ur: "عمرو بن حزم کو یمن بھیجنے کا پیغمبر کا تحریری الزام", tr: "Peygamberin Amr ibn Hazm ile Yemen'e Gönderdiği Antlaşması", id: "Perjanjian Nabi dengan Amr ibn Hazm Ketika Ia Mengirimnya ke Yaman" }
summary:
  ar: "كتاب عهد كتبه النبي لعمرو بن حزم حين بعثه إلى بني الحارث بن كعب: يأمره بتقوى الله والأخذ بالحق وتبشير الناس وتعليم القرآن وألا يمس القرآن إلا طاهر، واللين في الحق والشدة في الظلم، وتعليم معالم الحج ⁦(الحج الأكبر والأصغر وهو العمرة)⁩، والنهي عن الصلاة في ثوب واحد صغير وعن الاحتباء المكشوف وعن عقص الشعر وعن الدعاء إلى القبائل والعشائر عند الهيج، والأمر بإسباغ الوضوء ومواقيت الصلوات الخمس والجمعة والغسل لها، وخمس المغانم، وفرائض الصدقة في الزرع والإبل والبقر والغنم، وحكم من أسلم من اليهود والنصارى ومن بقي على دينه وعليه دينار وافٍ على كل حالم أو عوضه ثياباً."
  en: "A written charge the Prophet gave Amr ibn Hazm when sending him to Banu al-Harith ibn Ka'b: fear God, take what is right, give good tidings, teach the Qur'an which none may touch but the pure, be gentle in right and severe against wrong, teach the rites of the greater hajj and the lesser (the umra), forbid praying in one small garment, sitting wrapped with the private parts exposed, braiding the hair at the nape, and tribal rallying-cries in strife; order full ablution, the five prayers at their times, Friday and its bath, the fifth of booty and the sadaqa rates on crops, camels, cattle and sheep, with the rule for Jews and Christians who convert and for those who keep their faith and owe a full dinar per adult or its value in cloth."
  es: "Una instrucción escrita que el Profeta le dio a Amr ibn Hazm cuando lo envió a Banu al-Harith ibn Ka'b: teme a Dios, toma lo que es correcto, da buenas nuevas, enseña el Corán que nadie puede tocar excepto los puros, sé amable con lo correcto y severo con lo incorrecto, enseña los ritos del Hajj mayor y el menor (la Umrah), prohíbe orar con una prenda pequeña, sentarse envuelto con las partes íntimas expuestas, trenzar el cabello en la nuca y los gritos de guerra tribales en la contienda; ordena la ablución completa, las cinco oraciones en sus tiempos, el viernes y su baño, la quinta parte del botín y las tasas de sadaqa sobre las cosechas, los camellos, el ganado y las ovejas, con la regla para los judíos y cristianos que se convierten y para aquellos que mantienen su fe y deben un dinar completo por adulto o su valor en tela."
  fr: "Voici les instructions écrites que le Prophète a données à Amr ibn Hazm lorsqu'il l'a envoyé auprès des Banu al-Harith ibn Ka'b: craindre Dieu, faire ce qui est juste, annoncer la bonne nouvelle, enseigner le Coran que seuls les purs peuvent toucher, être doux dans le bien et sévère envers le mal, enseigner les rites du grand hajj et du petit (la umra), interdire de prier vêtu d'un seul vêtement, de s'asseoir enveloppé avec les parties intimes exposées, de tresser les cheveux à la nuque et les cris de ralliement tribaux en temps de conflit; ordonner les ablutions complètes, les cinq prières à leurs heures, le vendredi et son bain rituel, le cinquième du butin et les aumônes sur les récoltes, les chameaux, les bovins et les moutons, avec la règle pour les juifs et les chrétiens qui se convertissent et pour ceux qui conservent leur foi et doivent un dinar complet par adulte ou son équivalent en tissu."
  ur: "رسول اللہ نے عمرو بن حزم کو بنی حارث بن کعب کے پاس بھیجتے وقت ایک تحریری تاکید کی تھی: خدا سے ڈرو، جو صحیح ہے اسے لو، بشارت دو، قرآن سکھاؤ جسے پاکیزہ کے سوا کوئی ہاتھ نہ لگا سکے، حق میں نرمی اور برائی کے خلاف سختی کرو، بڑے حج اور چھوٹے ⁦(عمرہ)⁩ کے مناسک سکھاؤ، شرمگاہ کے ساتھ بیٹھ کر نماز پڑھو۔ بے نقاب، بالوں کو جھنجھوڑنا، اور قبائلی ہنگامہ آرائی۔ پورے وضو، پانچوں نمازوں کو ان کے اوقات میں، جمعہ اور اس کا غسل، پانچواں مال غنیمت اور فصلوں، اونٹوں، مویشیوں اور بھیڑ بکریوں کا صدقہ، یہود و نصاریٰ اور مذہب تبدیل کرنے والوں کے لیے اور ان لوگوں کے لیے جو اپنے عقیدے کو برقرار رکھتے ہیں اور فی بالغ دینار یا اس کی قیمت کپڑے میں ادا کرتے ہیں۔"
  tr: "Peygamber'in Amr ibn Hazm'a yazdığı bir antlaşma kitabı; Banu el-Haris ibn Ka'b'a gönderdiğinde ona Allah'tan korkmasını, gerçeği kabul etmesini, insanlara müjde vermesini, Kur'an'ı öğretmesini, Kur'an'a sadece saf bir şekilde dokunmasını, doğruda nazik ve baskıda katı olmasını, Hac (büyük ve küçük Hac, yani Umre) işaretlerini öğretmesini, tek küçük giysiyle namaz kılmayı yasaklamayı, açık giysi giymeyi, saç bağlamayı, hac sırasında kabilelere ve aşiretlere namaz kılmasını, beş ve cuma namazının zamanı ve onlar için sabırsızlanmayı, ganimetlerin beşte birini yıkamasını, ürünler, develer, hayvanlar ve koyunlar üzerinde zorunlu sadaka yapmayı, Yahudiler ve Hristiyanlar arasında İslam'a geçenlere ve dininde kalanlara her rüya gören için tam dinar vermesini veya kıyafetle değiştirmesini emrediyor."
  id: "Sebuah kitab perjanjian yang ditulis oleh Nabi kepada Amr ibn Hazm ketika ia mengirimkannya kepada Banu al-Harith ibn Ka'b: memerintahkan dia untuk takut kepada Allah, menerima kebenaran, memberi kabar bahagia kepada orang-orang, mengajarkan Al-Qur'an, menyentuh Al-Qur'an kecuali yang suci, bersikap lembut dalam kebenaran dan tegas dalam penindasan, mengajarkan penanda-tanda Haji (Haji besar dan kecil, yaitu Umrah), melarang shalat dengan pakaian kecil tunggal, mengenakan pakaian terbuka, mengikat rambut, berdoa kepada suku dan klan selama Haji, memerintahkan wudhu dan waktu salat lima dan Jumat, serta mencuci untuk mereka, seperlima rampasan, sedekah wajib untuk tanaman, unta, ternak, dan domba, serta aturan bagi mereka yang memeluk Islam di antara Yahudi dan Kristen serta mereka yang tetap berpegang agama dengan dinar penuh untuk setiap pemimpi atau menggantinya dengan pakaian."
