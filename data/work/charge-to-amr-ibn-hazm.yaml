label: { ar: "عهد النبي إلى عمرو بن حزم حين بعثه إلى اليمن", en: "The Prophet's written charge to Amr ibn Hazm on sending him to Yemen" }
summary:
  ar: "كتاب عهد كتبه النبي لعمرو بن حزم حين بعثه إلى بني الحارث بن كعب: يأمره بتقوى الله والأخذ بالحق وتبشير الناس وتعليم القرآن وألا يمس القرآن إلا طاهر، واللين في الحق والشدة في الظلم، وتعليم معالم الحج (الحج الأكبر والأصغر وهو العمرة)، والنهي عن الصلاة في ثوب واحد صغير وعن الاحتباء المكشوف وعن عقص الشعر وعن الدعاء إلى القبائل والعشائر عند الهيج، والأمر بإسباغ الوضوء ومواقيت الصلوات الخمس والجمعة والغسل لها، وخمس المغانم، وفرائض الصدقة في الزرع والإبل والبقر والغنم، وحكم من أسلم من اليهود والنصارى ومن بقي على دينه وعليه دينار وافٍ على كل حالم أو عوضه ثياباً."
  en: "A written charge the Prophet gave Amr ibn Hazm when sending him to Banu al-Harith ibn Ka'b: fear God, take what is right, give good tidings, teach the Qur'an which none may touch but the pure, be gentle in right and severe against wrong, teach the rites of the greater hajj and the lesser (the umra), forbid praying in one small garment, sitting wrapped with the private parts exposed, braiding the hair at the nape, and tribal rallying-cries in strife; order full ablution, the five prayers at their times, Friday and its bath, the fifth of booty and the sadaqa rates on crops, camels, cattle and sheep, with the rule for Jews and Christians who convert and for those who keep their faith and owe a full dinar per adult or its value in cloth."
