id: work/fatwa-dar-alifta-eg-reading-quran-with-shoes
class: work
kind: fatwa
label: { ar: "حكم قراءة القرآن حال لبس الحذاء", en: "Reading the Qur'an while wearing shoes", ur: "جوتے پہنے قرآن پڑھنے کا حکم", es: "Leer el Corán con zapatos puestos", fr: "Lire le Coran en portant des chaussures" }
summary:
  ar: "سائل سأل عن قراءة القرآن حال لبس الحذاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22027)⁩ أنه لا مانع شرعًا من قراءة القرآن حال لبس الحذاء ما دام الإنسان خاليًا مما يمنع القراءة كجنابة ونحوها، على ما فصّل الجواب."
  en: "A questioner asked about reading the Qur'an while wearing shoes. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22027) answered that there is no sharia bar to reading the Qur'an in shoes as long as nothing that bars recitation — such as major impurity — holds, as the answer details."
  ur: "ایک سائل نے جوتے پہنے قرآن پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22027)⁩ نے جواب دیا کہ جوتے میں قرآن پڑھنے میں شرعاً کوئی مانع نہیں بشرطیکہ کوئی چیز تلاوت سے نہ روکے جیسے جنابت وغیرہ، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de leer el Corán con zapatos puestos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22027) respondió que no existe ninguna prohibición islámica para leer el Corán con zapatos, siempre y cuando no haya ninguna circunstancia que impida la recitación, como una impureza mayor, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la lecture du Coran avec des chaussures. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22027) a répondu qu'il n'y a pas d'interdiction islamique (charia) de lire le Coran avec des chaussures tant qu'aucun élément empêchant la récitation – comme une impureté majeure – n'est présent, comme le précise la réponse."
