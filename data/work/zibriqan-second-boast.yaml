label: { ar: "أبيات تُروى للزبرقان بن بدر «أتيناك كيما يعلم الناس فضلنا»", en: "Verses attributed to al-Zibriqan ibn Badr, 'We came so that people would know our merit'", es: "Versos atribuidos a al-Zibriqan ibn Badr: «Vinimos para que la gente conociera nuestro mérito».", fr: "Versets attribués à al-Zibriqan ibn Badr: « Nous sommes venus pour que les gens connaissent notre mérite. »", ur: "الزبرقان بن بدر سے منسوب آیات، 'ہم اس لیے آئے تھے کہ لوگ ہماری فضیلت کو جانیں'۔" }
summary:
  ar: "أربعة أبيات على روي الميم يرويها ابن هشام عن بعض أهل العلم بالشعر من بني تميم للزبرقان حين قدم في وفد بني تميم: فروع الناس، وليس في الحجاز كدارم، وذود المُعْلِمين، والمرباع في كل غارة. أجابها حسان بقصيدة على الروي نفسه. النسبة من ابن هشام لا من ابن إسحاق."
  en: "Four mim-rhymed verses that Ibn Hisham reports from Tamimi men of letters as al-Zibriqan's when he came in the delegation: the foremost of men, none in the Hijaz like Darim, repelling marked warriors, the chief's quarter of every raid. Hassan answered on the same rhyme. The attribution rests on Ibn Hisham, not Ibn Ishaq."
  es: "Cuatro versos con rima mímica que Ibn Hisham atribuye a al-Zibriqan, según relatos de eruditos tamiminos, cuando este formó parte de la delegación: «El más destacado de los hombres, nadie en el Hiyaz como Darim, repeliendo a guerreros marcados, el cuartel del jefe en cada incursión». Hassan respondió con la misma rima. La atribución recae en Ibn Hisham, no en Ibn Ishaq."
  fr: "Ibn Hisham rapporte quatre vers rimés en mim, attribués par des lettrés tamimites à al-Zibriqan lors de son arrivée en délégation: « Le plus grand des hommes, nul dans le Hedjaz comme Darim, repoussant des guerriers d'élite, le quartier du chef de chaque raid. » Hassan répondit sur la même rime. L'attribution repose sur Ibn Hisham, et non sur Ibn Ishaq."
  ur: "میم والی چار آیات جو ابن ہشام نے تمیمی کے خطوط کے آدمیوں سے بیان کی ہیں جب وہ وفد میں آیا تھا: جب وہ وفد میں آیا تھا: مردوں میں سب سے آگے، حجاز میں داریم کی طرح کوئی نہیں، نشان زدہ جنگجوؤں کو پیچھے ہٹانے والا، ہر چھاپہ کے سربراہ کا چوتھائی۔ حسن نے اسی نظم پر جواب دیا۔ انتساب ابن ہشام پر ہے، ابن اسحاق پر نہیں۔"
