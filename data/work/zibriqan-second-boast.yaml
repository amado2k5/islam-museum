label: { ar: "أبيات تُروى للزبرقان بن بدر «أتيناك كيما يعلم الناس فضلنا»", en: "Verses attributed to al-Zibriqan ibn Badr, 'We came so that people would know our merit'" }
summary:
  ar: "أربعة أبيات على روي الميم يرويها ابن هشام عن بعض أهل العلم بالشعر من بني تميم للزبرقان حين قدم في وفد بني تميم: فروع الناس، وليس في الحجاز كدارم، وذود المُعْلِمين، والمرباع في كل غارة. أجابها حسان بقصيدة على الروي نفسه. النسبة من ابن هشام لا من ابن إسحاق."
  en: "Four mim-rhymed verses that Ibn Hisham reports from Tamimi men of letters as al-Zibriqan's when he came in the delegation: the foremost of men, none in the Hijaz like Darim, repelling marked warriors, the chief's quarter of every raid. Hassan answered on the same rhyme. The attribution rests on Ibn Hisham, not Ibn Ishaq."
