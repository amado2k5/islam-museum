id: work/fatwa-dar-alifta-eg-ewallet-transfers-withdrawals
class: work
kind: fatwa
label: { ar: "حكم التحويل والسحب من المحافظ الإلكترونية", en: "Transfers and withdrawals through e-wallets", ur: "ای والٹ سے منتقلی اور وصولی", es: "Transferencias y retiros a través de monederos electrónicos", fr: "Transferts et retraits via portefeuilles électroniques", tr: "Elektronik cüzdanlardan transfer ve çekim kararı", id: "Putusan tentang transfer dan penarikan dari dompet elektronik" }
summary:
  ar: "سائل سأل عن التحويل والسحب من المحافظ الإلكترونية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21034)⁩ أن المعاملة المسؤول عنها جائزة شرعًا لأنها من قبيل عقد الوكالة مع وجوب أن تتم وفق اللوائح والقوانين المنظمة لها على ما فصّل الجواب."
  en: "A questioner asked about transfers and withdrawals through electronic wallets. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21034) answered that the transaction is lawful, being of the agency-contract kind, provided it proceeds under its regulating rules and laws — as the answer details."
  ur: "ایک سائل نے ای والٹ سے رقم منتقل کرنے اور نکالنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21034)⁩ نے جواب دیا کہ یہ وکالت کے عقد کی قسم سے جائز ہے بشرطیکہ ضوابط پر عمل ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre las transferencias y retiros a través de monederos electrónicos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21034) respondió que la transacción es lícita, al ser de tipo contrato de agencia, siempre que se realice conforme a sus normas y leyes reguladoras, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les transferts et les retraits via portefeuilles électroniques. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21034) a répondu que la transaction est licite, car elle relève du contrat de mandat, à condition qu'elle soit effectuée conformément à sa réglementation et à ses lois – comme le précise la réponse."
  tr: "Bir soru soran kişi, elektronik cüzdanlardan yapılan transfer ve çekimler hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21034), bu işlemin dini olarak izin verilen bir vekaletname sözleşmesi gibi olduğunu, bu işlemin düzenleme ve yasalara uygun olarak yapılması gerektiğini, yanıtta ayrıntılı olarak belirtildiği gibi, bunu belirtti."
  id: "Seorang penanya menanyakan tentang transfer dan penarikan dari dompet elektronik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21034) menjawab bahwa transaksi yang secara agama diperbolehkan karena mirip dengan kontrak surat kuasa, dengan kewajiban untuk melaksanakannya sesuai dengan peraturan dan hukum yang mengaturnya, sebagaimana dijelaskan dalam jawaban."
