label: { ar: "حكم حج مريض ألزهايمر", en: "The Hajj of an Alzheimer's patient", ur: "الزھیمر کے مریض کا حج", es: "El Hajj de un paciente de Alzheimer", fr: "Le pèlerinage d'un patient atteint de la maladie d'Alzheimer", tr: "Alzheimer hastası için hac kararı", id: "Putusan tentang ziarah bagi pasien Alzheimer" }
summary:
  ar: "سائل سأل عن حج مريض ألزهايمر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21913)⁩ أن المريض يمر بمراحل ثلاث تظهر فيها الأعراض تدريجيًّا وإن اشتركت في معنى النسيان والتيه ونقص الإدراك فإن الحكم يختلف باختلاف المرحلة على ما فصّل الجواب."
  en: "A questioner asked about the Hajj of an Alzheimer's patient. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21913) answered that the illness passes through three stages whose symptoms appear gradually — sharing the elements of forgetfulness, confusion and diminished awareness — and the ruling differs with the stage, as the answer details."
  ur: "ایک سائل نے الزھیمر کے مریض کے حج کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21913)⁩ نے جواب دیا کہ مرض تین مراحل سے گزرتا ہے جن میں علامات بتدریج ظاہر ہوتی ہیں اور اگرچہ بھولنے، بھٹکنے اور ادراک کی کمی میں مشترک ہیں تاہم حکم مرحلے کے مطابق بدلتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la peregrinación a La Meca (Hajj) de un paciente con Alzheimer. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21913) respondió que la enfermedad atraviesa tres etapas cuyos síntomas aparecen gradualmente —que comparten elementos como el olvido, la confusión y la disminución de la consciencia— y que la norma difiere según la etapa, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le pèlerinage à La Mecque pour une personne atteinte de la maladie d'Alzheimer. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21913) a répondu que la maladie évolue en trois stades dont les symptômes apparaissent progressivement – caractérisés par des pertes de mémoire, de la confusion et une diminution de la vigilance – et que la décision relative au pèlerinage varie selon le stade, comme le précise la réponse."
  tr: "Bir soru soran kişi, Alzheimer hastasının yaptığı hac yolculuğu hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21913), hastanın belirtilerin yavaş yavaş ortaya çıktığı üç aşamadan geçtiğini yanıtladı. Hepsi unutkanlık, kafa karışıklığı ve anlama eksikliği anlamlarını paylaşsa da, karar cevabında ayrıntılı olarak evreye göre değişir."
  id: "Seorang penanya menanyakan tentang ziarah yang dilakukan oleh pasien Alzheimer. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21913) menjawab bahwa pasien mengalami tiga tahap di mana gejala secara bertahap muncul. Meskipun semuanya memiliki makna lupa, bingung, dan kurang pemahaman, putusan tersebut berbeda-beda tergantung pada tahap yang dijelaskan dalam jawaban."
