id: work/fatwa-amja-suitor-asked-about-woman
class: work
kind: fatwa
label: { ar: "الشهادة عن أخلاق الخطيبة", en: "Asked about a woman's character by her suitor — tell the truth", ur: "خاطب کے لیے عورت کے اخلاق کی گواہی", es: "Cuando un pretendiente le pregunta a una mujer sobre su carácter, debe decir la verdad.", fr: "Interrogée sur le caractère d'une femme par son prétendant, dites la vérité.", tr: "Nişanlının Ahlakı Hakkında Tanıklık", id: "Kesaksian tentang Moral Tunangan" }
summary:
  ar: "سأل سائل ما الواجب على من سئل عن بنت ليخطبها وهو يعلم أن أخلاقها فاسدة هل يقول الحقيقة للخاطب أم يسكت. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 21833 بتاريخ 23 يناير 2006)⁩ أنه لا يجوز كتمان الشهادة قال تعالى ولا تكتموا الشهادة ومن يكتمها فإنه آثم قلبه فعليه أن يخبره بالحقيقة وقال على مثل الشمس فاشهد وإلا فدع، وثانيًا عليه أن يعمل على إيصال النصح لهذه الفتاة من خلال امرأة صالحة لأن الدين النصيحة كما أرشد النبي."
  en: "A questioner asked what one must do when a suitor asks him about a woman whose morals he knows are corrupt — tell the truth or keep silent? Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 21833, 23 January 2006) answered that concealing testimony is not lawful — 'do not conceal testimony; whoever conceals it has a sinful heart' — so he must tell the truth, per 'witness to one like the sun, else leave it'; and secondly he should carry counsel to the woman through a righteous woman, for 'religion is sincere counsel' as the Prophet guided."
  ur: "ایک سائل نے خاطب کو عورت کے اخلاق بتانے کا حکم پوچھا۔ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 21833، 23 جنوری 2006)⁩ کے مطابق گواہی چھپانا جائز نہیں — سچ بتائے اور عورت تک نصیحت پہنچائے۔"
  es: "Un interlocutor preguntó qué se debe hacer cuando un pretendiente pregunta acerca de una mujer cuya moral sabe que es corrupta: ¿decir la verdad o guardar silencio? El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.° 21833, 23 de enero de 2006) respondió que ocultar el testimonio no es lícito: «No ocultes el testimonio; quien lo oculta tiene un corazón pecaminoso». Por lo tanto, debe decir la verdad, según «Dar testimonio a alguien como el sol, de lo contrario, dejarlo pasar». En segundo lugar, debe aconsejar a la mujer a través de una mujer virtuosa, pues «la religión es un consejo sincero», como enseñó el Profeta."
  fr: "Un homme a demandé ce qu'il fallait faire lorsqu'un prétendant l'interrogeait sur une femme dont il savait les mœurs douteuses: dire la vérité ou se taire ? Le Dr Muhammad Mawfiq al-Ghalayini (fatwa n° 21833, 23 janvier 2006) a répondu que dissimuler un témoignage n'est pas licite: « Ne dissimulez pas votre témoignage; celui qui le dissimule a un cœur pécheur. » Il doit donc dire la vérité, « témoigner comme le soleil, sinon abstenez-vous ». De plus, il est conseillé à l'homme de se référer à une femme vertueuse pour le conseiller, car « la religion est un conseil sincère », comme l'a enseigné le Prophète."
  tr: "Bir soru soran kişi, bir kızın ahlakının bozulduğunu bilerek evlenme teklif etmesi ne görev diye sordu: talibe gerçeği söylemeli mi yoksa susmalı mı? Dr. Muhammed Muwafaq Al-Ghalayini (23 Ocak 2006 tarihli 21833 sayılı fetva) şahitliği gizlemenin caiz olmadığını yanıtladı. Allah şöyle dedi: 'Tanıklığı gizleme, kim gizlerse, kalbinde günahkar.' Ona gerçeği bildirmeli ve şöyle demelidir: 'Güneş gibi şahitlik et, yoksa onu bırak.' İkinci olarak, bu kıza doğru bir kadın aracılığıyla öğüt vermek için çalışmalıdır, çünkü din, Peygamber'in rehberliğinde verilen bir öğüttür."
  id: "Seorang penanya bertanya apa kewajiban seseorang yang ditanya tentang seorang gadis untuk melamar meskipun mengetahui moralnya korup: haruskah dia berkata jujur kepada calon pria atau diam? Dr. Muhammad Muwafaq Al-Ghalayini menjawab (Fatwa No. 21833 tanggal 23 Januari 2006) bahwa tidak diperbolehkan menyembunyikan kesaksian. Allah berfirman: 'Jangan sembunyikan kesaksian, dan siapa pun menyembunyikannya adalah berdosa di dalam hatinya.' Dia harus memberitahukan kebenaran dan berkata: 'Bersaksi seperti matahari, jika tidak tinggalkan.' Kedua, dia harus berusaha menyampaikan nasihat kepada gadis ini melalui wanita yang benar, karena agama adalah nasihat yang dipandu oleh Nabi."
