label: { ar: "حكم شراء الأصوات الانتخابية", en: "Buying electoral votes", ur: "انتخابی ووٹ خریدنے کا حکم", es: "Comprar votos electorales" }
summary:
  ar: "سائل سأل عن شراء الأصوات الانتخابية بدفع المال للناخبين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22214)⁩ أن ذلك يحرم شرعًا وهو من الرشوة المحرمة والمعدودة من كبائر الذنوب، على ما فصّل الجواب."
  en: "A questioner asked about buying electoral votes by paying voters. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22214) answered that this is forbidden in the sharia — it is of the prohibited bribery counted among the major sins, as the answer details."
  ur: "ایک سائل نے ووٹروں کو رقم دے کر ووٹ خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22214)⁩ نے جواب دیا کہ یہ شرعاً حرام ہے — یہ ممنوع رشوت ہے جو کبیرہ گناہوں میں شمار ہوتی ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la compra de votos electorales mediante el pago a los votantes. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22214) respondió que esto está prohibido por la sharia; se trata de un soborno prohibido que se cuenta entre los pecados mayores, como se detalla en la respuesta."
