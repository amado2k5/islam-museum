id: work/fatwa-dar-alifta-eg-end-of-divorce-idda
class: work
kind: fatwa
label: { ar: "وقت انتهاء عدة المطلقة", en: "When a divorced woman's waiting period ends", ur: "مطلقہ کی عدت کب ختم ہوتی ہے", es: "Cuando finaliza el período de espera de una mujer divorciada", fr: "Quand la période d'attente d'une femme divorcée prend fin", tr: "Boşanmış kadının bekleme süresinin bitiş süresi", id: "Masa tunggu wanita yang bercerai" }
summary:
  ar: "سائل سأل عن وقت انتهاء عدة المطلقة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22190)⁩ أن عدة المطلقة تنتهي بوضع الحمل إن كانت حاملًا، وأما غير الحامل فإن كانت من ذوات الحيض فعدتها ثلاثة قروء، وبيّن الجواب بقية الأحوال على وجهها."
  en: "A questioner asked when a divorced woman's waiting period ends. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22190) answered that it ends with delivery if she is pregnant; if not pregnant and she menstruates, her idda is three cycles; the answer sets out the remaining cases in their order."
  ur: "ایک سائل نے پوچھا کہ مطلقہ کی عدت کب ختم ہوتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22190)⁩ نے جواب دیا کہ اگر وہ حاملہ ہو تو عدت اولاد کی پیدائش پر ختم ہوتی ہے؛ غیر حامل ہو اور حیض والی ہو تو تین قرء؛ باقی صورتیں جواب میں بیان ہوئیں۔"
  es: "Una persona preguntó cuándo termina el período de espera de una mujer divorciada. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22190) respondió que termina con el parto si está embarazada; si no está embarazada y menstrúa, su idda es de tres ciclos; la respuesta expone los casos restantes en orden."
  fr: "Une personne a demandé quand prend fin la période de viduité (idda) d'une femme divorcée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22190) a répondu que cette période se termine à l'accouchement si la femme est enceinte; si elle n'est pas enceinte et qu'elle a ses menstruations, la période de viduité est de trois cycles; la réponse détaille les autres cas dans leur ordre."
  tr: "Bir soru soran kişi, boşanmış bir kadının bekleme süresinin (idde) bitiş zamanını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 22190), boşanmış bir kadının bekleme süresinin hamile olması halinde hamilelikle sona erdiğini, hamile değilse bekleme süresinin üç okuma olduğunu yanıtladı. Cevap, diğer vakaları olduğu gibi açıklıyor."
  id: "Seorang penanya menanyakan tentang waktu berakhirnya masa tunggu (iddah) bagi wanita yang bercerai. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22190) menjawab bahwa masa tunggu bagi wanita yang bercerai berakhir dengan kehamilan jika dia hamil, dan jika dia tidak hamil, masa tunggunya adalah tiga pembacaan. Jawaban tersebut menjelaskan kasus lainnya apa adanya."
