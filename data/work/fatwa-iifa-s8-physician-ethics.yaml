summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: تأجيل إصدار قرار في أخلاقيات الطبيب مسؤوليته وضمانه والتداوي بالمحرمات والنظر في دستور المهنة الطبية المعد من المنظمة الإسلامية للعلوم الطبية بالكويت، وطلب استكتاب مزيد من الأبحاث لعرضها في دورة قادمة."
  en: "IIFA's eighth-session resolution (Brunei, June 1993): it deferred ruling on the physician's ethics, responsibility and liability, on treatment with prohibited substances, and on the medical-profession charter prepared by the Islamic Organisation for Medical Sciences in Kuwait, requesting further studies for a coming session."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: معالج کی اخلاقیات، حرام اشیا سے علاج اور طبی منشور پر فیصلہ مؤخر۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993): aplazó la decisión sobre la ética, la responsabilidad y la obligación legal del médico, sobre el tratamiento con sustancias prohibidas y sobre la carta de la profesión médica elaborada por la Organización Islámica para las Ciencias Médicas en Kuwait, solicitando estudios adicionales para una próxima sesión."
