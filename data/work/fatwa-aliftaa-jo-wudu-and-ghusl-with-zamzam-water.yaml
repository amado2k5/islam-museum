id: work/fatwa-aliftaa-jo-wudu-and-ghusl-with-zamzam-water
class: work
kind: fatwa
label: { ar: "الوضوء والاغتسال بماء زمزم", en: "Wudu and ghusl with Zamzam water", ur: "زمزم کے پانی سے وضو اور غسل" }
summary:
  ar: "سؤال عن الوضوء والاغتسال من ماء زمزم، أجابت فيه دائرة الإفتاء العام الأردنية بأنهما جائزان، وبأن العلماء إنما كرهوا الاستنجاء به. أجابت الدائرة بأنه يجوز الوضوء والاغتسال بماء زمزم. وقالت إن العلماء إنما كرهوا الاستنجاء به."
  en: "A question about performing wudu and ghusl with Zamzam water, in which Jordan's General Iftaa Department answered that both are permitted, and that scholars disliked only using it to cleanse oneself after relieving oneself. The Department answered that wudu and ghusl with Zamzam water are permitted. It said that scholars disliked only using it for istinja, cleansing oneself after relieving oneself."
  ur: "زمزم کے پانی سے وضو اور غسل کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دونوں جائز ہیں، اور علما نے صرف اس سے استنجا کو مکروہ کہا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زمزم کے پانی سے وضو اور غسل جائز ہے۔ اس نے کہا کہ علما نے صرف اس سے استنجا کو مکروہ کہا ہے۔"
