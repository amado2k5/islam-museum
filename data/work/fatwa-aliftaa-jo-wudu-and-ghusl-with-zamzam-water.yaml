id: work/fatwa-aliftaa-jo-wudu-and-ghusl-with-zamzam-water
class: work
kind: fatwa
label: { ar: "الوضوء والاغتسال بماء زمزم", en: "Wudu and ghusl with Zamzam water", ur: "زمزم کے پانی سے وضو اور غسل", es: "Wudu y ghusl con agua de Zamzam", fr: "Ablutions et bain rituel avec l'eau de Zamzam", tr: "Zamzam suyuyla abdest alma ve banyo", id: "Wudhu dan mandi dengan air Zamzam" }
summary:
  ar: "سؤال عن الوضوء والاغتسال من ماء زمزم، أجابت فيه دائرة الإفتاء العام الأردنية بأنهما جائزان، وبأن العلماء إنما كرهوا الاستنجاء به. أجابت الدائرة بأنه يجوز الوضوء والاغتسال بماء زمزم. وقالت إن العلماء إنما كرهوا الاستنجاء به."
  en: "A question about performing wudu and ghusl with Zamzam water, in which Jordan's General Iftaa Department answered that both are permitted, and that scholars disliked only using it to cleanse oneself after relieving oneself. The Department answered that wudu and ghusl with Zamzam water are permitted. It said that scholars disliked only using it for istinja, cleansing oneself after relieving oneself."
  ur: "زمزم کے پانی سے وضو اور غسل کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ دونوں جائز ہیں، اور علما نے صرف اس سے استنجا کو مکروہ کہا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زمزم کے پانی سے وضو اور غسل جائز ہے۔ اس نے کہا کہ علما نے صرف اس سے استنجا کو مکروہ کہا ہے۔"
  es: "Una pregunta sobre la realización del wudu y el ghusl con agua de Zamzam, a la que el Departamento General de Iftaa de Jordania respondió que ambos están permitidos, y que los eruditos desaconsejan su uso únicamente para la purificación después de la micción. El Departamento respondió que el wudu y el ghusl con agua de Zamzam están permitidos. Añadió que los eruditos desaconsejan su uso únicamente para el istinja, la purificación después de la micción."
  fr: "Une question concernant l'exécution des ablutions (wudu) et du bain rituel (ghusl) avec l'eau de Zamzam a été posée. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que les deux pratiques sont permises, et que les savants désapprouvent son utilisation exclusive pour l'istinja (purification après défécation)."
  tr: "Zamzam suyu ile abdest alma ve banyo hakkında bir soru, Ürdün Genel Fetva Dairesi, her ikisinin de caiz olduğunu ve alimlerin sadece istinja' (kendini temizlemek) suyuyla temizlemeyi sevmediklerini belirtti. Daire, zamzam suyu ile abdest alma ve ghusl yapmanın caiz olduğunu söyledi. Bilginlerin sadece istinja'yı (kendini temizlemeyi) sevmediğini belirtti."
  id: "Sebuah pertanyaan tentang wudhu dan mandi dengan air Zamzam, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa keduanya diperbolehkan, dan para ulama hanya tidak suka istinja' (membersihkan diri) dengan air itu. Departemen menjawab bahwa diperbolehkan melakukan wudhu dan ghusl dengan air Zamzam. Departemen tersebut mengatakan bahwa para sarjana hanya tidak suka istinja' (membersihkan diri) dengan air itu."
