id: work/fatwa-dar-alifta-eg-praying-unsure-of-time
class: work
kind: fatwa
label: { ar: "حكم صلاة من صلى شاكًّا في دخول الوقت فتبين دخوله", en: "The prayer of one who prayed unsure of the time, then learned it had begun", ur: "وقت کے دخول میں شک کرتے ہوئے نماز پڑھنا", es: "La oración de alguien que oró sin estar seguro del tiempo, y luego supo que había comenzado.", fr: "La prière de celui qui priait sans savoir à quelle heure, puis apprit que le jour avait commencé", tr: "Zamanı sorgulayan kişinin dua hakkındaki kararı ve onun girdiği netleşiyor", id: "Putusan atas doa seseorang yang berdoa dengan meragukan waktu dan menjadi jelas bahwa dia telah masuk" }
summary:
  ar: "سائل سأل عن من صلى شاكًّا في دخول الوقت فتبين له دخوله بعد أدائه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22009)⁩ أنه يجب على المسلم التثبت من دخول وقت الصلاة قبل أدائها فإن شك ثم تبين دخوله بعد الفراغ أعاد على ما فصّل الجواب من التفصيل."
  en: "A questioner asked about one who prayed while doubting whether the time had begun, then learned it had. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22009) answered that a Muslim must confirm the prayer time has entered before praying; if he doubted then learned it had entered after finishing, he repeats — with the details the answer sets out."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس نے وقت کے دخول میں شک کی حالت میں نماز پڑھی اور بعد میں معلوم ہوا کہ وقت داخل ہو چکا تھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22009)⁩ نے جواب دیا کہ نماز سے پہلے وقت کے دخول کی تصدیق واجب ہے؛ اگر شک میں پڑھے اور بعد میں دخول معلوم ہو تو دہرائے — جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre alguien que rezó dudando si había comenzado la hora de la oración, y luego se enteró de que sí había comenzado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22009) respondió que un musulmán debe confirmar que ha comenzado la hora de la oración antes de rezar; si dudó y luego se enteró de que había comenzado después de terminar, reitera —con los detalles que se exponen en la respuesta—."
  fr: "Un internaute a posé une question concernant une personne qui priait en doutant que l'heure de la prière avait commencé, puis qui s'en est aperçue. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22009) a répondu qu'un musulman doit s'assurer que l'heure de la prière est arrivée avant de prier; s'il a douté et s'en est aperçu après avoir terminé sa prière, la Dar al-Ifta répète, en détaillant la réponse."
  tr: "Bir soru soran kişi, namaz zamanı girdiğinden şüphe eden birini sordu ve zamanı kaçırdıktan sonra namaza girdiği ona netleşti. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22009), bir Müslümanın namaz vaktinin girdiğini doğrulaması gerektiğini yanıtladı. Şüphe varsa ve ara verdikten sonra girdiği netleşirse, cevabın ayrıntılı açıklamasını tekrarlamalıdır."
  id: "Seorang penanya menanyakan tentang seseorang yang berdoa dengan meragukan waktu telah masuk dan menjadi jelas baginya bahwa ia masuk setelah melakukannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22009) menjawab bahwa seorang Muslim harus memastikan bahwa waktu salat telah masuk sebelum melakukannya. Jika ragu dan jelas bahwa ia masuk setelah jeda, ia harus mengulangi penjelasan rinci atas jawabannya."
