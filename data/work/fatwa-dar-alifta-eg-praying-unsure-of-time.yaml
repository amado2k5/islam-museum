label: { ar: "حكم صلاة من صلى شاكًّا في دخول الوقت فتبين دخوله", en: "The prayer of one who prayed unsure of the time, then learned it had begun", ur: "وقت کے دخول میں شک کرتے ہوئے نماز پڑھنا", es: "La oración de alguien que oró sin estar seguro del tiempo, y luego supo que había comenzado." }
summary:
  ar: "سائل سأل عن من صلى شاكًّا في دخول الوقت فتبين له دخوله بعد أدائه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22009)⁩ أنه يجب على المسلم التثبت من دخول وقت الصلاة قبل أدائها فإن شك ثم تبين دخوله بعد الفراغ أعاد على ما فصّل الجواب من التفصيل."
  en: "A questioner asked about one who prayed while doubting whether the time had begun, then learned it had. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22009) answered that a Muslim must confirm the prayer time has entered before praying; if he doubted then learned it had entered after finishing, he repeats — with the details the answer sets out."
  ur: "ایک سائل نے اس شخص کا حکم پوچھا جس نے وقت کے دخول میں شک کی حالت میں نماز پڑھی اور بعد میں معلوم ہوا کہ وقت داخل ہو چکا تھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22009)⁩ نے جواب دیا کہ نماز سے پہلے وقت کے دخول کی تصدیق واجب ہے؛ اگر شک میں پڑھے اور بعد میں دخول معلوم ہو تو دہرائے — جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre alguien que rezó dudando si había comenzado la hora de la oración, y luego se enteró de que sí había comenzado. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22009) respondió que un musulmán debe confirmar que ha comenzado la hora de la oración antes de rezar; si dudó y luego se enteró de que había comenzado después de terminar, reitera —con los detalles que se exponen en la respuesta—."
