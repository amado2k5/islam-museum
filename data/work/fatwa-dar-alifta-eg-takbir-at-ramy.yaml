label: { ar: "حكم التكبير عند رمي حصى الجمار", en: "Saying takbir while throwing the jamarat pebbles", ur: "جمرات پر کنکریاں مارتے وقت تکبیر", es: "Decir takbir mientras se arrojan los guijarros jamarat", fr: "Dire le takbir en lançant les cailloux du Jamarat", tr: "Jamarat'ın çakıl taşlarını taşlarken Tekbir söylenmesine ilişkin karar", id: "Putusan tentang mengucapkan Takbir saat melempar batu ke kerikil Jamarat" }
summary:
  ar: "سائل سأل عن التكبير عند رمي حصى الجمار. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21923)⁩ أنه يستحب للحاج أن يكبر مع كل حصاة يرميها أثناء رمي الجمار يوم النحر وأيام التشريق وله أن يضيف دعاءً بعدها على ما فصّل الجواب."
  en: "A questioner asked about saying takbir while throwing the jamarat pebbles. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21923) answered that it is recommended for the pilgrim to say takbir with each pebble he throws during the stoning on the day of sacrifice and the tashriq days, and he may add supplication after, as the answer details."
  ur: "ایک سائل نے جمرات پر کنکریاں مارتے وقت تکبیر کہنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21923)⁩ نے جواب دیا کہ حاجی کے لیے یومِ نحر اور ایامِ تشریک میں ہر کنکری کے ساتھ تکبیر کہنا مستحب ہے اور بعد میں دعا بھی کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó sobre la conveniencia de recitar el takbir al lanzar las piedras de la jamarat. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21923) respondió que se recomienda al peregrino recitar el takbir con cada piedra que lanza durante la lapidación en el día del sacrificio y los días de tashriq, y que puede añadir una súplica después, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant la récitation du takbir lors du jet de cailloux de la jamarat. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21923) a répondu qu'il est recommandé au pèlerin de prononcer le takbir à chaque caillou jeté lors de la lapidation le jour du sacrifice et les jours de tashriq, et qu'il peut ajouter une invocation après, comme le précise la réponse."
  tr: "Bir soru soran kişi, Jamarat'ın taşlarını taşlarken yapılan tekbir (tekbir) hakkında sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21923), hacının Cemarat taşlanması sırasında atılan her taşla tekbir söylemesinin önerildiğini ve ayrıntılı cevaba daha sonra bir dua ekleyebileceğini yanıtladı."
  id: "Seorang penanya bertanya tentang takbir (takbir) saat melempar batu ke batu-batu Jamarat. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21923) menjawab bahwa disarankan bagi peziarah untuk mengucapkan takbir setiap kali dilempar batu selama pelemparan batu Jamarat pada Hari Pengorbanan dan hari-hari Tashreeq, dan ia dapat menambahkan permohonan setelahnya pada jawaban rinci."
