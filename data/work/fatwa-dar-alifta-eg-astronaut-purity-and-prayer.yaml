summary:
  ar: "سائل سأل عن كيفية طهارة رائد الفضاء وصلاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21697)⁩ أن تطهر رائد الفضاء يختلف باختلاف حاله فإن قدر على استعمال الماء فائضًا عن حاجته قادرًا فحكمه حكم الأرضيين وإن لم يقدر فله حكم آخر بيّنه الجواب."
  en: "A questioner asked how an astronaut purifies himself and prays. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21697) answered that the astronaut's purification differs with his state: if he can use surplus water beyond his need his ruling is that of earth-dwellers; if he cannot, another ruling applies, as the answer sets out."
  ur: "ایک سائل نے خلانورد کی طہارت اور نماز کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21697)⁩ نے جواب دیا کہ طہارت اس کی حالت کے مطابق بدلتی ہے: اگر ضرورت سے زائد پانی استعمال کر سکے تو حکم زمینیوں جیسا ہے؛ نہیں تو دوسرا حکم — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó cómo se purifica y reza un astronauta. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21697) respondió que la purificación del astronauta varía según su condición: si puede usar agua sobrante, se le aplica la norma que rige para los habitantes de la Tierra; si no puede, se aplica otra norma, como se indica en la respuesta."
