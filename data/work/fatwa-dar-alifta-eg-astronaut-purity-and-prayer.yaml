label: { ar: "كيفية طهارة رائد الفضاء وصلاته", en: "How an astronaut purifies and prays", ur: "خلانورد کی طہارت اور نماز کیسے ہو", es: "Cómo se purifica y reza un astronauta", fr: "Comment un astronaute se purifie et prie", tr: "Bir astronot ve ilişkileri nasıl arındırılır", id: "Cara memurnikan astronot dan hubungannya" }
summary:
  ar: "سائل سأل عن كيفية طهارة رائد الفضاء وصلاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21697)⁩ أن تطهر رائد الفضاء يختلف باختلاف حاله فإن قدر على استعمال الماء فائضًا عن حاجته قادرًا فحكمه حكم الأرضيين وإن لم يقدر فله حكم آخر بيّنه الجواب."
  en: "A questioner asked how an astronaut purifies himself and prays. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21697) answered that the astronaut's purification differs with his state: if he can use surplus water beyond his need his ruling is that of earth-dwellers; if he cannot, another ruling applies, as the answer sets out."
  ur: "ایک سائل نے خلانورد کی طہارت اور نماز کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21697)⁩ نے جواب دیا کہ طہارت اس کی حالت کے مطابق بدلتی ہے: اگر ضرورت سے زائد پانی استعمال کر سکے تو حکم زمینیوں جیسا ہے؛ نہیں تو دوسرا حکم — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó cómo se purifica y reza un astronauta. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21697) respondió que la purificación del astronauta varía según su condición: si puede usar agua sobrante, se le aplica la norma que rige para los habitantes de la Tierra; si no puede, se aplica otra norma, como se indica en la respuesta."
  fr: "Un internaute a demandé comment un astronaute se purifie et prie. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21697) a répondu que la purification de l'astronaute dépend de sa situation: s'il peut utiliser l'eau en surplus, la règle est celle des Terriens; sinon, une autre règle s'applique, comme l'indique la réponse."
  tr: "Bir soru soran kişi, bir astronotun kendini ve dualarını nasıl arındırdığını sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21697), bir astronotun arınmasının durumuna göre değiştiğini yanıtladı. Eğer ihtiyacı ötesinde su kullanabiliyorsa ve kullanabiliyorsa, hükmetmesi yeryüzündeki insanlara benzer; yapamıyorsa, cevapta açıklandığı gibi başka bir hükme sahip olur."
  id: "Seorang penanya bertanya tentang bagaimana seorang astronot menyucikan dirinya sendiri dan doanya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21697) menjawab bahwa pemurnian astronot bervariasi tergantung pada kondisinya. Jika dia mampu menggunakan air melebihi kebutuhannya dan mampu, pemerintahannya seperti manusia di Bumi; jika tidak mampu, dia memiliki aturan lain seperti yang dijelaskan dalam jawaban."
