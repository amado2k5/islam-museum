summary:
  ar: "قصيدة لحسان بن ثابت من الوافر على روي الدال، مطلعها كما في شرح البرقوقي {{cite:sharh-diwan-hassan-barquqi-1929 p.140}}؛ وتذكر الطبعة بحرها في رأسها."
  en: "A poem by Hassan ibn Thabit in the wafir metre on the rhyme الدال, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.140}}."
  es: "Un poema de Hassan ibn Thabit en el metro wafir sobre la rima الدال, como en el comentario de al-Barquqi, que indica el metro en su encabezado {{cite:sharh-diwan-hassan-barquqi-1929 p.140}}."
  fr: "Un poème de Hassan ibn Thabit en mètre wafir sur la rime الدال, comme dans le commentaire d'al-Barquqi, qui indique le mètre dans son titre {{cite:sharh-diwan-hassan-barquqi-1929 p.140}}."
  ur: "نظم الدال پر وفیر میٹر میں حسان بن ثابت کی ایک نظم، جیسا کہ البرقی کی تفسیر میں ہے، جس کے عنوان {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 140}} میں میٹر بیان کیا گیا ہے۔"
