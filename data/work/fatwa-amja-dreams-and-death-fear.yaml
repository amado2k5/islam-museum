id: work/fatwa-amja-dreams-and-death-fear
class: work
kind: fatwa
label: { ar: "الأحلام والآجال", en: "Dreams and lifespans — answer to a frightened dreamer", ur: "خواب اور مدت عمر — خوفزدہ سوال کا جواب", es: "Sueños y esperanza de vida: respuesta a un soñador asustado." }
summary:
  ar: "سأل سائل مهموم رأى منامًا قرأ تفسيره في كتب ابن سيرين والنابلسي وشق عليه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77335 بتاريخ 3 يناير 2009)⁩ أن الكيس من دان نفسه دائمًا وعمل لما بعد الموت، والأصل أن يكون في الدنيا كأنه غريب أو عابر سبيل، وإذا أصبح فلا ينتظر المساء وإذا أمسى فلا ينتظر الصباح سواء رأى هذا الحلم أم لم يره، علمًا بأن الآجال بيد الله لا يقدمها حلم ولا يؤخرها، وبأن كثيرًا من أحلام هذا النوع يعبرها المعبرون على خلاف ظاهرها فقد تكون دلالة على طول العمر."
  en: "A distressed questioner dreamt a dream whose reading in Ibn Sirin and al-Nabulsi grieved him. Dr. Salah al-Sawi (fatwa no. 77335, 3 January 2009) answered that the wise calls himself to account and works for what comes after death; the rule is to be in the world as a stranger or a passing traveller — morning without awaiting evening, evening without awaiting morning — whether he saw this dream or not; lifespans are in God's hand, no dream hastens or delays them, and many such dreams the interpreters read against their face, sometimes meaning a long life."
  ur: "ایک پریشان سائل نے تکلیف دہ خواب کا جواب پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77335، 3 جنوری 2009)⁩ کے مطابق آخرت کے لیے عمل کریں، دنیا میں مسافر کی طرح رہیں؛ مدت اللہ کے ہاتھ ہے اور کوئی خواب اسے آگے پیچھے نہیں کر سکتی۔"
  es: "Un consultante angustiado tuvo un sueño cuya interpretación en Ibn Sirin y al-Nabulsi le causó gran pesar. El Dr. Salah al-Sawi (fatwa n.° 77335, 3 de enero de 2009) respondió que el sabio se responsabiliza de sus actos y trabaja por lo que vendrá después de la muerte; la regla es estar en el mundo como un extraño o un viajero de paso —la mañana sin esperar la tarde, la tarde sin esperar la mañana—, haya tenido o no este sueño; la duración de la vida está en manos de Dios, ningún sueño la acelera ni la retrasa, y muchos de estos sueños los intérpretes los interpretan de forma negativa, a veces significando una larga vida."
