id: work/fatwa-amja-iqama-after-nafl
class: work
kind: fatwa
label: { ar: "الإقامة للفريضة", en: "Praying nafl, then the iqama for the obligation — women's case", ur: "نفل کے بعد اقامت — خواتین پر اذان اقامت نہیں", es: "Orar nafl, luego el iqama para la obligación — el caso de las mujeres", fr: "Prier surérogatoirement (nafl), puis prendre l'iqama pour l'obligation — cas des femmes", tr: "Zorunlu namaz için ikametgah", id: "Tempat tinggal untuk doa wajib" }
summary:
  ar: "سأل سائل هل يصلي النافلة ثم يقيم الصلاة ويصلي الفريضة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 85809 بتاريخ 1 نوفمبر 2011)⁩ أن الإقامة إنما تكون لصلاة الفريضة فمتى فرغ من صلاة النافلة أقام الصلاة ثم صلى الفريضة هذا إذا كان السائل ذكرًا أما الأنثى فليس عليها أذان ولا إقامة على ما فصّل الجواب."
  en: "A questioner asked whether he prays the nafl then gives the iqama and prays the obligation. AMJA's fatwa committee (fatwa no. 85809, 1 November 2011) answered that the iqama belongs to the obligatory prayer: when he finishes the nafl he gives the iqama and prays the obligation — if the asker is male; a female has neither adhan nor iqama on her — as the answer details."
  ur: "نفل کے بعد اقامت؟ لجنة الفتوى ⁦(فتویٰ 85809، 1 نومبر 2011)⁩ کے مطابق اقامت فرض کے لیے؛ عورت پر اذان اقامت نہیں۔"
  es: "Un consultante preguntó si después de rezar la oración voluntaria (nafl) entrega la iqama y realiza la oración obligatoria. El comité de fatwas de AMJA (fatwa n.° 85809, 1 de noviembre de 2011) respondió que la iqama forma parte de la oración obligatoria: al terminar la oración voluntaria, entrega la iqama y realiza la oración obligatoria, si el consultante es varón; una mujer no lleva ni adhan ni iqama, como se detalla en la respuesta."
  fr: "Un internaute a demandé si, après avoir accompli la prière surérogatoire (nafl), il prenait l'iqama et accomplissait la prière obligatoire. Le comité des fatwas de l'AMJA (fatwa n° 85809, 1er novembre 2011) a répondu que l'iqama fait partie de la prière obligatoire: une fois la prière surérogatoire terminée, le fidèle prend l'iqama et accomplit la prière obligatoire – si l'internaute est un homme; une femme ne porte ni l'adhan ni l'iqama – comme le précise la réponse."
  tr: "Bir soru soran kişiye, gönüllü namazı kılıp ardından namazı belirleyip zorunlu namazı kılıp kılmaması gerektiği soruldu. Amerika İslam Hukukçuları Konseyi'ndeki Fetva Komitesi (1 Kasım 2011 tarihli Fetva No. 85809), ikametin sadece zorunlu namaz için olduğunu yanıtladı. Gönüllü namazı bitirdikten sonra namaz kılır ve ardından zorunlu namazı eder. Bu, soru soran kişi erkekse ancak kadın namaz veya ikama çağırmak zorunda değilse geçerlidir, cevapta açıklandığı gibi."
  id: "Seorang penanya ditanya apakah ia harus berdoa secara sukarela lalu menetapkan doa dan melaksanakan doa wajib. Komite Fatwa di Dewan Ahli Hukum Islam di Amerika (Fatwa No. 85809 tanggal 1 November 2011) menjawab bahwa iqamah hanya untuk salat wajib. Setelah selesai salat sukarela, ia melaksanakan salat dan kemudian berdoa salat wajib. Ini berlaku jika penanya laki-laki, tetapi perempuan tidak harus berdoa atau berisuka, seperti yang dijelaskan dalam jawaban."
