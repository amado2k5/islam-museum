id: work/fatwa-iifa-192-death-penalty
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 192 (20/7) بشأن عقوبة الإعدام في النظر الإسلامي", en: "IIFA resolution 192 (20/7) on the death penalty in the Islamic view", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 192 (20/7): اسلامی نظریے میں سزائے موت" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. بعد التأكيد بأن الإسلام من منطلق أصوله الأخلاقية الحامية لحقوق الإنسان قام بدور تاريخي فاعل ومؤثر في تقليل وتقليص حالات الإعدام وسيما في الظروف القاسية التي كانت تتسع دائرتها عند كثير من الأمم، عبر تأصيل قواعد كحرمة الدم ودرء الحدود بالشبهات والاحتياط في الدماء، قرر المجمع: عقوبة الإعدام تمثل أحد عناصر النظام العقابي اللازم لحماية المصالح العليا في المجتمعات الإنسانية وتتناسب مع الجرائم التي يقترفها الجاني حسب القواعد الشرعية، فالشبهات المطالبة بإلغائها مطلقاً ليس لها مبرر شرعاً ولا عقلاً؛ والإعدام سلب الجاني حق الحياة بحكم قضائي عادل؛ ولا يحكم به إلا إذا ثبت ارتكاب الجاني ما يوجبه وفق قواعد الإثبات المقررة شرعاً؛ ويجب أن يستند حكم الجريمة الموجبة له إلى نص تشريعي صريح مستمد من الشريعة الإسلامية؛ ويجب توافر الضمانات المانعة للإسراف في تطبيقها أو الخطأ في الحكم بها؛ ويجب اتخاذ التدابير الواقية من ارتكاب الجرائم الموجبة لها كي لا يكون للجاني عذر عند تطبيقها؛ ويترك اختيار وسيلة التنفيذ لتشريعات الدول الإسلامية في إطار القواعد العامة للشريعة ومقاصدها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). After affirming that Islam, proceeding from moral foundations protecting human rights, played an effective historical role in reducing and narrowing cases of execution — especially amid the harsh conditions in which it ranged widely among many nations — by establishing rules such as the inviolability of blood, averting prescribed punishments by doubts, and precaution in matters of blood, it ruled: the death penalty is an element of the penal order needed to protect the highest interests of human societies, proportionate to the crimes committed under sharia rules, so the claims calling for its absolute abolition have no justification in sharia or reason; execution is the removal of the offender's right to life by a just judicial ruling; it may only be judged where the offender's committing a capital crime is proven under the legally established rules of evidence; the ruling of a capital crime must rest on an explicit legislative text derived from Islamic law; guarantees preventing excess in applying it or error in judging it must be present; all preventive measures against capital crimes must be taken so the offender has no excuse when it is applied; and the choice of method of execution is left to the legislation of Islamic states within the general rules and objectives of the sharia."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس بات کی تاکید کے بعد کہ اسلام نے اپنے انسانی حقوق کے حامی اخلاقی اصولوں سے سزائے موت کے واقعات کو کم کرنے میں تاریخی اور مؤثر کردار ادا کیا — بالخصوص ان سخت حالات میں جن میں بہت سی قوموں میں یہ عام تھا — ایسے اصول قائم کر کے جیسے خون کی حرمت، شک کی صورت میں حدود کا ساقط ہونا اور خون کے معاملے میں احتیاط، اکیڈمی نے فیصلہ کیا: سزائے موت سزا کے نظام کا ایک عنصر ہے جو انسانی معاشروں کے اعلیٰ مفادات کے تحفظ کے لیے درکار ہے اور جرائم سے متناسب شرعی قواعد کے مطابق، اس لیے اس کی مکمل منسوخی کے مطالبوں کی شرعاً اور عقلاً کوئی جواز نہیں؛ سزائے موت مجرم کے حقِ حیات کو منصفانہ عدالتی حکم سے ختم کرنا ہے؛ اس کا حکم صرف اس وقت جائے جب مجرم کا وہ جرم کرنا ثابت ہو جو شرعی اصولِ ثبوت کے مطابق اسے واجب کرے؛ سزائے موت والی جرم کا حکم شریعتِ اسلامیہ سے ماخوذ صریح تشریعی نص پر مبنی ہونا چاہیے؛ اس کے اطلاق میں افراط یا حکم میں خطا سے روکنے والی ضمانتیں موجود ہونی چاہییں؛ سزائے موت والے جرائم سے بچنے کی تمام تدابیر اختیار ہوں تاکہ مجرم کے پاس اطلاق کے وقت کوئی عذر نہ رہے؛ اور سزا دینے کے طریقے کا انتخاب اسلامی ممالک کی تشریعات پر چھوڑا گیا شریعت کے عمومی قواعد اور مقاصد کے دائرے میں۔"
