id: work/fatwa-iifa-192-death-penalty
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 192 (20/7) بشأن عقوبة الإعدام في النظر الإسلامي", en: "IIFA resolution 192 (20/7) on the death penalty in the Islamic view", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 192 (20/7): اسلامی نظریے میں سزائے موت", es: "Resolución 192 (20/7) de la IIFA sobre la pena de muerte en la visión islámica.", fr: "Résolution 192 (20/7) de l'IIFA sur la peine de mort selon la perspective islamique", tr: "Uluslararası İslami Fiqh Akademisi Kararı 192 (20/7) İslami perspektifte idam cezasına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 192 (20/7) mengenai hukuman mati dalam perspektif Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. بعد التأكيد بأن الإسلام من منطلق أصوله الأخلاقية الحامية لحقوق الإنسان قام بدور تاريخي فاعل ومؤثر في تقليل وتقليص حالات الإعدام وسيما في الظروف القاسية التي كانت تتسع دائرتها عند كثير من الأمم، عبر تأصيل قواعد كحرمة الدم ودرء الحدود بالشبهات والاحتياط في الدماء، قرر المجمع: عقوبة الإعدام تمثل أحد عناصر النظام العقابي اللازم لحماية المصالح العليا في المجتمعات الإنسانية وتتناسب مع الجرائم التي يقترفها الجاني حسب القواعد الشرعية، فالشبهات المطالبة بإلغائها مطلقاً ليس لها مبرر شرعاً ولا عقلاً؛ والإعدام سلب الجاني حق الحياة بحكم قضائي عادل؛ ولا يحكم به إلا إذا ثبت ارتكاب الجاني ما يوجبه وفق قواعد الإثبات المقررة شرعاً؛ ويجب أن يستند حكم الجريمة الموجبة له إلى نص تشريعي صريح مستمد من الشريعة الإسلامية؛ ويجب توافر الضمانات المانعة للإسراف في تطبيقها أو الخطأ في الحكم بها؛ ويجب اتخاذ التدابير الواقية من ارتكاب الجرائم الموجبة لها كي لا يكون للجاني عذر عند تطبيقها؛ ويترك اختيار وسيلة التنفيذ لتشريعات الدول الإسلامية في إطار القواعد العامة للشريعة ومقاصدها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). After affirming that Islam, proceeding from moral foundations protecting human rights, played an effective historical role in reducing and narrowing cases of execution — especially amid the harsh conditions in which it ranged widely among many nations — by establishing rules such as the inviolability of blood, averting prescribed punishments by doubts, and precaution in matters of blood, it ruled: the death penalty is an element of the penal order needed to protect the highest interests of human societies, proportionate to the crimes committed under sharia rules, so the claims calling for its absolute abolition have no justification in sharia or reason; execution is the removal of the offender's right to life by a just judicial ruling; it may only be judged where the offender's committing a capital crime is proven under the legally established rules of evidence; the ruling of a capital crime must rest on an explicit legislative text derived from Islamic law; guarantees preventing excess in applying it or error in judging it must be present; all preventive measures against capital crimes must be taken so the offender has no excuse when it is applied; and the choice of method of execution is left to the legislation of Islamic states within the general rules and objectives of the sharia."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس بات کی تاکید کے بعد کہ اسلام نے اپنے انسانی حقوق کے حامی اخلاقی اصولوں سے سزائے موت کے واقعات کو کم کرنے میں تاریخی اور مؤثر کردار ادا کیا — بالخصوص ان سخت حالات میں جن میں بہت سی قوموں میں یہ عام تھا — ایسے اصول قائم کر کے جیسے خون کی حرمت، شک کی صورت میں حدود کا ساقط ہونا اور خون کے معاملے میں احتیاط، اکیڈمی نے فیصلہ کیا: سزائے موت سزا کے نظام کا ایک عنصر ہے جو انسانی معاشروں کے اعلیٰ مفادات کے تحفظ کے لیے درکار ہے اور جرائم سے متناسب شرعی قواعد کے مطابق، اس لیے اس کی مکمل منسوخی کے مطالبوں کی شرعاً اور عقلاً کوئی جواز نہیں؛ سزائے موت مجرم کے حقِ حیات کو منصفانہ عدالتی حکم سے ختم کرنا ہے؛ اس کا حکم صرف اس وقت جائے جب مجرم کا وہ جرم کرنا ثابت ہو جو شرعی اصولِ ثبوت کے مطابق اسے واجب کرے؛ سزائے موت والی جرم کا حکم شریعتِ اسلامیہ سے ماخوذ صریح تشریعی نص پر مبنی ہونا چاہیے؛ اس کے اطلاق میں افراط یا حکم میں خطا سے روکنے والی ضمانتیں موجود ہونی چاہییں؛ سزائے موت والے جرائم سے بچنے کی تمام تدابیر اختیار ہوں تاکہ مجرم کے پاس اطلاق کے وقت کوئی عذر نہ رہے؛ اور سزا دینے کے طریقے کا انتخاب اسلامی ممالک کی تشریعات پر چھوڑا گیا شریعت کے عمومی قواعد اور مقاصد کے دائرے میں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 20.ª sesión en Orán (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 de septiembre de 2012). Después de afirmar que el Islam, partiendo de fundamentos morales que protegen los derechos humanos, desempeñó un papel histórico efectivo en la reducción y limitación de los casos de ejecución —especialmente en medio de las duras condiciones en las que se extendió ampliamente entre muchas naciones— al establecer reglas tales como la inviolabilidad de la sangre, evitar castigos prescritos por dudas y precaución en asuntos de sangre, dictaminó: la pena de muerte es un elemento del orden penal necesario para proteger los intereses más altos de las sociedades humanas, proporcional a los crímenes cometidos bajo las reglas de la sharia, por lo que las demandas que piden su abolición absoluta no tienen justificación en la sharia ni en la razón; la ejecución es la eliminación del derecho a la vida del delincuente por una justa decisión judicial; solo puede juzgarse cuando se prueba que el delincuente cometió un crimen capital bajo las reglas de evidencia legalmente establecidas; La condena a muerte debe basarse en un texto legislativo explícito derivado de la ley islámica; deben existir garantías que impidan el exceso en su aplicación o el error en su interpretación; deben adoptarse todas las medidas preventivas contra los delitos capitales para que el delincuente no tenga excusa cuando se aplique la pena; y la elección del método de ejecución queda a la legislación de los estados islámicos dentro de las normas y objetivos generales de la sharia."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13-18 septembre 2012). Après avoir affirmé que l'islam, fondé sur des principes moraux protégeant les droits de l'homme, a joué un rôle historique déterminant dans la réduction et la limitation des cas d'exécution – notamment dans le contexte difficile de son application à travers de nombreuses nations – en établissant des règles telles que l'inviolabilité du sang, l'impossibilité d'appliquer les peines prescrites en cas de doute et la prudence en matière de sang, l'Académie a statué: la peine de mort est un élément de l'ordre pénal nécessaire à la protection des intérêts supérieurs des sociétés humaines, proportionnée aux crimes commis selon les règles de la charia; par conséquent, les revendications en faveur de son abolition absolue sont injustifiées tant en droit islamique que rationnel; l'exécution consiste à priver le condamné de son droit à la vie par une décision judiciaire juste; elle ne peut être prononcée que si la commission d'un crime capital par le condamné est prouvée selon les règles de preuve établies par la loi; la condamnation à mort doit reposer sur un texte législatif explicite issu du droit islamique. Des garanties empêchant tout abus dans son application ou toute erreur d'appréciation doivent être présentes; toutes les mesures préventives contre les crimes capitaux doivent être prises afin que le coupable n'ait aucune excuse lors de son application; et le choix du mode d'exécution est laissé à la législation des États islamiques dans le cadre des règles et objectifs généraux de la charia."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Şevval – 2 Zhu'd-Qi'dah 1433 H, 13–18 Eylül 2012) toplu kararı. İnsan haklarını koruyan etik ilkelerine dayanan İslam'ın, özellikle birçok ulus arasında yaygın olan zorlu koşullarda, kanın kutsallığı, sınır şüphelerinden kaçınma ve gelecekte kan akımından kaçınma gibi kurallar koyarak infazların azaltılması ve en aza indirilmesinde etkili ve etkili bir tarihsel rol oynadığını teyit eden Meclis, şu kararı verdi: İdam cezası, insan toplumlarındaki yüksek çıkarları korumak için gerekli cezai sistemin unsurlarından biridir ve şeriat kurallarına göre failin işlediği suçlarla orantılıdır. Kaldırılmasını talep eden şüphelerin hiçbir dayanağı yoktur Şeriat veya mantıkla gerekçelendirilmemiş olan idam cezası, suçlunun yaşam hakkını adil bir yargı kararıyla elinden alır; ancak suçlunun Şeriat tarafından belirlenen ispat kurallarına göre gerekeni işlediği kanıtlanırsa uygulanır; kendisine bağlayıcı olan suçun cezası, İslami Şeriat'tan türetilmiş açık yasal metne dayanmalıdır; aşırı uygulama veya yanlış yargı hatasını önlemek için garantiler sağlanmalıdır; suçluya uygulanırken mazeret bulunmaması için suçluyu hak eden suçların işlenmesini önlemek için koruyucu önlemler alınmalıdır; ve icra yöntemlerinin seçimi, Şeriat'ın genel kuralları ve hedefleri çerçevesinde İslam ülkelerinin mevzuatına bırakılmalıdır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sidang kedua puluh di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012). Setelah menegaskan bahwa Islam, berdasarkan prinsip etika yang melindungi hak asasi manusia, telah memainkan peran historis yang efektif dan berpengaruh dalam mengurangi dan meminimalkan eksekusi, terutama dalam keadaan keras yang tersebar luas di banyak negara, dengan menetapkan aturan seperti kesucian darah, menghindari kecurigaan terhadap batasan, dan menghindari darah di masa depan, Majelis memutuskan: Hukuman mati merupakan salah satu elemen dari sistem hukuman yang diperlukan untuk melindungi kepentingan yang lebih tinggi dalam masyarakat manusia dan proporsional dengan kejahatan yang dilakukan pelaku menurut aturan Syariah. Kecurigaan yang menuntut penghapusan hukuman mati tidak berdasar Hukuman mati tidak dibenarkan oleh Syariah maupun akal; hukuman mati mencabut hak pelanggar atas hak hidup melalui putusan yudisial yang adil; hukuman mati hanya dijatuhkan jika terbukti bahwa pelaku melakukan apa yang diwajibkan menurut aturan pembuktian yang ditetapkan oleh Syariah; hukuman kejahatan yang mengikatnya harus didasarkan pada teks legislatif eksplisit yang berasal dari Syariah Islam; jaminan harus ada untuk mencegah penerapan berlebihan atau kesalahan dalam penilaian; langkah-langkah perlindungan harus diambil untuk mencegah terjadinya kejahatan yang membenarkannya sehingga pelaku tidak memiliki alasan saat menerapkannya; dan pilihan cara penegakan diserahkan kepada legislasi negara-negara Islam dalam kerangka aturan dan tujuan umum Syariah."
