label: { ar: "فضل اتباع الجنائز عند نزول المطر", en: "The merit of following funerals in the rain", ur: "بارش میں جنازے کے پیچھے جانے کا فضل", es: "La ventaja de asistir a funerales bajo la lluvia" }
summary:
  ar: "سائل سأل عن ثواب اتباع الجنازة عند نزول المطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22297)⁩ أن الصلاة على الميت واتباع جنازته حق من حقوق المسلم على أخيه وفرض كفاية إذا فعلها البعض سقطت عن الباقين، وبيّن الجواب ما في المشي في المطر من أجر مضاعف."
  en: "A questioner asked about the reward of following a funeral during rainfall. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22297) answered that praying over the dead and following the bier is a right of the Muslim on his brother and a collective obligation — when some perform it the rest are absolved; the answer sets out the multiplied reward for walking in the rain."
  ur: "ایک سائل نے بارش میں جنازے کے پیچھے جانے کے ثواب کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22297)⁩ نے جواب دیا کہ میت پر نماز اور جنازے کے پیچھے جانا مسلمان کے بھائی پر اس کا حق اور فرضِ کفایہ ہے — بعض کریں تو باقی سے ساقط ہو جاتا ہے؛ جواب میں بارش میں چلنے کے مضاعف اجر کی تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la recompensa de acompañar un funeral durante la lluvia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22297) respondió que rezar por los difuntos y acompañar el féretro es un derecho del musulmán hacia su hermano y una obligación colectiva: cuando algunos lo hacen, los demás quedan exentos; la respuesta detalla la recompensa multiplicada por caminar bajo la lluvia."
