id: work/fatwa-aliftaa-jo-instalment-sales-and-their-conditions
class: work
kind: fatwa
label: { ar: "البيع بالتقسيط وشروطه", en: "Instalment sales and their conditions", ur: "قسطوں پر بیع اور اس کی شرائط" }
summary:
  ar: "سؤال عن حكم البيع بالتقسيط وشروطه، أجابت فيه دائرة الإفتاء العام الأردنية بأنه جائز ولو زاد سعر التقسيط على سعر النقد، بشروط منها تحديد أحد الثمنين عند العقد، وتحديد آجال الأقساط، وعدم فرض زيادة على التأخير، وعدم اشتراط الحط عند التعجيل. أجابت الدائرة بأنه لا حرج في شراء السلع وبيعها بالتقسيط ولو زاد سعر التقسيط على سعر النقد، وأن جمهور العلماء من المذاهب الأربعة اتفقوا على جواز هذه الصورة، واستدلوا بحديث عائشة عن بريرة التي كاتبت أهلها على تسع أواق في كل عام أوقية. ونقلت قول النووي في روضة الطالبين إن من قال بعتك بألف نقدًا وبألفين نسيئة صح العقد. وذكرت للجواز شروطًا: أن يُتفق عند العقد على أحد الثمنين، النقد أو التقسيط، وأن يكون أجل الأقساط محددًا منعًا للجهالة، وألا يترتب على تأخر المشتري أي مبلغ إضافي لأن كل زيادة على أصل الدين ربا، وألا يُشترط في العقد الحط من الثمن عند تعجيل السداد. ونبهت إلى أن الجواب في الضوابط العامة لبيع التقسيط وليس فتوى لعقد بعينه."
  en: "A question about instalment sales and their conditions, in which Jordan's General Iftaa Department answered that they are permitted even if the instalment price exceeds the cash price, subject to conditions including fixing one of the two prices at the contract, fixing the instalment terms, charging nothing extra for late payment, and not stipulating a discount for early payment. The Department answered that there is no objection to buying and selling goods in instalments even if the instalment price is higher than the cash price, and that the majority of scholars of the four schools agree this form is permitted, citing Aisha's report of Barira, who contracted with her owners for nine ounces, one ounce each year. It quoted al-Nawawi in Rawdat al-Talibin that if someone says, I sell you this for a thousand in cash or two thousand deferred, the contract is valid. It listed conditions: one of the two prices, cash or instalment, must be agreed at the contract; the instalment dates must be fixed to avoid uncertainty; no extra sum may follow from the buyer's late payment, since any increase on the original debt is usury; and the contract may not stipulate a reduction in price for early payment. It noted that the answer sets out the general rules for instalment sales and is not a fatwa on any particular contract."
  ur: "قسطوں پر بیع کے حکم اور شرائط کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ جائز ہے چاہے قسطوں کی قیمت نقد قیمت سے زیادہ ہو، کچھ شرائط کے ساتھ، جن میں معاہدے کے وقت دونوں میں سے ایک قیمت طے کرنا، قسطوں کی مدت متعین کرنا، تاخیر پر کوئی اضافہ نہ لینا، اور جلد ادائیگی پر کمی کی شرط نہ لگانا شامل ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ قسطوں پر سامان خریدنے اور بیچنے میں حرج نہیں چاہے قسطوں کی قیمت نقد قیمت سے زیادہ ہو، اور چاروں مذاہب کے جمہور علما اس صورت کے جواز پر متفق ہیں؛ انہوں نے بریرہ کے بارے میں عائشہ کی روایت سے استدلال کیا جنہوں نے اپنے مالکوں سے نو اوقیہ پر، ہر سال ایک اوقیہ، مکاتبت کی۔ اس نے روضۃ الطالبین میں نووی کا قول نقل کیا کہ اگر کوئی کہے کہ میں تمہیں یہ نقد ایک ہزار یا ادھار دو ہزار میں بیچتا ہوں تو معاہدہ درست ہے۔ اس نے شرائط بیان کیں: معاہدے کے وقت دونوں قیمتوں، نقد یا قسط، میں سے ایک پر اتفاق ہو؛ جہالت سے بچنے کے لیے قسطوں کی مدت متعین ہو؛ خریدار کی تاخیر پر کوئی اضافی رقم نہ ہو کیونکہ اصل قرض پر ہر اضافہ سود ہے؛ اور معاہدے میں جلد ادائیگی پر قیمت میں کمی کی شرط نہ ہو۔ اس نے تنبیہ کی کہ یہ جواب قسطوں پر بیع کے عمومی ضوابط کے بارے میں ہے، کسی خاص معاہدے کے لیے فتویٰ نہیں۔"
