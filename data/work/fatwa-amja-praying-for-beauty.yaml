id: work/fatwa-amja-praying-for-beauty
class: work
kind: fatwa
label: { ar: "الدعاء بتحسين الخلقة", en: "Praying for beauty of form", ur: "خوبصورتی کی دعا", es: "Orando por la belleza de la forma", fr: "Je prie pour la beauté de la forme", tr: "Yaratılışın iyileştirilmesi için dua etmek", id: "Berdoa untuk perbaikan ciptaan" }
summary:
  ar: "سأل سائل هل يجوز أن يدعو المسلم ربه أن يرزقه الجمال وتحسين الخلقة إن كان أنفه كبيرًا أو رأسه معوجًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23368 بتاريخ 23 يوليو 2008)⁩ أن للعبد أن يدعو ربه بما شاء مما ليس فيه إثم ولا قطيعة رحم ومما لا يعد من جنس المستحيلات العقلية، وما ذكره من طلب تحسين الخلقة لا إثم فيه ولا قطيعة رحم وليس من جنس المستحيلات وإذا أراد ربه شيئًا أمضاه، وذكره بأن الجمال ليس في الحسيات وحدها فإن ما يترقق على الوجه من نضرة الإيمان ونور التقى جمال يدركه أصحاب النفوس الشفافة وهو يعوض أصحابه ما قد يكون من نقص في الجوانب الأخرى، وسأل الله أن يرزقه حسن الخلق والخُلق والرضا بما آتاه."
  en: "A questioner asked whether a Muslim may pray for beauty — improvement of his form — if his nose is large or his head crooked. Dr. Salah al-Sawi (fatwa no. 23368, 23 July 2008) answered that a servant may ask his Lord whatever carries no sin and no kinship-cutting and is not among the rationally impossible; seeking improvement of form is none of those, and when his Lord wills a thing He carries it out — but he reminded him that beauty is not in the physical alone: what settles on a face of faith's bloom and piety's light is a beauty the limpid-souled perceive, compensating its owners for whatever lacks elsewhere; he asked God to grant him beauty of form and of character and contentment with what he was given."
  ur: "ایک سائل نے پوچھا کہ کیا خوبصورتی کی دعا مانگنا جائز ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23368، 23 جولائی 2008)⁩ کے مطابق ہاں جائز ہے، مگر اصل حسن ایمان اور تقویٰ کی نضرت میں ہے جو باقی کمیوں کی تلافی کرتی ہے۔"
  es: "Un interlocutor preguntó si un musulmán puede rezar por la belleza —la mejora de su aspecto— si tiene la nariz grande o la cabeza torcida. El Dr. Salah al-Sawi (fatwa n.º 23368, 23 de julio de 2008) respondió que un siervo puede pedirle a su Señor lo que no implique pecado ni ruptura de parentesco y que no sea racionalmente imposible; buscar la mejora del aspecto no es ninguna de esas cosas, y cuando su Señor quiere algo, lo lleva a cabo. Sin embargo, le recordó que la belleza no reside solo en lo físico: lo que se posa en un rostro radiante de fe y con la luz de la piedad es una belleza que perciben los almas límpidas, compensando a sus dueños por lo que les falta en otros aspectos. Le pidió a Dios que le concediera belleza de aspecto y de carácter, y contentamiento con lo que le había sido dado."
  fr: "Un homme a demandé si un musulman pouvait prier pour la beauté – l’amélioration de son apparence – s’il avait un nez proéminent ou la tête penchée. Le Dr Salah al-Sawi (fatwa n° 23368, 23 juillet 2008) a répondu qu’un serviteur peut demander à son Seigneur tout ce qui n’entraîne ni péché ni rupture des liens de parenté, et qui n’est pas rationnellement impossible; demander l’amélioration de son apparence n’entre pas dans ces catégories, et lorsque Son Seigneur veut une chose, Il l’accomplit. Il a toutefois rappelé que la beauté ne réside pas uniquement dans le physique: ce qui illumine le visage d’une foi fervente et d’une piété sincère est une beauté que les âmes pures perçoivent, compensant ainsi les défauts de celui qui la porte. L’homme a demandé à Dieu de lui accorder la beauté du visage et du caractère, ainsi que la plénitude de ce qu’il avait reçu."
  tr: "Bir soru soran, burnu büyük veya başı eğri bir Müslümanın Rabbine güzellik ve iyi karakter bahşetmesi için dua etmesinin mücaiz olup olmadığını sordu. Dr. Salah Al-Sawy (23 Temmuz 2008 tarihli 23368 No. fetva) bir hizmetkârın günah, aile bağlarını koparmak ya da mantıksal olarak imkansız sayılmayan herhangi bir şey olsun dilediği gibi Rabbine dilemesi gerektiğini yanıtladı. Karakterini geliştirmeye çalışmak ne günah ne aile bağlarını koparmak, ne de imkansızdır. Allah bir şey isterse, onu verebilir. Güzelliğin sadece duyularda olmadığını, iman ışığı ve takvanın ışığında yumuşayanın, ruhu şeffaf olanların da algılayabileceği ve diğer eksiklikleri telafi eden bir güzellik olduğunu hatırlattı. Allah'tan kendisine iyi karakter, karakter ve verilenle tatmin olmasını istedi."
  id: "Seorang penanya bertanya apakah diperbolehkan bagi seorang Muslim untuk berdoa kepada Tuhannya agar diberikan kecantikan dan watak baik jika hidungnya besar atau kepalanya miring. Dr. Salah Al-Sawy menjawab (Fatwa No. 23368 tanggal 23 Juli 2008) bahwa seorang hamba boleh memohon kepada Tuhannya sesuka hati, baik itu dosa, memutuskan ikatan keluarga, atau apa pun yang dianggap tidak mungkin secara rasional. Apa yang dia sebutkan tentang upaya memperbaiki karakter seseorang bukanlah dosa atau memutuskan ikatan keluarga, juga bukan hal yang mustahil. Jika Allah menghendaki sesuatu, Dia boleh memberikannya. Dia mengingatkan bahwa keindahan bukan hanya dalam indera, tetapi yang melunak di wajah cahaya iman dan cahaya kesalehan adalah keindahan yang dapat dilihat oleh mereka yang berjiwa transparan sebagai menutupi kekurangan dalam aspek lain. Dia memohon kepada Allah agar memberinya watak yang baik, karakter, dan kepuasan atas apa yang telah diberikan."
