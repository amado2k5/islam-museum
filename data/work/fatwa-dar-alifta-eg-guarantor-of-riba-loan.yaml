id: work/fatwa-dar-alifta-eg-guarantor-of-riba-loan
class: work
kind: fatwa
label: { ar: "مدى دخول الضامن للمقترض في اللعن الوارد في حديث الربا", en: "Does the loan guarantor fall under the riba hadith's curse?", ur: "سودی قرض کے ضامن پر حدیثِ ربا کی لعنت" }
summary:
  ar: "سائل سأل عن ضمانه لزميله ليحصل على قرض مع علمه باشتراط الزيادة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21984)⁩ أن الضمان مع العلم بالزيادة محرم شرعًا فهو من التعاون على الإثم، وبيّن الجواب مدى دخول الضامن في الوعيد الوارد في الربا."
  en: "A questioner asked about standing guarantor for a colleague's loan while knowing an increase is stipulated. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21984) answered that guaranteeing with knowledge of the increase is forbidden — it is cooperation in sin; the answer sets out how far the guarantor falls under the riba hadith's warning."
  ur: "ایک سائل نے اپنے ساتھی کے قرض کی ضمانت دینے کے بارے میں پوچھا جب کہ اسے معلوم تھا کہ اضافے کی شرط ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21984)⁩ نے جواب دیا کہ اضافے کے علم کے ساتھ ضمانت دینا حرام ہے کیونکہ یہ گناہ میں تعاون ہے؛ جواب میں ضامن کے ربا کی وعید میں داخلے کی تفصیل بیان ہوئی۔"
