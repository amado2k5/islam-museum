id: work/fatwa-dar-alifta-eg-guarantor-of-riba-loan
class: work
kind: fatwa
label: { ar: "مدى دخول الضامن للمقترض في اللعن الوارد في حديث الربا", en: "Does the loan guarantor fall under the riba hadith's curse?", ur: "سودی قرض کے ضامن پر حدیثِ ربا کی لعنت", es: "¿El garante del préstamo cae bajo la maldición del hadiz sobre la usura?", fr: "Le garant du prêt est-il concerné par la malédiction du hadith sur le riba ?" }
summary:
  ar: "سائل سأل عن ضمانه لزميله ليحصل على قرض مع علمه باشتراط الزيادة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21984)⁩ أن الضمان مع العلم بالزيادة محرم شرعًا فهو من التعاون على الإثم، وبيّن الجواب مدى دخول الضامن في الوعيد الوارد في الربا."
  en: "A questioner asked about standing guarantor for a colleague's loan while knowing an increase is stipulated. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21984) answered that guaranteeing with knowledge of the increase is forbidden — it is cooperation in sin; the answer sets out how far the guarantor falls under the riba hadith's warning."
  ur: "ایک سائل نے اپنے ساتھی کے قرض کی ضمانت دینے کے بارے میں پوچھا جب کہ اسے معلوم تھا کہ اضافے کی شرط ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21984)⁩ نے جواب دیا کہ اضافے کے علم کے ساتھ ضمانت دینا حرام ہے کیونکہ یہ گناہ میں تعاون ہے؛ جواب میں ضامن کے ربا کی وعید میں داخلے کی تفصیل بیان ہوئی۔"
  es: "Un consultante preguntó sobre la conveniencia de avalar un préstamo de un colega sabiendo que se estipula un aumento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21984) respondió que avalar con conocimiento del aumento está prohibido, pues constituye complicidad en el pecado. La respuesta detalla hasta qué punto el avalista queda sujeto a la advertencia del hadiz sobre la usura."
  fr: "Un internaute a posé une question concernant le fait de se porter garant d'un prêt contracté par un collègue tout en sachant qu'une augmentation est prévue. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21984) a répondu que se porter garant en ayant connaissance de cette augmentation est interdit – cela revient à participer à un péché; la réponse précise dans quelle mesure le garant est concerné par l'avertissement du hadith relatif à l'usure (riba)."
