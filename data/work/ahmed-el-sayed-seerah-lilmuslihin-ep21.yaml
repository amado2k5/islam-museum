id: work/ahmed-el-sayed-seerah-lilmuslihin-ep21
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 21: آثار أُحُد"
  en: "The Prophetic Biography for Reformers, episode 21: The Effects of Uhud"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 21: احد کے اثرات"
  fr: "La biographie prophétique pour les réformateurs, épisode 21 : Les effets d'Uhud"
  es: "La biografía profética para los reformadores, episodio 21: Los efectos de Uhud"
summary:
  ar: "يستأنف أحمد السيد السلسلة بعد مجالس رمضان، ويستخرج دروس غزوة أحد معتمدا في الأغلب على الفصل الذي عقده ابن القيم لحكمها في زاد المعاد. ثم يتتبع ما أعقبها: الثبات في حمراء الأسد وتضحيات الصحابة الذين حموا النبي."
  en: "Ahmed Elsayed resumes the series after the Ramadan sessions and draws out the lessons of the Battle of Uhud, relying mostly on the chapter Ibn al-Qayyim devotes to its wisdoms in Zad al-Ma'ad. He then follows the aftermath, the steadfastness at Hamra al-Asad, and the sacrifices of the Companions who protected the Prophet."
  ur: "احمد السید رمضان کی مجالس کے بعد سلسلہ دوبارہ شروع کرتے ہیں اور غزوہ احد کے اسباق نکالتے ہیں، جس میں زیادہ تر ابن القیم کے زاد المعاد کے اس باب پر اعتماد کرتے ہیں جو انہوں نے احد کی حکمتوں کے لیے رکھا ہے۔ پھر وہ اس کے بعد کے واقعات بیان کرتے ہیں: حمراء الاسد میں ثابت قدمی اور ان صحابہ کی قربانیاں جنہوں نے نبی کی حفاظت کی۔"
  fr: "Ahmed Elsayed reprend la série après les séances du ramadan et tire les leçons de la bataille d'Uhud, en s'appuyant surtout sur le chapitre que Ibn al-Qayyim consacre à ses sagesses dans Zad al-Ma'ad. Il suit ensuite les suites de la bataille, la fermeté à Hamra al-Asad et les sacrifices des Compagnons qui ont protégé le Prophète."
  es: "Ahmed Elsayed retoma la serie tras las sesiones de Ramadán y extrae las lecciones de la batalla de Uhud, apoyándose sobre todo en el capítulo que Ibn al-Qayyim dedica a sus sabidurías en Zad al-Ma'ad. Después sigue las consecuencias, la firmeza en Hamra al-Asad y los sacrificios de los Compañeros que protegieron al Profeta."
