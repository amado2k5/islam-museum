id: work/fatwa-dar-alifta-eg-disposing-of-deposit-for-benefit
class: work
kind: fatwa
label: { ar: "حكم التصرف في الأمانة للمصلحة", en: "Disposing of a deposit for a good purpose", ur: "امانت میں اچھی نیت سے تصرف کا حکم", es: "Disposición de un depósito para un buen propósito", fr: "Utiliser un dépôt à bon escient", tr: "Güvenin fayda için elden çıkarılmasına ilişkin karar", id: "Putusan tentang pelepasan trust untuk manfaat" }
summary:
  ar: "سائل سأل عن التصرف في الوديعة بغير إذن مالكها ولو كان قصده تحقيق المصلحة له. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22133)⁩ أنه يحرم على المكلف التصرف في الوديعة بغير إذن مالكها حتى ولو قصد به مصلحة صاحبها، فإذا جاوز بها حدود التصريح ضمن، على ما فصّل الجواب."
  en: "A questioner asked about disposing of a deposited item without its owner's permission even intending to benefit him. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22133) answered that it is forbidden to dispose of a deposit without the owner's leave even for his benefit, and whoever exceeds the mandate's bounds is liable, as the answer details."
  ur: "ایک سائل نے امانت میں رکھے مال میں مالک کی اجازت کے بغیر — اچھی نیت سے بھی — تصرف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22133)⁩ نے جواب دیا کہ مالک کی اجازت بغیر امانت میں تصرف حرام ہے خواہ مقصود مالک کا مفاد ہو؛ جو حدود سے تجاوز کرے وہ ضامن ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de deshacerse de un objeto depositado sin el permiso de su propietario, incluso con la intención de beneficiarlo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22133) respondió que está prohibido deshacerse de un depósito sin el permiso del propietario, incluso para su beneficio, y que quien exceda los límites del mandato será responsable, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la disposition d'un objet déposé sans l'autorisation de son propriétaire, même dans l'intention de lui en faire bénéficier. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22133) a répondu qu'il est interdit de disposer d'un objet déposé sans l'accord du propriétaire, même à son profit, et que quiconque enfreint cette règle est passible de sanctions, comme le précise la réponse."
  tr: "Bir soru soran, mevduatın sahibinin izni olmadan tasarruf edilmesi hakkında soru sordu; hatta niyet kendi çıkarına ulaşmak olsa bile. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22133), mecbur kişinin depozitoyu sahibinin izni olmadan elden çıkarmasının yasak olduğunu, hatta bunun sahibine fayda sağlamak amacıyla olsa bile, yanıtında açıklandığı gibi sorumludur."
  id: "Seorang penanya menanyakan tentang penjualan deposit tanpa izin pemilik, meskipun tujuannya untuk keuntungan pribadi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22133) menjawab bahwa dilarang bagi orang yang berkewajiban untuk menjual deposit tanpa izin pemilik, meskipun dimaksudkan untuk menguntungkan pemilik. Jika ia melebihi batas deklarasi, ia bertanggung jawab, seperti yang dijelaskan dalam jawaban."
