id: work/fatwa-dar-alifta-eg-menstruating-woman-farewell-tawaf
class: work
kind: fatwa
label: { ar: "حكم ترك طواف الوداع للحائض", en: "The menstruating woman omitting the farewell tawaf", ur: "حائضہ عورت کا طوافِ وداع چھوڑنا", es: "La mujer menstruante que omite el tawaf de despedida", fr: "La femme menstruée omettant le tawaf d'adieu" }
summary:
  ar: "سائل سأل عن امرأة جاءتها العادة الشهرية بعد الوقوف بعرفة وطواف الزيارة ولم تتمكن من طواف الوداع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20832)⁩ ببيان حكم تركها طواف الوداع على وجهه."
  en: "A questioner asked about a woman whose period came after the standing at Arafat and the tawaf of the visit, leaving her unable to perform the farewell tawaf. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20832) answered by setting out the ruling on her omitting it."
  ur: "ایک سائل نے اس عورت کا حکم پوچھا جسے عرفہ کے وقوف اور طوافِ زیارت کے بعد حیض آ گیا اور وہ طوافِ وداع نہ کر سکی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20832)⁩ نے جواب میں چھوڑنے کا حکم بیان کیا۔"
  es: "Una persona preguntó sobre una mujer a la que le llegó la menstruación después de estar de pie en Arafat y realizar el tawaf de la visita, lo que le impidió realizar el tawaf de despedida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20832) respondió exponiendo la norma sobre la omisión de la menstruación."
  fr: "Une personne a posé une question concernant une femme dont les règles sont survenues après la visite au temple d'Arafat et le tawaf, l'empêchant ainsi d'accomplir le tawaf d'adieu. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20832) a répondu en énonçant la règle concernant son omission de ce tawaf."
