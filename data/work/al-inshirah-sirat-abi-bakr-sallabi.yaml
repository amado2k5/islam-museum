label: { ar: "الانشراح ورفع الضيق في سيرة أبي بكر الصديق", en: "al-Inshirah wa-Raf' al-Diq fi Sirat Abi Bakr al-Siddiq", ur: "الانشراح ورفع الضیق فی سیرۃ ابی بکر الصدیق" }
summary:
  ar: "دراسة معاصرة لعلي محمد الصلابي في شخصية أبي بكر الصديق وعصره، وهي الجزء الأول من سلسلته «تاريخ الخلفاء الراشدين»؛ فرغ منها في 5 محرم 1422هـ/30 مارس 2001م، وقسمها إلى مقدمة وأربعة فصول وخلاصة: أبو بكر في مكة، ثم وفاة النبي والسقيفة، ثم جيش أسامة وحروب الردة، ثم فتوح العراق والشام واستخلاف عمر ووفاته."
  en: "A contemporary study by Ali Muhammad al-Sallabi of the person and times of Abu Bakr al-Siddiq, the first volume of his series History of the Rightly Guided Caliphs; finished on 5 Muharram 1422 / 30 March 2001 and divided into an introduction, four chapters and a summary: Abu Bakr in Mecca; the Prophet's death and the Saqifa; Usama's army and the Ridda wars; the conquests in Iraq and Syria, the nomination of Umar and Abu Bakr's death."
