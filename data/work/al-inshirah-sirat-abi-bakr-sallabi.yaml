structure: "المقدمة (ص9–18 من نسخة PDF)؛ الفصل الأول: أبو بكر في مكة، خمسة مباحث (ص21–)؛ الفصل الثاني: وفاة الرسول وسقيفة بني ساعدة والبيعة العامة (ص115–)؛ الفصل الثالث: جيش أسامة وجهاد الصديق لأهل الردة ومسيلمة وبنو حنيفة والدروس (ص179–)؛ الفصل الرابع: فتوحات العراق والشام والدروس واستخلاف عمر ووفاة أبي بكر (ص307–)؛ الخلاصة والمصادر والفهرس (ص433–448)."
