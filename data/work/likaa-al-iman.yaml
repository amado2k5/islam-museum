kind: lecture-series
label:
  ar: "لقاء الإيمان (برنامج تلفزيوني)"
  en: "Liqa' al-Iman, Meeting of Faith (television programme)"
  ur: "لقاء الایمان: ایمان کی ملاقات (ٹیلی وژن پروگرام)"
summary:
  ar: "برنامج تلفزيوني حواري يحفظ أرشيف أسابيل منه تسعاً وعشرين حلقة قصيرة، يسأل فيها المقدّم محمد متولي الشعراوي ويجيب بالعامية المصرية: العتاب في سورة عبس، والهجرة لطلب العيش، والزكاة، والإفك، وأهل البيت، والزواج العرفي، والجن، وعلوم الكون، والبنوك والربا، وقصة شعيب، والروح، والحسد، والقبر في المسجد، وسيرته ووزارته، والتقليد، والطلاق، وأيوب، والعدة، والبسملة، والميراث، والدعاء، ونزول القرآن، وتشريع الصيام، وليلة القدر."
  en: "A television interview programme of which the Assabile archive keeps twenty-nine short episodes, in which the presenter questions Muhammad Mutawalli al-Sha'rawi and he answers in Egyptian colloquial: the reproach in Surat 'Abasa, emigrating for a living, zakat, the slander against 'A'isha, the people of the house, unregistered marriage, jinn, the sciences of the universe, banks and usury, the story of Shu'ayb, the spirit, envy, a grave in a mosque, his own life and ministry, following a school, divorce, Ayyub, the waiting period, the basmala, inheritance, supplication, the revelation of the Qur'an, the legislation of fasting and the Night of Power."
  ur: "ایک ٹیلی وژن انٹرویو پروگرام جس کی انتیس مختصر اقساط اسابیل آرکائیو میں محفوظ ہیں، جن میں میزبان محمد متولی الشعراوی سے سوال کرتے ہیں اور وہ مصری عامیانہ عربی میں جواب دیتے ہیں: سورۂ عبس میں عتاب، روزی کے لیے ہجرت، زکوٰۃ، عائشہ پر تہمت، اہلِ بیت، عرفی نکاح، جن، کائنات کے علوم، بینک اور سود، شعیب کا قصہ، روح، حسد، مسجد میں قبر، ان کی اپنی زندگی اور وزارت، مسلک کی پیروی، طلاق، ایوب، عدت، بسملہ، وراثت، دعا، نزولِ قرآن، روزے کی قانون سازی اور شبِ قدر۔"
