label: { ar: "ما حكم نتف المرأة لحواجبها؟", en: "What is the Islamic ruling on women plucking their eyebrows?", ur: "خواتین کی ابروں کٹوانے کا شرعی حکم کیا ہے؟", es: "¿Cuál es la norma islámica sobre que las mujeres se depilen las cejas?", fr: "Quel est l'avis de l'islam concernant l'épilation des sourcils par les femmes ?", tr: "Bir kadının kaşlarını yolması hakkında karar nedir?", id: "Apa aturan tentang wanita yang mencabut alisnya?" }
summary:
  ar: "سؤال عن حكم نتف المرأة لحواجبها. أجاب الدكتور ياسر قاضي في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر 18 سبتمبر 2024)⁩ ببيان الدليل الأساسي في المنع وهو حديث ابن مسعود ومواقف أهل العلم فيه على ما فصّل الجواب."
  en: "A question about the ruling on women plucking their eyebrows. Dr. Yasir Qadhi answered on the Fiqh Council of North America site (published 18 September 2024), setting out the primary evidence cited for prohibition — the narration of Ibn Mas'ud — and the scholars' positions, as the answer details."
  ur: "خواتین کی ابروں کٹوانے کے حکم کا سوال۔ ڈاکٹر یاسر قاضی نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ 18 ستمبر 2024)⁩ جواب دیا جس میں منع کی بنیادی دلیل — ابن مسعود کی روایت — اور علماء کے مواقف بیان ہوئے۔"
  es: "Una pregunta sobre la norma relativa a la depilación de cejas por parte de las mujeres. El Dr. Yasir Qadhi respondió en el sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 18 de septiembre de 2024), exponiendo la principal evidencia citada para la prohibición —la narración de Ibn Mas'ud— y las posturas de los eruditos, como se detalla en la respuesta."
  fr: "Une question relative à la décision concernant l'épilation des sourcils par les femmes. Le Dr Yasir Qadhi y a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication du 18 septembre 2024), en exposant la principale preuve invoquée à l'appui de l'interdiction — le hadith d'Ibn Mas'ud — ainsi que les positions des savants, comme le détaille sa réponse."
  tr: "Kaşlarını yolan bir kadınla ilgili karar hakkında bir soru. Dr. Yaser Kazi, Kuzey Amerika Fiqh Konseyi web sitesinde (18 Eylül 2024'te yayımlandı) yasaklamanın ana kanıtı olan İbn Mes'ud'un hadisi ve alimlerin bu konudaki görüşlerini açıklayarak yanıt verdi."
  id: "Sebuah pertanyaan tentang putusan seorang wanita yang mencabut alisnya. Dr. Yasser Qazi menjawab di situs web Dewan Fiqh Amerika Utara (diterbitkan 18 September 2024) dengan menjelaskan bukti utama untuk pelarangan alkohol, yaitu hadis Ibn Mas'ud dan posisi para ulama terhadapnya, seperti yang dijelaskan dalam jawabannya."
