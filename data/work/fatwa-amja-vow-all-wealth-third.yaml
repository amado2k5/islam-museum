id: work/fatwa-amja-vow-all-wealth-third
class: work
kind: fatwa
label: { ar: "نذر التصدق بكل المال", en: "Vowing to give away all one's wealth", ur: "سارا مال صدقہ کرنے کی نذر", es: "Prometer donar toda la riqueza", fr: "Faire vœu de donner toute sa richesse" }
summary:
  ar: "سأل سائل عن رجل نذر إن استرد مالًا من شركائه أن يتبرع بالمال كله وكان المبلغ ثلاثة ملايين جنيه مصري وقد كان في تعب نفسي يوم نذر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85343 بتاريخ 26 أغسطس 2011)⁩ أن نذر المجازاة مكروه لحديث النهي عن النذر وأنه يستخرج به من البخيل، وأن من نذر نذر طاعة لزمه الوفاء لحديث «من نذر أن يطيع الله فليطعه»، إلا أن من نذر التصدق بكل ماله يجزئه التصدق بثلثه في أظهر قولي العلماء وهو مذهب أحمد على ما فصّل."
  en: "A questioner asked about a man who vowed, in a distressed state, to give all his recovered money — three million Egyptian pounds — to God. Dr. Salah al-Sawi (fatwa no. 85343, 26 August 2011) answered that conditional vows are disliked per the hadith that a vow repels nothing and only draws out the miser; yet whoever vows obedience must fulfil it per 'whoever vows to obey God, let him obey'; but whoever vows to give all his wealth in charity, giving a third suffices in the scholars' sounder view — Ahmad's madhhab — as detailed."
  ur: "ایک شخص نے پوچھا کہ جس نے اپنے سارے مال ⁦(تین ملین مصری پاؤنڈ)⁩ کی صدقے کی نذر مان لی اس کا کیا ہو۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85343، 26 اگست 2011)⁩ کے مطابق طاعت کی نذر پوری کرنی ہوتی ہے لیکن سارا مال کی نذر میں ایک تہائی کافی ہے احمد کے مسلک کے مطابق۔"
  es: "Un consultante preguntó acerca de un hombre que, en un estado de angustia, juró entregar todo el dinero recuperado —tres millones de libras egipcias— a Dios. El Dr. Salah al-Sawi (fatwa n.° 85343, 26 de agosto de 2011) respondió que los votos condicionales son desaconsejables según el hadiz que dice que un voto no repele nada y solo atrae al avaro; sin embargo, quien jura obediencia debe cumplirla según «quien jura obedecer a Dios, que obedezca»; pero quien jura dar toda su riqueza en caridad, dar un tercio es suficiente según la opinión más sólida de los eruditos —la escuela de Ahmad— como se detalla."
  fr: "Un internaute a posé une question concernant un homme qui, accablé de détresse, avait juré de donner à Dieu la totalité de son argent retrouvé – trois millions de livres égyptiennes. Le Dr Salah al-Sawi (fatwa n° 85343, 26 août 2011) a répondu que les vœux conditionnels sont déconseillés, conformément au hadith selon lequel un vœu n'éloigne rien et ne fait qu'attirer l'avarice; toutefois, quiconque fait vœu d'obéissance doit le tenir, car « quiconque fait vœu d'obéir à Dieu, qu'il obéisse »; mais celui qui fait vœu de donner toute sa richesse en aumône, donner un tiers suffit selon l'avis plus judicieux des savants – l'école de pensée d'Ahmad – comme détaillé."
