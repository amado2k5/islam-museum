summary:
  ar: "تفسير الزمخشري الذي لم يصنف قبله مثله؛ قال ابن العماد أول ما صنفه استفتح الخطبة بقوله الحمد لله الذي خلق القرآن فيقال إنه قيل له متى تركته على هذه الهيئة هجره الناس ولا يرغب أحد فيه فغيره بقوله الذي جعل القرآن وجعل عندهم بمعنى خلق، ورأيت في كثير من النسخ الحمد لله الذي أنزل القرآن وهذا إصلاح الناس لا إصلاح المصنف {cite:shadharat-dhahab p. 599-600}."
  en: "Al-Zamakhshari's unsurpassed tafsir — opened first with 'Praise God who created the Qur'an', then emended to 'who made the Qur'an' (ja'ala meaning created, for them), while many manuscripts read 'who sent down' — 'the people's correction, not the author's' {cite:shadharat-dhahab p. 599-600}."
  es: "El tafsir insuperable de Al-Zamakhshari —comenzó primero con 'Alabado sea Dios que creó el Corán', luego enmendado a 'quien hizo el Corán' (ja'ala significa creado, para ellos), mientras que muchos manuscritos leen 'quien envió' — 'la corrección de la gente, no del autor' {cite:shadharat-dhahab p. 599-600}."
  fr: "Le tafsir inégalé d'Al-Zamakhshari — s'ouvrait d'abord sur « Louange à Dieu qui a créé le Coran », puis a été corrigé en « qui a fait le Coran » (ja'ala signifiant créé, pour eux), tandis que de nombreux manuscrits lisent « qui a révélé » — « la correction du peuple, et non celle de l'auteur » {cite: shadharat-dhahab p. 599-600}."
  ur: "الزمخشری کی بے مثال تفسیر - سب سے پہلے 'الحمد للہ جس نے قرآن بنایا' کے ساتھ کھولا، پھر 'قرآن کو کس نے بنایا' ⁦(جعلی کے معنی ان کے لیے بنائے)⁩ پر ترمیم کی، جب کہ بہت سے نسخوں میں 'جس نے نازل کیا' پڑھا - 'لوگوں کی اصلاح، مصنف کی نہیں'۔ 599-600}۔"
