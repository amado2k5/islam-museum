label: { ar: "الكشاف عن حقائق التنزيل", en: "al-Kashshaf 'an Haqa'iq al-Tanzil", ur: "الکشاف عن حقائق التنزیل" }
summary:
  ar: "تفسير الزمخشري الذي لم يصنف قبله مثله؛ قال ابن العماد أول ما صنفه استفتح الخطبة بقوله الحمد لله الذي خلق القرآن فيقال إنه قيل له متى تركته على هذه الهيئة هجره الناس ولا يرغب أحد فيه فغيره بقوله الذي جعل القرآن وجعل عندهم بمعنى خلق، ورأيت في كثير من النسخ الحمد لله الذي أنزل القرآن وهذا إصلاح الناس لا إصلاح المصنف {cite:shadharat-dhahab p. 599-600}."
  en: "Al-Zamakhshari's unsurpassed tafsir — opened first with 'Praise God who created the Qur'an', then emended to 'who made the Qur'an' (ja'ala meaning created, for them), while many manuscripts read 'who sent down' — 'the people's correction, not the author's' {cite:shadharat-dhahab p. 599-600}."
