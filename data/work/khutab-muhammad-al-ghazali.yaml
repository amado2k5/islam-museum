label: { ar: "خطب الشيخ محمد الغزالي في شؤون الدين والحياة", en: "Khutab al-Shaykh Muhammad al-Ghazali fi Shu'un al-Din wa-al-Hayat", ur: "خطباتِ شیخ محمد الغزالی دین اور زندگی کے امور میں" }
summary:
  ar: "مجموع خطب الجمعة التي ألقاها الشيخ محمد الغزالي ⁦(وُلد 1336هـ/1917م)⁩ في جامع عمرو بن العاص بالقاهرة، فرّغها من الأشرطة المسجلة قطب عبد الحميد قطب وراجعها محمد عاشور، ونشرتها دار الاعتصام؛ في المجلد الأول خطب مؤرخة من سنة 1972م، مع ترجمة الغزالي بقلمه وتوجيهاته في «الخطبة الناجحة» {cite:khutab-al-ghazali-dar-al-itisam-vol1 p. 11-13} {cite:khutab-al-ghazali-dar-al-itisam-vol1 p. 19-24}."
  en: "The collected Friday sermons given by Shaykh Muhammad al-Ghazali (born 1336 AH/1917) at the Mosque of 'Amr ibn al-'As in Cairo, transcribed from recordings by Qutb 'Abd al-Hamid Qutb, revised by Muhammad 'Ashur and published by Dar al-I'tisam. Volume 1 holds sermons dated from 1972, with al-Ghazali's account of himself and his guidance on 'the successful sermon' {cite:khutab-al-ghazali-dar-al-itisam-vol1 p. 11-13} {cite:khutab-al-ghazali-dar-al-itisam-vol1 p. 19-24}."
  ur: "شیخ محمد الغزالی ⁦(پیدائش 1336ھ/1917ء)⁩ کے جمعہ کے خطبات کا مجموعہ، جو انہوں نے قاہرہ کی جامع عمرو بن العاص میں دیے؛ قطب عبد الحمید قطب نے انہیں ریکارڈنگز سے لکھا، محمد عاشور نے نظرِ ثانی کی، اور دار الاعتصام نے شائع کیا۔ پہلی جلد میں 1972ء سے تاریخ وار خطبات ہیں، ساتھ غزالی کا اپنا تعارف اور «کامیاب خطبہ» پر ان کی ہدایات {cite:khutab-al-ghazali-dar-al-itisam-vol1 p. 11-13} {cite:khutab-al-ghazali-dar-al-itisam-vol1 p. 19-24}۔"
