structure: "المجلد الأول: تصدير عبد الصبور شاهين (ص 3)، مقدمة المعد (ص 10–12)، الغزالي بقلمه (ص 13–18)، الخطبة الناجحة (ص 19–23)، ثم الخطب مؤرخة بأيام الجمعة بجامع عمرو بن العاص، أولها «إلى المسجد» في 23/2/1972 (ص 24)، ومنها «الزحف اليهودي لا يوقفه إلا الإسلام» و«التصوف ما له وما عليه» و«القرآن معجزة خالدة» و«الخط البياني للتاريخ الإسلامي» وسلسلة «تأملات» في سور التوبة والنور ومحمد والفتح والممتحنة؛ الفهرس ص 605–608."
