id: work/fatwa-dar-alifta-eg-deputation-in-tawaf-al-ifada
class: work
kind: fatwa
label: { ar: "حكم الإنابة في طواف الإفاضة", en: "Deputising another to perform tawaf al-ifada", ur: "طوافِ افاضہ میں نائب مقرر کرنے کا حکم" }
summary:
  ar: "سائل سأل عن الإنابة في طواف الإفاضة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23953)⁩ أن المحرم بالحج ما دام قادرًا على الطواف بنفسه فهو باقٍ على إحرامه وعليه أن يطوف للإفاضة بنفسه، فإن عجز ركب أثناء الطواف ولا يجوز له أن ينيب غيره عنه على ما فصّل الجواب."
  en: "A questioner asked about deputising another to perform tawaf al-ifada. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23953) answered that a pilgrim still in ihram who can himself make the tawaf must perform it in person; if he is unable he rides during it, and may not appoint another in his place — as the answer details."
  ur: "ایک سائل نے طوافِ افاضہ میں نائب مقرر کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23953)⁩ نے جواب دیا کہ حج کے احرام میں ہو کر جو خود طواف کر سکتا ہے اس پر لازم ہے کہ وہ خود طوافِ افاضہ کرے؛ عاجز ہو تو طواف کے دوران سوار ہو جائے اور اپنے بدلے کوئی اور مقرر نہیں کر سکتا — جیسا کہ جواب میں تفصیل ہے۔"
