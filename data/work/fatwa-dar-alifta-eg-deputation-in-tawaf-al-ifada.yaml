label: { ar: "حكم الإنابة في طواف الإفاضة", en: "Deputising another to perform tawaf al-ifada", ur: "طوافِ افاضہ میں نائب مقرر کرنے کا حکم", es: "Designar a otra persona para realizar el tawaf al-ifada.", fr: "Désigner une autre personne pour accomplir le tawaf al-ifada", tr: "Tevaf el-İfade'de İnisiyasyon Kararı", id: "Putusan tentang Inisiasi dalam Tawaf al-Ifadah" }
summary:
  ar: "سائل سأل عن الإنابة في طواف الإفاضة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23953)⁩ أن المحرم بالحج ما دام قادرًا على الطواف بنفسه فهو باقٍ على إحرامه وعليه أن يطوف للإفاضة بنفسه، فإن عجز ركب أثناء الطواف ولا يجوز له أن ينيب غيره عنه على ما فصّل الجواب."
  en: "A questioner asked about deputising another to perform tawaf al-ifada. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23953) answered that a pilgrim still in ihram who can himself make the tawaf must perform it in person; if he is unable he rides during it, and may not appoint another in his place — as the answer details."
  ur: "ایک سائل نے طوافِ افاضہ میں نائب مقرر کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23953)⁩ نے جواب دیا کہ حج کے احرام میں ہو کر جو خود طواف کر سکتا ہے اس پر لازم ہے کہ وہ خود طوافِ افاضہ کرے؛ عاجز ہو تو طواف کے دوران سوار ہو جائے اور اپنے بدلے کوئی اور مقرر نہیں کر سکتا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de designar a otra persona para realizar el tawaf al-ifada. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23953) respondió que un peregrino que aún se encuentre en estado de ihram y que pueda realizar el tawaf personalmente debe hacerlo; si no puede, debe ir en vehículo durante el mismo y no puede designar a otra persona en su lugar, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant la possibilité de déléguer l'accomplissement du tawaf al-ifada. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23953) a répondu que le pèlerin encore en état d'ihram et capable d'accomplir lui-même le tawaf doit le faire en personne; s'il en est incapable, il l'effectue à cheval et ne peut désigner personne pour le remplacer, comme le précise la réponse."
  tr: "Bir soru soran kişi Tevaf el-İfade vekil olarak görevlendirilmeyi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 23953), ihramda hacı yapan kişinin kendisinin Tevafı yapabileceğini, bu yüzden ihramda kaldığını ve Tevafı kendisinin yapmak için Tevafı yapmak zorunda olduğunu yanıtladı. Eğer Tevaf sırasında Tevafı yapamazsa, cevapta ayrıntılı olarak belirtildiği gibi, başkalarını onun adına görevlendirmesine izin verilmez."
  id: "Seorang penanya menanyakan tentang pengangkatan Tawaf al-Ifadah sebagai deputi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 23953) menjawab bahwa orang yang melaksanakan Haji dalam ihram dapat melaksanakan Tawaf sendiri, sehingga ia tetap berada di ihram dan harus melaksanakan Tawaf untuk melaksanakan Tawaf sendiri. Jika ia tidak dapat melaksanakan Tawaf selama Tawaf, ia tidak diizinkan mendelegasikan orang lain atas namanya, seperti yang dijelaskan dalam jawaban."
