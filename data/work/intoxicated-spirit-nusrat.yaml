summary:
  ar: "ألبوم حي لنصرت فتح علي خان وفرقته، صدر سنة 1996 عن شاناشي وسُجّل في باكستان بالأصوات والطبلة والهارمونيوم، وجال معه نصرت في أمريكا الشمالية؛ رُشّح لجائزة غرامي لأفضل ألبوم فولك تقليدي، ورأى فيه النقاد عودة إلى القوالي دون الزخارف الغربية."
  en: "A live album by Nusrat Fateh Ali Khan & Party, released in 1996 on Shanachie and recorded in Pakistan with voices, tabla and harmonium, which he supported with a North American tour; it was nominated for the Grammy for Best Traditional Folk Album, and critics heard in it qawwali without the Western trappings."
  ur: "نصرت فتح علی خان اینڈ پارٹی کا لائیو البم، 1996 میں شاناشی سے جاری ہوا اور پاکستان میں آواز، طبلے اور ہارمونیم کے ساتھ ریکارڈ ہوا؛ یہ بہترین روایتی فوک البم کے گریمی کے لیے نامزد ہوا۔"
