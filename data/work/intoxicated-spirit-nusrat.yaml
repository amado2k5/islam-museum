label: { ar: "Intoxicated Spirit ⁦(الروح النشوى)⁩", en: "Intoxicated Spirit", ur: "انٹاکسیکیٹڈ اسپرٹ", es: "Espíritu ebrio", fr: "Esprit ivre", tr: "Sarhoş Ruh", id: "Roh Mabuk" }
summary:
  ar: "ألبوم حي لنصرت فتح علي خان وفرقته، صدر سنة 1996 عن شاناشي وسُجّل في باكستان بالأصوات والطبلة والهارمونيوم، وجال معه نصرت في أمريكا الشمالية؛ رُشّح لجائزة غرامي لأفضل ألبوم فولك تقليدي، ورأى فيه النقاد عودة إلى القوالي دون الزخارف الغربية."
  en: "A live album by Nusrat Fateh Ali Khan & Party, released in 1996 on Shanachie and recorded in Pakistan with voices, tabla and harmonium, which he supported with a North American tour; it was nominated for the Grammy for Best Traditional Folk Album, and critics heard in it qawwali without the Western trappings."
  ur: "نصرت فتح علی خان اینڈ پارٹی کا لائیو البم، 1996 میں شاناشی سے جاری ہوا اور پاکستان میں آواز، طبلے اور ہارمونیم کے ساتھ ریکارڈ ہوا؛ یہ بہترین روایتی فوک البم کے گریمی کے لیے نامزد ہوا۔"
  es: "Un álbum en directo de Nusrat Fateh Ali Khan & Party, publicado en 1996 por Shanachie y grabado en Pakistán con voces, tabla y armonio, que presentó con una gira por Norteamérica; fue nominado al Grammy al Mejor Álbum de Música Folclórica Tradicional, y los críticos percibieron en él qawwali sin los elementos occidentales."
  fr: "Un album live de Nusrat Fateh Ali Khan & Party, sorti en 1996 chez Shanachie et enregistré au Pakistan avec des voix, du tabla et de l'harmonium, qu'il a soutenu par une tournée nord-américaine; il a été nominé pour le Grammy du meilleur album folk traditionnel, et les critiques y ont entendu du qawwali sans les artifices occidentaux."
  tr: "Nusrat Fateh Ali Khan ve grubunun 1996'da Shanashi tarafından yayımlanan, Pakistan'da vokal, davul ve armonyumla kaydedilen canlı albüm. Nusrat bu albümle Kuzey Amerika'da turneye çıktı; En İyi Geleneksel Halk Albümü dalında Grammy Ödülü'ne aday gösterildi ve eleştirmenler bunu Batı süslemeleri olmadan qawwali'ye dönüş olarak gördü."
  id: "Album live oleh Nusrat Fateh Ali Khan dan bandnya, dirilis pada tahun 1996 oleh Shanashi, direkam di Pakistan dengan vokal, drum, dan harmonium. Nusrat melakukan tur ke Amerika Utara dengan album ini; album ini dinominasikan untuk Grammy Award untuk Album Folk Tradisional Terbaik, dan para kritikus melihatnya sebagai kembalinya qawwali tanpa hiasan Barat."
