id: work/fatwa-dar-alifta-eg-ifada-tawaf-for-menstruating-woman
class: work
kind: fatwa
label: { ar: "حكم طواف الإفاضة للحائض", en: "Tawaf al-ifada for a menstruating woman", ur: "حائض کا طواف افاضہ", es: "Tawaf al-ifada para una mujer menstruante", fr: "Tawaf al-ifada pour une femme menstruée", tr: "Regl kadın için Tevaf el-İfade kararı", id: "Putusan tentang Tawaf al-Ifadah untuk wanita yang sedang menstruasi" }
summary:
  ar: "سائل سأل عن طواف الإفاضة للحائض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20727)⁩ أن المقرر بإجماع العلماء أن الحيض لا يمنع أي عمل من أعمال الحج سوى الطواف على خلاف فيه وبيّن الجواب حكمها على وجهه."
  en: "A questioner asked about tawaf al-ifada for a menstruating woman. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20727) answered that by scholarly consensus menstruation bars no rite of Hajj but the tawaf — which is disputed — and the answer sets out her ruling."
  ur: "ایک سائل نے حائض کے طواف افاضہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20727)⁩ نے جواب دیا کہ اجماع کے مطابق حیض طواف کے سوا کوئی حج کا عمل نہیں روکتا — جس میں اختلاف ہے — اور جواب میں حکم بیان ہوا۔"
  es: "Una persona preguntó sobre el tawaf al-ifada para una mujer menstruante. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20727) respondió que, según el consenso de los eruditos, la menstruación no impide ningún rito del Hajj, excepto el tawaf —lo cual es controvertido—, y en su respuesta expone su dictamen."
  fr: "Une personne a posé une question concernant le tawaf al-ifada pour une femme menstruée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20727) a répondu que, selon le consensus des savants, les menstruations n'empêchent aucun rite du Hajj, à l'exception du tawaf – ce qui est contesté – et la réponse expose sa décision."
  tr: "Bir soru soran kişi, adet gören bir kadın için Tevaf el-İfade hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 20727), alimlerin görüş birliğinin adet görmenin Tewaf dışında hiçbir hacı engellemediği, ancak görüş ayrılıklarının doğru yol olduğuna karar verildiği yönündeydi."
  id: "Seorang penanya menanyakan tentang Tawaf al-Ifadah untuk wanita yang sedang menstruasi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20727) menjawab bahwa konsensus para ulama adalah bahwa menstruasi tidak menghalangi ibadah Haji kecuali Tawa, meskipun ada perbedaan pendapat dan jawabannya adalah keputusan yang benar."
