id: work/fatwa-dar-alifta-eg-ifada-tawaf-for-menstruating-woman
class: work
kind: fatwa
label: { ar: "حكم طواف الإفاضة للحائض", en: "Tawaf al-ifada for a menstruating woman", ur: "حائض کا طواف افاضہ" }
summary:
  ar: "سائل سأل عن طواف الإفاضة للحائض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20727)⁩ أن المقرر بإجماع العلماء أن الحيض لا يمنع أي عمل من أعمال الحج سوى الطواف على خلاف فيه وبيّن الجواب حكمها على وجهه."
  en: "A questioner asked about tawaf al-ifada for a menstruating woman. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20727) answered that by scholarly consensus menstruation bars no rite of Hajj but the tawaf — which is disputed — and the answer sets out her ruling."
  ur: "ایک سائل نے حائض کے طواف افاضہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20727)⁩ نے جواب دیا کہ اجماع کے مطابق حیض طواف کے سوا کوئی حج کا عمل نہیں روکتا — جس میں اختلاف ہے — اور جواب میں حکم بیان ہوا۔"
