label: { ar: "منشور بونابرت إلى أهالي مصر (محرم 1213هـ / 1798م)", en: "Bonaparte's proclamation to the people of Egypt (Muharram 1213 / 1798)", ur: "اہالیِ مصر کے نام بوناپارٹ کا منشور (محرم 1213ھ / 1798ء)" }
summary:
  ar: "منشور عربي طبعه الفرنسيس بالإسكندرية عند نزولهم وأرسلوا نسخه إلى البلاد، باسم «السر عسكر الكبير بونابارته أمير الجيوش الفرنساوية»، مؤرخ في 13 مسيدور من السنة السادسة للجمهور الفرنساوي «يعني في أواخر شهر محرم سنة 1213»؛ يزعم فيه أنه ما جاء إلا ليخلّص المصريين من ظلم المماليك، وأنه لم يأت لإزالة دينهم، ويختمه بخمس مواد في طاعة القرى ونصب السنجاق الفرنساوي وختم أملاك المماليك وبقاء المشايخ في وظائفهم؛ وقد نقله الجبرتي في «عجائب الآثار» «بالحرف الواحد» {cite:ajaib-al-athar-moreh-v3 p. 35-36}."
  en: "An Arabic proclamation printed by the French at Alexandria on landing and sent to the towns, in the name of 'the great commander Bonaparte, amir of the French armies', dated 13 Messidor of year 6 of the French Republic — 'that is, at the end of Muharram 1213'. It claims he came only to free the Egyptians from Mamluk oppression and not to abolish their religion, and ends with five articles on the submission of villages, the flying of the French flag, the sealing of Mamluk property and the ulama keeping their posts. Al-Jabarti copied it into Aja'ib al-athar 'letter for letter' {cite:ajaib-al-athar-moreh-v3 p. 35-36}."
