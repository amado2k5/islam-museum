label: { ar: "منشور بونابرت إلى أهالي مصر ⁦(محرم 1213هـ / 1798م)⁩", en: "Bonaparte's proclamation to the people of Egypt (Muharram 1213 / 1798)", ur: "اہالیِ مصر کے نام بوناپارٹ کا منشور ⁦(محرم 1213ھ / 1798ء)⁩", es: "Proclamación de Bonaparte al pueblo de Egipto (Muharram de 1213 / 1798)", fr: "Proclamation de Bonaparte au peuple d'Égypte (Muharram 1213 / 1798)", tr: "Bonapart'ın Mısır Halkına Genelgesi (Muharrem 1213 Hicri / 1798 M.S.)", id: "Surat Edaran Bonaparte kepada Rakyat Mesir (Muharram 1213 H / 1798 M)" }
summary:
  ar: "منشور عربي طبعه الفرنسيس بالإسكندرية عند نزولهم وأرسلوا نسخه إلى البلاد، باسم «السر عسكر الكبير بونابارته أمير الجيوش الفرنساوية»، مؤرخ في 13 مسيدور من السنة السادسة للجمهور الفرنساوي «يعني في أواخر شهر محرم سنة 1213»؛ يزعم فيه أنه ما جاء إلا ليخلّص المصريين من ظلم المماليك، وأنه لم يأت لإزالة دينهم، ويختمه بخمس مواد في طاعة القرى ونصب السنجاق الفرنساوي وختم أملاك المماليك وبقاء المشايخ في وظائفهم؛ وقد نقله الجبرتي في «عجائب الآثار» «بالحرف الواحد» {cite:ajaib-al-athar-moreh-v3 p. 35-36}."
  en: "An Arabic proclamation printed by the French at Alexandria on landing and sent to the towns, in the name of 'the great commander Bonaparte, amir of the French armies', dated 13 Messidor of year 6 of the French Republic — 'that is, at the end of Muharram 1213'. It claims he came only to free the Egyptians from Mamluk oppression and not to abolish their religion, and ends with five articles on the submission of villages, the flying of the French flag, the sealing of Mamluk property and the ulama keeping their posts. Al-Jabarti copied it into Aja'ib al-athar 'letter for letter' {cite:ajaib-al-athar-moreh-v3 p. 35-36}."
  es: "Una proclama árabe impresa por los franceses en Alejandría al desembarcar y enviada a las ciudades, en nombre del «gran comandante Bonaparte, emir de los ejércitos franceses», fechada el 13 de Messidor del año 6 de la República Francesa —«es decir, al final de Muharram de 1213»—. Afirma que vino únicamente para liberar a los egipcios de la opresión mameluca y no para abolir su religión, y concluye con cinco artículos sobre la sumisión de las aldeas, el izado de la bandera francesa, el sellado de las propiedades mamelucas y el mantenimiento de los cargos de los ulemas. Al-Jabarti la copió en Aja'ib al-athar «carta por carta» {cite:ajaib-al-athar-moreh-v3 p. 35-36}."
  fr: "Une proclamation en arabe, imprimée par les Français à Alexandrie dès leur débarquement et envoyée aux villes, au nom du « grand commandant Bonaparte, émir des armées françaises », datée du 13 Messidor de l'an 6 de la République française – soit à la fin du mois de Muharram 1213 –, affirme qu'il est venu uniquement pour libérer les Égyptiens de l'oppression mamelouke et non pour abolir leur religion. Elle se termine par cinq articles portant sur la soumission des villages, le déploiement du drapeau français, la saisie des biens mamelouks et le maintien des oulémas dans leurs fonctions. Al-Jabarti l'a recopiée dans son ouvrage « Aja'ib al-athar » (« Lettre pour lettre »)."
  ur: "ایک عربی اعلان جو فرانسیسیوں نے اسکندریہ میں لینڈنگ پر چھاپا اور شہروں کو بھیجا، 'فرانسیسی فوجوں کے امیر، عظیم کمانڈر بوناپارٹ' کے نام پر، فرانسیسی جمہوریہ کے سال 6 کے 13 میسیڈر - 'یعنی محرم 1213 کے آخر میں'۔ اس کا دعویٰ ہے کہ وہ صرف مصریوں کو مملوک کے ظلم سے نجات دلانے آیا تھا نہ کہ ان کے مذہب کو ختم کرنے کے لیے، اور اس کا اختتام دیہاتوں کو تسلیم کرنے، فرانسیسی جھنڈا لہرانے، مملوک کی جائیداد پر مہر لگانے اور علما کے اپنے عہدوں کو برقرار رکھنے سے متعلق پانچ مضامین پر ہوتا ہے۔ الجبرتی نے اسے عجائب الاطہر 'خط کے بدلے خط' میں نقل کیا ہے۔ 35-36}۔"
  tr: "Fransızlar İskenderiye'ye vardıklarında basıp ülkeye gönderdikleri nüshalar gönderen ve Fransız halkı için altıncı yılın 13 Maysidor'u tarihli \"Büyük Ordu Bonapart'ın Sırrı\" başlıklı Arapça broşür, \"1213 yılında Muharrem sonu anlamına gelir\"; bu broşür, yalnızca Mısırlıları Memlüklerin baskısından kurtarmak için geldiğini, dinlerini kaldırmak için gelmediğini ve köylere itaat, Fransız pinakının kurulması, Memlük mülklerinin mühürlenmesi ve şeyhlerin görevlerinde tutulması konularında beş maddeyle mühürlendiğini iddia eder; al-Jabarti tarafından \"Ajaib al-Athar-moreh-v3, s. 35-36\"da kelimesi kelimesine alıntılanmıştır."
  id: "Sebuah pamflet Arab yang dicetak oleh orang Prancis di Alexandria saat mereka tiba dan dikirim ke negara tersebut, berjudul \"Rahasia Tentara Besar Bonaparte, Komandan Tentara Prancis,\" bertanggal 13 Maysidor tahun keenam untuk publik Prancis, \"yang berarti pada akhir Muharram tahun 1213\"; ia menyatakan bahwa pamflet itu hanya datang untuk menyelamatkan orang Mesir dari penindasan Mamluk, bahwa ia tidak datang untuk menghapus agama mereka, dan bahwa pamflet itu disegel dengan lima pasal tentang ketaatan kepada desa, pemasangan pinaq Prancis, penyegelan properti Mamluk, dan mempertahankan para sheikh di posisi mereka; dikutip secara verbatim oleh al-Jabarti dalam \"Ajaib al-Athar-moreh-v3, hlm. 35-36.\""
