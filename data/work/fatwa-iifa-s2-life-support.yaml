summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن أجهزة الإنعاش: قرر تأخير البت إلى الدورة القادمة وكلف الأمانة العامة بجمع دراسات وقرارات المنظمة الإسلامية للعلوم الطبية في الكويت وموافاة الأعضاء بخلاصة محددة ⁦(انظر لاحقًا القرار 17 (3/5))⁩."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on life-support machines: it deferred the ruling to the next session and tasked the secretariat with collecting the studies and resolutions of the Islamic Organisation for Medical Sciences in Kuwait for members — later settled in resolution 17 (3/5)."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ لائف سپورٹ پر: فیصلہ مؤخر؛ کویت کی اسلامی طبی سائنس تنظیم کی تحقیقات جمع کرنے کا حکم ⁦(بعد ازاں قرارداد 17 (3/5))⁩۔"
  es: "Resolución de la segunda sesión de la IIFA (Kuwait, diciembre de 1985) sobre máquinas de soporte vital: aplazó la decisión a la siguiente sesión y encargó a la secretaría la recopilación de los estudios y resoluciones de la Organización Islámica para las Ciencias Médicas en Kuwait para los miembros, lo que posteriormente se resolvió en la resolución 17 (3/5)."
