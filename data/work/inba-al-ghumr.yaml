summary:
  ar: "في التاريخ، للحافظ شهاب الدين أبي الفضل أحمد بن علي بن حجر العسقلاني؛ أوله: الحمد لله الباقي وكل مخلوق يفنى، ذكر فيه أنه جمع الحوادث التي أدركها منذ ولد سنة ٧٧٣هـ وأورد في كل سنة أحوال الدول ووفيات الأعيان مستوعباً لرواة الحديث، وغالب ما نقله من تاريخ ابن الفرات وابن دقماق وابن حجي والمقريزي والتقي الفاسي وصلاح خليل الأقفهسي وبدر العيني وأورد ما شاهده، وقال إن كتابه يحسن من حيث الحوادث أن يكون ذيلاً على تاريخ الذهبي {cite:kashf-zunun-furqan p. 642}."
  en: "Ibn Hajar's Inba' al-Ghumr — his annals of the events he lived from 773 onward, drawing on Ibn al-Furat, Ibn Duqmaq, Ibn Hiji, al-Maqrizi, al-Fasi, al-Aqfahsi and al-Ayni plus what he witnessed, intended as a continuation of al-Dhahabi's history {cite:kashf-zunun-furqan p. 642}."
