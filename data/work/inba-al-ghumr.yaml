label: { ar: "إنباء الغمر في أبناء العمر", en: "Inba' al-Ghumr bi-Abna' al-'Umr", es: "Inba' al-Ghumr bi-Abna' al-'Umr", fr: "Inba' al-Ghumr bi-Abna' al-'Umr", ur: "انبا الغمر بِ ابنا العمر", tr: "Yaşlıların Oğullarına Dalma Haberi", id: "Berita tentang pencelupan di kalangan anak-anak dewasa" }
summary:
  ar: "في التاريخ، للحافظ شهاب الدين أبي الفضل أحمد بن علي بن حجر العسقلاني؛ أوله: الحمد لله الباقي وكل مخلوق يفنى، ذكر فيه أنه جمع الحوادث التي أدركها منذ ولد سنة ٧٧٣هـ وأورد في كل سنة أحوال الدول ووفيات الأعيان مستوعباً لرواة الحديث، وغالب ما نقله من تاريخ ابن الفرات وابن دقماق وابن حجي والمقريزي والتقي الفاسي وصلاح خليل الأقفهسي وبدر العيني وأورد ما شاهده، وقال إن كتابه يحسن من حيث الحوادث أن يكون ذيلاً على تاريخ الذهبي {cite:kashf-zunun-furqan p. 642}."
  en: "Ibn Hajar's Inba' al-Ghumr — his annals of the events he lived from 773 onward, drawing on Ibn al-Furat, Ibn Duqmaq, Ibn Hiji, al-Maqrizi, al-Fasi, al-Aqfahsi and al-Ayni plus what he witnessed, intended as a continuation of al-Dhahabi's history {cite:kashf-zunun-furqan p. 642}."
  es: "Inba' al-Ghumr de Ibn Hajar: sus anales de los acontecimientos que vivió desde 773 en adelante, basándose en Ibn al-Furat, Ibn Duqmaq, Ibn Hiji, al-Maqrizi, al-Fasi, al-Aqfahsi y al-Ayni, además de lo que presenció, con la intención de ser una continuación de la historia de al-Dhahabi. {citar:kashf-zunun-furqan p. 642}."
  fr: "Inba' al-Ghumr d'Ibn Hajar — ses annales des événements qu'il a vécus à partir de 773, s'appuyant sur Ibn al-Furat, Ibn Duqmaq, Ibn Hiji, al-Maqrizi, al-Fasi, al-Aqfahsi et al-Ayni ainsi que ce dont il a été témoin, conçues comme une continuation de l'histoire d'al-Dhahabi {cite:kashf-zunun-furqan p. 642}."
  ur: "ابن حجر کی انباء الغمر - ان کے واقعات کے بارے میں جو وہ 773 سے لے کر زندہ رہے، ابن الفرات، ابن دقمق، ابن حجی، المقریزی، الفاسی، الاخفصی اور العینی کے علاوہ تاریخ میں اس کے گواہ ہیں، {حوالہ: کشف الذنون فرقان ص۔ 642}۔"
  tr: "Tarihte, hafızacı Şihabeddin Ebu el-Fadl Ahmed bin Ali ibn Hajar al-Askelani tarafından başlangıcıdır: Dayanıklı ve Bozulan Her Yaratık Allah'a hamdlar olsun. Kitapta, 773 Hicri doğumundan beri karşılaştığı olayları topladığını ve her yıl devletlerin koşullarını ve önemli şahsiyetlerin ölümlerini, hadis rivayetçilerini de dahil ettiğini belirtmiştir. Aktardıklarının çoğu, İbn el-Furat, İbn Duqmaq, İbn Haci, el-Maqrizi, el-Taqi el-Fasi, Salah Halil el-Akfahsi ve Badr al-'Ayni'nin tarihinden aktarılmış ve gördüklerini de içermiştir. Kitabının olaylar açısından el-Dhahabi'nin tarihine ek olmanın iyi olduğunu söylemiştir {atıf:kaşf-zunun-furqan, s. 642}."
  id: "Dalam sejarah, oleh penghafal Shihab al-Din Abu al-Fadl Ahmad ibn Ali ibn Hajar al-Asqalani; awalnya adalah: Segala puji bagi Allah, Makhluk Abadi dan Segala Makhluk yang Dapat Binasa. Dalam buku itu, ia menyebutkan bahwa ia mengumpulkan peristiwa yang dihadapinya sejak kelahirannya pada tahun 773 H, dan setiap tahun ia memasukkan kondisi negara dan kematian tokoh-tokoh terkemuka, mencakup para narator hadits. Sebagian besar yang ia sampaikan dari sejarah Ibn al-Furat, Ibn Duqmaq, Ibn Hajji, al-Maqrizi, al-Taqi al-Fasi, Salah Khalil al-Aqfahsi, dan Badr al-'Ayni, serta memasukkan apa yang ia lihat. Ia mengatakan bahwa bukunya baik, dalam hal peristiwa, sebagai pelengkap sejarah al-Dhahabi {cite:kashf-zunun-furqan, hlm. 642}."
