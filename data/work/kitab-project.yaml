label:
  ar: "مشروع كتاب (KITAB)"
  en: "KITAB project (Knowledge, Information Technology, and the Arabic Book)"
  ur: "کتاب منصوبہ (KITAB)"
summary:
  ar: "مشروع بحثي رقمي في «المعرفة وتقنية المعلومات والكتاب العربي» بقيادة المؤرخة سارة بوين سافانت في جامعة الآغا خان بلندن، يكشف كيف نقل المؤلفون العرب الكلاسيكيون عن الكتب التي سبقتهم وأعادوا ترتيبها، بتمويل من مجلس البحوث الأوروبي ومكتبة قطر الوطنية؛ يعمل على مدونة OpenITI، ويتواصل منذ يناير 2026 في «KITAB-Transform» لكشف إعادة الصياغة والترجمة بين العربية والفارسية."
  en: "A digital research project on 'Knowledge, Information Technology, and the Arabic Book', led by the historian Sarah Bowen Savant at the Aga Khan University in London, which detects how classical Arabic authors copied from earlier books and rearranged them, funded by the European Research Council and the Qatar National Library; it works on the OpenITI corpus and continues from January 2026 as KITAB-Transform, detecting paraphrase and translation between Arabic and Persian."
  ur: "«علم، انفارمیشن ٹیکنالوجی اور عربی کتاب» پر ڈیجیٹل تحقیقی منصوبہ، لندن میں آغا خان یونیورسٹی کی مؤرخ سارہ بوون ساوانت کی قیادت میں، جو دیکھتا ہے کہ کلاسیکی عربی مصنفین نے پہلے کی کتابوں سے کیسے نقل کیا اور انہیں نئی ترتیب دی؛ یورپی ریسرچ کونسل اور قطر نیشنل لائبریری کی مالی مدد؛ OpenITI مجموعے پر کام، اور جنوری 2026 سے KITAB-Transform میں عربی و فارسی کے درمیان دوبارہ بیان اور ترجمے کی شناخت۔"
