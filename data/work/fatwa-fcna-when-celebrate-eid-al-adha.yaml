label: { ar: "متى يحتفل المسلمون بعيد الأضحى؟", en: "When should Muslims celebrate Eid al-Adha?", ur: "مسلمان عید الاضحیٰ کب منائیں؟", es: "¿Cuándo deben celebrar los musulmanes el Eid al-Adha?", fr: "Quand les musulmans doivent-ils célébrer l'Aïd al-Adha ?" }
summary:
  ar: "سؤال عما إذا كان المسلمون يحتفلون بعيد الأضحى في العاشر من ذي الحجة بحسب تاريخهم المحلي أم بما تعلنه السلطات السعودية بعد يوم عرفة وأي الطريقين أولى. أجاب موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر نوفمبر 2021)⁩ ببيان الطريق الأرجح على ما فصّل الجواب."
  en: "A question asking whether Muslims should celebrate Eid al-Adha on their local 10th of Dhu'l-Hijja or follow the Saudi announcement after the day of Arafa. The Fiqh Council of North America site (published November 2021) answered by setting out the preferred course — as the answer details."
  ur: "کیا مسلمان عید الاضحیٰ مقامی دسویں ذوالحجہ کو منائیں یا سعودی اعلان کے مطابق عرفہ کے اگلے دن؟ فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ نے ⁦(شائع شدہ نومبر 2021)⁩ بہتر طریقہ بیان کیا۔"
  es: "Una pregunta planteaba si los musulmanes debían celebrar el Eid al-Adha el 10 de Dhu'l-Hijjah, fecha local, o seguir el anuncio saudí tras el día de Arafa. El sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado en noviembre de 2021) respondió indicando la opción preferida, tal como se detalla en la respuesta."
  fr: "Une question portait sur la possibilité pour les musulmans de célébrer l'Aïd al-Adha le 10 Dhu al-Hijja, date locale, ou de suivre l'annonce saoudienne après le jour d'Arafat. Le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication: novembre 2021) a répondu en indiquant la marche à suivre, comme le détaille la réponse."
