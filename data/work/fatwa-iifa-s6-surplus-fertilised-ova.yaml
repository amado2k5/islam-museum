summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: في ضوء إمكان حفظ البييضات غير الملقحة يجب عند التلقيح الاقتصار على العدد المطلوب للزرع في كل مرة تفاديًا للفائض، وإذا حصل فائض من البييضات الملقحة بأي وجه تترك دون عناية طبية إلى أن تنتهي على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on surplus fertilised ova: since unfertilised ova can be stored, only the number needed for implantation each time should be fertilised to avoid a surplus; any surplus that nonetheless arises is left without medical care until it perishes, as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: صرف اتنے انڈے ملقح کیے جائیں جتنے ضروری ہوں؛ زائد ملقح انڈے طبی دیکھ بھال کے بغیر چھوڑ دیے جاتے ہیں۔"
