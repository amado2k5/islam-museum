label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن البييضات الملقحة الزائدة عن الحاجة", en: "IIFA resolution on surplus fertilised ova", ur: "اکیڈمی کی قرارداد: ضرورت سے زائد ملقح انڈے", es: "Resolución de la IIFA sobre el excedente de óvulos fertilizados", fr: "Résolution de l'IIFA sur les ovules fécondés en surplus", tr: "Uluslararası İslami Fiqh Akademisi'nin fazla döllenmiş yumurtalarla ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai sel telur yang telah dibuahi berlebih" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: في ضوء إمكان حفظ البييضات غير الملقحة يجب عند التلقيح الاقتصار على العدد المطلوب للزرع في كل مرة تفاديًا للفائض، وإذا حصل فائض من البييضات الملقحة بأي وجه تترك دون عناية طبية إلى أن تنتهي على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on surplus fertilised ova: since unfertilised ova can be stored, only the number needed for implantation each time should be fertilised to avoid a surplus; any surplus that nonetheless arises is left without medical care until it perishes, as the resolution details."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: صرف اتنے انڈے ملقح کیے جائیں جتنے ضروری ہوں؛ زائد ملقح انڈے طبی دیکھ بھال کے بغیر چھوڑ دیے جاتے ہیں۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990) sobre el excedente de óvulos fertilizados: dado que los óvulos no fertilizados pueden almacenarse, solo se debe fertilizar la cantidad necesaria para la implantación en cada ocasión para evitar un excedente; cualquier excedente que surja, no obstante, se deja sin atención médica hasta que se pierde, como se detalla en la resolución."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur les ovules fécondés en surplus: puisque les ovules non fécondés peuvent être conservés, seul le nombre nécessaire à l'implantation à chaque fois devrait être fécondé pour éviter un surplus; tout surplus qui survient néanmoins est laissé sans soins médicaux jusqu'à ce qu'il périsse, comme le précise la résolution."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) kararı: Döllenmemiş yumurtaların korunması olasılığı göz önüne alındığında, döllenme her seferinde gereken implant sayısıyla sınırlandırılmalıdır, böylece fazlalık önlenmelidir. Fazla döllenmiş yumurtalar oluşursa, çözüm tamamlanana kadar tıbbi bakım olmadan bırakılmalıdır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Mengingat kemungkinan mengawetkan sel telur yang belum dibuahi, pembuahan harus dibatasi pada jumlah implan yang diperlukan setiap kali untuk menghindari kelebihan tersebut. Jika terjadi sel telur berlebih yang dibuahi, mereka harus dibiarkan tanpa perawatan medis sampai penyelesaian selesai."
