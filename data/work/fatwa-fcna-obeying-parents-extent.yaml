label: { ar: "إلى أي مدى تجب طاعة الوالدين؟", en: "To what extent is obeying the parents obligatory?", ur: "والدین کی اطاعت کس حد تک واجب ہے؟", es: "¿Hasta qué punto es obligatorio obedecer a los padres?", fr: "Dans quelle mesure l'obéissance aux parents est-elle obligatoire ?", tr: "Ebeveyn itaatinin ne ölçüde zorunlu olduğunu düşünüyorsunuz?", id: "Sejauh mana ketaatan orang tua itu wajib?" }
summary:
  ar: "سؤال عن مدى وجوب طاعة الوالدين. أجاب الدكتور ياسر قاضي في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشر 18 سبتمبر 2024)⁩ ببيان حدود طاعة الوالدين في الشرع ومتى تكون الطاعة واجبة ومتى لا تكون على ما فصّل الجواب."
  en: "A question about how far obedience to parents is obligatory. Dr. Yasir Qadhi answered on the Fiqh Council of North America site (published 18 September 2024), setting out the bounds of parental obedience — when it is obligatory and when it is not — as the answer details."
  ur: "والدین کی اطاعت کی حد کا سوال۔ ڈاکٹر یاسر قاضی نے فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ 18 ستمبر 2024)⁩ جواب دیا جس میں اطاعت کے حدود بیان ہوئے — کب واجب اور کب نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una pregunta sobre hasta qué punto es obligatoria la obediencia a los padres. El Dr. Yasir Qadhi respondió en el sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 18 de septiembre de 2024), estableciendo los límites de la obediencia paterna —cuándo es obligatoria y cuándo no— como se detalla en la respuesta."
  fr: "Une question portait sur le degré d'obligation d'obéissance aux parents. Le Dr Yasir Qadhi y a répondu sur le site du Conseil de jurisprudence islamique d'Amérique du Nord (publication du 18 septembre 2024), en précisant les limites de cette obéissance: quand elle est obligatoire et quand elle ne l'est pas."
  tr: "Ebeveynlere itaat etme yükümlülüğü hakkında bir soru. Dr. Yaser Kazi, Kuzey Amerika Fiqh Konseyi web sitesinde (18 Eylül 2024'te yayımlandı) İslam hukukunda ebeveynlere itaatin sınırlarını, itaatin ne zaman zorunlu olup olmadığını, yanıtta ayrıntılı olarak açıkladı."
  id: "Sebuah pertanyaan tentang kewajiban taat kepada orang tua. Dr. Yasser Qazi menjawab di situs web Dewan Fiqh Amerika Utara (diterbitkan 18 September 2024) dengan menjelaskan batasan ketaatan kepada orang tua dalam hukum Islam, kapan ketaatan wajib dan kapan tidak, seperti yang dijelaskan dalam jawabannya."
