summary:
  ar: "منظومة البيقونية في مصطلح الحديث لعمر بن محمد البيقوني ⁦(ت. 1080هـ)⁩ في أربعة وثلاثين بيتاً على بحر الرجز؛ تحفظ أقسام الحديث وشروط الأسانيد والمتون وهي أول متون المصطلح في الدروس {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Al-Manzuma al-Bayquniyya in hadith terminology by Umar ibn Muhammad al-Bayquni (d. 1080 AH) — thirty-four rajaz lines memorising the divisions of hadith and the conditions of isnad and matn; the first mustalah text in the lessons {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Al-Manzuma al-Bayquniyya en terminología hadiz de Umar ibn Muhammad al-Bayquni (m. 1080 d. H.): treinta y cuatro líneas rajaz que memorizan las divisiones del hadiz y las condiciones de isnad y matn; el primer texto de mustalah en las lecciones {cita:al-mutun-al-ilmiyya-azhar} {cita:al-aalam}."
  fr: "Al-Manzuma al-Bayquniyya dans la terminologie des hadiths par Umar ibn Muhammad al-Bayquni (mort en 1080 AH) — trente-quatre lignes rajaz mémorisant les divisions des hadiths et les conditions de l'isnad et du matn; le premier texte mustalah des leçons {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "المنظوم البیقونیہ حدیث کی اصطلاح میں عمر بن محمد البیقونی ⁦(متوفی 1080ھ)⁩ - حدیث کی تقسیم اور اسناد و متن کی شرائط کو حفظ کرنے والی چونتیس رجز لائنیں؛ اسباق میں پہلا مستحب متن {حوالہ: الموتن العلمیہ ازہر} {حوالہ: العالم}۔"
  tr: "Ömer bin Muhammed el-Beyquni'nin (ö. 1080 H yılı) 'El-Beykniye fi Mitsal Hadis' şiiri, Rajaz ölçüsünde otuz dört ayetten oluşur; hadis kategorilerini, rivayet zincirlerinin koşullarını ve metinleri korumaktadır; bunlar {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam} derslerindeki terminolojinin ilk metinleridir."
  id: "Puisi 'Al-Bayquniyyah fi Mithsal al-Hadith' karya Umar ibn Muhammad al-Bayquni (wafat 1080 H) terdiri dari tiga puluh empat ayat dalam meter Raraz; mempertahankan kategori hadits, kondisi rantai narasi, dan teks-teks, yang merupakan teks terminologi pertama dalam pelajaran {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
