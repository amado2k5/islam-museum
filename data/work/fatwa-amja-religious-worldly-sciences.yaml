label: { ar: "علوم الدين وعلوم الدنيا", en: "Balancing the sciences of religion and of the world", ur: "دینی اور دنیاوی علوم کا توازن", es: "Equilibrar las ciencias de la religión y del mundo", fr: "Concilier les sciences de la religion et les sciences du monde", tr: "Din Bilimleri ve Dünya Bilimleri", id: "Ilmu Agama dan Ilmu Dunia" }
summary:
  ar: "سأل سائل عن كيفية الموازنة بين علوم الدين وعلوم الدنيا. أجاب مجمع فقهاء الشريعة ⁦(فتوى رقم 360 بتاريخ 21 سبتمبر 2004)⁩ أن في علوم الدين ما هو فرض عين ومنها ما هو فرض كفاية فتعلم فروض العين متحتم على كل مسلم يأثم بتركه ولا يسعه جهله كتعلم ما لا تصح صلاته ولا صومه ولا سائر عباداته إلا به وليس بالضرورة أن يعلم كل مسألة بدليلها وإنما يكفيه سؤال من يثق في دينه وعلمه من أهل الفتوى، وأما علوم الكفاية فتجب على مجموع الأمة لا على آحادها فردًا فردًا كتعلم الطب والهندسة ونحوها مما تقوم به مصالح الأمة."
  en: "A questioner asked how to balance the sciences of religion and of the world. The Assembly of Muslim Jurists (fatwa no. 360, 21 September 2004) answered that among religion's sciences some are individually obligatory — learning them binding on every Muslim, sinful to leave, none excused for ignoring, like what one's prayer, fast and other worship cannot stand on; he need not know each question with its proof — asking a fatwa-authority he trusts in religion and learning suffices for worship on insight; the communally obligatory sciences fall on the ummah as a whole, not each person — medicine, engineering and the like serving its interests."
  ur: "ایک سائل نے دینی و دنیاوی علوم کا توازن پوچھا۔ مجمع فقہاء ⁦(فتویٰ 360، 21 ستمبر 2004)⁩ کے مطابق فرض عین علم ہر مسلمان پر لازم ہے اور فرض کفایہ مجموعی امت پر — جیسے طب و انجینئرنگ۔"
  es: "Un interlocutor preguntó cómo equilibrar las ciencias de la religión y del mundo. La Asamblea de Juristas Musulmanes (fatwa n.º 360, 21 de septiembre de 2004) respondió que, entre las ciencias de la religión, algunas son individualmente obligatorias: su estudio es vinculante para todo musulmán, su abandono es un pecado y nadie se excusa por ignorarlas, al igual que aquello en lo que no se sustentan la oración, el ayuno y demás actos de culto; no es necesario conocer cada cuestión con su prueba: basta con consultar a una autoridad religiosa de confianza y el conocimiento para la adoración basada en la intuición; las ciencias comunitariamente obligatorias recaen sobre la ummah en su conjunto, no sobre cada persona: la medicina, la ingeniería y otras similares sirven a sus intereses."
  fr: "Un internaute a demandé comment concilier les sciences religieuses et les sciences profanes. L'Assemblée des juristes musulmans (fatwa n° 360, 21 septembre 2004) a répondu que, parmi les sciences religieuses, certaines sont obligatoires individuellement – leur apprentissage étant une obligation pour tout musulman, les négliger étant un péché, et nul n'étant excusé de les ignorer, à l'instar des fondements de la prière, du jeûne et des autres actes d'adoration; il n'est pas nécessaire de connaître chaque question et sa preuve – consulter une autorité religieuse compétente en matière de fatwas et s'informer suffit pour l'adoration par la compréhension; les sciences obligatoires pour la communauté incombent à l'oumma dans son ensemble, et non à chaque individu – la médecine, l'ingénierie et autres disciplines similaires servant ses intérêts."
  tr: "Bir soruya dinsel bilimler ile dünyevi bilimler arasında nasıl denge kurulacağı soruldu. Şeriat Hukukçuları Meclisi (21 Eylül 2004 tarihli 360 sayılı Fetva), dini ilimlerde bazılarının bireysel zorunlu, bazılarının ise toplumsal yükümlülükler olduğunu yanıtladı. Bireysel zorunlu görevleri öğrenmek, onları ihmal ederek günah işleyen her Müslüman için zorunludur ve cehalet, namazlarının, oruçlarının veya diğer ibadet eylemlerinin yapmadığı şeyleri öğrenerek kabul edilemez. Her konuyu kanıtlarıyla bilmek gerekli değildir; fetva halkı arasında dinine ve bilgisine güvenen birine sormak yeterlidir. Kolektif ilimler ise tüm ümmet için zorunludur, bireysel bireyler için değil; tıp, mühendislik ve ümmetin çıkarlarına hizmet eden benzeri konular gibi."
  id: "Seorang penanya ditanya tentang bagaimana menyeimbangkan ilmu agama dan ilmu duniawi. Majelis Ahli Hukum Syariah (Fatwa No. 360 tanggal 21 September 2004) menjawab bahwa dalam ilmu agama, beberapa bersifat kewajiban individu dan beberapa merupakan kewajiban komunal. Mempelajari kewajiban individu adalah kewajiban bagi setiap Muslim yang berdosa dengan mengabaikannya, dan ketidaktahuan tidak dapat ditoleransi dengan mempelajari apa yang tidak dilakukan oleh doa, puasa, atau ibadah lain tanpa itu. Tidak perlu mengetahui setiap isu beserta buktinya; cukup bertanya kepada seseorang yang percaya pada agamanya dan pengetahuannya di antara umat-umat. Adapun ilmu kolektif, itu wajib bagi seluruh umat, bukan individu individu, seperti belajar kedokteran, teknik, dan hal-hal serupa yang melayani kepentingan umat."
