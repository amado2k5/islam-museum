id: work/fatwa-amja-religious-worldly-sciences
class: work
kind: fatwa
label: { ar: "علوم الدين وعلوم الدنيا", en: "Balancing the sciences of religion and of the world", ur: "دینی اور دنیاوی علوم کا توازن" }
summary:
  ar: "سأل سائل عن كيفية الموازنة بين علوم الدين وعلوم الدنيا. أجاب مجمع فقهاء الشريعة ⁦(فتوى رقم 360 بتاريخ 21 سبتمبر 2004)⁩ أن في علوم الدين ما هو فرض عين ومنها ما هو فرض كفاية فتعلم فروض العين متحتم على كل مسلم يأثم بتركه ولا يسعه جهله كتعلم ما لا تصح صلاته ولا صومه ولا سائر عباداته إلا به وليس بالضرورة أن يعلم كل مسألة بدليلها وإنما يكفيه سؤال من يثق في دينه وعلمه من أهل الفتوى، وأما علوم الكفاية فتجب على مجموع الأمة لا على آحادها فردًا فردًا كتعلم الطب والهندسة ونحوها مما تقوم به مصالح الأمة."
  en: "A questioner asked how to balance the sciences of religion and of the world. The Assembly of Muslim Jurists (fatwa no. 360, 21 September 2004) answered that among religion's sciences some are individually obligatory — learning them binding on every Muslim, sinful to leave, none excused for ignoring, like what one's prayer, fast and other worship cannot stand on; he need not know each question with its proof — asking a fatwa-authority he trusts in religion and learning suffices for worship on insight; the communally obligatory sciences fall on the ummah as a whole, not each person — medicine, engineering and the like serving its interests."
  ur: "ایک سائل نے دینی و دنیاوی علوم کا توازن پوچھا۔ مجمع فقہاء ⁦(فتویٰ 360، 21 ستمبر 2004)⁩ کے مطابق فرض عین علم ہر مسلمان پر لازم ہے اور فرض کفایہ مجموعی امت پر — جیسے طب و انجینئرنگ۔"
