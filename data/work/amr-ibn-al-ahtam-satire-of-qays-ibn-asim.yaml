summary:
  ar: "بيتان من هجاء عمرو بن الأهتم لقيس بن عاصم حين بلغه أن قيساً حقّره عند النبي: شتمه عند الرسول فلم يَصدق ولم يُصب، وسؤدد منقر واسع وسؤدد قيس ضيق. ترك ابن هشام بيتاً ثالثاً لأن الشاعر أقذع فيه."
  en: "Two verses in which Amr ibn al-Ahtam lampooned Qays ibn Asim after learning that Qays had belittled him before the Prophet: Qays insulted him before the Messenger and was neither truthful nor right; Amr's lordship is wide, Qays's is cramped. Ibn Hisham omitted a third verse as obscene."
