label: { ar: "هجاء عمرو بن الأهتم لقيس بن عاصم «ظلت مفترش الهلباء تشتمني»", en: "Amr ibn al-Ahtam's satire of Qays ibn Asim", es: "La sátira de Amr ibn al-Ahtam sobre Qays ibn Asim", fr: "La satire d'Amr ibn al-Ahtam sur Qays ibn Asim", ur: "عمرو بن الاحتم کا قیس بن عاصم کا طنز" }
summary:
  ar: "بيتان من هجاء عمرو بن الأهتم لقيس بن عاصم حين بلغه أن قيساً حقّره عند النبي: شتمه عند الرسول فلم يَصدق ولم يُصب، وسؤدد منقر واسع وسؤدد قيس ضيق. ترك ابن هشام بيتاً ثالثاً لأن الشاعر أقذع فيه."
  en: "Two verses in which Amr ibn al-Ahtam lampooned Qays ibn Asim after learning that Qays had belittled him before the Prophet: Qays insulted him before the Messenger and was neither truthful nor right; Amr's lordship is wide, Qays's is cramped. Ibn Hisham omitted a third verse as obscene."
  es: "Dos versículos en los que Amr ibn al-Ahtam ridiculizó a Qays ibn Asim tras enterarse de que este lo había menospreciado ante el Profeta: «Qays lo insultó ante el Mensajero y no fue ni veraz ni justo; el dominio de Amr es amplio, el de Qays es estrecho». Ibn Hisham omitió un tercer versículo por considerarlo obsceno."
  fr: "Deux versets où Amr ibn al-Ahtam raille Qays ibn Asim après avoir appris que ce dernier l'avait dénigré devant le Prophète: « Qays l'a insulté devant le Messager et n'a dit ni vérité ni raison; l'autorité d'Amr est grande, celle de Qays est étroite. » Ibn Hisham a omis un troisième verset, le jugeant obscène."
  ur: "دو آیات جن میں عمرو بن الاحتم نے قیس بن عاصم کو یہ معلوم ہونے کے بعد کہ قیس نے نبی کے سامنے ان کی توہین کی تھی: قیس نے رسول اللہ کے سامنے ان کی توہین کی تھی اور وہ نہ تو سچا تھا اور نہ ہی صحیح۔ عمرو کی سلطنت وسیع ہے، قیس کی تنگی ہے۔ ابن ہشام نے تیسری آیت کو فحش کہہ کر چھوڑ دیا۔"
