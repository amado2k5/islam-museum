id: work/fatwa-dar-alifta-eg-breaking-fast-for-choking
class: work
kind: fatwa
label: { ar: "حكم إفطار الصائم بسبب شرقة النفس", en: "Breaking the fast because of a choking fit", ur: "روزہ دار کا سانس رکنے پر روزہ توڑنا", es: "Romper el ayuno debido a un ataque de asfixia", fr: "Interruption du jeûne suite à une crise d'étouffement" }
summary:
  ar: "سائل احتبس نفسه بغصة فسأل عن جواز الفطر بتناول دواء أو شرب ماء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21776)⁩ أنه يجوز للصائم الفطر بأن يتناول دواء أو يشرب ماء إذا احتبس نفسه بغصة وكان هذا هو الحل المتاح ولم يكن هناك مندوحة على ما فصّل الجواب."
  en: "A man whose breath was caught in a choking fit asked whether he may break his fast by taking medicine or drinking water. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21776) answered that a faster may break the fast with medicine or water when his breath is obstructed and that is the only available remedy — as the answer details."
  ur: "ایک شخص کی سانس گھٹنے کی وجہ سے رک گئی؛ اس نے دوا لینے یا پانی پینے کے لیے روزہ توڑنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21776)⁩ نے جواب دیا کہ اگر سانس رک جائے اور یہی واحد تدارک ہو تو روزہ توڑنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre que sufría de dificultad para respirar preguntó si podía romper el ayuno tomando medicamentos o bebiendo agua. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21776) respondió que quien ayuna puede romper el ayuno con medicamentos o agua cuando tiene dificultad para respirar, y que ese es el único remedio disponible, como se detalla en la respuesta."
  fr: "Un homme, pris d'une crise d'étouffement, a demandé s'il pouvait rompre son jeûne en prenant des médicaments ou en buvant de l'eau. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21776) a répondu qu'en cas d'obstruction respiratoire, un jeûneur pouvait rompre son jeûne avec des médicaments ou de l'eau, car il s'agissait du seul remède disponible, comme le précise la réponse."
