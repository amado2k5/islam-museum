label: { ar: "بيان مذاهب العلماء في أركان الصيام", en: "The scholars' schools on the pillars of fasting", ur: "روزے کے ارکان میں علماء کے مذاہب", es: "Las escuelas de los eruditos sobre los pilares del ayuno", fr: "Les écoles de savants sur les piliers du jeûne" }
summary:
  ar: "سائل سأل عن مذاهب العلماء في أركان الصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21032)⁩ أن الفقهاء متفقون على أن الإمساك عن المفطرات ركن من أركان الصوم وزاد المالكية والشافعية والحنابلة النية على ما فصّل الجواب."
  en: "A questioner asked about the scholars' schools on the pillars of fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21032) answered that the jurists agree abstention from the breakers is a pillar; the Malikis, Shafi'is and Hanbalis add the intention — as the answer details."
  ur: "ایک سائل نے روزے کے ارکان میں علماء کے مذاہب پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21032)⁩ نے جواب دیا کہ فقہاء متفق ہیں کہ مفطرات سے پرہیز رکن ہے؛ مالکی شافعی اور حنبلی نیت بھی شامل کرتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó acerca de las escuelas de pensamiento sobre los pilares del ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21032) respondió que los juristas coinciden en que la abstención de los alimentos que rompen el ayuno es un pilar; los malikíes, shafiíes y hanbalíes añaden la intención, como se detalla en la respuesta."
  fr: "Un internaute a interrogé Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21032) sur les points de vue des écoles savantes concernant les piliers du jeûne. Il a été répondu que les juristes s'accordent à dire que l'abstention des aliments interdits est un pilier; les écoles malikite, chaféite et hanbalite y ajoutent l'intention, comme le précise la réponse."
