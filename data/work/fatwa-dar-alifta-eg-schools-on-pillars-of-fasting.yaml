summary:
  ar: "سائل سأل عن مذاهب العلماء في أركان الصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21032)⁩ أن الفقهاء متفقون على أن الإمساك عن المفطرات ركن من أركان الصوم وزاد المالكية والشافعية والحنابلة النية على ما فصّل الجواب."
  en: "A questioner asked about the scholars' schools on the pillars of fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21032) answered that the jurists agree abstention from the breakers is a pillar; the Malikis, Shafi'is and Hanbalis add the intention — as the answer details."
  ur: "ایک سائل نے روزے کے ارکان میں علماء کے مذاہب پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21032)⁩ نے جواب دیا کہ فقہاء متفق ہیں کہ مفطرات سے پرہیز رکن ہے؛ مالکی شافعی اور حنبلی نیت بھی شامل کرتے ہیں — جیسا کہ جواب میں تفصیل ہے۔"
