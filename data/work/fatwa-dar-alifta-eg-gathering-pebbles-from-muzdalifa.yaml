summary:
  ar: "سائل سأل عن جمع الحصيات من مزدلفة لرمي الجمرات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20772)⁩ ببيان حكم جمعها من مزدلفة على وجهه مع بيان معنى الجمرات الثلاث."
  en: "A questioner asked about gathering the pebbles from Muzdalifa for the stoning of the jamarat. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20772) answered by setting out the ruling, together with what is meant by the three jamarat."
  ur: "ایک سائل نے جمرات کی رمی کے لیے مزدلفہ سے کنکریاں اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20772)⁩ نے جواب میں اس کا حکم اور تین جمرات کا مفہوم بیان کیا۔"
