label: { ar: "حكم إعطاء الأجرة دون التلفظ بالصيغة", en: "Paying rent without pronouncing the contract formula", ur: "صیغہ پڑھے بغیر کرایہ دینا" }
summary:
  ar: "سائل سأل عن إعطاء الأجرة دون التلفظ بصيغة الإجارة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22020)⁩ أن الإجارة الحاصلة في هذه الصورة تعد إجارة صحيحة شرعًا وهي من قبيل الإجارة بالمعاطاة ولا حرج عليه على ما فصّل الجواب."
  en: "A questioner asked about paying a rent without pronouncing the lease formula. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22020) answered that the lease arising in this form counts as a valid contract in the sharia — a lease by conduct (mu'atah) — and no blame attaches, as the answer details."
  ur: "ایک سائل نے عقدِ اجارہ کا صیغہ پڑھے بغیر کرایہ دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22020)⁩ نے جواب دیا کہ اس صورت میں ہونے والا اجارہ شرعاً صحیح عقد ہے — معاطاہ (عملی تبادلہ) کے ذریعے اجارہ — اور اس میں کوئی حرج نہیں، جیسا کہ جواب میں تفصیل ہے۔"
