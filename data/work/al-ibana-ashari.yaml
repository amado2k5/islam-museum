structure: "خطبة المؤلف (ص 4)؛ باب في إبانة قول أهل الزيغ والبدعة (ص 7)؛ باب في إبانة قول أهل الحق والسنة (ص 8)؛ رؤية الله بالأبصار في الآخرة (ص 13–19)؛ القرآن كلام الله غير مخلوق والرد على الجهمية والواقفة (ص 20–33)؛ الاستواء على العرش (ص 33)؛ الوجه والعينان والبصر واليدان (ص 37)؛ العلم والقدرة والصفات (ص 41)؛ الإرادة (ص 46)؛ تقدير أعمال العباد والاستطاعة ومسائل التكليف وإيلام الأطفال والآجال والأرزاق والهدى والضلال (ص 52–64)؛ الروايات في القدر (ص 65)؛ الشفاعة والخروج من النار (ص 69)؛ الحوض وعذاب القبر (ص 70)؛ إمامة أبي بكر والخلفاء (ص 71–74)؛ الفهرس (ص 75–76). الصفحات من نشرة دار ابن زيدون."
