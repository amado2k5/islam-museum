label: { ar: "الإبانة عن أصول الديانة", en: "Al-Ibana 'an Usul al-Diyana (al-Ash'ari)", ur: "الابانہ عن اصول الدیانہ (اشعری)" }
summary:
  ar: "كتاب أبي الحسن الأشعري في أصول الاعتقاد، يبدأ ببيان قول من يسميهم أهل الزيغ والبدعة ثم قول أهل الحق والسنة، وفيه يقول إن قوله التمسك بالكتاب والسنة وما روي عن الصحابة والتابعين وأئمة الحديث، وبما كان يقول به أحمد بن حنبل؛ ثم أبواب في رؤية الله بالأبصار في الآخرة، وأن القرآن كلام الله غير مخلوق، والاستواء على العرش، والوجه والعينين واليدين، والعلم والقدرة، والإرادة، والقدر والاستطاعة، والشفاعة والحوض وعذاب القبر، وإمامة الخلفاء الأربعة {cite:al-ibana-ashari-dar-ibn-zaydun p. 7-9} {cite:al-ibana-ashari-dar-ibn-zaydun p. 75-76}."
  en: "Abu al-Hasan al-Ash'ari's book on the foundations of creed. It opens by setting out the view of those he calls the people of deviation and innovation, then the view of the people of truth and the Sunna, in which he says his position is to hold to the Book, the Sunna and what is reported from the Companions, the Successors and the imams of hadith, and to what Ahmad ibn Hanbal held. Chapters follow on the vision of God with the eyes in the hereafter, the Qur'an as God's uncreated speech, the rising over the Throne, the Face, Eyes and Hands, knowledge and power, will, decree and capacity, intercession, the Basin and the punishment of the grave, and the imamate of the four caliphs {cite:al-ibana-ashari-dar-ibn-zaydun p. 7-9} {cite:al-ibana-ashari-dar-ibn-zaydun p. 75-76}."
  ur: "ابو الحسن اشعری کی عقیدے کے اصولوں پر کتاب۔ یہ پہلے ان لوگوں کا قول بیان کرتی ہے جنہیں وہ اہلِ زیغ و بدعت کہتے ہیں، پھر اہلِ حق و سنت کا قول، جس میں وہ کہتے ہیں کہ ان کا قول کتاب و سنت اور صحابہ، تابعین اور ائمۂ حدیث سے مروی باتوں کو تھامنا ہے، اور اس کو جس کے احمد بن حنبل قائل تھے۔ پھر ابواب ہیں: آخرت میں آنکھوں سے رؤیتِ باری، قرآن کا اللہ کا غیر مخلوق کلام ہونا، عرش پر استوا، وجہ، آنکھیں اور ہاتھ، علم اور قدرت، ارادہ، تقدیر اور استطاعت، شفاعت، حوض اور عذابِ قبر، اور چاروں خلفا کی امامت {cite:al-ibana-ashari-dar-ibn-zaydun p. 7-9} {cite:al-ibana-ashari-dar-ibn-zaydun p. 75-76}۔"
