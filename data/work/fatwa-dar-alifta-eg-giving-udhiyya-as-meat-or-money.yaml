id: work/fatwa-dar-alifta-eg-giving-udhiyya-as-meat-or-money
class: work
kind: fatwa
label: { ar: "حكم إخراج الأضحية في صورة لحم أو مال للفقراء", en: "Giving the udhiyya as meat or money to the poor", ur: "قربانی گوشت یا پیسے کی صورت میں غریبوں کو دینا" }
summary:
  ar: "سائل سأل عن إخراج الأضحية في صورة لحم مشترى أو مال للفقراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20703)⁩ أن ما يجزئ في شعيرة الأضحية أن تكون من بهيمة الأنعام الإبل والبقر والغنم ولا يجزئ شراء اللحم وغيره على ما فصّل الجواب."
  en: "A questioner asked about giving the udhiyya as bought meat or money to the poor. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20703) answered that what suffices in the rite is a beast of the an'am — camels, cattle, sheep — and buying meat or otherwise does not suffice, as the answer details."
  ur: "ایک سائل نے قربانی کو خریدا ہوا گوشت یا پیسہ غریبوں کو دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20703)⁩ نے جواب دیا کہ قربانی صرف انعام سے ہوتی ہے — اونٹ گائے بھیڑ — اور گوشت خریدنا کافی نہیں — جیسا کہ جواب میں تفصیل ہے۔"
