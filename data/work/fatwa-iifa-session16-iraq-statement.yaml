label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 16)⁩ بشأن العراق ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(16th session)⁩ on Iraq ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(سولہویں مجلس)⁩: عراق ⁦(بیان، قرارداد نہیں)⁩", es: "Declaración de la IIFA (16.ª sesión) sobre Irak (declaración, no resolución)", fr: "Déclaration de l'IIFA (16e session) sur l'Irak (déclaration, et non une résolution)" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(9–14 أبريل 2005م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. يتناول البيان بلسان المجمع الأوضاع في العراق في ذلك الوقت — الاحتلال وتداعياته على الشعب العراقي ووحدة البلد وسلمه الأهلي — ويدعو إلى صون وحدة العراق أرضًا وشعبًا وإنهاء معاناة أهله وتمكينهم من تقرير مصيرهم، مع موقف المجمع تجاه العنف الطائفي والتقاتل بين أبناء البلد الواحد. سُجّل بوصفه بيان المجمع، ملخصًا بحياد."
  en: "A statement issued by the International Islamic Fiqh Academy at its 16th session in Dubai (9–14 April 2005), published among the session materials though not a numbered resolution. In the Academy's own voice it addresses the situation in Iraq at that time — the occupation and its consequences for the Iraqi people, the country's unity and civil peace — calling for preserving Iraq's unity of land and people, ending its population's suffering and enabling them to determine their future, together with the Academy's stance on sectarian violence and fighting within the country. Recorded as the Academy's own statement, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، دبئی میں سولہویں مجلس ⁦(9–14 اپریل 2005ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ اکیڈمی کی اپنی زبانی میں یہ اس وقت کے عراق کے حالات — قبضہ اور اس کے اثرات عراقی عوام، ملک کی وحدت اور شہری امن پر — بیان کرتا ہے اور عراق کی زمینی و عوامی وحدت کی حفاظت، اس کے لوگوں کے تکالیف کا خاتمہ اور انھیں اپنے مستقبل کا فیصلہ کرنے دینے کی دعوت دیتا ہے، ساتھ ہی فرقہ وارانہ تشدد اور باہمی لڑائی پر اکیڈمی کا موقف۔ یہاں اکیڈمی کے اپنے بیان کا غیر جانبدارانہ خلاصہ درج ہے۔"
  es: "Declaración emitida por la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión celebrada en Dubái (del 9 al 14 de abril de 2005), publicada entre los documentos de la sesión, aunque no como resolución numerada. En ella, la Academia aborda la situación en Irak en aquel momento: la ocupación y sus consecuencias para el pueblo iraquí, la unidad del país y la paz civil. La Academia aboga por preservar la unidad territorial y popular de Irak, poner fin al sufrimiento de su población y permitirles determinar su futuro, además de expresar su postura sobre la violencia sectaria y los enfrentamientos internos. Esta declaración se recoge como declaración oficial de la Academia y se resume de forma neutral."
  fr: "Déclaration de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 16e session à Dubaï (9-14 avril 2005), publiée dans les documents de la session sans toutefois constituer une résolution numérotée. L'Académie y aborde la situation en Irak à cette époque – l'occupation et ses conséquences pour le peuple irakien, l'unité du pays et la paix civile – et appelle à préserver l'unité nationale et humaine de l'Irak, à mettre fin aux souffrances de sa population et à lui permettre de décider de son avenir. Elle y expose également la position de l'Académie sur les violences et les combats sectaires internes. Ce texte est présenté comme la déclaration officielle de l'Académie, résumée de manière neutre."
