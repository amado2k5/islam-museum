label: { ar: "الأوصاف المطلوب شرعًا توافرها في المؤذن", en: "The qualities legally required in the muezzin", ur: "مؤذن میں شرعاً مطلوب صفات", es: "Las cualidades legalmente requeridas para el muecín", fr: "Les qualités légalement requises chez le muezzin", tr: "İslam hukukunun müezzinde gerektirdiği tanımlar", id: "Deskripsi yang diwajibkan oleh hukum Islam dalam muezzin" }
summary:
  ar: "سائل سأل عن الأوصاف المطلوب شرعًا توافرها في المؤذن لجماعة المسلمين في المسجد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21620)⁩ بأنه يكون ذكرًا مسلمًا عاقلًا عالمًا بأوقات الصلاة على ما فصّل الجواب من بقية الأوصاف."
  en: "A questioner asked the qualities legally required in the muezzin of a Muslim congregation's mosque. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21620) answered that he be a sane Muslim man who knows the prayer times — with the rest of the qualities the answer sets out."
  ur: "ایک سائل نے مسجد کی جماعت کے مؤذن میں شرعاً مطلوب صفات پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21620)⁩ نے جواب دیا کہ وہ عاقل مسلمان مرد ہو جو نماز کے اوقات جانتا ہو — اور جواب میں باقی صفات بیان ہوئیں۔"
  es: "Un consultante preguntó cuáles eran las cualidades legalmente requeridas para el muecín de la mezquita de una congregación musulmana. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21620) respondió que debía ser un musulmán cuerdo que conociera los horarios de oración, además de cumplir con el resto de las cualidades que se detallan en la respuesta."
  fr: "Un internaute a demandé quelles étaient les qualités requises légalement pour officier comme muezzin dans une mosquée. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21620) a répondu qu'il devait s'agir d'un musulman sain d'esprit connaissant les heures de prière, les autres qualités étant précisées dans la fatwa."
  tr: "Bir soru soran kişi, camide Müslüman topluluğun müezzininin yasal olarak hangi nitelikleri yerine getirmesi gerektiğini sordu. Mısırlı Dar al-Ifta (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21620), nama zamanları hakkında bilgili, aklı başında bir Müslüman erkek olması gerektiğini söyledi; bu, diğer açıklamalardaki cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang penanya menanyakan tentang kualitas yang secara hukum harus dipenuhi oleh muezzin komunitas Muslim di masjid. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21620) menjawab bahwa dia harus seorang pria Muslim yang waras dan memahami waktu shalat, seperti yang dijelaskan dalam jawaban dari deskripsi lainnya."
