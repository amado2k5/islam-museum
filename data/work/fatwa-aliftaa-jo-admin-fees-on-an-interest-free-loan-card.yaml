id: work/fatwa-aliftaa-jo-admin-fees-on-an-interest-free-loan-card
class: work
kind: fatwa
label: { ar: "الرسوم الإدارية على بطاقة القرض الحسن", en: "Administrative fees on an interest-free loan card", ur: "قرضِ حسنہ کارڈ پر انتظامی فیس" }
summary:
  ar: "سؤال عن الرسوم الإدارية على بطاقة القرض الحسن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في تحميل المقترض رسومًا إدارية تساوي التكلفة الفعلية دون زيادة ربحية، على أن تفصل في حساب مستقل ويصرف فائضها في وجوه التكافل والخير. أجابت الدائرة بأنه لا حرج في تحميل المقترض الرسوم الإدارية على القرض بشرط أن تساوي التكلفة الحقيقية لخدمة القرض دون أدنى زيادة ربحية للمقرض، ونقلت قرار مجمع الفقه الإسلامي رقم 13 (1/3) بجواز أخذ أجور عن خدمات القروض في حدود النفقات الفعلية، وأن كل زيادة عليها من الربا المحرم. وقالت إن العمولة والربح اللذين يأخذهما المقرض أو الكفيل من الربا وأكل أموال الناس بالباطل. وذكرت أن الأصل فصل الرسوم الإدارية في حساب مستقل، فإن تبين أنها فاضت عن التكلفة الفعلية صرفت الزيادة في وجوه التكافل والخير بحيث لا يعود منها نفع على الصندوق، ولا حرج في تخصيصها للتكافل بين الموظفين."
  en: "A question about administrative fees on an interest-free loan card, in which Jordan's General Iftaa Department answered that a borrower may be charged administrative fees equal to the actual cost without any profit margin, provided they are kept in a separate account and any surplus goes to mutual-help and charitable purposes. The Department answered that there is no objection to charging the borrower the administrative fees on the loan, provided they equal the real cost of servicing it without the slightest profit for the lender, quoting resolution no. 13 (1/3) of the Islamic Fiqh Academy that fees for loan services may be taken within actual expenses and that anything above them is forbidden riba. It said that a commission or profit taken by the lender or guarantor counts as riba and as consuming people's wealth unlawfully. It said the fees should in principle be kept in a separate account, and if they turn out to exceed the actual cost, the excess is spent on mutual-help and charitable purposes so that no benefit returns to the fund; allocating it to mutual help among employees is permissible."
  ur: "قرضِ حسنہ کارڈ پر انتظامی فیس کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض لینے والے سے حقیقی لاگت کے برابر انتظامی فیس لی جا سکتی ہے بغیر کسی منافع کے، بشرطیکہ اسے الگ کھاتے میں رکھا جائے اور زائد رقم تکافل اور خیر کے کاموں میں خرچ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض لینے والے پر قرض کی انتظامی فیس ڈالنے میں حرج نہیں، بشرطیکہ وہ قرض کی خدمت کی حقیقی لاگت کے برابر ہو اور قرض دینے والے کے لیے ذرا سا بھی منافع نہ ہو، اور اسلامی فقہ اکیڈمی کی قرارداد نمبر 13 (1/3) نقل کی کہ قرض کی خدمات پر حقیقی اخراجات کی حد تک اجرت لینا جائز ہے اور اس سے زیادہ ہر اضافہ حرام سود ہے۔ اس نے کہا کہ قرض دینے والے یا ضامن کا لیا ہوا کمیشن یا منافع سود اور لوگوں کا مال ناحق کھانے میں شمار ہوتا ہے۔ اس نے کہا کہ اصل یہ ہے کہ انتظامی فیس الگ کھاتے میں رکھی جائے، اور اگر وہ حقیقی لاگت سے زیادہ نکلے تو زائد رقم تکافل اور خیر کے کاموں میں خرچ ہو تاکہ اس کا کوئی فائدہ فنڈ کو نہ پہنچے؛ اسے ملازمین کے باہمی تکافل کے لیے مختص کرنا جائز ہے۔"
