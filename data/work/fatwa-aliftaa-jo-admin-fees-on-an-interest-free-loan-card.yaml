label: { ar: "الرسوم الإدارية على بطاقة القرض الحسن", en: "Administrative fees on an interest-free loan card", ur: "قرضِ حسنہ کارڈ پر انتظامی فیس", es: "Gastos administrativos en una tarjeta de crédito sin intereses", fr: "Frais administratifs sur une carte de prêt sans intérêt", tr: "Qard Al-Hasan kartındaki idari ücretler", id: "Biaya administrasi pada kartu Qard Al-Hasan" }
summary:
  ar: "سؤال عن الرسوم الإدارية على بطاقة القرض الحسن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج في تحميل المقترض رسومًا إدارية تساوي التكلفة الفعلية دون زيادة ربحية، على أن تفصل في حساب مستقل ويصرف فائضها في وجوه التكافل والخير. أجابت الدائرة بأنه لا حرج في تحميل المقترض الرسوم الإدارية على القرض بشرط أن تساوي التكلفة الحقيقية لخدمة القرض دون أدنى زيادة ربحية للمقرض، ونقلت قرار مجمع الفقه الإسلامي رقم 13 (1/3) بجواز أخذ أجور عن خدمات القروض في حدود النفقات الفعلية، وأن كل زيادة عليها من الربا المحرم. وقالت إن العمولة والربح اللذين يأخذهما المقرض أو الكفيل من الربا وأكل أموال الناس بالباطل. وذكرت أن الأصل فصل الرسوم الإدارية في حساب مستقل، فإن تبين أنها فاضت عن التكلفة الفعلية صرفت الزيادة في وجوه التكافل والخير بحيث لا يعود منها نفع على الصندوق، ولا حرج في تخصيصها للتكافل بين الموظفين."
  en: "A question about administrative fees on an interest-free loan card, in which Jordan's General Iftaa Department answered that a borrower may be charged administrative fees equal to the actual cost without any profit margin, provided they are kept in a separate account and any surplus goes to mutual-help and charitable purposes. The Department answered that there is no objection to charging the borrower the administrative fees on the loan, provided they equal the real cost of servicing it without the slightest profit for the lender, quoting resolution no. 13 (1/3) of the Islamic Fiqh Academy that fees for loan services may be taken within actual expenses and that anything above them is forbidden riba. It said that a commission or profit taken by the lender or guarantor counts as riba and as consuming people's wealth unlawfully. It said the fees should in principle be kept in a separate account, and if they turn out to exceed the actual cost, the excess is spent on mutual-help and charitable purposes so that no benefit returns to the fund; allocating it to mutual help among employees is permissible."
  ur: "قرضِ حسنہ کارڈ پر انتظامی فیس کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض لینے والے سے حقیقی لاگت کے برابر انتظامی فیس لی جا سکتی ہے بغیر کسی منافع کے، بشرطیکہ اسے الگ کھاتے میں رکھا جائے اور زائد رقم تکافل اور خیر کے کاموں میں خرچ ہو۔ ڈیپارٹمنٹ نے جواب دیا کہ قرض لینے والے پر قرض کی انتظامی فیس ڈالنے میں حرج نہیں، بشرطیکہ وہ قرض کی خدمت کی حقیقی لاگت کے برابر ہو اور قرض دینے والے کے لیے ذرا سا بھی منافع نہ ہو، اور اسلامی فقہ اکیڈمی کی قرارداد نمبر 13 (1/3) نقل کی کہ قرض کی خدمات پر حقیقی اخراجات کی حد تک اجرت لینا جائز ہے اور اس سے زیادہ ہر اضافہ حرام سود ہے۔ اس نے کہا کہ قرض دینے والے یا ضامن کا لیا ہوا کمیشن یا منافع سود اور لوگوں کا مال ناحق کھانے میں شمار ہوتا ہے۔ اس نے کہا کہ اصل یہ ہے کہ انتظامی فیس الگ کھاتے میں رکھی جائے، اور اگر وہ حقیقی لاگت سے زیادہ نکلے تو زائد رقم تکافل اور خیر کے کاموں میں خرچ ہو تاکہ اس کا کوئی فائدہ فنڈ کو نہ پہنچے؛ اسے ملازمین کے باہمی تکافل کے لیے مختص کرنا جائز ہے۔"
  es: "Una pregunta sobre las comisiones administrativas de una tarjeta de crédito sin intereses, a la que el Departamento General de Iftaa de Jordania respondió que se pueden cobrar al prestatario comisiones administrativas equivalentes al costo real sin margen de beneficio, siempre que se mantengan en una cuenta separada y cualquier excedente se destine a ayuda mutua y fines benéficos. El Departamento respondió que no hay objeción a cobrar al prestatario las comisiones administrativas del préstamo, siempre que equivalgan al costo real de su administración sin el menor beneficio para el prestamista, citando la resolución n.° 13 (1/3) de la Academia Islámica de Fiqh, que establece que las comisiones por servicios de préstamo pueden cobrarse dentro de los gastos reales y que cualquier cantidad que las supere constituye riba prohibida. Afirmó que una comisión o beneficio obtenido por el prestamista o garante se considera riba y un consumo ilícito del patrimonio de las personas. Indicó que, en principio, las comisiones deben mantenerse en una cuenta separada y, si resultan exceder el costo real, el excedente se destina a ayuda mutua y fines benéficos para que no haya ningún beneficio para el fondo; su asignación a la ayuda mutua entre los empleados es permisible."
  fr: "Concernant les frais administratifs d'une carte de crédit sans intérêt, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que l'emprunteur peut se voir facturer des frais administratifs correspondant au coût réel, sans marge bénéficiaire, à condition qu'ils soient déposés sur un compte séparé et que tout excédent soit affecté à l'entraide et à des œuvres caritatives. Le Département a précisé qu'il n'y a pas d'objection à facturer à l'emprunteur les frais administratifs du prêt, pourvu qu'ils couvrent le coût réel de sa gestion, sans le moindre profit pour le prêteur. Il a cité la résolution n° 13 (1/3) de l'Académie de jurisprudence islamique (Fiqh), selon laquelle les frais de service de prêt peuvent être limités aux dépenses réelles et que tout montant supérieur constitue un riba (usure) interdit. Le Département a ajouté qu'une commission ou un profit perçu par le prêteur ou le garant est considéré comme du riba et comme une consommation illicite des biens d'autrui. Il a indiqué que les frais doivent en principe être déposés sur un compte séparé et que, s'ils excèdent le coût réel, l'excédent doit être consacré à l'entraide et à des œuvres caritatives afin qu'aucun bénéfice ne soit reversé au fonds. L'affectation de cet excédent à l'entraide entre employés est autorisée."
  tr: "Qard al-Hasan kartındaki idari ücretlerle ilgili bir soruda, Ürdün Genel Fetva Müdürlüğü, fazla hesabın ayrı bir hesapta kapatılması ve fazlanın dayanışma ve iyilik biçimlerinde harcanması koşuluyla borçludan gerçek maliyete eşit idari ücretlerin alınmasının zarar görmediğini, kâr artışı olmadan borçluya uygulanmasında zarar olmadığını yanıtladı. Bakanlık, kredi hizmet maliyetinin kredi verenin asgari kâr artışına eşit olması koşuluyla borçludan idari ücretlerin alınmasının zararı olmadığını ve İslami Fiqh Akademisi No. 13 (1/3) kararına atıfta bulunarak kredi hizmetleri için ücret alınmasına fiili giderler sınırları içinde izin verdiğini ve bu hizmetlerde yapılan herhangi bir artışın yasak tefecilik olarak kabul edildiğini belirtti. Komisyon veya kefil veren tarafından tefecilik ve insanların parasının yasadışı tüketiminden elde edilen komisyon ve kârın belirtildiği belirtildi Orijinal kuralın idari ücretlerin ayrı bir hesaba ayrılması olduğunu belirtti; eğer bu ücretler gerçek maliyeti aşarsa, artış dayanışma ve hayır biçimlerine harcanır, böylece fonun yararına olmaz ve çalışanlar arasında karşılıklı destek için tahsis edilmesinin zararı yoktur."
  id: "Sebuah pertanyaan tentang biaya administrasi pada kartu Qard al-Hasan, di mana Departemen Fatwa Umum Yordania menjawab bahwa tidak ada salahnya membebankan peminjam biaya administrasi yang sama dengan biaya aktual tanpa peningkatan keuntungan, asalkan surplus diselesaikan di rekening terpisah dan surplus digunakan dalam bentuk solidaritas dan kebaikan. Departemen menjawab bahwa tidak ada salahnya mengenakan biaya administrasi pinjaman kepada peminjam asalkan biaya aktual pembayaran pinjaman sama dengan kenaikan keuntungan minimum pemberi pinjaman, dan mengutip keputusan Akademi Fiqh Islam No. 13 (1/3) yang mengizinkan penarikan biaya untuk layanan pinjaman dalam batas pengeluaran aktual, dan bahwa setiap peningkatan pajak tersebut dianggap sebagai riba yang dilarang. Departemen tersebut menyatakan bahwa komisi dan keuntungan yang diambil oleh pemberi pinjaman atau penjamin dari riba dan konsumsi uang rakyat yang tidak sah Dinyatakan bahwa aturan awal adalah memisahkan biaya administrasi ke dalam rekening terpisah; jika ternyata melebihi biaya sebenarnya, kenaikan tersebut digunakan untuk bentuk solidaritas dan amal sehingga tidak menguntungkan dana, dan tidak ada kerugian mengalokasikannya untuk saling mendukung antar karyawan."
