label: { ar: "هجاء حسان لهذيل «فلا والله ما تدري هذيل»", en: "Hassan's satire of Hudhayl, 'By God, Hudhayl does not know'", es: "La sátira de Hassan sobre Hudhayl, 'Por Dios, Hudhayl no lo sabe'.", fr: "La satire de Hassan sur Hudhayl, « Par Dieu, Hudhayl ne sait pas »", ur: "حسن کا ہذیل کا طنز، 'خدا کی قسم، ہذیل نہیں جانتا'" }
summary:
  ar: "أبيات هجاء لحسان بن ثابت من الوافر على روي الباء، كما في شرح البرقوقي الذي يذكر بحرها في رأسها {{cite:sharh-diwan-hassan-barquqi-1929 p.56}}. الهجاء هنا وصف أدبي من الديوان ولا يتبنى المتحف حكمه."
  en: "Satirical verses by Hassan ibn Thabit in the wafir metre on the rhyme الباء, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.56}}. The satire is reported as a literary text; the museum does not adopt its judgement."
  es: "Versos satíricos de Hassan ibn Thabit en metro wafir con rima الباء, como en el comentario de al-Barquqi, que indica el metro en su encabezado {{cite:sharh-diwan-hassan-barquqi-1929 p.56}}. La sátira se considera un texto literario; el museo no comparte esta valoración."
  fr: "Vers satiriques de Hassan ibn Thabit en mètre wafir sur la rime الباء, comme dans le commentaire d'al-Barquqi, qui mentionne le mètre dans son introduction {{cite:sharh-diwan-hassan-barquqi-1929 p.56}}. La satire est considérée comme un texte littéraire; le musée ne partage pas cette opinion."
  ur: "نظم الباء پر وفیر میٹر میں حسن بن ثابت کی طنزیہ آیات، جیسا کہ البرقی کی تفسیر میں، جس کے عنوان میں میٹر بیان کیا گیا ہے {{حوالہ: شرح دیوان-حسن برقوی-1929 صفحہ 56}}۔ طنز کو ایک ادبی متن کے طور پر رپورٹ کیا جاتا ہے۔ میوزیم اپنے فیصلے کو نہیں اپناتا ہے۔"
