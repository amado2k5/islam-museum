id: work/fatwa-amja-wudu-serves-all-worship
class: work
kind: fatwa
label: { ar: "وضوء واحد لكل العبادات", en: "One wudu serves every purity-bound worship", ur: "ایک وضو سب عبادات کے لیے", es: "Un solo wudu sirve para toda adoración que busque la pureza.", fr: "Un seul wudu suffit pour chaque culte lié à la pureté", tr: "Tüm ibadet eylemleri için bir avdest.", id: "Satu wudhu untuk semua ibadah" }
summary:
  ar: "سألت امرأة إذا توضأت لصلاة الضحى أو لقراءة القرآن واقترب وقت صلاة مكية فهل يكفيها ذلك الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77378 بتاريخ 7 يناير 2009)⁩ أن الوضوء يرفع الحدث الأصغر فإذا توضأت فلها أن تباشر بهذا الوضوء جميع العبادات التي يشترط لها الوضوء ما نويت منها عند الوضوء وما لم تنو على ما فصّل الجواب."
  en: "A woman asked whether wudu done for the duha prayer or Qur'an reading serves when an obligatory prayer's time draws near. Dr. Salah al-Sawi (fatwa no. 77378, 7 January 2009) answered that wudu lifts the lesser hadath; having done it, she may perform by it all worship conditioned on wudu — what she intended at the time and what she did not — as the answer details."
  ur: "ضحیٰ کے لیے وضو — فرض نماز پر بھی کافی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77378، 7 جنوری 2009)⁩ کے مطابق وضو حدث اصغر اٹھاتا ہے — سب عبادات کے لیے کافی۔"
  es: "Una mujer preguntó si la ablución realizada para la oración del Duha o la lectura del Corán es válida cuando se acerca la hora de una oración obligatoria. El Dr. Salah al-Sawi (fatwa n.° 77378, 7 de enero de 2009) respondió que la ablución anula el hadiz menor; habiéndola realizado, puede realizar con ella toda la adoración condicionada a la ablución —tanto la que tenía intención de realizar en ese momento como la que no— como se detalla en la respuesta."
  fr: "Une femme a demandé si les ablutions (wudu) effectuées pour la prière du Duha ou la lecture du Coran étaient valables à l'approche de l'heure d'une prière obligatoire. Le Dr Salah al-Sawi (fatwa n° 77378, 7 janvier 2009) a répondu que les ablutions lèvent l'obligation de prier pour une obligation religieuse mineure (hadath). Une fois accomplies, les ablutions permettent d'accomplir tous les actes d'adoration conditionnés par leur état de pureté rituelle, qu'ils soient intentionnels ou non, comme le précise la réponse."
  tr: "Bir kadına soruldu: Duha için ya da Kur'an okumak için avdestlik yaparsa ve Mekke namaz vakti yaklaşırsa, bu abdest alması için yeterli midir? Dr. Salah Al-Sawi (7 Ocak 2009 tarihli 77378 sayılı Fetva) abdestmenin küçük kirleri kaldırdığını yanıtladı. Eğer abdest alırsa, abdest alma gerektiren tüm ibadet işlemlerini, ister abdest sırasında istediği ister istemediği gibi, cevabında ayrıntılı olarak belirtildiği gibi, gerçekleştirebilir."
  id: "Seorang wanita ditanya: Jika dia melakukan wudhu untuk Dua atau membaca Al-Qur'an dan waktu shalat di Mekah semakin dekat, apakah itu cukup baginya untuk melakukan wudhu? Dr. Salah Al-Sawi menjawab (Fatwa No. 77378 tanggal 7 Januari 2009) bahwa wudhu mengangkat kotoran ringan. Jika dia melakukan wudhu, dia dapat melakukan semua ibadah yang memerlukan wudhu, baik saat saat wudhu maupun tidak berniat, seperti yang dijelaskan dalam jawaban."
