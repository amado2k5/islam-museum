id: work/fatwa-amja-wudu-serves-all-worship
class: work
kind: fatwa
label: { ar: "وضوء واحد لكل العبادات", en: "One wudu serves every purity-bound worship", ur: "ایک وضو سب عبادات کے لیے", es: "Un solo wudu sirve para toda adoración que busque la pureza." }
summary:
  ar: "سألت امرأة إذا توضأت لصلاة الضحى أو لقراءة القرآن واقترب وقت صلاة مكية فهل يكفيها ذلك الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77378 بتاريخ 7 يناير 2009)⁩ أن الوضوء يرفع الحدث الأصغر فإذا توضأت فلها أن تباشر بهذا الوضوء جميع العبادات التي يشترط لها الوضوء ما نويت منها عند الوضوء وما لم تنو على ما فصّل الجواب."
  en: "A woman asked whether wudu done for the duha prayer or Qur'an reading serves when an obligatory prayer's time draws near. Dr. Salah al-Sawi (fatwa no. 77378, 7 January 2009) answered that wudu lifts the lesser hadath; having done it, she may perform by it all worship conditioned on wudu — what she intended at the time and what she did not — as the answer details."
  ur: "ضحیٰ کے لیے وضو — فرض نماز پر بھی کافی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77378، 7 جنوری 2009)⁩ کے مطابق وضو حدث اصغر اٹھاتا ہے — سب عبادات کے لیے کافی۔"
  es: "Una mujer preguntó si la ablución realizada para la oración del Duha o la lectura del Corán es válida cuando se acerca la hora de una oración obligatoria. El Dr. Salah al-Sawi (fatwa n.° 77378, 7 de enero de 2009) respondió que la ablución anula el hadiz menor; habiéndola realizado, puede realizar con ella toda la adoración condicionada a la ablución —tanto la que tenía intención de realizar en ese momento como la que no— como se detalla en la respuesta."
