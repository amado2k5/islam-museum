label:
  ar: "مقتطفات من السيرة ⁦(سلسلة دروس)⁩"
  en: "Muktatafat min al-Sira (lecture series)"
  ur: "مختصرات از سیرت ⁦(لیکچر سلسلہ)⁩"
summary:
  ar: "سلسلة دروس لعمر عبد الكافي يعرض فيها مقتطفات من سيرة النبي محمد: حال العرب قبل الإسلام، وبعثته وهجرته وتأسيس الدولة، والفتوحات، ثم العبر التي تُستخلص منها للمسلمين اليوم — تربية الشباب، وصلاح الدين الأيوبي، وأخلاق الصحابة وأزواج النبي."
  en: "A lesson series by Omar Abdelkafy presenting excerpts from the life of the Prophet Muhammad: the state of the Arabs before Islam, his mission, the hijra and the founding of the Muslim state, the conquests, and then the lessons drawn for Muslims today — raising the youth, Salah al-Din al-Ayyubi, and the character of the Companions and the Prophet's wives."
  ur: "عمر عبد الکافی کا درسی سلسلہ جس میں وہ نبی محمد کی سیرت کے منتخب واقعات پیش کرتے ہیں: اسلام سے پہلے عربوں کی حالت، ان کی بعثت، ہجرت اور ریاستِ مسلمہ کا قیام، فتوحات، اور پھر آج کی امت کے لیے ان سے نکلنے والے سبق — نوجوانوں کی تربیت، صلاح الدین ایوبی، اور صحابہ و ازواج کے اخلاق۔"
