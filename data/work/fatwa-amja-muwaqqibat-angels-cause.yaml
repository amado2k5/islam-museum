id: work/fatwa-amja-muwaqqibat-angels-cause
class: work
kind: fatwa
label: { ar: "المعقبات من بين يديه ومن خلفه", en: "The successive guardians before and behind — causes in creation", ur: "آگے اور پیچھے کے محافظ فرشتے — اسباب", es: "Los sucesivos guardianes, antes y después: causas en la creación.", fr: "Les gardiens successifs, avant et après — causes de la création" }
summary:
  ar: "سأل سائل عن معنى قوله تعالى له معقبات من بين يديه ومن خلفه يحفظونه من أمر الله في رواية ابن عباس والمعقبات من الله الملائكة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86502 بتاريخ 1 مارس 2012)⁩ أن معنى الحديث بسلاسة ويسر أن الله قدر في الكون أسبابًا وجعل لكل شيء سببًا فجعل من أسباب الحفظ المعقبات كما جعل من أسباب النصر المؤمنين يوم بدر الملائكة ولو شاء لنصرهم بنفسه بغير ملائكة وأسباب، وكما أمر مريم أن تهز إليها بجذع النخلة وقد كان قادرًا على إيصال رزقه إليها بلا أسباب."
  en: "A questioner asked the meaning of 'he has successive guards before him and behind him who guard him by God's command' with Ibn Abbas's report that they are angels. Dr. Salah al-Sawi (fatwa no. 86502, 1 March 2012) answered that the sense, simply, is that God decreed causes in creation and set a cause to everything — making the successive guardians a cause of protection, as He made the believers' angels a cause of victory at Badr, though He could have granted victory Himself with neither angels nor causes, and as He bade Maryam shake the palm trunk though able to bring His provision without causes."
  ur: "ایک سائل نے «معقبات» آیت کی تفسیر پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86502، 1 مارچ 2012)⁩ کے مطابق اللہ نے کائنات میں اسباب مقرر کیے — معقبات حفاظت کا سبب ہیں جیسے بدر میں فرشتے نصرت کا سبب تھے۔"
  es: "Un consultante preguntó por el significado de «tiene guardianes sucesivos delante y detrás de él que lo protegen por mandato de Dios», basándose en el relato de Ibn Abbas de que se trata de ángeles. El Dr. Salah al-Sawi (fatwa n.º 86502, 1 de marzo de 2012) respondió que, sencillamente, el sentido es que Dios decretó causas en la creación y estableció una causa para todo, haciendo de los guardianes sucesivos una causa de protección, así como hizo de los ángeles de los creyentes una causa de victoria en Badr, aunque Él mismo podría haber concedido la victoria sin ángeles ni causas, y como le ordenó a María que sacudiera el tronco de la palma, aunque podía traer su provisión sin causas."
  fr: "Un interrogateur a demandé la signification de l'expression « il a des gardes successifs devant et derrière lui qui le protègent par ordre de Dieu », en se référant au récit d'Ibn Abbas selon lequel il s'agit d'anges. Le Dr Salah al-Sawi (fatwa n° 86502, 1er mars 2012) a répondu que le sens, en termes simples, est que Dieu a décrété des causes lors de la création et a attribué une cause à toute chose – faisant des gardiens successifs une cause de protection, de même qu'Il a fait des anges des croyants une cause de victoire à Badr, bien qu'Il aurait pu accorder la victoire Lui-même sans anges ni causes, et de même qu'Il a ordonné à Marie de secouer le tronc du palmier, bien qu'Il fût capable de faire venir Sa provision sans aucune cause."
