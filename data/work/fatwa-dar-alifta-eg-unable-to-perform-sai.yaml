label: { ar: "حكم من لم يستطع أداء السعي حتى انتهت المناسك", en: "One unable to perform the sa'i until the rites ended", ur: "وہ شخص جو مناسک ختم ہونے تک سعی نہ کر سکا" }
summary:
  ar: "سائل سأل عن من لم يستطع أداء السعي بين الصفا والمروة حتى انتهت المناسك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21962)⁩ أن السعي في الحج والعمرة من المسائل الخلافية بين الفقهاء التي يجوز الأخذ فيها بقول أي منهم على ما فصّل الجواب من الخلاف وما يترتب عليه."
  en: "A questioner asked about one unable to perform the sa'i between Safa and Marwa until the rites ended. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21962) answered that the sa'i in Hajj and umrah is a differed-over question in which any of the jurists' positions may be adopted — the answer sets out the disagreement and its consequences."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو مناسک ختم ہونے تک صفا مروہ کی سعی نہ کر سکا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21962)⁩ نے جواب دیا کہ حج اور عمرہ میں سعی اختلافی مسائل میں ہے جن میں کسی بھی فقیہ کے قول پر عمل جائز ہے — جواب میں اختلاف اور اس کے نتائج بیان ہوئے۔"
