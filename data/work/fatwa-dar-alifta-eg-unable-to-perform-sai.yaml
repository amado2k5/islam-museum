label: { ar: "حكم من لم يستطع أداء السعي حتى انتهت المناسك", en: "One unable to perform the sa'i until the rites ended", ur: "وہ شخص جو مناسک ختم ہونے تک سعی نہ کر سکا", es: "Quien no pudo realizar el sa'i hasta que terminaron los ritos", fr: "Celui qui ne pouvait accomplir le sa'i avant la fin des rites", tr: "Ritüeller tamamlanana kadar Sa'i yapamayan kişiye verilen karar", id: "Putusan tentang seseorang yang tidak dapat melakukan Sa'i sampai ritual selesai" }
summary:
  ar: "سائل سأل عن من لم يستطع أداء السعي بين الصفا والمروة حتى انتهت المناسك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21962)⁩ أن السعي في الحج والعمرة من المسائل الخلافية بين الفقهاء التي يجوز الأخذ فيها بقول أي منهم على ما فصّل الجواب من الخلاف وما يترتب عليه."
  en: "A questioner asked about one unable to perform the sa'i between Safa and Marwa until the rites ended. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21962) answered that the sa'i in Hajj and umrah is a differed-over question in which any of the jurists' positions may be adopted — the answer sets out the disagreement and its consequences."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو مناسک ختم ہونے تک صفا مروہ کی سعی نہ کر سکا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21962)⁩ نے جواب دیا کہ حج اور عمرہ میں سعی اختلافی مسائل میں ہے جن میں کسی بھی فقیہ کے قول پر عمل جائز ہے — جواب میں اختلاف اور اس کے نتائج بیان ہوئے۔"
  es: "Un consultante preguntó sobre la imposibilidad de realizar el sa'i entre Safa y Marwa hasta que concluyeran los ritos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21962) respondió que el sa'i en el Hajj y la Umrah es una cuestión divergente en la que se puede adoptar cualquiera de las posturas de los juristas; la respuesta expone el desacuerdo y sus consecuencias."
  fr: "Un internaute a posé une question concernant l'impossibilité d'accomplir le sa'i entre Safa et Marwa avant la fin des rites. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21962) a répondu que le sa'i lors du Hajj et de la Omra fait l'objet d'une divergence d'opinions entre les juristes, chacun pouvant adopter une position différente. La réponse expose les divergences et leurs conséquences."
  tr: "Bir soru soran, ritüeller tamamlanana kadar Safa ile Merve arasında Sa'i yapamayanlar hakkında sorular sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21962), Hac ve Umre sırasında Sey'i'nin hukukçular arasında tartışmalı bir konu olduğunu ve bu konuda herhangi birinin görüşünün ayrıntılı anlaşmazlık ve sonuçlar temelinde kabul edilebileceğini yanıtladı."
  id: "Seorang penanya menanyakan tentang mereka yang tidak dapat melakukan Sa'i antara Safa dan Marwah sampai ritual selesai. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21962) menjawab bahwa Sa'i selama Haji dan Umrah adalah isu yang kontroversial di antara para ahli hukum di mana pendapat salah satu dari mereka dapat diterima berdasarkan perbedaan rinci dan konsekuensinya."
