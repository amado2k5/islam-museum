summary:
  ar: "سائل سأل عن بيع الصقر المدرب على الصيد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21570)⁩ أنه لا مانع شرعًا من بيع الصقور وأخذ ثمنها ما دامت مدربة على الصيد وينتفع بها لا سيما وأنها مال متقوم على ما فصّل الجواب."
  en: "A questioner asked about selling a falcon trained for hunting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21570) answered there is no legal objection to selling falcons and taking their price while they are trained for hunting and benefit is taken of them — being recognised property — as the answer details."
  ur: "ایک سائل نے شکار کے لیے تربیت یافتہ باز بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21570)⁩ نے جواب دیا کہ جب باز شکار کے لیے تربیت یافتہ ہو اور فائدہ حاصل ہو تو بیچنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
