summary:
  ar: "موقع إسلامي روسي هو الموقع الرسمي لشامل علاء الدينوف، إمام وخطيب المسجد التذكاري بموسكو، ينشر خطبه ومقالاته وتفسيره وأجوبته على الأسئلة؛ أقدم لقطة له ذات محتوى في أرشيف الإنترنت مؤرخة في 30 يناير 2003."
  en: "A Russian Islamic website, the official site of Shamil Alyautdinov, imam-khatib of the Memorial Mosque in Moscow, publishing his sermons, articles, Qur'an commentary and answers to questions; its earliest archived capture with content is of 30 January 2003."
  ur: "روسی اسلامی ویب سائٹ، ماسکو کی یادگاری مسجد کے امام و خطیب شامل علاء الدینوف کی سرکاری سائٹ، جو ان کے خطبات، مضامین، تفسیر اور سوالوں کے جواب شائع کرتی ہے؛ مواد والی سب سے پرانی آرکائیو تصویر 30 جنوری 2003 کی ہے۔"
