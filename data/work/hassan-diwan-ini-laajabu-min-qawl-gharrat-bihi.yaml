label: { ar: "قصيدة حسان «إني لأعجب من قول غررت به»", en: "Hassan's verses 'I marvel at a word you were deceived by'", es: "Versos de Hassan: \"Me asombra una palabra con la que fuiste engañado\".", fr: "Vers d'Hassan: « Je m'étonne d'un mot qui vous a trompés »", ur: "حسن کی آیات 'مجھے ایک لفظ پر تعجب ہوا جس سے آپ کو دھوکا ہوا'" }
summary:
  ar: "أبيات لحسان بن ثابت من البسيط على روي الراء، يشبه فيها قولا حلو الظاهر خاليا من الصدق بالسراب والسحاب الراعد بلا مطر {{cite:sharh-diwan-hassan-barquqi-1929 p.202-203}}."
  en: "Verses by Hassan ibn Thabit in the basit metre on the rhyme ra', likening a sweet-sounding but empty speech to a mirage and to a thundering cloud without rain {{cite:sharh-diwan-hassan-barquqi-1929 p.202-203}}."
  es: "Versos de Hassan ibn Thabit en metro basit sobre la rima ra', que comparan un discurso dulce pero vacío con un espejismo y con una nube atronadora sin lluvia {{cite:sharh-diwan-hassan-barquqi-1929 p.202-203}}."
  fr: "Vers de Hassan ibn Thabit en mètre basit sur la rime ra', comparant un discours doux mais vide à un mirage et à un nuage orageux sans pluie {{cite:sharh-diwan-hassan-barquqi-1929 p.202-203}}."
  ur: "حسن بن ثابت کی آیات باسط میٹر میں شاعری را' پر، ایک میٹھی آواز والی لیکن خالی تقریر کو سراب اور بغیر بارش کے گرجنے والے بادل سے تشبیہ دیتے ہیں"
