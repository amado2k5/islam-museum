summary:
  ar: معجم ابن حجر العسقلاني في تراجم أعيان المئة الثامنة، رتّبه على حروف المعجم، وبدأه بمن اسمه إبراهيم تبركاً، ويذكر في مقدمته أنه جمعه من كتب منها مجاني العصر لأبي حيان وتاريخ مصر للقطب الحلبي وذيل سير النبلاء للذهبي {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}.
  en: Ibn Hajar al-Asqalani's dictionary of the notable people of the eighth Islamic century, arranged alphabetically and opening with those named Ibrahim as a blessing; in his introduction he names among his sources Abu Hayyan's work on his contemporaries, Qutb al-Din al-Halabi's history of Egypt and al-Dhahabi's continuation of Siyar A'lam al-Nubala' {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}.
  ur: ابن حجر عسقلانی کی آٹھویں صدی کے ممتاز لوگوں کی سوانحی لغت، حروفِ تہجی کی ترتیب سے، جس کا آغاز برکت کے لیے ابراہیم نام والوں سے ہوتا ہے؛ مقدمے میں وہ اپنے مآخذ میں ابو حیان کی معاصرین پر کتاب، قطب الدین حلبی کی تاریخِ مصر اور ذہبی کے ذیلِ سیر اعلام النبلاء کا ذکر کرتے ہیں {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}۔
  es: "Diccionario de Ibn Hajar al-Asqalani de las personas notables del siglo VIII islámico, ordenado alfabéticamente y comenzando con aquellos llamados Ibrahim como una bendición; en su introducción nombra entre sus fuentes la obra de Abu Hayyan sobre sus contemporáneos, la historia de Egipto de Qutb al-Din al-Halabi y la continuación de Siyar A'lam al-Nubala' de al-Dhahabi {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}."
  fr: "Le dictionnaire d'Ibn Hajar al-Asqalani des personnes notables du VIIIe siècle islamique, classé par ordre alphabétique et commençant par ceux nommés Ibrahim comme une bénédiction; dans son introduction, il cite parmi ses sources l'œuvre d'Abu Hayyan sur ses contemporains, l'histoire de l'Égypte de Qutb al-Din al-Halabi et la continuation par al-Dhahabi du Siyar A'lam al-Nubala' {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}."
  tr: "İbn Hajar al-Asqalani'nin sekizinci yüzyılın önemli şahsiyetlerinin biyografileri üzerine sözlüğü, alfabetik olarak düzenlenmiş ve bereket için İbrahim adında biriyle başlamıştır. Girişinde, Abu Hayyan'ın 'Majani al-Asr', al-Qutb al-Halabi'nin 'Tarikh Misr' ve al-Dhahabi'nin 'Dhayl Siyar al-Nubala' gibi kitaplarından derlediği belirtilir {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6} gibi kitaplardan derlediği belirtilir."
  id: "Kamus Ibn Hajar al-Asqalani tentang biografi tokoh-tokoh terkenal abad kedelapan, disusun secara alfabet, dimulai dengan seseorang bernama Ibrahim untuk berkat. Disebutkan dalam pengantarnya bahwa ia mengumpulkan dari buku-buku seperti 'Majani al-Asr' oleh Abu Hayyan, 'Tarikh Misr oleh al-Qutb al-Halabi,' dan 'Dhayl Siyar al-Nubala' oleh al-Dhahabi {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}."
