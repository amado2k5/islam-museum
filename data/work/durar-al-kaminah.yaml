class: work
kind: book
label:
  ar: الدرر الكامنة في أعيان المئة الثامنة
  en: Durar al-Kaminah
  ur: الدرر الکامنہ فی اعیان المائۃ الثامنہ
summary:
  ar: معجم ابن حجر العسقلاني في تراجم أعيان المئة الثامنة، رتّبه على حروف المعجم، وبدأه بمن اسمه إبراهيم تبركاً، ويذكر في مقدمته أنه جمعه من كتب منها مجاني العصر لأبي حيان وتاريخ مصر للقطب الحلبي وذيل سير النبلاء للذهبي {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}.
  en: Ibn Hajar al-Asqalani's dictionary of the notable people of the eighth Islamic century, arranged alphabetically and opening with those named Ibrahim as a blessing; in his introduction he names among his sources Abu Hayyan's work on his contemporaries, Qutb al-Din al-Halabi's history of Egypt and al-Dhahabi's continuation of Siyar A'lam al-Nubala' {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}.
  ur: ابن حجر عسقلانی کی آٹھویں صدی کے ممتاز لوگوں کی سوانحی لغت، حروفِ تہجی کی ترتیب سے، جس کا آغاز برکت کے لیے ابراہیم نام والوں سے ہوتا ہے؛ مقدمے میں وہ اپنے مآخذ میں ابو حیان کی معاصرین پر کتاب، قطب الدین حلبی کی تاریخِ مصر اور ذہبی کے ذیلِ سیر اعلام النبلاء کا ذکر کرتے ہیں {cite:durar-kamina-jil-1993 1/4} {cite:durar-kamina-jil-1993 1/5} {cite:durar-kamina-jil-1993 1/6}۔
