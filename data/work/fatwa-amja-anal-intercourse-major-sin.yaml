id: work/fatwa-amja-anal-intercourse-major-sin
class: work
kind: fatwa
label: { ar: "حكم إتيان المرأة في دبرها", en: "The ruling on anal intercourse with one's wife", ur: "زوجہ سے دبر میں جماع کا حکم" }
summary:
  ar: "سأل طالب كلية شريعة عن مسألة عُرضت في محاضرة بين الطلاب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78387 بتاريخ 29 مارس 2009)⁩ أن إتيان المرأة في دبرها من الكبائر، ولفظ الحرث في قوله تعالى نساؤكم حرث لكم فأتوا حرثكم أنى شئتم يفيد أن الإباحة لم تقع إلا في الفرج الذي هو القبل خاصة إذ هو مزرع الذرية فقد شبه ما يلقى في أرحامهن من النطف التي منها النسل بما يلقى في الأرض من البذور التي منها النبت، وقوله أنى شئتم أي من أي جهة شئتم من الأمام أو الخلف إذا كان في موضع الحرث، وذكر حديث من أتى حائضًا أو امرأة في دبرها أو كاهنًا فقد كفر بما أنزل على محمد."
  en: "A sharia-college student asked about a question debated in a lecture. Dr. Salah al-Sawi (fatwa no. 78387, 29 March 2009) answered that approaching one's wife anally is among the major sins: the 'tilth' of 'your women are a tilth for you, so come to your tilth as you will' confines permission to the front passage alone, being the seedbed of offspring — what is cast into the womb likened to seed cast into soil — and 'as you will' means from whatever direction, front or back, provided it is the place of tilth; he cited the hadith that whoever comes to a menstruating woman, a woman anally, or a diviner has disbelieved in what was sent down on Muhammad. Recorded as AMJA's answer."
  ur: "ایک طالب علم نے دبر میں جماع کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78387، 29 مارچ 2009)⁩ کے مطابق یہ کبائر میں سے ہے — آیت میں «حرث» اجازت کو صرف مکان ولادت تک محدود کرتا ہے اور اس کے منکر کی وعید آئی ہے۔"
