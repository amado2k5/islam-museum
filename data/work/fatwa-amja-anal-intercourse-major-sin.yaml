label: { ar: "حكم إتيان المرأة في دبرها", en: "The ruling on anal intercourse with one's wife", ur: "زوجہ سے دبر میں جماع کا حکم", es: "La sentencia sobre el coito anal con la esposa", fr: "La décision concernant les rapports anaux avec sa femme", tr: "Bir kadının anüsüyle cinsel ilişkiye girmesine ilişkin karar", id: "Putusan tentang seorang wanita melakukan hubungan seks dengan anusnya" }
summary:
  ar: "سأل طالب كلية شريعة عن مسألة عُرضت في محاضرة بين الطلاب. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78387 بتاريخ 29 مارس 2009)⁩ أن إتيان المرأة في دبرها من الكبائر، ولفظ الحرث في قوله تعالى نساؤكم حرث لكم فأتوا حرثكم أنى شئتم يفيد أن الإباحة لم تقع إلا في الفرج الذي هو القبل خاصة إذ هو مزرع الذرية فقد شبه ما يلقى في أرحامهن من النطف التي منها النسل بما يلقى في الأرض من البذور التي منها النبت، وقوله أنى شئتم أي من أي جهة شئتم من الأمام أو الخلف إذا كان في موضع الحرث، وذكر حديث من أتى حائضًا أو امرأة في دبرها أو كاهنًا فقد كفر بما أنزل على محمد."
  en: "A sharia-college student asked about a question debated in a lecture. Dr. Salah al-Sawi (fatwa no. 78387, 29 March 2009) answered that approaching one's wife anally is among the major sins: the 'tilth' of 'your women are a tilth for you, so come to your tilth as you will' confines permission to the front passage alone, being the seedbed of offspring — what is cast into the womb likened to seed cast into soil — and 'as you will' means from whatever direction, front or back, provided it is the place of tilth; he cited the hadith that whoever comes to a menstruating woman, a woman anally, or a diviner has disbelieved in what was sent down on Muhammad. Recorded as AMJA's answer."
  ur: "ایک طالب علم نے دبر میں جماع کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78387، 29 مارچ 2009)⁩ کے مطابق یہ کبائر میں سے ہے — آیت میں «حرث» اجازت کو صرف مکان ولادت تک محدود کرتا ہے اور اس کے منکر کی وعید آئی ہے۔"
  es: "Un estudiante de una facultad de derecho islámico preguntó sobre una cuestión debatida en una clase. El Dr. Salah al-Sawi (fatwa n.º 78387, 29 de marzo de 2009) respondió que acercarse a la esposa analmente es uno de los pecados mayores: la expresión «vuestras mujeres son un campo de cultivo para vosotros, así que venid a vuestro campo de cultivo como queráis» limita el permiso al pasaje anterior, que es el semillero de la descendencia —lo que se deposita en el útero se asemeja a la semilla sembrada en la tierra— y «como queráis» significa desde cualquier dirección, delante o detrás, siempre que sea el lugar del campo de cultivo; citó el hadiz que dice que quien se acerca a una mujer menstruante, a una mujer analmente o a un adivino ha descreído en lo que fue revelado a Mahoma. Registrado como respuesta de AMJA."
  fr: "Un étudiant d'une faculté de charia a posé une question débattue lors d'une conférence. Le Dr Salah al-Sawi (fatwa n° 78387, 29 mars 2009) a répondu que l'approche anale de son épouse compte parmi les péchés majeurs: le sens de « vos femmes sont un champ à labourer pour vous, alors allez-y comme vous le souhaitez » limite la permission à l'entrée du vagin, considéré comme le terreau de la progéniture – ce qui est déposé dans le ventre maternel étant comparé à une semence semée en terre – et « comme vous le souhaitez » signifie de n'importe quelle direction, devant ou derrière, pourvu qu'il s'agisse du lieu du champ à labourer; il a cité le hadith selon lequel quiconque s'approche d'une femme menstruée, d'une femme par voie anale ou d'un devin a renié la révélation faite à Muhammad. Cette réponse a été consignée dans l'AMJA."
  tr: "Şeriat Koleji'nden bir öğrenci, öğrenciler arasında bir derste sunulan bir konu hakkında soru aldı. Dr. Salah Al-Sawy (29 Mart 2009 tarihli 78387 sayılı Fetva) bir kadınla anüsünde cinsel ilişkiye girmenin büyük bir günah olduğunu yanıtladı. O'nun sözündeki 'Çiftçilik' ifadesi, 'Kadınlarınız sizin için bir kemindir, bu yüzden tarlanızı istediğiniz yere getirin', izin sadece özel bölgede, yani kıblede gerçekleştiğini gösterir; özellikle de burası yavrular için bir tarladır. Rahimlerinde sperm atılan spermleri, yavruların saçıldığı tohumlara benzetti ve 'Nerede isterseniz, istediğiniz taraftan, önden ya da arkadan, eğer toprak sürme yerindeyse' dedi. Hadis'i andı: Regl olan bir kadınla, anüsünde bir kadınla ya da bir rahiple ilişkiye giren kişi Muhammed'e vakir olana inanmamıştır."
  id: "Seorang mahasiswa dari Fakultas Syariah ditanya tentang masalah yang disampaikan dalam kuliah di antara para mahasiswa. Dr. Salah Al-Sawy menjawab (Fatwa No. 78387 tanggal 29 Maret 2009) bahwa berhubungan seks dengan wanita di anusnya adalah dosa besar. Ungkapan 'membrak' dalam perkataan-Nya, 'Wanita-Mu adalah jaminan untukmu, maka bawalah ladangmu ke mana pun kamu mau' menunjukkan bahwa kebolehan hanya terjadi di bagian pribadi, yaitu qibla, terutama karena itu adalah ladang untuk keturunan. Dia menyamakan apa yang dibuang sperma di dalam rahim mereka yang kemudian menyebarkan keturunan dengan benih yang tumbuh di bumi, dan perkataan-Nya 'Di mana pun kamu mau, dari sisi mana pun kamu mau, dari depan atau belakang, jika itu di tempat bajak laut.' Dia menyebutkan hadits bahwa siapa pun yang berhubungan seks dengan wanita yang sedang menstruasi, wanita di anusnya, atau imam telah tidak percaya pada apa yang telah diwahyukan kepada Muhammad."
