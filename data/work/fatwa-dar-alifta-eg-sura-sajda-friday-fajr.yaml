label: { ar: "حكم قراءة سورة السجدة في فريضة الفجر كل جمعة", en: "Reading Surat al-Sajda at Friday's dawn prayer", ur: "ہر جمعہ فجر میں سورہ سجدہ پڑھنے کا حکم", es: "Recitación de la Sura al-Sajda en la oración del amanecer del viernes" }
summary:
  ar: "سائل سأل عن قراءة سورة السجدة في فريضة الفجر كل جمعة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22083)⁩ أن قراءة سورة السجدة في صلاة الصبح كل جمعة أمر مستحب وكذلك سورة الإنسان والمداومة عليهما مستحبة، على ما فصّل الجواب."
  en: "A questioner asked about reading Surat al-Sajda at the dawn prayer every Friday. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22083) answered that it is recommended — likewise Surat al-Insan — and persistence on both is recommended, as the answer details."
  ur: "ایک سائل نے ہر جمعہ فجر میں سورہ سجدہ پڑھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22083)⁩ نے جواب دیا کہ یہ مستحب ہے اور اسی طرح سورہ انسان بھی، اور دونوں پر لگاتار عمل مستحب ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la recitación de la Sura al-Sajda en la oración del amanecer todos los viernes. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22083) respondió que es recomendable, al igual que la Sura al-Insan, y que se recomienda la constancia en ambas, como se detalla en la respuesta."
