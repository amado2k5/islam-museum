id: work/fatwa-dar-alifta-eg-working-on-gambling-chat-app
class: work
kind: fatwa
label: { ar: "حكم العمل في تطبيق يتضمن محادثات صوتية وألعابًا ومراهنات", en: "Working for an app with voice chats, games and betting", ur: "ایسی ایپ میں کام کا حکم جس میں وائس چیٹ، گیمز اور جوا شامل ہو", es: "Trabajando para una aplicación con chats de voz, juegos y apuestas.", fr: "Je travaille pour une application proposant des chats vocaux, des jeux et des paris." }
summary:
  ar: "سائل سأل عن العمل في تطبيق تجري فيه محادثات غير منضبطة بين الرجال والنساء ويشتمل على ألعاب ومراهنات. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22550)⁩ أنه يحرم شرعًا العمل في التطبيق المذكور أو لصالحه لما فيه من محادثات غير منضبطة ومراهنات على ما فصّل الجواب."
  en: "A questioner asked about working for an app that hosts unregulated conversations between men and women and includes games and betting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22550) answered that working in or for such an app is forbidden in the sharia for the unregulated conversation and the gambling it contains, as the answer details."
  ur: "ایک سائل نے ایسی ایپ میں کام کا حکم پوچھا جس میں مردوں اور خواتین کی غیر منضبط گفتگو ہو اور گیمز اور جوا شامل ہوں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22550)⁩ نے جواب دیا کہ ایسی ایپ میں یا اس کے لیے کام کرنا شریعت میں حرام ہے، اس میں موجود غیر منضبط گفتگو اور جوے کی وجہ سے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de trabajar para una aplicación que permite conversaciones no reguladas entre hombres y mujeres e incluye juegos y apuestas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22550) respondió que trabajar en o para dicha aplicación está prohibido por la sharia debido a las conversaciones no reguladas y los juegos de azar que contiene, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le travail pour une application proposant des conversations non réglementées entre hommes et femmes, ainsi que des jeux et des paris. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22550) a répondu que travailler pour une telle application est interdit par la charia en raison des conversations non réglementées et des jeux de hasard qu'elle propose, comme le précise la réponse."
