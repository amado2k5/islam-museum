id: work/fatwa-amja-fluid-after-ghusl
class: work
kind: fatwa
label: { ar: "سائل بعد الاغتسال", en: "Fluid after the washing — wudu suffices", ur: "غسل کے بعد رطوبت — صرف وضو", es: "El líquido después del lavado — wudu es suficiente" }
summary:
  ar: "سأل سائل عن حكم نزول ماء كثير شفاف من المرأة بعد الاغتسال. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80970 بتاريخ 14 فبراير 2010)⁩ أن السائل الذي يوجب خروجه الاغتسال هو الماء الدافق وهو الذي يخرج دفقًا بشهوة أما ما يكون بعد الاغتسال وعدم وجود المثيرات فلا يوجب الاغتسال بل الوضوء فقط ونزوله أثناء الصلاة يقتضي إعادة الوضوء والصلاة على ما فصّل الجواب."
  en: "A questioner asked the ruling on much clear fluid descending from a woman after the washing. Dr. Salah al-Sawi (fatwa no. 80970, 14 February 2010) answered that the fluid whose exit obliges washing is the gushing water — what leaves in a gush with desire; what descends after the washing with no arousal present obliges no washing, only wudu, and its descending in prayer requires redoing the wudu and the prayer — as the answer details."
  ur: "غسل کے بعد رطوبت نکلے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80970، 14 فروری 2010)⁩ کے مطابق دافق پانی غسل طلب ہے؛ باقی صورت میں وضو کافی۔"
  es: "Una persona preguntó sobre la norma relativa al flujo abundante de líquido transparente que desciende de una mujer después del lavado. El Dr. Salah al-Sawi (fatwa n.º 80970, 14 de febrero de 2010) respondió que el fluido cuya salida obliga al lavado es el agua que sale a borbotones con deseo; lo que desciende después del lavado sin excitación no obliga al lavado, solo a la ablución (wudu), y su descenso durante la oración requiere repetir la ablución y la oración, como se detalla en la respuesta."
