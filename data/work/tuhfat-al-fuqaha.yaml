  ar: "تحفة الفقهاء"
  en: "Tuhfat al-Fuqaha'"
  ur: "تحفۃ الفقہاء"
summary:
  ar: "كتاب في الفقه الحنفي لعلاء الدين محمد بن أحمد بن أبي أحمد السمرقندي، يقول في أوله إنه زاد فيه على مختصر القدوري بعض ما تركه من المسائل وأوضح مشكلاته بالدلائل، بطلب من إخوانه، وسمّاه «تحفة الفقهاء» لأنه هديته لهم. وعليه بنى تلميذه الكاساني «بدائع الصنائع». {cite:badai-sanai-ilmiyya-v1 p.77}"
  en: "A Hanafi law book by Ala' al-Din Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, who says at its start that, at his companions' request, he added to al-Quduri's Mukhtasar some questions it had left out and explained its difficulties with evidence, naming it Tuhfat al-Fuqaha', 'the jurists' gift', as his present to them. His student al-Kasani built Bada'i' al-Sana'i' on it."
  ur: "علاء الدین محمد بن احمد بن ابی احمد سمرقندی کی حنفی فقہ کی کتاب؛ وہ اس کے آغاز میں کہتے ہیں کہ اپنے ساتھیوں کی فرمائش پر انہوں نے مختصر القدوری پر وہ مسائل بڑھائے جو اس میں رہ گئے تھے اور اس کی مشکلات دلائل سے واضح کیں، اور اس کا نام «تحفۃ الفقہاء» رکھا کیونکہ یہ ان کے لیے ان کا تحفہ تھا۔ ان کے شاگرد کاسانی نے اسی پر «بدائع الصنائع» کی بنیاد رکھی۔"
