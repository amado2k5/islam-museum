summary:
  ar: "مجموعة فتاوى جمعها محمود خطاب السبكي تنكر البدع الشعبية في الجنائز والأفراح والمولد، وتعرض ردود علماء الأزهر عليها، ومنها فتوى في السخرية بالشعائر الدينية."
  ur: "محمود خطاب السبکی کا جمع کردہ فتاوے کا مجموعہ جو جنازوں، تقریبات اور میلاد میں عوامی بدعات کے خلاف ازہر کے علماء کے جوابات پر مشتمل ہے۔"
  en: "A fatwa collection by Mahmud Khattab al-Subki opposing popular innovations at funerals, celebrations and the mawlid, with replies from Al-Azhar scholars, including a ruling on mocking religious rites."
  es: "Una recopilación de fatuas de Mahmud Khattab al-Subki que se opone a las innovaciones populares en funerales, celebraciones y el mawlid, con respuestas de eruditos de Al-Azhar, incluyendo un dictamen sobre la burla a los ritos religiosos."
  fr: "Un recueil de fatwas de Mahmud Khattab al-Subki s'opposant aux innovations populaires lors des funérailles, des célébrations et du mawlid, avec des réponses d'érudits d'Al-Azhar, y compris une décision sur la moquerie des rites religieux."
  tr: "Mahmud Hattab Al-Sobki tarafından derlenen bir fetva derlemesi, cenazelerde, kutlamalarda ve doğum günlerinde popüler yenilikleri reddeder ve ezherli âlimlerin bunlara verdiği yanıtları, dini ritüelleri alaya alan bir fetva da dahil olmak üzere, sunar."
  id: "Kumpulan fatwa yang disusun oleh Mahmoud Khattab Al-Sobki menyangkal inovasi populer dalam pemakaman, perayaan, dan ulang tahun, serta menyajikan tanggapan dari ulama Al-Azhar terhadap fatwa tersebut, termasuk fatwa yang mengejek ritual keagamaan."
