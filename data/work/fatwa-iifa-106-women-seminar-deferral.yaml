label: { ar: "قرار مجمع الفقه الإسلامي الدولي 106 (11/9) بشأن ندوة الخبراء حول دور المرأة في تنمية المجتمع الإسلامي ⁦(مؤجل)⁩", en: "IIFA resolution 106 (11/9) on the experts' seminar on women's role in developing the Muslim community ⁦(deferred)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 106 (11/9): مسلم معاشرے کی ترقی میں خواتین کے کردار پر ماہرین سمینار ⁦(مؤجل)⁩" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩، بعد التداول في الموضوع وأخذ الرأي فيه. قرر تأجيل النظر لإصدار قرار في موضوع ندوة الخبراء حول دور المرأة في تنمية المجتمع لمزيد من الدراسة، وشكل لذلك لجنة من رئيس المجلس الشيخ الدكتور بكر بن عبد الله أبو زيد والشيخ علي التسخيري والشيخ محمد تقي العثماني ترفع تقريرها للدورة القادمة. سُجّل بوصفه تأجيلًا؛ وقد استُوفي الموضوع في الدورة الثانية عشرة بقرار 114 ⁦(12/8)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998), after deliberating and taking counsel. It deferred issuing a resolution on the experts' seminar on women's role in developing the community pending further study, appointing a committee of council president Shaykh Dr Bakr ibn Abdallah Abu Zayd, Shaykh Ali al-Taskhiri and Shaykh Muhammad Taqi al-Uthmani to report to the next session. Recorded as a deferral; the subject was settled in resolution 114 (12/8) at the 12th session."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں، اس پر مباحث اور مشورے کے بعد۔ اس نے معاشرے کی ترقی میں خواتین کے کردار پر ماہرین سمینار کے فیصلے کو مزید مطالعے کے لیے مؤجل کیا اور اس کے لیے کونسل کے صدر شیخ ڈاکٹر بکر بن عبداللہ ابو زید، شیخ علی تسخیری اور شیخ محمد تقی عثمانی کی کمیٹی بنائی جو آئندہ مجلس کو رپورٹ دے۔ یہ مؤجل ہے؛ موضوع بارہویں مجلس میں قرارداد 114 ⁦(12/8)⁩ سے طے ہوا۔"
