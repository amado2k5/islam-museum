id: work/fatwa-amja-trimming-beard
class: work
kind: fatwa
label: { ar: "حكم تخفيف اللحية", en: "Trimming the beard — the default is letting it grow", ur: "داڑھی کاٹنے کا حکم", es: "Recortar la barba: lo normal es dejarla crecer.", fr: "Tailler la barbe — par défaut, on la laisse pousser.", tr: "Sakalın Kesilmesine Dair Karar", id: "Keputusan tentang Memotong Janggut" }
summary:
  ar: "سأل سائل عن حكم تخفيف اللحية بشكل عام وليس حد القبضة سامعًا أن أحد الأئمة الأربعة أجاز ذلك. أجاب د. صلاح الصاوي ⁦(فتوى رقم 76957 بتاريخ 27 نوفمبر 2008)⁩ أن الأصل هو إعفاء اللحية إلا إذا تفاحشت فيؤخذ منها ما يزيل هذا التفاحش ويبقى ما عدا ذلك على أصل الإعفاء، وما روي من أنه كان يأخذ من طول لحيته وعرضها لم يثبت."
  en: "A questioner asked about trimming the beard generally — not to a fistful — having heard one of the four imams permitted it. Dr. Salah al-Sawi (fatwa no. 76957, 27 November 2008) answered that the default is letting the beard grow, except when it grows unsightly; then what removes the unsightliness is taken, the rest remaining on the default of letting grow — and the report that the Prophet used to take from his beard's length and breadth was not established."
  ur: "ایک سائل نے داڑھی کاٹنے کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 76957، 27 نومبر 2008)⁩ کے مطابق اصل یہ ہے کہ داڑھی بڑھائی جائے سوائے بے رونق ہونے کے؛ اور نبی کی کٹائی کی روایت ثابت نہیں۔"
  es: "Un consultante preguntó sobre recortar la barba en general —no hasta dejarla muy corta—, ya que había oído que uno de los cuatro imanes lo permitía. El Dr. Salah al-Sawi (fatwa n.º 76957, 27 de noviembre de 2008) respondió que lo habitual es dejar crecer la barba, excepto cuando crece de forma antiestética; en ese caso, se recorta lo necesario para eliminar la antiestética, y el resto se deja crecer de forma natural. Además, no se ha comprobado que el relato de que el Profeta recortara la longitud y el ancho de su barba sea correcto."
  fr: "Un lecteur a posé une question concernant la taille de la barbe en général — sans pour autant la réduire à une poignée — ayant entendu dire que l'un des quatre imams l'autorisait. Le Dr Salah al-Sawi (fatwa n° 76957, 27 novembre 2008) a répondu que la norme est de laisser pousser la barbe, sauf lorsqu'elle devient inesthétique; dans ce cas, on taille ce qui corrige cet aspect inesthétique, le reste étant conforme à la norme de la laisser pousser — et le récit selon lequel le Prophète se basait sur la longueur et la largeur de sa barbe n'a pas été établi."
  tr: "Bir soruya sakalın genel olarak inceltilmesi hakkında, yumruğun sınırı değil, soruldu ve dört imamdan birinin buna izin verdiği duyuldu. Dr. Salah Al-Sawy (27 Kasım 2008 tarihli 76957 sayılı fetva) yanıtladı: varsayılan olarak, sakal ahlaksızlaşmadıkça sakaldan muaf tutulur; bu durumda sakaldan bir şey alınır ve bu ahlaksızlık giderilir, diğer her şey ise orijinal muafiyet olarak kalır. Sakalının uzunluğu ve genişliğinden aldığı rivayet kesinleşmemiştir."
  id: "Seorang penanya ditanya tentang aturan tentang penipisan jenggot secara umum, bukan batas kepalan tangan, setelah mendengar bahwa salah satu dari empat imam mengizinkannya. Dr. Salah Al-Sawy menjawab (Fatwa No. 76957 tanggal 27 November 2008) bahwa defaultnya adalah mengecualikan janggut kecuali jika menjadi tidak bermoral, dalam hal ini sesuatu diambil dari janggut tersebut yang menghilangkan ketidakmoralan tersebut, dan hal lain tetap menjadi pengecualian asli. Narasi yang biasa ia ambil dari panjang dan lebar jenggotnya tidak dibuktikan."
