id: work/fatwa-dar-alifta-eg-hair-cream-during-ihram
class: work
kind: fatwa
label: { ar: "حكم وضع كريمات منع تساقط الشعر أثناء الإحرام بالحج", en: "Using hair-loss creams during ihram in Hajj", ur: "حج میں احرام کی حالت میں بالوں کی کریم لگانا", es: "Uso de cremas para la caída del cabello durante el ihram en el Hajj.", fr: "Utilisation de crèmes contre la chute des cheveux pendant l'ihram lors du Hajj" }
summary:
  ar: "سائل سأل عن وضع كريمات منع تساقط الشعر أثناء الإحرام بالحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20698)⁩ أنه يجوز للمحرم استخدام الكريمات التي تمنع من تساقط الشعر سواء كان بها طيب أو لم يكن إذ الأصل فيها ومقصودها العلاج على ما فصّل الجواب."
  en: "A questioner asked about applying hair-loss creams during ihram in Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20698) answered that the pilgrim may use them whether perfumed or not, since their nature and purpose is treatment — as the answer details."
  ur: "ایک سائل نے احرام میں بالوں کے گرنے روکنے والی کریم کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20698)⁩ نے جواب دیا کہ خوشبو دار ہو یا نہ ہو استعمال جائز ہے کیونکہ یہ علاج ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un peregrino preguntó sobre la aplicación de cremas para la caída del cabello durante el ihram en el Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20698) respondió que el peregrino puede usarlas, sean perfumadas o no, ya que su naturaleza y propósito es el tratamiento, como se detalla en la respuesta."
  fr: "Un pèlerin a demandé s'il était possible d'utiliser des crèmes contre la chute des cheveux pendant l'ihram lors du Hajj. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20698) a répondu que le pèlerin pouvait les utiliser, parfumées ou non, étant donné leur nature et leur but thérapeutique, comme le précise la réponse."
