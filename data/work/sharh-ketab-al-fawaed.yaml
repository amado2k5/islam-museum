label:
  ar: "شرح كتاب الفوائد (سلسلة دروس)"
  en: "Sharh Kitab al-Fawa'id (lecture series)"
  ur: "شرح کتاب الفوائد (درسی سلسلہ)"
summary:
  ar: "سلسلة من عشر حلقات لعمر عبد الكافي في أرشيف أسابيل، يشرح فيها كتاب «الفوائد» لابن قيم الجوزية، ويصفه بأنه كتاب متعدد الموضوعات، فتتنقل الدروس بين التوبة والتوكل والزهد وأمراض القلوب وغيرها."
  en: "A ten-episode series by Omar Abdelkafy on the Assabile archive explaining Ibn Qayyim al-Jawziyya's al-Fawa'id, which he describes as a book of many subjects; the lessons move between repentance, trust in God, renunciation, the diseases of the heart and more."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا دس اقساط کا سلسلہ، جس میں وہ ابن قیم الجوزیہ کی کتاب «الفوائد» کی شرح کرتے ہیں اور اسے کئی موضوعات کی کتاب کہتے ہیں؛ دروس توبہ، توکل، زہد، دل کی بیماریوں وغیرہ کے درمیان چلتے ہیں۔"
