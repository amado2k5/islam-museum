id: work/fatwa-amja-repenting-minor-sin
class: work
kind: fatwa
label: { ar: "التوبة من ذنب ليس من الكبائر", en: "Repenting a sin one thought not major", ur: "غیر کبیرہ گناہ کی توبہ", es: "Arrepentirse de un pecado que uno pensaba que no era grave", fr: "Se repentir d'un péché que l'on croyait anodin.", tr: "Bir günahtan tövbe etmek en büyük günahlardan biri değildir.", id: "Pertobatan dari dosa bukanlah salah satu dosa besar." }
summary:
  ar: "سأل سائل عن حكم من تاب عن ذنب اعتقد أنه ليس من الكبائر هل يحاسبه الله عما سلف منه وما الواجب لزيادة الحسنات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21872 بتاريخ 29 أكتوبر 2007)⁩ أن التائب من الذنب كمن لا ذنب له ونصحه بالإكثار من الاستغفار وفعل الحسنات فإن الحسنات يذهبن السيئات."
  en: "A questioner asked about one who repented a sin he believed not major — is he still held to what passed, and what increases good deeds? Dr. Salah al-Sawi (fatwa no. 21872, 29 October 2007) answered that the repentant of a sin is as one without it; he counselled abundance of seeking forgiveness and doing good, for good deeds do away with evil ones."
  ur: "ایک سائل نے غیر کبیرہ گناہ کی توبہ کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21872، 29 اکتوبر 2007)⁩ کے مطابق توبہ کرنے والا ایسا ہے جیسے گناہ نہ ہو — استغفار اور نیک اعمال کی کثرت کرے۔"
  es: "Un consultante preguntó acerca de alguien que se arrepiente de un pecado que considera insignificante: ¿sigue sujeto a lo ocurrido y qué incrementa las buenas obras? El Dr. Salah al-Sawi (fatwa n.° 21872, 29 de octubre de 2007) respondió que quien se arrepiente de un pecado es como si no lo hubiera cometido; aconsejó buscar el perdón con frecuencia y hacer el bien, pues las buenas obras eliminan las malas."
  fr: "Un internaute a posé la question suivante: celui qui s’est repenti d’un péché qu’il jugeait mineur est-il toujours redevable de ce péché passé ? Et qu’est-ce qui encourage les bonnes actions ? Le Dr Salah al-Sawi (fatwa n° 21872, 29 octobre 2007) a répondu que celui qui s’est repenti d’un péché est comme celui qui ne l’avait pas commis; il a conseillé de multiplier les demandes de pardon et les bonnes actions, car les bonnes actions effacent les mauvaises."
  tr: "Bir soru soran, büyük günah olmadığını düşündüğü bir günahtan tövbe eden birine verilen hükmü soruldu. Tanrı onu yaptıklarından sorumlu tutar mı ve iyi işleri artırmak için ne zorunludur? Dr. Salah Al-Sawy (29 Ekim 2007 tarihli Fetva No. 21872) günahtan tövbe edenin günahsız biri gibi olduğunu söyledi ve ona daha fazla af aramasını ve iyi işler yapmasını tavsiye etti; çünkü iyi işler kötü işleri siler."
  id: "Seorang penanya ditanya tentang putusan seseorang yang bertobat dari dosa yang diyakininya bukan dosa besar. Apakah Allah menuntut pertanggungjawabannya atas apa yang telah dilakukannya dan apa yang wajib untuk meningkatkan perbuatan baik? Dr. Salah Al-Sawy menjawab (Fatwa No. 21872 tanggal 29 Oktober 2007) bahwa orang yang bertobat dari dosa itu seperti seseorang yang tidak berdosa, dan menasihatinya untuk semakin berusaha mencari pengampunan dan melakukan perbuatan baik, karena perbuatan baik menghapus perbuatan buruk."
