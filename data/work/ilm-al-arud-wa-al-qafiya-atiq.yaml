summary:
  ar: "علم العروض والقافية، كتاب في العروض والقوافي لمؤلفه عبد العزيز عتيق، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: نُشر 1969م; ت 1396هـ / 1976م {cite:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا يوجد في shamela.ws مطابقة، بحسب الملف، مع ذكر تحويل بصيغة bok على موقع Shamela.org {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}. لم يقرأ المتحف الكتاب."
  en: "Ilm al-Arud wa-l-Qafiya, a book on prosody (arud and qawafi) by Abd al-Aziz Atiq; its date in a research summary supplied to the museum is pub. 1969 CE; d. 1396 AH / 1976 CE {cite:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}. The summary's answer on its presence in the Shamela library: No match on shamela.ws, according to the file, which mentions a bok conversion on Shamela.org {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}. The museum has not read the book."
  ur: "علم العروض والقافية، عروض و قوافی پر ایک کتاب، مصنف عبد العزيز عتيق؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: اشاعت 1969ء; وفات 1396ھ / 1976ء {cite:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}۔ شاملہ میں موجودگی پر خلاصے کا جواب: فائل کے مطابق shamela.ws پر کوئی مطابق اندراج نہیں، اور Shamela.org پر bok تبدیلی کا ذکر ہے {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "Ilm al-Arud wa-l-Qafiya, livre sur la prosodie (arud et qawafi) de Abd al-Aziz Atiq ; sa date dans une synthèse de recherche remise au musée : publ. 1969; m. 1396 H / 1976 {cite:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Aucune correspondance sur shamela.ws selon le fichier, qui mentionne une conversion bok sur Shamela.org {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}. Le musée n'a pas lu le livre."
  es: "Ilm al-Arud wa-l-Qafiya, libro sobre prosodia (arud y qawafi) de Abd al-Aziz Atiq; su fecha en un resumen de investigación entregado al museo: publ. 1969; m. 1396 H. / 1976 {cite:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sin coincidencia en shamela.ws según el archivo, que menciona una conversión bok en Shamela.org {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}. El museo no ha leído el libro."
  tr: "Yazarı Abdul Aziz Atiq tarafından hazırlanmış, müzeye sunulan bir araştırma özetine göre tarihlendirilen Prosodi ve Kafiye Bilimi: 1969 yılında yayımlanmıştır; 1396 Hicri / 1976 M.S. tarihli {kaynak:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: shamela.ws dosyaya göre eşleşme yoktur; Shamela.org web sitesinde bok formatında bir referans bulunmaktadır {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}. Müze kitabı okumamıştır."
  id: "The Science of Prosody and Rhyme, sebuah buku tentang prosodi dan rima karya penulisnya Abdul Aziz Atiq, bertanggal menurut ringkasan penelitian yang dikirim ke museum: diterbitkan 1969 M; Bertanggal 1396 AH / 1976 M {cite:waqfeya-ilm-al-arud-wa-al-qafiya-atiq}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Tidak ada kecocokan dalam shamela.ws, menurut berkas, dengan referensi dalam format bok di situs web Shamela.org {cite:shamela-org-pdf-ilm-al-arud-wa-al-qafiya-atiq}. Museum tidak membaca buku tersebut."
