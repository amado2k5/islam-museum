id: work/fatwa-dar-alifta-eg-idda-after-khul-before-consummation
class: work
kind: fatwa
label: { ar: "مدى وجوب العدة على المختلعة قبل الدخول وبعد الخلوة الصحيحة", en: "Is 'idda due on a woman granted khul' before consummation but after valid seclusion?", ur: "دخول سے پہلے مگر صحیح خلوة کے بعد خلع لینے والی عورت پر عدت" }
summary:
  ar: "سائلة سألت عن وجوب العدة عليها بعد خلع حصل قبل الدخول وإنما بعد الخلوة الصحيحة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21825)⁩ أن الفرقة الحاصلة بالخلع في العقد الصحيح بعد الخلوة الصحيحة تعتبر طلاقًا بائنًا وتوجب العدة على المرأة المختلعة على ما فصّل الجواب."
  en: "A woman asked whether 'idda is due on her after a khul' that took place before consummation but after a valid seclusion. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21825) answered that a khul' separation in a valid contract after valid seclusion counts as an irrevocable divorce and obliges 'idda on the woman, as the answer details."
  ur: "ایک عورت نے پوچھا کہ کیا اس پر عدت واجب ہے جب خلع دخول سے پہلے مگر صحیح خلوہ کے بعد ہوا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21825)⁩ نے جواب دیا کہ صحیح نکاح میں صحیح خلوے کے بعد ہونے والا خلع طلاقِ بائن ہے اور عورت پر عدت واجب کرتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
