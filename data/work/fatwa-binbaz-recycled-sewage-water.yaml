id: work/fatwa-binbaz-recycled-sewage-water
class: work
kind: fatwa
label: { ar: "حكم مياه المجاري المكرّرة", en: "Recycled sewage water", ur: "صاف کیے گئے سیوریج کے پانی کا حکم" }
summary:
  ar: "سائل يعمل في مستشفى تُروى حدائقه بمياه مجارٍ مكرّرة يسأل عن رذاذها وعن ثمار الأشجار المسقية بها. أجاب ابن باز بأنها إذا كُرّرت تكريرًا كاملًا حتى زال لون النجاسة وطعمها وريحها صار لها حكم الطهارة، فلا يضر ما يصيب الناس منها ولا ثمر ما يُسقى بها، أما إن بقيت آثار النجاسة فيها فلا تُستعمل في سقي ولا غيره وتُصرف إلى جهة لا تؤذي الناس."
  en: "A hospital worker whose gardens are watered with recycled sewage asks about its spray and about the fruit of trees irrigated with it. Ibn Baz answered that once it has been fully treated so that the colour, taste and smell of impurity are gone, it takes the ruling of purity: its spray does not harm and the fruit of what it waters is acceptable; but if traces of impurity remain it is not to be used for irrigation or anything else and should be diverted where it harms no one."
  ur: "ایک ہسپتال کا ملازم، جس کے باغات صاف کیے گئے سیوریج کے پانی سے سیراب ہوتے ہیں، اس کے چھینٹوں اور اس سے سیراب درختوں کے پھلوں کے بارے میں پوچھتا ہے۔ ابن باز نے جواب دیا کہ جب اسے پوری طرح صاف کر لیا جائے یہاں تک کہ نجاست کا رنگ، ذائقہ اور بو ختم ہو جائے تو وہ پاک کے حکم میں ہے، اس کے چھینٹے نقصان نہیں دیتے اور اس سے سیراب پھل درست ہیں؛ لیکن اگر نجاست کے آثار باقی ہوں تو اسے آبپاشی یا کسی اور کام میں استعمال نہ کیا جائے اور ایسی جگہ بہا دیا جائے جہاں کسی کو تکلیف نہ ہو۔"
