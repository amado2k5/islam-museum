label: { ar: "طيبة النشر في القراءات العشر", en: "Tayyibat al-Nashr", ur: "طیبۃ النشر فی القراءات العشر", es: "Tayyibat al-Nashr" }
summary:
  ar: "منظومة ابن الجزري في القراءات العشر الكبرى، تكمل بها «الشاطبية» و«الدرة» القراءات المتواترة بحسب مقدمة الناشر؛ تقتصر على راويين لكل إمام من القراء العشرة وطريقين لكل راوٍ، مغربية ومشرقية، ويقول الضابط إن في الطيبة ثمانين طريقًا محققة تتشعب إلى تسعمائة وثمانين، ويعدّها صاحب التعريف بابن الجزري من مصنفاته {cite:tayyibat-nashr-zabi-2015 p. 7} {cite:tayyibat-nashr-zabi-2015 p. 8} {cite:nashr-dahman-damascus-1345-v1 p. 8}."
  en: "Ibn al-Jazari's poem on the ten readings, the 'greater' counterpart to the Shatibiyya and al-Durra, which according to its modern editor together complete the mutawatir readings; it limits itself to two transmitters for each of the ten imams and two paths for each transmitter, western and eastern, and the editor counts eighty verified paths branching into nine hundred and eighty; the biography of Ibn al-Jazari lists it among his works {cite:tayyibat-nashr-zabi-2015 p. 7} {cite:tayyibat-nashr-zabi-2015 p. 8} {cite:nashr-dahman-damascus-1345-v1 p. 8}."
  ur: "ابن الجزری کی قراءاتِ عشر کبریٰ پر منظومہ، جو ناشر کے مقدمے کے مطابق «شاطبیہ» اور «درہ» کے ساتھ مل کر متواتر قراءتیں مکمل کرتی ہے؛ وہ دس ائمہ میں سے ہر ایک کے دو راوی اور ہر راوی کے دو طریق، مغربی اور مشرقی، تک محدود رہتی ہے، اور ضابط کے شمار میں اس میں اسّی محقق طرق ہیں جو نو سو اسّی تک پھیلتے ہیں؛ ابن الجزری کے ترجمے میں اسے ان کی تصانیف میں گنا گیا ہے {cite:tayyibat-nashr-zabi-2015 p. 7} {cite:tayyibat-nashr-zabi-2015 p. 8} {cite:nashr-dahman-damascus-1345-v1 p. 8}۔"
  es: "El poema de Ibn al-Jazari sobre las diez lecturas, la contraparte \"mayor\" de la Shatibiyya y al-Durra, que según su editor moderno completan juntas las lecturas mutawatir; se limita a dos transmisores para cada uno de los diez imanes y dos caminos para cada transmisor, occidental y oriental, y el editor cuenta ochenta caminos verificados que se ramifican en novecientos ochenta; la biografía de Ibn al-Jazari lo enumera entre sus obras {cite:tayyibat-nashr-zabi-2015 p. 7} {cite:tayyibat-nashr-zabi-2015 p. 8} {cite:nashr-dahman-damascus-1345-v1 p. 8}."
