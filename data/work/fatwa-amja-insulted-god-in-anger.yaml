id: work/fatwa-amja-insulted-god-in-anger
class: work
kind: fatwa
label: { ar: "سب الله في حالة الغضب", en: "Insulting God in a rage — the door of repentance", ur: "غصے میں اللہ کی توہین — توبہ", es: "Insultar a Dios en un arrebato de ira: la puerta al arrepentimiento.", fr: "Insulter Dieu sous le coup de la colère — la porte du repentir" }
summary:
  ar: "سأل سائل أنه سب ربه أكثر من مرة عن جهل فماذا عليه ليكفر عن جريمته. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21857 بتاريخ 13 يوليو 2007)⁩ بالاستعاذة بالله من غضبه وعقابه وأمره أن يتوب إلى الله فورًا مستغفرًا منيبًا إليه وأن يعود إلى إسلامه ودينه قبل أن يفاجئه الموت ويلقى الله الجبار بهذه الموبقة وأن يكثر من الحسنات بعد البكاء خوفًا وخشية والعزم الأكيد على عدم العود أبدًا وعلى عدم الغضب فكانت وصية النبي لا تغضب ثلاثًا، وأن يعلم أن باب التوبة مفتوح فليسرع إليه قبل الغرغرة وحينئذ لا ينفع مال ولا بنون."
  en: "A questioner who had several times, in ignorance, cursed his Lord in anger asked how to expiate the crime. The site's sharia department (fatwa no. 21857, 13 July 2007) answered seeking refuge in God from His wrath and punishment: repent at once, beseeching and turning to Him; return to your Islam and religion before death surprises you and you meet the Almighty with this destroying sin; multiply good deeds after weeping in fear and awe, with firm resolve never to return and not to anger — the Prophet's thrice-given counsel 'do not get angry'; and know that repentance's door is open — hasten to it before the death-rattle, when neither wealth nor sons avail."
  ur: "ایک سائل نے غصے میں اللہ کی توہین کی تھی۔ شریعت شعبے ⁦(فتویٰ 21857، 13 جولائی 2007)⁩ کے مطابق فوراً توبہ کرے، کلمہ دہرائے اور نیک اعمال بڑھائے — توبہ کا دروازہ کھلا ہے۔"
  es: "Un consultante que, por ignorancia, había maldecido a su Señor con ira en varias ocasiones, preguntó cómo expiar el pecado. El departamento de sharia del sitio (fatwa n.° 21857, 13 de julio de 2007) respondió buscando refugio en Dios de Su ira y castigo: arrepiéntete de inmediato, suplicándole y volviéndote a Él; regresa a tu Islam y religión antes de que la muerte te sorprenda y te encuentres con el Todopoderoso con este pecado destructivo; multiplica las buenas obras después de llorar con temor y reverencia, con la firme resolución de no volver jamás y no enojarte —el consejo dado tres veces por el Profeta: \"no te enojes\"—; y sabe que la puerta del arrepentimiento está abierta: apresúrate a ella antes del estertor de la muerte, cuando ni las riquezas ni los hijos servirán de nada."
  fr: "Un internaute, qui avait à plusieurs reprises, par ignorance, blasphémé contre son Seigneur sous le coup de la colère, demanda comment expier sa faute. Le département de la charia du site (fatwa n° 21857, 13 juillet 2007) répondit, en invitant à se réfugier auprès de Dieu contre Sa colère et Son châtiment: repentez-vous immédiatement, implorez-Le et tournez-vous vers Lui; revenez à l’islam et à votre religion avant que la mort ne vous surprenne et que vous ne rencontriez le Tout-Puissant avec ce péché dévastateur; multipliez les bonnes actions après avoir pleuré de crainte et de respect, avec la ferme résolution de ne jamais revenir sur votre faute et de ne pas vous mettre en colère – suivez le conseil donné à trois reprises par le Prophète: « Ne vous mettez pas en colère »; et sachez que la porte du repentir est ouverte – hâtez-vous d’y entrer avant l’agonie, lorsque ni les biens ni les enfants ne peuvent vous sauver."
