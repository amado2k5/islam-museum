summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(9–14 أبريل 2005م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. يتحدث البيان بلسان المجمع عن مخاوفه مما وصفه بأنشطة جماعات متطرفة تستهدف المسجد الأقصى ومحاولات اقتحام باحاته، ويؤكد مكانة الأقصى أولى القبلتين وثالث المساجد التي تشد إليها الرحال، ويحمّل سلطات الاحتلال والدول الداعمة لها مسؤولية أي اعتداء عليه، ويدعو الأمة والمنظمات الدولية إلى التحرك لحمايته. سُجّل بوصفه بيان المجمع، ملخصًا بحياد."
  en: "A statement issued by the International Islamic Fiqh Academy at its 16th session in Dubai (9–14 April 2005), published among the session materials though not a numbered resolution. In the Academy's own voice it voices alarm at what it describes as activities of extremist groups targeting al-Aqsa Mosque and attempts to storm its courtyards; affirms al-Aqsa's standing as first of the two qiblas and third of the mosques to which journeys are made; holds the occupying authorities and supporting states responsible for any attack on it; and calls on the umma and international organisations to act for its protection. Recorded as the Academy's own statement, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، دبئی میں سولہویں مجلس ⁦(9–14 اپریل 2005ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ اکیڈمی کی اپنی زبانی میں یہ مسجدِ اقصیٰ کو نشانہ بنانے والے اس کے بیان کردہ انتہا پسند گروہوں کی سرگرمیوں اور اس کے احاطوں میں گھسنے کی کوششوں پر تشویس ظاہر کرتا ہے؛ اقصیٰ کے مقام کو اولین قبلہ اور تیسرا مسجد جس کی طرف سفر جائز ہے تسلیم کرتا ہے؛ کسی بھی حملے کی ذمہ داری قبضہ کرنے والے اداروں اور ان کے حامی ممالک پر ڈالتا ہے؛ اور امت اور بین الاقوامی تنظیموں سے اس کی حفاظت کے لیے اقدام کا مطالبہ کرتا ہے۔ یہاں اکیڈمی کے اپنے بیان کا غیر جانبدارانہ خلاصہ درج ہے۔"
  es: "Declaración emitida por la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión en Dubái (9-14 de abril de 2005), publicada entre los materiales de la sesión, aunque no como resolución numerada. En su propia declaración, la Academia manifiesta su alarma ante lo que describe como actividades de grupos extremistas dirigidas contra la Mezquita de Al-Aqsa e intentos de asaltar sus patios; reafirma la posición de Al-Aqsa como la primera de las dos qiblas y la tercera mezquita a la que se realizan peregrinaciones; responsabiliza a las autoridades ocupantes y a los Estados que la apoyan de cualquier ataque contra ella; y exhorta a la umma y a las organizaciones internacionales a actuar para su protección. Registrada como la declaración de la Academia, resumida de forma neutral."
  fr: "Déclaration de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 16e session à Dubaï (9-14 avril 2005), publiée dans les documents de la session sans toutefois constituer une résolution numérotée. L'Académie y exprime son inquiétude face aux agissements de groupes extrémistes visant la mosquée Al-Aqsa et aux tentatives d'assaut de ses cours; elle réaffirme le statut d'Al-Aqsa comme première des deux qiblas et troisième lieu de pèlerinage; elle tient les autorités occupantes et les États qui les soutiennent responsables de toute attaque; et elle appelle la communauté musulmane (oumma) et les organisations internationales à agir pour sa protection. Ce texte est présenté comme la déclaration officielle de l'Académie, résumée de manière neutre."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (9–14 Nisan 2005) yayımladığı ve oturum materyallerinde yayımlanan bir açıklama, ancak bu karar numaralandırılmış bir karar değildir. Açıklama, Mescid-i Aksa Camii'ni hedef alan aşırı grup faaliyetleri ve avlularına saldırma girişimleri konusunda endişelerini dile getiriyor, Aksa'nın hacıların çekildiği iki kıbladan ilki ve üçüncü cami olarak statüsünü teyit ediyor, işgal makamlarını ve destekleyen ülkeleri bu saldırıdan sorumlu tutuyor ve ulus ile uluslararası kuruluşları onu korumak için harekete geçmeye çağırıyor. Akademi'nin açıklaması olarak kaydedilen, tarafsız bir özet olarak kaydediliyor."
  id: "Pernyataan yang dikeluarkan oleh International Islamic Fiqh Academy pada sesi keenam belas di Dubai (9–14 April 2005), diterbitkan dalam materi sesi, meskipun bukan keputusan bernomor. Pernyataan tersebut menyatakan keprihatinannya atas apa yang digambarkan sebagai aktivitas kelompok ekstremis yang menargetkan Masjid Al-Aqsa dan upaya menyerbu halaman-halaman masjidnya, menegaskan status Al-Aqsa sebagai qibla pertama dari dua masjid dan masjid ketiga yang didatangi para jemaah, menyalahkan otoritas pendudukan dan negara pendukungnya atas setiap serangan terhadapnya, serta menyerukan kepada bangsa dan organisasi internasional untuk bertindak melindunginya. Tercatat sebagai pernyataan Akademi, ringkasan netral."
