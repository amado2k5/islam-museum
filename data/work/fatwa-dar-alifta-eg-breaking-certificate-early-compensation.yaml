summary:
  ar: "سائل سأل عن الاتفاق مع والدته على فك شهادة استثمار تملكها قبل موعدها وإعطاء قيمتها مع تعويض عن خسارة الأرباح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20851)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about agreeing with his mother to break her investment certificate before its term, giving her its value with compensation for lost profit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20851) answered by setting out the ruling."
  ur: "ایک سائل نے والدہ کے سرمایہ کاری سرٹیفکیٹ کو مدت سے پہلے توڑ کر اس کی قیمت اور منافع کی تلافی دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20851)⁩ نے جواب میں اس کا حکم بیان کیا۔"
