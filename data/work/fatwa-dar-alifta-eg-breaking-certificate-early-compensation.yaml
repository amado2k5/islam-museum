id: work/fatwa-dar-alifta-eg-breaking-certificate-early-compensation
class: work
kind: fatwa
label: { ar: "حكم فك الشهادة مع التعويض عن خسارة الأرباح", en: "Breaking an investment certificate early with compensation for lost profit", ur: "سرمایہ کاری سرٹیفکیٹ کو مدت سے پہلے توڑنا اور تلافی", es: "Cancelación anticipada de un certificado de inversión con compensación por lucro cesante.", fr: "Rupture anticipée d'un certificat d'investissement avec compensation du manque à gagner", tr: "Kâr kaybı tazminatı ile sertifikanın iptaline ilişkin karar", id: "Putusan pencabutan sertifikat dengan kompensasi atas kehilangan keuntungan" }
summary:
  ar: "سائل سأل عن الاتفاق مع والدته على فك شهادة استثمار تملكها قبل موعدها وإعطاء قيمتها مع تعويض عن خسارة الأرباح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20851)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about agreeing with his mother to break her investment certificate before its term, giving her its value with compensation for lost profit. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20851) answered by setting out the ruling."
  ur: "ایک سائل نے والدہ کے سرمایہ کاری سرٹیفکیٹ کو مدت سے پہلے توڑ کر اس کی قیمت اور منافع کی تلافی دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20851)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre la conveniencia de acordar con su madre la cancelación anticipada de su certificado de inversión, entregándole su valor junto con una compensación por las ganancias perdidas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20851) respondió exponiendo la normativa al respecto."
  fr: "Un homme a demandé s'il était possible de convenir avec sa mère de résilier son certificat d'investissement avant son échéance, en lui versant sa valeur et une compensation pour le manque à gagner. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20851) a répondu en énonçant la décision."
  tr: "Bir soru soran kişi, annesiyle sahip olduğu yatırım sertifikasının vade tarihinden önce serbest bırakılması ve değerinin ile kâr kaybı için tazminat verilmesi konusunda yaptığı anlaşmayı sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 20851) bu konudaki kararı netleştirerek yanıt verdi."
  id: "Seorang penanya menanyakan tentang kesepakatan dengan ibunya untuk melepaskan sertifikat investasi yang dimilikinya sebelum jatuh tempo dan memberikan nilainya beserta kompensasi atas kehilangan keuntungan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20851) menanggapi dengan memperjelas putusan mengenai masalah ini."
