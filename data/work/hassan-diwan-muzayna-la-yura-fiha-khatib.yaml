label: { ar: "هجاء حسان لمزينة «مزينة لا يرى فيها خطيب»", en: "Hassan's satire of Muzayna, 'Muzayna: no orator is seen among them'", es: "La sátira de Hassan sobre Muzayna, 'Muzayna: entre ellos no se ve ningún orador'.", fr: "Satire de Hassan sur Muzayna, « Muzayna: aucun orateur n'est visible parmi eux »", ur: "حسن کا مزینہ کا طنز، 'مزینہ: ان میں کوئی خطیب نظر نہیں آتا'", tr: "Hassan'ın Mazina'ya hicvi: 'Vaizin görülmediği süslü bir yer'", id: "Satir Hassan terhadap Mazina: 'Sebuah yang dihias di mana tidak ada pengkhotbah yang terlihat'" }
summary:
  ar: "أبيات هجاء لحسان بن ثابت من الوافر على روي الباء، كما في شرح البرقوقي الذي يذكر بحرها في رأسها {{cite:sharh-diwan-hassan-barquqi-1929 p.57}}. الهجاء هنا وصف أدبي من الديوان ولا يتبنى المتحف حكمه."
  en: "Satirical verses by Hassan ibn Thabit in the wafir metre on the rhyme الباء, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.57}}. The satire is reported as a literary text; the museum does not adopt its judgement."
  es: "Versos satíricos de Hassan ibn Thabit en metro wafir con rima الباء, como en el comentario de al-Barquqi, que indica el metro en su encabezado {{cite:sharh-diwan-hassan-barquqi-1929 p.57}}. La sátira se considera un texto literario; el museo no comparte esta valoración."
  fr: "Vers satiriques de Hassan ibn Thabit en mètre wafir sur la rime الباء, comme dans le commentaire d'al-Barquqi, qui mentionne le mètre dans son introduction {{cite:sharh-diwan-hassan-barquqi-1929 p.57}}. La satire est considérée comme un texte littéraire; le musée ne partage pas cette opinion."
  ur: "نظم الباء پر وفیر میٹر میں حسن بن ثابت کی طنزیہ آیات، جیسا کہ البرقی کی تفسیر میں ہے، جس کے عنوان {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 57}} میں میٹر کو بیان کیا گیا ہے۔ طنز کو ایک ادبی متن کے طور پر رپورٹ کیا جاتا ہے۔ میوزیم اپنے فیصلے کو نہیں اپناتا ہے۔"
  tr: "Al-Wafir'den Hasan ibn Thabit'in Ba' harfi üzerine yazdığı hiciv dizeleri, Al-Barquqi'nin yorumunda olduğu gibi, başta ölçüsünden bahsedilir {{cite:sharh-diwan-hassan-barquqi-1929 s.57}}. Burada hiciv, koleksiyonun edebi bir tanımıdır ve müze onun kararını benimsemez."
  id: "Satire oleh Hassan ibn Thabit dari Al-Wafir tentang huruf Ba', seperti dalam komentar Al-Barquqi, yang menyebutkan meternya di awal {{cite:sharh-diwan-hassan-barquqi-1929 hlm.57}. Di sini, satir adalah deskripsi sastra tentang koleksi ini, dan museum tidak mengadopsi keputusannya."
