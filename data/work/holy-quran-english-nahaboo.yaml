summary:
  ar: "ترجمة إنجليزية لمعاني القرآن نشرها حسين ناهابو على نفقته في موريشيوس سنة 1987، مع ترجمة فرنسية صدرت في الوقت نفسه تقريبًا، بعد ترجمته الكريولية؛ بإنجليزية حديثة تتجنب أسلوب الملك جيمس، مع حواشٍ تكفي للفهم، متأثرة بترجمة عبد الله يوسف علي، ساعيًا إلى التوفيق بين التفسيرات والابتعاد عن الخلاف."
  en: "An English rendering of the meanings of the Qur'an self-published in Mauritius in 1987 by Houssein Nahaboo, with a French translation issued at about the same time, after his Creole one; in modern English avoiding the King James style, with just enough notes to understand the text, influenced by Abdullah Yusuf Ali's translation, and seeking to harmonise interpretations and avoid division."
  ur: "قرآن کے معانی کا انگریزی ترجمہ جو حسین ناہابو نے 1987 میں ماریشس میں اپنے خرچ پر شائع کیا، تقریباً اسی وقت فرانسیسی ترجمے کے ساتھ اور کریول ترجمے کے بعد؛ کنگ جیمس اسلوب سے بچتی جدید انگریزی، فہم کے لیے کافی حواشی، عبد اللہ یوسف علی کے ترجمے کا اثر، اور تفسیروں میں تطبیق اور اختلاف سے گریز۔"
