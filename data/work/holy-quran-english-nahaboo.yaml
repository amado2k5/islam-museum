label: { ar: "القرآن المقدس: النص العربي وترجمته الإنجليزية ⁦(حسين ناهابو)⁩", en: "The Holy Qurān: The Arabic Text and its Translation in the English Language (Houssein Nahaboo)", ur: "دی ہولی قرآن: عربی متن اور انگریزی ترجمہ ⁦(حسین ناہابو)⁩", es: "El Sagrado Corán: El texto árabe y su traducción al inglés (Houssein Nahaboo)", fr: "Le Saint Coran: le texte arabe et sa traduction en langue anglaise (Houssein Nahaboo)" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن نشرها حسين ناهابو على نفقته في موريشيوس سنة 1987، مع ترجمة فرنسية صدرت في الوقت نفسه تقريبًا، بعد ترجمته الكريولية؛ بإنجليزية حديثة تتجنب أسلوب الملك جيمس، مع حواشٍ تكفي للفهم، متأثرة بترجمة عبد الله يوسف علي، ساعيًا إلى التوفيق بين التفسيرات والابتعاد عن الخلاف."
  en: "An English rendering of the meanings of the Qur'an self-published in Mauritius in 1987 by Houssein Nahaboo, with a French translation issued at about the same time, after his Creole one; in modern English avoiding the King James style, with just enough notes to understand the text, influenced by Abdullah Yusuf Ali's translation, and seeking to harmonise interpretations and avoid division."
  ur: "قرآن کے معانی کا انگریزی ترجمہ جو حسین ناہابو نے 1987 میں ماریشس میں اپنے خرچ پر شائع کیا، تقریباً اسی وقت فرانسیسی ترجمے کے ساتھ اور کریول ترجمے کے بعد؛ کنگ جیمس اسلوب سے بچتی جدید انگریزی، فہم کے لیے کافی حواشی، عبد اللہ یوسف علی کے ترجمے کا اثر، اور تفسیروں میں تطبیق اور اختلاف سے گریز۔"
  es: "Una traducción al inglés de los significados del Corán, autopublicada en Mauricio en 1987 por Houssein Nahaboo, con una traducción al francés publicada casi al mismo tiempo, después de su traducción al criollo; en inglés moderno, evitando el estilo de la Biblia King James, con las notas justas para comprender el texto, influenciada por la traducción de Abdullah Yusuf Ali, y que busca armonizar las interpretaciones y evitar la división."
  fr: "Une traduction anglaise des significations du Coran autoéditée à Maurice en 1987 par Houssein Nahaboo, avec une traduction française publiée à peu près au même moment, après sa traduction créole; en anglais moderne évitant le style du roi Jacques, avec juste assez de notes pour comprendre le texte, influencée par la traduction d'Abdullah Yusuf Ali, et cherchant à harmoniser les interprétations et à éviter la division."
