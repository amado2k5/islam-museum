id: work/fatwa-dar-alifta-eg-selling-anything-of-udhiyya
class: work
kind: fatwa
label: { ar: "حكم بيع شيء من الأضحية", en: "Selling any part of the udhiyya", ur: "قربانی کے کسی حصے کی فروخت" }
summary:
  ar: "سائل سأل عن بيع شيء من لحوم الأضاحي وإعطاء الجزار منها على سبيل الأجرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20830)⁩ أنه لا يجوز بيع شيء من لحوم الأضاحي مطلقًا ولا إعطاء الجزار شيئًا منها على سبيل الأجرة ولكن له أن يتصدق بجلدها على ما فصّل الجواب."
  en: "A questioner asked about selling any part of the udhiyya's meat and paying the butcher from it as wages. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20830) answered that nothing of the meat may be sold at all, nor may the butcher be paid from it — though the hide may be given in charity — as the answer details."
  ur: "ایک سائل نے قربانی کے گوشت کا کوئی حصہ بیچنے اور قصاب کو اجرت میں دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20830)⁩ نے جواب دیا کہ گوشت کا کچھ بھی حصہ فروخت یا اجرت میں دینا جائز نہیں لیکن کھال صدقہ کی جا سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
