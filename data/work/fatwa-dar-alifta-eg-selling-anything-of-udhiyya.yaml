id: work/fatwa-dar-alifta-eg-selling-anything-of-udhiyya
class: work
kind: fatwa
label: { ar: "حكم بيع شيء من الأضحية", en: "Selling any part of the udhiyya", ur: "قربانی کے کسی حصے کی فروخت", es: "Vender cualquier parte de la udhiyya", fr: "La vente de toute partie de l'udhiyya" }
summary:
  ar: "سائل سأل عن بيع شيء من لحوم الأضاحي وإعطاء الجزار منها على سبيل الأجرة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20830)⁩ أنه لا يجوز بيع شيء من لحوم الأضاحي مطلقًا ولا إعطاء الجزار شيئًا منها على سبيل الأجرة ولكن له أن يتصدق بجلدها على ما فصّل الجواب."
  en: "A questioner asked about selling any part of the udhiyya's meat and paying the butcher from it as wages. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20830) answered that nothing of the meat may be sold at all, nor may the butcher be paid from it — though the hide may be given in charity — as the answer details."
  ur: "ایک سائل نے قربانی کے گوشت کا کوئی حصہ بیچنے اور قصاب کو اجرت میں دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20830)⁩ نے جواب دیا کہ گوشت کا کچھ بھی حصہ فروخت یا اجرت میں دینا جائز نہیں لیکن کھال صدقہ کی جا سکتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de vender alguna parte de la carne de la udhiyya y pagar al carnicero con ella como salario. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20830) respondió que no se puede vender ninguna parte de la carne, ni se puede pagar al carnicero con ella, aunque la piel sí se puede donar a la caridad, como se detalla en la respuesta."
  fr: "Une personne a demandé si la vente de la viande de l'udhiyya et le paiement du boucher à partir de cette vente étaient autorisés. Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20830) a répondu qu'aucune partie de la viande ne pouvait être vendue, ni le boucher payé avec cette viande; la peau, en revanche, pouvait être donnée en aumône, comme le précise la réponse."
