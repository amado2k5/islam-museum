id: work/fatwa-aliftaa-jo-daughter-reducing-support-to-her-mother
class: work
kind: fatwa
label: { ar: "ابنة متزوجة قلّلت مساعدتها المالية لأمها", en: "A married daughter who reduced her financial help to her mother", ur: "شادی شدہ بیٹی جس نے ماں کی مالی مدد کم کر دی" }
summary:
  ar: "سؤال عن ابنة متزوجة قلّلت ما كانت تعطيه لأمها الأرملة فقاطعتها الأم، أجابت فيه دائرة الإفتاء العام الأردنية بأن تقليل النفقة لعذر لا يُعد عقوقًا، وأن نفقة الأم المعسرة على جميع أبنائها، وأنه لا يجوز للأم قطع ابنتها. أجابت الدائرة بأن الإسلام دعا إلى بر الوالدين ومساعدتهما بالجهد والمال والأدب معهما، خاصة عند الكبر. وقالت إن نفقة الأم المعسرة تُقسم على أبنائها ذكورًا وإناثًا بقدر كفايتها، مستشهدة بالمادة 197 من قانون الأحوال الشخصية الأردني التي توجب على الولد الموسر نفقة والديه الفقيرين، فلا يُحمَّل بعض الأبناء النفقة دون بعض إذا قدروا جميعًا. وإن كانت الأم مكفية فلا يجوز لها أن تحمّل ابنتها ما يزيد على حاجتها، ولا يجوز لها في كل حال أن تقطع ابنتها أو تأمر أبناءها بذلك لأنه أمر بقطيعة الرحم، ونقلت عن ابن حجر الهيتمي في الزواجر ضابط القطيعة المحرمة. وخلصت إلى أن على البنت أن تبقى محسنة لأمها مطيعة لها، وأن تقليلها النفقة على الصورة المذكورة لا يُعد عقوقًا إن كانت معذورة بعدم كفاية دخلها."
  en: "A question about a married daughter who reduced what she gave her widowed mother, after which the mother cut her off, in which Jordan's General Iftaa Department answered that reducing support for a valid reason is not undutifulness, that a needy mother's maintenance falls on all her children, and that the mother may not sever ties with her daughter. The Department answered that Islam calls for kindness to parents and helping them with effort and money, and courtesy towards them, especially in old age. It said a needy mother's maintenance is shared among her sons and daughters to the extent of her needs, citing article 197 of Jordan's Personal Status Law, which obliges a child of means to maintain poor parents, so some children may not bear it alone if all are able. If the mother's needs are met, she may not load her daughter with more than she needs, and in any case she may not cut off her daughter or order her children to do so, since that is ordering the severing of kinship ties; it quoted Ibn Hajar al-Haytami's al-Zawajir on what makes cutting kin forbidden. It concluded that the daughter should stay kind and obedient to her mother, and that reducing support in the way described is not undutifulness if she is excused by an income that does not suffice."
  ur: "ایک شادی شدہ بیٹی کے بارے میں سوال جس نے اپنی بیوہ ماں کو دی جانے والی رقم کم کر دی تو ماں نے اس سے قطع تعلق کر لیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ عذر کی بنا پر مدد کم کرنا نافرمانی نہیں، تنگ دست ماں کا نفقہ تمام اولاد پر ہے، اور ماں کے لیے بیٹی سے قطع تعلق جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام والدین سے حسنِ سلوک، محنت اور مال سے ان کی مدد اور ان کے ساتھ ادب کی تلقین کرتا ہے، خصوصاً بڑھاپے میں۔ اس نے کہا کہ تنگ دست ماں کا نفقہ اس کی ضرورت کے مطابق بیٹوں اور بیٹیوں میں تقسیم ہوتا ہے، اور اردن کے پرسنل اسٹیٹس قانون کی دفعہ 197 کا حوالہ دیا جو صاحبِ حیثیت اولاد پر غریب والدین کا نفقہ لازم کرتی ہے، لہٰذا سب کے قادر ہونے کی صورت میں بوجھ صرف بعض پر نہیں ڈالا جا سکتا۔ اگر ماں کی ضروریات پوری ہوں تو وہ بیٹی پر ضرورت سے زیادہ بوجھ نہیں ڈال سکتی، اور کسی بھی حال میں بیٹی سے قطع تعلق یا اپنے بچوں کو اس کا حکم دینا جائز نہیں کیونکہ یہ قطع رحمی کا حکم ہے؛ اس نے ابن حجر الہیتمی کی الزواجر سے حرام قطع رحمی کا ضابطہ نقل کیا۔ اس نے نتیجہ نکالا کہ بیٹی ماں سے حسنِ سلوک اور اطاعت جاری رکھے، اور مذکورہ صورت میں مدد کم کرنا نافرمانی نہیں اگر آمدنی ناکافی ہونے کی وجہ سے وہ معذور ہو۔"
