id: work/fatwa-aliftaa-jo-daughter-reducing-support-to-her-mother
class: work
kind: fatwa
label: { ar: "ابنة متزوجة قلّلت مساعدتها المالية لأمها", en: "A married daughter who reduced her financial help to her mother", ur: "شادی شدہ بیٹی جس نے ماں کی مالی مدد کم کر دی", es: "Una hija casada que redujo su ayuda económica a su madre.", fr: "Une fille mariée qui a réduit son aide financière à sa mère", tr: "Evli bir kız, annesine maddi desteğini azalttı", id: "Seorang putri yang sudah menikah mengurangi dukungan finansialnya untuk ibunya" }
summary:
  ar: "سؤال عن ابنة متزوجة قلّلت ما كانت تعطيه لأمها الأرملة فقاطعتها الأم، أجابت فيه دائرة الإفتاء العام الأردنية بأن تقليل النفقة لعذر لا يُعد عقوقًا، وأن نفقة الأم المعسرة على جميع أبنائها، وأنه لا يجوز للأم قطع ابنتها. أجابت الدائرة بأن الإسلام دعا إلى بر الوالدين ومساعدتهما بالجهد والمال والأدب معهما، خاصة عند الكبر. وقالت إن نفقة الأم المعسرة تُقسم على أبنائها ذكورًا وإناثًا بقدر كفايتها، مستشهدة بالمادة 197 من قانون الأحوال الشخصية الأردني التي توجب على الولد الموسر نفقة والديه الفقيرين، فلا يُحمَّل بعض الأبناء النفقة دون بعض إذا قدروا جميعًا. وإن كانت الأم مكفية فلا يجوز لها أن تحمّل ابنتها ما يزيد على حاجتها، ولا يجوز لها في كل حال أن تقطع ابنتها أو تأمر أبناءها بذلك لأنه أمر بقطيعة الرحم، ونقلت عن ابن حجر الهيتمي في الزواجر ضابط القطيعة المحرمة. وخلصت إلى أن على البنت أن تبقى محسنة لأمها مطيعة لها، وأن تقليلها النفقة على الصورة المذكورة لا يُعد عقوقًا إن كانت معذورة بعدم كفاية دخلها."
  en: "A question about a married daughter who reduced what she gave her widowed mother, after which the mother cut her off, in which Jordan's General Iftaa Department answered that reducing support for a valid reason is not undutifulness, that a needy mother's maintenance falls on all her children, and that the mother may not sever ties with her daughter. The Department answered that Islam calls for kindness to parents and helping them with effort and money, and courtesy towards them, especially in old age. It said a needy mother's maintenance is shared among her sons and daughters to the extent of her needs, citing article 197 of Jordan's Personal Status Law, which obliges a child of means to maintain poor parents, so some children may not bear it alone if all are able. If the mother's needs are met, she may not load her daughter with more than she needs, and in any case she may not cut off her daughter or order her children to do so, since that is ordering the severing of kinship ties; it quoted Ibn Hajar al-Haytami's al-Zawajir on what makes cutting kin forbidden. It concluded that the daughter should stay kind and obedient to her mother, and that reducing support in the way described is not undutifulness if she is excused by an income that does not suffice."
  ur: "ایک شادی شدہ بیٹی کے بارے میں سوال جس نے اپنی بیوہ ماں کو دی جانے والی رقم کم کر دی تو ماں نے اس سے قطع تعلق کر لیا، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ عذر کی بنا پر مدد کم کرنا نافرمانی نہیں، تنگ دست ماں کا نفقہ تمام اولاد پر ہے، اور ماں کے لیے بیٹی سے قطع تعلق جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام والدین سے حسنِ سلوک، محنت اور مال سے ان کی مدد اور ان کے ساتھ ادب کی تلقین کرتا ہے، خصوصاً بڑھاپے میں۔ اس نے کہا کہ تنگ دست ماں کا نفقہ اس کی ضرورت کے مطابق بیٹوں اور بیٹیوں میں تقسیم ہوتا ہے، اور اردن کے پرسنل اسٹیٹس قانون کی دفعہ 197 کا حوالہ دیا جو صاحبِ حیثیت اولاد پر غریب والدین کا نفقہ لازم کرتی ہے، لہٰذا سب کے قادر ہونے کی صورت میں بوجھ صرف بعض پر نہیں ڈالا جا سکتا۔ اگر ماں کی ضروریات پوری ہوں تو وہ بیٹی پر ضرورت سے زیادہ بوجھ نہیں ڈال سکتی، اور کسی بھی حال میں بیٹی سے قطع تعلق یا اپنے بچوں کو اس کا حکم دینا جائز نہیں کیونکہ یہ قطع رحمی کا حکم ہے؛ اس نے ابن حجر الہیتمی کی الزواجر سے حرام قطع رحمی کا ضابطہ نقل کیا۔ اس نے نتیجہ نکالا کہ بیٹی ماں سے حسنِ سلوک اور اطاعت جاری رکھے، اور مذکورہ صورت میں مدد کم کرنا نافرمانی نہیں اگر آمدنی ناکافی ہونے کی وجہ سے وہ معذور ہو۔"
  es: "Una pregunta sobre una hija casada que redujo lo que le daba a su madre viuda, después de lo cual la madre la dejó de ayudar, en la que el Departamento General de Iftaa de Jordania respondió que reducir el sustento por una razón válida no es falta de deber, que el sustento de una madre necesitada recae sobre todos sus hijos, y que la madre no puede romper los lazos con su hija. El Departamento respondió que el Islam exige bondad hacia los padres y ayudarlos con esfuerzo y dinero, y cortesía hacia ellos, especialmente en la vejez. Dijo que el sustento de una madre necesitada se comparte entre sus hijos e hijas en la medida de sus necesidades, citando el artículo 197 de la Ley de Estatuto Personal de Jordania, que obliga a un hijo con recursos a mantener a padres pobres, por lo que algunos hijos no pueden asumirlo solos si todos pueden. Si las necesidades de la madre están cubiertas, no puede sobrecargar a su hija con más de lo que necesita, y en ningún caso puede dejar de ayudarla ni ordenar a sus hijos que lo hagan, ya que eso es ordenar la ruptura de los lazos de parentesco; Citaba la obra Al-Zawajir de Ibn Hajar al-Haytami sobre lo que prohíbe la separación de parientes. Concluía que la hija debía ser amable y obediente con su madre, y que reducir el sustento de la forma descrita no constituía una falta grave si se justificaba por unos ingresos insuficientes."
  fr: "Une question concernait une fille mariée qui avait réduit sa pension alimentaire envers sa mère veuve, ce qui avait entraîné le rejet de cette dernière. Le Département général de la sagesse (Iftaa) de Jordanie a répondu que réduire la pension alimentaire pour un motif valable n'était pas un manquement à son devoir, que l'entretien d'une mère nécessiteuse incombait à tous ses enfants et que la mère ne pouvait rompre les liens avec sa fille. Le Département a expliqué que l'Islam prônait la bienveillance envers les parents, l'aide financière et matérielle, ainsi que la courtoisie, en particulier à un âge avancé. Il a précisé que l'entretien d'une mère nécessiteuse était partagé entre ses fils et ses filles en fonction de ses besoins, citant l'article 197 de la loi jordanienne sur le statut personnel, qui oblige un enfant aisé à subvenir aux besoins de ses parents pauvres. Ainsi, si tous les enfants en ont les moyens, certains enfants ne peuvent assumer seuls cette charge. Si les besoins de la mère sont satisfaits, elle ne peut imposer à sa fille une charge supérieure à ses besoins et, en aucun cas, elle ne peut la rejeter ni ordonner à ses enfants de le faire, car cela reviendrait à rompre les liens de parenté. L'article citait l'ouvrage al-Zawajir d'Ibn Hajar al-Haytami, qui explique pourquoi couper les ponts avec sa famille est interdit. Il concluait que la fille devait rester bienveillante et obéissante envers sa mère, et que réduire le soutien financier de la manière décrite n'était pas un manquement à son devoir si elle était justifiée par des revenus insuffisants."
  tr: "Evli bir kız çocuğun, dul annesine verdiği miktarı azalttığı ama annenin onu sözünü kestiği sorusunu sordu. Ürdün Genel Fetva Dairesi, mazeret için nafakanın azaltılmasının itaatsizlik sayılmadığını, zor durumda olan bir annenin tüm çocuklarını kapsadığını ve bir annenin kızını hayatını kesmesinin izin verilmediğini yanıtladı. Bakanlık, İslam'ın ebeveynlere saygı göstermeyi ve özellikle yaşlılıkta onlara emek, para ve nezaket göstererek yardım etmeyi önerdiğini yanıtladı. Zor durumda olan bir annenin bakımının, çocukları arasında, hem erkek hem kız çocukları arasında, mümkün olduğunca paylaştırıldığını, Ürdün Kişisel Statü Kanunu'nun 197. maddesine atıfta bulunarak, zengin bir çocuğun yoksul ebeveynlerini desteklemesini zorunlu kıldığını belirtti; bu nedenle bazı çocuklar başkalarını hariç tutar, eğer herkes mümkünse. Anne yeterliyse, kızını ihtiyacının ötesinde taşımasına izin verilmez; ayrıca akrabalık bağlarının kesilmesini emrettiği için kızını kesmek ya da çocuklarına bunu emretmek de kabul edilemez. Yasak ayrılık kararı olarak El-Zevacir'de İbn Hajar el-Haytami'yi alıntıladı. Kızın annesine nazik kalması ve itaat etmesi gerektiğini, nafaka ücretini azaltılmasının, yeterli gelir eksikliği nedeniyle affedilirse itaatsizlik sayılmayacağını belirtti."
  id: "Sebuah pertanyaan tentang seorang putri yang sudah menikah yang mengurangi apa yang dia berikan kepada ibunya yang janda, tetapi ibu tersebut memotongnya. Departemen Fatwa Umum Yordania menanggapi bahwa mengurangi tunjangan sebagai alasan tidak dianggap pembangkangan, bahwa pemeliharaan ibu yang berjuang mencakup semua anaknya, dan bahwa tidak diperbolehkan bagi seorang ibu untuk memotong hubungan dengan putrinya. Departemen tersebut menjawab bahwa Islam menyerukan penghormatan kepada orang tua dan membantu mereka dengan usaha, uang, dan kesopanan kepada mereka, terutama di usia lanjut. Departemen itu menyatakan bahwa tunjangan ibu yang berjuang dibagi di antara anak-anaknya, baik laki-laki maupun perempuan, sebisa mungkin, mengutip Pasal 197 Undang-Undang Status Pribadi Yordania, yang mewajibkan anak kaya untuk mendukung orang tua miskinnya, sehingga beberapa anak tidak menanggung tunjangan kecuali yang lain jika semua mampu. Jika ibu cukup, ia tidak diizinkan membawa putrinya melebihi kebutuhannya, dan tidak diperbolehkan memutus hubungan atau memerintahkan anak-anaknya melakukannya, karena ia memerintahkan pemutusan ikatan kekerabatan. Ia mengutip Ibn Hajar al-Haytami dalam Al-Zawajir sebagai aturan pemutusan yang dilarang. Ia menyimpulkan bahwa putri harus tetap baik kepada ibunya dan mematuhinya, dan mengurangi nafkah seperti yang disebutkan tidak dianggap pembangkangan jika ia dibebaskan karena penghasilan yang tidak cukup."
