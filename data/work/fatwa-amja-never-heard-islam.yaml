id: work/fatwa-amja-never-heard-islam
class: work
kind: fatwa
label: { ar: "من لم تبلغه الدعوة يوم القيامة", en: "The one the call never reached, on Judgment Day", ur: "جن تک دعوت نہ پہنچی — قیامت میں ان کا حشر", es: "Aquel a quien nunca llegó la llamada, en el Día del Juicio Final.", fr: "Celui que l'appel n'a jamais atteint, le jour du jugement dernier" }
summary:
  ar: "سأل سائل عن من مات على غير الإسلام ولم يسمع عنه أو لم يسمع إلا كذبًا وافتراءً على الدين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80442 بتاريخ 11 نوفمبر 2009)⁩ أن الله لا يعذب أحدًا إلا إذا بلغته الدعوة وأقيمت عليه الحجة الرسالية لقوله وما كنا معذبين حتى نبعث رسولًا، ومن لم تبلغه الدعوة وكان مريدًا للهدى عاجزًا عن معرفته يقاس على أصحاب الفترات ضمن الأربعة الذين يدلون على الله بحجة يوم القيامة فيوقد الله لهم نارًا ويأمرهم بدخولها فمن أطاعه جعلها عليه بردًا وسلامًا ومن عصاه أكبه في النار على وجهه، وذكر حديث الأربعة الأصم والأحمق والهرم ومن مات في الفترة."
  en: "A questioner said that one who dies outside Islam today having never heard of it — or heard only lies about it — has his account with God, and was challenged. Dr. Salah al-Sawi (fatwa no. 80442, 11 November 2009) answered that God punishes no one until the call has reached him and the argument established — 'We never punish until We send a messenger'; one the call never reached who sought guidance but could not know it is measured by the people of the interval among the four who present their plea on Judgment Day, when God kindles a fire and orders them to enter — whoever obeys finds it cool and safe, whoever disobeys is cast on his face; and he cited the hadith of the four: the deaf man, the simpleton, the senile, and him who died in the interval. Recorded as AMJA's answer."
  ur: "ایک سائل نے کہا کہ جسے اسلام صرف جھوٹی صورت میں ملا اس کا حساب اللہ پر ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80442، 11 نومبر 2009)⁩ کے مطابق اللہ عذاب تب دیتا ہے جب حجت قائم ہو؛ اہل فترت جیسے چار قسم کے لوگ قیامت میں اپنے حجت پیش کریں گے۔"
  es: "Un interlocutor afirmó que quien muere hoy fuera del Islam, sin haber oído hablar jamás de él —o habiendo oído solo mentiras al respecto—, tiene cuentas pendientes con Dios, y fue interpelado. El Dr. Salah al-Sawi (fatwa n.º 80442, 11 de noviembre de 2009) respondió que Dios no castiga a nadie hasta que la llamada le llega y se establece el argumento: «Nunca castigamos hasta que enviamos un mensajero». Aquel a quien la llamada nunca llegó, que buscó guía pero no pudo conocerla, es juzgado por la gente del intervalo entre los cuatro que presentan su súplica el Día del Juicio, cuando Dios enciende un fuego y les ordena entrar: quien obedece lo encuentra fresco y seguro, quien desobedece es arrojado de bruces. Citó el hadiz de los cuatro: el sordo, el simple, el anciano y el que murió en el intervalo. Registrado como respuesta de AMJA."
  fr: "Un interrogateur a affirmé que celui qui meurt aujourd'hui hors de l'islam, sans jamais en avoir entendu parler – ou n'ayant entendu que des mensonges à son sujet – a des comptes à rendre à Dieu, et cette affirmation a été contestée. Le Dr Salah al-Sawi (fatwa n° 80442, 11 novembre 2009) a répondu que Dieu ne punit personne avant que l'appel ne lui soit parvenu et que l'argument soit établi: « Nous ne punissons jamais avant d'avoir envoyé un messager ». Celui qui n'a jamais reçu l'appel, qui a cherché la guidance mais ne pouvait la connaître, est jugé par rapport aux quatre personnes qui, entre-temps, présenteront leur requête le Jour du Jugement, lorsque Dieu allumera un feu et leur ordonnera d'y entrer. Celui qui obéit trouvera fraîcheur et sécurité, celui qui désobéit sera jeté face contre terre. Il a cité le hadith des quatre: le sourd, le simple d'esprit, le sénile et celui qui est mort entre-temps. Cette réponse a été consignée dans la fatwa de l'AMJA."
