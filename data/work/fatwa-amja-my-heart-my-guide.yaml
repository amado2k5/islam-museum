id: work/fatwa-amja-my-heart-my-guide
class: work
kind: fatwa
label: { ar: "قلبي دليلي على رضا الله", en: "Saying 'my heart tells me God's pleasure and anger'", ur: "میرا دل مجھے اللہ کے رضا و غضب کی خبر دیتا ہے" }
summary:
  ar: "سأل سائل عن حكم قول القائل أنا أعلم متى يرضى الله عني ومتى يغضب فقلبي دليلي. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81395 بتاريخ 1 مايو 2010)⁩ أن إطلاق هذا القول موضع نظر فقد يصح باعتبار ولا يصح باعتبار آخر، فهو يصح باعتبار أن الإثم ما حاك في صدرك وكرهت أن يطلع عليه الناس لحديث البر حسن الخلق والإثم ما حاك في صدرك عند مسلم وحديث البِرُّ ما سكنت إليه النفس واطمأن إليه القلب والإثم ما لم تسكن إليه النفس ولم يطمئن إليه القلب وإن أفتاك المفتون عند أحمد، وتابع بيان الوجه الآخر على ما فصّل."
  en: "A questioner asked about the saying 'I know when God is pleased with me and when angry — my heart is my guide'. Dr. Salah al-Sawi (fatwa no. 81395, 1 May 2010) answered that uttering it unqualified is open to question: it is sound in one respect — that sin is what wavers in your breast and you hate people to see, per Muslim's hadith 'righteousness is good character, and sin is what wavers in your breast and you hate for people to see', and Ahmad's 'righteousness is what the soul rests in and the heart is at peace with, sin what the soul does not rest in even if the muftis give you fatwa' — and he detailed the other respect in which it fails. Recorded as AMJA's answer."
  ur: "ایک سائل نے اس قول کا حکم پوچھا کہ میرا دل مجھے اللہ کے رضا و غضب بتا دیتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81395، 1 مئی 2010)⁩ کے مطابق یہ ایک اعتبار سے درست ہے — گناہ وہ ہے جو سینے میں ہچکچائے — مگر دوسرے اعتبار سے نہیں۔"
