id: work/fatwa-amja-my-heart-my-guide
class: work
kind: fatwa
label: { ar: "قلبي دليلي على رضا الله", en: "Saying 'my heart tells me God's pleasure and anger'", ur: "میرا دل مجھے اللہ کے رضا و غضب کی خبر دیتا ہے", es: "Decir \"mi corazón me dice el agrado y la ira de Dios\"", fr: "Dire « mon cœur me révèle la joie et la colère de Dieu »", tr: "Kalbim Tanrı'nın tatmininin kanıtıdır", id: "Hatiku adalah bukti kepuasan Tuhan" }
summary:
  ar: "سأل سائل عن حكم قول القائل أنا أعلم متى يرضى الله عني ومتى يغضب فقلبي دليلي. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81395 بتاريخ 1 مايو 2010)⁩ أن إطلاق هذا القول موضع نظر فقد يصح باعتبار ولا يصح باعتبار آخر، فهو يصح باعتبار أن الإثم ما حاك في صدرك وكرهت أن يطلع عليه الناس لحديث البر حسن الخلق والإثم ما حاك في صدرك عند مسلم وحديث البِرُّ ما سكنت إليه النفس واطمأن إليه القلب والإثم ما لم تسكن إليه النفس ولم يطمئن إليه القلب وإن أفتاك المفتون عند أحمد، وتابع بيان الوجه الآخر على ما فصّل."
  en: "A questioner asked about the saying 'I know when God is pleased with me and when angry — my heart is my guide'. Dr. Salah al-Sawi (fatwa no. 81395, 1 May 2010) answered that uttering it unqualified is open to question: it is sound in one respect — that sin is what wavers in your breast and you hate people to see, per Muslim's hadith 'righteousness is good character, and sin is what wavers in your breast and you hate for people to see', and Ahmad's 'righteousness is what the soul rests in and the heart is at peace with, sin what the soul does not rest in even if the muftis give you fatwa' — and he detailed the other respect in which it fails. Recorded as AMJA's answer."
  ur: "ایک سائل نے اس قول کا حکم پوچھا کہ میرا دل مجھے اللہ کے رضا و غضب بتا دیتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81395، 1 مئی 2010)⁩ کے مطابق یہ ایک اعتبار سے درست ہے — گناہ وہ ہے جو سینے میں ہچکچائے — مگر دوسرے اعتبار سے نہیں۔"
  es: "Un consultante preguntó sobre el dicho «Sé cuándo Dios está complacido conmigo y cuándo está enojado; mi corazón es mi guía». El Dr. Salah al-Sawi (fatwa n.° 81395, 1 de mayo de 2010) respondió que pronunciarlo sin reservas es cuestionable: es válido en un aspecto —que el pecado es aquello que vacila en tu pecho y odias que la gente vea, según el hadiz de Muslim: «La rectitud es el buen carácter, y el pecado es aquello que vacila en tu pecho y odias que la gente vea», y el de Ahmad: «La rectitud es aquello en lo que el alma descansa y con lo que el corazón está en paz, el pecado aquello en lo que el alma no descansa, incluso si los muftíes te dan una fatwa»— y detalló el otro aspecto en el que falla. Registrado como respuesta de AMJA."
  fr: "Un internaute a posé une question concernant le dicton: « Je sais quand Dieu est content de moi et quand il est en colère; mon cœur est mon guide. » Le Dr Salah al-Sawi (fatwa n° 81395, 1er mai 2010) a répondu que son interprétation sans nuance est discutable: elle est valable à un égard – le péché étant ce qui vacille dans le cœur et que l’on craint de montrer aux autres, conformément au hadith de Muslim: « La piété est une bonne conduite, et le péché est ce qui vacille dans le cœur et que l’on craint de montrer aux autres », et à l’avis d’Ahmad: « La piété est ce en quoi l’âme trouve le repos et le cœur la paix, le péché ce en quoi l’âme ne trouve pas le repos, même si les muftis émettent une fatwa » – mais il a détaillé l’autre aspect où elle présente des lacunes. Cette réponse est consignée dans la notice biographique d’AMJA."
  tr: "Bir soru soran kişi, 'Allah benden memnun olduğunda ve kızdığında bilirim, çünkü kalbim rehberimdir' diyen kişinin sözü hakkında verdiği karar hakkında soru soruldu. Dr. Salah Al-Sawy (1 Mayıs 2010 tarihli Fetva No. 81395) bu ifadenin genelleştirilmesinin değerlendirilmeye açık olduğunu ve başka bir görüşte geçerli olmayabileceğini yanıtladı. Günah, göğsüne işlenen şeydir ve iyi karakter doğruluğu konuşulduğu için insanların bunu okumasını sevmezsiniz, günah Müslümanlara göre kalbinize işlenmiştir ve doğruluk konuşması ruhun huzur bulduğu ve kalbin huzur bulduğu şeydir. Günah, ruhun huzur bulmadığı ve kalbin rahatlamadığı şeydir, merhumun fetvası Ahmed'de olsa bile. Diğer yönü ayrıntılı olarak açıklamaya devam etti."
  id: "Seorang penanya ditanya tentang putusan atas ucapan orang yang berkata, 'Aku tahu kapan Allah berkenan padaku dan ketika Dia marah, karena hatiku adalah penuntunku.' Dr. Salah Al-Sawy menjawab (Fatwa No. 81395 tanggal 1 Mei 2010) bahwa generalisasi pernyataan ini harus dipertimbangkan dan mungkin tidak valid dalam pandangan lain. Dosa adalah apa yang terjalin di dada dan kamu tidak suka orang membacanya karena pembicaraan tentang kebenaran dan watak baik, dan dosa adalah apa yang terjalin dalam hatimu menurut umat Islam, dan pembicaraan tentang kebenaran adalah apa yang jiwa temukan ketenangan dan hati merasa nyaman. Dosa adalah apa yang jiwa tidak menemukan ketenangan dan hati tidak merasa tenang karenanya, meskipun fatwa almarhum ada pada Ahmad. Dia melanjutkan menjelaskan aspek lain seperti yang dijelaskan."
