class: work
kind: lecture
label:
  ar: "سيرة رسول الله 2026، الحلقة 17: علاقة القرآن بالسيرة النبوية وأهمية معرفة أسباب النزول"
  en: "The Biography of the Messenger of God 2026, episode 17: The Qur'an and the biography, and why knowing the occasions of revelation matters"
  ur: "سیرتِ رسول اللہ 2026، قسط 17: قرآن اور سیرت کا تعلق اور اسباب نزول جاننے کی اہمیت"
  fr: "La biographie du Messager de Dieu 2026, épisode 17 : Le lien entre le Coran et la biographie du Prophète et l'importance de connaître les circonstances de la révélation"
  es: "La biografía del Mensajero de Dios 2026, episodio 17: La relación entre el Corán y la biografía del Profeta y la importancia de conocer las circunstancias de la revelación"
summary:
  ar: "بعد ترجمة موجزة للصحابي المبكر حاطب بن عمرو، يشرح المحاضر علاقة الآيات القرآنية بأحداث حياة النبي. فيقسم العلاقة إلى صلة صريحة وصلة ضمنية، ويسمّي المصادر التي تربط الآيات بالأحداث، وهي كتب أسباب النزول ودواوين الحديث وابن إسحاق وابن هشام وتفسير الطبري، ثم يسوق أمثلة مكية كثيرة تدور حول زعماء قريش الذين عارضوا النبي وحول المؤمنين الأوائل الذين تعرضوا للأذى."
  en: "After a short biography of the early Companion Hatib ibn Amr, the speaker explains how Qur'anic verses relate to events of the Prophet's life. He sorts the relationship into explicit and implicit links, names the sources that connect verses to events (books of occasions of revelation, the hadith collections, Ibn Ishaq and Ibn Hisham, and al-Tabari's tafsir), then gives many Meccan examples centred on the Quraysh leaders who opposed the Prophet and on the persecuted early believers."
  ur: "ابتدائی صحابی حاطب بن عمرو کی مختصر سوانح کے بعد مقرر بیان کرتے ہیں کہ قرآنی آیات کا نبی کی زندگی کے واقعات سے کیا تعلق ہے۔ وہ اس تعلق کو صریح اور ضمنی ربط میں تقسیم کرتے ہیں، ان مصادر کے نام بتاتے ہیں جو آیات کو واقعات سے جوڑتے ہیں، یعنی اسباب نزول کی کتابیں، حدیث کے مجموعے، ابن اسحاق اور ابن ہشام، اور طبری کی تفسیر، پھر مکی دور کی بہت سی مثالیں دیتے ہیں جن کا محور نبی کی مخالفت کرنے والے قریشی سردار اور ستائے گئے ابتدائی مومن ہیں۔"
  fr: "Après une courte biographie du Compagnon de la première heure Hatib ibn Amr, le conférencier explique comment les versets coraniques se rapportent aux événements de la vie du Prophète. Il classe le lien en lien explicite et lien implicite, nomme les sources qui rattachent les versets aux événements (les livres sur les circonstances de la révélation, les recueils de hadiths, Ibn Ishaq et Ibn Hisham, et le tafsir d'al-Tabari), puis donne de nombreux exemples mecquois centrés sur les chefs de Quraych qui s'opposaient au Prophète et sur les premiers croyants persécutés."
  es: "Tras una breve biografía del Compañero temprano Hatib ibn Amr, el conferenciante explica cómo se relacionan los versículos coránicos con los acontecimientos de la vida del Profeta. Clasifica el vínculo en explícito e implícito, nombra las fuentes que unen los versículos con los acontecimientos (los libros sobre las circunstancias de la revelación, las colecciones de hadices, Ibn Ishaq e Ibn Hisham, y el tafsir de al-Tabari) y luego ofrece muchos ejemplos mecanos centrados en los jefes de Quraysh que se oponían al Profeta y en los primeros creyentes perseguidos."
