label: { ar: "هل بطاقات الائتمان حلال؟", en: "Are Credit Cards Halal?", ur: "کیا کریڈٹ کارڈ حلال ہیں؟", es: "¿Son halal las tarjetas de crédito?", fr: "Les cartes de crédit sont-elles halal ?", tr: "Kredi kartları helal midir?", id: "Apakah kartu kredit itu halal?" }
summary:
  ar: "سؤال: هل بطاقات الائتمان حلال اقتناءً واستعمالًا؟ أجاب الشيخ عمر خان بفتوى المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت بتاريخ 5 أكتوبر 2026)⁩ أن اقتناء البطاقة الائتمانية التقليدية واستعمالها جائز لمن يسدد كامل الرصيد في موعده باطمئنان — مع استخدام الدفع التلقائي إن أمكن — كما نص الجواب على ضوابط ذلك."
  en: "A question: are credit cards halal to obtain and use? Shaykh Umer Khan answered for the Fiqh Council of North America (published 5 October 2026) that obtaining and using a conventional credit card is permissible for a Muslim who reliably pays the full statement balance by its due date — autopay to be used if possible — as the answer's conditions set out."
  ur: "سوال: کیا کریڈٹ کارڈ رکھنا اور استعمال کرنا حلال ہے؟ شیخ عمر خان نے فقہ کونسل آف نارتھ امریکہ کی طرف سے ⁦(شائع شدہ 5 اکتوبر 2026)⁩ جواب دیا کہ روایتی کریڈٹ کارڈ کا حصول اور استعمال اس مسلمان کے لیے جائز ہے جو ہر ماہ پورا بیلنس بروقت ادا کرتا ہو — ممکن ہو تو خودکار ادائیگی استعمال کی جائے — جیسا کہ جواب کی شرائط بیان کرتی ہیں۔"
  es: "Una pregunta: ¿es lícito obtener y usar tarjetas de crédito? El jeque Umer Khan respondió para el Consejo de Jurisprudencia Islámica de Norteamérica (publicado el 5 de octubre de 2026) que obtener y usar una tarjeta de crédito convencional es permisible para un musulmán que paga puntualmente el saldo total del estado de cuenta en su fecha de vencimiento —utilizando el pago automático si es posible— según las condiciones establecidas en la respuesta."
  fr: "Question: les cartes de crédit sont-elles halal ? Cheikh Umer Khan a répondu pour le Conseil de jurisprudence islamique d’Amérique du Nord (publication du 5 octobre 2026) que l’obtention et l’utilisation d’une carte de crédit classique sont permises à un musulman qui règle systématiquement l’intégralité du solde de son relevé à la date d’échéance – le paiement automatique étant privilégié – conformément aux conditions énoncées dans la réponse."
  tr: "Soru: Kredi kartlarının edinilmesi ve kullanılması mümkün mü? Şeyh Ömer Khan, Kuzey Amerika Fiqh Konseyi'nin (5 Ekim 2026'da yayımlanan) fetvasına karşılık olarak, geleneksel kredi kartı edinip kullanmanın, tüm bakiyeyi zamanında ve güvenle ödeyenlerin izin verdiği yönünde—mümkünse otomatik ödeme kullanılarak—ve yanıtta bunun için düzenlemeler de belirtildi."
  id: "Pertanyaan: Apakah kartu kredit diperbolehkan untuk diperoleh dan digunakan? Sheikh Omar Khan menanggapi melalui fatwa Dewan Fiqh Amerika Utara (diterbitkan pada 5 Oktober 2026) bahwa memperoleh dan menggunakan kartu kredit tradisional diperbolehkan bagi mereka yang membayar saldo penuh tepat waktu dengan percaya diri—menggunakan pembayaran otomatis jika memungkinkan—dan jawabannya juga mengatur peraturan untuk hal ini."
