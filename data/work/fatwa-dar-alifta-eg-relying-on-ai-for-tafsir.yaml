id: work/fatwa-dar-alifta-eg-relying-on-ai-for-tafsir
class: work
kind: fatwa
label: { ar: "حكم الاعتماد في تفسير القرآن على الذكاء الاصطناعي", en: "Relying on AI for interpreting the Qur'an", ur: "قرآن کی تفسیر میں اے آئی پر انحصار کا حکم" }
summary:
  ar: "سائل سأل عن الاعتماد في تفسير القرآن على تطبيقات الذكاء الاصطناعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22413)⁩ أن الاعتماد الكلي على تطبيقات الذكاء الاصطناعي في تفسير القرآن ممنوع شرعًا، وبيّن الجواب ما يجوز الاستعانة به فيها وما لا يجوز وضوابط كل منهما."
  en: "A questioner asked about relying on AI applications for interpreting the Qur'an. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22413) answered that total reliance on AI applications in Qur'an commentary is prohibited in the sharia; the answer sets out what AI may and may not be used for in this field, and the conditions of each."
  ur: "ایک سائل نے قرآن کی تفسیر میں اے آئی ایپلی کیشنز پر انحصار کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22413)⁩ نے جواب دیا کہ قرآن کی تفسیر میں اے آئی پر مکمل انحصار شریعت میں ممنوع ہے؛ جواب میں یہ بیان ہوا کہ اس میدان میں اے آئی سے کیا استعانت جائز اور کیا نہیں اور دونوں کے ضوابط۔"
