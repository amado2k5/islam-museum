label: { ar: "قرار مجمع الفقه الإسلامي الدولي 255 (25/17) بشأن خطاب الضمان والاعتماد المستندي", en: "IIFA resolution 255 (25/17) on the letter of guarantee and documentary credit", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 255 (25/17): خطابِ ضمان اور دستاویزی کریڈٹ", es: "Resolución 255 (25/17) de la IIFA sobre la carta de garantía y el crédito documentario." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩ في موضوع خطاب الضمان والاعتماد المستندي. اطلع المجمع على البحوث المقدمة واستمع إلى المناقشات، وقرر تأجيل البت في الموضوع لمزيد من البحث والدراسة مع التوصية بعقد ندوة متخصصة حوله."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023) on the letter of guarantee and documentary credit. After reviewing the submitted research and hearing the discussions, the Academy decided to defer a ruling on the matter for further research and study, recommending that a specialised seminar be held on it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، خطابِ ضمان اور دستاویزی کریڈٹ کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات کا جائزہ اور مباحث سنے، اور موضوع پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرتے ہوئے اس پر ایک مخصوص سیمینار کے انعقاد کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 25.ª sesión celebrada en Yeda (del 29 de Rajab al 3 de Sha'ban de 1444, del 20 al 23 de febrero de 2023) sobre la carta de garantía y el crédito documentario. Tras revisar la investigación presentada y escuchar los debates, la Academia decidió aplazar la decisión sobre el tema para realizar más investigaciones y estudios, recomendando la celebración de un seminario especializado al respecto."
