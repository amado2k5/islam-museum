id: work/fatwa-amja-joining-prayers-incontinence
class: work
kind: fatwa
label: { ar: "الجمع لصاحب السلس", en: "Joining prayers for the incontinent — one wudu each pair", ur: "سلس والے کا جمع — ایک وضو سے دو نمازیں", es: "Oraciones conjuntas por los incontinentes: una ablución por cada par.", fr: "Prières communes pour les incontinents — un wudu par paire", tr: "Çoğul, devam filminin sahibi için kullanılır", id: "Bentuk jamak adalah untuk pemilik sekuel" }
summary:
  ar: "سأل صاحب سلس بول وخروج ريح غير منتظم عن جمع الصلوات بطهارة واحدة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21942 بتاريخ 16 أبريل 2006)⁩ أنه يجوز جمع الظهر والعصر بطهارة واحدة وكذلك المغرب والعشاء جمع مشاركة وأن وضوء أصحاب الأعذار الذي يجمع صوريًا بطهارة واحدة ينتقض بخروج الوقت على ما فصّل الجواب."
  en: "One suffering urine incontinence and irregular wind asked about joining prayers on one purity. Dr. Salah al-Sawi (fatwa no. 21942, 16 April 2006) answered that he may join Zuhr and Asr on one purity and likewise Maghrib and Isha as a real joining, and that the excuse-holders' wudu joined nominally on one purity breaks when the time exits — as the answer details."
  ur: "سلس والے کا جمع؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21942، 16 اپریل 2006)⁩ کے مطابق ایک وضو سے ظہر عصر اور مغرب عشاء جائز؛ وقت نکلنے پر وضو ٹوٹتا ہے۔"
  es: "Un hombre que sufría de incontinencia urinaria y flatulencia irregular preguntó sobre la posibilidad de unir las oraciones en una sola pureza. El Dr. Salah al-Sawi (fatwa n.° 21942, 16 de abril de 2006) respondió que podía unir Zuhr y Asr en una sola pureza, y de igual manera Maghrib e Isha como una verdadera unión, y que la ablución de quienes se excusan, unida nominalmente en una sola pureza, se interrumpe cuando se acaba el tiempo, como se detalla en la respuesta."
  fr: "Une personne souffrant d'incontinence urinaire et de flatulences irrégulières a demandé s'il était possible de regrouper les prières sur une même pureté. Le Dr Salah al-Sawi (fatwa n° 21942, 16 avril 2006) a répondu qu'il pouvait regrouper les prières de Zuhr et Asr sur une même pureté, de même que celles de Maghrib et Isha, et que les ablutions des personnes dispensées d'exemption, même si elles étaient nominalement regroupées sur une même pureté, étaient invalidées à la fin du temps imparti, comme le précise la réponse."
  tr: "İdrar kaçırma ve düzensiz rüzgar kaçıran kişiye duaları tek bir saflıkla birleştirmek soruldu. Dr. Salah Al-Sawi (16 Nisan 2006 tarihli 21942 No. Fetva) Dhuhr ve Asr'ın tek bir saflıkla birleştirilmesinin, ayrıca Mağrip ve İşa'nın tek bir arınma ile birleştirilmesinin caiz olduğunu, geçerli mazeretleri olanların ise resmi olarak tek bir saflıkta birleştirildiği için yapılan abdest alınmasının süresi doldukça geçersiz kılındığını yanıtladı."
  id: "Orang dengan inkontinensia urin dan angin tidak teratur ditanya tentang menggabungkan doa dengan satu kemurnian. Dr. Salah Al-Sawi menjawab (Fatwa No. 21942 tanggal 16 April 2006) bahwa diperbolehkan menggabungkan Dhuhr dan Asr dengan satu kemurnian, serta Maghrib dan Isha, menggabungkannya dengan satu penyucian, dan bahwa wudhu bagi mereka yang memiliki alasan yang sah, yang secara formal digabungkan dalam satu kemurnian, dibatalkan oleh waktu yang telah berakhir, seperti yang dijelaskan dalam jawaban."
