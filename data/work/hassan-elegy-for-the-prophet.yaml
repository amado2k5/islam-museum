label: { ar: "مرثية حسان بن ثابت للنبي", en: "Hassan ibn Thabit's elegy for the Prophet" }
summary:
  ar: "قصيدة في رثاء النبي يرويها ابن هشام عن أبي زيد الأنصاري، تبدأ بطيبة رسماً للرسول ومعهداً، وتصف حجرات النبي والمنبر والقبر الذي واراه، وتقول إن البكاء عليه لا يكفي، وإن الأرض كلها بكته، وإن رزية يوم مات فيه محمد لم يعدلها شيء."
  en: "An elegy on the Prophet which Ibn Hisham transmits from Abu Zayd al-Ansari; it opens with Medina as the trace and habitation of the Messenger, describes his chambers, the pulpit and the grave that covered him, and says that weeping for him is not enough, that the earth wept for him, and that no calamity equals the day Muhammad died."
