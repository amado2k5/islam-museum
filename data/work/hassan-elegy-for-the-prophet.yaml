label: { ar: "مرثية حسان بن ثابت للنبي", en: "Hassan ibn Thabit's elegy for the Prophet", es: "Elegía de Hassan ibn Thabit al Profeta", fr: "Élégie de Hassan ibn Thabit pour le Prophète", ur: "حسان بن ثابت کا رسول اللہ کے لیے حسن و جمال", tr: "Hasan bin Thabit Peygamber Ağıtı", id: "Elegi Hassan bin Thabit untuk Nabi" }
summary:
  ar: "قصيدة في رثاء النبي يرويها ابن هشام عن أبي زيد الأنصاري، تبدأ بطيبة رسماً للرسول ومعهداً، وتصف حجرات النبي والمنبر والقبر الذي واراه، وتقول إن البكاء عليه لا يكفي، وإن الأرض كلها بكته، وإن رزية يوم مات فيه محمد لم يعدلها شيء."
  en: "An elegy on the Prophet which Ibn Hisham transmits from Abu Zayd al-Ansari; it opens with Medina as the trace and habitation of the Messenger, describes his chambers, the pulpit and the grave that covered him, and says that weeping for him is not enough, that the earth wept for him, and that no calamity equals the day Muhammad died."
  es: "Una elegía al Profeta que Ibn Hisham transmite de Abu Zayd al-Ansari; comienza con Medina como la huella y morada del Mensajero, describe sus aposentos, el púlpito y la tumba que lo cubrió, y dice que llorar por él no es suficiente, que la tierra lloró por él, y que ninguna calamidad se compara con el día en que murió Mahoma."
  fr: "Élégie sur le Prophète transmise par Ibn Hisham d'après Abu Zayd al-Ansari; elle commence par décrire Médine comme la trace et la demeure du Messager, ses appartements, la chaire et la tombe qui le recouvrait, et dit que pleurer pour lui ne suffit pas, que la terre a pleuré pour lui, et qu'aucune calamité n'égale le jour de la mort de Muhammad."
  ur: "نبی پر ایک قصیدہ جسے ابن ہشام نے ابو زید الانصاری سے نقل کیا ہے۔ یہ مدینہ کے ساتھ رسول کا سراغ اور رہائش گاہ کے طور پر کھلتا ہے، آپ کے حجروں، منبر اور قبر کو بیان کرتا ہے جس نے آپ کو ڈھانپ رکھا تھا، اور کہتا ہے کہ اس کے لیے رونا کافی نہیں ہے، یہ کہ زمین اس کے لیے روئی، اور یہ کہ کوئی آفت اس دن کے برابر نہیں ہے جس دن محمد کی وفات ہوئی۔"
  tr: "Peygamber'in yas ayeti, İbn Hişam tarafından Ebu Zayd el-Ensari'den rivayet edilen, Peygamber'in ve bir sarayın çizimi olarak Teybe ile başlar, Peygamber'in odalarını, kürsüsünü ve saklandığı mezarı anlatır, ağlamanın yeterli olmadığını, tüm yeryüzünün onun için ağladığını ve Muhammed'in öldüğü günün trajedisinin eşsiz olduğunu söyler."
  id: "Sebuah puisi berkabung atas Nabi yang diceritakan oleh Ibn Hisham dari Abu Zayd al-Ansari, dimulai dengan Taybah sebagai gambar Nabi dan istana, menggambarkan kamar Nabi, mimbar, dan makam tempat dia bersembunyi, mengatakan bahwa menangisi baginda tidak cukup, bahwa seluruh bumi menangisi untuknya, dan bahwa tragedi hari Muhammad wafat tiada tandingan."
