id: work/kitab-al-zuhd-ibn-al-mubarak
class: work
kind: book
label: { ar: "كتاب الزهد والرقائق", en: "Kitab al-Zuhd wa-l-Raqa'iq", ur: "کتاب الزہد والرقائق" }
summary:
  ar: "كتاب عبد الله بن المبارك ⁦(ت 181هـ)⁩ في الزهد والرقائق، يقول فؤاد سزكين إنه أقدم كتاب في الزهد وصل إلينا؛ مرتب على أبواب أولها «باب التحضيض على طاعة الله»، وله روايتان: رواية الحسين بن الحسن المروزي بطريق يحيى بن صاعد، ورواية نعيم بن حماد {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 46} {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 47} {cite:zuhd-ibn-mubarak-azami-scan p. 1}."
  en: "Abd Allah ibn al-Mubarak's (d. 181 AH) book on renunciation and heart-softening reports, which Fuat Sezgin calls the oldest extant book on zuhd; it is arranged in chapters beginning with 'Urging obedience to God' and survives in two recensions, that of al-Husayn ibn al-Hasan al-Marwazi through Yahya ibn Sa'id and that of Nu'aym ibn Hammad {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 46} {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 47} {cite:zuhd-ibn-mubarak-azami-scan p. 1}."
  ur: "عبد اللہ بن المبارک (م 181ھ) کی زہد و رقائق پر کتاب، جسے فؤاد سزگین ہم تک پہنچنے والی زہد کی سب سے قدیم کتاب کہتے ہیں؛ یہ ابواب پر مرتب ہے جن میں پہلا «اللہ کی اطاعت پر ابھارنے کا باب» ہے، اور اس کی دو روایتیں ہیں: یحییٰ بن صاعد کے طریق سے حسین بن حسن مروزی کی، اور نعیم بن حماد کی {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 46} {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 47} {cite:zuhd-ibn-mubarak-azami-scan p. 1}۔"
