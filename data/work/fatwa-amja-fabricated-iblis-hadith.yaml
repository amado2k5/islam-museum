label: { ar: "حديث إبليس مع الرسول حديث موضوع", en: "The 'Iblis with the Messenger' hadith is fabricated", ur: "ابلیس اور رسول کی حدیث موضوع ہے", es: "El hadiz de 'Iblis con el Mensajero' es inventado.", fr: "Le hadith d'« Iblis avec le Messager » est un faux.", tr: "Şeytan'ın peygamber ile yaptığı konuşma uydurma bir hadistir", id: "Percakapan antara Setan dengan nabi adalah hadits yang dibuat-buat" }
summary:
  ar: "سأل سائل عن حديث إبليس مع رسول الله هل هو صحيح أم ضعيف أم حسن. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78216 بتاريخ 14 مارس 2009)⁩ أنه حديث موضوع مكذوب على رسول الله ودلائل الوضع ظاهرة عليه لا تخفى على من خبر الأحاديث، فلا يجوز نشره ولا تناقله ولا نسبته إلى رسول الله فإن من نشره كان من الكذابين عليه لقوله من حدث عني بحديث يرى أنه كذب فهو أحد الكاذبين كما روى مسلم في المقدمة."
  en: "A questioner asked whether the 'Iblis with the Messenger' hadith is sound, weak or fair. Dr. Salah al-Sawi (fatwa no. 78216, 14 March 2009) answered that it is a fabricated lie against the Messenger of God — the marks of fabrication evident to whoever knows the reports — so it may not be published, transmitted or attributed to him; whoever spreads it is among those who lie against him, per Muslim's introduction: 'whoever reports from me a hadith seen to be a lie is one of the liars'."
  ur: "ایک سائل نے ابلیس کے حوالے سے ایک حدیث کی درجہ بندی پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78216، 14 مارچ 2009)⁩ کے مطابق یہ موضوع و جھوٹی ہے اور اسے پھیلانا رسول پر جھوٹ باندھنا ہے۔"
  es: "Un interlocutor preguntó si el hadiz «Iblis con el Mensajero» era auténtico, débil o justo. El Dr. Salah al-Sawi (fatwa n.º 78216, 14 de marzo de 2009) respondió que se trata de una mentira inventada contra el Mensajero de Dios —con indicios evidentes para quien conoce los relatos—, por lo que no debe publicarse, transmitirse ni atribuirse a él; quien lo difunda estará entre los que mienten contra él, según la introducción de Muslim: «Quien transmita de mí un hadiz que parezca mentira es uno de los mentirosos»."
  fr: "Un internaute a demandé si le hadith « Iblis avec le Messager » était authentique, faible ou acceptable. Le Dr Salah al-Sawi (fatwa n° 78216, 14 mars 2009) a répondu qu’il s’agissait d’un mensonge fabriqué de toutes pièces contre le Messager de Dieu – les marques de la fabrication étant évidentes pour quiconque connaît les récits – et qu’il ne pouvait donc être ni publié, ni transmis, ni attribué à ce dernier. Quiconque le propage compte parmi les menteurs, conformément à l’introduction de Muslim: « Quiconque rapporte de moi un hadith manifestement faux est du nombre des menteurs. »"
  tr: "Bir kişiye İblis hadisi hakkında Allah Elçisi ile ilgili sorular soruldu—hasil, zayıf mı, iyi mi olduğu. Dr. Salah Al-Sawi (14 Mart 2009 tarihli 78216 No. fetva) bunun Allah'ın Elçi'ne atfedilen uydurma bir hadis olduğunu ve uydurma kanıtının hadisleri anlatan kişi için açık ve açık olduğunu söyledi. Bu nedenle, bunu Allah'ın Elçi'ne yayımlamak, iletmek veya ona atfetmek caiz değildir; çünkü onu yayımlayan kişi, ona karşı yalan söyleyenler arasındadır; kendisi de şöyle dedi: Benden bir hadisi sahte olduğuna inanan kişi, Müslüman'ın girişte anlattığı gibi yalancılardan biridir."
  id: "Seorang penanya ditanya tentang hadis Iblis bersama Rasulullah—apakah hadis itu asli, lemah, atau baik. Dr. Salah Al-Sawi menjawab (Fatwa No. 78216 tanggal 14 Maret 2009) bahwa itu adalah hadis palsu yang dikaitkan dengan Rasulullah, dan bukti palsu-rekayasa tersebut jelas dan jelas bagi siapa pun yang menceritakan hadits tersebut. Oleh karena itu, tidak diperbolehkan untuk menerbitkan, meneruskan, atau mengaitkannya dengan Rasulullah, karena siapa pun yang menerbitkannya adalah salah satu pembohong melawannya, seperti yang dikatakannya: Siapa yang menceritakan hadis dari saya yang dipercayanya palsu, adalah salah satu pembohong, seperti yang diceritakan oleh Muslim dalam pengantar."
