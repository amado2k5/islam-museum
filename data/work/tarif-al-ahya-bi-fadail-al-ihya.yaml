id: work/tarif-al-ahya-bi-fadail-al-ihya
class: work
kind: treatise
label: { ar: "تعريف الأحياء بفضائل الإحياء", en: "Ta'rif al-Ahya' bi-Fada'il al-Ihya'", ur: "تعریف الاحیاء بفضائل الاحیاء" }
summary:
  ar: "رسالة لعبد القادر بن شيخ بن عبد الله العيدروس باعلوي في فضائل إحياء علوم الدين، رتّبها على مقدمة في عنوان الكتاب، ومقصد في فضائله وثناء الأكابر عليه والجواب عما طُعن به فيه، وخاتمة في ترجمة الغزالي وسبب رجوعه إلى طريقة الصوفية؛ تُطبع ملحقةً بالإحياء {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}."
  en: "A treatise by Abd al-Qadir ibn Shaykh ibn Abd Allah al-Aydarus Ba Alawi on the merits of the Ihya', arranged as an introduction on the book's title, a main part on its merits, the praise of great scholars and answers to objections, and a conclusion on al-Ghazali's life and his turn to the Sufi way; it is printed as an appendix to the Ihya' {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}."
  ur: "عبد القادر بن شیخ بن عبد اللہ عیدروس باعلوی کا احیاء علوم الدین کی فضیلت پر رسالہ، جو کتاب کے عنوان پر مقدمے، اس کی فضیلتوں، اکابر کی تعریف اور اعتراضات کے جواب پر مقصد، اور غزالی کی سوانح اور صوفی طریقے کی طرف ان کے رجوع پر خاتمے میں مرتب ہے؛ یہ احیاء کے ساتھ ملحق چھپتا ہے {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}۔"
