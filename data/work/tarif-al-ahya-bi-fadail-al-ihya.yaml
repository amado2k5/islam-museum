label: { ar: "تعريف الأحياء بفضائل الإحياء", en: "Ta'rif al-Ahya' bi-Fada'il al-Ihya'", ur: "تعریف الاحیاء بفضائل الاحیاء", es: "Ta'rif al-Ahya' bi-Fada'il al-Ihya'", fr: "Ta'rif al-Ahya' bi-Fada'il al-Ihya'", tr: "Canlı Hayvanların Erdemlerini Tanıtmak", id: "Memperkenalkan Kebajikan Hewan Hidup" }
summary:
  ar: "رسالة لعبد القادر بن شيخ بن عبد الله العيدروس باعلوي في فضائل إحياء علوم الدين، رتّبها على مقدمة في عنوان الكتاب، ومقصد في فضائله وثناء الأكابر عليه والجواب عما طُعن به فيه، وخاتمة في ترجمة الغزالي وسبب رجوعه إلى طريقة الصوفية؛ تُطبع ملحقةً بالإحياء {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}."
  en: "A treatise by Abd al-Qadir ibn Shaykh ibn Abd Allah al-Aydarus Ba Alawi on the merits of the Ihya', arranged as an introduction on the book's title, a main part on its merits, the praise of great scholars and answers to objections, and a conclusion on al-Ghazali's life and his turn to the Sufi way; it is printed as an appendix to the Ihya' {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}."
  ur: "عبد القادر بن شیخ بن عبد اللہ عیدروس باعلوی کا احیاء علوم الدین کی فضیلت پر رسالہ، جو کتاب کے عنوان پر مقدمے، اس کی فضیلتوں، اکابر کی تعریف اور اعتراضات کے جواب پر مقصد، اور غزالی کی سوانح اور صوفی طریقے کی طرف ان کے رجوع پر خاتمے میں مرتب ہے؛ یہ احیاء کے ساتھ ملحق چھپتا ہے {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}۔"
  es: "Un tratado de Abd al-Qadir ibn Shaykh ibn Abd Allah al-Aydarus Ba Alawi sobre los méritos del Ihya', organizado como una introducción sobre el título del libro, una parte principal sobre sus méritos, elogios de grandes eruditos y respuestas a objeciones, y una conclusión sobre la vida de al-Ghazali y su conversión al camino sufí; está impreso como un apéndice del Ihya' {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}."
  fr: "Un traité d'Abd al-Qadir ibn Shaykh ibn Abd Allah al-Aydarus Ba Alawi sur les mérites de l'Ihya', organisé comme une introduction sur le titre du livre, une partie principale sur ses mérites, l'éloge des grands savants et les réponses aux objections, et une conclusion sur la vie d'al-Ghazali et sa conversion à la voie soufie; il est imprimé en tant qu'appendice à l'Ihya' {cite:ihya-dar-al-marifa-1982-v3 p. 5} {cite:ihya-kitab-al-shab-pts13-16 p. 776}."
  tr: "Abdulkadir bin Şeyh bin Abdullah El-Eydarus Ba'Alawi'nin İhya' Ulum al-Din'in erdemleri üzerine yazdığı bir risale, kitabın başlığında bir giriş, erdemlerinde bir amaç, büyük alimlerin övgüsleri, eleştirdiği şeylere verilen yanıtlar ve El-Gazali'nin biyografisi ile onun Sufi yoluna dönüş nedeni üzerine bir sonuç içeriyor; İhya'nın ekinde basılmıştır {cite:ihya-dar-al-marifa-1982-v3 s. 5} {cite:ihya-kitab-al-shab-pts13-16 s. 776}."
  id: "Sebuah risalah oleh Abdul Qadir bin Sheikh bin Abdullah Al-Aidarus Ba'Alawi tentang kebajikan Ihya' Ulum al-Din, disusun dengan pengantar dalam judul buku, tujuan dalam kebajikan, pujian terhadap para ulama besar, tanggapan atas kritiknya, dan kesimpulan tentang biografi Al-Ghazali serta alasan kembalinya ke jalan Sufi; dicetak sebagai lampiran pada Ihya {cite:ihya-dar-al-marifa-1982-v3 hlm. 5} {cite:ihya-kitab-al-shab-pts13-16 hlm. 776}."
