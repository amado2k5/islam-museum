id: work/fatwa-dar-alifta-eg-annual-rent-increase
class: work
kind: fatwa
label: { ar: "حكم الإجارة بأجرة شهرية متزايدة كل سنة", en: "A lease with a monthly rent rising each year", ur: "ہر سال بڑھتے ماہانہ کرایے کا اجارہ", es: "Un contrato de arrendamiento con una renta mensual que aumenta cada año.", fr: "Un bail avec un loyer mensuel qui augmente chaque année", tr: "Her yıl artan aylık kira ile kiralama kararı", id: "Putusan tentang sewa dengan kenaikan sewa bulanan setiap tahun" }
summary:
  ar: "سائل اتفق مع صاحب العقار على زيادة سنوية بنسبة عشرة بالمئة من قيمة آخر أجرة فسأل عن حكم هذا الاتفاق. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21812)⁩ أن هذا اتفاق معلوم لا يُجهِل الأجرة وبيّن الجواب حكمه على وجهه."
  en: "A man agreed with the property owner on a yearly rise of ten percent of the last rent and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21812) answered that this is a defined agreement that does not leave the rent unknown, and the answer sets out its ruling."
  ur: "ایک شخص نے مالکِ مکان کے ساتھ آخری کرایے کی دس فیصد سالانہ اضافے پر اتفاق کیا اور حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21812)⁩ نے جواب دیا کہ یہ ایک معلوم اتفاق ہے جو کرایے کو مجہول نہیں چھوڑتا؛ اس کا حکم جواب میں بیان ہوا۔"
  es: "Un hombre acordó con el propietario un aumento anual del diez por ciento del último alquiler y solicitó una resolución. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21812) respondió que se trata de un acuerdo definido que no deja el alquiler en el aire, y la respuesta expone su dictamen."
  fr: "Un homme a convenu avec le propriétaire d'une augmentation annuelle de 10 % du loyer précédent et a demandé l'avis juridique. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21812) a répondu qu'il s'agissait d'un accord explicite ne laissant aucune incertitude quant au montant du loyer, et la réponse énonce sa décision."
  tr: "Bir soru soran kişi, mülk sahibiyle son kira değerinden yıllık yüzde on artış konusunda hemfikir oldu ve bu anlaşmayla ilgili kararı sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21812), bunun kirayı tetiklemeyen bilinen bir anlaşma olduğunu ve cevabın kendi şartlarıyla kararını netleştirdiğini belirtti."
  id: "Seorang penanya setuju dengan pemilik properti mengenai kenaikan tahunan sepuluh persen dari nilai sewa terakhir dan menanyakan tentang putusan perjanjian tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21812) menjawab bahwa ini adalah perjanjian yang diketahui dan tidak memicu sewa, dan jawabannya memperjelas putusannya dengan syaratnya sendiri."
