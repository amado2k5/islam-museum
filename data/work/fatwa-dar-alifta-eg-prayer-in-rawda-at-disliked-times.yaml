id: work/fatwa-dar-alifta-eg-prayer-in-rawda-at-disliked-times
class: work
kind: fatwa
label: { ar: "حكم الصلاة في الروضة الشريفة في أوقات الكراهة", en: "Prayer in the Rawda at the disliked times", ur: "مکروہ اوقات میں روضہ شریف میں نماز" }
summary:
  ar: "سائل سأل عن الصلاة في الروضة الشريفة في أوقات الكراهة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20692)⁩ أنه لا تكره الصلاة في الروضة الشريفة في أوقات الكراهة بل هي جائزة ولا حرج فيها ولو لم يكن لها سبب قياسًا على ما فصّل الجواب."
  en: "A questioner asked about praying in the Rawda at the disliked times. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20692) answered that prayer there is not disliked even at those times — it is permissible without blame, even with no cause — by the analogy set out in the answer."
  ur: "ایک سائل نے مکروہ اوقات میں روضہ شریف میں نماز کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20692)⁩ نے جواب دیا کہ وہاں ان اوقات میں بھی نماز مکروہ نہیں بلکہ جائز ہے — جواب میں اس کی قیاس بیان ہے۔"
