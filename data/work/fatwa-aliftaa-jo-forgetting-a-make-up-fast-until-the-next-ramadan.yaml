id: work/fatwa-aliftaa-jo-forgetting-a-make-up-fast-until-the-next-ramadan
class: work
kind: fatwa
label: { ar: "من نسي قضاء الصيام حتى دخل رمضان آخر", en: "Forgetting a make-up fast until the next Ramadan", ur: "اگلے رمضان تک قضا روزہ بھول جانا", es: "Olvidar un ayuno compensatorio hasta el próximo Ramadán.", fr: "Oublier de rattraper son retard de jeûne jusqu'au prochain Ramadan", tr: "Başka bir Ramazan gelene kadar orucu telafi etmeyi unutan", id: "Siapa pun yang lupa untuk berpuasa sampai Ramadan berikutnya tiba" }
summary:
  ar: "سؤال عن من نسي قضاء الصيام حتى دخل رمضان آخر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا إثم عليه ولا تلزمه الفدية مع القضاء، لأن التأخير بعذر كالنسيان لا فدية فيه. أجابت الدائرة بأن من نسي قضاء رمضان حتى دخل رمضان آخر فلا إثم عليه، واستدلت بحديث رواه ابن ماجه والبيهقي في السنن الكبرى، معناه أن الله تجاوز عن هذه الأمة الخطأ والنسيان وما أكرهوا عليه. وقالت إنه لا تلزمه الفدية، ونقلت من كتاب بشرى الكريم ⁦(ص 580)⁩ من كتب الشافعية أن تأخير القضاء بعذر كالسفر والإرضاع والنسيان والجهل بحرمة التأخير لا فدية فيه وإن استمر سنين، لأن تأخير الأداء جائز بهذه الأعذار فالقضاء أولى."
  en: "A question about forgetting a make-up fast until the next Ramadan, in which Jordan's General Iftaa Department answered that he commits no sin and owes no fidya alongside the make-up, because delay for an excuse such as forgetting carries no fidya. The Department answered that whoever forgets to make up Ramadan until another Ramadan arrives commits no sin, citing a hadith narrated by Ibn Majah and by al-Bayhaqi in al-Sunan al-Kubra, whose meaning is that God has overlooked for this community mistakes, forgetting and what they are coerced into. It said he owes no fidya, quoting Bushra al-Karim (p. 580), a Shafi'i work, that delaying the make-up for an excuse such as travel, nursing, forgetting or not knowing that delay is forbidden carries no fidya even if it lasts years, because these excuses permit delaying the fast itself, so they permit delaying its make-up all the more."
  ur: "اگلے رمضان تک قضا روزہ بھول جانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس پر گناہ نہیں اور قضا کے ساتھ فدیہ لازم نہیں، کیونکہ بھول جیسے عذر سے تاخیر پر فدیہ نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ جو رمضان کی قضا بھول جائے یہاں تک کہ دوسرا رمضان آ جائے، اس پر گناہ نہیں، اور ابن ماجہ اور بیہقی کی السنن الکبریٰ کی ایک حدیث سے استدلال کیا جس کا مفہوم ہے کہ اللہ نے اس امت سے خطا، بھول اور زبردستی کرائے گئے کام سے درگزر فرمایا۔ اس نے کہا کہ اس پر فدیہ لازم نہیں، اور شافعی کتاب بشریٰ الکریم ⁦(ص 580)⁩ سے نقل کیا کہ سفر، دودھ پلانے، بھول یا تاخیر کی حرمت سے ناواقفیت جیسے عذر سے قضا میں تاخیر پر فدیہ نہیں چاہے برسوں گزر جائیں، کیونکہ ان عذروں سے اصل روزے میں تاخیر جائز ہے تو قضا میں بدرجۂ اولیٰ۔"
  es: "Una pregunta sobre olvidar un ayuno de recuperación hasta el próximo Ramadán, en la que el Departamento General de Iftaa de Jordania respondió que no comete pecado y no debe fidya junto con la recuperación, porque la demora por una excusa como el olvido no conlleva fidya. El Departamento respondió que quien olvida recuperar el Ramadán hasta que llega otro Ramadán no comete pecado, citando un hadiz narrado por Ibn Majah y por al-Bayhaqi en al-Sunan al-Kubra, cuyo significado es que Dios ha pasado por alto para esta comunidad los errores, el olvido y aquello a lo que son obligados. Dijo que no debe fidya, citando Bushra al-Karim (p. 580), una obra shafi'í, que retrasar la recuperación por una excusa como viajar, cuidar a un bebé, olvidar o desconocer que la demora está prohibida no conlleva fidya incluso si dura años, porque estas excusas permiten retrasar el ayuno en sí, por lo que permiten retrasar su recuperación aún más."
  fr: "Concernant la question de savoir si une personne oublie de rattraper un jeûne jusqu'au Ramadan suivant, le Département général de la Iftaa de Jordanie a répondu que cela ne constitue pas un péché et n'entraîne aucune amende (fidya), car le report du jeûne pour une excuse telle qu'un oubli n'est passible de fidya. Le Département a expliqué que quiconque oublie de rattraper un jeûne du Ramadan jusqu'au prochain Ramadan ne commet aucun péché, citant un hadith rapporté par Ibn Majah et al-Bayhaqi dans al-Sunan al-Kubra. Ce hadith signifie que Dieu pardonne aux membres de cette communauté leurs erreurs, leurs oublis et les actes commis sous la contrainte. Le Département a précisé qu'aucune amende n'est due, citant Bushra al-Karim (p. 580), un ouvrage shafi'ite. Selon cet ouvrage, reporter le rattrapage pour une excuse comme un voyage, un congé de maternité, un oubli ou la méconnaissance de l'interdiction de reporter le jeûne n'entraîne aucune amende, même si ce report dure des années. En effet, ces excuses permettent de reporter le jeûne lui-même, et donc d'autant plus de reporter son rattrapage."
  tr: "Başka bir Ramazan başlayana kadar orucu telafi etmeyi unutan birine ilişkin bir soruya ise, Ürdün Genel Fetva Dairesi ona günah olmadığını ve oruçları telafi etmenin bir tazminat gerekmediğini, çünkü bir bahaneyle ertelemenin, unutma gibi bir şeyin fidya içermediğini yanıtladı. Daire, Ramazanı başka bir Ramazan başlayana kadar uydurmayı unutan kişinin günah olmadığını yanıtladı. El-Sünen el-Kubra'da İbn Majah ve El-Bayhaki tarafından anlatılan bir hadisi aktardı; bu da şu anlamda Allah'ın bu ulusu hatalardan, unutkanlıktan ve yaptıkları şeylerden affettiğini belirtir. Fidye ödemek zorunda olmadığı ve Şafii kitaplarından Bushra al-Kerim (s. 580) adlı kitabından alıntı yapmıştır; seyahat, emzirme, unutkanlık ve gecikme yasağını bilmemek gibi bahanelerle orucu ertelemek, yıllarca sürse bile tazminat gerektirmez, çünkü bu bahanelerle ödemeyi geciktirmek caizdir, bu yüzden telafi etmek tercih edilir."
  id: "Sebuah pertanyaan tentang seseorang yang lupa menebus puasa sampai Ramadan berikutnya dimulai, Departemen Fatwa Jenderal Yordania menjawab bahwa tidak ada dosa atas dirinya dan tidak diperlukan kompensasi untuk menebus puasa, karena menunda dengan alasan, seperti pelupaan, tidak melibatkan fidya. Departemen menjawab bahwa siapa pun yang lupa menebus Ramadan sampai Ramadan berikutnya dimulai, tidak ada dosanya. Mereka mengutip hadits yang diceritakan oleh Ibn Majah dan Al-Bayhaqi dalam Al-Sunan al-Kubra, artinya Allah mengampuni bangsa ini atas kesalahan, pelupaan, dan apa yang dipaksa mereka lakukan. Dikatakan bahwa dia tidak diwajibkan membayar tebusan, dan mengutip dari kitab Bushra al-Karim (hal. 580) dari kitab Syafi'i bahwa menunda berpuasa dengan alasan seperti perjalanan, menyusui, lupa, dan ketidaktahuan larangan penundaan tidak memerlukan kompensasi meskipun berlangsung bertahun-tahun, karena menunda pembayaran diperbolehkan dengan alasan ini, jadi menebusnya lebih baik."
