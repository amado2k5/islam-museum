id: work/fatwa-aliftaa-jo-forgetting-a-make-up-fast-until-the-next-ramadan
class: work
kind: fatwa
label: { ar: "من نسي قضاء الصيام حتى دخل رمضان آخر", en: "Forgetting a make-up fast until the next Ramadan", ur: "اگلے رمضان تک قضا روزہ بھول جانا" }
summary:
  ar: "سؤال عن من نسي قضاء الصيام حتى دخل رمضان آخر، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا إثم عليه ولا تلزمه الفدية مع القضاء، لأن التأخير بعذر كالنسيان لا فدية فيه. أجابت الدائرة بأن من نسي قضاء رمضان حتى دخل رمضان آخر فلا إثم عليه، واستدلت بحديث رواه ابن ماجه والبيهقي في السنن الكبرى، معناه أن الله تجاوز عن هذه الأمة الخطأ والنسيان وما أكرهوا عليه. وقالت إنه لا تلزمه الفدية، ونقلت من كتاب بشرى الكريم (ص 580) من كتب الشافعية أن تأخير القضاء بعذر كالسفر والإرضاع والنسيان والجهل بحرمة التأخير لا فدية فيه وإن استمر سنين، لأن تأخير الأداء جائز بهذه الأعذار فالقضاء أولى."
  en: "A question about forgetting a make-up fast until the next Ramadan, in which Jordan's General Iftaa Department answered that he commits no sin and owes no fidya alongside the make-up, because delay for an excuse such as forgetting carries no fidya. The Department answered that whoever forgets to make up Ramadan until another Ramadan arrives commits no sin, citing a hadith narrated by Ibn Majah and by al-Bayhaqi in al-Sunan al-Kubra, whose meaning is that God has overlooked for this community mistakes, forgetting and what they are coerced into. It said he owes no fidya, quoting Bushra al-Karim (p. 580), a Shafi'i work, that delaying the make-up for an excuse such as travel, nursing, forgetting or not knowing that delay is forbidden carries no fidya even if it lasts years, because these excuses permit delaying the fast itself, so they permit delaying its make-up all the more."
  ur: "اگلے رمضان تک قضا روزہ بھول جانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس پر گناہ نہیں اور قضا کے ساتھ فدیہ لازم نہیں، کیونکہ بھول جیسے عذر سے تاخیر پر فدیہ نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ جو رمضان کی قضا بھول جائے یہاں تک کہ دوسرا رمضان آ جائے، اس پر گناہ نہیں، اور ابن ماجہ اور بیہقی کی السنن الکبریٰ کی ایک حدیث سے استدلال کیا جس کا مفہوم ہے کہ اللہ نے اس امت سے خطا، بھول اور زبردستی کرائے گئے کام سے درگزر فرمایا۔ اس نے کہا کہ اس پر فدیہ لازم نہیں، اور شافعی کتاب بشریٰ الکریم (ص 580) سے نقل کیا کہ سفر، دودھ پلانے، بھول یا تاخیر کی حرمت سے ناواقفیت جیسے عذر سے قضا میں تاخیر پر فدیہ نہیں چاہے برسوں گزر جائیں، کیونکہ ان عذروں سے اصل روزے میں تاخیر جائز ہے تو قضا میں بدرجۂ اولیٰ۔"
