label: { ar: "المتأخرون يصلون جماعة", en: "Men late to the mosque — may they pray a second congregation", ur: "مسجد میں دیر سے آنے والے — دوسری جماعت", es: "Los hombres que llegan tarde a la mezquita, que puedan rezar una segunda congregación." }
summary:
  ar: "سأل سائل عن رجال تأخروا عن الجماعة في المسجد ووجدوا الناس قد صلوا هل يصلون في جماعة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21989 بتاريخ 14 أكتوبر 2012)⁩ ناقلة عن اللجنة الدائمة للبحوث العلمية والإفتاء بالسعودية أن من جاء إلى المسجد فوجد الجماعة قد صلوا بإمام راتب أو غير راتب فليصلها جماعة مع مثله على ما فصّل الجواب."
  en: "A questioner asked about men late to the mosque who find the congregation finished — may they pray in a congregation? AMJA's fatwa committee (fatwa no. 21989, 14 October 2012) relayed the Saudi Permanent Committee's answer: one coming to the mosque to find the people have prayed under a permanent imam or not should pray it in congregation with his like — as the answer states."
  ur: "دوسری جماعت؟ لجنة الفتوى ⁦(فتویٰ 21989، 14 اکتوبر 2012)⁩ نے اللجنة الدائمة کا جواب نقل کیا: اپنے جیسوں کے ساتھ جماعت کریں۔"
  es: "Un interlocutor preguntó sobre los hombres que llegan tarde a la mezquita y encuentran que la oración en congregación ha terminado: ¿pueden rezar en congregación? El comité de fatuas de AMJA (fatua n.º 21989, 14 de octubre de 2012) transmitió la respuesta del Comité Permanente Saudí: quien llegue a la mezquita y encuentre que la gente ha rezado bajo la dirección de un imán permanente o no, debe rezar en congregación con otros fieles, tal como indica la respuesta."
