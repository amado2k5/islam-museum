label: { ar: "المتأخرون يصلون جماعة", en: "Men late to the mosque — may they pray a second congregation", ur: "مسجد میں دیر سے آنے والے — دوسری جماعت", es: "Los hombres que llegan tarde a la mezquita, que puedan rezar una segunda congregación.", fr: "Les hommes en retard à la mosquée — puissent-ils prier lors de la seconde prière du vendredi", tr: "Geç kalanlar cemaatte dua eder", id: "Mereka yang terlambat berdoa dalam jemaat" }
summary:
  ar: "سأل سائل عن رجال تأخروا عن الجماعة في المسجد ووجدوا الناس قد صلوا هل يصلون في جماعة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21989 بتاريخ 14 أكتوبر 2012)⁩ ناقلة عن اللجنة الدائمة للبحوث العلمية والإفتاء بالسعودية أن من جاء إلى المسجد فوجد الجماعة قد صلوا بإمام راتب أو غير راتب فليصلها جماعة مع مثله على ما فصّل الجواب."
  en: "A questioner asked about men late to the mosque who find the congregation finished — may they pray in a congregation? AMJA's fatwa committee (fatwa no. 21989, 14 October 2012) relayed the Saudi Permanent Committee's answer: one coming to the mosque to find the people have prayed under a permanent imam or not should pray it in congregation with his like — as the answer states."
  ur: "دوسری جماعت؟ لجنة الفتوى ⁦(فتویٰ 21989، 14 اکتوبر 2012)⁩ نے اللجنة الدائمة کا جواب نقل کیا: اپنے جیسوں کے ساتھ جماعت کریں۔"
  es: "Un interlocutor preguntó sobre los hombres que llegan tarde a la mezquita y encuentran que la oración en congregación ha terminado: ¿pueden rezar en congregación? El comité de fatuas de AMJA (fatua n.º 21989, 14 de octubre de 2012) transmitió la respuesta del Comité Permanente Saudí: quien llegue a la mezquita y encuentre que la gente ha rezado bajo la dirección de un imán permanente o no, debe rezar en congregación con otros fieles, tal como indica la respuesta."
  fr: "Un fidèle a demandé si les hommes arrivant en retard à la mosquée et constatant que la prière est terminée pouvaient prier en congrégation. Le comité des fatwas de l'AMJA (fatwa n° 21989, 14 octobre 2012) a relayé la réponse du Comité permanent saoudien: celui qui arrive à la mosquée et constate que la prière a déjà été effectuée sous la direction d'un imam permanent ou non doit prier en congrégation avec les fidèles de son rang, comme l'indique la fatwa."
  tr: "Bir kişi, camide cemaate geç kalan erkekler hakkında soru sordu ve insanların namaz kıldığını gördü—cemaatte namaz kılıyorlar mı? Amerika Şeriat Hukukçuları Meclisi'ndeki Fetva Komitesi (Fetva No. 21989, 14 Ekim 2012 tarihli), Suudi Arabistan'daki Bilimsel Araştırma ve İfta'nın Daimi Komitesi'ni alıntılayarak yanıt verdi; cemaatin maaşlı ya da ücretsiz bir imamla birlikte namaz kıldığını gören herkesin cemaate katılması gerektiği belirtildi."
  id: "Seseorang menanyakan tentang pria yang terlambat datang ke jemaat di masjid dan menemukan orang berdoa—apakah mereka berdoa bersama? Komite Fatwa di Majelis Ahli Hukum Syariah di Amerika (Fatwa No. 21989 tanggal 14 Oktober 2012) menanggapi dengan mengutip Komite Tetap untuk Riset Ilmiah dan Ifta di Arab Saudi bahwa siapa pun yang datang ke masjid dan menemukan jamaah berdoa dengan imam bergaji atau tidak dibayar, harus bergabung dengan jamaah dengan imam yang sama, seperti yang dijelaskan dalam jawaban."
