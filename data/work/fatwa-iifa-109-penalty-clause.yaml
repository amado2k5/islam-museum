id: work/fatwa-iifa-109-penalty-clause
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 109 (12/3) بشأن الشرط الجزائي", en: "IIFA resolution 109 (12/3) on the penalty clause", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 109 (12/3): شرطِ جزائی", es: "Resolución 109 (12/3) de la IIFA sobre la cláusula penal", fr: "Résolution 109 (12/3) de l'IIFA relative à la clause pénale" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩. عرّف الشرط الجزائي بأنه في القانون اتفاق بين المتعاقدين على تقدير التعويض المستحق عن الضرر إذا لم ينفذ الطرف الآخر ما التزم به أو تأخر في تنفيذه، وأكد قراريه السابقين: في السلم ⁦(85 ⁦(9/2)⁩)⁩ بعدم جواز الشرط الجزائي عن التأخير في تسليم المسلم فيه لكونه دينًا ولا تجوز الزيادة في الديون عند التأخير؛ وفي الاستصناع ⁦(65 ⁦(7/3)⁩)⁩ بجواز تضمين عقده شرطًا جزائيًا بمقتضى ما اتفق عليه المتعاقدان ما لم تحل ضرورة. ثم عمّم الضوابط: جواز الشرط الجزائي في العقود المالية كافة ما عدا ما يكون فيه محل العقد دينًا، وضوابط تقدير التعويض والإعفاء بالضرورة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000). It defined the penalty clause, in law, as the contracting parties' agreement on estimating compensation due for harm if the other party fails to perform his undertaking or delays it; reaffirmed its earlier resolutions — on salam (85 (9/2)) that a penalty for delay in delivering the salam commodity is impermissible as it is a debt and no increase may be stipulated on debts at delay, and on istisna' (65 (7/3)) that a penalty clause may be included per the parties' agreement unless necessity excuses. It then generalised: the penalty clause is permissible in all financial contracts except where the subject is itself a debt, with controls on estimating compensation and excuse by necessity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں۔ اس نے شرطِ جزائی کی تعریف کی: قانون میں معاہدہ کرنے والوں کا یہ اتفاق کہ اگر دوسرا فریق اپنی ذمہ داری پوری نہ کرے یا تاخیر کرے تو ہونے والے نقصان کا معاوضہ پہلے سے مقرر ہو؛ اور اپنی سابقہ قراردادوں کی تاکید: سلام ⁦(85 ⁦(9/2)⁩)⁩ میں سلام مال کی سپردگی میں تاخیر پر شرطِ جزائی ناجائز کیونکہ یہ قرض ہے اور تاخیر پر قرض میں اضافہ جائز نہیں؛ اور استصناع ⁦(65 ⁦(7/3)⁩)⁩ میں شرطِ جزائی جائز بشرطیکہ ضرورت نہ ہو۔ پھر عمومی اصول: شرطِ جزائی تمام مالی عقود میں جائز سوائے ان کے جن کا موضوع خود قرض ہو، معاوضے کے تخمینے اور ضرورت پر معافی کے ضوابط کے ساتھ۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000). Definió la cláusula penal, en derecho, como el acuerdo de las partes contratantes sobre la estimación de la compensación debida por el daño si la otra parte no cumple su compromiso o lo retrasa; reafirmó sus resoluciones anteriores: sobre salam (85 (9/2)) que una penalización por retraso en la entrega del bien salam es inadmisible, ya que es una deuda y no se puede estipular ningún aumento sobre las deudas por retraso, y sobre istisna' (65 (7/3)) que una cláusula penal puede incluirse por acuerdo de las partes, a menos que la necesidad lo exima. Luego generalizó: la cláusula penal es admisible en todos los contratos financieros, excepto cuando el objeto es en sí mismo una deuda, con controles sobre la estimación de la compensación y la excusa por necesidad."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000). Cette résolution définit la clause pénale, en droit, comme l'accord des parties contractantes sur l'estimation de l'indemnisation due en cas de manquement ou de retard dans l'exécution d'un engagement par l'autre partie. Elle réaffirme ses résolutions antérieures: sur le salam (85 (9/2)), une pénalité pour retard de livraison du bien salam est inadmissible, car il s'agit d'une dette et aucune majoration ne peut être stipulée sur les dettes en cas de retard; et sur l'istisna' (65 (7/3)), une clause pénale peut être incluse d'un commun accord, sauf en cas de force majeure. Elle généralise ensuite: la clause pénale est admissible dans tous les contrats financiers, sauf lorsque l'objet est lui-même une dette, sous réserve de contrôles sur l'estimation de l'indemnisation et de la possibilité d'une exception pour cause de force majeure."
