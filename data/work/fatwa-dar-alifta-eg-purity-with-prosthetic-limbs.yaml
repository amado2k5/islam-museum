id: work/fatwa-dar-alifta-eg-purity-with-prosthetic-limbs
class: work
kind: fatwa
label: { ar: "كيفية الطهارة بالأطراف الصناعية", en: "How to perform purification with prosthetic limbs", ur: "مصنوعی اعضا کے ساتھ طہارت کا طریقہ", es: "Cómo realizar la purificación con prótesis", fr: "Comment effectuer une purification avec des prothèses ?", tr: "Protezlerle nasıl arıtılır", id: "Cara memurnikan dengan prostetik" }
summary:
  ar: "سائل سأل عن كيفية الطهارة بالأطراف الصناعية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21624)⁩ أن من ابتلي بفقد أحد أطرافه واستعان على ذلك بطرف تعويضي يلزمه عند الطهارة إيصال الماء إلى ما يجب إيصاله إليه على ما فصّل الجواب."
  en: "A questioner asked how purification is performed with prosthetic limbs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21624) answered that one who has lost a limb and uses a prosthetic must, at purification, convey water to what water must reach — as the answer details."
  ur: "ایک سائل نے مصنوعی اعضا کے ساتھ طہارت کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21624)⁩ نے جواب دیا کہ جس کا عضو کھو گیا ہو اور مصنوعی عضو استعمال کرتا ہو اسے طہارت میں وہاں پانی پہنچانا ہوگا جہاں واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó cómo se realiza la purificación con prótesis. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21624) respondió que quien ha perdido una extremidad y usa una prótesis debe, durante la purificación, llevar el agua hasta donde debe llegar, como se detalla en la respuesta."
  fr: "Un internaute a demandé comment se purifier avec des prothèses. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21624) a répondu que la personne amputée utilisant une prothèse doit, lors de la purification, acheminer l'eau jusqu'aux parties du corps concernées, comme le précise la réponse."
  tr: "Bir soru soran kişi, protez uzuvlarla arınmanın nasıl yapılacağını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21624), bir uzvunu kaybeden ve telafi edici bir taraf kullanan kişinin, arınma sırasında suyu verilmesi gereken yere teslim etmekle yükümlü olduğunu yanıtladı; bu cevapta açıklanmıştır."
  id: "Seorang penanya bertanya tentang cara melakukan pemurnian dengan anggota tubuh prostetik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21624) menjawab bahwa siapa pun yang mengalami kehilangan salah satu anggota tubuhnya dan menggunakan sistem kompensasi selama pemurnian wajib mengalirkan air sesuai dengan yang seharusnya, seperti yang dijelaskan dalam jawaban."
