summary:
  ar: "سائل سأل عن كيفية الطهارة بالأطراف الصناعية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21624)⁩ أن من ابتلي بفقد أحد أطرافه واستعان على ذلك بطرف تعويضي يلزمه عند الطهارة إيصال الماء إلى ما يجب إيصاله إليه على ما فصّل الجواب."
  en: "A questioner asked how purification is performed with prosthetic limbs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21624) answered that one who has lost a limb and uses a prosthetic must, at purification, convey water to what water must reach — as the answer details."
  ur: "ایک سائل نے مصنوعی اعضا کے ساتھ طہارت کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21624)⁩ نے جواب دیا کہ جس کا عضو کھو گیا ہو اور مصنوعی عضو استعمال کرتا ہو اسے طہارت میں وہاں پانی پہنچانا ہوگا جہاں واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
