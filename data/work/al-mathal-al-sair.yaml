summary:
  ar: "المثل السائر في أدب الكاتب والشاعر، كتاب في البلاغة لمؤلفه ضياء الدين ابن الأثير، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 637هـ / 1239م {cite:wikipedia-ar-al-mathal-al-sair}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: Book 23794 and Book 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}. لم يقرأ المتحف الكتاب."
  en: "al-Mathal al-Sair fi Adab al-Katib wa-l-Shair, a book on rhetoric (balagha) by Diya' al-Din ibn al-Athir; its date in a research summary supplied to the museum is d. 637 AH / 1239 CE {cite:wikipedia-ar-al-mathal-al-sair}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: Book 23794 and Book 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}. The museum has not read the book."
  ur: "المثل السائر في أدب الكاتب والشاعر، بلاغت پر ایک کتاب، مصنف ضياء الدين ابن الأثير؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 637ھ / 1239ء {cite:wikipedia-ar-al-mathal-al-sair}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: Book 23794 and Book 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Mathal al-Sair fi Adab al-Katib wa-l-Shair, livre sur la rhétorique (balagha) de Diya' al-Din ibn al-Athir ; sa date dans une synthèse de recherche remise au musée : m. 637 H / 1239 {cite:wikipedia-ar-al-mathal-al-sair}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : Book 23794 and Book 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}. Le musée n'a pas lu le livre."
  es: "al-Mathal al-Sair fi Adab al-Katib wa-l-Shair, libro sobre retórica (balagha) de Diya' al-Din ibn al-Athir; su fecha en un resumen de investigación entregado al museo: m. 637 H. / 1239 {cite:wikipedia-ar-al-mathal-al-sair}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: Book 23794 and Book 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}. El museo no ha leído el libro."
  tr: "Yazar ve Şairin Edebiyatında Yürüyen Tema, yazarı Diya'ddin İbn el-Athir'in retorik üzerine bir kitap ve müzeye sunulan bir araştırma özetine göre tarihi: ö. 637 Hicri / 1239 M.S. {cite:wikipedia-ar-al-mathal-al-sair}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Evet, ve Kapsamlı Kütüphane'deki kitap: Kitap 23794 ve Kitap 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}. Müze kitabı okumadı."
  id: "Tema Berjalan dalam Sastra Penulis dan Penyair, sebuah buku tentang retorika oleh penulisnya Diya' al-Din Ibn al-Athir, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 637 AH / 1239 M {cite:wikipedia-ar-al-mathal-al-sair}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku di Perpustakaan Komprehensif: Buku 23794 dan Buku 10551 {cite:shamela-ws-book-23794} {cite:shamela-ws-book-10551}. Museum tidak membaca buku tersebut."
