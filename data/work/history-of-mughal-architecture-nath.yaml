summary:
  ar: "سلسلة في أربعة مجلدات للمؤرخ الهندي ر. ناث، أولها (1982) دراسة أسلوبية لمباني بابر وهمايون وأوائل عهد أكبر في دلهي، من بساتين بابر إلى قبر همايون {cite:nath-history-of-mughal-architecture-1-1982 p. vii}."
  en: "A four-volume series by the Indian historian R. Nath, the first (1982) a stylistic study of the buildings of Babur, Humayun and early Akbar at Delhi, from Babur's gardens to Humayun's tomb {cite:nath-history-of-mughal-architecture-1-1982 p. vii}."
  es: "Una serie de cuatro volúmenes del historiador indio R. Nath, el primero (1982) un estudio estilístico de los edificios de Babur, Humayun y el principio de Akbar en Delhi, desde los jardines de Babur hasta la tumba de Humayun {cite:nath-history-of-mughal-architecture-1-1982 p. vii}."
  fr: "Une série en quatre volumes de l'historien indien R. Nath, le premier (1982) étant une étude stylistique des bâtiments de Babur, Humayun et du début d'Akbar à Delhi, des jardins de Babur au tombeau d'Humayun {cite:nath-history-of-mughal-architecture-1-1982 p. vii}."
  ur: "ہندوستانی مورخ آر ناتھ کی چار جلدوں پر مشتمل سیریز، پہلی (1982) بابر، ہمایوں اور ابتدائی اکبر کی دہلی میں بابر کے باغات سے لے کر ہمایوں کے مقبرے تک کی عمارتوں کا اسٹائلسٹک مطالعہ۔ vii}"
  tr: "Hintli tarihçi R. Nath'ın dört ciltlik serisi olan ilk (1982), Babur, Humayun ve erken Akbar dönemi binalarının üslup incelemesidir; Babur'un bahçelerinden Humayun'un mezarına kadar {cite:nath-history-of-mughal-architecture-1-1-1982 s. vii}."
  id: "Seri empat jilid oleh sejarawan India R. Nath, yang pertama (1982) adalah studi gaya bangunan Babur, Humayun, dan era awal Akbar di Delhi, mulai dari kebun Babur hingga makam Humayun {cite:nath-history-of-mughal-architecture-1-1-1982 hlm. vii}."
