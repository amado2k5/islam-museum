id: work/fatwa-iifa-108-uncovered-credit-cards
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 108 (12/2) بشأن بطاقات الائتمان غير المغطاة", en: "IIFA resolution 108 (12/2) on uncovered credit cards", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 108 (12/2): غیر مغطیٰ کریڈٹ کارڈز", es: "Resolución 108 (12/2) de la IIFA sobre tarjetas de crédito sin cobertura", fr: "Résolution 108 (12/2) de l'IIFA relative aux cartes de crédit non couvertes" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، بناءً على قراره 63 ⁦(7/1)⁩ بشأن الأسواق المالية الذي أجل تكييف بطاقة الائتمان إلى دورة لاحقة، وإشارةً إلى قراره 96 ⁦(10/4)⁩. استحضر تعريف بطاقة الائتمان غير المغطاة: مستند يعطيه مصدره ⁦(البنك المصدر)⁩ لشخص طبيعي أو اعتباري ⁦(حامل البطاقة)⁩ بعقد بينهما يمكنه من شراء السلع أو الخدمات ممن يعتمد المستند ⁦(التاجر)⁩ دون دفع الثمن حالًا لتضمنه التزام المصدر بالدفع من حسابه ثم يعود على حاملها دوريًا، وبعضها يفرض فوائد ربوية عند التأخير. ثم قرر حكم إصدارها والتعامل بها والرسوم والحسم على التجار والسحب النقدي وشراء الذهب والعملات بضوابط — وقد أُكمل لاحقًا بقرار 139 ⁦(15/5)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), following its resolution 63 (7/1) on financial markets which had deferred classifying the credit card, and citing 96 (10/4). It recalled the definition of the uncovered credit card: a document the issuer (issuing bank) gives a natural or legal person (cardholder) under a contract letting him buy goods or services from accepting merchants without paying on the spot, the issuer's payment obligation being charged to its account then collected from the cardholder periodically — some imposing riba interest on delay. It then ruled on issuing and using them, fees, merchant discount, cash withdrawal and buying gold and currencies under controls; completed later in 139 (15/5)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، اپنی قرارداد 63 ⁦(7/1)⁩ — جس نے مالی بازاروں میں کریڈٹ کارڈ کے تخفیظ کو آئندہ تک مؤجل کیا تھا — اور قرارداد 96 ⁦(10/4)⁩ کے حوالے سے۔ اس نے غیر مغطیٰ کریڈٹ کارڈ کی تعریف یاد کی: دستاویز جو جاری کنندہ ⁦(بینک)⁩ کسی حقیقی یا حکمی شخص ⁦(حاملِ کارڈ)⁩ کو عقد کے ذریعے دیتا ہے جس سے وہ قبول کرنے والے تاجروں سے فوری قیمت ادا کیے بغیر سامان یا خدمات خرید سکتا ہے — جاری کنندہ اپنے حساب سے ادا کرتا ہے پھر وقفے سے حامل سے وصول کرتا ہے، اور بعض میں تاخیر پر سود لگایا جاتا ہے۔ پھر اجرا و استعمال، فیس، تاجرانہ ڈسکاؤنٹ، نقد سحب اور سونے و کرنسی کی خرید کے ضوابط — بعد میں قرارداد 139 ⁦(15/5)⁩ میں مکمل۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), tras su resolución 63 (7/1) sobre mercados financieros, que había aplazado la clasificación de la tarjeta de crédito, y citando la 96 (10/4). Recordó la definición de tarjeta de crédito sin cobertura: un documento que el emisor (banco emisor) entrega a una persona física o jurídica (titular de la tarjeta) en virtud de un contrato que le permite comprar bienes o servicios a comercios que aceptan la tarjeta sin pagar en el acto, siendo la obligación de pago del emisor cargada a su cuenta y cobrada periódicamente al titular de la tarjeta, algunos imponiendo intereses de riba por demora. A continuación, dictaminó sobre la emisión y el uso de las tarjetas, las comisiones, los descuentos para comerciantes, la retirada de efectivo y la compra de oro y divisas bajo control; completada posteriormente en la 139 (15/5)."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), faisant suite à sa résolution 63 (7/1) sur les marchés financiers qui avait reporté la classification de la carte de crédit, et citant la résolution 96 (10/4), a rappelé la définition de la carte de crédit non couverte: un document que l'émetteur (banque émettrice) remet à une personne physique ou morale (titulaire de la carte) en vertu d'un contrat lui permettant d'acheter des biens ou des services auprès de commerçants acceptant la carte sans paiement immédiat, l'obligation de paiement de l'émetteur étant débitée de son compte puis recouvrée auprès du titulaire de la carte périodiquement – certaines banques imposant des intérêts de retard (riba). L'Académie s'est ensuite prononcée sur l'émission et l'utilisation de ces cartes, les frais, les remises accordées aux commerçants, les retraits d'espèces et l'achat d'or et de devises sous contrôle; cette question a été complétée ultérieurement par la résolution 139 (15/5)."
