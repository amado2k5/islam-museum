class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 22: بئر معونة وبنو النضير"
  en: "The Prophetic Biography for Reformers, episode 22: Bi'r Ma'una and Banu al-Nadir"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 22: بئر معونہ اور بنو نضیر"
  fr: "La biographie prophétique pour les réformateurs, épisode 22 : Bi'r Ma'una et les Banu al-Nadir"
  es: "La biografía profética para los reformadores, episodio 22: Bi'r Ma'una y los Banu al-Nadir"
summary:
  ar: "ينتقل أحمد السيد إلى الأحداث الواقعة بين أحد والخندق، فيتناول مأساة بئر معونة وحزن النبي والقنوت الذي تلاها، ثم إجلاء بني النضير، مع الدروس التي يستخلصها للمصلحين، ويختم بالمنافقين الذين خذلوا حلفاءهم."
  en: "Ahmed Elsayed turns to the events between Uhud and the Trench. He treats the tragedy of Bi'r Ma'una, the Prophet's grief and the prayer of supplication that followed, and then the expulsion of Banu al-Nadir, with the lessons he draws for reformers, ending on the hypocrites who abandoned their allies."
  ur: "احمد السید احد اور خندق کے درمیان کے واقعات کی طرف آتے ہیں۔ وہ بئر معونہ کے سانحے، نبی کے غم اور اس کے بعد کی دعائے قنوت، پھر بنو نضیر کی جلاوطنی کو بیان کرتے ہیں، اور مصلحین کے لیے اپنے اخذ کردہ اسباق بتاتے ہیں، اور اختتام ان منافقین پر کرتے ہیں جنہوں نے اپنے حلیفوں کا ساتھ چھوڑ دیا۔"
  fr: "Ahmed Elsayed aborde les événements entre Uhud et la Tranchée. Il traite la tragédie de Bi'r Ma'una, le chagrin du Prophète et la prière d'invocation qui suivit, puis l'expulsion des Banu al-Nadir, avec les leçons qu'il en tire pour les réformateurs, et termine sur les hypocrites qui abandonnèrent leurs alliés."
  es: "Ahmed Elsayed pasa a los sucesos entre Uhud y la Trinchera. Trata la tragedia de Bi'r Ma'una, el dolor del Profeta y la oración de súplica que la siguió, luego la expulsión de los Banu al-Nadir, con las lecciones que extrae para los reformadores, y termina con los hipócritas que abandonaron a sus aliados."
