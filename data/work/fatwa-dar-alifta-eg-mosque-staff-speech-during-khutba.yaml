id: work/fatwa-dar-alifta-eg-mosque-staff-speech-during-khutba
class: work
kind: fatwa
label: { ar: "حكم كلام القائمين على المسجد أثناء خطبة الجمعة لتنظيم الناس", en: "Mosque stewards speaking during the Friday sermon to organise people", ur: "خطبہ کے دوران مسجد کے منتظمین کا لوگوں کی ترتیب کے لیے بولنا", es: "Los ujieres de la mezquita hablan durante el sermón del viernes para organizar a la gente.", fr: "Les responsables de la mosquée prennent la parole pendant le sermon du vendredi pour organiser les fidèles." }
summary:
  ar: "سائل سأل عن كلام القائمين على المسجد أثناء خطبة الجمعة لتنظيم الناس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21862)⁩ أنه يجوز لهم الكلام أثناء الخطبة ما دام هناك حاجة تدعو إلى ذلك كتنظيم حركة الناس على ما فصّل الجواب."
  en: "A questioner asked about mosque stewards speaking during the Friday sermon to organise the worshippers. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21862) answered that they may speak during the sermon when a need calls for it — such as organising the movement of people — as the answer details."
  ur: "ایک سائل نے خطبہ کے دوران مسجد کے منتظمین کے لوگوں کی ترتیب کے لیے بولنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21862)⁩ نے جواب دیا کہ جب ضرورت ہو — جیسے لوگوں کی آمد و رفت کی ترتیب — تو خطبہ کے دوران بولا جا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la posibilidad de que los ujieres de la mezquita hablaran durante el sermón del viernes para organizar a los fieles. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21862) respondió que pueden hablar durante el sermón cuando sea necesario, como por ejemplo para organizar el movimiento de las personas, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé si les responsables de la mosquée pouvaient prendre la parole pendant le sermon du vendredi pour organiser les fidèles. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21862) a répondu qu'ils pouvaient intervenir pendant le sermon lorsque cela s'avérait nécessaire, par exemple pour organiser la circulation des fidèles, comme le précise la réponse."
