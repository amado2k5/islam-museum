label: { ar: "حكم كلام القائمين على المسجد أثناء خطبة الجمعة لتنظيم الناس", en: "Mosque stewards speaking during the Friday sermon to organise people", ur: "خطبہ کے دوران مسجد کے منتظمین کا لوگوں کی ترتیب کے لیے بولنا" }
summary:
  ar: "سائل سأل عن كلام القائمين على المسجد أثناء خطبة الجمعة لتنظيم الناس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21862)⁩ أنه يجوز لهم الكلام أثناء الخطبة ما دام هناك حاجة تدعو إلى ذلك كتنظيم حركة الناس على ما فصّل الجواب."
  en: "A questioner asked about mosque stewards speaking during the Friday sermon to organise the worshippers. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21862) answered that they may speak during the sermon when a need calls for it — such as organising the movement of people — as the answer details."
  ur: "ایک سائل نے خطبہ کے دوران مسجد کے منتظمین کے لوگوں کی ترتیب کے لیے بولنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21862)⁩ نے جواب دیا کہ جب ضرورت ہو — جیسے لوگوں کی آمد و رفت کی ترتیب — تو خطبہ کے دوران بولا جا سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
