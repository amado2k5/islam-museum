summary:
  ar: "كتاب أبي حاتم محمد بن حبان البستي (ت 354هـ) في الحديث الصحيح المجرد، واسمه على أصله «المسند الصحيح على التقاسيم والأنواع من غير وجود قطع في سندها ولا ثبوت جرح في ناقليها»، وعُرف بين المحدثين بالتقاسيم والأنواع وعلى ألسنة الناس بصحيح ابن حبان {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 6-9}. رتّبه مؤلفه ترتيباً مخترعاً على خمسة أقسام: الأوامر والنواهي والإخبار والإباحات وأفعال النبي، في أربعمائة نوع {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 58-59, 109}، وشرط لكل راوٍ خمس خصال {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}، ثم رتبه الأمير علاء الدين ابن بلبان على الأبواب في «الإحسان» دون أن يُسقط منه حرفاً {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 10}."
  en: "The collection of sound hadith of Abu Hatim Muhammad ibn Hibban al-Busti (d. 354 AH), whose original title is 'The Sound Musnad on Divisions and Types, with no Break in its Chains and no Established Discreditation of its Transmitters'; hadith scholars knew it as al-Taqasim wa-al-Anwa' and the public as Sahih Ibn Hibban {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 6-9}. Its author laid it out in an arrangement of his own invention in five divisions — commands, prohibitions, reports, permissions and the Prophet's own acts — holding four hundred types {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 58-59, 109}, and required five qualities of every narrator {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}; al-Amir 'Ala' al-Din Ibn Balban later rearranged it by chapter in al-Ihsan without dropping a letter {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 10}."
  ur: "ابو حاتم محمد بن حبان بستی (وفات 354ھ) کی صحیح مجرد احادیث کی کتاب، جس کا اصل نام «المسند الصحیح علی التقاسیم والانواع من غیر وجود قطع فی سندہا ولا ثبوت جرح فی ناقلیہا» ہے؛ محدثین اسے التقاسیم والانواع اور عام لوگ صحیح ابن حبان کہتے ہیں {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 6-9}۔ مصنف نے اسے اپنی ایجاد کردہ ترتیب پر پانچ اقسام میں رکھا: اوامر، نواہی، اخبار، اباحات اور نبی کے افعال، جن میں چار سو انواع ہیں {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 58-59, 109}، اور ہر راوی کے لیے پانچ خصلتیں شرط کیں {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}؛ پھر امیر علاء الدین ابن بلبان نے «الاحسان» میں اسے ابواب پر مرتب کیا اور اس کا ایک حرف بھی نہیں گرایا {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 10}۔"
