summary:
  ar: "كتاب الخصائص لابن جني في أصول النحو وفلسفة اللغة، يصفه مؤلفه بأنه من أشرف ما صُنّف في علم العرب وأذهبه في طريق القياس والنظر، ويذكر أن غرضه ليس الرفع والنصب والجر والجزم بل إثارة معادن المعاني وتقرير حال الأوضاع والمبادئ {cite:khasais-najjar 1 p.1}. فيه حدّ اللغة والنحو والإعراب والبناء، وباب في أصل اللغة أإلهام هي أم اصطلاح {cite:khasais-najjar 1 p.34}."
  en: "Ibn Jinni's al-Khasa'is, on the principles of grammar and the philosophy of language, which its author calls among the noblest works compiled on the knowledge of the Arabs and the one most given to analogy and reasoning, and whose aim, he says, is not nominative, accusative, genitive and jussive but to dig out the mines of meaning and fix the state of the origins and first principles {cite:khasais-najjar 1 p.1}. It defines language, nahw, i'rab and bina, and has a chapter on whether language began as inspiration or as convention {cite:khasais-najjar 1 p.34}."
  ur: "ابن جنی کی الخصائص نحو کے اصول اور فلسفۂ لسان پر ہے؛ مصنف اسے عربوں کے علم میں لکھی گئی بہترین کتابوں میں اور قیاس و نظر میں سب سے آگے بتاتے ہیں، اور کہتے ہیں کہ ان کا مقصد رفع، نصب، جر اور جزم نہیں بلکہ معانی کی کانیں کھودنا اور اوضاع و مبادی کا حال بیان کرنا ہے {cite:khasais-najjar 1 p.1}۔ اس میں لغت، نحو، اعراب اور بناء کی تعریفیں ہیں اور ایک باب اس پر کہ زبان کی اصل الہام ہے یا اصطلاح {cite:khasais-najjar 1 p.34}۔"
  fr: "al-Khasa'is d'Ibn Jinni, sur les principes de la grammaire et la philosophie du langage, que son auteur range parmi les plus nobles ouvrages composés sur la science des Arabes et le plus attaché à l'analogie et au raisonnement, et dont le but, dit-il, n'est pas le nominatif, l'accusatif, le génitif et le jussif mais de mettre au jour les mines du sens et de fixer l'état des origines et des principes {cite:khasais-najjar 1 p.1}. Il définit la langue, le nahw, l'i'rab et le bina, et consacre un chapitre à la question de savoir si la langue est née d'une inspiration ou d'une convention {cite:khasais-najjar 1 p.34}."
  es: "al-Khasa'is de Ibn Jinni, sobre los principios de la gramática y la filosofía del lenguaje, que su autor cuenta entre las obras más nobles compuestas sobre la ciencia de los árabes y la más dada a la analogía y el razonamiento, y cuyo objetivo, dice, no es el nominativo, el acusativo, el genitivo y el yusivo sino sacar a la luz las minas del sentido y fijar el estado de los orígenes y principios {cite:khasais-najjar 1 p.1}. Define la lengua, el nahw, el i'rab y el bina, y dedica un capítulo a si la lengua nació de la inspiración o de la convención {cite:khasais-najjar 1 p.34}."
  tr: "İbn Cinci'nin dilbilgisi ve felsefesi ilkeleri üzerine yazdığı El-Hasayis kitabı, yazarı onu Araplar biliminin en asil eserlerinden biri ve benzetme ile akıl yürütme alanında en ileri düzeyde olan eserler olarak tanımlar. Amacının akuzatıcı, akuzatif ya da iddia etmek değil, anlamların metallerini karıştırmak ve durumların ve ilkelerin durumunu belirlemek olduğunu belirtir {atıf:khasais-najjar 1 s.1}. Dil, dilbilgisi, ayrıştırma ve yapının sınırlarını ve dilin kökeni üzerine bir bölüm içerir: ilham mı yoksa terminoloji mi {cite:khasais-najjar 1 s.34}."
  id: "Buku Al-Khasais karya Ibn Jinni tentang prinsip tata bahasa dan filsafat bahasa, penulisnya menggambarkannya sebagai salah satu karya paling mulia dalam ilmu pengetahuan bangsa Arab dan yang paling maju dalam bidang analogi dan penalaran. Ia menyebutkan bahwa tujuannya bukan untuk mengangkat akal atau akusatif atau untuk bersikap tegas, melainkan untuk membangkitkan logam-logam makna dan menetapkan keadaan situasi dan prinsip {cite:khasais-najjar 1 hlm.1}. Buku ini memuat batas-batas bahasa, tata bahasa, penguraian, dan konstruksi, serta sebuah bab tentang asal-usul bahasa: apakah itu inspirasi atau terminologi {cite:khasais-najjar 1 hlm.34}."
