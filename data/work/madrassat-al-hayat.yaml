label:
  ar: "مدرسة الحياة (شرح صيد الخاطر)"
  en: "Madrasat al-Hayat: The School of Life (commentary on Sayd al-Khatir)"
  ur: "مدرسۃ الحیاۃ: زندگی کا مدرسہ (صید الخاطر کی شرح)"
summary:
  ar: "سلسلة دروس رمضانية لأبي إسحاق الحويني يشرح فيها خواطر من «صيد الخاطر» لابن الجوزي، يحفظ أرشيف أسابيل منها اثنتي عشرة حلقة مصوّرة (الحلقة السابعة تعيد الرابعة): سوء الفهم عن الله ورسوله وقصة كتاب حاطب، وحقيقة العلم النافع وليلة القدر وصلة بن أشيم وخبيب، والأولياء وجليبيب وموت سفيان الثوري وحفظ الوقت، والفراسة، والكبر واللباس؛ ومعها في الأرشيف درس في حديث الهجرة إلى الحبشة، ودرس في كتاب العلم من صحيح البخاري، ودرس في حديث أصحاب الغار ودين الزبير، ودرس في الحيدة، وجزآن من محاضرات في السمع والطاعة."
  en: "A Ramadan lesson series by Abu Ishaq al-Heweny explaining reflections from Ibn al-Jawzi's Sayd al-Khatir, of which the Assabile archive keeps twelve video episodes (episode 7 repeats episode 4): misunderstanding God and His Messenger and the story of Hatib's letter; the reality of beneficial knowledge, Laylat al-Qadr, Sila ibn Ashyam and Khubayb; the friends of God, Julaybib, the death of Sufyan al-Thawri and guarding one's time; perspicacity; and pride and dress. Filed with them in the archive are a lesson on the hadith of the migration to Abyssinia, one from the Book of Knowledge of Sahih al-Bukhari, one on the men of the cave and al-Zubayr's debt, one on evasion, and two parts of lectures on hearing and obeying."
  ur: "ابو اسحاق حوینی کا رمضانی سلسلۂ دروس جس میں وہ ابن الجوزی کی «صید الخاطر» کے خاطروں کی شرح کرتے ہیں؛ اسابیل آرکائیو میں اس کی بارہ ویڈیو اقساط محفوظ ہیں (ساتویں قسط چوتھی کو دہراتی ہے): اللہ اور رسول کے بارے میں غلط فہمی اور حاطب کے خط کا قصہ؛ علمِ نافع کی حقیقت، لیلۃ القدر، صلہ بن اشیم اور خبیب؛ اولیا، جلیبیب، سفیان ثوری کی وفات اور وقت کی حفاظت؛ فراست؛ اور کبر اور لباس۔ آرکائیو میں ان کے ساتھ ہجرتِ حبشہ کی حدیث پر ایک درس، صحیح بخاری کی کتاب العلم سے ایک درس، غار والوں اور زبیر کے قرض پر ایک درس، «الحیدہ» پر ایک درس، اور سمع و طاعت پر محاضرات کے دو حصے بھی ہیں۔"
