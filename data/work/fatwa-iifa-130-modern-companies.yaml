label: { ar: "قرار مجمع الفقه الإسلامي الدولي 130 (14/4) بشأن الشركات الحديثة: الشركات القابضة وأحكامها الشرعية", en: "IIFA resolution 130 (14/4) on modern companies: holding companies and others and their legal rulings", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 130 (14/4): جدید کمپنیاں — ہولڈنگ کمپنیاں وغیرہ اور ان کے شرعی احکام", es: "Resolución 130 (14/4) de la IIFA sobre sociedades modernas: sociedades holding y otras, y sus resoluciones legales.", fr: "Résolution 130 (14/4) de l'IIFA sur les sociétés modernes: sociétés holding et autres et leurs décisions juridiques", tr: "Uluslararası İslami Fıkıh Akademisi'nin 130 (14/4) modern şirketlerle ilgili kararı: Holding şirketleri ve şeriat hükümleri", id: "Keputusan Akademi Fiqh Islam Internasional 130 (14/4) mengenai perusahaan modern: Perusahaan induk dan putusan Syariah mereka" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. عرّف شركات الأموال بأنها ما تعتمد في تكوينها على رؤوس أموال الشركاء بغض النظر عن الشخصية المستقلة لكل مساهم وتكون أسهمها قابلة للتداول، وقسمها إلى شركة المساهمة ⁦(رأسمال مقسم لأسهم متساوية متداولة ومسؤولية بمقدار الحصة)⁩، وشركة التوصية بالأسهم ⁦(شركاء متضامنون مسؤولون تضامنيًا وشركاء موصون بمسؤولية محدودة)⁩، والشركة ذات المسؤولية المحدودة، والشركة القابضة. ثم تناول الأحكام الشرعية لتأسيسها والتعامل بأسهمها وضوابط نشاطها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It defined companies of capital as those formed on the partners' capital regardless of each shareholder's independent personality, with tradable shares; classified them into the joint-stock company (capital divided into equal tradable shares, liability limited to the share), the share partnership limited by shares (joint partners bearing full solidary liability alongside limited partners whose liability is capped at their holdings), the limited-liability company, and the holding company. It then set out the legal rulings for their formation, share dealings and the controls on their activity."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ اس نے مالی کمپنیوں کی تعریف کی: وہ کمپنیاں جو شرکاء کے سرمائے پر قائم ہوں، ہر حصہ دار کی آزاد شخصیت سے قطع نظر، اور جن کے حصص قابلِ تداول ہوں؛ اور ان کی تقسیم کی: مساہمہ کمپنی ⁦(برابر قابلِ تداول حصص میں تقسیم شدہ سرمایہ اور حصے کے تناسب سے ذمہ داری)⁩، توصیہ بالأسهم کمپنی ⁦(مکمل تضامنی ذمہ دار شرکاء کے ساتھ محدود ذمہ دار حصہ دار)⁩، محدود ذمہ داری کمپنی، اور ہولڈنگ کمپنی۔ پھر ان کے قیام، حصص کی تجارت اور سرگرمی کے ضوابط کے شرعی احکام۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión celebrada en Doha (del 8 al 13 de Dhu al-Qa'da de 1423, del 11 al 16 de enero de 2003). Definió las sociedades de capital como aquellas formadas sobre el capital de los socios, independientemente de la personalidad jurídica de cada accionista, con acciones negociables; las clasificó en sociedad anónima (capital dividido en acciones negociables iguales, responsabilidad limitada a la participación), sociedad colectiva en comandita por acciones (socios con responsabilidad solidaria plena junto con socios comanditarios cuya responsabilidad está limitada a sus participaciones), sociedad de responsabilidad limitada y sociedad holding. A continuación, estableció las normas jurídicas para su constitución, la negociación de acciones y los controles sobre su actividad."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003) définit les sociétés de capitaux comme celles constituées sur le capital des associés, indépendamment de la personnalité morale de chaque actionnaire, et dont les actions sont négociables. Elle les classe en quatre catégories: la société par actions (capital divisé en actions négociables égales, responsabilité limitée à l'apport en actions), la société en commandite par actions (associés solidairement responsables aux côtés d'associés commanditaires dont la responsabilité est limitée à leurs apports), la société à responsabilité limitée (SARL) et la société holding. Elle établit ensuite les règles juridiques relatives à leur constitution, aux opérations sur actions et au contrôle de leur activité."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki on dördüncü oturumunda (8–13 Dhu al-Qi'dah 1423 H, 11–16 Ocak 2003) toplu kararı alındı. Sermaye şirketleri, kuruluşu ortakların sermayesine bağlı olan ve hisselerinin ticarete açık olduğu şirketler olarak tanımlandı. Bunları anonim şirket (sermaye eşit işlem gören hisselere ve hisseye orantılı yükümlülüklere bölünmüş), ortaklık şirketi (müşterek ve müştersyen sorumlu ortaklar ile sınırlı ortaklar), sınırlı sorumluluk şirketi ve holding şirketi olarak ikiye ayrıldı. Daha sonra kuruluş için Şeriat kararları, hisselerle ilgili işlemler ve faaliyet düzenlemeleri ele alındı."
  id: "Resolusi kolektif Akademi Fiqh Islam Internasional dalam sesi keempat belas di Doha (8–13 Dhu al-Qi'dah 1423 H, 11–16 Januari 2003). Perusahaan modal didefinisikan sebagai perusahaan yang pembentukannya bergantung pada modal mitra tanpa memandang kepribadian independen masing-masing pemegang saham, dan sahamnya dapat diperdagangkan. Perusahaan ini dibagi menjadi perusahaan saham gabungan (modal dibagi menjadi saham yang diperdagangkan sama dan kewajiban sebanding dengan saham), perusahaan kemitraan (mitra bersama dan mitra terbatas), perusahaan terbatas, dan perusahaan induk. Kemudian ia menanggapi putusan Syariah untuk pendiriannya, transaksi dengan sahamnya, dan peraturan kegiatannya."
