id: work/fatwa-dar-alifta-eg-dental-filling-while-fasting
class: work
kind: fatwa
label: { ar: "حكم حشو الأسنان أثناء الصيام", en: "Dental filling while fasting", ur: "روزے میں دانت بھرانا", es: "Empaste dental en ayunas", fr: "Obturation dentaire à jeun" }
summary:
  ar: "سائل سأل عن حشو الأسنان ومعالجتها أثناء الصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21085)⁩ أن حشو الأسنان ومعالجتها أثناء الصيام لا يفطر الصائم ما لم يتعمد ابتلاع شيء مما في فمه على ما فصّل الجواب."
  en: "A questioner asked about having teeth filled and treated while fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21085) answered that dental filling and treatment do not break the fast unless the fasting person deliberately swallows something from what is in his mouth — as the answer details."
  ur: "ایک سائل نے روزے میں دانت بھرانے اور علاج کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21085)⁩ نے جواب دیا کہ یہ روزہ نہیں توڑتا جب تک کہ روزہ دار جان کر کچھ نہ نگل لے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de someterse a empastes y tratamientos dentales durante el ayuno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21085) respondió que los empastes y tratamientos dentales no rompen el ayuno a menos que la persona que ayuna ingiera deliberadamente algo de lo que tiene en la boca, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant les soins dentaires pendant le jeûne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21085) a répondu que les soins dentaires ne rompent pas le jeûne, sauf si la personne qui jeûne avale délibérément quelque chose se trouvant dans sa bouche – comme le précise la réponse."
