label: { ar: "حكم حشو الأسنان أثناء الصيام", en: "Dental filling while fasting", ur: "روزے میں دانت بھرانا" }
summary:
  ar: "سائل سأل عن حشو الأسنان ومعالجتها أثناء الصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21085)⁩ أن حشو الأسنان ومعالجتها أثناء الصيام لا يفطر الصائم ما لم يتعمد ابتلاع شيء مما في فمه على ما فصّل الجواب."
  en: "A questioner asked about having teeth filled and treated while fasting. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21085) answered that dental filling and treatment do not break the fast unless the fasting person deliberately swallows something from what is in his mouth — as the answer details."
  ur: "ایک سائل نے روزے میں دانت بھرانے اور علاج کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21085)⁩ نے جواب دیا کہ یہ روزہ نہیں توڑتا جب تک کہ روزہ دار جان کر کچھ نہ نگل لے — جیسا کہ جواب میں تفصیل ہے۔"
