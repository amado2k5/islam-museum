id: work/fatwa-aliftaa-jo-spending-mosque-building-donations
class: work
kind: fatwa
label: { ar: "ضوابط صرف التبرعات المجموعة لبناء مسجد", en: "Rules for spending donations collected to build a mosque", ur: "مسجد کی تعمیر کے لیے جمع کیے گئے عطیات خرچ کرنے کے ضوابط" }
summary:
  ar: "سؤال من جماعة في بلد أوروبي تجمع التبرعات لبناء مسجد بعد قرار بهدم مسجدها المستأجر، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذه الأموال تأخذ حكم الوقف ولا تُصرف إلا حيث أراد المتبرع. أجابت الدائرة بأن الأموال المجموعة لبناء وقف كالمسجد تأخذ حكم الوقف، فقد خرجت عن ملك أصحابها ولا يملك أحد التصرف فيها، وتبقى كذلك حتى يتم البناء. ونبّهت إلى أن أموال الزكاة لا يجوز أن تُجمع لبناء المساجد، لأن مصارفها محصورة في الأصناف الثمانية، وإنما تُبنى من الصدقات والتبرعات. وقالت إن ما جُمع للمسجد لا يُصرف منه على السفر والطعام ونحوهما إلا إذا أذن المتبرع بقدر معين بعد علمه بحقيقة الأمر، وحينئذ يكون الإنفاق بالمعروف وبما يحقق المصلحة. وأما استثمار التبرعات فاشترطت لجوازه إخبار المتبرعين بذلك عند الجمع، لأن المتبرع قد لا يرضى بتأخير وصول ماله أو بتعريضه للخسارة، وشرطه معتبر، ونقلت عن زكريا الأنصاري في فتح الوهاب وعن حاشية إعانة الطالبين أن شرط الواقف متبع. وختمت بأن الوكيل على هذه الأموال مؤتمن، فإن صرفها في غير وجهها أو قصّر في حفظها أثم وضمنها."
  en: "A question from a community in a European country collecting donations to build a mosque after their rented mosque was ordered demolished, in which Jordan's General Iftaa Department answered that the money takes the ruling of an endowment and may be spent only as the donors intended. The Department answered that money collected to build an endowment such as a mosque takes the ruling of an endowment: it has left its donors' ownership, no one is free to dispose of it, and it remains so until the building is complete. It noted that zakat money may not be collected for building mosques, because the recipients of zakat are limited to eight categories; mosques are built from voluntary charity and donations. It said that nothing collected for the mosque may be spent on travel, food and the like unless the donor permits a set amount after learning the facts, in which case spending must be reasonable and serve the purpose. For investing the donations, it required that donors be told of this when the money is collected, since a donor may not accept a delay in his money reaching its purpose or its exposure to loss, and his condition counts; it cited Zakariyya al-Ansari's Fath al-Wahhab and the gloss I'anat al-Talibin on following the endower's stipulation. It closed by saying that whoever holds this money holds it in trust, and if he spends it on something else or fails to safeguard it, he sins and must make it good."
  ur: "ایک یورپی ملک کی ایسی جماعت کا سوال جو اپنی کرائے کی مسجد کے انہدام کے حکم کے بعد نئی مسجد کے لیے عطیات جمع کر رہی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ رقم وقف کے حکم میں ہے اور صرف عطیہ دینے والے کے منشا کے مطابق خرچ ہو سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد جیسے وقف کی تعمیر کے لیے جمع کی گئی رقم وقف کے حکم میں ہے: وہ دینے والوں کی ملکیت سے نکل چکی ہے، کسی کو اس میں تصرف کا اختیار نہیں، اور تعمیر مکمل ہونے تک یہی حکم رہتا ہے۔ اس نے تنبیہ کی کہ زکوٰۃ کی رقم مسجدوں کی تعمیر کے لیے جمع کرنا جائز نہیں، کیونکہ زکوٰۃ کے مصارف آٹھ اقسام میں محدود ہیں؛ مسجدیں نفلی صدقات اور عطیات سے بنتی ہیں۔ اس نے کہا کہ مسجد کے لیے جمع شدہ رقم سے سفر، کھانے وغیرہ پر کچھ خرچ نہیں ہو سکتا جب تک عطیہ دینے والا حقیقت جان کر ایک مقررہ مقدار کی اجازت نہ دے، اور اس صورت میں خرچ معروف طریقے سے اور مقصد کے مطابق ہو۔ عطیات کی سرمایہ کاری کے لیے اس نے شرط رکھی کہ جمع کرتے وقت عطیہ دہندگان کو اس سے آگاہ کیا جائے، کیونکہ ممکن ہے دینے والا اپنی رقم کے مقصد تک پہنچنے میں تاخیر یا اسے نقصان کے خطرے میں ڈالنے پر راضی نہ ہو، اور اس کی شرط معتبر ہے؛ اس نے واقف کی شرط کی پیروی پر زکریا الانصاری کی فتح الوہاب اور حاشیہ اعانۃ الطالبین سے نقل کیا۔ آخر میں اس نے کہا کہ اس رقم کا نگران امین ہے، اگر وہ اسے کسی اور مد میں خرچ کرے یا اس کی حفاظت میں کوتاہی کرے تو گناہ گار اور ضامن ہوگا۔"
