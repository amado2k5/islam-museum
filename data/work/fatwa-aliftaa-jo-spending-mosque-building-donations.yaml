label: { ar: "ضوابط صرف التبرعات المجموعة لبناء مسجد", en: "Rules for spending donations collected to build a mosque", ur: "مسجد کی تعمیر کے لیے جمع کیے گئے عطیات خرچ کرنے کے ضوابط", es: "Normas para el gasto de las donaciones recaudadas para la construcción de una mezquita.", fr: "Règles d'utilisation des dons collectés pour la construction d'une mosquée", tr: "Cami İnşası İçin Toplanan Bağışların Dağıtımına İlişkin Düzenlemeler", id: "Peraturan Pencairan Donasi yang Dikumpulkan untuk Pembangunan Masjid" }
summary:
  ar: "سؤال من جماعة في بلد أوروبي تجمع التبرعات لبناء مسجد بعد قرار بهدم مسجدها المستأجر، أجابت فيه دائرة الإفتاء العام الأردنية بأن هذه الأموال تأخذ حكم الوقف ولا تُصرف إلا حيث أراد المتبرع. أجابت الدائرة بأن الأموال المجموعة لبناء وقف كالمسجد تأخذ حكم الوقف، فقد خرجت عن ملك أصحابها ولا يملك أحد التصرف فيها، وتبقى كذلك حتى يتم البناء. ونبّهت إلى أن أموال الزكاة لا يجوز أن تُجمع لبناء المساجد، لأن مصارفها محصورة في الأصناف الثمانية، وإنما تُبنى من الصدقات والتبرعات. وقالت إن ما جُمع للمسجد لا يُصرف منه على السفر والطعام ونحوهما إلا إذا أذن المتبرع بقدر معين بعد علمه بحقيقة الأمر، وحينئذ يكون الإنفاق بالمعروف وبما يحقق المصلحة. وأما استثمار التبرعات فاشترطت لجوازه إخبار المتبرعين بذلك عند الجمع، لأن المتبرع قد لا يرضى بتأخير وصول ماله أو بتعريضه للخسارة، وشرطه معتبر، ونقلت عن زكريا الأنصاري في فتح الوهاب وعن حاشية إعانة الطالبين أن شرط الواقف متبع. وختمت بأن الوكيل على هذه الأموال مؤتمن، فإن صرفها في غير وجهها أو قصّر في حفظها أثم وضمنها."
  en: "A question from a community in a European country collecting donations to build a mosque after their rented mosque was ordered demolished, in which Jordan's General Iftaa Department answered that the money takes the ruling of an endowment and may be spent only as the donors intended. The Department answered that money collected to build an endowment such as a mosque takes the ruling of an endowment: it has left its donors' ownership, no one is free to dispose of it, and it remains so until the building is complete. It noted that zakat money may not be collected for building mosques, because the recipients of zakat are limited to eight categories; mosques are built from voluntary charity and donations. It said that nothing collected for the mosque may be spent on travel, food and the like unless the donor permits a set amount after learning the facts, in which case spending must be reasonable and serve the purpose. For investing the donations, it required that donors be told of this when the money is collected, since a donor may not accept a delay in his money reaching its purpose or its exposure to loss, and his condition counts; it cited Zakariyya al-Ansari's Fath al-Wahhab and the gloss I'anat al-Talibin on following the endower's stipulation. It closed by saying that whoever holds this money holds it in trust, and if he spends it on something else or fails to safeguard it, he sins and must make it good."
  ur: "ایک یورپی ملک کی ایسی جماعت کا سوال جو اپنی کرائے کی مسجد کے انہدام کے حکم کے بعد نئی مسجد کے لیے عطیات جمع کر رہی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ رقم وقف کے حکم میں ہے اور صرف عطیہ دینے والے کے منشا کے مطابق خرچ ہو سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد جیسے وقف کی تعمیر کے لیے جمع کی گئی رقم وقف کے حکم میں ہے: وہ دینے والوں کی ملکیت سے نکل چکی ہے، کسی کو اس میں تصرف کا اختیار نہیں، اور تعمیر مکمل ہونے تک یہی حکم رہتا ہے۔ اس نے تنبیہ کی کہ زکوٰۃ کی رقم مسجدوں کی تعمیر کے لیے جمع کرنا جائز نہیں، کیونکہ زکوٰۃ کے مصارف آٹھ اقسام میں محدود ہیں؛ مسجدیں نفلی صدقات اور عطیات سے بنتی ہیں۔ اس نے کہا کہ مسجد کے لیے جمع شدہ رقم سے سفر، کھانے وغیرہ پر کچھ خرچ نہیں ہو سکتا جب تک عطیہ دینے والا حقیقت جان کر ایک مقررہ مقدار کی اجازت نہ دے، اور اس صورت میں خرچ معروف طریقے سے اور مقصد کے مطابق ہو۔ عطیات کی سرمایہ کاری کے لیے اس نے شرط رکھی کہ جمع کرتے وقت عطیہ دہندگان کو اس سے آگاہ کیا جائے، کیونکہ ممکن ہے دینے والا اپنی رقم کے مقصد تک پہنچنے میں تاخیر یا اسے نقصان کے خطرے میں ڈالنے پر راضی نہ ہو، اور اس کی شرط معتبر ہے؛ اس نے واقف کی شرط کی پیروی پر زکریا الانصاری کی فتح الوہاب اور حاشیہ اعانۃ الطالبین سے نقل کیا۔ آخر میں اس نے کہا کہ اس رقم کا نگران امین ہے، اگر وہ اسے کسی اور مد میں خرچ کرے یا اس کی حفاظت میں کوتاہی کرے تو گناہ گار اور ضامن ہوگا۔"
  es: "Una comunidad de un país europeo que recaudaba donaciones para construir una mezquita tras la orden de demolición de la que alquilaban recibió una consulta del Departamento General de Iftaa de Jordania, que explicó que el dinero se considera un fondo patrimonial y solo puede utilizarse según la intención de los donantes. El Departamento indicó que el dinero recaudado para la construcción de una mezquita se rige por las mismas normas: ya no pertenece a sus donantes, nadie puede disponer de él libremente y así permanece hasta la finalización de la obra. Asimismo, señaló que el dinero del zakat no puede utilizarse para la construcción de mezquitas, dado que los beneficiarios del zakat se limitan a ocho categorías; las mezquitas se construyen con donaciones y contribuciones voluntarias. Añadió que el dinero recaudado para la mezquita no puede destinarse a viajes, alimentos ni otros gastos similares, a menos que el donante autorice una cantidad específica tras conocer la situación, en cuyo caso el gasto debe ser razonable y cumplir con el propósito previsto. Para invertir las donaciones, se requería que se informara a los donantes al momento de la recaudación, ya que un donante no puede aceptar demoras en el cumplimiento de su propósito ni el riesgo de pérdidas, y su situación es importante. Se citaron el Fath al-Wahhab de Zakariyya al-Ansari y la glosa I'anat al-Talibin sobre el cumplimiento de las estipulaciones del donante. Se concluyó diciendo que quien posee este dinero lo administra en fideicomiso, y si lo gasta en otra cosa o no lo protege, peca y debe resarcirlo."
  fr: "Une communauté d'un pays européen a posé une question concernant la construction d'une mosquée suite à l'ordre de démolition de leur ancienne mosquée louée. Le Département général de la Iftaa en Jordanie a répondu que les fonds collectés sont considérés comme des dotations et ne peuvent être utilisés que conformément aux intentions des donateurs. Le Département a précisé que les sommes collectées pour la construction d'une mosquée sont soumises au statut de dot: elles ne sont plus la propriété des donateurs, nul ne peut en disposer et elles le restent jusqu'à l'achèvement de la construction. Il a souligné que la zakat ne peut être collectée pour la construction de mosquées, car les bénéficiaires de la zakat sont limités à huit catégories; or, les mosquées sont construites grâce à la charité et aux dons volontaires. Il a ajouté que les fonds collectés pour la mosquée ne peuvent être utilisés pour des dépenses de voyage, de nourriture, etc., sauf autorisation expresse du donateur, après avoir pris connaissance des faits. Dans ce cas, les dépenses doivent être raisonnables et conformes à l'objectif visé. Concernant l'investissement des dons, le Département a exigé que les donateurs en soient informés dès la collecte, car un donateur ne peut accepter un retard dans l'utilisation de son argent ni un risque de perte, et sa situation est prise en compte. L'ouvrage citait Fath al-Wahhab de Zakariyya al-Ansari et la glose I'anat al-Talibin sur le respect des stipulations du donateur. Il concluait en affirmant que quiconque détient cet argent le confie à un tiers, et que s'il le dépense à d'autres fins ou omet de le protéger, il commet un péché et doit le réparer."
  tr: "Avrupa'da bir ülkede, kiralanan caminin yıkılması kararı alındıktan sonra cami inşa etmek için bağış toplayan bir gruptan gelen soruya Ürdün Genel Fetva Dairesi, bu fonların vakıf olarak kabul edildiğini ve sadece bağışçının niyetli olduğu yerde harcandığını yanıtladı. Bakanlık, cami gibi bir vakıf inşası için toplanan fonların mülkiyet sahibi olmadığını, kimsenin bunları elden çıkarma hakkı olmadığını, inşaat tamamlanana kadar vakıf olarak kaldığını belirtti. Zekat fonlarının cami inşası için toplanmaması gerektiği belirtildi çünkü harcamaları sekiz kategoriyle sınırlıdır, bunun yerine hayır ve bağışlardan inşa edilmektedir. Cami için toplanan paranın bağışçı gerçek durumu öğrendikten sonra belirli bir miktara izin vermediği sürece seyahat, yiyecek veya benzeri harcamalar için harcanmadığını belirtmiştir. Bu durumda, harcamalar nazikçe ve faydaya hizmet edecek şekilde yapılır. Bağışlar yatırımı konusunda, bağışların tahsilat sırasında bağışçılara bildirilmesi izinlidir, çünkü bağışçı paralarının ulaşmasını geciktirmeyi veya kayba maruz bırakmayı kabul edemez ve durumu geçerlidir. Fath al-Wahhab'da Zakariya al-Ansari'den ve Arayan'ın yardımının kenar notlarından alıntı yaptım; bu da bağış işleminin koşullarına uyulduğunu belirtti. Bu fonların ajanının güvenilir olduğu; eğer fonları yanlış harcarsa veya korumazsa, günahkar ve garantilidir."
  id: "Sebuah pertanyaan dari sebuah kelompok di sebuah negara Eropa yang mengumpulkan donasi untuk membangun masjid setelah keputusan untuk membongkar masjid sewaan, Departemen Fatwa Umum Yordania menanggapi bahwa dana tersebut dianggap sebagai dana abadi dan hanya digunakan di tempat yang diinginkan oleh donatur. Departemen tersebut menjawab bahwa dana yang dikumpulkan untuk membangun dana abadi seperti masjid dianggap sebagai dana abadi, karena tidak memiliki kepemilikan dan tidak ada yang berhak melepaskannya, dan dana tersebut tetap demikian sampai pembangunan selesai. Departemen tersebut menunjukkan bahwa dana zakat tidak boleh dikumpulkan untuk membangun masjid karena pengeluarannya terbatas pada delapan kategori, melainkan dibangun dari amal dan donasi. Departemen tersebut menyatakan bahwa apa yang dikumpulkan untuk masjid tidak digunakan untuk perjalanan, makanan, atau sejenisnya kecuali donor memberikan izin untuk jumlah tertentu setelah mengetahui hal sebenarnya. Dalam hal ini, pengeluaran dilakukan dengan baik dan dengan cara yang menguntungkan. Adapun donasi investasi, diwajibkan untuk memberitahukan kepada donatur pada saat pengumpulan, karena donor tidak boleh setuju untuk menunda kedatangan uang mereka atau mengeksposnya kerugian, dan syaratnya berlaku. Saya mengutip Zakariya al-Ansari dalam Fath al-Wahhab dan dari catatan pinggir bantuan Pencari bahwa syarat pemberi dana dipatuhi. Kesimpulan tersebut menyimpulkan bahwa agen atas dana tersebut dapat dipercaya; jika ia membelanjakannya dengan cara yang salah atau gagal melewatinya, ia berdosa dan dijamin."
