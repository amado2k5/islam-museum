id: work/fatwa-amja-ghusl-covered-spots
class: work
kind: fatwa
label: { ar: "غسل الأعضاء المغطاة", en: "Washing over covered spots — the Hanbali middle view", ur: "ڈھکے اعضا کا غسل — حنبلی قول", es: "Lavando las zonas cubiertas: la perspectiva intermedia de Hanbali", fr: "Débordant des zones couvertes — la vue médiane Hanbali", tr: "Kapalı Organların Yıkanması", id: "Pencucian organ tertutup" }
summary:
  ar: "سأل سائل أن الماء لا يصل إلى جميع أجزاء جسمه لوجود بقع مغطاة فهل الغسلة صحيحة. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 80747 بتاريخ 31 ديسمبر 2009)⁩ أن الفقهاء اختلفوا في هذه المسألة وأوسط الآراء وأقواها رأي الحنابلة الذين قالوا بأنه يكفي في الحالة المذكورة أن يمسح بالماء على العضو المغطى ويغسل بقية الأعضاء السليمة على ما فصّل الجواب."
  en: "A questioner's water could not reach all his body's parts for covered patches — is the washing valid? Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 80747, 31 December 2009) answered that the jurists differed here, the middlest and strongest view being the Hanbalis': it suffices in the stated case to pass water over the covered member and wash the remaining sound limbs — as the answer details."
  ur: "ڈھکے اعضا پر پانی نہ پہنچے؟ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 80747، 31 دسمبر 2009)⁩ کے مطابق حنبلی قول — ڈھکے عضو پر مسح اور باقی کا غسل کافی ہے۔"
  es: "El agua de una persona que realizaba la consulta no alcanzaba todas las partes de su cuerpo debido a zonas cubiertas; ¿es válido el lavado? El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.º 80747, 31 de diciembre de 2009) respondió que los juristas discrepaban al respecto, siendo la opinión intermedia y más firme la de los hanbalíes: en el caso planteado, basta con pasar agua sobre la parte cubierta y lavar las extremidades sanas restantes, como se detalla en la respuesta."
  fr: "L'eau ne pouvait atteindre toutes les parties du corps d'un homme en raison de zones couvertes; le lavage est-il valable ? Le Dr Muhammad Mawfiq al-Ghalayini (fatwa n° 80747, 31 décembre 2009) a répondu que les juristes divergeaient sur ce point, l'avis le plus modéré et le plus ferme étant celui des Hanbalites: dans le cas présent, il suffit de passer l'eau sur le membre couvert et de laver le reste du corps, comme le précise la réponse."
  tr: "Bir soru soran kişiye, kapalı lekeler nedeniyle su vücudunun tüm bölgelerine ulaşmıyorsa, ghusl geçerli midir? Dr. Muhammad Muwafaq Al-Ghalayini (31 Aralık 2009 tarihli Fetva No. 80747), hukukçuların bu konuda farklı görüşler bulduğunu, en ılımlı ve güçlü görüşlerin ise Hanbaliler olduğunu ve bu durumda kapalı kısmın suyla silinip kalan sağlıklı kısımların yıkanmasının yeterli olduğunu söylediler, cevapta açıklandığı gibi."
  id: "Seorang penanya ditanya apakah air tidak mencapai seluruh bagian tubuhnya karena adanya bintik tertutup, apakah ghusl itu sah? Dr. Muhammad Muwafaq Al-Ghalayini (Fatwa No. 80747 tanggal 31 Desember 2009) menjawab bahwa para ahli hukum berbeda pendapat dalam hal ini, dengan pendapat paling moderat dan kuat adalah Hanbali, yang mengatakan bahwa dalam kasus ini, cukup dengan mengelap bagian yang tertutup dengan air dan mencuci bagian sehat yang tersisa, seperti yang dijelaskan dalam jawaban."
