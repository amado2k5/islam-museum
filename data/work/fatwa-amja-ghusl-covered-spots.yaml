id: work/fatwa-amja-ghusl-covered-spots
class: work
kind: fatwa
label: { ar: "غسل الأعضاء المغطاة", en: "Washing over covered spots — the Hanbali middle view", ur: "ڈھکے اعضا کا غسل — حنبلی قول", es: "Lavando las zonas cubiertas: la perspectiva intermedia de Hanbali" }
summary:
  ar: "سأل سائل أن الماء لا يصل إلى جميع أجزاء جسمه لوجود بقع مغطاة فهل الغسلة صحيحة. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 80747 بتاريخ 31 ديسمبر 2009)⁩ أن الفقهاء اختلفوا في هذه المسألة وأوسط الآراء وأقواها رأي الحنابلة الذين قالوا بأنه يكفي في الحالة المذكورة أن يمسح بالماء على العضو المغطى ويغسل بقية الأعضاء السليمة على ما فصّل الجواب."
  en: "A questioner's water could not reach all his body's parts for covered patches — is the washing valid? Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 80747, 31 December 2009) answered that the jurists differed here, the middlest and strongest view being the Hanbalis': it suffices in the stated case to pass water over the covered member and wash the remaining sound limbs — as the answer details."
  ur: "ڈھکے اعضا پر پانی نہ پہنچے؟ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 80747، 31 دسمبر 2009)⁩ کے مطابق حنبلی قول — ڈھکے عضو پر مسح اور باقی کا غسل کافی ہے۔"
  es: "El agua de una persona que realizaba la consulta no alcanzaba todas las partes de su cuerpo debido a zonas cubiertas; ¿es válido el lavado? El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.º 80747, 31 de diciembre de 2009) respondió que los juristas discrepaban al respecto, siendo la opinión intermedia y más firme la de los hanbalíes: en el caso planteado, basta con pasar agua sobre la parte cubierta y lavar las extremidades sanas restantes, como se detalla en la respuesta."
