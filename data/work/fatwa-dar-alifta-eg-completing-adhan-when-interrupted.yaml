id: work/fatwa-dar-alifta-eg-completing-adhan-when-interrupted
class: work
kind: fatwa
label: { ar: "حكم البناء في الأذان لعارض أصاب المؤذن", en: "Someone continuing the adhan when something befalls the muezzin", ur: "موذن کو کوئی عارضہ ہو تو اذان جاری رکھنے کا حکم", es: "Alguien que continúa el adhan cuando algo le sucede al muecín." }
summary:
  ar: "سائل سأل عن حكم البناء في الأذان إذا أصاب المؤذن عارض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22527)⁩ أن الأذان للصلوات الخمس المكتوبة عبادة بدنية من العبادات البدنية في الشريعة مثل الصلاة في ذلك، وبيّن الجواب حكم إتمام غيره للأذان عند العارض على ضوابط الأذان والإقامة."
  en: "A questioner asked about someone completing the adhan when something befalls the muezzin mid-call. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22527) answered that the adhan for the five obligatory prayers is a bodily act of worship like prayer in this respect, and the answer sets out the ruling on another's finishing it where the muezzin is interrupted, under the controls of adhan and iqama."
  ur: "ایک سائل نے پوچھا کہ اذان کے دوران موذن کو کوئی عارضہ آ جائے تو دوسرا شخص اذان جاری رکھ سکتا ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22527)⁩ نے جواب دیا کہ پانچ فرض نمازوں کی اذان شریعت میں بدنی عبادت ہے جیسے نماز؛ جواب میں یہ بیان ہوا کہ عارضہ آنے پر دوسرا اذان پوری کر سکتا ہے یا نہیں، اذان و اقامت کے ضوابط کے تحت۔"
  es: "Un consultante preguntó sobre la posibilidad de que alguien complete el adhan cuando algo le sucede al muecín durante la llamada. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22527) respondió que el adhan para las cinco oraciones obligatorias es un acto corporal de adoración, al igual que la oración en este sentido, y la respuesta establece la norma sobre si otra persona puede terminarlo cuando el muecín es interrumpido, bajo las normas del adhan y el iqama."
