id: work/fatwa-dar-alifta-eg-completing-adhan-when-interrupted
class: work
kind: fatwa
label: { ar: "حكم البناء في الأذان لعارض أصاب المؤذن", en: "Someone continuing the adhan when something befalls the muezzin", ur: "موذن کو کوئی عارضہ ہو تو اذان جاری رکھنے کا حکم", es: "Alguien que continúa el adhan cuando algo le sucede al muecín.", fr: "Quelqu'un continue l'adhan lorsqu'un incident survient au muezzin", tr: "Müezzini vuran sıradan bir kişi için ezan çağrısına eklenmesine ilişkin karar", id: "Putusan tentang pembangunan dalam panggilan salat untuk orang biasa yang memukul muezzin" }
summary:
  ar: "سائل سأل عن حكم البناء في الأذان إذا أصاب المؤذن عارض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22527)⁩ أن الأذان للصلوات الخمس المكتوبة عبادة بدنية من العبادات البدنية في الشريعة مثل الصلاة في ذلك، وبيّن الجواب حكم إتمام غيره للأذان عند العارض على ضوابط الأذان والإقامة."
  en: "A questioner asked about someone completing the adhan when something befalls the muezzin mid-call. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22527) answered that the adhan for the five obligatory prayers is a bodily act of worship like prayer in this respect, and the answer sets out the ruling on another's finishing it where the muezzin is interrupted, under the controls of adhan and iqama."
  ur: "ایک سائل نے پوچھا کہ اذان کے دوران موذن کو کوئی عارضہ آ جائے تو دوسرا شخص اذان جاری رکھ سکتا ہے یا نہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22527)⁩ نے جواب دیا کہ پانچ فرض نمازوں کی اذان شریعت میں بدنی عبادت ہے جیسے نماز؛ جواب میں یہ بیان ہوا کہ عارضہ آنے پر دوسرا اذان پوری کر سکتا ہے یا نہیں، اذان و اقامت کے ضوابط کے تحت۔"
  es: "Un consultante preguntó sobre la posibilidad de que alguien complete el adhan cuando algo le sucede al muecín durante la llamada. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22527) respondió que el adhan para las cinco oraciones obligatorias es un acto corporal de adoración, al igual que la oración en este sentido, y la respuesta establece la norma sobre si otra persona puede terminarlo cuando el muecín es interrumpido, bajo las normas del adhan y el iqama."
  fr: "Un internaute a demandé si une personne pouvait terminer l'adhan lorsque le muezzin est interrompu en plein appel. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22527) a répondu que l'adhan des cinq prières obligatoires est un acte d'adoration corporel, au même titre que la prière, et expose la règle à suivre si une autre personne le termine lorsque le muezzin est interrompu, conformément aux règles de l'adhan et de l'iqama."
  tr: "Bir soru soran, müezzinin bir kaza sonucu vurulması durumunda ezan yapımına ilişkin kararı sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 22527), beş namazın ezarının şeriatta fiziksel bir ibadet olduğunu ve bu konuda namaza benzer olduğunu yanıtladı. Cevap, ezarın ve ikama kurallarına göre orada bulunan kişinin ezan tamamlanmasına ilişkin hükmü netleştirdi."
  id: "Seorang penanya menanyakan tentang putusan pembangunan panggilan salat jika muezin tertabrak kecelakaan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 22527) menjawab bahwa panggilan salat untuk lima shalat yang ditetapkan adalah tindakan fisik ibadah dalam Syariah, mirip dengan shalat dalam hal ini. Jawaban tersebut memperjelas keputusan tentang menyelesaikan panggilan salat untuk orang yang hadir sesuai dengan aturan panggilan salat dan iqama."
