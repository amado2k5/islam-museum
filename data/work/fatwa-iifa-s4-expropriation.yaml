label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن انتزاع الملكية للمصلحة العامة", en: "IIFA resolution on expropriating property for public benefit", ur: "اکیڈمی کی قرارداد: عوامی مفاد کے لیے ملکیت چھیننا", es: "Resolución de la IIFA sobre la expropiación de bienes para beneficio público.", fr: "Résolution de l'IIFA sur l'expropriation de biens pour cause d'utilité publique" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: تجب رعاية الملكية الفردية وصيانتها من الاعتداء ولا يجوز تضييق نطاقها والمالك مسلط على ملكه في حدود المشروع، ولا يجوز نزع ملكية العقار للمصلحة العامة إلا بمراعاة الضوابط والشروط التي فصّلها القرار."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on expropriation for public benefit: individual property must be protected from encroachment and its scope not narrowed — the owner controls his property within lawful bounds — and real estate may not be seized for public benefit except under the controls and conditions the resolution specifies."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: ذاتی ملکیت کی حفاظت لازم؛ عوامی مفاد پر جائیداد صرف مقررہ ضوابط و شرائط کے ساتھ چھینی جا سکتی ہے۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre la expropiación para beneficio público: la propiedad individual debe protegerse de la usurpación y su alcance no debe restringirse —el propietario controla su propiedad dentro de los límites legales— y los bienes inmuebles no pueden ser confiscados para beneficio público excepto bajo los controles y condiciones que especifica la resolución."
  fr: "Résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur l'expropriation pour cause d'utilité publique: la propriété individuelle doit être protégée contre toute empiètement et son étendue ne doit pas être réduite — le propriétaire contrôle sa propriété dans les limites légales — et les biens immobiliers ne peuvent être saisis pour cause d'utilité publique que dans les conditions et sous les contrôles spécifiés par la résolution."
