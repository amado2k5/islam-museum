summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: تجب رعاية الملكية الفردية وصيانتها من الاعتداء ولا يجوز تضييق نطاقها والمالك مسلط على ملكه في حدود المشروع، ولا يجوز نزع ملكية العقار للمصلحة العامة إلا بمراعاة الضوابط والشروط التي فصّلها القرار."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on expropriation for public benefit: individual property must be protected from encroachment and its scope not narrowed — the owner controls his property within lawful bounds — and real estate may not be seized for public benefit except under the controls and conditions the resolution specifies."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: ذاتی ملکیت کی حفاظت لازم؛ عوامی مفاد پر جائیداد صرف مقررہ ضوابط و شرائط کے ساتھ چھینی جا سکتی ہے۔"
