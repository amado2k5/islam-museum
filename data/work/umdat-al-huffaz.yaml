summary:
  ar: "عمدة الحفاظ للسمين الحلبي، وتعدّه موسوعة الإسلام التركية أوسع ما كُتب في غريب القرآن. يذكر فيه المؤلف حروف الجذر أولاً ثم معاني اللفظ في اللغة والتفسير، ويشير إلى اختلاف القراءات باختصار، ويتعرض أحياناً لمسائل الفقه والكلام. حقّقه محمد التونجي في أربعة مجلدات ببيروت سنة ١٤١٤هـ/١٩٩٣م."
  en: "al-Samin al-Halabi's Umdat al-Huffaz, which the TDV İslâm Ansiklopedisi counts as the widest work written on gharib al-Qur'an. It gives a word's root letters first and then its lexical and exegetical senses, notes variant readings briefly and sometimes touches on points of law and theology. Muhammad Altunji edited it in four volumes (Beirut 1414/1993)."
  es: "El Umdat al-Huffaz de al-Samin al-Halabi, que la TDV İslâm Ansiklopedisi considera la obra más amplia escrita sobre el gharib del Corán. Da primero las letras de la raíz de la palabra y luego sus sentidos léxicos y exegéticos, señala brevemente las variantes de lectura y a veces toca cuestiones de derecho y teología. Muhammad Altunji la editó en cuatro volúmenes (Beirut 1414/1993)."
  fr: "L'Umdat al-Huffaz d'al-Samin al-Halabi, que la TDV İslâm Ansiklopedisi tient pour l'ouvrage le plus étendu sur le gharib du Coran. Il donne d'abord les lettres de la racine d'un mot puis ses sens lexicaux et exégétiques, note brièvement les variantes de lecture et touche parfois à des questions de droit et de théologie. Muhammad Altunji l'a édité en quatre volumes (Beyrouth 1414/1993)."
  ur: "السمین الحلبی کی عمدۃ الحفاظ، جسے TDV İslâm Ansiklopedisi غریب القرآن پر لکھی گئی سب سے وسیع کتاب شمار کرتی ہے۔ اس میں پہلے لفظ کے مادے کے حروف دیے جاتے ہیں پھر اس کے لغوی اور تفسیری معانی، قراءات کے اختلاف کی طرف مختصر اشارہ ہے اور کہیں کہیں فقہ و کلام کے مسائل بھی آتے ہیں۔ محمد التونجی نے اسے چار جلدوں میں بیروت 1414ھ/1993ء میں شائع کیا۔"
  tr: "Al-Samin al-Halabi'nin 'Umdat al-Huffaz'ı ve Türk İslam Ansiklopedisi, nadir Kur'an üzerine yazılmış en kapsamlı eser olarak kabul eder. Yazar önce kök harfleri, ardından dil ve tefsirdeki kelimelerin anlamlarını belirtir, okuma farklılıklarını kısaca belirtir ve bazen fıkıh ve teoloji konularını ele alır. Muhammed el-Tunji tarafından 1414 Hicri / 1993 yılında Beyrut'ta dört cilt halinde düzenlenmiştir."
  id: "'Umdat al-Huffaz' oleh Al-Samin al-Halabi, dan Ensiklopedia Islam Turki menganggapnya sebagai karya paling komprehensif yang ditulis tentang Al-Qur'an yang langka. Dalam karya ini, penulis pertama-tama menyebutkan akar huruf, kemudian makna kata-kata dalam bahasa dan tafsir, secara singkat menunjukkan perbedaan dalam pembacaan, dan kadang-kadang membahas isu yurisprudensi dan teologi. Karya ini diedit oleh Muhammad al-Tunji dalam empat jilid di Beirut pada tahun 1414 H / 1993 M."
