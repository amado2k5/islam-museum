  ar: "دراسة بالإنجليزية لروبرت هويلاند تجمع ما كتبه المسيحيون واليهود والزرادشتيون عن الإسلام المبكر وتقوّمه، صدرت عن دار داروين في برينستون سنة 1997 في 872 صفحة."
