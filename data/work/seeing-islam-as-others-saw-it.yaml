  id: "Sebuah studi dalam bahasa Inggris oleh Robert Hoyland yang mengumpulkan dan mendukung apa yang ditulis oleh orang Kristen, Yahudi, dan Zoroaster tentang Islam awal, diterbitkan oleh Darwin Publishing di Princeton pada tahun 1997 dalam 872 halaman."
