label: { ar: "فقه اللغة وسر العربية", en: "Fiqh al-Lugha wa-Sirr al-Arabiyya", es: "Fiqh al-Lugha wa-Sirr al-Arabiyya", fr: "Fiqh al-Lugha wa-Sirr al-Arabiyya", ur: "فقہ اللغہ و سر العربیہ" }
summary:
  ar: "فقه اللغة وسر العربية للثعالبي، وكان اسمه الأول «شمس الأدب» وله قسمان: الأول في المترادفات والثاني في الأسلوب ومجاري كلام العرب، وقد نُقل القسم الثاني من كتاب ابن فارس «الصاحبي في فقه اللغة». ثم أفرد الثعالبي القسم الأول في كتاب مستقل سماه «فقه اللغة». وقد شجّعه على تأليفه أبو الفضل عبيد الله بن أحمد الميكالي."
  en: "al-Tha'alibi's Fiqh al-lugha wa-sirr al-arabiyya, first called Shams al-adab, which had two parts: the first on synonyms and the second on style and the ways of Arab speech. The second part was taken from Ibn Faris's al-Sahibi fi fiqh al-lugha, after which al-Tha'alibi made the first part an independent book under the title Fiqh al-lugha. Abu l-Fadl Ubaydallah ibn Ahmad al-Mikali encouraged him to write it."
  es: "El Fiqh al-lugha wa-sirr al-arabiyya de al-Tha'alibi, llamado primero Shams al-adab, que tenía dos partes: la primera sobre sinónimos y la segunda sobre el estilo y los modos del habla de los árabes. La segunda parte se tomó del al-Sahibi fi fiqh al-lugha de Ibn Faris, tras lo cual al-Tha'alibi hizo de la primera un libro independiente con el título Fiqh al-lugha. Abu l-Fadl Ubaydallah ibn Ahmad al-Mikali le animó a escribirlo."
  fr: "Le Fiqh al-lugha wa-sirr al-arabiyya d'al-Tha'alibi, d'abord appelé Shams al-adab, qui comportait deux parties : la première sur les synonymes, la seconde sur le style et les manières de parler des Arabes. La seconde partie fut reprise de l'al-Sahibi fi fiqh al-lugha d'Ibn Faris, après quoi al-Tha'alibi fit de la première un livre indépendant intitulé Fiqh al-lugha. Abu l-Fadl Ubaydallah ibn Ahmad al-Mikali l'encouragea à l'écrire."
  ur: "ثعالبی کی فقہ اللغہ و سر العربیہ، جس کا پہلا نام شمس الادب تھا اور جس کے دو حصے تھے: پہلا مترادفات پر اور دوسرا اسلوب اور کلامِ عرب کے طریقوں پر۔ دوسرا حصہ ابن فارس کی الصاحبی فی فقہ اللغہ سے لیا گیا تھا، پھر ثعالبی نے پہلے حصے کو فقہ اللغہ کے نام سے الگ کتاب بنایا۔ ابو الفضل عبیداللہ بن احمد المیکالی نے انہیں اس کی تالیف پر ابھارا۔"
