label: { ar: "كتاب الواحدة في مناقب العرب ومثالبها", en: "Kitab al-Wahida", es: "Kitab al-Wahida", fr: "Kitab al-Wahida", ur: "کتاب الوحدہ", tr: "Arapların Erdemleri ve Kusurlarında Birlik Kitabı", id: "Kitab Persatuan dalam Kebajikan dan Kekurangan Orang Arab" }
summary:
  ar: "كتاب في مناقب العرب ومثالبها مفردة لا يشاركها فيها غيرها، أثار تصنيفه الكلام الذي جرى في مجلس هشام بن عبد الملك بين الأبرش الكلبي والعباس بن الوليد وخالد بن مسلمة المخزومي والنضر بن مريم الحميري في مناقب قحطان ونزار ومثالبهما، وقيل ألفه أبو عبيدة معمر بن المثنى على ألسنتهم أو غيره من الشعوبية {cite:muruj-al-dhahab p. 199}."
  en: "The book of Arab merits and flaws item by item — sparked by the Kalbi, Makhzumi and Himyari rivals' exchanges in Hisham's majlis; Abu 'Ubayda's authorship on their tongues, or another Shu'ubi's {cite:muruj-al-dhahab p. 199}."
  es: "El libro de méritos y defectos árabes punto por punto, provocado por los intercambios de los rivales Kalbi, Makhzumi e Himyari en el majlis de Hisham; la autoría de Abu 'Ubayda en sus lenguas, o la de otro Shu'ubi {cite:muruj-al-dhahab p. 199}."
  fr: "Le livre des mérites et des défauts arabes point par point — déclenché par les échanges des rivaux Kalbi, Makhzumi et Himyari dans le majlis de Hisham; l'attribution à Abu 'Ubayda de leurs langues, ou d'un autre Shu'ubi {cite:muruj-al-dhahab p. 199}."
  ur: "عرب کی خوبیوں اور خامیوں کی کتاب آئٹم کے حساب سے — ہشام کی مجلس میں کلبی، مخزومی اور حمیری حریفوں کے تبادلوں سے پھیلی؛ ان کی زبانوں پر ابو عبیدہ کی تصنیف، یا شعبی کی ایک اور تصنیف: مروج الذہب ص۔ 199}۔"
  tr: "Arapların erdemleri ve kusurları üzerine, başkaları tarafından da paylaşılan ve benzersiz bir kitap. Onun derlemesi, Hişam ibn Abdülmelik'in toplantısında el-Abreş el-Kalbi, el-Abbas bin Welid, Halid bin Mesleme el-Mekhzumi ve el-Nedr bin Meryem el-Himyari arasında Kahtan, Nizar ve benzerlerinin erdemleri üzerine gerçekleşen tartışmayı tetiklemiştir. Ebu Ubeyde Muammer ibn el-Müthanna tarafından onların dilleri veya diğer Şuubiler üzerine yazıldığı söylenir {atıf:Muruj-al-Dhahab, s. 199}."
  id: "Sebuah buku tentang kelebihan dan kekurangan orang Arab, unik dan dibagikan oleh orang lain. Kompilasinya memicu wacana yang terjadi dalam pertemuan Hisham ibn Abd al-Malik antara al-Abrash al-Kalbi, al-Abbas ibn al-Walid, Khalid ibn Maslamah al-Makhzumi, dan al-Nadr ibn Maryam al-Himyari tentang kebajikan Qahtan dan Nizar serta sejenisnya. Konon buku ini ditulis oleh Abu Ubaidah Muammar ibn al-Muthanna dalam bahasa mereka atau Shu'ubi lain {cite:muruj-al-dhahab, hlm. 199}."
