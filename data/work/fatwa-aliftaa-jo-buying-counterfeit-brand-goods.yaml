id: work/fatwa-aliftaa-jo-buying-counterfeit-brand-goods
class: work
kind: fatwa
label: { ar: "شراء البضائع المقلدة للعلامات التجارية العالمية", en: "Buying counterfeit brand goods", ur: "عالمی برانڈز کی نقلی اشیا خریدنا" }
summary:
  ar: "سؤال عن شراء البضائع المقلدة للعلامات التجارية العالمية، أجابت فيه دائرة الإفتاء العام الأردنية بأن البضاعة التي تحمل علامة تجارية مسروقة يحرم التعامل بها، وأن ما يحمل علامة مشابهة يجوز شراؤه للاستعمال الشخصي دون كذب أو تدليس ولا يجوز للتجارة، وأن تقليد التصميم وحده تنظمه قوانين الملكية الفكرية. أجابت الدائرة بأن الإسلام أمر بالصدق في التعامل وعدم الغش والتزوير، واستشهدت بحديث رواه ابن ماجه والترمذي معناه أن التاجر الأمين الصدوق مع الشهداء يوم القيامة، وقالت إن الأصل أن يكون لكل أحد ابتكاره في مجال عمله وأن يبتعد عن التقليد ما أمكن. وفرقت بين أنواع التقليد: فالبضاعة التي تحمل علامة تجارية مسروقة محرمة لما فيها من كذب وتزوير للواقع وتعد على حقوق العلامات التجارية، وهي حقوق مالية متقومة تجب صيانتها. وأما البضاعة التي تحمل علامة تشبه الأصلية قد ينخدع بها الناس، فحكمها بحسب الغاية: فيجوز شراؤها للاستعمال الفردي بشرط ألا يكذب البائع أو يدلس، ولا يجوز شراؤها للتجارة وبيعها للمستهلك لأن كثيرًا من الناس ينخدعون فيظنونها أصلية. وأما التقليد في التصميم وحده دون علامة تجارية فتنظمه قوانين حقوق الملكية الفكرية، ونقلت قرار مجمع الفقه الإسلامي رقم 43 (5/5) بأن الاسم التجاري والعلامة التجارية والتأليف والاختراع حقوق خاصة لأصحابها لها قيمة مالية معتبرة ولا يجوز الاعتداء عليها، ونصحت المواطنين بتمييز الأصلي من المقلد وذكرت التجار بتقوى الله."
  en: "A question about buying counterfeit brand goods, in which Jordan's General Iftaa Department answered that goods bearing a stolen trademark may not be dealt in; goods bearing a look-alike mark may be bought for personal use if the seller does not lie or deceive, but not for resale; and copying a design alone is governed by intellectual-property law. The Department answered that Islam commands honesty in dealings and forbids cheating and forgery, citing a hadith narrated by Ibn Majah and al-Tirmidhi whose meaning is that the honest, truthful merchant will be with the martyrs on the Day of Resurrection; in principle everyone should have his own innovation in his field and avoid imitation as far as possible. It distinguished between kinds of imitation. Goods bearing a stolen trademark are forbidden, since they involve lying and misrepresenting reality and infringe trademark rights, which are valued financial rights that must be protected. Goods bearing a mark that resembles the original and may deceive people are judged by the purpose of purchase: buying them for personal use is permitted provided the seller does not lie or deceive to promote them, but buying them to trade and sell to consumers is not permitted, because many people are taken in and believe them to be genuine. Imitating only the design, without any trademark, is governed by the laws on intellectual-property rights. It quoted Islamic Fiqh Academy resolution 43 (5/5) that trade names, trademarks, authorship and invention are private rights of their owners with recognised financial value that may not be infringed, advised the public to tell genuine from counterfeit goods, and reminded traders to fear God in their dealings."
  ur: "عالمی برانڈز کی نقلی اشیا خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ چوری شدہ ٹریڈ مارک والی اشیا کا لین دین حرام ہے؛ ملتے جلتے نشان والی اشیا ذاتی استعمال کے لیے خریدی جا سکتی ہیں اگر بیچنے والا جھوٹ یا دھوکہ نہ دے، مگر دوبارہ بیچنے کے لیے نہیں؛ اور صرف ڈیزائن کی نقل دانشورانہ املاک کے قوانین کے تحت ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلام نے معاملات میں سچائی کا حکم دیا اور دھوکے اور جعل سازی سے منع کیا، اور ابن ماجہ اور ترمذی کی روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ امانت دار سچا تاجر قیامت کے دن شہدا کے ساتھ ہوگا؛ اصل یہ ہے کہ ہر ایک اپنے میدان میں اپنی ایجاد رکھے اور جہاں تک ممکن ہو نقل سے بچے۔ اس نے نقل کی اقسام میں فرق کیا۔ چوری شدہ ٹریڈ مارک والی اشیا حرام ہیں، کیونکہ ان میں جھوٹ اور حقیقت کی غلط بیانی ہے اور یہ ٹریڈ مارک کے حقوق پر زیادتی ہے، جو قابلِ قدر مالی حقوق ہیں جن کی حفاظت واجب ہے۔ جن اشیا پر اصل سے ملتا جلتا نشان ہو جس سے لوگ دھوکہ کھا سکیں، ان کا حکم خریداری کے مقصد پر ہے: ذاتی استعمال کے لیے خریدنا جائز ہے بشرطیکہ بیچنے والا انہیں بیچنے کے لیے جھوٹ یا دھوکہ نہ دے، لیکن تجارت اور صارفین کو بیچنے کے لیے خریدنا جائز نہیں، کیونکہ بہت سے لوگ دھوکہ کھا کر انہیں اصلی سمجھتے ہیں۔ صرف ڈیزائن کی نقل، بغیر ٹریڈ مارک کے، دانشورانہ املاک کے حقوق کے قوانین کے تحت ہے۔ اس نے اسلامی فقہ اکیڈمی کی قرارداد 43 (5/5) نقل کی کہ تجارتی نام، ٹریڈ مارک، تصنیف اور ایجاد ان کے مالکوں کے خاص حقوق ہیں جن کی معتبر مالی قیمت ہے اور ان پر زیادتی جائز نہیں، عوام کو اصلی اور نقلی میں تمیز کرنے کی نصیحت کی، اور تاجروں کو معاملات میں اللہ سے ڈرنے کی یاد دہانی کرائی۔"
