summary:
  ar: "موسوعة أبي القاسم الزهراوي في الطب والعمارة الجراحية، فرغ منها نحو سنة 400هـ/1013م؛ يضم كتابها الثالث الجراحةَ المشفوعة بالرسوم، وهو أوسع ما وصلنا من كتب الجراحة العربية الإسلامية قبلها، وترجم إلى اللاتينية وغيرها."
  en: "Abu al-Qasim al-Zahrawi's encyclopaedia of medicine and surgery, completed around 400 AH/1013 CE; its illustrated surgical book is the broadest surviving Arabic-Islamic surgical text before it, and it was translated into Latin and other languages."
  ur: "ابو القاسم الزہراوی کی طب اور جراحی کی دائرۃ المعارف، جو تقریباً 400ھ/1013ء میں مکمل ہوئی؛ اس کی مصور جراحی کتاب اس سے پہلے کی نمایاں ترین عربی اسلامی جراحی کتاب ہے، اور یہ لاطینی وغیرہ میں ترجمہ ہوئی۔"
