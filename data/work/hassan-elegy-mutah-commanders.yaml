id: work/hassan-elegy-mutah-commanders
class: work
kind: poem
label: { ar: "مراثي حسان بن ثابت في شهداء مؤتة", en: "Hassan ibn Thabit's elegies for the Mu'tah martyrs", es: "Elegías de Hassan ibn Thabit para los mártires de Mu'tah", fr: "Élégies de Hassan ibn Thabit pour les martyrs de Mu'tah", ur: "حسن بن ثابت کا متعہ شہداء کے لیے عزاداری" }
summary:
  ar: "ثلاث مقطوعات شعرية لحسان بن ثابت يبكي فيها قادة جيش مؤتة: الأولى في الثلاثة مجتمعين، والثانية خاصة في جعفر بن أبي طالب، والثالثة في زيد وعبد الله بن رواحة. نقلها ابن إسحاق في سياق غزوة مؤتة."
  en: "Three elegies by Hassan ibn Thabit mourning the Mu'tah commanders: the first for all three together, the second for Ja'far ibn Abi Talib, and the third for Zayd and Ibn Rawaha. Transmitted by Ibn Ishaq within his Mu'tah account."
  es: "Tres elegías de Hassan ibn Thabit lamentando la muerte de los comandantes de Mu'tah: la primera dedicada a los tres juntos, la segunda a Ja'far ibn Abi Talib y la tercera a Zayd e Ibn Rawaha. Transmitidas por Ibn Ishaq en su relato de Mu'tah."
  fr: "Trois élégies de Hassan ibn Thabit déplorant la mort des commandants Mu'tah: la première pour les trois réunis, la deuxième pour Ja'far ibn Abi Talib et la troisième pour Zayd et Ibn Rawaha. Transmises par Ibn Ishaq dans son récit sur les Mu'tah."
  ur: "حسن بن ثابت کی طرف سے متعہ کے کمانڈروں کا ماتم کرتے ہوئے: پہلی تینوں کے لیے، دوسری جعفر ابن ابی طالب کے لیے، اور تیسری زید اور ابن رواحہ کے لیے۔ ابن اسحاق نے اپنے متعہ اکاؤنٹ میں نقل کیا ہے۔"
