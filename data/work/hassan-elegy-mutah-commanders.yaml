  en: "Three elegies by Hassan ibn Thabit mourning the Mu'tah commanders: the first for all three together, the second for Ja'far ibn Abi Talib, and the third for Zayd and Ibn Rawaha. Transmitted by Ibn Ishaq within his Mu'tah account."
