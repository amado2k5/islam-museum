summary:
  ar: "شرح لمشكاة المصابيح لعبيد الله محمد عبد السلام المباركفوري، يتناول كل حديث بسنده ومتنه وبيان لغته ومعانيه وفقهه. المجلد العاشر من طبعة دار القبس ⁦(1438هـ)⁩ يضم تتمة كتاب الدعوات وكتاب المناسك."
  en: "A commentary on the Mishkat al-Masabih by Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri. It treats each hadith's isnad and matn, its language, meanings and jurisprudence. Volume 10 of the Dar al-Qabas edition (1438 AH) covers the end of the Book of Supplications and the Book of Rites."
  es: "Comentario sobre el Mishkat al-Masabih de Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri. Analiza la cadena de transmisión (isnad) y la cadena de transmisión (matn) de cada hadiz, su idioma, significado y jurisprudencia. El volumen 10 de la edición de Dar al-Qabas (1438 AH) abarca el final del Libro de las Súplicas y el Libro de los Ritos."
