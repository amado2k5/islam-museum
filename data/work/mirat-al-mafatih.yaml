label: { ar: "مرعاة المفاتيح شرح مشكاة المصابيح", en: "Mir'at al-Mafatih, a commentary on the Mishkat al-Masabih", es: "Mir'at al-Mafatih, un comentario sobre el Mishkat al-Masabih", fr: "Mir'at al-Mafatih, un commentaire sur le Mishkat al-Masabih", ur: "مراۃ المفاتیح، مشکوٰۃ المصابیح کی تفسیر", tr: "Anahtarların Bekçisi, Mişkat el-Masabih'in açıklaması", id: "Penjaga kunci, penjelasan tentang Mishkat al-Masabih" }
summary:
  ar: "شرح لمشكاة المصابيح لعبيد الله محمد عبد السلام المباركفوري، يتناول كل حديث بسنده ومتنه وبيان لغته ومعانيه وفقهه. المجلد العاشر من طبعة دار القبس ⁦(1438هـ)⁩ يضم تتمة كتاب الدعوات وكتاب المناسك."
  en: "A commentary on the Mishkat al-Masabih by Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri. It treats each hadith's isnad and matn, its language, meanings and jurisprudence. Volume 10 of the Dar al-Qabas edition (1438 AH) covers the end of the Book of Supplications and the Book of Rites."
  es: "Comentario sobre el Mishkat al-Masabih de Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri. Analiza la cadena de transmisión (isnad) y la cadena de transmisión (matn) de cada hadiz, su idioma, significado y jurisprudencia. El volumen 10 de la edición de Dar al-Qabas (1438 AH) abarca el final del Libro de las Súplicas y el Libro de los Ritos."
  fr: "Ce commentaire du Mishkat al-Masabih par Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri traite de l'isnad et du matn de chaque hadith, de sa langue, de sa signification et de sa jurisprudence. Le volume 10 de l'édition Dar al-Qabas (1438 AH) couvre la fin du Livre des Invocations et le Livre des Rites."
  ur: "مشکوٰۃ المصابیح کی تفسیر عبید اللہ محمد عبد السلام المبارکفوری کی ہے۔ یہ ہر حدیث کے اسناد اور متن، اس کی زبان، معانی اور فقہ کا علاج کرتا ہے۔ دار القبس ایڈیشن ⁦(1438ھ)⁩ کی جلد 10 کتاب دعاؤں اور مناسک کی کتاب کے اختتام پر محیط ہے۔"
  tr: "Ubeyd Allah Muhammed Abdülselam el-Mübarek tarafından Mişkat-el-Masabih üzerine bir tefsir, her hadisi aktarım zinciri ve metniyle kapsayan, dilini, anlamlarını ve fıkıhını açıklar. Dar al-Kabe baskısının onuncu cildi (1438 H) Namaz Kitabı ve Ritüeller Kitabı'nın devamını içerir."
  id: "Komentar atas Mishkat al-Masabih oleh Ubayd Allah Muhammad Abd al-Salam al-Mubarakfuri, mencakup setiap hadis beserta rantai transmisi dan teksnya, menjelaskan bahasa, makna, dan firisprudensinya. Jilid sepuluh edisi Dar al-Qabas (1438 H) memuat kelanjutan Kitab Permohonan dan Kitab Ritual."
