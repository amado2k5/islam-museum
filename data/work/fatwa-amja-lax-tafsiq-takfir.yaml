label: { ar: "التساهل في التفسيق والتبديع والتكفير", en: "Laxity in declaring sinfulness, heresy and disbelief", ur: "تفسیق تبدید تکفیر میں سستی" }
summary:
  ar: "سأل سائل عن انتشار التساهل في التفسيق والتبديع والتكفير بسبب الاختلاف في مسائل يسوغ فيها الاجتهاد مما فرق المسلمين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81295 بتاريخ 12 أبريل 2010)⁩ أن مسائل الاجتهاد ينبغي أن يتحدث الناس فيها بالبينات وبالحجج العلمية وألا يضيق على المخالف، ولا يجوز أن تكون مسوغًا للتراشق بالتهم والمناكر، ونسأل الله لهم العافية."
  en: "A questioner raised the spread of laxity in declaring others sinful, heretical or disbelievers over differences in questions where ijtihad is legitimate, splitting the Muslims. Dr. Salah al-Sawi (fatwa no. 81295, 12 April 2010) answered that ijtihad questions should be argued with proofs and scholarly evidence, without crowding the dissenter, and may not licence trading accusations and abuse."
  ur: "ایک سائل نے اجتہادی اختلافات پر تفسیق و تکفیر کی سستی کا مسئلہ اٹھایا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81295، 12 اپریل 2010)⁩ کے مطابق اجتہادی مسائل میں علمی دلائل سے بحث ہو اور مخالف پر تنگی نہ ہو؛ الزام تراشی جائز نہیں۔"
