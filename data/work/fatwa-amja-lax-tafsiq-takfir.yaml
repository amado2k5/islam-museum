id: work/fatwa-amja-lax-tafsiq-takfir
class: work
kind: fatwa
label: { ar: "التساهل في التفسيق والتبديع والتكفير", en: "Laxity in declaring sinfulness, heresy and disbelief", ur: "تفسیق تبدید تکفیر میں سستی", es: "Laxitud a la hora de declarar el pecado, la herejía y la incredulidad.", fr: "Laxisme dans la déclaration du péché, de l'hérésie et de l'incrédulité", tr: "Ahlaksızlık, yenilik ve tekfirde hoşgörü", id: "Kelonggaran dalam ketidakmoralan, inovasi, dan takfir" }
summary:
  ar: "سأل سائل عن انتشار التساهل في التفسيق والتبديع والتكفير بسبب الاختلاف في مسائل يسوغ فيها الاجتهاد مما فرق المسلمين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81295 بتاريخ 12 أبريل 2010)⁩ أن مسائل الاجتهاد ينبغي أن يتحدث الناس فيها بالبينات وبالحجج العلمية وألا يضيق على المخالف، ولا يجوز أن تكون مسوغًا للتراشق بالتهم والمناكر، ونسأل الله لهم العافية."
  en: "A questioner raised the spread of laxity in declaring others sinful, heretical or disbelievers over differences in questions where ijtihad is legitimate, splitting the Muslims. Dr. Salah al-Sawi (fatwa no. 81295, 12 April 2010) answered that ijtihad questions should be argued with proofs and scholarly evidence, without crowding the dissenter, and may not licence trading accusations and abuse."
  ur: "ایک سائل نے اجتہادی اختلافات پر تفسیق و تکفیر کی سستی کا مسئلہ اٹھایا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81295، 12 اپریل 2010)⁩ کے مطابق اجتہادی مسائل میں علمی دلائل سے بحث ہو اور مخالف پر تنگی نہ ہو؛ الزام تراشی جائز نہیں۔"
  es: "Un interlocutor planteó la creciente laxitud al declarar pecadores, herejes o incrédulos a otros por diferencias en cuestiones donde el ijtihad es legítimo, lo que divide a los musulmanes. El Dr. Salah al-Sawi (fatwa n.º 81295, 12 de abril de 2010) respondió que las cuestiones de ijtihad deben debatirse con pruebas y evidencia académica, sin presionar al disidente, y que esto no debe dar pie a acusaciones ni insultos."
  fr: "Un interlocuteur a soulevé la question du relâchement croissant consistant à déclarer autrui pécheur, hérétique ou mécréant sur la base de divergences d'opinions concernant des questions où l'ijtihad est légitime, ce qui divise les musulmans. Le Dr Salah al-Sawi (fatwa n° 81295, 12 avril 2010) a répondu que les questions d'ijtihad doivent être débattues avec des preuves et des arguments savants, sans harceler le dissident, et ne sauraient justifier la diffusion d'accusations et d'abus."
  tr: "İctihadın kabul edildiği konulardaki farklılıklar nedeniyle ahlaksızlık, yenilik ve tekfir konusundaki yaygın hoşgörü hakkında bir soru soruldu; bu durum Müslümanları böldü. Dr. Salah Al-Sawy (12 Nisan 2010 tarihli Fetva No. 81295) ictihad konularında insanların bunları kanıt ve bilimsel argümanlarla tartışması, karşı tarafa sert davranmaması ve bunun suçlama ve yanlış davranış alışverişi için bir bahane olmaması gerektiğini yanıtladı. Allah'tan onlara iyilik göstermesini diliyoruz."
  id: "Seorang penanya ditanya tentang kelonggaran luas dalam ketidakmoralan, inovasi, dan takfir akibat perbedaan dalam hal-hal di mana ijtihad diperbolehkan, yang telah memecah belah umat Muslim. Dr. Salah Al-Sawy menjawab (Fatwa No. 81295 tanggal 12 April 2010) bahwa dalam urusan ijtihad, orang harus membahasnya dengan bukti dan argumen ilmiah serta tidak boleh keras terhadap pihak lawan, dan tidak boleh dijadikan alasan untuk saling menuduh dan melakukan kesalahan. Kami memohon kepada Allah agar memberikan kesejahteraan kepada mereka."
