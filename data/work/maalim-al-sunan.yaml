label: { ar: "معالم السنن", en: "Ma'alim al-Sunan", ur: "معالم السنن", es: "Ma'alim al-Sunan", fr: "Ma'alim al-Sunan", tr: "Sünnet'in Simge Yapıları", id: "Landmark Sunnah" }
summary:
  ar: "شرح أبي سليمان حمد بن محمد الخطابي البستي ⁦(319–388هـ)⁩ على سنن أبي داود: يفسر غريب ألفاظ الأحاديث، ويستخرج منها الفقه والأدب، ويحكي مذاهب الصحابة والفقهاء في المسائل، ويجمع بين الأخبار المختلفة ويرجّح، ويسند أحياناً أحاديث من غير طريق أبي داود؛ وهو مطبوع في حواشي طبعة دار ابن حزم للسنن (1997) معلّماً بكلمة «خطابي» {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}."
  en: "The commentary of Abu Sulayman Hamd ibn Muhammad al-Khattabi of Bust (319–388 AH) on the Sunan of Abu Dawud: it explains rare words in the reports, draws law and manners from them, relates the views of the Companions and jurists, reconciles conflicting reports and weighs between them, and at times gives reports with its author's own chains outside Abu Dawud's; it is printed in the footnotes of the Dar Ibn Hazm edition of the Sunan (1997), marked 'Khattabi' {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}."
  ur: "ابو سلیمان حمد بن محمد خطابی بستی ⁦(319–388ھ)⁩ کی سنن ابی داؤد پر شرح: یہ احادیث کے غریب الفاظ کی تشریح کرتی، ان سے فقہ اور آداب نکالتی، صحابہ اور فقہا کے مذاہب بیان کرتی، مختلف روایات میں تطبیق اور ترجیح دیتی، اور کبھی ابو داؤد کے طریق کے علاوہ اپنی سندوں سے روایات لاتی ہے؛ یہ سنن کے دار ابن حزم ایڈیشن (1997) کے حاشیے میں «خطابی» کے نشان کے ساتھ چھپی ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}۔"
  es: "El comentario de Abu Sulayman Hamd ibn Muhammad al-Khattabi de Bust (319–388 AH) sobre el Sunan de Abu Dawud: explica palabras raras en los relatos, extrae leyes y costumbres de ellos, relata las opiniones de los Compañeros y juristas, concilia relatos contradictorios y pondera entre ellos, y en ocasiones proporciona relatos con cadenas de transmisión propias de su autor, distintas a las de Abu Dawud; está impreso en las notas a pie de página de la edición Dar Ibn Hazm del Sunan (1997), marcado como 'Khattabi' {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}."
  fr: "Le commentaire d'Abu Sulayman Hamd ibn Muhammad al-Khattabi de Bust (319-388 AH) sur les Sunan d'Abu Dawud: il explique les termes rares des hadiths, en tire des enseignements juridiques et moraux, relate les avis des Compagnons et des juristes, concilie les hadiths contradictoires et les tranche, et présente parfois des hadiths avec les chaînes de transmission de son auteur, en dehors de celles d'Abu Dawud; il est imprimé dans les notes de bas de page de l'édition Dar Ibn Hazm des Sunan (1997), sous la mention « Khattabi » {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}."
  tr: "Ebu Süleyman Hamad bin Muhammed el-Hattābi el-Busti (319–388 Hâ) hakkında Sünen Ebi Davud'un açıklaması: Nadir bulunan hadisleri yorumlar, onlardan fıkıh ve edebiyat çıkarır, Sahabe ve fıkhih okullarını anlatır, farklı rivayetleri birleştirir ve destekler, bazen hadisleri Ebu Davud'un yolunun dışına zincirler; Dar İbn Hazm Sunan baskısının (1997) kenar boşluklarında \"Khatabi\" (cite:sunan-abi-dawud-ibn-hazm-1997-v1 s. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 s. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 s. 21}"
  id: "Penjelasan Abu Sulayman Hamad ibn Muhammad al-Khattabi al-Busti (319–388 H) tentang Sunan Abi Dawood: Ia menafsirkan kata-kata langka hadit, mengekstrak yurisprudensi dan sastra darinya, menceritakan aliran Para Sahabat dan ahli hukum tentang isu-isu, menggabungkan dan mendukung berbagai laporan, dan kadang-kadang mengikat hadits di luar jalur Abu Dawood; dicetak di pinggir edisi Dar Ibn Hazm Sunan (1997), ditandai dengan kata \"Khatabi\" {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hlm. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hlm. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hlm. 21}"
