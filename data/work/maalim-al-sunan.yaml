label: { ar: "معالم السنن", en: "Ma'alim al-Sunan", ur: "معالم السنن" }
summary:
  ar: "شرح أبي سليمان حمد بن محمد الخطابي البستي ⁦(319–388هـ)⁩ على سنن أبي داود: يفسر غريب ألفاظ الأحاديث، ويستخرج منها الفقه والأدب، ويحكي مذاهب الصحابة والفقهاء في المسائل، ويجمع بين الأخبار المختلفة ويرجّح، ويسند أحياناً أحاديث من غير طريق أبي داود؛ وهو مطبوع في حواشي طبعة دار ابن حزم للسنن (1997) معلّماً بكلمة «خطابي» {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}."
  en: "The commentary of Abu Sulayman Hamd ibn Muhammad al-Khattabi of Bust (319–388 AH) on the Sunan of Abu Dawud: it explains rare words in the reports, draws law and manners from them, relates the views of the Companions and jurists, reconciles conflicting reports and weighs between them, and at times gives reports with its author's own chains outside Abu Dawud's; it is printed in the footnotes of the Dar Ibn Hazm edition of the Sunan (1997), marked 'Khattabi' {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}."
  ur: "ابو سلیمان حمد بن محمد خطابی بستی (319–388ھ) کی سنن ابی داؤد پر شرح: یہ احادیث کے غریب الفاظ کی تشریح کرتی، ان سے فقہ اور آداب نکالتی، صحابہ اور فقہا کے مذاہب بیان کرتی، مختلف روایات میں تطبیق اور ترجیح دیتی، اور کبھی ابو داؤد کے طریق کے علاوہ اپنی سندوں سے روایات لاتی ہے؛ یہ سنن کے دار ابن حزم ایڈیشن (1997) کے حاشیے میں «خطابی» کے نشان کے ساتھ چھپی ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 1} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 21}۔"
