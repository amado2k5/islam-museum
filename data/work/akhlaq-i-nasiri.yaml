summary:
  ar: "كتاب فارسي للعلامة المحقق نصير الدين الطوسي؛ ألّفه بقهستان لأميرها ناصر الدين عبد الرحيم المحتشم لمّا التمس منه ترجمة كتاب الطهارة في الحكمة العملية لعلي بن مسكويه فضم إليه قسمَي المدني والمنزلي {cite:kashf-zunun-furqan p. 268}."
  en: "Al-Tusi's Persian Akhlaq-i Nasiri — composed in Quhistan for its amir, who had asked for a translation of Miskawayh's Tahara; al-Tusi added the civic and household-economy sections {cite:kashf-zunun-furqan p. 268}."
  es: "El Akhlaq-i Nasiri persa de Al-Tusi — compuesto en Quhistan para su emir, quien había solicitado una traducción del Tahara de Miskawayh; Al-Tusi agregó las secciones cívicas y de economía doméstica {cite:kashf-zunun-furqan p. 268}."
  fr: "L'Akhlaq-i Nasiri persan d'Al-Tusi — composé à Quhistan pour son amir, qui avait demandé une traduction du Tahara de Miskawayh; al-Tusi a ajouté les sections sur l'économie civique et domestique {cite:kashf-zunun-furqan p. 268}."
  ur: "الطوسی کی فارسی اخلاق ناصری - کوہستان میں اس کے امیر کے لیے لکھی گئی، جس نے مسکاوی کے طہرہ کا ترجمہ طلب کیا تھا۔ الطوسی نے شہری اور گھریلو معیشت کے حصے شامل کیے {حوالہ: کشف-زنون-فرقان ص. 268}۔"
