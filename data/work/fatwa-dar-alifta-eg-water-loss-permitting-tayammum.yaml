label: { ar: "ضابط فقد الماء المبيح للتيمم في ظل الأبنية الحديثة", en: "The criterion of lacking water permitting tayammum in modern housing", ur: "جدید عمارتوں میں پانی نہ ہونے پر تیمم کا ضابط", es: "El criterio de falta de agua permite tayammum en viviendas modernas" }
summary:
  ar: "سائل انقطعت عنه المياه ولا يستوعب الماء المخزن لديه إلا حاجته الأصلية فسأل عن التيمم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21657)⁩ أنه حينئذ في حكم فاقد الماء وبيّن الجواب ما يترتب على ذلك على وجهه."
  en: "A man whose water was cut off, whose stored water suffices only for essential need, asked about tayammum. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21657) answered that he then counts as one lacking water, and the answer sets out what follows."
  ur: "ایک شخص کی پانی بند ہو گئی اور اس کے ذخیرہ شدہ پانی صرف بنیادی ضرورت کے لیے کافی ہے؛ اس نے تیمم کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21657)⁩ نے جواب دیا کہ وہ فاقدِ آب شمار ہوتا ہے اور جواب میں اس کے نتائج بیان ہوئے۔"
  es: "Un hombre al que le cortaron el agua, y cuyas reservas solo le alcanzan para lo esencial, preguntó sobre el tayammum. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21657) respondió que, en ese caso, se le considera una persona que carece de agua, y la respuesta detalla lo que sigue."
