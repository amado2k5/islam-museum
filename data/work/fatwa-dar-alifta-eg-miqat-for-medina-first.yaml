id: work/fatwa-dar-alifta-eg-miqat-for-medina-first
class: work
kind: fatwa
label: { ar: "ميقات الإحرام لمن يسافر إلى المدينة المنورة أولًا", en: "The miqat of one travelling to Medina first", ur: "پہلے مدینہ جانے والے کا میقات", es: "El miqat de quien viaja primero a Medina", fr: "Le miqat de celui qui se rend d'abord à Médine", tr: "Medine'ye ilk seyahat edenler için İhram Miqatı", id: "Miqat Ihram untuk mereka yang pertama kali bepergian ke Madinah" }
summary:
  ar: "سائل متجه من مصر إلى المدينة المنورة مباشرة دون المرور على ميقات بلده رابغ فسأل عن ميقات إحرامه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21904)⁩ ببيان ميقات من يسلك طريق المدينة إلى مكة على ما فصّل الجواب."
  en: "A man travelling from Egypt directly to Medina without passing his country's miqat of Rabigh asked about his ihram miqat. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21904) answered by setting out the miqat of one taking the Medina road to Mecca, as the answer details."
  ur: "ایک شخص مصر سے براہِ راست مدینہ جا رہا تھا اور اپنے ملک کے میقات رابغ سے نہ گزرتا تھا؛ اس نے اپنے احرام کے میقات کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21904)⁩ نے جواب میں مدینہ کی طرف سے مکہ جانے والے کا میقات بیان کیا۔"
  es: "Un hombre que viajaba de Egipto directamente a Medina sin pasar por el miqat de Rabigh, en su país, preguntó sobre su miqat de ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21904) respondió indicando el miqat de quien toma la ruta de Medina a La Meca, tal como se detalla en la respuesta."
  fr: "Un homme voyageant d'Égypte directement à Médine sans passer par le miqat de Rabigh, le point de passage de son pays, a posé une question concernant son miqat d'ihram. Le Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21904) a répondu en précisant le miqat de celui qui emprunte la route de Médine vers La Mecque, comme le détaille la réponse."
  tr: "Mısır'dan doğrudan Medine'ye giden bir soru soran, doğduğu şehir Rabigh'ten geçmeden ihramı için Miqat hakkında sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21904), Medine'den Mekke'ye giden rotayı kullananlar için Mikat'ı açıklayarak ayrıntılı cevabı yanıtladı."
  id: "Seorang penanya yang langsung menuju Madinah tanpa melewati kampung halamannya, Rabigh, menanyakan tentang Miqat untuk Ihram-nya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21904) menjawab jawaban rinci dengan memperjelas Miqat bagi mereka yang mengambil rute dari Madinah ke Mekah."
