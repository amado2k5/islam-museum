id: work/fatwa-dar-alifta-eg-surgery-unconscious-family-consent
class: work
kind: fatwa
label: { ar: "حكم إجراء عملية جراحية للمريض فاقد الوعي بتفويض من أهله", en: "Surgery on an unconscious patient with the family's mandate", ur: "بے ہوش مریض کی جراحی اہل و عیال کی اجازت سے", es: "Cirugía a un paciente inconsciente con autorización de la familia.", fr: "Intervention chirurgicale sur un patient inconscient avec le mandat de sa famille" }
summary:
  ar: "سائل سأل عن إجراء عملية جراحية لمريض فاقد الوعي بناءً على توكيل وموافقة من أهله. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22253)⁩ أنه يجوز للطبيب شرعًا إجراء العملية بناءً على توكيل وموافقة أهل المريض غير الواعي على أن يكون ذلك في مصلحة المريض على ما فصّل الجواب."
  en: "A questioner asked about performing surgery on an unconscious patient on the mandate and consent of his family. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22253) answered that the doctor may perform the operation on the mandate and consent of the unconscious patient's family, provided it is in the patient's interest, as the answer details."
  ur: "ایک سائل نے بے ہوش مریض کی جراحی اس کے اہل و عیال کی وکالت اور رضامندی پر کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22253)⁩ نے جواب دیا کہ ڈاکٹر بے ہوش مریض کے اہل خانہ کی وکالت اور رضامندی پر آپریشن کر سکتا ہے بشرطیکہ یہ مریض کے مفاد میں ہو، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de realizar una cirugía a un paciente inconsciente con el consentimiento y autorización de su familia. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22253) respondió que el médico puede realizar la operación con el consentimiento y autorización de la familia del paciente inconsciente, siempre que sea en beneficio del paciente, como se detalla en la respuesta."
  fr: "Un internaute a demandé si une intervention chirurgicale pouvait être pratiquée sur un patient inconscient avec l'accord de sa famille. La Dar al-Ifta égyptienne (Grand Mufti Dr Nazir Muhammad Ayyad, fatwa n° 22253) a répondu que le médecin pouvait procéder à l'opération avec l'accord de la famille du patient inconscient, à condition que cela soit dans l'intérêt de ce dernier, comme le précise la réponse."
