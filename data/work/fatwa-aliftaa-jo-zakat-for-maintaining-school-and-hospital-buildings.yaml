id: work/fatwa-aliftaa-jo-zakat-for-maintaining-school-and-hospital-buildings
class: work
kind: fatwa
label: { ar: "إنفاق الزكاة على صيانة مباني المدارس والمستشفيات", en: "Zakat for maintaining school and hospital buildings", ur: "اسکولوں اور اسپتالوں کی عمارتوں کی مرمت پر زکوٰۃ خرچ کرنا" }
summary:
  ar: "سؤال عن إنفاق الزكاة على صيانة مباني المدارس والمستشفيات، أجابت فيه دائرة الإفتاء العام الأردنية بأن مصارف الزكاة محصورة في الأصناف الثمانية، وليس بناء المدارس أو صيانتها منها، فلا يجوز دفع الزكاة لذلك، ويمكن جمع الصدقات التطوعية أو توجيه المتبرعين إلى الوقف التعليمي. أجابت الدائرة بأن مصارف الزكاة محددة في الشرع ومحصورة في الأصناف الثمانية المذكورة في [[passage/quran-9-60|سورة التوبة 9:60]]، واستشهدت بحديث رواه أبو داود عن زياد بن الحارث الصدائي معناه أن الله لم يرض في الصدقات بحكم نبي ولا غيره حتى حكم فيها فجزأها ثمانية أجزاء. وقالت إن بناء المدارس أو صيانتها ليس من هذه الأصناف، فلا يجوز دفع الزكاة لذلك، لكن يمكن جمع الصدقات التطوعية لهذه الغاية أو توجيه المتبرعين إلى الوقف التعليمي. وذكرت أن مجلس الإفتاء الأردني أصدر القرار رقم (6/2018) الذي عد التبرع للارتقاء بالعملية التعليمية ووقف الأموال لمبادرة الوقف التعليمي من الأمور المطلوبة شرعًا، مع مراعاة ألا يتعارض التبرع مع تعليمات وزارة التربية والتعليم."
  en: "A question about zakat for maintaining school and hospital buildings, in which Jordan's General Iftaa Department answered that the recipients of zakat are limited to the eight categories, and building or maintaining schools is not among them, so zakat may not be paid for it; voluntary charity may be collected instead, or donors directed to educational endowments. The Department answered that the recipients of zakat are fixed by the Shari'a and limited to the eight categories named in [[passage/quran-9-60|Surat al-Tawba 9:60]], citing a hadith narrated by Abu Dawud from Ziyad ibn al-Harith al-Suda'i whose meaning is that God did not accept the judgement of a prophet or anyone else concerning alms until He Himself ruled on them and divided them into eight parts. It said that building or maintaining schools is not among these categories, so zakat may not be paid for it, but voluntary charity may be collected for this purpose, or donors may be directed to educational endowments. It noted that the Jordanian Iftaa Council issued resolution 6/2018, which counts donating to improve education and endowing funds for the educational endowment initiative among the things the Shari'a calls for, provided the donation does not conflict with the instructions of the Ministry of Education."
  ur: "اسکولوں اور اسپتالوں کی عمارتوں کی مرمت پر زکوٰۃ خرچ کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ زکوٰۃ کے مصارف آٹھ اقسام میں محدود ہیں اور اسکول بنانا یا ان کی مرمت ان میں شامل نہیں، اس لیے اس کے لیے زکوٰۃ دینا جائز نہیں؛ اس کے بجائے نفلی صدقات جمع کیے جا سکتے ہیں یا عطیہ دہندگان کو تعلیمی وقف کی طرف متوجہ کیا جا سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکوٰۃ کے مصارف شریعت میں مقرر ہیں اور [[passage/quran-9-60|سورۃ التوبہ 9:60]] میں مذکور آٹھ اقسام میں محدود ہیں، اور ابو داود کی زیاد بن حارث صدائی سے روایت کردہ حدیث کا حوالہ دیا جس کا مفہوم ہے کہ اللہ نے صدقات کے بارے میں کسی نبی یا کسی اور کا فیصلہ قبول نہیں کیا یہاں تک کہ خود ان کا حکم دیا اور انہیں آٹھ حصوں میں تقسیم کیا۔ اس نے کہا کہ اسکول بنانا یا ان کی مرمت ان اقسام میں شامل نہیں، اس لیے اس کے لیے زکوٰۃ دینا جائز نہیں، البتہ اس مقصد کے لیے نفلی صدقات جمع کیے جا سکتے ہیں یا عطیہ دہندگان کو تعلیمی وقف کی طرف متوجہ کیا جا سکتا ہے۔ اس نے ذکر کیا کہ اردن کی افتا کونسل نے قرارداد 6/2018 جاری کی، جس میں تعلیم کی بہتری کے لیے عطیہ اور تعلیمی وقف کے منصوبے کے لیے مال وقف کرنے کو شرعاً مطلوب کاموں میں شمار کیا گیا، بشرطیکہ عطیہ وزارتِ تعلیم کی ہدایات سے متصادم نہ ہو۔"
