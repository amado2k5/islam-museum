summary:
  ar: "«فتح الباري شرح صحيح البخاري» لابن رجب الحنبلي (ت 795هـ): شرح لم يكمل، يبدأ بكتاب الإيمان ويشرح أبواب البخاري واحداً بعد آخر، بذكر معانيها وأقوال العلماء فيها. ويذكر عنوان الجزء الأول أن الشرح بلغ كتاب الجنائز، وهذا الجزء يتتبع كتاب الإيمان وأوائل كتاب الغسل. {cite:fath-al-bari-ibn-rajab-1417 p. 7}"
  en: "Ibn Rajab al-Hanbali's (d. 795 AH) unfinished commentary on Sahih al-Bukhari. It opens with the book of faith and takes Bukhari's chapters one by one, explaining each one's meaning and the views of scholars. The title page says the commentary reached the book of funerals; this volume follows the book of faith and the opening of the book of ghusl. {cite:fath-al-bari-ibn-rajab-1417 p. 7}"
