id: work/fatwa-amja-left-hand-cleansing
class: work
kind: fatwa
label: { ar: "اليد اليسرى للاستنجاء", en: "The left hand for cleansing — why the right is spared", ur: "استنجاء بایاں ہاتھ سے", es: "La mano izquierda para la purificación: ¿por qué se salva la derecha?", fr: "La main gauche pour la purification — pourquoi la droite est épargnée", tr: "Temizlik için sol el (istinja)", id: "Tangan kiri untuk membersihkan (istinja)" }
summary:
  ar: "سأل سائل إذا دخل الغائط هل يغسل الفرج باليد اليسرى أم اليمنى. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80297 بتاريخ 20 أكتوبر 2009)⁩ أن الأصل هو استخدام اليد اليسرى في تنقية المحل من بول أو غائط ونحوه لثبوت النهي عن استخدام اليمنى في هذا المجال، ولعل من الحكمة في ذلك شرف اليمنى وكونها لما يشرف من الأعمال فلا تباشر بها إزالة النجاسة على ما فصّل الجواب."
  en: "A questioner asked whether the private parts are washed with the left or right hand after relieving oneself. Dr. Salah al-Sawi (fatwa no. 80297, 20 October 2009) answered that the rule is using the left hand to cleanse the place of urine, stool and the like, the prohibition on using the right here being established; part of the wisdom is the right's honor — it being for the nobler doings — so it is not put to removing filth, as the answer details."
  ur: "استنجاء کس ہاتھ سے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80297، 20 اکتوبر 2009)⁩ کے مطابق بایاں ہاتھ — دائیں ہاتھ کی تعظیم کی حکمت سے منع ہے۔"
  es: "Un consultante preguntó si las partes íntimas se lavan con la mano izquierda o con la derecha después de orinar o defecar. El Dr. Salah al-Sawi (fatwa n.° 80297, 20 de octubre de 2009) respondió que la norma es usar la mano izquierda para limpiar la zona de orina, heces y similares, ya que está prohibido usar la derecha en este caso; parte de la sabiduría reside en el honor que se le otorga a la derecha —ya que está reservada para actos más nobles—, por lo que no se utiliza para eliminar la suciedad, como se detalla en la respuesta."
  fr: "Une personne a demandé si l'on se lave les parties intimes avec la main gauche ou la main droite après avoir uriné. Le Dr Salah al-Sawi (fatwa n° 80297, 20 octobre 2009) a répondu que la règle est d'utiliser la main gauche pour se nettoyer après avoir uriné, déféqué, etc., l'interdiction d'utiliser la main droite étant établie. Cette règle repose en partie sur l'honneur de la main droite, réservée aux actes les plus nobles; elle ne doit donc pas servir à enlever les impuretés, comme le précise la réponse."
  tr: "Bir soru soran kişi: Dışkı girerse, özel bölgeler sol elle mi yoksa sağ elle mi yıkanmalıdır? Dr. Salah Al-Sawy (20 Ekim 2009 tarihli Fetva No. 80297) yanıtladı; çünkü sağ elin kullanılması yasak olduğundan, idrar, dışkı veya benzeri yerleri arındırmak için sol el kullanılmalıdır. Belki de bunun arkasındaki bilgelik, sağ elin onuru ve onur meselesi olarak statüsüdür, bu yüzden cevabında açıklandığı gibi kirleri gidermek için kullanılmamalıdır."
  id: "Seorang penanya bertanya: Jika kotoran masuk, apakah bagian pribadi harus dicuci dengan tangan kiri atau kanan? Dr. Salah Al-Sawy menjawab (Fatwa No. 80297 tanggal 20 Oktober 2009) bahwa defaultnya adalah menggunakan tangan kiri untuk memurnikan tempat urin, kotoran, atau sejenisnya, karena larangan penggunaan tangan kanan yang sudah ditetapkan dalam hal ini. Mungkin kebijaksanaan di balik ini adalah kehormatan tangan kanan dan statusnya sebagai kehormatan, jadi seharusnya tidak digunakan untuk menghilangkan kotoran, seperti yang dijelaskan dalam jawaban."
