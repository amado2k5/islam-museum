label: { ar: "أمالي ابن الشجري", en: "Amali Ibn al-Shajari", ur: "امالی ابن الشجری" }
summary:
  ar: "أمالي الشريف أبي السعادات هبة الله بن علي ابن الشجري ⁦(450–542هـ)⁩ النحوي البغدادي، في أربعة وثمانين مجلساً، يغلب عليها النحو والصرف مع اللغة والأدب والبلاغة والعروض والتاريخ؛ وتنفرد بين كتب الأمالي بتأريخ المجالس، من المجلس الثامن في جمادى الأولى 524هـ، مع انقطاع للإملاء نحو عشر سنين بين المجلس 31 ⁦(شوال 526هـ)⁩ والمجلس 32 ⁦(ربيع الأول 536هـ)⁩ {cite:amali-ibn-al-shajari-tanahi-khanji-1992 p. 189} {cite:kashf-zunun-furqan p. 597}."
  en: "The dictations of al-Sharif Abu al-Sa'adat Hibat Allah ibn 'Ali Ibn al-Shajari (450–542 AH), grammarian of Baghdad, in eighty-four sessions, mostly on syntax and morphology but also on lexicon, literature, rhetoric, prosody and history. Among works of its kind it is unique in dating its sessions, from session 8 in Jumada al-Ula 524 AH; dictation stopped for about ten years between session 31 (Shawwal 526 AH) and session 32 (Rabi' al-Awwal 536 AH) {cite:amali-ibn-al-shajari-tanahi-khanji-1992 p. 189} {cite:kashf-zunun-furqan p. 597}."
  ur: "شریف ابو السعادات ہبۃ اللہ بن علی ابن الشجری ⁦(450–542ھ)⁩، بغداد کے نحوی، کی امالی، جو چوراسی مجالس میں ہے۔ اس میں زیادہ تر نحو و صرف ہے، ساتھ لغت، ادب، بلاغت، عروض اور تاریخ بھی ہیں۔ امالی کی کتابوں میں یہ مجالس کی تاریخ لکھنے میں منفرد ہے، آٹھویں مجلس ⁦(جمادی الاولیٰ 524ھ)⁩ سے؛ مجلس 31 ⁦(شوال 526ھ)⁩ اور مجلس 32 ⁦(ربیع الاول 536ھ)⁩ کے درمیان املا تقریباً دس سال رکا رہا {cite:amali-ibn-al-shajari-tanahi-khanji-1992 p. 189} {cite:kashf-zunun-furqan p. 597}۔"
