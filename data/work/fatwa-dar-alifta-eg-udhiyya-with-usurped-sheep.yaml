label: { ar: "حكم الأضحية بالشاة المغصوبة", en: "Sacrificing an usurped sheep as udhiyya", ur: "غصب کی ہوئی بھیڑ کی قربانی" }
summary:
  ar: "سائل سأل عن الأضحية بشاة مغصوبة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20826)⁩ أن الأضحية قربة من القربات والله طيب لا يقبل إلا طيبًا ومع ذلك فتجزئ التضحية بالشاة المغصوبة وتكون صحيحة على ما فصّل الجواب من الحكم والإثم."
  en: "A questioner asked about offering an usurped sheep as udhiyya. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20826) answered that the sacrifice is an act of devotion and God accepts only the good; nevertheless the sacrifice with the usurped sheep suffices and is valid — with the ruling and the sin set out in the answer."
  ur: "ایک سائل نے غصب کی ہوئی بھیڑ کی قربانی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20826)⁩ نے جواب دیا کہ قربانی قربت ہے اور اللہ صرف پاک قبول کرتا ہے؛ اس کے باوجود قربانی کافی اور صحیح ہے — حکم اور گناہ جواب میں بیان ہوئے۔"
