id: work/fatwa-dar-alifta-eg-returning-goods-for-price-drop
class: work
kind: fatwa
label: { ar: "حكم الرجوع فيما تم شراؤه للاستفادة بانخفاض سعره", en: "Returning a purchase to benefit from a price drop", ur: "قیمت گھٹنے پر خریدی چیز واپس کرنا", es: "Devolver una compra para beneficiarse de una bajada de precio", fr: "Retourner un achat pour bénéficier d'une baisse de prix" }
summary:
  ar: "سائل سأل عن شراء سلعة من معرض ثم إرجاعها في اليوم التالي حال وجود تخفيض على مثلها في المعرض ثم الشراء لمثلها بالسعر الجديد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21576)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about buying an item from a store, returning it the next day when a like item is discounted, then repurchasing at the new price. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21576) answered by setting out the ruling."
  ur: "ایک سائل نے دکان سے چیز خرید کر اگلے دن چھوٹ ملنے پر واپس کرنے پھر نئی قیمت پر خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21576)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un usuario preguntó sobre la posibilidad de comprar un artículo en una tienda, devolverlo al día siguiente cuando otro similar está rebajado y volver a comprarlo al nuevo precio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21576) respondió exponiendo la normativa."
  fr: "Un internaute a posé une question concernant l'achat d'un article en magasin, son retour le lendemain lorsqu'un article similaire est soldé, puis son rachat au nouveau prix. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21576) a répondu en énonçant la règle."
