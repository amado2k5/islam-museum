id: work/fatwa-amja-who-are-qubaysiyyat
class: work
kind: fatwa
label: { ar: "من هن القبيسيات؟", en: "Who are the Qubaysiyyat", ur: "قبیسیات کون ہیں" }
summary:
  ar: "سأل سائل عن القبيسيات اللاتي ينكرن بإلحاح ما يكتب عنهن في شبكات الإنترنت. أجاب د. حاتم الحاج ⁦(فتوى رقم 21839 بتاريخ 14 مايو 2006)⁩ أن القبيسيات جماعة صوفية باطنية نسائية تنسب إلى منيرة القبيسي وهي امرأة سورية معاصرة، ويمارسن الدعوة إلى التصوف الغالي والكثير من البدع، وهن لا يبحن بحقيقة أمرهن إلا بعد أن تكون المريدة قد أمضت معهن فترة طويلة ويشعرن بولائها الكامل، ولكل جماعة منهن في بلد آنسة أي شيخة والآنسة الكبيرة منيرة القبيسي تقطن بسوريا ومريداتها يغالين في تعظيمها كما هو حال الكثير من الطرق الصوفية."
  en: "A questioner asked who the Qubaysiyyat are, they vehemently denying what is written about them online. Dr. Hatim al-Hajj (fatwa no. 21839, 14 May 2006) answered that the Qubaysiyyat are a female esoteric Sufi order named after Munira al-Qubaysi, a contemporary Syrian woman; they preach an extravagant Sufism and many innovations, and disclose their true business to a novice only after she has spent long with them and they feel her full loyalty; each country's circle has an 'anisa' — a sheikha — the great anisa being Munira herself in Syria, her disciples extravagant in venerating her, as in many Sufi orders. Recorded as AMJA's answer."
  ur: "ایک سائل نے قبیسیات کی نشاندہی پوچھی۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21839، 14 مئی 2006)⁩ کے مطابق یہ سوریہ کی منیرہ قبیسی سے منسوب خواتین کا باطنی صوفی حلقہ ہے — غلو، بدعت اور مریدوں کا خفیہ نظام۔"
