structure: "Known from the extract only: an opening on the trials of graves and images, then chapters of prohibitions drawn from hadith, the argument on intercession and shirk, the legal visit versus the innovated visit, supplication and funeral prayer, the examples of the Companions, and a closing section on omens, divination and the istikhara. The compiler's selection covers pp. 1-21 of the scan; the full work's structure is not in this source."
