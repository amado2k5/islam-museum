summary:
  ar: "كتاب لابن قيم الجوزية في الرد على ما يقع عند القبور من تعظيم وصلاة ودعاء واستغاثة، وعلى ما يتصل بها من بدع وتطير وكهانة؛ ويعرض المؤلف في آخره أمثلة من مصائد الشيطان للناس. وما بين أيدينا منتخب منه جمعه رومي أفندي."
  en: "A treatise by Ibn Qayyim al-Jawziyya against the veneration, prayer, supplication and appeal to the dead that take place at graves, and against the omens, divination and innovations linked to them; the extract here was gathered by Rumi Efendi."
