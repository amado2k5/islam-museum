summary:
  ar: "الكتاب المختصر من كتب السمهودي الثلاثة في تاريخ المدينة، في نحو نصف «وفاء الوفا» مع جمع مقاصده، ويذكر المحقق أنه طُبع مراراً قبل طبعته {cite:samhudi-wafa-al-wafa p.7}."
  en: "The shortest of al-Samhudi's three books on the history of Medina, about half the length of Wafa' al-Wafa' while gathering its aims; its editor says it had been printed several times before."
  es: "Es el más breve de los tres libros de al-Samhudi sobre la historia de Medina, aproximadamente la mitad de extenso que Wafa' al-Wafa', aunque reúne sus objetivos; su editor afirma que ya se había impreso varias veces."
  fr: "Le plus court des trois livres d'al-Samhudi sur l'histoire de Médine, environ la moitié de la longueur de Wafa' al-Wafa' tout en rassemblant ses objectifs; son éditeur dit qu'il avait été imprimé plusieurs fois auparavant."
  ur: "مدینہ کی تاریخ پر السمھودی کی تین کتابوں میں سے سب سے چھوٹی، وفاء الوفاء کی لمبائی کے نصف کے قریب اپنے مقاصد کو جمع کرتے ہوئے؛ اس کے ایڈیٹر کا کہنا ہے کہ یہ پہلے بھی کئی بار چھپ چکا ہے۔"
  tr: "Kısaltılmış kitap, Medine tarihindeki üç Samhudi kitabından biridir ve 'Wafa al-Wafa'nın yaklaşık yarısıdır ve toplanmış amaçlarını oluşturur. Editör, kitabın baskısından önce birkaç kez basıldığını belirtir {cite:samhudi-wafa-al-wafa s.7}."
  id: "Buku ringkas ini adalah salah satu dari tiga buku Samhudi dalam sejarah Madinah, sekitar setengah dari 'Wafa al-Wafa' beserta tujuan kumpulannya. Editor menyebutkan bahwa buku ini dicetak beberapa kali sebelum edisinya {cite:samhudi-wafa-al-wafa hlm.7}."
