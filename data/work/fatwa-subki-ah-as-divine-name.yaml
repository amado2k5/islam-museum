label: { ar: "فتوى في لفظ «أه» اسماً لله", en: "Fatwa on the word «ah» used as a divine name", ur: "«أه» کو اللہ کا نام قرار دینے پر فتویٰ", es: "Fatwa sobre la palabra «ah» usada como nombre divino", fr: "Fatwa concernant le mot «ah» utilisé comme nom divin" }
summary:
  ar: "سؤال عن طائفة من أهل الطرق تردد لفظ «أه» وتعتقده اسماً من أسماء الله وتسميه «اسم الصدر». جواب العلماء: أسماء الله توقيفية، ولفظ «أه» مهمل لا معنى له في العربية إلا التوجع، فلا يصح أن يُسمّى به الله."
  ur: "سوال: ایک صوفی گروہ «أه» کی آواز دہراتا ہے اور اسے اللہ کا نام اور «اسمِ صدر» کہتا ہے۔ جواب: اللہ کے نام وحی سے طے ہیں، اور «أه» عربی میں درد کے اظہار کے سوا کوئی معنی نہیں رکھتا، اس لیے اسے اللہ کا نام نہیں کہا جا سکتا۔"
  en: "A question on a Sufi group that repeats the sound «ah» as a divine name and calls it the name of the chest. The answer: God's names are fixed by revelation, and «ah» is a meaningless sound in Arabic beyond expressing pain, so it cannot be used as a name of God."
  es: "Una pregunta sobre un grupo sufí que repite el sonido «ah» como nombre divino y lo llama el nombre del pecho. La respuesta: Los nombres de Dios son revelados, y «ah» es un sonido sin significado en árabe, que expresa dolor, por lo que no puede usarse como nombre de Dios."
  fr: "Une question portait sur un groupe soufi qui répète le son « ah » comme un nom divin et l'appelle le nom de la poitrine. La réponse: les noms de Dieu sont fixés par révélation, et « ah » est un son dénué de sens en arabe, si ce n'est pour exprimer la douleur; il ne peut donc pas être utilisé comme nom de Dieu."
