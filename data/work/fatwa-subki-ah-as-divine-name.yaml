label: { ar: "فتوى في لفظ «أه» اسماً لله", en: "Fatwa on the word «ah» used as a divine name", ur: "«أه» کو اللہ کا نام قرار دینے پر فتویٰ" }
summary:
  ar: "سؤال عن طائفة من أهل الطرق تردد لفظ «أه» وتعتقده اسماً من أسماء الله وتسميه «اسم الصدر». جواب العلماء: أسماء الله توقيفية، ولفظ «أه» مهمل لا معنى له في العربية إلا التوجع، فلا يصح أن يُسمّى به الله."
  ur: "سوال: ایک صوفی گروہ «أه» کی آواز دہراتا ہے اور اسے اللہ کا نام اور «اسمِ صدر» کہتا ہے۔ جواب: اللہ کے نام وحی سے طے ہیں، اور «أه» عربی میں درد کے اظہار کے سوا کوئی معنی نہیں رکھتا، اس لیے اسے اللہ کا نام نہیں کہا جا سکتا۔"
  en: "A question on a Sufi group that repeats the sound «ah» as a divine name and calls it the name of the chest. The answer: God's names are fixed by revelation, and «ah» is a meaningless sound in Arabic beyond expressing pain, so it cannot be used as a name of God."
