label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 19)⁩ حول الأوضاع في فلسطين والعراق والصومال والسودان ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(19th session)⁩ on the situations in Palestine, Iraq, Somalia and Sudan ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(انیسویں مجلس)⁩: فلسطین، عراق، صومالیہ اور سوڈان کے حالات پر ⁦(بیان، قرارداد نہیں)⁩" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. في شقه الفلسطيني ندد البيان بما وصفه بالعدوان على قطاع غزة وما رافقه من حصار وتشريد وتجويع، ودعا دول العالم الإسلامي والمجتمع الدولي إلى إغاثة الشعب الفلسطيني، وناشد الفصائل الفلسطينية وحدة الصف، وأعرب عن قلقه مما قال إنه مساس بهوية القدس العربية والإسلامية وخطر يتهدد المسجد الأقصى، مؤكدًا مكانة القدس والأقصى لدى المسلمين. وتناول البيان كذلك الأوضاع في العراق والصومال والسودان بمنظور المرجعية الفقهية التي يعلنها المجمع لنفسه."
  en: "A statement issued by the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009), published among the session materials though not a numbered resolution. On Palestine, the statement condemned what it described as the assault on the Gaza Strip and the accompanying siege, displacement and deprivation; called on Muslim states and the international community to relieve the Palestinian population; appealed to Palestinian factions for unity; and expressed alarm at what it called threats to Jerusalem's Arab and Islamic identity and to al-Aqsa Mosque, affirming the standing of Jerusalem and al-Aqsa for Muslims. It also addressed the situations in Iraq, Somalia and Sudan from the juristic-reference standpoint the Academy claims for itself. Recorded here as the Academy's own statement, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ فلسطین کے بارے میں بیان نے غزہ کی پٹی پر اس کے بیان کردہ حملے اور اس کے ساتھ محاصرے، بے گھری اور محرومی کی مذمت کی؛ اسلامی ممالک اور بین الاقوامی برادری سے فلسطینی عوام کی امداد کا مطالبہ کیا؛ فلسطینی دھڑوں سے اتحاد کی اپیل کی؛ اور یروشلم کی عرب و اسلامی شناخت اور مسجدِ اقصیٰ کو اس کے بقول درپیش خطرات پر تشویس کا اظہار کرتے ہوئے مسلمانوں کے لیے یروشلم اور اقصیٰ کے مقام کی تصدیق کی۔ اسی کے ساتھ اس نے عراق، صومالیہ اور سوڈان کے حالات کو بھی اس فقہی مرجع کے موقف سے کانا جسے اکیڈمی اپنے لیے قرار دیتی ہے۔ یہاں اکیڈمی کے اپنے بیان کے طور پر غیر جانبدارانہ خلاصہ درج ہے۔"
