label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 19)⁩ حول الأوضاع في فلسطين والعراق والصومال والسودان ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(19th session)⁩ on the situations in Palestine, Iraq, Somalia and Sudan ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(انیسویں مجلس)⁩: فلسطین، عراق، صومالیہ اور سوڈان کے حالات پر ⁦(بیان، قرارداد نہیں)⁩", es: "Declaración de la IIFA (19.ª sesión) sobre la situación en Palestina, Irak, Somalia y Sudán (declaración, no resolución).", fr: "Déclaration de l'IIFA (19e session) sur les situations en Palestine, en Irak, en Somalie et au Soudan (déclaration, et non une résolution)" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. في شقه الفلسطيني ندد البيان بما وصفه بالعدوان على قطاع غزة وما رافقه من حصار وتشريد وتجويع، ودعا دول العالم الإسلامي والمجتمع الدولي إلى إغاثة الشعب الفلسطيني، وناشد الفصائل الفلسطينية وحدة الصف، وأعرب عن قلقه مما قال إنه مساس بهوية القدس العربية والإسلامية وخطر يتهدد المسجد الأقصى، مؤكدًا مكانة القدس والأقصى لدى المسلمين. وتناول البيان كذلك الأوضاع في العراق والصومال والسودان بمنظور المرجعية الفقهية التي يعلنها المجمع لنفسه."
  en: "A statement issued by the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009), published among the session materials though not a numbered resolution. On Palestine, the statement condemned what it described as the assault on the Gaza Strip and the accompanying siege, displacement and deprivation; called on Muslim states and the international community to relieve the Palestinian population; appealed to Palestinian factions for unity; and expressed alarm at what it called threats to Jerusalem's Arab and Islamic identity and to al-Aqsa Mosque, affirming the standing of Jerusalem and al-Aqsa for Muslims. It also addressed the situations in Iraq, Somalia and Sudan from the juristic-reference standpoint the Academy claims for itself. Recorded here as the Academy's own statement, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ فلسطین کے بارے میں بیان نے غزہ کی پٹی پر اس کے بیان کردہ حملے اور اس کے ساتھ محاصرے، بے گھری اور محرومی کی مذمت کی؛ اسلامی ممالک اور بین الاقوامی برادری سے فلسطینی عوام کی امداد کا مطالبہ کیا؛ فلسطینی دھڑوں سے اتحاد کی اپیل کی؛ اور یروشلم کی عرب و اسلامی شناخت اور مسجدِ اقصیٰ کو اس کے بقول درپیش خطرات پر تشویس کا اظہار کرتے ہوئے مسلمانوں کے لیے یروشلم اور اقصیٰ کے مقام کی تصدیق کی۔ اسی کے ساتھ اس نے عراق، صومالیہ اور سوڈان کے حالات کو بھی اس فقہی مرجع کے موقف سے کانا جسے اکیڈمی اپنے لیے قرار دیتی ہے۔ یہاں اکیڈمی کے اپنے بیان کے طور پر غیر جانبدارانہ خلاصہ درج ہے۔"
  es: "Declaración emitida por la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009), publicada entre los materiales de la sesión, aunque no como resolución numerada. Respecto a Palestina, la declaración condenó lo que describió como el ataque a la Franja de Gaza y el consiguiente asedio, desplazamiento y privación; instó a los estados musulmanes y a la comunidad internacional a brindar ayuda a la población palestina; apeló a las facciones palestinas a la unidad; y expresó alarma ante lo que denominó amenazas a la identidad árabe e islámica de Jerusalén y a la Mezquita de Al-Aqsa, reafirmando la importancia de Jerusalén y Al-Aqsa para los musulmanes. También abordó las situaciones en Irak, Somalia y Sudán desde la perspectiva jurídica que la Academia se atribuye. Se recoge aquí como la declaración oficial de la Academia, resumida de forma neutral."
  fr: "Déclaration de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 19e session à Sharjah (1er-5 Jumada al-Ula 1430, 26-30 avril 2009), publiée dans les documents de la session sans toutefois constituer une résolution numérotée. Concernant la Palestine, la déclaration condamne ce qu'elle qualifie d'assaut contre la bande de Gaza et le siège, les déplacements et les privations qui en découlent; elle appelle les États musulmans et la communauté internationale à porter secours à la population palestinienne; elle exhorte les factions palestiniennes à l'unité; et elle exprime son inquiétude face à ce qu'elle considère comme des menaces contre l'identité arabe et islamique de Jérusalem et contre la mosquée Al-Aqsa, réaffirmant l'importance de Jérusalem et d'Al-Aqsa pour les musulmans. Elle aborde également les situations en Irak, en Somalie et au Soudan du point de vue de la jurisprudence que l'Académie s'est appropriée. Ce texte est reproduit ici comme la déclaration officielle de l'Académie, résumée de manière neutre."
