label: { ar: "بيان مجمع الفقه الإسلامي الدولي ⁦(الدورة 15)⁩ بشأن العراق ⁦(بيان لا قرار)⁩", en: "IIFA statement ⁦(15th session)⁩ on Iraq ⁦(statement, not a resolution)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان ⁦(پندرہویں مجلس)⁩: عراق ⁦(بیان، قرارداد نہیں)⁩", es: "Declaración de la IIFA (15.ª sesión) sobre Irak (declaración, no resolución)" }
summary:
  ar: "بيان صادر عن مجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(6–11 مارس 2004م)⁩، منشور ضمن مواد الدورة وإن لم يكن قرارًا مرقمًا. يتناول البيان بلسان المجمع أحداث العراق آنذاك وما سماه مؤامرات تستهدف وحدته وفتنًا طائفية وعرقية تهدد تماسك شعبه، ويُدينها، ويعلن وقوفه مع الشعب العراقي ودعوته لوحدته والخروج من آثار الاحتلال واستعادة سيادته على أساس العدل والأخوة، ويناشد مكونات العراق نبذ الفرقة. سُجّل بوصفه بيان المجمع، ملخصًا بحياد."
  en: "A statement issued by the International Islamic Fiqh Academy at its 15th session in Muscat (6–11 March 2004), published among the session materials though not a numbered resolution. In the Academy's own voice it addresses the events in Iraq at that time and what it calls schemes targeting its unity and sectarian and ethnic strife threatening the people's cohesion, condemning them; declares solidarity with the Iraqi people; calls for unity, an exit from the occupation's effects and restored sovereignty on the basis of justice and brotherhood; and appeals to Iraq's components to renounce division. Recorded as the Academy's own statement, summarised neutrally."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کا بیان، مسقط میں پندرہویں مجلس ⁦(6–11 مارچ 2004ء)⁩ میں جاری ہوا، مجلس کے مواد میں شائع ہوا مگر نمبر شدہ قرارداد نہیں۔ اکیڈمی کی اپنی زبانی میں یہ اس وقت کے عراق کے واقعات اور اس کے بقول اس کی وحدت کو نشانہ بنانے والی سازشیں اور فرقہ وارانہ و نسلی فتنے جو اس کے عوام کے یکجہتی کو خطرے میں ڈالتے ہیں بیان کرتا ہے اور ان کی مذمت کرتا ہے؛ عراقی عوام سے یکجہتی کا اعلان کرتا ہے؛ وحدت، قبضے کے اثرات سے نجات اور انصاف و بھائی چارے کی بنیاد پر خودمختاری کی بحالی کی دعوت دیتا ہے؛ اور عراق کے اجزا سے انتشار چھوڑنے کی اپیل کرتا ہے۔ یہاں اکیڈمی کے اپنے بیان کا غیر جانبدارانہ خلاصہ درج ہے۔"
  es: "Declaración emitida por la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión celebrada en Mascate (del 6 al 11 de marzo de 2004), publicada entre los documentos de la sesión, aunque no como resolución numerada. En palabras de la propia Academia, aborda los acontecimientos ocurridos en Irak en aquel momento y lo que denomina complots que atentan contra su unidad y la violencia sectaria y étnica que amenaza la cohesión del pueblo, condenándolos; declara su solidaridad con el pueblo iraquí; hace un llamamiento a la unidad, al fin de los efectos de la ocupación y al restablecimiento de la soberanía sobre la base de la justicia y la fraternidad; e insta a los componentes de Irak a renunciar a la división. Registrada como declaración oficial de la Academia, resumida de forma neutral."
