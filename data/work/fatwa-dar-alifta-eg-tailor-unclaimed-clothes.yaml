id: work/fatwa-dar-alifta-eg-tailor-unclaimed-clothes
class: work
kind: fatwa
label: { ar: "ما يجب فعله على الخياط بالملابس إذا تركها أصحابها عنده مدة طويلة", en: "What a tailor must do with clothes left uncollected for a long time", ur: "درزی کا فرض ان کپڑوں کے حق میں جو لمبے عرصے تک نہ اٹھائے جائیں", es: "¿Qué debe hacer un sastre con la ropa que lleva mucho tiempo sin recoger?" }
summary:
  ar: "سائل سأل عما يجب على الخياط فعله بالملابس التي تركها أصحابها عنده مدة طويلة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21582)⁩ أنه لا يحق للخياط التصرف في الملابس التي عنده وتأخر أصحابها عن استلامها بل يجب عليه المحافظة عليها حتى يؤدي الأمانة إلى أهلها على ما فصّل الجواب."
  en: "A questioner asked what a tailor must do with clothes whose owners left them with him for a long time. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21582) answered that the tailor may not dispose of the clothes; he must keep them safe until he delivers the trust to its owners — as the answer details."
  ur: "ایک سائل نے پوچھا کہ درزی کا کیا فرض ہے ان کپڑوں کے بارے میں جو مالک لمبے عرصے سے نہ اٹھائیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21582)⁩ نے جواب دیا کہ درزی کو ان میں تصرف کا حق نہیں؛ اسے امانت مالکوں تک پہنچانے تک محفوظ رکھنا ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó qué debe hacer un sastre con la ropa que sus dueños le han dejado durante mucho tiempo. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21582) respondió que el sastre no puede deshacerse de la ropa; debe guardarla a buen recaudo hasta que la devuelva a sus dueños, tal como se detalla en la respuesta."
