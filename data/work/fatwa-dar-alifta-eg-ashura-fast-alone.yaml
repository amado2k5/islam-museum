id: work/fatwa-dar-alifta-eg-ashura-fast-alone
class: work
kind: fatwa
label: { ar: "حكم صيام يوم عاشوراء وإفراده بالصيام", en: "Fasting 'Ashura, and fasting it alone", ur: "عاشورہ کا روزہ اور اسے اکیلا رکھنا", es: "Ayunar 'Ashura, y ayunar solo", fr: "Jeûner pendant Achoura, et jeûner seul", tr: "Aşura gününde oruç tutma ve oruç olarak seçilmesi", id: "Aturan tentang puasa pada hari Ashura dan menyebutnya sebagai puasa" }
summary:
  ar: "سائل سأل عن صيام يوم عاشوراء وإفراده بالصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21972)⁩ أن صيام عاشوراء مستحب شرعًا والأكمل الجمع بين صيام الأيام الثلاثة: التاسع والعاشر والحادي عشر، وإن اقتصر على العاشر فلا حرج على ما فصّل الجواب."
  en: "A questioner asked about fasting 'Ashura and fasting it alone. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21972) answered that fasting 'Ashura is recommended; the most complete is combining the ninth, tenth and eleventh, though confining oneself to the tenth is unobjectionable — as the answer details."
  ur: "ایک سائل نے عاشورہ کا روزہ اور اسے تنہا رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21972)⁩ نے جواب دیا کہ عاشورہ کا روزہ مستحب ہے؛ مکمل یہ ہے کہ نویں، دسویں اور گیارہویں تینوں رکھے، لیکن صرف دسویں پر اکتفا بھی بلا حرج ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el ayuno de Ashura y sobre ayunar solo ese día. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21972) respondió que se recomienda ayunar Ashura; lo más completo es combinar el noveno, el décimo y el undécimo día, aunque limitarse al décimo día no tiene inconveniente, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le jeûne d'Achoura et le fait de jeûner uniquement ce jour-là. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21972) a répondu que le jeûne d'Achoura est recommandé; le jeûne le plus complet consiste à combiner les neuvième, dixième et onzième jours du mois sacré, bien que se limiter au dixième jour soit acceptable – comme le précise la réponse."
  tr: "Bir soru soran Aşura günü oruç tutmak ve oruç tutmaya adamak hakkında bilgi verdi. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21972), İslam hukukuna göre oruç tutmanın önerildiğini ve en kapsamlı olanın üç günü birleştirmek olduğunu yanıtladı: dokuzuncu, onuncu ve on birinci günü. Eğer oruç onuncu gün ile sınırlıysa, cevapta detaylandırılanların zararı yoktur."
  id: "Seorang penanya bertanya tentang puasa pada hari Ashura dan mendedikasikannya untuk puasa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21972) menjawab bahwa puasa Ashura direkomendasikan menurut hukum Islam, dan yang paling lengkap adalah menggabungkan puasa selama tiga hari: kesembilan, kesepuluh, dan kesebelas. Jika dibatasi pada hari kesepuluh, tidak ada salahnya dengan apa yang dijelaskan dalam jawaban."
