  ar: "دراسة بالإنجليزية لفريد دونر في بدايات الإسلام، يرى فيها أن الدعوة بدأت حركة توحيدية لـ«المؤمنين»، صدرت عن مطبعة بيلناب بجامعة هارفارد في مايو 2010 في 280 صفحة."
  en: "An English study by Fred M. Donner of Islam's beginnings, arguing that it began as a monotheist 'Believers' movement'; published by the Belknap Press of Harvard University Press in May 2010 (280 pages)."
