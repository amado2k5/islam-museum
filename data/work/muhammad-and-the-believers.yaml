  es: "Un estudio en inglés de Fred M. Donner sobre los orígenes del Islam, que argumenta que comenzó como un movimiento monoteísta de \"creyentes\"; publicado por Belknap Press de Harvard University Press en mayo de 2010 (280 páginas)."
  fr: "Une étude anglaise de Fred M. Donner sur les débuts de l'Islam, affirmant qu'il a commencé comme un « mouvement de croyants » monothéiste; publiée par Belknap Press de Harvard University Press en mai 2010 (280 pages)."
