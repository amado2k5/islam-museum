summary:
  ar: "كتاب لآرثر لين من متحف فكتوريا وألبرت (1947) يتتبع الخزف الإسلامي في العراق ومصر وفارس من الأمويين إلى الغزو المغولي، ويرى أن الخزّافين تنقلوا بين البلاطات في عالم إسلامي ذي وحدة ثقافية {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}."
  en: "Book by Arthur Lane of the Victoria and Albert Museum (1947) tracing Islamic pottery in Iraq, Egypt and Persia from the Umayyads to the Mongol invasion, arguing that potters moved between courts in a culturally unified Islamic world {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}."
  ur: "وکٹوریا اینڈ البرٹ میوزیم کے آرتھر لین کی کتاب (1947ء) جو امویوں سے منگول حملے تک عراق، مصر اور فارس میں اسلامی ظروف سازی کا سراغ لگاتی ہے، اور کہتی ہے کہ کمہار ایک ثقافتی وحدت والی اسلامی دنیا میں ایک دربار سے دوسرے تک منتقل ہوتے رہے {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}۔"
