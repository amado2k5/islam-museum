class: work
kind: book
label: { ar: "الخزف الإسلامي المبكر ⁦(آرثر لين)⁩", en: "Early Islamic Pottery (Arthur Lane)", ur: "ابتدائی اسلامی ظروف ⁦(آرتھر لین)⁩", es: "Cerámica islámica temprana (Arthur Lane)", fr: "Céramiques islamiques anciennes (Arthur Lane)", tr: "Erken İslami Seramikler (Arthur Lynn)", id: "Keramik Islam Awal (Arthur Lynn)" }
summary:
  ar: "كتاب لآرثر لين من متحف فكتوريا وألبرت (1947) يتتبع الخزف الإسلامي في العراق ومصر وفارس من الأمويين إلى الغزو المغولي، ويرى أن الخزّافين تنقلوا بين البلاطات في عالم إسلامي ذي وحدة ثقافية {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}."
  en: "Book by Arthur Lane of the Victoria and Albert Museum (1947) tracing Islamic pottery in Iraq, Egypt and Persia from the Umayyads to the Mongol invasion, arguing that potters moved between courts in a culturally unified Islamic world {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}."
  ur: "وکٹوریا اینڈ البرٹ میوزیم کے آرتھر لین کی کتاب ⁦(1947ء)⁩ جو امویوں سے منگول حملے تک عراق، مصر اور فارس میں اسلامی ظروف سازی کا سراغ لگاتی ہے، اور کہتی ہے کہ کمہار ایک ثقافتی وحدت والی اسلامی دنیا میں ایک دربار سے دوسرے تک منتقل ہوتے رہے {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}۔"
  es: "Libro de Arthur Lane del Museo Victoria y Alberto (1947) que rastrea la cerámica islámica en Irak, Egipto y Persia desde los Omeyas hasta la invasión mongola, argumentando que los alfareros se movían entre cortes en un mundo islámico culturalmente unificado {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}."
  fr: "Ouvrage d'Arthur Lane du Victoria and Albert Museum (1947) retraçant la poterie islamique en Irak, en Égypte et en Perse, des Omeyyades à l'invasion mongole, faisant valoir que les potiers se déplaçaient entre les cours dans un monde islamique culturellement unifié {cite:lane-early-islamic-pottery-1947 p. 6} {cite:lane-early-islamic-pottery-1947 p. 8}."
  tr: "Victoria ve Albert Müzesi'nden Arthur Lane'in (1947) kitabı, Irak, Mısır ve Pers'teki İslami çömlekçiliği Emeviylerden Moğol istilasına kadar izler ve çömlekçilerin kültürel birlik içinde İslam dünyasında fayanslar arasında hareket ettiklerini savunur {cite:Lane-early-Islamic-pottery-1947 s. 6} {cite:Lane-early-Islamic-pottery-1947 s. 8}."
  id: "Sebuah buku karya Arthur Lane dari Victoria and Albert Museum (1947) menelusuri tembikar Islam di Irak, Mesir, dan Persia dari era Umayyah hingga invasi Mongol, dan berargumen bahwa para pembuat tembikar berpindah antar ubin di dunia Islam dengan kesatuan budaya {cite:Lane-early-Islamic-pottery-1947 hlm. 6} {cite:Lane-early-Islamic-pottery-1947 hlm. 8}."
