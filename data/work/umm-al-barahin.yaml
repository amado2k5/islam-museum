summary:
  ar: "للشيخ الإمام محمد بن يوسف بن الحسين السنوسي؛ مختصر مفيد محتو على جميع عقائد التوحيد ختم بكلمتي الشهادة ثم شرحه شرحاً مفيداً مختصراً {cite:kashf-zunun-furqan p. 635}."
  en: "Al-Sanusi's Umm al-Barahin — 'the mother of proofs', the compact creed of tawhid ending with the two words of testimony, with the author's own short commentary {cite:kashf-zunun-furqan p. 635}."
  es: "Umm al-Barahin de Al-Sanusi — 'la madre de las pruebas', el credo compacto del tawhid que termina con las dos palabras del testimonio, con el breve comentario del propio autor {cite:kashf-zunun-furqan p. 635}."
  fr: "L'Umm al-Barahin d'Al-Sanusi — « la mère des preuves », le credo compact du tawhid se terminant par les deux mots du témoignage, avec le propre court commentaire de l'auteur {cite:kashf-zunun-furqan p. 635}."
  ur: "السنوسی کی ام البرہین - 'ثبوت کی ماں'، توحید کا جامع عقیدہ جس کا اختتام گواہی کے دو الفاظ پر ہوتا ہے، مصنف کی اپنی مختصر تفسیر کے ساتھ۔ 635}۔"
  tr: "Şeyh İmam Muhammed bin Yusuf bin El-Hüseyin El-Sanusi tarafından; tek tanrıcılığın tüm inançlarını içeren faydalı bir özet, iki söz ile sona erer, ardından kısa ve faydalı bir açıklamayla açıklanır {atıf:kashf-zunun-furqan, s. 635}."
  id: "Oleh Sheikh Imam Muhammad bin Yusuf bin Al-Husayn Al-Sanusi; ringkasan berguna yang memuat semua kepercayaan monoteisme, diakhiri dengan dua kata kesaksian, lalu dijelaskan dalam penjelasan singkat dan berguna {sitasi:kashf-zunun-furqan, hlm. 635}."
