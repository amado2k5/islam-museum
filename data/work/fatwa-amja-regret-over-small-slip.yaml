id: work/fatwa-amja-regret-over-small-slip
class: work
kind: fatwa
label: { ar: "الندم على هفوة صغيرة والاستغفار", en: "Regret over a small slip, and seeking forgiveness", ur: "چھوٹی لغزش پر ندامت اور استغفار", es: "Arrepentimiento por un pequeño desliz y búsqueda de perdón.", fr: "Regretter un petit faux pas et demander pardon", tr: "Küçük bir hata yap ve af dile", id: "Menyesali kesalahan kecil dan minta maaf" }
summary:
  ar: "سأل سائل استقذر لعق الطعام الذي يقع على أصابعه مع علمه أنه مشروع وظن أن اللعق يستحب إذا وقع الطعام على إصبعه لا في الفراغ من الطعام فهل كان ذلك بغضًا لشيء من السنة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78103 بتاريخ 6 مارس 2009)⁩ أن العبرة بالخواتيم وقد شرح الله صدره في النهاية فأرجو أن يغفر له ما كان منه قبل ذلك، وكلما حاك في صدره شيء من الغثم يبادر إلى الاستغفار منه ويتأكد أن ربه واسع المغفرة."
  en: "A questioner disliked licking food off his fingers though knowing it is recommended, having thought it applied only when food fell on the finger — and feared that was dislike of a sunna. Dr. Salah al-Sawi (fatwa no. 78103, 6 March 2009) answered that the measure is the endings, and God had opened his chest in the end — he hopes his earlier state is forgiven; whenever unease stirs in his breast he should hasten to seek forgiveness, sure that his Lord is vast in forgiveness."
  ur: "ایک سائل کو اپنی ایک چھوٹی لغزش پر ندامت تھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78103، 6 مارچ 2009)⁩ کے مطابق انجام کی بنیاد ہے؛ دل میں کوئی بات آئے تو استغفار کرے — اللہ کی مغفرت وسیع ہے۔"
  es: "Un consultante manifestó su desagrado por lamerse la comida de los dedos, a pesar de saber que es recomendable, pues creía que solo se aplicaba cuando la comida caía sobre el dedo, y temía que esto constituyera una desaprobación de una sunna. El Dr. Salah al-Sawi (fatwa n.° 78103, 6 de marzo de 2009) respondió que la medida está en los finales, y que Dios le había abierto el pecho al final; espera que su estado anterior sea perdonado; siempre que sienta inquietud en su pecho, debe apresurarse a pedir perdón, seguro de que su Señor es inmensamente misericordioso."
  fr: "Un homme, qui avait posé la question, n'aimait pas se lécher les doigts, bien qu'il sût que cela était recommandé, car il pensait que cela ne s'appliquait que lorsque de la nourriture tombait sur le doigt – et craignait que ce soit une aversion pour une sunna. Le Dr Salah al-Sawi (fatwa n° 78103, 6 mars 2009) répondit que la mesure se trouve dans la finalité, et que Dieu avait finalement ouvert son cœur – il espérait que son état antérieur était pardonné; chaque fois qu'un malaise l'envahissait, il devait s'empresser de demander pardon, certain que son Seigneur est infiniment miséricordieux."
  tr: "Bir soruya parmaklarına düşen yiyeceği yalamanın izin olup olmadığı soruldu ve yemeği bitirdikten sonra değil, yiyecek parmağına düşerse yalamanın tavsiye edildiğini düşündü. Bu, Sünnet'in herhangi bir bölümüne karşı bir nefret biçimi olarak mı kabul edilir? Dr. Salah Al-Sawi (Fetva No. 78103, 6 Mart 2009 tarihli) dersin sonlarda olduğunu, Allah'ın sonunda göğsünü açtığını ve öncekini affetmesini umuyorum diye yanıtladı. Göğsüne bir ghitin bir parçası işlendiğinde, hemen ondan af diler ve Rabbinin bağışlamada geniş olduğuna emindir."
  id: "Seorang penanya ditanya apakah menjilat makanan yang jatuh di jarinya dianggap diperbolehkan, dan dia berpikir menjilat disarankan jika makanan jatuh di jarinya, bukan setelah selesai makan. Apakah ini dianggap sebagai bentuk kebencian terhadap bagian mana pun dari Sunnah? Dr. Salah Al-Sawi (Fatwa No. 78103 tanggal 6 Maret 2009) menjawab bahwa pelajaran ada di akhir, dan Allah telah membuka dadanya pada akhirnya, jadi saya berharap Dia mengampuni apa yang ada sebelumnya. Setiap kali sesuatu dari ghith terjalin ke dadanya, dia segera mencari pengampunan darinya dan yakin bahwa Tuhan-Nya besar dalam pengampunan."
