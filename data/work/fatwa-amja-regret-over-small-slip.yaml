id: work/fatwa-amja-regret-over-small-slip
class: work
kind: fatwa
label: { ar: "الندم على هفوة صغيرة والاستغفار", en: "Regret over a small slip, and seeking forgiveness", ur: "چھوٹی لغزش پر ندامت اور استغفار" }
summary:
  ar: "سأل سائل استقذر لعق الطعام الذي يقع على أصابعه مع علمه أنه مشروع وظن أن اللعق يستحب إذا وقع الطعام على إصبعه لا في الفراغ من الطعام فهل كان ذلك بغضًا لشيء من السنة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78103 بتاريخ 6 مارس 2009)⁩ أن العبرة بالخواتيم وقد شرح الله صدره في النهاية فأرجو أن يغفر له ما كان منه قبل ذلك، وكلما حاك في صدره شيء من الغثم يبادر إلى الاستغفار منه ويتأكد أن ربه واسع المغفرة."
  en: "A questioner disliked licking food off his fingers though knowing it is recommended, having thought it applied only when food fell on the finger — and feared that was dislike of a sunna. Dr. Salah al-Sawi (fatwa no. 78103, 6 March 2009) answered that the measure is the endings, and God had opened his chest in the end — he hopes his earlier state is forgiven; whenever unease stirs in his breast he should hasten to seek forgiveness, sure that his Lord is vast in forgiveness."
  ur: "ایک سائل کو اپنی ایک چھوٹی لغزش پر ندامت تھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78103، 6 مارچ 2009)⁩ کے مطابق انجام کی بنیاد ہے؛ دل میں کوئی بات آئے تو استغفار کرے — اللہ کی مغفرت وسیع ہے۔"
