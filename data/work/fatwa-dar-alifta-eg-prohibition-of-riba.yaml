id: work/fatwa-dar-alifta-eg-prohibition-of-riba
class: work
kind: fatwa
label: { ar: "بيان حرمة التعامل بالربا", en: "The prohibition of dealing in riba", ur: "سود کے لین دین کی حرمت کا بیان", es: "La prohibición de comerciar con usura", fr: "L'interdiction de pratiquer le riba" }
summary:
  ar: "سائل سأل عن التعامل بالربا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22272)⁩ أنه يحرم على المسلم أن يشترط على من يقرضه رد مبلغ يزيد على ما يقرضه إياه قلّت تلك الزيادة أو كثرت، على ما فصّل الجواب في معنى الربا وصوره."
  en: "A questioner asked about dealing in riba. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22272) answered that it is forbidden for a Muslim to stipulate on the one he lends to the return of a sum exceeding what he lent him — whether the excess be small or large — as the answer details the meaning and forms of riba."
  ur: "ایک سائل نے سود کے لین دین کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22272)⁩ نے جواب دیا کہ مسلمان پر حرام ہے کہ قرض دینے والے سے ادا کردہ رقم میں کسی بھی قدر اضافے کی شرط رکھے خواہ وہ اضافہ کم ہو یا زیادہ، جیسا کہ جواب میں سود کے معنی اور صورتیں بیان ہوئیں۔"
  es: "Un consultante preguntó sobre el tema de la usura (riba). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22272) respondió que está prohibido para un musulmán estipular a quien presta dinero la devolución de una suma superior a la prestada, ya sea que el excedente sea pequeño o grande, y la respuesta detalla el significado y las formas de la usura."
  fr: "Un internaute a posé une question sur le riba (usure). La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22272) a répondu qu'il est interdit à un musulman d'exiger de celui à qui il prête une somme supérieure à celle prêtée, que ce surplus soit faible ou important. La réponse détaille la signification et les formes du riba."
