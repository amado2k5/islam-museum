id: work/fatwa-binbaz-mourning-elderly-widow-and-jewellery
class: work
kind: fatwa
label: { ar: "حكم الإحداد للكبيرة والحلية التي يشق نزعها", en: "Mourning for an elderly widow, and jewellery that is hard to remove", ur: "بوڑھی بیوہ کا سوگ اور مشکل سے اترنے والا زیور" }
summary:
  ar: "سؤال عن شمول الإحداد للمرأة الطاعنة في السن وعن نزع الحلي الذي يشق نزعه، أجاب فيه ابن باز بأن الإحداد يعم الجميع وأن الحلي يُنزع. أجاب ابن باز بأن الإحداد يعم الشابة والطاعنة في السن، والمدخول بها وغير المدخول بها. وفرّق بين المتوفى عنها والمطلقة: فالمعقود عليها إذا مات زوجها قبل الدخول عليها العدة والإحداد ولها الميراث، أما المطلقة قبل الدخول فلا عدة عليها. وقال إن الحلي يُنزع، فإن ضاق السوار على اليد قُصّ حتى يخرج ولا يبقى عليها."
  en: "A question on whether mourning applies to an elderly widow and on removing jewellery that is hard to take off, in which Ibn Baz answered that mourning applies to all and the jewellery is removed. Ibn Baz answered that mourning applies to the young and the elderly alike, and to a wife whether or not the marriage was consummated. He distinguished the widow from the divorcee: a woman whose husband dies after the contract but before consummation owes the waiting period and mourning and inherits from him, whereas a woman divorced before consummation owes no waiting period. He said the jewellery is removed, and a bracelet that has grown tight on the wrist is cut off rather than left on."
  ur: "اس سوال کا جواب کہ کیا سوگ بوڑھی بیوہ پر بھی ہے اور مشکل سے اترنے والا زیور اتارا جائے، جس میں ابن باز نے کہا کہ سوگ سب پر ہے اور زیور اتارا جائے گا۔ ابن باز نے جواب دیا کہ سوگ جوان اور عمر رسیدہ دونوں پر ہے، اور اس بیوی پر بھی جس کی رخصتی ہوئی ہو یا نہ ہوئی ہو۔ انہوں نے بیوہ اور مطلقہ میں فرق کیا: جس عورت کا شوہر نکاح کے بعد رخصتی سے پہلے فوت ہو جائے اس پر عدت اور سوگ ہے اور وہ وارث ہے، جبکہ رخصتی سے پہلے طلاق پانے والی پر عدت نہیں۔ انہوں نے کہا کہ زیور اتارا جائے، اور اگر کنگن کلائی پر تنگ ہو گیا ہو تو اسے کاٹ کر نکالا جائے، باقی نہ رکھا جائے۔"
