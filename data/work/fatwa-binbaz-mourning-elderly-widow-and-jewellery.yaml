label: { ar: "حكم الإحداد للكبيرة والحلية التي يشق نزعها", en: "Mourning for an elderly widow, and jewellery that is hard to remove", ur: "بوڑھی بیوہ کا سوگ اور مشکل سے اترنے والا زیور", es: "Luto por una anciana viuda y joyas difíciles de quitar.", fr: "Le deuil d'une veuve âgée et des bijoux difficiles à enlever", tr: "Büyük olan ve çıkarılması zor olan süs için yas tutma kuralı", id: "Aturan tentang berkabung untuk yang besar dan ornamen yang sulit dihilangkan" }
summary:
  ar: "سؤال عن شمول الإحداد للمرأة الطاعنة في السن وعن نزع الحلي الذي يشق نزعه، أجاب فيه ابن باز بأن الإحداد يعم الجميع وأن الحلي يُنزع. أجاب ابن باز بأن الإحداد يعم الشابة والطاعنة في السن، والمدخول بها وغير المدخول بها. وفرّق بين المتوفى عنها والمطلقة: فالمعقود عليها إذا مات زوجها قبل الدخول عليها العدة والإحداد ولها الميراث، أما المطلقة قبل الدخول فلا عدة عليها. وقال إن الحلي يُنزع، فإن ضاق السوار على اليد قُصّ حتى يخرج ولا يبقى عليها."
  en: "A question on whether mourning applies to an elderly widow and on removing jewellery that is hard to take off, in which Ibn Baz answered that mourning applies to all and the jewellery is removed. Ibn Baz answered that mourning applies to the young and the elderly alike, and to a wife whether or not the marriage was consummated. He distinguished the widow from the divorcee: a woman whose husband dies after the contract but before consummation owes the waiting period and mourning and inherits from him, whereas a woman divorced before consummation owes no waiting period. He said the jewellery is removed, and a bracelet that has grown tight on the wrist is cut off rather than left on."
  ur: "اس سوال کا جواب کہ کیا سوگ بوڑھی بیوہ پر بھی ہے اور مشکل سے اترنے والا زیور اتارا جائے، جس میں ابن باز نے کہا کہ سوگ سب پر ہے اور زیور اتارا جائے گا۔ ابن باز نے جواب دیا کہ سوگ جوان اور عمر رسیدہ دونوں پر ہے، اور اس بیوی پر بھی جس کی رخصتی ہوئی ہو یا نہ ہوئی ہو۔ انہوں نے بیوہ اور مطلقہ میں فرق کیا: جس عورت کا شوہر نکاح کے بعد رخصتی سے پہلے فوت ہو جائے اس پر عدت اور سوگ ہے اور وہ وارث ہے، جبکہ رخصتی سے پہلے طلاق پانے والی پر عدت نہیں۔ انہوں نے کہا کہ زیور اتارا جائے، اور اگر کنگن کلائی پر تنگ ہو گیا ہو تو اسے کاٹ کر نکالا جائے، باقی نہ رکھا جائے۔"
  es: "Una pregunta sobre si el luto se aplica a una viuda anciana y sobre quitarse las joyas difíciles de quitar, a lo que Ibn Baz respondió que el luto se aplica a todos y que las joyas se quitan. Ibn Baz respondió que el luto se aplica tanto a jóvenes como a ancianos, y a la esposa independientemente de si el matrimonio se consumó o no. Distinguió a la viuda de la divorciada: una mujer cuyo esposo muere después del contrato pero antes de la consumación debe guardar luto y heredar de él, mientras que una mujer divorciada antes de la consumación no debe guardar luto. Dijo que las joyas se quitan, y que una pulsera que se ha apretado en la muñeca se corta en lugar de dejarla puesta."
  fr: "À la question de savoir si le deuil s'applique à une veuve âgée et s'il convient d'enlever des bijoux difficiles à retirer, Ibn Baz répondit que le deuil s'applique à tous et que les bijoux doivent être retirés. Il précisa que le deuil s'applique aussi bien aux jeunes qu'aux personnes âgées, et à l'épouse, que le mariage ait été consommé ou non. Il fit la distinction entre la veuve et la divorcée: une femme dont le mari décède après le mariage mais avant sa consommation doit observer le délai de deuil et hérite de lui, tandis qu'une femme divorcée avant la consommation n'est soumise à aucun délai de deuil. Il indiqua que les bijoux doivent être retirés et qu'un bracelet devenu trop serré au poignet doit être coupé plutôt que laissé."
  tr: "Yaşlı kadınlar için ihdadın dahil edilmesi ve çıkarılması zor olan takıların çıkarılmasıyla ilgili bir soruya İbn Baz ihaddad'ın herkes için geçerli olduğunu ve takıların çıkarıldığını söyledi. İbn Baz, ihaddad'ın genç kadınlar ve yaşlı kadınlar için geçerli olduğunu, kendisiyle akraba olmayanlarla ilişkinin cinsel ilişki olmadığını söyledi. Ölen ve boşanmış kadını ayırt etti: kocası tamamlanmadan önce ölürse, bekleme süresi ve yas zorunludur ve kadının mirası vardır, boşanmış bir kadının ise tamamlanmadan önce bekleme süresi yoktur. Takıların çıkarıldığını; bilezik elde sıkılaşırsa, kesilip çıkarıldığını ve üzerinde hiçbir şey kalmadığını söyledi."
  id: "Sebuah pertanyaan tentang memasukkan ihdad untuk wanita tua dan tentang penghapusan perhiasan yang sulit dilepas, Ibn Baz menjawab bahwa ihaddad berlaku untuk semua orang dan perhiasan dihapus. Ibn Baz menjawab bahwa ihaddad berlaku untuk wanita muda dan wanita tua, dan bahwa hubungan seksual dengan dia dan mereka yang tidak berkerabat bukanlah hubungan seksual. Dia membedakan antara wanita yang meninggal dan wanita yang bercerai: jika suaminya meninggal sebelum consumasi, masa tunggu dan berkabung wajib dan dia memiliki warisan, sementara wanita yang bercerai sebelum konsumasi tidak memiliki masa tunggu. Dia mengatakan perhiasan dilepas; jika gelang mengencangkan di tangan, maka dipotong hingga terlepas dan tidak ada yang tersisa."
