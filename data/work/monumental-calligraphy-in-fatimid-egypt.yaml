summary:
  ar: "فصل لبرنارد أوكين يتتبع الكتابات الكوفية على الحجر والجص والخشب في مصر الفاطمية، من شواهد القبور السابقة للفاطميين إلى جامع الأقمر ⁦(519هـ/1125م)⁩ {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  en: "Chapter by Bernard O'Kane tracing Kufic inscriptions in stone, stucco and wood in Fatimid Egypt, from pre-Fatimid tombstones to the Aqmar Mosque (519/1125) {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  ur: "برنارڈ او کین کا باب جو فاطمی مصر میں پتھر، پلستر اور لکڑی پر کوفی کتبات کا سراغ لگاتا ہے، فاطمیوں سے پہلے کے کتباتِ قبور سے جامع الاقمر ⁦(519ھ/1125ء)⁩ تک {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}۔"
  es: "Capítulo de Bernard O'Kane que rastrea las inscripciones cúficas en piedra, estuco y madera en el Egipto fatimí, desde las lápidas prefatimíes hasta la Mezquita de Aqmar (519/1125) {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  fr: "Chapitre de Bernard O'Kane retraçant les inscriptions coufiques dans la pierre, le stuc et le bois dans l'Égypte fatimide, des pierres tombales pré-fatimides à la mosquée Aqmar (519/1125) {cite:okane-monumental-calligraphy-fatimid-egypt p. 1}."
  tr: "Bernard Oken'in, Fatımi Mısırı'nda taş, alçı ve ahşap üzerindeki Kufi yazıtlarını takip eden bir bölüm, Fatımiler öncesi mezar taşlarından El-Kamar Camii'ne kadar (519 Ahrimet/1125 M.S.) {cite:okane-monumental-calligraphy-fatimid-Egypt s. 1}."
  id: "Sebuah bab oleh Bernard Oken yang menelusuri prasasti Kufic pada batu, plester, dan kayu di Mesir Fatimiyah, dari batu nisan sebelum Fatimiyah hingga Masjid Al-Qamar (519 H/1125 M) {cite:okane-monumental-calligraphy-fatimid-egypt hlm. 1}."
