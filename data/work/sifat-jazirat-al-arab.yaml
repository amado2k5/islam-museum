summary:
  ar: "لأبي محمد الحسن بن أحمد بن يعقوب الهمداني اليمني؛ صفة جزيرة العرب طولاً وعرضاً وحدودها وأقاليمها وسَراياها ومياهها وديار قبائلها وحصونها وقلاعها ومشاهدها، بمقدمة في موضع الجزيرة من المعمور وفضلها {cite:sifat-jazirat-al-arab pp. 3-6}، وباب في أخلاق أهل الأقاليم على مشاكلة البروج والكواكب مأخوذ من بطلميوس يُعرِبُ فيه أهل كل ربع من الأربعة {cite:sifat-jazirat-al-arab pp. 19-24}."
  en: "Al-Hamdani's Sifat Jazirat al-Arab — the peninsula's dimensions, boundaries, climes, saraya, waters, tribal homelands, fortresses and shrines, opened by a treatise on Arabia's place in the inhabited earth and its virtue {cite:sifat-jazirat-al-arab pp. 3-6}."
  es: "El Sifat Jazirat al-Arab de Al-Hamdani: las dimensiones, límites, climas, saraya, aguas, tierras tribales, fortalezas y santuarios de la península, se abre con un tratado sobre el lugar de Arabia en la tierra habitada y su virtud {cite:sifat-jazirat-al-arab pp. 3-6}."
  fr: "Le Sifat Jazirat al-Arab d'Al-Hamdani — les dimensions, les frontières, les climats, les saraya, les eaux, les patries tribales, les forteresses et les sanctuaires de la péninsule, ouvert par un traité sur la place de l'Arabie dans la terre habitée et sa vertu {cite:sifat-jazirat-al-arab pp. 3-6}."
  ur: "الحمدانی کی سیفات جزیرۃ العرب — جزیرہ نما کے طول و عرض، حدود، آب و ہوا، سرایا، پانی، قبائلی آبائی علاقوں، قلعے اور مزارات، جو آباد زمین میں عرب کے مقام اور اس کی فضیلت پر ایک مقالے کے ذریعے کھولی گئی ہے۔"
  tr: "Ebu Muhammed el-Hasan ibn Ahmed ibn Ya'qub al-Hamdani el-Yamani tarafından; Arap Yarımadası'nın uzunluğu ve genişliği, sınırları, bölgeleri, sarayları, suları, kabile evleri, kaleleri, kaleleri ve simge yapıları tanımı, adanın yerleşim dünyasındaki konumu ve erdemi üzerine bir giriş {atıf:sifat-jazirat-al-arab s. 3-6} ve bölge halkının burçlar ve gezegenler sorunlarıyla ilgili etik üzerine bir bölüm, Ptolemaios'tan alınmıştır; burada dört bölgenin sakinlerini Araplaştırır {cite:sifat-jazirat-al-arab ss. 19-24}."
  id: "Oleh Abu Muhammad al-Hasan ibn Ahmad ibn Ya'qub al-Hamdani al-Yamani; deskripsi Semenanjung Arab dalam panjang dan lebar, batas-batasnya, wilayah, istana, perairan, rumah suku, benteng, kastil, dan landmark, dengan pengantar tentang lokasi pulau di dunia yang dihuni dan kelebihannya {cite:sifat-jazirat-al-arab hlm. 3-6}, serta bab tentang etika masyarakat wilayah terkait masalah zodiak dan planet, diambil dari Ptolemy, di mana ia mengarabkan penduduk dari masing-masing dari empat kawasan {cite:sifat-jazirat-al-arab hlm. 19-24}."
