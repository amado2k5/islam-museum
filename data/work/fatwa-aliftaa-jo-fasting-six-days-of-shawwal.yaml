id: work/fatwa-aliftaa-jo-fasting-six-days-of-shawwal
class: work
kind: fatwa
label: { ar: "صيام الستة من شوال", en: "Fasting six days of Shawwal", ur: "شوال کے چھ روزے" }
summary:
  ar: "سؤال عن صيام الستة من شوال، أجابت فيه دائرة الإفتاء العام الأردنية بأنه سنة، واستندت إلى حديث رواه مسلم في أن من أتبع رمضان بست من شوال كان كصيام الدهر. أجابت الدائرة بأن صيام الستة من شوال سنة، واستندت إلى حديث رواه مسلم في أن من صام رمضان ثم أتبعه ستًّا من شوال كان كصيام الدهر. وشرحت ذلك بأن ثواب صيام رمضان كثواب صيام عشرة أشهر، وثواب الأيام الستة كثواب ستين يومًا، فيتم بذلك العام."
  en: "A question about fasting six days of Shawwal, in which Jordan's General Iftaa Department answered that it is a sunna, relying on a hadith reported by Muslim that whoever follows Ramadan with six days of Shawwal is as if he had fasted the whole year. The Department answered that fasting six days of Shawwal is a sunna, relying on a hadith reported by Muslim that whoever fasts Ramadan and then follows it with six days of Shawwal is as one who fasts the whole year. It explained that the reward of fasting Ramadan is like that of fasting ten months and the reward of the six days is like that of sixty days, which together complete the year."
  ur: "شوال کے چھ روزے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ سنت ہے، اور مسلم کی روایت کردہ ایک حدیث پر انحصار کیا کہ جو رمضان کے بعد شوال کے چھ روزے رکھے وہ گویا پورے سال کے روزے رکھنے والا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ شوال کے چھ روزے سنت ہیں، اور مسلم کی روایت کردہ ایک حدیث پر انحصار کیا کہ جو رمضان کے روزے رکھے پھر اس کے بعد شوال کے چھ روزے رکھے وہ پورے سال کے روزے رکھنے والے کی طرح ہے۔ اس نے وضاحت کی کہ رمضان کے روزوں کا ثواب دس مہینوں کے روزوں کے برابر اور چھ دنوں کا ثواب ساٹھ دنوں کے برابر ہے، اور یوں سال مکمل ہو جاتا ہے۔"
