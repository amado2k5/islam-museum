id: work/fatwa-aliftaa-jo-fasting-six-days-of-shawwal
class: work
kind: fatwa
label: { ar: "صيام الستة من شوال", en: "Fasting six days of Shawwal", ur: "شوال کے چھ روزے", es: "Ayuno de seis días de Shawwal", fr: "Jeûne de six jours de Shawwal", tr: "Shawwal'ın altı gününü oruç tutmak", id: "Berpuasa selama enam hari Shawwal" }
summary:
  ar: "سؤال عن صيام الستة من شوال، أجابت فيه دائرة الإفتاء العام الأردنية بأنه سنة، واستندت إلى حديث رواه مسلم في أن من أتبع رمضان بست من شوال كان كصيام الدهر. أجابت الدائرة بأن صيام الستة من شوال سنة، واستندت إلى حديث رواه مسلم في أن من صام رمضان ثم أتبعه ستًّا من شوال كان كصيام الدهر. وشرحت ذلك بأن ثواب صيام رمضان كثواب صيام عشرة أشهر، وثواب الأيام الستة كثواب ستين يومًا، فيتم بذلك العام."
  en: "A question about fasting six days of Shawwal, in which Jordan's General Iftaa Department answered that it is a sunna, relying on a hadith reported by Muslim that whoever follows Ramadan with six days of Shawwal is as if he had fasted the whole year. The Department answered that fasting six days of Shawwal is a sunna, relying on a hadith reported by Muslim that whoever fasts Ramadan and then follows it with six days of Shawwal is as one who fasts the whole year. It explained that the reward of fasting Ramadan is like that of fasting ten months and the reward of the six days is like that of sixty days, which together complete the year."
  ur: "شوال کے چھ روزے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ سنت ہے، اور مسلم کی روایت کردہ ایک حدیث پر انحصار کیا کہ جو رمضان کے بعد شوال کے چھ روزے رکھے وہ گویا پورے سال کے روزے رکھنے والا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ شوال کے چھ روزے سنت ہیں، اور مسلم کی روایت کردہ ایک حدیث پر انحصار کیا کہ جو رمضان کے روزے رکھے پھر اس کے بعد شوال کے چھ روزے رکھے وہ پورے سال کے روزے رکھنے والے کی طرح ہے۔ اس نے وضاحت کی کہ رمضان کے روزوں کا ثواب دس مہینوں کے روزوں کے برابر اور چھ دنوں کا ثواب ساٹھ دنوں کے برابر ہے، اور یوں سال مکمل ہو جاتا ہے۔"
  es: "Una pregunta sobre el ayuno de seis días de Shawwal, a la que el Departamento General de Iftaa de Jordania respondió que es una sunna, basándose en un hadiz narrado por Muslim que dice que quien sigue el Ramadán con seis días de Shawwal es como si hubiera ayunado todo el año. El Departamento respondió que el ayuno de seis días de Shawwal es una sunna, basándose en un hadiz narrado por Muslim que dice que quien ayuna el Ramadán y luego lo sigue con seis días de Shawwal es como si ayunara todo el año. Explicó que la recompensa del ayuno de Ramadán es como la de ayunar diez meses y la recompensa de los seis días es como la de sesenta días, que juntos completan el año."
  fr: "Interrogé sur le jeûne des six jours de Shawwal, le Département général de la consultation juive (Iftaa) de Jordanie a répondu qu'il s'agit d'une sunna, se basant sur un hadith rapporté par Muslim. Ce hadith stipule que quiconque jeûne six jours de Shawwal après le Ramadan équivaut à avoir jeûné toute l'année. Le Département a expliqué que la récompense du jeûne du Ramadan est comparable à celle de dix mois de jeûne, et celle des six jours de Shawwal à celle de soixante jours, ce qui, ensemble, équivaut à une année complète."
  tr: "Kürdün Genel Fetva Dairesi, Müslümanların bir Sünnet olduğunu söyleyen ve Ramazan'dan sonra altı gün Şevval'le birlikte oruç tutan kişinin ömür boyu oruç tutmak gibi olduğunu söyleyen bir hadise dayanarak Müslümanların anlattığı bir hadise dayanarak bu soruyu sormuştur. Daire, Şevval'ın altıncı günü orucunun bir sünnet olduğunu ve Müslümanların anlattığı bir hadise dayanarak, Ramazan'ı oruç tutup ardından altı gün Şevval yapanın ömür boyu oruç tutmak gibi olduğunu belirtmiştir. Ramazan orucunun ödülünün on ay oruç tutmak gibi, altı gün için ödülün altmış gün kadar olduğu ve o yıl tamamlandığını açıklamıştır."
  id: "Sebuah pertanyaan tentang berpuasa enam hari Shawwal, di mana Departemen Fatwa Umum Yordania menjawab bahwa itu adalah Sunnah, dan didasarkan pada hadits yang diceritakan oleh Muslim yang menyatakan bahwa siapa pun yang mengikuti Ramadan dengan enam hari Shawwal adalah seperti puasa seumur hidup. Departemen tersebut menjawab bahwa puasa pada enam Shawwal adalah Sunnah, dan mengandalkan hadits yang diceritakan oleh Muslim yang menyatakan bahwa siapa pun yang berpuasa Ramadan lalu mengikutinya dengan enam hari Shawwal adalah seperti puasa seumur hidup. Departemen tersebut menjelaskan bahwa hadiah untuk puasa Ramadan adalah seperti puasa sepuluh bulan, dan hadiah untuk enam hari adalah sekitar enam puluh hari, sehingga tahun itu diselesaikan."
