label: { ar: "جمع الجوامع ⁦(الجامع الكبير)⁩ للسيوطي", en: "Jam' al-Jawami' (al-Jami' al-Kabir) of al-Suyuti", ur: "جمع الجوامع (الجامع الکبیر) از سیوطی" }
summary:
  ar: "كتاب جلال الدين السيوطي الكبير في الحديث، ويسمى الجامع الكبير، قصد فيه جمع الأحاديث النبوية بأسرها، واقتضب منه «الجامع الصغير»؛ ينقل النبهاني من خطبته أن العزو فيه إلى البخاري ومسلم وابن حبان والحاكم والمختارة يعلن بالصحة، وإلى العقيلي وابن عدي والخطيب وابن عساكر والديلمي ونحوهم يغني عن بيان الضعف، وأن السيوطي اخترمته المنية ولم يكمله {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}."
  en: "Jalal al-Din al-Suyuti's great hadith collection, also called al-Jami' al-Kabir, in which he aimed to gather all the Prophet's hadiths and from which he excerpted al-Jami' al-Saghir; al-Nabhani quotes its preface that citing a report to al-Bukhari, Muslim, Ibn Hibban, al-Hakim or al-Mukhtara signals soundness, while citing it to al-'Uqayli, Ibn 'Adi, al-Khatib, Ibn 'Asakir, al-Daylami and the like makes stating its weakness unnecessary, and reports that al-Suyuti died before completing it {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}."
  ur: "جلال الدین سیوطی کا بڑا حدیثی مجموعہ، جسے الجامع الکبیر بھی کہتے ہیں، جس میں انہوں نے تمام نبوی احادیث جمع کرنے کا ارادہ کیا اور جس سے «الجامع الصغیر» منتخب کی؛ نبہانی اس کے مقدمے سے نقل کرتے ہیں کہ بخاری، مسلم، ابن حبان، حاکم یا المختارہ کی طرف عزو صحت کا اعلان ہے، اور عقیلی، ابن عدی، خطیب، ابن عساکر، دیلمی وغیرہ کی طرف عزو ضعف کے بیان سے بے نیاز کرتا ہے، اور بتاتے ہیں کہ سیوطی اسے مکمل کرنے سے پہلے وفات پا گئے {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}۔"
