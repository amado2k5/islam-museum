label: { ar: "جمع الجوامع ⁦(الجامع الكبير)⁩ للسيوطي", en: "Jam' al-Jawami' (al-Jami' al-Kabir) of al-Suyuti", ur: "جمع الجوامع ⁦(الجامع الکبیر)⁩ از سیوطی", es: "Jam' al-Jawami' (al-Jami' al-Kabir) de al-Suyuti", fr: "Jam' al-Jawami' (al-Jami' al-Kabir) d'al-Suyuti", tr: "Al-Suyuti tarafından Al-Suyuti'nin Cami Koleksiyonu (Al-Jami' al-Kabir)", id: "Koleksi Masjid Al-Suuti (Al-Jami' Al-Kabir) oleh Al-Suyuti" }
summary:
  ar: "كتاب جلال الدين السيوطي الكبير في الحديث، ويسمى الجامع الكبير، قصد فيه جمع الأحاديث النبوية بأسرها، واقتضب منه «الجامع الصغير»؛ ينقل النبهاني من خطبته أن العزو فيه إلى البخاري ومسلم وابن حبان والحاكم والمختارة يعلن بالصحة، وإلى العقيلي وابن عدي والخطيب وابن عساكر والديلمي ونحوهم يغني عن بيان الضعف، وأن السيوطي اخترمته المنية ولم يكمله {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}."
  en: "Jalal al-Din al-Suyuti's great hadith collection, also called al-Jami' al-Kabir, in which he aimed to gather all the Prophet's hadiths and from which he excerpted al-Jami' al-Saghir; al-Nabhani quotes its preface that citing a report to al-Bukhari, Muslim, Ibn Hibban, al-Hakim or al-Mukhtara signals soundness, while citing it to al-'Uqayli, Ibn 'Adi, al-Khatib, Ibn 'Asakir, al-Daylami and the like makes stating its weakness unnecessary, and reports that al-Suyuti died before completing it {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}."
  ur: "جلال الدین سیوطی کا بڑا حدیثی مجموعہ، جسے الجامع الکبیر بھی کہتے ہیں، جس میں انہوں نے تمام نبوی احادیث جمع کرنے کا ارادہ کیا اور جس سے «الجامع الصغیر» منتخب کی؛ نبہانی اس کے مقدمے سے نقل کرتے ہیں کہ بخاری، مسلم، ابن حبان، حاکم یا المختارہ کی طرف عزو صحت کا اعلان ہے، اور عقیلی، ابن عدی، خطیب، ابن عساکر، دیلمی وغیرہ کی طرف عزو ضعف کے بیان سے بے نیاز کرتا ہے، اور بتاتے ہیں کہ سیوطی اسے مکمل کرنے سے پہلے وفات پا گئے {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}۔"
  es: "La gran colección de hadices de Jalal al-Din al-Suyuti, también llamada al-Jami' al-Kabir, en la que pretendía reunir todos los hadices del Profeta y de la que extrajo al-Jami' al-Saghir; al-Nabhani cita su prefacio que indica que citar un informe a al-Bukhari, Muslim, Ibn Hibban, al-Hakim o al-Mukhtara señala solidez, mientras que citarlo a al-'Uqayli, Ibn 'Adi, al-Khatib, Ibn 'Asakir, al-Daylami y otros hace innecesario señalar su debilidad, e informa que al-Suyuti murió antes de completarlo {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}."
  fr: "La grande collection de hadiths de Jalal al-Din al-Suyuti, également appelée al-Jami' al-Kabir, dans laquelle il visait à rassembler tous les hadiths du Prophète et dont il a extrait al-Jami' al-Saghir; al-Nabhani cite sa préface selon laquelle citer un rapport à al-Bukhari, Muslim, Ibn Hibban, al-Hakim ou al-Mukhtara signale sa validité, tandis que le citer à al-'Uqayli, Ibn 'Adi, al-Khatib, Ibn 'Asakir, al-Daylami et autres rend inutile d'en mentionner la faiblesse, et rapporte qu'al-Suyuti est mort avant de l'avoir terminée {cite:fath-kabir-halabi-v1 p. 3-6} {cite:jami-saghir-khayriyya-v1 p. 6}."
  tr: "Hadislerin büyük isimlerinden Celaluddin el-Suyuti'nin Büyük Koleksiyon adlı kitabı, tüm peygamberlik hadislerini toplamaya yönelikti ve 'Küçük Koleksiyon' bundan kısaltılmıştır. El-Nabhani vaazından, el-Buhari, Müslim, İbn Hibban, el-Hakim ve el-Muhtarah'a atfedilmesinin doğru olduğunu, el-Aqili, İbn Adi, el-Hatib, İbn Asakir, el-Daylami ve benzerlerine ise zayıflığı açıklamak için yeterlidir ve el-Süyuti'nin vefat ettiğini ancak tamamlamadığını {atıf:fath-kabir-halabi-v1 s. 3-6} {cite:jami-saghir-khayriyya-v1 s. 6}}"
  id: "Kitab Jalaluddin al-Suyuti, yang agung dalam hadis, yang disebut Kumpulan Besar, bertujuan mengumpulkan semua hadis nabi, dan 'Kumpulan Kecil' dipersingkat dari kitab itu. Al-Nabhani melaporkan dari khotbahnya bahwa atribusi kepada al-Bukhari, Muslim, Ibn Hibban, al-Hakim, dan al-Mukhtarah dinyatakan otentik, sementara kepada al-Aqili, Ibn 'Adi, al-Khatib, Ibn Asakir, al-Daylami, dan sejenisnya, cukup untuk memperjelas kelemahannya, dan bahwa al-Suyuti telah meninggal tetapi tidak menyelesaikannya {cite:fath-kabir-halabi-v1 hlm. 3-6} {cite:jami-saghir-khayriyya-v1 hlm. 6}."
