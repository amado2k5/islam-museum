label: { ar: "قرار مجمع الفقه الإسلامي الدولي 182 (19/8) بشأن تطبيق نظام البناء والتشغيل والإعادة ⁦(B.O.T)⁩ في تعمير الأوقاف والمرافق العامة", en: "IIFA resolution 182 (19/8) on applying the Build–Operate–Transfer ⁦(BOT)⁩ model to developing awqaf and public facilities", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 182 (19/8): اوقاف اور عوامی سہولتوں کی تعمیر میں B.O.T ⁦(بناء، چلاؤ، واپس دو)⁩ نظام کا اطلاق", es: "Resolución 182 (19/8) de la IIFA sobre la aplicación del modelo Construir-Operar-Transferir (BOT) al desarrollo de instalaciones públicas y de awqaf.", fr: "Résolution 182 (19/8) de l'IIFA relative à l'application du modèle de construction-exploitation-transfert (BOT) au développement des awqaf et des installations publiques", tr: "Uluslararası İslami Fiqh Akademisi Kararı 182 (19/8), vakıflar ve kamu tesislerinin geliştirilmesinde İnşaat, İşletme ve Yeniden Kullanım (B.O.T) sisteminin uygulanmasına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 182 (19/8) mengenai penerapan sistem Build, Operate, and Re-Utilization (B.O.T) dalam pengembangan wakaf dan fasilitas publik" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته التاسعة عشرة بالشارقة ⁦(1–5 جمادى الأولى 1430هـ، 26–30 أبريل 2009م)⁩. عرّف عقد البناء والتشغيل والإعادة بأنه اتفاق مالك أو من يمثله مع ممول ⁦(شركة المشروع)⁩ على إقامة منشأة وإدارتها وقبض عائدها كاملًا أو حسب الاتفاق خلال مدة متفق عليها بقصد استرداد رأس المال المستثمر مع عائد معقول، ثم تسليم المنشأة صالحة للأداء المرجو. وقرر أنه عقد مستحدث قد لا يتطابق وإن شابه في بعض صوره التعاقدات وأدوات الاستثمار المعهودة فقهًا، وأنه يجوز الأخذ به في تعمير الأوقاف والمرافق العامة. وأوصى بتكثيف البحث الفقهي حول جميع صوره لضبط أحكامها وصياغتها في نصوص يسهل الرجوع إليها عند التفاوض والتحاكم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 19th session in Sharjah (1–5 Jumada al-Ula 1430, 26–30 April 2009). It defined the Build–Operate–Transfer contract as an agreement between an owner or his representative and a financier (the project company) to construct a facility, manage it and take its return, in full or as agreed, for a set period to recover the invested capital with a reasonable yield, then hand the facility over fit for its intended service. It held it a novel contract which, though resembling some familiar juristic contracts and investment instruments in certain forms, may not match any of them, and ruled it permissible for developing awqaf and public facilities. It recommended intensified juristic research into all its forms to regulate their rulings in texts usable for negotiation and adjudication."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، شارجہ میں انیسویں مجلس ⁦(1–5 جمادی الاولیٰ 1430ھ، 26–30 اپریل 2009ء)⁩ میں۔ اس نے B.O.T عقد کی تعریف کی: مالک یا اس کے نمائندے اور ممول ⁦(منصوبے کی کمپنی)⁩ کے درمیان معاہدہ کہ وہ کسی تنصیب کو تعمیر کرے، چلائے اور طے شدہ مدت میں اس کا عائد — کل یا اتفاق کے مطابق — وصول کرے تاکہ لگی ہوئی سرمائے کی واپسی مع معقول منافع ہو، پھر تنصیب قابلِ کارکردگی حالت میں سپرد کرے۔ اکیڈمی نے اسے مستحدث عقد قرار دیا جو بعض صورتوں میں روایتی فقہی عقود اور سرمایہ کاری کے ذرائع سے مشابہت رکھتا ہو، پھر بھی ان میں سے کسی سے مکمل مطابق نہ ہو، اور فیصلہ دیا کہ اوقاف اور عوامی سہولتوں کی تعمیر میں اسے اپنایا جا سکتا ہے۔ سفارش: اس کی تمام صورتوں پر مزید فقہی تحقیق ہو تاکہ ان کے احکام ایسے متون میں مرتب ہوں جن کی طرف مذاکرات اور حکم کے وقت رجوع آسان ہو۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 19.ª sesión en Sharjah (1-5 de Jumada al-Ula de 1430, 26-30 de abril de 2009). Definió el contrato de Construcción-Operación-Transferencia como un acuerdo entre un propietario o su representante y un financiador (la empresa del proyecto) para construir una instalación, gestionarla y obtener su retorno, total o parcialmente, durante un período determinado para recuperar el capital invertido con una rentabilidad razonable, y posteriormente entregar la instalación en condiciones óptimas para el servicio previsto. La resolución lo consideró un contrato novedoso que, si bien se asemeja a algunos contratos jurídicos e instrumentos de inversión conocidos en ciertas formas, puede no coincidir con ninguno de ellos, y dictaminó que es permisible para el desarrollo de instalaciones públicas y de awqaf. Recomendó intensificar la investigación jurídica sobre todas sus formas para regular sus dictámenes en textos utilizables para la negociación y la resolución de controversias."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 19e session à Sharjah (1-5 Jumada al-Ula 1430, 26-30 avril 2009) définit le contrat de construction-exploitation-transfert (BOT) comme un accord entre un propriétaire ou son représentant et un financeur (la société de projet) portant sur la construction d'un ouvrage, sa gestion et la perception des revenus, en totalité ou selon les modalités convenues, pendant une période déterminée afin de recouvrer le capital investi avec un rendement raisonnable, puis la remise de l'ouvrage en état de fonctionnement. L'Académie considère ce contrat comme novateur et, bien que présentant des similitudes avec certains contrats et instruments d'investissement juridiques connus, il ne leur correspond pas nécessairement. Elle le juge admissible pour le développement des awqaf et des infrastructures publiques. Elle recommande d'approfondir la recherche juridique sur toutes ses formes afin d'en établir les règles dans des textes applicables à la négociation et à l'arbitrage."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on dokuzuncu oturumunda (1–5 Jumada al-Awwal 1430 H, 26–30 Nisan 2009) toplu kararı olarak tanımlanmıştır. İnşaat, işletme ve yenileme sözleşmesi, bir sahip veya temsilcisi ile finansör (proje şirketi) arasında bir tesisin kurulması ve yönetilmesi ve tam getirilerini alması için ya da anlaşmaya uygun bir süre içinde ya da anlaşmaya uygun bir süre içinde alınmasını amaçlayan ve ardından uygun şekilde sağlanan tesisin sağlanması şeklinde tanımlanmıştır. Yeni getirilen bir sözleşme olduğu ve bazı biçimleriyle içtihatta alışılmış sözleşmeler ve yatırım araçlarına benzemeyebileceği ve vakıflar ile kamu tesislerinin geliştirilmesinde kullanılabileceği kararlaştırıldı. Hükümlerini netleştirmek ve müzakere ile dava sürecinde kolayca başvurulabilecek metinlere dönüştürmek için tüm biçimleri üzerinde içtihat araştırmalarının yoğunlaştırılmasını tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kesembilan belas di Sharjah (1–5 Jumada al-Awwal 1430 H, 26–30 April 2009). Kontrak pembangunan, operasi, dan renovasi didefinisikan sebagai perjanjian antara pemilik atau perwakilannya dan finansier (perusahaan proyek) untuk mendirikan dan mengelola sebuah tempat usaha dan menerima pengembalian penuhnya atau sesuai dengan perjanjian dalam jangka waktu yang disepakati dengan tujuan memulihkan modal yang diinvestasikan dengan pengembalian yang wajar, kemudian menyerahkan fasilitas sesuai dengan kinerja yang diinginkan. Diputuskan bahwa ini adalah kontrak baru yang mungkin tidak sesuai, meskipun dalam beberapa bentuk, menyerupai kontrak dan instrumen investasi yang lazim dalam yurisprudensi, dan dapat digunakan dalam pengembangan dana abadi dan fasilitas publik. Kontrak ini merekomendasikan intensifikasi penelitian yurisprudensial pada semua bentuknya untuk memperjelas ketentuan dan menyusunnya menjadi teks yang mudah dirujuk selama negosiasi dan litigasi."
