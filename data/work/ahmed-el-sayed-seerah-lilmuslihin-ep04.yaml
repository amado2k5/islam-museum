id: work/ahmed-el-sayed-seerah-lilmuslihin-ep04
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 4: نزول الوحي"
  en: "The Prophetic Biography for Reformers, episode 4: The Coming of Revelation"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 4: وحی کا نزول"
  fr: "La biographie prophétique pour les réformateurs, épisode 4 : La descente de la révélation"
  es: "La biografía profética para los reformadores, episodio 4: El descenso de la revelación"
summary:
  ar: "تفتتح الجلسة الرابعة الحديث عن نزول الوحي على النبي. يؤكد مهابة الحدث وثقله، ثم يتناول كلمات خديجة في طمأنته، ودور ورقة بن نوفل، وفترة الوحي، ويستخلص للمصلحين دروسا عن جسامة مهمتهم وحتمية الابتلاء."
  en: "The fourth session opens the account of the coming of revelation to the Prophet. He stresses the awe and weight of the event, then reads Khadija's words of reassurance, the role of Waraqa ibn Nawfal, and the pause in revelation, drawing lessons for reformers about the gravity of their task and the certainty of trials."
  ur: "چوتھی نشست میں نبی پر وحی کے نزول کا بیان شروع ہوتا ہے۔ وہ اس واقعے کی ہیبت اور بھاری پن پر زور دیتے ہیں، پھر خدیجہ کے تسلی کے الفاظ، ورقہ بن نوفل کے کردار اور وحی کے وقفے کا ذکر کرتے ہیں، اور مصلحین کے لیے ان کے کام کی سنگینی اور آزمائش کے یقینی ہونے کے اسباق نکالتے ہیں۔"
  fr: "La quatrième séance ouvre le récit de la venue de la révélation au Prophète. Il insiste sur la majesté et le poids de l'événement, puis aborde les paroles de réconfort de Khadija, le rôle de Waraqa ibn Nawfal et l'interruption de la révélation, et en tire pour les réformateurs des leçons sur la gravité de leur tâche et la certitude des épreuves."
  es: "La cuarta sesión abre el relato de la llegada de la revelación al Profeta. Subraya la majestad y el peso del acontecimiento, y luego trata las palabras de consuelo de Khadija, el papel de Waraqa ibn Nawfal y la pausa de la revelación, y saca para los reformadores lecciones sobre la gravedad de su tarea y la certeza de las pruebas."
