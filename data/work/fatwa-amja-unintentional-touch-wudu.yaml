id: work/fatwa-amja-unintentional-touch-wudu
class: work
kind: fatwa
label: { ar: "المس بغير قصد والوضوء", en: "Touching one's private part unintentionally — a disputed break", ur: "بے قصد چھونا اور وضو", es: "Tocar las partes íntimas sin querer: una ruptura controvertida", fr: "Se toucher les parties intimes involontairement — une rupture controversée", tr: "İstemeden dokunma ve abdest alma", id: "Sentuhan dan wudhu yang tidak disengaja" }
summary:
  ar: "سأل سائل أنه أثناء ارتدائه ملابسه لمس بدون أن ينتبه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81929 بتاريخ 22 يوليو 2010)⁩ أنه إن كان هذا المس لشهوة فقد انتقض وضوءه بلا نزاع أما إن كان لغير شهوة وبغير قصد فذلك موضع النظر لتعارض الأدلة في هذا الباب، والقول باستحباب الوضوء قول متوجه جمعًا بين حديث بسرة بنت صفوان من مس ذكره فليتوضأ وبين ما ورد من أخبار آخر على ما فصّل الجواب."
  en: "A questioner touched himself unintentionally while dressing. Dr. Salah al-Sawi (fatwa no. 81929, 22 July 2010) answered that if the touch was for desire his wudu is broken without dispute; if not for desire and without intent it is a point of study, the evidences conflicting here — the saying that wudu is recommended is a faced one, joining Busra bint Safwan's 'whoever touches his member, let him do wudu' with the other reports — as the answer details."
  ur: "بے قصد چھونے سے وضو؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81929، 22 جولائی 2010)⁩ کے مطابق شہوت میں وضو ٹوٹا؛ بغیر شہوت مسح متنازع — وضو مستحب۔"
  es: "Un consultante se tocó involuntariamente mientras se vestía. El Dr. Salah al-Sawi (fatwa n.° 81929, 22 de julio de 2010) respondió que si el contacto fue por deseo, su wudu se invalida sin discusión; si no fue por deseo y sin intención, es un tema de estudio, ya que las evidencias son contradictorias al respecto: el dicho de que se recomienda el wudu es controvertido, y se suma a la afirmación de Busra bint Safwan de que \"quien se toque su miembro, que haga el wudu\" con los demás informes, como se detalla en la respuesta."
  fr: "Un homme s'est touché involontairement en s'habillant. Le Dr Salah al-Sawi (fatwa n° 81929, 22 juillet 2010) a répondu que si ce contact était motivé par le désir, ses ablutions sont invalidées sans conteste; dans le cas contraire, la question est sujette à interprétation, les sources étant contradictoires. L'avis recommandant les ablutions est controversé et rejoint celui de Busra bint Safwan (« quiconque touche son membre doit faire ses ablutions ») parmi d'autres récits, comme le précise la réponse."
  tr: "Bir soru soran, kıyafetlerini giyerken dikkatsiz şekilde ona dokunduğunu sordu. Dr. Salah Al-Sawy (22 Temmuz 2010 tarihli 81929 sayılı fetva) yanıtladı: Eğer bu dokunma arzu içinse, abdest almasının tartışmasız geçersiz sayılır. Ancak isteksiz ve niyetsiz ise, bu konudaki çelişkili kanıtlar nedeniyle bu değerlendirmeye tabidir. Abdest tavsiyesi görüşü, Basra bint Safvan'ın 'Anısına dokunan herkes, abdest etsin' hadisini cevabda detaylandırıldığı gibi diğer raporlarla birleştiren açık bir görüştür."
  id: "Seorang penanya ditanya bahwa saat mengenakan pakaian, ia menyentuhnya tanpa memperhatikan. Dr. Salah Al-Sawy menjawab (Fatwa No. 81929 tanggal 22 Juli 2010) bahwa jika sentuhan itu karena hasrat, maka wudusnya dibatalkan tanpa bantahan. Namun jika tanpa keinginan dan tanpa niat, hal itu harus dipertimbangkan karena bukti yang bertentangan dalam hal ini. Pandangan tentang rekomendasi wudhu adalah pendapat jelas yang menggabungkan hadits Basrah bint Safwan: 'Siapa pun menyentuh ingatannya, biarlah ia melakukan wudhu' dengan laporan lain, sebagaimana dijelaskan dalam jawaban."
