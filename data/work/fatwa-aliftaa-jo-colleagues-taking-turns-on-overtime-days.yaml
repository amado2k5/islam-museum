id: work/fatwa-aliftaa-jo-colleagues-taking-turns-on-overtime-days
class: work
kind: fatwa
label: { ar: "تناوب الزملاء في أيام العمل الإضافي", en: "Colleagues taking turns on overtime days", ur: "ساتھیوں کا اوور ٹائم کے دنوں میں باری باری آنا", es: "Los compañeros se turnan para trabajar horas extras.", fr: "Les collègues se relaient pour les heures supplémentaires.", tr: "Fazla mesai günlerinde meslektaşların rotasyonu", id: "Rotasi rekan kerja pada hari lembur" }
summary:
  ar: "سؤال عن تناوب الزملاء في أيام العمل الإضافي، أجابت فيه دائرة الإفتاء العام الأردنية بأن على الموظف التزام أنظمة العمل الإضافي والوجود في مكان العمل، ولا تحل الأجرة عما خالف التعليمات. أجابت الدائرة بأن الواجب على الموظف التزام التعليمات والأنظمة المتعلقة بساعات العمل الإضافية، والتزام الصدق واجتناب التحايل والكذب، واستشهدت بـ[[passage/quran-9-119|سورة التوبة 9:119]]. وقالت إن على من كلف بالعمل الإضافي أن يلتزم الوجود في مكان العمل وإن لم يعمل، وإن على المخول بتقرير العمل الإضافي ألا يمنح ساعات تخالف النظام، وإن ما خالف التعليمات لا تحل الأجرة عليه."
  en: "A question about colleagues taking turns on overtime days, in which Jordan's General Iftaa Department answered that employees must follow the overtime rules and be present at work, and that pay for what breaches the instructions is not lawful. The Department answered that an employee must follow the instructions and regulations on overtime hours, be truthful, and avoid trickery and lying, citing [[passage/quran-9-119|Surat al-Tawba 9:119]]. It said that whoever is assigned overtime must be present at the workplace even if there is no work, that the person authorised to approve overtime may not grant hours against the regulations, and that pay for anything that breaches the instructions is not lawful."
  ur: "ساتھیوں کا اوور ٹائم کے دنوں میں باری باری آنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ملازم پر اوور ٹائم کے ضوابط کی پابندی اور کام کی جگہ پر موجودگی لازم ہے، اور ہدایات کے خلاف کام کی اجرت حلال نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم پر اوور ٹائم کے اوقات سے متعلق ہدایات اور ضوابط کی پابندی، سچائی، اور حیلے اور جھوٹ سے بچنا لازم ہے، اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا۔ اس نے کہا کہ جسے اوور ٹائم سونپا جائے وہ کام کی جگہ پر موجود رہے چاہے کام نہ ہو، اوور ٹائم منظور کرنے کا مجاز شخص ضوابط کے خلاف گھنٹے نہ دے، اور ہدایات کے خلاف کسی چیز کی اجرت حلال نہیں۔"
  es: "Una pregunta sobre compañeros que se turnan en días de horas extras, a la que el Departamento General de Iftaa de Jordania respondió que los empleados deben seguir las normas sobre horas extras y estar presentes en el trabajo, y que el pago por lo que infrinja las instrucciones no es lícito. El Departamento respondió que un empleado debe seguir las instrucciones y regulaciones sobre las horas extras, ser veraz y evitar el engaño y la mentira, citando [[passage/quran-9-119|Surat al-Tawba 9:119]]. Dijo que quien tenga asignadas horas extras debe estar presente en el lugar de trabajo incluso si no hay trabajo, que la persona autorizada para aprobar las horas extras no puede conceder horas que contravengan las regulaciones, y que el pago por cualquier cosa que infrinja las instrucciones no es lícito."
  fr: "Une question concernant le partage des heures supplémentaires entre collègues a été posée au Département général de la Iftaa en Jordanie. Ce dernier a répondu que les employés doivent respecter la réglementation relative aux heures supplémentaires et être présents à leur poste, et que toute rémunération effectuée en violation de cette réglementation est illégale. Le Département a précisé qu'un employé doit se conformer aux instructions et réglementations en vigueur concernant les heures supplémentaires, être honnête et éviter toute tromperie ou mensonge, citant le verset 119 de la sourate At-Tawba (9:119). Il a ajouté que toute personne à qui des heures supplémentaires sont assignées doit être présente sur son lieu de travail, même en l'absence de travail, que la personne habilitée à approuver les heures supplémentaires ne peut en aucun cas enfreindre la réglementation, et que toute rémunération effectuée en violation des instructions est illégale."
  tr: "Fazla mesai günlerinde meslektaşların dönüşümüyle ilgili bir soruya ise, Ürdün Genel Fetva Dairesi, çalışanın fazla mesai düzenlemelerine uyması ve işyerinde bulunması gerektiğini, talimatları ihlal edenlere ücret verilmediğini belirtti. Departman, çalışanın fazla mesai saatleriyle ilgili talimat ve düzenlemelere uyması, dürüst olması ve aldatma ile yalan söylemekten kaçınması gerektiğini belirterek [[pasaj/kuran-9-119|Surah At-Tewbe 9:119]]'a atıfta bulundu. Fazla mesai yapanların çalışmasalar bile işyerinde bulunmaları gerektiğini, fazla mesaiyi belirlemeye yetkili kişiye düzenlemeleri ihlal eden saatler verilmemesi gerektiğini, talimatları ihlal ederlerse ücretin kendilerine uygulanamayacağını belirtti."
  id: "Sebuah pertanyaan tentang rotasi rekan kerja selama hari lembur, Departemen Fatwa Umum Yordania menjawab bahwa karyawan harus mematuhi peraturan lembur dan hadir di tempat kerja, serta upah tidak diperbolehkan bagi mereka yang melanggar instruksi. Departemen menjawab bahwa karyawan harus mematuhi instruksi dan peraturan terkait jam lembur, jujur, dan menghindari penipuan serta kebohongan, dengan merujuk pada [[ayat/quran-9-119|Surah At-Tawbah 9:119]]. Departemen tersebut menyatakan bahwa mereka yang ditugaskan lembur harus hadir di tempat kerja meskipun mereka tidak bekerja, dan bahwa orang yang berwenang menentukan lembur tidak boleh diberikan jam yang melanggar peraturan, dan jika mereka melanggar instruksi, upah tidak berlaku bagi mereka."
