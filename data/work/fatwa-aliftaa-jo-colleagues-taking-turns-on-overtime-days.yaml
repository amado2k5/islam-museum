id: work/fatwa-aliftaa-jo-colleagues-taking-turns-on-overtime-days
class: work
kind: fatwa
label: { ar: "تناوب الزملاء في أيام العمل الإضافي", en: "Colleagues taking turns on overtime days", ur: "ساتھیوں کا اوور ٹائم کے دنوں میں باری باری آنا" }
summary:
  ar: "سؤال عن تناوب الزملاء في أيام العمل الإضافي، أجابت فيه دائرة الإفتاء العام الأردنية بأن على الموظف التزام أنظمة العمل الإضافي والوجود في مكان العمل، ولا تحل الأجرة عما خالف التعليمات. أجابت الدائرة بأن الواجب على الموظف التزام التعليمات والأنظمة المتعلقة بساعات العمل الإضافية، والتزام الصدق واجتناب التحايل والكذب، واستشهدت بـ[[passage/quran-9-119|سورة التوبة 9:119]]. وقالت إن على من كلف بالعمل الإضافي أن يلتزم الوجود في مكان العمل وإن لم يعمل، وإن على المخول بتقرير العمل الإضافي ألا يمنح ساعات تخالف النظام، وإن ما خالف التعليمات لا تحل الأجرة عليه."
  en: "A question about colleagues taking turns on overtime days, in which Jordan's General Iftaa Department answered that employees must follow the overtime rules and be present at work, and that pay for what breaches the instructions is not lawful. The Department answered that an employee must follow the instructions and regulations on overtime hours, be truthful, and avoid trickery and lying, citing [[passage/quran-9-119|Surat al-Tawba 9:119]]. It said that whoever is assigned overtime must be present at the workplace even if there is no work, that the person authorised to approve overtime may not grant hours against the regulations, and that pay for anything that breaches the instructions is not lawful."
  ur: "ساتھیوں کا اوور ٹائم کے دنوں میں باری باری آنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ملازم پر اوور ٹائم کے ضوابط کی پابندی اور کام کی جگہ پر موجودگی لازم ہے، اور ہدایات کے خلاف کام کی اجرت حلال نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ ملازم پر اوور ٹائم کے اوقات سے متعلق ہدایات اور ضوابط کی پابندی، سچائی، اور حیلے اور جھوٹ سے بچنا لازم ہے، اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا۔ اس نے کہا کہ جسے اوور ٹائم سونپا جائے وہ کام کی جگہ پر موجود رہے چاہے کام نہ ہو، اوور ٹائم منظور کرنے کا مجاز شخص ضوابط کے خلاف گھنٹے نہ دے، اور ہدایات کے خلاف کسی چیز کی اجرت حلال نہیں۔"
