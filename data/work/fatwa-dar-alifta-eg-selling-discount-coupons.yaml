label: { ar: "حكم بيع كوبونات الخصم والشراء والسحب عليها", en: "Selling discount coupons and drawing on them", ur: "رعایتی کوپن بیچنے اور ان پر قرعہ کا حکم" }
summary:
  ar: "سائل سأل عن بيع قسائم الخصم وكوبونات الشراء للعملاء بمقابل مالي مع السحب عليها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22198)⁩ ببيان حكم النشاط الدعائي التسويقي المذكور وضوابطه على ما فصّل الجواب."
  en: "A questioner asked about a platform's promotional activity of selling discount vouchers and purchase coupons to customers for money, with a draw on them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22198) answered by setting out the ruling on that marketing activity and its controls, as the answer details."
  ur: "ایک سائل نے کسی پلیٹ فارم کی طرف سے صارفین کو رعایتی واؤچر اور خریداری کوپن رقم کے بدلے بیچنے اور ان پر قرعہ اندازی کرنے کے حکم کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22198)⁩ نے جواب میں اس پروموشنل سرگرمی کا حکم اور اس کے ضوابط بیان کیے۔"
