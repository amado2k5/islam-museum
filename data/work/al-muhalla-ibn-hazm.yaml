summary:
  ar: "«المحلى بالآثار في شرح المجلى بالاختصار» لابن حزم الأندلسي ⁦(ت 456هـ)⁩، شرح مستقل لمتنه الفقهي المختصر «المجلى»، يورد فيه المسألة ثم برهانه من القرآن والسنة والإجماع، ثم أقوال المخالفين ويناقشها؛ وهو أشهر كتب الفقه الظاهري، كتبه مؤلفه إلى المسألة 2034 في هذه الطبعة وأتمه ابنه أبو رافع من «الإيصال»، ثم أكمله ابن خليل في «القدح المعلى». {cite:muhalla-dar-ibn-hazm-2016-v1 p.136} {cite:muhalla-dar-ibn-hazm-2016-v1 p.137} {cite:muhalla-dar-ibn-hazm-2016-v1 p.139} {cite:muhalla-dar-ibn-hazm-2016-v1 p.140}"
  en: "Ibn Hazm of al-Andalus's (d. 456 AH) al-Muhalla bi-l-Athar fi Sharh al-Mujalla bi-l-Ikhtisar, an independent commentary on his short legal text al-Mujalla, stating each question, then his proof from the Qur'an, Sunna and consensus, then the opposing views, which he discusses; the best-known book of Zahiri law, written by its author to question 2034 in this edition, completed by his son Abu Rafi' from al-Isal, and later by Ibn Khalil in al-Qadh al-Mu'alla."
  ur: "اندلس کے ابن حزم ⁦(م 456ھ)⁩ کی «المحلی بالآثار فی شرح المجلی بالاختصار»، ان کے مختصر فقہی متن «المجلی» کی مستقل شرح، جس میں وہ مسئلہ بیان کر کے قرآن، سنت اور اجماع سے اپنی دلیل دیتے، پھر مخالفین کے اقوال لا کر ان پر بحث کرتے ہیں؛ ظاہری فقہ کی سب سے مشہور کتاب، جسے مصنف نے اس طبع کے مسئلہ 2034 تک لکھا، ان کے بیٹے ابو رافع نے «الایصال» سے مکمل کیا، اور بعد میں ابن خلیل نے «القدح المعلی» میں تکمیل کی۔"
  es: "Al-Muhalla bi-l-Athar fi Sharh al-Mujalla bi-l-Ikhtisar de Ibn Hazm de al-Andalus (m. 456 AH), un comentario independiente sobre su breve texto legal al-Mujalla, donde expone cada cuestión, luego su prueba del Corán, la Sunna y el consenso, y finalmente las opiniones opuestas, que analiza; el libro más conocido de derecho zahiri, escrito por su autor hasta la cuestión 2034 en esta edición, completado por su hijo Abu Rafi' de al-Isal, y posteriormente por Ibn Khalil en al-Qadh al-Mu'alla."
  fr: "L'ouvrage d'Ibn Hazm d'al-Andalus (mort en 456 AH), al-Muhalla bi-l-Athar fi Sharh al-Mujalla bi-l-Ikhtisar, est un commentaire indépendant de son court texte juridique al-Mujalla. Il y expose chaque question, puis sa preuve tirée du Coran, de la Sunna et du consensus, puis les points de vue opposés, qu'il discute. Il s'agit du livre le plus connu du droit zahirite, écrit par son auteur jusqu'à la question 2034 dans cette édition, complété par son fils Abu Rafi' d'al-Isal, et plus tard par Ibn Khalil dans al-Qadh al-Mu'alla."
  tr: "İbn Hazm el-Endülüs'ün (ö. 456 Hicri) \"Al-Muhalla bil-Athar fi Sharh al-Majalla bi-İhtisar\" adlı eseri, kısaltılmış fıkıh metni \"El-Mücelle\" üzerine bağımsız bir yorumdur; burada önce konuyu sunar, sonra Kur'an, Sünnet ve uzlaşmadan kanıtlar, ardından muhaliflerin görüşlerini sunar ve bunları tartışır; bu kitap, yazarı tarafından bu baskıda 2034 sayısına kadar yazılmış ve oğlu Ebu Rafi tarafından \"El-İsal\"den tamamlanmış, ardından İbn Halil tarafından \"Kaddah Al-Mu'alla\"da tamamlanmıştır. {alıntı:) Muhalla-dar-ibn-hazm-2016-v1 s.136} {cite:muhalla-dar-ibn-hazm-2016-v1 s.137} {cite:muhalla-dar-ibn-hazm-2016-v1 s.139} {cite:muhalla-dar-ibn-hazm-2016-v1 s.140}"
  id: "\"Al-Muhalla bil-Athar fi Sharh al-Majalla bi-Ikhtisar\" oleh Ibn Hazm al-Andalusi (wafat 456 H), sebuah komentar independen atas teks yurisprudensi ringkasnya \"Al-Mujalla,\" di mana ia menyajikan isu tersebut, kemudian bukti dari Al-Qur'an, Sunnah, dan konsensus, kemudian pendapat para pembangkang dan membahasnya; ini adalah kitab yurisprudensi Zahiri yang paling terkenal, ditulis oleh penulisnya hingga edisi 2034 dalam edisi ini, dan diselesaikan oleh putranya Abu Rafi' dari \"Al-Isal,\" kemudian diselesaikan oleh Ibn Khalil dalam \"Al-Qaddah Al-Mu'alla.\" {cite:Muhalla-dar-ibn-hazm-2016-v1 hlm.136} {cite:muhalla-dar-ibn-hazm-2016-v1 p.137} {cite:muhalla-dar-ibn-hazm-2016-v1 hlm.139} {cite:muhalla-dar-ibn-hazm-2016-v1 p.140}"
