label:
  ar: "المحلى بالآثار"
  en: "al-Muhalla bi-l-Athar"
  ur: "المحلی بالآثار"
summary:
  ar: "«المحلى بالآثار في شرح المجلى بالاختصار» لابن حزم الأندلسي ⁦(ت 456هـ)⁩، شرح مستقل لمتنه الفقهي المختصر «المجلى»، يورد فيه المسألة ثم برهانه من القرآن والسنة والإجماع، ثم أقوال المخالفين ويناقشها؛ وهو أشهر كتب الفقه الظاهري، كتبه مؤلفه إلى المسألة 2034 في هذه الطبعة وأتمه ابنه أبو رافع من «الإيصال»، ثم أكمله ابن خليل في «القدح المعلى». {cite:muhalla-dar-ibn-hazm-2016-v1 p.136} {cite:muhalla-dar-ibn-hazm-2016-v1 p.137} {cite:muhalla-dar-ibn-hazm-2016-v1 p.139} {cite:muhalla-dar-ibn-hazm-2016-v1 p.140}"
  en: "Ibn Hazm of al-Andalus's (d. 456 AH) al-Muhalla bi-l-Athar fi Sharh al-Mujalla bi-l-Ikhtisar, an independent commentary on his short legal text al-Mujalla, stating each question, then his proof from the Qur'an, Sunna and consensus, then the opposing views, which he discusses; the best-known book of Zahiri law, written by its author to question 2034 in this edition, completed by his son Abu Rafi' from al-Isal, and later by Ibn Khalil in al-Qadh al-Mu'alla."
  ur: "اندلس کے ابن حزم (م 456ھ) کی «المحلی بالآثار فی شرح المجلی بالاختصار»، ان کے مختصر فقہی متن «المجلی» کی مستقل شرح، جس میں وہ مسئلہ بیان کر کے قرآن، سنت اور اجماع سے اپنی دلیل دیتے، پھر مخالفین کے اقوال لا کر ان پر بحث کرتے ہیں؛ ظاہری فقہ کی سب سے مشہور کتاب، جسے مصنف نے اس طبع کے مسئلہ 2034 تک لکھا، ان کے بیٹے ابو رافع نے «الایصال» سے مکمل کیا، اور بعد میں ابن خلیل نے «القدح المعلی» میں تکمیل کی۔"
