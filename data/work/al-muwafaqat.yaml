summary:
  ar: "كتاب في أصول الشريعة لأبي إسحاق الشاطبي الغرناطي المالكي ⁦(ت 790هـ)⁩، جعله مؤلفه خمسة أقسام: المقدمات العلمية، والأحكام، والمقاصد الشرعية، والأدلة الشرعية، والاجتهاد والتقليد؛ وسماه أولاً «عنوان التعريف بأسرار التكليف» ثم «الموافقات» لرؤيا رآها بعض شيوخه. وأشهر ما فيه كتاب المقاصد الذي يقرر أن التكاليف ترجع إلى حفظ مقاصد ضرورية وحاجية وتحسينية، وأن الضروريات خمس: حفظ الدين والنفس والنسل والمال والعقل، معتمداً على الاستقراء {cite:muwafaqat-mashhur-ibn-affan-v1 p. 9} {cite:muwafaqat-mashhur-ibn-affan-v1 p. 10} {cite:muwafaqat-mashhur-ibn-affan-v1 p. 11} {cite:muwafaqat-draz-ilmiyya p. 221} {cite:muwafaqat-draz-ilmiyya p. 222}."
  en: "A work on the principles of the Shari'a by Abu Ishaq al-Shatibi of Granada, a Maliki (d. 790 AH), which its author divided into five parts: preliminary premises, rulings, the objectives of the law, the legal proofs, and independent reasoning and imitation. He first named it 'Unwan al-Ta'rif bi-Asrar al-Taklif, then al-Muwafaqat because of a dream one of his teachers saw. Its best-known part is the book of objectives, which holds that the obligations of the law serve to preserve necessary, needed and refining purposes, the necessities being five - religion, life, progeny, property and intellect - established by induction."
  ur: "ابو اسحاق شاطبی غرناطی مالکی ⁦(م 790ھ)⁩ کی اصولِ شریعت پر کتاب، جسے مصنف نے پانچ اقسام میں تقسیم کیا: علمی مقدمات، احکام، مقاصدِ شرعیہ، ادلۂ شرعیہ، اور اجتہاد و تقلید۔ انہوں نے پہلے اس کا نام «عنوان التعریف باسرار التکلیف» رکھا، پھر اپنے ایک شیخ کے خواب کی بنا پر «الموافقات»۔ اس کا سب سے مشہور حصہ کتاب المقاصد ہے، جو بیان کرتا ہے کہ شرعی تکالیف ضروری، حاجی اور تحسینی مقاصد کی حفاظت کی طرف لوٹتی ہیں، اور ضروریات پانچ ہیں: دین، جان، نسل، مال اور عقل کی حفاظت — استقرا کی بنیاد پر۔"
  es: "Obra sobre los principios de la Sharia de Abu Ishaq al-Shatibi de Granada, un malikí (m. 790 AH), que su autor dividió en cinco partes: premisas preliminares, preceptos, objetivos de la ley, pruebas legales y razonamiento e imitación independientes. Inicialmente la tituló «Unwan al-Ta'rif bi-Asrar al-Taklif», y posteriormente «al-Muwafaqat» debido a un sueño que tuvo uno de sus maestros. Su parte más conocida es el libro de los objetivos, que sostiene que las obligaciones de la ley sirven para preservar propósitos necesarios, indispensables y refinadores, siendo las necesidades cinco —religión, vida, descendencia, propiedad e intelecto— establecidas por inducción."
  fr: "Un ouvrage sur les principes de la charia, écrit par Abou Ishaq al-Shatibi de Grenade, un malikite (mort en 790 AH), que son auteur divise en cinq parties: les prémisses préliminaires, les règles, les objectifs de la loi, les preuves juridiques et le raisonnement indépendant et l’imitation. Il le nomma d’abord « Unwan al-Ta’rif bi-Asrar al-Taklif », puis « al-Muwafaqat » en référence à un rêve qu’aurait fait l’un de ses maîtres. Sa partie la plus connue est le livre des objectifs, qui soutient que les obligations de la loi servent à préserver les finalités nécessaires, indispensables et vertueuses, les cinq finalités nécessaires – la religion, la vie, la descendance, la propriété et l’intellect – étant établies par induction."
  tr: "Ebu İshaq el-Şatibi el-Harnati el-Maliki'nin (ö. 790 Hicri) Şeriat ilkeleri üzerine bir kitap, kitabı beş bölüme ayırmıştır: bilimsel girişler, kararlar, hukuki hedefler, hukuki deliller ve ijtihad ile taklit; önce 'Unwan al-Ta'rif bi Asrar al-Taklab', ardından bazı öğretmenlerinin gördüğü bir vizyon için 'al-Muwafaqat' adını vermiştir. Bunların en ünlüsü, zorunlu, ihtiyaç sahipleri ve iyileştirme hedeflerinin korunmasıyla ilgili yükümlülüklerin beş olduğunu belirten Amaçlar Kitabı'dır; gerekliliklerin beş olduğu belirtilir: din, yaşam, soy, zenginlik ve zekânın korunması, tümevarasyona dayanarak {cite:muwafaqat-mashhur-ibn-affan-v1 s. 9} {cite:muwafaqat-mashhur-ibn-affan-v1 s. 10} {cite:muwafaqat-mashhur-ibn-affan-v1 s. 11} {cite:muwafaqat-draz-ilmiyya s. 221} {cite:muwafaqat-draz-ilmiyya s. 222}."
  id: "Sebuah buku tentang prinsip-prinsip Syariah karya Abu Ishaq al-Shatibi al-Gharnati al-Maliki (wafat 790 H), yang penulisnya membaginya menjadi lima bagian: pengantar ilmiah, putusan, tujuan hukum, bukti hukum, serta ijtihad dan peniruan; ia pertama kali menamainya 'Unwan al-Ta'rif bi Asrar al-Taklab' lalu 'al-Muwafaqat' untuk sebuah visi yang dilihat oleh beberapa gurunya. Yang paling terkenal adalah Kitab Tujuan, yang menyatakan bahwa kewajiban berkaitan dengan menjaga tujuan penting, membutuhkan, dan peningkatan, dan bahwa kebutuhan adalah lima: menjaga agama, kehidupan, garis keturunan, kekayaan, dan intelek, dengan mengandalkan induksi {cite:muwafaqat-mashhur-ibn-affan-v1 hlm. 9} {cite:muwafaqat-mashhur-ibn-affan-v1 hlm. 10} {cite:muwafaqat-mashhur-ibn-affan-v1 hlm. 11} {cite:muwafaqat-draz-ilmiyya hlm. 221} {cite:muwafaqat-draz-ilmiyya hlm. 222}."
