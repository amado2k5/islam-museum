structure: "Author's preface (Ibn Affan ed. pp. 3-12). Part 1: thirteen muqaddimat on the nature of usul knowledge (Draz ed. p. 18). Part 2: Kitab al-Ahkam - the rulings of obligation and of declaration, with long treatment of the permitted, cause, condition, strictness and dispensation (p. 63). Part 3: Kitab al-Maqasid - the Lawgiver's purposes (in laying down the law, in making it understood, in imposing obligations, in bringing the subject under it) and the purposes of the subject (p. 219). Part 4: Kitab al-Adilla - the Book and the sunna, their general and particular features (p. 469). Part 5: Kitab al-Ijtihad - independent reasoning, imitation, conflict and preference, question and answer (p. 774)."
