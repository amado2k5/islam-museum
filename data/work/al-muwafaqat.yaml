label: { ar: "الموافقات في أصول الشريعة", en: "al-Muwafaqat fi Usul al-Shari'a", ur: "الموافقات فی اصول الشریعہ" }
summary:
  ar: "كتاب في أصول الشريعة لأبي إسحاق الشاطبي الغرناطي المالكي (ت 790هـ)، جعله مؤلفه خمسة أقسام: المقدمات العلمية، والأحكام، والمقاصد الشرعية، والأدلة الشرعية، والاجتهاد والتقليد؛ وسماه أولاً «عنوان التعريف بأسرار التكليف» ثم «الموافقات» لرؤيا رآها بعض شيوخه. وأشهر ما فيه كتاب المقاصد الذي يقرر أن التكاليف ترجع إلى حفظ مقاصد ضرورية وحاجية وتحسينية، وأن الضروريات خمس: حفظ الدين والنفس والنسل والمال والعقل، معتمداً على الاستقراء {cite:muwafaqat-mashhur-ibn-affan-v1 p. 9} {cite:muwafaqat-mashhur-ibn-affan-v1 p. 10} {cite:muwafaqat-mashhur-ibn-affan-v1 p. 11} {cite:muwafaqat-draz-ilmiyya p. 221} {cite:muwafaqat-draz-ilmiyya p. 222}."
  en: "A work on the principles of the Shari'a by Abu Ishaq al-Shatibi of Granada, a Maliki (d. 790 AH), which its author divided into five parts: preliminary premises, rulings, the objectives of the law, the legal proofs, and independent reasoning and imitation. He first named it 'Unwan al-Ta'rif bi-Asrar al-Taklif, then al-Muwafaqat because of a dream one of his teachers saw. Its best-known part is the book of objectives, which holds that the obligations of the law serve to preserve necessary, needed and refining purposes, the necessities being five - religion, life, progeny, property and intellect - established by induction."
  ur: "ابو اسحاق شاطبی غرناطی مالکی (م 790ھ) کی اصولِ شریعت پر کتاب، جسے مصنف نے پانچ اقسام میں تقسیم کیا: علمی مقدمات، احکام، مقاصدِ شرعیہ، ادلۂ شرعیہ، اور اجتہاد و تقلید۔ انہوں نے پہلے اس کا نام «عنوان التعریف باسرار التکلیف» رکھا، پھر اپنے ایک شیخ کے خواب کی بنا پر «الموافقات»۔ اس کا سب سے مشہور حصہ کتاب المقاصد ہے، جو بیان کرتا ہے کہ شرعی تکالیف ضروری، حاجی اور تحسینی مقاصد کی حفاظت کی طرف لوٹتی ہیں، اور ضروریات پانچ ہیں: دین، جان، نسل، مال اور عقل کی حفاظت — استقرا کی بنیاد پر۔"
genre: [usul-al-fiqh]
