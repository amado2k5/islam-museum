id: work/fatwa-dar-alifta-eg-mufti-leaving-questioner-choice
class: work
kind: fatwa
label: { ar: "حكم ترك الفقيه والمفتي للمستفتي حرية اختيار أحد الأقوال", en: "Should the mufti leave the questioner free to choose among the juristic views?", ur: "کیا مفتی سوال کرنے والے کو اقوال میں انتخاب کی آزادی دے؟", es: "¿Debe el muftí dejar al consultante en libertad de elegir entre las distintas interpretaciones jurídicas?", fr: "Le mufti doit-il laisser à celui qui pose la question la liberté de choisir parmi les différentes interprétations juridiques ?", tr: "Hukukçu ve müfti hakkında karar vermek, soru soran kişiye görüşlerden birini seçme özgürlüğü bırakmak", id: "Memutuskan hakim dan mufti memberikan kebebasan kepada penanya untuk memilih salah satu pendapat" }
summary:
  ar: "سائل سأل عن مسألة خلافية بين الفقهاء وعن قول سمعه من عالم أنه ينبغي للفقيه والمفتي أن يترك للمستفتي حرية اختيار أحد الأقوال في المسألة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20840)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about a question disputed among the jurists, and about a saying he heard from a scholar that the jurist and mufti should leave the questioner free to choose one of the views. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20840) answered by setting out the ruling."
  ur: "ایک سائل نے فقہی اختلافی مسئلے اور ایک عالم کے اس قول کے بارے میں پوچھا کہ مفتی کو سوال کرنے والے کو اقوال میں انتخاب کی آزادی دینی چاہیے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20840)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre una cuestión controvertida entre los juristas y sobre un dicho que escuchó de un erudito, según el cual el jurista y el muftí deberían dejar al consultante en libertad de elegir una de las dos posturas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20840) respondió exponiendo la normativa."
  fr: "Un homme a posé une question controversée parmi les juristes, évoquant un propos d'un érudit selon lequel le juriste et le mufti devraient laisser l'interlocuteur libre de choisir son opinion. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20840) a répondu en énonçant la décision."
  tr: "Bir soru soran kişi, hukukçular arasında tartışmalı bir konuyu ve bir alimden duyduğu bir açıklamayı sordu; bu konuda fetvaya bir görüş seçme özgürlüğü vermeleri gerektiğini söyledi. Mısır'ın Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20840) bu konudaki kararı olduğu gibi açıklığa kavuşturdu."
  id: "Seorang penanya menanyakan tentang isu yang diperdebatkan di antara para ahli hukum dan tentang pernyataan yang didengarnya dari seorang ulama bahwa ahli hukum dan mufti harus membiarkan fatwa bebas memilih salah satu pendapat mengenai hal tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20840) menanggapi dengan memperjelas putusan mengenai masalah ini sebagaimana adanya."
