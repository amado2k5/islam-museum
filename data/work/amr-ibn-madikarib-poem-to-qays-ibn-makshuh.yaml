label: { ar: "قصيدة عمرو بن معدي كرب إلى قيس بن مكشوح «أمرتك يوم ذي صنعاء»", en: "Amr ibn Ma'dikarib's poem to Qays ibn Makshuh, 'I counselled you on the day of Dhu San'a''" }
summary:
  ar: "قصيدة على روي الدال قالها عمرو بن معدي كرب حين أوعده قيس بن مكشوح لأنه خالفه وأتى النبي: يذكّره بأنه أمره يوم ذي صنعاء أمراً بيّناً رشده وبتقوى الله والمعروف فخرج من المنى كحمار غرّه وتده، ثم يتوعده بأنه إن لاقاه لقي ليثاً فوقه لبده. أنشد ابن هشام عن أبي عبيدة ثلاثة أبيات منها برواية أخرى ولم يعرف سائرها."
  en: "A dal-rhymed poem Amr ibn Ma'dikarib composed when Qays ibn Makshuh threatened him for defying him and going to the Prophet: he reminds Qays that on the day of Dhu San'a' he had counselled him clearly, to fear God and do good, but Qays like a donkey was fooled by its tether; then he threatens that whoever meets him meets a maned lion. Ibn Hisham gives Abu Ubayda's reading of three lines and says Abu Ubayda did not know the rest."
