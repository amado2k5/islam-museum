label: { ar: "قصيدة عمرو بن معدي كرب إلى قيس بن مكشوح «أمرتك يوم ذي صنعاء»", en: "Amr ibn Ma'dikarib's poem to Qays ibn Makshuh, 'I counselled you on the day of Dhu San'a''", es: "Poema de Amr ibn Ma'dikarib a Qays ibn Makshuh: \"Te aconsejé el día de Dhu San'a\".", fr: "Poème d'Amr ibn Ma'dikarib à Qays ibn Makshuh: « Je t'ai conseillé le jour de Dhu San'a »", ur: "عمرو بن معدیکریب کا قیس بن مکشوح کے لیے نظم، ''میں نے تمہیں ذی الحجہ کے دن نصیحت کی''", tr: "Amr ibn Ma'di Karb'ın Kays ibn Makshouh'a yazdığı şiiri: 'Zul Sana'a Günü'nde sana emrettim'", id: "Puisi Amr ibn Ma'di Karb kepada Qays ibn Makshouh: 'Aku memerintahkanmu pada Hari Dhu Sana'a'" }
summary:
  ar: "قصيدة على روي الدال قالها عمرو بن معدي كرب حين أوعده قيس بن مكشوح لأنه خالفه وأتى النبي: يذكّره بأنه أمره يوم ذي صنعاء أمراً بيّناً رشده وبتقوى الله والمعروف فخرج من المنى كحمار غرّه وتده، ثم يتوعده بأنه إن لاقاه لقي ليثاً فوقه لبده. أنشد ابن هشام عن أبي عبيدة ثلاثة أبيات منها برواية أخرى ولم يعرف سائرها."
  en: "A dal-rhymed poem Amr ibn Ma'dikarib composed when Qays ibn Makshuh threatened him for defying him and going to the Prophet: he reminds Qays that on the day of Dhu San'a' he had counselled him clearly, to fear God and do good, but Qays like a donkey was fooled by its tether; then he threatens that whoever meets him meets a maned lion. Ibn Hisham gives Abu Ubayda's reading of three lines and says Abu Ubayda did not know the rest."
  es: "Un poema con rima dal que Amr ibn Ma'dikarib compuso cuando Qays ibn Makshuh lo amenazó por desafiarlo e ir al Profeta: le recuerda a Qays que el día de Dhu San'a' le había aconsejado claramente que temiera a Dios y obrara bien, pero Qays, como un asno, se dejó engañar por su atadura; luego lo amenaza con que quien se encuentre con él se encontrará con un león de crin. Ibn Hisham cita la lectura de Abu Ubayda de tres versos y dice que Abu Ubayda desconocía el resto."
  fr: "Amr ibn Ma'dikarib composa un poème en rimes dal lorsque Qays ibn Makshuh le menaça pour l'avoir défié en allant trouver le Prophète. Il rappela à Qays que, le jour de Dhu San'a', il l'avait clairement exhorté à craindre Dieu et à faire le bien, mais que Qays, tel un âne, s'était laissé prendre à ses chaînes. Il le menaça alors: quiconque le croiserait affronterait un lion à crinière. Ibn Hisham rapporte la lecture de trois vers par Abu Ubayda et précise qu'Abu Ubayda ignorait la suite."
  ur: "عمرو بن معدکریب نے ایک دال والی نظم لکھی جب قیس بن مکشوح نے اسے دھمکی دی کہ وہ اس کی مخالفت کرنے اور پیغمبر کے پاس جانے کی دھمکی دیتے ہیں: وہ قیس کو یاد دلاتا ہے کہ ذی صنعاء کے دن اس نے اسے واضح طور پر نصیحت کی تھی کہ خدا سے ڈرو اور نیکی کرو، لیکن قیس کو گدھے کی طرح بے وقوف بنایا گیا تھا۔ پھر وہ دھمکی دیتا ہے کہ جو بھی اس سے ملے گا وہ ایک آوارہ شیر سے ملے گا۔ ابن ہشام نے ابو عبیدہ کی تین سطریں پڑھی ہیں اور کہا ہے کہ ابو عبیدہ باقی نہیں جانتے تھے۔"
  tr: "Amr bin Ma'di Karb'ın Kays ibn Ma'di Karb'ın ona karşı çıkıp Peygamber'e geldiği için ona söz verdiği 'dal' anlatımına dayanan bir şiir: Ona Dhu Sana'a gününde açık bilgelik, Allah'ın takvası ve iyiliğiyle emredildiğini hatırlattı. Mina'yı kazığa kandırılmış bir eşek gibi terk etti, sonra onunla karşılaşırsa üstünde bir aslan bulacağını tehdit etti. İbn Hisham, Ebu Ubeyde'den üç ayet okudu, bunlardan biri başka bir rivayette de yer aldı, ancak geri kalan bilinmemektedir."
  id: "Sebuah puisi berdasarkan riwayat 'dal' yang dibacakan oleh Amr ibn Ma'di Karb ketika Qays ibn Makshuh berjanji kepadanya karena ia menentangnya dan datang kepada Nabi: Ia mengingatkan bahwa ia telah diperintahkan pada hari Dhu Sana'a dengan kebijaksanaan yang jelas, kesalehan Allah, dan kebaikan. Ia meninggalkan Mina seperti keledai yang tertipu oleh tiangnya, lalu mengancam bahwa jika bertemu dengannya, ia akan menemukan seekor singa di atasnya untuk menutupinya. Ibn Hisham membacakan tiga ayat dari Abu Ubaidah, termasuk satu dalam riwayat lain, tetapi sisanya tidak diketahui."
