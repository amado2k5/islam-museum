label: { ar: "منهاج الكرامة في معرفة الإمامة", en: "Minhaj al-Karamah fi Ma'rifat al-Imamah", ur: "منہاج الکرامۃ فی معرفۃ الامامۃ", es: "Minhaj al-Karamah fi Ma'rifat al-Imamah", fr: "Minhaj al-Karamah fi Ma'rifat al-Imamah", tr: "İmamatı Tanımada Onur Yöntemi", id: "Metode Martabat dalam Mengenal Immamate" }
summary:
  ar: "رسالة في الإمامة على مذهب الإمامية الاثني عشرية لابن المطهر الحلي، صنفها للملك الإيلخاني أولجايتو خدابنده، في مقدمة وستة فصول: المذاهب في الإمامة، ووجوب اتباع مذهب الإمامية، وأدلة إمامة علي، وإمامة الاثني عشر، وإبطال خلافة من تقدم علياً، والرد على حجج إمامة أبي بكر؛ وصلت إلى المتحف من خلال نقول ابن تيمية في رده «منهاج السنة النبوية»."
  en: "A treatise on the imamate according to the Twelver Imami school by Ibn al-Mutahhar al-Hilli, composed for the Ilkhan Öljeitü Khudabanda, in an introduction and six chapters: the positions on the imamate, why the Imami school must be followed, the proofs of Ali's imamate, the imamate of the Twelve, the invalidity of the caliphates before Ali, and a reply to the arguments for Abu Bakr; known in the museum so far through the passages Ibn Taymiyya quotes in his reply, Minhaj al-Sunna al-Nabawiyya."
  es: "Un tratado sobre el imamato según la escuela imamí duodecimana de Ibn al-Mutahhar al-Hilli, compuesto para el Ilkhan Öljeitü Khudabanda, en una introducción y seis capítulos: las posturas sobre el imamato, por qué debe seguirse la escuela imamí, las pruebas del imamato de Ali, el imamato de los Doce, la invalidez de los califatos anteriores a Ali y una respuesta a los argumentos a favor de Abu Bakr; conocido en el museo hasta ahora a través de los pasajes que Ibn Taymiyya cita en su respuesta, Minhaj al-Sunna al-Nabawiyya."
  fr: "Traité sur l'imamat selon l'école duodécimaine imamite par Ibn al-Mutahhar al-Hilli, composé pour l'Ilkhan Öljeitü Khudabanda, en une introduction et six chapitres: les positions sur l'imamat, pourquoi l'école imamite doit être suivie, les preuves de l'imamat d'Ali, l'imamat des Douze, l'invalidité des califats antérieurs à Ali et une réponse aux arguments en faveur d'Abu Bakr; connu jusqu'à présent au musée par les passages cités par Ibn Taymiyya dans sa réponse, Minhaj al-Sunna al-Nabawiyya."
  ur: "امامت پر ایک مقالہ بارہ امامی مکتب کے مطابق ابن المطہر ہلی کی طرف سے الخان الجیتو خدابندہ کے لیے تحریر کیا گیا ہے، ایک تعارف اور چھ ابواب میں: امامت کے مقام، امامی مکتب کی پیروی کیوں کی جائے، علی کی امامت کے ثبوت، ولیعہدیت سے پہلے امامت کے ثبوت۔ علی، اور ابوبکر کے دلائل کا جواب؛ عجائب گھر میں اب تک ان اقتباسات کے ذریعے جانا جاتا ہے جو ابن تیمیہ نے اپنے جواب میں نقل کیے ہیں، منہاج السنۃ النبویہ۔"
  tr: "İbn el-Mutahhar el-Hilli tarafından On İki İmam okuluna göre İmalık üzerine bir inceleme, İlhanlı kralı Oljeitu Hodabandeh için yazılmıştır; giriş ve altı bölümden oluşur: İmam okulları, İmamiyye okulunu takip etme zorunluluğu, Ali'nin İmamıtı'nın kanıtları, On İki İmamı, Ali'den önceki halifeliğin iptali ve Ebu Bekir'in İmamı'nın argümanlarının çürütülmesi; İbn Teymiyye'nin \"Minhaj al-Sunnah al-Nabawiyyah\" adlı çürütme metniyle müzeye ulaşmıştır."
  id: "Sebuah risalah tentang Imamate menurut mazhab Imamiyya Dua Belas oleh Ibn al-Mutahhar al-Hilli, yang ditulis untuk raja Ilkhanid Oljeitu Khodabandeh, dalam pengantar dan enam bab: aliran pemikiran dalam Imamat, kewajiban mengikuti mazhab Imamiyyah, bukti Imamat Ali, Dua Belas Imamat, pembatalan kekhalifahan mereka yang mendahului Ali, dan penolakan argumen Imamat Abu Bakr; sampai ke museum melalui kutipan Ibn Taymiyyah dalam bantahannya \"Minhaj al-Sunnah al-Nabawiyyah.\""
