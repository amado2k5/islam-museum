summary:
  ar: "رسالة في الإمامة على مذهب الإمامية الاثني عشرية لابن المطهر الحلي، صنفها للملك الإيلخاني أولجايتو خدابنده، في مقدمة وستة فصول: المذاهب في الإمامة، ووجوب اتباع مذهب الإمامية، وأدلة إمامة علي، وإمامة الاثني عشر، وإبطال خلافة من تقدم علياً، والرد على حجج إمامة أبي بكر؛ وصلت إلى المتحف من خلال نقول ابن تيمية في رده «منهاج السنة النبوية»."
  en: "A treatise on the imamate according to the Twelver Imami school by Ibn al-Mutahhar al-Hilli, composed for the Ilkhan Öljeitü Khudabanda, in an introduction and six chapters: the positions on the imamate, why the Imami school must be followed, the proofs of Ali's imamate, the imamate of the Twelve, the invalidity of the caliphates before Ali, and a reply to the arguments for Abu Bakr; known in the museum so far through the passages Ibn Taymiyya quotes in his reply, Minhaj al-Sunna al-Nabawiyya."
