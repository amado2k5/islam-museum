structure: "Introduction (the imamate as the most important matter of religion), then chapters on: (1) the Imami and Sunni positions; (2) why the Imami school must be followed; (3) the proofs of Ali's imamate in four methods (rational, Qur'an, Sunna, his states); (4) the Twelve; (5) that those before Ali were not imams; (6) the arguments for Abu Bakr's imamate — as reported and quoted in Minhaj al-Sunna."
