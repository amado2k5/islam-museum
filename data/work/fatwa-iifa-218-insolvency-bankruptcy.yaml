label: { ar: "قرار مجمع الفقه الإسلامي الدولي 218 (23/2) بشأن أحكام الإعسار والإفلاس في الشريعة الإسلامية والأنظمة المعاصرة ⁦(استكمال ما سبق)⁩", en: "IIFA resolution 218 (23/2) on the rulings of insolvency and bankruptcy in Islamic sharia and contemporary systems (continuation of the preceding)", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 218 (23/2): شریعتِ اسلامی اور عصری نظاموں میں اعسار اور دیوالیہ پن کے احکام — سابقہ قرارداد کا تکملہ", es: "Resolución 218 (23/2) de la IIFA sobre las resoluciones de insolvencia y quiebra en la sharia islámica y los sistemas contemporáneos (continuación de la anterior)", fr: "Résolution 218 (23/2) de l'IIFA sur les décisions en matière d'insolvabilité et de faillite dans la charia islamique et les systèmes contemporains (suite de la précédente)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 218 (23/2) İslami Şeriat ve güncel sistemlerde iflas ve iflas kararlarına ilişkin (yukarıdakilerin tamamlanması)", id: "Resolusi Akademi Fiqh Islam Internasional 218 (23/2) mengenai putusan kepailitan dan kebangkrutan dalam sistem Syariah Islam dan masa kini (penyelesaian yang di atas)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩⁩ بعد اطلاعه على توصيات ندوة علمية عقدها المجمع بجدة بالتعاون مع المعهد الإسلامي للبحوث والتدريب التابع لمجموعة البنك الإسلامي للتنمية ⁦⁦(31 نوفمبر – 1 ديسمبر 2017م)⁩⁩. قرر المجمع تأكيد ما ورد في قراره 186 ⁦(20/1)⁩ فقرة ⁦(1)⁩ من تعريف الإعسار والمدين المعسر مع مراعاة العرف في تحديد تطبيقاته؛ وتأكيد ضابط الإفلاس الوارد في الفقرة ⁦(2)⁩ مع مراعاة أن الإفلاس لا يكون إلا بحكم قضائي وأن أحكامه تجري على الشخص الطبيعي والاعتباري على السواء. ومن مسائل الإعسار والإفلاس في المؤسسات المالية الإسلامية: التعثر عن السداد إعسار ولا يعد إفلاسًا شرعًا إذا كانت أصول المؤسسة أو الشركة تفي بديونها، وللدائن اللجوء إلى القضاء لإصدار حكم بالتفليس وللشركة المدينة اللجوء إلى القضاء لإلزام الدائنين بالإنظار. ومن الحلول المقترحة لمعالجة إعسار الشركات والمؤسسات المالية الإسلامية: بذل أصل مالي معين أو منفعة عين معينة لسداد الدين المستحق؛ وتحويل الديون إلى أسهم ⁦⁦(رسملة)⁩⁩ بزيادة رأس مال الشركة المدينة بإصدار أسهم عادية يساهم فيها الدائن بدينه المستحق فيصبح مالكًا لحصة في الشركة وموجوداتها بمقدار دينه؛ واتفاق الشركة المدينة مع الدائن على الإنظار حسبما تراه جهة خبيرة معتمدة بتقدير أوضاعها مع تحديد شروط الإنظار إن لزم. وأوصى المجلس بدراسات موسعة للحلول العملية لمعالجة التعثر في المؤسسات المالية حفظًا لحقوق الأطراف؛ وبسن أنظمة وقوانين تحمي المتعاملين مع الشركة دائنين ومدينين؛ وبعناية الجهات القضائية بالمبادئ القضائية المواكبة للتطورات المعاصرة؛ وأوصى أمانة المجمع باستكمال دراسة أثر الإعسار والإفلاس على الشركات ذات المسؤولية المحدودة بما فيها حالة إعسار أو إفلاس الشركة مع كون مالكها الرئيس ما زال موسرًا."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), after reviewing recommendations of a scholarly seminar it held in Jeddah with the Islamic Research and Training Institute of the Islamic Development Bank Group (31 November – 1 December 2017). It reaffirmed its resolution 186 (20/1), clause 1, on the definition of insolvency and the insolvent debtor, custom being observed in determining its applications; and reaffirmed clause 2 on the criterion of bankruptcy, noting that bankruptcy exists only by judicial ruling and that its rulings apply to natural and juridical persons alike. Among the questions of insolvency and bankruptcy in Islamic financial institutions: default on payment is insolvency and is not bankruptcy in the legal sense so long as the institution's or company's assets cover its debts; the creditor may resort to the courts for a bankruptcy ruling, and the debtor company may resort to them to oblige creditors to grant respite. Proposed solutions for insolvency (default) of Islamic companies and financial institutions include: tendering a specified financial asset or the usufruct of a specified object in settlement of the due debt; converting debts into shares (capitalisation) by increasing the debtor company's capital through issuing ordinary shares in which the creditor participates with his due debt, becoming owner of a share in the company and its assets to the measure of the debt; and agreement between the debtor company and the creditor on respite as an accredited expert body sees fit in assessing the company's situation, setting the respite's terms if needed. It recommended expanded studies of practical solutions for treating default in financial institutions preserving all parties' rights; enacting systems and laws protecting the company's creditors and debtors; attention by judicial bodies to judicial principles keeping pace with contemporary developments; and that the Academy's secretariat complete studying the effect of insolvency and bankruptcy on limited-liability companies, including the case of the company's insolvency or bankruptcy while its principal owner remains solvent."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩⁩ میں، جدہ میں اکیڈمی کی اسلامی ترقیاتی بینک گروپ کے اسلامی ریسرچ اینڈ ٹریننگ انسٹیٹیوٹ کے تعاون سے منعقدہ علمی سیمینار ⁦⁦(31 نومبر – 1 دسمبر 2017ء)⁩⁩ کی سفارشات کا مطالعہ کے بعد۔ اکیڈمی نے اپنی قرارداد 186 ⁦(20/1)⁩ کی دفعہ ⁦(1)⁩ میں اعسار اور معسر مقروض کی تعریف کی تائید کی اور اس کے اطلاق میں عرف کے لحاظ کی ہدایت کی؛ اور دفعہ ⁦(2)⁩ میں دیوالیہ پن کے ضابطے کی تائید کی اس بات کے ساتھ کہ دیوالیہ پن صرف عدالتی حکم سے ہوتا ہے اور اس کے احکام فطری اور حکمی شخصیات دونوں پر یکساں جاری ہوتے ہیں۔ اسلامی مالی اداروں میں اعسار و دیوالیہ پن کے مسائل میں: ادائیگی سے تعثر اعسار ہے اور شرعی لحاظ سے دیوالیہ پن نہیں جب تک ادارے یا کمپنی کے اثاثے اس کے قرضوں کو پورا کریں؛ قرض خواہ عدالت سے دیوالیہ پن کا حکم لے سکتا ہے اور مقروض کمپنی عدالت سے قرض خواہوں کو التوا پر مجبور کرا سکتی ہے۔ اسلامی کمپنیوں اور مالی اداروں کے تعثر کے مقترح حل: واجب الادا قرض کی تسویہ کے لیے کوئی معین مالی اثاثہ یا کسی معین شے کا منفعت دینا؛ قرضوں کا حصص میں تبدیل کرنا ⁦⁦(سرمایہ کاری)⁩⁩ یعنی مقروض کمپنی کے سرمائے میں عام حصص جاری کر کے اضافہ جس میں قرض خواہ اپنے قرض سے حصہ لے اور کمپنی و اثاثوں میں اپنے قرض کے برابر مالک بن جائے؛ اور مقروض کمپنی اور قرض خواہ کا التوا پر اتفاق کسی مستند ماہر ادارے کی اندازہ گری کے مطابق اور ضرورت ہو تو التوا کی شرائط مقرر کرنا۔ سفارشات: مالی اداروں میں تعثر کے عملی حل کے وسیع مطالعے تمام فریقوں کے حقوق کے تحفظ کے لیے؛ کمپنی کے قرض خواہوں اور مقروضوں کے تحفظ کے قوانین کا وضع کرنا؛ عدالتی اداروں کی طرف سے عصری ترقیات سے ہم آہنگ عدالتی اصولوں کی عنايت؛ اور اکیڈمی کے سیکرٹریٹ سے محدود ذمہ داری والی کمپنیوں پر اعسار و دیوالیہ پن کے اثرات کا مطالعہ مکمل کرنے کی درخواست — اس صورت سمیت جب کمپنی معسر یا دیوالیہ ہو مگر اس کا اصل مالک اب بھی مومن۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018), después de revisar las recomendaciones de un seminario académico que celebró en Jeddah con el Instituto Islámico de Investigación y Capacitación del Grupo del Banco Islámico de Desarrollo (31 de noviembre - 1 de diciembre de 2017). Reafirmó su resolución 186 (20/1), cláusula 1, sobre la definición de insolvencia y deudor insolvente, observándose la costumbre para determinar sus aplicaciones; y reafirmó la cláusula 2 sobre el criterio de quiebra, señalando que la quiebra existe solo por resolución judicial y que sus resoluciones se aplican tanto a personas físicas como jurídicas. Entre las cuestiones de insolvencia y quiebra en las instituciones financieras islámicas: el impago es insolvencia y no quiebra en el sentido legal siempre que los activos de la institución o empresa cubran sus deudas; El acreedor puede recurrir a los tribunales para obtener una resolución de quiebra, y la empresa deudora puede recurrir a ellos para obligar a los acreedores a conceder una prórroga. Las soluciones propuestas para la insolvencia (incumplimiento) de las empresas e instituciones financieras islámicas incluyen: ofrecer un activo financiero específico o el usufructo de un objeto específico en liquidación de la deuda vencida; convertir deudas en acciones (capitalización) aumentando el capital de la empresa deudora a través de la emisión de acciones ordinarias en las que el acreedor participa con su deuda vencida, convirtiéndose en propietario de una acción en la empresa y sus activos en medida de la deuda; y acuerdo entre la empresa deudora y el acreedor sobre la prórroga según lo considere oportuno un organismo experto acreditado al evaluar la situación de la empresa, estableciendo los términos de la prórroga si fuera necesario. Se recomendó ampliar los estudios de soluciones prácticas para tratar el incumplimiento en las instituciones financieras preservando los derechos de todas las partes; promulgar sistemas y leyes que protejan a los acreedores y deudores de la empresa; atención por parte de los órganos judiciales a los principios judiciales que se mantengan al día con los desarrollos contemporáneos; y que la secretaría de la Academia complete el estudio del efecto de la insolvencia y la quiebra en las sociedades de responsabilidad limitada, incluido el caso de la insolvencia o quiebra de la empresa mientras su propietario principal siga siendo solvente."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018), après examen des recommandations d'un séminaire scientifique organisé à Djeddah conjointement avec l'Institut islamique de recherche et de formation du Groupe de la Banque islamique de développement (31 novembre – 1er décembre 2017). Elle a réaffirmé sa résolution 186 (20/1), point 1, relative à la définition de l'insolvabilité et du débiteur insolvable, la pratique étant prise en compte pour son application; et a réaffirmé le point 2 relatif aux critères de faillite, précisant que la faillite résulte d'une décision judiciaire et que cette décision s'applique aussi bien aux personnes physiques qu'aux personnes morales. Concernant les questions d'insolvabilité et de faillite dans les institutions financières islamiques: le défaut de paiement constitue une insolvabilité et non une faillite au sens juridique du terme tant que l'actif de l'institution ou de la société couvre ses dettes. Le créancier peut saisir les tribunaux pour obtenir une décision de faillite, et l'entreprise débitrice peut également s'adresser à eux pour contraindre ses créanciers à lui accorder un délai de grâce. Parmi les solutions proposées en cas d'insolvabilité (défaut de paiement) des entreprises et institutions financières islamiques figurent: l'apport d'un actif financier spécifique ou l'usufruit d'un bien déterminé en règlement de la dette; la conversion des dettes en actions (capitalisation) par l'augmentation du capital de l'entreprise débitrice via l'émission d'actions ordinaires auxquelles le créancier participe avec sa créance, devenant ainsi actionnaire de l'entreprise et de ses actifs à hauteur de sa dette; et un accord de délai de grâce entre l'entreprise débitrice et le créancier, conclu après évaluation de la situation de l'entreprise par un organisme expert agréé, qui fixe les modalités du délai de grâce si nécessaire. Il est recommandé d'approfondir les études sur les solutions pratiques pour traiter le défaut de paiement des institutions financières en préservant les droits de toutes les parties; de mettre en place des systèmes et des lois protégeant les créanciers et les débiteurs de l'entreprise; et d'assurer, par les instances judiciaires, une attention particulière aux principes juridiques afin de les adapter aux évolutions contemporaines. et que le secrétariat de l'Académie achève l'étude des effets de l'insolvabilité et de la faillite sur les sociétés à responsabilité limitée, y compris le cas de l'insolvabilité ou de la faillite de la société alors que son principal propriétaire reste solvable."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Safar 1440H, 28 Ekim – 1 Kasım 2018) toplu kararı, Akademi'nin İslam Kalkınma Bankası Grubu'na bağlı İslami Araştırma ve Eğitim Enstitüsü iş birliğiyle Cidde'de düzenlenen bilimsel seminerin önerilerini inceledikten sonra (31 Kasım – 1 Aralık 2017). Akademi, başvurularını belirlemede geleneği dikkate alarak, iflas ve iflas etmiş borçlu tanımına ilişkin 186 (20/1) sayılı kararının paragraf (1) hükümlerini onaylamaya; ve iflasın ancak yargı kararıyla gerçekleşebileceğini ve hükümlerinin hem gerçek hem tüzel kişilere eşit uygulandığını dikkate alarak (2) paragrafında belirtilen iflas kriterini onaylamaya karar verdi. İslami finans kurumlarında iflas ve iflas konuları arasında: ödeme temerrüdü iflas etmekte olup, kurum veya şirketin varlıkları borçlarını karşılıyorsa iflas sayılmaz. Alacaklı, iflas kararı vermek için yargıya başvurabilir ve borçlu şirket alacaklıları bu karara uymaya zorlamak için mahkemeye başvurabilir. İslami şirketlerin ve finansal kurumların iflasını ele almak için önerilen çözümler şunlardır: borç ödemek için belirli bir finansal varlık veya özel bir avantaj tanınması; borçların hisseye dönüştürülmesi (sermayelendirilmesi) ve alacaklının borç payını artırarak şirketin sermayesini artırarak alacaklının borç payını artırarak şirketin ve varlıklarının hissesinin sahibi olması; ve borçlu şirketin, uzman yetkili bir kuruluş tarafından gerekli görüldüğünde statüsünü değerlendirmesi ve gerekirse geri ödeme koşullarını belirtmesi yer alır. Kurul, finansal kurumlardaki temerrütleri ele almak için taraf haklarını korumak için pratik çözümler üzerine kapsamlı çalışmalar önerdi; şirketle ilgilenenleri, hem alacaklıları hem borçluları koruyacak düzenlemeler ve yasalar çıkarma; çağdaş gelişmelerle uyumlu yargı ilkelerine uyulması; ve Yönetim Kurulu Sekreterliği'nin, şirketin asıl sahibi mali olduğu sürece şirketin iflas veya iflas durumları da dahil olmak üzere sınırlı sorumluluk şirketleri üzerindeki etkisi üzerine çalışmayı tamamlamasını tavsiye etti."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Sabat 1440H, 28 Oktober – 1 November 2018) setelah meninjau rekomendasi seminar ilmiah yang diadakan oleh Akademi di Jeddah bekerja sama dengan Institut Penelitian dan Pelatihan Islam yang berafiliasi dengan Kelompok Bank Pembangunan Islam (31 November – 1 Desember 2017). Akademi memutuskan untuk menegaskan ketentuan keputusan 186 (20/1), paragraf (1), mengenai definisi kepailitan dan debitur insolvensi, dengan mempertimbangkan kebiasaan dalam menentukan permohonannya; dan untuk menegaskan kriteria kebangkrutan yang disebutkan dalam paragraf (2), dengan mempertimbangkan bahwa kebangkrutan hanya dapat terjadi melalui putusan yudisial dan bahwa ketentuannya berlaku sama untuk orang perseorangan maupun badan hukum. Di antara masalah kepailitan dan kebangkrutan di lembaga keuangan Islam: gagal membayar adalah kepailitan dan tidak dianggap bangkrut menurut hukum Islam jika aset lembaga atau perusahaan memenuhi utangnya. Kreditur dapat menggunakan pengadilan untuk mengeluarkan putusan kebangkrutan, dan perusahaan debitur dapat mengajukan permohonan ke pengadilan untuk memaksa kreditur mematuhi keputusan. Solusi yang diusulkan untuk mengatasi kebangkrutan perusahaan dan lembaga keuangan Islam meliputi: memberikan aset keuangan tertentu atau manfaat khusus untuk melunasi utang yang terutang; mengubah utang menjadi saham (kapitalisasi) dengan meningkatkan modal perusahaan debitur dengan menerbitkan saham biasa di mana kreditur menyumbangkan utang yang terbayar, sehingga menjadi pemilik saham perusahaan dan asetnya sesuai dengan utangnya; dan perusahaan debitur sepakat dengan kreditur untuk menilai statusnya sesuai dengan badan terakreditasi ahli, dengan menentukan syarat pelunasan jika diperlukan. Dewan merekomendasikan studi ekstensif tentang solusi praktis untuk mengatasi gagal bayar di lembaga keuangan guna melindungi hak-hak pihak; mengesahkan peraturan dan undang-undang untuk melindungi pihak yang berurusan dengan perusahaan, baik kreditur maupun debitur; mematuhi prinsip yudisial yang mengikuti perkembangan kontemporer; dan merekomendasikan agar Sekretariat Dewan menyelesaikan studi tentang dampak kepailitan dan kebangkrutan terhadap perusahaan terbatas, termasuk kasus kebangkrutan atau kebangkrutan perusahaan selama pemilik utamanya masih solvabel."
