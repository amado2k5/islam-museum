summary:
  ar: "تفسير الحسين بن مسعود البغوي ⁦(ت 516هـ)⁩، المعروف بتفسير البغوي؛ ألّفه إجابة لسؤال جماعة من أصحابه، وجعله وسطًا بين الطويل الممل والقصير المخل، يفسر القرآن بالقرآن والحديث والأثر بإسناده، ويعنى بالقراءات والأحكام، ويعرض رأي أهل السنة وينتصر له مع ذكر آراء مخالفيهم."
  en: "The Qur'an commentary of al-Husayn ibn Mas'ud al-Baghawi (d. 516 AH), known as Tafsir al-Baghawi; written at the request of a group of his companions as a middle course between the tediously long and the deficiently short, it explains the Qur'an by the Qur'an, hadith and reports with his own chains, attends to readings and legal rulings, and sets out and defends the Sunni view while recording its opponents' views."
  ur: "حسین بن مسعود البغوی ⁦(م 516ھ)⁩ کی تفسیر، جو تفسیرِ بغوی کے نام سے معروف ہے؛ انہوں نے اسے اپنے ساتھیوں کی ایک جماعت کی درخواست پر لکھا، طویل اکتا دینے والی اور مختصر ناقص تفسیر کے درمیان، جس میں قرآن کی تفسیر قرآن، حدیث اور آثار سے اپنی اسناد کے ساتھ، قراءتوں اور احکام کا اہتمام، اور اہلِ سنت کی رائے کا بیان و دفاع مخالفین کی آرا کے ذکر کے ساتھ ہے۔"
  es: "El comentario del Corán de al-Husayn ibn Mas'ud al-Baghawi (fallecido en el año 516 de la Hégira), conocido como Tafsir al-Baghawi, fue escrito a petición de un grupo de sus compañeros como un término medio entre lo tediosamente largo y lo deficientemente corto. Explica el Corán a partir del propio Corán, los hadices y los relatos con sus propias cadenas de transmisión, presta atención a las lecturas y las normas legales, y expone y defiende la visión sunita al tiempo que registra las opiniones de sus oponentes."
  fr: "Le commentaire du Coran d'al-Husayn ibn Mas'ud al-Baghawi (mort en 516 AH), connu sous le nom de Tafsir al-Baghawi; écrit à la demande d'un groupe de ses compagnons comme un juste milieu entre les ouvrages excessivement longs et les ouvrages insuffisamment courts, il explique le Coran par le Coran lui-même, les hadiths et les récits avec ses propres chaînes de transmission, aborde les lectures et les décisions juridiques, et expose et défend le point de vue sunnite tout en consignant les points de vue de ses opposants."
