summary:
  ar: "تفسير الحسين بن مسعود البغوي ⁦(ت 516هـ)⁩، المعروف بتفسير البغوي؛ ألّفه إجابة لسؤال جماعة من أصحابه، وجعله وسطًا بين الطويل الممل والقصير المخل، يفسر القرآن بالقرآن والحديث والأثر بإسناده، ويعنى بالقراءات والأحكام، ويعرض رأي أهل السنة وينتصر له مع ذكر آراء مخالفيهم."
  en: "The Qur'an commentary of al-Husayn ibn Mas'ud al-Baghawi (d. 516 AH), known as Tafsir al-Baghawi; written at the request of a group of his companions as a middle course between the tediously long and the deficiently short, it explains the Qur'an by the Qur'an, hadith and reports with his own chains, attends to readings and legal rulings, and sets out and defends the Sunni view while recording its opponents' views."
  ur: "حسین بن مسعود البغوی ⁦(م 516ھ)⁩ کی تفسیر، جو تفسیرِ بغوی کے نام سے معروف ہے؛ انہوں نے اسے اپنے ساتھیوں کی ایک جماعت کی درخواست پر لکھا، طویل اکتا دینے والی اور مختصر ناقص تفسیر کے درمیان، جس میں قرآن کی تفسیر قرآن، حدیث اور آثار سے اپنی اسناد کے ساتھ، قراءتوں اور احکام کا اہتمام، اور اہلِ سنت کی رائے کا بیان و دفاع مخالفین کی آرا کے ذکر کے ساتھ ہے۔"
