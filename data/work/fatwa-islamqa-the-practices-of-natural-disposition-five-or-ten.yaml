id: work/fatwa-islamqa-the-practices-of-natural-disposition-five-or-ten
class: work
kind: fatwa
label: { ar: "هل سنن الفطرة خمس أم عشر، وما هي؟", en: "Are the practices of natural disposition (sunan al-fitra) five or ten, and what are they?", ur: "سننِ فطرت پانچ ہیں یا دس، اور وہ کیا ہیں؟" }
summary:
  ar: "سؤال عن الجمع بين حديث أبي هريرة أن خصال الفطرة خمس وحديث عائشة أنها عشر، وعن تعداد خصال الفطرة كاملة مع حكم كل خصلة، أجاب فيه موقع الإسلام سؤال وجواب بأن العدد في الحديث ليس للحصر ومفهومه غير معتبر، كما قال النووي وابن دقيق العيد، وأن حديث عائشة اختُلف في رفعه وأعلّه أحمد والنسائي والدارقطني فالمحفوظ أنه من قول طلق بن حبيب، مع حديث عمار بن ياسر عند أحمد وأبي داود، وأن مجموع الخصال الواردة خمس عشرة كما قال ابن حجر: الختان والاستحداد وتقليم الأظفار ونتف الإبط وقص الشارب وإعفاء اللحية والسواك والمضمضة والاستنشاق والاستنثار وغسل البراجم وحلق العانة والاستنجاء والانتضاح وفرق الرأس. ثم فصّل حكم كل خصلة: فالختان واجب على الرجال مكرمة للنساء عند ابن قدامة وابن عثيمين ويسقط بخوف الهلاك، والاستحداد وتقليم الأظفار ونتف الإبط وقص الشارب سنن متفق عليها مع من أوجب القص كابن حزم وابن العربي وابن القيم، وإعفاء اللحية واجب يحرم حلقها عند الجمهور، والسواك سنة بالإجماع، وغسل البراجم مستحب، والمضمضة والاستنشاق واجبان في الوضوء عند الحنابلة وابن تيمية، والاستنثار سنة، والاستنجاء واجب عند الجمهور، والانتضاح مستحب لمن يُبتلى بالوسواس، والفرق سنة أولى من السدل عند ابن عبد البر، وأن ترك هذه الخصال فوق أربعين يومًا مكروه عند الشافعية والحنابلة ومحرم عند الحنفية واختاره الشوكاني وابن باز."
  en: "A question about reconciling Abu Hurayra's hadith that the practices of natural disposition are five with Aisha's hadith that they are ten, and about listing them all with the ruling on each; IslamQA answered that the number in the hadith is not a limit and its implication is not binding, as al-Nawawi and Ibn Daqiq al-Id say; that Aisha's hadith is disputed as to whether it is traced to the Prophet, Ahmad, al-Nasa'i and al-Daraqutni having faulted it so that the preserved version is a saying of Talq ibn Habib, alongside the hadith of Ammar ibn Yasir in Ahmad and Abu Dawud; and that the practices mentioned in the hadiths total fifteen, as Ibn Hajar says: circumcision, shaving the pubic hair, trimming the nails, plucking the armpits, trimming the moustache, letting the beard grow, the tooth-stick, rinsing the mouth, sniffing water into the nose, expelling it, washing the finger joints, shaving the pubes, cleansing after relieving oneself, sprinkling water, and parting the hair. It then set out the ruling on each: circumcision is obligatory for men and an honour for women according to Ibn Qudama and Ibn Uthaymin, lapsing where death is feared; shaving the pubic hair, trimming the nails, plucking the armpits and trimming the moustache are agreed Sunna practices, though Ibn Hazm, Ibn al-Arabi and Ibn al-Qayyim held trimming obligatory; letting the beard grow is obligatory and shaving it forbidden according to the majority; the tooth-stick is Sunna by consensus; washing the finger joints is recommended; rinsing the mouth and sniffing water are obligatory in ablution according to the Hanbalis and Ibn Taymiyya; expelling the water is Sunna; cleansing after relieving oneself is obligatory according to the majority; sprinkling is recommended for one troubled by doubts; parting the hair is Sunna and better than letting it hang according to Ibn Abd al-Barr; and leaving these practices beyond forty days is disliked according to the Shafi'is and Hanbalis and forbidden according to the Hanafis, a view chosen by al-Shawkani and Ibn Baz."
  ur: "ابو ہریرہ کی حدیث کہ فطرت کی خصلتیں پانچ ہیں اور عائشہ کی حدیث کہ وہ دس ہیں کے درمیان تطبیق، اور تمام خصلتوں کی فہرست اور ہر ایک کے حکم کے بارے میں سوال؛ اسلام سوال و جواب نے جواب دیا کہ حدیث میں عدد حصر کے لیے نہیں اور اس کا مفہوم معتبر نہیں، جیسا کہ نووی اور ابن دقیق العید نے کہا؛ عائشہ کی حدیث کے مرفوع ہونے میں اختلاف ہے، احمد، نسائی اور دارقطنی نے اس پر اعتراض کیا، لہٰذا محفوظ یہ ہے کہ یہ طلق بن حبیب کا قول ہے، احمد اور ابو داود کے پاس عمار بن یاسر کی حدیث کے ساتھ؛ اور احادیث میں وارد خصلتوں کا مجموعہ پندرہ ہے جیسا کہ ابن حجر نے کہا: ختنہ، زیرِ ناف بال مونڈنا، ناخن تراشنا، بغل کے بال اکھاڑنا، مونچھ کاٹنا، داڑھی بڑھانا، مسواک، کلی، ناک میں پانی ڈالنا، ناک جھاڑنا، انگلیوں کے جوڑ دھونا، زیرِ ناف مونڈنا، استنجا، پانی چھڑکنا اور سر میں مانگ نکالنا۔ پھر اس نے ہر خصلت کا حکم بیان کیا: ختنہ ابن قدامہ اور ابن عثیمین کے نزدیک مردوں پر واجب اور عورتوں کے لیے اعزاز ہے اور ہلاکت کے خوف پر ساقط ہوتا ہے؛ زیرِ ناف بال مونڈنا، ناخن تراشنا، بغل کے بال اکھاڑنا اور مونچھ کاٹنا متفقہ سنتیں ہیں، گو ابن حزم، ابن العربی اور ابن القیم نے کاٹنے کو واجب کہا؛ داڑھی بڑھانا جمہور کے نزدیک واجب اور مونڈنا حرام ہے؛ مسواک بالاجماع سنت ہے؛ انگلیوں کے جوڑ دھونا مستحب ہے؛ کلی اور ناک میں پانی ڈالنا حنابلہ اور ابن تیمیہ کے نزدیک وضو میں واجب ہیں؛ ناک جھاڑنا سنت ہے؛ استنجا جمہور کے نزدیک واجب ہے؛ پانی چھڑکنا وسوسے کے مبتلا کے لیے مستحب ہے؛ مانگ نکالنا سنت ہے اور ابن عبد البر کے نزدیک بال لٹکانے سے بہتر ہے؛ اور ان خصلتوں کو چالیس دن سے زیادہ چھوڑنا شافعیہ اور حنابلہ کے نزدیک مکروہ اور حنفیہ کے نزدیک حرام ہے، جسے شوکانی اور ابن باز نے اختیار کیا۔"
