id: work/fatwa-islamqa-the-practices-of-natural-disposition-five-or-ten
class: work
kind: fatwa
label: { ar: "هل سنن الفطرة خمس أم عشر، وما هي؟", en: "Are the practices of natural disposition (sunan al-fitra) five or ten, and what are they?", ur: "سننِ فطرت پانچ ہیں یا دس، اور وہ کیا ہیں؟", es: "¿Son cinco o diez las prácticas de la disposición natural (sunan al-fitra), y cuáles son?", fr: "Les pratiques de la disposition naturelle (sunan al-fitra) sont-elles au nombre de cinq ou dix, et quelles sont-elles ?", tr: "Doğal fitre gelenekleri beş mi on mu ve bunlar nedir?", id: "Apakah tradisi fitrah alami itu lima atau sepuluh, dan apa saja tradisinya?" }
summary:
  ar: "سؤال عن الجمع بين حديث أبي هريرة أن خصال الفطرة خمس وحديث عائشة أنها عشر، وعن تعداد خصال الفطرة كاملة مع حكم كل خصلة، أجاب فيه موقع الإسلام سؤال وجواب بأن العدد في الحديث ليس للحصر ومفهومه غير معتبر، كما قال النووي وابن دقيق العيد، وأن حديث عائشة اختُلف في رفعه وأعلّه أحمد والنسائي والدارقطني فالمحفوظ أنه من قول طلق بن حبيب، مع حديث عمار بن ياسر عند أحمد وأبي داود، وأن مجموع الخصال الواردة خمس عشرة كما قال ابن حجر: الختان والاستحداد وتقليم الأظفار ونتف الإبط وقص الشارب وإعفاء اللحية والسواك والمضمضة والاستنشاق والاستنثار وغسل البراجم وحلق العانة والاستنجاء والانتضاح وفرق الرأس. ثم فصّل حكم كل خصلة: فالختان واجب على الرجال مكرمة للنساء عند ابن قدامة وابن عثيمين ويسقط بخوف الهلاك، والاستحداد وتقليم الأظفار ونتف الإبط وقص الشارب سنن متفق عليها مع من أوجب القص كابن حزم وابن العربي وابن القيم، وإعفاء اللحية واجب يحرم حلقها عند الجمهور، والسواك سنة بالإجماع، وغسل البراجم مستحب، والمضمضة والاستنشاق واجبان في الوضوء عند الحنابلة وابن تيمية، والاستنثار سنة، والاستنجاء واجب عند الجمهور، والانتضاح مستحب لمن يُبتلى بالوسواس، والفرق سنة أولى من السدل عند ابن عبد البر، وأن ترك هذه الخصال فوق أربعين يومًا مكروه عند الشافعية والحنابلة ومحرم عند الحنفية واختاره الشوكاني وابن باز."
  en: "A question about reconciling Abu Hurayra's hadith that the practices of natural disposition are five with Aisha's hadith that they are ten, and about listing them all with the ruling on each; IslamQA answered that the number in the hadith is not a limit and its implication is not binding, as al-Nawawi and Ibn Daqiq al-Id say; that Aisha's hadith is disputed as to whether it is traced to the Prophet, Ahmad, al-Nasa'i and al-Daraqutni having faulted it so that the preserved version is a saying of Talq ibn Habib, alongside the hadith of Ammar ibn Yasir in Ahmad and Abu Dawud; and that the practices mentioned in the hadiths total fifteen, as Ibn Hajar says: circumcision, shaving the pubic hair, trimming the nails, plucking the armpits, trimming the moustache, letting the beard grow, the tooth-stick, rinsing the mouth, sniffing water into the nose, expelling it, washing the finger joints, shaving the pubes, cleansing after relieving oneself, sprinkling water, and parting the hair. It then set out the ruling on each: circumcision is obligatory for men and an honour for women according to Ibn Qudama and Ibn Uthaymin, lapsing where death is feared; shaving the pubic hair, trimming the nails, plucking the armpits and trimming the moustache are agreed Sunna practices, though Ibn Hazm, Ibn al-Arabi and Ibn al-Qayyim held trimming obligatory; letting the beard grow is obligatory and shaving it forbidden according to the majority; the tooth-stick is Sunna by consensus; washing the finger joints is recommended; rinsing the mouth and sniffing water are obligatory in ablution according to the Hanbalis and Ibn Taymiyya; expelling the water is Sunna; cleansing after relieving oneself is obligatory according to the majority; sprinkling is recommended for one troubled by doubts; parting the hair is Sunna and better than letting it hang according to Ibn Abd al-Barr; and leaving these practices beyond forty days is disliked according to the Shafi'is and Hanbalis and forbidden according to the Hanafis, a view chosen by al-Shawkani and Ibn Baz."
  ur: "ابو ہریرہ کی حدیث کہ فطرت کی خصلتیں پانچ ہیں اور عائشہ کی حدیث کہ وہ دس ہیں کے درمیان تطبیق، اور تمام خصلتوں کی فہرست اور ہر ایک کے حکم کے بارے میں سوال؛ اسلام سوال و جواب نے جواب دیا کہ حدیث میں عدد حصر کے لیے نہیں اور اس کا مفہوم معتبر نہیں، جیسا کہ نووی اور ابن دقیق العید نے کہا؛ عائشہ کی حدیث کے مرفوع ہونے میں اختلاف ہے، احمد، نسائی اور دارقطنی نے اس پر اعتراض کیا، لہٰذا محفوظ یہ ہے کہ یہ طلق بن حبیب کا قول ہے، احمد اور ابو داود کے پاس عمار بن یاسر کی حدیث کے ساتھ؛ اور احادیث میں وارد خصلتوں کا مجموعہ پندرہ ہے جیسا کہ ابن حجر نے کہا: ختنہ، زیرِ ناف بال مونڈنا، ناخن تراشنا، بغل کے بال اکھاڑنا، مونچھ کاٹنا، داڑھی بڑھانا، مسواک، کلی، ناک میں پانی ڈالنا، ناک جھاڑنا، انگلیوں کے جوڑ دھونا، زیرِ ناف مونڈنا، استنجا، پانی چھڑکنا اور سر میں مانگ نکالنا۔ پھر اس نے ہر خصلت کا حکم بیان کیا: ختنہ ابن قدامہ اور ابن عثیمین کے نزدیک مردوں پر واجب اور عورتوں کے لیے اعزاز ہے اور ہلاکت کے خوف پر ساقط ہوتا ہے؛ زیرِ ناف بال مونڈنا، ناخن تراشنا، بغل کے بال اکھاڑنا اور مونچھ کاٹنا متفقہ سنتیں ہیں، گو ابن حزم، ابن العربی اور ابن القیم نے کاٹنے کو واجب کہا؛ داڑھی بڑھانا جمہور کے نزدیک واجب اور مونڈنا حرام ہے؛ مسواک بالاجماع سنت ہے؛ انگلیوں کے جوڑ دھونا مستحب ہے؛ کلی اور ناک میں پانی ڈالنا حنابلہ اور ابن تیمیہ کے نزدیک وضو میں واجب ہیں؛ ناک جھاڑنا سنت ہے؛ استنجا جمہور کے نزدیک واجب ہے؛ پانی چھڑکنا وسوسے کے مبتلا کے لیے مستحب ہے؛ مانگ نکالنا سنت ہے اور ابن عبد البر کے نزدیک بال لٹکانے سے بہتر ہے؛ اور ان خصلتوں کو چالیس دن سے زیادہ چھوڑنا شافعیہ اور حنابلہ کے نزدیک مکروہ اور حنفیہ کے نزدیک حرام ہے، جسے شوکانی اور ابن باز نے اختیار کیا۔"
  es: "Una pregunta acerca de conciliar el hadiz de Abu Hurayra que dice que las prácticas de disposición natural son cinco con el hadiz de Aisha que dice que son diez, y acerca de enumerarlas todas con el dictamen sobre cada una; IslamQA respondió que el número en el hadiz no es un límite y su implicación no es vinculante, como dicen al-Nawawi e Ibn Daqiq al-Id; que el hadiz de Aisha es disputado en cuanto a si se remonta al Profeta, Ahmad, al-Nasa'i y al-Daraqutni lo han fallado de modo que la versión preservada es un dicho de Talq ibn Habib, junto con el hadiz de Ammar ibn Yasir en Ahmad y Abu Dawud; y que las prácticas mencionadas en los hadices suman quince, como dice Ibn Hajar: circuncisión, afeitar el vello púbico, cortarse las uñas, depilarse las axilas, recortarse el bigote, dejarse crecer la barba, el palillo dental, enjuagarse la boca, oler agua por la nariz, expulsarla, lavarse las articulaciones de los dedos, afeitarse el vello púbico, limpiarse después de orinar, rociar agua y separar el cabello. Luego se estableció el dictamen sobre cada una: la circuncisión es obligatoria para los hombres y un honor para las mujeres según Ibn Qudama e Ibn Uthaymin, y se omite cuando se teme la muerte; afeitarse el vello púbico, cortarse las uñas, depilarse las axilas y recortarse el bigote son prácticas de la Sunna acordadas, aunque Ibn Hazm, Ibn al-Arabi e Ibn al-Qayyim consideraron el recorte obligatorio; dejarse crecer la barba es obligatorio y afeitarla está prohibido según la mayoría; El uso del palillo dental es Sunna por consenso; lavarse las articulaciones de los dedos es recomendable; enjuagarse la boca e inhalar agua son obligatorios en la ablución según los Hanbalis e Ibn Taymiyya; expulsar el agua es Sunna; limpiarse después de hacer sus necesidades es obligatorio según la mayoría; rociar agua es recomendable para quien tiene dudas; separar el cabello es Sunna y mejor que dejarlo suelto según Ibn Abd al-Barr; y dejar estas prácticas más de cuarenta días es desaconsejable según los Shafi'is y Hanbalis y prohibido según los Hanafis, una opinión elegida por al-Shawkani e Ibn Baz."
  fr: "Une question portait sur la conciliation du hadith d'Abu Hurayra, selon lequel les pratiques de disposition naturelle sont au nombre de cinq, avec le hadith d'Aisha, qui en compte dix, et sur la nécessité de les énumérer toutes en précisant la règle applicable à chacune. IslamQA a répondu que le nombre mentionné dans le hadith n'est pas une limite et que son implication n'est pas contraignante, comme le disent al-Nawawi et Ibn Daqiq al-Id. Il a également été indiqué que le hadith d'Aisha est contesté quant à son attribution au Prophète, Ahmad, al-Nasa'i et al-Daraqutni l'ayant contesté, de sorte que la version préservée est attribuée à Talq ibn Habib, aux côtés du hadith d'Ammar ibn Yasir rapporté par Ahmad et Abu Dawud. et que les pratiques mentionnées dans les hadiths sont au nombre de quinze, comme l'indique Ibn Hajar: la circoncision, le rasage du pubis, la coupe des ongles, l'épilation des aisselles, la taille de la moustache, le port de la barbe, l'utilisation du bâtonnet de nettoyage des dents, le rinçage de la bouche, l'inhalation d'eau par le nez, l'expulsion de l'eau, le lavage des articulations des doigts, le rasage du pubis, les ablutions après avoir déféqué, l'aspersion d'eau et la raie des cheveux. Il expose ensuite la règle concernant chacune: la circoncision est obligatoire pour les hommes et un honneur pour les femmes selon Ibn Qudama et Ibn Uthaymin, sauf en cas de danger de mort; le rasage du pubis, la coupe des ongles, l'épilation des aisselles et la taille de la moustache sont des pratiques sunnites reconnues, bien qu'Ibn Hazm, Ibn al-Arabi et Ibn al-Qayyim aient considéré la taille de la moustache comme obligatoire; le port de la barbe est obligatoire et le rasage interdit selon la majorité; l'utilisation du bâtonnet de nettoyage des dents est une sunna consensuelle. Il est recommandé de se laver les articulations des doigts; se rincer la bouche et humer l’eau sont obligatoires lors des ablutions selon les Hanbalites et Ibn Taymiyya; expulser l’eau est une Sunna; se purifier après avoir déféqué est obligatoire selon la majorité; l’aspersion est recommandée pour celui qui est troublé par des doutes; se séparer les cheveux est une Sunna et préférable à les laisser détachés selon Ibn Abd al-Barr; et ne pas pratiquer ces ablutions pendant plus de quarante jours est déconseillé selon les Shafi’ites et les Hanbalites et interdit selon les Hanafites, une opinion partagée par al-Shawkani et Ibn Baz."
  tr: "Ebu Hureyre'nin doğal özelliklerin beş olduğu hadisi ile Aişe'nin hadisinin on olduğu ve her bir özelliğin hükmünün tamamlandığı doğal özelliklerin listelenmesiyle ilgili bir soru. İslami web sitesi, bir soru-cevapta hadisteki sayının sayım için olmadığını ve kavramının geçerli olmadığını yanıtladı; bunu el-Nevavi ve İbn Dakık el-Id'in de belirttiği gibi. Aişe'nin hadisi öncelikte farklılık gösterir, ancak Ahmed, el-Nasa'i, ve el-Daraqutniler onu yüceltmiştir. Talak ibn Habib'in sözünden ve Ammar ibn Yasir'in Ahmed ve Ebu Davud'daki hadislerinden olduğu korunmuştur. Bahsedilen toplam özellik sayısı on beştir, İbn Hacer'in dediği gibi: sünnet, istihdad, tırnak kesme, koltuk altı yökme, bıyık kesme, sakalı muaf tutma, diş fırçalama, durulama, soluma, kasık kıllarını tıraş etme, temizleme ve başın ayrılması. Sonra her bir özellik üzerindeki hükmü açıkladı: İbn Qudamah ve İbn Uthaymeen'e göre erkekler için sünnet, kadınlar için bir onur olarak zorunludur ve ölüm korkusuyla feragat edilir. İstihadad, yani tırnak kesme, koltuk altını koparma ve bıyık kesim, İbn Hazm, İbn Arabi ve İbn al-Kayyim gibi kesmeyi zorunlu kılanların üzerinde anlaşılan Sünnetlerdir. Sakalın kesilmesi zorunludur ve çoğunluğa göre tıraş yasaktır. Diş çubuğu kullanmak Sünnettir Uzlaşı. Alnın yıkanması önerilir. Hanbali ve İbn Teymiyye'ye göre göz kapaklarının durulanması ve solunması abdest alınırken önerilir. Çoğunluğa göre İstince sünnettir. Takıntı olanlar için temizlik önerilir. İbn Abdülbarr'a göre fark, sünnetin südülden daha iyidir. Bu özellikleri kırk günden fazla bırakmak Şafiiler ve Hanbalilere göre sevilmez, Hanefilere göre yasaktır ve El-Şevkanî ile İbn Baz tarafından tercih edilir."
  id: "Pertanyaan tentang merekonsiliasi hadis Abu Huraira bahwa sifat alaminya lima dan hadis Aisha bahwa jumlahnya sepuluh, serta tentang mencantumkan sifat alami yang lengkap dengan aturan masing-masing sifat. Situs web Islam menjawab dalam sesi tanya jawab bahwa angka dalam hadis bukan untuk dihitung dan konsepnya tidak valid, seperti yang dikatakan oleh al-Nawawi dan Ibn Daqiq al-'Id. Hadis Aisha berbeda dalam prioritasnya, tetapi Ahmad, al-Nasa'i, dan al-Daraqutni telah mengangkatnya. Terjaga bahwa ini berasal dari perkataan Talaq ibn Habib, bersama dengan hadis Ammar ibn Yasir dalam Ahmad dan Abu Dawood. Jumlah total atribut yang disebutkan adalah lima belas, seperti yang dikatakan Ibn Hajar: sunat, istihdad, memotong kuku, mencabut ketiak, memangkas kumis, mengecualikan janggut, menyikat gigi, membilas, menghirup, mencukur bulu kemaluan, membersihkan, dan membelah kepala. Kemudian ia menjelaskan aturan tentang setiap sifat: Sunat wajib bagi pria sebagai kehormatan bagi wanita menurut Ibn Qudamah dan Ibn Uthaymeen, dan sunat dibatalkan karena takut mati. Istihadad, memotong kuku, mencabut ketiak, dan memangkas kumis adalah Sunnah yang disepakati oleh mereka yang mewajibkan pemangkasan seperti Ibn Hazm, Ibn Arabi, dan Ibn al-Qayyim. Melepas jenggot adalah wajib dan melarang mencukur sesuai dengan mayoritas. Menggunakan tusuk gigi adalah Sunnah dengan konstan sensus. Mencuci dahi dianjurkan. Bilas dan menghirup kelopak mata dianjurkan dalam wudhu menurut Hanbalis dan Ibn Taymiyyah. Istinja adalah Sunnah menurut mayoritas. Pembersihan dianjurkan bagi mereka yang terkena obsesi. Perbedaannya adalah Sunnah yang lebih baik daripada sudl menurut Ibn Abd al-Barr. Meninggalkan sifat-sifat ini lebih dari empat puluh hari tidak disukai menurut Shafi'i dan Hanbali, dan dilarang menurut Hanafi, dan lebih disukai oleh Al-Shawkani dan Ibn Baz."
