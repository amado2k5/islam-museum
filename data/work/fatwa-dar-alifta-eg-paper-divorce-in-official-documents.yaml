label: { ar: "مدى وقوع الطلاق الصوري الذي كتب في الأوراق الرسمية أو وقع عليه الزوج", en: "Does a 'paper divorce' in official documents take effect?", ur: "سرکاری کاغذات میں لکھی صوری طلاق کا وقوع", es: "¿Tiene validez un \"divorcio por escrito\" plasmado en documentos oficiales?" }
summary:
  ar: "سائل سأل عن وقوع الطلاق الصوري الذي كتب في الأوراق الرسمية أو وقع عليه الزوج على الإبراء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20687)⁩ أن الطلاق الموثق على الإبراء الذي أقر الزوجان بحصوله طلاق صحيح شرعًا مرتب لآثاره على ما فصّل الجواب."
  en: "A questioner asked whether a 'paper divorce' written into official documents — signed by the husband in a release — takes effect. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20687) answered that a documented divorce on release which both spouses acknowledge is valid in the sharia and carries its effects — as the answer details."
  ur: "ایک سائل نے سرکاری کاغذات میں لکھی صوری طلاق کے وقوع پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20687)⁩ نے جواب دیا کہ دستاویزی طلاق جس کا دونوں اعتراف کریں شرعاً صحیح اور آثار رکھتی ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó si un divorcio por escrito, plasmado en documentos oficiales y firmado por el esposo mediante un acuerdo de liberación, tiene validez. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20687) respondió que un divorcio documentado mediante un acuerdo de liberación, reconocido por ambos cónyuges, es válido según la sharia y tiene efectos legales, tal como se detalla en la respuesta."
