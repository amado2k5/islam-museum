label: { ar: "قرار مجمع الفقه الإسلامي الدولي 207 (22/3) بشأن جهاد الطلب وجهاد الدفع", en: "IIFA resolution 207 (22/3) on jihad al-talab (jihad of seeking) and jihad al-daf' (jihad of defence)", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 207 (22/3): جہادِ طلب اور جہادِ دفع" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩، استحضر فيه المجلس أن الأصل في علاقة الأمة المسلمة بغيرها من الأمم السلم وأن سبب القتال في الإسلام العدوان لا المخالفة في الدين، مع مراعاة ما استجد من تغيرات في ظروف الدعوة وتطور أساليب الاتصال بين البشرية. قرر أن الجهاد في معناه العام بذل كل جهد مشروع لإعلاء كلمة الله وتبليغ رسالة الإسلام بكافة الوسائل المادية والمعنوية ونشر العدل والأمن والرحمة في المجتمعات البشرية، وأنه نوعان: جهاد الطلب الذي يهدف إلى حماية حرية نشر الدعوة وإزالة العوائق أمامها وإلى الدفاع عن المستضعفين والمضطهدين في الأرض وفق ضوابط وشروط حددها الفقهاء تحقيقًا للمصلحة ودرءًا للمفسدة، وغايته ومقصده تبليغ رسالة الإسلام دون إكراه للناس على الدخول فيه، وعلى الدعاة في الظروف المعاصرة الإفادة من الاتفاقيات والمعاهدات الدولية التي جعلت العالم دار عهد تسمح فيه الدول بالتنقل وإطلاق الحرية في تبليغ الدعوة واستخدام مختلف الوسائل الحديثة ووسائل الاتصال المعاصرة للدعوة بمختلف اللغات، وأكد المجمع في هذا السياق على الثوابت الشرعية التي سبق إصدار قرارات وتوصيات فيها من وجوب إعداد العدة وتقوية الجيوش في العالم الإسلامي وإمدادها بالعتاد وأسباب القوة التي يجب السعي لامتلاكها حفظًا للأمة؛ وجهاد الدفع وهو ما يفرضه واجب الدفاع الشرعي المقرر إذا حدث اعتداء على الأمة أو المجتمع أو الدين أو الوطن أو الأفراد، وهذا الجهاد يزول حكمه بزوال الاعتداء وخروج العدو من بلاد المسلمين. وأوصى بتفعيل إنشاء محكمة العدل الإسلامية لفض النزاعات بين الدول والمجتمعات المسلمة وتعزيزها بقوة مشتركة تشكل من مختلف بلدان العالم الإسلامي؛ والتأكيد على تفعيل قراره 68 ⁦(7/6)⁩ المتضمن إعداد مشروع لائحة الحقوق الدولية في الإسلام وقراره 128 ⁦(14/2)⁩ المتضمن التوصية بإعداد مدونة إسلامية في القانون الدولي الإنساني؛ وتكليف لجنة من العلماء والمختصين بإعداد مناهج ومقررات دراسية تبين حقائق الإسلام في العلاقات الدولية في السلم والحرب وتراعي المستجدات وتتمسك بالثوابت والأصول."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). Recalling that the basis of the Muslim community's relation to other nations is peace and that the cause of fighting in Islam is aggression, not difference in religion — while noting the new changes in the circumstances of da'wa and the evolution of communication among humanity — it ruled that jihad in its general meaning is the spending of every lawful effort to raise God's word, convey the message of Islam by every material and moral means, and spread justice, security and mercy in human societies. It is of two kinds. Jihad al-talab (jihad of seeking) aims at protecting the freedom to spread the call and removing obstacles before it, and at defending the weak and oppressed on earth, under controls and conditions the jurists set to realise benefit and ward off harm; its aim is conveying the message of Islam without compelling people to enter it, and under contemporary circumstances callers are to benefit from the international agreements and treaties that have made the world an abode of covenant in which states permit movement and the freedom to convey the call through every modern means of communication and in every language. In this context the Academy reaffirmed the established principles on which it had earlier issued resolutions and recommendations, of the duty of preparation and strengthening the armies of the Islamic world and supplying them with the equipment and means of strength that must be sought to safeguard the community. Jihad al-daf' (jihad of defence) is what the established duty of lawful defence imposes when aggression occurs against the community, society, religion, homeland or individuals; its ruling lapses when the aggression ends and the enemy leaves the Muslims' lands. It recommended activating the establishment of an Islamic Court of Justice to settle disputes among Muslim states and societies, reinforced by a joint force drawn from the countries of the Islamic world; activating its resolutions 68 (7/6) on preparing a draft charter of international rights in Islam and 128 (14/2) recommending an Islamic code in international humanitarian law; and commissioning a committee of scholars and specialists to prepare curricula and courses presenting the truths of Islam on international relations in peace and war, mindful of developments while holding to fundamentals."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ اکیڈمی نے یہ یاد رکھتے ہوئے کہ مسلم امت کا دوسری امتوں سے تعلق کا اصل امن ہے اور اسلام میں قتال کا سبب عداوت ہے نہ کہ دین میں اختلاف — اور دعوت کے حالات میں رونما ہونے والی تبدیلیوں اور انسانیت کے رابطے کے ذرائع کی ترقی کو مدنظر رکھتے ہوئے — فیصلہ دیا کہ جہاد اپنے عام معنی میں ہر جائز کوشش کا بذل ہے تاکہ کلمۂ اللہ بلند ہو، اسلام کا پیغام ہر مادی و معنوی ذریعے سے پہنچے اور انسانی معاشروں میں عدل، امن اور رحمت پھیلے۔ اس کی دو قسمیں ہیں۔ جہادِ طلب کا مقصد دعوت کے پھیلاؤ کی آزادی کا تحفظ اور اس کے راستے میں رکاوٹیں ہٹانا اور زمین میں کمزور اور مظلوم لوگوں کا دفاع ہے — ایسے ضوابط و شرائط کے تحت جو فقہاء نے مصلحت کی تحقق اور مفسدہ کے دفع کے لیے مقرر کیں؛ اس کا مقصد اسلام کا پیغام پہنچانا ہے لوگوں کو دین میں داخلے پر مجبور کیے بغیر، اور عصری حالات میں دعاۃ کو بین الاقوامی معاہدوں سے فائدہ اٹھانا چاہیے جنہوں نے دنیا کو دارِ عهد بنایا جس میں ریاستیں نقل و حرکت اور دعوت پہنچانے کی آزادی اور ہر جدید ذریعہ رابطہ اور ہر زبان میں دعوت کی اجازت دیتی ہیں۔ اسی سیاق میں اکیڈمی نے ان ثوابت کی تائید کی جن پر پہلے قراردادیں اور سفارشات جاری کر چکی ہے — تیاری کا فریضہ اور اسلامی دنیا کی فوجوں کی مضبوطی اور انہیں اسلحہ و قوت کے اسباب سے لیس کرنا جسے امت کے تحفظ کے لیے حاصل کرنا لازم ہے۔ جہادِ دفع وہ ہے جو جائز دفاع کے مقررہ فرض کا تقاضا کرتا ہے جب امت، معاشرے، دین، وطن یا افراد پر حملہ ہو؛ اس کا حکم اس وقت ختم ہو جاتا ہے جب عداوت ختم ہو اور دشمن مسلمانوں کے ملک سے نکل جائے۔ اکیڈمی نے سفارش کی کہ مسلم ممالک اور معاشروں کے درمیان تنازعات کے فیصلے کے لیے اسلامی عدالتِ انصاف کا قیام عمل میں لایا جائے جسے اسلامی دنیا کے مختلف ممالک سے مشتمل مشترکہ فورس سے مضبوط کیا جائے؛ اپنی قرارداد 68 ⁦(7/6)⁩ برائے اسلام میں بین الاقوامی حقوق کا مسودہ اور قرارداد 128 ⁦(14/2)⁩ برائے بین الاقوامی انسانی قانون میں اسلامی ضابطۂ اخلاق کو عمل میں لانے کی تاکید؛ اور علماء و ماہرین کی کمیٹی کو امن و جنگ میں بین الاقوامی تعلقات پر اسلام کی حقیقتیں بیان کرنے والے نصاب اور مضامین تیار کرنے کی ذمہ داری دی جو ترقیات کو ملحوظ رکھے اور ثوابت و اصول پر قائم رہے۔"
