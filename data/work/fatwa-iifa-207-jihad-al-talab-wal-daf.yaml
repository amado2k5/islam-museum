label: { ar: "قرار مجمع الفقه الإسلامي الدولي 207 (22/3) بشأن جهاد الطلب وجهاد الدفع", en: "IIFA resolution 207 (22/3) on jihad al-talab (jihad of seeking) and jihad al-daf' (jihad of defence)", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 207 (22/3): جہادِ طلب اور جہادِ دفع", es: "Resolución 207 (22/3) de la IIFA sobre la yihad al-talab (yihad de búsqueda) y la yihad al-daf' (yihad de defensa).", fr: "résolution 207 (22/3) de l'IIFA sur le jihad al-talab (jihad de recherche) et le jihad al-daf' (jihad de défense)", tr: "Uluslararası İslami Fiqh Akademisi Talepte Cihad ve Ödeme Cihadı ile ilgili 207 (22/3) sayılı Kararı", id: "Resolusi International Islamic Fiqh Academy 207 (22/3) mengenai Jihad Tuntutan dan Jihad Pembayaran" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩، استحضر فيه المجلس أن الأصل في علاقة الأمة المسلمة بغيرها من الأمم السلم وأن سبب القتال في الإسلام العدوان لا المخالفة في الدين، مع مراعاة ما استجد من تغيرات في ظروف الدعوة وتطور أساليب الاتصال بين البشرية. قرر أن الجهاد في معناه العام بذل كل جهد مشروع لإعلاء كلمة الله وتبليغ رسالة الإسلام بكافة الوسائل المادية والمعنوية ونشر العدل والأمن والرحمة في المجتمعات البشرية، وأنه نوعان: جهاد الطلب الذي يهدف إلى حماية حرية نشر الدعوة وإزالة العوائق أمامها وإلى الدفاع عن المستضعفين والمضطهدين في الأرض وفق ضوابط وشروط حددها الفقهاء تحقيقًا للمصلحة ودرءًا للمفسدة، وغايته ومقصده تبليغ رسالة الإسلام دون إكراه للناس على الدخول فيه، وعلى الدعاة في الظروف المعاصرة الإفادة من الاتفاقيات والمعاهدات الدولية التي جعلت العالم دار عهد تسمح فيه الدول بالتنقل وإطلاق الحرية في تبليغ الدعوة واستخدام مختلف الوسائل الحديثة ووسائل الاتصال المعاصرة للدعوة بمختلف اللغات، وأكد المجمع في هذا السياق على الثوابت الشرعية التي سبق إصدار قرارات وتوصيات فيها من وجوب إعداد العدة وتقوية الجيوش في العالم الإسلامي وإمدادها بالعتاد وأسباب القوة التي يجب السعي لامتلاكها حفظًا للأمة؛ وجهاد الدفع وهو ما يفرضه واجب الدفاع الشرعي المقرر إذا حدث اعتداء على الأمة أو المجتمع أو الدين أو الوطن أو الأفراد، وهذا الجهاد يزول حكمه بزوال الاعتداء وخروج العدو من بلاد المسلمين. وأوصى بتفعيل إنشاء محكمة العدل الإسلامية لفض النزاعات بين الدول والمجتمعات المسلمة وتعزيزها بقوة مشتركة تشكل من مختلف بلدان العالم الإسلامي؛ والتأكيد على تفعيل قراره 68 ⁦(7/6)⁩ المتضمن إعداد مشروع لائحة الحقوق الدولية في الإسلام وقراره 128 ⁦(14/2)⁩ المتضمن التوصية بإعداد مدونة إسلامية في القانون الدولي الإنساني؛ وتكليف لجنة من العلماء والمختصين بإعداد مناهج ومقررات دراسية تبين حقائق الإسلام في العلاقات الدولية في السلم والحرب وتراعي المستجدات وتتمسك بالثوابت والأصول."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). Recalling that the basis of the Muslim community's relation to other nations is peace and that the cause of fighting in Islam is aggression, not difference in religion — while noting the new changes in the circumstances of da'wa and the evolution of communication among humanity — it ruled that jihad in its general meaning is the spending of every lawful effort to raise God's word, convey the message of Islam by every material and moral means, and spread justice, security and mercy in human societies. It is of two kinds. Jihad al-talab (jihad of seeking) aims at protecting the freedom to spread the call and removing obstacles before it, and at defending the weak and oppressed on earth, under controls and conditions the jurists set to realise benefit and ward off harm; its aim is conveying the message of Islam without compelling people to enter it, and under contemporary circumstances callers are to benefit from the international agreements and treaties that have made the world an abode of covenant in which states permit movement and the freedom to convey the call through every modern means of communication and in every language. In this context the Academy reaffirmed the established principles on which it had earlier issued resolutions and recommendations, of the duty of preparation and strengthening the armies of the Islamic world and supplying them with the equipment and means of strength that must be sought to safeguard the community. Jihad al-daf' (jihad of defence) is what the established duty of lawful defence imposes when aggression occurs against the community, society, religion, homeland or individuals; its ruling lapses when the aggression ends and the enemy leaves the Muslims' lands. It recommended activating the establishment of an Islamic Court of Justice to settle disputes among Muslim states and societies, reinforced by a joint force drawn from the countries of the Islamic world; activating its resolutions 68 (7/6) on preparing a draft charter of international rights in Islam and 128 (14/2) recommending an Islamic code in international humanitarian law; and commissioning a committee of scholars and specialists to prepare curricula and courses presenting the truths of Islam on international relations in peace and war, mindful of developments while holding to fundamentals."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ اکیڈمی نے یہ یاد رکھتے ہوئے کہ مسلم امت کا دوسری امتوں سے تعلق کا اصل امن ہے اور اسلام میں قتال کا سبب عداوت ہے نہ کہ دین میں اختلاف — اور دعوت کے حالات میں رونما ہونے والی تبدیلیوں اور انسانیت کے رابطے کے ذرائع کی ترقی کو مدنظر رکھتے ہوئے — فیصلہ دیا کہ جہاد اپنے عام معنی میں ہر جائز کوشش کا بذل ہے تاکہ کلمۂ اللہ بلند ہو، اسلام کا پیغام ہر مادی و معنوی ذریعے سے پہنچے اور انسانی معاشروں میں عدل، امن اور رحمت پھیلے۔ اس کی دو قسمیں ہیں۔ جہادِ طلب کا مقصد دعوت کے پھیلاؤ کی آزادی کا تحفظ اور اس کے راستے میں رکاوٹیں ہٹانا اور زمین میں کمزور اور مظلوم لوگوں کا دفاع ہے — ایسے ضوابط و شرائط کے تحت جو فقہاء نے مصلحت کی تحقق اور مفسدہ کے دفع کے لیے مقرر کیں؛ اس کا مقصد اسلام کا پیغام پہنچانا ہے لوگوں کو دین میں داخلے پر مجبور کیے بغیر، اور عصری حالات میں دعاۃ کو بین الاقوامی معاہدوں سے فائدہ اٹھانا چاہیے جنہوں نے دنیا کو دارِ عهد بنایا جس میں ریاستیں نقل و حرکت اور دعوت پہنچانے کی آزادی اور ہر جدید ذریعہ رابطہ اور ہر زبان میں دعوت کی اجازت دیتی ہیں۔ اسی سیاق میں اکیڈمی نے ان ثوابت کی تائید کی جن پر پہلے قراردادیں اور سفارشات جاری کر چکی ہے — تیاری کا فریضہ اور اسلامی دنیا کی فوجوں کی مضبوطی اور انہیں اسلحہ و قوت کے اسباب سے لیس کرنا جسے امت کے تحفظ کے لیے حاصل کرنا لازم ہے۔ جہادِ دفع وہ ہے جو جائز دفاع کے مقررہ فرض کا تقاضا کرتا ہے جب امت، معاشرے، دین، وطن یا افراد پر حملہ ہو؛ اس کا حکم اس وقت ختم ہو جاتا ہے جب عداوت ختم ہو اور دشمن مسلمانوں کے ملک سے نکل جائے۔ اکیڈمی نے سفارش کی کہ مسلم ممالک اور معاشروں کے درمیان تنازعات کے فیصلے کے لیے اسلامی عدالتِ انصاف کا قیام عمل میں لایا جائے جسے اسلامی دنیا کے مختلف ممالک سے مشتمل مشترکہ فورس سے مضبوط کیا جائے؛ اپنی قرارداد 68 ⁦(7/6)⁩ برائے اسلام میں بین الاقوامی حقوق کا مسودہ اور قرارداد 128 ⁦(14/2)⁩ برائے بین الاقوامی انسانی قانون میں اسلامی ضابطۂ اخلاق کو عمل میں لانے کی تاکید؛ اور علماء و ماہرین کی کمیٹی کو امن و جنگ میں بین الاقوامی تعلقات پر اسلام کی حقیقتیں بیان کرنے والے نصاب اور مضامین تیار کرنے کی ذمہ داری دی جو ترقیات کو ملحوظ رکھے اور ثوابت و اصول پر قائم رہے۔"
  es: "Resolución colectiva de la Academia Internacional de Juqh Islámico en su 22.ª sesión en Kuwait (2–5 Jumada al-Akhira 1436, 22–25 de marzo de 2015). Recordando que la base de la relación de la comunidad musulmana con otras naciones es la paz y que la causa de la lucha en el Islam es la agresión, no la diferencia de religión —al tiempo que se observan los nuevos cambios en las circunstancias de la da'wa y la evolución de la comunicación entre la humanidad— dictaminó que la yihad en su sentido general es el gasto de todo esfuerzo lícito para elevar la palabra de Dios, transmitir el mensaje del Islam por todos los medios materiales y morales, y difundir la justicia, la seguridad y la misericordia en las sociedades humanas. Es de dos tipos. La yihad al-talab (yihad de búsqueda) tiene como objetivo proteger la libertad de difundir el llamado y eliminar los obstáculos que se interponen en su camino, y defender a los débiles y oprimidos en la tierra, bajo los controles y condiciones que los juristas establecen para lograr el beneficio y evitar el daño; Su objetivo es transmitir el mensaje del Islam sin obligar a las personas a convertirse, y en las circunstancias contemporáneas, los predicadores deben beneficiarse de los acuerdos y tratados internacionales que han convertido al mundo en una morada de alianza en la que los estados permiten la circulación y la libertad de transmitir el llamado a través de todos los medios modernos de comunicación y en todos los idiomas. En este contexto, la Academia reafirmó los principios establecidos sobre los que ya había emitido resoluciones y recomendaciones, del deber de preparar y fortalecer los ejércitos del mundo islámico y proporcionarles el equipo y los medios de fuerza que deben buscarse para salvaguardar a la comunidad. La yihad al-daf' (yihad de defensa) es lo que impone el deber establecido de defensa legítima cuando se produce una agresión contra la comunidad, la sociedad, la religión, la patria o los individuos; su precepto cesa cuando la agresión termina y el enemigo abandona las tierras musulmanas. Recomendó activar el establecimiento de un Tribunal de Justicia Islámico para resolver disputas entre estados y sociedades musulmanas, reforzado por una fuerza conjunta formada por países del mundo islámico; activando sus resoluciones 68 (7/6) sobre la preparación de un proyecto de carta de derechos internacionales en el Islam y 128 (14/2) que recomienda un código islámico en derecho internacional humanitario; y encargando a un comité de académicos y especialistas la preparación de planes de estudio y cursos que presenten las verdades del Islam sobre las relaciones internacionales en tiempos de paz y de guerra, teniendo en cuenta los avances pero manteniendo los fundamentos."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015). Rappelant que la paix est le fondement des relations de la communauté musulmane avec les autres nations et que, en Islam, la cause des combats est l'agression, et non la différence religieuse – tout en prenant note des changements récents dans le contexte de la da'wa et de l'évolution des communications entre les êtres humains –, l'Académie a statué que le jihad, au sens général, consiste à déployer tous les efforts licites pour faire connaître la parole de Dieu, transmettre le message de l'Islam par tous les moyens matériels et moraux, et répandre la justice, la sécurité et la miséricorde dans les sociétés humaines. Il est de deux sortes. Le jihad al-talab (jihad de recherche) vise à protéger la liberté de diffuser l'appel et à lever les obstacles à sa propagation, ainsi qu'à défendre les faibles et les opprimés sur terre, dans le respect des règles et des conditions établies par les juristes afin d'en tirer profit et d'en prévenir le préjudice. Son objectif est de transmettre le message de l'islam sans contraindre quiconque à s'y convertir. Dans le contexte actuel, les prédicateurs doivent bénéficier des accords et traités internationaux qui ont fait du monde un lieu d'alliance, où les États autorisent la circulation et la liberté de diffuser le message par tous les moyens de communication modernes et dans toutes les langues. Dans ce contexte, l'Académie a réaffirmé les principes établis sur lesquels elle s'était précédemment fondée dans des résolutions et recommandations, concernant le devoir de préparer et de renforcer les armées du monde islamique et de les doter des équipements et des moyens nécessaires à la protection de la communauté. Le jihad al-daf' (jihad de défense) correspond au devoir de légitime défense établi lorsqu'une agression est commise contre la communauté, la société, la religion, la patrie ou des individus; son application cesse lorsque l'agression prend fin et que l'ennemi quitte les terres musulmanes. L'Académie a recommandé la mise en place d'une Cour de justice islamique pour régler les différends entre États et sociétés musulmanes, renforcée par une force conjointe composée de représentants des pays du monde islamique. activant ses résolutions 68 (7/6) sur la préparation d'un projet de charte des droits internationaux en Islam et 128 (14/2) recommandant un code islamique en droit international humanitaire; et chargeant un comité d'érudits et de spécialistes de préparer des programmes et des cours présentant les vérités de l'Islam sur les relations internationales en temps de paix et de guerre, en tenant compte des évolutions tout en respectant les principes fondamentaux."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt Devleti'ndeki yirmi ikinci oturumunda (2–5 Cumedül-Akhirah 1436 H, 22–25 Mart 2015) ortak kararı; Konsey, Müslüman Ümmet'in diğer milletlerle ilişkisindeki temel ilkenin barış olduğunu ve İslam'da çatışmanın sebebinin dini anlaşmazlık değil, saldırganlık olduğunu, çağrının koşullarındaki son değişiklikler ve insanlık arasındaki iletişim yöntemlerinin gelişimi dikkate alındığında hatırlatmıştır. Cihadın, geniş anlamıyla, Allah'ın sözünü yüceltmek, İslam'ın mesajını tüm maddi ve ahlaki yollarla iletmek ve insan toplumlarında adalet, güvenlik ve merhameti yaymak için her meşru çabayı göstermek olduğuna karar verilmiştir. Bu cihadın iki türü vardır: çağrıyı yayma özgürlüğünü korumayı ve önündeki engelleri kaldırmayı amaçlayan arayışın cihatı ile hukukçuların çıkar sağlamak ve zararı önlemek için kural ve koşullara göre yeryüzünde zayıf ve ezilenleri savunmak. Amaç ve amacı, insanları zorlamadan İslam'ın mesajını iletmektir. Günümüz koşullarında, vaizler bundan faydalanmalıdır Dünyayı, devletlerin mesajın hareket ve özgürce iletilmesine izin verdiği ve farklı dillerde çeşitli modern araçlar ve çağdaş iletişim yöntemleri kullandığı bir anlaşma haline getiren uluslararası anlaşmalar ve antlaşmalar. Bu bağlamda, Genel Kurul, daha önce karar ve tavsiyelerde yayımlanan şeriat sabitlerini teyit etti; örneğin teçhizat hazırlanması, İslam dünyasında orduların güçlendirilmesi, onlara teçhizat sağlanması ve ulusun korunması için aranması gereken güç araçları; ve ulusa, topluma, dine, vatana veya bireylere yönelik bir saldırı gerçekleştiğinde kurulan meşru savunma göreviyle dayatılan geri püskürtme cihadı gibi şeriat sabitlerini teyit etti. Bu cihat, saldırganın sona ermesi ve düşmanın Müslüman topraklarından sürülmesiyle sona erer. Müslüman devletler ve toplumlar arasındaki anlaşmazlıkları çözmek üzere İslam Adalet Divanı'nın kurulmasını ve İslam dünyasının çeşitli ülkelerinden oluşan ortak bir güçle güçlendirilmesini tavsiye etti; İslam'da Uluslararası Haklar Şartı taslağının hazırlanmasını içeren 68 (7/6) sayılı Kararının ve uluslararası insancıl hukukun İslami bir kodunun hazırlanmasını tavsiye eden 128 (14/2) sayılı kararın aktif hale getirilmesini onayladı; ve barış ve savaşta İslam'ın uluslararası ilişkilerdeki gerçeklerini açıklığa kavuşturan, gelişmeleri dikkate alan ve sabit ilkelere bağlı kalan müfredat ve müfredatlar hazırlamak üzere bir akademisyenler ve uzmanlardan oluşan bir komite görevlendirildi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015), di mana Dewan mengingatkan bahwa prinsip fundamental dalam hubungan umat Islam dengan bangsa lain adalah perdamaian, dan bahwa penyebab perjuangan dalam Islam adalah agresi, bukan perselisihan agama, dengan mempertimbangkan perubahan terbaru dalam keadaan panggilan dan perkembangan metode komunikasi di antara umat manusia. Diputuskan bahwa jihad, dalam arti luasnya, adalah melakukan segala upaya sah untuk mengangkat firman Tuhan, menyampaikan pesan Islam melalui segala cara materi dan moral, serta menyebarkan keadilan, keamanan, dan belas kasih dalam masyarakat manusia. Jihad ini terdiri dari dua jenis: jihad pencarian, yang bertujuan melindungi kebebasan menyebarkan panggilan dan menghilangkan hambatan, serta membela yang lemah dan tertindas di bumi sesuai dengan aturan dan kondisi yang ditetapkan oleh para ahli hukum untuk mencapai kepentingan dan mencegah bahaya. Tujuan dan tujuannya adalah menyampaikan pesan Islam tanpa memaksa orang masuk ke dalamnya. Dalam keadaan kontemporer, para penceramah harus mendapat manfaat dari perjanjian dan perjanjian internasional yang telah menjadikan dunia sebuah kovenan di mana negara-negara mengizinkan pergerakan dan kebebasan untuk menyampaikan pesan serta menggunakan berbagai cara modern dan metode komunikasi kontemporer dalam berbagai bahasa. Dalam konteks ini, Majelis menegaskan konstanta Syariah yang sebelumnya telah dikeluarkan dalam keputusan dan rekomendasi, seperti perlunya menyiapkan peralatan, memperkuat tentara di dunia Islam, memasok mereka dengan peralatan, dan sarana kekuatan yang harus dicari untuk menjaga bangsa; serta jihad untuk menangkis, yang dipaksakan oleh kewajiban pertahanan yang sah yang ditetapkan jika terjadi serangan terhadap bangsa, masyarakat, agama, tanah air, atau individu. Jihad ini berakhir dengan berakhirnya agresi dan pengusiran musuh dari tanah Muslim. Dewan merekomendasikan mengaktifkan pembentukan Mahkamah Islam untuk menyelesaikan perselisihan antara negara dan masyarakat Muslim serta memperkuatnya dengan pasukan gabungan yang terdiri dari berbagai negara dunia Islam; menegaskan aktivasi Resolusi 68 (7/6), yang mencakup penyusunan rancangan Piagam Hak Internasional dalam Islam, dan Resolusi 128 (14/2), yang merekomendasikan penyusunan kode hukum humaniter internasional Islam; serta menugaskan komite ulama dan spesialis untuk menyiapkan kurikulum dan kurikulum yang memperjelas realitas Islam dalam hubungan internasional dalam masa damai dan perang, mempertimbangkan perkembangan, serta mematuhi konstanta dan prinsip."
