summary:
  ar: "ديوان الشعر الذي نظمه محيي الدين بن عربي، وتنشره دار المعرفة ⁦(بيروت، 2005)⁩ بعنوان «ديوان ترجمان الأشواق»؛ وتذكر الطبعة في مفتتحها أبياتاً يقول فيها إنه عربي النسب يهوى العرب والبيض {cite:diwan-tarjuman-al-ashwaq-dar-marefah-2005 p.6}."
  en: "The love-poetry diwan of Ibn Arabi, printed by Dar al-Marefah (Beirut, 2005) as Diwan Tarjuman al-Ashwaq; the edition opens with verses in which the poet describes himself as an Arab by lineage {cite:diwan-tarjuman-al-ashwaq-dar-marefah-2005 p.6}."
  es: "El diván de poesía amorosa de Ibn Arabi, impreso por Dar al-Marefah (Beirut, 2005) como Diwan Tarjuman al-Ashwaq; la edición comienza con versos en los que el poeta se describe a sí mismo como árabe por linaje."
  fr: "Le diwan de poésie amoureuse d'Ibn Arabi, imprimé par Dar al-Marefah (Beyrouth, 2005) sous le titre Diwan Tarjuman al-Ashwaq; l'édition s'ouvre sur des vers dans lesquels le poète se décrit comme un Arabe de par sa lignée."
  ur: "ابن عربی کا عشقیہ شاعری کا دیوان جسے دار المعرفہ ⁦(بیروت، 2005)⁩ نے دیوان ترجمن العشواق کے نام سے مطبوع کیا ہے۔ ایڈیشن کا آغاز ان آیات سے ہوتا ہے جس میں شاعر نے حسب نسب کے لحاظ سے خود کو عرب بتایا ہے۔"
  tr: "Muhyiddin ibn Arabi tarafından bestelenen şiir koleksiyonu, Dar Al-Ma'rifa tarafından (Beyrut, 2005) \"Diwan Tarjuman Al-Ashwaq\" başlığıyla yayımlanmıştır; baskı, Arap kökenli olduğunu ve Arapları ile beyazları sevdiğini belirten dizelerle açılır {cite:diwan-tarjuman-al-ashwaq-dar-marefah-2005 s.6}."
  id: "Kumpulan puisi yang disusun oleh Muhyiddin ibn Arabi, diterbitkan oleh Dar Al-Ma'rifa (Beirut, 2005) dengan judul \"Diwan Tarjuman Al-Ashwaq\"; edisi dibuka dengan bait-bait yang menyatakan bahwa ia berasal dari keturunan Arab dan mencintai orang Arab serta kulit putih {cite:diwan-tarjuman-al-ashwaq-dar-marefah-2005 hlm.6}."
