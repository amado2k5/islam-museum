label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن تطبيق أحكام الشريعة الإسلامية", en: "IIFA resolution on applying the rulings of the Islamic sharia", ur: "اکیڈمی کی قرارداد: احکام شریعت کا نفاذ", es: "Resolución de la IIFA sobre la aplicación de las normas de la sharia islámica", fr: "Résolution de l'IIFA sur l'application des règles de la charia islamique", tr: "Uluslararası İslami Fiqh Akademisi'nin İslami Şeriat Hükümlerinin Uygulanmasına İlişkin Kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai Penerapan Ketentuan Syariah Islam" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: نصّ على أن أول واجب على من يلي أمور المسلمين تطبيق شريعة الله فيهم، وناشد الحكومات في بلاد المسلمين المبادرة إلى تطبيق الشريعة وتحكيمها تحكيمًا تامًّا في مجالات الحياة، ودعا المجتمعات الإسلامية للالتزام بدين الله على ما ورد. سُجّل منسوبًا إلى المجمع."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on applying the rulings of the Islamic sharia: its text states that the first duty of those governing Muslims is to apply God's sharia among them; it urges governments in Muslim lands to take the initiative to apply it fully in all fields of life and calls Muslim societies to adhere to God's religion. Recorded as the Academy's own text."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩ شریعت کے نفاذ پر: متن مسلم حکومتوں سے شریعت کے مکمل نفاذ کی اپیل کرتا ہے — اکیڈمی کے متن کا خلاصہ۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre la aplicación de las normas de la sharia islámica: su texto establece que el primer deber de quienes gobiernan a los musulmanes es aplicar la sharia de Dios entre ellos; insta a los gobiernos de los países musulmanes a tomar la iniciativa de aplicarla plenamente en todos los ámbitos de la vida y exhorta a las sociedades musulmanas a adherirse a la religión de Dios. Registrada como texto oficial de la Academia."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988) relative à l'application des préceptes de la charia islamique: son texte stipule que le premier devoir des gouvernants des musulmans est d'appliquer la charia divine parmi eux; il exhorte les gouvernements des pays musulmans à prendre l'initiative de l'appliquer pleinement dans tous les domaines de la vie et appelle les sociétés musulmanes à adhérer à la religion divine. Ce texte est enregistré comme étant le texte officiel de l'Académie."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin beşinci oturumunda (Kuveyt, Aralık 1988) kararı: Müslüman işlerinden sorumlu olanların en önemli görevinin Allah'ın Şeriatını kendilerine uygulamak olduğunu belirtmiş, Müslüman ülkelerdeki hükümetleri hayatın tüm alanlarında Şeriat'ı tam olarak uygulamaya ve uygulamaya teşvik etmiştir; ayrıca İslam toplumlarını belirtildiği gibi Allah'ın dinine uymaya çağırmıştır. Akademiye atfedilen bir belge olarak kayıtlıdır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kelima (Kuwait, Desember 1988): Keputusan tersebut menetapkan bahwa tugas utama mereka yang bertanggung jawab atas urusan Muslim adalah menerapkan Syariah Allah kepada mereka, dan mendesak pemerintah di negara-negara Muslim untuk mengambil inisiatif menerapkan dan menegakkan Syariah sepenuhnya di semua bidang kehidupan, serta menyerukan masyarakat Islam untuk mematuhi agama Allah sebagaimana yang telah ditetapkan. Terdaftar sebagai atribusi kepada Akademi."
