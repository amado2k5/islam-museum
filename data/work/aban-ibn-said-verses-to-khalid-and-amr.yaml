label: { ar: "أبيات أبان بن سعيد إلى أخويه خالد وعمرو", en: "Verses of Aban ibn Said to his brothers Khalid and Amr" }
summary:
  ar: "بيتان نسبهما ابن إسحاق إلى أبان بن سعيد بن العاص يخاطب بهما أخويه خالداً وعمراً حين أسلما، ويذكر ابن إسحاق أن أباهم سعيداً كان قد هلك بالظريبة. لا ينقل المتحف نص الأبيات."
  en: Two verses Ibn Ishaq attributes to Aban ibn Sa'id ibn al-As, addressing his brothers Khalid and Amr when they became Muslim; Ibn Ishaq notes that their father Sa'id had died at al-Zurayba. The museum does not reproduce the verses.
