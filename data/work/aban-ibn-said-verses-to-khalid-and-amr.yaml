label: { ar: "أبيات أبان بن سعيد إلى أخويه خالد وعمرو", en: "Verses of Aban ibn Said to his brothers Khalid and Amr", es: "Versículos de Aban ibn Said a sus hermanos Khalid y Amr", fr: "Versets d'Aban ibn Said à ses frères Khalid et Amr", ur: "ابان بن سعید کی آیات اپنے بھائیوں خالد اور عمرو کے لیے" }
summary:
  ar: "بيتان نسبهما ابن إسحاق إلى أبان بن سعيد بن العاص يخاطب بهما أخويه خالداً وعمراً حين أسلما، ويذكر ابن إسحاق أن أباهم سعيداً كان قد هلك بالظريبة. لا ينقل المتحف نص الأبيات."
  en: Two verses Ibn Ishaq attributes to Aban ibn Sa'id ibn al-As, addressing his brothers Khalid and Amr when they became Muslim; Ibn Ishaq notes that their father Sa'id had died at al-Zurayba. The museum does not reproduce the verses.
  es: "Ibn Ishaq atribuye dos versículos a Aban ibn Sa'id ibn al-As, dirigidos a sus hermanos Khalid y Amr cuando se convirtieron al Islam; Ibn Ishaq señala que su padre, Sa'id, había fallecido en al-Zurayba. El museo no reproduce estos versículos."
  fr: "Ibn Ishaq attribue deux versets à Aban ibn Sa'id ibn al-As, adressés à ses frères Khalid et Amr lors de leur conversion à l'islam; il précise que leur père, Sa'id, était décédé à al-Zurayba. Le musée ne reproduit pas ces versets."
  ur: "دو آیات ابن اسحاق نے ابان بن سعید بن العاص کی طرف منسوب کی ہیں، جن میں اپنے بھائیوں خالد اور عمرو کے مسلمان ہونے پر خطاب کیا گیا ہے۔ ابن اسحاق نوٹ کرتے ہیں کہ ان کے والد سعید کا انتقال الزرائبہ میں ہوا تھا۔ میوزیم آیات کو دوبارہ پیش نہیں کرتا ہے۔"
