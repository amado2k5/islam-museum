id: work/sharh-saheeh-al-bukhare
class: work
kind: lecture-series
label:
  ar: "برنامج شرح صحيح البخاري"
  en: "Sharh Sahih al-Bukhari (Explanation of Sahih al-Bukhari) programme"
  ur: "پروگرام شرح صحیح بخاری"
summary:
  ar: "سلسلة لعمر عبد الكافي يقرأ فيها أحاديث من صحيح البخاري ويشرحها ويستخلص منها دروسًا، وفق تسجيلات أسبابيل."
  en: "A series by Omar Abdelkafy in which he reads hadiths from Sahih al-Bukhari, explains them and draws lessons, as recorded in the Assabile archive."
  ur: "عمر عبد الکافی کی سلسلہ وار گفتگو جس میں وہ صحیح بخاری کی احادیث پڑھتے ہیں، ان کی شرح کرتے ہیں اور ان سے سبق نکالتے ہیں، اسابیل کے ذخیرے کے مطابق۔"
wings: [ideas]
themes: [scripture-and-its-sciences, ethics-and-character]
regions: [global]
authors: [person/omar-abdelkafy]
delivered: { by: person/omar-abdelkafy }
language: language/arabic
sensitivity: contested
