id: work/fatwa-amja-complete-ghusl-method
class: work
kind: fatwa
label: { ar: "الغسل الكامل", en: "The complete washing — a shower suffices", ur: "مکمل غسل — شاور کافی ہے" }
summary:
  ar: "سأل سائل إنه عندما يغتسل من الجنابة يفتح دش الحمام ويجعل الماء يسيل على جسمه فهل ذلك يجزئ. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86977 بتاريخ 18 يونيو 2012)⁩ أن الغسل الكامل أن يبدأ فيتوضأ وضوءه للصلاة ثم يفيض الماء على رأسه ثلاثًا ثم على جنبه الأيمن ثم على جنبه الأيسر مع المتابعة والتدليك، والاستنجاء يغني عنه الاستجمار فإن كان قد استجمر بالحجر أو أوراق التواليت فلا يلزم غسل الفرج بالماء إذا حصلت التنقية وإن كان الجمع بينهما أولى، والواجب تعميم الماء على البدن فما سيل عليه الماء بشاشة الدش أجزأ على ما فصّل."
  en: "A questioner described letting the shower run over his body after janaba and asked whether that suffices. Dr. Salah al-Sawi (fatwa no. 86977, 18 June 2012) answered that the complete washing begins with the prayer-wudu, then pouring water on the head thrice, then the right side then the left, with continuity and rubbing; istinja is covered by istijmar — one who has cleansed with stones or toilet paper need not wash the part with water once purity is had, though combining both is better; what is obligatory is covering the body with water, which the shower's flow achieves — as the answer details."
  ur: "ایک سائل نے شاور سے غسل کی تکمیل پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86977، 18 جون 2012)⁩ کے مطابق مکمل غسل وضو سے شروع ہوتا ہے اور پورے جسم پر پانی بہنا کافی ہے۔"
