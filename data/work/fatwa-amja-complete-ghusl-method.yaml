id: work/fatwa-amja-complete-ghusl-method
class: work
kind: fatwa
label: { ar: "الغسل الكامل", en: "The complete washing — a shower suffices", ur: "مکمل غسل — شاور کافی ہے", es: "Lavado completo: una ducha es suficiente.", fr: "Le lavage complet — une douche suffit" }
summary:
  ar: "سأل سائل إنه عندما يغتسل من الجنابة يفتح دش الحمام ويجعل الماء يسيل على جسمه فهل ذلك يجزئ. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86977 بتاريخ 18 يونيو 2012)⁩ أن الغسل الكامل أن يبدأ فيتوضأ وضوءه للصلاة ثم يفيض الماء على رأسه ثلاثًا ثم على جنبه الأيمن ثم على جنبه الأيسر مع المتابعة والتدليك، والاستنجاء يغني عنه الاستجمار فإن كان قد استجمر بالحجر أو أوراق التواليت فلا يلزم غسل الفرج بالماء إذا حصلت التنقية وإن كان الجمع بينهما أولى، والواجب تعميم الماء على البدن فما سيل عليه الماء بشاشة الدش أجزأ على ما فصّل."
  en: "A questioner described letting the shower run over his body after janaba and asked whether that suffices. Dr. Salah al-Sawi (fatwa no. 86977, 18 June 2012) answered that the complete washing begins with the prayer-wudu, then pouring water on the head thrice, then the right side then the left, with continuity and rubbing; istinja is covered by istijmar — one who has cleansed with stones or toilet paper need not wash the part with water once purity is had, though combining both is better; what is obligatory is covering the body with water, which the shower's flow achieves — as the answer details."
  ur: "ایک سائل نے شاور سے غسل کی تکمیل پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86977، 18 جون 2012)⁩ کے مطابق مکمل غسل وضو سے شروع ہوتا ہے اور پورے جسم پر پانی بہنا کافی ہے۔"
  es: "Un consultante describió haber dejado correr la ducha sobre su cuerpo después de la janaba y preguntó si eso era suficiente. El Dr. Salah al-Sawi (fatwa n.° 86977, 18 de junio de 2012) respondió que el lavado completo comienza con la oración-wudu, luego verter agua sobre la cabeza tres veces, luego sobre el lado derecho y luego sobre el izquierdo, con continuidad y frotando; el istinja está cubierto por el istijmar: quien se ha limpiado con piedras o papel higiénico no necesita lavar la parte con agua una vez que se ha alcanzado la pureza, aunque combinar ambos es mejor; lo que es obligatorio es cubrir el cuerpo con agua, lo cual se logra con el flujo de la ducha, como se detalla en la respuesta."
  fr: "Un homme a décrit comment il se laissait couler l'eau de la douche après la purification (janaba) et a demandé si cela suffisait. Le Dr Salah al-Sawi (fatwa n° 86977, 18 juin 2012) a répondu que la purification complète commence par les ablutions (wudu), puis se poursuit par l'aspersion d'eau sur la tête à trois reprises, puis sur le côté droit puis le gauche, en frottant continuellement. L'istinja est couvert par l'istijmar: celui qui s'est purifié avec des pierres ou du papier toilette n'a pas besoin de se rincer à l'eau une fois la pureté acquise, bien que la combinaison des deux soit préférable. Ce qui est obligatoire, c'est de se couvrir le corps d'eau, ce que permet le jet de la douche, comme le précise la réponse."
