label: { ar: "القرآن المجيد ⁦(مشرّف حسين)⁩", en: "The Majestic Qur'an (Musharraf Hussain)", ur: "دی مجسٹک قرآن ⁦(مشرف حسین)⁩", es: "El Majestuoso Corán (Musharraf Hussain)", fr: "Le Coran majestueux (Musharraf Hussain)" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن «بالإنجليزية البسيطة» وضعها مشرّف حسين، خريج الأزهر والمربي البريطاني، ونشرتها دار «إنفيتيشن» في نوتنغهام سنة 2018، مع مقدمات للسور وعناوين موضوعية وأسئلة للتأمل في الهوامش وحواشٍ قليلة، وفي أولها تزكية من دار الإفتاء المصرية؛ وبعد أن ناقش أئمة بريطانيون ملاحظات عليها تتعلق بالعقيدة، نشر المترجم قائمة تصحيحات وقال إن عمله بعد المراجعة موافق للعقيدة النسفية."
  en: "A 'plain English' rendering of the meanings of the Qur'an by Musharraf Hussain, an al-Azhar graduate and British educationist, published by Invitation Publishing in Nottingham in 2018 with sura introductions, topical headings, marginal reflection questions and sparing footnotes, and an endorsement from Egypt's Dar al-Ifta in its front matter; after British imams discussed criticisms concerning doctrine, the translator published an errata list and said the revised work was fully in line with the creed of al-Nasafi."
  ur: "قرآن کے معانی کا «سادہ انگریزی» ترجمہ از مشرف حسین، ازہر کے فاضل اور برطانوی ماہرِ تعلیم، جو 2018 میں نوٹنگھم سے انویٹیشن پبلشنگ نے شائع کیا، سورتوں کے تعارف، موضوعاتی عنوانات، حاشیے میں غور و فکر کے سوالات اور کم حواشی کے ساتھ، اور ابتدا میں مصری دار الافتاء کی تائید؛ برطانوی ائمہ کے عقیدے سے متعلق اعتراضات پر غور کے بعد مترجم نے تصحیحات کی فہرست شائع کی اور کہا کہ نظرِ ثانی کے بعد ان کا کام عقیدۂ نسفیہ کے مطابق ہے۔"
  es: "Una traducción en \"inglés sencillo\" de los significados del Corán realizada por Musharraf Hussain, graduado de al-Azhar y pedagogo británico, publicada por Invitation Publishing en Nottingham en 2018 con introducciones a las suras, títulos temáticos, preguntas de reflexión marginales y notas a pie de página concisas, y un respaldo de Dar al-Ifta de Egipto en su introducción; después de que imanes británicos discutieran las críticas sobre la doctrina, el traductor publicó una lista de erratas y dijo que la obra revisada estaba totalmente en línea con el credo de al-Nasafi."
  fr: "Une traduction en « langage clair » des significations du Coran par Musharraf Hussain, diplômé d'al-Azhar et pédagogue britannique, publiée par Invitation Publishing à Nottingham en 2018 avec des introductions aux sourates, des titres thématiques, des questions de réflexion en marge et des notes de bas de page éparses, et une approbation de Dar al-Ifta d'Égypte dans ses pages liminaires; après que des imams britanniques ont discuté des critiques concernant la doctrine, le traducteur a publié une liste d'errata et a déclaré que l'ouvrage révisé était pleinement conforme à la doctrine d'al-Nasafi."
