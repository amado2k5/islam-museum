summary:
  ar: "ترجمة إنجليزية لمعاني القرآن «بالإنجليزية البسيطة» وضعها مشرّف حسين، خريج الأزهر والمربي البريطاني، ونشرتها دار «إنفيتيشن» في نوتنغهام سنة 2018، مع مقدمات للسور وعناوين موضوعية وأسئلة للتأمل في الهوامش وحواشٍ قليلة، وفي أولها تزكية من دار الإفتاء المصرية؛ وبعد أن ناقش أئمة بريطانيون ملاحظات عليها تتعلق بالعقيدة، نشر المترجم قائمة تصحيحات وقال إن عمله بعد المراجعة موافق للعقيدة النسفية."
  en: "A 'plain English' rendering of the meanings of the Qur'an by Musharraf Hussain, an al-Azhar graduate and British educationist, published by Invitation Publishing in Nottingham in 2018 with sura introductions, topical headings, marginal reflection questions and sparing footnotes, and an endorsement from Egypt's Dar al-Ifta in its front matter; after British imams discussed criticisms concerning doctrine, the translator published an errata list and said the revised work was fully in line with the creed of al-Nasafi."
  ur: "قرآن کے معانی کا «سادہ انگریزی» ترجمہ از مشرف حسین، ازہر کے فاضل اور برطانوی ماہرِ تعلیم، جو 2018 میں نوٹنگھم سے انویٹیشن پبلشنگ نے شائع کیا، سورتوں کے تعارف، موضوعاتی عنوانات، حاشیے میں غور و فکر کے سوالات اور کم حواشی کے ساتھ، اور ابتدا میں مصری دار الافتاء کی تائید؛ برطانوی ائمہ کے عقیدے سے متعلق اعتراضات پر غور کے بعد مترجم نے تصحیحات کی فہرست شائع کی اور کہا کہ نظرِ ثانی کے بعد ان کا کام عقیدۂ نسفیہ کے مطابق ہے۔"
