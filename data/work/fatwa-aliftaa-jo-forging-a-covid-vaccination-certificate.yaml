id: work/fatwa-aliftaa-jo-forging-a-covid-vaccination-certificate
class: work
kind: fatwa
label: { ar: "تزوير شهادة مطعوم فيروس كورونا", en: "Forging a COVID-19 vaccination certificate", ur: "کورونا ویکسین سرٹیفکیٹ میں جعل سازی" }
summary:
  ar: "سؤال عن تزوير شهادة مطعوم فيروس كورونا، أجابت فيه دائرة الإفتاء العام الأردنية بأن تزوير شهادة المطعوم أو فحص كورونا كذب وغش وتزوير محرم، وأن مانح الشهادة المزورة شريك في الإثم، وتزداد الحرمة إن دفعت رشوة للحصول عليها. أجابت الدائرة بأن الأصل في المسلم التزام الصدق في أقواله وأفعاله مهما كانت الظروف، واستشهدت بـ[[passage/quran-9-119|سورة التوبة 9:119]]، وقالت إن من الصدق تقديم الفحوصات والشهادات الطبية السليمة التي تبين الحالة الصحية بشفافية، ومنها شهادة المطعوم وفحص الكشف عن الفيروس. وقالت إن إحضار شهادة مزورة تثبت تلقي المطعوم، أو فحص مزور يثبت عدم الإصابة، من الكذب والغش والتزوير المحرم، واستدلت بحديث رواه البخاري معناه أن قول الزور من أكبر الكبائر. وأضافت أن للتزوير في هذه الأمور الطبية أثرًا خطيرًا على المجتمع، وقد ينسف جهود الجهات المختصة، وأن من يمنح الشهادة المزورة معين وشريك في الإثم، وتزداد الحرمة إن تضمن الأمر رشوة، واستشهدت بـ[[passage/quran-5-2|سورة المائدة 5:2]]. وخلصت إلى وجوب تحري الصدق في تقديم الشهادات والفحوصات الطبية واجتناب التزوير والكذب والتحايل، لا سيما أن الأمر يتعلق بسلامة المجتمع كله."
  en: "A question about forging a COVID-19 vaccination certificate, in which Jordan's General Iftaa Department answered that forging a vaccination certificate or COVID-19 test is forbidden lying, cheating and forgery; whoever issues the forged certificate shares in the sin, and the prohibition is greater if a bribe is paid to obtain it. The Department answered that a Muslim is bound to truthfulness in word and deed whatever the circumstances, citing [[passage/quran-9-119|Surat al-Tawba 9:119]], and that truthfulness includes presenting genuine medical tests and certificates that honestly show one's state of health, among them vaccination certificates and tests for the virus. It said that producing a forged certificate showing that the holder has been vaccinated, or a forged test showing that he is not infected, is lying, cheating and forgery, which God has forbidden, citing a hadith narrated by al-Bukhari whose meaning is that false testimony is among the gravest of major sins. It added that forgery in such medical matters has serious consequences for society and can undo much of the work of the responsible authorities; whoever issues the forged certificate aids and shares in the sin, and the prohibition is greater if a bribe is involved, citing [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It concluded that everyone must be truthful in presenting medical certificates and tests and avoid forgery, lying and trickery, especially since the safety of the whole society is at stake."
  ur: "کورونا ویکسین سرٹیفکیٹ میں جعل سازی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ویکسین سرٹیفکیٹ یا کورونا ٹیسٹ میں جعل سازی حرام جھوٹ، دھوکہ اور جعل سازی ہے؛ جعلی سرٹیفکیٹ جاری کرنے والا گناہ میں شریک ہے، اور اگر اس کے لیے رشوت دی جائے تو حرمت اور بڑھ جاتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان ہر حال میں اپنے قول و فعل میں سچائی کا پابند ہے، اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا؛ اور سچائی میں درست طبی ٹیسٹ اور سرٹیفکیٹ پیش کرنا بھی شامل ہے جو صحت کی حالت کو دیانت سے ظاہر کریں، جن میں ویکسین سرٹیفکیٹ اور وائرس کا ٹیسٹ بھی ہے۔ اس نے کہا کہ ویکسین لگوانے کا جعلی سرٹیفکیٹ یا عدمِ انفیکشن کا جعلی ٹیسٹ پیش کرنا جھوٹ، دھوکہ اور جعل سازی ہے جسے اللہ نے حرام کیا، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ جھوٹی بات سب سے بڑے کبیرہ گناہوں میں سے ہے۔ اس نے مزید کہا کہ ان طبی امور میں جعل سازی کے معاشرے پر سنگین اثرات ہیں اور یہ متعلقہ اداروں کی بہت سی کوششوں کو ضائع کر سکتی ہے؛ جعلی سرٹیفکیٹ دینے والا گناہ میں مددگار اور شریک ہے، اور رشوت شامل ہو تو حرمت بڑھ جاتی ہے، اور [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے نتیجہ نکالا کہ طبی سرٹیفکیٹ اور ٹیسٹ پیش کرنے میں سچائی اختیار کرنا اور جعل سازی، جھوٹ اور حیلے سے بچنا سب پر واجب ہے، خاص طور پر جب پورے معاشرے کی سلامتی کا معاملہ ہو۔"
