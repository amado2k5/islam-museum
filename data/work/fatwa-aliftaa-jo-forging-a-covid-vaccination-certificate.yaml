id: work/fatwa-aliftaa-jo-forging-a-covid-vaccination-certificate
class: work
kind: fatwa
label: { ar: "تزوير شهادة مطعوم فيروس كورونا", en: "Forging a COVID-19 vaccination certificate", ur: "کورونا ویکسین سرٹیفکیٹ میں جعل سازی", es: "Falsificación de un certificado de vacunación contra la COVID-19", fr: "Falsification d'un certificat de vaccination contre la COVID-19", tr: "Koronavirüs aşı sertifikasının sahteciliği", id: "Pemalsuan sertifikat vaksinasi virus corona" }
summary:
  ar: "سؤال عن تزوير شهادة مطعوم فيروس كورونا، أجابت فيه دائرة الإفتاء العام الأردنية بأن تزوير شهادة المطعوم أو فحص كورونا كذب وغش وتزوير محرم، وأن مانح الشهادة المزورة شريك في الإثم، وتزداد الحرمة إن دفعت رشوة للحصول عليها. أجابت الدائرة بأن الأصل في المسلم التزام الصدق في أقواله وأفعاله مهما كانت الظروف، واستشهدت بـ[[passage/quran-9-119|سورة التوبة 9:119]]، وقالت إن من الصدق تقديم الفحوصات والشهادات الطبية السليمة التي تبين الحالة الصحية بشفافية، ومنها شهادة المطعوم وفحص الكشف عن الفيروس. وقالت إن إحضار شهادة مزورة تثبت تلقي المطعوم، أو فحص مزور يثبت عدم الإصابة، من الكذب والغش والتزوير المحرم، واستدلت بحديث رواه البخاري معناه أن قول الزور من أكبر الكبائر. وأضافت أن للتزوير في هذه الأمور الطبية أثرًا خطيرًا على المجتمع، وقد ينسف جهود الجهات المختصة، وأن من يمنح الشهادة المزورة معين وشريك في الإثم، وتزداد الحرمة إن تضمن الأمر رشوة، واستشهدت بـ[[passage/quran-5-2|سورة المائدة 5:2]]. وخلصت إلى وجوب تحري الصدق في تقديم الشهادات والفحوصات الطبية واجتناب التزوير والكذب والتحايل، لا سيما أن الأمر يتعلق بسلامة المجتمع كله."
  en: "A question about forging a COVID-19 vaccination certificate, in which Jordan's General Iftaa Department answered that forging a vaccination certificate or COVID-19 test is forbidden lying, cheating and forgery; whoever issues the forged certificate shares in the sin, and the prohibition is greater if a bribe is paid to obtain it. The Department answered that a Muslim is bound to truthfulness in word and deed whatever the circumstances, citing [[passage/quran-9-119|Surat al-Tawba 9:119]], and that truthfulness includes presenting genuine medical tests and certificates that honestly show one's state of health, among them vaccination certificates and tests for the virus. It said that producing a forged certificate showing that the holder has been vaccinated, or a forged test showing that he is not infected, is lying, cheating and forgery, which God has forbidden, citing a hadith narrated by al-Bukhari whose meaning is that false testimony is among the gravest of major sins. It added that forgery in such medical matters has serious consequences for society and can undo much of the work of the responsible authorities; whoever issues the forged certificate aids and shares in the sin, and the prohibition is greater if a bribe is involved, citing [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. It concluded that everyone must be truthful in presenting medical certificates and tests and avoid forgery, lying and trickery, especially since the safety of the whole society is at stake."
  ur: "کورونا ویکسین سرٹیفکیٹ میں جعل سازی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ویکسین سرٹیفکیٹ یا کورونا ٹیسٹ میں جعل سازی حرام جھوٹ، دھوکہ اور جعل سازی ہے؛ جعلی سرٹیفکیٹ جاری کرنے والا گناہ میں شریک ہے، اور اگر اس کے لیے رشوت دی جائے تو حرمت اور بڑھ جاتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان ہر حال میں اپنے قول و فعل میں سچائی کا پابند ہے، اور [[passage/quran-9-119|سورۃ التوبہ 9:119]] کا حوالہ دیا؛ اور سچائی میں درست طبی ٹیسٹ اور سرٹیفکیٹ پیش کرنا بھی شامل ہے جو صحت کی حالت کو دیانت سے ظاہر کریں، جن میں ویکسین سرٹیفکیٹ اور وائرس کا ٹیسٹ بھی ہے۔ اس نے کہا کہ ویکسین لگوانے کا جعلی سرٹیفکیٹ یا عدمِ انفیکشن کا جعلی ٹیسٹ پیش کرنا جھوٹ، دھوکہ اور جعل سازی ہے جسے اللہ نے حرام کیا، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ جھوٹی بات سب سے بڑے کبیرہ گناہوں میں سے ہے۔ اس نے مزید کہا کہ ان طبی امور میں جعل سازی کے معاشرے پر سنگین اثرات ہیں اور یہ متعلقہ اداروں کی بہت سی کوششوں کو ضائع کر سکتی ہے؛ جعلی سرٹیفکیٹ دینے والا گناہ میں مددگار اور شریک ہے، اور رشوت شامل ہو تو حرمت بڑھ جاتی ہے، اور [[passage/quran-5-2|سورۃ المائدہ 5:2]] کا حوالہ دیا۔ اس نے نتیجہ نکالا کہ طبی سرٹیفکیٹ اور ٹیسٹ پیش کرنے میں سچائی اختیار کرنا اور جعل سازی، جھوٹ اور حیلے سے بچنا سب پر واجب ہے، خاص طور پر جب پورے معاشرے کی سلامتی کا معاملہ ہو۔"
  es: "Una pregunta sobre la falsificación de un certificado de vacunación contra la COVID-19, a la que el Departamento General de Iftaa de Jordania respondió que falsificar un certificado de vacunación o una prueba de COVID-19 es mentir, engañar y falsificar, lo cual está prohibido. Quien emite el certificado falsificado participa en el pecado, y la prohibición es mayor si se paga un soborno para obtenerlo. El Departamento respondió que un musulmán está obligado a ser veraz en palabra y obra, cualesquiera que sean las circunstancias, citando [[passage/quran-9-119|Surat al-Tawba 9:119]], y que la veracidad incluye presentar pruebas y certificados médicos genuinos que muestren honestamente el estado de salud de una persona, entre ellos los certificados de vacunación y las pruebas para detectar el virus. Dijo que producir un certificado falsificado que muestre que el titular ha sido vacunado, o una prueba falsificada que muestre que no está infectado, es mentir, engañar y falsificar, lo cual Dios ha prohibido, citando un hadiz narrado por al-Bukhari cuyo significado es que el falso testimonio es uno de los pecados mayores más graves. Añadió que la falsificación en asuntos médicos tiene graves consecuencias para la sociedad y puede echar por tierra gran parte del trabajo de las autoridades competentes; quien emite un certificado falsificado participa en el pecado, y la prohibición es mayor si hay soborno de por medio, citando [[passage/quran-5-2|Surat al-Ma'ida 5:2]]. Concluyó que todos deben ser veraces al presentar certificados y pruebas médicas y evitar la falsificación, la mentira y el engaño, especialmente porque está en juego la seguridad de toda la sociedad."
  fr: "Concernant la falsification de certificats de vaccination contre la COVID-19, le Département général de la sagesse (Iftaa) de Jordanie a répondu que falsifier un certificat de vaccination ou un test COVID-19 est un acte interdit, assimilable à un mensonge, une tromperie et un faux. Quiconque délivre un certificat falsifié participe au péché, et l'interdiction est d'autant plus grave si un pot-de-vin est versé pour l'obtenir. Le Département a rappelé qu'un musulman est tenu à la sincérité en paroles et en actes, quelles que soient les circonstances, citant la sourate At-Tawba (9:119). La sincérité implique notamment de présenter des examens et des certificats médicaux authentiques attestant honnêtement de son état de santé, parmi lesquels les certificats de vaccination et les tests de dépistage du virus. Il a précisé que produire un certificat falsifié de vaccination ou un test falsifié de non-infection constitue un mensonge, une tromperie et un faux, actes interdits par Dieu, citant un hadith rapporté par al-Bukhari selon lequel le faux témoignage compte parmi les péchés les plus graves. Il a été ajouté que la falsification de documents médicaux a de graves conséquences pour la société et peut anéantir une grande partie du travail des autorités compétentes; quiconque délivre un certificat falsifié se rend complice de ce péché, et l’interdiction est d’autant plus grave si un pot-de-vin est impliqué (voir le verset 2 de la sourate 5 du Coran). Il a été conclu que chacun doit faire preuve de sincérité lors de la présentation de certificats et d’examens médicaux et éviter toute falsification, tout mensonge et toute tromperie, d’autant plus que la sécurité de toute la société est en jeu."
  tr: "Koronavirüs aşısı sertifikasının sahteciliğiyle ilgili bir soruda, Ürdün Genel Fetva Dairesi, aşı sertifikası veya koronavirüs testinin sahteciliğinin yalan olduğunu, dolandırıcılığın ve sahtekarlığın yasak olduğunu, sahte sertifikayı veren kişinin günaha ortak olduğunu ve rüşvet verilirse kutsallığın arttığını belirtti. Bakanlık, bir Müslümanın varsayılan ilkesinin koşullar ne olursa olsun sözlerinde ve davranışlarında dürüst olmak olduğunu belirterek, [[passage/kuran-9-119|Surah At-Tewbe 9:119]]'u atıfta bulunarak, sağlık durumunu şeffaf şekilde gösteren geçerli tıbbi testler ve sertifikaların sunmanın doğru olduğunu belirtti. Rapor, aşı olduğunu kanıtlayan sahte bir sertifika veya enfeksiyon olmadığını kanıtlayan sahte bir test getirmenin yalan, hile ve yasak sahtecilik olarak kabul edildiğini, El-Buhari'nin anlattığı bir hadise dayanarak, sahteciliğin en ağır günahlardan biri olduğunu belirtti. Bu tıbbi konularda sahteciliğin toplum üzerinde ciddi etkisi olduğu ve yetkili makamların çabalarını zayıflatabileceği, sahte belgeyi verenin günaha yardımcı ve suç ortağı olduğu ve rüşvet içeriyorsa kutsallığın arttığını ekledi. [[ayet/kuran-kuran-5-2|Mezide suresi 5:2]]'yi alıntıladı. Tıbbi tanıklık ve muayenelerde doğruluğun doğruluğunun doğrulanmasının ve sahtecilik, yalan ve aldatmanın önlenmesinin gerekli olduğunu, özellikle bunun tüm toplumun güvenliğini ilgilendirdiği için belirtti."
  id: "Sebuah pertanyaan tentang pemalsuan sertifikat vaksin virus corona, di mana Departemen Fatwa Umum Yordania menanggapi bahwa pemalsuan sertifikat vaksinasi atau tes virus corona adalah kebohongan, penipuan, dan pemalsuan dilarang, serta orang yang mengeluarkan sertifikat palsu adalah kaki tangan dalam dosa tersebut, dan kesucian meningkat jika suap dibayarkan untuk mendapatkannya. Departemen menjawab bahwa prinsip default pada seorang Muslim adalah jujur dalam kata-kata dan tindakannya tanpa memandang keadaan, dengan mengutip [[ayat/al-quran-9-119|Surah At-Tawbah 9:119], dan mengatakan bahwa adalah benar untuk memberikan tes medis yang valid dan sertifikat yang secara transparan menunjukkan kondisi kesehatan, termasuk sertifikat vaksinasi dan tes deteksi virus. Surat tersebut menyatakan bahwa membawa sertifikat palsu yang membuktikan vaksinasi atau tes palsu yang mengonfirmasi tidak ada infeksi dianggap sebagai kebohongan, kecurangan, dan pemalsuan yang dilarang, dengan mengutip hadits yang diceritakan oleh Al-Bukhari yang memalsukan adalah salah satu dosa paling berat. Ia menambahkan bahwa pemalsuan dalam urusan medis ini berdampak serius pada masyarakat dan dapat merusak upaya otoritas yang berwenang, dan siapa pun yang memberikan sertifikat palsu adalah pembantu dan kaki tangan dalam dosa, dan kesucian meningkat jika masalah tersebut melibatkan suap. Ia mengutip [[ayat/al-quran-5-2|Surah Al-Ma'idah 5:2]]. Ia menyimpulkan bahwa perlu memverifikasi kebenaran dalam penyampaian kesaksian medis dan pemeriksaan serta menghindari pemalsuan, kebohongan, dan penipuan, terutama karena hal ini menyangkut keselamatan seluruh masyarakat."
