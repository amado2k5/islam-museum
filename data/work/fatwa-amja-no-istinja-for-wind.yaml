id: work/fatwa-amja-no-istinja-for-wind
class: work
kind: fatwa
label: { ar: "لا استنجاء للريح", en: "No istinja for wind — it is not even legislated", ur: "ریح پر استنجاء نہیں", es: "No hay istinja para el viento; ni siquiera está legislado." }
summary:
  ar: "سأل سائل عن التثبت من مقولة عن الاستنجاء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81337 بتاريخ 19 أبريل 2010)⁩ أنه سبق أن أجيب عن هذا السؤال في فتوى سابقة وأنه لا يجب الاستنجاء بسبب خروج الريح بل لا يشرع أصلًا ومن أهل العلم من ذهب إلى أن من فعله معتقدًا مشروعيته فقد ارتكب بدعة فالاستنجاء إنما يكون من البول أو الغائط أو نحوهما مما يوجب التنظف على ما فصّل الجواب."
  en: "A questioner asked to verify a saying he had read about cleansing after wind. Dr. Salah al-Sawi (fatwa no. 81337, 19 April 2010) answered that a previous fatwa had covered it: istinja is not obligatory for passing wind — indeed it is not legislated at all; some scholars hold that whoever does it believing it prescribed commits an innovation, istinja belonging to urine, stool and the like requiring cleansing — as the answer details."
  ur: "ریح کے بعد استنجاء؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81337، 19 اپریل 2010)⁩ کے مطابق استنجاء صرف بول غائط کے لیے ہے — ریح پر واجب بھی نہیں بلکہ غیر مشروع۔"
  es: "Un consultante solicitó verificar un dicho que había leído sobre la purificación después de expulsar gases. El Dr. Salah al-Sawi (fatwa n.° 81337, 19 de abril de 2010) respondió que una fatwa anterior ya había abordado el tema: la istinja no es obligatoria para expulsar gases; de hecho, no está legislada en absoluto; algunos eruditos sostienen que quien la practica creyendo que es prescrita comete una innovación, ya que la istinja relacionada con la orina, las heces y similares requiere purificación, como se detalla en la respuesta."
