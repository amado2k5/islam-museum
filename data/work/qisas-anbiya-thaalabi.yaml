summary:
  ar: "كتاب في قصص الأنبياء المذكورة في القرآن لأبي إسحاق الثعلبي النيسابوري ⁦(ت 427هـ)⁩. يبدأ بمقدمة في حكمة قصّ الله أخبار الماضين، ثم بالكونيات، ثم بقصص الأنبياء بدءاً بآدم. الطبعة المفحوصة لم تُتحقق بعد."
  en: "Al-Tha'labi's collection of the stories of the prophets named in the Qur'an. It opens with why God narrates earlier histories, then cosmology, then the prophets, beginning with Adam. The edition used here is not yet verified."
  es: "La recopilación de Al-Tha'labi de las historias de los profetas mencionados en el Corán comienza con la explicación de por qué Dios narra historias anteriores, luego la cosmología y, finalmente, los profetas, empezando por Adán. La edición utilizada aquí aún no ha sido verificada."
  fr: "Le recueil d'Al-Tha'labi retrace les histoires des prophètes cités dans le Coran. Il commence par expliquer pourquoi Dieu relate les événements antérieurs, puis aborde la cosmologie, et enfin les prophètes, en commençant par Adam. L'édition utilisée ici n'est pas encore authentifiée."
  ur: "الثعلبی کا قرآن میں نام انبیاء کی کہانیوں کا مجموعہ۔ یہ اس بات سے کھلتا ہے کہ خدا کیوں پہلے کی تاریخیں بیان کرتا ہے، پھر کاسمولوجی، پھر انبیاء، آدم سے شروع ہوتا ہے۔ یہاں استعمال کیا گیا ایڈیشن ابھی تک تصدیق شدہ نہیں ہے۔"
