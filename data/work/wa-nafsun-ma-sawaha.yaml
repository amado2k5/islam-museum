kind: lecture-series
label:
  ar: "ونفس وما سوّاها (برنامج)"
  en: "Wa Nafsin wa ma Sawwaha (programme)"
  ur: "ونفسٍ وما سواہا (پروگرام)"
summary:
  ar: "برنامج قصير لعمر عبد الكافي في أرشيف أسابيل، في تسع وعشرين حلقة، عنوانه من آية سورة الشمس، يتناول في كل حلقة عنوانًا في تربية القرآن للنفس الإنسانية: مراتب النفس، والتوكل، والدعاء، والقول الحسن، والإخلاص، وغيرها."
  en: "A short programme by Omar Abdelkafy on the Assabile archive, twenty-nine episodes, titled from the verse of Surat al-Shams, each taking one heading on the Qur'an's training of the human soul: the degrees of the soul, trust in God, supplication, speaking well, sincerity and more."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا مختصر پروگرام، انتیس اقساط، جس کا عنوان سورہ شمس کی آیت سے ہے، اور ہر قسط انسانی نفس کی قرآنی تربیت کے ایک عنوان پر ہے: نفس کے مراتب، توکل، دعا، اچھی بات، اخلاص وغیرہ۔"
