summary:
  ar: "مختصر القدوري في فقه الحنفية لأحمد بن محمد القدوري البغدادي ⁦(ت. 428هـ)⁩ نثرية في نحو اثني عشر ألف مسألة جمعت زاد المتقن من فقه المذهب؛ من متون الحنفية المدرسية الكبرى التي عليها تبنى الشروح والحواشي {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  en: "Mukhtasar al-Quduri in Hanafi fiqh by Ahmad ibn Muhammad al-Quduri of Baghdad (d. 428 AH) — a prose manual of some twelve thousand mas'alas gathering the student's provision of the school's fiqh; one of the great Hanafi teaching mutun on which the shuruh and hawashi are built {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  es: "Mukhtasar al-Quduri en fiqh hanafi de Ahmad ibn Muhammad al-Quduri de Bagdad (m. 428 d. H.): un manual en prosa de unos doce mil mas'alas que reúne la provisión de fiqh de la escuela para los estudiantes; uno de los grandes mutun de enseñanza Hanafi sobre los cuales se construyen el shuruh y el hawashi {citar:al-mutun-al-ilmiyya-azhar} {citar:al-aalam}."
  fr: "Mukhtasar al-Quduri en fiqh Hanafi par Ahmad ibn Muhammad al-Quduri de Bagdad (mort en 428 AH) — un manuel en prose de quelque douze mille mas'alas rassemblant la fourniture par l'étudiant du fiqh de l'école; l'un des grands mutun d'enseignement Hanafi sur lequel sont construits le shuruh et le hawashi {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}."
  ur: "حنفی فقہ میں مختار القدوری بذریعہ احمد بن محمد القدوری بغداد ⁦(متوفی 428ھ)⁩ - تقریباً بارہ ہزار مسالوں پر مشتمل ایک نثری کتابچہ جس میں طالب علم کے اسکول کے فقہ کی فراہمی کو جمع کیا گیا ہے۔ ایک عظیم حنفی درس متون میں سے ایک جس پر شروح اور حواشی بنائے گئے ہیں"
  tr: "Ahmed ibn Muhammed el-Kudûrî el-Bağdadi'nin (ö. 428 Hicri) Mukhtasar al-Quduri fi Fiqh al-Hanafi adlı eseri, yaklaşık on iki bin sayıyı kapsayan ve mezhebin en kesin fıkıhının temelini toplayan bir düzyazıdır; bu metinler, tefsir ve notların dayandığı büyük Hanefi mezhebi metinlerinden. {atıf:al-mutun-al-ilmiyya-azhar} {atıf:al-aalam}."
  id: "Mukhtasar al-Quduri fi Fiqh al-Hanafi oleh Ahmad ibn Muhammad al-Quduri al-Baghdadi (wafat 428 H) adalah sebuah karya prosa yang mencakup sekitar dua belas ribu isu yang mengumpulkan dasar dari yurisprudensi paling tepat dari madhhab; dari teks-teks utama aliran Hanafi yang menjadi dasar komentar dan anotasi. {cite:al-mutun-al-ilmiyya-azhar} {cite:al-aalam}"
