label: { ar: "تهافت الفلاسفة", en: "Tahafut al-Falasifa", es: "Tahafut al-Falasifa", fr: "Tahafut al-Falasifa", ur: "تہافوت الفالصیفہ", tr: "Filozofların telaşı", id: "Gelombang para filsuf" }
summary:
  ar: "كتاب أبي حامد الغزالي المطبوع في نقد مذاهب الفلاسفة، من كتبه المذكورة مع الإحياء والاقتصاد في الاعتقاد ومقاصد الفلاسفة والمنقذ من الضلال {cite:al-aalam p. 970}. ردّ عليه ابن رشد بعد نحو قرن بكتاب «تهافت التهافت» {cite:al-aalam p. 849}."
  en: "Al-Ghazali's printed critique of the philosophers, listed among his works with the Ihya', Iqtisad, Maqasid and Munqidh {cite:al-aalam p. 970}; Ibn Rushd answered it a century later with Tahafut al-tahafut {cite:al-aalam p. 849}."
  es: "La crítica impresa de Al-Ghazali a los filósofos, incluida entre sus obras junto con el Ihya', el Iqtisad, el Maqasid y el Munqidh {cite:al-aalam p. 970}; Ibn Rushd la respondió un siglo después con el Tahafut al-tahafut {cite:al-aalam p. 849}."
  fr: "La critique imprimée des philosophes par Al-Ghazali, répertoriée parmi ses œuvres avec l'Ihya', l'Iqtisad, le Maqasid et le Munqidh {cite:al-aalam p. 970}; Ibn Rushd y a répondu un siècle plus tard avec le Tahafut al-tahafut {cite:al-aalam p. 849}."
  ur: "فلسفیوں پر الغزالی کی مطبوعہ تنقید، جو ان کی تصانیف میں احیا، اقتصاد، مقاصد اور مناقض کے ساتھ درج ہے۔ 970}; ابن رشد نے اس کا جواب ایک صدی بعد طحفوت التحفوت کے ساتھ دیا۔ 849}۔"
  tr: "Ebu Hamid el-Gazali'nin eleştirisinde yayımlanan eleştiri, el-İhya, el-İğtiqad, Maqasid el-Falasifah ve el-Mukaddh min el-Dalal ile birlikte bahsettiği eserler arasında yer alır {atıf:al-aalam s. 970}. İbn Rüşd yaklaşık bir yüzyıl sonra buna \"Uyumsuzluğun Uyumsuzluğu\" adlı kitabıyla yanıt verdi {cite:al-aalam, s. 849}."
  id: "Kitab Abu Hamid al-Ghazali, yang dicetak dalam kritik aliran filsuf, termasuk di antara karya-karyanya yang disebutkan bersama al-Ihya, al-Iqtisad fi al-'I'tiqad, Maqasid al-Falasifah, dan al-Muqaddh min al-Dalal {cite:al-aalam hlm. 970}. Ibn Rushd menanggapinya sekitar satu abad kemudian dengan buku \"The Incoherence of Incoherence\" {cite:al-aalam, hlm. 849}."
