summary:
  ar: "كتاب أبي حامد الغزالي المطبوع في نقد مذاهب الفلاسفة، من كتبه المذكورة مع الإحياء والاقتصاد في الاعتقاد ومقاصد الفلاسفة والمنقذ من الضلال {cite:al-aalam p. 970}. ردّ عليه ابن رشد بعد نحو قرن بكتاب «تهافت التهافت» {cite:al-aalam p. 849}."
  en: "Al-Ghazali's printed critique of the philosophers, listed among his works with the Ihya', Iqtisad, Maqasid and Munqidh {cite:al-aalam p. 970}; Ibn Rushd answered it a century later with Tahafut al-tahafut {cite:al-aalam p. 849}."
  es: "La crítica impresa de Al-Ghazali a los filósofos, incluida entre sus obras junto con el Ihya', el Iqtisad, el Maqasid y el Munqidh {cite:al-aalam p. 970}; Ibn Rushd la respondió un siglo después con el Tahafut al-tahafut {cite:al-aalam p. 849}."
  fr: "La critique imprimée des philosophes par Al-Ghazali, répertoriée parmi ses œuvres avec l'Ihya', l'Iqtisad, le Maqasid et le Munqidh {cite:al-aalam p. 970}; Ibn Rushd y a répondu un siècle plus tard avec le Tahafut al-tahafut {cite:al-aalam p. 849}."
