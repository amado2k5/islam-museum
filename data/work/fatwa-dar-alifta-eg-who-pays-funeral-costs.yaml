id: work/fatwa-dar-alifta-eg-who-pays-funeral-costs
class: work
kind: fatwa
label: { ar: "من تلزمه نفقة تجهيز الميت", en: "Who bears the cost of preparing the deceased", ur: "میت کی تدفین و تکفین کا خرچ کس پر ہے", es: "¿Quién corre con los gastos de la preparación del difunto?", fr: "Qui prend en charge les frais de préparation du défunt", tr: "Ölen kişinin hazırlanması masraflarını kim ödemekle yükümlüdür", id: "Siapa yang diwajibkan membayar biaya persiapan almarhum" }
summary:
  ar: "سائل سأل عمّن تلزمه نفقة تجهيز الميت. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22224)⁩ أن الأصل أن تكون نفقة التجهيز في تركة الميت إن ترك مالًا، فإن لم يكن له مال انتقلت إلى من تلزمه نفقته، فإن لم يوجد فعلى بيت المال، على ما فصّل الجواب."
  en: "A questioner asked who bears the cost of preparing the deceased. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22224) answered that the default is that preparation costs come out of the deceased's estate if he left money; if he had none, it passes to whoever is obliged to support him; failing that, to the public treasury — as the answer details."
  ur: "ایک سائل نے پوچھا کہ میت کی تدفین و تکفین کا خرچ کس پر واجب ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22224)⁩ نے جواب دیا کہ اصولاً خرچ میت کی ترکہ سے ادا ہوتا ہے اگر اس نے مال چھوڑا ہو؛ اگر مال نہ ہو تو وہ شخص ذمہ دار ہے جس پر اس کی نفقہ تھی؛ نہ ہو تو بیت المال سے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó quién sufraga los gastos de la preparación del difunto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22224) respondió que, por defecto, los gastos de preparación se cubren con el patrimonio del difunto si dejó dinero; si no lo dejó, se destinan a quien esté obligado a mantenerlo; y, en su defecto, al erario público, como se detalla en la respuesta."
  fr: "Une personne a demandé qui prend en charge les frais de préparation du défunt. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22224) a répondu que, par défaut, ces frais sont prélevés sur la succession du défunt s'il a laissé des ressources; sinon, ils reviennent à la personne tenue de subvenir à ses besoins; à défaut, au Trésor public, comme le précise la réponse."
  tr: "Bir soru soran kişi, ölenin hazırlanması için kimin ödeme yapmakla yükümlü olduğunu sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22224), hazırlık için yapılan nafakanın merhumun mirasında olduğunu, para bırakırsa paranın geçimini sağlayan kişiye geçtiğini; yoksa cevabda ayrıntılı olarak belirtildiği gibi, bu para kamu hazinesine aittir."
  id: "Seorang penanya menanyakan siapa yang wajib membayar persiapan almarhum. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22224) menjawab bahwa kelemahan adalah nafkah untuk persiapan berada di harta almarhum jika ia meninggalkan uang; jika tidak memiliki uang, uang itu beralih kepada orang yang bertanggung jawab atas nafkahnya; jika tidak, maka uang itu berada di kas negara, seperti yang dijelaskan dalam jawaban."
