summary:
  ar: "سائل سأل عن ذبح الأضحية ليلًا في أيام التشريق. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20814)⁩ أنه يجوز ذبح الأضحية ليلًا أو نهارًا ولا حرج في ذلك شرعًا."
  en: "A questioner asked about slaughtering the udhiyya at night in the days of tashriq. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20814) answered that slaughtering night or day is permissible without blame."
  ur: "ایک سائل نے ایام تشریق میں رات کو قربانی ذبح کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20814)⁩ نے جواب دیا کہ دن رات دونوں وقت ذبح جائز ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de sacrificar a los udhiyya por la noche durante los días de tashriq. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20814) respondió que el sacrificio, ya sea de día o de noche, está permitido sin que haya culpa alguna."
