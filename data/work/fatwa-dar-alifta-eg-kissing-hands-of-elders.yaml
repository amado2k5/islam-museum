id: work/fatwa-dar-alifta-eg-kissing-hands-of-elders
class: work
kind: fatwa
label: { ar: "حكم تقبيل يد الوالدين والعلماء والصالحين", en: "Kissing the hands of parents, scholars and the righteous", ur: "والدین، علماء اور صالحین کے ہاتھ چومنے کا حکم", es: "Besar las manos de los padres, los eruditos y los justos", fr: "Baiser les mains des parents, des érudits et des justes", tr: "Ebeveynlerin, bilginlerin ve doğru insanların elini öpme kararı", id: "Putusan tentang mencium tangan orang tua, cendekiawan, dan orang-orang benar" }
summary:
  ar: "سائل سأل عن تقبيل يد الوالدين والعلماء والصالحين وكبار السن والمشايخ والأجداد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22051)⁩ أن ذلك يُسنّ وقد جاءت به السنة التقريرية، على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about kissing the hands of parents, scholars, the righteous, elders, shaykhs and grandparents. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22051) answered that it is recommended — the tacit sunna records it — under the controls the answer details."
  ur: "ایک سائل نے والدین، علماء، صالحین، بزرگوں، مشائخ اور دادا دادی کے ہاتھ چومنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22051)⁩ نے جواب دیا کہ یہ مستحب ہے اور سنتِ تقریری اس پر قائم ہے، جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Un consultante preguntó acerca de besar las manos de padres, eruditos, justos, ancianos, jeques y abuelos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22051) respondió que es recomendable —la sunna tácita lo registra—, y en los detalles de la respuesta se encuentran bajo los controles."
  fr: "Un internaute a posé une question concernant le fait de baiser la main de ses parents, des savants, des pieux, des aînés, des cheikhs et des grands-parents. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22051) a répondu que cela est recommandé – la sunna tacite le mentionne – sous réserve des conditions précisées dans la réponse."
  tr: "Bir soru soran kişi ebeveynlerin, alimlerin, doğru insanların, yaşlıların, şeyhlerin ve dedelerin elini öpmeyi sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 22051) bunun Sünnet olduğunu ve ayrıntılı kriterlere dayanarak yerleşik Sünnet tarafından getirildiğini yanıtladı."
  id: "Seorang penanya bertanya tentang mencium tangan orang tua, ulama, orang yang benar, orang tua, sheikh, dan kakek. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22051) menjawab bahwa ini adalah Sunnah dan dibawa oleh Sunnah yang sudah mapan, berdasarkan kriteria rinci."
