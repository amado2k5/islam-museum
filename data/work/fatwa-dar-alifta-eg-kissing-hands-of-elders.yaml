summary:
  ar: "سائل سأل عن تقبيل يد الوالدين والعلماء والصالحين وكبار السن والمشايخ والأجداد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22051)⁩ أن ذلك يُسنّ وقد جاءت به السنة التقريرية، على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about kissing the hands of parents, scholars, the righteous, elders, shaykhs and grandparents. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22051) answered that it is recommended — the tacit sunna records it — under the controls the answer details."
  ur: "ایک سائل نے والدین، علماء، صالحین، بزرگوں، مشائخ اور دادا دادی کے ہاتھ چومنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22051)⁩ نے جواب دیا کہ یہ مستحب ہے اور سنتِ تقریری اس پر قائم ہے، جواب کے بیان کردہ ضوابط کے ساتھ۔"
