label: { ar: "قرار مجمع الفقه الإسلامي الدولي 133 (14/7) بشأن مشكلة المتأخرات في المؤسسات المالية الإسلامية", en: "IIFA resolution 133 (14/7) on the arrears problem in Islamic financial institutions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 133 (14/7): اسلامی مالی اداروں میں تاخیر شدہ وصولیوں کا مسئلہ", es: "Resolución 133 (14/7) de la IIFA sobre el problema de los impagos en las instituciones financieras islámicas.", fr: "Résolution 133 (14/7) de l'IIFA sur le problème des arriérés dans les institutions financières islamiques", tr: "İslami finans kurumlarındaki borç gecikmeleri sorununa ilişkin Uluslararası İslami Fiqh Akademisi Kararı 133 (14/7)", id: "Resolusi Akademi Fiqh Islam Internasional 133 (14/7) mengenai masalah tunggakan di lembaga keuangan Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة عشرة بالدوحة ⁦(8–13 ذو القعدة 1423هـ، 11–16 يناير 2003م)⁩. لاحظ أن معالجة مشكلة المتأخرات في المؤسسات المالية الإسلامية تختلف عن أسلوب البنوك التقليدية المتعاملة بالفائدة المحرمة، وأكد تحريم الفوائد البنكية: فقوانين البنوك تمنعها من الاستثمار على الربح والخسارة، وتتلقى الودائع بوصفها قروضًا وتحصر وظيفتها في الإقراض والاقتراض بفائدة وخلق الائتمان بفائدة. ثم ساق العلاقة بين العميل والمؤسسة الإسلامية وما تملكه من وسائل مشروعة للتحصيل والتعامل مع المماطل والمعسر، وضوابط ذلك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 14th session in Doha (8–13 Dhu al-Qa'da 1423, 11–16 January 2003). It noted that handling arrears in Islamic financial institutions differs from conventional banks' method, which deals in prohibited interest, and reaffirmed the prohibition of bank interest: banking laws bar conventional banks from profit-and-loss investment, they take deposits as loans, and confine themselves to lending and borrowing at interest and creating credit at interest. It then set out the Islamic institution's relationship with its client and the lawful means of collection and treatment of the procrastinating and the genuinely insolvent debtor, with their controls."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چودہویں مجلس ⁦(8–13 ذوالقعدہ 1423ھ، 11–16 جنوری 2003ء)⁩ میں۔ اس نے یاد دلایا کہ اسلامی مالی اداروں میں تاخیر شدہ وصولیوں کا معاملہ روایتی بینکوں کے سودی طریقے سے مختلف ہے، اور بینکی سود کی حرمت کی تاکید کی: بینک قوانین انہیں منفع-نقصان کی سرمایہ کاری سے روکتے ہیں، جمع آمد قرض کے طور پر لیتے ہیں، اور ان کا کام صرف سود پر قرض دینا، لینا اور کریڈٹ پیدا کرنا ہے۔ پھر اسلامی ادارے اور صارف کے تعلق اور ٹال مٹول کرنے والے اور واقعی نادار قرض دار سے جائز وصولی اور برتاؤ کے ضوابط بیان کیے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 14.ª sesión en Doha (8-13 de Dhu al-Qa'da de 1423, 11-16 de enero de 2003). En ella se señaló que la gestión de los impagos en las instituciones financieras islámicas difiere del método de los bancos convencionales, que aplican intereses prohibidos, y se reafirmó la prohibición de los intereses bancarios: las leyes bancarias prohíben a los bancos convencionales las inversiones con fines de lucro, aceptan depósitos como préstamos y se limitan a prestar y pedir prestado con intereses y a crear crédito con intereses. A continuación, se expuso la relación de la institución islámica con su cliente y los medios legales de cobro y tratamiento del deudor moroso y del deudor genuinamente insolvente, con sus respectivos controles."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 14e session à Doha (8-13 Dhu al-Qa'da 1423, 11-16 janvier 2003). Elle a constaté que la gestion des arriérés dans les institutions financières islamiques diffère de celle des banques conventionnelles, qui pratiquent des intérêts interdits, et a réaffirmé l'interdiction des intérêts bancaires: la législation bancaire interdit aux banques conventionnelles les investissements à but lucratif, elles considèrent les dépôts comme des prêts et se limitent aux opérations de prêt et d'emprunt à intérêt, ainsi qu'à l'octroi de crédit à intérêt. Elle a ensuite exposé la relation de l'institution islamique avec son client et les moyens licites de recouvrement et de traitement des débiteurs en retard de paiement et des débiteurs véritablement insolvables, ainsi que les mécanismes de contrôle applicables."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki on dördüncü oturumunda (8–13 Dhu al-Qi'dah 1423 H, 11–16 Ocak 2003) toplu kararı. İslami finans kurumlarındaki borç sorununun ele alınması, yasaklı faizle ilgilenen geleneksel bankaların yaklaşımından farklı olduğunu ve banka faizlerinin yasaklanmasını vurguladığını belirtmiştir: bankacılık yasaları, bankaların kâr ve zarara yatırım yapmasını, mevduatları kredi olarak kabul etmelerini ve işlevlerini faizli kredi verme ile sınırlandırır. Ardından, müşteri ile İslami kurum arasındaki ilişkiyi, tahsilat ve erteleyenler ile iflasla ilgilenmek için sahip olduğu meşru araçları ve bunun için düzenlemeleri özetlemiştir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi keempat belas di Doha (8–13 Dhu al-Qi'dah 1423 H, 11–16 Januari 2003). Perlu dicatat bahwa menangani masalah tunggakan di lembaga keuangan Islam berbeda dengan pendekatan bank konvensional yang menangani bunga terlarang, dan menekankan larangan bunga bank: hukum perbankan melarang mereka berinvestasi dalam untung rugi, menerima simpanan sebagai pinjaman, dan membatasi fungsinya hanya pada pemberian pinjaman dengan bunga dan pembuatan kredit dengan bunga. Kemudian ia menguraikan hubungan antara nasabah dan institusi Islam serta sarana sah yang dimiliki untuk menagih dan menangani penundaan dan kebangkrutan, serta regulasi untuk hal itu."
