label: { ar: "أبيات الفضل بن العباس «مهلا بني عمنا مهلا موالينا»", en: "al-Fadl ibn al-Abbas's verses 'Gently, sons of our uncle'", es: "Versos de al-Fadl ibn al-Abbas: \"Con humildad, hijos de nuestro tío\".", fr: "Vers d'al-Fadl ibn al-Abbas « Doucement, fils de notre oncle »", ur: "الفضل بن العباس کی آیات 'آہستگی سے ہمارے چچا کے بیٹے'", tr: "Al-Fadl ibn Al-Abbas'ın Dizeleri: \"Bekleyin, kuzenlerimiz, bekleyin, sadıklarımız.\"", id: "Ayat-ayat Al-Fadl ibn Al-Abbas: \"Tunggu, sepupu kita, tunggu, yang setia kita.\"" }
summary:
  ar: "أبيات في ديوان الحماسة من البسيط على روي النون، للفضل بن العباس بن عتبة بن أبي لهب يخاطب بها بني أمية {{cite:hamasa-abu-tammam-ed-1916 p.66}}."
  en: "Verses in the Diwan al-Hamasa in the basit metre on the rhyme nun, by al-Fadl ibn al-Abbas ibn Utba ibn Abi Lahab, addressed to the Umayyads {{cite:hamasa-abu-tammam-ed-1916 p.66}}."
  es: "Versos del Diwan al-Hamasa en metro basit sobre la rima nun, de al-Fadl ibn al-Abbas ibn Utba ibn Abi Lahab, dirigidos a los Omeyas {{cite:hamasa-abu-tammam-ed-1916 p.66}}."
  fr: "Versets du Diwan al-Hamasa en mètre basit sur la rime nun, par al-Fadl ibn al-Abbas ibn Utba ibn Abi Lahab, adressés aux Omeyyades {{cite:hamasa-abu-tammam-ed-1916 p.66}}."
  ur: "الفضل ابن العباس ابن عتبہ ابن ابی لہب کی نظم نون پر باسط میٹر میں دیوان الحمسہ میں آیات، امویوں سے خطاب {{حوالہ: حماسہ-ابو-تمام-ایڈ-1916 p.66}}۔"
  tr: "Al-Fadl ibn Al-Abbas ibn Utbah ibn Ebbi Lahab'ın Emevilere hitap ettiği Rahibenin Anlatımı üzerine Hamasa Diwanı'ndaki diirler {{cite:hamasa-abu-tammam-ed-1916 s.66}}."
  id: "Ayat-ayat dalam Diwan Hamasa dari Al-Basit tentang Narratikan Biarawati, oleh Al-Fadl ibn Al-Abbas ibn Utbah ibn Abi Lahab, yang ditujukan kepada Umayyah {{cite:hamasa-abu-tammam-ed-1916 hlm.66}}."
