summary:
  ar: "كتاب بالإنجليزية لروبرت هيلينبراند عن أنماط العمارة الإسلامية وشكلها ووظيفتها ومعناها، صدر عن مطبعة جامعة إدنبرة وطبعة لمطبعة جامعة كولومبيا سنة 1994."
  en: "An English book by Robert Hillenbrand on the building types of Islamic architecture, their form, function and meaning, published by Edinburgh University Press (and Columbia University Press) in 1994."
  ur: "رابرٹ ہلن برانڈ کی انگریزی کتاب جو اسلامی فنِ تعمیر کی عمارتوں کی اقسام، ان کی ہیئت، کارکردگی اور معنی پر ہے؛ ایڈنبرا یونیورسٹی پریس ⁦(اور کولمبیا یونیورسٹی پریس)⁩ سے 1994ء میں شائع ہوئی۔"
  fr: "Islamic Architecture: Form, Function and Meaning est un ouvrage de référence de Robert Hillenbrand, publié par Edinburgh University Press en 1994. Selon la présentation de l'éditeur, il passe en revue les grands types d'édifices du monde islamique : l'architecture religieuse (la mosquée, le minaret, la madrasa), le mausolée, puis le caravansérail et le palais pour le versant profane."
  es: "Islamic Architecture: Form, Function and Meaning es una obra de referencia de Robert Hillenbrand, publicada por Edinburgh University Press en 1994. Según la presentación del editor, recorre los grandes tipos de edificios del mundo islámico: la arquitectura religiosa (la mezquita, el alminar, la madrasa), el mausoleo, y el caravasar y el palacio en el ámbito civil."
  tr: "Islamic Architecture: Form, Function and Meaning, Robert Hillenbrand'ın 1994'te Edinburgh University Press tarafından yayımlanan başvuru eseridir. Yayıncının tanıtımına göre kitap İslam dünyasının başlıca yapı türlerini inceler: dinî mimari (cami, minare, medrese), türbe ve sivil tarafta kervansaray ile saray."
  id: "Islamic Architecture: Form, Function and Meaning adalah karya rujukan Robert Hillenbrand terbitan Edinburgh University Press tahun 1994. Menurut deskripsi penerbit, buku ini meninjau jenis-jenis bangunan utama dunia Islam: arsitektur keagamaan (masjid, menara, madrasah), makam, serta karavanserai dan istana di sisi sekuler."
