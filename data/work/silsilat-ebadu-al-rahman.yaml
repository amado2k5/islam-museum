id: work/silsilat-ebadu-al-rahman
class: work
kind: lecture-series
label:
  ar: "سلسلة عباد الرحمن ⁦(دروس رمضان)⁩"
  en: "Silsilat Ibab al-Rahman (Ramadan lessons)"
  ur: "سلسلہ عباد الرحمٰن ⁦(رمضان کے اسباق)⁩"
summary:
  ar: "سلسلة دروس يومية لعمر عبد الكافي في شهر رمضان، يتناول فيها صفات «عباد الرحمن» المذكورة في سورة الفرقان: التواضع، والذين يمشون على الأرض هونا، والذين يبيتون لربهم سجدا وقياما، وغير ذلك من الصفات التسع — مع بيان كيف يكون المسلم من عباد الرحمن عمليًا في هذا الشهر."
  en: "A daily lesson series by Omar Abdelkafy in the month of Ramadan, expounding the attributes of 'the servants of the Most Merciful' named in Surat al-Furqan: humility, those who walk the earth gently, those who spend the night prostrating and standing for their Lord, and the rest of the nine attributes — with practical guidance on how a Muslim becomes one of them in this month."
  ur: "رمضان کے مہینے میں عمر عبد الکافی کا روزانہ درسی سلسلہ جس میں وہ سورہ الفرقان میں مذکور «عباد الرحمٰن» کی صفات بیان کرتے ہیں: تواضع، جو زمین پر نرمی سے چلتے ہیں، جو رات کو Rabb کے لیے سجدے اور قیام میں گزارتے ہیں، اور باقی نو صفات — اور اس مہینے میں مسلمان کا ان میں سے کیسے بنے اس کی عملی رہنمائی۔"
