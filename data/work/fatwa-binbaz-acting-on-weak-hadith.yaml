id: work/fatwa-binbaz-acting-on-weak-hadith
class: work
kind: fatwa
label: { ar: "هل يُعمل بالحديث الضعيف؟", en: "Acting on a weak hadith", ur: "کیا ضعیف حدیث پر عمل کیا جائے؟", es: "Actuar basándose en un hadiz débil", fr: "Agir sur la base d'un hadith faible", tr: "Zayıf hadis işe yarıyor mu?", id: "Apakah hadits lemah berhasil?" }
summary:
  ar: "سؤال مختصر عن العمل بالحديث الضعيف. أجاب ابن باز بأن الضعيف أقسام: ما كان حسنًا جيد الإسناد يُعمل به، وما كان شديد الضعف لا يُعمل به، ومثّل لشدة الضعف بأن يكون في الإسناد كذّاب أو راوٍ سيئ الحفظ جدًّا أو انقطاع في السند."
  en: "A short question on acting upon a weak hadith. Ibn Baz answered that \"weak\" covers several grades: a report that is hasan with a good chain is acted upon, while a severely weak one is not, giving as examples of severe weakness a liar in the chain, a narrator of very poor memory, or a break in the chain."
  ur: "ضعیف حدیث پر عمل کے بارے میں ایک مختصر سوال۔ ابن باز نے جواب دیا کہ ضعیف کی کئی قسمیں ہیں: جو حسن اور عمدہ سند والی ہو اس پر عمل کیا جاتا ہے، اور جو سخت ضعیف ہو اس پر عمل نہیں کیا جاتا؛ سخت ضعف کی مثال میں سند میں جھوٹا راوی، بہت کمزور حافظے والا راوی یا سند کا انقطاع ذکر کیا۔"
  es: "Una pregunta breve sobre cómo actuar en base a un hadiz débil. Ibn Baz respondió que \"débil\" abarca varios grados: se actúa en base a un relato hasan con una buena cadena de transmisión, mientras que no se actúa en base a uno muy débil, dando como ejemplos de debilidad severa a un mentiroso en la cadena, un narrador con muy mala memoria o una interrupción en la cadena."
  fr: "Une brève question concernant la conduite à tenir face à un hadith faible. Ibn Baz répondit que le terme « faible » recouvre plusieurs degrés: un hadith hasan avec une bonne chaîne de transmission est pris en compte, tandis qu’un hadith très faible ne l’est pas, citant comme exemples de faiblesse extrême un menteur dans la chaîne, un narrateur à la mémoire très défaillante ou une rupture dans la chaîne."
  tr: "Zayıf hadislere göre hareket etme hakkında kısa bir soru. İbn Baz zayıflığın çeşitli türlerde olduğunu yanıtladı: zincirde iyi ve iyi olan harekete geçirilir, çok zayıf olan ise uygulanmaz. Ciddi zayıflığa örnek olarak, zincirde bir yalancı, çok zayıf hafızaya sahip bir anlatıcı veya zincirde bir kopukluk bulunur."
  id: "Pertanyaan singkat tentang tindakan atas hadits lemah. Ibn Baz menjawab bahwa lemah memiliki berbagai jenis: apa yang baik dan baik dalam rantai ditindaklanjuti, dan apa yang sangat lemah tidak ditindaklanjuti. Contoh kelemahan berat adalah rantai tersebut berisi pembohong, narator dengan ingatan yang sangat buruk, atau terputus dalam rantai."
