id: work/fatwa-binbaz-acting-on-weak-hadith
class: work
kind: fatwa
label: { ar: "هل يُعمل بالحديث الضعيف؟", en: "Acting on a weak hadith", ur: "کیا ضعیف حدیث پر عمل کیا جائے؟" }
summary:
  ar: "سؤال مختصر عن العمل بالحديث الضعيف. أجاب ابن باز بأن الضعيف أقسام: ما كان حسنًا جيد الإسناد يُعمل به، وما كان شديد الضعف لا يُعمل به، ومثّل لشدة الضعف بأن يكون في الإسناد كذّاب أو راوٍ سيئ الحفظ جدًّا أو انقطاع في السند."
  en: "A short question on acting upon a weak hadith. Ibn Baz answered that \"weak\" covers several grades: a report that is hasan with a good chain is acted upon, while a severely weak one is not, giving as examples of severe weakness a liar in the chain, a narrator of very poor memory, or a break in the chain."
  ur: "ضعیف حدیث پر عمل کے بارے میں ایک مختصر سوال۔ ابن باز نے جواب دیا کہ ضعیف کی کئی قسمیں ہیں: جو حسن اور عمدہ سند والی ہو اس پر عمل کیا جاتا ہے، اور جو سخت ضعیف ہو اس پر عمل نہیں کیا جاتا؛ سخت ضعف کی مثال میں سند میں جھوٹا راوی، بہت کمزور حافظے والا راوی یا سند کا انقطاع ذکر کیا۔"
