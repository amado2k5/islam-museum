summary:
  ar: "كتاب بالإنجليزية لتوبي هاف يقارن نشأة العلم الحديث في العالم الإسلامي والصين والغرب، صدر عن مطبعة جامعة كامبريدج سنة 1993."
  en: "An English book by Toby E. Huff comparing the rise of modern science in the Islamic world, China and the West, published by Cambridge University Press in 1993."
  ur: "ٹوبی ہف کی انگریزی کتاب جو عالمِ اسلام، چین اور مغرب میں جدید سائنس کے آغاز کا موازنہ کرتی ہے؛ کیمبرج یونیورسٹی پریس سے 1993ء میں شائع ہوئی۔"
  fr: "The Rise of Early Modern Science: Islam, China, and the West est un livre d'histoire des sciences de Toby E. Huff, publié par Cambridge University Press le 24 septembre 1993. Selon le résumé de l'éditeur, il étudie la vieille question de savoir pourquoi la science moderne est née seulement en Occident et non dans les civilisations de l'islam ou de la Chine, alors qu'au Moyen Âge l'islam et la Chine étaient plus avancés scientifiquement."
  es: "The Rise of Early Modern Science: Islam, China, and the West es un libro de historia de la ciencia de Toby E. Huff, publicado por Cambridge University Press el 24 de septiembre de 1993. Según la sinopsis del editor, estudia la vieja pregunta de por qué la ciencia moderna surgió solo en Occidente y no en las civilizaciones del islam o de China, aunque en la Edad Media el islam y China estaban más avanzados científicamente."
  tr: "The Rise of Early Modern Science: Islam, China, and the West, Toby E. Huff'ın 24 Eylül 1993'te Cambridge University Press tarafından yayımlanan bilim tarihi kitabıdır. Yayıncının özetine göre kitap, Orta Çağ'da bilimde daha ileri olmalarına rağmen modern bilimin neden İslam ya da Çin medeniyetlerinde değil yalnızca Batı'da doğduğu yolundaki eski soruyu inceler."
  id: "The Rise of Early Modern Science: Islam, China, and the West adalah buku sejarah sains karya Toby E. Huff, terbitan Cambridge University Press pada 24 September 1993. Menurut sinopsis penerbit, buku ini mengkaji pertanyaan lama mengapa sains modern hanya lahir di Barat dan tidak di peradaban Islam atau Tiongkok, padahal pada Abad Pertengahan Islam dan Tiongkok lebih maju dalam sains."
