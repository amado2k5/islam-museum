label: { ar: "قرار مجمع الفقه الإسلامي الدولي 239 (25/1) بشأن حكم التعليم بشقيه الديني والدنيوي للذكور والإناث في الإسلام", en: "IIFA resolution 239 (25/1) on the ruling on religious and worldly education for males and females in Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 239 (25/1): اسلام میں مردوں اور عورتوں کے لیے دینی و دنیاوی تعلیم کا حکم", es: "Resolución 239 (25/1) de la IIFA sobre la normativa relativa a la educación religiosa y secular de hombres y mujeres en el Islam.", fr: "Résolution 239 (25/1) de l'IIFA sur la décision relative à l'éducation religieuse et profane des hommes et des femmes en islam", tr: "Uluslararası İslami Fiqh Akademisi Kararı 239 (25/1), İslam'da hem dini hem de seküler yönleriyle eğitim kararına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 239 (25/1) mengenai aturan pendidikan baik dalam aspek agama maupun sekuler untuk laki-laki dan perempuan dalam Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. عرّف المجمع التعليم في الإسلام بأنه اكتساب القيم والمبادئ والمعارف والمهارات التي تعين الإنسان على عبادة الله وعمارة الكون، وقرر أن تعليم الذكور والإناث العلوم النافعة حق على الأسرة والمجتمع والدولة في جميع أنواع التعليم ومراحله، وأن التعليم المأمور به يشمل ما يحقق المصالح الضرورية الخمس والحاجية والتحسينية، دينيًا ودنيويًا، وأن الإنفاق عليه واجب شرعي، وأنه لا يجوز شرعًا حرمان أي من الذكر والأنثى من أي نوع من التعليم النافع. وأوصى بمعالجة الفتاوى الشاذة المانعة لتعليم المرأة والرد على حجج حرمانها، ومناشدة الحكومات تمكين الذكور والإناث من التعليم وبخاصة تعليم البنات. واستند إلى قراراته السابقة 38 ⁦(4/13)⁩ و164 ⁦(18/2)⁩ و169 ⁦(18/7)⁩ و236 ⁦(24/7)⁩ وإلى بيان الأمانة العامة بشأن تعليق دراسة البنات والفتيات في أفغانستان ⁦(22 ديسمبر 2022م)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). It defined education in Islam as acquiring the values, principles, knowledge and skills that help a person worship God and cultivate the world, and ruled that educating males and females in beneficial sciences is a right owed by the family, society and state in every kind and stage of education; that the required education covers whatever serves the five necessary interests and the need-based and ameliorative interests, religious and worldly alike; that spending on it is a sharia duty; and that it is not lawful to deprive either male or female of any kind of beneficial education. It recommended addressing anomalous fatwas that bar women from learning, rebutting the arguments for depriving women of education, and urging governments to enable the education of males and females, girls' education in particular. It drew on its earlier resolutions 38 (4/13), 164 (18/2), 169 (18/7) and 236 (24/7) and on the General Secretariat's statement on the suspension of girls' education in Afghanistan (22 December 2022)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے اسلام میں تعلیم کی تعریف ایسے اقدار، اصولوں، علم اور مہارتوں کے حصول کے طور پر کی جو انسان کو عبادتِ الٰہی اور آبادکاریِ کائنات میں مدد دیں، اور فیصلہ کیا کہ مردوں اور عورتوں کو مفید علوم کی تعلیم دینا خاندان، معاشرے اور ریاست کا حق ہے، ہر قسم اور ہر مرحلے کی تعلیم میں؛ کہ مطلوبہ تعلیم وہ سب شامل ہے جو پانچ ضروری مصالح اور حاجی و تحسینی مصالح کو پورا کرے، دینی ہو یا دنیاوی؛ کہ اس پر خرچ کرنا شرعی واجب ہے؛ اور کہ کسی بھی مرد یا عورت کو کسی قسم کی مفید تعلیم سے محروم کرنا شرعاً جائز نہیں۔ سفارشات میں خواتین کی تعلیم پر پابندی لگانے والے شاذ فتاوى کا ازالہ، محرومی کی دلیلوں کا رد، اور حکومتوں سے مرد و زن کی تعلیم — بالخصوص لڑکیوں کی تعلیم — کے ممکن بنانے کی اپیل شامل ہے۔ اکیڈمی نے اپنی سابقہ قراردادیں 38 ⁦(4/13)⁩، 164 ⁦(18/2)⁩، 169 ⁦(18/7)⁩ اور 236 ⁦(24/7)⁩ اور افغانستان میں لڑکیوں کی تعلیم کے تعلق پر جنرل سیکرٹریٹ کے بیان ⁦(22 دسمبر 2022ء)⁩ کی بنیاد لی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Yeda (29 de Rajab – 3 de Sha'ban de 1444, 20-23 de febrero de 2023). Definió la educación en el Islam como la adquisición de valores, principios, conocimientos y habilidades que ayudan a una persona a adorar a Dios y a cultivar el mundo, y dictaminó que educar a hombres y mujeres en ciencias beneficiosas es un derecho de la familia, la sociedad y el Estado en todo tipo y etapa de la educación; que la educación requerida abarca todo aquello que sirve a los cinco intereses necesarios y a los intereses basados en las necesidades y de mejora, tanto religiosos como mundanos; que invertir en ella es un deber de la sharia; y que no es lícito privar a ningún hombre ni a ninguna mujer de ningún tipo de educación beneficiosa. Recomendó abordar las fatuas anómalas que impiden a las mujeres aprender, refutar los argumentos para privarlas de educación e instar a los gobiernos a facilitar la educación de hombres y mujeres, en particular la de las niñas. Se basó en sus resoluciones anteriores 38 (4/13), 164 (18/2), 169 (18/7) y 236 (24/7) y en la declaración de la Secretaría General sobre la suspensión de la educación de las niñas en Afganistán (22 de diciembre de 2022)."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023). Elle définit l'éducation en islam comme l'acquisition des valeurs, des principes, des connaissances et des compétences permettant d'adorer Dieu et de contribuer positivement au monde. Elle statue que l'éducation des hommes et des femmes aux sciences utiles est un droit inhérent à la famille, à la société et à l'État, à tous les niveaux et sous toutes ses formes. L'éducation requise couvre tout ce qui sert les cinq intérêts nécessaires, ainsi que les intérêts d'intérêt général et d'amélioration, tant religieux que profanes. Les dépenses y afférentes constituent une obligation islamique (charia). Il est licite de priver quiconque, homme ou femme, d'une éducation utile. L'Académie recommande de se pencher sur les fatwas aberrantes interdisant aux femmes l'instruction, de réfuter les arguments justifiant la privation d'éducation des femmes et d'exhorter les gouvernements à favoriser l'éducation des hommes et des femmes, et en particulier celle des filles. Elle s’appuie sur ses résolutions antérieures 38 (4/13), 164 (18/2), 169 (18/7) et 236 (24/7) et sur la déclaration du Secrétariat général sur la suspension de l’éducation des filles en Afghanistan (22 décembre 2022)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Cidde'deki yirmi beşinci oturumunda (29 Recep – 3 Şa'ban 1444 H, 20–23 Şubat 2023) toplu kararı. Akademi, İslam'da eğitimi, insanların Allah'a ibadet etmesine ve evreni inşa etmesine yardımcı olan değerler, ilkeler, bilgi ve becerilerin kazanılması olarak tanımladı. Erkek ve kadınlara faydalı bilimler öğretmenin, aile, toplum ve devletin her türlü eğitim düzeyinde bir hakkı olduğunu belirledi. Belirlenen eğitimin, dini ve dünyevi olarak beş temel çıkarı — hac ve iyileşmeyi — içerdiğini; buna yapılan harcamaların dini bir görev olduğunu; hiçbir erkek veya kadının faydalı eğitim biçiminden mahrum bırakılmasının izin verilmediğini belirtti. Kadınların eğitimini engelleyen anormal fetvaların ele alınmasını, onları mahrum bırakma gerekçelerine yanıt verilmesini ve hükümetlerin özellikle kız çocukları olmak üzere erkek ve kadınların eğitim almasını sağlamaya teşvik edilmesini önerdi. Önceki kararları 38 (4/13), 164 (18/2), 169 (18/7) ve 236 (24/7) ile Afganistan'da kız çocukları ve kız çocukları için eğitimin askıya alınmasına ilişkin Genel Sekreterlik açıklamasına (22 Aralık 2022) dayandı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023 M). Akademi mendefinisikan pendidikan dalam Islam sebagai memperoleh nilai, prinsip, pengetahuan, dan keterampilan yang membantu manusia menyembah Tuhan dan membangun alam semesta. Akademi menetapkan bahwa pengajaran ilmu bermanfaat kepada laki-laki dan perempuan adalah hak keluarga, masyarakat, dan negara di semua jenis dan tahap pendidikan. Akademi menyatakan bahwa pendidikan yang diwajibkan mencakup apa yang mencapai lima kepentingan utama—ziarah dan peningkatan—baik secara agama maupun duniawi; bahwa pengeluaran untuk itu adalah kewajiban agama; dan bahwa tidak diperbolehkan mencabut bentuk pendidikan yang bermanfaat bagi laki-laki atau perempuan. Akademi merekomendasikan untuk menangani fatwa abnormal yang mencegah pendidikan perempuan, menanggapi argumen untuk mencabut mereka, dan mendesak pemerintah agar laki-laki dan perempuan dapat menerima pendidikan, terutama anak perempuan. Dewan mengandalkan resolusi sebelumnya 38 (4/13), 164 (18/2), 169 (18/7), dan 236 (24/7), serta pernyataan Sekretariat Jenderal mengenai penangguhan pendidikan bagi anak perempuan dan anak perempuan di Afghanistan (22 Desember 2022)."
