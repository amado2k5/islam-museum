id: work/fatwa-iifa-239-education-of-males-and-females
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 239 (25/1) بشأن حكم التعليم بشقيه الديني والدنيوي للذكور والإناث في الإسلام", en: "IIFA resolution 239 (25/1) on the ruling on religious and worldly education for males and females in Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 239 (25/1): اسلام میں مردوں اور عورتوں کے لیے دینی و دنیاوی تعلیم کا حکم" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. عرّف المجمع التعليم في الإسلام بأنه اكتساب القيم والمبادئ والمعارف والمهارات التي تعين الإنسان على عبادة الله وعمارة الكون، وقرر أن تعليم الذكور والإناث العلوم النافعة حق على الأسرة والمجتمع والدولة في جميع أنواع التعليم ومراحله، وأن التعليم المأمور به يشمل ما يحقق المصالح الضرورية الخمس والحاجية والتحسينية، دينيًا ودنيويًا، وأن الإنفاق عليه واجب شرعي، وأنه لا يجوز شرعًا حرمان أي من الذكر والأنثى من أي نوع من التعليم النافع. وأوصى بمعالجة الفتاوى الشاذة المانعة لتعليم المرأة والرد على حجج حرمانها، ومناشدة الحكومات تمكين الذكور والإناث من التعليم وبخاصة تعليم البنات. واستند إلى قراراته السابقة 38 ⁦(4/13)⁩ و164 ⁦(18/2)⁩ و169 ⁦(18/7)⁩ و236 ⁦(24/7)⁩ وإلى بيان الأمانة العامة بشأن تعليق دراسة البنات والفتيات في أفغانستان ⁦(22 ديسمبر 2022م)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). It defined education in Islam as acquiring the values, principles, knowledge and skills that help a person worship God and cultivate the world, and ruled that educating males and females in beneficial sciences is a right owed by the family, society and state in every kind and stage of education; that the required education covers whatever serves the five necessary interests and the need-based and ameliorative interests, religious and worldly alike; that spending on it is a sharia duty; and that it is not lawful to deprive either male or female of any kind of beneficial education. It recommended addressing anomalous fatwas that bar women from learning, rebutting the arguments for depriving women of education, and urging governments to enable the education of males and females, girls' education in particular. It drew on its earlier resolutions 38 (4/13), 164 (18/2), 169 (18/7) and 236 (24/7) and on the General Secretariat's statement on the suspension of girls' education in Afghanistan (22 December 2022)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے اسلام میں تعلیم کی تعریف ایسے اقدار، اصولوں، علم اور مہارتوں کے حصول کے طور پر کی جو انسان کو عبادتِ الٰہی اور آبادکاریِ کائنات میں مدد دیں، اور فیصلہ کیا کہ مردوں اور عورتوں کو مفید علوم کی تعلیم دینا خاندان، معاشرے اور ریاست کا حق ہے، ہر قسم اور ہر مرحلے کی تعلیم میں؛ کہ مطلوبہ تعلیم وہ سب شامل ہے جو پانچ ضروری مصالح اور حاجی و تحسینی مصالح کو پورا کرے، دینی ہو یا دنیاوی؛ کہ اس پر خرچ کرنا شرعی واجب ہے؛ اور کہ کسی بھی مرد یا عورت کو کسی قسم کی مفید تعلیم سے محروم کرنا شرعاً جائز نہیں۔ سفارشات میں خواتین کی تعلیم پر پابندی لگانے والے شاذ فتاوى کا ازالہ، محرومی کی دلیلوں کا رد، اور حکومتوں سے مرد و زن کی تعلیم — بالخصوص لڑکیوں کی تعلیم — کے ممکن بنانے کی اپیل شامل ہے۔ اکیڈمی نے اپنی سابقہ قراردادیں 38 ⁦(4/13)⁩، 164 ⁦(18/2)⁩، 169 ⁦(18/7)⁩ اور 236 ⁦(24/7)⁩ اور افغانستان میں لڑکیوں کی تعلیم کے تعلق پر جنرل سیکرٹریٹ کے بیان ⁦(22 دسمبر 2022ء)⁩ کی بنیاد لی۔"
