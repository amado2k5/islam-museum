label: { ar: "حكم تطهير سجاد المساجد بالمواد الكيميائية", en: "Purifying mosque carpets with chemical agents", ur: "مسجد کی قالین کو کیمیائی مادوں سے پاک کرنا", es: "Purificación de alfombras de mezquita con agentes químicos" }
summary:
  ar: "سائل سأل عن تطهير سجاد المساجد بالمواد الكيميائية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24333)⁩ أن تطهير محل النجاسة لا يختص بالماء وحده بل يحصل بكل مائع طاهر مزيل، وأن الأصل في المواد الكيميائية السائلة أنها طاهرة في نفسها ومزيلة لأعيان النجاسات ما لم يثبت نجاستها."
  en: "A questioner asked about purifying mosque carpets with chemical agents. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24333) answered that purifying a spot of impurity is not confined to water but is achieved by any pure, removing liquid; and that liquid chemical agents are in principle pure in themselves and removers of impurities — unless an agent is itself proven impure."
  ur: "ایک سائل نے مسجد کی قالین کو کیمیائی مادوں سے پاک کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24333)⁩ نے جواب دیا کہ نجاست کی جگہ پاک کرنا صرف پانی تک محدود نہیں بلکہ ہر پاک اور صاف کرنے والے مائع سے ہو جاتا ہے؛ اور مائع کیمیائی مادے اصولاً بذاتِ خود پاک اور نجاست دور کرنے والے ہیں — مگر وہ جس کی نجاست ثابت ہو۔"
  es: "Un consultante preguntó acerca de la purificación de las alfombras de las mezquitas con agentes químicos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24333) respondió que la purificación de una impureza no se limita al agua, sino que se logra con cualquier líquido puro y purificador; y que los agentes químicos líquidos son, en principio, puros en sí mismos y eliminan las impurezas, a menos que se demuestre que el agente en sí es impuro."
