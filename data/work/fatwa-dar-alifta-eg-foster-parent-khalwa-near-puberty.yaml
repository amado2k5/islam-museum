id: work/fatwa-dar-alifta-eg-foster-parent-khalwa-near-puberty
class: work
kind: fatwa
label: { ar: "حكم الخلوة بين الكافل والمكفول الذي شارف البلوغ", en: "Seclusion between a foster carer and a fostered child near puberty", ur: "کافل اور بلوغ کے قریب کفیل کے درمیان خلوت", es: "Aislamiento entre un cuidador de acogida y un niño acogido cerca de la pubertad.", fr: "Isolement entre un tuteur et un enfant placé à l'approche de la puberté" }
summary:
  ar: "سائل سأل عن الخلوة بين الكافل والمكفول الذي شارف البلوغ وهما من جنسين مختلفين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21673)⁩ أنه تجوز شرعًا الخلوة بينهما إذا كان قد تم إرضاع الطفل المكفول رضاعًا محرِّمًا وبيّن الجواب حال عدم الرضاع على وجهه."
  en: "A questioner asked about seclusion between a foster carer and a fostered child near puberty of a different sex. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21673) answered that seclusion is lawful if the child was milk-nursed in a way that establishes prohibition; the case without such nursing is set out in the answer."
  ur: "ایک سائل نے مختلف جنس کے کافل اور بلوغ کے قریب کفیل بچے کے درمیان خلوت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21673)⁩ نے جواب دیا کہ اگر بچے کو ایسا دودھ پلایا گیا ہو جس سے حرمت ثابت ہو تو خلوت جائز ہے؛ بغیر رضاعت کی صورت جواب میں بیان ہوئی۔"
  es: "Una persona preguntó sobre el aislamiento entre un cuidador de acogida y un niño acogido de sexo diferente, próximo a la pubertad. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21673) respondió que el aislamiento es lícito si el niño fue amamantado de una manera que establece una prohibición; el caso sin dicha lactancia se expone en la respuesta."
  fr: "Une question portait sur la possibilité de séparer un enfant placé en famille d'accueil, proche de la puberté et de sexe différent, d'un tuteur à lui seul. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21673) a répondu que cette séparation est licite si l'enfant a été allaité d'une manière qui rend l'allaitement interdit; le cas où l'allaitement n'est pas pratiqué est exposé dans la réponse."
