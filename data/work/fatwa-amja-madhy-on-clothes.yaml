id: work/fatwa-amja-madhy-on-clothes
class: work
kind: fatwa
label: { ar: "المذي على الملابس", en: "Madhy on the clothes after washing and wudu", ur: "کپڑوں پر مذی", es: "Madhy sobre la ropa después del lavado y el wudu", fr: "Madhy sur les vêtements après le lavage et les ablutions", tr: "Kıyafetlerdeki kir", id: "Kotoran pada pakaian" }
summary:
  ar: "سأل سائل عن حكم وجود المذي الذي يخرج عند التفكير في الجماع على ملابسه بعد غسل ذكره والوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79095 بتاريخ 4 يونيو 2009)⁩ أن المذي هو السائل الأبيض اللزج الذي يخرج عند فتور الشهوة بلا شهوة ولا يعقب خروجه فتور في البدن ولا يشعر بخروجه غالبًا ويخرج عند الملاعبة أو التفكير في أمر الجماع وهو نجس يجب غسل ما أصابه من البدن والثياب والوضوء على ما فصّل الجواب."
  en: "A questioner asked the ruling on madhy — leaving him when he thinks of intercourse — falling on his clothes after he washed his member and did wudu. Dr. Salah al-Sawi (fatwa no. 79095, 4 June 2009) answered that madhy is the white viscous fluid that leaves at desire's wane without desire, no bodily lassitude following its exit, mostly unfelt, descending at foreplay or thinking of intercourse; it is impure — whatever of body and clothes it touches must be washed, and wudu renewed — as the answer details."
  ur: "کپڑوں پر مذی لگے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79095، 4 جون 2009)⁩ کے مطابق مذی نجس ہے — متاثرہ بدن و کپڑے دھوئے اور وضو کرے۔"
  es: "Un consultante preguntó sobre el dictamen relativo al madhy —el líquido que sale cuando piensa en el acto sexual— que cae sobre su ropa después de lavarse el miembro y realizar la ablución (wudu). El Dr. Salah al-Sawi (fatwa n.º 79095, 4 de junio de 2009) respondió que el madhy es el fluido blanco y viscoso que sale cuando el deseo disminuye sin deseo, sin languidez corporal posterior a su salida, casi imperceptible, que desciende durante los preliminares o al pensar en el acto sexual; es impuro —todo lo que toque del cuerpo o la ropa debe lavarse y la ablución debe renovarse— como se detalla en la respuesta."
  fr: "Un homme a posé une question concernant la fatwa n° 79095 du 4 juin 2009 relative au madhy — ce liquide blanc et visqueux qui s'écoule lorsque le désir sexuel s'estompe, sans provoquer de sensation de fatigue corporelle après son écoulement, généralement imperceptible, et qui se dépose lors des préliminaires ou à la simple pensée d'un rapport sexuel. Ce liquide est impur; il faut donc laver toute partie du corps ou des vêtements touchée et refaire les ablutions, comme le précise la réponse."
  tr: "Bir soru soran, erkek vücudunu yıkayıp abdest aldıktan sonra kıyafet üzerinde cinsel ilişki düşünülürken çıkan ön sıvının varlığı hakkındaki hüküm hakkında soru soruldu. Dr. Salah Al-Sawy (4 Haziran 2009 tarihli 79095 No. Fetva) pre-ejakülatın arzu olmadan zayıf olduğunda çıkan beyaz, yapışkan bir sıvı olduğunu, fiziksel uyuşuklukla takip edilmediğini ve oyun oynarken ya da cinsel ilişki sırasında dışarı çıktığında genellikle hissedilmediğini yanıtladı. Bu kirli ve kirli bir sıvıdır. Etkilenen beden ve kıyafetlerin yıkanması ve cevabda açıklandığı gibi abdest alınması gereklidir."
  id: "Seorang penanya ditanya tentang aturan mengenai keberadaan cairan pra-cairan yang keluar saat mempertimbangkan hubungan seksual di pakaian setelah mencuci tubuh pria dan melakukan wuduru. Dr. Salah Al-Sawy menjawab (Fatwa No. 79095 tanggal 4 Juni 2009) bahwa pra-ejakulasi adalah cairan putih lengket yang keluar ketika hasrat lemah tanpa keinginan, dan tidak diikuti oleh mati rasa fisik serta sering tidak dirasakan saat keluar saat bermain atau merenungkan hubungan seksual. Ini tidak murni, dan tidak murni. Perlu mencuci tubuh dan pakaian yang telah memengaruhinya, serta melakukan wudhu seperti yang dijelaskan dalam jawaban."
