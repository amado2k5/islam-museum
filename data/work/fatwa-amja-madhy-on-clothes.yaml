id: work/fatwa-amja-madhy-on-clothes
class: work
kind: fatwa
label: { ar: "المذي على الملابس", en: "Madhy on the clothes after washing and wudu", ur: "کپڑوں پر مذی" }
summary:
  ar: "سأل سائل عن حكم وجود المذي الذي يخرج عند التفكير في الجماع على ملابسه بعد غسل ذكره والوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79095 بتاريخ 4 يونيو 2009)⁩ أن المذي هو السائل الأبيض اللزج الذي يخرج عند فتور الشهوة بلا شهوة ولا يعقب خروجه فتور في البدن ولا يشعر بخروجه غالبًا ويخرج عند الملاعبة أو التفكير في أمر الجماع وهو نجس يجب غسل ما أصابه من البدن والثياب والوضوء على ما فصّل الجواب."
  en: "A questioner asked the ruling on madhy — leaving him when he thinks of intercourse — falling on his clothes after he washed his member and did wudu. Dr. Salah al-Sawi (fatwa no. 79095, 4 June 2009) answered that madhy is the white viscous fluid that leaves at desire's wane without desire, no bodily lassitude following its exit, mostly unfelt, descending at foreplay or thinking of intercourse; it is impure — whatever of body and clothes it touches must be washed, and wudu renewed — as the answer details."
  ur: "کپڑوں پر مذی لگے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79095، 4 جون 2009)⁩ کے مطابق مذی نجس ہے — متاثرہ بدن و کپڑے دھوئے اور وضو کرے۔"
