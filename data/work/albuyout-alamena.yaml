id: work/albuyout-alamena
class: work
kind: lecture-series
label:
  ar: "البيوت الآمنة"
  en: "Al-Buyut al-Amina (Safe Homes)"
  ur: "البیوت الآمنہ ⁦(محفوظ گھر)⁩"
summary:
  ar: "برنامج أسبوعي لعمر عبد الكافي على قناة دبي عن بناء البيت المسلم: حسن الاختيار والخطبة والحياة الزوجية وتربية الأولاد، مع أسئلة المشاهدين."
  en: "A weekly programme by Omar Abdelkafy on the Dubai channel about building the Muslim home: good choice, engagement, married life and raising children, with viewers' questions."
  ur: "عمر عبدالکافی کا دبئی چینل پر ہفتہ وار پروگرام جو مسلم گھر کی تعمیر کے بارے میں ہے: حسنِ انتخاب، منگنی، ازدواجی زندگی اور اولاد کی تربیت، ناظرین کے سوالات کے ساتھ۔"
wings: [ideas]
themes: [family-marriage-kinship, ethics-and-character]
regions: [global]
authors: [person/omar-abdelkafy]
delivered: { by: person/omar-abdelkafy }
language: language/arabic
sensitivity: contested
