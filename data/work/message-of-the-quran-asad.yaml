label: { ar: "رسالة القرآن", en: "The Message of the Qur'an", ur: "دی میسج آف دی قرآن" }
summary:
  ar: "ترجمة محمد أسد الإنجليزية لمعاني القرآن مع شرحه في الحواشي، صدرت كاملة في جبل طارق سنة 1980 عن دار الأندلس بعد طبعة جزئية للسور التسع الأولى في جنيف سنة 1964؛ صرّح فيها بأنه مدين لمحمد عبده، واعتمد على التفاسير القديمة في حواشيه، وعدّها كثيرون ذات منحى عقلاني، وانتقدتها اللجنة الدائمة للإفتاء في السعودية، ولم تُطبع في السعودية قط، وتُرجمت إلى لغات منها الألمانية والإسبانية والبوسنية والتركية والسويدية."
  en: "Muhammad Asad's English rendering of the meanings of the Qur'an with his commentary in the notes, published complete in Gibraltar in 1980 by Dar al-Andalus after a partial edition of the first nine suras in Geneva in 1964; he declared his debt to Muhammad Abduh and drew on classical tafsir in the notes, many read it as rationalist, the Saudi Permanent Committee for Ifta criticised it, it has never been printed in Saudi Arabia, and it has been translated into German, Spanish, Bosnian, Turkish and Swedish, among others."
  ur: "محمد اسد کا قرآن کے معانی کا انگریزی ترجمہ مع حواشی میں تشریح، جو 1964 میں جنیوا میں پہلی نو سورتوں کی جزوی اشاعت کے بعد 1980 میں جبل الطارق سے دار الاندلس نے مکمل شائع کیا؛ اس میں انھوں نے محمد عبدہ کا اعتراف کیا اور حواشی میں قدیم تفاسیر سے کام لیا؛ بہت سوں نے اسے عقلی رجحان کا ترجمہ سمجھا، سعودی دائمی کمیٹی برائے افتا نے اس پر تنقید کی، یہ سعودی عرب میں کبھی نہیں چھپا، اور جرمن، ہسپانوی، بوسنیائی، ترکی اور سویڈش سمیت کئی زبانوں میں ترجمہ ہوا۔"
