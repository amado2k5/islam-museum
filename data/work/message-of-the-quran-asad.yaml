issue:
  ar: "هل في ترجمة محمد أسد وشروحه ما يخالف العقيدة، وما قيمتها لقارئ القرآن بالإنجليزية؟"
  en: "Do Muhammad Asad's translation and notes depart from sound creed, and what is their value for the English reader of the Qur'an?"
  ur: "کیا محمد اسد کے ترجمے اور حواشی میں عقیدے سے انحراف ہے، اور انگریزی قاری کے لیے ان کی کیا قدر ہے؟"
perspectives:
  - tradition: sunni
    standing: main
    stance:
      ar: "أهل السنة ⁦(اللجنة الدائمة للبحوث العلمية والإفتاء في السعودية)⁩: نقد الترجمة والمنع من طبعها"
      en: "Sunni (the Saudi Permanent Committee for Scholarly Research and Ifta): criticism and a bar on printing"
      ur: "سني ⁦(اہلِ سنت)⁩ — سعودی دائمی کمیٹی برائے علمی تحقیق و افتا: ترجمے پر تنقید اور اشاعت کی ممانعت"
    summary:
      ar: "في فتاوى صدرت سنة 1979 وأُكّدت في الثمانينيات، جوابًا عن خطة لطبع الكتاب في دبلن، رأت اللجنة الدائمة في الترجمة أخطاء جسيمة في العقيدة، ومنها قوله في رفع عيسى، وذكرت أن الهيئة الاستشارية لرابطة العالم الإسلامي في مكة منعت طبعها وتوزيعها؛ ولم تُطبع الترجمة في السعودية قط."
      en: "In fatwas issued in 1979 and confirmed in the 1980s, in answer to a plan to print the book in Dublin, the Permanent Committee found grave errors of creed in the translation, among them its reading of the raising of Jesus, and stated that the Consulting Board of the Muslim World League in Mecca had prohibited its printing and distribution; the translation has never been printed in Saudi Arabia."
      ur: "1979 میں جاری اور 1980 کی دہائی میں مؤکد فتاویٰ میں، کتاب کو ڈبلن میں چھاپنے کے منصوبے کے جواب میں، دائمی کمیٹی نے ترجمے میں عقیدے کی سنگین غلطیاں بتائیں، جن میں رفعِ عیسیٰ کی تعبیر بھی ہے، اور کہا کہ مکہ میں رابطہ عالم اسلامی کی مجلسِ مشاورت نے اس کی طباعت و تقسیم روک دی ہے؛ یہ ترجمہ سعودی عرب میں کبھی نہیں چھپا۔"
    sources: [source/gloqur-asad-message-1964-edition]
  - tradition: academic
    standing: secondary
    stance:
      ar: "قراءة أكاديمية: ترجمة وشرح لا غنى عنهما لدارسي القرآن"
      en: "Academic reading: an indispensable translation and commentary for students of the Qur'an"
      ur: "علمی مطالعہ: قرآن کے طلبہ کے لیے ناگزیر ترجمہ و شرح"
    summary:
      ar: "رأى صهيب سعيد أن حواشي أسد التي تشرح اختياراته نموذج في الشفافية قلّ من اتبعه، وأن فصلها عن النص في الصيغ الرقمية يُفقد العمل كثيرًا من قيمته، مع إقراره بأن كثيرًا من المسلمين يرونه ذا منحى عقلاني حداثي؛ ورأى ميخايلو ياكوبوفيتش أنه ما يزال من أكثر ترجمات القرآن تأثيرًا في العالم ويُقرأ عند كثيرين كأنه تفسير."
      en: "Sohaib Saeed judged Asad's notes, which explain his choices, a model of transparency few have followed, and said that separating them from the text in digital formats takes much of the work's value away, while noting that many Muslims see it as rationalist and modernist; Mykhaylo Yakubovych wrote that it remains one of the most influential Qur'an translations worldwide and is viewed by many as a kind of tafsir."
      ur: "صہیب سعید کے نزدیک اسد کے حواشی، جو ان کے انتخاب کی وضاحت کرتے ہیں، شفافیت کا ایسا نمونہ ہیں جس کی پیروی کم ہوئی، اور ڈیجیٹل صورتوں میں انھیں متن سے الگ کرنا کام کی قدر گھٹا دیتا ہے، اگرچہ بہت سے مسلمان اسے عقلی و جدید رجحان کا سمجھتے ہیں؛ میخائیلو یاکوبووچ کے مطابق یہ آج بھی دنیا کے مؤثر ترین تراجمِ قرآن میں ہے اور بہت سے لوگ اسے ایک طرح کی تفسیر سمجھتے ہیں۔"
    sources: [source/gloqur-asad-message-2020, source/gloqur-asad-message-1964-edition]
