structure: "Kotobarabia text: author's introduction (pp. 8-10); the six kinds of groups opposed to Islam - sophists, eternalists, dualists and others - (pp. 9-183); Jews, Christians who deny the Trinity, Sabians and Magians (from p. 184), with the contradictions of the Gospels (TOC p. 814); the sects of the Muslims (from p. 595), then theology: tawhid and anti-anthropomorphism, knowledge, life, the face and hand, vision, the Qur'an, its inimitability, predestination, capacity, guidance (TOC pp. 583-798); grace to unbelievers, angels, the sinlessness of prophets, promise and threat, intercession, resurrection (TOC pp. 1045-1331); the scandals of the Shi'a, Khawarij, Mu'tazila and Murji'a (TOC pp. 1537-1589); jinn, nature, prophethood of women, dreams, the name and the named, states (ahwal) with the Ash'aris, motion and generation (TOC pp. 1638-1765)."
