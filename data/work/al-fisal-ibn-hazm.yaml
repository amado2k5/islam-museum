label: { ar: "الفصل في الملل والأهواء والنحل", en: "al-Fisal fi al-Milal wa-l-Ahwa' wa-l-Nihal", ur: "الفصل فی الملل والاہواء والنحل" }
summary:
  ar: "كتاب ابن حزم الأندلسي (384-456هـ) في الأديان والفرق ومسائل الكلام، قصد فيه كما يقول إيراد البراهين الراجعة إلى الحس مع بيان اللفظ وترك التعقيد؛ رتّب فيه الفرق المخالفة لدين الإسلام ست مراتب بحسب بعدها، من منكري الحقائق إلى المقرّين ببعض الأنبياء دون بعض، وتكلم على اليهود والنصارى والمجوس والصابئة، ثم على نحل أهل الإسلام التي يجعلها خمساً: أهل السنة والمعتزلة والمرجئة والشيعة والخوارج، ثم على مسائل التوحيد والصفات والقدر والإيمان والإمامة وغيرها {cite:fisal-ibn-hazm-kotobarabia p. 8} {cite:fisal-ibn-hazm-kotobarabia p. 9} {cite:fisal-ibn-hazm-kotobarabia p. 595}."
  en: "Ibn Hazm of al-Andalus's (384-456 AH) work on religions, sects and theological questions, in which he aimed, he says, to present proofs that go back to sense perception, in clear language without obscurity; he ranks the groups opposed to Islam in six degrees of distance, from deniers of reality to those who accept some prophets and not others, discusses Jews, Christians, Magians and Sabians, then the sects of the Muslims, which he counts as five - Ahl al-Sunna, the Mu'tazila, the Murji'a, the Shi'a and the Khawarij - and then questions of divine unity, the attributes, predestination, faith, the imamate and more."
  ur: "ابن حزم اندلسی (384-456ھ) کی ادیان، فرقوں اور کلامی مسائل پر کتاب، جس میں ان کے بقول ان کا مقصد حس کی طرف لوٹنے والے براہین پیش کرنا، واضح الفاظ اور پیچیدگی کے بغیر تھا؛ وہ اسلام کے مخالف گروہوں کو ان کی دوری کے اعتبار سے چھ مراتب میں رکھتے ہیں — حقائق کے منکرین سے لے کر بعض انبیا کو ماننے اور بعض کا انکار کرنے والوں تک — یہود، نصاریٰ، مجوس اور صابئہ پر کلام کرتے ہیں، پھر اہلِ اسلام کے فرقوں پر جنہیں وہ پانچ شمار کرتے ہیں: اہلِ سنت، معتزلہ، مرجئہ، شیعہ اور خوارج، اور پھر توحید، صفات، قدر، ایمان، امامت وغیرہ کے مسائل پر۔"
