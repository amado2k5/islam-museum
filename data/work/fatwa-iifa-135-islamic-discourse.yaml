label: { ar: "قرار مجمع الفقه الإسلامي الدولي 135 (15/1) بشأن الخطاب الإسلامي ومميزاته والتحديات التي تواجهه", en: "IIFA resolution 135 (15/1) on Islamic discourse: its features and the challenges it faces", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 135 (15/1): اسلامی خطاب — اس کی خصوصیات اور درپیش چیلنجز", es: "Resolución 135 (15/1) de la IIFA sobre el discurso islámico: sus características y los desafíos que enfrenta.", fr: "Résolution 135 (15/1) de l'IIFA sur le discours islamique: ses caractéristiques et les défis auxquels il est confronté" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. عرّف الخطاب الإسلامي بأنه طريقة التعبير التي تبين حقائق الإسلام وشرائعه في مجالات الحياة العامة والخاصة، وقرر أن ما يثار حوله يوجب تجلية خصائصه ودفع الشبهات عنه لصد ما سماه الهجمة على الإسلام والحملات الإعلامية، مستحضرًا وجوب الحكمة والموعظة الحسنة في الدعوة ومراعاة أحوال المخاطبين واعتدال الخطاب وتنوعه بحسب الموجَّه إليه. ثم سرد خصائص الخطاب المطلوب وضوابطه والتحديات المواجهة له ووسائل معالجتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It defined Islamic discourse as the mode of expression setting out Islam's truths and laws across public and private life; held that the current debate requires clarifying its features and repelling doubts to counter what it calls the campaign against Islam and the media offensives — citing the duty of wisdom and fair exhortation in da'wa, regard for audiences' states, and the moderation and addressee-sensitivity of proper discourse. It then set out the features required of the discourse, its controls, the challenges facing it and means of addressing them."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے اسلامی خطاب کی تعریف کی: تعبیر کا وہ انداز جو زندگی کے عوامی و نجی شعبوں میں اسلام کی حقائق اور شریعت بیان کرے؛ اور فیصلہ دیا کہ جاری مباحث اس کے اوصاف کی وضاحت اور شبہات کی رفو کا متقاضی ہے تاکہ اس کے بقول اسلام پر حملوں اور میڈیا مہمات کا مقابلہ ہو — دعوت میں حکمت اور نیک نصیحت، سامعین کے احوال کی رعایت اور خطاب کے اعتدال و تنوع کی بنیاد پر۔ پھر مطلوب خطاب کی خصوصیات، ضوابط، درپیش چیلنجز اور ان کے ازالے کے ذرائع۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004). Definió el discurso islámico como el modo de expresión que expone las verdades y leyes del Islam en la vida pública y privada; sostuvo que el debate actual requiere clarificar sus características y disipar las dudas para contrarrestar lo que denomina la campaña contra el Islam y las ofensivas mediáticas, citando el deber de sabiduría y exhortación justa en la da'wa, el respeto por el estado de los oyentes y la moderación y sensibilidad hacia el destinatario propias de un discurso adecuado. A continuación, expuso las características requeridas del discurso, sus controles, los desafíos que enfrenta y los medios para abordarlos."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 15e session à Mascate (14-19 Muharram 1425, 6-11 mars 2004). Elle définit le discours islamique comme le mode d'expression exposant les vérités et les lois de l'islam dans la vie publique et privée. Elle affirme que le débat actuel exige de clarifier ses caractéristiques et de dissiper les doutes afin de contrer ce qu'elle qualifie de campagne contre l'islam et d'offensives médiatiques. Elle invoque le devoir de sagesse et d'exhortation juste dans la da'wa, la considération de la situation des auditeurs, ainsi que la modération et la sensibilité à l'égard du destinataire propres à un discours approprié. Elle expose ensuite les caractéristiques requises du discours, ses mécanismes de régulation, les défis auxquels il est confronté et les moyens d'y remédier."
