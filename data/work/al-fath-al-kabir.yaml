id: work/al-fath-al-kabir
class: work
kind: book
label:
  ar: "الفتح الكبير في ضم الزيادة إلى الجامع الصغير"
  en: "al-Fath al-Kabir fi Damm al-Ziyada ila al-Jami' al-Saghir"
  ur: "الفتح الکبیر فی ضم الزیادۃ الی الجامع الصغیر"
summary:
  ar: "كتاب يوسف النبهاني الذي مزج فيه «الجامع الصغير» للسيوطي بذيله «زيادة الجامع» ورتبهما على حروف المعجم معتبراً حروف الكلمة الأولى فما بعدها، وميّز أحاديث الزيادة بحرف ⁦(ز)⁩، وحذف ما تكرر منها بعينه في الأصل، وقدّم له بمقدمة في ست فوائد؛ وهو الأصل الذي حققه الألباني فقسمه إلى «صحيح الجامع الصغير» و«ضعيفه» {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 33} {cite:sahih-jami-saghir-maktab-islami-1988 p. 36-37}."
  en: "Yusuf al-Nabhani's merger of al-Suyuti's al-Jami' al-Saghir with its supplement Ziyadat al-Jami', arranged alphabetically by the letters of the first word and those after it, marking the Ziyada hadiths with the letter zay and dropping those repeated word for word in the original, with a preface of six points; it is the base text that al-Albani graded and divided into Sahih and Da'if al-Jami' al-Saghir {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 33} {cite:sahih-jami-saghir-maktab-islami-1988 p. 36-37}."
  ur: "یوسف نبہانی کی کتاب جس میں انہوں نے سیوطی کی «الجامع الصغیر» کو اس کے ذیل «زیادۃ الجامع» کے ساتھ ملا کر پہلے لفظ اور اس کے بعد کے حروف کے لحاظ سے حروفِ تہجی پر ترتیب دیا، زیادہ کی احادیث پر حرف ⁦(ز)⁩ لگایا، اور جو اصل میں بعینہ مکرر تھیں انہیں حذف کیا، اور چھ فوائد پر مشتمل مقدمہ لکھا؛ یہی وہ اصل ہے جس کی البانی نے تحقیق کر کے اسے «صحیح الجامع الصغیر» اور «ضعیف» میں تقسیم کیا {cite:sahih-jami-saghir-maktab-islami-1988 p. 14} {cite:sahih-jami-saghir-maktab-islami-1988 p. 33} {cite:sahih-jami-saghir-maktab-islami-1988 p. 36-37}۔"
