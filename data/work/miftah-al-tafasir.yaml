summary:
  ar: "كتاب في علوم القرآن لرشيد الدين، ينقسم إلى جزأين: الأول رسالتان في بلاغة القرآن وفي المفسرين وطبقاتهم وقواعدهم، والثاني ست رسائل في الخير والشر والجزاء والصبر وطول العمر وقصره والقضاء والقدر وفي الكلمات الدالة على العناية الإلهية {cite:jami-al-tawarikh-khashshab-1960 p. 175}. وصفه المؤلف بأنه طريقه إلى تفسير لا يستغرق عمرا {cite:jami-al-tawarikh-khashshab-1960 p. 174}."
  en: "A work by Rashid al-Din on the sciences of the Qur'an, in two parts. The first has two treatises, on the eloquence of the Qur'an and on the commentators, their classes and their rules. The second has six treatises on good and evil, reward and punishment, patience, the length and brevity of human life, divine decree, and words for providence and for their opposites {cite:jami-al-tawarikh-khashshab-1960 p. 175}. The author describes this line of work as a shorter path than a full commentary that would take a lifetime {cite:jami-al-tawarikh-khashshab-1960 p. 174}."
  es: "Obra de Rashid al-Din sobre las ciencias coránicas, en dos partes. La primera contiene dos tratados sobre la elocuencia del Corán y sobre los comentaristas, sus clases y sus reglas. La segunda contiene seis tratados sobre el bien y el mal, la recompensa y el castigo, la paciencia, la brevedad y la duración de la vida, el decreto divino y términos sobre la providencia y sus contrarios {cite:jami-al-tawarikh-khashshab-1960 p. 175}. El autor describe este trabajo como un camino más corto que un comentario completo que llevaría toda una vida {cite:jami-al-tawarikh-khashshab-1960 p. 174}."
  fr: "Ouvrage de Rashid al-Din sur les sciences coraniques, en deux parties. La première comporte deux traités, sur l'éloquence du Coran et sur les commentateurs, leurs classes et leurs règles. La seconde comporte six traités sur le bien et le mal, la récompense et le châtiment, la patience, la brièveté et la longueur de la vie, le décret divin, et des termes relatifs à la providence et à leurs contraires {cite:jami-al-tawarikh-khashshab-1960 p. 175}. L'auteur présente cette voie comme plus courte qu'un commentaire complet qui demanderait toute une vie {cite:jami-al-tawarikh-khashshab-1960 p. 174}."
  ur: "رشید الدین کی قرآنی علوم پر کتاب، جو دو حصوں میں ہے۔ پہلے حصے میں دو رسالے ہیں: قرآن کی بلاغت اور مفسرین، ان کے طبقات اور قواعد پر۔ دوسرے حصے میں چھ رسالے ہیں: خیر و شر، جزا و سزا، صبر، زندگی کی طوالت و قصر، قضا و قدر، اور عنایت الٰہی کے الفاظ اور ان کے مخالف الفاظ پر {cite:jami-al-tawarikh-khashshab-1960 p. 175}۔ مصنف نے اسے مکمل تفسیر کا ایک مختصر راستہ بتایا، جس میں پوری عمر لگ جاتی {cite:jami-al-tawarikh-khashshab-1960 p. 174}۔"
  tr: "Rashid al-Din tarafından yazılmış Kur'an bilimleri üzerine iki bölüme ayrılmış bir kitap: ilki, Kur'an'ın hitabeti, yorumcular, sınıflandırmaları ve kuralları üzerine iki risale; ikincisi ise iyilik ve kötülük, ödül, sabır, uzun ömür ve kısalık, kader ve kader ile ilahi takdiri gösteren kelimeler üzerine altı risaledir {cite:jami-al-tawarikh-khashshab-1960 s. 175}. Yazar, bunu ömür boyu sürmeyen yorum yolu olarak tanımlamıştır {cite:jami-al-tawarikh-khashshab-1960 s. 174}."
  id: "Sebuah buku tentang ilmu Al-Qur'an karya Rashid al-Din, dibagi menjadi dua bagian: yang pertama adalah dua risalah tentang kefasihan Al-Qur'an, para komentator, klasifikasinya, dan aturan; yang kedua adalah enam risalah tentang kebaikan dan kejahatan, ganjaran, kesabaran, umur panjang dan singkat, takdir dan takdir, serta tentang kata-kata yang menunjukkan providensi ilahi {cite:jami-al-tawarikh-khashshab-1960 hlm. 175}. Penulis menggambarkannya sebagai jalan interpretasinya yang tidak memakan waktu seumur hidup {cite:jami-al-tawarikh-khashshab-1960 hlm. 174}."
