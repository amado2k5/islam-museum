id: work/fatwa-dar-alifta-wudu-with-chlorinated-water
class: work
kind: fatwa
label: { ar: "حكم الوضوء بالماء المختلط بالكلور", en: "Ablution with chlorinated tap water", ur: "کلورین ملے نلکے کے پانی سے وضو کا حکم" }
summary:
  ar: "سائل يجد لماء الحنفية أحيانًا طعمًا غريبًا ولونًا مائلًا إلى البياض ويسأل عن الوضوء به. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن الوضوء به جائز، لأن التغير اليسير في الطعم أو اللون بمخالطة شيء طاهر لا يضر ما دام لا يسلب الماء اسمه ورقته وجريانه، ولم تثبت مخالطته لنجاسة تؤثر في أوصافه."
  en: "A questioner sometimes finds that tap water has an odd taste and a whitish colour and asks about making ablution with it. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that ablution with it is valid: a slight change of taste or colour from mixing with something pure does no harm so long as the water keeps its name, its thinness and its flow, and it has not been shown to be mixed with an impurity that alters its qualities."
  ur: "ایک سائل کو نلکے کے پانی میں کبھی عجیب ذائقہ اور سفیدی مائل رنگ محسوس ہوتا ہے اور وہ اس سے وضو کے بارے میں پوچھتا ہے۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ اس سے وضو جائز ہے، کیونکہ کسی پاک چیز کے ملنے سے ذائقے یا رنگ میں معمولی تبدیلی نقصان نہیں دیتی جب تک پانی کا نام، اس کی رقت اور روانی باقی رہے اور کسی ایسی نجاست کا ملنا ثابت نہ ہو جو اس کے اوصاف بدل دے۔"
