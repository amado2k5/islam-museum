id: work/fatwa-dar-alifta-wudu-with-chlorinated-water
class: work
kind: fatwa
label: { ar: "حكم الوضوء بالماء المختلط بالكلور", en: "Ablution with chlorinated tap water", ur: "کلورین ملے نلکے کے پانی سے وضو کا حکم", es: "Ablución con agua del grifo clorada", fr: "Ablution à l'eau du robinet chlorée", tr: "Klor ile karıştırılmış su ile abdest alma hakkındaki karar", id: "Aturan tentang wudhu dengan air yang dicampur klorin" }
summary:
  ar: "سائل يجد لماء الحنفية أحيانًا طعمًا غريبًا ولونًا مائلًا إلى البياض ويسأل عن الوضوء به. أجابت دار الإفتاء المصرية، في فتوى صادرة عن المفتي نظير عياد، بأن الوضوء به جائز، لأن التغير اليسير في الطعم أو اللون بمخالطة شيء طاهر لا يضر ما دام لا يسلب الماء اسمه ورقته وجريانه، ولم تثبت مخالطته لنجاسة تؤثر في أوصافه."
  en: "A questioner sometimes finds that tap water has an odd taste and a whitish colour and asks about making ablution with it. Egypt's Dar al-Ifta, in a fatwa issued under Grand Mufti Nazir Ayyad, answered that ablution with it is valid: a slight change of taste or colour from mixing with something pure does no harm so long as the water keeps its name, its thinness and its flow, and it has not been shown to be mixed with an impurity that alters its qualities."
  ur: "ایک سائل کو نلکے کے پانی میں کبھی عجیب ذائقہ اور سفیدی مائل رنگ محسوس ہوتا ہے اور وہ اس سے وضو کے بارے میں پوچھتا ہے۔ مصر کے دار الافتاء نے مفتی نظیر عیاد کے فتوے میں جواب دیا کہ اس سے وضو جائز ہے، کیونکہ کسی پاک چیز کے ملنے سے ذائقے یا رنگ میں معمولی تبدیلی نقصان نہیں دیتی جب تک پانی کا نام، اس کی رقت اور روانی باقی رہے اور کسی ایسی نجاست کا ملنا ثابت نہ ہو جو اس کے اوصاف بدل دے۔"
  es: "En ocasiones, una persona consultada encuentra que el agua del grifo tiene un sabor extraño y un color blanquecino, y pregunta si puede realizar la ablución con ella. El Dar al-Ifta de Egipto, en una fatwa emitida bajo el Gran Muftí Nazir Ayyad, respondió que la ablución con ella es válida: un ligero cambio de sabor o color al mezclarse con algo puro no causa daño, siempre y cuando el agua conserve su nombre, su fluidez y su caudal, y no se haya demostrado que esté mezclada con alguna impureza que altere sus cualidades."
  fr: "Il arrive qu'une personne trouve l'eau du robinet étrange et blanchâtre et se demande si elle peut être utilisée pour les ablutions. La Dar al-Ifta d'Égypte, dans une fatwa émise sous l'égide du grand mufti Nazir Ayyad, a répondu que les ablutions avec cette eau sont valides: un léger changement de goût ou de couleur dû au mélange avec une eau pure est sans danger tant que l'eau conserve son nom, sa fluidité et son débit, et qu'il n'a pas été démontré qu'elle était mélangée à une impureté altérant ses qualités."
  tr: "Bir soru soran bazen musluk suyunun garip bir tadı ve beyazımsı bir rengi olduğunu bulur ve bununla yapılan abdest hakkında soru sorar. Mısırlı Dar al-Ifta, Mufti Nazir Ayad tarafından verilen bir fetvada, su ile birlikte yapılan bir fetvada, suyun adını, yumuşaklığını ve akışını kaybetmediği sürece tat veya renkte hafif bir değişikliğin zarar vermediğini, ayrıca özelliklerini etkileyen saflıklarla karıştığı kanıtlanmadığı sürece vudu ile birlikte kullanılmasının caiz olduğunu yanıtlamıştır."
  id: "Seorang penanya kadang menemukan air keran memiliki rasa aneh dan warna putih lalu bertanya tentang wudhu dengan air tersebut. Dar al-Ifta Mesir menjawab dalam fatwa yang dikeluarkan oleh Mufti Nazir Ayad bahwa wudu dengan air tersebut diperbolehkan, karena perubahan kecil rasa atau warna dengan mencampur dengan sesuatu yang murni tidak merugikan selama air tersebut tidak menghilangkan nama, kelembutan, dan alirannya, dan belum terbukti bahwa air tersebut bercampur dengan kotoran yang memengaruhi karakteristiknya."
