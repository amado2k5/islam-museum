id: work/fatwa-dar-alifta-eg-buying-with-store-discount-points
class: work
kind: fatwa
label: { ar: "حكم الشراء بنقاط الخصم من متجر معين", en: "Buying with a store's discount points", ur: "اسٹور کے ڈسکاؤنٹ پوائنٹس سے خریداری", es: "Comprar con puntos de descuento de una tienda" }
summary:
  ar: "سائل سأل عن الانتفاع بنقاط الخصم الممنوحة للأفراد مجانًا بما لها من قيم مالية في صورة خصومات من متجر معين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21499)⁩ أنه لا مانع شرعًا من الانتفاع بنقاط الخصم الممنوحة للأفراد مجانًا على ما فصّل الجواب."
  en: "A questioner asked about benefiting from discount points given free to individuals, carrying monetary value as discounts at a particular store. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21499) answered there is no legal objection to benefiting from them — as the answer details."
  ur: "ایک سائل نے کسی اسٹور کے مفت ڈسکاؤنٹ پوائنٹس سے فائدہ اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21499)⁩ نے جواب دیا کہ ان سے فائدہ اٹھانا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la conveniencia de beneficiarse de los puntos de descuento que se otorgan gratuitamente a particulares y que tienen un valor monetario en forma de descuentos en una tienda específica. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21499) respondió que no existe ninguna objeción legal para beneficiarse de ellos, tal como se detalla en la respuesta."
