editions:
  - "Arabic text from the Escorial manuscript, edited by C. A. Nallino as Part III of Al-Battani sive Albatenii Opus astronomicum (Milan: Hoepli, 1899; scan p. 870), with Latin version of the chapters (Part I, printed Rome 1902/1903) and of the tables (Part II, 1907; scan p. 420)."
  - "Latin translation of Plato of Tivoli, printed at Nuremberg in 1537 with Alfraganus' Rudimenta and Regiomontanus' additions (scan p. 59)."
