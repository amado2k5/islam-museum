label: { ar: "الزيج الصابي", en: "al-Zij al-Sabi (The Sabian Zij)" }
summary:
  ar: "زيج في حساب النجوم وفلك البروج ومواضع الكواكب، ألّفه [[person/al-battani|محمد بن جابر البتاني]]. يبدأ بتقويم دائرة الفلك وحساب أوتار القسي، ثم يتناول ميل فلك البروج، ومطالع البروج في البلدان، ومعرفة عروض البلدان بالرصد، والظل والارتفاع، وخط نصف النهار، وأبعاد الكواكب {cite:zij-sabi-nallino-byblion p.5} {cite:zij-sabi-nallino-byblion p.6} {cite:zij-sabi-nallino-byblion p.7}."
  en: "An astronomical handbook by al-Battani on computing star positions and the zodiac. It opens with the reckoning of the sphere and of chords, then treats the obliquity of the ecliptic, the risings of the zodiac in each city, latitude found by observation, shadows and altitudes, the meridian, and the distances of the stars and planets {cite:zij-sabi-nallino-byblion p.5} {cite:zij-sabi-nallino-byblion p.6} {cite:zij-sabi-nallino-byblion p.7}."
