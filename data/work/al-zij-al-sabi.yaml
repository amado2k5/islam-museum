editions:
  - "Arabic text from the Escorial manuscript, edited by C. A. Nallino as Part III of Al-Battani sive Albatenii Opus astronomicum (Milan: Hoepli, 1899; scan p. 870), with Latin version of the chapters (Part I, printed Rome 1902/1903) and of the tables (Part II, 1907; scan p. 420)."
  - "Latin translation of Plato of Tivoli, printed at Nuremberg in 1537 with Alfraganus' Rudimenta and Regiomontanus' additions (scan p. 59)."
  - "Reprint of Nallino's Arabic text by Dar wa-Maktabat Byblion, Jbeil, 2005 (source/zij-sabi-nallino-byblion, scan pp. 2–4)."
  - "Manuscript: El Escorial, Real Biblioteca, Arabic MS 908 (formerly 903): 245 folios, 26.5 × 19 cm, 19 lines a page, thick cotton paper, Maghribi script, chapter titles in red; no title or colophon; ff. 244v–245 in another hand contain hadith; Nallino dates the hand to the end of the eleventh or start of the twelfth century CE (scan p. 70)."
