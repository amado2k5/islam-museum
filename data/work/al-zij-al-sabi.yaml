summary:
  ar: "زيج [[person/al-battani|محمد بن جابر البتاني]] ⁦(ت 317هـ)⁩، في سبعة وخمسين بابًا مع جداول، ضمّنه أرصاده للشمس والقمر في الرقة وأنطاكية وتصحيحه لحركاتهما وحركات الكواكب الخمسة كما في المجسطي؛ يسميه القدماء «زيج البتاني» وسماه المتأخرون «الزيج الصابي»، ونقل إلى اللاتينية والقشتالية في القرنين السادس والسابع الهجريين {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41} {cite:zij-sabi-nallino-byblion p.5}."
  en: "The Zij of [[person/al-battani|al-Battani]] (d. 317 AH), in fifty-seven chapters with tables, holding his observations of the Sun and Moon at al-Raqqa and Antioch and his correction of their motions and those of the five planets as given in the Almagest; early authors call it 'Zij al-Battani', later bibliographers 'the Sabian Zij'; it was translated into Latin and Castilian in the twelfth and thirteenth centuries {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
  ur: "[[person/al-battani|البتانی]] ⁦(م 317ھ)⁩ کی زیج، ستاون ابواب اور جدولوں پر مشتمل، جس میں رقہ اور انطاکیہ میں سورج اور چاند کے ارصاد اور المجسطی میں دی گئی ان کی اور پانچ سیاروں کی حرکات کی تصحیح ہے؛ متقدمین اسے «زیج البتانی» اور متاخرین «الزیج الصابی» کہتے ہیں؛ بارہویں اور تیرہویں صدی عیسوی میں لاطینی اور قشتالی میں ترجمہ ہوئی {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
