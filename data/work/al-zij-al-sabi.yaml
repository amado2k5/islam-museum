summary:
  ar: "زيج [[person/al-battani|محمد بن جابر البتاني]] ⁦(ت 317هـ)⁩، في سبعة وخمسين بابًا مع جداول، ضمّنه أرصاده للشمس والقمر في الرقة وأنطاكية وتصحيحه لحركاتهما وحركات الكواكب الخمسة كما في المجسطي؛ يسميه القدماء «زيج البتاني» وسماه المتأخرون «الزيج الصابي»، ونقل إلى اللاتينية والقشتالية في القرنين السادس والسابع الهجريين {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41} {cite:zij-sabi-nallino-byblion p.5}."
  en: "The Zij of [[person/al-battani|al-Battani]] (d. 317 AH), in fifty-seven chapters with tables, holding his observations of the Sun and Moon at al-Raqqa and Antioch and his correction of their motions and those of the five planets as given in the Almagest; early authors call it 'Zij al-Battani', later bibliographers 'the Sabian Zij'; it was translated into Latin and Castilian in the twelfth and thirteenth centuries {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
  ur: "[[person/al-battani|البتانی]] ⁦(م 317ھ)⁩ کی زیج، ستاون ابواب اور جدولوں پر مشتمل، جس میں رقہ اور انطاکیہ میں سورج اور چاند کے ارصاد اور المجسطی میں دی گئی ان کی اور پانچ سیاروں کی حرکات کی تصحیح ہے؛ متقدمین اسے «زیج البتانی» اور متاخرین «الزیج الصابی» کہتے ہیں؛ بارہویں اور تیرہویں صدی عیسوی میں لاطینی اور قشتالی میں ترجمہ ہوئی {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
  es: "El Zij de [[persona/al-battani|al-Battani]] (m. 317 AH), en cincuenta y siete capítulos con tablas, contiene sus observaciones del Sol y la Luna en al-Raqqa y Antioquía y su corrección de sus movimientos y los de los cinco planetas como se indica en el Almagesto; los primeros autores lo llaman 'Zij al-Battani', los bibliógrafos posteriores 'el Sabian Zij'; fue traducida al latín y al castellano en los siglos XII y XIII {citar:nallino-albatenii-opus-astronomicum p. 17} {citar: nallino-albatenii-opus-astronomicum p. 40} {citar:nallino-albatenii-opus-astronomicum p. 41}."
  fr: "Le Zij de [[person/al-battani|al-Battani]] (mort en 317 AH), en cinquante-sept chapitres avec tableaux, contenant ses observations du Soleil et de la Lune à al-Raqqa et Antioche et sa correction de leurs mouvements et de ceux des cinq planètes comme donné dans l'Almageste; les premiers auteurs l'appellent « Zij al-Battani », les bibliographes ultérieurs « le Sabian Zij »; il a été traduit en latin et en castillan aux XIIe et XIIIe siècles {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
  tr: "Zij [[kişi/al-battani|Muhammad ibn Jabir al-Battani]] (ö. 317 Hicri), elli yedi bölümde tablolarla birlikte, Rakka ve Antakya'daki güneş ve ay gözlemlerini, Almagest'teki gibi beş gezegenin hareketlerini ve hareketlerini düzeltmesini içermiştir; antikler buna 'Zij al-Battani' adını vermiş, daha sonra 'Sabian Zij' adını vermiştir ve 6. ve 7. yüzyıllarda Latince ve Kastilyacaya aktarılmıştır {cite:Nallino-albatenii-opus-astronomicum s. 17} {cite:nallino-albatenii-opus-astronomicum s. 40} {cite:Nallino-albatenii-opus-astronomicum s. 41} {cite:Zij-sabi-nallino-byblion s.5}."
  id: "Zij [[person/al-battani|Muhammad ibn Jabir al-Battani]] (wafat 317 H), dalam lima puluh tujuh bab dengan tabel, memuat pengamatannya tentang matahari dan bulan di Raqqa dan Antiokhia, serta koreksinya atas pergerakan dan pergerakan lima planet seperti dalam Almagest; para leluhur menyebutnya 'Zij al-Battani' dan kemudian menyebutnya 'Sabian Zij,' dan dipindahkan ke dalam bahasa Latin dan Kastilia pada abad ke-6 dan ke-7 H {cite:Nallino-albatenii-opus-astronomicum hlm. 17} {cite:nallino-albatenii-opus-astronomicum hlm. 40} {cite:Nallino-albatenii-opus-astronomicum hlm. 41} {cite:Zij-sabi-nallino-byblion hlm. 5}."
