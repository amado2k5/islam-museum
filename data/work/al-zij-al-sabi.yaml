  note: "يرى نالينو أن النسخة الأولى صدرت قبل سنة 288هـ ⁦(ابتداؤها 25 ديسمبر 900م)⁩ لأن ثابت بن قرة المتوفى في فبراير 901م ذكر بابها الثاني والخمسين، وأن نسخة الإسكوريال وترجمة أفلاطون التيفولي هي النسخة الثانية لأنها تذكر أرصاد أنطاكية في يناير وأغسطس 901م {cite:nallino-albatenii-opus-astronomicum p. 41}."
