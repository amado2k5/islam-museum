id: work/fatwa-dar-alifta-eg-funeral-prayer-drowned-missing
class: work
kind: fatwa
label: { ar: "حكم صلاة الجنازة على الغريق المفقود", en: "Funeral prayer for a drowned person who is missing", ur: "غائب ڈوبے ہوئے شخص کی نمازِ جنازہ", es: "Oración fúnebre por una persona ahogada que está desaparecida.", fr: "Prière funéraire pour une personne noyée et portée disparue", tr: "Boğulan kayıp kişi için cenaze duası hakkındaki karar", id: "Putusan tentang doa pemakaman untuk orang hilang yang tenggelam" }
summary:
  ar: "سائل سأل عن صلاة الجنازة على قريبه الذي مات غريقًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22023)⁩ أنه إذا عثرت فرق الإنقاذ على جثته عومل معاملة سائر الموتى من الغسل والتكفين والصلاة والدفن، وبيّن الجواب حكم من لم يعثر على جثته على وجهه."
  en: "A questioner asked about the funeral prayer for his relative who drowned. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22023) answered that if rescue teams recover the body it is treated like any dead person — washed, shrouded, prayed over and buried; the answer sets out the ruling where the body is not found."
  ur: "ایک سائل نے اپنے ڈوبے ہوئے رشتہ دار کی نمازِ جنازہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22023)⁩ نے جواب دیا کہ اگر ریسکیو ٹیمیں لاش برآمد کر لیں تو اسے دیگر موتوں کی طرح غسل، کفن، نماز اور دفن دیا جائے؛ جس کی لاش نہ ملے اس کا حکم جواب میں بیان ہوا۔"
  es: "Un consultante preguntó sobre la oración fúnebre por su familiar que se ahogó. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22023) respondió que si los equipos de rescate recuperan el cuerpo, se le trata como a cualquier persona fallecida: se lava, se amortaja, se reza por él y se le entierra; la respuesta establece la norma en caso de que no se encuentre el cuerpo."
  fr: "Un homme a posé une question concernant la prière funéraire pour un proche décédé par noyade. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22023) a répondu que si les équipes de secours retrouvent le corps, celui-ci est traité comme pour tout défunt: lavé, enveloppé dans un linceul, une prière est récitée et il est enterré. La fatwa précise la procédure à suivre lorsque le corps n'est pas retrouvé."
  tr: "Bir soru soran kişi, boğulan akrabası için yapılan cenaze namazını sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22023), kurtarma ekipleri cesedini bulursa, yıkanma, kefenleme, namaz kılma ve gömme işlemleriyle diğer ölüler gibi muamele göreceğini söyledi. Cevap, cesedi bulunmayan birinin yüzündeki kararla açıklanıyor."
  id: "Seorang penanya menanyakan tentang doa pemakaman untuk kerabatnya yang tenggelam. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22023) menjawab bahwa jika tim penyelamat menemukan jenazahnya, ia diperlakukan seperti para korban lainnya dalam hal mandi, kain kabin, doa, dan pemakaman. Jawabannya dijelaskan dengan keputusan pada wajah seseorang yang jasadnya tidak ditemukan."
