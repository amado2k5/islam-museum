label:
  ar: "كتاب الخراج لأبي يوسف"
  en: "Kitab al-Kharaj (Abu Yusuf)"
  ur: "کتاب الخراج ⁦(ابو یوسف)⁩"
summary:
  ar: "كتاب في المالية العامة والأحكام السلطانية كتبه القاضي أبو يوسف يعقوب بن إبراهيم ⁦(ت 182هـ)⁩ جواباً لهارون الرشيد، الذي سأله أن يضع له كتاباً جامعاً يعمل به في جباية الخراج والعشور والصدقات والجوالي وغير ذلك، يريد به رفع الظلم عن رعيته. يفتتحه بموعظة للخليفة، ثم يتناول الفيء والخراج وأرض السواد والشام، والقطائع، والموات، والصدقات، والمياه والأنهار، والجزية وأهل الذمة، والعشور، والمرتد، وقتال أهل الشرك وأهل البغي، بأسانيده إلى النبي والصحابة. {cite:kitab-al-kharaj-salafiyya-1392 p.5} {cite:kitab-al-kharaj-salafiyya-1392 p.27} {cite:kitab-al-kharaj-salafiyya-1392 p.144} {cite:kitab-al-kharaj-salafiyya-1392 p.209}"
  en: "A book on public finance and government by the judge Abu Yusuf Ya'qub ibn Ibrahim (d. 182 AH), written in reply to Harun al-Rashid, who asked him for a comprehensive book to act on in collecting the land tax, tithes, alms, the poll tax and other levies, wishing to lift injustice from his subjects. It opens with an exhortation to the caliph and then treats fay' and land tax, the lands of the Sawad and Syria, land grants, dead land, alms, water and rivers, the jizya and the protected peoples, customs dues, the apostate, and fighting polytheists and rebels, with the author's chains to the Prophet and the Companions."
  ur: "عوامی مالیات اور سلطانی احکام پر قاضی ابو یوسف یعقوب بن ابراہیم ⁦(وفات 182ھ)⁩ کی کتاب، جو انہوں نے ہارون الرشید کے جواب میں لکھی، جنہوں نے ان سے ایک جامع کتاب مانگی تھی جس پر وہ خراج، عشور، صدقات، جوالی وغیرہ کی وصولی میں عمل کریں، اور جس سے ان کا مقصد رعایا سے ظلم دور کرنا تھا۔ کتاب خلیفہ کے لیے نصیحت سے شروع ہوتی ہے، پھر فیء اور خراج، سواد اور شام کی زمینیں، قطائع، موات، صدقات، پانی اور نہریں، جزیہ اور اہلِ ذمہ، عشور، مرتد، اور مشرکین اور باغیوں سے قتال کو ان کی سندوں کے ساتھ نبی اور صحابہ تک بیان کرتی ہے۔"
