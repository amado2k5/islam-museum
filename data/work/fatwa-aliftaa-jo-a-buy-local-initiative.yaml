id: work/fatwa-aliftaa-jo-a-buy-local-initiative
class: work
kind: fatwa
label: { ar: "إطلاق مبادرة تشجع على شراء المنتج المحلي", en: "Launching an initiative that encourages buying local products", ur: "مقامی مصنوعات خریدنے کی ترغیب دینے والی مہم شروع کرنا" }
summary:
  ar: "سؤال عن إطلاق مبادرة تشجع على شراء المنتج المحلي، وهل فيها تفريق بين المسلمين وتعطيل للمنتجات غير الوطنية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا بأس بها لما فيها من التعاون على الخير، وأنها ليست دعوة إلى الفرقة ولا تعطيلًا لغيرها من المنتجات. أجابت الدائرة بأن قوة الاقتصاد ركيزة للاستقلال وعدم التبعية ومطلب لتحقيق السلم والأمن المجتمعي، وذكرت أن من أول ما قام به النبي عند قدومه المدينة إنشاء سوق للمسلمين بدلًا من الاعتماد على سوق كان يهيمن عليه غيرهم، ثم حثه على الزراعة والأكل من عمل اليد، وعدّت التعاون على ذلك تعاونًا على الخير. وقالت إنه ينبغي دعم المنتجات الوطنية والصناعات المحلية التي ترفد اقتصاد البلاد، لأن ذلك أدعى للنهوض بالاقتصاد الوطني وتشجيع التجار والصناع على تحسين منتجاتهم. وبينت أن هذه المبادرات ليست دعوة إلى الفرقة، ولا تعطيلًا للمنتج غير الوطني الذي يبقى يباع ويسوّق، وأن الترويج للمنتج المحلي لا يعني ذم غيره، وتبقى المنافسة هي الأساس. وخلصت إلى أنه لا بأس بإطلاق المبادرات التي تشجع على المنتج المحلي."
  en: "A question about launching an initiative that encourages buying local products, and whether it divides Muslims or shuts out non-national products, in which Jordan's General Iftaa Department answered that such initiatives are acceptable as cooperation in good, and are neither a call to division nor a boycott of other products. The Department answered that economic strength is a foundation of real independence and freedom from dependence, and a requirement for social peace and security; it noted that among the first things the Prophet did on arriving in Medina was to set up a market for the Muslims instead of relying on a market others dominated, and that he then encouraged farming and living from one's own work, and it counted cooperation in this as cooperation in good. It said national products and local industries that support the country's economy should be supported, since this does more to raise the national economy and to encourage traders and manufacturers to improve their products. It explained that such initiatives are not a call to division, nor do they shut out non-national products, which continue to be sold and marketed; promoting local products does not mean disparaging others, and competition remains the basis. It concluded that there is nothing wrong with launching initiatives that encourage buying local products."
  ur: "مقامی مصنوعات خریدنے کی ترغیب دینے والی مہم شروع کرنے کے بارے میں سوال، اور یہ کہ کیا اس سے مسلمانوں میں تفریق اور غیر ملکی مصنوعات کا بائیکاٹ ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایسی مہمیں خیر میں تعاون ہونے کی وجہ سے درست ہیں، اور نہ تفرقے کی دعوت ہیں نہ دوسری مصنوعات کا بائیکاٹ۔ ڈیپارٹمنٹ نے جواب دیا کہ معاشی قوت حقیقی خود مختاری اور عدم انحصار کی بنیاد ہے اور سماجی امن و سلامتی کا تقاضا ہے؛ اس نے ذکر کیا کہ نبی نے مدینہ پہنچنے پر سب سے پہلے کاموں میں سے ایک یہ کیا کہ دوسروں کے زیر تسلط بازار پر انحصار کے بجائے مسلمانوں کے لیے بازار قائم کیا، پھر کھیتی باڑی اور اپنے ہاتھ کی کمائی کی ترغیب دی، اور اس میں تعاون کو خیر میں تعاون شمار کیا۔ اس نے کہا کہ ملک کی معیشت کو سہارا دینے والی قومی مصنوعات اور مقامی صنعتوں کی حمایت کرنی چاہیے، کیونکہ اس سے قومی معیشت زیادہ ترقی کرتی ہے اور تاجر اور صنعت کار اپنی مصنوعات بہتر بنانے پر آمادہ ہوتے ہیں۔ اس نے وضاحت کی کہ یہ مہمیں تفرقے کی دعوت نہیں، اور نہ غیر ملکی مصنوعات کا تعطل ہیں جو بکتی اور فروخت ہوتی رہتی ہیں؛ مقامی مصنوعات کی تشہیر کا مطلب دوسروں کی مذمت نہیں، اور بنیاد مسابقت ہی رہتی ہے۔ اس نے نتیجہ نکالا کہ مقامی مصنوعات کی ترغیب دینے والی مہمیں شروع کرنے میں کوئی حرج نہیں۔"
