label: { ar: "إطلاق مبادرة تشجع على شراء المنتج المحلي", en: "Launching an initiative that encourages buying local products", ur: "مقامی مصنوعات خریدنے کی ترغیب دینے والی مہم شروع کرنا", es: "Lanzar una iniciativa que fomente la compra de productos locales.", fr: "Lancement d'une initiative encourageant l'achat de produits locaux", tr: "Yerel ürünlerin satın alınmasını teşvik eden bir girişim başlatmak", id: "Meluncurkan inisiatif yang mendorong pembelian produk lokal" }
summary:
  ar: "سؤال عن إطلاق مبادرة تشجع على شراء المنتج المحلي، وهل فيها تفريق بين المسلمين وتعطيل للمنتجات غير الوطنية، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا بأس بها لما فيها من التعاون على الخير، وأنها ليست دعوة إلى الفرقة ولا تعطيلًا لغيرها من المنتجات. أجابت الدائرة بأن قوة الاقتصاد ركيزة للاستقلال وعدم التبعية ومطلب لتحقيق السلم والأمن المجتمعي، وذكرت أن من أول ما قام به النبي عند قدومه المدينة إنشاء سوق للمسلمين بدلًا من الاعتماد على سوق كان يهيمن عليه غيرهم، ثم حثه على الزراعة والأكل من عمل اليد، وعدّت التعاون على ذلك تعاونًا على الخير. وقالت إنه ينبغي دعم المنتجات الوطنية والصناعات المحلية التي ترفد اقتصاد البلاد، لأن ذلك أدعى للنهوض بالاقتصاد الوطني وتشجيع التجار والصناع على تحسين منتجاتهم. وبينت أن هذه المبادرات ليست دعوة إلى الفرقة، ولا تعطيلًا للمنتج غير الوطني الذي يبقى يباع ويسوّق، وأن الترويج للمنتج المحلي لا يعني ذم غيره، وتبقى المنافسة هي الأساس. وخلصت إلى أنه لا بأس بإطلاق المبادرات التي تشجع على المنتج المحلي."
  en: "A question about launching an initiative that encourages buying local products, and whether it divides Muslims or shuts out non-national products, in which Jordan's General Iftaa Department answered that such initiatives are acceptable as cooperation in good, and are neither a call to division nor a boycott of other products. The Department answered that economic strength is a foundation of real independence and freedom from dependence, and a requirement for social peace and security; it noted that among the first things the Prophet did on arriving in Medina was to set up a market for the Muslims instead of relying on a market others dominated, and that he then encouraged farming and living from one's own work, and it counted cooperation in this as cooperation in good. It said national products and local industries that support the country's economy should be supported, since this does more to raise the national economy and to encourage traders and manufacturers to improve their products. It explained that such initiatives are not a call to division, nor do they shut out non-national products, which continue to be sold and marketed; promoting local products does not mean disparaging others, and competition remains the basis. It concluded that there is nothing wrong with launching initiatives that encourage buying local products."
  ur: "مقامی مصنوعات خریدنے کی ترغیب دینے والی مہم شروع کرنے کے بارے میں سوال، اور یہ کہ کیا اس سے مسلمانوں میں تفریق اور غیر ملکی مصنوعات کا بائیکاٹ ہوتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ایسی مہمیں خیر میں تعاون ہونے کی وجہ سے درست ہیں، اور نہ تفرقے کی دعوت ہیں نہ دوسری مصنوعات کا بائیکاٹ۔ ڈیپارٹمنٹ نے جواب دیا کہ معاشی قوت حقیقی خود مختاری اور عدم انحصار کی بنیاد ہے اور سماجی امن و سلامتی کا تقاضا ہے؛ اس نے ذکر کیا کہ نبی نے مدینہ پہنچنے پر سب سے پہلے کاموں میں سے ایک یہ کیا کہ دوسروں کے زیر تسلط بازار پر انحصار کے بجائے مسلمانوں کے لیے بازار قائم کیا، پھر کھیتی باڑی اور اپنے ہاتھ کی کمائی کی ترغیب دی، اور اس میں تعاون کو خیر میں تعاون شمار کیا۔ اس نے کہا کہ ملک کی معیشت کو سہارا دینے والی قومی مصنوعات اور مقامی صنعتوں کی حمایت کرنی چاہیے، کیونکہ اس سے قومی معیشت زیادہ ترقی کرتی ہے اور تاجر اور صنعت کار اپنی مصنوعات بہتر بنانے پر آمادہ ہوتے ہیں۔ اس نے وضاحت کی کہ یہ مہمیں تفرقے کی دعوت نہیں، اور نہ غیر ملکی مصنوعات کا تعطل ہیں جو بکتی اور فروخت ہوتی رہتی ہیں؛ مقامی مصنوعات کی تشہیر کا مطلب دوسروں کی مذمت نہیں، اور بنیاد مسابقت ہی رہتی ہے۔ اس نے نتیجہ نکالا کہ مقامی مصنوعات کی ترغیب دینے والی مہمیں شروع کرنے میں کوئی حرج نہیں۔"
  es: "Ante una pregunta sobre el lanzamiento de una iniciativa que fomenta la compra de productos locales y si esta divide a los musulmanes o excluye los productos extranjeros, el Departamento General de Iftaa de Jordania respondió que tales iniciativas son aceptables como cooperación para el bien común y no constituyen ni un llamado a la división ni un boicot a otros productos. El Departamento explicó que la fortaleza económica es la base de la verdadera independencia y la libertad de dependencia, así como un requisito para la paz y la seguridad sociales. Señaló que una de las primeras acciones del Profeta al llegar a Medina fue establecer un mercado para los musulmanes en lugar de depender de un mercado dominado por otros, y que luego fomentó la agricultura y el sustento propio, considerando la cooperación en este sentido como cooperación para el bien común. Afirmó que se deben apoyar los productos nacionales y las industrias locales que sustentan la economía del país, ya que esto contribuye en mayor medida al crecimiento de la economía nacional y alienta a comerciantes y fabricantes a mejorar sus productos. Explicó que tales iniciativas no son un llamado a la división ni excluyen los productos extranjeros, que continúan vendiéndose y comercializándose; promover los productos locales no significa menospreciar a los demás, y la competencia sigue siendo la base. Concluyó que no hay nada de malo en lanzar iniciativas que fomenten la compra de productos locales."
  fr: "Interrogé sur le lancement d'une initiative encourageant l'achat de produits locaux et sur son impact potentiel sur la communauté musulmane et l'exclusion des produits étrangers, le Département général de la Iftaa jordanien a répondu que de telles initiatives sont acceptables, car elles relèvent d'une coopération bienveillante. Elles ne constituent ni un appel à la division, ni un boycott d'autres produits. Le Département a expliqué que la force économique est le fondement d'une véritable indépendance et de l'absence de dépendance, et une condition essentielle à la paix et à la sécurité sociales. Il a rappelé que parmi les premières actions du Prophète à son arrivée à Médine, il a établi un marché pour les musulmans, les dispensant ainsi de dépendre d'un marché dominé par d'autres. Il a également souligné qu'il a encouragé l'agriculture et l'autosuffisance, et a considéré toute coopération en ce sens comme une coopération bienveillante. Le Département a affirmé que les produits nationaux et les industries locales, moteurs de l'économie nationale, doivent être soutenus, car cela contribue davantage à la croissance économique et incite les commerçants et les fabricants à améliorer leurs produits. Il a précisé que de telles initiatives ne sont ni un appel à la division, ni une exclusion des produits étrangers, qui continuent d'être vendus et commercialisés. Promouvoir les produits locaux ne signifie pas dénigrer les autres, et la concurrence demeure le fondement même du marché. Elle a conclu qu'il n'y a rien de mal à lancer des initiatives encourageant l'achat de produits locaux."
  tr: "Yerel ürünlerin satın alınmasını teşvik etmek için bir girişim başlatılması ve bunun Müslümanlar arasında ayrımcılık yapıp yabancı ürünleri bozup engellemeyeceği sorusuna Ürdün Genel Fetva Dairesi, bunun iyi işbirliği nedeniyle kabul edilebilir olduğunu, bölünmeye davet olmadığını ve diğer ürünlerin bozulmasına davet olmadığını yanıtladı. Bakanlık, ekonomik gücün bağımsızlık ve bağımlılık olmamanın temel taşı olduğunu, sosyal barış ve güvenliğin sağlanması talebi olduğunu belirtti. Peygamber'in Medine'ye varışında yaptığı ilk adımlardan birinin, başkalarının hakim olduğu bir pazara güvenmek yerine Müslümanlar için bir pazar kurmak olduğunu, ardından onu tarım yapmaya ve el işçiliğiyle beslenmeye teşvik ettiğini ve bu işbirliğini iyi iş birliği olarak değerlendirdiğini belirtti. Ulusal ürünlerin ve ülke ekonomisini besleyen yerel sanayilerin desteklenmesi gerektiği, çünkü bunun ulusal ekonominin ilerlemesi ve tüccar ile zanaatkarların ürünlerini geliştirmeleri için daha önemli olduğu belirtildi. Bu girişimlerin bölünmeye davet olmadığını, satılmaya ve pazarlanmaya devam eden yabancı ürünlerin aksaması olmadığını, yerel ürünlerin tanıtılmasının başkalarını suçlamak anlamına gelmediğini ve rekabetin temel olmaya devam ettiğini açıkladı. Yerel ürünleri teşvik eden girişimlerin başlatılmasının mümkün olduğunu belirtti."
  id: "Mengenai peluncuran inisiatif untuk mendorong pembelian produk lokal, dan apakah hal itu akan mendiskriminasi umat Muslim serta mengganggu produk non-nasional, Departemen Fatwa Umum Yordania menjawab bahwa hal itu dapat diterima karena kerja sama baik mereka, dan bukan undangan untuk pembagian atau gangguan produk lain. Departemen menjawab bahwa kekuatan ekonomi adalah pilar kemandirian dan tidak bergantung serta tuntutan untuk mencapai perdamaian dan keamanan sosial. Departemen tersebut menyebutkan bahwa salah satu tindakan pertama yang dilakukan Nabi saat tiba di Madinah adalah mendirikan pasar bagi umat Muslim daripada bergantung pada pasar yang didominasi oleh pihak lain, lalu mendorongnya untuk bertani dan makan dengan kerja tangan, dan menganggap kerja sama dalam hal ini sebagai kerja sama untuk kebaikan. Departemen tersebut menyatakan bahwa produk nasional dan industri lokal yang memasok perekonomian negara harus didukung karena hal ini lebih penting untuk memajukan ekonomi nasional dan mendorong pedagang serta pengrajin untuk meningkatkan produk mereka. Ia menjelaskan bahwa inisiatif ini bukanlah undangan untuk perpecahan, maupun gangguan terhadap produk non-nasional yang terus dijual dan dipasarkan, dan bahwa mempromosikan produk lokal tidak berarti menyalahkan orang lain, dan persaingan tetap menjadi fondasi. Ia menyimpulkan bahwa diperbolehkan untuk meluncurkan inisiatif yang mendorong produk lokal."
