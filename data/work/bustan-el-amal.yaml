id: work/bustan-el-amal
class: work
kind: lecture-series
label:
  ar: "بستان الأمل (برنامج)"
  en: "Bustan al-Amal (programme)"
  ur: "بستان الامل (پروگرام)"
summary:
  ar: "برنامج رمضاني لعمر عبد الكافي في أرشيف أسابيل، في ثلاثين حلقة، يخاطب فيه أصحاب الهموم والشدائد: المريض والخائف والمظلوم والمحزون والمدين، ويعرض الفرج بعد الشدة من قصص القرآن والسيرة والصالحين."
  en: "A Ramadan programme by Omar Abdelkafy on the Assabile archive, thirty episodes, addressed to those burdened with worries and hardships, the sick, the fearful, the wronged, the grieving and the indebted, setting out relief after hardship through stories of the Qur'an, the Prophet's life and the righteous."
  ur: "اسابیل آرکائیو میں عمر عبد الکافی کا رمضانی پروگرام، تیس اقساط، جس میں وہ غموں اور سختیوں والوں سے خطاب کرتے ہیں، بیمار، خوفزدہ، مظلوم، غمگین اور مقروض، اور قرآن، سیرت اور صالحین کے قصوں سے سختی کے بعد کشادگی بیان کرتے ہیں۔"
