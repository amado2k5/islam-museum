label: { ar: "قرار مجمع الفقه الإسلامي الدولي 199 (21/5) بشأن تجسيد الأنبياء والصحابة في الأعمال الفنية", en: "IIFA resolution 199 (21/5) on depicting prophets and Companions in artworks", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 199 (21/5): فن پاروں میں انبیاء اور صحابہ کی تصویر کشی", es: "Resolución 199 (21/5) de la IIFA sobre la representación de profetas y Compañeros en obras de arte.", fr: "Résolution 199 (21/5) de l'IIFA sur la représentation des prophètes et des Compagnons dans les œuvres d'art" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩. بعد اطلاع المجلس على البحوث الواردة بخصوص تجسيد الأنبياء والصحابة في الأعمال الفنية واستماعه إلى المناقشات التي دارت حوله، رأى تأجيل الموضوع لدورة قادمة لمزيد من البحث والدراسة. وهو قرار تأجيل لا قرار حكم."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013). After reviewing the research submitted on depicting prophets and Companions in artworks and hearing the discussions around it, it resolved to postpone the subject to a coming session for further research and study. A deferral, not a ruling."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں۔ فن پاروں میں انبیاء اور صحابہ کی تصویر کشی پر آنے والی تحقیقات کا جائزہ اور مباحث سماع کے بعد اکیڈمی نے موضوع کو اگلی مجلس تک مزید تحقیق و مطالعے کے لیے مؤجل کرنے کی رائے دی۔ یہ مؤجل کی قرارداد ہے، حکم کی نہیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 21.ª sesión celebrada en Riad (del 15 al 19 de Muharram de 1435, del 18 al 22 de noviembre de 2013). Tras revisar la investigación presentada sobre la representación de los profetas y los Compañeros en las obras de arte y escuchar los debates al respecto, se decidió aplazar el tema a una sesión posterior para profundizar en su investigación y estudio. Se trata de un aplazamiento, no de una decisión definitiva."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013). Après examen des recherches soumises sur la représentation des prophètes et des Compagnons dans l'art et audition des débats y afférents, l'Académie a décidé de reporter l'étude de ce sujet à une session ultérieure afin d'approfondir la question. Il s'agit d'un report, et non d'une décision."
