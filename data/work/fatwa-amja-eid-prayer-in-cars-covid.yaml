id: work/fatwa-amja-eid-prayer-in-cars-covid
class: work
kind: fatwa
label: { ar: "صلاة العيد في السيارات", en: "Eid prayer organized in cars — ruled on for the COVID closures", ur: "گاڑیوں میں عید نماز — کورونا بندش میں" }
summary:
  ar: "سأل سائل عن حكم ما يقترحه البعض من تنظيم صلاة عيد والناس في سياراتهم أيام إغلاق كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87759 بتاريخ 23 مايو 2020)⁩ أن صلاة العيد سنة عند المالكية والشافعية وواجب عيني عند الحنفية وواجب كفائي عند الحنابلة وعلى القول بسنيتها لا حرج في ترك القيام في صلاتها حتى مع القدرة على ما فصّل الجواب من ضوابط أدائها في النازلة."
  en: "A questioner asked about the proposal to hold the Eid prayer with people in their cars during the COVID closures. AMJA's fatwa committee (fatwa no. 87759, 23 May 2020) answered that the Eid prayer is a sunna for the Malikis and Shafi'is, an individual duty for the Hanafis, and a collective duty for the Hanbalis; on the sunna view there is no harm in leaving the standing in it even when able — as the answer details its performance rules in the crisis."
  ur: "گاڑیوں میں عید؟ لجنة الفتوى ⁦(فتویٰ 87759، 23 مئی 2020)⁩ کے مطابق عید مذاہب میں سنة تا واجب؛ سنت قول پر ادا نہ کرنے میں حرج نہیں — نازلے کے ضوابط بیان ہوئے۔"
