id: work/fatwa-amja-eid-prayer-in-cars-covid
class: work
kind: fatwa
label: { ar: "صلاة العيد في السيارات", en: "Eid prayer organized in cars — ruled on for the COVID closures", ur: "گاڑیوں میں عید نماز — کورونا بندش میں", es: "La oración del Eid se organiza en coches, según lo dictaminado por los cierres debido a la COVID-19.", fr: "Prière de l'Aïd organisée dans les voitures — maintenue malgré les fermetures liées à la COVID" }
summary:
  ar: "سأل سائل عن حكم ما يقترحه البعض من تنظيم صلاة عيد والناس في سياراتهم أيام إغلاق كورونا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87759 بتاريخ 23 مايو 2020)⁩ أن صلاة العيد سنة عند المالكية والشافعية وواجب عيني عند الحنفية وواجب كفائي عند الحنابلة وعلى القول بسنيتها لا حرج في ترك القيام في صلاتها حتى مع القدرة على ما فصّل الجواب من ضوابط أدائها في النازلة."
  en: "A questioner asked about the proposal to hold the Eid prayer with people in their cars during the COVID closures. AMJA's fatwa committee (fatwa no. 87759, 23 May 2020) answered that the Eid prayer is a sunna for the Malikis and Shafi'is, an individual duty for the Hanafis, and a collective duty for the Hanbalis; on the sunna view there is no harm in leaving the standing in it even when able — as the answer details its performance rules in the crisis."
  ur: "گاڑیوں میں عید؟ لجنة الفتوى ⁦(فتویٰ 87759، 23 مئی 2020)⁩ کے مطابق عید مذاہب میں سنة تا واجب؛ سنت قول پر ادا نہ کرنے میں حرج نہیں — نازلے کے ضوابط بیان ہوئے۔"
  es: "Un interlocutor preguntó sobre la propuesta de celebrar la oración del Eid con la gente en sus coches durante los cierres por la COVID-19. El comité de fatwas de AMJA (fatwa n.º 87759, 23 de mayo de 2020) respondió que la oración del Eid es una sunna para los malikíes y shafiíes, un deber individual para los hanafíes y un deber colectivo para los hanbalíes; según la sunna, no hay inconveniente en abandonar la oración de pie incluso cuando sea posible, tal como se detalla en la respuesta sobre sus normas de realización en la crisis."
  fr: "Une personne a posé une question concernant la proposition d'organiser la prière de l'Aïd en voiture pendant les fermetures liées à la COVID-19. Le comité des fatwas de l'AMJA (fatwa n° 87759, 23 mai 2020) a répondu que la prière de l'Aïd est une sunna pour les malikites et les chaféites, un devoir individuel pour les hanafites et un devoir collectif pour les hanbalites; selon l'avis sunnite, il n'y a pas d'inconvénient à rester debout pour la prière, même lorsque cela est possible – la réponse détaillant les règles de pratique en période de crise."
