label: { ar: "الحمد لله (شكرا يا الله)", en: "Thank You Allah", ur: "تھینک یو اللہ" }
summary:
  ar: "ألبوم الاستوديو الأول لماهر زين، صدر عن أوايكننغ ريكوردز في نوفمبر 2009 بثلاث عشرة أغنية وأغنيتين إضافيتين، بالإنجليزية أساسا مع نسخ بالعربية والفرنسية والتركية والأردية والماليزية والإندونيسية؛ نال شهادات بلاتينية متعددة في ماليزيا وإندونيسيا، وانتشرت أناشيده مثل «إن شاء الله» و«يا نبي سلام عليك» عبر الإنترنت."
  en: "Maher Zain's debut studio album, released by Awakening Records in November 2009 with thirteen songs and two bonus tracks, mainly in English with versions in Arabic, French, Turkish, Urdu, Malay and Indonesian; it was certified multi-platinum in Malaysia and Indonesia, and songs such as 'Insha Allah' and 'Ya Nabi Salam Alayka' spread worldwide online."
  ur: "ماہر زین کا پہلا اسٹوڈیو البم، نومبر 2009 میں اویکننگ ریکارڈز سے تیرہ گیتوں اور دو اضافی ٹریکس کے ساتھ جاری ہوا، بنیادی طور پر انگریزی میں اور عربی، فرانسیسی، ترکی، اردو، ملے اور انڈونیشی ورژن کے ساتھ؛ ملائیشیا اور انڈونیشیا میں کئی بار پلاٹینم سند پائی۔"
