id: work/fatwa-dar-alifta-eg-zakat-frozen-bank-account
class: work
kind: fatwa
label: { ar: "حكم زكاة الحساب البنكي الممنوع صاحبه من التصرف فيه", en: "Zakat on a bank account its owner may not dispose of", ur: "ایسے بینک اکاؤنٹ پر زکات جس میں مالک تصرف نہیں کر سکتا", es: "Zakat en una cuenta bancaria de la que su propietario no puede disponer", fr: "La zakat déposée sur un compte bancaire ne peut être aliénée par son titulaire." }
summary:
  ar: "سائل أودع مالًا في حساب بنكي مغلق للنفقة مدة الإقامة المؤقتة في دولة معينة وسأل عن زكاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23893)⁩ ببيان حكم الزكاة في المال المودع في حساب لا يتمكن صاحبه من التصرف فيه، وضابطه من الملك التام وبلوغ النصاب وحولان الحول على ما فصّل الجواب."
  en: "A questioner had deposited money in a blocked bank account for living expenses during a temporary stay in a given country, and asked about its zakat. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23893) answered by setting out the ruling on zakat for money deposited in an account its owner cannot freely dispose of — in terms of complete ownership, the nisab and the passing of the year, as the answer details."
  ur: "ایک سائل نے کسی ملک میں عارضی قیام کے اخراجات کے لیے بند بینک اکاؤنٹ میں رقم جمع کرائی اور اس کی زکات پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23893)⁩ نے جواب میں اس رقم پر زکات کا حکم بیان کیا جو ایسے اکاؤنٹ میں جمع ہو جس میں مالک آزادانہ تصرف نہ کر سکے — مکمل ملکیت، نصاب اور سال گزرنے کے ضابطوں کی رو سے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante había depositado dinero en una cuenta bancaria bloqueada para cubrir sus gastos de manutención durante una estancia temporal en un país determinado, y preguntó sobre el zakat correspondiente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 23893) respondió estableciendo la normativa sobre el zakat para el dinero depositado en una cuenta de la que su propietario no puede disponer libremente, en términos de propiedad plena, el nisab y el transcurso del año, como se detalla en la respuesta."
  fr: "Une personne ayant déposé de l'argent sur un compte bancaire bloqué pour couvrir ses frais de subsistance lors d'un séjour temporaire dans un pays donné s'est interrogée sur la zakat correspondante. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23893) a répondu en exposant la règle relative à la zakat pour les sommes déposées sur un compte dont le titulaire ne peut disposer librement, notamment en ce qui concerne la pleine propriété, le nisab et le passage de l'année, comme le précise la réponse."
