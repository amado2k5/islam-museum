label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن زراعة خلايا المخ والجهاز العصبي", en: "IIFA resolution on transplanting brain and nervous-system cells", ur: "اکیڈمی کی قرارداد: دماغ اور اعصابی نظام کے خلیوں کی پیوندکاری", es: "Resolución de la IIFA sobre el trasplante de células cerebrales y del sistema nervioso.", fr: "Résolution de l'IIFA sur la transplantation de cellules cérébrales et du système nerveux", tr: "Beyin ve sinir sistemi hücre nakli ile ilgili Uluslararası İslami Fiqh Akademisi kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai transplantasi sel otak dan sistem saraf" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩: إذا كان المصدر الغدة الكظرية للمريض نفسه فلا بأس شرعًا لميزة القبول المناعي، وإذا كان من جنين حيواني فلا مانع إن أمكن نجاحها ولم يترتب محاذير، وبيّن الأحكام للصور الأخرى على ما فصّل القرار."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990) on transplanting brain and nervous-system cells: taking tissue from the patient's own adrenal gland is permissible given immune acceptance; taking it from an animal foetus is not barred if success is possible without sharia prohibitions arising; the remaining cases are set out as detailed."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩: مریض کی اپنی غدے کے خلیے جائز؛ حیوانی جنین سے بھی گنجائش بشرط عدم محاذیر؛ دیگر صورتوں کے احکام بیان ہوئے۔"
  es: "Resolución de la sexta sesión de la IIFA (Jeddah, marzo de 1990) sobre el trasplante de células cerebrales y del sistema nervioso: se permite tomar tejido de la glándula suprarrenal del propio paciente siempre que haya aceptación inmunológica; no está prohibido tomarlo de un feto animal si es posible tener éxito sin que surjan prohibiciones de la sharia; los casos restantes se exponen con detalle."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990) sur la transplantation de cellules cérébrales et du système nerveux: le prélèvement de tissu sur la propre glande surrénale du patient est autorisé sous réserve d'acceptation immunitaire; le prélèvement sur un fœtus animal n'est pas interdit si le succès est possible sans que des interdictions de la charia ne surviennent; les autres cas sont exposés en détail."
  tr: "Uluslararası İslami Fiqh Akademisi'nin altıncı oturumunda (Cidde, Mart 1990) karar alışı: Eğer kaynak hastanın adrenal bezi ise, İslam hukukunda bağışıklık kabul özelliğine zarar yoktur; eğer hayvan embriyosunsa, başarılı olabiliyorsa itiraz yoktur ve önlem alınmaz. Diğer vakalar için kararlar kararda ayrıntılı olarak açıklığa kavuşturulmuştur."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keenamnya (Jeddah, Maret 1990): Jika sumbernya adalah kelenjar adrenal pasien itu sendiri, tidak ada kerugian dalam hukum Islam untuk fitur penerimaan imun; jika berasal dari embrio hewan, tidak ada keberatan jika dapat berhasil dan tidak ada tindakan pencegahan. Putusan untuk kasus lain dijelaskan sebagaimana dirinci dalam keputusan."
