id: work/fatwa-amja-quran-numerical-analysis
class: work
kind: fatwa
label: { ar: "التحليل العددي للقرآن", en: "Numerical analysis of the Qur'an — learn first", ur: "قرآن کی عددی تجزیہ — پہلے علم", es: "Análisis numérico del Corán: aprenda primero" }
summary:
  ar: "سأل سائل عن تحليلات عددية للقرآن من قبيل عدد البقر والسمان والعجاف وعلاقة ذلك بزكاة البقر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 2644 بتاريخ 14 فبراير 2007)⁩ بشكره على اهتمامه بالقرآن وتدبره له ونصحه بالابتعاد عن الاشتغال بمثل هذه التحليلات في هذه المرحلة فإن لذلك عدة يجب تحصيلها أولًا ثم يكون الاشتغال بالتحليل والتفسير بعد ذلك فليطلب العلم من مظانه وعلى يد أهله ويشتغل بذلك في هذه المرحلة وعندما يحصل عدة النظر والتفسير سيكتشف بنفسه ما تتضمنه مثل هذه التحليلات من مخاطر وتجاوزات."
  en: "A questioner offered numerical analyses of the Qur'an — counting cows, fat and lean — linking them to the zakat of cattle. Dr. Salah al-Sawi (fatwa no. 2644, 14 February 2007) thanked him for his care for the Qur'an and his pondering it, and counselled leaving such analyses for now: the approach needs tools to be acquired first, then analysis and interpretation may follow; let him seek knowledge from its sources at its people's hands and busy himself with that at this stage — once he holds the tools of inquiry and interpretation he will himself discover the risks and overreach in such analyses."
  ur: "ایک سائل نے قرآن کے عددی تجزیے پیش کیے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 2644، 14 فروری 2007)⁩ کے مطابق اس مرحلے میں ایسے تجزیے چھوڑے — پہلے علم کے اوزار حاصل کرے، پھر تجزیہ خود خطرات دیکھے گا۔"
  es: "Un interlocutor ofreció análisis numéricos del Corán —contando vacas, gordas y flacas— y relacionándolos con el zakat del ganado. El Dr. Salah al-Sawi (fatwa n.º 2644, 14 de febrero de 2007) le agradeció su interés por el Corán y su reflexión sobre él, y le aconsejó que dejara esos análisis por el momento: el enfoque requiere adquirir primero las herramientas necesarias, y luego podrá realizar el análisis y la interpretación; que busque el conocimiento en sus fuentes, en manos de sus pueblos, y se ocupe de ello en esta etapa; una vez que posea las herramientas de investigación e interpretación, descubrirá por sí mismo los riesgos y los excesos de tales análisis."
