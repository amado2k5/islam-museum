id: work/fatwa-amja-quran-numerical-analysis
class: work
kind: fatwa
label: { ar: "التحليل العددي للقرآن", en: "Numerical analysis of the Qur'an — learn first", ur: "قرآن کی عددی تجزیہ — پہلے علم", es: "Análisis numérico del Corán: aprenda primero", fr: "Analyse numérique du Coran — Apprenez d'abord", tr: "Kur'an'ın sayısal analizi", id: "Analisis Numerik Al-Qur'an" }
summary:
  ar: "سأل سائل عن تحليلات عددية للقرآن من قبيل عدد البقر والسمان والعجاف وعلاقة ذلك بزكاة البقر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 2644 بتاريخ 14 فبراير 2007)⁩ بشكره على اهتمامه بالقرآن وتدبره له ونصحه بالابتعاد عن الاشتغال بمثل هذه التحليلات في هذه المرحلة فإن لذلك عدة يجب تحصيلها أولًا ثم يكون الاشتغال بالتحليل والتفسير بعد ذلك فليطلب العلم من مظانه وعلى يد أهله ويشتغل بذلك في هذه المرحلة وعندما يحصل عدة النظر والتفسير سيكتشف بنفسه ما تتضمنه مثل هذه التحليلات من مخاطر وتجاوزات."
  en: "A questioner offered numerical analyses of the Qur'an — counting cows, fat and lean — linking them to the zakat of cattle. Dr. Salah al-Sawi (fatwa no. 2644, 14 February 2007) thanked him for his care for the Qur'an and his pondering it, and counselled leaving such analyses for now: the approach needs tools to be acquired first, then analysis and interpretation may follow; let him seek knowledge from its sources at its people's hands and busy himself with that at this stage — once he holds the tools of inquiry and interpretation he will himself discover the risks and overreach in such analyses."
  ur: "ایک سائل نے قرآن کے عددی تجزیے پیش کیے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 2644، 14 فروری 2007)⁩ کے مطابق اس مرحلے میں ایسے تجزیے چھوڑے — پہلے علم کے اوزار حاصل کرے، پھر تجزیہ خود خطرات دیکھے گا۔"
  es: "Un interlocutor ofreció análisis numéricos del Corán —contando vacas, gordas y flacas— y relacionándolos con el zakat del ganado. El Dr. Salah al-Sawi (fatwa n.º 2644, 14 de febrero de 2007) le agradeció su interés por el Corán y su reflexión sobre él, y le aconsejó que dejara esos análisis por el momento: el enfoque requiere adquirir primero las herramientas necesarias, y luego podrá realizar el análisis y la interpretación; que busque el conocimiento en sus fuentes, en manos de sus pueblos, y se ocupe de ello en esta etapa; una vez que posea las herramientas de investigación e interpretación, descubrirá por sí mismo los riesgos y los excesos de tales análisis."
  fr: "Un interrogateur proposa des analyses numériques du Coran – comptant les vaches, grasses et maigres – les reliant à la zakat du bétail. Le Dr Salah al-Sawi (fatwa n° 2644, 14 février 2007) le remercia de son intérêt pour le Coran et de sa méditation, et lui conseilla de reporter ces analyses: cette approche nécessite d’abord l’acquisition des outils nécessaires, l’analyse et l’interprétation pouvant alors suivre. Il lui conseilla de se renseigner auprès des sources du Coran et de s’y consacrer pour le moment; une fois en possession des outils d’investigation et d’interprétation, il constatera lui-même les risques et les excès de telles analyses."
  tr: "Kur'an'ın sayısal analizleri hakkında soru soruldu; örneğin inek, bıldırcın ve yağsız ineklerin sayısı ve bunların sığır zekatı ile ilişkisi gibi. Dr. Salah Al-Sawy (Fetva No. 2644, 14 Şubat 2007), Kur'an'a olan ilgisi ve tefekkürü için teşekkür etti ve bu aşamada bu tür analizlere girmemesini tavsiye etti; çünkü önce edinilmesi gereken birkaç araç vardır, ardından analiz ve yorumla çalışmak gerekir. Bilgiyi kaynaklarından ve ailesinden aramalı ve bu aşamada üzerinde çalışmalıdır. Düşünme ve yorumlama hazırlığı tamamlandığında, bu tür analizlerde karşılaştığı tehlikeleri ve ihlalleri kendisi keşfedecektir."
  id: "Seorang penanya ditanya tentang analisis numerik Al-Qur'an, seperti jumlah sapi, puyuh, dan sapi kurus, serta hubungannya dengan zakat pada sapi. Dr. Salah Al-Sawy (Fatwa No. 2644 tanggal 14 Februari 2007) menjawab dengan mengucapkan terima kasih atas minatnya terhadap Al-Qur'an dan kontemplasinya terhadapnya, serta menyarankan agar ia menghindari analisis seperti itu pada tahap ini, karena ada beberapa alat yang harus diperoleh terlebih dahulu, kemudian pekerjaan harus dilakukan dengan analisis dan interpretasi setelahnya. Ia harus mencari pengetahuan dari sumbernya dan melalui keluarganya serta mengerjakannya pada tahap ini. Ketika persiapan refleksi dan interpretasi selesai, ia akan menemukan sendiri bahaya dan pelanggaran yang terlibat dalam analisis tersebut."
