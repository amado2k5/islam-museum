label: { ar: "بداية التكبير في العشر الأوائل من ذي الحجة", en: "When the takbir begins in the first ten of Dhu'l-Hijja", ur: "ذوالحجہ کے پہلے دس دنوں میں تکبیر کا آغاز" }
summary:
  ar: "سائل سأل عن بداية التكبير في العشر الأوائل من ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23928)⁩ أن الاجتماع مع العائلة والتكبير معهم في هذه الأيام المباركة باب عظيم من أبواب التعاون على البر والتقوى، وبيّن الجواب وقت ابتداء التكبير المطلق والمقيد وألفاظه."
  en: "A questioner asked when the takbir begins in the first ten of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23928) answered that gathering with family and making takbir together in these blessed days is a great door of cooperating in righteousness and piety; the answer sets out when the unrestricted and the restricted takbir begin, and their wordings."
  ur: "ایک سائل نے ذوالحجہ کے پہلے دس دنوں میں تکبیر کے آغاز کا وقت پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23928)⁩ نے جواب دیا کہ ان مبارک دنوں میں اہل و عیال کے ساتھ جمع ہو کر تکبیر کہنا برائی اور پرہیزگاری میں تعاون کا عظیم دروازہ ہے؛ جواب میں مطلق اور مقید تکبیر کے آغاز کا وقت اور ان کے الفاظ بیان ہوئے۔"
