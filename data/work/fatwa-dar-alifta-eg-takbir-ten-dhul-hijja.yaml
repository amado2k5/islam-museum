label: { ar: "بداية التكبير في العشر الأوائل من ذي الحجة", en: "When the takbir begins in the first ten of Dhu'l-Hijja", ur: "ذوالحجہ کے پہلے دس دنوں میں تکبیر کا آغاز", es: "Cuando el takbir comienza en los primeros diez de Dhu'l-Hijja", fr: "Lorsque le takbir commence dans les dix premiers mois de Dhu'l-Hijja", tr: "Zhuül-Hicce'nin ilk on gecesinde tekbirin başlangıcı", id: "Awal takbir dalam sepuluh malam pertama Dhu al-Hijjah" }
summary:
  ar: "سائل سأل عن بداية التكبير في العشر الأوائل من ذي الحجة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23928)⁩ أن الاجتماع مع العائلة والتكبير معهم في هذه الأيام المباركة باب عظيم من أبواب التعاون على البر والتقوى، وبيّن الجواب وقت ابتداء التكبير المطلق والمقيد وألفاظه."
  en: "A questioner asked when the takbir begins in the first ten of Dhu'l-Hijja. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23928) answered that gathering with family and making takbir together in these blessed days is a great door of cooperating in righteousness and piety; the answer sets out when the unrestricted and the restricted takbir begin, and their wordings."
  ur: "ایک سائل نے ذوالحجہ کے پہلے دس دنوں میں تکبیر کے آغاز کا وقت پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23928)⁩ نے جواب دیا کہ ان مبارک دنوں میں اہل و عیال کے ساتھ جمع ہو کر تکبیر کہنا برائی اور پرہیزگاری میں تعاون کا عظیم دروازہ ہے؛ جواب میں مطلق اور مقید تکبیر کے آغاز کا وقت اور ان کے الفاظ بیان ہوئے۔"
  es: "Un consultante preguntó cuándo comienza el takbir en los primeros diez días de Dhu'l-Hijja. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23928) respondió que reunirse en familia y recitar el takbir juntos en estos días benditos es una gran oportunidad para cooperar en la rectitud y la piedad; la respuesta detalla cuándo comienzan el takbir sin restricciones y el takbir restringido, así como su redacción."
  fr: "Un internaute a demandé à quel moment le takbir commence durant les dix premiers jours de Dhu al-Hijja. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23928) a répondu que se réunir en famille et réciter le takbir ensemble durant ces jours bénis est une excellente occasion de coopérer dans la droiture et la piété; la réponse précise le moment où commence le takbir général et le takbir restreint, ainsi que leur formulation."
  tr: "Bir soru soran kişi, Zfu Hicce'nin ilk on gününde tekbirin başlangıcını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 23928), aileyle buluşmanın ve bu mübarek günlerde onlarla tekbirin doğru ve takvada iş birliği için büyük bir kapı olduğunu ve mutlak ve kısıtlı tekibirin zaman ve metnini netleştirdiğini söyledi."
  id: "Seorang penanya menanyakan tentang awal takbir dalam sepuluh hari pertama Dhu al-Hijjah. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 23928) menjawab bahwa bertemu keluarga dan mengucapkan takbir bersama mereka selama hari-hari yang diberkati ini adalah pintu besar menuju kerja sama dalam kebenaran dan kesalehan, serta menjelaskan waktu dan kata-kata takbir mutlak dan terbatas."
