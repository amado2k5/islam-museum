label: { ar: "الصحاح تاج اللغة وصحاح العربية", en: "al-Sihah (Taj al-Lugha wa-Sihah al-Arabiyya) of al-Jawhari", ur: "الصحاح تاج اللغۃ وصحاح العربیۃ (جوہری)" }
summary:
  ar: "معجم لغوي عربي لإسماعيل بن حماد الجوهري ⁦(ت نحو 393 أو 398هـ)⁩، ألّفه بنيسابور لأبي منصور البيشكي، ورتّب مواده على أبواب بحسب الحرف الأخير من الأصل وفصول بحسب الحرف الأول، والتزم فيه ما صحّ عنده؛ وصار رأس «مدرسة القافية» التي سار عليها لسان العرب والقاموس المحيط وتاج العروس."
  en: "An Arabic dictionary by Isma'il ibn Hammad al-Jawhari (d. c. 393 or 398 AH), compiled at Nishapur for Abu Mansur al-Bayshaki, which arranges its roots in chapters by their last radical and sections by their first, and admits only what its author held sound; it heads the 'rhyme school' of lexicography followed by Lisan al-Arab, al-Qamus al-Muhit and Taj al-Arus."
  ur: "اسماعیل بن حماد جوہری (م تقریباً 393 یا 398ھ) کی عربی لغت، جو انہوں نے نیشاپور میں ابو منصور البیشکی کے لیے تالیف کی؛ اس کے مادے آخری حرف کے لحاظ سے ابواب اور پہلے حرف کے لحاظ سے فصول میں ہیں، اور اس میں صرف وہی لیا گیا جو مصنف کے نزدیک صحیح تھا؛ یہ «مدرسۂ قافیہ» کی سربراہ ہے جس پر لسان العرب، القاموس المحیط اور تاج العروس چلے۔"
