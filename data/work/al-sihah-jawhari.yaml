label: { ar: "الصحاح تاج اللغة وصحاح العربية", en: "al-Sihah (Taj al-Lugha wa-Sihah al-Arabiyya) of al-Jawhari", ur: "الصحاح تاج اللغۃ وصحاح العربیۃ ⁦(جوہری)⁩", es: "al-Sihah (La corona de al-Lugha wa-Sihah al-Arabiyya) de al-Jawhari", fr: "al-Sihah (La couronne d'al-Lugha wa-Sihah al-Arabiyya) d'al-Jawhari", tr: "El-Sih, dilin tacı ve Arapça'nın El-Sihasıdır", id: "Al-Sihah adalah mahkota bahasa dan Al-Sihah dalam bahasa Arab" }
summary:
  ar: "معجم لغوي عربي لإسماعيل بن حماد الجوهري ⁦(ت نحو 393 أو 398هـ)⁩، ألّفه بنيسابور لأبي منصور البيشكي، ورتّب مواده على أبواب بحسب الحرف الأخير من الأصل وفصول بحسب الحرف الأول، والتزم فيه ما صحّ عنده؛ وصار رأس «مدرسة القافية» التي سار عليها لسان العرب والقاموس المحيط وتاج العروس. ويقول رمزي بعلبكي في «أرابيكا» إن الجوهري، المتوفى نحو ٤٠٠هـ/١٠١٠م، أول من جعل الترتيب الألفبائي لحروف الجذر معياراً وحيداً في نظام التقفية دون النظر إلى الأبنية والتقاليب، وغالب الظن أنه حذا حذو خاله إسحاق الفارابي في «ديوان الأدب»، وأن البندنيجي، المتوفى سنة ٢٨٤هـ/٨٩٧م، سبق الفارابي في «التقفية» لكنه لم يراعِ سوى الحرف الأخير من الجذر. ويحصي فهرس «الرق المنشور» ٣٠٢ مخطوطة منه."
  en: "An Arabic dictionary by Isma'il ibn Hammad al-Jawhari (d. c. 393 or 398 AH), compiled at Nishapur for Abu Mansur al-Bayshaki, which arranges its roots in chapters by their last radical and sections by their first, and admits only what its author held sound; it heads the 'rhyme school' of lexicography followed by Lisan al-Arab, al-Qamus al-Muhit and Taj al-Arus. Ramzi Baalbaki writes in Arabica that al-Jawhari, who died about 400 AH / 1010, was the first to make the alphabetical order of the root letters the only criterion of the rhyme system, with no regard to patterns or permutations; that he most likely followed his uncle Ishaq al-Farabi in Diwan al-adab; and that al-Bandaniji, who died in 284/897, had preceded al-Farabi in his al-Taqfiya but considered only the last letter of the root. The al-Raqq al-Manshur catalogue lists 302 manuscripts of al-Sihah."
  ur: "اسماعیل بن حماد جوہری ⁦(م تقریباً 393 یا 398ھ)⁩ کی عربی لغت، جو انہوں نے نیشاپور میں ابو منصور البیشکی کے لیے تالیف کی؛ اس کے مادے آخری حرف کے لحاظ سے ابواب اور پہلے حرف کے لحاظ سے فصول میں ہیں، اور اس میں صرف وہی لیا گیا جو مصنف کے نزدیک صحیح تھا؛ یہ «مدرسۂ قافیہ» کی سربراہ ہے جس پر لسان العرب، القاموس المحیط اور تاج العروس چلے۔ رمزی بعلبکی «اربیکا» میں لکھتے ہیں کہ جوہری، جو تقریباً 400ھ / 1010ء میں فوت ہوئے، پہلے شخص تھے جنہوں نے مادے کے حروف کی تہجی ترتیب کو نظامِ تقفیہ کا واحد معیار بنایا، اوزان اور تقالیب کا لحاظ کیے بغیر؛ غالباً انہوں نے اپنے ماموں اسحاق فارابی کی دیوان الادب کی پیروی کی؛ اور بندنیجی، جو 284ھ / 897ء میں فوت ہوئے، اپنی التقفیہ میں فارابی سے پہلے تھے مگر صرف مادے کے آخری حرف کا لحاظ کرتے تھے۔ «الرق المنشور» فہرست میں الصحاح کے 302 مخطوطات درج ہیں."
  es: "Un diccionario árabe de Isma'il ibn Hammad al-Jawhari (393 o 398 d. H.), compilado en Nishapur para Abu Mansur al-Bayshaki, que organiza sus raíces en capítulos según su último radical y secciones según el primero, y admite solo lo que su autor consideraba correcto; encabeza la \"escuela de la rima\" de lexicografía seguida por Lisan al-Arab, al-Qamus al-Muhit y Taj al-Arus. Ramzi Baalbaki escribe en Arabica que al-Jawhari, fallecido hacia 400 AH / 1010, fue el primero en hacer del orden alfabético de las letras de la raíz el único criterio del sistema de la rima, sin atender a patrones ni permutaciones; que lo más probable es que siguiera a su tío Ishaq al-Farabi en el Diwan al-adab; y que al-Bandaniyi, fallecido en 284/897, se había anticipado a al-Farabi en su al-Taqfiya, aunque solo consideraba la última letra de la raíz. El catálogo al-Raqq al-Manshur registra 302 manuscritos del al-Sihah."
  fr: "Un dictionnaire arabe d'Isma'il ibn Hammad al-Jawhari (mort en 393 ou 398 AH), compilé à Nishapur pour Abu Mansur al-Bayshaki, qui organise ses racines en chapitres par leur dernier radical et en sections par leur premier, et n'admet que ce que son auteur jugeait correct; il est à la tête de l'« école de la rime » de la lexicographie, suivi par Lisan al-Arab, al-Qamus al-Muhit et Taj al-Arus. Ramzi Baalbaki écrit dans Arabica qu'al-Jawhari, mort vers 400 AH / 1010, fut le premier à faire de l'ordre alphabétique des lettres de la racine le seul critère du système de la rime, sans égard aux schèmes ni aux permutations ; qu'il suivit très probablement son oncle Ishaq al-Farabi dans le Diwan al-adab ; et qu'al-Bandaniji, mort en 284/897, avait précédé al-Farabi dans son al-Taqfiya, mais ne considérait que la dernière lettre de la racine. Le catalogue al-Raqq al-Manshur recense 302 manuscrits d'al-Sihah."
  tr: "İsmail bin Hammad al-Jawhari (ö. yaklaşık 393 veya 398 H) tarafından hazırlanmış, Nişapur'da Ebu Mansur el-Bişki tarafından yazılan bir Arapça dil sözlüğü. Girişlerini orijinalin son harfine göre bölümlere ve ilk harfe göre bölümlere düzenledi; bu sözlük 'uyak okulunun' başı oldu, ardından Lisan al-Arab, al-Qamus al-Muheet ve Tac al-'Arus geldi. Ramzi Baalbaki'nin 'Arabica' adlı eserinde, yaklaşık 400 Hicri / 1010 yılında ölen el-Cevari'nin, kök harflerin alfabetik düzenini kafiye sisteminde yapı ve biçimlere bakmaksızın tek standart yapan ilk kişi olduğunu söyler. Muhtemelen amcası İshaq el-Farabi'nin 'Diwan al-Adab' adlı eserinde örneğini takip etmiş ve 284 Hicri / 897 yılında ölen el-Bandniji'nin 'al-Taqfiya'da el-Farabi'den önce geldiğini ancak sadece kökün son harfini kabul ettiğini belirtir. 'Yayınlanmış Makale' kataloğunda 302 el yazması bulunmaktadır."
  id: "Kamus linguistik Arab karya Ismail ibn Hammad al-Jawhari (wafat sekitar 393 atau 398 H), ditulis di Nishapur oleh Abu Mansur al-Bishki. Ia mengatur entri-entri tersebut menjadi bab-bab sesuai dengan huruf terakhir dari aslinya dan bab-bab sesuai dengan huruf pertama, dengan mengikuti apa yang ia yakini benar; kamus ini menjadi kepala 'sekolah rima,' diikuti oleh Lisan al-Arab, al-Qamus al-Muheet, dan Taj al-'Arus. Ramzi Baalbaki dalam 'Arabica' mengatakan bahwa al-Jawhari, yang meninggal sekitar tahun 400 H / 1010 M, adalah yang pertama menjadikan susunan huruf akar sebagai satu-satunya standar dalam sistem rima tanpa memperhatikan struktur dan bentuk. Kemungkinan ia mengikuti contoh pamannya Ishaq al-Farabi dalam 'Diwan al-Adab,' dan bahwa al-Bandniji, yang meninggal pada tahun 284 H / 897 M, mendahului al-Farabi dalam 'al-Taqfiya' tetapi hanya menganggap huruf terakhir dari akar tersebut. Katalog 'Published Paper' mencatat 302 manuskrip dari surat tersebut."
