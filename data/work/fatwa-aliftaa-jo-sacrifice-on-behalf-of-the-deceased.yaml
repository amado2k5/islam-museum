id: work/fatwa-aliftaa-jo-sacrifice-on-behalf-of-the-deceased
class: work
kind: fatwa
label: { ar: "الأضحية عن الميت", en: "Offering a sacrifice on behalf of the deceased", ur: "میت کی طرف سے قربانی" }
summary:
  ar: "سؤال عن الأضحية عن الميت، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأضحية عن الميت جائزة، وهو مذهب الحنابلة وقول العبادي من الشافعية، لأن الأضحية صدقة مالية يصل ثوابها إلى الأموات. أجابت الدائرة بأن الأضحية عن الميت جائزة، وأن هذا مذهب الحنابلة كما في كشاف القناع للبهوتي (6/428)، وبه قال العبادي من الشافعية كما نقله ابن قاضي شهبة في بداية المحتاج (4/358)، ونقل أيضًا عن بعض المالكية والحنفية. وذكرت أن أبا داود عقد في سننه بابًا للأضحية عن الميت، روى فيه عن حنش أنه رأى علي بن أبي طالب يضحي بكبشين، وأخبره علي أن النبي أوصاه أن يضحي عنه، وروى أيضًا عن جابر بن عبد الله أن النبي ضحى عن أمته، ومن أمته من هو ميت. وقالت إن النصوص دلت على وصول ثواب الصوم والحج إلى الميت، فالأضحية، وهي عبادة مالية محضة من جملة الصدقات، أولى بأن يصل ثوابها، وإن العلماء أجمعوا على وصول ثواب الصدقات إلى الأموات، ولذلك رأت الدائرة جوازها."
  en: "A question about offering a sacrifice on behalf of the deceased, in which Jordan's General Iftaa Department answered that a sacrifice on behalf of the deceased is permitted, the Hanbali position and the view of al-Abbadi among the Shafi'is, because the sacrifice is a financial charity whose reward reaches the dead. The Department answered that a sacrifice on behalf of the deceased is permitted, that this is the Hanbali position as in Kashshaf al-Qina by al-Buhuti (6/428), that al-Abbadi among the Shafi'is held it as reported by Ibn Qadi Shuhba in Bidayat al-Muhtaj (4/358), and that it is also reported from some Malikis and Hanafis. It noted that Abu Dawud gave a chapter of his Sunan to sacrifice on behalf of the dead, narrating from Hanash that he saw Ali ibn Abi Talib sacrifice two rams and that Ali told him the Prophet had instructed him to sacrifice on his behalf, and narrating from Jabir ibn Abdullah that the Prophet sacrificed on behalf of his community, which includes those who have died. It said the texts show that the reward of fasting and hajj reaches the dead, so the sacrifice, a purely financial act of worship that counts as charity, reaches them all the more, and that scholars agree the reward of charity reaches the dead; for these reasons the Department holds it permitted."
  ur: "میت کی طرف سے قربانی کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ میت کی طرف سے قربانی جائز ہے، یہ حنبلی مذہب اور شافعیہ میں سے عبادی کا قول ہے، کیونکہ قربانی مالی صدقہ ہے جس کا ثواب مُردوں تک پہنچتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ میت کی طرف سے قربانی جائز ہے، یہ حنبلی مذہب ہے جیسا کہ بہوتی کی کشاف القناع (6/428) میں ہے، شافعیہ میں سے عبادی کا یہی قول ہے جیسا کہ ابن قاضی شہبہ نے بدایۃ المحتاج (4/358) میں نقل کیا، اور بعض مالکیہ اور حنفیہ سے بھی منقول ہے۔ اس نے بتایا کہ ابو داود نے اپنی سنن میں میت کی طرف سے قربانی کا باب باندھا، جس میں حنش سے روایت کی کہ انہوں نے علی بن ابی طالب کو دو مینڈھوں کی قربانی کرتے دیکھا اور علی نے بتایا کہ نبی نے انہیں اپنی طرف سے قربانی کی وصیت کی تھی، اور جابر بن عبداللہ سے روایت کی کہ نبی نے اپنی امت کی طرف سے قربانی کی، اور امت میں فوت شدہ بھی ہیں۔ اس نے کہا کہ نصوص سے روزے اور حج کا ثواب میت تک پہنچنا ثابت ہے، تو قربانی، جو خالص مالی عبادت اور صدقات میں سے ہے، بدرجۂ اولیٰ پہنچتی ہے، اور علما کا اجماع ہے کہ صدقات کا ثواب مُردوں کو پہنچتا ہے، اسی لیے ڈیپارٹمنٹ نے اسے جائز قرار دیا۔"
