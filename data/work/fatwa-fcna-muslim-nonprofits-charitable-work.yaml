summary:
  ar: "ورقة للمجلس الفقهي لأمريكا الشمالية للدكتور أسامة بهلول ⁦(نُشرت 25 سبتمبر 2026)⁩ عن تحديات العمل الخيري في المنظمات المسلمة غير الربحية وحلولها المقترحة؛ تبين أن الإسلام يشجع الصدقة وتجعل الزكاة لفئات محددة هدفها الإعانة على ما فصّلته الورقة."
  en: "A Fiqh Council of North America paper by Dr. Ossama Bahloul (published 25 September 2026) on the key challenges facing Muslim nonprofits' charitable work and proposed solutions; it sets out how Islam's encouragement of charity and the assignment of zakat to specified categories aim at assistance — as the paper details."
  ur: "فقہ کونسل آف نارتھ امریکہ کی ڈاکٹر اسامہ بہلول کی تحریر ⁦(شائع شدہ 25 ستمبر 2026)⁩ مسلم غیر منافع بخش تنظیموں کے خدمتی کام کے مسائل اور حل پر؛ اسلام کی صدقہ کی ترغیب اور زکوٰۃ کے مصارف کا بیان تفصیل سے ہے۔"
  es: "Un documento del Fiqh Council of North America, elaborado por el Dr. Ossama Bahloul (publicado el 25 de septiembre de 2026), trata sobre los principales desafíos que enfrentan las organizaciones benéficas musulmanas sin fines de lucro y propone soluciones; en él se expone cómo el fomento de la caridad en el Islam y la asignación del zakat a categorías específicas tienen como objetivo brindar asistencia, tal como se detalla en el documento."
