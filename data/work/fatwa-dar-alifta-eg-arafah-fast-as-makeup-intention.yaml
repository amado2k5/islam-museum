label: { ar: "حكم نية صوم يوم عرفة قضاءً قبله بأسبوع", en: "Intending the Arafa fast as makeup, resolved a week before", ur: "عرفہ کے روزے کی قضا کی نیت ایک ہفتہ پہلے" }
summary:
  ar: "سائل سأل عن نية صوم يوم عرفة قضاءً قبله بأسبوع هل يجزئ عن القضاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20700)⁩ أنه لا يجزئ عن القضاء بالنية السابقة وإنما يقع نفلًا كما نوى في ليلة الصوم لأن وقت النية محدد على ما فصّل الجواب."
  en: "A questioner asked whether the Arafa-day fast intended as makeup a week beforehand counts as makeup. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20700) answered that the earlier intention does not make it makeup; it counts as voluntary as he intended on the night of the fast, since the time of intention is fixed — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا عرفہ کا روزہ ایک ہفتہ پہلے قضا کی نیت سے قضا شمار ہوگا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20700)⁩ نے جواب دیا کہ پہلی نیت سے قضا نہیں ہوتا بلکہ روزے کی رات کی نیت کے مطابق نفل ہوگا — جیسا کہ جواب میں تفصیل ہے۔"
