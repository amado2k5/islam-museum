id: work/fatwa-amja-best-generation-claim
class: work
kind: fatwa
label: { ar: "خير القرون قرني", en: "The best generation is mine — answering the objector", ur: "بہترین قرن میری امت ہے — معترض کا جواب" }
summary:
  ar: "سأل سائل عن حديث خير القرون قرني ثم الذين يلونهم هل هو صحيح وبهذه الصيغة وعن اعتراض من له عقيدة غير صافية على فضل مجتمع الصحابة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77839 بتاريخ 15 فبراير 2009)⁩ أن الحديث ثبت في الصحيحين من حديث أبي هريرة بصيغة خير القرون قرني ثم الذين يلونهم ثم الذين يلونهم وقد تلقته الأمة بالقبول وأجمعت على معناه، ووجود قلة من المنافقين في مجتمع الصحابة لا يقلل منزلتهم ووقوع مخالفات قليلة لا يغض من قدرهم وحسبه أنها قليلة حتى أصبحت لندرتها تذكر وتروى، وظهور الردة كان في زمن أبي بكر لا زمن النبوة ومع ذلك فقد أتاحت للمسلمين أبوابًا من العبودية وأوردت كثيرًا منهم الفردوس الأعلى."
  en: "A questioner cited 'the best of generations is mine, then those who follow them' — asked if it is sound in that wording, and reported an impure-creed objector belittling the Companions' society. Dr. Salah al-Sawi (fatwa no. 77839, 15 February 2009) answered that the hadith is established in the two Sahihs from Abu Hurayra in that very wording, received by the ummah with acceptance and consensus on its meaning; a few hypocrites in the Companions' society do not lower their rank, nor do rare lapses diminish its worth — so rare they became famous for being told; the apostasy emerged in Abu Bakr's time, not the prophetic era, and even so it opened to the Muslims gates of servitude and brought many of them to the highest paradise. Recorded as AMJA's answer."
  ur: "ایک سائل نے «بہترین لوگ میرے زمانے کے ہیں» حدیث کی صحت اور صحابہ پر اعتراض کا جواب پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77839، 15 فروری 2009)⁩ کے مطابق حدیث صحیحین میں ہے؛ چند منافقین یا نادر لغزشیں صحابہ کے رتبے کو گھٹا نہیں سکتیں۔"
