id: work/fatwa-iifa-123-joint-mudaraba
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 123 (13/5) بشأن القراض أو المضاربة المشتركة في المؤسسات المالية ⁦(حسابات الاستثمار)⁩", en: "IIFA resolution 123 (13/5) on qirad/joint mudaraba in financial institutions ⁦(investment accounts)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 123 (13/5): مالی اداروں میں قراض یا مشترک مضاربہ ⁦(سرمایہ کاری اکاؤنٹس)⁩", es: "Resolución 123 (13/5) de la IIFA sobre qirad/mudaraba conjunta en instituciones financieras (cuentas de inversión)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩. عرّف المضاربة المشتركة بأنها المضاربة التي يعهد فيها مستثمرون عديدون — معًا أو بالتعاقب — إلى شخص طبيعي أو معنوي باستثمار أموالهم، ويطلق له غالبًا الاستثمار بما يرى محققًا للمصلحة وقد يقيد بنوع خاص، مع الإذن له صراحة أو ضمنًا بخلط أموالهم بعضها ببعض أو بماله، وموافقته أحيانًا على سحب أموالهم كليًا أو جزئيًا عند الحاجة بشروط معينة. وقرر مشروعيتها بناءً على ما قرره الفقهاء من جواز تعدد أرباب الأموال وجواز اشتراك المضارب معهم، ثم ساق ضوابط تطبيقها في حسابات الاستثمار في المؤسسات المالية الإسلامية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001). It defined joint mudaraba (qirad) as a mudaraba in which numerous investors, together or in succession, entrust a natural or legal person with investing their funds — usually giving him freedom to invest as he deems beneficial, sometimes restricted to a particular kind, with explicit or implicit permission to pool their funds together or with his own, and sometimes agreement that they may withdraw wholly or partly as needed under stated conditions. It ruled the arrangement lawful on the jurists' basis of the permissibility of multiple capital-providers and of the manager sharing alongside them, then gave the controls for applying it to investment accounts in Islamic financial institutions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں۔ اس نے مشترک مضاربہ ⁦(قراض)⁩ کی تعریف کی: ایسا مضاربہ جس میں متعدد سرمایہ کار — یکجا یا متعاقب — کسی حقیقی یا حکمی شخص کو اپنے مال کی سرمایہ کاری کا سپرد کریں — عموماً اسے اپنی مرضی کا محصلِ مصلحت سرمایہ کاری کی اجازت ہو، کبھی خاص قسم کی مربوط ہو، اس کی اجازت ہو کہ وہ ان کے مال آپس میں یا اپنے مال میں خلط کرے، اور کبھی شرائط کے ساتھ جزوی یا مکمل واپسی کی رضامندی ہو۔ فقہاء کی اس اجازت کی بنیاد پر کہ مالکانِ مال متعدد ہو سکتے ہیں اور مضارب بھی ان کے ساتھ شریک ہو سکتا ہے، اس نے اسے جائز قرار دیا؛ پھر اسلامی مالی اداروں میں سرمایہ کاری اکاؤنٹس پر اس کے اطلاق کے ضوابط۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 13.ª sesión celebrada en Kuwait (del 7 al 12 de Shawwal de 1422, del 22 al 27 de diciembre de 2001). Definió la mudaraba conjunta (qirad) como una mudaraba en la que numerosos inversores, de forma conjunta o sucesiva, confían a una persona física o jurídica la inversión de sus fondos, otorgándole generalmente libertad para invertir según lo considere beneficioso, a veces restringida a un tipo específico, con permiso explícito o implícito para aunar sus fondos o con los suyos, y en ocasiones con el acuerdo de que pueden retirarlos total o parcialmente según sea necesario bajo condiciones establecidas. La resolución declaró lícito el acuerdo basándose en la permisibilidad de la participación de múltiples proveedores de capital y del gestor junto con ellos, y estableció los controles para su aplicación a las cuentas de inversión en instituciones financieras islámicas."
