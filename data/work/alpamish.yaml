summary:
  ar: "ألبامش، من أشهر الملاحم التركية في آسيا الوسطى، بطلها ألبامش من قبيلة قونغرات الأوزبكية، يطلب خطيبته بارتشين في أرض القلموق، ويهزم منافسيه، ويعود بها، ثم يُسجن سبع سنين ويهرب بعون ابنة الخان، ويعود فيقتل المغتصب ويستعيد زعامة قبيلته {cite:encyclopaedia-of-islam-2 vol. 1 p. 443-444}."
  en: "Alpamish, one of the most famous Turkic epics of Central Asia. The Uzbek hero of the Kungrat tribe seeks his betrothed, Barchin, among the Kalmyks, defeats his rivals and brings her back. Later he is imprisoned for seven years and escapes with the help of the khan's daughter, returns to kill the usurper, and regains the leadership of his tribe {cite:encyclopaedia-of-islam-2 vol. 1 p. 443-444}."
