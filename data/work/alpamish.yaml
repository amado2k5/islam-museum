summary:
  ar: "ألبامش، من أشهر الملاحم التركية في آسيا الوسطى، بطلها ألبامش من قبيلة قونغرات الأوزبكية، يطلب خطيبته بارتشين في أرض القلموق، ويهزم منافسيه، ويعود بها، ثم يُسجن سبع سنين ويهرب بعون ابنة الخان، ويعود فيقتل المغتصب ويستعيد زعامة قبيلته {cite:encyclopaedia-of-islam-2 vol. 1 p. 443-444}."
  en: "Alpamish, one of the most famous Turkic epics of Central Asia. The Uzbek hero of the Kungrat tribe seeks his betrothed, Barchin, among the Kalmyks, defeats his rivals and brings her back. Later he is imprisoned for seven years and escapes with the help of the khan's daughter, returns to kill the usurper, and regains the leadership of his tribe {cite:encyclopaedia-of-islam-2 vol. 1 p. 443-444}."
  es: "Alpamish, una de las epopeyas turcas más famosas de Asia Central. El héroe uzbeko de la tribu Kungrat busca a su prometida, Barchin, entre los calmucos, derrota a sus rivales y la trae de vuelta. Posteriormente, es encarcelado durante siete años y escapa con la ayuda de la hija del kan, regresa para matar al usurpador y recupera el liderazgo de su tribu {cite:encyclopaedia-of-islam-2 vol. 1 p. 443-444}."
  fr: "Alpamish, l'une des plus célèbres épopées turques d'Asie centrale. Le héros ouzbek de la tribu des Kungrat part à la recherche de sa fiancée, Barchin, chez les Kalmouks, vainc ses rivaux et la ramène. Plus tard, il est emprisonné pendant sept ans, puis s'évade grâce à la fille du khan, revient tuer l'usurpateur et reprend le commandement de sa tribu (voir Encyclopaedia of Islam, vol. 1, p. 443-444)."
  ur: "الپامش، وسطی ایشیا کی سب سے مشہور ترک مہاکاویوں میں سے ایک۔ کنگراٹ قبیلے کا ازبک ہیرو اپنی منگنی کی تلاش میں ہے، بارچن، کلمیکس میں سے، اپنے حریفوں کو شکست دے کر اسے واپس لاتا ہے۔ بعد ازاں اسے سات سال قید کیا جاتا ہے اور خان کی بیٹی کی مدد سے فرار ہو جاتا ہے، غاصب کو مارنے کے لیے واپس آتا ہے، اور اپنے قبیلے کی قیادت دوبارہ حاصل کر لیتا ہے۔ 1 ص۔ 443-444}۔"
