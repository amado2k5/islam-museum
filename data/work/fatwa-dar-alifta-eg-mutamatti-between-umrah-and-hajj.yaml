id: work/fatwa-dar-alifta-eg-mutamatti-between-umrah-and-hajj
class: work
kind: fatwa
label: { ar: "حكم الحلق وقص الأظافر والجماع للمتمتع بين العمرة والحج", en: "Shaving, nail-clipping and relations for the mutamatti' between umrah and Hajj", ur: "عمرہ اور حج کے درمیان متمتع کے لیے حلق ناخن اور معاشرت", es: "Afeitado, corte de uñas y relaciones para los mutamatti' entre la umrah y el Hajj.", fr: "Rasage, coupe des ongles et relations pour le mutamatti' entre la umra et le Hajj" }
summary:
  ar: "سائل سأل عن الحلق وقص الأظافر والجماع للمتمتع بين العمرة والحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20684)⁩ أنه لا مانع شرعًا من أخذ الحاج المتمتع بالعمرة إلى الحج من شعره وأظفاره وكذا معاشرته لزوجته في الفترة بين العمرة والحج على ما فصّل الجواب."
  en: "A questioner asked about shaving, nail-clipping and marital relations for the mutamatti' between umrah and Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20684) answered there is no objection to any of these in the interval — as the answer details."
  ur: "ایک سائل نے عمرہ اور حج کے درمیان متمتع کے بال ناخن اور معاشرت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20684)⁩ نے جواب دیا کہ درمیانی مدت میں یہ سب جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el afeitado, el corte de uñas y las relaciones conyugales para los mutamatti' entre la umrah y el hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20684) respondió que no hay objeción a ninguna de estas prácticas en ese intervalo, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le rasage, la coupe des ongles et les relations conjugales pendant la période de mutamatti' entre la umra et le hajj. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20684) a répondu qu'il n'y avait aucune objection à cela pendant cet intervalle, comme le détaille la réponse."
