summary:
  ar: "سائل سأل عن الحلق وقص الأظافر والجماع للمتمتع بين العمرة والحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20684)⁩ أنه لا مانع شرعًا من أخذ الحاج المتمتع بالعمرة إلى الحج من شعره وأظفاره وكذا معاشرته لزوجته في الفترة بين العمرة والحج على ما فصّل الجواب."
  en: "A questioner asked about shaving, nail-clipping and marital relations for the mutamatti' between umrah and Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20684) answered there is no objection to any of these in the interval — as the answer details."
  ur: "ایک سائل نے عمرہ اور حج کے درمیان متمتع کے بال ناخن اور معاشرت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20684)⁩ نے جواب دیا کہ درمیانی مدت میں یہ سب جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
