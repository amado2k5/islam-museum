summary:
  ar: "تاج العروس من جواهر القاموس شرحٌ كتبه محمد مرتضى الزبيدي، المتوفى سنة ١٢٠٥هـ/١٧٩١م، على القاموس المحيط للفيروزآبادي. ويصفه بعلبكي بأنه أضخم المعاجم التراثية وأغزرها مادة: استغرق إملاؤه أربع عشرة سنة وأياماً وفُرغ منه سنة ١١٨٨هـ/١٧٧٤م، وفيه ١١٩٧٨ جذراً مقابل ٩٢٧٣ في اللسان و٥٦١٨ في الصحاح، وقد حافظ فيه الزبيدي على نص القاموس مميزاً عنه زياداته."
  en: "Taj al-Arus min jawahir al-Qamus, the commentary that Murtada al-Zabidi (d. 1205 AH / 1791) wrote on al-Fayruzabadi's dictionary al-Qamus al-Muhit. Baalbaki calls it the largest and richest of the classical dictionaries: its dictation took fourteen years and some days and ended in 1188 AH / 1774; it has 11,978 roots against 9,273 in Lisan al-Arab and 5,618 in al-Sihah; and al-Zabidi kept the text of al-Qamus distinct from his own additions."
  es: "Taj al-Arus min jawahir al-Qamus, el comentario que Murtada al-Zabidi (m. 1205 AH / 1791) escribió sobre el diccionario al-Qamus al-Muhit de al-Fayruzabadi. Baalbaki lo llama el mayor y más rico de los diccionarios clásicos: su dictado llevó catorce años y algunos días y terminó en 1188 AH / 1774; tiene 11 978 raíces frente a 9273 del Lisan al-Arab y 5618 del al-Sihah; y al-Zabidi mantuvo el texto del al-Qamus distinguido de sus propias adiciones."
  fr: "Taj al-Arus min jawahir al-Qamus, le commentaire qu'a écrit Murtada al-Zabidi (m. 1205 AH / 1791) sur le dictionnaire al-Qamus al-Muhit d'al-Fayruzabadi. Baalbaki le tient pour le plus vaste et le plus riche des dictionnaires classiques : sa dictée dura quatorze ans et quelques jours et s'acheva en 1188 AH / 1774 ; il compte 11 978 racines contre 9 273 pour le Lisan al-Arab et 5 618 pour al-Sihah ; et al-Zabidi a distingué le texte d'al-Qamus de ses propres ajouts."
  ur: "تاج العروس من جواہر القاموس، مرتضیٰ زبیدی ⁦(م 1205ھ / 1791ء)⁩ کی وہ شرح جو انہوں نے فیروزآبادی کی لغت القاموس المحیط پر لکھی۔ بعلبکی اسے کلاسیکی لغات میں سب سے ضخیم اور مواد میں سب سے بھرپور کہتے ہیں: اس کا املا چودہ سال اور چند دن میں ہوا اور 1188ھ / 1774ء میں مکمل ہوا؛ اس میں 11,978 مادے ہیں جبکہ لسان العرب میں 9,273 اور الصحاح میں 5,618 ہیں؛ اور زبیدی نے القاموس کے متن کو اپنے اضافوں سے الگ رکھا۔"
