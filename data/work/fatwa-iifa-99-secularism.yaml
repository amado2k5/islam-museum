label: { ar: "قرار مجمع الفقه الإسلامي الدولي 99 (11/2) بشأن العلمانية", en: "IIFA resolution 99 (11/2) on secularism", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 99 (11/2): سیکولرازم" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية عشرة بالمنامة ⁦(25–30 رجب 1419هـ، 14–19 نوفمبر 1998م)⁩. نص في رؤيته على أن العلمانية ⁦(وهي في تعريفه الفصل بين الدين والحياة)⁩ نشأت رد فعل على التصرفات التعسفية للكنيسة، وانتشرت في الديار الإسلامية بقوة الاستعمار وأعوانه وتأثير الاستشراق فأدت — بلسانه — إلى تفكك الأمة وتشكيك في العقيدة وتشويه التاريخ وإيهام بتناقض بين العقل والنصوص وإحلال النظم الوضعية محل الشريعة والترويج للإباحية وانهيار القيم؛ وأن عنها انبثقت معظم الأفكار الهدامة التي غزت بلاد المسلمين بمسميات مختلفة. سُجّل بوصفه نص المجمع ذاته منسوبًا إليه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 11th session in Manama (25–30 Rajab 1419, 14–19 November 1998). In the Academy's own voice it stated that secularism — defined in its text as the separation of religion from life — arose as a reaction to the Church's arbitrary conduct, spread in Muslim lands through the force of colonialism, its auxiliaries and orientalism, and led, in its wording, to the umma's disintegration, doubt in sound creed, distortion of history, the suggestion of a contradiction between reason and revealed texts, the replacement of the sharia by man-made systems, promotion of permissiveness and collapse of values; and that from it most of the destructive ideas that invaded Muslim lands under various names emerged. Recorded as the Academy's own position, neutrally attributed."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، منامہ میں گیارہویں مجلس ⁦(25–30 رجب 1419ھ، 14–19 نومبر 1998ء)⁩ میں۔ اکیڈمی کی اپنی زبانی میں اس نے کہا کہ سیکولرازم — اس کی تعریف میں دین اور زندگی کی علیحدگی — چرچ کے خودسرانہ طرزِ عمل کے ردعمل کے طور پر پیدا ہوا؛ نوآبادیات، اس کے سہولت کاروں اور اوریئنٹل ازم کی قوت سے مسلم ممالک میں پھیلا اور اس کے بقول امت کی تباہی، عقیدے میں شک، تاریخ کی تحریف، عقل اور نصوں کے مابین تضاد کا وہم، شریعت کے بجائے وضعی نظم کا قیام، اباحیت کی تشہیر اور اقدار کے انحطاط کا سبب بنا؛ اور اس سے زیادہ تر تباہ کن افکار مختلف ناموں سے مسلم ممالک میں در آئے۔ یہاں اکیڈمی کے اپنے مؤقف کا غیر جانبدارانہ خلاصہ درج ہے۔"
