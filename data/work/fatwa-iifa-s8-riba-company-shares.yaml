label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن المشاركة في أسهم الشركات المساهمة المتعاملة بالربا", en: "IIFA resolution on shareholding in joint-stock companies dealing in riba", ur: "اکیڈمی کی قرارداد: ربا کرنے والی کمپنیوں میں حصہ لینا", es: "Resolución de la IIFA sobre la participación accionaria en sociedades anónimas que operan con usura.", fr: "Résolution de l'IIFA sur la participation au capital des sociétés par actions pratiquant le riba", tr: "Tefecilik yapan anonim şirketlerin hisselerine katılıma ilişkin Uluslararası İslami Fiqh Akademisi Kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai partisipasi saham perusahaan saham yang berdagang riba" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: تكليف الأمانة العامة باستكتاب مزيد من البحوث في مشاركة أسهم الشركات المتعاملة بالربا ليتمكن المجمع من اتخاذ القرار المناسب في دورة قادمة ⁦(انظر القرارين 63 (7/1) و87 (9/4))⁩."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on shareholding in joint-stock companies dealing in riba: the secretariat was tasked with commissioning further studies so the Academy could rule at a coming session — see resolutions 63 (7/1) and 87 (9/4)."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: ربا والی کمپنیوں میں شرکت پر مزید تحقیق؛ فیصلہ اگلی مجلس تک ⁦(دیکھیں 63 (7/1)، 87 (9/4))⁩۔"
  es: "Resolución de la octava sesión de la IIFA (Brunei, junio de 1993) sobre la participación accionaria en sociedades anónimas que operan con usura: se encargó a la secretaría la realización de estudios adicionales para que la Academia pudiera pronunciarse en una próxima sesión — véanse las resoluciones 63 (7/1) y 87 (9/4)."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur la participation dans les sociétés par actions pratiquant le riba: le secrétariat a été chargé de commander des études supplémentaires afin que l'Académie puisse statuer lors d'une prochaine session — voir les résolutions 63 (7/1) et 87 (9/4)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) Kararı: Genel Sekreterlere, tefecilik yapan şirketlerin hisselerinin katılımı hakkında daha fazla araştırma talep etmesi talimatı verilmesi, böylece Akademinin gelecekteki bir oturumda uygun kararı verebilmesi için (bkz. Kararlar 63 (7/1) ve 87 (9/4))."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi kedelapan (Brunei, Juni 1993): Menginstruksikan Sekretariat Jenderal untuk meminta penelitian lebih lanjut mengenai partisipasi saham perusahaan yang berdagang riba agar Akademi dapat mengambil keputusan yang tepat pada sesi mendatang (lihat Resolusi 63 (7/1) dan 87 (9/4))."
