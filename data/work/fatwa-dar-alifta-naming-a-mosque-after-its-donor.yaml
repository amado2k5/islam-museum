id: work/fatwa-dar-alifta-naming-a-mosque-after-its-donor
class: work
kind: fatwa
label: { ar: "حكم تسمية المسجد باسم مَن تبرّع ببنائه", en: "Naming a mosque after the person who paid for its building", ur: "مسجد کو اس کی تعمیر کا خرچ دینے والے کے نام سے موسوم کرنے کا حکم" }
summary:
  ar: "سؤال عن شخص تبرع ببناء مسجد ويريد تسميته باسمه، أجابت فيه دار الإفتاء المصرية بأن إطلاق أسماء بعض الأشخاص على المساجد، سواء من بناها أو غيره كتخليد اسم عالم أو حاكم أو مصلح أو لمجرد التمييز، جائز شرعًا متى توفر حسن النية وانتفى الرياء، مع مراعاة المصلحة وانتفاء الضرر والعرف الجاري، وبشرط الرجوع إلى وزارة الأوقاف المصرية الجهة المختصة بالمساجد. بيّنت الدار حث الشرع على بناء المساجد بآية التوبة وحديث من بنى مسجدًا لله، وأن الأسماء للتعريف والتمييز لا للرياء كما قال الطبري والجصاص والسمرقندي وأبو يعلى والآمدي، وأن إضافة المسجد إلى شخص إضافة تمييز لا ملك، مستدلة بتبويب البخاري هل يقال مسجد بني فلان وحديث مسجد بني زريق، وبكلام ابن بطال والنووي، وبأن الأعمال بالنيات وتحذير الغزالي من الرياء، وفسّرت آية الجن أن المساجد لله بأن المقصود اختصاصها بعبادته أو نسبة الملك لا منع التسمية كما قال ابن العربي والجصاص، وأوجبت الرجوع إلى وزارة الأوقاف لأن حكم الحاكم يرفع الخلاف ولولي الأمر تقييد المباح كما قال القرافي."
  en: "A question from a person who paid for the building of a mosque and wishes to name it after himself; Dar al-Ifta al-Misriyya answered that giving mosques the names of people, whether the builder or others, as in commemorating a scholar, ruler or reformer or merely to distinguish one mosque from another, is permissible in sharia when the intention is good and there is no ostentation, with regard to the public interest, the absence of harm and prevailing custom, and on condition of referring to Egypt's Ministry of Endowments, the body responsible for mosques. Dar al-Ifta set out sharia's encouragement of building mosques from the verse of al-Tawba and the hadith on whoever builds a mosque for God; explained that names serve identification and distinction, not ostentation, as al-Tabari, al-Jassas, al-Samarqandi, Abu Ya'la and al-Amidi say; held that attributing a mosque to a person is an attribution of distinction, not ownership, citing al-Bukhari's chapter heading on whether one may say 'the mosque of such-and-such a clan' and the hadith of the mosque of Banu Zurayq, with the remarks of Ibn Battal and al-Nawawi; recalled that deeds are judged by intentions and al-Ghazali's warning against ostentation; read the verse of al-Jinn that mosques belong to God as meaning their dedication to His worship or an attribution of ownership, not a bar on naming, as Ibn al-Arabi and al-Jassas say; and required reference to the Ministry of Endowments, since a ruler's decision removes disagreement and the ruler may restrict the permissible, as al-Qarafi says."
  ur: "ایک شخص کا سوال جس نے مسجد کی تعمیر کا خرچ دیا اور اسے اپنے نام سے موسوم کرنا چاہتا ہے؛ دار الافتاء مصر نے جواب دیا کہ مساجد کو لوگوں کے ناموں سے موسوم کرنا، خواہ تعمیر کرنے والے کے نام سے یا کسی اور کے، جیسے کسی عالم، حاکم یا مصلح کی یاد یا محض ایک مسجد کو دوسری سے ممتاز کرنے کے لیے، شرعاً جائز ہے جب نیت اچھی ہو اور ریا نہ ہو، مصلحت، نقصان کے نہ ہونے اور رائج عرف کے لحاظ کے ساتھ، اور اس شرط پر کہ مصر کی وزارتِ اوقاف سے رجوع کیا جائے جو مساجد کی ذمہ دار ہے۔ دار الافتاء نے سورہ توبہ کی آیت اور حدیث 'جس نے اللہ کے لیے مسجد بنائی' سے مساجد کی تعمیر کی ترغیب بیان کی؛ واضح کیا کہ نام تعارف اور تمیز کے لیے ہیں نہ کہ ریا کے لیے، جیسا کہ طبری، جصاص، سمرقندی، ابو یعلیٰ اور آمدی نے کہا؛ کہا کہ مسجد کی کسی شخص کی طرف نسبت تمیز کی نسبت ہے نہ کہ ملکیت کی، بخاری کے باب 'کیا کہا جائے مسجد بنی فلاں' اور مسجد بنی زریق کی حدیث اور ابن بطال اور نووی کے کلام سے استدلال کرتے ہوئے؛ یاد دلایا کہ اعمال نیتوں سے ہیں اور غزالی کی ریا سے تنبیہ؛ سورہ جن کی آیت 'مساجد اللہ کے لیے ہیں' کی تفسیر یہ کی کہ مراد ان کا اللہ کی عبادت کے لیے خاص ہونا یا ملکیت کی نسبت ہے نہ کہ نام رکھنے کی ممانعت، جیسا کہ ابن العربی اور جصاص نے کہا؛ اور وزارتِ اوقاف سے رجوع لازم کیا کیونکہ حاکم کا فیصلہ اختلاف ختم کرتا ہے اور ولی امر مباح کو محدود کر سکتا ہے، جیسا کہ قرافی نے کہا۔"
