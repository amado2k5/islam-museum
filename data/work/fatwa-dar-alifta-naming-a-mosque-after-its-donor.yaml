id: work/fatwa-dar-alifta-naming-a-mosque-after-its-donor
class: work
kind: fatwa
tags: [islamic-economy-browser, islamic-economy-books, islamic-economy-waqf]
label: { ar: "حكم تسمية المسجد باسم مَن تبرّع ببنائه", en: "Naming a mosque after the person who paid for its building", ur: "مسجد کو اس کی تعمیر کا خرچ دینے والے کے نام سے موسوم کرنے کا حکم", es: "Darle a una mezquita el nombre de la persona que pagó por su construcción.", fr: "Donner à une mosquée le nom de la personne qui a financé sa construction", tr: "Caminin inşası için bağış yapan kişinin adının verilmesine ilişkin karar", id: "Putusan tentang penamaan masjid berdasarkan nama orang yang menyumbang untuk membangunnya" }
summary:
  ar: "سؤال عن شخص تبرع ببناء مسجد ويريد تسميته باسمه، أجابت فيه دار الإفتاء المصرية بأن إطلاق أسماء بعض الأشخاص على المساجد، سواء من بناها أو غيره كتخليد اسم عالم أو حاكم أو مصلح أو لمجرد التمييز، جائز شرعًا متى توفر حسن النية وانتفى الرياء، مع مراعاة المصلحة وانتفاء الضرر والعرف الجاري، وبشرط الرجوع إلى وزارة الأوقاف المصرية الجهة المختصة بالمساجد. بيّنت الدار حث الشرع على بناء المساجد بآية التوبة وحديث من بنى مسجدًا لله، وأن الأسماء للتعريف والتمييز لا للرياء كما قال الطبري والجصاص والسمرقندي وأبو يعلى والآمدي، وأن إضافة المسجد إلى شخص إضافة تمييز لا ملك، مستدلة بتبويب البخاري هل يقال مسجد بني فلان وحديث مسجد بني زريق، وبكلام ابن بطال والنووي، وبأن الأعمال بالنيات وتحذير الغزالي من الرياء، وفسّرت آية الجن أن المساجد لله بأن المقصود اختصاصها بعبادته أو نسبة الملك لا منع التسمية كما قال ابن العربي والجصاص، وأوجبت الرجوع إلى وزارة الأوقاف لأن حكم الحاكم يرفع الخلاف ولولي الأمر تقييد المباح كما قال القرافي."
  en: "A question from a person who paid for the building of a mosque and wishes to name it after himself; Dar al-Ifta al-Misriyya answered that giving mosques the names of people, whether the builder or others, as in commemorating a scholar, ruler or reformer or merely to distinguish one mosque from another, is permissible in sharia when the intention is good and there is no ostentation, with regard to the public interest, the absence of harm and prevailing custom, and on condition of referring to Egypt's Ministry of Endowments, the body responsible for mosques. Dar al-Ifta set out sharia's encouragement of building mosques from the verse of al-Tawba and the hadith on whoever builds a mosque for God; explained that names serve identification and distinction, not ostentation, as al-Tabari, al-Jassas, al-Samarqandi, Abu Ya'la and al-Amidi say; held that attributing a mosque to a person is an attribution of distinction, not ownership, citing al-Bukhari's chapter heading on whether one may say 'the mosque of such-and-such a clan' and the hadith of the mosque of Banu Zurayq, with the remarks of Ibn Battal and al-Nawawi; recalled that deeds are judged by intentions and al-Ghazali's warning against ostentation; read the verse of al-Jinn that mosques belong to God as meaning their dedication to His worship or an attribution of ownership, not a bar on naming, as Ibn al-Arabi and al-Jassas say; and required reference to the Ministry of Endowments, since a ruler's decision removes disagreement and the ruler may restrict the permissible, as al-Qarafi says."
  ur: "ایک شخص کا سوال جس نے مسجد کی تعمیر کا خرچ دیا اور اسے اپنے نام سے موسوم کرنا چاہتا ہے؛ دار الافتاء مصر نے جواب دیا کہ مساجد کو لوگوں کے ناموں سے موسوم کرنا، خواہ تعمیر کرنے والے کے نام سے یا کسی اور کے، جیسے کسی عالم، حاکم یا مصلح کی یاد یا محض ایک مسجد کو دوسری سے ممتاز کرنے کے لیے، شرعاً جائز ہے جب نیت اچھی ہو اور ریا نہ ہو، مصلحت، نقصان کے نہ ہونے اور رائج عرف کے لحاظ کے ساتھ، اور اس شرط پر کہ مصر کی وزارتِ اوقاف سے رجوع کیا جائے جو مساجد کی ذمہ دار ہے۔ دار الافتاء نے سورہ توبہ کی آیت اور حدیث 'جس نے اللہ کے لیے مسجد بنائی' سے مساجد کی تعمیر کی ترغیب بیان کی؛ واضح کیا کہ نام تعارف اور تمیز کے لیے ہیں نہ کہ ریا کے لیے، جیسا کہ طبری، جصاص، سمرقندی، ابو یعلیٰ اور آمدی نے کہا؛ کہا کہ مسجد کی کسی شخص کی طرف نسبت تمیز کی نسبت ہے نہ کہ ملکیت کی، بخاری کے باب 'کیا کہا جائے مسجد بنی فلاں' اور مسجد بنی زریق کی حدیث اور ابن بطال اور نووی کے کلام سے استدلال کرتے ہوئے؛ یاد دلایا کہ اعمال نیتوں سے ہیں اور غزالی کی ریا سے تنبیہ؛ سورہ جن کی آیت 'مساجد اللہ کے لیے ہیں' کی تفسیر یہ کی کہ مراد ان کا اللہ کی عبادت کے لیے خاص ہونا یا ملکیت کی نسبت ہے نہ کہ نام رکھنے کی ممانعت، جیسا کہ ابن العربی اور جصاص نے کہا؛ اور وزارتِ اوقاف سے رجوع لازم کیا کیونکہ حاکم کا فیصلہ اختلاف ختم کرتا ہے اور ولی امر مباح کو محدود کر سکتا ہے، جیسا کہ قرافی نے کہا۔"
  es: "Una pregunta de una persona que pagó la construcción de una mezquita y desea nombrarla en su honor; Dar al-Ifta al-Misriyya respondió que dar a las mezquitas nombres de personas, ya sea el constructor u otros, como para conmemorar a un erudito, gobernante o reformador o simplemente para distinguir una mezquita de otra, es permisible en la sharia cuando la intención es buena y no hay ostentación, considerando el interés público, la ausencia de daño y la costumbre predominante, y con la condición de consultar al Ministerio de Dotaciones de Egipto, el organismo responsable de las mezquitas. Dar al-Ifta expuso el fomento de la sharia a la construcción de mezquitas a partir del versículo de al-Tawba y el hadiz sobre quien construye una mezquita para Dios; explicó que los nombres sirven para la identificación y la distinción, no para la ostentación, como dicen al-Tabari, al-Jassas, al-Samarqandi, Abu Ya'la y al-Amidi; Sostuvo que atribuir una mezquita a una persona es una atribución de distinción, no de propiedad, citando el título del capítulo de al-Bukhari sobre si se puede decir \"la mezquita de tal y cual clan\" y el hadiz de la mezquita de Banu Zurayq, con los comentarios de Ibn Battal y al-Nawawi; recordó que los actos se juzgan por las intenciones y la advertencia de al-Ghazali contra la ostentación; interpretó el versículo de al-Jinn que dice que las mezquitas pertenecen a Dios como su dedicación a Su adoración o una atribución de propiedad, no una prohibición de nombrar, como dicen Ibn al-Arabi y al-Jassas; y requirió la referencia al Ministerio de Dotaciones, ya que la decisión de un gobernante elimina el desacuerdo y el gobernante puede restringir lo permisible, como dice al-Qarafi."
  fr: "Une personne ayant financé la construction d'une mosquée et souhaitant la baptiser de son nom a posé la question. Dar al-Ifta al-Misriyya a répondu que donner aux mosquées le nom de personnes, qu'il s'agisse du constructeur ou d'autres, pour commémorer un savant, un dirigeant ou un réformateur, ou simplement pour distinguer une mosquée d'une autre, est permis par la charia lorsque l'intention est bonne et qu'il n'y a pas d'ostentation, dans l'intérêt public, sans préjudice et conformément aux coutumes en vigueur, et à condition de consulter le ministère égyptien des Biens religieux, l'organisme responsable des mosquées. Dar al-Ifta a exposé l'encouragement de la charia à la construction de mosquées à partir du verset d'al-Tawba et du hadith concernant celui qui construit une mosquée pour Dieu; elle a expliqué que les noms servent à l'identification et à la distinction, et non à l'ostentation, comme l'affirment al-Tabari, al-Jassas, al-Samarqandi, Abu Ya'la et al-Amidi. Il a été jugé qu'attribuer une mosquée à une personne relève de la distinction et non de la propriété, citant le chapitre d'al-Bukhari traitant de la question de savoir si l'on peut dire « la mosquée de tel ou tel clan » et le hadith de la mosquée des Banu Zurayq, ainsi que les remarques d'Ibn Battal et d'al-Nawawi; il a rappelé que les actes sont jugés selon les intentions et la mise en garde d'al-Ghazali contre l'ostentation; il a interprété le verset d'al-Jinn selon lequel les mosquées appartiennent à Dieu comme signifiant leur dévotion à Son culte ou une attribution de propriété, et non une interdiction de les nommer, comme le prétendent Ibn al-Arabi et al-Jassas; et il a exigé la consultation du ministère des Biens religieux, car la décision d'un dirigeant met fin aux désaccords et ce dernier peut restreindre ce qui est permis, comme le souligne al-Qarafi."
  tr: "Cami inşa etmek için bağış yapan ve camiye onun adını vermek isteyen bir kişiyle ilgili bir soruya, Mısır Dar al-Ifta'sı tarafından yanıtlanmıştır; bu isimler, ister inşaatçı ister başkaları olsun, bir âlim, hükümdar, reformcu adını ölümsüzleştirmek veya sadece ayrıcalık için İslam hukukunda iyi niyet olduğu ve gösteriş yapılmadığı sürece, ilgi, zarar ve yaygın gelenek dikkate alındığında, Mısır Vakıflar Bakanlığı'nın ilgili camiler otoritesine yönlendirilmesi koşuluyla, izin verildiği belirtilmiştir. Meclis, İslami hukukun cami inşa etme tövbesi ayeti ve 'Allah için cami kim inşa etti' hadisiyle netleştirdi ve isimlerin gösteriş için değil, kimlik ve ayrım için olduğunu, Al-Tabari, Al-Jassas, Al-Samarqandi, Abu Ya'la ve Al-Amidi'nin belirttiği gibi. Ayrıca, bir kişiye cami eklemenin mülkiyet değil, ayrıcalığa bir ekleme olduğunu açıkladı. El-Buhari'nin sınıflandırılmasını 'Benî falanca Camii Söylendi' olarak gösterdi., Banu Zurayq Camii'nin hadisleri, İbn Battal ve El-Nevavi'nin sözleri ve eylemlerin niyetlere dayandığı ve El-Hazali'nin gösteriş yapma uyarısına dayandığı belirtilmiştir. Ayet, camilerin Allah'a ait olduğunu, İbn Al-Arabi ve Al-Casas'ın dediği gibi, münhasır ibadet veya vafet mülkiyetinin isim vermemeyi engellemek olmadığını belirtir. El-Karafi'nin dediği gibi, hükümdarın hükmünün anlaşmazlıkları çözerken, hükümdarın izin verilenleri sınırlaması nedeniyle Vakıflar Bakanlığı'na başvurulması gerekiyordu."
  id: "Pertanyaan tentang seseorang yang menyumbang untuk membangun masjid dan ingin menamainya menurut namanya, dijawab oleh Dar al-Ifta Mesir bahwa menamai masjid sesuai nama individu tertentu, baik pembangunnya maupun yang lain, sebagai cara untuk mengabadikan nama seorang ulama, penguasa, reformis, atau sekadar untuk membedakan, diperbolehkan dalam hukum Islam selama ada itikad baik dan tidak ada pameran, dengan mempertimbangkan bunga, kerugian, dan kebiasaan yang berlaku, asalkan Kementerian Wakaf Mesir dirujuk kepada otoritas yang relevan untuk masjid. Dewan menjelaskan dorongan hukum Islam untuk membangun masjid dengan ayat pertobatan dan hadits 'Siapa yang membangun masjid untuk Tuhan,' dan bahwa nama adalah untuk identifikasi dan pembedaan, bukan untuk pamer, seperti yang dinyatakan oleh Al-Tabari, Al-Jassas, Al-Samarqandi, Abu Ya'la, dan Al-Amidi. Dewan juga menjelaskan bahwa menambahkan masjid pada seseorang adalah tambahan untuk perbedaan, bukan kepemilikan. Mereka mengutip klasifikasi Al-Bukhari sebagai 'Dikatakan Masjid Bani Anu,' hadits Masjid Banu Zurayq, kata-kata Ibn Battal dan Al-Nawawi, serta bahwa tindakan didasarkan pada niat dan peringatan Al-Ghazali agar tidak pamer. Ayat tersebut menjelaskan bahwa masjid milik Tuhan dengan mengatakan bahwa pemujaan eksklusif atau kepemilikan atribut bukan untuk mencegah penamaan, seperti yang dikatakan Ibn Al-Arabi dan Al-Jassas. Hal ini mengharuskan merujuk pada Kementerian Wakaf karena keputusan penguasa menyelesaikan perselisihan dan penguasa membatasi apa yang diperbolehkan, seperti yang dikatakan Al-Qarafi."
