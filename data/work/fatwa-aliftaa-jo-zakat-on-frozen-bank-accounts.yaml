id: work/fatwa-aliftaa-jo-zakat-on-frozen-bank-accounts
class: work
kind: fatwa
label: { ar: "زكاة المال في الحسابات المجمدة", en: "Zakat on money in frozen accounts", ur: "منجمد کھاتوں میں رقم کی زکات", es: "Zakat sobre el dinero en cuentas congeladas", fr: "Zakat sur l'argent placé sur des comptes gelés" }
summary:
  ar: "سؤال عن زكاة المال في الحسابات المجمدة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحساب المجمد الذي يستثمره البنك لصاحبه يزكى كل سنة، وأما الذي لا يستطيع صاحبه التصرف فيه ولا يدر عائدًا فلا زكاة فيه حتى يقبضه فيزكيه لسنة واحدة. أجابت الدائرة بأن الزكاة ركن من أركان الإسلام، وأنها تجب في المال المملوك إذا بلغ النصاب وحال عليه الحول، فيزكى كل سنة قمرية. وقالت إن الحسابات المجمدة التي لا يستطيع أصحابها التصرف فيها قسمان: حساب يشغله البنك ويدر عائدًا على صاحبه، فتجب فيه الزكاة لأنه مال يُنمى له؛ وحساب لا يستطيع صاحبه سحبه ولا التصرف فيه ولا يدر عائدًا، فلا تجب فيه الزكاة حتى يقبضه صاحبه، فإذا قبضه زكاه لسنة واحدة. واستشهدت بقرار مجمع الفقه الإسلامي الدولي في دورته السادسة عشرة في الوديعة القانونية بأنها تزكى مع موجودات الشركة إذا كانت محتجزة مؤقتًا، ولسنة واحدة عند إعادتها إذا كانت محتجزة بصفة مستمرة. وخلصت إلى أن الحسابات المجمدة المستثمرة لأصحابها تزكى كل سنة، وغير المستثمرة التي لا يستطيع أصحابها سحبها لا تجب فيها الزكاة حتى تُقبض فتزكى عن سنة واحدة."
  en: "A question about zakat on money in frozen bank accounts, in which Jordan's General Iftaa Department answered that a frozen account the bank invests for its owner is zakated every year, while one the owner cannot use and that yields no return owes no zakat until he receives it, when he pays zakat for one year. The Department answered that zakat is a pillar of Islam, due on owned wealth that reaches the minimum and completes a year, and is paid every lunar year. It said frozen accounts whose owners cannot dispose of them are of two kinds: one the bank operates and that yields a return for its owner, on which zakat is due because the money is growing for him; and one the owner can neither withdraw nor use and that yields no return, on which no zakat is due until the owner receives it, at which point he pays zakat for one year. It cited the resolution of the International Islamic Fiqh Academy at its sixteenth session on legal deposits, that a deposit held temporarily is zakated with the company's assets, while one held permanently is zakated for one year when returned to the company. It concluded that frozen accounts invested for their owners are zakated every year, and those their owners cannot withdraw owe no zakat until received, when zakat is paid for one year."
  ur: "منجمد بینک کھاتوں میں رقم کی زکات کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جس منجمد کھاتے کو بینک مالک کے لیے سرمایہ کاری میں لگائے اس پر ہر سال زکات ہے، اور جسے مالک استعمال نہ کر سکے اور اس سے منافع نہ ہو اس پر وصولی تک زکات نہیں، وصول ہونے پر ایک سال کی زکات ادا کی جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات اسلام کا رکن ہے، جو ملکیت کے اس مال پر واجب ہے جو نصاب کو پہنچے اور اس پر سال گزرے، اور ہر قمری سال ادا کی جاتی ہے۔ اس نے کہا کہ جن منجمد کھاتوں میں مالک تصرف نہیں کر سکتے وہ دو قسم کے ہیں: ایک جسے بینک چلاتا ہے اور اس سے مالک کو منافع ہوتا ہے، اس پر زکات واجب ہے کیونکہ مال اس کے لیے بڑھ رہا ہے؛ اور دوسرا جسے مالک نہ نکال سکتا ہے نہ استعمال کر سکتا ہے اور اس سے منافع نہیں ہوتا، اس پر مالک کے وصول کرنے تک زکات نہیں، وصول کرنے پر وہ ایک سال کی زکات دے۔ اس نے بین الاقوامی اسلامی فقہ اکیڈمی کے سولہویں اجلاس کی قانونی ڈپازٹ سے متعلق قرارداد کا حوالہ دیا کہ عارضی طور پر روکی گئی رقم کمپنی کے اثاثوں کے ساتھ زکات میں شامل ہوگی، اور مستقل روکی گئی رقم کمپنی کو واپس ملنے پر ایک سال کی زکات دی جائے گی۔ اس نے نتیجہ نکالا کہ مالکوں کے لیے سرمایہ کاری میں لگے منجمد کھاتوں پر ہر سال زکات ہے، اور جن کھاتوں سے مالک رقم نہیں نکال سکتے ان پر وصولی تک زکات نہیں، پھر ایک سال کی زکات دی جائے۔"
  es: "Una pregunta sobre el zakat sobre el dinero en cuentas bancarias congeladas, en la que el Departamento General de Iftaa de Jordania respondió que una cuenta congelada que el banco invierte para su propietario está sujeta al zakat anualmente, mientras que una que el propietario no puede usar y que no genera rendimientos no está sujeta al zakat hasta que la reciba, momento en el que paga el zakat correspondiente a un año. El Departamento explicó que el zakat es un pilar del Islam, que se debe pagar sobre la riqueza propia que alcanza el mínimo y completa un año, y se paga cada año lunar. Indicó que las cuentas congeladas cuyos propietarios no pueden disponer de ellas son de dos tipos: una que el banco administra y que genera rendimientos para su propietario, sobre la cual se debe pagar el zakat porque el dinero crece para él; y una que el propietario no puede retirar ni usar y que no genera rendimientos, sobre la cual no se debe pagar el zakat hasta que el propietario la reciba, momento en el que paga el zakat correspondiente a un año. Citó la resolución de la Academia Internacional de Jurisprudencia Islámica en su decimosexta sesión sobre depósitos legales, según la cual un depósito mantenido temporalmente se grava con el zakat junto con los activos de la empresa, mientras que uno mantenido permanentemente se grava durante un año al ser devuelto a la empresa. Concluyó que las cuentas congeladas invertidas para sus titulares se gravan anualmente con el zakat, y aquellas que sus titulares no pueden retirar no generan zakat hasta que se reciba, momento en el que se paga el zakat correspondiente a un año."
  fr: "Une question relative à la zakat sur les sommes bloquées sur des comptes bancaires a été posée. Le Département général de la Iftaa en Jordanie a répondu que la zakat est due chaque année sur les fonds placés sur un compte bloqué, lorsque la banque investit pour le compte du titulaire. En revanche, sur un compte bloqué dont le titulaire ne peut ni disposer ni effectuer de retrait, la zakat n'est due qu'à réception des fonds, moment auquel le titulaire s'acquitte de la zakat pour l'année en cours. Le Département a précisé que la zakat est un pilier de l'Islam, due sur le patrimoine possédé ayant atteint un certain seuil et accumulé pendant un an, et payable chaque année lunaire. Il a ajouté que les comptes bloqués, dont les propriétaires ne peuvent disposer, sont de deux types: ceux gérés par la banque et générant des revenus pour le titulaire, sur lesquels la zakat est due car les fonds fructifient; et ceux dont le titulaire ne peut ni retirer d'argent ni effectuer de retrait, et qui ne génèrent aucun revenu, sur lesquels la zakat n'est due qu'à réception des fonds, moment auquel le titulaire s'acquitte de la zakat pour l'année en cours. Elle a cité la résolution de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa seizième session sur les dépôts légaux, selon laquelle un dépôt détenu temporairement est soumis à la zakat avec les actifs de la société, tandis qu'un dépôt détenu définitivement est soumis à la zakat pendant un an lors de sa restitution à la société. Elle a conclu que les comptes bloqués investis pour le compte de leurs propriétaires sont soumis à la zakat chaque année, et que ceux dont les propriétaires ne peuvent retirer les fonds ne sont pas soumis à la zakat tant qu'ils ne sont pas reçus, la zakat étant alors versée pour un an."
