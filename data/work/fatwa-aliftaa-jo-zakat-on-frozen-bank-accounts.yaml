id: work/fatwa-aliftaa-jo-zakat-on-frozen-bank-accounts
class: work
kind: fatwa
label: { ar: "زكاة المال في الحسابات المجمدة", en: "Zakat on money in frozen accounts", ur: "منجمد کھاتوں میں رقم کی زکات" }
summary:
  ar: "سؤال عن زكاة المال في الحسابات المجمدة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الحساب المجمد الذي يستثمره البنك لصاحبه يزكى كل سنة، وأما الذي لا يستطيع صاحبه التصرف فيه ولا يدر عائدًا فلا زكاة فيه حتى يقبضه فيزكيه لسنة واحدة. أجابت الدائرة بأن الزكاة ركن من أركان الإسلام، وأنها تجب في المال المملوك إذا بلغ النصاب وحال عليه الحول، فيزكى كل سنة قمرية. وقالت إن الحسابات المجمدة التي لا يستطيع أصحابها التصرف فيها قسمان: حساب يشغله البنك ويدر عائدًا على صاحبه، فتجب فيه الزكاة لأنه مال يُنمى له؛ وحساب لا يستطيع صاحبه سحبه ولا التصرف فيه ولا يدر عائدًا، فلا تجب فيه الزكاة حتى يقبضه صاحبه، فإذا قبضه زكاه لسنة واحدة. واستشهدت بقرار مجمع الفقه الإسلامي الدولي في دورته السادسة عشرة في الوديعة القانونية بأنها تزكى مع موجودات الشركة إذا كانت محتجزة مؤقتًا، ولسنة واحدة عند إعادتها إذا كانت محتجزة بصفة مستمرة. وخلصت إلى أن الحسابات المجمدة المستثمرة لأصحابها تزكى كل سنة، وغير المستثمرة التي لا يستطيع أصحابها سحبها لا تجب فيها الزكاة حتى تُقبض فتزكى عن سنة واحدة."
  en: "A question about zakat on money in frozen bank accounts, in which Jordan's General Iftaa Department answered that a frozen account the bank invests for its owner is zakated every year, while one the owner cannot use and that yields no return owes no zakat until he receives it, when he pays zakat for one year. The Department answered that zakat is a pillar of Islam, due on owned wealth that reaches the minimum and completes a year, and is paid every lunar year. It said frozen accounts whose owners cannot dispose of them are of two kinds: one the bank operates and that yields a return for its owner, on which zakat is due because the money is growing for him; and one the owner can neither withdraw nor use and that yields no return, on which no zakat is due until the owner receives it, at which point he pays zakat for one year. It cited the resolution of the International Islamic Fiqh Academy at its sixteenth session on legal deposits, that a deposit held temporarily is zakated with the company's assets, while one held permanently is zakated for one year when returned to the company. It concluded that frozen accounts invested for their owners are zakated every year, and those their owners cannot withdraw owe no zakat until received, when zakat is paid for one year."
  ur: "منجمد بینک کھاتوں میں رقم کی زکات کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جس منجمد کھاتے کو بینک مالک کے لیے سرمایہ کاری میں لگائے اس پر ہر سال زکات ہے، اور جسے مالک استعمال نہ کر سکے اور اس سے منافع نہ ہو اس پر وصولی تک زکات نہیں، وصول ہونے پر ایک سال کی زکات ادا کی جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ زکات اسلام کا رکن ہے، جو ملکیت کے اس مال پر واجب ہے جو نصاب کو پہنچے اور اس پر سال گزرے، اور ہر قمری سال ادا کی جاتی ہے۔ اس نے کہا کہ جن منجمد کھاتوں میں مالک تصرف نہیں کر سکتے وہ دو قسم کے ہیں: ایک جسے بینک چلاتا ہے اور اس سے مالک کو منافع ہوتا ہے، اس پر زکات واجب ہے کیونکہ مال اس کے لیے بڑھ رہا ہے؛ اور دوسرا جسے مالک نہ نکال سکتا ہے نہ استعمال کر سکتا ہے اور اس سے منافع نہیں ہوتا، اس پر مالک کے وصول کرنے تک زکات نہیں، وصول کرنے پر وہ ایک سال کی زکات دے۔ اس نے بین الاقوامی اسلامی فقہ اکیڈمی کے سولہویں اجلاس کی قانونی ڈپازٹ سے متعلق قرارداد کا حوالہ دیا کہ عارضی طور پر روکی گئی رقم کمپنی کے اثاثوں کے ساتھ زکات میں شامل ہوگی، اور مستقل روکی گئی رقم کمپنی کو واپس ملنے پر ایک سال کی زکات دی جائے گی۔ اس نے نتیجہ نکالا کہ مالکوں کے لیے سرمایہ کاری میں لگے منجمد کھاتوں پر ہر سال زکات ہے، اور جن کھاتوں سے مالک رقم نہیں نکال سکتے ان پر وصولی تک زکات نہیں، پھر ایک سال کی زکات دی جائے۔"
