id: work/tafsir-ibn-juzayy
class: work
kind: book
label: { ar: "التسهيل لعلوم التنزيل", en: "Tafsir Ibn Juzayy (al-Tashil li-Ulum al-Tanzil)", ur: "التسہیل لعلوم التنزیل ⁦(تفسیرِ ابن جزی)⁩" }
summary:
  ar: "تفسير محمد بن أحمد بن جزي الكلبي، موجز يشرح الألفاظ والتراكيب في جمل قصيرة، ويسرد الأقوال في الآية بـ«قيل» ثم يرجح بينها بعبارات مثل «والأول أرجح وأفصح»، ويعقد «تنبيهات» على مسائل كاختلاف ألفاظ القصص بين السور، ناقلًا عن الزمخشري وشيخه أبي جعفر بن الزبير؛ طُبع أول مرة بالقاهرة سنة 1355هـ."
  en: "The commentary of Muhammad ibn Ahmad ibn Juzayy al-Kalbi, a concise work explaining words and constructions in short sentences, listing views on a verse with 'it is said' and then weighing them in phrases such as 'the first is preferable and more eloquent', and adding 'notes' (tanbih) on questions such as the differing wording of the same story in different suras, quoting al-Zamakhshari and his teacher Abu Ja'far ibn al-Zubayr; first printed in Cairo in 1355 AH."
  ur: "محمد بن احمد بن جزی الکلبی کی تفسیر، ایک مختصر کتاب جو الفاظ و تراکیب کی مختصر جملوں میں وضاحت کرتی ہے، آیت میں اقوال «قیل» کے ساتھ گنوا کر پھر «پہلا زیادہ راجح اور فصیح ہے» جیسے الفاظ سے ترجیح دیتی ہے، اور مختلف سورتوں میں ایک ہی قصے کے الفاظ کے فرق جیسے مسائل پر «تنبیہات» لاتی ہے، زمخشری اور اپنے استاد ابو جعفر بن الزبیر سے نقل کرتے ہوئے؛ پہلی بار 1355ھ میں قاہرہ میں چھپی۔"
