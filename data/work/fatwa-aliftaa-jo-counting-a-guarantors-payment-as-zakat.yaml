id: work/fatwa-aliftaa-jo-counting-a-guarantors-payment-as-zakat
class: work
kind: fatwa
label: { ar: "احتساب ما يدفعه الكفيل عن المدين المعسر من الزكاة", en: "Counting a guarantor's payment for an insolvent debtor as zakat", ur: "نادار مقروض کی طرف سے ضامن کی ادائیگی کو زکوٰۃ شمار کرنا" }
summary:
  ar: "سؤال من كفيل لمدين معسر مطلوب للتنفيذ القضائي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز احتساب ما يدفعه الكفيل بسبب الضمان من الزكاة، لكن له أن يعطي المدين من زكاته بوصفه غارمًا أو فقيرًا. أجابت الدائرة بأن من ضمن دينًا لزمه أداؤه إذا عجز المدين أو تخلف، وللدائن مطالبة المدين أو الضامن أيهما شاء، ونقلت ذلك عن حاشية الباجوري. وقالت إن للزكاة مصارف حددها الله في القرآن وشروطًا لصحتها، منها تمليكها للمستحق، والنية عند الإخراج كما نقلت عن النووي في منهاج الطالبين، وألا يخرجها المزكي لنفسه أو لمن تلزمه نفقته باسم الفقر، كما نقلت عن الخطيب الشربيني في الإقناع. وقالت إن إخراج الزكاة لقضاء دين لزم المزكي بضمانه أشبه بإخراجها لنفسه، فلا يجوز احتساب ما دفعه السائل بسبب الضمان من الزكاة لتخلف شرطي النية والتمليك. وأضافت أنه لا حرج على الضامن أن يعطي المضمون عنه من زكاته بوصفه غارمًا أو فقيرًا أو مسكينًا، وللمدين بعد تملكها أن يقضي منها دينه إن شاء."
  en: "A question from the guarantor of an insolvent debtor facing court enforcement, in which Jordan's General Iftaa Department answered that what the guarantor pays under his guarantee cannot be counted as zakat, though he may give the debtor some of his zakat as someone in debt or in poverty. The Department answered that whoever guarantees a debt must pay it if the debtor cannot or does not, and the creditor may claim from either the debtor or the guarantor, quoting this from al-Bajuri's gloss. It said zakat has recipients set by God in the Qur'an and conditions for its validity, including transferring ownership to the recipient, intention at the time of paying, as it quoted from al-Nawawi's Minhaj al-Talibin, and not paying it to oneself or, as poverty relief, to one's dependants, as it quoted from al-Khatib al-Shirbini's al-Iqna'. It said paying zakat to settle a debt the payer owes through his own guarantee is close to paying it to oneself, so what the questioner paid under the guarantee cannot count as zakat, since the conditions of intention and of transferring ownership are not met. It added that the guarantor may give the debtor some of his zakat as someone in debt, poor or needy, and the debtor, once he owns it, may settle his debt with it if he chooses."
  ur: "ایک نادار مقروض کے ضامن کا سوال جس کے خلاف عدالتی کارروائی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ضامن ضمانت کی وجہ سے جو ادا کرے اسے زکوٰۃ شمار نہیں کیا جا سکتا، البتہ وہ مقروض کو مقروض یا فقیر ہونے کی حیثیت سے اپنی زکوٰۃ دے سکتا ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو کسی قرض کی ضمانت دے اس پر لازم ہے کہ مقروض کے عاجز آنے یا ادائیگی نہ کرنے پر ادا کرے، اور قرض خواہ مقروض یا ضامن میں سے جس سے چاہے مطالبہ کر سکتا ہے؛ اس نے یہ باجوری کے حاشیے سے نقل کیا۔ اس نے کہا کہ زکوٰۃ کے مصارف اللہ نے قرآن میں متعین کیے ہیں اور اس کی صحت کی شرائط ہیں، جن میں مستحق کو مالک بنانا، ادائیگی کے وقت نیت، جیسا کہ اس نے نووی کی منہاج الطالبین سے نقل کیا، اور اسے اپنے لیے یا فقر کے نام پر زیرِ کفالت افراد کے لیے نہ نکالنا شامل ہے، جیسا کہ اس نے خطیب شربینی کی الاقناع سے نقل کیا۔ اس نے کہا کہ اپنی ضمانت سے لازم ہونے والے قرض کی ادائیگی کے لیے زکوٰۃ نکالنا اسے اپنے لیے نکالنے کے مشابہ ہے، لہٰذا سائل نے ضمانت کی وجہ سے جو ادا کیا وہ زکوٰۃ شمار نہیں ہو سکتا کیونکہ نیت اور تملیک کی شرطیں پوری نہیں۔ اس نے مزید کہا کہ ضامن مقروض کو مقروض، فقیر یا مسکین کی حیثیت سے اپنی زکوٰۃ دے سکتا ہے، اور مقروض اس کا مالک بننے کے بعد چاہے تو اس سے اپنا قرض ادا کرے۔"
