summary:
  ar: "أول ترجمة بلغارية حديثة لمعاني القرآن وضعها مسلم، كتبها محمد شمس الدين ⁦(محمد تاباكوف)⁩، الواعظ من الأقلية الناطقة بالتركية، سرًّا في العهد الشيوعي، فتداولت سنة 1986 نسخة مطبوعة على الآلة الكاتبة بعنوان «منبّه المسلمين» تجنبًا لذكر القرآن، ثم طبعة ثانية منقّحة آخر سنة 1990 بعنوان «القرآن الكريم»؛ لها مقدمات للسور ولا تفسير فيها، ويرى ياكوبوفيتش أن مصدرها الرئيس ترجمة علي فكري يافوز التركية."
  en: "The first modern Bulgarian rendering of the meanings of the Qur'an by a Muslim, written clandestinely under communism by Mohammed Shemsuddin (Mehmed Tabakov), a preacher of the Turkish-speaking minority; it circulated in 1986 as a typescript titled 'Awakener of the Muslims' to avoid naming the Qur'an, and in a revised second edition at the end of 1990 as Korani Kerim; it has sura introductions and no commentary, and Yakubovych finds that its main source was Ali Fikri Yavuz's Turkish translation."
  ur: "مسلمان کا کیا ہوا قرآن کے معانی کا پہلا جدید بلغاری ترجمہ، جسے ترکی بولنے والی اقلیت کے واعظ محمد شمس الدین ⁦(محمد تاباکوف)⁩ نے کمیونسٹ دور میں خفیہ طور پر لکھا؛ 1986 میں قرآن کا نام لیے بغیر «مسلمانوں کو بیدار کرنے والا» کے عنوان سے ٹائپ شدہ نسخہ پھیلا، اور 1990 کے آخر میں «قرآنِ کریم» کے نام سے نظرِ ثانی شدہ دوسری اشاعت آئی؛ سورتوں کے تعارف ہیں، تفسیر نہیں، اور یاکوبووچ کے مطابق اس کا بنیادی ماخذ علی فکری یاووز کا ترکی ترجمہ ہے۔"
