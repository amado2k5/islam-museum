id: work/fatwa-dar-alifta-eg-why-year-begins-with-muharram
class: work
kind: fatwa
label: { ar: "بيان سبب بداية العام الهجري بشهر المحرم", en: "Why the Hijri year begins with Muharram", ur: "ہجری سال کا آغاز محرم سے کیوں", es: "¿Por qué el año Hijri comienza con Muharram?", fr: "Pourquoi l'année hégirienne commence-t-elle avec Muharram ?" }
summary:
  ar: "سائل سأل عن سبب بداية العام الهجري بشهر المحرم مع أن الهجرة كانت في ربيع الأول. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20856)⁩ أن الهجرة كانت في ربيع الأول وكان العزم عليها والاستعداد لها في شهر المحرم ولهذا اختير مبدأ للعام الهجري على ما فصّل الجواب."
  en: "A questioner asked why the Hijri year begins with Muharram though the Hijra fell in Rabi' al-Awwal. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20856) answered that the migration occurred in Rabi' al-Awwal but its resolve and preparation were in Muharram, hence it was made the year's start — as the answer details."
  ur: "ایک سائل نے پوچھا کہ ہجری سال کا آغاز محرم سے کیوں ہے حالانکہ ہجرت ربیع الاول میں ہوئی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20856)⁩ نے جواب دیا کہ ہجرت ربیع الاول میں ہوئی لیکن اس کا عزم اور تیاری محرم میں ہوئی اسی لیے وہ سال کا آغاز بنا — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó por qué el año Hijri comienza con Muharram si la Hégira tuvo lugar en Rabi' al-Awwal. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20856) respondió que la migración ocurrió en Rabi' al-Awwal, pero su decisión y preparación se tomaron en Muharram, por lo que se estableció como el inicio del año, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé pourquoi l'année hégirienne commence avec Muharram alors que l'Hégire a eu lieu en Rabi' al-Awwal. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20856) a répondu que la migration s'est déroulée en Rabi' al-Awwal, mais que la décision et les préparatifs ont eu lieu en Muharram, d'où le choix de ce mois comme point de départ de l'année."
