id: work/fatwa-aliftaa-jo-a-cooperative-car-warranty-fund
class: work
kind: fatwa
label: { ar: "صندوق تعاوني لكفالة أعطال السيارات", en: "A cooperative fund for car repair warranties", ur: "گاڑیوں کی خرابی کی ضمانت کے لیے امدادی فنڈ", es: "Un fondo cooperativo para garantías de reparación de automóviles.", fr: "Un fonds coopératif pour les garanties de réparation automobile" }
summary:
  ar: "سؤال عن مشروع صندوق يدفع فيه أصحاب السيارات اشتراكًا لتغطية أعطالها خلال مدة محددة ويُعاد الفائض أو يُتبرع به، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا حرج فيه إذا قام على أسس التأمين التعاوني الإسلامي. أجابت الدائرة بأنه لا حرج في إنشاء شركات أو صناديق للتأمين التعاوني الإسلامي، تقوم على التزام المشتركين بدفع اشتراكات على سبيل التبرع لتغطية الأعطال أو المخاطر التي ينص عليها نظام الصندوق. ونقلت عن المعايير الشرعية لهيئة المحاسبة والمراجعة للمؤسسات المالية الإسلامية تعريف التأمين الإسلامي، وأسسه: أن يكون الاشتراك تبرعًا لحساب التأمين، وأن تفصل الشركة حسابها عن حساب حملة الوثائق، وأن تكون وكيلة في إدارته ومضاربة أو وكيلة في استثماره. وذكرت من هذه الأسس أن يختص حساب التأمين بموجوداته وعوائدها والتزاماتها، وأن يُتصرف في الفائض بما فيه المصلحة دون أن تستحق الشركة منه شيئًا، وأن تُصرف المخصصات والفوائض في وجوه الخير عند التصفية. وذكرت أيضًا أفضلية مشاركة حملة الوثائق في الإدارة، والتزام الشركة بأحكام الشريعة في أنشطتها وعدم التأمين على المحرمات، وتعيين هيئة رقابة شرعية ملزمة الفتوى. وخلصت إلى أنه لا حرج في إنشاء صناديق تأمين إسلامية لتغطية المخاطر المحتملة بشرط مراعاة هذه الأسس."
  en: "A question about a planned fund in which car owners pay a subscription to cover breakdowns for a set period, with any surplus returned or donated, in which Jordan's General Iftaa Department answered that it is unobjectionable if it is built on the principles of Islamic cooperative insurance. The Department answered that there is no objection to setting up Islamic cooperative insurance companies or funds, based on members committing to pay subscriptions as donations to cover the faults or risks named in the fund's rules. It quoted the Shari'ah Standards of the Accounting and Auditing Organization for Islamic Financial Institutions on the definition of Islamic insurance and its principles: subscriptions are donated to the insurance account, the company keeps its own account separate from the policyholders' account, and it acts as agent in managing the account and as mudarib or agent in investing it. Among these principles it listed that the insurance account holds its own assets, returns and liabilities, that any surplus is used in the members' interest with nothing of it due to the managing company, and that provisions and surpluses go to charitable causes when the company is wound up. It also listed the preference for policyholders sharing in management, the company's commitment to the sharia in all its activities, including not insuring forbidden things, and the appointment of a sharia supervisory board whose rulings bind the company. It concluded that Islamic insurance funds may be set up to cover possible risks, provided these principles are respected."
  ur: "ایک مجوزہ فنڈ کے بارے میں سوال جس میں گاڑی والے مقررہ مدت تک خرابیوں کی کوریج کے لیے رکنیت فیس دیں اور زائد رقم واپس کی جائے یا عطیہ کی جائے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر یہ اسلامی امدادی ⁦(تکافل)⁩ بیمہ کے اصولوں پر قائم ہو تو اس میں حرج نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ اسلامی امدادی بیمہ کی کمپنیاں یا فنڈ قائم کرنے میں حرج نہیں، جن کی بنیاد یہ ہو کہ ارکان فنڈ کے قواعد میں مذکور خرابیوں یا خطرات کی کوریج کے لیے بطور تبرع رکنیت ادا کریں۔ اس نے اسلامی مالیاتی اداروں کی اکاؤنٹنگ اور آڈٹ تنظیم کے شرعی معیارات سے اسلامی بیمہ کی تعریف اور اصول نقل کیے: رکنیت بیمہ اکاؤنٹ کے لیے تبرع ہو، کمپنی اپنا اکاؤنٹ پالیسی ہولڈرز کے اکاؤنٹ سے الگ رکھے، اور وہ اس کے انتظام میں وکیل اور سرمایہ کاری میں مضارب یا وکیل ہو۔ ان اصولوں میں اس نے یہ بھی ذکر کیا کہ بیمہ اکاؤنٹ اپنے اثاثوں، منافع اور ذمہ داریوں کا مالک ہو، زائد رقم ارکان کے مفاد میں خرچ ہو اور انتظامی کمپنی کو اس میں سے کچھ نہ ملے، اور کمپنی کے خاتمے پر مخصوص رقوم اور زائد رقوم خیر کے کاموں میں خرچ ہوں۔ اس نے پالیسی ہولڈرز کی انتظام میں شرکت کی ترجیح، کمپنی کی تمام سرگرمیوں میں شریعت کی پابندی بشمول حرام چیزوں کا بیمہ نہ کرنا، اور ایسے شرعی نگران بورڈ کی تقرری کا بھی ذکر کیا جس کے فتوے کمپنی پر لازم ہوں۔ اس نے نتیجہ نکالا کہ ان اصولوں کی پابندی کے ساتھ ممکنہ خطرات کی کوریج کے لیے اسلامی بیمہ فنڈ قائم کرنا جائز ہے۔"
  es: "Una pregunta sobre un fondo planificado en el que los propietarios de automóviles pagan una suscripción para cubrir averías durante un período determinado, con el excedente devuelto o donado, fue respondida por el Departamento General de Iftaa de Jordania, que afirmó que no presenta objeciones si se basa en los principios del seguro cooperativo islámico. El Departamento indicó que no existe objeción alguna a la creación de compañías o fondos de seguros cooperativos islámicos, siempre que los miembros se comprometan a pagar suscripciones como donaciones para cubrir las fallas o riesgos mencionados en el reglamento del fondo. Citó las Normas de la Sharia de la Organización de Contabilidad y Auditoría para Instituciones Financieras Islámicas sobre la definición de seguro islámico y sus principios: las suscripciones se donan a la cuenta del seguro, la compañía mantiene su propia cuenta separada de la de los asegurados y actúa como agente en la gestión de la cuenta y como mudarib o agente en su inversión. Entre estos principios, se menciona que la cuenta del seguro posee sus propios activos, rendimientos y pasivos, que cualquier excedente se utiliza en beneficio de los miembros sin que la compañía gestora deba recibir nada, y que las provisiones y los excedentes se destinan a causas benéficas cuando la compañía se liquida. También se mencionó la preferencia por que los asegurados participen en la gestión, el compromiso de la compañía con la sharia en todas sus actividades, incluyendo la prohibición de asegurar bienes prohibidos, y el nombramiento de un consejo de supervisión de la sharia cuyas resoluciones son vinculantes para la compañía. Se concluyó que los fondos de seguros islámicos pueden crearse para cubrir posibles riesgos, siempre que se respeten estos principios."
  fr: "Concernant un projet de fonds d'assurance automobile par lequel les propriétaires de véhicules cotisent pour couvrir les pannes pendant une période déterminée, tout excédent étant restitué ou donné, le Département général de l'Iftaa de Jordanie a répondu qu'il n'y avait pas d'objection à ce qu'il soit fondé sur les principes de l'assurance coopérative islamique. Le Département a précisé qu'il n'y avait aucune objection à la création de sociétés ou de fonds d'assurance coopérative islamique, reposant sur l'engagement des membres à verser des cotisations à titre de dons pour couvrir les défaillances ou les risques mentionnés dans le règlement du fonds. Il a cité les normes de la charia de l'Organisation de comptabilité et d'audit des institutions financières islamiques relatives à la définition de l'assurance islamique et à ses principes: les cotisations sont versées sur le compte d'assurance, la société tient un compte distinct de celui des assurés, et elle agit en tant qu'agent pour la gestion du compte et en tant que mudarib (mandataire) pour son investissement. Parmi ces principes, le Département a indiqué que le compte d'assurance possède ses propres actifs, revenus et passifs, que tout excédent est utilisé dans l'intérêt des membres sans que la société de gestion n'en perçoive rien, et que les provisions et les excédents sont reversés à des œuvres caritatives lors de la liquidation de la société. Le rapport mentionnait également la préférence accordée à la participation des assurés à la gestion, l'engagement de la compagnie à respecter la charia dans toutes ses activités, notamment en n'assurant pas de biens interdits, et la mise en place d'un conseil de surveillance islamique dont les décisions sont contraignantes pour la compagnie. Il concluait que des fonds d'assurance islamiques pouvaient être créés pour couvrir les risques potentiels, à condition que ces principes soient respectés."
