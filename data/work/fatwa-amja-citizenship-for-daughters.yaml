id: work/fatwa-amja-citizenship-for-daughters
class: work
kind: fatwa
label: { ar: "الجنسية ⁦(سؤال عن اتخاذ الجنسية الأمريكية لحاجة الأب لبناته الأربع الأمريكيات)⁩", en: "Citizenship ⁦(a father asking about taking American citizenship for his four American daughters' sake)⁩", ur: "شہریت ⁦(ایک باپ کا سوال: اپنی چار امریکی بیٹیوں کی خاطر امریکی شہریت لینا)⁩", es: "Ciudadanía (un padre pregunta sobre la posibilidad de obtener la ciudadanía estadounidense por el bien de sus cuatro hijas estadounidenses).", fr: "Citoyenneté (un père se renseigne sur la possibilité d'acquérir la citoyenneté américaine pour ses quatre filles américaines)" }
summary:
  ar: "سائل اطلع على فتوى سابقة للمجمع ولم يستطع حسم قراره في اتخاذ الجنسية، مع خوفه من أخذها، وكون بناته الأربع أمريكيات. أجاب مجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87600 بتاريخ 17 أكتوبر 2012)⁩ أنه لا حرج في السعي للحصول على الجنسية لما ظهر من مسيس الحاجة إليها، مع مراعاة الضوابط الواردة في ذيل الفتوى السابقة: فالتجنس إذا تجرد عن قبول شرائع الدولة ونظمها وعن الانتماء المطلق لجماعتها ولم يتضمن محذورًا شرعيًا فهو في دائرة الإباحة للحاجة، وما كان مقيدًا بمحذور فحكمه بحسبه."
  en: "A questioner who had read an earlier AMJA fatwa but could not decide asked about taking citizenship, fearing it yet having four American daughters. The Assembly of Muslim Jurists of America (fatwa no. 87600, 17 October 2012) answered that there is no harm in seeking citizenship given his evident need, provided he observes the controls restated from the earlier ruling: naturalisation stripped of unqualified acceptance of the state's laws and systems and of absolute belonging, and free of religiously forbidden entailments, falls within permissibility for need; what is bound to a prohibition is judged accordingly."
  ur: "ایک سائل جس نے اکیڈمی کا پہلے کا فتویٰ پڑھا مگر فیصلہ نہ کر سکا، نے امریکی شہریت لینے کے بارے میں پوچھا — اسے ڈر بھی تھا اور اس کی چار بیٹیاں امریکی تھیں۔ ایسملی آف مسلم جورسٹس آف امریکہ ⁦(فتویٰ نمبر 87600، 17 اکتوبر 2012)⁩ نے جواب دیا کہ ظاہر ضرورت کے پیشِ نظر شہریت کے حصول کی سعی میں کوئی حرج نہیں، بشرطیکہ سابقہ فتوے کے ضوابط پر عمل ہو: تجنس اگر ریاست کے قوانین اور نظام کی غیر مشروط قبولیت اور مطلق وابستگی سے پاک ہو اور شرعی محذور شامل نہ ہو تو ضرورت کی بنیاد پر جائز ہے؛ اور جو محذور سے مشروط ہو اس کا حکم اس کے مطابق۔"
  es: "Un consultante que había leído una fatwa anterior de la AMJA pero no podía decidirse preguntó sobre la posibilidad de obtener la ciudadanía, pues temía hacerlo a pesar de tener cuatro hijas estadounidenses. La Asamblea de Juristas Musulmanes de América (fatwa n.° 87600, 17 de octubre de 2012) respondió que no hay inconveniente en solicitar la ciudadanía dada su evidente necesidad, siempre que observe los controles reiterados de la resolución anterior: la naturalización, desprovista de la aceptación incondicional de las leyes y sistemas del Estado y de la pertenencia absoluta, y libre de implicaciones prohibidas por motivos religiosos, se considera admisible por necesidad; lo que está sujeto a una prohibición se juzga en consecuencia."
  fr: "Un homme, ayant pris connaissance d'une fatwa antérieure de l'AMJA mais indécis, s'est interrogé sur la possibilité d'acquérir la citoyenneté américaine, craignant d'y être contraint malgré ses quatre filles américaines. L'Assemblée des juristes musulmans d'Amérique (fatwa n° 87600, 17 octobre 2012) a répondu qu'il n'y a aucun mal à demander la citoyenneté compte tenu de son besoin manifeste, à condition qu'il respecte les conditions rappelées dans la décision précédente: la naturalisation, sans acceptation inconditionnelle des lois et du système de l'État, sans appartenance absolue et sans obligations religieuses interdites, est admissible en cas de nécessité; ce qui est soumis à une interdiction est jugé en conséquence."
