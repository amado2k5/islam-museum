summary:
  ar: "كتاب للسياسي والمفكر التونسي راشد الغنوشي في الحريات العامة والتعددية في الفكر السياسي الإسلامي، صدرت طبعته الأولى عن مركز دراسات الوحدة العربية ببيروت سنة 1993 في 382 صفحة."
  en: "A book by the Tunisian politician and thinker Rached Ghannouchi on public liberties and pluralism in Islamic political thought; its first edition was published by the Centre for Arab Unity Studies, Beirut, in 1993 (382 pages)."
  ur: "تیونسی سیاستدان اور مفکر راشد الغنوشی کی کتاب جو اسلامی سیاسی فکر میں عوامی آزادیوں اور تکثیریت پر ہے؛ اس کا پہلا ایڈیشن مرکز دراسات الوحدۃ العربیۃ، بیروت سے 1993ء میں 382 صفحات میں شائع ہوا۔"
  es: "Un libro del político y pensador tunecino Rached Ghannouchi sobre las libertades públicas y el pluralismo en el pensamiento político islámico; su primera edición fue publicada por el Centro de Estudios de la Unidad Árabe, Beirut, en 1993 (382 páginas)."
  fr: "Un livre du politicien et penseur tunisien Rached Ghannouchi sur les libertés publiques et le pluralisme dans la pensée politique islamique; sa première édition a été publiée par le Centre d'études sur l'unité arabe, Beyrouth, en 1993 (382 pages)."
  tr: "Tunuslu siyasetçi ve düşünür Rached Ghannouchi'nin İslami siyasi düşüncede kamu özgürlükleri ve çoğulculuk üzerine yazdığı kitabın ilk baskısı 1993 yılında Beyrut'taki Arap Birlik Çalışmaları Merkezi tarafından 382 sayfalık olarak yayımlandı."
  id: "Sebuah buku oleh politisi dan pemikir Tunisia Rached Ghannouchi tentang kebebasan publik dan pluralisme dalam pemikiran politik Islam, edisi pertamanya diterbitkan oleh Center for Arab Unity Studies di Beirut pada tahun 1993, terdiri dari 382 halaman."
