label: { ar: "الجمع بين نية كفارة اليمين ونية التطوع في شهر رجب", en: "Combining an oath-expiation fast with a Rajab voluntary fast", ur: "رجب میں کفارۂ یمین اور نفل روزے کی نیت جمع کرنا" }
summary:
  ar: "سائل سأل عن الجمع بين نية صوم كفارة اليمين الواجبة وثواب صوم شهر رجب في يوم واحد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22378)⁩ أن الجمع جائز شرعًا ويحصل للصائم ثوابهما إن شاء الله، على ما فصّل الجواب من قواعد اشتراك النيات."
  en: "A questioner asked about combining the intention of an obligatory oath-expiation fast with the reward of a Rajab voluntary fast on a single day. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22378) answered that combining is lawful and the faster gains the reward of both, God willing, under the rules of shared intention that the answer details."
  ur: "ایک سائل نے ایک ہی دن میں کفارۂ یمین کے فرض روزے اور رجب کے نفل روزے کے ثواب کی نیت جمع کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22378)⁩ نے جواب دیا کہ جمع کرنا شرعاً جائز ہے اور ان شاء اللہ روزے دار کو دونوں کا ثواب ملے گا، جواب میں مشترکہ نیت کے قواعد کی تفصیل ہے۔"
