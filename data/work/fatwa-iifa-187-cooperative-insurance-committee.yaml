label: { ar: "قرار مجمع الفقه الإسلامي الدولي 187 (20/2) بشأن التأمين التعاوني: الأحكام والضوابط الشرعية", en: "IIFA resolution 187 (20/2) on cooperative insurance: rulings and sharia controls", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 187 (20/2): تعاونی بیمہ — شرعی احکام و ضوابط" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩ بعد الاطلاع على توصيات مؤتمر «التأمين التعاوني: أبعاده وآفاقه وموقف الشريعة الإسلامية منها» الذي عقده المجمع بعمّان بالتعاون مع الجامعة الأردنية والإيسيسكو والمعهد الإسلامي للبحوث والتدريب ⁦(26–28 ربيع الثاني 1431هـ، 11–13 أبريل 2010م)⁩. أكد المجمع قراره 9 ⁦(2/9)⁩ أن عقد التأمين التجاري ذا القسط الثابت عقد معاوضة يتضمن غررًا كبيرًا مفسدًا للعقد فهو محرم شرعًا، وأن البديل المتفق مع أصول التعامل الإسلامي هو التأمين التعاوني القائم على التبرع والتعاون. ولما ظهرت إشكالات من خلال التطبيقات المتعددة في شركات التأمين الإسلامية والعقبات القانونية النظامية والرقابية التي واجهتها، تطلب الأمر الخروج بتصور متكامل للتأمين التعاوني، فأوصى بتكليف أمانته بتكوين لجنة من الفقهاء والخبراء بالتعاون مع مراكز البحوث للوصول إلى مشروع متكامل ينظم الأحكام والضوابط الشرعية لأسس التأمين التعاوني ويتضمن الصيغ المقبولة شرعًا بما يمنح مرونة في التطبيق، ومن هذه الأحكام: مفهوم التأمين التعاوني وحقيقته؛ والمقارنة بينه وبين التأمين التجاري والمبادئ الدولية للتعاون؛ وعلاقات أطرافه وتوصيفها وخصوصًا العلاقة بين المشتركين في الوعاء وبين الوعاء ومن تناط به إدارته؛ وأحكام العوض المستحق لمدير الوعاء ومعاييره؛ وأحكام الفائض والعجز؛ والاشتراك والانسحاب وضوابطهما؛ وأحكام التصفية؛ وإعادة التأمين؛ ومبدأ المشاركة في الربح والخسارة؛ ومبدأ الحلول؛ ومبدأ التحمل. على أن يقدم مقترح المشروع للدورة القادمة لصياغة مشروع قرار — وقد أصدر المجمع القرار الجامع لاحقًا برقم 200 ⁦(21/6)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012), after reviewing the recommendations of its Amman conference 'Cooperative insurance: dimensions, prospects and the sharia position' with the University of Jordan, ISESCO and the Islamic Research and Training Institute (26–28 Rabi al-Thani 1431, 11–13 April 2010). It reaffirmed resolution 9 (2/9) that the fixed-premium commercial insurance contract used by commercial companies is an exchange contract containing gross contract-vitiating gharar and is therefore prohibited, the alternative consistent with Islamic dealing being cooperative insurance based on donation and cooperation. Since difficulties had appeared in the varied applications of Islamic insurance companies and the legal, regulatory and supervisory obstacles they faced, an integrated conception was needed: it recommended charging its secretariat with forming a committee of jurists and experts with the relevant research centres to produce an integrated draft regulating the sharia rulings and controls for the foundations of cooperative insurance, including legally acceptable forms allowing practical flexibility — among them: the concept and essence of cooperative insurance; comparison with commercial insurance and the international principles of cooperation; characterising the relations among its parties, especially between the subscribers in the pool and between the pool and its manager; the manager's due compensation and its criteria; surplus and deficit; subscription and withdrawal; liquidation; reinsurance; profit-and-loss sharing; subrogation; and contribution — the draft to be presented at the next session. The comprehensive resolution followed as resolution 200 (21/6)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں — عمّان میں اس کی کانفرنس 'تعاونی بیمہ: ابعاد، امکانات اور شریعت کا موقف' ⁦(26–28 ربیع الثانی 1431ھ، 11–13 اپریل 2010ء)⁩ کی سفارشات کے جائزے کے بعد۔ اس نے قرارداد 9 ⁦(2/9)⁩ کی تائید کی کہ مقررہ قسط والا تجارتی بیمہ معاوضہ عقد ہے جس میں عقد کو بگاڑنے والا بڑا غرر ہے اس لیے شرعاً حرام، اور اسلامی معاملات کے اصولوں سے مطابق متبادل تبرع اور تعاون پر مبنی تعاونی بیمہ ہے۔ چونکہ اسلامی بیمہ کمپنیوں کے مختلف نفاذ اور قانونی، نظمیاتی و نگرانی کے رکاوٹوں سے مشکلات سامنے آئیں، مکمل تصور کی ضرورت ہوئی، اس لیے اس نے سفارش کی کہ سیکرٹریٹ فقہاء اور ماہرین کی کمیٹی متعلقہ تحقیقی مراکز کے ساتھ بنا کر تعاونی بیمہ کی بنیادوں کے شرعی احکام و ضوابط کا مکمل مسودہ تیار کرے جس میں شرعاً مقبول صورتیں عملی لچک کے ساتھ شامل ہوں — جن میں: تعاونی بیمہ کا تصور و حقیقت؛ تجارتی بیمہ اور تعاون کے عالمی اصولوں سے موازنہ؛ فریقوں کے تعلقات کی تشریح بالخصوص پول میں شریک صارفین کا اور پول اور اس کے منتظم کا تعلق؛ منتظم کے مستحق معاوضہ اور اس کے معیارات؛ فاضل اور عجز کے احکام؛ شمولیت اور دستبرداری کے ضوابط؛ تحلیل کے احکام؛ دوبارہ بیمہ؛ منافع و نقصان میں شرکت؛ حلول؛ اور تحمل — مسودہ اگلی مجلس میں پیش ہو۔ جامع قرارداد بعد میں 200 ⁦(21/6)⁩ کے نمبر سے جاری ہوئی۔"
