label: { ar: "قرار مجمع الفقه الإسلامي الدولي 187 (20/2) بشأن التأمين التعاوني: الأحكام والضوابط الشرعية", en: "IIFA resolution 187 (20/2) on cooperative insurance: rulings and sharia controls", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 187 (20/2): تعاونی بیمہ — شرعی احکام و ضوابط", es: "Resolución 187 (20/2) de la IIFA sobre seguros cooperativos: resoluciones y controles de la sharia.", fr: "Résolution 187 (20/2) de l'IIFA sur l'assurance coopérative: décisions et contrôles de la charia", tr: "Uluslararası İslami Fiqh Akademisi Kararı 187 (20/2) kooperatif sigorta ile ilgili olarak: Şeriat hükümleri ve kontrolleri", id: "Resolusi Akademi Fiqh Islam Internasional 187 (20/2) mengenai asuransi koperasi: Putusan dan pengawasan Syariah" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩ بعد الاطلاع على توصيات مؤتمر «التأمين التعاوني: أبعاده وآفاقه وموقف الشريعة الإسلامية منها» الذي عقده المجمع بعمّان بالتعاون مع الجامعة الأردنية والإيسيسكو والمعهد الإسلامي للبحوث والتدريب ⁦(26–28 ربيع الثاني 1431هـ، 11–13 أبريل 2010م)⁩. أكد المجمع قراره 9 ⁦(2/9)⁩ أن عقد التأمين التجاري ذا القسط الثابت عقد معاوضة يتضمن غررًا كبيرًا مفسدًا للعقد فهو محرم شرعًا، وأن البديل المتفق مع أصول التعامل الإسلامي هو التأمين التعاوني القائم على التبرع والتعاون. ولما ظهرت إشكالات من خلال التطبيقات المتعددة في شركات التأمين الإسلامية والعقبات القانونية النظامية والرقابية التي واجهتها، تطلب الأمر الخروج بتصور متكامل للتأمين التعاوني، فأوصى بتكليف أمانته بتكوين لجنة من الفقهاء والخبراء بالتعاون مع مراكز البحوث للوصول إلى مشروع متكامل ينظم الأحكام والضوابط الشرعية لأسس التأمين التعاوني ويتضمن الصيغ المقبولة شرعًا بما يمنح مرونة في التطبيق، ومن هذه الأحكام: مفهوم التأمين التعاوني وحقيقته؛ والمقارنة بينه وبين التأمين التجاري والمبادئ الدولية للتعاون؛ وعلاقات أطرافه وتوصيفها وخصوصًا العلاقة بين المشتركين في الوعاء وبين الوعاء ومن تناط به إدارته؛ وأحكام العوض المستحق لمدير الوعاء ومعاييره؛ وأحكام الفائض والعجز؛ والاشتراك والانسحاب وضوابطهما؛ وأحكام التصفية؛ وإعادة التأمين؛ ومبدأ المشاركة في الربح والخسارة؛ ومبدأ الحلول؛ ومبدأ التحمل. على أن يقدم مقترح المشروع للدورة القادمة لصياغة مشروع قرار — وقد أصدر المجمع القرار الجامع لاحقًا برقم 200 ⁦(21/6)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012), after reviewing the recommendations of its Amman conference 'Cooperative insurance: dimensions, prospects and the sharia position' with the University of Jordan, ISESCO and the Islamic Research and Training Institute (26–28 Rabi al-Thani 1431, 11–13 April 2010). It reaffirmed resolution 9 (2/9) that the fixed-premium commercial insurance contract used by commercial companies is an exchange contract containing gross contract-vitiating gharar and is therefore prohibited, the alternative consistent with Islamic dealing being cooperative insurance based on donation and cooperation. Since difficulties had appeared in the varied applications of Islamic insurance companies and the legal, regulatory and supervisory obstacles they faced, an integrated conception was needed: it recommended charging its secretariat with forming a committee of jurists and experts with the relevant research centres to produce an integrated draft regulating the sharia rulings and controls for the foundations of cooperative insurance, including legally acceptable forms allowing practical flexibility — among them: the concept and essence of cooperative insurance; comparison with commercial insurance and the international principles of cooperation; characterising the relations among its parties, especially between the subscribers in the pool and between the pool and its manager; the manager's due compensation and its criteria; surplus and deficit; subscription and withdrawal; liquidation; reinsurance; profit-and-loss sharing; subrogation; and contribution — the draft to be presented at the next session. The comprehensive resolution followed as resolution 200 (21/6)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں — عمّان میں اس کی کانفرنس 'تعاونی بیمہ: ابعاد، امکانات اور شریعت کا موقف' ⁦(26–28 ربیع الثانی 1431ھ، 11–13 اپریل 2010ء)⁩ کی سفارشات کے جائزے کے بعد۔ اس نے قرارداد 9 ⁦(2/9)⁩ کی تائید کی کہ مقررہ قسط والا تجارتی بیمہ معاوضہ عقد ہے جس میں عقد کو بگاڑنے والا بڑا غرر ہے اس لیے شرعاً حرام، اور اسلامی معاملات کے اصولوں سے مطابق متبادل تبرع اور تعاون پر مبنی تعاونی بیمہ ہے۔ چونکہ اسلامی بیمہ کمپنیوں کے مختلف نفاذ اور قانونی، نظمیاتی و نگرانی کے رکاوٹوں سے مشکلات سامنے آئیں، مکمل تصور کی ضرورت ہوئی، اس لیے اس نے سفارش کی کہ سیکرٹریٹ فقہاء اور ماہرین کی کمیٹی متعلقہ تحقیقی مراکز کے ساتھ بنا کر تعاونی بیمہ کی بنیادوں کے شرعی احکام و ضوابط کا مکمل مسودہ تیار کرے جس میں شرعاً مقبول صورتیں عملی لچک کے ساتھ شامل ہوں — جن میں: تعاونی بیمہ کا تصور و حقیقت؛ تجارتی بیمہ اور تعاون کے عالمی اصولوں سے موازنہ؛ فریقوں کے تعلقات کی تشریح بالخصوص پول میں شریک صارفین کا اور پول اور اس کے منتظم کا تعلق؛ منتظم کے مستحق معاوضہ اور اس کے معیارات؛ فاضل اور عجز کے احکام؛ شمولیت اور دستبرداری کے ضوابط؛ تحلیل کے احکام؛ دوبارہ بیمہ؛ منافع و نقصان میں شرکت؛ حلول؛ اور تحمل — مسودہ اگلی مجلس میں پیش ہو۔ جامع قرارداد بعد میں 200 ⁦(21/6)⁩ کے نمبر سے جاری ہوئی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 20.ª sesión en Orán (26 de Shawwal – 2 de Dhu al-Qada de 1433, 13-18 de septiembre de 2012), tras revisar las recomendaciones de su conferencia en Amán «Seguro cooperativo: dimensiones, perspectivas y posición de la sharia» con la Universidad de Jordania, ISESCO y el Instituto Islámico de Investigación y Formación (26-28 de Rabi al-Thani de 1431, 11-13 de abril de 2010). Reafirmó la resolución 9 (2/9) que establece que el contrato de seguro comercial de prima fija utilizado por las empresas comerciales es un contrato de intercambio que contiene gharar, un vicio contractual grave, y por lo tanto está prohibido; la alternativa coherente con las relaciones comerciales islámicas es el seguro cooperativo basado en la donación y la cooperación. Dado que habían surgido dificultades en las diversas aplicaciones de las compañías de seguros islámicas y los obstáculos legales, regulatorios y de supervisión que enfrentaban, se requería una concepción integral: se recomendó encomendar a su secretaría la formación de un comité de juristas y expertos de los centros de investigación pertinentes para elaborar un proyecto integral que regulara las normas y controles de la sharia para los fundamentos de los seguros cooperativos, incluyendo formas legalmente aceptables que permitieran flexibilidad práctica, entre ellas: el concepto y la esencia del seguro cooperativo; la comparación con el seguro comercial y los principios internacionales de cooperación; la caracterización de las relaciones entre sus partes, especialmente entre los suscriptores del fondo común y entre el fondo común y su administrador; la debida compensación del administrador y sus criterios; superávit y déficit; suscripción y retiro; liquidación; reaseguro; participación en pérdidas y ganancias; subrogación; y contribución; proyecto que se presentaría en la próxima sesión. La resolución integral se adoptó como resolución 200 (21/6)."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, soit du 13 au 18 septembre 2012), après examen des recommandations de sa conférence d'Amman intitulée « Assurance coopérative: dimensions, perspectives et position de la charia », organisée conjointement avec l'Université de Jordanie, l'ISESCO et l'Institut islamique de recherche et de formation (26-28 Rabi al-Thani 1431, soit du 11 au 13 avril 2010), a réaffirmé la résolution 9 (2/9) selon laquelle le contrat d'assurance commerciale à prime fixe utilisé par les entreprises commerciales constitue un contrat d'échange comportant un gharar (abus de droit) flagrant et est donc interdit. L'alternative conforme aux pratiques islamiques est l'assurance coopérative fondée sur le don et la coopération. Face aux difficultés rencontrées dans les diverses applications des compagnies d'assurance islamiques et aux obstacles juridiques, réglementaires et de supervision auxquels elles étaient confrontées, une conception intégrée s'avérait nécessaire. Il a été recommandé de charger son secrétariat de constituer un comité de juristes et d'experts, en collaboration avec les centres de recherche compétents, afin d'élaborer un projet intégré régissant les règles et les contrôles de la charia applicables aux fondements de l'assurance coopérative. Ce projet devait inclure des formes juridiquement acceptables permettant une flexibilité pratique, et aborder notamment: le concept et l'essence de l'assurance coopérative; une comparaison avec l'assurance commerciale et les principes internationaux de coopération; la caractérisation des relations entre ses parties, en particulier entre les souscripteurs du groupe et entre le groupe et son gestionnaire; la rémunération du gestionnaire et ses critères; les excédents et les déficits; les souscriptions et les retraits; la liquidation; la réassurance; le partage des profits et des pertes; la subrogation; et les contributions. Ce projet devait être présenté à la session suivante. La résolution globale a été adoptée sous la référence 200 (21/6)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda (26 Şevval – 2 Dzual-Kı'da 1433 Hicri, 13–18 Eylül 2012) Oran'da (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 Eylül 2012) Akademi tarafından Amman'da düzenlenen ve Ürdün Üniversitesi, ICESCO ve İslami Araştırma ve Eğitim Enstitüsü ile iş birliği içinde düzenlenen 'Kooperatif Sigorta: Boyutları, Gelecekleri ve İslami Şeriatın Bunlardaki Pozisyonu' konferansının önerilerinin incelenmesi üzerine toplu kararı (26–28 Rabi'al-Thani 1431 H, 11–13 Nisan 2010). Akademi, 9 (2/9) sayılı kararında sabit taksitli ticari sigorta sözleşmesinin, önemli belirsizlik içeren ve sözleşmeyi geçersiz kılan bir takas sözleşmesi olduğunu, dini olarak yasaklanmış olduğunu ve İslami ilkelerle kabul edilen alternatifin bağış ve işbirliğine dayalı kooperatif sigorta olduğunu teyit etmiştir. İslami sigorta şirketlerinde çok sayıda başvuru ve karşılaştıkları yasal, düzenleyici ve düzenleyici engeller nedeniyle sorunlar ortaya çıkınca, kooperatif sigorta için kapsamlı bir vizyon geliştirilmesi gereklilik doğdu. Sekretaryasına, kooperatif sigortanın temellerini düzenleyen ve yasal olarak kabul edilen İslami hukuk biçimlerini de içeren kapsamlı bir projeye ulaşmak üzere araştırma merkezleriyle iş birliği içinde hukukçular ve uzmanlardan oluşan bir komite kurmasını önerdi. Bu hükümler arasında şunlar yer alıyor: Kooperatif sigorta kavramı ve gerçekliği; ticari sigorta ile karşılaştırılması ve uluslararası işbirliği ilkeleri; tarafların ilişkileri ve özellikleri, özellikle katılımcılar, fon ve yönetimine emanet edilenler arasındaki ilişki; fon yöneticisine ödenmesi gereken tazminat hükümleri ve kriterleri; fazla ve açık kuralları; katılım ve çekilme ile bunların kontrolleri; tasfiye hükümleri; reasürans; kar ve zarar paylaşımı ilkesi; çözümler ilkesi; ve taşıma ilkesi. Taslak teklif, bir sonraki oturuma sunulacak ve karar taslağı hazırlanacak — Meclis daha sonra kapsamlı 200 (21/6) sayılı kararı yayımladı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluhnya di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012) setelah meninjau rekomendasi konferensi 'Asuransi Koperasi: Dimensi, Prospek, dan Posisi Syariah Islam tentang Mereka' yang diselenggarakan oleh Akademi di Amman bekerja sama dengan Universitas Yordania, ICESCO, dan Institut Penelitian dan Pelatihan Islam (26–28 Rabi' al-Thani 1431 H, 11–13 April 2010). Akademi menegaskan dalam Keputusan 9 (2/9) bahwa kontrak asuransi komersial cicilan tetap adalah kontrak barter yang melibatkan ketidakpastian signifikan yang membatalkan kontrak, karena secara agama dilarang, dan alternatif yang disepakati oleh prinsip Islam adalah asuransi koperasi berdasarkan donasi dan kerja sama. Ketika masalah muncul akibat berbagai aplikasi di perusahaan asuransi Islam dan hambatan hukum, regulasi, serta regulasi yang mereka hadapi, menjadi perlu untuk mengembangkan visi komprehensif untuk asuransi koperasi. Ia merekomendasikan agar sekretariatnya membentuk komite yang terdiri dari ahli hukum dan ahli bekerja sama dengan pusat penelitian guna mencapai proyek komprehensif yang mengatur putusan Syariah dan pengendalian dasar-dasar asuransi koperasi, termasuk bentuk hukum Islam yang diterima secara hukum untuk memberikan fleksibilitas dalam penerapan. Di antara ketentuan tersebut adalah: Konsep dan realitas asuransi koperasi; perbandingannya dengan asuransi komersial dan prinsip kerja sama internasional; hubungan dan karakteristik para pihaknya, terutama hubungan antara peserta, dana, dan mereka yang dipercayakan untuk mengelolanya; ketentuan kompensasi yang harus diberikan kepada manajer dana dan kriterianya; aturan surplus dan defisit; partisipasi dan penarikan serta pengawasannya; ketentuan likuidasi; reasuransi; prinsip pembagian untung dan rugi; prinsip solusi; dan prinsip bearing. Rancangan proposal tersebut akan diajukan ke sesi berikutnya untuk menyusun resolusi — Majelis kemudian mengeluarkan resolusi komprehensif No. 200 (21/6)."
