summary:
  ar: "مسند الإمام سليمان بن داود الطيالسي ⁦(ت 204هـ)⁩، وهو في الحقيقة مجالس سمعها يونس بن حبيب منه، فصنّفها له أبو مسعود الرازي؛ وما بقي منه في طبعة دار هجر ⁦(1419–1420هـ)⁩ نحو ألفي حديث وتسعمائة، بينما حدّث الطيالسي بمائة ألف حديث في خراسان."
  en: "The musnad of the traditionist Sulayman ibn Dawud al-Tayalisi (d. 204 AH). It is in fact a set of sessions that Yunus ibn Habib heard from him, compiled for Yunus by Abu Mas'ud al-Razi. The Dar Hajar edition (1419–1420 AH) gives about 2,890 reports, while al-Tayalisi is said to have transmitted a hundred thousand in Khurasan."
  es: "El musnad del tradicionalista Sulayman ibn Dawud al-Tayalisi (fallecido en el año 204 de la Hégira). Se trata, de hecho, de una recopilación de sesiones que Yunus ibn Habib escuchó de él, compiladas para Yunus por Abu Mas'ud al-Razi. La edición de Dar Hajar (1419-1420 de la Hégira) contiene aproximadamente 2890 relatos, mientras que se dice que al-Tayalisi transmitió cien mil en Jorasán."
  fr: "Le musnad du traditionniste Sulayman ibn Dawud al-Tayalisi (mort en 204 AH) est en réalité un recueil de sessions que Yunus ibn Habib a entendues de sa bouche, compilées pour Yunus par Abu Mas'ud al-Razi. L'édition Dar Hajar (1419-1420 AH) rapporte environ 2 890 transmissions, tandis qu'al-Tayalisi en aurait transmis cent mille au Khorasan."
  ur: "روایت کرنے والے سلیمان بن داؤد الطیالسی ⁦(متوفی 204ھ)⁩ کی مسند۔ یہ درحقیقت سیشنوں کا ایک مجموعہ ہے جو یونس بن حبیب نے ان سے سنا، جسے ابو مسعود الرازی نے یونس کے لیے مرتب کیا تھا۔ دار حجر ایڈیشن ⁦(1419-1420 ہجری)⁩ میں تقریباً 2,890 رپورٹیں ملتی ہیں، جبکہ الطیالسی کے بارے میں کہا جاتا ہے کہ خراسان میں ایک لاکھ رپورٹیں بھیجی ہیں۔"
  tr: "İmam Süleyman bin Davud el-Tayalisi'nin (ö. 204 H) musnadı, aslında Yunus ibn Habib'in dinlediği toplantılardır ve onun için Ebu Mes'ud el-Razi tarafından derlenmiştir; Dar Hajar baskısında (1419–1420 H) kalanlar yaklaşık iki bin dokuz yüz hadistir, el-Tayalisi ise Horasan'da yüz bin hadisi rivayet etmiştir."
  id: "Musnad Imam Sulayman ibn Dawud al-Tayalisi (wafat 204 H), yang sebenarnya adalah pertemuan yang didengar oleh Yunus ibn Habib, disusun untuknya oleh Abu Mas'ud al-Razi; yang tersisa dalam edisi Dar Hajar (1419–1420 H) adalah sekitar dua ribu sembilan ratus hadits, sementara al-Tayalisi menceritakan seratus ribu hadis dalam Khorasan."
