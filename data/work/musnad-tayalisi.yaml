summary:
  ar: "مسند الإمام سليمان بن داود الطيالسي (ت 204هـ)، وهو في الحقيقة مجالس سمعها يونس بن حبيب منه، فصنّفها له أبو مسعود الرازي؛ وما بقي منه في طبعة دار هجر (1419–1420هـ) نحو ألفي حديث وتسعمائة، بينما حدّث الطيالسي بمائة ألف حديث في خراسان."
  en: "The musnad of the traditionist Sulayman ibn Dawud al-Tayalisi (d. 204 AH). It is in fact a set of sessions that Yunus ibn Habib heard from him, compiled for Yunus by Abu Mas'ud al-Razi. The Dar Hajar edition (1419–1420 AH) gives about 2,890 reports, while al-Tayalisi is said to have transmitted a hundred thousand in Khurasan."
