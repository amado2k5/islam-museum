label: { ar: "القرآن الكريم بالتركمانية ⁦(إدارة مفتي تركمانستان)⁩", en: "Kurany Kerim. Türkmen dilinde (Directorate of the Mufti of Turkmenistan)", ur: "قرآنِ کریم ترکمانی میں ⁦(ترکمانستان کے مفتی کی انتظامیہ)⁩", es: "Kurany Kerim. Türkmen dilinde (Dirección del Muftí de Turkmenistán)", fr: "Kurany Kerim. Türkmen dilinde (Direction du Mufti du Turkménistan)", tr: "Türkmence Kur'an-ı Kerim (Türkmenistan Müftüsü Yönetimi)", id: "Al-Qur'an dalam bahasa Turkmen (Administrasi Mufti Turkmenistan)" }
summary:
  ar: "ترجمة تركمانية لمعاني القرآن أصدرتها إدارة مفتي تركمانستان أول مرة سنة 2006 لتكون الترجمة الرسمية، مع النص العربي في عمود مقابل، ومقدمات قصيرة للسور، وإضافات تفسيرية بين الأقواس وشروح توافق في الغالب القراءات السنية الشائعة، دون ذكر أسماء المترجمين؛ طُبعت بأعداد محدودة وتوجد في المساجد الكبرى والمكتبات المركزية وعلى مواقع إسلامية تركمانية، وتكاد تنفرد بقرّاء التركمانية داخل البلاد وخارجها."
  en: "A Turkmen rendering of the meanings of the Qur'an issued by the Directorate of the Mufti of Turkmenistan, first published in 2006 as the official translation, with the Arabic text in a parallel column, short sura introductions, bracketed interpretive insertions and explanations corresponding mainly to mainstream Sunni readings, and no translators named; printed in small numbers, it is found in the larger mosques, central libraries and Turkmen Islamic websites, and holds a near-monopoly among Turkmen readers at home and abroad."
  ur: "قرآن کے معانی کا ترکمانی ترجمہ جو ترکمانستان کے مفتی کی انتظامیہ نے 2006 میں سرکاری ترجمے کے طور پر پہلی بار جاری کیا، مقابل کالم میں عربی متن، سورتوں کے مختصر تعارف، قوسین میں تفسیری اضافے اور زیادہ تر عام سنی قراءتوں کے مطابق وضاحتیں، اور مترجمین کے نام کے بغیر؛ محدود تعداد میں چھپا، بڑی مساجد، مرکزی کتب خانوں اور ترکمانی اسلامی ویب سائٹوں پر ملتا ہے، اور ملک کے اندر اور باہر ترکمانی قارئین میں تقریباً واحد ترجمہ ہے۔"
  es: "Una traducción turcomana de los significados del Corán, publicada por la Dirección del Muftí de Turkmenistán, apareció por primera vez en 2006 como la traducción oficial, con el texto árabe en una columna paralela, breves introducciones a las suras, inserciones interpretativas entre corchetes y explicaciones que corresponden principalmente a las lecturas sunitas mayoritarias, y sin nombrar a los traductores; impresa en pequeñas cantidades, se encuentra en las mezquitas más grandes, las bibliotecas centrales y los sitios web islámicos turcomanos, y goza de un casi monopolio entre los lectores turcomanos, tanto en el país como en el extranjero."
  fr: "Une traduction turkmène du Coran, publiée par la Direction du Mufti du Turkménistan et parue pour la première fois en 2006 en tant que traduction officielle, avec le texte arabe en colonne parallèle, de courtes introductions aux sourates, des insertions interprétatives entre crochets et des explications correspondant principalement aux lectures sunnites courantes, sans mention de traducteurs; imprimée en petit nombre, elle se trouve dans les grandes mosquées, les bibliothèques centrales et sur les sites web islamiques turkmènes, et détient un quasi-monopole parmi les lecteurs turkmènes, tant au pays qu’à l’étranger."
  tr: "Kur'an'ın anlamlarının Türkmençe çevirisi ilk olarak 2006 yılında Türkmenistan Müftüsü tarafından resmi çeviri olarak yayımlanmıştır; Arapça metin ilgili sütunda, surelere kısa girişler, parantez arasına açıklayıcı eklemeler ve terfürler çoğunlukla yaygın Sünni okumalarıyla uyumlu yorumlar içermektedir, çevirmenlerin isimleri belirtilmemiştir. Sınırlı sayıda basılmıştır ve büyük camilerde, merkezi kütüphanelerde ve Türkmen İslami sitelerinde bulunur; neredeyse tamamen ülke içinde ve dışında Türkmence okunmaktadır."
  id: "Terjemahan Turkmen atas makna Al-Qur'an pertama kali diterbitkan oleh Mufti Turkmenistan pada tahun 2006 sebagai terjemahan resmi, dengan teks Arab dalam kolom yang sesuai, pengantar singkat surat, tambahan penjelasan di antara tanda kurung, dan komentar yang sebagian besar konsisten dengan bacaan Sunni umum, tanpa menyebutkan nama penerjemah. Terjemahan ini dicetak dalam jumlah terbatas dan ditemukan di masjid-masjid besar, perpustakaan pusat, dan situs Islam Turkmenistan, dan hampir seluruhnya adalah pembaca Turkmen di dalam dan luar negeri."
