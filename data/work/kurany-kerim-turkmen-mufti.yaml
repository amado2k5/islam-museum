summary:
  ar: "ترجمة تركمانية لمعاني القرآن أصدرتها إدارة مفتي تركمانستان أول مرة سنة 2006 لتكون الترجمة الرسمية، مع النص العربي في عمود مقابل، ومقدمات قصيرة للسور، وإضافات تفسيرية بين الأقواس وشروح توافق في الغالب القراءات السنية الشائعة، دون ذكر أسماء المترجمين؛ طُبعت بأعداد محدودة وتوجد في المساجد الكبرى والمكتبات المركزية وعلى مواقع إسلامية تركمانية، وتكاد تنفرد بقرّاء التركمانية داخل البلاد وخارجها."
  en: "A Turkmen rendering of the meanings of the Qur'an issued by the Directorate of the Mufti of Turkmenistan, first published in 2006 as the official translation, with the Arabic text in a parallel column, short sura introductions, bracketed interpretive insertions and explanations corresponding mainly to mainstream Sunni readings, and no translators named; printed in small numbers, it is found in the larger mosques, central libraries and Turkmen Islamic websites, and holds a near-monopoly among Turkmen readers at home and abroad."
  ur: "قرآن کے معانی کا ترکمانی ترجمہ جو ترکمانستان کے مفتی کی انتظامیہ نے 2006 میں سرکاری ترجمے کے طور پر پہلی بار جاری کیا، مقابل کالم میں عربی متن، سورتوں کے مختصر تعارف، قوسین میں تفسیری اضافے اور زیادہ تر عام سنی قراءتوں کے مطابق وضاحتیں، اور مترجمین کے نام کے بغیر؛ محدود تعداد میں چھپا، بڑی مساجد، مرکزی کتب خانوں اور ترکمانی اسلامی ویب سائٹوں پر ملتا ہے، اور ملک کے اندر اور باہر ترکمانی قارئین میں تقریباً واحد ترجمہ ہے۔"
