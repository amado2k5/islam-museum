id: work/fatwa-dar-alifta-eg-ai-electronic-mushafs
class: work
kind: fatwa
label: { ar: "حكم استخدام الذكاء الاصطناعي في إنشاء مصاحف إلكترونية أو تلاوات صناعية", en: "Using AI to produce electronic mushafs or synthetic recitations", ur: "الیکٹرانک مصاحف یا مصنوعی تلاوتیں بنانے میں اے آئی کا استعمال", es: "Utilizar la IA para producir mushafs electrónicos o recitaciones sintéticas.", fr: "Utilisation de l'IA pour produire des mushafs électroniques ou des récitations synthétiques", tr: "Elektronik Kur'anlar veya endüstriyel okumalar oluşturmak için yapay zekanın kullanılmasına ilişkin karar", id: "Putusan tentang penggunaan kecerdasan buatan untuk membuat Al-Qur'an elektronik atau pembacaan industri" }
summary:
  ar: "سائل سأل عن استخدام تقنيات الذكاء الاصطناعي في إنشاء المصاحف الإلكترونية وتلاوات صناعية للاستعانة على ضبط القراءة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22522)⁩ ببيان ضوابط جواز الاستعانة بتقنيات الذكاء الاصطناعي في إنشاء مصاحف إلكترونية أو تلاوات صناعية مع ما يجب ضبطه من الدقة على ما فصّل الجواب."
  en: "A questioner asked about using AI to produce electronic mushafs and synthetic recitations to help verify reading. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22522) answered by setting out the controls under which AI may assist in creating electronic mushafs or synthetic recitations, and the accuracy requirements that must govern them, as the answer details."
  ur: "ایک سائل نے الیکٹرانک مصاحف اور مصنوعی تلاوتیں بنانے اور تلاوت کی تصدیق میں اے آئی استعمال کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22522)⁩ نے جواب میں وہ ضوابط بیان کیے جن کے تحت الیکٹرانک مصاحف یا مصنوعی تلاوتوں کی تیاری میں اے آئی سے استعانت جائز ہے، اور وہ معیارات جو ان میں رعایت کیے جانے لازم ہیں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre el uso de la IA para producir mushafs electrónicos y recitaciones sintéticas que ayuden a verificar la lectura. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22522) respondió estableciendo los controles bajo los cuales la IA puede ayudar a crear mushafs electrónicos o recitaciones sintéticas, y los requisitos de precisión que deben regirlos, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'utilisation de l'IA pour produire des mushafs électroniques et des récitations synthétiques afin de faciliter la vérification de la lecture. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22522) a répondu en exposant les conditions dans lesquelles l'IA peut contribuer à la création de mushafs électroniques ou de récitations synthétiques, ainsi que les exigences de précision qui doivent les encadrer, comme le détaille la réponse."
  tr: "Bir soru soran kişi, elektronik Kur'anlar ve yapay tilavetler oluşturmada yapay zeka teknolojilerinin kullanımını sordu; böylece oket kontrolü sağlandı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22522), elektronik Kur'anlar veya yapay tilavetler oluşturulmasında yapay zeka teknolojilerinin kullanımına izin veren düzenlemeleri, ayrıntılı yanıtta belirtilmesi gereken kesinlikle netleştirdi."
  id: "Seorang penanya menanyakan tentang penggunaan teknologi kecerdasan buatan dalam pembuatan Al-Qur'an elektronik dan pembacaan buatan untuk membantu mengontrol pembacaan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22522) menanggapi dengan memperjelas peraturan yang mengizinkan penggunaan teknologi kecerdasan buatan dalam pembuatan Al-Qur'an elektronik atau pembacaan buatan, dengan ketelitian yang diperlukan yang harus dijelaskan dalam jawaban rinci."
