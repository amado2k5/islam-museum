id: work/fatwa-dar-alifta-eg-husband-dies-during-idda
class: work
kind: fatwa
label: { ar: "عدة المطلقة رجعيًّا إذا مات زوجها أثناء العدة", en: "The waiting period of a revocably divorced woman whose husband dies during it", ur: "طلاقِ رجعی کی عدت میں شوہر کی وفات", es: "El período de espera de una mujer divorciada revocablemente cuyo marido muere durante su divorcio." }
summary:
  ar: "سائلة طلقها زوجها طلاقًا رجعيًّا غير مكمل للثلاث ثم مات أثناء عدتها فسألت عن عدتها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22029)⁩ أنها إن كانت حاملًا انتهت عدتها بوضع الحمل وإلا اعتدت عدة الوفاة، على ما فصّل الجواب."
  en: "A woman was revocably divorced — short of the three — and her husband died during her waiting period; she asked about her idda. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22029) answered that if she is pregnant her idda ends with delivery, otherwise she observes the widow's waiting period — as the answer details."
  ur: "ایک خاتون کو شوہر نے تین سے کم رجعی طلاق دی اور عدت کے دوران اس کی وفات ہو گئی؛ اس نے اپنی عدت پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22029)⁩ نے جواب دیا کہ اگر وہ حاملہ ہے تو عدت ولادت پر ختم ہوتی ہے ورنہ بیوگی کی عدت گزارے گی — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una mujer fue divorciada de forma revocable —sin cumplir los tres requisitos— y su esposo falleció durante su período de espera; ella preguntó sobre su idda. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22029) respondió que si está embarazada, su idda termina con el parto; de lo contrario, observa el período de espera de la viudedad, como se detalla en la respuesta."
