label: { ar: "كيفية قضاء الصلاة من حيث الجهر بالقراءة والإسرار بها", en: "Making up prayers aloud or quietly", ur: "قضاء نماز میں بلند یا آہستہ قراءت", es: "Inventar oraciones en voz alta o en voz baja.", fr: "Inventer des prières à voix haute ou en silence", tr: "Duanın yüksek sesle okunması ve gizlice okunması açısından nasıl okunur", id: "Bagaimana cara melaksanakan doa dalam hal mengucapkan dengan lantang dan diam-diam mengucapkannya" }
summary:
  ar: "سائل سأل عن الجهر والإسرار في قضاء الصلاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21959)⁩ أن الصلاة المفروضة لا تسقط عن المكلف بحال ومن فاتته صلاة وجب قضاؤها والإسرار والجهر فيها يكون بحسب وقتها الأصلي على ما فصّل الجواب."
  en: "A questioner asked about reciting aloud or quietly when making up a missed prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21959) answered that the obligatory prayer never lapses and a missed prayer must be made up; aloud or quiet follows the prayer's original time — as the answer details."
  ur: "ایک سائل نے قضاء نماز میں بلند یا آہستہ قراءت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21959)⁩ نے جواب دیا کہ فرض نماز کسی حال میں ساقط نہیں ہوتی اور چھوٹی ہوئی نماز کی قضاء واجب ہے؛ بلند یا آہستہ پڑھنا اصل وقت کے مطابق ہوتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de recitar en voz alta o en voz baja al recuperar una oración perdida. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21959) respondió que la oración obligatoria nunca se pierde y que la oración perdida debe recuperarse; la forma de rezarla, ya sea en voz alta o en voz baja, se ajusta al horario original de la oración, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la récitation à voix haute ou à voix basse d'une prière manquée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21959) a répondu que la prière obligatoire ne peut jamais être manquée et qu'une prière manquée doit être rattrapée; la récitation à voix haute ou à voix basse se fait selon l'horaire initial de la prière, comme le précise la réponse."
  tr: "Bir soru soran kişi, kamuya açık kıl ve kaçırılan namazların telafisi konusunda gizlilik hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21959), zorunlu namazın hiçbir koşulda sorumlu kişi için vazgeçilmediğini, namazı kaçıran kişinin namazı uydurması gerektiğini, sırlar ve halka açık okumaların ise cevapta açıklandığı gibi orijinal zamana göre yapılması gerektiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang pembacaan di depan umum dan kerahasiaan dalam mengejar doa yang terlewat. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21959) menjawab bahwa doa wajib tidak dibebaskan bagi orang yang bertanggung jawab dalam keadaan apapun, dan siapa pun yang melewatkan salat harus menebusnya, dan rahasia serta pembacaan umum di dalamnya harus sesuai dengan waktu aslinya, seperti yang dijelaskan dalam jawaban."
