id: work/fatwa-aliftaa-jo-moving-remains-to-a-family-cemetery
class: work
kind: fatwa
label: { ar: "نقل رفات الميت إلى مقبرة العائلة", en: "Moving a deceased person's remains to a family cemetery", ur: "میت کی باقیات خاندانی قبرستان منتقل کرنا" }
summary:
  ar: "سؤال عن نقل رفات الميت إلى مقبرة العائلة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز نبش القبر ونقل الرفات ما دامت فيه عظام الميت، وأن صعوبة الزيارة ليست ضرورة تبيح النبش، إذ يمكن الدعاء للميت عن بعد وزيارته في فترات متباعدة. أجابت الدائرة بأن للميت حرمة وكرامة، واستشهدت بـ[[passage/quran-17-70|سورة الإسراء 17:70]]، وقالت إنه لا يجوز نبش قبور الأموات ولا إزالتها ما دامت فيها عظامهم، وعظام الموتى لا تبلى إلا بعد مئات السنين كما هو مشاهد في البلاد. واستدلت على أن للأموات حرمة الأحياء بحديث رواه أبو داود معناه أن كسر عظم الميت ككسره حيًا، وبحديث رواه مسلم معناه أن جلوس أحدهم على جمرة تحرق ثيابه خير له من الجلوس على قبر، وقالت إن من كرامة الميت ألا ينبش قبره ولا تنتهك حرمته. وقالت إن المكان الذي يدفن فيه الميت يعد وقفًا عليه، والأفضل الدفن في مقبرة عامة ليكثر الداعون والزائرون، وما دام قد دفن في مقبرة خاصة فلا حاجة ولا ضرورة لنقله قرب أهله من أجل زيارته والدعاء له، فالدعاء يمكن أن يكون عن بعد، والزيارة ممكنة في فترات متباعدة إن شقت. وخلصت إلى أنه لا يجوز نبش القبر إلا عند اندراس رفات الميت."
  en: "A question about moving a deceased person's remains to a family cemetery, in which Jordan's General Iftaa Department answered that a grave may not be opened and the remains moved while the deceased's bones remain in it, and that difficulty of visiting is not a necessity that permits exhumation, since one can pray for the deceased from afar and visit at longer intervals. The Department answered that the deceased has sanctity and dignity, citing [[passage/quran-17-70|Surat al-Isra' 17:70]], and that graves may not be opened or removed while the bones of the dead remain in them; bones decay only after hundreds of years, as observed in the country. It cited, as evidence that the dead have the same sanctity as the living, a hadith narrated by Abu Dawud whose meaning is that breaking a dead person's bone is like breaking it while he is alive, and a hadith narrated by Muslim whose meaning is that sitting on an ember that burns through one's clothes to the skin is better than sitting on a grave; part of the deceased's dignity is that his grave not be opened or his sanctity violated. It said the place where a person is buried counts as an endowment for him, and burial in a public cemetery is better so that more people pray for and visit the dead; since he was buried in a private cemetery, there is no need or necessity to move him near his family so they can visit and pray for him, since prayer can be made from afar, and visits can be made at longer intervals if they are difficult. It concluded that the grave may not be opened unless the remains have fully decayed."
  ur: "میت کی باقیات خاندانی قبرستان منتقل کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جب تک قبر میں میت کی ہڈیاں موجود ہوں قبر کھولنا اور باقیات منتقل کرنا جائز نہیں، اور زیارت کی مشکل ایسی ضرورت نہیں جو قبر کشائی کو جائز کرے، کیونکہ میت کے لیے دور سے دعا کی جا سکتی ہے اور وقفے وقفے سے زیارت ہو سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ میت کی حرمت اور عزت ہے، اور [[passage/quran-17-70|سورۃ الاسراء 17:70]] کا حوالہ دیا، اور کہا کہ جب تک قبروں میں مردوں کی ہڈیاں ہوں انہیں کھولنا یا ہٹانا جائز نہیں؛ اور ہڈیاں سینکڑوں سال بعد ہی گلتی ہیں، جیسا کہ ملک میں مشاہدہ ہے۔ اس نے اس بات پر کہ مردوں کی حرمت زندوں جیسی ہے، ابو داود کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ میت کی ہڈی توڑنا زندگی میں توڑنے جیسا ہے، اور مسلم کی روایت کردہ حدیث سے جس کا مفہوم ہے کہ ایسے انگارے پر بیٹھنا جو کپڑے جلا کر جلد تک پہنچ جائے قبر پر بیٹھنے سے بہتر ہے؛ اور میت کی عزت میں یہ بھی ہے کہ اس کی قبر نہ کھولی جائے اور اس کی حرمت پامال نہ ہو۔ اس نے کہا کہ جس جگہ میت دفن ہو وہ اس کے لیے وقف شمار ہوتی ہے، اور عام قبرستان میں دفن بہتر ہے تاکہ دعا اور زیارت کرنے والے زیادہ ہوں؛ چونکہ اسے نجی قبرستان میں دفن کیا گیا ہے، اس لیے اسے زیارت اور دعا کی خاطر گھر والوں کے قریب منتقل کرنے کی کوئی حاجت یا ضرورت نہیں، کیونکہ دعا دور سے ہو سکتی ہے اور مشکل ہو تو زیارت وقفے وقفے سے ہو سکتی ہے۔ اس نے نتیجہ نکالا کہ میت کی باقیات مکمل گل جانے سے پہلے قبر کھولنا جائز نہیں۔"
