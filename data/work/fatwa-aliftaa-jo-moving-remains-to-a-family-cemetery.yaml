id: work/fatwa-aliftaa-jo-moving-remains-to-a-family-cemetery
class: work
kind: fatwa
label: { ar: "نقل رفات الميت إلى مقبرة العائلة", en: "Moving a deceased person's remains to a family cemetery", ur: "میت کی باقیات خاندانی قبرستان منتقل کرنا", es: "Traslado de los restos de una persona fallecida a un cementerio familiar.", fr: "Déplacer la dépouille d'une personne décédée dans un cimetière familial", tr: "Ölenin kalıntılarının aile mezarlığına nakli", id: "Pemindahan jenazah almarhum ke pemakaman keluarga" }
summary:
  ar: "سؤال عن نقل رفات الميت إلى مقبرة العائلة، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز نبش القبر ونقل الرفات ما دامت فيه عظام الميت، وأن صعوبة الزيارة ليست ضرورة تبيح النبش، إذ يمكن الدعاء للميت عن بعد وزيارته في فترات متباعدة. أجابت الدائرة بأن للميت حرمة وكرامة، واستشهدت بـ[[passage/quran-17-70|سورة الإسراء 17:70]]، وقالت إنه لا يجوز نبش قبور الأموات ولا إزالتها ما دامت فيها عظامهم، وعظام الموتى لا تبلى إلا بعد مئات السنين كما هو مشاهد في البلاد. واستدلت على أن للأموات حرمة الأحياء بحديث رواه أبو داود معناه أن كسر عظم الميت ككسره حيًا، وبحديث رواه مسلم معناه أن جلوس أحدهم على جمرة تحرق ثيابه خير له من الجلوس على قبر، وقالت إن من كرامة الميت ألا ينبش قبره ولا تنتهك حرمته. وقالت إن المكان الذي يدفن فيه الميت يعد وقفًا عليه، والأفضل الدفن في مقبرة عامة ليكثر الداعون والزائرون، وما دام قد دفن في مقبرة خاصة فلا حاجة ولا ضرورة لنقله قرب أهله من أجل زيارته والدعاء له، فالدعاء يمكن أن يكون عن بعد، والزيارة ممكنة في فترات متباعدة إن شقت. وخلصت إلى أنه لا يجوز نبش القبر إلا عند اندراس رفات الميت."
  en: "A question about moving a deceased person's remains to a family cemetery, in which Jordan's General Iftaa Department answered that a grave may not be opened and the remains moved while the deceased's bones remain in it, and that difficulty of visiting is not a necessity that permits exhumation, since one can pray for the deceased from afar and visit at longer intervals. The Department answered that the deceased has sanctity and dignity, citing [[passage/quran-17-70|Surat al-Isra' 17:70]], and that graves may not be opened or removed while the bones of the dead remain in them; bones decay only after hundreds of years, as observed in the country. It cited, as evidence that the dead have the same sanctity as the living, a hadith narrated by Abu Dawud whose meaning is that breaking a dead person's bone is like breaking it while he is alive, and a hadith narrated by Muslim whose meaning is that sitting on an ember that burns through one's clothes to the skin is better than sitting on a grave; part of the deceased's dignity is that his grave not be opened or his sanctity violated. It said the place where a person is buried counts as an endowment for him, and burial in a public cemetery is better so that more people pray for and visit the dead; since he was buried in a private cemetery, there is no need or necessity to move him near his family so they can visit and pray for him, since prayer can be made from afar, and visits can be made at longer intervals if they are difficult. It concluded that the grave may not be opened unless the remains have fully decayed."
  ur: "میت کی باقیات خاندانی قبرستان منتقل کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جب تک قبر میں میت کی ہڈیاں موجود ہوں قبر کھولنا اور باقیات منتقل کرنا جائز نہیں، اور زیارت کی مشکل ایسی ضرورت نہیں جو قبر کشائی کو جائز کرے، کیونکہ میت کے لیے دور سے دعا کی جا سکتی ہے اور وقفے وقفے سے زیارت ہو سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ میت کی حرمت اور عزت ہے، اور [[passage/quran-17-70|سورۃ الاسراء 17:70]] کا حوالہ دیا، اور کہا کہ جب تک قبروں میں مردوں کی ہڈیاں ہوں انہیں کھولنا یا ہٹانا جائز نہیں؛ اور ہڈیاں سینکڑوں سال بعد ہی گلتی ہیں، جیسا کہ ملک میں مشاہدہ ہے۔ اس نے اس بات پر کہ مردوں کی حرمت زندوں جیسی ہے، ابو داود کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ میت کی ہڈی توڑنا زندگی میں توڑنے جیسا ہے، اور مسلم کی روایت کردہ حدیث سے جس کا مفہوم ہے کہ ایسے انگارے پر بیٹھنا جو کپڑے جلا کر جلد تک پہنچ جائے قبر پر بیٹھنے سے بہتر ہے؛ اور میت کی عزت میں یہ بھی ہے کہ اس کی قبر نہ کھولی جائے اور اس کی حرمت پامال نہ ہو۔ اس نے کہا کہ جس جگہ میت دفن ہو وہ اس کے لیے وقف شمار ہوتی ہے، اور عام قبرستان میں دفن بہتر ہے تاکہ دعا اور زیارت کرنے والے زیادہ ہوں؛ چونکہ اسے نجی قبرستان میں دفن کیا گیا ہے، اس لیے اسے زیارت اور دعا کی خاطر گھر والوں کے قریب منتقل کرنے کی کوئی حاجت یا ضرورت نہیں، کیونکہ دعا دور سے ہو سکتی ہے اور مشکل ہو تو زیارت وقفے وقفے سے ہو سکتی ہے۔ اس نے نتیجہ نکالا کہ میت کی باقیات مکمل گل جانے سے پہلے قبر کھولنا جائز نہیں۔"
  es: "Una pregunta sobre el traslado de los restos de una persona fallecida a un cementerio familiar, en la que el Departamento General de Iftaa de Jordania respondió que una tumba no puede abrirse ni trasladarse los restos mientras los huesos del difunto permanezcan en ella, y que la dificultad de la visita no es una necesidad que permita la exhumación, ya que uno puede orar por el difunto desde lejos y visitarlo a intervalos más largos. El Departamento respondió que el difunto tiene santidad y dignidad, citando [[passage/quran-17-70|Surat al-Isra' 17:70]], y que las tumbas no pueden abrirse ni removerse mientras los huesos del difunto permanezcan en ellas; los huesos se descomponen solo después de cientos de años, como se observa en el país. Citó, como evidencia de que los muertos tienen la misma santidad que los vivos, un hadiz narrado por Abu Dawud cuyo significado es que romper un hueso de una persona muerta es como romperlo estando viva, y un hadiz narrado por Muslim cuyo significado es que sentarse en una brasa que quema a través de la ropa hasta la piel es mejor que sentarse en una tumba; Parte de la dignidad del difunto reside en que su tumba no sea abierta ni se viole su santidad. Se afirmó que el lugar de sepultura constituye un don para el difunto, y que el entierro en un cementerio público es preferible para que más personas puedan orar y visitarlo; dado que fue enterrado en un cementerio privado, no hay necesidad de trasladarlo cerca de su familia para que puedan visitarlo y orar por él, ya que la oración puede realizarse a distancia y las visitas pueden espaciarse si resulta difícil. Se concluyó que la tumba no puede abrirse a menos que los restos se hayan descompuesto por completo."
  fr: "Concernant la question du transfert de la dépouille d'une personne décédée dans un cimetière familial, le Département général de la Fatima de Jordanie a répondu qu'il est interdit d'ouvrir une tombe et de déplacer la dépouille tant que les ossements du défunt s'y trouvent. Le Département a également précisé que l'impossibilité de se rendre sur la tombe ne constitue pas un motif valable d'exhumation, puisqu'il est possible de prier pour le défunt à distance et de lui rendre visite à intervalles plus espacés. Il a rappelé que le défunt possède un caractère sacré et digne, citant le verset 70 de la sourate Al-Isra (17:70 du Coran), et a conclu que les tombes ne peuvent être ouvertes ni profanées tant que les ossements du défunt s'y trouvent. La décomposition des ossements n'intervient qu'après des centaines d'années, comme cela a été constaté dans le pays. Le texte cite, comme preuve que les morts ont la même sacralité que les vivants, un hadith rapporté par Abou Dawoud selon lequel briser un os d'un mort équivaut à le briser de son vivant, et un hadith rapporté par Muslim selon lequel s'asseoir sur une braise brûlante jusqu'à la peau est préférable à s'asseoir sur une tombe. Il souligne que la dignité du défunt implique que sa tombe ne soit pas ouverte et que sa sacralité ne soit pas profanée. Il précise que le lieu de sépulture est considéré comme une dot pour le défunt, et qu'une inhumation dans un cimetière public est préférable car elle permet à un plus grand nombre de personnes de prier et de se recueillir sur la tombe. Étant donné que le défunt est enterré dans un cimetière privé, il n'est ni nécessaire ni requis de le déplacer près de sa famille pour qu'elle puisse se recueillir et prier pour lui, car la prière peut être faite à distance, et les visites peuvent être espacées si nécessaire. Il conclut que la tombe ne peut être ouverte qu'après décomposition complète du corps."
  tr: "Ölenin kalıntılarının aile mezarlığına nakliyle ilgili bir soruya, Ürdün Genel Fetva Dairesi tarafından yanıtlandı; kemikler mezarda olduğu sürece mezarın çıkarılması veya nakledilmesi mümkün değildir ve ziyaret etmenin zorluğunun, mezarın çıkarılması için zorunlu olmadığını, çünkü merhum için uzaktan dua edilip aralıklarla ziyaret edilebileceğini belirtti. Daire, ölenin kutsal ve onurlu olduğunu belirterek, [[pasaj/kuran-17-70|Surah El-İsra 17:70]'i alıntıladı ve ölülerin mezarlarının kemikleri içinde olduğu sürece çıkarılmasının veya çıkarılmasının yasak olduğunu, ülkede gözlemlendiği gibi yüzlerce yıl sonra bozulduğunu belirtti. Bu hadis, Ebu Davud'un rivayet ettiği bir hadise dayanıyordu; ölü bir kemiği kırmak onu canlı kırmak gibidir ve Müslüman'ın rivayet ettiği bir hadis, yanan bir köz üzerinde oturmanın mezarın üstünde oturmaktan daha iyidir diye anlatılmıştır. Ölenin mezarını çıkarmamanın veya kutsallığının ihlal edilmemesinin onuruna uygun olduğunu belirtmiştir. Ölen kişinin gömülüldüğü yerin vakf (vakf) olarak kabul edildiğini ve çok sayıda ziyaretçi ve vaizi çekmek için kamu mezarlığında gömülmenin tercih edildiğini belirtmiştir. Özel bir mezarlıkta gömüldüğü sürece, onu ziyaret etmek ve dua etmek için ailesine daha yakın bir yere taşımaya gerek yoktur. Dua uzaktan yapılabilir ve gecikmeli ziyaretler aralıklarla yapılabilir. Mezar çıkarmanın, ancak ölen kişinin kalıntıları gömüldükten sonra izin verilemeyeceğini belirtti."
  id: "Pertanyaan tentang pemindahan jenazah almarhum ke pemakaman keluarga dijawab oleh Departemen Fatwa Jenderal Yordania bahwa tidak diperbolehkan menggali kembali makam atau memindahkan sisa-sisa selama tulang masih ada, dan bahwa kesulitan berkunjung bukanlah keharusan untuk mengizinkan penggalian, karena mungkin untuk berdoa untuk almarhum dari jarak jauh dan mengunjungi mereka secara berkala. Departemen menjawab bahwa almarhum memiliki kesucian dan martabat, mengutip [[ayat/al-quran-17-70|Surah Al-Isra 17:70], dan menyatakan bahwa tidak diperbolehkan menggali atau mengambil makam orang mati selama tulang mereka masih ada di dalamnya, dan tulang orang yang meninggal hanya akan memburuk setelah ratusan tahun, seperti yang diamati di negara ini. Hadits yang diceritakan oleh Abu Dawood bahwa mematahkan tulang mati itu seperti mematahkannya hidup-hidup, dan hadits yang diceritakan oleh Muslim bahwa seseorang yang duduk di bara api lebih baik baginya daripada duduk di atas makam. Dia mengatakan bahwa demi martabat almarhum, tidak menggali makamnya atau melanggar kesuciannya. Dia mengatakan bahwa tempat almarhum dimakamkan dianggap waqf (waqf), dan lebih baik dimakamkan di pemakaman umum untuk menarik banyak pengunjung dan penceramah. Selama dia dimakamkan di pemakaman pribadi, tidak perlu atau perlu memindahkannya lebih dekat ke keluarganya untuk mengunjungi dan mendoakan dia. Doa dapat dilakukan dari jarak jauh, dan kunjungan dapat dilakukan secara berkala jika tertunda. Dia menyimpulkan bahwa menggali makam tidak diperbolehkan kecuali setelah jenazah almarhum dimakamkan."
