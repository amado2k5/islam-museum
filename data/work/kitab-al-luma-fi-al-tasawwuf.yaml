label: { ar: "كتاب اللمع في التصوف", en: "Kitab al-Luma' fi al-Tasawwuf", ur: "کتاب اللمع فی التصوف" }
summary:
  ar: "كتاب أبي نصر عبد الله بن علي السراج الطوسي (ت 378هـ) في أصول مذهب الصوفية، كتبه جواباً لسائل ليبيّن أن التصوف منوط بمتابعة الكتاب والسنة والاقتداء بالصحابة، فبدأ بأصناف «أولي العلم» الثلاثة: أصحاب الحديث والفقهاء والصوفية، ثم الأحوال والمقامات والفهم والاقتداء والآداب والسماع والوجد والكرامات والمصطلحات وتفسير الشطحيات، وختم بأبواب في غلط من غلط من المنتسبين إلى التصوف {cite:luma-sarraj-jadir-dar-al-fath p. 7} {cite:luma-sarraj-jadir-dar-al-fath p. 8} {cite:luma-sarraj-nicholson-1914 p. 491} {cite:luma-sarraj-nicholson-1914 p. 493}."
  en: "The book of Abu Nasr 'Abd Allah ibn 'Ali al-Sarraj al-Tusi (d. 378 AH) on the principles of the Sufis' way, written in answer to a questioner to show that Sufism is bound to following the Qur'an and Sunna and imitating the Companions; it begins with the three classes of 'people of knowledge' — traditionists, jurists and Sufis — then treats states and stations, understanding, imitation of the Prophet, rules of conduct, audition, ecstasy, miracles, technical terms and the interpretation of ecstatic sayings, and ends with chapters on the errors of some who claimed Sufism {cite:luma-sarraj-jadir-dar-al-fath p. 7} {cite:luma-sarraj-jadir-dar-al-fath p. 8} {cite:luma-sarraj-nicholson-1914 p. 491} {cite:luma-sarraj-nicholson-1914 p. 493}."
  ur: "ابو نصر عبد اللہ بن علی سراج طوسی (م 378ھ) کی صوفیہ کے مسلک کے اصولوں پر کتاب، جو ایک سائل کے جواب میں لکھی گئی تاکہ واضح ہو کہ تصوف کتاب و سنت کی پیروی اور صحابہ کی اقتدا سے وابستہ ہے؛ یہ «اولو العلم» کی تین قسموں — محدثین، فقہا اور صوفیہ — سے شروع ہو کر احوال و مقامات، فہم، اقتدا، آداب، سماع، وجد، کرامات، اصطلاحات اور شطحیات کی تفسیر تک جاتی ہے، اور تصوف کے بعض دعوے داروں کی غلطیوں کے ابواب پر ختم ہوتی ہے {cite:luma-sarraj-jadir-dar-al-fath p. 7} {cite:luma-sarraj-jadir-dar-al-fath p. 8} {cite:luma-sarraj-nicholson-1914 p. 491} {cite:luma-sarraj-nicholson-1914 p. 493}۔"
