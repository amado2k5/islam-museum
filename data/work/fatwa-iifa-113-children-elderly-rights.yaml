label: { ar: "قرار مجمع الفقه الإسلامي الدولي 113 (12/7) بشأن حقوق الأطفال والمسنين", en: "IIFA resolution 113 (12/7) on the rights of children and the elderly", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 113 (12/7): بچوں اور بزرگوں کے حقوق", es: "Resolución 113 (12/7) de la IIFA sobre los derechos de los niños y las personas mayores.", fr: "Résolution 113 (12/7) de l'IIFA relative aux droits des enfants et des personnes âgées", tr: "Uluslararası İslami Fiqh Akademisi Çocukların ve Yaşlıların Haklarına İlişkin 113 (12/7) sayılı Kararı", id: "Resolusi Akademi Fiqh Islam Internasional 113 (12/7) mengenai Hak Anak dan Lansia" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، مستندًا إلى بحوث الموضوع وتوصيات الندوة الطبية الفقهية بالكويت ⁦(رجب 1420هـ/أكتوبر 1999م، بالتعاون مع المنظمة الإسلامية للعلوم الطبية)⁩ بخصوص حقوق المسنين. نص على أن الطفولة الكريمة أساس المجتمع السوي وأن الإسلام أعطاها اهتمامًا بالغًا، وقرر في حقوق الأطفال: حماية الجنين في رحم أمه من المؤثرات الضارة به أو بها ⁦(كالمسكرات والمخدرات)⁩ واجب، وما يتبعها من حقوق النشأة والرعاية والتربية. وتناول حقوق المسنين ورعايتهم في ضوء توصيات الندوة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), drawing on the research and the recommendations of the joint medical-fiqh seminar in Kuwait (Rajab 1420 / October 1999, with the Islamic Organisation for Medical Sciences) on the rights of the elderly. It stated that a wholesome childhood is the basis of a sound society and that Islam gave it great care, ruling for children's rights that protecting the foetus in the mother's womb from harmful influences on it or her (such as intoxicants and drugs) is a duty, with the rights of upbringing, care and education that follow; and it addressed the elderly's rights and care in the light of the seminar's recommendations."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، اس موضوع کی تحقیق اور کویت میں ہونے والی طبی-فقہی سمینار ⁦(رجب 1420ھ/اکتوبر 1999ء، اسلامی آرگنائزیشن برائے طبی علوم کے تعاون سے)⁩ کی بزرگوں کے حقوق پر سفارشات کی اساس پر۔ نص: صحتمند معاشرے کی بنیاد معزز پرورش ہے اور اسلام نے اسے بڑی اہمیت دی؛ بچوں کے حقوق میں فیصلہ: ماں کے رحم میں جنین کی حفاظت اس پر یا ماں پر نقصان دار اثرات ⁦(جیسے نشہ آور اشیا اور منشیات)⁩ سے فرض ہے، اور پھر پرورش، دیکھ بھال اور تربیت کے حقوق؛ اور بزرگوں کے حقوق و دیکھ بھال سمینار کی سفارشات کی روشنی میں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 12.ª sesión en Riad (25 de Jumada II – 1 de Rajab de 1421, 23-28 de septiembre de 2000), basada en la investigación y las recomendaciones del seminario conjunto médico-fiqh celebrado en Kuwait (Rajab de 1420 / octubre de 1999, con la Organización Islámica para las Ciencias Médicas) sobre los derechos de las personas mayores. En ella se afirma que una infancia sana es la base de una sociedad sana y que el Islam le presta gran atención, estableciendo en cuanto a los derechos de los niños que proteger al feto en el vientre materno de influencias nocivas (como sustancias tóxicas y drogas) es un deber, con los derechos de crianza, cuidado y educación que se derivan de ello; y se abordan los derechos y el cuidado de las personas mayores a la luz de las recomendaciones del seminario."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 12e session à Riyad (25 Jumada II – 1er Rajab 1421, 23-28 septembre 2000), s'appuyant sur les recherches et les recommandations du séminaire médico-jurisprudentiel conjoint du Koweït (Rajab 1420 / octobre 1999, organisé conjointement avec l'Organisation islamique des sciences médicales) sur les droits des personnes âgées. Cette résolution affirme qu'une enfance saine est le fondement d'une société équilibrée et que l'islam y accorde une grande importance. Elle statue sur les droits de l'enfant, notamment la protection du fœtus dans le ventre de sa mère contre toute influence néfaste (telle que les substances intoxicantes et les drogues), assortie des droits à l'éducation, aux soins et à l'instruction. Elle aborde également les droits et la prise en charge des personnes âgées à la lumière des recommandations du séminaire."
  tr: "Uluslararası İslami Fiqh Akademisi'nin on ikinci oturumunda (25 Cumedül-Ahirah – 1 Rajab 1421 H, 23–28 Eylül 2000) Kuveyt'teki tıbbi hukuk sempozyumunun (Recep 1420 Hicri / Ekim 1999, İslami Tıp Bilimleri Örgütü ile iş birliği) yaşlıların haklarına ilişkin araştırma ve önerilere dayanan toplu karar. Onurlu bir çocukluğun sağlıklı bir toplumun temeli olduğunu ve İslam'ın buna büyük önem verdiğini belirtmiş, çocuk hakları konusunda karar vermiştir: Annesinin rahmindeki fetüsün zararlı maddelerden (sarhoş edici maddeler ve uyuşturucular gibi) korunması, yetiştirilme, bakım ve yetiştirilme haklarıyla birlikte zorunludur. Sempozyumun önerileri ışığında yaşlıların hak ve bakımı ele alınmıştır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional pada sesi kedua belas di Riyadh (25 Jumada al-Akhirah – 1 Rajab 1421 H, 23–28 September 2000 M), berdasarkan penelitian dan rekomendasi simposium yurisprudensi medis di Kuwait (Rajab 1420 AH / Oktober 1999 M, bekerja sama dengan Organisasi Islam untuk Ilmu Kedokteran) mengenai hak-hak lansia. Simposium menetapkan bahwa masa kanak-kanak yang bermartabat adalah dasar masyarakat yang sehat dan Islam telah memberikan perhatian besar padanya, serta memutuskan mengenai hak-hak anak: Melindungi janin dalam kandungan ibunya dari zat berbahaya (seperti zat memabukkan dan narkoba) adalah kewajiban, bersama dengan hak-hak terkait dalam pendidikan, perawatan, dan pengasuhan. Simposium membahas hak dan perawatan lansia berdasarkan rekomendasi simposium."
