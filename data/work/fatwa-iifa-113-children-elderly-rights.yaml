id: work/fatwa-iifa-113-children-elderly-rights
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 113 (12/7) بشأن حقوق الأطفال والمسنين", en: "IIFA resolution 113 (12/7) on the rights of children and the elderly", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 113 (12/7): بچوں اور بزرگوں کے حقوق" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية عشرة بالرياض ⁦(25 جمادى الآخرة – 1 رجب 1421هـ، 23–28 سبتمبر 2000م)⁩، مستندًا إلى بحوث الموضوع وتوصيات الندوة الطبية الفقهية بالكويت ⁦(رجب 1420هـ/أكتوبر 1999م، بالتعاون مع المنظمة الإسلامية للعلوم الطبية)⁩ بخصوص حقوق المسنين. نص على أن الطفولة الكريمة أساس المجتمع السوي وأن الإسلام أعطاها اهتمامًا بالغًا، وقرر في حقوق الأطفال: حماية الجنين في رحم أمه من المؤثرات الضارة به أو بها ⁦(كالمسكرات والمخدرات)⁩ واجب، وما يتبعها من حقوق النشأة والرعاية والتربية. وتناول حقوق المسنين ورعايتهم في ضوء توصيات الندوة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 12th session in Riyadh (25 Jumada II – 1 Rajab 1421, 23–28 September 2000), drawing on the research and the recommendations of the joint medical-fiqh seminar in Kuwait (Rajab 1420 / October 1999, with the Islamic Organisation for Medical Sciences) on the rights of the elderly. It stated that a wholesome childhood is the basis of a sound society and that Islam gave it great care, ruling for children's rights that protecting the foetus in the mother's womb from harmful influences on it or her (such as intoxicants and drugs) is a duty, with the rights of upbringing, care and education that follow; and it addressed the elderly's rights and care in the light of the seminar's recommendations."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں بارہویں مجلس ⁦(25 جمادی الثانی – 1 رجب 1421ھ، 23–28 ستمبر 2000ء)⁩ میں، اس موضوع کی تحقیق اور کویت میں ہونے والی طبی-فقہی سمینار ⁦(رجب 1420ھ/اکتوبر 1999ء، اسلامی آرگنائزیشن برائے طبی علوم کے تعاون سے)⁩ کی بزرگوں کے حقوق پر سفارشات کی اساس پر۔ نص: صحتمند معاشرے کی بنیاد معزز پرورش ہے اور اسلام نے اسے بڑی اہمیت دی؛ بچوں کے حقوق میں فیصلہ: ماں کے رحم میں جنین کی حفاظت اس پر یا ماں پر نقصان دار اثرات ⁦(جیسے نشہ آور اشیا اور منشیات)⁩ سے فرض ہے، اور پھر پرورش، دیکھ بھال اور تربیت کے حقوق؛ اور بزرگوں کے حقوق و دیکھ بھال سمینار کی سفارشات کی روشنی میں۔"
