id: work/fatwa-amja-rigor-vs-scrupulosity
class: work
kind: fatwa
label: { ar: "المتشدد والمتقي للشبهات", en: "The over-strict and the wary of doubts", ur: "تشدد اور احتیاط کا فرق" }
summary:
  ar: "سأل سائل عن الفرق بين المتشدد والمتقي للشبهات فالمتشدد مذموم بحديث لن يشاد الدين أحد إلا غلبه والمتقي للشبهات محمود بحديث. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21843 بتاريخ 20 يوليو 2006)⁩ أن المتشدد هو الذي يتوهم شبهًا لا وجه لها فيتورع في غير موضع التورع أما من يتقي الشبهات فهو الذي يتقي الشبهة التي لوجودها وجه معتبر ولافتراضها احتمال متوجه فيحمد على ذلك."
  en: "A questioner asked the difference between the over-strict — blameworthy per 'none makes the religion hard but it overcomes him' — and the wary of ambiguities, praised in the hadith. Dr. Salah al-Sawi (fatwa no. 21843, 20 July 2006) answered that the over-strict is one who imagines ambiguities with no ground and scruples where no scruple belongs, while the wary of ambiguities guards against a doubt whose existence has real standing and whose supposition has a sound possibility — earning praise for it."
  ur: "ایک سائل نے تشدد اور تتقی الشبہات کا فرق پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21843، 20 جولائی 2006)⁩ کے مطابق متشدد بے بنیاد شبہات سے بچتا ہے؛ محمود وہ ہے جو حقیقی شبہ سے بچے۔"
