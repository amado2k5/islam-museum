label: { ar: "الرحيق المختوم", en: "Ar-Raheeq Al-Makhtum (The Sealed Nectar)", ur: "الرحیق المختوم", es: "Ar-Raheeq Al-Makhtum (El néctar sellado)", fr: "Ar-Raheeq Al-Makhtum (Le nectar scellé)", tr: "Mühürlü nektar", id: "Nektar tersegel" }
summary:
  ar: "بحث في السيرة النبوية لصفي الرحمن المباركفوري، فاز بالمركز الأول من بين 171 بحثا في مسابقة رابطة العالم الإسلامي للسيرة، التي أُعلنت نتائجها في شعبان 1398هـ وسُلّمت جوائزها في مكة سنة 1399هـ (1979)؛ يبدأ بأحوال العرب قبل الإسلام ويسير مع السيرة على ترتيب الزمن حتى الوفاة، وتُرجم إلى الإنجليزية باسم The Sealed Nectar وإلى لغات أخرى."
  en: "A study of the Prophet's biography by Safiur Rahman Mubarakpuri that took first place among 171 entries in the Muslim World League's sira competition, whose results were announced in Shaban 1398 AH and whose prizes were handed over in Mecca in 1399 AH (1979); it opens with Arabia before Islam and follows the life in chronological order to the Prophet's death, and was translated into English as The Sealed Nectar and into other languages."
  ur: "صفی الرحمٰن مبارکپوری کی سیرتِ نبوی پر تحقیق جو رابطہ عالم اسلامی کے سیرت مقابلے میں 171 مقالات میں اول آئی؛ نتائج شعبان 1398ھ میں آئے اور انعامات 1399ھ (1979) میں مکہ میں دیے گئے۔ یہ عرب کے قبل از اسلام حالات سے شروع ہو کر وفات تک زمانی ترتیب سے سیرت بیان کرتی ہے، اور انگریزی میں The Sealed Nectar کے نام سے اور دیگر زبانوں میں ترجمہ ہوئی۔"
  es: "Un estudio de la biografía del Profeta realizado por Safiur Rahman Mubarakpuri que obtuvo el primer lugar entre 171 participantes en el concurso de biografías de la Liga Mundial Musulmana, cuyos resultados se anunciaron en Shaban 1398 AH y cuyos premios se entregaron en La Meca en 1399 AH (1979); comienza con Arabia antes del Islam y sigue la vida en orden cronológico hasta la muerte del Profeta, y fue traducido al inglés como The Sealed Nectar y a otros idiomas."
  fr: "Une étude de la biographie du Prophète par Safiur Rahman Mubarakpuri qui a remporté la première place parmi 171 candidatures au concours de sira de la Ligue musulmane mondiale, dont les résultats ont été annoncés en Shaban 1398 AH et dont les prix ont été remis à La Mecque en 1399 AH (1979); elle s'ouvre sur l'Arabie avant l'Islam et suit la vie dans l'ordre chronologique jusqu'à la mort du Prophète, et a été traduite en anglais sous le titre The Sealed Nectar et dans d'autres langues."
  tr: "Safi el-Rahman el-Mübarekfuri'nin Peygamberlik biyografisi üzerine bir araştırma makalesi; İslam Dünya Ligi Biyografi yarışmasında 171 makale arasında birincilik kazanmış, sonuçları Şa'ban 1398 Hicri'de açıklanmış ve ödülleri 1399 Hicri (1979 H) yılında Mekke'de takdim edilmiştir. Kitap, İslam öncesi Arapların koşullarıyla başlar ve biyografiyi kronolojik sırayla ölümüne kadar takip eder. İngilizceye The Sealed Nectar (Mühürlü Nektar) olarak ve diğer dillere çevrilmiştir."
  id: "Makalah penelitian tentang biografi Nabi oleh Safi al-Rahman al-Mubarakfuri, yang memenangkan juara pertama dari 171 makalah dalam kompetisi Biografi Liga Dunia Islam, hasilnya diumumkan dalam Sha'ban 1398 H dan penghargaannya diberikan di Mekah pada 1399 H (1979 H). Makalah ini dimulai dengan kondisi orang Arab sebelum Islam dan mengikuti biografi secara kronologis hingga kematian. Makalah ini diterjemahkan ke dalam bahasa Inggris sebagai The Sealed Nectar dan ke dalam bahasa lain."
