summary:
  ar: "بحث في السيرة النبوية لصفي الرحمن المباركفوري، فاز بالمركز الأول من بين 171 بحثا في مسابقة رابطة العالم الإسلامي للسيرة، التي أُعلنت نتائجها في شعبان 1398هـ وسُلّمت جوائزها في مكة سنة 1399هـ (1979)؛ يبدأ بأحوال العرب قبل الإسلام ويسير مع السيرة على ترتيب الزمن حتى الوفاة، وتُرجم إلى الإنجليزية باسم The Sealed Nectar وإلى لغات أخرى."
  en: "A study of the Prophet's biography by Safiur Rahman Mubarakpuri that took first place among 171 entries in the Muslim World League's sira competition, whose results were announced in Shaban 1398 AH and whose prizes were handed over in Mecca in 1399 AH (1979); it opens with Arabia before Islam and follows the life in chronological order to the Prophet's death, and was translated into English as The Sealed Nectar and into other languages."
  ur: "صفی الرحمٰن مبارکپوری کی سیرتِ نبوی پر تحقیق جو رابطہ عالم اسلامی کے سیرت مقابلے میں 171 مقالات میں اول آئی؛ نتائج شعبان 1398ھ میں آئے اور انعامات 1399ھ (1979) میں مکہ میں دیے گئے۔ یہ عرب کے قبل از اسلام حالات سے شروع ہو کر وفات تک زمانی ترتیب سے سیرت بیان کرتی ہے، اور انگریزی میں The Sealed Nectar کے نام سے اور دیگر زبانوں میں ترجمہ ہوئی۔"
