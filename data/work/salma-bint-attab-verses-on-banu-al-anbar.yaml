class: work
kind: poem
label: { ar: "بيتا سلمى بنت عتاب في يوم بني العنبر", en: "Salma bint Attab's two verses on the day of Banu al-Anbar", es: "Los dos versos de Salma bint Attab en el día de Banu al-Anbar.", fr: "Deux versets de Salma bint Attab sur le jour de Banu al-Anbar", ur: "بنو الانبار کے دن سلمہ بنت عتب کی دو آیتیں۔", tr: "Beta Salma bint Attab, Beni El-Anbar gününde", id: "Beta Salma bint Attab pada hari Bani Al-Anbar" }
summary:
  ar: "بيتان على الطويل قالتهما سلمى بنت عتاب يوم أغار عيينة بن حصن على بني العنبر: أن عدي بن جندب لقي من الشر مهواة شديدة الكؤود، وأن الأعداء تكنّفوها من كل جانب وغاب عنها عزها وجدودها."
  en: "Two verses by Salma bint Attab on the day Uyayna ibn Hisn raided Banu al-Anbar: that Adi ibn Jundab met a steep and evil chasm, with enemies closing in from every side while its might and good fortune were absent."
  es: "Dos versos de Salma bint Attab sobre el día en que Uyayna ibn Hisn asaltó Banu al-Anbar: que Adi ibn Jundab se encontró con un abismo profundo y peligroso, con enemigos que se acercaban por todos lados mientras su poder y buena fortuna estaban ausentes."
  fr: "Deux vers de Salma bint Attab sur le jour où Uyayna ibn Hisn a attaqué Banu al-Anbar: qu'Adi ibn Jundab a rencontré un gouffre profond et maléfique, avec des ennemis se rapprochant de tous côtés alors que sa puissance et sa bonne fortune étaient absentes."
  ur: "سلمیٰ بنت عتاب کی دو آیتیں جس دن عیینہ بن حسن نے بنو الانبار پر چڑھائی کی تھی: کہ عدی بن جندب ایک سخت اور بری کھائی سے جا ملا جس میں ہر طرف سے دشمن گھس رہے تھے جبکہ اس کی طاقت اور خوش قسمتی غائب تھی۔"
  tr: "Uyaynah ibn Hisn'in Banu Al-Anbar'a baskın yaptığı gün Salma bint 'Atab tarafından El-Tavil hakkında iki beyt okundu: 'Adi ibn Jundub, kötülükten çok sert ve sefil bir şehre karşı karşıya kaldı ve düşmanlar her yönden kuşattı, onuru ve büyükbabaları yoktu."
  id: "Dua bait tentang Al-Tawil dibacakan oleh Salma bint 'Atab pada hari Uyaynah ibn Hisn menyerang Banu Al-Anbar: bahwa 'Adi ibn Jundub menghadapi kota yang sangat keras dan sengsara dari kejahatan, dan bahwa musuh-musuh mengelilinginya dari segala arah, serta kehormatan dan kakeknya tidak ada."
