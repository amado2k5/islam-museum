label: { ar: "أضواء البيان في إيضاح القرآن بالقرآن", en: "Adwa' al-Bayan", ur: "اضواء البیان فی ایضاح القرآن بالقرآن" }
summary:
  ar: "تفسير محمد الأمين بن محمد المختار الجكني الشنقيطي ⁦(1325–1393هـ)⁩، أكبر كتبه وأعظمها، يقوم على بيان القرآن بالقرآن، ويتوسع في المسائل الفقهية وفي تقرير عقيدة أهل السنة في الصفات؛ بلغ فيه سورة المجادلة، وأتمه تلميذه عطية سالم في المجلدين الثامن والتاسع من المطبوع."
  en: "The commentary of Muhammad al-Amin ibn Muhammad al-Mukhtar al-Jakani al-Shinqiti (1325–1393 AH), the largest and greatest of his books, built on explaining the Qur'an by the Qur'an and expanding on legal questions and on the Sunni creed concerning the attributes; he reached Surat al-Mujadila, and his student Atiyya Salim completed it in volumes 8 and 9 of the printing."
  ur: "محمد الامین بن محمد المختار الجکنی الشنقیطی (1325–1393ھ) کی تفسیر، ان کی سب سے بڑی اور عظیم کتاب، جو قرآن کی قرآن سے وضاحت پر قائم ہے، اور فقہی مسائل اور صفات میں اہلِ سنت کے عقیدے کی تقریر میں تفصیل کرتی ہے؛ وہ سورۂ مجادلہ تک پہنچے، اور ان کے شاگرد عطیہ سالم نے مطبوعہ کی آٹھویں اور نویں جلد میں اسے مکمل کیا۔"
