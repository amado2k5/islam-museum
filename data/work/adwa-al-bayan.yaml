label: { ar: "أضواء البيان في إيضاح القرآن بالقرآن", en: "Adwa' al-Bayan", ur: "اضواء البیان فی ایضاح القرآن بالقرآن", es: "Adwa' al-Bayan", fr: "Adwa' al-Bayan", tr: "Adwa' al-Bayan fi Idhah al-Qur'an bi al-Qur'an", id: "Adwa' al-Bayan fi Idhah al-Qur'an bi al-Qur'an" }
summary:
  ar: "تفسير محمد الأمين بن محمد المختار الجكني الشنقيطي ⁦(1325–1393هـ)⁩، أكبر كتبه وأعظمها، يقوم على بيان القرآن بالقرآن، ويتوسع في المسائل الفقهية وفي تقرير عقيدة أهل السنة في الصفات؛ بلغ فيه سورة المجادلة، وأتمه تلميذه عطية سالم في المجلدين الثامن والتاسع من المطبوع."
  en: "The commentary of Muhammad al-Amin ibn Muhammad al-Mukhtar al-Jakani al-Shinqiti (1325–1393 AH), the largest and greatest of his books, built on explaining the Qur'an by the Qur'an and expanding on legal questions and on the Sunni creed concerning the attributes; he reached Surat al-Mujadila, and his student Atiyya Salim completed it in volumes 8 and 9 of the printing."
  ur: "محمد الامین بن محمد المختار الجکنی الشنقیطی ⁦(1325–1393ھ)⁩ کی تفسیر، ان کی سب سے بڑی اور عظیم کتاب، جو قرآن کی قرآن سے وضاحت پر قائم ہے، اور فقہی مسائل اور صفات میں اہلِ سنت کے عقیدے کی تقریر میں تفصیل کرتی ہے؛ وہ سورۂ مجادلہ تک پہنچے، اور ان کے شاگرد عطیہ سالم نے مطبوعہ کی آٹھویں اور نویں جلد میں اسے مکمل کیا۔"
  es: "El comentario de Muhammad al-Amin ibn Muhammad al-Mukhtar al-Jakani al-Shinqiti (1325–1393 AH), el más extenso y grandioso de sus libros, se basaba en explicar el Corán mediante el propio Corán y en profundizar en cuestiones legales y en el credo sunita respecto a los atributos; llegó hasta la Sura al-Mujadila, y su discípulo Atiyya Salim la completó en los volúmenes 8 y 9 de la edición impresa."
  fr: "Le commentaire de Muhammad al-Amin ibn Muhammad al-Mukhtar al-Jakani al-Shinqiti (1325–1393 AH), le plus long et le plus important de ses livres, s'appuie sur l'explication du Coran par le Coran et développe les questions juridiques et la croyance sunnite concernant les attributs; il atteint la sourate al-Mujadila, et son élève Atiyya Salim la complète dans les volumes 8 et 9 de l'impression."
  tr: "Muhammed el-Emin bin Muhammed el-Muhtar el-Jakni el-Şenketi'nin (1325–1393 H) en büyük ve en büyük kitabı olan Tafsiri, Kur'an'ı Kur'an ile açıklamaya, fıkhi konuları genişletmeye ve Ehl-sünnet'in vakatlarıyla ilgili inancını kurmaya dayanır; Mücedila Suresi'ne ulaşmış ve öğrencisi Atiyah Salem basılı baskının sekizinci ve dokuzuncu ciltlerinde tamamlamıştır."
  id: "Tafsir Muhammad al-Amin ibn Muhammad al-Mukhtar al-Jakni al-Shanqeeti (1325–1393 H), buku terbesar dan terbesarnya, didasarkan pada penjelasan Al-Qur'an melalui Al-Qur'an, memperluas isu-isu firisprudensi, dan menetapkan kredo Ahl al-Sunnah mengenai sifat-sifat; ia sampai ke Surah Al-Mujadila, dan muridnya Atiyah Salem menyelesaikannya dalam jilid delapan dan sembilan edisi cetak."
