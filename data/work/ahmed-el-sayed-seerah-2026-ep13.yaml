label:
  ar: "سيرة رسول الله 2026، الحلقة 13: سيرة رسول الله 13 | المفاوضات الأولى لوأد الدعوة النبوية"
  en: "The Biography of the Messenger of God 2026, episode 13: The first negotiations to smother the Prophetic call"
  ur: "سیرتِ رسول اللہ 2026، قسط 13: نبوی دعوت کو دبانے کے لیے پہلے مذاکرات"
  fr: "La biographie du Messager de Dieu 2026, épisode 13 : Les premières négociations pour étouffer l'appel prophétique"
  es: "La biografía del Mensajero de Dios 2026, episodio 13: Las primeras negociaciones para sofocar la llamada profética"
summary:
  ar: "يفتتح المحاضر فقرة دورية جديدة عن البدريين، ويبدأ بأبي سبرة بن أبي رهم، ثم يواصل رواية ابن إسحاق عن وفود قريش إلى أبي طالب، وعرضهم مبادلة عمارة بن الوليد بالنبي، وجمع أبي طالب لبني هاشم وبني المطلب. ويضيف تعليقات على زعماء قريش، وعلى سبب ذكر أبي لهب وحده في القرآن، وعلى ملاحظات السهيلي اللغوية."
  en: "The lecturer opens a new recurring segment on the Badr veterans, starting with Abu Sabra ibn Abi Ruhm, then continues Ibn Ishaq's account of the Quraysh delegations to Abu Talib, the offer to exchange Umara ibn al-Walid for the Prophet, and Abu Talib's rallying of Banu Hashim and Banu al-Muttalib. He adds commentary on the Quraysh leaders, on why only Abu Lahab is named in the Qur'an, and on al-Suhayli's linguistic notes."
  ur: "مقرر بدریوں پر ایک نیا باقاعدہ سلسلہ شروع کرتے ہیں، جس کا آغاز ابو سبرہ بن ابی رہم سے ہوتا ہے۔ پھر وہ ابن اسحاق کی روایت جاری رکھتے ہیں کہ قریش کے وفد ابو طالب کے پاس آئے، عمارہ بن الولید کو نبی کے بدلے میں دینے کی پیشکش ہوئی، اور ابو طالب نے بنو ہاشم اور بنو المطلب کو جمع کیا۔ وہ قریش کے سرداروں پر، اس پر کہ قرآن میں صرف ابو لہب کا نام آیا ہے، اور سہیلی کے لغوی نکات پر بھی تبصرہ کرتے ہیں۔"
  fr: "Le conférencier ouvre une nouvelle rubrique régulière consacrée aux vétérans de Badr, en commençant par Abu Sabra ibn Abi Ruhm, puis poursuit le récit d'Ibn Ishaq sur les délégations de Quraysh auprès d'Abu Talib, l'offre d'échanger Umara ibn al-Walid contre le Prophète et le rassemblement par Abu Talib des Banu Hashim et des Banu al-Muttalib. Il ajoute des commentaires sur les chefs de Quraysh, sur la raison pour laquelle seul Abu Lahab est nommé dans le Coran, et sur les notes linguistiques d'al-Suhayli."
  es: "El conferenciante abre una nueva sección periódica sobre los veteranos de Badr, empezando por Abu Sabra ibn Abi Ruhm, y continúa después el relato de Ibn Ishaq sobre las delegaciones de Quraysh ante Abu Talib, la oferta de cambiar a Umara ibn al-Walid por el Profeta y la convocatoria de Abu Talib a los Banu Hashim y los Banu al-Muttalib. Añade comentarios sobre los jefes de Quraysh, sobre por qué solo Abu Lahab es nombrado en el Corán y sobre las notas lingüísticas de al-Suhayli."
