id: work/fatwa-amja-combining-intentions-nafl
class: work
kind: fatwa
label: { ar: "الجمع بين نيتين", en: "Combining two intentions in a voluntary prayer or fast — no harm", ur: "دو نیتوں کا جمع — نفل میں جائز", es: "Combinar dos intenciones en una oración o ayuno voluntario no causa daño.", fr: "Combiner deux intentions dans une prière ou un jeûne volontaire — aucun mal", tr: "iki niyeti birleştiren", id: "menggabungkan dua niat" }
summary:
  ar: "سأل سائل عن جواز الجمع بين نيتين في صلاة النافلة أو صوم النافلة. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21982 بتاريخ 14 أكتوبر 2012)⁩ أنه لا حرج في ذلك فالنيات تجارة العلماء كما يقولون فإذا صام يوم الاثنين أو الخميس مما ندب النبي لصيامهما حصل له الأجران على ما فصّل الجواب."
  en: "A questioner asked about combining two intentions in a voluntary prayer or fast. AMJA's fatwa committee (fatwa no. 21982, 14 October 2012) answered that there is no harm in it — intentions are the scholars' commerce, as they say; one fasting Monday or Thursday among the days the Prophet commended earns both rewards — as the answer details."
  ur: "دو نیتیں؟ لجنة الفتوى ⁦(فتویٰ 21982، 14 اکتوبر 2012)⁩ کے مطابق نفل میں جائز — دونوں اجر ملتے ہیں۔"
  es: "Un consultante preguntó sobre la posibilidad de combinar dos intenciones en una oración o ayuno voluntario. El comité de fatuas de AMJA (fatua n.° 21982, 14 de octubre de 2012) respondió que no hay inconveniente en ello; las intenciones son el oficio de los eruditos, como ellos mismos dicen; un ayuno los lunes o jueves entre los días que el Profeta recomendó otorga ambas recompensas, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de combiner deux intentions lors d'une prière ou d'un jeûne surérogatoire. Le comité des fatwas de l'AMJA (fatwa n° 21982, 14 octobre 2012) a répondu qu'il n'y avait aucun mal à cela: les intentions relèvent de la compétence des savants, comme ils le disent; jeûner un lundi ou un jeudi parmi les jours recommandés par le Prophète permet d'obtenir les deux récompenses, comme le précise la réponse."
  tr: "Bir soru soran kişiye, gönüllü namazda veya gönüllü oruçta iki niyetin birleştirilmesinin mücaizliği soruldu. Amerika İslami Hukukçular Meclisi'ndeki Fetva Komitesi (14 Ekim 2012 tarihli Fetva No. 21982), bunun zararı olmadığını çünkü niyetlerin alimlerin mesleği olduğunu söyledi. Bir kişi, Peygamber'in oruç için önerdiği Pazartesi veya Perşembe günü oruç tutarsa, cevapta açıklandığı üzere her iki ödülü de alır."
  id: "Seorang penanya ditanya tentang kelayakan menggabungkan dua niat dalam doa sukarela atau puasa sukarela. Komite Fatwa di Majelis Ahli Hukum Islam di Amerika (Fatwa No. 21982 tanggal 14 Oktober 2012) menjawab bahwa tidak ada salahnya hal itu, karena niat adalah pekerjaan para ulama, seperti kata pepatah. Jika seseorang berpuasa pada hari Senin atau Kamis, yang direkomendasikan oleh Nabi untuk berpuasa, ia akan menerima kedua ganjaran tersebut, sebagaimana dijelaskan dalam jawaban."
