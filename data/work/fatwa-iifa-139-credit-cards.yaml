label: { ar: "قرار مجمع الفقه الإسلامي الدولي 139 (15/5) بشأن بطاقات الائتمان", en: "IIFA resolution 139 (15/5) on credit cards", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 139 (15/5): کریڈٹ کارڈز", es: "Resolución 139 (15/5) de la IIFA sobre tarjetas de crédito", fr: "Résolution 139 (15/5) de l'IIFA relative aux cartes de crédit" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩، استكمالًا لقراريه 63 ⁦(7/1)⁩ المتضمن تعريف بطاقات الائتمان وصورها و108 ⁦(12/2)⁩ المتضمن حكم البطاقة غير المغطاة والرسوم والحسم على التجار والسحب النقدي وشراء الذهب والعملات. قرر: يجوز إصدار بطاقات الائتمان المغطاة والتعامل بها إذا لم تتضمن شروطها دفع فائدة عند التأخر في السداد؛ وينطبق عليها ما جاء في قرار 108 من أحكام الرسوم والحسم والسحب النقدي بضوابطه؛ ويجوز شراء الذهب أو الفضة أو العملات بالبطاقة المغطاة؛ مع تأكيد تجنب شبهات الربا وذرائعه كفسخ الدين بالدين في أعمال المؤسسات المالية الإسلامية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004), completing its resolutions 63 (7/1) defining credit cards and their forms and 108 (12/2) on the uncovered card, fees, merchant discount, cash withdrawal and buying gold and currencies. It ruled: covered credit cards may be issued and used where their terms do not stipulate interest on late settlement; the rules of resolution 108 on fees, merchant discount and controlled cash withdrawal apply to them; gold, silver and currencies may be bought with the covered card; and Islamic financial institutions must avoid riba suspicions and devices, such as cancelling debt for debt."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں، اپنی قراردادوں 63 ⁦(7/1)⁩ برائے کریڈٹ کارڈز کی تعریف و اقسام اور 108 ⁦(12/2)⁩ برائے غیر مغطیٰ کارڈ، فیس، تاجرانہ ڈسکاؤنٹ، نقد سحب اور سونے اور کرنسی کی خرید کا تکملہ۔ فیصلے: مغطیٰ کریڈٹ کارڈ جاری اور استعمال کیے جا سکتے ہیں بشرطیکہ ان کی شرائط میں تاخیر پر سود نہ ہو؛ قرارداد 108 کے احکام — فیس، ڈسکاؤنٹ اور ضابطہ شدہ نقد سحب — ان پر بھی لاگو؛ مغطیٰ کارڈ سے سونا، چاندی اور کرنسی خریدنا جائز؛ اور اسلامی مالی ادارے ربا کے شبہات اور ذرائع — جیسے قرض کے بدلے قرض کی تصفیہ — سے بچیں۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004), que completa sus resoluciones 63 (7/1) que define las tarjetas de crédito y sus formas, y 108 (12/2) sobre la tarjeta sin cobertura, comisiones, descuento para comerciantes, retiro de efectivo y compra de oro y divisas. En ella se dictaminó: las tarjetas de crédito con cobertura pueden emitirse y utilizarse cuando sus términos no estipulen intereses por pago tardío; se les aplican las normas de la resolución 108 sobre comisiones, descuento para comerciantes y retiro controlado de efectivo; se puede comprar oro, plata y divisas con la tarjeta con cobertura; y las instituciones financieras islámicas deben evitar sospechas y artimañas de riba, como la cancelación de deuda por deuda."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 15e session à Mascate (14-19 Muharram 1425, soit 6-11 mars 2004) complète ses résolutions 63 (7/1) définissant les cartes de crédit et leurs modalités, et 108 (12/2) relative aux cartes non couvertes, aux frais, aux remises commerçantes, aux retraits d'espèces et à l'achat d'or et de devises. Il a été statué que: les cartes de crédit couvertes peuvent être émises et utilisées lorsque leurs conditions ne prévoient pas d'intérêts en cas de retard de paiement; les règles de la résolution 108 concernant les frais, les remises commerçantes et les retraits d'espèces contrôlés leur sont applicables; l'achat d'or, d'argent et de devises est autorisé avec une carte couverte; et les institutions financières islamiques doivent éviter tout soupçon d'usure (riba) et les pratiques douteuses telles que l'annulation de dettes par une autre."
