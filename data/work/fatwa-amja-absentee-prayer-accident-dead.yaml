label: { ar: "صلاة الغائب على موتى الحوادث", en: "Absentee prayer for a Muslim left dead after a traffic accident", ur: "حادثے کے مرنے والے پر غائبانہ نماز", es: "Oración en ausencia por un musulmán fallecido tras un accidente de tráfico.", fr: "Prière à distance pour un musulman décédé dans un accident de la route", tr: "Kazalarda ölenler için yapılan uzaktan dua", id: "Doa absen untuk orang yang meninggal dalam kecelakaan" }
summary:
  ar: "سأل سائل عن مسلم توفي في حادث مرور وظل جثمانه هل تشرع له صلاة الغائب. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86783 بتاريخ 25 أبريل 2012)⁩ أن صلاة الغائب تشرع على من لم يصل عليه من المسلمين كما صلى النبي على النجاشي على ما فصّل الجواب."
  en: "A questioner asked about a Muslim who died in a traffic accident whose body was left — is the absentee prayer legislated for him? AMJA's fatwa committee (fatwa no. 86783, 25 April 2012) answered that the absentee prayer is legislated for Muslims not prayed over, as the Prophet prayed over the Negus — as the answer states."
  ur: "حادثے کا مرنے والا؟ لجنة الفتوى ⁦(فتویٰ 86783، 25 اپریل 2012)⁩ کے مطابق جس پر جنازہ نہ ہوا غائبانہ جائز — نجاشی کی سنت۔"
  es: "Un consultante preguntó acerca de un musulmán que murió en un accidente de tráfico y cuyo cuerpo quedó abandonado: ¿está prescrita la oración por la ausencia para él? El comité de fatwas de AMJA (fatwa n.° 86783, 25 de abril de 2012) respondió que la oración por la ausencia está prescrita para los musulmanes por quienes no se ha orado, como el Profeta oró por el Negus, tal como se indica en la respuesta."
  fr: "Un internaute a demandé si la prière pour les personnes décédées dans un accident de la route et dont le corps a été laissé sur place était prescrite. Le comité des fatwas de l'AMJA (fatwa n° 86783, 25 avril 2012) a répondu que la prière pour les personnes décédées et dont le corps n'a pas fait l'objet d'une prière est prescrite, à l'instar du Prophète qui a prié pour le Négus, comme l'indique la réponse."
  tr: "Bir soru soran kişi, trafik kazasında hayatını kaybeden ve cesedi geride kalan bir Müslümana namazın kendisi için verilip verilmediğini sordu. Amerika İslami Hukukçular Meclisi'ndeki Fetva Komitesi (25 Nisan 2012 tarihli Fetva No. 86783), cevabında ayrıntılı olarak belirtildiği üzere, Peygamber'in Negus üzerinde namaz kıldığı gibi, onun için namaz kılmayan Müslümanlar için de namaz kıldığını belirtti."
  id: "Seorang penanya menanyakan kepada seorang Muslim yang meninggal dalam kecelakaan lalu lintas dan jenazahnya tetap di belakang apakah shalat in absentia itu ditetapkan untuknya. Komite Fatwa di Majelis Ahli Hukum Islam di Amerika (Fatwa No. 86783 tanggal 25 April 2012) menanggapi bahwa shalat absen ditetapkan bagi Muslim yang tidak berdoa atas dirinya, sama seperti Nabi berdoa atas Negus, seperti yang dijelaskan dalam jawabannya."
