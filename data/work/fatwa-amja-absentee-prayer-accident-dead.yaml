summary:
  ar: "سأل سائل عن مسلم توفي في حادث مرور وظل جثمانه هل تشرع له صلاة الغائب. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86783 بتاريخ 25 أبريل 2012)⁩ أن صلاة الغائب تشرع على من لم يصل عليه من المسلمين كما صلى النبي على النجاشي على ما فصّل الجواب."
  en: "A questioner asked about a Muslim who died in a traffic accident whose body was left — is the absentee prayer legislated for him? AMJA's fatwa committee (fatwa no. 86783, 25 April 2012) answered that the absentee prayer is legislated for Muslims not prayed over, as the Prophet prayed over the Negus — as the answer states."
  ur: "حادثے کا مرنے والا؟ لجنة الفتوى ⁦(فتویٰ 86783، 25 اپریل 2012)⁩ کے مطابق جس پر جنازہ نہ ہوا غائبانہ جائز — نجاشی کی سنت۔"
