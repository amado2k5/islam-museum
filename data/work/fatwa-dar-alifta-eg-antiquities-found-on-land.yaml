label: { ar: "كيفية التصرف في الآثار التي يجدها الإنسان في ملكه", en: "What to do with antiquities found on one's property", ur: "اپنی ملکیت میں ملنے والے آثارِ قدیمہ سے کیا کرنا چاہیے" }
summary:
  ar: "سائل عثر على آثار في أرضه وسأل عن كيفية التصرف فيها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24366)⁩ أن الآثار التي يُعثر عليها في الأراضي المصرية من الأموال العامة للدولة ولا تدخل في ملك الأفراد ولو عُثر عليها في أرض يملكونها ملكًا صحيحًا، وبين الجواب وجوب الإبلاغ عنها وتسليمها للجهات المختصة."
  en: "A questioner found antiquities on his land and asked how to deal with them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24366) answered that antiquities discovered on Egyptian soil are public property of the state and do not enter private ownership even when found on land genuinely owned by individuals; the answer requires reporting and surrendering them to the competent authorities."
  ur: "ایک سائل کو اپنی زمین میں آثارِ قدیمہ ملے اور اس نے ان سے سلوک کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24366)⁩ نے جواب دیا کہ مصری زمین میں ملنے والے آثارِ قدیمہ ریاست کی عوامی املاک ہیں اور افراد کی ملکیت میں داخل نہیں ہوتے خواہ وہ زمین ان کی اپنی ہو؛ جواب میں ان کی اطلاع دینے اور متعلقہ اداروں کے حوالے کرنے کی واجبیت بیان ہوئی۔"
