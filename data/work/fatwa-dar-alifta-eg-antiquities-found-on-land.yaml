id: work/fatwa-dar-alifta-eg-antiquities-found-on-land
class: work
kind: fatwa
label: { ar: "كيفية التصرف في الآثار التي يجدها الإنسان في ملكه", en: "What to do with antiquities found on one's property", ur: "اپنی ملکیت میں ملنے والے آثارِ قدیمہ سے کیا کرنا چاہیے", es: "Qué hacer con las antigüedades encontradas en la propia propiedad.", fr: "Que faire des antiquités trouvées sur sa propriété", tr: "Bir kişinin mülkünde bulduğu eserlerin nasıl bertaraf edileceği", id: "Cara membuang artefak yang ditemukan seseorang di propertinya" }
summary:
  ar: "سائل عثر على آثار في أرضه وسأل عن كيفية التصرف فيها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24366)⁩ أن الآثار التي يُعثر عليها في الأراضي المصرية من الأموال العامة للدولة ولا تدخل في ملك الأفراد ولو عُثر عليها في أرض يملكونها ملكًا صحيحًا، وبين الجواب وجوب الإبلاغ عنها وتسليمها للجهات المختصة."
  en: "A questioner found antiquities on his land and asked how to deal with them. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24366) answered that antiquities discovered on Egyptian soil are public property of the state and do not enter private ownership even when found on land genuinely owned by individuals; the answer requires reporting and surrendering them to the competent authorities."
  ur: "ایک سائل کو اپنی زمین میں آثارِ قدیمہ ملے اور اس نے ان سے سلوک کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24366)⁩ نے جواب دیا کہ مصری زمین میں ملنے والے آثارِ قدیمہ ریاست کی عوامی املاک ہیں اور افراد کی ملکیت میں داخل نہیں ہوتے خواہ وہ زمین ان کی اپنی ہو؛ جواب میں ان کی اطلاع دینے اور متعلقہ اداروں کے حوالے کرنے کی واجبیت بیان ہوئی۔"
  es: "Un consultante encontró antigüedades en su terreno y preguntó cómo debía proceder con ellas. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 24366) respondió que las antigüedades descubiertas en territorio egipcio son propiedad pública del Estado y no pasan a ser de propiedad privada, incluso cuando se encuentran en terrenos que pertenecen legítimamente a particulares; la respuesta exige que se informe sobre ellas y se entreguen a las autoridades competentes."
  fr: "Un homme ayant découvert des antiquités sur son terrain a demandé comment procéder. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24366) a répondu que les antiquités découvertes sur le sol égyptien sont la propriété publique de l'État et ne deviennent pas propriété privée, même si elles sont trouvées sur un terrain appartenant légitimement à des particuliers; la réponse exige de les déclarer et de les remettre aux autorités compétentes."
  tr: "Bir soru soran kişi, arazisinde antikalar buldu ve bunların nasıl elden çıkarılacağını sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 24366), Mısır topraklarında bulunan antikaların kamu devlet fonu olduğunu ve haklı olarak sahip oldukları arazide bulunsalar bile bireylere ait olmadığını belirtti. Rapor, bunların bildirilip yetkili makamlara teslim edilmesi zorunluluğunu netleştirdi."
  id: "Seorang penanya menemukan barang antik di tanahnya dan bertanya bagaimana cara membuangnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 24366) menjawab bahwa barang antik yang ditemukan di tanah Mesir adalah dana negara publik dan tidak dimiliki oleh individu, bahkan jika ditemukan di tanah yang mereka miliki secara sah. Dokumen tersebut memperjelas kewajiban untuk melaporkan dan menyerahkannya kepada otoritas yang berwenang."
