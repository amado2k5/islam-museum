label: { ar: "قرار مجمع الفقه الإسلامي الدولي 140 (15/6) بشأن الاستثمار في الوقف وفي غلاته وريعه", en: "IIFA resolution 140 (15/6) on investing waqf assets and their yields and revenues", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 140 (15/6): وقف کے اثاثوں، پیداوار اور ریع میں سرمایہ کاری" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. عرّف استثمار أموال الوقف بتنمية الأموال الوقفية أصولًا وريعًا بوسائل مباحة، وقرر: وجوب المحافظة على الموقوف ببقاء عينه ودوام نفعه؛ وجوب استثمار الأصول الوقفية عقارات ومنقولات ما لم تكن موقوفة للانتفاع المباشر؛ العمل بشرط الواقف في تنمية الأصل بجزء من الريع أو صرف جميعه في مصارفه؛ الأصل عدم جواز استثمار جزء من الريع إذا أطلق الواقف؛ وضوابط استثمار الوقف في المشاريع والأدوات المعاصرة ⁦(كالمشاركة والمضاربة والصكوك)⁩ مع مراعاة خطورة التصرف في أصل الوقف وشروط ناظره."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It defined investing waqf assets as growing endowed wealth, principal and revenue, by lawful means; and ruled: the waqf must be preserved by keeping its corpus and continuing its benefit; waqf assets, realty and movables, must be invested unless endowed for direct use; the founder's condition governs — whether he stipulated developing the principal from part of the revenue or spending all revenue on its purposes; where the founder is unqualified, investing part of the revenue is in principle impermissible; and it set controls for investing waqf in contemporary ventures and instruments (partnership, mudaraba, sukuk) with regard to the gravity of disposing of the corpus and the administrator's conditions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے وقف کے مال کی سرمایہ کاری کی تعریف کی: موقوفہ اثاثوں — اصل و ریع — کو جائز ذرائع سے بڑھانا؛ اور فیصلے: موقوفہ کی حفاظت اس کی عین کے بقا اور نفع کے دوام سے واجب؛ موقوفہ اثاثے — عقار ہو یا منقولہ — کی سرمایہ کاری واجب سوائے ان کے جو براہِ راست استعمال کے لیے وقف ہوں؛ واقف کی شرط نافذ — خواہ اصل کی ترقی ریع کے جز سے ہو یا سارا ریع مصارف پر صرف ہو؛ واقف خاموش ہو تو اصل یہ ہے کہ ریع کا حصہ سرمایہ کاری میں جائز نہیں؛ اور عصری ذرائع ⁦(شراکت، مضاربہ، صکوک)⁩ میں وقف کی سرمایہ کاری کے ضوابط — اصل وقف کے تصرف کی سنگینی اور ناظر کی شرائط کے پیشِ نظر۔"
