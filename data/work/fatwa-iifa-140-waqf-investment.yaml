id: work/fatwa-iifa-140-waqf-investment
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 140 (15/6) بشأن الاستثمار في الوقف وفي غلاته وريعه", en: "IIFA resolution 140 (15/6) on investing waqf assets and their yields and revenues", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 140 (15/6): وقف کے اثاثوں، پیداوار اور ریع میں سرمایہ کاری", es: "Resolución 140 (15/6) de la IIFA sobre la inversión de los activos waqf y sus rendimientos e ingresos.", fr: "Résolution 140 (15/6) de l'IIFA sur l'investissement des actifs waqf et leurs rendements et revenus" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة عشرة بمسقط ⁦(14–19 المحرم 1425هـ، 6–11 مارس 2004م)⁩. عرّف استثمار أموال الوقف بتنمية الأموال الوقفية أصولًا وريعًا بوسائل مباحة، وقرر: وجوب المحافظة على الموقوف ببقاء عينه ودوام نفعه؛ وجوب استثمار الأصول الوقفية عقارات ومنقولات ما لم تكن موقوفة للانتفاع المباشر؛ العمل بشرط الواقف في تنمية الأصل بجزء من الريع أو صرف جميعه في مصارفه؛ الأصل عدم جواز استثمار جزء من الريع إذا أطلق الواقف؛ وضوابط استثمار الوقف في المشاريع والأدوات المعاصرة ⁦(كالمشاركة والمضاربة والصكوك)⁩ مع مراعاة خطورة التصرف في أصل الوقف وشروط ناظره."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 15th session in Muscat (14–19 Muharram 1425, 6–11 March 2004). It defined investing waqf assets as growing endowed wealth, principal and revenue, by lawful means; and ruled: the waqf must be preserved by keeping its corpus and continuing its benefit; waqf assets, realty and movables, must be invested unless endowed for direct use; the founder's condition governs — whether he stipulated developing the principal from part of the revenue or spending all revenue on its purposes; where the founder is unqualified, investing part of the revenue is in principle impermissible; and it set controls for investing waqf in contemporary ventures and instruments (partnership, mudaraba, sukuk) with regard to the gravity of disposing of the corpus and the administrator's conditions."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مسقط میں پندرہویں مجلس ⁦(14–19 محرم 1425ھ، 6–11 مارچ 2004ء)⁩ میں۔ اس نے وقف کے مال کی سرمایہ کاری کی تعریف کی: موقوفہ اثاثوں — اصل و ریع — کو جائز ذرائع سے بڑھانا؛ اور فیصلے: موقوفہ کی حفاظت اس کی عین کے بقا اور نفع کے دوام سے واجب؛ موقوفہ اثاثے — عقار ہو یا منقولہ — کی سرمایہ کاری واجب سوائے ان کے جو براہِ راست استعمال کے لیے وقف ہوں؛ واقف کی شرط نافذ — خواہ اصل کی ترقی ریع کے جز سے ہو یا سارا ریع مصارف پر صرف ہو؛ واقف خاموش ہو تو اصل یہ ہے کہ ریع کا حصہ سرمایہ کاری میں جائز نہیں؛ اور عصری ذرائع ⁦(شراکت، مضاربہ، صکوک)⁩ میں وقف کی سرمایہ کاری کے ضوابط — اصل وقف کے تصرف کی سنگینی اور ناظر کی شرائط کے پیشِ نظر۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 15.ª sesión en Mascate (14-19 de Muharram de 1425, 6-11 de marzo de 2004). Definió la inversión de los activos del waqf como el crecimiento de la riqueza, el capital y los ingresos, por medios lícitos; y dictaminó: el waqf debe preservarse manteniendo su capital y continuando su beneficio; los activos del waqf, bienes inmuebles y muebles, deben invertirse a menos que se hayan donado para uso directo; la condición del fundador rige: si estipuló desarrollar el capital a partir de una parte de los ingresos o gastar todos los ingresos en sus fines; cuando el fundador no está calificado, invertir parte de los ingresos es, en principio, inadmisible; y estableció controles para invertir el waqf en empresas e instrumentos contemporáneos (sociedades, mudaraba, sukuk) con respecto a la gravedad de la disposición del capital y las condiciones del administrador."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) adoptée lors de sa 15e session à Mascate (14-19 Muharram 1425, 6-11 mars 2004) définit l'investissement des biens waqf comme l'accroissement du patrimoine constitué, capital et revenus, par des moyens licites. Elle stipule que le waqf doit être préservé par la conservation de son capital et la poursuite de ses bénéfices. Les biens waqf, immeubles et meubles, doivent être investis, sauf s'ils ont été constitués pour un usage direct. Les conditions du fondateur prévalent: a-t-il stipulé que le capital devait être constitué à partir d'une partie des revenus ou que la totalité des revenus devait être affectée à ses objectifs ? En l'absence de conditions du fondateur, l'investissement d'une partie des revenus est en principe interdit. Enfin, la résolution établit des règles pour l'investissement du waqf dans des entreprises et instruments contemporains (société en nom collectif, mudaraba, sukuk) en fonction de la gravité de la disposition du capital et des conditions de l'administrateur."
