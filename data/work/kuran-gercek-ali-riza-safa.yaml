    stance:
      ar: "أهل السنة ⁦(علماء محليون في قيصري)⁩: الترجمة تحريف ويجب وقف توزيعها"
      en: "Sunni (local scholars in Kayseri): the translation distorts the text and its distribution should stop"
      ur: "سني ⁦(اہلِ سنت)⁩ — قیصری کے مقامی علما: ترجمہ تحریف ہے اور اس کی تقسیم روکی جائے"
    summary:
      ar: "عند عرض الطبعة الأولى في معرض قيصري للكتاب سنة 2016 شكت جماعة من علماء المدينة إلى الحكومة المحلية أن فيها تحريفًا للنص، وطلبت وقف توزيعها؛ ولم يترتب على ذلك منع ولا مساءلة قانونية."
      en: "When the first edition was presented at the Kayseri book fair in 2016, a group of the city's scholars complained to the regional government that it contained distortion (tahrif) of the text and asked for its distribution to be halted; this led to no ban and no legal action."
      ur: "2016 میں قیصری کے کتاب میلے میں پہلی اشاعت پیش ہوئی تو شہر کے علما کے ایک گروہ نے مقامی حکومت سے شکایت کی کہ اس میں متن کی تحریف ہے اور اس کی تقسیم روکنے کا مطالبہ کیا؛ اس پر نہ پابندی لگی نہ قانونی کارروائی ہوئی۔"
    sources: [source/gloqur-kuran-gercek-safa]
  - tradition: academic
    standing: secondary
    stance:
      ar: "قراءة أكاديمية: ترجمة هامشية تعكس جدل العلمانية والتقليد في تركيا"
      en: "Academic reading: a marginal work that reflects Turkey's debates on secularism and tradition"
      ur: "علمی مطالعہ: ایک حاشیائی کام جو ترکی میں سیکولرازم اور روایت کی بحث کو ظاہر کرتا ہے"
    summary:
      ar: "يرى ميخايلو ياكوبوفيتش أن استراتيجية «نزع التعريب» المتعمدة فيها، ومنها ترجمة كلمة «الرب» بلفظ دنيوي، ورفض صاحبها للحديث القدسي، تفسّر الاعتراض عليها، وأنها بقيت عملًا هامشيًا لكنه مفيد لفهم الجدل المعاصر في تركيا."
      en: "Mykhaylo Yakubovych sees its deliberate 'de-Arabisation', including a secular word for the divine Lord and the translator's rejection of hadith qudsi, as the reason for the objection, and judges it a marginal work, though a useful one for understanding Turkey's contemporary debates."
      ur: "میخائیلو یاکوبووچ کے نزدیک اس کی دانستہ «عربیت زدائی»، جس میں رب کے لیے ایک عام لفظ اور حدیثِ قدسی کا انکار شامل ہے، اعتراض کی وجہ ہے، اور یہ ایک حاشیائی مگر ترکی کی معاصر بحث سمجھنے کے لیے مفید کام ہے۔"
