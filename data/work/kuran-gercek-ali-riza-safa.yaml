label: { ar: "القرآن الحق ⁦(علي رضا صفا)⁩", en: "Kur'an Gerçek (Ali Rıza Safa)", ur: "کوران گرچک ⁦(علی رضا صفا)⁩" }
summary:
  ar: "ترجمة تركية لمعاني القرآن وضعها علي رضا صفا، صدرت أول مرة سنة 2014 عن دار إيليري في إسطنبول، ثم في طبعات بتعليقات ومقدمات سنة 2018 وطبعات للنص وحده حتى 2021 بعنوان «القرآن الكريم الحق»؛ تتعمد استعمال المفردات التركية بدل الألفاظ العربية الدينية، ويرى صاحبها جواز قراءة القرآن بالتركية في الصلاة، واعترض عليها علماء في قيصري سنة 2016 بأنها تحريف."
  en: "A Turkish rendering of the meanings of the Qur'an by Ali Rıza Safa, first published in 2014 by Ileri in Istanbul, then in editions with introduction and commentary (2018) and text-only editions up to 2021 under the title Kur'an-i Kerim Gerçek; it deliberately replaces Arabic religious vocabulary with vernacular Turkish, its translator holds that the Qur'an may be read in Turkish in prayer, and scholars in Kayseri objected in 2016 that it distorts the text."
  ur: "قرآن کے معانی کا ترکی ترجمہ از علی رضا صفا، جو پہلی بار 2014 میں استنبول کے ایلیری نے شائع کیا، پھر 2018 میں تعارف اور حواشی کے ساتھ اور 2021 تک صرف متن کی اشاعتوں میں «قرآنِ کریم گرچک» کے نام سے آیا؛ یہ دانستہ طور پر عربی دینی الفاظ کی جگہ عام ترکی الفاظ لاتا ہے، مترجم نماز میں ترکی میں قرآن پڑھنے کو درست سمجھتے ہیں، اور 2016 میں قیصری کے علما نے اسے تحریف قرار دیا۔"
