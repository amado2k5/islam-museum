summary:
  ar: "سائل سأل عن وليمة المولود ⁦(العقيقة)⁩. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22446)⁩ أن وليمة المولود ذكرًا كان أو أنثى المعروفة بالعقيقة سنة نبوية، ومندرجة تحت إطعام الطعام المندوب إليه شرعًا على ما فصّل الجواب من ضوابطها ووقتها."
  en: "A questioner asked about the newborn's feast (the aqiqa). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22446) answered that the newborn's feast — boy or girl — known as the aqiqa is a Prophetic sunna and falls under the recommended feeding of food in the sharia, with its controls and timing as the answer details."
  ur: "ایک سائل نے نومولود کے ولیمے ⁦(عقیقہ)⁩ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22446)⁩ نے جواب دیا کہ نومولود کا ولیمہ — لڑکا ہو یا لڑکی — جو عقیقہ کہلاتا ہے نبوی سنت ہے اور شریعت کے مستحب کھانا کھلانے میں داخل ہے، جواب میں اس کے ضوابط اور وقت کی تفصیل ہے۔"
