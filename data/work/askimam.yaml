summary:
  ar: "موقع فتاوى بالإنجليزية أسسه المفتي الجنوب أفريقي إبراهيم ديسائي سنة 2000 باسم ask-imam.com ثم askimam.org سنة 2004، يجيب عن أسئلة الفقه على المذهب الحنفي بمنهج مدرسة ديوبند، ويراجع المؤسس كل فتوى؛ وصفه الباحث غاري بنت بأنه أوسع وأشمل وأكثر تأثيرًا من موارد الأزهر على الشبكة مجتمعة."
  en: "An English-language fatwa website founded by the South African mufti Ebrahim Desai in 2000 as ask-imam.com and moved to askimam.org in 2004, answering questions of fiqh by the Hanafi school in the Deobandi tradition, each answer checked by its founder; the scholar Gary Bunt called it more comprehensive, influential and wide-ranging than al-Azhar's web resources put together."
  ur: "انگریزی فتویٰ ویب سائٹ جسے جنوبی افریقہ کے مفتی ابراہیم ڈیسائی نے 2000 میں ask-imam.com کے نام سے شروع کیا اور 2004 میں askimam.org پر منتقل کیا؛ فقہ کے سوالوں کے جواب دیوبندی روایت میں حنفی مذہب پر دیتی ہے؛ محقق گیری بنٹ نے اسے الازہر کے آن لائن وسائل سے مجموعی طور پر زیادہ جامع اور مؤثر کہا۔"
