  ar: "سيرة الهادي إلى الحق — ترجمة الإمام يحيى بن الحسين الرسي⁦(ت 298هـ)⁩ مؤسس الدولة الزيدية في اليمن — برواية علي بن محمد بن عبيد الله العباسي العلوي ومحمد بن سليمان الكوفي، تحقيق سهيل زكار. سيرة تاريخية لإمام زيدي تتضمن مراسلاته ووفوده."
  en: "The sira of al-Hadi ila al-Haqq — the biography of Imam Yahya ibn al-Husayn al-Rassi (d. 298 AH), founder of the Zaydi state in Yemen — narrated by Ali ibn Muhammad ibn Ubaydallah al-Abbasi al-Alawi and Muhammad ibn Sulayman al-Kufi, ed. Suhayl Zakkar. A historical sira containing his correspondence and embassies."
