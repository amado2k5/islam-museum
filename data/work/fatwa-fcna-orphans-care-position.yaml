label: { ar: "الموقف الإسلامي من كفالة الأيتام والأطفال المهملين", en: "The Islamic Position Regarding the Care of Orphans and Abandoned Children", ur: "یتیموں اور بے سہارا بچوں کی کفالت پر اسلامی موقف", es: "La postura islámica respecto al cuidado de los niños huérfanos y abandonados.", fr: "La position islamique concernant la prise en charge des orphelins et des enfants abandonnés", tr: "Yetimlere ve İhmal Edilen Çocuklara Sponsor Olma Konusundaki İslami Tutum", id: "Posisi Islam tentang Mendukung Anak Yatim dan Anak Terabaikan" }
summary:
  ar: "وثيقة مشتركة بين المجلس الفقهي لأمريكا الشمالية ومجمع فقهاء الشريعة بأمريكا ⁦(نُشرت أكتوبر 2021)⁩ عن الموقف الإسلامي من كفالة الأيتام والأطفال المهملين وما يترتب عليه من أحكام في السياق الأمريكي على ما فصّلته الوثيقة."
  en: "A joint document of the Fiqh Council of North America and the Assembly of Muslim Jurists of America (published October 2021) on the Islamic position regarding the care of orphans and abandoned children and the rulings that follow in the American context — as the document details."
  ur: "فقہ کونسل آف نارتھ امریکہ اور اسمبلی آف مسلم جورسٹس کی مشترکہ دستاویز ⁦(شائع شدہ اکتوبر 2021)⁩ یتیموں کی کفالت پر اسلامی موقف اور امریکی تناظر میں احکام — جیسا کہ دستاویز میں تفصیل ہے۔"
  es: "Documento conjunto del Consejo de Jurisprudencia Islámica de Norteamérica y la Asamblea de Juristas Musulmanes de América (publicado en octubre de 2021) sobre la postura islámica respecto al cuidado de huérfanos y niños abandonados y las normas que se derivan de ello en el contexto estadounidense, tal como se detalla en el documento."
  fr: "Un document conjoint du Conseil Fiqh d'Amérique du Nord et de l'Assemblée des juristes musulmans d'Amérique (publié en octobre 2021) sur la position islamique concernant la prise en charge des orphelins et des enfants abandonnés et les décisions qui en découlent dans le contexte américain — comme le détaille le document."
  tr: "Kuzey Amerika Fıkıh Konseyi ile Amerika Şeriat Hukukçuları Akademisi arasında (Ekim 2021'de yayımlandı) ortak bir belge, belgede detaylandırıldığı üzere, yetimlerin ve ihmal edilen çocukların desteklenmesi konusundaki İslami tutum ve Amerikan bağlamında ortaya çıkan kararlar hakkında."
  id: "Dokumen bersama antara Dewan Jurisprudensi Amerika Utara dan Akademi Ahli Hukum Syariah di Amerika (diterbitkan Oktober 2021) mengenai sikap Islam dalam mensponsori anak yatim piatu dan anak-anak yang diabaikan serta putusan yang dihasilkan dalam konteks Amerika, sebagaimana dirinci dalam dokumen tersebut."
