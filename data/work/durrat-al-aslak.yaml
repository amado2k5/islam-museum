label: { ar: "درة الأسلاك في دولة الأتراك", en: "Durrat al-Aslak fi Dawlat al-Atrak", ur: "درۃ الاسلاک فی دولۃ الاتراک" }
kind: book
summary:
  ar: "تاريخ ابن حبيب الحلبي لدولة الأتراك ⁦(المماليك)⁩، أرّخ به أخبارهم من سنة ٦٤٨هـ وأنهاه إلى سنة سبع وسبعين وسبعمائة {cite:nujum-zahira 11/189} — وذكر الزركلي أنه غطى إلى سنة ٧٧٨هـ {cite:al-aalam 2/218-219}؛ وذيّل عليه ولده طاهر بن حبيب {cite:nujum-zahira 11/189}."
  en: "Ibn Habib al-Halabi's history of the 'state of the Turks' (the Mamluk sultanate), whose annals he carried from 648 and finished down to 777 {cite:nujum-zahira 11/189} — al-Zirikli gives the coverage as 648-778 {cite:al-aalam 2/218-219}; his son Tahir ibn Habib wrote a continuation {cite:nujum-zahira 11/189}."
  ur: "ابن حبیب حلبی کی دولۃ الاتراک ⁦(ممالیک)⁩ کی تاریخ جو 648ھ سے شروع ہو کر 777ھ تک پہنچی {cite:nujum-zahira 11/189}؛ زرکلی کے مطابق اختتام 778ھ ہے {cite:al-aalam 2/218-219}؛ اس پر بیٹے طاہر بن حبیب نے ذیل لکھی {cite:nujum-zahira 11/189}."
