label: { ar: "درة الأسلاك في دولة الأتراك", en: "Durrat al-Aslak fi Dawlat al-Atrak", ur: "درۃ الاسلاک فی دولۃ الاتراک", es: "Durrat al-Aslak fi Dawlat al-Atrak", fr: "Durrat al-Aslak fi Dawlat al-Atrak", tr: "Türk Devleti'nde Tel Mücevheri", id: "Permata Kawat di Negara Turki" }
kind: book
summary:
  ar: "تاريخ ابن حبيب الحلبي لدولة الأتراك ⁦(المماليك)⁩، أرّخ به أخبارهم من سنة ٦٤٨هـ وأنهاه إلى سنة سبع وسبعين وسبعمائة {cite:nujum-zahira 11/189} — وذكر الزركلي أنه غطى إلى سنة ٧٧٨هـ {cite:al-aalam 2/218-219}؛ وذيّل عليه ولده طاهر بن حبيب {cite:nujum-zahira 11/189}."
  en: "Ibn Habib al-Halabi's history of the 'state of the Turks' (the Mamluk sultanate), whose annals he carried from 648 and finished down to 777 {cite:nujum-zahira 11/189} — al-Zirikli gives the coverage as 648-778 {cite:al-aalam 2/218-219}; his son Tahir ibn Habib wrote a continuation {cite:nujum-zahira 11/189}."
  ur: "ابن حبیب حلبی کی دولۃ الاتراک ⁦(ممالیک)⁩ کی تاریخ جو 648ھ سے شروع ہو کر 777ھ تک پہنچی {cite:nujum-zahira 11/189}؛ زرکلی کے مطابق اختتام 778ھ ہے {cite:al-aalam 2/218-219}؛ اس پر بیٹے طاہر بن حبیب نے ذیل لکھی {cite:nujum-zahira 11/189}."
  es: "La historia del 'estado de los turcos' (el sultanato mameluco) de Ibn Habib al-Halabi, cuyos anales llevó desde 648 hasta 777 {cite:nujum-zahira 11/189} — al-Zirikli indica que la cobertura es de 648 a 778 {cite:al-aalam 2/218-219}; su hijo Tahir ibn Habib escribió una continuación {cite:nujum-zahira 11/189}."
  fr: "L'histoire de l'« État des Turcs » (le sultanat mamelouk) d'Ibn Habib al-Halabi, dont il a repris les annales de 648 à 777 {cite:nujum-zahira 11/189} — al-Zirikli donne la couverture 648-778 {cite:al-aalam 2/218-219}; son fils Tahir ibn Habib a écrit une continuation {cite:nujum-zahira 11/189}."
  tr: "İbn Habib el-Halabi'nin Türk (Memlük) Devleti Tarihi'nde onların hikayelerini 648 Hicri yılından kronikleştirip 777 Hicri yılına kadar tamamlamıştır {atıf:Nujum-zahira 11/189} — El-Zerkali, bunu 778 Hicri yılına kadar ele aldığını belirtmiştir {al-aalam 2/218-219}; oğlu Tahir bin Habib de buna eklenmiştir {atıf:Nujum-zahira 11/189}."
  id: "Sejarah Negara Turkik (Mamluk) karya Ibn Habib al-Halabi, di mana ia mencatat kisah-kisah mereka dari tahun 648 H dan menyelesaikannya hingga tahun 777 H {cite:Nujum-zahira 11/189} — Al-Zarkali menyebutkan bahwa ia meliputnya hingga tahun 778 H {cite:al-aalam 2/218-219}; putranya Tahir ibn Habib juga ditambahkan {cite:Nujum-zahira 11/189}."
