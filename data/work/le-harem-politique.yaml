summary:
  ar: "دراسة بالفرنسية لفاطمة المرنيسي في مكانة النساء في المجتمع الإسلامي الأول وروايات الحديث المتعلقة بهن، صدرت عن دار ألبان ميشيل في باريس، وصدرت ترجمته الإنجليزية سنة 1991، سنة 1987."
  en: "A French study by Fatima Mernissi of the place of women in the first Muslim community and the hadith reports about them, published by Albin Michel, Paris, (English translation 1991) in 1987."
  ur: "فاطمہ مرنیسی کا فرانسیسی مطالعہ جو پہلی مسلم برادری میں عورتوں کے مقام اور ان سے متعلق احادیث کی روایات پر ہے؛ البان میشل، پیرس ⁦(انگریزی ترجمہ 1991ء)⁩ سے 1987ء میں شائع ہوا۔"
  es: "Un estudio francés de Fatima Mernissi sobre el lugar de la mujer en la primera comunidad musulmana y los hadices que se refieren a ella, publicado por Albin Michel, París, (traducción al inglés de 1991) en 1987."
  fr: "Une étude française de Fatima Mernissi sur la place des femmes dans la première communauté musulmane et les hadiths les concernant, publiée par Albin Michel, Paris, (traduction anglaise 1991) en 1987."
  tr: "Fatima Al-Marnisi tarafından erken İslam toplumunda kadınların durumu ve ilgili hadis rivayetleri üzerine Fransızca bir çalışma ve İngilizce çevirisi 1991 ve 1987 yıllarında yayımlandı."
  id: "Sebuah studi dalam bahasa Prancis oleh Fatima Al-Marnisi tentang status perempuan dalam masyarakat Islam awal dan narasi hadits terkait, diterbitkan oleh Alban Michel di Paris, dan terjemahan bahasa Inggrisnya diterbitkan pada tahun 1991 dan 1987."
