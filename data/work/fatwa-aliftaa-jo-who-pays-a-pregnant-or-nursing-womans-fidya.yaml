id: work/fatwa-aliftaa-jo-who-pays-a-pregnant-or-nursing-womans-fidya
class: work
kind: fatwa
label: { ar: "من يدفع فدية الحامل والمرضع", en: "Who pays a pregnant or nursing woman's fidya", ur: "حاملہ اور دودھ پلانے والی کا فدیہ کون دے", es: "¿Quién paga el sueldo de una mujer embarazada o lactante?", fr: "Qui paie les frais d'une femme enceinte ou allaitante ?" }
summary:
  ar: "سؤال عن من يدفع فدية الحامل والمرضع، أجابت فيه دائرة الإفتاء العام الأردنية بأن الفدية تجب من مال الزوجة، ولا تجب على الزوج إلا أن يتبرع بها. أجابت الدائرة بأن الفدية تجب من مال الزوجة، ولا تجب على الزوج إلا أن يتبرع بذلك. ونقلت من مغني المحتاج (2/174) أن الحامل والمرضع إذا خافتا على الولد وحده، كأن تخاف الحامل إسقاطه أو تخاف المرضع قلة اللبن فيهلك الولد، لزمتهما من مالهما الفدية مع القضاء."
  en: "A question about who pays a pregnant or nursing woman's fidya, in which Jordan's General Iftaa Department answered that the fidya is due from the wife's own wealth and is not due from the husband unless he volunteers it. The Department answered that the fidya is due from the wife's wealth and is not owed by the husband unless he chooses to pay it voluntarily. It quoted Mughni al-Muhtaj (2/174) that when a pregnant or nursing woman fears only for the child, the pregnant woman fearing miscarriage or the nursing woman fearing her milk will lessen and the child perish, she owes fidya from her own wealth together with the make-up."
  ur: "حاملہ اور دودھ پلانے والی کا فدیہ کون دے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ فدیہ بیوی کے اپنے مال سے واجب ہے، اور شوہر پر واجب نہیں سوائے اس کے کہ وہ رضاکارانہ ادا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ فدیہ بیوی کے مال سے واجب ہے، اور شوہر پر واجب نہیں سوائے اس کے کہ وہ خود ادا کرنا چاہے۔ اس نے مغنی المحتاج (2/174) سے نقل کیا کہ حاملہ اور دودھ پلانے والی صرف بچے پر خوف کریں، جیسے حاملہ کو اسقاط کا یا دودھ پلانے والی کو دودھ کم ہونے سے بچے کی ہلاکت کا خوف ہو، تو ان پر قضا کے ساتھ اپنے مال سے فدیہ لازم ہے۔"
  es: "Una pregunta sobre quién paga la fidya de una mujer embarazada o lactante, a la que el Departamento General de Iftaa de Jordania respondió que la fidya se debe con el patrimonio propio de la esposa y no con el del marido a menos que este la pague voluntariamente. El Departamento respondió que la fidya se debe con el patrimonio de la esposa y no con el del marido a menos que este decida pagarla voluntariamente. Citó a Mughni al-Muhtaj (2/174) que dice que cuando una mujer embarazada o lactante teme solo por el niño, la embarazada teme un aborto espontáneo o la lactante teme que su leche disminuya y el niño muera, debe pagar la fidya con su propio patrimonio junto con la compensación."
  fr: "Concernant la question de savoir qui doit payer la dot (fidya) à une femme enceinte ou allaitante, le Département général de la jurisprudence jordanienne (Iftaa) a répondu que cette dot est due sur les biens propres de l'épouse et n'est pas à la charge du mari, sauf si celui-ci la verse volontairement. Le Département a précisé que la dot est due sur les biens propres de l'épouse et n'est pas due par le mari, sauf s'il choisit de la payer volontairement. Il a cité le Mughni al-Muhtaj (2/174) selon lequel, lorsqu'une femme enceinte ou allaitante craint uniquement pour l'enfant (la femme enceinte craignant une fausse couche ou la femme allaitante craignant une diminution de sa production de lait et la mort de l'enfant), elle doit payer la dot sur ses propres biens, en plus des frais de subsistance."
