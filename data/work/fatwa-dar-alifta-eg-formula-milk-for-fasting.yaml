id: work/fatwa-dar-alifta-eg-formula-milk-for-fasting
class: work
kind: fatwa
label: { ar: "حكم استعمال المرضع الحليب الصناعي لطفلها من أجل الصيام", en: "A nursing mother using formula so she can fast", ur: "دودھ پلانے والی ماں کا روزے کے لیے بچے کو سینگ کا دودھ دینا", es: "Una madre lactante que usa fórmula para poder ayunar", fr: "Une mère allaitante utilise du lait maternisé pour pouvoir jeûner" }
summary:
  ar: "سائلة مرضع سألت عن استعمال الحليب الصناعي لطفلها من أجل الصيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21792)⁩ أن الأم مطالبة ديانة بإرضاع الصغير ويتعين عليها الإرضاع حال الضرورة ويجوز لها العدول عن الرضاعة الطبيعية إلى الصناعية بحسب ما بيّنه الجواب من ضوابط."
  en: "A nursing mother asked about giving her child formula milk so she can fast. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21792) answered that the mother is religiously bound to nurse the infant — required in necessity — and may switch from natural to formula feeding under the controls the answer sets out."
  ur: "دودھ پلانے والی ماں نے روزے کے لیے بچے کو سیانکا دودھ دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21792)⁩ نے جواب دیا کہ ماں پر بچے کو دودھ پلانا دینی لازم ہے اور ضرورت میں واجب ہو جاتا ہے؛ جواب کے بیان کردہ ضوابط کے ساتھ وہ قدرتی دودھ سے مصنوعی دودھ کی طرف جا سکتی ہے۔"
  es: "Una madre lactante preguntó si podía darle leche de fórmula a su hijo para poder ayunar. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21792) respondió que la madre está obligada por ley a amamantar al bebé —lo cual es necesario— y que puede cambiar de la lactancia materna a la fórmula siguiendo las pautas establecidas en la respuesta."
  fr: "Une mère allaitante a demandé si elle pouvait donner du lait artificiel à son enfant pour pouvoir jeûner. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21792) a répondu que la mère a l'obligation religieuse d'allaiter son nourrisson – un devoir en cas de nécessité – et peut passer de l'allaitement maternel à l'allaitement artificiel selon les conditions énoncées dans la fatwa."
