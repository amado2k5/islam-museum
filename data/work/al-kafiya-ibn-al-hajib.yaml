summary:
  ar: "«الكافية في علم النحو» كتاب في علم النحو العربي نسبه ملخص بحثي قُدّم إلى المتحف إلى ابن الحاجب، وذكر تاريخه هكذا: وفاة المؤلف 1249م / 646هـ {cite:wikipedia-al-kafiya-ibn-al-hajib-en}. وعدّه الملخص بين ستين كتاباً هي الأكثر استشهاداً بها في علوم العربية الخمسة."
  en: "al-Kafiya fi Ilm al-Nahw is a work of Arabic grammar that a research summary supplied to the museum ascribes to Ibn al-Hajib, giving its date as: author died 1249 CE / 646 AH {cite:wikipedia-al-kafiya-ibn-al-hajib-en}. The summary counts it among sixty of the most-cited works in the five Arabic sciences."
  ur: "«الکافیہ فی علم النحو» عربی نحو کی کتاب ہے جسے عجائب گھر کو دیا گیا ایک تحقیقی خلاصہ ابن الحاجب سے منسوب کرتا ہے اور اس کی تاریخ یوں دیتا ہے: مصنف کی وفات 1249 ء / 646 ھ {cite:wikipedia-al-kafiya-ibn-al-hajib-en}۔ خلاصہ اسے عربی کے پانچ علوم کی ساٹھ سب سے زیادہ حوالہ دی جانے والی کتابوں میں شمار کرتا ہے۔"
  fr: "al-Kafiya fi Ilm al-Nahw est un ouvrage de grammaire arabe qu'un résumé de recherche remis au musée attribue à Ibn al-Hajib, en donnant sa date ainsi : mort de l'auteur 1249 ap. J.-C. / 646 de l'Hégire {cite:wikipedia-al-kafiya-ibn-al-hajib-en}. Le résumé le compte parmi soixante des ouvrages les plus cités dans les cinq sciences de l'arabe."
  es: "al-Kafiya fi Ilm al-Nahw es una obra de gramática árabe que un resumen de investigación entregado al museo atribuye a Ibn al-Hajib, y cuya fecha da así: muerte del autor 1249 d. C. / 646 de la hégira {cite:wikipedia-al-kafiya-ibn-al-hajib-en}. El resumen la cuenta entre sesenta de las obras más citadas en las cinco ciencias del árabe."
