summary:
  ar: "ورقة للدكتور جمال بدوي في موقع المجلس الفقهي لأمريكا الشمالية ⁦(نُشرت نوفمبر 2021)⁩ تشرح الصيام في الإسلام فضله وأحكامه وما ورد فيه من النصوص على ما فصّلته الورقة."
  en: "A paper by Dr. Jamal Badawi on the Fiqh Council of North America site (published November 2021) explaining fasting in Islam — its merit, rulings and the texts transmitted about it — as the paper details."
  ur: "ڈاکٹر جمال بدوي کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(شائع شدہ نومبر 2021)⁩ اسلام میں روزے کے فضائل اور احکام پر — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del Dr. Jamal Badawi publicado en el sitio web del Consejo de Jurisprudencia Islámica de Norteamérica (en noviembre de 2021) explica el ayuno en el Islam: sus méritos, normas y los textos transmitidos al respecto, como se detalla en el artículo."
  fr: "Un article du Dr Jamal Badawi sur le site du Conseil Fiqh d'Amérique du Nord (publié en novembre 2021) explique le jeûne en Islam — son mérite, ses règles et les textes transmis à ce sujet — comme le détaille l'article."
  tr: "Dr. Jamal Badawi'nin Kuzey Amerika Fiqh Konseyi web sitesinde (Kasım 2021'de yayımlanan) İslam'da oruç tutmanın erdemi ve kurallarını açıklayan makalesi, makalede detaylandırıldığı üzere."
  id: "Sebuah makalah oleh Dr. Jamal Badawi di situs web Fiqh Council of North America (diterbitkan November 2021) yang menjelaskan kebajikan dan aturan puasa dalam Islam, seperti yang dijelaskan dalam makalah tersebut."
