summary:
  ar: "للشيخ الإمام الحافظ زين الدين عبد الرحيم بن الحسين العراقي المتوفى سنة ٨٠٥هـ؛ لخص فيه كتاب علوم الحديث لابن الصلاح وعبر عنه بلفظ الشيخ وزاد عليه، وفرغ عنها بطيبة في جمادى الآخرة سنة ٧٦٨هـ، أولها: يقول راجي ربه المقتدر عبد الرحيم بن الحسين الأثري {cite:kashf-zunun-furqan p. 593}."
  en: "Al-Iraqi's Alfiyya — the thousand-verse epitome of Ibn al-Salah's Ulum al-Hadith with additions, finished at Medina in Jumada al-Akhira AH 768 {cite:kashf-zunun-furqan p. 593}."
  es: "Al-Iraqi's Alfiyya: el epítome de mil versos del Ulum al-Hadith de Ibn al-Salah con adiciones, terminado en Medina en Jumada al-Akhira AH 768 AH 768 {citar:kashf-zunun-furqan p. 593}."
  fr: "Alfiyya d'Al-Iraqi — la quintessence en mille versets de l'Ulum al-Hadith d'Ibn al-Salah avec des ajouts, terminé à Médine à Jumada al-Akhira AH 768 {cite: kashf-zunun-furqan p. 593}."
  ur: "العراقی کی الفیہ - ابن الصلاح کی علم الحدیث کی ہزار آیتوں پر مشتمل اضافت کے ساتھ، مدینہ منورہ میں جمعۃ الآخری ہجری 768 میں ختم ہوئی۔ 593}۔"
  tr: "Şeyh İmam el-Hafız Zeyndin Abdülrahim bin el-Hüseyin el-Iraki'nin 805 Hâm'de vefat etmesiyle birlikte; bu kitapta İbn el-Salah'ın 'Ulum al-Hadis' kitabını özetledi, Şeyh'in ifadesiyle ifade etti, ekledi ve 768 Hicri yılında Teyyibe'de Cemade el-Ahirah'da tamamladı. Başlangıç şöyledir: Yüce Rab'in umutlu Yüce Abdülrahim bin el-Hüseyin el-Athari şöyle der: {atıf:kaşf-zunun-furqan, s. 593}."
  id: "oleh Sheikh Imam al-Hafiz Zain al-Din Abdul Rahim bin al-Husayn al-Iraqi, yang wafat pada tahun 805 H; dalam buku itu, ia merangkum buku 'Ulum al-Hadith' karya Ibn al-Salah, mengungkapkannya dengan kata-kata Sheikh, menambahkannya, dan menyelesaikannya dalam Tayyibah di Jumada al-Akhirah pada tahun 768 H. Awalnya adalah: Harapan Tuhan-Nya, Yang Maha Kuasa Abd al-Rahim ibn al-Husayn al-Athari, berkata {cite:kashf-zunun-furqan, hlm. 593}."
