structure: "كتب على أبواب الفقه، أولها كتاب الطهارة (143 باباً، الأحاديث 1–390؛ ط. دار ابن حزم ج1 ص 15–193) ثم كتاب الصلاة (367 باباً و1165 حديثاً على ما في صفحة عنوانه؛ ج1 ص 195 وما بعدها)، وفيه أبواب المواقيت والمساجد والأذان والجماعة والإمامة وصفة الصلاة والسهو وتفريع أبواب الجمعة والعيدين والاستسقاء والكسوف (ج1 ص 197–493)؛ وعدد الكتب 35 والأحاديث 5274 في عدّ محمد محيي الدين عبد الحميد (ج1 ص 8)، و43 كتاباً في ترقيم موقع سنة.كوم."
