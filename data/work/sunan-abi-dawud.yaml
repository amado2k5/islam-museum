label: { ar: "سنن أبي داود", en: "Sunan Abi Dawud", ur: "سنن ابی داؤد" }
summary:
  ar: "سنن أبي داود سليمان بن الأشعث السجستاني (202–275هـ): من الكتب الستة، رتبه مصنفه على أبواب الفقه مقتصراً على أحاديث الأحكام؛ يقول إنه انتخبه من خمسمائة ألف حديث كتبها فجمع فيه أربعة آلاف وثمانمائة حديث «الصحيح وما يشبهه وما يقاربه»، ويعدّ معدّا طبعة دار ابن حزم كتبه خمسة وثلاثين كتاباً وأحاديثه 5274 حديثاً، وعليه شرح الخطابي «معالم السنن» {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 8} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10} {cite:sunan-abi-dawud}."
  en: "The Sunan of Abu Dawud Sulayman ibn al-Ash'ath al-Sijistani (202–275 AH): one of the six books, arranged by legal chapter and restricted to reports bearing on rulings; he says he selected it from five hundred thousand reports he had written down, gathering 4,800 of them, 'the sound, what resembles it and what comes near it'; the editors of the Dar Ibn Hazm edition count 35 books and 5,274 reports, and al-Khattabi's Ma'alim al-Sunan is its commentary {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 8} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10} {cite:sunan-abi-dawud}."
  ur: "ابو داؤد سلیمان بن اشعث سجستانی (202–275ھ) کی سنن: کتبِ ستہ میں سے، جسے مصنف نے فقہی ابواب پر مرتب کیا اور احکام کی احادیث تک محدود رکھا؛ وہ کہتے ہیں کہ انہوں نے پانچ لاکھ لکھی ہوئی حدیثوں میں سے اسے چنا اور اس میں چار ہزار آٹھ سو حدیثیں جمع کیں، «صحیح، اس کے مشابہ اور اس کے قریب»؛ دار ابن حزم کے ایڈیشن کے مرتبین اس کی کتابیں پینتیس اور احادیث 5274 شمار کرتے ہیں، اور خطابی کی «معالم السنن» اس کی شرح ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 8} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10} {cite:sunan-abi-dawud}۔"
