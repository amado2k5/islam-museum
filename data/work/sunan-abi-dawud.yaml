  ar: "سنن أبي داود سليمان بن الأشعث السجستاني (202–275هـ): من الكتب الستة، رتبه مصنفه على أبواب الفقه مقتصراً على أحاديث الأحكام، وقدم في رسالته إلى أهل مكة بيان منهجه فيما أخرجه وما تركه."
  en: "The Sunan of Abu Dawud Sulayman ibn al-Ash'ath al-Sijistani (202–275 AH): one of the six books, arranged by legal chapter and restricted to reports bearing on rulings; his letter to the people of Mecca, prefixed to the work, explains what he included and omitted."
