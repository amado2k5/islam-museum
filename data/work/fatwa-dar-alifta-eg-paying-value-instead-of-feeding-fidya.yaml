label: { ar: "حكم استبدال الإطعام بالقيمة في فدية الحج", en: "Paying the value instead of feeding in the Hajj expiation", ur: "حج کی فدیہ میں کھانا کھلانے کے بدلے قیمت دینا", es: "Pagar el valor en lugar de contribuir a la expiación del Hajj.", fr: "Payer la valeur au lieu de verser l'expiation du Hajj", tr: "Hac fidya'da beslenmenin değerle değiştirilmesine ilişkin karar", id: "Putusan tentang penggantian pemberian makan dengan nilai dalam Haji Fidya" }
summary:
  ar: "سائل سأل عن استبدال الإطعام بالقيمة في فدية الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20763)⁩ أنه إذا وجبت الفدية على المحرم جراء ما ارتكبه من محظورات خلال فترة الإحرام فله الخيار على ما فصّل الجواب."
  en: "A questioner asked about paying the value instead of feeding in the Hajj expiation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20763) answered that once the fidya falls due on a pilgrim for breaches of ihram he has the choice set out in the answer."
  ur: "ایک سائل نے حج کی فدیہ میں کھانے کے بدلے قیمت دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20763)⁩ نے جواب دیا کہ محرم پر محظورات کی وجہ سے فدیہ واجب ہو تو اس کا اختیار جواب میں بیان ہوا۔"
  es: "Un peregrino preguntó sobre la posibilidad de pagar la fidya en lugar de la comida como expiación durante el Hajj. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20763) respondió que, una vez que vence el plazo para pagar la fidya a un peregrino por incumplimiento del ihram, este tiene la opción que se indica en la respuesta."
  fr: "Un pèlerin a demandé s'il était possible de payer la fidya au lieu de l'offrir en guise d'expiation pour le Hajj. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20763) a répondu que lorsqu'une fois la fidya due par un pèlerin pour violation de l'ihram, celui-ci a le choix indiqué dans la réponse."
  tr: "Bir soru soran kişi, Hac fidyasında yemin değerle değiştirilmesini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 20763), İhram döneminde yapılan yasaklar nedeniyle hacı için fidye zorunluysa, cevabında detaylandırıldığı gibi seçeneği olduğunu söyledi."
  id: "Seorang penanya menanyakan tentang penggantian pemberian makan dengan nilai dalam fidya Haji. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 20763) menjawab bahwa jika fidya wajib bagi jamaah karena larangan yang dilakukan selama masa Ihram, maka ia memiliki pilihan sebagaimana dijelaskan dalam jawaban."
