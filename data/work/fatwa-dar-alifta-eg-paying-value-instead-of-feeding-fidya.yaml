summary:
  ar: "سائل سأل عن استبدال الإطعام بالقيمة في فدية الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20763)⁩ أنه إذا وجبت الفدية على المحرم جراء ما ارتكبه من محظورات خلال فترة الإحرام فله الخيار على ما فصّل الجواب."
  en: "A questioner asked about paying the value instead of feeding in the Hajj expiation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20763) answered that once the fidya falls due on a pilgrim for breaches of ihram he has the choice set out in the answer."
  ur: "ایک سائل نے حج کی فدیہ میں کھانے کے بدلے قیمت دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20763)⁩ نے جواب دیا کہ محرم پر محظورات کی وجہ سے فدیہ واجب ہو تو اس کا اختیار جواب میں بیان ہوا۔"
