id: work/fatwa-dar-alifta-eg-fasting-in-rajab
class: work
kind: fatwa
label: { ar: "حكم صيام شهر رجب", en: "Fasting in the month of Rajab", ur: "رجب کے مہینے میں روزے کا حکم", es: "Ayuno en el mes de Rajab", fr: "Jeûne du mois de Rajab", tr: "Rajab ayında oruç tutma kararı", id: "Putusan tentang puasa pada bulan Rajab" }
summary:
  ar: "سائل سأل عن صيام شهر رجب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22377)⁩ أنه يستحب الإكثار من الأعمال الصالحة في رجب ومن ضمنها الصيام لما ورد من مضاعفة الثواب فيه، ويستحب صيام بعض أيامه، على ما فصّل الجواب."
  en: "A questioner asked about fasting in Rajab. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22377) answered that it is recommended to multiply good works in Rajab — fasting among them — for what is reported of multiplied reward in it, and it is recommended to fast some of its days, as the answer details."
  ur: "ایک سائل نے رجب میں روزے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22377)⁩ نے جواب دیا کہ رجب میں نیک کاموں کی کثرت مستحب ہے جن میں روزہ بھی ہے، اس میں ثواب کی مضاعفت وارد ہوئی ہے، اور اس کے بعض دنوں کا روزہ مستحب ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el ayuno en Rajab. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22377) respondió que se recomienda multiplicar las buenas obras en Rajab, incluido el ayuno, por la recompensa multiplicada que se reporta en este mes, y se recomienda ayunar algunos de sus días, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le jeûne durant le mois de Rajab. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22377) a répondu qu'il est recommandé de multiplier les bonnes actions durant Rajab, notamment le jeûne, en raison de la récompense abondante qui y est attribuée, et qu'il est conseillé de jeûner certains jours, comme le précise la réponse."
  tr: "Bir soru soran kişi Rajab ayında oruç tutmayı sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22377), Rajab'da oruç da dahil olmak üzere iyi işlerin artırılmasının önerildiğini, bunun için oranın katlanmış ödülünden bahsedildiğini ve cevapta ayrıntılı olarak belirtildiği gibi, bazı günlerinde oruç tutmanın önerildiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang puasa pada bulan Rajab. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22377) menjawab bahwa disarankan untuk meningkatkan perbuatan baik dalam Rajab, termasuk puasa, seperti yang dilaporkan tentang ganjaran yang melipatgandakan di dalamnya, dan disarankan untuk berpuasa beberapa hari, seperti yang dijelaskan dalam jawaban."
