label: { ar: "حكم المسح على الخف خشية البرد في الشتاء", en: "Wiping over leather socks for fear of winter cold", ur: "سردی کے خوف سے موزوں پر مسح کا حکم" }
summary:
  ar: "سائل سأل عن المسح على الخفين خشية البرد في الشتاء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22291)⁩ أنه يجوز للمسلم أن يترخص بالمسح على الخفين خشية البرد شريطة أن يلبسهما بعد كمال الطهارة التامة، على ما فصّل الجواب من شروط المسح."
  en: "A questioner asked about wiping over leather socks (khuffs) for fear of the winter cold. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22291) answered that a Muslim may take the licence to wipe over the khuffs for fear of cold, provided they were put on after complete purification, under the wiping conditions the answer details."
  ur: "ایک سائل نے سردی کے خوف سے موزوں پر مسح کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22291)⁩ نے جواب دیا کہ مسلمان سردی کے خوف سے موزوں پر مسح کی رخصت لے سکتا ہے بشرطیکہ انہیں مکمل طہارت کے بعد پہنا ہو، جواب کے بیان کردہ مسح کی شرائط کے مطابق۔"
