label: { ar: "آداب الرجوع من الحج", en: "The etiquettes of returning from Hajj", ur: "حج سے واپسی کے آداب" }
summary:
  ar: "سائل سأل عن آداب العائد من الحج. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21936)⁩ أن الآداب المرعية للعائد كثيرة من أهمها التعجيل بالرجوع إلى أهله والدعاء وإخبار أهله بقدومه ليستعدوا لاستقباله على ما فصّل الجواب."
  en: "A questioner asked about the etiquettes of one returning from Hajj. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21936) answered that the observed etiquettes are many — chiefly hastening back to one's family, supplicating, and informing them of one's arrival so they prepare to receive him — as the answer details."
  ur: "ایک سائل نے حج سے واپس آنے والے کے آداب پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21936)⁩ نے جواب دیا کہ متعدد آداب ہیں جن میں اہم یہ ہیں کہ وہ اپنے گھر والوں کی طرف جلدی واپس آئے، دعا کرے اور آمد کی خبر دے تاکہ وہ استقبال کی تیاری کریں — جیسا کہ جواب میں تفصیل ہے۔"
