id: work/fatwa-iifa-s6-housing-finance
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن التمويل العقاري لبناء المساكن وشرائها", en: "IIFA resolution on real-estate financing for building and buying homes", ur: "اکیڈمی کی قرارداد: رہائش مالیات", es: "Resolución de la IIFA sobre financiación inmobiliaria para la construcción y compra de viviendas." }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩ بعد تأجيل الدورة الخامسة: المسكن من الحاجات الأساسية للإنسان يوفر بالطرق المشروعة بمال حلال، وطريقة البنوك العقارية والإسكانية من الإقراض بفائدة قلّت أو كثرت محرمة شرعًا لما فيها من الربا، وعدّد طرقًا مشروعة يستغنى بها عنها على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990), after the fifth session's deferral: housing is among a person's basic needs and should be provided lawfully; the method of real-estate and housing banks of lending at interest, little or much, is forbidden as riba, and it lists the lawful alternatives that replace it."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ رہائش مالیات پر: سودی قرض دینے والی ہاؤسنگ بینکنگ حرام؛ شرعی متبادل طریقے بتائے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990), tras el aplazamiento de la quinta sesión: la vivienda se encuentra entre las necesidades básicas de una persona y debe proporcionarse legalmente; el método de los bancos inmobiliarios y de vivienda de conceder préstamos con interés, ya sea bajo o alto, está prohibido por considerarse usura, y enumera las alternativas legales que lo sustituyen."
