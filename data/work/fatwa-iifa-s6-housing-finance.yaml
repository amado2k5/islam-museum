label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن التمويل العقاري لبناء المساكن وشرائها", en: "IIFA resolution on real-estate financing for building and buying homes", ur: "اکیڈمی کی قرارداد: رہائش مالیات", es: "Resolución de la IIFA sobre financiación inmobiliaria para la construcción y compra de viviendas.", fr: "Résolution de l'IIFA sur le financement immobilier pour la construction et l'achat de logements", tr: "Uluslararası İslami Fiqh Akademisi'nin ev inşası ve satın alma için gayrimenkul finansmanı ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai pembiayaan properti untuk pembangunan dan pembelian rumah" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السادسة ⁦(جدة، مارس 1990م)⁩ بعد تأجيل الدورة الخامسة: المسكن من الحاجات الأساسية للإنسان يوفر بالطرق المشروعة بمال حلال، وطريقة البنوك العقارية والإسكانية من الإقراض بفائدة قلّت أو كثرت محرمة شرعًا لما فيها من الربا، وعدّد طرقًا مشروعة يستغنى بها عنها على ما فصّل."
  en: "IIFA's sixth-session resolution (Jeddah, March 1990), after the fifth session's deferral: housing is among a person's basic needs and should be provided lawfully; the method of real-estate and housing banks of lending at interest, little or much, is forbidden as riba, and it lists the lawful alternatives that replace it."
  ur: "اکیڈمی کی چھٹی مجلس کی قرارداد ⁦(جدہ، مارچ 1990ء)⁩ رہائش مالیات پر: سودی قرض دینے والی ہاؤسنگ بینکنگ حرام؛ شرعی متبادل طریقے بتائے۔"
  es: "Resolución de la sexta sesión de la IIFA (Yeda, marzo de 1990), tras el aplazamiento de la quinta sesión: la vivienda se encuentra entre las necesidades básicas de una persona y debe proporcionarse legalmente; el método de los bancos inmobiliarios y de vivienda de conceder préstamos con interés, ya sea bajo o alto, está prohibido por considerarse usura, y enumera las alternativas legales que lo sustituyen."
  fr: "Résolution de la sixième session de l'IIFA (Djeddah, mars 1990), après le report de la cinquième session: le logement fait partie des besoins fondamentaux d'une personne et doit être fourni légalement; la méthode des banques immobilières et de logement consistant à prêter à intérêt, faible ou élevé, est interdite comme riba, et elle énumère les alternatives légales qui la remplacent."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin beşinci oturumun ertelenmesinden sonra altıncı oturumunda (Cidde, Mart 1990) kararı: Konut, yasal yollarla yasal servetle sağlanan temel insan ihtiyaçlarından biridir ve düşük veya yüksek faizli emlak ve konut bankalarının kredi verme yöntemi, söz konusu tefecilik nedeniyle dini olarak yasaktır ve ayrıntılı olarak vazgeçilebilecek meşru yöntemleri sayılmıştır."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keenamnya (Jeddah, Maret 1990) setelah penundaan sesi kelima: Perumahan adalah salah satu kebutuhan dasar manusia yang disediakan melalui cara yang sah berupa kekayaan yang sah, dan metode bank properti serta perumahan untuk meminjamkan dengan bunga rendah atau tinggi secara agama dilarang secara agama karena riba yang terlibat, dan metode tersebut menyebutkan metode sah yang dapat dihilangkan secara rinci."
