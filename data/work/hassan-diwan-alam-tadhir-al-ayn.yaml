label: { ar: "قصيدة حسان «ألم تذر العين تسهادها»", en: "Hassan's poem 'Does the eye not shed its sleeplessness?'", es: "El poema de Hassan: \"¿Acaso el ojo no se deshace de su insomnio?\"", fr: "Le poème de Hassan: « L’œil ne se débarrasse-t-il pas de son insomnie ? »", ur: "حسن کی نظم 'کیا آنکھ اپنی بے خوابی نہیں اتارتی؟'", tr: "Hassan'ın şiiri 'Göz sessizliğini bırakmadı mı?'", id: "Puisi Hassan 'Bukankah mata meninggalkan keheningannya?'" }
summary:
  ar: "قصيدة لحسان بن ثابت من المتقارب على روي الدال، مطلعها كما في شرح البرقوقي {{cite:sharh-diwan-hassan-barquqi-1929 p.137}}؛ وتذكر الطبعة بحرها في رأسها."
  en: "A poem by Hassan ibn Thabit in the mutaqarib metre on the rhyme الدال, as in al-Barquqi's commentary, which states the metre in its heading {{cite:sharh-diwan-hassan-barquqi-1929 p.137}}."
  es: "Un poema de Hassan ibn Thabit en métrica mutaqarib con rima الدال, como en el comentario de al-Barquqi, que indica la métrica en su título {{cita:sharh-diwan-hassan-barquqi-1929 p.137}}."
  fr: "Un poème de Hassan ibn Thabit au mètre mutaqarib sur la rime الدال, comme dans le commentaire d'al-Barquqi, qui indique le mètre dans son titre {{cite:sharh-diwan-hassan-barquqi-1929 p.137}}."
  ur: "الدال پر متقریب میٹر میں حسن بن ثابت کی ایک نظم، جیسا کہ البرقی کی تفسیر میں ہے، جس کے عنوان {{حوالہ:شرح دیوان-حسن برقوی-1929 صفحہ 137}} میں میٹر بیان کیا گیا ہے۔"
  tr: "Hasan ibn Tabit'in Al-Mutakarāb 'ala Rawi al-Dal'dan bir şiiri, al-Barquqi'nin yorumunda olduğu gibi başlar {{cite:sharh-diwan-hassan-barquqi-1929 s.137}}; baskıda ölçüsü en üst kısımda belirtilir."
  id: "Sebuah puisi oleh Hassan ibn Thabit dari Al-Mutaqarāb 'ala Rawi al-Dal, dimulai seperti dalam komentar al-Barquqi {{cite:sharh-diwan-hassan-barquqi-1929 hlm.137}}; edisi ini menyebutkan meternya di bagian atas."
