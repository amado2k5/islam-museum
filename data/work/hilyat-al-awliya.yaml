structure: "مقدمة المؤلف في نعوت الأولياء والتصوف (ج1 ص 3–28)، ثم تراجم مرقمة متصلة الترقيم: الصحابة من المهاجرين بدءاً بأبي بكر (ج1 ص 28)، ثم التابعون وتابعوهم من الزهاد والعباد والعلماء، إلى طبقات الصوفية المتأخرين (الجزء العاشر من رقم 457 أحمد بن أبي الحواري). في نشرة دار الكتب العلمية عشرة أجزاء."
