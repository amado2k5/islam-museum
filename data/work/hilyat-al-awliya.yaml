label: { ar: "حلية الأولياء وطبقات الأصفياء", en: "Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym)", ur: "حلیۃ الاولیاء و طبقات الاصفیاء ⁦(ابو نعیم)⁩" }
summary:
  ar: "كتاب أبي نعيم الأصفهاني ⁦(ت 430هـ)⁩ في تراجم من يسميهم أعلام المتحققين من المتصوفة وأئمتهم، مرتبين طبقات من الصحابة والتابعين وتابعيهم ومن بعدهم، يورد في كل ترجمة أخبار صاحبها وأقواله وبعض أحاديثه بالأسانيد؛ وفي مقدمته يذكر نعوت الأولياء بالأحاديث، واشتقاق التصوف، وأقوال شيوخه في حده، ويقول إنه ألّفه ليبرّئ المحققين من الكذابين المتشبهين بهم {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
  en: "Abu Nu'aym al-Isfahani's (d. 430 AH) book of notices on those he calls the leading genuine Sufis and their imams, arranged in generations from the Companions, Successors and their followers onward. Each notice gives the person's reports, sayings and some of his hadith with chains. In his introduction he sets out the marks of God's friends from hadith, the derivation of the word tasawwuf and his masters' definitions of it, and says he wrote the book to clear the genuine from the liars who imitate them {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
  ur: "ابو نعیم اصفہانی ⁦(وفات 430ھ)⁩ کی کتاب، جس میں ان لوگوں کے تراجم ہیں جنہیں وہ محقق صوفیہ کے اعلام اور ائمہ کہتے ہیں، صحابہ، تابعین، تبع تابعین اور بعد کے لوگوں کے طبقات کی ترتیب سے۔ ہر ترجمے میں صاحبِ ترجمہ کے احوال، اقوال اور کچھ احادیث سند کے ساتھ لائی جاتی ہیں۔ مقدمے میں وہ احادیث سے اولیاء کی صفات، لفظِ تصوف کا اشتقاق اور اپنے شیوخ کے ہاں اس کی تعریفیں بیان کرتے ہیں، اور کہتے ہیں کہ انہوں نے یہ کتاب محققین کو ان کی نقل کرنے والے جھوٹوں سے الگ کرنے کے لیے لکھی {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}۔"
