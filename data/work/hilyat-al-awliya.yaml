label: { ar: "حلية الأولياء وطبقات الأصفياء", en: "Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym)", ur: "حلیۃ الاولیاء و طبقات الاصفیاء ⁦(ابو نعیم)⁩", tr: "Azizlerin Süsleri ve Seçilmişlerin Sınıfları", id: "Ornamen Para Santo dan Kelas Orang Terpilih" }
summary:
  ar: "كتاب أبي نعيم الأصفهاني ⁦(ت 430هـ)⁩ في تراجم من يسميهم أعلام المتحققين من المتصوفة وأئمتهم، مرتبين طبقات من الصحابة والتابعين وتابعيهم ومن بعدهم، يورد في كل ترجمة أخبار صاحبها وأقواله وبعض أحاديثه بالأسانيد؛ وفي مقدمته يذكر نعوت الأولياء بالأحاديث، واشتقاق التصوف، وأقوال شيوخه في حده، ويقول إنه ألّفه ليبرّئ المحققين من الكذابين المتشبهين بهم {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
  en: "Abu Nu'aym al-Isfahani's (d. 430 AH) book of notices on those he calls the leading genuine Sufis and their imams, arranged in generations from the Companions, Successors and their followers onward. Each notice gives the person's reports, sayings and some of his hadith with chains. In his introduction he sets out the marks of God's friends from hadith, the derivation of the word tasawwuf and his masters' definitions of it, and says he wrote the book to clear the genuine from the liars who imitate them {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
  ur: "ابو نعیم اصفہانی ⁦(وفات 430ھ)⁩ کی کتاب، جس میں ان لوگوں کے تراجم ہیں جنہیں وہ محقق صوفیہ کے اعلام اور ائمہ کہتے ہیں، صحابہ، تابعین، تبع تابعین اور بعد کے لوگوں کے طبقات کی ترتیب سے۔ ہر ترجمے میں صاحبِ ترجمہ کے احوال، اقوال اور کچھ احادیث سند کے ساتھ لائی جاتی ہیں۔ مقدمے میں وہ احادیث سے اولیاء کی صفات، لفظِ تصوف کا اشتقاق اور اپنے شیوخ کے ہاں اس کی تعریفیں بیان کرتے ہیں، اور کہتے ہیں کہ انہوں نے یہ کتاب محققین کو ان کی نقل کرنے والے جھوٹوں سے الگ کرنے کے لیے لکھی {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}۔"
  es: "El libro de Abu Nu'aym al-Isfahani (m. 430 AH) contiene notas sobre aquellos a quienes llama los principales sufíes genuinos y sus imanes, ordenados por generaciones desde los Compañeros, Sucesores y sus seguidores en adelante. Cada nota presenta los informes, dichos y algunos de sus hadices con cadenas de transmisión. En su introducción, expone las características de los amigos de Dios según los hadices, la derivación de la palabra tasawwuf y las definiciones de sus maestros, y afirma que escribió el libro para distinguir a los genuinos de los mentirosos que los imitan {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/3-4} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
  fr: "Le livre d'Abu Nu'aym al-Isfahani (mort en 430 AH) présente des notices sur ceux qu'il considère comme les principaux soufis authentiques et leurs imams, classés par générations depuis les Compagnons, leurs successeurs et leurs disciples. Chaque notice rapporte les enseignements, les paroles et certains hadiths du soufi concerné, avec leurs chaînes de transmission. Dans son introduction, il expose les caractéristiques des amis de Dieu à partir des hadiths, l'étymologie du terme « tasawwuf » et les définitions qu'en ont données ses maîtres. Il explique avoir écrit ce livre pour distinguer les authentiques des imposteurs qui les imitent."
  tr: "Ebu Nu'eym el-İsfahani'nin (ö. 430 Hicri) kitabı, Sufi âlimleri ve imamları arasında en seçkin alimler olarak adlandırdığı biyografileri hakkında, Sahabeler, Takipçiler, onların Takipçileri ve onlardan sonra gelenler kategorilerine göre düzenlenmiştir. Her biyografide, rivayetleri, sözlerini ve bazı hadislerini aktarım zincirleriyle birlikte içerir; girişinde, hadislere dayanan azizlerin niteliklerini, tasavvufun kökenlerini ve kendi sınırlarındaki öğretmenlerinin sözlerini belirtir ve bunu, onları taklit eden yalancılardan aklananları aklamak için yazdığını söyler {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
  id: "Kitab Abu Nu'aym al-Isfahani (wafat 430 H) tentang biografi mereka yang ia sebut ulama paling terkemuka di antara ulama Sufi dan imam mereka, yang diatur dalam kategori Para Sahabat, Pengikut, Pengikut, dan mereka yang datang setelahnya. Dalam setiap biografi, ia memasukkan narasi, perkataan, dan beberapa hadits dengan rantai transmisi; dalam pengantarnya, ia menyebutkan sifat-sifat wali berdasarkan hadits, turunan Sufisme, dan perkataan gurunya dalam batas-batasnya, dan mengatakan ia menyusunnya untuk membebaskan para pemberi dari pembohong yang meniru mereka {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 1/17-28}."
