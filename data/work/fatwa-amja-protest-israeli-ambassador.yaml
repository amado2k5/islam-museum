label: { ar: "التعبير عن الاحتجاج بالمعروف", en: "Protesting a speaker, by what is good", ur: "احتجاج بھی معروف کے طریقے سے", es: "Protestar contra un orador, por lo que es bueno", fr: "Protester contre un orateur, par ce qui est bon" }
summary:
  ar: "سأل سائل عن ما صدر من طلبة مسلمين أثناء محاضرة للسفير الإسرائيلي مايكل أورين بجامعة كاليفورنيا إيرفين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81116 بتاريخ 9 مارس 2010)⁩ أن الأمر بالمعروف ينبغي أن يكون بالمعروف وإنكار المنكر لا ينبغي أن يكون بالمنكر، وقد تتضرر الدعوة مما ذكر أكثر مما تنتفع، ولهذه المجتمعات وسائلها في تبليغ الكلمة وإعلان الاحتجاج والخروج عنها يضع أصحابه في دائرة الشذوذ والنكارة في حس العامة ممن نريد أن يصل إليهم صوتنا ونحشد مشاعرهم للحق المضيع من أمتنا، وأرجو أن يراجعوا أنفسهم ويأتمروا بينهم بمعروف ويصححوا أوضاعهم لجولة مقبلة."
  en: "A questioner asked about what Muslim students did during a lecture by the Israeli ambassador Michael Oren at UC Irvine. Dr. Salah al-Sawi (fatwa no. 81116, 9 March 2010) answered that enjoining good must itself be good and denouncing wrong should not be done with wrong; dawa may be harmed by what he described more than it benefits; these societies have their own channels for conveying a message and registering protest, and stepping outside them puts the actors in the circle of aberrance and notoriety in the public sense of the very people they want to reach — he hoped they would review themselves, consult one another on what is right, and correct their standing for the next round. Recorded as AMJA's answer."
  ur: "ایک سائل نے یو سی ارون میں اسرائیلی سفیر کی تقریر کے دوران مسلم طلبہ کے احتجاج کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81116، 9 مارچ 2010)⁩ کے مطابق منکر کا انکار منکر سے نہ ہو؛ سماج کے معمول کے ذرائع سے احتجاج درج کرانا چاہیے تاکہ دعوت متاثر نہ ہو۔"
  es: "Un participante preguntó sobre la actuación de los estudiantes musulmanes durante una conferencia del embajador israelí Michael Oren en la Universidad de California en Irvine. El Dr. Salah al-Sawi (fatwa n.º 81116, 9 de marzo de 2010) respondió que ordenar el bien debe ser en sí mismo bueno y que denunciar el mal no debe hacerse con el mal; la dawa puede verse más perjudicada que beneficiada por lo que describió; estas sociedades tienen sus propios canales para transmitir un mensaje y manifestar su protesta, y salirse de ellos coloca a los actores en el círculo de la aberración y la mala fama ante la opinión pública de las mismas personas a las que pretenden llegar. Esperaba que reflexionaran sobre sí mismos, consultaran entre sí sobre lo que es correcto y rectificaran su postura para la siguiente ronda. Registrada como respuesta de AMJA."
  fr: "Lors d'une conférence donnée par l'ambassadeur israélien Michael Oren à l'Université de Californie à Irvine, un participant a interrogé le Dr Salah al-Sawi sur le comportement des étudiants musulmans. Ce dernier (fatwa n° 81116, 9 mars 2010) a répondu que le bien doit être en soi un acte de bien et que dénoncer le mal ne doit pas s'accompagner du mal. Il a ajouté que la da'wa pourrait être davantage desservie que servie par ce qu'il a décrit. Ces communautés disposent de leurs propres canaux de communication et d'expression, et s'en écarter expose les acteurs à l'exclusion et à la notoriété auprès du public même qu'ils cherchent à atteindre. Il a exprimé l'espoir qu'ils s'examineraient, se consulteraient sur les bonnes pratiques et ajusteraient leur position pour la suite. Cette réponse a été consignée dans l'AMJA."
