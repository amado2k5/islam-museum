id: work/fatwa-amja-protest-israeli-ambassador
class: work
kind: fatwa
label: { ar: "التعبير عن الاحتجاج بالمعروف", en: "Protesting a speaker, by what is good", ur: "احتجاج بھی معروف کے طریقے سے" }
summary:
  ar: "سأل سائل عن ما صدر من طلبة مسلمين أثناء محاضرة للسفير الإسرائيلي مايكل أورين بجامعة كاليفورنيا إيرفين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81116 بتاريخ 9 مارس 2010)⁩ أن الأمر بالمعروف ينبغي أن يكون بالمعروف وإنكار المنكر لا ينبغي أن يكون بالمنكر، وقد تتضرر الدعوة مما ذكر أكثر مما تنتفع، ولهذه المجتمعات وسائلها في تبليغ الكلمة وإعلان الاحتجاج والخروج عنها يضع أصحابه في دائرة الشذوذ والنكارة في حس العامة ممن نريد أن يصل إليهم صوتنا ونحشد مشاعرهم للحق المضيع من أمتنا، وأرجو أن يراجعوا أنفسهم ويأتمروا بينهم بمعروف ويصححوا أوضاعهم لجولة مقبلة."
  en: "A questioner asked about what Muslim students did during a lecture by the Israeli ambassador Michael Oren at UC Irvine. Dr. Salah al-Sawi (fatwa no. 81116, 9 March 2010) answered that enjoining good must itself be good and denouncing wrong should not be done with wrong; dawa may be harmed by what he described more than it benefits; these societies have their own channels for conveying a message and registering protest, and stepping outside them puts the actors in the circle of aberrance and notoriety in the public sense of the very people they want to reach — he hoped they would review themselves, consult one another on what is right, and correct their standing for the next round. Recorded as AMJA's answer."
  ur: "ایک سائل نے یو سی ارون میں اسرائیلی سفیر کی تقریر کے دوران مسلم طلبہ کے احتجاج کے بارے میں پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81116، 9 مارچ 2010)⁩ کے مطابق منکر کا انکار منکر سے نہ ہو؛ سماج کے معمول کے ذرائع سے احتجاج درج کرانا چاہیے تاکہ دعوت متاثر نہ ہو۔"
