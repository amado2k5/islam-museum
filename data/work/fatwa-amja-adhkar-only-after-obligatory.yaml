id: work/fatwa-amja-adhkar-only-after-obligatory
class: work
kind: fatwa
label: { ar: "أذكار الأدبار للمكتوبة فقط", en: "The after-prayer adhkar belong to the obligatory prayers", ur: "نمازوں کے بعد کے اذکار صرف فرضوں کے", es: "Las súplicas posteriores a la oración pertenecen a las oraciones obligatorias.", fr: "Les adhkar après la prière font partie des prières obligatoires." }
summary:
  ar: "سأل سائل هل تشرع الأذكار التي تقال دبر الصلوات المفروضة بعد صلاة النفل أيضًا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87638 بتاريخ 25 أكتوبر 2012)⁩ أن هذه الأذكار قد وردت في أدبار الصلوات المكتوبة فتقيد بها ناقلة استفتاء اللجنة الدائمة للإفتاء ببلاد الحرمين وجوابها بذلك على ما فصّل الجواب."
  en: "A questioner asked whether the adhkar said after the obligatory prayers are legislated after sunna prayers too. AMJA's fatwa committee (fatwa no. 87638, 25 October 2012) answered that these adhkar came tied to the prescribed prayers and stay restricted to them, quoting the Permanent Committee for Ifta in the Two Holy Precincts asked this very question and answering likewise — as the answer sets out."
  ur: "اذکار نوافل کے بعد بھی؟ لجنة الفتوى ⁦(فتویٰ 87638، 25 اکتوبر 2012)⁩ کے مطابق یہ فرضوں سے مقید ہیں — اللجنة الدائمة کا فتویٰ منقول۔"
  es: "Un consultante preguntó si los adhkar que se recitan después de las oraciones obligatorias también se aplican después de las oraciones sunna. El comité de fatwas de AMJA (fatwa n.° 87638, 25 de octubre de 2012) respondió que estos adhkar están vinculados a las oraciones prescritas y se limitan a ellas, citando al Comité Permanente para Ifta en los Dos Recintos Sagrados, que formuló esta misma pregunta y respondió de la misma manera, como se expone en la respuesta."
  fr: "Un internaute a demandé si les invocations (adhkar) récitées après les prières obligatoires étaient également prescrites après les prières sunna. Le comité des fatwas de l'AMJA (fatwa n° 87638, 25 octobre 2012) a répondu que ces invocations étaient liées aux prières prescrites et devaient s'y limiter, citant le Comité permanent pour la fatwa des Deux Saints Lieux saints qui avait posé cette même question et y avait répondu de la même manière, comme indiqué dans la réponse."
