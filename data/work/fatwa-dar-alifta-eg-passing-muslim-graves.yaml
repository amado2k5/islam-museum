id: work/fatwa-dar-alifta-eg-passing-muslim-graves
class: work
kind: fatwa
label: { ar: "ما يقال عند المرور على مقابر المسلمين", en: "What is said when passing Muslim graves", ur: "مسلمانوں کی قبرستانوں سے گزرتے وقت کیا کہا جائے", es: "¿Qué se dice al pasar junto a tumbas musulmanas?", fr: "Que dit-on en passant devant des tombes musulmanes ?", tr: "Müslüman mezarlarının yanından geçerken ne denir", id: "Apa yang dikatakan saat melewati makam Muslim" }
summary:
  ar: "سائل سأل عما يقال عند المرور على مقابر المسلمين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21877)⁩ أنه يسن للمار بالمقابر أن يسلم على أهلها بالدعاء المأثور على ما فصّل الجواب."
  en: "A questioner asked what is said when passing the graves of Muslims. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21877) answered that it is commended for the passer-by to greet the people of the graves with the transmitted supplication — as the answer details."
  ur: "ایک سائل نے مسلمانوں کی قبروں سے گزرتے وقت کیا کہا جائے پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21877)⁩ نے جواب دیا کہ گزرنے والے کے لیے قبروں والوں کو منقولہ دعا کے ساتھ سلام کرنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó qué se dice al pasar junto a las tumbas de los musulmanes. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21877) respondió que es recomendable que el transeúnte salude a los difuntos con la súplica transmitida, tal como se detalla en la respuesta."
  fr: "Un internaute a demandé ce qu'il convient de dire en passant devant les tombes de musulmans. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21877) a répondu qu'il est recommandé au passant de saluer les défunts en récitant l'invocation transmise, comme le précise la réponse."
  tr: "Bir soru soran kişi, Müslüman mezarlıklarının yanından geçerken ne söylendiğini sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21877), mezarlıklardan geçenlerin ailelerini verilen duayla selamlamalarının tavsiye edildiğini yanıtladı; bu dua cevapta detaylandırıldı."
  id: "Seorang penanya bertanya apa yang dikatakan saat melewati pemakaman Muslim. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21877) menjawab bahwa disarankan bagi mereka yang melewati pemakaman untuk menyapa keluarga mereka dengan doa yang telah ditentukan, sebagaimana dijelaskan dalam jawaban."
