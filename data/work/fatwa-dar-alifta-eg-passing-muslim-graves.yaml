label: { ar: "ما يقال عند المرور على مقابر المسلمين", en: "What is said when passing Muslim graves", ur: "مسلمانوں کی قبرستانوں سے گزرتے وقت کیا کہا جائے" }
summary:
  ar: "سائل سأل عما يقال عند المرور على مقابر المسلمين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21877)⁩ أنه يسن للمار بالمقابر أن يسلم على أهلها بالدعاء المأثور على ما فصّل الجواب."
  en: "A questioner asked what is said when passing the graves of Muslims. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21877) answered that it is commended for the passer-by to greet the people of the graves with the transmitted supplication — as the answer details."
  ur: "ایک سائل نے مسلمانوں کی قبروں سے گزرتے وقت کیا کہا جائے پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21877)⁩ نے جواب دیا کہ گزرنے والے کے لیے قبروں والوں کو منقولہ دعا کے ساتھ سلام کرنا مستحب ہے — جیسا کہ جواب میں تفصیل ہے۔"
