id: work/fatwa-amja-covid-death-martyr
class: work
kind: fatwa
label: { ar: "هل المتوفى بمرض كورونا شهيد؟", en: "Is one who dies of COVID-19 a martyr?", ur: "کیا کورونا سے فوت ہونے والا شہید ہے؟", es: "¿Es mártir a quien muere de COVID-19?" }
summary:
  ar: "سؤال: هل المتوفى بمرض كورونا شهيد؟ أجابت اللجنة الدائمة للإفتاء بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 87743 بتاريخ 30 مارس 2020)⁩ أن الشهداء قسمان: شهيد الدنيا والآخرة وهو من قتل في المعركة فيُدفن بثيابه بلا غسل ولا صلاة، وشهيد الآخرة فقط الذي لا تُطبق عليه أحكام الشهداء في الغسل والكفن والصلاة لكن له ثوابهم في الآخرة؛ وأن من مات بمرض كورونا له أجر الشهيد في الآخرة — دخولًا في قوله ⁦(المطعون شهيد)⁩ على قول من وسع الطاعون ليشمل الأوبئة المميتة، وفي قوله ⁦(الميت بذات الجنب شهيد)⁩ على قول من عمّم لكل وجع في الرئتين، مستشهدة بكلام ابن القيم في زاد المعاد."
  en: "A question: is one who dies of COVID-19 a martyr? The permanent fatwa committee of the Assembly of Muslim Jurists of America (fatwa no. 87743, 30 March 2020) answered that martyrs are of two kinds: the martyr of this world and the next — the battle-killed who is buried in his clothes unwashed and unprayed over — and the martyr of the hereafter alone, who does not receive the martyrs' worldly rites but has their reward; and that one who dies of COVID-19 has a martyr's reward in the hereafter, falling under the saying 'the plague-stricken is a martyr' for those who extend plague to all deadly epidemics, and under 'one who dies of pleurisy is a martyr' for those who generalise to every chest pain, citing Ibn al-Qayyim in Zad al-Ma'ad."
  ur: "سوال: کیا کورونا سے فوت ہونے والا شہید ہے؟ ایسملی آف مسلم جورسٹس آف امریکہ کی مستقل کمیٹی برائے افتاء ⁦(فتویٰ نمبر 87743، 30 مارچ 2020)⁩ نے جواب دیا کہ شہید دو قسم کے ہیں: دنیا اور آخرت کا شہید — میدانِ جنگ میں مارا گیا جسے غسل اور نمازِ جنازہ کے بغیر کپڑوں میں دفنایا جاتا ہے — اور صرف آخرت کا شہید جس پر شہداء کے دنیاوی احکام جاری نہیں مگر ان کا ثواب ملتا ہے؛ اور کورونا سے مرنے والے کو آخرت میں شہید کا اجر ہے — اس قول میں داخل کہ 'طاعون میں مرنے والا شہید ہے' ان کے نزدیک جو طاعون کو تمام مہلک امراض تک پھیلاتے ہیں، اور 'ذات الجنب سے مرنے والا شہید ہے' ان کے نزدیک جو ہر سینے کے درد پر اسے عام کرتے ہیں — ابن القیم کے زاد المعاد کے قول سے استشہاد کے ساتھ۔"
  es: "Una pregunta: ¿es mártir quien muere de COVID-19? El comité permanente de fatwas de la Asamblea de Juristas Musulmanes de América (fatwa n.º 87743, 30 de marzo de 2020) respondió que los mártires son de dos tipos: el mártir de este mundo y del próximo —el muerto en batalla que es enterrado con su ropa sin lavar y sin que se haya rezado por él— y el mártir del más allá, que no recibe los ritos mundanos de los mártires pero sí su recompensa; y que quien muere de COVID-19 tiene la recompensa de un mártir en el más allá, según el dicho «el afligido por la peste es un mártir» para quienes extienden la peste a todas las epidemias mortales, y según el dicho «quien muere de pleuresía es un mártir» para quienes generalizan a todo dolor de pecho, citando a Ibn al-Qayyim en Zad al-Ma'ad."
