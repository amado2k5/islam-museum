summary:
  ar: "الألبوم الاستوديو الثاني عشر ليوسف إسلام، المعروف سابقا باسم كات ستيفنز، صدر في نوفمبر 2006 عن «يا» مع بوليدور وأتلانتيك؛ أول ألبوم بوب غربي له منذ 1978 وأول ألبوم باسم «يوسف»، بلغ المرتبة الثانية في النمسا وألمانيا والعشرين في المملكة المتحدة."
  en: "The twelfth studio album by Yusuf, formerly known as Cat Stevens, released in November 2006 on Ya with Polydor and Atlantic; his first Western pop album since 1978 and his first under the name Yusuf, it reached number 2 in Austria and Germany and number 20 in the United Kingdom."
  ur: "یوسف اسلام ⁦(پہلے کیٹ اسٹیونز)⁩ کا بارہواں اسٹوڈیو البم، نومبر 2006 میں «یا» لیبل سے پولیڈور اور اٹلانٹک کے ساتھ جاری ہوا؛ 1978 کے بعد ان کا پہلا مغربی پاپ البم اور «یوسف» نام سے پہلا البم، جو آسٹریا اور جرمنی میں دوسرے اور برطانیہ میں بیسویں نمبر تک پہنچا۔"
