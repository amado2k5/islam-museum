summary:
  ar: "ترجمة إنجليزية جديدة للقرآن مع تفسير مفصّل، حرّرها سيد حسين نصر رئيسًا للتحرير مع كانر داغلي وماريا ماسي داكاكي وجوزيف لمبارد محررين عامين ومحمد رستم محررًا مساعدًا، ونشرتها هاربر وَن في الولايات المتحدة سنة 2015 في 2048 صفحة؛ استغرق إعدادها عشر سنوات، وتجمع في حواشيها أقوال تفاسير قديمة كثيرة سنية وشيعية، وتضم مقالات في موضوعات القرآن؛ اشترط نصر أن يكون فريقها مسلمين من طلابه، واستقبلها كثيرون بالترحيب، وتحفّظ عليها آخرون."
  en: "A new English translation of the Qur'an with extensive commentary, edited by Seyyed Hossein Nasr as editor-in-chief with Caner K. Dagli, Maria Massi Dakake and Joseph E. B. Lumbard as general editors and Mohammed Rustom as assistant editor, published in the United States by HarperOne in 2015 in 2,048 pages; ten years in the making, its notes gather the readings of many classical Sunni and Shia commentaries, and it adds essays on Qur'anic themes; Nasr made it a condition that the team be Muslims and his former students, and it was widely welcomed, with some reservations voiced."
  ur: "قرآن کا نیا انگریزی ترجمہ مع مفصل تفسیر، مدیرِ اعلیٰ سید حسین نصر، عمومی مدیران کینر داغلی، ماریا ماسی داکاکے اور جوزف لمبارڈ، معاون مدیر محمد رستم؛ ہارپر وَن نے امریکہ میں 2015 میں 2048 صفحات میں شائع کیا؛ دس سال کی محنت، حواشی میں بہت سی قدیم سنی و شیعہ تفاسیر کے اقوال، اور قرآنی موضوعات پر مقالات؛ نصر کی شرط تھی کہ ٹیم مسلمان اور ان کے شاگرد ہوں؛ بہت سوں نے خیرمقدم کیا اور بعض نے تحفظات ظاہر کیے۔"
