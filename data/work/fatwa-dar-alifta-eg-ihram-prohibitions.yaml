id: work/fatwa-dar-alifta-eg-ihram-prohibitions
class: work
kind: fatwa
label: { ar: "دليل محظورات الإحرام", en: "The prohibitions of ihram", ur: "احرام کی ممنوعات کا رہنما", es: "Las prohibiciones del ihram", fr: "Les interdictions de l'ihram", tr: "İhram yasaklarına rehber", id: "Panduan larangan Ihram" }
summary:
  ar: "سائل سأل عن دليل محظورات الإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23945)⁩ بأن للإحرام محظورات يجب على المحرم اجتناب فعلها ما دام محرمًا، منها ما يشترك فيه الرجال والنساء كالتطيب في البدن، ومنها ما يختص بالرجال وما يختص بالنساء، وعدّد الجواب هذه المحظورات بالتفصيل."
  en: "A questioner asked for a guide to the prohibitions of ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23945) answered that ihram has prohibitions a pilgrim must avoid while in it: some shared by men and women, such as perfuming the body; others specific to men and others specific to women — the answer enumerates them in detail."
  ur: "ایک سائل نے احرام کی ممنوعات کا رہنما مانگا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23945)⁩ نے جواب دیا کہ احرام کی کئی ممنوعات ہیں جن سے محرم کو جب تک احرام کی حالت میں ہے بچنا لازم ہے: کچھ مردوں اور خواتین میں مشترک ہیں جیسے بدن کو خوشبو لگانا، کچھ مردوں کے لیے اور کچھ خواتین کے لیے مخصوص ہیں — جواب میں ان کی تفصیلی گنتی کی گئی۔"
  es: "Un consultante solicitó una guía sobre las prohibiciones del ihram. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23945) respondió que el ihram tiene prohibiciones que un peregrino debe evitar mientras se encuentra en él: algunas son comunes a hombres y mujeres, como perfumar el cuerpo; otras son específicas de los hombres y otras específicas de las mujeres; la respuesta las enumera en detalle."
  fr: "Un pèlerin a demandé un guide sur les interdits de l'ihram. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 23945) a répondu que l'ihram comporte des interdits que le pèlerin doit respecter: certains communs aux hommes et aux femmes, comme se parfumer; d'autres spécifiques aux hommes et d'autres encore aux femmes – la réponse les énumère en détail."
  tr: "Bir soru soran kişi, İhram yasaklarına dair kanıtlar hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammed Ayad, Fetva No. 23945), İhram'da bulunan kişinin ihramda olduğu sürece kaçınması gereken yasaklar olduğunu yanıtladı. Bazıları vücutta parfüm gibi erkekler ve kadınlar arasında paylaşılıyor, bazıları ise erkeklere ve kadınlara özgü. Cevap bu yasakları ayrıntılı olarak sıralıyor."
  id: "Seorang penanya menanyakan tentang bukti larangan Ihram. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 23945) menjawab bahwa Ihram memiliki larangan yang harus dihindari oleh orang yang berada di Ihram selama ia masih di Ihram. Beberapa dilarang dimiliki oleh pria dan wanita, seperti parfum pada tubuh, dan beberapa khusus untuk pria dan wanita. Jawabannya mencantumkan larangan ini secara rinci."
