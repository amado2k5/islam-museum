label: { ar: "دليل محظورات الإحرام", en: "The prohibitions of ihram", ur: "احرام کی ممنوعات کا رہنما" }
summary:
  ar: "سائل سأل عن دليل محظورات الإحرام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23945)⁩ بأن للإحرام محظورات يجب على المحرم اجتناب فعلها ما دام محرمًا، منها ما يشترك فيه الرجال والنساء كالتطيب في البدن، ومنها ما يختص بالرجال وما يختص بالنساء، وعدّد الجواب هذه المحظورات بالتفصيل."
  en: "A questioner asked for a guide to the prohibitions of ihram. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23945) answered that ihram has prohibitions a pilgrim must avoid while in it: some shared by men and women, such as perfuming the body; others specific to men and others specific to women — the answer enumerates them in detail."
  ur: "ایک سائل نے احرام کی ممنوعات کا رہنما مانگا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23945)⁩ نے جواب دیا کہ احرام کی کئی ممنوعات ہیں جن سے محرم کو جب تک احرام کی حالت میں ہے بچنا لازم ہے: کچھ مردوں اور خواتین میں مشترک ہیں جیسے بدن کو خوشبو لگانا، کچھ مردوں کے لیے اور کچھ خواتین کے لیے مخصوص ہیں — جواب میں ان کی تفصیلی گنتی کی گئی۔"
