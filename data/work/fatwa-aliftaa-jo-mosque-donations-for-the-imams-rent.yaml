label: { ar: "دفع إيجار سكن الإمام من تبرعات المسجد", en: "Paying the imam's rent from mosque donations", ur: "مسجد کے عطیات سے امام کے مکان کا کرایہ ادا کرنا", es: "Pagar el alquiler del imán con las donaciones a la mezquita.", fr: "Payer le loyer de l'imam grâce aux dons à la mosquée", tr: "Caminin bağışlarından İmam ikametgahının kirasının ödenmesi", id: "Pembayaran sewa kediaman Imam dari sumbangan masjid" }
summary:
  ar: "سؤال عن دفع إيجار سكن إمام المسجد خارج المسجد من صندوق التبرعات، أجابت فيه دائرة الإفتاء العام الأردنية بأن التبرعات تُصرف بحسب ما جُمعت له، وأن للجنة رعاية المسجد أن تستأجر سكنًا للإمام بموافقة مدير الأوقاف. أجابت الدائرة بأن ما تجمعه لجنة رعاية المسجد باسم نفقات المسجد وإصلاحاته كالموقوف عليه، ويراعى فيه شرط المتبرع ما لم يخالف الشريعة. وقسمت ما يوقف للمسجد إلى ما يخص ذات المسجد كالفرش والأدوات والكتب وعمارته، وما يوقف لمصلحة القائمين عليه كسكن الإمام والمؤذن، فإن جُمعت التبرعات لمصلحة القائمين عليه جاز صرفها في سكن الإمام بإذن ناظر الوقف، وهو وزارة الأوقاف وتنوب عنها لجنة الرعاية. وإن لم تبين اللجنة للناس الغرض، فالأمر لما تراه اللجنة مفوضة من الوزارة مع مراعاة مصلحة المسجد ومرافقه، واستحسنت أن تجمع التبرعات باسم مصالح المسجد. وذكرت أن المادة 25 من نظام المساجد ودور القرآن رقم 95 لسنة 2004 تتيح للجنة أمورًا أخرى يوافق عليها المدير خطيًا، فيمكنها مراجعة مدير الأوقاف للحصول على الموافقة على استئجار سكن للإمام."
  en: "A question on paying the rent of an imam's home outside the mosque from the donations box, in which Jordan's General Iftaa Department answered that donations are spent according to what they were collected for, and that the mosque committee may rent a home for the imam with the approval of the awqaf director. The Department answered that what the mosque care committee collects in the name of the mosque's costs and repairs is treated like an endowment for the mosque, and the donor's stipulation is followed unless it contradicts the sharia. It divided what is endowed for a mosque into what serves the mosque itself, such as carpets, equipment, books and its building, and what serves those who run it, such as the imam's or muezzin's home; donations collected for the latter may be spent on the imam's home with the permission of the endowment's administrator, the Ministry of Awqaf, represented by the committee. If the committee did not tell people the purpose, the matter is left to the committee, as delegated by the ministry, with regard to the interests of the mosque and its facilities, and it recommended collecting donations in the name of 'the mosque's interests'. It noted that article 25 of the Mosques and Qur'an Houses Regulation no. 95 of 2004 lets the committee handle other matters the director approves in writing, so it may ask the awqaf director for approval to rent a home for the imam."
  ur: "مسجد سے باہر امام کے مکان کا کرایہ عطیات کے صندوق سے ادا کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ عطیات اسی مقصد میں خرچ ہوں جس کے لیے جمع کیے گئے، اور مسجد کمیٹی اوقاف کے ڈائریکٹر کی منظوری سے امام کے لیے مکان کرائے پر لے سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد کی دیکھ بھال کمیٹی جو کچھ مسجد کے اخراجات اور مرمت کے نام پر جمع کرتی ہے وہ مسجد پر وقف کی طرح ہے، اور اس میں عطیہ دہندہ کی شرط کا لحاظ رکھا جاتا ہے جب تک شریعت کے خلاف نہ ہو۔ اس نے مسجد کے لیے وقف کو دو قسموں میں تقسیم کیا: جو خود مسجد کے لیے ہو جیسے فرش، سامان، کتابیں اور تعمیر، اور جو اس کے منتظمین کے لیے ہو جیسے امام یا مؤذن کا مکان؛ دوسری قسم کے لیے جمع کیے گئے عطیات ناظرِ وقف، یعنی وزارتِ اوقاف جس کی نمائندگی کمیٹی کرتی ہے، کی اجازت سے امام کے مکان پر خرچ ہو سکتے ہیں۔ اگر کمیٹی نے لوگوں کو مقصد نہ بتایا ہو تو معاملہ وزارت کی طرف سے مجاز کمیٹی کی رائے پر ہے، مسجد اور اس کی سہولیات کے مفاد کا لحاظ رکھتے ہوئے، اور اس نے پسند کیا کہ عطیات 'مسجد کے مصالح' کے نام پر جمع کیے جائیں۔ اس نے ذکر کیا کہ 2004 کے مساجد و دور القرآن ضابطہ نمبر 95 کی دفعہ 25 کمیٹی کو ایسے دیگر امور کی اجازت دیتی ہے جنہیں ڈائریکٹر تحریری طور پر منظور کرے، لہٰذا وہ امام کے لیے مکان کرائے پر لینے کی منظوری کے لیے اوقاف کے ڈائریکٹر سے رجوع کر سکتی ہے۔"
  es: "Una pregunta sobre el pago del alquiler de la casa de un imán fuera de la mezquita con las donaciones, a lo que el Departamento General de Iftaa de Jordania respondió que las donaciones se gastan según el propósito para el que fueron recaudadas, y que el comité de la mezquita puede alquilar una casa para el imán con la aprobación del director de awqaf. El Departamento respondió que lo que el comité de mantenimiento de la mezquita recauda en nombre de los gastos y reparaciones de la mezquita se considera una dotación para la mezquita, y se respeta la estipulación del donante a menos que contradiga la sharia. Dividió lo que se dota para una mezquita en lo que sirve a la mezquita misma, como alfombras, equipo, libros y su edificio, y lo que sirve a quienes la administran, como la casa del imán o del muecín; las donaciones recaudadas para esta última pueden gastarse en la casa del imán con el permiso del administrador de la dotación, el Ministerio de Awqaf, representado por el comité. Si el comité no informó a la gente sobre el propósito, el asunto queda en manos del comité, según lo delegado por el ministerio, en lo que respecta a los intereses de la mezquita y sus instalaciones, y recomendó recaudar donaciones en nombre de \"los intereses de la mezquita\". Señaló que el artículo 25 del Reglamento de Mezquitas y Casas del Corán n.° 95 de 2004 permite al comité gestionar otros asuntos que el director apruebe por escrito, por lo que puede solicitar al director de awqaf la aprobación para alquilar una vivienda para el imán."
  fr: "Concernant le paiement du loyer du logement de l'imam, situé hors de la mosquée, à partir des dons collectés, le Département général de la Iftaa de Jordanie a répondu que les dons sont utilisés conformément à leur destination et que le comité de la mosquée peut louer un logement pour l'imam avec l'accord du directeur des awqaf. Le Département a précisé que les sommes collectées par le comité d'entretien de la mosquée pour couvrir les frais et les réparations sont considérées comme une dotation pour la mosquée, et que les volontés du donateur sont respectées sauf si elles contreviennent à la charia. Il distingue deux types de dotation: celle destinée à la mosquée elle-même (tapis, équipements, livres, bâtiment) et celle destinée à ceux qui la gèrent (logement de l'imam ou du muezzin). Les dons collectés pour ce dernier point peuvent être utilisés pour le logement de l'imam avec l'autorisation du ministère des Awqaf, représenté par le comité, administrateur des awqaf. Si le comité n'a pas communiqué l'objet de la collecte, la question relève de sa compétence, conformément aux pouvoirs qui lui ont été délégués par le ministère, et ce, dans l'intérêt de la mosquée et de ses installations. Il a été recommandé de collecter des dons au nom des « intérêts de la mosquée ». Le comité a également été informé que l'article 25 du Règlement n° 95 de 2004 relatif aux mosquées et aux maisons coraniques l'autorise à traiter d'autres questions approuvées par écrit par le directeur. Il peut donc demander au directeur des awqaf l'autorisation de louer un logement pour l'imam."
  tr: "İmamın cami dışındaki ikametgahının bağış fonundan ödenmesiyle ilgili bir soru, Ürdün Genel Fetva Dairesi, bağışların kendisi için toplanan miktara göre dağıtıldığını ve Cami Bakım Komitesi'nin Vakıf Müdürünün onayıyla imam için bir konut kiralayabileceğini yanıtladı. Daire, Komite'nin cami masrafları ve onarımları için topladığı paranın vakıf fonuna benzediğini ve bağışçının durumunun, Şeriatla çelişmedikçe dikkate alındığını yanıtladı. Cami için ayrılan vakıfları, mobilya, aletler, kitaplar ve inşaat gibi caminin kendisiyle ilgili olanlar ile imamın ikametgahı ve müezzinin gibi sorumluların yararına bağışlananlar olarak ayrıldı. Bağışlar sorumluların yararına toplanırsa, vakıf sorumlusu olan ve Bakım Komitesi tarafından temsil edilen vakıf denetçisinin izniyle imamın konutunda harcanabilir. Komite amacını halka açıklamazsa, komite bakanlık tarafından yetkilendirildiğine göre caminin ve tesislerinin çıkarları dikkate alınarak yapılır ve bağışların caminin hizmetleri adına toplanması tercih edilir. 2004 tarihli Camiler ve Kur'an Evleri Kanunu No. 95'in 25. maddesinin komiteye diğer konuların müdür tarafından yazılı olarak onaylanmasına, imam için konut kiralama onayı almak üzere Vakıf Müdürü'ne başvurmasına olanak tanıdığını belirtti."
  id: "Sebuah pertanyaan tentang pembayaran sewa kediaman imam di luar masjid dari dana donasi, di mana Departemen Fatwa Umum Yordania menjawab bahwa donasi dicairkan sesuai dengan apa yang telah dikumpulkan untuknya, dan Komite Perawatan Masjid dapat menyewakan tempat tinggal imam dengan persetujuan Direktur Wakaf. Departemen menjawab bahwa apa yang dikumpulkan Komite untuk biaya dan perbaikan masjid sama seperti dana wakaf, dan kondisi donor diperhitungkan kecuali bertentangan dengan Syariah. Mereka membagi apa yang didanai untuk masjid menjadi apa yang berkaitan dengan masjid itu sendiri, seperti furnitur, alat, buku, dan pembangunannya, serta apa yang didanai untuk kepentingan pihak yang bertanggung jawab seperti kediaman imam dan muezzin. Jika donasi dikumpulkan untuk kepentingan pihak yang bertanggung jawab, maka dapat dibelanjakan di kediaman imam dengan izin pengawas wakaf, yang merupakan Kementerian Wakaf dan diwakili oleh Komite Perawatan. Jika komite tidak menjelaskan tujuan kepada masyarakat, maka sesuai dengan kewenangan kementerian, dengan mempertimbangkan kepentingan masjid dan fasilitasnya, dan akan lebih baik jika donasi dikumpulkan atas nama layanan masjid. Ia menyebutkan bahwa Pasal 25 Undang-Undang Masjid dan Rumah Al-Qur'an No. 95 tahun 2004 memungkinkan komite untuk menyetujui hal lain secara tertulis oleh direktur, sehingga dapat mendekati Direktur Wakaf untuk mendapatkan persetujuan menyewa rumah bagi imam."
