id: work/fatwa-aliftaa-jo-mosque-donations-for-the-imams-rent
class: work
kind: fatwa
label: { ar: "دفع إيجار سكن الإمام من تبرعات المسجد", en: "Paying the imam's rent from mosque donations", ur: "مسجد کے عطیات سے امام کے مکان کا کرایہ ادا کرنا" }
summary:
  ar: "سؤال عن دفع إيجار سكن إمام المسجد خارج المسجد من صندوق التبرعات، أجابت فيه دائرة الإفتاء العام الأردنية بأن التبرعات تُصرف بحسب ما جُمعت له، وأن للجنة رعاية المسجد أن تستأجر سكنًا للإمام بموافقة مدير الأوقاف. أجابت الدائرة بأن ما تجمعه لجنة رعاية المسجد باسم نفقات المسجد وإصلاحاته كالموقوف عليه، ويراعى فيه شرط المتبرع ما لم يخالف الشريعة. وقسمت ما يوقف للمسجد إلى ما يخص ذات المسجد كالفرش والأدوات والكتب وعمارته، وما يوقف لمصلحة القائمين عليه كسكن الإمام والمؤذن، فإن جُمعت التبرعات لمصلحة القائمين عليه جاز صرفها في سكن الإمام بإذن ناظر الوقف، وهو وزارة الأوقاف وتنوب عنها لجنة الرعاية. وإن لم تبين اللجنة للناس الغرض، فالأمر لما تراه اللجنة مفوضة من الوزارة مع مراعاة مصلحة المسجد ومرافقه، واستحسنت أن تجمع التبرعات باسم مصالح المسجد. وذكرت أن المادة 25 من نظام المساجد ودور القرآن رقم 95 لسنة 2004 تتيح للجنة أمورًا أخرى يوافق عليها المدير خطيًا، فيمكنها مراجعة مدير الأوقاف للحصول على الموافقة على استئجار سكن للإمام."
  en: "A question on paying the rent of an imam's home outside the mosque from the donations box, in which Jordan's General Iftaa Department answered that donations are spent according to what they were collected for, and that the mosque committee may rent a home for the imam with the approval of the awqaf director. The Department answered that what the mosque care committee collects in the name of the mosque's costs and repairs is treated like an endowment for the mosque, and the donor's stipulation is followed unless it contradicts the sharia. It divided what is endowed for a mosque into what serves the mosque itself, such as carpets, equipment, books and its building, and what serves those who run it, such as the imam's or muezzin's home; donations collected for the latter may be spent on the imam's home with the permission of the endowment's administrator, the Ministry of Awqaf, represented by the committee. If the committee did not tell people the purpose, the matter is left to the committee, as delegated by the ministry, with regard to the interests of the mosque and its facilities, and it recommended collecting donations in the name of 'the mosque's interests'. It noted that article 25 of the Mosques and Qur'an Houses Regulation no. 95 of 2004 lets the committee handle other matters the director approves in writing, so it may ask the awqaf director for approval to rent a home for the imam."
  ur: "مسجد سے باہر امام کے مکان کا کرایہ عطیات کے صندوق سے ادا کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ عطیات اسی مقصد میں خرچ ہوں جس کے لیے جمع کیے گئے، اور مسجد کمیٹی اوقاف کے ڈائریکٹر کی منظوری سے امام کے لیے مکان کرائے پر لے سکتی ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد کی دیکھ بھال کمیٹی جو کچھ مسجد کے اخراجات اور مرمت کے نام پر جمع کرتی ہے وہ مسجد پر وقف کی طرح ہے، اور اس میں عطیہ دہندہ کی شرط کا لحاظ رکھا جاتا ہے جب تک شریعت کے خلاف نہ ہو۔ اس نے مسجد کے لیے وقف کو دو قسموں میں تقسیم کیا: جو خود مسجد کے لیے ہو جیسے فرش، سامان، کتابیں اور تعمیر، اور جو اس کے منتظمین کے لیے ہو جیسے امام یا مؤذن کا مکان؛ دوسری قسم کے لیے جمع کیے گئے عطیات ناظرِ وقف، یعنی وزارتِ اوقاف جس کی نمائندگی کمیٹی کرتی ہے، کی اجازت سے امام کے مکان پر خرچ ہو سکتے ہیں۔ اگر کمیٹی نے لوگوں کو مقصد نہ بتایا ہو تو معاملہ وزارت کی طرف سے مجاز کمیٹی کی رائے پر ہے، مسجد اور اس کی سہولیات کے مفاد کا لحاظ رکھتے ہوئے، اور اس نے پسند کیا کہ عطیات 'مسجد کے مصالح' کے نام پر جمع کیے جائیں۔ اس نے ذکر کیا کہ 2004 کے مساجد و دور القرآن ضابطہ نمبر 95 کی دفعہ 25 کمیٹی کو ایسے دیگر امور کی اجازت دیتی ہے جنہیں ڈائریکٹر تحریری طور پر منظور کرے، لہٰذا وہ امام کے لیے مکان کرائے پر لینے کی منظوری کے لیے اوقاف کے ڈائریکٹر سے رجوع کر سکتی ہے۔"
