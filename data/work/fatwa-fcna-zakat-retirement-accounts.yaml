summary:
  ar: "سؤال عن زكاة حسابات التقاعد ⁦(كحسابات 401⁦(ك)⁩ وما شابهها)⁩. أجاب المجلس الفقهي لأمريكا الشمالية ⁦(نُشر على الموقع ضمن فتاوى الزكاة)⁩، وتناول الجواب إن كانت أموال التقاعد المقيدة تزكى قبل بلوغ سن السحب، وكيفية حساب الزكاة الواجبة بحسب قابلية التصرف والرصيد."
  en: "A question on zakat for retirement accounts ⁦(401(k) plans and the like)⁩. The Fiqh Council of North America answered whether funds locked in retirement plans are zakatable before the withdrawal age is reached, and how the zakat due is computed according to accessibility and balance."
  ur: "سوال: ریٹائرمنٹ اکاؤنٹس ⁦(401 کے منصوبے وغیرہ)⁩ پر زکات۔ فقہ کونسل آف نارتھ امریکہ کے جواب میں یہ دیکھا گیا کہ آیا نکالنے کی عمر سے پہلے بند رہنے والے ریٹائرمنٹ فنڈز پر زکات ہے اور رسائی اور بیلنس کے حساب سے واجب زکات کیسے نکالی جائے۔"
  es: "Una pregunta sobre el zakat para cuentas de jubilación (planes 401(k) y similares). El Consejo de Fiqh de Norteamérica respondió si los fondos bloqueados en planes de jubilación están sujetos a zakat antes de alcanzar la edad de retiro y cómo se calcula el zakat correspondiente según la accesibilidad y el saldo."
  fr: "Une question relative à la zakat sur les comptes de retraite (plans 401(k) et similaires) a été posée. Le Conseil de jurisprudence islamique d'Amérique du Nord a répondu à la question de savoir si les fonds bloqués dans des plans de retraite sont soumis à la zakat avant l'âge légal de retrait, et comment le montant de la zakat due est calculé en fonction de l'accessibilité et du solde."
