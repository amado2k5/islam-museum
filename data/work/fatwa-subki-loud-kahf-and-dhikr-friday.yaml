class: work
kind: fatwa
label: { ar: "الجهر بقراءة الكهف يوم الجمعة", en: "الجهر بقراءة سورة الكهف يوم الجمعة والذكر في المساجد", ur: "جمعہ کے دن سورۃ الکہف بلند آواز سے پڑھنے پر فتویٰ", es: "Recitar la Sura Al-Kahf en voz alta los viernes y participar en el recuerdo de Dios en las mezquitas.", fr: "Réciter la sourate Al-Kahf à haute voix le vendredi et se livrer au souvenir de Dieu dans les mosquées", tr: "Cuma günü Mağara'nın Yüksek Sesle Okunması", id: "Pembacaan Gua dengan Suara Keras pada hari Jumat" }
summary:
  ar: "سؤال عن الجهر بقراءة سورة الكهف يوم الجمعة والناس بين راكع وساجد وذاكر، وعن الجهر بالأوراد في المساجد. الجواب بأن الحكم الكراهة على مذهب الإمام مالك ما لم يؤد إلى تشويش."
  ur: "سوال: جمعہ کے دن سورۃ الکہف بلند آواز سے پڑھنا، جب لوگ رکوع، سجود اور ذکر میں مشغول ہوں، اور مسجد میں بلند آواز سے اوراد پڑھنے کا کیا حکم ہے؟ جواب: امام مالک کے مذہب پر یہ مکروہ ہے، جب تک خلل کا سبب نہ بنے۔"
  en: "Question on reciting Surat al-Kahf aloud on Friday while people pray and recite, and on loud litanies in mosques. The answer: on Maliki doctrine it is disliked unless it causes disturbance."
  es: "Pregunta sobre recitar la Sura Al-Kahf en voz alta los viernes mientras la gente reza y recita, y sobre las letanías en voz alta en las mezquitas. Respuesta: según la doctrina malikí, no es recomendable a menos que cause disturbios."
  fr: "Question concernant la récitation à voix haute de la sourate Al-Kahf le vendredi pendant la prière et les récitations, ainsi que concernant les litanies à voix haute dans les mosquées. Réponse: selon la doctrine malikite, cela est déconseillé, sauf si cela perturbe l’ordre public."
  tr: "Cuma günü insanlar eğilen, secde eden ve anma yapanlar arasında olduğu halde Kahf Suresi'ni yüksek sesle okunması ve camilerde ilahilerin yüksek sesle okunması hakkında bir soru. Cevap, İmam Malik okuluna göre bu hükmün karışıklığa yol açmadığı sürece hoşnutsuzluk olduğudur."
  id: "Pertanyaan tentang membacakan Surah Al-Kahf dengan lantang pada hari Jumat ketika orang-orang berada di antara mereka yang membungkuk, sujud, dan mengenang, serta tentang membacakan himne dengan lantang di masjid. Jawabannya adalah bahwa keputusan tersebut dianggap tidak disukai menurut mazhab Imam Malik selama tidak menimbulkan kebingungan."
