summary:
  ar: "سؤال عن الجهر بقراءة سورة الكهف يوم الجمعة والناس بين راكع وساجد وذاكر، وعن الجهر بالأوراد في المساجد. الجواب بأن الحكم الكراهة على مذهب الإمام مالك ما لم يؤد إلى تشويش."
  ur: "سوال: جمعہ کے دن سورۃ الکہف بلند آواز سے پڑھنا، جب لوگ رکوع، سجود اور ذکر میں مشغول ہوں، اور مسجد میں بلند آواز سے اوراد پڑھنے کا کیا حکم ہے؟ جواب: امام مالک کے مذہب پر یہ مکروہ ہے، جب تک خلل کا سبب نہ بنے۔"
  en: "Question on reciting Surat al-Kahf aloud on Friday while people pray and recite, and on loud litanies in mosques. The answer: on Maliki doctrine it is disliked unless it causes disturbance."
