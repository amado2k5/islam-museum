id: work/fatwa-dar-alifta-eg-imam-praying-without-wudu-forgetfully
class: work
kind: fatwa
label: { ar: "حكم الصلاة عند إمامة المحدث للناس ناسيًا", en: "When the imam has forgetfully led the prayer without wudu", ur: "بے وضو امام کی بھول سے امامت کرنے پر نماز" }
summary:
  ar: "سائل سأل عن إمام أُخبر بعد انتهاء الصلاة أنه صلى بالمأمومين وهو محدث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21571)⁩ أنه إذا أخبر الإمام بعد انتهاء الصلاة أنه صلى بالمأمومين وهو محدث فتلزمه هو الإعادة دونهم وهذا هو مذهب الشافعية على ما فصّل الجواب."
  en: "A questioner asked about an imam told after the prayer ended that he had led the congregation while in minor impurity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21571) answered that in that case the imam alone must repeat, not the followers — the Shafi'i position — as the answer details."
  ur: "ایک سائل نے ایسے امام کا حکم پوچھا جسے نماز کے بعد بتایا گیا کہ وہ بے وضو امامت کر رہا تھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21571)⁩ نے جواب دیا کہ شافعی مسلک کے مطابق صرف امام پر اعادہ واجب ہے نہ کہ مقتدیوں پر — جیسا کہ جواب میں تفصیل ہے۔"
