summary:
  ar: "العيون الغامزة على خبايا الرامزة، كتاب في العروض والقوافي لمؤلفه بدر الدين الدماميني، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 827هـ / 1424م {cite:waqfeya-al-uyun-al-ghamiza}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "al-Uyun al-Ghamiza ala Khabaya al-Ramiza, a book on prosody (arud and qawafi) by Badr al-Din al-Damamini; its date in a research summary supplied to the museum is d. 827 AH / 1424 CE {cite:waqfeya-al-uyun-al-ghamiza}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "العيون الغامزة على خبايا الرامزة، عروض و قوافی پر ایک کتاب، مصنف بدر الدين الدماميني؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 827ھ / 1424ء {cite:waqfeya-al-uyun-al-ghamiza}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Uyun al-Ghamiza ala Khabaya al-Ramiza, livre sur la prosodie (arud et qawafi) de Badr al-Din al-Damamini ; sa date dans une synthèse de recherche remise au musée : m. 827 H / 1424 {cite:waqfeya-al-uyun-al-ghamiza}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "al-Uyun al-Ghamiza ala Khabaya al-Ramiza, libro sobre prosodia (arud y qawafi) de Badr al-Din al-Damamini; su fecha en un resumen de investigación entregado al museo: m. 827 H. / 1424 {cite:waqfeya-al-uyun-al-ghamiza}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
  tr: "Al-'Uyoon Al-Gamza 'Ala Khabaya Al-Ramzah', yazarı Badr al-Din al-Damamini'nin prosodi ve kafiyeler üzerine yazdığı bir kitaptır ve müzeye sunulan araştırma özetine göre tarihini anlatır: ö. 827 Hicri / 1424 M.S. {kaynak: waqfeya-al-uyun-al-ghamiza}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Hayır, dosyada shamela.ws alanında yapılan aramada eşleşme bulunamadığı belirtilmiştir. Müze kitabı okumamıştır."
  id: "Al-'Uyoon Al-Gamza 'Ala Khabaya Al-Ramzah' adalah buku tentang prosodi dan rima karya penulisnya Badr al-Din al-Damamini, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 827 H / 1424 M {cite:waqfeya-al-uyun-al-ghamiza}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Tidak, berkas menyatakan bahwa pencarian di situs shamela.ws tidak menemukan kecocokan. Museum tidak membaca buku tersebut."
