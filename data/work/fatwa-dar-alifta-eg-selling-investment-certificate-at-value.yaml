summary:
  ar: "سائل سأل عن بيع شهادة استثمار بنكية على أن يدفع صاحبها قيمتها إلى المشتري. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20704)⁩ أن الاتفاق الذي يرغب فيه صاحب شهادة الاستثمار البنكية أن يبرمه مع أحد الأشخاص ببيع هذه الشهادة لا يصح شرعًا على ما فصّل الجواب."
  en: "A questioner asked about selling a bank investment certificate on the condition that its holder pay its value to the buyer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20704) answered that the arrangement is invalid in the sharia — as the answer details."
  ur: "ایک سائل نے بینک سرمایہ کاری سرٹیفکیٹ کی ایسی فروخت کا حکم پوچھا جس میں فروخت کنندہ خریدار کو اس کی قیمت ادا کرے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20704)⁩ نے جواب دیا کہ یہ معاہدہ شرعاً درست نہیں — جیسا کہ جواب میں تفصیل ہے۔"
