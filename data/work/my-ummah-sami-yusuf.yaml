id: work/my-ummah-sami-yusuf
class: work
kind: album
label: { ar: "أمتي", en: "My Ummah", ur: "مائی اُمّہ", es: "Mi Ummah", fr: "Ma Oumma", tr: "Milletim", id: "Negaraku" }
summary:
  ar: "ألبوم الاستوديو الثاني لسامي يوسف، صدر عن أوايكننغ في 6 يوليو 2005 بنسختين موسيقية وإيقاعية، وغنّى فيه بالإنجليزية والعربية والتركية والفارسية والأردية؛ اشتهرت منه «حسبي ربي» و«أمي»، وفيه انتقل من الدف إلى الآلات الغربية بعد ألبومه الأول «المعلم»، وتنسب المصادر إليه مبيعات بين خمسة وثمانية ملايين نسخة."
  en: "Sami Yusuf's second studio album, released by Awakening on 6 July 2005 in a music version and a percussion version, sung in English, Arabic, Turkish, Persian and Urdu; its best-known songs include 'Hasbi Rabbi' and 'Mother', it marked his turn to Western instrumentation, and its sales are reported at between five and eight million copies."
  ur: "سامی یوسف کا دوسرا اسٹوڈیو البم، 6 جولائی 2005 کو اویکننگ سے موسیقی اور دف والے دو ورژن میں جاری ہوا، انگریزی، عربی، ترکی، فارسی اور اردو میں؛ «حسبی ربی» اور «مدر» اس کے مشہور گیت ہیں، اور ماخذ اس کی فروخت پانچ سے آٹھ ملین نسخوں کے درمیان بتاتے ہیں۔"
  es: "El segundo álbum de estudio de Sami Yusuf, publicado por Awakening el 6 de julio de 2005 en una versión instrumental y otra de percusión, cantado en inglés, árabe, turco, persa y urdu; entre sus canciones más conocidas se encuentran 'Hasbi Rabbi' y 'Mother', marcó su giro hacia la instrumentación occidental, y se estima que sus ventas oscilan entre los cinco y los ocho millones de copias."
  fr: "Le deuxième album studio de Sami Yusuf, sorti chez Awakening le 6 juillet 2005 en version classique et en version percussions, chanté en anglais, arabe, turc, persan et ourdou; ses chansons les plus connues incluent « Hasbi Rabbi » et « Mother », il a marqué son passage à l'instrumentation occidentale, et ses ventes sont estimées entre cinq et huit millions d'exemplaires."
  tr: "Sami Youssef'in ikinci stüdyo albümü 6 Temmuz 2005'te Awakening tarafından iki versiyonda yayımlandı: müzikal ve ritmik. İngilizce, Arapça, Türkçe, Farsça ve Urduca şarkı söyledi; şarkılar, ilk albümü \"The Teacher\"dan sonra teften Batı enstrümanlarına geçiş yaptığı \"Hasbi Rabi\" ve \"Ami\" ile ünlüydü. Kaynaklar, satışların beş ila sekiz milyon arasında olduğunu belirtiyor."
  id: "Album studio kedua Sami Youssef dirilis oleh Awakening pada 6 Juli 2005, dalam dua versi: musikal dan ritmis. Ia bernyanyi dalam bahasa Inggris, Arab, Turki, Persia, dan Urdu; lagu-lagu tersebut terkenal dengan \"Hasbi Rabi\" dan \"Ami,\" di mana ia beralih dari tamborin ke alat musik Barat setelah album pertamanya \"The Teacher.\" Sumber menyebutkan penjualan antara lima hingga delapan juta kopi."
