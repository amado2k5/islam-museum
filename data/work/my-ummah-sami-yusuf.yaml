summary:
  ar: "ألبوم الاستوديو الثاني لسامي يوسف، صدر عن أوايكننغ في 6 يوليو 2005 بنسختين موسيقية وإيقاعية، وغنّى فيه بالإنجليزية والعربية والتركية والفارسية والأردية؛ اشتهرت منه «حسبي ربي» و«أمي»، وفيه انتقل من الدف إلى الآلات الغربية بعد ألبومه الأول «المعلم»، وتنسب المصادر إليه مبيعات بين خمسة وثمانية ملايين نسخة."
  en: "Sami Yusuf's second studio album, released by Awakening on 6 July 2005 in a music version and a percussion version, sung in English, Arabic, Turkish, Persian and Urdu; its best-known songs include 'Hasbi Rabbi' and 'Mother', it marked his turn to Western instrumentation, and its sales are reported at between five and eight million copies."
  ur: "سامی یوسف کا دوسرا اسٹوڈیو البم، 6 جولائی 2005 کو اویکننگ سے موسیقی اور دف والے دو ورژن میں جاری ہوا، انگریزی، عربی، ترکی، فارسی اور اردو میں؛ «حسبی ربی» اور «مدر» اس کے مشہور گیت ہیں، اور ماخذ اس کی فروخت پانچ سے آٹھ ملین نسخوں کے درمیان بتاتے ہیں۔"
