label:
  ar: نور الاقتباس في مشكاة وصية النبي لابن عباس
  en: Nur al-Iqtibas fi Mishkat Wasiyyat al-Nabi li-Ibn Abbas
summary:
  ar: "رسالة مستقلة لابن رجب الحنبلي أفردها لشرح حديث ابن عباس «يا غلام إني أعلمك كلمات: احفظ الله يحفظك...» وهو الحديث التاسع عشر من الأربعين النووية؛ يذكر ابن رجب في جامع العلوم والحكم أن الحديث يتضمن وصايا عظيمة وقواعد كلية من أهم أمور الدين «وقد أفردت لشرحه جزءاً كبيراً»، والكتاب مطبوع بهذا الاسم."
  en: "A standalone treatise by Ibn Rajab al-Hanbali devoted to the commentary of Ibn Abbas's hadith 'O boy, I shall teach you words: guard God and He will guard you...', the nineteenth of al-Nawawi's Forty; in the Jami' al-Ulum wal-Hikam Ibn Rajab says the hadith comprises great counsels and universal maxims among the religion's most important matters and that he 'devoted a large separate portion to its commentary' — the printed book bearing this title."
