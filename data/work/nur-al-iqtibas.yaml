label:
  ar: نور الاقتباس في مشكاة وصية النبي لابن عباس
  en: Nur al-Iqtibas fi Mishkat Wasiyyat al-Nabi li-Ibn Abbas
summary:
  ar: "رسالة مستقلة لابن رجب الحنبلي أفردها لشرح حديث ابن عباس «يا غلام إني أعلمك كلمات: احفظ الله يحفظك...» وهو الحديث التاسع عشر من الأربعين النووية؛ يذكر ابن رجب في جامع العلوم والحكم أن الحديث يتضمن وصايا عظيمة وقواعد كلية من أهم أمور الدين «وقد أفردت لشرحه جزءاً كبيراً»، والكتاب مطبوع بهذا الاسم."
  en: "A standalone treatise by Ibn Rajab al-Hanbali devoted to the commentary of Ibn Abbas's hadith 'O boy, I shall teach you words: guard God and He will guard you...', the nineteenth of al-Nawawi's Forty; in the Jami' al-Ulum wal-Hikam Ibn Rajab says the hadith comprises great counsels and universal maxims among the religion's most important matters and that he 'devoted a large separate portion to its commentary' — the printed book bearing this title."
  es: "Un tratado independiente de Ibn Rajab al-Hanbali dedicado al comentario del hadiz de Ibn Abbas 'Oh muchacho, te enseñaré palabras: guarda a Dios y Él te guardará...', el decimonoveno de los Cuarenta de al-Nawawi; en el Jami' al-Ulum wal-Hikam, Ibn Rajab dice que el hadiz comprende grandes consejos y máximas universales entre los asuntos más importantes de la religión y que él 'dedicó una gran parte separada a su comentario', el libro impreso que lleva este título."
  fr: "Un traité indépendant d'Ibn Rajab al-Hanbali consacré au commentaire du hadith d'Ibn Abbas « Ô garçon, je vais t'enseigner des paroles: protège Dieu et Il te protégera… », le dix-neuvième des quarante hadiths d'al-Nawawi; dans le Jami' al-Ulum wal-Hikam, Ibn Rajab affirme que ce hadith contient de grands conseils et des maximes universelles parmi les sujets les plus importants de la religion et qu'il « a consacré une grande partie à son commentaire » — le livre imprimé portant ce titre."
