summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩ في موضوع أثر الأمراض النفسية الحديثة على الأهلية. اطلع المجمع على البحوث المقدمة واستمع إلى المناقشات، وقرر تأجيل البت في الموضوع لمزيد من البحث والدراسة مع التوصية بعقد ندوة متخصصة حوله."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023) on the effect of modern psychological illnesses on legal capacity. After reviewing the submitted research and hearing the discussions, the Academy decided to defer a ruling on the matter for further research and study, recommending that a specialised seminar be held on it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، جدید نفسیاتی امراض کے اہلیت پر اثر کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات کا جائزہ اور مباحث سنے، اور موضوع پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرتے ہوئے اس پر ایک مخصوص سیمینار کے انعقاد کی سفارش کی۔"
