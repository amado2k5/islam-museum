label: { ar: "قرار مجمع الفقه الإسلامي الدولي 249 (25/11) بشأن أثر الأمراض النفسية الحديثة على الأهلية في الشريعة الإسلامية", en: "IIFA resolution 249 (25/11) on the effect of modern psychological illnesses on legal capacity in Islamic law", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 249 (25/11): شریعتِ اسلامی میں جدید نفسیاتی امراض کا اہلیت پر اثر", es: "Resolución 249 (25/11) de la IIFA sobre el efecto de las enfermedades psicológicas modernas en la capacidad jurídica en el derecho islámico.", fr: "Résolution 249 (25/11) de l'IIFA sur l'effet des maladies psychologiques modernes sur la capacité juridique en droit islamique" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩ في موضوع أثر الأمراض النفسية الحديثة على الأهلية. اطلع المجمع على البحوث المقدمة واستمع إلى المناقشات، وقرر تأجيل البت في الموضوع لمزيد من البحث والدراسة مع التوصية بعقد ندوة متخصصة حوله."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023) on the effect of modern psychological illnesses on legal capacity. After reviewing the submitted research and hearing the discussions, the Academy decided to defer a ruling on the matter for further research and study, recommending that a specialised seminar be held on it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، جدید نفسیاتی امراض کے اہلیت پر اثر کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات کا جائزہ اور مباحث سنے، اور موضوع پر فیصلہ مزید تحقیق و مطالعے کے لیے مؤخر کرتے ہوئے اس پر ایک مخصوص سیمینار کے انعقاد کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica, en su 25.ª sesión celebrada en Yeda (del 29 de Rajab al 3 de Sha'ban de 1444, del 20 al 23 de febrero de 2023), sobre el efecto de las enfermedades psicológicas modernas en la capacidad jurídica. Tras revisar la investigación presentada y escuchar los debates, la Academia decidió aplazar la decisión sobre el tema para realizar más investigaciones y estudios, recomendando la celebración de un seminario especializado al respecto."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023) sur l'incidence des troubles psychologiques modernes sur la capacité juridique. Après examen des recherches soumises et audition des participants, l'Académie a décidé de reporter sa décision sur la question afin de permettre des recherches et des études complémentaires, et a recommandé la tenue d'un séminaire spécialisé."
