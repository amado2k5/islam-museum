label: { ar: "قرار مجمع الفقه الإسلامي الدولي 230 (24/1) بشأن العقود الذكية وكيفية تفعيلها والإقالة منها ⁦(دراسة العقود الذكية ومدى ارتباطها بموضوع العملة الرقمية)⁩", en: "IIFA resolution 230 (24/1) on smart contracts, how they are activated and rescinded ⁦(a study of smart contracts and their connection to digital currency)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 230 (24/1): سمارٹ کنٹریکٹس، ان کا نفاذ اور ان کی اقالہ ⁦(سمارٹ کنٹریکٹس اور ڈیجیٹل کرنسی سے ان کا تعلق)⁩", es: "Resolución 230 (24/1) de la IIFA sobre contratos inteligentes, su activación y rescisión (un estudio sobre los contratos inteligentes y su relación con las monedas digitales).", fr: "Résolution 230 (24/1) de l'IIFA sur les contrats intelligents, leur activation et leur résiliation (étude des contrats intelligents et de leur lien avec la monnaie numérique)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 230 (24/1) akıllı sözleşmeler, nasıl etkinleştirilecekleri ve reddedilmeleri hakkında (Akıllı sözleşmelerin incelenmesi ve dijital para ile ilgili önemi)", id: "Keputusan International Islamic Fiqh Academy 230 (24/1) mengenai kontrak pintar, cara mengaktifkannya, dan penolakannya (Studi kontrak pintar dan relevansinya dengan topik mata uang digital)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الرابعة والعشرين بدبي ⁦(7–9 ربيع الأول 1441هـ، 4–6 نوفمبر 2019م)⁩. أكد المجمع قراره 52 ⁦(6/3)⁩ في حكم إجراء العقود بآلات الاتصال الحديثة بجميع فقراته وهو ينطبق على العقود الإلكترونية المستقلة عن العقود الذكية. وعرّف العقد الذكي بأنه عقد بين طرفين ينفذ تلقائيًا يقوم على فكرة الند للند ⁦(بدون وسيط)⁩ من خلال شبكة توزيع لا مركزية ⁦(سلسلة الكتل)⁩ ويتم بالعملات المرمزة ⁦(المشفرة)⁩ مثل البيتكوين وغيرها، وأنه ينفذ من خلال منصات خاصة مركزية أو عامة لا مركزية تستخدم العملات المشفرة غالبًا. وقرر تأجيل البت في الموضوع إلى حين عقد ندوة متخصصة في العقود الذكية وبعد البت في موضوع العملات المشفرة، لدراسة كافة جوانبها، مستحسنًا دعوة متخصصين تقنيين في سلسلة الكتل والعملات المشفرة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 24th session in Dubai (7–9 Rabi' I 1441, 4–6 November 2019). It reaffirmed in all its clauses its resolution 52 (6/3) on the ruling on concluding contracts by modern means of communication (sixth session, Jeddah 1410/1990), which applies to electronic contracts as distinct from smart contracts. It defined a smart contract as a self-executing contract between two parties built on the peer-to-peer idea (without an intermediary) through a decentralised distributed network (blockchain) and carried out in tokenised (cryptographic) currencies such as Bitcoin and others, executed through private centralised or public decentralised platforms that mostly use cryptocurrencies. It decided to defer a ruling pending a specialised seminar on smart contracts and a ruling on cryptographic currencies, in order to study all their aspects, recommending that technical specialists in blockchain and cryptocurrencies be invited."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں چوبیس ویں مجلس ⁦(7–9 ربیع الاول 1441ھ، 4–6 نومبر 2019ء)⁩ میں۔ اکیڈمی نے اپنی قرارداد 52 ⁦(6/3)⁩ ⁦(جدید مواصلاتی آلات کے ذریعے معاہدے کرنے کا حکم، چھٹی مجلس جدہ 1410ھ/1990ء)⁩ کو ہر شق میں دہرایا جو سمارٹ کنٹریکٹس سے الگ برقی معاہدوں پر لاگو ہے۔ اس نے سمارٹ کنٹریکٹ کی تعریف دو فریقوں کا خودکار طور پر نافذ ہونے والا معاہدہ کرنے کے طور پر کی جو ند بہ ند ⁦(بغیر واسطہ)⁩ کے اصول پر غیر مرکزی تقسیمی جال ⁦(بلاک چین)⁩ کے ذریعے اور مرموز ⁦(کرپٹوگرافک)⁩ کرنسیوں مثل بٹ کوائن میں عمل میں آتا ہے، اور جو نجی مرکزی یا عوامی غیر مرکزی پلیٹ فارمز پر نافذ ہوتا ہے جو عموماً کرپٹو کرنسیاں استعمال کرتے ہیں۔ اس نے سمارٹ کنٹریکٹس پر ایک مخصوص سیمینار اور کرپٹو کرنسیوں پر فیصلے تک رائے مؤخر کی تاکہ ان کے تمام پہلوؤں کا مطالعہ ہو، اور بلاک چین و کرپٹو کرنسی کے تکنیکی ماہرین کو بلانے کی سفارش کی۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 24.ª sesión celebrada en Dubái (7-9 de Rabi' I de 1441, 4-6 de noviembre de 2019). Reafirmó en todos sus apartados su resolución 52 (6/3) sobre la conclusión de la celebración de contratos mediante medios modernos de comunicación (sexta sesión, Yeda 1410/1990), que se aplica a los contratos electrónicos, a diferencia de los contratos inteligentes. Definió un contrato inteligente como un contrato autoejecutable entre dos partes, basado en la idea de igual a igual (sin intermediario) a través de una red distribuida descentralizada (blockchain) y ejecutado en monedas tokenizadas (criptomonedas) como Bitcoin y otras, mediante plataformas privadas centralizadas o públicas descentralizadas que utilizan principalmente criptomonedas. Decidió aplazar la decisión hasta la celebración de un seminario especializado sobre contratos inteligentes y una decisión sobre criptomonedas, con el fin de estudiar todos sus aspectos, recomendando la invitación de especialistas técnicos en blockchain y criptomonedas."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 24e session à Dubaï (7-9 Rabi' I 1441, 4-6 novembre 2019). Elle a réaffirmé, dans son intégralité, sa résolution 52 (6/3) relative à la conclusion de contrats par moyens de communication modernes (sixième session, Djeddah 1410/1990), applicable aux contrats électroniques, à l'exclusion des contrats intelligents. Elle a défini un contrat intelligent comme un contrat auto-exécutable entre deux parties, fondé sur le principe du pair-à-pair (sans intermédiaire) via un réseau distribué décentralisé (blockchain) et exécuté en cryptomonnaies telles que le Bitcoin, sur des plateformes privées centralisées ou publiques décentralisées utilisant majoritairement des cryptomonnaies. L'Académie a décidé de reporter sa décision dans l'attente d'un séminaire spécialisé sur les contrats intelligents et d'une décision sur les cryptomonnaies, afin d'en étudier tous les aspects, et a recommandé la participation de spécialistes techniques de la blockchain et des cryptomonnaies."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki 24. oturumunda (7–9 Rabi'al-Awwal 1441 H, 4–6 Kasım 2019) toplu kararı. Akademi, akıllı sözleşmelerden bağımsız elektronik sözleşmelere uygulanan modern iletişim cihazları kullanılarak sözleşmelerin yürütülmesine ilişkin 52 (6/3) sayılı kararını tüm maddelerinde onaylamıştır. Akıllı sözleşme, iki taraf arasında, aracısız bir dağıtım ağı (blokzincir) aracılığıyla otomatik olarak yürütülen ve Bitcoin gibi kripto paralarla yürütülen, genellikle kripto para kullanan merkezi özel veya kamuya açık merkeziyetsiz platformlar aracılığıyla yürütülen bir sözleşme olarak tanımlanır. Konudaki kararı, akıllı sözleşmeler üzerine özel bir seminer düzenlenene kadar ertelemeye karar verdi ve kripto paralar üzerinde karar verdikten sonra tüm yönlerini incelemek için blockchain ve kripto paralar alanında teknik uzmanların davet edilmesini önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-24 di Dubai (7–9 Rabi' al-Awwal 1441 AH, 4–6 November 2019). Akademi menegaskan Keputusan 52 (6/3) mengenai pelaksanaan kontrak menggunakan perangkat komunikasi modern dalam semua klausulnya, yang berlaku untuk kontrak elektronik yang independen dari kontrak pintar. Kontrak pintar didefinisikan sebagai kontrak antara dua pihak yang dilaksanakan secara otomatis berdasarkan gagasan peer to peer (tanpa perantara) melalui jaringan distribusi terdesentralisasi (blockchain) dan dijalankan dalam mata uang kripto seperti Bitcoin dan lainnya, serta dilaksanakan melalui platform terpusat privat atau publik terdesentralisasi yang sering menggunakan mata uang kripto. Ia memutuskan untuk menunda keputusan mengenai masalah ini sampai diadakan seminar khusus tentang kontrak pintar dan setelah memutuskan mata uang kripto untuk mempelajari semua aspeknya, merekomendasikan untuk mengundang spesialis teknis di bidang blockchain dan mata uang kripto."
