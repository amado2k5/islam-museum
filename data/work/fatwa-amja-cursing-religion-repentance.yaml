id: work/fatwa-amja-cursing-religion-repentance
class: work
kind: fatwa
label: { ar: "سب الدين ثم التوبة", en: "Cursing religion then repenting", ur: "دین کی گالی پھر توبہ", es: "Maldecir la religión y luego arrepentirse", fr: "Maudire la religion puis se repentir" }
summary:
  ar: "سأل سائل عن رجل قال لفظة سب في الدين هل تبين منه زوجته وهل سب دين الجمادات يكفر وقد نصحه بأن يغتسل ويتشهد ويندم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84229 بتاريخ 15 أبريل 2011)⁩ أن الكلمة كبيرة وهي كفر من قائلها ومثل ذلك سب دين الجمادات فما من شيء إلا يسبح بحمده، لكن الزوجة إنما تبين بالإصرار على الكفر فمن استغفر وأناب لا تبين منه زوجته ولا يطالب بتجديد عقد نكاحه فإن الصحابة لم يطلبوا من تاب من المرتدين بتجديد عقود أنكحتهم."
  en: "A questioner asked about a man who uttered a curse-word against religion — whether his wife is thereby separated, whether cursing the religion of lifeless things disbelieves, and whether advising him to wash, re-proclaim and repent suffices. Dr. Salah al-Sawi (fatwa no. 84229, 15 April 2011) answered that the word is grave — disbelief from its sayer, and likewise cursing the religion of inanimate things since everything glorifies His praise; but the wife is separated only upon persisting in disbelief: whoever seeks forgiveness and turns back, his wife is not separated and no new marriage contract is demanded, since the Companions did not demand of repenting apostates a renewal of their contracts. Recorded as AMJA's answer."
  ur: "ایک سائل نے پوچھا کہ دین کی گالی دینے والے کی بیوی اس سے جدا ہو جائے گی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84229، 15 اپریل 2011)⁩ کے مطابق کلمہ کفر ہے لیکن توبہ کرنے والے کی بیوی جدا نہیں ہوتی اور نہ نیا نکاح درکار۔"
  es: "Un consultante preguntó acerca de un hombre que profirió una blasfemia contra la religión: si su esposa queda separada por ello, si maldecir la religión de las cosas inanimadas constituye incredulidad, y si basta con aconsejarle que se lave, vuelva a proclamar su fe y se arrepienta. El Dr. Salah al-Sawi (fatwa n.° 84229, 15 de abril de 2011) respondió que la palabra es grave: incredulidad por parte de quien la pronuncia, y también maldecir la religión de las cosas inanimadas, puesto que todo glorifica Su alabanza; pero la esposa queda separada solo si persiste en la incredulidad: quien busca el perdón y se arrepiente, su esposa no queda separada y no se exige un nuevo contrato matrimonial, puesto que los Compañeros no exigieron a los apóstatas arrepentidos la renovación de sus contratos. Registrada como respuesta de AMJA."
  fr: "Un homme interrogea Salah al-Sawi (fatwa n° 84229, 15 avril 2011) au sujet d'un homme ayant proféré une injure contre la religion: sa femme est-elle alors séparée de lui ? Maudire la religion des choses inanimées constitue-t-il une athée ? Et est-il suffisant de lui conseiller de se purifier, de se convertir et de se repentir ? Salah al-Sawi répondit que la parole est grave – elle constitue une athée de la part de celui qui la prononce – et qu'il en va de même pour le fait de maudire la religion des choses inanimées, car toute chose glorifie Sa louange. La séparation de l'épouse n'intervient que si celui-ci persiste dans l'incroyance. Si quelqu'un implore le pardon et se convertit, sa femme n'est pas séparée de lui et aucun nouveau contrat de mariage n'est exigé, car les Compagnons n'ont pas exigé des apostats repentants le renouvellement de leurs contrats. Cette réponse est consignée dans la fatwa de l'AMJA."
