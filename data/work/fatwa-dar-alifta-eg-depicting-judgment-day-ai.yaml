label: { ar: "حكم تصوير يوم القيامة بالذكاء الاصطناعي", en: "Depicting the Day of Resurrection with AI", ur: "اے آئی سے روزِ قیامت کی تصویرکشی کا حکم", es: "Representación del Día de la Resurrección con IA", fr: "Représenter le jour de la Résurrection avec l'IA" }
summary:
  ar: "سائل سأل عن تصوير أحداث يوم القيامة كمشاهد مرئية عن طريق تقنيات الذكاء الاصطناعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22537)⁩ أن ذلك محرم شرعًا؛ لاشتماله على جملة من المحاذير منها ادعاء علم الغيب وتشبيه الأحداث الخارقة للإدراك البشري بما لا يليق على ما فصّل الجواب."
  en: "A questioner asked about portraying the events of the Day of Resurrection as visual scenes through AI. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22537) answered that this is forbidden in the sharia for the bundle of cautions it contains — among them claiming knowledge of the unseen and likening events beyond human perception to what does not befit them, as the answer details."
  ur: "ایک سائل نے روزِ قیامت کے واقعات کی اے آئی سے بصری منظرکشی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22537)⁩ نے جواب دیا کہ یہ شریعت میں حرام ہے، اس میں شامل متعدد محذورات کی وجہ سے — جن میں غیب کا علم کا دعویٰ اور انسانی ادراک سے ماورا واقعات کی ایسی تشبیہ جو ان کے شایان نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de representar los eventos del Día de la Resurrección como escenas visuales mediante inteligencia artificial. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22537) respondió que esto está prohibido por la sharia debido a la serie de advertencias que conlleva, entre ellas, la pretensión de conocimiento de lo invisible y la comparación de eventos que escapan a la percepción humana con algo que no les corresponde, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant la représentation des événements du Jour de la Résurrection sous forme de scènes visuelles grâce à l'intelligence artificielle. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22537) a répondu que cela est interdit par la charia en raison des nombreuses mises en garde que cela comporte; parmi celles-ci, la prétention à connaître l'invisible et l'assimilation d'événements imperceptibles à la perception humaine à ce qui ne lui sied pas, comme le précise la réponse."
