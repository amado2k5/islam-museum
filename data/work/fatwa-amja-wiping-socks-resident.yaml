id: work/fatwa-amja-wiping-socks-resident
class: work
kind: fatwa
label: { ar: "المسح على الجوربين للمقيم", en: "Wiping over socks for the resident — three days by this answer", ur: "مقیم کا جرابوں پر مسح — تین دن", es: "Limpiar los calcetines del residente — tres días por esta respuesta", fr: "Essuyer les chaussettes du résident — trois jours selon cette réponse", tr: "Sakin için çorapların ölçülmesi", id: "Memeriksa kaus kaki untuk penghuni" }
summary:
  ar: "سأل سائل عن المسح على الجوربين للمقيم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21937 بتاريخ 4 أبريل 2006)⁩ أن الجوربين ينطبق عليهما ما ينطبق على الخفين من أحكام فالمسح عليهما للمقيم جائز بشرط أن يلبسهما على طهارة وله أن يمسح عليهما ثلاثة أيام ولياليها على ما فصّل الجواب من القول بالتوسعة."
  en: "A questioner asked about wiping over socks for the resident. Dr. Salah al-Sawi (fatwa no. 21937, 4 April 2006) answered that socks fall under the khuffs' rulings: wiping them is lawful for the resident provided he put them on in purity, and he may wipe them three days and nights — the answer's chosen lenient view — as it details."
  ur: "مقیم کا جرابوں پر مسح؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21937، 4 اپریل 2006)⁩ کے مطابق طہارت سے پہنے ہوں تو تین دن جائز — توسیع کا قول۔"
  es: "Un consultante preguntó sobre la posibilidad de limpiar los calcetines del residente. El Dr. Salah al-Sawi (fatwa n.° 21937, 4 de abril de 2006) respondió que los calcetines se rigen por las normas de los khuffs: limpiarlos es lícito para el residente siempre que se los haya puesto en pureza, y puede limpiarlos durante tres días y tres noches, según la interpretación más indulgente de la respuesta, tal como se detalla."
  fr: "Un internaute a posé une question concernant le nettoyage des chaussettes du résident. Le Dr Salah al-Sawi (fatwa n° 21937, 4 avril 2006) a répondu que les chaussettes relèvent de l'avis des khuffs: le nettoyage est licite pour le résident à condition qu'il les ait enfilées en état de pureté rituelle, et il peut le faire pendant trois jours et trois nuits – l'interprétation la plus indulgente retenue dans la réponse – comme il le précise."
  tr: "Bir soru soran kişi, bir asistan için çorap silme işlemini sordu. Dr. Salah Al-Sawy (4 Nisan 2006 tarihli 21937 No. Fetva) iki çorabın çoraplarla aynı kurallara uygulandığını, bu nedenle sakin çorapları saf bir durumda giymesi koşuluyla üzerlerini silmesine izin verildiğini ve genişletme açıklamasında açıklandığı gibi üç gün ve gece boyunca silmesinin mümkün olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang mengelap kaus kaki untuk seorang residen. Dr. Salah Al-Sawy menjawab (Fatwa No. 21937 tanggal 4 April 2006) bahwa kedua kaus kaki tersebut berlaku sesuai dengan aturan yang sama dengan kaus kaki, sehingga mengelap di atasnya diperbolehkan bagi penghuni, asalkan ia memakainya dalam keadaan murni, dan ia dapat mengelap di atasnya selama tiga hari dan tiga malam, seperti yang dijelaskan dalam penjelasan mengenai perluasan."
