label: { ar: "المسح على الجوربين للمقيم", en: "Wiping over socks for the resident — three days by this answer", ur: "مقیم کا جرابوں پر مسح — تین دن" }
summary:
  ar: "سأل سائل عن المسح على الجوربين للمقيم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21937 بتاريخ 4 أبريل 2006)⁩ أن الجوربين ينطبق عليهما ما ينطبق على الخفين من أحكام فالمسح عليهما للمقيم جائز بشرط أن يلبسهما على طهارة وله أن يمسح عليهما ثلاثة أيام ولياليها على ما فصّل الجواب من القول بالتوسعة."
  en: "A questioner asked about wiping over socks for the resident. Dr. Salah al-Sawi (fatwa no. 21937, 4 April 2006) answered that socks fall under the khuffs' rulings: wiping them is lawful for the resident provided he put them on in purity, and he may wipe them three days and nights — the answer's chosen lenient view — as it details."
  ur: "مقیم کا جرابوں پر مسح؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21937، 4 اپریل 2006)⁩ کے مطابق طہارت سے پہنے ہوں تو تین دن جائز — توسیع کا قول۔"
