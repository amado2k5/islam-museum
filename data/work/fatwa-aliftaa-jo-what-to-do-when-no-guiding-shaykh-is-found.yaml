id: work/fatwa-aliftaa-jo-what-to-do-when-no-guiding-shaykh-is-found
class: work
kind: fatwa
label: { ar: "ماذا يفعل من لم يجد شيخًا مرشدًا", en: "What a seeker should do when no guiding shaykh can be found", ur: "جسے کوئی رہنما شیخ نہ ملے وہ کیا کرے", es: "Qué debe hacer un buscador cuando no se puede encontrar un shaykh que lo guíe.", fr: "Que faire lorsqu'on ne trouve aucun cheikh guide ?", tr: "Rehber bir şeyh bulamazsa ne yapmalı?", id: "Apa yang harus dilakukan jika tidak menemukan sheikh pembimbing?" }
summary:
  ar: "سؤال من طالب يبحث منذ مدة عن شيخ مرشد يعلمه السلوك والعلوم الشرعية ولم يجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الخير في الأمة كثير والعلماء المربون لا ينقطعون، وعلى طالب العلم الجد في السؤال عنهم والنيل من علومهم، وأن من لم يجد شيخًا مرشدًا فعليه بالإكثار من الصلاة والسلام على النبي مع ملازمة الذكر والعبادة والكف عن المحرمات، فإن ذلك يوصله إلى مقصوده في السير إلى الله، ناقلة عن الإمام محمد السنوسي أنه رأى لبعض أئمة التصوف أن من فقد شيوخ التربية فليكثر من الصلاة على النبي فإنه يصل بها إلى مقصوده، وعن أحمد زروق في قواعد التصوف ⁦(ص86، القاعدة 114)⁩ أن الذكر منشور الولاية، وقول شيخه أبي العباس الحضرمي بدوام الذكر وكثرة الصلاة على النبي فإنها سلّم ومعراج وسلوك إلى الله إذا لم يلق الطالب شيخًا مرشدًا."
  en: "A question from a seeker who has long searched for a guiding shaykh to teach him the spiritual path and the religious sciences and has found none; Jordan's General Iftaa Department answered that there is much good in the community and that scholars who train others never cease, so a student should search earnestly, ask after them and draw on their knowledge, and that one who finds no guiding and training shaykh should abundantly invoke blessings and peace on the Prophet while keeping to remembrance and worship and refraining from the forbidden, for this brings him to his goal on the journey to God. It quoted Imam Muhammad al-Sanusi that he had seen in the words of some masters of Sufism that whoever lacks training shaykhs should invoke blessings on the Prophet abundantly and will reach his goal by them, and Ahmad Zarruq in Qawa'id al-Tasawwuf (p. 86, rule 114) that remembrance is the charter of sainthood, with the saying of his shaykh Abu al-Abbas al-Hadrami to keep up remembrance and abundant blessings on the Prophet, these being a ladder, an ascent and a path to God when the seeker meets no guiding shaykh."
  ur: "ایک طالب کا سوال جو ایک مدت سے ایسے رہنما شیخ کی تلاش میں ہے جو اسے سلوک اور شرعی علوم سکھائے اور کوئی نہ ملا؛ اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ امت میں خیر بہت ہے اور تربیت کرنے والے علما کبھی ختم نہیں ہوتے، لہٰذا طالبِ علم پر سنجیدگی سے تلاش، ان کے بارے میں سوال اور ان کے علوم سے فیض اٹھانا لازم ہے، اور جسے کوئی رہنما اور مربی شیخ نہ ملے وہ نبی پر کثرت سے صلاۃ و سلام بھیجے، ذکر اور عبادت کی پابندی اور حرام چیزوں سے بچنے کے ساتھ، کیونکہ یہ اسے اللہ کی طرف سفر میں اس کے مقصد تک پہنچاتا ہے۔ اس نے امام محمد سنوسی سے نقل کیا کہ انہوں نے بعض ائمۂ تصوف کے کلام میں دیکھا کہ جو تربیت کرنے والے شیوخ سے محروم ہو وہ نبی پر کثرت سے صلاۃ بھیجے، وہ اس سے اپنے مقصد تک پہنچے گا، اور احمد زروق کی قواعد التصوف ⁦(ص 86، قاعدہ 114)⁩ سے کہ ذکر ولایت کا پروانہ ہے، ان کے شیخ ابو العباس حضرمی کے اس قول کے ساتھ کہ ذکر کی پابندی اور نبی پر کثرت سے صلاۃ کو لازم پکڑو، کیونکہ یہ سیڑھی، معراج اور اللہ کی طرف سلوک ہے جب طالب کو کوئی رہنما شیخ نہ ملے۔"
  es: "Ante la pregunta de un buscador que durante mucho tiempo ha buscado un shaykh que le guíe en el camino espiritual y las ciencias religiosas, sin haber encontrado ninguno, el Departamento General de Iftaa de Jordania respondió que hay mucho bien en la comunidad y que los eruditos que forman a otros nunca cesan, por lo que el estudiante debe buscar con ahínco, preguntar por ellos y recurrir a su conocimiento, y que quien no encuentre un shaykh que le guíe y le forme debe invocar abundantemente bendiciones y paz sobre el Profeta, manteniendo el recuerdo y la adoración y absteniéndose de lo prohibido, pues esto le acerca a su meta en el camino hacia Dios. Citaba al Imam Muhammad al-Sanusi, quien había visto en las palabras de algunos maestros del sufismo que quien carece de shaykhs de entrenamiento debe invocar bendiciones sobre el Profeta abundantemente y alcanzará su meta por medio de ellos, y a Ahmad Zarruq en Qawa'id al-Tasawwuf (p. 86, regla 114) que el recuerdo es la carta de la santidad, con el dicho de su shaykh Abu al-Abbas al-Hadrami de mantener el recuerdo y las abundantes bendiciones sobre el Profeta, siendo estas una escalera, un ascenso y un camino hacia Dios cuando el buscador no encuentra un shaykh que lo guíe."
  fr: "Un chercheur, qui a longtemps cherché en vain un cheikh pour le guider sur le chemin spirituel et lui enseigner les sciences religieuses, a posé la question suivante: le Département général de la sagesse (Iftaa) de Jordanie a répondu qu’il y a beaucoup de bien dans la communauté et que les savants qui forment les autres ne cessent jamais. Par conséquent, un étudiant devrait chercher avec ferveur, se renseigner auprès d’eux et s’appuyer sur leur savoir. Quant à celui qui ne trouve aucun cheikh pour le guider et le former, il devrait invoquer abondamment les bénédictions et la paix sur le Prophète, tout en se consacrant au souvenir et à l’adoration et en s’abstenant de ce qui est interdit, car c’est ainsi qu’il atteint son but sur le chemin de Dieu. Il est cité par l'imam Muhammad al-Sanusi qui a déclaré avoir vu dans les paroles de certains maîtres du soufisme que celui qui manque de cheikhs formés doit invoquer abondamment les bénédictions sur le Prophète et atteindra ainsi son but, et par Ahmad Zarruq dans Qawa'id al-Tasawwuf (p. 86, règle 114) que le souvenir est la charte de la sainteté, avec la parole de son cheikh Abu al-Abbas al-Hadrami de maintenir le souvenir et d'abondantes bénédictions sur le Prophète, ceux-ci étant une échelle, une ascension et un chemin vers Dieu lorsque le chercheur ne rencontre aucun cheikh guide."
  tr: "Bir süredir davranış ve İslami iller öğretecek rehber şeyh arayan ancak bulamayan bir öğrenciden gelen soruya karşılık, Ürdün Genel Fetva Dairesi, ulusda çok iyilik olduğunu ve eğitimli alimlerin asla bitmediğini yanıtladı. Bilgi arayan, onları ciddi şekilde sormalı ve bilgilerinden faydalanmalıdır. Rehber bulamayan kişi Peygamber'e namaz ve selamı artırmalı, sürekli anma ve ibadet yapmalı, yasak eylemlerden kaçınmalıdır; çünkü bu onu Allah'a doğru yürüme hedefine götürür. İmam Muhammed El-Sanusi'nin sözlerini aktardı Bazı tasavvuf âlimleri, eğitim öğretmenlerini kaybedenlerin Peygamber'e daha fazla bereket göndererek amacına ulaşması gerektiğine inanır. Ahmed Zerruq, Qawa'id al-Tasawwuf'ta (s. 86, kural 114) anmanın vesayetin temeli olduğunu söylemiştir. Öğretmeni Ebu el-Abbas el-Hadrami, Peygamber'e sürekli anma ve sık sık dua etmenin, öğrenci rehber bir şeyhle karşılaşmazsa bir merdiven, mi'raj ve Allah'a yolculuk olarak kabul edildiğini söylemiştir."
  id: "Sebuah pertanyaan dari seorang mahasiswa yang telah lama mencari seorang shyekh pembimbing untuk mengajarinya perilaku dan ilmu Islam tetapi belum menemukannya, Departemen Fatwa Umum Yordania menjawab bahwa ada banyak kebaikan di negara ini dan para ulama terdidik tidak pernah berhenti. Pencari ilmu harus serius dalam menanyakan tentang mereka dan mendapatkan manfaat dari pengetahuan mereka. Siapa pun yang tidak menemukan pembimbing harus meningkatkan doa dan kedamaian kepada Nabi sambil terus berkomitmen dalam mengenang dan beribadah serta menahan diri dari perbuatan terlarang, karena hal ini membawanya pada tujuan berjalan menuju Allah. Dia mengutip Imam Muhammad Al-Sanusi yang berkata Beberapa ulama Sufi percaya bahwa siapa pun yang kehilangan guru pendidikan harus meningkatkan berkah kepada Nabi untuk mencapai tujuannya. Ahmad Zarruq dalam Qawa'id al-Tasawwuf (hlm. 86, aturan 114) mengatakan bahwa peringatan adalah dasar perwalian. Gurunya Abu al-Abbas al-Hadrami mengatakan bahwa peringatan terus-menerus dan doa yang sering kepada Nabi dianggap sebagai tangga, mi'raj, dan perjalanan kepada Tuhan jika murid tidak bertemu dengan sheikh pembimbing."
