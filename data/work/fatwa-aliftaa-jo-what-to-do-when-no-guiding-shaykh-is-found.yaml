id: work/fatwa-aliftaa-jo-what-to-do-when-no-guiding-shaykh-is-found
class: work
kind: fatwa
label: { ar: "ماذا يفعل من لم يجد شيخًا مرشدًا", en: "What a seeker should do when no guiding shaykh can be found", ur: "جسے کوئی رہنما شیخ نہ ملے وہ کیا کرے" }
summary:
  ar: "سؤال من طالب يبحث منذ مدة عن شيخ مرشد يعلمه السلوك والعلوم الشرعية ولم يجد، أجابت فيه دائرة الإفتاء العام الأردنية بأن الخير في الأمة كثير والعلماء المربون لا ينقطعون، وعلى طالب العلم الجد في السؤال عنهم والنيل من علومهم، وأن من لم يجد شيخًا مرشدًا فعليه بالإكثار من الصلاة والسلام على النبي مع ملازمة الذكر والعبادة والكف عن المحرمات، فإن ذلك يوصله إلى مقصوده في السير إلى الله، ناقلة عن الإمام محمد السنوسي أنه رأى لبعض أئمة التصوف أن من فقد شيوخ التربية فليكثر من الصلاة على النبي فإنه يصل بها إلى مقصوده، وعن أحمد زروق في قواعد التصوف ⁦(ص86، القاعدة 114)⁩ أن الذكر منشور الولاية، وقول شيخه أبي العباس الحضرمي بدوام الذكر وكثرة الصلاة على النبي فإنها سلّم ومعراج وسلوك إلى الله إذا لم يلق الطالب شيخًا مرشدًا."
  en: "A question from a seeker who has long searched for a guiding shaykh to teach him the spiritual path and the religious sciences and has found none; Jordan's General Iftaa Department answered that there is much good in the community and that scholars who train others never cease, so a student should search earnestly, ask after them and draw on their knowledge, and that one who finds no guiding and training shaykh should abundantly invoke blessings and peace on the Prophet while keeping to remembrance and worship and refraining from the forbidden, for this brings him to his goal on the journey to God. It quoted Imam Muhammad al-Sanusi that he had seen in the words of some masters of Sufism that whoever lacks training shaykhs should invoke blessings on the Prophet abundantly and will reach his goal by them, and Ahmad Zarruq in Qawa'id al-Tasawwuf (p. 86, rule 114) that remembrance is the charter of sainthood, with the saying of his shaykh Abu al-Abbas al-Hadrami to keep up remembrance and abundant blessings on the Prophet, these being a ladder, an ascent and a path to God when the seeker meets no guiding shaykh."
  ur: "ایک طالب کا سوال جو ایک مدت سے ایسے رہنما شیخ کی تلاش میں ہے جو اسے سلوک اور شرعی علوم سکھائے اور کوئی نہ ملا؛ اردن کے جنرل افتاء ڈیپارٹمنٹ نے جواب دیا کہ امت میں خیر بہت ہے اور تربیت کرنے والے علما کبھی ختم نہیں ہوتے، لہٰذا طالبِ علم پر سنجیدگی سے تلاش، ان کے بارے میں سوال اور ان کے علوم سے فیض اٹھانا لازم ہے، اور جسے کوئی رہنما اور مربی شیخ نہ ملے وہ نبی پر کثرت سے صلاۃ و سلام بھیجے، ذکر اور عبادت کی پابندی اور حرام چیزوں سے بچنے کے ساتھ، کیونکہ یہ اسے اللہ کی طرف سفر میں اس کے مقصد تک پہنچاتا ہے۔ اس نے امام محمد سنوسی سے نقل کیا کہ انہوں نے بعض ائمۂ تصوف کے کلام میں دیکھا کہ جو تربیت کرنے والے شیوخ سے محروم ہو وہ نبی پر کثرت سے صلاۃ بھیجے، وہ اس سے اپنے مقصد تک پہنچے گا، اور احمد زروق کی قواعد التصوف (ص 86، قاعدہ 114) سے کہ ذکر ولایت کا پروانہ ہے، ان کے شیخ ابو العباس حضرمی کے اس قول کے ساتھ کہ ذکر کی پابندی اور نبی پر کثرت سے صلاۃ کو لازم پکڑو، کیونکہ یہ سیڑھی، معراج اور اللہ کی طرف سلوک ہے جب طالب کو کوئی رہنما شیخ نہ ملے۔"
