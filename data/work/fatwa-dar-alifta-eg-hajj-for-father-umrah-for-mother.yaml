id: work/fatwa-dar-alifta-eg-hajj-for-father-umrah-for-mother
class: work
kind: fatwa
label: { ar: "حكم الحج عن شخص والعمرة عن شخص آخر في حج القران", en: "Performing Hajj for one person and umrah for another in qiran", ur: "قران کے حج میں ایک کے لیے حج اور دوسرے کے لیے عمرہ" }
summary:
  ar: "سائل سأل: هل يجوز أن يوكّل شخصًا ليحج عن أبيه ويعتمر عن أمه قارنًا بينهما؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23895)⁩ أن ذلك جائز، وأنه يجب عليه دم القران — والهدي الواجب شاة أو سُبع بَدَنة أو بقرة — على ما فصّل الجواب."
  en: "A questioner asked whether one may appoint a person to perform Hajj for his father and umrah for his mother, combining them in qiran. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23895) answered that this is permissible, and that the qiran offering is due on him — a sheep, or a seventh of a camel or cow — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا کوئی شخص مقرر کیا جا سکتا ہے جو اس کے والد کے لیے حج اور والدہ کے لیے عمرہ کرے، دونوں کو قران میں جمع کرے؟ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23895)⁩ نے جواب دیا کہ یہ جائز ہے اور اس پر دمِ قران واجب ہے — ایک بھیڑ یا اونٹ یا گائے کا ساتواں حصہ — جیسا کہ جواب میں تفصیل ہے۔"
