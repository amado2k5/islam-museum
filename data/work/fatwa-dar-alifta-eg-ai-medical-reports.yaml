id: work/fatwa-dar-alifta-eg-ai-medical-reports
class: work
kind: fatwa
label: { ar: "حكم الاعتماد على التقارير الطبية الصادرة عن الذكاء الاصطناعي", en: "Relying on medical reports produced by AI", ur: "اے آئی کی جاری کردہ طبی رپورٹس پر انحصار کا حکم", es: "Confiar en informes médicos producidos por IA", fr: "S’appuyer sur des rapports médicaux produits par l’IA" }
summary:
  ar: "سائل سأل عن الاعتماد على التقارير الطبية الصادرة عن أنظمة الذكاء الاصطناعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22614)⁩ أن هذه التقارير إذا كانت تعمل كأداة مساعدة للطبيب البشري مع إشرافه ومتابعته ومراجعته فلا بأس بها شرعًا، وبيّن الجواب ضوابط ذلك بالتفصيل."
  en: "A questioner asked about relying on medical reports produced by AI systems. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22614) answered that where such reports work as an assistive tool for a human physician, under his supervision, follow-up and review, they are acceptable in the sharia; the answer details the governing conditions."
  ur: "ایک سائل نے اے آئی نظاموں کی جاری کردہ طبی رپورٹس پر انحصار کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22614)⁩ نے جواب دیا کہ اگر یہ رپورٹیں انسانی ڈاکٹر کے لیے معاون آلہ کے طور پر کام کریں، اس کی نگرانی، متابعت اور نظرثانی کے ساتھ، تو شرعاً ان میں کوئی حرج نہیں؛ جواب میں اس کے ضوابط تفصیل سے بیان ہوئے۔"
  es: "Un consultante preguntó sobre la conveniencia de confiar en los informes médicos generados por sistemas de IA. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22614) respondió que, cuando dichos informes sirven como herramienta de apoyo para un médico humano, bajo su supervisión, seguimiento y revisión, son aceptables según la sharia; la respuesta detalla las condiciones que lo rigen."
  fr: "Un internaute a posé une question concernant la fiabilité des rapports médicaux produits par des systèmes d'intelligence artificielle. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22614) a répondu que lorsque ces rapports servent d'outil d'aide au médecin, sous sa supervision, avec suivi et examen, ils sont acceptables selon la charia; la réponse détaille les conditions applicables."
