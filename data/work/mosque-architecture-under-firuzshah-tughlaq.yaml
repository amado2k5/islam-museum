summary:
  ar: "رسالة سيما خان ⁦(عليكره، 2011)⁩ في مساجد عهد فيروز شاه تغلق في دلهي: جامع فيروز آباد، والمسجد الأسود في نظام الدين، ومسجد القدم الشريف، ومسجد خركي، والمسجد الكبير عند بوابة تركمان، ومسجد بيگم پور، ومسجد كالو سراي {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 contents} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 95}."
  en: "Seema Khan's dissertation (Aligarh, 2011) on the mosques of Firuz Shah Tughluq's reign in Delhi: the Jami Masjid of Firuzabad, the Kali Masjid at Nizamuddin, the Qadam Sharif mosque, the Khirki Masjid, the Kalan Masjid at Turkman Gate, the Begumpur mosque and the Kalu Sarai mosque {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 contents} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 95}."
  ur: "سیما خان کا مقالہ (علی گڑھ، 2011ء) دہلی میں فیروز شاہ تغلق کے عہد کی مسجدوں پر: فیروز آباد کی جامع مسجد، نظام الدین کی کالی مسجد، قدم شریف کی مسجد، کھڑکی مسجد، ترکمان دروازے کی کلاں مسجد، بیگم پور مسجد اور کالو سرائے مسجد {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 contents} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 95}۔"
