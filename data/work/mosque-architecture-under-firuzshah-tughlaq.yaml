  es: "La disertación de Seema Khan (Aligarh, 2011) sobre las mezquitas del reinado de Firuz Shah Tughluq en Delhi: la Jami Masjid de Firuzabad, la Kali Masjid en Nizamuddin, la mezquita Qadam Sharif, la Khirki Masjid, la Kalan Masjid en Turkman Gate, la mezquita Begumpur y la mezquita Kalu Sarai {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 contents} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 95}."
  fr: "La thèse de Seema Khan (Aligarh, 2011) sur les mosquées du règne de Firuz Shah Tughluq à Delhi: la Jami Masjid de Firuzabad, la Kali Masjid à Nizamuddin, la mosquée Qadam Sharif, la Khirki Masjid, la Kalan Masjid à Turkman Gate, la mosquée Begumpur et la mosquée Kalu Sarai {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 contents} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 95}."
