id: work/fatwa-amja-adultery-sorcery-excuse
class: work
kind: fatwa
label: { ar: "الزنا والتعلل بالسحر", en: "Adultery and the plea of sorcery — the door of repentance", ur: "زنا اور جادو کا بہانہ — توبہ", es: "El adulterio y la excusa de la brujería: la puerta al arrepentimiento.", fr: "L’adultère et le recours à la sorcellerie — la porte du repentir" }
summary:
  ar: "سأل شاب في الثلاثين أن صديقته تزوجت ولم تستطع نسيانه وقامت بأنواع السحر وتمالك نفسه مرات لكنه لم يستطع. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 21825 بتاريخ 11 أبريل 2005)⁩ ألا يتعلل بشبهة السحر فإن الزنا من أكبر الكبائر ولا سيما إذا كان مع امرأة متزوجة لما يؤدي إليه من اختلاط الأنساب وإفساد الأسر وخيانة الأزواج وغير ذلك من المفاسد والشنائع، وأما التوبة فبابها مفتوح على مصراعيه وإن ربه ليبسط يده بالليل ليتوب مسيء النهار وبالنهار ليتوب مسيء الليل فليصلح ماضيه بالندم وحاضره بالإقلاع ومستقبله بالعزم على عدم العودة."
  en: "A man of thirty said a married former friend could not forget him, resorted to sorcery-kinds, and though he restrained himself repeatedly he could not hold. Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 21825, 11 April 2005) answered that he must not plead sorcery — adultery is among the greatest of major sins, and with a married woman graver still for the mixing of lineages, ruining of families and betraying of husbands it breeds; repentance's door stands wide open — God stretches His hand by night for the day's sinner and by day for the night's; let him mend his past with remorse, his present with desisting and his future with resolve never to return."
  ur: "ایک شخص نے زنا کی طرف جادو کا بہانہ پیش کیا۔ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 21825، 11 اپریل 2005)⁩ کے مطابق زنا کبیرہ ترین گناہ ہے خاص طور پر شادی شدہ سے؛ توبہ کا دروازہ کھلا ہے — ندم اقلاع اور عزم۔"
  es: "Un hombre de treinta años dijo que un antiguo amigo casado no podía olvidarlo, que recurrió a la brujería y que, aunque intentó contenerse repetidamente, no pudo retenerlo. El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.º 21825, 11 de abril de 2005) respondió que no debía alegar brujería: el adulterio es uno de los pecados más graves, y en el caso de una mujer casada, aún más grave por la mezcla de linajes, la ruina de familias y la traición a los maridos que engendra; la puerta del arrepentimiento está abierta de par en par: Dios extiende su mano de noche para el pecador de día y de día para el de noche; que enmiende su pasado con remordimiento, su presente con el arrepentimiento y su futuro con la firme resolución de no volver jamás."
  fr: "Un homme de trente ans raconta qu'une ancienne amie mariée ne pouvait l'oublier et avait eu recours à la sorcellerie. Malgré ses efforts répétés pour se retenir, il n'y parvint pas. Le Dr Muhammad Mawfiq al-Ghalayini (fatwa n° 21825, 11 avril 2005) répondit qu'il ne devait pas invoquer la sorcellerie: l'adultère est un péché majeur, et lorsqu'il touche une femme mariée, il est encore plus grave car il mêle les lignées, ruine les familles et infidèle son mari. La porte du repentir est grande ouverte: Dieu tend la main la nuit au pécheur du jour et le jour à celui de la nuit. Qu'il répare son passé par le remords, son présent par l'abandon et son avenir par la résolution de ne jamais rechuter."
