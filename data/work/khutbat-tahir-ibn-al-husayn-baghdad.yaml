summary:
  ar: "خطبة طاهر بن الحسين بالناس في بغداد يوم الجمعة بعد مقتل الأمين سنة 198هـ، يذكر فيها أن الغلبة لم تكن بإرادتهم، ويعدّد مهام الخلافة، ويحذر من مخالفة الطاعة."
  en: "Tahir ibn al-Husayn's Friday sermon in Baghdad after al-Amin was killed in 198 AH. He says the victory was not by their choice, lists the duties of the caliphate, and warns against disobedience."
  ur: "198 ہجری میں امین کے قتل کے بعد بغداد میں جمعے کو طاہر بن حسین کا خطبہ، جس میں وہ کہتے ہیں کہ فتح ان کے اختیار سے نہیں ہوئی، خلافت کے فرائض گنواتے ہیں اور اطاعت سے انحراف پر خبردار کرتے ہیں۔"
  es: "Sermón del viernes de Tahir ibn al-Husayn en Bagdad tras la muerte de al-Amin en el año 198 de la Hégira. En él, afirma que la victoria no fue por voluntad propia, enumera los deberes del califato y advierte contra la desobediencia."
  fr: "Le sermon du vendredi de Tahir ibn al-Husayn à Bagdad après la mort d'al-Amin en 198 AH. Il déclare que la victoire n'était pas de leur plein gré, énumère les devoirs du califat et met en garde contre la désobéissance."
  tr: "Tahir ibn al-Hüseyin, 198 Hicri yılındaki el-Emin suikastından sonra Cuma günü Bağdat'ta halka verdiği vaazda, zaferin onların iradesi olmadığını belirtir, halifeliğin görevlerini sıralar ve itaatsizlik konusunda uyarıda bulunur."
  id: "Khotbah Tahir ibn al-Husayn kepada rakyat Baghdad pada hari Jumat setelah pembunuhan al-Amin pada tahun 198 H, di mana ia menyebutkan bahwa kemenangan bukan atas kehendak mereka, menyebutkan tugas-tugas kekhalifahan, dan memperingatkan agar tidak taat."
