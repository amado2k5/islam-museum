summary:
  ar: "خطبة طاهر بن الحسين بالناس في بغداد يوم الجمعة بعد مقتل الأمين سنة 198هـ، يذكر فيها أن الغلبة لم تكن بإرادتهم، ويعدّد مهام الخلافة، ويحذر من مخالفة الطاعة."
  en: "Tahir ibn al-Husayn's Friday sermon in Baghdad after al-Amin was killed in 198 AH. He says the victory was not by their choice, lists the duties of the caliphate, and warns against disobedience."
  ur: "198 ہجری میں امین کے قتل کے بعد بغداد میں جمعے کو طاہر بن حسین کا خطبہ، جس میں وہ کہتے ہیں کہ فتح ان کے اختیار سے نہیں ہوئی، خلافت کے فرائض گنواتے ہیں اور اطاعت سے انحراف پر خبردار کرتے ہیں۔"
