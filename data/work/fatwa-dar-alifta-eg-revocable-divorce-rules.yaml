class: work
kind: fatwa
label: { ar: "أحكام الزوجية المترتبة على الطلاق الرجعي", en: "Marital rulings following revocable divorce", ur: "طلاقِ رجعی کے بعد زوجیت کے احکام" }
summary:
  ar: "سائل سأل عن أحكام الطلاق الرجعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22262)⁩ أن الطلاق الرجعي هو طلاق الرجل امرأته المدخول بها طلاقًا دون الثلاث في غير مقابلة مال، وحكمه أنه لا يزيل الملك في الحال فتبقى زوجته في العدة، على ما فصّل الجواب من آثاره."
  en: "A questioner asked about the rulings on revocable divorce. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22262) answered that revocable divorce is a man's divorce of his consummated wife short of three pronouncements and not in return for money; its effect is that it does not dissolve the marriage at once, so she remains his wife within the waiting period — and the answer details its consequences."
  ur: "ایک سائل نے طلاقِ رجعی کے احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22262)⁩ نے جواب دیا کہ طلاقِ رجعی وہ طلاق ہے جو شوہر اپنی دخول شدہ بیوی کو تین سے کم اور مال کے بدلے کے بغیر دے؛ اس کا حکم یہ ہے کہ وہ فوراً نکاح ختم نہیں کرتی بلکہ بیوی عدت میں اس کی زوجیت میں رہتی ہے — جواب میں اس کے آثار بیان ہوئے۔"
