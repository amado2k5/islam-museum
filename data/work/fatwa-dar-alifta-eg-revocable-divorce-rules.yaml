label: { ar: "أحكام الزوجية المترتبة على الطلاق الرجعي", en: "Marital rulings following revocable divorce", ur: "طلاقِ رجعی کے بعد زوجیت کے احکام", es: "Resoluciones matrimoniales tras un divorcio revocable", fr: "Décisions relatives au mariage suite à un divorce révocable" }
summary:
  ar: "سائل سأل عن أحكام الطلاق الرجعي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22262)⁩ أن الطلاق الرجعي هو طلاق الرجل امرأته المدخول بها طلاقًا دون الثلاث في غير مقابلة مال، وحكمه أنه لا يزيل الملك في الحال فتبقى زوجته في العدة، على ما فصّل الجواب من آثاره."
  en: "A questioner asked about the rulings on revocable divorce. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22262) answered that revocable divorce is a man's divorce of his consummated wife short of three pronouncements and not in return for money; its effect is that it does not dissolve the marriage at once, so she remains his wife within the waiting period — and the answer details its consequences."
  ur: "ایک سائل نے طلاقِ رجعی کے احکام پوچھے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22262)⁩ نے جواب دیا کہ طلاقِ رجعی وہ طلاق ہے جو شوہر اپنی دخول شدہ بیوی کو تین سے کم اور مال کے بدلے کے بغیر دے؛ اس کا حکم یہ ہے کہ وہ فوراً نکاح ختم نہیں کرتی بلکہ بیوی عدت میں اس کی زوجیت میں رہتی ہے — جواب میں اس کے آثار بیان ہوئے۔"
  es: "Un consultante preguntó sobre las normas relativas al divorcio revocable. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 22262) respondió que el divorcio revocable es el divorcio de un hombre de su esposa con la que se ha consumado el matrimonio, sin necesidad de tres pronunciamientos y sin compensación económica; su efecto es que no disuelve el matrimonio de inmediato, por lo que ella sigue siendo su esposa durante el período de espera, y la respuesta detalla sus consecuencias."
  fr: "Un internaute a posé une question sur les avis juridiques concernant le divorce révocable. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22262) a répondu que le divorce révocable est le divorce prononcé par un homme contre son épouse après la consommation du mariage, avant trois déclarations et sans compensation financière. Son effet est que le mariage n'est pas dissous immédiatement; l'épouse demeure donc son mari pendant la période d'attente. La réponse détaille ensuite les conséquences de ce divorce."
