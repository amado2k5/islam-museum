id: work/fatwa-amja-seeking-muslim-jinn
class: work
kind: fatwa
label: { ar: "الاستعانة بالجن المسلم", en: "Seeking help from the Muslim jinn", ur: "مسلم جنوں سے مدد", es: "Buscando ayuda de los genios musulmanes", fr: "Demander l'aide des djinns musulmans" }
summary:
  ar: "سأل سائل عن شرعية التعامل أو الاستعانة بالجن المسلم لمساعدة الآخرين كعلاجهم عند الإصابة بالمس أو إرشادهم لسبب مشكلتهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81265 بتاريخ 6 أبريل 2010)⁩ أن الجن فيهم الصالحون وفيهم دون ذلك، وإن لم تتضمن الاستعانة بصالحيهم عملًا محرمًا وكانت من جنس التعاون العام على البر والتقوى فلا يظهر له في ذلك حرج، لكن هذا الأمر مزلة أقدام وقد يكثر فيه الخلط والأدعياء والأولى تركه قطعًا للذريعة إلى الفساد، ونقل عن ابن عثيمين أن الاستعانة بالمخلوق فيما يقدر عليه لا بأس بها أما تصديقهم وتكذيبهم فينظر فيه وأن الأمر ليس بالسهل فليتثبت."
  en: "A questioner asked about dealing with or seeking help from Muslim jinn to help others — treating the possessed or showing them the cause of their trouble. Dr. Salah al-Sawi (fatwa no. 81265, 6 April 2010) answered that among the jinn are the righteous and the less so; if resorting to their righteous involves no forbidden act and counts as general cooperation in piety, he sees no harm in it — yet the matter is slippery ground, rife with mixing and pretenders, and better left off to close the door to corruption; he quoted Ibn Uthaymin that seeking a creature's help in what it can do is unobjectionable, but believing or disbelieving them needs scrutiny — the matter is not easy and requires verification. Recorded as AMJA's answer."
  ur: "ایک سائل نے مس یا علاج میں مسلم جنوں سے مدد کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81265، 6 اپریل 2010)⁩ کے مطابق صالح جنوں سے جائز عمل میں مدد پر ظاہری حرج نہیں مگر معاملہ لغزش کا ہے اور ترک کرنا اولیٰ ہے — ابن عثیمین کے قول کے ساتھ۔"
  es: "Un consultante preguntó sobre la conveniencia de recurrir a los genios musulmanes o buscar su ayuda para ayudar a otros, ya sea tratando a los poseídos o mostrándoles la causa de su problema. El Dr. Salah al-Sawi (fatwa n.° 81265, 6 de abril de 2010) respondió que entre los genios hay justos y otros no tanto; si recurrir a los justos no implica ningún acto prohibido y se considera cooperación general en la piedad, no ve inconveniente alguno; sin embargo, el asunto es delicado, propenso a la confusión y a los impostores, y es mejor evitarlo para no caer en la corrupción. Citó a Ibn Uthaymin, quien afirmó que buscar la ayuda de una criatura en lo que puede hacer es aceptable, pero creer o no creer en ellos requiere un análisis minucioso; el asunto no es sencillo y exige verificación. Registrado como respuesta de AMJA."
  fr: "Un internaute a posé une question concernant le recours aux djinns musulmans pour aider autrui – soigner les possédés ou leur révéler la cause de leurs troubles. Le Dr Salah al-Sawi (fatwa n° 81265, 6 avril 2010) a répondu que parmi les djinns se trouvent des vertueux et d'autres moins vertueux; si le recours aux vertueux n'implique aucun acte interdit et constitue une forme de coopération à la piété, il n'y voit aucun mal. Cependant, la question est délicate, sujette à confusion et aux imposteurs, et il est préférable de s'en abstenir pour éviter toute corruption. Il a cité Ibn Uthaymin, selon lequel solliciter l'aide d'une créature dans ce qu'elle peut faire est irréprochable, mais croire ou ne pas croire en eux nécessite un examen attentif – la question est complexe et requiert une vérification. Cette réponse a été consignée dans l'AMJA."
