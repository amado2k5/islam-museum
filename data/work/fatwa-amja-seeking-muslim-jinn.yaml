id: work/fatwa-amja-seeking-muslim-jinn
class: work
kind: fatwa
label: { ar: "الاستعانة بالجن المسلم", en: "Seeking help from the Muslim jinn", ur: "مسلم جنوں سے مدد" }
summary:
  ar: "سأل سائل عن شرعية التعامل أو الاستعانة بالجن المسلم لمساعدة الآخرين كعلاجهم عند الإصابة بالمس أو إرشادهم لسبب مشكلتهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81265 بتاريخ 6 أبريل 2010)⁩ أن الجن فيهم الصالحون وفيهم دون ذلك، وإن لم تتضمن الاستعانة بصالحيهم عملًا محرمًا وكانت من جنس التعاون العام على البر والتقوى فلا يظهر له في ذلك حرج، لكن هذا الأمر مزلة أقدام وقد يكثر فيه الخلط والأدعياء والأولى تركه قطعًا للذريعة إلى الفساد، ونقل عن ابن عثيمين أن الاستعانة بالمخلوق فيما يقدر عليه لا بأس بها أما تصديقهم وتكذيبهم فينظر فيه وأن الأمر ليس بالسهل فليتثبت."
  en: "A questioner asked about dealing with or seeking help from Muslim jinn to help others — treating the possessed or showing them the cause of their trouble. Dr. Salah al-Sawi (fatwa no. 81265, 6 April 2010) answered that among the jinn are the righteous and the less so; if resorting to their righteous involves no forbidden act and counts as general cooperation in piety, he sees no harm in it — yet the matter is slippery ground, rife with mixing and pretenders, and better left off to close the door to corruption; he quoted Ibn Uthaymin that seeking a creature's help in what it can do is unobjectionable, but believing or disbelieving them needs scrutiny — the matter is not easy and requires verification. Recorded as AMJA's answer."
  ur: "ایک سائل نے مس یا علاج میں مسلم جنوں سے مدد کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81265، 6 اپریل 2010)⁩ کے مطابق صالح جنوں سے جائز عمل میں مدد پر ظاہری حرج نہیں مگر معاملہ لغزش کا ہے اور ترک کرنا اولیٰ ہے — ابن عثیمین کے قول کے ساتھ۔"
