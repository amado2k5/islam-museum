summary:
  ar: "رجلان اتفقا على إقامة شركة بينهما وكان رأس مال كل منهما وقت العقد عروضًا فسأل أحدهما عن حكمها وكيفية التخارج منها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21708)⁩ ببيان حكم هذه الشركة وطريقة التخارج منها على وجهه."
  en: "Two men agreed to form a partnership in which each one's capital at contract time was goods, and one asked its ruling and how to exit it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21708) answered by setting out the ruling on this partnership and the way out of it."
  ur: "دو آدمیوں نے شرکت قائم کی جس میں دونوں کی سرمائے سامان تھا؛ ایک نے اس کا حکم اور نکلنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21708)⁩ نے جواب میں اس شرکت کا حکم اور تخارج کا طریقہ بیان کیا۔"
