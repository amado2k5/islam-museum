label:
  ar: "ضفاف الكوثر"
  en: "Difaf al-Kawthar: The Banks of al-Kawthar"
  ur: "ضفاف الکوثر: کوثر کے کنارے"
  es: "Difaf al-Kawthar: Los bancos de al-Kawthar"
  fr: "Difaf al-Kawthar: Les rives d'al-Kawthar"
  tr: "Al-Kawthar Kıyıları"
  id: "Tepi Al-Kawthar"
summary:
  ar: "برنامج مصوّر لأبي إسحاق الحويني يحفظ منه أرشيف أسابيل ست عشرة حلقة قصيرة ⁦(الحلقة العاشرة تعيد الثالثة)⁩، أكثرها مواعظ في الرقائق والأخلاق: حفظ الحسنات والتوبة، والطريق إلى الله، والإخلاص والرياء، وخديجة وبدء الوحي، وأحاديث من كتاب الرقاق في صحيح البخاري، وأصحاب الغار، وشيطان الإنس، وتعدد الزوجات، وحسن الخلق، والقلب، وأقوال أبي حازم؛ ومعها حلقتان في علوم الحديث، في عدالة الرواة والوضاعين وفي التدليس. لا يذكر الحويني العنوان ولا تاريخ التسجيل في أي حلقة."
  en: "A filmed programme by Abu Ishaq al-Heweny of which the Assabile archive keeps sixteen short episodes (episode 10 repeats episode 3), mostly admonitions on the softening of hearts and on character: keeping one's good deeds and repentance, the road to God, sincerity and showing off, Khadija and the beginning of revelation, hadiths from the Book of Softening of Hearts of Sahih al-Bukhari, the men of the cave, the human devil, polygamy, good character, the heart, and the sayings of Abu Hazim; with them are two episodes on the hadith sciences, on the probity of narrators and the forgers and on concealment in chains. Al-Heweny names neither the title nor the date of recording in any episode."
  ur: "ابو اسحاق حوینی کا ایک ویڈیو پروگرام جس کی سولہ مختصر اقساط اسابیل آرکائیو میں محفوظ ہیں ⁦(دسویں قسط تیسری کو دہراتی ہے)⁩، زیادہ تر رقائق اور اخلاق پر مواعظ: نیکیوں کی حفاظت اور توبہ، اللہ کی طرف راستہ، اخلاص اور ریا، خدیجہ اور آغازِ وحی، صحیح بخاری کی کتاب الرقاق کی احادیث، غار والے، انسانی شیطان، تعددِ ازواج، حسنِ اخلاق، دل، اور ابو حازم کے اقوال؛ ان کے ساتھ علومِ حدیث پر دو اقساط ہیں، راویوں کی عدالت اور وضاعین پر اور تدلیس پر۔ حوینی کسی قسط میں نہ عنوان ذکر کرتے ہیں نہ ریکارڈنگ کی تاریخ۔"
  es: "Un programa filmado por Abu Ishaq al-Heweny del cual el archivo Assabile conserva dieciséis episodios cortos (el episodio 10 repite el episodio 3), en su mayoría exhortaciones sobre el ablandamiento de los corazones y el carácter: la práctica de las buenas obras y el arrepentimiento, el camino hacia Dios, la sinceridad y la ostentación, Khadija y el comienzo de la revelación, hadices del Libro del Ablandamiento de los Corazones de Sahih al-Bukhari, los hombres de la caverna, el demonio humano, la poligamia, el buen carácter, el corazón y los dichos de Abu Hazim; junto con ellos hay dos episodios sobre las ciencias del hadiz, sobre la probidad de los narradores y los falsificadores y sobre el ocultamiento en cadenas. Al-Heweny no menciona ni el título ni la fecha de grabación en ningún episodio."
  fr: "Un programme filmé par Abou Ishaq al-Heweny, dont les archives d'Assabile conservent seize courts épisodes (l'épisode 10 est une rediffusion de l'épisode 3), principalement des exhortations à la douceur des cœurs et au développement du caractère: la persévérance dans les bonnes actions et le repentir, le chemin vers Dieu, la sincérité et l'ostentation, Khadija et le début de la révélation, des hadiths du Livre de la douceur des cœurs du Sahih al-Bukhari, les hommes de la caverne, le démon humain, la polygamie, la vertu, le cœur et les paroles d'Abou Hazim; s'y ajoutent deux épisodes consacrés à la science du hadith, à la probité des narrateurs et des faussaires, et à la dissimulation dans les chaînes. Al-Heweny ne mentionne ni le titre ni la date d'enregistrement dans aucun épisode."
  tr: "Ebu İshaq el-Huveyni'nin kayıtlı bir programı; burada Isabel'in arşivini ezberlediği on altı kısa bölüm (onuncu bölüm üçüncüyü tekrarlar), bunların çoğu incelikler ve ahlak üzerine vaazlardır: iyi işler ve tövbe, Allah'a giden yol, samimiyet ve ikiyüzlülük, Hatice ve vahyin başlangıcı, Sahih al-Buhari'deki 'Ruka' kitabından hadisler, mağara sahabeleri, insanlığın şeytanı, çok eşlilik, iyi karakter, kalp ve Ebu Hazim'in sözleri; ayrıca hadis illeri, rivayetçilerin ve kışkırtıcıların adaleti ile aldatma üzerine iki bölüm de yer alır. El-Huveyni hiçbir bölümde başlık veya kayıt tarihinden bahsetmez."
  id: "Program rekaman oleh Abu Ishaq al-Huwaini dari mana ia menghafal arsip Isabel enam belas episode pendek (episode kesepuluh mengulang episode ketiga), sebagian besar adalah khotbah tentang hal-hal halus dan moral: menghafal perbuatan baik dan pertobatan, jalan menuju Tuhan, keikhlasan dan kemunafikan, Khadijah dan awal wahyu, hadis dari kitab 'Ruqa' dalam Sahih al-Bukhari, sahabat gua, iblis umat manusia, poligami, watak baik, hati, dan perkataan Abu Hazim; bersama dua episode tentang ilmu hadis, keadilan para narator dan para penghasut, serta tentang penipuan. Al-Huwaini tidak menyebutkan judul atau tanggal pendaftaran dalam episode manapun."
