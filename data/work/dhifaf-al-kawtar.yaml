id: work/dhifaf-al-kawtar
class: work
kind: lecture-series
label:
  ar: "ضفاف الكوثر"
  en: "Difaf al-Kawthar: The Banks of al-Kawthar"
  ur: "ضفاف الکوثر: کوثر کے کنارے"
summary:
  ar: "برنامج مصوّر لأبي إسحاق الحويني يحفظ منه أرشيف أسابيل ست عشرة حلقة قصيرة (الحلقة العاشرة تعيد الثالثة)، أكثرها مواعظ في الرقائق والأخلاق: حفظ الحسنات والتوبة، والطريق إلى الله، والإخلاص والرياء، وخديجة وبدء الوحي، وأحاديث من كتاب الرقاق في صحيح البخاري، وأصحاب الغار، وشيطان الإنس، وتعدد الزوجات، وحسن الخلق، والقلب، وأقوال أبي حازم؛ ومعها حلقتان في علوم الحديث، في عدالة الرواة والوضاعين وفي التدليس. لا يذكر الحويني العنوان ولا تاريخ التسجيل في أي حلقة."
  en: "A filmed programme by Abu Ishaq al-Heweny of which the Assabile archive keeps sixteen short episodes (episode 10 repeats episode 3), mostly admonitions on the softening of hearts and on character: keeping one's good deeds and repentance, the road to God, sincerity and showing off, Khadija and the beginning of revelation, hadiths from the Book of Softening of Hearts of Sahih al-Bukhari, the men of the cave, the human devil, polygamy, good character, the heart, and the sayings of Abu Hazim; with them are two episodes on the hadith sciences, on the probity of narrators and the forgers and on concealment in chains. Al-Heweny names neither the title nor the date of recording in any episode."
  ur: "ابو اسحاق حوینی کا ایک ویڈیو پروگرام جس کی سولہ مختصر اقساط اسابیل آرکائیو میں محفوظ ہیں (دسویں قسط تیسری کو دہراتی ہے)، زیادہ تر رقائق اور اخلاق پر مواعظ: نیکیوں کی حفاظت اور توبہ، اللہ کی طرف راستہ، اخلاص اور ریا، خدیجہ اور آغازِ وحی، صحیح بخاری کی کتاب الرقاق کی احادیث، غار والے، انسانی شیطان، تعددِ ازواج، حسنِ اخلاق، دل، اور ابو حازم کے اقوال؛ ان کے ساتھ علومِ حدیث پر دو اقساط ہیں، راویوں کی عدالت اور وضاعین پر اور تدلیس پر۔ حوینی کسی قسط میں نہ عنوان ذکر کرتے ہیں نہ ریکارڈنگ کی تاریخ۔"
