label: { ar: "حكم زواج المصاب بمتلازمة داون", en: "Marriage of a person with Down syndrome", ur: "ڈاؤن سنڈروم والے شخص کی شادی کا حکم", es: "Matrimonio de una persona con síndrome de Down", fr: "Mariage d'une personne atteinte du syndrome de Down", tr: "Down sendromlu bir kişi için evlilik kararı", id: "Putusan tentang pernikahan bagi seseorang dengan sindrom Down" }
summary:
  ar: "سائل سأل عن زواج المصاب بمتلازمة داون. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22585)⁩ أن زواج ذوي الهمم من المصابين بمتلازمة داون حق من حقوقهم الإنسانية والشرعية، ولا مانع منه شرعًا إذا توفرت فيه شروطه وضوابطه كما فصّل الجواب."
  en: "A questioner asked about the marriage of a person with Down syndrome. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22585) answered that marriage for people of determination with Down syndrome is one of their human and sharia rights, with nothing to bar it in law provided its conditions and controls are met, as the answer details."
  ur: "ایک سائل نے ڈاؤن سنڈروم والے شخص کی شادی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22585)⁩ نے جواب دیا کہ ڈاؤن سنڈروم والے ہمت والوں کی شادی ان کا انسانی اور شرعی حق ہے، اس میں شرعاً کوئی مانع نہیں بشرطیکہ اس کی شرائط اور ضوابط پورے ہوں، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre el matrimonio de una persona con síndrome de Down. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22585) respondió que el matrimonio para las personas con discapacidad intelectual y síndrome de Down es uno de sus derechos humanos y islámicos, y que no existe ningún impedimento legal para ello, siempre que se cumplan las condiciones y los controles, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le mariage d'une personne atteinte du syndrome de Down. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22585) a répondu que le mariage pour les personnes atteintes du syndrome de Down est un droit fondamental et conforme à la charia, et qu'aucun texte de loi ne s'y oppose, sous réserve du respect des conditions et des règles établies, comme le précise la réponse."
  tr: "Bir soru soran kişi Down sendromlu bir kişinin evliliği hakkında soru sordu. Mısır Dar al-Ifta'sı (Büyük Müftü Dr. Nazeer Muhammad Ayad, Fetva No. 22585), engelli kişilerin Down sendromlu kişilerle evlenmesinin insan ve dini haklarından biri olduğunu ve bu koşullar ve kontroller sağlanırsa dini bir itiraz olmadığını yanıtladı; bu da yanıtta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang pernikahan seseorang dengan sindrom Down. Dar al-Ifta Mesir (Mufti Agung Dr. Nazeer Muhammad Ayad, Fatwa No. 22585) menjawab bahwa pernikahan penyandang disabilitas dengan orang dengan sindrom Down adalah salah satu hak asasi manusia dan agama mereka, dan tidak ada keberatan agama jika syarat dan kontrolnya terpenuhi, seperti yang dijelaskan dalam jawaban."
