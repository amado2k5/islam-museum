id: work/fatwa-dar-alifta-eg-underinvoicing-tax-evasion
class: work
kind: fatwa
label: { ar: "حكم كتابة الفواتير التجارية بأقل من السعر الحقيقي تهربًا من الضرائب", en: "Writing invoices below the real price to evade taxes", ur: "ٹیکس بچانے کے لیے اصل قیمت سے کم رسید لکھنا", es: "Emitir facturas por debajo del precio real para evadir impuestos.", fr: "Facturer en dessous du prix réel pour échapper aux impôts", tr: "Vergi kaçırmak için ticari faturaların gerçek fiyatın altında yazılmasına ilişkin karar", id: "Putusan tentang penulisan faktur komersial di bawah harga riil untuk menghindari pajak" }
summary:
  ar: "سائل سأل عن كتابة بعض التجار الفواتير بأقل من السعر الحقيقي أو ببنود غير حقيقية تهربًا من الضرائب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21670)⁩ أن ما يقوم به بعض التجار من إضافة بنود غير حقيقية أو وضع ثمن غير حقيقي للبضاعة له حكمه الذي بيّنه الجواب على وجهه."
  en: "A questioner asked about traders writing invoices below the real price or adding unreal items to evade taxes. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21670) answered by setting out the ruling on adding false items and stating unreal prices, as the answer details."
  ur: "ایک سائل نے تاجروں کے ٹیکس بچانے کے لیے اصل قیمت سے کم یا جھوٹی اشیاء کی رسیدیں لکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21670)⁩ نے جواب میں اس فعل کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre la práctica de los comerciantes de emitir facturas por debajo del precio real o añadir artículos ficticios para evadir impuestos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21670) respondió exponiendo la normativa sobre la inclusión de artículos falsos y la declaración de precios irreales, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les commerçants qui sous-facturent les prix ou y ajoutent des articles fictifs pour frauder le fisc. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21670) a répondu en exposant sa position sur l'ajout d'articles fictifs et la pratique de prix erronés, comme le détaille la réponse."
  tr: "Bir soru soran kişi, bazı tüccarların gerçek fiyatın altında veya vergi kaçmak için sahte eşyalarla faturalar yazdığını sordu. Mısır'ın Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21670), bazı tüccarların sahte eşyalar ekleyerek veya mallara gerçekçi olmayan bir fiyat koyarak yaptıklarının kendi hükmüne sahip olduğunu yanıtladı, bu da cevapta açıklanmıştır."
  id: "Seorang penanya menanyakan tentang beberapa pedagang yang menulis faktur di bawah harga sebenarnya atau dengan barang palsu untuk menghindari pajak. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21670) menjawab bahwa apa yang dilakukan beberapa pedagang dengan menambahkan barang palsu atau menetapkan harga barang yang tidak realistis memiliki keputusan, seperti yang dijelaskan dalam jawaban."
