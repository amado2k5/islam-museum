summary:
  ar: "موقع موسوعات إسلامية تملكه مؤسسة الدرر السنية، وهي مؤسسة علمية وقفية تقول إن غايتها حفظ السنة وإيجاد مرجعية علمية على منهج أهل السنة والجماعة؛ يضم الموسوعة الحديثية وموسوعات التفسير والعقيدة والفقه والأديان والفرق والأخلاق والتاريخ واللغة، وتطبيقات للجوال وواجهة برمجية؛ أقدم لقطة له في أرشيف الإنترنت في نوفمبر 2001."
  en: "An Islamic encyclopedias site owned by the Dorar al-Saniyya Foundation, a scholarly waqf foundation that states its aim as preserving the Sunna and building a scholarly reference on the method of Ahl al-Sunna wa-l-Jama'a; it holds the Hadith Encyclopedia and encyclopedias of tafsir, creed, fiqh, religions, sects, ethics, history and the Arabic language, with phone apps and an API; its earliest archived capture is of November 2001."
  ur: "اسلامی موسوعات کی سائٹ جس کا مالک مؤسسہ الدرر السنیہ ہے، ایک علمی وقفی ادارہ جو اپنا مقصد سنت کی حفاظت اور اہلِ سنت والجماعت کے منہج پر علمی مرجع بنانا بتاتا ہے؛ اس میں موسوعۂ حدیث اور تفسیر، عقیدہ، فقہ، ادیان، فرق، اخلاق، تاریخ اور عربی زبان کی موسوعات، موبائل ایپس اور اے پی آئی ہیں؛ سب سے پرانی آرکائیو تصویر نومبر 2001 کی ہے۔"
  es: "Un sitio web de enciclopedias islámicas propiedad de la Fundación Dorar al-Saniyya, una fundación académica waqf cuyo objetivo es preservar la Sunna y construir una referencia académica basada en el método de Ahl al-Sunna wa-l-Jama'a; contiene la Enciclopedia de Hadith y enciclopedias de tafsir, credo, fiqh, religiones, sectas, ética, historia y lengua árabe, con aplicaciones para teléfonos móviles y una API; su archivo más antiguo data de noviembre de 2001."
  fr: "Un site d'encyclopédies islamiques appartenant à la Fondation Dorar al-Saniyya, une fondation waqf savante qui affirme que son objectif est de préserver la Sunna et de constituer une référence savante sur la méthode d'Ahl al-Sunna wa-l-Jama'a; il contient l'Encyclopédie des Hadiths et des encyclopédies de tafsir, de croyance, de fiqh, de religions, de sectes, d'éthique, d'histoire et de langue arabe, avec des applications mobiles et une API; sa capture archivée la plus ancienne date de novembre 2001."
  tr: "Al-Durar Al-Sunniyah Vakfı'na ait bir İslami ansiklopedi web sitesi; bu bilimsel bir vakıf kurumu, amacının Sünnet'i korumak ve Ahl al-Sunnah wa al-Jama'ah metodolojisine dayalı bilimsel bir referans oluşturmak olduğunu iddia etmektedir. Hadis ansiklopedisi, tefsir, inanç, fıkıh, dinler, mezhepler, etik, tarih, dil, mobil uygulamalar ve yazılım arayüzü gibi ansiklopedileri içerir; en erken ansiklopedi Kasım 2001'de Internet Archive'da bulunmaktadır."
  id: "Sebuah situs ensiklopedia Islam milik Al-Durar Al-Sunniyah Foundation, sebuah lembaga abadi ilmiah yang mengklaim tujuannya adalah melestarikan Sunnah dan menetapkan referensi ilmiah berdasarkan metodologi Ahl al-Sunnah wa al-Jama'ah. Situs ini mencakup ensiklopedia Hadis, ensiklopedia tafsir, kepercayaan, yurisprudensi, agama, sekte, etika, sejarah, bahasa, aplikasi seluler, dan antarmuka perangkat lunak; potret paling awal darinya ada di Internet Archive pada November 2001."
