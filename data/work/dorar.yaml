label:
  ar: "الدرر السنية ⁦(موقع)⁩"
  en: "Dorar al-Saniyya (dorar.net)"
  ur: "الدرر السنیہ ⁦(ویب سائٹ)⁩"
summary:
  ar: "موقع موسوعات إسلامية تملكه مؤسسة الدرر السنية، وهي مؤسسة علمية وقفية تقول إن غايتها حفظ السنة وإيجاد مرجعية علمية على منهج أهل السنة والجماعة؛ يضم الموسوعة الحديثية وموسوعات التفسير والعقيدة والفقه والأديان والفرق والأخلاق والتاريخ واللغة، وتطبيقات للجوال وواجهة برمجية؛ أقدم لقطة له في أرشيف الإنترنت في نوفمبر 2001."
  en: "An Islamic encyclopedias site owned by the Dorar al-Saniyya Foundation, a scholarly waqf foundation that states its aim as preserving the Sunna and building a scholarly reference on the method of Ahl al-Sunna wa-l-Jama'a; it holds the Hadith Encyclopedia and encyclopedias of tafsir, creed, fiqh, religions, sects, ethics, history and the Arabic language, with phone apps and an API; its earliest archived capture is of November 2001."
  ur: "اسلامی موسوعات کی سائٹ جس کا مالک مؤسسہ الدرر السنیہ ہے، ایک علمی وقفی ادارہ جو اپنا مقصد سنت کی حفاظت اور اہلِ سنت والجماعت کے منہج پر علمی مرجع بنانا بتاتا ہے؛ اس میں موسوعۂ حدیث اور تفسیر، عقیدہ، فقہ، ادیان، فرق، اخلاق، تاریخ اور عربی زبان کی موسوعات، موبائل ایپس اور اے پی آئی ہیں؛ سب سے پرانی آرکائیو تصویر نومبر 2001 کی ہے۔"
