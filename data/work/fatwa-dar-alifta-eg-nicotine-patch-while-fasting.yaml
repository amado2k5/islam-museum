id: work/fatwa-dar-alifta-eg-nicotine-patch-while-fasting
class: work
kind: fatwa
label: { ar: "حكم استعمال لاصقة نيكوتين أثناء الصوم", en: "Using a nicotine patch while fasting", ur: "روزے میں نیکوٹین پیچ لگانا", es: "Usar un parche de nicotina en ayunas", fr: "Utiliser un patch de nicotine pendant le jeûne", tr: "Oruç sırasında nikotin bantlarının kullanılması hakkında karar", id: "Memutuskan penggunaan plester nikotin saat berpuasa" }
summary:
  ar: "سائل مدخن سأل عن استخدام لصقات النيكوتين على الجلد أثناء الصوم للإقلاع عن التدخين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21761)⁩ أنه يجوز للصائم المدخن استخدام لصقات النيكوتين التي توضع على الجلد لمساعدته في الإقلاع عن التدخين في نهار رمضان على ما فصّل الجواب."
  en: "A smoker asked about using skin nicotine patches while fasting to help quit smoking. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21761) answered that a fasting smoker may use nicotine patches worn on the skin to help him quit during Ramadan days — as the answer details."
  ur: "ایک سگریٹ نوش نے روزے میں جلد پر نیکوٹین پیچ لگانے کا حکم پوچھا تاکہ سگریٹ چھوڑ سکے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21761)⁩ نے جواب دیا کہ رمضان کے دنوں میں سگریٹ چھوڑنے کے لیے جلد پر لگنے والا نیکوٹین پیچ استعمال کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un fumador preguntó sobre el uso de parches de nicotina transdérmicos durante el ayuno para dejar de fumar. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21761) respondió que un fumador en ayunas puede usar parches de nicotina que se colocan sobre la piel para ayudarlo a dejar de fumar durante los días de Ramadán, como se detalla en la respuesta."
  fr: "Un fumeur a demandé s'il pouvait utiliser des patchs de nicotine pendant le jeûne pour l'aider à arrêter de fumer. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21761) a répondu qu'un fumeur jeûnant pouvait utiliser des patchs de nicotine à appliquer sur la peau pour l'aider à arrêter de fumer pendant le Ramadan, comme le précise la réponse."
  tr: "Bir sigara içicisi, sigarayı bırakmak için oruç sırasında cilde nikotin bantları kullanmayı sordu. Mısır Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21761), Ramazan'da gündüz sigarayı bırakmak için cilde yerleştirilen nikotin bantlarının kullanılmasının caiz olduğunu yanıtladı; bu cevapta ayrıntılı olarak belirtilmiştir."
  id: "Seorang perokok menanyakan tentang penggunaan plester nikotin pada kulit selama puasa untuk berhenti merokok. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21761) menjawab bahwa diperbolehkan bagi perokok puasa untuk menggunakan plester nikotin yang ditempelkan pada kulit untuk membantunya berhenti merokok pada siang hari di Ramadan, seperti yang dijelaskan dalam jawabannya."
