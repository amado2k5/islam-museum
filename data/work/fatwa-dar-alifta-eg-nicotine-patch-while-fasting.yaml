id: work/fatwa-dar-alifta-eg-nicotine-patch-while-fasting
class: work
kind: fatwa
label: { ar: "حكم استعمال لاصقة نيكوتين أثناء الصوم", en: "Using a nicotine patch while fasting", ur: "روزے میں نیکوٹین پیچ لگانا", es: "Usar un parche de nicotina en ayunas" }
summary:
  ar: "سائل مدخن سأل عن استخدام لصقات النيكوتين على الجلد أثناء الصوم للإقلاع عن التدخين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21761)⁩ أنه يجوز للصائم المدخن استخدام لصقات النيكوتين التي توضع على الجلد لمساعدته في الإقلاع عن التدخين في نهار رمضان على ما فصّل الجواب."
  en: "A smoker asked about using skin nicotine patches while fasting to help quit smoking. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21761) answered that a fasting smoker may use nicotine patches worn on the skin to help him quit during Ramadan days — as the answer details."
  ur: "ایک سگریٹ نوش نے روزے میں جلد پر نیکوٹین پیچ لگانے کا حکم پوچھا تاکہ سگریٹ چھوڑ سکے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21761)⁩ نے جواب دیا کہ رمضان کے دنوں میں سگریٹ چھوڑنے کے لیے جلد پر لگنے والا نیکوٹین پیچ استعمال کرنا جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un fumador preguntó sobre el uso de parches de nicotina transdérmicos durante el ayuno para dejar de fumar. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21761) respondió que un fumador en ayunas puede usar parches de nicotina que se colocan sobre la piel para ayudarlo a dejar de fumar durante los días de Ramadán, como se detalla en la respuesta."
