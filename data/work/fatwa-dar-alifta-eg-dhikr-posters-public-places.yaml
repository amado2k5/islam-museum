label: { ar: "حكم لصق أوراق الأذكار في الأماكن العامة", en: "Posting remembrance sheets in public places", ur: "عوامی مقامات پر اذکار کے کاغذات چسپاں کرنا", es: "Colocar hojas conmemorativas en lugares públicos", fr: "Affichage de feuilles de commémoration dans les lieux publics", tr: "Kamusal alanlara anma törenlerinin yapıştırılmasına ilişkin karar", id: "Putusan tentang menempelkan kenangan di tempat umum" }
summary:
  ar: "سائل سأل عن لصق أوراق الأذكار في الأماكن العامة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22063)⁩ أنه يجوز وضع ملصقات الأذكار في الأماكن العامة إذا تحقق فيها الحفظ اللائق لكل ما فيه اسم الله تعالى مع التنسيق على ما فصّل الجواب."
  en: "A questioner asked about posting remembrance (adhkar) sheets in public places. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22063) answered that placing dhikr posters in public places is permitted provided everything bearing God's name is kept with fitting dignity, and with coordination — as the answer details."
  ur: "ایک سائل نے عوامی مقامات پر اذکار کے کاغذات چسپاں کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22063)⁩ نے جواب دیا کہ عوامی جگہوں پر اذکار کے پوسٹر لگانا جائز ہے بشرطیکہ اللہ کے نام والی ہر چیز کی لائق حفاظت ہو اور متعلقہ اداروں سے رابطہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un usuario preguntó sobre la posibilidad de colocar hojas de recuerdo (adhkar) en lugares públicos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22063) respondió que está permitido colocar carteles de dhikr en lugares públicos siempre que todo lo que lleve el nombre de Dios se mantenga con la debida dignidad y de forma coordinada, tal como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'affichage de feuilles de dhikr (invocations) dans les lieux publics. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22063) a répondu que l'affichage de ces feuilles dans les lieux publics est autorisé à condition que tout ce qui porte le nom de Dieu soit conservé avec le respect dû et en coordination, comme le précise la réponse."
  tr: "Bir soru soran kişi, kamusal alanlara anma iliştirme konusunu sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22063), Allah'ın adını taşıyan her şeyin uygun şekilde korunması ve yanıtta detaylandırılanların koordinasyonu sağlanırsa, anma afişlerinin halka açık yerlere yerleştirilmesinin caiz olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang menempelkan kenangan di tempat umum. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22063) menjawab bahwa diperbolehkan memasang poster peringatan di tempat umum jika pelestarian yang tepat atas segala sesuatu yang memuat nama Allah Yang Maha Kuasa tercapai, dengan koordinasi atas rincian jawaban."
