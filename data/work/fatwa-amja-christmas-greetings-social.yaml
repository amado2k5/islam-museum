id: work/fatwa-amja-christmas-greetings-social
class: work
kind: fatwa
label: { ar: "مجاملة النصارى في أعيادهم", en: "Social courtesy toward Christians on their feasts", ur: "مسیحیوں کے تہواروں پر مہذبانہ سلوک" }
summary:
  ar: "سأل سائل عن جواز تهنئة النصارى بعيد الكريسماس من باب المجاملة وهم مقيمون في بلادهم أو الرد عليهم إن هنؤوهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80630 بتاريخ 13 ديسمبر 2009)⁩ أن الأصل البر والقسط في التعامل مع أهل العهد من غير المسلمين ومن ذلك تهنئتهم في الأمور الاجتماعية المشتركة كالزواج وقدوم المولود، أما الأعياد الدينية فهي من خصوصيات الملل والنحل تبقى مختصة بأهلها، ولا بأس عند رجحان المصلحة من مجاملة بكلمات عامة لا تتضمن انتهاكًا لهذه الخصوصيات ولا إقرارًا لهم على دينهم أو رضًا به."
  en: "A questioner asked whether they may greet Christians on Christmas as courtesy while residing in their lands, or reply if greeted. Dr. Salah al-Sawi (fatwa no. 80630, 13 December 2009) answered that the default with covenant non-Muslims is kindness and equity, including congratulating them on shared social occasions — marriage, a new child; religious feasts belong to each creed's particularities and stay with their people, yet where benefit prevails there is no harm in courtesy with general words that neither violate those particularities nor affirm their religion or show approval of it. Recorded as AMJA's answer."
  ur: "ایک سائل نے مسیحیوں کو کرسمس کی مبارکباد کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80630، 13 دسمبر 2009)⁩ کے مطابق سماجی مواقع پر مبارکباد جائز ہے؛ مذہبی تہوار اہل ملت کے مخصوص ہیں مگر عمومی کلمات سے مہذبانہ جواب بشرط دین کی تصدیق نہ ہو۔"
