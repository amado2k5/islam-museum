label: { ar: "مجاملة النصارى في أعيادهم", en: "Social courtesy toward Christians on their feasts", ur: "مسیحیوں کے تہواروں پر مہذبانہ سلوک", es: "Cortesía social hacia los cristianos en sus festividades", fr: "Courtoisie sociale envers les chrétiens lors de leurs fêtes", tr: "Hristiyanların tatillerinde sunduğu izniyle", id: "Disediakan oleh orang Kristen saat hari libur mereka" }
summary:
  ar: "سأل سائل عن جواز تهنئة النصارى بعيد الكريسماس من باب المجاملة وهم مقيمون في بلادهم أو الرد عليهم إن هنؤوهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 80630 بتاريخ 13 ديسمبر 2009)⁩ أن الأصل البر والقسط في التعامل مع أهل العهد من غير المسلمين ومن ذلك تهنئتهم في الأمور الاجتماعية المشتركة كالزواج وقدوم المولود، أما الأعياد الدينية فهي من خصوصيات الملل والنحل تبقى مختصة بأهلها، ولا بأس عند رجحان المصلحة من مجاملة بكلمات عامة لا تتضمن انتهاكًا لهذه الخصوصيات ولا إقرارًا لهم على دينهم أو رضًا به."
  en: "A questioner asked whether they may greet Christians on Christmas as courtesy while residing in their lands, or reply if greeted. Dr. Salah al-Sawi (fatwa no. 80630, 13 December 2009) answered that the default with covenant non-Muslims is kindness and equity, including congratulating them on shared social occasions — marriage, a new child; religious feasts belong to each creed's particularities and stay with their people, yet where benefit prevails there is no harm in courtesy with general words that neither violate those particularities nor affirm their religion or show approval of it. Recorded as AMJA's answer."
  ur: "ایک سائل نے مسیحیوں کو کرسمس کی مبارکباد کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 80630، 13 دسمبر 2009)⁩ کے مطابق سماجی مواقع پر مبارکباد جائز ہے؛ مذہبی تہوار اہل ملت کے مخصوص ہیں مگر عمومی کلمات سے مہذبانہ جواب بشرط دین کی تصدیق نہ ہو۔"
  es: "Un consultante preguntó si podían saludar a los cristianos en Navidad como muestra de cortesía mientras residían en sus tierras, o responder si eran saludados. El Dr. Salah al-Sawi (fatwa n.° 80630, 13 de diciembre de 2009) respondió que la norma general con los no musulmanes del pacto es la amabilidad y la equidad, incluyendo felicitarlos en ocasiones sociales compartidas: matrimonio, nacimiento de un hijo; las fiestas religiosas pertenecen a las particularidades de cada credo y se mantienen con su gente, pero cuando prevalece el beneficio, no hay inconveniente en la cortesía con palabras generales que no violen esas particularidades ni afirmen su religión ni muestren aprobación de ella. Registrada como la respuesta de AMJA."
  fr: "Une personne a demandé si, par courtoisie, il était permis de souhaiter Noël aux chrétiens lorsqu'on résidait sur leurs terres, ou de répondre à un message reçu. Le Dr Salah al-Sawi (fatwa n° 80630, 13 décembre 2009) a répondu que la règle de bienséance envers les non-musulmans est la bienveillance et l'équité, notamment en les félicitant lors d'événements sociaux communs – mariage, naissance d'un enfant –, et que les fêtes religieuses relèvent des spécificités de chaque confession et restent propres à leurs fidèles. Toutefois, lorsqu'il y a un intérêt à leur présenter des vœux, il n'y a pas lieu de nuire, en utilisant des formules de politesse générales qui ne contreviennent pas à ces spécificités et n'affirment ni n'approuvent leur religion. Cette réponse a été consignée dans la fatwa de l'AMJA."
  tr: "Bir soru soran, Hristiyanları kendi ülkelerinde yaşarken Noel arifesinde nezaket olarak tebrik etmenin veya tebrik edilirse yanıt vermenin izinliliği soruldu. Dr. Salah Al-Sawy (13 Aralık 2009 tarihli Fetva No. 80630) ilkenin ahit gayrimüslimlerle ilişkide doğruluk ve adalet olduğunu, evlilik ve yeni doğan bebeğin gelişi gibi ortak sosyal konularda tebrik edilmesini söyledi. Dini bayramlar ise mezheplere ve mezheplere özgüdür ve sadece kendi halkına özgüdür. Bu özellikleri ihlal etmeyen veya dinlerini onaylamayan genel ifadelerle nezaket lehine zarar yoktur."
  id: "Seorang penanya ditanya tentang diperbolehkannya memberi selamat kepada umat Kristen pada malam Natal sebagai bentuk kesopanan saat tinggal di negara mereka sendiri, atau menjawab jika mereka mendapat ucapan selamat. Dr. Salah Al-Sawy menjawab (Fatwa No. 80630 tanggal 13 Desember 2009) bahwa prinsipnya adalah kebenaran dan keadilan dalam berurusan dengan non-Muslim dalam perjanjian, termasuk mengucapkan selamat atas urusan sosial bersama seperti pernikahan dan kelahiran bayi baru lahir. Adapun hari raya keagamaan, mereka khusus untuk sekte dan sekte serta tetap eksklusif untuk umatnya. Tidak ada salahnya kesopanan dengan kata-kata umum yang tidak melanggar kekhasan tersebut atau mendukung atau menyetujui agama mereka."
