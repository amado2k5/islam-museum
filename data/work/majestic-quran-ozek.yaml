label: { ar: "القرآن المجيد: ترجمة إنجليزية لمعانيه ⁦(علي أوزك وفريقه)⁩", en: "The Majestic Qur'an: An English Rendition of Its Meanings (Ali Özek and team)", ur: "دی مجسٹک قرآن: انگریزی ترجمۂ معانی ⁦(علی اوزک اور ٹیم)⁩", es: "El majestuoso Corán: Una traducción al inglés de sus significados (Ali Özek y equipo)", fr: "Le Coran majestueux: une traduction anglaise de ses significations (Ali Özek et son équipe)", tr: "Görkemli Kur'an: Anlamlarının İngilizce Çevirisi (Ali Özek ve ekibi)", id: "Al-Qur'an yang Mulia: Terjemahan Bahasa Inggris dari Maknanya (Ali Ozek dan Timnya)" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها فريق من العلماء الأتراك بقيادة علي أوزك، أستاذ الدراسات الدينية في جامعة مرمرة، مع نور الدين أوزون أوغلو وتوفيق رشدي طوبوز أوغلو ومحمد مقصود أوغلو، وصدرت في إسطنبول سنة 1992، وهي من أوائل الترجمات الإنجليزية الصادرة في تركيا، ثم أعيد نشرها سنة 2000 بعنوان «القرآن المجيد» عن مؤسستي النووي وابن خلدون بعد أن راجعها عبد الحكيم مراد وعثمان هتشنسون ومصطفى البدوي، مع النص العربي ونحو 809 حواشٍ."
  en: "An English rendering of the meanings of the Qur'an by a team of Turkish scholars led by Ali Özek of Marmara University, with Nureddin Uzunoğlu, Tevfik Rüştü Topuzoğlu and Mehmet Maksutoğlu, published in Istanbul in 1992 as one of the first English translations produced in Turkey, and republished in 2000 as The Majestic Qur'an by the Nawawi and Ibn Khaldun Foundations after review by Abdal Hakim Murad, Uthman Hutchinson and Mostafa al-Badawi, with the Arabic text and some 809 footnotes."
  ur: "قرآن کے معانی کا انگریزی ترجمہ جو مرمرہ یونیورسٹی کے علی اوزک کی قیادت میں ترک علما کی ٹیم نے نورالدین اوزون اوغلو، توفیق رشدی طوپوز اوغلو اور محمد مقصود اوغلو کے ساتھ کیا؛ 1992 میں استنبول سے شائع ہوا اور ترکی میں تیار ہونے والے اولین انگریزی تراجم میں ہے، پھر 2000 میں نووی اور ابن خلدون فاؤنڈیشنز نے عبد الحکیم مراد، عثمان ہچنسن اور مصطفیٰ البدوی کی نظرِ ثانی کے بعد «دی مجسٹک قرآن» کے نام سے عربی متن اور تقریباً 809 حواشی کے ساتھ دوبارہ شائع کیا۔"
  es: "Una traducción al inglés de los significados del Corán realizada por un equipo de eruditos turcos liderado por Ali Özek de la Universidad de Marmara, con Nureddin Uzunoğlu, Tevfik Rüştü Topuzoğlu y Mehmet Maksutoğlu, publicada en Estambul en 1992 como una de las primeras traducciones al inglés producidas en Turquía, y republicada en 2000 como El Majestuoso Corán por las Fundaciones Nawawi e Ibn Khaldun después de la revisión de Abdal Hakim Murad, Uthman Hutchinson y Mostafa al-Badawi, con el texto árabe y unas 809 notas a pie de página."
  fr: "Une traduction anglaise des significations du Coran par une équipe d'érudits turcs dirigée par Ali Özek de l'Université de Marmara, avec Nureddin Uzunoğlu, Tevfik Rüştü Topuzoğlu et Mehmet Maksutoğlu, publiée à Istanbul en 1992 comme l'une des premières traductions anglaises produites en Turquie, et republiée en 2000 sous le titre Le Coran majestueux par les Fondations Nawawi et Ibn Khaldun après révision par Abdal Hakim Murad, Uthman Hutchinson et Mostafa al-Badawi, avec le texte arabe et quelque 809 notes de bas de page."
  tr: "Marmara Üniversitesi din bilimleri profesörü Ali Özek liderliğindeki Türk alimler ekibi tarafından hazırlanan Kur'an'ın anlamlarının İngilizce çevirisi; Nureddin Özünoğlu, Tavfik Özdi, Topuzoğlu ve Mehmet Mesisüoğlu ile birlikte hazırlanmıştır. 1992 yılında İstanbul'da yayımlanmış ve Türkiye'de yayımlanan en erken İngilizce çeviriler arasındadır. Daha sonra 2000 yılında Nevavi ve İbn Haldun kurumları tarafından \"Görkemli Kur'an\" başlığıyla, Abdul Hakim Murad, Osman Hutchinson ve Mustafa Al-Badawi tarafından Arapça metin ve yaklaşık 809 dipnot ile birlikte yeniden yayımlanmıştır."
  id: "Terjemahan bahasa Inggris dari makna Al-Qur'an yang disiapkan oleh tim sarjana Turki yang dipimpin oleh Ali Ozek, profesor studi agama di Universitas Marmara, bersama Nureddin Ozunoglu, Tavfiq Özdi, Topuzoglu, dan Mehmet Masusuoglu. Terjemahan ini diterbitkan di Istanbul pada tahun 1992 dan termasuk salah satu terjemahan bahasa Inggris paling awal yang diterbitkan di Turki. Kemudian diterbitkan ulang pada tahun 2000 dengan judul \"Al-Qur'an yang Gemilang\" oleh institusi Nawawi dan Ibn Khaldun setelah ditinjau oleh Abdul Hakim Murad, Osman Hutchinson, dan Mustafa Al-Badawi, bersama dengan teks Arab dan sekitar 809 catatan kaki."
