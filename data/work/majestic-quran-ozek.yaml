label: { ar: "القرآن المجيد: ترجمة إنجليزية لمعانيه ⁦(علي أوزك وفريقه)⁩", en: "The Majestic Qur'an: An English Rendition of Its Meanings (Ali Özek and team)", ur: "دی مجسٹک قرآن: انگریزی ترجمۂ معانی ⁦(علی اوزک اور ٹیم)⁩" }
summary:
  ar: "ترجمة إنجليزية لمعاني القرآن وضعها فريق من العلماء الأتراك بقيادة علي أوزك، أستاذ الدراسات الدينية في جامعة مرمرة، مع نور الدين أوزون أوغلو وتوفيق رشدي طوبوز أوغلو ومحمد مقصود أوغلو، وصدرت في إسطنبول سنة 1992، وهي من أوائل الترجمات الإنجليزية الصادرة في تركيا، ثم أعيد نشرها سنة 2000 بعنوان «القرآن المجيد» عن مؤسستي النووي وابن خلدون بعد أن راجعها عبد الحكيم مراد وعثمان هتشنسون ومصطفى البدوي، مع النص العربي ونحو 809 حواشٍ."
  en: "An English rendering of the meanings of the Qur'an by a team of Turkish scholars led by Ali Özek of Marmara University, with Nureddin Uzunoğlu, Tevfik Rüştü Topuzoğlu and Mehmet Maksutoğlu, published in Istanbul in 1992 as one of the first English translations produced in Turkey, and republished in 2000 as The Majestic Qur'an by the Nawawi and Ibn Khaldun Foundations after review by Abdal Hakim Murad, Uthman Hutchinson and Mostafa al-Badawi, with the Arabic text and some 809 footnotes."
  ur: "قرآن کے معانی کا انگریزی ترجمہ جو مرمرہ یونیورسٹی کے علی اوزک کی قیادت میں ترک علما کی ٹیم نے نورالدین اوزون اوغلو، توفیق رشدی طوپوز اوغلو اور محمد مقصود اوغلو کے ساتھ کیا؛ 1992 میں استنبول سے شائع ہوا اور ترکی میں تیار ہونے والے اولین انگریزی تراجم میں ہے، پھر 2000 میں نووی اور ابن خلدون فاؤنڈیشنز نے عبد الحکیم مراد، عثمان ہچنسن اور مصطفیٰ البدوی کی نظرِ ثانی کے بعد «دی مجسٹک قرآن» کے نام سے عربی متن اور تقریباً 809 حواشی کے ساتھ دوبارہ شائع کیا۔"
