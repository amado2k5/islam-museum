id: work/fatwa-amja-missing-jumua-for-work
class: work
kind: fatwa
label: { ar: "العمل الذي يشغل عن الجمعة", en: "Work that keeps one from Friday prayer", ur: "جمعہ سے روکنے والی ملازمت", es: "Trabajo que impide ir a la oración del viernes", fr: "Le travail qui empêche de faire la prière du vendredi" }
summary:
  ar: "سأل سائل هل يؤخذ معنى حديث من ترك الجمعة ثلاثًا بغير عذر طبع على قلبه على كسب العيش إن كان عمله يشغله عنها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82632 بتاريخ 20 سبتمبر 2010)⁩ بوجوب الحرص على إقامة الجمع وتجنب تركها خارج بلاد الإسلام وداخلها فالمسلم مطالب بتقوى الله حيثما كان، والعمل الذي يلجئه لترك الجمعة لا مقام له فيه وينبغي أن يكون بقاؤه فيه بقدر ضرورته إليه مع فتح عينيه للبحث عن بديل واستفراغ الوسع في الانتقال إليه عند أول القدرة."
  en: "A questioner cited the sound hadith that whoever misses three Fridays without excuse has his heart sealed, and asked whether the same holds when earning a living is the cause. Dr. Salah al-Sawi (fatwa no. 82632, 20 September 2010) answered that Friday prayer must be kept up and not abandoned, inside and outside Muslim lands alike — the Muslim is bound by piety wherever he is; a job that forces him to drop Friday is no place to stay: his remaining in it should measure his need of it while he keeps looking for an alternative and expends his effort to move at the first ability."
  ur: "ایک سائل نے پوچھا کہ روزی کمانے کے لیے جمعہ چھوڑنا اسی وعید میں آتا ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82632، 20 ستمبر 2010)⁩ کے مطابق جمعہ ہر صورت قائم رکھنا لازم ہے؛ ایسی نوکری میں صرف اتنا رہنا چاہیے جتنی ضرورت ہو اور متبادل تلاش کرتا رہے۔"
  es: "Un consultante citó el hadiz auténtico que dice que quien falta tres viernes sin justificación tiene el corazón sellado, y preguntó si lo mismo se aplica cuando la causa es ganarse la vida. El Dr. Salah al-Sawi (fatwa n.° 82632, 20 de septiembre de 2010) respondió que la oración del viernes debe mantenerse y no abandonarse, tanto dentro como fuera de las tierras musulmanas; el musulmán está obligado por la piedad dondequiera que esté; un trabajo que lo obliga a dejar de rezar el viernes no es un lugar donde quedarse: su permanencia en él debe medir su necesidad de la oración mientras busca una alternativa y se esfuerza por cambiar de trabajo a la primera oportunidad."
  fr: "Un internaute a cité un hadith authentique selon lequel quiconque manque trois vendredis sans excuse a le cœur scellé, et a demandé si cela s'applique également lorsque la cause est liée aux besoins de la subsistance. Le Dr Salah al-Sawi (fatwa n° 82632, 20 septembre 2010) a répondu que la prière du vendredi doit être maintenue et non abandonnée, aussi bien en terre d'islam qu'à l'étranger: le musulman est tenu par la piété où qu'il soit; un travail qui l'oblige à négliger la prière du vendredi n'est pas une situation acceptable: s'il continue à l'observer, il doit en évaluer la nécessité tout en cherchant une alternative et en s'efforçant de trouver une solution au plus vite."
