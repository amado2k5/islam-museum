id: work/fatwa-amja-missing-jumua-for-work
class: work
kind: fatwa
label: { ar: "العمل الذي يشغل عن الجمعة", en: "Work that keeps one from Friday prayer", ur: "جمعہ سے روکنے والی ملازمت" }
summary:
  ar: "سأل سائل هل يؤخذ معنى حديث من ترك الجمعة ثلاثًا بغير عذر طبع على قلبه على كسب العيش إن كان عمله يشغله عنها. أجاب د. صلاح الصاوي ⁦(فتوى رقم 82632 بتاريخ 20 سبتمبر 2010)⁩ بوجوب الحرص على إقامة الجمع وتجنب تركها خارج بلاد الإسلام وداخلها فالمسلم مطالب بتقوى الله حيثما كان، والعمل الذي يلجئه لترك الجمعة لا مقام له فيه وينبغي أن يكون بقاؤه فيه بقدر ضرورته إليه مع فتح عينيه للبحث عن بديل واستفراغ الوسع في الانتقال إليه عند أول القدرة."
  en: "A questioner cited the sound hadith that whoever misses three Fridays without excuse has his heart sealed, and asked whether the same holds when earning a living is the cause. Dr. Salah al-Sawi (fatwa no. 82632, 20 September 2010) answered that Friday prayer must be kept up and not abandoned, inside and outside Muslim lands alike — the Muslim is bound by piety wherever he is; a job that forces him to drop Friday is no place to stay: his remaining in it should measure his need of it while he keeps looking for an alternative and expends his effort to move at the first ability."
  ur: "ایک سائل نے پوچھا کہ روزی کمانے کے لیے جمعہ چھوڑنا اسی وعید میں آتا ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 82632، 20 ستمبر 2010)⁩ کے مطابق جمعہ ہر صورت قائم رکھنا لازم ہے؛ ایسی نوکری میں صرف اتنا رہنا چاہیے جتنی ضرورت ہو اور متبادل تلاش کرتا رہے۔"
