label: { ar: "ما ينبغي فعله على من أراد الدخول في صلاة الجماعة ولم يجد مكانًا في الصف", en: "What to do when joining congregational prayer and finding no place in the row", ur: "جماعت میں شامل ہونا اور صف میں جگہ نہ ملنا" }
summary:
  ar: "سائل سأل عمن دخل المسجد ليصلي مع الجماعة فلم يجد مكانًا في الصف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22172)⁩ أن له أن ينبه واحدًا من المصلين في الصف ليقوم معه صفًا آخر خلف الصف على ما فصّل الجواب من الآداب والأحكام."
  en: "A questioner asked about one who enters the mosque to pray with the congregation and finds no place in the row. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22172) answered that he may alert one of the worshippers in the row to stand with him, forming another row behind, with the etiquettes and rulings the answer details."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو جماعت کے ساتھ نماز کے لیے مسجد میں داخل ہو مگر صف میں جگہ نہ ملے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22172)⁩ نے جواب دیا کہ وہ صف میں سے ایک نمازی کو اشارہ کر سکتا ہے کہ وہ اس کے ساتھ پیچھے نئی صف بنا لے، جواب میں آداب اور احکام کی تفصیل ہے۔"
