id: work/fatwa-dar-alifta-eg-no-place-in-the-row
class: work
kind: fatwa
label: { ar: "ما ينبغي فعله على من أراد الدخول في صلاة الجماعة ولم يجد مكانًا في الصف", en: "What to do when joining congregational prayer and finding no place in the row", ur: "جماعت میں شامل ہونا اور صف میں جگہ نہ ملنا", es: "Qué hacer al unirse a la oración congregacional y no encontrar un lugar en la fila.", fr: "Que faire lorsqu'on participe à la prière collective et qu'on ne trouve pas de place dans la rangée", tr: "Cemaat duasına katılmak isteyen ama sırada yer bulamayan biri için ne yapılmalı?", id: "Apa yang harus dilakukan untuk seseorang yang ingin bergabung dalam doa jemaat tetapi tidak menemukan tempat di barisan" }
summary:
  ar: "سائل سأل عمن دخل المسجد ليصلي مع الجماعة فلم يجد مكانًا في الصف. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22172)⁩ أن له أن ينبه واحدًا من المصلين في الصف ليقوم معه صفًا آخر خلف الصف على ما فصّل الجواب من الآداب والأحكام."
  en: "A questioner asked about one who enters the mosque to pray with the congregation and finds no place in the row. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22172) answered that he may alert one of the worshippers in the row to stand with him, forming another row behind, with the etiquettes and rulings the answer details."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو جماعت کے ساتھ نماز کے لیے مسجد میں داخل ہو مگر صف میں جگہ نہ ملے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22172)⁩ نے جواب دیا کہ وہ صف میں سے ایک نمازی کو اشارہ کر سکتا ہے کہ وہ اس کے ساتھ پیچھے نئی صف بنا لے، جواب میں آداب اور احکام کی تفصیل ہے۔"
  es: "Un consultante preguntó sobre la situación de quien entra a la mezquita para rezar con la congregación y no encuentra lugar en la fila. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22172) respondió que puede avisar a uno de los fieles de la fila para que se coloque a su lado, formando otra fila detrás, y la respuesta detalla las normas y protocolos aplicables."
  fr: "Un fidèle a posé une question concernant une personne entrant dans la mosquée pour prier en congrégation et ne trouvant pas de place dans la rangée. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22172) a répondu qu'elle pouvait demander à un autre fidèle de se joindre à elle, formant ainsi une nouvelle rangée derrière elle. La réponse détaille les règles et usages à respecter."
  tr: "Bir soru soran kişi, cemaatle birlikte namaz kılmak için camiye kimin girdiğini ama sırada yer bulamadığını sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22172), görgü kuralları ve kurallarda belirtildiği üzere, sıradaki ibadet edenlerden birini, sıranın arkasındaki başka bir sırada kendisiyle birlikte durması için uyarabileceğini söyledi."
  id: "Seorang penanya menanyakan siapa yang masuk ke masjid untuk salat bersama jamaah, tetapi tidak menemukan tempat di barisan tersebut. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22172) menjawab bahwa ia dapat memberi tahu salah satu jamaah di barisan untuk berdiri bersamanya di baris lain di belakang barisan, sesuai dengan etiket dan keputusan."
