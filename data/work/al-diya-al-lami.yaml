label: { ar: "الضياء اللامع من الخطب الجوامع", en: "Al-Diya' al-Lami' min al-Khutab al-Jawami' (Ibn 'Uthaymin)", ur: "الضیاء اللامع من الخطب الجوامع (ابن عثیمین)" }
summary:
  ar: "مجموع خطب الجمعة والعيدين والاستسقاء لمحمد بن صالح العثيمين، التي ألقاها في الجامع الكبير بعنيزة خلفاً لشيخه عبد الرحمن بن ناصر السعدي من سنة 1376هـ إلى 1421هـ؛ نشر منها أكثر من 125 خطبة سنة 1392هـ مرتبة في عشرة أقسام من العلم وأصول الدين والعبادات والمعاملات والنكاح وتربية الأولاد والحدود والأطعمة ومواضيع عامة وخطب الشهور، ثم ملحقاً من 118 خطبة، ثم أضافت مؤسسته بعد وفاته جميع خطبه الأولى المكتوبة بخطه {cite:al-diya-al-lami-uthaymin-thurayya-2019 p. 5-11}."
  en: "The collection of Friday, festival and rain-prayer sermons by Muhammad ibn Salih al-'Uthaymin, delivered in the Great Mosque of 'Unayza as successor to his teacher 'Abd al-Rahman ibn Nasir al-Sa'di from 1376 to 1421 AH. In 1392 AH he published more than 125 of them in ten sections: knowledge, the foundations of religion, worship, transactions, marriage, raising children, penalties, food, general topics and sermons for particular months. He later added a supplement of 118, and after his death his Foundation added all his first sermons written in his own hand {cite:al-diya-al-lami-uthaymin-thurayya-2019 p. 5-11}."
  ur: "محمد بن صالح العثیمین کے جمعہ، عیدین اور استسقاء کے خطبات کا مجموعہ، جو انہوں نے اپنے استاد عبد الرحمن بن ناصر السعدی کے جانشین کے طور پر 1376ھ سے 1421ھ تک عنیزہ کی جامع کبیر میں دیے۔ انہوں نے 1392ھ میں ان میں سے 125 سے زیادہ خطبے دس اقسام میں شائع کیے: علم، اصولِ دین، عبادات، معاملات، نکاح، تربیتِ اولاد، حدود، اطعمہ، عام موضوعات اور خاص مہینوں کے خطبات۔ پھر 118 خطبوں کا ضمیمہ شامل کیا، اور ان کی وفات کے بعد ان کی فاؤنڈیشن نے ان کے ہاتھ کے لکھے ہوئے تمام ابتدائی خطبے شامل کر دیے {cite:al-diya-al-lami-uthaymin-thurayya-2019 p. 5-11}۔"
