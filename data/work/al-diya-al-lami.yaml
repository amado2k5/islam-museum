structure: "في ترتيب المؤلف (1392هـ) عشرة أقسام: العلم؛ أصول الدين (أسماء الله، آياته، البعثة والأخلاق، الغزوات، أشراط الساعة، القيامة والجنة والنار، القدر، محاسن الإسلام، الآداب)؛ العبادات (الطهارة، الصلاة، الزكاة، الصيام وزكاة الفطر وعيده، الحج والأضحية وعيدها، الجهاد)؛ المعاملات؛ النكاح؛ تربية الأولاد؛ الحدود والقصاص والأمر بالمعروف؛ النفقات والأطعمة؛ مواضيع عامة؛ خطب الشهور ووداع العام (ج1 ص 8–10). ونشرة 1440هـ في أجزاء متعددة."
