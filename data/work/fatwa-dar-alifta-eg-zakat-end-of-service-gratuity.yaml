id: work/fatwa-dar-alifta-eg-zakat-end-of-service-gratuity
class: work
kind: fatwa
label: { ar: "كيفية إخراج الزكاة في مكافأة نهاية الخدمة", en: "How to pay zakat on an end-of-service gratuity", ur: "اختتامِ خدمت انعام پر زکات کیسے ادا ہو", es: "Cómo pagar el zakat sobre la propina al finalizar un servicio", fr: "Comment s'acquitter de la zakat sur un pourboire de fin de service ?", tr: "Hizmet sonu bonuslarında zekat nasıl ödenir", id: "Cara membayar zakat pada bonus akhir layanan" }
summary:
  ar: "سائل سأل عن كيفية إخراج الزكاة في مكافأة نهاية الخدمة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24319)⁩ أن المال الذي يتسلمه العامل تحت مسمى «مكافأة نهاية الخدمة» لا تتعلق به الزكاة إلا بعد قبضه لعدم تحقق الملك التام قبل ذلك، ويبدأ احتساب حول الزكاة فيه من حين القبض كما فصّل الجواب."
  en: "A questioner asked how to pay zakat on an end-of-service gratuity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24319) answered that money a worker receives under the name 'end-of-service gratuity' is not liable to zakat until it is actually received, since complete ownership is not established before then; the zakat year is counted from receipt, as the answer details."
  ur: "ایک سائل نے اختتامِ خدمت انعام پر زکات ادا کرنے کا طریقہ پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24319)⁩ نے جواب دیا کہ ملازم کو 'اختتامِ خدمت انعام' کے نام سے ملنے والی رقم پر زکات اس وقت تک نہیں آتی جب تک وہ حاصل نہ کر لے، کیونکہ اس سے پہلے مکمل ملکیت ثابت نہیں ہوتی؛ زکات کا سال وصولی سے شروع ہوتا ہے جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó cómo pagar el zakat sobre una gratificación por fin de servicio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24319) respondió que el dinero que un trabajador recibe bajo el nombre de \"gratificación por fin de servicio\" no está sujeto al zakat hasta que se recibe efectivamente, ya que la propiedad completa no se establece antes de ese momento; el año del zakat se cuenta a partir de la recepción, como se detalla en la respuesta."
  fr: "Une personne a demandé comment s'acquitter de la zakat sur une prime de fin de service. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24319) a répondu que les sommes perçues par un travailleur au titre de « prime de fin de service » ne sont pas soumises à la zakat tant qu'elles n'ont pas été effectivement perçues, la pleine propriété n'étant pas établie avant ce moment; l'année de la zakat court à partir de la réception, comme le précise la réponse."
  tr: "Bir soru soran kişi, hizmet sonu bahşişi olarak zekatın nasıl ödendiğini sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 24319), 'hizmet sonu ikramiyesi' başlığıyla aldığı paranın alınana kadar zekata tabi olmadığını, çünkü tam mülkiyet önceden belirlenmediğini ve zekat hesaplamasının alındığı andan itibaren başladığını yanıtladı; bu da cevabda detaylandırılmıştır."
  id: "Seorang penanya bertanya bagaimana zakat dibayarkan berdasarkan tip akhir masa kerja. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 24319) menjawab bahwa uang yang diterima oleh pekerja dengan judul 'tip akhir dinas' tidak dikenakan zakat sampai diterima, karena kepemilikan penuh belum ditetapkan sebelumnya, dan perhitungan zakat dimulai dari saat penerimaan, sebagaimana dijelaskan dalam jawaban."
