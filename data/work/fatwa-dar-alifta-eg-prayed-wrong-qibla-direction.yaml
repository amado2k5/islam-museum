id: work/fatwa-dar-alifta-eg-prayed-wrong-qibla-direction
class: work
kind: fatwa
label: { ar: "حكم صلاة من صلى دون أن يتحرى جهة القبلة ثم ظهر له أنه كان مخطئًا", en: "One who prayed without ascertaining the qibla then found he was wrong", ur: "قبلہ کی تحقیق کے بغیر نماز پڑھنے والے کا حکم", es: "Quien rezó sin determinar la qibla descubrió que estaba equivocado.", fr: "Celui qui priait sans déterminer la qibla s'est ensuite aperçu qu'il s'était trompé." }
summary:
  ar: "سائل صلى دون أن يتحرى جهة القبلة ثم ظهر له أنه كان مخطئًا فسأل عن صلاته. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21498)⁩ أنه يجب على من أراد الصلاة وجهل جهة القبلة أن يسأل عن اتجاهها أو يجتهد في تحريها فإذا سأل أو اجتهد فتفصيل حكمه في الجواب."
  en: "A man prayed without ascertaining the qibla direction then found he had been wrong, and asked about his prayer. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21498) answered that one who wants to pray and does not know the qibla must ask or exert effort to ascertain it; the ruling on his case is set out in the answer."
  ur: "ایک شخص نے قبلہ کی تحقیق کے بغیر نماز پڑھی پھر معلوم ہوا کہ وہ غلط تھا؛ اس نے اپنی نماز کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21498)⁩ نے جواب دیا کہ قبلہ نہ جاننے والے کو پوچھنا یا اجتہاد کرنا ہوتا ہے؛ جواب میں اس کا حکم تفصیل سے بیان ہوا۔"
  es: "Un hombre rezó sin conocer la dirección de la qibla y, al darse cuenta de su error, preguntó sobre su oración. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21498) respondió que quien desea rezar y desconoce la qibla debe preguntar o esforzarse por averiguarla; la resolución de su caso se encuentra en la respuesta."
  fr: "Un homme pria sans connaître la direction de la qibla, puis, s'étant rendu compte de son erreur, il interrogea le grand mufti égyptien Dar al-Ifta (Dr Nazir Muhammad Ayyad, fatwa n° 21498) à ce sujet. Il répondit que celui qui souhaite prier et ignore la qibla doit s'interroger ou s'efforcer de la déterminer; la décision concernant son cas est exposée dans la réponse."
