id: work/fatwa-dar-alifta-eg-buying-suspected-stolen-goods
class: work
kind: fatwa
label: { ar: "حكم شراء السلع التي يظن أنها مسروقة", en: "Buying goods suspected of being stolen", ur: "چوری شدہ سمجھی جانے والی چیز خریدنا", es: "Comprar artículos sospechosos de ser robados", fr: "Achat de biens soupçonnés d'être volés", tr: "Çalındığı Şüphelenilen Malların Satın Alınmasına Dair Karar", id: "Putusan Pembelian Barang yang Dicurigai Telah Dicuri" }
summary:
  ar: "سائل سأل عن شراء سلع يظن أنها مسروقة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21644)⁩ أن الأصل براءة ذمة البائع عن التهمة ما دام المبيع تحت يده وكان الظاهر ملكه له ولا يجوز إساءة الظن به على ما فصّل الجواب من أحوال المسألة."
  en: "A questioner asked about buying goods suspected of being stolen. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21644) answered that the default is the seller's innocence while the goods are in his hand and apparently his — suspicion against him is not permitted — with the cases the answer sets out."
  ur: "ایک سائل نے چوری کا شبہ رکھنے والی چیز خریدنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21644)⁩ نے جواب دیا کہ اصول بائع کی براءت ہے جب تک چیز اس کے پاس ہو اور ظاہر اس کی ملکیت ہو؛ بدگمانی جائز نہیں — جیسا کہ جواب میں احوال بیان ہوئے۔"
  es: "Un consultante preguntó sobre la compra de artículos sospechosos de ser robados. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21644) respondió que la excepción es la inocencia del vendedor mientras los artículos están en su poder y aparentemente son suyos; la sospecha contra él no está permitida, en los casos que se exponen en la respuesta."
  fr: "Un internaute a posé une question concernant l'achat de biens soupçonnés d'être volés. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21644) a répondu que, tant que les biens sont en sa possession et lui appartiennent apparemment, le vendeur est présumé innocent – aucun soupçon à son encontre n'est admis – en citant les cas exposés dans la réponse."
  tr: "Bir soru soran kişi, çalındığı şüphelenilen malların satın alınması hakkında soru sordu. Mısırlı Dar al-Ifta (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21644), satıcının suçlamadan masumiyetinin satıcının elinde ve görünüşe göre mülkü olduğu sürece masumiyet olduğunu ve cevabında ayrıntılı olarak belirtildiği gibi, kendisiyle ilgili herhangi bir şüphe duyulmasının yasak olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang pembelian barang yang diduga dicuri. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21644) menjawab bahwa kesalahan adalah ketidakbersalahan penjual terhadap tuduhan selama barang yang dijual masih dimiliki olehnya dan tampaknya miliknya, dan tidak diperbolehkan memiliki kecurigaan terhadapnya, seperti yang dijelaskan dalam jawaban."
