label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن صرف الزكاة لصالح صندوق التضامن الإسلامي", en: "IIFA resolution on paying zakat to the Islamic Solidarity Fund", ur: "اکیڈمی کی قرارداد: اسلامی یکجہتی فنڈ کو زکوٰۃ کی ادائیگی", es: "Resolución de la IIFA sobre el pago del zakat al Fondo de Solidaridad Islámica.", fr: "Résolution de l'IIFA sur le versement de la zakat au Fonds de solidarité islamique", tr: "Uluslararası İslami Fiqh Akademisi'nin İslami Dayanışma Fonu lehine zekat dağıtımına ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai penyaluran Zakat untuk Dana Solidaritas Islam" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: تكليف الأمانة العامة بالتعاون مع صندوق التضامن الإسلامي بإعداد الدراسات اللازمة وعرض الموضوع على مجلس المجمع في دورته القادمة ⁦(انظر القرار 27 (2/4))⁩."
  en: "IIFA's third-session resolution (Amman, October 1986) on paying zakat to the Islamic Solidarity Fund: it tasked the secretariat, in cooperation with the Fund, with preparing the needed studies and presenting the matter at the next session — see resolution 27 (2/4)."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد ⁦(امان، اکتوبر 1986ء)⁩: اسلامی یکجہتی فنڈ کو زکوٰۃ دینے کے موضوع پر تحقیقات تیار کر کے اگلی مجلس میں پیش کرنے کا حکم۔"
  es: "Resolución del tercer período de sesiones de la IIFA (Amán, octubre de 1986) sobre el pago del zakat al Fondo de Solidaridad Islámica: encargó a la secretaría, en cooperación con el Fondo, la preparación de los estudios necesarios y la presentación del asunto en el siguiente período de sesiones — véase la resolución 27 (2/4)."
  fr: "Résolution de la troisième session de l'IIFA (Amman, octobre 1986) sur le paiement de la zakat au Fonds de solidarité islamique: elle chargeait le secrétariat, en coopération avec le Fonds, de préparer les études nécessaires et de présenter la question à la prochaine session — voir résolution 27 (2/4)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986) kararı: Genel Sekreterliğe İslami Dayanışma Fonu ile iş birliği içinde gerekli çalışmaları hazırlama ve konuyu Konsey konseyine bir sonraki oturumunda sunma görevi verildi (bkz. 27 (2/4))."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiganya (Amman, Oktober 1986): Menugaskan Sekretariat Jenderal, bekerja sama dengan Dana Solidaritas Islam, untuk menyiapkan studi yang diperlukan dan menyampaikan masalah tersebut kepada dewan Dewan pada sesi berikutnya (lihat Resolusi 27 (2/4))."
