id: work/fatwa-dar-alifta-eg-selling-visas-via-unlicensed-offices
class: work
kind: fatwa
label: { ar: "حكم بيع تأشيرات الدول من خلال مكاتب غير مرخصة", en: "Selling countries' visas through unlicensed offices", ur: "غیر لائسنس یافتہ دفاتر سے ویزے فروخت کرنا", es: "Venta de visas de países a través de oficinas no autorizadas", fr: "Vente de visas de pays par le biais de bureaux non agréés" }
summary:
  ar: "سائل سأل عن قيام بعض الأفراد أو الجهات ببيع تأشيرات السفر للدول الخارجية بالاحتيال من خلال المكاتب غير المرخص لها بذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21513)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about individuals or bodies selling travel visas for foreign countries fraudulently through offices not licensed for it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21513) answered by setting out the ruling."
  ur: "ایک سائل نے غیر لائسنس یافتہ دفاتر کے ذریعے دھوکے سے بیرونی ممالک کے ویزے بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21513)⁩ نے جواب میں اس کا حکم بیان کیا۔"
  es: "Un consultante preguntó sobre personas u organismos que venden visas de viaje para países extranjeros de forma fraudulenta a través de oficinas no autorizadas para ello. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21513) respondió exponiendo la normativa."
  fr: "Un internaute a posé une question concernant la vente frauduleuse de visas de voyage pour l'étranger par des individus ou des organismes via des agences non agréées. La Cour suprême égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21513) a répondu en énonçant la décision."
