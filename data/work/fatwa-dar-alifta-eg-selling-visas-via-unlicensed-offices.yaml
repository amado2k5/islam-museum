summary:
  ar: "سائل سأل عن قيام بعض الأفراد أو الجهات ببيع تأشيرات السفر للدول الخارجية بالاحتيال من خلال المكاتب غير المرخص لها بذلك. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21513)⁩ ببيان حكم ذلك على وجهه."
  en: "A questioner asked about individuals or bodies selling travel visas for foreign countries fraudulently through offices not licensed for it. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21513) answered by setting out the ruling."
  ur: "ایک سائل نے غیر لائسنس یافتہ دفاتر کے ذریعے دھوکے سے بیرونی ممالک کے ویزے بیچنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21513)⁩ نے جواب میں اس کا حکم بیان کیا۔"
