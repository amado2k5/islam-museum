label: { ar: "قصيدة المتنبي «إنما بدر بن عمار سحاب»", en: "Al-Mutanabbi's ode 'Badr ibn Ammar is but a cloud'", es: "La oda de Al-Mutanabbi: \"Badr ibn Ammar no es más que una nube\".", fr: "L'ode d'Al-Mutanabbi « Badr ibn Ammar n'est qu'un nuage »", ur: "المتنبی کا قول 'بدر بن عمار ایک بادل ہے'" }
summary:
  ar: "قصيدة من الخفيف على روي الباء للمتنبي، قالها ارتجالاً وهو على الشراب وقد صفت الفاكهة والنرجس كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.143}}."
  en: "An ode in the khafif metre on the rhyme ba by al-Mutanabbi; improvised at a drinking session while fruit and narcissus were set out, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.143}}."
  es: "Una oda en metro khafif sobre la rima ba de al-Mutanabbi; improvisada en una sesión de bebida mientras se disponían frutas y narcisos, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.143}}."
  fr: "Une ode en mètre khafif sur la rime ba par al-Mutanabbi; improvisée lors d'une séance de boisson alors que des fruits et des narcisses étaient disposés, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.143}}."
  ur: "المتنبی کی شاعری با پر خفیف میٹر میں ایک اوڈ؛ پینے کے سیشن میں تیار کیا گیا جب پھل اور نرگس کا اہتمام کیا گیا تھا، جیسا کہ دار بیروت ایڈیشن نے اس کا تعارف کرایا ہے {{حوالہ:دیوان-متناببی-دار-بیروت-1983 p.143}}۔"
