label: { ar: "قرار مجمع الفقه الإسلامي الدولي 206 (22/2) بشأن أسئلة معهد المواصفات والمقاييس للدول الإسلامية ⁦(سيميك)⁩", en: "IIFA resolution 206 (22/2) on the questions of the Standards and Metrology Institute for Islamic Countries (SMIIC)", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 206 (22/2): اسلامی ممالک کے معیارات و پیمائش ادارے ⁦⁦(سملیک)⁩⁩ کے سوالات", es: "Resolución 206 (22/2) de la IIFA sobre las cuestiones del Instituto de Normas y Metrología para los Países Islámicos (SMIIC)", fr: "Résolution 206 (22/2) de l'IIFA sur les questions de l'Institut des normes et de la métrologie des pays islamiques (SMIIC)", tr: "Uluslararası İslami Fiqh Akademisi Kararı 206 (22/2) İslam Ülkeleri Standartlar ve Metroloji Enstitüsü'nün (CIMIC) sorularına ilişkin", id: "Keputusan International Islamic Fiqh Academy 206 (22/2) mengenai pertanyaan dari Institute of Standards and Metrology for Islamic Countries (CIMIC)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩⁩. بعد اطلاع المجلس على أسئلة معهد المواصفات والمقاييس للدول الإسلامية ⁦⁦(سيميك)⁩⁩ وأجوبة الندوة المنعقدة للإجابة عليها من قبل أمانة المجمع ومناقشته لها، انتهى — نظرًا لتعدد الأقوال الفقهية وكثرة المسائل واختلاف الرأي الفقهي ولما أبداه أعضاء المجلس من ملاحظات — إلى إحالة الموضوع إلى أمانة المجمع لتعد أجوبتها على الأسئلة على ضوء ذلك ليعاد عرضها على المجمع. وهو قرار إحالة لا قرار حكم؛ لم يُصدر المجمع في هذه الدورة أجوبة نهائية على أسئلة سيميك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). After reviewing the questions of the Standards and Metrology Institute for Islamic Countries (SMIIC) and the answers of the seminar convened to answer them on the Academy's behalf, and discussing them, it concluded — given the multiplicity of juristic opinions, the number of questions and the divergence of juristic views, and the remarks made by council members — to refer the matter to the Academy's secretariat to prepare the answers to the questions in that light, to be presented again to the Academy. This is a referral, not a ruling: the Academy issued no final answers to the SMIIC questions at this session."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩⁩ میں۔ اسلامی ممالک کے معیارات و پیمائش ادارے ⁦⁦(سملیک)⁩⁩ کے سوالات اور اکیڈمی کے سیکرٹریٹ کی طرف سے ان کے جواب دینے کے لیے منعقدہ سیمینار کے جوابات کا جائزہ اور مباحث کے بعد، اکیڈمی نے — فقہی اقوال کی کثرت، مسائل کی بڑی تعداد اور فقہی رائے کے اختلاف اور رکنوں کے اظہار کردہ ملاحظات کی وجہ سے — معاملہ اپنے سیکرٹریٹ کو واپس بھیجا تاکہ وہ اسی روشنی میں سوالات کے جواب تیار کر کے دوبارہ اکیڈمی کے سامنے پیش کرے۔ یہ رجوع کی قرارداد ہے، حکم کی قرارداد نہیں: اکیڈمی نے اس مجلس میں سملیک کے سوالات کے حتمی جواب جاری نہیں کیے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión celebrada en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). Tras examinar las preguntas del Instituto de Normas y Metrología para los Países Islámicos (SMIIC) y las respuestas del seminario convocado para responderlas en nombre de la Academia, y después de debatirlas, se concluyó —dada la multiplicidad de opiniones jurídicas, el número de preguntas, la divergencia de puntos de vista jurídicos y las observaciones de los miembros del consejo— remitir el asunto a la secretaría de la Academia para que prepare las respuestas a las preguntas en ese contexto, las cuales se presentarán nuevamente a la Academia. Se trata de una remisión, no de una resolución: la Academia no emitió respuestas definitivas a las preguntas del SMIIC en esta sesión."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 22e session au Koweït (2-5 Jumada al-Akhira 1436, soit 22-25 mars 2015). Après avoir examiné les questions de l'Institut des normes et de la métrologie des pays islamiques (SMIIC) et les réponses du séminaire convoqué à cet effet au nom de l'Académie, et après en avoir discuté, l'Académie a conclu – compte tenu de la multiplicité des avis juridiques, du nombre de questions et de la divergence des points de vue, ainsi que des observations formulées par les membres du Conseil – de renvoyer la question à son secrétariat afin qu'il élabore des réponses, qui seront ensuite présentées à l'Académie. Il s'agit d'un renvoi et non d'une décision: l'Académie n'a émis aucune réponse définitive aux questions du SMIIC lors de cette session."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Kuveyt Devleti'ndeki yirmi ikinci oturumunda (2–5 Jumada al-Akhirah 1436 H, 22–25 Mart 2015) toplu kararı. İslam Ülkeleri Standartlar ve Metroloji Enstitüsü'nün (SIMIC) soruları ile Meclis Sekreterliği tarafından verilen seminerin yanıtları ve tartışmaları incelendikten sonra, Konsey, çok sayıda fıkıh görüşü, çok sayıda konu, farklı hukuk görüşleri ve Konsey üyelerinin gözlemleri nedeniyle, konuyu yanıtlarını hazırlamak üzere Sekretarya'ya sevk etmeye ve ardından Akademi'ye yeniden sunulmaya karar verdi. Bu, bir yönlendirme kararıdır, karar verme kararı değildir; Akademi bu oturumda SIMIC sorularına nihai yanıtlar vermemiştir."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh dua di Negara Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015). Setelah meninjau pertanyaan dari Institut Standar dan Metrologi untuk Negara-negara Islam (SIMIC) dan tanggapan seminar yang diadakan oleh Sekretariat Kamar dan diskusinya, Dewan memutuskan—karena banyaknya pendapat yurisprudensi, banyaknya isu, perbedaan pendapat yurisprudensi, dan pengamatan anggota Dewan—untuk merujuk masalah ini ke Sekretariat agar dapat menyiapkan jawabannya sesuai dan kemudian diajukan kembali ke Akademi. Ini adalah keputusan rujukan, bukan keputusan putusan; Akademi tidak mengeluarkan jawaban akhir atas pertanyaan SIMIC selama sesi ini."
