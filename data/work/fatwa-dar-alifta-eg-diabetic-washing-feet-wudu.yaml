id: work/fatwa-dar-alifta-eg-diabetic-washing-feet-wudu
class: work
kind: fatwa
label: { ar: "حكم غسل القدمين في الوضوء لمريض السكري", en: "A diabetic washing his feet in wudu", ur: "ذیابیطس کے مریض کا وضو میں پاؤں دھونا", es: "Un diabético lavándose los pies en wudu", fr: "Un diabétique se lave les pieds pour faire ses ablutions." }
summary:
  ar: "سائل يعاني التهابات في القدمين خاصة بين الأصابع بسبب المرض فسأل عن غسلهما في الوضوء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21788)⁩ أنه يجوز شرعًا لمن يعاني مثل هذه الالتهابات أن يكتفي بغسل قدميه مرة واحدة على ما فصّل الجواب."
  en: "A man suffering foot inflammations — especially between the toes — from illness asked about washing them in wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21788) answered that one suffering such inflammation may suffice with washing the feet once, as the answer details."
  ur: "ایک شخص کو بیماری کے سبب پاؤں میں خاص طور پر انگلیوں کے درمیان سوزش ہے؛ اس نے وضو میں انہیں دھونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21788)⁩ نے جواب دیا کہ ایسا شخص ایک بار پاؤں دھونے پر اکتفا کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre que sufría de inflamación en los pies, especialmente entre los dedos, debido a una enfermedad, preguntó sobre la posibilidad de lavarlos durante el wudu (ablución ritual). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21788) respondió que, como se detalla en la respuesta, a quien padece dicha inflamación le basta con lavarse los pies una sola vez."
  fr: "Un homme souffrant d'inflammations aux pieds, notamment entre les orteils, suite à une maladie, a demandé s'il devait les laver lors des ablutions. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21788) a répondu qu'un lavage de pieds unique pouvait suffire en cas d'inflammation, comme le précise la réponse."
