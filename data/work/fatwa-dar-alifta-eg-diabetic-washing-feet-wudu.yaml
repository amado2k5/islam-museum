summary:
  ar: "سائل يعاني التهابات في القدمين خاصة بين الأصابع بسبب المرض فسأل عن غسلهما في الوضوء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21788)⁩ أنه يجوز شرعًا لمن يعاني مثل هذه الالتهابات أن يكتفي بغسل قدميه مرة واحدة على ما فصّل الجواب."
  en: "A man suffering foot inflammations — especially between the toes — from illness asked about washing them in wudu. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21788) answered that one suffering such inflammation may suffice with washing the feet once, as the answer details."
  ur: "ایک شخص کو بیماری کے سبب پاؤں میں خاص طور پر انگلیوں کے درمیان سوزش ہے؛ اس نے وضو میں انہیں دھونے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21788)⁩ نے جواب دیا کہ ایسا شخص ایک بار پاؤں دھونے پر اکتفا کر سکتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
