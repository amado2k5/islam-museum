label: { ar: "قرار مجمع الفقه الإسلامي الدولي 186 (20/1) بشأن أحكام الإعسار والإفلاس في الشريعة الإسلامية", en: "IIFA resolution 186 (20/1) on the rulings of insolvency and bankruptcy in Islamic law", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 186 (20/1): اسلامی شریعت میں ناداری اور دیوالیہ پن کے احکام", es: "Resolución 186 (20/1) de la IIFA sobre las resoluciones de insolvencia y quiebra en la ley islámica.", fr: "Résolution 186 (20/1) de l'IIFA sur les règles d'insolvabilité et de faillite en droit islamique", tr: "Uluslararası İslami Fiqh Akademisi Kararı 186 (20/1) İslami Şeriat'ta iflas ve iflas kararlarına ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 186 (20/1) mengenai putusan kepailitan dan kebangkrutan dalam Syariah Islam" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته العشرين بوهران ⁦(26 شوال – 2 ذو القعدة 1433هـ، 13–18 سبتمبر 2012م)⁩. عرّف الإعسار بأنه وصف عارض يلحق بالشخص يكون معه عاجزًا عن نفقاته الواجبة وسداد ديونه، والإفلاس بعدم كفاية أموال المدين لسداد ديونه. ومن أبرز الفروق بينهما عند الفقهاء: الإعسار قد يسبقه يسار وقد لا، بخلاف الإفلاس فلا يتحقق إلا بعد يسار؛ ويحجر على المفلس بعد الحكم بإفلاسه أما المعسر فينظر إلى ميسرة إذا أثبت إعساره بطرق معتبرة شرعًا؛ ولا يحكم القاضي بحبس المعسر عند ثبوت إعساره أما المفلس فيحبس تعزيرًا عند الاحتيال أو التدليس أو الإهمال والتقصير؛ والإعسار قد يكون بدين أو حق شرعي كالنفقة بخلاف الإفلاس فلا يكون إلا بدين. وأحكام الإفلاس في الفقه الإسلامي: منع المفلس من التصرف في أمواله بما يضر الدائنين ويكون المنع وإنهاؤه بحكم القاضي؛ وجواز منعه من السفر إذا كان يؤدي لضرر ظاهر بحقوق الدائنين؛ وسقوط آجال الديون المؤجلة عليه؛ وقيام القاضي المختص ببيع أمواله بما هو أصلح للدائن والمدين وقسمة ثمنها فإن ظهر له مال جديد جاز مطالبته بباقي الديون؛ وحق الدائن في استرداد عين ماله الذي يجده ضمن أموال المفلس إن كان باقيًا على حاله ولم يستوف ثمنه. وأكد قراره 51 ⁦(6/2)⁩ من تحريم فرض غرامة أو اشتراط تعويض على المدين الموسر المماطل مع جواز تحميله المصروفات القضائية. ورأى تأجيل أربع قضايا لدورة قادمة: المسائل المتعلقة بحماية المؤسسات المالية الإسلامية ومنها التأمين على الديون والالتزام بالتبرع؛ وأحكام تصرفات المفلس والمعسر في فترة الريبة؛ وأحكام إفلاس الشركات والمؤسسات المالية في ضوء الأنظمة المعاصرة؛ وموضوع الإعسار المدني حيث يرد المصطلح في بعض القوانين الوضعية شاملاً للإفلاس والإعسار الفقهيين. وقد استكمل المجمع الموضوع لاحقًا في قراره 218 ⁦(22/2)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 20th session in Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 September 2012). It defined i'sar (insolvency) as a passing state attaching to a person leaving him unable to meet his obligatory expenses and pay his debts, and iflas (bankruptcy) as the debtor's assets being insufficient to cover his debts. Among the chief juristic differences: insolvency may or may not follow solvency, while bankruptcy only holds after solvency; the bankrupt is interdicted once adjudged bankrupt, while the insolvent is given respite until ease if he proves insolvency by legally valid means; the judge does not imprison the insolvent once proven, while the bankrupt may be imprisoned as ta'zir for fraud, deception, or negligence and default; and insolvency may arise from a debt or a legal right such as maintenance, while bankruptcy arises only from debt. The rulings of bankruptcy in Islamic jurisprudence: barring the bankrupt from disposing of his assets in ways harming creditors, the barring and its lifting by judicial ruling; he may be barred from travel if it would visibly harm creditors' rights; the terms of his deferred debts lapse; the competent judge sells his assets in what is best for creditor and debtor and divides the price — if new assets appear, creditors may claim the remainder; and the creditor may reclaim his own property found intact among the bankrupt's assets if its price is unpaid. It reaffirmed resolution 51 (6/2) on the prohibition of imposing a fine or stipulated compensation on a solvent procrastinating debtor, while judicial expenses may be charged to him. It deferred four questions to a later session: the fiqh of protecting Islamic financial institutions including insuring debts and the bindingness of donation; the rulings of the bankrupt's and insolvent's disposals in the suspect period; the bankruptcy of companies and financial institutions under contemporary systems; and 'civil insolvency' where some statutory laws use the term to cover both bankruptcy and insolvency. The Academy completed the subject in resolution 218 (22/2)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، وہران میں بیسویں مجلس ⁦(26 شوال – 2 ذو القعدہ 1433ھ، 13–18 ستمبر 2012ء)⁩ میں۔ اس نے ناداری کو ایک عارضی حالت قرار دیا جس میں شخص اپنی واجب اخراجات اور قرضوں کی ادائیگی سے عاجز ہو، اور دیوالیہ پن کو مدیون کے مال کا اس کے قرضوں کے لیے ناکافی ہونا۔ فقہاء کے ہاں دونوں میں اہم فرق: ناداری کے پہلے آسودگی ہو بھی سکتی ہے اور نہیں بھی، مگر دیوالیہ صرف آسودگی کے بعد ثابت ہوتا ہے؛ حکم کے بعد دیوالیہ پر حجر ہوتا ہے جبکہ نادار کو آسودگی تک مہلت ملتی ہے اگر وہ معتبر طریقے سے اپنی ناداری ثابت کرے؛ نادار کو ثابت ہونے پر جج قید نہیں کرتا مگر دیوالیہ کو دھوکا، فریب یا غفلت و کوتاہی پر تعزیراً قید ہو سکتی ہے؛ اور ناداری قرض یا نفقہ جیسے شرعی حق سے بھی ہو سکتی ہے مگر دیوالیہ صرف قرض سے۔ فقہِ اسلام میں دیوالیہ کے احکام: دیوالیہ کو اپنے مال میں ایسا تصرف کرنے سے منع کرنا جو قرض خواہوں کو نقصان دے، منع اور اس کی رفعت جج کے حکم سے؛ اس کا سفر منع ہو سکتا ہے اگر اس سے قرض خواہوں کے حقوق کو ظاہر نقصان ہو؛ اس کے مؤجل قرضوں کی مدت ساقط؛ مجاز جج اس کے مال کو قرض خواہ اور مدیون دونوں کے بہتر مفاد میں بیچ کر قیمت تقسیم کرے — نیا مال ظاہر ہو تو قرض خواہ باقی مانگ سکتے ہیں؛ اور قرض خواہ کو یہ حق کہ دیوالیہ کے مال میں اپنی وہی شے پائے جس کی قیمت ادا نہ ہوئی ہو تو واپس لے۔ اس نے قرارداد 51 ⁦(6/2)⁩ کی تائید کی کہ آسودہ مماطل کرنے والے مدیون پر جرمانہ یا معاوضے کی شرط حرام، مگر عدالتی اخراجات ڈالے جا سکتے ہیں۔ چار معاملے اگلی مجلس تک مؤجل کیے: اسلامی مالی اداروں کے تحفظ کے مسائل جن میں قرضوں کا بیمہ اور تبرع کے التزام؛ مشتبہ مدت میں دیوالیہ اور نادار کے تصرفات کے احکام؛ معاصر قوانین میں کمپنیوں اور مالی اداروں کا دیوالیہ پن؛ اور 'مدنی ناداری' جس میں بعض وضعی قوانین اس اصطلاح کو دیوالیہ اور ناداری دونوں پر شامل کرتے ہیں۔ اکیڈمی نے بعد میں قرارداد 218 ⁦(22/2)⁩ میں موضوع مکمل کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 20.ª sesión en Orán (26 Shawwal – 2 Dhu al-Qada 1433, 13–18 de septiembre de 2012). Definió i'sar (insolvencia) como un estado transitorio que afecta a una persona dejándola incapaz de hacer frente a sus gastos obligatorios y pagar sus deudas, e iflas (quiebra) como la insuficiencia de los activos del deudor para cubrir sus deudas. Entre las principales diferencias jurídicas: la insolvencia puede o no seguir a la solvencia, mientras que la quiebra solo se produce después de la solvencia; el quebrado es encarcelado una vez declarado en quiebra, mientras que al insolvente se le concede un plazo hasta que se recupere si prueba la insolvencia por medios legalmente válidos; el juez no encarcela al insolvente una vez probado, mientras que el quebrado puede ser encarcelado como ta'zir por fraude, engaño o negligencia e incumplimiento; y la insolvencia puede surgir de una deuda o un derecho legal como el sustento, mientras que la quiebra surge solo de una deuda. Las resoluciones de quiebra en la jurisprudencia islámica: prohibir al quebrado disponer de sus bienes de forma que perjudique a los acreedores, la prohibición y su levantamiento por resolución judicial; se le puede prohibir viajar si ello perjudicaría visiblemente los derechos de los acreedores; caducan los plazos de sus deudas aplazadas; el juez competente vende sus bienes en lo que sea mejor para el acreedor y el deudor y divide el precio; si aparecen nuevos bienes, los acreedores pueden reclamar el resto; y el acreedor puede reclamar su propia propiedad encontrada intacta entre los bienes del quebrado si su precio no se ha pagado. Reafirmó la resolución 51 (6/2) sobre la prohibición de imponer una multa o compensación estipulada a un deudor solvente que procrastina, mientras que los gastos judiciales pueden serle imputados. Aplazó cuatro cuestiones para una sesión posterior: el fiqh de protección de las instituciones financieras islámicas, incluido el seguro de deudas y la vinculación de la donación; Las resoluciones sobre las disposiciones relativas a los bienes de personas en quiebra o insolventes durante el período sospechoso; la quiebra de empresas e instituciones financieras según los sistemas actuales; y la «insolvencia civil», término que en algunos casos se utiliza para abarcar tanto la quiebra como la insolvencia. La Academia concluyó el tema en la resolución 218 (22/2)."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 20e session à Oran (26 Shawwal – 2 Dhu al-Qada 1433, 13-18 septembre 2012). Elle définit l'i'sar (insolvabilité) comme un état passager empêchant une personne de faire face à ses obligations et de payer ses dettes, et l'iflas (faillite) comme l'insuffisance des actifs du débiteur pour couvrir ses dettes. Parmi les principales différences juridiques: l'insolvabilité peut précéder ou non la solvabilité, tandis que la faillite ne survient qu'après celle-ci; le failli est interdit de toute activité une fois déclaré en faillite, tandis que l'insolvable bénéficie d'un sursis jusqu'à son rétablissement s'il prouve son insolvabilité par des moyens légaux; le juge n'emprisonne pas l'insolvable une fois sa situation établie, alors que le failli peut être emprisonné (ta'zir) pour fraude, tromperie, négligence ou manquement à ses obligations. L'insolvabilité peut résulter d'une dette ou d'un droit légal tel qu'une pension alimentaire, tandis que la faillite résulte uniquement d'une dette. Les règles de la faillite en jurisprudence islamique: interdiction faite au failli de disposer de ses biens d'une manière préjudiciable à ses créanciers, cette interdiction pouvant être levée par décision judiciaire; interdiction de voyager si cela porte manifestement atteinte aux droits des créanciers; caducité des dettes différées; vente des biens par le juge compétent au meilleur prix pour le débiteur et le créancier, et partage du produit de la vente – si de nouveaux biens apparaissent, les créanciers peuvent réclamer le solde; et possibilité pour le créancier de recouvrer son propre bien intact parmi les biens du failli si son prix n'est pas payé. La Cour a réaffirmé la résolution 51 (6/2) interdisant d'imposer une amende ou une indemnité forfaitaire à un débiteur solvable qui tarde à payer, tandis que les frais de justice peuvent lui être imputés. Quatre questions ont été reportées à une session ultérieure: le fiqh relatif à la protection des institutions financières islamiques, notamment l'assurance des dettes, et la validité des donations; Les décisions relatives aux liquidations des faillis et des insolvables durant la période suspecte; la faillite des entreprises et des institutions financières dans le cadre des systèmes actuels; et l’« insolvabilité civile », terme parfois employé dans certaines lois pour désigner à la fois la faillite et l’insolvabilité. L’Académie a clos ce sujet dans sa résolution 218 (22/2)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirminci oturumunda Oran'da (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 Eylül 2012) toplu kararı alınmıştır. İflas, zorunlu giderlerini ve borçlarını ödeyemeyen kişiye geçici olarak uygulanan bir süre olarak tanımlanır ve borçlunun borçlarını ödeyememesi nedeniyle iflas yaşanır. Hukukçular arasındaki en belirgin farklardan biri: iflas sol el ile başlayabilir veya gelmez; iflasın aksine, iflas ancak sol el ile gerçekleşir; iflas kararı verildikten sonra kısıtlanırken, iflas eden kişi yasal olarak geçerli yollarla kanıtlanırsa kolay kabul edilir; hakim, iflas edenin kanıtlanmış iflas durumunda gözaltına alınmasına karar vermezken, iflas eden kişi dolandırıcılık, dolandırıcılık, ihmal veya ihmal durumlarında takdir yetkisiyle tutuklanır; iflas bir borç veya nafaka gibi meşru bir haktan kaynaklanabilir, iflas ise sadece bir borçtur. İslam fıkıhatında iflas kararları şunları içerir: iflas edenin varlıklarını alacaklılara zarar verecek şekilde elden çıkarmasının engellenmesi, yasaklanması ve yargıcın kararıyla sona erdirilmesi; alacaklıların haklarına görünür zarar veriyorsa seyahat etmesini engellemenin izin verilmesi; ertelenmiş borç sürelerinin sona ermesi; yetkili hakimin varlıklarını hem alacaklı hem de borçlu için en iyi şekilde satması ve yeni para çıkarsa kalan borçları talep edebileceği fiyatı bölmesi; ve alacaklının iflas edenin varlıkları arasında bulunan tam mülkü değiştirmeden ve tam olarak geri kazanılmamışsa geri alma hakkı. 51 (6/2) sayılı kararı, erteleyen borçluya para cezası verilmesini veya tazminat talep edilmesini, mahkeme masraflarının talep edilmesini ve mahkeme masraflarının talep edilmesini yasakladı. Dört konuyu gelecekteki bir oturuma ertelemeyi düşündü: İslami finans kurumlarının korunması, borç sigortası ve bağış yapma yükümlülüğü dahil olmak üzere konular; şüphe döneminde iflas eden ve iflas edenlerin işlemlerinin hükümleri; güncel düzenlemeler ışığında şirketlerin ve finansal kurumların iflas kararları; ve medeni iflas konusu, burada bazı olumlu yasalarda iflas ve iflas hukukunda yer almaktadır. Meclis daha sonra konuyu 218 (22/2) sayılı kararıyla tamamladı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sidang kedua puluh di Oran (26 Shawwal – 2 Dhu al-Qi'dah 1433 H, 13–18 September 2012). Kepailitan didefinisikan sebagai masa sementara yang dikenakan pada seseorang yang tidak mampu membayar biaya dan utang wajibnya, serta kebangkrutan karena dana debitur tidak cukup untuk membayar utangnya. Di antara perbedaan paling menonjol di antara para ahli hukum: kebangkrutan dapat didahului oleh tangan kiri atau tidak, berbeda dengan kebangkrutan yang tidak diwujudkan kecuali setelah tangan kiri; kebangkrutan dibatasi setelah memutuskan kebangkrutan, sedangkan yang bangkrut dianggap mudah jika terbukti bangkrut dengan cara yang sah secara hukum; hakim tidak memutuskan untuk menahan insolvensi setelah terbukti bangkrut, sedangkan bangkrut ditahan dengan hukuman diskresi dalam kasus penipuan, penipuan, kelalaian, atau kelalaian; kebangkrutan dapat disebabkan oleh utang atau hak sah seperti nafkah, berbeda dengan kebangkrutan yang hanya merupakan utang. Putusan tentang kebangkrutan dalam yurisprudensi Islam meliputi: mencegah bangkrut menjual aset mereka dengan cara yang merugikan kreditur, dengan larangan dan penghentiannya melalui putusan hakim; diperbolehkannya mencegah dia bepergian jika hal itu menimbulkan kerugian nyata pada hak kreditur; berakhirnya tenggat waktu utang yang ditunda; hakim yang berwenang menjual asetnya dengan cara terbaik bagi kreditur dan debitur serta membagi harga jika uang baru muncul, dia dapat mengklaim sisa utang; dan hak kreditur untuk memulihkan properti yang tepat ditemukan di antara aset bangkrut jika tetap tidak berubah dan belum sepenuhnya pulih. Keputusan 51 (6/2) menegaskan larangan menjatuhkan denda atau meminta kompensasi kepada debitur yang menunda-nunda, dengan kemungkinan mengenakan biaya pengadilan. Dewan mempertimbangkan untuk menunda empat isu ke sesi mendatang: hal-hal terkait perlindungan lembaga keuangan Islam, termasuk asuransi utang dan kewajiban memberikan donasi; ketentuan tindakan bangkrut dan insolvensi selama masa keraguan; putusan kebangkrutan perusahaan dan lembaga keuangan berdasarkan peraturan saat itu; dan subjek kebangkrutan, di mana istilah tersebut muncul dalam beberapa undang-undang positif yang mencakup kebangkrutan dan kepailitan dalam hukum yurisprudensi. Majelis kemudian menyelesaikan topik tersebut dalam keputusan 218 (22/2)."
