id: work/fatwa-dar-alifta-eg-mother-restraining-spendthrift-son
class: work
kind: fatwa
label: { ar: "حكم حجر الأم على ابنها الرشيد الذي طرأ عليه السفه دون حكم قضائي", en: "May a mother restrain her adult son's affairs without a court order?", ur: "کیا ماں بالغ سفہی بیٹے پر بغیر عدالتی حکم حجر کر سکتی ہے", es: "¿Puede una madre restringir los asuntos de su hijo adulto sin una orden judicial?" }
summary:
  ar: "سائل سأل عن حجر الأم على ابنها الذي بلغ رشيدًا ثم طرأ عليه السفه دون حكم قضائي. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21083)⁩ أنه لا يجوز للأم أن تحجر عليه دون حكم قضائي بل عليها أن ترفع الأمر للقضاء على ما فصّل الجواب."
  en: "A questioner asked about a mother legally restraining her son who reached maturity then developed prodigality — without a court order. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21083) answered that she may not restrain him without a judicial ruling; she must refer the matter to the court — as the answer details."
  ur: "ایک سائل نے ماں کے بالغ سفہی بیٹے پر بغیر عدالتی حکم حجر کرنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21083)⁩ نے جواب دیا کہ عدالتی حکم کے بغیر حجر جائز نہیں بلکہ معاملہ عدالت کو لے جائے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Una persona preguntó sobre la posibilidad de que una madre impusiera legalmente restricciones a su hijo, quien al alcanzar la mayoría de edad desarrolló un comportamiento derrochador, sin una orden judicial. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21083) respondió que no puede impedirlo sin una resolución judicial; debe remitir el asunto a los tribunales, como se detalla en la respuesta."
