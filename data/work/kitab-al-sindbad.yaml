summary:
  ar: "كتاب من كتب الأخبار المترجمة ذكره المسعودي في جملة ما نظمه المنسوجون من خرافات مصنوعة كهزار أفسانه وفرزة وسيماس {cite:muruj-al-dhahab p. 550}. وذكره ابن النديم نسختين كبيرة وصغيرة والخلاف فيه مثل الخلاف في كليلة ودمنة والغالب والأقرب إلى الحق أن الهند صنفته {cite:fihrist-ibn-al-nadim p. 424}."
  en: "The Sindbad story-book, named by al-Mas'udi among the translated tale-collections of 332 {cite:muruj-al-dhahab p. 550}."
  es: "El libro de cuentos de Simbad, mencionado por al-Mas'udi entre las colecciones de cuentos traducidos de 332 {cite:muruj-al-dhahab p. 550}."
  fr: "Le livre d'histoires de Sindbad, cité par al-Mas'udi parmi les recueils de contes traduits de 332 {cite:muruj-al-dhahab p. 550}."
  ur: "سندھباد کی کہانیوں کی کتاب، جسے المسعودی نے 332 کے ترجمہ شدہ کہانیوں کے مجموعوں میں سے نام دیا ہے۔ 550}۔"
  tr: "Al-Mas'udi'nin Hazar Afsanah, Farza ve Misas gibi dokumacılar tarafından uydurulan mit uydurucuları arasında bahsettiği çeviri raporlar kitabı {cite:muruj-al-dhahab, s. 550}. İbn al-Nadim bunu iki büyük ve küçük versiyonda belirtmiştir ve anlaşmazlık, Kalila ve Dimna üzerindeki anlaşmazlığa benzer; en muhtemel ve gerçeğe en yakın olanı Hindistan'ın bunu sınıflandırmasıdır {cite:fihrist-ibn-al-nadim s. 424}."
  id: "Sebuah buku laporan terjemahan yang disebutkan oleh al-Mas'udi di antara para pembuat mitos yang dibuat oleh penenun seperti Hazar Afsanah, Farza, dan Misas {cite:muruj-al-dhahab, hlm. 550}. Ibn al-Nadim menyebutkannya dalam dua versi besar dan kecil, dan perselisihan ini mirip dengan perselisihan tentang Kalila dan Dimna, dan yang paling mungkin dan paling dekat dengan kebenaran adalah India mengklasifikasikannya {cite:fihrist-ibn-al-nadim hlm. 424}."
