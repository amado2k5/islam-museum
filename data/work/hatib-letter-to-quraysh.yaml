label: { en: "Hatib's letter to Quraysh", ar: "كتاب حاطب إلى قريش", es: "Carta de Hatib a Quraysh", fr: "Lettre de Hatib aux Quraysh", ur: "قریش کے نام حاطب کا خط", tr: "Bir oduncunun Kureyş'e kitabı", id: "Kitab seorang penebang kayu untuk Quraish" }
summary:
  en: "The letter Hatib ibn Abi Balta'a sent to warn Quraysh that the Prophet had resolved to march on Mecca; hidden in a woman's braided hair, it was intercepted at al-Khaliqa and its contents known."
  ar: "الرسالة التي كتبها حاطب بن أبي بلتعة إلى قريش يخبرهم بعزم النبي على المسير إليهم؛ أُخفيت في قرون امرأة وأُدركت بالخليفة وعُرف ما فيها."
  es: "La carta que Hatib ibn Abi Balta'a envió para advertir a los Quraysh de que el Profeta había decidido marchar sobre La Meca, escondida en el cabello trenzado de una mujer, fue interceptada en al-Khaliqa y se conoció su contenido."
  fr: "La lettre envoyée par Hatib ibn Abi Balta'a pour avertir les Quraysh que le Prophète avait décidé de marcher sur La Mecque; cachée dans les cheveux tressés d'une femme, elle fut interceptée à al-Khaliqa et son contenu connu."
  ur: "خط حاطب بن ابی بلتعہ نے قریش کو متنبہ کرنے کے لیے بھیجا تھا کہ نبی نے مکہ پر چڑھنے کا عزم کر لیا ہے۔ ایک عورت کے بالوں کی لٹ میں چھپا ہوا، اسے الخلیقہ میں روکا گیا اور اس کے مواد کا پتہ چلا۔"
  tr: "Hatib ibn Ebi Balta'ah'ın Kureyş'e yazdığı, Peygamber'in onlara yürüme niyetini bildiren mektup yüzyıllar önce gizlenmiş, halife gizlenmiş ve içeriği bilinmektedir."
  id: "Surat yang ditulis oleh Hatib ibn Abi Balta'ah kepada Quraisy, yang memberitahukan niat Nabi untuk berbaris ke arah mereka, disembunyikan selama berabad-abad, dan khalifah disembunyikan, serta isinya diketahui."
