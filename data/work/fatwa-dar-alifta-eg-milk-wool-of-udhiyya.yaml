id: work/fatwa-dar-alifta-eg-milk-wool-of-udhiyya
class: work
kind: fatwa
label: { ar: "حكم الانتفاع بلبن الأضحية وصوفها قبل ذبحها", en: "Benefiting from the udhiyya's milk and wool before slaughter", ur: "ذبح سے پہلے قربانی کے جانور کے دودھ اور اون سے فائدہ", es: "Aprovechar la leche y la lana de la udhiyya antes del sacrificio." }
summary:
  ar: "سائل سأل عن الانتفاع بلبن الأضحية وصوفها قبل ذبحها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20699)⁩ أنه لا مانع شرعًا من الانتفاع بلبنها وصوفها والأولى التصدق بهما أو بقيمتهما خروجًا من خلاف من كره ذلك على ما فصّل الجواب."
  en: "A questioner asked about benefiting from the udhiyya's milk and wool before slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20699) answered there is no objection, though it is better to give them or their value in charity, leaving the position of those who disliked it — as the answer details."
  ur: "ایک سائل نے ذبح سے پہلے قربانی کے دودھ اور اون سے فائدہ اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20699)⁩ نے جواب دیا کہ مانع نہیں البتہ ان کا یا ان کی قیمت کا صدقہ بہتر ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de aprovechar la leche y la lana de la udhiyya antes del sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20699) respondió que no hay objeción, aunque es preferible donarlas o su valor a la caridad, dejando de lado la postura de quienes se oponen a ello, como se detalla en la respuesta."
