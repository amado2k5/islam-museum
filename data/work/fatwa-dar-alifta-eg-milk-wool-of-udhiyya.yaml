id: work/fatwa-dar-alifta-eg-milk-wool-of-udhiyya
class: work
kind: fatwa
label: { ar: "حكم الانتفاع بلبن الأضحية وصوفها قبل ذبحها", en: "Benefiting from the udhiyya's milk and wool before slaughter", ur: "ذبح سے پہلے قربانی کے جانور کے دودھ اور اون سے فائدہ", es: "Aprovechar la leche y la lana de la udhiyya antes del sacrificio.", fr: "Bénéficier du lait et de la laine de l'udhiyya avant l'abattage", tr: "Kurban hayvanının kesimden önce süt ve yünden faydalanma hakkı", id: "Putusan tentang manfaat dari susu dan wol hewan korban sebelum disembelihnya" }
summary:
  ar: "سائل سأل عن الانتفاع بلبن الأضحية وصوفها قبل ذبحها. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20699)⁩ أنه لا مانع شرعًا من الانتفاع بلبنها وصوفها والأولى التصدق بهما أو بقيمتهما خروجًا من خلاف من كره ذلك على ما فصّل الجواب."
  en: "A questioner asked about benefiting from the udhiyya's milk and wool before slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20699) answered there is no objection, though it is better to give them or their value in charity, leaving the position of those who disliked it — as the answer details."
  ur: "ایک سائل نے ذبح سے پہلے قربانی کے دودھ اور اون سے فائدہ اٹھانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20699)⁩ نے جواب دیا کہ مانع نہیں البتہ ان کا یا ان کی قیمت کا صدقہ بہتر ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de aprovechar la leche y la lana de la udhiyya antes del sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20699) respondió que no hay objeción, aunque es preferible donarlas o su valor a la caridad, dejando de lado la postura de quienes se oponen a ello, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était permis de bénéficier du lait et de la laine de l'ânesse avant l'abattage. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20699) a répondu qu'il n'y avait pas d'objection, mais qu'il était préférable d'en faire don, ou d'en donner l'équivalent en aumône, laissant ainsi la position de ceux qui s'y opposaient, comme le précise la réponse."
  tr: "Bir soru soran kişi, kurbanın sütü ve yününden önce faydalanılmadan önce nasıl faydalanıldığını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20699), süt ve yünden faydalanmaya dini bir itiraz olmadığını, bu sütün ve yünün değerini hayır olarak vermenin tercih edildiğini, böylece bu hoşlanmayanların itirazı kaçınıldığını belirtti."
  id: "Seorang penanya menanyakan tentang mendapatkan manfaat dari susu dan wol dari korban sebelum menyembelihnya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20699) menjawab bahwa tidak ada keberatan agama untuk mendapatkan susu dan wolnya, dan lebih baik diberikan atau nilainya sebagai amal, agar tidak terjadi perbedaan pendapat dari mereka yang tidak menyukai hal ini, seperti yang dijelaskan dalam jawaban."
