label: { ar: "حكم ضمان الفني الذي يعمل في محل صيانة", en: "The workshop technician's liability for damage", ur: "ورکشاپ کے فنی کار کا ضمان", es: "Responsabilidad del técnico del taller por los daños", fr: "La responsabilité du technicien d'atelier en cas de dommages" }
summary:
  ar: "سائل: رجل يملك محلًا لتصليح وصيانة أجهزة الكمبيوتر وتحت يده فني يعمل عنده، فما حكم ضمانه؟ أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24396)⁩ أن الفني الذي يعمل في محل الصيانة هو في علاقته بصاحب المحل أجير خاص لاختصاصه بالعمل عنده دون غيره في وقت الدوام، وأنه لا يضمن ما تلف بين يديه إلا بالتعدي أو التفريط."
  en: "A questioner said a man owns a computer-repair shop with a technician working under him, and asked about the technician's liability. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24396) answered that a technician working in a maintenance shop is, in relation to the shop's owner, a private employee — since he works exclusively for him during working hours — and that he does not bear liability for what is damaged in his hands except for transgression or negligence."
  ur: "ایک سائل نے کہا کہ ایک شخص کی کمپیوٹر مرمت کی دکان ہے جس کے ماتحت ایک فنی کار کام کرتا ہے، اور اس کے ضمان کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24396)⁩ نے جواب دیا کہ ورکشاپ میں کام کرنے والا فنی کار اپنے مالک کے حوالے سے اجیرِ خاص ہے — کیونکہ وہ اوقاتِ کار میں صرف اسی کے لیے کام کرتا ہے — اور وہ اپنے ہاتھ تباہ ہونے والی چیز کا ضمان نہیں دیتا سوائے تجاوز یا کوتاہی کی صورت میں۔"
  es: "Un consultante afirmó que un hombre es dueño de un taller de reparación de computadoras con un técnico a su cargo, y preguntó sobre la responsabilidad de este último. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24396) respondió que un técnico que trabaja en un taller de mantenimiento es, en relación con el dueño del taller, un empleado privado —ya que trabaja exclusivamente para él durante su horario laboral— y que no es responsable de los daños ocasionados, salvo en caso de transgresión o negligencia."
  fr: "Un internaute a posé la question de la responsabilité du technicien dans un atelier de réparation informatique tenu par un employé. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24396) a répondu que le technicien, travaillant dans un atelier de maintenance, est considéré comme un employé privé du propriétaire – puisqu'il travaille exclusivement pour lui pendant ses heures de travail – et qu'il n'est pas responsable des dommages causés entre ses mains, sauf en cas de faute ou de négligence."
