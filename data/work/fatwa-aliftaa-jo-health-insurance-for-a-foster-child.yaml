id: work/fatwa-aliftaa-jo-health-insurance-for-a-foster-child
class: work
kind: fatwa
label: { ar: "إضافة الطفل المحتضن إلى التأمين الصحي", en: "Adding a foster child to health insurance", ur: "پرورش میں لیے گئے بچے کو ہیلتھ انشورنس میں شامل کرنا", es: "Agregar un niño de acogida al seguro médico", fr: "Ajouter un enfant placé en famille d'accueil à l'assurance maladie", tr: "Koruyucu çocuğun sağlık sigortasına eklenmesi", id: "Menambahkan anak asuh ke dalam asuransi kesehatan" }
summary:
  ar: "سؤال عن إضافة طفل محتضن إلى التأمين الصحي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا مانع شرعًا إذا سمحت الأنظمة، وأن في ذلك أجرًا عظيمًا. أجابت الدائرة بأنه لا مانع شرعًا من إضافة الأطفال المحتضنين إلى ما تتيحه الدولة للأسرة الحاضنة من تأمين صحي وتعليم إذا سمحت الأنظمة والقوانين بذلك، وأن للأسرة في ذلك أجرًا عظيمًا لأن الشريعة حثت على رعايتهم. ونقلت عن النووي في روضة الطالبين أن من أحكام الالتقاط حفظ اللقيط ورعايته، وأن الفقهاء يستعملون في هذا الباب لفظ الحضانة بمعنى الحفظ والتربية. وقالت إن تسهيل الإجراءات على الأسر الحاضنة، خاصة من لم يرزقوا بأطفال، من أبواب حفظ هؤلاء الأطفال كي لا يضيعوا، وإن نفقتهم عند عدم مالهم تكون من بيت المال، فإن لم يكن قام بها المسلمون فرض كفاية، كما نقلت عن النووي. وختمت بنصح الجهات الرسمية والمواطنين بالتكاتف لرعاية المحتضنين وتسهيل الإجراءات للأسر الحاضنة."
  en: "A question on adding a foster child to health insurance, in which Jordan's General Iftaa Department answered that there is no sharia objection if the regulations allow it, and that doing so carries great reward. The Department answered that there is no sharia objection to adding foster children to the health insurance and education the state offers the fostering family, if the regulations and laws allow it, and that the family earns great reward, since the sharia urges care for such children. It quoted al-Nawawi's Rawdat al-Talibin that the rules on foundlings oblige the finder to protect and care for the child, and that jurists use the word hadana here in the sense of protection and upbringing. It said that easing procedures for fostering families, especially those without children of their own, is one way of protecting these children from neglect, and that if they have no means their maintenance falls on the public treasury, and failing that on the Muslims as a communal obligation, as it quoted from al-Nawawi. It closed by urging official bodies and citizens to work together to care for foster children and ease procedures for fostering families."
  ur: "پرورش میں لیے گئے بچے کو ہیلتھ انشورنس میں شامل کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر ضوابط اجازت دیں تو شرعاً کوئی رکاوٹ نہیں، اور اس میں بڑا اجر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر ضوابط اور قوانین اجازت دیں تو پرورش کرنے والے خاندان کو ریاست کی طرف سے دی جانے والی ہیلتھ انشورنس اور تعلیم میں ایسے بچوں کو شامل کرنے میں شرعاً کوئی رکاوٹ نہیں، اور خاندان کے لیے اس میں بڑا اجر ہے، کیونکہ شریعت ان بچوں کی دیکھ بھال کی ترغیب دیتی ہے۔ اس نے نووی کی روضۃ الطالبین سے نقل کیا کہ لقیط کے احکام میں پانے والے پر اس کی حفاظت اور دیکھ بھال لازم ہے، اور فقہاء اس باب میں حضانت کا لفظ حفاظت اور تربیت کے معنی میں استعمال کرتے ہیں۔ اس نے کہا کہ پرورش کرنے والے خاندانوں، خصوصاً بے اولاد خاندانوں، کے لیے طریقۂ کار آسان بنانا ان بچوں کو ضائع ہونے سے بچانے کا ایک ذریعہ ہے، اور اگر ان کا اپنا مال نہ ہو تو ان کا نفقہ بیت المال پر ہے، اور وہ نہ ہو تو مسلمانوں پر فرضِ کفایہ ہے، جیسا کہ اس نے نووی سے نقل کیا۔ آخر میں اس نے سرکاری اداروں اور شہریوں کو ایسے بچوں کی دیکھ بھال اور پرورش کرنے والے خاندانوں کے لیے طریقۂ کار آسان بنانے میں تعاون کی تلقین کی۔"
  es: "Una pregunta sobre la inclusión de un niño en acogida al seguro médico, a la que el Departamento General de Iftaa de Jordania respondió que no existe objeción islámica si la normativa lo permite, y que hacerlo conlleva una gran recompensa. El Departamento respondió que no hay objeción islámica a incluir a los niños en acogida en el seguro médico y la educación que el Estado ofrece a la familia de acogida, si la normativa y las leyes lo permiten, y que la familia obtiene una gran recompensa, ya que la sharia insta al cuidado de estos niños. Citó el Rawdat al-Talibin de al-Nawawi, donde se indica que las normas sobre los niños abandonados obligan a quien los encuentra a protegerlos y cuidarlos, y que los juristas utilizan aquí la palabra hadana en el sentido de protección y crianza. Afirmó que facilitar los procedimientos para las familias de acogida, especialmente aquellas sin hijos propios, es una forma de proteger a estos niños del abandono, y que si no tienen recursos, su manutención recae sobre el erario público, y en su defecto, sobre los musulmanes como obligación comunitaria, según la cita de al-Nawawi. Concluyó instando a los organismos oficiales y a los ciudadanos a trabajar juntos para cuidar de los niños en hogares de acogida y facilitar los trámites para las familias de acogida."
  fr: "Interrogé sur l'inscription d'un enfant placé en famille d'accueil à l'assurance maladie, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu qu'il n'y a aucune objection de la part de la charia à ce que cela soit pris en compte si la réglementation le permet, et que cette démarche est hautement méritoire. Le Département a précisé qu'il n'y a aucune objection de la part de la charia à inscrire les enfants placés en famille d'accueil à l'assurance maladie et à l'éducation offertes par l'État à la famille d'accueil, si la réglementation et les lois le permettent, et que la famille en retire une grande récompense, car la charia encourage la prise en charge de ces enfants. Il a cité l'ouvrage Rawdat al-Talibin d'al-Nawawi, selon lequel les règles relatives aux enfants trouvés obligent celui qui les trouve à les protéger et à en prendre soin, et que les juristes utilisent ici le terme hadana au sens de protection et d'éducation. Il a ajouté que la simplification des procédures pour les familles d'accueil, en particulier celles qui n'ont pas d'enfants, est un moyen de protéger ces enfants de la négligence, et que si ces familles n'ont pas de ressources, leur entretien incombe au trésor public, et à défaut, aux musulmans comme obligation communautaire, toujours selon al-Nawawi. Elle s'est conclue en exhortant les instances officielles et les citoyens à travailler ensemble pour prendre soin des enfants placés en famille d'accueil et simplifier les procédures pour les familles d'accueil."
  tr: "Sağlık sigortasına koruyucu çocuk eklenmesiyle ilgili bir soruya ise, Ürdün Genel Fetva Müdürlüğü, düzenlemeler izin verirse dini itiraz olmadığını ve bunun büyük bir ödül olduğunu belirtti. Bakanlık, devletin koruyucu aileye sağladığı sağlık ve eğitim sigortasına koruyucu çocukların eklenmesine dini bir itiraz olmadığını, eğer düzenlemeler ve yasalar izin veriyorsa, ailenin büyük bir ödül aldığını ve Şeriatın bakımını teşvik ettiğini belirtti. Al-Nawawi'nin Rawdat al-Talibin'de alıntı yaptığı, toplama kararlarından birinin buluntu çocuğun korunması ve bakımı olduğunu ve hukukçuların bu bağlamda velayet terimini koruma ve yetiştirme anlamına kullandığını belirtti. Özellikle çocuk sahibi olmamış koruyucu aileler için prosedürlerin kolaylaştırılmasının, bu çocukların kaybedilmemesi için korunmasının bir parçası olduğu, masrafları maddi değilse kamu hazinesinden alındığını, Müslümanlar yerine getirmezse bunun kolektif bir yükümlülük olduğunu belirtti; Al-Nawawi'den bildirildi. Son olarak, resmi yetkililere ve vatandaşlara koruyucu ailelere bakmak ve koruyucu aileler için prosedürleri kolaylaştırmak için birleşmelerini tavsiye etti."
  id: "Sebuah pertanyaan tentang penambahan anak asuh ke asuransi kesehatan, Departemen Fatwa Umum Yordania menjawab bahwa tidak ada keberatan agama jika peraturan mengizinkan, dan ada imbalan besar dalam hal itu. Departemen menjawab bahwa tidak ada keberatan agama untuk menambahkan anak asuh ke asuransi kesehatan dan pendidikan yang disediakan negara kepada keluarga asuh jika peraturan dan hukum mengizinkan, dan bahwa keluarga mendapat imbalan besar karena Syariah mendorong perawatan mereka. Departemen mengutip Al-Nawawi dalam Rawdat al-Talibin bahwa salah satu keputusan pengambilan adalah pelestarian dan perawatan anak yang ditemukan, dan bahwa para ahli hukum menggunakan istilah hak asuh dalam hal ini untuk berarti pelestarian dan pengasuhan. Departemen tersebut menyatakan bahwa memfasilitasi prosedur bagi keluarga asuh, terutama yang belum memiliki anak, adalah bagian dari pelestarian anak-anak ini agar mereka tidak hilang, dan jika pengeluaran mereka tidak finansial, maka berasal dari kas negara, dan jika Muslim tidak memenuhinya, itu adalah kewajiban kolektif, seperti yang dilaporkan oleh Al-Nawawi. Ia menutup dengan menyarankan otoritas resmi dan warga untuk bersatu merawat keluarga asuh dan memfasilitasi prosedur bagi keluarga asuh."
