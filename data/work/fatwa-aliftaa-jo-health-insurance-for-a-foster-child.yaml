id: work/fatwa-aliftaa-jo-health-insurance-for-a-foster-child
class: work
kind: fatwa
label: { ar: "إضافة الطفل المحتضن إلى التأمين الصحي", en: "Adding a foster child to health insurance", ur: "پرورش میں لیے گئے بچے کو ہیلتھ انشورنس میں شامل کرنا" }
summary:
  ar: "سؤال عن إضافة طفل محتضن إلى التأمين الصحي، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا مانع شرعًا إذا سمحت الأنظمة، وأن في ذلك أجرًا عظيمًا. أجابت الدائرة بأنه لا مانع شرعًا من إضافة الأطفال المحتضنين إلى ما تتيحه الدولة للأسرة الحاضنة من تأمين صحي وتعليم إذا سمحت الأنظمة والقوانين بذلك، وأن للأسرة في ذلك أجرًا عظيمًا لأن الشريعة حثت على رعايتهم. ونقلت عن النووي في روضة الطالبين أن من أحكام الالتقاط حفظ اللقيط ورعايته، وأن الفقهاء يستعملون في هذا الباب لفظ الحضانة بمعنى الحفظ والتربية. وقالت إن تسهيل الإجراءات على الأسر الحاضنة، خاصة من لم يرزقوا بأطفال، من أبواب حفظ هؤلاء الأطفال كي لا يضيعوا، وإن نفقتهم عند عدم مالهم تكون من بيت المال، فإن لم يكن قام بها المسلمون فرض كفاية، كما نقلت عن النووي. وختمت بنصح الجهات الرسمية والمواطنين بالتكاتف لرعاية المحتضنين وتسهيل الإجراءات للأسر الحاضنة."
  en: "A question on adding a foster child to health insurance, in which Jordan's General Iftaa Department answered that there is no sharia objection if the regulations allow it, and that doing so carries great reward. The Department answered that there is no sharia objection to adding foster children to the health insurance and education the state offers the fostering family, if the regulations and laws allow it, and that the family earns great reward, since the sharia urges care for such children. It quoted al-Nawawi's Rawdat al-Talibin that the rules on foundlings oblige the finder to protect and care for the child, and that jurists use the word hadana here in the sense of protection and upbringing. It said that easing procedures for fostering families, especially those without children of their own, is one way of protecting these children from neglect, and that if they have no means their maintenance falls on the public treasury, and failing that on the Muslims as a communal obligation, as it quoted from al-Nawawi. It closed by urging official bodies and citizens to work together to care for foster children and ease procedures for fostering families."
  ur: "پرورش میں لیے گئے بچے کو ہیلتھ انشورنس میں شامل کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر ضوابط اجازت دیں تو شرعاً کوئی رکاوٹ نہیں، اور اس میں بڑا اجر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر ضوابط اور قوانین اجازت دیں تو پرورش کرنے والے خاندان کو ریاست کی طرف سے دی جانے والی ہیلتھ انشورنس اور تعلیم میں ایسے بچوں کو شامل کرنے میں شرعاً کوئی رکاوٹ نہیں، اور خاندان کے لیے اس میں بڑا اجر ہے، کیونکہ شریعت ان بچوں کی دیکھ بھال کی ترغیب دیتی ہے۔ اس نے نووی کی روضۃ الطالبین سے نقل کیا کہ لقیط کے احکام میں پانے والے پر اس کی حفاظت اور دیکھ بھال لازم ہے، اور فقہاء اس باب میں حضانت کا لفظ حفاظت اور تربیت کے معنی میں استعمال کرتے ہیں۔ اس نے کہا کہ پرورش کرنے والے خاندانوں، خصوصاً بے اولاد خاندانوں، کے لیے طریقۂ کار آسان بنانا ان بچوں کو ضائع ہونے سے بچانے کا ایک ذریعہ ہے، اور اگر ان کا اپنا مال نہ ہو تو ان کا نفقہ بیت المال پر ہے، اور وہ نہ ہو تو مسلمانوں پر فرضِ کفایہ ہے، جیسا کہ اس نے نووی سے نقل کیا۔ آخر میں اس نے سرکاری اداروں اور شہریوں کو ایسے بچوں کی دیکھ بھال اور پرورش کرنے والے خاندانوں کے لیے طریقۂ کار آسان بنانے میں تعاون کی تلقین کی۔"
