label: { ar: "قصيدة المتنبي «أمن ازديارك في الدجى الرقباء»", en: "Al-Mutanabbi's ode 'Is it from your night visits, the watchers?'", es: "La oda de Al-Mutanabbi: \"¿Es por vuestras visitas nocturnas, vosotros los vigilantes?\"", fr: "L'ode d'Al-Mutanabbi: « Est-ce dû à vos visites nocturnes, ô veilleurs ? »", ur: "المتنبی کا شعر 'کیا یہ آپ کے رات کے دورے سے ہے، دیکھنے والوں؟'" }
summary:
  ar: "قصيدة من الخفيف على روي الهمزة للمتنبي، يمدح فيها أبا علي هارون بن عبد العزيز الأوراجي الكاتب كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.125}}."
  en: "An ode in the khafif metre on the rhyme hamza by al-Mutanabbi; praising Abu Ali Harun ibn Abd al-Aziz al-Awraji, the secretary, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.125}}."
  es: "Una oda en la métrica khafif sobre la rima hamza de al-Mutanabbi; alabando a Abu Ali Harun ibn Abd al-Aziz al-Awraji, el secretario, como lo presenta la edición de Dar Beirut {{cita:diwan-mutanabbi-dar-beirut-1983 p.125}}."
  fr: "Une ode au mètre khafif sur la rime hamza d'al-Mutanabbi; faisant l'éloge d'Abu Ali Harun ibn Abd al-Aziz al-Awraji, le secrétaire, comme le présente l'édition Dar Beyrouth {{cite:diwan-mutanabbi-dar-beirut-1983 p.125}}."
  ur: "المتنبی کی نظم حمزہ پر خفیف میٹر میں ایک اوڈ؛ ابو علی ہارون بن عبد العزیز العاورجی، سکریٹری کی تعریف کرتے ہوئے، جیسا کہ دار بیروت ایڈیشن نے اس کا تعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 125}}۔"
