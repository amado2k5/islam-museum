summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثانية ⁦(الكويت، ديسمبر 1985م)⁩ بشأن استفسارات البنك الإسلامي للتنمية: قرر إرجاء الموضوع للدورة القادمة وطالب البنك بتقديم تقرير من هيئته الشرعية ⁦(انظر لاحقًا القرار 13 (3/1))⁩."
  en: "IIFA's second-session resolution (Kuwait, December 1985) on the Islamic Development Bank's queries: it deferred the matter to the next session and asked the bank to submit a report from its sharia board — later treated in resolution 13 (3/1)."
  ur: "اکیڈمی کی دوسری مجلس کی قرارداد ⁦(کویت، دسمبر 1985ء)⁩ اسلامی ترقیاتی بینک کے سوالات پر: موضوع مؤخر اور بینک کے شریعہ بورڈ سے رپورٹ طلب ⁦(بعد ازاں قرارداد 13 (3/1))⁩۔"
  es: "Resolución de la segunda sesión de la IIFA (Kuwait, diciembre de 1985) sobre las consultas del Banco Islámico de Desarrollo: aplazó el asunto a la siguiente sesión y pidió al banco que presentara un informe de su junta de la sharia, tratado posteriormente en la resolución 13 (3/1)."
  fr: "Résolution de la deuxième session de l'IIFA (Koweït, décembre 1985) sur les questions de la Banque islamique de développement: elle a reporté la question à la session suivante et a demandé à la banque de soumettre un rapport de son conseil de la charia — traité plus tard dans la résolution 13 (3/1)."
