summary:
  ar: "فهرس نقود الخلفاء المشارقة في خزانة الأوسمة بالمكتبة الوطنية في باريس، نشره هنري لافوا سنة 1887 بأمر وزير التعليم العام، وقدّم له بدراسة في بدايات النقود الإسلامية وإصلاح عبد الملك {cite:lavoix-catalogue-monnaies-musulmanes-bn-1887 p. 663} {cite:lavoix-catalogue-monnaies-musulmanes-bn-1887 p. 661}."
  en: "Catalogue of the eastern caliphs' coins in the Cabinet des Médailles of the Bibliothèque nationale, Paris, published by Henri Lavoix in 1887 by order of the Minister of Public Instruction, with a preface on the beginnings of Islamic coinage and Abd al-Malik's reform {cite:lavoix-catalogue-monnaies-musulmanes-bn-1887 p. 663} {cite:lavoix-catalogue-monnaies-musulmanes-bn-1887 p. 661}."
  ur: "پیرس کی بیبلیوتیک نیشنل کے کابینے دے میدائی میں خلفائے مشرق کے سکوں کا کیٹلاگ، جسے ہنری لاوا نے 1887ء میں وزیرِ تعلیمِ عامہ کے حکم سے شائع کیا، اور اس کے مقدمے میں اسلامی سکوں کے آغاز اور عبد الملک کی اصلاح پر بحث ہے {cite:lavoix-catalogue-monnaies-musulmanes-bn-1887 p. 663} {cite:lavoix-catalogue-monnaies-musulmanes-bn-1887 p. 661}۔"
