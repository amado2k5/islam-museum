summary:
  ar: "ورقة للدكتور محمد قطناني نشرها موقع المجلس الفقهي لأمريكا الشمالية ⁦(سبتمبر 2019)⁩ تعرّف الفتوى بأنها الإخبار بالحكم الشرعي غير الملزم بدليله ممن هو أهل لذلك جوابًا عن سؤال في واقعة معينة وتبين منهجيتها على ما فصّلته الورقة."
  en: "A paper by Dr. Mohammad Qatanani on the Fiqh Council of North America site (September 2019) defining the fatwa as a non-binding statement of the sharia ruling with its evidence, given by one qualified in answer to a question about a specific case, and setting out its methodology."
  ur: "ڈاکٹر محمد قطنانی کی تحریر فقہ کونسل آف نارتھ امریکہ کی ویب سائٹ پر ⁦(ستمبر 2019)⁩ فتویٰ کی تعریف اور اس کی منہجیت پر — جیسا کہ تحریر میں تفصیل ہے۔"
  es: "Un artículo del Dr. Mohammad Qatanani publicado en el sitio web del Consejo de Fiqh de América del Norte (septiembre de 2019) define la fatwa como una declaración no vinculante de la norma de la sharia con sus pruebas, emitida por una persona cualificada en respuesta a una pregunta sobre un caso específico, y expone su metodología."
  fr: "Un article du Dr Mohammad Qatanani sur le site du Conseil Fiqh d'Amérique du Nord (septembre 2019) définit la fatwa comme une déclaration non contraignante de la décision de la charia avec ses preuves, donnée par une personne qualifiée en réponse à une question sur un cas spécifique, et expose sa méthodologie."
  tr: "Dr. Muhammad Qatnani'nin Kuzey Amerika Fiqh Konseyi web sitesinde (Eylül 2019) yayımlanan bir makalesi, fetvayı, nitelikli rehberine bağlayıcı olmayan bir dini hükmü bildirmek, belirli bir olayla ilgili soruyu yanıtlamak ve makalede ayrıntılı olarak belirtilen metodolojisini açıklamak olarak tanımlar."
  id: "Sebuah makalah oleh Dr. Muhammad Qatnani yang diterbitkan di situs web Fiqh Council of North America (September 2019) mendefinisikan fatwa sebagai pemberitahuan tentang suatu aturan agama yang tidak mengikat pada panduan yang berkualifikasi, menjawab pertanyaan tentang insiden tertentu dan menjelaskan metodologinya sebagaimana dirinci dalam makalah tersebut."
