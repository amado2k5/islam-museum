id: work/fatwa-aliftaa-jo-a-child-eating-at-an-open-buffet
class: work
kind: fatwa
label: { ar: "أكل طفل لم يُدفع عنه من البوفيه المفتوح", en: "A child eating at an open buffet without paying", ur: "کھلے بوفے میں بغیر ادائیگی کے بچے کا کھانا" }
summary:
  ar: "سؤال عن طفل في الثامنة أكل مع والده من بوفيه مفتوح يشترط الدفع عمن بلغ الخامسة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأكل من البوفيه المفتوح جائز، لكن الإذن فيه للدافع وحده، فعلى الأب مراجعة المطعم وطلب المسامحة أو دفع ما يترتب عليه. أجابت الدائرة بأن الأكل من البوفيه المفتوح جائز وإن اختلفت الكمية بين الناس، لأن الجهالة فيه يسيرة يضبطها العرف ولا تفضي إلى النزاع، ونقلت عن النووي في المجموع تسامح العلماء بالغرر اليسير. وقالت إن مقتضى الإذن إباحة الأكل لدافع المبلغ بنفسه لا تمليكه الطعام، فليس له أن يطعم غيره، ولا يباح للأب أن يطعم ابنه بغير إذن المطعم ما دام التسامح محصورًا فيمن دون الخامسة. وخلصت إلى أن على الأب مراجعة إدارة المطعم وإخبارهم وطلب المسامحة، ودفع بدل ما أكله الصبي إن طالبوا به، لأن من استهلك مال غيره بغير حق ضمنه."
  en: "A question on an eight-year-old who ate with his father at an open buffet that charges for anyone aged five or over, in which Jordan's General Iftaa Department answered that eating at an open buffet is permitted, but the permission covers only the person who paid, so the father should go back to the restaurant and ask to be excused or pay what is owed. The Department answered that eating at an open buffet is permitted even though people eat different amounts, since the uncertainty is slight, governed by custom and does not lead to dispute; it quoted al-Nawawi's al-Majmu' on scholars tolerating slight uncertainty. It said the permission lets the payer eat himself; it does not transfer ownership of the food to him, so he may not feed others, and the father may not feed his son without the restaurant's permission, since its allowance is limited to children under five. It concluded that the father should go to the restaurant's management, tell them what happened and ask to be excused, and pay for what the boy ate if they ask, since anyone who consumes another's property without right is liable for it."
  ur: "آٹھ سالہ بچے کے بارے میں سوال جس نے اپنے والد کے ساتھ ایک ایسے کھلے بوفے میں کھایا جو پانچ سال یا اس سے زیادہ عمر والوں سے پیسے لیتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کھلے بوفے سے کھانا جائز ہے، لیکن اجازت صرف ادائیگی کرنے والے کے لیے ہے، لہٰذا والد ریستوران سے رجوع کر کے معافی مانگے یا واجب رقم ادا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ کھلے بوفے سے کھانا جائز ہے اگرچہ لوگ مختلف مقدار کھاتے ہیں، کیونکہ اس میں جہالت معمولی ہے، عرف سے منضبط ہے اور جھگڑے کا سبب نہیں بنتی؛ اس نے نووی کی المجموع سے معمولی غرر میں علماء کی رعایت نقل کی۔ اس نے کہا کہ اجازت کا تقاضا یہ ہے کہ ادائیگی کرنے والا خود کھائے، کھانا اس کی ملکیت نہیں بنتا، اس لیے وہ دوسروں کو نہیں کھلا سکتا، اور والد ریستوران کی اجازت کے بغیر بیٹے کو نہیں کھلا سکتا کیونکہ رعایت پانچ سال سے کم عمر بچوں تک محدود ہے۔ اس نے نتیجہ نکالا کہ والد ریستوران کی انتظامیہ کو واقعہ بتا کر معافی مانگے، اور مطالبہ ہو تو بچے کے کھانے کا عوض ادا کرے، کیونکہ جو کسی کا مال ناحق استعمال کرے وہ اس کا ضامن ہے۔"
