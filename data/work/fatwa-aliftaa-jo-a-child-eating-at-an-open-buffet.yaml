id: work/fatwa-aliftaa-jo-a-child-eating-at-an-open-buffet
class: work
kind: fatwa
label: { ar: "أكل طفل لم يُدفع عنه من البوفيه المفتوح", en: "A child eating at an open buffet without paying", ur: "کھلے بوفے میں بغیر ادائیگی کے بچے کا کھانا", es: "Un niño comiendo en un bufé libre sin pagar", fr: "Un enfant mangeant à un buffet en libre-service sans payer", tr: "Bir çocuk açık büfede ücretsiz yedi", id: "Seorang anak makan tanpa bayaran dari buffet terbuka" }
summary:
  ar: "سؤال عن طفل في الثامنة أكل مع والده من بوفيه مفتوح يشترط الدفع عمن بلغ الخامسة، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأكل من البوفيه المفتوح جائز، لكن الإذن فيه للدافع وحده، فعلى الأب مراجعة المطعم وطلب المسامحة أو دفع ما يترتب عليه. أجابت الدائرة بأن الأكل من البوفيه المفتوح جائز وإن اختلفت الكمية بين الناس، لأن الجهالة فيه يسيرة يضبطها العرف ولا تفضي إلى النزاع، ونقلت عن النووي في المجموع تسامح العلماء بالغرر اليسير. وقالت إن مقتضى الإذن إباحة الأكل لدافع المبلغ بنفسه لا تمليكه الطعام، فليس له أن يطعم غيره، ولا يباح للأب أن يطعم ابنه بغير إذن المطعم ما دام التسامح محصورًا فيمن دون الخامسة. وخلصت إلى أن على الأب مراجعة إدارة المطعم وإخبارهم وطلب المسامحة، ودفع بدل ما أكله الصبي إن طالبوا به، لأن من استهلك مال غيره بغير حق ضمنه."
  en: "A question on an eight-year-old who ate with his father at an open buffet that charges for anyone aged five or over, in which Jordan's General Iftaa Department answered that eating at an open buffet is permitted, but the permission covers only the person who paid, so the father should go back to the restaurant and ask to be excused or pay what is owed. The Department answered that eating at an open buffet is permitted even though people eat different amounts, since the uncertainty is slight, governed by custom and does not lead to dispute; it quoted al-Nawawi's al-Majmu' on scholars tolerating slight uncertainty. It said the permission lets the payer eat himself; it does not transfer ownership of the food to him, so he may not feed others, and the father may not feed his son without the restaurant's permission, since its allowance is limited to children under five. It concluded that the father should go to the restaurant's management, tell them what happened and ask to be excused, and pay for what the boy ate if they ask, since anyone who consumes another's property without right is liable for it."
  ur: "آٹھ سالہ بچے کے بارے میں سوال جس نے اپنے والد کے ساتھ ایک ایسے کھلے بوفے میں کھایا جو پانچ سال یا اس سے زیادہ عمر والوں سے پیسے لیتا ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ کھلے بوفے سے کھانا جائز ہے، لیکن اجازت صرف ادائیگی کرنے والے کے لیے ہے، لہٰذا والد ریستوران سے رجوع کر کے معافی مانگے یا واجب رقم ادا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ کھلے بوفے سے کھانا جائز ہے اگرچہ لوگ مختلف مقدار کھاتے ہیں، کیونکہ اس میں جہالت معمولی ہے، عرف سے منضبط ہے اور جھگڑے کا سبب نہیں بنتی؛ اس نے نووی کی المجموع سے معمولی غرر میں علماء کی رعایت نقل کی۔ اس نے کہا کہ اجازت کا تقاضا یہ ہے کہ ادائیگی کرنے والا خود کھائے، کھانا اس کی ملکیت نہیں بنتا، اس لیے وہ دوسروں کو نہیں کھلا سکتا، اور والد ریستوران کی اجازت کے بغیر بیٹے کو نہیں کھلا سکتا کیونکہ رعایت پانچ سال سے کم عمر بچوں تک محدود ہے۔ اس نے نتیجہ نکالا کہ والد ریستوران کی انتظامیہ کو واقعہ بتا کر معافی مانگے، اور مطالبہ ہو تو بچے کے کھانے کا عوض ادا کرے، کیونکہ جو کسی کا مال ناحق استعمال کرے وہ اس کا ضامن ہے۔"
  es: "Una pregunta sobre un niño de ocho años que comió con su padre en un bufé libre que cobra a cualquier persona de cinco años o más, a la que el Departamento General de Iftaa de Jordania respondió que comer en un bufé libre está permitido, pero el permiso solo cubre a la persona que pagó, por lo que el padre debería regresar al restaurante y pedir que lo eximan o pagar lo que se debe. El Departamento respondió que comer en un bufé libre está permitido incluso si las personas comen cantidades diferentes, ya que la incertidumbre es mínima, se rige por la costumbre y no da lugar a disputas; citó la obra de al-Nawawi, al-Majmu', sobre la tolerancia de los eruditos hacia la ligera incertidumbre. Dijo que el permiso permite que quien paga coma él mismo; no le transfiere la propiedad de la comida, por lo que no puede alimentar a otros, y el padre no puede alimentar a su hijo sin el permiso del restaurante, ya que su autorización está limitada a niños menores de cinco años. Se concluyó que el padre debía acudir a la gerencia del restaurante, contarles lo sucedido y pedir disculpas, y pagar lo que el niño comió si se lo solicitaban, ya que cualquiera que consuma la propiedad ajena sin derecho es responsable de ello."
  fr: "Concernant un enfant de huit ans ayant mangé avec son père dans un restaurant à buffet payant (à partir de cinq ans), le Département général de la sagesse (Iftaa) de Jordanie a répondu que manger dans un buffet est autorisé, mais que cette autorisation ne concerne que la personne ayant payé. Le père devrait donc retourner au restaurant pour demander une explication ou régler la somme due. Le Département a précisé que manger dans un buffet est permis même si les quantités consommées varient, car l'incertitude est minime, régie par la coutume et ne donne pas lieu à litige. Il a cité l'ouvrage « al-Majmu' » d'al-Nawawi, relatif à la tolérance des savants face à une légère incertitude. Il a ajouté que l'autorisation permet à celui qui a payé de se servir lui-même; elle ne lui transfère pas la propriété de la nourriture. Il ne peut donc pas nourrir d'autres personnes, et le père ne peut pas nourrir son fils sans l'autorisation du restaurant, car celle-ci est limitée aux enfants de moins de cinq ans. En conclusion, le père devrait se présenter à la direction du restaurant, expliquer la situation et demander une explication, et payer la part consommée par son fils si on le lui demande, car quiconque consomme le bien d'autrui sans droit est responsable."
  tr: "Sekiz yaşındaki bir çocuğun babasıyla açık büfede yemek yemesiyle ilgili bir soru, beş yaşına ulaşanlar için ödeme gerektiriyor. Ürdün Genel Fetva Dairesi, açık büfede yemek yemenin izin verildiğini, ancak izin sadece ödeme yapana verildiğini yanıtladı. Baba restoranı ziyaret edip af dilemek ya da sonuçları ödemek zorundadır. Daire, açık büfede yemek yemenin miktar farklı olsa bile izin verildiğini, çünkü cehaletin önemsiz olduğunu, geleneklere bağlı olduğunu ve tartışmaya yol açmadığını belirtti. Al-Nawawi, alimlerin hafif ikna konusunda hoşgörülü davrandığını söyledi. İznin ima edilmesinin, ödeyenin kendisinin yemeğe sahip olmadığı, dolayısıyla başkalarını beslemesine izin verilmediği, babanın ise restoranın izni olmadan oğlunu beslemesine izin verilmediği, tabii tolerans beş yaş altındakilerle sınırlı olduğu sürece olduğu belirtildi. Karar, babanın restoran yönetimiyle danışması, bilgilendirmesi, af dilemesi ve isterlerse çocuğun yediği paranın bedelini ödemesi gerektiği sonucuna varıldı; çünkü başkasının parasını haksız yere tüketen kişi sorumludur."
  id: "Sebuah pertanyaan tentang seorang anak berusia delapan tahun yang makan bersama ayahnya dari prasmanan terbuka yang memerlukan pembayaran bagi mereka yang mencapai usia lima tahun. Departemen Fatwa Umum Yordania menjawab bahwa makan dari prasmanan terbuka diperbolehkan, tetapi izin hanya diberikan kepada pembayar. Ayah harus mengunjungi restoran dan meminta maaf atau menanggung konsekuensinya. Departemen menjawab bahwa makan dari prasmanan terbuka diperbolehkan meskipun jumlahnya berbeda antar orang, karena ketidaktahuan itu kecil dan diatur oleh adat serta tidak menimbulkan perselisihan. Al-Nawawi dikutip mengatakan bahwa para ulama bersikap lunak dengan sedikit persuasi. Dikatakan bahwa implikasi izin adalah bahwa pembayar itu sendiri tidak memiliki makanan, sehingga dia tidak diperbolehkan memberi makan orang lain, begitu pula seorang ayah tidak boleh memberi makan anaknya tanpa izin restoran, selama toleransi dibatasi hanya untuk mereka yang berusia di bawah lima tahun. Kesimpulan tersebut bahwa ayah harus berkonsultasi dengan manajemen restoran, memberitahu mereka, meminta maaf, dan membayar apa yang dimakan anak laki-laki jika mereka menuntutnya, karena siapa pun yang mengonsumsi uang orang lain secara tidak adil bertanggung jawab atas hal itu."
