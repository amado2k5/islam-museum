label: { ar: "قرار مجمع الفقه الإسلامي الدولي 211 (22/7) بشأن المرأة والولايات العامة", en: "IIFA resolution 211 (22/7) on women and public offices", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 211 (22/7): خواتین اور عوامی مناصب", es: "Resolución 211 (22/7) de la IIFA sobre la mujer y los cargos públicos" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. قرر المجمع: أولًا أن الإسلام قد كفل للمرأة حقوقها كاملة وأنزلها المنزلة اللائقة بها مراعيًا مكانتها الاجتماعية وفطرتها ومهمتها أمًا وبنتًا وزوجة ومسؤولة. ثانيًا يرى المجمع رأي جمهور الفقهاء في أن المرأة لا تتولى الولاية العظمى ⁦(رئاسة الدولة)⁩. ثالثًا أن رئاسة المرأة للولايات العامة مثل القضاء والوزارة ونحوها فيه خلاف بين فقهاء المذاهب وهو خلاف معتبر، ولفقهاء كل بلد ترجيح ما يرونه من أقوال الفقهاء. رابعًا حال تولي المرأة ولاية مما سبق فيجب عليها الالتزام بالضوابط والآداب التي حددتها الشريعة الإسلامية وعلى الخصوص في أحكام اللباس وغيره، وألا تخل مشاركتها في تلك الولايات أو الوظائف العامة بوظيفتها الأساسية التربوية تجاه أسرتها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015). It ruled: first, Islam has guaranteed women their rights in full and placed them in the station befitting them, regarding their social position, natural disposition and role as mother, daughter, wife and responsible person. Second, the Academy adopts the view of the majority of jurists that a woman does not assume the supreme public office (head of state). Third, a woman's heading public offices such as the judiciary and ministries is disputed among the jurists of the schools, a recognised dispute, and the jurists of each country may prefer the juristic view they see. Fourth, when a woman assumes one of these offices she must observe the controls and manners set by Islamic sharia, particularly in dress and the like, and her participation in those public offices or posts must not detract from her basic upbringing function toward her family."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں۔ اکیڈمی نے فیصلہ دیا: پہلا، اسلام نے عورت کے حقوق مکمل طور پر ضمانت دیے اور اسے اس کے شایان مقام پر رکھا — اس کی سماجی حیثیت، فطرت اور ماں، بیٹی، بیوی اور ذمہ دار ہونے کے کردار کو ملحوظ رکھتے ہوئے۔ دوسرا، اکیڈمی جمهور فقہاء کی رائے اختیار کرتی ہے کہ عورت ولایتِ عظمٰی ⁦(ریاست کی صدارت)⁩ نہیں سنبھال سکتی۔ تیسرا، عورت کا عوامی مناصب جیسے قضا اور وزارتوں کی قیادت مذاہب کے فقہاء میں متنازع ہے اور یہ اختلاف معتبر ہے، اور ہر ملک کے فقہاء اپنے پسندیدہ فقہی قول کو ترجیح دے سکتے ہیں۔ چوتھا، جب عورت ان میں سے کوئی منصب سنبھالے تو اسے شریعتِ اسلامی کے مقررہ ضوابط و آداب کی پابندی کرنی ہوگی بالخصوص لباس کے احکام میں، اور ان عوامی مناصب یا ملازمتوں میں اس کی شرکت اس کے خاندان کے لیے تربیتی بنیادی کردار کو متاثر نہیں کرنی چاہیے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 22.ª sesión en Kuwait (2-5 de Jumada al-Akhira de 1436, 22-25 de marzo de 2015). En ella se dictaminó: primero, el Islam garantiza a las mujeres sus derechos en su totalidad y las sitúa en el lugar que les corresponde, en función de su posición social, su naturaleza y su rol como madre, hija, esposa y persona responsable. Segundo, la Academia adopta la opinión de la mayoría de los juristas de que una mujer no puede asumir el cargo público supremo (jefa de Estado). Tercero, la cuestión de si una mujer puede dirigir cargos públicos como el poder judicial y los ministerios es objeto de debate entre los juristas de las distintas escuelas, un debate reconocido, y los juristas de cada país pueden preferir la opinión jurídica que consideren pertinente. Cuarto, cuando una mujer asume uno de estos cargos, debe observar las normas y costumbres establecidas por la sharia islámica, especialmente en lo referente a la vestimenta y otros aspectos similares, y su participación en dichos cargos o puestos públicos no debe menoscabar su función fundamental de crianza de su familia."
