id: work/fatwa-dar-alifta-eg-sandal-for-muhrim
class: work
kind: fatwa
label: { ar: "حكم لبس الصندل للمحرم", en: "Wearing sandals while in ihram", ur: "احرام کی حالت میں صندل پہننے کا حکم" }
summary:
  ar: "سائل سأل عن لبس المحرم الصندل. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23937)⁩ أنه يجوز للمحرم شرعًا أن يلبس الحذاء المعروف بالصندل — وهو نعل به سيور تثبّت به في القدم أسفل الكعبين — بدلًا عن النعل على ما فصّل الجواب."
  en: "A questioner asked about a pilgrim in ihram wearing sandals. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23937) answered that the muhrim may lawfully wear the footwear known as the sandal — a sole with straps fastened to the foot below the ankles — in place of ordinary sandals, as the answer details."
  ur: "ایک سائل نے محرم کے صندل پہننے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23937)⁩ نے جواب دیا کہ محرم کے لیے شرعاً صندل پہننا جائز ہے — یہ ایسا جوتی ہے جس میں تسمے قدم پر ٹخنوں کے نیچے بندھتے ہیں — معمول کی چپل کے بدلے میں، جیسا کہ جواب میں تفصیل ہے۔"
