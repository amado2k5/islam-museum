id: work/fatwa-amja-acting-on-zann
class: work
kind: fatwa
label: { ar: "العمل بالظن في العبادات", en: "Acting on preponderance in worship", ur: "عبادات میں غالب گمان پر عمل", es: "Actuar según la preponderancia en el culto" }
summary:
  ar: "سأل سائل أنه لم يقف على دليل يرخص باتباع الظن في العبادات بل وجد أدلة تمنع منه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77894 بتاريخ 19 فبراير 2009)⁩ أن الظن هو رجحان أحد طرفي التجويز بخلاف الشك الذي هو تردد الذهن بين أمرين على سواء، ومن أدلة الفقه ما هو قطعي في ثبوته ودلالته ومنه ما هو ظني في ثبوته أو دلالته يترجح للناظر فيه أحد الأمرين ولا يصل إلى الجزم لكن العمل بالراجح مقطوع به ومتفق عليه عند أهل العلم، والظن مذموم في الجملة في باب العقائد لأن مبناها على اليقين."
  en: "A questioner said he had found no proof permitting reliance on conjecture in worship, only proofs forbidding it. Dr. Salah al-Sawi (fatwa no. 77894, 19 February 2009) answered that zann is the outweighing of one side of possibility, unlike doubt which is the mind's equal wavering between two things; among fiqh's proofs some are certain in transmission and indication, and some conjectural in one or the other where one side outweighs without reaching certainty — yet acting on the preponderant is agreed among scholars; conjecture is blameworthy generally in the creed-chapter, which is built on certainty."
  ur: "ایک سائل نے کہا کہ عبادات میں گمان پر عمل کی کوئی دلیل نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77894، 19 فروری 2009)⁩ کے مطابق غالب گمان پر عمل علماء کے اتفاق سے جائز ہے؛ گمان صرف عقیدے کے باب میں مذموم ہے جہاں یقین شرط ہے۔"
  es: "Un interlocutor afirmó no haber encontrado pruebas que permitieran basarse en conjeturas en el culto, sino solo pruebas que lo prohibieran. El Dr. Salah al-Sawi (fatwa n.º 77894, 19 de febrero de 2009) respondió que el zann es la primacía de una posibilidad, a diferencia de la duda, que es la vacilación de la mente entre dos cosas; entre las pruebas del fiqh, algunas son ciertas en su transmisión e indicación, y otras conjeturales en una u otra, donde una prevalece sin alcanzar la certeza; sin embargo, los eruditos coinciden en actuar según la preponderancia; la conjetura es censurable en general en el capítulo del credo, que se basa en la certeza."
