id: work/fatwa-amja-doubt-mocking-companion
class: work
kind: fatwa
label: { ar: "شبهة في سخرية من صحابي", en: "A doubt about mocking a Companion", ur: "صحابی کے مذاق کے شک کا معاملہ", es: "Una duda sobre burlarse de un Compañero", fr: "Un doute quant au fait de se moquer d'un Compagnon" }
summary:
  ar: "سأل سائل يشك أنه سخر من اسم صحابي أو فعل ما يوجب النطق بالشهادتين ويخاف حالة وفاته. أجاب القسم الشرعي ⁦(فتوى رقم 78824 بتاريخ 12 مايو 2009)⁩ أن ينبغي أن يعرض شبهته على أهل العلم للرد عليها حتى لا تقر في نفسه، وإن كانت وسوسة فيكف عنها ويتوقف عن استرسالها ويستعيذ بالله ويكثر من الحسنات ومجالسة الصالحين والإقبال على القرآن، فبهذا يسلم ولا شيء عليه."
  en: "A questioner feared he had mocked a Companion's name or done something requiring him to re-utter the testimony, dreading his state at death. The site's sharia section (fatwa no. 78824, 12 May 2009) answered that he should put his doubt before people of knowledge to be answered so it does not settle in him; if it is whispering, he should stop, refuse its indulgence, seek refuge in his Lord, multiply good deeds, keep the company of the righteous and hold to the Quran — thereby he is safe and nothing is on him."
  ur: "ایک سائل کو شک تھا کہ اس نے کسی صحابی کا مذاق اڑایا۔ شرعی شعبے ⁦(فتویٰ 78824، 12 مئی 2009)⁩ کے مطابق شک کو علماء کے سامنے رکھے؛ اگر وسوسہ ہے تو اس سے اعراض کرے، استعاذہ اور نیک اعمال بڑھائے — اس سے وہ محفوظ ہے۔"
  es: "Un consultante temía haber insultado el nombre de un Compañero o haber hecho algo que le obligara a repetir su testimonio, y temía su estado al morir. La sección de la sharia del sitio (fatwa n.º 78824, 12 de mayo de 2009) respondió que debía presentar su duda ante personas de conocimiento para que la resolvieran y así evitar que se arraigara en él; si se trataba de una duda latente, debía detenerla, rechazarla, buscar refugio en su Señor, multiplicar las buenas obras, rodearse de gente justa y aferrarse al Corán; de esta manera estaría a salvo y no tendría ninguna responsabilidad."
  fr: "Un homme, craignant d'avoir insulté un Compagnon ou d'avoir commis un acte l'obligeant à réaffirmer son témoignage, redoutait son sort après la mort. La section charia du site (fatwa n° 78824, 12 mai 2009) lui répondit qu'il devait soumettre son doute à des savants afin d'obtenir une réponse et d'éviter qu'il ne s'installe en lui; si ce doute persiste, il doit le faire taire, refuser d'y céder, chercher refuge auprès de son Seigneur, multiplier les bonnes actions, fréquenter les vertueux et s'en tenir au Coran; ainsi, il sera en sécurité et rien ne pourra l'atteindre."
