id: work/fatwa-amja-doubt-mocking-companion
class: work
kind: fatwa
label: { ar: "شبهة في سخرية من صحابي", en: "A doubt about mocking a Companion", ur: "صحابی کے مذاق کے شک کا معاملہ" }
summary:
  ar: "سأل سائل يشك أنه سخر من اسم صحابي أو فعل ما يوجب النطق بالشهادتين ويخاف حالة وفاته. أجاب القسم الشرعي ⁦(فتوى رقم 78824 بتاريخ 12 مايو 2009)⁩ أن ينبغي أن يعرض شبهته على أهل العلم للرد عليها حتى لا تقر في نفسه، وإن كانت وسوسة فيكف عنها ويتوقف عن استرسالها ويستعيذ بالله ويكثر من الحسنات ومجالسة الصالحين والإقبال على القرآن، فبهذا يسلم ولا شيء عليه."
  en: "A questioner feared he had mocked a Companion's name or done something requiring him to re-utter the testimony, dreading his state at death. The site's sharia section (fatwa no. 78824, 12 May 2009) answered that he should put his doubt before people of knowledge to be answered so it does not settle in him; if it is whispering, he should stop, refuse its indulgence, seek refuge in his Lord, multiply good deeds, keep the company of the righteous and hold to the Quran — thereby he is safe and nothing is on him."
  ur: "ایک سائل کو شک تھا کہ اس نے کسی صحابی کا مذاق اڑایا۔ شرعی شعبے ⁦(فتویٰ 78824، 12 مئی 2009)⁩ کے مطابق شک کو علماء کے سامنے رکھے؛ اگر وسوسہ ہے تو اس سے اعراض کرے، استعاذہ اور نیک اعمال بڑھائے — اس سے وہ محفوظ ہے۔"
