label: { ar: "أجر من فاتته الجماعة", en: "The prisoner barred from congregation — the reward for intent", ur: "جماعت سے محروم قیدی — نیت کا اجر", es: "El prisionero excluido de la congregación: la recompensa por la intención", fr: "Le prisonnier interdit de réunion — la récompense de l'intention", tr: "Grubun kaçırdığı şeyin ödülü", id: "Hadiah dari apa yang terlewatkan oleh kelompok" }
summary:
  ar: "سأل سائل عن حكم الإسلام في السجناء الذين لا يتسنى لهم أداء الصلاة في جماعة إلا نادرًا. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 21996 بتاريخ 14 أكتوبر 2012)⁩ أننا نرجو لمن كان حريصًا على عمل من أعمال الخير وتشوفت نفسه إليه بصدق وحالت بينه وبينه أعذار قاهرة أن يحصل على نفس الأجر إن شاء الله مستدلة بحديث النية على ما فصّل الجواب."
  en: "A questioner asked Islam's ruling on prisoners who can rarely join the congregational prayer. AMJA's fatwa committee (fatwa no. 21996, 14 October 2012) answered with hope that one eager for a good deed whose soul yearned for it sincerely, yet whom overpowering excuses barred from it, receives the same reward God willing — citing the hadith on intention — as the answer details."
  ur: "جماعت نہ ملنے والا قیدی؟ لجنة الفتوى ⁦(فتویٰ 21996، 14 اکتوبر 2012)⁩ کے مطابق مخلص خواہش مند کو وہی اجر امید ہے — حدیث نیت۔"
  es: "Un consultante preguntó sobre la norma islámica relativa a los presos que rara vez pueden participar en la oración en congregación. El comité de fatuas de AMJA (fatua n.º 21996, 14 de octubre de 2012) respondió con la esperanza de que quien anhela una buena acción con sinceridad, pero a quien se le impide realizarla por razones de peso, reciba la misma recompensa, si Dios quiere —citando el hadiz sobre la intención—, tal como se detalla en la respuesta."
  fr: "Un internaute a interrogé l'autorité islamique sur la question des prisonniers qui ne peuvent que rarement participer à la prière en congrégation. Le comité des fatwas de l'AMJA (fatwa n° 21996, 14 octobre 2012) a répondu avec l'espoir que celui qui aspire sincèrement à une bonne action, mais que des excuses convaincantes l'empêchent de la réaliser, reçoive la même récompense, si Dieu le veut – citant le hadith sur l'intention – comme le précise la réponse."
  tr: "Cemaatte nadiren namaz kılan mahkumlar hakkındaki İslami hüküm hakkında bir soru soran kişiye soru soruldu. Amerikan Şeriat Hukukçuları Konseyi'ndeki Fetva Komitesi (14 Ekim 2012 tarihli 21996 No. Fetva) iyi bir işe hevesli olan, onu içtenlikle gören ve zorlayıcı bahanelerle boğulan herkesin, cevabında açıklanan niyet hadisi ile inşallah, aynı ödülü almasını umduğumuzu belirtti."
  id: "Seorang penanya ditanya tentang aturan Islam mengenai narapidana yang jarang berdoa dalam jamaah. Komite Fatwa di American Council of Sharia Jurists menanggapi (Fatwa No. 21996 tanggal 14 Oktober 2012) bahwa kami berharap siapa pun yang bersemangat melakukan perbuatan baik dan tulus melihatnya serta dikuasai oleh alasan yang kuat akan menerima ganjaran yang sama, jika Tuhan mengizinkan, mengutip hadits niat seperti yang dijelaskan dalam jawaban."
