summary:
  ar: "أول خطبة خطبها عمر بن عبد العزيز حين ولي الخلافة، يطلب فيها من الناس أن يرفعوا إليه حاجاتهم، وأن يدلوه على ما لا يهتدي إليه، وألا يغتابوا عنده الرعية."
  en: "The first sermon Umar ibn Abd al-Aziz preached on taking the caliphate: he asks people to bring him their needs, to guide him where he does not know, and not to backbite about subjects in his presence."
  ur: "عمر بن عبدالعزیز کا خلافت سنبھالنے کے بعد پہلا خطبہ: وہ لوگوں سے ضرورتیں پیش کرنے، جہاں وہ نہ جانتے ہوں وہاں رہنمائی کرنے، اور اپنے سامنے رعایا کی غیبت نہ کرنے کا کہتے ہیں۔"
