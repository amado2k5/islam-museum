id: work/fatwa-dar-alifta-is-ablution-required-for-remembrances-after-prayer
class: work
kind: fatwa
label: { ar: "مدى اشتراط الوضوء للإتيان بالأذكار عقب الصلوات", en: "Is ablution required for the remembrances after the prayer?", ur: "نماز کے بعد کے اذکار کے لیے وضو شرط ہے یا نہیں" }
summary:
  ar: "سؤال عمّا إذا كانت الأذكار بعد الصلاة المفروضة تلزم لها الطهارة، أجابت فيه دار الإفتاء المصرية بأن المحافظة على الطهارة عند أذكار ختم الصلاة هو الأكمل والمستحب لعظم الذكر عقب الصلاة ولأن الذاكر يختتم به صلاته فناسبه أن يكون على طهارة كالمصلين، فإن ختم المصلي صلاته على غير طهارة صح ذلك ولا حرج، فالطهارة ليست شرطًا للذكر. بيّنت الدار استحباب الذكر بعد الصلوات بآيات الأحزاب والنساء وحديث أبي الدرداء في فضل الذكر وحديث ثوبان في استغفار النبي ثلاثًا بعد الصلاة، وأن الطهارة ليست شرطًا للذكر باتفاق الفقهاء، فختم الصلاة من قبيل الذكر العام الذي انعقد الإجماع على جوازه للمحدث حدثًا أصغر أو أكبر، بحديث عائشة أن النبي كان يذكر الله على كل أحيانه كما شرحه القاضي عياض، وبنص الكاساني والنووي في الأذكار على الإجماع، مع استحباب الطهارة بحديث المهاجر بن قنفذ أن النبي لم يرد السلام حتى توضأ وقال إني كرهت أن أذكر الله إلا على طهر، كما شرحه ابن الملك، وبأن الذكر المعظّم يناسبه تحقق الطهارة كما قال الكاساني في المؤذن، وأن عموم الذكر مخصوص بحال قضاء الحاجة وبالجنب في تلاوة القرآن كما قال المناوي، وأن الكراهة في الحديث لخلاف الأفضل كما قال علي القاري."
  en: "A question whether the remembrances after the obligatory prayer require ritual purity; Dar al-Ifta al-Misriyya answered that keeping ritual purity when reciting the remembrances that close the prayer is the most complete and recommended course, because of the greatness of remembrance after prayer and because the worshipper closes his prayer with it, so it befits him to be in a state of purity like those praying, but if he closes his prayer without purity it is valid and there is no blame, since purity is not a condition of remembrance. Dar al-Ifta set out the recommendation of remembrance after the prayers from the verses of al-Ahzab and al-Nisa, Abu al-Darda's hadith on the merit of remembrance and Thawban's hadith on the Prophet's seeking forgiveness three times after prayer; it explained that purity is not a condition of remembrance by the jurists' agreement, the closing remembrances being general remembrance that consensus allows to one in minor or major impurity, by Aisha's hadith that the Prophet remembered God at all his times, as Qadi Iyad explains, and by the statements of al-Kasani and al-Nawawi in al-Adhkar reporting consensus; purity is nonetheless recommended, by the hadith of al-Muhajir ibn Qunfudh that the Prophet did not return his greeting until he had performed ablution, saying he disliked to mention God except in a state of purity, as Ibn al-Malak explains, and because exalted remembrance befits purity, as al-Kasani says of the muezzin; the general permission is qualified for the state of relieving oneself and for a person in major impurity reciting the Qur'an, as al-Munawi says, and the dislike in the hadith means departure from what is best, as Ali al-Qari says."
  ur: "اس بارے میں سوال کہ کیا فرض نماز کے بعد کے اذکار کے لیے طہارت لازم ہے؛ دار الافتاء مصر نے جواب دیا کہ نماز کے اختتامی اذکار کے وقت طہارت برقرار رکھنا اکمل اور مستحب ہے، نماز کے بعد ذکر کی عظمت کی وجہ سے اور اس لیے کہ ذاکر اس سے اپنی نماز ختم کرتا ہے، لہٰذا مناسب ہے کہ وہ نمازیوں کی طرح طہارت پر ہو، لیکن اگر نمازی بغیر طہارت اپنی نماز ختم کرے تو درست ہے اور کوئی حرج نہیں، کیونکہ طہارت ذکر کی شرط نہیں۔ دار الافتاء نے نمازوں کے بعد ذکر کے استحباب کو سورہ احزاب اور نساء کی آیات، ذکر کی فضیلت پر ابو درداء کی حدیث اور نماز کے بعد نبی کے تین بار استغفار پر ثوبان کی حدیث سے بیان کیا؛ واضح کیا کہ فقہا کے اتفاق سے طہارت ذکر کی شرط نہیں، اختتامی اذکار عام ذکر ہیں جن کے جواز پر چھوٹی یا بڑی ناپاکی والے کے لیے اجماع ہے، عائشہ کی اس حدیث سے کہ نبی ہر وقت اللہ کا ذکر کرتے تھے، جیسا کہ قاضی عیاض نے شرح کی، اور کاسانی اور نووی کے الاذکار میں اجماع کے بیان سے؛ البتہ طہارت مستحب ہے، مہاجر بن قنفذ کی اس حدیث سے کہ نبی نے ان کے سلام کا جواب وضو کرنے تک نہ دیا اور فرمایا کہ میں طہارت کے بغیر اللہ کا ذکر ناپسند کرتا ہوں، جیسا کہ ابن الملک نے شرح کی، اور اس لیے کہ معظم ذکر کے لیے طہارت مناسب ہے جیسا کہ کاسانی نے مؤذن کے بارے میں کہا؛ عمومی اجازت قضائے حاجت کی حالت اور جنبی کے قرآن پڑھنے کے لیے مخصوص ہے جیسا کہ مناوی نے کہا، اور حدیث میں کراہت افضل کے خلاف ہونے کے معنی میں ہے جیسا کہ علی قاری نے کہا۔"
