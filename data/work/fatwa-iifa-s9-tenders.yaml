summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: تأجيل إصدار القرار الخاص بالنقاط التي درست في موضوع المناقصات لأهميته وضرورة استكمال بحث جميع جوانبه والتعرف على جميع الآراء واستيفاء المجالات التي تجري من أجلها ولا سيما الحرام منها كالأوراق المالية الربوية وسندات الخزانة."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on tenders: it deferred the ruling given the subject's weight, needing completed study of all its aspects, all opinions, and the fields for which tenders are run — especially the prohibited ones like riba securities and treasury bonds."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ ٹھیکوں پر: اہمیت کے پیش نظر فیصلہ مؤخر تاکہ تمام جوانب بشمول ربوی سیکیورٹیز کی تحقیق مکمل ہو۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre licitaciones: aplazó la decisión dada la importancia del tema, que requería un estudio exhaustivo de todos sus aspectos, todas las opiniones y los ámbitos en los que se realizan las licitaciones, especialmente aquellos prohibidos como los valores usurarios y los bonos del tesoro."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur les appels d'offres: elle a reporté la décision compte tenu de l'importance du sujet, nécessitant une étude complète de tous ses aspects, de toutes les opinions et des domaines pour lesquels des appels d'offres sont lancés — en particulier ceux qui sont interdits comme les titres riba et les obligations du Trésor."
