id: work/fatwa-amja-walaya-and-kinship
class: work
kind: fatwa
label: { ar: "الجمع بين الولاء وصلة الرحم غير المسلمة", en: "Reconciling loyalty to believers with ties to non-Muslim kin", ur: "ولایت اور غیر مسلم رشتہ داروں کی صلہ", es: "Conciliar la lealtad a los creyentes con los lazos con parientes no musulmanes.", fr: "Concilier la loyauté envers les croyants et les liens avec les proches non musulmans" }
summary:
  ar: "سأل سائل كيف يجمع بين النهي عن اتخاذ الآباء والإخوان أولياء إن استحبوا الكفر على الإيمان وبين بر الوالدين وصلة الرحم غير المسلمة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84560 بتاريخ 29 مايو 2011)⁩ أنه لا تعارض بين صلة الرحم وإن كانت غير مسلمة وكون الولاء وقفًا على جماعة المسلمين، فالموالاة شيء وحسن التعامل مع المسالمين شيء آخر لقوله تعالى لا ينهاكم الله عن الذين لم يقاتلوكم أن تبروهم وتقسطوا إليهم، والموالاة تطلق على معان ترجع إلى الحب والنصرة فمحبة أهل الدين محبة دينية لا تنفي المودة الجبلية التي تنشئها القرابة ما لم تتضمن مشايعة على باطل."
  en: "A questioner asked how to reconcile the verse forbidding taking fathers and brothers as allies if they prefer disbelief with dutifulness to parents and kinship with non-Muslim relatives. Dr. Salah al-Sawi (fatwa no. 84560, 29 May 2011) answered that there is no contradiction: keeping kin though non-Muslim and confining loyalty to the community of Muslims are different things — alliance is one thing, good treatment of peaceable non-Muslims another, per the verse that God does not forbid kindness and equity toward those who neither fought nor expelled you; walaya returns to love and support, so religious love of the people of the faith does not negate the natural affection kinship creates, short of abetting falsehood."
  ur: "ایک سائل نے پوچھا کہ والدین و بھائیوں کو ولی نہ بنانے کی آیت اور غیر مسلم رشتہ داروں کے ساتھ نیکی میں تفریق کیسے ہو۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84560، 29 مئی 2011)⁩ کے مطابق دینی ولایت الگ چیز ہے اور غیر مسلم مسالموں سے نیکی الگ — دونوں میں تضاد نہیں۔"
  es: "Un consultante preguntó cómo conciliar el versículo que prohíbe tomar como aliados a padres y hermanos si estos prefieren la incredulidad con el deber hacia los padres y el parentesco con parientes no musulmanes. El Dr. Salah al-Sawi (fatwa n.° 84560, 29 de mayo de 2011) respondió que no hay contradicción: mantener lazos familiares aunque no sean musulmanes y limitar la lealtad a la comunidad musulmana son cosas distintas; una es la alianza, otra el buen trato a los no musulmanes pacíficos, según el versículo que dice que Dios no prohíbe la bondad y la equidad hacia quienes no lucharon contra ti ni te expulsaron; walaya regresa al amor y al apoyo, por lo que el amor religioso de la gente de fe no niega el afecto natural que crea el parentesco, salvo que se trate de fomentar la falsedad."
  fr: "Un internaute a demandé comment concilier le verset interdisant de prendre pour alliés pères et frères ceux qui préfèrent l'incroyance au devoir envers leurs parents et aux liens de parenté avec des proches non musulmans. Le Dr Salah al-Sawi (fatwa n° 84560, 29 mai 2011) a répondu qu'il n'y a pas de contradiction: maintenir des liens de parenté avec des non-musulmans et limiter sa loyauté à la communauté musulmane sont deux choses différentes; l'alliance est une chose, le bon traitement des non-musulmans pacifiques en est une autre, conformément au verset qui stipule que Dieu n'interdit pas la bienveillance et l'équité envers ceux qui ne vous ont ni combattus ni expulsés; la walaya se traduit par l'amour et le soutien, de sorte que l'amour religieux des croyants n'annule pas l'affection naturelle que crée la parenté, sauf pour cautionner le mensonge."
