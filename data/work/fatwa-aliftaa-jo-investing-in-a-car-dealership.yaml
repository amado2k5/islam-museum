id: work/fatwa-aliftaa-jo-investing-in-a-car-dealership
class: work
kind: fatwa
label: { ar: "حكم دفع المال لمعرض سيارات مقابل نسبة من الربح", en: "Giving money to a car dealership for a share of the profit", ur: "منافع کے حصے کے بدلے کار شوروم میں رقم لگانا" }
summary:
  ar: "سؤال عن دفع مال إلى أخ يملك معرض سيارات ليتاجر به مقابل نسبة ربح، كيّفته دائرة الإفتاء العام الأردنية بأنه مضاربة. أجابت الدائرة بأن هذه الصورة من عقد المضاربة، وهو أن يدفع صاحب المال مالًا لمن يتجر به والربح بينهما على نسبة متفق عليها، ونقلت تعريفه عن ابن حجر الهيتمي في تحفة المحتاج. واشترطت أن يكون نصيب كل منهما نسبة شائعة من الربح المحقق، فلا يجوز الاتفاق على مبلغ مقطوع لأحدهما ولا على نسبة من رأس المال، لأن ذلك في حكم ضمان رأس المال والربح المقطوع. وخلصت إلى أن توزيع الربح بالنسبة المتفق عليها من الربح المحقق جائز، وأن ربط الربح بالمبلغ المدفوع مع ضمان رأس المال من الربا المحرم."
  en: "A question on giving money to a brother who owns a car dealership to trade with in return for a share of the profit, which Jordan's General Iftaa Department classified as mudaraba. The Department answered that this is a form of mudaraba, in which the owner of capital gives money to someone who trades with it, the profit being shared at an agreed ratio, quoting the definition from Ibn Hajar al-Haytami's Tuhfat al-Muhtaj. It required that each party's share be a proportion of the profit actually made: a fixed sum for either party, or a percentage of the capital, is not allowed, because that amounts to guaranteeing the capital and a fixed return. It concluded that sharing the realised profit at the agreed ratio is permitted, while tying the return to the amount paid in with the capital guaranteed is forbidden riba."
  ur: "کار شوروم کے مالک بھائی کو منافع کے حصے کے بدلے تجارت کے لیے رقم دینے کے بارے میں سوال، جسے اردن کے جنرل افتاء ڈیپارٹمنٹ نے مضاربت قرار دیا۔ ڈیپارٹمنٹ نے جواب دیا کہ یہ مضاربت کی ایک صورت ہے، جس میں سرمایہ دار کسی کو تجارت کے لیے مال دیتا ہے اور منافع طے شدہ تناسب سے دونوں میں تقسیم ہوتا ہے، اور ابن حجر ہیتمی کی تحفۃ المحتاج سے اس کی تعریف نقل کی۔ اس نے شرط رکھی کہ ہر فریق کا حصہ حاصل شدہ منافع کا ایک تناسب ہو؛ کسی ایک کے لیے مقررہ رقم یا سرمائے کا فیصد طے کرنا جائز نہیں، کیونکہ یہ سرمائے کی ضمانت اور مقررہ منافع کے حکم میں ہے۔ اس نے نتیجہ نکالا کہ حاصل شدہ منافع کو طے شدہ تناسب سے تقسیم کرنا جائز ہے، اور سرمائے کی ضمانت کے ساتھ منافع کو ادا کردہ رقم سے جوڑنا حرام سود ہے۔"
