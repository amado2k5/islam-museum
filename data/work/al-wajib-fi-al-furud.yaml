label: { ar: "الواجب في الفروض واللوازم", en: "Mas'udi's al-Wajib fi'l-Furud", es: "Al-Wajib fi'l-Furud de Mas'udi", fr: "al-Wajib fi'l-Furud de Mas'udi", ur: "مسعودی کی الواجب فی الفرود", tr: "Yükümlülükler ve Gerekliliklerdeki Görevler", id: "Bea dalam Kewajiban dan Persyaratan" }
summary:
  ar: "من كتب المسعودي المفقودة في الفقه، أتى فيه على أقاويل الناس في غسل الرجلين ومسحهما والمسح على الخفين وطلاق السنة والعدة والتعدي، وذكره مع الاستبصار والصفوة عند خبر متعة الحج والنساء {cite:muruj-al-dhahab p. 78}."
  en: "Mas'udi's lost fiqh book — covering the disputes on washing or wiping the feet, the khuffs, and the sunna/'idda/ta'addi divorce forms, cited at the mut'a dossier {cite:muruj-al-dhahab p. 78}."
  es: "El libro perdido de fiqh de Mas'udi, que cubre las disputas sobre lavarse o secarse los pies, los khuffs y las formas de divorcio sunna/'idda/ta'addi, citado en el expediente mut'a {citar:muruj-al-dhahab p. 78}."
  fr: "Le livre de fiqh perdu de Mas'udi — couvrant les différends sur le lavage ou l'essuyage des pieds, les khuffs et les formulaires de divorce sunna/'idda/ta'addi, cité dans le dossier mut'a {cite:muruj-al-dhahab p. 78}."
  ur: "مسعودی کی گمشدہ فقہ کی کتاب - پاؤں دھونے یا مسح کرنے کے تنازعات کا احاطہ کرتی ہے، خفیف، اور سنت/عدت/تعدی طلاق کی شکلیں، متعہ دستاویز میں نقل کی گئی ہیں {حوالہ: مروج الذہب ص۔ 78}۔"
  tr: "El-Mas'udi'nin kayıp hukuk kitapları arasında, ayakların yıkanması, sililmesi, çorapların üzerinden sililmesi, sünnetin boşanması, bekleme süresi ve günah ihlali konusundaki görüşlerini ele aldı. Hac ve kadınların keyfini bildirirken bunu anlayış ve seçkinlerle birlikte belirtti {atıf:muruj-al-dhahab, s. 78}."
  id: "Di antara buku-buku yang hilang dalam bidang hukum Al-Mas'udi, ia membahas pendapat masyarakat mengenai mencuci kaki, mengelapnya, mengelap kaus kaki, perceraian Sunnah, masa tunggu, dan pelanggaran. Ia menyebutkannya bersama dengan wawasan dan kalangan elit saat melaporkan kenikmatan Haji dan perempuan {cite:muruj-al-dhahab, hlm. 78}."
