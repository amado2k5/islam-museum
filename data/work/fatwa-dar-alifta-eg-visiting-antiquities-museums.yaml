id: work/fatwa-dar-alifta-eg-visiting-antiquities-museums
class: work
kind: fatwa
label: { ar: "حكم زيارة المتاحف الأثرية", en: "Visiting antiquities museums", ur: "آثارِ قدیمہ کے عجائب گھروں کی زیارت", es: "Visitar museos de antigüedades" }
summary:
  ar: "سائل سأل عن زيارة المتاحف الأثرية التي تشتمل على التماثيل والآثار المعبرة عن ثقافة وحضارة الشعوب بغرض التعليم أو الترفيه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22402)⁩ أن ذلك جائز شرعًا على ما فصّل الجواب من الضوابط."
  en: "A questioner asked about visiting antiquities museums that contain statues and artefacts expressing the culture and civilisation of peoples, for education or recreation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22402) answered that this is lawful in the sharia, under the controls the answer details."
  ur: "ایک سائل نے تعلیم یا تفریح کے لیے ان عجائب گھروں کی زیارت کا حکم پوچھا جن میں مجسمے اور ایسے آثار ہوں جو اقوام کی ثقافت اور تہذیب کی عکاسی کرتے ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22402)⁩ نے جواب دیا کہ یہ شرعاً جائز ہے، جواب کے بیان کردہ ضوابط کے ساتھ۔"
  es: "Un visitante preguntó sobre la posibilidad de visitar museos de antigüedades que contienen estatuas y objetos que expresan la cultura y la civilización de los pueblos, con fines educativos o recreativos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22402) respondió que esto es lícito según la sharia, bajo las normas que se detallan en la respuesta."
