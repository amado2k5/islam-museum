id: work/fatwa-amja-touching-childs-awra-wudu
class: work
kind: fatwa
label: { ar: "مس عورة الطفل والوضوء", en: "Washing an infant's parts does not break the wudu", ur: "بچے کی ستر چھونا — وضو نہیں ٹوٹتا", es: "Lavar las partes de un bebé no anula el wudu.", fr: "Laver les parties intimes d'un nourrisson ne rompt pas les ablutions." }
summary:
  ar: "سأل سائل هل يجب عليه إعادة الوضوء بعد غسل فرج أطفاله بعد استخدام الحمام. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81182 بتاريخ 22 مارس 2010)⁩ أن الوضوء لا ينتقض بلمس عورة الطفل الرضيع الذي يحتاج إلى متابعة من قبل والديه في قضاء حاجته لعموم البلوى بذلك والحمد لله على رفقه بعباده وتوسعته عليهم على ما فصّل الجواب."
  en: "A questioner asked whether he must redo wudu after washing his small children's parts when they use the bathroom. Dr. Salah al-Sawi (fatwa no. 81182, 22 March 2010) answered that the wudu is not broken by touching an infant's awra who needs a parent's attending his needs, for the universality of that trial — praise God for His gentleness toward His servants and His widening for them — as the answer details."
  ur: "بچے کو دھونے کے بعد وضو دہرانا؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81182، 22 مارچ 2010)⁩ کے مطابق عمومی ابتلاء کے باعث وضو نہیں ٹوٹتا۔"
  es: "Un consultante preguntó si debía repetir la ablución después de lavar las partes íntimas de sus hijos pequeños cuando estos usan el baño. El Dr. Salah al-Sawi (fatwa n.° 81182, 22 de marzo de 2010) respondió que la ablución no se invalida al tocar las partes íntimas de un bebé que necesita la atención de sus padres, debido a la universalidad de esta prueba —alabado sea Dios por su bondad hacia sus siervos y su generosidad hacia ellos— como se detalla en la respuesta."
  fr: "Un homme a demandé s'il devait refaire ses ablutions après avoir lavé les parties intimes de ses jeunes enfants lorsqu'ils allaient aux toilettes. Le Dr Salah al-Sawi (fatwa n° 81182, 22 mars 2010) a répondu que les ablutions ne sont pas invalidées par le contact avec les parties intimes d'un nourrisson nécessitant l'attention de ses parents, en raison de l'universalité de cette épreuve – louange à Dieu pour Sa douceur envers Ses serviteurs et Sa miséricorde envers eux – comme le précise la réponse."
