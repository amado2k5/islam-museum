summary:
  ar: "موقع فتاوى ثنائي اللغة ⁦(الأردية والإنجليزية)⁩ يديره قسم الفتوى الإلكترونية في دار العلوم ديوبند، أُطلق سنة 2007 بعد إنشاء القسم سنة 2005؛ ضم نحو ثلاثين ألف فتوى مختارة سنة 2016، وفي يناير 2022 أوصت اللجنة الوطنية لحماية حقوق الطفل في الهند بحجبه، فحُجب في 7 فبراير 2022."
  en: "A bilingual (Urdu and English) fatwa website run by the Online Fatwa Department of Darul Uloom Deoband, launched in 2007 after the department was set up in 2005; it held some thirty thousand selected fatwas in 2016, and in January 2022 India's National Commission for Protection of Child Rights recommended blocking it; it was blocked on 7 February 2022."
  ur: "دو لسانی ⁦(اردو اور انگریزی)⁩ فتویٰ ویب سائٹ جسے دار العلوم دیوبند کا آن لائن فتویٰ شعبہ چلاتا ہے؛ 2005 میں شعبہ بنا اور 2007 میں سائٹ شروع ہوئی؛ 2016 میں تقریباً تیس ہزار منتخب فتوے؛ جنوری 2022 میں بھارت کے قومی کمیشن برائے تحفظِ حقوقِ اطفال نے بندش کی سفارش کی، اور 7 فروری 2022 کو اسے بند کیا گیا۔"
  es: "Un sitio web de fatuas bilingüe (urdu e inglés) administrado por el Departamento de Fatuas en Línea de Darul Uloom Deoband, lanzado en 2007 después de que el departamento se estableciera en 2005; contenía unas treinta mil fatuas seleccionadas en 2016, y en enero de 2022 la Comisión Nacional para la Protección de los Derechos del Niño de la India recomendó bloquearlo; fue bloqueado el 7 de febrero de 2022."
  fr: "Un site web bilingue (ourdou et anglais) de fatwas géré par le département des fatwas en ligne de Darul Uloom Deoband, lancé en 2007 après la création du département en 2005; il contenait quelque trente mille fatwas sélectionnées en 2016, et en janvier 2022, la Commission nationale indienne pour la protection des droits de l'enfant a recommandé son blocage; il a été bloqué le 7 février 2022."
  tr: "Darul Uloom Deoband Elektronik Fetva Dairesi tarafından yönetilen, 2005'te kurulduktan sonra 2007'de başlatılan iki dilli bir fetva web sitesi (Urduca ve İngilizce) olup, 2016'da yaklaşık otuz bin seçilmiş fetvayı içermektedir. Ocak 2022'de Hindistan'da Çocuk Haklarının Korunması Ulusal Komisyonu bu fetvanı engellemeyi önermiş ve 7 Şubat 2022'de engellenmiştir."
  id: "Situs web Fatwa dwibahasa (Urdu dan Inggris) yang dikelola oleh Departemen Fatwa Elektronik di Darul Uloom Deoband, diluncurkan pada tahun 2007 setelah departemen tersebut didirikan pada tahun 2005; situs ini mencakup sekitar tiga puluh ribu fatwa terpilih pada tahun 2016. Pada Januari 2022, Komisi Nasional untuk Perlindungan Hak Anak di India merekomendasikan pemblokiran fatwa tersebut, yang kemudian diblokir pada 7 Februari 2022."
