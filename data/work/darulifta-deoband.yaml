summary:
  ar: "موقع فتاوى ثنائي اللغة ⁦(الأردية والإنجليزية)⁩ يديره قسم الفتوى الإلكترونية في دار العلوم ديوبند، أُطلق سنة 2007 بعد إنشاء القسم سنة 2005؛ ضم نحو ثلاثين ألف فتوى مختارة سنة 2016، وفي يناير 2022 أوصت اللجنة الوطنية لحماية حقوق الطفل في الهند بحجبه، فحُجب في 7 فبراير 2022."
  en: "A bilingual (Urdu and English) fatwa website run by the Online Fatwa Department of Darul Uloom Deoband, launched in 2007 after the department was set up in 2005; it held some thirty thousand selected fatwas in 2016, and in January 2022 India's National Commission for Protection of Child Rights recommended blocking it; it was blocked on 7 February 2022."
  ur: "دو لسانی ⁦(اردو اور انگریزی)⁩ فتویٰ ویب سائٹ جسے دار العلوم دیوبند کا آن لائن فتویٰ شعبہ چلاتا ہے؛ 2005 میں شعبہ بنا اور 2007 میں سائٹ شروع ہوئی؛ 2016 میں تقریباً تیس ہزار منتخب فتوے؛ جنوری 2022 میں بھارت کے قومی کمیشن برائے تحفظِ حقوقِ اطفال نے بندش کی سفارش کی، اور 7 فروری 2022 کو اسے بند کیا گیا۔"
