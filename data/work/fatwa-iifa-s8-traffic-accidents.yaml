label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن حوادث السير", en: "IIFA resolution on traffic accidents", ur: "اکیڈمی کی قرارداد: سڑک حادثات", es: "Resolución de la IIFA sobre accidentes de tráfico", fr: "Résolution de l'IIFA sur les accidents de la route", tr: "Uluslararası İslami Fiqh Akademisi'nin trafik kazalarına ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional terkait kecelakaan lalu lintas" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: الالتزام بالأنظمة التي لا تخالف أحكام الشريعة واجب شرعًا لأنه من طاعة ولي الأمر فيما ينظمه من إجراءات بناء على دليل المصالح المرسلة، وينبغي أن تشتمل الأنظمة على الأحكام الشرعية غير المطبقة في هذا المجال، وبيّن أحكام الحوادث ومسؤولياتها على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on traffic accidents: abiding by regulations that do not contradict the sharia is a duty, being obedience to the ruler in arrangements grounded in maslaha mursala; those regulations should carry the sharia rulings not yet applied in this field, and the resolution sets out accident rulings and liabilities."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ سڑک حادثات پر: شریعت کے خلاف نہ ہو تو قوانین کی پابندی واجب؛ حادثوں کی ذمہ داریوں کے احکام بیان ہوئے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunei, junio de 1993) sobre accidentes de tráfico: acatar las normas que no contradigan la sharia es un deber, siendo obediencia al gobernante en arreglos basados en maslaha mursala; dichas normas deben incluir las resoluciones de la sharia que aún no se han aplicado en este ámbito, y la resolución establece las normas y responsabilidades en caso de accidente."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur les accidents de la route: le respect des réglementations qui ne contredisent pas la charia est un devoir, étant l'obéissance au souverain dans des arrangements fondés sur le maslaha mursala; ces réglementations devraient comporter les règles de la charia qui ne sont pas encore appliquées dans ce domaine, et la résolution énonce les règles et les responsabilités en matière d'accidents."
  tr: "Uluslararası İslami Fiqh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) karar verilmiştir: Şeriat hükümleriyle çelişmeyen düzenlemelere uymak, çözülmemiş çıkarlar rehberliğine dayalı usulleri düzenleyen hükümdara itaat anlamına geldiği için dini bir yükümlülüktür. Düzenlemeler, bu alanda uygulanmayan Şeriat hükümlerini içermeli ve olayların kararlarını ve sorumluluklarını ayrıntılı olarak netleştirmelidir."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kedelapan (Brunei, Juni 1993): Kepatuhan terhadap peraturan yang tidak bertentangan dengan ketentuan Syariah merupakan kewajiban agama karena merupakan ketaatan kepada penguasa dalam mengatur prosedur berdasarkan panduan kepentingan yang belum terselesaikan. Peraturan harus mencakup putusan Syariah yang tidak diterapkan di bidang ini, dan memperjelas putusan insiden serta tanggung jawabnya secara rinci."
