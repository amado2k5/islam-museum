id: work/fatwa-amja-jest-oath-false-oath
class: work
kind: fatwa
label: { ar: "يمين الهازل واليمين الغموس", en: "The jester's oath and the plunging oath", ur: "مزاح کی قسم اور غموس قسم", es: "El juramento del bufón y el juramento de inmersión", fr: "Le serment du bouffon et le serment du plongeon", tr: "Şakanın hakkı ve dip hakkı", id: "Hak lelucon dan hak menurun" }
summary:
  ar: "سأل سائل هل يمين الهازل تنعقد إذا لم يقصدها وهل من روج سلعته بالحلف الكاذب داخل في اليمين الغموس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84164 بتاريخ 5 أبريل 2011)⁩ أن اليمين التي يجري لفظها على لسان قائلها من غير قصد إلى الحلف لا تعتبر منعقدة ولا توجب كفارة بل هي يمين لغو لقوله تعالى لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان، ويستثنى الهازل بالطلاق لحديث ثلاثة هزلهن جد وجدهن جد، ومن روج سلعته بأيمان كاذبة فهي غموس تورد صاحبها الهلكة إلا أن يغفر الله له."
  en: "A questioner asked whether a jester's unintended oath takes effect, and whether one who promotes his goods with false swearing falls under the plunging oath (al-yamin al-ghamus). Dr. Salah al-Sawi (fatwa no. 84164, 5 April 2011) answered that an oath-phrase running off the tongue without intent to swear is not a binding oath and incurs no expiation — it is a vain oath per the verse that God does not take you to task for the vain in your oaths but for what you bind — except jesting about divorce, per the hadith that three things, serious or jested, are serious; and promoting goods with false oaths is a plunging oath bringing its sayer to ruin unless God forgives him."
  ur: "ایک سائل نے پوچھا کہ بلا قصد نکلی ہوئی قسم بھی مؤثر ہے اور جھوٹی قسم کھا کر مال بیچنے والا غموس میں آتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84164، 5 اپریل 2011)⁩ کے مطابق لغو قسم کفارہ نہیں مانگتی مگر طلاق کا مذاق مستثنیٰ ہے؛ جھوٹی قسم غموس ہے۔"
  es: "Un interlocutor preguntó si un juramento involuntario de un bufón tiene validez y si quien promueve sus bienes con falsos juramentos cae bajo el juramento de perjurio (al-yamin al-ghamus). El Dr. Salah al-Sawi (fatwa n.° 84164, 5 de abril de 2011) respondió que una frase pronunciada sin intención de jurar no es un juramento vinculante y no conlleva expiación alguna; es un juramento vano según el versículo que dice que Dios no te castiga por lo vano de tus juramentos, sino por lo que juras, excepto bromear sobre el divorcio, según el hadiz que dice que tres cosas, serias o bromeadas, son serias; y promover bienes con falsos juramentos es un juramento de perjurio que lleva a la ruina a quien lo pronuncia, a menos que Dios lo perdone."
  fr: "Un internaute a demandé si un serment prononcé involontairement par un plaisantin a une valeur juridique, et si celui qui fait la promotion de ses biens par de faux serments est passible d'un serment irrévocable (al-yamin al-ghamus). Le Dr Salah al-Sawi (fatwa n° 84164, 5 avril 2011) a répondu qu'une phrase prononcée sans intention de jurer n'est pas un serment contraignant et n'entraîne aucune expiation; il s'agit d'un serment vain, conformément au verset selon lequel Dieu ne vous reproche pas les serments vains que vous prononcez, mais seulement ce que vous engagez. L'exception concerne les plaisanteries sur le divorce, conformément au hadith selon lequel trois choses, sérieuses ou non, sont sérieuses. Quant à la promotion de biens par de faux serments, elle constitue un serment irrévocable qui conduit celui qui le prononce à la ruine, à moins que Dieu ne lui pardonne."
  tr: "Bir soru soran kişi, bir şakacı yemininin niyet etmediği takdirde geçerli olup olmadığını ve malını sahte yemin ile tanıtan kişinin yemin içinde yer alıp almadığını sormuştur. Dr. Salah Al-Sawy (5 Nisan 2011 tarihli 84164 No. Fetva) şöyle yanıtlamıştır: Konuşmacının istemeden yemin ederek ettiği yemin geçerli sayılmaz, kefaret gerektirmez; aksine, Allah'ın dediği gibi, boş bir yemin olarak kabul edilir: Allah boş yeminlerden seni sorumlu tutmaz, yeminlerinden sorumlu tutar. Alaycı kişi, üç kişinin bir dede ve bir dede tarafından alay edilen hadisi nedeniyle boşanma ile muaftır. Kim malını sahte yeminlerle tanıtırsa, bu, sahibine yıkım getiren bir çöküştür, Allah affetmedikçe."
  id: "Seorang penanya bertanya apakah sumpah seorang pelawak sah jika ia tidak bermaksud melakukannya, dan apakah seseorang yang mempromosikan barangnya dengan sumpah palsu termasuk dalam sumpah terkubur. Dr. Salah Al-Sawy menjawab (Fatwa No. 84164 tanggal 5 April 2011) bahwa sumpah yang diucapkan oleh pembicara tanpa sengaja untuk bersumpah tidak dianggap sah dan tidak memerlukan penebusan; melainkan itu adalah sumpah kosong, seperti yang dikatakan Allah Yang Maha Kuasa: Allah tidak akan meminta pertanggungjawaban atas sumpah sia-sia tetapi akan menuntut pertanggungjawaban atas apa yang telah kamu ucapkan. Orang yang mengejek dibebaskan melalui perceraian karena hadis tiga orang yang diejek oleh seorang kakek dan seorang kakek. Siapa pun yang mempromosikan hartanya dengan sumpah palsu, itu adalah cekungan yang membawa kehancuran bagi pemiliknya kecuali Allah mengampuni dia."
