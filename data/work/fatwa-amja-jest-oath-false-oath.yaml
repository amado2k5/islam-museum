id: work/fatwa-amja-jest-oath-false-oath
class: work
kind: fatwa
label: { ar: "يمين الهازل واليمين الغموس", en: "The jester's oath and the plunging oath", ur: "مزاح کی قسم اور غموس قسم" }
summary:
  ar: "سأل سائل هل يمين الهازل تنعقد إذا لم يقصدها وهل من روج سلعته بالحلف الكاذب داخل في اليمين الغموس. أجاب د. صلاح الصاوي ⁦(فتوى رقم 84164 بتاريخ 5 أبريل 2011)⁩ أن اليمين التي يجري لفظها على لسان قائلها من غير قصد إلى الحلف لا تعتبر منعقدة ولا توجب كفارة بل هي يمين لغو لقوله تعالى لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان، ويستثنى الهازل بالطلاق لحديث ثلاثة هزلهن جد وجدهن جد، ومن روج سلعته بأيمان كاذبة فهي غموس تورد صاحبها الهلكة إلا أن يغفر الله له."
  en: "A questioner asked whether a jester's unintended oath takes effect, and whether one who promotes his goods with false swearing falls under the plunging oath (al-yamin al-ghamus). Dr. Salah al-Sawi (fatwa no. 84164, 5 April 2011) answered that an oath-phrase running off the tongue without intent to swear is not a binding oath and incurs no expiation — it is a vain oath per the verse that God does not take you to task for the vain in your oaths but for what you bind — except jesting about divorce, per the hadith that three things, serious or jested, are serious; and promoting goods with false oaths is a plunging oath bringing its sayer to ruin unless God forgives him."
  ur: "ایک سائل نے پوچھا کہ بلا قصد نکلی ہوئی قسم بھی مؤثر ہے اور جھوٹی قسم کھا کر مال بیچنے والا غموس میں آتا ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 84164، 5 اپریل 2011)⁩ کے مطابق لغو قسم کفارہ نہیں مانگتی مگر طلاق کا مذاق مستثنیٰ ہے؛ جھوٹی قسم غموس ہے۔"
