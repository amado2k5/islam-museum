summary:
  ar: "البيان التأسيسي لمشروع حسن حنفي «التراث والتجديد» في إعادة قراءة التراث، صدر سنة 1980، وتوالت طبعاته ومنها طبعة خامسة عن المؤسسة الجامعية للدراسات والنشر."
  en: "The founding statement of Hassan Hanafi's Heritage and Renewal project for rereading the Islamic heritage, published in 1980; later editions include a fifth from al-Mu'assasa al-Jami'iyya li-l-Dirasat wa-l-Nashr."
  ur: "حسن حنفی کے منصوبے «التراث والتجدید» کا تاسیسی بیان جو اسلامی ورثے کی ازسرِنو قراءت پر ہے؛ 1980ء میں شائع ہوا اور اس کے بعد کے ایڈیشنوں میں المؤسسۃ الجامعیۃ کا پانچواں ایڈیشن شامل ہے۔"
  es: "La declaración fundacional del proyecto Patrimonio y Renovación de Hassan Hanafi para releer la herencia islámica, publicada en 1980; ediciones posteriores incluyen una quinta de al-Mu'assasa al-Jami'iyya li-l-Dirasat wa-l-Nashr."
  fr: "L'énoncé fondateur du projet Patrimoine et Renouveau de Hassan Hanafi pour la relecture du patrimoine islamique, publié en 1980; les éditions ultérieures incluent une cinquième d'al-Mu'assasa al-Jami'iyya li-l-Dirasat wa-l-Nashr."
  tr: "Hasan Hanafi'nin 1980'de yayımlanan \"Miras ve Yenilenme\" projesinin \"Miras ve Yenilenme\" projesinin kuruluş bildirisi, Üniversite Çalışmaları ve Yayıncılık Enstitüsü tarafından beşinci baskı da dahil olmak üzere ardışık olarak yayımlanmıştır."
  id: "Pernyataan dasar proyek Hassan Hanafi \"Heritage and Renewal\" dalam rereading heritage, yang diterbitkan pada tahun 1980, telah diterbitkan secara berturut-turut, termasuk edisi kelima oleh University Institute for Studies and Publishing."
