id: work/fatwa-dar-alifta-eg-stealing-gas-electricity
class: work
kind: fatwa
label: { ar: "حكم سرقة الغاز والكهرباء وبيان حرمة ذلك", en: "Stealing gas and electricity and its prohibition", ur: "گیس اور بجلی چرانا اور اس کی حرمت", es: "El robo de gas y electricidad y su prohibición", fr: "Le vol de gaz et d'électricité et son interdiction", tr: "Gaz ve elektrik çalınmasına ilişkin karar ve bunların yasaklanmasının netleştirilmesi", id: "Putusan tentang pencurian gas dan listrik serta memperjelas larangan tersebut" }
summary:
  ar: "سائل سأل عن حكم سرقة الغاز والكهرباء. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21729)⁩ أنه يحرم شرعًا سرقة الكهرباء والغاز الطبيعي لما فيها من مخالفات شرعية ففيها تعد على المال العام الذي تتكفل الدولة بتوزيعه على الناس على ما فصّل الجواب."
  en: "A questioner asked the ruling on stealing gas and electricity. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21729) answered that stealing electricity and natural gas is forbidden in the sharia for its legal violations — it is an assault on the public wealth the state is charged with distributing to the people — as the answer details."
  ur: "ایک سائل نے گیس اور بجلی چرانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21729)⁩ نے جواب دیا کہ بجلی اور قدرتی گیس چرانا حرام ہے کیونکہ یہ عوامی مال پر تجاوز ہے جس کی تقسیم کی ذمہ داری ریاست پر ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la normativa relativa al robo de gas y electricidad. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21729) respondió que el robo de electricidad y gas natural está prohibido por la sharia debido a sus violaciones legales; se trata de un ataque contra la riqueza pública que el Estado tiene la obligación de distribuir al pueblo, como se detalla en la respuesta."
  fr: "Un internaute a interrogé Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21729) sur la question du vol de gaz et d'électricité. Il a été répondu que le vol d'électricité et de gaz naturel est interdit par la charia car il constitue une violation de la loi: il s'agit d'une atteinte aux biens publics que l'État est chargé de distribuer au peuple, comme le précise la réponse."
  tr: "Bir soru soran kişi gaz ve elektrik çalınmasına ilişkin kararı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21729), cevabında ayrıntılı olarak belirtildiği üzere, elektrik ve doğal gaz çalmanın dini ihlaller nedeniyle dini ihlaller nedeniyle dini olarak yasak olduğunu, çünkü devletin halka dağıtmakla yükümlü olduğu kamu fonlarını ihlal ettiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang putusan pencurian gas dan listrik. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21729) menjawab bahwa mencuri listrik dan gas alam dilarang secara agama karena pelanggaran agama yang terlibat, karena melanggar dana publik yang menjadi tanggung jawab negara untuk membagikan kepada masyarakat, sebagaimana dijelaskan dalam jawaban."
