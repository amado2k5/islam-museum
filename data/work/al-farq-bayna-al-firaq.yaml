label: { ar: "الفرق بين الفرق وبيان الفرقة الناجية منهم", en: "al-Farq bayn al-Firaq", ur: "الفرق بین الفرق" }
summary:
  ar: "كتاب في الفرق لأبي منصور عبد القاهر بن طاهر البغدادي ⁦(ت 429هـ)⁩، ألّفه كما يذكر محققه استجابة لطلب تلاميذه شرح حديث افتراق الأمة وبيان فروق الفرق ومعالم الفرقة الناجية؛ رتبه خمسة أبواب: الحديث المأثور في الافتراق، وكيفية افتراق الأمة ثلاثاً وسبعين فرقة، وتفصيل مقالات فرق الأهواء ⁦(الرافضة والخوارج والمعتزلة والمرجئة والنجارية والضرارية والجهمية والكرامية والمشبهة)⁩، والفرق التي يرى أنها انتسبت إلى الإسلام وليست منه، وأوصاف الفرقة الناجية التي هي عنده أهل السنة والجماعة بأصنافهم الثمانية {cite:farq-bayn-al-firaq-khisht-ibn-sina p. 8} {cite:farq-bayn-al-firaq-khisht-ibn-sina p. 9} {cite:farq-bayn-al-firaq-khisht-ibn-sina p. 10} {cite:farq-bayn-al-firaq-khisht-ibn-sina p. 272}."
  en: "A work on the sects by Abu Mansur Abd al-Qahir ibn Tahir al-Baghdadi (d. 429 AH), written, as its editor relates, at his students' request to explain the hadith on the community's division, set out the differences among the sects and describe the saved group; it has five chapters: the transmitted hadith on division, how the community divided into seventy-three groups, the doctrines of the sects of 'caprice' (Rafida, Khawarij, Mu'tazila, Murji'a, Najjariyya, Dirariyya, Jahmiyya, Karramiyya, anthropomorphists), the groups he holds claimed Islam without belonging to it, and the features of the saved group, which for him is Ahl al-Sunna wa-l-Jama'a in its eight classes."
  ur: "ابو منصور عبد القاہر بن طاہر بغدادی ⁦(م 429ھ)⁩ کی فرقوں پر کتاب، جو اس کے محقق کے بقول شاگردوں کی فرمائش پر امت کے افتراق کی حدیث کی شرح، فرقوں کے فروق اور فرقۂ ناجیہ کی علامات بیان کرنے کے لیے لکھی گئی؛ اس کے پانچ ابواب ہیں: افتراق کی ماثور حدیث، امت کے تہتر فرقوں میں بٹنے کی کیفیت، اہواء کے فرقوں ⁦(رافضہ، خوارج، معتزلہ، مرجئہ، نجاریہ، ضراریہ، جہمیہ، کرامیہ، مشبہہ)⁩ کے مقالات، وہ گروہ جو ان کے نزدیک اسلام کی طرف منسوب ہوئے مگر اس میں سے نہیں، اور فرقۂ ناجیہ کے اوصاف، جو ان کے نزدیک اپنی آٹھ اصناف کے ساتھ اہلِ سنت والجماعت ہیں۔"
