structure: "Khisht edition: editor's study (pp. 5-22); Bab 1 on the hadith of division (p. 23); Bab 2 on how the community divided into seventy-three groups, with what unites those under the name of Islam (p. 28); Bab 3 on the doctrines of the sects of caprice in eight sections (p. 40); Bab 4 on the groups that claimed Islam without belonging to it, in seventeen sections (p. 202); Bab 5 on the saved group in seven sections: its classes, its salvation, its agreed principles, its view of the righteous forebears, its refraining from declaring one another unbelievers, its virtues and leading figures, and its works in religion and the world (p. 271)."
