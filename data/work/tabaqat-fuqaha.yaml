  ar: كتاب أبي إسحاق الشيرازي في تراجم فقهاء المذاهب، مرتب بالطبقات، ويركز على الفقهاء الشافعية وعلى تسلسل الحفظ والتدريس في المذهب.
  en: Abu Ishaq al-Shirazi's biographical dictionary of jurists by generations, focusing on the Shafi'i school and on the transmission of teaching within it.
  es: "Diccionario biográfico de juristas por generaciones, elaborado por Abu Ishaq al-Shirazi, centrado en la escuela Shafi'i y en la transmisión de la enseñanza dentro de ella."
  fr: "Le dictionnaire biographique des juristes par générations d'Abu Ishaq al-Shirazi, centré sur l'école Shafi'i et sur la transmission de son enseignement."
  ur: "ابو اسحاق الشیرازی کی نسل در نسل فقہاء کی سوانحی لغت، جس میں شافعی مکتب اور اس کے اندر تدریس کی ترسیل پر توجہ دی گئی ہے۔"
  tr: "Ebu İshaq el-Şirazi'nin okullardaki hukukçuların biyografileri üzerine kitabı, sınıflar halinde düzenlenmiş, Şafii hukukçularına ve okulda ezberleme ve öğretim sırasına odaklanmıştır."
  id: "Buku Abu Ishaq al-Shirazi tentang biografi para ahli hukum sekolah, disusun dalam kelas, berfokus pada para ahli hukum Shafi'i serta urutan hafalan dan pengajaran di sekolah."
