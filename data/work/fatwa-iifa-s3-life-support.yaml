label: { ar: "قرار مجمع الفقه الإسلامي الدولي 17 (3/5) بشأن أجهزة الإنعاش", en: "IIFA resolution 17 (3/5) on life-support machines", ur: "اکیڈمی کی قرارداد 17 (3/5): لائف سپورٹ آلات", es: "Resolución 17 (3/5) de la IIFA sobre máquinas de soporte vital", fr: "Résolution IIFA 17 (3/5) sur les appareils de maintien des fonctions vitales", tr: "Uluslararası İslami Fiqh Akademisi Kararı 17 (3/5) resusitasyon cihazlarına ilişkin", id: "Keputusan Akademi Fiqh Islam Internasional 17 (3/5) mengenai perangkat resusitasi" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: يعتبر شرعًا أن الشخص قد مات وتترتب جميع أحكام الوفاة إذا توقف قلبه وتنفسه توقفًا تامًّا وحكم الأطباء بأن التوقف لا رجعة فيه، أو تعطلت جميع وظائف دماغه تعطلًا نهائيًّا وحكم الأطباء الاختصاصيون بذلك، ويجوز عندئذ رفع أجهزة الإنعاش على ما فصّل القرار."
  en: "IIFA's third-session resolution 17 (3/5) (Amman, October 1986) — settling the item deferred from session 2: a person is legally dead, and all death rulings follow, when heart and breathing stop completely and physicians judge the stoppage irreversible, or when all brain functions cease finally and specialist physicians so rule; life-support machines may then be removed, as the resolution details."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد 17 (3/5) ⁦(امان، اکتوبر 1986ء)⁩: شرعی موت اس وقت ثابت ہوتی ہے جب دل و سانس مکمل رک جائیں یا دماغ کے تمام افعال ناقابل واپسی معطل ہوں اور ماہر معالجین فیصلہ دیں؛ پھر لائف سپورٹ ہٹائی جا سکتی ہے۔"
  es: "Resolución 17 (3/5) de la tercera sesión de la IIFA (Amán, octubre de 1986) — que resuelve el punto aplazado de la sesión 2: una persona está legalmente muerta, y todas las resoluciones sobre la muerte se aplican a continuación, cuando el corazón y la respiración se detienen por completo y los médicos consideran que la parada es irreversible, o cuando todas las funciones cerebrales cesan definitivamente y los médicos especialistas así lo dictaminan; entonces se pueden retirar las máquinas de soporte vital, como se detalla en la resolución."
  fr: "Résolution 17 (3/5) de la troisième session de l'IIFA (Amman, octobre 1986) — réglant le point reporté de la session 2: une personne est légalement décédée, et toutes les décisions relatives à la mort s'ensuivent, lorsque le cœur et la respiration s'arrêtent complètement et que les médecins jugent l'arrêt irréversible, ou lorsque toutes les fonctions cérébrales cessent définitivement et que les médecins spécialistes le décident; les machines de maintien en vie peuvent alors être retirées, comme le précise la résolution."
  tr: "Uluslararası İslami Fiqh Akademisi'nin üçüncü oturumunda (Amman, Ekim 1986) karar verilmiştir: Bir kişinin ölümü dini olarak kabul edilir ve kalp ve nefes tamamen durursa, doktorlar durdurmanın geri döndürülemez olduğuna veya tüm beyin fonksiyonlarının tamamen sona erdiğine karar vermiş ve uzman doktorlar buna göre karar vermiştir. Bu tür durumlarda, kararda detaylandırıldığı üzere resüsitasyon cihazlarının kullanılması mümkündür."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi ketiganya (Amman, Oktober 1986): Secara agama dianggap bahwa seseorang telah meninggal, dan semua putusan kematian berlaku jika jantung dan pernapasannya benar-benar berhenti, dan dokter memutuskan bahwa penghentian tersebut tidak dapat dipulihkan, atau semua fungsi otak benar-benar tidak ada, dan dokter spesialis telah memutuskan sesuai dengan itu. Dalam kasus seperti itu, diperbolehkan menggunakan alat resusitasi sebagaimana dijelaskan dalam keputusan."
