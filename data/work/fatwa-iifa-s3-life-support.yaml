summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثالثة ⁦(عمّان، أكتوبر 1986م)⁩: يعتبر شرعًا أن الشخص قد مات وتترتب جميع أحكام الوفاة إذا توقف قلبه وتنفسه توقفًا تامًّا وحكم الأطباء بأن التوقف لا رجعة فيه، أو تعطلت جميع وظائف دماغه تعطلًا نهائيًّا وحكم الأطباء الاختصاصيون بذلك، ويجوز عندئذ رفع أجهزة الإنعاش على ما فصّل القرار."
  en: "IIFA's third-session resolution 17 (3/5) (Amman, October 1986) — settling the item deferred from session 2: a person is legally dead, and all death rulings follow, when heart and breathing stop completely and physicians judge the stoppage irreversible, or when all brain functions cease finally and specialist physicians so rule; life-support machines may then be removed, as the resolution details."
  ur: "اکیڈمی کی تیسری مجلس کی قرارداد 17 (3/5) ⁦(امان، اکتوبر 1986ء)⁩: شرعی موت اس وقت ثابت ہوتی ہے جب دل و سانس مکمل رک جائیں یا دماغ کے تمام افعال ناقابل واپسی معطل ہوں اور ماہر معالجین فیصلہ دیں؛ پھر لائف سپورٹ ہٹائی جا سکتی ہے۔"
  es: "Resolución 17 (3/5) de la tercera sesión de la IIFA (Amán, octubre de 1986) — que resuelve el punto aplazado de la sesión 2: una persona está legalmente muerta, y todas las resoluciones sobre la muerte se aplican a continuación, cuando el corazón y la respiración se detienen por completo y los médicos consideran que la parada es irreversible, o cuando todas las funciones cerebrales cesan definitivamente y los médicos especialistas así lo dictaminan; entonces se pueden retirar las máquinas de soporte vital, como se detalla en la resolución."
