summary:
  ar: "معجم تراجم لشهيرات النساء في تاريخ العرب والإسلام لعمر رضا كحالة، رتّبه على حروف المعجم ليكشف «الأدوار المختلفة التي قضتها المرأة» في العلم والأدب والفن والسياسة والبر والزهد، وذيّل كل ترجمة بمصادرها؛ صدر في خمسة أجزاء، والطبعة الخامسة (مؤسسة الرسالة 1984) مزيدة وفيها مستدرك."
  en: "A biographical dictionary of notable women in Arab and Islamic history by Umar Rida Kahhala, arranged alphabetically to reveal 'the different roles women have played' in learning, letters, the arts, politics, charity and asceticism, with each entry followed by its sources; the fifth edition (Mu'assasat al-Risala, 1984) is enlarged and has a supplement."
