label: { ar: "أعلام النساء في عالمي العرب والإسلام", en: "A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam", ur: "اعلام النساء فی عالمی العرب والاسلام", tr: "Arap ve İslam Dünyasındaki Önemli Kadınlar", id: "Perempuan Terkenal di Dunia Arab dan Islam" }
summary:
  ar: "معجم تراجم لشهيرات النساء في تاريخ العرب والإسلام لعمر رضا كحالة، رتّبه على حروف المعجم ليكشف «الأدوار المختلفة التي قضتها المرأة» في العلم والأدب والفن والسياسة والبر والزهد، وذيّل كل ترجمة بمصادرها؛ صدر في خمسة أجزاء، والطبعة الخامسة ⁦(مؤسسة الرسالة 1984)⁩ مزيدة وفيها مستدرك."
  en: "A biographical dictionary of notable women in Arab and Islamic history by Umar Rida Kahhala, arranged alphabetically to reveal 'the different roles women have played' in learning, letters, the arts, politics, charity and asceticism, with each entry followed by its sources; the fifth edition (Mu'assasat al-Risala, 1984) is enlarged and has a supplement."
  es: "Diccionario biográfico de mujeres destacadas en la historia árabe e islámica, de Umar Rida Kahhala, ordenado alfabéticamente para revelar \"los diferentes roles que han desempeñado las mujeres\" en el aprendizaje, las letras, las artes, la política, la caridad y el ascetismo, con cada entrada seguida de sus fuentes; la quinta edición (Mu'assasat al-Risala, 1984) está ampliada y cuenta con un suplemento."
  fr: "Un dictionnaire biographique de femmes remarquables dans l'histoire arabe et islamique par Umar Rida Kahhala, classé par ordre alphabétique pour révéler « les différents rôles que les femmes ont joués » dans l'apprentissage, les lettres, les arts, la politique, la charité et l'ascétisme, chaque entrée étant suivie de ses sources; la cinquième édition (Mu'assasat al-Risala, 1984) est augmentée et comporte un supplément."
  ur: "عمر ردا کہالہ کی عرب اور اسلامی تاریخ میں قابل ذکر خواتین کی ایک سوانحی لغت، حروف تہجی کے لحاظ سے ترتیب دی گئی ہے کہ سیکھنے، خطوط، فنون، سیاست، خیرات اور سنت پرستی میں 'خواتین کے مختلف کرداروں' کو ظاہر کرنے کے لیے ترتیب دی گئی ہے، جس میں ہر ایک داخلے کے بعد اس کے ذرائع ہیں۔ پانچواں ایڈیشن ⁦(مؤسسات الرسالہ، 1984)⁩ بڑا ہے اور اس کا ایک ضمیمہ ہے۔"
  tr: "Omar Reda Kahhala tarafından yazılan, bilim, edebiyat, sanat, siyaset, doğruluk ve münzevide 'kadınların oynadığı çeşitli rolleri' ortaya koyacak şekilde alfabetik olarak düzenlenmiş Arap ve İslam tarihindeki ünlü kadınların biyografileri sözlüğü. Her biyografi kaynaklarıyla birlikte eklenir; beş cilt halinde yayımlanmış ve beşinci baskı (Al-Risala Vakfı 1984) ek bir ek ve bir ek içerir."
  id: "Kamus biografi perempuan terkenal dalam sejarah Arab dan Islam oleh Omar Reda Kahhala, disusun secara alfabetis untuk mengungkapkan 'berbagai peran yang dimainkan perempuan' dalam ilmu pengetahuan, sastra, seni, politik, kebenaran, dan asketisme. Setiap biografi disertai dengan sumbernya; diterbitkan dalam lima jilid, dan edisi kelima (Yayasan Al-Risala 1984) menyertakan tambahan dan suplemen."
