summary:
  ar: "ألبوم الاستوديو الثاني لماهر زين، صدر عن أوايكننغ في 1 أبريل 2012 بأربع عشرة أغنية وأغان إضافية بالعربية والتركية والملايوية، ومنه «الحرية» و«الرقم واحد بالنسبة لي» و«بعيدا جدا» عن الأيتام؛ نال شهادة بلاتينية متعددة في ماليزيا وباع أكثر من مئة ألف نسخة."
  en: "Maher Zain's second studio album, released by Awakening on 1 April 2012 with fourteen songs and bonus tracks in Arabic, Turkish and Malay, including 'Freedom', 'Number One For Me' and 'So Soon', a song about orphans; it was certified multi-platinum in Malaysia and sold more than 100,000 copies."
  ur: "ماہر زین کا دوسرا اسٹوڈیو البم، یکم اپریل 2012 کو اویکننگ سے چودہ گیتوں اور عربی، ترکی اور ملے اضافی ٹریکس کے ساتھ جاری ہوا؛ «فریڈم»، «نمبر ون فار می» اور یتیموں پر «سو سون» اس میں شامل ہیں، اور ملائیشیا میں کئی بار پلاٹینم سند پائی۔"
