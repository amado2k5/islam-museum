id: work/fatwa-dar-alifta-eg-dua-at-slaughter
class: work
kind: fatwa
label: { ar: "حكم الدعاء عند الذبح", en: "Supplicating at the time of slaughter", ur: "ذبح کے وقت دعا کا حکم" }
summary:
  ar: "سائل سأل عما يقال عند الذبح من صلوات ودعوات وهبة للثواب. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22097)⁩ أن ما يقال عند الذبح على النحو الوارد في السؤال جائز شرعًا ولا حرج فيه على ما فصّل الجواب."
  en: "A questioner asked about the invocations, supplications and gifting of reward said at slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22097) answered that what is said at slaughter in the manner asked is lawful and unobjectionable, as the answer details."
  ur: "ایک سائل نے ذبح کے وقت درود، دعائیں اور ثواب کی ہبہ کرنے کے کلمات کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22097)⁩ نے جواب دیا کہ سوال میں بیان کردہ کلمات ذبح پر کہنا شرعاً جائز اور بلا حرج ہے، جیسا کہ جواب میں تفصیل ہے۔"
