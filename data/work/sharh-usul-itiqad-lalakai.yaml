summary:
  ar: "كتاب مسند في عقيدة أهل الحديث لأبي القاسم اللالكائي الشافعي ⁦(ت 418هـ)⁩، حدّث به ببغداد في ربيع الأول سنة 416هـ: يرتب مسائل الاعتقاد أبواباً ⁦(«سياق ما روي في...»)⁩، ويبين في كل مسألة متى حدث الخلاف فيها ومن أحدثه، ثم يستدل بالقرآن والحديث وأقوال الصحابة والتابعين بالأسانيد، ويختم بكرامات الأولياء."
  en: "A narrated book on the creed of the hadith scholars by the Shafi'i Abu al-Qasim al-Lalaka'i (d. 418 AH), which he dictated in Baghdad in Rabi' I 416 AH: it arranges the questions of creed in chapters ('the account of what is narrated on...'), states for each when the dispute arose and who started it, then argues from the Qur'an, hadith and the sayings of Companions and Successors with chains, and ends with the miracles of the saints."
  es: "Un libro narrado sobre el credo de los eruditos del hadiz por el shafi'í Abu al-Qasim al-Lalaka'i (fallecido en el año 418 de la Hégira), que dictó en Bagdad en Rabi' I del año 416 de la Hégira: organiza las cuestiones de credo en capítulos ('el relato de lo que se narra sobre...'), indica para cada una cuándo surgió la disputa y quién la inició, luego argumenta a partir del Corán, el hadiz y los dichos de los Compañeros y Sucesores con cadenas de transmisión, y termina con los milagros de los santos."
  fr: "Un livre narré sur la croyance des savants du hadith par le Shafi'i Abu al-Qasim al-Lalaka'i (d. 418 AH), qu'il a dicté à Bagdad en Rabi' I 416 AH: il organise les questions de croyance en chapitres (« le compte rendu de ce qui est narré sur... »), indique pour chacune quand la dispute est apparue et qui l'a commencée, puis argumente à partir du Coran, des hadiths et des paroles des Compagnons et des Successeurs avec des chaînes de transmission, et se termine par les miracles des saints."
  ur: "شافعی ابو القاسم اللاقاعی ⁦(متوفی 418ھ)⁩ کی حدیث کے علماء کے مسلک پر ایک منقول کتاب، جسے انہوں نے ربیع الثانی 416ھ میں بغداد میں ترتیب دیا: اس میں عقیدہ کے سوالات کو ابواب میں ترتیب دیا گیا ہے ⁦('جو بیان کیا گیا ہے اس کا حساب')⁩، اس کے بعد یہ بیان کیا گیا ہے کہ کس نے کس سے جھگڑا شروع کیا؟ قرآن، احادیث اور اقوال صحابہ و جانشینوں کو زنجیروں میں جکڑ کر اور اولیاء اللہ کے معجزات پر ختم ہوتا ہے۔"
  tr: "Ebu el-Kasım el-Lalakai el-Şafi'i (ö. 418 H) tarafından Bağdat'ta Rabi'l-Awwal'da rivayet ettiği ve 416 Hicri yılında Bağdat'ta anlattığı Müsnad kitabında bir Musnad kitabında inanç meselelerini bölümlere ayırır (\"rivayet edilenlerin bağlamı...\"), her sayıda anlaşmazlığın ne zaman ortaya çıktığını ve kimin başlattığını açıklar, ardından Kur'an, hadis ve Sahabe ile Takipçilerin sözlerini aktarım zincirleriyle aktarır ve azizlerin mucizeleriyle bitirir."
  id: "Sebuah kitab Musnad tentang kredo umat hadis oleh Abu al-Qasim al-Lalakai al-Shafi'i (wafat 418 H), yang ia ceritakan di Baghdad dalam Rabi' al-Awwal tahun 416 H: ia mengatur urusan kredo ke dalam bab-bab (\"konteks apa yang telah diceritakan dalam...\"), menjelaskan di setiap edisi kapan perselisihan muncul dan siapa yang memulainya, lalu mengutip Al-Qur'an, hadis, dan perkataan para sahabat serta pengikut dengan rantai transmisi, dan mengakhiri dengan mukjizat para wali."
