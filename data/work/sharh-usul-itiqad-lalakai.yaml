summary:
  ar: "كتاب مسند في عقيدة أهل الحديث لأبي القاسم اللالكائي الشافعي ⁦(ت 418هـ)⁩، حدّث به ببغداد في ربيع الأول سنة 416هـ: يرتب مسائل الاعتقاد أبواباً ⁦(«سياق ما روي في...»)⁩، ويبين في كل مسألة متى حدث الخلاف فيها ومن أحدثه، ثم يستدل بالقرآن والحديث وأقوال الصحابة والتابعين بالأسانيد، ويختم بكرامات الأولياء."
  en: "A narrated book on the creed of the hadith scholars by the Shafi'i Abu al-Qasim al-Lalaka'i (d. 418 AH), which he dictated in Baghdad in Rabi' I 416 AH: it arranges the questions of creed in chapters ('the account of what is narrated on...'), states for each when the dispute arose and who started it, then argues from the Qur'an, hadith and the sayings of Companions and Successors with chains, and ends with the miracles of the saints."
