structure: "The author's introduction (method and purpose); the names of those regarded as imams of the Sunna; urging adherence to the Book and the Sunna; God's names and attributes; the Qur'an as God's uncreated speech (with the list of some 550 who said so); the vision of God; predestination; prophethood and the Prophet's miracles; faith; what follows death (the grave, the resurrection, the signs of the Hour); obedience to rulers; the order of the caliphs and the virtues of the Companions; the miracles of the saints."
