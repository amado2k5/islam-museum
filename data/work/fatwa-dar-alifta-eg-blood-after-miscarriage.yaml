id: work/fatwa-dar-alifta-eg-blood-after-miscarriage
class: work
kind: fatwa
label: { ar: "حكم الدم النازل بعد الإجهاض", en: "The ruling on blood discharged after a miscarriage", ur: "اسقاط کے بعد نزول آنے والے خون کا حکم", es: "La normativa sobre la sangre expulsada tras un aborto espontáneo", fr: "La décision concernant les saignements survenus après une fausse couche", tr: "Kürtaj sonrası kanama kararı", id: "Putusan tentang pendarahan setelah aborsi" }
summary:
  ar: "سائل سأل عن الدم النازل بعد الإجهاض ومتى يعد نفاسًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21016)⁩ ببيان أن بداية تخلق الجنين في رحم أمه تكون بتمام ثمانية وعشرين يومًا تحسب من أول يوم في آخر حيضة سبقت الحمل وبيّن الجواب حكم الدم النازل بعد الإجهاض على وجهه."
  en: "A questioner asked about blood discharged after a miscarriage and when it counts as postnatal bleeding. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21016) answered that the foetus's formation begins at twenty-eight completed days counted from the first day of the last menstruation before the pregnancy; the answer sets out the blood's ruling."
  ur: "ایک سائل نے اسقاط کے بعد خون کے نزول کا حکم اور نفاس ہونے کا وقت پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21016)⁩ نے جواب میں جنین کی تخلق کا آغاز اٹھائیس دن بتایا اور خون کا حکم بیان کیا۔"
  es: "Una persona preguntó sobre la sangre expulsada tras un aborto espontáneo y cuándo se considera sangrado posparto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21016) respondió que la formación del feto comienza a los veintiocho días completos contados desde el primer día de la última menstruación antes del embarazo; la respuesta establece la normativa sobre la sangre."
  fr: "Une personne a posé une question concernant les saignements survenant après une fausse couche et leur classification en tant que saignements post-partum. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21016) a répondu que la formation du fœtus débute vingt-huit jours complets après le premier jour des dernières règles précédant la grossesse; la réponse précise le statut de ces saignements."
  tr: "Düşükten sonra gelen kan ve doğum sonrası ne zaman kabul edildiği hakkında soru soruldu. Mısır'ın Dar al-Ifta'sı (Cumhurbaşkanı Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21016), annenin rahminde fetal oluşumun başlangıcının tam olarak yirmi sekiz gün olduğunu, gebelikten önceki son adet döneminin ilk gününden itibaren sayıldığını, cevabın ise kürtajdan sonra yüz üzerinde çıkan kanın verdiği karar olduğunu belirtti."
  id: "Pertanyaan yang diajukan tentang darah yang muncul setelah keguguran dan kapan dianggap pasca melahirkan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21016) menjawab dengan pernyataan bahwa awal pembentukan janin di rahim ibu tepat dua puluh delapan hari, dihitung sejak hari pertama menstruasi terakhir sebelum kehamilan, dan jawabannya adalah keputusan tentang darah yang keluar setelah aborsi di wajahnya."
