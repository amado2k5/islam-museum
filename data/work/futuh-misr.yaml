label: { ar: "فتوح مصر والمغرب", en: "Futuh Misr wa-l-Maghrib (The Conquest of Egypt and the Maghrib)", ur: "فتوح مصر والمغرب" }
summary:
  ar: "كتاب ابن عبد الحكم المصري (ت 257هـ)، ويعده محققه من أهم المصادر العربية الأولى لفتح مصر وأقدم ما وصل من مؤلفات مؤرخي مصر الإسلامية. يبدأ بأخبار مصر قبل الإسلام كما رواها القصاص، ثم كتاب النبي إلى المقوقس، ثم فتح مصر والإسكندرية، ثم خطط الفسطاط، ثم أخبار عمرو بن العاص مع عمر، ثم فتوح المغرب والأندلس وولاة إفريقية. يروي أخباره بالأسانيد على طريقة المحدثين، إلا في باب الخطط {cite:futuh-misr-amir-1999 intro p. ج} {cite:futuh-misr-amir-1999 intro p. ل}."
  en: "Ibn Abd al-Hakam al-Misri's (d. 257 AH) book, which its editor counts among the most important early Arabic sources for the conquest of Egypt and the oldest surviving work by a historian of Islamic Egypt. It opens with the storytellers' accounts of Egypt before Islam, then the Prophet's letter to al-Muqawqis, the conquest of Egypt and Alexandria, the plots (khitat) of al-Fustat, Amr ibn al-As's dealings with Umar, and the conquests of the Maghrib and al-Andalus with the governors of Ifriqiya. It gives its reports with chains of transmission in the manner of the hadith scholars, except in the chapter on the plots {cite:futuh-misr-amir-1999 intro p. ج} {cite:futuh-misr-amir-1999 intro p. ل}."
  ur: "ابن عبد الحکم مصری (وفات 257ھ) کی کتاب، جسے اس کے محقق فتح مصر کے ابتدائی عربی مآخذ میں اہم ترین اور اسلامی مصر کے مؤرخین کی قدیم ترین محفوظ تصنیف شمار کرتے ہیں۔ یہ اسلام سے پہلے کے مصر کے بارے میں قصہ گو راویوں کی روایات سے شروع ہوتی ہے، پھر مقوقس کے نام نبی کا خط، فتح مصر و اسکندریہ، فسطاط کے خطط، عمرو بن العاص اور عمر کے معاملات، اور مغرب و اندلس کی فتوحات اور افریقیہ کے والی۔ یہ روایات محدثین کی طرح اسناد کے ساتھ بیان کرتی ہے، سوائے خطط کے باب کے {cite:futuh-misr-amir-1999 intro p. ج} {cite:futuh-misr-amir-1999 intro p. ل}۔"
