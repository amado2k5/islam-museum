label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن عقد المزايدة", en: "IIFA resolution on the auction contract", ur: "اکیڈمی کی قرارداد: مزایدہ ⁦(نیلامی)⁩ کا معاہدہ", es: "Resolución de la IIFA sobre el contrato de subasta", fr: "Résolution de l'IIFA sur le contrat de vente aux enchères", tr: "Uluslararası İslami Fiqh Akademisi'nin açık artırma sözleşmesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai kontrak lelang" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: عقد المزايدة عقد معاوضة يعتمد دعوة الراغبين للمشاركة في المزاد نداء أو كتابة ويتم عند رضا البائع، ويتنوع بحسب موضوعه إلى بيع وإجارة وغيرها وبحسب طبيعته إلى اختياري وإجباري كمزادات القضاء، وبيّن الأحكام على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on the auction contract: an exchange contract relying on inviting bidders by call or writing, concluded at the seller's consent; it divides by subject into sale, lease and more, and by nature into voluntary auctions and compulsory ones like court-ordered auctions — with the rulings detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩ نیلامی پر: معاوضہ عقد ہے جو بولی لگانے والوں کی دعوت پر ہوتا ہے؛ اختیاری اور عدالتی دونوں صورتوں کے احکام بیان ہوئے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre el contrato de subasta: un contrato de intercambio que se basa en la invitación a los postores por llamada o por escrito, celebrado con el consentimiento del vendedor; se divide por objeto en venta, arrendamiento y más, y por naturaleza en subastas voluntarias y obligatorias como las subastas ordenadas por un tribunal, con las resoluciones detalladas."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur le contrat d'enchères: un contrat d'échange s'appuyant sur l'invitation des soumissionnaires par appel ou par écrit, conclu avec le consentement du vendeur; elle divise par objet en vente, location et autres, et par nature en enchères volontaires et en enchères obligatoires comme les enchères ordonnées par un tribunal — avec les décisions détaillées."
  tr: "Uluslararası İslami Fiqh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) karar aldığı karar: Açık artırma sözleşmesi, satıcının onayıyla yapılan ve ilgili tarafları açık artırmaya davet veya yazılı olarak davet eden bir takas sözleşmesidir. Satış, kiralama ve diğer konulara göre değişir; ayrıca mahkemeli açık artırmalarda olduğu gibi isteğe bağlı ve zorunlu nitelikte olabilir. Kararlar aşağıda ayrıntılı olarak açıklanacaktır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kedelapan (Brunei, Juni 1993): Kontrak lelang adalah kontrak barter yang mengundang pihak yang berkepentingan untuk berpartisipasi dalam lelang melalui undangan atau tertulis, dilakukan dengan persetujuan penjual. Kontrak ini bervariasi sesuai dengan pokok perhatiannya untuk penjualan, sewa, dan lainnya, serta secara sifatnya menjadi opsional dan wajib seperti dalam lelang yudisial. Putusan tersebut dijelaskan di bawah ini."
