summary:
  ar: "سائل سأل عن سداد الديون المتراكمة على جمعية خيرية من أموال الزكاة وتطوير أماكن تقديم الخدمات الطبية للمرضى. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21662)⁩ ببيان حكم الإنفاق من أموال الزكاة في سداد تلك الديون وتطوير أماكن الخدمات الطبية على وجهه."
  en: "A questioner asked about paying a charity's accumulated debts from zakat funds and developing places providing medical services to patients. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21662) answered by setting out the ruling on spending zakat on those debts and on developing the medical service premises."
  ur: "ایک سائل نے خیراتی جمعیت کے جمع شدہ قرضے زکات سے ادا کرنے اور طبی خدمات کی جگہیں بہتر بنانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21662)⁩ نے جواب میں زکات کے ان مصارف کا حکم بیان کیا۔"
