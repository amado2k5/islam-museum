summary:
  ar: "تفسير فخر الدين الرازي (544–604هـ)، المعروف بالتفسير الكبير ومفاتيح الغيب؛ يقسم الكلام على الآية إلى «مسائل» يعرض فيها أقوال المفسرين والمتكلمين ويحتج لكل قول ثم يرجح أو يتوقف، ويعتني بالنحو والبلاغة وأسرار العطف. وفي تفسير سورة الواقعة عبارة لكاتبها يذكر فيها الرازي غائبًا، فعلّق محققو طبعة دار الفكر بأنها تُشعر بأن هذا الموضع لمؤلف آخر أكمل الكتاب."
  en: "The commentary of Fakhr al-Din al-Razi (544–604 AH), known as al-Tafsir al-Kabir and Mafatih al-Ghayb ('The Keys to the Unseen'); it divides the discussion of each verse into 'questions' (masa'il) that set out the views of exegetes and theologians, argue each and then decide or suspend judgement, and attends to grammar, rhetoric and the subtleties of conjunction. In the commentary on Surat al-Waqi'a its writer mentions al-Razi in the third person, and the Dar al-Fikr editors note that this suggests the passage is by another author who completed the book."
  ur: "فخر الدین رازی (544–604ھ) کی تفسیر، جو التفسیر الکبیر اور مفاتیح الغیب کے نام سے معروف ہے؛ اس میں ہر آیت پر گفتگو کو «مسائل» میں تقسیم کیا گیا ہے جن میں مفسرین اور متکلمین کے اقوال پیش کر کے ہر ایک کے دلائل دیے جاتے ہیں، پھر ترجیح یا توقف کیا جاتا ہے، اور نحو، بلاغت اور عطف کے نکات کا اہتمام ہے۔ سورۂ واقعہ کی تفسیر میں اس کا لکھنے والا رازی کا ذکر غائب کے صیغے میں کرتا ہے، اور دار الفکر کے محققین لکھتے ہیں کہ اس سے لگتا ہے یہ حصہ کسی اور مصنف کا ہے جس نے کتاب مکمل کی۔"
