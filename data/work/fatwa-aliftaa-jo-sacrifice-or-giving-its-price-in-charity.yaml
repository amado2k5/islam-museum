id: work/fatwa-aliftaa-jo-sacrifice-or-giving-its-price-in-charity
class: work
kind: fatwa
label: { ar: "الأضحية أم التصدق بثمنها", en: "Offering the sacrifice or giving its price in charity", ur: "قربانی یا اس کی قیمت صدقہ کرنا" }
summary:
  ar: "سؤال عن الأضحية أم التصدق بثمنها، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأضحية أفضل من التصدق بثمنها، لأنها شعيرة ظاهرة من شعائر الدين. أجابت الدائرة بأن الأضحية أفضل من التصدق بثمنها على الفقراء والمساكين، لأنها شعيرة من شعائر الدين الظاهرة، واستشهدت بـ[[passage/quran-22-32|سورة الحج 22:32]]. وذكرت أن الأحاديث الصحيحة الصريحة وردت في فضلها، وأن النبي والخلفاء من بعده ضحوا."
  en: "A question about offering the sacrifice or giving its price in charity, in which Jordan's General Iftaa Department answered that offering the sacrifice is better than giving its price in charity, because it is a visible rite of the religion. The Department answered that offering the sacrifice is better than giving its price to the poor and needy, because it is one of the visible rites of the religion, citing [[passage/quran-22-32|Surat al-Hajj 22:32]]. It noted that clear authentic hadith speak of its merit, and that the Prophet and the caliphs after him offered sacrifices."
  ur: "قربانی یا اس کی قیمت صدقہ کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قربانی اس کی قیمت صدقہ کرنے سے افضل ہے، کیونکہ یہ دین کا ایک نمایاں شعار ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی اس کی قیمت فقرا اور مساکین پر صدقہ کرنے سے افضل ہے، کیونکہ یہ دین کے نمایاں شعائر میں سے ہے، اور [[passage/quran-22-32|سورۃ الحج 22:32]] کا حوالہ دیا۔ اس نے بتایا کہ اس کی فضیلت میں صریح صحیح احادیث آئی ہیں، اور نبی اور ان کے بعد خلفا نے قربانی کی۔"
