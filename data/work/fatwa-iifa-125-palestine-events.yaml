label: { ar: "قرار مجمع الفقه الإسلامي الدولي 125 (13/7) بشأن أحداث فلسطين وغيرها", en: "IIFA resolution 125 (13/7) on the events in Palestine and elsewhere", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 125 (13/7): فلسطین اور دیگر واقعات", es: "Resolución 125 (13/7) de la IIFA sobre los acontecimientos en Palestina y otros lugares.", fr: "Résolution 125 (13/7) de l'IIFA sur les événements en Palestine et ailleurs" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة عشرة بالكويت ⁦(7–12 شوال 1422هـ، 22–27 ديسمبر 2001م)⁩، بعد أحداث الحادي عشر من سبتمبر وفي سياق الانتفاضة الفلسطينية. يتناول النص بلسان المجمع واقع الأمة والعالم المعاصر وما يصفه بعداء موجهًا ضد الإسلام والمسلمين ⁦(تشويه حقيقة الإسلام والتشكيك في أحكام شريعته، وانتهاك الحرمات واحتلال الأراضي وسفك الدماء والاستيلاء على الثروات)⁩، ويستحضر وجوب بيان العلماء للأحكام المتعلقة بأحوال المسلمين وعدم كتمان الشهادة، ويورد الحكم الشرعي في قضايا العصر على ضوء ذلك ⁦(منها موقفه من فلسطين والأقصى وما سماه الاستشهاديات، والتعامل مع أحداث العام 2001)⁩. سُجّل بوصفه نص المجمع ذاته، ملخصًا بحياد ومنسوبًا إليه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 13th session in Kuwait (7–12 Shawwal 1422, 22–27 December 2001), issued after 11 September and amid the Palestinian intifada. In the Academy's own voice it surveys the condition of the umma and the contemporary world and what it describes as hostility directed at Islam and Muslims — defaming Islam's truths and sowing doubt in its law, violating sanctities, occupying lands, shedding blood and seizing wealth — citing the scholars' duty to make the rulings known and not withhold testimony, then sets out in that light its positions on the questions of the day, including Palestine, Al-Aqsa and what it terms martyrdom operations, and the events of 2001. Recorded as the Academy's own text, summarised neutrally and attributed to it."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، کویت میں تیرہویں مجلس ⁦(7–12 شوال 1422ھ، 22–27 دسمبر 2001ء)⁩ میں — 11 ستمبر کے واقعات اور فلسطینی انتفاضے کے تناظر میں۔ اکیڈمی کی اپنی زبانی میں متن امت اور عصری دنیا کے حالات اور اس کے بقول اسلام اور مسلمانوں کے خلاف دشمنی — اسلام کی حقیقت کی بدنامی، شریعت میں شک، حرمات کی خلاف ورزی، زمینوں پر قبضہ، خونریزی اور دولت کی ضبطی — بیان کرتا ہے، علماء کے فرض کے حوالے سے کہ وہ احکام ظاہر کریں اور شہادت نہ چھپائیں، اور اسی روشنی میں عہد کے مسائل — فلسطین، اقصیٰ اور اس کے بقول فدائی کارروائیاں، اور 2001ء کے واقعات — پر اپنا مؤقف۔ یہاں اکیڈمی کے اپنے متن کا غیر جانبدارانہ خلاصہ اسی کو منسوب کر کے درج ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 13.ª sesión celebrada en Kuwait (del 7 al 12 de Shawwal de 1422, del 22 al 27 de diciembre de 2001), emitida tras el 11 de septiembre y en el contexto de la Intifada palestina. En palabras de la propia Academia, se analiza la situación de la umma y del mundo contemporáneo, así como la hostilidad dirigida contra el islam y los musulmanes —que difama las verdades del islam, siembra dudas sobre su ley, viola lugares sagrados, ocupa tierras, derramamiento de sangre y apropiación de riquezas—, citando el deber de los eruditos de dar a conocer las resoluciones y no ocultar testimonios. A continuación, expone, desde esa perspectiva, su postura sobre las cuestiones de actualidad, incluyendo Palestina, Al-Aqsa y lo que denomina operaciones de martirio, así como los acontecimientos de 2001. El texto se recoge como documento oficial de la Academia, se resume de forma neutral y se le atribuye."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 13e session au Koweït (7-12 Shawwal 1422, 22-27 décembre 2001), publiée après les attentats du 11 septembre et en pleine Intifada palestinienne. L'Académie y dresse un état des lieux de la communauté musulmane (umma) et du monde contemporain, et dénonce l'hostilité dont sont victimes l'islam et les musulmans: diffamation des vérités islamiques, mise en doute de sa loi, profanation des lieux saints, occupation de territoires, effusion de sang et spoliation des biens. Elle rappelle le devoir des savants de faire connaître les avis juridiques et de ne pas taire leur témoignage, puis expose, dans cette perspective, ses positions sur les questions d'actualité, notamment la Palestine, Al-Aqsa, les opérations de martyre et les événements de 2001. Ce texte, reproduit ici de manière neutre, est attribué à l'Académie."
