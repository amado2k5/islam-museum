summary:
  ar: "كتاب بأربعة أقسام، يحفظ في الثاني حساب معاملات القوى المنسوب إلى الكرجي؛ تأليف شبابي مع احتمال مراجعات لاحقة، لا نسخة أصلية للكرجي {cite:samawal-mactutor Biography} {cite:samawal-dsb algebra}."
  en: "Four-part algebra work whose second part preserves Karaji's attributed coefficient computation; youthful composition with possible later revisions, not Karaji's original manuscript {cite:samawal-mactutor Biography} {cite:samawal-dsb algebra}."
  ur: "چار حصوں کی جبری کتاب، دوسرے میں کرجی سے منسوب ضریب حساب محفوظ؛ نوجوانی کی تصنیف اور ممکنہ بعد کی مراجعتیں، کرجی کا اصل مخطوطہ نہیں {cite:samawal-mactutor Biography} {cite:samawal-dsb algebra}۔"
  es: "Obra de álgebra en cuatro partes cuya segunda parte conserva el cálculo de coeficientes atribuido a Karaji; composición juvenil con posibles revisiones posteriores, no el manuscrito original de Karaji {cite:samawal-mactutor Biografía} {cite:samawal-dsb álgebra}."
  fr: "Ouvrage d'algèbre en quatre parties dont la deuxième partie préserve le calcul des coefficients attribué à Karaji; composition de jeunesse avec d'éventuelles révisions ultérieures, pas le manuscrit original de Karaji {cite:samawal-mactutor Biography} {cite:samawal-dsb algebra}."
  tr: "Dört bölümden oluşan bir kitap, ikincisi al-Karji'ye atfedilen güç katsayılarının hesaplanmasını korur; gelecekte revizyon olasılığı olan genç bir eserdir, al-Karji'nin orijinal kopyası değil {cite:samawal-mactutor biyografi} {cite:samawal-dsb cebiri} değildir."
  id: "Sebuah buku dalam empat bagian, bagian kedua mempertahankan perhitungan koefisien pangkat yang dikaitkan dengan al-Karji; sebuah karya muda dengan kemungkinan revisi di masa depan, bukan salinan asli al-Karji {cite:samawal-mactutor biography} {cite:samawal-dsb algebra}."
