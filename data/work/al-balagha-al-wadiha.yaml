summary:
  ar: "البلاغة الواضحة، كتاب في البلاغة لمؤلفه علي الجارم ومصطفى أمين، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: 1943م; ت 1949م {cite:wikipedia-ar-ali-al-jarim}. وجواب الملخص عن وجوده في المكتبة الشاملة: نعم، والكتاب في المكتبة الشاملة: #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}. لم يقرأ المتحف الكتاب."
  en: "al-Balagha al-Wadiha, a book on rhetoric (balagha) by Ali al-Jarim and Mustafa Amin; its date in a research summary supplied to the museum is 1943 CE; d. 1949 CE {cite:wikipedia-ar-ali-al-jarim}. The summary's answer on its presence in the Shamela library: Yes, the book is in the Shamela library: #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}. The museum has not read the book."
  ur: "البلاغة الواضحة، بلاغت پر ایک کتاب، مصنف علي الجارم ومصطفى أمين؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: 1943ء; وفات 1949ء {cite:wikipedia-ar-ali-al-jarim}۔ شاملہ میں موجودگی پر خلاصے کا جواب: جی ہاں، کتاب المکتبۃ الشاملہ میں ہے: #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Balagha al-Wadiha, livre sur la rhétorique (balagha) de Ali al-Jarim and Mustafa Amin ; sa date dans une synthèse de recherche remise au musée : 1943; m. 1949 {cite:wikipedia-ar-ali-al-jarim}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Oui, le livre figure dans la bibliothèque Shamela : #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}. Le musée n'a pas lu le livre."
  es: "al-Balagha al-Wadiha, libro sobre retórica (balagha) de Ali al-Jarim and Mustafa Amin; su fecha en un resumen de investigación entregado al museo: 1943; m. 1949 {cite:wikipedia-ar-ali-al-jarim}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: Sí, el libro está en la biblioteca Shamela: #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}. El museo no ha leído el libro."
  tr: "Al-Balagha Al-Wadih, yazarı Ali Al-Jarim ve Mustafa Amin tarafından yazılan retorik üzerine bir kitap, müzeye sunulan bir araştırma özetine göre tarihlendirilmiştir: 1943; ö. 1949 {cite:wikipedia-ar-ali-al-jarim}. Özetin Kapsamlı Kütüphane'deki varlığıyla ilgili yanıtı: Evet, ve kitap Kapsamlı Kütüphane'de: #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}. Müze kitabı okumadı."
  id: "Al-Balagha Al-Wadih, sebuah buku tentang retorika karya penulisnya Ali Al-Jarim dan Mustafa Amin, bertanggal sesuai ringkasan penelitian yang dikirim ke museum: 1943; wafat 1949 {cite:wikipedia-ar-ali-al-jarim}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Ya, dan buku ini ada di Perpustakaan Komprehensif: #56869 (Shamela.org PDF) {cite:shamela-org-pdf-al-balagha-al-wadiha}. Museum tidak membaca buku tersebut."
