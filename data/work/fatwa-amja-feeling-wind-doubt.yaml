id: work/fatwa-amja-feeling-wind-doubt
class: work
kind: fatwa
label: { ar: "الشك في الحدث", en: "A feeling in the rear — certainty is not removed by doubt", ur: "ریح کا احساس — یقین شک سے نہیں جاتا", es: "Una sensación en la parte de atrás: la certeza no se elimina con la duda.", fr: "Une sensation à l'arrière — la certitude n'est pas supprimée par le doute", tr: "Etkinlikle ilgili şüphe", id: "Keraguan tentang acara" }
summary:
  ar: "سأل سائل إذا أحس بشيء في دبره هل يجب أن يعتبره ريحًا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78366 بتاريخ 27 مارس 2009)⁩ أن المرء إذا توضأ ثم شك في الحدث فهو على وضوئه حتى يستيقن من الحدث لأن اليقين لا يزول بالشك لا سيما إذا كان مبتلى بالوسوسة فإن الوسوسة من الشيطان يريد أن يفسد عليه عبادته على ما فصّل الجواب."
  en: "A questioner who felt something in his rear asked whether he must count it wind. Dr. Salah al-Sawi (fatwa no. 78366, 27 March 2009) answered that one who did wudu then doubts the hadath remains on his wudu until the hadath is certain — certainty is not removed by doubt, especially for one afflicted with waswasa, which is of Satan seeking to spoil his worship — as the answer details."
  ur: "ریح کا شبہ؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78366، 27 مارچ 2009)⁩ کے مطابق یقین شک سے نہیں جاتا — وسواسے والا وضو پر رہے۔"
  es: "Un consultante que sintió algo en la parte posterior preguntó si debía considerarlo un gas. El Dr. Salah al-Sawi (fatwa n.° 78366, 27 de marzo de 2009) respondió que quien realiza la ablución y luego duda de la verdad permanece en ella hasta que la verdad sea cierta; la duda no elimina la certeza, especialmente para quien está afectado por waswasa, que es la influencia de Satanás que busca perjudicar su culto, como se detalla en la respuesta."
  fr: "Un homme qui ressentait une sensation désagréable au niveau du rectum demanda s'il devait considérer cela comme des gaz. Le Dr Salah al-Sawi (fatwa n° 78366, 27 mars 2009) répondit que celui qui a fait ses ablutions puis doute de leur validité doit les maintenir jusqu'à ce que la validité soit certaine. La certitude n'est pas remise en cause par le doute, surtout pour une personne atteinte de waswasa, une influence satanique visant à perturber son adoration, comme le précise la réponse."
  tr: "Bir soruya soran kişiye şöyle soruldu: Eğer anüsünde bir şey hissederse, bunu bir koku olarak mı kabul etmeli? Dr. Salah Al-Sawy (27 Mart 2009 tarihli 78366 No. Fetva) şöyle yanıtladı: Bir kişi abdest alıp sonra kirlilikten şüphe ederse, kirlilikten emin olana kadar yine de abdest olur; çünkü şüpheyle kesinlik, özellikle fısıltıya kapılırsa, ki Şeytan ibadetini bozmak için fısıldayarak fısıldadı, bu cevapta açıklanıyor."
  id: "Seorang penanya ditanya: Jika ia merasakan sesuatu di anusnya, apakah ia harus menganggapnya sebagai bau? Dr. Salah Al-Sawy menjawab (Fatwa No. 78366 tanggal 27 Maret 2009) bahwa jika seseorang melakukan wudhu lalu meragukan ketidakmurniannya, ia tetap dalam wudhu sampai yakin akan ketidakmurniannya, karena kepastian tidak hilang bersama keraguan, terutama jika ia mengalami bisikan, seperti yang dibisikkan oleh Setan yang bermaksud merusak ibadahnya, seperti yang dijelaskan dalam jawaban."
