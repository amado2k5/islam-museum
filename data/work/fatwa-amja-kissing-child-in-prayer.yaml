id: work/fatwa-amja-kissing-child-in-prayer
class: work
kind: fatwa
label: { ar: "تقبيل الطفل في الصلاة", en: "Kissing a child in the prayer — unlike carrying him", ur: "نماز میں بچے کا بوسہ — اٹھانے جیسا نہیں", es: "Besar a un niño en la oración, a diferencia de cargarlo.", fr: "Embrasser un enfant pendant la prière — contrairement au fait de le porter", tr: "Çocuğu dua ederken öpmek", id: "Mencium anak dalam doa" }
summary:
  ar: "سأل سائل هل يجوز تقبيل الطفل في الصلاة قياسًا على جواز حمله. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86400 بتاريخ 27 يناير 2012)⁩ أنها لم تقف على دليل من السنة بجواز ذلك والذي يظهر أنه على أصل المنع لأنه ليس من جنس أعمال الصلاة من ناحية ولا تدعو إليه ضرورة ولا حاجة ماسة من ناحية أخرى بخلاف الحمل على ما فصّل الجواب."
  en: "A questioner asked whether kissing a child in the prayer is lawful by analogy to carrying him. AMJA's fatwa committee (fatwa no. 86400, 27 January 2012) answered that it found no proof in the Sunna for it; what appears is the rule of prevention — it is not of the prayer's kind of acts, nor does need or pressing necessity call to it, unlike carrying — as the answer details."
  ur: "نماز میں بچے کا بوسہ؟ لجنة الفتوى ⁦(فتویٰ 86400، 27 جنوری 2012)⁩ کے مطابق سنت میں دلیل نہیں — اصل منع؛ اٹھانے سے مختلف۔"
  es: "Un consultante preguntó si besar a un niño durante la oración es lícito por analogía con cargarlo. El comité de fatuas de AMJA (fatua n.° 86400, 27 de enero de 2012) respondió que no encontró pruebas en la Sunna al respecto; lo que parece ser la regla de prevención —no se trata de un acto propio de la oración, ni la necesidad o urgencia lo justifican, a diferencia de cargar a un niño— como se detalla en la respuesta."
  fr: "Un internaute a demandé si embrasser un enfant pendant la prière était licite, par analogie avec le fait de le porter. Le comité des fatwas de l'AMJA (fatwa n° 86400, 27 janvier 2012) a répondu qu'il n'avait trouvé aucune preuve à cet égard dans la Sunna; il semblerait qu'il s'agisse d'une règle de prévention: ce n'est pas un acte de la même nature que la prière, et aucun besoin impérieux ne l'exige, contrairement au fait de porter un enfant, comme le précise la réponse."
  tr: "Bir soru soran, hamileliğin mücaizliğine dayanarak namaz sırasında bir çocuğu öpmenin caiz olup olmadığını sordu. Amerikan Şeriat Hukukçuları Akademisi Fetva Komitesi (27 Ocak 2012 tarihli Fetva No. 86400), bunun izin veren herhangi bir Sünni kanıtı bulunmadığını yanıtladı; bu kanıt, bir yandan namaz eylemleriyle aynı nitelikte olmadığı ve diğer yandan zorunluluk veya acil ihtiyaç gerektirmediği için yasak ilkesine dayanıyor gibi görünüyor; cevapta açıklandığı gibi hamilelik gibi değil."
  id: "Seorang penanya menanyakan apakah diperbolehkan mencium anak saat berdoa berdasarkan diperbolehkannya kehamilan. Komite Fatwa di American Academy of Sharia Jurists (Fatwa No. 86400 tertanggal 27 Januari 2012) menanggapi bahwa mereka tidak menemukan bukti Sunni yang mengizinkannya, yang tampaknya didasarkan pada prinsip larangan karena tidak sama dengan tindakan doa di satu sisi, juga tidak memerlukan kebutuhan atau kebutuhan mendesak di sisi lain, berbeda dengan kehamilan seperti yang dijelaskan dalam jawaban."
