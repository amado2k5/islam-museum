id: work/fatwa-amja-iblis-before-adam-obedience
class: work
kind: fatwa
label: { ar: "حال إبليس قبل معصيته", en: "Iblis's state before his disobedience", ur: "ابليس کی معصیت سے پہلے کی حالت", es: "El estado de Iblis antes de su desobediencia.", fr: "L'état d'Iblis avant sa désobéissance", tr: "Şeytan'ın günahından önceki durumu", id: "Keadaan Setan sebelum dosanya" }
summary:
  ar: "سأل سائل عن قول الشيخ عبد الحميد كشك في درس أن الشيطان قبل معصيته في عدم سجوده لآدم كان مطيعًا لله معروفًا بالطاعات. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77578 بتاريخ 26 يناير 2009)⁩ أنه لم تأت فيما يعلم آثار صحيحة يعول عليها في هذا المذكور وإنما هي حكايات منقولة وأخبار مرسلة، لكن الذي يقطع به أن إبليس كان من الجن ففسق عن أمر ربه وأن الجن منهم الصالحون ومنهم دون ذلك، والاشتغال بهذه القضايا لا ينبني عليه كثير عمل وكل مسألة لا ينبني عليها عمل فالخوض فيها من التكلف المنهي عنه."
  en: "A questioner cited Shaykh Abd al-Hamid Kishk saying in a lesson that Satan before his disobedience — refusing to bow to Adam — had been obedient to God and known for devotions. Dr. Salah al-Sawi (fatwa no. 77578, 26 January 2009) answered that to his knowledge no reliable reports ground this; they are transmitted tales and loose narratives; what is certain is that Iblis was of the jinn and disobeyed his Lord's command, and among jinn are the righteous and those less so; busying with such matters builds little action, and every question on which no action rests is the needless exertion we were forbidden."
  ur: "ایک سائل نے ابلیس کی سجدہ انکار سے پہلے کی طاعت پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77578، 26 جنوری 2009)⁩ کے مطابق اس کی کوئی معتبر روایت نہیں — یقینی بات یہ ہے کہ ابلیس جنوں سے تھا اور اپنے رب کے حکم سے باہر نکلا۔"
  es: "Un interlocutor citó al jeque Abd al-Hamid Kishk diciendo en una lección que Satanás, antes de su desobediencia —al negarse a postrarse ante Adán—, había sido obediente a Dios y conocido por su devoción. El Dr. Salah al-Sawi (fatwa n.º 77578, 26 de enero de 2009) respondió que, según su conocimiento, no existen informes fiables que respalden esta afirmación; se trata de relatos transmitidos y narraciones imprecisas. Lo cierto es que Iblis era un genio y desobedeció el mandato de su Señor, y entre los genios hay justos y otros no tanto. Ocuparse de tales asuntos no genera ninguna acción, y toda cuestión que no derive en ninguna acción es un esfuerzo innecesario que nos fue prohibido."
  fr: "Un interrogateur a cité le cheikh Abd al-Hamid Kishk affirmant, dans un enseignement, que Satan, avant sa désobéissance – son refus de se prosterner devant Adam –, avait été obéissant à Dieu et connu pour sa dévotion. Le Dr Salah al-Sawi (fatwa n° 77578, 26 janvier 2009) a répondu qu'à sa connaissance, aucun récit fiable ne fonde cette affirmation; il s'agit de contes transmis et de récits vagues; ce qui est certain, c'est qu'Iblis était un djinn et qu'il a désobéi à l'ordre de son Seigneur, et que parmi les djinns se trouvent les vertueux et ceux qui le sont moins; s'attarder sur de telles questions n'engendre que peu d'action, et toute question qui ne donne lieu à aucune action est un effort inutile qui nous a été interdit."
  tr: "Bir soruya sahibi, Şeyh Abdul Hamid Kaşk'ın Şeytan'ın Adem'e itaatsizlikten önce Tanrı'ya itaat ettiğini ve itaatkarlığıyla tanındığını söylediği bir derste soruldu. Dr. Salah Al-Sawy (26 Ocak 2009 tarihli 77578 sayılı fetva) bu konuda güvenilir ve güvenilir bir rapor olmadığını, bunların aktarılan hikâyeler ve raporlar olduğunu söyledi. Ancak kesin olan şudur ki, İblis cinler arasında idi ve Rabbinin emrini dinledi, bazı cinler doğru, bazıları değil. Bu konularla ilgilenmek çok fazla iş gerektirmez ve her konu eylem gerektirmez, bu yüzden bunlara dalmak yasak bir formalite biçimidir."
  id: "Seorang penanya ditanya tentang pernyataan Sheikh Abdul Hamid Kashk dalam pelajaran bahwa Setan, sebelum ketidaktaatan kepada Adam, taat kepada Tuhan dan dikenal karena ketaatannya. Dr. Salah Al-Sawy menjawab (Fatwa No. 77578 tanggal 26 Januari 2009) bahwa ia tidak memiliki laporan otentik yang dapat diandalkan mengenai masalah ini; melainkan laporan tersebut adalah cerita yang disampaikan dan laporan yang disampaikan. Namun, yang pasti adalah bahwa Iblis berada di antara para jin dan melanggar perintah Tuhannya, dan beberapa jin itu benar dan beberapa tidak. Menangani isu-isu ini tidak memerlukan banyak pekerjaan, dan tidak setiap isu memerlukan tindakan, sehingga menyelidiki masalah tersebut adalah bentuk formalitas yang dilarang."
