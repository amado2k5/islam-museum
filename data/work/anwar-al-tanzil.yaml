summary:
  ar: "في التفسير، للقاضي الإمام العلامة ناصر الدين أبي سعيد عبد الله بن عمر البيضاوي الشافعي المتوفى بتبريز؛ قال حاجي خليفة: رُزق هذا الكتاب من عند الله بحسن القبول عند جمهور الأفاضل والفحول فعكفوا عليه بالدرس والتحشية {cite:kashf-zunun-furqan p. 672-674}."
  en: "Al-Baydawi's Anwar al-Tanzil wa-Asrar al-Ta'wil — the tafsir that 'won gracious acceptance among the generality of the learned', generating dozens of glosses and supercommentaries {cite:kashf-zunun-furqan p. 672-674}."
  ur: "بیضاوی کی «انوار التنزیل واسرار التاویل» — وہ تفسیر جسے حاجی خلیفہ کے مطابق عام اہلِ علم میں قبولِ عام ملا، اور جس پر درجنوں حواشی لکھے گئے؛ مصنف نے اسے صحابہ، تابعین اور سلف سے پہنچنے والی تفسیر کے خلاصے، اپنے اور بعد کے ائمہ کے نکات، اور مشہور قراءتوں پر مشتمل بنایا {cite:kashf-zunun-furqan p. 672-674} {cite:anwar-al-tanzil-fleischer-v1 p.5}۔"
  es: "Anwar al-Tanzil wa-Asrar al-Ta'wil de Al-Baydawi, el tafsir que \"ganó amable aceptación entre la generalidad de los eruditos\", generando docenas de glosas y supercomentarios {citar:kashf-zunun-furqan p. 672-674}."
  fr: "Anwar al-Tanzil wa-Asrar al-Ta'wil d'Al-Baydawi — le tafsir qui « a gagné une gracieuse acceptation parmi la généralité des érudits », générant des dizaines de gloses et de supercommentaires {cite: kashf-zunun-furqan p. 672-674}."
  tr: "Tefsir'de, yargıç tarafından İmam Nasir al-Din Ebu Said Abdullah bin Ömer el-Baydavi el-Şafii, Tebriz'de vefat eden Hacı Halife şöyle dedi: Bu kitap, Allah tarafından çoğu seçkin alim ve büyük alimler tarafından iyi karşılanması için verildi, bu yüzden kendilerini onu incelemeye ve açıklamaya adadılar {atıf:kaşf-zunun-furqan s. 672-674}."
  id: "Dalam tafsir, oleh hakim, ulama Imam Nasir al-Din Abu Sa'id Abdullah ibn Omar al-Baydawi al-Shafi'i, yang meninggal di Tabriz; Haji Khalifa berkata: Kitab ini dikurniakan Allah dan diterima dengan baik oleh mayoritas ulama dan ulama terkemuka, sehingga mereka mendedikasikan diri untuk mempelajari dan memberi anotasi {cite:kashf-zunun-furqan hlm. 672-674}."
