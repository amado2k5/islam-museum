summary:
  ar: "في التفسير، للقاضي الإمام العلامة ناصر الدين أبي سعيد عبد الله بن عمر البيضاوي الشافعي المتوفى بتبريز؛ قال حاجي خليفة: رُزق هذا الكتاب من عند الله بحسن القبول عند جمهور الأفاضل والفحول فعكفوا عليه بالدرس والتحشية {cite:kashf-zunun-furqan p. 672-674}."
  en: "Al-Baydawi's Anwar al-Tanzil wa-Asrar al-Ta'wil — the tafsir that 'won gracious acceptance among the generality of the learned', generating dozens of glosses and supercommentaries {cite:kashf-zunun-furqan p. 672-674}."
  ur: "بیضاوی کی «انوار التنزیل واسرار التاویل» — وہ تفسیر جسے حاجی خلیفہ کے مطابق عام اہلِ علم میں قبولِ عام ملا، اور جس پر درجنوں حواشی لکھے گئے؛ مصنف نے اسے صحابہ، تابعین اور سلف سے پہنچنے والی تفسیر کے خلاصے، اپنے اور بعد کے ائمہ کے نکات، اور مشہور قراءتوں پر مشتمل بنایا {cite:kashf-zunun-furqan p. 672-674} {cite:anwar-al-tanzil-fleischer-v1 p.5}۔"
