id: work/fatwa-amja-chronic-excuse-congregation
class: work
kind: fatwa
label: { ar: "أصحاب الأعذار والجماعة", en: "A lasting excuse and the congregational prayer", ur: "دائمی عذر اور نماز با جماعت" }
summary:
  ar: "سأل سائل هل يصلي الجماعة إذا غلب على ظنه أنه سيسلت إذا تحرك أو انثنى في الصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83747 بتاريخ 10 فبراير 2011)⁩ أن أصحاب الأعذار الدائمة إن غلب على ظنهم أنهم إن صبروا بعد دخول الوقت مدة معينة انقطع عنهم العذر فينبغي أن ينتظروا إلى انقطاع العذر محافظة على الطهارة فإن الطهور شطر الإيمان ووجوب الطهارة متفق عليه أما وجوب صلاة الجماعة فمختلف فيه على ما فصّل الجواب من أحكام أصحاب الأعذار."
  en: "A questioner asked whether to join the congregation when he suspects he would emit drops if he moved or bent in the prayer. Dr. Salah al-Sawi (fatwa no. 83747, 10 February 2011) answered that people of lasting excuses who suspect that bearing a certain span after the time enters will end the excuse should wait for its ending to preserve purity — purity being half of faith and its obligation agreed, while the congregational prayer's obligation is disputed; the answer details the rulings of excuse-holders."
  ur: "ایک شخص کو نماز میں قطرے خارج ہونے کا خدشہ تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83747، 10 فروری 2011)⁩ کے مطابق عذر ختم ہونے کا انتظار بہتر ہے — طہارت متفق واجب، جماعت مختلف۔"
