id: work/fatwa-amja-chronic-excuse-congregation
class: work
kind: fatwa
label: { ar: "أصحاب الأعذار والجماعة", en: "A lasting excuse and the congregational prayer", ur: "دائمی عذر اور نماز با جماعت", es: "Una excusa duradera y la oración congregacional", fr: "Une excuse durable et la prière de l'assemblée" }
summary:
  ar: "سأل سائل هل يصلي الجماعة إذا غلب على ظنه أنه سيسلت إذا تحرك أو انثنى في الصلاة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83747 بتاريخ 10 فبراير 2011)⁩ أن أصحاب الأعذار الدائمة إن غلب على ظنهم أنهم إن صبروا بعد دخول الوقت مدة معينة انقطع عنهم العذر فينبغي أن ينتظروا إلى انقطاع العذر محافظة على الطهارة فإن الطهور شطر الإيمان ووجوب الطهارة متفق عليه أما وجوب صلاة الجماعة فمختلف فيه على ما فصّل الجواب من أحكام أصحاب الأعذار."
  en: "A questioner asked whether to join the congregation when he suspects he would emit drops if he moved or bent in the prayer. Dr. Salah al-Sawi (fatwa no. 83747, 10 February 2011) answered that people of lasting excuses who suspect that bearing a certain span after the time enters will end the excuse should wait for its ending to preserve purity — purity being half of faith and its obligation agreed, while the congregational prayer's obligation is disputed; the answer details the rulings of excuse-holders."
  ur: "ایک شخص کو نماز میں قطرے خارج ہونے کا خدشہ تھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83747، 10 فروری 2011)⁩ کے مطابق عذر ختم ہونے کا انتظار بہتر ہے — طہارت متفق واجب، جماعت مختلف۔"
  es: "Un consultante preguntó si debía unirse a la congregación si sospechaba que derramaría gotas al moverse o inclinarse durante la oración. El Dr. Salah al-Sawi (fatwa n.° 83747, 10 de febrero de 2011) respondió que quienes tienen excusas permanentes y sospechan que, tras un tiempo determinado, su excusa terminará, deben esperar a que termine para preservar la pureza —la pureza es la mitad de la fe y su obligación es aceptada, mientras que la obligación de la oración en congregación es objeto de debate—. La respuesta detalla las normas para quienes tienen excusas."
  fr: "Un fidèle a demandé s'il devait se joindre à la prière en groupe s'il craignait d'émettre des gouttes de sueur en bougeant ou en se penchant pendant la prière. Le Dr Salah al-Sawi (fatwa n° 83747, 10 février 2011) a répondu que les personnes bénéficiant d'une dispense permanente et qui pensent que le maintien de leur abstinence pendant un certain temps après l'heure de la prière prendra fin doivent attendre la fin de cette dispense afin de préserver leur pureté rituelle. La pureté rituelle étant considérée comme la moitié de la foi et son obligation étant admise, l'obligation de la prière en groupe est, quant à elle, sujette à controverse. La réponse détaille les règles applicables aux personnes bénéficiant d'une dispense permanente."
