id: work/fatwa-aliftaa-jo-commission-for-paying-bills-through-e-wallets
class: work
kind: fatwa
label: { ar: "العمولة على دفع الفواتير عبر المحافظ الإلكترونية", en: "Commission for paying bills through e-wallets", ur: "ای والٹ کے ذریعے بل ادا کرنے پر کمیشن" }
summary:
  ar: "سؤال عن العمولة على دفع الفواتير عبر المحافظ الإلكترونية، أجابت فيه دائرة الإفتاء العام الأردنية بأن صاحب المحفظة الإلكترونية وكيل في الدفع، فيجوز له أخذ أجرة معلومة مقطوعة أو بالنسبة إذا دفع الموكل المبلغ عند الدفع أو قبله، فإن لم يدفع فورًا اجتمعت وكالة وقرض فلا تجوز العمولة. أجابت الدائرة بأن صاحب المحفظة الإلكترونية وكيل في الدفع عن الموكلين الذين يريدون سداد فواتيرهم أو تحويل أموال إلى حساب شخص آخر، وأن الأصل جواز أن يأخذ الوكيل من موكله أجرة معلومة، سواء كانت مبلغًا مقطوعًا أو عمولة بالنسبة، إذا دفع الموكل المبلغ مباشرة قبل السداد دون تأجيل. وقالت إن الموكل إذا لم يسدد مباشرة تضمنت العملية وكالة وقرضًا من الوكيل للموكل، فلا يجوز للوكيل حينئذ أخذ عمولة حذرًا من شبهة الربا. وخلصت إلى جواز أخذ الوكيل أجرة معلومة عند سداد الفواتير أو التحويل إذا دفع الموكل المبلغ عند عملية الدفع أو قبلها."
  en: "A question about commission for paying bills through e-wallets, in which Jordan's General Iftaa Department answered that the e-wallet holder is an agent in making the payment, so he may take a known fee, fixed or as a percentage, if the client pays him the amount at or before the time of payment; if the client does not pay at once, agency and a loan are combined and no commission is permitted. The Department answered that the e-wallet holder acts as the paying agent of clients who want to settle their bills or transfer money to someone else's account, and that in principle an agent may take a known fee from his principal, whether a fixed amount or a percentage commission, provided the client pays the amount directly before the bill is paid, without deferral. It said that if the client does not pay at once, the transaction combines agency with a loan from the agent to the client, and the agent may then not take a commission, to avoid any suspicion of riba. It concluded that the agent may take a known fee for paying bills or making transfers when the client pays him the amount at the time of payment or before it."
  ur: "ای والٹ کے ذریعے بل ادا کرنے پر کمیشن کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ای والٹ رکھنے والا ادائیگی میں وکیل ہے، اس لیے اگر گاہک ادائیگی کے وقت یا اس سے پہلے رقم دے دے تو وہ مقررہ یا فیصدی معلوم اجرت لے سکتا ہے؛ اگر گاہک فوراً ادا نہ کرے تو وکالت اور قرض جمع ہو جاتے ہیں اور کمیشن جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ ای والٹ رکھنے والا ان موکلین کا ادائیگی کا وکیل ہے جو اپنے بل ادا کرنا یا کسی اور کے کھاتے میں رقم بھیجنا چاہتے ہیں، اور اصلاً وکیل اپنے موکل سے معلوم اجرت لے سکتا ہے، چاہے مقررہ رقم ہو یا فیصدی کمیشن، بشرطیکہ موکل بل کی ادائیگی سے پہلے بغیر تاخیر کے رقم براہِ راست دے دے۔ اس نے کہا کہ اگر موکل فوراً ادا نہ کرے تو معاملے میں وکالت کے ساتھ وکیل کی طرف سے موکل کو قرض بھی شامل ہو جاتا ہے، اور اس وقت سود کے شبہے سے بچنے کے لیے وکیل کمیشن نہیں لے سکتا۔ اس نے نتیجہ نکالا کہ اگر موکل ادائیگی کے وقت یا اس سے پہلے رقم دے دے تو وکیل بل کی ادائیگی یا منتقلی پر معلوم اجرت لے سکتا ہے۔"
