label: { ar: "العمولة على دفع الفواتير عبر المحافظ الإلكترونية", en: "Commission for paying bills through e-wallets", ur: "ای والٹ کے ذریعے بل ادا کرنے پر کمیشن", es: "Comisión por pago de facturas a través de monederos electrónicos", fr: "Commission pour le paiement de factures par portefeuille électronique", tr: "E-cüzdanlar üzerinden fatura ödemelerinden komisyon", id: "Komisi pembayaran tagihan melalui e-wallet" }
summary:
  ar: "سؤال عن العمولة على دفع الفواتير عبر المحافظ الإلكترونية، أجابت فيه دائرة الإفتاء العام الأردنية بأن صاحب المحفظة الإلكترونية وكيل في الدفع، فيجوز له أخذ أجرة معلومة مقطوعة أو بالنسبة إذا دفع الموكل المبلغ عند الدفع أو قبله، فإن لم يدفع فورًا اجتمعت وكالة وقرض فلا تجوز العمولة. أجابت الدائرة بأن صاحب المحفظة الإلكترونية وكيل في الدفع عن الموكلين الذين يريدون سداد فواتيرهم أو تحويل أموال إلى حساب شخص آخر، وأن الأصل جواز أن يأخذ الوكيل من موكله أجرة معلومة، سواء كانت مبلغًا مقطوعًا أو عمولة بالنسبة، إذا دفع الموكل المبلغ مباشرة قبل السداد دون تأجيل. وقالت إن الموكل إذا لم يسدد مباشرة تضمنت العملية وكالة وقرضًا من الوكيل للموكل، فلا يجوز للوكيل حينئذ أخذ عمولة حذرًا من شبهة الربا. وخلصت إلى جواز أخذ الوكيل أجرة معلومة عند سداد الفواتير أو التحويل إذا دفع الموكل المبلغ عند عملية الدفع أو قبلها."
  en: "A question about commission for paying bills through e-wallets, in which Jordan's General Iftaa Department answered that the e-wallet holder is an agent in making the payment, so he may take a known fee, fixed or as a percentage, if the client pays him the amount at or before the time of payment; if the client does not pay at once, agency and a loan are combined and no commission is permitted. The Department answered that the e-wallet holder acts as the paying agent of clients who want to settle their bills or transfer money to someone else's account, and that in principle an agent may take a known fee from his principal, whether a fixed amount or a percentage commission, provided the client pays the amount directly before the bill is paid, without deferral. It said that if the client does not pay at once, the transaction combines agency with a loan from the agent to the client, and the agent may then not take a commission, to avoid any suspicion of riba. It concluded that the agent may take a known fee for paying bills or making transfers when the client pays him the amount at the time of payment or before it."
  ur: "ای والٹ کے ذریعے بل ادا کرنے پر کمیشن کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ ای والٹ رکھنے والا ادائیگی میں وکیل ہے، اس لیے اگر گاہک ادائیگی کے وقت یا اس سے پہلے رقم دے دے تو وہ مقررہ یا فیصدی معلوم اجرت لے سکتا ہے؛ اگر گاہک فوراً ادا نہ کرے تو وکالت اور قرض جمع ہو جاتے ہیں اور کمیشن جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ ای والٹ رکھنے والا ان موکلین کا ادائیگی کا وکیل ہے جو اپنے بل ادا کرنا یا کسی اور کے کھاتے میں رقم بھیجنا چاہتے ہیں، اور اصلاً وکیل اپنے موکل سے معلوم اجرت لے سکتا ہے، چاہے مقررہ رقم ہو یا فیصدی کمیشن، بشرطیکہ موکل بل کی ادائیگی سے پہلے بغیر تاخیر کے رقم براہِ راست دے دے۔ اس نے کہا کہ اگر موکل فوراً ادا نہ کرے تو معاملے میں وکالت کے ساتھ وکیل کی طرف سے موکل کو قرض بھی شامل ہو جاتا ہے، اور اس وقت سود کے شبہے سے بچنے کے لیے وکیل کمیشن نہیں لے سکتا۔ اس نے نتیجہ نکالا کہ اگر موکل ادائیگی کے وقت یا اس سے پہلے رقم دے دے تو وکیل بل کی ادائیگی یا منتقلی پر معلوم اجرت لے سکتا ہے۔"
  es: "Una pregunta sobre la comisión por el pago de facturas mediante monederos electrónicos, a la que el Departamento General de Iftaa de Jordania respondió que el titular del monedero electrónico actúa como agente en la realización del pago, por lo que puede cobrar una comisión conocida, fija o porcentual, si el cliente le paga el importe en el momento del pago o antes; si el cliente no paga de inmediato, se combinan la agencia y el préstamo y no se permite ninguna comisión. El Departamento respondió que el titular del monedero electrónico actúa como agente de pago de los clientes que desean liquidar sus facturas o transferir dinero a la cuenta de otra persona, y que, en principio, un agente puede cobrar una comisión conocida a su principal, ya sea una cantidad fija o un porcentaje, siempre que el cliente pague el importe directamente antes de que se pague la factura, sin aplazamiento. Añadió que si el cliente no paga de inmediato, la transacción combina la agencia con un préstamo del agente al cliente, y el agente no puede cobrar comisión, para evitar cualquier sospecha de usura. Se concluyó que el agente puede cobrar una comisión fija por el pago de facturas o la realización de transferencias cuando el cliente le paga el importe en el momento del pago o antes."
  fr: "Concernant la question des commissions pour le paiement de factures par portefeuille électronique, le Département général de l'Iftaa de Jordanie a répondu que le titulaire du portefeuille électronique agit en tant qu'intermédiaire pour effectuer le paiement. Il peut donc percevoir une commission, fixe ou proportionnelle, si le client effectue le paiement au plus tard à l'échéance. En revanche, si le client ne paie pas immédiatement, l'opération combine les fonctions d'intermédiaire et de prêt, et aucune commission n'est autorisée. Le Département a précisé que le titulaire du portefeuille électronique agit comme mandataire pour le compte de clients souhaitant régler leurs factures ou effectuer des virements. En principe, un mandataire peut percevoir une commission de son mandant, qu'il s'agisse d'un montant fixe ou d'un pourcentage, à condition que le client paie la facture immédiatement, sans délai. Il a ajouté que si le client ne paie pas immédiatement, l'opération combine les fonctions d'intermédiaire et de prêt, et que le mandataire ne peut alors percevoir de commission afin d'éviter tout soupçon d'usure (riba). Il a été conclu que l'agent peut percevoir des frais connus pour le paiement de factures ou la réalisation de virements lorsque le client lui verse le montant au moment du paiement ou avant celui-ci."
  tr: "Elektronik cüzdanlar üzerinden fatura ödemeleri için komisyon hakkında bir soru; Ürdün Genel Fetva Müdürlüğü, elektronik cüzdan sahibinin ödeme ajanı olduğunu, sabit bir ücret alabileceğini veya asıl kişinin ödemede veya ödemeden önce ödeme yaparsa, vekaletname ve kredi birleştirildiğini, böylece komisyonun kabul edilemez olduğunu belirtti. Departman, elektronik cüzdan sahibinin, faturalarını ödemek veya başka bir kişinin hesabına para transferi yapmak isteyen müşteriler adına ödeme yapan bir temsilci olduğunu ve temerrüt durumunun, temsilcinin ödemeden hemen önce ödemesi şartıyla toplu veya yüzde bazında komisyon olarak bilinen bir ücret alabileceğini belirtti. Temsilci hemen ödeme yapmazsa, işlemin vekaletname ve temsilciden asıl kişiye kredi alması gerektiğini, bu nedenle faiz şüphesine karşı tedbirli olarak komisyon almasına izin verilmediğini belirtti. Komisyon, temsilcinin fatura ödemesi veya transfer sırasında bilinen bir ücret talep edebileceğini, eğer asıl kişi ödeme sürecinde veya öncesinde tutarı ödediyse, tespit edebileceği sonucuna varıldı."
  id: "Pertanyaan tentang komisi pembayaran tagihan melalui dompet elektronik, di mana Departemen Fatwa Umum Yordania menjawab bahwa pemilik dompet elektronik adalah agen pembayaran, sehingga ia dapat mengambil biaya tetap atau jika pokok membayar jumlah tersebut pada atau sebelum pembayaran, jika tidak langsung membayar, maka surat kuasa dan pinjaman digabungkan, sehingga komisi tidak diperbolehkan. Departemen menjawab bahwa pemilik dompet elektronik adalah agen yang membayar atas nama klien yang ingin membayar tagihan atau mentransfer dana ke rekening orang lain, dan bahwa default adalah agen dapat mengambil biaya yang diketahui dari agennya, baik jumlah sekaligus maupun komisi berdasarkan persentase, asalkan pokok membayar jumlah tersebut segera sebelum pembayaran tanpa penundaan. Departemen tersebut menyatakan bahwa jika agen tidak membayar segera, transaksi melibatkan surat kuasa dan pinjaman dari agen kepada prinsipal, sehingga agen tidak diperbolehkan mengambil komisi demi kewaspadaan terhadap dugaan riba. Kesimpulan tersebut menyimpulkan bahwa agen dapat mengenakan biaya yang diketahui saat pembayaran tagihan atau transfer jika pokok membayar jumlah tersebut pada atau sebelum proses pembayaran."
