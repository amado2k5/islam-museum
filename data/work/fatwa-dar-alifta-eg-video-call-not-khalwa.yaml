id: work/fatwa-dar-alifta-eg-video-call-not-khalwa
class: work
kind: fatwa
label: { ar: "أثر التقنيات الحديثة ⁦(الكونفرنس)⁩ في ثبوت الخلوة بين الزوجين", en: "Do modern video calls establish legal seclusion between spouses?", ur: "کیا ویڈیو کال میاں بیوی کے درمیان شرعی خلوہ ثابت کرتی ہے؟", es: "¿Las videollamadas modernas establecen un aislamiento legal entre cónyuges?" }
summary:
  ar: "سائل سأل عن أثر محادثة الزوجين عبر الفيديو كونفرانس في ثبوت الخلوة الشرعية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21681)⁩ أن محادثة الزوجين عبر الإنترنت لا تعد خلوة شرعية حتى ولو رأى كل منهما الآخر على ما فصّل الجواب."
  en: "A questioner asked whether a video-conference call between spouses establishes legal seclusion. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21681) answered that conversation over the internet does not count as sharia seclusion — even if each sees the other — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا میاں بیوی کی ویڈیو کانفرنس شرعی خلوہ ثابت کرتی ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21681)⁩ نے جواب دیا کہ انٹرنیٹ پر گفتگو خلوہ شمار نہیں ہوتی خواہ ایک دوسرے کو دیکھ بھی لیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó si una videollamada entre cónyuges constituye un aislamiento legal. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21681) respondió que una conversación por internet no se considera aislamiento según la sharia, incluso si ambos cónyuges se ven, como se detalla en la respuesta."
