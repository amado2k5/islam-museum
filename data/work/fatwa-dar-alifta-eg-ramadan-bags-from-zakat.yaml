class: work
kind: fatwa
label: { ar: "حكم إخراج شنط رمضان من زكاة المال", en: "Giving Ramadan food bags from zakat on wealth", ur: "زکات المال سے رمضان کے راشن تھیلے دینا", es: "Donación de bolsas de alimentos de Ramadán provenientes del zakat sobre la riqueza", fr: "Distribution de sacs de nourriture pour le Ramadan grâce à la zakat sur les richesses" }
summary:
  ar: "سائل سأل عن إخراج شنط رمضان الغذائية من زكاة المال. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21725)⁩ أن الأصل أن تدفع الزكاة إلى الفقراء والمحتاجين من جنس المال الذي وجبت فيه فإن تأكد للمزكي أن مصلحة الفقير في إعطائه عينًا جاز ذلك على ما فصّل الجواب."
  en: "A questioner asked about giving Ramadan food bags from zakat on wealth. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21725) answered that the default is paying zakat to the poor and needy from the kind of wealth it was due on; if the payer is sure the poor person's interest lies in receiving goods, that is permitted — as the answer details."
  ur: "ایک سائل نے زکات المال سے رمضان کے راشن تھیلے دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21725)⁩ نے جواب دیا کہ اصول یہ ہے کہ زکات اسی جنس سے ادا ہو جس پر واجب ہوئی؛ اگر فقیر کی بھلائی سامان دینے میں ہو تو یہ بھی جائز ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de entregar bolsas de alimentos para el Ramadán con el zakat sobre la riqueza. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21725) respondió que lo habitual es pagar el zakat a los pobres y necesitados con el tipo de riqueza que corresponde; si quien paga está seguro de que el interés de la persona pobre radica en recibir bienes, esto está permitido, como se detalla en la respuesta."
  fr: "Une question a été posée concernant la distribution de colis alimentaires pour le Ramadan à partir de la zakat prélevée sur les biens. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21725) a répondu que la règle générale est de verser la zakat aux pauvres et aux nécessiteux à partir des biens sur lesquels elle est due; toutefois, si le payeur est certain que l’intérêt du pauvre réside dans la réception de biens, cela est permis, comme le précise la réponse."
