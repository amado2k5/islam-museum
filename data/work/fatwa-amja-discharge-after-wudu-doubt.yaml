id: work/fatwa-amja-discharge-after-wudu-doubt
class: work
kind: fatwa
label: { ar: "شك في نزول شيء بعد الوضوء", en: "Doubted a discharge after wudu — the incontinence rule", ur: "وضو کے بعد نزول کا شک", es: "Dudaba de una secreción después del wudu: la regla de la incontinencia", fr: "Il y a eu des doutes sur l'écoulement après les ablutions (wudu) — la règle de l'incontinence" }
summary:
  ar: "سأل سائل أنه بعد الوضوء لصلاة المغرب شك في نزول شيء من ذكره فضغط عليه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79922 بتاريخ 10 سبتمبر 2009)⁩ أن الخارج من السبيلين ينقض الوضوء سواء أكان بولًا أم مذيًا إلا من كان يعاني من السلس وهو النزول المستمر لهذه السوائل فإنه يتوضأ لوقت كل صلاة ثم يتحفظ بأن يعصب خرقة ويصلي وما نزل بعد ذلك فلا يضر على ما فصّل الجواب."
  en: "A questioner after wudu for maghrib doubted something descending from him and squeezed it out. Dr. Salah al-Sawi (fatwa no. 79922, 10 September 2009) answered that whatever exits the two passages breaks wudu, whether urine or madhy — except one suffering incontinence, the continuous descent of these fluids: he does wudu for each prayer's time, then guards by binding a cloth and prays; what descends after that does no harm — as the answer details."
  ur: "وضو کے بعد نزول کا شک۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79922، 10 ستمبر 2009)⁩ کے مطابق خارج ہونے والا وضو توڑتا ہے سوائے سلس والے کے — تحفظ اور وقت پر وضو کافی۔"
  es: "Tras realizar la ablución para la oración del Maghrib, un consultante expresó dudas sobre algo que descendía de él y lo expulsó. El Dr. Salah al-Sawi (fatwa n.º 79922, 10 de septiembre de 2009) respondió que todo lo que sale por los dos conductos anula la ablución, ya sea orina o heces, excepto en el caso de la incontinencia, donde el descenso continuo de estos fluidos es perjudicial. En este caso, el consultante realiza la ablución para cada oración, se cubre con un paño y reza; lo que desciende después no causa daño, como se detalla en la respuesta."
  fr: "Un homme, après avoir fait ses ablutions pour la prière du maghrib, a douté de ce qui sortait de lui et a essayé de l'expulser. Le Dr Salah al-Sawi (fatwa n° 79922, 10 septembre 2009) a répondu que tout ce qui sort par les deux voies annule les ablutions, qu'il s'agisse d'urine ou de madhy, sauf en cas d'incontinence. Dans ce cas, l'écoulement continu de ces liquides entraîne la rupture des ablutions: le patient effectue ses ablutions pour chaque prière, se protège en se bandant un tissu et prie; ce qui sort ensuite est sans danger, comme le précise la réponse."
