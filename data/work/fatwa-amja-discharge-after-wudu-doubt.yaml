id: work/fatwa-amja-discharge-after-wudu-doubt
class: work
kind: fatwa
label: { ar: "شك في نزول شيء بعد الوضوء", en: "Doubted a discharge after wudu — the incontinence rule", ur: "وضو کے بعد نزول کا شک" }
summary:
  ar: "سأل سائل أنه بعد الوضوء لصلاة المغرب شك في نزول شيء من ذكره فضغط عليه. أجاب د. صلاح الصاوي ⁦(فتوى رقم 79922 بتاريخ 10 سبتمبر 2009)⁩ أن الخارج من السبيلين ينقض الوضوء سواء أكان بولًا أم مذيًا إلا من كان يعاني من السلس وهو النزول المستمر لهذه السوائل فإنه يتوضأ لوقت كل صلاة ثم يتحفظ بأن يعصب خرقة ويصلي وما نزل بعد ذلك فلا يضر على ما فصّل الجواب."
  en: "A questioner after wudu for maghrib doubted something descending from him and squeezed it out. Dr. Salah al-Sawi (fatwa no. 79922, 10 September 2009) answered that whatever exits the two passages breaks wudu, whether urine or madhy — except one suffering incontinence, the continuous descent of these fluids: he does wudu for each prayer's time, then guards by binding a cloth and prays; what descends after that does no harm — as the answer details."
  ur: "وضو کے بعد نزول کا شک۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 79922، 10 ستمبر 2009)⁩ کے مطابق خارج ہونے والا وضو توڑتا ہے سوائے سلس والے کے — تحفظ اور وقت پر وضو کافی۔"
