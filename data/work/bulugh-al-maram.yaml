summary:
  ar: "كتاب ابن حجر العسقلاني في أحاديث الأحكام، رتبه على أبواب الفقه ليكون مدخلاً للمتعلم إلى أدلة المسائل."
  en: "Ibn Hajar al-Asqalani's collection of hadiths bearing on legal rulings, arranged by the chapters of jurisprudence as an entry point to the evidence behind legal questions."
  es: "La colección de hadices de Ibn Hajar al-Asqalani, que guarda relación con las normas jurídicas, está organizada por capítulos de jurisprudencia como punto de partida para comprender las pruebas que sustentan las cuestiones legales."
  fr: "Le recueil de hadiths d'Ibn Hajar al-Asqalani relatif aux décisions juridiques, organisé par chapitres de jurisprudence comme point d'entrée vers les preuves sous-jacentes aux questions juridiques."
  ur: "ابن حجر العسقلانی کا قانونی احکام پر مشتمل احادیث کا مجموعہ، جسے فقہ کے ابواب کے ذریعے ترتیب دیا گیا ہے، قانونی سوالات کے پیچھے ثبوت کے لیے ایک داخلی نقطہ کے طور پر۔"
  tr: "İbn Hajar al-Askelani'nin hükümlerin hadisleri üzerine kitabı, bilginlere sorunların kanıtlarına giriş olarak hizmet etmek üzere fıkıh bölümlerine göre düzenlenmiştir."
  id: "Buku Ibn Hajar al-Asqalani tentang hadis keputusan, yang diatur berdasarkan bab-bab yurisprudensi untuk menjadi pengantar bagi pelajar tentang bukti isu-isu tersebut."
