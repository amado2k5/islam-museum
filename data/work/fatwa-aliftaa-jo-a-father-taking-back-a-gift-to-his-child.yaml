id: work/fatwa-aliftaa-jo-a-father-taking-back-a-gift-to-his-child
class: work
kind: fatwa
label: { ar: "رجوع الوالد في هبته لولده", en: "A father taking back a gift to his child", ur: "باپ کا اولاد کو دیا گیا ہبہ واپس لینا" }
summary:
  ar: "سؤال عن رجوع الوالد في هبته لولده، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يجوز للأب الرجوع في هبته لذي رحم محرم ما لم تترتب عليها مفاضلة بلا مبرر، وهو ما أخذ به القانون، مع أن الشافعية أجازوه بشروط. أجابت الدائرة بأن الهبة تلزم بالقبض ولا يجوز الرجوع فيها بعده، واستشهدت بحديث تشبيه العائد في هبته بالكلب يعود في قيئه. وقالت إن الشافعية استثنوا رجوع الأب في هبته لولده، ونقلت عن النووي في شرحه على صحيح مسلم وفي منهاج الطالبين أن شرطه بقاء الموهوب في سلطنة الولد. وذهب الحنفية إلى منع الرجوع في الهبة لذي الرحم المحرم ومنه هبة الوالد لولده، ونقلت عن السرخسي في المبسوط، وعن المادة 866 من مجلة الأحكام العدلية وشرحها درر الحكام، وأن القانون المدني الأردني أخذ بذلك في المادة 579. وخلصت إلى أنه لا يجوز للأب الرجوع في هبته لذي رحم محرم ما لم تترتب عليها مفاضلة بينهم دون مبرر، وهو ما اختاره القانون، في حين جوّز الشافعية الرجوع بين الأصول والفروع بشروط."
  en: "A question on a father taking back a gift he made to his child, in which Jordan's General Iftaa Department answered that a father may not take back a gift to a close blood relative unless it creates unjustified favouritism, the position the law adopts, while noting that the Shafi'is allow it under conditions. The Department answered that a gift becomes binding on delivery and may not be taken back afterwards, citing the hadith comparing someone who takes back a gift to a dog returning to its vomit. It said the Shafi'is make an exception for a father's gift to his child, quoting al-Nawawi's commentary on Sahih Muslim and his Minhaj al-Talibin that the condition is that the gift remains under the child's control. The Hanafis bar taking back a gift to a close blood relative, including a father's gift to his child; it quoted al-Sarakhsi's al-Mabsut, article 866 of the Majalla and its commentary Durar al-Hukkam, and noted that Jordan's Civil Code adopts this in article 579. It concluded that a father may not take back a gift to a close blood relative unless it creates unjustified favouritism among them, the view the law adopts, while the Shafi'is allow a return between ascendants and descendants under conditions."
  ur: "باپ کے اپنی اولاد کو دیا گیا ہبہ واپس لینے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ باپ محرم رشتہ دار کو دیا گیا ہبہ واپس نہیں لے سکتا جب تک اس سے بلا وجہ ترجیح نہ ہو، اور یہی قانون کا موقف ہے، اگرچہ شافعیہ شرائط کے ساتھ اس کی اجازت دیتے ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ ہبہ قبضے سے لازم ہو جاتا ہے اور اس کے بعد واپس نہیں لیا جا سکتا، اور اس حدیث سے استدلال کیا جس میں ہبہ واپس لینے والے کو قے چاٹنے والے کتے سے تشبیہ دی گئی۔ اس نے کہا کہ شافعیہ نے باپ کے اولاد کو دیے گئے ہبہ کو مستثنیٰ کیا ہے، اور نووی کی شرح صحیح مسلم اور منہاج الطالبین سے نقل کیا کہ شرط یہ ہے کہ ہبہ اولاد کے تصرف میں باقی ہو۔ حنفیہ محرم رشتہ دار کو دیا گیا ہبہ واپس لینے سے منع کرتے ہیں، جس میں باپ کا اولاد کو ہبہ بھی شامل ہے؛ اس نے سرخسی کی المبسوط، مجلۃ الاحکام العدلیہ کی دفعہ 866 اور اس کی شرح درر الحکام سے نقل کیا، اور بتایا کہ اردن کے سول قانون نے دفعہ 579 میں یہی اختیار کیا ہے۔ اس نے نتیجہ نکالا کہ باپ محرم رشتہ دار کو دیا گیا ہبہ واپس نہیں لے سکتا جب تک اس سے ان کے درمیان بلا وجہ ترجیح نہ ہو، اور یہی قانون کا اختیار ہے، جبکہ شافعیہ اصول و فروع کے درمیان شرائط کے ساتھ رجوع جائز کہتے ہیں۔"
