id: work/fatwa-aliftaa-jo-new-accounts-for-a-first-purchase-discount
class: work
kind: fatwa
label: { ar: "فتح حسابات جديدة للحصول على خصم أول شراء", en: "Opening new accounts to get a first-purchase discount", ur: "پہلی خریداری کی رعایت کے لیے نئے اکاؤنٹ بنانا", es: "Abre nuevas cuentas para obtener un descuento en tu primera compra.", fr: "Ouverture d'un nouveau compte pour bénéficier d'une réduction sur le premier achat", tr: "İlk satın alma indirimi için yeni hesaplar açın", id: "Buka akun baru untuk mendapatkan diskon pembelian pertama" }
summary:
  ar: "سؤال عن فتح حسابات جديدة للحصول على خصم أول شراء، أجابت فيه دائرة الإفتاء العام الأردنية بأن على المسلم التزام الصدق، وأن إنشاء حساب جديد للمشتري نفسه يجب فيه مراعاة تعليمات الموقع، فإن خالفها لم يجز. أجابت الدائرة بأن الواجب على المسلم التزام الصدق في أقواله وأفعاله، واستشهدت بـ[[passage/quran-8-27|سورة الأنفال 8:27]] و[[passage/quran-9-119|سورة التوبة 9:119]] وبحديث نسبته إلى البخاري معناه أن من غش المسلمين فليس منهم. وقالت إن إنشاء حساب جديد للمشتري نفسه لا بد فيه من مراعاة تعليمات الموقع، فإن خالف التعليمات فلا يجوز."
  en: "A question about opening new accounts to get a first-purchase discount, in which Jordan's General Iftaa Department answered that a Muslim must be truthful, and that opening a new account for the same buyer must respect the site's rules; if it breaches them it is not permitted. The Department answered that a Muslim must be truthful in word and deed, citing [[passage/quran-8-27|Surat al-Anfal 8:27]], [[passage/quran-9-119|Surat al-Tawba 9:119]] and a hadith it attributes to al-Bukhari whose meaning is that whoever cheats the Muslims is not of them. It said that opening a new account for the same buyer must respect the website's instructions; if it breaches them, it is not permitted."
  ur: "پہلی خریداری کی رعایت کے لیے نئے اکاؤنٹ بنانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مسلمان پر سچائی لازم ہے، اور اسی خریدار کے لیے نیا اکاؤنٹ بنانے میں ویب سائٹ کی ہدایات کی پابندی ضروری ہے؛ ان کی خلاف ورزی ہو تو جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر اپنے قول و فعل میں سچائی لازم ہے، اور [[passage/quran-8-27|سورۃ الانفال 8:27]]، [[passage/quran-9-119|سورۃ التوبہ 9:119]] اور اس حدیث کا حوالہ دیا جسے اس نے بخاری کی طرف منسوب کیا، جس کا مفہوم ہے کہ جو مسلمانوں کو دھوکہ دے وہ ان میں سے نہیں۔ اس نے کہا کہ اسی خریدار کے لیے نیا اکاؤنٹ بنانے میں ویب سائٹ کی ہدایات کا لحاظ ضروری ہے؛ اگر ان کی خلاف ورزی ہو تو یہ جائز نہیں۔"
  es: "Una pregunta sobre la apertura de nuevas cuentas para obtener un descuento en la primera compra, a la que el Departamento General de Iftaa de Jordania respondió que un musulmán debe ser veraz, y que abrir una nueva cuenta para el mismo comprador debe respetar las normas del sitio; si las infringe, no está permitido. El Departamento respondió que un musulmán debe ser veraz en palabra y obra, citando [[passage/quran-8-27|Surat al-Anfal 8:27]], [[passage/quran-9-119|Surat al-Tawba 9:119]] y un hadiz que atribuye a al-Bukhari cuyo significado es que quien engaña a los musulmanes no es de ellos. Dijo que abrir una nueva cuenta para el mismo comprador debe respetar las instrucciones del sitio web; si las infringe, no está permitido."
  fr: "Une question concernant l'ouverture de nouveaux comptes pour bénéficier d'une réduction sur un premier achat a été posée par le Département général de la jurisprudence islamique (Iftaa) de Jordanie. Ce dernier a répondu qu'un musulman se doit d'être sincère et que l'ouverture d'un nouveau compte pour un même acheteur doit respecter les règles du site; toute infraction à ces règles est interdite. Le Département a précisé qu'un musulman doit être sincère en paroles et en actes, citant les versets 27 de la sourate Al-Anfal (8:27) et 119 de la sourate At-Tawba (9:119), ainsi qu'un hadith attribué à al-Bukhari, dont le sens est que quiconque trompe les musulmans n'est pas des leurs. Il a ajouté que l'ouverture d'un nouveau compte pour un même acheteur doit respecter les instructions du site web; toute infraction à ces instructions est interdite."
  tr: "İlk alışverişte indirim almak için yeni hesap açma sorusu verildi; Ürdün Genel Fetva Dairesi, bir Müslümanın dürüst olması gerektiğini ve alıcı için yeni hesap açmanın web sitesinin talimatlarına uyması gerektiğini belirtti; biri bu talimatları ihlal ederse izin verilmez. Daire, Müslümanın sözlerinde ve davranışlarında dürüst olmasının zorunlu olduğunu, [[pasaj/kuran-8-27|Enfal Suresi 8:27]] ve [[pasaj/kuran-9-119|Tat-Tevbe Suresi 9:119]] ve El-Buhari'ye atfedilen bir hadisi örnek gösterdi; yani Müslümanları kandıran kişi onlardan değildir. Alıcı için yeni hesap açmanın web sitesindeki talimatlara uyması gerektiğini; talimatları ihlal ederse bunun izin verilmediğini belirtti."
  id: "Pertanyaan tentang membuka akun baru untuk mendapatkan diskon pada pembelian pertama, di mana Departemen Fatwa Umum Yordania menjawab bahwa seorang Muslim harus jujur dan bahwa membuat akun baru untuk pembeli harus mengikuti instruksi situs web; jika seseorang melanggarnya, hal itu tidak diperbolehkan. Departemen menjawab bahwa Muslim wajib jujur dalam kata-kata dan tindakannya, dengan mengutip [[ayat/al-quran-8-27|Surah Al-Anfal 8:27]] dan [[ayat/al-Qur'an-9-119|Surah At-Tawbah 9:119]] serta hadis yang dikaitkan dengan Al-Bukhari, yang berarti siapa pun yang menipu Muslim bukanlah salah satunya. Departemen tersebut menyatakan bahwa membuat akun baru untuk pembeli sendiri harus mengikuti instruksi situs web; jika melanggar instruksi tersebut, maka tidak diperbolehkan."
