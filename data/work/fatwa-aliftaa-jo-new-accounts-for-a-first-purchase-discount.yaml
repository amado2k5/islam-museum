id: work/fatwa-aliftaa-jo-new-accounts-for-a-first-purchase-discount
class: work
kind: fatwa
label: { ar: "فتح حسابات جديدة للحصول على خصم أول شراء", en: "Opening new accounts to get a first-purchase discount", ur: "پہلی خریداری کی رعایت کے لیے نئے اکاؤنٹ بنانا" }
summary:
  ar: "سؤال عن فتح حسابات جديدة للحصول على خصم أول شراء، أجابت فيه دائرة الإفتاء العام الأردنية بأن على المسلم التزام الصدق، وأن إنشاء حساب جديد للمشتري نفسه يجب فيه مراعاة تعليمات الموقع، فإن خالفها لم يجز. أجابت الدائرة بأن الواجب على المسلم التزام الصدق في أقواله وأفعاله، واستشهدت بـ[[passage/quran-8-27|سورة الأنفال 8:27]] و[[passage/quran-9-119|سورة التوبة 9:119]] وبحديث نسبته إلى البخاري معناه أن من غش المسلمين فليس منهم. وقالت إن إنشاء حساب جديد للمشتري نفسه لا بد فيه من مراعاة تعليمات الموقع، فإن خالف التعليمات فلا يجوز."
  en: "A question about opening new accounts to get a first-purchase discount, in which Jordan's General Iftaa Department answered that a Muslim must be truthful, and that opening a new account for the same buyer must respect the site's rules; if it breaches them it is not permitted. The Department answered that a Muslim must be truthful in word and deed, citing [[passage/quran-8-27|Surat al-Anfal 8:27]], [[passage/quran-9-119|Surat al-Tawba 9:119]] and a hadith it attributes to al-Bukhari whose meaning is that whoever cheats the Muslims is not of them. It said that opening a new account for the same buyer must respect the website's instructions; if it breaches them, it is not permitted."
  ur: "پہلی خریداری کی رعایت کے لیے نئے اکاؤنٹ بنانا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ مسلمان پر سچائی لازم ہے، اور اسی خریدار کے لیے نیا اکاؤنٹ بنانے میں ویب سائٹ کی ہدایات کی پابندی ضروری ہے؛ ان کی خلاف ورزی ہو تو جائز نہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مسلمان پر اپنے قول و فعل میں سچائی لازم ہے، اور [[passage/quran-8-27|سورۃ الانفال 8:27]]، [[passage/quran-9-119|سورۃ التوبہ 9:119]] اور اس حدیث کا حوالہ دیا جسے اس نے بخاری کی طرف منسوب کیا، جس کا مفہوم ہے کہ جو مسلمانوں کو دھوکہ دے وہ ان میں سے نہیں۔ اس نے کہا کہ اسی خریدار کے لیے نیا اکاؤنٹ بنانے میں ویب سائٹ کی ہدایات کا لحاظ ضروری ہے؛ اگر ان کی خلاف ورزی ہو تو یہ جائز نہیں۔"
