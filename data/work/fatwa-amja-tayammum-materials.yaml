label: { ar: "عدة التيمم", en: "What serves for tayammum — clean earth, not beach stones", ur: "تیمم کا سامان — پاک مٹی", es: "¿Qué sirve para el tayammum? Tierra limpia, no piedras de playa.", fr: "Pour le tayammum, on utilise de la terre propre, et non des galets de plage." }
summary:
  ar: "سأل سائل عن نوع الحجارة التي تستعمل للتيمم وهل تجلب من البحر. أجاب د. محمد موفق الغلاييني ⁦(فتوى رقم 80692 بتاريخ 23 ديسمبر 2009)⁩ أن الأصل في أداة التيمم التراب الطاهر كما نصت عليه الآية الكريمة قال سبحانه وإن لم تجدوا ماء فتيمموا صعيدًا طيبًا ولقوله وجعلت لي الأرض مسجدًا وطهورًا، فالصعيد الطيب هو التراب الطاهر وما قام مقامه من وجه الأرض على ما فصّل الجواب من بيان ما يصح التيمم به."
  en: "A questioner asked what kind of stones serve for tayammum and whether they must come from the sea. Dr. Muhammad Mawfiq al-Ghalayini (fatwa no. 80692, 23 December 2009) answered that tayammum's instrument is, in principle, clean dust as the noble verse states — 'if you find no water, tayammum with clean ground' — and his saying 'the earth was made for me a place of prayer and a purifier'; the clean ground is pure dust and what stands in its place of the earth's face — the answer detailing what tayammum is valid with."
  ur: "تیمم کس چیز سے ہو؟ ڈاکٹر موفق الغلاييني ⁦(فتویٰ 80692، 23 دسمبر 2009)⁩ کے مطابق اصل پاک مٹی ہے — سمندر کے پتھر کی شرط نہیں۔"
  es: "Un consultante preguntó qué tipo de piedras sirven para el tayammum y si deben provenir del mar. El Dr. Muhammad Mawfiq al-Ghalayini (fatwa n.° 80692, 23 de diciembre de 2009) respondió que el instrumento para el tayammum es, en principio, polvo limpio, como lo indica el noble versículo: «Si no encuentras agua, realiza el tayammum con tierra limpia», y su dicho: «La tierra me fue hecha un lugar de oración y un purificador». La tierra limpia es polvo puro y lo que se encuentra en su lugar en la superficie de la tierra. Esta respuesta detalla con qué es válido el tayammum."
  fr: "Un internaute a demandé quel type de pierres étaient utilisées pour le tayammum et si elles devaient provenir de la mer. Le Dr Muhammad Mawfiq al-Ghalayini (fatwa n° 80692, 23 décembre 2009) a répondu que l'instrument du tayammum est, en principe, de la poussière pure, comme l'indique le verset: « Si vous ne trouvez pas d'eau, faites le tayammum avec de la terre pure », et comme le dit l'auteur: « La terre a été faite pour moi un lieu de prière et un purificateur ». La terre pure est de la poussière pure et ce qui se trouve à sa place, la surface même de la terre. Cette réponse précise avec quoi le tayammum est valable."
