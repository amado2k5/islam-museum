label:
  ar: "المزهر في علوم اللغة وأنواعها"
  en: "al-Muzhir fi Ulum al-Lugha wa-Anwa'iha (al-Suyuti)"
  ur: "المزہر فی علوم اللغۃ وانواعھا سیوطی"
  fr: "al-Muzhir fi Ulum al-Lugha wa-Anwa'iha (al-Suyuti)"
  es: "al-Muzhir fi Ulum al-Lugha wa-Anwa'iha (al-Suyuti)"
  tr: "Al-Muzhir fi Ulum al-Linguism ve Türleri"
  id: "Al-Muzhir fi Ulum al-Linguism dan Jenis-jenisnya"
summary:
  ar: "كتاب المزهر للسيوطي، يقول مؤلفه إنه رتّب فيه علوم اللغة وأنواعها وشروط أدائها وسماعها على نحو علوم الحديث في التقاسيم والأنواع {cite:muzhir-mansur-1998 1 p.7}، ويفهرسه في خمسين نوعاً تبدأ بمعرفة الصحيح الثابت وتنتهي بأغلاط العرب {cite:muzhir-mansur-1998 1 p.8-9}، ويصدّره بمقالة لابن فارس {cite:muzhir-mansur-1998 1 p.9}، ثم يعرض في النوع الأول حدّ اللغة وواضعها ناقلاً ابن جني وابن فارس {cite:muzhir-mansur-1998 1 p.11-14}."
  en: "al-Suyuti's al-Muzhir, in which its author says he arranged the sciences of language, their kinds and the conditions of their delivery and hearing on the model of the hadith sciences in divisions and kinds {cite:muzhir-mansur-1998 1 p.7}; it is indexed in fifty kinds, beginning with knowing the sound, established and ending with the errors of the Arabs {cite:muzhir-mansur-1998 1 p.8-9}, opens with a passage from Ibn Faris {cite:muzhir-mansur-1998 1 p.9}, and in the first kind sets out the definition of language and who set it down, quoting Ibn Jinni and Ibn Faris {cite:muzhir-mansur-1998 1 p.11-14}."
  ur: "سیوطی کی المزہر، جس میں مصنف کہتے ہیں کہ انھوں نے علومِ لغت، ان کی انواع اور ان کی ادائیگی و سماع کی شرطوں کو تقسیمات اور انواع میں علومِ حدیث کے طرز پر ترتیب دیا {cite:muzhir-mansur-1998 1 p.7}؛ اس کی فہرست پچاس انواع پر ہے جو صحیح ثابت کی معرفت سے شروع ہو کر عربوں کی غلطیوں پر ختم ہوتی ہے {cite:muzhir-mansur-1998 1 p.8-9}، آغاز ابن فارس کی ایک عبارت سے ہوتا ہے {cite:muzhir-mansur-1998 1 p.9}، اور نوعِ اول میں زبان کی تعریف اور اس کے واضع کا بیان ہے جس میں ابن جنی اور ابن فارس سے نقل ہے {cite:muzhir-mansur-1998 1 p.11-14}۔"
  fr: "al-Muzhir d'al-Suyuti, dans lequel son auteur dit avoir ordonné les sciences de la langue, leurs espèces et les conditions de leur transmission et de leur audition sur le modèle des sciences du hadith, en divisions et en espèces {cite:muzhir-mansur-1998 1 p.7} ; il est indexé en cinquante espèces, de la connaissance du sain et établi aux erreurs des Arabes {cite:muzhir-mansur-1998 1 p.8-9}, s'ouvre sur un passage d'Ibn Faris {cite:muzhir-mansur-1998 1 p.9} et, dans la première espèce, expose la définition de la langue et celui qui l'a posée, citant Ibn Jinni et Ibn Faris {cite:muzhir-mansur-1998 1 p.11-14}."
  es: "al-Muzhir de al-Suyuti, en el que su autor dice haber ordenado las ciencias de la lengua, sus especies y las condiciones de su transmisión y audición según el modelo de las ciencias del hadiz, en divisiones y especies {cite:muzhir-mansur-1998 1 p.7}; se indexa en cincuenta especies, desde el conocimiento de lo sano y establecido hasta los errores de los árabes {cite:muzhir-mansur-1998 1 p.8-9}, se abre con un pasaje de Ibn Faris {cite:muzhir-mansur-1998 1 p.9} y, en la primera especie, expone la definición de la lengua y quién la fijó, citando a Ibn Jinni y a Ibn Faris {cite:muzhir-mansur-1998 1 p.11-14}."
  tr: "Al-Suyuti'nin Al-Muzhir adlı eseri, yazarının dilin bilimlerini, türlerini, çalışma koşullarını ve dinlemesini hadis bilimleri tarzında sınıflandırma ve türler halinde düzenlediğini belirtir {cite:muzhir-mansur-1998, 1 s.7}, elli tipe ayırarak, yerleşik ve yerleşik (Sahih) olanı bilmekten başlayıp Arapların hatalarına kadar {cite:muzhir-mansur-1998, 1 s.8-9} ve İbn Faris'in bir makalesiyle birlikte yayımlamıştır {cite:muzhir-mansur-1998, 1 s.9}. Sonra, ilk tipte, dilin sınırlarını ve yazarını sunar, İbn Cinniyi ve İbn Faris'i aktarır {cite:muzhir-mansur-1998, 1 s.11-14}."
  id: "Al-Muzhir oleh Al-Suyuti, yang penulisnya mengatakan ia mengatur ilmu bahasa, jenisnya, kondisi pelaksanaannya, dan mendengarnya dengan cara ilmu hadits dalam klasifikasi dan jenis {cite:muzhir-mansur-1998, 1 hlm.7}, mengkatalogkannya menjadi lima puluh jenis, dimulai dengan mengetahui otentik dan yang sudah mapan (Sahih) dan berakhir dengan kesalahan orang Arab {cite:muzhir-mansur-1998, 1 hlm.8-9}, dan ia menerbitkannya dengan artikel oleh Ibn Faris {cite:muzhir-mansur-1998, 1 hlm.9}. Kemudian, pada tipe pertama, ia menyajikan batas-batas bahasa dan penulisnya, meneruskan Ibn Jinni dan Ibn Faris {cite:muzhir-mansur-1998, 1 hlm.11-14}."
