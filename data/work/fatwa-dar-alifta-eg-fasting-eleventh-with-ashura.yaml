id: work/fatwa-dar-alifta-eg-fasting-eleventh-with-ashura
class: work
kind: fatwa
label: { ar: "حكم صيام الحادي عشر مع عاشوراء بدلًا من التاسع", en: "Fasting the eleventh with 'Ashura instead of the ninth", ur: "عاشورہ کے ساتھ نویں کی بجائے گیارہویں کا روزہ", es: "Ayunar el undécimo día con 'Ashura en lugar del noveno.", fr: "Jeûner le onzième jour avec Achoura au lieu du neuvième", tr: "Dokuzuncu yerine on birinci oruca Ashura ile oruç tutma kararı", id: "Aturan puasa pada tanggal sebelas dengan Ashura, bukan yang kesembilan" }
summary:
  ar: "سائل سأل عن صيام الحادي عشر مع عاشوراء بدلًا من التاسع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21976)⁩ أنه يستحب صيام يومي التاسع والحادي عشر أو أحدهما مع يوم عاشوراء اتباعًا لهدي النبي على ما فصّل الجواب."
  en: "A questioner asked about fasting the eleventh with 'Ashura instead of the ninth. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21976) answered that fasting the ninth and eleventh — or one of them — with the day of 'Ashura is recommended in following the Prophet's guidance, as the answer details."
  ur: "ایک سائل نے عاشورہ کے ساتھ نویں کی بجائے گیارہویں کا روزہ رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21976)⁩ نے جواب دیا کہ عاشورہ کے ساتھ نویں اور گیارہویں — یا ان میں سے ایک — کا روزہ نبی کی ہدایت کی پیروی میں مستحب ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la conveniencia de ayunar el undécimo día junto con Ashura en lugar del noveno. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21976) respondió que ayunar el noveno y el undécimo día —o uno de ellos— junto con el día de Ashura es recomendable para seguir la guía del Profeta, como se detalla en la respuesta."
  fr: "Un internaute a demandé s'il était possible de jeûner le onzième jour du mois avec Achoura au lieu du neuvième. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21976) a répondu que jeûner le neuvième et le onzième jour – ou l'un des deux – avec le jour d'Achoura est recommandé pour suivre les enseignements du Prophète, comme le précise la réponse."
  tr: "Bir soru soran kişi, dokuzuncu yerine Aşura ile on birinci oruç tutulmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21976), cevapta ayrıntılı olarak Peygamber'in rehberliğine uygun olarak Aşura günü dokuzuncu ve on birinci günleri veya her ikisinden birinde oruç tutulmasının önerildiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang puasa pada tanggal sebelas dengan Ashura, bukan pada hari kesembilan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21976) menjawab bahwa disarankan untuk berpuasa pada tanggal sembilan dan sebelas atau pada hari Ashura sesuai dengan bimbingan Nabi, sebagaimana dijelaskan dalam jawabannya."
