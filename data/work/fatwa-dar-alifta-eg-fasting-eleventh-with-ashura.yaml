summary:
  ar: "سائل سأل عن صيام الحادي عشر مع عاشوراء بدلًا من التاسع. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21976)⁩ أنه يستحب صيام يومي التاسع والحادي عشر أو أحدهما مع يوم عاشوراء اتباعًا لهدي النبي على ما فصّل الجواب."
  en: "A questioner asked about fasting the eleventh with 'Ashura instead of the ninth. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21976) answered that fasting the ninth and eleventh — or one of them — with the day of 'Ashura is recommended in following the Prophet's guidance, as the answer details."
  ur: "ایک سائل نے عاشورہ کے ساتھ نویں کی بجائے گیارہویں کا روزہ رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21976)⁩ نے جواب دیا کہ عاشورہ کے ساتھ نویں اور گیارہویں — یا ان میں سے ایک — کا روزہ نبی کی ہدایت کی پیروی میں مستحب ہے، جیسا کہ جواب میں تفصیل ہے۔"
