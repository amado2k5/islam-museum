id: work/fatwa-dar-alifta-eg-fasting-day-of-doubt-oath-expiation
class: work
kind: fatwa
label: { ar: "حكم صوم يوم الشك بنية كفارة اليمين", en: "Fasting the day of doubt intending oath-expiation", ur: "شک کے دن کفارۂ یمین کی نیت سے روزہ رکھنا", es: "Ayunar el día de la duda con la intención de expiar el juramento.", fr: "Jeûner le jour du doute en vue de l'expiation du serment" }
summary:
  ar: "سائل سأل عن صوم يوم الشك بنية كفارة اليمين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22480)⁩ أن يوم الشك هو الثلاثون من شعبان إذا تحدث الناس بالرؤية ولم تثبت أو شهد بها من رُدت شهادته، وأنه يجوز لمن عليه صوم كفارة اليمين صومه بهذه النية كما فصّل الجواب."
  en: "A questioner asked about fasting the day of doubt intending the expiation of an oath. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22480) answered that the day of doubt is the thirtieth of Sha'ban when people report a sighting that is not confirmed, or a witness whose testimony is rejected; one who owes an oath-expiation fast may fast it with that intention, as the answer details."
  ur: "ایک سائل نے شک کے دن کفارۂ یمین کی نیت سے روزہ رکھنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22480)⁩ نے جواب دیا کہ شک کا دن شعبان کی تیسویں ہے جب لوگ چند دیکھنے کا کہیں مگر ثابت نہ ہو یا ایسے شخص کی گواہی ہو جس کی شہادت رد ہو؛ جس پر کفارۂ یمین کا روزہ ہو وہ اس نیت سے رکھ سکتا ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de ayunar el día de la duda con la intención de expiar un juramento. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22480) respondió que el día de la duda es el trigésimo de Sha'ban, cuando la gente informa de un avistamiento que no se confirma o de un testigo cuyo testimonio es rechazado; quien deba un ayuno para expiar un juramento puede ayunar con esa intención, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant le jeûne du jour du doute en vue de l'expiation d'un serment. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22480) a répondu que le jour du doute est le trentième jour de Sha'ban, lorsque des personnes rapportent une observation non confirmée ou un témoin dont le témoignage est rejeté; celui qui doit observer un jeûne d'expiation d'un serment peut le faire dans cette intention, comme le précise la réponse."
