label: { ar: "هداية أولي البصائر والأبصار إلى معرفة أجزاء الليل والنهار ⁦(السجاعي)⁩", en: "Hidayat uli al-basa'ir wal-absar (al-Suja'i)", ur: "ہدایۃ اولی البصائر والابصار ⁦(السجاعی)⁩", es: "Hidayat uli al-basa'ir wal-absar (al-Suja'i)", fr: "Hidayat uli al-basa'ir wal-absar (al-Suja'i)", tr: "Gece ile gündüzün (Al-Saja'i) parçalarını bilme konusunda içgörü ve içgörü sahibi olanlar için rehberlik", id: "Panduan bagi mereka yang memiliki wawasan dan wawasan untuk mengetahui bagian siang dan malam (Al-Saja'i)" }
summary:
  ar: "شرح لأحمد السجاعي على منظومة في المواقيت نظمها الشيخ عياد لتلميذ ضرير يسهل عليه حفظها، في الكبيسة وفصول السنة والبروج ومنازل القمر وطول الليل والنهار والقبلة {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}."
  en: "Commentary by Ahmad al-Suja'i on a didactic poem on timekeeping composed by Shaykh Ayyad for a blind pupil to memorise, covering leap years, seasons, the zodiac, lunar mansions, the length of night and day and the qibla {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}."
  ur: "احمد السجاعی کی شرح اس منظومے پر جو شیخ عیاد نے ایک نابینا شاگرد کے یاد کرنے کے لیے اوقات پر لکھا، جس میں کبیسہ، موسم، بروج، منازلِ قمر، دن رات کی طوالت اور قبلہ ہیں {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}۔"
  es: "Comentario de Ahmad al-Suja'i sobre un poema didáctico sobre la medición del tiempo compuesto por Shaykh Ayyad para que un alumno ciego lo memorizara, que abarca los años bisiestos, las estaciones, el zodíaco, las mansiones lunares, la duración de la noche y el día y la qibla {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}."
  fr: "Commentaire d'Ahmad al-Suja'i sur un poème didactique sur la mesure du temps composé par Shaykh Ayyad pour qu'un élève aveugle le mémorise, couvrant les années bissextiles, les saisons, le zodiaque, les demeures lunaires, la durée de la nuit et du jour et la qibla {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}."
  tr: "Ahmad Al-Saja'i'nin, artık yıllarda burçları, ay evrelerini, gece ve gündüz uzunluğunu ve Kıble'yi kolayca ezberleyebilen görme engelli bir öğrenci için Miqat üzerine yazdığı bir şiir üzerine Ahmad Al-Saja'i {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 35}."
  id: "Komentar oleh Ahmad Al-Saja'i atas puisi Miqat yang disusun oleh Sheikh Iyad untuk seorang murid tunanetra yang dengan mudah menghafal, pada tahun kabisat, zodiak, fase bulan, panjang siang dan malam, serta Qibla {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 hlm. 35}."
