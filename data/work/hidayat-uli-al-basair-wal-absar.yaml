summary:
  ar: "شرح لأحمد السجاعي على منظومة في المواقيت نظمها الشيخ عياد لتلميذ ضرير يسهل عليه حفظها، في الكبيسة وفصول السنة والبروج ومنازل القمر وطول الليل والنهار والقبلة {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}."
  en: "Commentary by Ahmad al-Suja'i on a didactic poem on timekeeping composed by Shaykh Ayyad for a blind pupil to memorise, covering leap years, seasons, the zodiac, lunar mansions, the length of night and day and the qibla {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}."
  ur: "احمد السجاعی کی شرح اس منظومے پر جو شیخ عیاد نے ایک نابینا شاگرد کے یاد کرنے کے لیے اوقات پر لکھا، جس میں کبیسہ، موسم، بروج، منازلِ قمر، دن رات کی طوالت اور قبلہ ہیں {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 35}۔"
