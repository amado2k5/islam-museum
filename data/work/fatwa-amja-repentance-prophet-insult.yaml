id: work/fatwa-amja-repentance-prophet-insult
class: work
kind: fatwa
label: { ar: "توبة من سب الرسول", en: "Repentance of one who insulted the Messenger", ur: "رسول کی توہین کرنے والے کی توبہ", es: "Arrepentimiento de quien insultó al Mensajero", fr: "Repentir de celui qui a insulté le Messager" }
summary:
  ar: "سأل سائل عن صور الردة ومنها سب الرسول وهل تقبل توبة من فعله. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77506 بتاريخ 21 يناير 2009)⁩ أن الأصل أن التوبة الصادقة تجب ما قبلها وأنه لا يعظم ذنب على التوبة قال تعالى قل للذين كفروا إن ينتهوا يغفر لهم ما قد سلف، وأما سب النبي فالمقصود عند من قال بعدم قبول توبته أن التوبة لا تسقط عنه عقوبة السب لأن صاحب الحق ليس موجودًا حتى يتنازل عن حقه وليست الأمة مفوضة في ذلك، ونصحه فيما يأتيه من وساوس أن يستعيذ بالله ولا يسترسل معها وأنه أبعد الناس عن السب وأنه ممن يوقرون رسول الله وتمتلئ قلوبهم بمحبته."
  en: "A questioner listed the forms of apostasy scholars record — insulting God or the Messenger among them — and asked whether such repentance is accepted. Dr. Salah al-Sawi (fatwa no. 77506, 21 January 2009) answered that the rule is sincere repentance wipes what came before — no sin outweighs repentance; 'tell those who disbelieve: if they desist, what is past is forgiven'. For those denying the insulter's repentance, the point is that repentance does not lift the insult's penalty, its right-holder not present to forgo it and the ummah not commissioned in it; he counselled the questioner over the whispers reaching him to seek refuge in God, not indulge them — he is furthest from insulting, among those who venerate the Messenger with hearts full of his love. Recorded as AMJA's answer."
  ur: "ایک سائل نے رسول کی توہین کرنے والے کی توبہ پوچھی۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77506، 21 جنوری 2009)⁩ کے مطابق مخلص توبہ ماضی کو مٹا دیتی ہے؛ بعض علماء کے نزدیک سزا اس لیے نہیں گرتا کہ حق کا مالک موجود نہیں۔"
  es: "Un consultante enumeró las formas de apostasía que registran los eruditos —entre ellas, insultar a Dios o al Mensajero— y preguntó si se acepta tal arrepentimiento. El Dr. Salah al-Sawi (fatwa n.° 77506, 21 de enero de 2009) respondió que la regla es que el arrepentimiento sincero borra lo anterior; ningún pecado supera el arrepentimiento; «diles a los incrédulos: si desisten, lo pasado les será perdonado». Para quienes niegan el arrepentimiento del insultador, el punto es que el arrepentimiento no elimina la pena del insulto, ya que quien tiene derecho a él no está presente para renunciar a ella y la ummah no está obligada a ello; aconsejó al consultante sobre los susurros que le llegaban que buscara refugio en Dios, que no les diera cabida; él es quien está más alejado de insultar, entre quienes veneran al Mensajero con corazones llenos de su amor. Registrado como respuesta de AMJA."
  fr: "Un interrogateur a énuméré les formes d'apostasie recensées par les savants – parmi lesquelles l'insulte à Dieu ou au Messager – et a demandé si un tel repentir était acceptable. Le Dr Salah al-Sawi (fatwa n° 77506, 21 janvier 2009) a répondu que la règle est que le repentir sincère efface le passé – aucun péché ne surpasse le repentir; « Dis à ceux qui ne croient pas: s'ils cessent, le passé est pardonné ». Pour ceux qui nient le repentir de l'insulteur, il convient de préciser que le repentir n'annule pas la peine de l'insulte, que le détenteur du droit n'est pas présent pour y renoncer et que la communauté n'est pas habilitée à la condamner; il a conseillé à l'interrogateur, face aux murmures qui lui parvenaient, de chercher refuge auprès de Dieu et de ne pas y prêter attention – il est le plus éloigné de l'insulte parmi ceux qui vénèrent le Messager d'un cœur empli d'amour pour lui. Réponse rapportée par AMJA."
