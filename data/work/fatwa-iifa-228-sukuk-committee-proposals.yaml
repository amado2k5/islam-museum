label: { ar: "قرار مجمع الفقه الإسلامي الدولي 228 (23/12) بشأن اقتراحات اللجنة التي شكلتها أمانة المجمع لبحث بعض قضايا الصكوك", en: "IIFA resolution 228 (23/12) on the proposals of the committee formed by the Academy's secretariat to examine certain sukuk questions", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 228 (23/12): صکوک کے بعض مسائل کے مطالعے کے لیے اکیڈمی کی سیکریٹریٹ کی قائم کردہ کمیٹی کی تجاویز", es: "Resolución 228 (23/12) de la IIFA sobre las propuestas del comité formado por la secretaría de la Academia para examinar ciertas cuestiones relativas a los sukuk.", fr: "Résolution 228 (23/12) de l'IIFA relative aux propositions du comité constitué par le secrétariat de l'Académie pour examiner certaines questions relatives aux sukuk", tr: "Uluslararası İslami Fiqh Akademisi Kararı 228 (23/12), Akademi Sekreterliği tarafından belirli sukuk konularını görüşmek üzere kurulan komitenin önerilerine ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 228 (23/12) mengenai usulan komite yang dibentuk oleh Sekretariat Akademi untuk membahas beberapa isu sukuk" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩، بعد عرض محضر اجتماع اللجنة العلمية المشكلة ⁦(9 ربيع الأول 1438هـ، 8 ديسمبر 2016م)⁩ لبحث الملاحظات الواردة على بعض قرارات الصكوك. قرر المجمع عقد ندوة علمية يستكتب فيها مختصون لبحث مسألتين تخرج بتوصيات تعرض على المجلس في الدورة التالية: الأولى هل إجارة الأصل على بائعه يعد من بيوع العينة المحرمة شرعًا كما ورد في قرار المجمع 188 ⁦(20/3)⁩؛ والثانية مدى إمكانية التعهد بإطفاء الصكوك في الإجارة المنتهية بالتمليك بقيمتها الاسمية بناء على تراضي مُصدر الصكوك والمستفيد عند الإصدار كما ورد في قرار المجمع 178 ⁦(19/4)⁩."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), after presenting to the council the minutes of the committee formed by the Academy's secretariat (meeting of 9 Rabi' I 1438, 8 December 2016) to examine objections raised against some of its sukuk resolutions. It decided to hold a scholarly seminar, for which specialists would be commissioned to research two questions and produce recommendations for the next session: first, whether leasing an asset back to its seller counts among the forbidden 'ina sales as stated in resolution 188 (20/3); and second, the extent to which it is possible to undertake to redeem the sukuk of a lease ending in ownership at their nominal value, given that the issuer and the beneficiary so agreed at issuance, as stated in resolution 178 (19/4)."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں، صکوک کی بعض قراردادوں پر اٹھائی گئی آبجیکشنز کے مطالعے کے لیے اکیڈمی کی سیکریٹریٹ کی قائم کردہ کمیٹی کے اجلاس ⁦(9 ربیع الاول 1438ھ، 8 دسمبر 2016ء)⁩ کی روداد پیش ہونے کے بعد۔ اس نے فیصلہ کیا کہ ایک علمی ندوات ہو جس میں ماہرین سے دو مسائل پر تحقیق کرائی جائے اور اگلی مجلس میں سفارشات پیش ہوں: پہلا، کیا اثاثے کو اس کے بیچنے والے کو واپس اجارے پر دینا شرعاً ممنوع عینہ کی بیعوں میں شمار ہوتا ہے جیسا کہ قرارداد 188 ⁦(20/3)⁩ میں آیا؛ دوسرا، تملیک پر ختم ہونے والے اجارے کے صکوک کو اصلی قدر پر ختم کرنے کا وعدہ کس حد تک ممکن ہے، اس بنا پر کہ جاری کنندہ اور مستفید نے اجراء کے وقت اس پر رضامندی دی تھی جیسا کہ قرارداد 178 ⁦(19/4)⁩ میں آیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018), después de presentar al consejo las actas del comité formado por la secretaría de la Academia (reunión del 9 de Rabi' I de 1438, 8 de diciembre de 2016) para examinar las objeciones planteadas contra algunas de sus resoluciones sobre sukuk. Decidió celebrar un seminario académico, para el cual se encargaría a especialistas que investigaran dos cuestiones y elaboraran recomendaciones para la próxima sesión: primero, si el arrendamiento de un activo a su vendedor se considera una de las ventas prohibidas 'ina, como se establece en la resolución 188 (20/3); y segundo, hasta qué punto es posible comprometerse a redimir los sukuk de un arrendamiento que termina en propiedad a su valor nominal, dado que el emisor y el beneficiario así lo acordaron en el momento de la emisión, como se establece en la resolución 178 (19/4)."
  fr: "Lors de sa 23e session à Médine (19-23 Safar 1440, 28 octobre – 1er novembre 2018), l'Académie internationale de jurisprudence islamique (Fiqh) a adopté une résolution collective après avoir présenté au Conseil le procès-verbal de la réunion du comité constitué par son secrétariat (9 Rabi' I 1438, 8 décembre 2016) pour examiner les objections soulevées contre certaines de ses résolutions relatives aux sukuk. Elle a décidé d'organiser un séminaire d'études, auquel des spécialistes seraient chargés d'étudier deux questions et de formuler des recommandations pour la session suivante: premièrement, la question de savoir si la reprise d'un bien par location-vente compte parmi les ventes 'ina interdites, telles que définies dans la résolution 188 (20/3); deuxièmement, la question de savoir dans quelle mesure il est possible de racheter les sukuk d'un contrat de location aboutissant à la propriété à leur valeur nominale, étant donné que l'émetteur et le bénéficiaire en ont convenu lors de l'émission, comme indiqué dans la résolution 178 (19/4)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Safar 1440 H, 28 Ekim – 1 Kasım 2018) toplu kararı, bazı sukuk kararlarına ilişkin gözlemlerin tartışılması amacıyla oluşturulan Bilimsel Komite toplantısının tutanaklarını sunduktan sonra (9 Rabi'al-Awwal 1438 H, 8 Aralık 2016 M.S. Akademi, bir sonraki oturumda Konsey'e sunulacak önerilerden doğan iki konuyu tartışmak üzere uzmanların katılacağı bilimsel bir seminer düzenlemeye karar verdi: Birincisi, orijinal mülkün satıcıya kiralanmasının, Akademi'nin 188 (20/3) sayılı Kararında belirtildiği gibi, Şeriat'a göre yasaklanmış bir numune satışı olarak kabul edilip edilmediği; ikincisi ise, Akademi'nin 178 (19/4) sayılı Kararında belirtildiği gibi, mülkiyet ile sona eren kira sözleşmelerindeki tapuların, ihraç anında ihraççı ve lehtarın anlaşmasına dayanarak nominal değerlerinde iade edilmesinin mümkün olup olmadığı."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Safar 1440 H, 28 Oktober – 1 November 2018 M), setelah mempresentasikan risalah rapat Komite Ilmiah yang dibentuk (9 Rabi' al-Awwal 1438 H, 8 Desember 2016 M) untuk membahas pengamatan yang diterima atas beberapa keputusan sukuk. Akademi memutuskan untuk mengadakan seminar ilmiah di mana para ahli akan direkrut untuk membahas dua isu yang dihasilkan dari rekomendasi yang akan disampaikan kepada Dewan pada sesi berikutnya: Pertama, apakah menyewakan properti asli kepada penjualnya dianggap sebagai penjualan sampel yang dilarang menurut Syariah, sebagaimana dinyatakan dalam Keputusan Akademi 188 (20/3); dan kedua, sejauh mana memungkinkan untuk menebus akta sewa yang berakhir dengan kepemilikan pada nilai nominalnya, berdasarkan persetujuan penerbit dan penerima manfaat pada saat penerbitan, sebagaimana dinyatakan dalam Keputusan Akademi 178 (19/4)."
