label: { ar: "حكم تعدد الأضحية", en: "Multiple udhiyyas in one household", ur: "ایک گھر میں متعدد قربانیاں" }
summary:
  ar: "سائل سأل عن تعدد الأضحية في حق أهل البيت الواحد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20773)⁩ أن تعدد الأضحية في حق أهل البيت الواحد أمر مشروع حسن بأن يضحي كل واحد من أفراد البيت عن نفسه على ما فصّل الجواب."
  en: "A questioner asked about multiple udhiyyas for the members of one household. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20773) answered that multiplicity is lawful and good — each member sacrificing for himself — as the answer details."
  ur: "ایک سائل نے ایک گھر کے افراد کی طرف سے متعدد قربانیوں کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20773)⁩ نے جواب دیا کہ ہر فرد کی اپنی قربانی جائز اور اچھی بات ہے — جیسا کہ جواب میں تفصیل ہے۔"
