label: { ar: "قرار مجمع الفقه الإسلامي الدولي 144 (16/2) بشأن اختلافات الزوج والزوجة الموظفة", en: "IIFA resolution 144 (16/2) on the respective rights of the husband and the employed wife", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 144 (16/2): شوہر اور ملازمتہ بیوی کے متعلقہ اختلافات", es: "Resolución 144 (16/2) de la IIFA sobre los derechos respectivos del marido y la mujer empleada.", fr: "Résolution 144 (16/2) de l'IIFA relative aux droits respectifs du mari et de l'épouse salariée", tr: "Uluslararası İslami Fiqh Akademisi Kararı 144 (16/2) istihdam edilen karı-koca arasındaki farklılıklara ilişkin", id: "Resolusi Akademi Fiqh Islam Internasional 144 (16/2) mengenai perbedaan antara suami dan istri yang bekerja" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة عشرة بدبي ⁦(30 صفر – 5 ربيع الأول 1426هـ، 9–14 أبريل 2005م)⁩. قرر: انفصال الذمة المالية بين الزوجين — للزوجة أهلية كاملة وذمة مالية مستقلة وحق مطلق في إطار الشرع بما تكسب من عملها ولها ثرواتها الخاصة وحق التملك والتصرف ولا سلطان للزوج على مالها ولا تحتاج إذنه؛ النفقة الزوجية كاملة مستحقة بالمعروف بحسب سعة الزوج والأعراف الصحيحة ولا تسقط إلا بالنشوز؛ وفي عمل الزوجة خارج البيت نصّ على مسؤولياتها الأسرية ثم عالج شروط مشروعية عملها وضوابطه وما يترتب عليه في النفقة والسكن وأجرة الخدمة وحضانة الأطفال وفق المنظور الذي تبناه."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 16th session in Dubai (30 Safar – 5 Rabi al-Awwal 1426, 9–14 April 2005). It ruled: the spouses' financial personalities are separate — the wife has full capacity and an independent estate, absolute right within the law over her earnings and private wealth, rights to own and dispose, no marital authority over her money and no need of his permission; maintenance is fully due according to custom and the husband's means, lapsing only on nushuz; and on the wife's work outside the home, after affirming her household responsibilities in its text, it treated the conditions for the legitimacy of her employment and what follows for maintenance, housing, domestic wages and child custody within the frame it adopted."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دبئی میں سولہویں مجلس ⁦(30 صفر – 5 ربیع الاول 1426ھ، 9–14 اپریل 2005ء)⁩ میں۔ فیصلے: میاں بیوی کی مالی شخصیت الگ ہے — بیوی کو مکمل اہلیت، آزاد مالی ذات، اپنی کمائی اور نجی دولت پر شرعی دائرے میں مکمل حق، تملک و تصرف کا حق، شوہر کا اس کے مال پر کوئی اختیار نہیں اور نہ اس کی اجازت درکار؛ نان نفقہ معروف اور شوہر کی استطاعت کے مطابق پورا واجب، صرف نشوز پر ساقط؛ اور بیوی کے گھر سے باہر کام کے بارے میں، متن میں اس کی گھریلو ذمہ داریوں کی تصدیق کے بعد، اس کی ملازمت کی شرعیت کی شرائط اور نفقہ، رہائش، گھریلو اجرت اور حضانت پر اثرات اس کے اپنائے گئے فریم میں بیان ہوئے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 16.ª sesión en Dubái (30 Safar – 5 Rabi al-Awwal 1426, 9–14 de abril de 2005). En ella se dictaminó: las personalidades financieras de los cónyuges son independientes: la esposa tiene plena capacidad y patrimonio independiente, derecho absoluto dentro de la ley sobre sus ingresos y patrimonio privado, derecho a poseer y disponer, sin autoridad marital sobre su dinero y sin necesidad del permiso del marido; la manutención es totalmente debida según la costumbre y los recursos del marido, y solo cesa en caso de nushuz; y sobre el trabajo de la esposa fuera del hogar, después de afirmar sus responsabilidades domésticas en su texto, trató las condiciones para la legitimidad de su empleo y lo que sigue en materia de manutención, vivienda, salario doméstico y custodia de los hijos dentro del marco que adoptó."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 16e session à Dubaï (30 Safar – 5 Rabi al-Awwal 1426, 9-14 avril 2005) a statué que les personnalités financières des époux sont distinctes: l'épouse jouit de la pleine capacité juridique et d'un patrimoine indépendant, ainsi que de droits absolus sur ses revenus et ses biens privés, de droits de propriété et de disposition, sans autorité matrimoniale sur ses finances et sans nécessité d'autorisation de son époux; la pension alimentaire est due intégralement selon la coutume et les ressources de l'époux, et ne cesse qu'en cas de rupture du contrat de mariage (nushuz); et concernant le travail de l'épouse hors du foyer, après avoir réaffirmé ses responsabilités domestiques, la résolution a traité des conditions de légitimité de son emploi et des conséquences qui en découlent en matière de pension alimentaire, de logement, de rémunération du personnel de maison et de garde des enfants."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Dubai'deki on altıncı oturumunda (30 Safar – 5 Rabi'al-Awwal 1426 H, 9–14 Nisan 2005) toplu kararı. Kararlaştırıldı: Eşler arasında mali sorumluluğun ayrılması — eş, tam yasal ehliye, bağımsız mali sorumluluğa ve Şeriat çerçevesinde iş kazancına, kendi servetine, mülkiyetine sahip olma ve tasarruf etme hakkına dayanan mutlak haklara sahiptir; kocanın, izni olmadan mülk üzerinde yetkisi yoktur; tam nafaka kocanın kapasitesine ve doğru geleneklere göre ödenir ve sadece itaatsizlik nedeniyle feragat edilir; eşin ev dışındaki çalışmaları ile ilgili aile sorumlulukları açıkça belirtilir, ardından işinin meşruiyeti koşulları, düzenlemeleri ve nafaka, konut, hizmet ücretleri ve çocuk velayeti konuları benimsenen perspektife göre ele alınır."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi keenam belas di Dubai (30 Safar – 5 Rabi' al-Awwal 1426 H, 9–14 April 2005). Diputuskan: Pemisahan tanggung jawab keuangan antara pasangan — istri memiliki kapasitas hukum penuh, tanggung jawab keuangan mandiri, dan hak mutlak dalam kerangka Syariah berdasarkan penghasilan kerja, kekayaan sendiri, hak untuk memiliki dan mengelola hartanya, dan suami tidak memiliki otoritas atas harta benda tanpa izin; tunjangan pernikahan penuh harus dibayar sesuai dengan kapasitas dan adat yang benar suami, dan hanya dibebaskan jika tidak taat; terkait pekerjaan istri di luar rumah, tanggung jawab keluarganya dinyatakan secara eksplisit, maka syarat legitimasi pekerjaannya, peraturannya, dan masalah terkait tunjangan, perumahan, upah jasa, dan hak asuh anak ditangani sesuai dengan perspektif yang diambil."
