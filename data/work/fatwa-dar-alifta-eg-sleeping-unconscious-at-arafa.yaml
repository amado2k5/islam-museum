label: { ar: "حكم وقوف النائم والمغمى عليه بعرفة", en: "The presence of the sleeping and the unconscious at 'Arafa", ur: "عرفہ میں سوئے ہوئے اور بے ہوش شخص کا وقوف", es: "La presencia de los dormidos y los inconscientes en 'Arafa", fr: "La présence des endormis et des inconscients à 'Arafa", tr: "Arafah'ta uyuyan ve baygın durumuna ilişkin karar", id: "Putusan tentang posisi orang tidur dan orang tak sadarkan diri di Arafah" }
summary:
  ar: "سائل سأل عن وقوف النائم والمغمى عليه بعرفة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21922)⁩ أن الوقوف بعرفة ركن الحج الأعظم ويحصل بحضور الحاج بأي جزء من أجزاء عرفة في وقته المشروع سواء كان مفيقًا أو نائمًا أو مغمى عليه على ما فصّل الجواب."
  en: "A questioner asked about the sleeping and the unconscious standing at 'Arafa. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21922) answered that the standing at 'Arafa — Hajj's greatest pillar — is achieved by the pilgrim's presence in any part of 'Arafa within its appointed time, whether awake, asleep or unconscious — as the answer details."
  ur: "ایک سائل نے سوئے ہوئے اور بے ہوش شخص کے عرفہ میں وقوف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21922)⁩ نے جواب دیا کہ عرفہ کا وقوف حج کا سب سے بڑا رکن ہے اور وہ حاجی کے مقررہ وقت میں عرفہ کے کسی بھی حصے میں موجود ہونے سے حاصل ہو جاتا ہے — خواہ جاگتا ہو، سویا ہو یا بے ہوش — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la permanencia en Arafa estando dormido o inconsciente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21922) respondió que la permanencia en Arafa —el pilar más importante del Hajj— se logra con la presencia del peregrino en cualquier parte de Arafa dentro del tiempo establecido, ya sea despierto, dormido o inconsciente, como se detalla en la respuesta."
  fr: "Un pèlerin a posé une question concernant le fait de se tenir debout, endormi ou inconscient, à Arafa. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21922) a répondu que le fait de se tenir debout à Arafa — le plus grand pilier du Hajj — est accompli par la présence du pèlerin dans n'importe quelle partie d'Arafa pendant le temps imparti, qu'il soit éveillé, endormi ou inconscient — comme le détaille la réponse."
  tr: "Bir soru soran, bayılan uyuyan bir kişi için Arafah'ta durmayı sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21922), Arafah'ta durmanın Hac'ın en büyük direği olduğunu ve hacının Arafah'ın herhangi bir yerinde, uyanık, uykuda veya baygın olsun, yanıtta detaylandırıldığı gibi gerçekleştiğini yanıtladı."
  id: "Seorang penanya menanyakan tentang berdiri di Arafah untuk orang yang sedang tidur dan pingsan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21922) menjawab bahwa berdiri di Arafah adalah pilar terbesar Haji dan terjadi di hadapan jamaah di bagian mana pun Arafah pada waktu yang ditentukan, baik terjaga, tidur, maupun tidak sadar, seperti yang dijelaskan dalam jawaban."
