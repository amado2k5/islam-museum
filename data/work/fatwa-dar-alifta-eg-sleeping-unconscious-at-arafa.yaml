label: { ar: "حكم وقوف النائم والمغمى عليه بعرفة", en: "The presence of the sleeping and the unconscious at 'Arafa", ur: "عرفہ میں سوئے ہوئے اور بے ہوش شخص کا وقوف" }
summary:
  ar: "سائل سأل عن وقوف النائم والمغمى عليه بعرفة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21922)⁩ أن الوقوف بعرفة ركن الحج الأعظم ويحصل بحضور الحاج بأي جزء من أجزاء عرفة في وقته المشروع سواء كان مفيقًا أو نائمًا أو مغمى عليه على ما فصّل الجواب."
  en: "A questioner asked about the sleeping and the unconscious standing at 'Arafa. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21922) answered that the standing at 'Arafa — Hajj's greatest pillar — is achieved by the pilgrim's presence in any part of 'Arafa within its appointed time, whether awake, asleep or unconscious — as the answer details."
  ur: "ایک سائل نے سوئے ہوئے اور بے ہوش شخص کے عرفہ میں وقوف کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21922)⁩ نے جواب دیا کہ عرفہ کا وقوف حج کا سب سے بڑا رکن ہے اور وہ حاجی کے مقررہ وقت میں عرفہ کے کسی بھی حصے میں موجود ہونے سے حاصل ہو جاتا ہے — خواہ جاگتا ہو، سویا ہو یا بے ہوش — جیسا کہ جواب میں تفصیل ہے۔"
