summary:
  ar: "القسطاس المستقيم في علم العروض، كتاب في العروض والقوافي لمؤلفه الزمخشري، وتاريخه بحسب ملخص بحثي قُدّم إلى المتحف: ت 538هـ / 1144م {cite:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}. وجواب الملخص عن وجوده في المكتبة الشاملة: لا، فقد ذكر الملف أن البحث في موقع shamela.ws لم يعثر على مطابقة . لم يقرأ المتحف الكتاب."
  en: "al-Qistas al-Mustaqim fi Ilm al-Arud, a book on prosody (arud and qawafi) by al-Zamakhshari; its date in a research summary supplied to the museum is d. 538 AH / 1144 CE {cite:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}. The summary's answer on its presence in the Shamela library: No: the file reports that a search of shamela.ws returned no match . The museum has not read the book."
  ur: "القسطاس المستقيم في علم العروض، عروض و قوافی پر ایک کتاب، مصنف الزمخشري؛ میوزیم کو دیے گئے تحقیقی خلاصے میں اس کی تاریخ: وفات 538ھ / 1144ء {cite:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}۔ شاملہ میں موجودگی پر خلاصے کا جواب: نہیں؛ فائل کے مطابق shamela.ws میں تلاش سے کوئی مطابق اندراج نہیں ملا ۔ میوزیم نے یہ کتاب نہیں پڑھی۔"
  fr: "al-Qistas al-Mustaqim fi Ilm al-Arud, livre sur la prosodie (arud et qawafi) de al-Zamakhshari ; sa date dans une synthèse de recherche remise au musée : m. 538 H / 1144 {cite:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}. Réponse de la synthèse sur sa présence dans la bibliothèque Shamela : Non : le fichier signale qu'une recherche sur shamela.ws n'a donné aucune correspondance . Le musée n'a pas lu le livre."
  es: "al-Qistas al-Mustaqim fi Ilm al-Arud, libro sobre prosodia (arud y qawafi) de al-Zamakhshari; su fecha en un resumen de investigación entregado al museo: m. 538 H. / 1144 {cite:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}. Respuesta del resumen sobre su presencia en la biblioteca Shamela: No: el archivo indica que una búsqueda en shamela.ws no dio ninguna coincidencia . El museo no ha leído el libro."
  tr: "Al-Qistas al-Mustaqim fi 'Ilm al-'Urud, yazarı Al-Zamakhshari'nin prosodi ve kafiyeler üzerine bir kitap ve müzeye sunulan araştırma özetine göre tarihi: ö. 538 Hicri / 1144 M.S. {kaynak:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}. Özetin Kapsamlı Kütüphane'deki varlığı hakkındaki yanıtı: Hayır, dosyada shamela.ws web sitesindeki aramada eşleşme bulunamadığı belirtilmişti. Müze kitabı okumadı."
  id: "Al-Qistas al-Mustaqim fi 'Ilm al-'Urud, sebuah buku tentang prosodi dan rima karya penulisnya Al-Zamakhshari, dan sejarahnya menurut ringkasan penelitian yang diserahkan ke museum: wafat 538 AH / 1144 M {cite:qaf-al-qistas-al-mustaqim-fi-ilm-al-arud}. Jawaban ringkasan tentang keberadaannya di Perpustakaan Komprehensif: Tidak, berkas menyatakan bahwa pencarian di situs web shamela.ws tidak menemukan kecocokan. Museum tidak membaca buku tersebut."
