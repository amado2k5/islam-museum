label: { ar: "أكل لحم الإبل والوضوء", en: "Camel meat and the wudu — an ijtihad question", ur: "اونٹ کا گوشت اور وضو", es: "Carne de camello y el wudu: una cuestión de ijtihad", fr: "La viande de chameau et les ablutions (wudu) — une question d'ijtihad" }
summary:
  ar: "سأل سائل عن القول الفصل في أكل لحوم الإبل هل ينقض الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 3206 بتاريخ 10 يوليو 2007)⁩ أن هذه من مسائل الاجتهاد التي يسع فيها الخلاف ومذهب الجمهور أن أكل لحم الإبل لا ينقض الوضوء وذهب الحنابلة والشافعي في القديم إلى النقض ووجوب الوضوء واختاره ابن خزيمة وابن باز على ما فصّل الجواب."
  en: "A questioner asked the decisive word on eating camel meat — does it break the wudu? Dr. Salah al-Sawi (fatwa no. 3206, 10 July 2007) answered that this is among the ijtihad questions admitting difference: the majority's madhhab holds camel meat does not break the wudu; the Hanbalis, and the Shafi'is in the old position, held it breaks it and wudu is required — chosen also by Ibn Khuzayma and Ibn Baz — as the answer details."
  ur: "اونٹ گوشت سے وضو ٹوٹتا ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 3206، 10 جولائی 2007)⁩ کے مطابق جمہور نہیں مانتے؛ حنابلیہ اور ابن باز ٹوٹنا مانتے ہیں۔"
  es: "Un consultante preguntó sobre la cuestión decisiva del consumo de carne de camello: ¿rompe la ablución (wudu)? El Dr. Salah al-Sawi (fatwa n.º 3206, 10 de julio de 2007) respondió que esta es una de las cuestiones de ijtihad que admiten diferencias: la escuela jurídica mayoritaria sostiene que la carne de camello no rompe la ablución; los hanbalíes, y los shafiíes en la postura antigua, sostenían que sí la rompe y que la ablución es necesaria —opción elegida también por Ibn Khuzayma e Ibn Baz— como se detalla en la respuesta."
  fr: "Un internaute a posé la question cruciale concernant la consommation de viande de chameau: invalide-t-elle les ablutions (wudu) ? Le Dr Salah al-Sawi (fatwa n° 3206, 10 juillet 2007) a répondu que cette question fait partie des questions d’ijtihad admettant des divergences: l’école majoritaire considère que la viande de chameau n’invalide pas les ablutions; les Hanbalites, et les Shafi’ites dans leur ancienne position, considèrent qu’elle les invalide et que les ablutions sont requises – position également adoptée par Ibn Khuzayma et Ibn Baz – comme le précise la réponse."
