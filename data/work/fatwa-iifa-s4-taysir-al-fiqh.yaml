label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مشروع تيسير الفقه", en: "IIFA resolution on the Facilitating Fiqh project", ur: "اکیڈمی کی قرارداد: تیسیر فقہ منصوبہ", es: "Resolución de la IIFA sobre el proyecto Facilitating Fiqh", fr: "Résolution de l'IIFA sur le projet de facilitation du Fiqh", tr: "Uluslararası İslami Fıkıh Akademisi'nin Taysr al-Fiqh projesi ile ilgili kararı", id: "Keputusan Akademi Fiqh Islam Internasional terkait proyek Taysr al-Fiqh" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: اعتماد الخطة الواردة في تقرير اللجنة المشرفة على مشروع تيسير الفقه وفق التعديل المقترح وتكليف الأمانة العامة متابعة تنفيذه."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on the Facilitating Fiqh project: it adopted the plan in the supervising committee's report with the proposed amendment and tasked the secretariat with following up its implementation."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: تیسیر فقہ منصوبے کا لائحہ عمل منظور اور نگرانی کمیٹی کی رپورٹ کے مطابق نفاذ کا حکم۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre el proyecto de Facilitación del Fiqh: adoptó el plan del informe del comité supervisor con la enmienda propuesta y encargó a la secretaría el seguimiento de su implementación."
  fr: "Résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur le projet de facilitation du Fiqh: elle a adopté le plan figurant dans le rapport du comité de supervision avec l'amendement proposé et a chargé le secrétariat d'en assurer le suivi."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dördüncü oturumunda (Cidde, Şubat 1988) kararı: Projeyi denetleyen komitenin raporunda yer alan planın kabul edilmesi, önerilen değişikliğe göre içtihadı kolaylaştırmak ve Genel Sekreterliğin uygulanmasının takibini yapmak üzere atanması."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi keempatnya (Jeddah, Februari 1988): Adopsi rencana yang tercantum dalam laporan komite yang mengawasi proyek untuk memfasilitasi yurisprudensi sesuai amandemen yang diusulkan, dan menugaskan Sekretariat Jenderal untuk menindaklanjuti pelaksanaannya."
