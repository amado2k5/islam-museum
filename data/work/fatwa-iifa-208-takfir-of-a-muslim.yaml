label: { ar: "قرار مجمع الفقه الإسلامي الدولي 208 (22/4) بشأن تكفير المسلم: أسبابه وآثاره وعلاجه", en: "IIFA resolution 208 (22/4) on declaring a Muslim an unbeliever: its causes, effects and remedy", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 208 (22/4): مسلمان کو کافر قرار دینا — اسباب، اثرات اور علاج" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثانية والعشرين بدولة الكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩، بالنظر إلى تفاقم ظاهرة الجرأة على تكفير المسلمين والتسرع في إطلاق حكم الردة على الأفراد والمجتمعات والدول والحكومات دون مراعاة أصول الشريعة ومقاصدها وقواعدها، ولخطورة الآثار المترتبة على ذلك من القتل والتدمير والتشريد. قرر المجمع: أولًا تأكيد قراره 152 ⁦(17/1)⁩ الصادر في الدورة السابعة عشرة بشأن الإسلام والأمة الواحدة والمذاهب العقدية والفقهية والتربوية، والمتضمن عدم جواز تكفير أي فئة من المسلمين تؤمن بالله ورسوله وأركان الإيمان وأركان الإسلام ولا تنكر معلومًا من الدين بالضرورة. ثانيًا تأكيد قراره 175 ⁦(19/1)⁩ بشأن الحرية الدينية في الشريعة الإسلامية أبعادها وضوابطها، والمتضمن أن الفتوى بالردة أو التكفير مردها إلى أهل العلم المعتبرين مع تولي القضاء ما اشترطه الفقهاء وإزالة الشبهات، ويحذر من خطورة نسبة التكفير إلى طائفة من طوائف المسلمين وإلصاقه بها فضلًا عن تكفير الصحابة وأمهات المؤمنين أو التقليل من مكانتهم. وأوصى باستكمال أمانة المجمع تنفيذ التوصيات السابقة الداعية لعقد ندوات ولقاءات تبحث مسألة الولاء والبراء وحديث الفرقة الناجية وما بني عليه والتكفير لعدم التطبيق الشامل لأحكام الشريعة؛ وأوصى شباب الأمة وحذرهم من ادعاءات أصحاب الفكر المنحرف وأهل الغلو ووجههم للعلم الصحيح النافع وفق منهج وسطي؛ وعلماء الأمة ودعاتها للتواصل مع الشباب والقيام بمسؤولية الدعوة والأمر بالمعروف والنهي عن المنكر وفق المنهج الوسطي؛ والحكومات والدول بتوفير الوسائل وتذليل العقبات للتواصل مع الشباب وتوجيههم من قبل علماء الأمة وقادة الفكر؛ والإفادة من التجارب الناجحة في محاورة أصحاب الفكر الضال كتجربة المناصحة في المملكة العربية السعودية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 22nd session in Kuwait (2–5 Jumada al-Akhira 1436, 22–25 March 2015), in view of the worsening boldness in declaring Muslims unbelievers and the haste to pronounce apostasy on individuals, communities, states and governments without regard for the principles, objectives and rules of the sharia, and the grave consequences of killing, destruction and displacement. It ruled: first, reaffirming its resolution 152 (17/1) from the 17th session on Islam and the single community and the creedal, juristic and educational schools, which holds it impermissible to declare unbeliever any Muslim group believing in God and His messenger and the pillars of faith and Islam that does not deny what is necessarily known of religion; second, reaffirming resolution 175 (19/1) on religious freedom in Islamic sharia — its dimensions and controls — which holds that the fatwa of apostasy or takfir belongs to the recognised scholars with the judiciary undertaking what the jurists required and removing doubts, and warns against the danger of attributing takfir to a sect of Muslims and fastening it on them, let alone declaring the Companions and Mothers of the Believers unbelievers or belittling their standing. It recommended that the secretariat complete the earlier recommendations to hold seminars on loyalty-and-disavowal, the hadith of the saved sect and what is built on it, and takfir for non-comprehensive application of the sharia's rulings; it addressed the youth of the community, warning them of the claims of deviant thought and extremism, directing them to sound useful knowledge on a middle course; scholars and callers to engage the youth and carry out the duty of enjoining right and forbidding wrong on the middle course; governments to provide means and remove obstacles to reaching the youth and guiding them through scholars and leaders of thought; and benefiting from successful experiences of dialogue with holders of straying thought, such as the counselling experience in Saudi Arabia."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دولتِ کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ میں — مسلمانوں کو کافر کہنے کی جرات کے بڑھتے رجحان اور افراد، معاشروں، ریاستوں اور حکومتوں پر ارتداد کا حکم جلدی سے جاری کرنے کے پیش نظر، بغیر شریعت کے اصول، مقاصد اور قواعد کو ملحوظ رکھے، اور اس سے پیدا ہونے والے قتل، تباہی اور بے گھری کے سنگین نتائج کے باعث۔ اکیڈمی نے فیصلہ کیا: پہلا، اپنی سترہویں مجلس کی قرارداد 152 ⁦(17/1)⁩ کی تائید جو اسلام، واحد امت اور عقیدہ، فقہ اور تربیت کے مذاہب کے بارے میں ہے اور جس میں کہا گیا کہ کسی مسلمان گروہ کو کافر کہنا جائز نہیں جو اللہ، اس کے رسول اور ارکانِ ایمان و ارکانِ اسلام پر ایمان رکھتا ہو اور دین کے بالضرورہ معلوم کو انکار نہ کرے؛ دوسرا، قرارداد 175 ⁦(19/1)⁩ کی تائید جو شریعتِ اسلامی میں مذہبی آزادی کے ابعاد و ضوابط پر ہے اور جس میں یہ حکم ہے کہ ارتداد یا تکفیر کا فتویٰ معتبر اہلِ علم پر منحصر ہے اور قضا فقہاء کی شرائط اور شبہات کے رفع کو نبھائے، اور کسی مسلم فرقے پر تکفیر کا الزام لگانے اور اسے اس سے چسپاں کرنے کے خطرے سے متنبہ کیا گیا — صحابہ اور امہات المومنین کے تکفیر یا ان کے مقام کو گھٹانے تو بڑی بات ہے۔ سفارشات: سیکرٹریٹ سابقہ سفارشات مکمل کرے اور ولاء و براء، فرقۂ ناجیہ کی حدیث اور اس پر مبنی نتائج، اور شریعت کے احکام کا مکمل اطلاق نہ کرنے پر تکفیر کے موضوعات پر سیمینارز منعقد کرے؛ امت کے نوجوانوں کو منحرف فکر اور غلو کے دعووں سے خبردار کیا اور انہیں وسطی منہج پر صحیح مفید علم کی ہدایت دی؛ علماء و دعاۃ نوجوانوں سے رابطہ کریں اور وسطی منہج پر امر بالمعروف و نہی عن المنکر کی ذمہ داری نبھائیں؛ حکومتیں نوجوانوں تک رسائی اور اہلِ علم و فکر کے رہنماؤں کے ذریعے رہنمائی کے ذرائع اور رکاوٹوں کی تسہیل کریں؛ اور ضال فکر رکھنے والوں سے مکالمے کے کامیاب تجربات سے فائدہ اٹھایا جائے جیسے سعودی عرب میں مناصحہ کا تجربہ۔"
