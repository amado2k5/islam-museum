summary:
  ar: "تهذيب اللغة لأبي منصور الأزهري، وهو أهم كتبه ومن أوثق المعاجم العربية. يبدأ بمقدمة طويلة في مصادره وفي اللغة العربية، ويذكر مؤلفه ثلاثة أسباب لتأليفه: تدوين ما سمعه وحفظه في أسره الطويل عند القرامطة، والقيام بواجب النصيحة الوارد في الحديث، وبيان ما رآه من أخطاء ونقص في الكتب السابقة، ومنها كتب الليث بن المظفر وابن دريد وابن قتيبة."
  en: "Tahdhib al-Lugha by Abu Mansur al-Azhari, his chief work and one of the most trusted Arabic dictionaries. It opens with a long preface on its sources and on the Arabic language, and the author gives three reasons for writing it: to record the language he had heard and memorised during his long captivity among the Qarmatians, to fulfil the duty of sincere advice named in the hadith, and to expose faults and gaps he saw in earlier works, among them those of al-Layth ibn al-Muzaffar, Ibn Durayd and Ibn Qutayba."
  es: "El Tahdhib al-Lugha de Abu Mansur al-Azhari, su obra principal y uno de los diccionarios árabes más fiables. Comienza con un largo prólogo sobre sus fuentes y sobre la lengua árabe, y el autor da tres razones para escribirlo: registrar la lengua que había oído y memorizado durante su largo cautiverio entre los qarmatas, cumplir el deber de consejo sincero que menciona el hadiz y señalar los errores y lagunas que veía en obras anteriores, entre ellas las de al-Layth ibn al-Muzaffar, Ibn Durayd e Ibn Qutayba."
  fr: "Le Tahdhib al-Lugha d'Abu Mansur al-Azhari, son œuvre principale et l'un des dictionnaires arabes les plus fiables. Il s'ouvre sur une longue préface consacrée à ses sources et à la langue arabe, et l'auteur donne trois raisons de l'avoir écrit : consigner la langue qu'il avait entendue et mémorisée durant sa longue captivité chez les Qarmates, accomplir le devoir de conseil sincère que mentionne le hadith, et signaler les fautes et les lacunes qu'il voyait dans les ouvrages antérieurs, notamment ceux d'al-Layth ibn al-Muzaffar, d'Ibn Durayd et d'Ibn Qutayba."
  ur: "ابو منصور ازہری کی تہذیب اللغۃ، ان کی اصل تصنیف اور عربی کی سب سے قابلِ اعتماد لغات میں سے ایک۔ یہ مآخذ اور عربی زبان پر ایک طویل مقدمے سے شروع ہوتی ہے، اور مصنف تالیف کے تین سبب بتاتا ہے: قرامطہ کی طویل قید میں سنی اور یاد کی ہوئی زبان کو قلم بند کرنا، حدیث میں مذکور خیرخواہی کا فریضہ ادا کرنا، اور پچھلی کتب میں، جن میں لیث بن مظفر، ابن درید اور ابن قتیبہ کی کتب بھی ہیں، جو غلطیاں اور کمیاں دیکھیں ان کو واضح کرنا۔"
  tr: "Ebu Mansur el-Azhari'nin Tahdhib al-Lugha adlı eseri, en önemli kitabı ve en güvenilir Arapça sözlüklerinden biridir. Kaynaklarına ve Arapçaya uzun bir girişle başlar; yazmasının üç nedenini belirtir: Karmatlılar arasında uzun süren esaretinde duyduklarını kaydetmek ve ezberlemek, hadislerde belirtilen öğüt görevini yerine getirmek ve önceki kitaplarda, özellikle el-Leys ibn Muzaffar, İbn Duraid ve İbn Kutuybah'ın eserlerinde gördüğü hata ve eksiklikleri açıklığa kavuşturmak."
  id: "Tahdhib al-Lugha karya Abu Mansur al-Azhari, yang merupakan buku terpentingnya dan salah satu kamus Arab yang paling dapat diandalkan. Ia memulai dengan pengantar panjang tentang sumber-sumbernya dan bahasa Arab, menyebutkan tiga alasan penulisannya: mencatat apa yang didengarnya dan menghafal selama masa tahanan lama di antara Qarmatian, menjalankan tugas nasihat yang disebutkan dalam hadits, serta memperjelas kesalahan dan kelalaian yang ia lihat dalam buku-buku sebelumnya, termasuk karya al-Layth ibn al-Muzaffar, Ibn Duraid, dan Ibn Qutaybah."
