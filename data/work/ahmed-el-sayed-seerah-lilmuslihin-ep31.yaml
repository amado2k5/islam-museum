class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 31: فتح مكة"
  en: "The Prophetic Biography for Reformers, episode 31: The Conquest of Mecca"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 31: فتح مکہ"
  fr: "La biographie prophétique pour les réformateurs, épisode 31 : La conquête de La Mecque"
  es: "La biografía profética para los reformadores, episodio 31: La conquista de La Meca"
summary:
  ar: "يتناول أحمد السيد سرية ذات السلاسل، ونقض بني بكر وقريش لعهد الحديبية، وكتاب حاطب بن أبي بلتعة، وخروج العشرة آلاف في رمضان من السنة الثامنة، واللقاء الليلي بأبي سفيان، ودخول مكة والعفو العام. ويستخلص دروسا للمصلحين في التثبت، وفي مراعاة سابقة الإنسان في خدمة الدين، وفي عناية النبي بالمعنويات وتواضعه."
  en: "Ahmed Elsayed covers the expedition of Dhat al-Salasil, the Bakr and Quraysh breach of the Hudaybiyya pact, the letter of Hatib ibn Abi Balta'a, the march of ten thousand in Ramadan of year 8, the night meeting with Abu Sufyan, the entry into Mecca and the general amnesty. He draws lessons for reformers on verification, weighing a person's past service, and the Prophet's care for morale and humility."
  ur: "احمد السید ذات السلاسل کی مہم، بنو بکر اور قریش کی طرف سے صلح حدیبیہ کی خلاف ورزی، حاطب بن ابی بلتعہ کے خط، آٹھویں سال رمضان میں دس ہزار کی روانگی، ابو سفیان سے رات کی ملاقات، مکہ میں داخلے اور عام معافی کا بیان کرتے ہیں۔ وہ مصلحین کے لیے تحقیق و تصدیق، کسی شخص کی دینی خدمات کے وزن اور نبی کی حوصلہ افزائی اور عاجزی کے اسباق نکالتے ہیں۔"
  fr: "Ahmed Elsayed traite de l'expédition de Dhat al-Salasil, de la rupture du pacte de Hudaybiyya par les Banu Bakr et les Quraysh, de la lettre de Hatib ibn Abi Balta'a, du départ de dix mille hommes en ramadan de l'an 8, de la rencontre nocturne avec Abu Sufyan, de l'entrée à La Mecque et de l'amnistie générale. Il en tire pour les réformateurs des leçons sur la vérification, sur le poids des services passés d'une personne et sur le soin du Prophète pour le moral et son humilité."
  es: "Ahmed Elsayed trata la expedición de Dhat al-Salasil, la ruptura del pacto de Hudaybiyya por los Banu Bakr y los Quraysh, la carta de Hatib ibn Abi Balta'a, la salida de diez mil hombres en ramadán del año 8, el encuentro nocturno con Abu Sufyan, la entrada en La Meca y la amnistía general. Extrae para los reformadores lecciones sobre la verificación, sobre el peso de los servicios pasados de una persona y sobre el cuidado del Profeta por la moral y su humildad."
