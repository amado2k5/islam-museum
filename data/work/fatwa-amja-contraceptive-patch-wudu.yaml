id: work/fatwa-amja-contraceptive-patch-wudu
class: work
kind: fatwa
label: { ar: "لصقة منع الحمل والطهارة", en: "The contraceptive patch — judged like a splint", ur: "مانع حمل پیچ — جبیرے کا حکم", es: "El parche anticonceptivo: juzgado como una férula.", fr: "Le patch contraceptif — jugé comme une attelle", tr: "Doğum kontrolü ve saflık bandı", id: "Tambalan kontrasepsi dan kemurnian" }
summary:
  ar: "سألت امرأة عن لصقة منع الحمل التي تبقى أيامًا هل تشترط لها طهارة وتعطل الغسل. أجاب د. صلاح الصاوي ⁦(فتوى رقم 86339 بتاريخ 17 يناير 2012)⁩ أن لصقة منع الحمل تأخذ حكم الجبيرة فلا يشترط أن توضع على طهارة ولا تشترط لها مدة، ولكن ينبغي أن يكون استعمالها من الأساس مشروعًا كما لو كان مرد الرغبة في تأخير الحمل إلى مصلحة شرعية معتبرة وليس إلى الخوف من العيلة كما كان عليه أهل الجاهلية الأولى ولم يكن استعمالها مضرًا بالمرأة، وقد سئلت اللجنة الدائمة للإفتاء ببلاد الحرمين في نظائرها فكان الجواب على هذا المنهج على ما فصّل."
  en: "A woman asked about the square contraceptive patch worn for days — must it be placed in purity, and does it bar washing? Dr. Salah al-Sawi (fatwa no. 86339, 17 January 2012) answered that the contraceptive patch takes the splint's ruling: it need not be placed in a state of purity and has no set duration; but its use should be lawful in the first place — as when delaying pregnancy traces to a recognized sharia interest, not to fear of poverty as the first Jahiliyya's people had, and not harmful to the woman; the Permanent Committee in the Two-Sanctuaries land answered its analogues on this method — as detailed."
  ur: "ایک خاتون نے مانع حمل پیچ کا حکم پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 86339، 17 جنوری 2012)⁩ کے مطابق پیچ جبیرے کا حکم رکھتی ہے — طہارت پر رکھنا ضروری نہیں، بشرط استعمال جائز ہو۔"
  es: "Una mujer preguntó acerca del parche anticonceptivo cuadrado que se usa durante días: ¿debe mantenerse puro y está prohibido lavarlo? El Dr. Salah al-Sawi (fatwa n.° 86339, 17 de enero de 2012) respondió que el parche anticonceptivo se rige por la misma norma que la férula: no es necesario mantenerlo puro y no tiene una duración fija; pero su uso debe ser lícito en primer lugar, como cuando retrasar el embarazo se debe a un interés reconocido por la sharia, no al temor a la pobreza como la que tenía la gente de la primera época de la Jahiliyya, y no debe ser perjudicial para la mujer; el Comité Permanente en la tierra de los Dos Santuarios respondió a sus homólogos sobre este método, como se detalla."
  fr: "Une femme a posé une question concernant le patch contraceptif carré porté pendant plusieurs jours: doit-il être appliqué dans un état de pureté rituelle et peut-on le laver ? Le Dr Salah al-Sawi (fatwa n° 86339, 17 janvier 2012) a répondu que le patch contraceptif suit la même règle que l’attelle: il n’est pas nécessaire de l’appliquer dans un état de pureté rituelle et sa durée d’utilisation n’est pas limitée; toutefois, son utilisation doit être licite, notamment lorsqu’il s’agit de retarder une grossesse pour des raisons légitimes au regard de la charia, et non par crainte de la pauvreté comme c’était le cas pour les populations de la première Jahiliyya, et sans danger pour la femme. Le Comité permanent des Terres des Deux Sanctuaires a donné des avis similaires sur cette méthode, comme indiqué en détail."
  tr: "Bir kadına günlerce dayanan bir doğum kontrol bandı hakkında sorular soruldu; bu bant saflık gerektirip ghusl'u geçersiz kaçırıyordu. Dr. Salah Al-Sawy (17 Ocak 2012 tarihli Fetva No. 86339) doğum kontrol bandının alçı statüsünde olduğunu, bu yüzden saf bir durumda olması veya uzun süre için kullanılmasını gerektirmediğini yanıtladı. Ancak, hamileliği erteleme isteği geçerli bir dini çıkar içinmiş gibi baştan itibaren meşru olmalı, erken İslam öncesi dönemde olduğu gibi aile korkusundan değil ve kullanımı kadınlara zarar vermiyordu. İki Kutsal Cami Diyarı Fetva Daimi Komitesi'ne benzer konular soruldu ve bu yaklaşımın cevabı çok ayrıntılı oldu."
  id: "Seorang wanita ditanya tentang plester kontrasepsi yang bertahan berhari-hari, apakah itu membutuhkan kemurnian dan membatalkan ghusl. Dr. Salah Al-Sawy menjawab (Fatwa No. 86339 tanggal 17 Januari 2012) bahwa plester kontrasepsi berstatus seperti gips, sehingga tidak diwajibkan ditempatkan dalam keadaan murni maupun untuk jangka waktu tertentu. Namun, penggunaannya harus sah sejak awal, seolah-olah keinginan menunda kehamilan adalah demi kepentingan agama yang sah, bukan karena takut keluarga seperti pada era pra-Islam awal, dan penggunaannya tidak berbahaya bagi perempuan. Komite Tetap untuk Fatwa di Tanah Dua Masjid Suci juga ditanya tentang hal serupa, dan jawabannya adalah sedetail ini."
