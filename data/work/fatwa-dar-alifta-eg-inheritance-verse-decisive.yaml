id: work/fatwa-dar-alifta-eg-inheritance-verse-decisive
class: work
kind: fatwa
label: { ar: "بيان قطعية آية الميراث", en: "The decisiveness of the inheritance verse", ur: "آیتِ میراث کی قطعیت", es: "La decisión del verso de la herencia" }
summary:
  ar: "سائل سأل عن مكانة آية الميراث في القرآن. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22037)⁩ أن آية الميراث الواردة في سورة النساء تُعد من الآيات القطعية الثبوت والدلالة التي تُبنى عليها أحكام الفرائض، على ما فصّل الجواب من مكانة علم الميراث."
  en: "A questioner asked about the standing of the inheritance verse in the Qur'an. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22037) answered that the inheritance verse in Surat al-Nisa' counts among the verses decisive in transmission and meaning on which the rules of the fixed shares rest; the answer sets out the standing of the science of inheritance."
  ur: "ایک سائل نے قرآن میں آیتِ میراث کے مرتبے کے بارے میں پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22037)⁩ نے جواب دیا کہ سورۂ نساء کی آیتِ میراث ثبوت اور دلالت میں قطعی آیات میں سے ہے جن پر فرائض کے احکام استوار ہیں؛ جواب میں علمِ میراث کے مرتبے کی تفصیل بیان ہوئی۔"
  es: "Un consultante preguntó sobre la importancia del versículo de la herencia en el Corán. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22037) respondió que el versículo de la herencia en la Sura al-Nisa' se encuentra entre los versículos decisivos en la transmisión y el significado en los que se basan las reglas de las partes fijas; la respuesta expone la importancia de la ciencia de la herencia."
