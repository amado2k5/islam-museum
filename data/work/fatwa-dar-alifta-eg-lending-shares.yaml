id: work/fatwa-dar-alifta-eg-lending-shares
class: work
kind: fatwa
label: { ar: "حكم إقراض الأسهم", en: "Lending shares", ur: "حصص کا قرض دینا", es: "Préstamo de acciones", fr: "Prêt d'actions", tr: "Hisse Verilmesine İlişkin Karar", id: "Putusan tentang peminjaman saham" }
summary:
  ar: "سائل سأل عن إقراض الأسهم. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21837)⁩ أن إصدار الأسهم وملكيتها والتعامل بها بيعًا وشراءً وإقراضًا جائز شرعًا ما لم يكن عمل الشركة التي تكونت من مجموعها محظورًا على ما فصّل الجواب."
  en: "A questioner asked about lending shares. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21837) answered that issuing shares, owning them and dealing in them — selling, buying and lending — is lawful in the sharia, so long as the company's business is not prohibited, as the answer details."
  ur: "ایک سائل نے حصص قرض دینے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21837)⁩ نے جواب دیا کہ حصص کا جاری ہونا، ملکیت اور ان میں لین دین — بیع، خرید اور قرض — جائز ہے بشرطیکہ کمپنی کا کاروبار ممنوع نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el préstamo de acciones. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21837) respondió que emitir acciones, poseerlas y negociar con ellas —venderlas, comprarlas y prestarlas— es lícito según la sharia, siempre y cuando la actividad de la empresa no esté prohibida, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant le prêt d'actions. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21837) a répondu que l'émission, la détention et le commerce d'actions (vente, achat et prêt) sont licites selon la charia, à condition que l'activité de l'entreprise ne soit pas interdite, comme le précise la réponse."
  tr: "Bir soru soran kişi hisse senedi ödünç verme hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21837), şirketin tamamından oluşan şirketin faaliyetleri yasaklanmadıkça dinsel olarak izin verilen bir şey olduğunu yanıtladı."
  id: "Seorang penanya bertanya tentang peminjaman saham. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21837) menjawab bahwa menerbitkan, memiliki, dan menangani saham dalam penjualan, pembelian, dan peminjaman diperbolehkan secara hukum kecuali operasi perusahaan yang dibentuk secara keseluruhan dilarang sebagaimana dijelaskan dalam jawaban."
