summary:
  ar: "سائل سأل عن طواف الإفاضة مع الشك في نزول الحيض. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20702)⁩ أن طواف المرأة في هذه الحالة صحيح مجزئ على كل حال وحجتها تامة غير ناقصة بيد أن عليها دمًا على ما فصّل الجواب."
  en: "A questioner asked about tawaf al-ifada performed with doubt about whether menses had begun. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20702) answered that the woman's tawaf in this case is valid and sufficient in any event and her Hajj complete — though she owes a dam, as the answer details."
  ur: "ایک سائل نے حیض شروع ہونے کے شبہ میں طواف افاضہ کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20702)⁩ نے جواب دیا کہ ایسی صورت میں عورت کا طواف صحیح اور حج مکمل ہے البتہ اس پر دم ہے — جیسا کہ جواب میں تفصیل ہے۔"
