id: work/fatwa-aliftaa-jo-a-charity-thanking-a-bank-sponsor
class: work
kind: fatwa
label: { ar: "قبول جمعية خيرية دعم بنك تجاري مقابل شكره في المنشورات", en: "A charity accepting a commercial bank's support in return for thanking it in posts", ur: "خیراتی انجمن کا تجارتی بینک کی مدد قبول کر کے اشاعتوں میں اس کا شکریہ ادا کرنا" }
summary:
  ar: "سؤال عن جمعية خيرية تقبل دعمًا من بنك تجاري مقابل شكره في المنشورات والفيديوهات والإعلانات، أجابت فيه دائرة الإفتاء العام الأردنية بجواز قبول تبرعات البنوك الربوية إذا لم يُشترط فيها الترويج، وبجواز الشكر اللفظي أو بكتاب، وتحريم الشكر عبر الإعلانات والمنشورات لأنه ترويج. أجابت الدائرة بأنه يحرم الترويج والدعاية للبنوك والمؤسسات المالية التي تتعامل بالربا لأنه من الإعانة على الحرام. وقالت إنه لا حرج في معاملة من اختلط ماله بين الحلال والحرام أو كان أكثر ماله حرامًا، فيجوز قبول هبته وتبرعه ما لم تتعين حرمة المال المعطى، بشرط ألا يكون ذلك مربوطًا بالترويج للمتبرع، ونقلت جواب ابن حجر الهيتمي في الفتاوى الفقهية الكبرى بأن معاملة من أكثر ماله حرام مكروهة ما لم يُعلم عين الحرام. وفرقت في شكر البنك الداعم بين الشكر اللفظي للإدارة أو بكتاب شكر، فلا حرج فيه، والشكر بنشر إعلانات وفيديوهات تتضمن الشكر، فلا يجوز لأنه بمعنى الترويج. وخلصت إلى أنه لا حرج في قبول التبرعات من البنوك الربوية إذا لم يُشترط فيها الترويج، ويحرم إن كانت مقابل عمل ترويجي كالشكر بالمنشورات والإعلانات."
  en: "A question about a charity accepting support from a commercial bank in return for thanking it in posts, videos and advertisements, in which Jordan's General Iftaa Department answered that donations from interest-based banks may be accepted if no promotion is required, that thanks given orally or by letter are fine, and that thanks through advertisements and posts are forbidden because they amount to promotion. The Department answered that promoting and advertising banks and financial institutions that deal in usury is forbidden, because it is assisting in what is forbidden. It said there is no objection to dealing with someone whose wealth is mixed between lawful and unlawful, or even mostly unlawful, so his gift or donation may be accepted unless the specific money given is known to be unlawful, provided this is not tied to promoting the donor; it quoted Ibn Hajar al-Haytami's answer in al-Fatawa al-Fiqhiyya al-Kubra that dealing with someone most of whose wealth is unlawful is disliked unless the unlawful item itself is known. It distinguished ways of thanking a supporting bank: oral thanks to its management, or a letter of thanks, are unobjectionable; thanks published in advertisements and videos are not permitted, because they amount to promotion. It concluded that donations from interest-based banks may be accepted if they do not require promotion, but are forbidden if given in return for promotional work, such as thanks in posts and advertisements."
  ur: "ایک خیراتی انجمن کے بارے میں سوال جو تجارتی بینک سے اس شرط پر مدد لے کہ پوسٹس، ویڈیوز اور اشتہارات میں اس کا شکریہ ادا کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سودی بینکوں کے عطیات قبول کیے جا سکتے ہیں اگر ان میں تشہیر کی شرط نہ ہو، زبانی یا خط کے ذریعے شکریہ درست ہے، اور اشتہارات اور پوسٹس کے ذریعے شکریہ حرام ہے کیونکہ وہ تشہیر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سود کا لین دین کرنے والے بینکوں اور مالیاتی اداروں کی تشہیر حرام ہے کیونکہ یہ حرام میں مدد ہے۔ اس نے کہا کہ جس کا مال حلال و حرام سے مخلوط ہو، یا جس کا اکثر مال حرام ہو، اس سے معاملہ کرنے میں حرج نہیں، لہٰذا اس کا ہبہ یا عطیہ قبول ہو سکتا ہے جب تک دی گئی رقم کا بعینہ حرام ہونا معلوم نہ ہو، بشرطیکہ یہ عطیہ دینے والے کی تشہیر سے مشروط نہ ہو؛ اس نے الفتاوی الفقہیہ الکبری میں ابن حجر ہیتمی کا جواب نقل کیا کہ جس کا اکثر مال حرام ہو اس سے معاملہ مکروہ ہے جب تک عین حرام معلوم نہ ہو۔ اس نے مدد کرنے والے بینک کے شکریے کی صورتوں میں فرق کیا: انتظامیہ کا زبانی شکریہ یا شکریے کا خط درست ہے؛ اشتہارات اور ویڈیوز میں شائع کیا گیا شکریہ جائز نہیں کیونکہ وہ تشہیر کے معنی میں ہے۔ اس نے نتیجہ نکالا کہ سودی بینکوں کے عطیات قبول کرنے میں حرج نہیں اگر ان میں تشہیر کی شرط نہ ہو، اور اگر وہ تشہیری کام، جیسے پوسٹس اور اشتہارات میں شکریہ، کے بدلے ہوں تو حرام ہیں۔"
