id: work/fatwa-aliftaa-jo-a-charity-thanking-a-bank-sponsor
class: work
kind: fatwa
label: { ar: "قبول جمعية خيرية دعم بنك تجاري مقابل شكره في المنشورات", en: "A charity accepting a commercial bank's support in return for thanking it in posts", ur: "خیراتی انجمن کا تجارتی بینک کی مدد قبول کر کے اشاعتوں میں اس کا شکریہ ادا کرنا", es: "Una organización benéfica acepta el apoyo de un banco comercial a cambio de agradecerle en publicaciones.", fr: "Une organisation caritative qui accepte le soutien d'une banque commerciale en échange de remerciements publiés sur les réseaux sociaux.", tr: "Bir ticari bankayı destekleyen bir hayır kurumunun, yayınlarda teşekkür karşılığında kabul edilmesi", id: "Penerimaan badan amal yang mendukung bank komersial sebagai imbalan atas ucapan terima kasihnya dalam publikasi" }
summary:
  ar: "سؤال عن جمعية خيرية تقبل دعمًا من بنك تجاري مقابل شكره في المنشورات والفيديوهات والإعلانات، أجابت فيه دائرة الإفتاء العام الأردنية بجواز قبول تبرعات البنوك الربوية إذا لم يُشترط فيها الترويج، وبجواز الشكر اللفظي أو بكتاب، وتحريم الشكر عبر الإعلانات والمنشورات لأنه ترويج. أجابت الدائرة بأنه يحرم الترويج والدعاية للبنوك والمؤسسات المالية التي تتعامل بالربا لأنه من الإعانة على الحرام. وقالت إنه لا حرج في معاملة من اختلط ماله بين الحلال والحرام أو كان أكثر ماله حرامًا، فيجوز قبول هبته وتبرعه ما لم تتعين حرمة المال المعطى، بشرط ألا يكون ذلك مربوطًا بالترويج للمتبرع، ونقلت جواب ابن حجر الهيتمي في الفتاوى الفقهية الكبرى بأن معاملة من أكثر ماله حرام مكروهة ما لم يُعلم عين الحرام. وفرقت في شكر البنك الداعم بين الشكر اللفظي للإدارة أو بكتاب شكر، فلا حرج فيه، والشكر بنشر إعلانات وفيديوهات تتضمن الشكر، فلا يجوز لأنه بمعنى الترويج. وخلصت إلى أنه لا حرج في قبول التبرعات من البنوك الربوية إذا لم يُشترط فيها الترويج، ويحرم إن كانت مقابل عمل ترويجي كالشكر بالمنشورات والإعلانات."
  en: "A question about a charity accepting support from a commercial bank in return for thanking it in posts, videos and advertisements, in which Jordan's General Iftaa Department answered that donations from interest-based banks may be accepted if no promotion is required, that thanks given orally or by letter are fine, and that thanks through advertisements and posts are forbidden because they amount to promotion. The Department answered that promoting and advertising banks and financial institutions that deal in usury is forbidden, because it is assisting in what is forbidden. It said there is no objection to dealing with someone whose wealth is mixed between lawful and unlawful, or even mostly unlawful, so his gift or donation may be accepted unless the specific money given is known to be unlawful, provided this is not tied to promoting the donor; it quoted Ibn Hajar al-Haytami's answer in al-Fatawa al-Fiqhiyya al-Kubra that dealing with someone most of whose wealth is unlawful is disliked unless the unlawful item itself is known. It distinguished ways of thanking a supporting bank: oral thanks to its management, or a letter of thanks, are unobjectionable; thanks published in advertisements and videos are not permitted, because they amount to promotion. It concluded that donations from interest-based banks may be accepted if they do not require promotion, but are forbidden if given in return for promotional work, such as thanks in posts and advertisements."
  ur: "ایک خیراتی انجمن کے بارے میں سوال جو تجارتی بینک سے اس شرط پر مدد لے کہ پوسٹس، ویڈیوز اور اشتہارات میں اس کا شکریہ ادا کرے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ سودی بینکوں کے عطیات قبول کیے جا سکتے ہیں اگر ان میں تشہیر کی شرط نہ ہو، زبانی یا خط کے ذریعے شکریہ درست ہے، اور اشتہارات اور پوسٹس کے ذریعے شکریہ حرام ہے کیونکہ وہ تشہیر ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ سود کا لین دین کرنے والے بینکوں اور مالیاتی اداروں کی تشہیر حرام ہے کیونکہ یہ حرام میں مدد ہے۔ اس نے کہا کہ جس کا مال حلال و حرام سے مخلوط ہو، یا جس کا اکثر مال حرام ہو، اس سے معاملہ کرنے میں حرج نہیں، لہٰذا اس کا ہبہ یا عطیہ قبول ہو سکتا ہے جب تک دی گئی رقم کا بعینہ حرام ہونا معلوم نہ ہو، بشرطیکہ یہ عطیہ دینے والے کی تشہیر سے مشروط نہ ہو؛ اس نے الفتاوی الفقہیہ الکبری میں ابن حجر ہیتمی کا جواب نقل کیا کہ جس کا اکثر مال حرام ہو اس سے معاملہ مکروہ ہے جب تک عین حرام معلوم نہ ہو۔ اس نے مدد کرنے والے بینک کے شکریے کی صورتوں میں فرق کیا: انتظامیہ کا زبانی شکریہ یا شکریے کا خط درست ہے؛ اشتہارات اور ویڈیوز میں شائع کیا گیا شکریہ جائز نہیں کیونکہ وہ تشہیر کے معنی میں ہے۔ اس نے نتیجہ نکالا کہ سودی بینکوں کے عطیات قبول کرنے میں حرج نہیں اگر ان میں تشہیر کی شرط نہ ہو، اور اگر وہ تشہیری کام، جیسے پوسٹس اور اشتہارات میں شکریہ، کے بدلے ہوں تو حرام ہیں۔"
  es: "Una pregunta sobre una organización benéfica que acepta apoyo de un banco comercial a cambio de agradecerle en publicaciones, videos y anuncios, a la que el Departamento General de Iftaa de Jordania respondió que las donaciones de bancos con intereses pueden aceptarse si no se requiere promoción, que los agradecimientos verbales o por escrito son aceptables, y que los agradecimientos a través de anuncios y publicaciones están prohibidos porque equivalen a promoción. El Departamento respondió que promover y publicitar bancos e instituciones financieras que operan con usura está prohibido, porque es ayudar a lo que está prohibido. Dijo que no hay objeción a tratar con alguien cuya riqueza es mixta entre lícita e ilícita, o incluso mayoritariamente ilícita, por lo que su donación puede aceptarse a menos que se sepa que el dinero específico donado es ilícito, siempre que esto no esté vinculado a la promoción del donante; citó la respuesta de Ibn Hajar al-Haytami en al-Fatawa al-Fiqhiyya al-Kubra que trata con alguien cuya riqueza mayoritaria es ilícita a menos que se conozca el bien ilícito en sí. Se distinguieron las formas de agradecer a un banco colaborador: los agradecimientos verbales a su dirección o una carta de agradecimiento son aceptables; los agradecimientos publicados en anuncios y vídeos no están permitidos, ya que constituyen promoción. Se concluyó que las donaciones de bancos que cobran intereses pueden aceptarse si no requieren promoción, pero están prohibidas si se ofrecen a cambio de trabajo promocional, como agradecimientos en publicaciones y anuncios."
  fr: "Une question concernait l'acceptation par une organisation caritative du soutien d'une banque commerciale en échange de remerciements publiés dans des publications, des vidéos et des publicités. Le Département général de la Fatah de Jordanie a répondu que les dons provenant de banques pratiquant l'usure peuvent être acceptés si aucune promotion n'est requise, que les remerciements oraux ou écrits sont acceptables, et que les remerciements par le biais de publicités et de publications sont interdits car assimilables à de la promotion. Le Département a précisé que la promotion et la publicité des banques et institutions financières pratiquant l'usure sont interdites, car elles constituent une forme de complicité. Il a ajouté qu'il n'y a pas d'objection à traiter avec une personne dont le patrimoine est mixte, licite et illicite, voire majoritairement illicite. Son don peut donc être accepté, sauf si la nature illicite du don est avérée, à condition que cela ne soit pas lié à la promotion du donateur. Le Département a cité la réponse d'Ibn Hajar al-Haytami dans al-Fatawa al-Fiqhiyya al-Kubra, selon laquelle il est déconseillé de traiter avec une personne dont le patrimoine est majoritairement illicite, sauf si la nature illicite du bien est connue. Elle a établi une distinction entre les différentes manières de remercier une banque donatrice: les remerciements oraux adressés à sa direction ou une lettre de remerciement sont acceptables; les remerciements publiés dans des publicités et des vidéos sont interdits, car ils constituent une forme de promotion. Elle a conclu que les dons de banques à but lucratif peuvent être acceptés s’ils n’impliquent pas de promotion, mais sont interdits s’ils sont effectués en contrepartie d’un travail promotionnel, tel que des remerciements dans des articles et des publicités."
  tr: "Bir hayır kurumunun, teşekkür karşılığında ticari bir bankadan destek kabul etmesi hakkında bir soru; Ürdün Genel Fetva Dairesi, terfi gerektirmediği takdirde tefeci bankalardan bağış kabul etmenin caiz olduğunu, sözlü veya yazılı teşekkür yapılmasının izin olduğunu ve reklam ile yayın yoluyla şükran yapmanın teşvik olduğu için yasak olduğunu belirtti. Bakanlık, tefecilikle ilgilenen bankalar ve finansal kurumlara tanıtım ve reklam yapmanın yasadışı olduğunu çünkü bunun yasa dışı olduğunu söyledi. Serveti helal ve haram arasında karışık olan ya da serveti çoğunlukla yasadışı olan biriyle ilişki yapmanın zararı olmadığını belirtti. Verilen paranın kutsallığı kanıtlanmadıkça, bağışçının terfi etmesiyle bağlantılı olmadıkça, onun hediye ve bağışını kabul etmek caizdir. İbn Hajar al-Haytami'nin büyük fıkıh fetvalarında alıntı yaptığı, serveti en çok yasak olan biriyle ilişki yapmanın, kişi belirli yasak kişiyi tanımıyorsa sevilmediğini belirtti. Destekleyici bankaya sözlü teşekkür veya teşekkür mektubu (izin verilen) ile teşekkür içeren reklam ve videolar yayınlayarak teşekkür etme arasında ayrım yaptı; çünkü bu teşvik anlamına gelir. Tefecilik bankalarından bağış kabul etmenin bir zararı olmadığını, eğer tanıtım gerekmiyorsa ve teşekkür çalışmaları karşılığında yayınlar ve reklamlar yoluyla yapılıyorsa yasak olduğu sonucuna varıldı."
  id: "Pertanyaan tentang asosiasi amal yang menerima dukungan dari bank komersial sebagai imbalan atas ucapan terima kasih melalui publikasi, video, dan iklan, di mana Departemen Fatwa Umum Yordania menjawab bahwa diperbolehkan menerima sumbangan dari bank riba jika promosi tidak diperlukan, dan ucapan terima kasih lisan atau tertulis diperbolehkan, serta rasa terima kasih melalui iklan dan publikasi dilarang karena itu promosi. Departemen menjawab bahwa dilarang mempromosikan dan mengiklankan kepada bank dan lembaga keuangan yang menangani riba karena membantu melakukan hal yang melanggar hukum. Departemen tersebut mengatakan tidak ada salahnya berurusan dengan seseorang yang kekayaannya campuran antara halal dan haram, atau yang kekayaannya sebagian besar melanggar hukum. Diperbolehkan menerima hadiah dan donasinya kecuali kesucian uang yang diberikan dibuktikan, asalkan hal ini tidak terkait dengan promosi donatur. Departemen mengutip Ibn Hajar al-Haytami dalam fatwa yurisprudensi utama bahwa berurusan dengan seseorang yang kekayaannya paling dilarang tidak disukai kecuali orang tersebut mengenal orang yang dilarang secara spesifik. Surat ini membedakan antara ucapan terima kasih lisan kepada bank pendukung atau surat ucapan terima kasih, yang diperbolehkan, dan ucapan terima kasih dengan mempublikasikan iklan dan video yang berisi ucapan terima kasih, karena tidak diperbolehkan karena berarti promosi. Kesimpulan tersebut menyimpulkan bahwa tidak ada salahnya menerima donasi dari bank riba jika promosi tidak diperlukan, dan dilarang jika itu sebagai imbalan atas pekerjaan promosi seperti ucapan terima kasih melalui publikasi dan iklan."
