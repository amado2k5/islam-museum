id: work/fatwa-binbaz-person-in-retreat-visiting-the-sick-and-attending-funerals
class: work
kind: fatwa
label: { ar: "حكم زيارة المعتكف للمريض وشهوده الجنازة", en: "A person in retreat (i'tikaf) visiting the sick and attending funerals", ur: "معتکف کا مریض کی عیادت کرنا اور جنازے میں شریک ہونا" }
summary:
  ar: "سؤال عن جواز زيارة المعتكف للمريض وشهوده الجنازة، وقد قال بعض العلماء إن ذلك لا يجوز إلا إذا اشترطه قبل الاعتكاف، أجاب فيه ابن باز بأنه إذا كان المريض في المسجد فلا بأس بزيارته، وكذلك الصلاة على الجنازة في المسجد، وإلا فلا يذهب، فالسنة للمعتكف ألا يعود مريضًا ولا يشهد الجنازة إلا إذا كان ذلك في مسجده."
  en: "A question whether a person in retreat (i'tikaf) may visit the sick and attend a funeral, some scholars having said this is allowed only if he stipulated it before beginning the retreat; Ibn Baz answered that if the sick person is in the mosque there is no harm in visiting him, and likewise praying the funeral prayer in the mosque, but otherwise he should not go out, since the Sunna for the person in retreat is not to visit the sick or attend a funeral unless it takes place in his mosque."
  ur: "اس بارے میں سوال کہ کیا معتکف مریض کی عیادت کر سکتا اور جنازے میں شریک ہو سکتا ہے، جبکہ بعض علما نے کہا کہ یہ صرف اس صورت میں جائز ہے جب اس نے اعتکاف سے پہلے اس کی شرط لگائی ہو؛ ابن باز نے جواب دیا کہ اگر مریض مسجد میں ہو تو اس کی عیادت میں کوئی حرج نہیں، اور اسی طرح مسجد میں نمازِ جنازہ پڑھنے میں، ورنہ وہ نہ جائے، کیونکہ معتکف کے لیے سنت یہ ہے کہ وہ مریض کی عیادت نہ کرے اور جنازے میں شریک نہ ہو سوائے اس کے کہ یہ اس کی مسجد میں ہو۔"
