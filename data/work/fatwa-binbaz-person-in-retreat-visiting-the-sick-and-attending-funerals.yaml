id: work/fatwa-binbaz-person-in-retreat-visiting-the-sick-and-attending-funerals
class: work
kind: fatwa
label: { ar: "حكم زيارة المعتكف للمريض وشهوده الجنازة", en: "A person in retreat (i'tikaf) visiting the sick and attending funerals", ur: "معتکف کا مریض کی عیادت کرنا اور جنازے میں شریک ہونا", es: "Una persona en retiro (i'tikaf) que visita a los enfermos y asiste a funerales.", fr: "Une personne en retraite (i'tikaf) visitant les malades et assistant aux funérailles" }
summary:
  ar: "سؤال عن جواز زيارة المعتكف للمريض وشهوده الجنازة، وقد قال بعض العلماء إن ذلك لا يجوز إلا إذا اشترطه قبل الاعتكاف، أجاب فيه ابن باز بأنه إذا كان المريض في المسجد فلا بأس بزيارته، وكذلك الصلاة على الجنازة في المسجد، وإلا فلا يذهب، فالسنة للمعتكف ألا يعود مريضًا ولا يشهد الجنازة إلا إذا كان ذلك في مسجده."
  en: "A question whether a person in retreat (i'tikaf) may visit the sick and attend a funeral, some scholars having said this is allowed only if he stipulated it before beginning the retreat; Ibn Baz answered that if the sick person is in the mosque there is no harm in visiting him, and likewise praying the funeral prayer in the mosque, but otherwise he should not go out, since the Sunna for the person in retreat is not to visit the sick or attend a funeral unless it takes place in his mosque."
  ur: "اس بارے میں سوال کہ کیا معتکف مریض کی عیادت کر سکتا اور جنازے میں شریک ہو سکتا ہے، جبکہ بعض علما نے کہا کہ یہ صرف اس صورت میں جائز ہے جب اس نے اعتکاف سے پہلے اس کی شرط لگائی ہو؛ ابن باز نے جواب دیا کہ اگر مریض مسجد میں ہو تو اس کی عیادت میں کوئی حرج نہیں، اور اسی طرح مسجد میں نمازِ جنازہ پڑھنے میں، ورنہ وہ نہ جائے، کیونکہ معتکف کے لیے سنت یہ ہے کہ وہ مریض کی عیادت نہ کرے اور جنازے میں شریک نہ ہو سوائے اس کے کہ یہ اس کی مسجد میں ہو۔"
  es: "Se planteó la cuestión de si una persona en retiro (i'tikaf) puede visitar a los enfermos y asistir a un funeral, ya que algunos eruditos han dicho que esto solo está permitido si lo estipuló antes de comenzar el retiro; Ibn Baz respondió que si la persona enferma está en la mezquita no hay inconveniente en visitarla, y también en rezar la oración fúnebre en la mezquita, pero de lo contrario no debe salir, ya que la Sunna para la persona en retiro es no visitar a los enfermos ni asistir a un funeral a menos que tenga lugar en su mezquita."
  fr: "La question de savoir si une personne en retraite spirituelle (i'tikaf) peut rendre visite aux malades et assister à des funérailles a été soulevée. Certains savants ont affirmé que cela n'était permis que si la personne l'avait stipulé avant de commencer sa retraite. Ibn Baz a répondu que si le malade se trouve à la mosquée, il n'y a aucun mal à lui rendre visite et à y accomplir la prière funéraire. En revanche, il ne doit pas sortir, car la Sunna pour la personne en retraite spirituelle est de ne pas rendre visite aux malades ni d'assister à des funérailles à moins que celles-ci n'aient lieu dans sa mosquée."
