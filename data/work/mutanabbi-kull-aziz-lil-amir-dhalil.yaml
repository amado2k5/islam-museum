summary:
  ar: "قصيدة من الطويل على روي اللام للمتنبي، من قصائد المدح كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.355}}."
  en: "An ode in the tawil metre on the rhyme lam by al-Mutanabbi; a praise ode, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.355}}."
  es: "Una oda en metro tawil sobre la rima lam de al-Mutanabbi; una oda de alabanza, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.355}}."
  fr: "Une ode en mètre tawil sur la rime lam par al-Mutanabbi; une ode de louange, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.355}}."
  ur: "المتنبی کی شاعری لام پر تاویل میٹر میں ایک اوڈ؛ ایک تعریفی نعت، جیسا کہ دار بیروت ایڈیشن نے اس کا تعارف کرایا ہے {{حوالہ:دیوان-متنبی-دار-بیروت-1983 صفحہ 355}}۔"
  tr: "Al-Mutanabbi'nin Lam'ın Anlatımı üzerine Al-Tawil'den bir şiir, Diwan Dar Beyrut tarafından sunulan övgü şiiri {{cite:diwan-mutanabbi-dar-beirut-1983 s.355}}."
  id: "Sebuah puisi dari Al-Tawil tentang Narasi Lam oleh Al-Mutanabbi, sebuah puisi pujian yang disajikan oleh Diwan Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.355}}."
