label: { ar: "حكم استخدام الذكاء الاصطناعي في تجسيد الذات الإلهية", en: "Using AI to depict the Divine Essence", ur: "ذاتِ الٰہی کے تصور میں اے آئی کا استعمال", es: "Utilizar la IA para representar la Esencia Divina", fr: "Utiliser l'IA pour représenter l'essence divine", tr: "İlahi Benliği Bedenleştirmede Yapay Zekanın Kullanılmasına İlahi Karar", id: "Aturan tentang Penggunaan Kecerdasan Buatan dalam Mewujudkan Diri Ilahi" }
summary:
  ar: "سائل سأل عن استخدام تقنيات الذكاء الاصطناعي في تصميم صور أو توليد نماذج تجسّد الذات الإلهية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22369)⁩ أن ذلك يُعدّ تطاولًا على جناب الله واستهانة بجلاله فلا يجوز، على ما فصّل الجواب."
  en: "A questioner asked about using AI techniques to design images or generate models embodying the Divine Essence. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22369) answered that this is an overstepping against God's majesty and a belittling of His glory, so it is not permitted — as the answer details."
  ur: "ایک سائل نے ذاتِ الٰہی کو مجسم کرنے والی تصاویر یا ماڈل بنانے میں اے آئی کے استعمال کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22369)⁩ نے جواب دیا کہ یہ اللہ کی شان میں تجاوز اور اس کے جلال کی تقلیل ہے اس لیے جائز نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el uso de técnicas de IA para diseñar imágenes o generar modelos que encarnen la Esencia Divina. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22369) respondió que esto constituye una transgresión contra la majestad de Dios y un menosprecio de Su gloria, por lo que no está permitido, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant l'utilisation de techniques d'intelligence artificielle pour concevoir des images ou générer des modèles incarnant l'Essence Divine. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22369) a répondu que cela constitue un outrage à la majesté divine et une atteinte à Sa gloire, et que, par conséquent, cela est interdit – comme le précise la réponse."
  tr: "Bir soru soran kişi, ilahi benliği somutlaştıran görüntüler tasarlamak veya modeller üretmek için yapay zeka teknolojilerinin kullanılmasını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 22369), bunun Allah'ın varlığına hakaret ve Majestelerine saygısızlık olduğunu, yanıtta ayrıntılı olarak belirtildiği gibi izin verilmediğini söyledi."
  id: "Seorang penanya bertanya tentang penggunaan teknologi kecerdasan buatan dalam merancang gambar atau menghasilkan model yang mewujudkan diri ilahi. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 22369) menjawab bahwa hal ini merupakan penghinaan terhadap kehadiran Tuhan dan pengabaian terhadap keagungan-Nya, dan tidak diperbolehkan, seperti yang dijelaskan dalam jawabannya."
