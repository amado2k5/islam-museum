label: { ar: "قرار مجمع الفقه الإسلامي الدولي 225 (23/9) بشأن الحلال للإجابة على استفسارات معهد المواصفات والمقاييس للدول الإسلامية ⁦(سيميك)⁩", en: "IIFA resolution 225 (23/9) on halal, in answer to the queries of the Standards and Metrology Institute for Islamic Countries ⁦(SMIIC)⁩", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 225 (23/9): حلال — اسلامی ممالک کے ادارۂ معیارات و پیمائش ⁦(سائیک/SMIIC)⁩ کے سوالناموں کے جواب میں", es: "Resolución 225 (23/9) de la IIFA sobre halal, en respuesta a las consultas del Instituto de Normas y Metrología para los Países Islámicos (SMIIC).", fr: "Résolution 225 (23/9) de l'IIFA sur le halal, en réponse aux questions de l'Institut des normes et de la métrologie des pays islamiques (SMIIC)", tr: "İslam Ülkeleri Standartlar ve Metroloji Enstitüsü'nün (CIMIC) taleplerine yanıt vermek üzere Helal ile ilgili Uluslararası İslami Fiqh Akademisi Kararı 225 (23/9)", id: "Keputusan International Islamic Fiqh Academy 225 (23/9) mengenai Halal untuk menjawab pertanyaan dari Institut Standar dan Metrologi untuk Negara-negara Islam (CIMIC)" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الثالثة والعشرين بالمدينة المنورة ⁦(19–23 صفر 1440هـ، 28 أكتوبر – 1 نوفمبر 2018م)⁩، بعد اطلاعه على الصياغة النهائية لتوصيات الندوة العلمية ⁦«الحلال للإجابة على استفسارات معهد المواصفات والمقاييس للدول الإسلامية ⁦(سيميك)⁩»⁩ بجدة ⁦(22–23 ربيع الثاني 1436هـ، 11–12 فبراير 2015م)⁩ المعاد صياغتها بناء على قراره 206 ⁦(22/2)⁩ الصادر في دورته الثانية والعشرين بالكويت ⁦(2–5 جمادى الآخرة 1436هـ، 22–25 مارس 2015م)⁩. قرر المجمع إحالة الموضوع إلى أمانة المجمع للدراسة والتعديل بما تراه مناسبًا وإبلاغ الجهة السائلة ⁦(سيميك)⁩ بذلك."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 23rd session in Medina (19–23 Safar 1440, 28 October – 1 November 2018), after reviewing the final wording of the recommendations of its scholarly seminar 'Halal, in answer to the queries of the Standards and Metrology Institute for Islamic Countries (SMIIC)' held in Jeddah (22–23 Rabi' II 1436, 11–12 February 2015), reworked under its resolution 206 (22/2) issued at its 22nd session in Kuwait (2–5 Jumada II 1436, 22–25 March 2015). It decided to refer the matter to the Academy's secretariat for study and amendment as it sees fit, and to inform the querying body (SMIIC) accordingly."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، مدینہ منورہ میں تیس ویں مجلس ⁦(19–23 صفر 1440ھ، 28 اکتوبر – 1 نومبر 2018ء)⁩ میں، جدہ میں منعقدہ علمی ندوات ⁦(«حلال — سائیک کے سوالناموں کے جواب میں»، 22–23 ربیع الثانی 1436ھ، 11–12 فروری 2015ء)⁩ کی سفارشات کی حتمی صورت کا جائزہ لینے کے بعد، جو کویت میں بائیسویں مجلس ⁦(2–5 جمادی الثانی 1436ھ، 22–25 مارچ 2015ء)⁩ کی قرارداد 206 ⁦(22/2)⁩ کے مطابق دوبارہ لکھی گئی۔ اکیڈمی نے فیصلہ کیا کہ موضوع اکیڈمی کی سیکریٹریٹ کو تحقیق اور مناسب ترمیم کے لیے بھیجا جائے اور پوچھنے والے ادارے ⁦(سائیک)⁩ کو اس کی اطلاع دی جائے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 23.ª sesión en Medina (19-23 Safar 1440, 28 de octubre - 1 de noviembre de 2018), tras revisar la redacción final de las recomendaciones de su seminario académico «Halal, en respuesta a las consultas del Instituto de Normas y Metrología para los Países Islámicos (SMIIC)», celebrado en Yeda (22-23 Rabi' II 1436, 11-12 de febrero de 2015), reelaborada en su resolución 206 (22/2) emitida en su 22.ª sesión en Kuwait (2-5 Jumada II 1436, 22-25 de marzo de 2015). Decidió remitir el asunto a la secretaría de la Academia para su estudio y modificación según lo considere oportuno, e informar al organismo consultante (SMIIC) al respecto."
  fr: "Par une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), lors de sa 23e session à Médine (19-23 Safar 1440, soit 28 octobre - 1er novembre 2018), après examen de la version finale des recommandations de son séminaire scientifique « Halal, en réponse aux questions de l'Institut des normes et de la métrologie des pays islamiques (SMIIC) », tenu à Djeddah (22-23 Rabi' II 1436, soit 11-12 février 2015), remaniée conformément à sa résolution 206 (22/2) adoptée lors de sa 22e session au Koweït (2-5 Jumada II 1436, soit 22-25 mars 2015), il a été décidé de soumettre la question au secrétariat de l'Académie pour étude et, le cas échéant, modification, et d'en informer l'organisme ayant posé les questions (SMIIC)."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Medine'deki yirmi üçüncü oturumunda (19–23 Safar 1440 H, 28 Ekim – 1 Kasım 2018), Cidde'deki 'İslam Ülkeleri Standartlar ve Metroloji Enstitüsü (SIMIC) Sorularına Helal Yanıt Verilmesi' bilimsel sempozyumunun önerilerinin nihai metninin gözden geçirilmesinden sonra (22–23 Rabi' al-Thani 1436 H, 11–12 Şubat 2015) toplu kararı, Kuveyt'teki 22. oturumunda verilen 206 (22/2/2) kararına dayanarak revize edilmiştir (2–5 Jumada al-Akhirah 1436 H, 22–25 Mart 2015). Akademi, konuyu uygun gördüğü şekilde incelenmek ve değiştirmek üzere Kompleks Sekretarya'ya havale etmeye ve talep eden makama (CIMIC) bilgilendirmeye karar verdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh tiga di Madinah (19–23 Safar 1440 HH, 28 Oktober – 1 November 2018), setelah meninjau rumusan akhir rekomendasi simposium ilmiah 'Halal untuk Menjawab Pertanyaan Institut Standar dan Metrologi untuk Negara-Negara Islam (SIMIC)' di Jeddah (22–23 Rabi' al-Thani 1436 H, 11–12 Februari 2015), direvisi berdasarkan keputusan 206 (22/2) yang dikeluarkan dalam sesi ke-22 di Kuwait (2–5 Jumada al-Akhirah 1436 H, 22–25 Maret 2015). Akademi memutuskan untuk merujuk masalah ini ke Sekretariat Kompleks untuk studi dan modifikasi sesuai kebutuhan, serta memberitahukan otoritas pemohon (CIMIC)."
