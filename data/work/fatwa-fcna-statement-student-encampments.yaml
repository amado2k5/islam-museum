summary:
  ar: "بيان أصدره المجلس الفقهي لأمريكا الشمالية ⁦(4 مايو 2024)⁩ حول الاعتصامات الطلابية في الجامعات الأمريكية؛ أشاد فيه المجلس بالتزام الطلبة من مختلف الخلفيات والأديان وحضّ على ما نصّ عليه البيان."
  en: "A statement issued by the Fiqh Council of North America (4 May 2024) on the student-led encampment protests at US universities, in which the council commended students of all backgrounds and faiths for their commitment — as the statement sets out."
  ur: "فقہ کونسل آف نارتھ امریکہ کا بیان ⁦(4 مئی 2024)⁩ امریکی جامعات میں طلبہ کیمپس دھرنوں پر، جس میں مختلف پس منظر اور مذاہب کے طلبہ کی عزم کی تعریف کی گئی — جیسا کہ بیان میں ہے۔"
  es: "Declaración emitida por el Consejo de Jurisprudencia Islámica de Norteamérica (4 de mayo de 2024) sobre las protestas estudiantiles en campamentos en universidades estadounidenses, en la que el consejo elogió a estudiantes de todos los orígenes y religiones por su compromiso, tal como se expone en la declaración."
  fr: "Une déclaration publiée par le Conseil Fiqh d'Amérique du Nord (4 mai 2024) sur les manifestations de campements menées par des étudiants dans les universités américaines, dans laquelle le conseil a félicité les étudiants de tous horizons et de toutes confessions pour leur engagement — comme le précise la déclaration."
  tr: "Kuzey Amerika Fiqh Konseyi tarafından (4 Mayıs 2024) Amerikan üniversitelerindeki öğrenci oturma eylemleriyle ilgili yayımlanan bir açıklama; konsey, çeşitli geçmişlerden ve dinlerden gelen öğrencilerin bağlılığını övdü ve bildirinin hükümlerine uyulması çağrısında bulundu."
  id: "Pernyataan yang dikeluarkan oleh Fiqh Council of North America (4 Mei 2024) mengenai aksi duduk mahasiswa di universitas-universitas Amerika; di mana dewan memuji komitmen mahasiswa dari berbagai latar belakang dan agama serta mendesak kepatuhan terhadap ketentuan pernyataan tersebut."
