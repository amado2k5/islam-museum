id: work/fatwa-binbaz-repeating-the-funeral-prayer
class: work
kind: fatwa
label: { ar: "حكم تكرار الصلاة على الميت", en: "Repeating the funeral prayer", ur: "نمازِ جنازہ دوبارہ پڑھنا" }
summary:
  ar: "سؤال عن تكرار الصلاة على الميت، أجاب فيه ابن باز بأنه لا بأس به إذا وافق المرء جماعة تصلي عليه. أجاب ابن باز بأن من صلى على الميت ثم وافق أناسًا يصلون عليه عند القبر فصلى معهم فلا بأس ولا حرج. وقاس ذلك على إعادة الصلاة المكتوبة، كمن صلى في مسجد ثم جاء مسجدًا آخر لحاجة أو لحضور درس وهم يصلون فصلى معهم. وقال إن الإعادة لسبب شرعي لا بأس بها."
  en: "A question on repeating the funeral prayer, in which Ibn Baz answered that there is no harm in it when one comes upon a group praying over the deceased. Ibn Baz answered that if someone has prayed over the deceased and then comes upon people praying over him at the grave and joins them, there is no harm in it. He compared it to repeating an obligatory prayer, as when someone who has already prayed comes to another mosque for some need or to attend a lesson while the people are praying, and prays with them. He said repeating for a legitimate reason is acceptable."
  ur: "نمازِ جنازہ دوبارہ پڑھنے کے بارے میں سوال، جس میں ابن باز نے کہا کہ اگر کوئی جماعت میت کی نماز پڑھ رہی ہو اور آدمی ساتھ مل جائے تو حرج نہیں۔ ابن باز نے جواب دیا کہ جس نے میت کی نماز پڑھ لی ہو پھر قبر کے پاس کچھ لوگوں کو اس کی نماز پڑھتے پائے اور ان کے ساتھ پڑھ لے تو کوئی حرج نہیں۔ انہوں نے اسے فرض نماز دہرانے پر قیاس کیا، جیسے کوئی نماز پڑھ کر کسی ضرورت یا درس کے لیے دوسری مسجد آئے اور لوگ نماز پڑھ رہے ہوں تو ان کے ساتھ پڑھ لے۔ انہوں نے کہا کہ شرعی سبب سے دہرانا درست ہے۔"
