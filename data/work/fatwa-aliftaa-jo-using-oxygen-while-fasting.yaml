id: work/fatwa-aliftaa-jo-using-oxygen-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال جهاز الأكسجين للصائم", en: "Using oxygen while fasting", ur: "روزے کی حالت میں آکسیجن کا استعمال" }
summary:
  ar: "سؤال عن استعمال الصائم لجهاز الأكسجين، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا يؤثر على صحة الصوم لأن الأكسجين هواء لا جرم له، إلا إذا أُضيفت إليه مواد علاجية لها جرم. أجابت الدائرة بأن استعمال جهاز الأكسجين لا يؤثر على صحة الصوم، لأن الأكسجين هواء لا جرم له. وقالت إنه إذا أضيفت إلى الأكسجين مواد علاجية لها جرم صار استعماله في نهار رمضان مفطرًا، لدخولها إلى الجوف من منفذ معتاد."
  en: "A question about a fasting person using an oxygen device, in which Jordan's General Iftaa Department answered that it does not affect the validity of the fast, because oxygen is air with no physical substance, unless medicinal substances with physical substance are added to it. The Department answered that using an oxygen device does not affect the validity of the fast, because oxygen is air without physical substance. It said that if medicinal substances that have physical substance are added to the oxygen, using it during the day in Ramadan breaks the fast, because they enter the interior through a normal passage."
  ur: "روزے دار کے آکسیجن مشین استعمال کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اس سے روزے کی صحت پر اثر نہیں پڑتا کیونکہ آکسیجن ہوا ہے جس کا کوئی جسم نہیں، سوائے اس کے کہ اس میں جسم رکھنے والی دوائیں شامل کی جائیں۔ ڈیپارٹمنٹ نے جواب دیا کہ آکسیجن مشین کا استعمال روزے کی صحت پر اثر نہیں ڈالتا، کیونکہ آکسیجن ایسی ہوا ہے جس کا کوئی جسم نہیں۔ اس نے کہا کہ اگر آکسیجن میں جسم رکھنے والی دوائیں شامل کی جائیں تو رمضان کے دن میں اس کا استعمال روزہ توڑ دیتا ہے، کیونکہ وہ معمول کے راستے سے جوف میں داخل ہوتی ہیں۔"
