id: work/fatwa-dar-alifta-eg-obligatory-bequest-for-grandchildren
class: work
kind: fatwa
label: { ar: "حكم الوصية الواجبة للأحفاد الوارثين بالتعصيب", en: "The obligatory bequest for grandchildren who inherit as agnates", ur: "تعصیب سے وارث ہونے والے پوتوں کے لیے لازمی وصیت" }
summary:
  ar: "سائل سأل عن الوصية الواجبة للأحفاد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21945)⁩ أن ابن الابن يستحق وصية واجبة بمقدار ما كان يستحقه والده لو كان حيًّا وقت وفاة أبيه المورث بما لا يزيد عن الثلث على ما فصّل الجواب."
  en: "A questioner asked about the obligatory bequest for grandchildren. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21945) answered that a son's son is entitled to an obligatory bequest equal to what his father would have received had he been alive at the progenitor's death, capped at a third — as the answer details."
  ur: "ایک سائل نے پوتوں کے لیے لازمی وصیت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21945)⁩ نے جواب دیا کہ بیٹے کا بیٹا اتنی لازمی وصیت کا مستحق ہے جتنا اس کے والد کو ملتا اگر وہ مرث کے انتقال کے وقت زندہ ہوتا، بشرطیکہ یہ ایک تہائی سے زیادہ نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
