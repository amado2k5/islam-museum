label: { ar: "حكم الوصية الواجبة للأحفاد الوارثين بالتعصيب", en: "The obligatory bequest for grandchildren who inherit as agnates", ur: "تعصیب سے وارث ہونے والے پوتوں کے لیے لازمی وصیت", es: "El legado obligatorio para los nietos que heredan por línea paterna", fr: "Le legs obligatoire pour les petits-enfants qui héritent par agnat", tr: "Miras yoluyla miras alan soyundan gelenler için zorunlu vasiyetin kararı", id: "Putusan tentang wasiat wajib bagi keturunan yang mewarisi melalui agnation" }
summary:
  ar: "سائل سأل عن الوصية الواجبة للأحفاد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21945)⁩ أن ابن الابن يستحق وصية واجبة بمقدار ما كان يستحقه والده لو كان حيًّا وقت وفاة أبيه المورث بما لا يزيد عن الثلث على ما فصّل الجواب."
  en: "A questioner asked about the obligatory bequest for grandchildren. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21945) answered that a son's son is entitled to an obligatory bequest equal to what his father would have received had he been alive at the progenitor's death, capped at a third — as the answer details."
  ur: "ایک سائل نے پوتوں کے لیے لازمی وصیت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21945)⁩ نے جواب دیا کہ بیٹے کا بیٹا اتنی لازمی وصیت کا مستحق ہے جتنا اس کے والد کو ملتا اگر وہ مرث کے انتقال کے وقت زندہ ہوتا، بشرطیکہ یہ ایک تہائی سے زیادہ نہ ہو — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la herencia obligatoria para los nietos. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21945) respondió que el hijo de un hijo tiene derecho a una herencia obligatoria equivalente a lo que su padre habría recibido si hubiera estado vivo al fallecer el progenitor, con un límite máximo de un tercio, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'héritage obligatoire pour les petits-enfants. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21945) a répondu que le fils d'un fils a droit à un héritage obligatoire égal à ce que son père aurait reçu s'il avait été vivant au décès du premier-né, plafonné à un tiers – comme le précise la réponse."
  tr: "Bir soru soran kişi, torunlar için zorunlu vasiyetname hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammad Ayad, Fetva No. 21945), oğlunun, babasının öldüğü sırada hayatta olsaydı sahip olacağı zorunlu vasiyetnameye eşit bir zorunlu vasiyetnameye hak sahibi olduğunu, ancak bu vasiyetin üçte birini aşmaması şartıyla cevapta ayrıntılı olarak belirtildiğini belirtti."
  id: "Seorang penanya menanyakan tentang surat wasiat wajib untuk cucu. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21945) menjawab bahwa putra dari putra tersebut berhak atas surat wasiat wajib yang setara dengan yang seharusnya diterima ayahnya jika ia masih hidup pada saat ayahnya meninggal, asalkan tidak melebihi sepertiga, seperti yang dijelaskan dalam jawaban."
