id: work/fatwa-dar-alifta-eg-intention-in-ghusl-janaba
class: work
kind: fatwa
label: { ar: "حكم النية عند الاغتسال من الجنابة", en: "The intention in the janaba full wash", ur: "غسلِ جنابت میں نیت کا حکم", es: "La intención en el lavado completo de janaba" }
summary:
  ar: "سائل سأل عن النية عند الاغتسال من الجنابة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22028)⁩ أن من اغتسل مستحضرًا بقلبه نية الغسل ورفع الحدث أو الطهارة من الجنابة سواء تلفظ بها بلسانه أو لم يتلفظ صح غسله، على ما فصّل الجواب."
  en: "A questioner asked about the intention in the full wash from major impurity (janaba). Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22028) answered that whoever washes holding in his heart the intention of the wash — lifting the impurity or purification from janaba — whether or not he voices it, his wash is valid, as the answer details."
  ur: "ایک سائل نے غسلِ جنابت میں نیت کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22028)⁩ نے جواب دیا کہ جو شخص دل میں غسل کی نیت — حدث اٹھانا یا جنابت سے پاکی — رکھتے ہوئے نہائے، خواہ زبان سے کہے یا نہ کہے، اس کا غسل صحیح ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de la intención en el lavado completo de la impureza mayor (janaba). El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22028) respondió que quien se lava con la intención en su corazón de eliminar la impureza o purificarse de la janaba, independientemente de si la expresa o no, su lavado es válido, como se detalla en la respuesta."
