id: work/fatwa-dar-alifta-eg-earthquakes-as-divine-vengeance
class: work
kind: fatwa
label: { ar: "مدى صحة القول بأن الزلازل انتقام من الله", en: "Is the claim sound that earthquakes are God's vengeance?", ur: "کیا زلزلے اللہ کا انتقام ہیں؟", es: "¿Es cierto que los terremotos son la venganza de Dios?", fr: "L'affirmation selon laquelle les tremblements de terre sont une vengeance divine est-elle fondée ?", tr: "Depremlerin Tanrı'nın intikamı olduğu iddiası ne kadar doğru?", id: "Seberapa akurat klaim bahwa gempa bumi adalah balas dendam Tuhan?" }
summary:
  ar: "سائل سأل عن مدى صحة القول بأن ما يحدث من زلازل في بلاد معينة انتقام من الله على أهلها لكونهم عصاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21086)⁩ أن ما يحدث من زلازل في بلاد معينة ليس دليلًا على غضب الله على أهل تلك البلاد لكونهم عصاة ومذنبين على ما فصّل الجواب."
  en: "A questioner asked whether the claim is sound that earthquakes in particular lands are God's vengeance on their sinful people. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21086) answered that earthquakes in a given land are not proof of God's anger at its people for sinning — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا یہ بات درست ہے کہ کسی سرزمین میں زلزلے اس کے گنہگار لوگوں پر اللہ کا انتقام ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21086)⁩ نے جواب دیا کہ زلزلے کسی ملک کے باشندوں کے خلاف اللہ کے غضب کا دلیل نہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó si era cierto que los terremotos en ciertas tierras son la venganza de Dios contra sus habitantes pecadores. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21086) respondió que los terremotos en una tierra determinada no son prueba de la ira de Dios contra su gente por pecar, como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'affirmation selon laquelle les tremblements de terre dans certaines régions seraient une punition divine infligée à leurs habitants pécheurs était fondée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21086) a répondu que les tremblements de terre dans une région donnée ne prouvent pas la colère de Dieu envers ses habitants pour leurs péchés, comme le précise la réponse."
  tr: "Bir soru soran kişi, bazı ülkelerde meydana gelen depremlerin Allah'ın günahkar oldukları için halklarına karşı intikamı olduğu iddiasının doğruluğunu sormuştur. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21086), bazı ülkelerde meydana gelen depremlerin o ülkelerin halkına Tanrı'nın gazabının kanıtı olmadığını, çünkü onların günahkar ve günahkar olduğunu ayrıntılı yanıtta açıklamıştır."
  id: "Seorang penanya menanyakan kebenaran klaim bahwa gempa bumi terjadi di beberapa negara adalah balas dendam dari Tuhan terhadap bangsanya karena mereka adalah pendosa. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21086) menjawab bahwa gempa bumi yang terjadi di beberapa negara bukanlah bukti murka Tuhan terhadap rakyat di negara-negara tersebut, karena mereka adalah pendosa dan pendosa seperti yang dijelaskan dalam jawaban rinci."
