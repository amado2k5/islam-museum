id: work/fatwa-dar-alifta-eg-earthquakes-as-divine-vengeance
class: work
kind: fatwa
label: { ar: "مدى صحة القول بأن الزلازل انتقام من الله", en: "Is the claim sound that earthquakes are God's vengeance?", ur: "کیا زلزلے اللہ کا انتقام ہیں؟" }
summary:
  ar: "سائل سأل عن مدى صحة القول بأن ما يحدث من زلازل في بلاد معينة انتقام من الله على أهلها لكونهم عصاة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21086)⁩ أن ما يحدث من زلازل في بلاد معينة ليس دليلًا على غضب الله على أهل تلك البلاد لكونهم عصاة ومذنبين على ما فصّل الجواب."
  en: "A questioner asked whether the claim is sound that earthquakes in particular lands are God's vengeance on their sinful people. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21086) answered that earthquakes in a given land are not proof of God's anger at its people for sinning — as the answer details."
  ur: "ایک سائل نے پوچھا کہ کیا یہ بات درست ہے کہ کسی سرزمین میں زلزلے اس کے گنہگار لوگوں پر اللہ کا انتقام ہیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21086)⁩ نے جواب دیا کہ زلزلے کسی ملک کے باشندوں کے خلاف اللہ کے غضب کا دلیل نہیں — جیسا کہ جواب میں تفصیل ہے۔"
