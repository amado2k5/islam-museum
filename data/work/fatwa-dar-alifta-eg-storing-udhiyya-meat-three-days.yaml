id: work/fatwa-dar-alifta-eg-storing-udhiyya-meat-three-days
class: work
kind: fatwa
label: { ar: "معنى النهي الوارد في السنة عن ادخار لحوم الأضاحي فوق ثلاثة أيام", en: "The meaning of the transmitted prohibition on storing udhiyya meat beyond three days", ur: "قربانی کا گوشت تین دن سے زیادہ رکھنے کی منع کا معنی", es: "El significado de la prohibición transmitida de almacenar carne udhiyya más allá de tres días" }
summary:
  ar: "سائل سأل عن معنى النهي الوارد في السنة عن ادخار لحوم الأضاحي فوق ثلاثة أيام. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20993)⁩ أن النهي الوارد عن ادخار لحوم الأضاحي فوق ثلاثة أيام كان مخصوصًا بسنة معينة وبيّن الجواب وجهه على وجهه."
  en: "A questioner asked the meaning of the Sunna's prohibition on storing sacrificial meat beyond three days. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20993) answered that the prohibition was specific to a particular year, which the answer explains."
  ur: "ایک سائل نے قربانی کا گوشت تین دن سے زیادہ رکھنے سے متعلق منقول منع کا معنی پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20993)⁩ نے جواب دیا کہ یہ منع ایک مخصوص سال کے لیے تھی جو جواب میں بیان ہوئی۔"
  es: "Un consultante preguntó por el significado de la prohibición sunna de almacenar carne de sacrificio durante más de tres días. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20993) respondió que la prohibición era específica de un año en particular, lo cual se explica en la respuesta."
