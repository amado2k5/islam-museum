id: work/fatwa-aliftaa-jo-a-brokers-fee-on-inherited-land
class: work
kind: fatwa
label: { ar: "خصم أجرة السمسار من ثمن أرض الورثة", en: "Deducting a broker's fee from the price of heirs' land", ur: "ورثا کی زمین کی قیمت سے دلال کی اجرت کاٹنا" }
summary:
  ar: "سؤال عن أرض مشتركة بين ورثة بيعت عن طريق سمسار، أجابت فيه دائرة الإفتاء العام الأردنية بأن أجرة السمسار تُخصم من الثمن قبل القسمة ويتحملها كل وارث بقدر حصته، إذا رضي جميع الورثة بالبيع عن طريقه. أجابت الدائرة بأن العلاقة بين الورثة في الميراث شركة ملك، يتحمل فيها كل شريك من النفقات بقدر حصته لأن الغرم بالغنم، وأجرة السمسار من نفقات قسمة التركة، ونقلت عن زكريا الأنصاري في أسنى المطالب أن أجرة القاسم توزع على قدر الحصص لا على عدد الرؤوس. وقالت إن ورثة زوجة الأب إن تم البيع بإذنهم تحملوا أجرة السمسار مع بقية الورثة، لأن السمسار لا يعمل إلا بأجرة، والمعروف عرفًا كالمشروط شرطًا. وخلصت إلى أن أجرة السمسار تُخصم من ثمن الأرض قبل تقسيمه إذا رضي جميع الورثة بالبيع عن طريقه، ويجري ذلك على ورثة زوجة الأب ما داموا وافقوا على البيع."
  en: "A question about land jointly owned by heirs and sold through a broker, in which Jordan's General Iftaa Department answered that the broker's fee is deducted from the price before division, each heir bearing it in proportion to his share, provided all the heirs agreed to sell through the broker. The Department answered that heirs are joint owners of the estate, and in joint ownership each partner bears costs in proportion to his share, since liability follows gain; the broker's fee is a cost of dividing the estate, and it quoted Zakariyya al-Ansari's Asna al-Matalib that a divider's fee is split by shares, not by heads. It said that if the sale was made with the permission of the father's wife's heirs, they bear the broker's fee with the other heirs, since a broker works only for a fee, and what is customary counts as if stipulated. It concluded that the broker's fee is deducted from the land's price before division if all the heirs agreed to sell through him, and this applies to the father's wife's heirs too, as long as they agreed to the sale."
  ur: "ورثا کی مشترکہ زمین کے بارے میں سوال جو دلال کے ذریعے بیچی گئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر تمام ورثا دلال کے ذریعے بیع پر راضی تھے تو اس کی اجرت تقسیم سے پہلے قیمت سے کاٹی جائے اور ہر وارث اپنے حصے کے مطابق اسے برداشت کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ میراث میں ورثا کا تعلق شرکتِ ملک کا ہے، جس میں ہر شریک اپنے حصے کے مطابق اخراجات برداشت کرتا ہے کیونکہ نقصان نفع کے ساتھ ہے؛ دلال کی اجرت ترکہ کی تقسیم کے اخراجات میں سے ہے، اور اس نے زکریا الانصاری کی اسنی المطالب سے نقل کیا کہ تقسیم کرنے والے کی اجرت حصوں کے مطابق بٹتی ہے، افراد کی تعداد کے مطابق نہیں۔ اس نے کہا کہ اگر بیع والد کی بیوی کے ورثا کی اجازت سے ہوئی تو وہ بھی دیگر ورثا کے ساتھ دلال کی اجرت برداشت کریں گے، کیونکہ دلال اجرت کے بغیر کام نہیں کرتا اور عرف میں معروف چیز شرط کی طرح ہے۔ اس نے نتیجہ نکالا کہ اگر تمام ورثا دلال کے ذریعے بیع پر راضی تھے تو اس کی اجرت تقسیم سے پہلے زمین کی قیمت سے کاٹی جائے، اور یہی حکم والد کی بیوی کے ورثا پر بھی ہے جب تک وہ بیع پر راضی تھے۔"
