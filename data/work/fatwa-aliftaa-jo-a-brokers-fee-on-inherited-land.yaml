id: work/fatwa-aliftaa-jo-a-brokers-fee-on-inherited-land
class: work
kind: fatwa
label: { ar: "خصم أجرة السمسار من ثمن أرض الورثة", en: "Deducting a broker's fee from the price of heirs' land", ur: "ورثا کی زمین کی قیمت سے دلال کی اجرت کاٹنا", es: "Deducir la comisión del agente inmobiliario del precio de los terrenos de los herederos.", fr: "Déduire les honoraires du courtier du prix des terres héritées", tr: "Aracı ücretinin mirasçıların arazisinin fiyatından düşülmesi", id: "Pengurangan biaya broker dari harga tanah ahli waris" }
summary:
  ar: "سؤال عن أرض مشتركة بين ورثة بيعت عن طريق سمسار، أجابت فيه دائرة الإفتاء العام الأردنية بأن أجرة السمسار تُخصم من الثمن قبل القسمة ويتحملها كل وارث بقدر حصته، إذا رضي جميع الورثة بالبيع عن طريقه. أجابت الدائرة بأن العلاقة بين الورثة في الميراث شركة ملك، يتحمل فيها كل شريك من النفقات بقدر حصته لأن الغرم بالغنم، وأجرة السمسار من نفقات قسمة التركة، ونقلت عن زكريا الأنصاري في أسنى المطالب أن أجرة القاسم توزع على قدر الحصص لا على عدد الرؤوس. وقالت إن ورثة زوجة الأب إن تم البيع بإذنهم تحملوا أجرة السمسار مع بقية الورثة، لأن السمسار لا يعمل إلا بأجرة، والمعروف عرفًا كالمشروط شرطًا. وخلصت إلى أن أجرة السمسار تُخصم من ثمن الأرض قبل تقسيمه إذا رضي جميع الورثة بالبيع عن طريقه، ويجري ذلك على ورثة زوجة الأب ما داموا وافقوا على البيع."
  en: "A question about land jointly owned by heirs and sold through a broker, in which Jordan's General Iftaa Department answered that the broker's fee is deducted from the price before division, each heir bearing it in proportion to his share, provided all the heirs agreed to sell through the broker. The Department answered that heirs are joint owners of the estate, and in joint ownership each partner bears costs in proportion to his share, since liability follows gain; the broker's fee is a cost of dividing the estate, and it quoted Zakariyya al-Ansari's Asna al-Matalib that a divider's fee is split by shares, not by heads. It said that if the sale was made with the permission of the father's wife's heirs, they bear the broker's fee with the other heirs, since a broker works only for a fee, and what is customary counts as if stipulated. It concluded that the broker's fee is deducted from the land's price before division if all the heirs agreed to sell through him, and this applies to the father's wife's heirs too, as long as they agreed to the sale."
  ur: "ورثا کی مشترکہ زمین کے بارے میں سوال جو دلال کے ذریعے بیچی گئی، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر تمام ورثا دلال کے ذریعے بیع پر راضی تھے تو اس کی اجرت تقسیم سے پہلے قیمت سے کاٹی جائے اور ہر وارث اپنے حصے کے مطابق اسے برداشت کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ میراث میں ورثا کا تعلق شرکتِ ملک کا ہے، جس میں ہر شریک اپنے حصے کے مطابق اخراجات برداشت کرتا ہے کیونکہ نقصان نفع کے ساتھ ہے؛ دلال کی اجرت ترکہ کی تقسیم کے اخراجات میں سے ہے، اور اس نے زکریا الانصاری کی اسنی المطالب سے نقل کیا کہ تقسیم کرنے والے کی اجرت حصوں کے مطابق بٹتی ہے، افراد کی تعداد کے مطابق نہیں۔ اس نے کہا کہ اگر بیع والد کی بیوی کے ورثا کی اجازت سے ہوئی تو وہ بھی دیگر ورثا کے ساتھ دلال کی اجرت برداشت کریں گے، کیونکہ دلال اجرت کے بغیر کام نہیں کرتا اور عرف میں معروف چیز شرط کی طرح ہے۔ اس نے نتیجہ نکالا کہ اگر تمام ورثا دلال کے ذریعے بیع پر راضی تھے تو اس کی اجرت تقسیم سے پہلے زمین کی قیمت سے کاٹی جائے، اور یہی حکم والد کی بیوی کے ورثا پر بھی ہے جب تک وہ بیع پر راضی تھے۔"
  es: "Una pregunta sobre un terreno propiedad conjunta de herederos y vendido a través de un intermediario, en la que el Departamento General de Iftaa de Jordania respondió que la comisión del intermediario se deduce del precio antes de la división, y cada heredero la asume en proporción a su parte, siempre que todos los herederos hayan acordado vender a través del intermediario. El Departamento respondió que los herederos son copropietarios del patrimonio, y en la copropiedad cada socio asume los gastos en proporción a su parte, ya que la responsabilidad sigue a la ganancia; la comisión del intermediario es un costo de la división del patrimonio, y citó la obra Asna al-Matalib de Zakariyya al-Ansari, donde se indica que la comisión del intermediario se divide por partes, no por cabezas. Añadió que si la venta se realizó con el permiso de los herederos de la esposa del padre, estos asumen la comisión del intermediario junto con los demás herederos, ya que un intermediario trabaja solo por una comisión, y lo que es costumbre se considera estipulado. Se concluyó que la comisión del agente inmobiliario se deduce del precio del terreno antes de su división si todos los herederos acordaron vender a través de él, y esto también se aplica a los herederos de la esposa del padre, siempre que hayan dado su consentimiento para la venta."
  fr: "Concernant une question relative à la vente d'un terrain détenu en copropriété par des héritiers par l'intermédiaire d'un courtier, le Département général de la Iftaa de Jordanie a répondu que les honoraires du courtier sont déduits du prix de vente avant partage, chaque héritier les supportant proportionnellement à sa part, à condition que tous les héritiers aient consenti à la vente par l'intermédiaire du courtier. Le Département a expliqué que les héritiers sont copropriétaires du bien et que, dans ce cas, chaque copropriétaire supporte les coûts proportionnellement à sa part, la responsabilité étant liée au gain. Les honoraires du courtier constituent un coût de partage du patrimoine. Le Département a cité l'ouvrage d'Asna al-Matalib de Zakariyya al-Ansari, selon lequel les honoraires du diviseur sont répartis par parts, et non par personne. Il a précisé que si la vente a été effectuée avec l'accord des héritiers de la veuve du père, ces derniers supportent les honoraires du courtier avec les autres héritiers, car un courtier n'est rémunéré que par des honoraires, et ce qui est coutumier vaut convention. Il a été conclu que les honoraires du courtier sont déduits du prix du terrain avant le partage si tous les héritiers ont accepté de vendre par son intermédiaire, et cela s'applique également aux héritiers de la femme du père, pourvu qu'ils aient consenti à la vente."
  tr: "Komisyoncu aracılığıyla satılan mirasçılar tarafından paylaşılan bir arazi hakkında bir soru, Ürdün Genel Fetva Dairesi, komisyoncunun ücretinin bölünme öncesi fiyattan düşüldüğünü ve tüm varislerin satışa onay verdiği sürece her varisin payına göre karşılandığını belirtti. Bakanlık, miras yoluyla varisler arasındaki ilişkinin mülkiyet şirketi olduğunu, her ortağın payına göre masrafları üstlendiğini, çünkü ücret koyunlar için olduğunu ve komisyoncunun ücretinin mirasın bölünme giderlerinin bir parçası olduğunu yanıtladı. Asna Al-Matalib'de Zakaria Al-Ansari'nin alıntısında, dağıtıcı ücretinin kişi sayısına değil, paylara göre dağıtıldığını belirtti. Satış onların izniyle yapılırsa, kayınpederin varislerinin diğer mirasçılarla birlikte komisyoncunun ücretini üstlendiğini, çünkü komisyoncunun sadece ücret karşılığında çalıştığını ve bu şartın koşullu olduğu adettilen bir şekilde belirtildiğini belirtti. Komisyon, tüm varisler satışa onay verirse, aracı ücretinin arazinin bölünmesinden önceki fiyatından düşüldüğü ve üvey annenin varisleri için de geçerli olduğu sonucuna varıldı."
  id: "Sebuah pertanyaan tentang tanah yang dibagi oleh ahli waris yang dijual melalui broker, di mana Departemen Fatwa Umum Yordania menjawab bahwa biaya broker dipotong dari harga sebelum pembagian dan ditanggung oleh setiap ahli waris sesuai dengan bagian mereka, asalkan semua ahli waris setuju untuk penjualan melalui beliau. Departemen menjawab bahwa hubungan antara ahli waris dalam warisan adalah perusahaan yang dimiliki, di mana setiap mitra menanggung biaya sesuai dengan bagiannya karena biaya tersebut untuk domba, dan biaya broker adalah bagian dari biaya pembagian harta. Departemen mengutip Zakaria Al-Ansari dalam Asna Al-Matalib bahwa biaya distributor dibagi berdasarkan saham, bukan jumlah kepala. Departemen tersebut menyatakan bahwa jika penjualan dilakukan dengan izin mereka, ahli waris ayah mertua menanggung biaya broker bersama ahli waris lainnya, karena broker hanya bekerja dengan biaya, dan biasanya syarat tersebut bersyarat. Kesimpulan tersebut menyimpulkan bahwa biaya broker dipotong dari harga tanah sebelum pembagian tanah jika semua ahli waris setuju untuk penjualan melalui beliau, dan hal ini berlaku untuk ahli waris ibu tiri selama mereka setuju dengan penjualan tersebut."
