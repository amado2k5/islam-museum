id: work/fatwa-dar-alifta-eg-udhiyya-for-the-dead
class: work
kind: fatwa
label: { ar: "حكم الأضحية عن الميت", en: "Sacrificing an udhiyya for the deceased", ur: "میت کی طرف سے قربانی", es: "Sacrificar un udhiyya por el difunto", fr: "Sacrifier un udhiyya pour le défunt" }
summary:
  ar: "سائل سأل عن الأضحية عن الميت. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20771)⁩ أن الأضحية عن الميت مشروعة وتكون في مال القائم بها على سبيل الاستحباب والتبرع لا الوجوب لكن إذا أوصى الميت بها وجبت على ما فصّل الجواب."
  en: "A questioner asked about the udhiyya for the deceased. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20771) answered that it is lawful — performed from the doer's money as recommended devotion, not duty — but if the deceased bequeathed it, it is obligatory, as the answer details."
  ur: "ایک سائل نے میت کی طرف سے قربانی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20771)⁩ نے جواب دیا کہ یہ جائز ہے اور اپنے مال سے مستحب اور تبرع ہے واجب نہیں؛ البتہ میت نے وصیت کی ہو تو واجب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de la udhiyya para el difunto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20771) respondió que es lícito —realizado con el dinero del que lo realiza como devoción recomendada, no como deber— pero si el difunto lo legó, es obligatorio, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'udhiyya pour le défunt. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20771) a répondu que cet acte est licite – accompli avec les fonds de celui qui le fait, à titre de dévotion recommandée et non d'obligation – mais que s'il a été légué par le défunt, il est obligatoire, comme le précise la réponse."
