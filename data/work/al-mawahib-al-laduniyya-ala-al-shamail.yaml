summary:
  ar: "شرح إبراهيم بن محمد الباجوري ⁦(1198–1277هـ)⁩، شيخ الجامع الأزهر، على الشمائل المحمدية للترمذي، كتبه «كتابة منتخبة من الشراح» قبله كالسيوطي وعلي القاري والمناوي وجسوس، وطبعه محمد عوامة سنة 1422هـ/2001م مع حواشٍ في تصويب أمور حديثية."
  en: "The commentary of Ibrahim ibn Muhammad al-Bajuri (1198–1277 AH), shaykh of al-Azhar, on al-Tirmidhi's al-Shama'il al-Muhammadiyya, written as 'a selection from the commentators' before him such as al-Suyuti, Ali al-Qari, al-Munawi and Jassus; Muhammad Awwama published it in 1422/2001 with notes correcting points of hadith."
