id: work/fatwa-dar-alifta-eg-winter-the-believers-booty
class: work
kind: fatwa
label: { ar: "مظاهر كون الشتاء غنيمة المؤمن", en: "How winter is the believer's booty", ur: "سردیوں کا مومن کے لیے غنیمت ہونا", es: "Cómo el invierno es el botín del creyente", fr: "Comment l'hiver est le butin du croyant" }
summary:
  ar: "سائل سأل عن معنى أن الشتاء غنيمة المؤمن. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22271)⁩ أن فصل الشتاء غنيمة للمؤمن وعليه أن يغتنمه في التقرب إلى الله بإسباغ الوضوء وقيام الليل وصوم النهار، وبيّن الجواب مظاهر ذلك على وجهه."
  en: "A questioner asked about the saying that winter is the believer's booty. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22271) answered that winter is a gain for the believer, to be seized in drawing near to God through completing wudu despite the cold, night prayer, and daytime fasting; the answer sets out its manifestations."
  ur: "ایک سائل نے اس قول کا مطلب پوچھا کہ سردی مومن کے لیے غنیمت ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22271)⁩ نے جواب دیا کہ سردی کا موسم مومن کے لیے غنیمت ہے جسے وہ سردی کے باوجود وضو مکمل کرنے، تہجد اور دن کے روزے سے اللہ کی قربت میں حاصل کرے؛ جواب میں اس کے مظاہر بیان ہوئے۔"
  es: "Un interlocutor preguntó sobre el dicho de que el invierno es el botín del creyente. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22271) respondió que el invierno es una ganancia para el creyente, que debe aprovecharse para acercarse a Dios mediante la realización de la ablución (wudu) a pesar del frío, la oración nocturna y el ayuno diurno; la respuesta expone sus manifestaciones."
  fr: "Un internaute a posé une question concernant l'adage selon lequel l'hiver est une aubaine pour le croyant. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22271) a répondu que l'hiver est un gain pour le croyant, à saisir pour se rapprocher de Dieu en accomplissant les ablutions malgré le froid, la prière nocturne et le jeûne diurne; la réponse en expose les manifestations."
