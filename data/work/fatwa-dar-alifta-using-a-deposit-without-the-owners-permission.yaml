id: work/fatwa-dar-alifta-using-a-deposit-without-the-owners-permission
class: work
kind: fatwa
label: { ar: "حكم استعمال الوديعة بغير إذن صاحبها", en: "Using a deposited item without its owner's permission", ur: "مالک کی اجازت کے بغیر امانت کی چیز استعمال کرنے کا حکم" }
summary:
  ar: "سؤال من امرأة تركت عندها صديقتها المسافرة ثلاثة أشهر جهاز حاسوب محمول جديدًا لتحفظه، ثم تعطل حاسوبها هي وتعذر إصلاحه، فهل تستعمل جهاز صديقتها دون علمها؛ أجابت فيه دار الإفتاء المصرية بأن ترك الجهاز على سبيل الحفظ وديعة بغير أجر، وهي عقد جائز شرعًا، ويبقى أمانة عندها حتى ترده، ويحرم استعماله دون علم صاحبته واستئذانها، وإلا كان خرقًا لمقتضى عقد الوديعة وخيانة للأمانة. بينت الدار أن الشريعة جعلت حفظ الودائع من مقاصدها بآيتي النساء 58 والأنفال 27 وحديث أدِّ الأمانة إلى من ائتمنك، وعرّفت الوديعة بتعريف الخطيب الشربيني في مغني المحتاج والمادة 718 من القانون المدني المصري، ونقلت عن ابن قدامة إجماع علماء كل عصر على جواز الإيداع، وقررت أن استعمال المودَع الوديعةَ دون إذن المالك محرم بإجماع علماء الأمة لأن يده يد أمانة محضة، ناقلة حديث لا يحل لامرئ من مال أخيه إلا ما طابت به نفسه، وإجماع ابن المنذر على أن المودَع ممنوع من استعمال الوديعة، وعدّ النووي في روضة الطالبين الانتفاع بها من وجوه التقصير، والمادة 711 من مرشد الحيران لمحمد قدري باشا، والمادة 719 من القانون المدني."
  en: "A question from a woman whose friend, travelling abroad for three months, left a new laptop with her for safekeeping; her own laptop then broke beyond repair, and she asked whether she may use her friend's device without her knowledge. Dar al-Ifta al-Misriyya answered that leaving the device for safekeeping is an unpaid deposit, a contract valid in sharia, that it remains a trust in her hands until she returns it, and that using it without the owner's knowledge and permission is forbidden, since it would breach the deposit contract and betray the trust. Dar al-Ifta explained that sharia made the safekeeping of deposits one of its purposes, citing al-Nisa 4:58, al-Anfal 8:27 and the hadith 'deliver the trust to the one who entrusted you', defined the deposit from al-Khatib al-Shirbini's Mughni al-Muhtaj and article 718 of Egypt's Civil Code, quoted Ibn Qudama on the consensus of scholars of every age that depositing is permitted, and ruled that a depositary's use of the deposit without the owner's express or implied permission is forbidden by the consensus of the scholars of the community, because his possession is one of pure trust; it cited the hadith that nothing of a brother's property is lawful except what he willingly gives, Ibn al-Mundhir's report of consensus that the depositary is barred from using the deposit, al-Nawawi in Rawdat al-Talibin counting use among the forms of negligence, article 711 of Muhammad Qadri Pasha's Murshid al-Hayran and article 719 of the Civil Code."
  ur: "ایک خاتون کا سوال جس کی دوست تین ماہ کے لیے بیرون ملک جاتے ہوئے ایک نیا لیپ ٹاپ حفاظت کے لیے اس کے پاس چھوڑ گئی؛ پھر اس کا اپنا لیپ ٹاپ خراب ہو گیا اور مرمت ممکن نہ رہی، تو اس نے پوچھا کہ کیا وہ دوست کے علم کے بغیر اس کا آلہ استعمال کر سکتی ہے۔ دار الافتاء مصر نے جواب دیا کہ حفاظت کے لیے آلہ چھوڑنا بلا اجرت ودیعت ہے، جو شرعاً جائز عقد ہے، یہ واپس کرنے تک اس کے پاس امانت رہتا ہے، اور مالکہ کے علم اور اجازت کے بغیر اسے استعمال کرنا حرام ہے، کیونکہ یہ عقدِ ودیعت کے تقاضے کی خلاف ورزی اور امانت میں خیانت ہے۔ دار الافتاء نے بیان کیا کہ شریعت نے امانتوں کی حفاظت کو اپنے مقاصد میں رکھا، النساء 58، الانفال 27 اور حدیث «امانت اسے ادا کرو جس نے تمہیں امین بنایا» سے، خطیب شربینی کی مغنی المحتاج اور مصر کے دیوانی قانون کی دفعہ 718 سے ودیعت کی تعریف کی، ابن قدامہ سے ہر زمانے کے علما کا اجماع نقل کیا کہ ودیعت رکھنا جائز ہے، اور فیصلہ کیا کہ امین کا مالک کی صریح یا ضمنی اجازت کے بغیر ودیعت استعمال کرنا امت کے علما کے اجماع سے حرام ہے کیونکہ اس کا قبضہ خالص امانت کا ہے؛ اس نے حدیث نقل کی کہ بھائی کے مال میں سے صرف وہی حلال ہے جو وہ خوشدلی سے دے، ابن المنذر کا اجماع کہ امین ودیعت کے استعمال سے روکا گیا ہے، نووی کا روضۃ الطالبین میں استعمال کو کوتاہی کی صورتوں میں شمار کرنا، محمد قدری پاشا کی مرشد الحیران کی دفعہ 711 اور دیوانی قانون کی دفعہ 719۔"
