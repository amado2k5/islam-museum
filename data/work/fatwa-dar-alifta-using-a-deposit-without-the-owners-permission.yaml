id: work/fatwa-dar-alifta-using-a-deposit-without-the-owners-permission
class: work
kind: fatwa
label: { ar: "حكم استعمال الوديعة بغير إذن صاحبها", en: "Using a deposited item without its owner's permission", ur: "مالک کی اجازت کے بغیر امانت کی چیز استعمال کرنے کا حکم", es: "Utilizar un objeto depositado sin el permiso de su propietario.", fr: "Utiliser un objet déposé sans l'autorisation de son propriétaire", tr: "Depozitonun sahibinin izni olmadan kullanılmasına ilişkin karar", id: "Putusan tentang penggunaan deposit tanpa izin pemilik" }
summary:
  ar: "سؤال من امرأة تركت عندها صديقتها المسافرة ثلاثة أشهر جهاز حاسوب محمول جديدًا لتحفظه، ثم تعطل حاسوبها هي وتعذر إصلاحه، فهل تستعمل جهاز صديقتها دون علمها؛ أجابت فيه دار الإفتاء المصرية بأن ترك الجهاز على سبيل الحفظ وديعة بغير أجر، وهي عقد جائز شرعًا، ويبقى أمانة عندها حتى ترده، ويحرم استعماله دون علم صاحبته واستئذانها، وإلا كان خرقًا لمقتضى عقد الوديعة وخيانة للأمانة. بينت الدار أن الشريعة جعلت حفظ الودائع من مقاصدها بآيتي النساء 58 والأنفال 27 وحديث أدِّ الأمانة إلى من ائتمنك، وعرّفت الوديعة بتعريف الخطيب الشربيني في مغني المحتاج والمادة 718 من القانون المدني المصري، ونقلت عن ابن قدامة إجماع علماء كل عصر على جواز الإيداع، وقررت أن استعمال المودَع الوديعةَ دون إذن المالك محرم بإجماع علماء الأمة لأن يده يد أمانة محضة، ناقلة حديث لا يحل لامرئ من مال أخيه إلا ما طابت به نفسه، وإجماع ابن المنذر على أن المودَع ممنوع من استعمال الوديعة، وعدّ النووي في روضة الطالبين الانتفاع بها من وجوه التقصير، والمادة 711 من مرشد الحيران لمحمد قدري باشا، والمادة 719 من القانون المدني."
  en: "A question from a woman whose friend, travelling abroad for three months, left a new laptop with her for safekeeping; her own laptop then broke beyond repair, and she asked whether she may use her friend's device without her knowledge. Dar al-Ifta al-Misriyya answered that leaving the device for safekeeping is an unpaid deposit, a contract valid in sharia, that it remains a trust in her hands until she returns it, and that using it without the owner's knowledge and permission is forbidden, since it would breach the deposit contract and betray the trust. Dar al-Ifta explained that sharia made the safekeeping of deposits one of its purposes, citing al-Nisa 4:58, al-Anfal 8:27 and the hadith 'deliver the trust to the one who entrusted you', defined the deposit from al-Khatib al-Shirbini's Mughni al-Muhtaj and article 718 of Egypt's Civil Code, quoted Ibn Qudama on the consensus of scholars of every age that depositing is permitted, and ruled that a depositary's use of the deposit without the owner's express or implied permission is forbidden by the consensus of the scholars of the community, because his possession is one of pure trust; it cited the hadith that nothing of a brother's property is lawful except what he willingly gives, Ibn al-Mundhir's report of consensus that the depositary is barred from using the deposit, al-Nawawi in Rawdat al-Talibin counting use among the forms of negligence, article 711 of Muhammad Qadri Pasha's Murshid al-Hayran and article 719 of the Civil Code."
  ur: "ایک خاتون کا سوال جس کی دوست تین ماہ کے لیے بیرون ملک جاتے ہوئے ایک نیا لیپ ٹاپ حفاظت کے لیے اس کے پاس چھوڑ گئی؛ پھر اس کا اپنا لیپ ٹاپ خراب ہو گیا اور مرمت ممکن نہ رہی، تو اس نے پوچھا کہ کیا وہ دوست کے علم کے بغیر اس کا آلہ استعمال کر سکتی ہے۔ دار الافتاء مصر نے جواب دیا کہ حفاظت کے لیے آلہ چھوڑنا بلا اجرت ودیعت ہے، جو شرعاً جائز عقد ہے، یہ واپس کرنے تک اس کے پاس امانت رہتا ہے، اور مالکہ کے علم اور اجازت کے بغیر اسے استعمال کرنا حرام ہے، کیونکہ یہ عقدِ ودیعت کے تقاضے کی خلاف ورزی اور امانت میں خیانت ہے۔ دار الافتاء نے بیان کیا کہ شریعت نے امانتوں کی حفاظت کو اپنے مقاصد میں رکھا، النساء 58، الانفال 27 اور حدیث «امانت اسے ادا کرو جس نے تمہیں امین بنایا» سے، خطیب شربینی کی مغنی المحتاج اور مصر کے دیوانی قانون کی دفعہ 718 سے ودیعت کی تعریف کی، ابن قدامہ سے ہر زمانے کے علما کا اجماع نقل کیا کہ ودیعت رکھنا جائز ہے، اور فیصلہ کیا کہ امین کا مالک کی صریح یا ضمنی اجازت کے بغیر ودیعت استعمال کرنا امت کے علما کے اجماع سے حرام ہے کیونکہ اس کا قبضہ خالص امانت کا ہے؛ اس نے حدیث نقل کی کہ بھائی کے مال میں سے صرف وہی حلال ہے جو وہ خوشدلی سے دے، ابن المنذر کا اجماع کہ امین ودیعت کے استعمال سے روکا گیا ہے، نووی کا روضۃ الطالبین میں استعمال کو کوتاہی کی صورتوں میں شمار کرنا، محمد قدری پاشا کی مرشد الحیران کی دفعہ 711 اور دیوانی قانون کی دفعہ 719۔"
  es: "Una mujer preguntó si podía usar el dispositivo de su amiga, quien, tras viajar al extranjero durante tres meses, le había dejado una computadora portátil nueva para que la guardara. Posteriormente, su propia computadora portátil se averió irreparablemente y la mujer preguntó si podía usar el dispositivo de su amiga sin su conocimiento. Dar al-Ifta al-Misriyya respondió que dejar el dispositivo en custodia constituye un depósito impago, un contrato válido según la sharia, que permanece bajo custodia hasta que lo devuelva y que usarlo sin el conocimiento y el permiso de la propietaria está prohibido, ya que constituiría un incumplimiento del contrato de depósito y una traición a la confianza depositada. Dar al-Ifta explicó que la sharia hizo de la custodia de los depósitos uno de sus propósitos, citando al-Nisa 4:58, al-Anfal 8:27 y el hadiz 'entrega la confianza a quien te la confió', definió el depósito a partir del Mughni al-Muhtaj de al-Khatib al-Shirbini y el artículo 718 del Código Civil de Egipto, citó a Ibn Qudama sobre el consenso de los eruditos de todas las épocas de que depositar está permitido, y dictaminó que el uso del depósito por parte de un depositario sin el permiso expreso o implícito del propietario está prohibido por el consenso de los eruditos de la comunidad, porque su posesión es de pura confianza; Citó el hadiz de que nada de la propiedad de un hermano es lícito excepto lo que él da voluntariamente, el informe de consenso de Ibn al-Mundhir de que el depositario tiene prohibido usar el depósito, al-Nawawi en Rawdat al-Talibin considerando el uso entre las formas de negligencia, el artículo 711 del Murshid al-Hayran de Muhammad Qadri Pasha y el artículo 719 del Código Civil."
  fr: "Une femme a posé une question à Dar al-Ifta al-Misriyya. Son amie, partie en voyage à l'étranger pour trois mois, lui avait confié un ordinateur portable neuf. Son propre ordinateur étant devenu irréparable, elle a demandé si elle pouvait utiliser celui de son amie à son insu. Dar al-Ifta al-Misriyya a répondu que le dépôt de l'appareil constitue un dépôt non rémunéré, un contrat valable selon la charia, que l'ordinateur reste sous la responsabilité de son amie jusqu'à sa restitution, et que son utilisation sans son consentement est interdite, car elle constituerait une violation du contrat de dépôt et un abus de confiance. Dar al-Ifta a expliqué que la charia avait fait de la conservation des dépôts l'un de ses objectifs, citant al-Nisa 4:58, al-Anfal 8:27 et le hadith « remettez le dépôt à celui qui vous l'a confié », a défini le dépôt à partir du Mughni al-Muhtaj d'al-Khatib al-Shirbini et de l'article 718 du Code civil égyptien, a cité Ibn Qudama sur le consensus des savants de tous les âges selon lequel le dépôt est autorisé, et a statué que l'utilisation du dépôt par un dépositaire sans la permission expresse ou implicite du propriétaire est interdite par le consensus des savants de la communauté, car sa possession est une pure confiance; Il a cité le hadith selon lequel rien des biens d'un frère n'est licite sauf ce qu'il donne volontairement, le rapport d'Ibn al-Mundhir sur le consensus selon lequel le dépositaire est interdit d'utiliser le dépôt, al-Nawawi dans Rawdat al-Talibin comptant l'utilisation parmi les formes de négligence, l'article 711 du Murshid al-Hayran de Muhammad Qadri Pasha et l'article 719 du Code civil."
  tr: "Seyahat eden arkadaşına üç ay boyunca yeni bir dizüstü bilgisayar bırakan ve sonra bilgisayarı bozulup tamir edilemediği bir kadından gelen bir soru. Arkadaşının cihazını onun haberi olmadan mı kullanıyor? Mısırlı Dar al-Ifta, cihazı güvenli bir saklama olarak bırakmanın ödemesiz bir depozito olduğunu, bunun İslam hukukuna göre izin verilen bir sözleşme olduğunu ve cihazı geri verilene kadar kendisiyle birlikte kaldığını yanıtladı. Cihazın sahibi ve izni olmadan kullanılması yasaktır; aksi takdirde depozito sözleşmesinin ihlali ve güvenin ihlali olur. Dar, Şeriatın depozitoları korumayı amaçlarından biri haline getirdiğini En-Nisa 58 ve El-Enfal 27 ayetlerinde ve 'Güveni sana emanet edenlere teslim et' hadisinde açıkladı. Ayrıca Mughni al-Muhtaj'da El-Hatib el-Şarbini tarafından 'depozito' tanımını ve Mısır Medeni Kanunu'nun 718. maddesini tanıttı. İbn Kudema'yı her dönemin alimlerinin emanet ettirmenin caiz olup olmadığı konusunda uzlaşması olarak alıntıladı ve Mülk sahibinin izni olmadan depozito, Ümmet âlimleri tarafından oybirliğiyle yasaktır çünkü onun eli tamamen güvenilirdir. Bu hadis, kardeşinin malını sadece istediği şekilde kullanamayacağına dair bir hadis ve İbn al-Mundhir'in depozitoyu kullananın yasak olduğu konusunda uzlaştığını ifade eder. El-Nawavi, ihmal durumunda bundan yararlanmayı düşündü, Muhammed Kadri Paşa'nın Murşid el-Hiran'ın 711. maddesi ve Medeni Kanun'un 719. maddesi."
  id: "Sebuah pertanyaan dari seorang wanita yang meninggalkan laptop baru kepada temannya selama tiga bulan untuk menyimpannya, lalu komputernya rusak dan tidak bisa diperbaiki. Apakah dia menggunakan perangkat temannya tanpa sepengetahuannya? Dar al-Ifta Mesir menjawab bahwa meninggalkan perangkat sebagai tempat penyimpanan adalah deposit tanpa pembayaran, yang merupakan kontrak yang diperbolehkan menurut hukum Islam, dan tetap menjadi trust miliknya sampai dikembalikan. Menggunakannya tanpa sepengetahuan dan izin pemiliknya dilarang; jika tidak, itu akan menjadi pelanggaran kontrak deposit dan pelanggaran kepercayaan. Dar menjelaskan bahwa Syariah menjadikan perlindungan deposit sebagai salah satu tujuannya dalam ayat An-Nisa 58 dan Al-Anfal 27, serta hadis 'Serahkan kepercayaan kepada mereka yang mempercayakan kepadamu.' Ia juga memperkenalkan definisi 'deposit' oleh Al-Khatib Al-Sharbini dalam Mughni al-Muhtaj dan Pasal 718 Kitab Undang-Undang Hukum Perdata Mesir. Ia mengutip Ibn Qudamah sebagai konsensus para ulama dari setiap era mengenai diperbolehkannya deposit, dan memutuskan bahwa menggunakan deposit tanpa izin pemiliknya dilarang secara bulat oleh para ulama Ummah karena tangannya murni dapat dipercaya. Surat itu menyampaikan hadits bahwa tidak ada yang diperbolehkan menggunakan harta saudaranya kecuali apa yang diinginkannya, dan konsensus Ibn al-Mundhir bahwa penyimpan dilarang menggunakan deposit. Al-Nawawi mempertimbangkan untuk mendapatkan manfaat dari deposit tersebut dalam kasus kelalaian, Pasal 711 Murshid al-Hiran oleh Muhammad Qadri Pasha, dan Pasal 719 Kitab Undang-Undang Sipil."
