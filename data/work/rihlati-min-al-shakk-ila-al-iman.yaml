label: { ar: "رحلتي من الشك إلى الإيمان", en: "Rihlati min al-Shakk ila al-Iman", ur: "رحلتی من الشک الی الایمان" }
summary:
  ar: "كتاب مصطفى محمود في سيرته الفكرية، يروي فيه أسئلته منذ المراهقة، ومرحلتي النظرة المادية ووحدة الوجود، ثم وصوله بالعلم والتأمل إلى «الفكرة الإسلامية الكاملة عن الله»، في فصول أولها «الله» وآخرها «المسيخ الدجال» {cite:mm-rihla-min-al-shakk-maarif p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 14} {cite:mm-rihla-min-al-shakk-maarif p. 90}."
  en: "Mostafa Mahmoud's intellectual autobiography, telling of his questions from adolescence, his materialist and pantheist phases, and his arrival through science and reflection at 'the complete Islamic idea of God', in chapters from 'God' to 'The false messiah' {cite:mm-rihla-min-al-shakk-maarif p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 14} {cite:mm-rihla-min-al-shakk-maarif p. 90}."
  ur: "مصطفیٰ محمود کی فکری خودنوشت، جس میں وہ نوعمری سے اپنے سوالات، مادی نقطۂ نظر اور وحدت الوجود کے مراحل، اور پھر سائنس اور غور و فکر کے ذریعے «اللہ کے مکمل اسلامی تصور» تک پہنچنے کا حال بیان کرتے ہیں، ابواب «اللہ» سے «مسیح دجال» تک {cite:mm-rihla-min-al-shakk-maarif p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 14} {cite:mm-rihla-min-al-shakk-maarif p. 90}۔"
