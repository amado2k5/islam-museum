label: { ar: "حكم تغطية الرأس أثناء الإحرام خوفًا من البرد والمطر", en: "Covering the head during ihram for fear of cold and rain", ur: "سردی اور بارش کے خوف سے احرام میں سر ڈھانپنا" }
summary:
  ar: "سائل سأل عن تغطية الرأس أثناء الإحرام لشدة البرد والمطر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22315)⁩ أنه يجب على الرجل كشف رأسه أثناء الإحرام ويحرم سترها وتغطيتها، فإن اضطر إلى ذلك لشدة برد جاز مع الفدية على ما فصّل الجواب."
  en: "A questioner asked about covering the head during ihram because of severe cold and rain. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22315) answered that a man must keep his head uncovered in ihram and covering it is forbidden; if he is compelled by severe cold it is permitted with the expiation, as the answer details."
  ur: "ایک سائل نے شدید سردی اور بارش کی وجہ سے احرام میں سر ڈھانپنے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22315)⁩ نے جواب دیا کہ مرد پر احرام میں سر کھلا رکھنا واجب ہے اور ڈھانپنا حرام؛ شدید سردی میں مجبوری ہو تو فدیہ کے ساتھ جائز ہے، جیسا کہ جواب میں تفصیل ہے۔"
