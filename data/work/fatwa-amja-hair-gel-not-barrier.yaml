id: work/fatwa-amja-hair-gel-not-barrier
class: work
kind: fatwa
label: { ar: "الجل لا يمنع وصول الماء", en: "Hair gel does not bar the water in wudu", ur: "ہیئر جیل پانی نہیں روکتی", es: "El gel para el cabello no impide que el agua penetre en el wudu.", fr: "Le gel capillaire n'empêche pas l'eau des ablutions.", tr: "Jel, suyun ulaşmasını engellemez", id: "Gel ini tidak mencegah air masuk" }
summary:
  ar: "سأل سائل هل الجل الذي يوضع في الرأس يمنع وصول الماء إليه عند الوضوء فلا يصح الوضوء. أجاب د. صلاح الصاوي ⁦(فتوى رقم 21941 بتاريخ 9 فبراير 2006)⁩ أنه لا يظنه يكون قشرة تمنع وصول الماء على ما فصّل الجواب المختصر."
  en: "A questioner asked whether gel put on the head bars water reaching it in wudu so the wudu fails. Dr. Salah al-Sawi (fatwa no. 21941, 9 February 2006) answered briefly that he does not think it forms a crust barring the water's arrival — as the concise answer states."
  ur: "کیا جیل پانی روکتی ہے؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 21941، 9 فروری 2006)⁩ کے مطابق نہیں — پردہ نہیں بنتی۔"
  es: "Un consultante preguntó si el gel aplicado en la cabeza impide que el agua llegue a ella durante la ablución, invalidándola así. El Dr. Salah al-Sawi (fatwa n.º 21941, 9 de febrero de 2006) respondió brevemente que no cree que forme una costra que impida la llegada del agua, tal como se indica en la respuesta concisa."
  fr: "Un internaute a demandé si le gel appliqué sur la tête empêchait l'eau de pénétrer lors des ablutions, rendant ainsi les ablutions invalides. Le Dr Salah al-Sawi (fatwa n° 21941, 9 février 2006) a répondu brièvement qu'il ne pensait pas que le gel forme une croûte empêchant l'eau d'atteindre la tête, contrairement à ce qu'indique la réponse concise."
  tr: "Bir soru soran kişiye, başa sürülen jelin abdest alma sırasında suyun ulaşmasını engelleyip engellemediği soruldu, dolayısıyla abdest alma geçerli değil. Dr. Salah Al-Sawy (9 Şubat 2006 tarihli 21941 No. Fetva) kısa cevapta ayrıntılı olarak belirtildiği gibi, suyun kendisine ulaşmasını engelleyen bir kabuk olmadığını düşündüğünü belirtti."
  id: "Seorang penanya ditanya apakah gel yang diletakkan di kepala mencegah air menjangkaunya selama wudhu, sehingga mandi tidak sah. Dr. Salah Al-Sawy menjawab (Fatwa No. 21941 tanggal 9 Februari 2006) bahwa ia tidak menganggap kerak yang mencegah air mencapai tubuhnya, seperti yang dijelaskan dalam jawaban singkatnya."
