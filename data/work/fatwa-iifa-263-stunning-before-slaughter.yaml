id: work/fatwa-iifa-263-stunning-before-slaughter
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 263 (8/26) بشأن تدويخ الطيور والحيوانات قبل ذبحها وأثره على شرعية الذبح", en: "IIFA resolution 263 (8/26) on stunning birds and animals before slaughter and its effect on the lawfulness of the slaughter", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 263 (8/26): ذبح سے قبل پرندوں اور جانوروں کو بے ہوش کرنے کا شرعی حکم اور اس کا ذبح کی شرعیت پر اثر", es: "Resolución 263 (8/26) de la IIFA sobre el aturdimiento de aves y animales antes del sacrificio y su efecto en la legalidad del mismo." }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩ في موضوع تدويخ الطيور والحيوانات قبل ذبحها وأثره على شرعية الذبح. اطلع المجمع على البحوث المقدمة وعلى توصيات ندوة علمية نظمها بالتعاون مع الهيئة العامة للغذاء والدواء السعودية بجدة يومي 14 و15 ذو القعدة 1443هـ ⁦(13–14 يونيو 2022م)⁩، وقرر تأجيل البت في الموضوع لمزيد من الدراسة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025) on stunning birds and animals before slaughter and its effect on the lawfulness of the slaughter. After reviewing the submitted research and the recommendations of a scientific seminar held with the Saudi Food and Drug Authority in Jeddah on 14–15 Dhu al-Qa'da 1443 (13–14 June 2022), the Academy decided to defer a ruling on the matter for further study."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں، ذبح سے پہلے پرندوں اور جانوروں کو بے ہوش کرنے اور اس کے ذبح کی شرعیت پر اثر کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات اور سعودی فوڈ اینڈ ڈرگ اتھارٹی کے ساتھ جدہ میں 14–15 ذی قعدہ 1443ھ ⁦(13–14 جون 2022ء)⁩ کو منعقدہ علمی سیمینار کی سفارشات کا جائزہ لینے کے بعد موضوع پر فیصلہ مزید مطالعے کے لیے مؤخر کرنے کا فیصلہ کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 26.ª sesión en Doha (6-10 de Dhu al-Qa'da de 1446, 4-8 de mayo de 2025) sobre el aturdimiento de aves y animales antes del sacrificio y su efecto en la legalidad del mismo. Tras revisar la investigación presentada y las recomendaciones de un seminario científico celebrado con la Autoridad Saudí de Alimentos y Medicamentos en Yeda los días 14 y 15 de Dhu al-Qa'da de 1443 (13-14 de junio de 2022), la Academia decidió aplazar la decisión sobre el asunto para un estudio más profundo."
