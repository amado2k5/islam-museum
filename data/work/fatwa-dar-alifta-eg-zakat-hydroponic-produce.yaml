id: work/fatwa-dar-alifta-eg-zakat-hydroponic-produce
class: work
kind: fatwa
label: { ar: "حكم الزكاة في المنتجات التي تزرع في الماء", en: "Zakat on produce grown in water", ur: "پانی میں اگائی گئی پیداوار کی زکات", es: "Zakat sobre productos cultivados en agua", fr: "Zakat sur les produits cultivés dans l'eau" }
summary:
  ar: "سائل سأل عن الزكاة فيما يزرعه في الأحواض المائية من طحالب وأشينيات مائية. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20854)⁩ أنه لا تجب الزكاة فيما يزرع في الأحواض المائية إلا إذا باعها وبلغت قيمتها نصابًا وحال عليها الحول على ما فصّل الجواب."
  en: "A questioner asked about zakat on algae and aquatic plants he grows in water tanks. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20854) answered that zakat is not due on them unless he sells them and their value reaches nisab and a year passes — as the answer details."
  ur: "ایک سائل نے پانی کے حوضوں میں اگائی گئی الجی اور آبی پودوں کی زکات پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20854)⁩ نے جواب دیا کہ ان پر زکات نہیں سوائے بیچنے پر جب قیمت نصاب کو پہنچے اور سال گزرے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre el zakat aplicable a las algas y plantas acuáticas que cultiva en tanques de agua. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20854) respondió que no se debe pagar zakat sobre ellas a menos que las venda y su valor alcance el nisab y haya transcurrido un año, tal como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant la zakat sur les algues et les plantes aquatiques qu'il cultive dans des bassins. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20854) a répondu que la zakat n'est pas due sur ces plantes, sauf si elles sont vendues, que leur valeur atteint le nisab et qu'un an s'est écoulé, comme le précise la réponse."
