summary:
  ar: "ألبوم الاستوديو الثالث لماهر زين، صدر عن أوايكننغ في 6 يونيو 2016 بعد أربع سنوات من العمل، في ثلاث نسخ إنجليزية وعربية وتركية؛ فكرة اسمه رب واحد وبشرية واحدة وعالم واحد، وفيه «عليك صلى الله» بالإنجليزية «Peace Be Upon You» و«الله يا مولانا» من التراث المغربي و«أنا حي» مع عاطف أسلم."
  en: "Maher Zain's third studio album, released by Awakening on 6 June 2016 after four years of work, in English, Arabic and Turkish editions; its title stands for one God, one humanity and one world, and it includes 'Peace Be Upon You', the Moroccan traditional 'Allah Ya Moulana' and 'I'm Alive' with Atif Aslam."
  ur: "ماہر زین کا تیسرا اسٹوڈیو البم، چار سال کے کام کے بعد 6 جون 2016 کو اویکننگ سے انگریزی، عربی اور ترکی ایڈیشنز میں جاری ہوا؛ عنوان ایک رب، ایک انسانیت اور ایک دنیا کی طرف اشارہ ہے، اور اس میں «پیس بی اپان یو»، مراکشی روایتی «اللہ یا مولانا» اور عاطف اسلم کے ساتھ «آئی ایم الائیو» شامل ہیں۔"
