id: work/ahmed-el-sayed-seerah-lilmuslihin-ep03
class: work
kind: lecture
label:
  ar: "السيرة النبوية للمصلحين، الحلقة 3: أهمية مرحلة ما قبل النبوة"
  en: "The Prophetic Biography for Reformers, episode 3: The Importance of the Pre-Prophetic Period"
  ur: "اصلاح کرنے والوں کے لیے سیرتِ نبوی، قسط 3: نبوت سے پہلے کے دور کی اہمیت"
  fr: "La biographie prophétique pour les réformateurs, épisode 3 : L'importance de la période précédant la prophétie"
  es: "La biografía profética para los reformadores, episodio 3: La importancia del periodo previo a la profecía"
summary:
  ar: "تواصل الجلسة الثالثة الحجة القائلة إن المرحلة التي سبقت البعثة مهمة لأكثر من إثبات عظمة النبي. يسوق أمثلة تبين أن معرفة ممارسات الجاهلية تفسر آيات قرآنية وأخبارا، ويبين كيف صحح الإسلام عادات سابقة، ويرى أن مضمون القرآن لا يمكن أن يصدر عن بيئة العرب ولا عن أهل الكتاب."
  en: "The third session continues the argument that the period before the prophetic mission matters for more than proving the Prophet's greatness. He gives examples where knowing pre-Islamic practice explains Qur'anic verses and reports, shows how Islam corrected earlier customs, and argues that the Qur'an's content could not have come from the Arabs' own setting or from the People of the Book."
  ur: "تیسری نشست اس دلیل کو آگے بڑھاتی ہے کہ بعثت سے پہلے کا دور نبی کی عظمت ثابت کرنے سے کہیں زیادہ اہم ہے۔ وہ ایسی مثالیں دیتے ہیں جن میں جاہلی رواج جاننے سے قرآنی آیات اور روایات سمجھ میں آتی ہیں، اسلام نے پہلے کے رواج کیسے درست کیے، اور وہ کہتے ہیں کہ قرآن کا مضمون نہ عربوں کے اپنے ماحول سے آ سکتا تھا اور نہ اہل کتاب سے۔"
  fr: "La troisième séance poursuit l'argument selon lequel la période qui précède la mission compte pour bien plus que la preuve de la grandeur du Prophète. Il donne des exemples où la connaissance des pratiques préislamiques explique des versets coraniques et des récits, montre comment l'islam a corrigé des coutumes antérieures, et soutient que le contenu du Coran ne pouvait venir ni du milieu des Arabes ni des gens du Livre."
  es: "La tercera sesión continúa el argumento de que el periodo anterior a la misión importa por mucho más que probar la grandeza del Profeta. Da ejemplos en los que conocer las prácticas preislámicas explica versículos coránicos y relatos, muestra cómo el islam corrigió costumbres anteriores y sostiene que el contenido del Corán no pudo proceder del entorno de los árabes ni de la gente del Libro."
