label: { ar: "نقل أثاث المسجد الموقوف إلى مسجد آخر", en: "Moving endowed mosque furnishings to another mosque", ur: "مسجد کا وقف شدہ سامان دوسری مسجد منتقل کرنا", es: "Traslado de mobiliario de una mezquita donado a otra mezquita.", fr: "Déplacement du mobilier de mosquée légué vers une autre mosquée", tr: "Asma caminin mobilyalarının başka bir camiye taşınması", id: "Memindahkan furnitur masjid gantung ke masjid lain" }
summary:
  ar: "سؤال عن نقل السجاد والكتب الموقوفة من مسجد إلى آخر، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل بقاؤها في مسجدها، ويجوز نقلها إذا تعذر الانتفاع بها فيه. أجابت الدائرة بأن ما يوضع في المسجد وقفًا تطبق عليه أحكام الوقف، فتبقى منفعته لعموم المسلمين ولا يملكه أحد، والأصل بقاء ما وُقف على مسجد معين فيه احترامًا لإرادة الواقف، فلا يجوز بيعه ولا هبته ولا إعارته لجهة خاصة. وقالت إن الأدوات الموقوفة التي بليت، أو جيء بمثلها يقوم مقامها، يجوز بيعها أو نقلها إذا ثبت تعذر الانتفاع بها في المسجد نفسه وصارت عبئًا عليه، لأن نقلها يحقق غرض الوقف ولو في غير محله، وتركها يفوّت الانتفاع بها كليًا. واستشهدت بقول النووي في روضة الطالبين إن حصر المسجد البالية تباع على الأصح لئلا تضيع، وبما في إعانة الطالبين من جواز نقل حصير المسجد وقناديله إلى مسجد آخر إذا لم يحتج إليها. ونبهت إلى أن القرار في هذه المسائل يعود إلى الجهات المسؤولة عن أموال الوقف."
  en: "A question on moving endowed carpets and books from one mosque to another, in which Jordan's General Iftaa Department answered that they should in principle stay in their mosque, but may be moved if they can no longer be used there. The Department answered that whatever is placed in a mosque as an endowment falls under the rules of endowment: its benefit stays with Muslims at large and no one owns it, and what was endowed to a particular mosque should in principle remain there out of respect for the endower's wish, so it may not be sold, given away or lent to a private party. It said endowed items that are worn out, or that have been replaced by equivalents, may be sold or moved once it is clear they cannot be used in that mosque and have become a burden on it, since moving them fulfils the endowment's purpose even in another place, while leaving them wastes their benefit entirely. It cited al-Nawawi's Rawdat al-Talibin that worn mosque mats are, on the sounder view, sold so they are not wasted, and I'anat al-Talibin that a mosque's mats and lamps may be moved to another mosque if it does not need them. It noted that decisions on such matters rest with the bodies responsible for endowment property."
  ur: "مسجد کے وقف شدہ قالین اور کتابیں ایک مسجد سے دوسری میں منتقل کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصولاً انہیں اپنی مسجد میں رہنا چاہیے، البتہ وہاں قابلِ استعمال نہ رہیں تو منتقل کیے جا سکتے ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد میں وقف کے طور پر رکھی گئی ہر چیز پر وقف کے احکام لاگو ہوتے ہیں: اس کا فائدہ عام مسلمانوں کے لیے رہتا ہے اور کوئی اس کا مالک نہیں، اور کسی خاص مسجد پر وقف چیز واقف کی منشا کے احترام میں اصولاً وہیں رہے، لہٰذا نہ اسے بیچا جا سکتا ہے، نہ ہبہ کیا جا سکتا ہے اور نہ کسی نجی فریق کو عاریتاً دیا جا سکتا ہے۔ اس نے کہا کہ جو وقف اشیا بوسیدہ ہو جائیں یا ان کی جگہ ان جیسی چیزیں آ جائیں، انہیں بیچنا یا منتقل کرنا جائز ہے جب یہ ثابت ہو کہ وہ اسی مسجد میں قابلِ استعمال نہیں اور اس پر بوجھ بن گئی ہیں، کیونکہ منتقلی سے وقف کا مقصد پورا ہوتا ہے چاہے دوسری جگہ ہو، اور انہیں چھوڑ دینے سے فائدہ مکمل ضائع ہوتا ہے۔ اس نے نووی کی روضۃ الطالبین سے استدلال کیا کہ مسجد کی بوسیدہ چٹائیاں صحیح تر قول پر بیچ دی جاتی ہیں تاکہ ضائع نہ ہوں، اور اعانۃ الطالبین سے کہ مسجد کی چٹائیاں اور قندیلیں ضرورت نہ ہونے پر دوسری مسجد منتقل کی جا سکتی ہیں۔ اس نے تنبیہ کی کہ ایسے معاملات میں فیصلہ وقف کے اموال کے ذمہ دار اداروں کا ہے۔"
  es: "Una pregunta sobre el traslado de alfombras y libros donados de una mezquita a otra, a la que el Departamento General de Iftaa de Jordania respondió que, en principio, deberían permanecer en su mezquita, pero que podrían trasladarse si ya no se pueden utilizar allí. El Departamento explicó que todo lo que se coloca en una mezquita como donación se rige por las normas de donación: su beneficio recae en todos los musulmanes y nadie es propietario de ello, y lo que se donó a una mezquita en particular debería, en principio, permanecer allí por respeto al deseo del donante, por lo que no puede venderse, regalarse ni prestarse a un particular. Añadió que los objetos donados que estén desgastados o que hayan sido reemplazados por equivalentes pueden venderse o trasladarse una vez que quede claro que no se pueden utilizar en esa mezquita y se han convertido en una carga para ella, ya que trasladarlos cumple el propósito de la donación incluso en otro lugar, mientras que dejarlos allí supone desperdiciar por completo su beneficio. Citaba el Rawdat al-Talibin de al-Nawawi, según el cual las alfombras de mezquita desgastadas se venden para evitar su desperdicio, y el I'anat al-Talibin, que establece que las alfombras y lámparas de una mezquita pueden trasladarse a otra si no las necesita. Señalaba que las decisiones sobre estos asuntos corresponden a los organismos responsables de los bienes de la fundación."
  fr: "Concernant le transfert de tapis et de livres légués d'une mosquée à une autre, le Département général de la sagesse jordanien (Iftaa) a répondu que ces biens doivent en principe rester dans leur mosquée d'origine, mais peuvent être déplacés s'ils ne peuvent plus y être utilisés. Le Département a expliqué que tout ce qui est placé dans une mosquée en tant que bien doté est soumis aux règles de la dot: son bénéfice profite à l'ensemble des musulmans et n'appartient à personne. Ce qui a été légué à une mosquée particulière doit, en principe, y rester par respect pour la volonté du donateur et ne peut donc être vendu, donné ou prêté à un particulier. Il a précisé que les objets légués usés ou remplacés par des équivalents peuvent être vendus ou déplacés dès lors qu'il est évident qu'ils ne peuvent plus être utilisés dans cette mosquée et qu'ils sont devenus une charge pour celle-ci. En effet, leur déplacement permet de remplir l'objectif de la dot, même en un autre lieu, tandis que les laisser sur place en gaspille totalement le bénéfice. L'article cite Rawdat al-Talibin d'al-Nawawi, selon lequel les tapis de mosquée usés sont, d'un point de vue plus judicieux, vendus afin d'éviter le gaspillage, et I'anat al-Talibin, qui stipule que les tapis et les lampes d'une mosquée peuvent être transférés vers une autre mosquée si celle-ci n'en a pas besoin. Il précise que les décisions en la matière relèvent des instances responsables des biens de la fondation pieuse."
  tr: "Bir camiden diğerine vakıf halı ve kitapların transferiyle ilgili bir soru, Ürdün Genel Fetva Dairesi, varsayılan olarak camide tutulması ve faydalanılamaması durumunda devredilmesinin izin verildiğini yanıtladı. Bakanlık, camide son sahiplenilen şeyin vakıf kurallarına tabi olduğunu, dolayısıyla faydasının genel Müslüman topluluğa ait olduğunu ve kimsenin sahip olmadığını yanıtladı. Varsayılan olarak, bağışlanan ürünler bağışçının vasiyetine saygı nedeniyle belirli bir camide kalır, bu yüzden özel bir tarafa satılması, hediye edilmesi veya ödünç verilmesi yasaktır. Eskimiş veya getirilen vakıf aletlerin, caminin içinde kullanılamayacağı kanıtlanırsa satılabilir veya devredilir ve bu araçlar yük haline gelirse geçerlidir, çünkü onları taşımak vakıfın amacını yerine getirir, uygun olmasa bile, ve bırakmak tamamen kullanımlarını geçersiz kılar. El-Nawavi'nin Rawdat al-Talibin'deki açıklamasına atıfta bulunarak, caminin yıpranmış stokunun en iyi satıldığını, böylece kaybolmaması gerektiğini ve öğrencilerin cami paspasları ve fenerlerinin başka bir camiye aktarılmasının uygunluğu konusunda yardım edilmesini sağladı. Bu konulardaki kararın vakıf fonlarından sorumlu yetkililere ait olduğunu vurguladılar."
  id: "Pertanyaan tentang pemindahan karpet dan buku yang telah diwakafkan dari satu masjid ke masjid lain, di mana Departemen Fatwa Umum Yordania menjawab bahwa defaultnya adalah menyimpannya di masjid mereka, dan diperbolehkan memindahkannya jika tidak mungkin mendapatkan manfaat darinya. Departemen menjawab bahwa apa yang dijadikan abadi di masjid tunduk pada aturan wakaf, sehingga manfaatnya tetap bagi komunitas Muslim umum dan tidak ada yang memilikinya. Default-nya adalah apa yang diwakafikasi tetap berada di masjid tertentu sebagai bentuk penghormatan terhadap wasiat pemberi sumbang, sehingga tidak diperbolehkan menjual, memberi, atau meminjamkan kepada pihak pribadi. Departemen menyatakan bahwa alat yang telah dibebankan yang sudah aus atau dibawa masuk akan dijual atau dipindahkan jika terbukti tidak dapat digunakan di masjid itu sendiri dan menjadi beban bagi mereka, karena memindahkannya memenuhi tujuan wakaf, meskipun tidak tepat, dan meninggalkannya sepenuhnya membatalkan penggunaannya. Laporan tersebut mengutip pernyataan Al-Nawawi di Rawdat al-Talibin, yang menyatakan bahwa persediaan masjid yang sudah usang sebaiknya dijual agar tidak hilang, serta mengenai bantuan para mahasiswa mengenai izin memindahkan tikar dan lentera masjid ke masjid lain jika tidak ada yang membutuhkannya. Mereka menunjukkan bahwa keputusan terkait hal ini berada di tangan otoritas yang bertanggung jawab atas dana abadi."
