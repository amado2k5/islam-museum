id: work/fatwa-aliftaa-jo-moving-mosque-furnishings
class: work
kind: fatwa
label: { ar: "نقل أثاث المسجد الموقوف إلى مسجد آخر", en: "Moving endowed mosque furnishings to another mosque", ur: "مسجد کا وقف شدہ سامان دوسری مسجد منتقل کرنا" }
summary:
  ar: "سؤال عن نقل السجاد والكتب الموقوفة من مسجد إلى آخر، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأصل بقاؤها في مسجدها، ويجوز نقلها إذا تعذر الانتفاع بها فيه. أجابت الدائرة بأن ما يوضع في المسجد وقفًا تطبق عليه أحكام الوقف، فتبقى منفعته لعموم المسلمين ولا يملكه أحد، والأصل بقاء ما وُقف على مسجد معين فيه احترامًا لإرادة الواقف، فلا يجوز بيعه ولا هبته ولا إعارته لجهة خاصة. وقالت إن الأدوات الموقوفة التي بليت، أو جيء بمثلها يقوم مقامها، يجوز بيعها أو نقلها إذا ثبت تعذر الانتفاع بها في المسجد نفسه وصارت عبئًا عليه، لأن نقلها يحقق غرض الوقف ولو في غير محله، وتركها يفوّت الانتفاع بها كليًا. واستشهدت بقول النووي في روضة الطالبين إن حصر المسجد البالية تباع على الأصح لئلا تضيع، وبما في إعانة الطالبين من جواز نقل حصير المسجد وقناديله إلى مسجد آخر إذا لم يحتج إليها. ونبهت إلى أن القرار في هذه المسائل يعود إلى الجهات المسؤولة عن أموال الوقف."
  en: "A question on moving endowed carpets and books from one mosque to another, in which Jordan's General Iftaa Department answered that they should in principle stay in their mosque, but may be moved if they can no longer be used there. The Department answered that whatever is placed in a mosque as an endowment falls under the rules of endowment: its benefit stays with Muslims at large and no one owns it, and what was endowed to a particular mosque should in principle remain there out of respect for the endower's wish, so it may not be sold, given away or lent to a private party. It said endowed items that are worn out, or that have been replaced by equivalents, may be sold or moved once it is clear they cannot be used in that mosque and have become a burden on it, since moving them fulfils the endowment's purpose even in another place, while leaving them wastes their benefit entirely. It cited al-Nawawi's Rawdat al-Talibin that worn mosque mats are, on the sounder view, sold so they are not wasted, and I'anat al-Talibin that a mosque's mats and lamps may be moved to another mosque if it does not need them. It noted that decisions on such matters rest with the bodies responsible for endowment property."
  ur: "مسجد کے وقف شدہ قالین اور کتابیں ایک مسجد سے دوسری میں منتقل کرنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اصولاً انہیں اپنی مسجد میں رہنا چاہیے، البتہ وہاں قابلِ استعمال نہ رہیں تو منتقل کیے جا سکتے ہیں۔ ڈیپارٹمنٹ نے جواب دیا کہ مسجد میں وقف کے طور پر رکھی گئی ہر چیز پر وقف کے احکام لاگو ہوتے ہیں: اس کا فائدہ عام مسلمانوں کے لیے رہتا ہے اور کوئی اس کا مالک نہیں، اور کسی خاص مسجد پر وقف چیز واقف کی منشا کے احترام میں اصولاً وہیں رہے، لہٰذا نہ اسے بیچا جا سکتا ہے، نہ ہبہ کیا جا سکتا ہے اور نہ کسی نجی فریق کو عاریتاً دیا جا سکتا ہے۔ اس نے کہا کہ جو وقف اشیا بوسیدہ ہو جائیں یا ان کی جگہ ان جیسی چیزیں آ جائیں، انہیں بیچنا یا منتقل کرنا جائز ہے جب یہ ثابت ہو کہ وہ اسی مسجد میں قابلِ استعمال نہیں اور اس پر بوجھ بن گئی ہیں، کیونکہ منتقلی سے وقف کا مقصد پورا ہوتا ہے چاہے دوسری جگہ ہو، اور انہیں چھوڑ دینے سے فائدہ مکمل ضائع ہوتا ہے۔ اس نے نووی کی روضۃ الطالبین سے استدلال کیا کہ مسجد کی بوسیدہ چٹائیاں صحیح تر قول پر بیچ دی جاتی ہیں تاکہ ضائع نہ ہوں، اور اعانۃ الطالبین سے کہ مسجد کی چٹائیاں اور قندیلیں ضرورت نہ ہونے پر دوسری مسجد منتقل کی جا سکتی ہیں۔ اس نے تنبیہ کی کہ ایسے معاملات میں فیصلہ وقف کے اموال کے ذمہ دار اداروں کا ہے۔"
