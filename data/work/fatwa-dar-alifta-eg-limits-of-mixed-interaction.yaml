summary:
  ar: "سائل سأل عن حدود التعامل بين الرجل والمرأة الأجنبية وضوابطه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20908)⁩ أن الشريعة سلكت طريقًا وسطًا في تحديد تعامل المرأة مع الرجال الأجانب فلم تمنعه منعًا باتًّا بحيث يتعطل مصالح العباد على ما فصّل الجواب."
  en: "A questioner asked about the limits of interaction between a man and an unrelated woman. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20908) answered that the sharia took a middle path — not banning it entirely so people's interests are obstructed, nor leaving it unbounded — as the answer details."
  ur: "ایک سائل نے مرد اور نامحرم عورت کے معاملے کی حدود پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20908)⁩ نے جواب دیا کہ شریعت نے وسطی راستہ اختیار کیا نہ مکمل منع نہ کھلی چھوٹ — جیسا کہ جواب میں تفصیل ہے۔"
