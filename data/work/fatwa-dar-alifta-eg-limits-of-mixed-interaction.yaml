label: { ar: "حدود التعامل بين الرجل والمرأة وضوابطه", en: "The limits and controls of interaction between men and women", ur: "مرد و عورت کے باہمی معاملے کی حدود اور ضوابط", es: "Los límites y controles de la interacción entre hombres y mujeres", fr: "Les limites et les contrôles de l'interaction entre les hommes et les femmes" }
summary:
  ar: "سائل سأل عن حدود التعامل بين الرجل والمرأة الأجنبية وضوابطه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20908)⁩ أن الشريعة سلكت طريقًا وسطًا في تحديد تعامل المرأة مع الرجال الأجانب فلم تمنعه منعًا باتًّا بحيث يتعطل مصالح العباد على ما فصّل الجواب."
  en: "A questioner asked about the limits of interaction between a man and an unrelated woman. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20908) answered that the sharia took a middle path — not banning it entirely so people's interests are obstructed, nor leaving it unbounded — as the answer details."
  ur: "ایک سائل نے مرد اور نامحرم عورت کے معاملے کی حدود پوچھیں۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20908)⁩ نے جواب دیا کہ شریعت نے وسطی راستہ اختیار کیا نہ مکمل منع نہ کھلی چھوٹ — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre los límites de la interacción entre un hombre y una mujer sin parentesco. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 20908) respondió que la sharia optó por una vía intermedia: ni la prohibió por completo, obstaculizando así los intereses de las personas, ni la dejó sin límites, como se detalla en la respuesta."
  fr: "Une personne a posé une question sur les limites des relations entre un homme et une femme sans lien de parenté. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20908) a répondu que la charia adoptait une voie médiane: ni l’interdire totalement, au risque de nuire aux intérêts des individus, ni la laisser sans limites, comme le précise la réponse."
