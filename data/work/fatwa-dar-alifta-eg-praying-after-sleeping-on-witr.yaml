id: work/fatwa-dar-alifta-eg-praying-after-sleeping-on-witr
class: work
kind: fatwa
label: { ar: "حكم نقض الوتر وكيفية الصلاة بعده", en: "Undoing one's witr and praying after it", ur: "وتر کے بعد نماز کا حکم", es: "Deshacer el witr y rezar después.", fr: "Défaire son witr et prier ensuite" }
summary:
  ar: "سائل سأل عمن استيقظ من ليلته وأراد أن يصلي شيئًا من قيام الليل بعدما نام على وتر. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21574)⁩ أنه يجوز له ذلك من غير حرج على ما فصّل الجواب من كيفيته."
  en: "A questioner asked about one who wakes at night wanting to pray more night prayer after having slept upon his witr. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21574) answered that he may do so without blame — with the manner the answer sets out."
  ur: "ایک سائل نے پوچھا کہ جو وتر پڑھ کر سو گیا ہو پھر رات میں اٹھ کر مزید نماز پڑھنا چاہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21574)⁩ نے جواب دیا کہ ایسا جائز ہے — جواب میں اس کا طریقہ بیان ہوا۔"
  es: "Un consultante preguntó sobre alguien que se despierta por la noche con ganas de rezar más oraciones nocturnas después de haber dormido sobre su witr. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21574) respondió que puede hacerlo sin culpa, en el sentido que se expone en la respuesta."
  fr: "Un internaute a posé une question concernant celui qui se réveille la nuit et souhaite accomplir une prière nocturne supplémentaire après avoir respecté son witr. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21574) a répondu qu'il peut le faire sans reproche, selon les modalités décrites dans la réponse."
