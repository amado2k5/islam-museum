id: work/fatwa-amja-insulting-companions-either-side
class: work
kind: fatwa
label: { ar: "سب الصحابة والرد عليهم", en: "Insulting the Companions — and insulting Ali in reply", ur: "صحابہ کی توہین اور جوابی توہین", es: "Insultando a los Compañeros —e insultando a Ali en respuesta", fr: "Insulter les Compagnons — et insulter Ali en retour", tr: "Yoldaşlara hakaret etmek ve onlara karşılık vermek", id: "Menghina Para Sahabat dan merespons mereka" }
summary:
  ar: "سأل سائل عن أناس يشتمون أبا بكر وعمر وعثمان في الشوارع ويرد عليهم بعض السنة بشتم علي والأئمة فهل توجد فتوى تحرم ذلك. أجاب د. حاتم الحاج ⁦(فتوى رقم 21847 بتاريخ 24 سبتمبر 2006)⁩ أن سب الشيعة للخلفاء وغيرهم من الصحابة معروف للقاصي والداني وكثير منهم لا يستخفون به ولا حول ولا قوة إلا بالله، وأما من سب عليًا من أهل السنة فالسنة منه بريئة وما هو إلا من سفهائهم أو جهالهم فأهل السنة يعرفون لعلي فضله وهو رابع الخلفاء الراشدين ومنزلته من الرسول كمنزلة هارون من موسى، وسب أي من الصحابة المذكورين يتردد بين أن يكون كفرًا أو ذنبًا من كبائر الذنوب."
  en: "A questioner described people — young and old — cursing Abu Bakr, Umar and Uthman in the streets, and Sunnis answering by cursing Ali and the imams, asking for a fatwa forbidding it. Dr. Hatim al-Hajj (fatwa no. 21847, 24 September 2006) answered that the Shia's cursing of the caliphs and other Companions is known far and wide, many not even concealing it; but whoever of the Sunnis curses Ali — the Sunna is innocent of him, he is only of their foolish or ignorant, for the Sunnis know Ali's merit, the fourth rightly-guided caliph, whose place with the Messenger is as Aaron's with Moses; cursing any of these Companions lies between disbelief and a major sin. Recorded as AMJA's answer."
  ur: "ایک سائل نے صحابہ کی توہین اور جوابی مباحثہ پوچھا۔ ڈاکٹر حاتم الحاج ⁦(فتویٰ 21847، 24 ستمبر 2006)⁩ کے مطابق اہل سنت علی کی توہین سے بری ہیں اور کسی بھی صحابی کی توہین کفر اور کبیرہ کے درمیان ہے۔"
  es: "Un consultante describió cómo personas —jóvenes y ancianos— maldecían a Abu Bakr, Umar y Uthman en las calles, y los sunitas respondían maldiciendo a Ali y a los imanes, solicitando una fatwa que lo prohibiera. El Dr. Hatim al-Hajj (fatwa n.° 21847, 24 de septiembre de 2006) respondió que la maldición de los chiítas contra los califas y otros Compañeros es ampliamente conocida, y muchos ni siquiera la ocultan; pero quienquiera que de entre los sunitas maldiga a Ali, la Sunna es inocente de él, solo es necio o ignorante, pues los sunitas conocen el mérito de Ali, el cuarto califa bien guiado, cuyo lugar con el Mensajero es como el de Aarón con Moisés; maldecir a cualquiera de estos Compañeros se sitúa entre la incredulidad y un pecado grave. Registrado como respuesta de AMJA."
  fr: "Un internaute a décrit des gens, jeunes et vieux, maudissant Abou Bakr, Omar et Othman dans les rues, et des sunnites répondant en maudissant Ali et les imams, demandant une fatwa pour interdire cela. Le Dr Hatim al-Hajj (fatwa n° 21847, 24 septembre 2006) a répondu que les malédictions proférées par les chiites à l'encontre des califes et autres Compagnons sont notoires, beaucoup ne les dissimulant même pas; mais quiconque parmi les sunnites maudit Ali n'est pas conforme à la Sunna à son égard, il est seulement ignorant ou insensé, car les sunnites connaissent le mérite d'Ali, le quatrième calife bien guidé, dont la place auprès du Messager est comparable à celle d'Aaron auprès de Moïse; maudire l'un de ces Compagnons relève de la mécréance et constitue un péché majeur. (Réponse rapportée par AMJA)"
  tr: "Sokaklarda Ebu Bekir, Ömer ve Osman'a hakaret edenlere soruldu ve bazı Sünniler Ali ve imamları aşağılayarak karşılık verdi. Bunu yasaklayan bir fetva var mı? Dr. Hatim El-Hac (24 Eylül 2006 tarihli 21847 sayılı fetva) şöyle yanıtladı: Şiilerin halifelere ve diğer sahabelere hakaret etmeleri herkes tarafından bilinir, yakın ve uzakta, ve çoğu bunu hafife almaz. Güç ve kuvvet Allah'tan başka yoktur. Sünni hakaretleri ise Sünniler ondan masumdur ve sadece aptal ya da cahil halkları arasındadır. Sünniler Ali'nin erdemini tanır, çünkü o doğru rehber halifelerin dördüncüsüdür ve Peygamber'in nezdindeki durumu Musa'dan Harun'a benzerdir. Bahsedilen sahabelerden herhangi birine hakaret etmek bazen inançsızlık veya büyük günah olarak kabul edilir."
  id: "Seorang penanya ditanya tentang orang-orang yang menghina Abu Bakr, Umar, dan Uthman di jalanan, dan beberapa Sunni menanggapi mereka dengan menghina Ali dan para Imam. Apakah ada fatwa yang melarang hal ini? Dr. Hatim Al-Hajj menjawab (Fatwa No. 21847 tanggal 24 September 2006) bahwa penghinaan Syiah terhadap khalifah dan sahabat lainnya diketahui oleh semua orang, baik dari dekat maupun jauh, dan banyak dari mereka tidak menganggapnya enteng. Tidak ada kekuatan atau kekuasaan kecuali dari Allah. Adapun penghinaan Sunni Ali, Sunni tidak bersalah darinya dan hanya berada di antara umat mereka yang bodoh atau tidak tahu. Orang Sunni mengakui kebajikan Ali, karena dia adalah khalifah keempat yang dibimbing dengan benar dan statusnya di hadapan Nabi seperti Harun dari Musa. Menghina sahabat yang disebutkan kadang-kadang dianggap sebagai ketidakpercayaan atau dosa besar."
