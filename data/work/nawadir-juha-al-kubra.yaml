label: { ar: "نوادر جحا الكبرى", en: "Nawadir Juha al-Kubra (The Great Anecdotes of Juha)" }
summary:
  ar: "مجموعة طرائف منسوبة إلى جحا ونصر الدين خوجة، تُقدَّم في طبعة حديثة مع مقدمة تتتبع أصل الشخصية. تتألف الحكايات من عناوين قصيرة متتابعة؛ تُقرأ هنا أولاها في الصفحات 9-15 من المسح، وتدور في أغلبها حول الوعظ والحمّام والبستان والعميان والبيض، وأكثرها تُنسب في الطبعة إلى نصر الدين في قونية وآق شهر. {cite:juha-nawadir-kubra-djuwaydi p. 9-15}"
  en: "A collection of anecdotes attributed to Juha and to Nasreddin Hoca, presented in a modern edition with an introduction that traces the figure's origins. The stories are short titled pieces; the first ones read here (scan pp. 9-15) concern a preacher's sermons, a bath, an orchard, blind men and eggs, and most are set in Konya and Akşehir. {cite:juha-nawadir-kubra-djuwaydi p. 9-15}"
  ur: "یہ مجموعہ جحا اور نصر الدین خواجہ سے منسوب لطائف پر مشتمل ہے، جو ایک جدید ایڈیشن میں مقدمے کے ساتھ شائع ہوا ہے۔ اس میں چھوٹے عنوانات والی حکایات ہیں؛ یہاں پہلی حکایات (اسکین صفحات 9-15) واعظ، حمام، باغ، نابینا اور انڈوں سے متعلق ہیں، اور زیادہ تر قونیہ اور آق شہر میں ہوتی ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 9-15}"
