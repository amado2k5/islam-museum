summary:
  ar: "القاموس المحيط للفيروزآبادي، المتوفى سنة ٨١٧هـ/١٤١٥م، معجم عربي بالعربية اشتُهر به مؤلفه حتى سُمّي المعجم «قاموساً» في الاستعمال. وقد شرحه محمد مرتضى الزبيدي في «تاج العروس»."
