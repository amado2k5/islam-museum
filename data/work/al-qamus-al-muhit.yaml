  fr: "L'al-Qamus al-Muhit d'al-Fayruzabadi (m. 817 AH / 1415), dictionnaire d'arabe en arabe auquel son auteur doit sa renommée. Murtada al-Zabidi en a tiré son vaste commentaire, le Taj al-Arus."
  ur: "الفیروزآبادی ⁦(م 817ھ / 1415ء)⁩ کی القاموس المحیط، عربی سے عربی لغت جس سے مصنف مشہور ہوا۔ مرتضیٰ زبیدی نے اس پر اپنی بڑی شرح تاج العروس لکھی۔"
