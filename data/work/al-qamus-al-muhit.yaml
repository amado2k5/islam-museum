summary:
  ar: "القاموس المحيط للفيروزآبادي، المتوفى سنة ٨١٧هـ/١٤١٥م، معجم عربي بالعربية اشتُهر به مؤلفه حتى سُمّي المعجم «قاموساً» في الاستعمال. وقد شرحه محمد مرتضى الزبيدي في «تاج العروس». طُبع في بولاق سنة ١٨٥٦م في مجلدين، بحسب فهرس المكتبة الوطنية التونسية. ويقول بعلبكي إن أكثر مادته مستقى من المحكم والعباب، وإن أسماء الأعلام والمواضع فيه تزيد بنحو ثلاثة أضعاف على ما في اللسان ونحو عشرين ضعفاً على ما في الصحاح، وإن لفظ «القاموس»، وهو معرَّب كلمة يونانية معناها «المحيط»، صار مرادفاً للمعجم، وإن الفيروزآبادي اختصر مادته فحذف الشواهد وأسماء اللغويين واستعمل رموزاً، منها حرف واحد للموضع وآخر للجمع."
  en: "al-Qamus al-Muhit by al-Fayruzabadi (d. 817 AH / 1415), an Arabic-to-Arabic dictionary for which its author is best known. Murtada al-Zabidi wrote his large commentary Taj al-Arus on it. It was printed at Bulaq in 1856 in two volumes, according to the catalogue of the National Library of Tunisia. Baalbaki writes that most of its material comes from al-Muhkam and al-Ubab; that its proper names of persons and places are about three times those of Lisan al-Arab and about twenty times those of al-Sihah; that the word qamus, borrowed from a Greek word meaning the ocean, became a synonym for dictionary; and that al-Fayruzabadi condensed his material, dropping verses and the names of linguists and using abbreviations, one letter for a place and another for a plural among them."
  es: "El al-Qamus al-Muhit de al-Fayruzabadi (m. 817 AH / 1415), un diccionario de árabe a árabe por el que su autor es más conocido. Murtada al-Zabidi escribió sobre él su extenso comentario Taj al-Arus. Se imprimió en Bulaq en 1856 en dos volúmenes, según el catálogo de la Biblioteca Nacional de Túnez. Baalbaki escribe que la mayor parte de su material procede del al-Muhkam y del al-Ubab; que sus nombres propios de personas y lugares son unas tres veces los del Lisan al-Arab y unas veinte veces los del al-Sihah; que la palabra qamus, tomada de un vocablo griego que significa el océano, se convirtió en sinónimo de diccionario; y que al-Fayruzabadi condensó su material, suprimiendo versos y nombres de lingüistas y usando abreviaturas, entre ellas una letra para un lugar y otra para un plural."
  fr: "L'al-Qamus al-Muhit d'al-Fayruzabadi (m. 817 AH / 1415), dictionnaire d'arabe en arabe auquel son auteur doit sa renommée. Murtada al-Zabidi en a tiré son vaste commentaire, le Taj al-Arus. Il fut imprimé à Boulaq en 1856 en deux volumes, selon le catalogue de la Bibliothèque nationale de Tunisie. Baalbaki écrit que l'essentiel de sa matière vient d'al-Muhkam et d'al-Ubab ; que ses noms propres de personnes et de lieux sont environ trois fois ceux du Lisan al-Arab et environ vingt fois ceux d'al-Sihah ; que le mot qamus, emprunté à un mot grec signifiant l'océan, est devenu synonyme de dictionnaire ; et qu'al-Fayruzabadi condensa sa matière, supprimant les vers et les noms de linguistes et employant des abréviations, dont une lettre pour un lieu et une autre pour un pluriel."
  ur: "الفیروزآبادی ⁦(م 817ھ / 1415ء)⁩ کی القاموس المحیط، عربی سے عربی لغت جس سے مصنف مشہور ہوا۔ مرتضیٰ زبیدی نے اس پر اپنی بڑی شرح تاج العروس لکھی۔ یہ 1856ء میں بولاق میں دو جلدوں میں چھپی، تیونس کی قومی لائبریری کی فہرست کے مطابق۔ بعلبکی لکھتے ہیں کہ اس کا زیادہ تر مواد المحکم اور العباب سے لیا گیا؛ اس میں اشخاص اور مقامات کے اسماء لسان العرب سے تقریباً تین گنا اور الصحاح سے تقریباً بیس گنا ہیں؛ لفظ قاموس، جو ایک یونانی لفظ سے معرب ہے جس کا مطلب سمندر ہے، لغت کا مترادف بن گیا؛ اور فیروزآبادی نے اپنے مواد کو مختصر کیا، اشعار اور لغویوں کے نام حذف کیے اور اختصارات استعمال کیے، جن میں مقام کے لیے ایک حرف اور جمع کے لیے دوسرا حرف ہے۔"
