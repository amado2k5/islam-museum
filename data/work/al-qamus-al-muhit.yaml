summary:
  ar: "القاموس المحيط للفيروزآبادي، المتوفى سنة ٨١٧هـ/١٤١٥م، معجم عربي بالعربية اشتُهر به مؤلفه حتى سُمّي المعجم «قاموساً» في الاستعمال. وقد شرحه محمد مرتضى الزبيدي في «تاج العروس». طُبع في بولاق سنة ١٨٥٦م في مجلدين، بحسب فهرس المكتبة الوطنية التونسية."
  en: "al-Qamus al-Muhit by al-Fayruzabadi (d. 817 AH / 1415), an Arabic-to-Arabic dictionary for which its author is best known. Murtada al-Zabidi wrote his large commentary Taj al-Arus on it. It was printed at Bulaq in 1856 in two volumes, according to the catalogue of the National Library of Tunisia."
  es: "El al-Qamus al-Muhit de al-Fayruzabadi (m. 817 AH / 1415), un diccionario de árabe a árabe por el que su autor es más conocido. Murtada al-Zabidi escribió sobre él su extenso comentario Taj al-Arus. Se imprimió en Bulaq en 1856 en dos volúmenes, según el catálogo de la Biblioteca Nacional de Túnez."
  fr: "L'al-Qamus al-Muhit d'al-Fayruzabadi (m. 817 AH / 1415), dictionnaire d'arabe en arabe auquel son auteur doit sa renommée. Murtada al-Zabidi en a tiré son vaste commentaire, le Taj al-Arus. Il fut imprimé à Boulaq en 1856 en deux volumes, selon le catalogue de la Bibliothèque nationale de Tunisie."
  ur: "الفیروزآبادی ⁦(م 817ھ / 1415ء)⁩ کی القاموس المحیط، عربی سے عربی لغت جس سے مصنف مشہور ہوا۔ مرتضیٰ زبیدی نے اس پر اپنی بڑی شرح تاج العروس لکھی۔ یہ 1856ء میں بولاق میں دو جلدوں میں چھپی، تیونس کی قومی لائبریری کی فہرست کے مطابق۔"
