structure: "Author's preface with five fasls: the meaning of ta'rikh and tawrikh; the principal histories and the chains of reports; the duration of the world; the style an author should use; the titles of the chapters (vol. 1 pp. 5-7). Then creation and the prophets, pre-Islamic nations, the sira, and annals with obituaries by year from the Hijra to 654 AH. Risala edition: 23 volumes, vol. 22 covering 588-654 AH."
