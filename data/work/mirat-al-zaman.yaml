summary:
  ar: "تاريخ عام لسبط ابن الجوزي ⁦(581–654هـ)⁩ يبدأ بخلق السماوات والأرض، ثم يسرد السيرة والحوادث والوفيات على السنين من مولد النبي، وسماه مؤلفه «مرآة الزمان» «ليكون اسماً يوافق مسماه» {cite:mirat-al-zaman-risala-2013-v1 p.6}؛ وفي حوادث عصره ⁦(588–654هـ)⁩ يروي ما شهده بنفسه بصيغة «قال المصنف»، كمجلسه بجامع دمشق سنة 607هـ ومجلسه فيه بعد تسليم القدس سنة 626هـ {cite:mirat-al-zaman-risala-2013-v22 p.172} {cite:mirat-al-zaman-risala-2013-v22 p.296}."
  en: "A universal history by Sibt ibn al-Jawzi (581-654 AH) beginning with the creation of the heavens and the earth and then narrating the Prophet's life, events and deaths year by year from the Prophet's birth; its author named it Mir'at al-zaman 'so that the name fits what it names'. For his own age (588-654 AH) he reports what he witnessed under 'the author said', such as his session in the Damascus mosque in 607 and his session there after the surrender of Jerusalem in 626."
  es: "Historia universal de Sibt ibn al-Jawzi (581-654 AH), que comienza con la creación de los cielos y la tierra y narra la vida, los acontecimientos y la muerte del Profeta año tras año desde su nacimiento; su autor la tituló Mir'at al-zaman, «para que el nombre se ajuste a lo que describe». Para su época (588-654 AH), relata lo que presenció bajo la expresión «dijo el autor», como su encuentro en la mezquita de Damasco en 607 y su encuentro allí tras la rendición de Jerusalén en 626."
  fr: "L'histoire universelle de Sibt ibn al-Jawzi (581-654 AH) débute par la création des cieux et de la terre, puis relate la vie du Prophète, ses événements et sa mort année après année depuis sa naissance. Son auteur l'intitule Mir'at al-zaman, « afin que le nom corresponde à ce qu'il décrit ». Pour son époque (588-654 AH), il rapporte ce dont il a été témoin, notamment son séjour à la mosquée de Damas en 607 et celui qui suivit la reddition de Jérusalem en 626."
  ur: "سبط ابن الجوزی ⁦(581-654 ہجری)⁩ کی ایک عالمگیر تاریخ جو آسمانوں اور زمین کی تخلیق سے شروع ہوتی ہے اور پھر نبی کی پیدائش سے لے کر سال بہ سال نبی کی زندگی، واقعات اور وفات کو بیان کرتی ہے۔ اس کے مصنف نے اس کا نام میرات الزمان رکھا ہے تاکہ اس نام کے مطابق جو نام رکھا گیا ہو۔ اپنی عمر ⁦(588-654 ہجری)⁩ کے لیے وہ 'مصنف نے کہا' کے تحت جو کچھ دیکھا اس کی رپورٹ کرتا ہے، جیسے کہ 607 میں دمشق کی مسجد میں ان کا اجلاس اور 626 میں یروشلم کے ہتھیار ڈالنے کے بعد وہاں ان کا اجلاس۔"
