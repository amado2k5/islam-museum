summary:
  ar: "تاريخ عام لسبط ابن الجوزي (581–654هـ) يبدأ بخلق السماوات والأرض، ثم يسرد السيرة والحوادث والوفيات على السنين من مولد النبي، وسماه مؤلفه «مرآة الزمان» «ليكون اسماً يوافق مسماه» {cite:mirat-al-zaman-risala-2013-v1 p.6}؛ وفي حوادث عصره (588–654هـ) يروي ما شهده بنفسه بصيغة «قال المصنف»، كمجلسه بجامع دمشق سنة 607هـ ومجلسه فيه بعد تسليم القدس سنة 626هـ {cite:mirat-al-zaman-risala-2013-v22 p.172} {cite:mirat-al-zaman-risala-2013-v22 p.296}."
  en: "A universal history by Sibt ibn al-Jawzi (581-654 AH) beginning with the creation of the heavens and the earth and then narrating the Prophet's life, events and deaths year by year from the Prophet's birth; its author named it Mir'at al-zaman 'so that the name fits what it names'. For his own age (588-654 AH) he reports what he witnessed under 'the author said', such as his session in the Damascus mosque in 607 and his session there after the surrender of Jerusalem in 626."
