summary:
  ar: "رد ابن تيمية (661–728هـ) على رسالة وصلت من قبرص تنسب إلى راهب، ويعرض التعريف بالكتاب في مقدمته سبب تأليفه وطريقة الرد، ومنها استدلال ابن تيمية بنصوص القرآن والسنة وبما في كتب أهل الكتاب على وقوع التبديل {cite:jawab-sahih-ibn-taymiyya-edition p.1} {cite:jawab-sahih-ibn-taymiyya-edition p.3}. صيغة الكتاب مناظرة مع النصارى، وتضع الطبعة تعريفاً مقارناً بين الأديان في مقدمتها."
  en: "Ibn Taymiyya's reply to a letter from Cyprus that circulated under the name of a monk; the introduction in this printing describes the occasion of the work and its method of argument from the Qur'an, the Sunna and the earlier scriptures {cite:jawab-sahih-ibn-taymiyya-edition p.1} {cite:jawab-sahih-ibn-taymiyya-edition p.3}."
