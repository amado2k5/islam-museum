label: { ar: "الجواب الصحيح لمن بدل دين المسيح", en: "Al-Jawab al-Sahih li-man Baddala Din al-Masih", ur: "الجواب الصحیح لعمان بدلہ دین المسیح" }
summary:
  ar: "رد ابن تيمية ⁦(661–728هـ)⁩ على رسالة وصلت من قبرص تنسب إلى راهب، ويعرض التعريف بالكتاب في مقدمته سبب تأليفه وطريقة الرد، ومنها استدلال ابن تيمية بنصوص القرآن والسنة وبما في كتب أهل الكتاب على وقوع التبديل {cite:jawab-sahih-ibn-taymiyya-edition p.1} {cite:jawab-sahih-ibn-taymiyya-edition p.3}. صيغة الكتاب مناظرة مع النصارى، وتضع الطبعة تعريفاً مقارناً بين الأديان في مقدمتها."
  en: "Ibn Taymiyya's reply to a letter from Cyprus that circulated under the name of a monk; the introduction in this printing describes the occasion of the work and its method of argument from the Qur'an, the Sunna and the earlier scriptures {cite:jawab-sahih-ibn-taymiyya-edition p.1} {cite:jawab-sahih-ibn-taymiyya-edition p.3}."
  es: "Respuesta de Ibn Taymiyya a una carta de Chipre que circuló bajo el nombre de un monje; la introducción de esta edición describe la ocasión de la obra y su método de argumentación a partir del Corán, la Sunna y las escrituras anteriores {cite:jawab-sahih-ibn-taymiyya-edition p.1} {cite:jawab-sahih-ibn-taymiyya-edition p.3}."
  fr: "Réponse d'Ibn Taymiyya à une lettre de Chypre qui circulait sous le nom d'un moine; l'introduction de cette édition décrit le contexte de l'ouvrage et sa méthode d'argumentation à partir du Coran, de la Sunna et des écritures antérieures {cite:jawab-sahih-ibn-taymiyya-edition p.1} {cite:jawab-sahih-ibn-taymiyya-edition p.3}."
  ur: "ابن تیمیہ کا قبرص کے ایک خط کا جواب جو ایک راہب کے نام سے گردش کرتا تھا۔ اس طباعت کا تعارف قرآن، سنت اور اس سے پہلے کے صحیفوں سے اس کام کے موقع اور اس کے استدلال کا طریقہ بیان کرتا ہے {حوالہ:جواب صحیح ابن تیمیہ ایڈیشن صفحہ 1} {حوالہ:جواب صحیح ابن تیمیہ ایڈیشن صفحہ 3}۔"
