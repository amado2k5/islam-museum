id: work/fatwa-amja-tayammum-when-washing-harms
class: work
kind: fatwa
label: { ar: "التيمم للمريضة", en: "Tayammum when washing brings on illness", ur: "غسل سے بیماری — تیمم", es: "Tayammum cuando lavarse provoca enfermedad", fr: "Tayammum lorsque le lavage provoque une maladie", tr: "Hasta kadın için Tayammum", id: "Tayammum untuk wanita sakit" }
summary:
  ar: "سأل سائل أن أخته مريضة بالشقيقة والحساسية وتمرض كلما اغتسلت بعد الجماع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83696 بتاريخ 5 فبراير 2011)⁩ أن التيمم يجوز عند فقد الماء أو العجز عن استخدامه فإذا كان استخدام الماء يؤدي إلى حصول مرض أو زيادته أو تأخر برء جاز التيمم لقوله تعالى فلم تجدوا ماء فتيمموا صعيدا طيبا، فإن كانت تستطيع غسل بعض أجزاء بدنها دون ضرر غسلت ما تقدر عليه وتيممت للباقي على ما فصّل."
  en: "A questioner said his sister suffers migraine and allergy and falls ill whenever she washes after intercourse. Dr. Salah al-Sawi (fatwa no. 83696, 5 February 2011) answered that tayammum is lawful where water is lacking or unusable — where using water brings illness, worsens it or delays healing, tayammum is permitted per 'if you find no water, tayammum with clean ground'; and where she can wash some parts without harm she washes what she can and does tayammum for the rest — as detailed."
  ur: "ایک شخص کی بہن غسل سے بیمار ہو جاتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83696، 5 فروری 2011)⁩ کے مطابق ضرر میں تیمم جائز ہے؛ جو حصہ دھو سکے دھوئے باقی تیمم۔"
  es: "Un consultante afirmó que su hermana padece migraña y alergias, y se enferma cada vez que se lava después de tener relaciones sexuales. El Dr. Salah al-Sawi (fatwa n.° 83696, 5 de febrero de 2011) respondió que el tayammum es lícito cuando no hay agua o esta no es utilizable; si el uso del agua provoca enfermedad, la empeora o retrasa la curación, el tayammum está permitido según la norma \"si no encuentras agua, realiza el tayammum en tierra limpia\"; y si puede lavar algunas partes sin sufrir daño, lava lo que puede y realiza el tayammum en el resto, como se detalla."
  fr: "Un homme a indiqué que sa sœur souffre de migraines et d'allergies et tombe malade chaque fois qu'elle se lave après un rapport sexuel. Le Dr Salah al-Sawi (fatwa n° 83696, 5 février 2011) a répondu que le tayammum est licite en l'absence d'eau ou lorsque celle-ci est inutilisable. Si l'utilisation de l'eau provoque une maladie, l'aggrave ou retarde la guérison, le tayammum est permis selon le principe: « en l'absence d'eau, pratiquez le tayammum avec de la terre propre ». Il a également précisé que si elle peut laver certaines parties sans risque, elle lave ce qu'elle peut et pratique le tayammum pour le reste, comme expliqué en détail."
  tr: "Bir soru soran kişi, kız kardeşinin migren ve alerji yaşadığını ve cinsel ilişkiden sonra yıkandığında hastalandığını sordu. Dr. Salah Al-Sawy (5 Şubat 2011 tarihli 83696 sayılı fetva) su kaybolursa veya kullanılamazsa tayammumun caiz olduğunu yanıtladı. Su kullanımı hastalanmaya, iyileşmenin artmasına veya gecikmesine yol açıyorsa, Allah şöyle buyurur: 'Su bulamıyorsanız, iyi bir yüzeyde tayammum yapın. Vücudunun bazı kısımlarını zarar görmeden yıkayabiliyorsa, mümkün olduğunca yıkanmalı ve kalanları için belirtildiği şekilde teyammum yapmalıdır.'"
  id: "Seorang penanya bertanya bahwa saudara perempuannya menderita migrain dan alergi serta jatuh sakit setiap kali mandi setelah berhubungan seks. Dr. Salah Al-Sawy menjawab (Fatwa No. 83696 tanggal 5 Februari 2011) bahwa tayammum diperbolehkan jika air hilang atau tidak dapat digunakan. Jika penggunaan air menyebabkan penyakit, meningkat, atau menunda pemulihan, tayammum diperbolehkan seperti yang dikatakan Allah: 'Jika Anda tidak menemukan air, maka lakukan tayammum di permukaan yang baik. Jika dia dapat mencuci beberapa bagian tubuhnya tanpa terluka, dia harus mencuci sebanyak mungkin dan melakukan tayammum untuk sisanya sesuai ketentuan.'"
