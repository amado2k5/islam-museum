id: work/fatwa-amja-tayammum-when-washing-harms
class: work
kind: fatwa
label: { ar: "التيمم للمريضة", en: "Tayammum when washing brings on illness", ur: "غسل سے بیماری — تیمم" }
summary:
  ar: "سأل سائل أن أخته مريضة بالشقيقة والحساسية وتمرض كلما اغتسلت بعد الجماع. أجاب د. صلاح الصاوي ⁦(فتوى رقم 83696 بتاريخ 5 فبراير 2011)⁩ أن التيمم يجوز عند فقد الماء أو العجز عن استخدامه فإذا كان استخدام الماء يؤدي إلى حصول مرض أو زيادته أو تأخر برء جاز التيمم لقوله تعالى فلم تجدوا ماء فتيمموا صعيدا طيبا، فإن كانت تستطيع غسل بعض أجزاء بدنها دون ضرر غسلت ما تقدر عليه وتيممت للباقي على ما فصّل."
  en: "A questioner said his sister suffers migraine and allergy and falls ill whenever she washes after intercourse. Dr. Salah al-Sawi (fatwa no. 83696, 5 February 2011) answered that tayammum is lawful where water is lacking or unusable — where using water brings illness, worsens it or delays healing, tayammum is permitted per 'if you find no water, tayammum with clean ground'; and where she can wash some parts without harm she washes what she can and does tayammum for the rest — as detailed."
  ur: "ایک شخص کی بہن غسل سے بیمار ہو جاتی ہے۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 83696، 5 فروری 2011)⁩ کے مطابق ضرر میں تیمم جائز ہے؛ جو حصہ دھو سکے دھوئے باقی تیمم۔"
