id: work/fatwa-dar-alifta-eg-ihram-violation-before-shortening
class: work
kind: fatwa
label: { ar: "ما يجب على المحرم إذا ارتكب محظورًا قبل حلق الشعر في العمرة", en: "What is due from a pilgrim who broke an ihram prohibition before shortening his hair", ur: "عمرہ میں بال کٹوانے سے پہلے احرام کی حرمت کرنے والے پر کیا لازم ہے", es: "¿Qué se le debe a un peregrino que rompió una prohibición de ihram antes de cortarse el pelo?", fr: "Que doit payer un pèlerin qui a enfreint l'interdiction de l'ihram avant de se couper les cheveux ?", tr: "Umre sırasında saçını tıraş etmeden önce yasak bir eylem yaparsa hacıdan ne beklenir?", id: "Apa yang diwajibkan dari peziarah jika ia melakukan tindakan terlarang sebelum mencukur rambutnya selama Umrah?" }
summary:
  ar: "سائل وضع الطيب في العمرة قبل أن يحلق أو يقصر فسأل عن حكمه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21849)⁩ أنه إن وضع الطيب قبل الحلق أو التقصير عامدًا عالمًا مختارًا فعليه الفدية على ما فصّل الجواب."
  en: "A man applied perfume in umrah before shaving or shortening his hair and asked the ruling. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21849) answered that if he applied the perfume before shaving or shortening deliberately, knowingly and by choice, he owes the fidya — as the answer details."
  ur: "ایک شخص نے عمرہ میں سر مُنڈوانے یا بال کٹوانے سے پہلے خوشبو لگائی اور حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21849)⁩ نے جواب دیا کہ اگر اس نے جان بوجھ کر اور اختیار سے ایسا کیا تو اس پر فدیہ ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un hombre se perfumó durante la Umrah antes de afeitarse o cortarse el pelo y preguntó al respecto. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21849) respondió que si se aplicó el perfume antes de afeitarse o cortarse el pelo deliberadamente, a sabiendas y por elección, debe pagar la fidya, como se detalla en la respuesta."
  fr: "Un homme s'est parfumé avant de se raser ou de se couper les cheveux pendant sa omra et a demandé la décision de la Cour suprême. La Cour d'assises égyptienne Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21849) a répondu que s'il s'était parfumé délibérément, en toute connaissance de cause et de son plein gré, il devait s'acquitter de la fidya, comme le précise la réponse."
  tr: "Bir soru soran kişi, saçını tıraş etmeden veya kestirmeden önce bir parfümcünün Umre'ye yerleştirilip yerleştirilmediğini sordu ve kararını sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21849), parfüm kasıtlı tıraş edilmeden veya kesinilmeden önce sürüldüyse, cevapta belirtilen fidya ödemesi gerektiğini yanıtladı."
  id: "Seorang penanya menanyakan apakah seorang pembuat parfum ditempatkan dalam Umrah sebelum mencukur atau memangkas rambutnya, dan menanyakan tentang keputusannya. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21849) menjawab bahwa jika parfum diletakkan sebelum dicukur atau dipangkas dengan sengaja, ia harus membayar fidya sesuai dengan rincian dalam jawaban."
