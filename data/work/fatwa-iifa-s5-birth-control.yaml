id: work/fatwa-iifa-s5-birth-control
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن تنظيم النسل", en: "IIFA resolution on birth regulation", ur: "اکیڈمی کی قرارداد: تنظیم نسل", es: "Resolución de la IIFA sobre regulación de la natalidad" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: لا يجوز إصدار قانون عام يحد من حرية الزوجين في الإنجاب، ويحرم استئصال القدرة على الإنجاب ⁦(الإعقام)⁩ في الرجل أو المرأة ما لم تدع الضرورة بمعاييرها الشرعية، ويجوز التحكم المؤقت في الإنجاب بقصد المباعدة بين فترات الحمل أو إيقافه لضرورة معتبرة شرعًا على ما فصّل."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on birth regulation: no general law may restrict a couple's freedom to reproduce; permanently removing reproductive capacity (sterilisation) in man or woman is forbidden unless necessity calls with its sharia measures; temporary control to space pregnancies or stop for a legally recognised necessity is permissible, as it details."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩ تنظیم نسل پر: عام قانون سے اولاد کی آزادانہ پیدائش محدود نہیں کی جا سکتی؛ مستقل بانجھ پن حرام مگر شرعی ضرورت میں؛ عارضی وقفہ بندی جائز ہے۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre la regulación de la natalidad: ninguna ley general puede restringir la libertad reproductiva de una pareja; la eliminación permanente de la capacidad reproductiva (esterilización) en el hombre o la mujer está prohibida a menos que la necesidad lo exija con sus medidas sharia; el control temporal para espaciar los embarazos o detenerlos por una necesidad legalmente reconocida es permisible, como se detalla."
