id: work/fatwa-amja-imam-joining-for-rain
class: work
kind: fatwa
label: { ar: "جمع الإمام للمطر", en: "The imam joining prayers in the mosque when it rains", ur: "امام بارش پر جمع کرے", es: "El imán participando en las oraciones en la mezquita cuando llueve.", fr: "L'imam se joint à la prière à la mosquée lorsqu'il pleut." }
summary:
  ar: "سأل سائل عن جواز أن يجمع الإمام صلاتين في المسجد إذا هطل المطر. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86010 بتاريخ 29 نوفمبر 2011)⁩ أنه إذا بل المطر الثياب جاز الترخص في الصلاة في الرحال والجمع بين الصلاتين لكنهم يوصون بعدم الجفاء في استخدام الرخصة مع تقدم وسائل التعامل مع الظروف المناخية على ما فصّل الجواب."
  en: "A questioner asked whether the imam may join two prayers in the mosque when rain falls. AMJA's fatwa committee (fatwa no. 86010, 29 November 2011) answered that when rain soaks the clothes, the concession of praying at one's lodging and joining the prayers is lawful — while counseling against dry overuse of the concession given modern means of handling weather — as the answer details."
  ur: "بارش پر جمع؟ لجنة الفتوى ⁦(فتویٰ 86010، 29 نومبر 2011)⁩ کے مطابق کپڑے بھیگیں تو جائز؛ البتہ رخصت کا بے جا استعمال نہ ہو۔"
  es: "Un consultante preguntó si el imán puede unirse a dos oraciones en la mezquita cuando llueve. El comité de fatuas de AMJA (fatua n.° 86010, 29 de noviembre de 2011) respondió que cuando la lluvia empapa la ropa, es lícito rezar en el propio alojamiento y unirse a las oraciones, aunque desaconsejó el uso excesivo de esta concesión en condiciones de sequía, dados los medios modernos para afrontar el clima, como se detalla en la respuesta."
  fr: "Un fidèle a demandé si l'imam pouvait réunir deux prières à la mosquée en cas de pluie. Le comité des fatwas de l'AMJA (fatwa n° 86010, 29 novembre 2011) a répondu que lorsque la pluie trempe les vêtements, il est permis de prier chez soi et de rejoindre la prière en cours, tout en déconseillant d'abuser de cette pratique compte tenu des moyens modernes de gérer les intempéries, comme le précise la réponse."
