id: work/fatwa-amja-imam-joining-for-rain
class: work
kind: fatwa
label: { ar: "جمع الإمام للمطر", en: "The imam joining prayers in the mosque when it rains", ur: "امام بارش پر جمع کرے" }
summary:
  ar: "سأل سائل عن جواز أن يجمع الإمام صلاتين في المسجد إذا هطل المطر. أجابت لجنة الفتوى بمجمع فقهاء الشريعة بأمريكا ⁦(فتوى رقم 86010 بتاريخ 29 نوفمبر 2011)⁩ أنه إذا بل المطر الثياب جاز الترخص في الصلاة في الرحال والجمع بين الصلاتين لكنهم يوصون بعدم الجفاء في استخدام الرخصة مع تقدم وسائل التعامل مع الظروف المناخية على ما فصّل الجواب."
  en: "A questioner asked whether the imam may join two prayers in the mosque when rain falls. AMJA's fatwa committee (fatwa no. 86010, 29 November 2011) answered that when rain soaks the clothes, the concession of praying at one's lodging and joining the prayers is lawful — while counseling against dry overuse of the concession given modern means of handling weather — as the answer details."
  ur: "بارش پر جمع؟ لجنة الفتوى ⁦(فتویٰ 86010، 29 نومبر 2011)⁩ کے مطابق کپڑے بھیگیں تو جائز؛ البتہ رخصت کا بے جا استعمال نہ ہو۔"
