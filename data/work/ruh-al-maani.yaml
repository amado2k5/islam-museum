label: { ar: "روح المعاني في تفسير القرآن العظيم والسبع المثاني", en: "Ruh al-Ma'ani", ur: "روح المعانی فی تفسیر القرآن العظیم والسبع المثانی" }
summary:
  ar: "تفسير أبي الثناء شهاب الدين محمود الألوسي البغدادي (1217–1270هـ)، مفتي بغداد؛ شرع فيه ليلة السادس عشر من شعبان 1252هـ بعد رؤيا رآها في رجب من السنة نفسها، وسماه الوزير علي رضا باشا، واشتغل فيه خمسة عشر عامًا، فجاء في ثلاثين جزءًا، وطُبع أول مرة في بولاق سنة 1301هـ."
  en: "The commentary of Abu al-Thana' Shihab al-Din Mahmud al-Alusi of Baghdad (1217–1270 AH), mufti of Baghdad; he began it on the night of 16 Sha'ban 1252 after a dream he had in Rajab of that year, the vizier Ali Rida Pasha named it, and he worked on it for fifteen years; it runs to thirty parts and was first printed at Bulaq in 1301 AH."
  ur: "ابو الثناء شہاب الدین محمود آلوسی بغدادی (1217–1270ھ)، مفتیِ بغداد، کی تفسیر؛ انہوں نے رجب 1252ھ میں ایک خواب کے بعد اسی سال 16 شعبان کی رات اسے شروع کیا، وزیر علی رضا پاشا نے اس کا نام رکھا، اور وہ پندرہ برس اس پر کام کرتے رہے؛ یہ تیس اجزا میں ہے اور پہلی بار 1301ھ میں بولاق سے چھپی۔"
