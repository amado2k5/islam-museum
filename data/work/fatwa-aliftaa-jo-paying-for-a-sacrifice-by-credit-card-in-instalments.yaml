id: work/fatwa-aliftaa-jo-paying-for-a-sacrifice-by-credit-card-in-instalments
class: work
kind: fatwa
label: { ar: "تقسيط الأضاحي عبر البطاقات الائتمانية", en: "Paying for a sacrifice by credit card in instalments", ur: "قربانی کی قیمت کریڈٹ کارڈ سے قسطوں میں ادا کرنا" }
summary:
  ar: "سؤال عن تقسيط الأضاحي عبر البطاقات الائتمانية، أجابت فيه دائرة الإفتاء العام الأردنية بأن الأضحية سنة للمستطيع وتصح ممن استدان لها، وأن شراءها ببطاقة ائتمانية مغطاة لا حرج فيه، وبغير المغطاة يجوز بشروط: ألا تشترط زيادة ربوية، ولا غرامة تأخير، وألا يرفع التاجر السعر بسبب عمولة البطاقة. أجابت الدائرة بأن الأضحية سنة في حق المستطيع ولا تطلب من غيره، لكنه لو تكلف واستدان لها صحت منه، ونقلت عن النووي في المجموع (8/383) أن التضحية سنة مؤكدة وشعار ظاهر ينبغي للقادر المحافظة عليه، ولا تجب إلا بالنذر. وقالت إن شراء الأضحية ببطاقة ائتمانية مغطاة الرصيد لا حرج فيه، أما غير المغطاة فالمبلغ المدفوع بها بمثابة القرض، ويباح الشراء حينئذ بثلاثة شروط: ألا تشترط الجهة المصدرة أي زيادة ربوية على المبلغ، وألا تشترط غرامة على التأخر في السداد، وألا يزيد التاجر السعر بسبب العمولة التي تأخذها منه جهة البطاقة. وخلصت إلى صحة شراء الأضاحي بالتقسيط عبر البطاقات الائتمانية عمومًا مع مراعاة هذه الشروط، وأن الحكم على بطاقة معينة يتطلب الاطلاع على شروطها بالتفصيل."
  en: "A question about paying for a sacrifice by credit card in instalments, in which Jordan's General Iftaa Department answered that the sacrifice is a sunna for those who can afford it and is valid from someone who borrows for it; buying it with a credit card backed by funds is unobjectionable, and with an unbacked card it is permitted on three conditions: no interest increase, no late-payment fine, and no price rise by the merchant because of the card commission. The Department answered that the sacrifice is a sunna for those able to afford it and is not asked of others, though if someone burdens himself and borrows for it, his sacrifice is valid. It quoted al-Nawawi in al-Majmu (8/383) that the sacrifice is an emphasised sunna and a visible rite that those able should keep up, and becomes obligatory only by a vow. It said that buying the sacrifice with a card backed by sufficient funds is unobjectionable; with an unbacked card the amount paid is effectively a loan, and the purchase is then permitted on three conditions: the issuer does not stipulate any interest increase on the amount, does not stipulate a fine for late repayment, and the merchant does not raise the price because of the commission the card company takes from him. It concluded that buying sacrifices in instalments through credit cards is generally valid if these conditions are met, while judging a particular card requires examining its terms in detail."
  ur: "قربانی کی قیمت کریڈٹ کارڈ سے قسطوں میں ادا کرنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قربانی استطاعت رکھنے والے کے لیے سنت ہے اور قرض لے کر کرنے والے کی بھی درست ہے؛ رقم والے کریڈٹ کارڈ سے خریدنے میں کوئی حرج نہیں، اور بغیر رقم والے کارڈ سے تین شرطوں کے ساتھ جائز ہے: کوئی سودی اضافہ نہ ہو، تاخیر کا جرمانہ نہ ہو، اور تاجر کارڈ کمیشن کی وجہ سے قیمت نہ بڑھائے۔ ڈیپارٹمنٹ نے جواب دیا کہ قربانی استطاعت والے کے لیے سنت ہے اور دوسروں سے مطلوب نہیں، لیکن اگر کوئی تکلف کر کے قرض لے تو اس کی قربانی درست ہے۔ اس نے المجموع (8/383) میں نووی سے نقل کیا کہ قربانی سنتِ مؤکدہ اور ظاہری شعار ہے جس کی پابندی صاحبِ استطاعت کو کرنی چاہیے، اور یہ صرف نذر سے واجب ہوتی ہے۔ اس نے کہا کہ کافی رقم والے کارڈ سے قربانی خریدنے میں کوئی حرج نہیں؛ بغیر رقم والے کارڈ سے ادا کی گئی رقم قرض کے حکم میں ہے، اور اس وقت تین شرطوں کے ساتھ خریداری جائز ہے: جاری کرنے والا ادارہ رقم پر کوئی سودی اضافہ شرط نہ کرے، تاخیر سے ادائیگی پر جرمانہ شرط نہ کرے، اور تاجر کارڈ کمپنی کے لیے جانے والے کمیشن کی وجہ سے قیمت نہ بڑھائے۔ اس نے نتیجہ نکالا کہ ان شرائط کے ساتھ کریڈٹ کارڈ کے ذریعے قسطوں پر قربانی خریدنا عموماً درست ہے، جبکہ کسی خاص کارڈ پر حکم لگانے کے لیے اس کی شرائط کا تفصیلی مطالعہ ضروری ہے۔"
