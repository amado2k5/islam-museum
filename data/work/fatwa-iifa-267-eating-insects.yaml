label: { ar: "قرار مجمع الفقه الإسلامي الدولي 267 (12/26) بشأن حكم الشرع في تناول وتسويق الحشرات", en: "IIFA resolution 267 (12/26) on the sharia ruling on eating and marketing insects", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 267 (12/26): کیڑے مکوڑے کھانے اور ان کی فروخت کا شرعی حکم", es: "Resolución 267 (12/26) de la IIFA sobre la norma islámica relativa al consumo y la comercialización de insectos.", fr: "Résolution 267 (12/26) de l'IIFA sur la décision de la charia concernant la consommation et la commercialisation des insectes", tr: "Böceklerin ele alınması ve pazarlanmasına ilişkin Şeriat kararı 267 (12/26)", id: "Resolusi Akademi Fiqh Islam Internasional 267 (26/12) mengenai putusan Syariah tentang penanganan dan pemasaran serangga" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩ في موضوع تناول وتسويق الحشرات. اطلع المجمع على البحوث المقدمة وعلى توصيات ندوة عقدها بالتعاون مع الهيئة العامة للغذاء والدواء السعودية بجدة يومي 21 و22 ربيع الأول 1446هـ ⁦(24–25 سبتمبر 2024م)⁩، وقرر تأجيل البت في الموضوع لمزيد من الدراسة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025) on eating and marketing insects. After reviewing the submitted research and the recommendations of a seminar held with the Saudi Food and Drug Authority in Jeddah on 21–22 Rabi' al-Awwal 1446 (24–25 September 2024), the Academy decided to defer a ruling on the matter for further study."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں، کیڑے مکوڑے کھانے اور فروخت کرنے کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات اور سعودی فوڈ اینڈ ڈرگ اتھارٹی کے ساتھ جدہ میں 21–22 ربیع الاول 1446ھ ⁦(24–25 ستمبر 2024ء)⁩ کو منعقدہ سیمینار کی سفارشات کا جائزہ لینے کے بعد موضوع پر فیصلہ مزید مطالعے کے لیے مؤخر کرنے کا فیصلہ کیا۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica (Fiqh) en su 26.ª sesión celebrada en Doha (del 6 al 10 de Dhu al-Qa'da de 1446, del 4 al 8 de mayo de 2025) sobre el consumo y la comercialización de insectos. Tras revisar la investigación presentada y las recomendaciones de un seminario celebrado con la Autoridad Saudí de Alimentos y Medicamentos en Yeda los días 21 y 22 de Rabi' al-Awwal de 1446 (del 24 al 25 de septiembre de 2024), la Academia decidió aplazar la decisión sobre el asunto para realizar un estudio más profundo."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 26e session à Doha (6-10 Dhu al-Qa'da 1446, soit 4-8 mai 2025) concernant la consommation et la commercialisation des insectes. Après examen des recherches soumises et des recommandations d'un séminaire organisé avec l'Autorité saoudienne des aliments et des médicaments à Djeddah les 21 et 22 Rabi' al-Awwal 1446 (24-25 septembre 2024), l'Académie a décidé de reporter sa décision sur la question afin d'approfondir l'étude."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Doha'daki yirmi altıncı oturumunda (6–10 Dhu al-Qi'dah 1446 H, 4–8 Mayıs 2025) böcek tüketimi ve pazarlaması konusundaki ortak kararı. Akademi, sunulan araştırmaları ve 22 Rabi'al-Awwal 1446 Hile tarihlerinde Cidde'de Suudi Gıda ve İlaç Otoritesi iş birliğiyle düzenlediği seminerin önerilerini inceledi ve konuyla ilgili kararın daha ileri çalışmalar için ertelenmesine karar verdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-26 di Doha (6–10 Dhu al-Qi'dah 1446 H, 4–8 Mei 2025) mengenai topik konsumsi dan pemasaran serangga. Akademi meninjau penelitian yang diajukan dan rekomendasi seminar yang diadakan bekerja sama dengan Otoritas Obat dan Makanan Saudi di Jeddah pada 21 dan 22 Rabi al-Awwal 1446 AH (24–25 September 2024), dan memutuskan untuk menunda keputusan tersebut untuk studi lebih lanjut."
