label: { ar: "قرار مجمع الفقه الإسلامي الدولي 267 (12/26) بشأن حكم الشرع في تناول وتسويق الحشرات", en: "IIFA resolution 267 (12/26) on the sharia ruling on eating and marketing insects", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 267 (12/26): کیڑے مکوڑے کھانے اور ان کی فروخت کا شرعی حکم" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته السادسة والعشرين بالدوحة ⁦(6–10 ذو القعدة 1446هـ، 4–8 مايو 2025م)⁩ في موضوع تناول وتسويق الحشرات. اطلع المجمع على البحوث المقدمة وعلى توصيات ندوة عقدها بالتعاون مع الهيئة العامة للغذاء والدواء السعودية بجدة يومي 21 و22 ربيع الأول 1446هـ ⁦(24–25 سبتمبر 2024م)⁩، وقرر تأجيل البت في الموضوع لمزيد من الدراسة."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 26th session in Doha (6–10 Dhu al-Qa'da 1446, 4–8 May 2025) on eating and marketing insects. After reviewing the submitted research and the recommendations of a seminar held with the Saudi Food and Drug Authority in Jeddah on 21–22 Rabi' al-Awwal 1446 (24–25 September 2024), the Academy decided to defer a ruling on the matter for further study."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، دوحہ میں چھبیس ویں مجلس ⁦(6–10 ذی قعدہ 1446ھ، 4–8 مئی 2025ء)⁩ میں، کیڑے مکوڑے کھانے اور فروخت کرنے کے موضوع پر۔ اکیڈمی نے پیش کردہ تحقیقات اور سعودی فوڈ اینڈ ڈرگ اتھارٹی کے ساتھ جدہ میں 21–22 ربیع الاول 1446ھ ⁦(24–25 ستمبر 2024ء)⁩ کو منعقدہ سیمینار کی سفارشات کا جائزہ لینے کے بعد موضوع پر فیصلہ مزید مطالعے کے لیے مؤخر کرنے کا فیصلہ کیا۔"
