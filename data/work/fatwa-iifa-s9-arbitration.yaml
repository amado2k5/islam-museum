label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مبدأ التحكيم في الفقه الإسلامي", en: "IIFA resolution on the arbitration principle in Islamic fiqh", ur: "اکیڈمی کی قرارداد: فقہ اسلامی میں ثالثی کا اصول", es: "Resolución de la IIFA sobre el principio de arbitraje en el fiqh islámico" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: التحكيم اتفاق طرفي خصومة على تولية من يفصل في منازعة بينهما بحكم ملزم يطبق الشريعة وهو مشروع بين الأفراد وفي المنازعات الدولية، وهو عقد غير لازم يجوز الرجوع فيه ما لم يشرع الحكم فيه، وبيّن بقية الأحكام على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on arbitration in Islamic fiqh: arbitration is the agreement of two disputing parties to empower one who settles their dispute by a binding ruling applying the sharia; it is lawful between individuals and in international disputes; it is a non-binding contract either party may withdraw from until the arbitrator begins — with the rest detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ ثالثی پر: شریعت کے مطابق فیصلہ دینے والے کی تقرری کا معاہدہ افراد اور بین الاقوامی تنازعات میں جائز؛ شروع ہونے تک غیر لازم۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre el arbitraje en el fiqh islámico: el arbitraje es el acuerdo de dos partes en disputa para facultar a una que resuelva su disputa mediante un fallo vinculante que aplique la sharia; es lícito entre particulares y en disputas internacionales; es un contrato no vinculante del que cualquiera de las partes puede retirarse hasta que el árbitro comience — con el resto detallado."
