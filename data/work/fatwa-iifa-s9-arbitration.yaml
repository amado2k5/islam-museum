label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مبدأ التحكيم في الفقه الإسلامي", en: "IIFA resolution on the arbitration principle in Islamic fiqh", ur: "اکیڈمی کی قرارداد: فقہ اسلامی میں ثالثی کا اصول", es: "Resolución de la IIFA sobre el principio de arbitraje en el fiqh islámico", fr: "Résolution de l'IIFA sur le principe d'arbitrage en jurisprudence islamique (fiqh)", tr: "Uluslararası İslami Fiqh Akademisi'nin İslam fıkıhında tahkim ilkesine ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai prinsip arbitrase dalam yurisprudensi Islam" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته التاسعة ⁦(أبوظبي، أبريل 1995م)⁩: التحكيم اتفاق طرفي خصومة على تولية من يفصل في منازعة بينهما بحكم ملزم يطبق الشريعة وهو مشروع بين الأفراد وفي المنازعات الدولية، وهو عقد غير لازم يجوز الرجوع فيه ما لم يشرع الحكم فيه، وبيّن بقية الأحكام على ما فصّل."
  en: "IIFA's ninth-session resolution (Abu Dhabi, April 1995) on arbitration in Islamic fiqh: arbitration is the agreement of two disputing parties to empower one who settles their dispute by a binding ruling applying the sharia; it is lawful between individuals and in international disputes; it is a non-binding contract either party may withdraw from until the arbitrator begins — with the rest detailed."
  ur: "اکیڈمی کی نویں مجلس کی قرارداد ⁦(ابوظہبی، اپریل 1995ء)⁩ ثالثی پر: شریعت کے مطابق فیصلہ دینے والے کی تقرری کا معاہدہ افراد اور بین الاقوامی تنازعات میں جائز؛ شروع ہونے تک غیر لازم۔"
  es: "Resolución de la novena sesión de la IIFA (Abu Dabi, abril de 1995) sobre el arbitraje en el fiqh islámico: el arbitraje es el acuerdo de dos partes en disputa para facultar a una que resuelva su disputa mediante un fallo vinculante que aplique la sharia; es lícito entre particulares y en disputas internacionales; es un contrato no vinculante del que cualquiera de las partes puede retirarse hasta que el árbitro comience — con el resto detallado."
  fr: "Résolution de la neuvième session de l'IIFA (Abou Dhabi, avril 1995) sur l'arbitrage en matière de fiqh islamique: l'arbitrage est un accord entre deux parties en conflit pour habiliter une personne à régler leur différend par une décision contraignante appliquant la charia; il est licite entre particuliers et dans les litiges internationaux; il s'agit d'un contrat non contraignant dont chaque partie peut se retirer jusqu'à ce que l'arbitre commence — le reste étant détaillé."
  tr: "Uluslararası İslami Fiqh Akademisi'nin dokuzuncu oturumunda (Abu Dabi, Nisan 1995) karar verdiği karar: Tahkim, uyuşmazlık tarafları arasında, şeriatı uygulayarak bağlayıcı bir kararla bir tarafın karara bağlanması için bir taraf atanmasına ilişkin bir anlaşmadır ve bu, bireyler arasında ve uluslararası uyuşmazlıklarda meşrudur. Bu, bağlayıcı olmayan bir sözleşmedir ve bir karar verilmedikçe iptal edilebilir; diğer hükümler ise çözülen anlaşmaya dayanır."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kesembilannya (Abu Dhabi, April 1995): Arbitrase adalah kesepakatan antara pihak-pihak dalam sengketa untuk menunjuk pihak yang memutuskan sengketa di antara mereka melalui putusan mengikat yang menerapkan Syariah, yang sah antara individu dan sengketa internasional. Ini adalah kontrak yang tidak mengikat yang dapat dicabut kecuali putusan telah diberikan, dan ketentuan lainnya didasarkan pada apa yang telah diselesaikan."
