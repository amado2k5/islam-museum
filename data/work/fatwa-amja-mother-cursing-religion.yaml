id: work/fatwa-amja-mother-cursing-religion
class: work
kind: fatwa
label: { ar: "أم تسب الدين دون علم", en: "A mother who curses religion unknowingly", ur: "دین کی گالی دینے والی ناواقف ماں", es: "Una madre que maldice la religión sin saberlo" }
summary:
  ar: "سأل شاب في السادسة عشر تطلق والداه مرتين وما زالا يحب بعضهما عن أمه التي تسب الدين وهي لا تعلم أنه يؤدي إلى الكفر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85782 بتاريخ 28 أكتوبر 2011)⁩ بالثناء على بره بوالديه ووصاه بالاستمرار في النصح والاجتهاد في بيان خطورة سب الدين وكونه من نواقض الإسلام، وأما ما مضى منه وكانت لا تدري حكمه فأرجو ألا يؤثر على العلاقة الزوجية القائمة بينهما، لكن استدامة هذا الوضع يوبق دنياهما وآخرتهما فليكن لهما من الناصحين ويرع آخرتهما كما رعيا دنياه صغيرًا."
  en: "A sixteen-year-old whose loving parents have divorced twice asked about his mother, who curses religion not knowing it leads to disbelief. Dr. Salah al-Sawi (fatwa no. 85782, 28 October 2011) praised his dutifulness, urged him to persist in advising them and to make clear the gravity of cursing religion as a nullifier of Islam; as for the past, done in ignorance of its ruling, he hopes it does not affect the marriage between them — but letting the state continue ruins their world and hereafter, so he should be among their counsellors and tend their hereafter as they tended his childhood world. Recorded as AMJA's answer."
  ur: "سولہ سالہ نوجوان نے پوچھا کہ اس کی ماں دین کی گالی دیتی ہے اور اسے کفر کی حیثیت کا علم نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85782، 28 اکتوبر 2011)⁩ کے مطابق نصیحت جاری رکھے؛ ماضی کا ناواقفانہ عمل نکاح پر اثر نہیں ڈالتا مگر اس حال کا استمرار تباہی ہے۔"
  es: "Un joven de dieciséis años, cuyos amorosos padres se han divorciado dos veces, preguntó por su madre, quien maldice la religión sin saber que esto conduce a la incredulidad. El Dr. Salah al-Sawi (fatwa n.° 85782, 28 de octubre de 2011) elogió su diligencia, lo instó a perseverar en aconsejarlos y a dejar claro la gravedad de maldecir la religión como anulador del Islam; en cuanto al pasado, cometido por desconocimiento de su norma, espera que no afecte su matrimonio, pero permitir que el Estado continúe arruina su vida terrenal y su vida después de la muerte, por lo que debería ser uno de sus consejeros y velar por su futuro como ellos velaron por su infancia. Registrado como respuesta de AMJA."
