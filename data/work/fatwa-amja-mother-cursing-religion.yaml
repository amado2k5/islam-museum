id: work/fatwa-amja-mother-cursing-religion
class: work
kind: fatwa
label: { ar: "أم تسب الدين دون علم", en: "A mother who curses religion unknowingly", ur: "دین کی گالی دینے والی ناواقف ماں", es: "Una madre que maldice la religión sin saberlo", fr: "Une mère qui maudit la religion sans le savoir", tr: "Ya da bilgisi olmadan dine hakaret ediyor", id: "Atau menghina agama tanpa pengetahuan" }
summary:
  ar: "سأل شاب في السادسة عشر تطلق والداه مرتين وما زالا يحب بعضهما عن أمه التي تسب الدين وهي لا تعلم أنه يؤدي إلى الكفر. أجاب د. صلاح الصاوي ⁦(فتوى رقم 85782 بتاريخ 28 أكتوبر 2011)⁩ بالثناء على بره بوالديه ووصاه بالاستمرار في النصح والاجتهاد في بيان خطورة سب الدين وكونه من نواقض الإسلام، وأما ما مضى منه وكانت لا تدري حكمه فأرجو ألا يؤثر على العلاقة الزوجية القائمة بينهما، لكن استدامة هذا الوضع يوبق دنياهما وآخرتهما فليكن لهما من الناصحين ويرع آخرتهما كما رعيا دنياه صغيرًا."
  en: "A sixteen-year-old whose loving parents have divorced twice asked about his mother, who curses religion not knowing it leads to disbelief. Dr. Salah al-Sawi (fatwa no. 85782, 28 October 2011) praised his dutifulness, urged him to persist in advising them and to make clear the gravity of cursing religion as a nullifier of Islam; as for the past, done in ignorance of its ruling, he hopes it does not affect the marriage between them — but letting the state continue ruins their world and hereafter, so he should be among their counsellors and tend their hereafter as they tended his childhood world. Recorded as AMJA's answer."
  ur: "سولہ سالہ نوجوان نے پوچھا کہ اس کی ماں دین کی گالی دیتی ہے اور اسے کفر کی حیثیت کا علم نہیں۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 85782، 28 اکتوبر 2011)⁩ کے مطابق نصیحت جاری رکھے؛ ماضی کا ناواقفانہ عمل نکاح پر اثر نہیں ڈالتا مگر اس حال کا استمرار تباہی ہے۔"
  es: "Un joven de dieciséis años, cuyos amorosos padres se han divorciado dos veces, preguntó por su madre, quien maldice la religión sin saber que esto conduce a la incredulidad. El Dr. Salah al-Sawi (fatwa n.° 85782, 28 de octubre de 2011) elogió su diligencia, lo instó a perseverar en aconsejarlos y a dejar claro la gravedad de maldecir la religión como anulador del Islam; en cuanto al pasado, cometido por desconocimiento de su norma, espera que no afecte su matrimonio, pero permitir que el Estado continúe arruina su vida terrenal y su vida después de la muerte, por lo que debería ser uno de sus consejeros y velar por su futuro como ellos velaron por su infancia. Registrado como respuesta de AMJA."
  fr: "Un jeune homme de seize ans, dont les parents aimants ont divorcé deux fois, a posé une question concernant sa mère, qui blasphème sans savoir que cela conduit à l'incroyance. Le Dr Salah al-Sawi (fatwa n° 85782, 28 octobre 2011) a salué son dévouement, l'a exhorté à persévérer dans ses conseils et à lui faire comprendre la gravité de blasphème, qui annule l'islam. Quant à ses actes passés, commis par ignorance de la loi islamique, il espère qu'ils n'affecteront pas leur mariage. Cependant, laisser l'État agir ainsi risque de ruiner leur vie et leur avenir. Il devrait donc être parmi leurs conseillers et veiller sur leur vie après la mort comme ils l'ont fait pour son enfance. (Réponse consignée par AMJA.)"
  tr: "İki kez boşanmış ve hâlâ birbirlerini seven on altı yaşındaki genç bir adam, annesinin dini bilmeden hakaret ettiğini ve bunun inançsızlığa yol açtığını soran on altı yaşındaki genç bir adam, annesinin dini hakaret ettiğini sordu. Dr. Salah Al-Sawy (28 Ekim 2011 tarihli Fetva No. 85782) ailesine karşı verdiği görevi övdü ve ona dinin lanetinin tehlikelerini ve İslam'ın geçersiz kılıcılarından biri olduğunu açıklamaya devam etmesini tavsiye etti. Yaşananlara gelince, onun hükümünü bilmediği için, umarım aralarındaki evlilik ilişkisini etkilemez. Ancak bu durumu sürdürmek hem hayatlarını hem de ahiretlerini korur. O, kendi dünyevi hayatına gösterdiği gibi öğütler arasında olsun ve onların ölümünü de gözetsin."
  id: "Seorang pemuda berusia enam belas tahun bertanya kepada orang tuanya yang telah bercerai dua kali dan masih saling mencintai tentang ibunya yang menghina agama tanpa mengetahui bahwa itu menimbulkan ketidakpercayaan. Dr. Salah Al-Sawy menanggapi (Fatwa No. 85782 tanggal 28 Oktober 2011) memuji kewajibannya kepada orang tuanya dan menyarankan agar terus memberi nasihat serta berusaha menjelaskan bahaya mengutuk agama dan bahwa agama adalah salah satu penampil Islam. Adapun apa yang telah terjadi dan dia tidak mengetahui keputusannya, saya berharap hal itu tidak memengaruhi hubungan pernikahan di antara mereka. Namun mempertahankan situasi ini menjaga kehidupan mereka dan akhirat mereka. Biarlah dia berada di antara para penasihat dan merawat akhirat mereka seperti dia merawat kehidupan duniawinya sendiri saat kecil."
