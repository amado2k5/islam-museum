id: work/fatwa-dar-alifta-eg-combining-fasting-intentions
class: work
kind: fatwa
label: { ar: "حكم الجمع بين نية القضاء وصوم الإثنين والخميس وعشر ذي الحجة", en: "Combining make-up fasting with Monday, Thursday and the ten of Dhu'l-Hijja", ur: "قضاء کے روزے کے ساتھ پیر جمعرات اور عشرہ ذوالحجہ کے روزوں کی نیت ملانا", es: "Combinar el ayuno compensatorio con el lunes, el jueves y los diez días de Dhu'l-Hijja" }
summary:
  ar: "سائل سأل عن الجمع بين نية قضاء رمضان وصوم عشر ذي الحجة وصوم الإثنين والخميس. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 23940)⁩ أن ذلك جائز ويُجزئ عن القضاء ويحصل أصل ثواب التطوع، إلا أنه لا يحصل له كامل ثواب التطوع المستقل كما فصّل الجواب."
  en: "A questioner asked about combining the intention of Ramadan make-up fasting with fasting the ten of Dhu'l-Hijja and Mondays and Thursdays. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 23940) answered that this is permissible, discharges the make-up and gains the basic reward of the voluntary fast — though it does not earn the complete reward of an independently intended voluntary fast, as the answer details."
  ur: "ایک سائل نے رمضان کے قضاء روزے کی نیت کو عشرہ ذوالحجہ اور پیر و جمعرات کے روزوں کے ساتھ ملانے کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 23940)⁩ نے جواب دیا کہ یہ جائز ہے، قضاء ادا ہوتا ہے اور تطوع کا اصل ثواب بھی ملتا ہے — البتہ الگ نیت والے تطوع کا پورا ثواب نہیں ملتا، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la posibilidad de combinar el ayuno compensatorio de Ramadán con el ayuno de los diez días de Dhu'l-Hijja, los lunes y los jueves. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 23940) respondió que esto es permisible, ya que permite compensar el ayuno y obtener la recompensa básica del ayuno voluntario, aunque no se obtiene la recompensa completa de un ayuno voluntario realizado de forma independiente, como se detalla en la respuesta."
