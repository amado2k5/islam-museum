label: { ar: "قصيدة المتنبي «عقبى اليمين على عقبى الوغى ندم»", en: "Al-Mutanabbi's ode 'The end of the oath at the end of the fray is regret'" }
summary:
  ar: "قصيدة من البسيط على روي الميم للمتنبي، قالها وقد تحدث بحضرة سيف الدولة أن البطريق أقسم عند ملكه أنه يعارض سيف الدولة، وأنشده إياها سنة 345هـ ⁦(956م)⁩ وهي آخر ما أنشده بحلب كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.419}}."
  en: "An ode in the basit metre on the rhyme mim by al-Mutanabbi; said when it was reported in Sayf al-Dawla's presence that the Byzantine patrician had sworn before his king to oppose him; recited in 345 AH (956 CE), the last he recited at Aleppo, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.419}}."
