label: { ar: "قصيدة المتنبي «عقبى اليمين على عقبى الوغى ندم»", en: "Al-Mutanabbi's ode 'The end of the oath at the end of the fray is regret'", es: "La oda de Al-Mutanabbi: \"El fin del juramento al final de la contienda es el arrepentimiento\".", fr: "L'ode d'Al-Mutanabbi: « La fin du serment à la fin du combat n'est que regret »", ur: "المتنبی کا قول 'میدان کے آخر میں قسم کا خاتمہ ندامت ہے'", tr: "Al-Mutanabbi'nin şiiri: 'Savaşın Sonundaki Sağın Sonuçları Pişmanlıktır'", id: "Puisi Al-Mutanabbi: 'Konsekuensi Hak di Belakang Pertempuran Adalah Penyesalan'" }
summary:
  ar: "قصيدة من البسيط على روي الميم للمتنبي، قالها وقد تحدث بحضرة سيف الدولة أن البطريق أقسم عند ملكه أنه يعارض سيف الدولة، وأنشده إياها سنة 345هـ ⁦(956م)⁩ وهي آخر ما أنشده بحلب كما يقدّم لها ديوان دار بيروت {{cite:diwan-mutanabbi-dar-beirut-1983 p.419}}."
  en: "An ode in the basit metre on the rhyme mim by al-Mutanabbi; said when it was reported in Sayf al-Dawla's presence that the Byzantine patrician had sworn before his king to oppose him; recited in 345 AH (956 CE), the last he recited at Aleppo, as the Dar Beirut edition introduces it {{cite:diwan-mutanabbi-dar-beirut-1983 p.419}}."
  es: "Una oda en metro basit sobre la rima mim de al-Mutanabbi; dicha cuando se informó en presencia de Sayf al-Dawla que el patricio bizantino había jurado ante su rey oponerse a él; recitada en 345 AH (956 d. C.), la última que recitó en Alepo, como la introduce la edición de Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.419}}."
  fr: "Une ode en mètre basit sur la rime mim par al-Mutanabbi; dite lorsqu'il fut rapporté en présence de Sayf al-Dawla que le patricien byzantin avait juré devant son roi de s'opposer à lui; récitée en 345 AH (956 CE), la dernière qu'il récita à Alep, comme l'indique l'édition Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 p.419}}."
  ur: "المتنبی کی نظم میم پر باسط میٹر میں ایک اوڈ؛ جب سیف الدولہ کی موجودگی میں یہ اطلاع ملی کہ بازنطینی سرپرست نے اپنے بادشاہ کے سامنے اس کی مخالفت کرنے کی قسم کھائی ہے۔ 345 ہجری ⁦(956 عیسوی)⁩ میں تلاوت کی گئی، آخری تلاوت انہوں نے حلب میں کی، جیسا کہ دار بیروت ایڈیشن نے اس کا تعارف کرایا ہے {{حوالہ:دیوان-متنبی-در-بیروت-1983 صفحہ 419}}۔"
  tr: "Al-Mutanabbi'nin Al-Mim anlatımı üzerine Al-Basit'ten, Saif al-Dawla'nın huzurunda penguenin kralının önünde Saif al-Dawla'ya karşı olduğunu yemin ettiğini ve 345 Hicri (956 M.S.) yılında ona okuduğu bir şiirdir. Bu, Halep'te okuduğu son şiirdir ve Diwan Dar Beyrut tarafından sunulduğu üzere {{cite:diwan-mutanabbi-dar-beirut-1983 s.419}} tarafından sunulmuştur."
  id: "Sebuah puisi dari Al-Basit tentang narasi Al-Mim oleh Al-Mutanabbi, yang ia bacakan di hadapan Saif al-Dawla bahwa penguin itu bersumpah di hadapan rajanya bahwa ia menentang Saif al-Dawla, dan membacakannya kepadanya pada tahun 345 H (956 M). Ini adalah puisi terakhir yang ia bacakan di Aleppo, sebagaimana disajikan oleh Diwan Dar Beirut {{cite:diwan-mutanabbi-dar-beirut-1983 hlm.419}}."
