summary:
  ar: "كتاب لخالد محمد خالد في سير ستين من أصحاب النبي بأسلوب أدبي، ظهر أولاً بالقاهرة سنة 1384هـ/1964م وفي خمسة أجزاء، ثم في طبعة موحدة؛ لا يدخل فيه الخلفاء الأربعة لأن المؤلف أفرد لكل منهم كتاباً، ويعتمد على الإصابة والاستيعاب وأسد الغابة وسيرة ابن هشام وطبقات ابن سعد والبداية والنهاية وحلية الأولياء."
  en: "Khalid Muhammad Khalid's literary portraits of sixty Companions of the Prophet, first published in Cairo in 1384/1964 and in five parts, then in a unified edition; it leaves out the four caliphs, to whom the author devoted separate books, and draws on al-Isaba, al-Isti'ab, Usd al-Ghaba, Ibn Hisham, Ibn Sa'd, al-Bidaya wa-al-Nihaya and Hilyat al-Awliya'."
