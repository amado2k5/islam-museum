summary:
  ar: "سائل سأل عن الأولوية بين شعيرة الأضحية والعقيقة لمن عجز عن القيام بهما معًا. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20815)⁩ أن الأضحية والعقيقة سنتان مؤكدتان مطلوبتان بحسب يسار المكلف فإن عجز عن القيام بهما معًا فتفصيل التقديم في الجواب."
  en: "A questioner asked about precedence between the udhiyya and the aqiqa for one unable to do both. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20815) answered that both are emphatic sunnas sought according to means; when one cannot do both, the answer sets out the order."
  ur: "ایک سائل نے قربانی اور عقیقہ میں اولویت پوچھی جب دونوں کرنا ممکن نہ ہو۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20815)⁩ نے جواب دیا کہ دونوں مؤکد سنتیں ہیں استطاعت کے مطابق؛ دونوں نہ ہو سکیں تو ترتیب جواب میں ہے۔"
