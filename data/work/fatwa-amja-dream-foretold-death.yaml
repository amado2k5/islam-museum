id: work/fatwa-amja-dream-foretold-death
class: work
kind: fatwa
label: { ar: "حلم أنذر بموت صاحبه", en: "A dream that warned of the dreamer's death", ur: "خواب جس نے صاحب کی موت کی پیشگوئی کی" }
summary:
  ar: "سأل سائل عن شاب حلم أنه سيموت في حادث سير فوقع ذلك فعلًا هل أخبره الله أم ماذا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81850 بتاريخ 12 يوليو 2010)⁩ أن الأمر قد يكون كما قال ولا جزم لهم بذلك، ومرد الأمر في الأعم الأغلب إلى صلاح الرائي أو عدم صلاحه."
  en: "A questioner told of a young man who dreamt he would die in a road accident, and it came to pass — did God inform him or what? Dr. Salah al-Sawi (fatwa no. 81850, 12 July 2010) answered that it may be as he says, though they cannot assert it; the matter returns mostly to the dreamer's righteousness or lack of it."
  ur: "ایک سائل نے پوچھا کہ نوجوان نے خواب میں اپنی موت حادثے میں دیکھی اور واقعی وہی ہوا — کیا اللہ نے خبر دی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81850، 12 جولائی 2010)⁩ کے مطابق ممکن ہے مگر قطع نہیں؛ بات خواب دیکھنے والے کی صلاح پر منحصر ہے۔"
