id: work/fatwa-amja-dream-foretold-death
class: work
kind: fatwa
label: { ar: "حلم أنذر بموت صاحبه", en: "A dream that warned of the dreamer's death", ur: "خواب جس نے صاحب کی موت کی پیشگوئی کی", es: "Un sueño que advertía de la muerte del soñador.", fr: "Un rêve qui annonçait la mort du rêveur" }
summary:
  ar: "سأل سائل عن شاب حلم أنه سيموت في حادث سير فوقع ذلك فعلًا هل أخبره الله أم ماذا. أجاب د. صلاح الصاوي ⁦(فتوى رقم 81850 بتاريخ 12 يوليو 2010)⁩ أن الأمر قد يكون كما قال ولا جزم لهم بذلك، ومرد الأمر في الأعم الأغلب إلى صلاح الرائي أو عدم صلاحه."
  en: "A questioner told of a young man who dreamt he would die in a road accident, and it came to pass — did God inform him or what? Dr. Salah al-Sawi (fatwa no. 81850, 12 July 2010) answered that it may be as he says, though they cannot assert it; the matter returns mostly to the dreamer's righteousness or lack of it."
  ur: "ایک سائل نے پوچھا کہ نوجوان نے خواب میں اپنی موت حادثے میں دیکھی اور واقعی وہی ہوا — کیا اللہ نے خبر دی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 81850، 12 جولائی 2010)⁩ کے مطابق ممکن ہے مگر قطع نہیں؛ بات خواب دیکھنے والے کی صلاح پر منحصر ہے۔"
  es: "Un consultante relató el caso de un joven que soñó que moriría en un accidente de tráfico, y así sucedió. ¿Acaso Dios se lo reveló? El Dr. Salah al-Sawi (fatwa n.º 81850, 12 de julio de 2010) respondió que podría ser cierto, aunque no pueden afirmarlo con certeza; la cuestión depende principalmente de la rectitud del soñador o de su falta de ella."
  fr: "Un internaute a raconté l'histoire d'un jeune homme qui avait rêvé qu'il mourrait dans un accident de la route, et le rêve s'est réalisé. Dieu l'en avait-il averti ? Le Dr Salah al-Sawi (fatwa n° 81850, 12 juillet 2010) a répondu que cela pouvait être le cas, bien qu'on ne puisse l'affirmer avec certitude; la question dépend surtout de la piété du rêveur."
