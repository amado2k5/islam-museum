id: work/fatwa-dar-alifta-eg-agent-deducting-principals-money
class: work
kind: fatwa
label: { ar: "حكم خصم الوكيل مبلغًا من مال الموّكل دون علمه مقابل عمل", en: "An agent deducting from the principal's money without his knowledge in return for work", ur: "وکیل کا بغیر اطلاع موکل کے مال سے اپنی محنت کاٹنا", es: "Un agente que deduce dinero del principal sin su conocimiento a cambio de trabajo.", fr: "Un agent qui prélève une somme sur l'argent du mandant à son insu en échange de services." }
summary:
  ar: "سائل قبل بيع سيارة نيابة عن المشتري الأول والتزم بتحمل مصاريف استخراج التراخيص. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24365)⁩ أنه ما دام قد قبل البيع نيابة عن المشتري والتزم بمصاريف التراخيص فإنه يلزمه شرعًا أن يسلّم إليه كامل الثمن، ولا يجوز له خصم شيء من مال موكله دون علمه إلا بإذن أو اتفاق."
  en: "A questioner had agreed to sell a car on a first buyer's behalf, undertaking to cover licensing costs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24365) answered that since he accepted the sale as agent and undertook the licensing expenses, he is legally bound to hand over the full price, and may not deduct anything from his principal's money without his knowledge except by permission or agreement."
  ur: "ایک سائل نے پہلے خریدار کی طرف سے ایک گاڑی بیچنے کا اتفاق کیا اور لائسنس کے اخراجات برداشت کرنے کا عہد لیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24365)⁩ نے جواب دیا کہ جب اس نے بطور وکیل فروخت قبول کی اور اخراجات کا عہد لیا تو شرعاً اس پر لازم ہے کہ پوری قیمت دے دے، اور اجازت یا اتفاق کے بغیر موکل کے مال میں سے کچھ نہ کاٹے۔"
  es: "Un consultante había accedido a vender un automóvil en nombre del primer comprador, comprometiéndose a cubrir los gastos de matriculación. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 24365) respondió que, dado que aceptó la venta como agente y asumió los gastos de matriculación, está legalmente obligado a entregar el precio íntegro y no puede deducir nada del dinero de su representado sin su conocimiento, salvo con su autorización o acuerdo."
  fr: "Un individu avait accepté de vendre une voiture pour le compte d'un premier acheteur, s'engageant à prendre en charge les frais d'immatriculation. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 24365) a répondu que, puisqu'il avait accepté la vente en tant qu'agent et pris en charge les frais d'immatriculation, il était légalement tenu de remettre l'intégralité du prix et ne pouvait rien déduire de la somme due à son mandant sans son accord préalable."
