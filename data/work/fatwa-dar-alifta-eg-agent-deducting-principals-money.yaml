label: { ar: "حكم خصم الوكيل مبلغًا من مال الموّكل دون علمه مقابل عمل", en: "An agent deducting from the principal's money without his knowledge in return for work", ur: "وکیل کا بغیر اطلاع موکل کے مال سے اپنی محنت کاٹنا" }
summary:
  ar: "سائل قبل بيع سيارة نيابة عن المشتري الأول والتزم بتحمل مصاريف استخراج التراخيص. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 24365)⁩ أنه ما دام قد قبل البيع نيابة عن المشتري والتزم بمصاريف التراخيص فإنه يلزمه شرعًا أن يسلّم إليه كامل الثمن، ولا يجوز له خصم شيء من مال موكله دون علمه إلا بإذن أو اتفاق."
  en: "A questioner had agreed to sell a car on a first buyer's behalf, undertaking to cover licensing costs. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 24365) answered that since he accepted the sale as agent and undertook the licensing expenses, he is legally bound to hand over the full price, and may not deduct anything from his principal's money without his knowledge except by permission or agreement."
  ur: "ایک سائل نے پہلے خریدار کی طرف سے ایک گاڑی بیچنے کا اتفاق کیا اور لائسنس کے اخراجات برداشت کرنے کا عہد لیا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 24365)⁩ نے جواب دیا کہ جب اس نے بطور وکیل فروخت قبول کی اور اخراجات کا عہد لیا تو شرعاً اس پر لازم ہے کہ پوری قیمت دے دے، اور اجازت یا اتفاق کے بغیر موکل کے مال میں سے کچھ نہ کاٹے۔"
