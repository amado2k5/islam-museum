id: work/fatwa-aliftaa-jo-buying-bales-of-used-clothes-and-toys-by-weight
class: work
kind: fatwa
label: { ar: "شراء البالات من الثياب والألعاب بالوزن", en: "Buying bales of used clothes and toys by weight", ur: "استعمال شدہ کپڑوں اور کھلونوں کی گانٹھیں وزن سے خریدنا" }
summary:
  ar: "سؤال عن شراء البالات من الثياب والألعاب بالوزن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا مانع من شراء البالات المغلقة بالوزن بعد رؤية عينة منها إذا جرى بذلك العرف وانتفت الجهالة المؤدية إلى النزاع والمخاطرة. أجابت الدائرة بأنه لا حرج في شراء البضائع التي يشق عدها أو يتعذر لكثرتها مغلفة بالوزن، وإن تبين تفاوت أفرادها بعد الفتح، تخفيفًا على الناس وجريًا على عاداتهم ما لم يؤد ذلك إلى شقاق أو نزاع، وقالت إن بعض الفقهاء قديمًا احتملوا بيع الثياب جزافًا إذا شق فتحها وعدها، إلا إذا أفضى ذلك إلى النزاع والغرر والمقامرة. واستشهدت بكلام لمحمد بن الحسن الشيباني في كتاب الحجة على أهل المدينة احتج فيه بجواز بيع عدل الثياب الذي يضره الفتح دون عد، قياسًا على بيع الجوز والبيض والخضار جزافًا، وقال إن بيع المجازفة من أجوز البيوع. وخلصت إلى أن شراء الثياب أو الألعاب فيما يعرف بالبالة لا مانع منه شرعًا عندما يجري به العرف وتنتفي الجهالة المؤدية إلى النزاع والمخاطرة."
  en: "A question about buying bales of used clothes and toys by weight, in which Jordan's General Iftaa Department answered that there is no objection to buying sealed bales by weight after seeing a sample, where custom has established it and there is no uncertainty that would lead to dispute or risk-taking. The Department answered that there is no objection to buying goods that are hard or impossible to count because of their number, packed and sold by weight, even if the individual items turn out to vary once opened, to ease people's trade and in keeping with their customs, so long as it does not cause discord or dispute; some earlier jurists accepted selling clothes in bulk without count when opening and counting them was burdensome, unless it led to dispute, excessive uncertainty or gambling. It quoted Muhammad ibn al-Hasan al-Shaybani in al-Hujja ala Ahl al-Madina, who argued that a bale of clothes that would be damaged by opening may be sold without counting, by analogy with selling walnuts, eggs and vegetables in bulk, and said that bulk sale is among the most clearly permissible sales. It concluded that buying clothes or toys in what is known as a bale is permitted when custom has established it and there is no uncertainty leading to dispute or risk."
  ur: "استعمال شدہ کپڑوں اور کھلونوں کی گانٹھیں وزن سے خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نمونہ دیکھنے کے بعد بند گانٹھیں وزن سے خریدنے میں کوئی رکاوٹ نہیں جب اس کا رواج ہو اور ایسی لاعلمی نہ ہو جو جھگڑے یا جوئے کی طرف لے جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ ایسے سامان کو جس کی گنتی کثرت کی وجہ سے مشکل یا ناممکن ہو، بند حالت میں وزن سے خریدنے میں کوئی حرج نہیں، چاہے کھولنے کے بعد اشیا میں فرق نکلے، لوگوں کی سہولت اور ان کے رواج کے مطابق، جب تک اس سے جھگڑا یا اختلاف نہ ہو؛ قدیم فقہا میں سے بعض نے کپڑوں کو بغیر گنتی ڈھیر کی صورت بیچنا قبول کیا جب انہیں کھولنا اور گننا مشکل ہو، الا یہ کہ اس سے جھگڑا، غرر یا جوا پیدا ہو۔ اس نے الحجۃ علی اہل المدینہ میں محمد بن حسن شیبانی کا قول نقل کیا، جنہوں نے دلیل دی کہ کپڑوں کی وہ گانٹھ جسے کھولنے سے نقصان ہو بغیر گنے بیچی جا سکتی ہے، جیسے اخروٹ، انڈے اور سبزیاں ڈھیر کی صورت بیچے جاتے ہیں، اور کہا کہ ڈھیر کی بیع سب سے واضح جائز بیوع میں سے ہے۔ اس نے نتیجہ نکالا کہ جسے گانٹھ کہا جاتا ہے اس میں کپڑے یا کھلونے خریدنا شرعاً جائز ہے جب اس کا رواج ہو اور جھگڑے اور خطرے کی طرف لے جانے والی لاعلمی نہ ہو۔"
