id: work/fatwa-aliftaa-jo-buying-bales-of-used-clothes-and-toys-by-weight
class: work
kind: fatwa
label: { ar: "شراء البالات من الثياب والألعاب بالوزن", en: "Buying bales of used clothes and toys by weight", ur: "استعمال شدہ کپڑوں اور کھلونوں کی گانٹھیں وزن سے خریدنا", es: "Comprar fardos de ropa y juguetes usados por peso.", fr: "Achat de ballots de vêtements et de jouets usagés au poids", tr: "Ağırlıkla kıyafet ve oyuncak balyaları satın almak", id: "Membeli bal pakaian dan mainan berdasarkan berat badan" }
summary:
  ar: "سؤال عن شراء البالات من الثياب والألعاب بالوزن، أجابت فيه دائرة الإفتاء العام الأردنية بأنه لا مانع من شراء البالات المغلقة بالوزن بعد رؤية عينة منها إذا جرى بذلك العرف وانتفت الجهالة المؤدية إلى النزاع والمخاطرة. أجابت الدائرة بأنه لا حرج في شراء البضائع التي يشق عدها أو يتعذر لكثرتها مغلفة بالوزن، وإن تبين تفاوت أفرادها بعد الفتح، تخفيفًا على الناس وجريًا على عاداتهم ما لم يؤد ذلك إلى شقاق أو نزاع، وقالت إن بعض الفقهاء قديمًا احتملوا بيع الثياب جزافًا إذا شق فتحها وعدها، إلا إذا أفضى ذلك إلى النزاع والغرر والمقامرة. واستشهدت بكلام لمحمد بن الحسن الشيباني في كتاب الحجة على أهل المدينة احتج فيه بجواز بيع عدل الثياب الذي يضره الفتح دون عد، قياسًا على بيع الجوز والبيض والخضار جزافًا، وقال إن بيع المجازفة من أجوز البيوع. وخلصت إلى أن شراء الثياب أو الألعاب فيما يعرف بالبالة لا مانع منه شرعًا عندما يجري به العرف وتنتفي الجهالة المؤدية إلى النزاع والمخاطرة."
  en: "A question about buying bales of used clothes and toys by weight, in which Jordan's General Iftaa Department answered that there is no objection to buying sealed bales by weight after seeing a sample, where custom has established it and there is no uncertainty that would lead to dispute or risk-taking. The Department answered that there is no objection to buying goods that are hard or impossible to count because of their number, packed and sold by weight, even if the individual items turn out to vary once opened, to ease people's trade and in keeping with their customs, so long as it does not cause discord or dispute; some earlier jurists accepted selling clothes in bulk without count when opening and counting them was burdensome, unless it led to dispute, excessive uncertainty or gambling. It quoted Muhammad ibn al-Hasan al-Shaybani in al-Hujja ala Ahl al-Madina, who argued that a bale of clothes that would be damaged by opening may be sold without counting, by analogy with selling walnuts, eggs and vegetables in bulk, and said that bulk sale is among the most clearly permissible sales. It concluded that buying clothes or toys in what is known as a bale is permitted when custom has established it and there is no uncertainty leading to dispute or risk."
  ur: "استعمال شدہ کپڑوں اور کھلونوں کی گانٹھیں وزن سے خریدنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ نمونہ دیکھنے کے بعد بند گانٹھیں وزن سے خریدنے میں کوئی رکاوٹ نہیں جب اس کا رواج ہو اور ایسی لاعلمی نہ ہو جو جھگڑے یا جوئے کی طرف لے جائے۔ ڈیپارٹمنٹ نے جواب دیا کہ ایسے سامان کو جس کی گنتی کثرت کی وجہ سے مشکل یا ناممکن ہو، بند حالت میں وزن سے خریدنے میں کوئی حرج نہیں، چاہے کھولنے کے بعد اشیا میں فرق نکلے، لوگوں کی سہولت اور ان کے رواج کے مطابق، جب تک اس سے جھگڑا یا اختلاف نہ ہو؛ قدیم فقہا میں سے بعض نے کپڑوں کو بغیر گنتی ڈھیر کی صورت بیچنا قبول کیا جب انہیں کھولنا اور گننا مشکل ہو، الا یہ کہ اس سے جھگڑا، غرر یا جوا پیدا ہو۔ اس نے الحجۃ علی اہل المدینہ میں محمد بن حسن شیبانی کا قول نقل کیا، جنہوں نے دلیل دی کہ کپڑوں کی وہ گانٹھ جسے کھولنے سے نقصان ہو بغیر گنے بیچی جا سکتی ہے، جیسے اخروٹ، انڈے اور سبزیاں ڈھیر کی صورت بیچے جاتے ہیں، اور کہا کہ ڈھیر کی بیع سب سے واضح جائز بیوع میں سے ہے۔ اس نے نتیجہ نکالا کہ جسے گانٹھ کہا جاتا ہے اس میں کپڑے یا کھلونے خریدنا شرعاً جائز ہے جب اس کا رواج ہو اور جھگڑے اور خطرے کی طرف لے جانے والی لاعلمی نہ ہو۔"
  es: "Una pregunta sobre la compra de fardos de ropa y juguetes usados por peso, en la que el Departamento General de Iftaa de Jordania respondió que no hay objeción a comprar fardos sellados por peso después de ver una muestra, cuando la costumbre lo ha establecido y no hay incertidumbre que pueda dar lugar a disputas o riesgos. El Departamento respondió que no hay objeción a comprar artículos que son difíciles o imposibles de contar debido a su cantidad, empaquetados y vendidos por peso, incluso si los artículos individuales resultan variar una vez abiertos, para facilitar el comercio y de acuerdo con sus costumbres, siempre que no cause discordia o disputa; algunos juristas anteriores aceptaron la venta de ropa a granel sin contar cuando abrirla y contarla era engorroso, a menos que diera lugar a disputas, incertidumbre excesiva o apuestas. Citó a Muhammad ibn al-Hasan al-Shaybani en al-Hujja ala Ahl al-Madina, quien argumentó que un fardo de ropa que se dañaría al abrirlo puede venderse sin contar, por analogía con la venta de nueces, huevos y verduras a granel, y dijo que la venta a granel es una de las ventas más claramente permisibles. Se concluyó que la compra de ropa o juguetes en lo que se conoce como fardo está permitida cuando la costumbre lo ha establecido y no existe incertidumbre que pueda dar lugar a disputas o riesgos."
  fr: "Concernant l'achat de ballots de vêtements et de jouets usagés au poids, le Département général de la jurisprudence jordanienne (Iftaa) a répondu qu'il n'y a pas d'objection à l'achat de ballots scellés au poids après examen d'un échantillon, lorsque la coutume l'établit et qu'il n'existe aucune incertitude susceptible d'entraîner un litige ou une prise de risque. Le Département a précisé qu'il n'y a pas d'objection à l'achat de marchandises difficiles, voire impossibles à compter en raison de leur nombre, emballées et vendues au poids, même si le contenu de chaque article varie une fois ouvert, afin de faciliter les échanges commerciaux et conformément aux coutumes, pourvu que cela ne provoque ni discorde ni litige. Certains juristes anciens ont admis la vente de vêtements en vrac sans comptage lorsque l'ouverture et le comptage étaient fastidieux, sauf si cela engendrait des litiges, une incertitude excessive ou des spéculations. Le Département a cité Muhammad ibn al-Hasan al-Shaybani dans son ouvrage « al-Hujja ala Ahl al-Madina », qui soutenait qu'un ballot de vêtements susceptible d'être endommagé à l'ouverture pouvait être vendu sans comptage, par analogie avec la vente en vrac de noix, d'œufs et de légumes, et affirmait que la vente en vrac figurait parmi les ventes les plus clairement permises. Elle a conclu que l'achat de vêtements ou de jouets en balles est autorisé lorsque la coutume l'a établi et qu'il n'existe aucune incertitude susceptible d'entraîner un litige ou un risque."
  tr: "Ağırlıkla kıyafet ve oyuncak balyalarının satın alınmasıyla ilgili bir soru vardı; Ürdün Genel Fetva Dairesi, örneğini gördükten sonra balyaların ağırlıkla kapanmasına itiraz olmadığını, ancak bu gelenek uygulanır ve anlaşmazlık ile riske yol açan cehaletin ortadan kaldırılması koşuluyla yapılır. Daire, bolluğu nedeniyle sayılması zor veya imkansız olan malları, fetihten sonra üyelerindeki farklılıklar bulunsa bile, ağırlıkla sarılmış olarak satın almanın zarar vermediğini, bunun insanların üzerindeki yükü hafifletmek ve geleneklerini takip etmek için kullanmanın zarar vermediğini yanıtladı; aksi takdirde bu anlaşmazlık veya anlaşmazlığa yol açıyorsa. Bazı hukukçuların, geçmişte kıyafetlerin ağırlıkla açılıp geri getirildiği takdirde rastgele satışa hoşgörü gösterdiklerini, ancak bunun anlaşmazlık, belirsizlik ve kumara yol açtığını belirtti. Muhammed bin el-Hasan el-Şeybani'nin Al-Hujjah 'ala Ahl al-Madinah adlı kitabındaki sözlerini aktardı; burada Muhammed ibn el-Hasan el-Şeybani'nin sözlerini aktardı; burada kıyafetlerin saymadan fetih eşdeğeri olarak satılmasının, ceviz, yumurta ve sebzeleri keyfi olarak satmakla karşılaştırıldığında izin verildiğini savundu ve riskli satışların da izinli satışlar arasında olduğunu belirtti. Sonuç olarak, geleneksel uygulama ve anlaşmazlık ile riske yol açan cehalet ortadan kalktığında, 'bala'da kıyafet veya oyuncak satın almanın İslam hukuku tarafından yasaklanmadığını sonucuna vardı."
  id: "Sebuah pertanyaan tentang membeli bal pakaian dan mainan berdasarkan berat, di mana Departemen Fatwa Jenderal Yordania menjawab bahwa tidak ada keberatan membeli bal yang ditutup berdasarkan berat setelah melihat sampelnya, asalkan kebiasaan ini diikuti dan ketidaktahuan yang menyebabkan perselisihan dan risiko dihilangkan. Departemen menjawab bahwa tidak ada salahnya membeli barang yang sulit dihitung atau tidak mungkin dihitung karena kelimpahannya, dibungkus dengan berat, bahkan jika perbedaan anggotanya setelah penaklukan ditemukan, untuk meringankan beban orang dan mengikuti kebiasaan mereka, kecuali hal ini menimbulkan perselisihan atau perselisihan. Dikatakan bahwa beberapa ahli hukum di masa lalu mentolerir penjualan pakaian secara acak jika dibuka dan dikembalikan berdasarkan berat, kecuali hal itu menimbulkan perselisihan, ketidakpastian, dan perjudian. Ia mengutip kata-kata Muhammad ibn al-Hasan al-Shaybani dalam bukunya Al-Hujjah 'ala Ahl al-Madinah, di mana ia berargumen tentang diperbolehkannya menjual pakaian yang setara dengan penaklukan tanpa menghitung, dibandingkan dengan menjual kenari, telur, dan sayuran secara sewenang-wenang, serta mengatakan bahwa penjualan berisiko termasuk yang diperbolehkan. Ia menyimpulkan bahwa membeli pakaian atau mainan dalam apa yang dikenal sebagai 'bala' tidak dilarang oleh hukum Islam ketika praktik adat dan ketidaktahuan yang menyebabkan perselisihan dan risiko dihilangkan."
