summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: اعتماد الصياغة النهائية لمشروع معلمة القواعد الفقهية والمراحل المتفق على اقتراحها من لجنة المشروع وتكليف الأمانة العامة متابعة التنفيذ واختيار المناسب من الرأيين المطروحين للمرحلتين الأولى والخامسة."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on the fiqh-rules reference (ma'lamat al-qawa'id al-fiqhiyya) project: it adopted the project's final drafting and agreed stages and tasked the secretariat with implementation, choosing between the committee's two options for stages one and five."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: فقہی قواعد حوالہ منصوبے کی حتمی صورت اور مراحل منظور۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre el proyecto de referencia de las normas fiqh (ma'lamat al-qawa'id al-fiqhiyya): adoptó el borrador final del proyecto y las etapas acordadas, y encargó a la secretaría su implementación, eligiendo entre las dos opciones del comité para las etapas uno y cinco."
