label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن مشروع معلمة القواعد الفقهية", en: "IIFA resolution on the fiqh-rules reference project", ur: "اکیڈمی کی قرارداد: فقہی قواعد حوالہ منصوبہ", es: "Resolución de la IIFA sobre el proyecto de referencia de normas fiqh", fr: "Résolution de l'IIFA sur le projet de référence des règles de fiqh", tr: "Uluslararası İslami Fiqh Akademisi'nin Fıkıh Öğretmeni taslağı hakkında kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai rancangan Guru Aturan Yurisprudensi" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الرابعة ⁦(جدة، فبراير 1988م)⁩: اعتماد الصياغة النهائية لمشروع معلمة القواعد الفقهية والمراحل المتفق على اقتراحها من لجنة المشروع وتكليف الأمانة العامة متابعة التنفيذ واختيار المناسب من الرأيين المطروحين للمرحلتين الأولى والخامسة."
  en: "IIFA's fourth-session resolution (Jeddah, February 1988) on the fiqh-rules reference (ma'lamat al-qawa'id al-fiqhiyya) project: it adopted the project's final drafting and agreed stages and tasked the secretariat with implementation, choosing between the committee's two options for stages one and five."
  ur: "اکیڈمی کی چوتھی مجلس کی قرارداد ⁦(جدہ، فروری 1988ء)⁩: فقہی قواعد حوالہ منصوبے کی حتمی صورت اور مراحل منظور۔"
  es: "Resolución de la cuarta sesión de la IIFA (Yeda, febrero de 1988) sobre el proyecto de referencia de las normas fiqh (ma'lamat al-qawa'id al-fiqhiyya): adoptó el borrador final del proyecto y las etapas acordadas, y encargó a la secretaría su implementación, eligiendo entre las dos opciones del comité para las etapas uno y cinco."
  fr: "Résolution de la quatrième session de l'IIFA (Djeddah, février 1988) sur le projet de référence des règles de fiqh (ma'lamat al-qawa'id al-fiqhiyya): elle a adopté la version finale du projet et convenu des étapes et a chargé le secrétariat de sa mise en œuvre, en choisissant entre les deux options du comité pour les étapes un et cinq."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin dördüncü oturumunda (Cidde, Şubat 1988) kararı: Fıkıh Kuralları Endeksi taslak projesinin nihai metninin ve proje komitesi tarafından önerilen aşamaların onaylanması ve Genel Sekreterliğin uygulamayı takip etmek ve birinci ve beşinci aşamalar için sunulan iki görüş arasından uygun olanı seçmek üzere görevlendirilmesi."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi keempatnya (Jeddah, Februari 1988): Persetujuan redaksi akhir rancangan proyek Indeks Aturan Yurisprudensi dan tahapan yang disepakati yang diusulkan oleh komite proyek, serta penugasan Sekretariat Jenderal untuk menindaklanjuti pelaksanaan dan memilih yang sesuai dari dua pendapat yang disampaikan untuk fase pertama dan kelima."
