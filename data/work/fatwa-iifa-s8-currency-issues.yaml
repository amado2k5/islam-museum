label: { ar: "قرار مجمع الفقه الإسلامي الدولي بشأن قضايا العملة", en: "IIFA resolution on currency issues", ur: "اکیڈمی کی قرارداد: کرنسی کے مسائل", es: "Resolución de la IIFA sobre cuestiones cambiarias", fr: "Résolution de l'IIFA sur les questions monétaires", tr: "Uluslararası İslami Fiqh Akademisi'nin döviz ihraçlarına ilişkin kararı", id: "Keputusan Akademi Fiqh Islam Internasional mengenai isu mata uang" }
summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: يجوز أن تتضمن أنظمة العمل وعقوده التي تتحدد فيها الأجور بالنقود شرط الربط القياسي للأجور على ألا ينشأ عنه ضرر للاقتصاد العام، أي تعديل الأجور دوريًّا تبعًا للتغير في مستوى الأسعار، وبيّن بقية قضايا العملة على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on currency issues: employment systems and contracts stipulating wages in money may include an index-linking clause — periodic wage adjustment tracking the price level — provided it does not harm the general economy; the remaining currency questions are treated as detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: اجرتوں کو قیمتوں کی سطح سے جوڑنے کی اجازت بشرط عام معیشت کو نقصان نہ ہو؛ باقی کرنسی مسائل بیان ہوئے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre cuestiones monetarias: los sistemas de empleo y los contratos que estipulan salarios en dinero pueden incluir una cláusula de indexación —ajuste salarial periódico que siga el nivel de precios— siempre que no perjudique a la economía general; las demás cuestiones monetarias se tratan como detalladas."
  fr: "Résolution de la huitième session de l'IIFA (Brunei, juin 1993) sur les questions monétaires: les systèmes d'emploi et les contrats stipulant les salaires en monnaie peuvent inclure une clause d'indexation — ajustement périodique des salaires suivant le niveau des prix — à condition qu'elle ne nuise pas à l'économie générale; les autres questions monétaires sont traitées en détail."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin sekizinci oturumunda (Brunei, Haziran 1993) karar vermiştir: Ücretlerin nakit olarak belirlendiği iş düzenlemeleri ve sözleşmeler, genel ekonomiye zarar vermeden standart ücret bağlantısı koşulunu içerebilir; yani fiyat seviyelerindeki değişikliklere göre periyodik ücret ayarlamaları ve detaylandırılan diğer döviz ihraçları."
  id: "Keputusan Akademi Fiqh Islam Internasional pada sesi kedelapan (Brunei, Juni 1993): Peraturan dan kontrak ketenagakerjaan di mana upah ditentukan secara tunai dapat mencakup syarat penghubungan upah standar tanpa merugikan ekonomi umum, yaitu penyesuaian berkala upah sesuai perubahan tingkat harga, dan penerbitan mata uang lainnya seperti yang dijelaskan."
