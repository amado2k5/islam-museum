summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الثامنة ⁦(بروناي، يونيو 1993م)⁩: يجوز أن تتضمن أنظمة العمل وعقوده التي تتحدد فيها الأجور بالنقود شرط الربط القياسي للأجور على ألا ينشأ عنه ضرر للاقتصاد العام، أي تعديل الأجور دوريًّا تبعًا للتغير في مستوى الأسعار، وبيّن بقية قضايا العملة على ما فصّل."
  en: "IIFA's eighth-session resolution (Brunei, June 1993) on currency issues: employment systems and contracts stipulating wages in money may include an index-linking clause — periodic wage adjustment tracking the price level — provided it does not harm the general economy; the remaining currency questions are treated as detailed."
  ur: "اکیڈمی کی آٹھویں مجلس کی قرارداد ⁦(برونائی، جون 1993ء)⁩: اجرتوں کو قیمتوں کی سطح سے جوڑنے کی اجازت بشرط عام معیشت کو نقصان نہ ہو؛ باقی کرنسی مسائل بیان ہوئے۔"
  es: "Resolución de la octava sesión de la IIFA (Brunéi, junio de 1993) sobre cuestiones monetarias: los sistemas de empleo y los contratos que estipulan salarios en dinero pueden incluir una cláusula de indexación —ajuste salarial periódico que siga el nivel de precios— siempre que no perjudique a la economía general; las demás cuestiones monetarias se tratan como detalladas."
