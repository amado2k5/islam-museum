summary:
  ar: "السيرة الرسمية لشاه جهان بالفارسية، كتبها عبد الحميد اللاهوري معتمدًا على «پادشاهنامه» محمد أمين القزويني (أُمر بها 1634م وتمت 1646م)، وهي مقصورة على أحداث حياته أميرًا وإمبراطورًا {cite:beach-grand-mogul-1978 p. 76}."
  en: "The official Persian biography of Shah Jahan by Abd al-Hamid Lahori, built on the Padshah-nama of Muhammad Amin Qazwini (commissioned 1634, finished 1646), limited to the events of his life as prince and emperor {cite:beach-grand-mogul-1978 p. 76}."
