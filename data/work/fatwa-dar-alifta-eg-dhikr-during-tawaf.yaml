label: { ar: "حكم الذكر عند الطواف بالبيت بالأذكار المأثورة وغير المأثورة", en: "Invocations in tawaf — transmitted and otherwise", ur: "طواف میں مأثور اور غیر مأثور اذکار", es: "Invocaciones en el tawaf — transmitidas y de otra forma", fr: "Invocations pendant le tawaf — transmises et autrement", tr: "Meclisin Tavafı sırasında anma kararı, hem iletilen hem de iletilmeyen anmalarla", id: "Putusan tentang peringatan selama Tawaf Dewan dengan peringatan yang ditransmisikan maupun yang tidak ditransmisikan" }
summary:
  ar: "سائل سأل عن الذكر عند الطواف بالبيت بالأذكار المأثورة وغير المأثورة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21715)⁩ أن الدعاء وذكر الله عند الطواف أمر مستحب شرعًا وأحسنه ما ورد في السنة النبوية من الأدعية على ما فصّل الجواب."
  en: "A questioner asked about invocations during tawaf — transmitted ones and others. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21715) answered that supplication and remembrance of God during tawaf is commended in the sharia, the best being the supplications reported in the Prophetic sunna — as the answer details."
  ur: "ایک سائل نے طواف میں مأثور اور غیر مأثور اذکار کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21715)⁩ نے جواب دیا کہ طواف کے دوران دعا اور ذکر مستحب ہے اور بہترین وہ دعائیں ہیں جو سنت سے منقول ہیں — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de las invocaciones durante el tawaf, tanto las transmitidas como otras. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21715) respondió que la súplica y el recuerdo de Dios durante el tawaf son recomendables en la sharia, siendo las mejores las súplicas recogidas en la sunna profética, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant les invocations durant le tawaf, qu'elles soient transmises ou non. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21715) a répondu que la supplication et l'évocation de Dieu durant le tawaf sont recommandées par la charia, les meilleures étant les invocations rapportées dans la sunna prophétique, comme le précise la réponse."
  tr: "Bir soru soran kişi, evin etrafında hem iletilen hem de iletilmemiş dualarla yapılan anma hakkında bilgi aldı. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazir Muhammed Ayad, Fetva No. 21715), Tevaf sırasında Allah'ın anılması ve dua edilmesinin İslam hukukuna göre önerildiğini, en iyisinin ise cevabında ayrıntılı olarak Peygamber Sünnetinde belirtilen dualar olduğunu yanıtladı."
  id: "Seorang penanya menanyakan tentang peringatan selama perjalanan mengelilingi Rumah dengan doa yang dikirimkan maupun yang tidak dikirimkan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazir Muhammad Ayad, Fatwa No. 21715) menjawab bahwa doa dan peringatan kepada Allah selama Tawaf dianjurkan menurut hukum Islam, dan yang terbaik adalah doa yang disebutkan dalam Sunnah Nabi, seperti yang dijelaskan dalam jawabannya."
