summary:
  ar: "سائل سأل عن الذكر عند الطواف بالبيت بالأذكار المأثورة وغير المأثورة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21715)⁩ أن الدعاء وذكر الله عند الطواف أمر مستحب شرعًا وأحسنه ما ورد في السنة النبوية من الأدعية على ما فصّل الجواب."
  en: "A questioner asked about invocations during tawaf — transmitted ones and others. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21715) answered that supplication and remembrance of God during tawaf is commended in the sharia, the best being the supplications reported in the Prophetic sunna — as the answer details."
  ur: "ایک سائل نے طواف میں مأثور اور غیر مأثور اذکار کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21715)⁩ نے جواب دیا کہ طواف کے دوران دعا اور ذکر مستحب ہے اور بہترین وہ دعائیں ہیں جو سنت سے منقول ہیں — جیسا کہ جواب میں تفصیل ہے۔"
