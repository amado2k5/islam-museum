summary:
  ar: "كتاب لمصطفى محمود في عجائب الحياة، من الخلية والفيروس والنبات إلى النمل والنحل والمخ، يرى فيه أن المعجزة الحقيقية في «إحلال النظام» لا في خرقه، وأن نظرية داروين «أرجح الفروض» لا يقين علمي، وينتهي إلى أن دور الدين يبدأ حين يقول العلم كل ما عنده {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}."
  en: "A book by Mostafa Mahmoud on the wonders of life, from the cell, viruses and plants to ants, bees and the brain, holding that the true miracle lies in 'establishing order', not breaking it, that Darwin's theory is 'the most probable hypothesis', not scientific certainty, and ending with the claim that religion's role begins when science has said all it has {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}."
  ur: "زندگی کے عجائب پر مصطفیٰ محمود کی کتاب، خلیے، وائرس اور پودوں سے لے کر چیونٹیوں، شہد کی مکھیوں اور دماغ تک، جس میں وہ کہتے ہیں کہ اصل معجزہ نظام کو «قائم کرنے» میں ہے، توڑنے میں نہیں، ڈارون کا نظریہ سائنسی یقین نہیں بلکہ «سب سے راجح مفروضہ» ہے، اور آخر میں یہ کہ جب سائنس سب کچھ کہہ چکے تو دین کا کردار شروع ہوتا ہے {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}۔"
