label: { ar: "لغز الحياة", en: "Lughz al-Hayat", ur: "لغز الحیاۃ", es: "Lughz al-Hayat", fr: "Lughz al-Hayat", tr: "Hayatın Gizemi", id: "Misteri Kehidupan" }
summary:
  ar: "كتاب لمصطفى محمود في عجائب الحياة، من الخلية والفيروس والنبات إلى النمل والنحل والمخ، يرى فيه أن المعجزة الحقيقية في «إحلال النظام» لا في خرقه، وأن نظرية داروين «أرجح الفروض» لا يقين علمي، وينتهي إلى أن دور الدين يبدأ حين يقول العلم كل ما عنده {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}."
  en: "A book by Mostafa Mahmoud on the wonders of life, from the cell, viruses and plants to ants, bees and the brain, holding that the true miracle lies in 'establishing order', not breaking it, that Darwin's theory is 'the most probable hypothesis', not scientific certainty, and ending with the claim that religion's role begins when science has said all it has {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}."
  ur: "زندگی کے عجائب پر مصطفیٰ محمود کی کتاب، خلیے، وائرس اور پودوں سے لے کر چیونٹیوں، شہد کی مکھیوں اور دماغ تک، جس میں وہ کہتے ہیں کہ اصل معجزہ نظام کو «قائم کرنے» میں ہے، توڑنے میں نہیں، ڈارون کا نظریہ سائنسی یقین نہیں بلکہ «سب سے راجح مفروضہ» ہے، اور آخر میں یہ کہ جب سائنس سب کچھ کہہ چکے تو دین کا کردار شروع ہوتا ہے {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}۔"
  es: "Un libro de Mostafa Mahmoud sobre las maravillas de la vida, desde la célula, los virus y las plantas hasta las hormigas, las abejas y el cerebro, sosteniendo que el verdadero milagro reside en \"establecer el orden\", no en romperlo, que la teoría de Darwin es \"la hipótesis más probable\", no la certeza científica, y terminando con la afirmación de que el papel de la religión comienza cuando la ciencia ha dicho todo lo que tiene que decir {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}."
  fr: "Un livre de Mostafa Mahmoud sur les merveilles de la vie, de la cellule, des virus et des plantes aux fourmis, aux abeilles et au cerveau, soutenant que le véritable miracle réside dans « l'établissement de l'ordre », et non dans sa destruction, que la théorie de Darwin est « l'hypothèse la plus probable », et non une certitude scientifique, et se terminant par l'affirmation que le rôle de la religion commence lorsque la science a tout dit {cite:mm-lughz-al-hayat-awda-1986 p. 5} {cite:mm-lughz-al-hayat-awda-1986 p. 89} {cite:mm-lughz-al-hayat-awda-1986 p. 138}."
  tr: "Mustafa Mahmoud'un hücreden, virüsten bitkiye, karıncalara, arılara ve beyne kadar yaşamın harikaları üzerine yazdığı bir kitap; burada gerçek mucizenin \"düzeni bozmakta\" değil, \"düzeni kurmakta\" olduğunu ve Darwin'in \"en olası hipotez\" teorisinin bilimsel kesinlikten yoksun olduğunu belirtir. Dinin rolünün, bilimin sahip olduğu her şeyi söylediği zaman başladığını sonucuna varır {cite:mm-lughz-al-hayat-awda-1986 s. 5} {cite:mm-lughz-al-hayat-awda-1986 s. 89} {cite:mm-lughz-al-hayat-awda-1986 s. 138}."
  id: "Sebuah buku karya Mustafa Mahmoud tentang keajaiban kehidupan, mulai dari sel, virus, dan tumbuhan hingga semut, lebah, dan otak, di mana ia melihat mukjizat sejati dalam \"menetapkan keteraturan\" daripada merusaknya, dan bahwa teori Darwin tentang \"hipotesis yang paling mungkin\" tidak memiliki kepastian ilmiah. Ia menyimpulkan bahwa peran agama dimulai ketika ilmu pengetahuan mengatakan segala sesuatu yang dimilikinya {cite:mm-lughz-al-hayat-awda-1986 hlm. 5} {cite:mm-lughz-al-hayat-awda-1986 hlm. 89} {cite:mm-lughz-al-hayat-awda-1986 hlm. 138}."
