label: { ar: "معنى لا إله إلا الله", en: "The meaning of la ilaha illa Allah — the three tawhids", ur: "لا الٰہ الا اللہ کا مطلب — توحید کی اقسام" }
summary:
  ar: "سأل سائل هل معنى لا إله إلا الله محمد رسول الله هو توحيد الألوهية والربوبية والأسماء والصفات ومتابعة الرسول. أجابت القسم الشرعي بالموقع ⁦(فتوى رقم 21721 بتاريخ 5 فبراير 2008)⁩ أن شهادة التوحيد تعني ما ذكر فلا إله إلا الله أي لا معبود بحق إلا الله وهذا التوحيد يشمل الأنواع الثلاثة الربوبية والألوهية والأسماء والصفات، فتوحيد الربوبية هو المدخل لتوحيد الألوهية وهو من لوازمه ومقتضياته فمن يؤمن بتفرد الله بالخلق والملك والرزق والتدبير يلزمه أن يتوجه إليه في عبادته ودعائه وحده."
  en: "A questioner asked whether the testimony 'no god but God, Muhammad His messenger' means the tawhids of divinity, lordship, and names-and-attributes, plus following the Messenger. The site's sharia department (fatwa no. 21721, 5 February 2008) answered that the testimony means just that — 'no god but God' being no rightly worshipped but God, the tawhid covering the three kinds: lordship's tawhid is the gateway and entailment of divinity's, for whoever believes God alone creates, owns, provides and manages must turn to Him alone in worship and prayer."
  ur: "ایک سائل نے کلمہ توحید کے مفہوم پوچھا۔ شریعت شعبے ⁦(فتویٰ 21721، 5 فروری 2008)⁩ کے مطابق اس میں توحید ربوبیت الوہیت اور اسماء و صفات سب شامل ہیں — ربوبیت کا اقرار الوہیت کی عبادت کا لازم ہے۔"
