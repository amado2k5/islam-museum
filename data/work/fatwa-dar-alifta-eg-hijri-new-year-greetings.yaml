label: { ar: "حكم التهنئة ببداية العام الهجري الجديد", en: "Congratulating on the new Hijri year", ur: "نئے ہجری سال کی مبارکباد کا حکم", es: "¡Felicitaciones por el nuevo año Hijri!", fr: "Bonne année de l'Hégire !", tr: "Yeni Hicri yılının başlangıcında tebrik kararı", id: "Putusan tentang ucapan selamat di awal tahun Hijri yang baru" }
summary:
  ar: "سائل سأل عن التهنئة ببداية العام الهجري الجديد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21989)⁩ أن التهنئة به مستحبة شرعًا لما فيها من التذكير بالهجرة واستحضار ما فيها من دروس وعبر، على ما فصّل الجواب."
  en: "A questioner asked about congratulating on the beginning of the new Hijri year. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21989) answered that congratulation is recommended — it recalls the Hijra and brings to mind its lessons, as the answer details."
  ur: "ایک سائل نے نئے ہجری سال کی مبارکباد کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21989)⁩ نے جواب دیا کہ مبارکباد دینا مستحب ہے کیونکہ اس میں ہجرت کی یاد اور اس کے اسباق کی یاد آتی ہے، جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un interlocutor preguntó sobre la conveniencia de felicitar a la gente por el inicio del nuevo año Hijri. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.º 21989) respondió que se recomienda felicitar a la gente, ya que esto recuerda la Hégira y evoca sus enseñanzas, como se detalla en la respuesta."
  fr: "Une personne a posé une question concernant les félicitations à l'occasion du début de la nouvelle année hégirienne. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21989) a répondu que les félicitations sont recommandées: elles rappellent l'Hégire et ses enseignements, comme le précise la réponse."
  tr: "Bir soru soran kişi yeni Hicri yılının başlangıcını tebrik etmek hakkında soru sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 21989), tebrik etmenin İslam hukuku tarafından tavsiye edildiğini, çünkü göçü hatırlattığını ve ona dersler ve içgörüler getirdiğini yanıtladı; bu da yanıtta detaylandırılmıştır."
  id: "Seorang penanya bertanya tentang mengucapkan selamat atas awal tahun Hijriyah yang baru. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 21989) menjawab bahwa mengucapkan selamat atas hal ini dianjurkan oleh hukum Islam karena mengingatkan kita akan migrasi dan membawa pelajaran serta wawasan seperti yang dijelaskan dalam jawabannya."
