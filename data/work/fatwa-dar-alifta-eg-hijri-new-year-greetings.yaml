summary:
  ar: "سائل سأل عن التهنئة ببداية العام الهجري الجديد. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21989)⁩ أن التهنئة به مستحبة شرعًا لما فيها من التذكير بالهجرة واستحضار ما فيها من دروس وعبر، على ما فصّل الجواب."
  en: "A questioner asked about congratulating on the beginning of the new Hijri year. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21989) answered that congratulation is recommended — it recalls the Hijra and brings to mind its lessons, as the answer details."
  ur: "ایک سائل نے نئے ہجری سال کی مبارکباد کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21989)⁩ نے جواب دیا کہ مبارکباد دینا مستحب ہے کیونکہ اس میں ہجرت کی یاد اور اس کے اسباق کی یاد آتی ہے، جیسا کہ جواب میں تفصیل ہے۔"
