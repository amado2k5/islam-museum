label: { ar: "إعلان رمضان وشوال 1446هـ / 2025م", en: "Announcement for Ramadan–Shawwal 1446 / 2025", ur: "رمضان اور شوال 1446ھ / 2025ء کا اعلان", es: "Anuncio de Ramadán-Shawwal 1446 /", fr: "Annonce pour le Ramadan-Shawwal 1446 /", tr: "Ramazan ve Şevval 1446 Hicri / 2025 M.S. Duyurusu", id: "Ramadan dan Shawwal 1446 AH / Pengumuman 2025 M" }
summary:
  ar: "أعلن المجلس الفقهي لأمريكا الشمالية ⁦(يناير 2025)⁩ عن بداية شهري رمضان وشوال 1446هـ معتمدًا الحساب الفلكي كطريقة شرعية مقبولة وفق معايير المجلس الأوروبي للإفتاء والبحوث ⁦(استطالة لا تقل عن 8 درجات والقمر فوق الأفق 5 درجات عند الغروب)⁩."
  en: "The Fiqh Council of North America's announcement (January 2025) of the start of Ramadan and Shawwal 1446, adopting astronomical calculation as an accepted sharia method under the European Council of Fatwa and Research criteria (elongation at least 8 degrees and the moon at least 5 degrees above the horizon at sunset)."
  ur: "فقہ کونسل آف نارتھ امریکہ کا اعلان ⁦(جنوری 2025)⁩ رمضان اور شوال 1446ھ کے آغاز کا، جس میں فلکی حساب کو معتبر شرعی طریقہ مانا گیا برائے معیارات یورپی کونسل برائے افتا و تحقیق ⁦(غروب پر 8 درجے فاصلہ اور چاند 5 درجے بلند)⁩۔"
  es: "El anuncio del Consejo de Fiqh de América del Norte (enero de 2025) del inicio del Ramadán y Shawwal 1446, adoptando el cálculo astronómico como un método sharia aceptado según los criterios del Consejo Europeo de Fatwas e Investigación (elongación de al menos 8 grados y la luna al menos 5 grados sobre el horizonte al atardecer)."
  fr: "L'annonce du Conseil Fiqh d'Amérique du Nord (janvier 2025) du début du Ramadan et de Shawwal 1446, adoptant le calcul astronomique comme méthode de charia acceptée selon les critères du Conseil européen de la fatwa et de la recherche (élongation d'au moins 8 degrés et la lune à au moins 5 degrés au-dessus de l'horizon au coucher du soleil)."
  tr: "Kuzey Amerika Fiqh Konseyi (Ocak 2025), Ramazan ve Şevval aylarının başlangıcını 1446 Hicri ilan etti ve astronomik hesaplamayı Avrupa Fetva ve Araştırma Konseyi standartlarına göre kabul edilen İslami yöntem olarak benimsedi (gün batımında en az 8 derece uzama, ayın ufkun üzerinde 5 derece)."
  id: "Dewan Fiqh Amerika Utara (Januari 2025) mengumumkan awal bulan-bulan Ramadan dan Shawwal 1446 H, mengadopsi perhitungan astronomi sebagai metode Islam yang diterima sesuai standar Dewan Fatwa dan Riset Eropa (perpanjangan tidak kurang dari 8 derajat, dan bulan di atas cakrawala 5 derajat saat matahari terbenam)."
