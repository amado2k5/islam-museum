summary:
  ar: "سائل سأل عن سبب استحقاق أولاد البنت وصية واجبة في مسألة ميراث. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22579)⁩ بعد مطالعة أرشيفها الإفتائي ببيان الحكمة التشريعية والأساس القانوني للوصية الواجبة لأولاد البنت المتوفاة قبل والدها كما فصّل الجواب."
  en: "A questioner asked why a daughter's children are entitled to the obligatory bequest in an inheritance case. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22579) — consulting its own fatwa archive — explained the legislative wisdom and legal basis of the mandatory bequest owed to the children of a daughter who died before her father, as the answer details."
  ur: "ایک سائل نے میراث کے مسئلے میں بیٹی کی اولاد کے واجب وصیت کے مستحق ہونے کی وجہ پوچھی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22579)⁩ نے اپنے فتاویٰ آرکائیو کے مطالعے کے بعد جواب دیا، اس واجب وصیت کی شرعی حکمت اور قانونی اساس بیان کی جو باپ سے پہلے مرنے والی بیٹی کی اولاد کو دی جاتی ہے، جیسا کہ جواب میں تفصیل ہے۔"
