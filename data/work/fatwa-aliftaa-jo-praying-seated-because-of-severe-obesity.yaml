id: work/fatwa-aliftaa-jo-praying-seated-because-of-severe-obesity
class: work
kind: fatwa
label: { ar: "الصلاة جالسًا بسبب السمنة المفرطة", en: "Praying seated because of severe obesity", ur: "شدید موٹاپے کی وجہ سے بیٹھ کر نماز", es: "Orar sentado debido a la obesidad severa", fr: "Prier assis à cause d'une obésité sévère", tr: "Şiddetli obezite nedeniyle otururken dua etmek", id: "Berdoa sambil duduk karena obesitas berat" }
summary:
  ar: "سؤال عن الصلاة جالسًا بسبب السمنة المفرطة، أجابت فيه دائرة الإفتاء العام الأردنية بأن من تلحقه مشقة شديدة لا تحتمل أو يخاف ضررًا بسبب السمنة، أو يذهب القيام خشوعه، فلا حرج عليه أن يصلي على كرسي أو على الأرض، ويأتي بما قدر عليه من الأركان. أجابت الدائرة بأن القيام مع القدرة ركن من أركان الصلاة، وأن من تلحقه مشقة شديدة لا تحتمل، أو يخاف ضررًا على نفسه أو عضو منه بسبب السمنة، أو يذهب القيام خشوعه، فلا حرج عليه في الصلاة على الكرسي أو على الأرض، ويومئ بالركوع والسجود ويجعل السجود أخفض من الركوع. وقالت إن من قدر في أي وقت على ركن منها وجب عليه الإتيان به كاملًا لأن الترك رخصة مقيدة بالعجز، واستدلت بحديث رواه البخاري معناه أن يأتي المأمور بما استطاع منه، وبقاعدة الفقهاء أن الميسور لا يسقط بالمعسور، وذكرت أن الجويني اختار في ضابط العجز أن تلحق المصلي مشقة تذهب خشوعه. وأضافت أن صلاة النفل تجوز جالسًا مع القدرة على القيام، أما الركوع والسجود فلا بد من الإتيان بهما لمن استطاع."
  en: "A question about praying seated because of severe obesity, in which Jordan's General Iftaa Department answered that someone who suffers severe, unbearable hardship or fears harm because of obesity, or loses humility (khushu') by standing, may pray on a chair or on the floor, while performing whatever pillars he is able to. The Department answered that standing, when one is able, is a pillar of prayer; someone who suffers severe, unbearable hardship, fears harm to himself or a limb because of obesity, or loses his humility in prayer by standing, may pray on a chair or on the floor, gesturing for bowing and prostration with the prostration lower than the bowing. It said that whoever is able at any point to perform one of these pillars must perform it fully, since leaving it is a concession limited to inability, citing a hadith narrated by al-Bukhari whose meaning is that one should do as much of a command as one can, and the jurists' maxim that what is possible is not dropped because of what is impossible; it noted that al-Juwayni chose as the criterion of inability a hardship that takes away the worshipper's humility. It added that voluntary prayer may be performed seated even by someone able to stand, but bowing and prostration must be performed by whoever is able to."
  ur: "شدید موٹاپے کی وجہ سے بیٹھ کر نماز کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جسے موٹاپے کی وجہ سے ناقابلِ برداشت شدید مشقت ہو یا نقصان کا خوف ہو، یا کھڑے ہونے سے خشوع جاتا رہے، وہ کرسی پر یا زمین پر نماز پڑھ سکتا ہے، اور جن ارکان کی قدرت ہو انہیں ادا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ قدرت ہو تو قیام نماز کا رکن ہے؛ جسے ناقابلِ برداشت شدید مشقت ہو، یا موٹاپے کی وجہ سے اپنی جان یا کسی عضو کو نقصان کا خوف ہو، یا کھڑے ہونے سے نماز کا خشوع جاتا رہے، وہ کرسی پر یا زمین پر نماز پڑھ سکتا ہے، اور رکوع و سجود اشارے سے کرے، سجدہ رکوع سے زیادہ جھکا ہوا ہو۔ اس نے کہا کہ جو کسی بھی وقت ان میں سے کسی رکن پر قادر ہو اس پر اسے مکمل ادا کرنا واجب ہے، کیونکہ اسے چھوڑنا عجز سے مقید رخصت ہے، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ حکم پر جتنا ہو سکے عمل کرو، اور فقہا کے قاعدے سے کہ آسان کام مشکل کی وجہ سے ساقط نہیں ہوتا؛ اور ذکر کیا کہ جوینی نے عجز کا ضابطہ یہ اختیار کیا کہ نمازی کو ایسی مشقت ہو جو اس کا خشوع ختم کر دے۔ اس نے مزید کہا کہ نفل نماز قیام کی قدرت کے باوجود بیٹھ کر پڑھی جا سکتی ہے، لیکن جو رکوع اور سجدہ کر سکتا ہو اس کے لیے انہیں ادا کرنا ضروری ہے۔"
  es: "Una pregunta sobre la oración sentado debido a la obesidad severa, en la que el Departamento General de Iftaa de Jordania respondió que alguien que sufre dificultades severas e insoportables o teme sufrir daño debido a la obesidad, o pierde la humildad (khushu') al estar de pie, puede orar en una silla o en el suelo, mientras realiza los pilares que pueda. El Departamento respondió que estar de pie, cuando uno puede, es un pilar de la oración; alguien que sufre dificultades severas e insoportables, teme sufrir daño a sí mismo o a una extremidad debido a la obesidad, o pierde su humildad en la oración al estar de pie, puede orar en una silla o en el suelo, haciendo gestos para la inclinación y la postración con la postración más baja que la inclinación. Dijo que quien sea capaz en cualquier momento de realizar uno de estos pilares debe realizarlo completamente, ya que dejarlo es una concesión limitada a la incapacidad, citando un hadiz narrado por al-Bukhari cuyo significado es que uno debe hacer tanto de un mandato como pueda, y la máxima de los juristas de que lo que es posible no se deja de hacer por lo que es imposible; Señaló que al-Juwayni eligió como criterio de incapacidad una dificultad que menoscaba la humildad del creyente. Añadió que la oración voluntaria puede realizarse sentado incluso por alguien que pueda estar de pie, pero la inclinación y la postración deben ser realizadas por quien pueda."
  fr: "Une question concernant la prière en position assise en raison d'une obésité sévère a été posée par le Département général de la Iftaa de Jordanie. Ce dernier a répondu que toute personne souffrant de souffrances graves et insupportables, craignant pour sa santé en raison de son obésité, ou perdant son humilité (khushu') en se tenant debout, peut prier sur une chaise ou au sol, en accomplissant les piliers de la prière (ou les actes de piété) dans la mesure de ses capacités. Le Département a précisé que la position debout, lorsque cela est possible, est un pilier de la prière. Une personne souffrant de souffrances graves et insupportables, craignant pour sa santé ou celle d'un membre en raison de son obésité, ou perdant son humilité en se tenant debout, peut prier sur une chaise ou au sol, en mimant l'inclinaison et la prosternation, cette dernière étant plus basse que l'inclinaison. Le Département a ajouté que quiconque est capable d'accomplir l'un de ces piliers doit le faire pleinement, car l'omettre est une concession limitée à l'incapacité. Il a cité un hadith rapporté par al-Bukhari, signifiant qu'il faut accomplir autant qu'on le peut d'un commandement, ainsi que la maxime des juristes selon laquelle ce qui est possible n'est pas abandonné à cause de ce qui est impossible. Il est à noter qu'al-Juwayni a choisi comme critère d'incapacité une épreuve qui altère l'humilité du fidèle. Il est ajouté que la prière surérogatoire peut être accomplie assis, même par une personne capable de se tenir debout, mais que l'inclinaison et la prosternation doivent être effectuées par quiconque en est capable."
  tr: "Ağır obezite nedeniyle oturarak namaz kılmakla ilgili bir soru, Ürdün Genel Fetva Dairesi, dayanılmaz bir zorluk yaşayan ya da obezite nedeniyle zarar gören, ya da alçakgönüllü konumunu kaybeden herkesin, sandalyede ya da yerde namaz kılıp yapabildiği herhangi bir sütunu yerine getirmesinin zararı olmadığını yanıtladı. Daire, yetenekle ayakta durmanın bir dua direği olduğunu ve dayanılmaz ağır zorluklara maruz kalan, obezite nedeniyle kendine veya uzvuna zarar vermekten korkan ya da alçakgönüllü konumunu yitiren herkesin, sandalyede ya da yerde namaz kılmak, eğilmek ve secdeyi eğilmekten daha düşük yapmak zarar vermez, bunu yaptığını söyledi. Bu sütunlardan birini herhangi bir zamanda yerine getirebilenin, çekimser kalmanın yetersizlikle sınırlı bir taviz olduğunu söyledi. El-Buhari'nin anlattığı bir hadisle, emredilen kişinin elinden geleni yapması gerektiğini ve fıkhih ilkesine göre refahın engellilere düşmediğini belirtti. El-Cüveyni'nin, ehliyet kriterinde, namaz kılanın alçakgönüllülüğünü azaltan zorluklar çekmesini seçtiğini belirtti. Otururken gönüllü namazların izin olduğunu, eğilme ve secde ise ancak mümkünse yapılması gerektiğini ekledi."
  id: "Pertanyaan tentang berdoa sambil duduk karena obesitas berat, di mana Departemen Fatwa Umum Yordania menjawab bahwa siapa pun yang mengalami kesulitan berat yang tidak bisa ditanggung atau takut bahaya karena obesitas, atau yang status rendahnya hilang, tidak ada salahnya berdoa di kursi atau di tanah dan melakukan pilar apa pun yang mampu dilakukan. Departemen menjawab bahwa berdiri dengan kemampuan adalah pilar doa, dan bahwa siapa pun yang mengalami kesulitan berat yang tak tertahankan, takut melukai dirinya sendiri atau anggota tubuh karena obesitas, atau yang posisi rendah hatinya hilang, tidak ada salahnya berdoa di kursi atau di lantai, memberi isyarat untuk membungkuk dan bersujud, serta membungkuk lebih rendah daripada membungkuk. Ia mengatakan bahwa siapa pun yang mampu melaksanakan salah satu tiang ini kapan saja harus melakukannya sepenuhnya, karena abstain adalah konsesi yang dibatasi oleh ketidakmampuan. Ia mengutip hadits yang diceritakan oleh al-Bukhari yang berarti bahwa orang yang diperintahkan harus melakukan apa pun yang ia mampu, dan menurut prinsip para ahli hukum, orang yang berada tidak jatuh pada yang tidak mampu. Ia menyebutkan bahwa Al-Juwayni memilih, dalam kriteria ketidakmampuan, bahwa orang yang berdoa harus menanggung kesulitan yang mengurangi kerendahan hatinya. Ia menambahkan bahwa shalat sukarela diperbolehkan saat duduk, sementara membungkuk dan sujud hanya harus dilakukan jika memungkinkan."
