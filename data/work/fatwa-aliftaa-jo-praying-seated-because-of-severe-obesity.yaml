id: work/fatwa-aliftaa-jo-praying-seated-because-of-severe-obesity
class: work
kind: fatwa
label: { ar: "الصلاة جالسًا بسبب السمنة المفرطة", en: "Praying seated because of severe obesity", ur: "شدید موٹاپے کی وجہ سے بیٹھ کر نماز" }
summary:
  ar: "سؤال عن الصلاة جالسًا بسبب السمنة المفرطة، أجابت فيه دائرة الإفتاء العام الأردنية بأن من تلحقه مشقة شديدة لا تحتمل أو يخاف ضررًا بسبب السمنة، أو يذهب القيام خشوعه، فلا حرج عليه أن يصلي على كرسي أو على الأرض، ويأتي بما قدر عليه من الأركان. أجابت الدائرة بأن القيام مع القدرة ركن من أركان الصلاة، وأن من تلحقه مشقة شديدة لا تحتمل، أو يخاف ضررًا على نفسه أو عضو منه بسبب السمنة، أو يذهب القيام خشوعه، فلا حرج عليه في الصلاة على الكرسي أو على الأرض، ويومئ بالركوع والسجود ويجعل السجود أخفض من الركوع. وقالت إن من قدر في أي وقت على ركن منها وجب عليه الإتيان به كاملًا لأن الترك رخصة مقيدة بالعجز، واستدلت بحديث رواه البخاري معناه أن يأتي المأمور بما استطاع منه، وبقاعدة الفقهاء أن الميسور لا يسقط بالمعسور، وذكرت أن الجويني اختار في ضابط العجز أن تلحق المصلي مشقة تذهب خشوعه. وأضافت أن صلاة النفل تجوز جالسًا مع القدرة على القيام، أما الركوع والسجود فلا بد من الإتيان بهما لمن استطاع."
  en: "A question about praying seated because of severe obesity, in which Jordan's General Iftaa Department answered that someone who suffers severe, unbearable hardship or fears harm because of obesity, or loses humility (khushu') by standing, may pray on a chair or on the floor, while performing whatever pillars he is able to. The Department answered that standing, when one is able, is a pillar of prayer; someone who suffers severe, unbearable hardship, fears harm to himself or a limb because of obesity, or loses his humility in prayer by standing, may pray on a chair or on the floor, gesturing for bowing and prostration with the prostration lower than the bowing. It said that whoever is able at any point to perform one of these pillars must perform it fully, since leaving it is a concession limited to inability, citing a hadith narrated by al-Bukhari whose meaning is that one should do as much of a command as one can, and the jurists' maxim that what is possible is not dropped because of what is impossible; it noted that al-Juwayni chose as the criterion of inability a hardship that takes away the worshipper's humility. It added that voluntary prayer may be performed seated even by someone able to stand, but bowing and prostration must be performed by whoever is able to."
  ur: "شدید موٹاپے کی وجہ سے بیٹھ کر نماز کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ جسے موٹاپے کی وجہ سے ناقابلِ برداشت شدید مشقت ہو یا نقصان کا خوف ہو، یا کھڑے ہونے سے خشوع جاتا رہے، وہ کرسی پر یا زمین پر نماز پڑھ سکتا ہے، اور جن ارکان کی قدرت ہو انہیں ادا کرے۔ ڈیپارٹمنٹ نے جواب دیا کہ قدرت ہو تو قیام نماز کا رکن ہے؛ جسے ناقابلِ برداشت شدید مشقت ہو، یا موٹاپے کی وجہ سے اپنی جان یا کسی عضو کو نقصان کا خوف ہو، یا کھڑے ہونے سے نماز کا خشوع جاتا رہے، وہ کرسی پر یا زمین پر نماز پڑھ سکتا ہے، اور رکوع و سجود اشارے سے کرے، سجدہ رکوع سے زیادہ جھکا ہوا ہو۔ اس نے کہا کہ جو کسی بھی وقت ان میں سے کسی رکن پر قادر ہو اس پر اسے مکمل ادا کرنا واجب ہے، کیونکہ اسے چھوڑنا عجز سے مقید رخصت ہے، اور بخاری کی روایت کردہ حدیث سے استدلال کیا جس کا مفہوم ہے کہ حکم پر جتنا ہو سکے عمل کرو، اور فقہا کے قاعدے سے کہ آسان کام مشکل کی وجہ سے ساقط نہیں ہوتا؛ اور ذکر کیا کہ جوینی نے عجز کا ضابطہ یہ اختیار کیا کہ نمازی کو ایسی مشقت ہو جو اس کا خشوع ختم کر دے۔ اس نے مزید کہا کہ نفل نماز قیام کی قدرت کے باوجود بیٹھ کر پڑھی جا سکتی ہے، لیکن جو رکوع اور سجدہ کر سکتا ہو اس کے لیے انہیں ادا کرنا ضروری ہے۔"
