structure: "The question (p. 149); the definition of worship and its scope (pp. 149–150); worship as the aim of creation and the call of every messenger (pp. 150–151); what belongs to God alone and what to God and His Messenger (p. 154); the two senses of 'servant': the cosmic and the religious (pp. 154–155); the perfection of the creature lies in realising servanthood (p. 176); people's differing degrees in worship, faith and love, and servitude to wealth (pp. 180–198); freedom and servitude of the heart (p. 186); intimate friendship (khulla) and love as the realisation of servanthood (pp. 206–212); the three kinds of annihilation (fana') (pp. 218–225)."
