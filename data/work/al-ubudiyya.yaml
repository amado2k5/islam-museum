summary:
  ar: "جواب لابن تيمية ⁦(ت 728هـ)⁩ عن سؤال في آية البقرة 21 التي تأمر الناس بعبادة ربهم: ما العبادة وفروعها، وهل الدين كله داخل فيها، وما حقيقة العبودية، وهل هي أعلى المقامات؛ يحدّ فيه العبادة بأنها اسم جامع لكل ما يحبه الله ويرضاه، ويفرق بين العبودية الكونية العامة والعبودية الدينية الخاصة، ويرد على من زعم أن الخروج عن العبودية أكمل. وهو في المجلد العاشر من مجموع الفتاوى من ص 149."
  en: "Ibn Taymiyya's (d. 728 AH) answer to a question on al-Baqara 21, which commands people to worship their Lord: what worship and its branches are, whether the whole religion falls within it, what servanthood truly is and whether it is the highest station. He defines worship as a name gathering all that God loves and is pleased with, distinguishes the general cosmic servanthood from the particular religious one, and rejects the claim that leaving servanthood behind is more perfect. It is in volume 10 of Majmu' al-Fatawa from p. 149."
  es: "Respuesta de Ibn Taymiyya (m. 728 AH) a una pregunta sobre al-Baqara 21, que ordena a la gente adorar a su Señor: qué es la adoración y sus ramas, si toda la religión se engloba en ella, qué es realmente el servicio y si es la posición más elevada. Define la adoración como un nombre que reúne todo lo que Dios ama y le agrada, distingue el servicio cósmico general del servicio religioso particular y rechaza la afirmación de que abandonar el servicio conlleva una perfección mayor. Se encuentra en el volumen 10 de Majmu' al-Fatawa, página 149."
  fr: "La réponse d'Ibn Taymiyya (mort en 728 AH) à une question sur la sourate Al-Baqara 21, qui enjoint aux hommes d'adorer leur Seigneur: en quoi consiste l'adoration et quelles sont ses branches ? La religion tout entière en fait-elle partie ? Qu'est-ce que le service véritable et s'il représente le plus haut degré de perfection ? Il définit l'adoration comme l'invocation de tout ce que Dieu aime et dont il est satisfait, distingue le service cosmique général du service religieux particulier et réfute l'idée que renoncer au service soit plus parfait. Cette réponse se trouve dans le volume 10 de Majmu' al-Fatawa, à partir de la page 149."
  ur: "ابن تیمیہ کا ⁦(متوفی 728ھ)⁩ البقرہ 21 پر ایک سوال کا جواب، جو لوگوں کو اپنے رب کی عبادت کرنے کا حکم دیتا ہے: عبادت اور اس کی شاخیں کیا ہیں، کیا پورا دین اس میں آتا ہے، بندگی واقعی کیا ہے اور کیا یہ اعلیٰ ترین مقام ہے؟ وہ عبادت کی تعریف ایک ایسے نام کے طور پر کرتا ہے جس میں وہ سب کچھ جمع ہو جس سے خدا پسند کرتا ہے اور اس سے خوش ہوتا ہے، عام کائناتی بندگی کو خاص مذہبی سے ممتاز کرتا ہے، اور اس دعوے کو رد کرتا ہے کہ بندگی کو پیچھے چھوڑنا زیادہ کامل ہے۔ یہ مجمع الفتاوی کی جلد 10 میں ہے۔ 149."
