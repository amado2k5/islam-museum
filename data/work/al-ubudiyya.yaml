summary:
  ar: "جواب لابن تيمية ⁦(ت 728هـ)⁩ عن سؤال في آية البقرة 21 التي تأمر الناس بعبادة ربهم: ما العبادة وفروعها، وهل الدين كله داخل فيها، وما حقيقة العبودية، وهل هي أعلى المقامات؛ يحدّ فيه العبادة بأنها اسم جامع لكل ما يحبه الله ويرضاه، ويفرق بين العبودية الكونية العامة والعبودية الدينية الخاصة، ويرد على من زعم أن الخروج عن العبودية أكمل. وهو في المجلد العاشر من مجموع الفتاوى من ص 149."
  en: "Ibn Taymiyya's (d. 728 AH) answer to a question on al-Baqara 21, which commands people to worship their Lord: what worship and its branches are, whether the whole religion falls within it, what servanthood truly is and whether it is the highest station. He defines worship as a name gathering all that God loves and is pleased with, distinguishes the general cosmic servanthood from the particular religious one, and rejects the claim that leaving servanthood behind is more perfect. It is in volume 10 of Majmu' al-Fatawa from p. 149."
