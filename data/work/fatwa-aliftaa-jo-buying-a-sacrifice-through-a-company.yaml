id: work/fatwa-aliftaa-jo-buying-a-sacrifice-through-a-company
class: work
kind: fatwa
label: { ar: "شراء الأضحية أو العقيقة عن طريق الشركات", en: "Buying a sacrifice or aqiqa through a company", ur: "کمپنیوں کے ذریعے قربانی یا عقیقہ خریدنا" }
summary:
  ar: "سؤال عن شراء الأضحية أو العقيقة من شركات خاصة مع توكيلها بالذبح والتوزيع، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك جائز إن كانت الشركة تملك الحيوان عند العقد، وإلا وجب أن يصاغ العقد سلمًا بأوصاف محددة أو وعدًا ثم بيعًا عند التملك. أجابت الدائرة بأن العميل إذا دفع الثمن كاملًا عند العقد وكانت الأضحية مملوكة للشركة حينها فلا حرج، أما إن كانت الشركة لا تملكها فلا يجوز للنهي عن بيع ما لا يملك. وقالت إنه يمكن صياغة العقد سلمًا يتأجل فيه المبيع ويتعجل الثمن، فتبين الشركة في العقد نوع الحيوان وجنسه وسنه ولونه ووزنه وموقعه، ونقلت عن الخطيب الشربيني في مغني المحتاج اشتراط هذه الأوصاف في السلم في الأنعام. أو يتفق الطرفان على وعد مبدئي، فإذا ملكت الشركة الحيوان باعته للعميل، ثم يُعقد التوكيل بالذبح والتوزيع بعد تملك العميل له."
  en: "A question on buying a sacrifice or aqiqa from private companies and appointing them to slaughter and distribute it, in which Jordan's General Iftaa Department answered that this is permitted if the company owns the animal at the time of contract, and otherwise the contract must be drawn up as a forward sale (salam) with set specifications, or as a promise followed by a sale once the company owns it. The Department answered that if the customer pays the full price at contract and the company owns the animal at that time, there is no objection, but if the company does not own it, the sale is not allowed because of the prohibition on selling what one does not own. It said the contract may be drawn up as a salam, with delivery deferred and price paid in advance, the company specifying in the contract the animal's kind, sex, age, colour, weight and location; it quoted al-Khatib al-Shirbini's Mughni al-Muhtaj that these specifications are required in a salam for livestock. Alternatively the parties may agree on an initial promise, and once the company owns the animal it sells it to the customer; the agency to slaughter and distribute is then contracted on the basis of the customer's ownership."
  ur: "نجی کمپنیوں سے قربانی یا عقیقہ خریدنے اور انہیں ذبح اور تقسیم کا وکیل بنانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر عقد کے وقت کمپنی جانور کی مالک ہو تو جائز ہے، ورنہ عقد کو مقررہ اوصاف کے ساتھ سلم بنانا ہوگا، یا وعدہ کر کے کمپنی کے مالک بننے پر بیع کرنی ہوگی۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر گاہک عقد کے وقت پوری قیمت ادا کرے اور اس وقت جانور کمپنی کی ملکیت ہو تو حرج نہیں، لیکن اگر کمپنی مالک نہ ہو تو جو چیز ملکیت میں نہ ہو اسے بیچنے کی ممانعت کی وجہ سے جائز نہیں۔ اس نے کہا کہ عقد کو سلم کی صورت دی جا سکتی ہے جس میں مبیع مؤخر اور قیمت پیشگی ہو، اور کمپنی عقد میں جانور کی قسم، جنس، عمر، رنگ، وزن اور مقام متعین کرے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ مویشیوں میں سلم کے لیے یہ اوصاف شرط ہیں۔ یا فریقین ابتدائی وعدہ کریں، اور جب کمپنی جانور کی مالک بن جائے تو گاہک کو بیچ دے؛ پھر ذبح اور تقسیم کی وکالت گاہک کی ملکیت کی بنیاد پر طے ہو۔"
