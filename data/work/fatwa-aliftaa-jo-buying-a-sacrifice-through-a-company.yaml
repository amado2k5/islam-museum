id: work/fatwa-aliftaa-jo-buying-a-sacrifice-through-a-company
class: work
kind: fatwa
label: { ar: "شراء الأضحية أو العقيقة عن طريق الشركات", en: "Buying a sacrifice or aqiqa through a company", ur: "کمپنیوں کے ذریعے قربانی یا عقیقہ خریدنا", es: "Comprar un sacrificio o aqiqa a través de una empresa", fr: "L'achat d'un sacrifice ou d'une aqiqa par l'intermédiaire d'une entreprise" }
summary:
  ar: "سؤال عن شراء الأضحية أو العقيقة من شركات خاصة مع توكيلها بالذبح والتوزيع، أجابت فيه دائرة الإفتاء العام الأردنية بأن ذلك جائز إن كانت الشركة تملك الحيوان عند العقد، وإلا وجب أن يصاغ العقد سلمًا بأوصاف محددة أو وعدًا ثم بيعًا عند التملك. أجابت الدائرة بأن العميل إذا دفع الثمن كاملًا عند العقد وكانت الأضحية مملوكة للشركة حينها فلا حرج، أما إن كانت الشركة لا تملكها فلا يجوز للنهي عن بيع ما لا يملك. وقالت إنه يمكن صياغة العقد سلمًا يتأجل فيه المبيع ويتعجل الثمن، فتبين الشركة في العقد نوع الحيوان وجنسه وسنه ولونه ووزنه وموقعه، ونقلت عن الخطيب الشربيني في مغني المحتاج اشتراط هذه الأوصاف في السلم في الأنعام. أو يتفق الطرفان على وعد مبدئي، فإذا ملكت الشركة الحيوان باعته للعميل، ثم يُعقد التوكيل بالذبح والتوزيع بعد تملك العميل له."
  en: "A question on buying a sacrifice or aqiqa from private companies and appointing them to slaughter and distribute it, in which Jordan's General Iftaa Department answered that this is permitted if the company owns the animal at the time of contract, and otherwise the contract must be drawn up as a forward sale (salam) with set specifications, or as a promise followed by a sale once the company owns it. The Department answered that if the customer pays the full price at contract and the company owns the animal at that time, there is no objection, but if the company does not own it, the sale is not allowed because of the prohibition on selling what one does not own. It said the contract may be drawn up as a salam, with delivery deferred and price paid in advance, the company specifying in the contract the animal's kind, sex, age, colour, weight and location; it quoted al-Khatib al-Shirbini's Mughni al-Muhtaj that these specifications are required in a salam for livestock. Alternatively the parties may agree on an initial promise, and once the company owns the animal it sells it to the customer; the agency to slaughter and distribute is then contracted on the basis of the customer's ownership."
  ur: "نجی کمپنیوں سے قربانی یا عقیقہ خریدنے اور انہیں ذبح اور تقسیم کا وکیل بنانے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ اگر عقد کے وقت کمپنی جانور کی مالک ہو تو جائز ہے، ورنہ عقد کو مقررہ اوصاف کے ساتھ سلم بنانا ہوگا، یا وعدہ کر کے کمپنی کے مالک بننے پر بیع کرنی ہوگی۔ ڈیپارٹمنٹ نے جواب دیا کہ اگر گاہک عقد کے وقت پوری قیمت ادا کرے اور اس وقت جانور کمپنی کی ملکیت ہو تو حرج نہیں، لیکن اگر کمپنی مالک نہ ہو تو جو چیز ملکیت میں نہ ہو اسے بیچنے کی ممانعت کی وجہ سے جائز نہیں۔ اس نے کہا کہ عقد کو سلم کی صورت دی جا سکتی ہے جس میں مبیع مؤخر اور قیمت پیشگی ہو، اور کمپنی عقد میں جانور کی قسم، جنس، عمر، رنگ، وزن اور مقام متعین کرے؛ اس نے خطیب شربینی کی مغنی المحتاج سے نقل کیا کہ مویشیوں میں سلم کے لیے یہ اوصاف شرط ہیں۔ یا فریقین ابتدائی وعدہ کریں، اور جب کمپنی جانور کی مالک بن جائے تو گاہک کو بیچ دے؛ پھر ذبح اور تقسیم کی وکالت گاہک کی ملکیت کی بنیاد پر طے ہو۔"
  es: "Una pregunta sobre la compra de un sacrificio o aqiqa a empresas privadas y su designación para sacrificarlo y distribuirlo, a la que el Departamento General de Iftaa de Jordania respondió que esto está permitido si la empresa es propietaria del animal al momento del contrato, y de lo contrario el contrato debe redactarse como una venta anticipada (salam) con especificaciones establecidas, o como una promesa seguida de una venta una vez que la empresa sea propietaria. El Departamento respondió que si el cliente paga el precio total al momento del contrato y la empresa es propietaria del animal en ese momento, no hay objeción, pero si la empresa no es propietaria, la venta no está permitida debido a la prohibición de vender lo que no se posee. Dijo que el contrato puede redactarse como un salam, con entrega diferida y precio pagado por adelantado, la empresa especificando en el contrato la especie, sexo, edad, color, peso y ubicación del animal; citó el Mughni al-Muhtaj de al-Khatib al-Shirbini que estas especificaciones son requeridas en un salam para ganado. Alternativamente, las partes pueden acordar una promesa inicial, y una vez que la empresa sea propietaria del animal, lo vende al cliente; la agencia encargada del sacrificio y la distribución se contrata entonces sobre la base de la propiedad del cliente."
  fr: "Concernant l'achat d'un animal sacrificiel (aqiqa) auprès d'entreprises privées et leur désignation pour l'abattage et la distribution, le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que cela est permis si l'entreprise est propriétaire de l'animal au moment de la conclusion du contrat. Dans le cas contraire, le contrat doit être établi sous la forme d'une vente à terme (salam) avec des spécifications précises, ou sous la forme d'une promesse de vente différée. Le Département a précisé que si le client paie le prix total à la signature du contrat et que l'entreprise est alors propriétaire de l'animal, il n'y a pas d'objection. En revanche, si l'entreprise n'en est pas propriétaire, la vente est interdite en raison de l'interdiction de vendre ce que l'on ne possède pas. Il a indiqué que le contrat peut être établi sous la forme d'un salam, avec livraison différée et paiement anticipé, l'entreprise devant y préciser l'espèce, le sexe, l'âge, la couleur, le poids et le lieu de l'animal. Le Département a cité l'ouvrage « Mughni al-Muhtaj » d'al-Khatib al-Shirbini, selon lequel ces spécifications sont requises dans un salam pour le bétail. Autrement, les parties peuvent convenir d'une promesse initiale, et une fois que l'entreprise est propriétaire de l'animal, elle le vend au client; le contrat d'abattage et de distribution est alors établi sur la base de la propriété du client."
