id: work/fatwa-iifa-251-sex-change
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 251 (25/13) بشأن بيان حكم تغيير الجنس في الإسلام", en: "IIFA resolution 251 (25/13) clarifying the ruling on sex change in Islam", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 251 (25/13): اسلام میں تغییرِ جنس کے حکم کا بیان", es: "Resolución 251 (25/13) de la IIFA que aclara la normativa sobre el cambio de sexo en el Islam.", fr: "Résolution 251 (25/13) de l'IIFA clarifiant la position de l'islam sur le changement de sexe" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩. عرّف المجمع تغيير الجنس بأنه تحويل ذكر إلى أنثى أو تحويل أنثى إلى ذكر، وقرر تحريمه شرعًا لأنه تغيير لخلق الله، مستشهدًا بقوله تعالى ⁦«فليغيرن خلق الله»⁩ ⁦[النساء: 119]⁩ وحديث البخاري عن أنس في لعن المخنثين من الرجال والمترجلات من النساء. وقرر أن للزوجة طلب فسخ عقد النكاح للعيب إذا حوّل الزوج نفسه ظاهريًا إلى أنثى، وللزوج تطليق زوجته إذا حوّلت نفسها ظاهريًا إلى ذكر؛ وأن الأحكام الشرعية المتعلقة بالذكر والأنثى من واجبات وحقوق دينية ومدنية تظل ثابتة كما كانت قبل التحويل الظاهري، وبخاصة أحكام الحضانة والنفقة والميراث، لأن التحويل تغيير ظاهري لا حقيقي كما قرره الأطباء فلا أثر له على ما ثبت من أحكام. وأوصى بدعوة الحكومات إلى منع هذه العمليات والتوعية بمخاطرها وتوجيه من لديهم اضطرابات أو وساوس في الهوية الجنسية لأسباب نفسية إلى العلاج، والتوعية بخطورة الدعوات المروجة لها، واللجوء إلى ما أباحه الشرع من أسباب التداوي."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023). It defined sex change as converting a male into a female or a female into a male, and ruled it forbidden in the sharia as altering God's creation, citing the verse 'and they shall alter the creation of God' [al-Nisa': 119] and the hadith reported by al-Bukhari from Anas on the effeminate among men and the masculine among women. It ruled that a wife may seek annulment of the marriage for defect if her husband outwardly turns himself into a female, and a husband may divorce a wife who outwardly turns herself into a male; and that the sharia rulings attached to male and female — religious and civil duties and rights — remain as they were before the outward conversion, especially custody, maintenance and inheritance, because the change is outward not real, as the physicians determined, and so has no effect on established rulings. It recommended that governments prevent such operations and raise awareness of their dangers, that persons with psychological disturbances or obsessions about gender identity be directed to treatment, awareness of campaigns promoting them, and recourse to the lawful means of healing the sharia has commended."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں۔ اکیڈمی نے تغییرِ جنس کی تعریف مرد کو عورت اور عورت کو مرد بنانے کے طور پر کی اور اسے شریعت میں حرام قرار دیا کیونکہ یہ خلقتِ الٰہی کی تبدیلی ہے، آیت ⁦«فليغيرن خلق الله»⁩ ⁦[النساء: 119]⁩ اور بخاری کی انس سے مروی حدیث ⁦(مردوں کے مخنث اور عورتوں کے مترجل ہونے پر لعنت)⁩ کی روشنی میں۔ اس نے فیصلہ کیا کہ اگر شوہر خود کو ظاہراً عورت بنالے تو بیوی عیب کی بنا پر فسخِ نکاح چاہ سکتی ہے، اور اگر بیوی خود کو ظاہراً مرد بنالے تو شوہر اسے طلاق دے سکتا ہے؛ اور مرد و عورت سے متعلق شرعی احکام — دینی و شہری واجبات و حقوق — ظاہری تبدیلی سے پہلے جیسے تھے ویسے ہی قائم رہتے ہیں، بالخصوص حضانت، نفقہ اور میراث، کیونکہ یہ تبدیلی حقیقی نہیں ظاہری ہے جیسا کہ اطباء نے قرار دیا، اس لیے قائم شدہ احکام پر اس کا اثر نہیں۔ سفارشات میں حکومتوں سے ایسی سرجریوں کی روک، ان کے خطرات کی آگہی، جنسی شناخت سے متعلق نفسیاتی اضطراب یا وسوسہ رکھنے والوں کو علاج کی طرف رجوع، ان کی ترویج کرنے والی مہمات کے خطرات کی آگہی، اور شریعت کے جائز وسائلِ علاج کی طرف رجوع شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 25.ª sesión en Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 de febrero de 2023). Definió el cambio de sexo como la conversión de un hombre en mujer o de una mujer en hombre, y dictaminó que está prohibido en la sharia por alterar la creación de Dios, citando el versículo «y alterarán la creación de Dios» [al-Nisa': 119] y el hadiz narrado por al-Bujari de Anas sobre lo afeminado entre los hombres y lo masculino entre las mujeres. Dictaminó que una esposa puede solicitar la anulación del matrimonio por defecto si su esposo se transforma externamente en mujer, y un esposo puede divorciarse de una esposa que se transforma externamente en hombre; y que las normas de la sharia relativas a hombres y mujeres —deberes y derechos religiosos y civiles— permanecen inalteradas respecto a la conversión externa, especialmente la custodia, la manutención y la herencia, dado que el cambio es externo, no real, como determinaron los médicos, y por lo tanto no afecta a las normas establecidas. Se recomendó que los gobiernos prevengan tales operaciones y conciencien sobre sus peligros, que las personas con trastornos psicológicos u obsesiones sobre la identidad de género reciban tratamiento, que se les informe sobre las campañas que las promueven y que recurran a los medios legales de curación que la sharia recomienda."
  fr: "Résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh) lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, 20-23 février 2023). Elle définit le changement de sexe comme la conversion d'un homme en femme ou d'une femme en homme, et le déclare interdit par la charia, car il altère la création divine. Elle cite le verset « Et ils altéreront la création divine » [An-Nisa': 119] et le hadith rapporté par al-Bukhari d'après Anas concernant l'efféminé chez les hommes et le masculin chez les femmes. Elle statue qu'une épouse peut demander l'annulation du mariage pour vice si son mari se transforme extérieurement en femme, et qu'un mari peut divorcer d'une épouse qui se transforme extérieurement en homme. Il est établi que les règles de la charia relatives aux hommes et aux femmes — devoirs et droits religieux et civils — demeurent inchangées par rapport à la conversion, notamment en ce qui concerne la garde, la pension alimentaire et l'héritage, car le changement est purement extérieur et non réel, comme l'ont déterminé les médecins, et n'a donc aucune incidence sur les règles établies. Il est recommandé aux gouvernements de prévenir de telles opérations et de sensibiliser la population à leurs dangers, d'orienter les personnes souffrant de troubles psychologiques ou d'obsessions liées à l'identité de genre vers un traitement, de les informer des campagnes de sensibilisation et de les encourager à recourir aux moyens de guérison licites préconisés par la charia."
