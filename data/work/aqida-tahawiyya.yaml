summary:
  ar: "رسالة موجزة في عقيدة أهل السنة والجماعة ألّفها أبو جعفر الطحاوي، يبيّن فيها أنها عقيدة فقهاء الملة أبي حنيفة وأبي يوسف ومحمد بن الحسن، وفيها نحو مئة وأربعة وثلاثين بنداً تبدأ بالتوحيد وتنتهي بالتحذير من الفرق."
  en: "A short statement of the creed of Ahl al-Sunna wa'l-Jama'a by Abu Ja'far al-Tahawi, who presents it as the creed of the jurists of the community Abu Hanifa, Abu Yusuf and Muhammad ibn al-Hasan; about 134 articles from tawhid to a warning against sects."
