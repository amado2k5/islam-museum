structure: "A preamble naming the three jurists, articles on tawhid, the Qur'an, the vision of God, qadar, iman, the hereafter, the Companions and the caliphate, ending with a statement against several named schools (the Mushabbiha, Mu'tazila, Jahmiyya, Jabriyya, Qadariyya and others). The edition used numbers the articles 1 to 134."
