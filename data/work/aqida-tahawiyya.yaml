summary:
  ar: "رسالة موجزة في عقيدة أهل السنة والجماعة ألّفها أبو جعفر الطحاوي، يبيّن فيها أنها عقيدة فقهاء الملة أبي حنيفة وأبي يوسف ومحمد بن الحسن، وفيها نحو مئة وأربعة وثلاثين بنداً تبدأ بالتوحيد وتنتهي بالتحذير من الفرق."
  en: "A short statement of the creed of Ahl al-Sunna wa'l-Jama'a by Abu Ja'far al-Tahawi, who presents it as the creed of the jurists of the community Abu Hanifa, Abu Yusuf and Muhammad ibn al-Hasan; about 134 articles from tawhid to a warning against sects."
  es: "Una breve exposición del credo de Ahl al-Sunna wa'l-Jama'a por Abu Ja'far al-Tahawi, quien lo presenta como el credo de los juristas de la comunidad Abu Hanifa, Abu Yusuf y Muhammad ibn al-Hasan; unos 134 artículos que abarcan desde el tawhid hasta una advertencia contra las sectas."
  fr: "Un bref exposé du credo d'Ahl al-Sunna wa'l-Jama'a par Abu Ja'far al-Tahawi, qui le présente comme le credo des juristes de la communauté Abu Hanifa, Abu Yusuf et Muhammad ibn al-Hasan; environ 134 articles allant du tawhid à une mise en garde contre les sectes."
