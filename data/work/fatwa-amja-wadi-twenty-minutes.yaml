id: work/fatwa-amja-wadi-twenty-minutes
class: work
kind: fatwa
label: { ar: "الودي بعد البول", en: "Wadi twenty minutes after urinating — istinja and wudu, not washing", ur: "بعد پیشاب ودی — استنجاء و وضو", es: "Wadi veinte minutos después de orinar: istinja y wudu, sin lavarse.", fr: "Wadi vingt minutes après avoir uriné — istinja et wudu, sans se laver", tr: "Postüriner sempati", id: "Simpati posturinari" }
summary:
  ar: "سأل سائل هل من العادي أن ينزل سائل قد يكون وديًا بعد البول خلال عشرين دقيقة. أجاب د. صلاح الصاوي ⁦(فتوى رقم 77788 بتاريخ 11 فبراير 2009)⁩ أن الذي يوجب الغسل من هذه السوائل إنما هو المني وهو الماء الدافق الذي ينزل دفقًا بشهوة ويعرفه الناس جميعًا أما ما سوى ذلك من مذي أو ودي أو هدي فإنه لا يوجب إلا غسل ما أصابه والوضوء على ما فصّل الجواب."
  en: "A questioner asked whether a fluid — perhaps wadi — descending within twenty minutes of urinating is ordinary. Dr. Salah al-Sawi (fatwa no. 77788, 11 February 2009) answered that of these fluids only semen obliges the washing — the gushing water descending in a gush with desire, known to all people; whatever else, wadi or madhy or hadi, obliges only washing what it touched and wudu — as the answer details."
  ur: "پیشاب کے بعد ودی؟ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 77788، 11 فروری 2009)⁩ کے مطابق غسل صرف منی پر ہے؛ ودی مذی پر دھلائی اور وضو کافی۔"
  es: "Un consultante preguntó si un fluido —quizás un wadi— que desciende dentro de los veinte minutos posteriores a la micción es algo normal. El Dr. Salah al-Sawi (fatwa n.° 77788, 11 de febrero de 2009) respondió que de estos fluidos, solo el semen obliga a realizar el lavado —el agua que desciende a borbotones con deseo, algo conocido por todos—; cualquier otro fluido, wadi, madhy o hadi, solo obliga a lavar lo que tocó y a realizar la ablución (wudu), como se detalla en la respuesta."
  fr: "Un internaute a demandé si l'écoulement d'un liquide – peut-être du wadi – dans les vingt minutes suivant la miction était normal. Le Dr Salah al-Sawi (fatwa n° 77788, 11 février 2009) a répondu que, parmi ces liquides, seul le sperme exige la purification – l'eau jaillissant avec désir, phénomène bien connu; tout autre liquide, wadi, madhy ou hadi, n'exige que le lavage de ce qu'il a touché et les ablutions (wudu) – comme le précise la réponse."
  tr: "Bir soru soran kişi, dostça olabilecek bir sıvının idrardan sonra yirmi dakika içinde dışarı çıkmasının normal olup olmadığını sordu. Dr. Salah Al-Sawy (11 Şubat 2009 tarihli 77788 Fetva) yanıtladı: Bu sıvılardan ghusl alınması gerekenin sperm olduğunu, yani arzuyla akan ve herkesin bildiği suyu ifade eden bir sudur. Ön akış, sevgi veya fedakarlık sıvısı dışındaki her şey için de, sadece etkilenen şeyleri yıkamak ve cevabda detaylandırıldığı gibi abdest almak yeterlidir."
  id: "Seorang penanya bertanya apakah normal jika cairan yang mungkin ramah keluar setelah buang air kecil dalam waktu dua puluh menit. Dr. Salah Al-Sawy menjawab (Fatwa No. 77788 tanggal 11 Februari 2009) bahwa yang membutuhkan ghusl dari cairan ini adalah air mani, yaitu air yang mengalir dengan hasrat, yang diketahui semua orang. Untuk apa pun selain pre-flow, kasih sayang, atau cairan pengorbanan, hanya perlu mencuci apa yang telah memengaruhinya dan melakukan wudhu seperti yang dijelaskan dalam jawaban."
