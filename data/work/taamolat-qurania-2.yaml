id: work/taamolat-qurania-2
class: work
kind: lecture-series
label:
  ar: "تأملات قرآنية 2 (سلسلة دروس)"
  en: "Ta'ammulat Qur'aniyya 2: Qur'anic reflections (lesson series)"
  ur: "تأملات قرآنیہ 2: قرآنی غور و فکر (دروس کا سلسلہ)"
summary:
  ar: "سلسلة من ثلاث وعشرين حلقة ليوسف القرضاوي في أرشيف أسابيل، يشرح في كل منها آيات من سورة، من الفاتحة وآية الصيام وآية الكرسي وآيات المواريث إلى قصص الأنبياء وحديث الإفك وعباد الرحمن والفيء وجزء عمّ وسورة إبراهيم، ويقول في بعضها إنها دروس العشر الأواخر من رمضان في قطر."
  en: "A series of twenty-three episodes by Yusuf al-Qaradawi on the Assabile archive, each explaining verses of one sura, from al-Fatiha, the verse of fasting, the Throne Verse and the inheritance verses to the stories of the prophets, the slander affair, the servants of the Most Merciful, fay', juz' 'Amma and Surat Ibrahim; in some he says they are lessons of the last ten nights of Ramadan in Qatar."
  ur: "اسابیل آرکائیو میں یوسف قرضاوی کی تیئیس اقساط کا سلسلہ، جن میں سے ہر ایک میں وہ ایک سورت کی آیات کی شرح کرتے ہیں، فاتحہ، روزے کی آیت، آیت الکرسی اور میراث کی آیات سے انبیا کے قصوں، واقعۂ افک، عباد الرحمن، فے، جزء عمّ اور سورۃ ابراہیم تک؛ بعض میں وہ کہتے ہیں کہ یہ قطر میں رمضان کی آخری دس راتوں کے دروس ہیں۔"
