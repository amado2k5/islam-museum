summary:
  ar: "كتاب من رسول الله محمد لمخلاف خارف وأهل جناب الهضب وحقاف الرمل مع وافدها ذي المشعار مالك بن النمط ومن أسلم من قومه: أن لهم فراع أرضهم ووهاطها ما أقاموا الصلاة وآتوا الزكاة، يأكلون علافها ويرعون عافيها، لهم بذلك عهد الله وذمة رسوله، وشاهدهم المهاجرون والأنصار."
  en: "A letter from the Messenger of God Muhammad to the district of Kharif and the people of the highland slopes and the sand dunes, with their envoy Dhu al-Mish'ar Malik ibn al-Namat and those of his people who became Muslim: the heights and lowlands of their land are theirs while they pray and pay zakat, to eat its acacia fruit and graze its pasture, under God's pact and the Messenger's protection, with the Muhajirun and Ansar as witnesses."
