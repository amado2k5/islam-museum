label: { ar: "كتاب النبي لمخلاف خارف وهمدان", en: "The Prophet's letter to the district of Kharif and Hamdan", es: "La carta del Profeta al distrito de Kharif y Hamdan", fr: "Lettre du Prophète au district de Kharif et Hamdan", ur: "ضلع خریف اور ہمدان کے نام پیغمبر کا خط", tr: "Peygamberin Kitabı, Mikhlaf Kharef ve Hamdan tarafından", id: "Kitab Nabi oleh Mikhlaf Kharef dan Hamdan" }
summary:
  ar: "كتاب من رسول الله محمد لمخلاف خارف وأهل جناب الهضب وحقاف الرمل مع وافدها ذي المشعار مالك بن النمط ومن أسلم من قومه: أن لهم فراع أرضهم ووهاطها ما أقاموا الصلاة وآتوا الزكاة، يأكلون علافها ويرعون عافيها، لهم بذلك عهد الله وذمة رسوله، وشاهدهم المهاجرون والأنصار."
  en: "A letter from the Messenger of God Muhammad to the district of Kharif and the people of the highland slopes and the sand dunes, with their envoy Dhu al-Mish'ar Malik ibn al-Namat and those of his people who became Muslim: the heights and lowlands of their land are theirs while they pray and pay zakat, to eat its acacia fruit and graze its pasture, under God's pact and the Messenger's protection, with the Muhajirun and Ansar as witnesses."
  es: "Carta del Mensajero de Dios Muhammad al distrito de Kharif y a la gente de las laderas de las tierras altas y las dunas de arena, con su enviado Dhu al-Mish'ar Malik ibn al-Namat y aquellos de su pueblo que se convirtieron al Islam: las alturas y las tierras bajas de su tierra son suyas mientras oren y paguen el zakat, coman su fruto de acacia y pasten en sus prados, bajo el pacto de Dios y la protección del Mensajero, con los Muhajirun y los Ansar como testigos."
  fr: "Lettre du Messager de Dieu Muhammad au district de Kharif et aux habitants des pentes des hautes terres et des dunes de sable, avec leur envoyé Dhu al-Mish'ar Malik ibn al-Namat et ceux de son peuple qui sont devenus musulmans: les hauteurs et les basses terres de leur terre leur appartiennent tant qu'ils prient et paient la zakat, qu'ils mangent les fruits de l'acacia et qu'ils font paître le bétail, sous le pacte de Dieu et la protection du Messager, avec les Muhajirun et les Ansar comme témoins."
  ur: "خدا کے رسول محمد کا خط ضلع خریف اور اونچے ڈھلوانوں اور ریت کے ٹیلوں کے لوگوں کے نام، ان کے ایلچی ذوالمشعر مالک بن النمات اور ان کے لوگوں کے ساتھ جو مسلمان ہوئے: ان کی زمین کی بلندیاں اور نشیبی علاقے ان کے ہیں جب کہ وہ نماز پڑھتے اور زکوٰۃ ادا کرتے ہیں، اس کے ببول کے پھل کھاتے ہیں، اور اس کے ماضی کے ساتھ رسول اللہ کی حفاظت کرتے ہیں۔ مہاجرین اور انصار بطور گواہ۔"
  tr: "Allah Resulü Muhammed'in, gelişleriyle birlikte Kharef'e ve tepelerdeki ve kum tepelerindeki insanlara, Dhu al-Mashar, Malik ibn al-Nt'ib ve İslam'ı benimseyen halkına yazdığı mektup: namaz kurdukları, zekat verdikleri, yemlerini yedikleri ve iyiliğine baktıkları sürece topraklarının dallarına sahip oldukları, Allah'ın ahidi ve O'nun Elçi'nin koruması oldukları sürece, Muhacirun ve Ensar tarafından şahitlik edildikleri sürece."
  id: "Surat dari Rasulullah Muhammad kepada Kharef dan orang-orang di bukit dan bukit pasir dengan kedatangan mereka, Dhu al-Mashar, Malik ibn al-Nt'ib, dan orang-orangnya yang memeluk Islam: bahwa mereka memiliki cabang-cabang tanah dan tanahnya selama mereka mendirikan shalat dan beribadah zakat, memakan pakan-pakannya dan merawat kesejahteraannya, mereka memiliki perjanjian Allah dan perlindungan Rasul-Nya, dan disaksikan oleh Muhajirun dan Ansar."
