id: work/fatwa-amja-dream-of-prophet-flying
class: work
kind: fatwa
label: { ar: "رؤية النبي في المنام", en: "Seeing the Prophet in a dream — and seeing God", ur: "خواب میں نبی کی رؤیت — اور اللہ کی رؤیت", es: "Ver al Profeta en un sueño y ver a Dios", fr: "Voir le Prophète en rêve — et voir Dieu", tr: "Peygamber'i Rüyada Görmek", id: "Melihat Nabi dalam Mimpi" }
summary:
  ar: "سأل سائل رأى النبي في منامه يطير في السماء يتفقد أمته والأمم مجموعات ولم ينظر إلى مجموعتهم. أجاب د. صلاح الصاوي ⁦(فتوى رقم 23352 بتاريخ 21 يوليو 2008)⁩ أن رؤية النبي في المنام من المبشرات إذا رآه الرائي على هيئته الموصوفة في كتب السير والشمائل فإن الشيطان لا يتمثل في هذه الصورة، وعدم نظره إلى مجموعته قد يحمل نوعًا من العتب عليه يقتضي مراجعة علاقته بسنته وهديه فقد يكون منه تقصير وهو غافل عنه، وأما رؤية الله منامًا فممكنة عند أهل العلم فقد يرى المؤمن ربه في المنام في صورة متنوعة على قدر إيمانه ويقينه فإذا كان إيمانه صحيحًا لم يره إلا في صورة تحسن."
  en: "A questioner dreamt the Prophet flying through the sky inspecting his ummah — nations in groups — and he did not look toward their group. Dr. Salah al-Sawi (fatwa no. 23352, 21 July 2008) answered that seeing the Prophet in a dream is among the glad tidings when the dreamer sees him in the form described in the biographies and qualities books — the devil cannot take that form; his not looking toward the group may carry a reproach calling for review of one's bond with his Sunna and guidance, perhaps a neglect one is heedless of. Seeing God in a dream is possible in the scholars' view — the believer may see his Lord in varied forms matching his faith and certainty; with sound faith he sees Him only in a beautiful form."
  ur: "ایک سائل نے نبی کی خواب میں رؤیت اور ان کی طرف نہ دیکھنے کا مطلب پوچھا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 23352، 21 جولائی 2008)⁩ کے مطابق نبی کی رؤیت بشارت ہے اور نہ دیکھنا سنت سے تعلق کا جائزہ مانگتا ہے؛ اللہ کی رؤیت منام میں علماء کے نزدیک ممکن ہے۔"
  es: "Un consultante soñó que el Profeta volaba por el cielo inspeccionando su ummah (naciones agrupadas) y que no miraba hacia su grupo. El Dr. Salah al-Sawi (fatwa n.º 23352, 21 de julio de 2008) respondió que ver al Profeta en un sueño es una buena noticia cuando el soñador lo ve en la forma descrita en las biografías y los libros de cualidades; el diablo no puede adoptar esa forma. El hecho de que no mirara hacia el grupo puede conllevar un reproche que exige una revisión del vínculo con la Sunna y la guía divina, tal vez una negligencia. Ver a Dios en un sueño es posible según los eruditos: el creyente puede ver a su Señor en diversas formas que se ajusten a su fe y certeza; con una fe sólida, lo ve solo en una forma hermosa."
  fr: "Un homme, posant une question, rêva que le Prophète survolait le ciel, inspectant sa communauté (les nations regroupées), sans pour autant regarder vers elle. Le Dr Salah al-Sawi (fatwa n° 23352, 21 juillet 2008) répondit que voir le Prophète en rêve est de bon augure, surtout si le rêveur le voit sous la forme décrite dans les biographies et les ouvrages relatant ses qualités – le diable ne pouvant prendre cette forme. Le fait qu'il ne regarde pas le groupe peut être interprété comme un reproche, invitant à un examen de son attachement à la Sunna et à la guidance divine, voire à une négligence dont on ne se rend pas compte. De l'avis des savants, il est possible de voir Dieu en rêve – le croyant peut voir son Seigneur sous diverses formes, en accord avec sa foi et ses certitudes; avec une foi sincère, il ne Le voit que sous une forme magnifique."
  tr: "Bir soruya soruldu: Rüyada Peygamber'i gökyüzünde uçup ulusunu ve ulusları gruplar halinde kontrol ettiğini gördü, ancak gruplarına bakmadı. Dr. Salah Al-Sawy (21 Temmuz 2008 tarihli Fetva No. 23352) Peygamber'i rüyada görmenin iyi bir işaret olduğunu yanıtladı. Eğer kâhin, biyografi ve özellikler kitaplarında anlatılan formunda onu görüyorsa, Şeytan bu biçimde temsil edilmez. Grubuna bakmamak onun üzerinde bir tür suçlama olabilir ve sünnetiyle ve rehberliğiyle ilişkisini yeniden gözden geçirmesini gerektirebilir, bu da ihmal ve dikkatsizlikten kaynaklanabilir. Rüyada Tanrı'yı görmek ise alimlere göre mümkündür; bir mümin, inancına ve kesinliğine göre rüyada Rabbini görebilir; inancı doğruysa bunu sadece bir iyileşme biçiminde görür."
  id: "Seorang penanya ditanya: Dia melihat Nabi dalam mimpi terbang di langit untuk memeriksa bangsa dan bangsanya dalam kelompok-kelompok, tetapi dia tidak melihat kelompok mereka. Dr. Salah Al-Sawy menjawab (Fatwa No. 23352 tanggal 21 Juli 2008) bahwa melihat Nabi dalam mimpi adalah tanda baik. Jika peramal melihatnya dalam wujud yang dijelaskan dalam buku biografi dan ciri-ciri, maka Setan tidak digambarkan dalam bentuk ini. Tidak melihat kelompoknya dapat membawa semacam kesalahan padanya, yang mengharuskannya mempertimbangkan kembali hubungannya dengan Sunnah dan petunjuknya, yang mungkin disebabkan oleh kelalaian dan kelalaian. Adapun melihat Tuhan dalam mimpi, itu mungkin menurut para ulama; seorang mukmin dapat melihat Tuhannya dalam mimpi dalam berbagai bentuk sesuai iman dan kepastiannya; jika imannya benar, dia hanya melihatnya dalam bentuk perbaikan."
