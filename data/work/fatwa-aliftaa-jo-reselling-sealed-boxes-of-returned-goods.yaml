id: work/fatwa-aliftaa-jo-reselling-sealed-boxes-of-returned-goods
class: work
kind: fatwa
label: { ar: "بيع الصناديق المغلقة من المنتجات المرتجعة", en: "Selling sealed boxes of returned goods", ur: "واپس شدہ سامان کے بند ڈبوں کی فروخت", es: "Venta de cajas selladas de productos devueltos", fr: "Vente de boîtes scellées de marchandises retournées", tr: "İade edilen ürünlerin mühürlü kutularının satışı", id: "Penjualan kotak tersegel produk yang dikembalikan" }
summary:
  ar: "سؤال عن شركة تجمع المنتجات المرتجعة من الزبائن في صناديق كبيرة مغلقة وتبيعها لوسطاء، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع الصناديق المغلقة يجوز إذا احتوت على منتجات معلومة للمشتري وجرى العرف بذلك وانتفى الغرر المؤدي إلى النزاع، ولا يجوز إذا لم يُعلم جنس ما فيها، وعرضت خلاف الجمهور والحنفية في بيع ما لم يُر. أجابت الدائرة بأن الأصل تصحيح البيوع التي تعارف عليها الناس بشرط أن تبتعد عن الغرر والجهالة المؤدية إلى النزاع، وبأن المعاملات المبنية على الجهالة والغرر محرمة لأنها من أكل أموال الناس بالباطل. وقالت إن لبيع الصناديق المغلقة حالتين: الأولى ألا يُعلم ما فيها من السلع لا نوعًا ولا عددًا، فهذه محرمة لاشتمالها على الجهالة والغرر؛ والثانية أن تحتوي منتجات معلومة للمشتري لم يرها وجرت عادة الناس بتبايعها، فالأصل عدم جوازها عند جمهور الفقهاء، وأجازها الحنفية. واستشهدت لقول الحنفية بقول محمد بن الحسن الشيباني في الحجة على أهل المدينة بجواز بيع عِدل الثياب الذي يضر فتحه دون أن يُعلم عدد ما فيه، وبأن بيع المجازفة الذي لا يحتاج إلى كيل ولا وزن ولا عدد من أجوز البيوع. وخلصت إلى جواز بيع الصناديق المغلقة إذا احتوت على منتجات معلومة للمشتري وجرى العرف بذلك وانتفى الغرر والجهالة المؤدية إلى النزاع، وعدم جواز بيع الصناديق المغلقة التي لا يُعلم جنس منتجاتها."
  en: "A question about a company that gathers products returned by customers into large sealed boxes and sells them to intermediaries, in which Jordan's General Iftaa Department answered that sealed boxes may be sold if they hold products known to the buyer, custom has established the practice and there is no uncertainty leading to dispute, but not if the kind of their contents is unknown, and set out the difference between the majority and the Hanafis over selling what is unseen. The Department answered that the basic rule is to uphold the sales people customarily practise, provided they avoid uncertainty (gharar) and ignorance that lead to dispute, and that dealings built on ignorance and uncertainty are forbidden because they consume people's wealth wrongfully. It said that selling sealed boxes has two cases: first, when nothing is known of the goods inside, neither their kind nor their number, which is forbidden because it involves ignorance and uncertainty; second, when the boxes hold products known to the buyer which he has not seen, and people customarily trade them, which the majority of jurists hold is in principle not permitted, while the Hanafis permit it. For the Hanafi view it cited Muhammad ibn al-Hasan al-Shaybani in al-Hujja ala Ahl al-Madina, who allowed a bale of cloth that would be damaged by opening to be sold without knowing how many pieces it holds, and said that sale by estimate, needing no measure, weight or count, is among the most clearly valid sales. It concluded that sealed boxes may be sold when they hold products known to the buyer, custom has established the practice, and the uncertainty and ignorance that lead to dispute are absent, and that sealed boxes whose products are of unknown kind may not be sold."
  ur: "ایک کمپنی کے بارے میں سوال جو گاہکوں کی واپس کی ہوئی مصنوعات بڑے بند ڈبوں میں جمع کر کے درمیانی لوگوں کو بیچتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بند ڈبوں کی فروخت جائز ہے اگر ان میں خریدار کو معلوم مصنوعات ہوں، عرف میں یہ رائج ہو اور نزاع پیدا کرنے والا غرر نہ ہو، اور اگر ان کے سامان کی جنس معلوم نہ ہو تو جائز نہیں، اور نہ دیکھی ہوئی چیز کی فروخت میں جمہور اور احناف کا اختلاف بیان کیا۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ لوگوں میں رائج بیوع کو درست مانا جائے، بشرطیکہ وہ نزاع پیدا کرنے والے غرر اور جہالت سے پاک ہوں، اور جہالت و غرر پر مبنی معاملات حرام ہیں کیونکہ یہ لوگوں کا مال ناحق کھانا ہے۔ اس نے کہا کہ بند ڈبوں کی فروخت کی دو صورتیں ہیں: پہلی یہ کہ ان میں موجود سامان کا نہ نوع معلوم ہو نہ تعداد، یہ جہالت اور غرر کی وجہ سے حرام ہے؛ دوسری یہ کہ ان میں خریدار کو معلوم مصنوعات ہوں جو اس نے دیکھی نہ ہوں اور لوگوں میں ان کی خرید و فروخت رائج ہو، تو جمہور فقہا کے نزدیک یہ اصلاً جائز نہیں اور احناف نے اسے جائز کہا ہے۔ احناف کے قول کے لیے اس نے الحجۃ علی اہل المدینہ میں محمد بن حسن شیبانی کا حوالہ دیا، جنہوں نے کپڑوں کی ایسی گٹھڑی جسے کھولنے سے نقصان ہو، اس میں موجود تعداد جانے بغیر بیچنا جائز کہا، اور کہا کہ اندازے سے بیع، جس میں ناپ، تول یا گنتی کی ضرورت نہ ہو، سب سے واضح طور پر جائز بیوع میں سے ہے۔ اس نے نتیجہ نکالا کہ بند ڈبوں کی فروخت جائز ہے جب ان میں خریدار کو معلوم مصنوعات ہوں، عرف میں یہ رائج ہو اور نزاع پیدا کرنے والی جہالت اور غرر نہ ہو، اور جن بند ڈبوں کی مصنوعات کی جنس معلوم نہ ہو ان کی فروخت جائز نہیں۔"
  es: "Una pregunta sobre una empresa que recoge productos devueltos por los clientes en grandes cajas selladas y los vende a intermediarios, a la que el Departamento General de Iftaa de Jordania respondió que las cajas selladas pueden venderse si contienen productos conocidos por el comprador, la práctica está establecida por la costumbre y no existe incertidumbre que dé lugar a disputas, pero no si se desconoce el tipo de su contenido, y expuso la diferencia entre la mayoría y los hanafíes sobre la venta de lo que no se ve. El Departamento respondió que la regla básica es respetar la práctica habitual de los vendedores, siempre que eviten la incertidumbre (gharar) y la ignorancia que dan lugar a disputas, y que las transacciones basadas en la ignorancia y la incertidumbre están prohibidas porque consumen indebidamente el patrimonio de las personas. Dijo que la venta de cajas selladas tiene dos casos: primero, cuando no se sabe nada de los productos en su interior, ni su tipo ni su cantidad, lo cual está prohibido porque implica ignorancia e incertidumbre; segundo, cuando las cajas contienen productos conocidos por el comprador que no ha visto, y la gente los comercializa habitualmente, lo cual la mayoría de los juristas considera que en principio no está permitido, mientras que los hanafíes lo permiten. En cuanto a la postura hanafí, citó a Muhammad ibn al-Hasan al-Shaybani en al-Hujja ala Ahl al-Madina, quien permitió la venta de un fardo de tela que se dañaría al abrirlo sin saber cuántas piezas contenía, y afirmó que la venta por estimación, sin necesidad de medidas, pesos ni recuentos, es una de las ventas más claramente válidas. Concluyó que las cajas selladas pueden venderse cuando contienen productos conocidos por el comprador, la costumbre ha establecido la práctica y no existe la incertidumbre ni la ignorancia que dan lugar a disputas, y que las cajas selladas cuyos productos son de naturaleza desconocida no pueden venderse."
  fr: "Une question concernait une entreprise qui regroupe les produits retournés par les clients dans de grands cartons scellés et les revend à des intermédiaires. Le Département général de la jurisprudence islamique (Iftaa) de Jordanie a répondu que la vente de ces cartons scellés est autorisée si leur contenu est connu de l'acheteur, si la pratique est établie par la coutume et s'il n'existe aucune incertitude susceptible de donner lieu à un litige. En revanche, la vente est interdite si la nature du contenu est inconnue. Le Département a également exposé la divergence entre l'école majoritaire et l'école hanafite concernant la vente de biens non vus. Il a précisé que la règle fondamentale est de respecter les pratiques commerciales habituelles, à condition que les vendeurs évitent toute incertitude (gharar) et toute ignorance pouvant engendrer un litige. Les transactions fondées sur l'ignorance et l'incertitude sont interdites car elles constituent un détournement de fonds. Le Département a indiqué que la vente de cartons scellés présente deux cas: premièrement, lorsque le contenu est inconnu, tant en termes de nature que de quantité, ce qui est interdit car cela implique ignorance et incertitude; deuxièmement, lorsque les cartons contiennent des produits connus de l'acheteur mais qu'il n'a pas vus, et que leur commerce est d'usage, ce que la majorité des juristes considère comme fondamentalement interdit, tandis que l'école hanafite l'autorise. Concernant l'opinion hanafite, le traité cite Muhammad ibn al-Hasan al-Shaybani dans son ouvrage « al-Hujja ala Ahl al-Madina », qui autorise la vente d'une balle de tissu susceptible d'être endommagée à l'ouverture, sans que l'on connaisse le nombre de pièces qu'elle contient. Il affirme que la vente par estimation, ne nécessitant ni mesure, ni poids, ni comptage, est parmi les ventes les plus valides. Le traité conclut que les boîtes scellées peuvent être vendues lorsqu'elles contiennent des produits connus de l'acheteur, que la coutume l'autorise et que l'incertitude et l'ignorance, sources de litiges, sont absentes. En revanche, les boîtes scellées dont le contenu est inconnu ne peuvent être vendues."
  tr: "Ürdün Genel Fetva Dairesi'nin, alıcının bildiği ürünleri içeriyorsa mühürlü kutuların satışının izin verildiğini, ancak anlaşmazlığa yol açan belirsizliğin bilinmediğini, ancak içeriğin türü bilinmiyorsa izin verilmediğini belirten bir şirketle ilgili bir soru. Ayrıca, çoğunluk ile Hanefi arasındaki fark ve görünmeyen şeylerin satışı konusundaki farkı da ortaya koydu. Departman, insanların aşina olduğu satışları, anlaşmazlığa yol açan belirsizlik ve cehaletten kaçınmak koşuluyla düzeltmek için varsayılan olarak yanıt verdi ve cehalet ve belirsizlik temelli işlemlerin yasa dışı şekilde insanların parasını tüketmeyi içerdiği için yasak olduğunu belirtti. Kapalı kutuların satışının iki durumu olduğunu belirtti: birincisi, sahibi içindeki malların türünü veya miktarını bilmez, çünkü bunlar cehalet ve belirsizlik nedeniyle yasaktır; ikincisi, alıcının görmediği ve tanıdığı ürünler içeriyorsa, ki bu insanların satması adettendir, bu yüzden çoğu hukukçuya göre bu ürünlerin kabul edilmemesi ve Hanafilerin izin vermesidir. Medine halkına karşı Muhammed bin el-Hasan el-Şeybani'nin Hanefi görüşünü, içeriği tam olarak bilinmeden açılması zararlı olanlar kadar adil kıyafetlerin satılmasının ve ölçü, ağırlık veya ürün sayısı gerektirmeyen riskli satışların izin verildiği yönündeki görüşünü aktardı. Kapalı kutuların alıcının bildiği ürünler varsa satışının izin verildiğini, bunun geleneksel olduğunu ve anlaşmazlıklara yol açan belirsizliğin ortadan kalktığını ve ürün tipi bilinmeyen kapalı kutuların satılmasının izin verilmediğini belirttiler."
  id: "Sebuah pertanyaan tentang sebuah perusahaan yang mengumpulkan produk yang dikembalikan dari pelanggan dalam kotak besar yang tertutup dan menjualnya kepada perantara, di mana Departemen Fatwa Umum Yordania menjawab bahwa menjual kotak tertutup diperbolehkan jika mengandung produk yang diketahui pembeli, dan ini adalah kebiasaan serta ketidakpastian yang menyebabkan perselisihan tidak diketahui, tetapi tidak diperbolehkan jika jenis isinya tidak diketahui. Pertanyaan itu juga menyajikan perbedaan antara mayoritas dan Hanafi terkait penjualan yang tidak terlihat. Departemen menjawab bahwa defaultnya adalah memperbaiki penjualan yang sudah dikenal orang, asalkan menghindari ketidakpastian dan ketidaktahuan yang menyebabkan perselisihan, dan bahwa transaksi yang didasarkan pada ketidaktahuan dan ketidakpastian dilarang karena melibatkan konsumsi uang orang secara ilegal. Dokumen tersebut menyatakan bahwa menjual kotak tertutup memiliki dua kasus: pertama, pemilik tidak mengetahui jenis atau jumlah barang di dalamnya, karena barang tersebut dilarang karena ketidaktahuan dan ketidakpastian; kedua, jika berisi produk yang diketahui pembeli yang tidak dilihatnya, yang merupakan kebiasaan orang untuk menjual, maka defaultnya adalah tidak diperbolehkan menurut mayoritas ahli hukum, dan Hanafi mengizinkannya. Dia mengutip pandangan Hanafi dari Muhammad ibn al-Hasan al-Shaybani dalam argumennya melawan masyarakat Madinah mengenai diperbolehkannya menjual pakaian yang sama adilnya dengan yang berbahaya untuk dibuka tanpa mengetahui jumlah isinya secara pasti, dan bahwa penjualan berisiko yang tidak memerlukan ukuran, berat, atau jumlah barang diperbolehkan. Mereka menyimpulkan bahwa penjualan kotak tertutup diperbolehkan jika berisi produk yang diketahui pembeli, dan ini adalah kebiasaan dan ketidakpastian yang menyebabkan perselisihan dihilangkan, serta tidak diperbolehkan menjual kotak tertutup yang jenis produknya tidak diketahui."
