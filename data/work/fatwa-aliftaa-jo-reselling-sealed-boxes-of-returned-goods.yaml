id: work/fatwa-aliftaa-jo-reselling-sealed-boxes-of-returned-goods
class: work
kind: fatwa
label: { ar: "بيع الصناديق المغلقة من المنتجات المرتجعة", en: "Selling sealed boxes of returned goods", ur: "واپس شدہ سامان کے بند ڈبوں کی فروخت" }
summary:
  ar: "سؤال عن شركة تجمع المنتجات المرتجعة من الزبائن في صناديق كبيرة مغلقة وتبيعها لوسطاء، أجابت فيه دائرة الإفتاء العام الأردنية بأن بيع الصناديق المغلقة يجوز إذا احتوت على منتجات معلومة للمشتري وجرى العرف بذلك وانتفى الغرر المؤدي إلى النزاع، ولا يجوز إذا لم يُعلم جنس ما فيها، وعرضت خلاف الجمهور والحنفية في بيع ما لم يُر. أجابت الدائرة بأن الأصل تصحيح البيوع التي تعارف عليها الناس بشرط أن تبتعد عن الغرر والجهالة المؤدية إلى النزاع، وبأن المعاملات المبنية على الجهالة والغرر محرمة لأنها من أكل أموال الناس بالباطل. وقالت إن لبيع الصناديق المغلقة حالتين: الأولى ألا يُعلم ما فيها من السلع لا نوعًا ولا عددًا، فهذه محرمة لاشتمالها على الجهالة والغرر؛ والثانية أن تحتوي منتجات معلومة للمشتري لم يرها وجرت عادة الناس بتبايعها، فالأصل عدم جوازها عند جمهور الفقهاء، وأجازها الحنفية. واستشهدت لقول الحنفية بقول محمد بن الحسن الشيباني في الحجة على أهل المدينة بجواز بيع عِدل الثياب الذي يضر فتحه دون أن يُعلم عدد ما فيه، وبأن بيع المجازفة الذي لا يحتاج إلى كيل ولا وزن ولا عدد من أجوز البيوع. وخلصت إلى جواز بيع الصناديق المغلقة إذا احتوت على منتجات معلومة للمشتري وجرى العرف بذلك وانتفى الغرر والجهالة المؤدية إلى النزاع، وعدم جواز بيع الصناديق المغلقة التي لا يُعلم جنس منتجاتها."
  en: "A question about a company that gathers products returned by customers into large sealed boxes and sells them to intermediaries, in which Jordan's General Iftaa Department answered that sealed boxes may be sold if they hold products known to the buyer, custom has established the practice and there is no uncertainty leading to dispute, but not if the kind of their contents is unknown, and set out the difference between the majority and the Hanafis over selling what is unseen. The Department answered that the basic rule is to uphold the sales people customarily practise, provided they avoid uncertainty (gharar) and ignorance that lead to dispute, and that dealings built on ignorance and uncertainty are forbidden because they consume people's wealth wrongfully. It said that selling sealed boxes has two cases: first, when nothing is known of the goods inside, neither their kind nor their number, which is forbidden because it involves ignorance and uncertainty; second, when the boxes hold products known to the buyer which he has not seen, and people customarily trade them, which the majority of jurists hold is in principle not permitted, while the Hanafis permit it. For the Hanafi view it cited Muhammad ibn al-Hasan al-Shaybani in al-Hujja ala Ahl al-Madina, who allowed a bale of cloth that would be damaged by opening to be sold without knowing how many pieces it holds, and said that sale by estimate, needing no measure, weight or count, is among the most clearly valid sales. It concluded that sealed boxes may be sold when they hold products known to the buyer, custom has established the practice, and the uncertainty and ignorance that lead to dispute are absent, and that sealed boxes whose products are of unknown kind may not be sold."
  ur: "ایک کمپنی کے بارے میں سوال جو گاہکوں کی واپس کی ہوئی مصنوعات بڑے بند ڈبوں میں جمع کر کے درمیانی لوگوں کو بیچتی ہے، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ بند ڈبوں کی فروخت جائز ہے اگر ان میں خریدار کو معلوم مصنوعات ہوں، عرف میں یہ رائج ہو اور نزاع پیدا کرنے والا غرر نہ ہو، اور اگر ان کے سامان کی جنس معلوم نہ ہو تو جائز نہیں، اور نہ دیکھی ہوئی چیز کی فروخت میں جمہور اور احناف کا اختلاف بیان کیا۔ ڈیپارٹمنٹ نے جواب دیا کہ اصل یہ ہے کہ لوگوں میں رائج بیوع کو درست مانا جائے، بشرطیکہ وہ نزاع پیدا کرنے والے غرر اور جہالت سے پاک ہوں، اور جہالت و غرر پر مبنی معاملات حرام ہیں کیونکہ یہ لوگوں کا مال ناحق کھانا ہے۔ اس نے کہا کہ بند ڈبوں کی فروخت کی دو صورتیں ہیں: پہلی یہ کہ ان میں موجود سامان کا نہ نوع معلوم ہو نہ تعداد، یہ جہالت اور غرر کی وجہ سے حرام ہے؛ دوسری یہ کہ ان میں خریدار کو معلوم مصنوعات ہوں جو اس نے دیکھی نہ ہوں اور لوگوں میں ان کی خرید و فروخت رائج ہو، تو جمہور فقہا کے نزدیک یہ اصلاً جائز نہیں اور احناف نے اسے جائز کہا ہے۔ احناف کے قول کے لیے اس نے الحجۃ علی اہل المدینہ میں محمد بن حسن شیبانی کا حوالہ دیا، جنہوں نے کپڑوں کی ایسی گٹھڑی جسے کھولنے سے نقصان ہو، اس میں موجود تعداد جانے بغیر بیچنا جائز کہا، اور کہا کہ اندازے سے بیع، جس میں ناپ، تول یا گنتی کی ضرورت نہ ہو، سب سے واضح طور پر جائز بیوع میں سے ہے۔ اس نے نتیجہ نکالا کہ بند ڈبوں کی فروخت جائز ہے جب ان میں خریدار کو معلوم مصنوعات ہوں، عرف میں یہ رائج ہو اور نزاع پیدا کرنے والی جہالت اور غرر نہ ہو، اور جن بند ڈبوں کی مصنوعات کی جنس معلوم نہ ہو ان کی فروخت جائز نہیں۔"
