id: work/fatwa-amja-anger-unspoken-curse
class: work
kind: fatwa
label: { ar: "همّ بكلمة سيئة في الغضب ولم يتلفظ", en: "He almost uttered an ill word in anger but held his tongue", ur: "غصے میں برا کلمہ کہنا چاہا مگر نہ کہا", es: "Estuvo a punto de proferir una palabrota por la rabia, pero se contuvo.", fr: "Il faillit proférer une injure sous le coup de la colère, mais se retint.", tr: "Öfkeyle kötü bir kelimeyle konuşurlar ve o söylemedi", id: "Mereka dengan kata-kata kasar dalam kemarahan dan dia tidak mengucapkannya" }
summary:
  ar: "سأل سائل أغضبه شخص غضبًا شديدًا فأراد أن يقول كلمة سوء ثم أمسك لسانه ولم يتلفظ بها هل يعيد الشهادتين. أجاب د. صلاح الصاوي ⁦(فتوى رقم 78017 بتاريخ 28 فبراير 2009)⁩ بوصية النبي لا تغضب، وحمد الله أن الأمر لم يتجاوز حديث النفس وأنه أمسك لسانه عن التلفظ، وقد تجاوز الله لهذه الأمة عما حدثت به نفسها ما لم تعمل به أو تتكلم به، ونصحه بالاستغفار وتجديد العزم على الاستقامة والبعد عن مثيرات الغضب."
  en: "A questioner who was so angered he nearly uttered an ill word but caught his tongue asked whether he must repeat the testimony. Dr. Salah al-Sawi (fatwa no. 78017, 28 February 2009) answered with the Prophet's counsel — do not be angry — thanking God the matter never passed inner thought, his tongue held; God has pardoned this ummah what their selves whisper so long as it is not done or spoken; he should seek forgiveness and renew his resolve to uprightness away from anger's provocations."
  ur: "ایک سائل غصے میں برا کلمہ کہنے کو تھا مگر روک لیا۔ ڈاکٹر صلاح الصاوی ⁦(فتویٰ 78017، 28 فروری 2009)⁩ کے مطابق نبی کی نصیحت «غصہ نہ کرو» ہے؛ زبان نہ نکلے تو معاف — استغفار اور غصے سے بچنا۔"
  es: "Un interlocutor, tan enfadado que casi profirió una palabrota pero se contuvo, preguntó si debía repetir el testimonio. El Dr. Salah al-Sawi (fatwa n.º 78017, 28 de febrero de 2009) respondió con el consejo del Profeta: «No te enfades», dando gracias a Dios porque el asunto nunca pasó de su reflexión, y se contuvo. Dios ha perdonado a esta comunidad lo que murmuran, siempre y cuando no lo hagan ni lo digan. Debe buscar el perdón y renovar su determinación de ser recto, lejos de las provocaciones de la ira."
  fr: "Un homme, si furieux qu'il faillit proférer une injure mais se retint, demanda s'il devait répéter son témoignage. Le Dr Salah al-Sawi (fatwa n° 78017, 28 février 2009) répondit en citant le conseil du Prophète: « Ne vous mettez pas en colère. » Remerciant Dieu que la question ne l'ait même pas effleuré, il garda sa langue. Dieu pardonne à cette communauté ce qu'elle murmure, tant que cela ne se traduit ni en actes ni en paroles. Il est donc conseillé à cet homme de rechercher le pardon et de renouveler sa résolution à la droiture, loin des provocations de la colère."
  tr: "Çok öfkelenen bir soru soran kişi, kötü bir kelime söylemek isteyip istemediğini sordu, sonra dilini tutup söylemedi, iki tanıklığı tekrar edip etmemesi gerektiğini söyledi. Dr. Salah Al-Sawy (28 Şubat 2009 tarihli 78017 sayılı Fetva) Peygamber'in buyruğuyla cevap verdi: Kızmayın, ve Tanrı'ya şükretti ki mesele kendi kendine konuşmanın ötesine geçmedi ve dilini kelimelerden uzak tuttu. Tanrı, bu ulusu yapmadığı veya konuşmadığı şeyler için affetti, ona af dilemesini, doğruluğa kararlılığını yenilemesini ve öfke provokasyonlarından kaçınmasını tavsiye etti."
  id: "Seorang penanya yang menjadi sangat marah bertanya apakah ia ingin mengucapkan kata-kata buruk, lalu diam dan tidak mengucapkannya, apakah ia harus mengulang kedua kesaksian tersebut. Dr. Salah Al-Sawy menjawab (Fatwa No. 78017 tanggal 28 Februari 2009) dengan perintah Nabi: Jangan marah, dan ia bersyukur kepada Tuhan karena masalah itu tidak melampaui bicara diri sendiri dan menahan lidahnya agar tidak mengucapkan kata-kata. Allah mengampuni bangsa ini atas apa yang tidak dilakukan atau dibicarakan, dan menasihatinya untuk mencari pengampunan, memperbarui tekad untuk bersikap benar, dan menghindari provokasi kemarahan."
