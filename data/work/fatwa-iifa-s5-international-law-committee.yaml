summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته الخامسة ⁦(الكويت، ديسمبر 1988م)⁩: الموافقة على دراسة مشروع النظام الأساسي للجنة الإسلامية الدولية للقانون وتسلم المهام الموكلة إليها لتكون من ضمن نشاطات المجمع."
  en: "IIFA's fifth-session resolution (Kuwait, December 1988) on the International Islamic Committee for Law: it agreed to study the committee's draft statute and to take over the tasks entrusted to it so it becomes part of the Academy's activities."
  ur: "اکیڈمی کی پانچویں مجلس کی قرارداد ⁦(کویت، دسمبر 1988ء)⁩: بین الاقوامی اسلامی قانون کمیٹی کے اساس نامے کا مطالعہ اور اس کی ذمہ داریاں سنبھالنے کی منظوری۔"
  es: "Resolución de la quinta sesión de la IIFA (Kuwait, diciembre de 1988) sobre el Comité Islámico Internacional de Derecho: acordó estudiar el proyecto de estatutos del comité y asumir las tareas que se le encomendaron para que pase a formar parte de las actividades de la Academia."
  fr: "Résolution de la cinquième session de l'IIFA (Koweït, décembre 1988) sur le Comité islamique international pour le droit: elle a accepté d'étudier le projet de statut du comité et de prendre en charge les tâches qui lui sont confiées afin qu'il devienne une partie des activités de l'Académie."
  tr: "Uluslararası İslami Fıkıh Akademisi'nin beşinci oturumunda (Kuveyt, Aralık 1988) karar alması: Uluslararası İslam Hukuku Komitesi'nin taslak tüzüğünün incelenmesi ve kendisine verilen görevlerin Akademi faaliyetlerinin bir parçası olması için verilmesine onay verildi."
  id: "Keputusan Akademi Fiqh Islam Internasional dalam sesi kelimanya (Kuwait, Desember 1988): Persetujuan untuk mempelajari rancangan statuta Komite Hukum Islam Internasional dan menugaskan tugas yang diberikan kepadanya untuk menjadi bagian dari kegiatan Akademi."
