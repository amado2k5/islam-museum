id: work/fatwa-dar-alifta-eg-mount-tur-specialness
class: work
kind: fatwa
label: { ar: "خصوصية جبل الطور حتى يتجلى الله تعالى عليه", en: "The specialness of Mount Tur, upon which God manifested Himself", ur: "کوہِ طور کی خصوصیت جس پر اللہ نے تجلی فرمائی", es: "La singularidad del Monte Tur, sobre el cual Dios se manifestó.", fr: "Le caractère exceptionnel du mont Tur, sur lequel Dieu s'est manifesté" }
summary:
  ar: "سائل سأل عن خصوصية جبل الطور التي اختصه الله بها حتى تجلى عليه. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21680)⁩ أن اختصاص الله لأي مخلوق من مخلوقاته بفضيلة أو ميزة محض فضل وتكرم منه سبحانه يفعل ما يشاء على ما فصّل الجواب."
  en: "A questioner asked about the specialness of Mount Tur, to which God gave the distinction of His manifestation. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21680) answered that God singling out any of His creatures for merit is sheer grace and generosity from Him — He does what He wills — as the answer details."
  ur: "ایک سائل نے کوہِ طور کی اس خصوصیت کے بارے میں پوچھا جس پر اللہ نے تجلی فرمائی۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21680)⁩ نے جواب دیا کہ اللہ کا کسی مخلوق کو فضیلت دینا اس کا محض فضل اور کرم ہے — وہ جو چاہے کرتا ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó acerca de la singularidad del Monte Tur, al cual Dios otorgó la distinción de Su manifestación. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21680) respondió que el hecho de que Dios escoja a cualquiera de Sus criaturas para otorgar mérito es pura gracia y generosidad de Su parte; Él hace lo que quiere, como se detalla en la respuesta."
  fr: "Un internaute interrogea Dieu sur le caractère exceptionnel du mont Tour, auquel Dieu accorda la distinction d'être une manifestation de Sa volonté. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21680) répondit que le fait que Dieu distingue l'une de Ses créatures par mérite est une pure grâce et une immense générosité de Sa part — Il fait ce qu'Il veut —, comme le précise la réponse."
