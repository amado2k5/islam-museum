label: { ar: "قرار مجمع الفقه الإسلامي الدولي 198 (21/4) بشأن الاستحالة والاستهلاك والمواد الإضافية في الغذاء والدواء", en: "IIFA resolution 198 (21/4) on istihala (transformation), istihlak and additive substances in food and medicine", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 198 (21/4): خوراک اور ادویہ میں استحالہ، استہلاک اور اضافی اجزاء", es: "Resolución 198 (21/4) de la IIFA sobre istihala (transformación), istihlak y sustancias aditivas en alimentos y medicamentos.", fr: "Résolution 198 (21/4) de l'IIFA sur l'istihala (transformation), l'istihlak et les substances additives dans les aliments et les médicaments", tr: "Gıda ve ilaçta imkansızlık, tüketim ve katkı maddeleri hakkında Uluslararası İslam Fiqh Akademisi Kararı 198 (21/4)", id: "Resolusi Akademi Fiqh Islam Internasional 198 (21/4) mengenai ketidakmungkinan, konsumsi, dan aditif dalam makanan dan obat-obatan" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩ بعد اطلاعه على توصيات الندوة الفقهية الطبية التي عقدتها المنظمة الإسلامية للعلوم الطبية بالكويت بالتعاون مع المجمع وبمشاركة مؤسسة الحسن الثاني والإيسيسكو والمكتب الإقليمي لمنظمة الصحة العالمية ⁦(الدار البيضاء 1418هـ/1997م)⁩. قرر أنه يجب على كل مسلم الالتزام بأحكام الشريعة في الغذاء والدواء تحقيقًا لطيب مطعمه ومشربه وعلاجه، وأن من رحمة الله مراعاة الضرورة والحاجة ومن المبادئ المقررة: الضرورات تبيح المحظورات، والحاجة تنزل منزلة الضرورة عامة أو خاصة، والأصل في المنافع الإباحة ما لم يقم دليل معتبر على الحرمة، والأصل في الأشياء الطهارة ما لم يقم دليل معتبر على النجاسة، ولا يعد تحريم أكل الشيء أو شربه حكمًا بنجاسته شرعًا. وأن المواد المحرمة أو النجسة بذاتها أو بإضافتها في الغذاء والدواء تنقلب مباحة بإحدى طريقتين: الاستحالة وهي في الاصطلاح الفقهي تغير حقيقة المادة النجسة أو المحرم تناولها وانقلاب عينها إلى مادة أخرى مختلفة في الاسم والخصائص والصفات ويعبر عنها علميًا بكل تفاعل كيميائي كامل كتحويل الزيوت إلى صابون وتحلل المادة إلى مكوناتها كتفكيك الدهون إلى أحماض دسمة وغليسرين، ويحصل بالوسائل العلمية وبصورة غير منظورة كالتخلل والدباغة والإحراق، وأما التفاعل الجزئي فليس استحالة فتبقى النجسة على حالها ولا يجوز استخدامها. وبناء على ذلك: المركبات الإضافية ذات الأصل الحيواني المحرم أو النجس المتحققة فيها الاستحالة طاهرة وتناولها حلال؛ والمركبات المستخرجة من أصول نجسة أو محرمة كالدم المسفوح أو مياه المجاري التي لم تتحقق فيها الاستحالة لا يجوز استخدامها كالنقانق المحشوة بالدم والعصائد المدماة والهامبرجر المدمى وأغذية الأطفال المحتوية دمًا وحساء الدم وهي طعام نجس محرم؛ وأما بلازما الدم البديل الرخيص لزلال البيض المستخدمة في الفطائر والحساء والنقانق والمعجنات والدقيق فحلال مختلفة عن الدم في الاسم والخصائص والصفات فليس لها حكمه. وأما الاستهلاك فرأى تأجيله لمزيد بحث. وأوصى بالاستفادة من جلود وعظام الحيوانات المذكاة لاستخراج الجيلاتين المستخدم في الغذاء والدواء حفاظًا على الثروة الوطنية وتجنبًا لشبهات المصادر غير المقبولة؛ ودعا المسؤولين في البلاد الإسلامية لمراعاة الشروط والمواصفات المقبولة شرعًا في الصناعة الدوائية والغذائية من المواد الخام وطرق التحضير؛ وإلزامهم الشركات المنتجة والمستوردة للأغذية المحفوظة ببيان التركيب التفصيلي لكل عبوة بوضوح وباللغة الوطنية؛ وطلب من المنظمة الإسلامية للعلوم الطبية متابعة الجديد في الغذاء والدواء وعقد ندوة بالتعاون مع المجمع لدراسة المستجدات وبيان حكمها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013), after reviewing the recommendations of the juristic-medical seminar held by the Islamic Organisation for Medical Sciences in Kuwait with the Academy and the Hassan II Foundation, ISESCO and the WHO regional office (Casablanca 1418/1997). It ruled that every Muslim must observe the rulings of the sharia in food and medicine to realise the wholesomeness of his food, drink and treatment, and that of God's mercy is regard for necessity and need, among the established principles: necessities permit the forbidden, need ranks as necessity whether general or specific, the default of benefits is permissibility unless reliable evidence of prohibition exists, the default of things is purity unless reliable evidence of impurity exists, and forbidding eating or drinking a thing is not a ruling of its legal impurity. Forbidden or impure substances, in themselves or as additives in food and medicine, become lawful by one of two ways. Istihala, in juristic usage: the change of the reality of an impure or forbidden substance and the turning of its substance into another differing in name, properties and attributes — expressed scientifically as every complete chemical reaction, such as converting oils and fats into soap or decomposing a substance into components like breaking fats into fatty acids and glycerine; it occurs by technical means and unperceived means such as pickling, tanning and burning, while a partial reaction is not istihala and an impure substance stays as is, impermissible to use. Accordingly: additive compounds of forbidden or impure animal origin in which istihala is realised are pure, and consuming them is lawful; compounds extracted from impure or forbidden sources such as shed blood or sewage water without realised istihala may not be used — blood-stuffed sausages, black pudding, bloodied hamburgers, blood-containing children's food, blood pastes and blood soup are impure forbidden food; while blood plasma — the cheap substitute for egg white used in pastries, soups, sausages, hamburgers, baked goods, flour, dairy products and children's foods and medicines — is lawful, differing from blood in name, properties and attributes and not taking its ruling. Istihlak the Academy deferred for further research. It recommended using the skins and bones of properly slaughtered animals for gelatin used in food and medicine, preserving national wealth and avoiding doubts about unacceptable sources; called on officials in Islamic states to observe legally acceptable conditions and specifications in pharmaceutical and food industry in raw materials and preparation; oblige them to require producers and importers of preserved foods to state the detailed composition of each package clearly in the national language; and asked the Islamic Organisation for Medical Sciences to track new developments in food and medicine and hold a seminar with the Academy to study them and state their rulings."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں — اسلامی آرگنائزیشن فار میڈیکل سائنسز کویت کی جانب سے اکیڈمی، حسن ثانی فاؤنڈیشن، ایسسیسکو اور عالمی ادارۂ صحت کے علاقائی دفتر کی شرکت سے منعقدہ فقہی-طبی سیمینار ⁦(کازابلانکا 1418ھ/1997ء)⁩ کی سفارشات کے جائزے کے بعد۔ اکیڈمی نے فیصلہ دیا کہ ہر مسلمان کو خوراک اور ادویہ میں شریعت کے احکام کی پابندی کرنی چاہیے تاکہ اس کا کھانا، پینا اور علاج پاکیزہ ہو، اور اللہ کی رحمت میں ضرورت اور حاجت کا لحاظ ہے جن مقررہ اصولوں میں شامل: ضرورتیں ممنوع کو جائز کرتی ہیں، حاجت ضرورت کے مرتبے رکھتی ہے عام ہو یا خاص، مفید چیزوں میں اصل اباحت ہے جب تک معتبر دلیل حرمت پر نہ ہو، چیزوں میں اصل طہارت ہے جب تک معتبر دلیل نجاست پر نہ ہو، اور کسی چیز کے کھانے یا پینے کی ممانعت اس کے شرعاً نجس ہونے کا حکم نہیں۔ حرام یا نجس اجزاء — اپنی ذات میں یا خوراک و دوا میں اضافے کی صورت میں — دو طریقوں میں سے ایک سے حلال ہو جاتے ہیں۔ استحالہ فقہی اصطلاح میں: نجس یا حرام مادے کی حقیقت کا بدلنا اور اس کا دوسرے مادے میں — نام، خصوصیات اور صفات میں مختلف — ڈھل جانا؛ سائنسی اصطلاح میں ہر مکمل کیمیائی تعامل جیسے تیل و چربی کا صابن بننا یا مادے کا اجزاء میں ٹوٹنا جیسے چربی کا فیٹی ایسڈ اور گلیسرین میں بکھرنا؛ یہ فنی اور غیر مرئی ذرائع جیسے اچار، چمڑا کاما اور جلانا سے بھی ہوتا ہے، جبکہ جزوی تعامل استحالہ نہیں اور نجس مادہ اپنی حالت پر رہ کر استعمال کے لیے حرام رہتا ہے۔ اس پر مبنی: حرام یا نجس حیوانی اصل کے وہ اضافی مرکبات جن میں استحالہ واقع ہو وہ پاک ہیں اور کھانا حلال؛ نجس یا حرام اصولوں سے نکالے گئے مرکبات جیسے بہایا ہوا خون یا گٹر کا پانی جن میں استحالہ نہ ہو استعمال جائز نہیں — خون بھرے ساسیج، بلیک پڈنگ، خون والا ہیمبرگر، خون والی بچوں کی خوراک اور خون کا سوپ نجس حرام خوراک ہیں؛ جبکہ خون کی پلازما — انڈے کی سفیدی کا سستا متبادل جو پیسٹری، سوپ، ساسیج، بیکڈ سامان، آٹے، دودھ کی مصنوعات اور بچوں کی خوراک و ادویہ میں استعمال ہوتی ہے — حلال ہے کیونکہ وہ نام، خصوصیات اور صفات میں خون سے مختلف ہے اور اس کا حکم نہیں رکھتی۔ استہلاک کو اکیڈمی نے مزید تحقیق کے لیے مؤجل کیا۔ سفارشات: حلال ذبح شدہ جانوروں کی کھال اور ہڈیوں سے خوراک و دوا میں استعمال ہونے والا جیلیٹن نکالنا — قومی دولت کی حفاظت اور نامقبول ماخذات کے شبہات سے بچنے کے لیے؛ اسلامی ممالک کے ذمہ داران سے صنعتِ دوا و خوراک میں خام مال اور تیاری کے طریقوں میں شرعاً قابلِ قبول شرائط و معیارات کی رعایت کی اپیل؛ انہیں محفوظ خوراک کی پیدا کرنے اور درآمد کرنے والی کمپنیوں پر ہر پیکج کی تفصیلی ترکیب کو واضح طور پر قومی زبان میں لکھنا لازم کرنے کی ہدایت؛ اور اسلامی آرگنائزیشن فار میڈیکل سائنسز سے خوراک و دوا کی جدتوں کی پیروی اور اکیڈمی کے ساتھ سیمینار کر کے ان کے احکام بیان کرنے کی درخواست۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica en su 21.ª sesión en Riad (15-19 de Muharram de 1435, 18-22 de noviembre de 2013), tras revisar las recomendaciones del seminario jurídico-médico celebrado por la Organización Islámica para las Ciencias Médicas en Kuwait con la Academia y la Fundación Hassan II, ISESCO y la oficina regional de la OMS (Casablanca 1418/1997). Dictaminó que todo musulmán debe observar las normas de la sharia en materia de alimentación y medicina para lograr la salubridad de sus alimentos, bebidas y tratamientos, y que la misericordia de Dios es el respeto a la necesidad, entre los principios establecidos: las necesidades permiten lo prohibido, la necesidad se clasifica como necesidad ya sea general o específica, la permisibilidad por defecto de los beneficios es permisible a menos que exista evidencia fiable de prohibición, la pureza por defecto de las cosas a menos que exista evidencia fiable de impureza, y prohibir comer o beber algo no es una norma sobre su impureza legal. Las sustancias prohibidas o impuras, en sí mismas o como aditivos en alimentos y medicamentos, se vuelven lícitas de dos maneras. Istihala, en uso jurídico: el cambio de la realidad de una sustancia impura o prohibida y la transformación de su sustancia en otra que difiere en nombre, propiedades y atributos, expresado científicamente como toda reacción química completa, como convertir aceites y grasas en jabón o descomponer una sustancia en componentes como romper grasas en ácidos grasos y glicerina; ocurre por medios técnicos y medios no percibidos como el encurtido, el curtido y la combustión, mientras que una reacción parcial no es istihala y una sustancia impura permanece como es, no admisible para usar. En consecuencia: los compuestos aditivos de origen animal prohibido o impuro en los que se realiza istihala son puros y su consumo es lícito; Los compuestos extraídos de fuentes impuras o prohibidas, como sangre derramada o aguas residuales, sin istihala realizada, no pueden usarse: salchichas rellenas de sangre, morcilla, hamburguesas sangrientas, alimentos para niños que contienen sangre, pastas de sangre y sopa de sangre son alimentos impuros prohibidos; mientras que el plasma sanguíneo, el sustituto barato de la clara de huevo utilizado en pasteles, sopas, salchichas, hamburguesas, productos horneados, harina, productos lácteos y alimentos y medicamentos para niños, es lícito, diferenciándose de la sangre en nombre, propiedades y atributos y no siguiendo su norma. La Academia de Istihlak aplazó para una investigación más profunda. Recomendó utilizar las pieles y los huesos de animales debidamente sacrificados para la gelatina utilizada en alimentos y medicina, preservando la riqueza nacional y evitando dudas sobre fuentes inaceptables; instó a los funcionarios de los estados islámicos a observar las condiciones y especificaciones legalmente aceptables en la industria farmacéutica y alimentaria en materias primas y preparación; los obligó a exigir a los productores e importadores de alimentos en conserva que indiquen la composición detallada de cada paquete claramente en el idioma nacional; y solicitó a la Organización Islámica de Ciencias Médicas que hiciera un seguimiento de los nuevos avances en alimentación y medicina y que celebrara un seminario con la Academia para estudiarlos y establecer sus dictámenes."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 21e session à Riyad (15-19 Muharram 1435, 18-22 novembre 2013), après examen des recommandations du séminaire juridico-médical organisé par l'Organisation islamique des sciences médicales au Koweït, en collaboration avec l'Académie, la Fondation Hassan II, l'ISESCO et le bureau régional de l'OMS (Casablanca 1418/1997), stipule que tout musulman doit observer les préceptes de la charia en matière d'alimentation et de médecine afin de garantir la salubrité de son alimentation, de ses boissons et de ses traitements. Elle rappelle que, par miséricorde divine, il convient de tenir compte de la nécessité et du besoin. Parmi les principes établis, on trouve: la nécessité autorise l'interdit; le besoin est assimilable à la nécessité, qu'il soit général ou spécifique; le bénéfice est licite sauf preuve fiable d'interdiction; la pureté est présumée sauf preuve fiable d'impureté; et interdire de consommer une chose ne signifie pas qu'elle est licite. Les substances interdites ou impures, qu'elles soient utilisées seules ou comme additifs alimentaires ou pharmaceutiques, deviennent licites de deux manières. L'istihala, en droit, désigne la transformation d'une substance impure ou interdite en une autre, différente par son nom, ses propriétés et ses attributs. Scientifiquement, cela correspond à toute réaction chimique complète, comme la transformation des huiles et des graisses en savon ou la décomposition d'une substance en ses composants, par exemple la décomposition des graisses en acides gras et en glycérine. Ce processus s'effectue par des moyens techniques et non perceptibles, tels que le saumurage, le tannage et la combustion. En revanche, une réaction partielle n'est pas istihala et la substance impure demeure inchangée, inutilisable. Par conséquent, les composés additifs d'origine animale, interdits ou impurs, dans lesquels l'istihala est réalisée, sont purs et leur consommation est licite. Les composés extraits de sources impures ou interdites, comme le sang versé ou les eaux usées, sans istihlak (purification rituelle), ne peuvent être utilisés. Les saucisses fourrées au sang, le boudin noir, les hamburgers saignants, les aliments pour enfants contenant du sang, les pâtes de sang et la soupe de sang sont considérés comme des aliments impurs et interdits. En revanche, le plasma sanguin, substitut bon marché du blanc d'œuf utilisé dans les pâtisseries, les soupes, les saucisses, les hamburgers, les produits de boulangerie, la farine, les produits laitiers, les aliments pour enfants et les médicaments, est licite, différant du sang par son nom, ses propriétés et ses attributs, et n'étant pas soumis à la même réglementation. L'Académie a reporté la question de l'istihlak pour des recherches complémentaires. Elle a recommandé l'utilisation de la peau et des os d'animaux abattus selon le rite pour la gélatine alimentaire et pharmaceutique, afin de préserver les richesses nationales et d'éviter tout doute quant à l'origine des produits. Elle a appelé les autorités des États islamiques à respecter les conditions et spécifications légales dans les industries pharmaceutique et alimentaire, tant au niveau des matières premières que de la préparation. Elle les a également obligées à exiger des producteurs et importateurs de produits alimentaires conservés qu'ils indiquent clairement la composition détaillée de chaque emballage dans la langue nationale. et a demandé à l'Organisation islamique des sciences médicales de suivre les nouveaux développements en matière d'alimentation et de médecine et d'organiser un séminaire avec l'Académie pour les étudier et énoncer leurs avis."
  tr: "Uluslararası İslami Fiqh Akademisi'nin yirmi birinci oturumunda (15–19 Muharrem 1435H, 18–22 Kasım 2013) Kuveyt'teki İslami Tıp Bilimleri Örgütü tarafından Akademi iş birliğiyle düzenlenen tıp hukuku sempozyumunun önerilerinin incelenmesi sonrası, Hasan II Vakfı, ICESCO ve Dünya Sağlık Örgütü Bölgesel Ofisi'nin katılımıyla (Casablanca 1418H/1997) toplu kararı olarak kabul edilmiştir. Her Müslümanın, yiyecek, içecek ve tedavinin iyiliğini sağlamak için yiyecek ve ilaçlarla ilgili Şeriat kurallarına uyması gerektiği belirlenmiştir. Zorunluluk ve ihtiyaca uymak Allah'ın merhametinden kaynaklanır. Yerleşik ilkeler arasında şunlar vardır: gereklilikler yasaklara izin verir ve zorunluluk genel veya özel olarak zorunluluk statüsüne iner. Faydalardaki temerrüt, yasak olduğuna dair sağlam kanıt yoksa kabul edilebilirliktir; bir şeylerin varsayılan olması ise saflıktır, eğer sağlam bir kirlilik kanıtı yoksa. Bir şeyi yemek veya içmek yasak, İslam hukukuna göre onun kirliliğinin hükmü olarak kabul edilmez. Yasaklanmış veya saf olmayan maddeler kendi başlarına veya gıda ve ilaçlara eklenerek iki şekilde kabul edilebilir: imkansızlık, hukuk terminolojisinde, kirli veya yasak maddenin gerçekliğinin değiştirilmesi ve isim, özellik ve nitelikler açısından farklı başka bir maddeye dönüşmesidir. Bu, yağların sabuna dönüştürülmesi ve maddenin bileşenlerine çözülmesi gibi tam kimyasal reaksiyonla bilimsel olarak ifade edilir; örneğin yağların yağ asitlerine ve gliserine parçalanması gibi. Bu, geçirgenlik, tabaklama ve yakma gibi bilimsel ve görünmez şekilde gerçekleşir. Kısmi reaksiyonlar ise imkansız değildir; kirli madde değişmeden kalır ve kullanılamaz. Buna göre: imkansızlığı kanıtlanmış yasak veya kirli hayvansal kökenli ek bileşikler saftır ve tüketimi helaldir; saf veya yasak kökenlerden çıkarılan bileşikler, örneğin dökülen kan veya imkansızlık sağlanamayan kanalizasyon suyu gibi, kanla doldurulmuş sosisler, kanlı lapalar, kanlı hamburgerler, kan içeren bebek mamaları ve kan çorbası gibi saf yasak yiyecekler gibi bileşikler kullanılamaz; yumurta akı yerine ucuz kan plazması ise turta, çorba, sosis, hamur işi ve unda kullanılır; isim, özellik ve nitelikler bakımından kandan helal olup bir hükümleri yoktur. Tüketim konusunda, daha fazla araştırma için ertelenmiştir. Ulusal serveti korumak ve kabul edilemez kaynaklardan kaçınmak için gıda ve ilaçta kullanılan jelatin çıkarımında canlı hale getirilen hayvanların deri ve kemiklerinin kullanılmasını tavsiye etti; İslam ülkelerindeki yetkilileri, ilaç ve gıda endüstrisinde hammadde ve hazırlama yöntemleriyle ilgili yasal kabul görmüş şartlara ve şartnamelere uymaya çağırdı; korunmuş gıdaları üreten ve ithal eden şirketlerin her paketin ayrıntılı bileşimini ulusal dilde açıkça açıklamalarını talep etti; ve İslam Tıp Bilimleri Örgütü'nden gıda ve tıptaki son gelişmeleri takip etmesini ve Akademi ile iş birliği içinde bir seminer düzenlemesini talep etti; gelişmeleri incelemek ve kararlarını netleştirmek için bir seminer düzenlemesini istedi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi kedua puluh satu di Riyadh (15–19 Muharram 1435H, 18–22 November 2013) setelah meninjau rekomendasi simposium yurisprudensi medis yang diadakan oleh Organisasi Islam untuk Ilmu Kedokteran di Kuwait bekerja sama dengan Akademi, dengan partisipasi Yayasan Hassan II, ICESCO, dan Kantor Regional Organisasi Kesehatan Dunia (Casablanca 1418H/1997). Ditetapkan bahwa setiap Muslim harus mematuhi aturan Syariah mengenai makanan dan obat-obatan untuk memastikan kebaikan makanan, minuman, dan pengobatan mereka. Atas rahmat Allah untuk mematuhi kebutuhan dan kebutuhan. Di antara prinsip-prinsip yang telah ditetapkan adalah: kebutuhan memungkinkan pelarangan dan kebutuhan turun ke status kebutuhan secara umum atau khusus. Ketidakberpihakan dalam manfaat adalah diperbolehkan kecuali ada bukti kuat larangan, dan kelalaian untuk sesuatu adalah kemurnian kecuali ada bukti kuat ketidakmurnian. Larangan makan atau minum sesuatu tidak dianggap sebagai aturan atas kemurnian itu menurut hukum Islam. Zat terlarang atau tidak murni secara mandiri atau dengan penambahannya dalam makanan dan obat-obatan menjadi diperbolehkan dalam dua cara: ketidakmungkinan, dalam istilah yurisprudensi, adalah perubahan realitas zat yang tidak murni atau terlarang dan transformasinya menjadi zat lain yang berbeda dalam nama, sifat, dan atribut. Hal ini secara ilmiah diekspresikan melalui reaksi kimia lengkap seperti mengubah minyak menjadi sabun dan melarutkan zat menjadi komponennya, seperti memecah lemak menjadi asam lemak dan gliserin. Hal ini terjadi secara ilmiah dan tak terlihat, seperti permeabilitas, penyamakan, dan pembakaran. Adapun reaksi parsial, hal ini tidak mustahil; zat yang tidak murni tetap tidak berubah dan tidak dapat digunakan. Dengan demikian: senyawa tambahan yang berasal dari hewan terlarang atau tidak murni yang terbukti mustahil adalah murni dan konsumsinya halal; senyawa yang diekstraksi dari sumber yang tidak murni atau terlarang, seperti darah yang tumpah atau air limbah di mana tidak mungkin tercapai, tidak diperbolehkan digunakan, seperti sosis yang diisi darah, bubur berdarah, hamburger berdarah, makanan bayi yang mengandung darah, dan sup darah, yang merupakan makanan terlarang yang tidak murni; sedangkan untuk plasma darah murah sebagai pengganti putih telur, yang digunakan dalam pai, sup, sosis, kue, dan tepung, mereka halal berbeda dari darah dalam nama, karakteristik, dan atribut dan tidak memiliki keputusan. Adapun konsumsi, ia melihatnya ditunda untuk penelitian lebih lanjut. Dewan merekomendasikan penggunaan kulit dan tulang hewan yang dihidupkan untuk mengekstrak gelatin yang digunakan dalam makanan dan obat-obatan guna menjaga kekayaan nasional dan menghindari kecurigaan sumber yang tidak dapat diterima; Dewan meminta pejabat di negara-negara Islam untuk mematuhi ketentuan dan spesifikasi yang diterima secara hukum di industri farmasi dan pangan terkait bahan baku dan metode persiapan; mewajibkan perusahaan yang memproduksi dan mengimpor makanan awetan untuk menjelaskan secara jelas komposisi rinci setiap kemasan dalam bahasa nasional; dan meminta Organisasi Islam untuk Ilmu Kedokteran untuk menindaklanjuti perkembangan terbaru di bidang pangan dan kedokteran serta mengadakan seminar bekerja sama dengan Akademi guna mempelajari perkembangan dan memperjelas keputusannya."
