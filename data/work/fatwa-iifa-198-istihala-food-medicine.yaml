label: { ar: "قرار مجمع الفقه الإسلامي الدولي 198 (21/4) بشأن الاستحالة والاستهلاك والمواد الإضافية في الغذاء والدواء", en: "IIFA resolution 198 (21/4) on istihala (transformation), istihlak and additive substances in food and medicine", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 198 (21/4): خوراک اور ادویہ میں استحالہ، استہلاک اور اضافی اجزاء" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الحادية والعشرين بالرياض ⁦(15–19 محرم 1435هـ، 18–22 نوفمبر 2013م)⁩ بعد اطلاعه على توصيات الندوة الفقهية الطبية التي عقدتها المنظمة الإسلامية للعلوم الطبية بالكويت بالتعاون مع المجمع وبمشاركة مؤسسة الحسن الثاني والإيسيسكو والمكتب الإقليمي لمنظمة الصحة العالمية ⁦(الدار البيضاء 1418هـ/1997م)⁩. قرر أنه يجب على كل مسلم الالتزام بأحكام الشريعة في الغذاء والدواء تحقيقًا لطيب مطعمه ومشربه وعلاجه، وأن من رحمة الله مراعاة الضرورة والحاجة ومن المبادئ المقررة: الضرورات تبيح المحظورات، والحاجة تنزل منزلة الضرورة عامة أو خاصة، والأصل في المنافع الإباحة ما لم يقم دليل معتبر على الحرمة، والأصل في الأشياء الطهارة ما لم يقم دليل معتبر على النجاسة، ولا يعد تحريم أكل الشيء أو شربه حكمًا بنجاسته شرعًا. وأن المواد المحرمة أو النجسة بذاتها أو بإضافتها في الغذاء والدواء تنقلب مباحة بإحدى طريقتين: الاستحالة وهي في الاصطلاح الفقهي تغير حقيقة المادة النجسة أو المحرم تناولها وانقلاب عينها إلى مادة أخرى مختلفة في الاسم والخصائص والصفات ويعبر عنها علميًا بكل تفاعل كيميائي كامل كتحويل الزيوت إلى صابون وتحلل المادة إلى مكوناتها كتفكيك الدهون إلى أحماض دسمة وغليسرين، ويحصل بالوسائل العلمية وبصورة غير منظورة كالتخلل والدباغة والإحراق، وأما التفاعل الجزئي فليس استحالة فتبقى النجسة على حالها ولا يجوز استخدامها. وبناء على ذلك: المركبات الإضافية ذات الأصل الحيواني المحرم أو النجس المتحققة فيها الاستحالة طاهرة وتناولها حلال؛ والمركبات المستخرجة من أصول نجسة أو محرمة كالدم المسفوح أو مياه المجاري التي لم تتحقق فيها الاستحالة لا يجوز استخدامها كالنقانق المحشوة بالدم والعصائد المدماة والهامبرجر المدمى وأغذية الأطفال المحتوية دمًا وحساء الدم وهي طعام نجس محرم؛ وأما بلازما الدم البديل الرخيص لزلال البيض المستخدمة في الفطائر والحساء والنقانق والمعجنات والدقيق فحلال مختلفة عن الدم في الاسم والخصائص والصفات فليس لها حكمه. وأما الاستهلاك فرأى تأجيله لمزيد بحث. وأوصى بالاستفادة من جلود وعظام الحيوانات المذكاة لاستخراج الجيلاتين المستخدم في الغذاء والدواء حفاظًا على الثروة الوطنية وتجنبًا لشبهات المصادر غير المقبولة؛ ودعا المسؤولين في البلاد الإسلامية لمراعاة الشروط والمواصفات المقبولة شرعًا في الصناعة الدوائية والغذائية من المواد الخام وطرق التحضير؛ وإلزامهم الشركات المنتجة والمستوردة للأغذية المحفوظة ببيان التركيب التفصيلي لكل عبوة بوضوح وباللغة الوطنية؛ وطلب من المنظمة الإسلامية للعلوم الطبية متابعة الجديد في الغذاء والدواء وعقد ندوة بالتعاون مع المجمع لدراسة المستجدات وبيان حكمها."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 21st session in Riyadh (15–19 Muharram 1435, 18–22 November 2013), after reviewing the recommendations of the juristic-medical seminar held by the Islamic Organisation for Medical Sciences in Kuwait with the Academy and the Hassan II Foundation, ISESCO and the WHO regional office (Casablanca 1418/1997). It ruled that every Muslim must observe the rulings of the sharia in food and medicine to realise the wholesomeness of his food, drink and treatment, and that of God's mercy is regard for necessity and need, among the established principles: necessities permit the forbidden, need ranks as necessity whether general or specific, the default of benefits is permissibility unless reliable evidence of prohibition exists, the default of things is purity unless reliable evidence of impurity exists, and forbidding eating or drinking a thing is not a ruling of its legal impurity. Forbidden or impure substances, in themselves or as additives in food and medicine, become lawful by one of two ways. Istihala, in juristic usage: the change of the reality of an impure or forbidden substance and the turning of its substance into another differing in name, properties and attributes — expressed scientifically as every complete chemical reaction, such as converting oils and fats into soap or decomposing a substance into components like breaking fats into fatty acids and glycerine; it occurs by technical means and unperceived means such as pickling, tanning and burning, while a partial reaction is not istihala and an impure substance stays as is, impermissible to use. Accordingly: additive compounds of forbidden or impure animal origin in which istihala is realised are pure, and consuming them is lawful; compounds extracted from impure or forbidden sources such as shed blood or sewage water without realised istihala may not be used — blood-stuffed sausages, black pudding, bloodied hamburgers, blood-containing children's food, blood pastes and blood soup are impure forbidden food; while blood plasma — the cheap substitute for egg white used in pastries, soups, sausages, hamburgers, baked goods, flour, dairy products and children's foods and medicines — is lawful, differing from blood in name, properties and attributes and not taking its ruling. Istihlak the Academy deferred for further research. It recommended using the skins and bones of properly slaughtered animals for gelatin used in food and medicine, preserving national wealth and avoiding doubts about unacceptable sources; called on officials in Islamic states to observe legally acceptable conditions and specifications in pharmaceutical and food industry in raw materials and preparation; oblige them to require producers and importers of preserved foods to state the detailed composition of each package clearly in the national language; and asked the Islamic Organisation for Medical Sciences to track new developments in food and medicine and hold a seminar with the Academy to study them and state their rulings."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، ریاض میں اکیسویں مجلس ⁦(15–19 محرم 1435ھ، 18–22 نومبر 2013ء)⁩ میں — اسلامی آرگنائزیشن فار میڈیکل سائنسز کویت کی جانب سے اکیڈمی، حسن ثانی فاؤنڈیشن، ایسسیسکو اور عالمی ادارۂ صحت کے علاقائی دفتر کی شرکت سے منعقدہ فقہی-طبی سیمینار ⁦(کازابلانکا 1418ھ/1997ء)⁩ کی سفارشات کے جائزے کے بعد۔ اکیڈمی نے فیصلہ دیا کہ ہر مسلمان کو خوراک اور ادویہ میں شریعت کے احکام کی پابندی کرنی چاہیے تاکہ اس کا کھانا، پینا اور علاج پاکیزہ ہو، اور اللہ کی رحمت میں ضرورت اور حاجت کا لحاظ ہے جن مقررہ اصولوں میں شامل: ضرورتیں ممنوع کو جائز کرتی ہیں، حاجت ضرورت کے مرتبے رکھتی ہے عام ہو یا خاص، مفید چیزوں میں اصل اباحت ہے جب تک معتبر دلیل حرمت پر نہ ہو، چیزوں میں اصل طہارت ہے جب تک معتبر دلیل نجاست پر نہ ہو، اور کسی چیز کے کھانے یا پینے کی ممانعت اس کے شرعاً نجس ہونے کا حکم نہیں۔ حرام یا نجس اجزاء — اپنی ذات میں یا خوراک و دوا میں اضافے کی صورت میں — دو طریقوں میں سے ایک سے حلال ہو جاتے ہیں۔ استحالہ فقہی اصطلاح میں: نجس یا حرام مادے کی حقیقت کا بدلنا اور اس کا دوسرے مادے میں — نام، خصوصیات اور صفات میں مختلف — ڈھل جانا؛ سائنسی اصطلاح میں ہر مکمل کیمیائی تعامل جیسے تیل و چربی کا صابن بننا یا مادے کا اجزاء میں ٹوٹنا جیسے چربی کا فیٹی ایسڈ اور گلیسرین میں بکھرنا؛ یہ فنی اور غیر مرئی ذرائع جیسے اچار، چمڑا کاما اور جلانا سے بھی ہوتا ہے، جبکہ جزوی تعامل استحالہ نہیں اور نجس مادہ اپنی حالت پر رہ کر استعمال کے لیے حرام رہتا ہے۔ اس پر مبنی: حرام یا نجس حیوانی اصل کے وہ اضافی مرکبات جن میں استحالہ واقع ہو وہ پاک ہیں اور کھانا حلال؛ نجس یا حرام اصولوں سے نکالے گئے مرکبات جیسے بہایا ہوا خون یا گٹر کا پانی جن میں استحالہ نہ ہو استعمال جائز نہیں — خون بھرے ساسیج، بلیک پڈنگ، خون والا ہیمبرگر، خون والی بچوں کی خوراک اور خون کا سوپ نجس حرام خوراک ہیں؛ جبکہ خون کی پلازما — انڈے کی سفیدی کا سستا متبادل جو پیسٹری، سوپ، ساسیج، بیکڈ سامان، آٹے، دودھ کی مصنوعات اور بچوں کی خوراک و ادویہ میں استعمال ہوتی ہے — حلال ہے کیونکہ وہ نام، خصوصیات اور صفات میں خون سے مختلف ہے اور اس کا حکم نہیں رکھتی۔ استہلاک کو اکیڈمی نے مزید تحقیق کے لیے مؤجل کیا۔ سفارشات: حلال ذبح شدہ جانوروں کی کھال اور ہڈیوں سے خوراک و دوا میں استعمال ہونے والا جیلیٹن نکالنا — قومی دولت کی حفاظت اور نامقبول ماخذات کے شبہات سے بچنے کے لیے؛ اسلامی ممالک کے ذمہ داران سے صنعتِ دوا و خوراک میں خام مال اور تیاری کے طریقوں میں شرعاً قابلِ قبول شرائط و معیارات کی رعایت کی اپیل؛ انہیں محفوظ خوراک کی پیدا کرنے اور درآمد کرنے والی کمپنیوں پر ہر پیکج کی تفصیلی ترکیب کو واضح طور پر قومی زبان میں لکھنا لازم کرنے کی ہدایت؛ اور اسلامی آرگنائزیشن فار میڈیکل سائنسز سے خوراک و دوا کی جدتوں کی پیروی اور اکیڈمی کے ساتھ سیمینار کر کے ان کے احکام بیان کرنے کی درخواست۔"
