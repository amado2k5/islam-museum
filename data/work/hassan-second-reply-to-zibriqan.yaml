label: { ar: "قصيدة حسان «هل المجد إلا السؤدد العود والندى» في الرد على الزبرقان", en: "Hassan ibn Thabit's second reply to al-Zibriqan, 'Is glory anything but ancient lordship and bounty?'" }
summary:
  ar: "قصيدة على روي الميم يرويها ابن هشام لحسان جواباً على أبيات الزبرقان الثانية: نصرة الأنصار النبي وإيواؤه، وبذل أبنائهم وبناتهم دونه، وضربهم الناس حتى تتابعوا على دينه، وأنهم ولدوا من قريش عظيمها، ثم نهي بني دارم عن الفخر لأنهم خول للأنصار ما بين ظئر وخادم، ودعوتهم إلى الإسلام."
  en: "A mim-rhymed poem Ibn Hisham reports as Hassan's answer to al-Zibriqan's second verses: the Ansar's sheltering and defence of the Prophet, their sons and daughters placed before him, their fighting until people followed his religion, their kinship to Quraysh's greatest, then a rebuke to Banu Darim not to boast since they are the Ansar's dependants, and a call to embrace Islam."
