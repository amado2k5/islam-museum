label: { ar: "قصيدة حسان «هل المجد إلا السؤدد العود والندى» في الرد على الزبرقان", en: "Hassan ibn Thabit's second reply to al-Zibriqan, 'Is glory anything but ancient lordship and bounty?'", es: "La segunda respuesta de Hassan ibn Thabit a al-Zibriqan fue: \"¿Acaso la gloria es otra cosa que antiguo señorío y generosidad?\"." }
summary:
  ar: "قصيدة على روي الميم يرويها ابن هشام لحسان جواباً على أبيات الزبرقان الثانية: نصرة الأنصار النبي وإيواؤه، وبذل أبنائهم وبناتهم دونه، وضربهم الناس حتى تتابعوا على دينه، وأنهم ولدوا من قريش عظيمها، ثم نهي بني دارم عن الفخر لأنهم خول للأنصار ما بين ظئر وخادم، ودعوتهم إلى الإسلام."
  en: "A mim-rhymed poem Ibn Hisham reports as Hassan's answer to al-Zibriqan's second verses: the Ansar's sheltering and defence of the Prophet, their sons and daughters placed before him, their fighting until people followed his religion, their kinship to Quraysh's greatest, then a rebuke to Banu Darim not to boast since they are the Ansar's dependants, and a call to embrace Islam."
  es: "Un poema con rima mímica que Ibn Hisham relata como la respuesta de Hassan a los segundos versos de al-Zibriqan: el amparo y la defensa del Profeta por parte de los Ansar, sus hijos e hijas puestos delante de él, su lucha hasta que la gente siguió su religión, su parentesco con los más grandes de Quraysh, luego una reprimenda a Banu Darim para que no se jacten ya que son dependientes de los Ansar, y un llamado a abrazar el Islam."
