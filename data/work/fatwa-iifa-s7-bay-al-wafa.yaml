summary:
  ar: "قرار مجمع الفقه الإسلامي الدولي في دورته السابعة ⁦(مكة، مايو 1992م)⁩ بشأن بيع الوفاء: حقيقته قرض جَرَّ نفعًا فهو تحايل على الربا وبعدم صحته قال جمهور العلماء، فهذا العقد غير جائز شرعًا."
  en: "IIFA's seventh-session resolution (Mecca, May 1992) on bay' al-wafa (the 'faithful sale' where the seller may repurchase on returning the price): its reality is a loan drawing a benefit, hence a stratagem upon riba, and most scholars held it invalid — the contract is impermissible in the sharia."
  ur: "اکیڈمی کی ساتویں مجلس کی قرارداد ⁦(مکہ، مئی 1992ء)⁩ بیع وفا پر: یہ درحقیقت نفع کھینچنے والا قرض اور ربا کی ہوکس ہے؛ اکثریت علماء نے باطل کہا — ناجائز۔"
  es: "Resolución de la séptima sesión de la IIFA (La Meca, mayo de 1992) sobre bay' al-wafa (la 'venta fiel' en la que el vendedor puede recomprar al devolver el precio): su realidad es un préstamo que genera un beneficio, por lo tanto, una estratagema basada en la riba, y la mayoría de los eruditos la consideraron inválida: el contrato no está permitido en la sharia."
