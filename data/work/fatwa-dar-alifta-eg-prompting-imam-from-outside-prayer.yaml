id: work/fatwa-dar-alifta-eg-prompting-imam-from-outside-prayer
class: work
kind: fatwa
label: { ar: "حكم الفتح على المصلي من شخص خارج الصلاة", en: "May someone outside the prayer prompt the imam?", ur: "نماز سے باہر شخص کا امام کو تلقین کرنا", es: "¿Puede alguien ajeno a la oración hacer preguntas al imán?", fr: "Une personne extérieure à la prière peut-elle interpeller l'imam ?" }
summary:
  ar: "سائل سأل عمن هو خارج الصلاة يفتح على الإمام إذا أخطأ في قراءته ولم يفتح عليه أحد من المأمومين. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 21604)⁩ أنه يجوز لمن هو خارج الصلاة أن يفتح على الإمام إذا أخطأ في قراءته على ما فصّل الجواب من ضوابطه."
  en: "A questioner asked about a person outside the prayer prompting the imam when he errs in recitation and none of the congregation prompts him. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 21604) answered that someone outside the prayer may prompt the imam when he errs — under the controls the answer sets out."
  ur: "ایک سائل نے پوچھا کہ اگر امام تلاوت میں غلطی کرے اور مقتدی تلقین نہ کریں تو کیا نماز سے باہر کوئی شخص تلقین کر سکتا ہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 21604)⁩ نے جواب دیا کہ باہر کا شخص امام کو تلقین کر سکتا ہے — جواب کے ضوابط کے ساتھ۔"
  es: "Un interlocutor preguntó sobre la posibilidad de que una persona ajena a la oración le indique al imán que recite las oraciones cuando este comete un error y nadie de la congregación lo hace. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 21604) respondió que alguien ajeno a la oración puede indicarle al imán que recite las oraciones cuando comete un error, de acuerdo con las normas que se detallan en la respuesta."
  fr: "Un fidèle a posé une question concernant la possibilité pour une personne extérieure à la prière de reprendre l'imam lorsqu'il se trompe dans sa récitation, en l'absence de toute autre intervention de l'assemblée. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 21604) a répondu qu'une personne extérieure à la prière peut reprendre l'imam en cas d'erreur, sous réserve des conditions énoncées dans la fatwa."
