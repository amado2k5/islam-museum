id: work/fatwa-aliftaa-jo-snuff-steam-and-vapour-rub-inhalation-while-fasting
class: work
kind: fatwa
label: { ar: "استعمال السعوط والتبخيرة واستنشاق الفكس في نهار رمضان", en: "Using snuff, steam inhalation or vapour rub in the day in Ramadan", ur: "رمضان کے دن میں نسوار، بھاپ اور ویپر رب کا استعمال", es: "Utilizar rapé, inhalación de vapor o ungüentos de vapor durante el día en Ramadán.", fr: "Utiliser du tabac à priser, des inhalations de vapeur ou des baumes vaporisateurs pendant la journée durant le Ramadan" }
summary:
  ar: "سؤال عن استعمال السعوط والتبخيرة واستنشاق الفكس في نهار رمضان، أجابت فيه دائرة الإفتاء العام الأردنية بأنها تفسد الصوم لأنها مواد تدخل بالاستنشاق إلى الرئتين، أما مجرد الرائحة التي لا يصل منها شيء إلى الجوف فلا تفطر. أجابت الدائرة بأن استعمال السعوط والتبخيرة والفكس في نهار رمضان يفسد الصوم، لأن هذه المستحضرات مواد تدخل بالاستنشاق إلى الرئتين، وهما من الجوف. وقالت إن على من استعملها الإمساك بقية اليوم لحرمة الشهر، والقضاء بعد رمضان. وأضافت أنها إن كانت مجرد رائحة لا يصل شيء من عينها إلى الجوف فلا تفطر."
  en: "A question about using snuff, steam inhalation or inhaling vapour rub in the day in Ramadan, in which Jordan's General Iftaa Department answered that they break the fast because they are substances inhaled into the lungs, while a mere scent of which no substance reaches the interior does not. The Department answered that using snuff, steam inhalation or vapour rub during the day in Ramadan invalidates the fast, because these preparations are substances that enter the lungs by inhalation, and the lungs are part of the body's interior. It said that whoever uses them must keep refraining from food and drink for the rest of the day out of respect for the month, and make the day up after Ramadan. It added that if it is only a scent, with none of the substance itself reaching the interior, it does not break the fast."
  ur: "رمضان کے دن میں نسوار، بھاپ لینے اور ویپر رب ⁦(وکس)⁩ سونگھنے کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ یہ روزہ توڑ دیتے ہیں کیونکہ یہ سانس کے ذریعے پھیپھڑوں تک جانے والے مادے ہیں، البتہ محض خوشبو جس کا کوئی جز جوف تک نہ پہنچے روزہ نہیں توڑتی۔ ڈیپارٹمنٹ نے جواب دیا کہ رمضان کے دن میں نسوار، بھاپ اور وکس کا استعمال روزہ فاسد کر دیتا ہے، کیونکہ یہ ایسے مادے ہیں جو سانس کے ذریعے پھیپھڑوں میں داخل ہوتے ہیں، اور پھیپھڑے جوف کا حصہ ہیں۔ اس نے کہا کہ جو انہیں استعمال کرے وہ مہینے کے احترام میں باقی دن کھانے پینے سے رکا رہے اور رمضان کے بعد قضا کرے۔ اس نے مزید کہا کہ اگر یہ محض خوشبو ہو اور اس کا کوئی جز جوف تک نہ پہنچے تو روزہ نہیں ٹوٹتا۔"
  es: "Una pregunta sobre el uso de rapé, inhalación de vapor o ungüentos para inhalar durante el día en Ramadán, a la que el Departamento General de Iftaa de Jordania respondió que rompen el ayuno porque son sustancias que se inhalan a los pulmones, mientras que un simple aroma, sin que la sustancia llegue al interior del cuerpo, no lo hace. El Departamento respondió que usar rapé, inhalación de vapor o ungüentos para inhalar durante el día en Ramadán invalida el ayuno, porque estas preparaciones son sustancias que entran a los pulmones por inhalación, y los pulmones son parte del interior del cuerpo. Dijo que quien los use debe abstenerse de comer y beber durante el resto del día por respeto al mes, y recuperar el día después de Ramadán. Añadió que si se trata solo de un aroma, sin que la sustancia llegue al interior del cuerpo, no rompe el ayuno."
  fr: "Une question concernant l'usage du tabac à priser, des inhalations de vapeur ou des baumes parfumés pendant la journée du Ramadan a été posée. Le Département général de la Iftaa en Jordanie a répondu que ces pratiques rompent le jeûne car il s'agit de substances inhalées, contrairement à une simple inhalation de parfum qui ne provoque pas de pénétration dans les poumons. Le Département a précisé que l'usage de ces produits pendant la journée du Ramadan invalide le jeûne, car ces préparations sont des substances qui pénètrent dans les poumons par inhalation, et les poumons font partie de l'organisme. Il a indiqué que toute personne qui en utilise doit s'abstenir de manger et de boire pour le reste de la journée par respect pour le mois sacré et rattraper ce jour après le Ramadan. Il a ajouté que si l'on ne respire qu'un parfum, sans qu'aucune substance n'atteigne l'intérieur du corps, cela ne rompt pas le jeûne."
