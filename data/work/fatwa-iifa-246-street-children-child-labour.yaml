id: work/fatwa-iifa-246-street-children-child-labour
class: work
kind: fatwa
label: { ar: "قرار مجمع الفقه الإسلامي الدولي 246 (25/8) بشأن رؤية شرعية لمعالجة ظاهرة أطفال الشوارع والأطفال المتسولين والأطفال العاملين في الأعمال الشاقة", en: "IIFA resolution 246 (25/8) on a sharia approach to street children, child beggars and children in hard labour", ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی قرارداد 246 (25/8): سڑکوں کے بچوں، بھیک مانگنے والے بچوں اور محنتِ مشقت میں لگے بچوں کے مسئلے کا شرعی علاج", es: "Resolución 246 (25/8) de la IIFA sobre un enfoque de la sharia para los niños de la calle, los niños mendigos y los niños en trabajos forzados.", fr: "Résolution 246 (25/8) de l'IIFA relative à une approche fondée sur la charia concernant les enfants des rues, les enfants mendiants et les enfants soumis au travail forcé", tr: "Uluslararası İslami Fiqh Akademisi Kararı 246 (25/8), sokak çocukları, dilenci çocuklar ve ağır emeğin karşılanması olgusunu ele almak için Şeriat vizyonu hakkında", id: "Resolusi International Islamic Fiqh Academy 246 (25/8) mengenai visi Syariah untuk mengatasi fenomena anak jalanan, anak pengemis, dan pekerja anak yang bekerja paksa" }
summary:
  ar: "قرار جماعي لمجمع الفقه الإسلامي الدولي في دورته الخامسة والعشرين بجدة ⁦(29 رجب – 3 شعبان 1444هـ، 20–23 فبراير 2023م)⁩، مؤكدًا قراره 113 ⁦(12/7)⁩ في حقوق الأطفال والمسنين. عرّف المجمع أطفال الشوارع بمن دون البلوغ يتخذون الشوارع مقر إقامة أو مصدر رزق بعلم أوليائهم أو دونه، والأطفال المتسولين بمن يُجبرون على سؤال الناس دون وجه حق لمال أو طعام أو شراب، والأطفال العاملين في الأعمال الشاقة بمن يُجبرون على أعمال تهدد حياتهم وصحتهم وتعيق تعليمهم. وقرر أنه لا يجوز ترك الأطفال يتخذون الشوارع مقرًا أو مكسبًا، ولا استخدامهم في التسول في الشوارع أو المنازل أو المكاتب، ولا تشغيلهم في الأعمال الشاقة في المناجم والمصانع والمزارع والمنازل، ولا يجوز اتخاذ الفقر أو العوز ذريعة لذلك، لمخالفته نصوص الشرع التي حفظت حقوق الطفل في الحياة والتربية والتعليم والصحة، ولما يترتب عليه من تعريض حياتهم للخطر وجعلهم فريسة للعصابات المجرمة وتعاطي المخدرات. وأوصى بمناشدة الحكومات تطبيق القوانين المجرمة لتشغيل الأطفال، ودعوة العلماء والخطباء لتعزيز الوعي بالحرمة، وسن أنظمة حامية حيث لا توجد، وتعزيز دور الأسرة، وحث الإعلام على التوعية."
  en: "A collective resolution of the International Islamic Fiqh Academy at its 25th session in Jeddah (29 Rajab – 3 Sha'ban 1444, 20–23 February 2023), reaffirming its resolution 113 (12/7) on the rights of children and the elderly. It defined street children as those under majority who make the streets their dwelling or source of livelihood, with or without their guardians' knowledge; child beggars as those forced to ask people without right for money, food or drink; and children in hard labour as those forced into work that threatens their lives and health and obstructs their education. It ruled that children may not be left to make the streets their home or livelihood, may not be used in begging in streets, homes or offices, and may not be employed in hard labour in mines, factories, farms or homes — and that poverty or want may not be made a pretext for any of this, for its contravention of the revealed texts securing the child's rights to life, upbringing, education and health, and for exposing them to criminal gangs and drug abuse. It recommended enforcing laws criminalising child labour, calling on scholars and preachers to raise awareness of the prohibition, enacting protective laws where none exist, strengthening the family's role, and urging media awareness of the three phenomena."
  ur: "بین الاقوامی اسلامی فقہ اکیڈمی کی اجتماعی قرارداد، جدہ میں پچیس ویں مجلس ⁦(29 رجب – 3 شعبان 1444ھ، 20–23 فروری 2023ء)⁩ میں، اپنی قرارداد 113 ⁦(12/7)⁩ ⁦(بچوں اور بزرگوں کے حقوق)⁩ کی تائید کرتے ہوئے۔ اکیڈمی نے سڑکوں کے بچوں کی تعریف نابالغ بچوں کے طور پر کی جو سڑکوں کو مسکن یا روزی کا ذریعہ بنائیں؛ بھیک مانگنے والے بچوں کی تعریف ان کے طور پر کی جو ناحق لوگوں سے مال، کھانا یا پینا مانگنے پر مجبور ہوں؛ اور محنتِ مشکت میں لگے بچوں کی تعریف ان کے طور پر کی جن پر زندگی، صحت اور تعلیم کو خطرہ ڈالنے والے کام لادے جائیں۔ اس نے فیصلہ کیا کہ بچوں کو سڑکوں پر رہنے یا کمانے کے لیے چھوڑنا، بھیک منگوانا گلیوں، گھروں یا دفاتر میں، اور کانوں، کارخانوں، کھیتوں اور گھروں میں محنتِ مشقت میں لگانا جائز نہیں، اور فقر یا تنگی کو اس کا بہانہ نہیں بنایا جا سکتا — یہ ان شرعی نصوص کی خلاف ورزی ہے جنہوں نے بچے کے حقوقِ حیات، تربیت، تعلیم اور صحت کو محفوظ کیا، اور یہ انھیں مجرمانہ ٹولیوں اور نشے کی لعنت کا شکار بناتا ہے۔ سفارشات میں بچوں کی محنت کو جرم بنانے والے قوانین کا نفاذ، علماء و خطباء سے حرمت کی آگہی، حفاظتی قوانین کا قیام جہاں نہیں ہیں، خاندان کے کردار کی تقویت، اور تینوں مظاہر پر ذرائع ابلاغ کی توعیت شامل ہے۔"
  es: "Resolución colectiva de la Academia Internacional de Jurisprudencia Islámica, en su 25.ª sesión celebrada en Yeda (del 29 de Rajab al 3 de Sha'ban de 1444, del 20 al 23 de febrero de 2023), que reafirma su resolución 113 (12/7) sobre los derechos de los niños y los ancianos. En ella se define a los niños de la calle como aquellos menores de edad que hacen de las calles su hogar o fuente de sustento, con o sin el conocimiento de sus tutores; a los niños mendigos como aquellos obligados a pedir dinero, comida o bebida a personas sin derecho a ello; y a los niños sometidos a trabajos forzados como aquellos obligados a realizar trabajos que ponen en peligro su vida y su salud y obstaculizan su educación. El tribunal dictaminó que los niños no pueden vivir ni ganarse la vida en la calle, ni mendigar en la calle, en casa o en la oficina, ni trabajar en condiciones deplorables en minas, fábricas, granjas o hogares. Asimismo, declaró que la pobreza o la miseria no pueden servir de pretexto para ninguna de estas acciones, ya que contravienen los textos sagrados que garantizan los derechos del niño a la vida, la crianza, la educación y la salud, y los exponen a bandas criminales y al consumo de drogas. Recomendó hacer cumplir las leyes que penalizan el trabajo infantil, exhortar a académicos y predicadores a sensibilizar sobre esta prohibición, promulgar leyes de protección donde no existan, fortalecer el papel de la familia e instar a los medios de comunicación a concienciar sobre estos tres fenómenos."
  fr: "Une résolution collective de l'Académie internationale de jurisprudence islamique (Fiqh), adoptée lors de sa 25e session à Djeddah (29 Rajab – 3 Sha'ban 1444, soit du 20 au 23 février 2023), réaffirme sa résolution 113 (12/7) relative aux droits des enfants et des personnes âgées. Elle définit les enfants des rues comme les mineurs qui vivent dans la rue ou y trouvent leur subsistance, avec ou sans l'accord de leurs tuteurs; les enfants mendiants comme ceux qui sont contraints de demander de l'argent, de la nourriture ou des boissons à des personnes qui n'y ont pas droit; et les enfants soumis au travail forcé comme ceux contraints à un travail qui met leur vie et leur santé en danger et qui entrave leur éducation. Il a été statué que les enfants ne doivent pas être abandonnés à leur sort, ni être contraints de mendier dans les rues, les maisons ou les bureaux, ni être employés à des travaux forcés dans les mines, les usines, les fermes ou les foyers. La pauvreté ou le besoin ne doivent en aucun cas servir de prétexte à de tels agissements, car ils contreviennent aux textes révélés garantissant les droits de l'enfant à la vie, à l'éducation, à l'instruction et à la santé, et l'exposent aux bandes criminelles et à la toxicomanie. Il a été recommandé d'appliquer les lois criminalisant le travail des enfants, d'appeler les érudits et les prédicateurs à sensibiliser le public à cette interdiction, de promulguer des lois de protection là où elles font défaut, de renforcer le rôle de la famille et d'inciter les médias à se pencher sur ces trois phénomènes."
  tr: "Uluslararası İslami Fiqh Akademisi'nin Cidde'deki yirmi beşinci oturumunda (29 Recep – 3 Şa'ban 1444 H, 20–23 Şubat 2023) toplu kararı, çocuk ve yaşlıların haklarına ilişkin 113 (12/7) sayılı kararını onaylamıştır. Akademi, sokak çocuklarını, vasilerinin bilgisi olsun ya da olmasın, ikamet yeri veya geçim kaynağı olarak sokakları kullanan; haklı gerekçesi olmadan insanlardan para, yiyecek veya içecek istemeye zorlanan çocuklar olarak dilenenler; ağır emekte çalışan çocukları ise hayatlarını ve sağlıklarını tehdit eden ve eğitimlerini engelleyen görevleri zorlayan kişiler olarak tanımlamıştır. Çocukların sokakları merkezleri veya kazançları haline getirmelerine izin verilmemesi, sokaklarda, evlerde veya ofislerde dilencilik için kullanılmamaları ve madenlerde, fabrikalarda, çiftliklerde ve evlerde ağır işlerde çalıştırılmamaları gerektiğine karar verdi. Yoksulluk veya yoksulluk bunun için bir bahane olarak kullanılmamalıdır; çünkü bu, çocukların yaşam, eğitim ve sağlık haklarını koruyan Şeriat hükümlerini ihlal etmekte ve böylece hayatlarını tehlikeye atmakta, onları suç çeteleri ve uyuşturucu bağımlılığının kurbanı haline getirmektedir. Hükümetlerin çocuk işçiliğini suç sayan yasaları uygulamaya teşvik edilmesini, akademisyenleri ve vaizleri kutsallık farkındalığını artırmaya, var olmayan yerlerde koruyucu sistemler kurmaya, ailenin rolünü güçlendirmeye ve medyayı farkındalık artırmaya teşvik etmeye teşvik etmelerini önerdi."
  id: "Keputusan kolektif Akademi Fiqh Islam Internasional dalam sesi ke-25 di Jeddah (29 Rajab – 3 Sha'ban 1444 H, 20–23 Februari 2023), menegaskan keputusan 113 (7/12) tentang hak-hak anak dan lansia. Akademi mendefinisikan anak jalanan sebagai mereka yang di bawah umur yang turun ke jalan sebagai tempat tinggal atau sumber mata pencaharian, baik dengan atau tanpa sepengetahuan wali mereka; anak-anak pengemis sebagai mereka yang dipaksa meminta uang tanpa alasan, makanan, atau minuman; dan anak-anak yang bekerja keras sebagai mereka yang dipaksa melakukan tugas yang mengancam hidup dan kesehatan mereka serta menghambat pendidikan mereka. Ia memutuskan bahwa anak-anak tidak boleh dibiarkan menjadikan jalanan sebagai pusat atau penghasilan mereka, juga tidak boleh digunakan untuk mengemis di jalanan, rumah, atau kantor, maupun dipekerjakan secara paksa di tambang, pabrik, pertanian, dan rumah. Kemiskinan atau kemiskinan tidak boleh dijadikan alasan untuk hal ini, karena melanggar ketentuan Syariah yang menjaga hak anak-anak atas kehidupan, pendidikan, dan kesehatan, sehingga membahayakan nyawa mereka dan menjadi korban geng kriminal serta penyalahgunaan narkoba. Ia merekomendasikan agar pemerintah menegakkan undang-undang yang mengkriminalisasi pekerja anak, menyerukan para cendekiawan dan pengkhotbah untuk meningkatkan kesadaran akan kesucian, memberlakukan sistem perlindungan di tempat yang tidak ada, memperkuat peran keluarga, dan mendorong media untuk meningkatkan kesadaran."
