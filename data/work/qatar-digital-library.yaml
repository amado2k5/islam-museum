summary:
  ar: "مكتبة رقمية ثنائية اللغة ⁦(العربية والإنجليزية)⁩ أطلقتها مؤسسة قطر ومكتبة قطر الوطنية والمكتبة البريطانية في أكتوبر 2014، تضم سجلات تاريخ الخليج من أرشيف مكتب الهند ومخطوطات عربية علمية وتراثية؛ بلغت قرابة 2.5 مليون صفحة رقمية في ذكراها العاشرة سنة 2024."
  en: "A bilingual (Arabic and English) digital library launched by Qatar Foundation, Qatar National Library and the British Library in October 2014, holding records of Gulf history from the India Office archives and Arabic scientific and heritage manuscripts; it reached almost 2.5 million digitised pages at its tenth anniversary in 2024."
  ur: "دو لسانی ⁦(عربی اور انگریزی)⁩ ڈیجیٹل لائبریری جو قطر فاؤنڈیشن، قطر نیشنل لائبریری اور برٹش لائبریری نے اکتوبر 2014 میں شروع کی؛ اس میں انڈیا آفس کے ذخیرے سے خلیج کی تاریخ کے ریکارڈ اور عربی سائنسی و تراثی مخطوطات ہیں؛ 2024 میں دسویں سالگرہ پر تقریباً 25 لاکھ ڈیجیٹل صفحات۔"
