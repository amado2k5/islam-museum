summary:
  ar: "كتاب بالإنجليزية لإنغريد ماتسون عن تاريخ القرآن ومكانته في حياة المسلمين، صدر عن دار بلاكويل في أكسفورد، وصدرت طبعته الثانية عن وايلي-بلاكويل سنة 2013. تذكر القائمة سنة 2008، ويسجّل الفهرس طبعات من 2007 و2008."
  en: "An English book by Ingrid Mattson on the history of the Qur'an and its place in Muslim life, published by Blackwell, Oxford; a second edition followed from Wiley-Blackwell in 2013. The list gives 2008; the catalogue records editions from 2007 and 2008."
  ur: "انگرڈ میٹسن کی انگریزی کتاب جو قرآن کی تاریخ اور مسلمانوں کی زندگی میں اس کے مقام پر ہے؛ بلیک ویل، آکسفورڈ سے شائع ہوئی اور دوسرا ایڈیشن 2013ء میں وائلی-بلیک ویل سے آیا۔ فہرستِ کتب 2008ء بتاتی ہے؛ کیٹلاگ میں 2007ء اور 2008ء کے ایڈیشن درج ہیں۔"
  es: "Un libro en inglés de Ingrid Mattson sobre la historia del Corán y su lugar en la vida musulmana, publicado por Blackwell, Oxford; una segunda edición fue publicada por Wiley-Blackwell en 2013. La lista indica 2008; el catálogo registra ediciones de 2007 y 2008."
  fr: "Un livre en anglais d'Ingrid Mattson sur l'histoire du Coran et sa place dans la vie musulmane, publié par Blackwell, Oxford; une deuxième édition a suivi chez Wiley-Blackwell en 2013. La liste mentionne 2008; le catalogue fait état d'éditions de 2007 et 2008."
  tr: "Ingrid Mattson tarafından yazılmış, Kur'an'ın tarihi ve Müslümanların yaşamlarındaki yeri hakkında İngilizce bir kitap, Oxford'da Blackwell tarafından yayımlanmış, ikinci baskısı ise 2013'te Wiley-Blackwell tarafından yayımlanmıştır. Liste 2008'de belirtilmiş olup, dizin 2007 ve 2008 yıllarındaki baskıları kaydetmektedir."
  id: "Sebuah buku berbahasa Inggris karya Ingrid Mattson tentang sejarah Al-Qur'an dan peranannya dalam kehidupan umat Muslim, diterbitkan oleh Blackwell di Oxford, dan edisi keduanya diterbitkan oleh Wiley-Blackwell pada tahun 2013. Daftar tersebut disebutkan pada tahun 2008, dan indeks mencatat edisi dari tahun 2007 dan 2008."
