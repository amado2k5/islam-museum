label: { ar: "المعرب من الكلام الأعجمي على حروف المعجم", en: "al-Mu'arrab min al-Kalam al-A'jami", es: "al-Mu'arrab min al-Kalam al-A'jami", fr: "al-Mu'arrab min al-Kalam al-A'jami", ur: "المعرب من الکلام الاعجمی", tr: "Sözlüğün harflerinde yabancı konuşmadan Araplaştırılmış", id: "Bahasa Arab dari bahasa asing pada huruf-huruf kamus" }
summary:
  ar: "المعرب من الكلام الأعجمي على حروف المعجم للجواليقي، ويسمى أيضاً «المعربات»، قاموس مرتب هجائياً بحسب الحرف الأول فقط، في ستة وعشرين باباً بعد المقدمة وبابين، يشرح ٧٣٢ كلمة من أصل أجنبي منها ١٣٠ أسماء أشخاص وأماكن. وتبحث مقدمته في طريقة العرب في استعمال الألفاظ الأجنبية، وتتوسط في مسألة وجود ألفاظ أعجمية في القرآن فتقول إنها فيه لكنها تعرّبت. نشره إدوارد زاخاو في ليبتسك ١٨٦٧م وأحمد محمد شاكر في القاهرة ١٩٤٢م و١٩٦٩م وف. عبد الرحيم في دمشق ١٩٩٠م."
  en: "al-Jawaliqi's al-Mu'arrab min al-kalam al-a'jami 'ala huruf al-mu'jam, also called al-Mu'arrabat, an alphabetical dictionary ordered by the first letter only, in twenty-six chapters after the preface and two chapters, explaining 732 words of foreign origin, 130 of them personal and place names. Its preface treats the Arabs' way of using foreign words and takes a middle course on whether the Qur'an contains foreign words: it does, but they were Arabised. Editions: Edward Sachau (Leipzig 1867), Ahmad Muhammad Shakir (Cairo 1942, 1969), F. Abdurrahman (Damascus 1990)."
  es: "El al-Mu'arrab min al-kalam al-a'jami 'ala huruf al-mu'jam de al-Jawaliqi, llamado también al-Mu'arrabat, un diccionario alfabético ordenado solo por la primera letra, en veintiséis capítulos tras el prólogo y dos capítulos, que explica 732 palabras de origen extranjero, 130 de ellas nombres de personas y lugares. Su prólogo trata la manera en que los árabes usan palabras extranjeras y toma un camino medio sobre si el Corán contiene palabras extranjeras: las contiene, pero arabizadas. Ediciones: Edward Sachau (Leipzig 1867), Ahmad Muhammad Shakir (El Cairo 1942, 1969), F. Abdurrahman (Damasco 1990)."
  fr: "Le al-Mu'arrab min al-kalam al-a'jami 'ala huruf al-mu'jam d'al-Jawaliqi, aussi appelé al-Mu'arrabat, dictionnaire alphabétique classé par la seule première lettre, en vingt-six chapitres après la préface et deux chapitres, expliquant 732 mots d'origine étrangère, dont 130 noms de personnes et de lieux. Sa préface traite de la manière dont les Arabes emploient les mots étrangers et prend une voie moyenne sur la question de savoir si le Coran contient des mots étrangers : il en contient, mais arabisés. Éditions : Edward Sachau (Leipzig 1867), Ahmad Muhammad Shakir (Le Caire 1942, 1969), F. Abdurrahman (Damas 1990)."
  ur: "جوالیقی کی المعرب من الکلام الاعجمی علی حروف المعجم، جسے المعربات بھی کہتے ہیں، صرف پہلے حرف کے لحاظ سے تہجی ترتیب میں ایک لغت، مقدمے اور دو ابواب کے بعد چھبیس ابواب میں، جو 732 غیر ملکی الفاظ کی شرح کرتی ہے جن میں 130 اشخاص اور مقامات کے نام ہیں۔ اس کا مقدمہ عربوں کے غیر ملکی الفاظ استعمال کرنے کے طریقے پر بحث کرتا ہے اور قرآن میں غیر عربی الفاظ کے سوال پر درمیانی راہ اختیار کرتا ہے: وہ اس میں ہیں مگر معرب ہو چکے ہیں۔ ایڈیشن: ایڈورڈ زاخاو ⁦(لائپزگ 1867ء)⁩، احمد محمد شاکر ⁦(قاہرہ 1942ء، 1969ء)⁩، ف. عبدالرحیم ⁦(دمشق 1990ء)⁩۔"
  tr: "Al-Mu'arrab, Al-Javalici tarafından sözlüğün harflerinde yer alan yabancı bir kelimedir ve 'Al-Mu'arabat' olarak da adlandırılır; sözlük, girişten sonra yirmi altı bölüm ve iki bölüm içinde alfabetik olarak düzenlenmiş, 732 yabancı kökenli kelimeyi, bunların 130'u kişi ve yer ismini açıklar. Girişinde Arapların yabancı kelimeleri kullanma yöntemi incelenir ve Kur'an'da yabancı kelimelerin var olup olmadığını arabuluculuk yapar; bunların içinde olduğunu ancak Araplaştırıldıklarını iddia eder. Edward Zachau tarafından Libtsk 1867'de, Ahmed Muhammad Shakir tarafından Kahire'de 1942 ve 1969'da yayımlanmıştır; Abdul Rahim ise Şam'da 1990."
  id: "Al-Mu'arrab adalah kata asing pada huruf-huruf kamus karya Al-Jawaliqi, juga disebut 'Al-Mu'arabat', sebuah kamus yang disusun secara alfabetis hanya berdasarkan huruf pertama, dalam dua puluh enam bab setelah pengantar dan dua bagian, menjelaskan 732 kata yang berasal dari luar negeri, termasuk 130 nama orang dan tempat. Pendahuluannya mengkaji metode Arab dalam menggunakan kata-kata asing dan memediasi keberadaan kata-kata asing dalam Al-Qur'an, mengklaim bahwa kata-kata tersebut ada di dalamnya tetapi telah diarabisasi. Kamus ini diterbitkan oleh Edward Zachau di Libtsk 1867 M, dan Ahmed Muhammad Shakir di Kairo pada 1942 dan 1969 M, serta Abdul Rahim di Damaskus 1990."
