summary:
  ar: "تاريخ لطيف للسيوطي ترجم فيه الخلفاء أمراء المؤمنين القائمين بأمر الأمة من عهد أبي بكر الصديق إلى عصره على ترتيب زمانهم وذكر في ترجمة كل منهم ما وقع في أيامه من الحوادث المستغربة ومن توفي وولي من أعيان أهل العلم والأمراء والولاة."
  en: "Al-Suyuti's compact history: biographies of the caliphs, commanders of the faithful charged with the umma's affairs, from Abu Bakr's era to his own day in chronological order — with each entry the notable incidents of his days and the deaths and appointments of scholars, amirs and governors."
  es: "La historia concisa de Al-Suyuti: biografías de los califas, comandantes de los fieles encargados de los asuntos de la umma, desde la época de Abu Bakr hasta su propio día en orden cronológico; cada entrada incluye los incidentes notables de su época, así como las muertes y los nombramientos de eruditos, emires y gobernadores."
  fr: "L'histoire concise d'Al-Suyuti: biographies des califes, commandants des croyants chargés des affaires de l'umma, de l'époque d'Abu Bakr à son époque, par ordre chronologique — chaque entrée relatant les événements marquants de son temps ainsi que les décès et les nominations des érudits, des émirs et des gouverneurs."
  ur: "السیوطی کی مختصر تاریخ: خلفاء کی سوانح عمری، امت کے امور کے ذمہ دار وفاداروں کے کمانڈر، ابوبکر کے دور سے لے کر ان کے اپنے زمانے تک تاریخ کی ترتیب میں - ہر اندراج کے ساتھ ان کے ایام کے قابل ذکر واقعات اور علماء، امیروں اور گورنروں کی ہلاکتیں اور تقرریاں۔"
