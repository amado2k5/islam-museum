label: { ar: "كتاب المناظر", en: "Kitab al-Manazir (The Book of Optics)", es: "Kitab al-Manazir (El libro de la óptica)", fr: "Kitab al-Manazir (Le Livre de l'Optique)", ur: "کتاب المناظر", tr: "Tartışmalar Kitabı", id: "Buku Perdebatan" }
summary:
  ar: "أهم كتب ابن الهيثم في البصريات، يدرس خواص الضوء في أحواله الثلاث: الإشراق على الاستقامة والانعكاس والانعطاف، بالتجربة مع المناهج الرياضية. ويصف محقق الطبعة المقالات الثلاث الأولى بأنها في الإبصار وإشراق الأضواء على الاستقامة، والمقالات الأربع الأخيرة في الانعكاس والانعطاف {cite:manazir-sabra-1983 p.9} {cite:manazir-sabra-1983 p.10}."
  en: "Ibn al-Haytham's principal optical work. It studies light in three states (rectilinear propagation, reflection and refraction) by experiment and mathematics. The editor describes its first three books as treating vision and rectilinear light, and its last four as treating reflection and refraction {cite:manazir-sabra-1983 p.9} {cite:manazir-sabra-1983 p.10}."
  es: "La obra óptica principal de Ibn al-Haytham estudia la luz en tres estados (propagación rectilínea, reflexión y refracción) mediante experimentación y matemáticas. El editor describe sus tres primeros libros como tratados sobre la visión y la luz rectilínea, y los cuatro últimos como tratados sobre la reflexión y la refracción {cite:manazir-sabra-1983 p.9} {cite:manazir-sabra-1983 p.10}."
  fr: "L'ouvrage principal d'Ibn al-Haytham sur l'optique. Il étudie la lumière dans ses trois états (propagation rectiligne, réflexion et réfraction) par l'expérimentation et les mathématiques. L'éditeur précise que les trois premiers livres traitent de la vision et de la lumière rectiligne, et les quatre derniers de la réflexion et de la réfraction."
  ur: "ابن الہیثم کا بنیادی نثری کام۔ یہ تین حالتوں میں روشنی کا مطالعہ کرتا ہے ⁦(ریکٹ لائنر پروپیگیشن، ریفلیکشن اور ریفریکشن)⁩ تجربے اور ریاضی کے ذریعے۔ ایڈیٹر نے اپنی پہلی تین کتابوں کو بصارت اور مستطیل روشنی کے علاج کے طور پر بیان کیا ہے، اور اس کی آخری چار کو انعکاس اور اضطراب کے علاج کے طور پر بیان کیا ہے {حوالہ: منظیر-صابرہ-1983 صفحہ 9} {حوالہ: منظیر-صابرہ-1983 صفحہ 10}"
  tr: "İbn el-Heytham'ın optik üzerine en önemli kitapları, ışığın üç halindeki özelliklerini inceler: düzlükte aydınlatma, yansıma ve dönme ve matematiksel yöntemlerle deneyler yapar. Baskının editörü, ilk üç makaleyi görüş ve doğruluk üzerindeki ışıkları aydınlatma ile ilgili olanlar olarak, son dört makaleyi ise yansıma ve dönüş üzerine olarak tanımlar {cite:manazir-sabra-1983 s.9} {cite:manazir-sabra-1983 s.10}."
  id: "Buku-buku terpenting Ibn al-Haytham tentang optik mempelajari sifat cahaya dalam tiga keadaannya: pencahayaan pada lurus, refleksi, dan putar, dengan bereksperimen dengan metode matematika. Editor edisi tersebut menggambarkan tiga artikel pertama sebagai yang berkaitan dengan penglihatan dan penerangan cahaya pada lurus, dan empat artikel terakhir tentang refleksi dan putaran {cite:manazir-sabra-1983 hlm.9} {cite:manazir-sabra-1983 hlm.10}."
