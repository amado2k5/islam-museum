summary:
  ar: "أهم كتب ابن الهيثم في البصريات، يدرس خواص الضوء في أحواله الثلاث: الإشراق على الاستقامة والانعكاس والانعطاف، بالتجربة مع المناهج الرياضية. ويصف محقق الطبعة المقالات الثلاث الأولى بأنها في الإبصار وإشراق الأضواء على الاستقامة، والمقالات الأربع الأخيرة في الانعكاس والانعطاف {cite:manazir-sabra-1983 p.9} {cite:manazir-sabra-1983 p.10}."
  en: "Ibn al-Haytham's principal optical work. It studies light in three states (rectilinear propagation, reflection and refraction) by experiment and mathematics. The editor describes its first three books as treating vision and rectilinear light, and its last four as treating reflection and refraction {cite:manazir-sabra-1983 p.9} {cite:manazir-sabra-1983 p.10}."
