class: work
kind: fatwa
label: { ar: "حكم صلاة من أدرك الإمام وهو راكع فكبر تكبيرة واحدة", en: "The prayer of one who catches the imam bowing and says one takbir", ur: "امام کو رکوع میں پانے والے کا ایک تکبیر کہنے پر نماز کا حکم", es: "La oración de aquel que ve al imán inclinándose y dice un takbir", fr: "La prière de celui qui surprend l'imam en train de s'incliner et prononce un takbir" }
summary:
  ar: "سائل سأل عن من أدرك الإمام وهو راكع فكبر تكبيرة واحدة. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 22481)⁩ أن صلاته انعقدت صحيحة شرعًا سواء نوى بها تكبيرة الإحرام أم لا، وبيّن الجواب إدراكه للركعة على هذه الصفة."
  en: "A questioner asked about one who reaches the imam bowing and says a single takbir. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 22481) answered that his prayer is validly begun in the sharia whether he intended the opening takbir by it or not, and the answer sets out whether he has caught the rak'a on this description."
  ur: "ایک سائل نے اس شخص کے بارے میں پوچھا جو امام کو رکوع میں پائے اور ایک تکبیر کہے۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 22481)⁩ نے جواب دیا کہ اس کی نماز شرعاً صحیح منعقد ہو گئی خواہ اس تکبیر سے تکبیرِ تحریمہ کی نیت ہو یا نہ، اور جواب میں اس صورت میں رکعت ملنے کا حکم بیان ہوا۔"
  es: "Un consultante preguntó sobre alguien que se acerca al imán inclinándose y pronuncia un solo takbir. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 22481) respondió que su oración se inicia válidamente según la sharia, independientemente de si pretendía pronunciar el takbir inicial con él o no, y la respuesta aclara si ha recibido la rak'a según esta descripción."
  fr: "Un internaute a posé une question concernant celui qui arrive devant l'imam en s'inclinant et en prononçant un seul takbir. La Dar al-Ifta d'Égypte (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 22481) a répondu que sa prière est validement commencée selon la charia, qu'il ait ou non l'intention de prononcer le takbir initial, et la réponse précise si, selon cette description, il a accompli la rak'a."
