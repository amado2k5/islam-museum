summary:
  ar: "مجموع خطب الجمعة والمناسبات التي أنشأها أبو يحيى عبد الرحيم بن نباتة الفارقي ⁦(335–374هـ)⁩ خطيب حلب في عهد سيف الدولة الحمداني، مرتبة: خطب المعاد، وخطب المواسم كاستقبال السنة وعاشوراء ووفاة النبي في ربيع الأول ووداع رمضان، وخطب الجهاد، وخطب الأعياد والنكاح؛ وهو مسجوع، وقد شرحه العكبري والكندي وعبد اللطيف البغدادي وغيرهم، وأكثر أهل الأدب من الاستشهاد به ونقده {cite:diwan-khutab-ibn-nubata-beirut-1319 front 5-13} {cite:diwan-khutab-ibn-nubata-beirut-1319 front 14-18}."
  en: "The collection of Friday and occasional sermons composed by Abu Yahya 'Abd al-Rahim ibn Nubata al-Fariqi (335–374 AH), preacher of Aleppo under the Hamdanid Sayf al-Dawla. It is arranged as sermons on the hereafter; sermons for the seasons, such as the new year, Ashura, the Prophet's death in Rabi' al-Awwal and the farewell to Ramadan; sermons on jihad; and festival and marriage sermons. It is written in rhymed prose; al-'Ukbari, al-Kindi, 'Abd al-Latif al-Baghdadi and others wrote commentaries on it, and men of letters often quoted and criticised it {cite:diwan-khutab-ibn-nubata-beirut-1319 front 5-13} {cite:diwan-khutab-ibn-nubata-beirut-1319 front 14-18}."
  ur: "ابو یحییٰ عبد الرحیم بن نباتہ فارقی (335–374ھ) کے جمعہ اور مواقع کے خطبات کا مجموعہ، جو حمدانی سیف الدولہ کے عہد میں حلب کے خطیب تھے۔ ترتیب یہ ہے: آخرت کے خطبات؛ موسموں کے خطبات، جیسے نئے سال، عاشوراء، ربیع الاول میں نبی کی وفات اور الوداعِ رمضان؛ جہاد کے خطبات؛ اور عید اور نکاح کے خطبات۔ یہ مسجع نثر میں ہے؛ عکبری، کندی، عبد اللطیف بغدادی وغیرہ نے اس کی شرحیں لکھیں، اور اہلِ ادب نے اس سے بہت استشہاد اور تنقید کی {cite:diwan-khutab-ibn-nubata-beirut-1319 front 5-13} {cite:diwan-khutab-ibn-nubata-beirut-1319 front 14-18}۔"
