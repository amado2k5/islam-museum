structure: "في نشرة بيروت 1319هـ: فهرس بمطالع الخطب (ص 5–13 من المسح)، ترجمة المؤلف وذكر الشروح (ص 14–25)، ثم الخطب (ص 1 وما بعدها بالترقيم المطبوع): خطب المعاد، وخطب يذكر فيها الموت، واستقبال السنة وعاشوراء (ص 133)، ووفاة النبي في ربيع الأول (ص 136)، والجهاد (ومنها خطبة عند فتح العدو حلب في ذي القعدة 351هـ، ص 191)، ووداع رمضان، وخطب العيد والنكاح؛ ثم خطب ولده أبي طاهر محمد."
