  id: "Dokumen yang disiapkan oleh Dr. Yasser Qadi dan disetujui oleh Majelis Umum Dewan Yurisprudensi Amerika Utara (24 Maret 2020) mengenai isu doa dan pemakaman terkait COVID-19 selama krisis, sebagaimana dijelaskan dalam dokumen tersebut."
