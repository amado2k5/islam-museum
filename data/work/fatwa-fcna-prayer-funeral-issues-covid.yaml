  es: "Documento elaborado por el Dr. Yasir Qadhi y adoptado por la asamblea general del Consejo de Fiqh de Norteamérica (24 de marzo de 2020) sobre cuestiones relativas a la oración y los funerales en el contexto de la COVID-19 en tiempos de crisis, tal como se detalla en el documento."
