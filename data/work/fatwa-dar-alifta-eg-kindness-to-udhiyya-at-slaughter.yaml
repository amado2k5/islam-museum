id: work/fatwa-dar-alifta-eg-kindness-to-udhiyya-at-slaughter
class: work
kind: fatwa
label: { ar: "استحضار النية والرفق بالأضحية عند الذبح", en: "Presence of intention and gentleness toward the udhiyya at slaughter", ur: "ذبح کے وقت نیت اور قربانی کے جانور سے نرمی", es: "Presencia de intención y gentileza hacia el udhiyya en el sacrificio.", fr: "Présence d'intention et de douceur envers l'udhiyya lors du sacrifice", tr: "Katliam sırasında kurbana niyet ve iyiliği hatırlamak", id: "Mengingat niat dan kebaikan pada pengorbanan saat penyembelihan" }
summary:
  ar: "سائل سأل عن استحضار النية والرفق بالأضحية عند الذبح. أجابت دار الإفتاء المصرية ⁦(مفتي الجمهورية د. نظير محمد عياد، فتوى رقم 20769)⁩ أن تقديم الماء للأضحية قبيل الذبح لتشرب وإحداد السكين بعيدًا عنها من الأمور المستحبة فالرفق والإحسان مطلوب على ما فصّل الجواب."
  en: "A questioner asked about presence of intention and gentleness toward the udhiyya at slaughter. Egypt's Dar al-Ifta (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa no. 20769) answered that offering it water before slaughter and sharpening the knife away from it are recommended — kindness is required — as the answer details."
  ur: "ایک سائل نے ذبح کے وقت نیت اور قربانی کے جانور سے نرمی کا حکم پوچھا۔ مصر کے دار الافتاء ⁦(مفتیِ جمهور ڈاکٹر نظیر محمد عیاد، فتویٰ نمبر 20769)⁩ نے جواب دیا کہ اسے پانی پلانا اور چاقو اس سے دور تیز کرنا مستحب ہے — نرمی مطلوب ہے — جیسا کہ جواب میں تفصیل ہے۔"
  es: "Un consultante preguntó sobre la presencia de intención y gentileza hacia la udhiyya durante el sacrificio. El Dar al-Ifta de Egipto (Gran Muftí Dr. Nazir Muhammad Ayyad, fatwa n.° 20769) respondió que se recomienda ofrecerle agua antes del sacrificio y afilar el cuchillo lejos de ella; se requiere bondad, como se detalla en la respuesta."
  fr: "Un internaute a posé une question concernant l'intention et la douceur à adopter envers l'âne lors de l'abattage. La Dar al-Ifta égyptienne (Grand Mufti Dr. Nazir Muhammad Ayyad, fatwa n° 20769) a répondu qu'il est recommandé de lui offrir de l'eau avant l'abattage et d'aiguiser le couteau loin de lui; la bienveillance est toutefois indispensable, comme le précise la réponse."
  tr: "Bir soru soran kişi, katliam sırasında kurbanın niyet ve nezaketini koruma konusunda sordu. Mısır Dar al-Ifta'sı (Cumhuriyet Müftüsü Dr. Nazeer Muhammad Ayad, Fetva No. 20769), kurbana kesimden önce su sunmanın ve bıçağı ondan uzak tutmanın önerildiğini, çünkü nezaket ve iyilik gerektiğini yanıtlamıştır; bu cevapta detaylandırılmıştır."
  id: "Seorang penanya menanyakan tentang menjaga niat dan kelembutan dalam pengorbanan pada saat penyembelihan. Dar al-Ifta Mesir (Mufti Republik Dr. Nazeer Muhammad Ayad, Fatwa No. 20769) menjawab bahwa mempersembahkan air kepada korban sebelum disembelih agar dapat diminum, dan menahan pisau agar tidak menjauh, karena diperlukan kelembutan dan kebaikan, seperti yang dijelaskan dalam jawaban."
