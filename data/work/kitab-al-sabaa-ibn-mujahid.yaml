label: { ar: "كتاب السبعة في القراءات لابن مجاهد", en: "Kitab al-Sab'a fi al-Qira'at (Ibn Mujahid)", ur: "کتاب السبعہ فی القراءات ⁦(ابن مجاہد)⁩" }
summary:
  ar: "كتاب أبي بكر أحمد بن موسى ابن مجاهد البغدادي ⁦(ت 324هـ)⁩ في قراءات سبعة من أئمة الأمصار، وهو على قول ابن الجزري أول من جمع قراءاتهم؛ جعل الكسائي سابعًا بدل يعقوب الحضرمي، وانتقد أئمة اقتصاره على سبعة لما أوهمه العامة من أنها الأحرف السبعة {cite:nashr-dahman-damascus-1345-v1 p. 34} {cite:nashr-dahman-damascus-1345-v1 p. 46} {cite:nashr-dahman-damascus-1345-v1 p. 47}."
  en: "Abu Bakr Ahmad ibn Musa Ibn Mujahid of Baghdad (d. 324 AH) wrote this book on the readings of seven imams of the cities and, in Ibn al-Jazari's words, was the first to gather their readings; he put al-Kisa'i in the seventh place in place of Ya'qub al-Hadrami, and some imams criticised his limit of seven for letting the public suppose they were the seven ahruf {cite:nashr-dahman-damascus-1345-v1 p. 34} {cite:nashr-dahman-damascus-1345-v1 p. 46} {cite:nashr-dahman-damascus-1345-v1 p. 47}."
  ur: "ابو بکر احمد بن موسیٰ ابن مجاہد بغدادی ⁦(م 324ھ)⁩ کی کتاب جس میں شہروں کے سات اماموں کی قراءتیں جمع ہیں؛ ابن الجزری کے مطابق وہ ان کی قراءتیں جمع کرنے والے پہلے شخص ہیں؛ انہوں نے ساتویں جگہ یعقوب حضرمی کی بجائے کسائی کو رکھا، اور بعض اماموں نے سات پر اقتصار پر تنقید کی کہ اس سے عوام نے سمجھ لیا کہ یہی سات احرف ہیں {cite:nashr-dahman-damascus-1345-v1 p. 34} {cite:nashr-dahman-damascus-1345-v1 p. 46} {cite:nashr-dahman-damascus-1345-v1 p. 47}۔"
