id: work/fatwa-aliftaa-jo-heirs-and-a-deceased-fathers-unpaid-debts
class: work
kind: fatwa
label: { ar: "من مات وعليه ديون ولم يترك مالًا", en: "Someone who dies in debt and leaves no wealth", ur: "قرض کی حالت میں وفات اور کوئی مال نہ چھوڑنا" }
summary:
  ar: "سؤال عن من مات وعليه ديون ولم يترك مالًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن الديون تقضى من التركة قبل قسمتها، فإن لم تكن تركة أو لم تتسع لم يجب على الورثة الوفاء من مالهم لكنه يستحب لهم. أجابت الدائرة بأن من مات وعليه حقوق للعباد كالديون فإنها تقضى من تركته قبل قسمتها إن كان له مال، وأن وفاء الديون مقدم على حق الورثة في الميراث، واستندت إلى حديث حسّنه الترمذي في أن نفس المؤمن معلقة بدينه حتى يقضى عنه. وقالت إن الميت إن لم يترك تركة، أو ترك مالًا لا يتسع لوفاء الديون، لم يجب على الورثة الوفاء من مالهم، لكنه يستحب لهم، لأن ذمة الميت تبقى مشغولة بالدين، وليس من البر أن يبقي الولد ذمة أبيه مشغولة. وأضافت أنه يمكن لجميع الأولاد المساهمة في الوفاء عن والدهم والتعاون على ذلك، ولو على أقساط بحسب قدرتهم."
  en: "A question about someone who dies in debt and leaves no wealth, in which Jordan's General Iftaa Department answered that debts are paid from the estate before it is divided, and that if there is no estate or it is not enough, the heirs are not obliged to pay from their own wealth but it is recommended for them. The Department answered that when someone dies owing rights to people, such as debts, they are paid from his estate before it is divided if he left wealth, and that settling debts comes before the heirs' right to inherit, relying on a hadith graded sound (hasan) by al-Tirmidhi that a believer's soul remains suspended by his debt until it is paid on his behalf. It said that if the deceased left no estate, or left wealth that does not cover the debts, the heirs are not obliged to pay them from their own wealth, but it is recommended for them, because the deceased remains burdened by the debt and it is not filial devotion for a son to leave his father so burdened. It added that all the children can contribute and cooperate to settle their father's debts, even in instalments according to their means."
  ur: "قرض کی حالت میں وفات اور کوئی مال نہ چھوڑنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض ترکے کی تقسیم سے پہلے اس میں سے ادا ہوں گے، اور اگر ترکہ نہ ہو یا کافی نہ ہو تو ورثا پر اپنے مال سے ادائیگی واجب نہیں مگر مستحب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو شخص لوگوں کے حقوق، جیسے قرض، کے ساتھ فوت ہو، اگر اس کا مال ہو تو تقسیم سے پہلے اس کے ترکے سے ادا کیے جائیں گے، اور قرض کی ادائیگی ورثا کے حقِ میراث پر مقدم ہے، اور ترمذی کی حسن قرار دی گئی حدیث پر انحصار کیا کہ مومن کی جان اس کے قرض کے ساتھ معلق رہتی ہے یہاں تک کہ اس کی طرف سے ادا کر دیا جائے۔ اس نے کہا کہ اگر میت نے ترکہ نہ چھوڑا ہو، یا اتنا مال چھوڑا ہو جو قرض کے لیے کافی نہ ہو، تو ورثا پر اپنے مال سے ادائیگی واجب نہیں، لیکن ان کے لیے مستحب ہے، کیونکہ میت کا ذمہ قرض سے مشغول رہتا ہے، اور یہ نیکی نہیں کہ بیٹا اپنے باپ کا ذمہ مشغول چھوڑ دے۔ اس نے مزید کہا کہ تمام اولاد مل کر اپنے والد کا قرض ادا کرنے میں حصہ ڈال سکتی ہے، چاہے اپنی استطاعت کے مطابق قسطوں میں ہو۔"
