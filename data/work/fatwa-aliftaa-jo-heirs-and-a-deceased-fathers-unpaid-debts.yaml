id: work/fatwa-aliftaa-jo-heirs-and-a-deceased-fathers-unpaid-debts
class: work
kind: fatwa
label: { ar: "من مات وعليه ديون ولم يترك مالًا", en: "Someone who dies in debt and leaves no wealth", ur: "قرض کی حالت میں وفات اور کوئی مال نہ چھوڑنا", es: "Alguien que muere endeudado y no deja riqueza.", fr: "Une personne qui meurt endettée et ne laisse aucune richesse.", tr: "Borçla ölen ve para bırakmayan", id: "Siapa pun yang meninggal dengan utang dan tidak meninggalkan uang" }
summary:
  ar: "سؤال عن من مات وعليه ديون ولم يترك مالًا، أجابت فيه دائرة الإفتاء العام الأردنية بأن الديون تقضى من التركة قبل قسمتها، فإن لم تكن تركة أو لم تتسع لم يجب على الورثة الوفاء من مالهم لكنه يستحب لهم. أجابت الدائرة بأن من مات وعليه حقوق للعباد كالديون فإنها تقضى من تركته قبل قسمتها إن كان له مال، وأن وفاء الديون مقدم على حق الورثة في الميراث، واستندت إلى حديث حسّنه الترمذي في أن نفس المؤمن معلقة بدينه حتى يقضى عنه. وقالت إن الميت إن لم يترك تركة، أو ترك مالًا لا يتسع لوفاء الديون، لم يجب على الورثة الوفاء من مالهم، لكنه يستحب لهم، لأن ذمة الميت تبقى مشغولة بالدين، وليس من البر أن يبقي الولد ذمة أبيه مشغولة. وأضافت أنه يمكن لجميع الأولاد المساهمة في الوفاء عن والدهم والتعاون على ذلك، ولو على أقساط بحسب قدرتهم."
  en: "A question about someone who dies in debt and leaves no wealth, in which Jordan's General Iftaa Department answered that debts are paid from the estate before it is divided, and that if there is no estate or it is not enough, the heirs are not obliged to pay from their own wealth but it is recommended for them. The Department answered that when someone dies owing rights to people, such as debts, they are paid from his estate before it is divided if he left wealth, and that settling debts comes before the heirs' right to inherit, relying on a hadith graded sound (hasan) by al-Tirmidhi that a believer's soul remains suspended by his debt until it is paid on his behalf. It said that if the deceased left no estate, or left wealth that does not cover the debts, the heirs are not obliged to pay them from their own wealth, but it is recommended for them, because the deceased remains burdened by the debt and it is not filial devotion for a son to leave his father so burdened. It added that all the children can contribute and cooperate to settle their father's debts, even in instalments according to their means."
  ur: "قرض کی حالت میں وفات اور کوئی مال نہ چھوڑنا کے بارے میں سوال، جس میں اردن کے جنرل افتاء ڈیپارٹمنٹ نے کہا کہ قرض ترکے کی تقسیم سے پہلے اس میں سے ادا ہوں گے، اور اگر ترکہ نہ ہو یا کافی نہ ہو تو ورثا پر اپنے مال سے ادائیگی واجب نہیں مگر مستحب ہے۔ ڈیپارٹمنٹ نے جواب دیا کہ جو شخص لوگوں کے حقوق، جیسے قرض، کے ساتھ فوت ہو، اگر اس کا مال ہو تو تقسیم سے پہلے اس کے ترکے سے ادا کیے جائیں گے، اور قرض کی ادائیگی ورثا کے حقِ میراث پر مقدم ہے، اور ترمذی کی حسن قرار دی گئی حدیث پر انحصار کیا کہ مومن کی جان اس کے قرض کے ساتھ معلق رہتی ہے یہاں تک کہ اس کی طرف سے ادا کر دیا جائے۔ اس نے کہا کہ اگر میت نے ترکہ نہ چھوڑا ہو، یا اتنا مال چھوڑا ہو جو قرض کے لیے کافی نہ ہو، تو ورثا پر اپنے مال سے ادائیگی واجب نہیں، لیکن ان کے لیے مستحب ہے، کیونکہ میت کا ذمہ قرض سے مشغول رہتا ہے، اور یہ نیکی نہیں کہ بیٹا اپنے باپ کا ذمہ مشغول چھوڑ دے۔ اس نے مزید کہا کہ تمام اولاد مل کر اپنے والد کا قرض ادا کرنے میں حصہ ڈال سکتی ہے، چاہے اپنی استطاعت کے مطابق قسطوں میں ہو۔"
  es: "Una pregunta sobre alguien que muere endeudado y sin patrimonio, a la que el Departamento General de Iftaa de Jordania respondió que las deudas se pagan con el patrimonio antes de su división, y que si no hay patrimonio o este es insuficiente, los herederos no están obligados a pagar con su propio patrimonio, pero se les recomienda hacerlo. El Departamento respondió que cuando alguien muere con derechos a favor de otras personas, como deudas, estas se pagan con su patrimonio antes de su división si dejó patrimonio, y que el pago de las deudas tiene prioridad sobre el derecho de los herederos a heredar, basándose en un hadiz clasificado como auténtico (hasan) por al-Tirmidhi que establece que el alma de un creyente permanece suspendida por su deuda hasta que esta sea pagada en su nombre. Dijo que si el difunto no dejó patrimonio, o dejó un patrimonio que no cubre las deudas, los herederos no están obligados a pagarlas con su propio patrimonio, pero se les recomienda hacerlo, porque el difunto permanece agobiado por la deuda y no es devoción filial que un hijo deje a su padre en tal situación. Añadió que todos los hijos pueden contribuir y cooperar para saldar las deudas de su padre, incluso a plazos según sus posibilidades."
  fr: "Concernant une question relative à une personne décédée endettée et sans patrimoine, le Département général de la jurisprudence jordanienne (Iftaa) a répondu que les dettes sont payées sur la succession avant son partage. En l'absence de succession ou si celle-ci est insuffisante, les héritiers ne sont pas tenus de payer sur leurs propres biens, mais cela leur est recommandé. Le Département a précisé que lorsqu'une personne décède en laissant des dettes, celles-ci sont payées sur sa succession avant son partage, s'il a laissé un patrimoine. Le règlement des dettes prime sur le droit des héritiers à hériter, s'appuyant sur un hadith authentique (hasan) rapporté par al-Tirmidhi, selon lequel l'âme du croyant reste suspendue à ses dettes jusqu'à leur règlement. Il a ajouté que si le défunt n'a laissé aucune succession ou un patrimoine insuffisant pour couvrir les dettes, les héritiers ne sont pas tenus de les payer sur leurs propres biens, mais cela leur est recommandé, car le défunt reste grevé par la dette et il est contraire à la piété filiale qu'un fils laisse son père dans une telle situation. Il a été précisé que tous les enfants peuvent contribuer et coopérer au règlement des dettes de leur père, même par versements échelonnés en fonction de leurs moyens."
  tr: "Borçlu ölen ve para bırakmayan biri hakkında bir soruya Ürdün Genel Fetva Dairesi, borçların miras bölünmeden önce ödendiğini yanıtladı. Eğer miras bir miras değilse veya yeterli değilse, varisler servetlerinden ödeme yapmak zorunda değildir, ancak bu onlar için tavsiye edilir. Daire, birisi borç gibi haklarla ölürse, varsa mirastan ödeme yapıldığını ve borç ödemesinin miras hakkından öncelikli olduğunu belirtti. Bunu, Hasan al-Tirmidi'nin bir hadisine dayanarak, müminin ruhunun borcuna bağlı olduğu ve borcun kendisine takıldığı sürece bağlı olduğu belirtildi. Eğer ölen kişi miras bırakmazsa veya borçlarını karşılayamayacak para bırakırsa, varislerin servetlerinden ödeme yapmak zorunda olmadığını, ancak bunun tavsiye edildiğini çünkü merhumun borcunun borçla meşgul kaldığını ve çocuğun babasının borcunu meşgul etmesinin doğru olmadığını belirtti. Tüm çocukların babalarının adına hizmet etmeye katkıda bulunabileceğini ve bu konuda, yeteneklerine göre taksitler halinde bile olsa, iş birliği yapabileceğini ekledi."
  id: "Sebuah pertanyaan tentang seseorang yang meninggal dengan utang dan tidak meninggalkan uang, Departemen Fatwa Umum Yordania menjawab bahwa utang diselesaikan dari harta sebelum dibagi. Jika bukan harta atau tidak cukup, ahli waris tidak wajib membayar dari kekayaannya, tetapi disarankan untuk mereka. Departemen menjawab bahwa jika seseorang meninggal dengan hak atas orang seperti utang, maka harus membayar dari harta warisannya sebelum dibagi jika memiliki uang, dan pelunasan utang lebih diutamakan daripada hak waris ahli waris. Itu didasarkan pada hadits Hasan al-Tirmidhi bahwa jiwa orang beriman bergantung pada utangnya sampai utang itu lunas padanya. Dikatakan bahwa jika almarhum tidak meninggalkan harta atau meninggalkan uang yang tidak dapat menutupi utang, ahli waris tidak wajib membayar dari kekayaan mereka, tetapi disarankan untuk mereka karena kewajiban almarhum masih sibuk dengan utang, dan tidak benar bagi anak untuk menjaga utang ayahnya tetap terpenuhi. Ia menambahkan bahwa semua anak dapat berkontribusi untuk memenuhi kepentingan ayah mereka dan bekerja sama dalam hal itu, bahkan jika dalam cicilan sesuai kemampuan mereka."
